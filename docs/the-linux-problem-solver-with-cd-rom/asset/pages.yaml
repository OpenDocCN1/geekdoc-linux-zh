- pgno: 205
  md: 'them as modules. Another possible explanation is that you don’t have the hardware
    properly installed. Make sure the SCSI bus terminates properly, the cables are
    secure, and the SCSI host adapter’s BIOS recognizes the drive on boot-up.


    # PROBLEM 95


    **Symptom:** No matter what you do with the tape, its position resets after every
    access.


    **Problem:** You’re using the rewind tape device. Each time a command accessing
    a rewind device completes, the driver instructs the tape to rewind.


    **Fix:** Use the no-rewind tape device. The so-called rewind tape devices have
    names without any prefix, like /dev/st0; the no-rewind device corresponding to
    /dev/st0, for example, is /dev/nst0. Remember that the devices don’t depend on
    the names—these are only a convention.


    # Tape Layout


    Tape format is simply a long string of files with file markers between them. You
    can envision the tape as follows:


    ![](img/8131acdd754b0d26c380a2035b509e34_205_0.png)


    When placed at the end of a file marker, the tape head points to the first block
    of the file after the marker. Writing a file to the tape inserts a new file marker
    after the file, and—assuming you’re using the no-rewind device—the tape head goes
    to the end of the marker after a write, ready to write a new file.


    When moving the tape around, you can position the tape so the head is at the beginning
    or end of a file marker. Usually you’ll want it at the end of the marker so you
    can read or write the next file.


    Since tapes are sequential, it doesn’t make sense to write an item to the middle
    of a tape that contains valuable data later on. Tape files can be arbitrarily
    long, and there’s no way of discerning their structure on the tape.'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'Most tape utilities use the TAPE environment variable for storing the device
    filename (as in /dev/nst0). If you’ve only got one tape drive, you should set
    this variable in root’s start-up scripts.


    # mt


    The mt utility moves the tape head position, puts markers in place, and so on.
    Assuming that you have the TAPE variable set to a valid device, you can put a
    blank tape in your drive and, after the access light goes off (this could take
    a while), input the following code:


    ```

    # mt status

    ```


    You’ll get a response like this:


    ```

    drive type = Generic SCSI-2 tape

    drive status = 1024

    sense key error = 0

    residue count = 0

    file number = 0

    block number = 0

    Tape block size 1024 bytes. Density code 0x0 (default).

    Soft error count since last status=0

    General status bits on (41010000):

    BOT ONLINE IM REP EN

    ```


    Probably the most important part of this message is the file number. In the above
    example, this is 0 since you’re at the beginning of the tape. A block number of
    0 means you haven’t done any reads or writes to this file yet. Figure 8-2 shows
    how a blank tape looks in our simplified view.


    ![](img/8131acdd754b0d26c380a2035b509e34_206_0.png)


    Figure 8-2: A blank tape in a tape drive—the triangle at the bottom left represents
    the tape head


    # Putting a File on Tape


    Let’s jump right to putting a file on the tape:


    ```

    # cd /

    # tar cvvp bin

    ```


    (See the tar section below for an explanation of the different tar commands.)
    This places the contents of /bin after the first file marker on the tape.'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'When you run another mt status, you''ll see that the tape position has advanced
    to 1. Go ahead and put another archive on the tape (we''ll use it in later examples):


    ```

    # tar cvvp lib

    ```


    # Reading from the Tape


    Now practice reading back from the tape (for a list of mt commands, see the mt
    man pages). Run the following:


    ```

    # mt rewind

    ```


    ```

    # tar tvf

    ```


    If the tape drive is working properly, you''ll get a list of files in the /bin
    archive. tar''s t option doesn''t actually extract anything, but rather goes over
    the entire archive and makes sure that there are no errors on the tape.


    > Note, however, that an mt status yields a response like this for the file number
    and block number:


    ```

    file number = 0

    block number = 72870

    ```


    After a read access, the tape does not advance to the end of the next file marker,
    but rather places you at the beginning, as shown in Figure 8-3.


    To get to the next file, tell the tape head to advance to the end of the file
    marker (Figure 8-4 shows the result of this command):


    ```

    # mt fsf

    ```


    ![](img/8131acdd754b0d26c380a2035b509e34_207_0.png)


    Figure 8-3: Note the position of the tape head


    ![](img/8131acdd754b0d26c380a2035b509e34_207_1.png)


    Figure 8-4: The tape head at the end of the file marker'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# Extracting a File from the Tape


    Let''s extract from the archive at our present position. We''ll extract the files
    into /tmp:


    ```

    # cd /tmp

    # tar xvv

    ```


    The output looks the same as before (with the t option), but this time the contents
    of the /lib archive (remember, that''s the second one we put on the tape) go into
    /tmp/lib.


    To move around on the tape, rewind it to the beginning and use mt to move the
    tape forward again, as in this example:


    ```

    # mt rewind

    # mt fsf

    ```


    mt fsf moves the tape forward one file marker (in this case, to the /lib archive).


    # PROBLEM 96


    Symptom: Using mt bsf (back a file marker) doesn''t take you to the right file.


    Problem: mt bsf doesn''t do what you think it should when you place the head at
    the end of a file marker.


    Fix: Let''s say you''re using a tape, and you''re right at file position 2—that
    is, mt status shows this information:


    file number = 2

    block number = 0


    If you run mt bsf and then mt status, you''ll get this:


    file number = 1

    block number = -1


    The head has hardly moved at all; it''s only moved to the beginning of the file
    marker (that is, at the end of file 1, hence the -1 as a block number). Another
    mt bsf takes you to the end of file 0. To get to file 1, you need to use mt fsf.


    If this sounds confusing, you may want to consider using mt rewind, then mt fsf
    n to get to the nth file.'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'When you''re finished with a tape, you can use mt offline to rewind the tape,
    take it offline, and eject it (if possible).


    Relevant man pages: mt (1)


    # tar


    We''ve already demonstrated the three basic main modes of tar: for creating, extracting,
    and testing archives. To make tar work, you must put it into a mode. You may specify
    the modes and modifying options together; in the examples above, we''ve used the
    v option twice (vv) to get an extra-verbose listing of the files involved. The
    three mode options mentioned so far are c for create, t for test, and x for extract.
    Important modifying options include these:


    +   - **f** The file name of the device or archive follows. When you use this
    option, the next argument must be the file name. Use a hyphen (-) to indicate
    standard output, as in this example:

    +     `$ zcat foo.tar.gz | tar tvf -`


    +   - **v** Be verbose; show more information about the files in the archive.
    If you give this option twice, you''ll get a listing similar to that of ls -l.


    +   - **p** Preserve permissions when extracting, overriding any permissions mask
    (set with umask).


    +   - **z** Use GNU zip compression. New archives (when tar is used with the c
    option) run through gzip -c first; extractions and tests (tar''s x and t options)
    use gzip -dc.


    > NOTE There is nothing special about a tar archive. You can put any file on the
    tape; for example, if you wanted to put /etc/services at the current place on
    the tape, you''d run:


    ```

    # dd if=/etc/services of=$TAPE

    ```


    Relevant man page: tar (1)


    # dd


    One of the hidden treasures of Unix is a program called dd. It stands for convert
    and copy. dd differs from cat in that dd knows a bunch of obscure data coding
    formats as well as tricks on buffering and regulation of I/O flow. If you need
    to use your tape drive, disk, or other block device for some task that''s a little
    out of the ordinary, dd is the first command you should look at, because it knows
    how to deal with the fixed-length chunks of data that block devices want. dd also
    works on plain files, but the block size specification is irrelevant in this case
    (other than for a few special tricks).'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'To see what dd can do on a device, try this:


    ```

    $ dd if=/dev/zero bs=1k count=6 > /tmp/foo

    ```


    While not terribly useful in itself, this command does demonstrate dd’s option
    structure. This example is as straightforward as it looks: It takes 1-kilobyte
    blocks of input from /dev/zero (with standard output, the default) into /tmp/foo
    six times.


    dd’s size options are normally specified in bytes, but you can modify this with
    k (1024 bytes), b (512 bytes), w (2 bytes), and a few other choices described
    in the info and manual pages. The most important options are:


    # bs=n, ibs=n, obs=n


    Set block sizes to n. Since there are two block sizes (one for input and one for
    output), there are three options: bs sets both, ibs sets the input block size,
    and obs sets the output block size. The default is 512 bytes.


    # count=n


    Read a maximum of n blocks.


    # if=name, of=name


    Set the input and output files (the defaults are standard input and output).


    # conv=method


    This option is mostly for conversion of non-Unix formats. For example, it can
    convert EBCDIC to ASCII and back (with the ascii and ebcdic methods). See the
    info page for more details.


    Like a number of GNU versions utilities that come with Linux, dd has expanded
    beyond the versions that come with other Unix variants; the manual page doesn’t
    list all of the options because GNU wants you to use info documentation. However,
    dd --help does offer a quick summary.


    # cpio


    From time to time, you may encounter a cpio archive. This format (or rather, collection
    of formats) is common on tapes coming from systems such as HPUX and Stardent Titans.
    The following section covers what you need to know to extract a cpio archive.


    cpio has modes, much like tar: extract mode (initiated with -i), create mode (-o),
    and a pass-through mode (-p) for copying files. Testing an archive is part of
    the extract mode, and you would input the following:


    ```

    $ cpio -i -t -I archive

    ```'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'where archive is the name of the cpio archive (it can be a tape drive). To
    extract the archive, run this:


    ```

    $ cpio -i -d -I archive filename(s)

    ```


    Here, filename(s) is optional; this instructs cpio to extract only items matching
    those names. The -d option creates directories as needed (tar does this automatically).
    Although GNU cpio tries to detect formats automatically, you may also need one
    of these options after the -i:


    # -b


    The default format for cpio depends on the byte order of the machine''s architecture.
    This option swaps the byte order.


    # -C n


    Use n as the block size of the archive.


    # -H name


    Use name for the type (format) of cpio archive. Options directly relevant to old
    cpio archives are bin, crc, hpb in, hpoc, newc, odc, tar, and ustar. Note that
    these are for the GNU version of cpio; other versions (such as the one that comes
    with BSD systems) don''t support as many archive types, and they use different
    names.


    # -v


    Verbose (somewhat like tar''s verbose setting).

    Relevant man page: cpio (1)


    # dump and restore


    Alternatives to tar, the dump and restore programs come from older Unix utilities
    that backed up filesystems by looking at their internal structure on the disk
    (unlike tar and cpio, which use only information from the kernel''s filesystem
    interface). These programs come with a number of Linux distributions, and though
    they don''t work quite the same way as traditional dump and restore programs,
    they do share the same file format, so you can use them across platforms.


    # Interactive restore


    You can use restore in automatic and interactive modes. The interactive mode is
    more popular:


    ```

    # restore ivf filename

    ```'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'where filename is the name of the archive (either a device or a file). The
    command line above grabs the index information from the front of the archive and
    throws a new command prompt at you:


    restore >


    At this prompt, you can run cd, ls, and pwd commands (help offers a short summary).
    As you navigate the filesystem, use the add command to add a file or directory
    to the list of files and directories you would like to restore. When you add an
    item to an extract list, an asterisk (*) appears next to it, and if you choose
    a directory, restore instantly creates it (along with all of its subdirectories).


    When you’re finished selecting files, use the extract command to proceed with
    the actual restoration of the files. restore asks for a volume; just give it 1,
    since you probably have only a single-volume archive. It also asks if you wish
    to set the owner and mode for the . directory. If you say yes to this, the current
    directory will have the same permissions as the mount point of the original archive.
    If you’re restoring into a different place from the original file location, you
    probably want to say no to this.


    # Automatic restore


    To do an automatic restore, run this:


    ```

    # restore rvf $TAPE file1 file2 ..

    ```


    where file1 file2 .. specify what to restore. If you omit them, you’ll restore
    the entire archive.


    # dump


    To back up (dump) a directory, use a command like this:


    ```

    # dump -0 -f filename fs|directory

    ```


    The 0 means it’s a full level 0 dump, filename is the device or file in which
    to store the archive, and fs or directory is the filesystem or directory to back
    up. In addition to this information, you may need to provide the -d n and -s n
    options to specify the density and length of your tape.


    We don’t recommend using dump for backups. It’s not flexible enough, especially
    when you’re backing up multiple disks. GNU tar works fine and addresses the traditional
    arguments against using tar: GNU tar supports single filesystem backups, multiple
    volumes, and special/sparse files.


    # 8.4 Automated Backups with Amanda


    Manual backups can be a pain. You can automate the process somewhat by setting
    a cron job to back up some stuff every night, but it’s difficult to come'
