- pgno: 93
  md: "This section talks about SAMBA server basics. SAMBA is a remarkably complete\
    \ package for talking to Windows machines with NetBIOS running over TCP/IP. This\
    \ large package contains support for all sorts of services like network logins\
    \ and login path mappings, but we’ll stick to printing and fileshar­ing for starters.\
    \ You’ll find a fairly good reference to all of the options in the online documentation\
    \ at http://www.samba.org/ (as well as in the manual pages).\n\n# SMB Shares and\
    \ NetBIOS\n\nWe could write quite a lot about how SMB shares over NetBIOS are\
    \ supposed to work, but the basic idea is that you associate server names with\
    \ IP addresses and a service path name. Here’s an example SMB share name:\n\n\
    ```\nPRINTSERVER\\MYPRINTER\n```\n\nThese shares may have a password, and they\
    \ may also be browseable, meaning that you can use Windows’ Network Neighborhood\
    \ to look through shared services.\n\n# SAMBA Daemons\n\nThe two main daemons\
    \ in SAMBA are nmbd and smbd. nmbd is a NetBIOS name server, and smbd provides\
    \ SMB server functions. There is one main configuration file called smb.conf,\
    \ which looks like a PC file. Here is a very simple example:\n\n```\n[global]\n\
    \    guest account = nobody\n    invalid users = root\n    browseable = yes\n\
    \    workgroup = HOME\n    socket options = TCP_NODELAY\n    security = share\n\
    \n[homes]\n    comment = Home Directories\n    writeable = false\n    guest ok\
    \ = false\n    path = /home/%S\n\n[printers]\n    guest ok = true\n    guest only\
    \ = true\n    printable = true\n    path = /tmp\n```"
  merge: -1
  img_proc: true
- pgno: 94
  md: 'This configuration file sets up some standard SMB services, including read-only
    home directories and printers for smbd''s use.


    There are three sections in the example smb.conf file above: [global], [homes],
    and [printers]. These three are called special sections. The purpose of the [global]
    section is to set defaults for the rest of the file; [homes] and [printers] control
    access to home directories and printers.


    Here are some of the [global] section parameters you should be aware of. You can
    override most of them in individual sections.


    guest account = username


    username should be an unprivileged user who can''t do much (other than print and
    access public directories). The default is nobody.


    browseable = true|false


    If set to true, remote hosts can access a list of SMB shares.


    security = type


    Set the type of access control. The default value is user, which only allows registered
    logins to access the server. Other options are share (appropriate for public servers),
    server, and domain. (See Problem 35 about encrypted passwords later in this chapter
    for information on why you may not be able to log in to the SAMBA server from
    a Windows machine.)


    netbios name = name


    Make the server known as name on the network instead of by the Unix host name.


    While the example smb.conf file specifies that the SAMBA server should belong
    to the HOME workgroup, it doesn''t say anything about how the machines around
    it will identify the SAMBA server. The server is not running any browse masters,
    so if it shows up in any Network Neighborhood browsers, a Windows machine on the
    network is probably acting as browse master.


    To begin working with SAMBA, start with a simple smb.conf file, like the above
    example. After you''ve got a file that at least allows you to list the shares
    available on the server (with smbclient -L servername), start tailoring smb.conf
    to your own needs.


    Start the SAMBA daemons with


    # nmbd -D -s configfile

    # smbd -D -s configfile


    where configfile is the full path name to your smb.conf file.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# Debugging


    You’ll find debugging information in log files named log.nmb and log.smb, in whatever
    directory you configured to store SAMBA’s var (the default is prefix/var, where
    prefix is the installation prefix).


    # PROBLEM 32


    Symptom: Too little or too much access control.


    Problem: Confusion as to what security you need.


    Fix: If you’re just starting out, use security=share, which asks the client for
    a password once per connection to a share. The default [security=user] requires
    a login to the SAMBA server [we won’t discuss this]. The security=server setting
    tries to pass the login to a different server, while security=domain says SAMBA
    should act like it’s on a real Windows NT network (that is, it should ask the
    Windows NT primary domain controller if the client has access). You’ll find details
    of each setting in the smb.conf (5) manual page.


    # Workgroup and Network Browser Options


    To use the Network Neighborhood browser on a Windows machine, you must run a browse
    server of some sort on a networked machine. This server collects a list of SMB
    servers on the network and gives the list to clients that ask for it. There are
    two ways to do this: with a Windows workgroup or with a Windows NT domain.


    # Browse Servers


    If you’d like the Network Neighborhood to function and you have no Windows machines
    on your network, you need to set up SAMBA as a browse server. As with most SAMBA
    options, you’ll find the configuration in the smb.conf file. Note that if you
    want to set up browsing for a Windows NT domain, you can set it up in the same
    manner as a workgroup. However, to make your Windows NT logins and passwords the
    same as on your Unix network, you’ll need to set up SAMBA as a domain master.
    That subject goes beyond the scope of this book, however.


    When running browse servers, you’ll use a combination of domain master and local
    master browsers. Each workgroup needs one domain master, and if you have multiple
    subnets you’ll need a local master on each subnet outside the domain master.'
  merge: -1
  img_proc: true
- pgno: 96
  md: "The most relevant smb.conf options for browse servers are these:\n\n```\nworkgroup\
    \ = name\n```\n\nSet the workgroup to name.\n\n```\ndomain master = true|false|auto\n\
    ```\n\nSetting domain master to true makes nmbd (the NetBIOS name server) attempt\
    \ to become the domain browse master for your workgroup. If another service has\
    \ already claimed itself as the master, nmbd won’t attempt to run a master browser.\
    \ If you start up nmbd with this option by mistake prior to starting a Windows\
    \ NT Primary Domain Controller with the same NT domain name as your workgroup,\
    \ you may have browsing problems (machines missing from the Network Neighborhood\
    \ browser, unusually slow response).\n\n```\nlocal master = true|false\n```\n\n\
    This parameter, when set to true, asks nmbd to attempt to become the local master\
    \ for a subnet. If you want to use this parameter, take a look at the WINS server\
    \ parameters as well (wins server and wins support); you may need to set up a\
    \ WINS server on your domain master browser and make the local browsers point\
    \ to it.\n\n# PROBLEM 33\n\n> Symptom: Although you want nmbd to become the local\
    \ master browser on your subnet, another machine seems to be filling that role,\
    \ so the host mappings you set up in the lmhosts file aren’t showing up in network\
    \ browsers.\n> \n> Problem: Your nmbd loses a local master browser election with\
    \ a Windows machine.\n> \n> Fix: Use the OS level parameter in smb.conf. If you\
    \ specify OS level = 65, you’ll defeat an NT server every time. This can come\
    \ in useful if you’re dealing with a bunch of machines you don’t control and their\
    \ users have a bad habit of turning all the services on.\n\n# Name Resolution\
    \ and the lmhosts File\n\nlmhosts is a simple file that maps IP addresses to NetBIOS\
    \ names. It looks like this:\n\n```\n10.1.1.37 CRUMMYNTBOX\n10.1.1.4 SPIFFYLINUX\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 97
  md: 'SAMBA uses lmhosts for direct name lookups so it doesn''t have to waste time
    asking for IP addresses over the network. By default, SAMBA first looks in lmhosts
    for the IP address. If it doesn''t find what it wants in lmhosts, it performs
    standard host resolution (using whatever is set in /etc/nsswitch.conf—usually
    /etc/hosts and DNS, in that order). The next method SAMBA tries is WINS (see the
    WINS section below). If all of these fail, it broadcasts the request all over
    the subnet.


    To change this default behavior, set the name resolve order parameter. For example,
    if you only want it to search with lmhosts and WINS, and not broadcast or use
    standard Internet host lookups, use this:


    ```

    name resolve order = lmhosts wins

    ```


    (The parameter values for broadcast and standard host lookups are bcast and host.)


    # NOTE


    By default, the lmhosts file is in the etc directory of your SAMBA installation.
    You can use the -H file option to nmbd to set the location, but as of this writing
    there is no equivalent option for smbclient. If you''re planning to put lmhosts
    in a location other than the default, put a symbolic link to that place in its
    default location. Otherwise, you may run into difficulty when you''re debugging.


    # WINS


    Due to shortcomings in NetBIOS, you''ll need a WINS server to resolve host names
    from one subnet to another (if you have more than one subnet, that is). This server
    is like a DNS server, but it''s limited to small NetBIOS-style names, and you
    should use it only with a local Windows network. You should have just one WINS
    server for all of your subnets. These are the smb.conf parameters relating to
    WINS:


    ```

    wins server = name|ip

    ```


    name or ip is a WINS server. If SAMBA needs to look up a name with WINS, it queries
    this server.


    ```

    wins support = true|false

    ```


    This parameter causes nmbd to act as a WINS server.


    ```

    dns proxy = yes|no

    ```


    If you set this parameter to yes, nmbd attempts to look up unknown NetBIOS names
    over DNS when nmbd acts as a WINS server.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# More Access Control Options


    Sometimes you need better control over who has access to a share. Most of the
    following parameters are set on a per-share basis—that is, you normally specify
    them in sections other than [global].


    ```

    allow hosts = list

    ```


    This parameter allows connections to list. The format resembles that of /etc/hosts.allow
    (see Chapter 2 and the hosts_access(5) manual page). Here is an example:


    ```

    allow hosts = @goodguys, 10.1.1.0/255.255.255.0 EXCEPT 10.1.1.37

    ```


    @goodguys is an NIS netgroup.


    ```

    deny hosts = list

    ```


    This parameter rejects connections from list.


    # PROBLEM 34


    Symptom: Although you used deny hosts, an undesired host still seems to have access.

    Problem: allow hosts has the final word on specifically allowed hosts.

    Fix: Use the EXCEPT keyword in the allow hosts setting.


    ```

    available = yes|no

    ```


    A no setting disables the share.


    ```

    guest ok = yes|no

    ```


    A value of yes allows access to the share as a guest (that is, no password is
    required for access).


    ```

    guest only = yes|no

    ```'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'This denies users access; you specify it as list of users, @group (which expands
    to a netgroup or group), +group (expands only to a group), or &group (netgroup
    only). Keeping root out is a good idea.


    ```

    valid users = list

    ```


    Only list may access the share. The format is the same as that of the invalid
    users parameter above.


    # PROBLEM 35


    Symptom: Guest logins work, but user logins don’t.

    Problem: Windows NT Service Pack 3, Windows 98, and later versions enforce encrypted
    passwords.

    Fix: You have two choices: Tell SAMBA to recognize encrypted passwords, or make
    Windows send clear-text passwords by altering the Registry. For encrypted passwords,
    set the following in smb.conf:


    ```

    encrypt passwords = yes

    ```


    Get the mksmbpasswd.sh file that’s in the SAMBA distribution and run it on your
    passwd file. Put the result of mksmbpasswd.sh into prefix/private/smbpasswd [prefix
    is your SAMBA installation prefix], then run the following:


    ```

    # chmod go -rwx prefix/private/smbpasswd

    ```


    You should probably put this in a cron job to ensure that the password information
    gets updated on a regular basis [see Chapter 1 for more information on cron].

    The other fix is to change the Windows Registry to make it accept clear-text passwords.
    This is generally not a good idea, but if you wish to do so, have a look at the
    SAMBA FAQ under the heading “Windows 98 Passwords.”


    # Printing


    The [printers] section of smf.conf is straightforward. The following is a sample
    section that works on many systems:


    ```

    [printers]

    comment = Network Printers

    browseable = true

    ```'
  merge: -1
  img_proc: true
- pgno: 100
  md: '```

    printable = true

    guest ok = true

    guest only = true

    path = /tmp


    printing = BSD

    load printers = yes

    print command = /usr/bin/lpr -r -P%P %s

    lpq command = /usr/bin/lpq -P%P

    lprm command = /usr/bin/lprm -P%P %j

    printcap name = /etc/printcap

    ```


    The first six lines after [printers] describe general access control. The browseable
    parameter allows clients to browse the list of printers. The lines containing
    guest specify that the users should only print files as guests. path specifies
    a place for temporary files (when you issue a print request, it goes to this location
    before going to the printer). Using /tmp makes it easier to debug problems (for
    example, if lpd requests fail and pile up). In any case, you should specify a
    place where your anonymous user (usually the default, nobody) can write.


    The second set of lines in the example above illustrates how SAMBA handles print
    commands. The commands are the default values with the printing = BSD setting.
    If you''re using LPRng (which we recommend), change BSD to LPRNG. LPRng commands
    work like their BSD counterparts, but the output from lpq is different (see the
    problem below for information on what happens in this case).


    The printer list in this example comes straight out of /etc/printcap (using the
    printcap name parameter in the last line). This is usually appropriate, but you
    may wish to limit the list of printers. Copy your existing /etc/printcap file,
    cut out any unwanted printers in the copy, and set printcap name to this newly
    modified file.


    # PROBLEM 36


    Symptoms: The printer queue doesn''t show up on the Windows client. Temporary
    files beginning with lpd pile up.

    Problem: SAMBA doesn''t parse lpq output correctly.

    Fix: Make sure you have the lpq command set to the correct syntax, and verify
    the printing parameter value. Linux has three main possible values: LPRNG, PLP,
    and BSD. The manual pages for the print utilities (lpr, lpd, and so forth) should
    say which one of these print spoolers you have installed on your system.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# PROBLEM 37


    Symptoms: After a while, several files named lpd.* appear in /tmp (or whatever
    you have path set to).


    Problem: Sometimes SAMBA doesn''t clean up after itself.


    Fix: From time to time, the queue checker may malfunction and drop a file. You
    should keep a cron job around to run a find and get rid of any of these old files.
    For example, if smb.conf specifies path = /tmp, put this command in the system
    crontab:


    ```

    find /tmp -name ''lpq.*'' -ctime 1 -exec rm ''{}'' '';'' > /dev/null 2>&1

    ```


    # PROBLEM 38


    Symptoms: Print jobs get mangled or fail. PostScript source prints as text.


    Problem: Garbage appears at the beginning of print jobs.


    Fix: Some Windows print drivers put a ^D in front of the job in an attempt to
    clear printer memory. But in the case of a Unix print queue, if the first two
    characters of the job are not %!, the print filter may get confused. First try
    adding


    ```

    postscript = yes

    ```


    to your smb.conf file. This does not get rid of the ^D, but rather sends a %!
    before every job. This may not be appropriate for your printer—in that case you''ll
    want to come up with another filter that looks at the first character before it
    sends any job to the printer.


    # Single Printer Sections


    For a single printer outside the [printers] section, add a section such as the
    following:


    ```

    [myprinter]

    guest ok = true

    guest only = true

    printable = yes

    ```'
  merge: -1
  img_proc: true
- pgno: 102
  md: '```

    print command = send_job_command -Pmyprinter %s

    lpq command = /usr/bin/lpq -Pmyprinter

    lpm command = /usr/bin/lprm -Pmyprinter %j

    path = /tmp

    ```


    Here, whatever you specify as send_job_command sends jobs to the printer. You
    may want to do this in order to bypass a print filter or add a different filter.
    Relevant man pages: lpr (1), lpq (1), lprm (1), lpd (8)


    # Filesharing


    You can export directories to Windows clients in SAMBA''s smb.conf file in two
    ways. One is with a regular section, and the other involves the special [homes]
    section. Here is a very simple single-path share in a regular section:


    ```

    [projects]

    path = /stage/projects

    valid users = +staff

    writeable = yes

    ```


    Here, we''re allowing read-write access to /stage/projects for the users in the
    group staff. To use /stage/projects as a network drive on a Windows machine, you
    can enter the following at an MS-DOS command prompt:


    ```

    net use g: \\SERVER\PROJECTS /user:username

    ```


    Here, SERVER is the NetBIOS name of the SAMBA server and username is a user in
    the group staff. We''re also assuming that g: isn''t currently in use. Similarly,
    you can attach a network drive by right-clicking on the My Computer icon on a
    Windows machine, then selecting Map Network Drive on the menu.


    # Name Alterations


    Because of the limitations of DOS-style file names, SAMBA presents file names
    differently than they actually appear in the Unix filesystem. By no coincidence,
    SAMBA calls this name mangling. You end up with a name like XINIT~3L.193 because
    Windows can''t handle a really long name.'
  merge: -1
  img_proc: true
- pgno: 103
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 104
  md: 'There are two ways to ask for a home directory from a SAMBA server. The first
    is explicit, as in this DOS command:


    ```

    net use g: \\SERVER\username1 /user:username2

    ```


    When you make this request, the SAMBA server on SERVER first looks at the username1
    part of \\SERVER\username1 as it normally would in any other section in smb.conf.
    If username1 matches any other section, this matching section is used. However,
    if it does not match and there is a [homes] section, SAMBA makes one more attempt
    before returning an error: It looks up the home directory of username1, which
    becomes the share if that username1 is a user on the SAMBA server. username2 is
    the Linux user to connect as (usually the same as username1).


    The other way to ask for a home directory share is implicit:


    ```

    net use g: \\SERVER\homes /user:username

    ```


    Here, you’re telling SAMBA straight away that you want your home directory and
    that your login is username. A fairly safe example for a [homes] section is:


    ```

    [homes]

    guest ok = no

    browseable = no

    ```


    It’s up to you whether you want users to be able to write to the directories (using
    the writable parameter). The file permissions go down to the underlying Unix filesystem
    on the SAMBA server; the SMB client can only write to the files and directories
    that the connecting user can write to.


    Once you look at a user’s share, it shows up in the shares list. If you don’t
    like the way the [homes] section works, you can set up a simpler one, like this:


    ```

    [u]

    guest ok = no

    path = /home/%u

    ```


    Any access to \\SERVER\%u results in the home directory of the account used to
    connect (this example assumes that all of your home directories are in /home).


    # SAMBA Clients


    SAMBA comes with a program called smbclient. It’s useful for occasional remote
    access purposes, as well as for debugging your own SAMBA server’s smb.conf file.
    Use it as follows:


    ```

    $ smbclient ''\\SERVER\share''

    ```'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'You can employ -U user to change the user (the default is your log-in name).
    It asks you for a password unless you specify the -P passwd option. If you''re
    trying to access a guest share, you can specify an empty password or just press
    ENTER at the password prompt. Upon success, smbclient gives you a prompt like
    this:


    ```

    Domain=[MYWRKGRP] OS=[Unix] Server=[Samba 2.0.6]

    smb: \>

    ```


    From there, you can use commands similar to ftp''s put, mput, get, mget, and so
    on. Use help to get a full list.


    If you want to use shares on Windows machines on a regular basis, you should consider
    the SMB filesystem available in the Linux kernel. To use it, first get your kernel
    to support smbfs by either compiling it into the kernel or building and loading
    it as a module (the latter option is preferable—see Chapter 7). Then look in your
    SAMBA package for an smbmount program that combines the smbclient and mount programs:


    ```

    # smbmount ''\\SERVER\SHARE'' -c ''mount /mnt'' -U user -P password

    ```


    Relevant man pages: smbclient (1), smbmount (8)


    # 4.3 Netatalk


    To get your Linux machine to speak AppleTalk, you need two things: kernel support
    for AppleTalk low-level protocols, and the server programs that provide services
    (such as filesharing and printing) to clients. AppleTalk has a number of low-level
    protocols (transport mechanisms), but the most common on local networks is DDP
    running over Ethernet. There''s a kernel configuration option for this under "Networking
    options"; it''s called AppleTalk DDP, and you should configure it as a module
    as described in Chapter 7.


    The Netatalk package deals with the services. Its main facilities are file-sharing
    and printing for servers and clients, but it also includes a few utilities for
    looking up names and converting Macintosh-style files. The original Netatalk package
    has not been modified for some time, but a new version with many enhancements
    called Netatalk-asun is now available. This book assumes you have the enhanced
    package. In addition to the version on the included CD-ROM in support/atalksamba,
    you''ll find it (at least at the time we wrote this book) at ftp://ftp.u.washington.edu/public/asun/.


    Unfortunately, Netatalk''s included documentation is on the skinny side; the manual
    pages only describe command-line options, with very little description of configuration
    files.


    After you''ve built the AppleTalk kernel module (appletalk.o), use insmod on it.
    The kernel generates a message such as this:


    ```

    NET4: AppleTalk 0.18 for Linux NET4.0

    ```'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'Now let''s turn to the core daemon of the Netatalk package, atalkd, which handles
    basic AppleTalk communications services such as name lookups and service registration.
    atalk''s configuration file is atalkd.conf, which usually consists of just the
    interface name, as in this one for Linux Ethernet drivers:


    ```

    eth0

    ```


    The atalkd.conf file included with the Netatalk distribution has a large section
    of comments outlining options for complex installations. The atalk (8) manual
    page details these options. The most significant is the -zone option to set the
    default AppleTalk zone.


    # PROBLEM 40


    **Symptom:** Your changes don''t seem to take effect.

    **Problem:** atalkd can''t find its atalkd.conf configuration file.

    **Fix:** If you don''t know where atalkd expects to find atalkd.conf, start it
    with


    ```

    # atalkd -f fullpath

    ```


    where fullpath is the full pathname of the configuration file, such as


    ```

    /usr/local/etc/atalk.conf.

    ```


    atalkd takes some time to start, so if you''re putting it in a boot script, you
    should place the whole AppleTalk start-up in the background—you''re not likely
    to miss it when it comes up just after your machine boots.


    Start up a test atalk like this (remember to run insmod appletalk.o first):


    ```

    # atalk

    # nbprgstr -p 4 hostname:Workstation

    # nbprgstr -p 4 hostname:netatalk

    ```


    where hostname is the name of your machine. Verify that atalkd is running with
    a process listing. If it''s running, try this:


    ```

    $ nbplkup

    ```


    If atalkd is functioning properly, you should get a listing like this:


    ```

    deskprint:LaserWriter      65280.166:128

    atlantic:AFPServer          65280.166:130

    ```'
  merge: -1
  img_proc: true
- pgno: 107
  md: '```

    atlantic: netatalk          65280.166:4

    atlantic: Workstation      65280.166:4

    fur: ARA - Client-Only     41201.173:2

    fur: Power Macintosh      41201.173:252

    fur: Workstation          41201.173:4

    ```


    This output comes from a network with only two machines that speak AppleTalk:
    atlantic and fur. In a name such as fur:Workstation, fur is the nbp object and
    Workstation is the nbp type. As the listing suggests, atlantic is a Linux machine
    running Netatalk, and is offering a filesharing service (that''s what the AFPServer
    part of the second line means). It''s also running a deskprint printer client
    for the printer. Notice that the dotted numbers in the second column are the same
    for the deskprint and atlantic lines. You might guess that fur is a Mac because
    it advertises itself as a Power Macintosh type on the next-to-last line.


    Netatalk provides a utility similar to ping called aecho, which uses the AppleTalk
    Echo Protocol to see if a remote host is alive. You may specify the remote host
    as an object:type pair, an object (the nbp type defaults to Workstation), or a
    number. That means all of the following do the same thing:


    ```

    $ aecho fur::Workstation

    $ aecho fur

    $ aecho 41201.173

    ```


    The response is very similar to a ping command:


    ```

    14 bytes from 41201.173: aep_seq=0. time=0. ms

    14 bytes from 41201.173: aep_seq=1. time=0. ms

    14 bytes from 41201.173: aep_seq=2. time=0. ms


    --41201.173 AEP Statistics--

    3 packets sent, 3 packets received, 0% packet loss

    round-trip (ms)  min/avg/max = 0/0/0

    ```


    You have to use CTRL-C to interrupt aecho.


    # Netatalk Startup Script


    The Netatalk distribution comes with a rc.atalk script that is a good start for
    writing a bootup script. It includes the NBP string initialization, as well as
    papd and afpd (AppleTalk printing and fileservice daemons; we''ll talk about those
    in Sections 4.3.1 and 4.3.2 below). On the included CD-ROM, you''ll also find
    a sample init.d script in support/atalk/samba. This script looks for configuration
    files before starting the AppleTalk daemons so that you can distribute it to a
    number of hosts.'
  merge: -1
  img_proc: true
- pgno: 108
  md: "# PROBLEM 41\n\nSymptom: Daemons and applications die with \"Unknown service\"\
    \ messages.\n\nProblem: Lines are missing from /etc/services.\n\nFix: Add the\
    \ following lines to /etc/services:\n\n```\nrtmp     1/ddp     # Routing Table\
    \ Maintenance Protocol\nnbp      2/ddp     # Name Binding Protocol\necho     4/ddp\
    \     # AppleTalk Echo Protocol\nzip      6/ddp     # Zone Information Protocol\n\
    ```\n\n# PROBLEM 42\n\nSymptom: Your AppleTalk boot script takes too long, so\
    \ your Linux machine takes forever to boot.\n\nProblem: atalkd and related daemons\
    \ take too long to start up.\n\nFix: Make your AppleTalk init.d script similar\
    \ to the following (where netatalk is your installation prefix):\n\n```\n( netatalk/atalkd\
    \ ;\n    netatalk/nbpstr hostname:Workstation ;\n    netatalk/nbpstr hostname:netatalk\
    \ ;\n    netatalk/afpd ;\n    netatalk/papd ) &\n```\n\nThere is one small disadvantage\
    \ to this approach: If any print jobs get caught in a queue for an AppleTalk printer\
    \ when the machine boots, the print filters will probably silently fail on the\
    \ print jobs and send them to the bitbucket because atalkd hasn't started up yet.\n\
    \nRelevant man pages: atalkd (8), nbplkup (1), nbp_name (3)"
  merge: -1
  img_proc: true
- pgno: 109
  md: '# Printing


    This section details the process of setting up a printer that''s already accessible
    from Unix for a Macintosh to use over the network. To go in the other direction
    (printing to an AppleTalk printer from Linux), have a look at Section 5.3.


    The papd daemon that waits for a print request from a Mac is an odd program; its
    default behavior assumes certain things about the lpd to which it sends print
    jobs. This book recommends LPRng as a print daemon. The default configuration
    files need some changes to allow papd to interact properly with LPRng''s lpd.


    papd has two configuration files: papd.conf and your system''s /etc/printcap file
    (described in Chapter 5). The papd.conf file has entries such as the following:


    ```

    printername:\n:pr=name_or_command:\n:pd=ppd_filename:\n:op=operator_username:

    ```


    printername is what the printer shows up as on the AppleTalk network; that is,
    how you see it in the Macintosh Chooser. A PPD file (PostScript Printer Description)
    specified with ppd_filename helps the Mac''s printer driver adapt to the printer.
    operator_username owns print jobs sent to printername. But the :pr=name_or_command:
    setting is the one you should pay most attention to when using LPRng''s lpd.


    Under the defaults (without a :pr=... setting), papd looks through /etc/printcap
    and tries to find the printer (specified by printername, as in the example above).
    If papd finds it upon receiving a print job, it looks for the printer''s spool
    directory parameter (specified with :sd=dir:), and attempts to insert the job
    directly into the spool directory at the correct queue position. If you''re running
    just the old Berkeley lpd, this might actually work. Usually it won''t, and you''ll
    wonder where the job went.


    Therefore, you should use a command to spool the job instead of relying on papd
    to do it all for you. You can accomplish this with the :pr=name_or_command: parameter
    in papd.conf. Here''s an example:


    ```

    printername:\n:pr=/usr/bin/lpr -Pprintername:\n..\n..

    ```


    where printername is the printer name in /etc/printcap. Using the :pr=|... parameter
    means you won''t be able to use any additional queuing features from the Mac side
    (such as canceling a job), but that''s better than not being able to print at
    all.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# Filesharing


    The Netatalk filesharing daemon, afpd, allows guest and user logins, as well as
    automatic access to user home directories. When a user accesses a directory from
    a Mac, a new afpd runs as that user on the Unix, meaning that the user has read
    and write privileges identical to those on their Unix account. afpd’s main configuration
    file is afpd.conf, but an AppleVolumes file allows you to control which directories
    (volumes) are available over AppleTalk (this setup is similar to the /etc/exports
    file on NFS servers).


    # PROBLEM 43


    Symptoms: No afpd options mentioned in this section seem to work. afpd.conf is
    ignored. Dancing icons appear under MacOS 8.


    Problem: You have Netatalk, not the enhanced Netatalk+asun package.


    Fix: Use Netatalk+asun (that is, until and if it merges with Netatalk). Obtain
    Netatalk+asun as mentioned above, or look in support/atalk/samba on this book’s
    CD-ROM. Among Netatalk+asun’s extra features is a TCP/IP AppleShare server.


    You don’t absolutely have to have an afpd.conf file, but the defaults aren’t terribly
    appealing for two reasons. First, guest access is turned on by default, so any
    visitor can access any volume other than a user one. The other reason is that
    you may want to use a server name other than the Linux host name and make it act
    like multiple servers.


    Here’s a relatively simple afpd.conf file:


    ```

    "Private AppleTalk Server" -noguest -nouservol

    "Public Software" -nocleartext -defaultvol /etc/AppleVolumes.public

    ```


    The first line sets up a server for users only, and the second sets up a guest-only
    server with volumes specified in /etc/AppleVolumes.public.'
  merge: -1
  img_proc: true
- pgno: 111
  md: "# PROBLEM 44\n\nSymptom: Some users cannot log in (but the systems administrators\
    \ can).\n\nProblem: The file /etc/shells doesn’t contain the users’ shells.\n\n\
    Fix: Just as with ftpd, a user must have a shell listed in /etc/shells to gain\
    \ access to an afpd volume. Either the shell isn’t listed there, or you’ve denied\
    \ the user access to the machine with an entry in /etc/passwd such as this one:\n\
    \n```\n+@normal_users::::::/usr/local/bin/noaccess\n```\n\nIf you add /usr/local/bin/noaccess\
    \ to /etc/shells, it may come into conflict with your desire to keep FTP users\
    \ off of the machine. If that concerns you, you’ll just have to turn ftpd off\
    \ or reconfigure it to your liking.\n\n# PROBLEM 45\n\nSymptom: You can’t have\
    \ more than five Macs accessing the Netatalk server simultaneously.\n\nProblem:\
    \ You have the compiled-in maximum connection limit set too low.\n\nFix: Start\
    \ afpd with -c num, where num is the maximum number of simultaneous connections\
    \ you want to allow.\n\n# afpd Options\n\nThese are the most important afpd options.\
    \ The full list is in the afpd (8) manual page.\n\n+   -C\tDon't allow clear-text\
    \ passwords.\n+   -c num\tAllow at most num connections at once.\n+   -d\tDebug\
    \ mode (don't run as a daemon; log to standard output).\n+   -f defvolfile\tUse\
    \ defvolfile as the AppleVolumes.default file.\n+   -G\tDon't let guests log in\
    \ (you can also set this on a per-server basis in the afpd.conf file).\n+   -g\
    \ username\tSet username as the guest user (default: nobody)."
  merge: -1
  img_proc: true
- pgno: 112
  md: '-n name Use name as the nbp name. The default is hostname: AFPServer, where
    hostname is the Linux host name. Chances are, though, if you want to do this,
    you should use the afpd.conf file.


    -s sysvolfile Use sysvolfile as the AppleVolumes.system file.


    # Quick Reference to Other afpd.conf Options


    -address addr Set the network address of the TCP server.


    -afskrb, -noafskrb Enable AFS Kerberos authentication (you''ll know if you need
    it).


    -authall, -noauthall Enable all authentication except randnum and rand2num.


    -ddp, -nodd p Run a DDP server.


    -cleartxt, -nocleartxt Enable clear-text passwords.


    -defaultvol file Set the AppleVolumes.default to file.


    -guest, -noguest Allow guest access.


    -guestname user Set the guest user to user.


    -krbiv, -nokrbiv Enable Kerberos IV authentication.


    -loginmsg text Display text upon access to a volume.


    -nlspath path Set Native Language Support path.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '+   -transall, -notransall

    +   Enable all transport mechanisms (at the moment there are two: TCP and DDP).

    +   -passwd, -nopasswd

    +   Enforce entering of passwords.

    +   -uampath path

    +   In the current implementation, this does nothing.

    +   -uservolfirst, nouservolfirst

    +   If you have a $HOME/.AppleVolumes file, present volumes listed there first.

    +   -uservol, -nouservol

    +   Enable use of a $HOME/.AppleVolumes file (see above).


    # AppleVolumes Files


    Moving on to the AppleVolumes files, let''s give an example of an AppleVolumes.default
    file for the Public AppleTalk Server line in the afpd.conf file earlier in this
    chapter:


    ```

    ~

    /stage/projects Projects access=@staff

    ```


    The first line—the tilde (~)—enables users to log in. Upon login, their home directory
    appears as an available volume. Since we said -nouservol in the afpd.conf file,
    we aren''t allowing an .AppleVolumes file in users'' home directories. (You should
    use these options only for cosmetic purposes. If users want to look at a place
    other than their home directory, they can make a symbolic link—you can''t really
    do much about it unless you want to hack Netatalk to act more like a Web server
    and examine symbolic links.)


    The second line presents a specific directory (/stage/projects) as the volume
    Projects, allowing access only for members of the staff group.


    Relevant man page: afpd (8)


    # 4.4 Web Proxy Service


    The disk cache in most Web browsers has a tendency to run against the grain of
    shared resources. It''s stored in a user''s home directory with the browser''s
    own caching scheme. This presents a number of problems:


    +   There''s no sharing of users'' caches—if many users access the same page,
    each user must pull the information through the network.

    +   The network connection to the outside world suffers when all users try to
    use it at once.

    +   If you have a large number of users, you have to waste a great deal of disk
    space on cache directories.'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'The built-in caches to Web browsers are not particularly fast. In fact, they
    are very slow when the user''s home directory is not on a local disk (for example,
    if you mount the cache directory with NFS).


    One solution is to install a Web proxy server that maintains a large shared cache
    for all users on the network. The most popular free server is squid. It comes
    with most Linux distributions and has a home page at http://www.squid-cache.org/.


    Once you install squid, you need to decide what to do about the configuration
    file, squid.conf. Because this file is enormous, you may have trouble finding
    the important parameters inside it.


    When setting squid up, you need first of all to decide where on the disk to put
    the cache. The option for this in squid.conf is cache_dir:


    ```

    cache_dir /var/spool/squid/cache 1000 16 256

    ```


    The default is a directory called cache under the prefix where you installed squid.
    If you configured squid with the defaults, it attempts to use /usr/local/cache—not
    a good place from the perspective of clean software distribution.


    The 1000 in the line above is the total number of megabytes to use for the cache
    (the default is 100); 16 and 256 specify the numbers of subdirectories for the
    cache database. This example uses 16 subdirectories in /var/spool/squid/cache,
    with 256 more subdirectories in each of those original directories. You need to
    create the base directory (/var/spool/squid/cache here) by hand. After that, run


    ```

    # squid -z

    ```


    to create the rest of the hierarchy. You can have as many cache_dir lines in the
    squid.conf file as you like; this allows you to use multiple disks for the cache
    (you won’t need to do this unless you’re running a very large proxy for hundreds
    of machines).


    # PROBLEM 46


    Symptom: squid dies with access errors when it’s trying to start.


    Problem: You don’t have the cache directory set up.


    Fix: The cache directory must be writable by the user that squid is running as.
    The squid.conf file defines this as cache_effective_user. Use chown to change
    the ownership of the cache directory (and don’t forget squid -z, above).'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'After you’ve got the cache directory set up, you’ll probably need to configure
    the log files (they’re usually misconfigured by default). You set three basic
    log file names in squid.conf: with cache_access_log, cache_log, and cache_store_log.


    Next, search the squid.conf file for the pid_filename line and change it to the
    following:


    ```

    pid_filename /var/run/squid.pid

    ```


    Now you need to test squid. To detect any remaining problems, run it with the
    -N option to prevent it from running in daemon mode:


    ```

    # squid -N -d 1

    ```


    You may also need to specify -f file if you’ve put the squid.conf file in a place
    other than the default. If there are no errors, squid prints a bunch of debugging
    information:


    ```

    1999/11/13 17:19:46| Starting Squid Cache version 2.2.STABLE5 for i586-pcLinux-gnu...

    1999/11/13 17:19:46| Process ID 10231

    1999/11/13 17:19:46| With 256 file descriptors available

    1999/11/13 17:19:46| Performing DNS Tests...

    1999/11/13 17:19:46| Successful DNS name lookup tests...

    1999/11/13 17:19:46| helperOpenServers: Starting 5 ''dnsserver'' processes

    1999/11/13 17:19:46| Unlinkd pipe opened on FD 13

    1999/11/13 17:19:46| Swap maxSize 51200 KB, estimated 3938 objects

    1999/11/13 17:19:46| Target number of buckets: 78

    1999/11/13 17:19:46| Using 8192 Store buckets, replacement runs every 10 seconds

    1999/11/13 17:19:46| Max Mem size: 8192 KB

    1999/11/13 17:19:46| Max Swap size: 51200 KB

    1999/11/13 17:19:46| Rebuilding storage in Cache Dir #0 (CLEAN)

    1999/11/13 17:19:46| Set Current Directory to ..

    ..

    ```


    You’ll get your prompt back if an error occurred. If everything appears to be
    running properly, press CTRL-C; you’ll need to do one more thing before you set
    up the clients.


    # Client Access Lists in squid.conf


    Nothing can connect to your proxy server unless you set up access control. You’ll
    find a few lines in the squid.conf setting up the access control lists; they start
    with acl. You’ll find this in the default:


    ```

    acl all src 0.0.0.0/0.0.0.0

    ```'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'This line groups all hosts on the Internet into the name all. To create a new
    access list, add a line such as the following:


    ```

    acl mynetwork src 10.1.1.0/255.255.255.0

    ```


    This refers to the hosts 10.1.1.1-10.1.1.254 as mynetwork (Chapter 2 provides
    a more detailed explanation of subnets). To allow hosts on mynetwork access to
    the server, insert


    ```

    http_access allow mynetwork

    ```


    into the squid.conf file just before the line that reads


    ```

    http_access deny all

    ```


    # PROBLEM 47


    Symptom: Access is denied even though you’ve included http_access allow.


    Problem: You have an incorrect http_access order.


    Fix: The line that denies everything (http_access deny all) must be the last http_access
    line in squid.conf. As with the ipchains rules in Chapter 2, Section 2.4, the
    first http_access line that applies to an incoming request is the one squid uses.
    In general, you’ll want to put the http_access deny lines last unless you’re doing
    something like this to allow access to everyone on the network mynetwork except
    those defined by eviltwits:


    ```

    acl all src 0.0.0.0/0.0.0.0

    acl mynetwork src 10.1.1.37/255.255.255.255

    acl eviltwits src 10.1.1.0/255.255.255.0


    http_access deny eviltwits

    http_access allow mynetwork

    http_access deny all

    ```'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'Start up squid as before, but without the -N option. It detaches itself from
    the terminal and runs in daemon mode. Verify that you can see it in a process
    listing. If it doesn''t show up, use the -N option again (as above) to see what
    the problem is. Otherwise, proceed to client configuration (below).


    After you''ve determined that everything''s working correctly (including client
    tests), put squid in your boot-time scripts as described in Chapter 1.


    # PROBLEM 48


    **Symptoms:** The proxy server delivers old versions of Web pages. The server
    doesn''t seem to cache.


    **Problem:** You have a system time mismatch.


    **Fix:** Make sure the server containing squid is also running some ntp daemon.
    If there is a major time skew, squid''s behavior may seem erratic.


    # Client (Web Browser) Configuration


    Most Web browsers keep their Web proxy configuration in its own section of whatever
    file you use to configure the browser (with menu options such as Preferences and
    Options). In these options, you need to set the HTTP proxy host to the hostname
    of whatever server squid is running on, with the port at 3128 (unless you changed
    it in the server''s squid.conf with http_port). You can also set the FTP and gopher
    proxies to be the same as the http proxy, although you probably don''t care about
    this unless you''re doing the proxy because of a network firewall.


    In Netscape, you''ll find this information in Preferences. After you''ve clicked
    on Proxies under Advanced in the Category box, select Manual proxy configuration,
    then press the View button. A window pops up; fill out the relevant portions,
    click on OK, and you should be ready to connect through the proxy server.


    It''s also essential that you change your browser''s cache settings to reflect
    that you''re using a Web proxy. Clear your disk cache, then set the disk cache
    size to 0. Set the memory cache size to a small number (1000KB or so), then clear
    it. Now load a Web page.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# PROBLEM 49


    **Symptom:** You changed a page, but it doesn''t reload properly.


    **Problem:** The memory cache on your Web browser is too aggressive.


    **Fix:** Although you may think it''s squid''s fault, a memory cache on a Web
    browser often steps in when you don''t want it to. A quick fix in Netscape is
    to press the SHIFT button when reloading. Clear the memory cache and keep it as
    small as possible [making it too small may interfere with animations, though].
    As we''ve mentioned before, make sure all the system times on your systems are
    identical.


    You may have noticed an automatic proxy configuration option in your browser''s
    Preferences. squid doesn''t support this option by default. To get this to work,
    you''ll need to install a proxy configuration script on your Web server [this
    isn''t necessarily your proxy server]. Automatic configuration doesn''t really
    make configuration much easier because you still have to enter a location, but
    it can make widespread distribution of some settings easier [for example, Web
    pages the browser should bypass the proxy server for]. You''ll find details of
    how to do this in the documentation at the squid Web site.'
  merge: -1
  img_proc: true
- pgno: 119
