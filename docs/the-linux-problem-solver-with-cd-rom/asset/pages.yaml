  md: '# PROBLEM 13 (CONTINUED)


    Problem: Buffer overflow exploit.


    Fix: See the next section.


    Explanation: Someone has attempted a break-in and has probably succeeded. The
    above example indicates a buffer overflow attack, which feeds a server with continuous
    input in an attempt to overload it to the breaking point. While many buffer overflow
    problems have been corrected, inevitably more lurk out there.


    # Detecting Break-Ins


    If you’ve experienced a break-in (and it’s not always obvious), a program called
    tripwire can find so-called Trojan horses and altered files. After creating a
    catalog of all system files, it periodically checks your system’s integrity (it’s
    useless unless you initially run it on a clean system to get a “snapshot” of a
    healthy configuration, so don’t wait to do so).


    Keep on the lookout for extra inetd processes running. A favorite attack method
    is to exploit a buffer overflow hole, then create a file in a place such as /tmp
    with a single inetd.conf line:


    ```

    8080 stream tcp nowait root /bin/sh -s -i

    ```


    The attack then runs another inetd on that file. A telnet to port 8080 on the
    compromised machine yields a root shell, enabling the attacker to do whatever
    they wish to the machine.


    # What to Do if Someone Breaks In


    If someone breaks into your machine, there’s really no telling what your attacker
    did. To prevent the individual from coming back, you need to reinstall at least
    the core part of the operating system (and any custom services on your machine).
    First, though, try to find out how the intruder got in, because if you put the
    system on the machine exactly as before, chances are whoever broke in will return.


    Of course, you should also back up your data first.


    # 2.6 Diagnostics


    We all know networks don’t always behave the way they’re supposed to. Fortunately,
    many tools available for Linux can help you find problems. Most distributions
    come with a large set of tools installed in /usr/sbin. Here’s a list of the good
    stuff and their basic functions.'
