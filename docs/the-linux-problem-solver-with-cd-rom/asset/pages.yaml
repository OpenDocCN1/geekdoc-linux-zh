- pgno: 22
  md: 'rc*.d in /etc/rc.d. Make a new script fooserv in /etc/rc.d/init.d that’s similar
    to the scripts already in there, and test it with /etc/rc.d/init.d/fooserv start
    and /etc/rc.d/init.d/fooserv stop. If everything works fine, make appropriate
    links in the rc*.d directories. Make a link with a high number such as


    ```

    # ln -s ../init.d/fooserv S90fooserv

    ```


    in /etc/rc.d/rc2.d so the service will start up near the end of bootup. Similarly,
    in the runlevels that shut services down, you probably want to shut fooserv off
    early, so the link to shut the service off would get a name like K10fooserv.


    To remove a service, remove its links in /etc/rc*.d. You may also opt to rename
    the links; for example, you could add an underscore (_) in front of the name.
    Be careful when removing links, because if you use the service again in the future,
    you’ll need to put the links back. In addition, before you remove a link, see
    if its init.d script (the file to which the link points) has a line like this,
    testing a configuration variable or file:


    ```

    [ -z "$RUN_GATED" ] || exit 0

    ```


    Certain distributions (like S.u.S.E.) read a global configuration file that sets
    these variables (like $RUN_GATED), which all of the service start-up scripts read.
    Red Hat has a bunch in /etc/sysconfig. If your distribution uses one of these
    configuration files, you’ll probably find it easier to turn services on or off
    by modifying the configuration files rather than removing links in the rc*.d directories.


    Relevant man pages: inittab (5), init (1)


    # The Syslog Facility


    The syslog facility reports system notice and error messages. The message recording
    daemon, syslogd, waits for messages from other programs, sorting them into different
    files as it receives them. The standard log directory under Linux is /var/log,
    but /etc/syslog.conf is the ultimate authority on where messages go.


    You can configure messages to go to a file (including special devices such as
    a terminal), another machine, a set of users, or a named pipe. Here are a few
    example entries:


    ```

    kern.warn;*.*;authpriv.*   /dev/tty10

    mail.*                     @logs.example.com

    *.*                        /var/log/messages

    *.emerg                    root

    ```


    The first column describes what kinds of messages to record, and the second says
    where to record them. The first line says that kernel, error, and authorization
    messages should go to /dev/tty10, the second sends mail diag-'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'nostics to the syslogd on logs.example.com, the third sends all syslog messages
    to the file /var/log/messages, and the last writes emergency messages to root''s
    screen, if root happens to be logged in.


    An entry for kern.warn states that the facility name of the message is kern and
    the priority level is warn. Valid facility names for Linux 2.2 are auth, authpriv,
    cron, daemon, kern, lpr, mail, news, syslog, user, uucp, and local0 through local7.
    Priorities are alert, crit, debug, emerg, err, info, notice, and warning. There
    are also a few outdated priorities (look in /usr/include/sys/syslog.h for a list
    of these).


    As your system runs, messages continue to pile up in /var/log. If your system
    did nothing about them, the disk partition containing /var would eventually fill
    up, making it difficult to use the system. Most distributions realize this and
    run cron jobs to clean up the log directories so this never happens.


    If you have a substantial network, it''s a good idea to have a log host to which
    other machines can send log messages. Keeping the logs for your whole network
    in one place can make the process of detecting and debugging problems much quicker
    and easier. You may also want to maintain a local log—you could save a few minutes
    here and there at the expense of only a little disk space and system time.


    NOTE


    > Some distributions don''t put all message facilities in /etc/syslog.conf (especially
    the local facilities). If /etc/syslog.conf doesn''t mention a facility, any program''s
    output to that facility will be thrown away. Use the logger command to debug your
    configuration.


    Relevant man pages: syslog.conf (5), syslog (1), logger (1)


    # cron


    A periodic event scheduler, cron is a useful system daemon. It reads files called
    crontabs that specify times, intervals, and the commands to run at the end of
    every interval. These files are usually located in /var/spool/cron, and users
    create, access, modify, and put them into place with the crontab command. Here''s
    a short crontab reference:


    +   crontab file  Use file as the crontab

    +   crontab -e  Edit crontab (with the editor specified in the environment variable
    VISUAL or EDITOR)

    +   crontab -l  Display crontab

    +   crontab -r  Remove crontab'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'Here''s an example crontab (for a user with a login of jamie):


    ```

    SHELL=/bin/sh

    PATH=/usr/bin:/usr/sbin:/usr/local/sbin:/usr/local/bin:/sbin:/bin

    MAILTO=jamie

    53 6,20 * * * /home/jamie/bin/clean-junk > /dev/null 2>&1

    ```


    SHELL, PATH, and MAILTO are set to what you''d expect: the shell and path to use
    for the commands, and the user to send mail to if any commands produce output.
    In the fourth line, the first six fields specify the times and intervals; from
    first to sixth, they are minute, hour, day of month, month, and day of week. They
    are specified either numerically or with an asterisk (*), which includes everything—for
    example, * in the day of week field is the same as 0,1,2,3,4,5,6. The last line
    in jamie''s crontab above matches every day (of the month and week) and every
    month when the minute is 53 and the hour is 6 or 20 (that is, 6:53 am and 8:53
    pm).


    When a time matches what''s specified in the six fields, the action after the
    fields is performed. If you want to annoy a user called bob on any Friday the
    13th, you could write:


    ```

    * * 13 * 5 /bin/mail -s "Beware, Bob" bob

    ```


    The * entries for minute and hour make this a particular nuisance for bob: Poor
    bob receives a message from you every minute on Friday the 13th. To give bob just
    one message at noon on every Friday the 13th, you could use this:


    ```

    00 12 13 * 5 /bin/mail -s "Beware, Bob" bob

    ```


    > (We''re not saying any of this tormenting of bob is a particularly good idea,
    mind you.)


    Another version of the crontab file, /etc/crontab is a system crontab and has
    an additional field after the time specifications: the user running the job. In
    the following two entries, the users running the tasks are root and backup.


    ```

    15 4 * * * root /usr/local/sbin/sysclean > /dev/null 2>&1

    25 23 * * * backup /usr/local/sbin/do-backups

    ```


    The version of cron that comes with Linux (Vixie Cron) is quite flexible in comparison
    to those on other Unix flavors; take a look at the manual pages for more information.

    Relevant man pages: crontab (5), crontab (1), cron (8)


    # The passwd File


    The principal user database under Unix is /etc/passwd. There are a number of ways
    to modify it. The passwd command available to users is also a maintenance tool
    for the systems administrator.'
