    Unix programs talk to devices through device files found in /dev. Device file
    names include tty1, hda3, and audio. Interaction with the device files using regular
    programs like cat and dd yields different results depending on the kind of file
    and its permissions (these vary, since you may not want a regular user to scribble
    all over a raw hard disk device, for example).


    If you look in /dev, you’ll find a lot of devices there (also called special files).
    Do you really have all of this stuff on your system, and what do the device names
    correspond to? The answer to the first question is no; if you try to do an operation
    on a device that doesn’t exist on your machine, either you’ll get an error message
    like “/dev/device: No such device” or your command will just wait forever for
    the nonexistent device to become available. As far as the second question goes,
    the device names are up to the programmers. Here is a list of a few basic device
    names.


    +   /dev/tty* Terminal devices of some sort. They all work through the same interface.

    +   /dev/ttyn (where n is a number) Linux virtual consoles.

    +   /dev/ttys* Serial ports.

    +   /dev/ptyq*, /dev/ptyq*, .. Pseudo-terminals: xterm, telnet, ssh, and other
    shell-invoking programs use these (they emulate the rather archaic interface of
    a real terminal in order to provide compatibility for terminal-reliant shells
    and programs).'
