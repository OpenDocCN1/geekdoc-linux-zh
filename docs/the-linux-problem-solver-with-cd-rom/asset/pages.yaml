    \ papstatus command; see Chapter 4 for more information on nbplkup):\n\n```\n\
    # nbplkup :LaserWriter\n```\n\nYou should get a listing of the printers offering\
    \ LaserWriter service and their AppleTalk network numbers. To list a different\
    \ zone, tack @zone onto the end of :LaserWriter (Netatalk’s getzones command lists\
    \ the available zones). Of course, you could also use the Chooser on a Mac—the\
    \ LaserWriter 8 service is the one you want.\n\nOnce you get a printer status\
    \ report, such as idle, try sending the printer a PostScript file with pap:\n\n\
    ```\n# pap file.ps\n```\n\nBy the way, a rather interesting option, -c, tells\
