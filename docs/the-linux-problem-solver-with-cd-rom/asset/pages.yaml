- pgno: 36
  md: 'The first field is the name. The second is the number and the protocol it refers
    to, followed by any aliases or comments. In the second line, ssh is the field,
    22/tcp the number and protocol classification, and # secure shell a comment.


    # inetd and /etc/inetd.conf


    A so-called superserver, inetd is responsible for many of a machine’s services.
    It starts up at boot time and runs for the duration of the machine’s uptime, waiting
    for incoming connections on specified ports and forking off an appropriate program
    if a connection comes in.


    The following are typical entries for inetd’s configuration file (/etc/inetd.conf):


    ```

    login   stream  tcp     nowait  root    /usr/sbin/tcpd  in.rlogind

    # exec   stream  tcp     nowait  root    /usr/sbin/tcpd  in.rexecd


    # Pop et al

    pop3    stream  tcp     nowait  root    /usr/sbin/tcpd  /usr/sbin/popper -s

    ```


    The first field is the service as specified in /etc/services, followed by the
    socket type, protocol, wait status, user (with optional group), server path name,
    and finally the server arguments. Note the server path name and arguments of the
    typical pop3 entry: /usr/sbin/tcpd (described below) does some filtering and logging,
    then hands the connection to /usr/sbin/popper -s.


    To remove a service, place a pound sign (#) at the beginning of the desired line
    to comment it out, then send a hang-up (HUP) signal to the inetd process. Usually
    the process ID of inetd is in /var/run/inetd.pid, so you can run kill -HUP `cat
    /var/run/inetd.pid`.


    > NOTE

    > Since inetd is not particularly essential to a machine’s uptime, the operating
    system will still run pretty much as usual if you kill it, so don’t be afraid
    to experiment on a machine that doesn’t run any essential network services. inetd
    takes a -d option for debugging (and will complain about bad entries in /etc/inetd.conf
    in any case).


    # tcpd, /etc/hosts.allow, /etc/hosts.deny


    Part of the TCP wrappers package, tcpd checks an initial connection to see which
    remote host is attempting to connect and whether the remote host is allowed to
    connect as specified in /etc/hosts.allow and /etc/hosts.deny. It also logs the
    remote host information (via syslog) as well as the connection’s success status.


    The following /etc/hosts.deny configuration throws out most connections from bad-guys.com
    and finger requests from cant-finger.com:'
