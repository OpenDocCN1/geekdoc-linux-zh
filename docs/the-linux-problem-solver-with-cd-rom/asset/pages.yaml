    login ssword:

    \qpass

    > ppp

    ```


    In this file, number is the phone number to dial, login is the login name, and
    pass is the password. The greater-than sign (>) is a prompt that appears after
    a successful login. Keep in mind that this prompts varies widely between dial-ups.


    To start up pppd, type the following:


    ```

    $ /usr/sbin/pppd call compsci

    ```


    The user invoking pppd must be able to read the /etc/ppp/chat-compsci file. This
    brings up some difficulties, since normally only root can read /etc/ppp, but using
    PAP or CHAP (see page 28) eliminates this problem, since the passwords aren’t
    in the chat script. (However, you may not be thrilled with the idea of putting
    your chat script in a directory that’s not on the system—and if you want to make
    it accessible to multiple users, they must be able to read it as well, further
    reducing security.)


    To kill the pppd and hang up (assuming the interface came up at ppp0, which is
    usually the case), run


    ```

    $ kill `cat /var/run/pppo.pid`

    ```


    # PROBLEM 3


    Symptom: pppd cannot open files in /etc/ppp or devices as a user other than root.
    No one but root can run pppd.


    Problem: pppd not setuid [suid] root, or unreadable by user.


    Fix: Some distributions figure that pppd is either inherently insecure or that
    allowing everyone to execute it is too dangerous, so they either don’t set the
    suid bit of the file permissions or they don’t set the world-execute bit. You
    can add specific users to a group and make the program group-executable (better
    for decent-size networks), or you can just make pppd world-executable and suid
    root:


    ```

    # chmod u+s /usr/sbin/pppd

    # chmod o+x /usr/sbin/pppd

    ```'
