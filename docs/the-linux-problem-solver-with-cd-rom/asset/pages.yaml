- pgno: 16
  md: '# 1


    # ABOUT THIS BOOK


    # 1.1 Fighting Fires


    This book is all about solving the two basic types of Linux systems administration
    problems: configuration issues and ongoing maintenance problems. Roughly half
    of the book deals with configuration issues (that is, setting up some sort of
    service); the rest deals with keeping your machine up and running.


    Since hardly anyone gets things right the first time, troubleshooting (or firefighting,
    as they call it in Unix circles) is an important part of systems administration.
    This book will help you solve difficult Linux snafus by integrating troubleshooting
    techniques with explanations and tutorials of Linux utilities. (You can''t be
    expected to fix problems you have no knowledge of, after all.) When there''s a
    common pitfall related to the subject under discussion, we''ll flag it like this:


    # PROBLEM SAMPLE N


    Symptom: How the problem manifests itself.

    Problem: Short description of the glitch.

    Fix: How to go about fixing (or peacefully ignoring) it.'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'Even if you''re not having the problem, try not to skip over it as you''re
    reading the book—at the very least, look at the symptom description. You''ll probably
    run into it sooner or later.


    # What This Book Assumes You Know


    To get the most out of this book, you need to know a little about Linux or Unix
    already. Specifically, we assume that you know how to navigate the filesystem,
    do a process listing, and kill processes. We also assume that you know all the
    basic file commands (cp, rm, mv, ls, chmod, chown, chgrp, and so on) and are familiar
    with a shell—bash, to be specific. Section 1.3 below contains a review of Linux
    system basics.


    You also need competence with some text editor. This is a religious topic for
    Unix types, but for the purposes of this book it makes no difference whether you
    know vi, emacs, ed, pico, or whatever. But you must know how to open a file, make
    changes without damaging it, save it, and exit. Linux will not tolerate typos
    in configuration files.


    # Brief Outline of Contents


    In addition to explaining notation, Chapter 1 also covers the basics of how Linux
    starts and runs, along with a few of the core utilities such as the system logger.
    We intend this mostly as review, so the discussion is on the terse side.


    Chapter 2 ("Network Installation") deals with the basics of network setup. It''s
    purely about connecting to a network and the tools for diagnosing problems when
    they come up.


    Chapter 3 ("NFS, NIS, and rdist") is about spreading information around a network.
    Topics include NFS (the Network File System—used for file sharing); NIS, a simple
    network information database system; and Rdist, a program that copies groups of
    files to remote machines (to keep their software sets up-to-date, for example).'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'Chapter 6 ("Installing Software from Source Code") takes you through the traditional
    method of installing Unix software—from source code.


    Chapter 7 ("Kernel Upgrades") is all about configuring and compiling a new Linux
    kernel, along with the accompanying modules. The kernel is the core of the operating
    system.


    Chapter 8 ("Backups and Crash Recovery") runs through everyone’s favorite topic:
    disasters. If you have anything halfway valuable on your system, you’re going
    to need some kind of backup, and this chapter tells you how to create one. It
    also describes how to get started with the bootable portion of the CD-ROM bundled
    with this book, which you can use to get your system back on track after a bad
    crash.


    Chapter 9 ("User Environments") covers how to set up accounts for users. New accounts
    need dot files for a proper environment. Unfortunately new, inexperienced users
    also have a tendency to wreck their dot files. We’ll talk about how to write dot
    files clearly (so users aren’t just making a stab in the dark when they modify
    them) and how to optimize them.


    # 1.2 Conventions


    We’ll use a monospaced typeface for text that appears on-screen or that you type
    into a terminal window. Punctuation will appear outside of quotation marks containing
    any on-screen text or commands.


    Unless otherwise noted, examples in the book assume you’re using bash, but we’ll
    generally avoid the extensions that bash offers over the Bourne shell (/bin/sh).
    The user prompt will be the dollar sign ($). Anything that appears outside a paragraph
    will be in boldface, so user commands will look like this:


    ```

    $ echo Hi, I am a user.

    ```


    The superuser (root), on the other hand, will have the pound sign (#) for a prompt:


    ```

    # echo Hello, I am the sysadmin, and that user complains too much.

    ```


    Many Linux files and scripts have comments that begin with #, so pay attention
    to the context.


    ```

    # echo This is not a comment.

    # my program has a comment here

    ```'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Dealing with Manual Pages


    We reference manual pages that give further information as follows:

    Relevant man pages: ascii (7), man (1)

    This means sections 7 and 1 of the manual contain additional information for ascii
    and man. The command man ascii gives you the online manual for ascii, and if you
    happen to come across an item with entries in multiple sections, you can pick
    out different sections using man followed by the section number, then the item
    name (for example, man 5 passwd).


    If you want to look at some unformatted manual page that''s in a directory all
    by itself (not in any system man directory), such as foo.1 in support/ introduction
    on the included CD-ROM, you can format and view it with the following:


    ```

    $ nroff -man foo.1 | less

    ```


    We won''t dwell on manual pages, as they can range from nonexistent to sloppy
    to very decent. But if a program has a couple thousand options and a manual page
    that explains them, we''ll mention the manual page as a reference.


    Avoid printing manual pages if possible. Most people I''ve seen who print manual
    pages out never read them, for good reason: Manual pages are primarily references,
    so they aren''t particularly wonderful reading material. When you''re looking
    for a particular item, searching the on-screen version is almost always faster.
    But if you insist on printing manual pages, do it the proper way:


    ```

    $ groff -Tps -man foo.1 | lpr -Pprinter

    ```


    # Unix, Linux, and Linux Distributions


    Linux looks and acts like other systems that call themselves Unix, so many of
    the things you''ll find in this book apply to other kinds of Unix. Keep in mind,
    though, that file and directory paths, interfaces, and commands and their arguments
    vary over the many flavors of Unix. When we discuss Unix in general, we''re not
    talking about Linux in particular.


    There really is no one true Linux system; only the kernel itself is standardized.
    The various Linux distributions occasionally put files in different places and
    use different scripts. In this book, we''ll mention the file name and the place
    where you can usually expect to find the file. If you don''t see it there, you
    can always try searching for it with find. For example,


    ```

    $ find /usr -name ''*.conf'' -print

    ```


    finds anything that ends with .conf under /usr.'
  merge: -1
  img_proc: true
