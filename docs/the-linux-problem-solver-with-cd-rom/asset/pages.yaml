    \ better option than the awful stippled default, and the xset dpms command turns\
    \ on the Display Power Management System (DPMS), to shut the monitor off when\
    \ you haven’t touched the machine for a while.\n\nThe Xsession file runs after\
    \ a user logs in. This shell script runs the user’s .xsession file to retrieve\
    \ a custom startup, if one exists; if the file is not available, Xsession starts\
    \ a default environment. Here you should make a few modifications. Find this final\
    \ part:\n\n```\nif [ -f \"$startup\" ]; then\n  exec \"$startup\"\nelse\n  if\
    \ [ -f \"$resources\" ]; then\n    xrdb -load \"$resources\"\n  fi\n  exec xsm\n\
    fi\n```\n\nChange it to this:\n\n```\nif [ -x \"$startup\" ]; then\n  $SHELL -c\
    \ $startup\nelse\n  if $SHELL -c /bin/true; then\n    xterm -geometry 80x24+0+0\
    \ &\n    twm\n  fi\nfi\n```\n\nThe $SHELL -c parts perform two tasks: They check\
    \ for a valid login shell (so users with no access to the machine can’t log in),\
    \ and they run shell startup files if the user’s shell wants to (for example,\
    \ tcsh reads its startup files at every invocation). We’ve gotten rid of xsm because\
    \ it’s a feeble attempt at creating a flexible, friendly user environment, and\
    \ no one really uses it. Make sure to change twm to your default window manager\
    \ (or replace the xterm and twm lines to an invocation of a systemwide default\
    \ .xsession file)."
