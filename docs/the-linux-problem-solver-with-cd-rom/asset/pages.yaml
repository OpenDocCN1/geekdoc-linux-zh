    # Working with Disks


    Linux offers a number of programs for dealing with matters such as partitions
    and filesystems. Some of the programs carry out the same task, the only difference
    being their interface.


    When you are meddling with disks, check your actions carefully. Unix tradition
    dictates that you don’t get 60 warnings about your actions—it assumes you know
    what you’re doing. If you mistakenly execute dd if=/dev/zero of=/dev/hdb as root,
    the operating system will happily run off and zero out that entire disk.


    Here’s a rundown of the important Linux disk programs:


    +   fdisk, cfdisk

    +   Disk-partitioning programs. They work with ATA/IDE as well as SCSI disks.
    cfdisk is a full-screen curses interface to fdisk, but it can be a little cranky
    at times, so fdisk remains the favorite of most admins who do extensive partitioning.


    +   mke2fs

    +   This program creates an ext2 (second extended) filesystem, as in mke2fs /dev/hdb1.
    Be especially careful when doing this, since you are wiping out all previous partition
    information.


    +   fsck

    +   Examines a filesystem for errors and fixes them. We’ll talk about this one
    in Chapter 8.


    +   mount

    +   Attaches a filesystem to the currently running system, otherwise known as
    mounting a filesystem.


    +   umount

    +   Unmounts a filesystem.


    +   mkswap

    +   Creates a swap space signature on a partition.


    +   du

    +   Shows disk usage for a directory.


    +   df

    +   Shows capacity statistics of filesystems.


    We’ll talk about disk programs in more detail in Chapter 8.


    As the system boots, various instances of mount -a are executed with different
    arguments. After parsing those arguments, mount reads /etc/fstab, finds any filesystems
    that match the arguments, and attempts to mount them. Therefore, /etc/fstab is
    the main reference for the machine’s local partitions. /etc/fstab looks like this:'
