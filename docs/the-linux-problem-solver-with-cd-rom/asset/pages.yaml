- pgno: 54
  md: 'look at the section on the init.d and rc.d directories in Chapter 1 to see
    how to manipulate those.


    # Restricting Access


    You can restrict access to services with either TCP wrappers (tcpd, see Section
    2.2) or with firewalls (see Section 2.4). The following services are common candidates
    for removal or restriction, either because they pose security risks or because
    they’re simply unnecessary.


    telnetd If someone uses telnet to access your machine, he or she types a password
    and conducts an entire session over the network in plain text (cleartext; no encryption).
    Anyone with a packet sniffer can pull passwords off the network at whim if your
    users are ingrained with telnet. Turn it off and force the users to use an encrypted
    alternative such as ssh, the Secure Shell (see below).


    rlogind The same problems for telnetd also exist for rlogind, except that you
    can circumvent the use of a password with a .hosts file. However, this opens you
    to the additional problem of intruders gaining access to your system without a
    password.


    rexecd This sometimes provides a way for software on non-Unix hosts to access
    certain programs, such as X Window System clients, on Unix or Linux machines.
    It uses a cleartext password and its traffic is unencrypted.


    ftpd If you have no use for ftpd, don’t run it, because it transmits the session
    (including passwords) in the clear over the network. A better alternative to nonanonymous
    FTP is scp (which comes with ssh). Numerous security problems have cropped up
    with the various ftpds in the past.


    fingerd While seemingly harmless, this service has had buffer overflow problems.
    Intruders can also obtain user lists with it. Turning it off is never a bad idea.


    talkd, ntalkd Seriously consider restricting the number of hosts with access to
    these.


    sendmail or other mailer services If your machine doesn’t handle mail, don’t run
    any mail services. If you’re a dial-up home user, you may be using POP or imap
    anyway. Alternatives to the typically exploitable sendmail are qmail and postfix.


    chargen, echo, discard, daytime, time These are internal to inetd; originally
    meant for debugging, they are useless.'
