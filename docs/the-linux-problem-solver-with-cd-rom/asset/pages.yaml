- pgno: 195
  md: '# PROBLEM 86 (CONTINUED)


    Dual-booting with LILO is relatively easy. Let’s say you have a disk with three
    partitions, /dev/hda1, /dev/hda2, and /dev/hda3; some other operating system is
    on /dev/hda1, Linux is on /dev/hda2, and /dev/hda3 is Linux swap space. Let’s
    say there is already a loader for that other operating system on /dev/hda1. Your
    /etc/lilo.conf will end like this:


    ```

    image=/boot/vmlinuz-version

    label=linux

    root=your_root_dev

    read-only


    other=/dev/hda1

    label=junk

    ```


    After you run lilo and reboot, you can type junk at the LILO boot prompt, and
    LILO will start the other operating system’s loader.


    # 7.5 Kernel Modules


    We’ve talked about how to configure and compile the modules that come with the
    kernel in Sections 7.2 and 7.3. To install them, you run another make command:


    ```

    # cd /usr/src/linux

    # make modules_install

    ```


    Before doing this, though, look in /lib/modules for a directory with the same
    name as the kernel release you’re installing. For example, if you’re installing
    version 2.2.12, look for /lib/modules/2.1.12. If such a directory exists, move
    it to a different location before running make modules_install.


    # PROBLEM 67


    Symptom: Boot-up scripts complain about an incorrect System.map.

    Problem: System.map is not in place.

    Fix: Copy the System.map file into either / or /boot (the location of the original
    file—make sure to back up the original), and reboot.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# Kernel Module Commands


    Here’s a short kernel module command reference:


    # insmod modname [parameters]


    Load modname into the kernel. The modname must either have a corresponding modname.o
    file somewhere in /lib/modules/version, or it must be a file in the current directory
    (or an absolute path name). Sometimes you’ll need to give the module a parameter
    or two when you load it, in the form param=value; you may specify as many as you
    like.


    # rmmod modname


    Remove modname from the kernel. You don’t need to put the .o at the end of modname.


    # lsmod


    This shows all currently loaded modules.


    # depmod [-a]


    This builds a dependency list of all modules. One module may need a bunch of other
    modules to load first—for example, the msdos.o module (for the MS-DOS filesystem)
    needs fat.o. The dependency file is /lib/modules/version/modules.dep.


    # modprobe [modname|option]


    This command works with the dependency list depmod generates. If you give a modname
    as an argument, it will first attempt to load any other modules modname depends
    on, and then load modname. modprobe -r modname will try to load modname and any
    other modules it depends on.


    > NOTE The kernel module loader uses modprobe to load modules. Most current distributions
    are configured with the module loader, so it’s important to keep the dependency
    list up to date. You do this at boot time with a call to depmod -a from one of
    the init.d scripts (described in Chapter 1). It’s in /etc/rc.d/sysinit in Red
    Hat 6 systems.


    # Filesystem Modules


    As mentioned earlier, filesystems are among the best suited for modules, but you’ll
    experience one minor difference in operation with modules versus direct compilation.
    Let’s say you have a DOS filesystem on /dev/hda1. If you’ve compiled fat.o and
    msdos.o as modules, and they aren’t loaded at the time, you can’t simply mount
    the filesystem with this:


    ```

    # mount /dev/hda1 /dos

    ```'
  merge: -1
