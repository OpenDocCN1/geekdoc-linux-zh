  md: '# 2


    # NETWORK INSTALLATION


    # 2.1 Introduction


    Basic network configuration (configuring a network interface and adding a default
    route) shouldn’t cause you much grief. The challenges come in if you want to set
    up your network to share a PPP connection to the Internet over several machines,
    share files, play network games (of course), and so on. Due to the increasing
    number of network security exploits (and people who want to use them), attention
    to network security is also important. Unix diagnostic tools come in handy for
    configuration and the occasional glitches that crop up.


    This chapter is not meant to be an all-inclusive guide to setting up a Linux network;
    rather, it will teach you how to use some of Linux’s more useful (and tricky)
    networking facilities.


    # 2.2 Basic Commands and Files


    Linux network devices are called *interfaces*. Device names include eth0 and ppp0,
    which are Ethernet and PPP interfaces, respectively, although these are only the
    network-layer device names. PPP, for example, runs on top of another device, usually
    a serial port such as ttyS0.'
