  img_proc: true
- pgno: 29
  md: 'Every process on the system is represented in a directory /proc/pid, where
    pid is a process ID (/proc/self is always set to the ID of the process querying
    it). The entries under these directories tell you about how the command was called,
    its environment, its status, and a host of other information. Most versions of
    ps use the /proc filesystem to gather information.


    The other stuff in /proc (such as /proc/cpuinfo) consists of kernel information.
    The more useful of these files include:


    +   interrupts Active interrupts. For example, if a serial port isn’t in use,
    it won’t show up in the list. Also shows the number of interrupts received since
    boot-up.

    +   ioports All I/O port assignments.

    +   dma DMA assignments.

    +   devices Available devices. The number before the device symbol is the device’s
    major number; this corresponds to the major device number in /dev.

    +   filesystems All available filesystem types.

    +   modules Active modules.

    +   meminfo Memory information.

    +   scsi/ Directory holding SCSI host adapter and device information.

    +   version Kernel version.

    +   mounts Mounted filesystems. /etc/mtab is also supposed to have this information,
    but the -n argument of mount prevents any writes to /etc/mtab.

    +   net/ Network information.


    You may be curious about all the stuff in /proc, but it’s probably not a good
    idea to use cat on every item you see. A cat /proc/kcore (which you can only perform
    as root) dumps all sorts of binary garbage to your screen. Use a program such
    as less instead of cat on items you’re not sure about.


    Relevant man page: proc (5)


    # Untangling Quote Messes


    A literal character is one that does not receive special treatment. For example,
    shells treat the characters such as $ and * differently than regular letters (like
    a and j). When you want the shell to read $ in the same way that it would treat
    an a, you’re asking for a literal $.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'While looking at scripts and examples on the system and in introductory books,
    you have probably noticed that they use an array of methods to get literal characters:
    single quotes, double quotes, and backslashes. Because there are so many ways
    to get literal characters, Unix shells sometimes cause utter confusion. Worse
    still, some shells have inconsistent schemes, and they''re all somewhat incompatible.
    One factor in the choice of bash in this book is its relatively clean syntax.


    To write effective scripts and commands, you need to understand how a shell parses
    its input and runs a command. When you type a command, you are specifying a number
    of arguments. Even the program you intend to run is an argument. After processing
    the arguments, the shell puts each argument into its own slot and runs a system
    call on all of the slots to execute the command. The argument slots'' numbers
    start at zero in this system call—therefore, the actual first argument (in this
    case, the command), is often called the zeroth argument.


    If you enter a command such as


    ```

    $ echo "I''m a command" * $PATH

    ```


    the zeroth argument is echo. The first argument is the string I''m a command (including
    the spaces). The rest of the arguments depend on the contents of the current working
    directory and what the environment variable PATH is set to.


    When you type a command, your shell first parses quoted arguments and expands
    variables and patterns. Then it fills the argument slots with whatever the expansions
    yielded. Problems tend to occur when you forget that the shell expands some character
    in an argument before putting it into an argument slot.


    Any * out on its own expands to a list of files in the current directory that
    do not begin with a dot (.) before the execution of the command. If the current
    directory holds no files, a literal * is passed as the argument; no error messages
    appear. This holds for all pattern matching. For example, foo* expands to all
    files in the current directory that start with foo except when none match, in
    which case it doesn''t expand at all. This kind of expansion is known as globbing.


    Any unquoted string beginning with $ expands to a shell or environment variable.


    The confusion with quotes comes in when you want to prevent the shell from expanding
    special characters. There are three types of quotes: the double quote ("); the
    single quote ('') or tick; and the back quote (`), or backtick. Their meanings
    are:


    +   '' Literal. Anything inside single quotes does not expand; the shell passes
    it straight to the command.


    +   " Somewhat literal. There is no globbing, so a character such as * is sent
    to the command, but shell and environment variables (beginning with $) are expanded.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Command substitution.


    The shell executes any command inside two backticks, and passes the output of
    that command as an argument (for example, FOO=`ls` places the output of the ls
    command into the variable FOO).


    To pass any of the three quotes as literal arguments, put a forward slash (/)
    in front of the quote outside any single or double quotes. There are other ways
    to do it in bash, though; for example, `''`'' passes a single quote, and `""`
    passes a double quote. Because there are so many ways to get literal characters
    as arguments, users often try to use all of them at once and end up with unexpected
    results. The best way to debug a problem with quoting is to use echo to see what
    arguments follow the substitution—for example:


    ```

    $ echo ''$this should put a dollar sign before the text''

    ```


    NOTE

    Annoyingly, ISO 8859-1 defines an acute accent that looks a lot like a single
    quote; you might have come across it in email messages, or you may have seen it
    on keyboards from outside the United States.


    That''s it for the basics. In the following chapters, you''ll not only encounter
    solutions to over a hundred Linux problems, but you''ll also see in-depth detail
    on why the solutions work. With this information in hand, you''ll have everything
    you need to fix your Linux headaches.'
  merge: -1
