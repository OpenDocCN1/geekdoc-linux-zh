- pgno: 66
  md: '# 3


    # NFS, NIS, AND RDIST


    # 3.1 Introduction


    NFS and NIS are often bunched together in many books. Functionally, they don’t
    have much to do with each other; they perform different tasks and for the most
    part work independently. Sure, you can use NIS maps in your NFS configuration,
    but you can use NIS maps almost anywhere. Still, they both send information from
    one machine to another, which makes it useful to discuss them together.


    NFS (Network File System) is a means of mounting one machine’s filesystem on another.
    NIS (Network Information Service) performs a variety of mostly user-related stuff—centralized
    user accounting (passwd and group files) is its biggest function.


    NFS and NIS are not perfect. NFS suffers from a variety of performance and design
    shortcomings, and both have an annoying habit of sending their information unencrypted
    over the network. Furthermore, if configured incorrectly, they can perform horribly
    and have deleterious effects on system stability. They are widely used in spite
    of their faults because you can find free implementations everywhere.


    We present rdist as an alternative to NFS in some cases. NFS was once used for
    any filesystem of substantial size, including parts of the system installation,
    since disk space was far too expensive to keep a complete local copy of'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'the system on every machine on the network. Since average hard disk capacity
    has grown substantially, it makes more sense to keep this load off the network
    and put as much local software as possible on local disks. That''s where rdist
    comes in—as a tool for copying directory trees to remote machines.


    # 3.2 NFS Clients


    Client configuration with NFS is initially straightforward. First, your kernel
    must support the NFS filesystem (or have a module that supports it). Of course,
    your machine must also have the server''s permission to mount its filesystems.


    # Mounting a Filesystem


    To mount a filesystem manually, use


    ```

    # mount -t nfs server://remote-filesystem /mount-point

    ```


    where server is the remote server, /remote-filesystem is the filesystem''s location
    on the server, and /mount-point is where you want to put the filesystem on your
    machine.


    To make such a mount available at system boot time, add this entry to your system''s
    /etc/fstab:


    ```

    server://remote-filesystem   /mount-point  nfs  defaults  0  0

    ```


    > NOTE The last two fields are set to 0 because they are irrelevant with NFS clients.
    When the system boots, these will be among the last filesystems mounted.


    # PROBLEM 15


    Symptom: Noncritical NFS server often crashes, freezing user processes for the
    duration of the server''s downtime.

    Problem: Unreliable server.

    Fix: Use the intr option to mount. When an NFS client''s kernel can no longer
    communicate with a server, any programs attempting to access that server freeze,
    and you can''t kill them until the server responds. Here is an example for /etc/fstab:

    server://remote-filesystem   /mount-point  nfs  intr  0  0

    With the intr option, you can interrupt the process with a CTRL-C or kill.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# Fixed Mounts


    NFS mounts in /etc/fstab or attached by hand are sometimes called fixed mounts.
    Once the mount is in place, it stays there until it is manually unmounted or the
    system shuts down. But in most situations, fixed mounts are undesirable, since
    they tend to cause system instability on reboot.


    # PROBLEM 16


    Symptom: One machine, acting as both an NFS client and a server, reboots, and
    the rest of the network hangs. When that machine reboots, it hangs.


    Problem: Fixed NFS mounts tend to create cross-dependencies and lead to system
    instability.


    Fix: Use the Automounter. If machine 1 gets files from machine 2, and machine
    2 gets files from machine 1, you have the following problem. If both machines
    are down at one time, the first one that boots will time out trying to talk to
    the second. When the second machine eventually boots, it will be missing filesystems
    from the other server.


    This is a trap of cross-dependencies that tends to catch inexperienced systems
    administrators.


    # PROBLEM 17


    Symptom: Computer hangs at boot time.


    Problem: Files needed for system bootup are on NFS-mounted filesystems


    Fix: Try to eliminate network dependencies on bootup by putting essential configuration
    data files on the local disk. (Using the Automounter won’t help if a bootup script
    in one of the /etc/rc... directories tries to get a configuration file from one
    of the automounted directories.) To verify proper bootup on a machine, disconnect
    the network cable to see if it still hangs on reboot. If not, the hang probably
    stems from a network dependency problem


    # The Automounting Daemon


    The automounting daemon (or Automounter) follows the principle of on-demand filesystems
    and is a way to control file dependencies that cause boot problems.'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'The Automounter monitors a directory and freezes attempted accesses until it
    mounts a filesystem at that directory. Once the filesystem is mounted, access
    is allowed to continue as usual.


    Because the Automounter only mounts the filesystem as needed, machines that share
    data on a network can all go down at the same time and can boot at will. As long
    as nothing in the bootup process needs to look at any NFS-mounted filesystems,
    the machine will boot as fast as a stand-alone.


    > NOTE

    > Even the Automounter won’t prevent delays if a file server crashes. If server
    X is down, and you try to look at /foo/bar on X, the Automounter will freeze your
    access, and while attempting a mount it will probably time out and give you an
    I/O error. However, this will not affect currently running processes; as long
    as they don’t attempt to access an unavailable filesystem, they should continue
    normally.


    There are two automounting daemons in common use: the native Linux automount,
    and amd, which runs on a number of platforms. We’ll focus on automount because
    it’s fairly small and simple to use.


    # automount


    automount takes a (preferably empty) directory as its base and attaches the remote
    directories to it. (The most common example of this is /home. A user’s home directory
    is usually /home/user, since users generally like their home directory to be in
    the same place over an entire network.)


    # The Automounter Map File


    To configure the Automounter, use a map (a file) to determine what directories
    automount will handle and where it will get them when requested. Place the map
    somewhere on the network and make it available using NIS, NIS+, or arbitrary program
    execution, or simply as a plain text file. Whatever method you choose, the format
    for accessing the map is more or less the same. An example map for /home follows:


    ```

    sue    mikado.example.com:/u25/sue

    bob    atlantic.example.com:/u1/bob

    ```


    Say you have the map in a file called /etc/auto.home. To start the Automounter
    on it, use this command:


    ```

    # automount /home file /etc/auto.home

    ```


    Now entering cd /home/bob takes you to bob’s home directory.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# NOTE


    For automount to work, you must configure the autofs filesystem into the kernel
    either directly or as a module. In contrast, amd doesn’t particularly need an
    autofs filesystem, but it’s better to use autofs in order to keep bizarre path
    names like /a/mikado.example.com/u25/sue from popping up—if they exist, your users
    will discover them and ask you about them, and you won’t want to bother explaining.
    In short, don’t mount the directories at their given names, but rather in another
    part of the system, putting symbolic links from the “right” place to where the
    directories actually are located.


    The automount map format (as in the example above) is compatible with Sun Microsystems’
    Automounter, providing good integration with Sun networks. In addition to the
    file formats, Linux can also share Sun’s /etc/auto.master, which contains all
    of the automount points (such as /home referenced above) and the map locations.


    # autofs


    Linux provides a script called autofs that should run out of one of the rc*.d
    directories. autofs start reads /etc/auto.master and starts up an automount process
    for each entry. Here is an example of auto.master:


    ```

    /home      auto.home          -rw,intr,noquota

    /scratch   /etc/auto.scratch

    ```


    The first entry instructs automount to look in the NIS map auto.home for the /home
    data, and the second starts with a forward slash (/), so automount consults the
    file /etc/auto.scratch. In other words, autofs start on this example above is
    equivalent to running these commands:


    ```

    # automount /home nis auto.home

    # automount /scratch file /etc/auto.scratch

    ```


    Options to mount are placed in an optional middle field in the maps. Let’s modify
    the /home map above:


    ```

    sue      -r                mikado.example.com:/u25/sue

    bob      -nolock            atlantic.example.com:/u1/bob

    cdrom    -ro,fstype=iso9660  /dev/hdb

    ```


    This code says set read-only access at /home/sue, and don’t lock the mounts from
    atlantic.example.com (presumably because locking doesn’t work very well on that
    server). The last entry isn’t for an NFS filesystem at all; it’s provided here
    to show how one may use the Automounter to handle removable media.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# PROBLEM 18


    Symptom: Stale NFS file handle errors. I/O errors. Empty directories.


    Problem: Lingering processes, a moved directory, or a stale file handle.


    Fix: When you move a directory or change the source of a mount point, there''s
    always a risk that a user will be using a file or directory underneath that mount
    point when you make the change. Fix it by trial and error. First make sure the
    Automounter is not running for this mount point. Then try to unmount the directory
    at the mount point by hand. If umount complains that the directory is busy, you
    probably need to kill some process (most likely a user process) that''s accessing
    it. Usually it''s pretty simple to hunt these down with a process listing, but
    sometimes you have to use lsof.


    Often the Automounter refuses to start backing up because the automount point
    itself is hung up on something. You can also try to umount that (for example,
    in our /home example, you''d try umount /home). In rare cases, rebooting is the
    only fix.


    Relevant man pages: autofs (5), automount (8), autofs (8)


    # NFS Mount Options


    There are a few (sometimes) useful options to an NFS mount. You can invoke them
    with the -o option, placing a comma between multiple options:


    ```

    # mount -o bg,soft foo.example.com:/scratch /mnt

    ```


    rsize=n, wsize=n Set the read and write buffer sizes to n bytes. Before Linux
    kernel version 2.2, the default NFS buffer size was 1024 bytes. However, this
    small size significantly slowed throughput, so version 2.2 raised the defaults—you
    shouldn''t have to worry too much if you''re running that kernel or higher. You
    can usually take the limits up to 8192 bytes.


    intr For hard mounts, allows interruption of processes hung on an NFS access.


    soft Gives an I/O error to any program hung on an access due to a server that''s
    not responding. Useful when some really nonessential server has a habit of crashing.


    bg If there''s a timeout on the first mount attempt, keep trying in the background.


    Relevant man pages: nfs (5), mount (8)'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# 3.3 NFS Servers


    An NFS server allows you to share files on a Linux machine across a network of
    Unix machines. While its performance is mediocre (and Linux NFS servers tend to
    lag behind those in other Unix variants), an NFS server comes in handy for spreading
    files over the network, especially if the files are small. There is no restriction
    on what you may share with NFS—you can even export a floppy disk if you like.


    # Essentials


    The essential programs for NFS servers are portmap, mountd, and nfsd; /etc/exports
    is the main configuration file.


    portmap maps RPC (remote procedure call) programs to regular network ports. RPC
    is a communications system that NFS, NIS, and a few other services use. mountd
    (or rpc.mountd) handles incoming mount requests—it is the only program that reads
    /etc/exports. Finally, the program that does the actual file transfers is nfsd
    (or rpc.nfsd).


    To start an NFS server, you’ll first need an appropriate /etc/exports file. If
    portmap isn’t running, start it (as root), then start mountd and nfsd. If you
    make changes to /etc/exports, you’ll need to send mountd a HUP (hang-up) signal:


    ```

    # kill -HUP `cat /var/run/mountd.pid`

    ```


    Here is an example of the /etc/exports file on the machine called mikado.example.com
    (used as a server in the client section above):


    ```

    /u25        *.example.com

    /u40        *.example.com(rw) @other_hosts(ro)

    /data2      pacific.example.com(ro)

    ```


    We’re assuming that example.com is the local domain. When mountd starts up, it
    allows all hosts in example.com to read and write to /u25 and /u40; /data2 is
    only available to pacific.example.com, and then with read-only access. In addition,
    the hosts in the netgroup other_hosts have read-only access to /u40 (netgroups
    are an NIS concept, and we’ll talk about them in Section 3.4).


    The rw and ro in this example are options that apply to mountd and nfsd. Other
    options include the following:


    noaccess Removes access for a directory. In the previous example, if we didn’t
    want /data2/foo available to anyone, we’d put


    ```

    /data2/foo    (noaccess)

    ```


    at the end of the exports file.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '**no_root_squash** By default, root''s userid is set to that of an unprivileged
    user (usually nobody). This is a security consideration; no_root_squash turns
    mapping off.


    # PROBLEM 19


    **Symptom:** You can''t change NFS-mounted items, even though you''re root.


    **Problem:** The NFS server maps the root userid to an unprivileged user.


    **Fix:** You can add no_root_squash to the export options as described above.
    Keep in mind that such a mapping has its limits in terms of how much security
    it provides. For example, in order to modify any file root doesn''t own, you must
    become that user, which you can do as root with su. Only systems like Kerberos
    can prevent this.


    +   - **squash_uids=list** You can give the unprivileged mapping to users other
    than root by specifying a list of uids (such as 32-22,67,3235).

    +   - **all_squash** Use squash_uids for all userids. Also consider using ro for
    read-only access.

    +   - **anon_uid=num** Set the unprivileged userid for the squash options to num.

    +   - **anon_gid=num** Set the unprivileged group for the squash options to num.


    Unless you''ve explicitly turned off access with the noaccess option, any host
    with access to a given directory can mount a subdirectory of that one instead.
    This is particularly handy for use with the Automounter. (We didn''t put /u25/sue
    in mikado''s /etc/exports file; only /u25 is necessary to make the Automounter
    example in the previous section work.)


    > **NOTE** Unlike the nfsd on other Unix variants, the Linux nfsd doesn''t allow
    multiple copies. If you try it, the nfsd processes operate in read-only mode.


    # Security Considerations


    Don''t expect NFS to be the most secure system in the world. It doesn''t encrypt
    data, for one thing, and its default client authentication leaves a lot to be
    desired. If you''re planning to use it, make certain to export filesystems, especially
    those for which you''re allowing write access, to as small a subset of machines
    as possible. Don''t let portmap out of your sight, either. The versions that come
    with most Linux distributions have tcp wrapper support built in, so you can use
    /etc/hosts.allow and /etc/hosts.deny with it. (See Chapter 2 for more information
    on these files.)'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# NFS Alternatives


    Alternatives to NFS include AFS, DFS, and Coda, but if you want to use any of
    these, you''ll either pay a lot of money or deal with lingering bugs in the free
    versions. Coda shows promise as a free network filesystem, but until it is in
    widespread use, you''ll just have to deal with NFS.


    # 3.4 NIS


    NIS (Network Information Service) is a quick way to grab a bunch of keyed information
    from a server without worrying too much about who the server is. It can be handy
    for small networks, because it comes standard with Linux distributions. For larger
    networks, though, you should definitely consider alternatives like LDAP and Hesoid.


    NIS is one of the simplest ways of distributing user information such as passwd
    and group files across a network, and it is in wide use on many multi-platform
    networks. But like NFS, it isn''t terribly secure, mainly because it doesn''t
    encrypt its transmissions.


    # Definitions


    NIS databases are made up of a bunch of records consisting of key and data sections.
    The databases are dbm (under Linux, gdbm) files, usually made from plain text
    files.


    An NIS domain is basically a network of machines bound to the same set of information.
    Each NIS domain has an NIS domain name.


    > NOTE

    > Don''t confuse the NIS domain with DNS domains. DNS is a system used primarily
    for looking up Internet names, numbers, and closely related information. (Although
    you could replace NIS with an authenticated DNS, it isn''t usually used that way.)


    Two kinds of NIS servers may serve the information to the clients in the NIS domain:
    master and slave servers. The master holds the original information about the
    network, and the slaves, if any, hold copies of the master''s information.


    NIS runs on top of RPC, so you''ll need to have the portmapper running (rpc.portmap
    or just plain portmap) if you plan to use NIS servers and clients.


    # NIS Clients


    The main programs associated with an NIS client are rpc.portmap, domainname, ypbind,
    ypmatch, ypcat, and ypmatch. Of these, rpc.portmap, domainname, and ypbind set
    up the communication with the server, and the rest are query programs.'
  merge: -1
  img_proc: true
- pgno: 75
  md: "# Setting Up an NIS Client\n\n+   1. Set the NIS domain name with the domainname\
    \ command (here, the NIS domain name is *mydomain*).\n+   \n+   ```sh\n+   # domainname\
    \ mydomain\n+   ```\n+   \n+   2. Make sure portmap is running and start up ypbind,\
    \ which broadcasts over the network in an attempt to find an appropriate NIS server.\
    \ If your subnet has an NIS server with your NIS domain name, the server should\
    \ respond and ypbind on the client will bind to that server.\n+   \n+   3. Check\
    \ the server with the ypwhich command. If everything looks right, use ypcat to\
    \ dump a map (for example, if there's a group map, use a ypcat group).\n\nIf everything\
    \ goes well, set up your files to get the information from ypbind like so:\n\n\
    ```\n*/etc/passwd*\nThe code\n\n+::::::::\n\nat the end of the passwd file allows\
    \ all users in the passwd map to log in. If you want to limit access to only one\
    \ user in the NIS passwd map, use\n\n+user::::::\n```\n\n*netgroups*\nTo allow\
    \ access to users in an NIS netgroup *ng*, add the line\n\n+@ng::::::\n\nThe netgroup\
    \ is particularly useful when you want to deny general user access to servers,\
    \ which you would typically do with this type of passwd file:\n\n```\nroot:x:0:0:root:/root:/bin/bash\n\
    daemon:x:1:1:daemon:/usr/sbin:/bin/sh\nbin:x:2:2:bin:/bin:/bin/sh\n...\n... (other\
    \ passwd entries)\n\n+@sysadmins::::::\n+::::::/usr/local/bin/noaccess\n```"
  merge: -1
  img_proc: true
- pgno: 76
  md: 'Here, sysadmins is a netgroup containing the user names of all systems administrators.
    The last line serves as a catchall so that the users are not unknown on the server.
    Failure to use proper user names will confuse or break many server daemons (Web
    servers, for instance).


    # PROBLEM 20


    Symptom: You can use ypcat netgroup, but your netgroup entries to /etc/passwd
    don’t actually seem to do anything.


    Problem: Wrong /etc/nsswitch.conf.


    Fix: If you’re going to use the netgroup at all, /etc/nsswitch.conf must have
    a line like this:


    ```

    netgroup: ... nis

    ```


    NOTE If you’re configuring Solaris NIS clients alongside your Linux clients, netgroup
    in /etc/nsswitch.conf is only valid with nis.


    # PROBLEM 21


    Symptom: Users can log in, even though you disallowed them with +@ng::::::/bin/noaccess
    in /etc/passwd.


    Problem: Wrong /etc/nsswitch.conf.


    Fix: /etc/nsswitch must have this line:


    ```

    passwd: ... compat

    ```


    On the other hand, the following will not work with the +/@ convention in /etc/passwd:


    ```

    passwd: ... files nis

    ```


    The fastest way to verify a user’s shell is with finger or with an ugly perl command
    such as


    ```

    $ perl -e ''print join(" ",getpwman(username)) . "\n"''

    ```'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# Debugging with ypcat, ypmatch, and ypwhich


    Part of debugging NIS clients is figuring out whether you’re actually getting
    the data you’re supposed to. The ypcat and ypmatch programs can help with this.
    ypcat simply dumps an NIS map to the standard output:


    ```

    $ ypcat group

    ```


    Use the -k option to ypcat to see the map’s keys in addition to its values.


    > NIS is based on dbm files, so the output you get is in no particular order.


    If you know exactly what you’re looking for and in which map to find it, use ypmatch:


    ```

    $ ypmatch key map

    ```


    This prints the value for key in map.

    If you don’t know which NIS server your machine is bound to (if any), use ypwhich:


    ```

    $ ypwhich

    ```


    # NIS Servers


    The server side of NIS consists of a collection of prototype files, dbm files
    generated from these files (these dbm files are the NIS maps when put on the network),
    some programs that perform the conversion, and the NIS server itself (ypserv).
    The NIS master server has all of these components, and they come with most Linux
    distributions. Slave servers only need ypserv, which looks at dbm files, usually
    located in /var/yp. Inside this directory, you’ll find a Makefile, your guide
    to how all the files fit together.


    Before going through how to start up the NIS server (in the next subsection, Setting
    Up the NIS Master Server), let’s explore how a file gets into NIS map format with
    /var/yp/Makefile. We’ll look at passwd because it leads to the creation of more
    than one map.


    Look in /var/yp/Makefile for the all: target (it’s about the 98th line in some
    distributions), and you’ll see passwd mentioned there. Ignore the passwd.adjunct
    for now. Now find the passwd: target (around line 123)—you’ll see that it actually
    references two more targets, passwd.byname and passwd.byuid, so go ahead and look
    for these (line 257). Skip past the MERGE_PASSWD stuff to this target:'
  merge: -1
  img_proc: true
- pgno: 78
  md: "```\npasswd.byname: $(PASSWD) $(YPDIR)/Makefile\n\t@echo \"Updating $@...\"\
    \n\t@$(UMASK); \\\n\t$(AWK) -F: '/^[^-#+]/ { if ($$1 != \"\" && $$3 >= $(MINUID))\
    \ \\\n\t\tprint $$1 \"\\t$$0\" }' $(PASSWD) | $(DBLOAD) -i $(PASSWD) \\\n\t\t\
    -o $(YPMAPDIR)/$@ - $@\n\t-@$(NOPUSH) || $(YPPUSH) -d $(DOMAIN) $@\n```\n\nThe\
    \ above looks ugly, but it’s mostly a bunch of awk commands that throw out comments\
    \ and blank lines. We can tell that the $(PASSWD) file is processed with an awk\
    \ script. The first part of the awk script is -F:, which sets the field marker\
    \ to a colon (:), which in turn tells the awk that colons separate the fields.\
    \ The next portion, /^[^-#+]/, removes any comment lines (even though you’re not\
    \ likely to have a comment in a password file). Then the if statement looks for\
    \ what it considers valid passwd entries: here, the entries with a UID greater\
    \ than or equal to whatever $(MINUID) is. If all of this checks out, the script\
    \ prints field 1 (the user name), followed by a tab, then the whole line. So if\
    \ you have the following file, and the $(MINUID) is set to 500 (the default in\
    \ many distributions), here is what you’d see:\n\n```\nroot:x:0:0:root:/root:/bin/bash\n\
    bin:x:1:1:bin:/bin:/sbin:\ndaemon:x:2:2:daemon:/sbin:\nadm:x:3:4:adm:/var/adm:\n\
    bri::ASF.P//083Ck:500:50:Brian Ward:/home/bri:/bin/bash\ndave:fsdaf.DSAfdm:501:50:David\
    \ Beazley:/home/dave:/bin/bash\njjohnson:kgfsd7Rnn.:4T:502:50:John Johnson:/home/jjohnson:/bin/bash\n\
    ```\n\nThe result of the awk in the Makefile target is:\n\n```\nbri bri::ASF.P//083Ck:500:50:Brian\
    \ Ward:/home/bri:/bin/bash\ndave dave:fsdaf.DSAfdm:501:50:David Beazley:/home/dave:/bin/bash\n\
    jjohnson jjohnson:kgfsd7Rnn./4T:502:50:John\nJohnson:/home/jjohnson:/bin/bash\n\
    ```\n\nAll of this gets piped to:\n\n```\n$(DBLOAD) -i $(PASSWD) -o $(YPMAPDIR)/$@\
    \ - $@\n```\n\nThe $(DBLOAD) command is usually /usr/lib/yp/makedbm with a couple\
    \ of arguments (the definition should be around line 107 in /var/yp/Makefile).\
    \ The entire pipeline produces the binary maps in $(YPMAPDIR) (normally /var/yp/domain),\
    \ and ypserv looks at these files. The final step in the Makefile rule for the\
    \ target passwd.byname: pushes the map to slave servers."
  merge: -1
  img_proc: true
- pgno: 79
  md: "# Setting Up the NIS Master Server\n\nFortunately, you don’t have to write\
    \ the /var/yp/Makefile by yourself. To initialize the NIS master server, first\
    \ make sure portmap (or rpc.portmap) is running. Then set the NIS domain name\
    \ with the domainname command, as described in the NIS Clients section. Finally,\
    \ do this:\n\n```\n# ypserv\n# cat >> /etc/netgroup\nfoo bar\nbar baz\n^D\n# /usr/lib/yp/ypinit\
    \ -m\n```\n\nAn interactive session will start, asking you for the next host in\
    \ the list of NIS servers to add—it wants you to specify any slave servers. Don’t\
    \ worry about slave servers for now; press CTRL-D and confirm that the information\
    \ is correct. After the verification, ypinit sets up /var/yp/domain for you (where\
    \ domain is the NIS domain name), and attempts to run make on the newly created\
    \ /var/yp/Makefile. (Note that ypinit isn’t in any of the sbin directories.)\n\
    \nDon’t panic if make fails with this:\n\n```\ngmake[1]: *** No rule to make target\
    \ `/etc/netgroup', needed by `netgroup'. Stop.\ngmake[1]: Leaving directory `/var/yp/domain'\n\
    ```\n\nThis just means Makefile wants to build a file from /etc/netgroup, but\
    \ there isn’t any file there—we put cat >> /etc/netgroup in the example above,\
    \ because it’s the only file in the default NIS configuration that doesn’t come\
    \ with many distributions.\n\nThe more general fix is to remove unnecessary targets\
    \ from Makefile if you don’t need them. The listing of all targets is another\
    \ target called all around line 98 in many systems:\n\n```\nall: passwd group\
    \ hosts rpc services netid protocols netgrp mail \\\n    #shadow publickey # networks\
    \ ethers bootparams amd.home \\\n    auto.master auto.home passwd.adjunct\n```\n\
    \nHere, netgrp is the target for the netgroup maps. Notice the comment on the\
    \ second line—it means the all target uses only the first line.\n\n> NOTE\n> If\
    \ you remove a target and do a make in /var/yp, make won’t remove the map files\
    \ for that target if they were previously there. You’ll need to either wipe them\
    \ out by hand or do another ypinit -m.\n\nConcentrate on getting your NIS master\
    \ server working reasonably well before you set up any NIS slave servers (we’ll\
    \ get to slave servers shortly)."
  merge: -1
  img_proc: true
- pgno: 80
  md: '# When You Update a File


    If you modify a file on your NIS master server, one that NIS has spread out on
    the network, you must cd /var/yp on your master server and make to build new maps
    and push them out to any slave servers. Some programs do this automatically—yppasswd,
    for example, allows users to change their password over NIS.


    Depending on how the Makefile is written, make may regenerate all of the maps,
    or it may just work on files changed since the last make. This was once a big
    deal because old machines weren’t terribly quick at making maps and spreading
    them through the network, but it really doesn’t matter anymore.


    # Slave Servers


    If you have more than one subnet with NIS clients, you must set up at least one
    server for each subnet, which means you’ll need a minimum of one slave server.
    A slave server is easy to set up. On the machine you want to act as a slave, first
    make sure portmap is running and the domainname is set. Then do


    ```

    # /usr/lib/yp/ypinit -s master_server

    ```


    where master_server is the name of your master server. The ypinit program will
    now set up a /var/yp/domain directory and transfer all of the information from
    the master. You’re not done yet—go back to your NIS master server and run


    ```

    # /usr/lib/yp/ypinit -m

    ```


    again. This time, when it asks for the next server to add, include your new slave
    server’s name.


    # PROBLEM 22


    Symptom: Lookups on small maps never return. High load average on NIS server with
    many busy ypserv processes running.


    Problem: Buggy ypserv.


    Fix: NIS maps must have at least two entries. If a map has nothing in it, or if
    it has only one entry, when you try to access that map ypserv spawns a process
    on the server, which runs until you kill it.


    # Netgroup Maps


    You won’t run into netgroups in anything but NIS. It groups machines and users
    together; while this is not the most elegant system around, it is compatible with
    most other Unix variants. Here is a sample netgroup file that can generate the
    NIS netgroup map:'
