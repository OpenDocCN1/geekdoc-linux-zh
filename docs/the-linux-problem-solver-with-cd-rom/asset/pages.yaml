- pgno: 232
  md: '# 9


    # USER ENVIRONMENTS


    # 9.1 Introduction


    Do not underestimate the importance of solid, stable user environments: Incorrect
    user startup files and environments can make good internal system configurations
    useless. Poorly thought-out defaults and examples can produce bad paths, bad aliases,
    inefficiency, and confusion.


    Another complication is the domino effect of bad startup files. Sometimes users
    who like to tinker with their environments are coming from another system, and
    they bring all their startup files with them. If they know what they''re doing,
    that''s fine. Unfortunately, they sometimes feel the urge to share their files
    with everyone, and soon you have a whole bunch of users wondering what happened
    to their environment and why they can''t read mail anymore.


    This kind of stuff happens to a certain extent no matter what you do, but you
    can reduce its frequency (and your workload) by giving people less incentive to
    change the user environment. That means writing default files so users don''t
    give them much thought. This chapter will take you through shell and window configuration
    files and demonstrate some effective, simple samples that will not break over
    time.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# 9.2 Shell Startup Files: Basics


    Messing around with a .cshrc or .login file is a good way to shoot yourself in
    the foot. For example, people sometimes put this in their startup files:


    ```

    blah

    blah

    blah

    ..

    exit

    ```


    This situation warrants a problem box right off the bat.


    # PROBLEM 107


    Symptom: The exit in a .profile [or some other startup file] unexpectedly logs
    you out.


    Problem: You think shell startup files run in subshells.


    Fix: Understand that shells, unless you explicitly tell them to start in a subshell,
    read and execute commands in startup files as they would on the command line.


    When writing a shell startup file, you need to keep in mind that a shell runs
    programs you tell it to run.


    That''s the long and short of it. To run the programs, the shell needs to know
    the locations of the programs (that is, their paths), some environment settings
    the programs require, and maybe some shortcuts you can type in as commands. Keep
    shell environments simple: There''s no need to check whether you''re on Jupiter
    and get a weather report every time you start up a shell.


    Systems administrators often use system default startup files to set environment
    variables that certain packages need to start properly. Most shells read a special
    auxiliary file (if it exists) before a user''s start-up file; tcsh reads csh.cshrc
    in /etc prior to any $HOME/.cshrc, for example.


    # Setting the Path


    The path is the most important part of a shell''s startup file. You''ll probably
    want it to include these directories, in this order:


    ```

    /usr/local/bin

    /usr/bin

    ```'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# PROBLEM 108


    Symptoms: Users wonder where environment variables come from and complain about
    being forced to use the default system startup files.


    Problem: Using a shell’s ‘system default’ startup file.


    Fix: Use customized system startup files instead. Make the default startup files
    include some code like this excerpt from a default .profile:


    ```

    # Read in some system-wide defaults

    /usr/local/etc/sys-profile

    ```


    Make sure that you document /usr/local/etc/sys-profile well, and don’t make this
    file large—if it becomes too large (say, more than 10 lines that aren’t comments),
    you’re probably doing something wrong.


    +   - /bin

    +   - /usr/X11R6/bin

    +   - $HOME/bin


    It also wouldn’t hurt to include


    +   - /usr/local/sbin

    +   - /usr/sbin

    +   - /sbin


    because programs like traceroute are in these directories, and users like to tinker
    with such utilities. However, you’d most likely be making a mistake to include
    anything else.


    All user programs should be executable from one of the four bin directories listed
    above. If they aren’t, don’t change environments around to reflect where the programs
    are, because that makes the environments much more difficult to maintain. Instead,
    create symbolic links from the programs to /usr/local/bin.


    You may also want to get rid of the /usr/X11R6/bin in the path and make symbolic
    links from the X programs to /usr/local/bin. The X11R6 name, after all, depends
    on X11R6 (X version 11, release 6), which some other version may supplant in future.


    # Dot (.)


    Then there is the matter of the dot (.) in the path. Putting the dot in the path
    allows you to run programs in the current working directory without additional
    syntax (such as using ./ in front of the program name). The trou-'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'blesome part here is that you could accidentally run a Trojan horse instead
    of, say, sl (if you mistype ls). You already know, of course, that you should
    never have the dot in your path and never put it at the front of anyone’s path.


    A further problem arises if the dot is the last directory in a path. If a user
    is working on a program in the current directory with the same name as a program
    in the path, the user ends up running the wrong program. My advice is to keep
    the dot out of the path and just field those “Hey, I compiled this from program
    but I can’t run it” questions as they come. Make a Frequently Asked Questions
