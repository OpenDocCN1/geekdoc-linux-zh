- pgno: 202
  md: '# 8


    # BACKUPS AND CRASH RECOVERY


    # 8.1 Backups: Introduction


    Tape drives are pretty much your only backup option; effective alternatives are
    hard to come by. And because tapes and tape drives are expensive, your backup
    strategy (how often you back up and what kind of backup you choose) depends primarily
    on how much money you’re willing to spend on media and hardware.


    There are two basic kinds of backups. One is a full (level 0) backup: this is
    simply a complete record of everything in a specific directory or filesystem.
    The other type is an incremental backup, which records only the changes since
    the last full backup. In other words, an incremental backup pays attention only
    to those files with a modification or creation time later than the last time you
    ran a full backup.


    The longer you wait between full backups, the larger incremental backups get (especially
    with home directories), and of course, large backups take longer and use more
    resources. You may also find it more time-consuming and difficult to track down
    files if you don’t do full backups often enough.


    You might also consider keeping some of your backups off-site. No amount of regular
    on-site backups will help if a fire destroys your building.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# What You Should Back Up


    Home directories are obviously your first priority. Administrators of large networks
    should run incremental backups on home directories once a night, with full backups
    every one to four weeks. Home directories change more than system directories,
    so regular full backups of these keep the size of the incremental backups down.


    System configuration and data are the next most important files to back up. Items
    located in etc directories, as well as select stuff in /var, change frequently,
    and you’ll want to keep track of this. Incremental backups of /etc stay at a fairly
    constant size, so you won’t need to perform full backups as often as for home
    directories.


    Locally installed software sets are next on the priority list. If you lose a package,
    it’s often not worth the trouble to look for a backup, especially since it may
    take less time to install a new version of a package than to find the old one.


    System software is the least of your worries when it comes to backups, for several
    reasons. If you have several machines and you use rdist or an alternative to maintain
    identical software on them, several complete copies of the system exist on hard
    drives throughout the network. Also, system software isn’t unique; if you back
    up your configuration files regularly, you’ll be in good shape—you probably spent
    more time working on those files than you did installing the software.


    # 8.2 A Survey of Devices


    Before going over the details of specific backup software, we first need to review
    the backup device types available. While we’ve already expressed a preference
    for tape drives, you have a few other options for backups you don’t need to do
    so regularly.


    # SCSI Tape Drives


    SCSI drives are far and away the most reliable and convenient way to back up a
    lot of data. They are also the most expensive means. Travan and DAT drives currently
    make up the low end of the SCSI drive spectrum, with DLT at the high end. If you’re
    halfway serious about backups, you’ll want a SCSI drive.


    Which one you choose depends on how fast you need it, how much capacity you require,
    and whether you have a huge amount of money to invest.


    # IDE Tape Drives


    The Linux kernel supports IDE tape drives, but you probably only want to consider
    this option if you already have such a device. You can get a low-end SCSI counterpart
    at only a slightly higher price than an IDE drive, and the price of a cheap, narrow
    SCSI controller won’t kill you. IDE tape drives have two main weaknesses: poorer,
    non-uniform driver support, and limited features—all high-end tape drives are
    SCSI.'
  merge: -1
  img_proc: true
- pgno: 204
  md: "# Removable Disks\n\nThese work adequately only for small-time, ad hoc backups.\
    \ If you have a small home directory, you can probably get away with tossing it\
    \ and your system configuration files onto a Zip, Jaz, or similar disk every now\
    \ and then with tar. Don’t get any ideas about backing up your entire system on\
    \ one, though.\n\n# CD Writers\n\nThese devices are pretty versatile; you may\
    \ have one already. If you plan to use one for backups, you’ll probably need free\
    \ disk space equal to the size of a disc. CD writers are fine for backing up home\
    \ directories and system configuration files every now and then, but for more\
    \ regular backups you’ll probably want a tape drive.\n\n# Duplicate Hard Drives\n\
    \nThis is probably the cheapest option, but it’s not the easiest to set up. Also,\
    \ it isn’t a true backup—it can’t conveniently store older archives since filesystem\
    \ changes get too large over time for disks to handle. Furthermore, if you do\
    \ buy a new hard drive, chances are you’ll end up using it as your primary hard\
    \ drive anyway because it’s bigger than any that you currently own.\n\n# 8.3 Working\
    \ with Tapes\n\nWhile tape drives have changed in size and shape over the years,\
    \ the principle behind them is still the same, and so is the Unix interface.\n\
    \n# Setting Up Your Tape Drive\n\nTo get tape drives to work, you’ll need a driver\
    \ in your kernel. In the kernel series 2.2 configuration menu (see Chapter 7),\
    \ you’ll find SCSI and IDE tape drivers in the SCSI and block devices sections,\
    \ and the QIC-80/Travan (non-IDE) type stuff under Floppy in the character devices\
    \ section. When the kernel successfully recognizes a tape drive, you get a message\
    \ like this:\n\n```\n (scsi0:0:3:0) Synchronous at 5.0 Mbyte/sec, offset 15.\n\
    \ Vendor: HP      Model: C1537A       Rev: L708\n Type: Sequential-Access    \
    \         ANSI SCSI revision: 02\nDetected scsi tape st0 at scsi0, channel 0,\
    \ id 3, lun 0\n```\n\nSCSI tape devices in /dev have st in their names (as the\
    \ message above suggests).\n\nWhen a SCSI tape doesn’t show up, three things could\
    \ be amiss. First, the SCSI tape driver may not be configured into the kernel.\
    \ The same may be true of the driver for your SCSI host adapter. In both cases,\
    \ see Chapter 7 for an explanation of how to compile the drivers into the kernel\
    \ or compile and load"
