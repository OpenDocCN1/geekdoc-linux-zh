    # /proc/scsi/


    This is somewhat like /proc/ide, but not as well-organized.


    # /proc/pci


    This is obsolete. If you run a cat on this, then a dmesg, you''ll see a message
    to that effect. Use the pciutils package, which includes lspci and other programs.


    # /proc/ioports


    A cat /proc/ioports lists the drivers that use I/O ports on the machine. This
    is handy for finding conflicts or bad configurations.


    # /proc/interrupts


    This is like the ioports above, but deals with interrupts. There is one major
    difference: Devices not currently in use do not show up in this list.


    # /proc/devices


    This indicates devices configured for files in /dev, along with their major device
