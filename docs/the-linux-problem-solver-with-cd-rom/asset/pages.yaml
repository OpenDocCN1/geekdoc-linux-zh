  md: "```\ndefine dumptype global {\n}\ndefine dumptype root-tar {\n    global\n\
    \    program \"GNUTAR\"\n    comment \"root partitions dumped with tar\"\n   \
    \ compress none\n    index\n    exclude list \"/usr/local/lib/amanda/exclude.gtar\"\
    \n    priority low\n}\n\ndefine dumptype user-tar {\n    root-tar\n    comment\
    \ \"user partitions dumped with tar\"\n    priority medium\n}\n```\n\nNote how\
    \ each define usually builds on a previous one. The global define, which you should\
    \ include in all definitions, is blank by default. root-tar has a list of settings\
    \ for a / partition (GNU tar format, indexing, no compression, and a file listing\
    \ to exclude). user-tar has almost the same structure, so its definition simply\
    \ includes root-tar. (We’ll examine these definitions in greater detail in the\
    \ \"Advanced Configuration\" section below.)\n\n# disklist\n\nThe disklist file\
    \ has a format like this:\n\n```\natlantic   /home      user-tar\nmikado     /etc\
    \       root-tar\npacific    /usr/local root-tar\n```\n\nThe first field specifies\
    \ the machine to back up (here we are backing up the machines called atlantic,\
    \ mikado, and pacific), the second identifies the target directory, and the third\
    \ names the type of dump (one of the dumptype definitions in amanda.conf; see\
    \ the previous section). To start out, you should place just one line in this\
    \ file—make it a small directory on some machine that isn’t too busy. Start small,\
