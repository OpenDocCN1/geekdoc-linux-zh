  md: '# LEXICON


    alias A type of shell shortcut designed to reduce typing (different than a mail
    alias or shell function).


    Amanda A free automated backup system.


    antialiasing A method of pixel interpolation used to smooth out "jaggies" in graphics.


    automatic kernel module loader A kernel facility that loads kernel modules as
    needed. Useful for keeping the size of the core kernel low.


    bitbucket A Unix slang term. Any piece of data thrown away goes to the bitbucket.
    The term can also refer to /dev/null, a character device that throws away any
    input it receives.


    block device A type of device where the interface is in fixed-length blocks.


    boot image A bootable image (usually of a floppy disk) that contains a kernel.


    Bourne shell /bin/sh. The standard shell on Unix systems; a standard for shell
    scripting. On Linux systems, /bin/sh is a link to /bin/bash.


    CHAP (Cryptographic Handshake Authentication Protocol) A type of authentication
    for PPP.


    character device A type of device where the interface is character-wise.


    clean bit A flag that gets set when the filesystem is clean and does not need
    a check before mounting.


    cron A system daemon that runs jobs at user-defined intervals.'
