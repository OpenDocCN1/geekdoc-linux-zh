    # 9.3 bash and sh


    One confusing thing about bash is that it reads any of a multitude of configuration
    files upon startup: .bash_profile, .profile, .bash_login, and .bashrc, among others.
    So which one do you use?


    Unfortunately, bash uses different files depending on the kind of shell it thinks
    it is. When a user interacts with the Unix command-line interface, the user''s
    shell is called an interactive shell. bash starts as an interactive login shell
    on a terminal when /bin/login invokes it (the traditional Unix login method).
    On the other hand, an example of an interactive non-login shell is one running
    inside xterm (unless you explicitly tell xterm to run a login shell).


    For login shells, bash looks for a number of startup script files and only runs
    the first one it finds. The search order is first .bash_profile, then .bash_login,
    then .profile. bash also runs any commands in /etc/profile prior to the files
    in the user''s home directory (we''ve already noted that having a file like /etc/profile
    on your system isn''t a good idea).


    For the other interactive shells, bash looks in .bashrc for commands. You''ll
    encounter many arguments among systems administrators over how to run a shell,
    and consequently which startup files to choose. Since this book advocates simplicity,
    you might guess that our recommendation is to treat the login and non-login shells
    as one and the same.'
