    \ in first ahead of any other jobs in the print queue.\n\nRelevant man pages:\
    \ psf (8), pap (1), nbp (1), getzones (1)\n\n# SMB Printers\n\nIf your printer\
    \ is on an SMB share on a Windows machine, you can use SAMBA’s smbclient program\
    \ to print to it. The printcap will look much like the one with AppleTalk:\n\n\
    ```\nsmbprinter|Printer on SMB Share:\\\n\t:mx#0:sf:sh:\\\n\t:sd=/var/spool/lpd/smb:\\\
    \n\t:lp=/var/spool/lpd/smb/null:\\\n```"
  merge: -1
  img_proc: true
- pgno: 136
  md: ':lf=/var/spool/lpd/smb/log:pw#80:\

    :lf=/usr/local/lib/filters/smbprint:


    Again, you''ll need to create a new null device:


    ```

    # mknod spoolidir/null c 1 3

    ```


    where spoolidir is the one sd specifies in the printcap (as in /var/spool/lpd/smb
    above).


    Now you''ll need to set up the filter properly. The filter is probably not installed
    in /usr/local/lib/filters. In Red Hat 6.1, for example, you''ll find it in /usr/bin,
    and if you installed SAMBA from source, it won''t be installed by default anyway
    (it''s in the source, in the subdirectory examples/printing).


    The filter is just a shell script and needs a .config file in the spool directory
    of the printer; that would be /var/spool/lpd/smb in the example above.


    The .config file looks like this:


    ```

    server=SERVER

    service=PRINTER

    password="PASSWORD"

    ```


    SERVER, PRINTER, and PASSWORD are the details of the SMB printer (you probably
    won''t need a password for printing, so you can omit that line). You may need
    to change the last line of the file to reflect where you installed SAMBA (the
    example in the source assumes you put it in /usr/local/samba/bin).


    > NOTE

    > Red Hat''s smbprint differs from the example in that it sets the SMB log file
    to /dev/null instead of /tmp/smb-print.log, and it gives the proper Red Hat location
    of smbclient


    You can use the smbclient program to look up the shares available on a machine,
    as in this example:


    ```

    $ smbclient -L printserver

    Password:

    Domain=[FOO] OS=[Unix] Server=[Samba 1.9.18p10]

    ```


    | Sharename | Type | Comment |

    |----------|------|---------|

    | printers | Printer | All Printers |

    | hp160b | Printer | HP LaserJet 5Si in room 160b |

    | ... | ... | ... |


    For this to work, the printer must support PostScript. If it doesn''t, you''ll
    need to run the file through Ghostscript before sending it off.'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# 5.4 Ghostscript for Non-PostScript Printers


    Most inexpensive printers do not have built-in PostScript support. These include
    most inkjets and a few low-end or older laser printers. However, the computer
    can often interpret and rasterize the file, ultimately sending a finished bitmap
    to the printer. Ghostscript, developed by Aladdin Enterprises, is a popular free
    interpreter and rasterizer that comes with most Linux distributions and has most
    or all of the devices configured.


    While Ghostscript supports many printers, the correct options and drivers are
    not always obvious and its documentation is messy, with information scattered
    over a number of files. Certain options—those for color inkjets in particular—significantly
    change output quality. For example, the defaults for an Epson Stylus Color 850
    are not the best for transparencies, although the printer is capable of producing
    very good results (ideally you would want unidirectional printhead movement to
    reduce streaking and perhaps a different kind of dithering from usual).


    You typically integrate Ghostscript into Linux’s print spooling system as a filter.
    PostScript goes in and printer-ready data comes out and goes to the printer. The
    filter is usually a shell script, which parses some arguments and then calls Ghostscript
    with some options. Here is a very simple script:


    ```

    ```sh

    #!/bin/sh

    /usr/bin/gs -q -dNOPAUSE -dBATCH -sOutputDevice=-- -r720x360 -sDEVICE=epson -

    ```

    ```


    The heart of this is, of course, the call to Ghostscript (gs). When you customize
    your filter, you will probably invoke gs on the command line to avoid specifying
    the many parameters that a print filter requires.


    To send the output of a run on foo.ps straight to the parallel port, run this:


    ```

    ```sh

    # gs -q -dNOPAUSE -dBATCH -sOutputDevice=/dev/lp0 -r720x360

    - -sDEVICE=epson foo.ps

    ```

    ```


    # Using the uniprint Driver


    You’ll generally want to call the uniprint driver as follows:


    ```

    ```sh

    # gs @name.upp -q -dNOPAUSE -dBATCH -sOutputDevice=device [files]

    ```

    ```


    name.upp is actually a parameter file in the Ghostscript library directory. For
    example, stc800.upp is a 720-by-720-dpi plain-paper mode for the Epson Stylus
    Color 800. The file itself is a huge listing of options that set uniprint as the
    driver and tweak the parameters for this particular printer.'
  merge: -1
  img_proc: true
- pgno: 138
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 139
  md: 'The first field of each line is the font name, with a forward slash (/) marking
    it as a symbol; the second is the font’s location; each line ends with a semicolon.
    If the second field is in parentheses, it’s a filename. Ghostscript searches for
    the font in its configured font directory or directories (use gs -help and look
    at the Search path). The fonts can be in .gf (a Ghostscript-native format), .pfa
    (plain-text specification), or .pfb (a newer binary format). If Ghostscript can’t
    find the font, it uses Courier by default (it doesn’t fail as a printer would).


    To manipulate the fonts, edit the Fontmap file and move the files into the proper
    place within the font directory.


    # Font Problems


    Certain fonts are considered standard in PostScript but, unlike the language specification,
    they’re not free—so they don’t come with Ghostscript. You can run into two problems
    here. One is that documents set for the particular metrics of one font look odd
    when you substitute another font. The other is that the font may be a bitmap,
    which doesn’t look very good scaled. (The default fonts in many distributions
    are from the URW Nimbus series; they’re scalable and have the same metrics as
    standard ones. For the most part, they work fairly well.)


    Still, the only way to get rid of persistent font mismatch problems is to get
    the correct fonts. This means you’ll either have to buy them or hope you have
    some piece of software that includes them, along with a use license. Adobe’s Type
    Basics takes you up to Level 2 and includes a license for one rasterizer. Pirating
    fonts is mean and nasty, not to mention illegal, so don’t do it.


    # Ghostscript Options


    These are some of Ghostscript’s more useful options. A gs -h also provides a quick
    reminder of them.


    # -sDEVICE=devname


    Use the output device driver devname; for example, -sDEVICE=epson selects Epson-compatible
    printers.


    # -sPAPERSIZE=papersize


    Selects the paper size (papersize may be letter, legal, a4, and so forth).


    # -r nxm or -rn


    Specifies the resolution at either n dpi horizontally and m vertically, or just
    n for both. Choosing a resolution a printer doesn’t support can have unpredictable
    results.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# -dQUIET and -q


    Ghostscript outputs some diagnostics while it parses files. -dQUIET gets rid of
    the intermediate messages and -q gets rid of the start-up messages. You''ll need
    -q in a filter as well as -dSAFER, -dNOPAUSE, and -dBATCH (below).


    # -dSAFER


    Removes file write capability. This is essential for filters; you don''t want
    people to remove and alter system files just by printing rogue files!


    # -dBATCH


    Exit after processing the last file.


    # -dNOPAUSE


    Don''t pause at the end of each page.


    # -sOutputFile=filename


    Write output to filename. You can use a few special options here for filename,
    such as %pipe%cmd, which sends the output to the cmd program, and %stdout, which
    sends to the standard output. Also, filename can have a %d in it, which means
    each page goes to a separate file with the page number substituted for %d.


    # SMB Version


    If you have to send output to a printer connected to Windows, you''ll need to
    add a Ghostscript command to your filter, setting up the filter as if it were
    a PostScript printer (see the previous section on Ghostscript).


    For example, let''s say you used the smbprint filter example that comes with SAMBA:


    ```

    ) | /usr/local/samba/bin/smbclient "\\\\$server\\$service" "$password" -U $server
    -N -P >> $logfile

    ```


    Change it to two lines:


    ```

    ) | ghostscript_command | \

