  md: "Look through this log for errors. (You’ll probably see some information about\
    \ System.map and the kernel symbols; don’t worry about this just yet as it’s related\
    \ to modules.)\n\nWhen performing major kernel upgrades, you may find that some\
    \ system tools cause the kernel to warn you that it considered what you just did\
    \ obsolete. Sometimes minor tools don’t work because of a really major change.\n\
    \nAfter you’ve tested all your hardware and system services and are sure you have\
    \ a working kernel, it’s time to replace your old default kernel image with the\
    \ new one.\n\n# LILO\n\nUnless you use a floppy disk or LOADLIN to boot all the\
    \ time, you need to know about the standard Linux boot loader system, LILO. The\
    \ configuration file is /etc/lilo.conf. This is a sample lilo.conf file, based\
    \ on one set up on a Red Hat system:\n\n```\nboot=/dev/hda\nmap=/boot/map\ninstall=/boot/boot.b\n\
    delay=50\nimage=/boot/vmlinuz-2.2.5-15\n    label=linux\n    root=/dev/hda1\n\
    \    read-only\n```\n\nThe following are the essential parameters.\n\n# boot=bootdev\n\
    \nThis is where the boot sector is written. In this example, it’s /dev/hda, which\
    \ means it gets written to the master boot record of the first hard disk on the\
    \ primary interface. If you’re using another boot loader there already, you’ll\
    \ want to put this on your Linux root partition (that is, if your /dev/hda2 is\
    \ mounted on /, /dev/hda2 is the device you want to use).\n\n# map=map_file\n\n\
    In order to load the kernel, LILO needs to know where on the disk the kernel is\
    \ located. When you run lilo, *map_file* stores the information.\n\n# install=file\n\
    \nHere, *file* is the actual boot loader program placed on the boot sector."
