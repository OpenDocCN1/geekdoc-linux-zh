    libICE.so.6 => /usr/X11R6/lib/libICE.so.6 (0x400ba000)

    libXext.so.6 => /usr/X11R6/lib/libXext.so.6 (0x4000d2000)

    libX11.so.6 => /usr/X11R6/lib/libX11.so.6 (0x4000de000)

    libm.so.6 => /lib/libm.so.6 (0x40187000)

    libc.so.6 => /lib/libc.so.6 (0x40143000)

    /lib/ld-linux.so.2 => /lib/ld-linux.so.2 (0x40000000)

    ```


    Problems arise when libraries are missing from the system, when the runtime linker
    uses the wrong library version, and when there’s an incompatibility between the
    shared library and X11 and some part of the operating system (such as the kernel).


    # PROBLEM 65


    **Symptom:** Programs fail to run, yielding an error message like


    *progname: can’t load library ‘libname’*


    **Problem:** Missing or incorrect shared library.


    **Fix:** At the very minimum, the run-time linker looks in /lib and /usr/lib by
    default. If you are compiling and linking a program against a shared library in
    a place other than the default, you need to pass special options to the linker
    (at compile time) to tell the run-time linker the library locations. These options
    are -Ldir and -Wl,-rpath=dir. Section 6.4 also explains them.


    The file /etc/ld.so.conf lists directories for the run-time linker to search in
    addition to /usr/lib and /lib. If you modify this file, you need to run ldconfig
    -v to put the changes into effect.


    > NOTE

    > Use extreme care if modifying /etc/ld.so.conf, and do not add unnecessary entries
    (that is, don’t add anything unless you really know what you’re doing). Excess
    directories can slow system performance.


    # 6.3 A Typical Source Distribution


    Source code is usually distributed as a compressed tar archive with a file suffix
    such as .tar.gz, .tar.bz2, or .tgz. Files created with gzip have suffixes of .gz
    (and sometimes, very rarely, .z). The .bz2 suffix comes from bzip2, a newer compression
    program. Finally, anything with a .Z suffix comes from the old Unix compress program;
    gzip can handle that.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# PROBLEM 66


    Symptom: Programs fail to run as in Problem 65, and no source code is available.


    Problem: Missing or incorrect shared library.


    Fix: Another way to modify the behavior of the run-time linker, one you should
    turn to only as a last resort, is the environment variable LD_LIBRARY_PATH. You
    can set this to a colon-separated list of directories, which the run-time linker
    searches to find shared libraries. Using this variable slows program start-up
    time and can lead to serious shared-library mismatches, but sometimes it''s the
    only option.


    # WARNING


    > Never set the LD_LIBRARY_PATH in any default user environment, and never, ever
    under any circumstances compile any package with LD_LIBRARY_PATH set. Your users
    will complain about programs not finding libraries and weird error messages referring
    to outdated versions of libraries.


    If you really need to use LD_LIBRARY_PATH to run a program for which you lack
    the source code—for example, a program called prog—rename prog to prog.bin and
    make prog a wrapper script like this [where libdir is the directory location of
    the shared library]:


    ```

    #!/bin/sh

    LD_LIBRARY_PATH=libdir:$LD_LIBRARY_PATH

    exec /usr/local/bin/prog.bin $@

    ```


    Relevant man pages: ldd (1), ldconfig (8), ld.so (8)


    # What to Do with Those Tarballs


    To unpack a compressed tar file (also called a tarball), do not first decompress
    the file and then run tar to extract it in two separate command lines; instead,
    do it all in one pipeline. GNU tar (which you almost certainly have on your system)
    makes the process simple for tar on gzip files with its -z option, which tells
    GNU tar to decompress the file with gzip first.


    At the moment, there is no standard way to handle .bz2 files, so you''ll need
    to do that in a pipe. Some examples follow.


    To examine the contents of foo.tar.gz, use:


    ```

    $ tar -ztvf foo.tar.gz

    ```


    To extract the contents of bar.tar.bz2, use:


    ```

    $ bunzip2 -dc foo.tar.bz2 | tar -xvf -

    ```'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'tar''s -t option examines the archive''s table of contents; -v tells tar to
    be verbose (give more detailed output), and -f says that what immediately follows
    is the file name. A dash (-) for the file name signifies that input comes from
    the standard input ("stdin"). In the second example, tar''s standard input is
    the output of the bunzip2 command. You might also use the -p option, which preserves
    the file permissions in the tar file.


    These options to tar may be the only ones you ever use, but if you need more information
    you''ll find the current documentation for GNU tar in an info file (try info tar
    or access the page within emacs). Beware: The current documentation can be spotty.


    # Examine the Table of Contents


    Before unpacking any source, have a quick look at the table of contents to see
    if it all unpacks into one directory. If the -tv (view table of contents) options
    show something like


    ```

    package-1.23/Makefile

    package-1.23/main.c

    package-1.23/bar.c

    ...

    ```


    you''re in good shape. Extraction will create a new directory package-1.23 containing
    all the source files. However, if you get something like


    ```

    Makefile

    main.c

    bar.c

    ...

    ```


    and you extract just like that, the files Makefile, main.c, bar.c, and the rest
    of the distribution land in your current directory. (This can be really annoying,
    and most developers are aware of it.) The fix is simple—create a new directory,
    cd to it, and then extract the distribution.


    # Corrupt Files


    Watch out for files that begin with a forward slash (/). If the contents include
    such items as


    ```

    /etc/passwd

    /etc/inetd.conf

    ```


    you''ve downloaded a corrupt tar file. Remove it from your system.

    Relevant man pages: gzip (1), bzip2 (1)'
