    Submenus organize the configuration options. The rest of section 7.2 covers specific
    configuration options, which are current as of kernel 2.2; new releases will almost
    certainly bring changes.


    > NOTE

    > The default configuration file is /usr/src/linux/.config, and /usr/src/linux/.config.old
