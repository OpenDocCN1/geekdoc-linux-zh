    ```

    # echo 1 > /proc/sys/net/ipv4/ip_forward

    ```


    Set a default policy of DENY for forwarding:


    ```

    # ipchains -P forward DENY

    ```


    Accept any input (including that for the firewall machine) and forwarding from
    10.1.20.0 to the outside world:'
