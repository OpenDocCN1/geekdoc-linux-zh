- pgno: 215
  md: "# PROBLEM 97\n\nSymptoms: Tape capacity exceeded. Underused tape capacity.\n\
    \nProblem: Incorrect tape geometry specification.\n\nFix: The geometry settings\
    \ are important to get right, because Amanda may write too much to a tape if it\
    \ thinks the tape is longer than it is. You should find this information in manuals,\
    \ but if you're having trouble locating it (either in your tape drive's manual\
    \ or in the default amanda.conf file), have a look at the tapetypes list link\
    \ on the Amanda home page.\n\nNext, change the definition for the holding disk\
    \ (a large disk partition for storing backup data before writing it to tape).\
    \ The default looks like this:\n\n```\nholdingdisk hdi {\n  comment \"main holding\
    \ disk\"\n  directory \"/dumps/amanda\"\n  use 290 Mb\n  chunksize -1\n}\n```\n\
    \nChange /dumps/amanda to some directory where you have enough disk space; you\
    \ should call it amanda (or some other identifying name), because you'll be creating\
    \ a number of things inside this directory. Don't bother with the chunksize parameter\
    \ for the moment, since you'll start out with one holding disk.\n\nNow change\
    \ the index and log locations:\n\n```\ninfofile \"/usr/adm/amanda/DailySet1/curinfo\"\
    \   # database DIRECTORY\nlogdir  \"/usr/adm/amanda/DailySet1\"            # log\
    \ directory\nindexdir \"/usr/adm/amanda/DailySet1/index\"     # index directory\n\
    ```\n\nUnder Linux, /usr/adm isn't the standard place to put items of this nature,\
    \ so use another place, such as /var/log/amanda. Make sure, however, that you\
    \ have enough disk space. If you've got a significant number of machines and files\
    \ to back up, the index files can grow to tens of megabytes.\n\nPrior to running\
    \ any Amanda programs, make sure the directories you've set for the database,\
    \ index, and log locations exist.\n\nAfter the tapetype definitions, you'll come\
    \ across a number of dump type definitions with this structure:"
