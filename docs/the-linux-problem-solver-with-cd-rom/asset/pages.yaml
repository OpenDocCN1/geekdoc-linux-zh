    /dev/hda1  /          ext2  defaults      1 1

    /dev/hda2  swap        swap  defaults      0 0

    /dev/hda4  /home       ext2  defaults      1 2

    /dev/hdd   /cdrom      iso9660 ro,noauto,nosuid,user 0 0

    /dev/sda4  /zip        ext2  rw,noauto,nosuid,user 0 0

    ```


    The first and the second fields (columns) are the device and where to mount it.
    The third is the filesystem type, and the fourth contains options for mount. The
    options seen here include:


    +   default  Use default options.

    +   ro       Mount the filesystem read-only.

    +   rw       Mount the filesystem read-write.

    +   nosuid   Disable any suid (setuid) bits found on the filesystem. If you allowed
    users to mount a removable disk (such as a Zip disk) with some suid-root program
    on it, they would be able to romp all over the system—you probably don’t want
