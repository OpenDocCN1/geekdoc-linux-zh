  md: '# PROBLEM 110


    Symptom: You experience frustration and rage at users when they ask you to restore
    files they removed.


    Problem: Users remove files when you alias rm to rm -i.


    Fix: Don''t alias rm with the -i argument, because every time you use it, rm -i
    asks if you really want to remove a file. When confronted with this every time
    they want to remove a file, users develop an automatic reaction of yes. Two other
    commands that take the -i option, cp and mv, provide better protection against
    inadvertent removal of files.


    # Default Programs: Shells, Editors, and So On


    Which default programs should you include in new user accounts? This section provides
    a brief overview and recommendations on the essentials.


    # Shells


    Originally, the only two real choices for shells were sh and csh. Since the barebones
    sh was a bit trying as an interactive shell, csh quickly gained popularity as
    a login shell (with some carryover to tcsh), and it has stuck.


    It''s time to get rid of this habit. You should use bash as the login shell for
    all new users. The only real reason anyone ever used csh was because of its extra
    interactive features (such as command history). bash supports this stuff, and
    there are some very compelling reasons to use bash and not inflict csh or tcsh
    on people.


    +   - Some users have a tendency to write shell scripts in their login shells
    because that''s what they are used to. As a systems administrator, you should
    be more than aware that csh is a really awful tool for writing scripts. If you
    need serious convincing, have a look at http://www.faqs.org/faqs/unix-faq/shell/csh-whynot/.

    +   - tcsh can be frustratingly slow because it tries to second-guess you all
    the time. It can also get behind on system updates, as evidenced by the fact that
    it needs a built-in rehash.

    +   - bash uses GNU readline. Though readline is really kind of a beast, many
    people already know how to use it, and that familiarity counts in its favor.

    +   - tcsh is not as standard on Linux systems as bash. It''s true that on other
    flavors of Unix, bash doesn''t come with the operating system, but tcsh doesn''t,
    either.'
