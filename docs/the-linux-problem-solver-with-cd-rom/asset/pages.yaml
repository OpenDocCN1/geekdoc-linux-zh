    # A Few Startup File Don''ts


    To avoid headache and frustration with your start-up files, follow these rules:


    +   - Don''t put X commands in shell startup files.

    +   - Don''t set the DISPLAY environment variable in shell startup files.

    +   - Don''t set the terminal type in a default shell startup file.

    +   - Don''t give default shell startup files without good comments.

    +   - Don''t print anything in shell startup files.

