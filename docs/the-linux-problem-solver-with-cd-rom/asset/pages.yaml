    # Tape Cycle Options


    Incremental backups, occurring in cycles, reuse old tapes. Every now and then,
    you should do a full backup so the size of the incremental backup doesn''t become
    overwhelming. How long a cycle you choose depends more or less on how many tapes
    you want to buy. With a larger incremental backup cycle, you have more of a likelihood
    of recovering files or modifications between full backups, but the chance that
    you''ll want files from an incremental backup drops drastically after a a few
    weeks. Many sites use four weeks as the basic cycle.


    Here''s a rundown of the basic tape cycle options:


    # runspercycle n


    Sets the number of backups per cycle to n. This does not have to correspond to
    a scheme that includes a daily backup. You may set up your crontab to have amdump
    do incremental backups every other day or skip them on the weekend, for instance.


    # tapecycle n


    Each run gets at least one tape. If you set tapecycle to more than runspercycle,
    you can perform multiple-volume backups. However, this may be useless for incremental
    backups unless you have a tape changer, since they normally run when no one is
    around to put a new tape in the drive.


    # dumpcycle n


    This parameter controls how often a directory or filesystem gets a full backup;
    a full backup occurs at least once every n days, so n tells you how long the dump
    cycle is (in days).


    # Network Regulation Options


    It''s important to keep control of network usage for two reasons. First, if you
    try to push your machines harder than they can go, backups take longer. Repeated
    disk usage is system-intensive, especially if you''re running low on memory. Also,
    if the network is active at the time of backups, users'' work and external services
    slow down, sometimes to a crawl.


    These options have the most impact on system resources:


    # inparallel n


    This is a cap on the number of backups you can run at once. You should probably
    set this only if you have an overloaded tape server.


    # maxdumps n'
