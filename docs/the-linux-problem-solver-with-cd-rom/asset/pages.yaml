    at once, especially if one of the disks is a system disk or has active swap space
    (even if you don’t thrash the machine, you’ll slow it down). To allow finer control
    of which disks and machines to back up in parallel, you can also change maxdumps
    on a per-backup basis by including it in a dumptype declaration in the amanda.conf
    file (and then choosing the appropriate dump type in the disklist file). There
    is no precise formula for calculating maxdumps; in practice, it should turn out
    to be roughly the number of disks per machine you’re backing up.


    # netusage limit


    Specify limit in terms of network usage per second, as in 1000 Kbps. Remember
    to keep an eye on the default value, as it may be far too small for a modern system.


