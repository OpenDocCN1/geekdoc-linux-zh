    \n# Mouse Support (not serial mice)\n\nSelecting this enables a Mice submenu.\
    \ Most modern mice use the so-called PS/2 port, for which the device is /dev/psaux.\
    \ This submenu is not for mice that hook up to a serial port.\n\n# Filesystems\n\
    \nIt's fairly safe to compile most filesystems as modules, except for the second\
    \ extended and /proc filesystems (see below); you will almost certainly need to\
    \ compile these directly into the kernel (in fact, you're not even allowed to\
    \ build /proc as a module).\n\n# DOS FAT fs Support\n\nSelecting this enables\
    \ a few filesystems that use FAT, including the MS-DOS file system, UMSDOS (an\
    \ extended MS-DOS filesystem), and the newer VFAT."
