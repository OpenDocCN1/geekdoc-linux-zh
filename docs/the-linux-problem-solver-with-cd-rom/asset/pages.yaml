  md: 'The port !telnet argument tells tcpdump not to print anything related to the
    telnet port. The first line of real output tells us that port 6000 on atlantic
    is talking to our port 1025. The X Window System uses port 6000; we sent an xterm
    from 10.1.1.100 to atlantic and moved the mouse over the window to generate the
    packet corresponding to that line. Just below, you''ll see something interesting:
    our machine asks alexandria.cs.uchicago.edu for the PTR record for 10.1.1.100.
    Here tcpdump itself tried to find out the name of the machine it''s running on!
    (To make this work, we didn''t put 10.1.1.100''s name in its own /etc/hosts file).


    If you''re on a shared network, tcpdump allows you to look at the packets of anyone
    else on that network, but it''s generally in bad taste to do so. You can only
    use tcpdump as root.


    # host


    The host command is a quick way to look up host names and their IP addresses with
    DNS. Unlike most similar programs, host makes a guess as to what kind of record
    you desire. Here are some examples:


    ```

    $ host atlantic

    atlantic.example.com has address 10.1.1.1

    ```


    ```

    $ host 207.6.140.17

    17.140.6.207.IN-ADDR.ARPA domain name pointer www.userfriendly.org

    ```


    ```

    $ host printserver

    printserver.example.com is a nickname for atlantic.example.com

    atlantic.example.com has address 10.1.1.1

    atlantic.example.com mail is handled (pri=10) by postfix.example.com

    ```


    # dig


    A more powerful tool than host, dig produces the same kind of output that the
    name server expects as input. You use this tool on the command line; it''s very
    straightforward but somewhat strict about its arguments, and can yield hard-to-parse
    results. Try these examples on your machine:


    ```

    $ dig mx flonk.net @ns1.netaxs.com

    $ dig any slashdot.org

    ```


    The second example gives you an "Answer Section" that lists some name servers
    (they''re after the IN NS part). If you want more specific information on a record,
    you have to ask one of those servers. Pick the first one and try


    ```

    $ dig any slashdot.org @nameserver

    ```


    # nslookup


    This is the traditional DNS query program, and it''s almost sure to appear on
    any system you come across. You can use nslookup directly on the command line
    or in a more interactive mode. You usually have to know what kind of record you''re
    looking for to use nslookup (see the examples below).'
  merge: -1
  img_proc: true
