- pgno: 164
  md: 'vi                /usr/bin/vi

    maildirectory     /var/spool/mail

    utmp file         /var/run/utmp

    wtmp file         /var/log/wtmp

    lastlog file      /var/log/lastlog


    # Imakefiles


    The problem of interplatform differences prompted the authors of the X Window
    System to come up with their own configuration scheme. The result was the Imakefile.
    The imake program works with templates that run through the C preprocessor (cpp)
    to create a Makefile with the definitions for the particular system on which you’re
    building. The advantage of imake is that it uses a standard tool that already
    exists on Unix systems. The disadvantage is that it’s not terribly flexible. It
    doesn’t look around the system as an autoconf-generated configure script would;
    it simply trusts few configuration files. It also doesn’t usually present too
    many options for where to install a package.


    You’ll rarely call imake by itself. You’ll use xmkmf, a shell script that calls
    imake with the (presumably) correct options for the system you’re on. When you
    have a number of subdirectories with Imakefiles in them, some larger packages
    want an xmkmf -a to take care of all of the subdirectories and Imakefiles. Occasionally,
    there are configuration options in the Imakefile; as always, you should look over
    any installation instructions in advance.


    After imake creates the Makefile, the next step is to do a make. Once you’ve completed
    that, you’ll end up with the usual bunch of object files and programs. However,
    if the program is true to form with respect to the X Window System, you may not
    be able to run it successfully out of the build directory. To do so, you’ll first
    need X resources (run-time configuration parameters), usually from an app-defaults
    file. We’ll get back to this point.


    # Installing


    The easiest way to test software is to install it. Unfortunately, if a program
    uses an Imakefile, it rarely presents the option to install it in any way but
    with a prefix of your current X root tree (usually /usr/X11R6). If you run a make
    install, the programs go into the prefix/bin directory, X resources go into the
    prefix/lib/X11/app-defaults directory, and perhaps some other files are thrown
    into the mix. A make install does not include the installation of manual pages,
    so run a make install.man to put them in place.


    If you follow this convention, you probably won’t have to do anything else, and
    you’ll have the program in place with the shared libraries and other files it
    needs to run properly. However, even a minor upgrade of your X installation might
    delete the program, forcing you to reinstall it. But because the number of programs
    that use imake is diminishing, you may want to keep track of what you install
    with imake and hold on to the source code, since digging it up again could take
    some time.'
  merge: -1
