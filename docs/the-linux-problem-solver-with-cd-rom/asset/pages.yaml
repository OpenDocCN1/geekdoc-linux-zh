    # PS1=''\w$ ''

    ```


    # PROBLEM 109


    Symptom: "Spontaneous file creation" confuses users.


    Problem: A greater-than sign (>) occurs at the end of new users'' prompts.


    Fix: Don''t use this sign at the end of a default prompt. New users tend to have
    clumsy fingers. If they''re using a program like xterm, they''ll probably have
    difficulty with the cut-and-paste interface. If the greater-than sign appears
    in the prompt, errant pasting of xterm text can create and wipe out useful file
    and program content—and the hapless user has no idea what''s going on.


    Keep in mind that it''s not a great idea to include the working directory in the
    prompt. The directory takes up a lot of real estate on a command line and can
    be quite distracting.


    # Aliases


    You can easily get carried away with putting aliases in default files. It''s all
    too tempting to provide a huge number of aliases and expect these aliases to help
    your users with day-to-day tasks and even familiarize themselves with the system.
    This is not a very good approach. Your aliases will not only have sparse online
    documentation, but if you intend them as universal shortcuts, they will discourage
    users from exploring Unix systems. Whatever you do, don''t use aliases to start
    up big, complicated packages with special options—the packages won''t work consistently
    and reliably. Instead, use shell script wrappers to force environment variables
    and options before starting the package itself.


    That said, you should perhaps provide a small set of aliases in start-up files
    to serve as examples. Most users want a few comfortable shortcuts, and they''ll
    want to know how to create them. If you have inexperienced users, you may wish
    to alias cp and mv to include the -i argument, but don''t push it beyond that.
    Also, don''t put aliases in any system startup files (this confuses users because
    they don''t understand where the aliases come from).'
