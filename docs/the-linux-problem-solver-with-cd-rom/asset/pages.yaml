- pgno: 40
  md: '# pppd Options


    If you peruse the pppd manual page, you''ll notice quite a few options you can
    put into the files in /etc/ppp/peers (or specify on the command line). This section
    is an outline of the most important ones. The first two should be the device and
    serial port speed.


    # Device


    Choosing the device (that is, ttyS1 or /dev/ttyS1), unless you''re using call
    to specify a configuration file, is the first option in pppd. Although you can
    just use something like ttyS1 and have pppd prepend /dev/ to it, it''s best to
    use the full path name, as it makes the device path completely clear.


    # Serial Port Speed


    With modern modems, you want a speed higher than your modem''s connection speed.
    For 56-kbps modems, your serial ports should probably be set to at least 115200
    baud unless they just can''t support that rate. In general, the higher the baud
    rate, the better, but if you set it too high, the modem and/or the serial port
    may drop characters, resulting in a much slower (or even nonexistent) connection.


    # Other Options


    Besides the device and serial port, there are a number of other pppd options.


    defaultroute Sets the default route for the PPP interface. If you don''t use it
    (for example, if you''re dialing up a leaf site somewhere), you''ll need to set
    your own route with the route command to get to hosts beyond the remote PPP server.


    noauth Disables authentication on the other end of the connection. Since your
    remote server may not support authentication, you might need this. This refers
    to authentication over the PPP protocol, so if you use a chat script to dial and
    login to the server, it''s likely that you don''t need this.


    # PROBLEM 4


    Symptom: pppd runs, but you can''t reach anything except the remote server.


    Problem: No default route.


    Fix: If you have only one ISP and you dial up to it with PPP, you need the defaultroute
    option.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'connect command With a command, initializes the connection before PPP initiates
    on the remote side. Usually an invocation of the chat command—for example, connect
    ''/usr/sbin/chat -v -f /etc/ppp/chat-isp''.


    nodetach Normally, pppd acts as a real daemon and forks off into a background
    process while running. The nodetach option disables this forking off—handy for
    debugging, as it makes pppd interruptible immediately with CTRL-C.


    mru number Defines the maximum receive unit (mru), which tells the remote server
    not to send any chunks of data larger than number bytes. The size you set depends
    on how fast your connection is; the default of 1500 bytes is fine for modem speeds
    such as 33.6k baud.


    mtu number pppd won''t transmit chunks of data higher than the number bytes you
    set here. (The default is 1500 bytes.) Tweak this value (usually by lowering it)
    when you''re having difficulty uploading data onto a remote machine or when your
    connection seems slow (even if it''s only via modem). (Note that the quality of
    phone lines and switches often limits the capacity for sending data back through
    the line.)


    # PROBLEM 5


    Symptom: Some programs cannot send or receive data at all.


    Problem: mtu and mru too low.


    Fix: You need to set the mtu and mru higher. In general, settings of lower than
    1300 bytes will cause problems with many applications (like scp).


    # PROBLEM 6


    Symptom: Connection often hangs or drops. ARQ light on modem often blinks.


    Problem: Poor switch or telephone line.


    Fix: If you can''t find a problem with the wiring in your building, you''ll have
    to work with the phone company. Sometimes the problem is a poor connection to
    the building, but often the company''s overloading the phone switch. If you notice
    a lot of static when you''re using the voice phone, see if you can get the phone
    company to put you on a better switch.'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'name name Forces pppd to use name as the username for CHAP or PAP (see the
    sections on PAP and CHAP).


    remotename name Forces pppd to recognize the remote server as the name you enter
    here (see the sections on PAP and CHAP).


    debug Turns on connection logging with the syslog. The facility will be daemon
    and the level will be debug. (See Section 1.3 for more information on syslog.)


    # PROBLEM 7


    Symptom: No pppd messages in any log files.


    Problem: /etc/syslog.conf not configured to log messages from daemon.debug.


    Fix: Some distributions (like Red Hat) don''t log many services. Add a line like


    ```

    daemon.debug; /var/log/daemon

    ```


    to your /etc/syslog.conf file, and send a hang-up signal to syslogd:


    ```

    # kill -HUP `cat /var/run/syslogd.pid`

    ```


    # Serial Devices


    One way to find information on your serial ports in /dev is to look at the names;
    the files with names that start with ttyS are your serial ports. What DOS calls
    COM1: (IRQ4, port 0x3f8) is /dev/ttyS0; COM2 (IRQ3, port 0x2f8) is /dev/ttyS1.
    (The command cat /proc/ioports is another way to view their current configuration,
    but /proc/interrupts shows only the active devices; if a serial port isn''t in
    use, it will not show up there.)


    Machines with fewer than two serial ports are prone to misconfiguration; similarly,
    machines with more than two ports can have problems if ports share interrupts.
    If on bootup dmesg gives incorrect IRQs and reconfiguring your serial ports fails,
    set up your ports manually with setserial (usually in /bin). Here''s an example:


    ```

    # setserial /dev/ttyS3 irq 5

    ```


    In addition to the other options (such as those pertaining to I/O ports), the
    setserial manual page includes a good overall explanation of serial ports.


    > NOTE The devices /dev/tty1, /dev/tty2, and so on are the virtual consoles of
    your Linux machine. Don''t mistake them for serial ports.'
