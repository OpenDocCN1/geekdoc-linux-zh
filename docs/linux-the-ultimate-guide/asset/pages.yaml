  md: '# KDE PLASMA 5


    It is the fifth and current generation of the visual workspace environment created
    by KDE, mainly for Linux systems. KDE Plasma version 5 is the successor of KDE
    Plasma 4 and was released on July 15, 2014.

    It includes a new theme, known as "Breeze," and increased convergence across different
    devices. The graphical interface was migrated to QML, which uses OpenGL for hardware
    acceleration, which resulted in better performance and reduced power consumption.
    Its Mobile is a Plasma 5 variant for Linux-based smartphones.


    # Software Architecture


    KDE Plasma version 5 is built using Qt 5 and KDE Frameworks 5. It improves support
    for HIDPI displays and a convertible graphical shell, adjusting KDE 5.0 also includes
    a new theme. Qt 5''s QtQuick 2 uses a hardware-accelerated OpenGL scene graph
    to compose and render graphics on the screen, allowing the offloading of computationally
    expensive rendering tasks onto the GPU, freeing up resources on the system''s
    main CPU.


    It uses the X Window System. It supports Wayland was prepared in the compositor
    and planned for a later release. It was created initially available in the 5.4
    release. Stable support for an introductory Wayland session was provided in the
    5.5 release (December 2015).


    Support for NVIDIA proprietary driver for Plasma on Wayland added in the 5.16
    release (June 2019).


    # Development


    Since the KDE Software Compilation split into KDE Plasma, KDE Frameworks, and
    KDE applications, each subproject can develop at its own pace. KDE Plasma 5 is
    on its release schedule, with feature releases every four months and bugfix releases
    in the intervening months.


    # Workspaces


    The latest Plasma 5 features the following workspaces:


    +   - Plasma Desktop for any mouse or keyboard driven computing devices like desktops
    or laptops


    +   - Plasma Mobile for smartphones'
