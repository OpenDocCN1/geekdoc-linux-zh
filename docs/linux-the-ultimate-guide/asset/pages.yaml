  md: '# 244 Linux


    # History


    LXDE developer Hong Yen Yee tried Qt in 2013 and released the first version of
    Qt-based PCMan File Manager on March 26, 2013. He clarified, however, that this
    means no departure from GTK to LXDE, saying “GTK and Qt versions will stay together.”
    He later installed the Xrandr front-end LXDE on Qt.


    On July 3, 2013, Hong Yen Yee announced the Qt port of the full LXDE suite, and
    on July 21, Razor-qt and LXDE announced their decision to merge the two projects.
    This integration meant that GTK and Qt versions lasted only a short time, but
    eventually the GTK version deployment was canceled, and all efforts were focused
    on the Qt port. The combination of LXDE-Qt and Razor-qt was renamed LXQt, and
    the first release, version 0.7.0, was made available on May 7, 2014.


    With the release of 0.13 on May 21, 2018, the LXQT project was officially separated
    from LXDE by moving to a separate GitHub organization. It uses Openbox as its
    default window manager.


    In order to differentiate between LXDE and LXQT, we must first talk about a toolkit.
    The toolkit provides a way to draw the app’s visual interface consistently. In
    addition to the toolkit, engineers should create and configure toolbar buttons
    and drop-down menus for each application. On Linux, there are two main tools:
    GTK + Qt.


    LXDE uses GTK + 2, which is a very old code. GTK + 3 has been around since 2011.
    LXDE Maintenance Hong Yen Yee had problems with some changes to the GTK + 3, so
    he released a GT-based hole in 2013. Shortly after that, a LXDE version with a
    separate desktop interface Razor-qt merged to form LXQt.


    # What Is LXQt?


    Desktop location is what you see on screen. The panel is a way to organize applications
    in windows and allows you to move them around.\ Windows and macOS all have desktop
    space. On Linux, there are multiple desktop areas. You can change desktop interactions
    using the same program, background library, and Linux kernel. Linux-based applications
    prefer a desktop environment that will be used automatically. Allow you to select
    your favorite desktop location, while others are outside the desktop area. There
    is a human personality called Lubuntu that provides a desktop environment for
    LXQt. There is also the LXQt version of Fedora. If you are using any Linux-based
    operating system, you must install LXQt.'
