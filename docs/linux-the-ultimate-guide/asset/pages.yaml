    # Overview


    The Cinnamon desktop environment is a vast development project. Between 2006 and
    2010, the most prominent Linux Mint desktop space was GNOME 2. It was very stable
    and trendy. In 2011, Linux Mint 12 could not be shipped via GNOME 2. The upcoming
    GNOME team released a brand-new desktop (GNOME 3 "GNOME Shell") using the latest
    technology (Clutter, GTK3), which had a completely different design, and we used
    a very different paradigm than the one used before the same word spaces and therefore
    could not be installed near GNOME 2. After the decision from Debian to upgrade
    GNOME to version 3, GNOME 2 was no longer available in Linux Mint. To address
    this, two new projects were launched.


    A project called "MATE" was started by an engineer named Perberos. His goal was
    to redesign and repack GNOME 2 to its original form. Linux Mint started a project
    called "MGSE." Its goal was to upgrade the GNOME 3 extensions to replace some
    of the lost and found functionality in GNOME 2 (panel, systray, application menu,
    alt-centric tab selector, window-list, etc.).


    Linux Mint 12 has been distributed on both MATE and GNOME3 + MGSE. Six months
    later, after a huge amount of work, MATE was stable, and from the extension set,
    MGSE became a GNOME 3 fork called Cinnamon. Linux Mint 13 was the first release
    for the Cinnamon desktop deployment. Since Linux Mint has a MATE and Cinnamon
    system, both provide users with a desktop, one forked GNOME 2 and the other for
    and based on GNOME 3.


    Other recent improvements include the following:


    +   Desktop grid, wildcard support for file search, multi-process settings daemon,
    desktop actions on panel launcher, various desktop management processes, and file
    manager in Nemo.'
