  md: '# Appraisal


    BUNTU AND OTHER LINUX distro systems took the open-source and the IT world by
    storm in the early years. They support various desktop environments such as GNOME,
    KDE, MATE, and more. The operating system could have grown into a fully featured
    desktop and server offering that has won users'' hearts globally. Besides the
    solid technical platform and impressive dedication to quality, desktop environment
    (DE), e.g., MATE, GNOME, LXDE, KDE, enjoys success because of its vast community
    of enthusiastic users who help support, document, and test every point of Linux
    landscape. The term used in this chapter is the desktop environment.


    So is DE? A desktop environment is the desktop metaphor of a bundle of programs
    running on top of an operating system that shares a standard graphical user interface
    (GUI). It is described as a graphical shell. The desktop environment mainly was
    on personal computers until mobile computing. Desktop GUIs help the user quickly
    access and edit files, while they usually don''t provide access to all of the
    features in the underlying operating system. Besides, the traditional command-line
    interface (CLI) is still used when complete control over the operating system
    is required.


    It consists of various icons, windows, toolbars, folders, wallpapers, and desktop
    widgets. A GUI provides drag and drop functionality and other features that complete
    the desktop metaphor. The desktop environment aims to be a way for the user to
    interact with the system using concepts similar to those used to interact with
    the rest of the world, such as buttons and windows. This is the piece users are
    interacting with. There are many desktop areas (GNOME, Cinnamon, Mate, Pantheon,
    Enlightenment, KDE, Xfce, etc.). Each desktop includes built-in applications (such
    as file managers, configuration tools, web browsers, and games).


    You have the official guide to these unique desktop environments in your hands.
    Each of us working on this book has shown a high level of'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# 262 Appraisal


    technical competence and shares this knowledge with you all. We gathered together
    to create a book that offers a solid understanding of the essential points of
    Ubuntu and explains the fundamentals along with the other LXDE, Budgie, Cinnamon,
    or other details.


    This book varies in the coverage of various topics. This is intentional. Other
    books do not cover some topics, and those topics deserve more coverage here. There
    are some topics that power users master. Other topics are things the power users
    should know about. They can understand some history, other options, or what they
    need to listen to further discussions with different technical views without being
    confused.


    This book is planned for intermediate and advanced users or those who want to
    middle and advanced users. Our goal is to give you the right direction, to help
    you enter the higher stages by telling you to use many tools and methods as possible.
    We give you thoughts and methods to consider so that you can seek out. Although
    the content of this book is for intermediate to advanced users, users who pay
    attention will benefit from each chapter as all chapters are related. The central
    pointer is that more detailed or related information is provided at the end of
    each chapter.


    This book helps you to learn these skills and tells you how to learn more about
    your system, Linux, with the software including Ubuntu Distros with the desktop
    environment. Most importantly, it enables you to overcome your fear of the system
    by telling you more about it and how it works. You can also install other Linux
    distros like Fedora, OpenSense, Manjaro, etc.


    This book is not a pure reference book but properly guides you with step-by-step
    procedures for performing tasks. This book is organized by topics and includes
    many useful commands.


    Chapter 1 discusses the basic understanding of the desktop environment, and its
    features also have specific terms like GUI, CLI, TUI. The chapter describes the
    vast resources available to support this book. You will also get a brief knowledge
    of DE history, features, and some pros and cons.


    Chapter 2 gives a quick review of the KDE Plasma introduction installation, describes
    valuable commands such as apt-get snap, and gives some brief knowledge of the
    user interface, core projects, and version history environment system.'
  merge: -1
  pgno: 290
- img_proc: true
  md: 'Appraisal ■ 263


    Chapter 3 provides a quick review of the GNOME introduction, installation, GNOME-based
    distros, pros, and cons, and also gives some brief knowledge of the GNOME user
    interface.


    Chapter 4 discusses XFCE desktop environment, its versions, history, main components
    of XFCE, installation, advantages, and disadvantages.


    Chapter 5 discusses other MATE desktop environments, version history, main components
    of MATE, installation, advantages and disadvantages, and another operating system
    for MATE.


    Chapter 6 provides you with knowledge of the other Budgie desktop environment,
    its version history, main components of Budgie, installation, advantages, and
    disadvantages.


    Chapter 7 discusses Cinnamon, its version history, main components of Cinnamon,
    libraries, core components, installation, advantages, and disadvantages.


    Chapter 8 discusses LXDE, its version history, main components of Cinnamon, libraries,
    core components of the software, reasons to use LXDE, installation, also with
    Lubuntu distribution.


    Chapter 9 discusses other DEs such as Pantheon, Enlightenment, and LXQt, version
    history, main components, and features.


    In other words, this book provides a Linux desktop environment on any Linux-based
    distribution system.'
