    API will probably not freeze until it is released in 1.0.0 (currently version
    0.7.1)!


    # Tumbler – Thumbnail Service


    Tumbler is a DBus for requesting icons for various URI programs and MIME types.
    The DBus icon management is described below. The DBus icon management specification
    is the standard DBus API to handle icon creation.


    With DBus specification for thumbnail, applications do not have to manage thumbnails
    themselves. When an icon is found, they can send the icon function to a special
    service. The service dials when it has finished producing the thumbnail.

    This service has benefits:


    +   - There is no need to link sophisticated software pieces to applications that
    work with icons.

    - The possibilities for closed format icons (which may be patented) coexist with
    free desktop software (just) that wants to display files as thumbnails.

    - Reuse of existing infrastructure instead of having all the applications redesigned.'
