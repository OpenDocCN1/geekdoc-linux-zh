    # XDM


    It contains a collection of X indicators, which may be on a local host or remote
    servers. The xdm design was guided by the requirements of the X terminals and
    the standard XDMCP of the Open Group, the X Display Manager Control Protocol.
    It provides services similar to init, get, and login to character terminals: password
    entry and password, authentication and use "session." XDM provides specific login
    information.


    # X DISPLAY MANAGER PROTOCOL


    The Display Manager Control Protocol (XDMCP) uses the UDP 177 port. The X server
    requests the display manager to start the session by sending a query package.
    If the display manager allows access to X server, it responds by sending the favorable
    package back to the X server. The display manager should verify himself on the
    server. To do this, the X server sends the application package to the display
    manager, which returns the Receive package. The display manager is authorized
    if the Accept package contains the X server response. For example, generating
    the correct response may require the display manager to have access to a private
    key. The X server sends a Manage package to notify the display manager if verification
    is successful. The display manager then displays its login screen by connecting
    to the X server as a normal X client. During the session, the server may send
    KeepAlive packets to the display manager from time to time. Suppose the display
    manager fails to respond to the Alive packet within a certain time. In that case,
    the X server assumes that the display manager has stopped working and may terminate
    the connection.


