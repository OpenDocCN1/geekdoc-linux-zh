  md: '# Other LXQt Works


    LXQt has a standard format for Windows users. The launcher application is located
    on the left. The system tray is at the far right. An open window appears in sequence
    between the launcher and the system tray. The launcher application contains the
    necessary components to start the program. Categories containing installed applications
    appear at the top, then you have system options, user session controls, and a
    search bar.


    The interface is highly customizable and so you can change the desktop, app, and
    the icon theme. You can move the control panel to any side of the screen and arrange
    things the way you like. LXQt views all parts of the task as a widget. The default
    widget provides the ability to save favorite apps to the control panel, switch
    between multiple workspaces, and hide windows to display the desktop. It also
    comes with a few additional widgets, like a CPU monitor and a color selector.


    One thing makes LXQt attractive is the lack of dependence (the need to install
    background resources to launch the program) and the use of flexible components.
    For example, LXQt uses the Openbox manager. You can use themes associated with
    Openbox to change the “look” of a window title. You can also adjust the layout
    in the title bar. LXQt acts as a virtual desktop. It controls the desktop, does
    not attempt to control the entire startup process, and shuts down.


    # Who Should Use LXQt


    There are a few important reasons for using LXQt:


    +   LXQt is very simple. If you want a simple desktop interaction that uses a
    few system resources, use LXQt.

    - LXQt is based on Qt. Not many Qt-based desktop environments are possible compared
    to GTK +. If you like the Qt app but are not a fan of KDE Plasma Desktop, LXQt
    is one of your.

    - LXQt is modular. If you do not want a desktop that tries to do everything, LXQt
    is the right choice.

    - LXQt does not receive as much attention as other desktop locations. That doesn’t
    mean it’s not good. But if you are looking for alternatives, these are the simplest
    Linux distribution sites you can find.'
