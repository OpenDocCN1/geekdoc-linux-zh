  md: '# Terms for the Official Repository


    The software repository is the last place where software packages are downloaded
    for installation. The official archives of Arch Linux contain essential and popular
    software, easily accessible via pacman. Package maintainers store them. Packages
    in official repositories are constantly updated: when a package is upgraded, its
    old version is removed from the repository. There are no major Arch releases:
    each package is upgraded as new versions are available from mounting sources.
    Each repository is always compatible, i.e., the packages always have compatible
    versions.


    # Installing MATE


    The tasksel package will be used to install MATE on our Ubuntu systems.


    +   - Installing Tasksel


    +   - Tasksel is an Ubuntu package that provides an interface that allows users
    to install packages on their systems as if they were performing a specific task.
    To use tasksel, we first need to install it on our systems.


    +   - To do this, open the terminal by either hitting the Ctrl + Alt + T keys
    or use the dash to get access to the list of all applications installed. After
    opening the terminal, enter the following command:


    ```

    $ sudo apt install tasksel

    ```


    +   - To verify whether tasksel has been installed, enter the following command
    in the terminal:


    ```

    $ sudo tasksel

    ```


    +   - If you see a screen similar to the one shown below, then the tasksel has
    been installed onto your system. Press Esc to go back to the terminal.


    +   - Installing MATE


    +   - Once the tasksel has been installed, our next step is to install the MATE
