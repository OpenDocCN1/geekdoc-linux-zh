    # xfconf — Storage System


    Xfconf is a consecutive setup system (similar to a tree) in which baby nodes are
    close to the root channel “channels.” All settings under channel nodes are called
    “properties.”


    Valid channel names and locations are made up of uppercase letters ASCII US-English
    A–Z, lowercase letters a–z, numbers 0–9, dash (–), and underscore (_). No other
    characters are allowed in channel names. Letters less than (!) and larger than
    ()) also called “angle brackets”) are also allowed in property names but not in
    channel names.


    Property names refer to the “full route” under its channel, for example: /main/history-window/last-accessed.”
    Of course, when inquiring about a particular property, the channel should be specified
    separately.


