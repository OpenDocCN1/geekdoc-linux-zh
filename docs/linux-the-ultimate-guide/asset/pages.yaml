  md: '# ENLIGHTENMENT DESKTOP ENVIRONMENT


    Light, also known as E, is a compact window manager for the X Window System. From
    version 20, Enlightenment is also the creator of Wayland. Light developers have
    dubbed the "real eye candy window manager." Enlightenment includes image rendering
    functions and can be used in conjunction with programs written for GNOME or KDE.
    Used in conjunction with the Enlightenment Foundation Libraries (EFL), Lighting
    can refer to the entire desktop area.


    # History


    Rasterman (Carsten Haitzler) released the first edition of Enlightenment in 1997.
    The 0.17 version, also called the E17, was upgraded for 12 years from December
    2000 until December 21, 2012, when it was officially released. During development
    it was also renamed as DR17 (Development Release 17). It was completely rebuilt
    on DR16 and designed to be a complete desktop shell, based on the new Enlightenment
    Foundation Libraries (EFL). The E16 is in active development of the E17, reaching
    a record 1.0 in 2009 (1.0.23 from 2021). Bodhi Linux built next to the Enlightenment
    17 desktop, but it put on a fork to build a Moksha desktop. Elite Linux also used
    the E17 fork as its primary desktop until 2019, when the 3.7 series was built.
    The current version is E25.


    # Version


    Here is the list of versions of the enlightenment desktop environment with its
    features as given below,


    # E16


    E16 provides features that allow users to create a grid of workspaces known as
    "virtual desktops." It allows switching between them, which is achieved by hurling
    the mouse cursor. You can have up to 8 × 8 desktops in a single grid, and up to
    32 grids are possible, making 2,048 possible workspaces. You can enable a sort
    of "map" of the desktops, called the pager if they get lost. It also provides
    the ability to put windows in groups "iconification," which is similar to minimizing
    the windows that are stored in "iconboxes" that can be moved, the ability to change
    the type of or remove altogether the borders and title bars, advanced keybinding
    settings to allow the use of Enlightenment solely with a keyboard compositor with
    effects such as fading and transparency.'
