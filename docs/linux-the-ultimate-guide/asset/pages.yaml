  md: '# MAIN COMPONENTS OF XFCE


    xfwm4 – Window Manager


    In xf 4, Window Manager is part of the xfce Desktop Environment. The command to
    run it in front is xfwm4; to launch it in the background, use the xfwm4-daemon.
    It is responsible for arranging windows on the screen, providing window decorations,
    and permitting them to be moved, resized, or closed.


    Xfwm4 adheres strictly to the standards set on freedesktop.org. As a result, special
    features such as opening windows or providing an app icon should now be used in
    the application; you no longer use the window to force different behavior. One
    of the best features of xfwm4 is easy handling; themes are available at xfce-Look
    (borders, title bar, and window buttons) can be adjusted using window manager
    themes. Xfwm4 provides multi-header support for both xinama and multi-screen mode,
    helpful if several monitors are connected to your system. Xfwm4 can run independently,
    but if used in this way, xfce Settings Manager will be required as a GUI to make
    configuration changes. Tasks other than managing windows, such as setting a background
    image or launching programs, need to be done with other modules.


    Xfwm4 integrates with its integration manager, using the new X.Org server extensions.
    Composer is like WM alone; it holds a wide variety of windows, monitors all types
    of X events, and responds appropriately. An integrated controller embedded in
    the window helps keep viewing effects synchronized with window events. If you
    want to use a compiler, you have to create xfwm4 using the configuration-compositor
    option. In either case, you can disable the composer at xfwm4 launch using the
    “compositor = off” argument. It controls the placement of program windows on the
    screen, provides window decorations, and manages virtual workspaces or desktops.


