  md: '# xfce Desktop Environment ■ 109


    xfce4–session – Session Manager

    xce4-session is the xfce session manager. Its job is to save the status of your
    desktop (open applications and their location) and restore it during the next
    launch. You can create several different sessions and choose one of the first.


    +   1. Show selector on the login: Once set, the session manager will you to select
    a session each time you log in to xfce.

    2. Automatically save session on the checkout: This option instructs the session
    manager to save the current session automatically when you log out.

    3. Notify on exit: This option disables the checkbox. Whether the time will be
    saved or depends on whether you enable automatic saving of exit sessions or not.

    4. Kiosk mode: Session Manager provides Kiosk mode support, which helps prevent
    others from making changes to their session settings. To use it you have to edit
    or create a ${sysconfdir} / xdg / xfce4 / kiosk / kioskrc.


    The way to define the format of this file is to use an example. The xfce4-session
    section of your kiosk file may look like this:


    ```

    [xfce4-session]

    CustomizeSplash = ALL

    CustomizeChooser = ALL

    CustomizeLogout = ALL

    CustomizeCompatibility = % wheel

    Turn off = % wheel

    CustomizeSecurity = NO

    ```


    It allows all users to change their splash, selector, and exit settings, but only
    allows users in the group wheel to customize the interaction and shutdown settings.
    No one will be allowed to adjust the security settings.


    The session manager supports the following KIOSK capabilities:


    +   - Customize Splash: The user to allowed to customize the splash screen.'
