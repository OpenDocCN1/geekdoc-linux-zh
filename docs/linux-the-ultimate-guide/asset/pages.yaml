    xfce4-terminal – Terminal Emulator


    The UNIX operating system was designed as a text-only program, controlled by keyboard
    input instructions. The command-line interface (CLI) interface. X Window System,
    xfce, and other projects have added a graphical user interface to UNIX, which
    you use now. But adding a user interface does not mean CLI is dead. CLI still
    exists and is often the fastest, easiest, and most powerful way to do a particular
    job.


    A terminal is a so-called X terminal emulator, commonly referred to as terminal
    or shell. It provides the old text screen on your desktop, but the one that can
    easily share the screen with other graphic apps. Windows users may already be
    familiar with the MS-DOS Prompt service, which has the same function of providing
