    # INSTALLATION


    The "Vanilla Gnome" version is a GNOME desktop installation.


    +   1. To install the GNOME desktop environment, open a command line and use system
    package manager to install the GUI and gdm3 window manager.


    ```

    $ sudo apt update

    $ sudo apt install gnome-session gdm3

    ```


    +   2. If the installation prompts you to select your default window manager (because
    you are currently using a different one), be sure to select gdm3 if you want GNOME
    to be your default desktop environment.


    +   3. After installation is complete, reboot your system, and you will be presented
    with a GNOME login.


    ```

    $ reboot

    ```


    +   4. At this point, the GUI should start. You need to select desired desktop-top
    flavor on the login page before you login.


    Or


    The other way is to install full GNOME by using the tasksel command. Ensure first
    that the tasksel is installed on your system:


    ```

    $ sudo apt update

    $ sudo apt install tasksel

    ```


    Now, use the tasksel command to install GNOME desktop:


    ```

    $ sudo tasksel install ubuntu-desktop

    ```'
