    # History


    Like few other GNOME-based desktop environments, including Canonical Unity, Cinnamon
    became dissatisfied with the GNOME team''s traditional desktop experience in April
    2011. Then, GNOME had included a standard desktop theme. But GNOME 3 was replaced
    by GNOME Shell, which lacked a function-panel and other basic desktop features.
    The abolition of these essential features was unacceptable for distribution developers
    such as Mint and Ubuntu, aimed at users looking for collaborative sites where
    they could be relieved immediately.


    The Mint team initially decided to upgrade the GNOME Shell to replace the remaining
    features. The results of this effort were "Mint GNOME Shell Extensions" (MGSE).
    At the time, the MATE desktop environment was also forked from GNOME 2. Linux
    Mint 12, released in November 2011, then merged both, giving users the choice
    of GNOME 3-with-MGSE or traditional GNOME desktop 2.


    However, even with MGSE, GNOME 3 was still missing out on the luxury of GNOME
    2 and was well received by the user community. Some missing features could not
    be changed at the time, and it seemed the extensions would not work in time. In
    addition, GNOME developers could not meet the needs of Mint developers. To give
    Mint developers better control over the development process, GNOME Shell was forked
    as "Project Cinnamon" in January 2012.


    Gradually, various key applications were replaced by Mint developers. As of version
    1.2, released in January 2012, the Cinnamon window manager is Muffin, the fork
    of GNOME 3''s Mutter. Similarly, from September-2012 (version 1.6 onwards), Cinnamon
    includes a Nemo file manager with a fork from Nautilus. Cinnamon-Control-Center,
    installed since May 2013 (version 1.8 onwards), integrates GNOME-Control-Center
    functionality'
