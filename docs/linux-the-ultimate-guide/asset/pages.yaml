    # Garcon – Menu Library


    Garcon is the implementation of a specific menu specific to Freedesktop.org. It
    is based on GLib/Gio and aims to cover all details except asset menus. It was
    started as a complete redesign of the xfce menu library called libxfce4menu, unlike
