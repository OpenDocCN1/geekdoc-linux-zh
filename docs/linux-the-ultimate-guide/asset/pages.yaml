  md: '# Command-Line


    It uses startxfce4 to start an xfce session or select an xfce Session in the login
    manager, including a session manager, panel, window manager, and desktop manager.
    See automatic login from the console for more information. By default, the xfce
    session manager controls the implementation of applications. It allows saving
    your session when you quit xfce so that the next time you sign in, the same apps
    will be started automatically.


    # Features


    xfce contains several key components of small tasks that you can expect on the
    desktop:


    +   - **Window Manager**: Controls the placement of windows on the screen, provides
    window decorations, and manages visual effects or desktops.

    - **Desktop Manager**: Sets the background image and provides the root window
    menu, desktop icons or minimized icons, and a list of windows.

    - **Panel**: Switches between open windows, open apps, switch apps, and menu plugins
    to browse apps or directories.

    - **Time Manager**: Controls desktop login and desktop management and allows you
    to save multiple login times.

    - **Application Finder**: Displays applications installed in your system in stages,
    so you can quickly find and launch them.

    - **File Manager**: Provides basic file management features and various services
    such as bulk renaming.

    - **Settings Manager**: Tools for controlling various desktop settings include
    keyboard shortcuts, appearance, display settings, etc.


    In addition to the basic set of modules, xfce also offers many additional apps
    and plugins so you can customize your desktop the way you like, for example, terminal
    emulator, text editor, audio connector, app finder, image viewer, iCal-based calendar,
    and CD, and a DVD burning application. You can read more about xfce modules on
    the projects page. xfce project contains several different projects on each part
    of the desktop. Some projects have their project pages to provide additional information.'
  merge: -1
