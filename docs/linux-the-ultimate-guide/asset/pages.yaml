  md: '# VERSIONS HISTORY


    Earlier Versions


    xfce started as a simple project made with XForms. Olivier Fourdan released the
    program, a simple taskbar, on SunSITE. Fourdan continued to develop the project,
    and in 1998, xfce 2 was released with the first version of xfce window manager,
    Xfm. He requested that the project be included in Red Hat Linux but was rejected
    due to its XForms base. Red Hat only accepts open source software and is licensed
    under the GPL or BSD license, while at the time, XForms was a closed and free
    source for personal use. For the same reason, xfce was not available to Debian
    before version 3, and xfce was only distributed in the Debian storage area.


    In March 1999, Fourdan began a complete rewriting of the project based GTK, a
    non-patented tool kit that grew in popularity. The result was xfce 3.0, licensed
    under the GPL. The project received GTK drag and dropped support, native language
    support, improved customization, and full-featured software. xfce was uploaded
    to SourceForge.net in February 2001, starting with version 3.8.1.


