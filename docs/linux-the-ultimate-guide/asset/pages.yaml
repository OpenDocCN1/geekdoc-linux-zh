  md: '# Removing Cinnamon from Ubuntu


    Understandably, you may want to take out Cinnamon. First, switch back to GNOME
    any desktop space you used before. Now, delete the Cinnamon package:


    ```

    $ sudo apt to remove cinnamon

    ```


    If you used PPA to install Cinnamon, you should also remove the PPA from your
    list:


    ```

    $ Sudo add-apt-repository -r ppa: embrosyn / cinnamon

    ```


    After logging in, the following processes are started automatically:


    +   - Cinnamon-session (session manager that starts all other processes)

    - Cinnamon (the visible part of the Cinnamon desktop)

    - Nemo-desktop (with desktop icons and desktop content menu)

    - Cinnamon-screensaver (screensaver)

    - various csd-* processes (which are daemon plugin settings and running in the
    background)


    The Nemo process begins when you browse files and directories. It stays open as
    long as at least one file manager window is open. The Cinnamon settings process
    starts when you open System Settings and stays open as long as at least one configuration
    module is turned on.


