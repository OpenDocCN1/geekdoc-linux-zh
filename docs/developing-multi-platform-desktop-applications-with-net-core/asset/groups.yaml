    # Chapter 6. SETUP DEVELOPMENT ENVIRONMENT


    The setup of the development environment is a crucial step in the development
    process, a proper setup will avoid you many pitfalls and contextual bugs further.
    So, you have to take a special care of each install, it means re-install the complete
    package even if you have some minor error messages during a setup.


    For a better stability of each machine, it is preferable to setup a new platform
    for each OS your software will work on (fresh OS Linux, macOS and Windows; installed
    from scratch).'
