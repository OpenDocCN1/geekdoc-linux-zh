    \ Web 应用程序之间架起了桥梁。\n\nElectron.NET.CLI 是用于构建和打包 Electron 应用程序的命令行工具；它不会在应用程序代码内部使用（它是一个工具）。ElectronNET.CLI\
    \ 对于运行您的 .NET Core Electron.NET 应用程序是强制性的。\n\n您可以使用下面描述的命令行安装此工具（这是 dotnet CLI\
    \ 的一个工具集包）。它可以作为 dotnet CLI 的全局工具进行安装，扩展出“electronize”命令。\n\n```bash\nC:\\> dotnet\
    \ tool install ElectronNET.CLI -g\n```\n\n在 .NET Core 中设置好 Electron.NET.CLI 后，“electronize”命令即可作为\
    \ dotnet CLI 的全局工具使用。“electronize”命令仅安装针对特定的 .NET Core 版本；该工具本身安装在用户文件夹中：\n\n\
    ```bash\n%UserProfile%\\.dotnet\\tool\n```\n\n但在开始使用 Electron.NET 包装器之前，.NET Core\
    \ 应用程序开发者必须先安装先决工具：**Node.JS** 及其依赖项 NPM。\n\n### 8.3.3 设置 NPM 和 Node.JS\n\nNPM\
    \ 代表 Node Package Manager（Node 包管理器）。Node.JS 是 Chromium 项目的 JavaScript 运行时引擎（由\
    \ Google 开发）。Electron.NET 要求 Node.JS 版本 >8.6。我们建议从专用网站安装 Node.JS（参见参考文献中的网址），以获取工具的最新版本并确保在每个系统上进行正确的安装。\n\
    \n以下是下载安装文件（以及获取此处介绍的每个操作系统文档）的参考链接。\n\n- https://www.npmjs.com/get-npm\n- https://www.nodejs.org/en\n\
    \n我们将详细回顾这些工具在每个平台上的安装方法，因为这是使用 Electron 框架的核心要求，而且经常构成项目构建过程中的问题。\n\n### 8.3.3.1\
    \ 在 macOS 上\n\n对于此平台，我们建议安装来自 NodeJS 网站的版本（这是最新版本，在构建 Electron.NET 应用程序时，版本编号不应有问题）。\n\
    \n下载完成后，您需要点击该工具进行安装（这是一个 .pkg 文件）。成功安装产品后，您应该看到如下表单：\n\n- 介绍 (Introduction)\n\
    - 许可证 (License)\n- 已选目的地 (Destination Selected)\n- 安装类型 (Installation Type)\n\
    - 安装 (Installation)\n- 摘要 (Summary)\n\n此安装已成功完成。\n\n- 此包已安装：\n  - 将 Node.js v12.10.0\
    \ 安装到 /usr/local/bin/node\n  - 将 npm v6.10.3 安装到 /usr/local/bin/npm\n  \n- 请确保\
    \ /usr/local/bin 在您的 $PATH 中。\n\n![](img/3d310cc066dda6e2dfa67a650614076f_151_0.png)\n\
    \n安装过程完成后，我们建议在开始构建 Electron.NET 应用程序之前重启计算机（以确保所有环境变量已更新）。\n\n### 8.3.3.2 在 Ubuntu\
    \ 上\n\n在 Linux 系统上，您可以使用常用的包管理器“apt”并通过以下命令安装 Node.JS。由于在此环境中 NPM 不在同一个包中，因此您还需要安装\
    \ NPM。\n\n```bash\n$ sudo apt-get update\n$ sudo apt-get install nodejs\n$ sudo\
    \ apt-get install npm\n```\n\n以下是成功安装的样子。\n\n![](img/3d310cc066dda6e2dfa67a650614076f_152_0.png)\n\
    \n一旦两个包都正确（无错误）安装，您可以使用以下命令检查已安装的版本。\n\n![](img/3d310cc066dda6e2dfa67a650614076f_152_1.png)\n\
    \n使用此命令还将帮助您验证一切是否正常工作（验证安装是否正确执行）。显示的版本编号必须 >8.6。\n\n### 8.3.3.3 在 Windows 上\n\
    \n在 Windows 上，您必须安装 NPM 和 Node.JS。通过 Visual Studio Installer 程序安装 Node.JS 版本并不适用于构建\
    \ Electron.NET 应用程序（因为您还需要安装 NPM）。我们建议在此特定任务中不使用该版本。\n\n更简单的解决方案是从专用网站设置 Node.JS/NPM；这将确保您安装可用的最新版本（此前已在参考文献中提供链接）。\n\
    \n以下是安装程序的视图。\n\n![](img/3d310cc066dda6e2dfa67a650614076f_153_0.png)\n\nWindows\
    \ 要求您重启系统，以便在开始使用之前使用新的环境变量更新系统。\n\n## 8.3.4 Electron.NET 快速入门\n\n使用 Electron.NET\
    \ 需要遵循一定的程序，以便将其集成到 ASP.NET Core 应用程序中，并将其转换为桌面应用程序。\n\n以下是将您的 ASP.NET Core 3\
    \ 应用程序“electronize”的简短程序。我们将在稍后的示例部分中以更多细节回顾应用程序代码本身。\n\n- **A) 创建一个 ASP.NET Core\
    \ MVC 应用程序**\n  \n  这可以通过使用 dotnet CLI 或 Visual Studio 来完成。\n\n- **B) 安装 Electron.NET\
    \ 命令行全局工具（自版本 0.9 起）**\n  \n  在开始开发您的应用程序之前，您必须使用以下命令行命令为 dotnet CLI 安装 Electron.NET.CLI\
    \ 全局工具。\n\n  ```bash\n  $ dotnet tool install -global Electron.NET\n  ```\n\n\
    - **C) 添加 Electron.NET 包：**\n  \n  除了通过 Visual Studio NuGet 包管理器添加之外，您还可以通过在包管理器命令行中输入以下行来添加依赖项。\n\
    \n  ```powershell\n  PM> Install-Package Electron.NET.API\n  ```\n\n- **D) 设置打包（仅限\
    \ Ubuntu 和 macOS）**\n\n  此步骤仅适用于 Ubuntu 和 macOS 平台。在这些操作系统上，您必须使用以下命令行指令安装“electron-builder”。\n\
    \n  ```bash\n  $ sudo npm install electron-builder -global\n  ```\n\n- **E) 开始使用\
    \ Electron.NET：**\n\n  您可以通过在 WebHostBuilder 内使用以下代码来实现。\n\n  ```csharp\n  public\
    \ static IWebHost BuildWebHost(string[] args) \n  {\n      return WebHost.CreateDefaultBuilder(args)\n\
    \          .UseElectron(args)\n          .UseStartup<Startup>()\n          .Build();\n\
    \  }\n  ```\n\n  您可以注意到，我们只是在 WebHost 中添加了“UseElectron(args)”行，以启用在 MVC ASP.NET\
    \ Core 应用程序内部使用 Electron。\n\n- **F) 在 Startup.cs 文件中创建 Electron 窗口：**\n\n  可以通过“Configure”方法中的以下指令来完成：\n\
    \n  ```csharp\n  Task.Run(async () => await\n      Electron.WindowManager.CreateWindowAsync());\n\
    \  ```\n\n"
