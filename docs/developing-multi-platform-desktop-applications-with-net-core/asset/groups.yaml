    You can implement the source control tools on your servers (many open-source solutions
    are available such as Git, SVC, Subversion, etc.). We recommend installing the
    code source repository on a dedicated computer other than a developer station,
    when possible.


    But you can also use online integrated solutions such as Microsoft Azure DevOps,
    GitHub, or others. Using an external repository improves the security of your
    source code. By using deported source code, you can recover very quickly in case
    of general failure or catastrophic event.


    Here is a quick review of the main stream solutions for integrating these benefits
    in your project development.


    ## A) Microsoft Azure DevOps


    Using Microsoft Azure DevOps includes many advantages added to the source control
    tool. This environment, furnished freely (up to 5 users after which you have to
    subscribe to the services that offer much more capabilities) by Microsoft, can
    be used to manage the cycles of your project and be the central repository for
    your source code. It includes:


    -   Source Versioning.

    -   Project following (can be connected to MS Project).

    -   Assign task to developer.

    -   Request management (New features, Bugs, Specs ...).

    -   Do the compilation of your project.

    -   Integrate automated building and testing module (with pipeline).


    Azure DevOps offers, for free, different types of source control tools like classical
    TFS, and Git, as well as methodologies for guiding your project (Agile, Scrum
    ...).


    In the complete version (with subscription), Azure DevOps offers you a complete
    solution for managing your resources and source code in a professional way.


    The integration with Visual Studio is native and makes it really easier for the
    developer to use software development methodologies over the architecture and
    coding phase.


    This is only a glimpse of the features freely offered by Azure DevOps, so we recommend
    the use of this tool. You can discover all the details of the offer from the link
    in the reference.


    ![](img/3d310cc066dda6e2dfa67a650614076f_42_0.png)


    https://azure.com/Devops/


    ## B) GitHub


    GitHub offers a free distributed source control tool. GitHub comes from the open-source
    world and offers to host your project sources for free. These sources can be accessible
    to the "public" and an unlimited number of "contributors" can participate in the
    project (ideal for open-source projects).


    If you do not want your sources to be public, you can create a "private" repository,
    but this one (at least in the free version) will have to support constraints like
    the number of contributors limited to 3 (and others).


    By default, the repository will be accessible to the public if you only use the
    free version, but GitHub allows you to work with no limit of size for your team.


    GitHub is really an essential tool if you plan to develop an open-source software
    solution, and it is designed for doing just that. Furthermore, you can use the
    free git client from GitHub for the management of your files. You can view the
    possibilities offered by GitHub by consulting the reference link below.


    -   https://github.com/explore

    -   https://desktop.github.com


    There are several other online solutions for assisting you in the fastidious (but
    nonetheless crucial) task of managing your project and your source code. Online,
    the most known are:


    -   https://gitlab.com

    -   https://bitbucket.org

    -   https://sourceforge.net

    -   https://beanstalkapp.com


    Most of these websites offer free subscriptions and basic tools for the management
