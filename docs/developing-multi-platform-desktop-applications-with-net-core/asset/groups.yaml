    \  $ dotnet tool install -global Electron.NET\n  ```\n\n- **C) Add the Electron.NET\
    \ package:**\n  \n  Besides adding it from Visual Studio NuGet package manager,\
    \ you can add the dependency by typing the following line in the package manager\
