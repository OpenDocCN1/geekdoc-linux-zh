  mdcn: "\n\n阶段，并且在撰写本文时并不提供调试支持（而经典 CoreCLR 可以提供）。这款出色的工具为 .NET Core 软件开发者提供了前所未有的能力，你现在可以用\
    \ C# 编写机器原生应用程序！而且你还可以选择从 .NET Core 源代码生成 C++ 代码。\n\n- https://mattwarren.org/2018/06/07/CoreRT-.NET-Runtime-for-AOT\n\
    - https://github.com/dotnet/corert/blob/master/Documentation/intro-to-corert.md\n\
    - https://github.com/dotnet/corert\n\n### 9.4.1 架构\n\nCoreRT 是一个用于将 CLR 语言编译为机器码的原生工具链，如下面的架构图（图\
    \ 1）所示。\n\n![](img/3d310cc066dda6e2dfa67a650614076f_274_0.png)\n\nCoreRT 使用 RyuJIT（即时编译器，.NET\
    \ Core 在程序执行期间使用它）对程序进行提前编译（AOT）。\n\nCoreRT 源自 .NET Core 运行时（RyuJIT）的重构，但它不再在执行期间即时生成机器码，而是生成机器码并将其保存到文件系统中（AOT\
    \ 方式，而非复制到内存中）。\n\n### 9.4.2 优势\n\n使用 CoreRT 为开发者带来许多好处，以下是其中最关键的一些：\n\n- 生成原生应用程序（无需安装\
    \ .NET Core 运行时！）\n- 提高应用程序启动阶段的性能（无需再加载 CLR、JIT 等）\n- 可以利用原生编译器优化（来自 C++）\n-\
    \ 更简单的多平台部署场景（你可以仅使用一个原生可执行文件来部署你的应用程序）\n- 能够部署到小型容器\n\n这些快速列举的好处通常对于开发语言或框架的选择至关重要。现在，使用\
    \ .NET Core 3 开发多平台应用程序（至少针对 Windows、Linux、macOS）是非常合理的。\n\n为 Windows 64 生成的 EXE\
    \ 的平均最小大小（针对经典的“HelloWorld”项目）约为 4 MB（相比之下，嵌入 .NET Core 时为 70 MB）。\n\nCoreRT 为\
    \ .NET Core 3 的使用定义了更广泛的范围。它现在可以用于许多新的软件环境，这些环境在旧时通常保留给抽象层级更低的语言，如 C 或 C++。\n\n\
    CoreRT 是一个不断演进的工具（仍处于实验阶段），并且不提供跨平台编译选项，每个机器原生可执行文件都必须在其所属平台上构建。\n\n### 9.4.3\
    \ CoreRT 的先决条件安装\n\n正如前文所述，CoreRT 使用 C 编译器来生成机器原生可执行文件，因此在生成机器原生可执行文件之前，必须在每个平台上设置适当的环境。\n\
    \n#### 9.4.3.1 在 macOS 上\n\n在 macOS 上，你需要安装“XCode 命令行工具”，实际上就是 macOS 的“gcc”编译器。\n\
    \n最简单的做法是如下从命令行调用“gcc”。\n\n```bash\n$ gcc\n```\n\n如果你没有所需的工具（gcc 尚未安装），将会弹出一个对话框，如下所示；否则，说明你已经安装了该工具。\n\
    \n![](img/3d310cc066dda6e2dfa67a650614076f_277_0.png)\n\n选择安装……\n\n之后你还需要安装“CMake”工具（下载链接提供在下方）。“CMake”应用程序可以像其他\
    \ .pkg 文件一样安装。你可以从下方链接下载 .pkg 文件。\n\n- [http://www.cmake.org](http://www.cmake.org)\n\
    - [https://developer.apple.com/xcode/](https://developer.apple.com/xcode/)\n\n\
    #### 9.4.3.2 在 Ubuntu 上\n\n“gcc”和“cmake”在 Ubuntu 桌面发行版中默认已安装，因此你无需安装任何辅助工具来在该平台上构建机器原生应用程序。你可以使用适当的选项和命令通过\
    \ dotnet CLI 将 CoreRT 就绪的项目编译为机器原生可执行文件，如下节所述。\n\n#### 9.4.3.3 在 Windows 上\n\n\
    要在主开发平台上构建 CoreRT 机器原生可执行文件，你必须在 Visual Studio 2019 安装程序中安装 C++ 工具“使用 C++ 进行桌面开发”，如下面的图片所示。\n\
    \n![](img/3d310cc066dda6e2dfa67a650614076f_278_0.png)\n\n这是该平台 CoreRT 先决条件的唯一要求。\n\
    \n一旦你拥有了每个操作系统适当的构建环境，你就可以开始生成这些平台的机器原生可执行文件。\n\n### 9.4.4 机器原生编译场景\n\nCoreRT\
    \ 的实现应尽早集成到你的项目开发中，以验证它与你所开发的源代码之间是否存在冲突。\n\nCoreRT 必须在源代码文件内通过代码（在我们的情况下是 C#）来实现，为此，你需要遵循一种简单的方法。\n\
    \n#### A) 向项目中添加所需的包\n\n包：Microsoft.Dotnet.ILCompiler\n\n为了将 CoreRT 功能包含到你的项目中，你必须添加专用包。此包仍处于\
