    # 8.6.4 Using Photoshop resources as GUI


    With QT Design Studio you can use your favorite graphical editor for the design
    of your GUI. If your application requires the development of a non-standard interface
    (with your own designed widgets) you can use Photoshop for doing that. The QT
    company have a commercial product for doing this task (QT Bridge) who require
    an appropriate licensing.


    Even if it does not offer every feature present in the commercial product we will
    use the old version “QML Exporter” who is under Opensource license.'
  - '[PAGE 226]


    You can produce GUI directly from Adobe Photoshop with the installation of the
    plugin for the exportation of your design to .qml file.


    # 8.6.4.1 Install: QML exporter plug-in


    First you have to download the Photoshop plugin from the provided link


    ![](img/3d310cc066dda6e2dfa67a650614076f_226_0.png)


    Once the plugin is downloaded copy the file "Export QML.jsx" to the folder:


    Photoshop/Plugins/Presets/Scripts


    Note that this path might be different on your computer according to the location
    of your Photoshop. Once the .jsx file is copied in the appropriate folder you
    have to restart the application for updating the presets list.


    Once restarted you should have the option "Export Qml" under the menu "File/Scripts/"
    as shown in the picture below.'
  md: "\nFor more reference about QT itself visit the reference links.\n\n> https://www.qt.io/\n\
