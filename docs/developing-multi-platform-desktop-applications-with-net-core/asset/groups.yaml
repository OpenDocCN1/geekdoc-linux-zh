    # **6.1 CREATE DEVELOPER ACCOUNT FOR EACH PLATFORM YOU TARGET**


    The development of multiplatform software implies that you have access to the
    knowledge bases of these platforms, for doing so the subscription to the developer
    web site of the platform you develop on will make easier the access to the specific
    knowledge you will need for your project.


    The subscription to these web sites will also provide you:


    +   - Keep you inform of the developer news for each platform threW dedicated
    newsletter.

    +   - Offer you forum, FAQ and blog access for technical assistance and/or development
    best practices.

    +   - Provide trainings for new tools and concepts.

    +   - Access to the complete documentation.


    The web sites recommended are recognized by professional developers for the quality
    and the reliability of the information they provide.


    Here is a non-exhaustive list of web sites who will provide you the documentation
    needed for your multiplatform project.


    **For Microsoft Windows:**


    Microsoft offers a large amount of web site for the developers using their technologies.


    +   - https://developer.microsoft.com/

    +   - https://developercommunity.visualstudio.com/'
