    # Chapter 10. APPLICATION PERFORMANCE IMPROVEMENT


    The performances are often a critical point in many software development projects.
    In this chapter we will review, how to identify the bottlenecks inside the source
    code using the built-in Visual studio tools and afterward review a Benchmark dedicated
    tool (able to produce advanced reports).


    We will finally review natty techniques and tips for producing high performances
    C# source code from the start.


    But do not forget performances issues come often from an inappropriate choice
    in the architecture of the software (especially for a desktop, local application).


    If you encounter performances issues of this type do not hesitate to modify the
    architecture planed as soon as the issue is identified: as soon the architecture
    will be fix (and modified) the less time you will spend to try to fix or to patch
    a dodgy program architecture.


    In the other cases, the developer can use a simple method for the implementation
    of a performance enhancement process.


    Here is the simple cycle the developer can follow for achieving this goal.


    ![](img/3d310cc066dda6e2dfa67a650614076f_289_0.png)


