    \ -g\n```\n\nAfter the setup of Electron.NET.CLI in .NET Core, the command “electronize”\
    \ is available as a global tool for the dotnet CLI. The “electronize” command\
    \ will be installed only for a specific .NET Core version; the tool itself is\
    \ installed in the user folder:\n\n```bash\n%UserProfile%\\.dotnet\\tool\n```\n\
    \nBut before using the Electron.NET wrapper, the .NET Core application developer\
    \ has to install the prerequisite tools: **Node.JS** and its dependency NPM.\n\
    \n### 8.3.3 Setup of NPM and Node.JS\n\nNPM stands for Node Package Manager. Node.JS\
