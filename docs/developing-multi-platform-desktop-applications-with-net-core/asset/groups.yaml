    \ Even if Electron.NET avoids you from having to use JavaScript for the development\
    \ of the Electron application, it requires Node.JS to be installed for the building\
    \ and running process (that's the Electron engine).\n\nFor a good integration\
    \ in .NET Core, Electron.NET is available in NuGet packages. To make the communication\
    \ between the Electron runtime (Host) and the .NET Core web application, you have\
    \ to include the appropriate packages in your project.\n\n```nuget\nElectronNET.API\n\
    ElectronNET.CLI\n```\n\nElectronNET.API is the layer the developer has to include\
    \ in the web site for accessing the Electron features; this package does the bridge\
