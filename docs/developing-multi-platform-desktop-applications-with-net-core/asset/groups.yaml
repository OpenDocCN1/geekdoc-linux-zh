  mdcn: "\n# 使用 .NET Core 3 和 Visual Studio 2019 开发多平台桌面应用程序\n\n## 为 macOS、Linux 和\
    \ Windows 构建 C# 图形用户界面（GUI）应用程序\n\n- Avalonia\n- Electron.NET\n- GTK\n- QT\n-\
    \ 以及更多 ...\n\nDimitri Laslo\n\n---\n\n版权所有。未经出版方事先书面许可，不得以任何形式或方式（包括影印、录音或其他电子或机械方法）复制、分发或传输本出版物的任何部分，但允许版权法规定的用于评论文章中的简短引用以及某些其他非商业用途的情况除外。\n\
