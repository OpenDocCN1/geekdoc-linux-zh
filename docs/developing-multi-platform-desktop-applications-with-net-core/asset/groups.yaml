    There are many multiplatform GUI solutions based on C and C++ language (many OS
    are developed using this language), and these solutions are a good starting point
    for the implementation of your own GUI in NET Core 3, the following list enumerate
    the most popular, proofed and efficient of them:


    - LibUI

    - guilite

    - Cogui

    - Nuklear


    These frameworks have vocation to be used as bricks (the User Interface) for the
    development of C programs, so what is the point of presenting such tools in this
    book? Well the C libraries can easily be used from a .NET Core 3 application (see
    the chapter about the use of unmanaged dependencies) throw the use of a wrapper
    class


    The wrapper makes the integration of C libraries almost as easy as the use of
    a standard package. The integration of unmanaged libraries (C, C++) are now days
    well done by managed application (.NET).


    You can find more information about these libraries at the following reference
    links:


    | https://github.com/dnlabss/liblul | https://github.com/idear4good/GuiLite |
    https://github.com/vurturn/nuklear | http://xpcda.net | http://cegui.org.uk |

    | --- | --- | --- | --- | --- |


    Of course, you can develop your own version of the .NET core wrapper for the most
    adaped library, but writing a wrapper for using these libraries is a large amount
    of work and often represent a project by itself.


    Nevertheless, some of these libraries (the most popular and largely used) have
    already a wrapper for NET Core developed. The library you have selected have already
    several versions of wrappers made by experienced individual or developer’s community
    who want to have access to a lightweight C graphic user interface framework (for
    performances as well) for their .NET Core developments.


    For the following examples we have chosen to use LibUi. First because LibUi is
    a recognized by professional efficient library and because several implementations
    of a wrapper for the use with .NET Core are already developed and available, avoiding
    the tedious and time-consuming task of the development of our own wrapper. Moreover,
    it uses native widgets for each platform we intend to develop for.


    ### 8.4.1 Presentation of LibUI


    LibUI is a simple and portable GUI library in C that uses native GUI widget on
    each platform it supports. This is an Opensource and free to use framework developed
    by a vibrant community, you can also participate to its development if you have
    to propose improvements or new features, you think, others users should be happy
    to have (with a GitHub contribution).


    This library is available for Windows, Linux and macOS (and several other OS to!).
    As an Opensource project you can find the sources freely available on the GitHub
    repository.


    The LibUI library development are still very active with a last release done the
    7 April 2019 (at this time), this will guarantee you to have responsive community
    if you encounter a specific problem (that’s not support, but in many cases, it
    will help you to fix the problem) or require special features.


    ![](img/3d310cc066dda6e2dfa67a650614076f_169_0.png)


    You should review the GitHub web site of LibUI for accessing the documentation
    and for getting some examples (often developed in plain C) for the use of the
    controls. The GitHub web site will also help you to get in touch with the internal
    logic underneath LibUI (always useful).


    ### 8.4.2 .NET Core wrapper for LibUI


    As we have mention before there is several wrappers who have been already developed
    for using LibUI within .NET Core. Most of these wrappers are implemented using
    .NET Standard. The list of available wrappers for .NET Core comes from the LibUI
    GitHub web site and are recognized by the community.


    - DevZH.UI

    - TDFX.UI (SharpLibUI)

    - SharpUI


    After several tests, DevZH.UI seems to be the most flexible solution. Even if
    the last update have been checked-in in 2017, this wrapper is UpToDate and working
    (that’s not always the case) with the current version of LibUI (last update on
    7 April 2019).


    The source code of the original version of DevZH.UI is available (see GitHub links
    below). You can review also the other solutions if you do not feel ok to use the
    selected wrappers (DevZH.UI).


    ![](img/3d310cc066dda6e2dfa67a650614076f_170_0.png)


    The distribution name of the NuGet package is DevZH.UI and it is available on
    the standard NuGet web site.


    ![](img/3d310cc066dda6e2dfa67a650614076f_170_1.png)


    Even if the NuGet package appear to be in alpha version, the source code has been
    working just fine during the development of the example programs on every platform
    tested. We didn’t encounter any issue of any kind during our review.


    But as it marked as an alpha version you have to check the “include prerelease”
    in the Package Manager as described for having the package listed (see figure
    1) in the NuGet package manager window of Visual Studio.

