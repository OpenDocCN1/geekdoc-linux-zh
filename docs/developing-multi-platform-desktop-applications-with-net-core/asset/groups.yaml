  mdcn: "\n\nEF Core 提供了一组 API，允许你以结构化的方式（代码具有良好的可读性和可维护性）访问数据。它允许你使用 .NET 对象实例（支持\
    \ LINQ 请求）来处理你的数据。\n\nEF Core 简化了应用程序数据访问层的工作。实际上，EF Core 甚至可以为你生成该层。\n\n## 5.3.1\
    \ 数据库提供程序\n\n作为其前身 Entity Framework 6 的继承者，EF Core 已经集成许多数据库提供程序，例如：\n\n- SQL\
    \ Server\n- MySQL\n- SQLite\n- Oracle\n- PostgreSQL\n- CosmosDB（来自微软的 NoSQL 数据库）\n\
    - ...... 并且随着 EF Core 社区保持高度活跃，更多提供程序正在不断添加。\n\n更多提供程序可在此处找到：\n\n![](img/3d310cc066dda6e2dfa67a650614076f_71_0.png)\n\
    \n## 5.3.2 EF Core 架构\n\nEF Core 为开发者提供了一个集成的分层解决方案，该方案允许将应用程序的数据库操作抽象化，并使用 .NET\
    \ 对象。\n\n这种分层提供了关于数据库托管系统的更好灵活性（例如，如果你必须更改使用的数据库类型）。\n\n它还为开发者提供了使用高级 .NET 功能来操作数据对象的能力，例如：使用\
    \ Lambda 函数，使用 LINQ 请求。\n\n以下图示展示了 EF Core 的总体架构：\n\n![](img/3d310cc066dda6e2dfa67a650614076f_72_0.png)\n\
    \n## 5.3.3 EF Core 安装\n\n为了让 EF Core 在你的项目中可用，你必须包含一个针对你想使用的数据库类型以及允许你在代码中使用高级功能的\
    \ EF 工具包。\n\n如果你使用 SQL server，以下是需要包含的包：\n\n安装通常可以通过 **包管理器** 或直接通过 Visual Studio\
    \ 项目窗口（管理包）来完成。\n\n## 5.3.4 数据模型\n\n当使用 EF Core 开发应用程序时，你有两种不同的方法来实现与数据库的集成：\n\
    \n### A) 模型优先 (Model First)：\n\n当你使用这种方法时，数据模型由你的数据模型（通过代码）定义。当你使用数据库来存储由你的应用程序产生的数据时，使用这种方法很有趣。模型优先方法用于数据库尚未定义，或当你从头开始开发应用程序时。\n\
    \n### B) 数据库优先 (Database First)：\n\n当你使用这种方法时，你逆向工程你的数据库以生成数据模型。这种方法用于你正在处理一个现有的数据库，或者当数据库由团队中的其他成员（例如数据库开发人员）开发时。\n\
    \n为了启用从你的数据库到你的数据模型的脚手架生成（scaffolding），你必须先安装所需的包：\n\n该包将允许你使用 PowerShell 命令：**Scaffold-DbContext。**\
    \ 以下是示例命令，用于在你的包管理器窗口中执行此 PowerShell 命令：\n\n```powershell\nPM> Scaffold-DbContext\
    \ -Connection \"Server=(localdb)\\mssqllocaldb;Database=MyDb;Trusted_Connection=True;\"\
    \ -Provider Microsoft.EntityFrameworkCore.SqlServer -OutputDir ./DataModel -Context\
    \ MyDbContext -Tables <tablename>\n```\n\n这种“脚手架”将生成文件（.cs），这些文件将定义你在代码中可以操作的对象。默认情况下，会为数据库中的每个对象生成一个文件，但你可以指定想要生成的表（例如使用\
    \ -Tables 针对特定表）。脚手架生成特定的视图或存储过程（在本书撰写时）是不允许的。\n\n请查阅工具的在线帮助，以获取可用于生成所需数据模型的所有选项列表。\n\
    \n![](img/3d310cc066dda6e2dfa67a650614076f_74_0.png)\n\nhttps://doc.microsoft.com/en-us/ef/core/managing-schemas/scaffolding/\n\
    \n## 5.3.5 EF Core 使用建议\n\n当你使用 EF Core 开发应用程序（配合 Visual Studio 2019）时，你应该考虑使用\
    \ Visual Studio 市场上可用的专用插件，例如 Entity Framework 可视化编辑器、EFCore PowerTool、EntityDeveloper\
    \ Express：\n\n![](img/3d310cc066dda6e2dfa67a650614076f_75_0.png)\n\n这些 Visual\
    \ Studio 扩展不仅是简化你使用 EF Core 编码生活的插件，它们还允许你以图形方式对你的数据模式进行建模（这在 Visual Studio 中尚未内置），它提供了与\
    \ Entity Framework 6 中已可用的相同工具（你的数据的数据图示模型）。\n\n你也可以使用一个专业的专用产品（针对专业人士）来从数据库生成你的对象（ORM）：\n\
    \n来自 DevartS Software（与免费插件相同的软件编辑器）的 **Entity Developer** 是一个产品，它为 ORM 的数据模型设计/或生成提供了独特的解决方案（支持多个目标\
    \ ORM，如 NHibernate, Entity Core ...）。这个工具将使保持数据库和数据模型同步的工作变得更容易，并且大大节省时间。\n\n\
    ![](img/3d310cc066dda6e2dfa67a650614076f_76_0.png)\n\nhttps://www.devart.com/entitydeveloper/\n\
    \n## 5.3.6 EF core 基本用法示例\n\n这里有一个示例程序，用于说明使用 Entity Framework Core 的模型优先 (Data\
    \ Model First) 方式（请注意，此示例不应直接照搬，通常出于明显的可读性原因，你需要在不同的源文件（.cs）中定义数据对象，但它可以帮助你快速理解\
    \ EF Core 背后的哲学）。\n\n### ProgramEFCoreDemo.cs\n\n```csharp\nusing System;\nusing\
    \ System.Data.Entity;\nusing System.Linq;\n\nnamespace EFCoreDemo\n{\n    internal\
    \ class Program\n    {\n        public static string ConnectionString =\n    \
    \        \"Server=localhost;Initial Catalog=EFCoreDemo;Integrated Security=true\"\
    ;\n\n        public static void Main()\n        {\n            // CLEAR\n    \
    \        using (var context = new\n                ExecutionContext())\n     \
    \       {\n                context.Customers.RemoveRange(context.Customers);\n\
    \                context.SaveChanges();\n            }\n\n            // ADD 2\
    \ new customers\n            using (var context = new\n                DbContext())\n\
    \            {\n                context.Customers.Add(new Customer\n         \
    \       { Name = \"Customer_A\", Description = \"Description\",\n            \
    \        IsActive = true });\n                context.Customers.Add(new Customer\n\
    \                { Name = \"Customer_B\", Description = \"Description\",\n   \
    \                 IsActive = true });\n                context.SaveChanges();\n\
    \            }\n\n            Console.WriteLine(\"Customers\nadded...\");\n\n\
    \            using (var context = new\n                DbContext())\n        \
    \    {\n                foreach (var customer in\n                    context.Customers.ToList())\n\
    \                {\n                    Console.WriteLine(\"\");\n           \
    \         Console.WriteLine(\"Customer CustomerID : \" +\n                   \
    \     customer.CustomerID);\n                    Console.WriteLine(\"Customer.Name\
    \ : \" +\n                        customer.Name);\n                    Console.WriteLine(\"\
    Customer.Description :\n \" + customer.Description);\n                    Console.WriteLine(\"\
    Customer.IsActive : \" +\n                        customer.IsActive);\n      \
    \          }\n            }\n\n            Console.WriteLine(\"\");\n        \
    \    Console.WriteLine(\"----\");\n            Console.WriteLine(\"\");\n\n  \
    \          using (var context = new\n                EntityContext())\n      \
    \      {\n                var list = context.Customers.ToList();\n\n         \
    \       list.First().Description = \"Updated A\";\n\n                context.Customers.Add(new\
    \ Customer\n                { Name = \"Customer C\", Description =\n         \
    \           \"Description\" });\n\n                context.SaveChanges();\n  \
    \              Console.WriteLine(\"Customers\n    added/updated.\");\n       \
    \     }\n\n            using (var context = new\n                EntityContext())\n\
    \            {\n                foreach (var customer in\n                   \
    \ context.Customers.ToList())\n                {\n                    Console.WriteLine(\"\
    \");\n                    Console.WriteLine(\"Customer CustomerID\n        : \"\
    \ + customer.CustomerID);\n                    Console.WriteLine(\"Customer.Name\
    \ : \" +\n                        customer.Name);\n\n                    Console.WriteLine(\"\
    Customer.Description\n        : \" + customer.Description);\n                \
    \    Console.WriteLine(\"Customer.IsActive :\n        \" + customer.IsActive);\n\
    \n                }\n            }\n\n            Console.WriteLine(\"\");\n \
    \           Console.WriteLine(\"----\");\n            Console.WriteLine(\"\");\n\
    \n            Console.WriteLine(\"Press any key.\");\n            Console.ReadKey();\n\
    \        }\n    }\n\n    public class EntityContext : DbContext\n    {\n     \
    \   public EntityContext() :\n            base(Connection.String)\n        {\n\
    \        }\n\n        public DbSet<Customer> Customers { get; set; }\n    }\n\n\
    \    public class Customer\n    {\n        public int CustomerID { get; set; }\n\
    \        public string Name { get; set; }\n        public string Description {\
    \ get; set; }\n        public bool IsActive { get; set; }\n    }\n}\n```\n\n此示例可以在\
    \ Windows、Linux 和 macOS 上运行，并使用 dotnet Core 3 进行编译。\n\n## 5.3.7 Entity Framework\
    \ Core：教程和学习\n\n正如我们所见，EF Core 是解决 .NET Core 3 应用程序中数据库访问问题的熟练且成熟（随着每个新版本越来越成熟）的解决方案。你可以通过查阅以下网站深入了解此主题，该网站将提供有关使用\
