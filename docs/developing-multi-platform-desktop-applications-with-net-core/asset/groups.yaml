  - '[PAGE 113]


    This technic uses the compilation on the development machine, but you can also
    build the application on the target computer and attach the debugger afterward.


    The remote debugging tool is an essential method when you encounter issue on a
    specific OS (and not on the others), it could help you to identify the source
    of the issue and thus, solving it in a minimum amount of time.


    But be aware, the remote debugging tool is sometimes not a pertinent tool to use
    for multiplatform application project development especially when this one used
    native calls (with P/Invoke). This tool cannot be used when you choose to build
    a native executable of your application.


    In resume it is a tool to use at an early stage of the coding phase if you have
    issue on a particular platform, it can help you to identify fatal flaw of a design
    on a particular OS (yes that’s happen: some system offers features that others
    do not). We recommend to use the remote debugging tool in peculiar cases of project
    development requiring specifics debugging context.


    Otherwise do not spend too much time on this aspect of the development, you will
    find most of the bugs during the coding phase on the windows development platform
    (within the classical Visual Studio integrated debugger) anyway.


