    With this table you can quickly review which type of application matches most
    of your needs for the development of your project, but this list of criteria may
    not match every constraint of your project. If that’s the case, you have to study
    more carefully each solution proposed previously in this chapter.


    The choice of the tool (and API) you intend to use for the implementation of your
    .NET Core 3 GUI will predetermine your application’s graphical capabilities, the
    storage size required (including the dependencies) and the performance. It is
    a crucial point; choose the tool most adapted for the purpose of your application.


    Each type of application previously presented requires (at some point or another)
    the use of a machine native layer that will allow the rendering of your application
    on the specific platform. Verify, before starting to code, that the solution chosen
    provides all the functionalities required by your application’s specifics.


    ![](img/3d310cc066dda6e2dfa67a650614076f_260_0.png)


    ## Chapter 9. COMPILATION AND BUILD WITH .NET CORE 3


    The process aiming the production of an executable program is decisive in the
    software development life cycle, especially for the multiplatform development
    context.


    The type of distribution you plan to use for your project (Internal, Opensource
    or Commercial ...) will be determinant for the choice of the type of compilation
    and building options you will select for the release of your project.


    We can define three kinds of target audience for your software:


    -   Your software is an integrated solution addressing the user (whatever the
    license type: commercial, shareware, Opensource based software).

    -   Your software is a company-oriented solution (software solution provider).

    -   Your software has to be deployed only inside your company (internal software).


    In these three cases you will have to build your project according to different
    constraints, and the production environment will define the kind of build you
    will choose for the release of your software. For doing so, .NET Core 3 offers
    you a wide range of solutions for the compilation and the build of your multiplatform
    software.


    -   **FDD**: Framework Dependent Deployment: This is the .NET Core classical .dll
    file, the .NET Core 3 runtime (shared) has to be installed on the target computer,
    this is the default building configuration in .NET Core 3.

    -   **SCD**: Self-Contained Deployment: The application output folder contains
    all the dependencies needed for running the program (the .NET Core 3 runtime is
    included).

    -   **FDE**: Framework Dependent Executable: The application output is a .NET
    Core 3 executable, but like FDD the shared .NET Core 3 runtime is mandatory on
    the target machine.

    -   **Native machine executable** (specific file for each platform): The application
    is a machine native executable that still requires the dependency of the project
    but not the .NET Core 3 runtime (it can be produced with CoreRT).


    The choice between these four types of release will be made from the type of GUI
    solution you have chosen and the type of deployment you want to use (it is often
    defined from the project context).


    We will review these types of solution and try to help you to choose the most
    adapted to your requirements.


    Whatever the kind of release you want to achieve, we recommend, for a better visibility
    of OS specific issue(s), to build the project separately on each platform: build
    the ubuntu project on ubuntu, macOS on macOS and Windows on the Windows platform
    (The commands of the dotnet CLI are the same among the presented platforms).


    For doing the compilation and the building of your .NET Core 3 application you
    have the choice to use the CLI dotnet command or to use MSBuild from Visual Studio
    2019 (it is not exactly similar just yet).


    In the present chapter you will learn also how to produce, with the dotnet CLI
    (command line tool) and/or CoreRT, either a MSIL executable (which requires .NET
    Core 3 runtime to be installed) or a native executable for each OS you targeting
    (and thus losing the need for the installation of the .NET Core Runtime).


    This choice depends on the type of GUI solution you are using (if it requires
    native dependencies) and the type of distribution you plan to use for your release.


    With the review of the distinct features provided by each tool used for this task,
    you will find the most adapted solution for the definition of your building process.


    ### 9.1 .NET Core CLI LOCAL TOOLS


    In .NET Core application development, the dependencies are managed by NuGet packages
    providing a better way than in the classical .NET framework to keep your dependencies
    up to date.


    This architecture provides consistency and maintainability of the dependencies
    used for the application you develop. This is a key foundation of the .NET Core
    framework; every specialized functionality has to be integrated via a specific
    NuGet package.


    You can resolve the update of the packages with the restore command of the dotnet
    CLI on the project.


    If you tried local tools in .NET Core 3.0, such as running “dotnet tool restore”
    or “dotnet tool install”, delete the local tools cache folder. Otherwise, local
    tools won’t work on any newer release. This folder is located at:


    **On macOS and Linux:**


    ```bash

    @user> rm -r $HOME/.dotnet/toolResolverCache

    ```


    **On Windows:**


    ```console

    C:\> rmdir /s %USERPROFILE%\.dotnet\toolResolverCache

    ```


    Local tools rely on a manifest file named “dotnet-tools.json” in the current project
    directory (dotnet folder). This manifest file defines if the tool(s) is available.
    You can distribute the manifest file with your code to ensure that anyone who
    works with your code can restore and use the same tools.


    ### 9.2 .NET CORE CLI BUILDING OPTIONS


    “dotnet CLI” is the tool allowing the developer to manage .NET Core 3 source code
    and resources. Various commands enable to perform specific tasks (for example
    “dotnet run”, for executing the program). Each of these commands defines its own
    sets of arguments.


    Several dotnet commands can be used for the build of your project, you can use
    one or the other, according to the kind of result you expect. These commands are
    “build” for explicitly building your dotnet project and “publish” which packs
    the project (and its dependencies) in a folder ready for deployment.


    Here is a preview of the basic commands available by default with the dotnet CLI
    tool (most frequently used):


    -   **new**: Create a new item, project or element based on the template specified.

    -   **restore**: Restore the dependencies of a project.

    -   **build**: Create the CLR image of a project.

    -   **run**: Execute the project.

    -   **publish**: Packs the CLR image of a project for the deployment.

    -   **test**: Execute the unit tests.

    -   **pack**: Packs the project into a NuGet package.

    -   **clean**: Erase assemblies image of a project.

    -   **help**: Display detailed documentation of the specified command.

    -   **store**: Record the assembly in the runtime package store.


    All these commands are very interesting but we will consider the most often used.
    We will review deeper two of these commands: build and publish.


    #### 9.2.1 dotnet build


    The "build" command generates a .NET Core assembly of a project and all its dependencies.
    This command performs the “implicit” restoration of the dependencies too.


    You can compile and build your .NET Core 3 project directly from the command line
    as presented below (you have to be in the folder containing the .csproj file).


    ```bash

    C:\> dotnet build

    ```


    Of course, you can define more complex building command line instruction as presented
    below.


    ```bash

    C:\> dotnet build -r win-X64 --configuration Release

    ```


    Here is the explanation of the most commonly used options presented in the previous
    command line instruction.


    -   **-c (or --configuration)**: Define the configuration to use for the build,
    the default value is "Debug" (Specify "Release" if needed)

    -   **-o (or --output)**: Define the target folder for the assembly produced by
    the build command.

    -   **-r (or --runtime)**: Specify a target runtime (see Rid references)


    #### 9.2.2 dotnet publish


    The "publish" command generates a .NET Core assembly of a project and all its
    dependencies. The “publish” command triggers a build as well.

