  mdcn: "\n\n在项目的每个阶段（SDLC）中，都非常推荐采用一种开发方法论。\n\n**如果您的项目涉及多人协作（如设计师、程序员、DBA、架构师等），并且您需要向管理层提交项目状态报告，则特别推荐使用这些方法。**\n\
    \n在开始复杂的软件开发项目之前，您应考虑以下基本要求：\n\n- 项目规划（即使只是在 MS Excel 表格中完成，也建议使用项目规划工具）。\n- 项目管理：敏捷方法为中规模团队提供了灵活的管理方式。\n\
