  - '[PAGE 128]


    All the projects have been built with the .NET Core 3 and most of them using Visual
    Studio 2019.


    # 8.1  CHOOSE THE MULTIPLATFORM APPLICATION TYPE: THE RIGHT TOOL FOR THE JOB


    According to the type of project you intend to develop, the choice of the languages
    (C++, HTML, XAML ...) and the targeted framework is crucial.


    Many solutions exist already on the market for multiplatform development but only
    .NET Core 3 provides you the state of the art in the arena, regarding performances,
    maintainability, language features, packaging and deployment capabilities.


    In the present book we will offer you a panorama of solutions for solving the
    specific issues you could experience during a multiplatform desktop application
    development using .NET Core 3.


    Each solution proposed could address specific constraints or provides specific
    features your application has to integrate, none of these solutions offer a perfect
    response to all multiplatform desktop development needs, that''s why you have
    to give a particular attention to the choice of the development’s type you will
    initiate to respond to your software specifications (and according to the resources
    available).


    This can be achieved by studying carefully each solution examples this book provides:


    +   - The console GUI application.

    +   - The web GUI (Electron.NET) application.'
