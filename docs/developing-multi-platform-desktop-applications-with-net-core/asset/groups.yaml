    当你在 Windows 上运行应用程序（使用 `dotnet electronize start` 命令）时，会注意到一个安全对话框窗口出现（具体取决于所使用的安全级别），你必须确认提出的安全规则（点击下方窗口中的“确定”）。


    ![](img/3d310cc066dda6e2dfa67a650614076f_164_0.png)


    ## 8.3.6 Electron.NET 应用的优缺点


    由于该应用是一种 Web GUI 实现，因此在所有平台上的渲染都非常相似。GUI 显示在平台间的一致性是该类解决方案所实现的特点（和优势）之一。能够使用增强的
    JavaScript 界面设计是另一个优势，但此类桌面应用程序的性能并不总是最优的。


    尽管你可以使用 Visual Studio 开发工具来开发 Web 应用程序部分，但 Electron.NET 工具无法在 Visual Studio 2019
    内部使用，你必须使用“dotnet CLI”来初始化、运行、构建和打包应用程序（如前所述）。


    Electron.NET 为 ASP.NET 开发人员提供了将其应用程序针对离线桌面环境运行的能力，但在这样做之前，仍有一些特定的 Electron.NET
    知识需要消化。即使你是一名资深 ASP.NET Web 开发人员，你也必须经历一个学习曲线，以消化桌面开发的特定要求。


    **注意：** Electron.NET 对其必须使用的 .NET Core 版本要求非常严格，你必须找到 Electron.NET 版本和 .NET Core
    版本之间的正确组合，才能成功构建和执行程序（在某些情况下这可能很棘手）。


    ## 8.4 C++ 原生 GUI 应用程序


    在 .NET Core 3 应用程序中实现原生 UI 有几种解决方案。使用原生 GUI 可以为每个操作系统的用户提供一种该应用程序是专门为其自身平台开发的感受。通过使用标准的窗体和控件，用户可以直接熟悉软件界面（应用程序看起来像是原生的）。


    图形原语在三大系统（Linux、macOS、Windows）上的稳定标准化，为开发人员提供了编写在所有系统上都工作的图形界面的机会。通过使用经过适当包装的
    .NET Core 3，开发人员可以受益于已存在相当一段时间的 C++ 库（可靠性）。


    这里展示了在 .NET Core 3 应用程序中使用原生库实现 GUI 的架构模式（图 1）。


    ![](img/3d310cc066dda6e2dfa67a650614076f_166_0.png)


    跨平台图形库必须根据应用程序实际运行的操作系统进行切换。在这种情况下，你应该拥有你所工作的系统对应的库版本。


    对于开发跨平台应用程序，你应该拥有每个操作系统的库。


    这些库中的大多数最初都是为与 C++ 配合使用而开发的，因此需要开发一个 Wrapper（封装器）。


    Wrapper 将机器码库封装为 .NET Core 可访问的对象，Wrapper 提供针对原生库的非托管调用（marshalling）和 P/invoke
    方法。


    最终，你需要每个平台的编译后库（即 Linux 的扩展名、macOS 的 **dylib** 扩展名、Windows 的 **dll** 扩展名）以及一个
    Wrapper（可能是一个包），以便在 .NET Core 3 中使用这些（原生）库并调用它们。


    有许多基于 C 和 C++ 语言的多平台 GUI 解决方案（许多操作系统使用这种语言开发），这些方案是自己在 .NET Core 3 中实现 GUI 的良好起点，以下列表列出了其中最受欢迎、经过验证且高效的几个：


    - LibUI

    - guilite

    - Cogui

    - Nuklear


    这些框架旨在作为开发 C 程序的“砖块”（用户界面），那么，为什么要在本书中介绍此类工具呢？好吧，C 库可以很容易地从 .NET Core 3 应用程序中调用（参见关于使用非托管依赖项的章节），通过一个
    Wrapper 类即可实现。


    Wrapper 使 C 库的集成几乎像使用标准包一样简单。如今，非托管库（C、C++）的集成在托管应用程序（.NET）中已经做得非常好了。


    你可以从以下参考链接找到关于这些库的更多信息：


    | https://github.com/dnlabss/liblul | https://github.com/idear4good/GuiLite |
    https://github.com/vurturn/nuklear | http://xpcda.net | http://cegui.org.uk |

    | --- | --- | --- | --- | --- |


    当然，你可以为你最适配的库开发自己的 .NET Core wrapper，但为使用这些库编写 wrapper 是一个大量的工作，往往本身就是一个独立的项目。


    然而，其中一些库（最受欢迎和广泛使用的）已经开发了针对 .NET Core 的 wrapper。你选择的库已经有了由经验丰富的个人或开发社区制作的多个版本的
    wrapper，他们希望访问轻量级 C 图形用户界面框架（同时也为了性能），用于他们的 .NET Core 开发。


    对于以下示例，我们选择使用 LibUi。首先，因为 LibUi 是一个被专业人员认可的、高效的库，并且已经有多个针对 .NET Core 使用的 wrapper
    实现开发并可用，避免了开发我们自己 wrapper 的繁琐且耗时的任务。此外，它使用我们打算开发的每个平台的原生控件。


    ### 8.4.1 LibUI 简介


    LibUI 是一个简单的、可移植的 C 语言 GUI 库，它在每个支持的平台上使用原生 GUI 控件。这是一个开源且免费使用的框架，由一个充满活力的社区开发，如果你认为其他用户会很高兴拥有改进或新功能（通过
    GitHub 贡献），你也可以参与其开发。


    该库可用于 Windows、Linux 和 macOS（以及几个其他操作系统！）。作为一个开源项目，你可以在 GitHub 存储库上免费找到源代码。


    LibUI 库的开发仍然非常活跃，最后一次发布是在 2019 年 4 月 7 日（截至此时），这将保证如果你遇到特定问题（这不是支持，但在许多情况下，它会帮助你修复问题）或需要特殊功能时，拥有一个响应迅速的社区。


    ![](img/3d310cc066dda6e2dfa67a650614076f_169_0.png)


    你应该查阅 LibUI 的 GitHub 网站以访问文档并获取一些控件使用的示例（通常是用纯 C 开发的）。GitHub 网站还将帮助你了解 LibUI 背后的内部逻辑（总是很有用的）。


    ### 8.4.2 LibUI 的 .NET Core wrapper


    正如我们之前提到的，已经有多个 wrapper 被开发用于在 .NET Core 中使用 LibUI。这些 wrapper 中的大多数是使用 .NET Standard
    实现的。针对 .NET Core 的可用 wrapper 列表来自 LibUI 的 GitHub 网站，并得到社区的认可。


    - DevZH.UI

    - TDFX.UI (SharpLibUI)

    - SharpUI


    经过多次测试，DevZH.UI 似乎是最灵活的解决方案。即使最后一次更新是在 2017 年签入的，这个 wrapper 也是最新的并且可以正常工作（这种情况并不常见），兼容当前版本的
    LibUI（最后更新于 2019 年 4 月 7 日）。


    原始版本 DevZH.UI 的源代码可用（见下方 GitHub 链接）。如果你不太放心使用选定的 wrapper（DevZH.UI），你也可以查看其他解决方案。


    ![](img/3d310cc066dda6e2dfa67a650614076f_170_0.png)


    NuGet 包的发行名称是 DevZH.UI，它可以在标准 NuGet 网站上找到。


    ![](img/3d310cc066dda6e2dfa67a650614076f_170_1.png)


    虽然 NuGet 包看起来处于 alpha 版本，但在测试平台上的示例程序开发过程中，源代码运行得非常良好。我们在审查过程中没有遇到任何问题。


    但由于标记为 alpha 版本，你需要在包管理器中勾选“包括预发布版本”（include prerelease），以便在 Visual Studio 的 NuGet
    包管理器窗口中列出该包（见图 1）。


    '
