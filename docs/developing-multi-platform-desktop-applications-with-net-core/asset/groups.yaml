    # Chapter 2. Presentation of .NET Core 3


    .NET Core is a product born in 2015 (actually in beta since 2014).


    It has been defined from the classical .NET Framework. Many technical options
    chosen during the .NET framework evolution have defined the need of new paradigms.


    We will see how these evolutions of the .NET framework took place and in which
    context the need of the new framework: .NET Core, is appeared obvious.


    ## 2.1 Little historic of the Microsoft .NET framework


    The first .NET Framework was delivered in 2002 and was a proprietary system (a
    black-box) from Microsoft. It was a response from the Redmond editor to the Java
    framework gaining in popularity at this time. As the Java framework, the .NET
    framework uses a virtual machine for the execution of the program.


    With the .NET framework, the source language was not any more compiled to machine
    code but to a MSIL (Microsoft Intermediate Language), this language is compiled
    at runtime by the CLR (Common Language Runtime) to machine code, executed in the
    .NET framework virtual machine.


    This runtime translates in real time each portion of the code that has to be executed
    through native code for the platform.


    ![](img/3d310cc066dda6e2dfa67a650614076f_22_0.png)


    Added to this compilation capability, the CLR provides many services for the code
    generated. Here is a non-exhaustive list of these basic features provided:


    - Base Class Library (BCL).

    - Threading Model.

    - Type checker.

    - Exception manager.

    - Garbage Collector.

    - MSIL to Native code compiler.

    - Class Loader.


    Few years after Microsoft released many subsets of the .NET framework adapted
    to each field of application the company encountered: .NET Compact Framework,
    Silverlight, Windows Phone...


    Each of these frameworks incorporates its own set of specific functionalities
    at the framework level and thus has become incompatible between them (for most
    of the code).


    Due to their specific evolutions (vertical) of their APIs, the development of
    application targeting multiple types of platform was more and more costly in matter
    of time and resources due to the vertical evolutions of each framework.


    It can easily be explained by the fact that initially there was no will to share
    code between frameworks because these frameworks were dedicated to their specific
    field of applications and platform context.


    But nowadays, cross-platform development has become a very common requirement
    for many projects. Many applications blur the lines between vertical .NET frameworks:
    often a web application uses Windows dedicated functionality, desktop or phone
    application uses web backends (Web Services or Web APIs) and so forth...


    That is in that context that .NET Core and .NET Standard have been planned and
    defined as a new subset of the .NET Frameworks.


    Here is a little schema explaining the link between .NET framework and .NET Core.


    ![](img/3d310cc066dda6e2dfa67a650614076f_24_0.png)


    (source Microsoft)


    The .NET Standard can be used with the .NET framework and .NET Core; this library
    format provides an amazing portability whatever the framework you intend to use
    with it.


    ## 2.2 Why .NET Core?


    The complexity implied by the use of multiple frameworks, each specialized in
    their own field, became the pitfall of most multifaceted platform development.
    As these kinds of development are turning into increasingly commonplace, the need
    of a new framework appears.


    That’s in that context that appear the need of a minimal framework where all the
    specifics for each platform and features will be integrated through NuGet package
    instead of being integrated inside the core framework (like it was the case previously
    for the .NET framework).

