    # 9.4.3 Prerequisites install for CoreRT


    As we have seen previously CoreRT use a C compiler for the production of a machine
    native executable, thus a proper environment has to be setup on each platform
    before achieving the production of a machine native executable.


    # 9.4.3.1 On macOS


    On the macOS, you will have to install the "XCode command line tools", actually
    the "gcc" compiler for macOS.


    The easiest way for doing so is to invoke "gcc" from the command line as described
    below.


    ```

    ```bash

    $ gcc

    ```

    ```


    If you do not have the required tools (gcc already installed) a dialog will pop-up
    as below, otherwise you have already the tool installed.'
