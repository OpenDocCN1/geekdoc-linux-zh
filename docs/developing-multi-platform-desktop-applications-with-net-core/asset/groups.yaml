    https://github.com/GtkSharp/GtkSharp/Sample

    .Net Core 3 version:

    https://github.com/netcore3/CodeBook/Chapter 8/5/GtkSamples


    As you understand, in this example project, no tool for the visual design of the
    application has been used; each widget is created by code.


    Like the development of an application with LibUi (see previous section), the
    widgets are declared and configured with C# plain code. The accurate positioning
    of each widget is, in this context, not an easy task (if you have to build the
    application from a mockup). This method of GUI coding has the advantage of not
    requiring the setup of Glade for the visual design of the screen on the development
    station (Is it an issue?).


    If you want to develop a complex application (and/or with many forms design),
    you should consider to use Glade/GtkBuilder application (see next sample) type.


    ### 8.5.5.2 XML coded GUI sample (with Glade)


    This sample is built around the template furnished in the package GtkSharp.Template.C#
    previously described.


    This is a basic implementation of the GtkSharp.Application template. This template
    furnishes the basic architecture for the building of Gtk# application with a GUI
    developed with Glade (and loaded in GtkBuilder).


    In this sample you can use the Glade, visual interface designer for the conception
    of the GUI. The user interface is implemented through an XML file (with .glade
    extension) and can be edited with Glade inside the Visual Studio 2019 interface
    (that is handy) as shown before.


    Here is the “Solution Explorer” view, illustrating the structure of this project
    called “GtkBasicForm”, in Visual Studio 2019.


    ![](img/3d310cc066dda6e2dfa67a650614076f_211_0.png)


    The template used for the generation of the application (from GtkSharp.Template.CSharp)
    is targeting .NET Core 2 by default, so the first thing you have to do is to update
    the project for targeting .NET Core 3. That’s can be done by editing the .csproj
    file and updating the version number of the .NET Core framework targeted.


    The project is composed of the main program and an object for the hosting of the
    GUI described in the “glade” file. The loading of the GUI is performed with the
    GTK Builder; it will also reroute all the signals of the GUI to the main program
    object.


    This is a basic Glade application with only a label text and button from the Gtk
    project template generated with the GtkSharp.Template.CSharp package.


    Here is a view of the result of the execution of this project “GtkBasicForm” on
    the different platforms.


    On macOS:


    ![](img/3d310cc066dda6e2dfa67a650614076f_212_0.png)


    On Ubuntu:


    ![](img/3d310cc066dda6e2dfa67a650614076f_212_1.png)


    On Windows:


    ![](img/3d310cc066dda6e2dfa67a650614076f_213_0.png)


    The “GtkBasicForm” example does implement a signal on the button `clicked` event
    with the corresponding handler method `button1_clicked`. The event is implemented
    inline (it should be integrated in the `.glade` file).


    This project provides a good starting point for starting the development of a
    GTK .NET Core 3 application; it can be used as a template for just doing that.


    The edition of the GUI is much more flexible than coding the GUI, and offers greater
    possibilities to design a proper GUI in a minimum of time (once you are familiar
    with Glade GUI).


    You will find the source of this project example on the netcore3 GitHub repos.


    ![](img/3d310cc066dda6e2dfa67a650614076f_213_1.png)


    ### 8.5.6 GTK Themes: Installation and Configuration


    As themed graphic toolkit, GTK allows you to develop your own theme for your application.
    Furthermore, it allows the developer to customize an existing theme for matching
    his requirements with the adapted look and feel (color, font, positioning...)
    in a minimum of time and coding effort.


    You can find predefined GTK Themes at the reference link furnished below.


    https://www.gnome-look.org/


    This web site provides more than a thousand already made themes for Gtk3; furthermore
    it is freely usable for the development of your application (Opensource license).


    ### 8.5.6.1 Use another theme for your application


    If you want to make your application singular and not look like the standard GTK
    application design, you can specify a theme to be used instead of the default
    one.


    You can achieve this by specifying explicitly the theme you want to use in the
    C# source code.


    There is a dedicated documentation for the theming of your GTK application in
    the reference link if you require more information about this domain.


    http://developer.gnome.org/gtk3/stable/theming.html


    ### 8.5.6.2 Design of a new Gtk theme


    If you have the need for a complete theme development you can use an already existing
    tool for achieving this goal: Oomox.


    Here is a screenshot of the Oomox application.


    ![](img/3d310cc066dda6e2dfa67a650614076f_215_0.png)


    Oomox theme designer is an Opensource software and is available on GitHub.


    These tools are implemented for the Linux platform. Oomox is a graphical application
    for generating Arc themes (Gtk3) and color-schemes.


    ![](img/3d310cc066dda6e2dfa67a650614076f_215_1.png)


    ### 8.5.7 Recommendations for Gtk application development


    GTK Toolkit has tremendous possibilities. As it comes from the C, C++ environment,
    we could recommend that you have already a basic knowledge of this kind of project
    (at least for using the documentation). The possibility offered by the GTK# development
    project is Amazing, and makes it a lot easier to use the GTK Toolkit with the
    .NET Core 3 framework.


    The use of GTK# looks like an awesome solution for the development of your multiplatform
    GUI application if you do not have special or exotic requirements for your GUI.
    Otherwise, you will have to work with a part of your project in plain C (for your
    exotic widget). The development of custom widgets will imply the extension of
    the wrapper as well (it means a lot of work...).


    ## 8.6 QT/QML GUI APPLICATIONS


    Like the previous samples presented (Libui, Gtk), the QT/QML solution for the
    implementation of a GUI desktop application is based on a graphic framework developed
    with C, C++ and implements the same type of architecture as described (Figure
    1).


    ![](img/3d310cc066dda6e2dfa67a650614076f_217_0.png)


    (Figure 1)


    QT Quick is an Opensource framework developed and maintained by Digia and belongs
    to the QT framework family.


    QT Quick includes a declarative script language called QML; this language allows
    to design and develop, in an easy way, a highly performant and animated GUI for
    a software application.


    ### 8.6.1 QT presentation


    QT is a multiplatform framework for the development of graphical application.
    This framework has been first released in 1995 and has now serious proofs regarding
    its stability and the quality of the software produced. The KDE Linux desktop
    application has been developed using this tool (and many other famous desktop
    applications).


    Added to the QT Opensource community, QT has been incorporated since 2014. There
    is no doubt that the developments using this tool will become widely distributed
    and will benefit from a professional guarantee and support.


    QT nowadays provides a complete development environment for multiplatform application
    design, which is based on C and C++. It provides solutions for desktop and mobile
    platforms development. QT provides a complete abstraction layer of the GUI (among
    other things).


    QT allows to develop GUI software for almost every platform, from the powerful
    workstation with a large display device to the embedded board computer passing
    by mobile and tablets (see the QT web site for more details). The versatility
    of this framework is astonishing and to acquire competences on this technology
    cannot be a lost investment in the long run (especially since the project have
    the support of a dedicated company).


    QT framework has Dual licenses terms, one commercial and another Opensource (this
    is the one we will use in our samples). Notice that the QT framework is developed
    by the company QT and requires specific license according to the type of usage
    you have planned to do with it. Please consult the web site of the company for
    more information about the licensing conditions.


    From the technical standpoint, QT provides a graphical framework allowing the
    developer the implementation of high-quality graphical software, with the possibility
    to use effects and animations (natively included in the framework). QT is actually
    used in a number of main stream products for their graphical interface design
    (automotive, dedicated hardware, Laboratory hardware ...). Especially if you plan
    to use a GUI coming from a designer using Photoshop, you will be able, with QT,
    to use directly the graphic resources produced.

