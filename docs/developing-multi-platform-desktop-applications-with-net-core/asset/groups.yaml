    Like its predecessors, the .NET Core 3 is open source and cross-platform. With
    this implementation, Microsoft has included the support of C# 8, a major release
    of the C# language. But this is not the only addition to the .NET Core Microsoft
    has done in this version.


    The two following schemas illustrate the job done by Microsoft for the third release
    of their new iconic framework: .NET Core 3. We can see that it is a major release
    compared to the .NET Core 2, which was basically an update of the first version
    designed for running Web applications and services for cross-platform environments.


