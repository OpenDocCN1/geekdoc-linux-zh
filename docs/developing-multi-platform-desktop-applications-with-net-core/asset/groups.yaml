    but it will be signaled for each example requiring such install.


    # 6.5.3    The macOS station

    (see .NET Core 3 Install for macOS).


    We recommend to install the excellent tool “Homebrew”, the missing package manager
    for macOS. It is often useful to easily install packages as part of a full stack
    macOS development (and it is mandatory in some cases we will study). You will
    find a detailed install instruction in the GTK project example section (who requires
    “brew” for the setup of the dependencies).


    For the development station, if you plane to use macOS system APIs or use native
    libraries it should be wise to install XCode as well or at least the “XCode command
    line tools”.


    XCode is the Apple IDE for macOS and ObjectiveC (the language in which macOS is
    written). It can help you to match the appropriate library (native API), for that
    OS.


    That’s suppose that you have minimum knowledge in ObjectiveC developments, that
    could be tricky if you do not know the macOS system (for specialist only).


    ![](img/3d310cc066dda6e2dfa67a650614076f_109_0.png)


    ```

