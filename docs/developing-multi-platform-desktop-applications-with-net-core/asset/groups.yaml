    \ Serilog:\n\n![](img/3d310cc066dda6e2dfa67a650614076f_70_0.png)\n\n### 5.3 DATA\
    \ ACCESS: ENTITY FRAMEWORK CORE\n\nWith .NET Core 3, the developer can still use\
    \ classical ways (as done with .NET Framework) to access the database (Command,\
    \ Request Reader...) but for modern advanced software solution the data access\
    \ have to be layered in a standardized way (with ORM).\n\nThe data access in .NET\
    \ Core should be done (that's not mandatory, but it's highly recommended) by using\
    \ the Entity Core component (a NuGet package). This is the ORM (Object Relational\
    \ Mapper) developed by Microsoft inherited from the dotnet framework (Entity Framework).\n\
    \nThe Entity Framework Core has followed the trend set, as .NET Framework, to\
    \ a lighter multiplatform environment.\n"
  mdcn: "\n\n```csharp\nConsole.WriteLine($\"Hello Mr {config[\"FirstName\"]} {config[\"\
    LastName\"]}\");\n\nConsole.ReadKey();\n```\n\n如你所见，只需一行代码就足以完成配置声明、读取配置文件以及构建\
    \ ConfigBuilder 对象。该对象（实际上是一个接口类型）使用一组键值对来存储配置属性。此外，该对象还提供了检索实例对象值的能力（这在强类型配置中非常有用）。\n\
    \nMicrosoft.Extensions.Configuration 提供了架构的部分/项目以及加载这些部分和项目的主要方法，包括：\n\n- **GetChildren()**：获取后代子部分。\n\
    - **GetSection(string)**：获取具有特定键的部分。\n\n当然，这只是一个基本示例，但配置构建器提供了管理复杂约束的可能性，例如层级\
    \ JSON、多个（数组）值检索、秘密值的使用以及本文未详述的其他许多情况。\n\n这只是包方法的一个简要概述，你可以通过点击下方的参考链接找到关于此主题的详尽信息来源：\n\
    \n## 第 5 章：C# 应用程序的基本编码技术\n\n![](img/3d310cc066dda6e2dfa67a650614076f_64_0.png)\n\
    \n关于在 .NET Core 3 中使用配置文件的总结，Microsoft 包提供的基本配置工具功能强大，能够满足大多数应用程序的需求。存在多种类型配置文件的提供程序（JSON、XML、INI\
    \ 等）。而且，当然，如果你有特殊需求，也可以编写自己的提供程序。\n\n你可以在 netcore3 GitHub 上获取一个可运行的示例项目。\n\n![](img/3d310cc066dda6e2dfa67a650614076f_64_1.png)\n\
    \n### 5.2 日志记录和跟踪\n\n.NET Core 具有内置的日志记录/跟踪机制。该机制对于基本的日志记录需求非常方便。但如果你需要更高级的日志记录机制（例如用于错误处理自动化系统），则必须使用更高级的工具。\n\
    \n有许多解决方案（你可以查看 NuGet 存储库）用于在应用程序中实现结构化日志系统，其中最常用和最流行的是 Log4NET、NLog 和 Serilog。\n\
    \n这三款产品非常出色，并适应特定的需求。但在这部分，我们将详细介绍 Serilog 的使用方法，以简化的为目的；如果你有兴趣在你的应用程序中使用，不妨自由探索\
    \ Log4NET 和 NLog 解决方案。\n\n#### 5.2.1 Microsoft .NET Core 日志系统\n\nMicrosoft 现在提供用于应用程序日志记录、跟踪和调试功能的包。该封装为你的应用程序的日志记录和跟踪需求提供了基本功能。\n\
    \n![](img/3d310cc066dda6e2dfa67a650614076f_65_0.png)\n\n下面是一个简单的程序，用于使用这些 Microsoft\
    \ 包记录应用程序的活动。\n\n##### SampleMsLog.cs\n\n```csharp\npublic static void Main(string[]\
    \ args = null)\n{\n    ILoggerFactory loggerFactory = new\n        LoggerFactory().AddConsole();\n\
    \    ILogger logger =\n        loggerFactory.CreateLogger<Program>();\n    logger.LogInformation(\"\
    This is a test of\n        logging information system.\");\n}\n```\n\n首先，你必须开始创建一个日志工厂实例，接下来你需要指定你想要用于实际执行日志记录的提供程序（在示例中为“.AddConsole”）。\n\
    \n这是一种创建基本日志记录系统的简单解决方案，但如果你的开发对日志记录、跟踪和调试有特殊要求，你应该更进一步，探索使用更高级系统（如 Serilog）的可能性。\n\
    \n#### 5.2.2 高级结构化日志系统：Serilog\n\nSerilog 是一个结构化日志系统，当前基于 .NET Standard 2.0 实现，因此你可以在\
    \ .NET Core 3 项目中使用它。Serilog 是一个提供文件诊断日志记录的库。它易于设置，并且与其他日志库不同，它是基于强大的结构化事件数据构建的，因此非常适合桌面应用程序开发。\n\
    \n使用此日志系统，你可以实现一个控制台调试窗口，以跟踪你决定跟踪的应用程序的每个事件，并实时查看应用程序内部的运行情况。\n\n##### 5.2.2.1\
    \ 安装 Serilog\n\n你需要通过 Visual Studio 中的包管理器 GUI 或包管理器命令行添加 Nuget 包“Serilog”。之后，你将需要安装针对你想要使用的输出类型（称为“Sinks”）的特定包。\n\
    \n“Sink”描述了你想要为你的项目实现的日志类型。\n\n```\nnuget\n```\n\nSerilog\nSerilog.Sinks.Console\n\
    Serilog.Sinks.File\n\n除了文件和控制台，还有许多其他类型的 Sink 已经可用，你可以将应用程序的日志写入数据库、云端或 Microsoft\
    \ Teams 系统……\n\n##### 5.2.2.2 配置\n\nSerilog 的配置非常直接，大多数情况下不需要特定的配置文件。然而，你有使用一个配置文件来响应日志系统特定需求的可能性（请查阅参考网站以获取更多信息）。\n\
    \n如果你在该方面有特殊需求，你也可以参考 GitHub（Serilog 是开源的）存储库。\n\n##### 5.2.2.3 创建 Logger 并使用\
    \ Sinks\n\n首先，你必须创建一个 logger 对象：\n\n```\nLog.logger = new\nLoggerConfiguration().CreateLogger();\n\
    ```\n\n一旦 Logger 对象创建完成，它必须链接到一个指定的外部表示形式（例如文件或控制台窗口）。\n\n```\nLog.Logger.WriteTo.Console();\n\
    ```\n\n用于控制台日志记录系统。\n\n或者，对于使用文本文件作为输出：\n\n```\nLog.Logger.WriteTo.File(\"log.txt\"\
    , outputTemplate: \"{Timestamp:yyyyMMdd HH:mm:ss  \"} {Message:lj}\");\n```\n\n\
    你可以在提供的参考网站（下方提供的链接）找到有关日志格式化的更多信息。\n\n##### 5.2.2.4 日志级别\n\n一旦 logger 完全配置好，你就可以开始进行\
    \ Information 级别的日志记录：\n\n```\nLog.Information(\"Here is the logging!\");\n```\n\
    \n有几个级别可用于执行日志记录：\n\n- Verbose（冗长）\n- Debug（调试）\n- Information（信息）\n- Warning（警告）\n\
    - Error（错误）\n- Fatal（致命）\n\n你可以配置 logger 仅在定义的级别输出。\n\n下面是一个简单的示例程序，用于说明 Serilog\
    \ 的基本使用。\n\n##### ProgramSampleSerilog.cs\n\n```csharp\nstatic void Main(string[]\
    \ args)\n{\n\nConsole.WriteLine(\"Hello Serilog.\");\n\nvar loggerConfiguration\
    \ = new\nLoggerConfiguration()\n.WriteTo.ColoredConsole()\n.Enrich.WithMachineName()\n\
    .MinimumLevel.Debug();\nvar logger =\nloggerConfiguration.CreateLogger();\nLog.Logger\
    \ = logger;\n\nLog.Information(\"Starting up.\");\n\nvar sleepPeriodInSeconds\
    \ = 60;\nif (args.Length > 0 &&\nint.TryParse(args[0], out sleepPeriodInSeconds))\n\
    {\nLog.Information(\"Sleep interval\nprovided: {SleepPeriodInSeconds}.\",\nsleepPeriodInSeconds);\n\
    }\n\nvar sleepPeriod =\nTimeSpan.FromSeconds(sleepPeriodInSeconds);\n\nwhile (true)\n\
    {\nvar coinToss = Random.Next(0, 2);\nLog.Information(\"Coin Toss...\n{CoinToss}\"\
    , coinToss);\n\nvar instance = coinToss == 0 ? new\nWithPropertyInit() : null;\n\
    \nLog.Information(\"Doing Work...\n{NameOfProp}\", instance?.NameOfProp);\nLog.Information(\"\
    {Instance}\",\ninstance);\n\n}\n}\nThread.Sleep(sleepPeriod);\n}\n```\n\n我们可以看到，Serilog\
    \ 使用起来非常简单，并提供了大量的自定义能力。在许多应用程序开发场景中，这是一个特别相关的选择。这是一个具有活跃社区参与的开源项目，且文档丰富。\n\n\
    你可以深入了解 Serilog 的使用：\n\n![](img/3d310cc066dda6e2dfa67a650614076f_70_0.png)\n\n\
    ### 5.3 数据访问：实体框架 Core\n\n在 .NET Core 3 中，开发者仍然可以使用经典方法（如 .NET Framework 中那样）访问数据库（Command、Request\
    \ Reader...），但对于现代高级软件解决方案，数据访问必须以标准化方式进行分层（使用 ORM）。\n\n在 .NET Core 中，数据访问应当（这不是强制的，但强烈建议）通过使用\
    \ Entity Core 组件（一个 NuGet 包）来完成。这是由 Microsoft 开发的 ORM（对象关系映射器），继承自 .NET framework（Entity\
    \ Framework）。\n\nEntity Framework Core 遵循了 .NET Framework 设定的趋势，向更轻量的多平台环境转变。\n\
    \n"
