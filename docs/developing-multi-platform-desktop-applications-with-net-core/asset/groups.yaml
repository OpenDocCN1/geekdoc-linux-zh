  md: "\nwell. It is actually almost the same result as the “build” command but offer\
    \ some additional features.\n\nYou can “publish” your .NET Core 3 project directly\
    \ from the command line as presented below.\n\n```\nC:\\>dotnet publish\n```\n\
    \nYou can define a much more elaborated “publish” command as presented below.\n\
    \n```\nC:\\>dotnet publish -c Release -r win-x64 --self-contained /p:PublishSingleFile=true\n\
    ```\n\nHere is the explanation of the most commonly used options presented in\
    \ the previous command line instruction.\n\n-   **-c** (or **-configuration**):\
    \ Define the configuration to use for publishing.\n-   **-o** (or **-output**):\
    \ Publish the application inside the specified folder.\n-   **-r** (or **-runtime**):\
    \ Publish the application for a given runtime.\n-   **--self-contained**: Publish\
    \ the application with the .NET Core runtime (the dotnet core is, in this case,\
    \ no longer needed on the target computer where the application will be run)\n\
    \nThis is just a quick preview of all the options and commands available for the\
    \ “dotnet” command line, for a complete and exhaustive reference about the options\
    \ and switches you can read the Microsoft documentation at the following reference\
    \ links.\n\n-   https://docs.microsoft.com/en-us/dotnet/core/tools/dotnet-\n-\
    \   https://docs.microsoft.com/en-us/dotnet/core/tools/dotnet-build\n-   https://docs.microsoft.com/en-us/dotnet/core/tools/dotnet-publish\n\
    \nBoth of these commands use the .csproj file for building the project (added\
    \ to the command line arguments).\n\n## 9.3 STRUCTURES OF THE CSPROJ FILE\n\n\
    .NET Core 3 use the new .csproj file format (in replacement of the project.json\
    \ for .NET Core 2) for being used by MSBuild for the project building process.\n\
    \nWith this new .csproj file format Microsoft has achieved a marvelous work of\
    \ simplification (is far less verbose than before) but also achieved to add features\
    \ to it (specify the generation of a NuGet package at build time for example).\n\
    \nThe .csproj file consists in an XML file interpretable by MSBuild, it constitutes\
    \ a script for leading the building process (for the dotnet CLI as well).\n\n\
    The .csproj file is used by the MSBuild to compile, build and link your project.\
    \ It offers many features options:\n\n-   Single exe packaging.\n-   NuGet package\
    \ creation.\n-   Multi-framework targeting.\n-   Conditional references.\n-  \
    \ Conditional compilation.\n\nHere is a simple sample of a .csproj file :\n\n\
    ```xml\n<Project Sdk=\"Microsoft.NET.Sdk\">\n  <PropertyGroup>\n    <TargetFramework>netcoreapp3.0</TargetFramework>\n\
    \  </PropertyGroup>\n  <ItemGroup>\n    <PackageReference Include=\"Microsoft.Extensions.Configuration\"\
    \ />\n  </ItemGroup>\n</Project>\n```\n\n> (csproj figure 1)\n\nThe “.csproj”\
    \ file consists in two sections; these sections are child of the main node **<Project>**\
    \ (see csproj figure 1):\n\n-   **<PropertyGroup>:** This section contains a set\
    \ of properties relatives to the project; these properties are used by MSBuild\
    \ for the generation of an executable (MSIL or Native).\n    You have also the\
    \ possibility to add a conditional attribute regarding the environment where the\
    \ build is performed or the options chosen in the code.\n-   **<TargetFramework>:**\
    \ Specify the framework used by the application, this is a mandatory entry of\
    \ the .csproj file. You can specify multiple frameworks (comma separated).\n-\
    \   **<OutputType>:** Specify the executable output type\n-   **<AssemblyName>:**\
    \ This is the assembly name.\n-   **<OutputPath>:** This is the path where the\
    \ output file built will be copied.\n-   **<Optimization>:** Specify if you want\
    \ to use optimization (true/false).\n-   **<ItemGroup>:** This section contains\
    \ user-defined Item elements.\n-   **<PackageReferences>:** Allow you to choose\
    \ the referenced package according to the targeted framework and the version number(optional).\n\
    \nFor the presented properties above you can use the wildcards (`?`, `*`, `**`)\
    \ for a larger matching for version number, file names ...\n-   `\"?\"` matches\
    \ a single character.\n-   `\"*\"` matches a string or an empty string.\n-   `\"\
    **\"` matches a partial path.\n\n### Conditional package reference\n\nThe .csproj\
    \ file syntax allow you to use condition to include package reference (according\
    \ to the framework version, configuration, platform ...).\n\nHere is a demo snippet\
    \ of such .csproj capabilities.\n\n```xml\n<PropertyGroup>\n    <Apple>True</Apple>\n\
    \    <Banana>False</Banana>\n    <Pear>False</Pear>\n</PropertyGroup>\n\n<Target\
    \ Name=\"GetFruit\">\n    <ItemGroup>\n        <AllFruits Include=\"Apple\"\n\
    \                   Condition=\"$(Apple) ==true\"  />\n        <AllFruits Include=\"\
    Banana\"\n                   Condition=\"$(Banana) ==true\"  />\n        <AllFruits\
    \ Include=\"Pear\"\n                   Condition=\"$(Pear) == true\" />\n    </ItemGroup>\n\
    \    <Message Text=\"@ (AllFruits)\"/>\n</Target>\n```\n\n### Default compilation\
    \ includes\n\nMSBuild have predefined folder and file type who imply default behavior\
    \ during the compilation and the building process. The default includes and excludes\
    \ configuration are built-in the .NET Core SDK. This default compiling behavior\
    \ simplify the list items definition in the .csproj file.\n\nThe following table\
    \ shows which items (file types) are processed and what the MSBuild processing\
    \ do:\n\n| | Include File types | Exclude File types |\n| :--- | :---: | :---:\
    \ |\n| Compiled | .cs | .user, .proj, .sln, .vscc |\n| Embedded resources | .res\
    \ | .user, .proj, .sln, .vscc |\n| None | The rest of files types ... | |\n\n\
    *(source Microsoft)*\n\n*(The folders “/bin” and “/obj” are also exclude from\
    \ the MSBuild process.)*\n\nYou can enable/disable the default compiled files\
    \ type by setting a property in the PropertyGroup as described below.\n\n```xml\n\
    <Project Sdk=\"Microsoft.NET.Sdk\">\n  <PropertyGroup>\n    <TargetFramework>netcoreapp3.0</TargetFramework>\n\
    \    <EnableDefaultCompileItems>false</EnableDefaultCompileItems>\n  </PropertyGroup>\n\
    </Project>\n```\n\n### Platform build target specification\n\nAn important variable\
    \ to set in the .csproj file, is the PID (for Platform Identification, optional).\
    \ This variable specifies the OS platform for building a native .NET Core binary\
    \ for the platform specified (not machine native).\n\n### Single Exe\n\nThe .csproj\
    \ file allow you also to produce a single exe for your project, this can be done\
    \ by setting the suitable variable as described below.\n\nA single executable\
    \ can be produced by the build process when you specify simultaneously “PublishSingleFile”\
    \ and the platform you target (Rid) “RuntimeIdentifier” (as described in the snippet\
    \ below).\n\n```xml\n<PropertyGroup>\n  <PublishSingleFile>true</PublishSingleFile>\n\
    \  <RuntimeIdentifier>win-x64</RuntimeIdentifier>\n</PropertyGroup>\n```\n\nThe\
    \ “PublishTrimmed” option allow to use only dependencies that are actually used\
    \ in the program, but you have to specify them (as described in the snippet below).\
    \ You have to specify the dependencies reflection used as well.\n\n```xml\n<ItemGroup>\n\
    \  <TrimmerRootAssembly Include=\"System.IO\">\n  </TrimmerRootAssembly>\n</ItemGroup>\n\
    ```\n\n**TIPS:** Here is the useful example (that you can reuse in your own project)\
    \ of .csproj file for the creation of a single small executable with no dependencies.\n\
    \n```xml\n<Project Sdk=\"Microsoft.NET.Sdk\">\n  <PropertyGroup>\n    <OutputType>Exe</OutputType>\n\
    \    <TargetFramework>netcoreapp3.0</TargetFramework>\n    <PublishTrimmed>true</PublishTrimmed>\n\
    \    <PublishReadyToRun>true</PublishReadyToRun>\n    <PublishSingleFile>true</PublishSingleFile>\n\
    \    <RuntimeIdentifier>win-x64</RuntimeIdentifier>\n  </PropertyGroup>\n</Project>\n\
    ```\n\nThe example above, .csproj file will trigger the build of a Windows native\
    \ compiled single file application.\n\nThis is only an overview of the possibilities\
    \ offered by using the .csproj file (and MSBuild) options, this tool is very flexible\
    \ and can be adapted to many project requirements.\n\nYou can consult the very\
    \ well-done documentation about the .csproj file configuration and MSBuild on\
    \ the Microsoft's reference links below.\n\nhttps://docs.microsoft.com/en-us/visualstudio/msbuild/\n\
    https://docs.microsoft.com/en-us/visualstudio/msbuild/msbuild-project-file-schema-reference\n\
    https://docs.microsoft.com/en-us/dotnet/core/tools/csproj\n\n## 9.4 CORDER (AHEAD\
    \ OF TIME) COMPILATION\n\n**Warning**: CoreRT is an experimental tool from Microsoft\
    \ and there is no plan that it will be released as a standalone tool in the future.\
    \ This has been said, CoreRT is an amazing tool allowing the generation of a machine\
    \ native executable for a .NET Core 3 project.\n\nCoreRT is an Opensource tool\
    \ from Microsoft who bring native compilation possibilities to .NET Core applications.\
    \ The production of a native executable file is big achievement in the managed\
    \ development world.\n\nCoreRT can be used for targetting a wide range of platform\
    \ OS Windows, Linux and macOS. This tool provides the same performances level\
    \ for .NET Core software as a native C++ solution can provides. CoreRT provides\
    \ to the .NET Core 3 the same features as .NET Natives furnish for the .NET framework.\n\
    \nEven if many constraints and bugs have been found for the compilation of a Web\
    \ application, CoreRT seems to work just fine for console and libraries projects\
    \ (these are the types we are interested in).\n\nThis is a new technology, introduces\
    \ by Microsoft for improving the performances of .NET Core software whatever the\
    \ platform OS the software is running on. This tool is still under heavy development\n"
  mdcn: "\n\n嗯。它实际上与 “build” 命令的结果几乎相同，但提供了一些额外的功能。\n\n你可以如下直接从命令行 “发布” 你的 .NET Core\
    \ 3 项目。\n\n```\nC:\\>dotnet publish\n```\n\n你可以定义一个更为详尽的 “publish” 命令，如下所示。\n\n\
    ```\nC:\\>dotnet publish -c Release -r win-x64 --self-contained /p:PublishSingleFile=true\n\
    ```\n\n以下是上一条命令行指令中常用的选项说明。\n\n-   **-c**（或 **-configuration**）：定义用于发布的配置。\n-\
    \   **-o**（或 **-output**）：将应用程序发布到指定的文件夹中。\n-   **-r**（或 **-runtime**）：针对指定的运行时发布应用程序。\n\
    -   **--self-contained**：将应用程序与 .NET Core 运行时一起发布（在这种情况下，目标计算机上不再需要安装 dotnet core）\n\
    \n这只是 “dotnet” 命令行中所有可用选项和命令的快速预览，有关选项和开关的完整且详尽的参考，请阅读以下参考链接中的 Microsoft 文档。\n\
    \n-   https://docs.microsoft.com/en-us/dotnet/core/tools/dotnet-\n-   https://docs.microsoft.com/en-us/dotnet/core/tools/dotnet-build\n\
    -   https://docs.microsoft.com/en-us/dotnet/core/tools/dotnet-publish\n\n这两个命令都使用\
    \ .csproj 文件来构建项目（添加到命令行参数中）。\n\n## 9.3 CSPROJ 文件结构\n\n.NET Core 3 使用新的 .csproj\
    \ 文件格式（取代了 .NET Core 2 中的 project.json）供 MSBuild 在构建项目过程中使用。\n\n通过这种新的 .csproj\
    \ 文件格式，微软完成了一项出色的简化工作（比以前简洁得多），同时也为其添加了功能（例如指定在构建时生成 NuGet 包）。\n\n.csproj 文件是一个由\
    \ MSBuild 可解释的 XML 文件，它构成了引导构建过程（包括 dotnet CLI）的脚本。\n\n.csproj 文件由 MSBuild 用于编译、构建和链接你的项目。它提供了许多功能选项：\n\
    \n-   单可执行文件打包。\n-   NuGet 包创建。\n-   多框架目标。\n-   条件引用。\n-   条件编译。\n\n这是一个 .csproj\
    \ 文件的简单示例：\n\n```xml\n<Project Sdk=\"Microsoft.NET.Sdk\">\n  <PropertyGroup>\n\
    \    <TargetFramework>netcoreapp3.0</TargetFramework>\n  </PropertyGroup>\n  <ItemGroup>\n\
    \    <PackageReference Include=\"Microsoft.Extensions.Configuration\" />\n  </ItemGroup>\n\
    </Project>\n```\n\n> （csproj 图 1）\n\n“.csproj” 文件由两个部分组成；这些部分都是主节点 **<Project>**\
    \ 的子节点（参见 csproj 图 1）：\n\n-   **<PropertyGroup>:** 此部分包含一组与项目相关的属性；这些属性由 MSBuild\
    \ 用于生成可执行文件（MSIL 或 Native）。\n    你还可以根据执行构建的环境或在代码中选择的环境选项添加条件属性。\n-   **<TargetFramework>:**\
    \ 指定应用程序使用的框架，这是 .csproj 文件的必填项。你可以指定多个框架（以逗号分隔）。\n-   **<OutputType>:** 指定可执行输出类型\n\
    -   **<AssemblyName>:** 这是程序集名称。\n-   **<OutputPath>:** 这是构建输出的文件将被复制到的路径。\n-\
    \   **<Optimization>:** 指定是否要使用优化（true/false）。\n-   **<ItemGroup>:** 此部分包含用户定义的元素。\n\
    -   **<PackageReferences>:** 允许你根据目标框架和版本号（可选）选择引用的包。\n\n对于上述属性，你可以使用通配符（`?`、`*`、`**`）以进行更大范围的版本号、文件名等匹配。\n\
    -   `\"?\"` 匹配单个字符。\n-   `\"*\"` 匹配一个字符串或空字符串。\n-   `\"**\"` 匹配部分路径。\n\n### 条件包引用\n\
    \n.csproj 文件语法允许你使用条件来包含包引用（根据框架版本、配置、平台等）。\n\n以下是这种 .csproj 功能的一个演示代码片段。\n\n\
    ```xml\n<PropertyGroup>\n    <Apple>True</Apple>\n    <Banana>False</Banana>\n\
    \    <Pear>False</Pear>\n</PropertyGroup>\n\n<Target Name=\"GetFruit\">\n    <ItemGroup>\n\
    \        <AllFruits Include=\"Apple\"\n                   Condition=\"$(Apple)\
    \ ==true\"  />\n        <AllFruits Include=\"Banana\"\n                   Condition=\"\
    $(Banana) ==true\"  />\n        <AllFruits Include=\"Pear\"\n                \
    \   Condition=\"$(Pear) == true\" />\n    </ItemGroup>\n    <Message Text=\"@\
    \ (AllFruits)\"/>\n</Target>\n```\n\n### 默认编译包含项\n\nMSBuild 具有预定义的文件夹和文件类型，它们在编译和构建过程中隐含默认行为。默认包含和排除配置内置于\
    \ .NET Core SDK 中。这种默认的编译行为简化了 .csproj 文件中列表项的定义。\n\n下表显示了哪些项（文件类型）被处理以及 MSBuild\
    \ 处理的执行：\n\n| | 包含文件类型 | 排除文件类型 |\n| :--- | :---: | :---: |\n| 编译 | .cs | .user,\
    \ .proj, .sln, .vscc |\n| 嵌入式资源 | .res | .user, .proj, .sln, .vscc |\n| 其他 | 其余文件类型...\
    \ | |\n\n*(来源 Microsoft)*\n\n*(文件夹 “/bin” 和 “/obj” 也从 MSBuild 过程中排除。)*\n\n可以通过在\
    \ PropertyGroup 中设置属性来启用/禁用默认编译文件类型，如下所述。\n\n```xml\n<Project Sdk=\"Microsoft.NET.Sdk\"\
    >\n  <PropertyGroup>\n    <TargetFramework>netcoreapp3.0</TargetFramework>\n \
    \   <EnableDefaultCompileItems>false</EnableDefaultCompileItems>\n  </PropertyGroup>\n\
    </Project>\n```\n\n### 平台构建目标指定\n\n在 .csproj 文件中设置的一个重要变量是 PID（Platform Identification，平台标识，可选）。该变量指定用于构建指定平台（非机器原生）的\
    \ .NET Core 二进制文件的操作系统平台。\n\n### 单可执行文件\n\n.csproj 文件还允许你为项目生成单个可执行文件，这可以通过设置适当的变量来实现，如下所述。\n\
    \n当同时指定 “PublishSingleFile” 和你针对的平台（Rid）“RuntimeIdentifier” 时（如下所示代码片段中所述），构建过程可以生成单个可执行文件。\n\
    \n```xml\n<PropertyGroup>\n  <PublishSingleFile>true</PublishSingleFile>\n  <RuntimeIdentifier>win-x64</RuntimeIdentifier>\n\
    </PropertyGroup>\n```\n\n“PublishTrimmed” 选项允许你仅使用程序中实际使用的依赖项，但你必须指定它们（如下所示代码片段中所述）。你还必须指定使用的依赖项反射。\n\
    \n```xml\n<ItemGroup>\n  <TrimmerRootAssembly Include=\"System.IO\">\n  </TrimmerRootAssembly>\n\
    </ItemGroup>\n```\n\n**TIPS:** 以下是用于创建无依赖的小型单一可执行文件的 .csproj 文件的有用示例（你可以将其重用于自己的项目中）。\n\
    \n```xml\n<Project Sdk=\"Microsoft.NET.Sdk\">\n  <PropertyGroup>\n    <OutputType>Exe</OutputType>\n\
    \    <TargetFramework>netcoreapp3.0</TargetFramework>\n    <PublishTrimmed>true</PublishTrimmed>\n\
    \    <PublishReadyToRun>true</PublishReadyToRun>\n    <PublishSingleFile>true</PublishSingleFile>\n\
    \    <RuntimeIdentifier>win-x64</RuntimeIdentifier>\n  </PropertyGroup>\n</Project>\n\
    ```\n\n上述示例，.csproj 文件将触发构建 Windows 原生编译的单一文件应用程序。\n\n这只是使用 .csproj 文件（和 MSBuild）选项所提供可能性的大概概述，该工具非常灵活，可以适应许多项目需求。\n\
    \n你可以查阅以下 Microsoft 参考链接中关于 .csproj 文件配置和 MSBuild 的非常完善的文档。\n\nhttps://docs.microsoft.com/en-us/visualstudio/msbuild/\n\
    https://docs.microsoft.com/en-us/visualstudio/msbuild/msbuild-project-file-schema-reference\n\
    https://docs.microsoft.com/en-us/dotnet/core/tools/csproj\n\n## 9.4 CORDER（预）编译\n\
    \n**警告**：CoreRT 是 Microsoft 的一个实验性工具，未来没有计划将其作为独立工具发布。话虽如此，CoreRT 是一个神奇的工具，允许为\
    \ .NET Core 3 项目生成机器原生可执行文件。\n\nCoreRT 是一个来自 Microsoft 的开源工具，为 .NET Core 应用程序带来了原生编译的可能性。原生可执行文件的生成在托管开发世界中是一个巨大的成就。\n\
    \nCoreRT 可用于针对广泛的平台操作系统 Windows、Linux 和 macOS。该工具为 .NET Core 软件提供与原生 C++ 解决方案相同级别的性能。CoreRT\
    \ 为 .NET Core 3 提供了与 .NET Natives 为 .NET framework 提供的相同功能。\n\n尽管在 Web 应用程序编译中发现了许多约束和错误，但\
    \ CoreRT 似乎对控制台和库项目工作得很好（这些是我们感兴趣的项目类型）。\n\n这是一种新技术，由 Microsoft 引入，用于提高 .NET Core\
    \ 软件的性能，无论软件在哪个平台操作系统上运行。该工具仍在大量开发中\n\n"
