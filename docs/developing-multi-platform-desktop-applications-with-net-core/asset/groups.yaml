    make it easy for the developer to modify both side of the window (for-end and
    backend).


    The application generated can easily be modified and extended; by using Glade
    for the edition of the xml file (.glade extension) corresponding to the main window.


    You can notice that the application template generated by this package use the
    model of a GUI based on an XML file. But with GTK you have also the possibility
    to implement the GUI with inline C# code, we will review these two types of GTK
    implementation in the examples section.


    Before it is useful to study the GTK interface designer: Glade.


    # 8.5.4  Glade: The user interface designer


    Glade is an application allowing the conception and the design of GUI without
    writing the code manually. This application came in replacement of the Stetic
    Gui Designer (used with Mono, the cross-platform .NET framework).


    Like its predecessor, it is a RAD tool with WYSIWYG capabilities who make it easy
    to develop a GTK+ GUI. Glade is programming language independent, in the sense
    that it does not produce any code, the file who describe the designed GUI is encoded
    according to a standard XML format. GtkBuilder is the format of this XML file.'
  md: "\n## 8.5.2 Installing GTK\n\n### 8.5.2.1 On Windows\n\nrelease of a binary\
    \ install package for the GTK Toolkit since the second version (several years).\n\
    \nNevertheless, independent programmers provide this kind of setup by using a\
    \ well factored NullSoft install program. The current install version binary is\
    \ available on their GitHub.\n\n![](img/3d310cc066dda6e2dfa67a650614076f_192_0.png)\n\
    \nThis distribution (done by Tom Shoonjans and Alexander Shaduri) integrates the\
    \ latest available Gtk Toolkit, the version 3.24 and all the dependencies required\
    \ for make it work properly. This latest version has been released on the 2 July\
    \ 2019 and seems to be a reliable source for the GTK toolkit installation. You\
    \ will find also NullSoft scripts for generating your own installer for the GTK\
    \ runtime on Windows.\n\n### 8.5.2.2 On macOS\n\nAs we have previously mentioned,\
    \ the installation of GTK on macOS can be done through the use of “HomeBrew” (see\
    \ the reference web links) and by following the process described below.\n\n![](img/3d310cc066dda6e2dfa67a650614076f_192_1.png)\n\
    \nIf you have not installed Brew before, here is how install it and then after\
    \ how to install GTK with it.\n\n- **A) Install Brew**\n\nYou can install *brew*\
    \ by executing the command line in the macOS terminal prompt:\n\n```\n$ /usr/bin/ruby\
    \ -e \"$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/master/install)\"\
    \n```\n\nThe result should look like described (*figure 7*).\n\n![](img/3d310cc066dda6e2dfa67a650614076f_193_0.png)\n\
    \n![](img/3d310cc066dda6e2dfa67a650614076f_193_1.png)\n\n(*Figure 7*)\n\n- **B)\
    \ Install GTK**\n\nOnce *Brew* is installed you can know easily install the *GTK*\
    \ runtimes and dependencies with the following command line (*formula*). This\
    \ will install the *GTK* version 3 and all its dependencies.\n\n```\n$ brew install\
    \ gtk+3\n```\n\nThis command should produce the following output in case of a\
    \ correct setup of the package.\n\n```\nElana:~$ sudo apt-get install gtk3-3.0.18\n\
    Downloading http://launchpad-archive... \n... gtk+3.0.18 ... \nUnpacking gtk+3.0.18\
    \ ...\nProcessing triggers for man-db ...\n...\nElana:~$ gnome-applets\nElana:~$\
    \ gtk+-3.0.18\n  Total size: 1.1MB  \n  Installed: 9.2MB\n  \nDownloading: gtk+3.0.18\n\
    \nProcessing triggers for gde ...\n\nDownloading: gtk+3.0.18\nInstalling:  \n\
    /usr/lib/x86_64-linux-gnu/gtk-3.0.18.so\n\nProcessing Gtk+\nElana:~$ ls\nDesktop\
    \  Documents  Downloads  Music  Movies  Music\nNautilus  Pictures  Projects  Public\n\
    ```\n\n(figure 8)\n\nIf you do not obtain a correct installation, as usual, you\
    \ should fix the eventual issue and reinstall the package from the start.\n\n\
    ### 8.5.2.3 On Ubuntu\n\nGTK is natively installed on the ubuntu desktop version\
    \ (it is the tool used for the development of Gnome) thus you will not have to\
    \ install any additional module for executing the GTK GUI application. As native\
    \ component for ubuntu the performances of the GUI will also be better than any\
    \ other systems.\n\n## 8.5.3 Presentation of GTK#\n\nNow that the GTK runtime\
    \ is available on each platform, we can start to explain how we gone use it from\
    \ our .NET Core 3 application. The GTK runtime have a .NET wrapper already developed\
    \ and validated: GTK#.\n\nThis toolkit became multiplatform in its latest release\
    \ (with the adoption of the .NET Standard 2.0 of GTK#) and thus can be used for\
    \ multiplatform GUI application development with .NET Core 3.\n\nGTK# is a Graphical\
    \ User Interface toolkit for .NET, this tool allows to .NET developers the use\
    \ of the GTK+ in .NET.\n\nGtkSharp (that’s the pronunciation) is a C# wrapper\
    \ around GTK and its components, this is a fork of the previous gtk-sharp library\
    \ who was targeting mono (and Gtk 2.xx).\n\nThe latest version of GTK# target\
    \ the GTK version 3.22 and is available in the .NET Standard format. The source\
    \ code is under Opensource license and available at the following links on GitHub.\n\
    \n![](img/3d310cc066dda6e2dfa67a650614076f_195_0.png)\n\nThe GTK# library is also\
    \ available through the NuGet package distribution system. Added to the base wrapper\
    \ GTK#, a dedicated package provides new project template and project items for\
    \ the development of a GTK# applications with the dotnet CLI tool (works with\
    \ .NET Core 3).\n\n![](img/3d310cc066dda6e2dfa67a650614076f_195_1.png)\n\nThis\
    \ is a very handy package, it add a new type of application for the developer\
    \ to generate with the dotnet CLI, it add also the possibility to create new widget,\
    \ window or dialog object (with the .glade file included).\n\nThe installation\
    \ of the template package can be done with the command line described below (this\
    \ is the standard command line for the installation of new project template for\
    \ the dotnet CLI):\n\n```\nC:\\>dotnet new install GtkSharp.Template.CSharp --version\
    \ 3.22.24.37\n```\n\nThe version number is optional and can be omitted. Here is\
    \ the result screen after the installation of this template package (figure 1).\n\
    \n![](img/3d310cc066dda6e2dfa67a650614076f_196_0.png)\n\n(figure 1)\n\nAfter the\
    \ installation of this package the GTK new project templates should be available\
    \ by using the “dotnet new” command line, these new items are:\n\n- GtkSharp.Application:\
    \ Produce a complete Gtk application with .csproj, .cs, .glade file.\n- GtkSharp.Dialog:\
    \ Produce a .cs/.glade file for adding a dialog window to an existing project.\n\
    - GtkSharp.Widget: Generate a .cs/.glade file for a control (widget).\n- GtkSharp.Window:\
    \ Generate a .cs/.glade file basic gtk.window.\n\nOnly the GtkSharp.Application\
    \ is a project template for .NET Core, the others are items template for adding\
    \ elements to your application (Dialog, Widget, Window), the default name for\
    \ the generated element is the name of the folder where the command is executed\
    \ (if you do not specify output name).\n\nYou can verify if all these templates\
    \ have been installed properly with the command “dotnet --list” who list the available\
    \ templates for the “dotnet new” command as described below.\n\n```\nC:>dotnet\
    \ new --list -lang C#\n```\n\nThe “-lang” option is used as filter on the result\
    \ for selecting only the C# type items. Here is the result for this command:\n\
    \nYou can now create a new GTK application with the .NET Core 3 command line client\
    \ as described below:\n\n```\nC:\\>dotnet new gtkapp -n sampleGtkApp\n```\n\n\
    This command line will create a GTK application with the name of project “sampleGtkApp”\
    \ (this is the standard behavior of the new dotnet CLI command).\n\nThe template\
    \ application created uses the .glade file format for describing the GUI. This\
    \ format can be loaded in a Gtk.Builder object (we will review this point in details\
    \ later).\n\nYou can find more information about the use of GtkBuilder with the\
    \ reference links below.\n\n![](img/3d310cc066dda6e2dfa67a650614076f_199_0.png)\n\
    \n- http://gtkbuilder.org/\n- http://gnome.org/gtkbuilder\n\nIn the template,\
    \ the .cs file and the .glade file have the same name, that's make it easy for\
    \ the developer to modify both side of the window (for-end and backend).\n\nThe\
    \ application generated can easily be modified and extended; by using Glade for\
    \ the edition of the xml file (.glade extension) corresponding to the main window.\n\
    \nYou can notice that the application template generated by this package use the\
    \ model of a GUI based on an XML file. But with GTK you have also the possibility\
    \ to implement the GUI with inline C# code, we will review these two types of\
    \ GTK implementation in the examples section.\n\nBefore it is useful to study\
    \ the GTK interface designer: Glade.\n\n## 8.5.4 Glade: The user interface designer\n\
    \nGlade is an application allowing the conception and the design of GUI without\
    \ writing the code manually. This application came in replacement of the Stetic\
    \ Gui Designer (used with Mono, the cross-platform .NET framework).\n\nLike its\
    \ predecessor, it is a RAD tool with WYSIWYG capabilities who make it easy to\
    \ develop a GTK+ GUI. Glade is programming language independent, in the sense\
    \ that it does not produce any code, the file who describe the designed GUI is\
    \ encoded according to a standard XML format. GtkBuilder is the format of this\
    \ XML file.\n"
  mdcn: "\n\n## 8.5.2 安装 GTK\n\n### 8.5.2.1 在 Windows 上\n\n自第二版（几年前）以来，GTK 工具包已不再发布二进制安装包。\n\
    \n尽管如此，独立的开发者通过充分利用 NullSoft 安装程序提供了这种类型的设置。当前的安装版本二进制文件可在他们的 GitHub 上获取。\n\n\
    ![](img/3d310cc066dda6e2dfa67a650614076f_192_0.png)\n\n此发行版（由 Tom Shoonjans 和\
    \ Alexander Shaduri 制作）集成了最新可用的 Gtk 工具包（3.24 版本）以及使其正确运行所需的所有依赖项。该最新版本于 2019 年\
    \ 7 月 2 日发布，似乎是安装 GTK 工具包的一个可靠来源。您还将找到用于生成 Windows 上 GTK 运行时自定义安装程序的 NullSoft\
    \ 脚本。\n\n### 8.5.2.2 在 macOS 上\n\n如前所述，在 macOS 上安装 GTK 可以通过使用“HomeBrew”（参见参考网页链接）并遵循下面描述的过程来完成。\n\
    \n![](img/3d310cc066dda6e2dfa67a650614076f_192_1.png)\n\n如果您之前尚未安装 Brew，以下是安装它的方法，以及随后如何使用它安装\
    \ GTK 的方法。\n\n- **A) 安装 Brew**\n\n您可以通过在 macOS 终端提示符中执行以下命令行来安装 *brew*：\n\n```\n\
    $ /usr/bin/ruby -e \"$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/master/install)\"\
    \n```\n\n结果应与描述中的一致（*图 7*）。\n\n![](img/3d310cc066dda6e2dfa67a650614076f_193_0.png)\n\
    \n![](img/3d310cc066dda6e2dfa67a650614076f_193_1.png)\n\n(*图 7*)\n\n- **B) 安装\
    \ GTK**\n\n安装 *Brew* 后，您可以轻松使用以下命令行（*公式*）安装 *GTK* 运行时和依赖项。这将安装 *GTK* 3 版本及其所有依赖项。\n\
    \n```\n$ brew install gtk+3\n```\n\n如果软件包设置正确，此命令应产生以下输出。\n\n```\nElana:~$ sudo\
    \ apt-get install gtk3-3.0.18\nDownloading http://launchpad-archive... \n... gtk+3.0.18\
    \ ... \nUnpacking gtk+3.0.18 ...\nProcessing triggers for man-db ...\n...\nElana:~$\
    \ gnome-applets\nElana:~$ gtk+-3.0.18\n  Total size: 1.1MB  \n  Installed: 9.2MB\n\
    \  \nDownloading: gtk+3.0.18\n\nProcessing triggers for gde ...\n\nDownloading:\
    \ gtk+3.0.18\nInstalling:  \n/usr/lib/x86_64-linux-gnu/gtk-3.0.18.so\n\nProcessing\
    \ Gtk+\nElana:~$ ls\nDesktop  Documents  Downloads  Music  Movies  Music\nNautilus\
    \  Pictures  Projects  Public\n```\n\n（图 8）\n\n如果您未能成功安装，照例，您应修复可能出现的问题并从头开始重新安装软件包。\n\
    \n### 8.5.2.3 在 Ubuntu 上\n\nGTK 原生安装在 ubuntu 桌面版本上（它是用于开发 Gnome 的工具），因此您不需要安装任何额外模块来运行\
    \ GTK GUI 应用程序。作为 ubuntu 的原生组件，GUI 的性能也将优于其他任何系统。\n\n## 8.5.3 GTK# 介绍\n\n现在，GTK\
    \ 运行时在每个平台上都可用，我们可以开始解释如何从我们的 .NET Core 3 应用程序中使用它。GTK 运行时已有一个开发并经过验证的 .NET 包装器：GTK#。\n\
    \n该工具包在其最新版本中（通过采用 GTK# 的 .NET Standard 2.0）变成了多平台，因此可用于使用 .NET Core 3 开发多平台 GUI\
    \ 应用程序。\n\nGTK# 是 .NET 的图形用户界面工具包，该工具允许 .NET 开发者在 .NET 中使用 GTK+。\n\nGtkSharp（这就是其发音方式）是\
    \ GTK 及其组件的 C# 包装器，这是之前针对 mono（以及 Gtk 2.xx）的 gtk-sharp 库的分叉版本。\n\n最新版本的 GTK# 针对\
    \ GTK 3.22 版本，并以 .NET Standard 格式可用。其源代码采用开源许可证，并可在以下 GitHub 链接上获取。\n\n![](img/3d310cc066dda6e2dfa67a650614076f_195_0.png)\n\
    \nGTK# 库也可通过 NuGet 软件包分发系统获取。除了基础的 GTK# 包装器外，还有一个专用软件包提供新的项目模板和项目项，用于使用 dotnet\
    \ CLI 工具开发 GTK# 应用程序（适用于 .NET Core 3）。\n\n![](img/3d310cc066dda6e2dfa67a650614076f_195_1.png)\n\
    \n这是一个非常便捷的应用程序包，它为开发者添加了使用 dotnet CLI 生成的新类型应用程序，还增加了创建新控件、窗口或对话框对象（包含 .glade\
    \ 文件）的可能性。\n\n模板软件包的安装可以使用下面描述的命令行完成（这是 dotnet CLI 安装新项目模板的标准命令行）：\n\n```\nC:\\\
    >dotnet new install GtkSharp.Template.CSharp --version 3.22.24.37\n```\n\n版本号是可选的，可以省略。这是安装此模板软件包后的结果屏幕（图\
    \ 1）。\n\n![](img/3d310cc066dda6e2dfa67a650614076f_196_0.png)\n\n（图 1）\n\n安装此软件包后，应可以使用“dotnet\
    \ new”命令行获取 GTK 新项目模板，这些新项目包括：\n\n- GtkSharp.Application：生成包含 .csproj、.cs、.glade\
    \ 文件的完整 Gtk 应用程序。\n- GtkSharp.Dialog：生成 .cs/.glade 文件，用于向现有项目添加对话框窗口。\n- GtkSharp.Widget：为控件（小部件）生成\
    \ .cs/.glade 文件。\n- GtkSharp.Window：生成基本 gtk.window 的 .cs/.glade 文件。\n\n只有 GtkSharp.Application\
    \ 是 .NET Core 的项目模板，其他的是用于向应用程序添加元素（Dialog、Widget、Window）的项目模板。生成的元素的默认名称是执行命令所在的文件夹名称（如果您未指定输出名称）。\n\
    \n您可以使用“dotnet --list”命令验证所有这些模板是否已正确安装，该命令列出了“dotnet new”命令可用的模板，如下面所述。\n\n```\n\
    C:>dotnet new --list -lang C#\n```\n\n“-lang”选项用作筛选器，以仅选择 C# 类型的项。这是此命令的结果：\n\n\
    现在，您可以使用 .NET Core 3 命令行客户端创建一个新的 GTK 应用程序，如下面所述：\n\n```\nC:\\>dotnet new gtkapp\
    \ -n sampleGtkApp\n```\n\n此命令行将创建一个名为“sampleGtkApp”的 GTK 应用程序项目（这是新 dotnet CLI\
    \ 命令的标准行为）。\n\n创建模板应用程序使用 .glade 文件格式来描述 GUI。此格式可以加载到 Gtk.Builder 对象中（我们稍后将详细回顾这一点）。\n\
    \n您可以在以下参考链接中找到有关使用 GtkBuilder 的更多信息。\n\n![](img/3d310cc066dda6e2dfa67a650614076f_199_0.png)\n\
    \n- http://gtkbuilder.org/\n- http://gnome.org/gtkbuilder\n\n在模板中，.cs 文件和 .glade\
    \ 文件具有相同的名称，这使得开发者更容易修改窗口的两侧（前端和后端）。\n\n生成的应用程序可以轻松修改和扩展；通过使用 Glade 编辑对应于主窗口的\
    \ xml 文件（.glade 扩展名）。\n\n您可能注意到，此软件包生成的应用程序模板使用基于 XML 文件的 GUI 模型。但使用 GTK，您还可以通过内联\
    \ C# 代码实现 GUI，我们将在示例部分回顾这两种 GTK 实现类型。\n\n在此之前，研究 GTK 界面设计器 Glade 是很有用的。\n\n##\
    \ 8.5.4 Glade：用户界面设计器\n\nGlade 是一个允许在不手动编写代码的情况下设计和创建 GUI 的应用程序。该应用程序取代了 Stetic\
    \ Gui 设计器（用于 Mono，跨平台 .NET 框架）。\n\n与其前身一样，它是一个具有所见即所得（WYSIWYG）功能的快速应用程序开发（RAD）工具，使其易于开发\
    \ GTK+ GUI。Glade 是与编程语言无关的，因为它的含义是不生成任何代码，描述所设计 GUI 的文件根据标准 XML 格式进行编码。GtkBuilder\
    \ 是此 XML 文件的格式。\n\n"
