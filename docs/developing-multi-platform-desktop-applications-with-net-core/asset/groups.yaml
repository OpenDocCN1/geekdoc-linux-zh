    \n### 5.4.1 Building the Web request\n\nFirst, you will have to specify the endpoint\
    \ address. Once this is done, you will instantiate the `HttpClient` class to perform\
    \ the web request. This API supports only async methods (which is useful when\
    \ working on the network). The web request will be performed by an async method\
    \ (see sample code for the REST Client).\n\n### 5.4.2 Processing the request and\
    \ retrieving data\n\nThe call to the web request will be done with the `await`\
    \ keyword (as this is an async method).\n\n### 5.4.3 Processing JSON result\n\n\
    Once you have retrieved the data from the REST service (HTTP status 200), you\
    \ will have to convert the JSON result into an exploitable C# object. To do that,\
    \ you have to write a class for the type of object matching the JSON result format\
    \ you expect.\n\n> **TIPS:** In Visual Studio, use the menu *Edit / Paste Special\
    \ / Paste JSON as Classes* for generating C# objects from JSON data.\n\n### 5.4.4\
    \ Sample code for a REST client\n\nHere is a snippet illustrating the use of a\
    \ REST web service in your .NET Core 3 application.\n\n**ProgramRESTClient.cs**\n\
    \n```csharp\nBasicHttpBinding basicHttpBinding = null;\nEndpointAddress endpointAddress\
    \ = null;\nChannelFactory<IAService> factory = null;\nIAService serviceProxy =\
    \ null;\n\ntry\n{\n    basicHttpBinding = new BasicHttpBinding(BasicHttpSecurityMode.Transport);\n\
    \    basicHttpBinding.Security.Transport.ClientCredentialType = HttpClientCredentialType.Basic;\n\
    \    endpointAddress = new EndpointAddress(new Uri(\"https://uri.com/api\"));\n\
    \    factory = new ChannelFactory<IAService>(basicHttpBinding, endpointAddress);\n\
    \    factory.Credentials.UserName.UserName = \"usr\";\n    factory.Credentials.UserName.Password\
    \ = \"pass\";\n    serviceProxy = factory.CreateChannel();\n\n    using (var scope\
    \ = new OperationContextScope((IContextChannel)serviceProxy))\n    {\n       \
    \ var result = await serviceProxy.getSomethingAsync(\"d\").ConfigureAwait(false);\n\
    \    }\n    factory.Close();\n    ((ICommunicationObject)serviceProxy).Close();\n\
    }\ncatch (MessageSecurityException ex)\n{\n    throw;\n}\ncatch (Exception ex)\n\
    {\n    throw;\n}\n```\n\n## 5.5 THREADING GUI\n\nAs we have seen in the previous\
    \ chapter, the reactivity of an application is a crucial metric of the user's\
    \ global quality perception of a desktop application.\n\nGood reactivity in an\
    \ application can be reached by giving each heavy processing task and User Interface\
    \ task its own thread. Thus, the main process is never overloaded, and the application\
    \ continues to respond to the user (reactivity), regardless of the previous instructions.\n\
    \nThere are several methods for achieving this threading, depending on the type\
    \ of solution you want to use for developing your multiplatform application (Console,\
    \ XAML, HTML, Native UI, etc.).\n\nThe threading of long and complex tasks in\
    \ your application can be done in a progress window where you display a gauge\
    \ (or other progress indicator) control and propose to the user the option to\
    \ cancel the operation in progress.\n\n![](img/3d310cc066dda6e2dfa67a650614076f_83_0.png)\n\
    \nBut most of the time, threading does not have its own window and reports to\
    \ the application the status of the operation through some kind of information\
    \ bar. This can be done by using delegates and common threading techniques (as\
    \ illustrated in the following sample).\n\nThe following simple .NET Core 3 WinForms\
    \ example illustrates how it can be done by the use of delegates:\n\n![](img/3d310cc066dda6e2dfa67a650614076f_84_0.png)\n\
    \nThis sample illustrates the usefulness of the use of threading in GUI applications\
    \ compared to the non-threaded method, which freezes the form (the user loses\
    \ control) during the execution of the process. The complete project of this example\
    \ is available online at:\n\n`https://github.com/netcore3/CodeBook/Chapter 5/5/UI_Threading_Example`\n\
    \nThere are many other ways to implement (to code) the threading in your GUI.\
    \ Consider only that you should implement the processing of the functional operations\
    \ outside the main GUI thread of your program (the method used is not really important,\
    \ and many different methods for doing that are presented along this book).\n\n\
    ## 5.6 Using unmanaged dependencies\n\nMultiplatform development with .NET Core\
    \ 3 will sometimes imply the use of platform-specific dependencies (.dll files\
    \ with Windows, .so files with Ubuntu, .dylib files with macOS).\n\nThe capability\
    \ for the developer to access unmanaged methods from his .NET Core 3 program is\
    \ mandatory for conducting many types of projects.\n\nYou have to keep in mind\
    \ that, in the multiplatform context, you have to get the native library file\
    \ (or its equivalent for the platform) for each platform, in our case Linux, macOS,\
    \ and Windows. So, verify if the library you plan to use for your multiplatform\
    \ project will be available for each OS you target before actually using it in\
    \ your development on the Windows platform.\n\nFor example, many system functions\
    \ are accessible only through native APIs. For doing so, you should know basic\
    \ concepts for the use of unmanaged code with .NET Core 3 (which is managed code):\n\
    \n- P/Invoke\n- Marshalling\n- Establishing the running OS\n\nThe .NET Core 3\
    \ package providing these features is:\n\n![](img/3d310cc066dda6e2dfa67a650614076f_85_0.png)\n\
    \n### 5.6.1 P/Invoke\n\nP/Invoke is an acronym for Platform Invocation Services.\
    \ This mechanism allows the developer to use external unmanaged dependencies in\
    \ his managed code (.NET Core).\n\nHere is a sample of the use of P/Invoke for\
    \ retrieving the current process ID (pid):\n\n**For Linux (ubuntu):**\n\n```csharp\n\
    using System.Runtime.InteropServices;\n\nnamespace PInvokeSample\n{\n    public\
    \ static class Program\n    {\n        [DllImport(\"libc.so.6\")]\n        private\
    \ static extern int getPid();\n\n        public static void Main(string[] args)\n\
    \        {\n            int pid = getPid();\n            Console.WriteLine(pid);\n\
    \        }\n    }\n}\n```\n\n**For Windows:**\n\n```csharp\nusing System.Runtime.InteropServices;\n\
    \nnamespace PInvokeSample\n{\n    public static class Program\n    {\n       \
    \ [DllImport(\"Kernel32.dll\")]\n        private static extern uint GetCurrentThreadId();\n\
    \n        public static void Main(string[] args)\n        {\n            int pid\
    \ = GetCurrentThreadId();\n            Console.WriteLine(pid);\n        }\n  \
    \  }\n}\n```\n\nFor this sample code, which retrieves the current process ID,\
    \ it is better to make a copy of the dependencies in the folder of the application.\
    \ A tricky part for using system native libraries in your code is to retrieve\
    \ the location of these libraries in each system. That's a point where you can\
    \ encounter many troubles, and the copy of the libraries in the project folder\
    \ (or in a subfolder in the project) can help you to solve most of these issues.\
    \ You also have to verify that the paths of the program context contain the required\
    \ libraries for the OS where your application should be executed.\n\nIn the previous\
    \ sample, we can see that the native calls are changing according to the OS. In\
    \ this case, multiplatform development means producing the code for each platform's\
    \ specificities.\n\nIf you want to use native functions that are not already written\
    \ and accessible in the system API of the OS, you have to develop your own libraries\
    \ (one version for each OS).\n\nHere are some reference links about the system\
    \ APIs for each OS:\n\n- **Windows:** [http://pinvoke.net](http://pinvoke.net)\n\
    - **Linux (ubuntu):** [http://kernel.org/doc/html/latest](http://kernel.org/doc/html/latest)\n\
    - **macOS:** [https://developer.apple.com/library/archive/navigation/](https://developer.apple.com/library/archive/navigation/)\n"
  mdcn: "\n## 5.4 外部服务消费\n\n在许多情况下，你的应用程序将需要调用外部服务（API、Web 服务等）。.NET Core 为此目的提供了专用的包和功能。\n\
    \n为了简化说明，我们将考虑 REST（表述性状态转移）服务的消费，因为这是你在开发中最常遇到的服务类型。REST 是一种基于 HTTP 请求协议及其关联动词的协议：\n\
    \n- **GET**：用于数据检索。\n- **POST**：用于将客户端数据添加到服务器。\n- **PUT**：用于更新服务器上的数据。\n- **DELETE**：用于删除服务器上的数据。\n\
    \n由于 .NET Core 的关键设计目标之一是最小化安装尺寸，你必须向项目添加所需的依赖项（包）。\n\n![](img/3d310cc066dda6e2dfa67a650614076f_80_0.png)\n\
    \n添加所需依赖项后，你可以开始使用 REST 服务的流程。你可以通过三个基本步骤来实现（此示例演示了服务的调用）：\n\n1. 构建请求。\n2. 处理请求并检索数据（结果）。\n\
    3. 处理结果。\n\n### 5.4.1 构建 Web 请求\n\n首先，你必须指定端点地址。完成后，你将实例化 `HttpClient` 类来执行 Web\
    \ 请求。此 API 仅支持异步方法（在网络工作时非常有用）。Web 请求将由异步方法执行（参见 REST 客户端示例代码）。\n\n### 5.4.2 处理请求并检索数据\n\
    \n对 Web 请求的调用将通过 `await` 关键字完成（因为这是一个异步方法）。\n\n### 5.4.3 处理 JSON 结果\n\n一旦你从 REST\
    \ 服务检索到数据（HTTP 状态 200），你就必须将 JSON 结果转换为可利用的 C# 对象。为此，你必须编写一个类，该类对象类型匹配你预期的 JSON\
    \ 结果格式。\n\n> **提示：** 在 Visual Studio 中，使用菜单 *编辑 / 特殊粘贴 / 将 JSON 粘贴为类* 可从 JSON\
    \ 数据生成 C# 对象。\n\n### 5.4.4 REST 客户端示例代码\n\n以下片段展示了在 .NET Core 3 应用程序中使用 REST Web\
    \ 服务的方法。\n\n**ProgramRESTClient.cs**\n\n```csharp\nBasicHttpBinding basicHttpBinding\
    \ = null;\nEndpointAddress endpointAddress = null;\nChannelFactory<IAService>\
    \ factory = null;\nIAService serviceProxy = null;\n\ntry\n{\n    basicHttpBinding\
    \ = new BasicHttpBinding(BasicHttpSecurityMode.Transport);\n    basicHttpBinding.Security.Transport.ClientCredentialType\
    \ = HttpClientCredentialType.Basic;\n    endpointAddress = new EndpointAddress(new\
    \ Uri(\"https://uri.com/api\"));\n    factory = new ChannelFactory<IAService>(basicHttpBinding,\
    \ endpointAddress);\n    factory.Credentials.UserName.UserName = \"usr\";\n  \
    \  factory.Credentials.UserName.Password = \"pass\";\n    serviceProxy = factory.CreateChannel();\n\
    \n    using (var scope = new OperationContextScope((IContextChannel)serviceProxy))\n\
    \    {\n        var result = await serviceProxy.getSomethingAsync(\"d\").ConfigureAwait(false);\n\
    \    }\n    factory.Close();\n    ((ICommunicationObject)serviceProxy).Close();\n\
    }\ncatch (MessageSecurityException ex)\n{\n    throw;\n}\ncatch (Exception ex)\n\
    {\n    throw;\n}\n```\n\n## 5.5 界面线程处理\n\n正如我们在前一章中看到的，应用程序的响应性是用户对桌面应用整体质量感知的一项重要指标。\n\
    \n通过为每个繁重的处理任务和用户界面任务提供其自身的线程，可以实现应用程序良好的响应性。因此，主进程不会过载，无论之前的指令如何，应用程序都能继续响应用户（响应性）。\n\
    \n根据你用于开发多平台应用程序的解决方案类型（控制台、XAML、HTML、原生 UI 等），实现这种线程处理有几种方法。\n\n你应用程序中长而复杂任务的线程处理可以在进度窗口中完成，其中你显示一个仪表（或其他进度指示器）控件，并向用户提出取消正在进行的操作的选项。\n\
    \n![](img/3d310cc066dda6e2dfa67a650614076f_83_0.png)\n\n但大多数时候，线程处理没有自己的窗口，并通过某种信息栏向应用程序报告操作状态。这可以通过使用委托和常见的线程技术来完成（如下面的示例所示）。\n\
    \n以下简单的 .NET Core 3 WinForms 示例说明了如何使用委托来实现这一点：\n\n![](img/3d310cc066dda6e2dfa67a650614076f_84_0.png)\n\
    \n此示例说明了在 GUI 应用程序中使用线程处理与非线程方法（该方法会在进程执行期间冻结窗体，用户失去控制权）相比的实用性。该示例的完整项目可在线获取：\n\
    \n`https://github.com/netcore3/CodeBook/Chapter 5/5/UI_Threading_Example`\n\n\
    在你的 GUI 中实现（编写）线程处理还有许多其他方法。只需考虑你应该在程序的主 GUI 线程之外实现功能操作的处理（使用的方法并不重要，本书中介绍了许多不同的方法）。\n\
    \n## 5.6 使用非托管依赖项\n\n使用 .NET Core 3 进行多平台开发有时意味着使用平台特定的依赖项（Windows 上的 .dll 文件、Ubuntu\
    \ 上的 .so 文件、macOS 上的 .dylib 文件）。\n\n开发人员能够从其 .NET Core 3 程序访问非托管方法是开展许多类型项目的必要条件。\n\
    \n请记住，在多平台环境中，你必须在每个平台上获取原生库文件（或其平台等效物），在我们的情况下是 Linux、macOS 和 Windows。因此，在 Windows\
    \ 平台上实际开发使用之前，请验证你计划用于多平台项目的库在每个目标操作系统上是否可用。\n\n例如，许多系统函数只能通过原生 API 访问。为此，你应该了解使用\
    \ .NET Core 3（这是托管代码）中非托管代码的基本概念：\n\n- P/Invoke\n- 编组（Marshalling）\n- 确定运行操作系统\n\
    \n提供这些功能的 .NET Core 3 包是：\n\n![](img/3d310cc066dda6e2dfa67a650614076f_85_0.png)\n\
    \n### 5.6.1 P/Invoke\n\nP/Invoke 是 Platform Invocation Services（平台调用服务）的缩写。此机制允许开发人员在他们的托管代码（.NET\
    \ Core）中使用外部非托管依赖项。\n\n以下是使用 P/Invoke 检索当前进程 ID（pid）的示例：\n\n**用于 Linux（ubuntu）：**\n\
    \n```csharp\nusing System.Runtime.InteropServices;\n\nnamespace PInvokeSample\n\
    {\n    public static class Program\n    {\n        [DllImport(\"libc.so.6\")]\n\
    \        private static extern int getPid();\n\n        public static void Main(string[]\
    \ args)\n        {\n            int pid = getPid();\n            Console.WriteLine(pid);\n\
    \        }\n    }\n}\n```\n\n**用于 Windows：**\n\n```csharp\nusing System.Runtime.InteropServices;\n\
    \nnamespace PInvokeSample\n{\n    public static class Program\n    {\n       \
    \ [DllImport(\"Kernel32.dll\")]\n        private static extern uint GetCurrentThreadId();\n\
    \n        public static void Main(string[] args)\n        {\n            int pid\
    \ = GetCurrentThreadId();\n            Console.WriteLine(pid);\n        }\n  \
    \  }\n}\n```\n\n对于检索当前进程 ID 的这个示例代码，最好将依赖项的副本复制到应用程序文件夹中。在你的代码中使用系统原生库的一个棘手部分是检索这些库在每个系统上的位置。这是一个你可能遇到许多麻烦的地方，将库复制到项目文件夹（或项目中的子文件夹）可以帮助你解决其中大多数问题。你还必须验证程序上下文的包含路径是否包含应用程序应执行的操作系统所需的库。\n\
    \n在上面的示例中，我们可以看到原生调用会根据操作系统而变化。在这种情况下，多平台开发意味着为每个平台生成具有特定性的代码。\n\n如果你想使用系统中尚未编写且可通过操作系统\
    \ API 访问的原生函数，你必须开发自己的库（每个操作系统一个版本）。\n\n以下是关于每个操作系统系统 API 的一些参考链接：\n\n- **Windows：**\
    \ [http://pinvoke.net](http://pinvoke.net)\n- **Linux（ubuntu）：** [http://kernel.org/doc/html/latest](http://kernel.org/doc/html/latest)\n\
    - **macOS：** [https://developer.apple.com/library/archive/navigation/](https://developer.apple.com/library/archive/navigation/)\n\
    \n"
