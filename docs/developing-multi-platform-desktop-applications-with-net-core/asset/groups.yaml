  mdcn: "\n\n## 6.5 安装开发工作站\n\n  开发工作站将用于开发目的的三台机器（虚拟或非虚拟）。这三台计算机必须设置与其要开发的 GUI 类型相对应的专用开发工具。\n\
    \n  .NET Core 3 SDK 是每个工作站的基础安装，所需的专用工具将在我们审查的每种类型解决方案中具体说明。\n\n  对于本书中介绍的示例项目，我们选择在\
    \ Windows 上使用 Visual Studio 2019 进行代码开发，每个项目都在原始项目副本（包含 SDK）的基础上针对每个操作系统进行了重新构建。\n\
    \n### 6.5.1 Windows 工作站（主要）\n\n  Windows 平台是你必须安装 IDE（在我们的情况下是 Visual Studio 2019）以及编写软件所需的所有工具的平台。在专业环境中，鉴于其功能和高品质的产品特性（与更偏向脚本开发的\
    \ Visual Code 相比），选择 Visual Studio 2019 是显而易见的。\n\n  首先，你必须安装 Visual Studio 2019。\n\
    \n  该产品有三个不同的版本：\n\n- **Community（社区版）**：产品的免费版本。该版本允许你进行所有类型的 .NET Core 3 开发，但不包含某些功能（请参见功能表格）。\n\
    - **Professional（专业版）**：如名称所示（这是完整产品）。\n- **Enterprise（企业版）**：为大型团队和复杂约束环境提供更好的集成，还包括软件架构师（架构层图）和测试人员（LiveTest）的独家工具。\n\
    \n  下表是 Visual Studio 各个版本的功能和特性的摘要。\n\n| | Visual Studio Community | Visual Studio\
    \ Professional | Visual Studio Enterprise |\n|---|:---:|:---:|:---:|\n| 支持的功能\
    \ | | | |\n| 支持的使用场景 | *** | **** | **** |\n| **开发平台支持** | | | |\n| 集成开发环境 | **\
    \ | ** | *** |\n| 高级调试和诊断 | * | ** | *** |\n| **测试工具** | * | * | **** |\n| **跨平台开发**\
    \ | ** | ** | *** |\n| **协作工具和功能** | *** | ** | **** |\n\n（来源：Microsoft.com）\n\
    \n  选择与你打算进行的开发类型（或你拥有的许可证类型）相对应的版本。在我们的情况下，社区版足以满足本书的教育需求。\n\n  安装程序将建议你选择要安装的模块。你当然可以选择完整安装（用于测试和审查目的），但为了满足本书的开发需求，你必须安装的最小必需组件如下：\n\
    \n- Visual Studio 核心编辑器\n- .NET 桌面开发\n- ASP.NET 和 Web 开发\n- .NET Core 跨平台开发\n\n\
    ![Figure 1](img/3d310cc066dda6e2dfa67a650614076f_107_0.png)\n\n  如果你计划使用原生 GUI\
    \ 库（如 LibUI、GTK 或 QT），明智的做法（有时也是必须的）是同时也安装 C++ 工具（但我们将在示例章节中说明何时及为何安装）。\n\n- C++\
    \ 开发环境\n- Linux 上的 C++\n\n  如果你想使用 .NET Core 3 或 3.1 的预览版（或仍处于预览阶段的后续版本），你需要通过选择菜单中的相应选项来配置\
    \ Visual Studio 2019 以使用它：\n\n  工具/选项/环境/预览功能。\n\n![在 Visual Studio 2019 中启用 SDK\
    \ 预览](img/3d310cc066dda6e2dfa67a650614076f_108_0.png)\n\n  对于主要开发工作站，你还需要一个可用的\
    \ Internet 连接，以便访问 NuGet 中央仓库（80 端口）来还原依赖包。\n\n### 6.5.2 Linux 工作站\n\n  （参见 Linux\
    \ 的 .NET Core 3 安装。）\n\n  Ubuntu 开发工作站无需额外安装，Ubuntu 桌面系统的默认设置中已经安装了许多工具。在安装 .NET\
    \ Core 3 SDK 之前，请验证你已安装了 Ubuntu 先决条件包。一些示例将需要特定的依赖项，但对于需要此类安装的每个示例，我们都会加以说明。\n\
    \n### 6.5.3 macOS 工作站\n\n  （参见 macOS 的 .NET Core 3 安装）。\n\n  我们建议安装优秀的工具“Homebrew”，它是\
    \ macOS 缺失的包管理器。在作为完整堆栈 macOS 开发的一部分来轻松安装包时，它通常很有用（在我们将要研究的一些情况下是必需的）。你可以在 GTK\
    \ 项目示例部分找到详细的安装说明（该示例设置依赖项需要“brew”）。\n\n  对于开发工作站，如果你计划使用 macOS 系统 API 或原生库，明智的做法是也安装\
    \ XCode，或者至少安装“XCode 命令行工具”。\n\n  XCode 是 macOS 和 ObjectiveC（macOS 使用的语言）的 Apple\
    \ IDE。它可以帮助你匹配适用于该操作系统的相应库（原生 API）。\n\n  这假设你具备 ObjectiveC 开发的基本知识，如果你不熟悉 macOS\
    \ 系统，这可能会有些棘手（仅供专家）。\n\n![macOS 工作站参考](img/3d310cc066dda6e2dfa67a650614076f_109_0.png)\n\
    \nhttps://brew.sh/\n\nhttps://developer.apple.com/xcode/\n\n## 6.6 远程调试配置\n\n\
    \  远程调试允许你在远程计算机（安装有不同操作系统的计算机）上执行你的代码，它允许你在目标平台上进行实时调试，而无需退出你最喜爱的 IDE（Windows\
    \ 上的 Visual Studio）。\n\n  在 GUI 桌面应用开发环境中，这种技术并不常用，因为使用跨平台框架（在我们的情况下是 .NET Core\
    \ 3）会屏蔽平台特异性。\n\n  尽管如此，它可以在开发多平台 .NET Standard 库（例如包装器）时使用，该库被应用程序使用，并且该技术正是在这种背景下被审查的。\n\
    \n### A) 在 Visual Studio 中：\n\n  要在 Visual Studio 中启用远程调试功能，你需要在以下地址安装“Visual\
    \ Studio 2019 远程调试工具”。下载并安装 Windows 的 ssh 客户端（Putty），它将用于测试与远程机器的连接，并使用 scp 实用工具复制文件（这取决于你想如何工作）。\n\
    \nhttps://visualstudio.microsoft.com/downloads/#remote-tools-for-visual-studio-2019/\n\
    \nhttp://www.putty.org\n\n![Visual Studio 远程工具](img/3d310cc066dda6e2dfa67a650614076f_110_0.png)\n\
    \n### B) 在 Linux 上安装 Visual Studio 2019 的远程调试工具：\n\n```bash\n$ curl -sSL https://aka.ms/getvstdbgsh\
    \ | /bin/sh /dev/stdin -v latest -l ~/vstdbg\n```\n\n  此命令行指令应在平台上安装所需的 Linux\
    \ 调试器引擎。\n\n### C) 在 Linux 系统（Ubuntu）上设置用于调试的管理员账户：\n\n  创建用于调试的特定用户并非强制性的，但这提供了不与其它账户的权限和组发生冲突的好处（从长远来看，这使得用户管理更容易）。但你也可以使用“root”账户。\n\
    \n```bash\n~$ Sudo adduser dbgVS\n```\n\n  如果你没有安全约束，你甚至可以简单地使用“root”账户。\n\n \
    \ 你必须赋予该用户适当的权限，或/和将其加入适当的组，以获得访问部署文件夹的权限（读/写）（在大多数情况下，还需要执行权限，通常要求加入管理员组）。\n\n\
    ### D) 启用 SSH 并在防火墙上打开端口（设置计算机之间的通信）：\n\n```bash\n$ sudo apt-get install openssh-server\
    \ unzip\n$ sudo ufw allow ssh\n```\n\n  此命令行安装 ssh 服务器并在防火墙上打开所需端口（22 端口）。\n\n\
    \  从你的 Windows 工作站使用简单的 ssh 测试（使用 Putty 和新定义的用户）验证与 Linux 机器的用户和连接。还要检查该用户的文件夹权限。\n\
    \n### E) 部署应用程序：通过 scp 复制文件或在 Visual Studio 中使用发布工具：\n\n  要部署应用程序，你可以选择使用“scp”命令复制它，或使用配置文件在“发布”阶段部署应用程序。你可以在其中指定可执行文件源和目标文件夹位置的文件是“launch.json”。\n\
    \n### F) 将调试器（在 Visual Studio 中）附加到 Linux 上的远程进程：\n\n  如果在 Linux 机器上安装了 VS 调试器，你应该能够访问你连接用户的进程列表。选择进程（在许多情况下是程序名称）并在\
    \ Visual Studio 中将其“附加”到调试器（确保“显示所有用户的进程”复选框已勾选）。\n\n### G) 执行调试（在 Visual Studio\
    \ 中）：\n\n  现在你应该能够能够从你的 Windows Visual Studio 实例在 Linux 上调试应用程序。\n\n"
