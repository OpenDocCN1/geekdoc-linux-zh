    # 5.3.4  Data model


    When you develop your application with EF Core, you have the choice between two
    distinct methods for achieving the integration with the database:


    # A)  Model First:


    When you use this method the data model is defined by your data model (by code),
    this is interesting to use this approach when you use a database for storing the
    data produce by your application. The model first method is used when the database
    is not yet defined or when you start to develop from scratch your application.


    # B)  Database First:


    When you use this method, you reverse engineer your database for generating the
    data model. This method is used when you are working on a preexisting database
    or when the database is developed by another member of the team, a database developer
    for instance.


