    ## 10.1 USE VISUAL STUDIO RUNNING ANALYSIS TOOLS


    Visual Studio 2019 is an awesome tool for the real time performance visualization
    of a running program.


    If the "Diagnostic Tools" window is not display on your Visual Studio configuration
    you can select the menu: Debug/Windows/Diagnostic Tools.


    The "Diagnostic tools" view is open (by default) each time the program is executed
    from the Visual Studio environment (the window is displayed at each run session).


    This view provides real time indicators about the chronology of the execution,
    the CPU usage of the program process, the system events triggered, and the amount
    of memory used by the program as you can see on the picture below (*figure 1*).


    ![](img/3d310cc066dda6e2dfa67a650614076f_290_0.png)


    *figure 1*


    All of these indicators can be used by the developer to identify if a specific
    methods or objects have an abnormal consumption of CPU or memory when it is loaded
    or executed. This tool provides a good view for the identification of source code
    who have to be optimized fixed or refactored.


    It also can help the developer to choose a pertinent and appropriate architecture
    regarding those results (and change it, if it is needed).


    You can view the "CPU usage" by methods by enabling it; throw the "CPU Usage"
    tab as shown (figure 2) below.


    ![](img/3d310cc066dda6e2dfa67a650614076f_291_0.png)


    *(figure 2)*


    You can also use the "Performance Profiler" (Analyze/Performance Profiler) for
    analyzing the performances (CPU usage, memory ... ) of your running application
    in live.


    There is a limitation to the use of this tool, the "Performance analyzer" analyses
    only one indicator per session of profiling, if you need CPU usage and memory
    you have to perform two analysis.


    "Performance Profiler" can generate a report: a "*.diagsession" file. The "*.diagsession"
    file can be saved on disk by right clicking on the report tab and select "Save
    Report*.diagsession" as shown below (figure 3).


    ![](img/3d310cc066dda6e2dfa67a650614076f_292_0.png)


    Visual Studio 2019 provides amazing tools for performances analysis and in many
    cases, it will cover all your needs in that matter.


    The development of desktop application does not require (generally) much more
    indicators of performance than the ones provided with the Visual Studio 2019 tools
    (This subject is less important for a desktop application than it is for a web
    application).


