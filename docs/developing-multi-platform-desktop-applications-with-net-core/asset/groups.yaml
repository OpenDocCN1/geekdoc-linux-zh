    # 10.3 HIGH PERFORMANCES CODING TRICKS


    We have seen how to measure performances benchmark, and identifying computing
    bottlenecks in the application but a general knowledge of best performances coding
    practices is required for achieving better efficiency in your programs.


    Here is a list of professional tips to use during the coding phase for making
    your program running faster (from the start):


    +   A) String.substring replace with Span<T> (continuous memory).

    +   B) Use the appropriate type of list; IEnumerable rather than List.

    +   C) Use For loop instead of foreach (when it is possible).

    +   D) Use string.concat instead of string.Format.

    +   E) Use parallel programming when it is possible (use TPL).'
