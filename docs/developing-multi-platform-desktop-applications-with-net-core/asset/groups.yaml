    For this sample we will design a basic sample form with one label and two buttons,
    almost the classical form template.


    #### B) Add and use the .qml file in your project


    Once you have designed (edited with QT Design Studio) your interface you can easily
    include it in your .NET Core 3 project application, by using the “Add existing
