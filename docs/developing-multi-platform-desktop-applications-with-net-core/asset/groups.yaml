    \n本出版物旨在为读者提供有价值的信息来源，但并非作为直接专家辅助的替代。如果需要这种级别的辅助，应寻求合格专业人士的服务。\n\n本书中提及的所有商标均为其各自所有者的财产。\n\
    \n## 前言\n\n本书对使用 .NET Core 3 开发桌面图形用户界面应用程序的新技术进行了详细评述。在撰写本书时，.NET Core 3 最终版刚刚发布，对\
    \ .NET 开发者社区的影响已经非常巨大。使用 .NET Core 这一重要新版本所带来的视野扩展了其潜在的应用领域。\n\n该主题正在迅速演变，但我们相当确信，本书中介绍的技术和基础内容在\
    \ Core 框架的下一个版本中（根据微软路线图，应该是 3.1）仍然具有相关性。\n\n.NET Core 3 是微软开发者社区的一大步，其与 Visual\
    \ Studio 2019 的集成似乎表明，它将在未来几年成为雷德蒙德（微软总部所在地）编辑器的主要开发技术。\n\n请确信，我们将跟踪这些开发的未来版本，以便始终让您了解这项不断演进、令人惊叹的技术的最新动态。\n\
