    As you can see, .NET Core 3 not only targets web server platforms but also gains
    many new functionalities, as AI and IoT.


    But unfortunately, the desktop development is a Windows only functionality (it
    relies on WinFx, Windows dependent).


    By proposing these new functionalities, Microsoft fully validates the basic concept
    underneath .NET Core: the modularity is included only in specialized packages
    (and not integrated in the framework as it was the case in .NET framework).


    A major addition to .NET Core 3 is the support of C# 8 new functionalities:


    - Default interface member.

    - Nullable reference types.

    - Switch expressions.

    - Property patterns.

    - Tuple patterns.

    - Static local function.

    - Asynchronous streams.

    - Floating-point API improvements and compliance with IEEE standard.

    - Parsing and format fixes.

    - New math API (BitIncrement/BitDecrement) which match with nextUp nextDown IEEE
    operations.


    Other features included in the .NET Core 3:


    - APIs to access performance-oriented CPU instructions, such as the SIMD. These
    instructions can improve performance.

    - A fast in-box JSON Writer and JSON document.

    - GPIO (general purpose input/output) support for the Raspberry Pi computer.

    - Improved local dotnet tools. Local tools are associated with a location on-disk,
    enabling per-project and per-repository tools.

    - Assembly unloadability, which is part of the AssemblyLoaderContext. The capability
    enables a loader context to be unloaded, with memory released for instantiated
    types, static fields, and for the assembly itself. An application should be able
    to load and unload assemblies via this mechanism without a memory leak.

