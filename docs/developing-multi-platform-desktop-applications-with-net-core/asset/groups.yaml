    \ ```\n\n- **D) Setup packaging (For Ubuntu and macOS only)**\n\n  This step is\
    \ only for the Ubuntu and macOS platforms. On these OS, you have to install “electron-builder”\
    \ with the command line instruction as below.\n\n  ```bash\n  $ sudo npm install\
    \ electron-builder -global\n  ```\n\n- **E) Start to use Electron.NET:**\n\n \
    \ You can achieve that by using the following code inside the WebHostBuilder.\n\
    \n  ```csharp\n  public static IWebHost BuildWebHost(string[] args) \n  {\n  \
    \    return WebHost.CreateDefaultBuilder(args)\n          .UseElectron(args)\n\
