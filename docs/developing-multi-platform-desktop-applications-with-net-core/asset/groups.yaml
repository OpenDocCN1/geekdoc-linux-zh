    ![](img/3d310cc066dda6e2dfa67a650614076f_59_0.png)


    # # Chapter 5. BASIC CODING TECHNIKS FOR C# APPLICATION


    Besides the development of the Graphic User Interface, a desktop application requires
    some minimal knowledge of coding techniques in general (used in desktop, Web,
    Backend ...).


    In this chapter we will provide you the essential practices for the coding of
    the several common functions required when you develop an application with .NET
    Core 3. This chapter aims to provide a basic knowledge of the latest coding techniques
    used in .NET Core.


    These basic guidelines will cover:'
  - '[PAGE 60]


    +   - Application Configuration Storage.

    +   - Tracing and Logging (Standard, Serilog).

    +   - Data Access (Entity Core).

    +   - External Services Access (REST service).

    +   - Threading GUI.

    +   - Using unmanaged code dependencies (p/Invoke).


    These following practices will provide you a quick and easy answer to common issues
    you will reencounter in the development of your application. Relevant web references
    will allow you to get complementary information about a specific subject.


    # 5.1 APPLICATION CONFIGURATION


    In many cases you will have to use a configuration file where to store information
    like “connectionString” for the database access, user’s credentials, services
    endpoints... You do not want to store these data in database (because it does
    not change very often) but you cannot hard code it (because it might change).
    You have to use a configuration file.


    In the .NET framework it was handled by the famous “app.config” file (a XML formatted
    text file) but in .Net Core the things are little bit different.


    For .NET Core application you can still use INI, Config or other custom-made configuration
    provider but the standard way of storing configuration information is to use the
    “appSettings.json” file.'
  - "[PAGE 61]\n\nThe XML format of the `app.config` has been replaced (you still\
    \ can use XML formatting with the appropriate provider) by JSON format more compact.\
    \ .NET Core 3 does not include a built-in configuration management system for\
    \ doing so, you have to add the relevant NuGet package (this is the standard way\
    \ for adding features with .NET Core 3).\n\nThat can be done by adding a specialize\
    \ NuGet package(s) to your project (with Visual Studio 2019 “Package Manager”):\n\
    \n![](img/3d310cc066dda6e2dfa67a650614076f_61_0.png)\n\nNow the data are stored\
    \ in a JSON formatted file, but the main using technics are still relevant.\n\n\
    Here is a sample of a basic `appSettings.json` file:\n\n![](img/3d310cc066dda6e2dfa67a650614076f_61_1.png)\n\
    \n```\n{\n  \"firstname\": \"Dimitri\",\n  \"lastname\": \"K\"\n}\n```\n\nDo not\
    \ forget to copy the `appSettings.json` file to the target build folder by changing\
    \ the properties of the file as described below (figure 1):"
  - "[PAGE 62]\n\n![](img/3d310cc066dda6e2dfa67a650614076f_62_0.png)\n\n# (figure\
    \ 1)\n\nThe reading of this file can be performed with a few lines of codes. As\
    \ the json format is using the raw values and retrieve text format, you have to\
    \ convert them to the required type manually.\n\nHere is a little program (ProgramConfig.cs)\
    \ illustrating how to retrieve data from the configuration file previously described:\n\
    \n# ### ProgramConfig.cs\n\n```\n```\nusing System;\nusing System.IO;\nusing Microsoft.Extensions.Configuration;\n\
    using Microsoft.Extensions.Configuration.Json;\n\nnamespace ConfigProgram {\n\
    \  class Program {\n    static void Main(string[] args) {\n      var config =\
    \ new ConfigurationBuilder()\n        .SetBasePath(Directory.GetCurrentDirectory())\n\
    \        .AddJsonFile(\"appsettings.json\", true, true)\n        .Build();\n \
    \   }\n  }\n}\n```\n```"
