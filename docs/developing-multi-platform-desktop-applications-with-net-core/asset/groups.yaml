    # 5.6.2 Marshalling


    Marshalling: is the process of transforming types when it’s needed to allow cross
    between native code and managed (in our case .NET Core 3) code.


    Here is the table of the type conversion to use with .NET Core 3 types and native’s
    types.


    | .NET Type | Native Type | |---|---| | byte | uint8_t | | sbyte | int8_t | |
    short | int16_t | | ushort | uint16_t | | int | int32_t | | uint | uint32_t |
    | long | int64_t | | ulong | uint64_t | | char | Either char or char16_t depending
    on the CharSet of the P/Invoke or structure. | | string | Either char* or char16_t*
    depending on the CharSet of the P/Invoke or structure. | | System.IntPtr | intptr_t
    |'
