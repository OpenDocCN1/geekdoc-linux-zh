  - '[PAGE 2]


    # Preamble


    The present book offers a detailed review of the new technologies for the development
    of desktop GUI application with .NET Core 3. At the time this book is written
    the .NET Core 3 final version has just been released, and the impact on the .Net
    developer community is already huge. The perspectives offered by the use of this
    new major release of .NET Core expand its potential fields of application.


    The subject is evolving very quickly but we are pretty confident that the technics
    and fundamentals presented will remain relevant for the next version of the Core
    framework (it should be the 3.1 according to the Microsoft roadmap).


    .NET Core 3 is a major step for the Microsoft’s developer community and its integration
    in Visual Studio 2019 seems to indicate that it will become the main development
    technology of the Redmond editor for the coming years.


    Be assure that we will follow the future versions of these developments to keep
    you up to date with this, always evolving, amazing technology.'
