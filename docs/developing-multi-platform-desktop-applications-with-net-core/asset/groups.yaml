    \ QuickStart\n\nThe use of Electron.NET implies following a procedure in order\
    \ to integrate it inside an ASP.NET Core application and transform it into a desktop\
    \ application.\n\nHere is the short procedure to “electronize” your ASP.NET Core\
    \ 3 application. We will review later in much more detail the application code\
    \ itself (within the example section).\n\n- **A) Create an ASP.NET Core MVC application**\n\
