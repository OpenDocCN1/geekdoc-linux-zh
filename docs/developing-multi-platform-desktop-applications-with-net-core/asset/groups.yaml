    - OO approach.

    - Localization.

    - Internationalization.

    - Good documentation (it is getting better).


    Keep in mind that GTK has been developed for the use of, and with, the C and C++
    languages, and it inherits from this its general architecture and programming
    logic. So, this kind of development is very well adapted for C and C++ developers
    who want to use .NET Core 3 for achieving a ridiculous jump in productivity.


    The GTK toolkit is native on Linux, while Windows and macOS versions are emulation;
    on those OS, GTK toolkits require the installation of a list of libraries (not
    exhaustive):


    - Atk: Accessibility framework for GTK.

    - Cairo: Graphic library for vectors and image compositing.

    - Gdk: Contains the graphics primitives of the windows.

    - Gio: Helper functions for GTK I/O operations.

    - Glib: Toolbox and helper functions for GTK (one of the foundations of GTK).

    - Gtk: Contains the widget architecture (for windows and controls).

    - Pango: The font rendering library of GTK.


    ![](img/3d310cc066dda6e2dfa67a650614076f_183_0.png)


    The base programming logic for using GTK is the use of a hierarchical tree of
    widgets. In GTK, the “widget” term is used for controls, windows, and basically
    every element of the GUI.


    The main container widget is the window object; other widgets (controls like textbox,
    label, button, select, ...) can be added inside the main window (container).


    GTK is event-driven (signal/handler). For example, a signal is sent to the application
    when you click a button; you have to define the signal and the handler yourself
    by coding.


    The documentation for developing GTK applications is mainly written for the C
    and C++ languages; nevertheless, it can be easily adapted/ported for use with
    .NET Core 3 C# (if you have a minimum knowledge of C).


    The GTK libraries will have to be installed on the development machine but also
    alongside the application created (so you have to install it with your setup program).


    The GTK native dependencies are mandatory on the target machine; this is a prerequisite
    for a correct execution of the application (you have to include those dependencies
    in the setup program).


    Here are web pointers where you can find more information about the GTK framework.


    ![](img/3d310cc066dda6e2dfa67a650614076f_184_0.png)


    - https://gtk.org

    - https://blog.gtk.org

    - https://developer.gnome.org

    - https://gnome.com/gtk

    - https://github.com/GNOME/gtk


    ## 8.5.2 GTK Install


    As you understood, GTK is a Linux-native tool but needs to be installed on the
    other systems (Windows and macOS). Since the third version, the setup of GTK is
    not a simple binary to launch. The process for installation on Windows and macOS
    consists in the setup of a Linux emulated environment (the size used on disk for
    this environment could be as huge as an original Ubuntu distribution).


    GTK needs to be installed on the machine you plan to deploy or test your GTK application
    too (at least the runtime). We will review in details how you can do this setup
    on each system.


    ### 8.5.2.1 On Windows (for the development station)


    This description for the setup of GTK comes from the gtk.org web site (see the
    reference web sites). This is the recommended procedure for performing the install
    of GTK on your Windows platform. Another solution is to build the GTK toolkit
    from the source code, but it will require a prior installation of a C building
    environment (that’s not our purpose here).


    #### A) Install MSYS2


    For the setup of GTK, you will need to set up an environment for this type of
    application: mingw.


    Mingw is the contraction of “Minimalist GNU for Windows”; it provides the Open
    Source environment for the development of applications for Microsoft Windows.


    MSYS2 is a project that provides a Unix-like environment on a Windows station
    (mingw). This project furnishes the foundation for the development of a GTK application
    on Windows; it will allow the setup of the GTK runtime and the tools (like Glade)
    you will need for developing your .NET Core 3 GTK application.


    MSYS2 furnishes a Unix-like package manager: “pacman” and many other useful tools
    from the Linux environment.


    ![](img/3d310cc066dda6e2dfa67a650614076f_186_0.png)


    You can install MSYS2 as a standard Windows application as you can see in figures
    1, 2, and 3. The installation program should not return any error during the setup
    process; if this is the case, uninstall the faulty version, fix the problem, and
    reinstall from the beginning until you reach a clean MSYS2 install.


    ![](img/3d310cc066dda6e2dfa67a650614076f_186_1.png)


    ![](img/3d310cc066dda6e2dfa67a650614076f_187_0.png)


    MSYS2 64bit Setup

    Installing MSYS2 64bit

    Installing component MSYS2 64bit base...

    Show Details

    Close

    Cancel

    (Figure 2)


    The final screen (Figure 3) shows the Mingw command prompt; this screen indicates
    that the installation is completed and successful.


    When the install process is finished, reboot Windows.


    #### B) Install GTK


    Once you have achieved a proper MSYS2 install and rebooted, you now can install
    GTK runtime and development libraries. This install can be done through the use
    of the appropriate “pacman” (Package Manager) command in the mingw environment.


    ```bash

    ~ pacman -S mingw-w64-x86_64-gtk3

    ```


    The result expected should look as in Figure 4.


    ![](img/3d310cc066dda6e2dfa67a650614076f_188_0.png)


    (Figure 4)


    #### C) Install Glade


    Glade is the new GTK interface designer; it will allow you to make the design
    of your application through a visual tool and save it to an XML standard format
    file, which can be loaded by GTK using the GTKBuilder. In its third version, this
    is a professional-class tool that will allow the design of your GTK application
    GUI as you design a standard C# Winforms application.


    Even if Glade has its own logic for the design, it allows the developer to achieve
    a sharp modeling of the GUI.


    The setup of Glade is also performed with the “pacman” program by using the following
    command:


    ```bash

    ~ pacman -S mingw-w64-x86_64-glade

    ```


    The successful installation of Glade screen should look like Figure 5.


    ![](img/3d310cc066dda6e2dfa67a650614076f_189_0.png)


    (Figure 5)


    Once installed, you can manually launch the Glade program by clicking on the “glade.exe”
    file in the mingw folder, or running the command line “glade.exe”.


    We will review later how to integrate Glade within Visual Studio 2019 for the
    edition of the interface (XML file) without leaving the IDE.


    Of course, if you do not plan to use the GUI visual designer and define the GUI
    with C# inline code and XML, you will not need to install Glade; it is not a mandatory
    install if you write your GUI by hand.


    #### D) Configure environment variable


    For having a system-wide access to the GTK libraries and dependencies, you should
    modify the Windows global path. For doing so, you have to edit the global path
    environment variable:


    Control Panel > System and Security > System > Advanced system settings > Environment
    variables >


    Modify the “Path” variable by adding “`C:\msys64\mingw64\bin`” (or the path to
    the mingw tool you have setup) to it as described in the picture below (Figure
    6).


    ![](img/3d310cc066dda6e2dfa67a650614076f_191_0.png)


    This modification will be effective after the next reboot of the Windows system.


    You have also the possibility to add the environment variable path only for your
    GTK application inside Visual Studio project properties, but we will review this
    solution later in the example section.


