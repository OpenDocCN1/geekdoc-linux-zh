  mdcn: "\n## 8.5.4 Glade\nGlade 负责生成描述 UI 的 XML 代码，并生成一个可通过 GtkBuilder（通过 GtkBuilder\
    \ 对象）加载的 XML 文件。这些 XML 文件随后可以在你的 GTK# .NET Core 3 C# 应用程序中使用（实际上，可以使用任何用于 GTK\
    \ 工具包开发的语言）。\n\n你可以在以下参考链接中找到关于 Glade 的更多信息。\n\n![](img/3d310cc066dda6e2dfa67a650614076f_200_0.png)\n\
    \n- <https://glade.gnome.org/>\n- <http://glade.gtk.org>\n\n### 8.5.4.1 安装 Glade\
    \ 以配合 Visual Studio 2019 使用\n为了方便编辑 GUI XML 文件，可以在 Visual Studio 2019 内部调用 Glade。\n\
    \n你可以在 Visual Studio 中轻松配置，将 Glade 设置为打开“glade”扩展名文件类型的默认程序（图 1）。因此，GTK GUI 的集成将显示为在\
    \ Visual Studio 环境内部集成，你将能够使用 Visual Studio 中的“解决方案资源管理器”编辑“glade”文件。\n\n![](img/3d310cc066dda6e2dfa67a650614076f_201_0.png)\n\
    \n(图 1)\n\n当你打开“glade”文件时，必须选择“设为默认”，以便永久关联到 Glade。\n\n一旦在 Visual Studio 中完成了\
    \ Glade 的安装和配置，你只需要双击“解决方案资源管理器”视图中的“.glade”文件，根据你的需求进行编辑即可。\n\n### 8.5.4.2 使用\
    \ Glade 进行界面设计\n使用 Glade 进行 GUI 设计对于每个开发人员来说几乎都很直观（与 Visual Studio 中的 Winforms\
    \ 设计器几乎相同）。正如你在下面的（图 2）中所看到的，它提供了类似的功能。\n\n![](img/3d310cc066dda6e2dfa67a650614076f_202_0.png)\n\
    \nGlade 应用程序（*图 2*）由三个不同的面板组成，对应于应用程序的三种功能：\n\n- 左侧面板：表示容器中存在的小部件的层级树。Glade 允许添加小部件或容器（在\
    \ GTK 中也是一个控件）。表单（或屏幕）设计遵循小部件的层级树。你还可以在此视图中按名称选择小部件。\n- 中心面板：设计器的主视图。此面板允许开发人员设置所选小部件的位置、大小（也允许选择小部件）以及添加新的小部件。\n\
    - 右侧面板：此面板汇集了与所选标签页相关的四种不同功能：\n  1. 所选小部件属性的视图（带“常规”标签页）。\n  2. 用于小部件定位及其停靠、填充（GTK\
    \ 术语）的视图（带“填充”标签页）。\n  3. 当前所选小部件通用属性的视图（带“通用”标签页）。\n  4. 用于管理关联于小部件的不同事件发送的信号的管理视图（带“信号”标签页）。\n\
    \n这些简单的概念足以使用 Glade 为你的应用程序设计高效的 GUI。\n\n请注意，掌握 Glade 并非即时发生的，可能需要一段学习曲线，具体取决于开发人员。\n\
    \n### 8.5.4.3 在 Glade 中定义信号/处理程序\n完成图形设计后，可以使用 Glade 来建立界面与后端程序（C# 代码）之间的链接。\n\
    \nGTK 遵循信号/处理程序类型的架构（经典类型）。在这种逻辑下，Glade 允许开发人员指定特定小部件上事件发送的信号类型（在右侧面板中）。此实现直接通过指定特定信号的适当方法名调用从\
    \ Glade 应用程序完成，如下所述（图 3）。\n\n你会注意到 Glade 界面中的一些信号被标记为“已弃用”，但也可以使用这些已弃用的信号（如截图所示）。\n\
    \n![](img/3d310cc066dda6e2dfa67a650614076f_204_0.png)\n\n(图 3)\n\n一旦为信号定义了方法名，必须将相应的方法语句添加到包含应用程序后端逻辑的“.cs”文件中（图\
    \ 4）。\n\n![](img/3d310cc066dda6e2dfa67a650614076f_205_0.png)\n\n每次预定义事件上的信号被触发时，实现的方法都将被调用。此方法提供了一种简单优雅的方式，用于实现\
    \ GTK# / .NET Core 3 应用程序前端和后端之间的交互。\n\n你还有另一种选择，不使用 Glade 中的信号/处理程序，而是直接使用小部件的名称在代码中编码事件（但这可读性较差）。\n\
    \n## 8.5.5 GTK# 示例应用程序\n如前所述，你可以以两种不同的方式开发 .NET Core 3 GTK 应用程序：\n\n- 内联 C# 编码的\
    \ GUI 实现。\n- XML 设计的 GUI（使用 Glade 和 Gtk.Builder）。\n\n在本节中，我们将为你回顾这两种方法各自的示例项目。这些方法各有优缺点，应根据你打算开发的项目类型进行选择。\n\
    \n### 8.5.5.1 *内联 C# 编码 GUI 示例*\n该示例是使用 GTK 工具包的良好起点（内联 GUI 应用程序开发，它使用大量小部件（GTK\
    \ 术语中的控件）。\n\n此示例提供于 GTK# GitHub 仓库中，并且似乎是此类应用程序开发的参考（GTK# 的文档并不多）。该应用程序是一个演示程序，其唯一功能是使用\
    \ GTK# 中可用的广泛小部件。\n\n以下是不同平台上渲染的屏幕截图。\n\n#### 在 macOS 上：\n![](img/3d310cc066dda6e2dfa67a650614076f_207_0.png)\n\
    \n#### 在 Ubuntu 上：\n![](img/3d310cc066dda6e2dfa67a650614076f_207_1.png)\n\n####\
    \ 在 Windows 上：\n![](img/3d310cc066dda6e2dfa67a650614076f_208_0.png)\n\n你已注意到该应用程序的\
    \ macOS 版本不包含标题栏头部图标。这是因为在 macOS 上，使用 brew 安装的 GTK3 默认并不安装默认主题图标（这与 Windows 安装的情况不同）。你必须使用下面描述的命令行（brew\
    \ 公式）在侧面安装 GTK3 默认主题图标。\n\n```\n$ brew install gnome-icon-theme\n```\n\n此命令将安装默认\
    \ GTK 图标和主题资源，以便正确显示应用程序。正确安装该包将产生如下屏幕所示的输出。\n\n```\nlast login: Sun Aug 4 05:41:13\
