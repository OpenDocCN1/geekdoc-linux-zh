  mdcn: "\n\n+ 9.4.2 优势 276\n+ 9.4.3 CoreRT 安装前提条件 277\n+ 9.4.4 本机编译场景 279\n+ 9.4.5\
    \ CoreRT 控制台项目示例 285\n+ 9.5 .NET 编译器平台：Roslyn 287\n+ **第 10 章. 应用性能优化 289**\n\
    + 10.1 使用 Visual Studio 运行分析工具 290\n+ 10.2 .NET Core 3 性能基准测试 294\n+ 10.2.1 BenchmarkDotNet\
    \ 示例解决方案 297\n+ 10.3 高性能编码技巧 298\n+ 10.4 本机可执行文件压缩 300\n+ 10.4.1 UPX 快速入门指南 301\n\
    + **第 11 章. 多平台打包和部署 304**\n+ 11.1 为每个平台开发安装程序 305\n+ 11.1.1 生成 Windows 安装程序 305\n\
    + 11.1.2 生成 macOS 安装程序 306\n+ 11.1.3 生成 Ubuntu 安装包 308\n+ 11.2 多平台统一安装程序开发：InstallBuilder\
    \ 309\n+ 11.2.1 什么是 InstallBuilder 310\n+ 11.3 应用程序打包和部署工具推荐 312\n+ **第 12 章.\
    \ 回顾方案的前瞻 315**\n+ 参考文献 320\n\n# 本书的目标读者\n\n尽管本书力求让大多数读者都能理解，但仍需要具备基础的软件开发知识。本书主要针对\
    \ 3 类开发者画像。\n\n第一种画像是 C#.NET 框架开发者，他们希望更新知识以适配最新的微软技术和框架，使其能够针对 Linux 和 macOS，除了他们过去一直用于开发的经典\
    \ Windows 系统外。鉴于 .NET Core 当前的路线图，它应该成为微软未来的主要开发框架（当然，经典的 .NET Framework 仍将继续支持遗留开发）。\n\
    \n第二种画像是 ASP.NET C# 开发者，他们希望升级其桌面开发环境方面的知识，并针对市场上可用的 3 个主要平台（Windows、Linux、macOS）开发\
    \ GUI 应用程序。\n\n第三类可能对阅读本书感兴趣的画像是 C++ 开发者（C# 使用的语法很容易被 C++ 开发者快速掌握），他们希望增加一门用于开发桌面应用程序的新语言，并通过使用\
    \ .NET Core 3 提高生产力（这对他们来说也是一个获取广泛应用于 Web 和云技术的知识的机会）。\n\n你应该具备使用 Visual Studio\
    \ C# 开发软件解决方案的基础经验，以及对目标系统（Windows、Linux、macOS）的基础知识。\n\n# 如何阅读本书\n\n和大多数技术书籍一样，本书可以从头到尾阅读。按顺序通读全书有助于读者更好地理解决作者解释的每个概念。\n\
