    a label and button, there is no use of effects or animation here, this is the
    minimal project (only the use of the "Universal" theme is implemented).


    The features of the application are quite limited (it implements a text change
    in label control triggered by buttons), but it furnishes the foundation for starting
    the development of QML.NET application.


