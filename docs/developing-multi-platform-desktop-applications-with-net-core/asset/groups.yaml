    # 5.3 DATA ACCESS: ENTITY FRAMEWORK CORE


    With .NET Core 3, the developer can still use classical ways (as done with .NET
    Framework) to access the database (Command, Request Reader...) but for modern
    advanced software solution the data access have to be layered in a standardized
    way (with ORM).


    The data access in .NET Core should be done (that''s not mandatory, but it''s
    highly recommended) by using the Entity Core component (a NuGet package). This
    is the ORM (Object Relational Mapper) developed by Microsoft inherited from the
    dotnet framework (Entity Framework).


    The Entity Framework Core has followed the trend set, as .NET Framework, to a
    lighter multiplatform environment.'
