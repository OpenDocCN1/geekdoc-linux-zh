    # 5.5 THREADING GUI


    As we have seen in the previous chapter, the reactivity of an application is a
    crucial metric of the user''s global quality perception of a desktop application.


    The good reactivity of the application can be reached by giving to each heavy
    processing task and User Interface task its own thread. Thus, the main process
    is never overloaded and the application continue to respond to the user (reactivity),
    whatever the previous instructions.


    There is several methods for achieving this threading according to the type of
    solution you want to use for developing your multiplatform application (Console,
    XAML, HTML, Native UI ...).


    The threading of long and complex task of your application can be done in a progress
    window where you display a gauge (or other progress indicator) control and propose
    to the user the option to Cancel the operation in progress.


    ![](img/3d310cc066dda6e2dfa67a650614076f_83_0.png)'
