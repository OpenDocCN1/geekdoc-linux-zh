    # Chapter 11. MULTIPLATFORM PACKAGING AND DEPLOYMENT


    Once you achieve to get a proper alliance of your application you will need to
    package it for the provisioning on the user computer (deployment). But in that
    matter, there is a huge difference among OS.


    These differences could imply the development of a specific setup program for
    each platform you target for your project.


    You can respond to these constraints by the development of your own specific setup
    program for each OS your software targets, but this solution is time consuming
    and adds a supplemental weight on the workload (but that can be a wise choice
    in the long run).


    The developers can also use a dedicated software for each specific OS for doing
    that (we will review several solutions on each platform). But, you have to keep
    in mind that if you want to provide a setup program for each platform your application
    is targeting, you will have as much setup program projects to manage, introducing
    a supplementary complexity to your developments.


    Thereafter, we will review a unified multiplatform setup development tool more
    adapted to professional requirements.


    ## 11.1 DEVELOPING A SETUP PROGRAM FOR EACH PLATFORM


    In this section we will review the solutions already existing for the development
    of a setup program for your application on the three platforms.


    ### 11.1.1 Generate an install program for Windows


    A plethora of solutions are available on Windows, these solutions not only provide
    the installer for your program but could perform advanced task like: dependencies
    check, conditional system version install ...


    Here is a little short list of the most professional (in our point of view) installer:


    - **Wix**: This program allows developers to generate installers for Windows system,
    it is built-in Visual Studio 2019 with the use of the free Extensions (see Visual
    Studio marketplace). The SDK allows the use of custom action written in C# (among
    others features). A vibrant community support this project. It is a tool used
    by Microsoft.

    - **Visual Studio Installer project** (InstallShield): This is the “light” version
    of the iconic software InstallShield, this extension does not work with Visual
    Studio Community edition.

    - **Nsis** (Nullsoft scriptable install system): A professional Opensource program
    to produce Windows Installers, it is small and flexible and allow the use of plug-ins
    and scripts (very popular in the Opensource community).


    According to our experiences the best solution for the implementation of a setup
    program on Windows is Wix, this product offering a scripting language much easier
    to manage at no cost (since this is Opensource) furthermore you will find abundant
    documentation on internet (with already made scripts). Others solutions like Microsoft
    Visual Studio Installer (InstallShield light) and Nullsoft have their own advantages
    in their respective fields of application and can be a better solution for your
    particular software’s requirements.


    | Reference | Link |

    | :--- | :--- |

    | | https://wixtoolset.org |

    | | http://www.flexera.com |

    | | https://nsis.sourceforge.io |

    | | https://advancedinstaller.com |


    ### 11.1.2 Generate an installer for MacOS


    macOS does not usually use installers, the application has to be packaged in a
    “.app” file.


    The .app file can be directly executed. This is the file format distributed by
    the Apple Store.


    Nevertheless, you can generate .pkg, .dmg, and .dmg files for the distribution
    of your application in this environment.


    - Generate a .dmg file with “DiskUtility.app”: Create DMG file manually with the
    “Disk utility” application could be a solution of choice for the distribution
    of a basic application.

    - iDMG: It is a drag and drop tool for the creation of a .dmg file from a folder
    content, it integrates encryption capabilities too (this product is no longer
    under development).

    - Dmg Canvas from Araelium: It is a commercial solution who allows you to provide
    beautiful designed setup program for the distribution of your software.

    - Packages: It is a free tool developed by an independent developer. Despite this
    fact, the product looks pretty professional and allows a very good flexibility
    for the building of an installer program for your application on macOS. “Packages”
    integrates many advanced features like presentation editor, dependencies editor,
    requirements editor and the possibility to use signing with a certificate.


    | Reference | Link |

    | :--- | :--- |

    | | http://en.wikipedia.org/wiki/Installer_macOS_ |

    | | http://araelium.com/dmgcanvas |

    | | https://s.sudre.free.fr/Software/Packages |


    The choice of the tool will depend on the type of software you want to distribute.
    But in our point of view Packages furnish the most clean and cheap solution on
    macOS.


    ### 11.1.3 Generate an installation package for Ubuntu


    The distribution of an application on Linux is quite different than in the Windows
    (or macOS) environment, there are many types of solution who coexist for the packaging
    and the deployment of applications.


    We will review several of them on the ubuntu (Debian based) distribution.


    - **AppImage:** AppImage is a file format for the distribution of portable software
    on Linux platform. AppImage have many advantages compared to the classical way
    for the distribution of your application (because all the dependencies are included
    in a compact file).

    - **Debian package maker:** It is a GUI tool for the creation of a Debian package
    for your application, this tool is working perfectly and is easy to use with its
    graphical interface, but it has not been updated for 10 years (table).

    - **Nixstaller:** It is command line tool for helping the developer to build graphical
    installers in Linux.

    - **izPack (Java based):** Opensource project since2001, IsPack is Java based,
    It generates a single installer for the packaging and the distribution of your
    application. It uses a XML scripting language.

    - **Makeself:** It is a small shell script who generate a self-extractable compressed
    file from a directory (It can look as the minimal tool for the distribution of
    a software on the Linux platform).


    Regarding the large panel of solutions offered on the Linux platform for the building
    of a setup tool for your application we can recommend the use of AppImage.


    Indeed, AppImage provides a distinctive way to provide out of the box running
    application packaging solution. By including in the package all the elements that
    the application requires it provides a reliable means for the distribution of
    your application for the Linux OS. Moreover, does not need “administrator” rights
    for the setup of the application (that could be handy).


    AppImage have gained popular recognition in the Linux developer’s community (and
    has acquire a solid reputation of reliability). This application is Opensource
    and provide quantity of documentation.


    ![](img/3d310cc066dda6e2dfa67a650614076f_308_0.png)


    - https://www.appimage.org

    - http://debianpackagemaker.blogspot.com

    - http://directory.fsf.org/wiki/Nixstaller

    - http://izpack.org

    - https://makeself.io


    ## 11.2 MULTIPLATFORM UNIFIED SETUP PROGRAM DEVELOPMENT: INSTALLBUILDER


    Even if the previous presented solutions can fit to your setup program development
    needs, these solutions imply the development of several setup projects (one per
