    ![](img/3d310cc066dda6e2dfa67a650614076f_37_0.png)


    (Figure 1: sDLC)


    **Specifications (and requirements gathering):** Do not down view the specifications
    phase because it will define the architectures and technologies choices. During
    this phase you will:


    +   * make the analysis (possibly with tools like UML).

    +   * retrieve the user''s stories (requirements).

    +   * and possibly define form design (functional).


    **Architecture and coding:** During this phase you will define the software architecture
    needed for matching the specifications done previously. You will have to integrate
    also environment constraints (company) to define them. Once the target architecture
    is defined the coding of each functionalities can be done. The use of design pattern
    is useful if you plan to use several developers on the same part of the program.
    This phase includes also unit testing for the validation of each piece of code
    produced by the development team.'
  - '[PAGE 38]


    **Integrations and Tests:** The test phase is important, because it allow to the
    programmer(s) to verify if each brick developed for the project works well the
    others, and thus, provide the expected result software. It is not possible to
    deliver quality software without testing it, there is always an issue, or worth
    a bug (yes it happens). Tests can be automated by the use of a Continuous Integrations
    tool (like TFS DevOps).


    **Validation by user(s):** The users have to validate the final product, It is
    an important step, but underestimate by most of big company (because of the architecture
    of their structure of development). It is important that the general feelings
    of the final user match the expectation set during the specifications phase. This
    validation improves also the perception of quality of the final software for the
    users.


    **Release and deployment:** During this phase the software is already produced
    (at least an executable is available) but the development of the project is not
    yet finished. In many cases especially for desktop application, the final software
    has to be integrated in a setup/install package who will allow a smooth distribution
    to the users. This is a crucial step in a multiplatform project (because of the
    specificities of each OS regarding the software installation process).'
  - '[PAGE 39]


    Each iteration in the cycle aim to fix bugs, integrate new features or changes
    in the specifications, improve performances. In this context this cycle is iterating
    during along the life of the software.


    # ## 3.3 DEFINE MULTIPLE ENVIRONMENTS


    It is important during a project to separate in several environments the developements
    done. It helps the developer to maintain coherence and continuity between the
    different bricks he should develop for achieving his goals, without conflict with
    other developed parts of the project.


    These environments corresponding to a computer (or a virtual machine) or simply
    to a repository (or a folder) for the storage of the data needed during development
    (like documentations, database script, specifications..).


    A Wiki dedicated (web site) for each environment could be often pertinent. The
    use of a Wiki aims to keep a knowledge base for each element or specific techniques
    used during the development. The Wiki web site is especially useful on project
    with a small team or with remote human resources.


    Besides the knowledge base regarding the development, the project during his evolution
    will need several distinct environments for fulfilling requirements of each phase.


    The usual habit in this domain is to define 3 environments:


    **Development**: In this environment the developer can create side projects for
    the validation of complex parts of the program. It is an informal environment
    dedicated to the coders and only them.'
  - '[PAGE 40]


    **Test**: In this environment the developers will release the project for the
    validation, usually this environment should be the same as the Release environment.
    Here the bugs are identified, performances are evaluated, points to review go
    back to the development.


    **Release**: This environment is the one the software should run in production.
    In our case desktop/laptop computers with no previous specific install done (who
    can interfere with the software developed). The Release environment will allow
    to validate both the Install/setup module and the software itself.


    For the multiplatform development needs, there will be 3 ** (Development, Test
    and Release) environment on the main development platform (the Windows station),
    and 2 (only **Test and Release**) on ubuntu and macOS.


    # 3.4 SOURCE CONTROL


    An-other important aspect to consider before starting your development is to integrate
    tools for the source code management. The source code of your project is the main
    achievement of hard coding works and should be consider as precious.


    In this context, the use of a source control tool is mandatory for professional
    development (for personal works as well), this tool will be especially useful
    for:


    +   - Avoid lost code source.

    +   - Avoid release of a faulty code.

    +   - Keep Versioning.

    +   - Allowwing code analysis.'
