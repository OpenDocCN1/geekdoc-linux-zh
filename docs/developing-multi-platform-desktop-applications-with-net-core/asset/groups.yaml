    # 9.3 STRUCTURES OF THE CSPROJ FILE


    .NET Core 3 use the new .csproj file format (in replacement of the project.json
    for .NET Core 2) for being used by MSBuild for the project building process.


    With this new .csproj file format Microsoft has achieved a marvelous work of simplification
    (is far less verbose than before) but also achieved to add features to it (specify
    the generation of a NuGet package at build time for example).


    The .csproj file consists in an XML file interpretable by MSBuild, it constitutes
    a script for leading the building process (for the dotnet CLI as well).


    The .csproj file is used by the MSBuild to compile, build and link your project.
    It offers many features options:


    +   - Single exe packaging.

    +   - NuGet package creation.

    +   - Multi-framework targeting.

    +   - Conditional references.

    +   - Conditional compilation.'
