    ## 核心


    当前该产品各版本之间的稳定性并不理想。因此，如果 Electron.NET 封装器不支持未来的 .NET Core 版本，这并不令人惊讶。确实，选择此方案的开发者可能不得不在完整的
    NodeJS 解决方案开发（完整的 Electron）与使用 .NET Core 之间做出选择。但这只是推测，我们尚未走到那一步。


    **LibUI** 是一个相对低调（不太流行）的 GUI 工具包（主要被 C++ 用户所熟知），但它提供了卓越的性能、极小的依赖项体积，且围绕该工具的社区依然非常活跃。另一方面，界面的实现必须手动完成（通过代码），这限制了该工具仅适用于特定类别的开发者。该封装器的整体质量在未来版本中也可能会得到改进。该封装器使用的是
    .NET Standard，因此无论未来的 .NET Core 版本如何，它都将可以使用。


    **GTK 工具包**拥有相当长的开发历史，尽管某些开发周期非常平静（稳定），但 GTK 社区依然让它保持活跃。生产环境中部署的应用数量将保证（至少在一段时间内）产品演进的连续性。此外，GTK#
    封装器是使用 .NET Standard 实现的，因此它也将适用于 .NET Core 的未来版本。


    **QT** 框架拥有庞大的社区，并且自 2014 年以来有一家公司保证其未来的持续发展。


    尽管 QT 最常被 C++ 开发者社区使用（带有完整的开发环境 QtCreator），但 QML.NET 提供的绑定为 .NET Core 社区提供了一种将
    QML 语言集成到 .NET Core 开发者工具箱中的绝佳方式。同样地，QML.NET 也是使用 .NET Standard 开发的，这标志着今天开发的应用程序在未来具有可维护性。


    **Avalonia** 似乎是 Microsoft WPF 开发的延续。顾名思义（Avalon 是 Microsoft 在开发 WPF 期间使用的代码名），它整合了
    WPF 当前的 XAML 原则，并将其移植到多平台（Windows、Linux、macOS、Android）。


    Avalonia 似乎是 WPF 应用程序开发者的快速选择，因为使用的标准 XAML 与 WPF 类似（但不兼容）。尽管开发活动不是很频繁（它处于 Alpha
    版本长达数年），但发布的专业质量、专用工具的可用性以及丰富的文档，可能暗示它会被 .NET 开发者社区更广泛地使用。即使未来并非如此，使用 .NET Standard
    依赖项也将保证今天开发的应用程序在长期运行中的代码可维护性。


    总之，本书中介绍的大多数工具都可以根据具体需求和这些开发的背景，为多平台应用程序开发提供恰当的解决方案。


    选择解决方案类型的另一个重要因素也是当前可用于制作应用程序的技能（人力资源）。这肯定是一个决定性的标准，将在许多开发团队中自行做出选择。


    因此，我们看到了许多选择工具而非其他工具时需要考虑的参数。你还应该考虑你打算为你的软件设定的寿命。如果你的应用程序不打算长期运行，或者是为了技术演示目的而开发的，你可以考虑更花哨和流行的工具（但往往不稳定）。如果你计划开发一个在多年内发布多个版本的应用程序，你必须记住，你选择的工具将在你所瞄准的时间框架内始终被开发和支持（或至少可维护）。


    希望本书能成为你 .NET Core 3 开发项目的灵感源泉。由于这是一项不断演变的技术，请相信我们将就 .NET Core GUI 桌面开发这一激动人心的主题发布更新版本。


    ## 参考文献


    由于这是一个新颖且仍在发展的领域（至少对于 .NET Core 3 而言），编写本书时使用的资料来源大多是在线找到的。我们可以提及并感谢以下网站：


    - Microsoft.com

    - Stackoverflow.com

    - Codeguru.com

    - Gnome.org

    - Apple.com


    ### 书籍参考


    - "用户界面检查方法：一种以使用为中心的设计方法" / Chauncey Wilson / 出版方：Morgan Kaufmann 2014

    - "用户界面设计要素" / Theo Mandel / 出版方：J. Weiley, 版权所有 1997

    - "界面效应" / Alexander R. Galloway / Polity Press 2012

    - "Windows 界面：软件设计指南" / Microsoft Corporation / Microsoft Press 1996

    - "人机交互与信息的管理：2015 年 HCI 国际会议，美国洛杉矶" / Yamamoto Sakae / 出版方：Springer 2015

    - "心智模型：使设计策略与人类行为保持一致" / I. Young / 出版方：Rosenfeld Media 2008

    - "用户界面设计必备指南：GUI 设计原则与技术简介" / Wilbert O. Galitz / 出版方：Wiley, 版权所有 2002

    - "衡量用户体验：收集、分析和展示可用性指标" / Thomas Tullis / 出版方：Elsevier-Morgan Kaufmann 2013

