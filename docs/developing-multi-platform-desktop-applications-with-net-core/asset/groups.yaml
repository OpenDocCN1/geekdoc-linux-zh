    # 5.4.1  Building the Web request


    First you will have to specify the endpoint address, once it is done you will
    instantiate the HttpClient class doing the web request. This API support only
    async methods (useful when you work on the network). The task web request will
    be performed by an async method (see sample code for REST Client).


    # 5.4.2  Processing the request and retrieve data


    The call of the web request will be done with the await keyword (that''s an async
    method).


    # 5.4.3  Processing JSON result


    One you have retrieved the data from the REST service (HTTP status 200), you will
    have to convert the JSON result into exploitable C# object. For doing that you
    have to write a class for the type of the object matching the JSON result format
    you expect.


    > TIPS: In Visual studio use the menu Edit/Paste special/paste code as class for
    generating C# object from JSON data.'
