  - '[PAGE 275]


    CoreRT use RyuJIT, the Just In Time compiler (used by .NET Core

    during the execution of the program) to perform an Ahead Of Time

    (AOT) compilation of the program.


    CoreRT comes from the refactoring of the .Net Core runtime

    (RyuJIT) but instead of producing machine code on the fly during

    the execution it produce the machine code and save it (AOT) on the

    file system (instead of being copied in memory).


    # 9.4.2   Benefits


    The use of CoreRT brings many benefits to the developer, here is a

    list of the most critical:


    +   - Generation of a native application (no need to install .NET

    +     Core Runtime!)

    +   - Better performance during the startup phase of the

    +     application (no more needs to load the CLR, JIT, ...)

    +   - Possibility to use native compiler optimization (from C++)

    +   - Easier multiplatform deployment scenarios (You can deploy

    +     your application using only on native executable)

    +   - Ability to be deployed on small container


    These, quickly enumerated, benefits are often critical regarding the

    choice of the development language or framework, it make a great

    sense now to use .NET Core 3 for the development of multiplatform

    application (at least for Windows, Linux, macOS).


    The average minimal size of the EXE produced for windows 64 (for

    the classical “HelloWorld” project) is around 4 MB (compared to

    the 70MB with .NET Core embedded).'
