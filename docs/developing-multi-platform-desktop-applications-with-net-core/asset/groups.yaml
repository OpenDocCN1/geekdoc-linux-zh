    # 8.4.5 Review of LibUI based .NET Core 3 application


    In conclusion, LibUI furnish a lightweight and efficient solution for the development
    of an GUI desktop application it does not require any prerequisites install of
    dependencies and neither the install of dedicated tools. It is light and fast
    and the community is continuously working on it for the integration of improvements.


    LibUI should, in that context, seem to be the perfect tool to use for a .NET Core
    3 GUI application (at least the time, the different OS display API remain stable),
    nevertheless the lack of a visual designer for the conception of the GUI could
    discourage many developers to use it in a professional environment or for rapid
    development. The time required for mastering the wrapper for the design of the
    GUI should not be under estimate but once done the results achieved by this library
    can be quite impressive.


