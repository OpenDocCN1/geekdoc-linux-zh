    - **Assert.IsNull()**: Validate the test if the value checked is equal to Null.

    - **Assert.IsNotNull()**: Validate the test if the value checked is different
    from Null.


    There are several other ASSERT methods available (see [documentation in reference](#)
    for various test validation types) but these ones are used in most of the cases
    encountered by developers (these are the most often, actually, used).

