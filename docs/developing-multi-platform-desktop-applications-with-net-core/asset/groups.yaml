    ## 8.6.5 Samples program GUI with QML.NET


    In this section about the use of QML.NET for the development of a multiplatform
    application with .NET Core 3 we will review three different types of example projects
    for illustrating several methods.


    - The first example is the example from the QML.NET author GitHub repository,
    it has been updated for using .NET Core 3 (and slightly modified).

    - The second example uses QT Design Studio designed GUI with the standard QT Quick
    Controls.

    - The third one uses a GUI designed and exported from Photoshop (using the QML
    Exporter script described previously).


    You have noticed that we didn’t approach and review the process for the setup
    of the QT runtime (as for GTK development for example), this is because it is
    not required when you develop with QML.NET.


    Indeed, a dedicated instruction of the QML.NET wrapper checks the presence of
    the QT runtime required and downloads/installs it, if it is required, without
    any intervention of the user (that’s almost magical).


    So, the only requirement for the use of the QT runtime in your .NET Core 3 application
    is to include in your C# source code the following instruction.


    ```csharp

    RuntimeManager.DiscoverOrDownloadSuitableQtRuntime();

    ```


    This seamless integration of the runtime in your .NET Core 3 program is just a
    blessing for the developers compared to the old way, for the setup of the QT runtime
    required for the deployment of a QML based application.


    ### 8.6.5.1 QML.NET sample application


    The first example application has been developed by Paul Knopf, one of the principal
    developers of a QML.NET framework. At the current time this example project is
    still targeting the .NET Core 2.2 framework so we have modified it slightly to
    target the .NET Core 3 (available on netcore3 GitHub repo).


    This application makes the demonstration of many features already available in
    QML.NET and constitutes a learning sample of choice for the beginner QML.NET developer.


    The sliding menu on the side is reusable in many types of application, besides
    the different pages illustrate a specific QML.NET features. Each page of this
    program contains a pertinent example of how to use the different features for
    the interaction between the C# and the QML.


    You should review this example carefully for getting a deeper understanding of
    how to use the QML interface in your own .NET Core 3 application.


    Here are the renderings of the updated (for targeting the .NET Core 3) example
    program on the different platforms.


    #### On macOS:


    ![](img/3d310cc066dda6e2dfa67a650614076f_231_0.png)


    #### On Ubuntu:


    ![](img/3d310cc066dda6e2dfa67a650614076f_231_1.png)


    #### On Windows:


    ![](img/3d310cc066dda6e2dfa67a650614076f_232_0.png)


    The running of this first example will also allow you to validate your development
    environment and the QT configuration environment (check if everything is running
    as expected...).


    When you run this example program for the first time the QT5 runtimes will be
    downloaded and installed for the application, so do not worry if it takes a long
    time (depending on your internet connection quality). A working internet connection
    is required for the first execution of the program.


    That is, of course, in the case when you did not previously install the QT5 runtimes
    on the development machine. You can preinstall the QT5 runtime with the help of
    the dedicated project on GitHub (see links in reference) it will save time during
    the first launch of the application you are working on.


    As it is the first QT (or rather QML.NET) program you test, you can notice that
    the look is exactly the same for the three platforms, QT guarantees the coherence
    of the GUI across platform implementations, and it is a strong point of QT.


    The source code of this application can be found on GitHub. The “qmlnet-samples”
    does not target the .NET Core version 3, for getting the updated project targeting
    the require .NET Core version, please use the netcore3 GitHub repos.


    https://github.com/qmlnet/qmlnet-examples/


    .Net Core 3 version: https://github.com/netcore3/CodeBook/Chapter%208/6/QML.Features


