  md: "\n## 8.5.4 Glade\nGlade takes care of the generation of the XML code that describes\
    \ the UI and produces a XML file loadable through the GtkBuilder (with a GtkBuilder\
    \ object). These XML files can be thereafter be used in your GTK# .NET Core 3\
    \ C# application (actually with any languages you use for developing with the\
    \ GTK Toolkit).\n\nYou can find more information about Glade with the reference\
    \ links below.\n\n![](img/3d310cc066dda6e2dfa67a650614076f_200_0.png)\n\n- <https://glade.gnome.org/>\n\
    - <http://glade.gtk.org>\n\n### 8.5.4.1 Install Glade for the use with Visual\
    \ Studio 2019\nFor an easy edition of the GUI XML file, Glade can be called from\
    \ within Visual Studio 2019.\n\nYou can easily configure in Visual Studio, Glade\
    \ as the default program for opening the “glade” extension file type (figure 1).\
    \ Thus, the integration for the GTK GUI will appear integrated inside the Visual\
    \ Studio environment, you will be able to edit the “glade” file from the “Solution\
    \ Explorer” in Visual Studio.\n\n![](img/3d310cc066dda6e2dfa67a650614076f_201_0.png)\n\
    \n(figure 1)\n\nYou have to select \"Set as Default\" when you open the \"glade\"\
    \ file for a permanent association with Glade.\n\nOnce the installation and the\
    \ configuration of Glade has been done in Visual Studio, you just have to edit\
    \ the \".glade\" file according to your requirements by double clicking on it\
    \ in the “Solution Explorer” view.\n\n### 8.5.4.2 Interface design with Glade\n\
    The design of the GUI with Glade is almost intuitive for every developer (almost\
    \ same as the Winforms designer in Visual Studio). As you can see in the (Figure\
    \ 2) below, it offers similar features.\n\n![](img/3d310cc066dda6e2dfa67a650614076f_202_0.png)\n\
    \nThe Glade application (*Figure 2*) is composed of three distinct panels corresponding\
    \ to three functionalities of the application:\n\n- Left side panel: The hierarchical\
    \ tree representing the widgets present in the containers. Glade allows to add\
    \ widgets or containers (who is also a widget for GTK). The form (or screen) design\
    \ follows a hierarchical tree of widget. You can also select widget by name in\
    \ this view.\n- Center panel: The main view of the designer. This panel allows\
    \ to the developer to set the position, the size of the widget selected (it allows\
    \ also the widget selection) and the addition of new widget.\n- Right side panel:\
    \ This panel regroups four different features regarding the selected tab:\n  1.\
    \ The view of the properties of the selected widget (with the tab “General”).\n\
    \  2. The view used for the positioning of the widget and his docking, packing\
    \ in the GTK terminology (with the tab “Packing”).\n  3. The view used for common\
    \ properties of the current selected widget (with the tab “Common”).\n  4. The\
    \ view for the management of the signal sent on different event associated to\
    \ a widget (with the tab “Signals”).\n\nThese simple concepts are sufficient for\
    \ the design of an efficient GUI for your application with Glade.\n\nNote that,\
    \ the mastering of Glade is not immediate and should require a learning curve,\
    \ variable according to the developer.\n\n### 8.5.4.3 Defining Signals/Handler\
    \ within Glade\nOnce you have done the graphical design, Glade can be used for\
    \ making the link between the interface and your backend program (the C# code).\n\
    \nGTK follow an architecture of type signal/handler (a classic). With this logic,\
    \ Glade allow the developer to specify the type of signal sent by an event on\
    \ a specific widget (within the right panel). This implementation is done directly\
    \ from the Glade application by the specification of the appropriate method name\
    \ call on a specific signal as described (figure 3).\n\nYou will notice some signal\
    \ are marked “deprecated” in the Glade interface but you can use the deprecated\
    \ signals too (as in the shoot screen).\n\n![](img/3d310cc066dda6e2dfa67a650614076f_204_0.png)\n\
    \n(Figure 3)\n\nOnce you have defined the method’s name for the signal, the corresponding\
    \ method statement have to be added to the “.cs” file containing the backend logic\
    \ of your application (Figure 4).\n\n![](img/3d310cc066dda6e2dfa67a650614076f_205_0.png)\n\
    \nThe method implemented will be called each time the signal on the predefined\
    \ events is triggered. This method constitutes an easy and elegant way for the\
    \ implementation of the interactions between for-end and back-end of a GTK# /\
    \ .NET Core 3 application.\n\nYou have also the alternative to code the events\
    \ directly in the code without using the signal/handler in Glade (but it is less\
    \ readable) by using the name of the widget.\n\n## 8.5.5 GTK# samples applications\n\
    As you have already understood you can develop a .NET Core 3 GTK application in\
    \ two different ways:\n\n- The inline C# coded GUI implementation.\n- The XML\
    \ designed GUI (using Glade and Gtk.Builder).\n\nAlong this section we will provide\
    \ you a review of an example project for each of this method. Each of these methods\
    \ have advantages and drawbacks and should be choose according to the kind of\
    \ project you intend to develop.\n\n### 8.5.5.1 *Inline C# coded GUI sample*\n\
    This sample is a good starting point for the use of a GTK Toolkit (inline GUI\
    \ application development, it uses a large panel of widgets (control in the GTK\
    \ terminology).\n\nThis sample is furnished on the GTK# GitHub repos and appear\
    \ to be a reference for the development of such kind of application (there is\
    \ not so much documentation available on the GTK#). The application consists in\
    \ a demo program for which the only functionality is to use the wide variety of\
    \ widgets available in GTK#.\n\nHere is a screen shot of the rendering on the\
