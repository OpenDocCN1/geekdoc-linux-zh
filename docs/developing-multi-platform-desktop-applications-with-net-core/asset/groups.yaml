    上述安装方法的缺点在于有点笨重；你需要安装完整的 mingw 构建环境才能实现。相对于安装的目标（安装 GTK 运行时）而言，这似乎有点过大。这是因为没有人（GTK
    社区不像以前那么活跃）完成了……

