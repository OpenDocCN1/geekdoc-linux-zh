  - '[PAGE 122]


    # 7.1.2.4 Visualize test results


    The result of the tests can be seen in “Test Explorer” window, a green check mark
    indicating the test is valid and a red cross indicating the test has failed as
    shown below.


    ![](img/3d310cc066dda6e2dfa67a650614076f_122_0.png)


    MSTest offers a good solution for the implementation of Unit Testing in your project,
    as native inside Visual Studio the tool Integrates itself perfectly with the IDE
    of Microsoft. It is very well documented by the Microsoft team. References and
    tutorials can be found by following the link in reference.


    http://docs.microsoft.com/visualstudio/test


    # 7.1.3 Mock concept


    The issue for the definition of pertinent Unit Testing is the developer context:
    many objects are not yet been defined or the database is not yet available when
    the unit tests project is written. That could be an issue because the developer
    has to test the method with the larger panel of input data as possible, covering
    every case possible (in theory).'
  - '[PAGE 123]


    The work around is to use dummy object or database for imitating the real data
    or object in interaction with the function the developer needs to unit test.


    This concept is called mocking. Mocks isolate the method/function you want to
    test and validate if it is running on its own (independently of the other methods).
    Mocks can setup object with given values and set properties of this object.


    The developer has to hard code attended input values for the method and define
    a validation test with the expected result value (hard coded too).


    For .Net Core 3 development we recommend to use the Moq (4.x), this is the most
    popular and user-friendly mocking framework. Moq is a library that makes easy
    to develop and test mocks, moreover this library provide LINQ to Mocks feature
    allowing to dynamically request the mock objects for the validation. It supports
    mocking interface and class as well.


    ![](img/3d310cc066dda6e2dfa67a650614076f_123_0.png)


    +   - https://github.com/moq/moq4/

    +   - https://github.com/moq/moq4/wiki/Quickstart


    You can add the following package to the test project for a rapid integration
    of Moq.


    ![](img/3d310cc066dda6e2dfa67a650614076f_123_1.png)


    Moq


    The latest version of this package is implemented with .NET Standard 2.0, so it
    is usable within .NET Core 3 project (that is the beauty of the .NET Standard
    library format).'
  - "[PAGE 124]\n\nHere is a snippet for showing you how to use **Moq** in a simple\
    \ use/case.\n\n```\n```csharp\n[TestFixture]\npublic class FooTest:\n{\n    Foo\
    \ subject;\n    Mock myInterfaceMock;\n\n    [SetUp]\n    public void SetUp()\n\
    \    {\n        myInterfaceMock = new Mock();\n        subject = new Foo();\n\
    \    }\n\n    [Test]\n    public void DoWorkTest()\n    {\n        // Set up the\
    \ mock\n        myInterfaceMock.Setup(m =>\n            m.DoesSomething()).Returns(true);\n\
    \        myInterfaceMock.SetupGet(m =>\n            m.Name).Returns(\"Wolly\"\
    );\n\n        var result = subject.DoWork();\n\n        // Verify that DoesSomething\
    \ was called only\n        // once\n        myInterfaceMock.Verify(m =>\n    \
    \        m.DoesSomething(), Times.Once());\n\n        // Verify that DoesSomething\
    \ was never called\n        myInterfaceMock.Verify(m =>\n            m.DoesSomething(),\
    \ Times.Never());\n    }\n}```\n```"
  - '[PAGE 125]


    As you can see the use of Moq is really simple and can be made by rookie developer:


    +   - Declaration of the mock: Define the type of the object you want to mock.

    +   - Setup of the mock: Define value for the method (who is mocked).

    +   - Verify the mock: Verify if the mock has been called (or not).


    Moq has an API straightforward and does not require previous knowledge of mocking.


    There are also several other libraries allowing to mock objects during the unit
    testing phase, you have a deeper look on NSubstitute and FakeItEasy for having
    a wider view of the mocking libraries on the market (it is OpenSource). These
    two libraries offer equivalent functions than the Moq library described before
    (minus the LINQ capability).


    You can consult the wiki on their respective GitHub repos for more information.


    ![](img/3d310cc066dda6e2dfa67a650614076f_125_0.png)


    # 7.2    FUNCTIONAL TESTING


    The functional and integration testing consist in the test of each application
    features. In other word verify if the assembled application provides the expected
    results and features. This can be achieved by selecting specific sample of data
    or configurations sets.'
