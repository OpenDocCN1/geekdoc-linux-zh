    ## 1.2 Why develop multiplatform apps?


    That should be the first question you ask yourself when you want to start a project
    targeting multiple platforms for a desktop application. Indeed, targeting multiple
    OS is quite usual in the mobile development world, but it is not so obvious in
    the desktop development domain. And there is a simple reason for that, the “hegemony”
    of the Windows operating system on the desktop platform market. This dominance
    is illustrated by the graphic (figure 1); Windows represent 75% of the desktop
    market!


    ### OS Market in 2019


    ![](img/3d310cc066dda6e2dfa67a650614076f_18_0.png)


    This chart above (*figure 1*) illustrates only the market for internet-connected
    computers, but it seems quite obvious that Microsoft Windows broadly dominate.


    So why develop for other platforms?


    Because most professionals using these systems (macOS and Linux/Unix) are prone
    to actually buy software, especially software specialized in their job’s domains.


    macOS and Linux systems are mostly used in the professional environment, and in
    a professional environment, the software''s solution have to be bought (legally)
    for several reasons:


    - Benefit of a customer’s support adapted to the enterprise’s level of requirements.

    - Terms of licensing.

    - Commercial exploitation.


    And, indeed, many software domains of application are currently monopolized by
    these platforms:


    - macOS in the sectors of graphic design, audio editing, video editing, and in
    the artistic sector mostly.

    - Linux/Unix for architecture CAD, electronic conception, market trading, engineering
    software applications, industry dedicated software...


    This is in part due to the good stability of those systems (Linux, macOS). Besides,
    Linux and macOS have the reputation to have better performances (with the same
    hardware resources) than Windows. Aficionados of macOS and Linux argue also the
    fact that they can configure and tune the system much more easily than on Windows.


    So, if you plan to develop a software for a “niche” market, you can surely choose
    to do it by developing a multiplatform project as presented in this book. Thus,
    you will answer the issues for your usual customers but also open the potential
    market of your software to the other OS users.


    The fact that a commercial software is available for several OS will also guarantee
    to the user that the knowledge acquired on the application is not dependent of
    the system he uses (ex: Photoshop, Mathcad...). It is especially relevant when
    the use of the software application is very complex and requires a learning curve
    for being used properly. A user will be much more inclined to learn the use of
    a particular software if he knows that knowledge will be pertinent on several
    other platforms.


    There is another reason for choosing multiplatform application: the positive psychological
    impact on your customers, if you can provide a software solution whatever the
    system he uses. The multiplatform distribution of your software implies a good
    technical mastering in every step of the development process and indicates you
    are not dependent on one OS.


    Multiplatform development offers you (and your company) the possibility to not
    be captive of a particular OS, often subject to drastic changes, who can even
    challenge the validity of the application you are developing.


    You have to keep in mind that achieving such control over the software you develop
    comes with the price of a bigger effort during the development phase, especially
    if your project requires the use of native functions API (in the other cases .NET
    Core 3 provides you a solid and adaptive way for the implementation of the project).


