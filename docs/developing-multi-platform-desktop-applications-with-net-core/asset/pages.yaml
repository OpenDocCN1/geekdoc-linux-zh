    The multiplatform graphic library has to do the switch according to the OS the
    application is actually running on. In that context, you should have the version
    of the library for the system you work on.


    For developing a multiplatform application, you should have the library for each
    and every OS.


    Most of these libraries are, at the origin, developed for being used with C++,
    the development of a Wrapper is required.'
