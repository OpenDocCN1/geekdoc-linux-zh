  md: '# ## 6.6 CONFIGURATION FOR REMOTE DEBUGGING


    The remote debugging allows you to execute your code on a remote computer (with
    a different OS installed) it allows you to debug in real time without quitting
    you favorite IDE (Visual Studio on Windows) on the target platform.


    This technic is not really often used in the GUI desktop application development
    context because the platform specifics are shaded with the use of the cross-platform
    framework (in our case .NET Core 3).


    Nevertheless, it can be used during the development of a multi-platform .NET Standard
    library (for example a wrapper) used by the application and that is in this context
    that technic is reviewed.


    # ### A) In Visual Studio:


    For enabling the remote debugging feature in Visual-Studio you have to install
    the “Remote debugging tools for Visual Studio 2019” at the following address.
    Download and install also a ssh client for Windows (Putty), It will be used for
    testing the connection with the remote machine and eventually copy the files with
    the scp utility (it depends how you want to work).


    https://visualstudio.microsoft.com/downloads/#remote-tools-for-visual-studio-2019/


    http://www.putty.org


    ![](img/3d310cc066dda6e2dfa67a650614076f_110_0.png)'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# B) Install of the remote debugging tools for Visual Studio 2019 on Linux:


    ```

    $ curl -sSL https://aka.ms/getvstdbgsh | /bin/sh /dev/stdin -v latest -l ~/vstdbg

    ```


    This command line instruction should install the required Linux debugger engine
    on the platform.


    # C) Setup admin account for debugging on the Linux system (ubuntu):


    The creation of a specific user for the debugging is not mandatory but that provides
    the benefit of not interfering with other account’s permissions and groups (that
    way is much easier for managing users on the long run) but you can use the “root”
    account as well.


    ```

    ~$ Sudo adduser dbgVS

    ```


    You can also simply use the “root” account, if you do not have security constraints.


    You have to give this user the appropriate rights or/and add him in the appropriate
    group for having access (read/write) to the deployment folder (with also execute
    permission, in most of case the admin group is required).


    # D) Enable SSH and open port on the firewall (setup communication between computers):'
