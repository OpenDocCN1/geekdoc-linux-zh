  md: 'also participate to its development if you have to propose improvements or
    new features, you think, others users should be happy to have (with a GitHub contribution).


    This library is available for Windows, Linux and macOS (and several other OS to!).
    As an Opensource project you can find the sources freely available on the GitHub
    repository.


    The LibUI library development are still very active with a last release done the
