    You can find an example of MSTest Test project by checking the reference link
    below it will provide you a quick view on how to implement and use this type of
    test project in your own solution.


    https://github.com/netcore3/CodeBook/Chapter 7/1/UnitTestProject


    # 7.1.2.2 Define the validation of the test: *ASSERT object*


    You have now a Unit Testing project created and linked to your main application
    but you have to define what conditions will produce a passed test or a failed
    test.


    That is done by using the specific instruction `ASSERT`.'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'The **ASSERT** object validates a **result** object with the **expected** object.
    This validation validates the test (indeed).


    ASSERT is used for the validation of the test. This validation can be done by
    controlling the result value of the method you test. ASSERT is a class of the
    namespace **Microsoft.VisualStudio.TestTools.UnitTesting**.


    The test validation can be done by using the following methods (not an exhaustive
    list) of the ASSERT class:


    +   - **ASSERT.AreEqual()**: Validate the function tested, by checking the value
    of the result of this one (but you have to know the result value).

    +   - **ASSERT.AreNotEqual()**: Validate the function (test passed ok) if the
    result is not the value tested.

    +   - **ASSERT.Same()**: Validate the function if the resulted object and the
    expected object are of the same type.

    +   - **ASSERT.NotSame()**: Validate the function if the result object and the
    expected object are of different type.

    +   - **Assert.IsNotNull()**: Validate the test if the value checked is equal
    to Null.

    +   - **Assert.IsNotNull()**: Validate the test if the value checked is different
    from Null.


    There are several other ASSERT methods available (see [documentation in reference](#)
    for various test validation types but these ones are used in most of the cases
    encountered by developers (these are the most often, actually, used).'
  merge: -1
  img_proc: true
- pgno: 121
  md: '![](img/3d310cc066dda6e2dfa67a650614076f_121_0.png)


    http://docs.microsoft.com/en-us/dotnet/api/microsoft.visualstudio.testtools.unittesting.assert


    Be careful, the choice between all these types of validation will make your unit
    testing code relevant for the checking of the method or not. If you do not choose
    the adapted assertion for the validation, the test can be useless, or worse, not
    checking the code validity.


    When the ASSERT method is not validated an exception is thrown (ASSERT Exception)
    and the test is “failed”.


    # 7.1.2.3 *Execute unit tests*


    For Executing the Unit Testing projects, you will have to use the “Test Explorer”
    window as shown below:


    ![](img/3d310cc066dda6e2dfa67a650614076f_121_1.png)


    *(test Explorer)*


    You can run all the tests for the project at once by using the “Run All” menu
    or a specific test by selecting it with context menu “Run”'
  merge: -1
