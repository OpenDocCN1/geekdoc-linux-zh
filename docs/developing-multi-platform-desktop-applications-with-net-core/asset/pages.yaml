    # 11.3 RECOMMENDATIONS FOR THE PACKAGING AND THE DEPLOYMENT TOOLS OF YOUR APPLICATION


    The packaging is a crucial point for a smooth and harmonious deployment of your
    .NET Core 3 application. The packaging of your application will depend of:


    +   - The type of release you want to distribute: CLR, single EXE or machine native.

    +   - The type of dependencies your application relies on: GTK, QT, ... (and you
    have to include in your installer)

    +   - The platforms you want to target.

    +   - The context of the deployment: Is your software a commercial application?
    a shareware? or a tool who have to be deployed only on the computers of your company?

    +   - The features you want to include in the package (MultiLingual, autoUpdate,
    License protection, ...).'
  merge: -1
  img_proc: true
- pgno: 312
  md: 'This list is not exhaustive, as many projects have their own constraints.


    The complexity inherent to the choice of a setup tool for multiplatform application
    is a great deal for every developer (or team) and should not be disregard under
    the installer making task of the project.


    In many software development projects, especially in the multiplatform environment,
    this phase is under estimate and produce tools who do not flatter the application
    installed.


    We can recommend that the development team work as soon as possible in the sDlc
    (software development life cycle) for the installer program they plane to use
    for their application distribution and deployment.


    As it is separates projects, the installer coding (yes, the setup program is a
    project by itself) can be done simultaneously during the project coding phase.
    This way of doing allows to validate if the tool(s) chosen match the requirements
    for the installation of the software developed (setup of the dependencies, checking
    configuration, environment ...). In a professional context, a dedicated resource
    could be dedicated to this task in an exclusive manner.


    The use of freely available tools on each platform will benefit to application
    packaged under the native format. The user will have a complete solution adopting
    his familiar OS interface (for the installer and the application). But this solution
    introduces the use of several distinct development tools, one for each OS and
    multiply the installer project as much as the number of OS targeted.'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'In the other hand the use of a tool (InstallBuilder) for centralizing every
    project (one for each OS targeted) can provide a better coherence to the project
    itself and easing the management of this one. Nevertheless, this solution implies
    to invest a not negligible budget for this specific task.


    But most of all, do not underestimate the value of a proficient setup program,
    do not forget that program will be the user''s first contact with the application,
    that can induce a positive or a negative perception of the application.


    You have to be sure that the effect your installer solution will provide to the
    user will be in sync with the targeted experience you want to bring to the user
    with the use of your software.'
  merge: -1
  img_proc: true
- pgno: 314
  md: '# .NET Core 3.0


