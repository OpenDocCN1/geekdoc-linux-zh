    **Note:** The version of Electron.NET is really strict on the version of the .NET
    core you have to use, you have to find the correct combination of the Electron.NET
    version and .NET Core version for achieving to build and execute the program (it
    can be tricky in some cases).


    # ## 8.4 C++ NATIVE GUI APPLICATIONS


    There are several solutions for the implementation of a native UI in a .NET Core
    3 applications. The use of native GUI provides, to the user of each OS, the feeling
    that the application has been developed only for his own platform. By using standard
    forms and controls the user is directly familiar with the software interface (the
    application looks like native).


    The stable standardization of graphical primitives on the three systems (Linux,
    macOS, Windows) provides to the developer the opportunity to code a graphical
    interface who will work on every system. With the use of an adapted wrapper .NET
    Core 3 developer'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'can benefit from the already existing C++ libraries available for quite a while
    (reliability).


    Here is the architecture schema illustrating the use of native libraries for implementing
    the GUI in a .NET Core 3 application (Figure 1).


