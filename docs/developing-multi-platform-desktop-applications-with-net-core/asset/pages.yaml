  md: '![](img/3d310cc066dda6e2dfa67a650614076f_205_0.png)


    The method implemented will be called each time the signal on the predefined events
    is triggered. This method constitutes an easy and elegant way for the implementation
    of the interactions between for-end and back-end of a GTK# / .NET Core 3 application.


    You have also the alternative to code the events directly in the code without
    using the signal/handler in Glade (but it is less readable) by using the name
