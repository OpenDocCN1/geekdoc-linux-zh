    # 5.4  EXTERNAL SERVICES CONSUMPTION


    In many cases you will have to use external services (API, Web Services ...) in
    your application, and .NET Core has dedicated packages and functionalities for
    doing that.


    For simplification purpose we will consider the consumption of REST (Representational
    State Transfer) service because that’s the most common service type you will encountered
    in your developments. REST is a protocol based on the HTTP request protocol with
    the associated verbs:


    +   * **GET**: Used for data retrieval.

    +   * **POST**: Used for adding data from the client to the server

    +   * **PUT**: Used for updating the data on the server

    +   * **DELETE**: Used for deleting data on the server.


    As one of the key design goals for .NET core is to minimize the size of the .NET
    core installation, you will have to had the required dependency (package) to your
    project.


    ![](img/3d310cc066dda6e2dfa67a650614076f_80_0.png)


    Once you have added the required dependency you can start the process of using
    the REST service. You can achieve that throw three basic steps (this sample is
    the consultation of a service):'
  merge: -1
  img_proc: true
- pgno: 81
  md: '+   1.  Building the request.

    +   2.  Processing the request and retrieve data (results).

    +   3.  Processing the results.


    # 5.4.1  Building the Web request


    First you will have to specify the endpoint address, once it is done you will
    instantiate the HttpClient class doing the web request. This API support only
    async methods (useful when you work on the network). The task web request will
    be performed by an async method (see sample code for REST Client).


    # 5.4.2  Processing the request and retrieve data


    The call of the web request will be done with the await keyword (that''s an async
    method).


    # 5.4.3  Processing JSON result


    One you have retrieved the data from the REST service (HTTP status 200), you will
    have to convert the JSON result into exploitable C# object. For doing that you
    have to write a class for the type of the object matching the JSON result format
    you expect.


    > TIPS: In Visual studio use the menu Edit/Paste special/paste code as class for
    generating C# object from JSON data.'
  merge: -1
  img_proc: true
