    # 11.2.1  What is InstallBuilder


    InstallBuilder from Bitrock creates multiplatform installers and native setup
    packages. It allows you to deploy your application in any environment. It provides
    reliable and professional installation experience for every OS.


    This professional software provides original tools for the development of a solid
    multiplatform setup program for your application.


    InstallBuilder includes many useful features:


    +   - Use of setup scripting language

    +   - Setup debugger (with dedicate script language).

    +   - Auto-update integration.

    +   - Multilingual.

    +   - Multilanguage.

    +   - Optimizer.

