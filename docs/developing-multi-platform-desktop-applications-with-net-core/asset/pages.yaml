    # # Chapter 5. BASIC CODING TECHNIKS FOR C# APPLICATION


    Besides the development of the Graphic User Interface, a desktop application requires
    some minimal knowledge of coding techniques in general (used in desktop, Web,
    Backend ...).


    In this chapter we will provide you the essential practices for the coding of
    the several common functions required when you develop an application with .NET
    Core 3. This chapter aims to provide a basic knowledge of the latest coding techniques
    used in .NET Core.


    These basic guidelines will cover:'
  merge: -1
