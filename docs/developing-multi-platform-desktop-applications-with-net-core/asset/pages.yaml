- pgno: 9
  md: '# TARGET PUBLIC FOR THIS BOOK


    Even if this book tries to be understandable by a large public a minimal knowledge
    of the software development is required. This book target mainly 3 types of developer’s
    profile.


    The first profile is the C#.NET framework developer who want to update his knowledge
    to the latest Microsoft technology and framework allowing him to target Linux
    and macOS added to the classical Windows system he used to develop for. Regarding
    the current roadmap of the .NET Core, it should be the future development main
    framework for Microsoft (The classical .NET Framework will of course still be
    supported for the legacy developments).


    The second profile is the ASP.NET C# developer who wants to upgrade his knowledge
    for the desktop development environment and develop GUI application for the 3
    main platforms available on the market: Windows, Linux, macOS.


    The third profile who could be interested by the reading of this book is the C++
    developer (the syntax used by C# is quickly assimilate by C++ developers) who
    wants to add a new language for developing desktop application and increase their
    productivity with the use of the .NET Core 3 (it could be also for them the occasion
    to acquire the knowledge of a technology widely used on the web and cloud).


    You should have a minimal experience in the development of software solutions
    with Visual Studio C#. and a minimal knowledge of the targeted systems (Windows,
    Linux, macOS).'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# # How to READ THAT BOOK


    As this is usually the case for most of technical books, this one can be read
    from the beginning to the end. Read the entire book sequentially provide to the
    reader a better comprehension of each concept explains by the author.


    Nevertheless, this book has been written with the idea to allow the reader to
    jump start to the specific information relevant in his context. The book can be
    used as technical reference for the use of the technologies presented.


    If the reader has already a solid software development culture, it is possible
    for him to skip the chapters 3, 4, and 5 (even it is always useful to remember
    the principles presented) specifics to the C# GUI development project and jump
    to the part he is interested in.


    Less senior developer should read the book from the beginning for knowing the
    core concepts, methods and practices used for the coding of a professional graphical
    desktop application.'
  merge: -1
  img_proc: true
