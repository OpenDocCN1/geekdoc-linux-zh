    # 8.4.5 Review of LibUI based .NET Core 3 application


    In conclusion, LibUI furnish a lightweight and efficient solution for the development
    of an GUI desktop application it does not require any prerequisites install of
    dependencies and neither the install of dedicated tools. It is light and fast
    and the community is continuously working on it for the integration of improvements.


    LibUI should, in that context, seem to be the perfect tool to use for a .NET Core
    3 GUI application (at least the time, the different OS display API remain stable),
    nevertheless the lack of a visual designer for the conception of the GUI could
    discourage many developers to use it in a professional environment or for rapid
    development. The time required for mastering the wrapper for the design of the
    GUI should not be under estimate but once done the results achieved by this library
    can be quite impressive.


    # 8.5 GTK GUI APPLICATIONS


    GTK: "The Gimp Toolkit" is at the origin a Gnome initiative for the development
    on Linux of GUI applications. GTK is developed under an Opensource license (GNU).
    GTK is built on top of Glib (and others libraries), a well-tested and popular
    library.


    GTK does not provide a large amount of documentation and have specific prerequisites
    thus it is considered by most developer a tool'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'difficult to use. But we will see it can achieve flexible development and great
    result can be obtain using this tool whatever the platform targeted. Therefore,
    this kind of project can be done with a great development comfort inside your
    favorite development tool, Visual Studio 2019.


    # 8.5.1 Presentation of GTK


    GTK is underneath many well-known multiplatform commercial applications and is
    widely recognize by professional for the development of GUI projects, for example
    the Gnome desktop application for ubuntu has been developed with GTK.


    We can briefly enumerate the core strengths of GTK as:


    +   - Stability: GTK has been developed over decades.

    +   - Cool look and feel.

    +   - Theme support.

    +   - OO approach.

    +   - Localization.

    +   - Internationalization.

    +   - Good documentation (it is getting better)


    Keep in mind that GTK has been developed for the use and with the C, C++ languages
    and it inherits from this one its general architecture and and programming logic.
    So, this kind of developments is very well adapted for the C and C++ developers
    who want to use .NET Core 3 for achieving a ridiculous jump in productivity.'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'The GTK toolkit is native on Linux, Windows and macOS version are emulation,
    on those OS GTK toolkits require the installation of a list of libraries (not
    exhaustive):


    +   - Atk: Accessibility framework for GTK.

    +   - Cairo: Graphic library for vectors and image compositing.

    +   - Gdk: Contains the graphics primitives of the windows.

    +   - Gio: Helper functions for Gtk I/O operations.

    +   - Glib: Toolobox and helper functions for Gtk (one of the foundation of Gtk).

    +   - Gtk: Contains the widget architecture (for Windows and controls).

    +   - Pango: The front rendering library of GTK.


    ![](img/3d310cc066dda6e2dfa67a650614076f_183_0.png)


    The base programming logic for using GTK is the use of a hierarchical tree of
    widgets. In GTK the “widget” term is used for controls, windows and basically
    every elements of the GUI.'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'The main container widget is the window object, other widgets (controls like
    textbox, label, button, select, ...) can be added inside the main window (container).


    GTK is event driven (signal/handler). For example, a signal is sent to the application
    when you click a button, you have to define the signal and the handler yourself
    by coding.


    The documentation for developing GTK application is mainly written for the C,
    C++ languages, nevertheless it can be easily (if you have a minimum knowledge
    of C) adapted/ported for the use with .NET Core 3 C#.


    The GTK libraries will have to be install on the development machine but also
    alongside the application created (so you have to install it with your setup program).


    The GTK native dependencies is mandatory on the target machine, this is a prerequisite
    for a correct execution of the application (you have to include those dependencies
    in the setup program).


    Here are web pointers where you can find more information about the GTK framework.


