- pgno: 147
  md: '# 8.3.1 What is Electron?


    Electron is a relatively new framework (July 2013) for the development of desktop
    application with JavaScript. This framework has been developed and maintained
    on GitHub under an OpenSource model. The Electron API has been developed using
    C and C++ and exposed through a JavaScript wrapper.


    Electron is the combination of the Chromium rendering engine and the runtime of
    Node.js (both Google technologies). This combination allows to a web application
    to be run in a container on a desktop as a standard desktop application.


    Popular applications have been developed using this tool:


    +   - GitHub Desktop

    +   - Visual Studio Code

    +   - WhatsApp

    +   - Skype ...


    ![](img/3d310cc066dda6e2dfa67a650614076f_147_0.png)


    The main reason of the success of this framework can be explain by the fact that
    many web developers use this framework to leverage their competences in web development
    to the development of desktop applications. Despite the fact of an architectural
    lack of performances such applications are gaining in popularity (thanks to the
    now days computer power) among the web developer community.


    # 8.3.2 Presentation Electron.NET


    Electron.NET is a .NET Core wrapper around Electron, the first release goes back
    to October 2017. The wrapper provides to .NET'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'Core the ability to use the Electron API. In other words, Electron.NET allows
    to develop an Electron application from an ASP.NET Core web application.


    The current version of Electron.NET is 5.30.1 and is compatible with .NET Core
    3 (so the following versions should be too). This wrapper is Opensource and can
    be used and extended by the .NET Core developers.


    ![](img/3d310cc066dda6e2dfa67a650614076f_148_0.png)


    But there are some prerequisites for using Electron.NET. This framework requires
    you to install Node.JS (at least version 8.6) on your development platform. Even
    if Electron.NET avoid you to use JavaScript for the development of the Electron
    application, it requires Node.JS to be installed for the building and running
    process (that''s the Electron engine).


    For a good integration in .NET Core, Electron.Net is available in NuGet packages.
    To make the communication between the Electron runtime (Host) and the .NET Core
    web application you have to include the appropriate packages to your project.


    ```

    nuget

    ElectronNET.API

    ElectronNET.CLI

    ```


    ElectronNET.API is the layer the developer has to include to the web site for
    accessing the Electron features, this package does the bridge between the Electron
    host and the ASP.NET web application.'
