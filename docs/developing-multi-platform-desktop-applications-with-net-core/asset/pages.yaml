  md: '![](img/3d310cc066dda6e2dfa67a650614076f_115_0.png)


    # Chapter 7. TESTING YOUR PROGRAM


    Nowadays a serious development project integrates several types of test for each
    step of the development of a software solution. These tests are designed to guarantee
    that each piece of code of the application (objects, methods, ...) provide the
    expected results. These tests should also verify that all these elements work
    well together.


    We can pick out 3 types of tests the developer can use in a usual multiplatform
    project context.


    +   - The Unit tests guarantee the good functional behavior at the lowest level
    (Functions, methods) of the program.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '+   - The functional test guarantees the good integration of the basic elements
    in coherence with the result expected in the specification.

    +   - The performance test evaluates the celerity of the program to accomplish
    tasks (We will develop this part in the dedicated chapter about performances)


    The test area is a pretty complex one and many books have been written only on
    this subject, that''s why we will only provide you the basic concepts for achieving
    the essential tests for your application.


    # ### 7:1  UNIT TESTING


    As we use Visual Studio 2019 for developing the projects the obvious solution
    in matter of unit testing and code coverage is to use the integrated tools for
    doing that: MSTest.


    It is important to underline that it is not the only solution for building unit-test
    available in Visual Studio 2019, we can mention the historical and most popular
    frameworks for developing unit testing project like XUnit and NUnit. You will
    find more information on how to use these frameworks in the links furnished in
    reference below, you can also find built-in project templates in Visual Studio
    for using these testing frameworks.


    ![](img/3d310cc066dda6e2dfa67a650614076f_116_0.png)


    https://xunit.net/

    https://github.com/xunit/


    http://nunit.org

    http://sourceforge.net/project/nunit'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'There are several Visual Studio extensions for easing their use with a good
    integration inside our favorite IDE. Their respective project templates (XUnit
    and NUnit) are part of the default project templates furnished with Visual Studio
    2019. But in this chapter, we will review in details the use of **MSTest**, we
    will also illustrate its use with a simple example project.


    The principles exposed in this example test program could have been done by using
    any of the others tools quoted before, the architecture and the syntax of each
    of these tools are very similar.


    # 7.1.1  What to test?


    The Unit Testing projects aim to verify the validity of the results provided by
    the code written. These tests aim to verify if each bricks of the code are working
    as expected.


    Unit Testing is coded in the developer environment (sample data, other component
    results ...) and defined by the developer’s comprehension of the feature to develop.
    Usually you should consider to develop Unit testing for methods/functions with
    high complexity in logic or in calculation.


    Avoid to write unnecessary test for basic method, just for improving the code
    coverage percentage (that actually not matter much), and try to keep it clear
    and consistent with the project goals.


    # 7.1.2  MSTest (Visual Studio test framework)


    For the coding of those tests, the developer can use the built-in Visual Studio
    tool: MSTest. This tool has the advantages of being'
  merge: -1
