    # Chapter 1.

    INTRODUCTION


    # 1.1 GENERAL OVERVIEW


    This is a fantastic time for C# developers, as the Microsoft .NET Core 3 come
    out it has never been so easy to developpe applications for Windows, Linux and
    macOS based on the same C# source code.


    This book will help you to define witch kind of GUI will feet the best for your
    desktop application according to the technology you want to use and the OS you
    are targeting.


    The .NET Core (since the version 1.0 to the latest 2.2) has been widely acknowledged
    by the developer community for cross-'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'platform for web and server applications (back-end, API, Serverless ...). The
    third version will provide an integrated solution to the development of desktop
    apps too.


    .NET Core 3 brings an ideal solution for multiplatform application solution engineering,
    it allows the developers to centralize the code in a single project for every
    OS.


    Visual Studio 2019 can be used (with all the productivity benefits that’s bring)
    for the C# development of a solution working on Windows, Linux and macOS.


    We will provide a special introduction for the C# .NET framework (classic) developers
    to adapt quickly to the new .NET Core environment.


    A presentation of the best practices for this project’s type will also be provided
    allowing you to start a new project as fast as a single OS targeted project would
    be. These rapid presentations will help you to drive wisely your developments
    and avoid many pitfalls intrinsic to these project’s specifics.


    We will review the new features included in .NET Core 3 and why choose this framework
    among the other development suites available on the market like Node.js, Mono,
    ...Java.


    The essentials knowledge required for a professional software development project
    management will be study (plannification, sdlc, tests) as well as the general
    organization of your development environment.


    A rapid introduction of C# common coding techniques will be provided for solving
    quickly, usual requirements of a project:


    +   - database access.

    +   - Logging.'
  merge: -1
  img_proc: true
