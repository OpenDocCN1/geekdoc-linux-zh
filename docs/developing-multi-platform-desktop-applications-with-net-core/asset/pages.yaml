    Electron.NET bring the capabilities to the ASP.NET developers to target their
    application for being executed offline in a desktop environment, nevertheless
    there is some specifics Electron.NET knowledge to assimilate before doing so.
    Even if you are a senior ASP.NET web developer you will have to pass through a
