  md: "# ## 5.6.1 P/Invoke\n\nP/Invoke is an acronym for Platform Invocation Services,\
    \ this mechanism allows the developer to use external unmanaged dependencies in\
    \ his managed code (.NET Core).\n\nHere is a sample of the use of P/Invoke for\
    \ retrieving the current program id (pid):\n\n# ### For Linux (ubuntu):\n\n```\n\
    ```csharp\nUsing System.runtime.InteropServices;\n\nNamespace PInvokeSample\n\
    {\n    Public static class Program{\n        [DllImport(\"libc.so.6\")]\n    \
    \    Private static extern int getPid();\n        Public static void Main(string[]\
    \ args)\n        {\n            Int pid = getPid();\n            Console.WriteLine(pid);\n\
    \        }\n    }\n}\n```\n```\n\n# ### For Windows:\n\n```\n```csharp\nUsing\
    \ System.runtime.InteropServices;\n\nNamespace PInvokeSample\n{\n    Public static\
    \ class Program{\n        [DllImport(\"Kernel32.dll\")]\n        Private static\
    \ extern uint GetCurrentThreadId();\n\n        Public static void Main(string[]\
    \ args)\n        {\n            Int pid = GetCurrentThreadId();\n            Console.WriteLine(pid);\n\
    \        }\n    }\n}\n```\n```"
  merge: -1
  img_proc: true
