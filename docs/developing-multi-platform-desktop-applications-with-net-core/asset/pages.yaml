    # Chapter 12.  PERSPECTIVES FOR THE SOLUTIONS


    REVIEWED


    As we have seen along this book, the multiplatform development capabilities offered
    by the third version of the .NET Core are simply amazing. Even if the .NET Core
    3 does not provide any multiplatform desktop GUI API, the existing tools already
    available for the developers can respond today to each and every requirement for
    its project.'
  merge: -1
  img_proc: true
- pgno: 315
  md: 'The well thought architecture of this new framework brings enough flexibilities
    for addressing any kind of developer''s application needs.


    The multiplatform development area, since long time reserved to few highly technical
    people is now accessible to the C# developer community.


    The ability of .NET Core 3 to produce native executable (with CoreRT) for each
    platform (Windows, Linux, macOS) provides in the same time the capability to use
    executable compression and optimization tools, dedicated since a long time to
    a developer elite.


    The latest coding techniques reviewed previously along this book are the perfect
    illustration of the abundance of innovative solutions who can be used with .NET
    Core 3.


    Each technology presented have its own development history and origin who will
    predetermine, for part, its usage and maintainability in the future.


    **Terminal.GUI** could be used in many cases for providing a user-friendly experience
    in place of a console application (not really user friendly, especially for prime
    user). You can also consider to use it for the development of containerized application
    service (continuously running in a dedicated environment) where it can provide
    secure monitoring capabilities directly from the container where it is executed
    (in this case you should have access to the container).


    **Electron.NET** is a wrapper, around Electron. Electron is a Google promoted
    tool for expanding the field of application for his NodeJS development environment
    and community. It is not sure that Google will continue to maintain a tool for
    its use with the .NET'
  merge: -1
  img_proc: true
- pgno: 316
  md: 'Core. The current stability among each version of this product is neither very
    good. So, it would not be a surprise if the Electron.NET wrapper will not support
    the future releas es of the .NET Core. Indeed, the developers who choose this
    solution could have to make a choice between a complete NodeJS solution development
    (complete Electron) or the use of the .NET Core. But these are speculations, we
    are not here just yet.


    **LibUI** is a quite discreet (not so trendy) GUI toolkit (mostly known by the
    C++ users) but it provides great performances, little dependencies size and the
    community around this tool is still quite active. In another hand the implementation
    of the interface has to be done manually (by code), reserving the use of this
    tools to a category of developer only. The general quality of the wrapper could
    also be improved in future versions. The wrapper is using the .NET Standard, thus
    it will be useable in the future version of the .NET Core anyway.


    The **GTK toolkit** have a quit long development history and even if some periods
    of development are very quiet (stable) the GTK community keep it still alive and
    kicking. The number of deployed applications in production will guarantee (at
    least for some times) the continuity of the evolution of the product. Moreover,
    the GTK# wrapper is implemented using the .NET Standard so it will be useable
    by the future release of .NET Core.


    The **QT** framework have a large community and since 2014 a company for guarantee
    of its continuous development in the future.'
  merge: -1
  img_proc: true
- pgno: 317
  md: 'Even if QT is most often used by the C++ developer''s community (with the complete
    development environment QtCreator) the bindings, QML.NET provides to the .NET
    Core community a great way to integrate the QML language in the .NET Core developer
    toolbox. Here also, QML.NET has been developed using the NET Standard marking
    the maintainability in the future of the applications developed today.


    **Avalonia** appears to be in the continuity of the development of the Microsoft
    WPF. As its name suggest (Avalon is the code named used by Microsoft during the
    development of WPF), it integrates the current XAML principles from WPF for porting
    it to multiplatform (Windows, Linux, macOS, Android).


    Avalonia seems to be a quick choice for the WPF application developers, as the
    standard XAML used is similar to the WPF (but not compatible). Even if the development
    is not very active (it was in alpha version during several years), the professional
    quality of the releases, the availability of dedicated tools and the abundant
    documentation could suggest it could be much more widely used by the .NET developer''s
    community. Even if that is not the case in the future, the use of .NET Standard
    dependencies would guarantee the code maintainability in the long run of the application
    developed today.


    For resuming most of the tools presented in this book could provide a pertinent
    response for the development of multiplatform application according to the specific
    requirements and the contexts of these developments.'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'Another important factor, for the choice of a solution type, is also the current
    skills available for making the application (the human resources). It is, for
    sure, a determinant criterion who will do the choice by itself in many development
    teams.


    So, we have seen there are many parameters for choosing a tool rather than another
    one. You should consider also the life expectancy you intend for your software.
    If your application does not intend to be used on a long run, or being developed
    for technologies demos purpose you could consider more fancy and trending tools
    (but often unstable). If you plan to develop an application with several release
    along many years, you will have to keep in mind that the tools you choose will
    be always developed and supported (or at least maintainable) for the time frame
    you target.


    We hope that this book is a great source of inspiration for your .NET Core 3 development
    project. As it is an always evolving technology be assured we will release updated
    edition about the exciting subject of the .NET Core GUI desktop development.'
  merge: -1
  img_proc: true
