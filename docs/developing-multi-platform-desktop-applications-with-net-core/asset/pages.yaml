- pgno: 228
  md: '> (QML export Extension: Export options)


    With this form you can configure the kind of export you want to make (we will
    see in the sample section how each option is useful).


    The export is constraint by several rules regarding the layers and the folders
    of the Photoshop document:


    +   - Each folder of the Photoshop document (.psd file) will be exported as a
    single object (an image).

    +   - The hidden layers in a folder will not be exported at all.

    +   - The content of the folder is exported has it is displayed in Photoshop.

    +   - The text elements in a folder will be rendered (rasterize).

    +   - The order of the layering will be respected in the export process.

    +   - The folder hierarchy, the Photoshop folder in the .psd file, will not be
    keep in the export process.

    +   - You have to specify a name for each layer of your design.


    For getting a first-hand experience with the capacities and limitations of the
    export plug-in you should test it in several configurations and verify the .qml
    file produced with QT Design Studio (or a text editor according to the methodology
    you are following).


    # 8.6.5 Samples program GUI with QML.NET


    In this section about the use of QML.NET for the development of a multiplatform
    application with .NET Core 3 we will review three different types of example projects
    for illustrating several methods.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '+   - The first example is the example from the QML.NET author GitHub repository,
    it has been updated for using .NET Core 3 (and slightly modified).


    +   - The second example uses QT Design Studio designed GUI with the standard
    QT Quick Controls.


    +   - The third one uses a GUI designed and exported from Photoshop (using the
    QML Exporter script described previously).


    You have notice than we didn’t approach and review the process for the setup of
    the QT runtime (as for GTK development for example), this is because it is not
    required when you develop with QML.NET.


    Indeed, a dedicated instruction of the QML.NET wrapper check the presence of the
    QT runtime required and download/install it, if it is required, without any intervention
    of the user (that’s almost magical).


    So, the only requirement for the use of the QT runtime in your .NET Core 3 application
    is to include in your C# source code the following instruction.


    ```

    ```

    RuntimeManager.DiscoverOrDownloadSuitableQtRuntime();

    ```

    ```


    This seamless integration of the runtime in your .NET Core 3 program is just a
    bless for the developers compared to the old way, for the setup of the QT runtime
    required for the deployment of a QML based application.'
  merge: -1
  img_proc: true
