    \ change over time.\n+   3. Animation describe the evolution of an object (the\
    \ look) from the change of its properties.\n\nHere is a sample snippet of QML\
    \ implementation (a rectangle polygon who change color when it is clicked):\n\n\
    ```\n```\nRectangle {\n  width: 200\n  height:200\n  color: mouse.pressed ? \"\
