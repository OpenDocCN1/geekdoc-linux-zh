    # ## 1.2 WHY DEVELOP MULTIPLATFORM APPS?


    That should be the first question you ask to yourself when you want to start a
    project targeting multiple platforms for a desktop application. In deed targeting
    multiple OS is quite usual in the mobile development world but it is not so obvious
    in the desktop'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'development domain. And there is a simple reason for that, the “hegemony” of
    the Windows operating system on the desktop platform market. This dominance is
    illustrated by the graphic (figure 1), Windows represent 75% of the desktop market!


    # ## OS Market in 2019


    ![](img/3d310cc066dda6e2dfa67a650614076f_18_0.png)


    This chart above (*figure 1*) illustrates only the market for internet connected
    computer but it seems quite obvious Microsoft Windows broadly dominate.


    So why develop for others platforms?


    Because most professionals using these systems (macOS and Linux/Unix) are prone
    to actually buy software, especially software specialized in their job’s domains.'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'macOS and Linux systems are mostly used in the professional environment and
    in a professional environment the software''s solution have to be bought (legally)
    for several reason:


    +   - Benefit of a customer’s support adapted to the enterprise’s level of requirements.

    +   - Terms of licensing.

    +   - Commercial exploitation.


    And, indeed, many software’s domains of application are currently monopolized
    by these platforms:


    +   - macOS in the sectors of graphism, audio edition, video edition and in the
    artistic sector mostly.

    +   - Linux/Unix for architecture CAD, electronic conception, market trading,
    engineering software applications, industry dedicated software...


    This is in part due to the good stability of those systems (Linux, macOS). Besides
    Linux and macOS have the reputation to have better performances (with the same
    hardware resources) than Windows. Aficionados of macOS and Linux argue also the
    fact that they can configure and tune the system much more easily than on Windows.


    So, if you plan to develop a software for a “niche” market you can surely choose
    to do it by developing a multiplatform project as presented in this book. Thus,
    you will answer the issues for your usual customers but also open the potential
    market of your software to the others OS users.


    The fact that a commercial software is available for several OS, will also guarantee
    to the user that the knowledge acquired on the application is not dependent of
    the system he uses (ex: Photoshop, Mathcad ...). It is especially relevant when
    the use of the software'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'application is very complex and requires a learning curve for being used properly.
    A user will be much more incline to learn the use of a particular software if
    he knows that knowledge will be pertinent on several other platforms.


    There is another reason for choosing multiplatform application: the positive psychological
    impact on your customers, if you can provide a software solution whatever the
    system he uses. The multiplatform distribution of your software implies a good
    technical mastering in every step of the development process and indicate you
    are not dependent of one OS.


    Multiplatform development offers you (and your company) the possibility to not
    be captive of a particular OS often subject to drastic changes, who can even challenge
    the validity of the application you are developing.


    You have to keep in mind that achieving a such control over the software you develop
    come with the price of a bigger effort during the development phase especially
    if your project requires the use of native functions API (in the other cases .NET
    Core 3 provide you a solid and adaptative way for the implementation of the project).'
  merge: -1
  img_proc: true
- pgno: 21
  md: '![](img/3d310cc066dda6e2dfa67a650614076f_21_0.png)


    # # Chapter 2.  PRESENTATION OF .NET CORE 3


    .NET Core is a product born in 2015 (actually in beta since 2014).


    It has been defined from the classical .NET Framework. Many technical options
    chosen during the .NET framework evolution have define the need of new paradigms.


    We will see how these evolutions of the .NET framework took place and in which
    context the need of the new framework: .NET Core is appeared obvious.


    # ## 2.1 LITTLE HISTORIC OF THE MICROSOFT .NET FRAMEWORK


    The first .NET Framework was delivered in 2002 and was a proprietary system (a
    black-box) from Microsoft. It was a response'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'from the Redmond editor to the Java framework gaining in popularity at this
    time. As the Java framework, the .NET framework uses a virtual machine for the
    execution of the program.


    With the .NET framework the source language was not any more compiled to machine
    code but to a MSIL (Microsoft Intermediate Language), this language is compiled
    at runtime by the CLR (Common Language Runtime) to machine code, executed in the
    .NET framework virtual machine.


    This runtime translates in real time each portion of the code who has to be executed
    through native code for the platform.


    ![](img/3d310cc066dda6e2dfa67a650614076f_22_0.png)


    Added to this compilation capability the CLR provide many services for the code
    generated, here is a non-exhaustive list of these basic features provided:


    +   * Base Class Library (BCL).

    +   * Threading Model.

    +   * Type checker.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '+   • Exception manager.

    +   • Garbage Collector.

    +   • MSIL to Native code compiler.

    +   • Class Loader.


    Few times after Microsoft released many subsets of the .NET framework adapted
    to each field of application the company encountered: .NET Compact Framework,
    Silverlight, Windows Phone ...


    Each of these frameworks incorporates its own set of specific functionalities
    at the framework level and thus has become incompatible between them (for most
    of the code).


    Due to their specific evolutions (vertical) of their APIs the development of application
    targetting multiple type of platform was more and more costly in matter of time
    and resources due to the vertical evolutions of each framework.


    It can easily be explained by the fact that initially there was no will to share
    code between frameworks because these frameworks were dedicated to their specific
    field of applications and platform context.


    But nowadays the cross-platform development become a very common requirement for
    many projects. Many applications blur the lines between vertical .NET frameworks:
    often a web application use Windows dedicated functionality, desktop or phone
    application use web backends (Web Services or Web APIs) and so forth...


    That is in that context that .Net Core and NET Standard has been planned and defined
    as a new subset of the .NET Frameworks.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'Here is a little schema explaining the link between .NET framework and .NET
    Core.


    ![](img/3d310cc066dda6e2dfa67a650614076f_24_0.png)


    (source Microsoft)


    The .NET Standard can be use with the .NET framework and .NET Core, this library
    format provides an amazing portability whatever the framework you intend to use
    with it.


    # 2.2  WHY .NET CORE?


    The complexity implied by the use of multiple frameworks, each specialize in their
    own field, become the pitfall of most multifaceted platform development. As these
    kinds of development is turning into increasingly commonplace the need of a new
    framework appears.


