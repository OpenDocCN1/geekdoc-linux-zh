  md: '# 11.1.3 Generate an installation package for Ubuntu


    The distribution of an application on Linux is quite different than in the Windows
    (or macOS) environment, there are many types of solution who coexist for the packaging
    and the deployment of applications.


    We will review several of them on the ubuntu (Debian based) distribution.


    +   - **AppImage:** AppImage is a file format for the distribution of portable
    software on Linux platform. AppImage have many advantages compared to the classical
    way for the distribution of your application (because all the dependencies are
    included in a compact file).


    +   - **Debian package maker:** It is a GUI tool for the creation of a Debian
    package for your application, this tool is working perfectly and is easy to use
    with its graphical interface, but it has not been updated for 10 years (table).


    +   - **Nixstaller:** It is command line tool for helping the developer to build
    graphical installers in Linux.


    +   - **izPack (Java based):** Opensource project since2001, IsPack is Java based,
    It generates a single installer for the packaging and the distribution of your
    application. It uses a XML scripting language.


    +   - **Makeself:** It is a small shell script who generate a self-extractable
    compressed file from a directory (It can look as the minimal tool for the distribution
    of a software on the Linux platform).


    Regarding the large panel of solutions offered on the Linux platform for the building
    of a setup tool for your application we can recommend the use of AppImage.'
