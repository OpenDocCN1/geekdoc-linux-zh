  md: 'already available in Visual Studio and very well documented on the Microsoft
    support web site.


    ![](img/3d310cc066dda6e2dfa67a650614076f_118_0.png)


    In Visual Studio, the unit tests are implemented in a dedicated project, usually
    a test project is written matching a group of methods of the same class. A single
    test project is coded by the developer for each and every features or functionalities
    (regarding the criticalness).


    # 7.1.2.1 Creating a unit test project


    For creating a test project, you have to select “MSTest Test Project (.NET Core)”
    in the “New Project” window as show (*figure 1*).


    ![](img/3d310cc066dda6e2dfa67a650614076f_118_1.png)'
