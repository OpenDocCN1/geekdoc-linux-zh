  md: '# 10.4.1 Quick-start guide for UPX


    UPX is a multiplatform command line tool (but here is GUI version available for
    Windows and macOS).


    # A)  UPX setup


    UPX can be installed on every platform we study in the present book. Here is the
    standard binary installation process for each OS. The developer has also the possibility
    to perform an install of UPX from the source code (freely available).


    **On macOS:**


    The easiest way to install UPX on macOS is to use the Homebrew utilities previously
    presented. Here is the formula (it’s the Homebrew terminology) for installing
    the command line UPX tool.


    ```

