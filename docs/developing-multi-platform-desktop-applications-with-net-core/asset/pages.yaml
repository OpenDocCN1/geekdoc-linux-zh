- pgno: 245
  md: '# 8.7 AVALONIA GUI APPLICATIONS (XAML)


    Here is the last type of solution presented for the implementation of a GUI in
    a multiplatform desktop application with .NET Core3. This is one of the most famous
    and popular solution in the .NET developer''s communities as it is considered
    as the logical extension for .NET Core framework for the implementation of GUI.


    # 8.7.1 What is Avalonia?


    Avalonia is a framework for a multiplatform XAML based GUI. It has been created
    in 2015 by three independent developers: Dan Walmsley, Nikita Tsukanov and Steven
    Kirk.


    Avalonia was inspired by the Microsoft XML descriptive interface language WPF
    from which it also holds his name, "Avalon" was the codename used by Microsoft
    for WPF at an early stage of development.


    Avalonia offers XAML support but include also features from CSS for the styling
    of the interface. Avalonia uses a similar logic concept to other XAML framework
    such as WPF but it supports a wide range of OS like Windows, Linux, macOS, Android
    and iOS.


    After several years of alpha and beta version the Avalonia release have been edited
    the 5 April 2019 (the current version is 0.81 from July 2019 with some bug fixes).


    As an Opensource project the source code of the current development are freely
    accessible on GitHub, Avalonia is currently licensed under the MIT license.


    ![](img/3d310cc066dda6e2dfa67a650614076f_245_0.png)'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'The reference web site furnishes an abundant documentation about the API, and,
    tutorial and QuickStart for the development of an Avalonia application.


    ![](img/3d310cc066dda6e2dfa67a650614076f_246_0.png)


    In addition to the framework Avalonia offer a panel of tools for smooth application
    development such as a **Visual Studio 2019 Extension** who provide several templates
    and IDE extensions for the development of an Avalonia application.


    Several other useful Opensource tools can also be used as **“Avalonia Design Studio”**
    a dedicated Avalonia IDE, and the **“Avalonia Themes Designer”** who is used for
    the definition of new theming scheme.


    # 8.7.2 Avalonia Visual Studio Extension


    The Avalonia extension for Visual Studio 2019 is available on the Visual Studio
    marketplace (and also of course from inside Visual Studio with the menu Tools/Extension)
    you can find below the link where you can download the .vsix file (the extension
    installer type for Visual Studio).


