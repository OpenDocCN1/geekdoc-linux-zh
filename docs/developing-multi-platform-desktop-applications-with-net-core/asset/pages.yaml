    # 8.3.6 Pro/cons Electron.NET application


    The rendering of the application is very similar on every platform as it is a
    web GUI implementation. The uniformity of the GUI display among the platforms
    is one of the characteristics (and strong point) achieved by this type of solution.
    The capabilities to use enhanced JavaScript interface designs is another strong
    point but the performances of this type of desktop application are not always
    optimal.'
  merge: -1
  img_proc: true
