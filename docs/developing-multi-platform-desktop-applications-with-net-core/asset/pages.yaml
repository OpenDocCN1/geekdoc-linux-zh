- pgno: 60
  md: '+   - Application Configuration Storage.

    +   - Tracing and Logging (Standard, Serilog).

    +   - Data Access (Entity Core).

    +   - External Services Access (REST service).

    +   - Threading GUI.

    +   - Using unmanaged code dependencies (p/Invoke).


    These following practices will provide you a quick and easy answer to common issues
    you will reencounter in the development of your application. Relevant web references
    will allow you to get complementary information about a specific subject.


    # 5.1 APPLICATION CONFIGURATION


    In many cases you will have to use a configuration file where to store information
    like “connectionString” for the database access, user’s credentials, services
    endpoints... You do not want to store these data in database (because it does
    not change very often) but you cannot hard code it (because it might change).
    You have to use a configuration file.


    In the .NET framework it was handled by the famous “app.config” file (a XML formatted
    text file) but in .Net Core the things are little bit different.


    For .NET Core application you can still use INI, Config or other custom-made configuration
    provider but the standard way of storing configuration information is to use the
    “appSettings.json” file.'
  merge: -1
  img_proc: true
