  md: 'The Electron.NET.CLI is the command line tool used to build and package the
    Electron application, it is not used inside the code of the application (it is
    a tool). ElectronNET.CLI is mandatory for running your .NET Core Electron.NET
    application.


    You can install this tool with the command line described below (this is a toolset
    package for dotnet CLI). It can be installed as a global tool for dotnet CLI,
    extending it with the “electronize” command.


    ```

    ```

    C:\> dotnet tool install ElectronNET.CLI -g

    ```

    ```


