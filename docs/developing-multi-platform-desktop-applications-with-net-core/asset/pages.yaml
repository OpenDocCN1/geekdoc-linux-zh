    \ parent\n  }\n}\n```\n```\n\nQML.NET allow to .NET Core 3 developer to use this\
    \ language for the GUI's design of the application with the use of the QML wrapper:\
    \ QML.NET.\n\nThe implementation of a QT wrapper for .NET is not knew but with\
    \ this version: QML.NET reaches another level. It is now a company supported solution\
    \ who is available right now.\n\nQML.Net is Opensource and available for the developer\
    \ on a dedicated GitHub repository."
