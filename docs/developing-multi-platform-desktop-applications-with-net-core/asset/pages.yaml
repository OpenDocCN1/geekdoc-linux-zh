    # ### Chapter 4.  GUI DEVELOPMENT BEST PRACTICES: USER EXPERIENCE


    The development of a GUI application requires a minimal expertise in this very
    specific technical field. This chapter is mandatory if you do not have experience
    with the user interface design.


    Some GUI applications practices are common whatever the language, the platform
    or the machine you develop for. We will review some of the most useful of these
    best practices to make the conception and the design of your GUI. These practices
    will define a GUI more efficient and appealing for the user (that’s a point to
    not forget: the user).'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'This chapter will try to help you to provide the best user experience for your
    application.


    The design should consider some basic rules and design guidelines. It has to follow
    principles who define a successful graphic interface:


    +   - Consistency.

    +   - Readability (and scannability).

    +   - Logically structured.

    +   - Informality (keep it simple).


    Many basic steps in the conception of the several screens of your application
    can be define using user proof concepts:


    +   - One task for the user should match one screen.

    +   - Consistent navigation system between screen.

    +   - Doing a sketch of your forms (or screens) can help you to optimize presentation
    and interaction.


    The basic aspect of the design should not be missed neither:


    +   - Design and choice of the type of control.

    +   - Design of the visual layout (layout, panel, group ...).

    +   - Choice of the typography (the choice of an adapted font regarding the look
    and feel targeted).

    +   - Choice of the color''s schema (to be in sync with the purpose of the application
    and/or the user corporate environment).


    This aspect is really important for application using or displaying a large amount
    of data, in that context the sight of the user have to'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'be guided for avoiding to display the complexity of the information accessible.


    For more information about the general concept of the design of a graphical interface
    you can consult the standard ISO 13407 about "Human-Centered Design Process for
    Interactive Systems", this International standard describes the benefit of adopting
    a user centric approach for the conception of GUI.


    The following guidelines will assist you for the creation of a relevant GUI design
    but are not sufficient on their own.


    A primary point in the definition of the interface appearance is to consider also
    the sketching of the interface in collaboration with the users. This is a central
    point in the GUI final design, you should never forget.


    # 4.1 BEST PRACTICES FOR INTERFACE DEFINITION


    Present system interfaces (Microsoft, Apple or Gnome) incorporate already many
    pertinent (and well thought) features in their standard definition, but the choice
    you have to do between the features available have to be adapted to the specific
    purpose of your project.


    Here is a list of recommendations for creating the GUI of your application:


    +   - Focus on the user and the task to accomplish, define how people will use
    the GUI.

    +   - Consider the user''s view of the task, one task matching one screen design
    (in the best case). For complex task decompose it in many simple tasks in as much
    as'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'screen/form. Do not hesitate to use wizard type interface in those cases.


    +   Design the common case (not the specific), the common flow of work should
    be implemented as natural in your navigation system. Specific cases can be added
    once the main flow is considered (not before).


    +   Deliver information not just data, a large amount information to display can
    be confusing for the user, in those cases use computed and agglomerated (according
    to the angle of the user) data to present the information (consolidated data).


    +   Design for responsiveness, is the ability of the software to have a continuous
    interaction with the user.


    +   Set the expectation with design (highlight the common choice and use indicative
    color red, green)


    +   Anticipate mistakes and design relevant and useful error messages.


    +   Use tester (ideally user) for the validation of your design and for the validation
    of the sketch or the prototype design.


    +   Consider the user context where the application will be used.


    +   Interface consistency, but the constancy of an interface could be difficult
    to define and subjective to one person, you must define this with the users.


    +   Use the standard, as a user yourself you know how some functions should be
    display according to the standard.


    Added to these considerations you have to keep in mind during the design of your
    interface you should also integrate the four crucial points for defining your
    graphic interface:'
  merge: -1
  img_proc: true
- pgno: 48
  md: '**Scannability:** Users are quite lazy and doesn''t read each element of the
    screen carefully, so keep it easily scannable, provide graphic when it is possible
    and keep links, labels and informational text as short as possible.


    **Composition:** Organize your different screens or forms in a way to be consistent
    with the features the fulfill. Group the controls by functions, the logic used
    should be the standard field of expertise in the project domain. The terminology
    used are also the one used in the profession.


    **Be careful for the details:** The importance of details in the design of a proper
    GUI is not to overlook. The details make your interface great or shitty, hiring
    a professional for this phase could seems to be expensive but the general quality
    of the final product will be dramatically improved.


    **Preserve the form inertia:** Keep the form the same display as long it is used,
    and update only the data who have to be (with coloring update for marking thresholds
    or tendencies). Updating the form with different layout according to data can
    be disorienting for the user, try to keep the same screen/form format for the
    same task (whatever the value context). This will insure the consistency of your
    interface.


    # 4.2 GENERAL SCREEN DESIGN AND ERGONOMIC CONCEPTS


    A good screen design should consider function first (what the user will do with
    it), and presentation later.


    But with complex task or a large amount of information to display the design of
    the presentation have also the goal to direct user''s'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'attention toward the logic flow of the task or the important information (the
    one the user usually is looking for).


    In this section we will show you how to design a proper Graphic User Interface
    with the suitable tools (often graphical designer).


    The main components of a GUI are controls (also called widgets).


    The controls include:


    +   * label,

    +   * link,

    +   * textbox,

    +   * checkbox,

    +   * combo box,

    +   * button,

    +   * radio button,

    +   * slider,

    +   * menu, scrollbar

    +   * different type of layout,

    +   * panel

    +   * window

    +   * ...


    These controls are the basic elements you will have to use for the definition
    of your GUI.


    # 4.3 LAYOUT RECOMMENDATIONS


    Here is a brief resume of guidelines you have to keep in mind for designing the
    layout of your windows (screens or forms):


    +   * Size the controls to match their typical content.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '+   -   Align your controls (right) and try to size them identically (when
    it is not interfering with the first recommendation).

    +   -   Layout balance, the layout of the window has to use both side of the window
    (left and right), if a side has more controls than another, try to resize it (bigger)
    or move it on the other side by the use of a group control.

    +   -   Layout resize, if the window is resizable make sure the resize in a wider
    window will display more data, but take care also of the amount of data on the
    minimal size of the window.


    # 4.3.1 Type of controls to use


    Here some recommendations for choosing the type of control regarding the logical
    case it should solve:


    +   -   Do not confuse checkbox and radio button.

    +   -   Do not use command buttons as toggle.

    +   -   Do not use tabs as radio button.

    +   -   Do not use to many tabs.

    +   -   Do not use non-editable textfield (if that’s not editable that’s a label).

    +   -   Do not use textfield when you can use another control.

    +   -   Use default value for input fields and control.


    # 4.3.2 How to use controls


    Every standard control (or widget) available in your system should be used in
    its own standard way. Do not implement special behavior to a standard control
    (define a new one if the requirements are very specific) and try to stick to the
    standard use of each control.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'Here is quick guideline for the use of the most common controls (widgets) you
    will have to use in the conception of your windows:


    # Text (label):


    +   - Text of the GUI have to be minimal (the average user does not read it) anyway.

    +   - You have to use the user terminology and vocabulary (not the IT).

    +   - Do not capitalize the name of the controls you use: group, menu, toolbar,
    tooltips...


    # Buttons:


    +   - Do not use generic labels (except for the Cancel button), use specific terms
    related to the domain of your application.

    +   - If the button is used to respond to a question be sure the application will
    propose at least two options (not only one button for an interactive window).

    +   - Align all the buttons of the same functional level (left, right top or bottom
    of the layout or group to the one it belongs).

    +   - Align to the bottom of the window the command buttons.


    # Input:


    +   - Try to use a minimum of textfield control.

    +   - Choose wisely between listbox, option button and checkbox.

    +   - The size of the control has to be proportional to the data expected (size
    of the textfield box).


    # Menus:


    +   - Avoid multiple cascading menu as possible (use contextual menu instead,
    avoid too much intricacy).'
