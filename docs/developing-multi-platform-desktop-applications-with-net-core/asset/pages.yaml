    # 10.3 HIGH PERFORMANCES CODING TRICKS


    We have seen how to measure performances benchmark, and identifying computing
    bottlenecks in the application but a general knowledge of best performances coding
    practices is required for achieving better efficiency in your programs.


    Here is a list of professional tips to use during the coding phase for making
    your program running faster (from the start):


    +   A) String.substring replace with Span<T> (continuous memory).

    +   B) Use the appropriate type of list; IEnumerable rather than List.

    +   C) Use For loop instead of foreach (when it is possible).

    +   D) Use string.concat instead of string.Format.

    +   E) Use parallel programming when it is possible (use TPL).'
  merge: -1
  img_proc: true
- pgno: 298
  md: "+   - F) Use \"ref\" variable when it is frequently access. \n+   - G) Avoid\
    \ unnecessary boxing (ex: var j = (int)) and unboxing.\n+   - H) Avoid unnecessary\
    \ casting in general (especially parent to children).\n+   - I) Wrap synchronous\
    \ operations in async wrappers.\n+   - J) Avoid synchronous call at any level.\n\
    +   - K) Avoid task.wait or task.Result within you asynchronous programming.\n\
    +   - L) Perform I/O operation asynchronously.\n+   - M) Optimize data access,\
    \ and use cache when it's relevant.\n+   - N) Do not over use LINQ (use for loop\
    \ and condition instead).\n+   - O) Use pre-compiled LINQ request.\n+   - P) Minimize\
    \ exception (do not use exception for the usual program flow, throw only exception\
    \ for unattended condition)\n+   - Q) Minimize the number of P/Invoke calls (when\
    \ it is possible).\n+   - R) When using P/invoke method decorate imported function\
    \ with \"in\" and \"out\" attributes on parameters.\n\nThis is only a few assertions\
    \ (but relevant) you can keep in mind during your coding, if you use these recommendations\
    \ from the start of your project you can avoid many performances pitfalls during\
    \ the testing phase.\n\nYou should also remember that performances are not always\
    \ an issue (especially with today computer) and can be down view for small local\
    \ application (like a desktop app).\n\nThe performances enhancement in .NET Core\
    \ is a complex subject who would require a book by itself. If this subject has\
    \ a core importance for the development of your application consult the reference\
    \ links below we can provide you precious knowledge for the improvement of the\
    \ code’s performances."
