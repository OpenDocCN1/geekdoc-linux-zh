  md: '# ## 8.5.3  Presentation of GTK#


    Now that the GTK runtime is available on each platform, we can start to explain
    how we gone use it from our .NET Core 3 application. The GTK runtime have a .NET
    wrapper already developed and validated: GTK#.


    This toolkit became multiplatform in its latest release (with the adoption of
    the .NET Standard 2.0 of GTK#) and thus can be used for multiplatform GUI application
    development with .NET Core 3.


    GTK# is a Graphical User Interface toolkit for .NET, this tool allows to .NET
    developers the use of the GTK+ in .NET.


    GtkSharp (that’s the pronunciation) is a C# wrapper around GTK and its components,
    this is a fork of the previous gtk-sharp library who was targeting mono (and Gtk
    2.xx).


    The latest version of GTK# target the GTK version 3.22 and is available in the
    .NET Standard format. The source code is under Opensource license and available
    at the following links on GitHub.


    ![](img/3d310cc066dda6e2dfa67a650614076f_195_0.png)


    The GTK# library is also available through the NuGet package distribution system.
    Added to the base wrapper GTK#, a dedicated package provides new project template
    and project items for the development of a GTK# applications with the dotnet CLI
    tool (works with .NET Core 3).


    ![](img/3d310cc066dda6e2dfa67a650614076f_195_1.png)'
  merge: -1
  img_proc: true
- pgno: 196
