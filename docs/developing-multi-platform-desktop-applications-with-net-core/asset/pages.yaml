- pgno: 263
  md: '# **9.1** .NET Core CLI LOCAL TOOLS


    .NET Core application development, the dependencies are managed by NuGet packages
    providing a better way than in the classical .NET framework to keep your dependencies
    up to date.


    This architecture provides consistency and maintainability of the dependencies
    used for the application you develop. This is key foundation of the .NET Core
    framework; every specialized functionality has to be integrated via a specific
    NuGet package.


    You can resolve the update of the packages with the restore command of the dotnet
    CLI on the project.


    If you tried local tools in .NET Core 3.0, such as running “dotnet tool restore”
    or “dotnet tool install”, delete the local tools cache folder. Otherwise, local
    tools won’t work on any newer release. This folder is located at:


    **On macOS and Linux:**


    ```

    `@user>rm -r $HOME/.dotnet/toolResolverCache`

    ```


    **On Windows:**


    ```

    ```console

    C:\>rmdir  /s

    %USERPROFILE%\ .dotnet\toolResolverCache```

    ```


    Local tools rely on a manifest file named “dotnet-tools.json” in the current project
    directory (dotnet folder). This manifest file defines if the tool(s) is available.
    You can distribute the manifest file with your code to ensure that anyone who
    works with your code can restore and use the same tools.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# 9.2 .NET CORE CLI BUILDING OPTIONS


    “dotnet CLI” is the tool allowing the developer to manage .NET Core 3 source code
    and resources. Various commands enable to perform specific tasks (for example
    “dotnet run”, for executing the program). Each of these commands defines its own
    sets of arguments.


    Several dotnet commands can be used for the build of your project, you can use
    one or the other, according to the kind of result you expect. These commands are
    “build” for explicitly building your dotnet project and “publish” who packs the
    project (and its dependencies) in a folder ready for deployment.


    Here is a preview of the basic commands available by default with the dotnet CLI
    tool (most frequently used):


    +   - **new**: Create a new item, project or element based on the template specified.

    +   - **restore**: Restore the dependencies of a project.

    +   - **build**: Create the CLR image of a project.

    +   - **run**: Execute the project.

    +   - **publish**: Packs the CLR image of a project for the deployment.

    +   - **test**: Execute the unit tests.

    +   - **pack**: Packs the project into a NuGet package.

    +   - **clean**: Erase assemblies image of a project.

    +   - **help**: Display detailed documentation of the specified command.

    +   - **store**: Record the assembly in the runtime package store.


    All these commands are very interesting but we will consider the most often used.
    We will review deeper two of these commands: build and publish.'
  merge: -1
  img_proc: true
