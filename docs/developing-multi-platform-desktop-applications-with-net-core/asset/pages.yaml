    # 8.2.4 Pro/cons console GUI


    The console GUI is a fantastic choice for developing a GUI:


    +   - minimum of resources requirements.

    +   - Perfect multiplatform coherence (you can choose to have only one source
    code for all the platforms).

    +   - Straight forward development (only one project to develop your application).

    +   - Simplicity for the deployment and packaging.


    But this solution can not address every application:


    +   - Application with advanced charts.

    +   - Application with intensive graphics use (picture or video).

    +   - Advanced navigation system.

    +   - Accurate mouse support.


    In conclusion, the use of the console GUI can address basic GUI needs, for console
    tools but is not adapted to most advanced application''s requirements like: graphic
    display, chart, animation and advanced interactivity of the interface.


    For all these requirements you will have to choose another GUI solution presented
    subsequently.


    Here are some pointers for getting the complete online documentation and an example
    project used for checking the dependencies of a .NET Core 3 program (could be
    useful).'
