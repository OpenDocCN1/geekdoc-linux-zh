    file, the .NET Core 3 runtime (shared) have  to be installed on the target computer,
    this is the default  building configuration in .NET Core 3.


    +   • SCD: Single Contained Deployment: The application output  folder contains
    all the dependencies needed for running the  program (the .NET Core 3 runtime
    is included).


    +   • FDE: Framework Dependent Executable: The application  output is a .NET Core
    3 executable, but like FDD the shared  .NET Core 3 runtime is mandatory on the
    target machine


    +   • Native machine executable (specific file for each platform):  The application
    is a machine native executable who still  requires the dependency of the project
    but not the .NET  Core 3 runtime (it can be produce with CoreRT).


