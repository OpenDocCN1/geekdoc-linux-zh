    # 6.2 PHYSICAL COMPUTER VS VIRTUAL MACHINE


    The infrastructure where your development environment is deployed is a point to
    carefully consider. You can either use physical machine, virtual machine or a
    combination of both. But remember that the macOS system can be legally installed
    ONLY on an Apple computer.


    This have been said, there is unofficial solutions who can allow you to virtualize
    the macOS (with VMWare or Virtual Boxes), but the use of such tool is not recommended
    in a development environment because of the lack of support (but also because
    many sources for these solutions include rootkits and trojans).


    The use of physical machine for each environment brings many advantages. By developing
    on a dedicated machine, one for Linux, one for macOS and one for Windows you will
    use the machine on which the application will be finally deployed. In that way
    that is a'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'big advantage. Besides, you can use all the resources of the machine without
    any considerations for other external tasks.


    This way of doing is much more efficient in matter of performances but has less
    flexibility for the developer (as you have to carry as much as computer as you
    target OS).


    In another hand, the use of virtual machines offers also many advantages as flexibility,
    cheap cost, portability (all development can be contained on one computer) but
    implies many constraints: a virtual environment is never exactly the same as a
    real machine and can have, for specific application, a different behavior than
    the real OS (machine based).


    # 6.3  MULTIPLATFORM DEVELOPMENT ENVIRONMENT ARCHITECTURE


    Behind this technically obscure section title, we will expose the technical options
    taken for the development of a multipatform application for this book.


    As we have said previously, the option of this book is to develop the application
    with Visual Studio 2019 on the Windows 10 platform.


    We will actually do the coding of the programs with this environment; this pivotal
    Windows platform is the main development station where all the production of the
    code will be done. This Windows station will also be used for the building of
