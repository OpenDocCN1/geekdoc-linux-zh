- pgno: 17
  md: 'We will show you how to develop and implement the tests projects required for
    the development of your application. We will see how to implement the tests during
    the coding step of your project, and, how to improve performances of your application
    with the Visual Studio tools.


    Once the coding step of the project is achieved we will see how build, package
