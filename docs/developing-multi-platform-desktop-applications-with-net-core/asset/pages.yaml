    ![](img/3d310cc066dda6e2dfa67a650614076f_71_0.png)


    # 5.3.2  Architecture of the EF Core


    The EF Core provide to the developer an integrated layered solution who provide
    the possibility to abstract the database operations of the application, to use
    .NET objects.'
