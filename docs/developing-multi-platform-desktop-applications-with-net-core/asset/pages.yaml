  md: 'Glade takes care of the generation of the XML code who describes the UI and
    produces a XML file loadable through the GtkBuilder (with a GtkBuilder object).
    These XML files can be thereafter be used in your GTK# .NET Core 3 C# application
    (actually with any languages you use for developing with the GTK Toolkit).


