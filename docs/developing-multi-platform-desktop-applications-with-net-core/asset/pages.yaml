    As his predecessor, Entity Framework 6, EF Core integrate already many database
    providers as:


    +   SQL server

    +   MySQL

    +   SQLite

    +   Oracle

    +   PostgreSQL

    +   CosmosDB (NoSQL database from Microsoft)

    +   ... and many more providers continue to be added as the EF Core community
    is a most vibrant one.


