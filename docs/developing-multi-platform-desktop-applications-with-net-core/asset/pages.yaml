- pgno: 202
  md: '![](img/3d310cc066dda6e2dfa67a650614076f_202_0.png)


    The Glade application (*Figure 2*) is composed of three distinct panels corresponding
    to three functionalities of the application:


    +   * Left side panel: The hierarchical tree representing the widgets present
    in the containers. Glade allows to add widgets or containers (who is also a widget
    for GTK). The form (or screen) design follows a hierarchical tree of widget. You
    can also select widget by name in this view.

    +   * Center panel: The main view of the designer. This panel allows to the developer
    to set the position, the size of the widget selected (it allows also the widget
    selection) and the addition of new widget.

    +   * Right side panel: This panel regroups four different features regarding
    the selected tab:

    +     1. The view of the properties of the selected widget (with the tab “General”).'
  merge: -1
  img_proc: true
- pgno: 203
  md: '+   2. The view used for the positioning of the widget and his docking, packing
    in the GTK terminology (with the tab “Packing”).


    +   3. The view used for common properties of the current selected widget (with
    the tab “Common”).


    +   4. The view for the management of the signal sent on different event associated
    to a widget (with the tab “Signals”).


    These simple concepts are sufficient for the design of an efficient GUI for your
    application with Glade.


    Note that, the mastering of Glade is not immediate and should require a learning
    curve, variable according to the developer.


    # 8.5.4.3 Defining Signals/Handler within Glade


    Once you have done the graphical design, Glade can be used for making the link
    between the interface and your backend program (the C# code).


    GTK follow an architecture of type signal/handler (a classic). With this logic,
    Glade allow the developer to specify the type of signal sent by an event on a
    specific widget (within the right panel). This implementation is done directly
    from the Glade application by the specification of the appropriate method name
    call on a specific signal as described (figure 3).


    You will notice some signal are marked “deprecated” in the Glade interface but
    you can use the deprecated signals too (as in the shoot screen).'
  merge: -1
  img_proc: true
- pgno: 204
  md: '![](img/3d310cc066dda6e2dfa67a650614076f_204_0.png)


    (Figure 3)


    Once you have defined the method’s name for the signal, the corresponding method
    statement have to be added to the “.cs” file containing the backend logic of your
    application (Figure 4).'
