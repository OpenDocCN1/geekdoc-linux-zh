- pgno: 167
  md: 'The wrapper makes the encapsulation of the machine code library in .NET Core
    accessible object, the wrapper provides the marshalling, and P/invoke methods
    to the native library.


    Eventually you will need the compiled library for each platform (so extension
    for linux, **dylib** extension for macOS, **dll** extension for Windows) and a
    wrapper (possibly a package) to be able to use it with .NET Core 3 and make the
    calls on these (natives) libraries.


    There are many multiplatform GUI solutions based on C and C++ language (many OS
    are developed using this language), and these solutions are a good starting point
    for the implementation of your own GUI in NET Core 3, the following list enumerate
    the most popular, proofed and efficient of them:


    +   - LibUI

    +   - guilite

    +   - Cogui

    +   - Nuklear


    These frameworks have vocation to be used as bricks (the User Interface) for the
    development of C programs, so what is the point of presenting such tools in this
    book? Well the C libraries can easily be used from a .NET Core 3 application (see
    the chapter about the use of unmanaged dependencies) throw the use of a wrapper
    class


    The wrapper makes the integration of C libraries almost as easy as the use of
    a standard package. The integration of unmanaged libraries (C, C++) are now days
    well done by managed application (.NET).


    You can find more information about these libraries at the following reference
    links:'
  merge: -1
  img_proc: true
- pgno: 168
  md: '| https://github.com/dnlabss/liblul | https://github.com/idear4good/GuiLite
    | https://github.com/vurturn/nuklear | http://xpcda.net | http://cegui.org.uk
    |

    | --- | --- | --- | --- | --- |


    Of course, you can develop your own version of the .NET core wrapper for the most
    adaped library, but writing a wrapper for using these libraries is a large amount
    of work and often represent a project by itself.


    Nevertheless, some of these libraries (the most popular and largely used) have
    already a wrapper for NET Core developed. The library you have selected have already
    several versions of wrappers made by experienced individual or developer’s community
    who want to have access to a lightweight C graphic user interface framework (for
    performances as well) for their .NET Core developments.


    For the following examples we have chosen to use LibUi. First because LibUi is
    a recognized by professional efficient library and because several implementations
    of a wrapper for the use with .NET Core are already developed and available, avoiding
    the tedious and time-consuming task of the development of our own wrapper. Moreover,
    it uses native widgets for each platform we intend to develop for.


    # 8.4.1 Presentation of LibUI


    LibUI is a simple and portable GUI library in C that uses native GUI widget on
    each platform it supports. This is an Opensource and free to use framework developed
    by a vibrant community, you can'
