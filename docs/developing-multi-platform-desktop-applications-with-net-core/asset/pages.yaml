  md: "# 5.6.3 OS detection and identification:\n\nFor the developer, knowing on which\
    \ OS is running the application is mandatory when it comes to use native methods.\
    \ This can be achieved by using the specific .NET Core methods contained in the\
    \ **System.Runtime.InteropServices** library as described below.\n\n**Method:**\n\
    \nSystem.Runtime.InteropServices.RuntimeInformation.IsOSPlatform()\n\n**Arguments:**\n\
    \nOSPlatform.Windows, OSPlatform.OSX, OSPlatform.Linux\n\nPart of the complexity\
    \ of the multiplatform development, the native libraries does not have the same\
    \ name in every OS. The argument ofDllImportAttribut have to be a constant.\n\n\
    You can use the following work around: use a specific object (for each OS) for\
    \ the native method call, this interface will be instantiated to the relevant\
    \ type of object (with heritage from this interface) according to the system and\
    \ context where it is executed.\n\nHere is snippet for illustrating this concept.\n\
    \n```\ninterface ILibPid\n   {\n       Int GetPid();\n   }\n\nclass LibPidWin\
    \ : ILibPid\n   {\n       [DllImport(\"libc.so.6\")]\n       private static extern\
    \ int getpid();\n       public static int GetPid()\n       {\n           return\
    \ GetPid();\n       }\n   }\n```"
  merge: -1
  img_proc: true
