    有些人会说，领导者是那些在自己的领域变得重要的人。然而，事实是，领导者是那些让其他人变得重要的人。这只有通过赋予他人通过学习获得卓越才能实现。有些人能随时察觉到自己与同事之间的差距，并在能力范围内帮助填补这些差距。学习与教育是
    IT 领域中真正的组成部分。


    # 第 03 章


    ## A+ 认证成功的学习资源


    ProProfs.Com 学院为 A+ 认证考试提供免费资源。这项 CompTIA A+` 课程为您提供在线资源访问，帮助您收集所需的技能和能力，以迅速成长为
    A+ 认证人员。所有学习材料和资产对所有当前的认证申请者都是免费的。


    在 Phoenix TS，我们非常清楚如何通过 CompTIA A+` 考试。考虑到它是 IT 学习者中最时尚的认证之一，许多候选人都想找到最好的备考方法。


    尽管如此，在自学时，你必须具备良好的职业道德，并对成功有极大的动力。


    如果你想通过 CompTIA A+` 考试，无论你决定接受辅导、参加课程还是自学，都必须有良好的组织。然而，这取决于几个因素。以下是每种选择的详细说明：


    ### 参加导师引导的辅导类型


    选择此选项的优点之一是学习材料是最新的，课程重点突出，而且你可以学习如何应对答诉表。这也有助于学生与讲师之间的互动，增强学生的能力，并允许学生在不理解某些内容时提问。


    此外，你还可以与其他学生互动并扩大你的社交圈（并结识新伙伴！）。导师引导的 A+ 课程还提供各种类型的教学辅助。例如，许多导师会带来与当前计算机或笔记本电脑相应的历史仪器；作为一群，你肯定会将它们拆解并研究每一个部分是什么以及它的作用。


    这对于那些通过实践经验获取知识的候选人来说，这是一个优势。它还为所有候选人提供了一个获取知识的机会，而不必损坏自己的电脑。这种类型的课程可能会更贵。你可能需要考虑支付
    2000 美元左右参加此类认证的优质培训课程。


    ### 自学


    这并不容易，但是可行的。如果你在信息技术领域有一点经验，或者你是一个对这些话题熟悉的 PC 爱好者；无论考试是什么类型，你可能都希望自己为考试获取知识。如果你是完全的新手，你可以决定自己的动力有多大。如果你恰好是一个喜欢困难局面和挑战性阶段的进取者，你可以采取这种学习模式，然后衡量自己的表现如何。


    当你发现自己失去动力并偶尔需要推你一把时，报名导师引导的课程对你来说是最合适的。A+ 测试非常广泛，涵盖了大量的主题。这些主题的种类和深度可能会让人措手不及。在这种课程中，独立获取知识是很困难的。


    如果你不确定哪种方案最适合你，从自学开始吧。它是免费的，这意味着你没有任何损失。此外，如果材料开始堆积，不要放弃，而要努力通过考试。


    ### 关于 A+ 认证的其他提示


    CompTIA A+` 认证有几项评估；第一个是硬件的（`220-801`），另一个是软件的（`220-802`）。评估应该根据个人偏好以任何顺序或在不同的日期单独进行。如果你恰好参加了某些课程，Phoenix
    TS 的辅导团队建议你在知识还很新鲜时，按照积极的指导完成每项测试。


    当你自学时，也应该单独参加考试。在职业提升的岗位，自己参加认证和学习会有助于你。在参加考试之前，确保你阅读了每项测试涵盖的所有材料。有些问题你会发现很难将其归类为软件类或硬件类。在这种情况下，你将意识到自己还没有学到一切，并且可以求助于在线课程。


    # 第 04 章


    ## 通过当前 CompTIA A+ 考试的终极指南


    本章提到了几种通过 CompTIA A+ 考试的技巧。


    对于那些采取步骤以在计算机技术员（computer Technician）方向上提升其职业生涯并进阶的 CompTIA A+ 候选人来说，有两个主要目标：


    1. 获得在 IT 帮助台和计算机领域从事有效职业所需的才。

    2. 增强通过上一节提到的两项 CompTIA A+ 测试所需的才能和优势，以获得 A+ 认证。


    无论你在计算机技术员领域进展多远，在准备参加 CompTIA A+ 测试时做好准备总是是正确的。


    下面列出了一些建议，将帮助你为 CompTIA 的评估做好充分准备：


    ### 熟悉 CompTIA A+` 考试的目标


    在等待 CompTIA 考试时，充分准备是非常重要的。这只能通过尽可能多做练习题来实现。为了做到这一点，利用所有可用资源。由于这是为了准备，请确保应用了以下内容：


    *   需要注意的是，你不应该对任何问题死记硬背特定的答案。努力理解概念。死记硬背是坏习惯，因为在考场上，如果问题变了花，你会紧张并挂掉整个考试。

    *   阅读并理解每个问题，理解每个问题包含的内容，这将帮助你推导出最佳答案。

    *   尝试题目，但如果你觉得对答案有些不确定，你始终可以使用次要手段确认你的答案——使用互联网（如果可以可以使用 `Google`，如果可以可以使用 `Bing`，或使用
    `yahoo answers`）。

    *   在确定一个答案后，问自己为什么你认为它是针对当前问题的最佳回答。

    *   由于题目有选项，排除掉那些看起来更不切实际和不适用的选项（最不可能的回答），通过这样做你增加了选中正确答案的概率。

    *   由于这只是为了考试做准备，不要只关注答案本身，而是对解决方案周围的领域进行一些额外的阅读。在此过程中不要排除其他选项，对它们进行更深入的研究，因为整个重点是为了为你的考试获取更多知识以做好准备。

    *   随着你继续学习，识别你的薄弱环节并努力它们。在可能的情况下，使用记忆法、绘制表格和流程图来帮助记忆一些较困难的概念，例如：各种端口、速度等。

