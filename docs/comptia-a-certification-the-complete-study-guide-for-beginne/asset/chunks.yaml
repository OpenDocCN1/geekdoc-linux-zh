    - Be dedicated. Dedication is key because it gives you the drive to study. Studying
    can be a tough job.

    - Find yourself a mentor. Find someone who is experienced to take you through
    the challenging bits in the course. The mentor can be an expert in the field.
    Some of the information may not be clear or may be vaguely articulated in a tutorial.
    However, if you find someone to explain the more difficult concepts, you will
    be in a better position to comprehend.

    - If you can execute a task practically, don’t hesitate to perform it because
    it will be easier to memorize the concept.

    - Set up a study timetable. Study when your mind is fresher. Stick to the study
    plan and you are good to go.

    - Study from different sources. As they say, don’t put all your eggs in one basket.
    Don’t rely on one source. Sometimes the same information is brought out in a different
    way by a different author which makes more sense to you.

    - Jolt down new concepts as you learn, this will help in retention of the concepts.

    - Do as many `CompTIA A+` Practice Tests as possible. Don’t neglect a question,
    saying it’s too hard to be tested, these are the kind of questions that will catch
    you off guard. If you encounter a tough question, seek help. You can “Google”
    the concept or ask your friend who may have understood the concept being tested.
    Doing many practice questions helps you build your confidence and prepares you
    for the examination.


    ––––––––


    ![image](d2d_images/scene_break.png)


    ## Set up a CompTIA practice lab


    Practical experience repairing a computer is one of the best ways to get adequate
    preparation for the `CompTIA A+` exam. Setting up a test lab is easy and relatively
    affordable; even a simple laptop is enough. Practice the simple tasks and more
    importantly, the more complex tasks. This will help you solidify the `CompTIA
    A+` examination concepts.


    ### Option 1


    Gadgets, computer parts and tools one should have access to or should have:


    #### Gadgets

    - Access point

    - Desktop with the operating systems (`Windows`, `IOS`, `LINUX`)

    - Laptop with the operating systems (`Windows`, `IOS`, `LINUX`)

    - Monitors

    - Printers-laser and wireless

    - Projectors

    - Smart phone whether android, apple, windows

    - SOHO rooters and switch

    - Surge suppressors

    - UPS

    - VoIP phone


    #### Components

    - AC adapters

    - Adapters

    - Assorted connections

    - Cases

    - Cooling devices

    - CPUs

    - Hard drives

    - Maintenance kit

    - Mice/keyboards

    - Motherboards

    - Network cables/connectors

    - Network cards

    - Optical drives

    - Power supplies

    - RAM

    - Sound cards

    - Stand offs/screws

    - Video cards

    - Wireless NICs


    #### Tools

    - Cable stripper

    - Cable tester

    - Crimper

    - ESD strap

    - Multi meter

    - Post cards

    - Power supply tester

    - Punch-down tools

    - SATA to USB connectors

    - Screw drivers

    - Standard technician tool kit.

    - Thermal paste

    - WIFI analyzer

    - Wireless cutter


    #### Software haves

    - Antimalware

    - Antivirus software

    - Driver software

    - Operating system disks

    - Virtualization software


    ––––––––


    ![image](d2d_images/scene_break.png)


    ### Option 2


    Provided you have a sufficiently powerful personal computer (desktop or laptop),
    you can economize on building a practice lab by building a virtual lab:


    - `Oracle VM Virtual Box`: it is a free, open-source desktop virtualization software
    that runs on `Linux`, `Windows` and `OS X`.

    - `VyOS` virtual router: one can build a routed inter-network for free using the
    `VyOS` software router.

    - `Microsoft evaluation software`: one may download time-restricted, or otherwise
    fully unlocked, copies of Client operating systems and `Windows Server`.

    - `Linux`: `CompTIA` just needs us to know our way around the `bash` command shell
    which is present in if not all `Linux` and `UNIX` distributions.


    After building your virtual lab, you are 50% done. The other 50% is making sure
    you know how to perform all the tasks indicated on the exam objectives (be sure
    to download your `CompTIA` objectives).


    However, to develop your computer hardware skills, you''ll need to make some purchases:


    - Technician tools: you can buy some computer technician tools. Even the second
    hand tools will prove quite handy. (Later you may purchase new ones)

    - Used, Old, broken hardware: one can easily borrow from relatives, neighbors,
    friends, or colleagues. They will freely give you their used and old desktop,
    CPUs, laptop, rooters and mobile devices for your experimentation. However, if
    your relatives or friends do not have them lying around, you can acquire them
    from thrift shops or eBay.


    ––––––––


    ![image](d2d_images/scene_break.png)


    ## In the exam Room


    The exam will take place in an exam room. Acquainting yourself with the standard
    `CompTIA` exam room will ease the tension and put you in a position to perform
    better. First, be relaxed as you head into the exam room. If you feel uneasy,
    take a deep breath and rush to the washroom if you can to avoid rushing through
    the exam so as to go and relieve yourself in the rest room.


    ### Other important exam hacks


    - One must fill in their proper identification.

    - No materials are allowed in the exam room.

    - Once in, take the writing materials and write down the charts you have made.

    - Once you click login in your specified login area remember that the exam is
    time-based as follows:

    - -15 minutes to fill in your demographic information.

    - -90 minutes to take your exam. (90 questions)

    - Identify the key word or phrase in the question. This will help you understand
    what is needed to do the question.

    - Capitalized/bolded words in a question are there for a reason. These words are
    guidelines to the correct answer. Don’t ignore them but instead use them to eliminate
    the least probable answer. Some commonly capitalized words include `MOST`, `LEAST`,
    `MINIMUM`, `MAXIMUM`, `FIRST`. These words are VERY important.

    - Know the jargons and vocabulary. Make sure you understand the vocabularies in
    question. You can only achieve this if you take time to study.

    - Make sure to review `CompTIA’s A+ Essentials Objective 2.2`.

    - Make very logical deductions. Use logic to eliminate choices that you are unsure
    of.

    - Identify the wrong answer. This is a good thing as it will help with the elimination
    process.

    - Anticipate the answer/answers as you read the question. This can only be possible
    if conducted a proper study.

    - Questions that appear later may help with earlier questions. Thus once you encounter
    a challenging question you may mark it and leave it for later. You may find clues
    in later questions or your mind will have opened up in readiness for the tough
    question.

    - Please don’t leave any answers blank. Try as much as possible to attempt all
    the questions. If a certain questions becomes too bothersome, you can guess. However,
    this is after you’ve tried elimination and gone through all the questions.

    - Do not change the first answer you settled for unless you are triple sure it
    is wrong. Use your knowledge and test taking skills to answer all the questions.
    Remember your first answer is usually correct.


    ––––––––


    ![image](d2d_images/scene_break.png)


    ## The type of questions one may encounter


    There are three types of questions one will encounter:


    1. `Application questions` – these test on application of concepts learnt in situations
    that need a specific response.

    2. `Multi-choice single answer questions` – these are questions that require you
    to choose one correct answer from a bunch of choices.

    3. `Multi-choice multiple answer` – these are questions that require you to supply
    more than one correct answer among the choices. In case of such a question, if
    one chooses just one answer, the system will prompt the user to supply more than
    one answer.


    In these questions, one is free to mark and leave a question for later in case
    the question is difficult. You may attempt these marked questions once you are
    done with the easier questions before time elapses.

