- fmt: "\nNote that when you are given a scenario, make sure you answer relates to\
    \ the scenario.\n\nFor example:\n\nOsorio and sons’ company were experiencing\
    \ numerous computer breakdowns. They are located in a dusty and hot area. What\
    \ could be the likely causes of their computer breakdowns?\n\n1. Poor cooling\
    \ systems.\n2. Moisture on the computer parts\n3. Dust clogs on the CPU vents\n\
    4. Poor electrical connections\n\nThese could all be probable causes for the computer\
    \ breakdowns but considering the question we can only have two possible answers\
    \ A and C.\n\nB and D are far-fetched hence eliminated with ease. Therefore, through\
    \ eliminating the answers that are off, we end up with a 50% chance of finding\
    \ the correct answer. As it is a multi-answer question, A and C will suit perfectly.\n\
    \n––––––––\n\n![image](d2d_images/scene_break.png)\n\n## Keywords you will encounter\
    \ at an exam\n\n- `Configure`: this is to arrange something in that it is ready\
    \ for operation.\n    - To set up.\n- `Explain`: to make plain; to illustrate\
    \ meaning.\n- `Compare`: to assess the differences and similarities between two\
    \ or more objects in question.\n- `Contrast`: a difference between two people,\
    \ objects and concepts.\n- `Identify`: being able to assess the difference in\
    \ one object from the rest and picking it out.\n- `Troubleshoot`: to diagnose\
    \ or analyze a problem to the point of identifying a suitable solution.\n- `Features`:\
    \ make-up, structure, shape, bodily proportions.\n- `Purpose`: the result that\
    \ is desired of an object.\n- `Properties`: the features of an object.\n- `Install`:\
    \ to set up, connect something for use.\n- `PC`: initials used for a personal\
    \ computer.\n\n––––––––\n\n![image](d2d_images/scene_break.png)\n\n## Become acquainted\
    \ with the objectives of CompTIA A+ examination\n\nThe first thing that you do\
    \ to ready earlier for the exam than during test day is to go through the CompTIA\
    \ examination objectives.\n\nRead by means of the reputable exam targets as outlined\
    \ via CompTIA. They can be downloaded from the CompTIA certifications site.\n\n\
    ### Why is it important to read and understand the objectives of CompTIA exam?\n\
    \n- They give a sneak peak of what you are going to encounter in the exam room.\n\
    - Helps you identify the areas you need to study.\n- Helps you manage your time\
    \ as you know how many areas need to be covered thus a schedule plan can be created.\n\
    - It provides guides on the proper materials to use as you study for the exam.\n\
    - Acts as a checklist as you await your exam.\n\nThis record is greater than a\
    \ proof of the exam necessities; it can be used to grasp some guides as you go\
    \ by by means of the computer Technician application. Use it as the ideal checklist\
    \ in your practices.\n\n––––––––\n\n![image](d2d_images/scene_break.png)\n\n##\
    \ Objectives\n\nAs you study for the CompTIA exam, it is important to consider\
    \ the exam objectives as the questions will directly relate to the objectives.\n\
    \n### Does the 900 Series have New Content?\n\nDon’t worry, for the greater part,\
    \ 900 series A+ remains the same as the older version.\n\n- `220-901`\n- `802.11ac\
    \ WiFi`\n- Command line tools\n- Mobile devices (Windows phone is new)\n- More\
    \ focus is on virtual printers\n- No AGP: You may notice it on past study materials\n\
    - No CRTs\n- No RAMBUS RAM\n- No PCMCIA\n- UEFI BIOS is new\n- `220-902` Topics\n\
    - Client side virtualization\n- Command line utilities for Linux and Mac\n- Linux\
    \ and Mac\n- No Windows XP\n- Operating system security features\n- Operational\
    \ procedures (safety, MSDS sheets, etc.)\n- `Robocopy` command line tool\n- Windows\
    \ 8\n- Windows Powershell\n\nIf you get worried at the sight of the Linux and\
    \ Mac topics, don’t as these topics focus more on basic functionality. The exam\
    \ largely focuses on Windows. Though it may do you any harm to do some intensive\
    \ study on LINUX and Mac. Command line tools are important. A good number of these\
    \ commands interchange with one another. Though questions on Linux/Mac commands\
    \ are rare, don’t rule them out. Keep in mind that the questions are random and\
    \ they usually vary. Practice with Windows and LINUX command lines before you\
    \ the exam. You never know, one question could lead to a pass or fail.\n\nIt is\
    \ therefore very important to go through the objectives as they are pointers to\
    \ what to expect during the exam. Make sure you download the objectives book by\
    \ CompTIA. It is available in pdf form. Use it as a checklist during your study.\n\
    \n### CompTIA A+ 220 901\n\n- Hardware accounts for 34% of the questions\n- Troubleshooting\
    \ and hardware makes up 28% of the questions\n- Networking is 21% of the questions\n\
    - Mobile devices are 7% of the questions\n\nBelow is a summary of CompTIA A^+\
    \ 220 901 exam objectives though not exhaustive:\n\n- All the types of RAM (random\
    \ access memory).\n- BIOS/UEFI.\n- Characteristics of mobile devices.\n- Components\
    \ of the motherboard, its properties and uses.\n- Cover the encryption types.\n\
    - Functions of components within the display of the laptop.\n- How to conduct\
    \ RAM, motherboard, CPU and power troubleshoots.\n- How to install and configure\
    \ storage devices, peripheral devices (mouse, keyboard, joysticks etc.)\n- How\
    \ to install laptop hardware and components.\n- How to install wired and wireless\
    \ rooters.\n- Identify the purposes of TCP/UDP ports, protocols.\n- Identifying\
    \ problems of the hard drives, RAID arrays, video projector and display issues,\
    \ wired and wireless networks and printer malfunction.\n- Mobile devices ports\
    \ and mobile accessories.\n- Network architecture devices; features and functions.\n\
    - Networking tools.\n- PC connector types and cables involved in making connections.\n\
    - Personal computer connection interface, characteristics and purposes.\n- Print\
    \ technologies and imaging process.\n- Printer maintenance.\n- RAID types and\
    \ where most applicable.\n- SOHO multi-function devices.\n- The properties of\
    \ IP/TCP.\n- Types of display devices and features.\n- Types of network cables\
    \ and connectors and their characteristics.\n- Types of networks and internet\
    \ connection types.\n- WIFI networking standards.\n\n### CompTIA A+ 220 902\n\n\
    - Windows Operating System make up 29%\n- Software troubleshooting is 24%\n- Security\
    \ is usually 22% of the questions\n- Operational troubleshooting: 13%\n- Other\
    \ Operating Systems: 12%\n\nBelow is a summary of CompTIA A^+ 220 902 exam objectives\
    \ though not exhaustive:\n\n- Application security issues.\n- Cloud concept.\n\
    - Common security vulnerabilities and threats (physical threats and digital threats.)\n\
    - Features and requirements for installing the windows operating systems. (Windows\
    \ 7, Windows 8, Windows 10, Windows vista etc.)\n- Features of mobile soft wares.\n\
    - Functionality and the features of Mac OS and LINUX\n- Given various scenarios\
    \ explain the troubleshooting theory.\n- How to effectively prevent the security\
    \ threats and vulnerabilities.\n- How to Secure SOHO wired and wireless networks.\n\
    - How to troubleshoot PC Operating systems problems.\n- Illustrate the process\
    \ of addressing prohibited activity/content.\n- Install and configuring windows\
    \ networking.\n- Methods and data related to mobile device sync.\n- Methods of\
    \ data destruction and disposal.\n- Microsoft command line tools.\n- Network connectivity\
    \ and email.\n- Preventive maintenance measures and procedures.\n- Proper communication\
    \ techniques and professionalism.\n- Purposes and properties of services provided\
    \ by network hosts.\n- Safety procedures followed when using computer components,\
    \ repairing them or disposing of components.\n- Securing mobile devices.\n- Set\
    \ up and use of client-side virtualization.\n- Understand the concepts of licensing,\
    \ privacy and policy.\n- Using windows control panel utilities.\n- Windows OS\
    \ security settings.\n\nAcronyms\n"
