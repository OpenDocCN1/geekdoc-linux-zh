    # Chapter 04


    # The ultimate guide to pass the Current Comp TIA A+ Exam


    ![image](d2d_images/chapter_title_below.png)


    There are several tips to pass the CompTIA A+ exam mentioned in this chapter.


    There are two main goals for the candidates of CompTIA A+ who take steps to enhance
    their career in computer Technician directions:


    1.  Gain the talents needed for an effective career as an IT help authentic and
    in the computer field.


    2.  Enhance the talents and advantage needed to pass the two CompTIA A+ tests
    that are mentioned in the previous section to earn the A+ Certification.


    Irrespective of how far along you might be in the computer Technician field, it
    would always be just right to prepare for the time when you are going to take
    the CompTIA A+ tests.


    Listed below are a couple of recommendations that will help you be all set up
    for the assessments of CompTIA:


    ––––––––


    ![image](d2d_images/scene_break.png)


    Become acquainted with the objectives of Comp TIA A+ examination


    As one awaits the CompTIA examination, it is important to be adequately prepared.
    This can only be achieved by going through as many practice questions as one can.
    To do that, use all available resources. As this is for preparation purposes,
    ensure that you apply the following:


    *   It is important to note that you should not cram a specific answer to any
    question. Strive to understand the concept. Cramming is bad practice as in the
    exam room, if the question is twisted, you will get jittery and flunk the whole
    exam.


    *   Read and understand each question, understand what each question entails as
    this will help you derive the best answer.


    *   Attempt the questions but if you feel like you are a bit uncertain about your
    answers, you can always use secondary means to affirm your answers – use the internet
    (Google if you may, Bing if you can, or use yahoo answers)


    *   After you have settled on an answer, ask yourself why you think it is the
    best response paying attention to the question at hand.


    *   As the question has choices, eliminate those that look more far-fetched and
    inapplicable (least probable response) and by doing so you will have raised the
    probability of landing on the correct answer.


    *   As this is just preparation for the exam, don’t just focus on the answer itself
    but do some extra reading on the areas around your solution. Don’t exclude the
    other choices in this, do greater research on them because the whole point is
    to gain more knowledge in readiness for your exam.


    *   As you continue studying, identify your weak areas and work on them. Where
    possible, use mnemonics, draw tables and flow charts to aid in memorizing some
    of the harder concepts e.g. various ports, speeds etc.'
