    CASP 出于 2011 年 9 月。它被称为“中立认证”。根据 Comp TIA 的规定，`CASP` 遵循 `Security+` 认证。该认证已于 2013
    年 12 月被 `ANSI`（美国国家标准）和 `ISO`（国际标准化组织）正式认可。


    ![image](img/scene_break.png)


    ## Server+


    Server+ 是 Comp TIA 的一项认证，它专门关注服务器指定的硬件和运行程序，并认证对应 `SCSI`、`RAID` 和多 CPU 领域的技术知识，以及处理服务器问题的能力，包括灾难恢复。它于
    2001 年推出，并在 2009 年和 2005 年进行过一些更新。


    该认证考试最显著的八个领域是：常规服务器硬件能力、升级、主动维护、安装、缺陷选择、配置、灾难恢复和环境故障排除。


    ![image](img/scene_break.png)


    ## CTT+


    CTT+ 认证是一种用于培训各行业专员的中立认证。该认证证明了对主要培训师专业能力的精通，包括在课堂氛围下的指导、演示、促进、沟通和分析。CTT+ 考试由两个部分组成：基于视频的考试
    (VBT) 和基于电脑的考试 (CBT)。


    ![image](img/scene_break.png)


    ## DCIA+


    CDIA+ 授予具备文件映像、记录管理和制造商内容材料管理能力的人。它确认了个人拥有存储、检索和扫描文档数字模型所必需的人才，目前是该领域最广知的认证。在通用名称中，“Architect”（架构师）拼写为
    `ArchiTech` 以体现该词额外的命名性质。


    ![image](img/scene_break.png)


    ## Linux+


    Linux+ 是关于著名操作系统能力最著名的认证，涵盖了从其安装和使用程序，到相关开源许可和应用程序的基础知识。此考试面向专家技术人士以及具有约十二个月 Linux
    经验的候选人。


    考试分为 Linux 潜力的许多领域：设置、配置、管理、文档、安全和硬件。测试是一项以电脑为中心的考试，包含许多题目，某些题目可能有几个备选项，某些题目通过
    4 个解决方案被采用，其中至少有一个是正确的。


    考试涵盖的长期建立学科内容包括设置策略、包管理、引导程序配置、通过命令行导航目录，以及通过使用 `bash` shell、保护问题、社区管理、文件挂载技术以及为
    Linux 服务器能够运行的额外自定义功能配置文件。


    对于 IT 行业，Comp TIA 协会提供专业证书。该协会通过 `Pearson VUE` 测试中心管理其考试场次。此外，它还提供社区会员。自 2008
    年以来，有许多当前的认证获得了美国标准协会的认可，并自 2011 年以来获得了 `CASP` 的认可。在 2010 年获得认证后，规定是 2010 年以后的任何认证都将在三年后过期。


