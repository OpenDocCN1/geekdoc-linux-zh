  trans: '

    在 IT 领域，有大量的缩写。想要一次性掌握所有它们可能非常困难。它们非常重要，因为可能会在考试中用到。在 `CompTIA` 考试目标中，这些缩写有清晰的概述，但理解和记忆它们可能具有挑战性。然而，有一种更容易的方法理解和记忆它们。你会发现其中一些缩写是常见的，例如
    `AC`——交流电。对于那些不常见的缩写，它们的首字母就是该缩写的组成字母，例如 `IMEI`——国际移动设备识别码。如果你选择每天记忆 10 个，多写几次并大声读出来，就可以轻松掌握它们。事实上，它们是按字母顺序编写的，因此你可以在脑海中有序地捕捉它们。


    ––––––––


    ![image](img/scene_break.png)


    # 了解计算机硬件和软件


    ## 既然可以自己组装，为什么要买台式电脑？


    `CompTIA` 认证考试将测试你对计算机硬件的知识。如果你花时间组装一台电脑，就能轻松理解计算机组件。由于你投入了身体和精力，将获益匪浅。


    这比仅仅通过看书或看视频所获得的知识好得多。由于你获得了第一手实践，这将增强你的信心。


    了解 `pc` 内部组件的外观以及它们相互连接的方式至关重要。尝试拆解电脑的一些设备，取出适配卡，卸下一些驱动器，探索电脑的每个配件。


    如果你有一台台式 `pc`，这种经验非常有用，因为如果它故障了，你可以自己修理。在这个过程中，你会对连接器、线缆以及整体是如何组合在一起的更加熟悉。


    你可以尝试从零开始组装一台电脑来挑战自己。这将极大地有助于理解每个组件。通过这样做，你可以轻松识别出这些组件。


    组装完成后，你可以安装操作系统、配置设置、建立网络等。使用手动指南来执行各种任务。你的参与越深，对这些概念的理解就越好。最后，如果一切都就位，你会获得成就感。这也很很有趣。


    ––––––––


    ![image](img/scene_break.png)


    # 使用互联网上提供的额外资源


    利用各种网站上易于获取的额外学习资源。虽然 `pc` 技术人员指南被设计成一个全面的教学辅助，包含了如何通过 `CompTIA A+` 认证测试的指南，但用一些在线资源来补充你的复习也很重要。


    网上有很多免费的更好评估工具，它们包含了教程、照片、视频片段和其他资产，以帮助候选人在学习过程中进步。


    `YouTube` 上有很多视频，因为许多内容作者已经发现了新的、更好的方法来解释概念。


    这些视频既有信息量又有趣。你可以从输入关键词开始，如“如何安装……”（某个操作系统）。观看视频比纯文字阅读好得多，因为它有助于记忆概念。


    ––––––––


    ![image](img/scene_break.png)


    # 为了练习而参加多次考试


    计算机技术人员课程的设计具有分析功能。此外，它还包含测验、单元学习，以及在每个核心部分之后的期中和期末考试。复所有这些评估，确保你对一切都了如指掌。根据要求评估作业和测验。你可以再次重考以巩固所有内容。期中和期末考试旨在提供传统的经验。


    你可以根据意愿随时参加期末和期中考试。此外，你还可以寻找免费的实践评估或测验，以验证你对 `A+` 检查中提出的问题的掌握情况。示例问题和各种模板也可以从
    `CompTIA` 网站下载。


    在考试当天，你需要充足的睡眠。你需要照顾好饮食。在考试前吃顿简单的饭。此外，在考试前几分钟到达，并带着自信的态度进入现场。相信你的直觉，相信对每个问题的“直觉反应”。排除所有不太可能的选项，保留可能的答案。通过缩小范围，你现在可以专注于剩余选项中哪一个是正确答案。


    当今市场中的许多组织要求员工获得 `CompTIA` 认证。`Network+`、`CompTIA` 的 `A+` 和 `protection+` 包含了基于性能的查询
    (`PBQ`) 和一些多选题。每种题类型的指定数量可能根据考试而异。


    | ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)
    |


