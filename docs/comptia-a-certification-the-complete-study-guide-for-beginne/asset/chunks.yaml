    # 引言


    ![image](img/chapter_title_below.png)


    计算机技术协会（Computing Technology Association，简称 CompTIA）是针对 IT 领域人员的信息技术认证机构。CompTIA
    最初于 1982 年引入，当时被称为“优秀计算机经销商协会”（Association of better Comp Dealers），但几年后，认证名称更改为
    CompTIA。每年有超过五万人在通过 CompTIA 的各种认证获得证书。


    ––––––––

    ![image](img/scene_break.png)

    ![image](img/image000.png)

    ––––––––

    ![image](img/scene_break.png)


    1990 年，该认证范围范围扩大，以满足计算行业日益增长的需求。CompTIA 是世界闻名的认证机构，过去已获得官方认可，为其信息技术领域的众多候选人提供认证。它为他们在
    IT 世界的职业奠定了坚实的基础。在 IT 行业，CompTIA 协会提供专业证书。该协会通过 Pearson VUE 测试中心管理其考试。


    此外，它还提供社区会员身份。自 2008 年以来，许多当前的认证获得了美国国家标准（ANSI）的认可，自 2011 年以来也获得了 CASP 的认可。在获得认证后的
    2010 年，规定任何 2010 年之后的认证将在三年期后失效。90 年代，由于该协会开展了满足计算行业需求的活动，得到了大幅扩展。


    该协会的企业数量有所增加，现在涉及移动计算以及网络、成像、多媒体领域和 UNIX 等其他倡议。为了处理市场政策问题，它增设了公共政策经理。


    | ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)
    |


    ![image](img/chapter_title_above.png)


    # 第 01 章

    ## CompTIA 与当前认证


    ![image](img/chapter_title_below.png)


    CompTIA 是“计算机技术行业协会”（Computing Technology Industry Association）的缩写，这是一个于 1982
    年引入的贸易协会。它最初名为“优秀计算机经销商协会”（ABCD），但几年后，它将其名称从 ABCD 更改为 CompTIA，以适应该协会在计算世界中不断变化的角色。


    该协会为许多低收入学生提供培训和学习。2010 年引入了一项名为“创造 IT 未来”的协会新主管。此外，该协会使他们能够与潜在雇主和回归的老军人保持联系。以下列出了若干
    CompTIA 认证：


    ––––––––

    ![image](img/scene_break.png)


    ### A+ 认证


    该认证确立技术人员在计算行业的能力。官方而言，A+ 认证是一项中立认证，涵盖了来自苹果公司、微软、Linux 和各种 Novell 发行版等知名供应商的最卓越操作系统和技术。A+
    考试是为信息技术专业人士设计的。拥有五 00 小时经验的人有资格获得此认证。考试包含单选题并基于计算机知识。单选题可能有多个正确答案。在 2014 年，超过
    10 万人获得了 A+ 认证。


    如果任何人想获得 A+ 认证，必须通过两场考试。第一场考试包括涉及外围设备、PC 硬件、网络、移动硬件以及网络和硬件故障排除的题目，名为 `A+ certification
    220/901 exam`。


    第二场考试是 `A+ certification 220/902`。它包含不同操作系统的配置和安装，如 iOS、Windows、Android、Linux
    和 Apple OS x。此认证考试还包括云计算原理、安全和操作方法论。对于对 CompTIA A+ 认证感兴趣的人，可以参加 `220/902` 和 `220/901`
    考试。


    ––––––––

    ![image](img/scene_break.png)


    ### Network+


    该认证衡量网络工程师的技能、网络基础知识以及网络故障排除和网络安装的基础。Network+ 的最新考试于 2015 年引入，名为 `N10-006`。


    Network+ 考试最重要的主题是管理或网络化、无线和有线网络设备的故障排除以及网络的安装和配置。除了所有这些主题外，还涉及移动云、统一通信和一些基础虚拟化技术。


    CompTIA 协会倾向于已获得 A+ 认证并在网络领域拥有约九个月经验的候选人。此测试将为候选人参加思科和微软认证做好准备。`A+ network`、`Security+
    认证`或 `A+ server` 最终可以满足可选考试或 MCSA 认证的要求。


    ––––––––

    ![image](img/scene_break.png)


    ### Security+


    该认证考试涉及计算机系统的安全。Security+ 考试包含的主包括访问控制、加密以及与业务相关的各种主题，如风险管理和灾难恢复以及灾难恢复的多个步骤。该测试的最新版本于
    2014 年引入，被称为 `SY-401`。


    根据最近的研究，全球已有约 4 万人获得了此证书。要获得此认证，候选人必须具有二到三年的工作经验。Security A+ 的及分为 900 分中的 750
    分。


    考试涵盖的主题包括安全运营与合规、网络安全、漏洞和威胁。


    除了这些主题外，还包括主机和数据安全，以及网络安全、访问控制、加密的应用以及身份管理。对于 MCSA，此认证考试是可选的。


    ––––––––

    ![image](img/scene_break.png)


    CASP


