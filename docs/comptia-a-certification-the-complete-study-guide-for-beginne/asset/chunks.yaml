    \ systems. The topics that are included in Security+ exams are access control,\
    \ cryptography and various topics related to business like risk management and\
    \ disaster recovery and several steps of disaster recovery. The most recent version\
    \ of this test was introduced in 2014 and it is known as `SY- 401`.\n\nAccording\
    \ to recent research, this certificate had been earned by about 45000 candidates\
    \ all around the world. To acquire this certification, a candidate must have two\
    \ to three years’ work experience in security. The pass mark for security A+ is\
    \ 750 out of a possible 900.\n\nThe topics covered in this exam are operations\
    \ and compliance to security, network security, vulnerabilities and threats.\n\
    \nApart from these topics, the host and data security and applications of security\
    \ in networks, access control, and cryptography as well as identity management\
    \ are also included. For MCSA, this certification exam is elective.\n\n––––––\n\
