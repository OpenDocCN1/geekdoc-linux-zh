    # 第 02 章


    # 获取 Comp TIA 认证的步骤


    ![image](img/chapter_title_below.png)


    Comp TIA 被官方认可为其众多候选人的最佳认证。它为他们在信息技术世界的职业生涯奠定了坚实的基础。开始 Comp TIA 有许多不同的步骤。但首先，你必须决定哪种认证最适合你。


    无论你是刚刚开始信息技术职业生涯，还是最有经验、知识最丰富的信息技术专家，所有的行业认证都是在 IT 世界中提升职业水平的重要工具。


    Comp TIA 认证是当前信息技术行业中成千上万候选人职业生涯最重要的认证。


    鉴于 IT 领域众多的认证，确定合适的认证似乎很艰巨。你可以使用 Comp TIA 认证图表来确定哪种 Comp TIA 认证最适合你迈向职业生涯的下一步。


    ![image](img/scene_break.png)


    ## 首先选择你的认证


    第一步是根据你的入门级别选择正确的认证。以下是 Comp TIA 候选人可以选择的主要领域：


    1. **专业级 (Professional)**：此职位面向初级候选人以及他们已建立的 IT 同事。

    2. **基础级 (Foundational)**：此职位专门面向学生以及新进入信息技术世界的人。

    3. **专长级 (Specialty)**：此职位面向信息技术领域的专家。

    4. **精通级 (Mastery)**：此职位专门面向资深信息技术专业人士。


    在对想要参加的各种认证中做出选择时，认证对比表和职业路线图是最帮助的工具。


    ![image](img/scene_break.png)


    ## 选择一些培训选项


    有多种方法可用于准备认证考试。


    1. 讲师培训

    2. Comp TIA 和 `Cert Master` 提供的在线学习伴。

    3. 自学


    所有这些方法都可以由你应用，也可以通过建立强大的团队来完成。


    ![image](img/scene_break.png)


    ## 了解考试


    候选人必须熟悉他们的认证考试。为了实现这一点，他们需要做几件事：


    1. 学习考试目标的关键点。

    2. 尽可能多地练习样题卷。解决与你领域相关的各种问题示例。你可以在样题卷中找到这些问题。遵循模板。

    3. 在 `LinkedIn` 等在线论坛上查找 Comp TIA，以了解其他候选人对认证考试的评价。


    ![image](img/scene_break.png)


    ## 注册考试


    下一步是注册考试。注册过程可以通过在线论坛完成。确保你向 Comp TIA 认证计划提供正确的个人信息。


    ![image](img/scene_break.png)


    ## 参加考试


    注册完成后，如果你符合认证考试条件，请按照以下步骤操作：


    1. 购买考试券。

    2. 购买券后，找到最近的考试中心并根据你的日程安排测试。


    如果你恰好渴望 `A+` 认证，考虑自我教育和学习的方法。你只需要找到志同道合的人并加入小组。寻找那些对 `A+` 认证充满热情的人并尝试与他们合作。


    向他们展示你的知识，并询问他们知道的。不要回避频繁提问。这将允许你以更好的方式学习 `A+` 标准，并使你能够在面对的各种 IT 相关工作的众多竞争对手中脱颖而出。在工作面试时，由于你的知识，你的沟通技巧和信心将比其他人更好。


