    Network+, CompTIA’s A+ and protection+ assessments incorporate performance based
    queries (PBQ) and a couple of multiple choice queries. The specified quantity
    for each and every question type may vary for each exam.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Chapter 05


    # Troubleshooting theory from Comp TIA perception


    ![image](d2d_images/chapter_title_below.png)


    In addition to the domain application troubleshooting on the certification of
    220-902 examination, you can explain the idea behind troubleshooting. You will
    be required to grasp the six steps of the idea as provided by the certifications
    of Comp TIA. You should always comply with them so as deliberate corporate methods,
    policies, and impacts:


    ––––––––


    ![image](d2d_images/scene_break.png)


    Determine the main issue


    Question the candidates and identify the alterations you need to make to the computer
    and always have some backups before making changes.


    Even though this may seem rather obvious, it should never be overlooked. If you
    cannot define the crisis, you cannot begin to understand it let alone resolve
    it.


    Over time, the problems become more straightforward. However, in some other cases,
    they are only a symptom of a larger limitation.


    For instance, if a person is unable to connect to the internet from their pc,
    it could be an issue with their pc. But when different customers have similar
    issues, then the difficulties of the first user might just be one instance of
    the underlying problem.


    The best approach can also be the one where you check to see what “is not working”
    and what it looks like. Using this approach, you can also see the underlying problems
    that are behind the main issue.


    The drawback can easily be subjected to the incorrect approach. The client could
    be doing things in the wrong way or not following the correct order of executing
    tasks. Throughout this step, you should be very attentive as you will then see
    how the situation comes about.


    ––––––––


    ![image](d2d_images/scene_break.png)


    Establish a concept


    If it is a major issue, you an conduct extensive internal and external research
    based on the various signs you observe. After you have determined what the situation
    is, you need to come up with a hypothesis as to why it is going down.


    If you aren’t receiving any images, then it might have to do with the display
    or the video card. If you cannot get to your favorite website or if the website
    is unavailable, then you just have to define the situation.


    You can start with a conception concerning the motive of the drawback, what is
    fallacious because this is the only way to close in on feasible solutions to the
    difficulty. 


    Theories sometimes state something that may be authentic or that isn’t authentic.
    However you prefer to approach your theory generation, it’s always important to
    take intellectual inventory to determine what would be viable and what should
    be ruled out. Begin casting off possibilities and ultimately the only thing that
    can be unsuitable will be left.'
