  trans: "\n\n请注意，当你给你一个场景时，确保你的回答与该场景相关。\n\n例如：\n\nOsorio 和儿子的公司频繁遇到计算机故障。他们位于一个灰尘较多且炎热的地区。他们计算机故障可能的原因是什么？\n\
    \n1. 冷却系统不佳。\n2. 计算机部件上的水汽\n3. CPU 通风口的灰尘堵塞\n4. 电气连接不佳\n\n这些都可能是计算机故障的可能原因，但考虑到问题，我们只能有两个可能的答案\
    \ A 和 C。\n\nB 和 D 过于牵强，因此可以很容易排除。因此，通过排除错误的答案，我们最终有 50% 的机会找到正确答案。由于这是一道多选题，A\
    \ 和 C 将完美符合。\n\n––––––––\n\n![image](img/scene_break.png)\n\n## 你在考试中会遇到的关键词\n\
    \n- `Configure`（配置）：是指安排某物使其准备好运行。\n    - 设置。\n- `Explain`（解释）：使清楚；阐明意义。\n- `Compare`（比较）：评估两个或多个问题对象之间的差异和相似之处。\n\
    - `Contrast`（对比）：两个人物、对象和概念之间的差异。\n- `Identify`（识别）：能够评估一个对象与其他对象之间的区别并将其挑选。\n\
    - `Troubleshoot`（故障排除）：诊断或分析问题，直到确定一个合适的解决方案。\n- `Features`（特征）：构成、结构、形状、身体比例。\n\
    - `Purpose`（目的）：对象期望的结果。\n- `Properties`（属性）：对象的特征。\n- `Install`（安装）：设置、连接某物以使用。\n\
    - `PC`：个人电脑（personal computer）的缩写。\n\n––––––––\n\n![image](img/scene_break.png)\n\
    \n##  CompTIA A+ 考试目标\n\n在比考试当天更早地准备考试时，你要做的第一件事就是浏览 CompTIA 考试目标。\n\n通过 CompTIA\
    \ 概述的权威考试目标进行阅读。它们可以从 CompTIA 认证网站下载。\n\n### 为什么阅读和理解 CompTIA 考试目标很重要？\n\n- 它们能让你预先看到在考场上将要遇到什么。\n\
    - 帮助你识别需要学习的领域。\n- 帮助你管理时间，因为你知道需要涵盖多少领域，从而可以制定计划表。\n- 它提供了在为考试复习时使用正确材料的指南。\n\
    - 作为你等待考试期间的清单。\n\n这份记录不仅是考试必要性的证明；它还可以用于在通过计算机技术员应用过程中掌握一些指南。将其作为你练习中的理想清单使用。\n\
    \n––––––––\n\n![image](img/scene_break.png)\n\n## 目标\n\n在学习 CompTIA 考试时，考虑考试目标是非常重要的，因为问题将与这些目标直接相关。\n\
    \n### 900 系列有新内容吗？\n\n别担心，在很大程度上，900 系列 A+ 与旧版本相同。\n\n- `220-901`\n- `802.11ac\
    \ WiFi`\n- 命令行工具\n- 移动设备（Windows 手机是新的）\n- 更多关注虚拟打印机\n- 无 AGP：你可能在过去的学习材料中注意到它\n\
    - 无 CRT\n- 没有 RAMBUS RAM\n- 没有 PCMCIA\n- UEFI BIOS 是新的\n- `220-902` 主题\n- 客户端虚拟化\n\
    - Linux 和 Mac 的命令行工具\n- Linux 和 Mac\n- 没有 Windows XP\n- 操作系统安全功能\n- 操作程序（安全、MSDS\
    \ 表格等）\n- `Robocopy` 命令行工具\n- Windows 8\n- Windows Powershell\n\n如果你看到 Linux 和\
    \ Mac 主题时感到担心，不要担心，因为这些主题更多地关注基本功能。考试很大程度上关注 Windows。尽管对 LINUX 和 Mac 进行一些深入学习可能对你没有坏处。命令行工具是很重要的。许多此类命令之间是互换的。虽然关于\
    \ Linux/Mac 命令的问题很少，但不要排除它们。记住，问题是随机的，而且它们通常会有所不同。在考试之前，请练习 Windows 和 LINUX 命令行。你永远不知道，一个问题就可能导致及格或不及格。\n\
    \n因此，浏览目标是非常重要的，因为它们是考试期间预期所见内容的指针。确保你已经下载了 CompTIA 提供的目标书籍。它以 pdf 格式提供。在学习期间将其作为清单使用。\n\
    \n### CompTIA A+ 220 901\n\n- 硬件占题量总数的 34%\n- 故障排除和硬件占题总数的 28%\n- 网络占题总数的 21%\n\
    - 移动设备占题总数的 7%\n\n以下是 CompTIA A^+ 220 901 考试目标的总结，虽不全面：\n\n- 所有类型的 RAM（随机访问存储器）。\n\
    - BIOS/UEFI。\n- 移动设备的特性。\n- 主板组件、其属性和用途。\n- 涵盖加密类型。\n- 笔记本电脑显示器组件的功能。\n- 如何对 RAM、主板、CPU\
    \ 和电源进行故障排除。\n- 如何安装和配置存储设备、外围设备（鼠标、键盘、摇杆等）。\n- 如何安装笔记本硬件和组件。\n- 如何安装有线无线路由器。\n\
    - 识别 TCP/UDP 端口、协议的目的。\n- 识别硬盘、RAID 列、视频投影和显示问题、有无线网络以及打印机故障。\n- 移动设备端口和移动配件。\n\
    - 网络架构设备；特征和功能。\n- 网络工具。\n- PC 连接类型和涉及连接的电缆。\n- 个人电脑连接接口、特性和目的。\n- 打印技术和成像过程。\n\
    - 打印机维护。\n- RAID 类型及最适用之处。\n- SOHO 多功能设备。\n- IP/TCP 的属性。\n- 显示设备类型和特征。\n- 网络电缆和连接器的类型及其特性。\n\
    - 网络类型和互联网连接类型。\n- WIFI 网络标准。\n\n### CompTIA A+ 220 902\n\n- Windows 操作系统占 29%\n\
    - 软件故障排除占 24%\n- 安全通常占题量的 22%\n- 操作故障排除：13%\n- 其他操作系统：12%\n\n以下是 CompTIA A^+ 220\
    \ 902 考试目标的总结，虽不全面：\n\n- 应用程序安全问题。\n- 云概念。\n- 常见的安全漏洞和威胁（物理威胁和数字威胁）。\n- 安装 Windows\
    \ 操作系统的特征和要求。（Windows 7、Windows 8、Windows 10、Windows vista 等。）\n- 移动软件的特征。\n-\
    \ Mac OS 和 LINUX 的功能和特征\n- 给定各种场景解释故障排除理论。\n- 如何有效防止安全威胁和漏洞。\n- 如何安全 SOHO 有线和无线网络。\n\
    - 如何排除 PC 操作系统问题。\n- 阐明处理禁止活动/内容的过程。\n- 安装和配置 Windows 网络。\n- 与移动设备同步的方法和数据。\n\
    - 数据破坏和处置的方法。\n- Microsoft 命令行工具。\n- 网络连接和电子邮件。\n- 预防性维护措施和程序。\n- 适当的沟通技巧和职业道德。\n\
    - 网络主机提供的服务的目的和属性。\n- 使用计算机组件、维修或处置组件时遵循的安全程序。\n- 保护移动设备。\n- 客户端虚拟化的设置和使用。\n-\
    \ 理解许可、隐私和政策的概念。\n- 使用 Windows 控制面板实用程序。\n- Windows OS 安全设置。\n\n缩写\n\n"
