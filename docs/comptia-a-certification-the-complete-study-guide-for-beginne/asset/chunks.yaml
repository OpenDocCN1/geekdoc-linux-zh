    \n# Chapter 01\n## Comp TIA and Current Certifications\n\n![image](d2d_images/chapter_title_below.png)\n\
    \nComp TIA stands for Computing Technology Industry Association which a trade\
    \ association that was introduced in 1982\\. It was presented as the Association\
    \ of Better Comp Dealers (ABCD) but after a few years it changed its designation\
    \ from ABCD to Comp TIA in order to cater for the evolving role of the association\
    \ in the computing world.\n\nThis association provides training and learning to\
    \ many low income pupils. A new director for the association entitled as creating\
    \ the IT Futures was introduced in 2010\\. In addition to that, the association\
    \ enables them to stay connected to the potential employers and recurring veterans.\
    \ Several certifications of Comp TIA are given below:\n\n––––––––\n![image](d2d_images/scene_break.png)\n\
    \n### A+ Certification\n\nThis certification establishes the capability of the\
    \ technician in the computing industry. Officially, the A+ certification is the\
    \ neutral certification that covers the most remarkable operating systems and\
    \ technologies from notable vendors like Apple Inc., Microsoft, Linux and various\
    \ Novell distributions. The A+ certification exams are planned for the Information\
    \ Technology professionals. Those who have five hundred hours of experience are\
    \ eligible for this certification. The exam contains multiple choice questions\
    \ and is based on computer knowledge. The multiple choice questions may have more\
    \ than one correct answer. In 2014, more than one lac people had earned the A+\
    \ certification. \n\nIf anyone wants to get the A+ certification, he/she must\
    \ pass two exams. In the first exam, the questions related to peripheral devices,\
    \ PC hardware, networking, mobile hardware, and the troubleshooting of networking\
    \ and hardware are included and it is named as `A+ certification 220/901 exam`.\n\
    \nThe second exam is the `A+ certification 220/902`. It contains the configuration\
    \ and installation of different operating systems such as iOS, Windows, Android,\
    \ Linux, and Apple OS x. This certification exam also includes the cloud computing\
    \ principles, security and operational methodologies. For those who are interested\
    \ in Comp TIA A+ certification, they can sit for the `220/902` and `220/901` exams.\n\
    \n––––––––\n![image](d2d_images/scene_break.png)\n\n### Network+\n\nThis certification\
    \ gauges the skills of a network engineer, the basics of networking and the fundamentals\
    \ of network troubleshooting and network installation. The most recent exam of\
    \ network+ was introduced in 2015, named `N10-006`.\n\nThe most significant topics\
    \ of network+ exam are management or networking, troubleshooting of wireless and\
    \ wired devices of networks and installation and configuration of networks. Apart\
    \ from all these topics, the emerging technologies like mobile cloud, unified\
    \ communications and some basic virtualization technologies feature.\n\nThe comp\
    \ TIA association prefers those candidates who have acquired the A+ certification\
    \ and have about nine months experience in networking. This test will prepare\
    \ its candidates for the cisco and Microsoft certifications. The `A+ network`,\
    \ `Security+ certification` or `A+ server` can ultimately fulfill the requirements\
    \ of elective exam or MCSA certification.\n\n––––––\n![image](d2d_images/scene_break.png)\n\
