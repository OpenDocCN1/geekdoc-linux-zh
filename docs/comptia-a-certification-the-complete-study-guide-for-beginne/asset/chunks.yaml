    # Introduction


    ![image](d2d_images/chapter_title_below.png)


    Computing Technology Association is the information technology certification for
    people who are in the IT field. Comp TIA was first introduced in 1982 and at that
    time it was referred to as Association of better Comp Dealers, but after a few
    years, the title of the certification was changed to Comp TIA. More than forty
    five thousand people get certified every year in the various certifications of
    Comp TIA.


    ––––––––


    ![image](d2d_images/scene_break.png)


    ![image](d2d_images/image000.png)


    ––––––––


    ![image](d2d_images/scene_break.png)


    In the year 1990, the certification’s scope was widened to meet the growing needs
    of the computing industry. The Comp TIA is the world renowned certification that
    has been officially accredited in the past for providing certification to its
    numerous candidates in the field of Information Technology. It makes the solid
    base of their careers in the world of IT. In the IT industry, the Comp TIA association
    provides the professional certificates. This association administers its exams
    sessions through the testing center of Pearson VUE.


    On top of this, it offers communal membership. There are many current certifications
    that are credited by the American Standard Institute since 2008 and also by CASP
    since 2011\. After their accreditation, in 2010, a rule was made that any certifications
    after 2010 will run out after its three year period. In the 90s, the association
    was greatly expanded due to its activities to cater for the needs of computing
    industry.


    The enterprises of this association were increased and it now involves mobile
    computing as well as the other initiatives such as networking, imaging, multimedia
    arenas and UNIX. For taking positions in market policy issues, it added a Manager
    of Public Policy.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Chapter 01


    # Comp TIA and Current Certifications


    ![image](d2d_images/chapter_title_below.png)


    Comp TIA stands for Computing Technology Industry Association which a trade association
    that was introduced in 1982\. It was presented as the Association of Better Comp
    Dealers (ABCD) but after a few years it changed its designation from ABCD to Comp
    TIA in order to cater for the evolving role of the association in the computing
    world.


    This association provides training and learning to many low income pupils. A new
    director for the association entitled as creating the IT Futures was introduced
    in 2010\. In addition to that, the association enables them to stay connected
    to the potential employers and recurring veterans. Several certifications of Comp
    TIA are given below:


    ––––––––


    ![image](d2d_images/scene_break.png)


    A+ Certification


    This certification establishes the capability of the technician in the computing
    industry. Officially, the A+ certification is the neutral certification that covers
    the most remarkable operating systems and technologies from notable vendors like
    Apple Inc., Microsoft, Linux and various Novell distributions. The A+ certification
    exams are planned for the Information Technology professionals. Those who have
    five hundred hours of experience are eligible for this certification. The exam
    contains multiple choice questions and is based on computer knowledge. The multiple
    choice questions may have more than one correct answer. In 2014, more than one
    lac people had earned the A+ certification. 


    If anyone wants to get the A+ certification, he/she must pass two exams. In the
    first exam, the questions related to peripheral devices, PC hardware, networking,
    mobile hardware, and the troubleshooting of networking and hardware are included
    and it is named as A+ certification 220/901 exam.


    The second exam is the A+ certification 220/902\. It contains the configuration
    and installation of different operating systems such as iOS, Windows, Android,
    Linux, and Apple OS x. This certification exam also includes the cloud computing
    principles, security and operational methodologies. For those who are interested
    in Comp TIA A+ certification, they can sit for the 220/902 and 220/901 exams.


    ––––––––


    ![image](d2d_images/scene_break.png)


    Network+


    This certification gauges the skills of a network engineer, the basics of networking
    and the fundamentals of network troubleshooting and network installation. The
    most recent exam of network+ was introduced in 2015, named N10-006.


    The most significant topics of network+ exam are management or networking, troubleshooting
    of wireless and wired devices of networks and installation and configuration of
    networks. Apart from all these topics, the emerging technologies like mobile cloud,
    unified communications and some basic virtualization technologies feature.


    The comp TIA association prefers those candidates who have acquired the A+ certification
    and have about nine months experience in networking. This test will prepare its
    candidates for the cisco and Microsoft certifications. The A+ network, Security+
    certification or A+ server can ultimately fulfill the requirements of elective
    exam or MCSA certification.


    ––––––––


    ![image](d2d_images/scene_break.png)


    Security+


    This certification exam deals with the security of computer systems. The topics
    that are included in Security+ exams are access control, cryptography and various
    topics related to business like risk management and disaster recovery and several
    steps of disaster recovery. The most recent version of this test was introduced
    in 2014 and it is known as SY- 401.


    According to recent research, this certificate had been earned by about 45000
    candidates all around the world. To acquire this certification, a candidate must
    have two to three years’ work experience in security. The pass mark for security
    A+ is 750 out of a possible 900.


    The topics covered in this exam are operations and compliance to security, network
    security, vulnerabilities and threats.


    Apart from these topics, the host and data security and applications of security
    in networks, access control, and cryptography as well as identity management are
    also included. For MCSA, this certification exam is elective.


    ––––––––


    ![image](d2d_images/scene_break.png)


    CASP'
