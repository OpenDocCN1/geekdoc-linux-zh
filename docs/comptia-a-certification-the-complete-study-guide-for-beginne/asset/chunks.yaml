    -   投入其中。专注是关键，因为它能给你提供学习的动力。学习是一项艰巨的任务。

    -   找一个导师。找一个经验丰富的人来引导你完成课程中具有挑战性的部分。导师可以是该领域的专家。教程中的某些信息可能不清晰，或者表述得模糊。然而，如果你能找到人来解释那些更困难的概念，你将处于更有利理解的位置。

    -   如果你能在实践中执行某项任务，不要犹豫，尽管去做，因为这样更容易记忆概念。

    -   制定学习时间表。在头脑最清醒的时候学习。坚持学习计划，你就准备就绪。

    -   从不同的来源学习。正如俗话说，不要把鸡蛋放在同一个篮子里。不要依赖于单一来源。有时，不同的作者会以不同的方式呈现相同的信息，而这种方式对你来说更有意义。

    -   在学习时随手记录新概念，这有助于记忆这些概念。

    -   尽可能多做 `CompTIA A+` 模拟测试。不要忽略任何一题，不要说它太难而不去测试，这些正是那些会让你措手不及的问题。如果你遇到难题，请寻求帮助。你可以“Google”该概念，或者问问可能理解了该测试概念的朋友。做很多练习题有助于你建立信心，并为考试做好准备。


    ––––––––


    ![image](img/scene_break.png)


    ## 设置 CompTIA 实践实验室


    维修电脑的实战经验是为 `CompTIA A+` 考试充分准备的最佳方法之一。建立测试实验室既简单又便宜；即使是一台简单的笔记本电脑也足够了。练习简单的任务，更重要的是复杂的任务。这将帮助你巩固
    `CompTIA A+` 考试概念。


    ### 选项 1


    应当具备或应该拥有的设备、电脑零件和工具：


    #### 设备

    -   接入点

    -   安装有操作系统（`Windows`, `IOS`, `LINUX`）的台式机

    -   安装有操作系统（`Windows`, `IOS`, `LINUX`）的笔记本电脑

    -   显示器

    -   打印机——激光和无线的

    -   投影仪

    -   手机（无论是安卓、苹果还是 Windows）

    -   SOHO 路由器和交换机

    -   浪涌抑制器

    -   UPS（不间断电源）

    -   VoIP 电话


    #### 组件

    -   AC 适配器

    -   适配器

    -   各种连接器

    -   机箱

    -   冷却设备

    -   CPU

    -   硬盘

    -   维护工具包

    -   鼠标/键盘

    -   主板

    -   网线/连接器

    -   网卡

    -   光驱

    -   电源器

    -   内存（内存）

    -   声卡

    -   支撑柱/螺丝

    -   显卡

    -   无线网卡


    #### 工具

    -   剥线线器

    -   电缆测试仪

    -   压线钳

    -   ESD（防静电）手环

    -   多用电表

    -   测试卡

    -   电源测试仪

    -   打线工具

    -   SATA 转 USB 连接器

    -   螺丝刀

    -   标准技术员工具箱

    -   导热膏

    -   WIFI 分析仪

    -   无线剪刀


    #### 软件必备

    -   反恶意软件

    -   防病毒软件

    -   驱动程序软件

    -   操作系统光盘

    -   虚拟化软件


    ––––––––


    ![image](img/scene_break.png)


    ### 选项 2


    只要你有一台性能足够的个人电脑（台式机或笔记本电脑），你就可以通过构建虚拟实验室来节省费用：


    -   `Oracle VM Virtual Box`：它是一个免费的开源桌面虚拟化软件，运行在 `Linux`、`Windows` 和 `OS X` 上。

    -   `VyOS` 虚拟路由器：可以使用 `VyOS` 软件路由器免费构建一个路由互联网络。

    -   `Microsoft 评估软件`：你可以下载受限制或完全解锁的客户端操作系统和 `Windows Server` 副本。

    -   `Linux`：`CompTIA` 只需要我们熟悉 `bash` 命令行 shell，这出现在几乎所有的 `Linux` 和 `UNIX` 发行版中。


    构建好虚拟实验室后，你就完成了 50%。剩下的 50% 是确保你了解如何执行考试目标中指示的所有任务（务必下载你的 `CompTIA` 目标）。


    然而，为了提高计算机硬件技能，你需要购买一些物品：


    -   技术员工具：你可以买一些电脑技术员工具。即使是二手工具也会证明非常有用。（后期你可能会购买新的）

    -   旧的、老旧、损坏的硬件：可以很容易从亲戚、邻居、朋友或同事那里借到。他们会免费把用过的旧台式机、CPU、笔记本电脑、路由器和移动设备供你实验。然而，如果你的亲戚或朋友那里没有，你可以从廉价商店或
    eBay 获取。


    ––––––––


    ![image](img/scene_break.png)


    ## 考室内


    考试将在考室内进行。熟悉标准的 `CompTIA` 考场可以缓解紧张情绪，让你处于表现更好的状态。首先，进入考场时要放松。如果你感到不安，深吸气，如果可以的话快去洗手间，避免为了去厕所而匆忙考试，导致中途离开。


    ### 其他重要的考试技巧


    -   人员必须填写正确的身份信息。

    -   考场不允许携带任何材料。

    -   进入后，拿上写具并写下你制作的图表。

    -   一旦在指定的登录区域点击登录，请记住考试是基于时间的，如下所示：

    -   -15 分钟填写个人背景信息。

    -   -90 分钟参加考试。（90 道题）

    -   识别题目中的关键词或短语。

    -   大写字母是有原因的。这些词是指南。常见的大写词包括 `MOST`、`LEAST`、`MINIMUM`、`MAXIMUM`、`FIRST`。

    -   了解术语和词汇。确保你理解题目中的词汇。这只有花时间学习才能做到。

    -   确保掌握 `A+ Essentials 2.2`。

    -   进行大量的逻辑推断。使用逻辑排除你不定的选项。

    -   识别错误答案。这是一件好事，有助于排除过程。

    -   在阅读题目时预测答案/答案。这只有在进行了适当学习后可能的。

    -   后面的题目可能有助于前面的题目。因此，当你遇到难题时，可以标记它并留到以后。你可能会在后面的题目中找到线索，或者你的大脑已经为难题做好了。

    -   请不要留空答案。尽可能尝试回答所有题目。如果某些题目让你很困扰，你可以猜。但这是在你尝试了排除法并过完所有题目之后。

    -   除非你百百确定它是错误的，否则不要更改你选定的第一个答案。利用你的知识和应题技巧回答所有题目。记住你的第一个答案通常是正确的。


    ––––––––


    ![image](img/scene_break.png)


    ## 你可能会遇到的题目类型


    你会遇到三种类型的题目：


    1.   `应用题`——这些题目测试在需要特定响应的情况下对所学概念的应用。

    2.   `单项选择题`——这些题目要求你从一组选项中选出一个正确答案。

    3.   `多项选择题`——这些题目要求你从选项中提供多个正确答案。对于此类题目，如果用户只选择了一个答案，系统会提示用户提供多个答案。


    在这些题目中，如果遇到困难，你可以自由标记并留到以后。在时间结束前，在完成所有较简单的题目后，你可以尝试这些被标记的题目。


