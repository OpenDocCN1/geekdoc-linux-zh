- pgno: 35
  md: '# Chapter 1. Linux Basics


    Installing these programs on Windows is just a matter of going to the appropriate
    website and downloading the Windows installation file. Many of these programs
    are the default programs used by Linux Mint, or they can be installed from the
    Software Manager.


