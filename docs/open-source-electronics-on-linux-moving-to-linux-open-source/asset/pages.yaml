- pgno: 108
  md: '# What makes Arduino so popular?


    Arduino is very popular with those who are interested in electronics as well as
    others who are not necessarily out to learn electronics, but need it in a project
    e.g. Arduino is used by artists. Some of the things that make Arduino popular
    are:


    +   - **Ease of use** – after buying an Arduino board and installing the software,
    a built-in program can be compiled and run immediately without any programming
    knowledge.


    +   - It is **open-source** and software is free of charge.

    - The Arduino IDE comes with a range of **software libraries** making it easy
    to program different hardware without having to write drivers and utility functions.
    This allows the programmer to concentrate on the end application. e.g. if an Ethernet
    shield is used, functions from the Ethernet library called, no need to write code
    to access the Ethernet chip – just starting application code. Interfacing an an
    SD card? Use functions from the SD library – no need to write SD initialisation
    code or implement the FAT file system.


    +   - **No special programmer is required**, programming is done through the USB
    port.


    +   - **No power supply is required**, the board is powered from the USB port,
    but can be externally powered in a stand-alone application.


    +   - Easy to interface to an **electronic bread-board** for prototyping and experimenting.


    +   - **Ready made shields** are available to add instant hardware functionality.


    +   - **Supports many computer platforms** – Linux, Windows and Macintosh.


    The Arduino board has a **user programmable USB virtual serial port** for debugging
    and in applications – the same USB port that is used to program the Arduino can
    be used in Arduino programs as a serial port to communicate with a PC. The Arduino
    USB port appears as a serial port on the PC allowing a terminal emulator or user
    program to connect to the user application running on the Arduino board. Data
    can be sent and received between the Arduino and PC for logging, interfacing sensors
    to the PC, etc.


    Arduino has a **large user base/community** with many Arduino user pages, a forum
    and various groups/blogs/organisations. This means that help can be easily obtained
    simply by searching the web or posting questions.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# 4.1 Arduino Uno Technical Description


    Basically the Arduino Uno hardware is an 8-bit Atmel AVR microcontroller on a
    PCB with some of its pins available for interfacing via connectors. 14 I/O pins
    are available on connectors and can be individually configured as inputs or outputs.
    6 analog inputs can read analog values using the internal analog to digital converter.
    The board can be powered by the USB connection or by any external 7 to 12 volt
    power supply. The USB connection is controlled by a separate chip on the board,
    as the main microcontroller does not have built-in USB.


    The AVR microcontroller contains an Arduino boot-loader program pre-loaded on
    it which allows programs to be loaded to the microcontroller via the USB port.
    Programs are written for the Arduino using the Arduino IDE software running on
    a PC, they are then compiled and loaded to the Arduino by the USB connection all
    from within the IDE. The Arduino programming language is very much like the C
    programming language and is actually converted to C and compiled with a C compiler,
    but this is hidden from the programmer.


    No external programming device is required when using the standard Arduino boards
    (e.g. the Uno), however there is a header on the board that can be used to program
    the AVR using an external programmer. This may be required if a new blank AVR
    microcontroller is inserted into the board. An external programmer can then be
    used to load the Arduino boot-loader to the new AVR. Using an external programmer
    is covered in the next chapter of this book which includes several build-your-yourself
    programmers. I bought a spare AVR microcontroller with pre-loaded boot-loader
    and tried it out in my Arduino board. There was a boot-loader on the AVR, but
    it was not the correct one and I had to program the correct boot-loader using
    an external programmer.


    Another feature of the USB connection is that it can be used as a general purpose
    port for communications between the user program running on the Arduino hardware
    and the PC, for example, it could be used to switch something connected to the
    Arduino board and on off from the PC, or log data that the Arduino board is collecting
    to the PC.


    To start using Arduino, all you need is your PC, an Internet connection, an Arduino
    board and a USB cable.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# 4.2 Arduino Quick Start Instructions


    To start using Arduino:


    +   - Buy an Arduino board, e.g. the Arduino Uno (the Uno is used throughout this
    chapter).


    +   - Get a USB cable.


    +   - Install the Arduino software.


    +   - Plug the Arduino board into the PC via the USB cable – this is for powering
    the board and programming it.


    +   - Start the Arduino software and select the settings for the particular Arduino
    board and USB connection.


    +   - Open one of the example programs available in the Arduino IDE software.


    +   - Compile the program and load it onto the board to run.


    The above steps in more detail:


    +   - Buy an Arduino board

    The Arduino Uno is a great board to start with if you are wondering which one
    to get. You may also want to purchase a shield, such as the Ethernet shield described
    later in this chapter, at the same time that you order your Arduino board. In
    this case it is a good idea to read this chapter through before buying anything.


    +   - Get a USB cable

    For the Arduino Uno board, the size of the USB connector on the cable that plugs
    into the Arduino board (type B connector) is a standard type B and not the miniature
    type B connector. If you are using an Arduino board other than the Uno, check
    what size USB connector is used on the board as some Arduino boards do the miniature
    type B connector. Find this information on the Arduino website (arduino.cc, look
    under Products).


    +   - Install the Arduino software

    The Arduino software is available for installation via the Linux Mint Software
    Manager. Just type “Arduino” in the search field of the Software Manager to find
    and install it.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# Chapter 4. Open-source Hardware: Arduino


    +   • Plug the Arduino board into the PC

    Use the USB cable to plug the Arduino board into one of the PC''s USB ports –
    the ON LED on the Arduino board should light up. Now open a terminal window (Ctrl
    + Alt + t, if you set up this keyboard shortcut in chapter 1) and type:

    `dmesg | tail`nFrom the information displayed in the terminal window, you should
    be able to determine the name of the USB port that the Arduino board is configured
    at. It should be something like ttyACM0 or ttyUSB0.


    +   • Start the Arduino software

    On the Mint menu with All applications selected, find the Arduino IDE under Programming
    → Arduino IDE.


    +   • Connect to the board

    In the IDE window, click Tools → Board and then select the name of the Arduino
    board that you are using, e.g. Arduino Uno. Now click Tools → Serial Port and
    then click the name of the serial port that you determined in step 4 above, e.g.,
    /dev/ttyACM0.


    +   • Open one of the example programs

    In the IDE window, click File → Examples → 1.Basics → Blink. This will open the
    example program that flashes the LED labelled L on the Arduino Uno board.


    +   • Compile and load the program

    Click the Verify icon on the Arduino toolbar (it looks like a tick mark) to verify
    (compile) the program (figure 4.2, ①). Now click the Upload icon to load the program
    to the board (figure 4.2, ②). When uploading is done, the “L” LED on the Arduino
    board should start flashing and off.


    An explanation of how the Blink example program works can be found on the Arduino
    website at: arduino.cc/en/Tutorial/Sketch


