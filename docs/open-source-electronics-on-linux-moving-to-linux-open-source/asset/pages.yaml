- pgno: 12
  md: '# Introduction


    Linux is a free operating system that offers many advantages to anyone involved
    in electronics. This book is primarily about using electronics related applications
    in Linux, open-source software and open-source hardware. Many of the applications
    discussed can also run on a Windows computer. Only free or open-source software
    is used throughout the book.


    Linux Mint, which is based on Ubuntu, has been chosen for use with this book.
    Ubuntu Linux and derivatives of Ubuntu such as Xubuntu can also be used. These
    Linux distributions are easy to use and have many electronics related applications
    available in their software repositories.


    # Reasons for Moving to Linux


    Some reasons that you may want to move or start using Linux:


    +   - Linux is available free of charge for students and hobbyists or even small
    companies on a tight budget. Software updates are also free as well as upgrades
    to future versions.

    - Thousands of free applications to choose from there are many thousands of applications
    that are available free of charge that run on Linux.

    - Freedom to copy - Linux as well as the many free applications available for
    it can be installed on as many PCs as you like.

    - No licensing hassles - no worries about licenses that expire, software protection
    dongles, registration, etc.

    - Great learning platform - open-source software is great for learning as the
    software can be examined and changed.

    - Runs on older hardware - when support for an older version of a commercial operating
    system ceases, the older hardware on which it was running may not support the
    new version of the operating system. There are many versions of Linux that will
    run on the older hardware.

    - Many electronics related applications available - for our purposes in this book
    this is a major advantage e.g circuit design tools, software tools for embedded
    programming.

    - Viruses and security - viruses are virtually non-existent for Linux.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# Introduction


    # Major Topics Covered


    This book includes both software and hardware topics. The hardware projects can
    all be built using single-sided home-made PCBs. No specialised components are
    used in the hardware projects. The projects that interface to the PC using USB
    do not use special USB chips, they use AVR microcontrollers that implement USB
    in software.

    Some the main topics covered in this book are:


    +   * **Getting and installing Linux**: Various configurations such as stand-alone
    installations, dual booting with Windows and others are covered.

    * **Configuring and using Linux**: Practical advice on setting up and using Linux.
    How to include install applications for electronics and everyday use.

    * **Using EDA software to draw schematics and design PCBs**: Learn to use the
    free EDA software, KiCad, to draw schematic of circuits and produce printed circuit
    boards. Also included is how to create your own library of symbols and PCB footprints.

    * **Open-source hardware**: Various open-source electronic hardware is presented
    including a chapter dedicated to the very popular Arduino platform.

    * **Microcontroller development**: Looks at how to start developing software for
    Linux for microcontrollers, mainly concentrating on 8-bit AVR microcontrollers.

    * **Interfacing an LCD to a Linux PC**: Build a circuit that interfaces an LCD
    to a Linux PC via USB and displays various Linux system parameters.

    * **Use software for electronic applications**: Catalogue your electronic component
    collection in a database for easier management. Discover other open source electronics
    related applications.


    # Some Possible PC Configurations


    Depending on your circumstances, you may choose one of several configurations
    when using this book, for example:


    +   * **Run exclusively** – change over to Linux permanently.

    * **Dual boot Windows and Linux** – have both Windows and Linux on the same PC.
    When you switch the PC on, you can choose which one to boot into from a menu.

    * **Stay with Windows** – run free software on your Windows PC. Most of the software
    is available for Windows too, however, there are some exceptions.

    * **Run Linux and Windows on separate computers** – if you have more than one
    computer, this is ideal as it may not be practical for everyone to totally abandon
    Windows.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# Target Audience


    This book has been written for electronics hobbyists who have an interest in Linux,
    microcontrollers, programming, circuit design, open-source software, open-source
    hardware and PC interfacing.


    # Prerequisites


    It is assumed that you have some basic electronics knowledge and have built some
    circuits on breadboard, done soldering, use basic hand-tools for circuit assembly,
    can read a circuit diagram, etc. It is also assumed that you know how to use a
    Windows PC. No knowledge of Linux is required.


    The sections on programming microcontrollers use the C programming language. If
    you don''t know the C language, you can still build the projects and compile and
    run the samples projects, but you won''t be able to write your own programs. Hopefully
    this will give you the inspiration to learn C.


    # Hardware Requirements


    A modern PC is required that will boot from the CD drive. Ideally you will have
    two PCs and dedicate one to Linux. This is not, however, essential.


    Various components will be required throughout the book as listed in each chapter,
    such as microcontrollers, resistors, transistors, etc. Copper clad board and chemicals
    for making PCBs will also be required to build some of the projects. Some of the
    projects can be built on Veroboard (stripboard) or even a breadboard.


    # Software Requirements


    A broadband Internet connection is required for downloading the software used
    in this book. All software used in this book is downloadable from the Internet
    for free. The files for various projects in this book can be downloaded from the
    Elektor website (elektor.com)'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Introduction


    # Getting the accompanying files


    To download the accompanying files for any Elektor book, go to the Elektor website
    and click the “Books” link on the front page. On the books page, either navigate
    using the tabs to find the book that you bought or use the search box to find
    the book. Click the link to the desired book and on the book’s page will be a
    link to the zipped accompanying files.


    These files will be referred to as “accompanying files” in the text and will be
    referenced by chapter. As an example, if you are busy with chapter 5, this chapter
    will make reference to a specific project included with the accompanying files
    in the following format:


    # CH05/AVR_progs/ATmega8_blink


    Also included in the root folder of the accompanying files is an HTML page called
    index.html that contains links to all the websites referenced in the text so that
    you can rather click the links than to type them into your web browser. To save
    typing long lines of text, the file also contains text that you will need and
    can be copied and pasted instead of typed.


    # Approach Taken in this Book


    This book starts out by taking a look at various Linux configurations and makes
    some suggestions as to which one may suit you depending on your particular circumstances.
    It takes you through the installation process. A quick tour of Linux Mint is followed
    by instructions on how to install applications for everyday and electronics use.
    Linux equivalents to popular Windows software are suggested.


    The remaining chapters in the book are dedicated to electronics applications and
    hardware as outlined at the beginning of this introduction. It is possible to
    skip the installation of Linux at first and load many of the applications on a
    Windows PC as many of the applications can run on both Windows and Linux.


    Working with Linux and electronics is great fun and I hope that you enjoy this
    book!'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Chapter 1. Linux Basics


    It is best to read through this whole chapter before commencing installation of
    Linux as this will give you an overview of the installation process and what must
    be taken into consideration before installing. A standard installation of Linux
    Mint or Ubuntu is pretty straightforward – download an ISO image of the chosen
    distribution, create a CD or bootable flash drive from it, boot your computer
    from the CD or flash drive and follow the instructions.


    # 1.1 A Strategy for Moving to Linux


    If you want to move over Linux for your day to day tasks, the best way is to start
    applications on your Windows PC that are also available on Linux. This makes the
    transition easier, as you will then be using familiar applications. Of course
    it is also possible to load Linux onto your PC and start using it right away.


    In my experience, I have tried many different Linux distributions through the
    years and only started Linux seriously when I loaded it onto a dedicated machine.
    Previously it had always been easier to get a task done on my Windows machine
    because I was familiar with Windows and could get the task done quicker on Windows.
    Even when using a dual-boot configuration, it was easier to boot into the more
    familiar Windows environment.


    A cautious approach to moving to Linux is:


    +   * Start using applications on your Windows PC that will run on Linux. These
    are noted throughout this book.

    * Live-boot a CD to see if it is compatible with your PC''s hardware and for evaluation
    purposes. This is explained shortly.

    * If you have only one PC, load Linux in a dual-boot configuration so that you
    can choose to boot into either Windows or Linux every time you switch the PC.

    * If you have a PC that you can dedicate to Linux, this is ideal. You can then
    load Linux onto this PC and later decide if you want to use it as your main machine
    and migrate all your main applications to it.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# 1.2 Choosing a Linux Distribution


    The Linux distribution chosen for this book is Linux Mint 13 MATE Edition LTS.
    What follows is an explanation of why this distribution was chosen and then some
    information on alternatives to this that you can try.


    Terminology used in this section:


    **Desktop** – or desktop environment is the graphical user interface (GUI) that
    the user of the operating system uses to interact with the computer. It is what
    the user sees on the screen after switching the computer on logging in. Linux
    can run many different desktop environments with names as Gnome, Unity, KDE and
    others whereas Windows has only one desktop environment.


    **Distribution** – or Linux distribution is an operating system built on the Linux
    kernel which includes a desktop environment and other software. There are many
    different Linux distributions such as Ubuntu, Mint, Red Hat, SUSE and others.
    Each distribution differs from the others in what desktop environment it uses,
    what applications it includes and how it is set up.


    **Fork** – or of a software project occurs when a copy of the source code files
    of an existing project are taken and developed further by a new team of software
    engineers independently from the original software team.


    # 1.2.1 History and Choices


    Originally standard Ubuntu Linux was chosen for use in this book, but Ubuntu underwent
    a major change to its desktop. The original Ubuntu desktop was based on the Gnome
    2 desktop environment (**figure 1.1**). This was replaced by the Unity desktop
    (**figure 1.2**) which was a radical change from Gnome. At the same time the Gnome
    desktop underwent a radical change as it transitioned to Gnome 3. (Basically the
    Ubuntu development team did not like the way Gnome was going with Gnome 3, so
    they came up with their own desktop – the Unity desktop).'
  merge: -1
  img_proc: true
- pgno: 18
  md: '![](img/3c46617540546e0091f48cc286948fbe_18_0.png)


    Figure 1.1: Ubuntu with the Gnome 2 Desktop


    Many users of Ubuntu did not like the Unity desktop. Although liking or not liking
    a particular desktop is a matter of opinion, the main objections to the Unity
    desktop were that it was released early so contains many bugs and that it is not
    customisable – this is likely to change in the future as Unity is developed further.


    After the development on the Gnome 3 desktop started, the Gnome 2 desktop was
    abandoned by the Gnome development team, not to be developed any further. This
    lead to a group of developers starting the MATE desktop which is a fork of the
    Gnome 2 desktop. Linux Mint which is based on Ubuntu uses the MATE desktop in
    one of its editions.


    Thus Linux Mint with the MATE desktop was adopted as the Linux distribution of
    choice for use with this book. Linux Mint is both stable and very responsive.
    **Figure 1.3** shows the Linux Mint MATE desktop.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Chapter 1. Linux Basics


    ![](img/3c46617540546e0091f48cc286948fbe_19_0.png)


    Both Ubuntu and Linux Mint release a new operating system every six months. Some
    of the releases are Long Term Support (LTS) releases and are not.


    LTS releases are supported for longer periods of time than other releases. This
    means that LTS releases will receive support and security updates over a longer
    period of time.


    Linux Mint 13 is a LTS release and will be supported until April 2017.


    ![](img/3c46617540546e0091f48cc286948fbe_19_1.png)


    13'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# 1.2 Linux Distributions to Choose


    # 1.2 Linux Distributions to Choose From


    Although Linux Mint has been chosen for this book, you can also try other Linux
    distributions including Ubuntu (www://www.ubuntu.com) and Ubuntu derivatives.


    The following are ‘recognised’ Ubuntu derivatives (i.e. recognised by the Ubuntu
    project and the Canonical company (www://canonical.com)):


    +   - **Edubuntu (ubuntu.org)** – Ubuntu for educational purposes.


    +   - **Kubuntu (kubuntu.org)** – Ubuntu with KDE (K Desktop Environment) instead
    of the Unity used in Ubuntu.


    +   - **Mythuntu (mythubuntu.org)** – for creating a MythTV based system.


    +   - **Ubuntu Studio (ubuntustudio.org)** – has many application for editing
    and creating audio, graphics and video.


    +   - **Xubuntu (xubuntu.org)** – Ubuntu with the XFCE desktop instead of the
    Unity desktop on Ubuntu. This makes it lighter and faster to run on older hardware.


    +   - **Lubuntu (lubuntu.net, wiki.ubuntu.com/Lubuntu)**, has recently earned
    official endorsement from Canonical. Lubuntu is a very fast and lightweight derivative
    of Ubuntu (faster and more lightweight than Xubuntu) aimed at Low-spec hardware.


    **Figure 1.4** shows the Xubuntu desktop which resembles the original Ubuntu Gnome
    2 desktop in many ways.


    ![](img/3c46617540546e0091f48cc286948fbe_20_0.png)


    **Figure 1.4:** Xubuntu with the Xfce Desktop'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Chapter 1. Linux Basics


    Linux Mint (linuxmint.com) is available with several different desktops:

    * MATE desktop (used in this book)

    * Cinnamon desktop

    * KDE desktop

    * Xfce desktop


    # 1.3 Getting a Linux Distribution


    Download an ISO image for one of the Linux distributions suggested. It is highly
    recommended to use Linux Mint MATE edition, although you may like to try several
    different distributions to see which one you prefer.


    # Linux Mint


    Linux Mint can be downloaded from linuxmint.com/download.php where you can select
    which edition to download and then select a mirror site. The edition used with
    this book is MATE 32-bit: Linux Mint 13 32-bit “Maya” - MATE (32-bit).


    Clicking one of the mirror sites will start the download of the ISO image of Linux
    Mint. For Linux Mint 13 32-bit, the name of the ISO image is: linuxmint-13-mate-dvd-32bit.iso


    # Ubuntu


    You can download the Ubuntu desktop edition from the Ubuntu download page at www.ubuntu.com/download
    which will take you to a page that will allow you to download the latest Ubuntu
    Desktop Edition. The download is in ISO format and can be used to create a CD.
    On this page is also a link to buy Ubuntu on CD. Instructions on this download
    page show you how to create a bootable CD or USB stick.


    # Xubuntu


    Go to the Ubuntu website xubuntu.org and click the “Get Ubuntu” link. The Get
    Ubuntu page contains links to mirror sites for downloading Ubuntu.


    Other Ubuntu derivatives can be downloaded from their respective websites as listed
    in section 1.2.2 above.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# 1.4.1 Making a Linux Installation Disk or Flash Drive


    # 1.4 Testing Linux


    Linux Mint, Ubuntu and the recognised Ubuntu derivatives can all be "live booted".
    This means that you can make a bootable CD, DVD or Flash drive, boot off the disc
    drive and start running the operating system without installing it on your computer.
    Live booting allows you to see if the operating system will run on your particular
    hardware and will also allow you to test drive the operating system and desktop
    before installing.


    # 1.4.1 Making a Linux Installation Disk or Flash Drive


    Creating a CD or DVD

    Create a CD or DVD from the Linux distribution ISO image that you downloaded using
    the CD/DVD software on your PC. You will need to use a DVD for Linux Mint as it
    will not fit on a CD. Ubuntu will be able to fit onto a single CD.


    Documentation on how to make an ISO image is available for Linux Mint at:

    linuxmint.com/documentation.php

    Download the Linux Mint User Guide in pdf format from this page which contains
    information on creating a Mint DVD.


    For Ubuntu, help is available at:

    www.ubuntu.com/download/desktop

    help.ubuntu.com/community/BootFromCD


    Using Flash Drive

    For networks that do not have a CD/DVD drive or if you do not wish to use up a
    CD or DVD, you can make a bootable Flash drive from which you can live boot and
    also install Linux (provided that your PC is able to boot from a Flash drive).


    The UNetbootin project (unetbootin.sourceforge.net) provides software that can
    be used to make a bootable Flash drive from the ISO image that you downloaded.
    At the time of writing, Linux Mint 13 was not available under the Distribution
    radius button of the UNetbootin application, but the Diskimage radio button can
    be used instead. This allows you to navigate to the ISO image of the downloaded
    Linux distribution to select it and then make a bootable Flash drive.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Chapter 1. Linux Basics


    To make a Linux Mint bootable Flash drive in Windows:

    * Download Unnetboot (unetboot.sourceforge.net)

    * Insert a blank flash drive (1Gig or bigger) into a spare USB port on the PC

    * Run Unnetboot by double-clicking, the downloaded file in Windows

    * In Unnetboot, click the Diskimage radio button, make sure that the correct drive
    letter is selected and then click the ... button to navigate to the Linux Mint
    ISO image that you downloaded to your PC. See these settings in figure 1.5.

    * Click OK when done.


    ![](img/3c46617540546e0091f48cc286948fbe_23_0.png)


    # 1.4.2 Booting Linux


    Use your computer''s BIOS to boot off the CD, DVD or Flash drive that you created
    from the ISO image. Most modern computers will have an option to press a key when
    the computer is started and then choose from a menu which to boot from, e.g. press
    F12 to enter boot menu. Older computers will require you to enter the BIOS menu
    to change the default boot device.


    Once booted into a live boot session, you will be able to use Linux without modifying
    anything on your hard-drive. You will be able to run applications from the menu
    such as a web browser to surf the Internet and you will be able to explore the
    desktop.


    Note that running Linux from the CD will be much slower than running it on the
    PC after installation. Any changes you make in Linux when running it from the
    CD will be lost after rebooting.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# 1.5 Installing Linux


