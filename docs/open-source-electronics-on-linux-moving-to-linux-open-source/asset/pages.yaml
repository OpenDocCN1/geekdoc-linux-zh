    \ on the PC at /dev/ttyACM0, which may need to be changed in the\nprogram if a\
    \ different port is used over your PC. To close the program Ctrl+C.\n\n# 6.4.3\
    \ A Simple Program for the eZ430-Chronos\n\nFind a simple \"hello world\" program\
