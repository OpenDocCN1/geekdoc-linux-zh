- pgno: 255
  md: '# Appendix A – Home Made PCBs


    When finished, your Plot dialog box should look like figure A.17.


    Click the Plot button when done. Note that if you are printing the PCB_Edges layer,
    the previous PCB_Edges layer will be overwritten by the new mirrored layer because
    the mirrored silkscreen layer will appear in a different position on the page
    when the copper layer was printed.


    ![](img/3c46617540546e0091f48cc286948fbe_255_0.png)


    > Figure A.17: Plot Dialog Box for the Top Silkscreen Layer


    # Printing the silkscreen layer to photo paper


    Open the silkscreen postscript file or the PCB edges postscript file if necessary
    and perform the same printing operation that you did when printing the bottom
    copper layer of the board. If using post-card sized photo paper, print the PCB
    edges on plain paper and tape the photo paper to the plain paper as done before.


    # Transferring the silkscreen to the board


    Before ironing the silkscreen layer to the board'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# Appendix A – Home Made PCBs


    To align the photo paper to the PCB, hold the paper in position over the top of
    the PCB (make sure that it is the correct way around). Lift up the paper and PCB
    to a light source so that the light source will shine through the holes in the
    PCB allowing you to align it with the component outlines on the paper (figure
    A.19, left). If your board is not transparent, you will need to make some holes
    in the photo paper at strategic points to align the paper with the PCB.


    Once aligned, hold the paper in place and put it down on your ironing surface.
    Press down with the iron on one corner or side of the board first so that you
    do not have to move the hand that is holding the paper in position (figure A.19,
    right). When the paper has stuck to that side of the board, lift the iron and
    push down further up the board.


    ![](img/3c46617540546e0091f48cc286948fbe_256_0.png)


    Figure A.18: Photo Paper Ready to be ironed onto the PCB


    ![](img/3c46617540546e0091f48cc286948fbe_256_1.png)


    Figure A.19: Aligning the Photo Paper with the PCB and Ironing the Photo Paper
    to the PCB


    255'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# Appendix A – Home Made PCBs


    When finished ironing the board cool, or use something to pick the board up with
    so that you don''t burn yourself. Drop the board into a sink or bowl of water
    and remove the paper as you did when working on the copper layer.


    After all the paper has been removed, dry the board. It is now ready for assembly
    (figure A.20).


    ![](img/3c46617540546e0091f48cc286948fbe_257_0.png)


    Figure A.20: The Completed PCB'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# # Appendix B - Universal Power Supply


    When working with electronics, various DC voltages are often needed. A variable
    bench power supply can solve this problem but sometimes a fixed voltage supply
    is needed in prototype projects, especially if they are to be tested in the field.
    This section presents a power supply board, shown in figure B.1, that uses an
    LM317T voltage regulator or LDO regulator to create a fixed voltage DC power supply
    from a DC input. Using an LM317T saves having to stock fixed regulators such as
    LM7805, LM7809, etc idea with this circuit is to set the output voltage using
    a combination of up to three resistors that you are more likely to have in spares
    than some obscure value that will need to be specially ordered. The circuit can
    easily be modified to incorporate a bridge rectifier and then be used with low-voltage
    AC input.


    ![](img/3c46617540546e0091f48cc286948fbe_258_0.png)


    The KiCad files for the universal power supply can be found with the accompanying
    files in: Appendix_B/KiCad/Universal_PSU


    The bottom layer can be printed from Universal_PSU-Back.ps found in the above
    folder and the silkscreen can be found in Universal_PSU-Silks_Front.ps or open
    the project in KiCad and generate your own output files.


    257'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# Appendix B - Universal Power Supply


    # Circuit Diagram


    The circuit diagram for the Universal PSU is shown in figure B.2. A DC voltage
    must be supplied on connector P1 with positive on pin 1 of this connector and
    0V on pin 2. The regulated output voltage is available on P2, positive on pin
    1 and 0V on pin2 of P2.


    Diode D1 is optimal and can be replaced by a wire link. It is used as a half wave
    rectifier to rectify AC voltage it should be accidentally connected to the circuit.
    It also serves to drop a small amount of voltage, so remember to take it into
    consideration when using an LM317T voltage regulator that needs a minimum differential
    voltage of 2 to 3V (depending on current drawn) between its IN pin and OUT pin.
    Diode D3 is also optimal as per the LM317 data sheet.


    LEDs D2 and D4 are optimal and used to indicate the presence of an input and output
    voltage respectively. Current limiting resistors R1 and R6 for the LEDs will need
    to be calculated according to the input and output voltages.


    Two radial capacitors have been placed on the input (C1 and C2) and also on the
    output (C5 and C6) of the regulator. Each of these pairs of capacitors shares
    the same space on the PCB so that either C1 or C2 can be placed and either C5
    or C6 placed. This allows either a physically smaller capacitor or a physically
    larger capacitor to be placed on both the input and output of the board.


    R3, R4 and R5 are to be calculated, depending on the desired output voltage. If
    a fixed regulator is used, then R2 can be left off and R3, R4 and R5 replaced
    by 0 Ohm resistors or wire links.


    ![](img/3c46617540546e0091f48cc286948fbe_259_0.png)


    > Figure B.2: Universal PSU Circuit Diagram'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# Appendix B - Universal Power Supply


    # Parts List


    | Qty | Value | Designators | Description |

    |---|---|---|---|

    | Resistors | | | |

    | 1 | 270Ω | R2 | W 5% or 1% resistor - optional depending on regulator IC |

    | 5 | XΩ | R1, R3, R4, R5, R6 | W 5% or 1% resistors - calculated as per data
    sheet or the table in Setting the voltage bowl |

    | Capacitors | | | |

    | 2 | 100n | C3, C4 | X7R capacitors |

    | 2 | X | C1 or C2, C5 or C6 | Radial electrolytic as per data sheet |

    | Semiconductors | | | |

    | 2 | 3mm LED | D2, D4 | 3mm through-hole red or other colour LEDs - optional
    |

    | 2 | 1N4007 | D1, D3 | 1N4007 or similar - optional |

    | 1 | LM317T | U1 | LM317T or other pin-compatible regulator IC |

    | Connectors | | | |

    | 1 | 2 pole PCB terminal | P1, P2 | PCB screw terminal connector |


    # Setting the Voltage


    A fixed voltage regulator can be used on the universal power supply board provided
    that it is pin compatible with the LM317T. Make sure that the device is pin compatible
    before using it by checking the data sheet for the device. It is also possible
    to use a LDO regulator.


    When using an LM317T regulator, the table below can be used as a quick reference
    to select the correct resistor combination for the desired output voltage. In
    cases where the resistance of R3 + R4 + R5 did not exactly match the calculated
    resistance, the voltage calculated for the selected resistor combination is displayed
    in the Output Voltage column after the forward slash, i.e. voltage is displayed
    as desired voltage / actual voltage.


    # Warning


    Always test the output voltage of the power supply with a voltmeter before using
    it to power a circuit.


    Remember, the higher the input voltage, the more likely you will need to put a
    heat sink on the regulator, especially if the circuit being powered is drawing
    a lot of current.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# Appendix B - Universal Power Supply


    | Input Voltage | Output Voltage | R3 | R4 | R5 | R1 (in LED) | R6 (out LED) |

    |---|---|---|---|---|---|--|

    | 18V to 24V | 15V | 2k2 | 470 | 300 | 2k2 to 4k7 | 1k to 4k7 |

    | 15V to 24V | 12V/11.99 | 2k2 | 120 | 0 | 2k2 to 4k7 | 1k to 3k3 |

    | 12V to 15V | 9V/9.07 | 1k | 470 | 220 | 2k2 to 3k3 | 1k to 2k2 |

    | 8V to 12V | 5V | 470 | 330 | 10 | 1k to 2k2 | 330 to 1k |

    | 7V to 12V | 3.3V/3.29 | 330 | 100 | 10 | 680 to 2k2 | 180 to 680 |

    | 5V to 12V | 1.8V/1.81 | 120 | 0 | 0 | 680 to 2k2 | N/A |


    The table is a guide for quickly building a circuit with the desired output voltage.
    If you need a more accurate voltage or want a different voltage to the ones in
    the table, then calculate it using the formula from the regulator''s data sheet
    and fill your calculated values into the empty space provided in the table for
    quick reference in the future.


    You may not have the values of resistors shown in the table in stock, you will
    then need to change the resistor combination to get as close as possible to the
    calculated value.


    Values for the input and LED current limiting resistors in the table are also
    just a rough guide (R1 and R6). For more accurate values, do a calculation.


    Calculating the output resistor combination

    To calculate the total resistance for R3, R4 and R5 for a specific output voltage
    using an LM317T and assuming that R2 has a value of 270\Omega, use the following
    formula:


    ```

    R=270 \times \frac{V_o}{1.25}$

    ```


    Where:

    R = R3 + R4 + R5

    Vo= Desired output voltage'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# Appendix B - Universal Power Supply


    Example:

    Calculate the R3, R4, R5 resistor combination for a 5V output.


    ```

    $R=270\left(\frac{V_0}{1.25}-1\right)\n=270\left(\frac{5}{1.25}-1\right)\n=810\Omega$

    ```


    This $810\Omega$ resistor combination can be made from a $470\Omega$, $330\Omega$
    and $10\Omega$ resistor.


    # Design Ideas


    For an even more versatile power supply board, add a resistor in parallel to either
    R3, R4 or R5. In this way it is possible make even more resistor combinations
    to obtain the desired final resistance. E.g. need a $75\Omega$ resistor in the
    combination, but don''t have one? Use two $150\Omega$ resistors in parallel.


    Another idea is to add a pre-set potentiometer to the resistor combination, but
    keep its value low so that if it is turned fully in one direction or the other,
    it will not be so far out of range that it will cause the circuit being powered
    to be damaged. The pre-set potentiometer can then be used to fine-tune the output
    voltage.'
  merge: -1
  img_proc: true
