- pgno: 191
  md: '# 6.2 MSP430 Programming Software


    The GCC C compiler for MSP430 microcontrollers is available in the Mint Software
    Manager. MSPDebug, which is used for programming MSP430s, is also available in
    the Software Manager.


    # 6.2.1 Installing a MSP430 C compiler


    In the Software Manager, search for gcc-msp430 (or just msp430). Installing gcc-msp430
    will install all the necessary components for the compiler including the library
    and binary utilities.


    Start a terminal window and test that the compiler was installed successfully
    by entering: msp430-gcc --version

    Version and copyright information should be displayed.


    # 6.2.2 Installing MSPDebug


    Install MSPDebug from the Software Manager (mspdebug). To test the installation
    by getting back help information, enter:

    spspdebug --help


    # 6.3 The MSP430 LaunchPad


    The LaunchPad board supports all MSP430G2xx and MSP430F20xx devices in DIP14 and
    DIP20 packages which can be plugged into the 20-pin DIP socket on the board. It
    is USB powered and can program the target MSP430 microcontroller via the USB port.
    Information on the LaunchPad can be found on the Texas Instruments website at
    www.ti.com/launchpad. There are LaunchPad kits for other microcontrollers besides
    the MSP430, so click MSP430 on the LaunchPad web page.


    The user''s guide, which includes the schematic diagram for the LaunchPad, can
    be found with the accompanying files in CH06/Launchpad/slau318.pdf. The part number
    for the LaunchPad kit is MSP-EXP430G2.'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# 6.3.1 LaunchPad Features


    The LaunchPad kit contains the following:


    +   - LaunchPad development board

    - Mini USB-B cable, 0.5 m

    - Two MSP430 flash devices – a MSP430G2231 and MSP430G2211

    - 10-pin PCB connectors (two male and two female)

    - 32.768-kHz crystal

    - Quick start guide

    - Two LaunchPad stickers


    # Launchpad Microcontrollers


    The two microcontrollers included in the LaunchPad kit have the following features:


    # MSP430G2231:


    +   - 2kB Flash memory and 128 bytes of RAM (preloaded with a sample program)

    - Universal Serial Interface (USI) for SPI and I2C

    - 10-bit 8-channel ADC


    # MSP430G2211:


    +   - 2kB Flash memory and 128 bytes of SRAM

    - Analog comparator


    # Both chips feature:


    +   - 16-bit timer

    - 10 GPIO pins

    - In-system programmable

    - Spy-Bi-Wire interface for emulation


    # LaunchPad Board


    The LaunchPad board features:


    +   - A 20-pin DIP socket for inserting 14 or 20 pin MSP430 microcontrollers

    - Two programmable LEDs

    - One power LED

    - One programmable button

    - One reset button

    - Programming and debugging via the board’s USB port'
  merge: -1
