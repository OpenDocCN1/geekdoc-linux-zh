- pgno: 164
  md: '# 5.2.7 More on avrdude


    To read the device ID of the AVR in the test circuit, open a terminal window and
    enter:

    sudo avrdude -c dragon_isp -p t2313 -P usb -B 3.0


    To program the AVR in the test circuit with the test program, open a terminal
    window and change to the directory containing the hexadecimal program file. Enter
    the following:

    sudo avrdude -p t2313 -c dragon_isp -P usb -e -u flash:blink.hex -B 3.0


    The AVR Dragon tries to communicate with the AVR in the test circuit at a speed
    that is too fast. The -B 3.0 switch avrdude slows this down to avoid errors. If
    you still have problems, try increasing the 3.0 to 4 or higher.


    # 5.2.7 More on avrdude


    Using avrdude without the need for sudo command


    So far, every time that we have programmed an AVR microcontroller, it has been
    necessary to get root privileges by using the sudo command in order to gain access
    to the hardware device used during programming. The first time that the command
    is used, the user''s password has to be entered, after this programming can take
    place without entering the password again until a time-out period after which
    it must be re-entered. If the terminal window is closed and a new one opened,
    the sudo command and the password will be required again. This can become annoying
    after a while. It is possible to set up the hardware programming devices in Linux
    so that root privileges are not needed. A file needs to be copied to a file system
    folder as described here (this will provide configuration for the USBtinyISPmkII
    and AVR Dragon):


    +   * To start the file manager as root: Press Alt + F2

    * Enter gsudo caixa in the dialog box that opens

    * Navigate to /etc/udev/rules.d/

    * In another file manager, open CH5/avrdude/ from the accompanying files.

    * Drag and drop avrdude.rules from CH5/avrdude/ to /etc/udev/rules.d/

    * Start a terminal window and enter sudo restart udev

    * If one of the programming devices is plugged into the USB port, unplug it and
    then plug back in.

    * You will now be able to leave the sudo command off all of the previous programming
    commands.

    If there are any problems after making this modification, try rebooting the computer.'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# 5.3 AVR Circuits


    In this section, we will look at setting up some circuits to get started developing
    with the AVR devices mentioned at the beginning of this chapter. Simple C programs
    are provided containing examples of reading inputs and writing outputs. All these
    AVRs have internal R/C oscillators, so it is not necessary to have an external
    circuit connected, if accurate timing is required.


    The example programs can be found with the accompanying files in CH5/AVR_progs.
    Each example folder contains a source code file as well as a **build** and **prog**
    file. The **build** file is a script file that needs to be marked as executable
    and then run to build the project and output a hex file for programming the AVR.
    The **prog** file is also a script file that needs to be marked as executable
    and run to program the AVR. This file has been set up to use USBisp and also includes
    the sudo command, so modify it if you set your Linux PC to operate the programmer
    without the sudo command (i.e. remove the sudo command from the file). Also modify
    it if you are using a programmer other than the USBisp.


    With the information from these files, it is possible to make your own "make"
    file instead of using script files to build the programs and program the AVR.


    # Using script files


    Just a reminder – to mark a script file as executable, right-click it and then
    choose **Properties** from the pop-up menu. In the Properties dialog box, click
    the **Permissions** tab. Check the **Allow executing file as a program** and then
    close the dialog box. Or use this command in a terminal window: `chmod +x <filename>`


    The file will now be able to run by double-clicking it and then clicking **Run**
    in the dialog box that pops up. In a terminal window when changed to the directory
    containing the script files, they can be run by entering ./<file name>, e.g. ./build'
  merge: -1
  img_proc: true
