- pgno: 102
  md: '# 3.3 Using the Newly Created Component


    The newly created component can be used in a new KiCad project. Because it has
    been saved in a sub-folder of your home folder, you will need to open this new
    library in each of the KiCad programs (EESchema, etc.). If the project is then
    copied to a different PC, it will try to access the new library components from
    the same home directory, so if you are not working from a home directory with
    the same name on the new PC and you have not copied the library files to a folder
    in the same location with the same name as the original, KiCad will not be able
    to find the library components on the new PC. It is possible to copy the libraries
    to the new PC, open the project and then point it to the new location of the libraries.


    Alternatively, the newly created libraries can be installed in the file system
    as discussed in section 3.4 below. If you decide to install the new library in
    the file system, I would suggest always keeping a copy of the libraries in your
    local folder so that they can be easily edited if new components are to be added
    and also that you remember to back them up.


    # 3.3.1 Using the New Library in EESchema


    +   - In an EESchema project, on the main menu, click **Preferences → Library**.

    - In the dialog box that opens, click the **Add** button next to the **Component
    library files box**.

    - In the Library files: dialog box, navigate to the new library in your home folder,
    e.g. to **/home/user/KiCad/Library** and open the **my_library.lib** (or whatever
    you named your new library). Click **OK** to close the first dialog box.


    +   - You will be prompted to save the project settings. This will save the reference
    to the new library in the project so that any components used from it will be
    found every time that the project is opened, so click the **Save** button in the
    dialog box.

    - It is now possible to place the XTAL component using the “Place a component”
    icon on the right toolbar.


    # 3.3.2 Using the New Library in CVpcb


    +   - After using the new component in EESchema and generating a netlist, start
    CVpcb.

    - CVpcb will not be able to find the new footprint until you tell it where the
    new library is.

    - In CVpcb, click **Preferences → Options.**


    ![](img/3c46617540546e0091f48cc286948fbe_102_0.png)'
  merge: -1
  img_proc: true
- pgno: 103
  md: '+   * In the dialog box that pops up, click the top Add button.


    +   * In the dialog box that opens, navigate to your new library and open it.


