    the test circuit.


    # Testing the programmer and programming the AVR


    With the programmer of figure 5.3 plugged into the parallel port of the PC and
    connected to the circuit of figure 5.2, we can run avrdude to test the programmer
    and load a program to the AVR.


    Switch power to the test circuit and then start a terminal window and enter the
    following:

    sudo avrdude -c bsd -p t2313 -P /dev/parport0`


    Enter your login password when prompted for a password. If the circuit was wired
    successfully, avrdude will report that the AVR has been initialized and read back
    a device signature. If the parallel port on your PC is not named par0, avrdude
    will report that it can''t be opened. If the circuit is not powered, avrdude will
    report that the device is not responding.


    Our next step is to load a program into the AVR. To load the blink program mentioned
    earlier, start a terminal window and change to the directory containing the blink.hex
    file. Now enter the following:


    sudo avrdude -p t2313 -c bsd -P /dev/parport0 -e -U flash:w:blink.hex`


    This will erase, program and verify the AVR. After programming, you will need
    to remove the RESET line of the programmer from pin 1 of the AVR to take it out
    of reset and see the LED flashing.


    # 5.2.3 Serial Port AVR Programmer


    Figure 5.4 shows a simple AVR programmer that interfaces to the PC through a 9-pin
    serial port. This design is available on several websites on the Internet and
    is easy to build upon.


    Strictly speaking, this programmer should not actually work. This is because the
    RS-23 voltage levels on the serial port are meant to be +3V to +15V for a logic
    high and -3V to -15V for a logic low. I built this circuit and tested it on my
    PC and it worked, but it is not guaranteed to work on every PC. It works because
    the PC serial port is not adhering strictly to the RS-23 voltage levels and registering
    0V as a logic low.'
