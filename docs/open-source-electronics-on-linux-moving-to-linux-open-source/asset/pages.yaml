    all microcontrollers supported by avrdude are avrdude.conf found in /etc.. This
    configuration file could be modified to add support for the ATtiny48, however
    avrdude also looks in another configuration in the user''s home folder .avruderc
    which is not created by default. In order to program the ATtiny48 with avrdude,
    the easiest way is to copy the configuration file from the accompanying files
    into your home folder as follows:


    Find the configuration file with the accompanying files in:

    CH05/avrdude/avruderc

    Copy .avruderc file to your home folder and rename it to .avruderc (just add a
    dot in front of the file name) which will make it into a hidden file. When avrdude
    is next run, it should recognise the ATtiny48 microcontroller.


