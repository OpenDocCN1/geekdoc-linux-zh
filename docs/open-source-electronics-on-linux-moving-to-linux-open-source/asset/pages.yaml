- pgno: 128
  md: '# 4.5.1 Setting Up and Testing the Arduino and Ethernet Shield


    # 4.5.1 Setting Up and Testing the Arduino and Ethernet Shield


    # Plugging the shield in


    After purchasing the Ethernet shield, you will need to plug it into the Arduino
    board. It is impossible to plug the Ethernet shield into the Arduino the wrong
    way around. The shield plugs into the two sets of connectors on either side of
    the Arduino as well as the ICSP header at the end of the board. Plug the Ethernet
    cable from your hub/switch/router to the RJ-45 connector on the shield and then
    power it by connecting the USB cable from your PC to the Arduino USB connector.
    To connect to the Arduino board via Ethernet, your PC will need to be connected
    to the same hub, switch or router via another ethernet cable.


    # Loading a program to test the Ethernet shield


    Start the Arduino IDE and open the WebServer sketch: File -> Examples -> Ethernet
    -> WebServer. We now need to change a few things in the program before compiling
    and loading it. Look under your Ethernet shield and connect the sticker that contains
    a number on it. In the WebServer program, replace the numbers on the line below
    with the numbers on the sticker:


    ```

    byte mac[] = { 0xDE, 0xAD, 0xBE, 0xEF, 0xFE, 0xED };

    ```


    The sticker contains hexadecimal numbers without the "0x" in front of it, so just
    substitute them in the above line after each "0x".


    Now save the program. You will not be able to overwrite the example program, so
    save it to a folder in your home folder, e.g. sketch/WebServer using File -> Save
    As... When you save it, the WebServer folder will automatically be created for
    you and the source file saved in it.


    We may need to change the IP address in the program, compile and load the program
    for now. Open your web browser (e.g. Firefox) and in the URL field, enter the
    IP address of the board which is 192.168.1.177 – just type it in and press Enter.


    ```

    IPAddress ip(192,168,1,177);

    ```


    to:


    ```

    IPAddress ip(10,0,0,20);

    ```


    Save, compile and load the program again. Go to your web browser and hit type
    10.0.0.20 in the URL field and hit Enter.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# Chapter 4. Open-source Hardware: Arduino


    # Finding your Ethernet settings


    If you are having trouble finding the correct IP address to use with your Arduino,
    right-click-the network connection (it looks like two diagonal plugs connecting)
    on the Linux Mint panel and then click Connection Information on the menu that
    pops up. The field marked IP Address: should give you a clue as to which range
    to use. The address next to this field will be the IP address of your PC, so choose
    an address for your Arduino that starts with the same numbers as the first three
    of your PC and choose a different one for the last. E.g. if you PC''s IP address
    is 10.0.0.4, choose 10.0.0.55 or 10.0.0.20 as long as there is not another device
    on the network with the same address, should work.


    # Ethernet problem solving


    If your browser won''t connect to the Arduino board, open a terminal (ctrl + alt
    + t) and enter `ping <ip address>` (e.g. ping 10.0.0.20) to see if a response
    can be obtained from the board. If the board is correctly connected, the ping
    program will receive data back from the board every time that it sends data. You
    will see this data response in the terminal window. To stop the ping program,
    press Ctrl + c.


    # Reading the values over Ethernet


    After connecting the web browser to the Arduino board, the browser should display
    analog values from the analog inputs A0 to A6 similar to the following:

    analog input 0 is 1023

    analog input 1 is 1023

    analog input 2 is 816

    analog input 3 is 604

    analog input 4 is 443

    analog input 5 is 360


    Press F5 (or Ctrl + R) in the browser will refresh the values. They should change
    each time F5 is pressed, as the inputs will pick up some noise resulting in the
    values changing. A potentiometer can be connected to any of the inputs A2 to A5
    - connect the wiper of the pot (centre pin) to one of the analog inputs, and one
    connection to 5V and the other to GND. Varying the potentiometer value and pressing
    F5 should change the value in the browser. If you don''t have a pot handy, connect
    one of the inputs to 5V, refresh the browser and then disconnect the input from
    5V and connect it to GND, then refresh again. The value displayed should change
    from 1023 when 5V is applied to 0 when GND is applied. You can also try reconnecting
    the 3.3V pin on the Arduino board. Analog inputs A0 and A1 display as 1023 because
    they are used by the microSD card socket and have two 10k pull-up resistors connected
    to them.


    128'
