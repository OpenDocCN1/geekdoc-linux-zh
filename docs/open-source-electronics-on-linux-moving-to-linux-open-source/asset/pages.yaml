    +   * Click the “Highlight net” icon (figure 2.10, ®) on the right toolbar and
    then click a track or pad to highlight all connections to it. This feature is
    especially useful when inspecting tracks on larger or multi-layered boards.


    +   * To un-highlight the track, click anywhere on the background or click the
