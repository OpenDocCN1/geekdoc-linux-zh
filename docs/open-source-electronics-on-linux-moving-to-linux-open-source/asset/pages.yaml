- pgno: 82
  md: '# 2.4 KiCad Tutorial 2 – IC Circuit


    +   - Zoom in to any of the gates to see the hidden pins after clicking the “Show
    hidden pins” icon. The hidden power pins are named VCC and GND and are pin numbers
    14 and 7 on this IC.


    +   - Click the “Place a power port” icon on the right toolbar (4th icon from
    the top) and then click on the schematic.


    +   - In the component selection dialog box that pops up, click the List All button.


    +   - Scroll down the list in the dialog box and click “GND” and then click the
    “OK” button in the dialog box. (Or just type GND into the Name: field of the component
    selection dialog box)


    +   - Place a “GND” point on the lower rail of the main circuit and connect a
    second one to the unused inputs of the NAND gates. The “GND” symbol is a small
    triangle as can be seen in figure 2.17. Press Insert to place the second one.


    +   - With the “Place a power port” icon still highlighted, click on the schematic.


    +   - This time place a “VCC” power port and connect it to the top power rail
    of the circuit as shown in figure 2.17.


    +   - The names of the power ports placed are VCC and GND. These are the same
    names as the hidden power pins of the 7400 and this is what connect them together
    – having the same names.


    +   - We also need to place PWR_FLAG power ports in order to tell KiCad which
    points are connected to a power source. If this is not done, the electric rules
    check (ERC) will generate errors.


    +   - Use the same method that you used to place GND and VCC, but this time select
    the PWR_FLAG component and place two of these as shown in figure 2.17.


    Tut 2-6 Place no-connect flags on unconnected pins


    +   - Click the “Place no-connect” flag on the right toolbar (it looks like an
    x).


    +   - Place no-connect flags on the two unused gate outputs (pins 3 and 6 of the
    IC).


    +   - This will prevent an unconnected pins warning from occurring during the
    electric rules.'
