    # 5.5.2 Resetting the Fuses


    The default values for an AVR''s fuses can be found in its datasheet. When using
    avrdude, the switch for the type of programmer must change from the value that
    was used when using the AVR Dragon as an ISP programmer – it must now be dragon_pp
    for using the AVR Dragon in parallel mode. See the example below.


    Example – resetting the ATtiny2313 fuses:


    From the ATtiny2313 datasheet, the fuse values are 0xDF for the high fuse byte
    and 0x64 for the low fuse byte.'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'Assuming Linux has been set up to use the AVR Dragon without root privileges
    (without the need for the sudo command), and that the ATtiny2313 has been wired
    up as explained, plug the AVR Dragon into the PC''s USB port, start a terminal
    window and enter:


    ```

    avrdude -p t2313 -c dragon_pp -P usb -U hfuse:w:0xdf:m -U 1fuse:w:0x64:m -B 3.0

    ```


    This will set the fuse values of the ATtiny2313 to 0xDF for the high fuse byte
    and 0x64 for the low fuse byte. The AVR should once again be programmable in ISP
    mode without the need for an external crystal.


    Remember that if you are using a different AVR to the ATtiny2313, you will need
    to use the correct wiring diagram for the particular AVR as well as check what
    its default fuse values are in its datasheet.'
  merge: -1
