- pgno: 179
  md: '# Chapter 5. AVR 8-bit Microcontrollers


    # 5.4.5 JTAG


    The JTAG interface can be used to both program and debug the AVR. Use the circuit
    diagram of figure 5.15 and the program included with the accompanying files found
    in CH05_progs/dbg_ATmega16_blink/ for the JTAG example, but dont connect the 6
    pin ISP header to the microcontroller as shown in the circuit diagram, it is necessary
    to use the 10 pin JTAG header.


    On the AVR Dragon, you will need to connect a 10-way ribbon cable with 5 × 2 female
    IDC connectors on each end to the header marked “JTAG” on the Dragon board. Use
    one of the 10-way sockets on the JTAGICE mkII for the JTAG connector.


    Figure 5.15 shows the ISP connections to the ATmega16, but we need to use the
    JTAG connections. They are mapped from the ATmega16 to the 10-pin JTAG header
    as shown in table 5.1.


    | Table 5.1: JTAG Header to ATmega16 Connections |

    | JTAG signal | JTAG pin | ATmega16 pin |

    | TCK | 1 | 24 |

    | GND | 2 | GND, 11, 31 |

    | TDO | 3 | 26 |

    | VTref | 4 | Vcc, 10 |

    | TMS | 5 | 25 |

    | nRST | 6 | 9 |

    | | 7 | Not connected |

    | nTRST | 8 | Not Connected |

    | TDI | 9 | 27 |

    | GND | 10 | GND, 11, 31 |


    # Compile the program


    Start a terminal window and change to the directory containing the example program
    to compile. Enter the following to compile the program:


    ```

    avr-gcc -g -00 -Wall -mcall-prologues -mmcu=atmega16 ATmega16_blink.c -o blink.out

    ```'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# 5.4.6 Debugging


    # Start avarice


    Start a terminal window, change to the directory containing the program to debug
    and enter:

    Using the JTAGICE mkII


    ```

    avarice --erase --program --file blink.out --part atmega16 --mkII

    --jtag usb :4242

    ```


    # Using the AVR Dragon


    ```

    avarice --erase --program --file blink.out --part atmega16 --dragon

    --jtag usb :4242

    ```


    This will cause to program the AVR with the program to debug and then wait for
    a connection by avr-gdb. After running this line, the last two lines that avarice
    displays should be:

    Download complete.

    Waiting for connection on port 4242.


    # Start Nemiper


    Start a new window, change to the directory containing the program to debug and
    then start

    Nemiper by entering the following:


    ```

    nemiver --gdb-binary=/usr/bin/avr-gdb --remote=localhost:4242

    blink.out

    ```


    Close the two dialog boxes that pop up.


    # Opening the source file in Nemiper


    In Nemiper, click File > Open Source File ... In the Open Source Files dialog
    box, find and select

    tblink.c source file as shown in figure 5.18. Click the OK button in the dialog
    box.


    # 5.4.6 Debugging


    You are now ready to debug the program. Refer to figure 5.19 when reading this
    Section. In Nemiper,

    start clicking to the left of the first line of the program in main (), but to
    the right of the line

    number to add a breakpoint, or click on this line and then Debug -> Set Breakpoint
    from the

    top menu. A red breakpoint icon will appear to the left of this line to show that
    a breakpoint has been

    set on it.'
