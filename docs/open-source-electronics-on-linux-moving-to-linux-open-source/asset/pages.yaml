  md: '# Chapter 4. Open-source Hardware: Arduino


    # Sending data to the Arduino board from the PC


    Data can be sent from the Arduino Serial Monitor to the Arduino board. An example
    program that does this is PhysicalPixel. Load this program to the Arduino and
    send a “L” from the serial monitor to switch the LED on pin 13 and send a “H”
    to switch it on. Note that these letters must be capitals and not lower-case.
    Just type the letter into the serial monitor program and then hit Enter or click
    the Send button.


    PhysicalPixel:

    in the Arduino IDE - File → Examples → 4.Communications → PhysicalPixelnWeb page
    - arduino.cc/en/Tutorial/PhysicalPixel


    Instead of using the Serial Monitor with this program, you can connect to it using
    a program running on the PC that is written in the “Processing” language. The
    actual code for the program is in the bottom of the PhysicalPixel code that you
    compiled and loaded to the Arduino board. It is commented out, so the idea is
    to copy it from there and paste it into the Processing IDE and then uncomment
    and run it. The instructions that follow describe how to do this. When the program
    is running, a window will open with a square in it. Whenever the mouse cursor
    is moved over the square, the “L” LED on the Arduino board will switch on. When
    the cursor is moved off the square, the LED switches off.


    # Running the PhysicalPixel Processing program:


    +   - Go to the Processing website, www.processing.org, click on the “Download”
    link.

    - On the download page, click the link for Linux, e.g. Linux 32-bit to download
    the file named processing-2.0b3-linux32.tgz or similar, depending on the current
    version number. At the time of writing, the newest version of Processing was 2.0
    Beta 3, and although not the latest stable release is preferable to using version
    1.5 which has problems connecting to the Arduino USB port in Linux.

    - Double-click the downloaded file and drag and drop the contents onto your desktop.
    This is a folder named processing-2.0b3 for the 2 Beta 3 version.

    - Double-click the folder to open it, then double-click the processing file inside
    and click the Run button in the dialog box that pops up (figure 4.6).


    120'
