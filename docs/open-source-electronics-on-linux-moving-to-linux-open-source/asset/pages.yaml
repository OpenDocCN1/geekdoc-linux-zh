- pgno: 28
  md: '# 1.6.8 Switching off Sounds


    # 1.6.5 Mouse Operation


    Sometimes a menu/drop-down-box, etc. that that you click in a Linux application
    will disappear when you release the left mouse button. You need to then click
    and hold the mouse button and drag the cursor down to the item that you want and
    then release the mouse button to select the menu item. You may find yourself using
    this “click, drag to select, release” action automatically after using Linux for
    a while, rather than using the Windows “click, release, move to select, click
    to select, release” action even when not specifically required.


    Traditionally applications written for Unix systems such as Linux have used the
    middle mouse button more than Windows applications, so look out for applications
    that may make use of the middle mouse button – usually pushing in the mouse wheel
    acts as the middle mouse button on modern mice.


    # 1.6.6 Switching the Screensaver Password On Off


    By default, the screensaver will start after a set number of minutes of inactivity
    on the keyboard and mouse, and by default the screensaver will not lock the screen
    to protect your computer from unwanted access if you leave the computer unattended
    for a length of time. If you are in an environment where you think it necessary
    to switch on the screensaver password, you can enable it by clicking Menu → Control
    Center and then clicking Screensaver in the Control Center dialog box. In the
    Screensaver Preferences dialog box that pops up, you will be able to enable the
    screensaver password (check the box – Lock screen when screensaver is active)
    and also change other screensaver settings.


    # 1.6.7 Changing the Desktop Wallpaper


    Right-click on the desktop and select Change Desktop Background from the menu
    that pops up. Select a background image in the dialog box.


    # 1.6.8 Switching off Sounds


    Switching off the sound at the login screen and music after login:


    A sound is played after booting up and arriving at the login screen. Some music
    is played after logging in. To switch these sounds off, first select Menu > Control
    Center. In the Control Center dialog box, scroll down to System, or click System
    in the left pane of the dialog box. Now click the Login Window icon. You will
    need to enter your password next – use the same password that you used to log
    in. The Login Window Preferences dialog box will open. Click the Accessibility
    tab. You will now be able to disable or change the two login sounds.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Chapter 1. Linux Basics


    # 1.6.9 Changing the Time and Date


    The time and date is displayed to the right of the bottom panel. Clicking the
    time and date will make the current month''s calendar pop up.


    To change the time and date, right-click the time and date on the bottom panel
    and select Preferences from the pop-up menu. In the Clock Preferences dialog box,
    click the Time Settings button. Use the Time & Date dialog box to change the system
    time and date to the desired values and then click the Set System Time button
    to save the changes. You will need to enter your password to save the changes.


    # 1.6.10 Adding a Network Activity Display


    It''s nice to have a visual display of what is happening on the network i.e. how
    much data is being sent and received over the PC''s Ethernet connection (figure
    1.7).


    To add a network activity display to the bottom panel, right-click the bottom
    panel and then click Add to Panel... on the pop-up menu. Find the System Monitor
    item in the list, click it and then click the Add button. The system monitor icon
    will appear on the bottom panel. It can be positioned in the same way as the Workspace
    Switcher. By default, the System Monitor shows CPU activity, to it to display
    network activity, first-right-click and then click Preferences on the pop-up menu.
    Now check the Network box and uncheck the Processor box. If you would like to
    change the colours for the network activity icon, click the Network tab in the
    dialog box which will give you access to controls to do.


    # 1.6.11 Adding Users


    By adding extra users, a single computer can be shared between two or more people
    without affecting each other''s settings and user data. An extra user account
    can also be added if you want to do some experiments with various settings, but
    don''t want to mess up your main account settings.


    When adding a new user, it is possible to give the new user administrator privileges
    which means the user will be allowed to make changes to the Linux system, including
    deleting important operating system files, so be sure to grant administrator privileges
    to trusted persons only.


    To add a user, click Menu > Control Center. In the Control Center dialog box,
    click System in the left pane and Users and Groups in the right pane. In the Users
    Settings dialog box, click the Add button to add a new user - you will need to
    enter your password. In the new user dialog box, enter the new user''s name and
    username and then click the OK button. In the Change User Password dialog box,
    enter the new user''s password and then click the OK button.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# 1.7 The Linux File System


    The Advanced button will open a dialog box that will enable you to change the
    new user''s privileges and other settings.


    The new user will now be able to log in with the new user name and password which
    will load his own personal settings. New user directory will also be created in
    the home directory of the system where the user will store his own files. The
    new user''s settings will be the same default settings that the initially created
    account had after installing the system, so the tasks that we previously did such
    as adding a workspace switcher, etc. will need to be done for the new user.


    # 1.7 The Linux File System


    There are some concepts that need to be understood about the Linux file system,
    especially if you are coming from a Windows system.


    Windows has a C: drive or partition as the main location for storing the operating
    system files and the user''s files and has a D: drive or partition for extra storage
    space, Linux incorporates hard-drives and partitions as part of the file system
    as we shall see shortly.


    To examine the Linux file system, start the file manager by clicking Menu -> Home
    Folder to start the Caja file manager (Caja is the file manager in Linux Mint,
    Nautilus is the file manager in Ubuntu). We must navigate to the root directory
    of the file system by clicking the File System icon in the left pane of the Caja
    file manager. You will see the file system directories in the file manager as
    shown in figure 1.8.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Chapter 1. Linux Basics


    ![](img/3c46617540546e0091f48cc286948fbe_31_0.png)


    The file system directories are listed below with their functions:


    +   - /bin - contains binary executable applications: commands used in a terminal
    window.

    - /boot - files for booting Linux.

    - /cdrom - CD ROMs will appear in /media and not in this folder any more.

    - /dev - hardware devices. All devices on the computer system represented as files.
    Some of the electronic devices that we make in this book will appear here when
    plugged into the computer.

    - /etc - configuration files for the system.

    - /home - contains the directories of users of the system. Each user will have
    his own directory in /home named after his user name containing his own user files
    and settings.

    - /lib - system libraries.

    - /lost+found - lost files.

    - /media - mounted devices as Flash drives, CDs/DVDs, etc.

    - /mnt - for temporarily mounted file systems.

    - /opt - optionally installed software.

    - /proc - processes - a virtual file system used by the kernel.

    - /root - home folder of the root user or superuser. The root user can change
    anything in the system.

    - /run - used during booting.

    - /sbin - system binaries that are used by the superuser.

    - /selinux - Security-Enhance Linux (SELinux) directory.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# 1.8.1 Application Installation Example


    +   /srv - can contain data directories for HTTP or FTP services.

    /sys - system information.

    /tmp - temporary files used by applications are stored here.

    /usr - applications, libraries and documentation for users.

    /var - variable data - system data such as logs, databases, etc.


    As a user of Linux, you won''t have to do with directly with most of these file
    system directories. You will learn and understand more about the Linux file system
    as you use Linux. There is a link to a free e-book at the end of the chapter that
    specifically covers Ubuntu, most of which applies to Mint, so rather than wasting
