  md: '# 4.5.3 Implementing an Arduino Web Server


    are printed as DA0 and 0DA as the Arduino function used to print these characters
    does not the printing 0. The result is that hexadecimal in the Serial Monitor
    will end with 0DA and if you happen to see 0DA0, the first zero is the second
    digit of the preceding (last visible) character on the line.


    Now that we know the last character of a request from the web browser is A0, we
    can check for this character in our programs to see when the request that is being
    received has ended. A0 can also be referred to as ''\n'' in a program, so we can
    look for ''\n'' in our program.


