- pgno: 140
  md: '# KiCad Design Notes – LED wheel


    # Schematic


    **Using net names:** In the schematic diagram for the LED wheel shield, net names
    are used to connect the LEDs to the connectors. This is done by clicking the “Place
    a net name” button on the right toolbar in EESchema and then clicking on the wire
    to place the net name. Wherever two wires have the same name, they will be connected.
    When a netlist is generated and imported into PCBnew, the net name connections
    will be imported as well as PCBnew indicate these connections with the guiding
    lines and “ratnest” lines just as the connections had been made with wires in
    the schematic.


    # PCB


    **Placing surface mount components:** Surface mount components will automatically
    be placed on the top layer of the PCB (shown in red with default KiCad settings).
    If parts need to be placed under the board, they can be flipped using the **F**
    key. All parts for the LED wheel shield were placed on the top layer (called “Front”
    in KiCad).


    **Routing on the top layer:** To route the components on the top layer, select
    the **Front** layer under the **Layer** tab on the right of PCBnew before you
    start routing.


    **Rotating components to specific angles:** Hover the cursor over the part to
    rotate and press the **E** key. In the **Module properties** dialog box that pops
    up, click the **User** radio button under **Orientation**. It is now possible
    to enter the angle to rotate the component to in the **Orientation** field. 1
    unit entered in the orientation field is equivalent to a 0.1 degree rotation,
    so to rotate the component to 30 degrees, 300 must be entered.'
  merge: -1
