- pgno: 244
  md: '# Appendix A – Home Made PCBs


    ![](img/3c46617540546e0091f48cc286948fbe_244_0.png)


    Figure A.6: Cutting the Printed Photo Paper to Size


    # Preparing the Copper-clad Board


    The copper-clad board must be cut slightly bigger than the final PCB size and
    then cleaned of dirt and grease. The size of the board can be measured from the
    printed photo paper or determined from the KiCad PCB file and then checked against
    the printed photo paper before cutting the board.


    # Determining the Board Size


    The copper-clad board must be cut slightly bigger than the final size of the PCB.
    If you don''t know the size that the finished PCB must be, either measure it on
    the printed photo paper, or open the PCB layout in KiCad PCBnew and measure it.


    To measure the size of the board in PCBnew, move the cursor to the top left corner
    of the PCB outline, zoom in for a better view. If you can''t move the cursor exactly
    onto the corner of the board, change the grid size. You may need to change between
    inches andimetres and then change the grid size, depending on whether the board
    outline was created usingimetres or inches. Make sure that you can place the cursor
    on the bottom right corner of the PCB outline too.


    243'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# Appendix A – Home Made PCBs


    With the cursor on the top left corner of the PCB outline, press the space bar
    to reset the local coordinates that are displayed in the status bar of PCBnew
    – they should display as dx 0.000 dy 0.000 after the reset. Now move the cursor
    to the bottom right corner of the board and read the coordinates to determine
    the size of the board, e.g. if working in millimetres and the coordinates are
    dx 100.000 dy 80.000 the board is 100mm × 80mm.


    Another way to measure the board is to change to the Drawings layer of the PCB
    and place dimensions on the board using the Add dimension icon on the right toolbar.
    Placing dimensions above or below and also to the left or the right of the PCB
    will allow the PCB size to quickly be determined as shown in figure A.7.


    Cut the clad board 5mm bigger or more than the PCB outline along the length and
    width. E.g. if the PCB is 100mm × 80mm, then the copper-clad board 105mm × 85mm
    or bigger. This allows easier alignment of the photo paper containing the printed
    copper layer with the copper-clad board.


    ![](img/3c46617540546e0091f48cc286948fbe_245_0.png)


    244'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# Appendix A – Home Made PCBs


    # Cutting the Board


    Safety:


    Wear a dust mask when cutting or filing copper-clad board.


    Be careful when using a knife to score against the steel ruler – use only light
    pressure on the blade and keep the fingers holding the ruler out of the way of
    the blade. There is potential to press too hard on the blade and then slip and
    cut your fingers.


    First mark the board edges on the copper side of the copper-clad board using a
    ruler, square and pencil as shown in figure A.8. Don''t forget to make the outline
    of the board slightly bigger than the finished PCB will be, as already described.


    Using a sharp knife and steel ruler, score the copper-clad board along the pencil
    lines (figure A.9, left). Do not use a lot of pressure when scoring the board.
    After scoring the copper side of the board, you will be able to see the score
    marks through the top of a glass-fibre board and score the top as well. If your
    board is not transparent, then measure and mark the top of the board so that you
    can score it above the previous score marks.


    ![](img/3c46617540546e0091f48cc286948fbe_246_0.png)


    Figure A.8: Mark the PCB Outline on the Copper-clad Board using a Pencil


    245'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# Appendix A – Home Made PCBs


    When the score marks are deep enough, break the excess board off. Break the board
    over the edge of a table top or if the piece that you are cutting off is very
    small, then clamp the piece to break off in a vice (figure A.9, middle and right).
    If the board does not break easily, turn it over and try to break it from the
    other side. Turn it over several times and break it little by little from each
    side. If it still won''t break, try deepening the score marks.


    # Cleaning the Board


    After breaking the excess board off, the main piece of board will have rough and
    rugged edges. Remove these burrs with a fine file. The copper side of the board
    must be absolutely flat with no burrs so that the photo paper can be placed on
    it and iron on flat. Burrs will prevent the iron from making good contact with
    the photo paper and the photo paper with the copper. Use the file at an angle
    on the copper side to remove all burrs as shown in (figure A.10, left).


    Use a fine scourer (figure A.10, right) and clean the copper side of the board
    in a sink or bowl of water. I like to add a drop or two of liquid dish-washing
    soap to the water when cleaning and then rinse the board thoroughly afterwards.
    After washing the board, be careful not to touch the copper side of the board
    or get any dry on it.


    Air dry the board or use some paper towel to speed up the process.


    ![](img/3c46617540546e0091f48cc286948fbe_247_0.png)


    Figure A.9: Cutting the Copper-clad Board to Size

    Left – scoring the board

    Middle – break the board along the score line over the edge of a table

    Right – score and break the smaller edge in a vice'
  merge: -1
  img_proc: true
- pgno: 248
  md: '![](img/3c46617540546e0091f48cc286948fbe_248_0.png)


    Figure A.10: Filing and Cleaning the Copper-clad Board

    Left – file the burrs from the edges

    Right – use a finer scourer to clean the copper surface


    # Creating the PCB


    To create the PCB, the copper layer that was printed on the photo paper must be
    ironed onto the board. This will transfer the toner from the photo paper onto
    the copper layer of the board. The only problem is that the toner is also stuck
    to the photo paper, so it must be removed by soaking it in water. The toner is
    etch resistant, so when the board is etched in ferric chloride, only the exposed
    copper will be removed.


    # Iron the Toner Onto the Board


    Safety:

    Work in a well ventilated area – ironing the photo paper will give off vapours.
    Use a fan to blow the vapours away from the work area.


    Follow the other safety advice presented at the beginning of this appendix for
    working with hot irons and chemicals.


    You need to work on a heat resistant non-slip surface such as a piece of MDF board
    – which is resistant up to a point, don''t apply heat directly to the working
    surface. Pre-heat the clothes iron to its maximum temperature. Place the printed
    photo paper with the printed side onto the copper side of the board. Line the
    photo paper by using the two edges that were cut loose to the PCB edges. Place
    these edges slightly in from the the edges of the copper clad board (figure A.11,
    inset).'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# Appendix A – Home Made PCBs


    ![](img/3c46617540546e0091f48cc286948fbe_249_0.png)


    **Figure A.11:** The Board is Cleaned and Ready for Ironing

    Inset – leave some space around the edges when placing the photo paper onto the
    copper-clad board


    Place the heated iron on top of the photo paper on the copper-clad board and press
    down firmly. After a few seconds pick up the iron and press down again. If you
    need to hold the photo paper in position on the board, then push the iron down
    onto the other half of the board first until the photo sticks to the board, then
    lift the iron up and press down on the un-ironed half. Only when you are sure
    that the card is stuck to the copper can you move the iron bit, pressing down
    and ironing different areas of the board to make sure that all of the toner is
    iron onto the board.


    Don’t forget that the board is going to be very hot, so let it cool down after
    ironing it or pick it up by the excess paper that overhangs the edge of the copper-clad
    board, but be careful not to pull the paper away from the copper. You can also
    push a steel ruler under it to lift it up.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# Remove the Paper


    Drop the board and paper into a sink or bowl of water (**Figure A.12**, left),
    again, I like to add some liquid dish-washing soap because it is easier to remove
    the paper using your fingers and this would just try to introduce oil to the board
    again if not using soap. The paper needs to soak for about ten minutes before
    you try to gently peel some of it away. Normally a layer of paper will peel away,
    leaving some still stuck to the copper. Remove this layer and let it soak some
    more before trying to remove the rest (**figure A.12**, middle). If the paper
    has soaked enough, rub it with a sponge or your fingers to removing the remaining
    paper – do this very gently (**figure A.12**, right).


    Carefully inspect the board to make sure that no white from the paper remains
    on the exposed copper. This can occur between tracks and pads that are close to
    each other. Remove any of this in the basin of water by rubbing it with a sponge
    or your fingers. Use a pin to scrape between very close tracks and pads but be
    careful not to scrape the toner.


    Once all the paper has been removed, rinse the board in clean water and let it
    dry thoroughly.


    If the toner transfer is a mess and not worth touching up, remove the toner using
    acetone and paper towel or cotton wool, clean the board and try again.


    ![](img/3c46617540546e0091f48cc286948fbe_250_0.png)


    > **Figure A.12**: Removing the Photo Paper

    **Left** – soaking the board in a sink of water

    **Middle** – peeling a layer of paper

    **Right** – rubbing the wet paper to remove it – do this in the sink


    # Touching Up the Board


    Inspect toner tracks and pads on the board for breaks and areas where the toner
    is very light. Use a PCB etch-proof pen to touch up any breaks in tracks or pads
    and to touch up light areas.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# Appendix A – Home Made PCBs


    # Etching the Board


    Safety:

    Wear eye protection and nitrile gloves when working with ferric chloride. Read
    the instructions and safety precautions that are supplied with the ferric chloride.
    Wear an apron, lab coat or old clothes.


    With the board touched up, it can now be etched. Pour enough ferric chloride to
    cover the board into a glass or plastic basin and place the board into the basin
    – copper side up. To speed the etching, rub the board gently with cotton wool
    – this is more of a dragging of the cotton wool over the board than rubbing it
    (figure A.13).


    When the exposed parts of the copper are etched away, rinse the board in clean
    water. Store the used ferric chloride in a glass or plastic bottle for reuse.
    Rather don''t pour it back into the bottle containing the unused ferric chloride
    as this will just weaken the solution.


    ![](img/3c46617540546e0091f48cc286948fbe_251_0.png)


    Figure A.13: Etching the Board

    Left – place the PCB into a plastic basin

    Middle – Pour the ferric chloride into the basin to cover the board

    Right – drag cotton wool over the board to speed up the etching process


    # Drilling Holes


    Safety:

    Wear a dust mask and eye protection when drilling PCBs. Never wear loose clothing,
    never wear a neck tie and never have long hair that is not tied back when working
    with moving machinery.


    At this stage it is best to drill the holes in the PCB pads. This can be done
    later, but the toner layer helps to protect the copper and also makes it easier
    to see the holes that need to be drilled (figure A.14).'
  merge: -1
  img_proc: true
- pgno: 252
  md: '![](img/3c46617540546e0091f48cc286948fbe_252_0.png)


    Figure A.14: Drilling the PCB

    Left - drilling the PCB using a drill press, copper side up

    Right - top view of the PCB after drilling


    # Cutting to Size


    Safety:


    Wear a dust mask when cutting and filing the PCB.


    Before removing the toner, cut the PCB to size. The edges to cut off are very
    narrow, so I don''t recommend scoring and breaking it, rather clamp the PCB in
    a vice (figure A.15) and start filing using a rough file, move to a smoother file
    as you get closer to the PCB edge. File just past the etched copper outline of
    the PCB so that you remove the copper outline but go no further. If you do not
    have a vice with plastic jaws, then pad the jaws with a soft material such as
    wood to prevent breaking the copper tracks. The wood can be taped in place using
    masking tape.'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# Appendix A – Home Made PCBs


    ![](img/3c46617540546e0091f48cc286948fbe_253_0.png)


    Figure A.15: Filing the PCB to Size

    Left – clamp the PCB in a vice before filing, tape wood to the vice jaws to pad
    them

    Right – the PCB filed to size


    # Cleaning and Tinning


    Use acetone and cotton wool or paper towel to clean the toner from the PCB tracks
    (figure A.16, left). Coat the copper with liquid flux before tinning the board
    (figure A.16, middle) and again as necessary while tinning.


    Use solder and a soldering iron to tin the board with a very thin layer of solder
    (figure A.16, right). If the board that you are tinning has a large copper plane
    such as the in the figures, you will need a powerful enough soldering iron to
    handle it. Don''t apply too much solder, you will be surprised by how far a small
    amount of solder goes. Start with a small dot of solder and spread it as far as
    possible. Be very gentle on the tracks, especially the thin ones as it is very
    easy to lift a track or a pad.


    After tinning the board, use PCB cleaner to remove the flux from the board. Use
    a multimeter to check the board tracks for continuity and shorts.'
  merge: -1
  img_proc: true
- pgno: 254
  md: '# Appendix A – Home Made PCBs


    ![](img/3c46617540546e0091f48cc286948fbe_254_0.png)


    Figure A.16: Cleaning and Tinning the PCB

    Left – using acetone to clean the toner from the PCB

    Middle – coating the tracks with liquid flux

    Right – tinning the copper with solder


    # Adding a Top Silcreen


    A top silkscreen that shows the component outlines and designations (e.g. R1,
    C1, etc.) makes assembling the board by so much easier. It also helps to easily
    identify components when fault-finding or repairing the circuit.


    To make a top silkscreen, we will plot the front silkscreen layer from KiCad to
    a postscript file and print the silkscreen with a laser printer onto photo paper
    and iron it onto the top side of the board. In other words, we are going to use
    the same method that we used to print and transfer the copper layer to the board,
    only this time it will be applied to the top.


    # Postscript plotting the top silkscreen layer


    Start KiCad and open the desired project and start PCBnew. In PCBnew, click the
    Plot icon on the toolbar or click File → Plot to open the Plot dialog box.


    Choose the following settings in the Plot dialog box:


    +   - In the Plot format: drop down box, select Postscript.

    - In the Layers box, make sure that only the Silks Front layer is selected, unless
    you are printing on post-card sized photo paper in which case, check PCB_Edges
    as well.

    - In the Options checkbox area, check only Plot module reference on silkscreen,
    Plot other module texts on silkscreen and Mirrored Plot.

    - Make sure that the Scaling: box is set to 1:1.


    253'
