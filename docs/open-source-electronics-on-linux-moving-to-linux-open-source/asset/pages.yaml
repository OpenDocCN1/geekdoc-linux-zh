- pgno: 275
  md: '# # Open Source Electronics

    on Linux


    Warwick A. Smith


    Start using Linux and open source software for electronics and everyday applications.
    Move to Linux or use it in addition to your current operating system.


    Discover the many advantages of open source hardware and software. Download every
    software application that you will need for free from the Internet.


    Learn how to use open source EDA tools. Hardware projects are included that can
    be easily built at home and modified by using open source tools. Use a Linux PC
    for microcontroller software development.


    +   - Install and learn to use a Linux operating system.

    - Learn to use open source EDA tools for creating circuit diagrams and circuit
    boards.

    - Use the Arduino and the Arduino Ethernet shield open source hardware.

    - Build one of several AVR microcontroller programmers.

    - Develop software for, program and debug-bit AVR microcontrollers on a Linux
    system.

    - Interface a LCD display to a Linux PC to show Linux system information.

    - Install C language development tools for MSP430 and ARM microcontrollers.

    - Discover interesting and useful open source software.

    - Make home-made circuit boards designed using open source tools.


    All hardware projects can be built on single-sided PCBs and made at home, or output
    files can be generated for professional manufacture of boards. No special hard
    to get parts are used. Many of the software programs used are also available for
    Windows.


    ![](img/3c46617540546e0091f48cc286948fbe_275_0.png)


    www.elektor.com

    Elektor International Media


    ![](img/3c46617540546e0091f48cc286948fbe_275_1.png)'
  merge: -1
  img_proc: true
