- pgno: 238
  md: '# Appendix A – Home Made PCBs


    # Equipment


    +   - Laser printer – for printing the bottom copper layer and top silkscreen
    layer.

    - Clothes iron – for ironing the copper and silkscreen layers to the copper-clad
    board (figure A.3).

    - Soldering iron – for adding a layer of solder to the tracks (tinning) (figure
    A.2).

    - Hand drill or drill press – for drilling the holes in the PCB.

    - Drill bits – for drilling holes in the PCB. Several sizes will be needed such
    as 0.7mm, 0.8mm, 0.9mm, 1.1mm, 1.2mm, 1.3mm, 2mm, 3.5mm, etc. depending on the
    PCB (figure A.2).

    - Sharp knife – for cutting the PCB and scoring the PCB (figure A.2).

    - File – for marking the PCB edges to size (figure A.2).

    - Vice – to clamp the PCB when cutting to size and filing (figure A.2).

    - Steel ruler for marking out the PCB on the copper-clad board, scoring the board
    and cutting the photo paper (figure A.2).

    - Square – may be needed if the copper-clad board does not have at least one square
    corner (figure A.2).

    - Plastic or glass basin – for etching the PCB in (figure A.3).

    - Sink or bowl – for soaking the photo paper when removing it from the PCB and
    for rinsing the PCB.

    - Paint brush – for applying liquid flux to the PCB tracks (figure A.2).


    # Supplies – Consumables


    +   - Paper paper – Either a full page for your printer, e.g. A4, or post-card
    sized. The photo paper used in this tutorial was post-card sized: Fujifilm 150g/m2,
    10cm × 15cm (4in. × 6in.), Glossy Brilliant (figure A.3).

    - Paper – Plain paper to fit your printer (e.g. A4) if using post-card sized photo
    paper to stick the photo paper to the plain paper when feeding it through the
    printer (figure A.3).

    - Copper-clad board – copper-clad single sided glass-fibre or similar board (figure
    A.3).

    - Ferric chloride – for etching the board. It is available pre-mixed as a liquid
    or as crystals that must be mixed in water (figure A.3).

    - Acetone – for removing toner from the PCB.

    - Cotton wool – for speeding up the etching process and removing the toner by
    acetone.

    - Solder – for thinning the tracks of the PCB (figure A.3).

    - Flux remover – for removing flux from the PCB after hand-tinning (figure A.3).

    - PCB pen – for touching the board if the toner did not stick well in places (figure
    A.3).

    - Scouring pad or sponge – for cleaning the copper layer on the copper-clad board
    (figure A.3). It must be fine enough that it does not remove the copper layer.

    - Sponge – to help remove the photo paper from the copper-clad board (figure A.3).


    237'
  merge: -1
  img_proc: true
