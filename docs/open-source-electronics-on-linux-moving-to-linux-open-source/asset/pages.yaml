- pgno: 230
  md: '# 9.2.3 Adding Components to the Collection


    # 9.2.3 Adding Components to the Collection


    To start a new collection, open GCstar and click File > New. In the Select a collection
    type dialog box, click the triangle on the left of Personal models to expand it.
    Now select one of the templates you have created or installed. For this tutorial,
    select Capacitors and click the OK button.


    To add each component of your collection, just click the Add button on the top
    toolbar. Fill in each field of the form that opens – some fields can be left blank
    and filled in later. In the capacitors collection, the first field that contains
    the text “New item” is the Value field and must contain the capacitance of the
    capacitor.


    Filling in the Capacitor form:


    +   - Replace the “New item” text with the capacitance value – e.g. for a 68pF
    capacitor, enter 68p.


    +   - Choose a value from the Composition: drop-down list, e.g. Ceramic


    +   - Enter a voltage in the Voltage: field, e.g. 25V. If you don’t know the voltage
    of the capacitor, you can leave the field blank.


    +   - Choose a tolerance from the Tolerance: drop-down list, e.g. 20%.


    +   - Choose the mounting type from the Mounting: box, e.g. Through Hole, or SMT
    for a surface mount capacitor.


    +   - Choose the pin spacing, e.g. 2.54mm/100 for 100 thou pin spacing or one
    of the SMT footprints such as 0603, 0805 or 1206.


    +   - Choose the location and bin column and row in the next three fields, e.g.
    Rack12, A, 1.


    +   - Enter the number of capacitors that are in the bin, 5.


    +   - Add any comments that you want to make in the Comments: field, or leave
    it blank.


    When finished, click the Save button on the top toolbar. The first time you save
    a new collection, you will need to specify the collection name and location to
    save it. I suggest saving all your component collections to a folder in your home
    folder. After clicking the Save button for a new collection, click the OK button
    in the dialog box that pops up. Navigate to the folder that you want to save the
    collection to. Create a new folder if needed. Give the collection a name, e.g.
    Capacitors, and click the OK button to save.'
  merge: -1
  img_proc: true
- pgno: 231
  md: '+   To add the next capacitor, click the Add button on the top toolbar again.


    +   Save often when adding components to the collection.


    # 9.2.4 Hints for Creating and Adding to Collections


    +   If this is your first time creating a component collection, don’t add all
    of your components to the collection at once. Rather add a few of each type of
    component to the collection and experiment a bit to see that it is set up the
    way that you will need. E.g. you may not have your collection in racks labelled
    Rack1 to Rack12. You may need this to be a short text field, so that you can enter
    anything you want. Sort this early before adding a lot of components, as certain
    changes to the template file that applies to a collection containing data may
    corrupt the data.


    +   Changing field when collection contains data may corrupt the collection, but
    adding values to a pre-defined value list does not.


    +   Back up your collections and collection templates (described in the next section).


    +   A pre-defined values list field helps to prevent typing errors because you
    can only select pre-set values from a list. Manually typing values into a short
    text field can result in the introduction of a typing error. If a typing error
    exists, certain items may be excluded when doing a search.


    +   A disadvantage of using pre-defined values is that if you find that you need
    to add items at some stage, you will need to modify the collections template.


    +   If you have more than one of the same value of component, but within the value
    there are components with other differing parameters, enter them as separate parts.
    E.g. if you have 68nF capacitors that are rated at 100V and others rated at 400V,
    make two entries with the value of 68nF and fill in different voltages for each.
    In this example, they probably have different pin spacing too. If you have surface
    mount 68nF capacitors, make a separate 68nF capacitor entry. When you do a search
    for 68nF capacitors in the collection then all the different types will come up
    and you can quickly click through the list to find what you are looking for.


    +   Don’t try to enter everything into the database at once, a bit each day.


    +   You will need to be disciplined to add and remove parts – it is easy to let
    your database and component collection become unsynchronised.'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'Don’t worry about recording exact quantities of components when quantities
    are large, especially if you are only using a few components at a time. You may
    wish to only update the database when you see that the number of components are
    getting low. For higher costing parts that you have fewer of, you should help
    keep track of exact quantities.


    # 9.2.5 Backing Up Collections and Templates


    # Collections


    Collections are easy to back up. Just find them in the folder that you saved them
    in. The default file extension for GCstar collections is `gcs`, e.g. `Capacitors.gcs`.


    # Templates


    Templates that you have created and under **Personal models** in the dialog box
    that pops up after clicking File → New can be found in a hidden folder in your
    home folder called `.local`. To find the files, start the file manager and navigate
    to your home folder. Press **Ctrl + H** to show hidden files. Navigate to `.local/share/gcstar/GCMModels`
    to find the template template files have a `gem` file extension, e.g. `Capacitors.gem`.


    # 9.2.6 Searching Collections


    In the case of the Capacitors collection, it is easy to scan the left pane for
    the required value, but this value can also be searched for.


    # Searching


    First set up the field to search – click **Edit > Change Collections Fields**
    and in the **Collection settings** dialog box, click the **Filters** tab on the
    left. In the left pane, click **Value**. Check the **Should be in search** checkbox.
    Click the **OK** button in the dialog box.


    To search the value field, click the **Search all items** icon on the top toolbar
    (the magnifying glass). In the dialog box that pops up, enter `10u` to search
    for 10u capacitors and click the **Find** button. The left panel will now contain
    all 10u capacitors. To clear the search, click the **View all items** icon (the
    broken circle with arrow) on the top toolbar.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# Chapter 9. Other Open Source Software


    # Grouping


    Components can also be filtered by grouping them. E.g. by grouping all the capacitors
    by voltage. To group the components, click the **Group by** drop down box on the
    top toolbar. Select **Main** and then **Voltage**. The capacitors will be grouped
    by voltage in the left pane and the capacitors that were not assigned a voltage
    value will be displayed at the bottom of the pane.


    To remove the grouping, click the **Group by** drop down box again and select
    the blank space above **Main.


    # Advanced search


    To do an advanced search, click **Filter** → **Advanced Search**. As an example
    using the Capacitors collection, to filter all through-hole axial capacitors,
    in the advanced **Item Search** dialog box, select **Mounting** in the first drop-down
    list. Select **Contains** in the second drop-down list. Select **Through Hole
    Axial** in the third drop-down list. Click the **Find** button. The left pane
    will now contain only through-hole axial capacitors. Use the **View all** items
    on the top toolbar to clear the search.


    # 9.3 Other Useful and Interesting Software


    This section contains information on other useful electronics related software
    and even some software that is not related to electronics or Linux, but is nevertheless
    interesting open-source software.


    # 9.3.1 Numerical Computations


    Matlab is a commercial software package that can perform numerical computations
    and even plot graphs. Matlab is a high-level language and interactive environment.
    More information on Matlab can be found at www.mathworks.com.


    **Octave** is an open-source package that is Matlab compatible. It is available
    in the Mint Software Manager. Octave can be run from a terminal window, and a
    graphical front-end can also be installed such as QtOctave (also available through
    the Mint Software Manager).


    The Octave website is www.gnu.org/software/octave

    Octave packages can be found at octave.sourceforge.net'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# 9.3.3 Non-Linux Open-source Operating Systems


    # 9.3.2 Running Windows and DOS Programs on Linux


    **Wine** is a software package that allows Windows programs to be run on Linux.
    It is available in the Mint Software Manager. The Wine website is www.winehq.org


    **DosBox** is a DOS emulator allows DOS programs to be run on Linux. It is mostly
    used to run old DOS games. The website is www.dosbox.com


    # 9.3.3 Non-Linux Open-source Operating Systems


    There are some non-Linux (and also non-Unix like) open-source operating systems.
    Out of all these projects, only FreeDOS was available in a release version at
    the time of writing. If you are interested in different operating systems, then
    those presented here be worth keeping an eye on how they progress. You may even
    like to contribute to one of these projects.


    ReactOS (www.reactos.org) is an open-source version of Windows XP. The aim of
    the ReactOS project is to create an operating system that is binary compatible
    with Windows. At the time of writing, a release version of the operating system
    was not yet available, the project was still in alpha development.


    FreeDOS (www.freedos.org) is a DOS compatible operating system. At the time of
    writing, FreeDOS was at version 1.1 and fully functional.


    FreeDOS-32 (freedos-32.sourceforge.net) is a 32-bit version of DOS and targeted
    to embedded systems and real-time applications. This project was still in pre-alpha
    state at the time of writing and no downloads available yet.


    Haiku (haiku-os.org) is another open-source operating system and was inspired
    by BeOS – a closed source operating system. At the time of writing, this project
    was in alpha 3 release.


    **osFree** (www.osfree.org) is intended to be compatible with OS/2 – a closed
    source operating system developed by IBM.'
