- pgno: 223
  md: '# Chapter 9. Other Open Source Software


    ![](img/3c46617540546e0091f48cc286948fbe_223_0.png)


    # 9.2 Cataloguing Electronic Parts


    Having a database of your collection of electronic parts is very useful, especially
    if the number of parts fills more than a few racks of component trays. Once component
    collection has grown beyond a certain size, it is easy to loose track of some
    of the parts in the collection. You may end up ordering new parts because you
    forgot that you already had some stuck away in a box on the shelf.


    Once your component collection has been added to a database, it is just a matter
    of searching the database to find if you have a certain component in stock or
    if you need to order more.


    There are a number of ways to catalogue components in a database as well as a
    number of different programs that can be used to get the job done. We will be
    using a program called GCstar (www.gcstar.org) which is a collection manager available
    from the Mint Software Manager. This program has been chosen as it is relatively
    easy to use.


    Entering the components into a database requires some patience, especially if
    the collection is large. Keeping the database up to date when new components are
    acquired and existing components are used requires some discipline.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# 9.2.1 Designing the Database


    # Installing the software


    Install GCstar from the Mint Software Manager – search for gcstar.


    After installation, GCstar can be found on the Mint Menu under “Office”.


    # 9.2.1 Designing the Database


    It is possible to add an entire collection of components to a single database
    in GCstar, however, some components have parameters that are significantly different
    from others. For example a resistor has a tolerance value, but a microcontroller
    does not. Using a more sophisticated database program would enable you to make
    custom forms for different types and store all components in a single database.
    GCstar is a more simple program, so what I suggest is saving each category of
    components in its own database (or collection). In this way, you can open the
    capacitor collection when you are looking for capacitors, or the resistors collection
    when you are using resistors.


    Some basic categories for components are:


    +   * Resistors

    * Capacitors

    * Inductors

    * Crystals and oscillators

    * Semiconductors

    * Connectors

    * Mechanical


    Semiconductors is a rather large category and could be broken up into other categories,
    such as transistors, diodes, microcontrollers, etc. The mechanical category is
    intended for all other mechanical parts that are not connectors such as switches,
    heatsinks, PCB standoffs, etc. The tutorial in this book will stick with the categories
    listed above.


    Once you have decided on what categories to use with your component collection,
    you next need to decide on which parameters to include in each category. Some
    examples:


    # Resistor parameters


    Value, power rating, tolerance, mounting (through-hole or SMT), location (where
    it is stored – in a box, component rack, etc.), quantity.'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# Chapter 9. Other Open Source Software


    # Capacitor parameters


    Value, voltage, tolerance, mounting, pin spacing, location, quantity.


    There could be other parameters that you can think of and would like in your database
    – these can be added after creating the initial database and adding components.


    The next section is a tutorial that will explain how to create a component collection
    in GCstar and add parts to it. The basic design breaks down all the components
    into the seven categories described above. It is assumed that the components could
    be located in a component rack consisting of small pull-out trays, as shown in
    figure 9.6. The columns in the trays are labelled using letters (e.g. A, B, C,
    etc.) and the rows are labelled using numbers (e.g. 1, 2, 3, etc.). These labels
    don''t need to be physically placed on the racks, but if a component is located
    in rack3, B4, then find rack 3, count two columns across – A, B and then 4 rows
    down to locate it. Components don''t have to be located in these racks – if a
    component is located in a box, the name of the box is used and a default of A1
    is used as column and row.


    ![](img/3c46617540546e0091f48cc286948fbe_225_0.png)'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# 9.2.2 Creating a Collection Type


    # 9.2.2 Creating a Collection Type


    A collection type describes the parameters for each category, e. g. describes
    all the resistor parameters. You can use either the collection type templates
    that have already been created for use with this book or you can create your own
    collection type from scratch.


    Heading A below the provided templates and heading B shows how you to create a
    new template. The easiest is to use the existing templates and then modify them
    if you would like to add or remove fields.


    # A. Using the templates from the accompanying files


    Find the template files with the accompanying files in CH9/GCMModels. It is recommended
    to start GC once and close it if you have not already done so – find GCstar under
    Menu -> Office -> GCstar. Starting GCstar will cause it to create the hidden folders
    that we need to copy the template files to.


    After installing the template files, open the file manager and navigate to your
    home folder. Show hidden files and folders by pressing Ctrl+H. Open the .local
    folder. The template files must be copied to .local/share/gcstar/GCMModels.


    After installing the template files, they will be found in the Select a collection
    type dialog box under Personal models. This dialog box is opened in GCstar by
    default when starting GCstar, or by clicking File -> New.


    # B. Creating a new collection


    +   - Start the GCstar program and click File -> New to start a new collection.

    - In the Select a collection type dialog box, click New collection type and then
    click the OK button (figure 9.7).'
  merge: -1
  img_proc: true
