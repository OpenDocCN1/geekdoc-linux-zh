- pgno: 142
  md: '# # Chapter 5. AVR 8-bit Microcontrollers


    AVR 8-bit microcontrollers are modern In-System Programmable (ISP) Flash based
    microcontrollers. They are very popular with hobbyists and can be programmed in
    the C programming language using GNU AVR tools. Some members of the 8-bit AVR
    family of microcontrollers are available in DIP packages which is great for breadboard
    prototyping. 32-bit AVR microcontrollers are also available, but in this chapter
    we will look at 8-bit AVRs only.


    If you have been using the Arduino board, you have already been using an 8-bit
    AVR. The Arduino programming language is converted to C and compiled by the GNU
    AVR C compiler, so by installing the Arduino IDE, you would have already installed
    the GNU AVR C compiler on your computer.


    In this chapter, we will look at some of the devices from the 8-bit AVR family,
    how to make a number of different programmers for in-system programming of these
    microcontrollers and then look at the standard JTAG tools for AVR and set them
    in Linux to single step and debug C programs. This chapter contains everything
    that you need to get started with 8-bit AVR microcontrollers in Linux. Files used
    in this chapter can be found with the accompanying files: CH05/


    # ## 5.1 An Overview of 8-bit AVRs


    8-bit AVR microcontrollers are divided into three main groups, namely AVR XMEGA,
    megaAVR and tinyAVR. Some specialised battery management AVRs are also available
    and are based on the megaAVR. A category of AVRs rated for automotive use are
    also available.


    The AVR XMEGA range are only available in various surface-mount packages (no DIP
    packages), so we will not consider them in this chapter. To get with AVRs, we
    will look at the tinyAVR range and megaAVR range.


    # ### 5.1.1 tinyAVR Microcontrollers


    Many of the tinyAVR microcontrollers are available in DIP packages. This range
    of AVRs are available in packages that contain 6 pins up to 32 pins and Flash
    memory from 0.5kB to 8kB. They are all in-system programmable (ISP), except for
    one device, the ATtiny28L. Many of the devices can be debug using debugWIRE which
    is an alternative to JTAG that uses fewer pins of the microcontroller.'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# Chapter 5. AVR 8-bit Microcontrollers


    In this chapter, we will look at the following devices from the tinyAVR group:


    # ATtiny2313


    A real workhorse that belongs in every spaces box. This AVR can be used in hundreds
    of different applications. Some features are:


    +   - 20 pin package

    - 2kB Flash memory

    - ISP, debugWIRE

    - Timers, PWM

    - SPI/USART

    - TWI (PC)

    - Analog comparator

    - Up to 20MHz operating speed

    - 1.8V to 5.5V power

    - Available in DIP package as well as various SMT packages

    - The ATtiny4313 is an ATtiny2313 with 4k of Flash


    # ATtiny48


    +   - 28 pin package

    - 4kB Flash memory

    - ISP, debugWIRE

    - Timers, PWM

    - SPI

    - TWI (PC)

    - 8 × 10-bit ADC channels

    - Analog comparator

    - Temperature sensor

    - Up to 24 I/O pins

    - Up to 12MHz operating speed

    - 1.8V to 5.5V power

    - Available in DIP package as well as various SMT packages'
  merge: -1
