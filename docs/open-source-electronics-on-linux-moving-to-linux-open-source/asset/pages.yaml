    # 5.2.2 Parallel Port AVR Programmer


    A parallel avr programmer is shown in figure 5.3. This programmer can easily be
    built on breadboard or stripboard and is the simplest of all the programmers.
    A similar circuit can be built on the Internet that contains a buffer chip. The
    version of the circuit shown here must only be used to program AVRs that are powered
    from a 5V power supply.


