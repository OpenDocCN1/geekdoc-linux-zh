- pgno: 25
  md: '# 1.6 Navigating Linux


    After installing Linux, you will be asked to reboot the computer. After clicking
    the reboot button, the CD tray will be ejected if you are installing from a CD.
    Remove the CD or Flash disk if you are installing from a Flash disk and hit the
    `Enter` key to reboot.


    If Linux is the only operating system on the computer, it will boot immediately
    each time the computer is switched on. If there is more than one operating system
    on the computer, a boot menu will appear allowing you to select the operating
    system to boot. Use keyboard up and down arrow keys to select the operating system
    to boot and hit the `Enter` key to boot the selected operating system. The name
    of the boot-loader program is “GRUB”, so search for this name on the Internet
    if you want to find out more about it.


    The rest of this section describes how to navigate the Linux Mint MATE desktop.


    # 1.6.1 Logging In


    After Linux Mint has been installed and the computer is switched on or rebooted
    for the first time, the first thing you will see after booting is the login screen.
    Enter the user name that you created during the installation and then your password
    in the password box and hit the `Enter` key to log in.


    # 1.6.2 Menu System


    The menu system is very straightforward. Click the bottom left **Menu** button
    on the bottom panel (**figure 1.6**) to bring up the menu. To navigate the file
    system, look under *Places* on the menu. System settings, the Software Manager
    (for installing software applications) and buttons for shutting down the system
    can be found under **System**.


    Commonly used applications can be found under **Favorites**. To view all of the
    installed applications, click **All applications** where you will find applications
    sorted in categories. Use the search box in the menu to search for any installed
    application.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# 1.6.4 Virtual Desktops


    Mint Menu Panel System Updates


    ![](img/3c46617540546e0091f48cc286948fbe_26_0.png)


    # 1.6.3 Updating the System


    To update Linux Mint, you will need to be connected to the Internet. An Internet
    connection will automatically be established by Linux between your PC and router/network
    when connected by an Ethernet cable.


    It is best to update the system for security and stability reasons. During updating,
    security fixes and other package updates will be downloaded and installed. The
    **Update Manager** will automatically notify you of updates at some stage, but
    it can also be started. To start the Update Manager, click the shield icon on
    the bottom panel – it is with the group of icons to the right of the bottom panel
    as shown in **figure 1.6**. You will need to enter your password to start the
    Update Manager. This is the same password that you used to log into the system.
    In the Update Manager, click the **Refresh** button if the latest updates have
    not been automatically refreshed. Click the **Install Updates** button to install
    the updates that are listed in the Update Manager window.


    # 1.6.4 Virtual Desktops


    In general, most Linux distributions will have virtual desktops or workspaces.
    A virtual desktop allows you to open one or more applications on one desktop and
    then flip to an empty desktop and open additional applications on the empty desktop.
    You will be able to flip between desktops and sets of open applications, or if
    there are additional empty desktops, switch to one of them to access icons that
    are on the desktop or open even more applications. Linux Mint has four virtual
    desktops by default, but the number of desktops can be changed.


    To change between virtual desktops, hold down the **Ctrl + Alt** keys and press
    the right arrow key. Without any applications you open won''t really notice any
    difference. To see the virtual desktops in action, open an application (e.g. Firefox
    web browser) and then change to one of the other desktops using **Ctrl + Alt +
    ~**. Another applications (e.g. Calculator) on the new empty desktop. Now move
    between any of the four virtual desktops holding down **Ctrl + Alt** and using
    the left and right arrow keys.'
  merge: -1
  img_proc: true
