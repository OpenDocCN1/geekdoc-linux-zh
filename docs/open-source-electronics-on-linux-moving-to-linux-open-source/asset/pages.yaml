    AVR. Start a terminal window and change to the directory containing the hexadecimal
    program. Program to the target AVR enter:


    ```

    sudo avrdude -p t2313 -c usbtiny -e -U flash:w:blink.hex

    ```


    # 5.2.5 The Atmel AVRISP mkII USB Programmer


    The standard AVR programmer from Atmel is the AVRISP mkII shown in figure 5.9.
    The order code for this device, which you can search for when looking for prices
    on the Internet, is ATAVISP2.


    ![](img/3c46617540546e0091f48cc286948fbe_161_0.png)'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# 5.2.6 The Atmel AVR Dragon


    The programmer can be used to program all 8-bit AVRs with an ISP interface. It
    supports target voltages from 1.8V to 5.5V and is USB powered.


    To test the AVRISP mkII with our test circuit of figure 5.2, plug the programmer
    into one of the PC’s USB ports, connect the green 6 header to the test circuit.
    When the programmer is connected to the USB port, a green LED near the USB connector
    on the programmer will switch on. When target power is switched on a green LED
    near the 6-way ribbon cable of the programmer will switch on. Open a terminal
    window and enter:


    ```

    sudo avrdude -c avrispmkII -p t2313 -p USB

    ```


    If the programmer is correctly connected to the target, the circuit AVR device
    will be initialised and the device signature read back. While the programmer is
    reading the AVR, the LED near the 6-way ribbon cable will glow red and then change
    back to green when.


    To program the AVR using the AVRISP mkII, open a terminal window and change to
    the directory containing the hexadecimal test program. Enter the following in
    the terminal window:


    ```

    sudo avrdude -p t2313 -c avrispmkII -p USB -e -U flash:w:blink.hex

    ```


    Increasing the accessing/programming speed of the AVRISP mkII


    The AVRISP mkII starts with a relatively slow speed, so you may have noticed that
    it programmed slower than one of the home-built programmers. To speed it up, use
    the -B switch with avrdude. The lines to read the device signature from the AVR
    and program it now become:


    ```

    sudo avrdude -c avrispmkII -p t2313 -p USB -B 3.0

    sudo avrdude -p t2313 -c avrispmkII -p USB -e -U flash:w:blink.hex

    -B 3.0

    ```


    # 5.2.6 The Atmel AVR Dragon


    The AVR Dragon, which looks more like an evaluation board than a programmer, is
    shown in figure 5.10. It has multiple programming and debugging capabilities.
    In this section we will only use it for in-system programming. The AVR Dragon
    comes in a box as shown in the figure, without a USB cable or ribbon cable for
    connecting it to the target board. You will need a standard USB cable and a 6-way
    ribbon cable with IDC 3 × 2 female connector on each end for in-circuit programming.


    The AVR Dragon is a relatively low cost device. The ordering code for the AVR
    Dragon is ATAVDRAGON which can be searched when shopping for prices on the Internet.


    Website: www.atmel.com/AVRDRAGON'
  merge: -1
  img_proc: true
