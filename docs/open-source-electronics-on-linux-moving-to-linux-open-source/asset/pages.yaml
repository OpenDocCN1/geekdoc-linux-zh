- pgno: 159
  md: '# Chapter 5. AVR 8-bit Microcontrollers


    # Building and programming the USBtinyISP


    Building the programmer of figure 5.6 is pretty straightforward. Use a 20pin IC
    socket for the ATiny2313 so that it can be removed from the circuit and reprogrammed
    if necessary. A 6 wire ribbon cable and two 3 × 2 female IDC connectors will be
    required to connect to the ICSP header on the programmer to the ICSP header on
    the target board. Figure 5.8 shows a fully assembled USB Tiny ISP.


    Once the board has been assembled, the ATiny2313 used in the programmer will need
    to have the firmware loaded to it. The hexadecimal file to be loaded can be found
    with the accompanying files in CH05/USBtinyISP_firmware/main.hex


    Connect the ATiny2313 to a breadboard and use either a parallel or serial programmer
    to program it as presented earlier in this chapter. Use figure 5.2 as a reference
    to power it and connect the serial or parallel programmer. You may even like to
    add the LED shown in the figure and run the blink test program first to flash
    the LED and test that the programmer is connected correctly. To load the USBtinyISP
    firmware to the ATiny2313 on the breadboard, start by opening a terminal window
    and changing to the directory containing the hexadecimal firmware file.


    ![](img/3c46617540546e0091f48cc286948fbe_159_0.png)


    Figure 5.8: The USB Tiny ISP Assembled


    Once enter the following to load the firmware to the ATiny2313:


    Parallel port programmer:

    sudo avrdude -p t2313 -c bsd -P /dev/parport0 -e -U flash:w:main.hex


    Serial port programmer:

    sudo avrdude -p t2313 -c ponyser -P /dev/ttyS0 -e -U flash:w:main.hex'
