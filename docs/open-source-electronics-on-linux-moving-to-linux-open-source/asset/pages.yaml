- pgno: 202
  md: '# Chapter 7. ARM7 32-bit Microcontrollers


    In this chapter, we will install the GNU C programming tools for ARM microcontrollers
    as well as software for loading programs to AT91SAM7 ARM microcontrollers. Example
    programs for AT91SAM7S256 microcontrollers from Atmel are included and the AT91SAM7S-EK
    board is used, but any board with an AT91SAM7S microcontroller should also work.


    The AT91SAM7S-EK board can be programmed through the USB port without any external
    programmer needed. Any AT91SAM7S board will be able to be programmed in this manner,
    provided that it has been set up to do so, as AT91SAM7S microcontrollers have
    a built in bootloader program that allows programming via its USB port.


    ![](img/3c46617540546e0091f48cc286948fbe_202_0.png)


    Figure 7.1: ARM Hardware Used in this Chapter'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'Chapter 7. ARM7 32-bit Microcontrollers


    **Figure 7.1** shows the Atmel AT91SAM7S evaluation board using the AT91SAM7S256
    microcontroller.


    # 7.1 Installing the GNU ARM Toolchain


    The easiest way to get the GNU ARM toolchain (including C compiler) is to download
    a compiled version. To get the toolchain, go to www.mentor.com/embedded-software/sourcery-tools/sourcery-codebench/editions/lite-edition/
    and under ARM processors, click Download the EABI release. You will need to enter
    your name and email address. A link to the download will be emailed to you. Click
    the link in your email and then on the page that opens, click Sourcery G++ Lite
    2011.03-42. On the next page, click IA32 GNU/Linux Installer. The name of the
    file downloaded will be arm-2011.03-42-arm-none-eabi.bin.


    Start a terminal window and change to the directory containing the downloaded
    binary. Enter: `sudo dpkg-reconfigure -plow dash`


    In the dialog box that pops up in the terminal window, choose “No”.


    Now start the installation program by entering:

    `sudo sh arm-2011.03-42-arm-none-eabi.bin`

    remember to use the Tab key to make entering the file name easier – from chapter
    1)


    In the installation program, you will be taken through a number of dialog boxes
    and you will need to agree to the license. Choosing the typical installation is
    fine. When asked to choose an install folder, change the install path to /opt/CodeSource...
    This will need to be done again when asked to choose a link folder. Leave all
    other options in their default state.


    To make the tools available from the command line, add the following line to .bashrc
    in your home folder:

    `export PATH=$PATH:/opt/CodeSourcery/Sourcery_G++_Lite/bin`nTo be able to see
    .bashrc, in the file manager Ctrl + H to show hidden files. If the .bashrc file
    does not exist, create it or copy it from the accompanying files in CH07. The
    file in this folder is named bashrc, copy it to your home folder and rename it
    to .bashrc (click the file and press F2 to rename).


    To test the compiler, start a terminal window and enter:

    `arm-none-eabi-gcc --version`


    202'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# 7.2 Programming Atmel ARMs via USB


    Links to documentation for the ARM GCC tools can be found in:

    /opt/CodeSourcery/Sourcery_G++_Lite_for_ARM_EABI


    Two programs that will run on the AT91SAM7S256 have been provided with the accompanying

    files. One of the programs is built to run from Flash memory, the other is built
    to run from RAM.

    These programs are found in:


    CH07/AT91SAM7S/digital_output_Flash

    CH07/AT91SAM7S/digital_output_RAM


    The Flash version of the program is to be loaded to Flash memory and will run
    every time that

    the board is powered up. The RAM version is intended for use while developing
    code and can be

    quickly loaded to the board for testing without having to erase and program the
    Flash memory each

    time (or reload the on-chip bootloader).


    To build each of these programs, run the make file included with them – start
    a terminal window,

    change to the directory containing the example and enter make.


    These examples are from the book "ARM Microcontroller Interfacing Hardware and
    Software"

    which is also available from Elektor. In this book programs were compiled on a
    Windows

    system. Changes had to be made to the make files in order for them to work on
    Linux. Frankly,

    Linux is case sensitive, so all references to external files and directories must
    use the exact case that

    they on the system, e.g. the directories "Startup" and "startup" will be treated
    as two different

    directories, where in Windows, each name can be used in the make file.


    Secondly, the references to libraries in the make file had to be modified to use
    the paths where they

    are located in Linux. These paths will also need to be modified if a different
    version of the GNU

    ARM toolchain is used.


    # 7.2 Programming Atmel ARMs via USB


    Sam I is written in Python and will load programs to AT91SAM7S microcontrollers
    via the USB

    port. The target board must have the on-chip bootloader loaded to memory. This
    is done by closing

    t TST jumper on the AT91SAM7S-EK board and applying power to the board for 10
    seconds, then

    removing the power and opening the TST jumper.


    # Getting Sam I Am


    A link to the software can be found at:

    claymore.engineer.gvsu.edu/~steriana/Software/Sam_I_Am/index.html'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# Chapter 7. ARM7 32-bit Microcontrollers


    It has also been included with the accompanying files in: CH07/Sam_I_Am-0.5.tar.gz


    # Installing Sam I Am


    To install the software, first extract the directory named Sam_I_Am-0.5 from the
    zipped file. Start a terminal window, change to this directory and enter:


    ```

    sudo python setup.py install

    ```


    We now need to modify the Sam_I_Am file to point to samiam.py. In a terminal window,
    change directory to: /usr/bin


    Now enter:


    ```

    sudo pluma Sam_I_Am

    ```


    In the text editor, change the line: /usr/lib/python2.7/site-packages/Sam_I_Am/samiam.py
    $ to


    ```

    python /usr/local/lib/python2.7/dist-packages/Sam_I_Am/samiam.py $

    ```


    Save the file when done.


    Once installed, documentation for the program can be found in /usr/lib/python2.7/Sam_I_Am/doc.


    # Programming using Sam I Am


    Load SAM-BA to the microcontroller''s Flash with the TST jumper and then plug
    the board into the PC via the USB port. Start a terminal window and enter:


    ```

    dmesg | tail

    ```


    or:


    ```

    dmesg | grep tty

    ```


    to determine the name of the port that the AT91SAM7S has been connected to e.g.
    /dev/ttyACM0.


    # Interactively using Sam I Am


    Open a terminal window and change to the directory containing the Flash version
    of the example program and enter:


    ```

    Sam_I_Am

    ```'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# 7.2 Programming Atmel ARMs via USB


    It’s a command line program, so you will just see a prompt in the terminal window.
    In the Sam_I_Am program, enter:

    open /dev/ttyACM0

    (or use whatever you determined to be the port name of the board)


    To determine the version of SAM-BA on the chip, enter:

    version


    Check if Flash regions are locked (any locked region will display a “1” next to
    it) - enter:

    info flash

    Press ‘q’ when done.


    To unlock Flash region 0, enter:

    riteww FFFFF64 5A000000

    To unlock Flash region 1, enter:

    riteww FFFFF64 5A000400


    To program the Flash, enter:

    flash digital_output_Flash.hex


    Run the program, enter:

    go

    To quit Sam_I_Am, enter:

    exit


    # Programming Flash from a terminal window


    The following two lines will unlock Flash regions 0 and 1, program the Flash memory,
    run the program and exit Sam_I_Am (the bootloader must be loaded to the AT91SAM7S
    microcontroller first):

    Sam_I_Am open /dev/ttyACM0 , riteww FFFFF64 5A000000 , riteww FFFFF64 5A000404


    Sam_I_Am open /dev/ttyACM0 , flash digital_output_Flash.hex , go


    # Programming the SRAM


    If you are going to be testing programs in SRAM, you only need to load SAM-BA
    to the microcontroller once, as it will not be erased by the loaded program as
    it is when programming Flash. Use the RAM example provided with the accompanying
    files.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# Chapter 7. ARM7 32-bit Microcontrollers


    To program the SRAM interactively, start Sam_I_Am from within the example program
    directory and enter:


    ```

    open /dev/ttyACM0

    send digital_output_RAM.hex

    go

    ```


    Or all in one line from the terminal window, enter:


    ```

    Sam_I_Am /dev/ttyACM0 , send digital_output_RAM.hex , go

    This will program the SRAM without staying in Sam_I_Am.

    ```'
