- pgno: 134
  md: '# 4.5.4 SD Card Web Server


    The previous example generated a web page by sending text to the web browser that
    was part of the Arduino program. We will now use an SD card placed in the SD socket
    of the Arduino Ethernet shield to store the web pages that can be created externally
    and copied onto the SD card from a PC.


    # SD cards


    In addition to the hardware previously used, you will need a microSD card. Not
    all microSD cards will work with the Ethernet shield. Some suggestions from the
    Internet recommend sticking to a 2GB or smaller card. According to the SD card
    specification, microSD cards are not required to support SPI mode. The Arduino
    uses the SPI port to interface with the SD card, however, there are many microSD
    cards that will work with Arduino. I used a 2GB card from Kingston that came with
    an adapter for inserting it into a standard SD card socket.


    When working with your SD card, you will need a USB SD card adapter for connecting
    the SD to your PC so that you can copy files to the SD card and read files from
    the SD card. These SD card readers can be obtained from any good PC shop. My laptop
    computer has an SD card reader built in, but it is for the standard SD card size,
    so I used the SD card adapter that came with the microSD card to insert it into
    the laptop SD card reader. Figure-4.13 shows a multi card reader that can be used
    to read many different card types including microSD. **The figure also shows a
    microSD card and the adapter that came with it - the microSD card is pushed into
    the end of the adapter.


    When you have obtained your microSD card, insert it into the microSD card socket
    on the Arduino Ethernet shield. Push the card into the socket all the way until
    it clicks in. To remove the end of the card into the socket again and it will
    click out. Now pull the card, it won''t fall out and may need to be wiggled a
    bit from side to side for it to come out all the way. Be gentle when doing this
    and don''t force it at all.


    If you didn''t buy a blank microSD card specifically to use with Arduino and are
    using a card that you already have, back up all data on the card before running
    any of the SD card programs on the Arduino.'
  merge: -1
  img_proc: true
