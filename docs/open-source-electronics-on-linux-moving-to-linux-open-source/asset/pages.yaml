  md: '# 5.1.2 megaAVR Microcontrollers


    We will be looking at the following ATmega devices:


    # ATmega8


    +   - 28 pin DIP (surface-mount packages are 32 pin)

    - 8kB Flash memory

    - ISP, but no debugWIRE or JTAG

    - Timers, PWM

    - SPI

    - TWI (I2C)

    - USART

    - 8 × 10-bit ADC channels

    - Analog comparator

    - Up to 23 I/O pins

    - Up to 16MHz operating speed

    - 2.7V to 5.5V power


    # ATmega16


    +   - 40 pin DIP package (surface-mount packages are 44 pin)

    - 16kB Flash memory

    - ISP, JTAG

    - Timers, PWM

    - SPI

    - TWI (I2C)

    - USART

    - 8 × 10-bit ADC channels

    - Analog comparator

    - Up to 32 I/O pins

    - Up to 16MHz operating speed

    - 2.7V to 5.5V power'
