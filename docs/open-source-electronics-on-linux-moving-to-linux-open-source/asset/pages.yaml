- pgno: 113
  md: '# 4.3.1 Arduino Uno Current Per I/O Pin


    On the above page, the dc current per I/O pin is given as 40mA, however according
    to the datasheet for the ATMMEGA328P microcontroller (used on the Arduino Uno),
    this is the “absolute maximum rating”. It is not a good idea to quote absolute
    maximum ratings of any electronic component as the usable rating.


    Each I/O pin can source or sink more than 20mA, however they can’t all do this
    simultaneously. The datasheet provides the following information (in statistics):


    +   When sinking current through an I/O pin:

    The sum of all IOL, for ports C0 - C5, ADC7, ADC6 should not exceed 100 mA.

    The sum of all IOL, for ports B0 - B5, D5 - D7, XTAL2 should not exceed 100 mA.

    The sum of all IOL, for ports D0 - D4, RESET should not exceed 100 mA.


    Figure 4.3 shows the difference between current sinking and current sourcing.
    ADC6 and ADC7 don’t exist on the DIP version of the microcontroller, so we can
    ignore them for Arduino. Port pins D0 to C5 are analog inputs on the Arduino (marked
    A0 to A5 on the board), so we can ignore them too (assuming that we are using
    them as analog pins, only these can be used for other purposes such as interfacing
    IC devices). XTAL1 and XTAL2 are dedicated to the crystal and not used as I/O
    pins on Arduino, so we can ignore them. The RESET pin is dedicated as a reset
    input on Arduino and can be ignored.


    This leaves B0 to B5 (6 pins) and D5 to D7 (3 pins) that should not sink more
    than 100mA. This total of 9 pins can then average 100mA/9=11mA each. And finally
    D0 to D4 (5 pins) should not sink more than 100mA. This works out to an average
    of 100mA / 5 = 20mA per pin.


    Port pins D0 to D4 map to Arduino pins 0 to 4.

    Port pins D5 to D7 map to Arduino pins 5 to 7.

    Port pins B0 to B5 map to Arduino pins 8 to 13.


    When sourcing current from an I/O pin:

    The sum of all IOH, for ports C0-C5, D0-D4, RESET should not exceed 150 mA.

    The sum of all IOH, for ports B0-B5, D5-D7, ADC6, XTAL1, XTAL2 should not exceed
    150 mA.


    Excluding the pins mentioned under “sinking” above, we are left with the – D0
    to D4 (5 pins) should not source more than 150mA, which averages to 150mA/5=30mA.
    B0 to B5 (6 pins) and D5 to D7 (3 pins) should not source more than 150mA, which
    averages to 150mA/9≈16mA.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# 4.3.1 Arduino Uno Current per I/O Pin


    # Arduino Uno current per pin summary


    Arduino pins 0 to 4 can sink a combined total of 100mA which averages 20mA per
    pin.

    Arduino pins 0 to 4 can source a combined total of 150mA which averages 30mA per
    pin.


    Arduino pins 5 to 13 can sink a combined total of 100mA which averages 11mA per
    pin.

    Arduino pins 5 to 13 can source a combined total of 150mA which averages 16mA
    per pin.


    It is better to restrict current source/sink to no more than 20mA per pin, but
    up to a maximum of 30mA if you have to, except where the limits described above
    restrict this value to below 20mA.

    Remember that the above values are averages per pin from so, if certain pins in
    a set of pins are not used as outputs, the other pins in the set can then supply
    more current.


    In the set of Arduino pins 5 to 13 for example, no more than 150mA total can be
    sourced which results in an average of 16mA per pin. This means that if every
    pin in this was set up as an output and current drawn from each pin simultaneously,
    a maximum of 16 mA could be drawn from each pin. If 7 or fewer pins were set up
    as outputs and as inputs or not used, 20mA could be drawn from each of the output
    pins simultaneously.


    If you want to use the ATMEGA328P microcontroller in a non-Arduino configuration,
    then you will have to re-calculate the current per pin in your design, as you
    may be using some of the pins, as the port pins C0 to C5 which are analog inputs
    on Arduino, as outputs for sourcing/sinking current.


    ![](img/3c46617540546e0091f48cc286948fbe_114_0.png)


    Figure 4.3: Current Sourcing and Sinking'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# Chapter 4. Open-source Hardware: Arduino


    # 4.3.2 Available Arduino Uno Pins


    There are 14 I/O pins (marked 0 to 13) on the Arduino Uno board, pins 0 and 1
    are already in use by default. These pins are connected to the UART in the AVR
    ATMEGA328P (in the DIP package) but are also routed to the ATMEGA8U2 or ATMEGA16U2
    (in the surface mount package) via 2k resistors. This allows programs to send
    and receive data on the serial port, which is redirected to the USB port via the
    ATMEGA8U2/ATMEGA16U2 which controls USB communications. It also allows Arduino
    sketches (programs) to be loaded to the ATMEGA328P. The 2k resistors connected
    between the two AVR microcontrollers are actually part of a resistor pack of four
    resistors. The other two resistors connected in parallel with each other and in
    series with the ON LED. Any circuitry that is interfaced to Arduino pins 0 and
    1 could be affected by the communication occurring on these pins. Even if these
    pins are not used in a sketch for communications with a PC, they will be used
    when loading a new sketch to the Arduino, so bear this mind using these pins.


    On Arduino Unos prior to revision 3, pin number 13 is connected to an on-board
    LED (marked “L” on the board) via two 2k resistors connected in parallel from
    a 4 resistor pack. Other devices can be interfaced to this pin without removing
    the LED but the LED being there may affect the interfaced circuit. Revision 3
    of the Arduino Uno also drives the “L” LED from pin 13, but through a unity buffer
    op-amp which makes this a free pin.


    This leaves 2 to 12 (11 pins) that are “free” (pins 2 to 13 on revision 3 Unos),
    pins 2 to 13 are fine to use, remembering that the LED connected to pin 13 may
    affect a circuit that is connected to it, depending on the actual circuit.


    # 4.3.3 Circuit Diagram / PCB Layout


    The circuit diagram and PCB layout for the Arduino Uno is available from: arduino.cc/en/Main/ArduinoBoardUno.


    The schematic is available in .pdf format and the schematic and PCB layout are
    available in Eagle format.'
  merge: -1
