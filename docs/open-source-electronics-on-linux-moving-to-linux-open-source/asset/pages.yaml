  md: 'To start the file search program, select Menu > Accessories -> Search for Files...
    which will open up the Search for Files window. Enter the name or part of the
    file in the Name contains: field, and navigate to the folder to start the search
    in the Look in folder: field. Click Select options to search for files containing
    specific text and other options such as size, date modified, etc.


    ![](img/3c46617540546e0091f48cc286948fbe_38_0.png)


    # # 1.10 The Command Line


    The command line can be used for installing software as we have already seen,
    but can also be used to perform many other tasks, including running command-line
    applications. Some of the electronics related software that we use in this book
    will be run from the command line.


    In Ubuntu, pressing Ctrl + Alt + t is an easy and quick way to start a terminal
    emulator window and work at the command prompt. Linux Mint does not have this
    key combination set up to start the terminal by default, so it must be added manually.


    To set up this keyboard shortcut in Linux Mint, Menu -> Control Center and then
    Keyboard Shortcuts in the Control Center dialog box. The first entry in the list
    of keyboard shortcuts is “Sound”. Scroll down to the next heading in the list
    “Desktop”. The last entry in the Desktop list is Run a terminal. Click Run a terminal
    and then hold down the Ctrl + Alt + t keys to make them the keyboard shortcut
    for opening a terminal window. Click the Close button when done. Now press Ctrl
    + Alt + t and a terminal window should open.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Chapter 1. Linux Basics


    # 1.10.1 Some Useful Commands


    Most of what we do at the command line in this book can be typed in or copied
    and pasted as, but it is still useful to know some basic commands. The commands
    shown below are all executed by typing them in a command window and then pressing
    the Enter key to run them. All commands are case-sensitive.


    # Listing files in a directory


    ls

    Lists files and directories in the current directory. This command is equivalent
    to the DOS dir command.


    ls -l

    Gives a more detailed list of files and directories.


    ls -a

    Shows all files and directories including hidden files and directories. In Linux
    hidden files and directories have names that start with a dot (.). To hide a file
    or directory, simply rename it by adding a dot in the front of the name.


    ls -al

    A combination of the long listing and hidden files switches above. This command
    will show all files and directories including hidden files and directories with
    more details.


    # Changing directory


    cd

    Change directory – change from the current directory to a different directory,
    e.g.:ncd Documents

    Changes to the Documents directory and:

    cd ..

    Changes one directory back from where you currently are.


    This command works basically the same way as the DOS cd command, but in Linux,
    directory and file names are case sensitive. To change your Documents directory
    in your home directory, you will need to use a capital D – a lower case d will
    not work. Entering cd on its own with no target directory, will change to your
    home directory no matter where you have currently navigated to.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# 1.10.1 Some Useful Commands


    # Current directory


    pwd


    Print working directory – displays the path of the current directory.


    # Creating and deleting files and folders


    touch


    Creates an empty file, e.g.: **touch funny.txt** creates a new empty file funny.txt
    in the current directory.


    rm


    Removes (deletes) a file, e.g. **rm funny.txt** deletes the file funny.txt if
    it exists.


    mkdir


    Creates a directory, e.g. **mkdir funny** creates a new directory called funny
    in the current directory.


    rmdir


    Removes (deletes) a directory, e.g. **rmdir funny** deletes the directory funny
    if it exists.


    # Clearing the command window


    clear


    Clears the text in the visible part of the terminal window. You can scroll up
    to see the previously displayed text.


    # Shutting down the computer


    In the event of the graphical environment of Mint hanging, there is a more elegant
    way of shutting down the system than pressing the reset button – use the **shutdown**
    command. It is possible that the graphical environment has hung in such a way
    you will not be able to start a terminal window. In this case **Ctrl + Alt + F1**
    (or **Ctrl + Alt + F2 to F6**) to switch out of the graphical mode to a text based
    screen (to switch back to the graphical environment, press **Ctrl + Alt + F8**).
    On the text screen, you will need log in by entering your user name first and
    then your password – this is the same user name and password that you use when
    logging in Linux after starting the PC. After logging in, you can shut down the
    computer by entering one of the following:


    sudo shutdown -r now


    This command will reboot the computer.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Chapter 1. Linux Basics


    sudo shutdown -h now

    This command will switch off (halt) the computer.


    # The sudo command


    The sudo command is used to temporarily give an ordinary user "super user" abilities
    that enable him to make changes to the system such as installing software and,
    as in the case above, shutting the system down.


    An ordinary user is prevented from making changes to the system that could potentially
    do damage. A super user can make any changes to the system. By temporarily gaining
    super user abilities, an ordinary user can make specific system changes and then
    revert back to an ordinary user, preventing accidental harm to the system.


    # Closing a hanged GUI window


    If an application hangs/crashes and its window fails to respond, start a terminal
    window and enter xkill. The mouse cursor will change from an arrow to an X. Click
    the window of the application to terminate with the X cursor and it will close.
    To get rid of the X cursor without using it to terminate an application, press
    Ctrl+C in the terminal.


    Note that this is not a recommended way of terminating applications and must only
    be used with application that have hung up. Also note that sometimes an application
    may appear to have hanged, but may be busy processing data.


    # 1.10.2 Time Saving Tricks


    To save time when using the command line, there are some tricks that can be used
    to reduce the amount of typing needed.


    # Using the Tab key


    The Tab key can be used to auto-complete typing and also be used to list file
    or directory names starting with certain characters. For example to the Download
    directory from your home directory, type cd Do and then press the Tab key to auto-complete
    the directory name "Download". If you type cd Do and press the Tab key, nothing
    will happen. This is because there is more than one directory starting with the
    letters "Do" (Downloads and Documents). If you type cd Do and press the Tab key
    twice, the directories (and files if there are any) starting with the letters
    "Do" will be listed.


    The same applies to commands, for example type mk and then press the Tab key twice.
    A whole list of commands starting with "mk" will be listed. If there was only
    one command starting with "mk" then its name will be auto-completed by pressing
    the Tab key once.'
  merge: -1
  img_proc: true
