    # 1.5 Installing Linux


    There is so much information on the Internet on installing Linux, so rather than
    repeating that information here, this section contains the basic steps for doing
    an installation to a dedicated computer and provides links to resources for getting
    more information. I have posted some information on planning an installation well
    as alternative installation options at linuxbook.startingelectronics.com which
    I suggest you read first. This resource contains information on what to do if
    you want to dual-boot Linux/Windows and what to do if you want to boot more than
    one Ubuntu or Ubuntu derivative from the same computer. Moving information out
    of the book leaves more pages for electronics related material.


    In Linux Mint, you can only boot the operating system and install it by double-clicking
    the installation icon on the desktop. In Ubuntu, you can choose to install Ubuntu
    from the menu that appears after booting the CD/DVD or from a live boot session
    by double-clicking the installation icon on the desktop.


    The basic steps in installation are to connect your PC to the Internet, boot off
    the CD, DVD or Flash and then start the installation from the installation icon
    on the desktop.


    The installation program will take you through the installation steps that include
    choosing the type of installation (e.g. dual-booting or erase the disk and then
    install), choosing your keyboard type, selecting your location, and choosing your
    user name and password.


    Installation Resources

    linuxbook.startingelectronics.com - additional pages for this book moved online

    Linux Mint: linuxmint.com/documentation.php


    Ubuntu: help.ubuntu.com/community/Installation and help.ubuntu.com/community/GraphicalInstall'
