  md: '# Chapter 4. Open-source Hardware: Arduino


    # C. PWM motor controller


    This example uses PWM control from the previous section and serial communications
    from this section to speed control a small DC motor. The program is included with
    the accompanying files in: `CH04/sketchbook/PWM_motor/`


    Build the circuit shown in figure **4.8** and load the program to the Arduino
    board. The circuit can drive only small DC motors that draw low currents (up to
    about 60mA maximum), like a CPU cooling fan from an old PC. To control the speed
    of the motor, run the Arduino serial monitor program. Press ''u'' to increase
    the speed of the motor and ''d'' to decrease the speed of the motor. The value
    written to the PWM will be incremented or decremented by 5 each time ''u'' or
    ''d'' is sent. To change this step value, send the character ''1'' to ''5'' from
    the serial monitor to the Arduino. When you next increase or decrease the PWM
    value, it will change in size by the new step value.


    Due to the PWM frequency of the Arduino being in the audio range (about 490Hz),
    you may hear the motor giving an audible noise when running at low speeds. The
    noise can be reduced by putting a capacitor across the motor terminals. Try using
    an electrolytic capacitor with a value between 10µF and 100µF.


    ![](img/3c46617540546e0091f48cc286948fbe_123_0.png)


    Figure 4.8: Interfacing a Small DC Motor'
