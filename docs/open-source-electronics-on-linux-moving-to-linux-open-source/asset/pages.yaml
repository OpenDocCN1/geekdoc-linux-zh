- pgno: 241
  md: '# Appendix A – Home Made PCBs


    # Printing the Copper Layer


    The copper layer of the PCB must be printed on photo paper using a laser printer.
    First it is plotted to a postscript file and then printed from the postscript
    file.


    # Plotting the PCB from KiCad PCBnew


    With the PCB open in PCBnew, click the Plot icon on the toolbar or File > Plot
    to open the Plot dialog box. In the Plot dialog box, change the following:


    +   - Select Postscript in the Plot format: drop-down box.

    - In the Layers box, only Back must be checked, but if you are printing on post-card
    sized paper, then click PCB_Edges as well to save some toner.

    - Under options, Mirrored plot must be unchecked.

    - In the Drill marks: drop-down box, select Small or Actual size. Small will make
    a small mark of the same size in each pad allowing easy centring of the drill
    when drilling.

    - Scaling: must be 1:1.

    - Plot mode: must be Filled.


    The Plot dialog box should now look like figure A.4. Click the Plot button when
    done. The Messages: box in the Plot dialog box will show the name and location
    of the postscript file that was generated. Close the Plot dialog box when finished.


    ![](img/3c46617540546e0091f48cc286948fbe_241_0.png)


    Figure A.4: Plot Settings for Printing the Back Copper Layer'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# Printing on Photo Paper


    Open the postscript file that was plotted by navigating to it using the file manager
    and doubleclicking it. If you have photo paper that matches the size of the plotted
    file, e.g. A4, then you can print it on a laser printer right away. If you are
    using smaller post-card sized paper, you will need to first print onto ordinary
    paper to mark the position of the board and tape the smaller photo paper to the
    printed page and send it through the printer again. In this case, rather open
    the PCB Edges plot that you did in step 2 above of the plot. When working with
    photo paper, be careful not to bend or crease it.


    # Printing the page


    Turn your laser printer on and plug it into the PC. In Linux Mint, the postscript
    file will open in Document Viewer, click File -> Print to open the Print dialog
    box. If printing on smaller post-card sized photo paper, then skip to “Printing
    to plain paper first” below.


    # Printing to photo paper


    Use the Print dialog to select your laser printer and the best image quality and
    denser toner setting. If under Paper source: on your laser printer has a manual
    feed option, then select this on the Page Setup tab of the Print dialog box. If
    your laser printer has a door at the back that can be opened to let the printed
    paper out without bending it over a roller, then open the door. Make sure that
    you print on the glossy side of the paper. When done, click the Print button to
    print the page. If you have selected to manually feed the paper into the printer,
    then feed it so that the image is printed to the glossy side of the page.


    # Printing to plain paper first


    If first printing the board outline to plain paper, you can select low print quality
    to save toner. If your laser printer has a door at the back that allows the paper
    to exit without bending it over a roller, then open this now. By before-printing,
    get ready to note which way the paper came out of the printer, so that you can
    feed it into the printer the right way after you have stuck the photo paper to
    it. Click the Print button to print the board outline on plain paper from the
    default tray. Use some tape to stick the photo card to the paper, glossy side
    under. Use tape only on the edge of the card that will go into the printer first
    as shown in figure A.5. Now open the postscript file that contains the back layer
    of the board and follow the instructions under “Printing to photo paper” to manually
    feed your plain paper with photo paper stuck to and print the copper layer to
    the photo paper card. Make sure that you feed the paper into the printer right
    way around.'
  merge: -1
  img_proc: true
