    > Figure 5.3: AVR Parallel Port Programmer


    To build this circuit on breadboard, you will need a 25-pin male D-type connector
    and a multicore cable. The multi-core cable will need to be long enough to reach
    from your PC''s parallel port to your breadboard, but try to keep the cable as
    short as possible.


