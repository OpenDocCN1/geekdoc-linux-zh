- pgno: 236
  md: '# Appendix A – Home Made PCBs


    This appendix describes one method of making your own single-sided printed circuit
    boards at home and is the method used to make the PCBs for all the projects in
    this book. There are other methods, but the method described here is probably
    cheaper than other methods assuming you already have a laser printer, a clothes
    iron and some other tools.


    The method involves printing the PCB tracks on photo paper and then transferring
    the printed tracks with toner to copper-clad board. The toner acts as a mask allowing
    the exposed copper to be etched away using ferric chloride. The same toner transfer
    method is used to make a silkscreen for the top side of the board that contains
    the outlines of the components and the component''s reference designators.


    This appendix is in a tutorial format and describes how to make the PCB from the
    Linux to LCD (lcd2usb) project in 8.2 of chapter 8.


    # Warnings and Safety


    You will be working with tools and chemicals that can potentially cause harm to
    yourself, others and your property. Please take the necessary precautions to minimise
    the risk. Rather do not proceed if you are unsure of anything.


    Some precautions to consider before proceeding:


    +   - Before using any chemical or tool, read warning labels and safety instructions
    supplied with the chemical or tool.

    - The clothes and soldering iron that you will be getting hot enough to burn yourself
    or something else. Be careful when using these tools and also where you place
    them. Whatever you use tools on will heat up so don''t touch these objects until
    they have cooled down.

    - Wear appropriate safety equipment when necessary – eye protection and a dust
    mask when drilling, cutting or filing. Eye protection and nitrile gloves when
    working with chemicals.

    - Be careful not to get chemicals on your body or clothes.

    - Wear a lab coat or old clothes when working with chemicals.

    - Ensure adequate ventilation when working with chemicals.

    - Cutting paper and scoring PCB with a blade or knife is dangerous. Make sure
    that your fingers are holding the steel rule are out of the way of the blade.
    Do not apply too much pressure on the blade when cutting.'
  merge: -1
  img_proc: true
