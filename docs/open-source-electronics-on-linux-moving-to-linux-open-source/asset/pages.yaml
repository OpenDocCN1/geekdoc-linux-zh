- pgno: 119
  md: '# Chapter 4. Open-source Hardware: Arduino


    Both of the example programs behave again continuously send data over the USB
    port and this causes problems with firstly, connecting the serial monitor program
    to the board and secondly, trying to load a new program into the Arduino board—the
    Arduino IDE momentarily freezes and communication errors occur when trying to
    load a new program. The solution is to load the latest firmware to the ATMMEGAU2
    microcontroller on the Arduino board (this is the SMT microcontroller near the
    USB port). To load the new firmware, follow these steps:


    +   - Start a terminal window (Ctrl + Alt + t).

    - Now load the DFU (device firmware update) program by entering:

    `sudo apt-get install dfu-programmer`

    (You must be connected to the Internet to install this software)

    - We need to load the on-chip bootloader of the ATMMEGA8U2, so power the Arduino
    board from the USB cable.

    - Connect a wire from one of the GND connections to the pad at ①, figure 4.5 and
    keep it connected.

    - Now connect a wire from another GND connection and connect it to the end of
    the capacitor at ②, figure 4.5, then disconnect it.

    - Disconnect the first wire as well.

    - In the terminal window, type:

    `sudo dfu-programmer at90usb82 get bootloader-version`


    If the bootloader was loaded, you will get back a version number, if not, follow
    steps 4 to 6 and then try this step again.


    +   - Now download the Arduino bootloader, from:

    `github.com/arduino/Arduino/tree/master/hardware/arduino/firmwares/atmegaxuu/arduino-usbserial/`


    The file will be called Arduino-usbserial-uno.hex for the Arduino Uno. In your
    browser, click on the file name and another window will open with a listing of
    the file contents. It is a hex file, each line of the file will start with a colon
    ":". Just above the listing to the right is a link called "raw", right-click this
    link and choose Save Link As... to save the file. The file is also available with
    the files downloaded for this board CH04.


    118'
