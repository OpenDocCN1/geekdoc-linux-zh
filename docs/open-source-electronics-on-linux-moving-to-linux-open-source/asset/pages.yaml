- pgno: 148
  md: '# 5.2.1 AVR Programming Software and Test Hardware


    All of these programmers perform the same function and the choice of which one
    to build or buy is up to you, depending on your circumstances.


    For the home-built programmers, you will need either a serial port or parallel
    port on your PC, so if you don''t have either of these, you may choose to buy
    a programmer. The home-built USB programmer contains a microcontroller that needs
    to be programmed once to get it working. For this you need to already have a programmer,
    or to build the serial or parallel programmer. The serial or parallel programmers
    can be temporarily built on breadboard to initially program the microcontroller
    of the USB programmer. If you don''t have the means to program the microcontroller
    on the USB programmer, you can buy a kit that you build yourself.


    I would suggest that the USB programmer should be the programmer of choice to
    build and either the serial or parallel programmer on breadboard to initially
    program it.


    Once you have bought or built your programmer, you will need to load some software
    on your PC that will allow you to load a program from the PC through the programmer
    to the AVR microcontroller.


    # 5.2.1 AVR Programming Software and Test Hardware


    # C compiler


    If you installed the Arduino IDE in the previous chapter, you will already have
    the AVR GNU C compiler on your PC as it is installed part of the Arduino installation.
    If not, you will need to install the compiler now.


    To install the compiler, start the Software Manager and enter `gcc-avr` in the
    search field. The GNU C compiler will appear in the search panel. Install the
    software. To test that the software was successfully installed, start a terminal
    window and enter:


    ```

    avr-gcc --version

    ```


    You should get back version information.


    # Programmer software


    We will be using the “avrdude” program for loading software to AVR microcontrollers.
    All of the programmers in this section can be used with avrdude. Again, if you
    installed Arduino then avrdude will already be installed on your system. If not,
    install it from the Software Manager.'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# Chapter 5. AVR 8-bit Microcontrollers


    To test avrdude is successfully installed, simply type avrdude in a terminal window.
    A list of switches and version number will be displayed.


    # AVR test hardware


    Once any of the programmers in this chapter have been built or bought, it is necessary
    to test them. A test circuit based on the ATTINY2313 is shown in figure 5.2. It
    is basically just an AVR microcontroller with a single LED interfaced to it. This
    circuit can be built on onboard and single core wires connected from the programmer''s
    connector to the AVR on the breadboard, so the ISP header as shown in the figure
    is not necessary (but will help to wire the programmer to the AVR correctly).


    The ISP header in the figure shows the standard 6-pin connector pinout of the
    AVR ISP interface.


    To test each programmer, the programmer must first be connected to the PC and
    connected to the test circuit through the ISP interface connector. Power must
    be applied to the test circuit and then avrdude must be run, first to get status
    information from the AVR in the test circuit and then to load a program to the
    AVR.


    ![](img/3c46617540546e0091f48cc286948fbe_149_0.png)


