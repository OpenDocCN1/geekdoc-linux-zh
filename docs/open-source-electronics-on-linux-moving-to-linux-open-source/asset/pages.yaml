    LibreOffice (libreoffice.org) is the default office suite of applications on Mint.
    LibreOffice consists of several programs in its suite:


    +   - a word processor

    - a spreadsheet program (equivalent of MS Excel)

    - for multimedia presentations (equivalent of MS PowerPoint)

    - for drawing diagrams

    - database front-end


    # Internet Browser


    Mozilla Firefox (mozilla.org) as its default Internet browser. The Chromium web
    browser (chromium.org) is an alternative.


    # Email


    Mozilla Thunderbird (mozilla.org) is the default email program on Mint.


    # FTP Program


    If you have your own website, you may need an FTP program for uploading content
    to your website. FileZilla (filezilla-project.org) is an excellent program to
    use for this task and is available through the software manager.


    # Photo Editing


    GIMP (GNU Image Manipulation Program) gimp.org is the equivalent of Adobe Photoshop
    and used for editing photographs.


    # Drawing


    For vector drawing, Inkscape (inkscape.org) is available and has similar capabilities
    to Adobe Illustrator and CorelDraw.


    # Audio editing


    Audacity (audacity.sourceforge.net) is a great program for recording and editing
    audio.


    # Text Editor IDE


    There are many text editors for editing source code when writing programs. Even
    the default Mint text editor pluma has syntax highlighting for many different
    languages. I would also like to suggest Geany (geany.org) which is a fast and
    lightweight IDE that includes syntax highlighting, code completion and many other
    features.'
