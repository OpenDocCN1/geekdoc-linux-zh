- pgno: 198
  md: '# 6.5 MSP430 ZIF Socket Board


    The MSP-FET430U64 is a kit from TI that includes a development board with 64-pin
    LQFP ZIFsocket, two different MSP430 devices and a USB JTAG programmer/emulator.
    It allows evaluation and programming of various 64-pin MSP430 devices. The board
    and USB JTAG emulator are also available separately.


    Figure 6.2 shows the development board from the kit with the ZIF socket open and
    a MSP430 64-pin LQFP device inserted. After a MSP430 has been inserted into the
    socket, the lid of the socket is pushed down and the clip on the lid latches the
    lid closed. It is easy to unclip the lid and place a new device in the socket.
    All of the pins of the inserted device are available on the board. Headers are
    included in the kit for soldering to the board which then enables the pins to
    be connected to a breadboard or piggyback board.


    ![](img/3c46617540546e0091f48cc286948fbe_198_0.png)


    Figure 6.2: A MSP430 ZIF Socket Board'
  merge: -1
  img_proc: true
- pgno: 199
  md: '# Chapter 6. MSP430 16-bit Microcontrollers


    The two MSP430 devices included in the kit are the MSP430F417 and MSP430F2619,
    but the board also supports many other MSP430 devices that are packaged in a 64-pin
    LQFP. The features of these two microcontrollers are listed below.


    # MSP430F417


    +   * 32kb Flash 1k byte RAM

    * Up to 8MHz operation

    * 1.8V to 3.6V operation

    * 96 segment LCD controller

    * Analog comparator

    * 16-bit timer

    * 48 GPIO pins


    # MSP430F2619


    +   * 120kb Flash 4k bytes RAM

    * Up to 16MHz operation

    * 1.8V to 3.6V operation

    * 12-bit ADC, 8 channels

    * Dual 12-bit DAC

    * 4 × USCI configurable as UART, IrDA encoder/decoder, SPI or IC

    * Analog comparator

    * 16-bit timers

    * Temperature sensor

    * 48 GPIO pins


    The next section explains how to program this development board using the MSP-FET430UIF
    USB JTAG emulator. The development board has a single LED that allows quick testing
    of board and programming tools.'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# 6.6 Standard JTAG Tool


    The standard JTAG tool for MSP430 microcontrollers is the MSP-FET430UIF shown
    in figure 6.1. We will now plug this device into the board of figure 6.2 and load
    a program into the MSP430 in the ZIF socket that will flash the on-board LED on
    and off.


    Two programs provided for use in this exercise can be found with the accompanying
    files in CH06/TS430PM64/MSP430F417_blink/ and CH06/TS430PM64/MSP430F417_blink_fast/.
    Both programs will flash the LED on the evaluation board, but at different rates.
    Run the make file to build either of the projects.


    After building the project, plug the MSP-FET430UIF into the JTAG header of the
    development board. When the FET430 is plugged into the PC''s USB port, it will
    power the target board.


    # Programming the board


    To program the board, open a terminal window, change to the directory containing
    the example program and enter:


    ```

    sudo mspdebug -d /dev/ttyUSB0 uif -j "prog main.elf"

    ```


    (if you added the udev rule under the LaunchPad section of this chapter then you
    can leave “sudo” off the above line)'
  merge: -1
