  md: '# 4.5.2 The Ethernet Shield Hardware


    The web page for the WebServer example can be found at:

    arduino.cc/en/Tutorial/WebServer


    # 4.5.2 The Ethernet Shield Hardware


    Circuit diagram and board layout


    Links to the circuit diagram of the Ethernet shield and Eagle CAD files of the
    schematic and board layout can be found at:

    arduino.cc/en/Main/ArduinoEthernetShield


    # Arduino pins used by the Ethernet shield


    For a good illustration of the pins used by the Ethernet shield, take a look at
    the web page:

    sheidlist.org/arduino/ethernet-v5


    Looking at the Ethernet shield circuit diagram, it may appear that the data on
    the above web page is incorrect, as the circuit diagram shows that nothing is
    connected to Arduino pins 11 and 12 and that pin 13 is connected to an LED. This
    is because pins 11, 12 and 13 are connected to the ICSP header on the Arduino
    board and the Ethernet shield connects to these pins via the connector directly
    through the connector on the side. These pins have the following functions:


    +   13 – SCK of SPI bus

    12 – MISO of SPI bus

    11 – MOSI of SPI bus


    To summarise the pin usage:

    Pins used by Ethernet shield

    A0 and A1 analog inputs

    Pins 4, 10, 11, 12, 13


    Pins available for general purpose use

    A2 to A5 analog inputs

    Pins 0 to 3 (except pins 0 and 1 are normally connected to the USB chip on the
    Arduino board)

    Pins 5 to 9'
