  md: '# 4.4.1 Using the PWM


    # 4.3.4 Home-made Arduino


    You can make your own single-sided Arduino board at home if you would like to.
    The main difference between the home-made board and the Arduino Uno is that the
    home-made board does not have the USB port, which connects to the PC using an
    RS-232 port instead. Version 3 of the Single-Sided Serial Board can be found at:
    arduino.cc/en/Main/ArduinoBoardSerialSided3


    # 4.4 More Example Projects


    To get familiar with Arduino and to know some of its capabilities and how its
    programming language works, I suggest working through the following example projects.
    You may already have many of the parts needed to complete the projects in your
    spares box. All of the projects listed below can be built by interfacing the Arduino
    board to components using an electronic bread board. The example projects that
    are included with the Arduino IDE can be found on the Arduino website at: arduino.cc/en/Tutorial/HomePage


    # 4.4.1 Using the PWM


    The pulse width modulator (PWM) pins on the Arduino board can be used to output
    a voltage with a value between 0V and 5V. On the Uno board, there are six PWM
    output pins each marked with a tilde (~) on the board.


    # Dimming an LED


    The Fade example can be found in the Arduino IDE under File > Examples > Basics
    → Fade. An LED with a series resistor must be connected between pin 9 of the Arduino
    board and one of the GND pins. The resistor value can be between 220Ω and 1kΩ.


    A circuit diagram and explanation of the program can be found on the Arduino website
    at: arduino.cc/en/Tutorial/Fade'
