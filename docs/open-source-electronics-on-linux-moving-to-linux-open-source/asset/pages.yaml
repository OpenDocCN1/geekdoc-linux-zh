- pgno: 217
  md: '# 8.6 Example LCD2USB PC Program


    A modified version of Till Harbaum’s lcd2usb test program can be found with the
    accompanying files in CH08/LCD2USB_dev. This program can be run from a terminal
    window changing to its directory and entering:

    sudo ./lcd2usb


    If there is a problem running the file, it is probably because it has not been
    marked as executable.

    Just under enter chmod +x lcd2usb in the terminal window to mark the file as executable,
    or build the file again by entering make clean and then make.


    The program will initially display “Hello, world!” on the first line of the LCD.
    After button 1 on the USB2LCD board is pressed, the current date and time will
    be displayed and continually updated. If button 2 is pressed, the PC program will
    exit.


    Use this source code as a starting point for your own LCD2USB PC programs.'
