  md: "# 8.5 Using the LCD with lcd4linux\n\n```\nWidget Eth0Bar {\n  class 'Bar'\n\
    \  expression netdev('eth0', 'Rx_bytes', 1000)\n  expression2 netdev('eth0', 'Tx_bytes',\
    \ 1000)\n  length 14\n  direction 'E'\n  update tack\n}\n```\n\nThis widget is\
    \ set to display a bar graph of the data received and transmitted over Ethernet\
    \ connection eth0. It is configured to be 14 characters long and move in an East\
    \ direction. It is updated at a speed of \"tack\" which is defined in the fisturst\
    \ structure of the file.\n\nAfter the widgets, various \"Layout\" structures are\
    \ defined. E.g. for the 20 by 4 LCD:\n\n```\nLayout L20x4 {\n  Row1 {\n    Coll1\
    \ 'CPU'\n    Coll10 'RAM'\n  }\n  Row2 {\n    Coll1 'Uptime'\n  }\n  Row3 {\n\
    \    Coll1 'Eth0'\n  }\n  Row4 {\n    Coll1 'Eth0Bar'\n    Coll20 'Heartbeat'\n\
    \  }\n}\n```\n\nThis structure defines which widgets to place and where to place\
    \ them. E.g. Column 1 of row 2 of the LCD displays the \"Uptime\" widget.\n\n\
    At the bottom of the file, the display to use (our LCD2USB display defined in\
    \ the second structure at the top of the file) and layout is set. Many other layouts\
    \ are listed, but are commented out. This allows easy changes between layouts\
    \ by commenting out an existing one and uncommenting a different one. These lines\
