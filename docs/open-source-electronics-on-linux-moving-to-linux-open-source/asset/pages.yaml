- pgno: 137
  md: '# Chapter 4. Open-source Hardware: Arduino


    Wire-wrap headers as those used on the Arduino Ethernet shield are ideal for interfacing
    stripboard to the Arduino. The long pins make it possible to insert these headers
    into the stripboard and solder them underneath. With some careful bending of these
    long pins that connect to the header P1 in figure 4.14, it is possible to connect
    the stripboard to the misaligned header making all of the Arduino I/O pins available
    on the stripboard.


    The wire-wrap headers also make it possible to plug another shield into the top
    of the Arduino/stripboard shield stack, but if it is a standard shield, the spacing
    between P1 and P2 on the stripboard will prevent it from being plugged in. In
    this case you would need to plug the shield into the Arduino first and then stack
    the stripboard shield on top. A supplier for these wire-wrap headers, search for
    Arduino header kit on the Internet.


    Something to look for when building a stripboard shield is the clearance of the
    board above the USB connector. If any pins protrude too far from underneath the
    stripboard, they can short out against the metal USB connector housing. The same
    applies for components assembled over the ICSP header on the board. The ICSP header
    for the USB microcontroller may also be present on the board, depending on which
    version of the Arduino Uno you have (It is near the USB connector).


    Using standard pin headers is also possible, but because of the shorter pin, the
    pins of the misaligned header will not be able to accommodate this connection
    as already discussed. The other problem is that the stripboard will have be connected
    "upside down" with the tracks facing up when the shield is plugged into the Arduino
    so that the pin headers can be soldered properly. This creates two problems –
    firstly there is not much clear room for components between the stripboard shield
    and the Arduino board. Secondly components that need to be available on the top
    of the stripboard shield will have to be soldered directly to the tracks which
    will be facing up – e.g. LEDs interfaced on the board will need to be seen so
    will need to be soldered directly to the tracks.


    # 4.6.2 PCB Shield


    You will find KiCad templates for an Arduino shield with the accompanying files
    in CH04/KiCad/Arduino_shield_template. To start a new KiCad project using the
    template files, make a copy of the template folder and rename it to the name of
    your new project. Also rename the files in this folder with the name of your project.
    Start a new KiCad project and save it in the template folder that you renamed.
    Save the project with the same name as the folder that you renamed.


    You can now open and modify the schematic. The Arduino headers are already on
    the schematic and in the correct position in the PCB file, so just start by deleting
    the comment and the no connects from the Arduino pins that you are going to use.
    Generate a netlist and assign footprints to the components using CVpcb as in the
    tutorial from chapter 2. In PCBnew, read the netlist – the components that you
    added in the schematic and'
  merge: -1
