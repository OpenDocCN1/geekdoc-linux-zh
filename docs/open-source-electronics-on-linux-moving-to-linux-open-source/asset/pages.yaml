- pgno: 147
  md: '# ATmega48PA


    +   * 28 pin DIP package (surface-mount packages are 28 pin and 32 pin)

    * 4kB Flash memory

    * ISP, debugWIRE

    * Timers, PWM

    * SPI/USART

    * TWI (IC)

    * USART

    * 8 × 10-bit ADC channels

    * Analog comparator

    * Up to 23 I/O pins

    * Up to 20MHz operating speed

    * 1.8V to 5.5V power


    # ATmega328P


    This is the microcontroller used on the Arduino Uno board. It is very similar
    to the ATmega48PA (pin compatible and share the same datasheet), but has 32kB
    of flash instead of 4kb, SRAM and a few minor differences.


    A parametric table for megaAVRs in LibreOffice format can be found with the accompanying
    files: `CH05/megaAVR_Parametric_Table-2.ods`


    # 5.2 AVR Programmers


    There are a number of different AVR programmers for in-circuit programming (ISP)
    of AVR microcontrollers. Some of these programmers can be home built, but we also
    look at the standard AVR programmer from Atmel the AVR Dragon, which can be used
    for programming as well as debugging.


    Home built programmers are available for programming AVR microcontrollers from
    the PC attached either to the parallel port, or the serial port, or the USB port
    – all three are covered.


    All of the programmers in this section are for programming AVR microcontrollers
    while they are soldered in a circuit (or plugged into a breadboard) and are externally
    powered. These devices are for programming only and not for debugging, except
    for the AVR Dragon which has some debugging capabilities that are discussed later
    in the JTAG/debugWIRE section.'
