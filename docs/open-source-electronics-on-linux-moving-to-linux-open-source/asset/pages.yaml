    # Testing the Arduino SD card interface


    Before starting the SD card web server program, it is a good idea to test the
    SD card first. In the Arduino IDE, open the program under File -> Examples ->
    SD -> ReadWrite. With the microSD plugged into the Ethernet shield, load this
    program to the Arduino and then open up the Serial Monitor. The serial monitor
    will display whether the SD card was successfully initialised or whether initialisation
    failed. If the card was initialised, the program will create a file called "test.txt"
    on the SD card and write some text to it. Remove the SD card from the socket and
    plug it into the PC through the card reader. You should see the "test.txt" file
    and be able to open it and read the text that was written to it.


    # SDwebserver server program


    Open the SDwebserver program from the accompanying files in the Arduino IDE. This
    program will allow the web pages on the SD card plugged into the Arduino Ethernet
    shield to be viewed with a web browser over an Ethernet link. The example web
    pages need to be copied to the SD card using the PC and card reader. The files
    to copy to the SD card can be found in the sub-folder of the SDwebserver folder
    called files_for_sd - they are: index.htm, page2.htm and logo.png.


    After copying the web pages to the SD card, plug it into the SD socket of the
    Ethernet shield. The SDwebserver program, change the MAC and IP address as you
    have done in previous examples and then load the program to the Arduino. Now surf
    to the IP address of the Arduino using your web browser.'
