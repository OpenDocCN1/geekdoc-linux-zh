- pgno: 155
  md: '# Chapter 5. AVR 8-bit Microcontrollers


    5.2.4 USB AVR Programmer


    The USB AVR programmer presented here is based on an open-source hardware/firmware
    project called "USB Tiny ISP", from the ladyada.net website, with a few changes
    to the hardware. The web page for the original programmer is:

    ladyada.net/make/usbtinyisp/


    A kit is available from www.adafruit.com that contains a double-sided PCB, electronic
    components and a nice box to house the project when you go to, if you don''t want
    to go to the making of your own PCB, you can buy the kit. The firmware is also
    pre-programmed in the AVR used in the programmer so you won''t require a programmer
    or parallel serial port on your PC to load the firmware to this device.


    Figure 5.6 shows the modified circuit of the usbtinyISP from ladyada.net. The
    main reason for modifying the circuit is to get it onto a single-sided PCB. The
    74HC244 in the circuit of figure 5.6 replaces the 74AH125 in the original circuit.
    This makes it easier to lay out the PCB for the circuit on a single-sided board.
    The other difference between this circuit and the original is that this circuit
    does not have the 10 pin header, the 6 pin header. The 10 pin header can be added
    to the circuit if desired.


    The KiCad circuit diagram and PCB for this version of the usbtinyISP can be found
    in the accompanying files in CH05/KiCad/UsbtinyISP/. This will allow you to make
    your own usbtinyISP on a single-sided PCB at home. Postscript plots of the copper
    and silkscreen layers are found in this folder.


    # KiCad Design Notes - UsbtinyISP


    PCB

    Placing fills: The UsbtinyISP PCB has some areas that are filled with solid copper.
    This is done by clicking the "Add filled zones" button on the tool toolbar in
    PCBnew and clicking on the PCB at the place that you would like to start the fill
    zone. The Zone Properties dialog box will pop up. Choose the layer that would
    like the fill to be on, e.g. the back layer, and then choose the name of the net,
    e.g. GND if the area is to be part of the GND of the circuit. Click Ok to close
    the dialog box and then draw the area to be filled by moving the mouse and clicking.
    To finish the filled zone, double-click. The area drawn will initially not be
    shown. To fill it, right-click the edge of the area and then choose Zones -> Fill
    Zone or right-click on the PCB and choose Fill All Zones.


    Links to the schematic and PCB layout for the original UsbtinyISP can be found
    at the ladyada.net website at www.ladyada.net/make/usbtinyisp/


    154'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# 5.2.4 USB AVR Programmer


    The details that follow the headings of speed and operating voltage have to do
    with the problems that are encountered when programming a target circuit that
    is operating from a voltage that is lower than 3.3V. If you are never going to
    use the programmer of figure 5.6 to program a target operating from much below
    3.3V, then go ahead and built it with no modifications. Just note that the part
    number of the ATtiny213 to be used in the programmer is ATtiny2313-20PU.


    ![](img/3c46617540546e0091f48cc286948fbe_156_0.png)


    Figure 5.6: USB ISP for AVR Microcontrollers


    # ATTINY2313 speed grades


    The ATTINY2313 is operating from a 12MHz crystal in the USBISP. The ATTINY2313
    datasheet has the following information about speed grades:


    ATtiny2313V: 0 – 4 MHz @ 1.8 - 5.5V, 0 – 10 MHz @ 2.7 – 5.5V

    ATtiny2313: 0 – 10 MHz @ 2.7 - 5.5V, 0 – 20 MHz @ 4.5 – 5.5V


    So to operate the ATTINY2313 at 12MHz, the ATtiny2313 must be used and not the
    ATtiny2313V, furthermore, it must be powered from 5V to be able to operate at
    full speed. The full part number for the ATTINY2313 in a DIP package that operates
    up to 20MHz is: ATtiny2313-20PU.


    The graph of figure 5.7 has been taken from the ATtiny2313 datasheet and has been
    modified to show the maximum frequency that the ATtiny2313 can be operated at
    when powered from 3.3V.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# Chapter 5. AVR 8-bit Microcontrollers


    ![](img/3c46617540546e0091f48cc286948fbe_157_0.png)


    Figure 5.7: Maximum Frequency versus Vcc for the ATtiny2313


    The significance of this is to show that the programmer of figure 5.6 can be powered
    and used to program a target that is operating from 3.3V to 5V. When powered from
    3.3V, the ATtiny2313 can operate up to 13MHz, so operating at 12MHz allows a margin
    of safety.


    # USBtinyISP operating voltage


    JP1 in figure 5.6 can be used to power the programmer from the USB 5V supply JP1
    pins 2 and 3 shorted by a jumper in which case the target must be supplied by
    external 5V. The only reason that you would use this jumper configuration is to
    test if the programmer can be seen by Linux without having to connect it to a
    circuit in order for it to be powered up.


    When JP1 is shorted by a jumper between pins 1 and 2, the programmer is powered
    by the target''s power supply. In this case the target''s power can be between
    3.3V and 5V, allowing the ATtiny2313 to operate at 12MHz as previously discussed.


    This is another difference between the original USBtinyISP and the one of figure
    5.6. The original always has the ATtiny2313 powered from the 5V and only the buffer
    IC, a 74HC125, is powered by the target circuit. This enables the programmer to
    program targets powered from 2V to 6V. If a jumper on this programmer is shorted,
    then it will operate the buffer from the USB 5V and power the target from 5V as
    well.


    It is easy to modify the circuit of figure 5.6 to power the buffer chip, a 74HC244
    (U2 in the figure), from the target power and power the ATtiny2313 from the USB
    5V only. In this case A4HC244 must be used instead of the 74HC244 because the
    HC part only accepts a logic input voltage between 0 and Vcc, but the AHC part
    can accept a logic voltage between 0 and 5.5V even if Vcc is only 2V.


    156'
  merge: -1
  img_proc: true
