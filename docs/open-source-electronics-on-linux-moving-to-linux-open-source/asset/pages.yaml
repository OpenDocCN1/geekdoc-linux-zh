- pgno: 188
  md: '# # Chapter 6. MSP430 16-bit Microcontrollers


    The MSP430 range of microcontrollers from Texas Instruments (www.ti.com/msp430)
    are low power 16-bit RISC devices that are particularly suited for use in battery-powered
    applications because of their low power usage. MSP430 microcontrollers can be
    programmed using the GNU toolchain for MSP430.


    Texas Instruments sell a very low cost evaluation board called the LaunchPad that
    can be used to program and evaluate some of the MSP430 family. In this chapter,
    we will look at using the LaunchPad in Linux, as well as the eZ430-Chronos – a
    development tool packaged as a sports watch, and finally we look at a board that
    has a Zero Insertion Force (ZIF) socket for easily plugging in quad-flat-pack
    devices for evaluation and development. Figure 6.1 shows the three kits covered
    in this chapter.


    ![](img/3c46617540546e0091f48cc286948fbe_188_0.png)


    Left - LaunchPad with spare microcontroller, crystal and connectors.

    Centre - eZ430-Chronos with programming module, RF module, spare screws and screwdriver.

    Right - ZIF socket board with JTAG emulator/programmer, connectors, microcontrollers
    and crystal.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# 6.1 An Overview of 16-bit MSP430s


    There are over 200 devices in the MSP430 family that fall into one of the following
    categories:


    +   * MSP430 1xx 8MHz

    1k to 16k bytes ROM, and 1 to 60k bytes Flash devices

    1.8V to 3.6V operation

    14, 22 or 48 GPIO pins

    ADC, analog comparator, DAC, temp sensor

    A MSP430F1612 (quad flat pack) from this category is included on the LaunchPad
    for programming the DIP socket user programmable MSP430 on the board

    A MSP430F1612 (quad flat pack) is present on the USB programming module that comes
    with the eZ430-Chronos kit for programming the watch module


    +   * MSP430 2xx 16MHz

    1k to 120k bytes Flash

    1.8V to 3.6V operation

    10, 16, 24, 32, 48 or 64 GPIO pins

    ADC, analog comparator, DAC, temp sensor

    A MSP430F2619 (quad flat pack) is used in this chapter with the ZIF socket board


    +   * MSP430 G2xx Value 16MHz (Value Line)

    0.5k to 16k bytes Flash

    1.8V to 3.6V operation

    10, 16 or 24 GPIO pins

    ADC, analog comparator, temp sensor

    The LaunchPad kit comes with two 14-pin DIP MSP430G2xx user programmable microcontrollers
    (the MSP430G2231 and MSP430G2221)


    +   * MSP430 3xx Legacy 8MHz

    Legacy ROM and OTP devices, 2k to 32k bytes ROM

    2.5V to 5.5V operation

    14 or 40 GPIO pins

    LCD controller, ADC'
