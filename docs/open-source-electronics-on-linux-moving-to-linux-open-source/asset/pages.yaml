- pgno: 36
  md: '# 1.9.3 Installing a Printer


    # 1.9.2 Removable Media, CDs and Partitions


    USB memory sticks, CDs and DVDs


    After inserting a memory stick, CD or DVD into the PC, it will automatically be
    mounted in the file system and made available in the desktop environment. It will
    also be visible in the left pane of the Caja file manager.


    Safely removing memory sticks and ejecting CDs


    Memory sticks must be safely removed if data has been copied to or from these
    devices. To safely remove a memory stick, either right-click it on the desktop
    or in the file manager and choose Remove Drive from the pop menu. If you have
    copied a large amount of data to or the device, you may see a message asking you
    to wait while data writing completes. To eject a CD or DVD, click the icon in
    the file manager and then click E on the pop up menu.


    Finding the media device in the file system


    Occasionally, when you need to open a file from removable media within a certain
    program, the program may not display the removable device as an icon. You will
    need to search for it in the file system. Then you will find it in the /media
    directory (found in the root directory / the file system). For example, if you
    needed to copy a file from a memory stick to your website using FileZilla FTP
    program, the memory stick will not show up in FileZilla as it does in your desktop
    environment or in other programs. In this case you will need to find the memory
    stick in the media directory using FileZilla.


    # Partitions


    When you have extra partitions on your hard-drive such as additional installations
    of Linux or a Windows installation, they can be mounted into the file system which
    is handy if you need to copy files to or from them. These additional drives or
    partitions can be found in left pane of the file manager or by clicking Menu →
    Computer. To mount a partition, click it in the left pane and it will become available
    in the file system. To unmount the partition, right-click it in the left pane
    of the file manager and click Unmount in the pop-up menu. It will then be removed
    from the file system but can be easily mounted again if needed.


    Mounted partitions can also be found in the /media directory of the Linux file
    system in Mint and Ubuntu.


    # 1.9.3 Installing a Printer


    To install a printer that connects to the PC via USB, make sure that you are connected
    to the Internet and plug the printer into the PC’s USB port and switch it on.
    Linux Mint should search for a printer driver. If no printer driver is found then
    click the Search button (figure 1.11). Some time will be spent searching for a
    printer driver.'
  merge: -1
  img_proc: true
