- pgno: 178
  md: '# 5.4.4 DebugWIRE


    ![](img/3c46617540546e0091f48cc286948fbe_178_0.png)


    Figure 5.18: Opening the Source File in Nemiver


    # Switching back to ISP mode from debugWIRE mode


    To change back to ISP mode, the DWEN fuse must be set back to a value of 1. (Programming
    the fuse as we did earlier sets it to 0). Start a terminal window and enter the
    following:


    # Using the JTAGICE mkII


    ```

    sudo avrdude -c jtag2isp -P usb -p t2313

    and then ignoring error messages without switching the power off

    sudo avrdude -c jtag2isp -P usb -p t2313 -U hfuse:w:0xdf:m

    ```


    # Using the AVR Dragon


    ```

    sudo avrdude -c dragon_isp -P usb -p t2313

    and then ignoring error messages without switching the power off

    sudo avrdude -c dragon_isp -P usb -p t2313 -U hfuse:w:0xdf:m

    ```


    If you have any problems with the above commands responding, then in the terminal
    window press Ctrl + C to terminate the command. Next switch the power to the circuit
    off and unplug the Dragon or JTAGICE back to the USB port and switch the power
    to the circuit back on. Try the above commands again.


    177'
