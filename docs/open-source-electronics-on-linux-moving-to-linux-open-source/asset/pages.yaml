    # 1.8 Installing and Removing Applications


    There are a number of ways to install applications in Linux Mint. The primary
    way of installing applications is to use the Software Manager. You will need to
    be connected to the Internet to install software from the software manager. To
    demonstrate how easy it is to install applications, we will install first electronics
    application, the Eagle CAD tools, for creating schematics and PCBs.


    Eagle CAD is not open-source software, but it can be used in a restricted mode
    as freeware. I am suggesting that you install it because many open-source hardware
    projects make use of Eagle (e.g. Arduino), and you will be able to view the Eagle
    files that these projects provide. One of the issues that has been brought up
    in the open-source hardware community is that so many open-source projects have
    been created using the non-open-source Eagle CAD package. In this book, we will
    be using open-source CAD tools for creating all schematics and PCBs.


    # 1.8.1 Application Installation Example


    First start the Linux Mint Software Manager – click Menu > Software Manager


    In the Mint Software window, type eagle in the search box (top right of the window)
    and you should see Eagle appear in the panel below as shown in figure 1.9, double-click
    Eagle in the search results to find more information about this application.


    Click the Install button and enter your password when prompted, to start the installation.
    The application will be downloaded from the Internet and then installed. You can
    close the Software Manager after installation – you will know that the installation
    is finished when there are no more ongoing actions as shown at the bottom of the
    Software Manager window.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Chapter 1. Linux Basics


    Starting the installed application:

    Eagle can be found under Menu -> Programming -> Eagle (If you can''t find the
    Programming group, then click All applications at the top right of the menu to
    make the program groups visible on the menu). Alternatively, type eagle into the
    search box on the menu.


    When starting Eagle for the first time, the EAGLE License dialog box will pop
    up. Click the Run as Freeware button in this dialog box. In the Warning dialog
