- pgno: 150
  md: "# 5.2.1 AVR Programming Software and Test Hardware\n\n# AVR test program\n\n\
    Two test programs have been provided to use with the circuit of figure 5.2. The\
    \ hexadecimal files that will be used by avrdude to program the ATTINY2313 can\
    \ be found with the accompanying files. They are called blink.hex and blink2.hex\
    \ and can be found in:\n\nCH05/AVR_progs/blink/\n\nCH05/AVR_progs/blink2/\n\n\
    These programs flash the LED of figure 5.2 on and off at the same rate, blink\
    \ with a 50% duty cycle (LED is on for the same amount of time it is off) and\
    \ blink2 with a 80% duty cycle (LED is on for 80% of the time and off for 20%\
    \ of the time). Two programs have been created so that if one program is already\
    \ loaded on the AVR and a programmer is to be tested, then the other program can\
    \ be loaded so that it can be seen that a different program has been loaded to\
    \ verify that the programmer is working.\n\nThe source code of the blink program\
    \ is shown below:\n\n```\n#define F_CPU 8000000UL\n#include <avr/io.h>\n#include\
    \ <util/delay.h>\n\nint main(void)\n{\n    DDRB |= 1 << PB0;               /*\
    \ set PB0 to output */\n    while (1) {\n        PORTB &= ~(PB0);            \
    \   /* LED on */\n        delay_ms(100);\n        PORTB |= 1 << PB0;         \
    \     /* LED off */\n        delay_ms(100);\n    }\n    return 0;\n}\n```\n\n\
    The hexadecimal output file from this program and from blink2 are available with\
    \ the accompanying files, but if you want to compile this program and generate\
    \ the hex file yourself, copy the source file to a folder of your choice and start\
    \ a terminal window and change to the folder containing the file to compile. Now\
    \ enter the following to compile the file:\navr-gcc -g -Os -Wall -mcall-prologues\
    \ -mmcu=attiny2313 blink.c -o blink.obj"
