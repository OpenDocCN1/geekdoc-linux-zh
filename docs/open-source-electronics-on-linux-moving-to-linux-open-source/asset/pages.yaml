    A parametric table for tinyAVRs in LibreOffice format can be found with the accompanying
    files: CH05/tinyAVR_Parametric_Table-1.ods


    # 5.1.2 megaAVR Microcontrollers


    megaAVR microcontrollers generally have more Flash, SRAM, I/O pins and peripherals
    than tinyAVRs. Most microcontrollers in this group have at least one USART and
    most of them will have either debugWIRE or JTAG for debugging.


    Within the megaAVR microcontroller group, there are:


    +   * **AT90CAN** microcontrollers containing CAN interfaces and available in
    surface-mount packages only.


    +   * **AT90PWM** microcontrollers that have been specifically designed for lamp
    ballast and motor control applications. They are available in surface-mount packages.


    +   * **AT90USB** microcontrollers that contain a USB device port and are available
    in surface-mount packages only.


    +   * **ATmega** microcontrollers with a number of these devices available in
    DIP and surface-mount packages.'
