  md: '# 4.6 Building Your Shield


    assigned footprints in CVpcb will be imported into PCBnew. The PCBnew file already
    has the Arduino shield outline with the header connectors in the correct position.
    You will then be able to lay out your Arduino shield board.


    If you do not have the wire-wrap headers talked about in the previous section
    and you want to make a single-sided PCB shield using standard pin headers, you
    will have to design the board on the top copper layer only. In this case, any
    through-hole components will be upside-down when the shield is inserted into the
    Arduino. Again you will have to make sure the components have enough clearance
    and do not clash with the components on the Arduino, especially the USB and ICSP
    headers. Arduino mount holes are 3.2mm diameter holes and are also in place on
    the PCB shield template files.


    # LED wheel example shield and program


    Find the KiCad files for the LED shield with the accompanying files in: CH04/KiCad/Arduino_LED_wheel/
    This project was built from the Arduino shield template files. The shield contains
    12 LEDs arranged in a circle interfaced to Arduino pins 2 to 13 and two push-button
    switches to analog input A4 and A5. This example was made on a single-sided PCB
    using surface LEDs and resistors and through-hole push-button switches. See figure
    4.15 for a photo of the board. The photo shows the through-hole switches mounted
    on the copper (top) side of the board and soldered over the top, as there is no
    copper underneath to solder the shield leads.


    Figure 4.15 also shows that the shield touches the USB and external power connectors
    of the Arduino board when standard pin headers are used on the board. This is
    not a problem on this board as no copper or components are underneath the board
    and no through-hole components are soldered above these connectors. The top of
    the ICSP headers are 3mm below the board. If this board was to be made using the
    wire-wrap headers, it would have more clearance between the Arduino and components,
    but if it were to be a single-sided board, with wire-wrap headers, the board would
    need to be redesigned using through-hole components so that the copper is underneath
    the board. This is because the wire-wrap connectors need to be soldered to the
    shield underneath the board. Another option if more clearance is needed between
    the Arduino and shield is to use pin headers with longer pins.


    To build this board you will need to use 1206 footprint surface mount resistors
    and LEDs.


    A test program for this shield can be found in: CH04/sketchbook/LED_wheel_test.this
    This program will switch each LED on in turn with one second delay between each
    LED switching. It will switch each LED off. One of the buttons will change the
    delay between switching to 200ms and the other to 50ms. The switch must be held
    until the LEDs switching speed changes as the switches are only read between calls
    to the delay function.'
