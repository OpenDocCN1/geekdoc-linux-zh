- pgno: 124
  md: '# 4.4.3 LCD Displays


    With Arduino, it is quick and easy to interface a character LCD display e.g. a
    2 line by 16 character display. LCD displays based on the Hitachi HD44780 controller
    and driver IC are very common and available from several manufacturers. Solder
    wires to the LCD display for easy connection to the Arduino board and bread-board.


    The HelloWorld program uses the Arduino board to write some text to an LCD display
    – “hello, world!” is displayed on the first line of the LCD and an incrementing
    count value is displayed on the second line. The display is wired in 4-bit mode
    (4 of the data lines of the LCD are used instead of all 8). The circuit diagram
    on the website shows an LCD display that has connections above the display. See
    figure 4.9 for pinning of a display with connections below the display. It is
    possible that some displays may not have the backlight connections, in this case,
    pin 1 may be VSS, pin 2 VDD, as shown in the figure. Rather check the datasheet
    for your display that destroy it by making wrong connections.


    HelloWorld:


    In the Arduino IDE - File -> Examples -> LiquidCrystal -> HelloWorld

    Web page - arduino.co/en/Tutorial/LiquidCrystal


    Wire up the LCD as shown on the web page. You will also need a 10k potentiometer
    to set the LCD contrast. A pre-set pot may be used and wired to the LCD via a
    breadboard.


    With the HelloWorld program working, all of the other example programs in the
    Arduino IDE under File -> Examples -> LiquidCrystal will also work.


    # LCD backlighting


    Some LCD displays have a backlight which makes them easier to read in bad lighting
    conditions. Connect the cathode of the backlight to GND and the anode to 5V through
    a 33 to 47 ohm resistor to switch the backlight on.


    The example programs for this book include an example of using PWM to control
    the brightness of the LCD display backlight. The Arduino program can be found
    in:

    CH04/sketch/Backlight/


    To control the brightness of the backlight of the LCD, connect a transistor to
    the Arduino board as shown in figure 4.10. When the program is running on the
    Arduino board, connect to it it using the serial monitor and send ‘h’ to decrease
    the LCD brightness and ‘l’ to increase the LCD brightness. You can also send,
    for example ‘hhhhhh’ to increase the brightness by a number of steps at once.
    Upper or lower-case letters can be sent.'
  merge: -1
  img_proc: true
