- pgno: 193
  md: 'Chapter 6. MSP430 16-bit Microcontrollers


    # 6.3.2 Programming the LauchPad


    We will now use the programming tools installed at the beginning of this chapter
    to program the LaunchPad board with the default MSP430G2231 in the DIP socket.
    Find the example program with the accompanying files: CH06/Launchpad/MSP430_blink/

    Program will flash the LaunchPad''s LED1 connected to pin P1.0 and on and off.


    Compile the example


    Start a terminal window and change to the directory containing the example program.
    To compile the program enter:

    msp430-gcc main.c -o main.elf


    Manually programming the board


    Plug the LaunchPad board into the PC using the supplied USB cable. In the terminal
    window in the directory containing the example program, enter the following:

    sudo mspdebug rf2500


    This will start the command line MSP430 debugger. In the debugger enter:

    prog main.elf

    and then:

    run


    This will program the Flash of the microcontroller and run the program. To stop
    the debugger, press Ctrl+ C. Type exit to exit the debugger.


    Enabling programming without the use of the sudo command


    In the previous example, we needed to type "sudo" before running mspdebug. By
    adding a udev rule for the LaunchPad we will not have to use the sudo command
    in the future. The file containing the rule is launchpad.rules and can be found
    with the accompanying files in CH06/Launchpad/

    To add a udev rule:


    +   * Alt+F2 to start the run dialog box.

    * In the run dialog box, start the file manager as root by entering gsudo caja

    * In the file manager, click File System in the left pane and then navigate to
    /etc/udev/rules.d/

    * Navigate to the launchpad.rules file in another file manager window.

    * Drop and drop launchpad.rules to the file manger started as root and /etc/udev/rules/


    192'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# 6.3.3 LaunchPad BoosterPacks


    +   * Start a terminal and enter: `sudo restart udev`


    Try manually programming the board again, but this time without the “sudo” command
    when starting mspdebug. If you experience any troubles starting mspdebug without
    the sudo command, when rebooting the PC.


    Automatically programming the LaunchPad


    We will use a program to change the LaunchPad automatically without having to
    type commands in MSPDebug. A program that reads the switch state on pin P1.3 and
    writes the switch state to LED1 on P1.0 can be found with the accompanying files
    in: CH06/Launchpad/MSP430_IO/


    Start a terminal window and change to the directory containing the example program.
    To compile the program, enter: `msp430-gcc main.c -o main.elf`


    To program the LaunchPad without entering the MSPDebug program, enter the following
    on the command line: sudo mspdebug rf2500 “prog main.elf” (leave the “sudo” part
    off if you have added the udev rule to allow this)


    After programming the board, pressing S2 (P1.3) will switch LED1 (P1.0) on. Releasing
    the switch will switch the LED off.


    For your convenience, a file containing the above line called `prog` is included
    in the example program folder. Make this file executable and then double-click
    to run it. Choose the **Run in Terminal** button in the dialog box that pops up.
    For this work you must have added the udev rule described earlier. Alternatively
    in a terminal window and when changed to the directory containing the project,
    `./prog` to program the LaunchPad.


    # 6.3.3 LaunchPad BoosterPacks


    Plug ins for the Arduino are known as shields. Plug in board for the LaunchPad
    are known as BoosterPacks, search the Internet for Boosterpacks to see what add-ons
    are available for plugging into your LaunchPad board.


    A KiCad template for making your own BoosterPacks is included with the accompanying
    files in CH06/Launchpad/KiCad/BoosterPack_Template


    Use the KiCad template to make a BoosterPack in the same way that an Arduino shield
    is made from template files in section 4.6.2 of this book.'
