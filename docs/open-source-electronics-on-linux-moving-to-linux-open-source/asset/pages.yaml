- pgno: 104
  md: '# 3.4.2 Installing KiCad Libraries


    Once downloaded, the KiCad libraries can be copied to your local library folder
    as already discussed, or installed in the file system.


    Example – installing libraries for the TLV320AIC23b audio CODEC IC from Texas
    Instruments. You need to download the compressed library files, extract them and
    then copy them into the Linux file system. To copy the files, first navigate to
    the extracted files using the file manager. Start a new file manager with root
    privileges and navigate to the KiCad library folders in the file system. Now copy
    the files from the first manager to the second by dragging and dropping. Here
    are the steps:


    +   - Download the tlv320aic23b.tar.gz file from library.oshec.org. To find the
    link to the package in Firefox on this web page, press Ctrl+F and find tlv320
    in the search box.

    - Double click the downloaded file to open it in the archive manager. In the archive
    manager, double click the folder icon marked with a dot and then double click
    the lbr folder. Open the file manager and navigate to a suitable location for
    extracting the files. Drag and drop the two files from the lbr folder in the archive
    manager to the chosen folder in the file manager.

    - Start a second file manager as root – press Alt+F2 and in the box that pops
    up gksudo caja. Enter your password when prompted.

    - In the file manager that you started as root, navigate to /usr/share/kcad/ and
    then drag and drop tlv320aic23b.lib from the other file manager into the library
    folder. Drag and drop tlv320aic23b.mod from the other file manager into the file
    manager started as root into the modules folder.

    - Close the file manager windows when done.


    To use the new library in a KiCad project, you will need to open the .lib library
    file when using EESchema from the main menu with Preferences -> Library as done
    previously after the component creation tutorial. This time you will be able to
    find the new library immediately after clicking the Add button as the dialog box
    will open in the default file that you copied the library file.


    In CVeb, you will need to add the tlv320aic23b.mod file using Preferences -> Options.
    The new module will then be available in PCBnew when importing the netlist for
    the project.


    The advantage of adding the library files to the file system is that if you copy
    the project to a different computer, you will only need to add the library files
    to the new computer’s file system in order for the project to find them. There
    will be no problem with user names as is the case when working with a library
    from your home folder.'
  merge: -1
  img_proc: true
