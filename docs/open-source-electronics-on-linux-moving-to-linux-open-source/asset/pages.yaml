- pgno: 195
  md: '# 6.4 eZ430-Chronos


    eZ430-Chronos is a development kit from Texas Instruments that consists of a digital
    wristwatch, an RF module for communicating between the watch and a PC, and a module
    for programming the watch.


    The RF module can be used to set the correct time on the watch, get back information
    from the watch such as temperature and accelerometer information, and to program
    the watch – but only if the correct software is running on the watch. The programming
    module can be used to program the watch, regardless of what software is on the
    watch. To use the programming module, the watch must be opened and the watch module
    removed and plugged into the programming module.


    The user''s guide for the eZ430-Chronos is the document SLAU292c.pdf and can be
    found on the disk that accompanies the kit, on the TI website or on your PC when
    the demo software is installed (an older version may be found on the disk, e.g.
    SLAU292b.pdf). It contains information on how to use the watch and associated
    software applications, as well as schematic diagrams for the watch and accompanying
    modules.


    A good resource for further information on the eZ430-Chronos can be found at:
    processors.wiki.ti.com/index.php/eZ430-Chronos


    The disk that accompanies the kit also contains information, including a video
    on how to disassemble the watch for programming.


    Before starting, note that the watch is available in three different RF frequencies:


    +   - eZ430-Chronos-433 – 433 MHz. This frequency is acceptable worldwide.

    - eZ430-Chronos-868 – 868MHz. Acceptable in Europe and India.

    - eZ430-Chronos-915 – 915MHz. Acceptable in North and South America.


    When programming the watch, be sure to use a program that sets the correct frequency
    for the watch that is to be loaded to.


    # 6.4.1 Running the Chronos demo software


    TI provide demonstration software for both Windows and Linux. A copy of the demo
    software is available on the disk that comes with the Chronos kit, but it may
    be an older version. Download the software from www.ti.com/lit/zip/slac388 – entering
    this link in a browser should start the download of the file sla388a.zip. It may
    also be a good idea to check if an even newer version of software is available
    at these web addresses:


    focus.ti.com/docs/toolsw/print/ez430-chronos.html

    processors.wiki.ti.com/index.php/EZ430-Chronos'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# 6.4.1 Running the Chronos demo software


    After downloading slac388a.zip, unzip and extract the file Chronos-Setup. Right-click
    the extracted file and click the Properties item in the menu that pops up. Click
    the Permissions tab in the dialog box that pops up and check the "Allow executing
    file as a program" checkbox. Click the Close button when done. Or, do this in
    a terminal window - change to the directory containing the file and enter:


    ```

    chmod +x Chronos-Setup

    ```


    Start a terminal window and change to the directory containing the Chronos-Setup
    file. Enter:

    sudo ./Chronos-Setup


    This will start the Chronos software installation program that will take you through
    a series of dialog boxes before installing -you will need to agree to the license
    and select the location where the software will be installed, the default is fine.
    The default folder is /usr/local/eZA430-Chronos Setup.


    Before the installed software can be run, you will need to install TCL/Tk. Start
    a terminal window and enter the following:

    sudo apt-get install tcl8.5 tk8.5 xtool


    To run the demo software, plug the RF module that came with the kit into the USB
    port of the PC. Run eZA430-Chronos CC 1_2.tcl found in /usr/local/eZA430-Chronos
    Setup/Control Center/Chronos Control Center by double-clicking it and then clicking
    the Run button in the dialog box that pops up.


    If the application doesn''t connect to the RF module, the problem could be that
    the incorrect port name is used in the code. This may be because another device
    is plugged into a USB port on the PC. To change the port, open the eZA430-Chronos
    CC 1_2.tcl in a text editor and modify the line (you will need to start the text
    editor as super user to save the changes - e. sudo pluma from a terminal window
    or start the file manager as root):


    ```

    # Set com where RF access point is mounted

    set com "dev/ttyACM0"

    ```


    To demonstrate the accelerometer in, the Chronos Control Center application, click
    the Start Access point. Press the # on the watch until it shows ACC, and press
    the button marked with the down-arrow on the watch. The RF link should now be
    established and data from the accelerometer in the watch will be displayed in
    the application running on the PC - shake the watch to see the accelerometer graphs
    changing on the PC. Pressing the down-arrow on the watch again will terminate
    the RF connection.


    In the demo software installation folder (/usr/local/eZA430-Chronos Setup) you
    will also find the user manual and schematics in the Documentation sub-folder
    and watch firmware in the Recovery folder. The Software Projects folder contain
    source code for the firmware saved as projects for the commercial Windows development
    tools.'
  merge: -1
  img_proc: true
