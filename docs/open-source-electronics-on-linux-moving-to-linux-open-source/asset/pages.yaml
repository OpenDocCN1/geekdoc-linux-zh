- pgno: 152
  md: '# 5.2.3 Serial Port AVR Programmer


    Solder a wire from the cable to each of the pins 7 to 10 of the connector. A single
    wire can be used for ground from pin 25, it is not necessary to use all the ground
    wires from 18 to 25, although you can join these on the 25-pin D connector. On
    the other end of the cable, connect each wire to the breadboard and add the resistors
    as shown in the figure. Wires can now be connected from the resistors to the corresponding
