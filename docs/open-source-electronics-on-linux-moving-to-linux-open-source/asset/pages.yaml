  md: '# 4.5 Using the Ethernet Shield


    The Arduino Ethernet Shield (**figure 4.11**) enables the Arduino board to be
    connected to an Ethernet network. It also contains a microSD card socket. A number
    of third-party manufacturers also make Arduino Ethernet shields. This section
    will discuss the “official” Arduino Ethernet shield (cc/en/Main/ArduinoEthernetShield)
    as interfaced to an Arduino Uno board – the Ethernet shield does also fit other
    Arduino boards besides the Uno.


    ![](img/3c46617540546e0091f48cc286948fbe_127_0.png)


    The hardware required for this section is:


    +   - An Arduino board, e.g. the Arduino Uno.

    - The Arduino Ethernet shield, e.g. Arduino Ethernet Shield 5 or 6.

    - USB cable for programming and powering the Arduino and shield.

    - An Ethernet cable, wired straight for connection through a hub/switch/router.

    - Various components as mentioned in the text (LEDs, resistors, etc.)'
