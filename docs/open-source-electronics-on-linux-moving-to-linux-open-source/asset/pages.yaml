- pgno: 212
  md: '# 8.3 Building the Circuit


    The whole circuit can initially be built and tested on breadboard before making
    a permanent circuit on PCB.


    This circuit is used as the example circuit in appendix A on making home-made
    PCBs, so refer to this appendix for additional photographs of the board during
    manufacture.


    Watch the thin tracks that pass between pins when etching the board, leaving the
    board in the ferric chloride too long may dissolve these tracks.


    When drilling the board, don''t forget to drill the hole in the middle of the
    pre-set potentiometer RV1. This hole allows a screwdriver to be inserted into
    the pot, from the back of the board to allow adjustment of the LCD contrast.


    Solder the lowest components to the board first, i.e. the resistors and zener
    diodes then the low-profile crystal. Use a IC socket for ICI1, the ATMMEGA8 microcontroller.
    Switches SW1 and SW2 aren''t essential, so can be left off and added later if
    needed.


    Solder a 1 by 16 pin header to the LCD display so that it can be plugged into
    the connector P2 of the board, shown in figure 8.3. Use plastic PCB standoffs
    to mount the LCD to the board and provide support for it.


    ![](img/3c46617540546e0091f48cc286948fbe_212_0.png)


    Figure 8.3: Assembled PCB and Header to be Soldered to LCD'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# Chapter 8. Linux on LCD Interface


    Loading the firmware


    IC1, the ATMEGA8 can be programmed via the header P1 using one of the AVR programmers
    from chapter 5. Be sure to connect the programmer to the header right way around
    – pin 1 of the header is marked on the silkscreen. If you do not have the P1 header
    in stock, then the ATMEGA8 can be plugged into a breadboard, externally powered
    with 5V and programmed by connecting it to the programmer using single core.


    The name of the firmware file to load to the ATMEGA8 is firmware.hex and can be
    found with the accompanying files in: CH08/lcd2usb/firmware


    Example using USBtiny5P from chapter 5


    First start a terminal window and change to the directory containing the firmware.hex
    file. Use the following command from the terminal window to program the firmware
    to the ATMEGA8: sudo arduino -c ustiny -p atmega8 -U lfuse:w:0x9f:m -U hfuse:w:0xc9:m
    -U flash:w:firmware.hex


    # 8.4 Testing


    With the circuit built and the firmware loaded to the microcontroller, it is ready
    for testing. First plug the circuit into a spare USB port on the PC. The LCD should
    display a message e.g. **LCD2USB V1.09**. Use a screwdriver to adjust the pre-set
    potentiometer (LCD contrast) from the back of the board through the hole drilled
    under it until you can see the message on the LCD.


    If the board is powering up correctly, check that it has been recognised by Linux
    by starting a terminal window and entering:


    ```

    dmesg | tail

    ```


    A message should be displaying saying that new low USB device was detected.


    Inside the lcd2usb-2010-12-14.zip file downloaded from the LCD2USB web page or
    found with the accompanying files in CH08/lcd2usb/testapp is a test file that
    can be used to test communications between the PC and the LCD. Install libusb-dev
    from the Mint Software Manager – the software will not build successfully without
    libusb-dev installed. Start a terminal window and change to the lcd2usb/testapp
    directory. In this directory enter `make` to compile the test program and produce
    the lcd2usb executable file (be sure to use the lcd2usb file on Linux and not
    the lcd2usb.exe file). With the LCD circuit plugged into the PC, enter the following
    in the command window:


    ```

    /lcd2usb

    ```'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'It is possible that the text scrolling on the screen may not be easy to read
    – this may occur because

    your LCD display is too slow. As long as you can see something moving on the display
    and then the

    ''Bye bye!'' message, your circuit is working fine.


    # 8.5 Using the LCD with lcd4linux


    One program (there are others) that runs on the PC and sends information for display
    on the

    LCD2USB is called lcd4linux. Use the Mint Software Manager to install lcd4linux
    now.

    The website for lcd4linux is at lcd4linux.bulix.org.


    lcd4linux uses a configuration file called lcd4linux.conf that must be placed
    in the /etc directory.

    file is used to configure lcd4linux to use the LCD2USB board and tell lcd4linux
    what information

    to display on the LCD. Copy the pre-configured lcd4linux.conf from the accompanying
    files

    to /etc directory as described next.


    You will need to start the file manager as root to be able to copy lcd4linux.conf
    to the /etc folder and

    to modify it if it is copied. Press Alt+F2 to start the Run dialog box. Type

    gksudo caja into the dialog box and press Enter. Enter your login password when
    prompted to

    do so. The file manager will now be running as root, so be careful as anything
    in the file system

    can be modified. Click "File System" in the left pane of the file manager and
    double-click

    ent the main. Now open another file manager and navigate to CH08/ in the accompanying

    files. Drag lcd4linux.conf from the accompanying files into etc, hold down the
    Ctrl key before

    dropping this file into etc in the file manager that started as root.


    Permissions may be changed by editing the file. Right-click the lcd4linux.conf
    file in the

    manager that you started as root and then click Properties on the menu that pops
    up. In the dialog

    box that pops up, click the Permissions tab. Change the Access: for Group and
    Others to None

    using the drop-down boxes under these two names – they may already have the correct
    settings in

    which case you can close the dialog box. The lcd4linux software will not work
    if permissions for

    both Group and Others are not set to None. Close the dialog box and the file manager.'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# Testing lcd4linux


    Plug the LCD2USB board into the PC''s USB port. Start a terminal window and enter:

    sudo lcd4linux -F


    A message should be displayed on the LCD and shortly afterwards the information
    shown on the LCD in figure 8.1. To stop the lcd4linux program on the PC, press
    Ctrl + C in the terminal window. Starting lcd4linux without the -F switch will
    allow you to close the terminal window without stopping lcd4linux. To stop lcd4linux
    after it has been started without the -F switch, you will need to unplug the LCD2USB
    board from the PC.


    Lcd4linux will automatically start when the system starts, provided the LCD2USB
    circuit is plugged into the USB port when you switch the computer. To test this,
    leave the LCD2USB circuit plugged into the PC. Now switch the PC off and then
    again. The system information should be automatically displayed on the LCD after
    powering the PC on.


    # How the lcd4linux.conf file works


    The lcd4linux.conf file contains two structures at the top of the file:


    ```

    Variables {

    tick 500

    tack 100

    minute 60000

    }

    ```


    ```

    Display LCD2USB {

    Driver ''LCD2USB''

    # Size ''20x2''

    Size ''20x4''

    Backlight 1

    Icons 1

    }

    ```


    The first structure contains some timing variables that will be used by other
    structures in the file. The second structure configures the LCD. Size in this
    structure configures the number of characters and lines the LCD has. In this structure
