- pgno: 87
  md: '# Chapter 2. Creating Schematics and PCBs with KiCad


    # # 2.6 Laying Out Double Sided PCBs


    Once you have mastered laying single-sided boards, it is not difficult to lay
    out a double sided board The only difference is that tracks will now be placed
    on the top layer as well as the bottom layer of the board and vias will be used
    to connect the top and bottom tracks where needed. Generally you should try to
    keep components on the top layer only to make assembly of the board easier, but
    if needed, components can be placed on the bottom layer of the board as well.


    # ### Placing a track on the top layer


    First select the top layer (called **Front**) in the **Visible** panes. The top
    layer is red by default. Click to the left of this layer in the right pane to
    select – when, the blue arrow will point to it. Now the **Add tracks and vias
    icon** on the right toolbar (or use the **X** hotkey) and routing the board –
    will now take place on the top layer.


    # ### Placing vias


    During routing of a track, press the **V** key to place a via. This will place
    a via and change to the opposite layer, e.g. if you are busy routing a track on
    the top layer and you press the V key, a via will be placed and routing will continue
    on the bottom layer. Via sizes can be set up in the same dialog box that track
    widths are set up – on the top menu click **Design Rules** → **Design Rules**
    and Add new sizes under **Custom Via Sizes**. Select the size to place from the
    Via drop down box under the top toolbar in the PCBnew window (next to the Track
    drop down box).


    # ### Switching between layers


    You can use the right **Visible** pane to switch between layers or press the **Page
    Up** keyboard key to switch to the top layer and the **Page Down** key to switch
    to bottom layer. If you press the **Page Up** or **Page Down** key to change to
    a different layer while routing a track, a via will be placed.


    # ### Placing components on the bottom layer


    To place a component on the bottom layer, hover the mouse cursor over the component
    and press the **M** key to move it and then the **F** key to flip it onto the
    other side of the board press the **F** key again to flip it back to the top side
    or click to place.


    To see a double-sided PCB designed in KiCad and professionally manufactured, go
    to: startingelectronics.com/articles/using-KiCad-for-professional-PCBs'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# 2.7 Other Tips and Techniques


    Once a KiCad project has been created and finished, it is possible to modify the
    schematic and then generate a new netlist. If parts were added, footprints can
    be assigned to them using CVpcb. After saving the netlist in CVpc, the netlist
    can be imported into PCBnew again and then the changes will be seen in PCBnew.
    If new parts were added they will now appear in PCBnew. If changes were made to
    tracks, the old ones can be deleted and new ones added. To delete a footprint,
    first delete the footprint in PCBnew, then delete the component in EESchema along
    with the wiring. Next, generate a new netlist in EESchema and import it into PCBnew.


    Throughout this book, tips on using KiCad have been included wherever a new technique
    is used on a project that has been created in KiCad. In the next chapter, we look
    at how to create a schematic symbol and PCB footprint and include them in a KiCad
    library.'
  merge: -1
  img_proc: true
