    if you

    hot already done so. The file contains the modifications for both of these microcontrollers,
    so if you

    already copied it for the ATiny48, then there is no need to copy it again.


    # 5.4 AVR DebugWIRE/JTAG Tools


    To implement single step debugging, the AVR Dragon or the AVR JTAGICE mkII can
    be used.

    These devices can be plugged into either the 6-pin ISP header that we have been
    using to program

    the AVRs and debug using debugWIRE, or, if the AVR has JTAG, through the JTAG
    connector.


    # 5.4.1 The AVR Dragon


    The 6-pin ISP header on the AVR Dragon used for in-system programming also functions
    as a

    debugWIRE interface. A separate 10-pin (2 × 5) header marked "JTAG" is used to
    interface to AVR

    microcontrollers that have a JTAG interface. If JTAG debugging is required, you
    will need to make

    u a ribbon cable with two female IDC 2 × 5 connectors for interfacing the Dragon
    to the target

    AVR microcontroller.


    The AVR Dragon supports 8-bit and 32-bit AVR devices, up to 3 hardware and 32
    software

    breakpoints, 1.8V to 5.5V targets and is firmware upgradeable to support future
    AVR devices.


    173'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# Chapter 5. AVR 8-bit Microcontrollers


    # 5.4.2 The AVR JTAGICE mkII


    The AVR JTAGICE mkII (figure 5.17) is a full featured JTAG ICE that comes with
    various adapters for connecting it to target AVR boards via ISP, debugWIRE and
    JTAG. The AVR JTAGICE is more expensive than the AVR Dragon, but has additional
    features and comes with cabling (USB, RS-232 and external power) and adapters
    (shown in the figure).


    ![](img/3c46617540546e0091f48cc286948fbe_175_0.png)


    Figure 5.17: The AVR JTAGICE mkII


    The AVR JTAGICE supports 8-bit and 32-bit AVR devices, up to 3 hardware and 128
    software breakpoints and supports 1.8V to 5.5V targets. Additionally it supports
    symbolic debugging of complex data types including scope information, has both
    USB and RS-232 interfaces and can be externally or USB powered. It also uploads
    code faster and has more SRAM than the Dragon.


    The ordering code for the AVR JTAGICE mkII is: ATJTAGICE2 and can be used when
    searching for prices on the Internet.'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# 5.4.4 DebugWIRE


    # 5.4.3 Debugging Software


    The software needed for debugging consists of the following programs:

    avalice - connects the debugging hardware to the GNU debugger (gdb)

    avr-gdb - the GNU debugger for AVRs.

    nemiver - Nemiver, a debugger GUI for gdb.


    To install the software, start the Linux Mint Software Manager and search for
    install avarice and nemiver. When avarice is installed, avr-gdb will automatically
    be installed as well.


    To debug, either the AVR Dragon or the JTAGICE mkII must be connected to the target
    circuit. Next, avarice must be started, and then Nemiver which connects to avarice
    through avr-gdb. The steps required to set up debugging through either the debugWIRE
    and JTAG interfaces are described below.


    # 5.4.4 DebugWIRE


    Use the circuit of figure 5.11 and the program included with the accompanying
    files found in CH05/avr_progs/dbg_attiny2313/ for debugWIRE debugging.


    Before using debugWIRE, the DWEN fuse on the target AVR must be programmed. This
    is done through the ISP interface and disables the ISP interface once programmed.
    To enable the ISP interface again (disable debugWIRE), the debugWIRE interface
    or high voltage programming must be used.


    Connect the JTAGICE mkII or AVR Dragon to the ISP header as shown in figure 5.11
    and plug it into a spare USB port in the PC. Switch the power to the circuit on.


    Enable the debugWIRE interface


    This only has to be done once and can be disabled again after debugging has been
    completed, so the fuse that we program here can be left programmed during development/debugging.
    Start a terminal window and enter:


    # Using the JTAGICE mkII


    ```

    sudo avrdude -c jtag2isp -P usb -p t2313 -U hfuse:w:0x5f:m

    ```


    # Using the AVR Dragon


    ```

    sudo avrdude -c dragon_isp -P usb -p t2313 -U hfuse:w:0x5f:m

    ```


    175'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# Chapter 5. AVR 8-bit Microcontrollers


    Cycle the power to the AVR before continuing (switch the power off then on again).


    # Compile the program


    Start a terminal window and change to the directory containing the example program
    to compile.

    Enter the following to compile the program:


    ```

    avr-gcc -g -00 --Wall -mcall-prologues --mmcu=attiny2313 blink.c -o

    link.out

    ```


    # Start avrice


    Start a terminal window, change to the directory containing the program to debug
    and enter:

    Using the JTAGICE mkII

    avrice --erase --program --file erase.out --part attiny2313 --jtag

    usb :4242 --debugwire


    # Using the AVR Dragon


    avr-erase --program --file blink.out --part attiny2313 --dragon

    --jtag usb :4242 --debugwire


    This will cause the AVR with the program to debug and then wait for a connection

    from avr-gdb. After running this line, the last two lines that avrice displays
    should be:

    Download complete.

    Waiting for connection on port 4242.


    # Start the Nemiver


    Start a new terminal window, change to the directory containing the program to
    debug and start

    Nemiver by entering the following:

    nemiver --gdb-binary=/usr/bin/avr-gdb --remote=localhost:4242

    blink.out

    When Nemiver starts, close the two dialog boxes that pop up.


    # Load the C source file


    In Nemiver, click File -> Open Source File ... In the Open Source Files dialog
    box, find and select

    tblink.c source file as shown in figure 5.18. Click the OK button in the dialog
    box.


    Now go to section 5.4.6 to debug the program and read the section below to change
    the AVR

    from debugWIRE mode back to ISP mode when finished debugging.'
