  md: '# 5.2.4 USB AVR Programmer


    If you have access to a AVRISmkII:

    sudo avrdude -p t2313 -c avrispmkII -P usb -e -U flash:w:main.hex


    The fuses on the ATiny2313 need to be programmed so it runs from the external
    crystal and not the internal R/C oscillator, so enter the following in the terminal
    window:


    Parallel port programmer:

    sudo avrdude -p t2313 -c bsd -P /dev/parport0 -U hfuse:w:0xdf:m -U lfuse:w:0xef:m


    Serial port programmer:

    sudo avrdude -p t2313 -c ponyser -P /dev/ttyS0 -U hfuse:w:0xdf:m -U lfuse:w:0xef:m


    If you have access to a AVRISmkII:

    sudo avrdude -p t2313 -c avrispmkII -P usb -U hfuse:w:0xdf:m - lfuse:w:0xef:m


    You can now unplug the ATiny2313 from the breadboard and plug it into the 20-pin
    socket on the USBtinyISP board.


    # Testing the USBtinyISP


    Set up the test circuit of figure 5.2 and connect the USBtinyISP to it - you will
    need a spare ATiny2313 to build this circuit again. Use an external power supply
    to power the test circuit, make sure that JP1 pins 1 and 2 are connected with
    a jumper.


    The first test that we will do is to see if the USBtinyISP is recognised as a
    USB device on the PC. Plug the USBtinyISP into the PC''s USB port. It is necessary
    to power the USBtinyISP from the target circuit if JP1 pins 1 and 2. When the
    USBtinyISP is powered and connected to the USB port, the USB LED should light
    up. Start a terminal window and enter:


    ```

    dmesg | tail

    ```


    The message that is displayed should report that a new low speed device has been
    found.


    To see the device''s vendor ID and product ID (VID and PID), enter the following
    in a terminal window:

    lsusb'
