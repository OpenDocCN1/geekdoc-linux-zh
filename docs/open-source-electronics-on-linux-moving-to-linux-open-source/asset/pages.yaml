  md: '# Chapter 3. Creating KiCad Library Parts


    +   - In the dialog box that pops up, set the user grid up as shown in figure
    3.10.

    - Right-click on the main window and on the menu that pops up, select Grid Select
    → User Grid.

    - Move the mouse cursor one grid position to the right and click to place the
    second pad. Your new module should now look like figure 3.11, left.


    ![](img/3c46617540546e0091f48cc286948fbe_99_0.png)


    Figure 3.10: Setting up the User Grid


    # Tut 4-4 Drawing the component body


    +   - The body of the crystal extends from the centre of the left pin to the left
    and from the centre of the right pin to the right. This amount that it extends
    to either side is calculated by subtracting the distance between the pin centres
    (4.88mm) from the body length (11.18mm) and dividing the result by two. The result
    is 3.15mm.

    - The width of the crystal body is 4.65mm. We therefore need to make an arc on
    the outside of each pad that is 3.15mm from the centre of each pad and 4.65mm
    from top to bottom. Divide 4.65 by two to get the distance from the centre of
    each pad to the top and bottom of the component body. The result is 2.325mm. We
    therefore need to make an arc on each side of the crystal that is 4.65mm × 4.65mm
    and 3.15mm to the left or right right pad.

    - Start by setting up the user grid again with an X size of 3.15mm and a Y size
    of 2.325mm (Edit Dimensions → User Grid Size) and make sure that the user grid
    is currently selected.

    - Click the “Set the origin point for the grid” icon on the right toolbar (figure
    3.9, ⒌).'
  merge: -1
