    If a new library needs to be included manually in PCBnew, add it using Preferences
    → Library from the PCBnew main menu.


    # 3.4 Downloading and Installing KiCad Libraries


    When the default KiCad libraries do not contain a component that you need for
    your design and you do not want to design the component yourself, try searching
    one of the online sources for KiCad libraries to find the required component.


    # 3.4.1 Finding and Downloading KiCad Libraries


    Some websites that contain KiCad libraries are:

    www.kiadlib.org

    library.oshec.org


    The libraries may be available as compressed archives or as .lib files for schematic
    symbols and .mod files for modules (PCB footprints). Simply download the archive
    or files to your computer.'
