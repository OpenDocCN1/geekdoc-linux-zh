    # 1.8.3 Other Methods of Installing Applications


    There are methods to install software other than using the Software Manager. One
    of these methods is to use the command line or terminal window which will be discussed
    here.


    # Installing from the Command Line


    As an example, we will install the gResistor application that calculates the value
