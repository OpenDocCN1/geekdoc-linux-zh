  md: '# 5.2.4 USB AVR Programmer


    However, using ATiny2133 powered from 5V and a buffer chip and target circuit
    powered from low as 2V, with a logic high is received from the target circuit
    through the buffer chip, it will be 2V applied to an ATtiny2133 powered by 5V.
    According to the ATtiny2133 datasheet, when the ATtiny2133 is powered from 5V,
    it registers a high on input pin as 0.6 x Vcc. This will be 0.6 x 5V. So there
    is not much point modifying this circuit as described. To operate on a target
