  md: '# 4.6.1 Veroboard shield


    The browser should display some text, a web link and an image. Clicking the link
    should open a second web page that contains some text and a link back to the first
    web page. These are the two web pages on the SD card.


    Note that the SD library file system does not support long file names, they must
    be in the 8.3 format (8 characters for the file name and three for the file extension,
    e.g. index.htm and not index.html).


    # 4.6 Building Your Own Shield


    This section will look at making your own shield from Veroboard/stripboard as
    well as making your own PCB shield. An alternative to building your own shield
    is to use one of several prototyping shields for Arduino available to be purchased
    on-line, just search the Internet or browse your favourite Arduino supplier.


    # 4.6.1 Veroboard shield


    The spacing between the two 8-pin headers on the Arduino Uno board (P1 and P2
    in **figure 4.14**) prevents the header nearest the USB connector (P1 in the figure)
    being connected to a Veroboard/stripboard as it does not line up with the holes
    in the stripboard. This is the header marked 8 to 13, GND and AREF may have to
    be left off if using stripboard. The misalignment of this header has been done
    to prevent shields from being connected the wrong way around on the Arduino board.


    ![](img/3c46617540546e0091f48cc286948fbe_136_0.png)


    Figure 4.14: Arduino Header Spacing'
