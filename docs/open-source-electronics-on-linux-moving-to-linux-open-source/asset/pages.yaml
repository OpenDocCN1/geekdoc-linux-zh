    # Cutting the Paper to Size


    If printing to smaller card taped to plain paper, then remove the card from the
    plain paper.


    Use a sharp knife and steel ruler to cut an end and side close to the PCB outline
    on the photo paper as shown in figure A.6. If there is a lot of excess paper on
    the other edges of the PCB outline, then trim them, but not as close as the first
    two edges.'
