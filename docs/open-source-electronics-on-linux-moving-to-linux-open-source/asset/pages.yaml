- pgno: 182
  md: '# 5.4.7 Automating the Debugging Setup


    # 5.4.7 Automating the Debugging Setup


    Files for automating the debugging process can be found in dbg_ATmega16_blink
    and dbg_attiny2313.


    In dbg_ATmega16_blink:


    To build the project, run the build script that will produce blink.out from blink.c.


    An executable script named connect will start avarice and connect to the AVR Dragon
    – you will need to modify this file if you are using the AVR JTAGICE or if are
    debugging a program with a name other than blink.out or if you are using the dbgWIRE
    interface instead of the JTAG interface.


    An executable script named debug will start Nemver and connect to av-gdb. Modify
    this file if you are going to debug a program with a name other than blink.out.


    Make sure that the two scripts (connect and debug) are marked for executing. Double-click
    connect and choose Run in Terminal from the dialog box that pops up. Double-click
    debug and click Run in the dialog box that pops up. You can now start debugging.


    In dbg_attiny2313:


    The scripts in this folder have been set up to use the AVR Dragon in debugWIRE
    mode on an Attiny2313, so will need to be made executable if they are not. They
    have the following functions:


    +   - enter_dbw – enter debugWIRE

    - build – builds the blink program and produces the blink.out file

    - exit_dbw – exit debugWIRE mode

    - connect – program and connect to the AVR avarice

    - debug – start the debugger, open the blink program and connect to avarice


    Double click the script that you want to run and click the Run in Terminal button
    in the dialog box that pops up. If you want to see messages that the script may
    produce, then run it from the command line – e.g. ./build to see if there are
    any errors when compiling the source file.


    It is best to switch power to the circuit off and unplug the Dragon or JTAGICE
    from the USB port, then plug the Dragon or JTAGICE back in and power the circuit
    before running the enter_dbw and exit_dbw scripts.'
