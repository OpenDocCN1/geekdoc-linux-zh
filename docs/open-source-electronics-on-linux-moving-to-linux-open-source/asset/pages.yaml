- pgno: 208
  md: '# Chapter 8. Linux to LCD Interface


    This project displays various Linux parameters sent from the PC to a character
    LCD display via the USB port. The project is a slightly modified version of the
    LCD2USB open source project from harbaum.org/till/lcd2usb. It has been modified
    so that it can be built on a home-made single sided PCB as shown in figure 8.1,
    but can also be built on breadboard.


    Various information can be displayed on the LCD, e.g. disk activity, time, Ethernet
    activity and more. A program running on the LCD accesses a customisable configuration
    file which tells it what to display on the LCD. The LCD in figure 8.1 is displaying
    the CPU and RAM info on the top line, system up time on the second line, Ethernet
    transfer rate on the third line and a bar graph of the Ethernet receive and transmit
    activity. An animated beating heart is displayed in the bottom right corner of
    the LCD.


    The project consists of a circuit board that interfaces the LCD to the PC via
    USB, firmware that runs on an AVR ATMEGA8 microcontroller and a program that runs
    on the PC to send information to the LCD.


    The original circuit can be found on the website mentioned above and supports
    several sizes of displays with different pinouts. In order to fit the circuit
    to a single-sided PCB, the original design was modified to support only one display
    size and pinout – a 4 line by 20 character LCD display. You can use the ideas
    presented here and KiCad to build your own version of the display if you do not
    have easy access to the same display used. Other modifications from the original
    were that the electronic control of the LCD contrast was replaced by a pre-set
    potentiometer and the electronic control of the LCD backlight was removed – the
    backlight is permanently on.'
  merge: -1
  img_proc: true
- pgno: 209
  md: '![](img/3c46617540546e0091f48cc286948fbe_209_0.png)


    # Hardware


    The hardware consists of a character LCD display interfaced to a Atmel ATMEGA8
    microcontroller. A few external components including a USB connector are needed,
    although a USB cable could also be soldered directly to the board. No special
    USB chip is required as USB is implemented in the firmware on the ATMEGA microcontroller.


    # Firmware


    The firmware that is loaded onto the ATMEGA8 is pre-compiled and ready to be loaded
    to the microcontroller. Source code for the firmware is also available. Both can
    be downloaded from harbaum.org/till/lcd2usb, but are also included with the accompanying
    files in CH08/lcd2usb.'
