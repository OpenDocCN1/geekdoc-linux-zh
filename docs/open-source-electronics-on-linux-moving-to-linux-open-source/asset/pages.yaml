- pgno: 106
  md: '# Chapter 4. Open-source Hardware: Arduino


    Arduino is an open-source microcontroller based hardware platform and software
    development environment. The Arduino hardware does not have to be bought, you
    can build it yourself as it is open source - schematics and PCB layouts are available
    free of charge. It may be more convenient to buy the hardware than to build it.
    "Official" Arduino hardware is available from many online shops. Arduino clones
    are available from a number of sources as well.


    Website: arduino.cc

    Arduino Hardware License: Creative Commons Attribution Share-Alike license.

    Arduino Software License: Arduino IDE software – GPL, microcontroller libraries
    – LGPL.

    Platforms: Software runs on Linux, Windows and Mac OS X.


    Figure 4.1 shows the Uno board which is the "base model" Arduino. The connectors
    on either side of the board can be used to interface with various circuits of
    the board using single core insulated wire to connect it to a breadboard. Piggyback
    boards called "shields" can be bought or built that plug into the connectors on
    the Arduino board to add functionality, e.g the Ethernet shield provides the Arduino
    with an Ethernet connection.


    Take a look at the hardware page on the Arduino website (arduino.cc/en/Main/Hardware)
    to see the official Arduino hardware. Some of the Arduino boards are able to be
    fitted with standard shields, others are miniature boards that are made for specific
    purposes like plugging directly into a breadboard or embedding in a project.


    To program the Arduino board, a free software environment must be downloaded from
    the Arduino website. After installing and starting the Arduino software, an IDE
    (Integrated Development Environment) is used to write, compile and load programs
    into the Arduino board via a USB cable. The programming language used is very
    much like the C and C++ languages, knowing one of these languages will definitely
    help you to start programming the Arduino quicker. The main similarity to C++
    is the use of objects from the library, although when actually Arduino programming,
    these objects are used from the library and it is not a requirement to create
    your own objects in a program (i.e. you will not have to write your own classes,
    only using existing ones).'
  merge: -1
  img_proc: true
