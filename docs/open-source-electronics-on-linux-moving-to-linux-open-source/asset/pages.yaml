- pgno: 183
  md: 'Chapter 5. AVR 8-bit Microcontrollers


    # 5.5 Using the AVR Dragon to Reset AVR Fuses


    When fuses in an AVR can not be set to default values using an in-system programmer,
    they need to be programmed using HV (high voltage) parallel programming. This
    can be done using the AVR Dragon.


    An example of HV parallel programming is needed is if an AVR is programmed to
    use an external crystal and ends up in your spares box, you may not know the state
    of the AVR''s fuses. When the AVR is plugged into a breadboard without an external
    crystal, it will be impossible to program the device again without the correct
    crystal value connected. When trying to connect to the AVR using an in-system
    programmer, the AVR will appear to be blown when it may be fine and just need
    fuses reset so that it runs from the internal RC oscillator again.


    # 5.5.1 Connecting the AVR


    To use the AVR Dragon in HV parallel programming mode, connections need to be
    made from the HV_PROG connector on the AVR Dragon to the AVR device. These connections
    are different for different AVR devices and can be found in the AVR User Guide
    (the chm file can be found in the accompanying files in CH5/AVRDragon.chm). When
    viewing the guide in a Chm viewer the wiring for each chip can be found under
    Connecting the AVR Dragon -> Device Connection Sheets Scroll down the list and
    find the device that you want to reset/program. Make sure that you find the “Parallel
    programming” connection diagram (as opposed to the “In System Programming and
    debugWIRE emulation”).


    Example – connecting the ATiny2133:


    Figure 5.20 shows the parallel HV connections from the AVR Dragon connectors to
    the ATiny2133 microcontroller. This diagram was taken from the AVR Dragon User
    Guide. The diagram shows the four headers on the AVR Dragon and the pin numbering
    of the ATiny2133.


    The diagram shows that besides connecting pin 6 of the VCC connector to the ISP
    connector on the AVR Dragon, all of the connections to the ATiny2133 are taken
    from the HV_PROG connector. No external power is needed, the device must just
    be connected as shown. Power is obtained by the AVR Dragon from the USB port.


    182'
  merge: -1
  img_proc: true
