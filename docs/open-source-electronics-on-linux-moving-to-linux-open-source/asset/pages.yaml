    # 2.4 KiCad Tutorial 2 – IC Circuit


    This tutorial covers placing of a component that has multiple parts – a 7400 IC
    that has its two-input NAND gates. Connecting hidden pins, placing no-connect
    flags and making a text box is also covered.


    The circuit diagram is shown in figure 2.17. The resistor with a value of 0 ohms
    in the circuit diagram is used to make the layout of the board possible on a single
    layer boörd. If you want to build this circuit board and don''t have any 0 ohm
    resistors, use a wire link instead.


    The steps to create the project are listed below, but only new KiCad functions
    not used in tutorial 1 are described in detail. Refer to tutorial 1 for details
    on the steps already covered e.g. how to start a project, how to zoom and pan,
    etc.


    Find the completed tutorial with the accompanying files in CH02/IC_multivibrator.


    Tut 2-1 Start a new KiCad project


    +   - Start a new KiCad project called “IC_multivibrator”.


    +   - Remember to create a new folder for the project with the same name as the
    project.'
