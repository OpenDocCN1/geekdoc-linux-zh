- pgno: 131
  md: '# Chapter 4. Open-source Hardware: Arduino


    # Other hardware notes


    The LED on pin 13 is available on the Arduino board and on the Ethernet shield
    cannot be used as a general purpose LED as pin 13 is the clock line of the SPI
    port.


    Pin 2 on the Arduino/Ethernet shield may be used to enable interrupt driven communications
    between the Ethernet chip and the Arduino microcontroller. This would need to
    be enabled by soldering the "INT" jumper on the Ethernet shield, but interrupts
    are not supported by the Arduino Ethernet library.


    The SPI port of the Arduino microcontroller is shared by the Ethernet chip and
    the microSD card socket.


    # 4.5.3 Implementing an Arduino Web Server


    The WebServer program that we used to test the Ethernet shield is very basic.
    We will build a more useful web server in this section, but firstly we will look
    at some programs that will help in understanding how to implement a web server.
    All of the example programs used in this section are available with the accompanying
    files in CH04/sketchbook/. In each example, you will need to change the MAC address
    to that of the sticker on your Ethernet shield and the IP address may be changed
    to suit your network as previously when testing the Ethernet shield.


    # Looking at HTTP requests from the web browser


    The WebServer_req_ascii program will display all of the information sent from
    the browser to the Arduino over the Ethernet connection. The information is displayed
    on the Serial Monitor via the USB connection.


    Load this program to the Arduino board and then start the Arduino Serial Monitor.
    Now start your web browser and surf to 10.0.0.20 or whatever IP address you programmed
    into the Arduino. The requests sent from the browser will be displayed in the
    Serial window. Later when we answer the first request immediately, the rest of
    the requests that you have seen will not be sent by the browser.


    The WebServer_req_hex program does the same program, but displays the data sent
    from the browser in ASCII as well as in hexadecimal. This is just so that we can
    see exactly what the web browser is sending of the characters sent are not visible.
    What this program demonstrates that each line sent from the web browser ends with
    a carriage return and line feed character which can be seen in the hexadecimal.
    These are non-visible characters with the hexadecimal value of 0D for the carriage
    return and A0 for the line feed. In the Serial Monitor, they'
