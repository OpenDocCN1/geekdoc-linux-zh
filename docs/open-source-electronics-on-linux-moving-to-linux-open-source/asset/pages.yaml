- pgno: 133
  md: '# Chapter 4. Open-source Hardware: Arduino


    update every second in the program. This can be disabled or changed in the program
    to update at a different rate. The following line in the Arduino program is responsible
    for setting the web browser refresh rate:

    client.print("<meta http-equiv="refresh" content="1">");


    The value "1" in the above line can be changed to update at a slower rate, e.g.
    changing it to 2 will cause the browser to refresh every two seconds. To disable
    automatic refreshing, either remove or comment out this line.


    Clicking one of the LED checkboxes will light up the corresponding LED connected
    to the board and unchecking a checkbox will switch it off. Because the web browser
    is refreshing automatically, the checkbox can only be clicked between refreshes
    and not while the page is busy loading. The automatic refresh can be disabled
    as described above, but then the switch and analog values will only be updated
    on the page each time an LED checkbox is clicked or the page is refreshed manually.


    To stop the web browser from refreshing without modifying the Arduino program,
    press the escape (Esc) key when using the browser. Refreshing the browser or clicking
    one of the checkboxes on the web page will start the automatic refreshing again.


    The program works by sending HTML code, that describes the web page to be displayed,
    to the web browser when it is requested by the browser. This is basically the
    same as the WebServer example that we used to test the Arduino Ethernet board,
    except that this example includes some CSS that positions the displayed box on
    the web page and changes the text colours and font.


    When a checkbox is clicked, the state of the checkbox is sent by the browser to
    the Arduino web server. The Arduino program stores the state of the checkboxes
    and will generate the correct HTML to send to the web browser depending on whether
    a checkbox is checked or unchecked.


    To understand how the program works, take a look at the source code and the comments
    in the source code. To understand what is being sent to the web browser, you will
    need to have a bit of HTML and CSS knowledge.'
  merge: -1
