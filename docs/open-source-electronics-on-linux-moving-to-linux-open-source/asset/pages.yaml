  md: '# Chapter 5. AVR 8-bit Microcontrollers


    ![](img/3c46617540546e0091f48cc286948fbe_153_0.png)


    Figure 5.4: AVR Simple Serial Port Programmer


    **Figure 5.5** shows a better serial port programmer that uses a line driver/receiver
    IC to convert the serial port signals to proper RS-232 voltage levels. This programmer
    can be built if you are having trouble getting the programmer of **figure 5.4**
    to work on your PC.


    In the circuit diagram of **figure 5.5**, U2 is a MAX232 and operates from 5V.
    This IC receives its power from the circuit being programmed through the ISP header,
    so this programmer as shown can only be used to program AVRs powered by 5V.


    To be able to use this circuit to program AVRs that are powered by 3V to 5V, a
    **MAX3232** can be used to replace the **MAX232**. U1 will need to be a **74HC00**
    and not a 7400, 74LS00 or 74HCT00. MAX3232 ICs usually require smaller values
    of capacitors than the 1µF capacitors – check the datasheet for these values.


