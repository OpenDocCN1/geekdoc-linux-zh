- pgno: 46
  md: '# # Chapter 2. Creating Schematics and PCBs with KiCad


    KiCad is a software suite of Electronic Design Automation (EDA) tools used for
    schematic capture (drawing circuit diagrams), PCB layout and generating output
    files for manufacturing of PCBs. Another set of open-source EDA tools is gEDA.
    gEDA is not as well integrated between its different software components and is
    not as user-friendly as KiCad.


    All of the projects that you can build in this book are based on KiCad, so you
    can easily modify and adapt them to your needs.


    Website: launchpad.net/kicad or www.kicad-pcb.org or kicad.sourceforge.net

    License: GNU GPL

    Platforms: Linux, Windows and Mac OS X


    # ## 2.1 Installing KiCad


    The version of KiCad used with this book is kicad-2011-05-25 and was installed
    from the Linux Mint Software Manager.


    To install KiCad, start the Software Manager (Menu -> Software Manager) and then
    type kicad into the search field. Double-click kicad in the list and then click
    the Install button. KiCad documentation can also be installed and is available
    in several languages. These are the kic-doc files that you will see when searching
    for KiCad in the Software Manager.


    After installation, KiCad can be found on the Mint Menu - Menu -> Programming
    > KiCad if All applications is selected on the Menu. A shortcut can be made by
    dragging the KiCad icon from the menu and dropping it on the bottom panel or onto
    the desktop.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Chapter 2. Creating Schematics and PCBs with KiCad


    # 2 A Quick Overview


    Starting KiCad will open the main KiCad window that enables a new project to be
    created. The main window contains five big icons that are used to start each application
    of the KiCad software suite, namely:


    +   - ESchema – the schematic editor for drawing circuit diagrams.

    - CVpc – used to assign PCB footprints to the components placed in the schematic.

    - PCBnew – for laying out PCBs.

    - GerberView – for viewing Gerber output files used for manufacturing PCBs.

    - Bitmap2Component – for creating a logo from a bitmap.


    The main KiCad window is discussed further in the first KiCad tutorial in this
    chapter and is shown in figure 2.2.


    # Using the tools:


    The typical procedure for drawing a schematic to create a PCB goes as follows.
    Create a new KiCad project. Use ESchema to draw a circuit diagram by placing schematic
    symbols from the libraries to the page and connecting them with wires. Generate
    a netlist from the schematic. Run CVpc to assign PCB footprints to each of the
    components used in the schematic. Start PCBnew and import the netlist. This places
    footprints for each of the components used in the schematic and shows all of the
    connections between the pins of the components as made in the schematic. The components
    are now placed in the desired positions and connected with tracks. Outputs for
    manufacturing (Gerber files) can be generated, or for home PCB making, the PCB
    artwork can be printed.


    # Documentation:


    If you installed the KiCad documentation, then it can be found in /usr/share/doc/kic/
    (You will need to click the File System icon in the file manager to locate /usr
    and its sub-directories).


    # The tutorials:


    The first tutorial in this chapter takes the reader through the process of drawing
    a circuit diagram to producing outputs for making a home-made PCB. Although a
    simple transistor circuit is used in the tutorial, it is recommended that even
    experienced EDA tool users who have never used KiCad before follow this tutorial
    to get familiar with KiCad. The tutorial uses a simple circuit so that the reader
    can concentrate on learning to used KiCad rather than spending time on drawing
    a complicated circuit.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# 2.3 KiCad Tutorial 1 – Transistor Circuit


    The second tutorial follows up on the first tutorial by adding an IC with gates
    that need to be placed individually. This tutorial shorter than the first tutorial
    as it does not explain everything from the first tutorial over again but lists
    the steps that need to be performed to create the circuit and explains the additional
    steps that need to be performed to place the IC gates.


    Drawing units:


    KiCad and other EDA tools allow you to draw using metric (imetres) and imperial
    (thou thousands of an inch also called mils). In KiCad it is easier to draw the
    schematic you, as the tips of the component pins are aligned to this grid and
    the units are in nice round numbers e.g. the default spacing of the drawing grid
    is 50miles (thou).


    When drawing the PCB, you can change between the two measurement units as needed.
    For example, if you want your board dimensions to be inimet then change the measurement
    units toimet to draw the board outline. Most through-hole components have pin
    spacing in thou, so change to the scale when placing and routing these components.
    If you have any components that have pin spacing in metric (usually surface mount
    components), then change to the millimetre scale when placing and routing them.


    Grid spacing:

    Whether drawing a schematic or PCB, it is best to stick using the biggest grid
    spacing as possible and only change to a smaller grid when necessary. After using
    a smaller grid size, change back to the bigger size as soon as possible.


    # 2.3 KiCad Tutorial 1 – Transistor Circuit


    As an introduction to KiCad, we will enter the circuit of figure 2.1, a simple
    LED flashing astable multivibrator, into KiCad''s schematic capture program called
    EESchema. We will then assign a footprint to each component in the schematic diagram
    using CVpcb and lay out a PCB using PCBnew. The KiCad files for the completed
    tutorial can be found in CH02/LED_multivibrator.


    You may wish to open the postscript file of figure 2.1 from the finished project
    accompanying files (CH02/LED_multivibrator/LED_multivibrator.ps) and print it
    so that you don''t have to keep turning back to this page as you follow the tutorial.'
  merge: -1
  img_proc: true
