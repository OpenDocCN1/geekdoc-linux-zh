  ## 引言

  对于任何软件领域的专业人士，Linux 一直是易用性、创造力和自由的缩影。Linux 被誉为我们时代最伟大的成就之一。它是一个凭借其动态特性、海量的分发版（也称为“distros”）以及它带来的安全性而彻底改变世界的操作系统。随着全球范围内涌现的成功案例，这一操作系统凭借其高标准和完美的功能继续主行业占据主导地位。


  Linux 频繁登上新闻头条，这完全是有理由的。由于像 Android 和整个 Macintosh 操作系统（OS）等产品和服务的存在都源于 Linux，该操作系统巩固了其市场领导者的地位。


  随着成千上万的专业人士学习 Linux，让自己熟悉它变得比以往任何时候都更有意义，而这正是本书的所在。


  ## 本书将带给你什么

  幸运的是，你不需要成为一名高级程序员或编程专家就能从书中获得最大的收获。如果非要说，这本书是针对那些不知道 Linux 是什么、它是如何运行的以及谁应该使用这个神奇操作系统的读者设计的。


  本书的编写意图是确保将复杂性和高级术语降至最低，以便读者轻松理解。理解得越深，你对即将操作的新操作系统的掌控能力就越强。


  对于那些愿意开启开源操作系统之旅并熟悉其基础功能、命令和核心要素的人来说，本书可以作为一个良好的起点。书中还将反映网络、脚本和应用程序等话题，希望读者能够发现自己可以从容应对指令和指导来增强他们的体验。


  本书涵盖了每个初学者为了成功运行操作系统并最大化生产力所必须理解的基础知识。无论你是想出于娱乐还是专业目的使用 Linux，本书都能让你学习、理解并随心所欲地执行基本命令、配置系统、个性化用户环境，并在需要时深入某些高级的魔法操作。


  ## 一些基础术语

  尽管在整个过程中我们尽力保持简单、友好的方法，但仍然会使用一些重要的词汇和术语。这些词可能会出现在书中大部分，用于详述或提供解释。为了让你稍作热身并让技能流动起来，这里有一些常用术语：


  - **命令行界面 (CLI)**：一种基于文本的界面，允许用户在计算机中导航、移动文件并执行命令。

  - **口味 (Flavors)**：虽然有些人可能觉得这奇怪，但“flavor”一词被用来描述 Linux 的变体或分发版。

  - **内核 (Kernel)**：任何操作系统的核心和灵魂。整个操作系统、内存管理、任务管理和进程都依赖于`kernel`。

  - **操作系统 (OS)**：在机器或硬件之间通信并允许程序运行的软件。例如 Windows、Mac OS、Android 等。

  - **Shell**：一个包裹在程序周围并运行它的虚拟外壳。它是你输入命令的地方，然后操作就会被执行。

  - **Unix**：Linux 的母体。这确实是一个事实，而不仅仅是一个华丽的说法。


  ## 第一章：是什么导致了 Linux 的诞生？

  如果你刚刚开始一段新的旅程，却立刻被带回到这些页面中，你可能会奇怪为什么。对此有一个非常完美的解释，在结尾时就会变得明朗。我们知道自己即将学习一种叫做 Linux
  的东西，它是 Windows 和 Mac OS 的竞争对手，显然大多数人从未听说过它。这个害羞但极其高效的操作系统吸引了世界的巨大关注。它作为最伟大的成就之一，无论人们是否知道它，都在继续服务于每一个人。如果你是一个用户，你已经熟悉了
  Linux 使用的文件系统。你可能听说过通过 root（根用户）访问的用户和超级用户。


  ### 简述历史

  我们发现自己处于 1991 年到 1994 年之间。一个名叫 Linus Torvalds 的人启动了一个项目，他的动机是创建他自己的操作系统。使用 Unix
  作为构建模块，整个操作系统是从零开始制作的。这是你可能想要记忆的。显然，那些见过 Unix 的人会知道 Linux 使用了相似的命令。这自然导致人们认为 Linux
  只是 Unix 的另一个版本。


  这两个操作系统都是独立的，服务于不同的目的。解决了这些后，我们现在可以继续寻找是什么促使 Torvalds 从头开始创建一个操作系统。在 Linux 成为如今的这种成功者之前，其他操作系统已经存在了。为了让人们能够访问和使用它们，他们需要付费。这对于许多软件工程师和开发者来说是一个问题。显然，世界还没有引入像这样可以简化编写数百行代码过程的来源。在
  Linux 成为如今的这种成功者之前，其他操作系统已经存在了。为了让人们能够访问和使用它们，他们需要付费。这对于许多软件工程师和开发者来说是一个问题。显然，世界还没有引入像这样可以简化编写数百行代码过程的来源。在
  Torvalds 从头创建一个 OS 之前（注：此处原文文本中存在大量重复内容，翻译已根据要求去重，仅翻译了核心逻辑部分）。


  ### 开源概念与分发版

