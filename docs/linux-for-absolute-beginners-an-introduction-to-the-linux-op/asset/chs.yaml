  ## Linux Mint

  这是一个非常出色的发行版，而且它实其实名归。它非常轻量，即使在最低配置的硬件上也能运行。凭借极简主义的 GUI，该操作系统运行得非常流畅，在性能方面应该不会有任何问题。


  ## 红帽企业 Linux (RHEL)

  这是一个比较棘手的选择。它被誉为商业组织、企业甚至政府机构的首选。它以其桌面版和服务器版本的强大功能而闻名，在成千上万的发行版中脱颖而出，并拥有 Linux 发行版阵容中最活跃的社区之一。如果你正考虑学习
  Linux 并将其用于大型业务用途、组织服务器或政府工作，那么这应该是你的最终目标。记住，我们首先学习的是基础知识。


  ## Kali Linux

  如果你听过过道德黑客（ethical hacking），这里就是一切发生的地方平台——一个为道德黑客提供的白帽解决方案。`Kali Linux` 的目的是分析现有的安全措施、加强安全性，并允许道德黑客和网络安全专家使用工具以获得最大收益。它是另一个基于
  Debian 的发行版，旨在测试服务器、网站等的安全性。如果你打算在白帽、道德黑客领域寻求职业发展，在掌握了一些基本命令后，你应该目标这一个。


  ## Fedora

  它以向用户提供所有最新功能，同时保持高度可定制性而闻名。这个 Linux 发行版由红帽支持。它是世界上最流行的 Linux 发行版之一。它不断发布新的软件、功能和更新。


  ## Elementary OS

  在视觉效果和感受方面，这可能是最有吸引力的。这个版本的 Linux 使用 Pantheon 桌面环境，使其看起来像是 Mac OS 的改进版本。然而，它也有缺点。如果你正在寻找一个预装了几个应用程序的操作系统，这可能不是你喜欢的的那一个。


  你不需要急于决定。你可以花点时间考虑，或者直接选择 Ubuntu。一旦你准备好了，就是开始创建空间并下载属于你自己的 Linux 副本了。


  ## 下载和安装 Linux

  遵循这个简单的分步骤指南，你很快就能在所谓的“虚拟机”上运行你自己的 own Ubuntu 副本了。


  ### 第 1 步：下载虚拟化软件

  为了虚拟化，我们将下载 `VirtualBox`。打开浏览器并访问 `http://www.virtualbox.org/` `www.virtualbox.org`。你很快会看到一个写着“下载”（Download）的大按钮。目前（截至
  2021 年 6 月），该按钮显示为“下载 VirtualBox 6.1.22”。在你阅读这段文字时，如果有新版本发布，可能会发生。点击下载按钮后，你将进入一个页面，你可以在一系列选项中进行选择。选择适用于你当前系统的宿主机版本（host
  version）。


  完成后，打开下载的文件并像平时安装任何其他软件一样滚动阅读安装提示。如果你希望自定义任何内容，例如更改安装目标文件夹或添加/删除快速启动按钮，请尽管这样做。一切准备好后，点击“下一步”（Next），安装将开始。


  ### 第 2 步：下载你的 Linux 副本

  问一个小问题！我们在书中提到最常使用的是哪种 Linux 发行版？


  如果你的答案是 Ubuntu，干得好！你完美地遵循了指令。访问 `http://www.ubuntu.com/` `www.ubuntu.com` 开始该过程。在最上方，你应该看到一个写着“下载”（Download）的选项。点击它并停止！


  你可能会看到长期支持 (LTS) 版本，但我们现在对那些并不感兴趣。让我们点击当前的非 LTS 版本。现在，我们有 `21.04`，它也被称为 `Hirsute
  Hippo`。名字很有趣吧？当然！把 `.ISO` 镜像下载到你的电脑上。这可能需要一段时间，请尽管打发时间。一旦我们准备就绪，让我们开始第三步。


  ### 第 3 步：安装

  我们已经安装了 `VirtualBox`，现在有了 Ubuntu 的 `.ISO` 镜像。现在是时候启动 `VirtualBox` 了。一旦应用程序加载，点击写着“新建”（New）的蓝色圆圈。


  我们将新的虚拟机 (VM) 命名为 `Ubuntu`。选择你挑选的目标文件夹或保持原样——这并不重要。默认类型应该显示为 Linux，但如果不是，请确保使用下拉菜单并将
  Linux 设置为你的类型。版本应该是 `Ubuntu_64`（大多数机器都可以运行该）。


  现在，点击“下一步”（Next），你将被要求分配内存大小。记住，虚拟机拥有的内存越多，运行和操作就越好。让我们最多只分配内存的 50%。如果你可用内存较少，可以分配较小的尺寸，但不要低于推荐尺寸。一旦对你的选择满意，就是时候做另一个决定了。


  系统现在会询问你是否想要设置一个虚拟硬盘。推荐尺寸是 `25.0 GB`。你可以坚持使用该尺寸或根据意愿增加/减少。确保将黑色选择点留在“现在创建虚拟硬盘”（Create
  a virtual hard disk now）上。我们现在不想进入高级设置。点击“下一步”（Next），保留当前选择的虚拟磁盘镜像 (`VDI`)，并继续。


  在这里，你有选择动态分配磁盘（dynamically allocated disk）或固定大小磁盘（fixed-sized disk）的选项。虽然你可以保持默认设置（即动态分配磁盘），但建议将其更改为固定大小。“为什么？”你可能会问。让我们给出一个简短简洁的回答：固定大小磁盘允许虚拟机在分配的空间内工作。这需要一点时间，你可能需要等待一下。动态分配磁盘虽然很快，但它在性能方面可能会出现很多问题。既然如此，点击固定大小选项并点击“下一步”（Next）。使用显示的推荐尺寸。点击“下一步”（Next），然后坐下，系统现在将创建虚拟磁盘镜像
  (`VDI`)。


  现在，你距离启动 Linux 只有一步之遥。点击指向右侧的大绿色箭头，写着“启动”（Start）。不是你所预期的吗？那是我们加载了 `.ISO` 镜像。点击 Ubuntu
  旁边的绿色箭头，写着启动（Start）。


  ### 第 4 步：设置 Ubuntu

  最后！我们已经启动了。在几分钟后，你将看到 Ubuntu 的设置欢迎界面。现在完全不需要担心，我们已经过了复杂的阶段。你现在需要的是设置。点击“安装 Ubuntu”（Install
  Ubuntu）开始并点击“下一步”（Next）。你会遇到一个特定的屏幕，询问你是否想要删除并安装。只需点击“下一步”（Next）。我们已经分配了未使用空间。既然如此，安装将开始。这需要一些时间。安装成功后，系统应该重启，你会被登录界面欢迎。使用你之前设置的密码登录，漂亮！如果你运行的是
  Windows，可能会看到以下错误：

  ```

  Failed to open session for virtual machine

  VT-x features locked or unavailable

  VERR_VMX_DISABLED

  Result Code: 0x8000405

  Component: Console

  Interface: db7abca3f-4183-c120da923

  ```

  在这种情况下，你需要关闭电脑，重启并进入 BIOS 设置。从那里你需要启用“虚拟化”（Virtualization）选项。这应该解决你的问题，你现在运行 Linux
  没问题了。如果你遇到更多麻烦，寻找解决方案应该没问题，因为有很多论坛提供解决方案。这结束了这一过程。


  ## 熟悉界面

  现在是时候尝试 GUI、桌面以及预装的各种有趣应用程序了。我不说这一开始可能愉快；但一旦你掌握了它，它就会很有意义。桌面包含了大部分重要方面，例如你的 dock（左侧），所有固定或活跃的应用程序悬浮在那里。对于
  Mac OS 的朋友来说，这可能看起来太熟悉了。你有一个顶部面板，显示时钟、几个指示和用户菜单。用户菜单是可以关闭系统或重启或访问其他有用的地方。使用用户菜单，你可以点击左下角像齿轮的图标访问系统设置。在这里，你可以按照喜好配置设置，确保一切看起来和感觉都是你喜欢的。这让你熟悉
  dock、应用栏等的位置至关重要。到为止讨论的所有内容都是关于桌面的。这被称为用户环境。Ubuntu 使用 `GNOME`。不同的发行版有不同的桌面环境。你可以在它们的特定网站上找到关于每个环境的更多信息。


  在新的 Ubuntu 中进行导航应该是很容易的，即使是你第一次。使用 `Windows` 键调出主应用程序菜单。值得注意的是，这个键被称为 `super` 键。如果你考虑将
  Linux 成为你的主操作系统，可能会发现记忆键的常用名称会有帮助，这样当讨论 `super` 键、超级用户（super user）或 root（root）时，你就不会感到迷失或不知所措。我们在这里讨论几个，但关于更详细的信息，请查看
  Ubuntu 社区，你应该能够找到大部分信息。双击带有你名字的文件夹将允许访问用户的文件和目录。在那里，你可以看到下载、音乐和图片文件夹。在窗口的左侧，你应该会有在
  Mac OS 或 Windows 中找到的那样的快速访问按钮。使用这些快速从一个文件夹或目录切换到另一个。新的 Ubuntu 版本现在允许你将任何文件夹标记为收藏。如果我们经常使用该目的地，这将节省大量时间。只需右键点击该文件夹并选择“星标”（Star）。就是这样。现在，只需点击一下即可访问此文件夹。请注意，这可能在所有文件夹上都不起。现在整个系统是空的。我们还什么都没做。随着时间的推移，你可能会开始创建文本文件或下载音乐、电影和游戏。你甚至可能开发软件或创建程序并将它们保存在重要位置。使用星标方法，你应该为你节省大量时间。既然如此，Ubuntu
  允许大量的自定义，有许多主题、图标包，你可以更改想要的一切。你可以在互联网上搜索或访问 `www.gnome-look.org` 来更改桌面外观。安装主题是简单的。我们将下载一个名为
  `GNOME tweak` 的工具并安装它。我们将通过过程并看看完成这个简单任务需要多久。这应该是第一次查看终端的力量以及为什么电脑极客如此依赖它。


  让我们把场景称为“A”。我们使用传统的 GUI 浏览软件商店并搜索此工具进行下载安装。首先，进入应用程序/软件 dock。点击 Ubuntu 图标（带有“A”的橙色那个）。现在让我们对比场景“B”。在桌面的任何地方右键并点击终端。或者，你可以使用快捷键
  `Ctrl+Alt+T` 调出终端 shell。输入以下命令：


  ```bash

  sudo apt-get install gnome-tweak-tool

  ```

  输入密码验证并按回车。将询问你是否愿意继续安装。输入“Y”表示是并按回车。就是这样！更快、更有效。你不需要更改任何屏幕或浏览许多页面来获取应用程序。我们将学习很多命令，所以如果它们现在看起来没意义，不要担心。我们很快就会进入细节。


  终端使用一组代码与机器和用户通信。对于普通用户来说，这可能看起来难以接受，但对于任何经验丰富的专业人士来说，每个文本字符串都传递了特定的信息。无论你是尝试计算还是访问某些文件和文件夹，你都需要使用终端可以理解和操作的语言。Linux
  的发明者朋友 Linus 先生可能是引入引入智能工作而非苦干工作概念的人。他从不想工作太多，这一点在终端中被完美地复制。终端将为你完成所有的辛苦工作并直接提供结果。


  如果你进一步学习并学习 Python 等语言，你将能够在尽可能减少自己工作的情况下从终端中提取最大的价值。想象你必须编译涉及大量研究的数据。如果你是 Python
  用户，你只需要在终端创建脚本并将其传递给终端。


  ## 文件系统和目录：“什么”和“如何”

  Linux 与 Windows 略有不同。为了完全理解它是如何工作的，如何创建新目录是必要的。


  ### 根目录 (Root Directory)

  从桌面打开带有登录的文件夹。一旦打开，按下 `Ctrl+T` 打开新标签页。在新标签页中，在左侧向下找到你想要的路径。点击它访问更多位置，你应该看到。


  ### Home 目录 (Home Directory)

  根目录被标记为 `/`。这是系统使用的最高目录。无论什么都会发生在其中。


  ### Usr 目录

  同样，`/usr` 是根目录。它被系统用于许多事情。在这里我们讨论绝对和相对路径。


  ### Bin 目录 (Bin Directory)

  `bin` 可能是系统中最重要的目录之一。虽然有各种 `bin` 目录，它直接位于根目录下。这是系统执行所有功能和任务的地方。大化很重要，人们倾向于忘记这一点。


  ### Dev 目录 (Dev Directory)

  `Dev` 是设备所在地。Linux 的灵感源自古老的 Unix 系统，有类似的概念。最显著的是，你在这里找到与硬件相关的所有，包括硬盘、分区、鼠标等。你仍然可以在这里查看，除非你知道自己在做什么。


  ### Etcetera 目录 (Etcetera Directory)

  字面意思是！目录名为 `etc`。虽然在名称上还有些困惑，我们将 `etcetera` 这样称为它。这个目录负责持有系统范围内的配置文件。这意味着任何应用程序或软件的配置将存储在这里。我们稍后会讨论。


  ### Libraries (Libraries)

  每个 Linux 系统都有供各种应用程序执行许多任务和功能的库。在我们的情况下，我们可能会看到名为 `lib` 的文件夹，`lib32`、`lib64` 和 `libx32`。再次，除非百分之百确定自己在做什么，否则不应该动这些这些。


  ### Lost+Found

  可能被命名为其他，但 Linux 有一个目录用于保留在过程中损坏或丢失的文件（例如，突然关机）。


  ### Media 和 /mnt 目录 (Media and /mnt Directories)

  简单来说，这些是我们在 Linux 中挂载其他驱动器的地方。这些包括任何软盘（我们不再使用，但知道它是好的）、CD 驱动器、USB 质存储、网络驱动器等。


  ### Optional 目录 (Optional Directory)

  名为 `opt`，可选文件夹由第三方手动安装的软件组成。有一些软件包安装在这个目录中。如果你是软件工程师并自己创建了软件，你也可以使用这个目录安装你自己的软件。


  ### Process 目录 (Process Directory)

  `Proc` 目录是我们到达桌面的地方。漂亮，不是吗？只要你提供了足够的空间，目录内名为 `LinuxAdditions` 的文件。该文件有 `.run` 扩展。带有这些扩展的文件可以直接从终端运行。你现在应该打开终端。如果你使用了提示符，这可能是有意义的。从左侧开始，跟着斜杠
  (`/`)。之后是子目录以及你在目录中做的任何操作。


  ```bash

  ./LinuxAdditions.run

  ```

  按回车。看到你需要管理员权限了吗？在 Linux 世界中，我们称超级用户（super user）。这本质上和 Windows 中的管理员一样。现在输入以下命令来允许这些权限：


  ```bash

  sudo ./LinuxAdditions.run

  ```

  将被要求密码验证。提供所需信息并回车。几分钟后，安装将完成，你会看到性能上的差异。为了获得最佳结果，去桌面右上侧点击下拉图标访问用户菜单并重启 Ubuntu。现在，桌面看起来和感觉会更宽敞、更有吸引力。性能也会提高。这是你可以开始移动、查看
  Ubuntu 商店并自定义你想要的一切的时候。记得我们提到以后会讨论终端吗？很好，我们在这里了。我们刚刚用终端为我们做了一些事情；现在我们将看到终端是多么简单和高效。我们将尝试下载一个名为
  `GNOME tweak` 的工具并安装它。我们将通过过程并看看完成这个简单任务需要多久。这应该是你第一次查看终端真正的力量以及为什么电脑极客如此依赖它。让我们把这个场景称为“A”。我们使用传统的
  GUI 浏览软件商店并搜索此工具进行下载安装。首先，进入应用程序/软件 dock。点击 Ubuntu 图标（带有“A”的橙色那个）。一旦软件商店屏幕加载，点击放大镜启动搜索并输入
  `GNOME Tweak`。你应该就能找到该工具了。


  现在让我们对比场景“B”。在桌面的任何地方右键并点击终端。或者，你可以使用快捷键 `Ctrl+Alt+T` 调出终端 shell。输入以下命令：


  ```bash

  sudo apt-get install gnome-tweak-tool

  ```

  输入密码验证并按回车。将被询问你是否愿意继续安装。输入“Y”表示是并按回车。就是这样！更快、更有效。你不需要更改任何屏幕或浏览许多页面来获取应用程序。我们将学习很多命令，所以如果它们现在看起来没意义，不要担心。我们很快就会进入细节。


  终端使用一组代码与机器和用户通信。对于普通用户来说，这可能看起来难以接受，但对于任何经验丰富的专业人士来说，每个文本字符串都传递了特定的信息。无论你是尝试计算还是访问某些文件和文件夹，你都需要使用终端可以理解和操作的语言。Linux
  的发明者朋友 Linus 先生可能是引入智能工作而非苦干工作概念的人。他从不想工作太多，这一点在终端中被完美地复制。终端将为你完成所有的辛苦工作并直接提供结果。


  如果你进一步学习并学习 Python 等语言，你将能够在尽可能减少自己工作的情况下从终端中提取最大的价值。想象你必须编译涉及大量研究的数据。如果你是 Python
  用户，你只需要在终端创建脚本并将其传递给终端。






  | Command | Description |

  | :--- | :--- |

  | `cd` | 将带你回到主目录（不带参数）。 |

  | `cd ..` | 将带你进入上级目录。 |

  | `cd /` | 将带你进入根目录。 |

  | `cd ./` | 点斜杠表示“当前目录”。 |

  | `cd ../` | 回退到上级目录并进入下一个选中的目录。 |

  | `cd ~` | 输入此命令，你将回到主目录。 |

