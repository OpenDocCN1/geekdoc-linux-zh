  ## `ls` 命令


  这是一个非常实用的命令。我们非常期待开始在目录之间来回。然而，你可能会遇到某些地方，此时你并不确定其中是否包含任何可以浏览的文件或文件夹。由于这是命令行界面，没有图形界面来显示我们似乎进入的目录中包含什么内容。不过，你也有办法可以发现这一点。


  要检查你当前所在工作目录的内容，只需输入以下命令：


  ```

  ls

  ```


  终端现在应该为你提供目录、文件以及任何可能放置在那里的其他材料（如图片和图形）的列表。这些将按字母顺序排列。然而，这个命令的功能非常广泛。让我们探索一下 `ls`
  的其他命令。


  ### `ls -r`


  起初看起来可能并不很有用，但请放心，它可能会派上用场。这个命令的作用与简单的 `ls` 命令几乎相同。唯一的区别是这里的列表将按字母反序排列。如果你有很多文件，并且需要访问一个以字母
  U 开头的文件，这就会非常方便。


  ### `ls -l`


  假设你有一许多文件，并想要确定你拥有哪些文件权限。你不一定可以编辑所有文件、读取它们或访问它们。为了找出这一点，你可以使用以下命令：


  ```

  ls -l

  ```


  你现在实际上是在命令终端查看所有文件，并包含所有者和位置等详细信息，但我们更感兴趣的是组成左侧前十个字符的符号和字母。这是一个为了更好地向你解释的典型例子：


  ```

  drwxr-xr-x 3 exampletest exampletest 4096 Sep 01 12:00 Desktop

  ```


  使用 `ls -l` 命令，我们现在发现了关于当前位置内所有目录和文件的宝贵信息，并且现在可以看到每一个所拥有的权限。


  *   第一个字符显示文件类型。可以是 `d` 表示目录，`l` 表示链接，`p` 表示命名管道，`c` 表示字符设备，`-` 表示文件以及 `b` 表示块设备。

  *   第二到第四个字符提供了所有者对该文件或文件夹的读取、写入和执行权限的信息。

  *   第五到第七个字符提供了文件所在组对该文件或文件夹的读取、写入和执行权限的信息。

  *   第八到十个字符提供了所有其他用户对该文件或文件夹的读取、写入和执行权限的信息。





  现在，尝试破解我们上面的示例并找出我们拥有哪些权限。你也可以使用 `ls -l` 命令来查看自己的目录并发现更多信息。尽管如此，让我们继续另一个有用的 `ls`
  命令。你可能会在想：“我难道每次都要花这么多时间来破解文件类型吗？”这是一个非常合理的问题，但不必！终端已经为你解决了这个问题。如果你不太确定，或者倾向于忘记“d”代表目录（directory）而横杠“-”代表文件（file），我们还有另一个命令可以将工作目录中的所有内容按类型进行组织。


  `ls -p`


  此命令现在将显示所有文件和文件夹，它们带有名称和扩展名，或者带有一个正斜杠 `/`。带有扩展名的是文件，而带有正斜杠的是你的目录。非常简单，不是吗？当你准备就绪后，输入以下命令：


  ```

  ls -l samplefile

  ls -ld sampledirectory

  ```


  这里的第一个示例向你展示特定文件的权限。第二个示例也是一样，但现在得到的不是文件信息，而是我们所选文件夹或目录的信息。`samplefile` 和 `sampledirectory`
  仅用于说明。在你的情况下，选择任何你想在此使用的文件夹或文件。手头这些这些会对你非常有帮助。在未来的某个，你可能需要找出授予所有者、组或系统上任何其他用户的权限。你应该知道如何找到这些信息、对其进行解码，并在需要时进行修改，以进一步增强这些文件和目录的安全性，防止肉眼窥探。


  如果你想根据文件大小来列出列表怎么办？嗯，我们也有对应的命令：


  `ls -s`


  这将排序所有内容并根据大小列出文件和文件夹。现在让我们在列出命令上更进一步，稍微改变一下场景。假设我们只是觉得有点懒，不想进入特定目录并在那里运行列出命令。是否有办法可以在我们不进入那里的情况下找到该目标目录的内容呢？幸运的是，可以！无论你的工作目录是什么，都可以使用下面的命令获取该目录内所有可用文件和文件夹的列表。在这种情况下，我们的目标是
  `/usr/share/applications`：


  ```

  ls /usr/share/applications

  ```


  这将为我们提供上述目录中内容的列表，即使我们处于桌面工作目录。然而，你可能注意到了一点——一切看起来都有点拥挤。空间太小，要读的内容太多。让我们用一个快速命令来解决这个问题：


  `clear`


  现在，终端有空间呼吸了，看起来更好了。别担心，没有任何条目被删除，因为你仍然可以通过向上滚动来访问它们。很多人第一次看到时往往会担心。最后，给每个人一个额外的列出命令作为奖励。如果你想访问所有可能的“ls”命令，只需随时输入以下命令，你将看到所有可能的
  `ls` 命令及其参数以及它们的描述：


  ```

  ls --help

  ```


  尽管如此，是时候告别列出命令了，让我们向前查看一些你应该知道的其他基本命令。有成千上万条命令供你进入和探索；然而，我们试图只列出那些构成基础并为你提供基础知识的命令。你想要进一步掌握哪些命令取决于你自己。


  在不久前的过去，我们遇到了另一个看起来与我们这里讨论的大部分内容略不同的命令。如果你忘记了，涉及的命令如下：


  ```

  sudo apt-get install gnome-tweak-tool

  ```


  我们现在知道 `sudo` 是授予用户管理员权限以便在终端上执行上述命令的。那么 `apt-get` 和 `install` 呢？这是 Ubuntu 和基于 Debian
  的发行版的包管理器。它被称为 Aptitude。`apt-get` 是一个负责通过 Linux 命令行界面（CLI）安装或删除软件和应用程序的应用。这既快速又安全，让你完全控制安装过程。


  `apt-get` 命令后面跟着一个动作。在上面的例子中，我们使用 `install` 作为动作。如果你想删除一个程序，可以将动作替换为 `remove`。动作之后是应用程序的名称。这些应用程序包和索引存储在终端访问的
  Ubuntu 仓库中。在执行命令之前，务必确保你知道想要哪个应用程序，因为你需要使用精确的名称和大小写，命令才能正常工作。


  你可以使用下例示例来下载一个名为 Bluefish 的简单文本编辑器：


  ```

  sudo apt-get install bluefish

  ```


  系统会要求你输入密码。记住，在输入密码时，终端不会显示任何点或星号。完成后，按回车，系统将询问你是否想要继续下载并安装所需的包。输入“Y”并按回车继续。最终，你现在应该已经在系统中安装了
  Bluefish。


  由于这是一个示例，而且我们书的任何部分都不需要 Bluefish，让我们检查一下卸载此程序的命令。打开终端并输入以下命令来卸载程序：


  ```

  sudo apt-get remove bluefish

  ```


  在友好的“是或否”选择之后，Bluefish 将为你移除。就是这么简单。




  1. 转到屏幕右上角的的用户菜单。

  2. 点击 `Settings`。

  3. 选择 `Details`（最后一个选项）。

  4. 点击 `users`。

  5. 点击解锁按钮。

  6. 输入 root 密码。

  7. 使用名为“Remove user.”的红色按钮。

  8. 决定您是想保留文件还是删除它们。完成后，点击相应的选项。大功完成！


  当你删除一个用户时，可以删除用户的设置，但如果你认为这些文件仍然有用，请确保保留并能够访问由该用户创建的文件。用户一旦被删除，将不再能够访问系统或其创建的文件。现在，让我们使用命令行界面（CLI，注：原文此处可能误写为
  LUI）方法再来看一遍。


  1. 打开终端。

  2. 输入：`sudo deluser (username)`。

  3. 按回车键，大功完成！





  ## 修改用户密码


  在图形用户界面上完成这一操作非常简单。然而，在这里我们只关注终端，以及我们如何使用它来更改密码。要实现这一点，请输入以下命令：`sudo passwd (username)`


  只要你是超级用户/root 用户，你就可以在不登录这些账户的情况下更改任何账户的密码。


  ## 创建组


  我们在学习权限时，最初提到过“组”（group）这个术语。但我们没有深入探讨组究竟是什么。现在让我们来阐明一下，因为这与当前的话题以及你作为 Linux 用户的身份都相关。


  对于每个文件或目录，权限都是按照所有者（owner）、组（group）和其他人（others）的特定顺序设置的。如果你还记得之前的文件权限练习，你会发现通常所有者立即获得权限，而其他人则需要根据需求进行修改。


  “组”字面意思就是几个用户聚集在一起。例如，你可能有一个与 IT 组相关的文件。该组将包含所有与 IT 有关的用户。与其为单个用户分配读写权限，你只需创建一个组并将相关用户添加到该组中。现在，当你将文件共享给该组时，组内的每个人都将拥有访问权限。


  要创建一个新组，只需输入以下命令：`sudo groupadd (groupname)`


  ## 修改组权限


  现在我们已经创建了一个组，让我们向它共享一个文件以实现读写访问权限。下面是一个示例，你可以查看并尝试理解我们做了什么。别担心，这些命令我们已经涵盖过了。


  ```

  touch file123

  mkdir test123

  mv file123 test123

  cd test123

  ls -l

  ```


  你猜出我们在那里做了什么吗？如果你还不清楚，让我们解释一下。


  我们首先使用 `touch` 命令创建一个名为 `file123` 的文件。接着使用 `mkdir` 命令创建一个目录，并将其命名为 `test123`。然后我们使用
  `mv` 命令将文件移动到创建的目录中。最后，我们进入新创建的目录并使用列出命令（`ls -l`）显示权限、所有者和组的信息。


  再次，强大的终端为我们节省了时间。想象一下如果没有终端要完成这些操作，完成所有这些将会花费更长时间。总之，赞美终端的话就够了；让我们继续。。


  作为测试，让我们在这里等一下，你使用 `chown` 命令将所有权更改为“组”，赋予他们读写权限。提示：如果操作不顺畅，请使用 `sudo` 命令！


  完成了吗？很好！你刚刚更改了文件的所有权，并为组提供了所需的权限。


  ## “但我们还没有向组中添加用户。”


  你说得对！这就是为什么我们的下一步是确保学习如何将用户添加到新创建的组中。为了方便起见，我们将这个组称为“learners”。


  使用以下命令在该组内添加用户：`sudo adduser (username) learners`


  如果你切换到刚刚添加到组的用户名，并尝试访问 `file123`，你也将能够毫无问题地访问它。发生这种情况的原因是我们已经允许整个组拥有该文件的所有权，并拥有查看和编辑它们的权限。现在，由于你的新用户是该组的一部分，该用户也将拥有类似的访问权限。


  为了验证，在不带 `sudo` 的情况下使用 `nano` 命令，你现在应该可以随所欲地写入和编辑文件。


  这在大型机构和行业中是常见的现象，在那里，成千上万的员工和经理被添加到组中，并被赋予对具有某些用途的文件和目录的统一访问权限。


  我们之后还将查看其他命令和示例。现在，让我们深入了解系统配置——它是什么、我们为什么需要配置系统，以及它可以为我们带来什么。这些都是你应该能够在初级水平上回答的问题。对于系统的高级用法及其配置，你可以参考优秀的书籍并浏览
  Ask Ubuntu 社区以获得进一步指导。


  ## 配置你的系统


  现在我们已经熟悉了超级用户是谁、他们做什么，以及他们如何添加和删除文件、用户等。对于超级用户来说，最重要的方面是确保系统配置得当。这意味着从最细微的细节（如时间）到维护服务器以及执行必要的任务。作为主用户，你有权输入几个命令，这些命令将立即提醒该机器或服务器上的每位用户，整个系统即将停止或将变得不可用。


  在此期间，只有你可以访问文件、目录等一切。这种方法允许你执行更新、更改文件、升级系统或进行任何维护工作。


  虽然事实如此，我们为什么要提到时间呢？服务器或机器上的每个用户都将遵循主用户设置的单一时间。每个用户遵循相同的时间是至关重要的，因为会让日志记录变得更容易。


  如果你经营一家大型机构，用户必须使用指纹登录，或者需要输入密码、修改文件、创建新文件甚至移动/删除它们，你必须能够确切知道操作是何时执行的。所有信息都可以在日志文件中供你或相关人员查看。拥有多个时间只会导致混淆，这就是为什么每个人都遵循统一的时间。然而，在这一切之前，让我们先修复我们自己机器的时间。


  在你着手并决定时间之前……（注：原文在此处突然中断）。






  | -r | 此命令将重启系统。 |

  | -k | 当说这意思是“开玩笑”时，我们并不是在搞笑。此命令会广播消息，通知其他用户计划进行维护。它并不会真的执行关机。 |

  | -c | 如果你想取消关机，可以使用此命令。 |


  我们将涵盖更多关于网络的内容，以及如何利用可用命令和工具，以确保工作执行时，每台机器都与服务器同步并采取相应的行动。除了执行维护外，你可能还会遇到系统问题。你当时不在位或离开了系统，而系统由于未知原因崩溃了。当你回来时，会对现状感到惊讶。你脑海中浮出的第一个问题将会是“发生了什么？”


  如果你是一个不知道从何下手的人，系统日志记录（system logger）就是你的最佳起点。系统日志记录负责跟踪整个系统中发生的所有事件。它会创建一个日志文件，你可以随时访问，以理解可能哪里出了问题。


  `syslog` 文件可以在 `/var/log` 目录下找到。执行该文件，你就能相应找到带有时间戳的事件、响应、错误、原因等所有相关细节。对于所有系统管理员来说，这些文件非常重要，并且在需要时必须使用它们来相应解决问题。没有这些文件，几乎不可能找到问题的根源并采取适当的行动。这些文件为你节省了时间和精力，在少数情况下，还能避免很多尴尬。如果你最终执行了所有已知的命令来纠正一个根本不存在的问题，而有人访问了这个文件揭示了问题只是一个简单的文件放错了，这对所有人来说无疑是一个巨大的震惊。


  作为一个未来将要配置系统的人，你将被要求安装、升级、更新、甚至删除文件或应用程序。我们已经知道如何做到了。事实上，我们已经对 `apt-get`、`apt-cache`
  和其他命令进行了一些练习。尽管如此，并不是所有的发行版都支持所有的文件格式。有些格式脱颖而出，因此是某些类型 Linux 发行版的独有。让我们简单看看其中一些以便建立了解。


  1. `.rpm` 文件 — 这些安装包主要由 Fedora、Red Hat、CentOS 以及其他发行版支持。基于 Debian 的发行版（如 Ubuntu）不支持这些文件。这些文件使用名为
  `yum`、`rpm` 和 `dnf` 的独立命令。

  2. `.deb` 文件 — 这些是 Debian 软件包，受所有基于 Debian 的发行版支持，包括 Ubuntu。我们已经看到这些是通过 `apt-get`
  和 `dpkg` 命令安装的。

  3. `.tar.gz` 和 `.tar.bz2` 文件 — 这些非常不同，本质上是压缩的 tar 文件。它们无法直接安装，因为它们内部包含各种文件和文件夹，使用
  `gzip` (`.gz`) 和/或 `bzip2` (`.bz2`) 压缩。与之前的两个文件不同，这些需要很多步骤才能完成安装。


  尽管由于现代安装器的存在，如今在 Linux 上安装错误类型的文件几乎是不可能的，但了解哪些文件属于哪里仍然是好的。系统配置是一项相当忙碌的任务。请放心，这只是你可能第一次感到压力。一旦大多数事情到位了，你就不会再感到保持一切对齐和更新的压力。大部分任务将由系统为你完成。万一真的出了问题，你始终可以查阅日志文件。开源操作系统的伟大之处在于，社区内的每个用户都可以轻松地帮助你解决问题，在整个
  Linux 之旅途中，你可能会掌握大量的代码和基础知识。只要掌握足够，你就能成为一名成功的系统管理员。


  ## 资源与进程


  在我们进入资源分配、进程以及允许我们深入研究这些内容的领域之前，让我们想象一个场景。我们拥有一台花钱能买到的最好的机器，它配备了顶级的规格。它拥有最好的内存、最精密的
  CPU、终极显卡，以及所有你梦想在一台真正强大的计算机上拥有的东西。某一天，你启动了一个进程，结果系统立即停止运行或开始慢得像爬一样。你能想象你将经历怎样的挫败感吗？尽管有最好的配置，你的电脑仍无法正常执行操作，而你完全不知道为什么。这种折磨足以让任何计算机用户崩溃。


  为了让我们理解为什么这种情况经常发生在最先进的机器上，我们需要更深入地研究进程的工作原理以及资源是如何供用户的。系统拥有的三个核心资源是 CPU 本身、内存和
  I/O（输入输出）。将这些中的任何一个排除在外，系统运行都不会太良好。这些被归类为硬件资源。


  另一方面，`kernel`（内核）负责无偏地将所有可用资源分配给进程。讽刺的是，`kernel` 本身是一个软件资源，帮助进程执行用户要求的各种任务。`kernel`
  与硬件资源之间的关系如果被干扰或中断，将导致系统故障。系统会有资源，但没有媒介让程序使用它。它就像是放在桌上的一杯水，却没有人喝。


  成功资源管理背后的艺术是使用一种可以实时为你提供所需信息的工具。许多程序和任务可能不会消耗大量资源，但确实有一些需要相当大量的可用资源。由于 `kernel`
  是无偏的，`kernel` 将为此类程序分配所需的资源。


  要找出到底是什么在使用你的资源、消耗了多少资源，以及进程活动了多长时间，我们使用一个名为 `top` 的命令。在你的终端中输入该命令看看会发生什么。Windows
  用户可能想起过任务管理器工具的使用。这是 Linux 对应的对应工具。屏幕上立即挤满了许多数字、名称、事实和数据。虽然你可能认为自己有足够的性能，但这个工具现在将向你展示所有资源的使用情况。让我们看看这些项目中的每一项并学习它们对应于什么。


  | 列 | 说明 |

  | :--- | :--- |

  | PID | 这是进程 ID。列出的或稍后添加的每一个进程都有一个特殊的标识符。通过这些 ID，一旦你掌握了这些工具，就可以学习如何更有效地管理进程。 |

  | USER | 这仅仅是告诉你哪个用户正在使用该进程。 |

  | PR | 此标签显示正在运行的任务的优先级。如果此字段中的任何任务显示为“rt”，则表示实时调度优先级。 |

  | NI | 这代表（我们不是在编造）相关任务的“nice”值。如果这个值为负数，任务的优先级更高。如果这个值为正数，任务的优先级较低。 |

  | VIRT | 显示该任务正在使用的虚拟内存大小。 |

  | RES | 显示任务正在使用的物理内存（非交换）。 |

  | SHR | 显示任务可用的多少共享内存。 |

  | S | 显示进程状态。此字段有进一步的选项，如下： |


  * `-D` – 不可中断的睡眠 (uninterruptible sleep)

  * `-R` – 运行中 (running)

  * `-S` – 睡眠 (sleeping)

  * `-T` – 被作业控制信号停止 (stopped by job control signal)

  * `-t` – 在跟踪期间被调试器停止 (stopped by debugger during a trace)（记住，大小写敏感）

  * `-I` – 空闲（以前为僵尸进程 Zombie）

  * `%CPU` – 显示进程占用 CPU 的百分比 |






  - `%MEM` – 显示任务占用的内存百分比

  - `TIME+` – 显示任务运行了多久

  - `COMMAND` – 显示用户可以使用什么命令访问该任务




  所有这些工具都可以为您提供可能对更好地管理系统至关重要的信息。资源在本质上是有限的。将它们用于不必要的任务或过程只会减慢其他人的速度。作为系统管理员，我们的目标是尽可能为用户保留这些资源。


  要结束或杀死任务或进程，请使用 `kill` 命令后跟进程的 `PID`。你也可以通过输入 `kill --help` 获取更多关于 `kill` 命令的信息。要退出
  `top` 命令话，请使用 `Ctrl+C`。


  还有另一个命令可以使用来列出所有进程以及它们资源利用的一些信息。它被称为 `ps aux` 命令。然而，与之前使用的 `top` 命令不同，此命令不会显示实时数据。它只会获取命令执行瞬间的可用数据。


  除了上述命令外，还有一些工具旨在为您提供关于资源如何被利用的更深层次的洞察。让我们来看其中一个例子。


  首先，我们需要在系统中安装此工具。该工具名为名为 `ATop`。在终端中输入以下命令来安装该工具：


  ```

  sudo apt-get install atop

  ```


  这将在我们的系统中安装这个极佳的工具，它将允许我们了解进程及其资源和内存使用的更细粒细节。无论你是个人用户还是维护一组用户，资源都是宝贵的，必须定期进行监控以确保进程运行顺利。如果某个进程消耗了惊人高额的资源，最好杀死该进程并为其他进程重新获取资源。


  你可以通过以下方式使用 `man` 命令学习更多关于该工具的知识：


  ```bash

  man atop

  ```


  这将向你显示 `ATop` 工具的完整说明手册。它将为你提供所有已知和使用的命令以及每条命令的描述。这是一份非常实用的指南。要退出手册，只需输入 `q`。要访问该工具，输入以下命令来启动监控工具：


  ```

  atop

  ```


  你现在应该能够看到列表，其中 `top` 或 `ps aux` 对应项未显示的内容。这使得用户和管理员的决策变得容易得多。若要获得更深层次的洞察，你可以使用手册查找相关命令，或使用
  `man -h` 命令获取更多命令。


  `ATop` 工具通常是大多数程序员、用户和管理员的首选工具，因为该工具允许获取其他可能很难获取的广泛信息。如果你想找出特定程序使用了多少资源，其他对应项可能
  true 也可能不告诉你，但 `ATop` 将为你提供特定程序正在使用的进程和资源的完整列表。


  此类工具极大地允许你监控资源，从更好的水平理解你的系统性能，并允许你控制资源分配。虽然自动向进程分配和调配资源是内核的工作，但你仍然可以介入并停止甚至杀死可能占用了不必要的过多可用资源的进程，以节省系统性能。


  Ubuntu 商店和仓库包含许多优秀的工具。如果你不习惯使用 `ATop` 资源监控工具，你可以在网上找到更多关于这些工具的信息。然而，并非所有工具都能交付你预期的结果，这就是为什么强烈推荐
  `ATop` 工具。


  虽然上述内容仅监控 CPU 和内存，除了 `ATop` 外，你有时可能想监控计算机的 I/O 级别。要做到这一点，你需要首先安装 `sysstat` 工具。我们已经知道如何做到了。完成后，你可以使用以下命令：


  ```bash

  iostat

  ```


  此命令允许你查看系统内部并在任何给定点查看通用 I/O 统计数据。你可以不带选项运行此命令，命令将向你显示必要的信息。然而，如果你想深入了解，可以随时通过 `man`
  前缀查看 `iostat` 命令的手册。


  这些工具允许用户完全访问信息并为他们提供洞察。通过这些统计数据，我们可以更有效地管理系统，而不仅仅是尝试添加 RAM 模块，或尝试投入一笔巨钱购买一台新的升级机器。机器规格确实很重要，但总有一些进程，如果置不理，即使是地球上最快的机器也会崩溃。


  一个成功的组织将确保其 IT 部门为所有计算机用户确保一切风顺。一个成功的系统管理员将使用所有这些工具，确切理解需要做什么，并相应地利用资源。管理员还将确保任何有害或不必要的进程被杀死，并确保用户资源始终对其及其进程可用。系统配置和管理是一个非常庞大的话题，仅通过一两个章节无法涵盖。我们的努力是确保只提供基础知识，允许用户开始探索系统，并对进程如何工作、内核如何利用资源等建立基本的理解。


  话虽如此，我们现在改变节奏，在下一章进入更具技术性的网络领域。


  ## 第五章：了解你的网络配置


  在本章中，我们将研究网络的基础知识。我们将学习如何有效地将文件从网络的一端传输到另一端，并学习一些你可以用来进一步提高生产力的网络应用。


  在跳入网络世界之前，理解网络是一个非常庞大的话题至关重要。不可否认，网络需要广泛的知识才能完全理解这些概念和过程。尽管如此，我们将尝试留在基础阶段，涵盖每个人都必须知道的方面。目标是为用户提供足够的知识，以便在网络中查看并能够管理他们自己的小型网络。为了获取更高级的材料和参考，你始终可以查阅
  Ubuntu 社区来帮助解决你可能遇到的任何 Linux 相关问题。许多其他媒介可以让你找到关于网络的信息，但几乎所有内容都需要你对某些概念有基本的理解。让我们从章节开始，看看网络是什么以及它是如何工作的。


  ### 网络：基础


  很久以前，互联网被一些人视为魔法。那些完全不知道互联网如何运作的人对此感到惊讶。输入任何内容，神奇地你就会得到结果。随着时间的推移，意识出现了并填补了空白。现在，大多数连接到网络的人了解服务器、网络协议地址和路由器。老实说，这些是网络非常重要的方面。这是一个很好的开始，但我们需要学习比路由器和服务器更多的内容。我们需要知道它们是如何生存的、如何被管理的、如何被升级的等等。为了让我们理解网络和网络，我们必须忘记现在。为什么？有些这些概念是非常基础的，但我们需要确保首先建立良好的理解，之后我们可以带上这些知识并将其应用到
  Linux 中。


  IP 地址通常被称为网络协议 (IP) 地址。`1.1.1.1`。这种格式支持的最大范围是 `255.255.255.255`。虽然组合极多，但它们还不足以支持所有连接到互联网的机器。在十多年来，互联网一直处于挣扎状态，因为
  IP 地址持续匮乏。各种解决方案已经出现，以确保这种情况不再发生。让我们回到我们和我们小家的例子。假设我们有四个设备连接到路由器。家用路由器会为你提供如下 IP：


  ```

  192.168.0.1

  192.168.0.2

  192.168.0.3

  192.168.0.4

  ```


  这看起来似乎没问题；事实是 ISP 只为我们提供了一个 IP，而这些中一个都不匹配。那个地址与我们路由器的地址完全不同。这意味着这四个 IP 地址对于 ISP
  和互联网来说仍然显示为一个。你能看到这会引起什么混乱吗？你决定浏览 Google 或 Yahoo，而你家里更多的人连接到其他网页。互联网将为你的 ISP 提供结果，结果将推送到路由器，每个人都会得到相同的页面。


  让我们深入查看这里，看看这些隐藏元素是如何运行的，以确保我们能够访问互联网并获取我们需要的信息。你的计算机或计算机设备连接到调制调器/路由器。假设你想访问喜欢的搜索引擎。你打开浏览器并输入该搜索引擎的网址。数据由你的浏览器转发到路由器。路由器随后将此信息发送给你的
  ISP。一旦你的 ISP 接收到这些信息，它将使用该信息通过域名系统 (DNS) 服务器进行路由。该服务器分析你从机器发送的字符串（文本），将其与记录匹配，然后向你的机器提供适当的内容。


  这里需要注意的有趣点是，这些巨大的 DNS 服务器并不理解相同的语言。我们发送的所有信息都被转换为 0 和 1，机器可以轻松理解。当相同的信息呈现在我们的屏幕上时，它被转换为有意义的字符和字母。假设你想输入
  Google 的网址。对我们来说，它将是 `http://www.google.com/` 或 `https://www.google.com/`，但对互联网来说，它完全不同。所有这些机器都以连接的方式工作，每个机器都相互依赖来接收、理解和产生终端用户的需求。


  ### 使用网络传输文件


  这可能没有你想象的那么困难。它需要一些练习和对网络的基本理解。这些工具允许用户完全访问信息并为他们提供洞察。通过这些统计数据，我们可以更有效地管理系统，而不仅仅是尝试添加
  RAM 模块，或尝试投入一笔巨钱购买一台新的升级机器。机器规格确实很重要，但总有一些进程，如果置不理，即使是地球上最快的机器也会崩溃。


  上述数据显示每个序列的响应时间。统计数据显示数据包的发送、接收和丢失 (%) 以及时间。当你遇到潜在的网络相关问题时，这些信息至关重要。你可以随时通过 `Ctrl+C`
  停止进程。`ping` 命令检查网站是否可访问。要运行它，输入 `ping` 命令：


  ```bash

  ping google.com

  ```


  输出看起来如下：


  ```

  PING google.com (142.250.190.46) 56(84) bytes of data

  64 bytes from 142.250.190.46: icmp_seq=0 ttl=117 time=12.1 ms

  64 bytes from 142.250.190.46: icmp_seq=1 ttl=117 time=11.8 ms

  64 bytes from 142.250.190.46: icmp_seq=2 ttl=117 time=12.5 ms

  64 bytes from 142.250.190.46: icmp_seq=3 ttl=117 time=12.2 ms


  --- google.com ping statistics ---

  4 transmitted, 4 received, 0% packet loss, time 3004ms

  rtt min/avg/max/mdev = 11.8/12.1/12.5/0.3 ms

  ```


  接下来，使用 `ifconfig` 命令查看你的网络接口设置：


  ```bash

  ifconfig

  ```


  这向向显示了所有设备的使用情况。要查看路由表，使用 `netstat -nr` 命令：


  ```bash

  netstat -nr

  ```


  要查看接口统计，使用 `netstat -i` 命令：


  ```bash

  netstat -i

  ```


  最后，要找出正在使用哪些活动套接字，使用 `netstat -ta` 命令：


  ```bash

  netstat -ta

  ```


  这列出了活动活动的地址（本地和远程）、状态以及其他有用信息。这种信息对于任何维护整个网络安全的人来说都非常重要。`netstat` 命令用于监控活动连接并帮助你阻止任何可能为黑客和恶意软件提供入口的意外或可疑连接。你还可以跟踪所有发送和接收的数据包。这个命令总是大多数系统管理员的首选。


  ### Secure Shell (SSH)


  当你的网络参与并连接到各种设备，它们都试图访问并获取或提供信息时，需要某些东西来监控这里的安全性。这就是 Secure Shell (SSH) 发挥作用的地方。在
  SSH 出现之前，有 `Telnet`。这最初被视为一种革命，一个人可以在不在现场的情况下访问另一台远程机器。这引起了许多人的注意，包括一些窥视者。很快，人们意识到这些方法是不安全的，任何人都可能“窃听”他们的交流。`SSH`
  做了 `Telnet` 未能做到的：它加密了你会话的所有数据。它还允许任何操作系统在不必担心窥视的情况下安全地传输文件和文件夹。理解 `SSH` 不是一个一天的工作，甚至不是一本书的事。这些是高级水平，因此并不适合新手。


  ### 网络应用程序


  有很多命令和诊断工具可以帮助你作为网络专家或用户的旅程。了解这些至关重要，并且可以保护你免受可疑连接的影响。我们要学习的第一件可能是熟悉的 `ping` 命令。它检查网站是否可达。要运行它，输入
  `ping` 命令：


  ```bash

  ping google.com

  ```

  （输出同上）


  ## 第六章：Shell、脚本和工具


  首先，我们需要在系统中安装此工具。该工具名为 `ATop`。在终端中输入以下命令来安装该工具：


  ```bash

  sudo apt-get install atop

  ```


  这将在我们的系统中安装这个极佳的工具，它将允许我们了解进程及其资源和内存使用的更细粒细节。无论你是个人用户还是维护一组用户，资源都是宝贵的，必须定期进行监控以确保进程运行顺利。如果某个进程消耗了惊人高额的资源，最好杀死该进程并为其他进程重新获取资源。


  你可以通过以下方式使用 `man` 命令学习更多关于该工具的知识：


  ```bash

  man atop

  ```


  这将向你显示 `ATop` 工具的完整说明手册。它将为你提供所有已知和使用的命令以及每条命令的描述。这是一份非常实用的指南。要退出手册，只需输入 `q`。要访问该工具，输入以下命令来启动监控工具：


  ```

  atop

  ```


  你现在能够看到列表，其中 `top` 或 `ps aux` 对应项未显示的内容。这使得用户和管理员的决策变得容易得多。若要获得更深层次的洞察，你可以使用手册查找相关命令，或使用
  `man -h` 命令获取更多命令。


  `ATop` 工具通常是大多数程序员、用户和管理员的首选工具，因为该工具允许获取其他可能很难获取的广泛信息。如果你想找出特定程序使用了多少资源，其他对应项可能
  true 也可能不告诉你，但 `ATop` 将为你提供特定程序正在使用的进程和资源的完整列表。


  此类工具极大地允许你监控资源，从更好的水平理解你的系统性能，并允许你控制资源分配。虽然自动向进程分配和调配资源是内核的工作，但你仍然可以介入并停止甚至杀死可能占用了不必要的过多可用资源的进程，以节省系统性能。


  Ubuntu 商店和仓库包含许多优秀的工具。如果你不习惯使用 `ATop` 资源监控工具，你可以在网上找到更多关于这些工具的信息。然而，并非所有工具都能交付你预期的结果，这就是为什么强烈推荐
  `ATop` 工具。


  上述内容仅监控 CPU 和内存，除了 `ATop` 外，你有时可能监控计算机的 I/O 级别。要做到这一点，你需要首先安装 `sysstat` 工具。我们已经知道如何做到了。完成后，你可以使用以下命令：


  ```bash

  iostat

  ```


  此命令允许你查看系统内部并在任何给定点查看通用 I/O 统计数据。你可以不带选项运行此命令，命令将向你显示必要的信息。然而，如果你想深入了解，可以随时通过 `man`
  前缀查看 `iostat` 命令的手册。


  这些工具允许用户完全访问信息并为他们提供洞察。通过这些统计数据，我们可以更有效地管理系统，而不仅仅是尝试添加 RAM 模块，或尝试投入一笔巨钱购买一台新的升级机器。机器规格确实很重要，但总有一些进程，如果置不理，即使是地球上最快的机器也会崩溃。


  一个成功的组织将确保其 IT 部门为所有计算机用户确保一切风顺。一个成功的系统管理员将使用所有这些工具，确切理解需要做什么，并相应地利用资源。管理员还将确保任何有害或不必要的进程被杀死，并确保用户资源始终对其及其进程可用。系统配置和管理是一个非常庞大的话题，仅通过一两个章节无法涵盖。我们的努力是确保只提供基础知识，允许用户开始探索系统，并对进程如何工作、内核如何利用资源等建立基本的理解。


  话虽如此，我们现在改变节奏，在下一章进入更具技术性的网络领域。


  ## 第五章：了解你的网络配置


  在本章中，我们将研究网络的基础知识。我们将学习如何有效地将文件从网络的一端传输到另一端，并学习一些你可以用来进一步提高生产力的网络应用。


  在跳入网络世界之前，理解网络是一个非常庞大的话题至关重要。不可否认，网络需要广泛的知识才能完全理解这些概念和过程。尽管如此，我们将尝试留在基础阶段，涵盖每个人都必须知道的方面。目标是为用户提供足够的知识，以便在网络中查看并能够管理他们自己的小型网络。为了获取更高级的材料和参考，你始终可以查阅
  Ubuntu 社区来帮助解决你可能遇到的任何 Linux 相关问题。许多其他媒介可以让你找到关于网络的信息，但几乎所有内容都需要你对某些概念有基本的理解。让我们从章节开始，看看网络是什么以及它是如何工作的。


  ### 网络：基础


  很久以前，互联网被一些人视为魔法。那些完全不知道互联网如何运作的人对此感到惊讶。输入任何内容，神奇地你就会得到结果。随着时间的推移，意识出现了并填补了空白。现在，大多数连接到网络的人了解服务器、网络协议地址和路由器。老实说，这些是网络非常重要的方面。这是一个很好的开始，但我们需要学习比路由器和服务器更多的内容。我们需要知道它们是如何生存的、如何被管理的、如何被升级的等等。为了让我们理解网络和网络，我们必须忘记现在。为什么？有些这些概念是非常基础的，但我们需要确保首先建立良好的理解，之后我们可以带上这些知识并将其应用到
  Linux 中。


  IP 地址通常被称为网络协议 (IP) 地址。`1.1.1.1`。这种格式支持的最大范围是 `255.255.255.255`。虽然组合极多，但它们还不足以支持所有连接到互联网的机器。在十多年来，互联网一直处于挣扎状态，因为
  IP 地址持续匮乏。各种解决方案已经出现，以确保这种情况不再发生。让我们回到我们和我们小家的例子。假设我们有四个设备连接到路由器。家用路由器会为你提供如下 IP：


  ```

  192.168.0.1

  192.168.0.2

  192.168.0.3

  192.168.0.4

  ```


  这看起来似乎没问题；事实是 ISP 只为我们提供了一个了一个 IP，而这些中一个都不匹配。那个地址与我们路由器的地址完全不同。这意味着这四个 IP 地址对于 ISP
  和互联网来说仍然显示为一个。你能看到这会引起什么混乱吗？你决定浏览 Google 或 Yahoo，而你家里更多的人连接到其他网页。互联网将为你的 ISP 提供结果，结果将推送到路由器，每个人都会得到相同的页面。一旦你的
  ISP 接收到这些信息，它将使用该信息通过域名系统 (DNS) 服务器进行路由。该服务器分析你从机器发送的字符串（文本），将其与记录匹配，然后向你的机器提供适当的内容。


  这里需要注意的有趣点是，这些巨大的 DNS 服务器并不理解相同的语言。我们发送的所有信息都被转换为 0 和 1，机器可以轻松理解。当相同的信息呈现在我们的屏幕上时，它被转换为有意义的字符和字母。假设你想输入
  Google 的网址。对我们来说，它将是 `http://www.google.com/` 或 `https://www.google.com/`，但对互联网来说，它完全不同。所有这些机器都以连接的方式工作，每个机器都相互依赖来接收、理解和产生终端用户的需求。


