    现在，尝试破解我们上面的示例并找出我们拥有哪些权限。你也可以使用 `ls -l` 命令来查看自己的目录并发现更多信息。尽管如此，让我们继续另一个有用的 `ls`
    命令。你可能会在想：“我难道每次都要花这么多时间来破解文件类型吗？”这是一个非常合理的问题，但不必！终端已经为你解决了这个问题。如果你不太确定，或者倾向于忘记“d”代表目录（directory）而横杠“-”代表文件（file），我们还有另一个命令可以将工作目录中的所有内容按类型进行组织。


    `ls -p`


    此命令现在将显示所有文件和文件夹，它们带有名称和扩展名，或者带有一个正斜杠 `/`。带有扩展名的是文件，而带有正斜杠的是你的目录。非常简单，不是吗？当你准备就绪后，输入以下命令：


    ```

    ls -l samplefile

    ls -ld sampledirectory

    ```


    这里的第一个示例向你展示特定文件的权限。第二个示例也是一样，但现在得到的不是文件信息，而是我们所选文件夹或目录的信息。`samplefile` 和 `sampledirectory`
    仅用于说明。在你的情况下，选择任何你想在此使用的文件夹或文件。手头这些这些会对你非常有帮助。在未来的某个，你可能需要找出授予所有者、组或系统上任何其他用户的权限。你应该知道如何找到这些信息、对其进行解码，并在需要时进行修改，以进一步增强这些文件和目录的安全性，防止肉眼窥探。


    如果你想根据文件大小来列出列表怎么办？嗯，我们也有对应的命令：


    `ls -s`


    这将排序所有内容并根据大小列出文件和文件夹。现在让我们在列出命令上更进一步，稍微改变一下场景。假设我们只是觉得有点懒，不想进入特定目录并在那里运行列出命令。是否有办法可以在我们不进入那里的情况下找到该目标目录的内容呢？幸运的是，可以！无论你的工作目录是什么，都可以使用下面的命令获取该目录内所有可用文件和文件夹的列表。在这种情况下，我们的目标是
    `/usr/share/applications`：


    ```

    ls /usr/share/applications

    ```


    这将为我们提供上述目录中内容的列表，即使我们处于桌面工作目录。然而，你可能注意到了一点——一切看起来都有点拥挤。空间太小，要读的内容太多。让我们用一个快速命令来解决这个问题：


    `clear`


    现在，终端有空间呼吸了，看起来更好了。别担心，没有任何条目被删除，因为你仍然可以通过向上滚动来访问它们。很多人第一次看到时往往会担心。最后，给每个人一个额外的列出命令作为奖励。如果你想访问所有可能的“ls”命令，只需随时输入以下命令，你将看到所有可能的
    `ls` 命令及其参数以及它们的描述：


    ```

    ls --help

    ```


    尽管如此，是时候告别列出命令了，让我们向前查看一些你应该知道的其他基本命令。有成千上万条命令供你进入和探索；然而，我们试图只列出那些构成基础并为你提供基础知识的命令。你想要进一步掌握哪些命令取决于你自己。


    在不久前的过去，我们遇到了另一个看起来与我们这里讨论的大部分内容略不同的命令。如果你忘记了，涉及的命令如下：


    ```

    sudo apt-get install gnome-tweak-tool

    ```


    我们现在知道 `sudo` 是授予用户管理员权限以便在终端上执行上述命令的。那么 `apt-get` 和 `install` 呢？这是 Ubuntu 和基于
    Debian 的发行版的包管理器。它被称为 Aptitude。`apt-get` 是一个负责通过 Linux 命令行界面（CLI）安装或删除软件和应用程序的应用。这既快速又安全，让你完全控制安装过程。


    `apt-get` 命令后面跟着一个动作。在上面的例子中，我们使用 `install` 作为动作。如果你想删除一个程序，可以将动作替换为 `remove`。动作之后是应用程序的名称。这些应用程序包和索引存储在终端访问的
    Ubuntu 仓库中。在执行命令之前，务必确保你知道想要哪个应用程序，因为你需要使用精确的名称和大小写，命令才能正常工作。


    你可以使用下例示例来下载一个名为 Bluefish 的简单文本编辑器：


    ```

    sudo apt-get install bluefish

    ```


    系统会要求你输入密码。记住，在输入密码时，终端不会显示任何点或星号。完成后，按回车，系统将询问你是否想要继续下载并安装所需的包。输入“Y”并按回车继续。最终，你现在应该已经在系统中安装了
    Bluefish。


    由于这是一个示例，而且我们书的任何部分都不需要 Bluefish，让我们检查一下卸载此程序的命令。打开终端并输入以下命令来卸载程序：


    ```

    sudo apt-get remove bluefish

    ```


    在友好的“是或否”选择之后，Bluefish 将为你移除。就是这么简单。

    '
