    所有这些工具都可以为您提供可能对更好地管理系统至关重要的信息。资源在本质上是有限的。将它们用于不必要的任务或过程只会减慢其他人的速度。作为系统管理员，我们的目标是尽可能为用户保留这些资源。


    要结束或杀死任务或进程，请使用 `kill` 命令后跟进程的 `PID`。你也可以通过输入 `kill --help` 获取更多关于 `kill` 命令的信息。要退出
    `top` 命令话，请使用 `Ctrl+C`。


    还有另一个命令可以使用来列出所有进程以及它们资源利用的一些信息。它被称为 `ps aux` 命令。然而，与之前使用的 `top` 命令不同，此命令不会显示实时数据。它只会获取命令执行瞬间的可用数据。


    除了上述命令外，还有一些工具旨在为您提供关于资源如何被利用的更深层次的洞察。让我们来看其中一个例子。


    首先，我们需要在系统中安装此工具。该工具名为名为 `ATop`。在终端中输入以下命令来安装该工具：


    ```

    sudo apt-get install atop

    ```


    这将在我们的系统中安装这个极佳的工具，它将允许我们了解进程及其资源和内存使用的更细粒细节。无论你是个人用户还是维护一组用户，资源都是宝贵的，必须定期进行监控以确保进程运行顺利。如果某个进程消耗了惊人高额的资源，最好杀死该进程并为其他进程重新获取资源。


    你可以通过以下方式使用 `man` 命令学习更多关于该工具的知识：


    ```bash

    man atop

    ```


    这将向你显示 `ATop` 工具的完整说明手册。它将为你提供所有已知和使用的命令以及每条命令的描述。这是一份非常实用的指南。要退出手册，只需输入 `q`。要访问该工具，输入以下命令来启动监控工具：


    ```

    atop

    ```


    你现在应该能够看到列表，其中 `top` 或 `ps aux` 对应项未显示的内容。这使得用户和管理员的决策变得容易得多。若要获得更深层次的洞察，你可以使用手册查找相关命令，或使用
    `man -h` 命令获取更多命令。


    `ATop` 工具通常是大多数程序员、用户和管理员的首选工具，因为该工具允许获取其他可能很难获取的广泛信息。如果你想找出特定程序使用了多少资源，其他对应项可能
    true 也可能不告诉你，但 `ATop` 将为你提供特定程序正在使用的进程和资源的完整列表。


    此类工具极大地允许你监控资源，从更好的水平理解你的系统性能，并允许你控制资源分配。虽然自动向进程分配和调配资源是内核的工作，但你仍然可以介入并停止甚至杀死可能占用了不必要的过多可用资源的进程，以节省系统性能。


    Ubuntu 商店和仓库包含许多优秀的工具。如果你不习惯使用 `ATop` 资源监控工具，你可以在网上找到更多关于这些工具的信息。然而，并非所有工具都能交付你预期的结果，这就是为什么强烈推荐
    `ATop` 工具。


    虽然上述内容仅监控 CPU 和内存，除了 `ATop` 外，你有时可能想监控计算机的 I/O 级别。要做到这一点，你需要首先安装 `sysstat` 工具。我们已经知道如何做到了。完成后，你可以使用以下命令：


    ```bash

    iostat

    ```


    此命令允许你查看系统内部并在任何给定点查看通用 I/O 统计数据。你可以不带选项运行此命令，命令将向你显示必要的信息。然而，如果你想深入了解，可以随时通过
    `man` 前缀查看 `iostat` 命令的手册。


    这些工具允许用户完全访问信息并为他们提供洞察。通过这些统计数据，我们可以更有效地管理系统，而不仅仅是尝试添加 RAM 模块，或尝试投入一笔巨钱购买一台新的升级机器。机器规格确实很重要，但总有一些进程，如果置不理，即使是地球上最快的机器也会崩溃。


    一个成功的组织将确保其 IT 部门为所有计算机用户确保一切风顺。一个成功的系统管理员将使用所有这些工具，确切理解需要做什么，并相应地利用资源。管理员还将确保任何有害或不必要的进程被杀死，并确保用户资源始终对其及其进程可用。系统配置和管理是一个非常庞大的话题，仅通过一两个章节无法涵盖。我们的努力是确保只提供基础知识，允许用户开始探索系统，并对进程如何工作、内核如何利用资源等建立基本的理解。


    话虽如此，我们现在改变节奏，在下一章进入更具技术性的网络领域。


    # 第五章：了解你的网络配置


    在本章中，我们将研究网络的基础知识。我们将学习如何有效地将文件从网络的一端传输到另一端，并学习一些你可以用来进一步提高生产力的网络应用。


    在跳入网络世界之前，理解网络是一个非常庞大的话题至关重要。不可否认，网络需要广泛的知识才能完全理解这些概念和过程。尽管如此，我们将尝试留在基础阶段，涵盖每个人都必须知道的方面。目标是为用户提供足够的知识，以便在网络中查看并能够管理他们自己的小型网络。为了获取更高级的材料和参考，你始终可以查阅
    Ubuntu 社区来帮助解决你可能遇到的任何 Linux 相关问题。许多其他媒介可以让你找到关于网络的信息，但几乎所有内容都需要你对某些概念有基本的理解。让我们从章节开始，看看网络是什么以及它是如何工作的。


    ## 网络：基础


    很久以前，互联网被一些人视为魔法。那些完全不知道互联网如何运作的人对此感到惊讶。输入任何内容，神奇地你就会得到结果。随着时间的推移，意识出现了并填补了空白。现在，大多数连接到网络的人了解服务器、网络协议地址和路由器。老实说，这些是网络非常重要的方面。这是一个很好的开始，但我们需要学习比路由器和服务器更多的内容。我们需要知道它们是如何生存的、如何被管理的、如何被升级的等等。为了让我们理解网络和网络，我们必须忘记现在。为什么？有些这些概念是非常基础的，但我们需要确保首先建立良好的理解，之后我们可以带上这些知识并将其应用到
    Linux 中。


    IP 地址通常被称为网络协议 (IP) 地址。`1.1.1.1`。这种格式支持的最大范围是 `255.255.255.255`。虽然组合极多，但它们还不足以支持所有连接到互联网的机器。在十多年来，互联网一直处于挣扎状态，因为
    IP 地址持续匮乏。各种解决方案已经出现，以确保这种情况不再发生。让我们回到我们和我们小家的例子。假设我们有四个设备连接到路由器。家用路由器会为你提供如下
    IP：


    ```

    192.168.0.1

    192.168.0.2

    192.168.0.3

    192.168.0.4

    ```


    这看起来似乎没问题；事实是 ISP 只为我们提供了一个 IP，而这些中一个都不匹配。那个地址与我们路由器的地址完全不同。这意味着这四个 IP 地址对于 ISP
    和互联网来说仍然显示为一个。你能看到这会引起什么混乱吗？你决定浏览 Google 或 Yahoo，而你家里更多的人连接到其他网页。互联网将为你的 ISP 提供结果，结果将推送到路由器，每个人都会得到相同的页面。


    让我们深入查看这里，看看这些隐藏元素是如何运行的，以确保我们能够访问互联网并获取我们需要的信息。你的计算机或计算机设备连接到调制调器/路由器。假设你想访问喜欢的搜索引擎。你打开浏览器并输入该搜索引擎的网址。数据由你的浏览器转发到路由器。路由器随后将此信息发送给你的
    ISP。一旦你的 ISP 接收到这些信息，它将使用该信息通过域名系统 (DNS) 服务器进行路由。该服务器分析你从机器发送的字符串（文本），将其与记录匹配，然后向你的机器提供适当的内容。


    这里需要注意的有趣点是，这些巨大的 DNS 服务器并不理解相同的语言。我们发送的所有信息都被转换为 0 和 1，机器可以轻松理解。当相同的信息呈现在我们的屏幕上时，它被转换为有意义的字符和字母。假设你想输入
    Google 的网址。对我们来说，它将是 `http://www.google.com/` 或 `https://www.google.com/`，但对互联网来说，它完全不同。所有这些机器都以连接的方式工作，每个机器都相互依赖来接收、理解和产生终端用户的需求。


    ## 使用网络传输文件


    这可能没有你想象的那么困难。它需要一些练习和对网络的基本理解。这些工具允许用户完全访问信息并为他们提供洞察。通过这些统计数据，我们可以更有效地管理系统，而不仅仅是尝试添加
    RAM 模块，或尝试投入一笔巨钱购买一台新的升级机器。机器规格确实很重要，但总有一些进程，如果置不理，即使是地球上最快的机器也会崩溃。


    上述数据显示每个序列的响应时间。统计数据显示数据包的发送、接收和丢失 (%) 以及时间。当你遇到潜在的网络相关问题时，这些信息至关重要。你可以随时通过 `Ctrl+C`
    停止进程。`ping` 命令检查网站是否可访问。要运行它，输入 `ping` 命令：


    ```bash

    ping google.com

    ```


    输出看起来如下：


    ```

    PING google.com (142.250.190.46) 56(84) bytes of data

    64 bytes from 142.250.190.46: icmp_seq=0 ttl=117 time=12.1 ms

    64 bytes from 142.250.190.46: icmp_seq=1 ttl=117 time=11.8 ms

    64 bytes from 142.250.190.46: icmp_seq=2 ttl=117 time=12.5 ms

    64 bytes from 142.250.190.46: icmp_seq=3 ttl=117 time=12.2 ms


    --- google.com ping statistics ---

    4 transmitted, 4 received, 0% packet loss, time 3004ms

    rtt min/avg/max/mdev = 11.8/12.1/12.5/0.3 ms

    ```


    接下来，使用 `ifconfig` 命令查看你的网络接口设置：


    ```bash

    ifconfig

    ```


    这向向显示了所有设备的使用情况。要查看路由表，使用 `netstat -nr` 命令：


    ```bash

    netstat -nr

    ```


    要查看接口统计，使用 `netstat -i` 命令：


    ```bash

    netstat -i

    ```


    最后，要找出正在使用哪些活动套接字，使用 `netstat -ta` 命令：


    ```bash

    netstat -ta

    ```


    这列出了活动活动的地址（本地和远程）、状态以及其他有用信息。这种信息对于任何维护整个网络安全的人来说都非常重要。`netstat` 命令用于监控活动连接并帮助你阻止任何可能为黑客和恶意软件提供入口的意外或可疑连接。你还可以跟踪所有发送和接收的数据包。这个命令总是大多数系统管理员的首选。


    ## Secure Shell (SSH)


    当你的网络参与并连接到各种设备，它们都试图访问并获取或提供信息时，需要某些东西来监控这里的安全性。这就是 Secure Shell (SSH) 发挥作用的地方。在
    SSH 出现之前，有 `Telnet`。这最初被视为一种革命，一个人可以在不在现场的情况下访问另一台远程机器。这引起了许多人的注意，包括一些窥视者。很快，人们意识到这些方法是不安全的，任何人都可能“窃听”他们的交流。`SSH`
    做了 `Telnet` 未能做到的：它加密了你会话的所有数据。它还允许任何操作系统在不必担心窥视的情况下安全地传输文件和文件夹。理解 `SSH` 不是一个一天的工作，甚至不是一本书的事。这些是高级水平，因此并不适合新手。


    ## 网络应用程序


    有很多命令和诊断工具可以帮助你作为网络专家或用户的旅程。了解这些至关重要，并且可以保护你免受可疑连接的影响。我们要学习的第一件可能是熟悉的 `ping` 命令。它检查网站是否可达。要运行它，输入
    `ping` 命令：


    ```bash

    ping google.com

    ```

    （输出同上）


    # 第六章：Shell、脚本和工具


    首先，我们需要在系统中安装此工具。该工具名为 `ATop`。在终端中输入以下命令来安装该工具：


    ```bash

    sudo apt-get install atop

    ```


    这将在我们的系统中安装这个极佳的工具，它将允许我们了解进程及其资源和内存使用的更细粒细节。无论你是个人用户还是维护一组用户，资源都是宝贵的，必须定期进行监控以确保进程运行顺利。如果某个进程消耗了惊人高额的资源，最好杀死该进程并为其他进程重新获取资源。


    你可以通过以下方式使用 `man` 命令学习更多关于该工具的知识：


    ```bash

    man atop

    ```


    这将向你显示 `ATop` 工具的完整说明手册。它将为你提供所有已知和使用的命令以及每条命令的描述。这是一份非常实用的指南。要退出手册，只需输入 `q`。要访问该工具，输入以下命令来启动监控工具：


    ```

    atop

    ```


    你现在能够看到列表，其中 `top` 或 `ps aux` 对应项未显示的内容。这使得用户和管理员的决策变得容易得多。若要获得更深层次的洞察，你可以使用手册查找相关命令，或使用
    `man -h` 命令获取更多命令。


    `ATop` 工具通常是大多数程序员、用户和管理员的首选工具，因为该工具允许获取其他可能很难获取的广泛信息。如果你想找出特定程序使用了多少资源，其他对应项可能
    true 也可能不告诉你，但 `ATop` 将为你提供特定程序正在使用的进程和资源的完整列表。


    此类工具极大地允许你监控资源，从更好的水平理解你的系统性能，并允许你控制资源分配。虽然自动向进程分配和调配资源是内核的工作，但你仍然可以介入并停止甚至杀死可能占用了不必要的过多可用资源的进程，以节省系统性能。


    Ubuntu 商店和仓库包含许多优秀的工具。如果你不习惯使用 `ATop` 资源监控工具，你可以在网上找到更多关于这些工具的信息。然而，并非所有工具都能交付你预期的结果，这就是为什么强烈推荐
    `ATop` 工具。


    上述内容仅监控 CPU 和内存，除了 `ATop` 外，你有时可能监控计算机的 I/O 级别。要做到这一点，你需要首先安装 `sysstat` 工具。我们已经知道如何做到了。完成后，你可以使用以下命令：


    ```bash

    iostat

    ```


    此命令允许你查看系统内部并在任何给定点查看通用 I/O 统计数据。你可以不带选项运行此命令，命令将向你显示必要的信息。然而，如果你想深入了解，可以随时通过
    `man` 前缀查看 `iostat` 命令的手册。


    这些工具允许用户完全访问信息并为他们提供洞察。通过这些统计数据，我们可以更有效地管理系统，而不仅仅是尝试添加 RAM 模块，或尝试投入一笔巨钱购买一台新的升级机器。机器规格确实很重要，但总有一些进程，如果置不理，即使是地球上最快的机器也会崩溃。


    一个成功的组织将确保其 IT 部门为所有计算机用户确保一切风顺。一个成功的系统管理员将使用所有这些工具，确切理解需要做什么，并相应地利用资源。管理员还将确保任何有害或不必要的进程被杀死，并确保用户资源始终对其及其进程可用。系统配置和管理是一个非常庞大的话题，仅通过一两个章节无法涵盖。我们的努力是确保只提供基础知识，允许用户开始探索系统，并对进程如何工作、内核如何利用资源等建立基本的理解。


    话虽如此，我们现在改变节奏，在下一章进入更具技术性的网络领域。


    # 第五章：了解你的网络配置


    在本章中，我们将研究网络的基础知识。我们将学习如何有效地将文件从网络的一端传输到另一端，并学习一些你可以用来进一步提高生产力的网络应用。


    在跳入网络世界之前，理解网络是一个非常庞大的话题至关重要。不可否认，网络需要广泛的知识才能完全理解这些概念和过程。尽管如此，我们将尝试留在基础阶段，涵盖每个人都必须知道的方面。目标是为用户提供足够的知识，以便在网络中查看并能够管理他们自己的小型网络。为了获取更高级的材料和参考，你始终可以查阅
    Ubuntu 社区来帮助解决你可能遇到的任何 Linux 相关问题。许多其他媒介可以让你找到关于网络的信息，但几乎所有内容都需要你对某些概念有基本的理解。让我们从章节开始，看看网络是什么以及它是如何工作的。


    ## 网络：基础


    很久以前，互联网被一些人视为魔法。那些完全不知道互联网如何运作的人对此感到惊讶。输入任何内容，神奇地你就会得到结果。随着时间的推移，意识出现了并填补了空白。现在，大多数连接到网络的人了解服务器、网络协议地址和路由器。老实说，这些是网络非常重要的方面。这是一个很好的开始，但我们需要学习比路由器和服务器更多的内容。我们需要知道它们是如何生存的、如何被管理的、如何被升级的等等。为了让我们理解网络和网络，我们必须忘记现在。为什么？有些这些概念是非常基础的，但我们需要确保首先建立良好的理解，之后我们可以带上这些知识并将其应用到
    Linux 中。


    IP 地址通常被称为网络协议 (IP) 地址。`1.1.1.1`。这种格式支持的最大范围是 `255.255.255.255`。虽然组合极多，但它们还不足以支持所有连接到互联网的机器。在十多年来，互联网一直处于挣扎状态，因为
    IP 地址持续匮乏。各种解决方案已经出现，以确保这种情况不再发生。让我们回到我们和我们小家的例子。假设我们有四个设备连接到路由器。家用路由器会为你提供如下
    IP：


    ```

    192.168.0.1

    192.168.0.2

    192.168.0.3

    192.168.0.4

    ```


    这看起来似乎没问题；事实是 ISP 只为我们提供了一个了一个 IP，而这些中一个都不匹配。那个地址与我们路由器的地址完全不同。这意味着这四个 IP 地址对于
    ISP 和互联网来说仍然显示为一个。你能看到这会引起什么混乱吗？你决定浏览 Google 或 Yahoo，而你家里更多的人连接到其他网页。互联网将为你的 ISP
    提供结果，结果将推送到路由器，每个人都会得到相同的页面。一旦你的 ISP 接收到这些信息，它将使用该信息通过域名系统 (DNS) 服务器进行路由。该服务器分析你从机器发送的字符串（文本），将其与记录匹配，然后向你的机器提供适当的内容。


    这里需要注意的有趣点是，这些巨大的 DNS 服务器并不理解相同的语言。我们发送的所有信息都被转换为 0 和 1，机器可以轻松理解。当相同的信息呈现在我们的屏幕上时，它被转换为有意义的字符和字母。假设你想输入
    Google 的网址。对我们来说，它将是 `http://www.google.com/` 或 `https://www.google.com/`，但对互联网来说，它完全不同。所有这些机器都以连接的方式工作，每个机器都相互依赖来接收、理解和产生终端用户的需求。


