    \ home directory (no arguments). |\n| `cd ..` | This takes you to the parent directory.\
    \ |\n| `cd /` | This takes you to the root directory. |\n| `cd ./` | The period\
    \ slash denotes “current directory.” |\n| `cd ../` | This goes up to the parent\
    \ directory and into the next selected one. |\n| `cd ~` | Type this in, and you\
    \ will be back in your home directory. |\n| `cd ~/` | This accesses directory\
    \ named after slash within the home directory. |\n\n## The `ls` Command\n\nThis\
    \ is quite a useful command. We are pretty excited to start navigating in and\
    \ out of the directories. However, you might run into places where you are not\
    \ too sure if it contains any files or folders to browse. Since this is a line\
    \ user interface, there are no graphics to show what we can find within a directory\
    \ that we seem to have gone into. However, there is a way you can find that out\
    \ as well. \n\nTo check the contents of the directory you are currently working\
    \ on, simply type the following:\n\n```\nls\n```\n\nThe terminal should now provide\
    \ you with a list of directories, files, and any other material that may be placed\
    \ there, such as pictures and graphics. These will be presented in alphabetical\
    \ order. However, this command is quite extensive. Let us explore some more commands\
    \ of `ls`.\n\n### `ls -r`\n\nThis may not seem very useful at first, but rest\
    \ assured, it might come in handy. This command acts almost the same as the simple\
    \ `ls` command. The only difference is that the listing here would be in reverse\
    \ alphabetical order. Quite nifty in case you have a lot of files and need to\
    \ access one that starts with the letter U.\n\n### `ls -l`\n\nSuppose you have\
    \ a number of files and wish to find out determine what file permissions you have.\
    \ It is not necessary that you can edit all the files, read them, or access them.\
    \ In order to find out just that, you can use the following command:\n\n```\n\
    ls -l\n```\n\nYou are now effectively ordering the terminal to view all the files\
    \ with details like the owner of the file and the location, but we are more interested\
    \ in a bunch of symbols and letters that form up the first ten characters of the\
    \ line from the left. This is a typical example to explain to you better:\n\n\
    ```\ndrwxr-xr-x 3 exampletest exampletest 4096 Sep 01 12:00 Desktop\n```\n\nUsing\
    \ the `ls -l` command, we have now stumbled upon valuable information about all\
    \ the directories and files within our current location and can now see the permissions\
    \ each one of them has.\n\n*   The first character shows the file type. This could\
    \ be `d` for directory, `l` for link, `p` for named pipe, `c` for character device,\
    \ `-` for file and `b` for block device.\n*   The second to fourth characters\
    \ provide information regarding permission to read, write, and execute said file\
    \ or folder for the owner.\n*   The fifth to seventh characters provide information\
    \ regarding permission to read, write, and execute said file or folder for the\
    \ file’s group.\n*   The eighth to tenth characters provide information regarding\
    \ permission to read, write, and execute said file or folder for all other users.\n"
