    All of these can serve you with a handful of information that might be essential
    to manage the system better. Resources are limited by nature. Using them by tasks
    or processes that are unneeded would only slow others down. As a system administrator,
    we aim to keep as many of these resources available to users as possible.


    To end or kill a task or a process, use the `kill` command followed by the `PID`
    of the process. You can also get more information about `kill` commands by typing
    `kill --help`. To exit the `top` command session, use `Ctrl+C`.


    There is another command that you can use to bring up all the processes and some
    information about their resource utilization. It is called the `ps aux` command.
    However, unlike the previously used `top` command, this command will not show
    the data in real-time. It will only grab the figures available at the time of
    the execution of this command.


    Apart from the above commands, there are tools that are designed to provide you
    even greater insights on how your resources are being used. Let us look at one
    of these examples.


    Firstly, we will need to have this tool installed in our system. The tool is called
    `ATop`. Type in the following command in the terminal to install the tool:


    ```

    sudo apt-get install atop

    ```


    This will install this fabulous tool in our system that will allow us finer details
    about the processes and their usage of resources and memory. Whether you are an
    individual user or maintaining a group of users, resources are precious, and they
    must be monitored on a regular basis to ensure processes are running smoothly.
    If a process is consuming an alarmingly high capacity of resources, it is best
    to kill the process and reacquire the resources for other processes.


    You can get to learn quite a lot more about this tool by using the `man` command
    in the following manner:


    ```bash

    man atop

    ```


    This will show you the complete manual for the `ATop` tool. It will provide you
    all the known and used commands and the description for each one of them. It is
    quite a handy guide to have. To quit the manual, simply type in `q`. To access
    the tool, type the following command to bring up the monitoring tool:


    ```bash

    atop

    ```


    You should now be able to see a list of things that were otherwise not shown by
    the `top` or the `ps aux` counterparts. This makes decision-making a lot easier
    for the users and for the administrators. To gain further insights, you can use
    the manual to find out the relevant commands or use the `man -h` command to get
    access to more commands.


    The `ATop` tool has been generally the go-to tool for most programmers, users,
    and administrators as this tool allows an extensive range of information that
    otherwise might be quite hard to access. If you are looking to find out how many
    resources a particular program uses, the other counterparts may or may not tell
    you that, but the `ATop` will provide you with a complete list of the processes
    and resources that a specific program is using.


    Such tools greatly allow you to monitor your resources, understand your system’s
    performance on a better level, and allows you to take control of the resource
    allocation. While it is the kernel’s job to automatically assign and allocate
    resources to the processes, you can still jump in and halt or even kill the process
    that may be taking an unnecessarily high number of available resources to save
    the performance of the system.


    The Ubuntu store and repository hold many great tools. You can find out more about
    these on the internet in case you are not comfortable using the `ATop` resource
    monitoring tool. However, not all tools would be able to deliver your desired
    results, which is why the `ATop` tool is highly recommended.


    While the above is only monitoring the CPU and the memory, except for `ATop`,
    you might at times wish to monitor the I/O levels of the computer. To do that,
    you need to first install `sysstat` tool. We already know how we can do that.
    Once done, you can use the following command:


    ```bash

    iostat

    ```


    This command allows you to have a look inside the system and see the general I/O
    stats at any given point. You can run this command without an option, and the
    command will show you the necessary information. However, should you wish to go
    deeper, you can always check out the manual of `iostat` command by using the `man`
    prefix.


    These tools allow a user complete accessibility to information that will serve
    them with insights. Using these stats, we can manage our systems far more effectively
    than just trying to add RAM modules, trying to invest a large chunk of money into
    a new, upgraded machine. The machine specs do matter, but there are always certain
    processes that, if left unattended, will bring down even the fastest machine on
    earth.


    A successful organization will ensure that their IT department assure smooth sailing
    for all the computer users. A successful system administrator will use all these
    tools, understand exactly what needs to be done, and utilize the resources accordingly.
    The administrator will also ensure that any harmful or unnecessary process is
    killed and that user resources are always available for the users and their processes.
    System configuration and management is quite a vast topic and cannot be covered
    in just a chapter or two. Our efforts have been to ensure only the basics are
    provided to allow users to start exploring the system and develop a basic understanding
    of how processes work, how the resources are utilized by the kernel, etc.


    With that said, we now change pace and go up a notch by looking into a more technical
    field of networking in the next chapter.


    # CHAPTER Five: Knowing Your Network Configurations


    In this chapter, we will be looking into the basics of networking. We will learn
    how to effectively transfer files from one end of the network to the other and
    learn about some network applications that you can use to further add to productivity.


    Before we jump into the world of networking, it is essential to understand that
    networking is quite a vast topic in its own right. There is no denying the fact
    that networking requires extensive knowledge in order to fully comprehend the
    concepts, processes, and every tiny detail there is. With that said, we will try
    to remain to the basics and cover only the aspects that are absolutely essential
    for everyone to know and learn.


    The objective is to provide a user with enough knowledge to have a look around
    in the network and be able to explore the environment and manage a small network
    on their own. This would include all that we are aiming to learn within this chapter.
    For more advanced material and references, you always have the friendly Ubuntu
    community to help you with virtually any Linux-related problem you may run into.
    There are many other mediums through which you can find a lot of information on
    networking, but almost all of them will require you to have some basic understanding
    of certain concepts and procedures in order to make the most out of the opportunity.


    Let us start with the chapter and look just what networking is and how it functions.


    ## Network: The Basics


    Not so long ago, the internet was seen as magic by quite a few people. Those who
    never had any idea about how the internet works were left in amazed states. Type
    in anything, and magically, you would be provided with results that apparently
    answer the query. With the passage of time, awareness came in and filled the void.
    Now, most of the people who may not even be linked to networking remotely know
    about servers, the internet protocol addresses, and routers. Truth be told, these
    are quite important aspects of a network or even networking itself. This is a
    good start, but we need to learn a little more than just routers and servers.
    We need to know what keeps them alive, how they are managed, how they are upgraded,
    etc. in order to be a successful network administrator. While we may not cover
    all of it in just a chapter, we do certainly encourage the beginners to seek out
    more information on other books and mediums on networking. It can provide you
    with a wealth of knowledge and equally good opportunities to seek a promising
    career.


    In order for us to understand network and networking, we must forget Linux for
    now. Why? Some of these concepts are quite basic but apply exactly the same to
    every OS. We need to ensure we first create a good understanding, after which
    we can bring that knowledge and apply it in Linux.


    What we need is a bit of an insight on what is networking in general. To serve
    you with one, let us take you, the reader, as an example. Right now, you are connected
    to a computerized device, using it to either read or watch a video of your choice.
    In either way, both of these require you to access the internet. The internet
    is where you can find billions of pages, full of information that may be of some
    use to someone somewhere around the world. Certain things are at play here that
    understand what you are searching for, and then these little components fetch
    the required information for you and present it before you in text or pictures
    or even videos.


    Let us look a little deeper here and try to find out just what invisible elements
    are functioning here to ensure we are able to access the internet and acquire
    the information we need successfully.


    Your computer or computerized device is connected to a modem/router. The router
    is what connects you with your internet service provider (ISP). The internet isn’t
    with your ISP as they, too, have various devices that are connected to the actual
    internet. Remember this mapping for now as this will help you clarify how things
    work in greater details.


    Let us assume that you wish to access your favorite search engine. You open your
    browser and type in the web address of this search engine. The data is forwarded
    to your router by your browser. The router then sends this information to your
    ISP. Once your ISP receives this information, it uses that and routes it through
    a domain name system (DNS) server. This server analyzes the string (text) that
    you had sent from your machine and matches it with the records and then serves
    the appropriate content to your machine.


    The interesting thing to note here is that these giant servers, DNS routers, they
    do not understand the same language. All of the information that we send out is
    converted into ones and zeros, which the machines will easily understand. When
    the same information is presented to our screens, it is converted into characters
    and alphabets that will make sense. Suppose you wish to type in the web address
    of Google. To us, it would be `http://www.google.com/`, `https://www.google.com/`,
    but to the internet, it would be completely different. All these machines work
    in a connected manner, where each of them relies on each other to receive, understand,
    and produce demanded by the end-user.


    The IP addresses are often termed as internet protocol (IP) addresses. `1.1.1`.
    The maximum range that this format can support is `255.255.255.255`. While the
    combinations are extremely high, they are not high enough to support every machine
    that is connected to the internet. For well over a decade, the internet has been
    struggling as it has been constantly out of IP addresses. Various solutions have
    come forth to ensure this doesn’t happen. Let us get back to the example of us
    and our little home. Say we have about four devices connected to the router. The
    home-based router would provide you with such IPs:


    ```

    192.168.0.1

    192.168.0.2

    192.168.0.3

    192.168.0.4

    ```


    This may seem fine; the fact is that the ISP has only provided us with a single
    IP, and none of these match. That address will completely differ from our router’s
    address. This means that these four IP addresses would still appear as one to
    the ISP and the internet. Can you see the confusion this would cause? You decide
    to browse to Google, or Yahoo, while more people within your house connect to
    other webpages. The internet will provide your ISP the result, which will be pushed
    to the router, and everyone would end up the same page. To ensure that doesn’t
    happen, we have what is called network address translation (NAT) in place. This
    is what keeps the router from mixing up IP addresses and translates each request
    from those IPs and vice versa. The router will hold a single IP address, and the
    connected devices will help the router track of all requests. Hopefully, you were
    able to digest all to understand what a network is, what the IP address is, and
    how they function. Time has come to visit the terminal once again.


    This is the world of networking that makes all of this happen. Therefore, from
    the above, we can see that a network is essentially a virtual linkage where various
    computers, devices, and servers are connected. Networking is just a matter of
    transferring data from one point to the other.


    ## Using Network to Transfer Files


    This might not be as hard as you might imagine. All it takes a bit of practice
    and a little eye out for details. We have established an understanding of what
    a network is and how to identify machines that are connected to the said network.
    We use their IP addresses unless they have domain names, in which case we will
    use those instead. Now we wish to start moving data back and forth. We have quite
    a lot of files that need to be transferred and quite a few that we require from
    the remote servers or locations.


    We start things off by learning a simple command that allows us to copy a file
    from our local system to a remote system. Let us assume that the remote machine
    has a user account named `user1@abc.def.com` and we wish to send a file named
    `sample4`. In order to do that, we will need to use the command `scp`. To execute
    this, open the terminal in the location where the file is and then type the command
    like this:


    ```bash

    scp sample4 user1@abc.def.com:

    ```


    If you recall, just moments ago, we mentioned you need to keep an eye out for
    details. See the colon (`:`) in the end? That is not a typographical error. That
    is done on purpose. If you miss this out, you will end up creating a copy of a
    file named `user1@abc.def.com`, which kind of defeats the purpose of the entire
    exercise. If you do the command correctly, you will see a confirmation for that.
    This is one of the most basic commands used in the world of Linux. While there
    are quite a few commands out, `scp` is rather easy to use and understand. Now
    let us try that the other around:


    ```bash

    scp source_file user1@abc.def.com:sample4

    ```


    ## Network Applications


    There are quite a few commands and diagnostic tools that can help you out on your
    journey as a network specialist or even as a user. Knowing these is essential
    and can protect you from suspicious connections. The first thing we are about
    to learn might be familiar: the `ping` command. It checks whether a website is
    reachable. To run this, type in the `ping` command:


    ```bash

    ping google.com

    ```


    The output will look like this:


    ```

    PING google.com (142.250.190.46) 56(84) bytes of data

    64 bytes from 142.250.190.46: icmp_seq=0 ttl=117 time=12.1 ms

    64 bytes from 142.250.190.46: icmp_seq=1 ttl=117 time=11.8 ms

    64 bytes from 142.250.190.46: icmp_seq=2 ttl=117 time=12.5 ms

    64 bytes from 142.250.190.46: icmp_seq=3 ttl=117 time=12.2 ms


    --- google.com ping statistics ---

    4 transmitted, 4 received, 0% packet loss, time 3004ms

    rtt min/avg/max/mdev = 11.8/12.1/12.5/0.3 ms

    ```


    You can always stop the process by pressing `Ctrl+C`. The above shows the response
    time for each sequence. The statistics show the number of packets transmitted,
    received, and lost (%), as well as the time. This information is vital to have
    when you run into potential network-related problems.


    Next, use the `ifconfig` command to see your network interface settings:


    ```bash

    ifconfig

    ```


    This shows us the usage of all the devices. To see the routing table, use the
    `netstat -nr` command:


    ```bash

    netstat -nr

    ```


    To see the interface statistics, use the `netstat -i` command:


    ```bash

    netstat -i

    ```


    Lastly, to find out what active sockets are being used currently, use the `netstat
    -ta` command:


    ```bash

    netstat -ta

    ```


    This lists out active sockets with their address (local and foreign), their state,
    and some other useful information. This kind of information can be vital for anyone
    looking after the security of the entire network. The `netstat` command is used
    to monitor active connections and helps you in blocking any unwanted or suspicious
    connections that may provide an entry for hackers and malware. You can also keep
    track of all the packets that are sent and received. This command is always a
    go-to for most system administrators.


    ## Secure Shell (SSH)


    While your network is engaged and connected to various devices, all trying to
    access it and acquire or provide information, something needs to step it to keep
    an eye on the security here. This is where the Secure Shell (SSH) comes into play.
    Before SSH came along, there was `Telnet`. This was initially seen as a revolution
    where a person could access another remote machine without being there physically.
    This caught the attention of all kinds of people, including some prying eyes.
    Soon enough, people realized that these methods were not secure and anyone could
    practically "eavesdrop" on their exchange.


    `SSH` does what `Telnet` failed to do; it encrypts all of your data of the session.
    It also allows clients of any operating system a secure way to transfer files
    and folders without worrying about prying eyes in the middle. Understanding `SSH`
    is not a day’s job or even that of a book. There is quite a lot of material out
    there for those who wish to acquire information about cryptography, `SSH`, and
    `SSHD`. These are on an advanced level and would not suit the beginners at this
    point in time.


    It takes time and practice to get the hang of things in the world of Linux, but
    once you start to understand how things work, you will soon be surfing over issues
    as if they mean nothing. It is probably a good idea to get used to the fact that
    the LUI is your best friend here. Quite lot of people might find this shift from
    GUI to LUI a bit daunting, but rest assured, it is a move that will only cement
    your position as a successful system administrator and a super user.


