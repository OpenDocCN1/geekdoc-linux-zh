    yourself more comfortable with the placement of the dock, the app tray, and so
    on. This all combines to deliver you a desktop that looks good and functions accordingly.All
    the above that we have discussed so far is regarding the desktop GUI. This is
    called a user environment. The Ubuntu 21.04 “Hirsute Hippo” uses a GNOME 3.32
    environment. Various distros have various desktop environments. You can find out
    a lot more about each environment on the websites of their specific flavors and
    distros.Navigating around the new Ubuntu should be quite easy, even if it is your
    first time. Use the “Windows” key to bring up the main application menu. It is
    probably worth noting that this key is referred to as the super key. If you are
    thinking of making Linux your primary OS, you might find it helpful to start memorizing
    common names of keys so that you do not feel lost or overwhelmed when things like
    super key, super user, or root are being discussed. We will discuss quite a few
    here, but for more detailed information, check with the Ubuntu community, and
    you should be able to find most of the information there easily.Double-clicking
    the folder with your name will allow you access to the files and the directories
    of this user. There, you would be able to see your folders for downloads, music,
    and pictures. In the left pane of the window, you should have quick access buttons
    just like you would find in a Mac OS or Windows. Use these to quickly switch from
    one folder or directory to another.The new Ubuntu version now allows you to mark
    any folder as your favorite. This saves us quite a lot of time in case we are
    to use that destination quite often. Simply right-click on the said folder and
    choose “Star.” There you have it. Now, you can access this folder almost instantly
    by a single click. Please note that this may not work on all folders.Right now,
    the entire system is rather vacant. We haven’t done anything as of yet. However,
    with time, you may start creating text files or downloading music, movies, and
    games. You might even work on software or create programs and save them in an
    important location. Use the star method, and you should save yourself quite a
    lot of clicking in the future.Ubuntu allows extensive customization, and there
    are tons of themes, icon packs, and almost everything that you wish to change
    or customize. You can search throughout the internet or visit[ ](http://www.gnome-look.org/)
    [www.gnome-look.org](http://www.gnome-look.org/) to change the feel of the desktop.Installing
    themes is easy. However, for full customization control, you should download the
    GNOME tweak tool. It is free and is available in the Ubuntu software center. There
    is another way you can get that without actually searching for it in the software
    center. With just a snippet of command, it will be done for you. This is the power
    of Linux; it will get the job done for you. All you need is to command it what
    you wish for. We will discuss this when we learn more about the terminal in the
    coming chapter.CHAPTER THreeNavigating Your Way ThroughI n the previous chapter,
    we walked through the various distros and who uses them. We ended the chapter
    with successfully having Linux downloaded and installed. To serve as a bit of
    a reminder to everyone, we will be discussing Ubuntu more as it is the pinnacle
    for those who are just starting their journey into the crazy world of Linux.Picking
    up right where we left off, the virtual box is successfully running Ubuntu, and
    we have made it through to the desktop. Gorgeous, isn’t it? Colorful, dynamic,
    and already seems fluid. Provided that you gave enough room for VirtualBox to
    breathe, you should not experience much lag. There will be steps that we will
    need to take in order to correct the maximum screen resolution and improve the
    smoothness of the operation.The desktop holds most of the important aspects, such
    as your dock (left side), where all the pinned or active apps float. You have
    the top panel that shows your clock, a few indicators, and a user menu. The user
    menu is where you can turn your OS off or restart it and access user settings
    and other functions that will be useful.This GUI you see before you is called
    a user environment. The Ubuntu 21.04 “Hirsute Hippo” uses a GNOME 3.32 environment.
    Various distros have various desktop environments. We can get into those, but
    since we already have Ubuntu installed, let’s not discuss that right now.Once
    you have played around a bit with the environment and the icons, you can now begin
    to take a first look at the beating heart of every Linux flavor out there — the
    terminal.Getting Acquainted with the TerminalThe terminal, sometimes referred
    to as the command-line interface (CLI), is where all the magic happens. While
    the graphical user interface (GUI) allows the user to use graphics and interact
    with icons and folders, the terminal takes a different approach, which is called
    the line user interface (LUI).In the terminal, you do not have any graphics except
    for lines of code. Learning how to command and use the terminal is what you should
    aim for. This is what will truly allow you to utilize the true power of the Linux
    OS.Before we proceed ahead, it is probably wise to add a plugin to our VM to maximize
    the screen resolution and allow Ubuntu to function a little more fluidly and smoothly.
    Remember, we are currently providing this VM of ours a fraction of the true potential
    of our machine. Do not expect it to work immaculately just yet.Let’s get our hands
    greasy here and work with the terminal for the first time. We will use a certain
    command to add guest plugins. You do not need to run a setup manually, scroll
    through options, or do any of that. The terminal does it all for you with simple
    commands. We will be discussing commands in details later on, but to serve you
    with an idea of how exquisite and flawless the terminal is, let’s get into it
    right away.Double-click on the home folder. Now, within the home folder, click
    on the disc image on the left pane to open the contents of the virtual disc. Right-click
    on the empty space within the disc folder and choose “Open in terminal.” We are
    trying to run a file named AddLinuxAdditions within the disc image. This file
    has a .run extension. Files with these extensions can be run directly from the
    terminal.You should now have the terminal opened. See the colored alphabets and
    digits? Those are indicating your location right now. If you have used DOS prompt,
    this might make some sense.Start from the left side. You are shown the point where
    the main directory started followed by the forward slash (/). Following that is
    the sub-directory and so on. The naming should end with your virtual disc name
    to indicate whatever you are about to do is going to be within this directory.Now
    enter the following command after the $ sign:./AddLinuxAdditions.runHit Enter.
    See how it says you need administrative privileges? In the world of Linux, there
    is what we call a super user. This is essentially the same as an administrator
    in Windows. Now enter the following command to allow these privileges to the command:sudo
    ./AddLinuxAdditions.runYou will be asked for your password for verification. Provide
    the required information and hit Enter. Moments later, the installation will be
    complete, and you will see quite a bit of difference in screen resolution and
    performance. For optimum results, go to the top right side of the desktop, access
    the user menu by clicking on the drop-down menu icon, and restart your Ubuntu.Now,
    your desktop would look and feel a lot more spacious and appealing. The performance
    will improve quite a bit as well. This is the time when you can now start moving
    around icons, checking out the Ubuntu software store, and customizing all that
    you wish for.Remember we mentioned about discussing the terminal later on? Well,
    here we are. We have just used a terminal to do something for us; now, we shall
    see how easy and efficient the terminal is.We will be trying to download a tool
    called GNOME tweak tool and install it. We will go through the process and see
    how long it takes to get this simple task done. This should be your first look
    into the true power of the terminal and why the computer geeks rely so much on
    it.Let us call this scenario “A.” We will use the traditional GUI to browse around
    the software store and search for this tool to download and install the same.First,
    go to your dock of applications/software. Click on the Ubuntu Software icon. That
    would be the orange one with an “A” in it. Once the software store screen loads
    up, click on the magnifying glass to initiate a search and type in “GNOME Tweak.”
    You should then be able to find the tool. Simply click that and click on Install.Simple,
    right? Perhaps it did not consume much time at all. Let’s compare to the scenario
    “B” now.Right-click anywhere on the desktop and click open in terminal. Alternatively,
    you can use a keyboard shortcut Ctrl+Alt+T to bring up the terminal shell. Enter
    the following command:sudo apt-get install gnome-tweak-toolEnter your password
    for verification and hit Enter. You would be asked if you are happy to proceed
    with the installation. Type “Y” for yes and hit Enter. That is it! Much quicker,
    much more effective. You never had to change any screens or browse through a number
    of pages to get to your application.We will be learning quite a lot of commands,
    so if these do not make much sense right now, don’t be worried. We will get into
    the details soon.The terminal talks to the machine and to the user using these
    set of codes. To an ordinary user, this may seem overwhelming, but to any experienced
    professional, each string of text conveys a certain message. Whether you are trying
    to compute or access certain files and folders, you need to use the language that
    the terminal can understand and operate on.Mr. Linus, our dear friend who invented
    Linux, was a man who possibly introduced the concept of working smart instead
    of working hard. He never wanted to work much, and the same is perfectly replicated
    in the terminal. The terminal will do all the hard work for you and provide you
    with the end result directly.If you advance your way through and learn Python
    and other languages, you would be able to extract most out of the terminal while
    doing minimum work yourself.Imagine, you have to compile data that involves quite
    a bit of research. If you are a Python user, you will only need to create a script
    and feed it to the terminal. The terminal will then initiate the research, gather
    relevant data, and compile it in a word/PDF/spreadsheet file for you at your chosen
    location.The leading tech-related industries are using Linux to provide them with
    cutting-edge solutions and to maximize their productivity far and beyond. All
    of that is made possible owing to this simple LUI that does so much in so little
    effort.File System and Directories: The “What” and the “How”The world of Linux
    is slightly different from the more popular Windows and Mac operating systems.
    It is necessary that you understand how everything works here, how the file system
    works, and how you can create new directories and pathways for your data files.In
    order to fully understand, ensure that you are at the desktop of your Ubuntu and
    follow the guidelines here to make the most out of it. Practice makes anyone perfect.
    Going through the pages without actually experiencing any of it might defeat the
    purpose of the entire book and the effort it took to make it.Root DirectoryFrom
    the desktop, open your home folder that has your login name on it. Once opened,
    go ahead and press Ctrl+T to open a new tab. In the new tab, in the left pane,
    go down to the plus sign where it says other locations. Click on that to access
    two more locations that are not shown directly on the pane or on the desktop.
    Click on the computer icon to access it. What you should be able to see now are
    two tabs. Although you do not need to do this every time, we are only doing this
    to ensure everyone understands the difference.One tab should be named as “Home”
    while the other should have no name. This is because the other is the root directory
    or the parent directory. It is marked with the forward slash (/). This is the
    highest directory in the system, and whatever takes place will happen within it.Your
    second tab is Home. It is represented as “/Home.” This is where our user directory
    lies. To view the full address, you can always hover your mouse on the left pane
    over directories to get these details.Similarly, the “usr” is /usr directory in
    the root tab. This is used by the system itself for quite a lot of things.Here,
    we should also stress on terms called absolute path and relative path.An absolute
    path is a path that begins with a forward slash and descends all the way through.
    For example, in the above case, we used the root directory, entered a sub-directory
    called usr, followed by a folder named “Example Folder.” Our target folder lies
    inside this and is named as “Target folder.” The absolute path for this would
    be as follows:cd /usr/Example Folder/Target folderIt is not necessary that paths
    are always absolute in nature. Suppose you are deep into the root directory and
    its sub-directories. The path would be quite long and hard to remember. To make
    things simple, you can simply type in the command to change the directory, and
    without using the forward slash, just type in the name of a folder that is within
    the working directory.As an example, let us take the one we just used to describe
    absolute path. Let us assume we are within the Example Folder directory and now
    we wish to go to Target folder. To do this, you will only need to type the command
    to change directory (cd), followed by the name of the sub-directory:cd Target
    folderThis is called a relative path as it is only relative to the working directory.You
    will come across these quite often, which is why it is best to note these for
    future purposes. With that said, let us now move on to other important directories
    apart from the root directory.The Bin DirectoryThis is perhaps one of the most
    important directories in the system. While there may be various bin and sbin directories
    in the system itself, we are referring specifically to the /bin directory, which
    resides directly under the root. This is where you find all the binary files that
    the system uses in order to carry out all the functions and tasks accordingly.For
    users, there are other directories to use which are mentioned down the line.Spell
    them right!Capitalization is quite a significant deal in the world of Linux and
    the filesystem it possesses. While naming any directory that you end up creating
    or even if you are renaming a file, be sure to know the exact name with the right
    order of capitalization.Linux treats every letter as a different character. This
    is crucial to remember as quite often people tend to forget this and run all over
    the place, worrying why their perfectly good file is not functioning in the terminal.
    If you are trying to access a directory called “Home,” you need to type in the
    command followed by the exact order of capitalization. Get it wrong, and Linux
    will not identify your request.It is now time to look at some other important
    directories. Some of these are best left alone as they perform crucial functions
    and may end up causing problems should you rename, edit, or even remove any of
    them.Steer clear of “Boot.”While most of these folders or directories can be explored
    at your own will, there is one that you should strictly refrain from unless you
    are an expert user. This is the folder called Boot in the root directory (computer).
    This contains everything that is crucial and important for your operating system
    to boot. This is the home for your boot loader. Do anything here, and you might
    find yourself in all kinds of trouble.Dev DirectoryThis is the directory where
    all your devices live. Since Linux does draw some inspiration from the age-old
    Unix system, there are some similar concepts you may find. The most prominent
    one is their approach to the filesystem, where everything is treated as a file
    and nothing more.This is where you will find everything related to hardware, including
    the hard drive, the partitions, mouse, keyboards, etc. For all applications and
    drivers, this is the folder to access. You can still look around, but try not
    to modify or change anything here unless you know what you are doing.The Etcetera
    DirectoryQuite literally! This directory is named as “etc.” While there is still
    quite a bit of confusion with the name, the co-creator of Linux has confirmed
    this was indeed termed as etcetera, so we will continue to call it just that.This
    directory is responsible for holding all the system-wide configuration files.
    This means that any application or software that is available for all the users
    will have its configurations stored here. We will discuss these in more detail
    later on.The LibrariesEvery Linux system has libraries that are used by various
    applications to carry out numerous tasks and functions. In our case, we will most
    likely be able to see four folders here named as lib, lib32, lib64, and libx32\.
    Again, not something we should be fiddling with unless we are 100 percent sure
    of what we are doing.The Lost+Found?It could have been named something else, but
    Linux has this directory in place to keep files that have either been damaged
    or lost during a process (e.g., abrupt shutdown).Media and /mnt DirectoriesSimply
    put, these are the places where we will be able to locate any other drives that
    we may have mounted in Linux. These will include any floppy disks (not like we
    use them anymore, but it is always good to know), CD drives, USB mass storage,
    network drive, etc.The Optional DirectoryNamed as the “opt,” the optional folder
    consists of software manually installed by third parties. There may be some software
    packages that end up being installed in this directory.If you are a software engineer
    and you have created a software yourself, you can use this directory to install
    your very own software as well.The Process Directory“Proc” directory is where
    files containing information about the system processes and resources are located.
    This will be quite useful for developers and programmers.The Run DirectoryThis
    one is quite interesting. Whenever you are working on your system, this folder
    starts getting crowded. However, when you shut your system down, this directory
    goes blank immediately. It does not store files permanently and only houses those
    that are using the system memory or RAM.The files in this directory store runtime
    information for processes that begin the moment you start the machine. The information
    may be useful, but it is only available as long as the system is running.Sbin
    DirectoryQuite like the bin directory in the root folder, sbin is only accessible
    by the super user as it requires administrative privileges.Snap DirectoryThis
    is Ubuntu’s favorite directory. This is where all the snap packages reside for
    the use of Ubuntu. These are applications but function quite different from your
    ordinary applications.Service DirectoryThe “srv” directory is the directory that
    contains all the service data. This should currently be empty, and there is a
    very good reason for that. The srv directory only comes into play when you decide
    to run a server and wish to share files with external users. Those files will
    be placed within this directory for external users to gain access.The System FolderThe
    “sys” folder is the medium to interact with the kernel itself. Just like the run
    directory, this creates files when the system boots up and does not directly write
    it on the disk.The Temp FolderAs the name implies, it is a temporary directory
    that stores temporary files for the user in case the system crashes. This will
    then search to find the last temporarily saved entry and provide the user something
    to continue with.Again, just like the run and the “sys” directories, this folder
    also deletes most of the files within it every time the system is shut down.The
    Usr FolderJust like the bin directory, where files are used only by the system
    itself, the usr directory is where applications or files used by the user and
    system administrator are installed.The Variable DirectoryThe var directory only
    holds files and directories that may expand in size. This could be various kinds
    of information, such as system crash logs, which may populate over time.These
    are the kind of directories you will find and probably even use one day down the
    line. However, there are some other things to notice here.Viewing hidden files
    and folders:If you go back to your home directory and hit Ctrl+H, you will see
    quite a lot of hidden files that were initially not visible. In Windows, they
    appear in a translucent manner to differentiate between a file that is visible
    from the one that isn’t. In Linux, things are different yet again.Any file that
    begins with a period is meant to be hidden. After you use the above command, you
    will be able to see many of these.Even in the terminal, if you use a command to
    list the files and folders within the working directory, you will only be shown
    the ones that are not supposed to be hidden. In order to view all the files, you
    will need to use the command below:ls -aEnter that, and you will be able to see
    all the files and folders, including any that you may have created on your own.Creating
    a folder is exactly like you would normally do in Windows or Mac OS. Simply right-click
    on an empty space and choose “New Folder” to create one right away. Depending
    on the location where it is created, it will now be a sub-directory of its parent
    directory.Now that we have a fair idea about how the filesystem in Linux works,
    how the directories are accessed through the GUI, let us now step deeper into
    matters and move past the graphical world. Let us now stroll through the world
    of LUI.Basic Commands to RememberThere are just so many commands that we can go
    through, but hopefully, our aim is to remain true to the task at hand and explore
    the essential commands that will serve us every single time we use Linux and the
    incredible CLI.For best results and quicker understanding, keep practicing as
    you read. This helps in learning faster and understanding things more effectively.If
    you don’t remember how to access the terminal, you can simply right-click on any
    empty space and choose open in terminal or just punch in Ctrl+Alt+T , and that
    should bring up the terminal for you.Commands that you use are normally followed
    by what is called as an argument. For example, in the case of changing directories,
    the “cd” is the command, while what follows is the argument. There will be some
    commands where you may not need to use arguments. We shall discover that now.Print
    Working Directory (pwd)It shows you the current directory you are working on.
    This is quite a useful command if you are lost within the depths of directories.
    This command requires no argument.Change Directory (cd)Use this command to change
    from one directory to another. Remember, use relative path if you are aiming to
    go to a sub-directory or use an absolute path if you wish to go elsewhere.For
    “cd” command, there are a few other things you can use:'
