    mention here for reference purposes, the “scp” is rather easy to use and understand.
    Now let us try that the other way around.scp user1@abc.def.com:sample4 .Now, we
    used the same command but changed the order. Let us try to see what happened here
    by first understanding the syntax of this command.scp source_file destination_fileAs
    we see here, the source file this time was in the remote computer/server. We wanted
    a file named sample4 to be copied securely into our system (destination file).
    After the colon, we specified the file we wanted and then used a period (.), which
    indicated a local machine — i.e., your machine. After you press Enter, you will
    have that file copied in your system.You can also rename the source file and place
    it into a directory of your choosing by doing this:scp sample4 user1@abc.def.com:.test/sample5This
    will effectively rename the file to sample5 and place it within the local “test”
    directory. You can specify a path, and the rest will be done for you.To get a
    full spectrum of the scp command, have a look at the manual by using the man command.This
    command is good if you have a few files, but what if you wish to transfer a whole
    bunch of files or maybe the complete directory? For that, we use another command
    called the “rsync” command.This command has multiple uses and can be used to move
    or copy (mirror) data and files across a single machine or the entire network.
    The command is terrific for the purpose of backing up your data on remote machines
    or servers. To use the command, you need to follow the syntax below:rsync [options]
    source destinationWith over 50 options, you can easily and securely copy the entire
    directories or the content of the said directory across a single machine or the
    network itself. You might be asked for administrative permission in order to do
    that as this uses SSH to secure the entire connection and prevents anyone from
    “listening.” That is just another word to suggest someone is monitoring your activities.There
    are far too many tools and applications that have come forth in recent times.
    Whether you decide to use the LUI as a medium of data transfer or GUI, you have
    your options with you. Be sure that you always use reliable sources and monitor
    activities and connections on a regular basis to ensure safety for your data and
    for the network itself.Network ApplicationsThere are quite a few commands and
    diagnostic tools that can help you out on your journey as a network specialist
    or even as a secure home user. Knowing these is essential and can protect you
    from quite a lot of suspicious connections and hackers. These tools will also
    allow you to indulge deeper and create a better understanding of how the network
    operates and how other devices act when they are a part of the network. For now,
    let us proceed in getting ourselves acquainted with some important tools.Let us
    clear the terminal by using the clear command and use an important command you
    should know as a part of your basic learning. It is called the “ifconfig.”Windows
    users who may have used a command on their command prompt called “ipconfig” would
    find this familiar.Go ahead and type in “ifconfig.” You will now be presented
    with quite a populated screen, full of information. This is your network information
    and shows exactly how the network is configured.Note: For users who may face error,
    you might need to install net-tools. The command for that is “sudo apt install
    net-tools.”The information that you see here would allow you to take a closer
    look into how some of your network settings are. These will include your ethernet
    settings, your wireless settings, and information about your localhost as well.
    Some of these are quite useful pieces of information and can come in handy should
    the situation call for it.Most of the information displayed is easy to understand,
    but if you find any of the terms or columns hard to read, you can always rely
    on trusty old Ubuntu community to acquire further insights.Next stop, we will
    be looking at the command called the “tcpdump.” This is basically a packet sniffer
    — literally! It analyzes all the packets that come in or go out of your system.
    Why do we need this? We will learn that soon enough.In order for us to have this,
    go ahead and install “tcpdump” by typing in the following command:sudo apt-get
    install tcpdumpOnce installed, go ahead and run the tool by typing this (requires
    sudo):sudo tcpdumpDon’t be alarmed if you are not getting anything as of yet.
    Just open a browser window and go to any website of your choice. As soon as you
    press Enter on the browser, switch your window and come back to the terminal.
    Your terminal screen will now start an endless process of sniffing all the packets
    that are leaving or entering your system. You will need to bring this to a halt
    by pressing Ctrl+C .The problem with this command is that it never ends if you
    have a few network-based activities running in the background. What you can do,
    however, is to limit the data sniffing. Suppose you only want to capture a set
    number of packets (let’s say 20), you can slightly change the command to do exactly
    that.sudo tcpdump -c 20The command will execute the moment you hit Enter and will
    capture the next 20 packets sent out or received. We use the “tcpdump” command
    to find out where these packets are being sent to and where are they being received.
    In our example, you will notice that an outgoing packet will have your IP address,
    the domain, and the address, while the opposite will show accordingly.This command
    is essential to analyze data and can track down any unknown addresses where information
    might be leaking to or coming from. Such suspicious addresses or domains can then
    be clocked accordingly to ensure the safety of the system and the network itself.
    The command also allows you to see the packets that are being sent out and received
    by a specific interface that is connected on your network.Suppose you have a wireless
    router on your network and you wish to check the kind of activity that is taking
    place through it. You can do that simply by typing in the following command.sudo
    tcpdump -c (number of packets) -i (device name)This will start collecting results
    for the said device and capture the number of packets you have set — quite a sneaky
    way to check on what your co-workers or colleagues are doing.Similarly, you can
    also use the same command to check up on your ports or have the packets shown
    in ASCII format or even hex format. The application for this tool is vast. You
    can always check the manual of this tool by typing in “man tcpdump” to get the
    complete options you have available with this command.Before we go ahead and get
    into the basics of moving files and folders across the network, there is one more
    command you might find useful to determine who is connected to your network. It
    is called the “netstat” command, and it can provide you with a great helping hand
    in order to find out if someone is hidden yet connected to your network. To do
    this, type in the command in your terminal with the following option:netstat -nrInstead
    of showing domains, you will now be provided with the IP addresses and the IP
    routing table. You can also check the network interface statistics by using the
    command below:netstat -iThis now shows us the usage of all of the devices. You
    can find out how many packets are being sent out or being received by individual
    devices.Lastly, you can find out what active sockets are being used currently
    by your network, and to do that, you need to use another netstat command with
    a -ta option. This will list out active sockets with their address (local and
    foreign), their state, and some other useful information. This kind of information
    can be vital for anyone who is looking after the security of the entire network.The
    netstat command is used to monitor the active connections with your network and
    helps you in blocking any unwanted or suspicious connections that may provide
    an entry for hackers and malware. You can also keep track of all the packets that
    are being sent and received. This command is always a go-to command for most of
    the network and system administrators.While your network is engaged and connected
    to various devices, all trying to access it and acquire or provide information,
    something needs to step it to keep an eye on the security here. This is where
    the Secure Shell (SSH) comes into play.Before SSH came along, there was Telnet.
    This was initially seen as a revolution where a person could access another remote
    machine without being there physically. This caught the attention of all kinds
    of people, including some prying eyes too. Soon enough, people realized that these
    methods were not secure and anyone could practically “eavesdrop” on their exchange.The
    SSH does what Telnet failed to do so; it encrypts all of your data of the session.
    It also allows clients of any operating system a secure way to transfer their
    files and folders without worrying about prying eyes in the middle. Understanding
    SSH is not a day’s job or even that of a book. There is quite a lot of material
    available out there for those who wish to acquire more information about cryptography,
    SSH, and SSHD. These are on an advanced level and hence would not suit the beginners
    at this point in time.It takes time and practice to get the hang of things in
    the world of Linux, but once you start to understand how things work, you will
    soon be surfing over issues as if they mean nothing. It is probably a good idea
    to get used to the fact that the LUI is your best friend here. Quite a lot of
    people might find this shift from GUI to LUI a bit daunting, but rest assured,
    it is a move that will only cement your position as a successful system administrator
    and a super user.CHAPTER SixShell, Scripts, and ToolsL inux is meant to be used
    for security purposes. It is known to offer security of the finest level with
    various distros and flavors that it rolls out. It is then of no surprise that
    Linux is being used in government and military installations. This shows just
    how flawless its security is.On the other hand, Linux is also used as a popular
    choice by programmers and developers alike. This is mainly because of the security
    but also because it offers them an effective platform where they can create flawless
    applications and carry out tons of work in the least amount of time. One fine
    example of how you can save time and accomplish a lot is shell script.Shell scripts
    are also called as Bourne scripts. These are files in which you provide the shell
    a series of command to run. Now, you might be wondering, how is it any different
    than us entering commands in the terminal?Basics of Shell ScriptsShell scripts
    are somewhat of a playground for programmers. You can quite literally create small
    programs within it and use as many commands as you like. Let us look at an example
    of how these scripts are created.1\. Open your terminal window.2\. Create a directory
    on your desktop (optional).3\. In the directory, create a file using the touch
    command.4\. Ensure that you name the file with a .sh extension.5\. Use sudo nano
    command to access the newly created file.6. Start the script as under:#!/bin/sh7\.
    You will now need to write some codes and use echo and ls, for example.8\. Save
    the file.9\. Close and then execute the file using bash (filename.sh).You will
    now see the entire thing carried out for you. Shell scripts save you quite a lot
    of time and provide you with a very effective and efficient way to get desired
    results without wasting time and energy.The shell script always starts with the
    shebang (#!) sign. If you did not get through to the script creation part the
    last time, let us create two dummy scripts to further practice and understand
    shell scripts.1\. Let us create a new file named “sample6.sh.” Be sure to use
    the .sh in the end. Save it and now use the nano editor to access the same.2\.
    Always start your script with the shebang sign followed by /bin/sh. You can then
    add the listing command. You script should now look like this:#!/bin/shls3\. Now
    you should save the script and close it.4\. Use the command “bash sample6.sh”
    and hit Enter.You just executed a script. Now let us add in another command. We
    want to view the working directory we are in and then get the listing for that
    directory. To do that, your script should look like this:#!/bin/shpwdlsAll set?
    Save it, and now it is time to execute the same. As soon as you do, you will see
    just how quickly the entire thing was executed. That is the power of shell script.There
    are certain rules and methods that you may have to learn in more details in order
    to truly draw benefits from the shell script. These include learning the use of
    literals, single and double quotation marks, variables, etc. It is also advised
    that while these scripts are powerful, you are still better off using advanced
    languages like Python and C to carry out complex operations.Knowing When to Use
    Shell ScriptsWe did mention above that the shell scripts are rather useful but
    are limited in terms of functionality. It is able to carry out most of the less-complex
    jobs without worries. Yes, it may at times be frustrating if you did not use the
    right literal or the correct quotation mark; however, their power cannot be ignored
    because they truly help users achieve quite a lot in very little time.If we were
    to enter ten commands, as an example, we will never be able to do that in a single
    go. We will have to type in a command, hit Enter, wait for it to finish, and then
    start typing another and continue till the tenth command ends. To add insult to
    injury, we might even need to repeat this process a few times in order to achieve
    something. If only there was a way we could command the system to do this for
    us instead of us typing the commands every single time or even using the up-arrow
    key again and again.This is where the shell script comes in. This is something
    that the programmer would love to use every now and then. Shell scripts can be
    made to carry out various commands at once. In the previous paragraph, we discussed
    ten commands and the arduously long time it would take to accomplish them. Shell
    scripts can do these for you in an instant. All you need to do is to type in the
    script.For users who are looking to work in the field of automation, they have
    their work cut out for them. They will be playing in the field by repeating large
    operations and tasks over and over again to achieve the desired results. Imagine
    going through hours and days of carrying out the same commands. The prospect does
    seem tedious. The shell script will be their knight in shining armor. Doing all
    those tasks in far less time imaginable would only allow them to do other tasks
    and boost their productivity.Other common uses of shell scripts are as follows:'
