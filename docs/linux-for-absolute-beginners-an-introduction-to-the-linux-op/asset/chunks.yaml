    \    - [What’s Next?](#\n- [CONCLUSION](#\n- [REFERENCES](#\n\n## Introduction\n\
    For any software-related professional, Linux has served as an epitome of accessibility,\
    \ creativity, and freedom. Linux has been hailed as one of the all-time greats\
    \ in our era. It is an operating system that has revolutionized the world with\
    \ its dynamic nature, the sheer number of distributions (also referred to as “distros”),\
    \ and the security that it brings to the table. With success stories emerging\
    \ from all across the globe, this operating system continues to dominate the industry\
    \ with its high standards and immaculate functionality.\n\nLinux has been making\
    \ the headlines, and there is every reason why that is the case. With products\
    \ and services like Android and the entire Macintosh operating system (OS), which\
    \ derive their existence from Linux, the operating system has cemented itself\
    \ as the market leader.\n\nWith hundreds of thousands of professionals learning\
    \ Linux, it makes more sense than ever to get yourself acquainted with it as well,\
    \ and that is exactly what this book is all about.\n\n## What to Expect in This\
    \ Book\nFortunately, you do not need to be a high-end programmer or an expert\
    \ at coding to get the most out of this book. If anything, this book is aimed\
    \ for people who have no idea what Linux is, how it functions, and who should\
    \ use this incredible operating system.\n\nThe book is written to ensure all complexities\
    \ and advanced terminologies are kept to the minimum so that it is easily understood\
    \ by the readers. The better the understanding, the better your command will be\
    \ over the new operating system you are about to operate.\n\nThe book should serve\
    \ as a good starting point for those willing to embark on a journey to the open-source\
    \ operating systems and familiarize themselves with basic functionalities, commands,\
    \ and essential. The book will also reflect on topics like networking, scripts,\
    \ and applications, with hopes that the readers would find themselves comfortable\
    \ tackling instructions and guidance to enhance their experiences.\n\nThe book\
    \ covers essentials that are necessary for every beginner to understand in order\
    \ to operate the OS successfully and maximize productivity. Whether you desire\
    \ to use Linux for entertainment purposes or professional ones, the book will\
    \ enable you to learn, understand, and execute basic commands at will, configure\
    \ your system, personalize your user environment, and if needed, dive into some\
    \ advanced wizardry.\n\n## Some Essential Terminologies\nWhile all efforts have\
    \ been poured in to maintain a simple, friendly approach throughout the journey,\
    \ some significant words and terminologies will still be used. These will most\
    \ likely be used throughout the book to either elaborate or provide explanation.\
    \ To give you a bit of warm-up and get your skills flowing, here are a few commonly\
    \ used terms:\n\n- **Command line interface (CLI)**: A text-based interface that\
    \ allows user to navigate through the computer, move files, and execute commands.\n\
    - **Flavors**: Although some may find this unusual, the term “flavor” is used\
    \ to describe variants or distributions of Linux.\n- **Kernel**: The heart and\
    \ soul of any operating system. The entire OS, memory management, task management,\
    \ and processes relies on the `kernel`.\n- **Operating system (OS)**: The software\
    \ that communicates between machine or hardware and allows programs to function.\
    \ Think Windows, Mac OS, Android, etc.\n- **Shell**: A virtual shell that wraps\
    \ itself around programs and runs it. It is where you type in commands, and the\
    \ action is then carried out. \n- **Unix**: The mother of Linux. This is indeed\
    \ a fact and not just a fancy way of putting it.\n\n## CHAPTER ONE: WHAT LED TO\
    \ LINUX?\nIf you have just started on a new journey and immediately you are taken\
    \ back into the pages, you might be wondering why. There is a perfectly good explanation\
    \ for this, which will become clear by the end. We know we are about to learn\
    \ something called Linux, a rival for Windows and Mac OS that apparently most\
    \ people have never heard of. This shy but extremely efficient operating system\
    \ has drawn a lot of attention from the world. It stands as one of the all-time\
    \ greats and continues to serve almost everyone whether they know about it or\
    \ not. If you are a user, you are already familiar with the file system that Linux\
    \ uses. You may have heard of users and super users accessible through rooting.\n\
    \n### A Brief History\nWe find ourselves somewhere between 1991 and 1994. A guy\
    \ named Linus Torvalds started a project where his motive was to create his own\
    \ operating system. Using Unix as building blocks, the entire operating system\
    \ was made from scratch. This is something you might want to remember. Obviously,\
    \ those who have seen Unix would know that Linux uses commands that are similar.\
    \ This naturally led people to believe that Linux is just another version of Unix.\n\
    \nBoth operating systems are independent and serve different purposes. With that\
    \ sorted, we can now proceed to find out what brought Torvalds to create an OS\
    \ from the ground up. Before Linux ever became a success that is today, other\
    \ operating systems existed. In order for people to gain access and use them,\
    \ they needed to pay. This was a problem for a lot of software engineers and developers.\
    \ Obviously the world was not yet introduced to sources like have eased the process\
    \ of writing hundreds of lines of codes and upgrade them, or modify them. It took\
    \ a lot of time, and the cost was a lot. Not exactly the ideal situation for anyone\
    \ to find themselves. Torvalds realized that in order for software engineers to\
    \ continue thriving, they needed an operating system, and available options were\
    \ costly. This moment, an idea came forth that would change a lot of things. Linus\
    \ decided to do the unthinkable and create an operating system from zero, and\
    \ make it true open-source. This opened a floodgate to possibilities for programmers\
    \ across the globe. Now, they had something that was not only free but access\
    \ to the actual code. To make things better, they could now manipulate, alter,\
    \ or change the code to their liking. This caught quickly. The result was success\
    \ beyond comprehension. With thousands of variants coming up, popularity started.\
    \ If you ever heard of Ubuntu, it is a prime example of what we are about. It\
    \ is termed flavor or distro.\n\n## The Open-Source Concept and Distributions\n\
    Earlier, we got a little insight into what Linus was aiming to do. What exactly\
    \ does open-source mean? While many might not be interested to learn about this\
    \ concept, it is vital to understand how Linux works and how array of distros\
    \ came into existence. Every software you can find has been designed with what\
    \ is called source code. It is essentially a blueprint of the entire software.\
    \ It tells the software how to function and what to do should a user interact\
    \ with it. If the software is sold as proprietary, the users will have no access\
    \ to the original code. There is no way for ordinary users to change or modify\
    \ any of the values. This is termed closed source. On the contrary, there are\
    \ software systems that allow users to gain full access to the original code.\
    \ Moreover, users can play with these and modify values at their own will. The\
    \ result would obviously be different from the original product, and what you\
    \ would end up would be a new version. Remember when we said Linux borrowed a\
    \ concept pre-dating itself? The first software to provide users with source code\
    \ was the UNIVAC system, developed by Remington Rand. This was back in 1953. This\
    \ was the very first time when customers and end-users had access to the actual\
    \ code along with the software. Unfortunately, the concept was brought. A person\
    \ named Richard Stallman came up with the GNU project in 1983. This initiative\
    \ revived the concept of sharing information and source code publicly and, unsurprisingly,\
    \ got a lot of attention from fellow software and programming enthusiasts. The\
    \ aim was to create a Unix-like computer system that was composed of free software.\
    \ He also initiated a “free software movement,” which later on became the Free\
    \ Software Foundation. The GNU project brought certain development tools, some\
    \ of which Linus Torvalds used to engineer Linux. This is the reason why you may\
    \ find a controversy online about the name. While some suggest it should be named\
    \ as GNU/Linux, owing to the fact that the concept of free and open-source was\
    \ used as the project intended, there are those who simply call it Linux as it\
    \ was built from the ground up. Whatever name you choose to stick with, the end\
    \ result is nothing of brilliance. Now, open-source means that everyone in the\
    \ world has access and the chance to modify codes with ease. All it takes is a\
    \ bit of understanding of how codes work, and you can come up with your own version\
    \ of the OS. No other name comes to mind to showcase the sheer number of variations\
    \ or distros such as Linux. Ubuntu, Mint, Arch Linux, Fedora, Kali — these are\
    \ just some of the names that have caught the attention of the world. Each one\
    \ of them is slightly different. Some are designed for machines with the lowest\
    \ specifications, while others are designed to be more appealing in terms of design\
    \ and functionality. There is something for just about everyone out there. All\
    \ of the distros mentioned above are just some names you should know for now.\
    \ We will discuss these in chapter 2, where you will get to know each one of the\
    \ major distros better. You will also learn the purpose of each one of them and\
    \ the kind of people or professionals who use them. The more attention you pay\
    \ to the fine details, the easier it will be for you to understand and analyze\
    \ your own goals more clearly.\n"
