  trans: '

    学习脚本语言并应用它将带来最大的效率和最少的努力。这可能是这些脚本被不断使用的最流行的原因。


    ## 选择你的开发工具

    Linux 自带了最复杂的开发工具之一。其中一些是预装的，而很多可以供用户访问。无论你是正尝试成为软件开发者还是图像编辑者，在 Linux 的世界里，你一定能找到合你心意的东西。或许对这些工具进行快速简要的概述就能激发你的好奇心！


    ### C 编译器

    对于那些可能不知道 C 是什么的人来说，除了它是一个字母表之外，它是一种因其功能强大而获得极高受欢迎的语言。C 后来让位了许多今天仍在使用的语言、应用程序和软件。即使是大多数
    Linux 发行版，其源代码也是用 `C` 或 `C++` 编写的。


    好了，以上是对 `C` 的简要介绍。编译器到底是什么？你要知道，计算机除了 0 和 1 之外不理解任何语言。编译器是将我们将写给计算机的所有内容翻译成这些数字并向机器解释的东西。现在，`C`
    源编译器负责编译用 `C` 语言编写的源代码，并将其转换为二进制数字以便系统可以理解。


    这个工具对于从事 `C` 或 `C++` 语言的程序员来说是一个非常流行的选择。它简单、免费，并且能够带来快速有效的结果。如果你一直遵循指令并安装了 Ubuntu
    21.04，你已经拥有一个名为 `gcc` 的预装 `C` 和 `C++` 编译器。有关更多信息，请查看 `gcc` 手册 (`man gcc`）。


    ### Python

    当我们谈论编程语言时，我们无法忽视不断上升的 `Python` 语言。这种语言以令人印象深刻的速度获得了世界的关注。Python 以其动态性、解决复杂问题的能力、多线程等特性而闻名，Linux
    对 `Python` 有支持。对于开发者来说，你可以求助于同名为 `python` 的工具。你可以查看手册，以获取你可以用于这种语言的所有指南和选项。


    ### 调试器

    必不可少、重要，且坦率地说非常有用。如果你正在运行一个应用程序或程序而它崩溃了，你可能想要运行预装的调试器，它可以帮助你查看程序在崩溃时正在做什么。这类信息可以很大程度上帮助我们分析程序并在必要时重写代码。


    要访问调试器，你可以输入 `gbd`。或者，你可以通过它的手册或在网上寻求进一步的帮助。


    Linux 继续为各种语言的程序员提供开发工具，并继续通过顶尖的解决方案帮助这些专业人士。如果你希望从事编程事业，Linux 是最适合你的平台，而它的社区将是你获得正确开发工具所需的所有帮助。


    ## 第七章：增强你的体验

    这是一段旅程。我们开始时几乎不知道 Linux 是什么、托瓦尔斯先生（Mr. Torvalds）是谁，以及他对世界做了什么贡献。看看我们现在的处——积累了足够的知识来开始玩转
    Ubuntu、改变环境的动态、使用工具进行调整、使用终端等。在如此短的时间内取得了如此令人印象深刻的进展。


    Linux 尽管源于林纳斯（Mr. Linus）先生的时代，但它仍在增长，随之而来的是新的命令。虽然我们仍然无法列出所有这些命令，但现在我们将检查一些如果我们第一次看到会稍微更难理解的命令。这些命令旨在进一步增强你的体验，并尽可能为你让事情变得简单。


    ### 掌握新命令


    #### find 命令

    顾如其名，该命令旨在搜索特定文件或具有特定扩展的文件组。它还可以根据选项和参数执行搜索。


    假设一个目录中有几百个文件，你只记得一个文件的扩展名，扩展名是 `.txt`。你不记起它的名字。使用它来缩小结果并找到你需要的文件。要做到这一点，在要搜索的目录中打开终端并输入以下命令：


    ```bash

    find . -type f -name "*.txt"

    ```


    一旦你按下回车键，所有带有 `.txt` 扩展的文件都将作为结果显示在你面前。如果你删掉 `*` 号，终端将只搜索名为 `.php` 的文件，而不是将其视为扩展名。


    注意，如果你试图查找的文件具有 `.TXT`，它将不会显示在搜索结果中。这是因为 Linux 中的内容具有大小写敏感性。不过，你可以对命令进行细微修改，从而忽略大小写敏感并产生你需要的结果。要做到这一点，你只需要将
    `-name` 替换为 `-iname`。现在，你将看到扩展名为 `.TXT`、`.Txt`、`.TXt`、`.txt` 的文件，基本上是你你想到的所有组合。


    `find` 命令可以根据扩展名、名称、类型、权限甚至尺寸定位文件。你可以通过咨询此命令的手册来浏览该命令广泛且实用的用途。记住，当你迷路时，`man` 命令是你的朋友。


    #### GREP 命令

    在我们学习了帮助我们找到文件的 `find` 命令时，`grep` 命令则用于查找文件内的特定内容。


    假设你正在寻找一个包含某些信息或关键词的文件，而你不知道它在哪里，你可以依靠 `grep` 命令来为你完成工作。要执行此命令，请在终端上执行以下操作：


    ```bash

    grep "keyword" (filename.ext)

    ```


    将 `keyword` 替换为你正在查找的词。你可以添加尽可能多的文件名。`grep` 命令将高亮显示该字符串的结果。再次，如果你希望忽略大小写，请在引号前使用
    `-i` 选项。你甚至可以使用 `-n` 来找到该字符串所在的行号。


    为了更强大的结果，你可以结合 `grep` 和 `find` 命令为你的搜索带来新的水平。


    #### MAN 命令

    这现在应该有意义了，但如果由于某些原因你仍然不理解概念，不要担心。如果你有一个工具但找不到它的手册，只需在命令名前输入 `man` 即可立即显示完整的手册。


    我们已经使用过几次，它确实能帮助你度过困境。


    ## 接下来是什么？

    现在你已经有了入门的信息和知识，你现在应该对你感兴趣的特定领域获得更多知识。


    你们中的有些人可能对从事软件开发者职业感兴趣。有些人可能对成为成功的系统管理员感兴趣，而有些人甚至可能希望进入白帽黑客的世界——可能性是无限的。然而，这一切都从这里开始。


    我们强烈建议你练习并保持对 Linux 新动态关注。学习新的命令并参考教程、指令和书籍以获得更深知识。这本书旨在为初学者提供一个平台。我们确实希望到现在你具备了足够的知识来做出可能涉及
    Linux 的重大决策。


    ## Linux 的未来：光明还是其他？

    Linux 由于其是一个开源操作系统，已经走了很远。我们绝不是意味着它的时代已经结束。事实上，随着人们对 Linux 意识的不断增强，我们很快就会看到它真正登顶。


    如果你在考虑未来的前景，Linux 确实拥有充满前景的未来，而且与其竞争对手不同，它为寻求机会的人提供了广泛的选择和无限的机会。


    你仅受限于你的想象力——请好使用并明智地使用它！


    ## 结

    我们付出了努力确保这本书能够作为希望开启 Linux 世界之旅的人的一个良好起点。凭借其非凡的成功、不断增长的需求和存在，学习 Linux 仅仅是成功一半。


    目标是在保持良好读性的同时提供实用信息。祝给所有新的 Linux 用户，好运！


    ## 参考文献


