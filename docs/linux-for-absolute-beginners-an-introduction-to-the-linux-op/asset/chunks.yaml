    in the log files for you or the concerned person to see. Having multiple times
    will only cause confusion, which is why a uniform time is followed by everyone.
    However, before all that, let us fix the time of our own machine.Before you jump
    in and decide to use the GUI and set the clock to the time that is near to being
    accurate, it is best to understand one thing — adjusting time through this method
    will never be 100% accurate. You need something else to help you out in order
    to set the system’s time accurately.Every kernel maintains its very own system
    clock. This is the same clock that you can access by using the “date” command.
    Go ahead and type in the command in your terminal and hit Enter.You will be provided
    with the complete date, time, and the time zone. However, some of you may have
    noticed something off here. The time shown within the terminal as output is different
    from the one being shown in Windows. The bigger the difference in minutes, the
    worse the issue can get for you. The good news is, we are just beginners learning
    to perfect our command over the system. We are using a VM, so having a slight
    difference is okay. But what if we were using Linux as our primary system? How
    could we correct the time then?It is one thing to have a minute or two worth of
    difference, but even that can cost you quite a bit of confusion if you are dealing
    with log files with thousands of entries. Imagine how bad it would be if you have
    a ten-minute difference or more. For the sake of discussion, if you were using
    Linux as your primary OS, you would need to resort to the following command:hwclock
    –hctosys –utcFor VM users, this may return with an error!This effectively resets
    the system clock to the universal coordinated time and saves you from the worries
    of adjusting time every now and then for time zones, daylight savings, and so
    on. To answer a burning question “What is a practical example of where having
    synchronized time would help us?” here is a scenario.Let us suppose that at exactly
    quarter past noon tomorrow, we need to upgrade the system completely. We need
    to ensure no one is using the servers or the machines at that specific time. How
    can we do that?There is always email, but the fact of the matter is that not everyone
    follows these instructions. We need something that is more prominent and cannot
    be missed by anyone. Luckily, Linux provides us with a way to do just that.Look
    at the command below and try to figure out what just happens when you, as a super-user
    or an administrator, type this in and hit Enter:sudo shutdown -h +5 “scheduled
    maintenance ”You are informing the terminal that you, the administrator, wish
    to shut down the system by bringing it to a halt (h) after five minutes (+5).
    The message that everyone will be displayed will be the string shows between the
    quotation marks. This way, every single user will get the message accordingly,
    and precisely five minutes later, the system will no longer be accessible by anyone
    except you.You can provide an absolute time as well in the form of hours and minutes.
    For example, if you know the maintenance would begin at 12:15, simply use 12:15
    instead. If the system requires urgent attention, you can use “now,” which will
    immediately shut the system down for everyone.Now, the system will be in a single-user
    mode where you will be the only user logged in through the system console. Every
    non-essential service will be turned off. You can carry out the task to ensure
    maintenance work is done. Once all set, press Ctrl+D, and you should have the
    system turn back to multi-user mode.There are a few useful commands you can use
    instead of the -h or the halt method.'
