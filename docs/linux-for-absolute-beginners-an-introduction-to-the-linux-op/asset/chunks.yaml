- fmt: '

    # Changing Passwords for Users


    This is rather easily done on the graphical user interface. However, we will only
    be focusing on the terminal here and how we can use it to change the password.
    In order to do that, punch in the following command: `sudo passwd (username)`


    You can change any account’s password without logging into these as long as you
    are the super-user/root user.


    # Creating Groups


    We initially touched upon the term “group” when we were doing the permissions.
    We did not dive deeper to know what exactly is a group. Let us shed some light
    on this now as it is relevant to both the topic at hand and to you, the Linux
    user.


    For every file or directory, permissions are set out for owner, group, and others
    in that specific order. If you recall from our previous file permission exercise,
    you would see that normally the owner gets the permissions right away while others
    need to be modified to taste.


    A group is literally where a few users are found. For example, you may have a
    file that is relevant to the IT group. This group will have users who have everything
    to do with IT. Instead of assigning permissions to read and write to individual
    users, you can simply create a group and add the relevant users to this group.
    Now, when you share your file to the group, everyone within it will have access.


    To create a new group, simply type in the following command: `sudo groupadd (groupname)`


    # Changing Permissions for Group


    Now we have created a group, let us now share a file with it for read and write
    accessibility. Below is an example for you to see and try to figure out what was
    done. Don’t worry, all of these commands are already covered by us.


    ```

    touch file123

    mkdir test123

    mv file123 test123

    cd test123

    ls -l

    ```


    Did you figure out what we did there? If you haven’t, let us explain.


    We started out with the `touch` command to create a file named `file123`. We followed
    by creating a directory using the `mkdir` command, and we named it `test123`.
    We then moved the file using the `mv` command into the directory we created. Lastly,
    we entered the newly created directory and used the listing command (`ls -l`)
    to show us the permissions, owner, and group information.


    Yet again, the mighty terminal saves us time. Imagine doing that without the terminal.
    It would have taken a little longer to pull all that off. Anyways, enough with
    praising the terminal; let us move forward.


    As a test, let us wait here while you change the ownership to “group” to give
    them read and write permissions by using the `chown` commands. A tip: if it doesn’t
    go smoothly, use the `sudo` command!


    All done? Bravo! You have just changed the ownership of the file and provided
    the group with the required permission.


    ## “But we don’t have a user added to the group yet.”


    Right you are! That is why our next step is to ensure we learn how to add users
    to our newly created group. For the sake of an example, let us call this group
    “learners.”


    Use the following command to add the user within this group: `sudo adduser (username)
    learners`


    If you switch to the username you just added to the group and try to access `file123`,
    you will also be able to access it without any issues. The reason why that happened
    is that we have allowed the entire group to have ownership over the file and have
    the necessary permissions to view and edit them. Now, since your new user is a
    part of this group, the user will have similar access as well.


    To verify, use the `nano` command without the `sudo`, and you should now be able
    to write the file and edit the same as you please.


    This is something that can be seen in effect throughout major organizations and
    industries where thousands of employees and managers are added into groups and
    provided uniform access to files and directories that serve them some purpose.


    We will also be looking at some other commands and examples further on. For now,
    let us get a little deeper into system configuration — what it is, why we need
    to configure the system, and what can it do for us in return. These are some of
    the questions that you should be able to answer at a beginner level. For advanced
    usage of the system and its configurations, you can refer to great books and browse
    through the Ask Ubuntu community for further guidance.


    # Configuring Your System


    We now have good knowledge about who super users are, what they do, and how they
    can add and remove files, users, and so on. The most important aspect for a super
    user is to ensure that the system is configured properly. This means from the
    tiniest details, such as the time, all the way to maintaining the server and carrying
    out the necessary tasks. As the main user, you will have the right to type in
    a few commands that should immediately alert every user on that machine or server
    that the entire system is about to be brought to a halt or will not be available.


    During this time, only you will have access to the files, directories, and all.
    This method allows you to carry out updates, change files, upgrade the system,
    or carry out any maintenance work.


    While all that is true, why did we mention time? Every user on the server or the
    machine will be following a single time as set by the main user. It is imperative
    that every user follows the same as this makes logging easier.


    If you run a large organization where users will have to sign in using thumb impressions
    or where they need to type in their passwords, modify files, create new ones,
    or even move/delete them, you must be able to know exactly when the action was
    carried out. The entire information will be available in the log files for you
    or the concerned person to see. Having multiple times will only cause confusion,
    which is why a uniform time is followed by everyone. However, before all that,
    let us fix the time of our own machine.


    Before you jump in and decide the time... (Note: The provided text ends abruptly
    in the source).

    '
