    you as a result. If you remove the * sign, the terminal will only search for a
    file that is named as .php instead of treating it as an extension.Note that if
    the file you are trying to find has .TXT, it will not be shown within the search
    result. The reason for that is the case-sensitive nature of things in Linux. However,
    there is a slight modification you can do to the command that will then overlook
    case-sensitivity and produce the results you need. To do that, you simply need
    to replace -name with -iname. Now, you will see files with extensions .TXT, .Txt,
    .TXt, .txt, pretty much all combinations you can think of.The find command can
    locate files with extensions, names, types, permissions, and even sizes. You can
    browse through the vast and practical uses of this command by consulting the manual
    of this command. Remember, when you are lost, “man” command is your friend.GREP
    CommandWhile we learned about the find command, which helps us find files, the
    grep command finds specifics within files.Suppose you are looking for a file that
    contains certain information or keywords and you have no idea where it is located,
    you can rely on the grep command to do the job for you. In order to execute this
    command, do the following on your terminal:grep “keyword” (filename.ext)Replace
    the keyword with the actual word you are looking for. You can add as many filenames
    as you wish. The grep command will include them within the search result. The
    result will then highlight the text, where it is found, and provide you with the
    information as to which file contains the said keyword. Again, if you wish to
    overlook the case-sensitive cases, use the -i option before the quotation mark.
    You can even use -n to find out which line number of which file contains the string
    you are searching for.For even more powerful results, you can add both grep and
    find commands to bring a new level of efficiency to your search results.MAN CommandThis
    might have already made sense by now, but if for some reason, you still did not
    get the concept, don’t worry. If you have a tool and you cannot find the manual
    for it, simply type “man” before the command name, and you will immediately be
    shown the complete manual.We have used this quite a few times, and it is something
    that truly helps you out of sticky situations.What’s Next?Now that you have enough
    information and knowledge to get started, you should now gain further knowledge
    into specific fields that might interest you.Some of you may be interested in
    pursuing a career as a software developer. Some may be interested in becoming
    a successful system administrator, while some may even wish to enter the world
    of ethical, white-hat hacking — the possibilities are endless. All of them, however,
    start from here.We would highly recommend you to practice and keep yourself up
    to date with Linux news. Learn newer commands and resort to tutorials, instructions,
    and books to gain deeper knowledge. This book was intended to serve as a platform
    for beginners. We do certainly hope that by now you are equipped with sufficient
    knowledge to start making some life-changing decisions that may involve Linux.Future
    of Linux: Promising or Otherwise?Linux, owing to the reason that it is an open-source
    OS, has come far. By no means do we imply that its time has come to an end. In
    fact, with an ever-increasing awareness of Linux, we are sure to witness its true
    rise to the top very soon.If you are thinking about the future prospects, Linux
    certainly holds a promising future and, unlike its counterparts, allows a vast
    array of options and endless opportunities for those who seek them out.You are
    only limited by your imagination — use it well and use it wisely!CONCLUSIONA ll
    efforts have been put in to ensure that this book serves as a good starting point
    for people who wish to embark on a journey into the world of Linux. With its phenomenal
    success, an ever-increasing demand and presence, learning Linux is only half the
    battle.The aim was to provide information with practical usage while maintaining
    good readability. To all the new Linux users, good luck!REFERENCES'
