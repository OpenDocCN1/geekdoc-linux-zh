    | -r | 此命令将重启系统。 |

    | -k | 当说这意思是“开玩笑”时，我们并不是在搞笑。此命令会广播消息，通知其他用户计划进行维护。它并不会真的执行关机。 |

    | -c | 如果你想取消关机，可以使用此命令。 |


    我们将涵盖更多关于网络的内容，以及如何利用可用命令和工具，以确保工作执行时，每台机器都与服务器同步并采取相应的行动。除了执行维护外，你可能还会遇到系统问题。你当时不在位或离开了系统，而系统由于未知原因崩溃了。当你回来时，会对现状感到惊讶。你脑海中浮出的第一个问题将会是“发生了什么？”


    如果你是一个不知道从何下手的人，系统日志记录（system logger）就是你的最佳起点。系统日志记录负责跟踪整个系统中发生的所有事件。它会创建一个日志文件，你可以随时访问，以理解可能哪里出了问题。


    `syslog` 文件可以在 `/var/log` 目录下找到。执行该文件，你就能相应找到带有时间戳的事件、响应、错误、原因等所有相关细节。对于所有系统管理员来说，这些文件非常重要，并且在需要时必须使用它们来相应解决问题。没有这些文件，几乎不可能找到问题的根源并采取适当的行动。这些文件为你节省了时间和精力，在少数情况下，还能避免很多尴尬。如果你最终执行了所有已知的命令来纠正一个根本不存在的问题，而有人访问了这个文件揭示了问题只是一个简单的文件放错了，这对所有人来说无疑是一个巨大的震惊。


    作为一个未来将要配置系统的人，你将被要求安装、升级、更新、甚至删除文件或应用程序。我们已经知道如何做到了。事实上，我们已经对 `apt-get`、`apt-cache`
    和其他命令进行了一些练习。尽管如此，并不是所有的发行版都支持所有的文件格式。有些格式脱颖而出，因此是某些类型 Linux 发行版的独有。让我们简单看看其中一些以便建立了解。


    1. `.rpm` 文件 — 这些安装包主要由 Fedora、Red Hat、CentOS 以及其他发行版支持。基于 Debian 的发行版（如 Ubuntu）不支持这些文件。这些文件使用名为
    `yum`、`rpm` 和 `dnf` 的独立命令。

    2. `.deb` 文件 — 这些是 Debian 软件包，受所有基于 Debian 的发行版支持，包括 Ubuntu。我们已经看到这些是通过 `apt-get`
    和 `dpkg` 命令安装的。

    3. `.tar.gz` 和 `.tar.bz2` 文件 — 这些非常不同，本质上是压缩的 tar 文件。它们无法直接安装，因为它们内部包含各种文件和文件夹，使用
    `gzip` (`.gz`) 和/或 `bzip2` (`.bz2`) 压缩。与之前的两个文件不同，这些需要很多步骤才能完成安装。


    尽管由于现代安装器的存在，如今在 Linux 上安装错误类型的文件几乎是不可能的，但了解哪些文件属于哪里仍然是好的。系统配置是一项相当忙碌的任务。请放心，这只是你可能第一次感到压力。一旦大多数事情到位了，你就不会再感到保持一切对齐和更新的压力。大部分任务将由系统为你完成。万一真的出了问题，你始终可以查阅日志文件。开源操作系统的伟大之处在于，社区内的每个用户都可以轻松地帮助你解决问题，在整个
    Linux 之旅途中，你可能会掌握大量的代码和基础知识。只要掌握足够，你就能成为一名成功的系统管理员。


    ## 资源与进程


    在我们进入资源分配、进程以及允许我们深入研究这些内容的领域之前，让我们想象一个场景。我们拥有一台花钱能买到的最好的机器，它配备了顶级的规格。它拥有最好的内存、最精密的
    CPU、终极显卡，以及所有你梦想在一台真正强大的计算机上拥有的东西。某一天，你启动了一个进程，结果系统立即停止运行或开始慢得像爬一样。你能想象你将经历怎样的挫败感吗？尽管有最好的配置，你的电脑仍无法正常执行操作，而你完全不知道为什么。这种折磨足以让任何计算机用户崩溃。


    为了让我们理解为什么这种情况经常发生在最先进的机器上，我们需要更深入地研究进程的工作原理以及资源是如何供用户的。系统拥有的三个核心资源是 CPU 本身、内存和
    I/O（输入输出）。将这些中的任何一个排除在外，系统运行都不会太良好。这些被归类为硬件资源。


    另一方面，`kernel`（内核）负责无偏地将所有可用资源分配给进程。讽刺的是，`kernel` 本身是一个软件资源，帮助进程执行用户要求的各种任务。`kernel`
    与硬件资源之间的关系如果被干扰或中断，将导致系统故障。系统会有资源，但没有媒介让程序使用它。它就像是放在桌上的一杯水，却没有人喝。


    成功资源管理背后的艺术是使用一种可以实时为你提供所需信息的工具。许多程序和任务可能不会消耗大量资源，但确实有一些需要相当大量的可用资源。由于 `kernel`
    是无偏的，`kernel` 将为此类程序分配所需的资源。


    要找出到底是什么在使用你的资源、消耗了多少资源，以及进程活动了多长时间，我们使用一个名为 `top` 的命令。在你的终端中输入该命令看看会发生什么。Windows
    用户可能想起过任务管理器工具的使用。这是 Linux 对应的对应工具。屏幕上立即挤满了许多数字、名称、事实和数据。虽然你可能认为自己有足够的性能，但这个工具现在将向你展示所有资源的使用情况。让我们看看这些项目中的每一项并学习它们对应于什么。


    | 列 | 说明 |

    | :--- | :--- |

    | PID | 这是进程 ID。列出的或稍后添加的每一个进程都有一个特殊的标识符。通过这些 ID，一旦你掌握了这些工具，就可以学习如何更有效地管理进程。 |

    | USER | 这仅仅是告诉你哪个用户正在使用该进程。 |

    | PR | 此标签显示正在运行的任务的优先级。如果此字段中的任何任务显示为“rt”，则表示实时调度优先级。 |

    | NI | 这代表（我们不是在编造）相关任务的“nice”值。如果这个值为负数，任务的优先级更高。如果这个值为正数，任务的优先级较低。 |

    | VIRT | 显示该任务正在使用的虚拟内存大小。 |

    | RES | 显示任务正在使用的物理内存（非交换）。 |

    | SHR | 显示任务可用的多少共享内存。 |

    | S | 显示进程状态。此字段有进一步的选项，如下： |


    * `-D` – 不可中断的睡眠 (uninterruptible sleep)

    * `-R` – 运行中 (running)

    * `-S` – 睡眠 (sleeping)

    * `-T` – 被作业控制信号停止 (stopped by job control signal)

    * `-t` – 在跟踪期间被调试器停止 (stopped by debugger during a trace)（记住，大小写敏感）

    * `-I` – 空闲（以前为僵尸进程 Zombie）

    * `%CPU` – 显示进程占用 CPU 的百分比 |


    '
