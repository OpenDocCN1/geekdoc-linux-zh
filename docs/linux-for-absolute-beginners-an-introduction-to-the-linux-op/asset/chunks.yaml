    that these distributions are effective and work far better than most of the proprietary
    operating systems available in the market. That is a great advantage of open-source
    OS, which is unrivaled by the opposition.There is one thing that should be understood
    clearly. Open-source does not mean that the software or the license would be free
    of cost. Yes, you may find most of the flavors of Linux for free, but you should
    always ensure that you fully understand the limitations of the licensing. There
    are certain variants where you may not be allowed to use a specific kind of Linux
    distro for commercial purposes. Doing so would either violate the terms of licensing
    or have you pay a hefty fee. Moreover, open-source does not necessarily allow
    you to modify the codes every time. With Linux, most of the existing variants
    encourage users to modify the Linux kernel but always ensure you keep an eye out
    for details. With that said, let us now look at a few examples to understand just
    how important and cost-effective Linux is.Who Uses Linux?The answer to this might
    not be so simple. Surely, you may have thought of software engineers and programmers,
    but the use of Linux is not limited to just these groups of people. Linux is widely
    used by almost everyone these days.Yes, programmers and software professionals
    certainly do use Linux. It is their heaven, their playground, and their field
    of expertise. However, owing to the open-source nature of the entire OS, there
    are versions that have been created to cater to a larger scale of audience. To
    give you a better idea, here are a few examples to further highlight the various
    users you can expect in the world of Linux:1\. Governments: Surprised? There is
    a perfectly good explanation for this. Governments are under constant pressure
    to maintain their expenses and limit them to the lowest numbers possible. This
    ensures they save enough to utilize the massive amount elsewhere. Imagine the
    entire parliament — the local governments, the mayor officers, and everyone related
    to the government — using proprietary software such as Windows. Can you imagine
    the cost they would have to bear just to install a genuine copy on each system?
    Linux allows them to have unimaginable savings and offers them far more security
    than any other operating system. Quite a win-win scenario, don’t you think?2\.
    Businesses: Sure enough, every major business organization ensures they protect
    their valuable data and have a network that is flawless and operates fluidly.
    This is something where Linux shines in a class of its own. Add to this the fact
    that Linux saves them a chunk of money, and there remains no reason why large
    corporations and organizations would not use Linux and go for something else instead.3\.
    Major institutions: We are not just referring to schools or universities; we are
    talking of institutions such as NASA. With such giants relying on Linux distros,
    there is little to question the credibility and reliability of this operating
    system.We did mention earlier that there is something for just about anyone when
    it comes to Linux. With various distributions emerging almost every other day,
    there is no greater example to suggest how well the open-source concept works
    and what is it capable of.From this point on, we shall be focusing more toward
    you, an individual user. Although there will be references to enterprise setups,
    networking, and security used on a massive scale, our primary objective would
    be to get you to speed with the basics. As a beginner, it would be unfair and
    probably too complicated for you to understand and master Linux just by the end
    of this book. It is recommended that you seek guidance and resources to gain further
    in-depth knowledge on specific aspects. This book, however, will serve you as
    a foundation upon which you can build your Linux journey on.CHAPTER TWoDiving
    into LinuxW ell done! You now know Mr. Torvalds, the founder and creator of Linux,
    the history behind its creation, and the one that Linux continues to make every
    single day. You picked up a few terms along the way as well, such as kernel ,
    source code , open-source . All of that is important, so do pat yourself on the
    back there.Every Linux user has a certain purpose for which they use this OS.
    What about you? What exactly is it that drove you to consider Linux as your primary
    OS? What is the objective you aim to seek and accomplish by becoming a Linux user?These
    questions aren’t posed to test you; they are something you should ask yourself
    and come up with an answer. Why? Your answer will decide which direction you go
    to. Just as we learned earlier, the original Linux, the one that our friend Mr.
    Linus came up with, has been modified into thousands of variants. Each one of
    them serves a different purpose and has certain unique components to offer. Depending
    on what you answer is, you will then proceed to choose your flavor.Quite a few
    people make a grave mistake and immediately rush to websites to grab a copy of
    the distro that is “famous.” It is only after installation that they realize it
    has nothing to offer that is considered usable.If you have no idea about where
    a good starting point would be, you can go for Ubuntu. Once you start getting
    the hang of things, you can opt for a different distro and use that to accomplish
    your purpose.Which Distribution to Select?This is where the efforts have been
    to minimize details and aim straight for the target, helping you select your distro.
    Remember, if you aren’t too sure yet, there is no need to panic. Simply grab a
    copy of Ubuntu, and most of the things explained in this book should apply for
    all Ubuntu users.To break things down, here is a list of some popular versions
    and the purpose they seem to serve best:UbuntuThis distribution is perhaps the
    most famous one out there. It is suited to those who are just beginning their
    journey into the world of line user interface (LUI), command lines, and all Linux-related
    tools and operations. It is yet another open-source distribution based on Debian
    distribution (yet another distribution of Linux). The word Ubuntu (pronounced
    as oo-boon-too ) means “humanity to others.”This specific distribution has garnered
    quite a lot of attention as it is available for free. It is meant for personal
    computers (PCs) and for more advanced purposes on servers as well. This comprises
    of standard Linux desktop applications, a fluid graphical user interface (GUI),
    and is better in terms of performance as compared to Windows 8 versions or 10\.
    What makes it incredibly easy to use is something called GNOME (GNU network object
    model environment). This is employed to make life easier for folks who have no
    clue about programming. To make things more interesting, even Ubuntu has several
    variants, some of which are listed below:'
