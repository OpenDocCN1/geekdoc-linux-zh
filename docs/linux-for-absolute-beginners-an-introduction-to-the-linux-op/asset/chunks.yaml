- fmt: "\n# Linux Mint\nQuite a flavor this one, and for all the right reasons too.\
    \ It is light and can work even on the lowest of specifications. With a minimalistic\
    \ GUI, the OS will run smooth and should pose no problems in terms of performance.\n\
    \n# Red Hat Enterprise Linux (RHEL)\nNow this is a tricky one. It is known to\
    \ be a top choice for business organizations, enterprises, and even government\
    \ agencies. Known for its functionality for desktop and server versions, it stands\
    \ out from thousands of distros and has one of the most active communities in\
    \ the Linux distro lineup. If you are someone who is thinking to learn Linux and\
    \ use it for large-scale business purposes, servers for organizations, or government,\
    \ this should be your eventual goal. Remember, we are learning the basics first.\n\
    \n# Kali Linux\nIf you have ever heard of ethical hacking, this is the platform\
    \ where it all happens — a white-hat solution for ethical hackers. The purpose\
    \ of `Kali Linux` is to analyze the security measures in place, beef up security,\
    \ and allow ethical hackers and cybersecurity experts to use tools for maximum\
    \ benefits. It is another Debian-based distribution that was designed to test\
    \ the security of servers, websites, and so on. If you aim to seek a career in\
    \ white-hat, ethical hacking, you should aim for this one after you have got the\
    \ hang of some essential commands.\n\n# Fedora\nThis is known for being a distro\
    \ that gives its users all the latest features while being highly customizable.\
    \ This distro of Linux is backed by Red Hat. It is among the most popular distros\
    \ of Linux out there. It is constantly rolling out new software, features, and\
    \ updates.\n\n# Elementary OS\nThis is perhaps the most appealing in terms of\
    \ looks and feel. This version of Linux uses Pantheon desktop environment, which\
    \ makes it look like a better version of Mac OS. However, there is a downside\
    \ to this one. If you are looking for an OS that packs a few preinstalled applications,\
    \ this is probably not the one you might fancy.\n\nThere is no rush for you to\
    \ decide. You can take your time or just go for Ubuntu. Once you are set, it is\
    \ time to start creating space and downloading your very own copy of Linux.\n\n\
    # Downloading and Installing Linux\nFollow this simple step-by-step guide, and\
    \ you will be operating your very own copy of Ubuntu on what is called a virtual\
    \ machine in no time.\n\n## Step 1: Downloading virtualization software\nFor the\
    \ virtualization, we will download `VirtualBox`. Open your browser and head on\
    \ over to `http://www.virtualbox.org/` `www.virtualbox.org`. Immediately, you\
    \ will be presented by quite a big button that says “Download.” Currently, as\
    \ of June 2021, the button says “Download VirtualBox 6.1.22” This might change\
    \ should a new version come out by the time you read this. After you click on\
    \ the download button, you will be taken to a page where you will be able to select\
    \ from a bunch of options. Choose the host version for your current OS.\n\nOnce\
    \ done, open the downloaded file and scroll through the installation prompt as\
    \ you would normally do on any other software installation. Should you wish to\
    \ customize anything, such as change the destination folder for the installation\
    \ or add/remove quick launch button, feel free to do so. Once all set, click on\
    \ “Next,” and the installation should begin.\n\n## Step 2: Downloading your copy\
    \ of Linux\nQuick question! Which Linux flavor did we talk about using the most\
    \ for this book?\n\nIf your answer is Ubuntu, well done! You followed the directions\
    \ to perfection. Head on over to `http://www.ubuntu.com/` `www.ubuntu.com` to\
    \ get the process started. Right at the top, you should be able to see an option\
    \ that says “Download.” Click on that and stop!\n\nYou may see the long-term support\
    \ (LTS) version, but we are not interested in those at this point in time. Let’s\
    \ go ahead and click on the current non-LTS version. Right now, we have `21.04`,\
    \ which is also called as `Hirsute Hippo`. Funny name? Most certainly! Go ahead\
    \ and download the `.ISO` image onto your computer. It may take a while, so feel\
    \ free to kill some time. Once we are all set, let us begin the third step.\n\n\
    ## Step 3: Installation\nWe have already installed the `VirtualBox`, and now we\
    \ have the `.ISO` image of the Ubuntu. Now, it is time to launch `VirtualBox`.\
    \ Once the application loads, click on the blue raggedy circle that says “New.”\n\
    \nLet us name the new virtual machine (VM) as `Ubuntu`. Select the target folder\
    \ to you choosing or leave it as it is — it really doesn’t matter. The default\
    \ type should show as Linux, but if it doesn’t, ensure that you use the drop-down\
    \ menu and select Linux as your type. The version should be `Ubuntu_64` (most\
    \ of the machines would run that).\n\nNow, click on “Next,” and you will be asked\
    \ to allocate the memory size. Remember, the more memory the VM has, the better\
    \ it can run and operate. Let’s stick to 50% of your memory at most. You can allocate\
    \ a smaller size if you have lesser memory available, but do not go below the\
    \ recommended size. Once you are happy with your selection, it is then time to\
    \ take yet another decision.\n\nThe system will now ask you if you would like\
    \ to set up a virtual hard disk. The recommended size is `25.0 GB`. You can either\
    \ stick to that or increase/decrease per your desire. Ensure that you leave the\
    \ black selection dot on “Create a virtual hard disk now.” We do not wish to go\
    \ into the advance setups right now. Click on “Next,” leave the current selection\
    \ on Virtual Disk Image (`VDI`), and move ahead.\n\nHere, you will have the option\
    \ of either going for a dynamically allocated disk size or a fixed-sized disk.\
    \ While you can leave the setting at the default selection (i.e., dynamically\
    \ allocated disk), it is recommended that you should change it to a fixed-size\
    \ setting. “Why?” we hear you ask. Let’s come up with an answer that is short\
    \ and concise.\n\nHaving a fixed-sized disk allows the VM to work within that\
    \ allocated space. This does take a little time, and you might have to wait for\
    \ a bit. Having a dynamically allocated disk is quick, but it is where things\
    \ can go bad in terms of performance. There is no specific place on the disk that\
    \ will be allocated to write on. The data will be all over the disk, and this\
    \ can cause quite a lot of problems for your machine’s performance and functionality.\n\
    \nWith that said, click on the fixed-sized option and click on “Next.” Allocate\
    \ the size of the disk or use the recommended size that is displayed in bold letters.\
    \ Click “Next,” and sit back and relax as the system will now create a virtual\
    \ disk image (`VDI`). This should take anywhere between five and ten minutes,\
    \ depending on the performance of your machine and the space that you have allocated\
    \ for the `VDI`.\n\nNow, you are just moments away from launching Linux for the\
    \ first time. Click the big green arrow pointing right that says “Start.” Not\
    \ exactly what you were expecting, right? That is because we haven’t loaded the\
    \ `.ISO` image we downloaded. Click on the folder with green arrow next to the\
    \ empty field. Browse to the location where Ubuntu was downloaded and choose that.\
    \ Now, click on start.\n\n## Step 4: Setting up Ubuntu\nAt last! We have lifted\
    \ off. In a few moments, you will see the welcome screen for Ubuntu setup and\
    \ installation. There is absolutely nothing to worry about now we have gone through\
    \ the tricky bits. All you need now is to set up as please and move on. Most of\
    \ the settings have already chosen for you. Start off by clicking “Install Ubuntu”\
    \ and clicking “Next.” You will come across a specific screen where it asks you\
    \ would like to erase and install. Simply click “Next.” We have already allocated\
    \ the unused space for that. With that said, the installation will begin shortly.\
    \ This is going to take some time as you have dedicated part of your VM. After\
    \ successful installation, the system should reboot, and you should be welcomed\
    \ by sign-in screen. Log in using the password that you may set earlier, and voila!\n\
    \nIf you are running Windows 10, you might see the following error:\n```\nFailed\
    \ to open session for virtual machine\nVT-x features locked or unavailable\nVERR_VMX_OR_DISABLED\n\
    Result Code: FAIL (0x80004005)\nComponent: Console\nInterface: db7abca3f-4183-c1208da9239\n\
    ```\nIn this case, you will need to shut down your computer, restart, and enter\
    \ BIOS settings. From there, you will need to enable “Virtualization” option.\
    \ That should do the trick for you, and you should now have no trouble running\
    \ Linux. If you run into more trouble you should have no problem in locating solution\
    \ as there are hundreds of forums where people provide viable solutions. This\
    \ ends the long process.\n\n# Familiarizing with the Interface\nNow it is time\
    \ to start playing around with the GUI, the desktop, and various interesting-looking\
    \ applications that are pre-installed. I am not saying that might be pleasant\
    \ first; however, once you get the hang of things, it should make sense. The desktop\
    \ holds most of important aspects, such as your dock (left side), where all pinned\
    \ or active apps float. For Mac OS friends, this might seem little too familiar.\
    \ You have the top panel which shows your clock, a few indicators, and user menu.\
    \ The user menu is where you can turn OS off or restart or access other functions\
    \ that will be useful. Using the user menu, you can access system settings by\
    \ clicking on the bottom left icon that looks like cogwheel. Here, you can configure\
    \ settings to your liking and ensure everything looks and feels the way you prefer.\
