    | Command | Description |

    | :--- | :--- |

    | `cd` | 将带你回到主目录（不带参数）。 |

    | `cd ..` | 将带你进入上级目录。 |

    | `cd /` | 将带你进入根目录。 |

    | `cd ./` | 点斜杠表示“当前目录”。 |

    | `cd ../` | 回退到上级目录并进入下一个选中的目录。 |

    | `cd ~` | 输入此命令，你将回到主目录。 |

    | `cd ~/` | 访问主目录内以斜杠命名的目录。 |


    ## `ls` 命令


    这是一个非常实用的命令。我们非常期待开始在目录之间来回。然而，你可能会遇到某些地方，此时你并不确定其中是否包含任何可以浏览的文件或文件夹。由于这是命令行界面，没有图形界面来显示我们似乎进入的目录中包含什么内容。不过，你也有办法可以发现这一点。


    要检查你当前所在工作目录的内容，只需输入以下命令：


    ```

    ls

    ```


    终端现在应该为你提供目录、文件以及任何可能放置在那里的其他材料（如图片和图形）的列表。这些将按字母顺序排列。然而，这个命令的功能非常广泛。让我们探索一下 `ls`
    的其他命令。


    ### `ls -r`


    起初看起来可能并不很有用，但请放心，它可能会派上用场。这个命令的作用与简单的 `ls` 命令几乎相同。唯一的区别是这里的列表将按字母反序排列。如果你有很多文件，并且需要访问一个以字母
    U 开头的文件，这就会非常方便。


    ### `ls -l`


    假设你有一许多文件，并想要确定你拥有哪些文件权限。你不一定可以编辑所有文件、读取它们或访问它们。为了找出这一点，你可以使用以下命令：


    ```

    ls -l

    ```


    你现在实际上是在命令终端查看所有文件，并包含所有者和位置等详细信息，但我们更感兴趣的是组成左侧前十个字符的符号和字母。这是一个为了更好地向你解释的典型例子：


    ```

    drwxr-xr-x 3 exampletest exampletest 4096 Sep 01 12:00 Desktop

    ```


    使用 `ls -l` 命令，我们现在发现了关于当前位置内所有目录和文件的宝贵信息，并且现在可以看到每一个所拥有的权限。


    *   第一个字符显示文件类型。可以是 `d` 表示目录，`l` 表示链接，`p` 表示命名管道，`c` 表示字符设备，`-` 表示文件以及 `b` 表示块设备。

    *   第二到第四个字符提供了所有者对该文件或文件夹的读取、写入和执行权限的信息。

    *   第五到第七个字符提供了文件所在组对该文件或文件夹的读取、写入和执行权限的信息。

    *   第八到十个字符提供了所有其他用户对该文件或文件夹的读取、写入和执行权限的信息。


