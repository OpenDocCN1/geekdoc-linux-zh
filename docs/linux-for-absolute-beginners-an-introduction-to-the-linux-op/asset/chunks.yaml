    ## Choosing Your Development Tools

    Linux comes with one of the most sophisticated development tools. Some of them
    are pre-installed, while quite a few are available for users to access. Whether
    you are trying to be a software developer or an image editor, there is something
    you will surely find within the world of Linux that would suit your fancy. Perhaps
    a quick and brief overview of these tools would get the curiosity up and running!


    ### C Compiler

    For those of you who may not know what C is, except for it being an alphabet,
    it is a language that gained immense popularity for its functionality. C later
    gave way to so many languages, applications, and software that are being used
    even today. Even most of the Linux distros have their source codes written in
    `C` or `C++`.


    Okay, that was a brief introduction about `C`. What on earth is a compiler? You
    see, the computer does not understand any other language apart from ones and zeroes.
    The compiler is what translates all that we write into the computer into these
    digits and explains it to the machine. Now the `C` source compiler is what compiles
    the source code, written in `C` language, and converts it to binary digits so
    that the system may understand.


    This tool is quite a popular option with programmers who work on `C` or `C++`
    languages. This is easy and free to use and allows quick and effective results.
    If you have been following the instructions and installed Ubuntu 21.04, you have
    a pre-installed `C` and `C++` compiler called the `gcc`. For more information,
    check out the `gcc` manual (`man gcc`).


    ### Python

    When we speak about programming languages, we just cannot overlook the ever-rising
    language of `Python`. This language had garnered attention from the world at quite
    an impressive rate. Known for its dynamics, its ability to solve complex problems,
    multithreading, and so much more, Linux has its support for `Python`. For developers,
    you can resort to a tool under the same name `python`. You can check out the manual
    for all the guidelines and options that you can use for this language.


    ### Debugger

    Essential, important, and frankly quite useful. If you are running an application
    or a program and it crashes, you may want to run a pre-installed debugger that
    helps you see what the program was doing when it crashed. This kind of information
    can greatly help us in analyzing programs and re-writing codes, if needed.


    To access the debugger, you can type in `gbd`. Alternatively, you can go through
    its manual or seek further help online.


    Linux continues to provide programmers of various languages with development tools
    and continues to help these professionals with top-notch solutions. If you wish
    to pursue a career in programming, Linux is the platform for you, and its community
    is all the help you will ever need to get the right development tools.


    ## CHAPTER Seven: Enhancing Your Experience

    This has been quite a journey. We started off with practically no knowledge about
    what Linux is, who Mr. Torvalds was, and what his contribution was to the world.
    Look where we stand now — packed with enough knowledge to start playing around
    with Ubuntu, changing the dynamics of the environment, tweaking things with tools,
    using terminals, etc. Quite an impressive progress in such a short span of time.


    Linux, despite its root coming from the days of Mr. Linus, continues to grow,
    and along with it comes new commands. While we still cannot list down all of these,
    we will now check out some commands that would have been slightly tougher to understand
    had we seen them first. These commands aim to further enhance your experience
    and ease matters for you wherever possible.


    ### Getting a Grip on New Commands


    #### Find Command

    As the name implies, this command is meant to search for specific files or a group
    of files with a specific extension. It can also perform searches as per the options
    and arguments.


    Suppose you have hundreds of files in a directory and you only remember a file
    by its extension, which was `.txt`. You cannot recall the name. Use this to narrow
    down the results and find the file you need. To do that, open the terminal in
    the directory you wish to search for and type in the following command:


    ```bash

    find . -type f -name "*.txt"

    ```


    As soon as you hit Enter, all the files with the `.txt` extension will be displayed
    before you as a result. If you remove the `*` sign, the terminal will only search
    for a file that is named as `.php` instead of treating it as an extension.


    Note that if the file you are trying to find has `.TXT`, it will not be shown
    within the search result. The reason for that is the case-sensitive nature of
    things in Linux. However, there is a slight modification you can do to the command
    that will then overlook case-sensitivity and produce the results you need. To
    do that, you simply need to replace `-name` with `-iname`. Now, you will see files
    with extensions `.TXT`, `.Txt`, `.TXt`, `.txt`, pretty much all combinations you
    can think of.


    The `find` command can locate files with extensions, names, types, permissions,
    and even sizes. You can browse through the vast and practical uses of this command
    by consulting the manual of this command. Remember, when you are lost, `man` command
    is your friend.


    #### GREP Command

    While we learned about the `find` command, which helps us find files, the `grep`
    command finds specifics within files.


    Suppose you are looking for a file that contains certain information or keywords
    and you have no idea where it is located, you can rely on the `grep` command to
    do the job for you. In order to execute this command, do the following on your
    terminal:


    ```bash

    grep "keyword" (filename.ext)

    ```


    Replace the keyword with the actual word you are looking for. You can add as many
    filenames as you wish. The `grep` command will include them within the search
    result. The result will then highlight the text, where it is found, and provide
    you with the information as to which file contains the said keyword. Again, if
    you wish to overlook the case-sensitive cases, use the `-i` option before the
    quotation mark. You can even use `-n` to find out which line number of which file
    contains the string you are searching for.


    For even more powerful results, you can add both `grep` and `find` commands to
    bring a new level of efficiency to your search results.


    #### MAN Command

    This might have already made sense by now, but if some reason, you still did not
    get the concept, don’t worry. If you have a tool and you cannot find the manual
    for it, simply type `man` before the command name, and you will immediately be
    shown the complete manual.


    We have used this quite a few times, and it is something that truly helps you
    out of sticky situations.


    ## What’s Next?

    Now that you have enough information and knowledge to get started, you should
    now gain further knowledge into specific fields that might interest you.


    Some of you may be interested in pursuing a career as a software developer. Some
