    | -r | This reboots the system. |

    | -k | We are not joking when we say this means “kidding.” This command broadcasts
    a message to inform other users of scheduled maintenance. It doesn’t really perform
    a shutdown. |

    | -c | If you wish to cancel a shutdown, this is your command to go to. |


    We will cover more about networking and how to make use of the available commands
    and tools to ensure the work is carried out where every other machine is in sync
    with the server and acts accordingly. Apart from carrying out maintenance, you
    may also encounter issues with the system. You were off duty or away from the
    system, and the system crashed for an unknown reason. You come back and are taken
    by surprise at the state of affairs. The first question to pop up would be “What
    happened?”


    If you are someone who has no idea where to begin, the system logger is your best
    starting point. The system logger is what keeps track of everything that happens
    in the entire system. It creates a log file that can be accessed at any time to
    understand where things may have gone wrong.


    The `syslog` file can be found under `/var/log` directory. Execute the file, and
    you should be able to find out all the relevant details accordingly with timestamps,
    events, responses, errors, reasons, etc. For all system administrators, these
    files are important and must be used whenever needed in order to resolve issues
    accordingly. Without these files, it is virtually impossible to find out the root
    of the problem and take appropriate actions. These files save you time, effort,
    and in rare cases, quite a lot of embarrassment. It would certainly be a shock
    to all if you end up performing all the known commands to rectify a problem that
    isn’t there to begin with and someone accesses this file to reveal that the problem
    was just a simple misplaced file.


    As someone who will be looking to configure systems in the future, you will be
    required to install, upgrade, update, or even remove files or applications. We
    already know how we can do that. In fact, we did some exercise with the `apt-get`,
    `apt-cache`, and other commands. With that said, not all file formats are supported
    by all distros. There are some that stand out and hence are exclusive to certain
    types of Linux distros. Let us have a brief look over some of them to get an idea.


    1. `.rpm` files — These installation packages are mainly supported by Fedora,
    Red Hat, CentOS, along with some other distributions. These are not supported
    by Debian-based flavors such as Ubuntu. These files use separate commands called
    `yum`, `rpm`, and `dnf`.

    2. `.deb` files — These are Debian package files and are supported across all
    Debian-based flavors, including Ubuntu. We have already seen that these are installed
    by the `apt-get` and `dpkg` commands.

    3. `.tar.gz` and `.tar.bz2` files — These are quite different and are essentially
    compressed tar files. These are not directly installable as they have various
    files and folders within them, compressed using `gzip` (`.gz`) and/or `bzip2`
    (`.bz2`). Unlike the previous two files, these require quite a few steps in order
    to be installed.


    Although it is virtually impossible to install the wrong kind of file on Linux
    these days, owing to the modern installers on board, it is still good to know
    which files belong where System configuration is quite a hectic task to carry
    out. Rest assured, it is only the first time that you may feel a strain. Once
    most of the things are in place, you will no longer be feeling the pressure of
    keeping everything aligned and updated. Most of the tasks will be done for you.
    On the off chance that things end up going wrong, you can always consult the log
    files. The great thing about having an open-source operating system is that every
    user within the community can help you out easily with the issue, and you can
    end up mastering quite a lot of codes and essentials throughout your Linux journey.
    Know just about enough, and you can be quite a successful system administrator.


    ## Resources and Processes


    Before we get into the world of resource allocation, processes, and tools that
    allow us to look deeper into these, let us imagine a scenario. We have the best
    machine that money can buy, and it is equipped with top-notch specifications.
    It has the best RAM, the finest CPUs, the ultimate graphics card, and all that
    you can dream of having in a truly powerful computer. One fine day, you initiate
    a process, and immediately the system grinds to a halt or starts to slow down
    to a crawl. Can you imagine the frustration you will go through? Despite the best
    specs, your PC is unable to carry out operations properly, and you have no idea
    why. It is enough of an ordeal to push any computer user over the edge.


    In order for us to understand why this often happens to the best of the machines,
    we need to dig a little deeper into how processes work and how the resources are
    utilized for the users. The three core resources a system has are the CPU itself,
    the memory it has, and the I/O. Take any of these out of the equation, and the
    system isn’t going to work all that great. These are classified as hardware resources.


    The `kernel`, on the other hand, is responsible for distributing all of the available
    resources to the processes without bias. Ironically, the `kernel` itself is a
    software resource that helps processes to carry out various tasks that the user
    requires them to do. The relationship between the `kernel` and the hardware resources,
    if disturbed or severed, would end in system failure. The system will have the
    resources but no medium to allow programs to use it. It would just be a glass
    of water on top of a table with no one to drink from it.


    The art behind successful resource management is to use a tool that can provide
    you with the required information in real-time. There are many programs and tasks
    that may not take a lot of resources, but there will be some that require quite
    a chunk of the available resources. And since the `kernel` is not biased, the
    `kernel` will distribute such programs the required resource.


    To find out just what is using your resources, how much of your resources are
    being used, and for how long the processes have been active, we use a command
    called `top`. Go ahead and type the command on your terminal and see what happens.
    Windows users might recall the use of the Task Manager tool. This is the Linux’s
    equivalent to that. The screen is immediately crowded with many numbers, names,
    facts, and figures. While you may have thought you had enough power, this tool
    will now show you just all those resources are being used. Let us look at each
    of these items and learn what they correspond to.


    | Column | Description |

    | :--- | :--- |

    | PID | This is the process ID. Every single process that is listed or may be
    added later on has a special identification number. Through these, you can learn
    how to manage processes more effectively once you master the tools. |

    | USER | This simply tells you which user is using the said process. |

    | PR | This tab shows the priority of the task that is being run. If any task
    shows “rt” in this field, it denotes a real-time scheduling priority. |

    | NI | This stands for (and we are not making things up) “nice” value of the task
    in question. If this is in a negative number, the task gets a higher priority.
    If this is in a positive number, the task gets a lower priority. |

    | VIRT | This shows the virtual memory size that is being used by the said task.
    |

    | RES | This shows the physical memory that is being used by the task (non-swapped).
    |

    | SHR | This shows how much shared memory is available for a task. |

    | S | This shows the process status. This field has further options, which are
    as follows: |


    * `-D` – uninterruptible sleep

    * `-R` – running

    * `-S` – sleeping

    * `-T` – stopped by job control signal

    * `-t` – stopped by debugger during a trace (remember, capitalization matters)

    * `-I` – idle (formerly Zombie)

    * `%CPU` – shows how much of the CPU in percentage a process is using |

