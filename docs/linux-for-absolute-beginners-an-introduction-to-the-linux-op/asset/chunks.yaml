    the friendly “yes or no” selection, the Bluefish will be removed for you. It is
    that easy.What if you wish to install a great program you found in your friend’s
    machine? You think, “Sure, I will use the apt-get and have this program installed
    right away.”You get home, all excited, log in to your Ubuntu, open the terminal,
    and halfway through, you realize you forgot the name of the application. You can
    do a search using the “apt-cache” command in the following way:apt-cache search
    gimpYou should now see a crowded terminal, with numerous entries and file types.
    Search through the same, and you should come across one that says program in the
    end. These are the ones that you can install using apt-get install command. Alternatively,
    you can rely on the Ubuntu software store and locate your applications or software
    that you wish to download and install.There are instances where you may have applications
    that were pre-installed or manually installed but are nowhere to be found. Before
    downloading and perhaps even rewriting the files, it is best to check if the said
    application exists on your system or not using the terminal. To do that, follow
    the command below:apt-cache policy gimpHere, the action has now changed from install/remove
    to policy followed by the name of the application. Assuming that we have downloaded
    and installed the photo manipulator software called Gimp from the previous example,
    the result will look something like this:gimp:Installed: 2.10.8-2Candidate: 2.10.8-2Version
    table:*** 2.10.8-2 500This confirms that there is a version installed on our system.
    It also shows which version currently resides within the repository. Both of these
    versions match each other, which reassures us that we are running the latest version.To
    run another test of this command, we initially downloaded Bluefish and then uninstalled
    the same. Let us see what the terminal has to tell us regarding that:apt-cache
    policy bluefishbluefish:Installed: (none)Candidate: 2.2.10-1Version table:2.2.10-1
    500The result is now telling the user that they do not have the Bluefish installed
    on the system — quite a useful command to remember when you are managing various
    networks and machines as an administrator. You can always run these commands to
    find out if a machine has certain programs and applications installed within them
    that may be necessary.Suppose you do not wish to use the repository or you just
    stumbled upon a website where you found an application that is available to download.
    You want to install that. Again, there are two methods — the GUI and the terminal.
    The former would require you to download the installer. After downloading is done,
    you will need to browse through the directories, access the software, and then
    launch the graphical installer. It will then continue through steps asking all
    the questions and asking you to agree to this or that. Eventually, you will be
    able to have it installed and ready for use.We are not focusing on this case at
    the moment. We are more interested in mastering the commands and wish to install
    the same using the terminal. For this example, we will use Google Chrome as our
    browser, which we need to download and install.Open up the pre-installed Firefox
    browser from the app drawer/dock. Go to chrome.google.com to download the installer.
    Choose the Debian/Ubuntu version as we are using just that. Click on save, and
    let it download.Now open your terminal and use the “cd” command to access the
    Downloads directory.cd ~/DownloadsUse the “ls” command, and you should now be
    able to see a red-colored entry here. This is the file we wish to execute and
    install through the terminal. In order to do that, type in the following command:sudo
    dpkg -i ./google-chrome-stable_current_amd64.debIf you are slightly overwhelmed
    by what just happened here, let us explain. We already know the first command.
    What follows that is dpkg, which essentially means Debian package. Remember, Ubuntu
    is a flavor of the Debian distro, so we will normally find the word Debian linked
    quite a lot. Following the dpkg is the action. In this case, we used -i, which
    tells the terminal we wish to install this package.Next, you guessed it, we have
    specified the location of this package file that was downloaded. Since we were
    already in the Downloads directory, we used the ./ command to tell the terminal
    we need something from within the directory. If we were in any other folder, we
    would need to use a path leading to the file. Lastly, it is the name of the package,
    followed by its extension.Once done with the installation, you can directly open
    chrome from the terminal by typing in “google-chrome” and hitting Enter.The use
    of commands is always a daunting task at first. However, with sufficient practice,
    everyone can get the hang of things and can find this to be far more efficient
    and effective than relying on graphical user interfaces. While you can find many
    examples of how effective and time-saving the LUI method is, nothing provides
    the finest example of its true efficient nature than the command we use to update
    all the applications and software within our Ubuntu.Can you imagine how many individual
    upgrades you would need to download and install in Windows or Mac OS? The ones
    that are related to your OS might be queued up, but the software and applications
    will need to be updated manually and separately.Linux does things much easier.
    With a single command, Linux will automatically upgrade any packages that are
    outdated or have newer versions available in the repository. Let us go ahead and
    see how this can be done and how quick it is. Open your terminal and type in the
    following command:sudo apt-get upgradeThe system will run through the packages
    and locate the ones that are installed within it and require an upgrade. You will
    be asked whether you are happy to proceed with the upgrade. Simply type in “Y”
    and hit Enter. That is literally it.Commands You Might Find UsefulHere, we will
    briefly look through some commands that can and will be used at some point in
    time. It is generally a good idea to have a look through these and understand
    what each one of them does.cp — This stands for “copy.” This command copies one
    file into the other. You can also copy multiple files by using the format below.
    Replace file1, file2 with the names of the files you wish to copy, along with
    the name of the directory where you wish to copy (shown here as target):cp file1
    file2 … fileN targetmv — Most likely, you have already guessed it. This command
    moves the files.touch — This command creates a quick file for you.cat — This command
    also allows you to create your files. To create a file, simply type in the command
    in the following manner:cat > sample.txtYou will now be able to type in whatever
    you wish to include within the file. If the file “sample.txt” does not exist,
    the command will create it for you. Once done, press Ctrl+D to save and close.rm
    — This command removes a file. This deletes the file permanently.echo — This friendly
    command prints whatever the argument is on standard output.mkdir — Use this command
    to make a new directory within the working directory.rmdir — Use this command
    to remove/delete a directory. This command will only work if the directory is
    vacant. If it has files, the command will fail. However, should you still wish
    to remove the directory and everything within it, you can put in the following
    command:rmdir -rf (directory name)less — This command is rather useful when you
    are to view a directory or a file that has a lot of text information and can leave
    you with hundreds of lines to read from. Use this command in the format of less,
    /directory/sub-directory/file, and now you will be presented with the information
    one full screen at a time. Pressing the Space key will advance to the next page,
    while pressing the B key will go back a page. When done, press the Q key to quit.file
    — This command shows what kind of a file the targeted file is.passwd — This command
    allows you to change your password.diff — This command lets you see the difference
    between the two files.We can go on and on about commands and explain every one
    of them to you. However, there is a concept that you need to fully understand
    prior to proceeding ahead with more commands. We will now be looking into the
    world of users and super users, who they are, and what they do. We will also be
    looking at ways to configure our system for optimum productivity. Lastly, we will
    have a bit of light shed on what user processes and resources are.In the meantime,
    you can go ahead and play with most of these commands to get a good grip. You
    will need all your understanding in order to move forward from this point.CHAPTER
    FourTaking Command of Your SystemT hings have started looking interesting. We
    now have our first experience with the line interface. We have used quite a few
    commands to get things moving and have already downloaded, installed, and even
    deleted some files and applications.The world of Linux has just started to unfold
    for you. With each passing day, you will be picking up new commands and learn
    to go deeper into the coding world. Soon, you will realize just why Linux is considered
    secure and efficient compared to its counterparts. While this stage may be a bit
    far off for the absolute beginners, practice is something that can assure you
    a path to success.As a reminder, the ever-active community of Ubuntu is always
    willing to help everyone out. Should you ever run into a problem and are not too
    sure what needs to be done, always seek help prior to executing commands or moving
    files.Moving forward, we have now learned the simple theories and even had our
    first taste of the terminal and what it can do. Now, it is time to take over the
    driving seat, control the steering wheel, and drive. It’s quite a scary way to
    put it, but it is a fact.This does not mean that we will leave you stranded; what
    we meant is to ensure that you are able to steer clear of trouble and carry out
    tasks on your will, create things, delete them, move them about, alter permissions
    and access to others. This is what you will be focusing on within this chapter,
    starting with something that has been with us since the beginning of this book.User
    and Super UserWhile all of that was going on, you may have noticed the excess
    use of the term “sudo.” Needless to say, this is no ordinary term as it allows
    administrative privileges. The question here is “Why?”The term “sudo” is “super-user
    do.” This tells the terminal that a super user has the reigns and the terminal
    should now follow exactly what the super user commands.A person who has limited
    accessibility and permissions is termed as a user. In our case, we are both a
    user and a super user. When we are browsing in our home directories, downloading
    music and pictures, and storing them there, we are acting as a user. However,
    the minute we issue some high-level commands that need authorization, we become
    the super user. The super user (SU) has access throughout the system. The SU can
    decide what file needs to be kept, changed, modified, or even deleted. The SU
    has the right to allow access to some while restricting accessing or even blocking
    others completely.Being a super user is fun, but it comes with responsibilities.
    In order to make the most out of this privilege, ensure that you understand the
    concepts correctly as any error on your part can end up harming the entire system
    and even the network that you may manage. That would be catastrophic and would
    bring forth consequences no one would like to see.Let us also look at a basic
    example that was discussed before to give you an idea of the privileges the SU
    has over a regular user.drwxr-xr-x 3 exampletest exampletest 4096 Sep 01 12:00
    DesktopRemember this? We learned how to crack the code of all the characters on
    the left. If you still remember, let us now look at some differences here.This
    directory (in this case the Desktop) is readable, writable, and executable by
    the root user. The root user is also called as the super user. Then a group (a
    regular user/users) can only read this file and execute it but not modify it in
    any way. This means that they cannot alter any text, code, or even move or remove
    the file. The last three are for all other users who may be connected through
    a network. They can also read the file and execute the same but not alter it in
    any way.Now, should the SU decide that this file is safe to be shared and transfer
    the complete ownership to some other group or decide that users must have permission
    to edit the same, he or she can actually change the permissions quite easily.
    Let us first look at how ownership can be changed.Changing OwnershipWe will use
    the sample.txt we created earlier on as an example. Open the terminal and browse
    to the directory where the file is located. Now use the following command, and
    you should see something like this:ls -l ./sample.txt-rw-r—r-- 1From our previous
    encounter with such coding, we know what these are. However, this time, we intend
    to change these.Do you see how the owner of the file has access to read and write
    while others can only read? We will need to change that so that others can pour
    in their input to populate the data, file, or even source code (if it was that).To
    edit most of the text files, we normally use simple text editors. With our Ubuntu,
    we have a built-in text editor called the Nano. We will use that to see whether
    we have the capability to access, read, and write this file.On the command terminal,
    head over to the directory where the sample.txt lives. Now type in the following
    command:nano sample.txtThis will open up the Nano text editor. You can edit any
    text file here as long as you have the access and permission to do so. Currently,
    you should have no problem in editing the file, adding values, or changing them.
    You can then press Ctrl+O and hit Enter to save the file. To quit, press Ctrl+X
    .Now, this went on rather easily and without any challenges. What if we had a
    file created in a place where we normally would not gain access? Let us see how
    that turns out.Let us open the terminal and try to create the sample2.txt file
    using the cat command and the > operator. You will face an error that should say
    “Permission denied.”Now, use another way to create the file using the Nano editor.
    This time, while being within the /etc directory, type in the following command:nano
    sample2.txtYou should now be within the Nano text editor. However, when you try
    to save your work, you will meet an error where you will be reminded that you
    do not have permission to do that. Use the Ctrl+X to quit.Now, use the following
    command and see what happens this time around:sudo nano sample2.txtNot only will
    you be able to write a text file, but you will also now be able to save it easily.You
    can view the same by using the ls command, and you should have no problem is spotting
    the file within the list of others.Use the ls -l command followed by the file
    name to bring up the permission status. You should now see something like this:-rw-r--r--
    1 abcd efgh 4096 Jul 19 14:45 sample2.txtWe wish for this file to be shared with
    the other two groups. For that, the permission for the latter two groups should
    match that of the owner. To do that, we will have to change the ownership of the
    file.We use the following command to do this:sudo chown user:group (file)Here,
    the user is “abcd,” as seen in the previous example. Following that is the group
    “efgh.” So to put the command right, you will replace user with abcd and share
    it with the group efgh. Lastly, enter the full filename and hit Enter. This will
    change the ownership of the file.This allows the new owner to be able to change,
    modify, and replace the contents of the file without any special permission. However,
    we cannot do this for every single file unless absolutely essential. There must
    be an easier way to allow others to see it.Changing PermissionsFortunately, there
    is, and it is quite easy as it turns out. Use the following command to change
    the permissions set by default on the sample2.txt:sudo chmod (permission1)(permission2)(permission3)
    (filename)6 – This indicates that the user/group/others have read and write access.4
    – This indicates that the user/group/others have only read access.Currently, the
    sample2.txt file has 6, 4, and 4 settings. Now, we need to change that to 6, 6,
    and 4\. This implies that we want the owner and group users to have “read and
    write” access while others only have read access. To do that, use the above format
    as indicated below:sudo chmod 664 sample2.txtAs soon as you hit Enter, the system
    will immediately change the permissions as directed by you, the super user. To
    verify the same, use the ls -l ./sample2.txt command.The sample2.txt has now served
    its purpose. Go ahead and remove the file using the commands we had looked upon
    in the last chapter. Once done, let us proceed to some more important aspects.Creating
    UsersAs the administrator, the owner, or even a super user, you might be required
    to create a user account within the system for login purposes and to be able to
    carry out various tasks and work within said login. How would you do that?Naturally,
    there are two ways we can do this. Let us look at both these options and see how
    each one of them works.1\. Using a graphical user interface (GUI). This is perhaps
    the easiest way you can do this. To create a user, go to the top right end of
    the screen and access the user settings. Click on the settings icon and select
    details located at the bottom of the list. Now choose users, and you should be
    able to view your own settings. In order to add a user, you will first need to
    use the root password. The root password is the same that you used at the time
    of installation. Click on unlock, enter the password, and now you should be able
    to create a user with ease. You can also choose whether you would like to create
    a regular user or a user with administrative privileges.2\. Using the line user
    interface (LUI). For this, we need administrative privileges for the commands
    to work. Go ahead and bring up your terminal. Use the following command to create
    a new user:sudo adduser (name)You will be asked for your password for verification
    purposes. Once done, you should now be asked to input a new password for the new
    account. Choose your password accordingly, fill out the information that will
    be asked or simply hit Enter to skip each one of them. Lastly, type “Y” when the
    prompt asks. That should be that, and now your system has a new standard user.If
    at any point you wish to switch user, you do not have to do the long and rather
    boring task of logging out of the system, switching accounts, and logging back
    in. Using the terminal, all you need to do is type in the following command followed
    by the name of the account that you wish to change to.su(name)You may be asked
    for a password for the account you wish to switch to. Be sure to have that ready.The
    SU command simply means “Switch User.” Like we learned earlier, it is a lot easier
    to do things through the terminal. Creating a user or switching to another is
    done within a matter of seconds. All it takes is a bit of practice, and you should
    soon be switching accounts, creating new ones, and managing the entire system
    on your own.Now that you have changed accounts, try using the sudo nano command
    and create a file named sample3.txt. You will be asked for your user password,
    and then immediately, you will meet this:(name) is not in the sudoers file.Quite
    an odd-looking error, isn’t it?What the prompt is trying to say here is that this
    user is not added as a sudo user.If you wish to do this, it is quite easy. Just
    enter the command in the following manner, and the selected user will be added
    to the list of sudo users.sudo adduser (name) sudoNow, this new user is a sudo
    user as well. Now try to switch over to the newly created account, put in your
    password, and then try to see if you can create a new file using either the “touch”
    or the “nano” command.Removing UsersWe have learned how to create users, but what
    if there are just too many of them? What if someone has decided to leave and his
    or her credentials are still on the system? How do you remove those?Again, we
    will resort to both the GUI and the LUI methods. We do this to ensure everyone
    gets an idea of how things are done within the thrilling world of Linux. Whatever
    suits you best later on is yours to decide.First, we use the graphical user interface:'
