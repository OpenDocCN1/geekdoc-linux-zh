    Now, try to decipher our example above and find out what permissions we have.
    You can also use the `ls -l` command to view your own directories and find out
    a lot more. With that said, let us move ahead to yet another useful `ls` command.
    You might be wondering, “Do I always have to take so much time to decipher the
    file type?” Quite a valid question, but no! The terminal has you covered for that.
    If you are not too sure or you may tend to forget that “d” stands for directory
    and the dash for files, we have yet another command that can organize all the
    content of the working directory into a file type.


    `ls -p`


    This command will now present all the files and folders with either their names
    and extension or a forward slash. The ones with the extensions are the files while
    the ones with the forward slashes are your directories. Quite easy, isn’t it?
    When you are all set, go ahead and type in the following command:


    ```

    ls -l samplefile

    ls -ld sampledirectory

    ```


    The first example here shows you the permissions of a specific file. The second
    example does the same, but instead of a file, we now get information about the
    folder or directory we have chosen. The `samplefile` and `sampledirectory` are
    just for illustration purposes only. In your case, choose any folder or file that
    you wish to use here. Having this information at hand can help you quite a lot.
    There will come a time when you may need to find out the permissions that have
    been granted to the owner, the group, or any other user on the system. You should
    know how to find this information out, decipher it, and modify it if needed to
    further strengthen the security of these files and directories from prying eyes.


    What if you wish to base the listing on file size? Well, we do have a command
    for that too:


    `ls -s`


    This will sort everything and list the files and folders according to their sizes.
    Now let us take a step further in listing command and change the scenario a bit.
    Let us suppose we just feel a little too lazy to go to a specific directory and
    then run the listing command there. Is there a way we can find out the contents
    of that targeted directory without going there? Fortunately, yes! Regardless of
    what your working directory is, you can use the command below and get a list of
    all the files and folders available within a said directory. In this case, we
    are targeting the `/usr/share/applications`:


    ```

    ls /usr/share/applications

    ```


    This will provide us with a list of the content present within the above directory,
    even if we are in the desktop working directory. However, you may have noticed
    one thing — it all seems a little clustered. Too little space and too much to
    read. Let us take care of that with a quick command:


    `clear`


    Now, the terminal has room to breathe and looks better. Don’t worry, none of the
    entries have been removed as you can still access them by scrolling up. Quite
    a lot of people tend to get worried at the first time. Finally, a bonus listing
    command for everyone. If you wish to get access to all the possible “ls” commands,
    simply type in the following command at any time, and you will be presented with
    all the possible `ls` commands and arguments along with their description:


    ```

    ls --help

    ```


    With that said, it is time to say goodbye to the listing commands and move forward
    and look at some other essential commands that you should know. There are hundreds
    of thousands of commands for you to get into and explore; however, we are trying
    to list only those that form the foundation and provide you with basic knowledge.
    How you wish to master further commands is up to you.


    Not that far back, we came across another command that seemed a little different
    to most of what we have discussed here. If you have forgotten, the command in
    question is as follows:


    ```

    sudo apt-get install gnome-tweak-tool

    ```


    We know now that `sudo` is what grants administrative privileges to the user in
    order to execute said commands on the terminal. What about the `apt-get` and `install`?
    This is the package manager for Ubuntu and Debian-based distribution. It is called
    Aptitude. The `apt-get` is an application that is responsible for installing or
    removing software and application via the CLI on Linux. This is both quick and
    secure and allows you to take complete control of the installation.


    The `apt-get` command is followed by an action. In the above case, we used `install`
    as our action. Should you wish to remove a program, you can use replace the action
    with `remove`. Following the action is the name of the application. These application
    packages and indexes are stored within the Ubuntu repositories that the terminal
    accesses. Before executing a command, always ensure you know what application
    you wish to acquire as you will need to use the exact name and capitalization
    for the command to work properly.


    You can use the example below to download a simple text editor called the Bluefish:


    ```

    sudo apt-get install bluefish

    ```


    You will be asked for a password. Remember, when typing your password, the terminal
    will not show any dots or asterisks. Once done, hit Enter, and you will be asked
    whether you would like to continue downloading and installing the desired package.
    Type in “Y` and hit Enter to continue. Eventually, you should now have the Bluefish
    installed in your system.


    Since this is an example and we do not need the Bluefish for any part of this
    book, let us go ahead and check out the command to uninstall this program. Open
    your terminal and type in the following command to uninstall the program:


    ```

    sudo apt-get remove bluefish

    ```


    After the friendly “yes or no” selection, the Bluefish will be removed for you.
    It is that easy.


    What if you wish to install a great program you found in your friend’s machine?
    You think, “Sure, I will use the `apt-get` and have this program installed right
    away.” You get home, all excited, log in to your Ubuntu, open the terminal, and
    halfway through, you realize you forgot the name of the application. Is there
    a way we can find out the contents of that targeted directory without going there?
    Fortunately, yes! Regardless of what your working directory is, you can use the
    command below and get a list of all the files and folders available within a said
    directory. In this case, we are targeting the `/usr/share/applications`:


    ```

    ls /usr/share/applications

    ```


    This will provide us with a list of the content present within the above directory,
    even if we are in the desktop working directory. However, you may have noticed
    one thing — it all seems a little clustered. Too little space and too much to
    read. Let us take care of that with a quick command:


    ```

    clear

    ```


    Now, the terminal has room to breathe and looks better. Don’t worry, none of the
    entries have been removed as you can still access them by scrolling up. Quite
    a lot of people tend to get worried at the first time. Finally, a bonus listing
    command for everyone. If you wish to get access to all the possible “ls” commands,
    simply type in the following command at any time, and you will be presented with
    all the possible `ls` commands and arguments along with their description:


    ```

    ls --help

    ```


    With that said, it is time to say goodbye to the listing commands and move forward
