    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_50_0.png)


    # Left  This diagram illustrates what a simple hash table looks like


    see, half the buckets are not being used at all! If you know what the modulo operator
    does, you can easily fix this by using modulo 10 in the hash function instead
    of modulo 5.

    It is important for the hash function to work consistently and output the same
    hash value for identical keys, because otherwise it would be impossible to find
    the information you want. A collision happens when two keys are hashing to the
    same index – this is not an unusual situation. There are many ways to deal with
    a collision.

    A good solution is to use separate chaining: the hash table is an array of pointers,
    each one pointing to the next key with the same hash value. When a collision occurs,
    the key will be inserted in constant time to the head of a linked list. The problem
    now is that when you have to search the hash value of a given key, you will have
    to search a whole linked list for this key. In the worst-case scenario, you might
    need to traverse the entire linked list; this is the main reason why the linked
    list should be moderately small, raising the requirement for a large number of
    buckets. As you can understand, resolving collisions involves some kind of linear
    search, which can be slow by design. So it is important that you have a hash function
    that minimises collisions as much as possible. Other techniques for resolving
    collisions include open addressing, Robin Hood hashing and 2-choice hashing.


    # The hash function


    As the hash function is going to be used all the time in every interaction with
    the hash table, it is extremely important for the hash function to operate fast.
    Please note that a poorly designed and implemented hash function may leave a number
    of buckets unused, which not only makes the finding process slower, but is also
    a terrible waste of resources. The best way to avoid this is by examining the
    cardinality of the buckets as often as possible in order to test the efficiency
    of the whole implementation.


    In the worst-case scenario, where the hash function puts all elements into the
    same bucket, the hash table is in reality a linked list with an extra overhead
    – the execution of the hash function – and a plain linked list would therefore
    have been a faster solution.


    # Delete, insert and look up


    The main operations on a hash table are insertion, deletion and looking up. You
    use a hash value to determine where in the hash table a key will be stored. Later,
    you use the same hash function to determine where in the hash table to search
    for a given key.

    Once the hash table is populated, searching is the same as doing an insertion.
    You hash the data you are searching for, go to that place in the array, look down
    the list that starts from that location and see if what you are looking for can
    be found in the linked list or not. The number of steps is O(1). The worst-case
    search time for a hash table is O(n) – that can happen when all keys are stored
    in the same bucket! Nevertheless, the probability of that happening is so small,
    that both the best and average cases are considered to be O(1).

    You can find many hash table implementations both on the Internet and by reading
    good books. The tricky part is using the right number of buckets and choosing
    an efficient hash function that will distribute values as uniformly as possible
    without bias. A distribution that is not uniform will definitely increase the
    number of collisions and subsequently slow down the entire hash table, as shown
    above.


    # Implement a hash table in C


    The following listing shows the C code for hashTable.c, which uses a naive hash
    function. The purpose of hashTable.c is to understand how a hash table works;
    this can be reached by examining its main points – the fully commented version
    can be found in this tutorial’s FileSilo.co.uk resources.'
