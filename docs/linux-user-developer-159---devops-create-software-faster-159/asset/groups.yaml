    # My Pi project


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_60_0.png)


    # Tron PiDesk


    Frederick Vandenbosch transforms his desk with touch sensors, wireless charge
    pads and a retractable computer


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_60_1.png)


    # Tell us about the competition that you entered


    Sci Fi Your Pi was a challenge launched by element14 in collaboration with the
    Raspberry Pi Foundation. The goal was to create a sci-fi project centred around
    the Raspberry Pi, and it had to have a certain relation to a sci-fi movie. There
    were 25 finalists for the challenge and we had to build our projects in about
    18 weeks.


    # Which movie did you choose?


    I had the idea for the project first and then I had to link it to a movie, so
    I had to reverse the thinking in that sense. I linked it to Tron because of different
    aspects: You have the lights, you have the costumes with embedded LEDs or light
    strips, and this is why I have this pattern in the desk surface, to try to represent
    that. You also have the desk that is used to transfer between the virtual world
    and the real world, which also has an embedded computer.


    # What are the features on your desk?


    The idea was to make it as futuristic as possible and also combine multiple features.
    The desk has to look like an ordinary desk, but once you start hovering your hand
    over the right side of the desk, you have embedded capacitive touch sensors which
    can trigger certain actions. For example, the main action is to make the computer
    pop up off the desk, and this will then trigger some lights to let the user know
    that an action is in progress. When the computer is rising up of the desk you
    have the pattern light up in green. The reverse happens when you decide to shut
    down the computer – the screen will lower into the desk and you will have a moving
    pattern in red. I decided to use green and red because they’re typical colours
    for starting and stopping. When you hover your hand over the capacitive touch
    sensors, it also triggers some sound effects based on MP3 files stored on the
    Raspberry Pi.


    One of the other features that I’ve embedded is a wireless charger into the desk’s
    surface – I use it to light up a lamp, based on a glass ball and NeoPixels put
    into a certain container, but you could also use it to charge your phone.


    # Do the capacitive touch controls only pop up and retract the display?


    I have foreseen five buttons but I’m only using two. But there is a Python script
    on the Pi waiting for any input of those five buttons, and any action can be triggered.
    If I come up with an interesting idea then I will definitely expand the program.


    # How did you build the desk itself?


    I knew I wanted to embed things inside the desk’s surface, because I wanted it
    to look like a normal desk. I used an Ikea desk – the cheap ones are hollow –
    so I started drawing the pattern I wanted and some space to store the Raspberry
    Pi and the wireless charger, and then I started cutting into the top surface of
    the desk. I removed the cardboard structure, which then gave me space inside the
    height of the desk, and this was sufficient to hide components. For the sensors,
    because I wanted to keep them as flat as possible, I used conductive paint and
    copper tape to make the connections, so there’s no level difference between one
    side of the desk and the other. Finally, I had to close everything up, and for
    that I used a big sheet of Plexi. I first covered the desk with two layers of
    paper from a paper roll, to hide the components and make it non-visible, and then
    by putting a top layer of Plexi you have a full surface for the desk. The lights
    are bright enough to shine through the paper, and the capacitive touch sensors
    are sensitive enough to be able to trigger by placing your hands onto the Plexi.


    # Do you have speakers embedded inside the desk for the sound effects?


    There are two parts for the audio: the Pi embedded in the desk, which is in charge
    of controlling the motors, lights and sound effects, so there is a small speaker
    using an amplifier breakout board inside the desk to trigger the sound effects
    of the controls. Then you have the desktop computer, which slides in and out of
    the desk – this is a separate Raspberry Pi with a separate amplifier, separate
    speakers.


    # How did you go about creating the pop-up display?


    I had an old laptop from years ago and when it broke down, I decided to recuperate
    the control of motors. I based the idea on the Z axis of 3D printers, where you
    have threaded rods which can then rise or lower a platform. I adopted the same
    principle by mounting two stepper motors on the bottom side of the desk with threaded
    rods, with the whole screen assembly resting on that platform. When the stepper
    motors are triggered, the platform is raised, causing the whole frame to come
    out of the desk. To have some guidance for this frame I used some drawer sliders,
    also from Ikea. The stepper motors have good torque, so they can handle the weight
    of the entire frame, but the speed is a bit of a problem. But in the end, it turned
    out that the boot time of the desktop computer is exactly the same as the rising
    time of the entire frame.


    # What was the most challenging part of the project?


    I bumped into an issue where the control of the LEDs was impacting the audio,
    and vice versa. I ended up using an external USB dongle for the audio so that
    it wouldn’t impact the GPIO control for the LEDs. Time constraints make you figure
    out things in any way possible. So the most challenging part is really the integration,
    once you start putting everything together and making things interact with one
    another.


    **Frederick Vandenbosch** is an integration engineer by day and builder of electronic
    things by night. He likes to build things as a way of learning about a subject
    and have fun while doing so. Not all builds are successful, but that’s part of
    the learning process!


    # Like it?


    If you’d like to see more of Frederick’s work, check out his website: [bit.ly/1XC8u8](bit.ly/1XC8u8)


    The rest of the Sci Fi Your Pi entries, including an actual T-ricoder, can be
    found here: [bit.ly/1ekb8c](bit.ly/1ekb8c)


    # Further reading


    Thinking of putting your own Tron desk together? There’s a great woodworking video
    here from Bob Osgatt at Make that shows you how to craft a coffee table with embedded
    LED strips, which is a great starting point: [bit.ly/1WIWIW](bit.ly/1WIWIW)'
  md: "\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_54_0.png)\n\n**Left** OtherHash.c\
    \ and xorHash.c both get significant speed boosts from a larger TABLESIZE value\n\
    \n## Do some benchmarking\n\nAs only two things can vary in a hash table implementation,\
    \ the benchmarking process will only change these two factors. Three different\
    \ hash functions will be used (hashTable.c, otherHash.c and xorHash.c) as well\
    \ as three different TABLESIZE values (20, 1001 and 10001). So a total of nine\
    \ tests will be performed and measured using the time command.\n\nThe graph above\
    \ shows the performance of the three hash functions using the various table sizes.\
    \ You should now understand the importance of a good hash function and a large\
    \ array that holds the various linked lists. Please remember that when you change\
    \ the TABLESIZE variable in the C code, you should recompile the C file for changes\
    \ to take effect.\n\nAs you should realise by now, a good hash function has to\
    \ evenly distribute elements and minimise collisions as much as possible. Additionally,\
    \ it should take into account the kind of data it has to process as well as the\
    \ amount, because without knowing its data, a hash function cannot perform well.\
    \ The quest for the perfect hash function is endless; nevertheless, the best advice\
    \ when trying to implement a hash function is to always consider the kind of data\
    \ you are going to have.\n\n## Compare a hash table to a linked list\n\nThis part\
    \ will compare the search (lookup) speed of a hash table and a linked list; both\
    \ implementations will be in C. Please bear in mind that the concept of a linked\
    \ list is simpler than the concept of a hash table. Generally speaking, the simpler\
    \ the concept, the more general its usage can be. However, the biggest problem\
    \ of linked lists compared to hash tables is that when you insert a new node,\
    \ you will have to traverse the whole linked list in order to make sure that the\
    \ new node does not already exist in the linked list.\n\n## Hash tables in Python\n\
    \nThis part will talk a little bit about how Python implements hash tables, which\
    \ are called Dictionaries. The following Python code illustrates the way Python\
    \ deals with dictionaries:\n\n```python\nHash = {}\nHash[\"key1\"] = 1\nHash[\"\
    key2\"] = \"12\"\nHash[\"key1\"] = 3\nfor key in Hash.keys():\n    print Hash[key]\n\
    ```\n\nThe first line defines a new dictionary variable named Hash. The next three\
    \ lines put data into the dictionary. The last two lines print all values found\
    \ in the hash dictionary. More or less, the Python approach is similar to both\
    \ Perl and AWK approaches and you should have no problems understanding it.\n\n\
    In order for the comparison to be fair, a large number of elements should be used\
    \ for creating the hash table and the linked list. The linked list is the slowest\
    \ of all presented programs except when the hash table has only one bucket. However,\
    \ if the linked list elements were sorted then its search performance would have\
    \ been much better. The most important benefit of a sorted linked list is that\
    \ checking whether a node already exists in the linked list is much easier and\
    \ does not require traversing the whole linked list. When the list needs to be\
    \ sorted, the insertion can be very slow. Inserting an element into an unsorted\
    \ linked list is faster. Deleting an element from a hash table and a linked list\
    \ is basically the same as searching for it. The actual cost of deletion is the\
    \ lookup operation.\n\n## WANT MORE?\n\nGo to GreatDigitalMags.com\nand get great\
