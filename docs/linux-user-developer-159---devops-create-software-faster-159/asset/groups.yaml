    - **连接性**：2x HDMI，2x USB 3.0，3x USB 2.0，1x micro-SD，GPIO 接口，RS232 接口，带电源的 eSATA
    6.0G/s

    - **尺寸**：108mm x 83mm x 24mm

    - **价格**：£300

    - tinyrepc.com (英国)

    - fit-pc.com (国际)


    Fitlet 是一台完全兼容 Linux 的微型 PC，拥有的功能多到你数不过来。虽然这不是 Compulab 的第一款无风扇迷你 PC，但它可能是其最好的作品。


    拆开 Fitlet 包装是一次很棒体验：盒子看起来太小了，似乎装不下任何有实力的计算机，但机器本身——装在一个金属机箱中，顶部兼作散热器——仅占其中极小一部分，剩余空间留给壁挂式电源适配器、HDMI
    转 DVI 转接线，以及在高端型号 Fitlet-iA10 上内置 Wi-Fi 的天线。


    既然存在高端型号，自然也就有入门级型号。事实上，Fitlet 家族由一系列外观相同的设备组成：Fitlet-b 是入门级型号，Fitlet-i 提供更多功能和改进的处理器，而
    Fitlet iA10 则进一步改进了处理器。甚至还有 Fitlet-X 系列，它将 Fitlet-i 的双千兆以太网和 eSATA 端口替换为三个千兆以太网端口——所有这些端口都在
    PCI Express 总线上以全速运行。


    这种角色灵活性是通过 Compulab 称为 Facet 的系统实现的。使用构成机箱侧面板的 Facet 模块，可以改变 Fitlet 的功能——公司承诺未来将通过额外的
    Facet 模块更充分地利用这一特性。


    本次评测的型号是 Fitlet iA10，配有 64GB mSATA SSD 和 4GB DDR3 RAM。这有点不寻常：


    Fitlet 通常以裸机形式出售，但英国供应商 TinyGreenPC 允许买家在购买时从多种存储和内存选项中进行选择。虽然这很有用，但 TinyGreenPC
    的价格比直接从 Compulab 购买要高出一截——将 Linux Mint 17.2 系统镜像复制到可选 SSD 的费用竟然高达 £48（含增值税），我们建议读者避免这种费用，改为从
    Live USB 启动并免费自行安装。


    这种能力揭示了一个重大优势，这款虽然昂贵但确实有优势的 Fitlet 相比竞品超紧凑计算机而言：它使用业界标准的 UEFI BIOS 和 64 位 x86
    处理器 AMD A10-Micro6700T，这意味着它与几乎任何现代桌面或服务器操作系统都兼容。甚至可以通过在 BIOS 中选择新的目标热配置来超频 1.2GHz
    四核芯片以提升性能——如果你想从设备中榨取最大性能，Compulab 还出售一个带有更大散热片的替换机箱盖，价格为 $15。


    不过，即使超频，Fitlet 也无法与最便宜的桌面系统相提并论，你也不应期望如此：CPU 的热设计功耗仅为 4.5W，整个系统极其节能。但这并不意味着 Compulab
    在功能上有所削减：有两个 USB 3.0 和三个 USB 2.0 端口，一个带电源的 eSATA 6Gb/s 端口，两个全速千兆以太网端口，一个 micro-SD
    卡槽，模拟和 S/PDIF 数字音频输入输出，甚至还有一个 micro-RS232 接口。板载显卡还驱动两个 HDMI 1.4a 端口，实现双显示器功能。


    Compulab 还出售一系列配件：VESA 和 DIN 导轨安装座、上述散热片、3G 调制解调器，甚至还有一个微型 12V UPS。


    唯一的真正失望来自于通用迷你输出（GPIO）接口，Compulab 为此出售可选的 breakout 电缆：截稿时，GPIO 驱动程序尚不可用，尽管宣称对三个
    1.5V 和六个 3.3V 用户可寻址引脚的支持工作即将完成。


    Gareth Halfacree


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_86_0.png)


    下图：小巧但功能完备 – Fitlet 已经是一台强大的机器，但未来潜力巨大


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_86_1.png)


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_86_2.png)


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_86_3.png)


    ### 优点


    惊人的灵活性且已预装 Linux，对于注重能源或空间的用户来说，Fitlet 是一个极佳的选择。


    ### 缺点


    其性能自然落后于全尺寸 PC，且 Fitlet 的 GPIO 功能无法进行测试。


    > “使用构成机箱侧面板的 Facet 模块，可以改变 Fitlet 的功能。”


    ### 总结


    Fitlet 令人印象深刻，Facet 系统为未来的重新设计承诺了灵活性。虽然其 CPU 性能更接近平板而非全尺寸 PC，但其功耗也是如此 – 而且其体积仅比某些笔记本电脑电源适配器稍大。将出色的
    Linux 支持与通过超频提升性能的潜力相结合，你就得到了一台诱人的机器。


