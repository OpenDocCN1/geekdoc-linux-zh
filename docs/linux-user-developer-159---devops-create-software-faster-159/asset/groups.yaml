    # Code a Tempest clone in FUZE BASIC Part 1


    # Remake a classic game in FUZE BASIC and delve into the world of programming


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_73_1.png)


    **Luke Mulcahy** is the FUZE team''s in-house programmer. Just 15 years old, Luke
    is adept in many programming languages, though he doesn''t love to put FUZE BASIC
    through its paces.


    Welcome to our latest FUZE BASIC tutorial. If you haven''t already gotten hold
    of this programming language, FUZE BASIC can be downloaded for free for both Linux
    and Raspberry Pi users from fuze.co.uk/getfuzebasic.


    So why should you bother to learn BASIC? Well, BASIC (Beginner''s All-purpose
    Symbolic instruction Code), was instrumental in starting the computing revolution
    back in the Seventies and Eighties. Thirty years on and BASIC, or in this case
    FUZE BASIC, presents a modernised version of the original classic. Now with updated
    commands for advanced sprite and media handling, the removal of goto and gosub
    commands as well as line numbers, and the fact that on modern hardware it


    races along, it still remains one of the easiest introductions for users wanting
    to jump into the world of programming.


    To prove just how straightforward it is to use, in this tutorial we''re going
    to be looking at programming a classic arcade game. Then, over the next two issues
    we''ll take you from this basic graphics engine to introduce enemies, firing and
    collisions, and then finally refinements such as an intro screen and hi-score
    tables, plus some tidy-ups and optimisations.


    Our game, 73MP357, is a remake of a true classic - Dave Therur''s *Tempest* by
    Atari way back in 1981. We also couldn''t resist paying tribute to the incredible
    remake by Jeff Minter for the Atari Jaguar.


