    \n## 10 放置玩家\n\n是时候确定玩家绘制的位置并调整视角了。玩家的位置会在两个不同位置进行计算并取平均值，以匹配多边形和平行视差效果。圆上某点的位置计算如下：\n\
    \n```\nx = cos( angle ) * radius\ny = sin( angle ) * radius\n```\n\n正弦和余弦的零值中心位于原点，因此我们需要在玩家的\
    \ X 和 Y 坐标中加入屏幕中心点。玩家中心是通过半径乘以玩家角度的余弦值，再加上屏幕中心计算得出的。\n\n## 11 固定速度\n\n`moveCount`\
    \ 和 `moveDelay` 变量用于固定玩家在游戏关卡中的移动速度，无论关卡包含多少个部分。\n\n下一节代码检查玩家位于屏幕的哪个象限，并相应地移动中心点。游戏区域每帧移动几个像素，直到受到以下限制：\n\
    \n```\nif centerX < ( gwidth / 2 ) + ( gwidth / 20 )\n```\n\n最后，使用 `polypot` 命令计算并绘制玩家的位置。角度被固定，使得玩家面向中心，并且大小会根据显示分辨率进行缩放。\n\
    \n## 12 构建多边形\n\n`polystart` 命令允许通过一系列线条构建多边形并自动填充。\n\n与其在每个 `polystart` 语句中的每个绘图操作中计算自动求和，我们提前使用\
    \ c = cos( pAngle + 90 ) 和 s = sin( pAngle + 90 ) 进行了计算，u 则是飞船相对于显示分辨率的比例。\n\n\
    ## 13 多边形方程\n\n多边形上的每个 X 坐标点基于（比例 * 线长）乘以 cos( playerAngle + 90 )，减去（比例 * 线长）乘以\
