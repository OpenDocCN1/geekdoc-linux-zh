    - `/Vagrantfile`\n\n## 基础镜像（Boxes）\n\n与其从零开始构建虚拟机（这通常耗时且费力），Vagrant 使用基础镜像来快速克隆虚拟机。这些基础镜像在\
    \ Vagrant 中被称为“box（基础镜像）”，而在创建 Vagrantfile 时，指定要使用的基础镜像始终是第一步。您可以使用以下命令将基础镜像添加到\
    \ Vagrant 中：\n\n```\n$ vagrant box add hashicorp/precise32\n```\n\n该命令会将基础镜像存储在一个特定的名称下，以便多个\
    \ Vagrant 环境可以复用它。请注意，HashiCorp 是 Vagrant 背后的公司，上述命令将从 HashiCorp 的基础镜像目录下载名为“hashicorp/precise32”的基础镜像。一旦基础镜像被添加到\
    \ Vagrant，您就可以配置项目以使用它作为基础。打开 Vagrantfile 并将其内容更改为以下内容：\n\n```\nVagrant.configure(\"\
    2\") do |config|\n  config.vm.box = \"hashicorp/precise32\"\nend\n```\n\n您可以在以下地址搜索\
    \ HashiCorp 的 Vagrant 基础镜像目录：atlas.hashicorp.com/boxes/search。\n\n## 端口转发\n\n\
    在某些情况下，您可能希望访问宿主机的某个端口，并将请求转发到客户虚拟机的某个端口。在 Vagrant 中，只需在 Vagrantfile 中添加一行即可设置端口转发。\n\
    \n在下面的示例中，访问 `localhost:8080` 将访问客户机器的 80 端口，而访问 `localhost:8443` 将访问客户机器的 443\
    \ 端口。\n\n```\nconfig.vm.network :forwarded_port, guest: 80, host: 8080\nconfig.vm.network\
    \ :forwarded_port, guest: 443, host: 8443\n```\n\n## 设置 Docker 容器\n\nVagrant 提供了一种方法，用于在多种操作系统上创建可重复的开发环境。它使用提供者（provider）来启动隔离的虚拟环境。默认提供者为\
    \ VirtualBox，但自 Vagrant 1.8 起，也支持基于 Docker 的开发环境。与其他工具（如 boot2docker，它有助于在非 Linux\
    \ 平台上运行 Docker）相比，Vagrant 具有一些重要优势：\n\n- 一次配置，处处运行 – 在原生支持 Docker 的系统上，Vagrant\
    \ 仅仅是一个 Docker 封装层；而在不支持 Docker 的系统上，它会启动一个“宿主虚拟机”来运行容器。用户无需关心 Docker 是否原生支持；相同的配置将在所有操作系统上有效。\n\
    - Docker 宿主不仅仅局限于 boot2docker（一个基于 Tiny Core Linux 的 VirtualBox 镜像） – 还支持 Debian、Ubuntu、CoreOS\
    \ 和其他 Linux 发行版。\n- Vagrant 可以编排 Docker 容器。这意味着您可以同时运行多个容器并将它们连接在一起。\n\n默认基础镜像目录中有一个用于\
    \ boot2docker 的 Vagrant 基础镜像。您只需运行以下命令即可将该 Vagrant 基础镜像添加到您的系统中：\n\n```\n$ vagrant\
    \ box add mitchellh/boot2docker\n```\n\nVagrant 会提示您选择提供者，然后下载所选提供者的相应基础镜像版本。然后，除非您另有指示，Vagrant\
    \ 在执行任何 Docker 提供者操作时都会启动该 boot2docker 基础镜像的一个实例。如果您尚未添加该 Vagrant 基础镜像，那么第一次使用\
    \ Docker 提供者时，它将自动下载基础镜像。这是使用 Vagrant 设置 Docker 的简便方式。但如果您不想使用 boot2docker 怎么办？如果您更希望使用\
    \ Ubuntu 或 CentOS，以便您在 Vagrant 中的操作更接近于在数据中心中可能执行的操作，该怎么办？\n\n您可以通过在创建 Docker\
    \ 容器的 Vagrantfile 中添加一行来更改此行为。具体行可能如下所示：\n\n```\ndocker_image_vagrantfile='path/to/host/VV/Vagrantfile'\n\
    ```\n\n因此，您需要创建一个启动运行您所选 Linux 发行版的虚拟机的 Vagrantfile，然后在创建 Docker 容器的那个 Vagrantfile\
    \ 中引用该文件。当然，由于 Vagrant 期望文件名是 Vagrantfile，因此定义宿主虚拟机的文件必须位于与定义 Docker 容器文件不同的目录中。因此，您需要指定宿主虚拟机\
    \ Vagrantfile 的路径。\n\n虽然 Vagrant 期望 Docker 在此宿主虚拟机内运行，但它提供了一种简化方式，允许您在运行 `vagrant\
