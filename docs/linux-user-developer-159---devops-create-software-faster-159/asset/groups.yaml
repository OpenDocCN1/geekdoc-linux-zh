    ## MINI PC


    ### Compulab Fitlet iA10


    With features rivaling desktops dozens of times larger, is Compulab''s Fitlet
    product the ultimate example of a miniature Linux box?


    - **CPU**: Quad-core 1.2GHz (2.2GHz Turbo) AMD A10-Micro6700T APU

    - **GPU**: Integrated 500MHz Radeon R6 with 128 shader cores

    - **RAM / Storage**: 4GB DDR3 / 64GB mSATA SSD

    - **Network**: 2x gigabit Ethernet, Intel AC-7260 Dual-Band Wi-Fi, Bluetooth 4.0

    - **Connectivity**: 2x HDMI, 2x USB 3.0, 3x USB 2.0, 1x micro-SD, GPIO header,
    RS232 header, powered eSATA 6.0G/s

    - **Dimensions**: 108mm x 83mm x 24mm

    - **Price**: £300

    - tinyrepc.com (UK)

    - fit-pc.com (International)


    The Fitlet is a tiny PC, fully compatible with Linux, and has more features than
    you can shake a stick at. And while it isn''t Compulab''s first fanless mini PC,
    it may well be its best.


    Unboxing the Fitlet is a great experience: the box seems too small to hold a computer
    of any power, but the machine itself – housed in a metal chassis, the top of which
    doubles as a heatsink – takes up a tiny fraction of this, with the remaining space
    given over to a wall-wart power supply, HDMI-to-DVI adaptor cable, plus an antennae
    for the built-in Wi-Fi available on the top-end model, the Fitlet-iA10.


    The existence of a top-end model implies there''s a bottom-end, of course. The
    Fitlet family, in fact, is made up of a range of externally identical devices:
    the Fitlet-b is the entry-level model, with the Fitlet-i offering more functionality
    and an improved processor, while the Fitlet iA10 improves the processor still
    more. There''s even a Fitlet-X range, which replaces the dual gigabit Ethernet
    and eSATA ports of the Fitlet-i with three gigabit Ethernet ports – all of which
    run at full speed on the PCI Express bus.


    This role flexibility is made possible by a system Compulab has dubbed Facet.
    Using Facet modules, which make up the side panel of the chassis, it''s possible
    to alter the functionality of a Fitlet – a feature the company has promised to
    exploit more fully with additional Facet modules in future.


    The model reviewed is the Fitlet iA10, supplied with a 64GB mSATA SSD and 4GB
    DDR3 RAM. This is unusual:


    Fitlets are usually sold bare-bones, although UK supplier TinyGreenPC allows the
    buyer to select from a variety of storage and memory options at the point of purchase.
    Useful that may be, but TinyGreenPC does charge a premium over buying from Compulab
    direct – and a whopping £48 including VAT to copy a Linux Mint 17.2 system image
    to the optional SSD, a fee we’d suggest to readers should be eschewed in favour
    of booting from a Live USB and installing it yourself for free.


    The ability to do this reveals a major advantage the, admittedly expensive, Fitlet
    has over rival ultra-compact computers: it uses an industry-standard UEFI BIOS
    and 64-bit x86 processor, the AMD A10-Micro6700T, meaning it’s compatible with
    almost any modern desktop or server operating system. It’s even possible to overclock
    the 1.2GHz quad-core chip, by selecting a new target thermal profile in the BIOS,
    to boost performance – and Compulab sells a replacement chassis lid with larger
    heatsink fins for $15 if you want to squeeze the most performance possible from
    the device.


    Even overclocked, though, the Fitlet can’t hold a candle to the most budget desktop
    system, nor would you expect it to: the CPU has a 4.5W thermal design profile,
    and the entire system is extremely energy efficient. That doesn’t mean Compulab
    has skimped on features, though: there are two USB 3.0 and three USB 2.0 ports,
    a powered eSATA 6Gb/s port, two full-speed gigabit Ethernet ports, a micro-SD
    slot, analogue and S/PDIF digital audio inputs and outputs, and even a micro-RS232
    header. The on-board graphics also drives two HDMI 1.4a ports for dual-display
    functionality.


    Compulab also sells a range of accessories: VESA and DIN-rail mounts, the aforementioned
    heatsink, a 3G modem and even a miniature 12V UPS.


    The only real disappointment comes in the form of a general-purpose mini-output
    (GPIO) header, for which Compulab sells an optional breakout cable: at the time
    of writing, GPIO drivers were not available, although work was claimed to be near-complete
    on support for the three 1.5V and six 3.3V user-addressable pins.


    Gareth Halfacree


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_86_0.png)


    Below: Small but perfectly formed – the Fitlet is already a capable machine, but
    has potential for so much more in the future


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_86_1.png)


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_86_2.png)


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_86_3.png)


    ### Pros


    Amazingly flexible and available with Linux already installed, the Fitlet is an
    excellent choice for the energy- or space-conscious user.


    ### Cons


    Its performance, naturally, lags behind that of a full-size PC, and the Fitlet’s
    GPIO capabilities could not be tested.


    > “Using Facet modules, which make up the side panel of the chassis, it’s possible
    to alter the functionality of a Fitlet.”


    ### Summary


    The Fitlet is impressive, and the Facet system promises flexibility for future
    redesigns. While its CPU performance is closer to a tablet than a full-size PC,
    so is its power draw – and its size is little larger than some laptop power supplies.
    Couple excellent Linux support with the potential to boost performance by overclocking
    and you’ve got a tempting machine.

