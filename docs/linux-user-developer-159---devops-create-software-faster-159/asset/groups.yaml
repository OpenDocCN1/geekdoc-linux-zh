    ## 09 fleet（集群管理工具）


    集群管理是 CoreOS 的主要独特卖点之一，而 fleet 正是实现这一功能背后的服务。从最终用户的角度来看，fleet 允许你将整个 CoreOS 集群视为一个共享的单一初始化系统。这意味着开发人员完全不需要担心集群本身，他们可以编写小型的、瞬时的单元（unit），这些单元可以轻松地在集群中迁移。与此同时，DevOps
    团队可以专注于运行构成服务的容器，而不必担心每个容器具体运行在哪台机器上。例如，如果一个应用程序由五个容器组成，fleet 会保证它们始终在集群的某处保持运行。


    高可用性通过确保服务容器不位于同一台机器上，甚至不在远程分布式系统中的同一可用区（availability zone）来实现。你可以使用 `fleetctl`
    命令来管理你的集群。此外，fleet 单元分为两种类型——全局单元（global units）和标准单元（standard units）。全局单元在启动时会在集群中的所有节点上运行，而标准单元则被调度到单台机器上。


    ## 10 etcd


    etcd 是一个分布式键值存储，它提供了一种可靠的方式，在机器集群之间存储数据。运行在 CoreOS 集群上的应用程序，无论运行在哪个节点上，都可以将数据写入
    etcd，你可以放心地知道，当需要时它们能取回这些数据。常见的例子包括存储数据库连接详情、缓存设置、功能标志（feature flags）等。请注意，etcd
    在集群中的每台机器上运行，并能优雅地处理节点丢失甚至当前主节点（master）丢失的情况。


    对 etcd 的读写是通过基于 HTTP 的 API 完成的。`etcdctl` 工具可以直接从 CoreOS 机器上使用，以设置键及其对应的消息。只需在命令行提示符中输入以下内容：


    ```bash

    $ etcdctl set /message Hello

    ```


    这里，`message` 是键，`Hello` 是值。要读取值，只需将键传递给 etcdctl。你可以输入：


    ```bash

    $ etcdctl get /message

    ```


    要删除该键，你可以输入：


    ```bash

    $ etcdctl rm /message

    ```


    你也可以从容器内部访问 etcd，但必须使用分配给 CoreOS 主机上 docker0 接口的 IP 地址。


