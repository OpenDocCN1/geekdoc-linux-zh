    # DevOps


    ## 更快地创建软件


    像专业人士一样部署和编排容器


    DevOps 是软件行业最新的流行词——这一实践承诺以各团队之间**最小的摩擦**向客户**快速交付**。正如预期的那样，每个人都想要实施 DevOps。但就像应以受控方式和固定剂量服用的药物一样，DevOps
    也应分阶段采用。牢记人力资源等重大因素。不这样做只会导致团队间的混乱和误解。


    适当规划 DevOps 实施的第一步是理解 DevOps 本身，然后是与之相关的各种因素。在本专题中，我们将只做这件事。我们将从 DevOps 的介绍开始，以及如何使其有效运作的最佳实践，随后介绍一些与
    DevOps 相关工具的教学。


    在工具方面，我们将涵盖 Docker、Puppet 和 Vagrant。如您所知，Docker 是一个容器化引擎。它以高效方式帮助创建封装软件及其所需依赖项的容器。Puppet
    是一个配置管理工具。它允许你描述系统资源及其状态，使用 Puppet 的声明式语言或在文件中使用 Ruby DSL。Vagrant 帮助自动配置多个虚拟机，每个虚拟机都有由
    Puppet 管理的独立配置。Vagrant 还有一个 Docker 提供程序，这意味着你可以使用 Vagrant 管理多个 Docker 容器。


    # 理解 DevOps


    在实施 DevOps 之前，让我们理解核心 DevOps 概念以及 DevOps 可以帮助的典型场景。


    那么，DevOps 究竟是什么？专家说，如果你问 10 个人，可能会得到多达 10 个不同的答案。这是因为缺乏标准化的 DevOps 定义。相比之下，其他所有主要的软件开发和部署方法都基于特定定义。但
    DevOps 基于现代组织的实际、现实生活需求，而不是研究人员进行的研究。现代组织需要在运营中敏捷；它们需要增加生产发布的频率，并减少在测试和持续集成等冗余任务中的人工干预。它们需要清楚地了解开发和交付管道。DevOps
    承诺实现所有这些甚至更多。


    为 DevOps 制定定义可能是徒劳的；相反，最好清楚地理解其核心思想——自动化；在开发、测试和运营团队之间标准化基础设施；所有团队成员拥有跨越整个交付管道的概览等。所有这些实际上都指向同一个方向——最大限度地减少因非计划基础设施问题造成的延误，并向客户更快、可靠地交付。现在，理解这一点很重要：不同的组织有不同的客户和需求，几乎不可能采用一刀切的方法，因此你的责任是理解你组织中的交付瓶颈，然后采用
    DevOps 实践来解决它们。


    让我们以一个典型的软件产品开发公司的场景为例——团队想出了一个杀手级新功能，并计划在一周内上线生产环境。开发团队努力工作，按时发布了代码。代码被推送到开发服务器，测试被执行，一切似乎运行正常。


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_18_0.png)


    最终，团队获得了批准，将代码移至生产服务器，功能上线。在用户得知新功能之前，一切顺利进行几个小时。但一旦流量增长，可怕的“Internal Error 500”页面开始出现在大多数用户面前。后来得知，一项关键的服务器更新未在生产服务器上执行。虽然服务器在没有更新的情况下可以处理少量用户，但处理大量流量是不可能的。这次失误的原因是开发和基础设施团队之间沟通不畅。你明白这里的重点了——如果该组织采用了
    DevOps 原则，沟通会更加清晰，这种事件可能可以避免。


    > 上方：DevOps 减少了敏捷工作流中已完成冲刺与代码发布之间的延迟


    敏捷为软件开发流程提供了明确的指南，但有时它们对现代组织的需求来说是不够的。让我们看看一些简单的技巧，帮助你在保持敏捷框架的同时实施 DevOps 原则。


    - **产品待办列表（Product backlog）：** 启用团队之间更好沟通的简单方法是在产品待办列表中添加与不同团队（如开发、测试、基础设施）相关的额外字段。这确保所有内容都被记录在案，误解的可能性最小。

    - **Scrum 中的 Scrum（Scrum of scrums）：** Scrum 是敏捷方法的组成部分。不同团队的 Scrum Master 的会议，即
    Scrum 中的 Scrum，可以确保来自不同团队的人员保持同步。

    - **完成定义（Done definition）：** 在冲刺的完成定义中添加与运营相关的项目，是确保运营问题得到妥善处理的另一种实用方法。


    # 关注员工


    DevOps 建议改变团队工作方式。虽然这些改变从外部看很简单，但对于需要改变工作方式的人来说，这可能意味着很多混乱。理解这一点非常重要：实际上是你的员工将决定你的
    DevOps 梦想的成功或失败。因此，在实施新的 DevOps 工具之前，你应该让他们放心并充分培训他们。


    # 如何结合敏捷实践实施 DevOps


