    # CONFERENCE


    Developers to meet face-to-face at new UbuCon Summit


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_5_0.png)


    # New conference fills hole left by cessation of physical summits


    Canonical has announced that it is to hold a new physical event, the UbuCon Summit,
    in January 2016 following complaints of a lack of face-to-face gatherings; a result
    of the shift of Ubuntu Developer Summits from physical meet-ups to virtual conferences.


    The UbuCon Summit, the company has explained, builds on the successes of volunteer-organised
    local UbuCon events and scales it up, using the existing team behind the UbuCon
    SCALE event in Pasadena, California as a base.


    “In discussions with the Community Council, and after the participation of some
    Ubuntu team members at the Community Leadership Summit a few months ago, one of
    the challenges that we identified our community is facing is the lack of a global
    event to meet face-to-face after the UDS era,” explained Canonical’s David Planella.


    While UbuCons continue to thrive as regional conferences, one of the conclusions
    we reached then that we needed a way to bring everyone together on a bigger setting
    to complement the UbuCon fabric: the Summit.”


    The first UbuCon Summit will be a two-day event, structured as both an organised
    conference and an ad-hoc unconference running side-by-side. Two tracks will be
    available to the attendees: Users, which will concentrate on the day-to-day uses
    of Ubuntu and how to act as an advocate for uptake of the popular Linux distribution;
    and Developers, which will offer technical sessions including app development,
    Internet of Things (IoT) and cloud topics. In addition to the new convergence
    functionality that Canonical is aiming to build within its Ubuntu mobile ecosystem.


    The UbuCon Summit will mark the first large-scale official gathering of Ubuntu
    developers and users since the Ubuntu Developer Summits switched from twice-yearly
    physical events to virtual events hosted on Google''s Hangouts service in 2013.
    To mark the occasion, Canonical founder Mark Shuttleworth has been confirmed as
    keynote speaker, with more details on the schedule promised in the coming weeks.


    “The Summit is the expansion of the traditional UbuCon: more content and at a
    bigger scale,” claimed Planella. “But at the same time maintaining the grass-roots
    spirit and the community-driven organisation that has made these events successful.
    All in all, the idea is to provide a space to showcase, learn about and discuss
    the latest Ubuntu technologies, but also to focus on new and vibrant parts of
    the community and talk about the challenges (and opportunities!) we are facing
    as a project.”


    The UbuCon Summit is to be held at the Pasadena Convention Centre on 21 and 22
    January 2016 as part of the Southern California Linux Expo (SCALE). Organisers
    include Richard Gaskin and Nathan Haines of the Ubuntu California LoCo group,
    who have been heavily involved in previous SCALE-hosted UbuCon events, and Gareth
    Greenaway and Ilan Rabinovitch of SCALE itself.


    More information on the event is available on the official UbuCon website at ubucon.org,
    or via SCALE at socallinuxexpo.org.


    > “The UbuCon Summit builds on the success of volunteer-organised local UbuCon
    events and scales it up”'
