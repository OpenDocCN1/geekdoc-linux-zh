    ### 优胜者是……


    #### Back In Time


    Back In Time 凭借其令人印象深刻的功能集获得了更高的分数，这些功能揭示了同步和 Linux Shell 实用程序内部潜力。它还以其与大多数桌面环境的精致集成、干净且专业的外观布局以及非常合理的默认预设而闻名——例如预定义的常用排除文件夹列表。但仍有一些问题需要讨论，这些问题可能会影响你对备份工具的选择。第一个问题是简洁性。Back
    In Time 并不是最容易上手的工具，但这仅在你首次启动它时成立。一旦你完成第一次测试备份，你就会爱上这个强大的工具。作为回报，你获得了关于备份什么、在哪里备份以及如何备份的精确控制——这是像
    Déjà Dup 这样更简单的工具所无法提供的。


    另一个顾虑是 Back In Time（以及 luckyBackup）缺乏归档选项。不过，我们认为这不是一个巨大的问题，因为它带来的用处不大。你可能想要备份的最庞大的文件通常是视频、数据库和其他二进制数据，这些数据本身已经被压缩或编码了。将其封装到额外的压缩归档中需要大量的时间和
    CPU 算力，而最终可能几乎没有好处。毕竟，从未压缩状态恢复文件也简单得多。当然，还有更多用于 Linux 的备份软件标题，例如用于企业级备份的 Bacula，或数十种非开源的基于云的服务（Dropbox/MEGA/SpicrOak）。然而，我们希望能挑选出最用户友好且易于设置的工具，这些工具可以在平均的
    Linux 机器上安装和使用。在许多热门选择中，Back In Time 似乎是最均衡且最适合日常使用的。


