  - '[PAGE 27]


    Mihalis Tsoukalos

    is a Unix administrator, a programmer for Unix and iOS, a DBA and also a motion
    designer. He has been using Linux since 1993


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_27_0.png)


    # # Systems programming: Files and directories


    Find out how to work with files, directories and symbolic links using system calls
    to write tools


    This tutorial will present the system calls and explain the techniques that will
    enable you to deal with files and directories in Linux. The stat family of functions
    and the stat structure that holds all important data are the centre of this tutorial.
    The majority of the other system calls here enable you to change most of the attributes
    kept in the stat structure. Although the stat family has four functions: stat,
    fstat, lstat and fstatat, only the first three will be explained here. However,
    all of them return the same information, which is a stat structure, and have the
    same man page, which should be the first and the last place you will need to look
    for additional information.


    As always, most topics come with the relevant C code that clarifies the tricky
    parts of each individual concept. Nevertheless, you should try to experiment and
    write your own code. The best way to do so is by trying to implement simple versions
    of existing Linux command line utilities.


    In addition to the expected C code, you are going to see code in Perl, Go and
    Haskell, a scripting language, a general purpose programming language and a functional
    programming language, respectively.


    Before continuing, you should always remember that when you talk about files in
    UNIX or Linux, it could mean everything from a network device, a network socket,
    a whole hard driver or a printer to a plain text file.


    # ## The stat() system call


    The following code shows a simple program (fstatEx.c) that uses both stat() and
    fstat() and gives you information about files and directories. The main difference
    between stat() and fstat() is that the former needs a pathname as input whereas
    the latter wants a file descriptor as input. Therefore, fstat() is more appropriate
    when you want to examine a file that is already open. The stat functions are mostly
    used by the ls utility.


    ```

    #include <stdio.h>

    #include <sys/stat.h>

    #include <fcntl.h>

    #include <unistd.h>


    int main(int argc, char** argv)

    {


    ```


