  - "[PAGE 24]\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_24_0.png)\n\nVagrantfiles\
    \ follow Ruby syntax, but knowledge of Ruby is not necessary in order to make\
    \ modifications to the Vagrantfile, since it is mostly simple variable assignment.\n\
    \nNote when you run a vagrant command, Vagrant climbs up the directory tree looking\
    \ for the first Vagrantfile it can find, starting first in the current directory.\
    \ So if you run vagrant up in /home/user/projects/foo, it will search the following\
    \ paths, in order, for a Vagrantfile until it finds one:\n\n+   - /home/user/projects/foo/Vagrantfile\n\
    +   - /home/user/projects/Vagrantfile\n+   - /home/user/Vagrantfile\n+   - /home/Vagrantfile\n\
    +   - /Vagrantfile\n\n# Boxes\n\nInstead of building a virtual machine from scratch,\
    \ which generally takes lot of time and effort, Vagrant uses a base image to quickly\
    \ clone a virtual machine. These base images are known as boxes in Vagrant, and\
    \ specifying the box to use for your Vagrant environment is always the first step\
    \ while you are creating a Vagrantfile. Boxes are added to Vagrant with:\n\n```\n\
    $ vagrant box add hashicorp/precise32\n```\n\nThis stores the box under a specific\
    \ name so that multiple Vagrant environments can re-use it. Note that HashiCorp\
    \ is the company behind Vagrant, and the above command will download the box called\
    \ “hashicorp/precise32” from HashiCorp’s box catalog. Once a box has been added\
    \ to Vagrant, you can configure a project to use it as a base. Open the Vagrantfile\
    \ and change the contents to the following:\n\n```\nVagrant.configure(\"2\") do\
    \ |config|\n  config.vm.box = \"hashicorp/precise32\"\nend\n```\n\nYou can search\
    \ through HashiCorp’s catalogue of Vagrant boxes at: atlas.hashicorp.com/boxes/search.\n\
    \n# Port forwarding\n\nIn some cases, you may want to access a port on your host\
    \ computer and have your request forwarded to a port on the guest virtual machine.\
    \ Port forwarding can be set in Vagrant by adding one line to the Vagrantfile.\n\
    \nIn the following example, accessing localhost:8080 will access port 80 on the\
    \ guest machine, and localhost:8443 will access port 443 on the guest machine.\n\
    \n```\nconfig.vm.network :forwarded_port, guest: 80, host: 8080\nconfig.vm.network\
    \ :forwarded_port, guest: 443, host: 8443\n```\n\n# SET UP DOCKER CONTAINERS\n\
    \nVagrant provides a method for creating repeatable development environments across\
    \ a range of operating systems. It uses providers to spin up isolated virtual\
    \ environments. The default provider is VirtualBox, but since Vagrant 1.8, Docker-based\
    \ development environments have been supported too. Compared to other tools like\
    \ boot2docker, which can help run Docker on non-Linux platforms, Vagrant has some\
    \ important advantages:\n\n+   - Configure it once and run it everywhere – Vagrant\
    \ is just a Docker wrapper on systems that support Docker natively, while it spins\
    \ up a ‘host VM’ to run containers on systems that don’t support it. Users don’t\
    \ have to bother themselves with whether Docker is supported natively or not;\
    \ the same configuration will work on every OS.\n+   - Docker hosts are not limited\
    \ to boot2docker (a VirtualBox image of Tiny Core Linux) – Debian, Ubuntu, CoreOS\
    \ and other Linux distros are supported too.\n+   - Vagrant can orchestrate Docker\
    \ containers. This means you can run multiple containers concurrently and link\
    \ them together.\n\nA Vagrant box for boot2docker is available on the default\
    \ box catalog. You can add that Vagrant box to your system by simply running the\
    \ following:\n\n```\n$ vagrant box add mitchellh/boot2docker\n```\n\nVagrant will\
    \ prompt for the provider and then download the appropriate version of the box\
    \ for the selected provider. Then, unless you tell it otherwise, Vagrant will\
    \ spin up an instance of this boot2docker box anytime it needs to perform Docker\
    \ provider operations. If you haven’t already added the Vagrant box, the first\
    \ time you use the Docker provider, it will download the box automatically. This\
    \ is the easy way to set up Docker with Vagrant. But if you don’t want to use\
    \ boot2docker? What if you’d rather use Ubuntu or CentOS, so that what you do\
    \ in Vagrant more closely matches what you might do in the data centre?\n\nYou\
    \ can change this behaviour by adding a line in the Vagrantfile that spins up\
    \ your Docker containers. The specific line would look something like this:\n\n\
    ```\ndocker_image_vagrantfile='path/to/host/VV/Vagrantfile'\n```\n\nSo, you need\
    \ to create a Vagrantfile that spins up a VM running the Linux distribution of\
    \ your choice, and then reference that Vagrantfile in the one that creates your\
    \ Docker containers. Of course, since Vagrant expects the filename to be Vagrantfile,\
    \ the file defining the host VM must be in a different directory to the file defining\
    \ the Docker containers. So, you need to specify the path to the host VM Vagrantfile.\n\
    \nAlthough Vagrant expects Docker to be running inside this host VM, it does provide\
    \ a way to simplify that by allowing you to provision (install) Docker into the\
    \ VM when you run vagrant up (much in the same way Vagrant can provision other\
    \ things into a VM when it is first instantiated). This is done with a simple\
    \ command in the host VM Vagrantfile:\n\n```\nconfig.vm.provision \"docker\"\n\
    ```"
