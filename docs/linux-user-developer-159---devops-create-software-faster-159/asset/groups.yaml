    \n![](img/0fc17bd4c29dc437e3ac28a53f7559db_62_2.png)\n\n# Young and old\n\nIn\
    \ situations where Pygame is used boilerplate and all, with young people, great\
    \ results can also be achieved (see Bryan Payne's book), but Pygame and Pgz0,\
    \ despite their use as powerful educational tools, are also good for creating\
    \ games for coders no matter what stage of learning they are at.\n\nGreat games\
    \ are all about the gameplay, driven by powerful imaginations generating images,\
