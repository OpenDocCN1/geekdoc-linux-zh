    \ a projects pack and directs you to plenty of online resources at the FUZE Lair,\
    \ giving you everything you need to get started. For more information, head over\
    \ to www.fuze.co.uk.\n\n# Enter the competition\n\nFor a chance to win a FUZE\
    \ T2-SE – a Special Edition with the robotic arm kit – just go to the link below.\
