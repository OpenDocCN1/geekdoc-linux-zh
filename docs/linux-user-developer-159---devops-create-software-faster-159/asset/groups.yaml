    **Mike**


    Indeed there is, so don’t buy a new mouse and keyboard yet as there are two main
    solutions that instantly come to mind. They do depend on how close the PC and
    laptop are, and how you want to handle it.


    The more common method would be to use a remote desktop app to dial into the laptop.
    You can set up a server on it using a number of services (such as Remmina) that
    you can then create a connection to on your main PC. Save the settings and you
    can quickly connect whenever you want. You’ll have a view of the desktop on your
    main PC and be able to use your mouse and keyboard on it.


    Otherwise, there’s also Synergy. Synergy enables you to treat your PC as a server
