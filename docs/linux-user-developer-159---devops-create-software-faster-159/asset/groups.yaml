    # 评测


    81 团体测试 | 86 Fitlet iA10 | 88 自由软件


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_80_0.png)


    ## 团体测试

    ## 备份方案


    备份工具并非奢侈品——每个人都应当拥有一个，以便在主存储设备故障时恢复宝贵的数据。


    - **LuckyBackup**

    LuckyBackup 是一款拥有 Qt4 界面的流行归档工具。该应用在 2008-2010 年间在 kde-apps.org 上获得了高分，并且目前仍位居排行榜前列。当前，LuckyBackup
    的开发几乎停滞不前；不过，这很难被视为缺陷，因为备份工具将在未来几年内保持有用。

    *下载：bit.ly/1P4jllhV*


    - **Back In Time**

    Back In Time 网站提供了许多过时的软件包，但也有新的提交记录。该工具正在积极开发并频繁接收更新。Back In Time 同样是一个基于 Qt
    的应用程序，但它拥有针对 KDE 和 GNOME 的独立集成软件包，因此在任何环境中都表现出色。

    *下载：bit.ly/1BcpJV*


    - **Déjà Dup**

    Déjà Dup 是本次测试中唯一直接基于同步功能的竞争者。它与 GNOME、Unity 和 Cinnamon 紧密集成，并驻留在控制中心中。Déjà Dup
    背后的设计思想是隐藏所有的麻烦和复杂性，同时也对技术敏感度不高的用户保持友好。

    *下载：bit.ly/1k4WLPp*


    - **KBackup**

    这里无需解释其中的字母 ''K''，因为 KBackup 是一个完全与桌面环境无关的应用程序。它与 Back in Time 和 luckyBackup 共享大部分功能，但提供了更干净、更易于理解的图形用户界面。尽管看起来如此简单，KBackup
    仍能生成良好的备份副本。

    *下载：bit.ly/1JA7cf*


    ## 备份方案评测


    ### LuckyBackup


    一个围绕多种同步选项构建的精妙且完整的封装器


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_81_0.png)


    “高级”按钮会扩展丰富的可用选项和可调参数。


    **易用性**


    首次启动 luckyBackup 时，其多样的菜单、工具栏按钮和窗口区域可能会让你有点眼花缭乱。为了完成工作，你必须创建一个新的任务，填写其名称、源目录和目标目录，并在高级设置中根据需要更改默认行为。这并不太复杂，但对于新手来说，可能值得谷歌搜索正确的操作步骤序列。


    **功能集**


    LuckyBackup 具有配置文件、计划任务以及对各种行为类型的支持，例如保留快照、更新增量备份、同步或复制。它还可以将备份副本存储在远程位置，执行试运行，记录所有日志，甚至通过电子邮件通知你。


    **访问已备份的数据**


    虽然 luckyBackup 可以将备份副本压缩为归档文件，但默认设置建议源文件和目录被完整地传输到目标目录。这意味着你的数据触手可及，随时可以进行读写操作。LuckyBackup
    不会阻止 Linux 用户操作已备份的文件。


    **可用性与集成**


    LuckyBackup 是一个第三方开源应用，但它包含在大多数 Linux 发行版中。该应用程序在任何桌面环境下运行和外观都同样良好，并支持大多数桌面的原生通知。但是，它与控制中心或系统设置没有集成——luckyBackup
    是一个完全独立的应用程序。


    **总体评价**


    LuckyBackup 绝对是一款智能应用，一旦你花时间探索其选项，你将准备好管理任何形式的备份。我们喜欢“试运行”选项，它可以防止你对数据造成伤害。


    8


    ### Back In Time


    一个功能强大、充满亮点且专注于增量备份的工具


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_81_1.png)


    Back in Time 已经知道哪些内容可以从备份副本中跳过。当然，你可以自定义列表。


    **易用性**


    Back In Time 自称简单，但熟悉它需要时间和技巧。首次运行该应用时，它会打开设置窗口，要求你填写必填字段，如目标目录、包含在备份中的目录等。之后，你将处理主
    Back In Time 窗口，其外观类似于文件浏览器，备份快照作为入口点。


    **功能集**


    Back in Time 负责处理其他“简单”工具常忽略的许多辅助事项，例如使用 nice 和 ionice 工具来降低计划备份时的系统负载。然而，它不支持文件压缩，并且要求备份目标文件系统支持硬链接。


    **访问已备份的数据**


    一旦创建第一个快照，你导航到目标目录，将发现快照元数据文件与包含文件副本的“backup”子目录放在一起。在庞大的子目录树中，你的文件将显示得与源目录中一样。Back
    in Time 不能加密或归档数据；它只是复制数据。


    **可用性与集成**


    该应用程序有一个命令行界面，你可以通过运行 backintime -help 命令来发现它。图形应用程序有两种版本：backintime-kde4 和 backintime-gnome。Back
    in Time 并非主要 Linux 发行版的默认软件，但它广泛存在于许多发行版中，包括 openSUSE OBS 和 Arch AUR。


    **总体评价**


    如果你准备好与大量的同步相关选项打交道，并创建完美的备份副本，那么 Back in Time 是正确的选择。该应用程序既聪明又高效，而且也能很好地适应你喜欢的任何桌面。


    9


    ### Déjà Dup


    这个 GTK 应用程序使用 Duplicity 生成加密归档


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_82_0.png)


    Déjà Dup 很容易上手，这是一个明显的优势，但它也夺走了你对数据的控制权。


    **易用性**


    Déjà Dup 共享 GNOME UI 设计的方法：应用程序必须简单且易于开始使用。Déjà Dup 拥有干净且友好的界面，核心围绕“备份什么”和“备份到哪里”选项。除此之外，它可以忽略用户定义的文件夹，并根据计划执行备份。


    **功能集**


    这种干净且无杂乱界面的结果是你只获得基本功能。可以争论普通用户是否需要更多功能，因为 GNOME 和 Unity 用户倾向于像 OS X 用户那样思考，在那里简单性被视为神圣不可侵犯。


    **访问已备份的数据**


    同样，新手可能不喜欢这一点，但其他人需要确信他们的数据是可访问的。问题在于 Déjà Dup 不希望你该在应用程序之外操作已备份的文件。如果你以某种方式破坏了加密归档，你应该仅使用
    Déjà Dup 备份和恢复文件。


    **可用性与集成**


    这是 Déjà Dup 大放异彩的地方：它在任何包含 GNOME 组件及其默认应用程序的 Linux 发行版中即时可用。在 Unity 中，它也与侧面板集成，在那里
    Déjà Dup 图标显示备份或恢复进度。如果你使用 KDE 或自定义的最小化桌面，Déjà Dup 看起来效果不佳，但这不是大问题。


    **总体评价**


    Déjà Dup 简单且干净，但它在其他桌面上看起来不如基于 Qt 的应用程序在基于 GTK3 的桌面上美观。然而，最大的担忧是 Déjà Dup 使你远离对数据的控制。


    ### KBackup


    这款备份应用程序的标志上带有软盘的历史遗留元素


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_82_1.png)


    勾选你要备份的项目，选择一个目标目录，然后按下那个大按钮！


    **易用性**


    KBackup 显然赢得了用户友好性测试——我们甚至设法将全面的用户手册放在图片下方的说明中！事实上，凭借 KBackup 直率的逻辑和干净的 GUI 布局，你不可能迷路。选择源文件和目录，然后指定目标目录只需几秒钟。


    **功能集**


    一如既往，易用性和功能选择之间存在权衡。KBackup 这次看起来功能匮乏，唯一额外的是配置文件，你可以限制目标备份池的大小并设置计划任务。KBackup
    甚至无法从备份副本中恢复文件。


    **访问已备份的数据**


    KBackup 存储备份副本的方法是在纯目录结构和加密归档之间的一种折中方案。在目标目录中，你将找到一个以备份创建日期和时间命名的 TAR 文件。因此，KBackup
    将所有内容打包到一个未压缩的文件中。使用类似 tar -xvf yourfile.tar 的命令进行恢复。


    **可用性与集成**


    最新的 KBackup 版本自 2012 年以来未更新，但它已针对主要 Linux 发行版进行了打包，可以从标准存储库或 kde-apps.org 上的 KBackup
    页面获取。该应用程序支持系统托盘集成（不仅限于 KDE），并在任何桌面环境中看起来都很不错。


    **总体评价**


    非常好，但也许太简单了。KBackup 甚至不关心你希望如何恢复已备份的数据。至少基本的复制功能按预期工作，而且你不会在简单的界面中迷路。


    '
