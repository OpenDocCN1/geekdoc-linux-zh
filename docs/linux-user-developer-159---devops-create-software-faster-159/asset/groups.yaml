    Because RARs are quite proprietary, and not so often used in the Linux community,
    they aren’t many apps that enable you to unpack RARs along with other types of
    compression. There is the package *unRAR*, though, that lets you do it, so all
    is not completely lost!


    You’ll need to install it on Ubuntu and most other distros (*sudo apt-get install
    unrar*). It’s then used in the command line with something like the following:


    ```

    $ unrar /path/to/file.rar

    ```


    It will unpack it in the directory you saved it to. Nice and quick!


    ### Stay secure

    I am always very conscious about my passwords and security on my system, and how
    I connect to the web. I have different passwords for all of them and like to think
    I use good password etiquette, but I’d like to really improve the way my details
    are kept, private and secure. Short of using Tails, I’m not quite sure what methods
    I can use to go about this. *Laura*


    You’re right, Tails is a bit of an extreme measure; although you’ll definitely
    be very secure and private. However, it goes a step further than what you seem
    to want.


    Our first step would be to get a good password manager, such as LastPass. Instead
    of having to remember several passwords, which can create problems and end up
    being a little less secure and very inconvenient, LastPass enables you to use
    one master password to access encrypted passwords within its database. As long
    as you have an excellent master password for LastPass, you can use complicated
    and highly secure passwords everywhere else.


    We’d still suggest keeping email accounts for the LastPass list of protected online
    services though, as emails tie it all together.


    Otherwise, you can try and use some hardware encryption tools so that it’s difficult
    to snoop your data. Or try using an alias online.


    > LastPass enables you to use one master password to access encrypted passwords
    within its database


