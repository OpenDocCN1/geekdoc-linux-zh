    read the two files character by character and then save the result into a new
    file using the same way.


    The three calls of the *system()* function use a Perl one-liner to reverse the
    input and present the digits of all integers in their correct order. You can remove
    it if you want and replace it with a simple *bin/cat* command.


    If you are a supporter of simple solutions then you should definitely go with
    the *add.c* implementation. However, if your purpose is to have the ‘perfect’
    solution then you should choose *addFile.c*. Your choice of the approach should
    also be based on your input.


    At this point you may well be asking: what about subtraction, multiplication and
    division? The approach for each one of them should be similar to the integer addition.
    However, there are three tricky points that you should consider beforehand:


    - If you divide two integers, the result could be a floating-point number, which
    does not happen with the other three operations.

    - The multiplication of two integers might quickly grow to be quite large because
    the result of a multiplication of two integers with N digits each can have as
    many as N+N digits.

