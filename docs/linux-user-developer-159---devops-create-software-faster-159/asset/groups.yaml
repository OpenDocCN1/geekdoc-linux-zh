  md: "\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_70_0.png)\n\n# Hack a robot\n\n\
    Left The Pi-Mote IR control board is hugely versatile and only costs £9.99\n\n\
    ### 02 Install the software\n\nNext, install the LIRC software; this stands for\
    \ Linux Infrared Remote Control and is the program that enables you to interact\
    \ with your robot and transmit commands. Open up the LX Terminal again and type:\n\
    \n```bash\nsudo apt-get install lirc\nsudo apt-get install lirc-x\n```\n\nOnce\
    \ the installation has finished, you need to restart your Pi using `sudo reboot`.\n\
    \n### 03 Edit the hardware file\n\nNext, we need to edit the `lircd.hw.conf` file\
    \ located in the `/etc/lirc/` folder and make the changes shown below. In the\
    \ terminal window, type:\n\n```bash\nsudo nano /etc/lirc/hardware.conf\n```\n\n\
    Find the `DRIVER`, `DEVICE` and `MODULES` lines in the file, then make the following\
    \ changes:\n\n```\nDRIVER = \"default\"\nDEVICE = \"/dev/lirc0\"\nMODULES = \"\
    lirc_rpi\"\n```\n\nPress `Ctrl+X` to save the file, don’t rename it, press `Y`\
    \ and then `return`. Restart the LIRC daemon with the command `sudo /etc/init.d/lirc\
    \ restart`.\n\n### 04 Test the IR receiver is working\n\nTo test that the IR receiver\
    \ is installed and working correctly, you need to head to the LX Terminal and\
    \ then stop the LIRC daemon (line 1), enable the test mode (line 2) and then start\
    \ the mode 2 testing (line 3):\n\n```bash\nsudo /etc/init.d/lirc stop\nsudo modprobe\
    \ lirc_rpi\nsudo mode2 -d /dev/lirc0\n```\n\nThis runs a program to output the\
    \ mark-space of the IR signal. It measures the pulse and space length of infrared\
    \ signals, returning the values to the terminal. Grab the robot’s remote control,\
    \ point it at the IR receiver and then press some buttons. You should see something\
    \ like this:\n\n```\nspace 16300\npulse 95\nspace 28794\npulse 80\nspace 19395\n\
    space 28794\npulse 80\n```\n\n### 05 Make the lircd.conf file: part 1\n\nThe `lircd.conf`\
    \ file contains the code or instructions to control your device. Although you\
    \ can find these online, you’ll probably have to create one from scratch. This\
    \ involves running the `irrecord` program, pointing your remote at the IR board\
    \ and then pressing buttons! This records the signals from your remote and then\
    \ you assign `KEYS` to each signal to transmit the signal to the robot. Stop the\
    \ LIRC software by typing this into the terminal:\n\n```bash\nsudo /etc/init.d/lirc\
    \ stop\n```\n\n### 06 Make the lirc.conf file: part 2\n\nNext, create your new\
    \ `lircd.conf` configuration file and save the output. In the LX Terminal, type:\n\
    \n```bash\nirrecord -d /dev/lirc0 ~/lircd.conf\n```\n\nThis will open the program\
    \ which will prompt you with instructions on how to record the signals from your\
    \ remote. The first part involves you repeatedly pressing the buttons on the remote\
    \ until there are two lines of dots on the screen. This measures and records the\
    \ signals being sent from the remote. Do this in a logical order starting at the\
    \ top of the remote and working downwards. Once the two lines of dots have been\
    \ completed, your remote has been recognised.\n\n### Pygame buttons\n\nPygame\
    \ enables you to create buttons and assign actions to them. This means you can\
    \ create and assign buttons to the Pygame window. You could control the robot\
    \ with buttons instead of keys. There is a simple tutorial here: `pygame.org/project-ButtonDrawer-2541.html`,\
    \ which covers how to create and assign some interaction to the various buttons.\n\
    \n# Tutorial\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_71_0.png)\n\nAbove The\
    \ infrared receiver on your robot will look something like this\n\n### Robot variation\n\
    \n- You can use a bunch of different robots with this tutorial, such as the Makeblock\
    \ that's pictured or the WowWee Roboquad that our author used. Pay attention to\
    \ the event key setup in your code – different robots will have different native\
    \ functions.\n- The Roboquad, for example, has a ‘Dance’ command that you can\
    \ see about halfway down the code listing on the opposite page.\n\n### 07 Make\
    \ the lirc.conf file: part 3\n\nThe second part of the program asks you to enter\
    \ the names of the keys for each of the signals it has recorded. Follow each of\
    \ the on-screen prompts, typing a suitable name for each of the remote buttons/keys.\
    \ For example, type ‘KEY_UP’ and then press the corresponding up key on the remote.\
    \ You will then be prompted to type in the name of the next key – for example,\
    \ ‘KEY_BACK’, in which case you would press the back key on the remote, and so\
    \ on. Keep repeating this process until you have entered names for each of the\
    \ recorded keys.\n\n### 08 Rename the remote\n\nOnce saved, locate the new `lirc.conf`\
    \ file in the `/home/pi` folder. By default, the name of the remote on line 14\
    \ will probably be named as `/home/pi/lirc.conf`. Change this: under the heading\
    \ ‘begin remote’, find the ‘name’ label and rename `/home/pi/lirc.conf` to something\
    \ more appropriate, such as ‘Robot’. Doing this helps ensure that it is an easier\
    \ process to refer to it in the program whenever you call a movement instruction\
    \ or key name.\n\n### 09 Transfer the lircd.conf file\n\nNow your `lirc.conf`\
    \ file is ready to transfer to the `/etc/lirc` folder; this is the folder that\
    \ holds the hardware and lirc files. The simplest method is to open your new `lirc.conf`,\
    \ which is saved into the `/pi/home` folder, and then copy and paste over the\
    \ code that you have just created. However, this will overwrite any old configuration\
    \ file setup that you have. To save a previous file, see the next step. In the\
    \ LX Terminal, type:\n\n```bash\nsudo nano /etc/lirc/lircd.conf\n```\n\n### 10\
    \ Transfer file without overwriting\n\nIf you have set up a `lircd.conf` file,\
    \ or want to use a new one but keep the old one, create a new configuration file.\
    \ This is saved in the `/home/pi` folder and can be copied over to `/etc/lirc`.\
    \ Make a backup of the original `lircd.conf` file by creating a copy of it, then\
    \ save it as `lircd_original.conf`. In the LX Terminal, type:\n\n```bash\nsudo\
    \ cp /etc/init.d/lirc_start\nsudo mv /etc/lirc/lircd.conf /etc/lirc/lircd_original.conf\n\
    ```\n\nThen copy over your new configuration file:\n\n```bash\nsudo cp ~/lircd.conf\
    \ /etc/lirc/lircd.conf\n```\n\nYour original configuration file will now be saved\
    \ as `lircd_original.conf`.\n\n### 11 Start to take control\n\nNow your robot\
    \ has a configuration file, you can use your remote control. Restart the LIRC\
    \ with `sudo /etc/init.d/lirc_restart`. Now test that the `lirc` file is working\
    \ by listing all the registered `KEYS` stored in the file: `irsend LIST Robot\
    \ '*'`. This will list all the `KEYS` that are recorded in the `lircd.conf` file.\n\
    \nIt’s time to control your device. This uses the `irecord` application that comes\
    \ with LIRC to send the commands. The commands are very simple: `irecord SEND_ONCE\
    \ Remote_Name Remote_Button`. For example, to make the robot walk forward, just\
    \ type this into the LX Terminal: `irecord SEND_ONCE Robot KEY_UP`. This will\
    \ send the ‘forward’ infrared signal and your robot will then walk forward.\n\n\
    # Hack a robot\n\n### 12 Python OS\n\nThe LIRC program enables you to control\
    \ the Pi-Mote IR control board via the command line. However, this is impractical\
    \ for coding purposes because it limits the interactions with other hardware and\
    \ software. However, good-old Python has an `OS` module that enables you to control\
    \ the command line and execute command line instructions from within a Python\
    \ program. This enables you to create a program that can be controlled by `pygame`,\
    \ which means you can move the robot with the arrow keys and keyboard.\n\n###\
    \ 13 Using Python OS\n\nOpen your Python editor and then import the `OS` module:\n\
    \n```python\nimport os\n```\n\nNow enter the command:\n\n```python\nos.system(\"\
    irsend SEND_ONCE Robot KEY_RIGHT\")\n```\n\nThis will permit interaction between\
    \ Python code and the Raspberry Pi's operating system. The code line will send\
    \ the 'move right' command to the IR board and it will also transmit the assigned\
    \ signal, instructing the robot to walk to the right. Test that all of the other\
    \ movements work by changing the related 'KEY' name at the end of the line of\
    \ code.\n\n### 14 Get familiar with pygame\n\nPygame is a cross-platform library\
    \ that was created to enable users to produce simple video games. It includes\
    \ a number of graphics and sound libraries that have been specifically designed\
    \ to be used with the Python programming language. Pygame also comes preinstalled\
    \ on the Raspberry Pi. You can read more about the codes and creating games over\
    \ in the official documentation: `pygame.org/docs`.\n\n### 15 Not overwriting\n\
    \nPygame runs in a window that has been preset by the user. Before adding the\
    \ Python code to control the robot, you are going to have to set up the pygame\
    \ structure. Although this program makes use of the controls on your keyboard,\
    \ you still need to create the traditional pygame window. See the first part of\
    \ the listing to the right, from the first line down to `runGame()`.\n\nSet up\
    \ the window dimensions first (lines 7 and 8). Next, initialise the pygame clock:\
    \ `FPSLOCK = pygame.time.Clock()`. The font size and typeface of the caption used\
    \ in the window are next: `BASICFONT = pygame.font.Font('freesansbold.ttf', 18)`.\
    \ Finally, set the caption for the window: `pygame.display.set_caption('ROBOT')`.\n\
    \n### 16 Restart the LIRC\n\nFor this bit, refer to the next section of code:\
    \ from `def runGame()` onwards. Once the game is initialised, you can set the\
    \ code to control your robot. This makes use of the `get()` pygame event (see\
    \ the for loop) to return the key that has been pressed. The first `elif` sets\
    \ the event type to wait for 'Keyboard' presses, such as the 'right' key shown\
    \ in the next line. Since the OS has been imported, we use `os.system(\"irsend\
    \ SEND_ONCE Robot KEY_RIGHT\")` to transmit the 'move right' signal. When you\
    \ are running the program, ensure that you have selected the pygame window – this\
    \ is small, as we have coded it to 100 x 100 pixels. Once working, add the rest\
    \ of your movements in the same way.\n\n### 17 Common errors and code recap\n\n\
    Now that you can use Python code to control the robot, you can interface with\
    \ a number of other modules. You could attach a Makey Makey (`makeymakey.com`)\
    \ and use some spoons and forks to control your robot. You could even try installing\
    \ and using the Tweepy module (a Twitter API) to make the robot respond to incoming\
    \ tweets.\n\n## Full code listing\n\n```python\nimport random, pygame, sys\nfrom\
    \ pygame.locals import *\nimport os\nimport time\n\nFPS = 15\nWINDOWWIDTH = 100\n\
    WINDOWHEIGHT = 100\n\nUP = 'up'\nDOWN = 'down'\nLEFT = 'left'\nRIGHT = 'right'\n\
    \ndef main():\n    global FPSLOCK, DISPLAYSURF, BASICFONT\n\n    pygame.init()\n\
    \    FPSLOCK = pygame.time.Clock()\n    DISPLAYSURF = pygame.display.set_mode((WINDOWWIDTH,\
    \ WINDOWHEIGHT))\n    BASICFONT = pygame.font.Font('freesansbold.ttf', 18)\n \
    \   pygame.display.set_caption('ROBOT')\n\n    while True:\n        runGame()\n\
    \ndef runGame():\n    # Get a random start point.\n    while True: # main game\
    \ loop\n        for event in pygame.event.get(): # event handling loop\n     \
    \       if event.type == QUIT:\n                terminate()\n            elif\
    \ event.type == KEYDOWN:\n                if event.key == K_RIGHT:\n         \
    \           print('right')\n                    os.system(\"irsend SEND_ONCE Robot\
    \ KEY_RIGHT\")\n                elif event.key == K_LEFT:\n                  \
    \  print('left')\n                    os.system(\"irsend SEND_ONCE Robot KEY_LEFT\"\
    )\n                elif event.key == K_UP:\n                    print('foward')\n\
    \                    os.system(\"irsend SEND_ONCE Robot KEY_UP\")\n          \
    \      elif event.key == K_DOWN:\n                    print('Black')\n       \
    \             os.system(\"irsend SEND_ONCE Robot KEY_DOWN\")\n               \
    \ elif event.key == K_SPACE:\n                    print('STOP')\n            \
    \        os.system(\"irsend SEND_ONCE Robot KEY_STOP\")\n                elif\
    \ event.key == K_d:\n                    print('Dance Baby')\n               \
    \     os.system(\"irsend SEND_ONCE Robot KEY_D\")\n                elif event.key\
    \ == K_y:\n                    print('Say Yes')\n                    os.system(\"\
    irsend SEND_ONCE Robot KEY_R\")\n                elif event.key == K_l:\n    \
    \                print('Say No')\n                    os.system(\"irsend SEND_ONCE\
    \ Robot KEY_L\")\n                elif event.key == K_n:\n                   \
    \ print('Say No')\n                    os.system(\"irsend SEND_ONCE Robot KEY_P\"\
    )\n                elif event.key == K_ESCAPE:\n                    terminate()\n\
    \nif __name__ == '__main__':\n    main()\n```\n"
  mdcn: "\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_70_0.png)\n\n# 改装一台机器人\n\n左侧：Pi-Mote\
    \ 红外控制板功能强大，仅需 £9.99\n\n### 02 安装软件\n\n接下来，安装 LIRC 软件；这是 Linux 红外远程控制（Linux Infrared\
    \ Remote Control）的缩写，它是让你能够与机器人交互并传输命令的程序。再次打开 LX 终端并输入：\n\n```bash\nsudo apt-get\
    \ install lirc\nsudo apt-get install lirc-x\n```\n\n安装完成后，你需要使用 `sudo reboot`\
    \ 重启你的树莓派。\n\n### 03 编辑硬件文件\n\n接下来，我们需要编辑位于 `/etc/lirc/` 文件夹中的 `lircd.hw.conf`\
    \ 文件，并进行如下所示的更改。在终端窗口中，输入：\n\n```bash\nsudo nano /etc/lirc/hardware.conf\n```\n\
    \n在文件中找到 `DRIVER`、`DEVICE` 和 `MODULES` 行，然后进行以下更改：\n\n```\nDRIVER = \"default\"\
    \nDEVICE = \"/dev/lirc0\"\nMODULES = \"lirc_rpi\"\n```\n\n按 `Ctrl+X` 保存文件，不要重命名它，按\
    \ `Y` 然后按 `return`。使用命令 `sudo /etc/init.d/lirc restart` 重启 LIRC 守护进程。\n\n### 04\
    \ 测试红外接收器是否正常工作\n\n为了测试红外接收器已正确安装并正常工作，你需要前往 LX 终端，然后停止 LIRC 守护进程（第 1 行），启用测试模式（第\
    \ 2 行），然后启动模式 2 测试（第 3 行）：\n\n```bash\nsudo /etc/init.d/lirc stop\nsudo modprobe\
    \ lirc_rpi\nsudo mode2 -d /dev/lirc0\n```\n\n这将运行一个程序来输出红外信号的占空比。它测量红外信号的脉冲和空档长度，并将值返回到终端。拿起机器人的遥控器，将其指向红外接收器，然后按下一些按钮。你应该会看到类似以下内容：\n\
    \n```\nspace 16300\npulse 95\nspace 28794\npulse 80\nspace 19395\nspace 28794\n\
    pulse 80\n```\n\n### 05 创建 lircd.conf 文件：第一部分\n\n`lircd.conf` 文件包含控制你设备的代码或指令。虽然你可以在网上找到这些文件，但你可能不得不从头创建一个。这需要运行\
    \ `irrecord` 程序，将遥控器对准红外板，然后按下按钮！这会记录来自你遥控器的信号，然后你为每个信号分配 `KEYS`，以将信号传输给机器人。在终端中输入以下命令停止\
    \ LIRC 软件：\n\n```bash\nsudo /etc/init.d/lirc stop\n```\n\n### 06 创建 lirc.conf\
    \ 文件：第二部分\n\n接下来，创建你的新 `lircd.conf` 配置文件并保存输出。在 LX 终端中，输入：\n\n```bash\nirrecord\
    \ -d /dev/lirc0 ~/lircd.conf\n```\n\n这将打开一个程序，该程序会提示你如何记录来自遥控器的信号的操作说明。第一部分需要你反复按下遥控器上的按钮，直到屏幕上出现两行点。这会测量并记录遥控器发送的信号。请按照逻辑顺序进行操作，从遥控器的顶部开始向下进行。一旦两行点完成，你的遥控器就被识别了。\n\
    \n### Pygame 按钮\n\nPygame 允许你创建按钮并为其分配操作。这意味着你可以为 Pygame 窗口创建并分配按钮。你可以使用按钮而不是按键来控制机器人。这里有一个简单的教程：`pygame.org/project-ButtonDrawer-2541.html`，涵盖了如何创建按钮并为各种按钮分配交互。\n\
    \n# 教程\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_71_0.png)\n\n上方：你机器人上的红外接收器看起来大概是这样\n\
    \n### 机器人变体\n\n- 你可以使用多种不同的机器人配合本教程，例如图中所示的 Makeblock 或作者使用的 WowWee Roboquad。请注意代码中的事件键设置——不同的机器人具有不同的原生功能。\n\
    - 例如，Roboquad 有一个“Dance”（跳舞）命令，你可以在对面页面上的代码列表中间部分看到它。\n\n### 07 创建 lirc.conf 文件：第三部分\n\
    \n程序的第二部分要求你输入已记录的每个信号对应的键名。遵循每个屏幕提示，为每个遥控器按钮/键输入一个合适的名称。例如，输入“KEY_UP”，然后按下遥控器上对应的向上键。接下来你会被提示输入下一个键的名称——例如，“KEY_BACK”，在这种情况下，你需要按下遥控器上的返回键，以此类推。不断重复此过程，直到你为每个记录的键都输入了名称。\n\
    \n### 08 重命名遥控器\n\n保存后，在 `/home/pi` 文件夹中找到新的 `lirc.conf` 文件。默认情况下，第 14 行的遥控器名称可能命名为\
    \ `/home/pi/lirc.conf`。更改这一点：在“begin remote”标题下，找到“name”标签并将 `/home/pi/lirc.conf`\
    \ 重命名为更合适的名称，例如“Robot”。这样做有助于确保在程序中调用移动指令或键名时，引用它变得更加容易。\n\n### 09 传输 lircd.conf\
    \ 文件\n\n现在你的 `lirc.conf` 文件准备好传输到 `/etc/lirc` 文件夹；这是存放硬件和 lirc 文件的文件夹。最简单的方法是打开你的新\
    \ `lirc.conf`（它保存在 `/pi/home` 文件夹中），然后复制并粘贴覆盖你刚刚创建的代码。但是，这会覆盖你现有的任何旧配置文件设置。要保存以前的文件，请参见下一步。在\
    \ LX 终端中，输入：\n\n```bash\nsudo nano /etc/lirc/lircd.conf\n```\n\n### 10 传输文件而不覆盖\n\
    \n如果你已经设置了 `lircd.conf` 文件，或者想使用新的但保留旧的，请创建一个新的配置文件。这保存在 `/home/pi` 文件夹中，并可以复制到\
    \ `/etc/lirc`。通过创建一个副本并将另存为 `lircd_original.conf` 来备份原始的 `lircd.conf` 文件。在 LX\
    \ 终端中，输入：\n\n```bash\nsudo cp /etc/init.d/lirc_start\nsudo mv /etc/lirc/lircd.conf\
    \ /etc/lirc/lircd_original.conf\n```\n\n然后复制你的新配置文件：\n\n```bash\nsudo cp ~/lircd.conf\
    \ /etc/lirc/lircd.conf\n```\n\n你的原始配置文件现在将被保存为 `lircd_original.conf`。\n\n### 11\
    \ 开始控制\n\n现在你的机器人有了配置文件，你可以使用遥控器了。使用 `sudo /etc/init.d/lirc_restart` 重启 LIRC。现在通过列出文件中存储的所有已注册\
    \ `KEYS` 来测试 `lirc` 文件是否正常工作：`irsend LIST Robot '*'`。这将列出记录在 `lircd.conf` 文件中的所有\
    \ `KEYS`。\n\n是时候控制你的设备了。这使用 LIRC 附带的 `irecord` 应用程序来发送命令。命令非常简单：`irecord SEND_ONCE\
    \ Remote_Name Remote_Button`。例如，为了让机器人向前走，只需在 LX 终端中输入：`irecord SEND_ONCE Robot\
    \ KEY_UP`。这将发送“前进”红外信号，然后你的机器人就会向前走。\n\n# 改装一台机器人\n\n### 12 Python OS\n\nLIRC\
    \ 程序允许你通过命令行控制 Pi-Mote 红外控制板。然而，这对于编程来说是不实用的，因为它限制了对其他硬件和软件的交互。不过，老牌的 Python 有一个\
    \ `OS` 模块，它允许你控制命令行并从 Python 程序内部执行命令行指令。这使你能够创建一个可以由 `pygame` 控制的程序，这意味着你可以使用箭头键和键盘移动机器人。\n\
    \n### 13 使用 Python OS\n\n打开你的 Python 编辑器，然后导入 `OS` 模块：\n\n```python\nimport os\n\
    ```\n\n现在输入命令：\n\n```python\nos.system(\"irsend SEND_ONCE Robot KEY_RIGHT\")\n\
    ```\n\n这将允许 Python 代码与树莓派操作系统之间进行交互。该行代码将向红外板发送“向右移动”命令，它还将传输分配的信号，指示机器人向右走。通过更改代码行末尾的相关“KEY”名称，测试其他所有移动是否正常工作。\n\
    \n### 14 熟悉 pygame\n\nPygame 是一个跨平台库，旨在让用户能够制作简单的电子游戏。它包含一系列专门为 Python 编程语言设计的图形和声音库。Pygame\
    \ 也预装在树莓派上。你可以在官方文档中阅读更多关于代码和游戏制作的内容：`pygame.org/docs`。\n\n### 15 避免覆盖\n\nPygame\
    \ 在一个由用户预设的窗口中运行。在添加用于控制机器人的 Python 代码之前，你需要设置 pygame 结构。虽然此程序利用键盘上的控件，但你仍然需要创建传统的\
    \ pygame 窗口。参见右侧列表的第一部分，从第一行到 `runGame()`。\n\n首先设置窗口尺寸（第 7 行和第 8 行）。接下来，初始化 pygame\
    \ 时钟：`FPSLOCK = pygame.time.Clock()`。接下来是窗口中使用的标题字体大小和字体：`BASICFONT = pygame.font.Font('freesansbold.ttf',\
    \ 18)`。最后，设置窗口标题：`pygame.display.set_caption('ROBOT')`。\n\n### 16 重启 LIRC\n\n\
    对于这部分，请参考下一段代码：从 `def runGame()` 开始。一旦游戏初始化完成，你就可以设置控制机器人的代码。这利用了 `get()` pygame\
    \ 事件（参见 for 循环）来返回已按下的键。第一个 `elif` 将事件类型设置为等待“Keyboard”按键，例如下面一行中显示的“right”键。由于已经导入了\
