    The Fitlet is a tiny PC, fully compatible with Linux, and has more features than
    you can shake a stick at. And while it isn''t Compulab''s first fanless mini PC,
    it may well be its best.


    Unboxing the Fitlet is a great experience: the box seems too small to hold a computer
    of any power, but the machine itself – housed in a metal chassis, the top of which
    doubles as a heatsink – takes up a tiny fraction of this, with the remaining space
    given over to a wall-wart power supply, HDMI-to-DVI adaptor cable, plus an antennae
    for the built-in Wi-Fi available on the top-end model, the Fitlet-iA10.


    The existence of a top-end model implies there''s a bottom-end, of course. The
    Fitlet family, in fact, is made up of a range of externally identical devices:
    the Fitlet-b is the entry-level model, with the Fitlet-i offering more functionality
    and an improved processor, while the Fitlet iA10 improves the processor still
    more. There''s even a Fitlet-X range, which replaces the dual gigabit Ethernet
    and eSATA ports of the Fitlet-i with three gigabit Ethernet ports – all of which
    run at full speed on the PCI Express bus.


    This role flexibility is made possible by a system Compulab has dubbed Facet.
    Using Facet modules, which make up the side panel of the chassis, it''s possible
    to alter the functionality of a Fitlet – a feature the company has promised to
    exploit more fully with additional Facet modules in future.


    The model reviewed is the Fitlet iA10, supplied with a 64GB mSATA SSD and 4GB
    DDR3 RAM. This is unusual:'
