    \ programming languages as an example; if you wrote in an object-oriented language\
    \ and suddenly felt that functional programming languages were the future, I would\
    \ claim it would be unwise to bolt on features to an object-oriented language\
    \ because they don't get along in the same way. Using the machine versus app example\
    \ of Vagrant, I took a look at a GraphQL API and thought that it just didn't fit\
    \ to put something higher-level there, and also Vagrant is very widely used –\
    \ it gets millions of downloads a month – and there's a lot of backwards compatibility\
    \ concern. If you want something that's six years old, battle-hardened and definitely\
    \ going to work, then Vagrant's there. If you're using microservices, you want\
    \ the cutting edge, then Otto is there – it's going to be rock-solid eventually,\
    \ but it's still very much 0.1.\n\n### What's the next step for Otto?\n\nI'm not\
    \ sure how many people reading this will have used Vagrant 0.1 six years ago,\
    \ but Vagrant 0.1 was, self-admittedly, very bad. It required Ubuntu, it only\
    \ worked with VirtualBox, it only worked with Chef as a provisioner – weird things\
    \ like that. When I look at Otto, I feel very much the same way – I think that\
    \ it's restrictive right now, for the purpose of showing you what it's capable\
    \ of. But over the next few versions we're going to eliminate a lot of those restrictions.\
    \ So in 0.2, for example, the big feature is the otto dev command, which is the\
    \ equivalent to the vagrant up command. The otto dev command for basically any\
    \ application type takes about five or ten seconds, versus Vagrant where it might\
    \ take about a minute. So we're working really hard to make this fast, to make\
    \ it really enjoyable.\n\nWe're focusing on development first. There's a disclaimer\
    \ on the Otto website that, while Otto can deploy, we don't recommend doing that\
    \ yet. Otto deploy is mostly a demo of what it's capable of but it's not quite\
    \ production-ready. After we make the development experience really good over\
    \ the next couple of versions, the focus is going to be making the deployment\
    \ experience production-ready. That'll take us through the next six months.\n\n\
    ### What were the limitations of Vagrant that led you to create Otto?\n\nFirst,\
    \ we noticed that everybody's development environment within a certain language\
    \ or framework was very similar – almost identical except for one or two things.\
    \ While everyone likes to believe that their development environment is special,\
    \ that's not what we were seeing across the hundreds of thousands of users we\
    \ were looking at. So we can build you a very common Ruby environment, a very\
    \ common PHP environment,\n\n> “After we make the development experience really\
    \ good over the next couple of versions, the focus is going to be making the deployment\
    \ experience production-ready.”\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_12_0.png)\n"
  mdcn: "\n\n## 开源\nLinux 新闻与观点的来源\n\n### 访谈：米切尔·哈希莫托\n### Otto：遇见新一代的 Vagrant\n\n\
    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_11_0.png)\n\n米切尔·哈希莫托在新一代 Vagrant 产品\
    \ Otto 中整合了开发与部署。我们询问了他如何简化你的软件生产流程。\n\n**简而言之，Otto 是什么？**\n\n它的目标是**尽善**地完成 Vagrant\
    \ 在开发者视角所能做到的一切，甚至做得更好。此外，我们还添加了部署功能。这是功能上的差异，但在哲学理念上也有不同。\n\n主要的哲学差异在于我们所说的“化石化”与“代码化”。如果你拿五年前的\
    \ Vagrantfile 并在今天运行**vagrant up**，它很可能仍然有效，并能以你五年前设定的方式完全复现该环境。这是因为 Vagrantfile\
    \ 是一种化石——即时间的快照。对于某些用例来说，你确实需要化石，但过去几年的经验让我们确定，你真正需要的是代码化。因此，如果你查看 AppFile（即 Otto\
    \ 的配置文件），它不会规定具体该如何操作，而是声明你想要达成的结果。例如，你可以说“我想开发一个 PHP 应用”，但不必说明如何安装 PHP，也不必指定使用哪个操作系统，因为关于如何操作的知识都集中在\
    \ Otto 内部。因此，如果你今天运行 Otto，五年后再运行 Otto，结果可能会不同，因为我们将采用当前的最佳实践。\n\n主要区别在于 AppFile\
    \ 描述的是应用程序，而 Vagrantfile 描述的是机器。\n\n**官网称 Otto 是为微服务打造的，这是什么意思？**\n\n我们曾经历一个阶段，当时有很多单体应用，而现在又回归到面向服务的架构，但这次是众多小型服务而非少数几个大型服务。这使得开发变得困难，因为你需要知道如何安装少量服务以及你的应用程序，而这些可能使用不同的语言——完全忽略部署问题。因此，我们试图通过\
    \ Otto 及其用于描述和配置 Otto 的 AppFile 来解决这个问题。\n\n你只需填入指向依赖项 URL 的指针，Otto 会访问这些地址，下载它们并读取其\
    \ AppFiles，这些文件描述了如何为开发环境安装它们。这将为开发目的安装依赖服务的工作转移给服务创建者。这简化了许多事情，并且服务开发者拥有更大的灵活性；完全改变语言也不会影响你的下游开发者。\n\
    \n微服务仍然是一项新技术。我认为它尚未成为主流——我们只是在为未来做准备。\n\n**米切尔·哈希莫托**，HashiCorp 的创始人，是一位痴迷于自动化的开发者。他是\
    \ Vagrant、Packer、Serf、Consul、Terraform、Vault、Nomad 和 Otto 的创造者。他是 DevOps 社区的关键人物，也是技术作者，并在运维和研究领域拥有丰富经验的老练工程师。\n\
    \n### Otto 与 Atlas\n\nAtlas 是 HashiCorp 唯一的商业产品，为其八个开源项目提供资金支持。米切尔告诉我们，Otto+Atlas\
    \ 就像 Git+GitHub 一样——它提供核心工作流、所有原语以及大量的复杂性管理。最终，它将为你提供 Otto 的完整 UI。Atlas 还将作为 Otto\
    \ 的协作平台，检查是否有其他人正在与你同时部署特定应用程序，并允许你控制谁可以部署哪些应用程序，甚至控制他们部署的时间。Atlas 还可以为你运行许多 Otto\
    \ 命令，让你能够卸载活动，例如在**otto deploy**运行期间合上笔记本电脑。\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_11_1.png)\n\
    \n**上方** Otto 采用声明式方法，使开发者的生活更加轻松\n\n### Otto 的 Appfile\n\n配置可以非常简化，完全交由 Otto\
    \ 的自动检测，也可以非常详细。你还可以在 Appfiles 之间共享代码块。\n\nAppfiles 完全是可选的。如果不存在 Appfile，Otto\
    \ 会检查项目以检测应用程序的类型。然后它会生成一个内部 Appfile，该文件不会外部保存。Appfile 中的单个代码块也是可选的。如果存在 Appfile\
    \ 但缺少如 `application` 等代码块，Otto 会直接合并检测到的数据。可以导入其他 Appfiles 的片段——这是共享 Appfiles\
    \ 配置的推荐方式，特别是项目和基础设施代码块。\n\n如果 Appfile 中未包含应用程序名称和类型属性，Otto 会自动检测包含该 Appfile 的目录名称作为名称，并使用文件名模式匹配来确定类型——例如，存在\
    \ Gemfile 即表示 Ruby 应用程序。\n\nOtto 识别 GitHub URL 并将其转换为标准的 git 仓库，同时也接受通用的 Git 仓库；它还识别\
    \ BitBucket URL 并将其转换为 Git 或 Mercurial 仓库，同时也接受通用的 Mercurial 仓库。最后，你可以指定 .json\
    \ 文件解析。\n\n可以有多个自定义代码块。代码块的名称即是要自定义的组件。\n\n与应用程序代码块一样，Otto 项目代码块中的名称和基础设施属性可以留空；我们的\
    \ Otto 会自动检测它们。基础设施代码块目前硬编码为指定使用“simple”口味的 AWS。AWS 的其他可用口味会设置一个更类似生产环境的基础设施，包括包含公共和私有子网的\
    \ VPC，以及其他内容。\n\n```ruby\n# Sample Appfile\nimport \"github.com/rubyforg/otto-shared()\"\
    \n\n# Application block\napplication {\n  name = \"otto example\"\n  type = \"\
    go\"\n  dependency { source = \"github.com/hashicorp/otto/examples/herogo\" }\n\
    }\n\n# Let's disable this for now using a multi-line comment\ncustomization \"\
    go\" {\n  go_version = \"1.4.2\"\n}\n\nproject {\n  name = \"bast project\"\n\
    \  infrastructure = \"production\"\n}\n\ninfrastructure \"production\" {\n  type\
    \ = \"aws\"\n  flavor = \"vpc public private\"\n}\n```\n\n### 为什么需要将 Otto 作为新产品发布，而不是改进\
    \ Vagrant？\n\n以编程语言为例；如果你用面向对象语言编写代码，突然觉得函数式编程语言才是未来，我认为在面向对象语言上附加功能是不明智的，因为两者相处得不好。以\
    \ Vagrant 的机器与应用示例来说，我查看了一个 GraphQL API，觉得在那里放置更高层级的内容并不合适。此外，Vagrant 的使用非常广泛——每月下载数百万次——因此存在大量的向后兼容性问题。如果你想要一个六年前问世、久经沙场且肯定能正常工作的工具，Vagrant\
    \ 就在那里。如果你在使用微服务，想要最前沿的技术，那么 Otto 就在那里——它最终会非常稳固，但目前仍处于 0.1 版本。\n\n### Otto 的下一步是什么？\n\
    \n我不确定正在阅读本文的读者中有多少人六年前使用过 Vagrant 0.1，但 Vagrant 0.1 坦率地说非常糟糕。它需要 Ubuntu，仅与 VirtualBox\
    \ 兼容，仅与 Chef 作为供应器兼容——诸如此类的怪异限制。当我看待 Otto 时，我有同样的感受——我认为目前它是受限的，目的是为了向你展示其能力。但在接下来的几个版本中，我们将消除许多这些限制。因此，例如在\
    \ 0.2 版本中，主要功能是 otto dev 命令，这相当于 vagrant up 命令。对于基本任何应用程序类型的 otto dev 命令只需要大约五到十秒，而\
    \ Vagrant 可能需要大约一分钟。因此，我们正在努力使其速度更快，使其真正令人愉悦。\n\n我们首先关注开发。Otto 网站上有一个免责声明，指出虽然\
    \ Otto 可以部署，但我们目前不建议这样做。Otto deploy 主要是对其能力的演示，但尚未完全达到生产就绪状态。在接下来几个版本中，一旦我们使开发体验变得非常好，重点将转向使部署体验达到生产就绪状态。这将贯穿接下来的六个月。\n\
    \n### Vagrant 的哪些局限促成了 Otto 的诞生？\n\n首先，我们注意到在特定语言或框架内，每个人的开发环境都非常相似——除了个别差异外，几乎完全相同。虽然每个人都愿意相信自己的开发环境很特殊，但这是我们通过研究数十万用户观察到的事实。因此，我们可以为你构建一个非常通用的\
    \ Ruby 环境，一个非常通用的 PHP 环境，\n\n> “在接下来几个版本中，一旦我们使开发体验变得非常好，重点将转向使部署体验达到生产就绪状态。”\n\
    \n![](img/0fc17bd4c29dc437e3ac28a53f7559db_12_0.png)\n\n"
