    \ need to run the following steps to install Pygame Zero:\n\n```\nsudo apt-get\
    \ update\nsudo apt-get install python3-setuptools python3-pip\nsudo pip-3.2 install\
    \ pgzero\n```\n\nPygame Zero deals with all of this boilerplate code for you,\
    \ aiming to get you coding games instantly\n\n### 04 No Pi?\n\nYou don't even\
    \ need a Raspberry Pi to install Pygame Zero – just install the Pygame library,\
    \ then use pip to install Pygame Zero. Instructions vary by distro, but a good\
    \ place to start is the documentation: **bit.ly/1GYZnUB**.\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_62_4.png)\n\
    \n### 05 Intro.py\n\nThat default black square of 800 by 600 pixels we saw in\
    \ Step 1 can be overridden manually. For example, we can replace it with an oversized\
    \ gold brick, in a nod to *Breakout*:\n\n```\nWIDTH = 1000\nHEIGHT = 100\ndef\
    \ draw():\n    screen.fill((205, 130, 0))\n```\n\nThat colour tuple takes RGB\
    \ values, so you can quickly get colours off a cheatsheet: **screen** is built\
    \ into Pg0 for the window display, with methods available for all sorts of different\
    \ sprites...\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_63_0.png)\n\n*Right The\
    \ bat and ball come first — they’re the cornerstones of Pong and Breakout*\n\n\
    ### 08 Batty\n\nYou can think of *Breakout* as essentially being a moving bat\
    \ – that is, you’re hitting a moving ball in order to knock out blocks. The bat\
    \ is a rectangle, and Pygame’s `Rect` objects store and manipulate rectangular\
    \ areas – we use `Rect(left, top, (width, height))`, before which we define the\
    \ bat colour and then call upon the `draw` function to put the bat on the screen,\
    \ using the `screen` function.\n\n```\nW = 800\nH = 600\nRED = (200, 0, 0)\nbat\
    \ = Rect((W/2, 0.96 * H, (150, 15)))\ndef draw():\n  screen.clear()\n  screen.draw.filled_rect(bat,\
    \ RED)\n```\n\n### Object orientation\n\nDavid Ames, who uses `Pg0` to teach younger\
    \ children to code at events across the UK, told us, “One thing to avoid when\
    \ it comes to teaching kids is *Object Orientation* – OOP (object-oriented programming)\
    \ is partly abstracted away by `Pg0`, but it can’t be ignored.\n\nPerhaps the\
    \ best approach is using `Pg0` and some simple code to start, then dropping in\
    \ a piece of OOP when it’s needed to solve a particular problem.\n\nWith the Code\
    \ Club age group – about eight to eleven – feeding information to solve practical\
    \ problems works well. It can work with adults, too – but there’s always someone\
    \ who’s read ahead and has a few tricky questions.\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_63_1.png)\n\
    \n### 06 Sprite\n\nThe intro example from the `Pg0` docs expands on that with\
    \ the `Actor` class, which will automatically invoked the named sprite (`Pg0`\
    \ will hunt around for a `.jpg` or `.png` in a subdirectory called images).\n\n\
    ```\nalien = Actor('alien')\nalien.pos = (100, 56)\nWIDTH = 500\nHEIGHT = alien.height\
    \ + 20\ndef draw():\n  screen.clear()\n  alien.draw()\n```\n\nYou can download\
    \ the alien from the `Pg0` documentation (`bit.ly/15mSIM7`) and try out the animation\
    \ shown there, but we’re taking a different approach in our game.\n\n### 07 Breakout\
    \ via Pong\n\nWhile the `Pi` is something of a tribute to 1980s 8-bit computers,\
    \ *Breakout* comes from the 1970s and is a direct descendant of the early arcade\
    \ classic *Pong*. We’ll follow the route from *Pong* to *Breakout* (which historically\
    \ involved Apple founders Steve Wozniak and Steve Jobs in the steps to creating\
    \ our code, leaving you with the option of developing the Pong elements into a\
    \ proper game, as well as refining the finished Breakout clone).\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_63_2.png)\n\
    \n### 09 Mouse move\n\nWe want to move the bat, and the mouse is closer to an\
    \ arcade paddle than the arrow keys. Add the following:\n\n```\ndef on_mouse_move(pos):\n\
    \  x, y = pos\n  bat.center = (x, bat.center[1])\n```\n\nUse `pgzrun` to test\
    \ that you have a screen, bat and movement.\n\n### 10 Square ball\n\nIn properly\
    \ retro graphics-style, we define a square ball too – another rectangle, essentially,\
    \ with the **(30, 30)** size making it that subset of rectangles that we call\
    \ a square.\n\nWe're doing this because Rect is another built-in in Pg0. If we\
    \ wanted a circular ball, we'd have to define a class and then use pygame's `draw.filled_circle(pos,\
    \ radius, (r, g, b))` – but Rect we can call directly. Simply add:\n\n```\nWHITE\
    \ = 200, 200, 200\nball = Rect(W/2, H/2, (30, 30))\n```\n\n... to the initial\
    \ variable assignments, and:\n\n```\nscreen.draw.filled_rect(ball, WHITE)\n```\n\
    \n... to the def draw() block.\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_64_0.png)\n\
    \n### 11 Action!\n\nNow let's make the ball move. Download the tutorial resources\
    \ in FileSilo.co.uk and then add the code inside the *move.py* file to assign\
    \ movement and velocity. Change the 5 in **ball_dir = Direction(5, -5)** if you\
    \ want the ball slower or faster, as your processor (and dexterity) demands –\
    \ but it's hard to tell now because the ball goes straight off the screen! Pg0\
    \ will call the *update()* function you define once per frame, giving the illusion\
    \ of smooth(ish) scrolling if you're not running much else.\n\n### 12 def move(ball)\n\
    \nTo get the ball to move within the screen we need to **define move(ball)** for\
    \ each case where the ball meets a wall. For this we use if statements to reverse\
    \ the ball's direction at each of the boundaries. Refer to the full code listing\
    \ on page 67.\n\nNote the hardcoded value of 781 for the width of screen, minus\
    \ the width of ball – it's okay to hardcode values in early versions of code,\
    \ but it's the kind of thing that will need changing if your project expands.\
    \ For example, a resizable screen would need a value of $W - 30$.\n\n### 13 Absolute\
    \ values\n\nYou might expect multiplying *y* by minus one to work for reversing\
    \ the direction of the ball when it hits the bat:\n\n```\nball_dir = Direction(ball_dir.x,\
    \ -1 * ball_dir.y)\n```\n\n... but you actually need to use *abs*, which removes\
    \ any minus signs, then minus:\n\n```\nball_dir = Direction(ball_dir.x, - abs(ball_dir.y))\n\
    ```\n\nTry it without in the finished code and see if you get some strange behaviour.\
    \ Your homework is to work out why.\n\n# Full code listing\n\n```\n## Breakout\
    \ type game to demonstrate Pygame Zero library\n## Based originally upon Tim Viner's\
    \ London Python Dojo\n## demonstration\n## Licensed under MIT License - see file\
    \ COPYING\n\nfrom collections import namedtuple\nimport pygame\nimport sys\nimport\
    \ time\n\nW = 804\nH = 600\nRED = 200, 0, 0\nWHITE = 200, 200, 200\nGOLD = 205,\
    \ 145, 0\n\nball = Rect(W/2, H/2, (30, 30))\nDirection = namedtuple('Direction',\
    \ 'x y')\nball_dir = Direction(5, -5)\n\nbat = Rect(W/2, 0.96 * H, (120, 15))\n\
    \nclass Block(Rect):\n\n    def __init__(self, colour, rect):\n        Rect.__init__(self,\
    \ rect)\n        self.colour = colour\n\nblocks = []\nfor n_block in range(24):\n\
    \    block = Block(GOLD, (((n_block % 8) * 100) + 2, ((n_block // 8) * 25) + 2),\
    \ (36, 33))\n    blocks.append(block)\n\ndef draw_blocks():\n    for block in\
    \ blocks:\n        screen.draw.filled_rect(block, block.colour)\n\ndef draw():\n\
    \    screen.clear()\n    screen.draw.filled_rect(ball, WHITE)\n    screen.draw.filled_rect(bat,\
    \ RED)\n    draw_blocks()\n\ndef on_mouse_move(pos):\n    x, y = pos\n    bat.center\
    \ = (x, bat.center[1])\n\ndef on_mouse_down():\n    global ball_dir\n    ball_dir\
    \ = Direction(ball_dir.x * 1.5, ball_dir.y * 1.5)\n```\n"
  mdcn: "\n## 功能\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_61_0.png)\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_61_1.png)\n\
    \nPygame Zero 去除了样板代码，让你能立即将想法转化为游戏，我们将向你展示如何做到这一点\n\n游戏是理解编程语言的好方法：你有一个目标需要去实现，而你添加的每一项功能都会带来更多乐趣。然而，游戏需要图形和其他基本游戏功能所需的库和模块。虽然\
    \ Pygame 库让在 Python 中制作游戏变得相对容易，但它仍然引入了你在开始之前需要处理的样板代码——这是你或你的孩子入门编程的障碍。\n\nPygame\
    \ Zero 为你处理了所有这些样板代码，旨在让你立即开始编写游戏代码。Pg0（我们将用它作为简称）对你制作游戏所需的一切做出了合理的假设——从窗口大小到导入游戏库——这样你就可以直接着手编码你的想法。\n\
    \nPg0 的创造者 Daniel Pope 告诉我们，这个库“源于在 PyCon UK 教育板块与教师们的交流，试图理解他们需要立即看到结果，并将课程分解成小片段，以便让整个班级跟上进度。”\n\
    \n为了让你了解涉及的内容，我们将从一个乒乓球拍和球开始，逐步构建一个简单的游戏，直到以打砖块风格击碎方块。该项目将展示付出很少努力能做到的事情。Pg0 仍处于早期开发阶段，但仍然是一个很好的开始——并且现在已包含在\
    \ Raspbian Jessie 镜像中的 Pi 里。我们将查看其他平台上的安装，但首先让我们看看它能施展什么魔法。\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_61_2.png)\n\
    \n-   Pygame Zero\n    -   pygame-zero.readthedocs.org\n-   Pygame\n    -   pygame.org\n\
    -   Pip\n    -   pip-installer.org\n-   Python 3.2 或更高版本\n    -   python.org\n\
    \n![](img/0fc17bd4c29dc437e3ac28a53f7559db_62_0.png)\n\n### Richard Smedley\n\n\
    是一名系统管理员和作家，同时也是几种编程语言中的永久新手。当他的孩子们在 Code Club 学习 Python 时，Richard 使用 PyGame 偷偷超越他们\n\
    \n**右侧打砖块**是一款经典的街机游戏，可以用 Pygame Zero 重新构想\n\n# Pygame Zero\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_62_1.png)\n\
    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_62_2.png)\n\n## 老少皆宜\n\n在年轻人使用 Pygame（包含所有样板代码）的情况下，也可以取得很好的效果（参见\
    \ Bryan Payne 的书），但 Pygame 和 Pg0 尽管作为强大的教育工具被使用，对于处于学习任何阶段的编码者来说，也是创建游戏的好选择。\n\
    \n伟大的游戏都关乎玩法，由强大的想象力驱动，生成图像、动画、声音以及穿越游戏世界的旅程。好的框架向那些不是传统编程学习者的人开放了这种创造性活动，而这正是\
    \ Python 长期以来擅长的领域。\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_62_3.png)\n\n\
    ### 01 零努力\n\n虽然编写游戏并不容易，但开始确实容易。如果你已在 Pi 上安装了 Raspbian Jessie，你就准备就绪了。打开终端并输入：\n\
    \n```\ntouch example.py\npgzero example.py\n```\n\n你会看到一个空的游戏窗口打开（按 Ctrl+Q 关闭窗口）。是的，开始就是这么简单！\n\
    \n### 02 Python 3\n\n如果你没有 Raspbian Jessie，很可能既没有安装 Pg0 也没有安装 Pygame。Python 的\
    \ pip 包安装程序会为你获取 Pg0，但前面的步骤因发行版而异。你需要的一件事是 Python 3.2（或更新版本）。如果你一直在编码中使用 Python\
    \ 2.x（也许是因为你跟随的教程使用它），请把 Pg0 作为你温和升级到 Python 3 的机会。\n\n### 03 旧版 Raspbian\n\n\
    如果你仍在运行 Raspbian Wheezy，你需要运行以下步骤来安装 Pygame Zero：\n\n```\nsudo apt-get update\n\
    sudo apt-get install python3-setuptools python3-pip\nsudo pip-3.2 install pgzero\n\
    ```\n\nPygame Zero 为你处理了所有这些样板代码，旨在让你立即开始编写游戏代码\n\n### 04 没有 Pi？\n\n你甚至不需要树莓派来安装\
    \ Pygame Zero——只需安装 Pygame 库，然后使用 pip 安装 Pygame Zero。说明因发行版而异，但一个好的起点是文档：**bit.ly/1GYZnUB**。\n\
    \n![](img/0fc17bd4c29dc437e3ac28a53f7559db_62_4.png)\n\n### 05 Intro.py\n\n我们在步骤\
    \ 1 中看到的那个默认的 800 乘 600 像素黑色方块可以手动覆盖。例如，我们可以用一块超大的金砖替换它，向*打砖块*致敬：\n\n```\nWIDTH\
    \ = 1000\nHEIGHT = 100\ndef draw():\n    screen.fill((205, 130, 0))\n```\n\n该颜色元组采用\
    \ RGB 值，因此你可以快速从速查表中获取颜色：**screen** 是为 Pg0 窗口显示内置的，提供各种不同精灵的方法...\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_63_0.png)\n\
    \n*右侧 球拍和球首先出现——它们是 Pong 和打砖块基石*\n\n### 08 笨拙的\n\n你可以将*打砖块*看作基本上是一个移动的球拍——也就是说，你正在击打一个移动的球以击碎方块。球拍是一个矩形，Pygame\
    \ 的 `Rect` 对象存储和操作矩形区域——我们使用 `Rect(left, top, (width, height))`，在此之前我们定义球拍颜色，然后调用\
    \ `draw` 函数使用 `screen` 函数将球拍放在屏幕上。\n\n```\nW = 800\nH = 600\nRED = (200, 0, 0)\n\
    bat = Rect((W/2, 0.96 * H, (150, 15)))\ndef draw():\n  screen.clear()\n  screen.draw.filled_rect(bat,\
    \ RED)\n```\n\n### 面向对象\n\nDavid Ames，他在英国各地活动中使用 `Pg0` 教年幼的孩子编程，告诉我们，“在教孩子时有一件事要避免*面向对象*——OOP（面向对象编程）部分被\
    \ `Pg0` 抽象化了，但无法被忽略。\n\n也许最好的方法是从使用 `Pg0` 和一些简单代码开始，然后在需要解决特定问题时引入 OOP。\n\n对于\
    \ Code Club 年龄段——大约八到十一岁——通过提供信息来解决实际问题效果很好。这对成年人也适用——但总有人超前阅读并提出一些棘手的问题。\n\n\
    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_63_1.png)\n\n### 06 精灵\n\n`Pg0` 文档中的入门示例通过\
    \ `Actor` 类对此进行了扩展，该类将自动调用命名精灵（`Pg0` 会在名为 images 的子目录中查找 `.jpg` 或 `.png`）。\n\n\
    ```\nalien = Actor('alien')\nalien.pos = (100, 56)\nWIDTH = 500\nHEIGHT = alien.height\
    \ + 20\ndef draw():\n  screen.clear()\n  alien.draw()\n```\n\n你可以从 `Pg0` 文档（`bit.ly/15mSIM7`）下载外星人并尝试那里显示的动画，但我们在游戏中采取了不同的方法。\n\
    \n### 07 从 Pong 到打砖块\n\n虽然 `Pi` 是对 1980 年代 8 位计算机的某种致敬，但*打砖块*来自 1970 年代，是早期街机经典*Pong*的直接后代。我们将遵循从*Pong*到*打砖块*的路径（在历史上，创建我们代码的步骤涉及苹果创始人\
    \ Steve Wozniak 和 Steve Jobs，让你可以选择将 Pong 元素发展成真正的游戏，以及完善完成的打砖块克隆）。\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_63_2.png)\n\
    \n### 09 鼠标移动\n\n我们想移动球拍，而鼠标比箭头键更接近街机球拍。添加以下内容：\n\n```\ndef on_mouse_move(pos):\n\
    \  x, y = pos\n  bat.center = (x, bat.center[1])\n```\n\n使用 `pgzrun` 测试你是否有屏幕、球拍和移动。\n\
    \n### 10 方形球\n\n在正宗的复古图形风格中，我们也定义了一个方形球——本质上是一个矩形，**(30, 30)** 的大小使其成为我们称为正方形的那种矩形子集。\n\
    \n我们这样做是因为 Rect 是 Pg0 中的另一个内置对象。如果我们想要一个圆形球，我们必须定义一个类，然后使用 pygame 的 `draw.filled_circle(pos,\
    \ radius, (r, g, b))`——但我们可以直接调用 Rect。只需添加：\n\n```\nWHITE = 200, 200, 200\nball\
    \ = Rect(W/2, H/2, (30, 30))\n```\n\n... 到初始变量赋值中，以及：\n\n```\nscreen.draw.filled_rect(ball,\
    \ WHITE)\n```\n\n... 到 def draw() 块中。\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_64_0.png)\n\
    \n### 11 动作！\n\n现在让我们让球移动。从 FileSilo.co.uk 下载教程资源，然后将 *move.py* 文件内的代码添加进来以分配移动和速度。如果你希望球更慢或更快，可以改变\
    \ **ball_dir = Direction(5, -5)** 中的 5，符合你的处理器（和手眼协调能力）的要求——但现在很难判断，因为球直接飞出屏幕！Pg0\
    \ 每帧调用一次你定义的 *update()* 函数，如果你没有运行太多其他东西，它会给你一种平滑（差不多）滚动的错觉。\n\n### 12 def move(ball)\n\
    \n为了让球在屏幕内移动，我们需要为球遇到墙壁的每种情况**定义 move(ball)**。为此，我们使用 if 语句在球达到每个边界时反转球的方向。请参考第\
    \ 67 页的完整代码列表。\n\n注意屏幕宽度的硬编码值 781，减去球的宽度——在代码早期版本中硬编码值是可以的，但这是如果你的项目扩展就需要更改的东西。例如，可调整大小的屏幕需要\
    \ $W - 30$ 的值。\n\n### 13 绝对值\n\n你可能会期望将 *y* 乘以负一可以反转球撞击球拍时的方向：\n\n```\nball_dir\
    \ = Direction(ball_dir.x, -1 * ball_dir.y)\n```\n\n... 但你实际上需要使用 *abs*，它会去除任何负号，然后再减：\n\
    \n```\nball_dir = Direction(ball_dir.x, - abs(ball_dir.y))\n```\n\n在完成的代码中试试不加\
    \ abs，看看你是否会得到一些奇怪的行为。你的作业是找出原因。\n\n# 完整代码列表\n\n```\n## Breakout type game to\
    \ demonstrate Pygame Zero library\n## Based originally upon Tim Viner's London\
    \ Python Dojo\n## demonstration\n## Licensed under MIT License - see file COPYING\n\
    \nfrom collections import namedtuple\nimport pygame\nimport sys\nimport time\n\
    \nW = 804\nH = 600\nRED = 200, 0, 0\nWHITE = 200, 200, 200\nGOLD = 205, 145, 0\n\
    \nball = Rect(W/2, H/2, (30, 30))\nDirection = namedtuple('Direction', 'x y')\n\
    ball_dir = Direction(5, -5)\n\nbat = Rect(W/2, 0.96 * H, (120, 15))\n\nclass Block(Rect):\n\
    \n    def __init__(self, colour, rect):\n        Rect.__init__(self, rect)\n \
    \       self.colour = colour\n\nblocks = []\nfor n_block in range(24):\n    block\
    \ = Block(GOLD, (((n_block % 8) * 100) + 2, ((n_block // 8) * 25) + 2), (36, 33))\n\
    \    blocks.append(block)\n\ndef draw_blocks():\n    for block in blocks:\n  \
    \      screen.draw.filled_rect(block, block.colour)\n\ndef draw():\n    screen.clear()\n\
    \    screen.draw.filled_rect(ball, WHITE)\n    screen.draw.filled_rect(bat, RED)\n\
    \    draw_blocks()\n\ndef on_mouse_move(pos):\n    x, y = pos\n    bat.center\
    \ = (x, bat.center[1])\n\ndef on_mouse_down():\n    global ball_dir\n    ball_dir\
    \ = Direction(ball_dir.x * 1.5, ball_dir.y * 1.5)\n```\n\n"
