    由于 RAR 格式相当专有的特性，且在 Linux 社区中并不常用，因此能够解压 RAR 文件以及其他类型压缩格式的应用不多。不过，有一个 *unRAR*
    包可以让你做到这一点，所以情况并不是完全无望！


    你需要在 Ubuntu 和其他大多数发行版中安装它（*sudo apt-get install unrar*）。然后在命令行中使用类似以下的内容：


    ```

    $ unrar /path/to/file.rar

    ```


    它会将其解压到你保存该文件的目录中。简单又快速！


    ### 保持安全

    我始终非常关注系统中的密码、安全性以及我连接网络的方式。我为所有账户设置了不同的密码，并认为自己遵循良好的密码礼仪，但我希望切实改进我的详细信息存储方式，使其更私密、更安全。除了使用
    Tails 之外，我不太确定我可以使用哪些方法来实现这一目标。*Laura*


    你说得对，Tails 确实有点极端；尽管你肯定会变得非常安全和私密。然而，它比你的需求更进一步。


    我们的第一步是获取一个好的密码管理器，例如 LastPass。代替记住多个密码——这可能会带来问题，最终变得稍微不太安全且非常不便——LastPass 允许你使用一个主密码来访问其数据库中的加密密码。只要你对
    LastPass 拥有一个优秀的主密码，你就可以在其他任何地方使用复杂且高度安全的密码。


    不过，我们仍然建议你为 LastPass 受保护的在线服务列表保留电子邮件账户，因为电子邮件将这一切联系在一起。


    否则，你可以尝试使用一些硬件加密工具，使窥探你的数据变得困难。或者尝试在线使用别名。


