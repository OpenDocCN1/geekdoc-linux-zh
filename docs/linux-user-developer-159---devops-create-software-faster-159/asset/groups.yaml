    # 06 CoreOS disk installation


    Now that we have the cloud-config file ready, let us install CoreOS on the disk
    so that we are independent of the mounted CoreOS ISO file. The CoreOS install
    process is pretty straightforward. You just need to use the coreos-install command.
    To install CoreOS to the disk, just type:


    ```

    ```

    $ sudo coreos-install --dev=/dev/sda --C:table --c:cloud_config.yml

    ```

    ```


    This will install CoreOS to /dev/sda device from the stable channel, using the
    cloud-config file cloud_config.yml. Note that you need to replace cloud_config.yml
    with the name of the cloud-config file you created in the previous step. Once
    you enter the command, CoreOS will be downloaded and installed to your virtual
    machine. Check the installation by uninstalling the ISO image from the IDE controller
    and rebooting the virtual machine. If everything''s correct, the virtual machine
    should reboot and you should be able to log in using the username and password
    set in the cloud-config file.


    # 07 Docker on CoreOS


    Docker containers form the main building block of CoreOS. Since there is no package
