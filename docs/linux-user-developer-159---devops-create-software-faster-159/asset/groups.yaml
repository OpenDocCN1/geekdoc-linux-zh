    - 2. Debian ▼ 2,094

    - 3. Ubuntu ▼ 1,790

    - 4. openSUSE ▲ 1,519

    - 5. Fedora ▼ 1,175

    - 6. Manjaro ▲ 1,115

    - 7. Mageia ▼ 1,084

    - 8. Android-x86 ▼ 849

    - 9. CentOS ▼ 831

    - 10. Arch Linux ▼ 773


    ### 本月回顾


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_9_0.png)


    得益于 16.10 Wily Werewolf 及其官方衍生版本的发布，Ubuntu 本月受到了大量关注。


    ### 亮点


    **Ubuntu 15.10**

    Ubuntu 在本月的发行版统计数据中占据绝对主导地位，这主要归功于其桌面版、服务器版和核心版的同步发布，以及各种官方本地化版本、针对特定任务优化的版本以及特定桌面环境版本的推出。


    **Android-x86 5.1 RC1**

    尽管 Android-x86 在 Distrowatch 上的流量本周有所下降，但 CentOS 和 Arch 流量降幅更大，这使得谷歌安卓开源项目（AOSP）的移植版成功进入前十名榜单。


    **Linux From Scratch 7.8**

    Linux From Scratch 是由 Bruce Dubbs 编写的一份自由分发的指南，指导用户构建自己的发行版。最新发布的版本包含了一个基于 systemd
    的替代版本。


    # 最新可用发行版：

    filesilo.co.uk


    # 图形（GRAPHICS）


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_9_1.png)


    # Intel 发布 OpenSWR 光栅化器

    承诺性能提升高达 51 倍


    Intel 的一个小型工程团队发布了一款开源软件光栅化器，据称其性能相比 Llumpipe 等系统提升了 29 至 51 倍。


    被称为 OpenSWR 的工具充当虚拟图形处理器，并与 Mesa3D 进行接口交互，以处理 API 和状态跟踪层。该团队向这个项目贡献了代码，目标用户是那些处理大型几何模型但没有硬件图形处理能力的人——当然，我们记得，Intel
    生产 CPU 但不生产专用 GPU。


    “我们的客户偏好开源，允许他们只需下载 Mesa 源代码并启用我们的驱动程序，就能让他们的工作轻松很多，” Intel 的 Tim Rowley 在解释为何选择以宽松的
    Mesa MIT 许可证发布 OpenSWR 时说道。“当我们使用的源代码可以作为参考时，与 Mesa 社区合作也更容易。”


    Intel 表示，该公司针对基于 VIsualisation Toolkit 的应用程序，且 OpenSWR 通过了其 OpenGL 3.2 后端渲染测试的
    99%，目前正在努力证明其对其他测试套件的兼容性。


    OpenSWR 兼容任何具备 AVX 或 AVX2 扩展功能的 x86 处理器，尽管 Rowley 承认尚未在竞争对手 AMD 的处理器上进行测试。详情和源代码可在
    github.com/OpenSWR 获取。


    # 职业（CAREERS）

    # 微软招聘 Linux 专家

    我们已经从万圣节备忘录（Halloween memos）走来很远了


    微软的 Mark Russinovich 呼吁 Linux 专业人员向该公司发送简历，因为他的 Azure 云计算部门正在寻求扩展。


    微软传统上与开源软件（尤其是 Linux）竞争，1998 年 10 月泄露的一系列备忘录——被称为“万圣节备忘录”——尤其显得激进。然而近年来，该公司已扭转了其立场。


    在 All Things Open 大会的主题演讲中，Azure 首席技术官 Russinovich 指出了 Azure 上 Linux 使用量的显著增长，以及该公司支持这一趋势的需求。


    他开玩笑地请在场的 Linux 专家递交他们的简历，并声称该公司“渴望全面支持开源社区——与其传统的‘绊倒并延伸’（stambler and extend）策略大相径庭；批评者随后追加了‘熄灭’（extinguish）”。


    配合 Russinovich 演讲的一张幻灯片声称，微软有 500 个 Linux 相关的职位空缺，以及另外 350 个与开源项目相关的职位空缺。


    # 任意整数大小

    了解简单地将两个数字相加所涉及的潜在问题，然后跟随我们的两种解决方案进行操作


    **本月研究的问题是如何添加任意大小的整数。** 将使用 C 编程语言，但所展示的技术几乎直接适用于所有现代编程语言。


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_10_0.png)


    有两个关键问题迟早会出现：首先，如何处理溢出？其次，是否支持有符号整数？这两个问题都不难回答，但关键在于你应该在开始开发程序之前考虑到它们，因为后期修改会耗费更多时间。


    一个理性的选择是使用数组来存储整数的所有位数。如果你确实想要支持无限位数，可以使用文本文件来存储每个整数的位数。因此将展示两种实现方式。第一种使用数组，第二种使用文本文件来存储每个整数。每种方法都有其优缺点。第一种（*add.c*）实现更容易，执行速度更快，因为它无需读取或写入文件。后者（*addFile.c*）更灵活，使用更少的内存，并且无需额外代码即可处理溢出；你只需向文件中写入更多数据即可。*addFile.c*
    不会处理如何组织包含整数的文件；它只是读取存储在两个文本文件中的两个大整数，并将它们的加法结果保存到一个新文件中。所有文件名都将作为命令行参数提供。


    在 *add.c* 中你必须做出的主要决定是关于数组的大小。你可以从一个相对较大的数组大小开始，看看效果如何，然后再增加它。然而，这是一个主要问题，因为你需要重新编译
    *add.c* 才能增加数组的大小。出于简化的原因，*add.c* 仅处理无符号整数。因此，如果你给两个具有 *n* 位数字大小的整数作为输入，*add.c*
    会自动将它们的加法结果存储到一个同样具有 *n* 个位置的数组中。目前，*add.c* 添加两个随机生成的整数。


    为了理解 *add.c* 将整数存储到数组中的方式，请查看以下示例：


    - 你想将 123 存储到一个数组中。

    - 你有一个具有 10 个位置的数组，你必须通过在所有位置放置零来进行初始化。


