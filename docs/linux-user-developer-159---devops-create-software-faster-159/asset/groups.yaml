  - "[PAGE 76]\n\nThe number of stars is adjusted depending on the display resolution\n\
    \n# Full code listing\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_76_0.png)\n\n\
    # 10  Place the player\n\nTime to work out where we're drawing the player and\
    \ adjust the viewpoint. The player position is calculated twice in different positions\
    \ and averaged to match the polygon and parallax effects. The position of a point\
    \ on a circle is calculated:\n\n```\nx = cos( angle ) * radius\ny = sin( angle\
    \ ) * radius\n```\n\nSin and cos have a centre at zero so we need to add the screen\
    \ centre point to the player's X and Y. The player centre is calculated from the\
    \ radius multiplied by the cosine of the player angle plus the screen centre.\n\
    \n# 11  Fix a speed\n\nThe `moveCount` and `moveDelay` variables are used to fix\
    \ the player's movement speed around the level regardless of how many sections\
    \ there are.\n\nThe next section checks to see which quarter of the screen the\
    \ player is in and moves the centre accordingly. The playing field is moved by\
    \ a few pixels each frame until limited by:\n\n```\nif centerX < ( gwidth / 2\
    \ ) + ( gwidth / 20 )\n```\n\nFinally, the player's position is calculated and\
    \ drawn using the `polypot` command. The angle is fixed so the player faces the\
    \ centre and the size is scaled against the display resolution.\n\n# 12  Build\
    \ a polygon\n\nThe `polystart` command allows a polygon to be built up from a\
    \ series of lines and automatically filled in.\n\nRather than work out the automatic\
    \ sums within every plot in the `polystart` statement, we have calculated them\
    \ beforehand with c = cos( pAngle + 90 ) and s = sin( pAngle + 90 ) and u is the\
    \ scale of the ship against the display resolution.\n\n# 13  Polygon equation\n\
    \nEach X point on the polygon is based on scale * line length] multiplied by cos(\
    \ playerAngle + 90 ), minus ( scale * line length) multiplied by sin( playerAngle\
    \ + 90 ), plus playerX. For the Y coordinate, it's ( scale * line length ) multiplied\
    \ by sin( playerAngle + 90 ) plus ( scale * line length ) multiplied by cos( playerAngle\
    \ + 90 ) plus playerY.\n\n# 14  Experiment with variables\n\nThe `update` statement\
    \ at the very end copies the temporary frame buffer to the screen display... and\
    \ voila!\n\nThere are plenty of variables to experiment with so feel free to change\
    \ numbers and see what happens. Doing so will provide a great insight into what\
    \ is going on.\n\nNext month we will add enemies, firing and maybe a few sound\
    \ effects, too. The Particle Laser is brilliant!\n\n```\n# Calculate player position\n\
    pX = ( ( radius * cos( pAngle - ( gap / 2 ) ) + centerX ) +\n( ( radius * cos(\
    \ pAngle + ( gap / 2 ) ) + centerX ) ) / 2\npY = ( ( radius * sin( pAngle - (\
    \ gap / 2 ) ) + centerY ) +\n( ( radius * sin( pAngle + ( gap / 2 ) ) + centerY\
    \ ) ) / 2\nangle = 0\n\nif moveCount > 0 then\n    moveCount = moveCount - 1\n\
    end\n```\n\n```\n# move the center of closer objects more\nif pX + 2 < gwidth\
    \ / 2 then // check the players position\n    if centerX < ( gwidth / 2 ) + (\
    \ gwidth / 20 ) then\n        centerX = centerX + 4\n        centerY2 = centerY2\
    \ + 2\n    end\nend\n\nif pX - 2 > gwidth / 2 then\n    if centerX > ( gwidth\
    \ / 2 ) - ( gwidth / 20 ) then\n        centerX = centerX - 4\n        centerY2\
    \ = centerY2 - 2\n    end\nend\n\nif pY + 2 < gheight / 2 then\n    if centerY\
    \ < ( gheight / 2 ) + ( gheight / 20 ) then\n        centerY = centerY + 4\n \
    \       centerY2 = centerY2 + 2\n    end\nend\n\nif pY - 2 > gheight / 2 then\n\
    \    if centerY > ( gheight / 2 ) - ( gheight / 20 ) then\n        centerY = centerY\
    \ - 4\n        centerY2 = centerY2 - 2\n    end\nend\n\ncolour = yellow\nc = cos(\
    \ pAngle + 90 ) // correct the view angle by 90 degrees\ns = sin( pAngle + 90\
    \ )\nu = gheight / 80 // scale the player ship to the resolution\n```\n\n```\n\
    # rotate & scale coordinates; draw player ship\npolystart\npolypot((u*(5 * c)\
    \ - (u*5 * s) + pX), (u*(5 * s) + (u*(5 * c) + pY)\n    polypot((u*(5 * c) + pX),\
    \ (u*(5 * s) + pY)\n    polypot((0 - (u*2 * s) + pX), (u*(-2 * s) + pY)\n    polypot((u*(-4\
    \ * c) + pX), (u*(-5 * s) + pY)\n    polypot((u*(-5 * c) - (u*(5 * s) + pX), (u*(-5\
    \ * s) + (u*(5 * c) + pY)\n    polypot((0 - (u*4 * s) + pX), (u*(-4 * s) + pY)\n\
    \    polypot((u*(-7 * c) + pX), (u*(-7 * s) + pY)\n    polypot((u*(7 * c) + pX),\
    \ (u*(7 * s) + pY)\npolyend\nupdate\nrepeat\nend\n```"
  - "[PAGE 77]\n\n# WIN! FUZE Special Edition\n\n# Closing date for entries  \n10\
    \ February 2016\n\nWith decidedly retro roots, the award-winning FUZE is a programmable\
