    # Review


    # Free software


    # TEXT EDITOR


    # TEA 41.1.0


    A text editor for when an office suite would be overkill, TEA is a refreshing
    alternative


    **Good text editors tend to be focussed on workflow for coding, or to be simplified
    letter and document writing tools.** TEA manages to embrace both worlds, being
    a decent enough word processor – opening .odt, .rtf and .docx files, plus AbiWord,
    KiWord and other formats – and a better alternative to default code editors like
    Gedit. Syntax highlighting includes everything from Tex and LilyPond (see screenshot),
    through Lua and XML, to NASM and Verilog.


    Binaries are available for most platforms, as this is a long-established project,
    though surprisingly little known. TEA uses several Qt libraries, and can utilise
    aspell or hunspell for spellchecking duties – relatively minimal requirements
    for any editor or word processor. The first thing you’ll notice is, in addition
    to conventional horizontal tabs for multiple files, vertical tabs give access
    to file management, configuration, calender functions and the manual.


    With its built-in, ‘mc-like file manager, customisable hotkeys, image handling
    (within) TEA, and easy drag and drop to other programs; JavaScript plug-in architecture;
    clipboard manager, WikiMedia and DocBook tools; string handling functions; bookmarks;
    built-in calender; and support for templates and code snippets; this could be
    the most capable editor to run on minimal resource machines.


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_87_0.png)


    Above LilyPond, the file format for music engraving, benefits from syntax highlighting
    in TEA


    +   - **Pros**: The install size is a small enough to fit on pretty much anything,
    which makes it very versatile, and it’s fairly stable


    +   - **Cons**: There is no getting away from the idiosyncrasies, although they
    are minor, and there are missing features


    +   - **Great for...**: Low resource machines like the Raspberry Pi: semietov.org/tea


    # LOCK MANAGER


    # FLoM 1.0.0


    FLoM can synchronise your shell commands to avoid conflicts


    **Sometimes you don’t realise you need something until you discover it and start
    using it.** FLoM, which has just made the small leap to version 1.0.0, is one
    such useful tool. It serialises your processes to enable scripts and shell commands
    to be synchronised – either locally, in a single user system, or over a network.
    If you’ve come to the limits of what can be done by command concatenation and
    creative use of sleep or cron, this could be what you need.


    Installation is the usual configure and make, then make install with root permissions
    – there are no library dependencies to hunt down. Just as the nice program enables
    you to set priority, FLoM lets you run a command with a specific serialisation.
    Getting started is easy – just take a look at the wiki on FLoM’s SourceForge website;
    several use cases are presented. A simple example is to enter `f1om --sleep 10`
    at one terminal and `f1om --ls` in a second, which will not execute the ls command
    until the sleep 10 has finished running in the first terminal instance. This will
    create a lock on resources, in addition to it being released.


    +   - **Pros**: This is an extremely easy API to get to grip with, and what makes
    it even better is that it works well


    +   - **Cons**: Maybe we are getting jaded, but it’s yet another tool that has
    to be learned and incorporated


    +   - **Great for...**: Running scripts and tasks without resource conflict: sf.net/projects/flom'
