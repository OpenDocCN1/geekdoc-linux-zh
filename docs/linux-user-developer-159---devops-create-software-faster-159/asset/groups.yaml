    # OPINION


    # # The kernel column


    Jon Masters summarises the latest happenings in the Linux kernel community, as
    Linux 4.3 is released and work continues toward 4.4


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_15_0.png)


    **Jon Masters**


    is a Linux-kernel hacker who has been working on Linux for some 19 years, since
    he first attended university at the age of 13. Jon lives in Cambridge, Massachusetts,
    and works for a large enterprise Linux vendor, where he is driving the creation
    of standards for energy efficient ARM-powered servers


    > > Linux Torvalds announced the release of version 4.3 of the Linux kernel, noting
    that things had seemed to be a bit busy with fixes towards the end of the development
    cycle, but that “doing the actual numbers shows that that really was just my subjective
    feeling, probably due to the kernel summit and travel back home from Korea”. The
    latest kernel includes several exciting new features – the PIDs controller and
    user space page faults are among them – as well as the removal of the venerable
    ext4 filesystem (though readers shouldn’t worry about the latter, as we will explain).


    The PIDs controller feature in Linux 4.3 is based upon a simple enough idea: prevent
    the ‘fork bomb’ attack that used to be common on older Unix systems. In a fork
    bomb, the attacker runs code that tries to create as many new processes as possible,
    which ties up system RAM and computer resources. As a result of this, Linux (and
    Unix) systems, have long instituted seemingly arbitrary limits upon the maximum
    number of processes allowed (known to the kernel as tasks). Indeed, on a Fedora
    laptop, the **ulimit** command informs that the author’s user account is (by default)
    restricted to creating a maximum of 1,024 processes. But, working at the per-user
    level for limits is very **coarse grained**. The new controller group approach
    enables a group of processes (such as those started as part of a container) to
    be limited in their forging of further processes.


    Support for userspace page faults in Linux 4.3 will bring new capabilities to
    diverse areas, including that of virtualisation. Virtual machines, chrun (when
    running KVM on Linux), leverage the existing ‘host’ kernel to provide most of
    the needed supporting drivers and infrastructure, while abstracting the running
    VM as a regular process. That process has a userspace component based upon a modified
    QEMU that provides supporting capability for emulating hardware (and other resources)
    made available to the VM. Now, it will become possible for that QEMU to also handle
    page faults on behalf of the virtual machine during live migration activity, allowing
    for background migration of a running machine while tracking any modifications
    it makes to its memory during the migration process in


    a very lightweight fashion, ultimately speeding up live migration and reducing
    the latency impact on the VM.

    With the release of Linux 4.3 came the opening of the merge window (the period
    of time – usually just shy of two weeks in duration – during which disruptive
    changes are allowed for what will ultimately become Linux 4.4. At this time, one
    of the more interesting features being tracked for 4.4 inclusion is that of **richacl**
    (aka **native**, not mapped to **POSIX**, NFSv4 **ACLs** in filesystems), which
    will be of interest to networked and enterprise users in particular. We will have
    a full summary of the features that make it into 4.4 in next month’s issue. Meanwhile,
    it’s exciting also to see that support for the ultra low-cost CHIP “$9 computer”
    (based upon a sunxi 32-bit ARM chip) is probably going to land in 4.4 in time
    for the first batch of shipments.

    Finally this month, let’s spare a thought for Jaccon Bastiaansen, who posted a
    lengthy message entitled “Possible race condition in kernel ‘futex code’”, describing
    his use of an older 3.12/4.2-rt58 kernel on an 8-core 64-bit “Real Time” (hence
    the -rt58 patcheset reference) x86 system. His setup leverages 50 threads, a custom
    memory allocator and various other complexity described in the initial message.
    The interesting part of the story is the level to which he (and perhaps some colleagues
    hinted at in the message) obviously went to in order to root out the fundamental
    cause of his problems.

    Jaccon describes how the Linux ‘pthreads’ (**POSIX Threads**) code was failing
    over, claiming that a deadlock condition was arising with two threads simultaneously
    acquiring the same futexes (a construct used to represent a fast user mutex –
    hence “futex” – otherwise known as a lock). He wound up discovering that the compiled
    version of his kernel (when run through a disassembler) showed the kernel was
    checking the lock using unsafe and non-atomic byte-level accesses where it should
    have been using a word (on Intel, that means 4-byte) check. The problem was reproducible
    with certain compiler versions on his older kernel, but it had been fixed in newer
    kernels, as Thomas Gleixner noted. The thread makes for good reading for its depth:
    [https://lkml.org/lkml/2015/10/5/400](https://lkml.org/lkml/2015/10/5/400).'
