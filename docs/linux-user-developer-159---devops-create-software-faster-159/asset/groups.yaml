    ## KRunner 的强大功能


    KRunner 是一个用于启动命令的便捷工具。除了运行 Linux shell 命令外，KRunner 会即时搜索 GUI 应用程序，并在你输入时提供所有匹配项。然后，它还会查找系统设置条目、Plasma
    小部件和文件夹名称。例如，如果你输入 `music` 或 `play`，KRunner 将显示所有能够播放音乐的多媒体播放器、你的默认音乐文件夹、音乐 plasmoid
    以及相关的声音设置。


    KRunner 还可以与 Baloo5 一起用作搜索工具（两者共享相同的引擎），因为它会显示名称与你输入内容匹配的文档。当然，这些都是预期的功能，但我们要加点“魔法”。KRunner
    可以进行网页浏览！输入以 `www/` 开头的你喜欢的网址，然后选择搜索结果——地址将在默认浏览器中打开。接下来，让我们把 KRunner 当作计算器使用。当你输入计算式时，KRunner
    会根据序列开头或结尾的“=”符号检测到它并即时显示结果。计算器模块非常智能：它可以处理带有不同单位的方程。


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_42_1.png)


    ## 使用基于事件的操作


    KDE 的 KWin 管理器是一个强大的存在，几乎可以做你想到的任何事情，除了也许冲咖啡或倒垃圾。你可能已经熟悉系统设置中非常实用的“快捷键”部分，在那里你可以更改某些键盘按键甚至鼠标手势。但还有更多，因为
    KDE 可以在窗口状态改变时触发自定义命令。这在某些情况下非常有用，例如，当你想要实施自定义的家长控制，或者在某些事件发生时在校用电脑上设置某种警报。基于事件的操作意味着你可以在窗口打开或关闭，或获得或失去焦点时触发一个命令或脚本。让我们通过一个简单的例子来看看它是如何工作的，每次启动
    Firefox 时都会出现一个消息框。


    在“快捷键”部分，在左侧窗格上右键单击，选择 *新建/窗口操作/命令/URL*，并为其命名，例如 **New**。在 **Trigger**（触发器）选项卡中，选择“窗口获得焦点”选项，然后单击“Window
    simple”条目的 **Edit**（编辑）。在这里，你可以定义如何识别目标窗口。通常，检测窗口有很多种方法，在我们的例子中，只要告诉它窗口标题包含单词“Firefox”就足够了。在
    Action（操作）选项卡中插入以下内容：


    ```bash

    $ kdialog --messagebox "You were told not to run the browser!"

    ```


    一旦你点击应用，你的操作很快就会生效，然后骚扰任何在你的电脑上使用 Firefox 的人。不妨利用这个令人惊叹的功能试试看，看看你能搞出什么名堂！


    **上方** 使用基于事件的操作来触发命令


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_42_2.png)


    Plasma 5 有一个独特的视觉怪癖：应用程序按钮太大，周围有宽大的填充。如果你不喜欢这样，有一个简单的解决方法：使用紧凑的 QtCurve 主题，例如
    (linda) github.com/Kabuto/ midnight。当然，你可以手动调整任何主题，但根据 (Meha) 和 (arid) 的建议，这是一个快速的解决方案。


