    \ 和 xorHash.c 在 TABLESIZE 值增大的情况下都能获得显著的速度提升\n\n## 进行一些基准测试\n\n由于哈希表实现中只有两个因素可以变化，因此基准测试过程仅改变这两个因素。我们将使用三种不同的哈希函数（hashTable.c、otherHash.c\
    \ 和 xorHash.c）以及三个不同的 TABLESIZE 值（20、1001 和 10001）。因此，总共将使用 time 命令执行并测量九项测试。\n\
    \n上图展示了三种哈希函数在不同表大小下的性能。你此刻应当已经理解了良好的哈希函数以及容纳各种链表的大数组的重要性。请记住，当你更改 C 代码中的 TABLESIZE\
    \ 变量时，需要重新编译 C 文件才能使更改生效。\n\n正如你现在意识到的那样，一个好的哈希函数必须均匀分布元素，并尽可能减少冲突。此外，它还应考虑要处理的数据类型以及数量，因为如果不了解其数据，哈希函数就无法良好地执行。寻找完美哈希函数的过程是无止境的；然而，在尝试实现哈希函数时，最好的建议是始终考虑你将要处理的数据类型。\n\
    \n## 将哈希表与链表进行比较\n\n这部分将比较哈希表和链表的查找速度；两种实现都将使用 C 语言。请记住，链表的概念比哈希表的概念更简单。一般来说，概念越简单，其用途越通用。然而，与哈希表相比，链表最大的问题是，当你插入一个新节点时，你必须遍历整个链表，以确保新节点尚不存在于链表中。\n\
    \n## Python 中的哈希表\n\n这部分将简要谈谈 Python 如何实现哈希表，它们被称为字典（Dictionaries）。以下 Python 代码说明了\
    \ Python 处理字典的方式：\n\n```python\nHash = {}\nHash[\"key1\"] = 1\nHash[\"key2\"]\
    \ = \"12\"\nHash[\"key1\"] = 3\nfor key in Hash.keys():\n    print Hash[key]\n\
    ```\n\n第一行定义了一个名为 Hash 的新字典变量。接下来的三行将数据放入字典中。最后两行打印哈希字典中找到的所有值。Python 的方法或多或少与\
    \ Perl 和 AWK 的方法相似，理解它你应该不会有任何问题。\n\n为了使比较公平，应该使用大量元素来创建哈希表和链表。除了哈希表只有一个桶的情况外，链表是所有呈现程序中最慢的。然而，如果链表元素是排序的，那么其查找性能会好得多。排序链表最重要的好处是，检查节点是否已存在于链表中要容易得多，并且不需要遍历整个链表。当列表需要排序时，插入操作可能会非常慢。将元素插入未排序的链表速度更快。从哈希表和链表中删除元素基本上等同于查找它们。删除的实际成本是查找操作。\n\
