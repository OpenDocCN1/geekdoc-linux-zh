    \ We take the distance from the centre, **starsDist(starNum)**, and multiply it\
    \ by the cosine of the angle, **stars(starNum)**. We then add this to the centre\
    \ position, **starsCenterX**, to give the new starX position. The starY position\
    \ is the same but uses the sine instead.\n\n# **08** Check the star movement\n\
    \nWe check to see if a star has left the display area and if so, reset it back\
    \ to the centre plus a small offset, as we don't them to all appear from the dead\
    \ centre.\n\nFinally, the star is drawn using **plot(starX, starY)** and the **while**\
    \ loop is repeated until all of the stars have been updated and plotted on the\
    \ star field.\n\n# **09** Make the level\n\nOn to the level itself. Each segment\
    \ is drawn one at a time. The first line of the first segment has inner and outer\
    \ X and Y coordinates. The next line aloi (again, from centre to outer rim) is\
    \ calculated and the two connecting lines are drawn from the old positions to\
    \ the new ones."
