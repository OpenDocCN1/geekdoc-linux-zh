    1983 年闯入了北美防空司令部 (NORAD) 系统，这一壮举激发了 1983 年的电影《战争游戏》并使那些道德上不坚定的人陷入了无数的噩梦）。


    然而，黑客术语源自于 20 世纪 50 年代末和 60 年代初在麻省理工学院（MIT）的 TMCR（技术模型铁路俱乐部）及其分支组织午夜征用委员会周围形成的社区，这个环境既不太可能也不那么具有攻击性。TMCR
    的黑客们将“hack”定义为“一个进行的项目或构建的产品，其目的不仅是为了实现某个建设性目标，而是从单纯参与中获得了狂野的乐趣”。他们还将被黑客户定义为一个人“他喜欢学习编程系统的细节以及如何扩展其能力，与大多数只喜欢学习必要最小量的用户形成对比”；或者“热情编程或享受编程而不是仅仅对编程进行理论研究的人”（引自
    MIT 人工智能实验室最初的 jargon.txt）。


    午夜征用委员会之所以得名，正如史蒂文·莱维所说，是因为“当 TMCR 需要一组二极管或一些额外的继电器来为模型铁路系统构建新功能时”，他们中的有些人会“等到天黑，找到那些存放这些物品的地方。通常情况下，在其他方面非常诚实的没有一位黑客似乎将这种行为与偷窃划等号”。当一台
    TX-0 计算机到达 MIT 综合体的 26 号大楼，且 TMCR 成员发现访问 TX-0 的最佳时间是在夜间——“当任何一个理智正常的人都不会去注册 RLE
    实验室空调旁每周五张贴的纸上一小时的会话时”，黑客们的忠诚便从模型铁路布局表下转移到了计算机上。


    从那时起，“TMCR 黑客们很快开始称自己为 TX-0 黑客，并改变了生活方式以适应计算机”，并成为了 MIT 人工智能（AI）小组的核心成员，后来由美国国防部高级研究计划局（DARPA）资助。前
    TMCR 黑客开发了第一台 LISP 机器、第一台计算机工作站、第一款计算机游戏、第一款音乐软件和第一个显示 hack。黑客是计算机革命的先锋，黑客传统总是包含对权威的适度不尊重以及对恶作剧的相互热爱。每个想法和每个限制都是另一个需要探索的边界，一种通向可能扰乱现状或转化为更好想法的冒险目的的手段；特别是如果能找到更高的道德理由来证明这种目的时，那个理由，如在黑客伦理中定义的那样，就是：


    > 黑客是计算机革命的先锋，黑客传统总是包含对权威的适度不尊重以及对恶作剧的热爱


    理查德·希利斯利为各种出版物撰写关于艺术、音乐、数字权利、Linux 和自由软件的文章。


    ## 数据库


    ### 欧盟 100 万欧元投资助推 PostgreSQL 9.5


    2ndQuadrant 展示积极增长


    PostgreSQL（最近发布为 9.5 Beta 版本）的开发得益于欧盟的资金支持，这归功于 2ndQuadrant 的专门工作和对名为 AXLE 的重大研究项目的协调。2ndQuadrant
    促进 PostgreSQL 的开发，并是全球领先的 PostgreSQL 支持服务提供商。


    该研究计划获得了欧盟第七框架计划（FP7）提供的 100 万欧元研发资金，并作为 PostgreSQL 发展的催化剂。随着为期三年的项目于今年底结束，2ndQuadrant
    的团队将通过 AXLE 项目为增强 PostgreSQL 投入超过 10 年的努力。


    AXLE（针对欧洲极大数据的高级分析）聚集了一群多样化的研究人员，他们都专注于解决极大数据分析的需求。由于 PostgreSQL 是项目的核心，目标是产生能惠及许多人的积极成果——在本例中，包括若干新的、先进的功能，这些功能将在接下来的
    PostgreSQL 版本中引入。具体到 PostgreSQL，成果包括原子锁定、块范围索引、DDL 触发器和 TABLESAMPLE 功能。


    AXLE 还给 PostgresXL 9.5 注入了活力，这是一个可扩展的基于 PostgreSQL 的数据库集群，允许商业智能和事务性工作负载。PostgresXL
    是第一个提供这些能力的开源项目，由 2ndQuadrant、华为、NTT 和不断壮大的社区共同开发。


    ## 开源


    ### Collabora 签署英国政府云协议


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_8_0.png)


    > *上方：部长们将很快过渡到开放、基于云的办公软件套件*


    英国政府的采购人员已与 Collabora Productivity 签署了一项商业协议，该协议将使开源办公软件在台式机、移动设备和云服务器上得到使用，旨在节省专有软件的费用。


    Collabora 旨在向企业用户提供 LibreOffice 产品，即将推出一款基于云、可通过浏览器访问的软件包版本，名为 CloudSuite。这款 CloudSuite
    以及专门针对政府用途定制版本的 LibreOffice——GovOffice——将向所有非营利政府组织提供。


    “向云迁移，采用开放 IT 标准以及为纳税人节省资金是今天的协议所实现的三个关键政府目标，”Collabora 总经理迈克尔·米克斯声称。“Collabora
    将与皇家商业服务处合作，提高对开放文档格式（ODF）的好处以及更广泛的开源客户端解决方案的好处和成本节省的认识，”米克斯补充道。“这份协议的一个重要部分反映了
    Collabora 在部署开放文档格式方面将提供的支持水平和承诺。”


    自从英国内阁办公室大臣弗朗西斯·莫德发表了一份严厉的报告后，英国政府一直在逐步放弃专有格式。其现行准则规定，文档应以开放且可访问的格式提供，包括 HTML、ODF
    和纯文本，并应避免使用专有格式。


    ## 物联网


    ### 戴尔 IoT 边缘网关获得 Ubuntu Core 支持


    首批设备预计于 2015 年 12 月发货


    戴尔宣布了一款新的物联网（IoT）网关产品，戴尔边缘网关 5000 系列，该产品支持 Ubuntu Core 及其 Snappy 管理架构。


    Ubuntu Core 是 Canonical 的以云和嵌入式为中心的 Ubuntu Linux 发行版变体，最初于 2014 年宣布。其中一个关键变化是使用
    Snappy，这是一个新的管理系统，使用原子事务来允许随时回滚任何更改。


    正是这一特性吸引了戴尔加入该平台。“Snappy Ubuntu Core 能够自动回滚到上次已知可用的操作系统版本，这对我们的 IoT 客户是无价的，”戴尔的物联网战略与合作主管杰森·谢皮德在发布时解释道。“如果由于任何原因操作系统更新无法启动，Ubuntu
    Core 将自动恢复到其上次已知正常的操作系统版本，并保持客户信息向云端流动。”


    由英特尔原子处理器驱动的戴尔边缘网关 5000 系列，将于 12 月面向商业用途发布，2016 年 3 月面向工业用户发布，旨在从 IoT 传感器网络收集数据并在传输到远程服务器进行分析之前执行分析。


