  - "[PAGE 54]\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_54_0.png)\n\n**Left** OtherHash.c\
    \ and xorHash.c both get significant speed boosts from a larger TABLESIZE value\n\
    \n# Do some benchmarking\n\nAs only two things can vary in a hash table implementation,\
    \ the benchmarking process will only change these two factors. Three different\
    \ hash functions will be used (hashTable.c, otherHash.c and xorHash.c) as well\
    \ as three different TABLESIZE values (20, 1001 and 10001). So a total of nine\
    \ tests will be performed and measured using the time command.\n\nThe graph above\
    \ shows the performance of the three hash functions using the various table sizes.\
    \ You should now understand the importance of a good hash function and a large\
    \ array that holds the various linked lists. Please remember that when you change\
    \ the TABLESIZE variable in the C code, you should recompile the C file for changes\
    \ to take effect.\n\nAs you should realise by now, a good hash function has to\
    \ evenly distribute elements and minimise collisions as much as possible. Additionally,\
    \ it should take into account the kind of data it has to process as well as the\
    \ amount, because without knowing its data, a hash function cannot perform well.\
    \ The quest for the perfect hash function is endless; nevertheless, the best advice\
    \ when trying to implement a hash function is to always consider the kind of data\
    \ you are going to have.\n\n# Compare a hash table to a linked list\n\nThis part\
    \ will compare the search (lookup) speed of a hash table and a linked list; both\
    \ implementations will be in C. Please bear in mind that the concept of a linked\
    \ list is simpler than the concept of a hash table. Generally speaking, the simpler\
    \ the concept, the more general its usage can be. However, the biggest problem\
    \ of linked lists compared to hash tables is that when you insert a new node,\
    \ you will have to traverse the whole linked list in order to make sure that the\
    \ new node does not already exist in the linked list.\n\n# Hash tables in Python\n\
    \nThis part will talk a little bit about how Python implements hash tables, which\
    \ are called Dictionaries. The following Python code illustrates the way Python\
    \ deals with dictionaries:\n\n```\n```\nHash = {}\nHash[\"key1\"] = 1\nHash[\"\
    key2\"] = \"12\"\nHash[\"key1\"] = 3\nfor key in Hash.keys():\n    print Hash[key]\n\
    ```\n```\n\nThe first line defines a new dictionary variable named Hash. The next\
    \ three lines put data into the dictionary. The last two lines print all values\
    \ found in the hash dictionary. More or less, the Python approach is similar to\
    \ both Perl and AWK approaches and you should have no problems understanding it.\n\
    \nIn order for the comparison to be fair, a large number of elements should be\
    \ used for creating the hash table and the linked list. The linked list is the\
    \ slowest of all presented programs except when the hash table has only one bucket.\
    \ However, if the linked list elements were sorted then its search performance\
    \ would have been much better. The most important benefit of a sorted linked list\
    \ is that checking whether a node already exists in the linked list is much easier\
    \ and does not require traversing the whole linked list. When the list needs to\
    \ be sorted, the insertion can be very slow. Inserting an element into an unsorted\
    \ linked list is faster. Deleting an element from a hash table and a linked list\
    \ is basically the same as searching for it. The actual cost of deletion is the\
    \ lookup operation."
