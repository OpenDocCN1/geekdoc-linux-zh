    \ and love of electronics, the solid aluminium case features an integrated keyboard,\
    \ a specially designed GPIO header and a breadboard for simple electronics. Housed\
    \ the Raspberry Pi safely below the keyboard, the FUZE comes complete with FUZE\
    \ BASIC already installed.\n\nFUZE BASIC is an advanced, modernised version of\
    \ the BASIC programming language, widely accepted as the easiest beginner language\
    \ to teach and learn. Featuring a redesigned interface and advanced graphics\n\
    \nsupport, including sprite and image scaling, angle and alpha controls and rotation,\
    \ FUZE BASIC is fully configured to run with all models of the Raspberry Pi. The\
    \ whole FUZE system is slick and intuitive, and more than capable of programming\
    \ web and mobile games.\n\nThe FUZE Special Edition pays tribute to home computers\
    \ of the 1980s like the BBC Micro, and comes complete with a robotic arm kit to\
