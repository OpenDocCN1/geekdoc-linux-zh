    # Save time with GCC


    The most common use of GCC is when there are multiple program files to be compiled.
    If we compile each and every source file separately then the time required to
    build the executable is significant. However, if we compile all the files at once,
    we can achieve a significant time saving. If we have some 1,000 files and have
    modified only one file, then rather than compiling 1,000 files, we just need to
    compile one file and link it with the objects files to update the binary. This
    saves huge compilation time. You can go through a Makefile to understand how this
    can be achieved.'
