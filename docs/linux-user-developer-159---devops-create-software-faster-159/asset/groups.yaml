    # 评测


    # 自由软件


    ## 文本编辑器


    ### TEA 41.1.0


    TEA 是一款令人耳目一新的替代方案，适用于那些使用办公套件会显得大材小用的场景。


    优秀的文本编辑器往往专注于编程工作流，或者被简化为用于写信和文档编写的工具。TEA 成功地兼顾了这两个领域，它既是一个合格的文字处理器——能够打开 .odt、.rtf
    和 .docx 文件，以及 AbiWord、KiWord 和其他格式——也是 Gedit 等默认代码编辑器的更佳替代选择。语法高亮涵盖了从 Tex 和 LilyPond（参见截图）、Lua
    和 XML，到 NASM 和 Verilog 的各种内容。


    由于这是一个历史悠久但鲜为人知的项目，大多数平台均有二进制文件可用。TEA 使用多个 Qt 库，可以利用 aspell 或 hunspell 进行拼写检查——这对任何编辑器或文字处理器来说都是相对最低限度的要求。你首先会注意到的是，除了用于多文件的传统水平标签页外，垂直标签页还可访问文件管理、配置、日历功能以及手册。


    凭借其内置的类似 `mc` 风格的文件管理器、可自定义的快捷键、图像处理能力、易于拖放到其他程序的功能、JavaScript 插件架构、剪贴板管理器、WikiMedia
    和 DocBook 工具、字符串处理功能、书签、内置日历以及对模板和代码片段的支持；这可能是在资源有限的机器上运行的功能最强大的编辑器。


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_87_0.png)


    上述图片中，LilyPond（一种音乐刻写文件格式）在 TEA 中受益于语法高亮功能。


    -   **优点**：安装体积很小，几乎可以适配任何环境，使其非常通用，且相当稳定

    -   **缺点**：你无法回避其怪癖，尽管它们很轻微，但存在一些缺失的功能

    -   **非常适合...**：树莓派等资源有限的机器：semi.etov.org/tea


    ## 锁管理器


    ### FLoM 1.0.0


    FLoM 可以同步你的 shell 命令以避免冲突


    有时你并不知道自己需要什么，直到你发现并开始使用它。FLoM 刚刚跨越到 1.0.0 版本，就是一个这样的实用工具。它通过序列化你的进程，使脚本和 shell
    命令能够同步——无论是在本地单用户系统中，还是通过网络。如果你已经触及了通过命令串联和创造性使用 sleep 或 cron 所能做到的极限，这可能就是你所需要的。


    安装流程通常是标准的 configure 和 make，然后以 root 权限执行 make install——没有需要查找的库依赖。就像该程序允许你设置优先级一样，FLoM
    允许你以特定的序列化方式运行命令。入门很容易——只需查看 FLoM 在 SourceForge 网站上的 wiki；其中列出了几种使用案例。一个简单的例子是在一个终端输入
    `f1om --sleep 10`，在另一个终端输入 `f1om --ls`，这将导致 ls 命令只有在第一个终端实例中的 sleep 10 运行结束后才会执行。这不仅会在资源上创建锁，还会释放锁。


    -   **优点**：这是一个极其容易上手的 API，而且使其更好的是它运行良好

    -   **缺点**：也许我们变得挑剔了，但这又是要学习和整合的另一个工具

    -   **非常适合...**：无资源冲突地运行脚本和任务：sf.net/projects/flom


    # RPG 创建器


    ### RPGBoss 0.9.6


    开放结局的游戏玩起来很棒，但 RPGBoss 让你可以创建一个


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_88_0.png)


    冒险游戏早于家用电脑出现——既包括大型机上的命令行软件，也包括纸笔角色扮演游戏（RPG）——但它们在 PC 时代真正大放异彩，得益于一些优秀的受《龙与地下城》启发的作品。拥有数千名玩家的在线版本拓展了这一类型，但回归本源的好方法是使用
    RPGBoss 创建你自己的游戏。RPGBoss 是一个跨平台的 RPG 创建器，用 Java 编写，遵循 AGPL3 许可证。


    Java 软件真正的优势在于，你可以下载软件并在任何地方运行它（它既适用于 OpenJDK，也适用于专有 Java）。话虽如此，我们在 Java GUI 试图适应我们最喜欢的平铺窗口管理器
    Xmonad 时遇到了通常的显示怪异现象。将其放入更常规的环境中，你就可以开始了：选择一个新项目，开始为你的新角色扮演游戏构建一个宇宙——至少是一个关卡。


    RPGBoss wiki 上有几个预制游戏，可用于激发灵感，或者如果你还没完成自己的游戏，也可以直接玩耍。其中包括一些恐怖和历史题材的作品。构建你自己的游戏很简单，只需遵循
    wiki 的说明，沿着由事件、遭遇和地图组成的成熟路径前进；可用的资产包括音乐和战斗场景。它并不完美，但很有趣。


    **优点**


    积极开发，相对容易上手，此外它还让你能够充分发挥创造力


    **缺点**


    一切仍然感觉有点笨拙，尚未完全记录在案，这并不有帮助


    **非常适合...**


    轻松开始创建你自己的《龙与地下城》和冒险游戏


    rpgboss.com


    # 机器模拟器


    ### QEMU 2.4.0


    QEMU 提供完整的 CPU，有多种风味


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_88_1.png)


    尽管容器和硬件辅助hypervisor 最近的发展令人瞩目，但朴实的 QEMU——能够通过动态二进制翻译完全在软件层面模拟许多架构——几乎有被忽视的危险。最近的版本是一个很好的借口，让我们重新提醒自己这款精彩软件的功能。


    与容器解决方案不同，后者允许你共享（宿主）操作系统的内核给来宾操作系统，QEMU 模拟整个处理器和系统架构。这对于从开发 Raspbian 到测试跨多个架构的复杂系统都非常有用。它也适用于在
    FreeDOS 或其他古老且被忽视的平台上玩老游戏。


    至于速度问题，在大多数安装中，QEMU 默认使用 Linux 的 KVM（如果可用），基准测试显示其速度相当快。KVM 不仅适用于 x86——你会发现它在
    ARM Cortex A15 和 PowerPC 440 和 970 芯片上也能工作，除此之外，如果你有一台原生运行 Linux 的三星 Chromebook
    Series 3 或 PowerMac G5，你（理论上）也能获得与 Intel 用户相同的速度提升。


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_88_2.png)


    按 F12 编辑选项

    从 CD-ROM（或映像文件）将 FreeDOS 1.1 操作系统安装到硬盘

    SETUP 过程能够格式化驱动器/卷 C:，复制/提取文件，并生成必要的代码和配置文件以便从硬盘启动。


    上述：得益于 QEMU 进行模拟和虚拟化


    **优点**


    为用户提供极佳的多功能性——此外它是模拟某些架构的唯一选择


    **缺点**


    文档有待改进——所以你需要阅读在线教程才能掌握所需内容


    **非常适合...**


    老派游戏和新的跨平台软件


