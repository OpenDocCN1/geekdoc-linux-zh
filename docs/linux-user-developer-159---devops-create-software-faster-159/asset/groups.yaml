    # ## 01 Preconditions


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_38_0.png)


    Left The ISO downloads are linked inside the CoreOS documentation


    # ## 02 Cloud-config file


    CoreOS offers a great way to manage OS-level items such as user accounts, network
    configurations and more, using the cloud-config file. Here is how this works –
    every time the system boots up, the coreos-cloudinit program looks for the cloud-config
    file and then configures the OS as per the settings in the file. Note that the
    cloud-config file is processed during each boot – if it is somehow corrupted then
    the OS will still boot, but you may not be able to log in with your credentials
    because the cloud-config file stores all of those user credentials.


    It is also important to note here that this file is not auto-created – you''ll
    need to write it yourself and add user account details for starters. Later on,
    as and when you need extra configurations, you can add them to the file. The cloud-config
    file uses the YAML file format that uses whitespaces and new lines to delimit
    lists, associative arrays and values. CoreOS also provides a command line tool
    to validate a cloud-config file – just run `coreos-cloudinit -validate` from the
    command prompt.


    Now that we know few things about the cloud-config file, let us proceed with the
    installation process. We will also create the cloud-config during the installation
    process.


    # ## 03 Create virtual machine on VirtualBox


    As discussed, we will install CoreOS as a virtual machine on VirtualBox. Start
    by firing up VirtualBox on your system. Click on the New button up in the top-left
    corner to create a new virtual machine. In the next page that follows, assign
    a proper name for the virtual machine, set the Type as Linux and the Version as
    Linux 2.6 / 3.x (64 Bit). The next page asks you to set the RAM for the virtual
    machine; anything above 2048MB should be fine for our CoreOS installation. The
    next step is to set the hard drive file type as VDI (Virtual Disk Image) and then
    storage on the physical hard drive as dynamically allocated. We set the disk size
    to be 8GB, which is the minimum requirement. Based on the free memory on your
    system and your needs, you can set it to be anything above 8GB. Finally, hit the
    Create button. This creates a virtual machine with the specifications that have
    been set.


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_38_1.png)


    > Since there is no package manager, any software that you''d like to run on your
    CoreOS installation should be run as a container


    # ### What is flannel?


    Docker assigns an IP address to each container so it can communicate with other
    containers on the same host, but applications running inside containers can''t
    advertise their external IP and port on the network. Flannel solves the problem
    by giving each container an IP that can be used for container-to-container communication.
    It uses packet encapsulation to create a virtual overlay network.


