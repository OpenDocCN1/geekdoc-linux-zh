    # DATABASE


    # PostgreSQL 9.5 boosted by €1 million EU investment


    2ndQuadrant demonstrates positive growth


    The development of PostgreSQL, recently released as version 9.5 Beta, has benefited
    from EU funding thanks to 2ndQuadrant’s dedicated work and coordination of a major
    research project called AXLE. 2ndQuadrant facilitates the development of PostgreSQL
    and is a world leader in PostgreSQL support services.


    The research initiative received €1 million in R&D funding from an EU FP7 grant
    and has served as a catalyst for the development of PostgreSQL. As the three-year
    project comes to an end this month, the team at 2ndQuadrant will have contributed
    more than 10 years of effort towards enhancing PostgreSQL through the AXLE project.


    AXLE (Advanced Analytics for Extremely Large European Databases) has brought together
    a diverse group of researchers, all focused on solving the needs of extremely
    large data analysis. With PostgreSQL at the heart of the project, the goal was
    to produce positive outcomes that could benefit many – in this case, several new
    – advanced features, which will make their way into PostgreSQL in the next releases.
    Specific to PostgreSQL, the outcomes include atomic locking, Block Range indexes,
    DDL triggers and a TABLESAMPLE feature.


    AXLE has also breathed life into PostgresXL 9.5, a scalable PostgreSQL-based database
    cluster that allows both business intelligence and transactional workloads. PostgresXL
    is the first open source project to offer these capabilities and is developed
    communally by 2ndQuadrant, Huawei, NTT and a growing community.


    # OPEN SOURCE


    # Collabora signs UK Gov cloud agreement


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_8_0.png)


    > *Above Ministers will soon transition across to open, cloud-based productivity
    suites*


    Buyers for the UK Government have signed a commercial agreement with Collabora
    Productivity that will see open source productivity software used on desktops,
    mobile devices and cloud servers, in a bid to save money on proprietary equivalents.


    Set up to offer LibreOffice products to enterprise users, Collabora is shortly
    to launch a cloud-based, browser-accessible version of the package dubbed CloudSuite.
    This, and a customised version of LibreOffice created specifically for governmental
    use – GovOffice – will be available to all non-profit-making governmental organisations.


    > “Moving to the cloud, adopting open IT standards and saving the taxpayer money
    are three key Government objectives achieved by today’s agreement,” claimed Michael
    Meeks, Collabora general manager. “Collabora will work with The Crown Commercial
    Service to raise awareness of the benefits of the Open Document Format (ODF) as
    well as the more general benefits and cost savings of open source client solutions,”
    Meeks added. “An integral part of this agreement reflects the level of support
    and commitment Collabora will provide in the deployment of the Open Document Format.”


    The UK Government has been shifting away from proprietary formats since a scathing
    report from UK Cabinet Office Minister Francis Maude. Its current guidelines state
    that documents should be provided in open and accessible formats, including HTML,
    ODF and plain text, and that proprietary formats are to be avoided.


    # INTERNET OF THINGS


    # Dell IoT Edge Gateway gets Ubuntu Core support


    First units due to ship in December 2015


    Dell has announced a new Internet of Things (IoT) gateway product, the Dell Edge
    Gateway 5000 Series, which brings support for Ubuntu Core and its Snappy management
    architecture.


    Announced back in 2014, Ubuntu Core is Canonical’s cloud- and embedded-centric
    variant of the Ubuntu Linux distribution. One of the key changes is its use of
    Snappy, a new management system which uses atomic transactions to allow any changes
    to be rolled back on demand.


    It’s this that has attracted Dell to the platform. “Snappy Ubuntu Core’s ability
    to automatically roll back to the last known working version of the OS is invaluable
    to our IoT customers,” explained Dell’s director of IoT strategy and partnerships
    Jason Shepheard at the announcement. “Should an OS update fail to boot due to
    any reason, Ubuntu Core will automatically revert back to its last known good
    OS version and keep our customers’ information flowing to the cloud.”


    The Intel Atom-powered Dell Edge Gateway 5000 family, launching in December for
    commercial use and March 2016 for industrial users, is designed to collect data
    from IoT sensor networks and perform analytics before transmitting to remote servers
    for analysis.


