    \ pygame.camera.Camera object. The physical camera you want to use needs to be\
    \ recognised by the operating system before you can use it. Once it is, you can\
    \ get a list of all available cameras with the function pygame.camera.list_cameras().\
    \ Once you have selected a camera to use, you can create a new camera object that\
    \ is tied to it with the constructor pygame.camera.Camera(). The camera object's\
    \ method start() connects to the camera, initialises it and then starts to record\
    \ images from it. These images are placed into a buffer for further use. When\
    \ you are ready to work with these images, you can start to pull them from this\
    \ buffer with the function get_image(). This function returns the retrieved image\
    \ into a new surface object. If you want to reuse an existing surface, you can\
    \ load it in as a parameter to the function call. Unfortunately, pygame isn't\
    \ able to record audio directly. If you want to do this, you will need to use\
    \ a different module in your program, such as pymedia.\n\nNow that we've covered\
    \ the basics, you should be able to use pygame to add multimedia functionality\
    \ to your next Python project on your Raspberry Pi.\n\n# What about movies?\n\n\
    While playing audio and presenting images is all well and good, sometimes a video\
    \ is the clearest way to display output. Luckily, pygame can help you with this,\
    \ too. There is a movie object available that can handle the playback of MPEG-1\
    \ video files. The constructor takes a filename for the movie file: pygame.movie.Movie(filename).\
    \ You can check the data and see whether there is video data or audio data with\
    \ the helper functions has_audio() and has_video().\n\nMovie objects do need to\
    \ be displayed on some kind of surface. The default surface that the movie object\
    \ will use is the display surface. If this isn't to your liking, you can change\
    \ this to a different surface with the method set_display(). This draws over everything\
    \ on the surface, so you may want to actually draw on an off-screen surface and\
    \ blit() it to the display surface once each frame.\n\nWe have to warn you that\
    \ when it comes to audio, you do need to be a bit careful. The movie object expects\
    \ to have total control over the audio on your Raspberry Pi, so you need to be\
    \ sure that you don't have the mixer running. If there is a chance that it might\
    \ be running you can always guarantee that you don't have any conflicts by calling\
    \ pygame.mixer.quit() before you start playing your movie. You can change the\
    \ playback volume with the method set_volume(), giving a value between 0.0 and\
    \ 1.0.\n\nOnce the file is loaded, you can start playback with the method play()\
    \ and stop it again with the method stop(). If you want to just temporarily stop\
    \ the playback, you can use the pause() method and then restart it by calling\
    \ upon the pause method again. If you want to start playback at some fixed point,\
    \ you can use the skip() method to jump ahead a certain number of seconds. However,\
    \ please be aware that you can only jump forward. If you need to move backwards,\
    \ you can instead use the rewind() method to move back to the beginning and then\
    \ call skip() from there to jump forward to the desired point. You can also move\
    \ around by selecting a specific frame to move to, but this might be a tad difficult\
    \ to calculate. You can use the method get_frame() to get the current frame number,\
    \ then use that as a starting point, adjusting the value and using render_frame(id)\
    \ to move the video to the frame you want to display.\n\n# Hack a robot with Pi-Mote\n\
    \nCode a program to control a toy robot via your Raspberry Pi and the Energenie\
    \ IR board\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_69_0.png)\n\n**Dan Aldred**\
    \ is a Raspberry Pi Certified Educator and a Lead-School teacher for CAS. He recently\
    \ led a winning team of the Astro Pi secondary school contest\n\nIn the previous\
    \ issue (158) we looked at how to **create a hack to control your TV using the\
    \ Energenie Pi-Mote IR board** and a Raspberry Pi. We return to the world of the\
    \ IR board, only this time we use it to record signals from a remote control robotic\
    \ toy and combine these with pygame commands to enable you to control your robot\
    \ from your Raspberry Pi. Since the code is Python-based, you can then develop\
    \ it further, use social media to control the robot with tweets, or install Flask\
    \ to create a web interface accessible from your mobile phone.\n\nYou are advised\
    \ to use a fresh SD card image with no other software installed to reduce any\
    \ software conflicts. Boot up your Raspberry Pi and, in the LX Terminal, type:\n\
    \n```\nsudo apt-get update\nsudo apt-get upgrade\n```\n\n### 01 Update the boot\
    \ file\n\nBefore booting up your Raspberry Pi, attach the Energenie IR board to\
    \ GPIO pins. The board slots onto the top of the pins, the default GPIO pins used\
    \ when no pins are explicitly set are: input pin for received infrared signal\
    \ = PIN12/GPIO18; output pin for transmitted infrared signal = PIN11/GPIO17. You\n\
    \nThen add a line of code to the */boot/config.txt* file to enable the LIRC IR\
    \ software and IR module to interact. In the LX Terminal, type **sudo nano /boot/config.txt**.\
    \ This loads the config.txt file. Scroll to the bottom of the text and add the\
    \ following line:\n\n```\ndtovelay-lirc-rpi-overlay\n```\n\nPress Control and\
    \ X to save the file, then reboot your Pi by typing **sudo reboot**.\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_69_1.png)\n\
    \n### What you'll need\n\n- Pi-Mote IR control board\n  [bit.ly/1Mj3FQU](https://bit.ly/1Mj3FQU)\n\
    - Remote controlled robot\n"
