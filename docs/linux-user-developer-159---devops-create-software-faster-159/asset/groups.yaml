    # **RPG CREATOR**


    # RPGBoss 0.9.6


    ## Open ended games are great to play, but RPGBoss lets you create one


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_88_0.png)


    Adventure games predate the home computer – both as command line software on the
    mainframe and paper-based role playing games (RPG) – but they really came into
    their own in the PC era, with some excellent Dungeons & Dragons-inspired titles.
    Online versions with thousands of players have stretched the genre, but a great
    way to go back to basics is to use RPGBoss to create your own. RPGBoss is a cross-platform
    RPG creator, written in Java and licenced under the AGPL3.


    The real advantage with Java software is that you can just download the software
    and run it anywhere (it works with OpenJDK as well as proprietary Java). That
    said, we ran into the usual display weirdness we often encounter when a Java GUI
    tries to make sense of living on our favourite tiling window manager, Xmonad.
    Put it in a more conventional environment and you''re ready to go: select a new
    project and start building a universe – well, a level at least – for your new
    role-playing game.


    There are a few ready-built games on the RPGBoss wiki, to use as inspiration,
    or just to play if you haven''t finished your own game. These include some horror
    and historical titles. Building your own is a simple case of following the wiki
    instructions down a well-worn path through events, encounters and maps; the available
    assets include music and battle scenes. It''s not perfect, but it is good fun.


    **Pros**


    Actively developed, relatively easy to pick-up, plus it lets you get nice and
    creative


    **Cons**


    Everything still feels a little clunky and isn''t yet fully documented, which
    isn''t helpful


    **Great for...**


    An easy start to creating your own DoD and adventure


    rpgboss.com


    # **MACHINE EMULATOR**


    # QEMU 2.4.0


    ## QEMU gives the whole CPU, in many flavours


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_88_1.png)


    Amid all the glamour of recent developments in containers and hardware-assisted
    hypervisors, the humble QEMU – which can emulate many architectures entirely in
    software, through dynamic binary translation – is almost in danger of being overlooked.
    The recent release is a good excuse to remind ourselves what this wonderful piece
    of software will do.


