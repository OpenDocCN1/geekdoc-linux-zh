    # Otto''s Appfile


    Configuration can be minimal, leaving it all to Otto''s auto-detection, or quite
    detailed. You can also share blocks between Appfiles


    Appfiles are completely optional. If no Appfile exists, Otto inspects the project
    to detect what kind of application it is. It then generates an internal Appfile,
    which is not saved externally. Individual blocks within an Appfile are also optional.
    If an Appfile exists and a block such as `application` is missing, Otto will just
    merge in the detected data. Fragments from other Appfiles can be imported — this
    is the recommended way of sharing configurations for Appfiles, especially the
    project and infrastructure blocks (see line 1).


    If the application name and type properties (lines 5 & 6) are not included in
    the Appfile, Otto auto-detects the name of the directory the Appfile is in for
    the name, and uses filename pattern matching to determine the type - for example,
    the presence of a Gemfile indicates a Ruby application.


    Otto recognises GitHub URLs (a line 9) and turns them into one proper git repositories,
    and also accepts generic Git repos, it also recognises BitBucket URLs and turns
    them into Git or Mercurial repos, as well as accepts generic Mercurial repos.
    Finally, you can specify .json file parse.


    There can be multiple customisation blocks (line 13). The name of the block is
    the component to customise.


    As with the application block, the name and infrastructure properties can lines
    19 & 20) in Otto projects block can be left; our Otto auto-detects them. infrastructure
    (line 23) is currently hardcoded to say AWS with the ''simple'' flavour. The other
    available flavour for AWS (line 25) sets up a more production-like infrastructure
    that includes a VPC with public and private subnets, and more besides.


    ```

    Sample Appfile

    ```

    import "github.com/rubyforg/otto-shared() #")


    # Application block

    application {

    name = "otto example"

    type = "go"

    dependency { source = "github.com/hashicorp/otto/examples/herogo" }

    }


    # Let''s disable this for now using a multi-line comment

    customization "go" {

    go_version = "1.4.2"

    }


    # Project {

    name = "bast project"

    infrastructure = "production"

    }


    # infrastructure "production" {

    type = "aws"

    flavor = "vpc public private"

    }

    ```

    ```


    the burden of installing a service for development as a dependency onto the service
    creator. That makes things a lot simpler, and the developer of the service has
    a lot more flexibility; completely changing the language won''t affect your downstream
    developers.


    Microservices are still new. I don''t think that they''re mainstream yet – we''re
    just trying to plan for the future.


    # Why was there a need to release Otto as a new product, rather than improve Vagrant?


    Using programming languages as an example; if you wrote in an object-oriented
    language and suddenly felt that functional programming languages were the future,
    I would claim it would be unwise to bolt on features to an object-oriented language
    because they don''t get along in the same way, using the machine versus app example
    of Vagrant, I took a look at a Graphical API and thought that it just didn''t
    fit to put something higher-level there, and also Vagrant is very widely used
    – it gets millions of downloads a month – and there''s a lot of backwards compatibility
    concern. If you want something that''s six years old, battle-hardened and definitely
    going to work, then Vagrant''s there. If you''re using microservices, you want
    the cutting edge, then Otto is there – it''s going to be rock-solid eventually,
    but it''s still very much 0.1.


    # What''s the next step for Otto?


    I''m not sure how many people reading this will have used Vagrant 0.1 six years
    ago, but Vagrant 0.1 was, self-admittedly, very bad. It required Ubuntu, it only
    worked with VirtualBox, it only worked with Chef as


    a provisioner – weird things like that. When I look at Otto, I feel very much
    the same way – I think that it''s restrictive right now, for the purpose of showing
    you what it''s capable of. But over the next few versions we''re going to eliminate
    a lot of those restrictions. So in 0.2, for example, the big feature is the otto
    dev command, which is the equivalent to the vagrant up command. The otto dev command
    for basically any Agnirant type takes about five or ten seconds, versus Vagrant
    where it might take about a minute. So we''re working really hard to make this
    fast, to make it really enjoyable.


    We''re focusing on development first. There''s a disclaimer on the Otto website
    that, while Otto can deploy, we don''t recommend doing that yet. Otto deploy is
    mostly a demo of what it''s capable of but it''s not quite production-ready. After
    we make the development experience really good over the next couple of versions,
    the focus is going to be making the deployment experience production-ready. That''ll
    take us through the next six months.


    # What were the limitations of Vagrant that led you to create Otto?


    First, we noticed that everybody''s development environment within a certain language
    or framework was very similar – almost identical except for one or two things.
    While everyone likes to believe that their development environment is special,
    that''s not what we were seeing across the hundreds of thousands of users we were
    looking at. So we can build you a very common Ruby environment, a very common
    PHP environment,


    > “After we make the development experience really good over the next couple of
    versions, the focus is going to be making the deployment experience production-ready.”


