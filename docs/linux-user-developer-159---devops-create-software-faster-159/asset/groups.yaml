    \ via your Raspberry Pi and the Energenie IR board\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_69_0.png)\n\
    \n**Dan Aldred** \n\nis a Raspberry Pi Certified Educator and a Lead-School teacher\
    \ for CAS. He recently led a winning team of the Astro Pi secondary school contest\n\
    \nIn the previous issue (158) we looked at how to **create a hack to control your\
    \ TV using the Energenie Pi-Mote IR board** and a Raspberry Pi. We return to the\
    \ world of the IR board, only this time we use it to record signals from a remote\
    \ control robotic toy and combine these with pygame commands to enable you to\
    \ control your robot from your Raspberry Pi. Since the code is Python-based, you\
    \ can then develop it further, use social media to control the robot with tweets,\
    \ or install Flask to create a web interface accessible from your mobile phone.\n\
    \nare advised to use a fresh SD card image with no other software installed to\
    \ reduce any software conflicts. Boot up your Raspberry Pi and, in the LX Terminal,\
    \ type:\n\n```\nsudo apt-get update \nsudo apt-get upgrade\n```\n\n# 01 Update\
    \ the boot file\n\nBefore booting up your Raspberry Pi, attach the Energenie IR\
    \ board to GPIO pins. The board slots onto the top of the pins, the default GPIO\
    \ pins used when no pins are explicitly set are: input pin for received infrared\
    \ signal = PIN12/GPIO18; output pin for transmitted infrared signal = PIN11/GPIO17.\
    \ You\n\nThen add a line of code to the */boot/config.txt* file to enable the\
    \ LIRC IR software and IR module to interact. In the LX Terminal, type **sudo\
    \ nano /boot/config.txt**. This loads the config. txt file. Scroll to the bottom\
    \ of the text and add the following line:\n\n```\ndtovelay-lirc-rpi-overlay\n\
    ```\n\nPress Control and X to save the file, then reboot your Pi by typing **sudo\
    \ reboot**.\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_69_1.png)\n\n# What you'll\
    \ need\n\n+   - Pi-Mote IR control board \n+       [bit.ly/1Mj3FQU](https://bit.ly/1Mj3FQU)\n\
    +   - Remote controlled robot"
