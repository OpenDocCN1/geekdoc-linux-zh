    \n# **01  Zero effort**\n\nAlthough game writing is not easy, getting started\
    \ certainly is. If you've got Raspbian Jessie installed on your Pi, you're ready\
    \ to go. Open a terminal and type:\n\n```\n```\ntouch example.py\npgzero example.py\n\
    ```\n```\n\nAnd you'll see an empty game window open (Ctrl+Q will close the window).\
    \ Yes, it's that easy to get started!\n\n# **02  Python 3**\n\nIf you haven't\
    \ got Raspbian Jessie, chances are you'll have neither Pgz0 nor Pygame installed.\
    \ The Python's pip package installer will take care of grabbing Pgz0 for you,\
    \ but the preceding steps vary by distro. One thing you will need is Python 3.2\
    \ (or newer). If you've been sticking with Python 2.x in your coding (perhaps\
    \ because it's used in a tutorial you're following), make Pgz0 your chance for\
    \ a gentle upgrade to Python 3.\n\n# **Older Raspbian**\n\n# **03  Older Raspbian**\n\
    \nIf you're still running Raspbian Wheezy, you'll need to run the following steps\
    \ to install Pygame Zero:\n\n```\n```\nsudo apt-get update\nsudo apt-get install\
    \ python3-setuptools python3-pip\nsudo pip-3.2 install pgzero\n```\n```\n\nPygame\
    \ Zero deals with all of this boilerplate code for you, aiming to get you coding\
    \ games instantly\n\n# **04  No Pi?**\n\nYou don't even need a Raspberry Pi to\
    \ install Pygame Zero – just install the Pygame library, then use pip to install\
    \ Pygame Zero. Instructions vary by distro, but a good place to start is the documentation:\
    \ **bit.ly/1GYZnUB**.\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_62_4.png)\n\n\
    # **05  Intro.py**\n\nThat default black square of 800 by 600 pixels we saw in\
    \ Step 1 can be overridden manually. For example, we can replace it with an oversized\
    \ gold brick, in a nod to *Breakout*:\n\n```\n```\nWIDTH = 1000\nHEIGHT = 100\n\
    def draw():\n    screen.fill((205, 130, 0))\n```\n```\n\nThat colour tuple takes\
    \ RGB values, so you can quickly get colours off a cheatsheet: **screen** is built\
    \ into Pgz0 for the window display, with methods available for all sorts of different\
    \ sprites..."
  - "[PAGE 63]\n\n# ## Feature\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_63_0.png)\n\
    \n*Right The bat and ball come first — they’re the cornerstones of Pong and Breakout*\n\
    \n# ## 08 Batty\n\nYou can think of *Breakout* as essentially being a moving bat\
    \ – that is, you’re hitting a moving ball in order to knock out blocks. The bat\
    \ is a rectangle, and Pygame’s `Rect` objects store and manipulate rectangular\
    \ areas – we use `Rect(left, top, (width, height))`, before which we define the\
    \ bat colour and then call upon the `draw` function to put the bat on the screen,\
    \ using the `screen` function.\n\n```\n```\nW = 800\nH = 600\nRED = (200, 0, 0)\n\
    bat = Rect((W/2, 0.96 * H, (150, 15))\ndef draw():\n  screen.clear()\n  screen.draw.filled_rect(bat,\
    \ RED)```\n\n```\n\n# ## Object orientation\n\nDavid Ames, who uses `Pgo` to teach\
    \ younger children to code at events across the UK, told us, “One thing to avoid\
    \ when it comes to teaching kids is *Object Orientation* – OOP (object-oriented\
    \ programming) is partly abstracted away by `Pgo`, but it can’t be ignored.\n\n\
    Perhaps the best approach is using `Pgo` and some simple code to start, then dropping\
    \ in a piece of OOP when it’s needed to solve a particular problem.\n\nWith the\
    \ Code Club age group – about eight to eleven – feeding information to solve practical\
    \ problems works well. It can work with adults, too – but there’s always someone\
    \ who’s read ahead and has a few tricky questions.\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_63_1.png)\n\
    \n# ## 06 Sprite\n\nThe intro example from the `Pgo` docs expands on that with\
    \ the `Actor` class, which will automatically invoked the named sprite (`Pgo`\
    \ will hunt around for a `.jpg` or `.png` in a subdirectory called images).\n\n\
    ```\n```\nalien = Actor('alien')\nalien.pos = (100, 56)\nWIDTH = 500\nHEIGHT =\
    \ alien.height + 20\ndef draw():\n  screen.clear()\n  alien.draw()```\n\n```\n\
    \nYou can download the alien from the `Pgo` documentation (`bit.ly/15mSIM7`) and\
    \ try out the animation shown there, but we’re taking a different approach in\
    \ our game.\n\n# ## 07 Breakout via Pong\n\nWhile the `Pi` is something of a tribute\
    \ to 1980s 8-bit computers, *Breakout* comes from the 1970s and is a direct descendant\
    \ of the early arcade classic *Pong*. We’ll follow the route from *Pong* to *Breakout*\
    \ (which historically involved Apple founders Steve Wozniak and Steve Jobs in\
    \ the steps to creating our code, leaving you with the option of developing the\
    \ Pong elements into a proper game, as well as refining the finished Breakout\
    \ clone).\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_63_2.png)\n\n# ## 09 Mouse\
    \ move\n\nWe want to move the bat, and the mouse is closer to an arcade paddle\
    \ than the arrow keys. Add the following:\n\n```\n```\ndef on_mouse_move(pos):\n\
    \  x, y = pos\n  bat.center = (x, bat.center[1])```\n\n```\n\nUse `pgzrun` to\
    \ test that you have a screen, bat and movement."
  - "[PAGE 64]\n\n# **10** Square ball\n\nIn properly retro graphics-style, we define\
    \ a square ball too – another rectangle, essentially, with the **(30, 30)** size\
    \ making it that subset of rectangles that we call a square.\n\nWe're doing this\
    \ because Rect is another built-in in Pg0. If we wanted a circular ball, we'd\
    \ have to define a class and then use pygame's `draw.filled_circle(pos, radius,\
    \ (r, g, b))` – but Rect we can call directly. Simply add:\n\n```\nWHITE = 200,\
    \ 200, 200\nball = Rect(W/2, H/2, (30, 30))\n```\n\n... to the initial variable\
    \ assignments, and:\n\n```\nscreen.draw.filled_rect(ball, WHITE)\n```\n\n... to\
    \ the def draw() block.\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_64_0.png)\n\
    \n# **11** Action!\n\nNow let's make the ball move. Download the tutorial resources\
    \ in FileSilo.co.uk and then add the code inside the *move.py* file to assign\
    \ movement and velocity. Change the 5 in **ball_dir = Direction(5, -5)** if you\
    \ want the ball slower or faster, as your processor (and dexterity) demands –\
    \ but it's hard to tell now because the ball goes straight off the screen! Pg0\
    \ will call the *update()* function you define once per frame, giving the illusion\
    \ of smooth(ish) scrolling if you're not running much else.\n\n# **12** def move(ball)\n\
    \nTo get the ball to move within the screen we need to **define move(ball)** for\
    \ each case where the ball meets a wall. For this we use if statements to reverse\
    \ the ball's direction at each of the boundaries. Refer to the full code listing\
    \ on page 67.\n\nNote the hardcoded value of 781 for the width of screen, minus\
    \ the width of ball – it's okay to hardcode values in early versions of code,\
    \ but it's the kind of thing that will need changing if your project expands.\
    \ For example, a resizable screen would need a value of $W - 30$.\n\n# **13**\
    \ Absolute values\n\nYou might expect multiplying *y* by minus one to work for\
    \ reversing the direction of the ball when it hits the bat:\n\n```\nball_dir =\
    \ Direction(ball_dir.x, -1 * ball_dir.y)\n```\n\n... but you actually need to\
    \ use *abs*, which removes any minus signs, then minus:\n\n```\nball_dir = Direction(ball_dir.x,\
    \ - abs(ball_dir.y))\n```\n\nTry it without in the finished code and see if you\
    \ get some strange behaviour. Your homework is to work out why.\n\n# To get the\
    \ ball to move we need to **define move(ball)** for each case where the ball meets\
    \ a wall\n\n# Full code listing\n\n```\n```\n## Breakout type game to demonstrate\
    \ Pygame Zero library\n## Based originally upon Tim Viner's London Python Dojo\n\
    ## demonstration\n## Licensed under MIT License - see file COPYING\n\nfrom collections\
    \ import namedtuple\nimport pygame\nimport sys\nimport time\n\nW = 804\nH = 600\n\
    RED = 200, 0, 0\nWHITE = 200, 200, 200\nGOLD = 205, 145, 0\n\nball = Rect(W/2,\
    \ H/2, (30, 30))\nDirection = namedtuple('Direction', 'x y')\nball_dir = Direction(5,\
    \ -5)\n\nbat = Rect(W/2, 0.96 * H, (120, 15))\n\nclass Block(Rect):\n\n    def\
    \ __init__(self, colour, rect):\n        Rect.__init__(self, rect)\n        self.colour\
    \ = colour\n\nblocks = []\nfor n_block in range(24):\n    block = Block(GOLD,\
    \ (((n_block % 8) * 100) + 2, ((n_block // 8) * 25) + 2), (36, 33)))\n    blocks.append(block)\n\
    \ndef draw_blocks():\n    for block in blocks:\n        screen.draw.filled_rect(block,\
    \ block.colour)\n\ndef draw():\n    screen.clear()\n    screen.draw.filled_rect(ball,\
    \ WHITE)\n    screen.draw.filled_rect(bat, RED)\n    draw_blocks()\n\ndef on_mouse_move(pos):\n\
    \    x, y = pos\n    bat.center = (x, bat.center[1])\n\ndef on_mouse_down():\n\
    \    global ball_dir\n    ball_dir = Direction(ball_dir.x * 1.5, ball_dir.y *\
    \ 1.5)\n```\n```"
