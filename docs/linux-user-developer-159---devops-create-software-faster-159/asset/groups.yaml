    # AUTO-CONFIGURE NODES WITH PUPPET


    Puppet enables you to manage the state of your IT infrastructure. Here we''ll
    look at the Puppet installation process, then the master/agent setup


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_21_0.png)


    Above You can learn more about the state of Puppet at puppetlabs.com


    Automation is one of the key factors in implementing DevOps. The more you reduce
    human effort in repetitive tasks, the more you can get out of your workforce.
    IT infrastructure configuration is one such field that involves repetitive tasks
    – provisioning physical and virtual machines, orchestration, reporting and other
    similar tasks. Here are some advantages a configuration management tool offers:

    * Code commit log shows you the whole history of change on the infrastructure

    * Reproducible across systems

    * Scale easily

    * Coherent and consistent server setups

    * Aligned environments for development, testing, and production nodes


    So, a tool that lets you handle all this and more, without having you get your
    hands dirty in coding can help in going a long way on the DevOps path. Puppet
    is one such tool. Simply put, Puppet lets you manage the state of your IT infrastructure.
    In an agent/master setup, the master is the central Puppet server, from which
    all of your configuration data will be managed and distributed, and all your remaining
    servers will be Puppet agent nodes, which can be configured by the Puppet master.
    In standalone Puppet, every node periodically uses the **puppet apply** command
    to compile and apply its own configuration, using a full set of Puppet


    modules and manifests. In other words, each node requires the same files and data
    that the Puppet master requires in agent/master Puppet. In this tutorial we will
    focus on the agent/master Puppet setup.


    # 01 Pre-installation steps


    Once you decide on the setup type, ie agent/master or standalone, the next step
    is to identify the master (if you are planning to use the agent/master setup).
    Note that a Windows machine can''t be a master. Also, the master should be a dedicated
    machine with a minimum of two processor cores and at least 1GB RAM. It must also
    be reachable at a reliable hostname. You can reduce the setup time on your agents
    by making sure the master is available at the default hostname of *puppet*. The
    Puppet master should allow incoming traffic on port 8140 and agent nodes should
    be able to connect to the master. Puppet master serves as the certificate authority
    and so it should have its system time set up accurately, or it may mistakenly
    issue agent certificates from the distant past or future, which other nodes will
    treat as expired. Once all these are taken care of, you can move on to the next
    step of Puppet installation.


    # 02 Installation on the master


    Time to install Puppet on the master. First enable the Puppet Labs package repository;
    once this repository is enabled, we can install Puppet. Type:


    ```

    ```

    $ wget https://apt.puppetlabs.com/puppet-labs-release-trusty.deb

    $ sudo dpkg -i puppet-labs-release-trusty.deb

    $ sudo apt-get update

    ```


    ```


    Next, on the Puppet master node, type either this:


    ```

    ```

    $ sudo apt-get install puppetmaster-passenger

    ```


    ```


    ... which is recommended by PuppetLabs itself, as it installs Puppet and its prerequisites,
    and automatically configures a production-capacity web server; or instead, type
    in:


    ```

    ```

    $ sudo apt-get install puppetmaster

    ```


    ```


    ... which will only install Puppet, its prerequisites and an init script. */etc/init.d/puppetmaster*
    for running a test-quality Puppet master server.


    # Declarative language


    Puppet uses a declarative language to help you describe the state of the system.
    This means you don''t have to think about building a LAMP stack by installing
    Apache, MySQL, and PHP: then tweaking php.ini; then enabling mod_php; and so on.
    You can just describe the state you want – for example, "a web server with Apache,
    MySQL, and WordPress" – and then let Puppet make it happen.'
