  md: "\n# Tutorial: Plasma 5\n\n## Use Plasma 5 in VirtualBox\n\nHardware-accelerated\
    \ desktop is a killer feature of Plasma 5, yet the downside is its unenviable\
    \ performance as a guest in VirtualBox. The fix may sound brutal, but turning\
    \ off 3D acceleration in the machine settings does the trick. You may also encounter\
    \ the incorrect scaling of fonts and icons - this time you'll have to manually\
    \ set the font DPI size in the KDE font settings.\n\n## Make use of the Windows\
    \ key\n\nMany new Linux users come from the world of Windows where there are a\
    \ number of keyboard shortcuts and other features that people get familiar with.\
    \ Those who use GNOME on a Linux PC or OS X on a Mac know that the desktop metaphors\
    \ are completely different and a user is supposed to change their habits in order\
    \ to work efficiently on a new desktop. In KDE things are quite reversed: you\
    \ can reproduce certain keybindings to work just the same as they do in Windows.\
    \ In this example we will use the Windows button to launch the Start menu.\n\n\
    The default KDE Plasma desktop doesn't let you assign actions on a single key,\
    \ but there's a workaround called KSuperkey. Once it is installed, just launch\
    \ it with the `ksuperkey` command (and add it to KDE's autostart section) and\
    \ then just hit the Windows key - in KDE it is detected as Meta. KSuperkey works\
    \ fine with the default Plasma 5 Application launcher.\n\nFor the first trick\
    \ we'll need the `wmctrl` package, which can be found in almost any Linux distro.\
    \ Once you have it, create a script with the following content:\n\n```sh\n#!/bin/sh\n\
    target=on\nif xprop -root _NET_SHOWING_DESKTOP | fgrep \"= 1\"; then\n    target=off\n\
    fi\nwmctrl -k $target\n```\n\nSave it as a 'showdesktop.sh' file, then make it\
    \ executable (`chmod +x showdesktop.sh`) and finally assign it to the Win+D binding\
    \ in the Shortcuts section of System Settings.\n\nLocking the screen is an easier\
    \ process: there's no need to wrap anything into a script; instead, using a plain\
    \ command will be enough:\n\n```sh\nqdbus org/freedesktop/ScreenSaver /ScreenSaver\
    \ org.freedesktop.ScreenSaver.SetActive True\n```\n\n## Custom keybindings\n\n\
    As a continuation of the previous step, we'll try to reproduce the behaviour of\
    \ the Win+D and Win+L combinations, which will minimise all windows and lock the\
    \ desktop respectively.\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_43_0.png)\n\
    \n## Built-in web browser\n\nThere is an abundance of browsers for Linux, but\
    \ how about a browser right on your desktop? We've seen something similar in Ubuntu's\
    \ Unity, but in KDE a mini-browser is implemented as a plasmoid, meaning it doesn't\
    \ get in your way together with applications' windows and it sits quietly on the\
    \ desktop. To add it: just right-click on the desktop and select the 'Add Widgets...'\
    \ item, then search for 'Web browser'. Double-click to add it to the desktop and\
    \ see the default www.kde.org page opening in a tiny window. The plasmoid doesn't\
    \ have many settings except for a shortcut binding, so to change the website,\
    \ type its address in the plasmoid's text entry field with the mandatory 'www.'\
    \ prefix. The plasmoid will load your page and auto-adjust its layout to the size\
    \ of the plasmoid itself — you can resize to make the page inside the plasmoid\
    \ readable.\n\nThe web browser plasmoid currently uses the QtWebKit engine, the\
    \ same as in the Firefox browser, but the KDE team plans to switch to the newer\
    \ QtWebEngine, which is based on the Chromium code and renders pages much better.\
    \ Still, the current plasmoid is very capable and has a decent score of 390 points\
    \ on html5test.com.\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_44_0.png)\n\n\
    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_44_1.png)\n\n## Launch single settings\
    \ modules\n\nAll KDE Plasma 5 settings are conveniently grouped into the System\
    \ Settings application, which can also be launched by calling upon the **systemsettings5**\
    \ command. There is no denying that this application is very nice, but finding\
    \ the perfect setting can take some time and you might want to access everything\
    \ in a more elegant way. This can be done using the **kcmshell5** command. First,\
    \ let's see what modules we have:\n\n```sh\n$ /usr/bin/kcmshell5 --list\n```\n\
    \nUse any module as an argument to **kcmshell5** and it will then launch the respective\
    \ single module without accessing the control panel. For example:\n\n```sh\n$\
    \ /usr/bin/kcmshell5 kwincompositing\n```\n\n... will launch the desktop compositor's\
    \ setup. This technique lets you launch any module from the list and then, maybe,\
    \ create a shortcut with such a command, or bind it with a keyboard shortcut.\
    \ It is also possible to launch several modules with a single command. For instance:\n\
    \n```sh\n$ /usr/bin/kcmshell5 mouse kcm_xserver\n```\n\n... will display a nice\
    \ window with all these modules shown as different sections inside a single window.\n\
    \nFor even more Plasma 5 tips and tricks, it's always worth paying a visit to\
    \ the KDE wiki – community members are always uploading guides to [userbase.kde.org/Tutorials](http://userbase.kde.org/Tutorials).\n\
    \n> **Plasma 5 desktop is modular, so we can kill the shell without disturbing\
    \ anything else, be it a background process or a graphical application**\n\n##\
    \ Uniform look\n\nAs far as we can remember, the first attempt to clear the visual\
    \ differences between Qt-based and GTK-based apps was taken in Red Hat Linux 8.0\
    \ with the introduction of the Bluecurve theme. Nowadays, the problem is still\
    \ present: modern GTK2 and GTK3 apps don't quite fit well into the KDE desktop.\
    \ There are various workarounds for this issue, including the QtCurve theme, which\
    \ works well for GTK2 but has poor support for GTK3. Another option is to use\
    \ the Orion GTK theme, which looks similar to Plasma 5 Breeze (the default theme)\
    \ but still has huge visual inconsistencies with it. Luckily, we have a working\
    \ port of the Breeze theme to GTK at [github.com/dirkv1/gnome-breeze](https://github.com/dirkv1/gnome-breeze),\
    \ covering both light and dark variants. Simply copy the theme into either `~/.themes`\
    \ or `/usr/share/themes` and then select it in *System Settings* (*Widget style*\
    \ -> *GNOME Application style* (*GTK*)). Now you have a consistent visual experience\
    \ regardless of the graphical toolkit used.\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_45_0.png)\n\
    \n# Create user interfaces with MonoDevelop forms\n\nCreating GTK-based UIs used\
    \ to be an exercise in frustration, but MonoDevelop changes all that...\n\n+ \
    \  **Tim Hanna** has been in the IT business since the days of the Amiga PC. Serving\
    \ as a journalist, tutor, speaker and author of scientific books, he has seen\
    \ every aspect of the mobile market more than once\n\nWorking with GTK is a pain:\
    \ its handle-function-driven coding paradigm might have looked cool in the time\
    \ of Palm OS, but it looks hopelessly dated now.\n\nV-CL has attempted to improve\
    \ the situation by providing an object-oriented wrapper for most GUI classes.\
    \ This led to more compact code, but it’s miles away from true RAD (rapid application\
    \ development): seeing your user interface as you work on it is a true productivity\
    \ booster. Visual Basic was always a leader in this respect. The very first version\
    \ of the product ran under DOS, but it did not skimp on providing a WYSIWYG-GUI\
    \ editor.\n\nEven though Mono contains a runtime emulation for Microsoft’s Windows.Forms\
    \ namespace, MonoDevelop’s WYSIWYG editor is based on GTK. Since that framework\
    \ is just as cross-platform as Mono, using GTK should not be an issue for most\
    \ desktop-based applications. Furthermore, many of the concepts discussed here\
    \ can also be applied to a variety of other GUI tools.\n\nMonoDevelop will produce\
    \ a default GTK 2.0 project skeleton for you. In addition to the known C# files,\
    \ our project now also comes with a folder containing a form layout and a resource\
    \ file with a few icons. Actual program execution is still handled via `Program.cs`,\
    \ which by default contains the following code:\n\n```csharp\nclass MainClass\n\
    {\n    public static void Main (string[] args)\n    {\n        Application.Init\
    \ ();\n        MainWindow win = new MainWindow ();\n        win.Show ();\n   \
    \     Application.Run ();\n    }\n}\n```\n\n`Application.Init()` is a static method\
    \ domiciled in the GTK framework’s main class. After creating and displaying a\
    \ new instance of the `MainWindow` class, we invoke `Run()` in order to start\
    \ the event loop.\n\n## Resources\n\n-   **MonoDevelop**\n    -   [monodevelop.com](http://monodevelop.com)\n\
    \nBegin by firing up MonoDevelop. We covered the installation and deployment instructions\
    \ in the first part of this C# and MonoDevelop series (issue #157). Then create\
    \ a new project based on the template C# > Gtk 2.0 Project.\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_45_1.png)\n\
    \nRight: We’ll make a simple resistor colour code calculator this time\n"
  mdcn: "\n\n# 教程：Plasma 5\n\n## 在 VirtualBox 中使用 Plasma 5\n\n硬件加速桌面是 Plasma 5 的一个杀手级功能，但其缺点是在\
    \ VirtualBox 中作为来宾系统时表现不佳。解决方法可能听起来很残酷，但在机器设置中关闭 3D 加速即可奏效。您可能还会遇到字体和图标缩放不正确的问题——此时，您需要在\
    \ KDE 字体设置中手动设置字体的 DPI 大小。\n\n## 善用 Windows 键\n\n许多新的 Linux 用户来自 Windows 世界，那里有很多人们已经熟悉的键盘快捷键和其他功能。在\
    \ Linux 电脑上使用 GNOME 或在 Mac 上运行 OS X 的人都知道，桌面隐喻完全不同，用户需要改变习惯才能在新桌面上高效工作。而在 KDE\
    \ 中情况则恰恰相反：您可以重现某些按键绑定，使其在 Windows 中同样适用。在本例中，我们将使用 Windows 键来启动开始菜单。\n\n默认的 KDE\
    \ Plasma 桌面不允许您在单个按键上分配操作，但有一种名为 KSuperkey 的变通方法。安装后，只需使用 `ksuperkey` 命令启动它（并将其添加到\
    \ KDE 的自动启动部分），然后只需按下 Windows 键——在 KDE 中它被识别为 Meta。KSuperkey 与默认的 Plasma 5 应用程序启动器配合良好。\n\
    \n对于第一个技巧，我们需要 `wmctrl` 包，几乎在任何 Linux 发行版中都能找到。一旦您拥有了它，请创建一个包含以下内容的脚本：\n\n```sh\n\
    #!/bin/sh\ntarget=on\nif xprop -root _NET_SHOWING_DESKTOP | fgrep \"= 1\"; then\n\
    \    target=off\nfi\nwmctrl -k $target\n```\n\n将其保存为 'showdesktop.sh' 文件，然后使其可执行（`chmod\
    \ +x showdesktop.sh`），最后将其分配给系统设置中快捷键部分的 Win+D 绑定。\n\n锁定屏幕是一个更简单的过程：不需要将任何内容包装成脚本；相反，使用普通命令就足够了：\n\
    \n```sh\nqdbus org/freedesktop/ScreenSaver /ScreenSaver org.freedesktop.ScreenSaver.SetActive\
    \ True\n```\n\n## 自定义按键绑定\n\n作为上一步的延续，我们将尝试重现 Win+D 和 Win+L 组合键的行为，分别用于最小化所有窗口和锁定桌面。\n\
    \n![](img/0fc17bd4c29dc437e3ac28a53f7559db_43_0.png)\n\n## 内置网络浏览器\n\nLinux 有大量的浏览器，但您是否想过直接在桌面上拥有一个浏览器？我们在\
    \ Ubuntu 的 Unity 中见过类似的东西，但在 KDE 中，迷你浏览器是以 plasmoid（等离子元件）的形式实现的，这意味着它不会与应用窗口一起挡路，而是静静地待在桌面上。要添加它：只需右键单击桌面并选择\
    \ 'Add Widgets...'（添加部件...）项，然后搜索 'Web browser'（网络浏览器）。双击将其添加到桌面，并查看默认 www.kde.org\
    \ 页面在一个小窗口中打开。该 plasmoid 除了快捷键绑定外没有太多设置，因此要更改网站，请在 plasmoid 的文本输入字段中输入其地址，并带有强制的\
    \ 'www.' 前缀。该 plasmoid 将加载您的页面并自动调整其布局以匹配 plasmoid 本身的大小——您可以调整大小以使 plasmoid 内的页面可读。\n\
    \n网络浏览器 plasmoid 当前使用 QtWebKit 引擎，与 Firefox 浏览器相同，但 KDE 团队计划切换到较新的 QtWebEngine，后者基于\
    \ Chromium 代码，渲染页面更好。尽管如此，当前的 plasmoid 能力很强，在 html5test.com 上获得了不错的 390 分成绩。\n\
    \n![](img/0fc17bd4c29dc437e3ac28a53f7559db_44_0.png)\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_44_1.png)\n\
    \n## 启动单个设置模块\n\n所有 KDE Plasma 5 设置都方便地分组在系统设置应用程序中，也可以通过调用 **systemsettings5**\
    \ 命令来启动该应用程序。不可否认，这个应用程序非常好用，但找到完美的设置可能需要一些时间，您可能希望以更优雅的方式访问所有内容。这可以通过使用 **kcmshell5**\
    \ 命令来完成。首先，让我们看看我们有哪些模块：\n\n```sh\n$ /usr/bin/kcmshell5 --list\n```\n\n将任何模块作为\
    \ **kcmshell5** 的参数，它将启动相应的单个模块，而不访问控制面板。例如：\n\n```sh\n$ /usr/bin/kcmshell5 kwincompositing\n\
    ```\n\n...将启动桌面合成器设置。此技术允许您从列表中启动任何模块，然后，也许创建带有此类命令的快捷方式，或将其与键盘快捷键绑定。还可以使用单个命令启动多个模块。例如：\n\
    \n```sh\n$ /usr/bin/kcmshell5 mouse kcm_xserver\n```\n\n...将显示一个漂亮的窗口，其中所有这些模块作为单个窗口内的不同部分显示。\n\
    \n关于更多 Plasma 5 的技巧和窍门，访问 KDE wiki 总是值得的 – 社区成员一直在上传指南至 [userbase.kde.org/Tutorials](http://userbase.kde.org/Tutorials)。\n\
    \n> **Plasma 5 桌面是模块化的，因此我们可以终止 shell 而不干扰其他任何东西，无论是后台进程还是图形应用程序**\n\n## 统一外观\n\
    \n据我们所知，消除基于 Qt 和基于 GTK 的应用程序之间视觉差异的第一次尝试是在 Red Hat Linux 8.0 中引入 Bluecurve 主题时进行的。如今，问题仍然存在：现代\
    \ GTK2 和 GTK3 应用程序不太适合 KDE 桌面。这个问题有各种变通方法，包括 QtCurve 主题，它对 GTK2 效果很好，但对 GTK3 支持不佳。另一个选择是使用\
    \ Orion GTK 主题，其外观类似于 Plasma 5 Breeze（默认主题），但与之仍有很大的视觉不一致性。幸运的是，我们有 Breeze 主题到\
    \ GTK 的可用移植版本，位于 [github.com/dirkv1/gnome-breeze](https://github.com/dirkv1/gnome-breeze)，涵盖浅色和深色变体。只需将主题复制到\
    \ `~/.themes` 或 `/usr/share/themes`，然后在 *System Settings*（*Widget style* -> *GNOME\
    \ Application style* (*GTK*)）中选择它。现在，无论使用哪种图形工具包，您都能获得一致的视觉体验。\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_45_0.png)\n\
    \n# 使用 MonoDevelop 窗体创建用户界面\n\n创建基于 GTK 的 UI 过去是一项令人沮丧的工作，但 MonoDevelop 改变了这一切...\n\
    \n+   **Tim Hanna** 自 Amiga PC 时代起就从事 IT 行业。作为记者、导师、演讲者以及科学书籍的作者，他多次见证移动市场的各个方面\n\
    \n使用 GTK 很痛苦：其基于句柄函数的编码范式在 Palm OS 时代可能看起来很酷，但现在看起来非常过时。\n\nV-CL 试图通过为大多数 GUI\
    \ 类提供面向对象封装来改善这种情况。这导致了更紧凑的代码，但它离真正的 RAD（快速应用程序开发）还差得远：看到您正在工作的用户界面是生产力的真正助推器。Visual\
    \ Basic 在这方面一直是领导者。该产品的第一个版本在 DOS 下运行，但它并未吝啬于提供 WYSIWYG-GUI 编辑器。\n\n尽管 Mono 包含对\
    \ Microsoft 的 Windows.Forms 命名空间的运行时仿真，但 MonoDevelop 的 WYSIWYG 编辑器是基于 GTK 的。由于该框架与\
    \ Mono 一样具有跨平台性，对于大多数基于桌面的应用程序来说，使用 GTK 不应是问题。此外，这里讨论的许多概念也可以应用于各种其他 GUI 工具。\n\
    \nMonoDevelop 将为您生成默认的 GTK 2.0 项目骨架。除了已知的 C# 文件外，我们的项目现在还有一个包含窗体布局和几个图标的资源文件的文件夹。实际的程序执行仍然通过\
    \ `Program.cs` 处理，默认情况下包含以下代码：\n\n```csharp\nclass MainClass\n{\n    public static\
    \ void Main (string[] args)\n    {\n        Application.Init ();\n        MainWindow\
    \ win = new MainWindow ();\n        win.Show ();\n        Application.Run ();\n\
    \    }\n}\n```\n\n`Application.Init()` 是 GTK 框架主类中的静态方法。在创建并显示 `MainWindow` 类的新实例后，我们调用\
    \ `Run()` 以启动事件循环。\n\n## 资源\n\n-   **MonoDevelop**\n    -   [monodevelop.com](http://monodevelop.com)\n\
    \n首先启动 MonoDevelop。我们在这个 C# 和 MonoDevelop 系列的第一部分中涵盖了安装和部署说明（第 157 期）。然后基于模板 C#\
    \ > Gtk 2.0 Project 创建新项目。\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_45_1.png)\n\
    \n右：这次我们将制作一个简单的电阻色码计算器\n\n"
