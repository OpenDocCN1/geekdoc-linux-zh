    filesilo.co.uk'
  - "[PAGE 28]\n\n# A little Perl\n\nIt would be useful to know how Perl deals with\
    \ files and directories. Download and inspect find.pl, which shows the implementation\
    \ of find.c in Perl. As usual, the Perl version uses fewer lines of code than\
    \ C to do the same task.\n\nAs Perl has many modules, it is recommended to use\
    \ one when it helps you do your job. Neverthe less, this implementation does not\
    \ use any Perl modules in order to be closer to the C implementation.\n\nEach\
    \ time find.pl discovers a new directory, the directory is added to an array in\
    \ order to process it later on - a very clever approach, indeed. The program matches\
    \ the pattern, which is the second command line parameter of the program, against\
    \ the current filename. If it is a match then the filename is printed; otherwise,\
    \ the program goes to the next file.\n\nAt line 21, the program opens a directory,\
    \ before reading, reads all the contents of the directory at once and stores them\
