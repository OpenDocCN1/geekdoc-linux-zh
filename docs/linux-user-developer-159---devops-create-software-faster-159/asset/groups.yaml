    # ### Using compilation


    Compilation is an important aspect of the software development process and compilers
    are extensively used to create executable wherever we are working on huge code
    base. In this tutorial, we take a look at the compilation process and how to use
    popular compilers (GCC for compiling C programs and G++ for compiling C++ programs).
    We also explain compiler optimisation and learn how to use various optimisation
    levels that will significantly improve the performance of our programs.


    C and C++ use the most widely used compilers, partly because of the fact that
    both of these implement the open source compilers.


