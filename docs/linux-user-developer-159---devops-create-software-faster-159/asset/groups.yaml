  mdcn: "\n米哈利斯·措卡洛斯（Mihalis Tsoukalos）\n是一名 Unix 管理员、Unix 和 iOS 程序员、数据库管理员（DBA），同时也是动态图形设计师。自\
    \ 1993 年以来，他一直在使用 Linux。\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_27_0.png)\n\
    \n## 系统编程：文件与目录\n\n了解如何使用系统调用来编写工具，以处理文件、目录和符号链接\n\n本教程将介绍系统调用，并解释能够让你处理 Linux\
    \ 中文件和目录的技术。stat 函数系列以及保存所有重要数据的 stat 结构是本教程的核心。这里的大多数其他系统调用允许你修改 stat 结构中保存的大部分属性。尽管\
    \ stat 函数系列有四个函数：stat、fstat、lstat 和 fstatat，但这里只解释前三个。然而，它们都返回相同的信息，即一个 stat 结构，并且拥有相同的\
    \ man 页面，这应该是你查找额外信息的首选也是最后的选择。\n\n一如既往，大多数主题都附带相关的 C 代码，以阐明每个概念的难点。尽管如此，你应该尝试进行实验并编写自己的代码。最好的方法是尝试实现现有\
    \ Linux 命令行工具的简单版本。\n\n除了预期的 C 代码外，你还将看到 Perl、Go 和 Haskell 的代码，它们分别是一种脚本语言、一种通用编程语言和一种函数式编程语言。\n\
    \n在继续之前，你始终应该记住，当你谈论 UNIX 或 Linux 中的文件时，它可能指的是从网络设备、网络套接字、整个硬盘驱动器或打印机到纯文本文件的任何东西。\n\
    \n### stat() 系统调用\n\n以下代码展示了一个简单的程序（fstatEx.c），它同时使用了 stat() 和 fstat()，并提供关于文件和目录的信息。stat()\
    \ 和 fstat() 之间的主要区别在于，前者需要文件路径名作为输入，而后者需要文件描述符作为输入。因此，当你想要检查一个已经打开的文件时，fstat()\
    \ 更为合适。stat 函数主要被 ls 实用程序使用。\n\n```c\n#include <stdio.h>\n#include <sys/stat.h>\n\
    #include <fcntl.h>\n#include <unistd.h>\n\nint main(int argc, char** argv)\n{\n\
    ```\n\n### 资源\n\n-   文本编辑器\n-   GCC 编译器\n-   Perl 解释器\n-   Go 编译器\n-   Haskell\
    \ 编译器\n\n教程文件获取地址：filesilo.co.uk\n\n## 一点 Perl\n\n了解 Perl 如何处理文件和目录是很有用的。下载并检查\
    \ find.pl，它展示了 find.c 在 Perl 中的实现。照例，Perl 版本使用比 C 更少的代码行来完成相同的任务。\n\n由于 Perl 有许多模块，建议使用其中的一个来帮助你完成工作。然而，为了使实现更接近\
    \ C 语言版本，此实现没有使用任何 Perl 模块。\n\n每当 find.pl 发现一个新目录时，该目录会被添加到一个数组中以便稍后处理——这确实是一种非常巧妙的方法。程序将模式（这是程序的第二个命令行参数）与当前文件名进行匹配。如果匹配成功，则打印文件名；否则，程序转到下一个文件。\n\
    \n在第 21 行，程序打开一个目录，在读取之前，一次性读取目录的所有内容并存储在数组中。然后（第 22 行），在通过一个方便的 foreach 循环（第\
    \ 23 行）处理内容之前，关闭该目录。第 34 行使程序使用正则表达式从输出中排除当前目录（.）及其父目录（..）。第 36 行将文件名与给定的模式进行匹配。如果匹配成功，它继续打印为文件分配的实际块数；否则，它转到\
    \ foreach 循环的下一个迭代，处理 @files 数组中的下一个文件。第 39 行表明 Perl 将 stat 结构用作数组。\n\n```c\n\
    if (argc != 3)\n{\n    printf(\"Please use exactly two arguments!\\n\");\n   \
    \ return -1;\n}\nchar *file1 = argv[1];\nchar *file2 = argv[2];\nint fd = open(file1,\
    \ O_RDONLY);\n// Open the second file\nif (fd < 0)\n{\n    printf(\"Error reading\
    \ %s\\n\", file2);\n    return -1;\n}\n// Get file permissions using stat()\n\
    struct stat fileStat;\nif(stat(file2, &fileStat) < 0)\n    return 1;\nprintf(\"\
    The file permissions of %s are: \", file2);\nprintf(\"%c\", S_ISDIR(fileStat.st_mode)\
    \ ? \"d\" : \"-\" );\nprintf(\"%c\", fileStat.st_mode & S_ISUID) ? \"u\" : \"\
    -\" );\nprintf(\"%c\", fileStat.st_mode & S_ISGID) ? \"g\" : \"-\" );\nprintf(\"\
    %c\", fileStat.st_mode & S_ISVTX) ? \"t\" : \"-\" );\nprintf(\"%c\", fileStat.st_mode\
    \ & S_IRUSR) ? \"r\" : \"-\" );\nprintf(\"%c\", fileStat.st_mode & S_IWUSR) ?\
    \ \"w\" : \"-\" );\nprintf(\"%c\", fileStat.st_mode & S_IXUSR) ? \"x\" : \"-\"\
    \ );\nprintf(\"%c\", (fileStat.st_mode & S_IRGRP) ? \"r\" : \"-\" );\nprintf(\"\
    %c\", (fileStat.st_mode & S_IWGRP) ? \"w\" : \"-\" );\nprintf(\"%c\", (fileStat.st_mode\
    \ & S_IXGRP) ? \"x\" : \"-\" );\nprintf(\"%c\", (fileStat.st_mode & S_IROTH) ?\
    \ \"r\" : \"-\" );\nprintf(\"%c\", (fileStat.st_mode & S_IWOTH) ? \"w\" : \"-\"\
    \ );\nprintf(\"%c\", (fileStat.st_mode & S_IXOTH) ? \"x\" : \"-\" );\nprintf(\"\
    \\n\");\n```\n\n```c\nstruct stat {\n    dev_t   st_dev;    /* ID of device containing\
    \ file */\n    ino_t   st_ino;    /* inode number */\n    mode_t  st_mode;   /*\
    \ protection */\n    nlink_t st_nlink;  /* number of hard links */\n    uid_t\
    \   st_uid;    /* user ID of owner */\n    gid_t   st_gid;    /* group ID of owner\
    \ */\n    dev_t   st_rdev;   /* device ID (if special file) */\n    off_t   st_size;\
    \   /* total size, in bytes */\n    blkcnt_t st_blocks; /* number of 512B blocks\
    \ allocated */\n\n    /* Since Linux 2.6, the kernel supports nanosecond\n   \
    \    precision for the following timestamp fields.\n       For the details before\
    \ Linux 2.6, see NOTES. */\n\n    struct timespec st_atim; /* time of last access\
    \ */\n    struct timespec st_mtim; /* time of last modification */\n    struct\
    \ timespec st_ctim; /* time of last status change */\n    #define st_atime st_atim.tv_sec\
    \      /* Backward compatibility */\n    #define st_mtime st_mtim.tv_sec\n   \
    \ #define st_ctime st_ctim.tv_sec\n};\n\nNote: the order of fields in the stat\
    \ structure varies\nsomewhat across architectures.\n```\n\nstat 函数系列返回的信息看起来应该像这样：\n\
    \n```c\n// Get inode number using fstat()\nstruct stat anotherFileStat;\nif(fstat(fd,\
    \ &anotherFileStat) < 0)\n    return -1;\nprintf(\"File %s inode number is %ld\\\
    n\", file2,\n       anotherFileStat.st_ino);\n\n// Close file()\nclose(fd);\n\
    return 0;\n```\n\n对于 StatEx.c 程序，stat() 系统调用返回文件权限，而 fstat() 系统调用返回 inode 号。inode\
    \ 是文件系统上的一个数据结构，它保存关于文件的信息，除了文件名和数据。目录被实现为分配给 inode 的名称列表。因此，目录包含一个指向自身、其父目录以及每个子项（可以是文件或目录）的条目。请记住，inode\
    \ 不包含文件名；只包含其他文件元数据。\n\n顶部的图像显示了保存 stat 函数系列返回信息的 stat 结构。尽管 stat 结构的实际定义可能在不同的\
    \ UNIX 变体中有所不同，但所呈现的大多数信息应该都存在。\n\nfstatEx.c 文件是你想要回忆 stat() 工作原理时的首选参考。你可以使用\
    \ ls 命令验证 fstatEx.c 的结果。将从 stat() 获取的信息转换为八进制格式并不是一个琐碎的任务，尽管你只需要编写一次这段代码。另一方面，获取\
    \ inode 号是很直观的。\n\n## umask() 函数\n\numask() 函数设置与每个进程关联的文件创建掩码。每当进程将要创建新文件或新目录时，文件创建掩码就会发挥作用。\n\
    \n*umask()* 的主要用途是创建临时或永久文件，防止它们被意外读取或写入。通常，你不需要处理 *umask* 值，除非你想使用与从 shell 读取的不同的\
    \ *umask* 值。更改进程的 *umask* 不会影响其父进程（通常是 shell）的 *umask* 值。\n\n参考文献。*lstat()* 调用返回的唯一指代符号链接本身的属性是文件类型（S_IFLNK）、大小、块数和链接计数。\n\
    \n## chmod() 函数\n\n*chmod(path, mode)* 函数将由路径名 path 指定的文件的文件权限设置为 mode。*fchmod()*\
    \ 系统调用使用文件描述符而不是路径执行相同的操作。通常，除非你正在编写处理安全问题的软件，否则你可能不需要使用这些函数中的任何一个。由于使用 *chmod()*\
    \ 有点棘手，以下 C 代码应该使事情更容易理解：\n\n```c\nchar mode[]=\"0777\";\nint i;\ni = strtol(mode,\
    \ 0, 8);\nif (chmod(file, i) < 0)\n    printf(\"Error using chmod\");\n```\n\n\
    将所需的权限定义为字符串。然后使用 *strtol()* 将字符串转换为八进制数系统中的长整数。最后，使用 *chmod()* 将所需的权限设置给文件。上述\
    \ C 代码可以在文件 times.c 中找到。\n\n## 符号链接\n\n*lstat()* 函数提供关于符号链接的信息，而 *stat()* 返回关于链接指向的文件的信。另一个问题是，如果你想读取符号链接，你不能使用\
    \ *open()* 来完成，因为 *open()* 会跟随符号链接。有两个系统调用用于打开实际的符号链接：*readlink()* 和 *readlinkat()*。研究以下代码（countSymlinks.c）和下面的图像以了解更多关于处理符号链接的内容：\n\
