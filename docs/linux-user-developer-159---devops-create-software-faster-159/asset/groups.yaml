    \ `find.c` 的完整功能来改进程序。Go 代码会让你感到熟悉，因为它看起来很像 C 代码。\n\n查看 `filetype.c` 以获取完整实现。在实现任务之前，你不知道它是简单还是困难。此外，Linux\
    \ 命令行实用程序的大部分代码都涉及错误检查、命令行参数处理和异常——`filetype.c` 并没有做太多的错误检查，但在编写生产代码时，你无法回避对错误检查和异常情况的处理。\n\
    \n使用 AWK 处理 `filetype` 的输出可以得到关于 /dev 目录的有趣摘要数据：\n\n```bash\n$  ./filetype /dev/*\
    \ | awk -F:  '{print $2}'  | sort | uniq -c | sort -rn\n113 Character special\
    \ file.\n43  Block special file.\n11  Directory.\n7  Symbolic  Link.\n1  Pipe\
    \ or FIFO file.\n```\n\n同样，检查 /tmp 目录的内容将给出以下输出：\n\n```bash\n$  ./filetype /tmp/*\
    \ | awk -F:  '{print $2}'  | sort | uniq -c | sort -rn\n77  Directory.\n10  Pipe\
    \ or FIFO file.\n6  Regular file.\n3  Socket.\n```\n\n再次，你可以看到，当我们将 UNIX 命令行实用程序组合起来创建更复杂的命令时，它们展现了真正的威力。\n\
    \n# 使用 GNU 编译器集合编译软件\n\n掌握 GCC 的基本知识，并学习如何使用其强大的错误和警告标志\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_33_0.png)\n\
    \nSwayam Prakash\n拥有计算机工程硕士学位。他已在 IT 行业工作多年，专注于操作系统、网络安全和电子商务等领域\n\n## 资源\n\n\
    - GCC\n- bit.ly/1Gs9n69\n\n在 Linux 环境中开发软件时，我们通常使用 C 或 C++ 作为编程语言。我们编写的程序通常被称为源代码，而将这些源文件转换为另一种计算机语言的需求始终存在。编译是将源代码转换为目标语言（二进制形式）的过程，目的是创建可执行程序。编译通常被称为将源代码从高级编程语言翻译为低级语言的过程。编译器是一种专门用于将源代码转换为机器语言（也称为目标代码或机器代码）的程序，使其能够直接被\
    \ CPU（中央处理单元）理解。GNU 编译器集合 (GCC) 中包含了一个优秀的 C 编译器，它是大多数现代 Linux 发行版最重要的组件之一。因此，GCC\
    \ 被认为是 Linux 环境的标准 C 编译器，也被用作标准 C++ 编译器。请注意，GCC 是可移植的，可在许多操作系统平台上运行，并且目前可在所有 Unix\
    \ 系统上获得。有关 GCC 的更多详细信息，你可以访问 [gcc.gnu.org](https://gcc.gnu.org)。通过在控制台输入 `man\
    \ gcc`，你可以获取有关此流行编译器的所有相关信息。\n\n安装 GCC 最简单的方法是安装为你的操作系统制作的包。请注意，所有 GNU/Linux 发行版都包含\
    \ GCC 的包。一旦你在 Linux 系统上安装了 GCC，可以使用 `gcc --version` 命令来查看其版本。还可以通过 `-v` 选项获取更多详细信息。\n\
    \n现在让我们看看如何使用 GCC 编译用 C 语言编写的程序。使用你喜欢的任何文本或代码编辑器，输入以下程序并将其保存为 `sample_prog1.c`：\n\
    \n```c\n#include <stdio.h>\nmain()\n{\n    printf(\"This is a sample program to\
    \ understand GCC\\n\");\n}\n```\n\n以最简单的形式，GCC 可以像这样使用：\n\n```bash\ngcc sample_prog1.c\n\
    ```\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_33_1.png)\n\n右图：GCC 的手册页解释了可以与之使用的各种选项\n\
    \n正如预期的那样，该命令执行了整个编译过程，并生成为 `a.out` 的可执行文件。\n\n如果你想要运行该程序，需要执行以下命令：\n\n```bash\n\
    $ ./a.out\n```\n\n这会在你的屏幕上打印信息“This is a sample program to understand GCC”。我们现在已成功编译了\
    \ C 程序。\n\n如果你希望生成的可执行文件具有特定的输出文件名，可以使用如下所示的 `-o` 选项：\n\n```bash\n$ gcc -o sample_prog1\
    \ sample_prog1.c\n```\n\n在这里，生成的可执行文件将是 `sample_prog1`，而不是 `a.out`。换句话说，我们可以看到\
    \ `-o` 选项设置了 GCC 的输出文件名。\n\n开发人员通常与 GCC 一起使用的另一个重要选项是 `-Wall`。当我们编译程序时，编译器还会提供关于编译过程中遇到的警告的信息。这些警告由\
    \ GCC 的 `-W` 选项控制。有一种方法可以通过向 GCC 传递 `-Wall` 作为一个参数来启用所有常见的警告。对于我们要介绍的示例程序 `sample_prog1.c`，我们可以使用以下命令，其中我们将\
    \ `-Wall` 作为一个参数传递。\n\n```bash\n$ gcc -Wall -o sample_prog1 sample_prog1.c\n```\n\
    \n请注意，即使存在警告，GCC 也能编译我们的程序。只有当存在错误时，GCC 才会中止编译。\n\n同样重要的是要注意，GCC 有许多特定的警告标志，其中一些默认启用，并且它们都有否定形式。`-Wall`\
    \ 标志将打开几乎所有的警告标志，但 `-Wextra` 标志会启用更多的警告条件标志。为了了解 `-Wextra` 启用了哪些警告标志，运行 `man gcc`\
    \ 并快速浏览一下是值得的。\n\n让我们考虑以下程序（将此程序保存为 ‘sample_prog2.c’）。\n\n```c\n#include <stdio.h>\n\
    int main(void)\n{\n    printf(\"This is the second sample program to understand\
    \ GCC options\");\n}\n```\n\n当我们尝试使用 `-Wall` 选项编译上述程序时，我们将得到以下警告：\n\n```text\n\
    $ gcc -Wall -o sample_prog2 sample_prog2.c\nsample_prog2.c: In function ‘main’:\n\
    sample_prog2.c:5:1: warning: control reaches end of non-void function\n```\n\n\
    如果我们查看上述示例，我们可以注意到，即使 main 函数声明为返回整数值，返回值也是未定义的。我们的编译器立即显示了对应于此的警告。这个问题可以通过使用以下方法由开发人员修复（`sample_prog3.c`）：\n\
    \n```c\n#include <stdio.h>\n#include <stdlib.h>\nint main(void)\n{\n    printf(\"\
    This is the third sample program to understand GCC\");\n    return EXIT_SUCCESS;\n\
    }\n```\n\n当我们编译上述程序时，我们就不必担心任何警告了。\n\nGCC 的另一个有用选项是 `-Werror`，因为它使 GCC 将所有警告视为错误。当我们使用\
    \ `-Werror` 时，如果在过程中检测到任何警告，GCC 将不会完成编译。在处理大型项目时，使用此选项并使编译以这种方式中止是很常见的，这可能有益。我们可以按以下方式使用\
    \ `-Werror`：\n\n```bash\n$ gcc -Wall -Werror -o sample_prog2 sample_prog2.c\n\
    ```\n\n当我们设置 `-Werror` 选项时，编译器生成的警告可能并不非常严重，但当你编写复杂的程序时，这个选项对于追踪 bug 极其有用。因此，在你的过程中包含此选项是个好习惯。\n\
    \n现代开发系统的另一个有用功能是提供了一些强大的调试工具。借助这些调试工具，开发人员将拥有追踪程序执行过程的强大方法。并且通过这种方式，你将能够隔离烦人的问题，然后采取纠正措施来修复问题。GNU\
    \ 调试器 (GDB) 就是一个如此强大的调试工具。\n\n在我们有效地在程序中使用 GDB 之前，我们需要带有调试符号来编译我们的程序。当我们这样做时，GCC\
    \ 会向它生成的目标文件和可执行文件中插入额外信息。这些额外信息将使 GDB 能够确定编译代码与源程序中代码行之间的关系。\n\n请注意，调试符号默认不会编译到程序中。当我们拥有调试符号时，它们会增加可执行文件的大小。还要注意，为了生成调试符号，我们需要使用\
    \ GCC 的 `-g` 选项。以最简单的形式，它生成默认的调试选项集合，通常这对于调试目的就足够了。可以通过执行以下命令来完成：\n\n```bash\n\
    $ gcc -g -Wall -o sample_prog2 sample_prog2.c\n```\n\n也可以启用更多的调试信息，在某些情况下这会很有用。如果我们使用\
    \ GDB 调试器，可能需要执行类似以下的命令：\n\n## 使用 GCC 节省时间\n\nGCC 最常见的用途是当有多个需要编译的程序文件时。如果我们单独编译每一个源文件，那么构建可执行文件所需的时间是显著的。然而，如果我们一次性编译所有文件，我们可以实现显著的时间节省。如果我们有\
    \ 1,000 个文件并且只修改了一个文件，那么我们只需编译一个文件并将其与目标文件链接以更新二进制文件，而无需编译 1,000 个文件。这节省了大量的编译时间。你可以查看\
    \ Makefile 来了解如何实现这一点。\n\n"
