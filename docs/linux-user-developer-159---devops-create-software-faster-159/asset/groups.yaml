    # Arbitrary integer size

    Learn the problems associated with the simple addition of two numbers and then
    follow along with our two solutions


    **The problem that will be examined this month is how to add integers that are
    of arbitrary size.** The programming language that will be used is C, but the
    techniques that will be presented are directly applicable to almost all modern
    programming languages.


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_10_0.png)


    Two crucial questions will come up sooner or later: firstly, how do you deal with
    overflows? Secondly, will you support signed integers? Neither of them is difficult
    to answer, but the point is that you should think about them before you start
    developing your program because changes at a later stage will take more time.


    A rational choice would be to use an array to hold all the digits of an integer.
    If you really want to support infinite digits, you can use a text file for storing
    the digits of each integer. So two implementations will be presented. The first
    one will use an array and the second a text file to store each integer. Each approach
    has its advantages and drawbacks. The first one (*add.c*) is easier to implement
    and quicker to execute as it does not have to read or write to a file. The latter
    (*addFile.c*) is more flexible, uses less memory and can deal with overflows without
    the need for any extra code; you just write more data to a file. *addFile.c* will
    not deal with how to organise your files that contain the integers; it will just
    read two big integers stored in two text files and save the result of their addition
    into a new file. All filenames will be given as command line arguments.


    The main decision that you will have to make in *add.c* is about the size of the
    array. You can start with a relatively big array size and see how it goes before
    increasing it. This is a major issue, however you will need to recompile *add.c*
    in order to increase the size of the array. For reasons of simplicity, *add.c*
    will deal with unsigned integers only. So if you give two integers with a size
    of *n* digits as their input, *add.c* will automatically store the result of their
    addition into an array that also has *n* places. Currently, *add.c* adds two randomly
    generated integers.


    In order to understand the way *add.c* stores an integer into an array, look at
    the following example:


    - You want to store 123 into an array.

    - You have an array with 10 places that you will have to initialise by putting
    a zero everywhere.


    Mihalis Tsoukalos

    is a UNIX administrator, a programmer, a DBA and a mathematician. He has used

    Linux since 1993


    **If you are a supporter of simple solutions then you should go with the add.c
    implementation. However, if your purpose is the ‘perfect’ solution, then choose
    addFile.c.**


    - The integer will be stored in the array as `[0,0,0,0,0,0,0,1,2,3]`.


    Please note that this method will unfortunately only work for fixed size arrays.


    Once you have this arrangement for the way you store your integers, everything
