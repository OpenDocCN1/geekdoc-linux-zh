    # Tutorial


    # Plasma 5


    # ■ Use

    Plasma 5 in

    VirtualBox


    Hardware-accelerated desktop is a killer feature of Plasma 5, yet the downside
    is its unenviable performance as a guest in VirtualBox. The Fixmay sound brutal,
    but turning off 3D acceleration in the machine settings does the trick. You may
    also encounter the incorrect scaling of fonts and icons - this time you''ll have
    to manually set the font DPI size in the KDE font settings.


    # Make use of the Windows key


    Many new Linux users come from the world of Windows where there are a number of
    keyboard shortcuts and other features that people get familiar with. Those who
    use GNOME on a Linux PC or OS X on a Mac know that the desktop metaphors are completely
    different and a user is supposed to change their habits in order to work efficiently
    on a new desktop. In KDE things are quite reversed: you can reproduce certain
    keybindings to work just the same as they do in Windows. In this example we will
    use the Windows button to launch the Start menu.


    The default KDE Plasma desktop doesn''t let you assign actions on a single key,
    but there''s a workaround called KSuperkey. Once it is installed, just launch
    it with the ksuperkey command (and add it to KDE''s autostart section) and then
    just hit the Windows key - in KDE it is detected as Meta. KSuperkey works fine
    with the default Plasma 5 Application launcher.


    For the first trick we''ll need the wmctrl package, which can be found in almost
    any Linux distro. Once you have it, create a script with the following content:


    ```

    #!/bin/sh

    target=on

    if xprop -root _NET_SHOWING_DESKTOP | fgrep "= 1"; then

    target=off

    fi

    wmctrl -k $target

    ```


    Save it as a ''showdesktop.sh'' file, then make it executable (chmod +x showdesktop.sh)
    and finally assign it to the Win+D binding in the Shortcuts section of System
    Settings.


    Locking the screen is an easier process: there''s no need to wrap anything into
    a script; instead, using a plain command will be enough:


    ```

    $ qdbus org/freedesktop/ScreenSaver /ScreenSaver org.freedesktop.ScreenSaver.SetActive
    True

    ```


    # Custom keybindings


    As a continuation of the previous step, we''ll try to reproduce the behaviour
    of the Win+D and Win+L combinations, which will minimise all windows and lock
    the desktop respectively.


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_43_0.png)


    # Built-in web browser


    There is an abundance of browsers for Linux, but how about a browser right on
    your desktop? We''ve seen something similar in Ubuntu''s Unity, but in KDE a mini-browser
    is implemented as a plasmoid, meaning it doesn''t get in your way together with
    applications'' windows and it sits quietly on the desktop. To add it: just right-click
    on the desktop and select the ''Add Widgets...'' item, then search for ''Web browser''.
    Double-click to add it to the desktop and see the default www.kde.org page opening
    in a tiny window. The plasmoid doesn''t have many settings except for a shortcut
    binding, so to change the website, type its address in the plasmoid''s text entry
    field with the mandatory ''www.'' prefix. The plasmoid will load your page and
    auto-adjust its layout to the size of the plasmoid itself — you can resize to
    make the page inside the plasmoid readable.


    The web browser plasmoid currently uses the QtWebKit engine, the same as in the
    Tefykon browser, but the KDE team plans to switch to the newer QtWebEngine, which
    is based on the Chromium code and renders pages much better. Still, the current
    plasmoid is very capable and has a decent score of 390 points on html5test.com.'
