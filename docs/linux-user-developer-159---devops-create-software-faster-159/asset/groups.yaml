    ### 打造你完美的 Plasma 5 桌面


    Alexander Iolstoy

    多年来一直在精细调整他的 Linux 系统，使其运行速度飞快，但他仍在寻找更多的调整技巧。这种“强迫症”似乎是一种好习惯。


    使用隐藏的技巧来揭示这个尖端高级桌面环境的内在力量


    KDE 和 Gnome 用户之间的“圣战”似乎已经很久以前结束了，也许是因为后者大规模迁移到了 Cinnamon，但许多剩下的用户仍然喜爱他们的 KDE 安装，因为它快速、可配置且功能丰富。但七年首次发布的
    KDE 4 正在让路，为闪闪发光的新 Plasma 5 腾出空间。Plasma 5 是下一代硬件加速桌面，拥有时尚现代的外观，同时保留了备受推崇的“瑞士军刀”风格，这种风格始终激励着
    KDE 用户和开发者。就像老化的 KDE 4 一样，Plasma 5 是一个模块化桌面，由可以以任何方式重新排列的插件组成。桌面本身是一个收敛式外壳（converged
    shell），它可以即时适应不同的目标设备。结合现代的基于 Qt5 的应用程序，它使体验保持一致，并有助于确保工作流程更加优雅。


    ## 启动和停止


    重启图形外壳最明显的原因是应用那些不仅仅是点击“应用”按钮即可完成的设置。大多数人只会注销然后重新登录，但在这种情况下，所有已启动的应用程序都会关闭，这对于许多人来说是不可取的。


    Plasma 5 桌面是模块化的，这意味着我们可以杀死外壳而不干扰其他任何东西，无论是后台进程还是图形应用程序。打开 Konsolle，或者也许按下 Alt+F2
    调出 KRRunner 抬头提示，然后输入：


    ```bash

    $ kquitapp5 plasmashell

    ```


    ... 然后：


    ```bash

    $ plasmashell

    ```


    ... 再次启动它。你正在运行的所有应用程序将保持开启状态。在外壳关闭期间，你仍然可以访问 KRrunner，甚至通过利用熟悉的 Alt+Tab 序列来切换应用程序。


    ## 资源


    Plasma 5 桌面


    新的 Plasma 5 桌面可能尚未成熟，但在过去几个月里，它正在迅速缩小差距，因此许多人已经在日常使用它。Kubuntu、OpenSUSE、KaOS、Manjaro
    和其他许多发行版提供了开箱即用的、经过精细调整的 Plasma 5 发行版。这里的步骤涵盖了适用于 KDE 4 和 5 的技巧和窍门，尽管有些是 Plasma
    5 特有的。


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_41_1.png)


    > 右：KDE Plasma 5 可能是地球上可定制性和主题化程度最高的桌面


