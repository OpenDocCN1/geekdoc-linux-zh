    \ = moveDelay\n    if pingL$ > 360 then\n      pingL$ = gap / 2\n  endif\nendif\n\
    ```\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_74_1.png)\n\n## Full code listing\n\
    \n**Step 06**\n\n```\n   end if\n   if scankeyb$ord(scankeyb) then\n     if moveCount\
    \ = 0 then\n       pAngle = pAngle - gap\n       moveCount = moveToCount\n   \
    \    if pAngle < 0 then\n         pAngle = 360 - ( gap / 2 )\n       end if\n\
    \     end if\n   end if\n\nStep 07\n   # set max particle effects based on resolution\n\
    \   maxStars = height / 5\n\n   colour = white\n   while starNum < maxStars cycle\n\
    \     # calculate star positions using expanding or\n     # contracting circles\n\
    \     starX = starsDist(starNum) * cos( stars(starNum) )\n     starX = starsCenterX\
    \ + starX\n     starY = starsDist(starNum) * sin( stars(starNum) )\n     starY\
    \ = starsCenterY + starY\n     starsDist(starNum) = starsDist(starNum) + starsSpeed(starNum)\n\
    \nStep 08\n     # reset position if offscreen\n     if starX < 0 then\n      \
    \ starsDist( starNum ) = rnd( 15 ) + 5\n     end if\n     if starX > gwidth then\n\
    \       starsDist( starNum ) = rnd( 15 ) + 5\n     end if\n     if starY < 0 then\n\
    \       starsDist( starNum ) = rnd( 15 ) + 5\n     end if\n     if starY > gheight\
    \ then\n       starsDist( starNum ) = rnd( 15 ) + 5\n     end if\n\n     plot(\
    \ starX, starY )\n     starNum = starNum + 1\n   repeat\n   starNum = 0\n\nStep\
    \ 09\n   # Draw the level by looping & drawing a segment at a time.\n   colour\
    \ = blue\n   while angle < 360 cycle\n     x = radius * cos( angle )\n     x =\
    \ centerX + x\n     y = radius * sin( angle )\n     y = centerY + y\n     x2 =\
    \ radius2 * cos( angle )\n     x2 = centerX2 + x2\n     y2 = radius2 * sin( angle\
    \ )\n     y2 = centerY2 + y2\n     line( x, y, x2, y2 )\n     line( x, y, oldX,\
    \ oldY )\n     line( x2, y2, oldX2, oldY2 )\n     oldX = x\n     oldY = y\n  \
    \   oldX2 = x2\n     oldY2 = y2\n     angle = angle + gap\n   repeat\n```\n\n\
    ### 05 Player variables\n\nA few player variables are required to determine the\
    \ location on-screen and its position in relation to the level.\n\nThree centre\
    \ X and Y coordinates are used: two moving ones for the level and a fixed one\
    \ for the star field. The moving centres will make sense a bit further on, but\
    \ it is thanks to these that we have the slick perspective effects.\n\nA **moveDelay**\
    \ variable (80 divided by the number of sections, i.e. **vertices**) is used to\
    \ keep player movement consistent regardless of how many sections there are in\
    \ the level.\n\n### 06 Remove flicker\n\nNow we move onto the main **loop**. The\
    \ `cls2` statement is critical and is very different to the more standard `cls`\
    \ version: `cls2` wipes out the frame buffer memory; this is a separate screen\
    \ memory where everything is drawn first. When you issue an `update` statement,\
    \ the frame buffer is copied to the main screen memory. The `cls` version just\
    \ clears everything, so it creates a lot of flicker. Both `cls2` and `update`\
    \ ensure flicker-free updates, which is essential for games.\n\nThe player keyboard\
    \ controls are checked next. If the right cursor is pressed then the player angle\
    \ is increased by the **gap** amount (this is the distance to the centre of the\
    \ next section). The left cursor, of course, does the opposite.\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_75_0.png)\n\
    \n### 07 Position the stars\n\nThen we calculate the star positions – that is\
    \ each and every one of them! The number of stars is adjusted depending on the\
    \ display resolution.\n\nWhile is selected and a loop to count through the stars\
    \ is initiated. Each star is a position on the circumference of a circle. The\
    \ radius of the circle therefore determines the star's distance from the centre.\
    \ We take the distance from the centre, **starsDist(starNum)**, and multiply it\
    \ by the cosine of the angle, **stars(starNum)**. We then add this to the centre\
    \ position, **starsCenterX**, to give the new starX position. The starY position\
    \ is the same but uses the sine instead.\n\n### 08 Check the star movement\n\n\
    We check to see if a star has left the display area and if so, reset it back to\
    \ the centre plus a small offset, as we don't them to all appear from the dead\
    \ centre.\n\nFinally, the star is drawn using **plot(starX, starY)** and the **while**\
    \ loop is repeated until all of the stars have been updated and plotted on the\
    \ star field.\n\n### 09 Make the level\n\nOn to the level itself. Each segment\
    \ is drawn one at a time. The first line of the first segment has inner and outer\
    \ X and Y coordinates. The next line aloi (again, from centre to outer rim) is\
    \ calculated and the two connecting lines are drawn from the old positions to\
    \ the new ones.\n"
  mdcn: "\n\n## 教程\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_73_0.png)\n\n### 使用\
    \ FUZE BASIC 编写《Tempest》克隆游戏 第一部分\n\n### 用 FUZE BASIC 复刻经典游戏，深入编程世界\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_73_1.png)\n\
    \n**Luke Mulcahy** 是 FUZE 团队的内部程序员。年仅 15 岁的 Luke 精通多种编程语言，尽管他并不喜欢让 FUZE BASIC\
    \ 经受考验。\n\n欢迎来到我们最新的 FUZE BASIC 教程。如果你尚未获取该编程语言，Linux 和树莓派用户可以免费从 fuze.co.uk/getfuzebasic\
    \ 下载 FUZE BASIC。\n\n那么，为什么要费力学习 BASIC 呢？BASIC（初学者全用途符号指令代码）在 70 年代和 80 年代推动计算革命中发挥了关键作用。三十年后的今天，BASIC（或在本例中的\
    \ FUZE BASIC）提供了原经典版本的现代化演绎。现在配备了用于高级精灵和媒体处理的更新命令，移除了 goto 和 gosub 命令以及行号，并且在现代硬件上运行飞快，它仍然是希望进入编程世界的用户最容易入门的途径之一。\n\
    \n为了证明使用它的简单程度，在本教程中我们将探讨如何编写一款经典街机游戏。随后，在接下来的两期中，我们将带你从基本图形引擎出发，介绍敌人、射击和碰撞检测，最后进行如开场画面和最高分排行榜等优化，以及一些整理和性能调整。\n\
    \n我们的游戏 73MP357 是真正的经典——Dave Thrall 1981 年 Atari 制作的*Tempest*的复刻版。我们也无法抗拒向 Jeff\
    \ Minter 为 Atari Jaguar 制作的惊人复刻版致敬。\n\n## 你需要什么\n\n-   FUZE BASIC V3\n-   [fuze.co.uk/getfuzebasic](fuze.co.uk/getfuzebasic)\n\
    -   73MP357PART1.fuze\n\n### 01 获取程序列表\n\n由于这是一个相当大的程序，我们将不会逐行输入。相反，你需要从 [FileSite.co.uk](FileSite.co.uk)\
    \ 或 [fuze.co.uk/tutorials/73MP357PART1.fuze](fuze.co.uk/tutorials/73MP357PART1.fuze)\
    \ 下载第一部分代码。\n\n随后，我们将审视每个部分并解释其工作原理。\n\n打开 FUZE BASIC，加载（按 F8）‘73MP357’，或直接将代码复制到编辑器中（按\
    \ F2 在编辑器和立即模式之间切换）。\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_74_0.png)\n\n\
    ### 02 运行代码\n\n在查看代码之前，让我们看看它做什么。按 F3 或在立即模式中输入 *run* 运行程序。你将看到两种核心类型的事件：星空背景、关卡以及，当然，玩家。你可以使用左右光标在关卡中移动玩家。\n\
    \n请注意，当你旋转时，游戏场地的视角会发生变化。这种特定效果来自 *Tempest 2000*，而非街机原版。\n\n好了，现在来看看代码。按 Esc 键停止程序，然后按\
    \ F2 调出编辑器。\n\n### 03 系统设置\n\n你会发现代码注释详尽，每个部分都以 *#* 和注释作为标题。\n\n我们的第一部分设置系统和变量。我们设置分辨率，并将\
    \ *updatemode* 设置为零，这样除了 *update* 命令外，其他任何操作都不会更新屏幕。在 FUZE BASIC 中，如果模式设置为 1 或\
    \ 2，那么 *print* 语句也会更新屏幕，这会使一切变慢。\n\n设置了三个变量数组来存储星星的角度、速度和距离。这些可以合并为一个数组，但分开写更容易阅读。\n\
    \n*while* 循环用随机位置的点、随机角度和速度填充星空背景数组。\n\n### 04 处理显示\n\n接下来是游戏场地关卡显示所需的变量。*radius*\
    \ 和 *radius2* 变量定义外环和内环，*vertices* 设置关卡被划分成的部分数量。最小为 4（正方形），最大可达 13。*gap* 变量决定了沿圆周的步长距离，以便玩家始终位于每个部分的中间位置。\n\
    \n## 完整代码列表\n\n**步骤 03**\n\n```\n# settings #####\nxs = 840\nyres = 640\nupdatemode\
    \ = 0\nsetmode( xs$ , ys$ )\n\n# variables for the star field effect\ndim stars(\
    \ 1000 )\ndim starsSpeed( 1000 )\ndim starsDist( 1000 )\nstarNum = 0\n```\n\n\
    **步骤 04**\n\n```\n# setup star field effect\nwhile starNum < 1000 cycle\n  stars(\
    \ starNum ) = rnd( 360 )\n  starsSpeed( starNum ) = rnd( 5 + 1 )\n  starsDist(\
    \ starNum ) = rnd( height )\n  starNum = starNum + 1\nrepeat\n\n# level drawing\
    \ variables\nx = 0\ny = 0\nx2 = 0\ny2 = 0\noldX = 0\noldY = 0\noldX2 = 0\noldY2\
    \ = 0\nangle = 0\nradius = $height / 2 - 50 // outer radius\nradius2 = $height\
    \ / 16 // inner radius\nvertices = rnd( 9 ) + 4 // nothing less than a square\n\
    gap = 360 / vertices // angle between vertices\n```\n\n**步骤 05**\n\n```\n# player\
    \ variables\npingL$ = gap / 2\npx = 0\npy = 0\nptrNum = 0\n\n# different centers\
    \ for the parallax effect\ncenterX = $width / 2 // center of close objects\ncenterY\
    \ = $height / 2\ncenterX2 = centerX // center of far objects\ncenterY2 = centerY\n\
    \nstarsCenterX = centerX // fixed center for the stars\nstarsCenterY = centerY\n\
    \n# movement variables\nmoveDelay = int( 80 / vertices ) // delay after moving\n\
    moveCount = 0\n```\n\n**步骤 06**\n\n```\nloop\ncl$c\n\n# movement input\nif scankeyboard(\
    \ $rangrid$ ) then\n  if moveCount = 0 then\n    pingL$ = pingL$ + gap\n    moveCount\
    \ = moveDelay\n    if pingL$ > 360 then\n      pingL$ = gap / 2\n  endif\nendif\n\
    ```\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_74_1.png)\n\n## 完整代码列表\n\n**步骤\
    \ 06**\n\n```\n   end if\n   if scankeyb$ord(scankeyb) then\n     if moveCount\
    \ = 0 then\n       pAngle = pAngle - gap\n       moveCount = moveToCount\n   \
    \    if pAngle < 0 then\n         pAngle = 360 - ( gap / 2 )\n       end if\n\
    \     end if\n   end if\n\nStep 07\n   # set max particle effects based on resolution\n\
    \   maxStars = height / 5\n\n   colour = white\n   while starNum < maxStars cycle\n\
    \     # calculate star positions using expanding or\n     # contracting circles\n\
    \     starX = starsDist(starNum) * cos( stars(starNum) )\n     starX = starsCenterX\
    \ + starX\n     starY = starsDist(starNum) * sin( stars(starNum) )\n     starY\
    \ = starsCenterY + starY\n     starsDist(starNum) = starsDist(starNum) + starsSpeed(starNum)\n\
    \nStep 08\n     # reset position if offscreen\n     if starX < 0 then\n      \
    \ starsDist( starNum ) = rnd( 15 ) + 5\n     end if\n     if starX > gwidth then\n\
    \       starsDist( starNum ) = rnd( 15 ) + 5\n     end if\n     if starY < 0 then\n\
    \       starsDist( starNum ) = rnd( 15 ) + 5\n     end if\n     if starY > gheight\
    \ then\n       starsDist( starNum ) = rnd( 15 ) + 5\n     end if\n\n     plot(\
    \ starX, starY )\n     starNum = starNum + 1\n   repeat\n   starNum = 0\n\nStep\
    \ 09\n   # Draw the level by looping & drawing a segment at a time.\n   colour\
    \ = blue\n   while angle < 360 cycle\n     x = radius * cos( angle )\n     x =\
    \ centerX + x\n     y = radius * sin( angle )\n     y = centerY + y\n     x2 =\
    \ radius2 * cos( angle )\n     x2 = centerX2 + x2\n     y2 = radius2 * sin( angle\
    \ )\n     y2 = centerY2 + y2\n     line( x, y, x2, y2 )\n     line( x, y, oldX,\
    \ oldY )\n     line( x2, y2, oldX2, oldY2 )\n     oldX = x\n     oldY = y\n  \
    \   oldX2 = x2\n     oldY2 = y2\n     angle = angle + gap\n   repeat\n```\n\n\
    ### 05 玩家变量\n\n需要几个玩家变量来确定屏幕上的位置及其相对于关卡的位置。\n\n使用了三个中心 X 和 Y 坐标：两个用于关卡的移动中心和一个用于星空背景的固定中心。移动中心在稍后会显得更有意义，但正是靠它们我们才拥有流畅的透视效果。\n\
    \n**moveDelay** 变量（80 除以部分数，即 **vertices**）用于保持玩家移动的一致性，无论关卡有多少部分。\n\n### 06 消除闪烁\n\
    \n现在进入主 **loop**。`cls2` 语句至关重要，且与更标准的 `cls` 版本非常不同：`cls2` 清除帧缓冲区内存；这是一个独立的屏幕内存，所有内容首先绘制于此。当你发出\
    \ `update` 语句时，帧缓冲区会被复制到主屏幕内存。`cls` 版本仅清除所有内容，因此会产生大量闪烁。`cls2` 和 `update` 确保了无闪烁的更新，这对游戏至关重要。\n\
    \n接下来检查玩家键盘控制。如果按下右光标，玩家角度增加 **gap** 的量（这是到下一个部分中心的距离）。当然，左光标执行相反操作。\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_75_0.png)\n\
    \n### 07 定位星星\n\n然后我们计算星星的位置——即每一颗星星！星星的数量根据显示分辨率进行调整。\n\n选择 While 并启动一个循环来遍历星星。每颗星星都是圆周上的一个位置。因此，圆的半径决定了星星与中心的距离。我们取距中心的距离\
    \ **starsDist(starNum)**，并乘以角度的余弦值 **stars(starNum)**。然后将其加到中心位置 **starsCenterX**\
    \ 上，得到新的 starX 位置。starY 位置相同，但使用正弦值。\n\n### 08 检查星星移动\n\n我们检查星星是否离开显示区域，如果是，则将其重置回中心加一个小偏移，因为我们不希望它们都从正中心出现。\n\
    \n最后，使用 **plot(starX, starY)** 绘制星星，并重复 **while** 循环，直到所有星星都被更新并绘制在星空背景上。\n\n\
    ### 09 制作关卡\n\n转到关卡本身。每个片段逐个绘制。第一个片段的第一条线具有内圈和外圈的 X 和 Y 坐标。下一条线 aloi（再次，从中心到外缘）经过计算，并绘制从旧位置到新位置的两条连接线。\n\
    \n"
