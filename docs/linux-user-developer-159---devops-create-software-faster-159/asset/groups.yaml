    \n哈希表是计算和编程语言的关键组成部分；它们几乎在任何编程语言中得到支持，包括 AWK。严格来说，哈希表是一种存储一个或多个键值对的数据结构。哈希表使用哈希函数计算到桶或槽数组的索引，从中可以发现正确的值。理想情况下，如果拥有所需数量的桶，哈希函数会将每个键分配到唯一的桶中。如您所见，这种情况很少发生。在实践中，多个键可能会哈希到同一个桶中。哈希表的最糟糕的限制是，一旦定义了哈希函数和桶的数量，这两个属性都不能在不重建整个哈希表的情况下更改。因此，为了使哈希表更快的最佳方法是增加桶的数量，并确保哈希函数使用所有桶！这里要解决的假设问题是确定一个单词是否可以在字典中找到——这是一个必须快速执行的操作。\n\
    \n所有 C 程序都将按如下方式编译：\n`$ gcc -Wall programName.c -o programName`\n\n# 理论部分\n\n\
    哈希表最重要的单一特征是哈希函数使用的桶数量。第二个最重要的特征是哈希函数本身。哈希函数最关键的特性是它应该产生均匀的哈希值分布，因为拥有未使用的桶或桶基数之间的巨大差异（见第\
    \ 52 页图像）效率低下。拥有 n 个键和 k 个桶意味着搜索速度从线性搜索的 O(n) 变为 O(n/k)。虽然改进看起来可能很小，但你应该意识到，对于一个只有\
    \ 30 个桶的哈希数组，搜索时间将小 30 倍！下一张图展示了一个简单但完全具有代表性的哈希表。它唯一的问题是它有一个选择不良的哈希函数，该函数不会返回填充所有可用桶的哈希值——如您所见，一半的桶根本没有被使用！如果您知道取模运算符的作用，可以通过在哈希函数中使用模\
    \ 10 而不是模 5 轻松修复此问题。\n\n哈希函数必须一致地工作并对相同的键输出相同的哈希值，否则将不可能找到您想要的信息。当两个键哈希到同一个索引时，就会发生冲突——这是一种不寻常的情况。有许多方法可以处理冲突。\n\
    \n一个好的解决方案是使用链地址法（separate chaining）：哈希表是指向器的数组，每个指向器指向具有相同哈希值的下一个键。当发生冲突时，该键将以常数时间插入到链接列表的头部。现在的问题是，当你必须搜索给定键的哈希值时，你必须搜索整个链接列表以查找该键。在最坏的情况下，你可能需要遍历整个链接列表；这是链接列表应该适度小，从而提高了对大量桶的需求的主要原因。如您所见，解决冲突涉及某种线性搜索，这在设计上可能会很慢。因此，拥有一个尽可能最小化冲突的哈希函数非常重要。其他解决冲突的技术包括开放寻址、Robin\
    \ Hood 哈希和 2-choice 哈希。\n\n# 哈希函数\n\n由于哈希函数将在与哈希表的每次交互中一直使用，哈希函数快速运行非常重要。请注意，设计不良且实现不佳的哈希函数可能会使许多桶未使用，这不仅使查找过程变慢，而且是对资源的严重浪费。避免这种情况的最佳方法是尽可能经常检查桶的基数，以测试整个实现的效率。\n\
    \n在最坏的情况下，如果哈希函数将所有元素放入同一个桶中，哈希表实际上是一个带有额外开销的链接列表——即执行哈希函数——而普通的链接列表因此会是更快的解决方案。\n\
    \n# 删除、插入和查找\n\n哈希表的主要操作是插入、删除和查找。您使用哈希值来确定哈希表中键的存储位置。稍后，您使用相同的哈希函数来确定在哈希表中搜索给定键的位置。\n\
    \n一旦哈希表被填充，搜索与执行插入相同。您对正在搜索的数据进行哈希，前往数组中的那个位置，查看从该位置开始的列表，看看您要找的是否可以在链接列表中找到。步骤数为\
    \ O(1)。哈希表的最坏情况搜索时间是 O(n)——这可能发生在所有键存储在同一个桶中时！然而，发生这种情况的概率很小，因此最好和平均情况都被认为是 O(1)。\n\
    \n您可以在互联网上和阅读好书上找到许多哈希表实现。棘手的地方在于使用正确数量的桶并选择高效的哈希函数，使值尽可能均匀分布而无偏。非均匀分布肯定会增加冲突数量，进而如上图所示降低整个哈希表的速度。\n\
    \n# 在 C 中实现哈希表\n\n以下列表展示了 hashTable.c 的 C 代码，它使用一个朴素的哈希函数。hashTable.c 的目的是理解哈希表如何工作；这可以通过检查其主要要点来实现——完全注释版本可以在本教程的\
    \ FileSilo.co.uk 资源中找到。\n\n"
