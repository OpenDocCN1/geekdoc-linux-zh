    \n现在你可以使用 Python 代码来控制机器人，你可以与许多其他模块进行交互。你可以附加一个 Makey Makey (`makeymakey.com`)\
    \ 并使用一些勺子和叉子来控制你的机器人。你甚至可以尝试安装并使用 Tweepy 模块（一个 Twitter API），让机器人响应传入的推文。\n\n##\
    \ 完整代码列表\n\n```python\nimport random, pygame, sys\nfrom pygame.locals import *\n\
