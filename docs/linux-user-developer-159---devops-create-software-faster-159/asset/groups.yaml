    # Farewell, ext3


    The year was 2001. Linux version 2.6 was still a future aspiration, and kernels
    came in an odd/even cycle of multi-year, odd-numbered ‘development series’ releases,
    followed eventually by a new ‘stable series’. This was long before Git (Linux
    had not become frustrated enough to write it yet), and before the contemporary
    two-month development cycle with a merge window that has obviated the need for
    separate development series kernels. In 2001, a major new kernel feature could
    languish for years in obscurity waiting to land in the next stable series kernel.
    It was, then, with some considerable relief that ext3 support was added to Linux
    2.4.15 without waiting for the (2003) release of the first 2.6.0) kernel.


    Ext3 brought something new to Linux that it had not had before: mainline support
    for filesystem journaling without applying many ‘out of tree’ (unofficial) patches.
    Journaled filesystems are more resilient against power failures because they separate
    their actions into transactions that are first written to a ‘journal’ before the
    on-disk filesystem data structures are updated. If power fails during this process,
    the filesystem has enough internal state to recover its metadata without forcing
    the user to run a special filesystem checking program. To end users, this means
    that a power failure during filesystem activity that is to say, nearly any time)
    need not result in a lengthy use of the fsck (filesystem check) utility.


    Developers found the occasional need to run fsck frustrating, while consumers
    could be forgiven for being highly confused about the scary sounding messages
    printed on their screen about ‘inconsistent1’ filesystem state. Indeed, this author
    recalls in his very early days of Linux use (several decades ago), being so terrified
    by such confusing messages (in a time before Google that he wound up reinstalling
    a system after an unclean shutdown rather than figure out fsck. Like many, then,
    it was a relief to hear about the work that Stephen Tweedie had done to add journal
    support to the venerable ext2 (extended second) filesystem.


    Journaling was not a new concept. At the time of the introduction of ext3 into
    Linux, Microsoft Windows users had the benefit of built-in support for NTFS


    (which was arguably far more sophisticated) for some years. Yet unlike NTFS (which
    had an awkward upgrade path from FAT32 for users), the design of what became ext3
