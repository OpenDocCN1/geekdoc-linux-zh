    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_5_0.png)


    ### 新大会填补实体峰会停办留下的空白


    Canonical 宣布，由于社区抱怨缺乏面对面的聚会，且 Ubuntu 开发者峰会已从实体聚会转变为虚拟会议，他们将于 2016 年 1 月举办一场新的实体活动——UbuCon
    峰会。


    该公司解释说，UbuCon 峰会建立在志愿者组织的本地 UbuCon 活动的成功经验之上，并在此基础上进行扩展，以位于加利福尼亚州帕萨迪纳举办 UbuCon
    SCALE 活动的现有团队为基础。


    Canonical 的 David Planella 解释道：“在与社区委员会的讨论中，以及在几个月前一些 Ubuntu 团队成员参加社区领导层峰会之后，我们确定社区面临的一个挑战是，在
    UDS 时代结束后，缺乏一个全球性的面对面聚会机会。”


    “尽管地区性的大会仍在蓬勃发展，但我们当时得出的一个结论是，我们需要一种方式，在更大的范围内将大家聚集在一起，以补充 UbuCon 的网络结构：即峰会。”


    首届 UbuCon 峰会将是一个为期两天的活动，结构上既包括有组织的会议，也包括并行的临时无会议。与会者可以选择两个方向：用户方向，重点介绍 Ubuntu
    的日常使用以及如何成为这款流行 Linux 发行版普及的倡导者；以及开发者方向，将提供包括应用开发、物联网（IoT）和云主题在内的技术会议，此外还有 Canonical
    旨在在其 Ubuntu 移动生态系统中构建的新融合功能。


    UbuCon 峰会将是自 Ubuntu 开发者峰会于 2013 年从每年两次的实体活动转为通过 Google Hangouts 服务举办的虚拟活动以来，Ubuntu
    开发者和用户的首次大规模官方聚会。为了纪念这一时刻，Canonical 创始人 Mark Shuttleworth 已被确认为主旨演讲嘉宾，更多关于日程安排的细节将在未来几周内公布。


    “峰会是传统 UbuCon 的扩展：内容更丰富，规模更大，”Planella 声称。“但同时保持了草根精神和社区驱动的组织形式，这正是这些活动成功的原因。总而言之，想法是提供一个空间来展示、了解和讨论最新的
    Ubuntu 技术，同时也关注社区新兴和充满活力的部分，并讨论我们作为项目面临的挑战（和机遇！）。”


    UbuCon 峰会将于 2016 年 1 月 21 日至 22 日在帕萨迪纳会展中心举行，作为南加州 Linux 博览会（SCALE）的一部分。组织者包括
    Ubuntu 加州 LoCo 小组的 Richard Gaskin 和 Nathan Haines，他们曾深度参与之前由 SCALE 承办的 UbuCon
    活动，以及 SCALE 本身的 Gareth Greenaway 和 Ilan Rabinovitch。


    有关该活动的更多信息可在官方 UbuCon 网站 ubucon.org 或通过 SCALE 网站 socallinuxexpo.org 获取。


    > “UbuCon 峰会建立在志愿者组织的本地 UbuCon 活动的成功之上，并将其规模扩大”


    # 自动化

    ## 红帽收购 Ansible 技术

    ### 增强混合云部署和管理


    红帽（Red Hat）宣布收购 Ansible，该公司以其无代理自动化产品而闻名，旨在使其红帽 Linux 平台成为混合云用途的首选方案。


    虽然收购背后的财务细节尚未正式披露，但行业消息来源称，该交易对公司的估值约为 1 亿美元，红帽表示，由于其新的子公司，预计下一财政年度的运营费用将增加约 600
    万美元。


    红帽云管理战略总经理 Alessandro Perilli 在评论该交易时表示：“我们的客户已经在使用各种 IT 自动化工具配合红帽解决方案。通过这次收购，我们希望提供这种类型的集成，通过世界级的红帽支持和认证，使开源在企业中可消费，正如我们对
    OpenStack 和产品组合中其他所有产品所做的那样。”


    联合创始人兼首席执行官 Srid Zouani 在评论红帽收购 Ansible（该公司成立于 2013 年，Zouani 曾在此工作十年）时表示：“我们很高兴红帽，一家全球开源领导者，选择
    Ansible 来应对 IT 自动化和系统管理的未来。”“这是对 Ansible 的简洁性、企业客户基础和强大社区的有力验证，其在企业 IT 自动化领域，从计算机到网络，再到云和容器，正在赢得市场。”


    “Ansible 是 IT 自动化和 DevOps 的明确领导者，并帮助红帽在实现无摩擦 IT 管理这一目标上迈出重大一步，推动 100% 开源的创新，构建在开放管理平台之上，并坚定不移地通过易用性和自动化来降低成本和复杂性。我非常高兴
    Ansible 加入红帽，帮助我们扩展这一承诺。”


    自 2013 年作为 AnsibleWorks 成立以来，Ansible 的软件已发展到拥有 1,200 名贡献者，被誉为 GitHub 上最受欢迎的开源自动化工具，并有报道称
    20% 的财富 100 强企业正在与该公司合作。


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_6_0.png)


    # 五大亮点

    ## Unity 8 功能 – 技术预览


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_6_1.png)


    上图：尽管 Unity 8 未能进入 Ubuntu 15.10，但仍有一个技术预览版


    ### 1 Unity 8 技术


    Canonical 新的桌面环境 Unity 8 未能及时准备好以配合 Ubuntu 15.10 的发布。然而，情况并不糟糕，因为它正以技术预览的形式提供，并承诺用户可以尝试使用，如果在遇到任何问题时，可以明显地回退到默认的
    Unity 7。


    ### 2 Snapcraft 工具


    Snapcraft 专为与嵌入式和云为核心的 Ubuntu Core 版本配合使用而设计，旨在使 Snappy 包的构建对用户来说尽可能简单，无论是从头开始还是利用现有的
    deb 包。


    ### 3 Ubuntu 手机更新


    运行 Ubuntu 手机版本的用户会高兴地发现，他们不再需要手动更新操作系统，更新现在会自动并直接交付到设备。就像竞争对手的移动平台一样——这是该操作系统的一大步。


    ### 4 OpenStack Autopilot


    Ubuntu 15.10 见证了 OpenStack Autopilot 的正式可用，旨在使基于 Ubuntu 的 OpenStack 云的部署和管理尽可能简单。它除了支持主要版本之间的原位升级外，还得益于
    OpenStack 互操作性实验室的输入。


    ### 5 LXD 默认捆绑


    机器容器 hypervisor LXD 现在默认包含在 Ubuntu Server 中，使任何 Ubuntu Server 安装都能托管数百个其他 Linux
    客户机容器，而无需额外软件。如果这还不够让你想要更多，还有一个新的 RESTful API 技术预览版也可用。


