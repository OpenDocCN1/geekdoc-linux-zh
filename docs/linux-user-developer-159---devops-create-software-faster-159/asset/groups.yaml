    那是 2001 年。Linux 2.6 版本仍是一种未来的愿景，内核遵循奇偶周期：多年一次的奇数版本“开发系列”发布，最终紧随其后的是新的“稳定系列”。那时远早于
    Git（Linux 社区当时尚未因挫败感而决定创建它），也早于当今的双月开发周期——该周期设有合并窗口，已使得单独的开发系列内核不再必要。在 2001 年，一项重要的新内核特性可能会在默默无闻中蹉跎数年，等待进入下一个稳定系列内核。因此，当
    ext3 支持被加入 Linux 2.4.15，而无需等待首个 2.6.0 内核（于 2003 年发布）时，人们感到如释重负。


    Ext3 为 Linux 带来了前所未有的功能：主线对文件系统日志记录的支持，无需应用许多“树外”（非官方）补丁。日志记录的文件系统对电源故障具有更强的韧性，因为它们将操作拆分为事务，这些事务首先写入“日志”，然后再更新磁盘上的文件系统数据结构。如果在此过程中发生电源故障，文件系统拥有足够的内部状态来恢复其元数据，而无需用户运行特殊的文件系统检查程序。对于终端用户而言，这意味着在文件系统活动期间（换句话说，几乎任何时间）发生电源故障，都不必导致长时间的
    fsck（文件系统检查）工具使用。


    开发者偶尔发现需要运行 fsck 令人沮丧，而消费者因屏幕上打印的关于“不一致”文件系统状态的惊悚信息而深感困惑也是可以理解的。事实上，本文作者回忆在他非常早使用
    Linux 的日子（几代人之前，即很久以前），在 Google 出现之前，他被如此混乱的信息吓到，最终在一次非正常关机后重新安装了系统，而不是去研究 fsck。因此，和许多人一样，得知
    Stephen Tweedie 所做的工作——为久经考验的 ext2（扩展第二版）文件系统添加日志支持——令人宽慰。


    日志记录并非新概念。在 ext3 引入 Linux 之时，Microsoft Windows 用户在几年前就已经受益于内置的 NTFS 支持（可以说 NTFS
    要复杂得多）。但与 NTFS（用户从 FAT32 升级的路径很棘手）不同，演变为 ext3 的设计是有意识地基于演进式方法。彻底放弃 ext2 的设计可能会更高效（并跟随他人路径，例如来自
    SGI Ixux 的 XFS，后者最终在 2004 年加入 Linux），但 ext3 具有明显的优势，即支持现有 ext2 文件系统的就地升级。


    新文件系统为现有的 ext2 文件系统添加了日志，事实上，在一段时间内，系统可以通过禁用日志（将其视为 ext2）启动，以便混合使用较旧和较新的内核。最终，ext3
    仅有的 ext2 血统也追上了它，2006 年，Ted Ts’o（早已接任 ext3 维护者）引入了最终成为 ext4 的东西。最终，ext4 驱动获得了对较旧
    ext3 文件系统的支持（而不是需要较旧的 ext3 驱动）。这就是为什么在 2015 年，较旧的 ext3 驱动最终被移除。然而，那些仍在使用 ext3
