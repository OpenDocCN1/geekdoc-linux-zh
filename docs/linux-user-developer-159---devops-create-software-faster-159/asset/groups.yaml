    \ a C implementation that uses a good hash function with a large number of buckets\
    \ can beat the Perl implementation. Nevertheless, the Perl implementation is pretty\
    \ fast. On the other hand, once again you can understand that a small number of\
    \ buckets can destroy an otherwise good hash function.\n\n#### The benefit of\
    \ hash tables\n\nThe main reason for using hash tables is their ability to keep\
    \ the average cost for a lookup independent of the number of elements stored in\
    \ the table. If insertions and deletions are not enabled, which is not a rare\
    \ scenario, it is relatively easy to decrease the average lookup cost by carefully\
    \ choosing the hash function, the bucket table size and the internal data structures\
    \ used. Hash tables also perform well when the total number of entries is known\
    \ in advance and the bucket array can be allocated once with the optimum size,\
    \ without ever needing to be resized.\n\nHash tables have disadvantages as well.\
    \ First of all, they are not so good at keeping data sorted. Therefore it is not\
    \ efficient to use a hash table if you need your data to be sorted. Hash tables\
    \ are not optimal when the number of entries is very small, because despite the\
    \ fact that operations on a hash table take constant time on average, the cost\
    \ of a good hash function can be significantly higher than the inner loop of the\
    \ lookup algorithm for a sequential list or search tree. For certain string-processing\
    \ applications, hash tables may be less efficient than trees or finite automata;\
    \ however, both trees and finite automata have a more complicated way of operating.\
    \ Although the average cost per operation is constant and fairly small, the cost\
    \ of a single operation may be fairly high. In particular, if the hash table uses\
    \ dynamic resizing, inserting or deleting a key may once in a while take time\
    \ proportional to the number of entries – this may be a serious drawback in applications\
    \ where you want to get results fast. Hash tables also become quite inefficient\
    \ when there are many collisions; the difficulty is that you might not know in\
    \ advance the number of collisions you are going to have, particularly when inserting\
    \ dynamic unknown data.\n\n**Right** The far-left column shows how slow a hash\
    \ function without enough buckets can be.\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_53_0.png)\n"
  mdcn: "\n## 教程：哈希表\n\n**右** 在这里，我们看到未使用的桶（bucket）以及桶基数（bucket cardinality）的巨大差异——这是低效的。\n\
    \n![](img/0fc17bd4c29dc437e3ac28a53f7559db_51_0.png)\n\n```c\n#include <stdio.h>\n\
    #include <stdlib.h>\n#include <string.h>\n#include <ctype.h>\n\n#define TABLESIZE\
    \ 1001\n\ntypedef struct node {\n    char *data;\n    struct node *next;\n} node;\n\
    \nunsigned int hash(const char *str, int tablesize) {\n    int value;\n    value\
    \ = toupper(str[0]) - 'A';\n    return value % tablesize;\n}\n\nstatic int lookup(node\
    \ *table[], const char *key) {\n    unsigned int index = hash(key, TABLESIZE);\n\
    \    const node *it = table[index];\n\n    while (it != NULL && strcmp(it->data,\
    \ key) != 0)\n    {\n        it = it->next;\n    }\n    return it != NULL;\n}\n\
    \nint insert(node *table[], char *key)\n{\n    if (!lookup(table, key))\n    {\n\
    \        unsigned int index = hash(key, TABLESIZE);\n        node *new_node =\
    \ malloc(sizeof *new_node);\n\n        if (new_node == NULL)\n            return\
    \ 0;\n        new_node->data = malloc(strlen(key)+1);\n\n        if (new_node->data\
    \ == NULL)\n            return 0;\n\n        strcpy(new_node->data, key);\n  \
    \      new_node->next = table[index];\n        table[index] = new_node;\n    \
    \    return 1;\n    }\n    return 0;\n}\n\nint populate_hash(node *table[], FILE\
    \ *file)\n{\n    char word[50];\n    char c;\n\n    do {\n        c = fscanf(file,\
    \ \"%s\", word);\n        size_t len = strlen(word) - 1;\n        if (word[0]\
    \ == '^')\n            word[0] = '@';\n        insert(table, word);\n    } while\
    \ (c != EOF);\n    return 1;\n}\n```\n\n### 链表的工作原理\n\n哈希表使用链表来存储数据。必须使用链表吗？不，但链表有很多优势。链表非常擅长顺序查找，特别是当与\
    \ C 语言指针配合使用时：它们是一种简单而优雅的数据结构，可以动态增长，除了少数几个指针外不需要任何额外空间，并且在插入操作方面表现良好。最后，只要你不是经常从哈希表中删除元素，它们就不需要太多的维护工作。\n\
    \n然而，链表也有缺点。如果链表包含许多元素，到达列表的最后一个元素可能会非常慢。此外，当处理包含大量元素的数据时，链表也会非常慢：无论如何，包含 100,000\
    \ 个节点的链表都会很慢！\n\n即将推出的教程将更深入地讨论链表。目前，请查看 `linkedlist.c` 以获取更多信息。你会发现 `linkedlist.c`\
    \ 中的代码与 `hashTable.c` 中的代码类似。\n\n```c\nvoid printHashTable(node *table[], const\
    \ unsigned int tablesize)\n{\n    node *e;\n    int i;\n    int length = tablesize;\n\
    \    printf(\"Printing a hash table with %d buckets\\n\", length);\n    for(i\
    \ = 0; i<length; i++)\n    {\n        e = table[i];\n        int n = 0;\n    \
    \    if (e == NULL)\n            printf(\"%4d| bucket %d\\n\", i);\n        else\n\
    \        {\n            while( e != NULL )\n            {\n                n++;\n\
    \                e = e->next;\n            }\n            printf(\"%4d| has %d\
    \ key\\n\", i, n);\n        }\n    }\n}\n\nint main(int argc, char **argv)\n{\n\
    \    char word[50];\n    char c;\n    int found = 0;\n    int notFound = 0;\n\
    \    node *table[TABLESIZE] = {0};\n    FILE *INPUT;\n    INPUT = fopen(\"INPUT\"\
    , \"r\");\n    populate_hash(table, INPUT);\n    fclose(INPUT);\n    printf(\"\
    You can now use the Hash Table!\\n\");\n\n    int line = 0;\n    FILE *CHECK;\n\
    \    CHECK = fopen(\"CHECK\", \"r\");\n\n    do {\n        c = fscanf(CHECK, \"\
    %s\", word);\n        size_t ln = strlen(word) - 1;\n        if (word[ln] == '\\\
    n')\n            word[ln] = '\\0';\n        line++;\n        if (lookup(table,\
    \ word))\n            found++;\n        else\n            notFound++;\n    } while\
    \ (c != EOF);\n\n    printf(\"Found %d words in the hash table!\\n\", found);\n\
    \    printf(\"Not found %d words in the hash table\\n\", notFound);\n\n    fclose(CHECK);\n\
    \    return 0;\n}\n```\n\nC 语言代码并不难，但在继续之前，你必须确保完全理解它。节点结构在程序开头定义，包含两个字段：数据字段——单个值——以及指向链表中下一个节点的指针。你可以拥有任意多个数据字段；唯一必需的字段是指向链表下一个节点的指针。除了强制性的\
    \ `main()` 函数外，还有五个其他函数。\n\n在使用名为 **INPUT** 的文本文件填充哈希表后，`main()` 通过检查 **CHECK**\
    \ 文本文件中的单词是否存在于哈希表中，来检查哈希表的性能。唯一未实现的操作是删除键，因为删除键在字典中是一个非常罕见的操作。`hash()` 函数如其名称所示，执行哈希计算，是整个程序中最重要的函数。`lookup()`\
    \ 函数检查值是否已经存在于哈希表中。插入和删除操作都需要 `lookup()` 函数：前者为了避免重复，后者为了确保你试图删除的值确实存在于哈希表中。`insert()`\
    \ 函数根据哈希函数的返回值找到正确的桶，并将新值插入到相应链表的前面，前提是该值尚未存在。`populate_hash()` 函数读取包含值的文本文件，并将它们插入到哈希表中。\n\
    \n最后一个函数，`printHashTable()`，是一个实用函数，显示每个桶的基数。旁边的图表展示了给定输入和给定桶数量的哈希表中 26 个桶中每个桶的基数，这是借助\
    \ `printHashTable()` 函数生成的。使用的输入文件包含大约 100,000 个唯一单词。\n\n### 在 Perl 中实现哈希表\n\n\
    Perl 内置了对哈希表的支持，哈希表也被称为字典。你无法控制由 Perl 本身控制的哈希函数。此外，每个元素（值）都有一个唯一的键，即元素本身。Perl\
    \ 哈希表实现的问题在于，你对过程以及 Perl 处理字典的方式没有任何控制。然而，Perl 方式有很多优势，包括简单性，以及更容易的查找、插入和删除操作。Perl\
    \ 哈希表实现的代码可以在你的 FileSilo.co.uk 资源中找到：`hashTable.pl`。\n\nPerl 实现的主要问题是它比 C 语言版本需要更多的内存，这主要是由于字典结构中每个单词都有自己唯一的位置。\n\
    \n然而，Perl 并不是唯一原生支持哈希表的编程语言。Ruby、Python、PHP、AWK 和许多其他语言都支持哈希表，哈希表也被称为关联数组。此类实现的主要缺点是，如果不使用辅助结构，几乎不可能保持数据有序；但是，使用辅助结构来支持哈希表而不单独使用辅助结构有什么意义呢？\n\
    \n如果保持数据有序不是你觉得特别需要的东西，那么关联数组可能是以扁平方式存储数据的理想解决方案——你将拥有与你数据基数同样多的桶，而不需要多个链表来存储数据。正如我们之前提到的，你只需相信你的编程语言使用高效的方法执行查找和插入，这并不总是坏事——尤其是当你考虑到编程语言内部通常在发布新版本时得到改进这一事实时。\n\
    \n#### 测试速度\n\n现在让我们比较 C 和 Perl 实现的速度。如页面底部的图表所示，使用良好哈希函数且具有大量桶的 C 实现可以击败 Perl\
    \ 实现。尽管如此，Perl 实现仍然相当快。另一方面，再次可以理解，少量桶可以破坏原本良好的哈希函数。\n\n#### 哈希表的优势\n\n使用哈希表的主要原因是它们能够将查找的平均成本保持在与存储在表中的元素数量无关的水平。如果未启用插入和删除（这并非罕见的场景），通过仔细选择哈希函数、桶表大小以及使用的内部数据结构，相对容易降低平均查找成本。当总数已知且桶数组可以一次性分配最优大小而无需调整大小时，哈希表也表现出色。\n\
    \n哈希表也有缺点。首先，它们在保持数据有序方面并不擅长。因此，如果你需要数据有序，使用哈希表就不太高效。当条目数量非常少时，哈希表也不是最优的，因为尽管哈希表操作平均取常数时间，但良好哈希函数的成本可能显著高于顺序列表或搜索树查找算法的内部循环。对于某些字符串处理应用程序，哈希表可能比树或有限自动机效率低；然而，树和有限自动机的操作方式更复杂。尽管每次操作的平均成本是常数且相当小，但单次操作的成本可能相当高。特别是，如果哈希表使用动态调整大小，插入或删除键偶尔可能需要与条目数成正比的时间——这可能是希望快速获得结果的应用中的一个严重缺陷。当存在许多冲突时，哈希表也会变得相当低效；难点在于你可能无法预先知道将有多少冲突，特别是当插入动态未知数据时。\n\
    \n**右** 最左列显示，如果没有足够多的桶，哈希函数可能有多慢。\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_53_0.png)\n\
    \n"
