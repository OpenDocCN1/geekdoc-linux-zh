    With that completed, it’s time to enlist the *second form*. Click **File**/**New**/**File
    and select the template `Gtk+Window`. Set the class `rStudio` ‘AboutWindow’ and
    click **New**, in order to add the resource to the project. In the next step,
    remove the *namespace* declaration from the code-behind file.


    Run the program in *its current state* to **tear your eyes** on the *second empty
    dialog* – it’s just **waiting** for your creativity!


    names to the widgets. The next steps assume you’ve got the same structure and
