    # Tron PiDesk\n\nFrederick Vandenbosch 使用触摸传感器、无线充电板和可伸缩计算机改造了他的书桌\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_60_1.png)\n\
    \n## 请介绍一下你参加的比赛\n\nSci Fi Your Pi 是由 element14 与树莓派基金会联合发起的一项挑战。目标是创建一个以树莓派为中心的科幻项目，并且必须与某部科幻电影有一定的关联。挑战赛有\
    \ 25 名入围者，我们需要在大约 18 周内构建我们的项目。\n\n## 你选择了哪部电影？\n\n我先有了项目的想法，然后才必须将其与一部电影联系起来，所以在某种程度上我必须逆向思考。我将其与《电子世界》（Tron）联系起来，是因为不同的方面：你有灯光，你有嵌入\
    \ LED 或灯条的服装，这就是为什么我在桌面表面有这种图案，试图代表那种感觉。你还有一张桌子，用于在虚拟世界和现实世界之间传输，这也有一台嵌入式计算机。\n\
    \n## 你的桌子上有哪些功能？\n\n这个想法是使其尽可能具有未来感，并组合多种功能。桌子必须看起来像普通的书桌，但一旦你开始在桌子右侧上方悬停你的手，你就会有嵌入的电容式触摸传感器，它们可以触发某些操作。例如，主要动作是让计算机从桌子上弹出，这将触发一些灯光以让用户知道操作正在进行。当计算机从桌子上升起时，图案会以绿色亮起。当你决定关闭计算机时，发生相反的情况——屏幕会降低到桌子内，你会看到一个红色的移动图案。我决定使用绿色和红色，因为它们是典型的开始和停止颜色。当你的手悬停在电容式触摸传感器上时，还会触发基于存储在树莓派上的\
    \ MP3 文件的一些音效。\n\n我嵌入的其他功能之一是桌子表面的无线充电器——我使用它来点亮一盏灯，该灯基于玻璃球和放入特定容器中的 NeoPixels，但你也可以用它来给你的手机充电。\n\
    \n## 电容式触摸控制仅弹出和收回显示屏吗？\n\n我设想了五个按钮，但我只使用两个。不过，Pi 上有一个 Python 脚本，等待这五个按钮中的任何输入，并且可以触发任何操作。如果我想到有趣的想法，我肯定会扩展该程序。\n\
    \n## 你是如何建造桌子本身的？\n\n我知道我想在桌子表面内部嵌入东西，因为我希望它看起来像普通的书桌。我使用了一张 Ikea 桌子——便宜的是中空的——所以我开始画出我想要的图案和一些存储空间，用于存放树莓派和无线充电器，然后我开始切割桌子的顶面。我移除了纸板结构，这给了我桌子高度内部的空间，这足以隐藏组件。对于传感器，因为我希望它们尽可能平坦，所以我使用导电油漆和铜胶带来制作连接，因此桌子的一侧和另一侧没有高度差。最后，我必须封闭一切，为此我使用了一大片\
    \ Plexi。我首先用纸卷纸的两层覆盖桌子，以隐藏组件并使其不可见，然后放上 Plexi 顶层，你就有了桌子的完整表面。灯足够亮，可以透过纸张发光，而电容式触摸传感器足够灵敏，只需将手放在\
    \ Plexi 上即可触发。\n\n## 你是否在桌子内部嵌入了扬声器用于音效？\n\n音频有两个部分：嵌入桌子的 Pi，它负责控制电机、灯光和音效，因此桌子内部有一个使用放大器分板器的小型扬声器来触发控制的音效。然后你有桌面计算机，它从桌子中滑出和滑入——这是一台单独的树莓派，配有单独的放大器和扬声器。\n\
    \n## 你是如何制作弹出显示屏的？\n\n我多年前有一台旧笔记本电脑，当它坏掉时，我决定回收电机的控制。我将想法基于 3D 打印机的 Z 轴，在那里你有螺纹杆，可以随后升高或降低平台。我采用了相同的原则，在桌子底部安装两个步进电机，配有螺纹杆，整个屏幕组件放置在该平台上。当步进电机被触发时，平台升高，导致整个框架从桌子上出来。为了引导这个框架，我使用了一些抽屉滑块，也是来自\
    \ Ikea 的。步进电机具有良好的扭矩，因此可以承受整个框架的重量，但速度有点是个问题。但最终结果表明，桌面计算机的启动时间与整个框架的升起时间完全相同。\n\
    \n## 项目中最具挑战性的部分是什么？\n\n我遇到了一个问题，即 LED 的控制影响了音频，反之亦然。最终我使用外部 USB 适配器来处理音频，使其不会影响\
    \ LED 的 GPIO 控制。时间限制迫使你想尽一切办法解决事情。因此，最具挑战性的部分确实是集成，一旦你开始把所有东西组合在一起并让事物相互交互。\n\n\
    **Frederick Vandenbosch** 白天是集成工程师，晚上是电子制作爱好者。他喜欢通过构建事物来学习主题并在过程中享受乐趣。并非所有构建都是成功的，但这是学习过程的一部分！\n\
    \n# 喜欢吗？\n\n如果你想看到 Frederick 更多的作品，请访问他的网站：[bit.ly/1XC8u8](bit.ly/1XC8u8)\n\n\
    其余的 Sci Fi Your Pi 参赛作品，包括一个真正的 T-ricoder，可以在这里找到：[bit.ly/1ekb8c](bit.ly/1ekb8c)\n\
    \n# 延伸阅读\n\n想过要组装自己的 Tron 桌子吗？这里有一段来自 Make 的 Bob Osgatt 的精彩木工视频，向你展示了如何制作带有嵌入式\
    \ LED 灯带的咖啡桌，这是一个很好的起点：[bit.ly/1WIWIW](bit.ly/1WIWIW)\n\n"
