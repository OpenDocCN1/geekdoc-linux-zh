    \ 59\n\n# **Wireless**\n\nA NeoPixel Ring shines through this magic lamp when\
    \ it is activated by the embedded Qi charger, which can also be used with mobiles.\n\
    \n# **Computer**\n\nThe display uses the Raspberry Pi 2, with a keyboard- and-mouse\
    \ combo hidden on the underside of the desk with a Velcro mount.\n\n# **Contactless**\n\
    \nFrederick made his own breakout board for the hover buttons, combining the Atmel\
    \ AT42QT1070 touch sensor with a PCB.\n\n# **Lights**\n\nThe LED strip shines\
    \ through the Plexi surface, and Frederick’s script alters the LED’s colour when\
    \ the computer is popping up or down.\n\n# **Components list**\n\n- 12V power\
    \ supply\n- 12V-to-5V DC-DC converter\n- 2 WiFi USB dongles\n- Desk Raspberry\
    \ Pi B+, USB sound card, 2 5V Class D amplifier, Garminot, 2 stepper motors, 2m\
    \ LED strip, capacitive touch sensor, 2 microswitches (on/off), mini speaker\n\
    - Computer Raspberry Pi 2, 2.5W Class D amplifier, laptop LCD display, LCD display\
    \ controller, 2 speakers\n- Magic lamp Qi wireless charger, Qi wireless receiver,\
    \ Adafruit NeoPixel Ring, Adafruit Trinket\n\n**Left** The magic behind the lamp\
    \ is a well-made base, picked to fit the NeoPixel Ring and the Qi receiver. When\
    \ the Qi circuit connects, the LEDs shine through a sphere.\n**Below** For the\
    \ capacitive touch buttons, copper tape was laid down and then Bare Conductive\
    \ paint was applied over the top.\n\n# My Pi project\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_60_0.png)\n\
    \n# Tron PiDesk\n\nFrederick Vandenbosch transforms his desk with touch sensors,\
    \ wireless charge pads and a retractable computer\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_60_1.png)\n\
    \n## Tell us about the competition that you entered\n\nSci Fi Your Pi was a challenge\
    \ launched by element14 in collaboration with the Raspberry Pi Foundation. The\
    \ goal was to create a sci-fi project centred around the Raspberry Pi, and it\
    \ had to have a certain relation to a sci-fi movie. There were 25 finalists for\
    \ the challenge and we had to build our projects in about 18 weeks.\n\n## Which\
    \ movie did you choose?\n\nI had the idea for the project first and then I had\
    \ to link it to a movie, so I had to reverse the thinking in that sense. I linked\
    \ it to Tron because of different aspects: You have the lights, you have the costumes\
    \ with embedded LEDs or light strips, and this is why I have this pattern in the\
    \ desk surface, to try to represent that. You also have the desk that is used\
    \ to transfer between the virtual world and the real world, which also has an\
    \ embedded computer.\n\n## What are the features on your desk?\n\nThe idea was\
    \ to make it as futuristic as possible and also combine multiple features. The\
    \ desk has to look like an ordinary desk, but once you start hovering your hand\
    \ over the right side of the desk, you have embedded capacitive touch sensors\
    \ which can trigger certain actions. For example, the main action is to make the\
    \ computer pop up off the desk, and this will then trigger some lights to let\
    \ the user know that an action is in progress. When the computer is rising up\
    \ of the desk you have the pattern light up in green. The reverse happens when\
    \ you decide to shut down the computer – the screen will lower into the desk and\
    \ you will have a moving pattern in red. I decided to use green and red because\
    \ they’re typical colours for starting and stopping. When you hover your hand\
    \ over the capacitive touch sensors, it also triggers some sound effects based\
    \ on MP3 files stored on the Raspberry Pi.\n\nOne of the other features that I’ve\
    \ embedded is a wireless charger into the desk’s surface – I use it to light up\
    \ a lamp, based on a glass ball and NeoPixels put into a certain container, but\
    \ you could also use it to charge your phone.\n\n## Do the capacitive touch controls\
    \ only pop up and retract the display?\n\nI have foreseen five buttons but I’m\
    \ only using two. But there is a Python script on the Pi waiting for any input\
    \ of those five buttons, and any action can be triggered. If I come up with an\
    \ interesting idea then I will definitely expand the program.\n\n## How did you\
    \ build the desk itself?\n\nI knew I wanted to embed things inside the desk’s\
    \ surface, because I wanted it to look like a normal desk. I used an Ikea desk\
    \ – the cheap ones are hollow – so I started drawing the pattern I wanted and\
    \ some space to store the Raspberry Pi and the wireless charger, and then I started\
    \ cutting into the top surface of the desk. I removed the cardboard structure,\
    \ which then gave me space inside the height of the desk, and this was sufficient\
    \ to hide components. For the sensors, because I wanted to keep them as flat as\
    \ possible, I used conductive paint and copper tape to make the connections, so\
    \ there’s no level difference between one side of the desk and the other. Finally,\
    \ I had to close everything up, and for that I used a big sheet of Plexi. I first\
    \ covered the desk with two layers of paper from a paper roll, to hide the components\
    \ and make it non-visible, and then by putting a top layer of Plexi you have a\
    \ full surface for the desk. The lights are bright enough to shine through the\
    \ paper, and the capacitive touch sensors are sensitive enough to be able to trigger\
    \ by placing your hands onto the Plexi.\n\n## Do you have speakers embedded inside\
    \ the desk for the sound effects?\n\nThere are two parts for the audio: the Pi\
    \ embedded in the desk, which is in charge of controlling the motors, lights and\
    \ sound effects, so there is a small speaker using an amplifier breakout board\
    \ inside the desk to trigger the sound effects of the controls. Then you have\
    \ the desktop computer, which slides in and out of the desk – this is a separate\
    \ Raspberry Pi with a separate amplifier, separate speakers.\n\n## How did you\
    \ go about creating the pop-up display?\n\nI had an old laptop from years ago\
    \ and when it broke down, I decided to recuperate the control of motors. I based\
    \ the idea on the Z axis of 3D printers, where you have threaded rods which can\
    \ then rise or lower a platform. I adopted the same principle by mounting two\
    \ stepper motors on the bottom side of the desk with threaded rods, with the whole\
    \ screen assembly resting on that platform. When the stepper motors are triggered,\
    \ the platform is raised, causing the whole frame to come out of the desk. To\
    \ have some guidance for this frame I used some drawer sliders, also from Ikea.\
    \ The stepper motors have good torque, so they can handle the weight of the entire\
    \ frame, but the speed is a bit of a problem. But in the end, it turned out that\
    \ the boot time of the desktop computer is exactly the same as the rising time\
    \ of the entire frame.\n\n## What was the most challenging part of the project?\n\
    \nI bumped into an issue where the control of the LEDs was impacting the audio,\
    \ and vice versa. I ended up using an external USB dongle for the audio so that\
    \ it wouldn’t impact the GPIO control for the LEDs. Time constraints make you\
    \ figure out things in any way possible. So the most challenging part is really\
    \ the integration, once you start putting everything together and making things\
    \ interact with one another.\n\n**Frederick Vandenbosch** is an integration engineer\
    \ by day and builder of electronic things by night. He likes to build things as\
    \ a way of learning about a subject and have fun while doing so. Not all builds\
    \ are successful, but that’s part of the learning process!\n\n# Like it?\n\nIf\
    \ you’d like to see more of Frederick’s work, check out his website: [bit.ly/1XC8u8](bit.ly/1XC8u8)\n\
    \nThe rest of the Sci Fi Your Pi entries, including an actual T-ricoder, can be\
    \ found here: [bit.ly/1ekb8c](bit.ly/1ekb8c)\n\n# Further reading\n\nThinking\
    \ of putting your own Tron desk together? There’s a great woodworking video here\
    \ from Bob Osgatt at Make that shows you how to craft a coffee table with embedded\
    \ LED strips, which is a great starting point: [bit.ly/1WIWIW](bit.ly/1WIWIW)\n"
