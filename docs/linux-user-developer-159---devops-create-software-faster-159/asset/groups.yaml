    The **-ggdb** part of the above command instructs the GCC to generate debugging
    symbols with GDB extensions. In order to get the maximum possible debugging information,
    you can use **-ggdb3**. Now let’s take a quick look at some of the widely used
    GCC options.


    +   - **E option** The output of the pre-processing stage can be produced using
    this option

    +   - **S option** This can be used in order to produce the assembly level output

    +   - **c option** A developer can use this option to produce only the compiled
    code (without any linking)

    +   - **save-temps option** Through this option, output at all the stages of compilation
    is stored in the current directory

    +   - **-l option** This option can be used to link with shared libraries

    +   - **-v option** Using this option, you can print out verbose information on
    all the steps GCC takes while compiling a source file


    When we are talking about the compiler, we normally come across a concept known
    as compiler optimisation. We can use the optimiser as a part of the compiler and
    it is capable of examining your code, identifying the areas that are suboptimal
    and rewriting them using code that does the same thing in less space or with much
    better performance. The GNU compiler GCC has a powerful optimiser and it can be
    applied to your programs very effectively.


    In GCC, we normally enable the optimiser by using the **-O** option. You can specify
    different levels of optimisation for GCC; if we use **-O**, it will be taken as
    **-O1** (ie level 1). You can normally go up to three levels (or **-O3**). To
    use the basic optimisations, you can execute a command similar to the following
    one:


    ```

    ```bash

    gcc -Wall -O1 -o sample_prog3 sample_prog3.c

    ```

    ```


    As mentioned earlier, we can use **-O** instead of **-O1**, or alternatively use
    **-O2** or **-O3**. These options basically control how aggressive GCC’s optimiser
    is. As expected, more aggressive optimisation means that our code will run faster.


    We are all aware that optimisation offers tremendous gains to the performance
    of our programs, but at the same time there are some drawbacks with the optimisation
    techniques. Some people prefer to compile their programs without any optimisations.
    This is mainly because the more aggressive GCC becomes with optimisations, the
    longer it takes for the program to finish compiling. It is always good to skip
    optimisations during the day-to-day development work, but make sure that you enable
    optimisations when it is the time to release the code. As mentioned before, we
    can have **-O1**, **-O2** or **-O3** as optimisation levels, but the **-O3** option
    can increase the size of the generated program. Even though this difference is
    not that significant, it becomes pretty important in some programs. If a program
    uses more RAM then swapping may occur on the machines on which it runs – this
    in turn can hurt the performance more than the gain.


    Another disadvantage with the optimisation technique is that debugging can be
    very difficult when we enable optimisation. This means that tracing the execution
    of the programs can be difficult. Consequently, it is best to always skip the
    optimisation techniques as much as possible when we need to debug our programs.


    The general rule is that the larger the number, the more optimisations are performed
    while compiling the code. Many developers prefer to compile their programs with
    **-O2** level of optimisation. This often provides the best compromise between
    optimisation strength, compile time and code size. Let us illustrate the optimisation
    with a code sample (our fourth sample program – sample_prog4.c):'
