    # Intel releases OpenSWR rasteriser


    Promises up to 51-fold performance increase


    A small team of engineers at Intel has released an open source software rasteriser,
    which it is claimed offers a 29- to 51-fold performance improvement over systems
    like Llumpipe.


    Dubbed OpenSWR, the tool acts as a virtual graphics processor and interfaces with
    Mesa3D for API and state tracking layers. It''s this project to which the team
    has contributed the code, targeting users working with large geometry models but
    who do not have access to hardware graphics processing capabilities – remembering,
    of course, that Intel produces CPUs but not dedicated GPUs.


    "Our customers prefer open source, and allowing them to simply download the Mesa
    source code and enable our driver makes life much easier for them," Intel''s Tim
    Rowley explained of the decision to release OpenSWR under the permissive Mesa
    MIT licence. "It''s easier to work with the Mesa community when the source we''re
    working with can be used as reference.".


    Intel has stated that the company is targeting applications based on the VIsualisation
    Toolkit, and that OpenSWR passes its OpenGL 3.2 backend rendering tests at 99
    per cent, and that it is looking to prove conformance to other suites.


    OpenSWR is compatible with any x86 processor featuring either AVX or AVX2 extensions,
    though Rowley has admitted that tests have not been carried out on rival AMD''s
    processors. Details and the source are available at github.com/OpenSWR.


    # CAREERS


    # Microsoft to hire Linux experts


    We''ve come a long way from the Halloween memos


    Microsoft''s Mark Russinovich has placed a call-out for Linux professionals to
    send their CVs to the company, as his Azure cloud computing division eyes expansion.


    Microsoft has traditionally competed against open source software in general and
    Linux specifically, with a series of leaked memos in October 1998 – known as the
    ''Halloween Memos'' – proving particularly aggressive. In recent years, however,
    the company has reversed its stance.


    Speaking during a keynote at All Things Open, Azure chief technology officer Russinovich


    pointed to considerable growth in the use of Linux on Azure and his company''s
    need to support this.


    Jokingly asking any Linux experts in the crowd to pass up their résimés, Russinovich
    claimed that the company is ''eager to fully support the open source community
    – a far cry from its traditional approach of stambler and extend; to which critics
    appended ''extinguish''.


    A slide accompanying Russinovich''s speech claimed that there are 500 Linux-specific
    job openings at Microsoft, and a further 350 relating to open source projects.'
