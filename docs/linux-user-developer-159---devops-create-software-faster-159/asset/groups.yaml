  - "[PAGE 65]\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_65_0.png)\n\nRight Tom\
    \ Viner's array of blocks negates the need for bordered rectangles\n\n# **14**\
    \ Sounds\n\nAlso upon bat collision, `sounds.blip.play()` looks in the sounds\
    \ subdirectory for a sound file called blip. You can download the sounds (and\
    \ finished code) from **FileSite.co.uk**.\n\nActually, now we think about it,\
    \ ignore the previous comment about homework -- your real homework is to turn\
    \ what we've written so far into a proper game of *Pong!* But first let's finish\
    \ turning it into *Breakout!*\n\n# **15** Blockhead!\n\nIf you're not very familiar\
    \ with the ancient computer game *Breakout*, then:\n\n```\n```\napt-get install\
