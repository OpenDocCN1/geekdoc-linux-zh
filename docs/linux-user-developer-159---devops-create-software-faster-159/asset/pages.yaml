  md: "# **Tutorial**\n\n# **Files and directories**\n\nS_ISDIR(\\texttt{statbuf\\\
    _st\\_mode}) helps you to make sure that you are dealing with an actual directory\
    \ instead of a regular file or a network card!\n\n# Traversing a directory structure\n\
    \nThe purpose of the presented program \\texttt{findc} would be to traverse a\
    \ directory structure in order to find files with a given filename \\u2013 like\
    \ a simplistic version of the find utility. If the desired filename is “anything”\
    \ then \\texttt{findc} prints every file and directory as it finds it. It is always\
    \ good to add some extra functionality to programs \\u2013 this is implemented\
    \ at line 34.\n\nDownload and inspect the \\texttt{find.c} file. The Perl version\
    \ that is presented in \\texttt{find.pl} is more advanced in the sense that it\
    \ uses a regular expression instead of exact matches; however, there are more\
    \ similarities than differences between \\texttt{find.c} and \\texttt{find.pl}.\
    \ As you might have guessed, the C version is bigger than the Perl version.\n\n\
    Please note that comparing strings for equality in C can be done either by comparing\
    \ them character by character or by using the \\texttt{strcmp(3)} function, which\
    \ is a better solution. The main reason for having a separate function for printing\
    \ the contents of a directory, which is named \\texttt{printd(1)}, is that the\
    \ program operates recursively; as \\texttt{main()} cannot call itself, we need\
    \ a separate function!\n\nThe program uses the \\texttt{chdir(2)} function to\
    \ change the current working directory to the provided road directory (line 19).\
    \ This is not mandatory but it makes things simpler for the programmer. Each time\
    \ \\texttt{printd(1)} finds a directory entry, it visits that directory. When\
    \ it finishes examining a directory, it goes back to the parent directory (line\
    \ 39).\n\nPlease note that \\texttt{find.c} uses \\texttt{lstat(1)} instead of\
    \ \\texttt{stat(1)} in order to be able to skip symbolic links \\u2013 this is\
    \ not mandatory, but bear in mind that symbolic links are not very safe as they\
    \ can even make your program jump to a different filesystem. Additionally, multiple\
    \ symbolic links can create a loop that will make your program run forever! Fixing\
    \ a symbolic link loop programmatically is not an easy task; therefore, using\
    \ \\texttt{lstat()} to\n\ninstead of \\texttt{stat(1)} and performing the required\
    \ checks is a safe and secure choice.\n\n# Counting symbolic links\n\n\\texttt{countSymlinks.c}\
    \ implements another command line utility that searches a directory tree for symbolic\
    \ links and counts them. You should already know how to traverse a directory structure\
    \ from the code in \\texttt{find.c}, which is going to be the base for \\texttt{countSymlinks.c}.\
    \ Two things should change in \\texttt{countSymlinks.c}. The first is that it\
    \ should use a global variable to keep the number of symbolic links found so far.\
    \ The second is that it must use \\texttt{\\_\\_ISLNK(1)} instead of \\texttt{\\\
    _\\_ISDIR(1)} to ensure the examined entry is indeed a symbolic link (line 34).\
    \ Please check \\texttt{countSymlinks.c} for the full C code.\n\nThe image on\
    \ the previous page shows the output of the \\texttt{diff} command that compares\
    \ \\texttt{countSymlinks.c} and \\texttt{find.c}. As most of the desired functionality\
    \ is already there, you only need to see the modifications. Although the use of\
    \ \\texttt{lstat(1)} is optional in \\texttt{find.c}, this is not true for \\\
    texttt{countSymlinks.c}: the use of the \\texttt{lstat(1)} system call in \\texttt{countSymlinks.c}\
    \ is required because, as you already know, \\texttt{stat(1)} follows symbolic\
    \ links!\n\n# Searching the PATH\n\n\\texttt{Path.c} shows the full C code of\
    \ the \\texttt{path.c} file that searches the PATH environment variable for an\
    \ executable file like the \\texttt{which} utility. You should be familiar with\
    \ most of the presented code but it would be good to quickly revisit it.\n\nFirst\
    \ of all, the program reads the PATH variable and stores its contents. Then, it\
    \ separates the various parts of the PATH variable \\u2013 that are directories\
    \ \\u2013 to use each part, independently. Last, it checks if the requested executable\
    \ is located in one of the directories of the PATH environment variable. The program\
    \ lists all instances of the executable found instead of just the first one.\n\
    \nThe tricky thing with the PATH variable is that it may contain the current working\
    \ directory, which is specified with a dot: “.”. The \\texttt{realpath(3)} function\
    \ resolves the canonicalised absolute pathname for any given path. Therefore,\
    \ the \\texttt{opendir(1)} system call opens the canonicalised absolute pathname\
    \ of every directory found in the PATH environment variable. Small details make\
    \ a huge difference so always pay attention to them!\n\nPlease note that if the\
    \ program you want to search for is in the current PATH but it is not an executable\
    \ file, \\texttt{path.c} shows it. This kind of checking happens with the help\
    \ of the \\texttt{access(1)} function at line 38. The \\texttt{access(2)} function\
    \ checks whether the calling process can access the specified file, which is its\
    \ first argument; its second argument specifies the accessibility tests that are\
    \ going to be performed. The \\texttt{\\_F\\_OK}\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_31_0.png)\n\
    \n# Calling C code from Haskell\n\nAs if Haskell was not good enough on its own,\
    \ we can also call C code! Please note that Haskell is used as an example here\
    \ as many other languages can also call C code.\n\nThe following program (\\texttt{git})\
    \ targets the process it is using C code wrapped in Haskell code.\n\n```\n```haskell\n\
    (\\* \\u2014 LANGUAGE ForeignFunctionInterface \\u2014\\*)\nmodule Main where\n\
    import System.Posix.Types\n\nforeign import ccall unsafe \"getpid\" c_getpid ::\
    \ IO PID\nmain = do\n    print = c_getpid\n```\n```\n\nAlthough you might not\
    \ be familiar with the Haskell code, you should understand how extraordinary what\
    \ just happened is: you used a C system call in a totally different programming\
    \ language to get a core information you wanted. Put simply, the c_getpid Haskell\
    \ function uses get\\{1\\}(2) to get the process ID. Using a slightly different\
    \ approach, you can call your own C functions from Haskell code.\n\n> “The tricky\
    \ thing with the PATH variable is that it may contain the current working directory,\
    \ which is specified with a dot:”."
