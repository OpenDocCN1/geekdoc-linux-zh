- pgno: 20
  md: '# CREATE A DOCKERFILE


    We''ve talked about how easy it is to create a Docker container for applications
    and deploy the container. Let us now create a container from scratch to understand
    the steps involved. As an example, let us create a container for MongoDB, an open
    source cross-platform NoSQL database, used very frequently by enterprise applications.
    To start, create a file named as Dockerfile in the directory where you want to
    create the image.


    ```

    $ nano Dockerfile

    ```


    Then open the file in your favourite editor and start adding the instructions.
    First, set the base image as Ubuntu using FROM ubuntu:latest. Then declare the
    maintainer of the Dockerfile.


    ```

    MAINTAINER Name <email@address-here>

    ```


    Let''s now complete the installation prerequisites:


    ```

    RUN apt-key adv --keyserver http://keyserver.ubuntu.com:80 --recv 7F0CEB10

    RUN echo "deb http://repo.mongodb.org/apt/ubuntu\ 14.04 release -x04/mongodb-org/3.0
    multiverse" | tee /etc/apt/sources.list.d/mongodb-org-3.0.list

    ```


    Then install MongoDB:


    ```

    RUN apt-get update && apt-get install -y mongodb-org

    ```


    MongoDB also requires a data directory. Create it using:


    ```

    RUN mkdir -p /data/db

    ```


    Finally, expose the relevant port from the container to the host and set the entry
    point as the MongoDB daemon:


    ```

    EXPOSE 27017

    ENTRYPOINT ["/usr/bin/mongod"]

    ```


    Save this file. We can now move forward to build the image from this Dockerfile.
    To build the image, type this into the terminal:


    ```

    $ docker build --tag mymongodb .

    ```


    This tells Docker to build an image from the Dockerfile present in the current
    directory (note the . at the end) and tag it as mymongodb. You have the MongoDB
    image ready to run now. Let''s spawn a container from the image.


    ```

    $ docker run -p 27017:27017 --name mongo_db_instance_01 -d mymongodb

    ```


    This creates a container called mongodb_instance_01 and executes it. You can check
    the currently running containers using the command:


    ```

    $ docker ps

    ```


    Finally, you can connect to the MongoDB container by running:


    ```

    $ mongo --port 27017

    ```


    +   * Need to automate the testing process? Use tools like Daisi that take the
    code from repository and then deploy it in the form of a Docker container on predefined
    hardware nodes.


    Docker provides great flexibility in implementing new ways to successfully implement
    DevOps. Let us now take a look at some key Docker features that make it the flexible
    tool that it is.


    # Union file system


    One of the lesser known features of Docker is the union file system. Though not
    explicitly visible to the end users, the union file system works in the background
    to enable the building of new containers on top of old ones, saving you from repeating
    things. Let''s visualise the process. Every Docker image starts from a base image.
    As you add instructions in the Dockerfile, each instruction creates a new layer
    in the resulting image. When you finally run the image, the union file system
    combines all the layers into a single image, which is then run as a container.
    This layered approach means you can also use an existing image as the base for
    a new image.


    # Docker Registry


    All of us know about GitHub. Docker Registry can be thought of as something similar
    for Docker images. Though not a part of your Docker installation, Docker Registry
    is tightly integrated with Docker and allows you to easily push/pull Docker images.


    From a DevOps point of view, this offers a great deal of connectivity. Even if
    teams are sitting across locations, they can easily share and distribute Docker
    images. If you are interested in the cloud-hosted Docker Registry provided by
    Docker itself, head over to hub.docker.com.


    # Docker Swarm


    To be able to deploy and manage multiple Docker images on a cluster, Docker provides
    a tool called Docker Swarm. The prerequisites to start using Swarm are: VirtualBox
    installed on the local system, all the nodes have access to Docker to pull images,
    and each node is associated with a discovery service like etcd, Consul, ZooKeeper,
    etc.


    # In-browser terminal


    Wetty (Web+http) is a JavaScript-powered in-browser terminal emulator. You can
    use the DockerInBrowser Wetty to run a Linux shell in your browser; the Docker
    image is already available in the DockerHub, so you just need to type:


    ```

    $ docker run -p 3000:3000 -d nathanaele/wetty

    ```


    Note that Wetty currently works in the Chrome browser only.


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_20_0.png)


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_20_1.png)


    Left If you need to manage many Docker images, make use of the Docker Swarm tool'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# AUTO-CONFIGURE NODES WITH PUPPET


    Puppet enables you to manage the state of your IT infrastructure. Here we''ll
    look at the Puppet installation process, then the master/agent setup


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_21_0.png)


    Above You can learn more about the state of Puppet at puppetlabs.com


    Automation is one of the key factors in implementing DevOps. The more you reduce
    human effort in repetitive tasks, the more you can get out of your workforce.
    IT infrastructure configuration is one such field that involves repetitive tasks
    – provisioning physical and virtual machines, orchestration, reporting and other
    similar tasks. Here are some advantages a configuration management tool offers:

    * Code commit log shows you the whole history of change on the infrastructure

    * Reproducible across systems

    * Scale easily

    * Coherent and consistent server setups

    * Aligned environments for development, testing, and production nodes


    So, a tool that lets you handle all this and more, without having you get your
    hands dirty in coding can help in going a long way on the DevOps path. Puppet
    is one such tool. Simply put, Puppet lets you manage the state of your IT infrastructure.
    In an agent/master setup, the master is the central Puppet server, from which
    all of your configuration data will be managed and distributed, and all your remaining
    servers will be Puppet agent nodes, which can be configured by the Puppet master.
    In standalone Puppet, every node periodically uses the **puppet apply** command
    to compile and apply its own configuration, using a full set of Puppet


    modules and manifests. In other words, each node requires the same files and data
    that the Puppet master requires in agent/master Puppet. In this tutorial we will
    focus on the agent/master Puppet setup.


    # 01 Pre-installation steps


    Once you decide on the setup type, ie agent/master or standalone, the next step
    is to identify the master (if you are planning to use the agent/master setup).
    Note that a Windows machine can''t be a master. Also, the master should be a dedicated
    machine with a minimum of two processor cores and at least 1GB RAM. It must also
    be reachable at a reliable hostname. You can reduce the setup time on your agents
    by making sure the master is available at the default hostname of *puppet*. The
    Puppet master should allow incoming traffic on port 8140 and agent nodes should
    be able to connect to the master. Puppet master serves as the certificate authority
    and so it should have its system time set up accurately, or it may mistakenly
    issue agent certificates from the distant past or future, which other nodes will
    treat as expired. Once all these are taken care of, you can move on to the next
    step of Puppet installation.


    # 02 Installation on the master


    Time to install Puppet on the master. First enable the Puppet Labs package repository;
    once this repository is enabled, we can install Puppet. Type:


    ```

    ```

    $ wget https://apt.puppetlabs.com/puppet-labs-release-trusty.deb

    $ sudo dpkg -i puppet-labs-release-trusty.deb

    $ sudo apt-get update

    ```


    ```


    Next, on the Puppet master node, type either this:


    ```

    ```

    $ sudo apt-get install puppetmaster-passenger

    ```


    ```


    ... which is recommended by PuppetLabs itself, as it installs Puppet and its prerequisites,
    and automatically configures a production-capacity web server; or instead, type
    in:


    ```

    ```

    $ sudo apt-get install puppetmaster

    ```


    ```


    ... which will only install Puppet, its prerequisites and an init script. */etc/init.d/puppetmaster*
    for running a test-quality Puppet master server.


    # Declarative language


    Puppet uses a declarative language to help you describe the state of the system.
    This means you don''t have to think about building a LAMP stack by installing
    Apache, MySQL, and PHP: then tweaking php.ini; then enabling mod_php; and so on.
    You can just describe the state you want – for example, "a web server with Apache,
    MySQL, and WordPress" – and then let Puppet make it happen.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# 03  Installation on agents and post-installation


    On all the agent nodes, you now need to run the following command:


    ```

    `$ sudo apt-get install puppet`

    ```


    This will install Puppet and an init script (`/etc/init.d/puppet`) for running
    the Puppet agent daemon. With this, we complete the installation process but Puppet
    is not started yet. Let''s now configure the master and the agents, so they can
    talk to each other as and when required. The first step in this process is to
    set the master''s name and certificates. You will need a DNS server that can resolve
    the names to corresponding IP addresses, then in the main section of the master''s
    `puppet.conf` file, set the `dns_alt_names` setting to a comma separated value
    of each hostname that master can have. The default name to which an agent will
    try to connect is **puppet**. So, if you use "puppet" as the hostname for master,
    it will save you some effort. This is one of the most important steps and should
    be done carefully to avoid communication issues at later stages.


    # 04  Activate certificates


    The next step is to activate the certificates on the master. If this is the only
    Puppet master in your deployment, or if it will be acting as the CA server for
    a multi-master site, you should now run the following:


    ```

    `$ sudo puppet master --verbose --no-daemonize`

    ```


    This will create the CA certificate and the Puppet master certificate, with the
    appropriate DNS names included. As soon as the terminal output displays:


    > Notice: Starting Puppet master version 3.8.3.


    ...kill the process by typing Ctrl+C, because we don''t want the master to run.
    Now put all the Puppet manifests and modules in place and then configure a web
    server if you are planning to use Puppet to manage configuration loads.


    # 05  Configure the agent


    First of all, you will need to configure the `puppet.conf` settings in each of
    the agent nodes so that they are able to connect to your Puppet master server.
    Also, certain environment-specific factors should be changed according to your
    infrastructure requirements. Then you will need to start the Puppet agent service.
    You can either configure it to start on boot or set up a cron job, so that it
    runs at specific intervals. To start the Puppet service, type:


    your infrastructure requirements. Then you will need to start the Puppet agent
    service. You can either configure it to start on boot or set up a cron job, so
    that it runs at specific intervals. To start the Puppet service, type:


    ```

    `$ sudo puppet resource service <NAME>

    ensure=running enable=true`

    ```


    Then configure the cron job using:


    ```

    `$ sudo puppet resource cron puppet-agent \

    ensure=present user=root minute=30 command=/usr/\

    bin/puppet_agent --onetime --no-daemonize --play`


    The final step is to sign the certificates for each of the agent nodes. Note that
    in an agent/master deployment, an admin must approve a certificate request for
    each agent node before the node can fetch configurations. Agent nodes will request
    certificates the first time they attempt to run. To approve the requests, log
    on to the Puppet master server and view outstanding requests using:

    ```


    ```

    `$ sudo puppet cert list`

    ```


    Then sign a request by typing:


    ```

    `$ sudo puppet cert sign <NAME>`


    You can also sign all the requests in one go using:

    ```


    ```

    `$ sudo puppet cert sign --all`


    With this, the agent nodes are now ready to communicate with the master. Puppet
    also enables a higher level of configuration by letting you classify the nodes.
    With this, you can determine which agent nodes receive which information from
    the master.

    ```


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_22_0.png)


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_22_1.png)


    # Run when file updates


    You can run a command automatically whenever a file changes. Just use an exec
    resource with `refreshonly` set to `true`, for example:


    ```

    ```

    file { "/etc/bind: \

    source => "/dist/apps/ \

    bind" }


    exec { "/usr/bin/ndc \

    reload: \

    subscribe => File["/ \

    etc/bind"], \

    refreshonly => true \

    }```

    ```


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_22_2.png)'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Feature


    # DEVOPS


    # MANAGE YOUR VIRTUAL MACHINES WITH VAGRANT


    Vagrant makes it easy for you to manage several virtual machines in one go. Here
    we will learn how to install and get started with Vagrant.


    Before diving further into what Vagrant can do for you, let''s first understand
    what Vagrant is. In simple terms, Vagrant provides an easily configurable, reproducible
    and portable work environment, built on top of virtualisation technology. The
    work environment built by Vagrant can be controlled by a single consistent workflow
    in order to help maximise the productivity and flexibility.


    To achieve its magic, Vagrant stands on the shoulders of giants like VirtualBox,
    VMWare, AWS, or other providers. You can then use provisioning tools – such as
    shell scripts, Chef or Puppet – to automatically install and configure software
    on the machine. So, once you create a single Vagrantfile, you just need to `vagrant
    up` and everything is installed and configured for you to work with. Other members
    of your team can create their development environments from the same configuration,
    so whether you''re working on Linux, OS X or Windows, all your team members are
    running code in the same environment, against the same dependencies, all configured
    the same way.


    # Installing Vagrant


    Vagrant can be easily downloaded and installed on your system. Go to the Vagrant
    downloads page (vagrantup.com/downloads.html) and download the package appropriate
    for your system. You can then install it by following the standard installation
    procedure for your platform. Also, the installer automatically adds the `vagrant`
    command to your system path, so you can start using it now. If you see the "command
    not found" error, just log out and back in, and it should work.


    # Vagrantfile


    A Vagrantfile describes the type of machine required for a project, and how to
    configure and provision these machines. Note, that the actual filename for the
    file is simply Vagrantfile. Vagrant runs with one Vagrantfile per project, and
    the Vagrantfile is supposed to be committed to version control. This enables other
    developers involved in the project to check out the code, run `vagrant up` and
    be on their way. Vagrantfiles are portable across every platform Vagrant supports.


    # Environment variables


    You can use environment variables in Vagrantfile, by calling `ENV[variable_name]`.
    For example:


    ```

    config.vm.box =

    "#{ENV[''boxname'']}"

    ```


    # VAGRANTFILE EXPLAINED


    ```

    # File, Edit, View, Search, Require, Help

    # -*- mode: ruby -*-

    # vi: set ft=ruby:

    Vagrantfile API: 2.x/5.x

    VERSION = "2"


    #Check if you have the good Vagrant version to use docker provider...

    Vagrant.require_version ">= 1.6.0"

    vagrant.configure(VAGRANTFILE_API_VERSION) do |config|

    # All Vagrant configuration is done here. The most common configuration

    # options are documented and commented below. For a complete reference,

    # please see the online documentation at vagrantup.com.

    ENV["VAGRANT_DEFAULT_PROVIDER"] = "docker"


    # Share an additional folder to the guest VM. The first argument is

    # the path on the host to the actual folder. The second argument is

    # the path on the guest to mount the folder. The optional third

    # argument is a key of non-specific options.

    config.vm.synced_folder ".", "/vagrant_data"

    # Provider-specific configuration so you can limit-tune vm (for

    # backing providers for Vagrant. These expose provider-specific options.

    # Example for VirtualBox:

    # config.vm.provider "docker" do |d|

    #   d.has_ssh = "*"

    #   d.has_ssh = true

    # end


    config.ssh.port = 22

    end


    ''Vagrantfile'' 31 lines, 1879 characters

