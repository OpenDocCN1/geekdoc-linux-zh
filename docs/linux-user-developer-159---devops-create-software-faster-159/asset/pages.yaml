  md: '# **Q & A**


    # # Your questions answered


    Send us your questions and we’ll do our best to answer them!


    # ## Access content


    I have a couple of Linux PCs in my office: a full PC and a laptop. The laptop
    keyboard is a bit rubbish. However, there’s work on there that can only be done
    on that laptop and cannot be moved to the main PC. I’d really prefer to use the
    human interface stuff from the main computer without having to unplug them every
    time I want to use the laptop. And before I start buying a new mouse and keyboard,
    I wondered


    if there was maybe a cunning software solution to my particular issue?


    **Mike**


    *Indeed there is, so don’t buy a new mouse and keyboard yet as there are two main
    solutions that instantly come to mind. They do depend on how close the PC and
    laptop are, and how you want to handle it.*


    *The more common method would be to use a remote desktop app to dial into the
    laptop. You can set up a server on it using a number of services (such as Remmina)
    that you can then create a connection to on your main PC. Save the settings and
    you can quickly connect whenever you want. You’ll have a view of the desktop on
    your main PC and be able to use your mouse and keyboard on it.*


    *Otherwise, there’s also Synergy. Synergy enables you to treat your PC as a server
    for the mouse and keyboard, which your laptop can then connect to. If your laptop
    is right next to your PC, you can basically start using it as a sort of second
    screen and access the files only on the laptop via the laptop screen. All you
    do is move the mouse to the other screen like in any dual-monitor setup and work
    from there. It also works cross-platform as well!*


    # ## RAR files


    I have been sent some files by a friend (so I know they’re legitimate) and they
    decided to compress it into a RAR file. They’re using Windows, so I guess in some
    circumstances that is the default compression option. Either way, I am having
    massive trouble trying to unpack this file in Ubuntu. It doesn’t seem like the
    normal archive managers, or whatever, know how to open it, let alone get the files
    out! Is there any way I can access the files on the RAR in Linux?


    **Nick**


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_93_0.png)


    > Left: Remmina is useful for sorting out other people’s PCs if they’re having
    problems'
