  md: '![](img/0fc17bd4c29dc437e3ac28a53f7559db_39_0.png)


    The system prompts you for your password and then asks you to verify it. Once
    successfully completed, you get the hash for your password. Add this hash into
    the password field of the cloud-config file. Note that while logging in, you need
    to key in the plaintext password. Once done with the fields, save the file with
    the yml extension.


    # 06 CoreOS disk installation


    Now that we have the cloud-config file ready, let us install CoreOS on the disk
    so that we are independent of the mounted CoreOS ISO file. The CoreOS install
    process is pretty straightforward. You just need to use the coreos-install command.
    To install CoreOS to the disk, just type:


    ```

    ```

    $ sudo coreos-install --dev=/dev/sda --C:table --c:cloud_config.yml

    ```

    ```


    This will install CoreOS to /dev/sda device from the stable channel, using the
    cloud-config file cloud_config.yml. Note that you need to replace cloud_config.yml
    with the name of the cloud-config file you created in the previous step. Once
    you enter the command, CoreOS will be downloaded and installed to your virtual
    machine. Check the installation by uninstalling the ISO image from the IDE controller
    and rebooting the virtual machine. If everything''s correct, the virtual machine
    should reboot and you should be able to log in using the username and password
    set in the cloud-config file.


    # 07 Docker on CoreOS


    Docker containers form the main building block of CoreOS. Since there is no package
    manager, any software you''d like to run on CoreOS should be run as a container
    - so it''s no surprise that Docker is pre-installed on CoreOS!


    Using Docker on CoreOS is same as on any other Linux distro, but other services
    like systemd, fleet, etc (more on them later), which blend well with containers
    and make connecting and managing them easy, make a huge difference. To refresh
    your Docker command knowledge, let us launch an Ubuntu container and then spawn
    the bash prompt in the container. Just type:


    ```

    ```

    $ docker run -t -i ubuntu /bin/bash

    ```

    ```


    # 08 systemd


    systemd is the init system used by CoreOS. It is at the core of the distributed
    init system, fleet. There are two main concepts related to systemd. The first
    is a unit, which is basically a configuration file describing the properties of
    the process that will be run using systemd. The second is a target, a grouping
    mechanism that enables systemd to start up groups of processes at a time. Each
    target is actually a collection of symlinks to the unit files, required for that
    target. This is specified in the unit file by the field:


    ```

    ```

    WantedBy=multi-user.target

    ```

    ```


    It is worth mentioning here that systemd is the first process on CoreOS, once
    started, it reads different targets and starts the processes specified which enable
    the OS to start. In CoreOS the unit files are located at /etc/systemd/system.


    Above With the virtual machine created, you need to sort out the mount


    # 04 Boot CoreOS for the first time


    Now that the virtual machine is created, we need to mount the CoreOS ISO to it
    and boot the live version of CoreOS. Only when the live version is booted can
    we create the cloud-config file and then install CoreOS on the disk.


    To mount the CoreOS ISO, right-click on the CoreOS virtual machine we just created
    and select Settings. Then click on the Storage tab, and associate the CoreOS ISO
    file to the IDE controller. Now, go back to the list of virtual machines, select
    the CoreOS virtual machine and click Start (on the top bar). This boots up the
    CoreOS virtual machine using the ISO file attached to it as the boot media. After
    the boot messages, you should see the CoreOS command prompt with the default core
    user logged in. This confirms that the CoreOS ISO successfully booted and you
    can now create the cloud-config file before installing CoreOS to disk. Note that
    the core user automatically logs in for the first time, but it is mandatory to
    create a user (with the cloud-config file) in order to log in when CoreOS boots
    up the next time.


    # 05 Create the cloud-config file


    The cloud-config file follows the YAM L file format and has specific entries.
    We need to follow the file structure to make sure that CoreOS recognises and processes
    the file. First is the header: it should be either #cloud-config or #!. The header
    should be followed by an associative array with zero or more of the following
    keys - coreos, ssh_authorized_keys, hostname, users, write_files and manage_etc_hosts.
    We''ll focus on the users entry for now.


    The users entry has three sub-fields: name, password and groups. These fields
    are self-explanatory, except for one catch – the password field holds the password
    hash and not the actual password, which is good for security but adds another
    step while you create the cloud-config file. You need to create the hash manually,
    then add it to the cloud-config file. One option is to use the openssl utility
    (available with CoreOS) to create the hash. Just type:


    ```

    ```

    $ sudo openssl passwd -1

    ```

    ```'
