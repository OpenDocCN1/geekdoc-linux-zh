  md: '# OpenSource

    Your source of Linux news & views


    # **OPINION FREE SOFTWARE**


    # Hacked off


    > “Access to computers – and anything which might teach you something about the
    way the world works – should be unlimited and total”


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_7_0.png)


    When Edward Snowden joined Twitter, he gained over a million followers in one
    day. He is notorious to some, a hero to others, and yet his greatest contribution
    has been to reveal the extent to which hacking, in its pejorative sense, is the
    preserve of government agencies. These agencies claim to be working for ‘our own
    good’, but are instead busy setting malign standards for everyday surveillance
    of our citizens.


    The pejorative use of the word ‘hacker’ probably originated in the tabloid coverage
    of the exploits of Kevin Poulsen (who hacked his way into the US Department of
    Defense’s ARPANET, the precursor of the Internet, when he was 17 and was later
    labelled ‘the Hannibal Lecter of computer crime’) and Kevin Mitnick (who broke
    into the North American Defense Command (NORAD) systems in 1983 when the Cold
    War was at its height, a feat that inspired the 1983 film War Games and provoked
    what number of nightmares for the morally insecure).


    However, the terminology of hacking grew out of the community that evolved around
    the unlikely and much more benign setting of the TMCR (Tech Model Railroad Club),
    and its offshoot The Midnight Requisitioning Committee, at MIT (The Massachusetts
    Institute of Technology) in the late 1950s and early 1960s. The hackers of the
    TMCR defined a hack as ‘a project undertaken or a product built not solely to
    fulfil some constructive goal, but with some wild pleasure taken in mere involvement’.
    They also defined a hacker as a person ‘who enjoys learning the details of programming
    systems and how to stretch their capabilities, as opposed to most users who prefer
    to learn only the minimum necessary’; or one who ‘programs enthusiastically or
    who enjoys programming rather than just theorising about programming’ (from the
    original jargon.txt at the AI Lab at MIT).


    The Midnight Requisitioning Committee was so named because, in the words of Steven
    Levy, ‘when TMCR needed a set of diodes or some extra relays, to build some new
    feature’ into the model railroad system, some of them would ‘wait until dark and
    find their way into the places where those things were kept. None of the hackers,
    who were as a rule scrupulously honest in other matters, seemed to equate this
    with stealing.’ The allegiances of the hackers transferred from under the model
    railroad layout tables to the computer when a TX-0 computer arrived in building
    26 of the MIT complex and the members of TMCR discovered that the best time to
    gain access to the TX-0 was at night, ‘when no person in his right mind would
    have signed up for an hour-long session on the piece of paper posted every Friday
    beside the air conditioner in the RLE lab’.


    From this point onwards, ‘the TMCR hackers, who soon were referring to themselves
    as TX-0 hackers, changed their lifestyle to accommodate the computer’, and became
    the core members of the AI (Artificial Intelligence) Group at MIT, later funded
    by the Defense Advanced Research Projects Agency (DARPA) of the US Department
    of Defense. Former TMCR hackers developed the first LISP machine, the first computer
    workstation, the first computer games, the first music software and the first
    display hacks. Hackers were the heroes of the computer revolution and the hacker
    tradition always included a healthy disrespect for authority and a reciprocal
    love of pranks. Every idea and every limitation was another boundary to be explored,
    a means to an adventurous end that might upset the applicable or translate into
    a better idea; especially if a higher moral reason could be found to justify the
    ends, and that reason, as defined in the Hacker Ethic, was:


    > Hackers were the heroes of the computer revolution and the hacker tradition
    always included a healthy disrespect for authority and a love of pranks


    Richard Hillesley

    writes about art, music, digital rights, Linux and free software for a variety
    of publications'
