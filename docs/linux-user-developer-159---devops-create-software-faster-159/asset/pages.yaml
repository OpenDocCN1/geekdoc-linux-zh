- pgno: 74
  md: "# # FUZE BASIC\n\n# ## What you’ll need\n\n+   - FUZE BASIC V3\n+     [fuze.co.uk/getfuzebasic](fuze.co.uk/getfuzebasic)\n\
    +   - 73MP357PART1.fuze\n\n# **01** Get the program listing\n\nAs this is a fairly\
    \ large program, we won’t be typing it line by line. Instead, you need to download\
    \ the Part 1 code from [FileSito.co.uk](FileSito.co.uk) or [fuze.co.uk/tutorials/73MP357PART1.fuze](fuze.co.uk/tutorials/73MP357PART1.fuze).\n\
    \nWe will then look at each section and explain what is happening.\n\nOpen FUZE\
    \ BASIC and either load (with F8) ‘73MP357’ or copy and paste the code straight\
    \ into the editor (F2 switches between the editor and immediate mode).\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_74_0.png)\n\
    \n# **02** Try the code\n\nBefore we take a look at the code, let’s see what it\
    \ does. Run the program by pressing F3 or typing *run* in immediate mode. You’ll\
    \ be presented with two type core events: the star field, the level and, of course,\
    \ the player. You can move the player around the level using left and right cursors.\n\
    \nNotice the playing field view perspective changes as you rotate around. This\
    \ particular effect is from *Tempest 2000* and not the arcade original.\n\nRight,\
    \ now to the code. Press Escape to stop the program and then F2 to bring up the\
    \ editor.\n\n# **03** System set up\n\nYou’ll see that the code is well commented,\
    \ with each section headlined with a *#* and comment.\n\nOur first section sets\
    \ up our system and variables. We set the resolution and *updatemode* is set to\
    \ zero so that nothing updates the screen other than an *update* command. In FUZE\
    \ BASIC, if the mode is set to 1 or 2 then *print* statements will also update\
    \ the screen, which slows everything down.\n\nThree variable arrays are set up\
    \ to store the star angle, speed and distance. These could be combined into one\
    \ array but it is easier to read when separated.\n\nThe *while* loop fills the\
    \ star field arrays with randomly positioned points with random angles and speeds.\n\
    \n# **04** See to the display\n\nNext up are the variables required for the playing\
    \ field level display. The *radius* and *radius2* variables define the outer and\
    \ inner rings, and *vertices* sets up the number of sections our level is divided\
    \ into. The minimum is four for a square, with a maximum of up to 13. The *gap*\
    \ variable determines the step distance around the circumference so the player\
    \ will always be positioned in the middle of each section.\n\n# ## Full code listing\n\
    \n```\n```\nStep 03\n\n##### settings #####\nxs = 840\nyres = 640\nupdatemode\
    \ = 0\nsetmode( xs$ , ys$ )\n\n# variables for the star field effect\ndim stars(\
    \ 1000 )\ndim starsSpeed( 1000 )\ndim starsDist( 1000 )\nstarNum = 0\n```\n```\n\
    \n```\n```\nStep 04\n\n# setup star field effect\nwhile starNum < 1000 cycle\n\
    \  stars( starNum ) = rnd( 360 )\n  starsSpeed( starNum ) = rnd( 5 + 1 )\n  starsDist(\
    \ starNum ) = rnd( height )\n  starNum = starNum + 1\nrepeat\n\n# level drawing\
    \ variables\nx = 0\ny = 0\nx2 = 0\ny2 = 0\noldX = 0\noldY = 0\noldX2 = 0\noldY2\
    \ = 0\nangle = 0\nradius = $height / 2 - 50 // outer radius\nradius2 = $height\
    \ / 16 // inner radius\nvertices = rnd( 9 ) + 4 // nothing less than a square\n\
    gap = 360 / vertices // angle between vertices\n```\n```\n\n```\n```\nStep 05\n\
    \n# player variables\npingL$ = gap / 2\npx = 0\npy = 0\nptrNum = 0\n\n# different\
    \ centers for the parallax effect\ncenterX = $width / 2 // center of close objects\n\
    centerY = $height / 2\ncenterX2 = centerX // center of far objects\ncenterY2 =\
    \ centerY\n\nstarsCenterX = centerX // fixed center for the stars\nstarsCenterY\
    \ = centerY\n\n# movement variables\nmoveDelay = int( 80 / vertices ) // delay\
    \ after moving\nmoveCount = 0\n```\n```\n\n```\n```\nStep 06\n\nloop\ncl$c\n\n\
    # movement input\nif scankeyboard( $rangrid$ ) then\n  if moveCount = 0 then\n\
    \    pingL$ = pingL$ + gap\n    moveCount = moveDelay\n    if pingL$ > 360 then\n\
    \      pingL$ = gap / 2\n  endif\nendif\n```\n```\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_74_1.png)"
  merge: -1
  img_proc: true
- pgno: 75
  md: "# # Tutorial\n\n# ## Full code listing\n\n```\n```text\nStep 06\n   end if\n\
    \   if scankeyb$ord(scankeyb) then\n     if moveCount = 0 then\n       pAngle\
    \ = pAngle - gap\n       moveCount = moveToCount\n       if pAngle < 0 then\n\
    \         pAngle = 360 - ( gap / 2 )\n       end if\n     end if\n   end if\n\n\
    Step 07\n   # set max particle effects based on resolution\n   maxStars = height\
    \ / 5\n\n   colour = white\n   while starNum < maxStars cycle\n     # calculate\
    \ star positions using expanding or\n     # contracting circles\n     starX =\
    \ starsDist(starNum) * cos( stars(starNum) )\n     starX = starsCenterX + starX\n\
    \     starY = starsDist(starNum) * sin( stars(starNum) )\n     starY = starsCenterY\
    \ + starY\n     starsDist(starNum) = starsDist(starNum) + starsSpeed(starNum)\n\
    \nStep 08\n     # reset position if offscreen\n     if starX < 0 then\n      \
    \ starsDist( starNum ) = rnd( 15 ) + 5\n     end if\n     if starX > gwidth then\n\
    \       starsDist( starNum ) = rnd( 15 ) + 5\n     end if\n     if starY < 0 then\n\
    \       starsDist( starNum ) = rnd( 15 ) + 5\n     end if\n     if starY > gheight\
    \ then\n       starsDist( starNum ) = rnd( 15 ) + 5\n     end if\n\n     plot(\
    \ starX, starY )\n     starNum = starNum + 1\n   repeat\n   starNum = 0\n\nStep\
    \ 09\n   # Draw the level by looping & drawing a segment at a time.\n   colour\
    \ = blue\n   while angle < 360 cycle\n     x = radius * cos( angle )\n     x =\
    \ centerX + x\n     y = radius * sin( angle )\n     y = centerY + y\n     x2 =\
    \ radius2 * cos( angle )\n     x2 = centerX2 + x2\n     y2 = radius2 * sin( angle\
    \ )\n     y2 = centerY2 + y2\n     line( x, y, x2, y2 )\n     line( x, y, oldX,\
    \ oldY )\n     line( x2, y2, oldX2, oldY2 )\n     oldX = x\n     oldY = y\n  \
    \   oldX2 = x2\n     oldY2 = y2\n     angle = angle + gap\n   repeat\n```\n```\n\
    \n# **05** Player variables\n\nA few player variables are required to determine\
    \ the location on-screen and its position in relation to the level.\n\nThree centre\
    \ X and Y coordinates are used: two moving ones for the level and a fixed one\
    \ for the star field. The moving centres will make sense a bit further on, but\
    \ it is thanks to these that we have the slick perspective effects.\n\nA **moveDelay**\
    \ variable (80 divided by the number of sections, i.e. **vertices**) is used to\
    \ keep player movement consistent regardless of how many sections there are in\
    \ the level.\n\n# **06** Remove flicker\n\nNow we move onto the main **loop**.\
    \ The `cls2` statement is critical and is very different to the more standard\
    \ `cls` version: `cls2` wipes out the frame buffer memory; this is a separate\
    \ screen memory where everything is drawn first. When you issue an `update` statement,\
    \ the frame buffer is copied to the main screen memory. The `cls` version just\
    \ clears everything, so it creates a lot of flicker. Both `cls2` and `update`\
    \ ensure flicker-free updates, which is essential for games.\n\nThe player keyboard\
    \ controls are checked next. If the right cursor is pressed then the player angle\
    \ is increased by the **gap** amount (this is the distance to the centre of the\
    \ next section). The left cursor, of course, does the opposite.\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_75_0.png)\n\
    \n# **07** Position the stars\n\nThen we calculate the star positions – that is\
    \ each and every one of them! The number of stars is adjusted depending on the\
    \ display resolution.\n\nWhile is selected and a loop to count through the stars\
    \ is initiated. Each star is a position on the circumference of a circle. The\
    \ radius of the circle therefore determines the star's distance from the centre.\
    \ We take the distance from the centre, **starsDist(starNum)**, and multiply it\
    \ by the cosine of the angle, **stars(starNum)**. We then add this to the centre\
    \ position, **starsCenterX**, to give the new starX position. The starY position\
    \ is the same but uses the sine instead.\n\n# **08** Check the star movement\n\
    \nWe check to see if a star has left the display area and if so, reset it back\
    \ to the centre plus a small offset, as we don't them to all appear from the dead\
    \ centre.\n\nFinally, the star is drawn using **plot(starX, starY)** and the **while**\
    \ loop is repeated until all of the stars have been updated and plotted on the\
    \ star field.\n\n# **09** Make the level\n\nOn to the level itself. Each segment\
    \ is drawn one at a time. The first line of the first segment has inner and outer\
    \ X and Y coordinates. The next line aloi (again, from centre to outer rim) is\
    \ calculated and the two connecting lines are drawn from the old positions to\
    \ the new ones."
