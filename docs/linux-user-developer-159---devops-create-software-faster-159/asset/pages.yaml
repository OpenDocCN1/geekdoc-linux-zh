    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_44_1.png)


    # **Launch single settings modules**


    All KDE Plasma 5 settings are conveniently grouped into the System Settings application,
    which can also be launched by calling upon the **systemsettings5** command. There
    is no denying that this application is very nice, but finding the perfect setting
    can take some time and you might want to access everything in a more elegant way.
    This can be done using the **kcmshell5** command. First, let''s see what modules
    we have:


    ```

    `$ /usr/bin/kcmshell5 --list`

    ```


    Use any module as an argument to **kcmshell5** and it will then launch the respective
    single module without accessing the control panel. For example:


    ```

    `$ /usr/bin/kcmshell5 kwincompositing`

    ```


    ... will launch the desktop compositor''s setup. This technique lets you launch
    any module from the list and then, maybe, create a shortcut with such a command,
    or bind it with a keyboard shortcut. It is also possible to launch several modules
    with a single command. For instance:


    ```

    `$ /usr/bin/kcmshell5 mouse kcm_xserver`

    ```


    ... will display a nice window with all these modules shown as different sections
    inside a single window.


    For even Plasma 5 tips and tricks, it''s always worth paying a visit to the KDE
    wiki – community members are always uploading guides to **userbase.kde.org/Tutorials**.


    > **Plasma 5 desktop is modular, so we can kill the shell without disturbing anything
    else, be it a background process or a graphical application**


    # **Uniform look**


    As far as we can remember, the first attempt to clear the visual differences between
    Qt-based and GTK-based apps was taken in Red Hat Linux 8.0 with the introduction
    of the Bluecurve theme. Nowadays, the problem is still present: modern GTK2 and
    GTK3 apps don''t quite fit well into the KDE desktop. There are various workarounds
    for this issue, including the QtCurve theme, which works well for GTK2 but has
    poor support for GTK3. Another option is to use the Orion GTK theme, which looks
    similar to Plasma 5 Breeze (the default theme) but still has huge visual inconsistencies
    with it. Luckily, we have a working port of the Breeze theme to GTK at **github.com/dirkv1/gnome-breeze**,
    covering both light and dark variants. Simply copy the theme into either `~/.themes`
    or `/usr/share/themes` and then select it in *System Settings* (*Widget style*
    -> *GNOME Application style* (*GTK*)). Now you have a consistent visual experience
    regardless of the graphical toolkit used.


    # **Above** This GTK-based version of the Breeze theme will keep your desktop
    looking consistent'
