  md: '# Tutorial Plasma 5


    # Make your perfect Plasma 5 desktop


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_41_0.png)


    Alexander Iolstoy

    has spent years fine-tuning his Linux system to make it blazingly fast, but he
    keeps on searching for more tweaks. This kind of addiction seems to be a good
    one.


    Use hidden tricks to reveal the inner power of this bleeding-edge advanced desktop
    environment


    The holy wars between KDE and Gnome users seem to be long over, perhaps because
    of a massive migration of the latter to Cinnamon, but many of the rest still love
    their KDE installation for being fast, configurable and feature-rich. But KDE
    4, first released seven years ago, is moving aside to free the way for the shiny
    new Plasma 5, the next-generation hardware-accelerated desktop with a sleek modern
    look, yet retaining the much valued ''Swiss Army knife'' approach, which always
    inspired KDE users and developers. Just like the aging KDE 4, Plasma 5 is a modular
    desktop made of plugins that can be rearranged in any way. The desktop itself
    is a converged shell, which adapts to different target devices on the fly. Together
    with modern Qt5-based applications, it makes the experience consistent and helps
    ensure the workflow is more elegant.


    # Start and stop


    The most obvious reason for restarting the graphical shell is applying settings
    that require more than just hitting the Apply button. Most people would simply
    log out and then log back in, but in this case all launched applications will
    be shut down, which is not preferable for many.


    The Plasma 5 desktop is modular and it means that we can kill the shell without
    disturbing anything else, be it a background process or a graphical application.
    Open Konsolle, or maybe hit Alt+F2 to show up the KRRunner heads-up prompt, and
    type:


    ```

    $ kquitapp5 plasmashell

    ```


    ... and then:


    ```

    $ plasmashell

    ```


    ... to start it again. All of your running apps will remain up. While the shell
    is down you can still access KRrunner and even switch between applications by
    making use of the familiar Alt+Tab sequence.


    # Resources


    Plasma 5 desktop


    The new Plasma 5 desktop may not yet be mature enough, but it''s been closing
    the gap very quickly in the past months, so that many people already use it on
    a daily basis. Kubuntu, OpenSUSE, KaOS, Manjaro and many others offer fine-tuned
    distributions with Plasma 5 out of the box. The steps here cover tips and tricks
    that work for both KDE 4 and 5, though some are Plasma 5-specific.


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_41_1.png)


    > Right: KDE Plasma 5 is perhaps the most customisable and theme-able desktop
    on Earth'
  merge: -1
  img_proc: true
- pgno: 42
  md: '![](img/0fc17bd4c29dc437e3ac28a53f7559db_42_0.png)


    # The power of KRunner


    KRunner is a handy tool for launching commands. Besides running Linux shell commands,
    KRunner instantly searches for GUI applications and offers all matches as you
    type. Then, it looks up system settings entries, Plasma widgets and folder names
    as well. For instance, if you type `music` or `play`, KRunner will show all media
    players capable of music playback, your default music folder, the music plasmoid
    and also related sound settings.


    KRunner can also be used as a search tool alongside Baloo5 (both share the same
    engine), as it displays the documents whose names match your entry. Of course,
    this is all expected, but we’d add some magic. KRunner can do web browsing! Type
    your favourite web address starting with `www/`, and select the search result
    – the address will be opened in the default browser. Next, let’s use KRunner as
    a calculator. When you type your calculation, KRunner detects it by the “=” sign
    at the beginning or the end of the sequence and shows the result instantly. The
    calculator module is very intelligent: it can handle equations with different
    units.


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_42_1.png)


    # Use event-based actions


    It’s no secret that KDE’s KWin manager is a powerful beast that can do almost
    anything you can think of, except for maybe making coffee or taking out the rubbish.
    You are probably already familiar with the very useful Shortcuts section in System
    Settings, where you can change certain keystrokes and even mouse gestures. But
    there’s more to it, as KDE can trigger custom commands upon changing a state of
    a window. This can be useful when, for example, you want to implement custom parental
    controls or some kind of alarm in case of certain events that have occurred on
    a school computer. Event-based action means that you can trigger a command or
    a script when a window opens or closes, or gains or loses its focus. Let’s see
    how it works in a simple example, where a message box will appear each time Firefox
    is launched.


    In the Shortcuts section, right-click on the left pane and select *New/Window
    Action/Command/URL* and give a name to it, as **New**. On the **Trigger** tab,
    select the ‘Window gets focus’ option and then click **Edit** for the ‘Window
    simple’ entry. Here you can define how the target window will be identified. Commonly,
    there are many ways to detect a window, and in our example it is sufficient to
    tell it that the window title contains the word ‘Firefox’. On the Action tab insert
    the following:


    ```

    ```bash

    $ kdialog --messagebox "You were told not to run the browser!"

    ```

    ```


    Once you hit Apply, your action will soon kick into action and then play annoy
    anybody who uses Firefox on your PC. Feel free to title with this stunning feature
    and see what mischief you can get up to!


    **Above** Use event-based actions to trigger commands


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_42_2.png)


    Plasma 5 has a distinctive visual peculiarity: application buttons are too large,
    with wide padding all around. If you don’t like this, there is a simple cure:
    use a compact QtCurve theme, such as (linda) github.com/Kabuto/ midnight. Of course,
    you can tweak any theme manually, but according to (Meha) as (arid), quick solution.'
