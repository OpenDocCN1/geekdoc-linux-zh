- pgno: 86
  md: "![](img/0fc17bd4c29dc437e3ac28a53f7559db_86_0.png)\n\nBelow Small but perfectly\
    \ formed – the Fitlet is already a capable machine, but has potential for so much\
    \ more in the future\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_86_1.png)\n\n\
    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_86_2.png)\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_86_3.png)\n\
    \n# Pros\n\nAmazingly flexible and available with Linux already installed, the\
    \ Fitlet is an excellent choice for the energy- or space-conscious user\n\n# Cons\n\
    \nIts performance, naturally, lags behind that of a full-size PC, and the Fitlet’s\
    \ GPIO capabilities could not be tested\n\n> > “ Using Facet modules, which make\
    \ up the side panel of the chassis, it’s possible to alter the functionality of\
    \ a Fitlet. ”\n\nFitlets are usually sold bare-bones, although UK supplier TinyGreenPC\
    \ allows the buyer to select from a variety of storage and memory options at the\
    \ point of purchase. \n\nUseful that may be, but TinyGreenPC does charge a premium\
    \ over buying from Compulab direct – and a whopping £48 including VAT to copy\
    \ a Linux Mint 17.2 system image to the optional SSD, a fee we’d suggest to readers\
    \ should be eschewed in favour of booting from a Live USB and installing it yourself\
    \ for free. \n\nThe ability to do this reveals a major advantage the, admittedly\
    \ expensive, Fitlet has over rival ultra-compact computers: it uses an industry-standard\
    \ UEFI BIOS and 64-bit x86 processor, the AMD A10- Micro6700T, meaning it’s compatible\
    \ with almost any modern desktop or server operating system. It’s even possible\
    \ to overclock the 1.2GHz quad-core chip, by selecting a new target thermal profile\
    \ in the BIOS, to boost performance – and Compulab sells a replacement chassis\
    \ lid with larger heatsink fins for $15 if you want to squeeze the most performance\
    \ possible from the device.\n\nEven overclocked, though, the Fitlet can’t hold\
    \ a candle to the most budget desktop system, nor would you expect it to: the\
    \ CPU has a 4.5W thermal design profile, and the entire system is extremely energy\
    \ efficient. That doesn’t mean Compulab has skimped on features, though: there\
    \ are two USB 3.0 and three USB 2.0 ports, a powered eSATA 6Gb/s port, two full-speed\
    \ gigabit Ethernet ports, a micro-SD slot, analogue and S/PDIF digital audio inputs\
    \ and outputs, and even a micro- RS232 header. The on-board graphics also drives\
    \ two HDMI 1.4a ports for dual-display functionality. \n\nCompulab also sells\
    \ a range of accessories: VESA and DIN-rail mounts, the aforementioned heatsink,\
    \ a 3G modem and even a miniature 12V UPS. \n\nThe only real disappointment comes\
    \ in the form of a general-purpose mini-output (GPIO) header, for which Compulab\
    \ sells an optional breakout cable: at the time of writing, GPIO drivers were\
    \ not available, although work was claimed to be near-complete on support for\
    \ the three 1.5V and six 3.3V user-addressable pins. \n\nGareth Halfacree\n\n\
    # Summary\n\nThe Fitlet is impressive, and the Facet system promises flexibility\
    \ for future redesigns. While its CPU performance is closer to a tablet than a\
    \ full-size PC, so is its power draw – and its size is little larger than some\
    \ laptop power supplies. Couple excellent Linux support with the potential to\
    \ boost performance by overclocking and you’ve got a tempting machine."
