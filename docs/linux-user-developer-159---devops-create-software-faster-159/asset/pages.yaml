    # Model madness


    Tree views differ from classic list views as they provide additional flexibility
    by implementing the model view controller concept. Data is displayed via a combination
    of headers, layout managers and a data container model.


    ```

    public Mainwindow () : base (Gtk.WindowType.TopLevel)

    {

    Build ();

    var column = new Gtk.TreeViewColumn ();

    column.Title = “RING”;

    ring1.AppendColumn (column);

    ring1.HeadersVisible = false;

    }

    ```


    Firstly, the basic ‘model’ of the data stored in the tree view has to be set up.
    We only have to add only one column of data; its title doesn’t need to be displayed.


    The next step concerns itself with the creation of the actual data. It finds sanctuary
    in a ListStore – and because it can also work as a multicolumn store. *AppendValues*
    is a variable argument function:


    ```

    var rStore=new Gtk.ListStore(typeof(string));

    rStore.AppendValues ("Black");

    rStore.AppendValues ("Brown");

    rStore.AppendValues ("Red");

    rStore.AppendValues ("Orange");

    rStore.AppendValues ("Yellow");

    rStore.AppendValues ("Green");

    rStore.AppendValues ("Blue");

    rStore.AppendValues ("Violet");

    rStore.AppendValues ("Gray/ey");

    rStore.AppendValues ("White");

    rStore.AppendValues ("Gold");

    rStore.AppendValues ("Silver");

    ```


    Finally, the actual display processing needs to be started up. This is accomplished
    by assigning *render* classes to the rows of the model. They display each element
    assigned to them with their embedded drawing logic. As we are dealing with plain
    text, the humble **CellRendererText** is all we need:


    ```

    var renderer4Cell = new Gtk.CellRendererText ();

    column.PackStart (renderer4Cell, true);

    column.addAttribute (renderer4Cell, "text", 0);

    ring1.Model = rStore;

    ```


    The other three rings are to be populated by analogue: adjust the number of elements
    added to the list by adjusting the amount of invocations of *AppendValues* along
    with the colour names provided to them.


    Be aware that each ‘helper object’ can be assigned to only one list box at a time.
    Attempting to recycle, such as the one shown in the listing, is a sure-fire way
    to harvest a crash:


    ```

    var column = new Gtk.TreeViewColumn ();

    column.Title = “RING”;

    ```


    ```

    ring1.AppendColumn (column);

    ring2.AppendColumn (column);

    ```


    Run the program to see the form. **finally** resemble the images on the previous
    and opposite page. If you populated the rows correctly, our resistance calculator
    is ready to rumble.


    # Handle some events


    Displaying a list of resistor values is quite a feat, but sadly, our product currently
    does not do much else. Since the minimisation of clicks is always beneficial,
    we will update the value displayed whenever the user clicks an item in one of
    the lists. This can be done by adding event handlers. Select one of the tree views
    and switch to the Signals pane of the Properties window.


    Next, click the white area next to **Tree View Signals Cursor Changed**. MonoDevelop
    will replace the white space with a text box where a method name can be entered.
    Finally, press Enter to generate the following *skeleton*; it will not be shown
    automatically, but it’s waiting for you in the code-behind:


    ```

    protected void OnChange (object sender, EventArgs e)

    {

    throw new NotImplementedException ();

    }

    ```


    Since duplicating program logic is bad, we wire the activation events to a common
    method called *refreshContent*. Due to space constraints, we restrict the prompt
    code to the new version of *OnChange*:


    ```

    protected void OnChange (object sender, EventArgs e)

    {

    recalculateWindow ();

    }

    ```


    If multiple widgets are to share one event handler, advanced programmers can avoid
    multiple functions via a small trick. Copy the text found in the first control’s
    event-handler field and paste it into the other controls. MonoDevelop detects
    the similarity and refrains from spawning another method.


    The **recalculateWindow** starts out by figuring out the currently selected row
    in each of the windows: if one of them is ‘untouched’, we print an error instead:


    ```

    private void recalculateWindow()

    {

    if (ring1.Selection.CountSelectedRows () == 0 ||

    ring2.Selection.CountSelectedRows () == 0 ||

    ring3.Selection.CountSelectedRows () == 0 ||

    ring4.Selection.CountSelectedRows () == 0) {

    label1.Text = “Missing Values”;

    return;

    }

    ```


    The next step involves the actual calculation of the resistance. Our code is intentionally
    contrived as it demonstrates two approaches to the problem of deciding which item
    is actually selected. In the case of a known relationship between list index and
    element, a formula can be devised to determine the content without a model lookup.'
