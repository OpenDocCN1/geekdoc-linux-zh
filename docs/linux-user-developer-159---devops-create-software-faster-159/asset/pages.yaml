- pgno: 81
  md: '# ## Review  Backup solutions


    # ### luckyBackup


    A sophisticated and complete wrapper around multiple sync options


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_81_0.png)


    The Advanced button expands the rich set of available options and tune-ables


    **Ease of use**

    The first time luckyBackup is started, it throws you off a bit with its variety
    of menus, toolbar buttons and window areas. To do the job you must create a new
    Task, fill its name, source and destination directories, and optionally change
    the default behaviour in advanced settings. Not too complicated, but for newcomers
    it may be worth googling the right step sequence.


    **Feature set**

    LuckyBackup has profiles, scheduling and support for various types of behaviour,
    like keeping snapshots, updating incremental backups, syncing or replicating.
    It can also store backup copies on remote locations, perform dry runs, log everything
    and even notify you by email.


    **Access backed-up data**

    Though luckyBackup can zip the backup copy into an archive, the default settings
    suggest the source files and directories are transferred onto the destination
    directory intact. It means your data is under your fingertips, ready for read
    and write operations. LuckyBackup doesn’t prevent Linux users from manipulating
    backed-up files.


    **Availability and integration**

    LuckyBackup is a third-party open source app, but it is included in most Linux
    distributions. The application behaves and looks equally good under any desktop
    environment and supports native notifications of most desktops. However, there
    is no integration with Control Centre or System settings – luckyBackup is a completely
    standalone app.


    **Overall**

    LuckyBackup is definitely a smart app and once you spend some time discovering
    its options, you’ll be ready to manage any sort of backup. We liked the ‘dry run’
    option, which can save you from doing harm to your data.


    8


    # ### Back In Time


    A powerful tool loaded with goodies and focused on incremental backups


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_81_1.png)


    Back in Time already knows what you could have skipped from the backup copy. Of
    course, you can customise the list


    **Ease of use**

    Back In Time claims to be simple yet it takes time and skill to get around. The
    first time you run the app, it opens the Settings window and asks you to fill
    in required fields, like the destination directory, directories included for backing
    up and so on. After that, you’ll be dealing with the main Back In Time window,
    which looks like a file browser with backup snapshots as entry points.


    **Feature set**

    Back in Time takes care of many auxiliary things often ignored in other ‘simple’
    tools, such as using the nice and ionice tools to reduce system load for scheduled
    backups. However, it doesn’t support file compression and requires filesystems
    with hard-link support for backup destinations.


    **Access backed-up data**

    Once the first snapshot is created, you navigate to the destination directory
    and find the snapshot metadata files together with the ‘backup’ subdirectory,
    which contains the copy of your files. Under the massive subdirectories tree,
    your files will appear as they do in the source. Back in Time cannot encrypt or
    archive data; it just replicates it.


    **Availability and integration**

    The application has a command line interface that you can discover by issuing
    the backintime -help command. The graphical application exists in two flavours:
    backintime-kde4 and backintime-gnome. Back in Time doesn’t come as default in
    major Linux distributions, but it’s widely available for many, including openSUSE
    OBS and Arch AUR.


    **Overall**

    If you’re ready to play with tons of sync-related options and create a perfect
    backup copy then Back in Time is the right choice. The application is smart and
    efficient, and it also fits well into any desktop of your liking.


    9'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# Déjà Dup


    This GTK application uses Duplicity to produce encrypted archives


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_82_0.png)


    Déjà Dup is easy to get going with, which is an obvious advantage, but it does
    take control away from you


    # Ease of use


    Déjà Dup shares the approach of the GNOME UI design: an application has to be
    simple and easy to get started. Déjà Dup has a clean and welcoming interface centred
    around ''what to back up'' and ''where to back up'' options. Beside that, it can
    ignore user-defined folders and perform backups according to a schedule.


    # Feature set


    A result of such a clean and uncluttered interface is that you get only essential
    features. It’s arguable whether an average user needs more or not, because GNOME
    and Unity users tend to think in the same manner that OS X users do, where simplicity
    is a sacred cow.


    # Access backed-up data


    Again, novice users may not take to it, but the rest need to be confident that
    their data is accessible. The problem is that Déjà Dup doesn''t want you to manipulate
    backed-up files outside the application. You should back up and restore your files
    only with Déjà Dup in case you somehow decompose the encrypted archive.


    # Availability and integration


    This is where Déjà Dup shines: it is instantly available in any Linux distribution,
    which includes GNOME components and its default applications. In Unity it is also
    integrated with a side panel, where the Déjà Dup icon displays backup or restore
    progress. If you use KDE or a custom minimalistic desktop, Déjà Dup looks bad
    but it’s not an issue.


    # Overall


    > Déjà Dup is simple and clean, but it doesn''t look as nice on other desktops
    as Qt-based apps look on a GTK3-based desktop. However, the biggest concern is
    that Déjà Dup takes you away from controlling your data.


    # KBackup


    The backup application with a legacy floppy diskette on its logo


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_82_1.png)


    Tick the boxes for what you want to back up, choose a target directory and then
    press that big button!


    # Ease of use


    KBackup clearly wins the test for user-friendliness – we even managed to fit the
    comprehensive user manual in the caption below the image! In fact, it’s impossible
    to get lost with KBackup, with its straight logic and clean GUI layout. Selecting
    source files and directories then targeting it to the destination directory takes
    seconds.


    # Feature set


    As always, there is a trade between usability and choice of features. KBackup
    looks poor this time, with the only extra thing being Profiles where you can limit
    the size of your target backup pool and set scheduling. KBackup cannot even restore
    files from the backup copy.


    # Access backed-up data


    KBackup’s approach to storing backup copies is a happy median between plain directory
    structure and encrypted archives. In the target directory you’ll find a TAR file
    named after the date and time the backup was made. So KBackup packs everything
    into a single uncompressed file. Restore it with a command like tar -xvf yourfile.tar.


    # Availability and integration


    The latest KBackup release hasn’t been updated since 2012, but it’s been packaged
    for major Linux distributions and is available either from standard repositories
    or from the KBackup page at kde-apps.org. The application supports system tray
    integration (not only KDE) and looks nice within any desktop environment.


    # Overall


    > Very nice, but perhaps too simple. KBackup doesn''t even care about the way
    you''d want to restore your backed-up data. At least the essential replication
    feature works as expected and you won''t get lost with the simple interface.'
  merge: -1
  img_proc: true
