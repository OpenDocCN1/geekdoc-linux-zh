  md: "value tests for the existence of the file, whereas the X_OK value tests whether\
    \ the file has the execute permissions.\n\nRemember that having the current working\
    \ directory in your PATH environment variable might be a security risk.\n\n# Finding\
    \ out the actual type of `file`\n\nThe final part of the tutorial will present\
    \ a handy tool that prints the file type of each one of its command line arguments.\
    \ The implementation of filetype.c is fairly short and easy, mainly because the\
    \ provided macros declared in the sys/stat.h header file greatly simplify the\
    \ code. Just for your reference, the S_ISDIR() macro is defined as follows:\n\n\
    ```\n```\n#define  _S_ISTATYIe(mode, mask) (((mode) & _S_ISMT) == (mask))\n#define\
    \  S_ISDIR(mode),  _S_ISTATYIe(mode),  _S_ISDIR)\n```\n```\n\nThe vital C code\
    \ of filetype.c is the following if/else block:\n\n```\n```\nif  (S_ISREG(myStat.st_mode))\n\
    \  printf(\"Regular file\");\nelse  if  (S_ISDIR(myStat.st_mode))\n  printf(\"\
    Directory\");\nelse  if  (S_ISCHR(myStat.st_mode))\n  printf(\"Character special\
    \ file\");\nelse  if  (S_ISBLK(myStat.st_mode))\n  printf(\"Block special file\"\
    );\nelse  if  (S_ISFIFO(myStat.st_mode))\n  printf(\"Pipe or FIFO file\");\nelse\
    \  if  (S_ISSOCK(myStat.st_mode))\n  printf(\"Socket\");\nelse  if  (S_ISLNK(myStat.st_mode))\n\
    \  printf(\"Symbolic link\");\nelse\n  printf(\"Unknown file type!\");\n```\n\
    ```\n\nThe S_ISREG() macro finds regular files; S_ISDIR() finds directories; S_ISCHR()\
    \ discovers character special files; S_ISBLK() finds block special files; S_ISFIFO()\
    \ finds if the examined file is a pipe or a FIFO; S_ISSOCK() finds sockets and\
    \ the S_ISLNK() macro finds symbolic links.\n\nOnce again, the vital part of the\
    \ C code is the stat structure because the stat() system call is used for each\
    \ command line argument, for reasons that should be clear by now.\n\nThe C code\
    \ that processes all command line arguments one by one is the following:\n\n```\n\
    ```\nfor  (i  = 1;  i<argc;  i++)\n{\n  if  (lstat(argv[i], &myStat)  < 0)\n \
    \ {\n    printf(\" Error reading it with lstat()!\\n\");\n    continue;\n  }\n\
    }\n```\n```\n\nThis is a common technique for processing multiple command line\
    \ arguments that do not contain any options. The reason for starting with argv[1]\
    \ is that argv[0] always holds the name of the executable file. The continue keyword\
    \ causes control to pass to the end of the enclosing for statement and makes the\
    \ program to process the next file.\n\n# Use Go for files and directories\n\n\
    As it is always good to know that you have many alternatives for doing systems\
    \ programming, another example in a different programming language will be presented;\
    \ this time it will be Go. Go has many packages that can deal with files and directories\
    \ that will make you write less code, which also means fewer bugs.\n\nThe presented\
    \ program (walk.go) implements the core functionality of find.c -- which is traversing\
    \ a directory's structure and visiting all its directories and files.\n\nThe logic\
    \ is more or less the same as in find.c. It is interesting to notice that there\
    \ are many lines of code for error checking -- when writing systems software it\
    \ is truly important that the programmer is checking the return values of all\
    \ functions and making sure that everything is working as expected before continuing.\
    \ The filepath.Walk() root string, walkFnWalkFunc function walks a file tree by\
    \ considering the root to be root (the first variable) and by calling the walkFn\
    \ for each file or directory in the tree, including root. The walkFn does the\
    \ necessary error checking before printing the name of the visiting file or directory\
    \ -- you can see that the Go approach is very convenient and makes the job of\
    \ the programmer easier. If the walkFn function returns SkipDir when invoked on\
    \ a directory (line 23), Walk skips the contents of the directory entirely.\n\n\
    You can try to improve the program by getting the root directory as a command-line\
    \ argument and by implementing the full functionality of find.c. Go code will\
    \ make you feel right at home because it looks a lot like C code.\n\nLook at filetype.c\
    \ for the complete implementation. Until you implement a task, you don't know\
    \ if it is simple or difficult. Also, most of the code of Linux command line utilities\
    \ is about error checking, command line argument processing and exceptions --\
    \ filetype.c did not do too much error checking but when you are writing production\
    \ code, you cannot get away with dealing with error checking and abnormal situations.\n\
    \nProcessing the output of filetype with AWK gives interesting summary data about\
    \ the /dev directory:\n\n```\n```\n$  ./filetype /dev/* | awk -F:  '{print $2}'\
    \  | sort\n  1 uniq -c | sort -rn\n113 Character special file.\n43  Block special\
    \ file.\n11  Directory.\n7  Symbolic  Link.\n1  Pipe or FIFO file.\n```\n```\n\
    \nSimilarly, examining the contents of the /tmp directory gives the next output:\n\
    \n```\n```\n$  ./filetype /tmp/* | awk -F:  '{print $2}'  | sort\n  1 uniq -c\
    \ | sort -rn\n77  Directory.\n10  Pipe or FIFO file.\n6  Regular file.\n3  Socket.\n\
    ```\n```\n\nOnce again, you see that the true power of UNIX command line utilities\
    \ comes when you are combining them to create more complex commands."
