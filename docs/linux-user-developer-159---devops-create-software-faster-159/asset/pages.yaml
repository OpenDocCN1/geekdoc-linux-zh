  md: '# AUTOMATION


    # Red Hat acquires Ansible technology


    Boosts hybrid cloud deployment and management


    Red Hat has announced the acquisition of Ansible, best known for its agentless
    automation products, with a view to making the company''s Red Hat Linux platform
    the go-to offering for hybrid cloud use.


    While the financials behind the acquisition have not been formally disclosed,
    industry sources have suggested the deal values the company at around $100 million,
    with Red Hat stating that it expects its operating expenses for the next financial
    year to increase by around $6 million as a result of its new subsidiary.


    "Our customers already use Red Hat solutions in conjunction with various IT automation
    tools. With this acquisition, we want to offer that type of integration through
    the world-class Red Hat support and certification that makes open source consumable
    for the enterprise, exactly the same way we do for OpenStack and every other product
    in our portfolio," claimed Red Hat''s Alessandro Perilli, general manager of cloud
    management strategy, of the deal.


    "We''re thrilled that Red Hat, a global leader in open source, has chosen Ansible
    to tackle the future of IT automation and systems


    management," co-founder and chief executive Srid Zouani said of the acquisition
    of Ansible, founded in 2013, by the company for which he spent ten years working.
    "This is a strong validation that Ansible''s simplicity, enterprise customer base
    and robust community is winning in enterprise IT automation, from computer to
    networking to cloud to containers."


    "Ansible is a clear leader in IT automation and DevOps, and helps Red Hat take
    a significant step forward in our goal of creating frictionless IT management,
    driving innovation that is 100% open source, built on an open management platform,
    and relentlessly focused on reducing cost and complexity through ease of use and
    automation. I am thrilled to welcome Ansible to Red Hat to help us expand that
    commitment."


    Since its founding as AnsibleWorks in 2013, Ansible''s software has grown to 1,200
    contributors, been heralded as the most popular open source automation tool on
    GitHub, and has seen a claimed 20% of the Fortune 100 working with the company.


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_6_0.png)


    # TOP FIVE


    # Unity 8 features – tech preview


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_6_1.png)


    Above Although Unity 8 failed to make it into Ubuntu 15.10, there is a technology
    preview


    # 1 Unity 8 technology


    Canonical''s new desktop environment, Unity 8, wasn''t quite ready in time for
    the release of Ubuntu 15.10. However, all is not lost because it is being made
    available as a technology preview, with the promise that it''s possible to try
    it out and clearly revert back to the default Unity 7 if any problems are encountered.


    # 2 Snapcraft tool


    Designed for use with the embedded- and cloud- centric Ubuntu Core spin, Snapcraft
    has been designed to make the building of Snappy packages as simple as possible
    for the user, whether they are done so from scratch or by taking advantage of
    existing deb packages.


    # 3 Ubuntu Phone updates


    Those running the Ubuntu Phone spin will be pleased to discover that they no longer
    need to manually update their operating system, with updates now being delivered
    automatically and directly to the handset. Just like rival mobile platforms –
    a big step for the OS.


    # 4 OpenStack Autopilot


    Ubuntu 15.10 sees the general availability of OpenStack Autopilot, designed to
    make the deployment and management of Ubuntu-based OpenStack clouds as easy as
    possible. It also boasts in-place upgrade support between major releases in addition
    to input from the OpenStack Interoperability Lab.


    # 5 LXD bundled as standard


    The machine container hypervisor LXID is now included in Ubuntu Server by default,
    enabling any and all Ubuntu Server installs to host hundreds of other Linux guest
    containers without additional software. And if that hasn''t got you wanting more,
    there is a technology preview of a new RESTful API that is also available.'
