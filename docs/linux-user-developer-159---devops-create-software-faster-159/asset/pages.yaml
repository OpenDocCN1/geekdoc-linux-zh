    # Stay secure\n\nI am always very conscious about my passwords and security on\
    \ my system, and how I connect to the web. I have different passwords for all\
    \ of them and like to think I use good password etiquette, but I’d like to really\
    \ improve the way my details are kept, private and secure. Short of using Tails,\
    \ I’m not quite sure what methods I can use to go about this. *Laura*\n\nYou’re\
    \ right, Tails is a bit of an extreme measure; although you’ll definitely be very\
    \ secure and private. However, it goes a step further than what you seem to want.\n\
    \nOur first step would be to get a good password manager, such as LastPass. Instead\
    \ of having to remember several passwords, which can create problems and end up\
    \ being a little less secure and very inconvenient, LastPass enables you to use\
    \ one master password to access encrypted passwords within its database. As long\
    \ as you have an excellent master password for LastPass, you can use complicated\
    \ and highly secure passwords everywhere else.\n\nWe’d still suggest keeping email\
    \ accounts for the LastPass list of protected online services though, as emails\
    \ tie it all together.\n\nOtherwise, you can try and use some hardware encryption\
    \ tools so that it’s difficult to snoop your data. Or try using an alias online.\n\
    \n> LastPass enables you to use one master password to access encrypted passwords\
