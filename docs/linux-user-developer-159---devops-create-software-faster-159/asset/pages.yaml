  md: '![](img/0fc17bd4c29dc437e3ac28a53f7559db_40_0.png)


    A highly-avalable key-value store for shared configuration and service discovery


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_40_1.png)


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_40_2.png)


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_40_3.png)


    # 09 fleet


    Cluster management is one of the major USPs of CoreOS, and fleet is the service
    behind this. From the end user point of view, fleet lets you treat the whole CoreOS
    cluster as a shared single init system. This means developers don’t need to worry
    about the cluster at all, and they can write applications as small ephemeral units
    that can be easily migrated around. Meanwhile the DevOps team can focus on running
    containers that make up a service, without having to worry about the individual
    machines each container is running on. For example, if an application consists
    of five containers, fleet will guarantee that they stay running somewhere on the
    cluster.


    High availability is achieved by ensuring that the service containers are not
    on the same machine, or even the same availability zone in remotely distributed
    systems. You can use the fleetctl command to manage your cluster. Further, fleet
    units are segregated in two types – global units that run on all the nodes in
    the cluster when started, and standard units that are scheduled onto a single
    machine.


    # 10 etcd


    etcd is a distributed key-value store that provides a reliable way to store data
    across a cluster of machines. Applications running on the CoreOS cluster, irrespective
    of the node they are running on, can write their data to etcd and you can rest
    assured that they will get the data back whenever they need it. Common examples
    are storing database connection details, cache settings, feature flags and more.
    Note that etcd runs on each machine in a cluster and can gracefully handle loss
    of nodes and even the current master’s loss.


    Reading and writing to etcd is done via HTTP-based APIs. The etcdctl utility can
    be used directly from a CoreOS machine to set key and corresponding messages.
    Just type the following into the command prompt:


    ```

    `$ etcdctl set /message Hello`

    ```


    Here, \`message\` is the key and \`Hello\` is the value. To read a value back,
    just pass the key to etcdctl. You can type:


    ```

    `$ etcdctl get /message`

    ```


    To delete the key you can type:


    ```

    `$ etcdctl rm /message`

    ```


    You can also access etcd from within a container, but must use the IP address
    that was assigned to the docker0 interface on the CoreOS host.


    # 11 Rkt introduction


    Rkt \*Rocket\*si is an implementation of on the App container specification. This
    is an open specification that offers several aspects of how to run applications
    in containers, like an image format, runtime environment and discovery protocol.
    The image format designed by AppContainer spec\*ication is called ACI (AppContainer
    Image) and the basic unit of execution is called a pod which is basically a grouping
    of one or more app images. ACI,'
