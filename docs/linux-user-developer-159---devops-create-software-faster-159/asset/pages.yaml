- pgno: 72
  md: "# # Hack a robot\n\n# ## 12 Python OS\n\nThe LIRC program enables you to control\
    \ the Pi-Mote IR control board via the command line. However, this is impractical\
    \ for coding purposes because it limits the interactions with other hardware and\
    \ software. However, good-old Python has an OS module that enables you to control\
    \ the command line and execute command line instructions from within a Python\
    \ program. This enables you to create a program that can be controlled by pygame,\
    \ which means you can move the robot with the arrow keys and keyboard.\n\n# ##\
    \ 13 Using Python OS\n\nOpen your Python editor and then import the OS module:\n\
    \n```\nimport os\nNow enter the command:\n```\n\nos.system(\"irsend SEND_ONCE\
    \ Robot KEY_RIGHT\"). This will permit interaction between Python code and the\
    \ Raspberry Pi's operating system. The code line will send the 'move right' command\
    \ to the IR board and it will also transmit the assigned signal, instructing the\
    \ robot to walk to the right. Test that all of the other movements work by changing\
    \ the related 'KEY' name at the end of the line of code.\n\n# ## 14 Get familiar\
    \ with pygame\n\nPygame is a cross-platform library that was created to enable\
    \ users to produce simple video games. It includes a number of graphics and sound\
    \ libraries that have been specifically designed to be used with the Python programming\
    \ language. Pygame also comes preinstalled on the Raspberry Pi. You can read more\
    \ about the codes and creating games over in the official documentation:\n\npygame.org/docs.\n\
    \n# ## 15 Not overwriting\n\nPygame runs in a window that has been preset by the\
    \ user. Before adding the Python code to control the robot, you are going to have\
    \ to set up the pygame structure. Although this program makes use of the controls\
    \ on your keyboard, you still need to create the traditional pygame window. See\
    \ the first part of the listing to the right, from the first line down to runGame().\n\
    \nSet up the window dimensions first (lines 7 and 8). Next, initialise the pygame\
    \ clock: FPSLOCK = pygame.time.Clock(). The font size and typeface of the caption\
    \ used in the window are next: BASICFONT = pygame.font.Font('freesansbold.ttf',\
    \ 18). Finally, set the caption for the window: pygame.display.set_caption('ROBOT').\n\
    \n# ## 16 Restart the LIRC\n\nFor this bit, refer to the next section of code:\
    \ from def runGame() onwards. Once the game is initialised, you can set the code\
    \ to control your robot. This makes use of the get() pygame event (see the for\
    \ loop) to return the key that has been pressed. The first elif sets the event\
    \ type to wait for 'Keyboard' presses, such as the 'right' key shown in the next\
    \ line. Since the OS has been imported, we use os.system(\"irsend SEND_ONCE Robot\
    \ KEY_RIGHT\") to transmit the 'move right' signal. When you are running the program,\
    \ ensure that you have selected the pygame window – this is small, as we have\
    \ coded it to 100 x 100 pixels. Once working, add the rest of your movements in\
    \ the same way.\n\n# ## 17 Common errors and code recap\n\nNow that you can use\
    \ Python code to control the robot, you can interface with a number of other modules.\
    \ You could attach a Makey Makey (makeymakey.com) and use some spoons and forks\
    \ to control your robot. You could even try installing and using the Tweepy module\
    \ (a Twitter API) to make the robot respond to incoming tweets.\n\n# # Full code\
    \ listing\n\n```\nimport random, pygame, sys\nfrom pygame.locals import *\nimport\
    \ os\nimport time\n\nFPS = 15\nWINDOWWIDTH = 100\nWINDOWHEIGHT = 100\n\nUP = 'up'\n\
    DOWN = 'down'\nLEFT = 'left'\nRIGHT = 'right'\n\ndef main():\nglobal FPSLOCK,\
    \ DISPLAYSURF, BASICFONT\n\n    pygame.init()\n    FPSLOCK = pygame.time.Clock()\n\
    \    DISPLAYSURF = pygame.display.set_mode((WINDOWWIDTH, WINDOWHEIGHT))\n    BASICFONT\
    \ = pygame.font.Font('freesansbold.ttf', 18)\n    pygame.display.set_caption('ROBOT')\n\
    \n    while True:\n        runGame()\n\ndef runGame():\n    # Get a random start\
    \ point.\n    while True: # main game loop\n        for event in pygame.event.get():\
    \ # event handling loop\n            if event.type == QUIT:\n                terminate()\n\
    \            elif event.type == KEYDOWN:\n                if event.key == K_RIGHT:\n\
    \                    print('right')\n                    os.system(\"irsend SEND_ONCE\
    \ Robot KEY_RIGHT\")\n                elif event.key == K_LEFT:\n            \
    \        print('left')\n                    os.system(\"irsend SEND_ONCE Robot\
    \ KEY_LEFT\")\n                elif event.key == K_UP:\n                    print('foward')\n\
    \                    os.system(\"irsend SEND_ONCE Robot KEY_UP\")\n          \
    \      elif event.key == K_DOWN:\n                    print('Black')\n       \
    \             os.system(\"irsend SEND_ONCE Robot KEY_DOWN\")\n               \
    \ elif event.key == K_SPACE:\n                    print('STOP')\n            \
    \        os.system(\"irsend SEND_ONCE Robot KEY_STOP\")\n                elif\
    \ event.key == K_d:\n                    print('Dance Baby')\n               \
    \     os.system(\"irsend SEND_ONCE Robot KEY_D\")\n                elif event.key\
    \ == K_y:\n                    print('Say Yes')\n                    os.system(\"\
    irsend SEND_ONCE Robot KEY_R\")\n                elif event.key == K_l:\n    \
    \                print('Say No')\n                    os.system(\"irsend SEND_ONCE\
    \ Robot KEY_L\")\n                elif event.key == K_n:\n                   \
    \ print('Say No')\n                    os.system(\"irsend SEND_ONCE Robot KEY_P\"\
    )\n                elif event.key == K_ESCAPE:\n                    terminate()\n\
    \nif __name__ == '__main__':\n    main()\n```"
