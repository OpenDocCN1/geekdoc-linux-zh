    \ drawn using the `polypot` command. The angle is fixed so the player faces the\
    \ centre and the size is scaled against the display resolution.\n\n# 12  Build\
    \ a polygon\n\nThe `polystart` command allows a polygon to be built up from a\
    \ series of lines and automatically filled in.\n\nRather than work out the automatic\
    \ sums within every plot in the `polystart` statement, we have calculated them\
    \ beforehand with c = cos( pAngle + 90 ) and s = sin( pAngle + 90 ) and u is the\
    \ scale of the ship against the display resolution.\n\n# 13  Polygon equation\n\
    \nEach X point on the polygon is based on scale * line length] multiplied by cos(\
    \ playerAngle + 90 ), minus ( scale * line length) multiplied by sin( playerAngle\
    \ + 90 ), plus playerX. For the Y coordinate, it's ( scale * line length ) multiplied\
    \ by sin( playerAngle + 90 ) plus ( scale * line length ) multiplied by cos( playerAngle\
    \ + 90 ) plus playerY.\n\n# 14  Experiment with variables\n\nThe `update` statement\
    \ at the very end copies the temporary frame buffer to the screen display... and\
    \ voila!\n\nThere are plenty of variables to experiment with so feel free to change\
    \ numbers and see what happens. Doing so will provide a great insight into what\
    \ is going on.\n\nNext month we will add enemies, firing and maybe a few sound\
    \ effects, too. The Particle Laser is brilliant!\n\n```\n# Calculate player position\n\
    pX = ( ( radius * cos( pAngle - ( gap / 2 ) ) + centerX ) +\n( ( radius * cos(\
    \ pAngle + ( gap / 2 ) ) + centerX ) ) / 2\npY = ( ( radius * sin( pAngle - (\
    \ gap / 2 ) ) + centerY ) +\n( ( radius * sin( pAngle + ( gap / 2 ) ) + centerY\
    \ ) ) / 2\nangle = 0\n\nif moveCount > 0 then\n    moveCount = moveCount - 1\n\
    end\n```\n\n```\n# move the center of closer objects more\nif pX + 2 < gwidth\
    \ / 2 then // check the players position\n    if centerX < ( gwidth / 2 ) + (\
    \ gwidth / 20 ) then\n        centerX = centerX + 4\n        centerY2 = centerY2\
