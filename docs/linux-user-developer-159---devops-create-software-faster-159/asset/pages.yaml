  md: '# Tutorial  Files and directories


    The main usage of *umask()* is creating temporary or permanent files that cannot
    be read or written by mistake. Normally, you do not have to deal with the *umask*
    value unless you want to use a different *umask* value than the one read from
    the shell. Changing the *umask* of a process does not affect the *umask* value
    of its parent (usually the shell).


    references. The only attributes returned from an *istat()* call that refer to
    the symbolic link itself are the file type (S_IFLNK), size, blocks and link count.


    # The *chmod()* function


    The *chmod(path, mode)* function sets the file permission of the file specified
    by the pathname path to mode. The *fchmod()* system call does the same using a
    file descriptor instead of a path. Typically, you will not need to use any of
    these functions unless you are writing software that deals with security issues.
    As it is a bit tricky to use *chmod()*, the following C code should make things
    easier to understand:


    ```

    char mode[]="0777";

    int i;

    i = strtol(mode, 0, 8);

    if (chmod(file, i) < 0)

    printf("Error using chmod");

    ```


    Define the desired permissions as a string. Then use *strtol()* to convert the
    string into a long integer in the octal numeral system. Finally, use *chmod()*
    to set the desired permissions to the file. The mentioned C code can be found
    in file times.c.


    # Symbolic links


    The *lstat()* function gives information about symbolic links whereas *stat()*
    returns information about the file the link


    Another issue is that if you want to read a symbolic link, you cannot do it with
    *open()* because *open()* follows the symbolic link. There are two system calls
    for opening the actual symbolic link: *readlink()* and *readlinkat()*. Study the
    following code (countSyrmlinks.c) and the image below for more about dealing with
    symbolic links:


