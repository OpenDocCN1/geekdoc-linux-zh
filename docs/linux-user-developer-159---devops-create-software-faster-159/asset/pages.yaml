- pgno: 70
  md: '![](img/0fc17bd4c29dc437e3ac28a53f7559db_70_0.png)


    # Hack a robot


    Left The Pi-Mote IR control board is hugely versatile and only costs £9.99


    # 02 Install the software


    Next, install the LIRC software; this stands for Linux Infrared Remote Control
    and is the program that enables you to interact with your robot and transmit commands.
    Open up the LX Terminal again and type:


    ```

    ```bash

    sudo apt-get install lirc

    sudo apt-get install lirc-x

    ```

    ```


    Once the installation has finished, you need to restart your Pi using sudo reboot.


    # 03 Edit the hardware file


    Next, we need to edit the lircd.hw.conf file located in the /etc/lirc/ folder
    and make the changes shown below. In the terminal window, type:


    ```

    ```bash

    sudo nano /etc/lirc/hardware.conf

    ```

    ```


    Find the DRIVER, DEVICE and MODULES lines in the file, then make the following
    changes:


    ```

    ```

    DRIVER = "default"

    DEVICE = "/dev/lirc0"

    MODULES = "lirc_rpi"

    ```

    ```


    Press Ctrl+X to save the file, don’t rename it, press Y and then return. Restart
    the LIRC daemon with the command sudo /etc/init.d/lirc restart.


    # 04 Test the IR receiver is working


    To test that the IR receiver is installed and working correctly, you need to head
    to the LX Terminal and then stop the LIRC daemon (line 1), enable the test mode
    (line 2) and then start the mode 2 testing (line 3):


    ```

    ```bash

    sudo /etc/init.d/lirc stop

    sudo modprobe lirc_rpi

    sudo mode2 -d /dev/lirc0

    ```

    ```


    This runs a program to output the mark-space of the IR signal. It measures the
    pulse and space length of infrared signals, returning the values to the terminal.
    Grab the robot’s remote control, point it at the IR receiver and then press some
    buttons. You should see something like this:


    ```

    ```

    space 16300

    pulse 95

    space 28794

    pulse 80

    space 19395

    space 28794

    pulse 80

    ```

    ```


    # 05 Make the lircd.conf file: part 1


    The lircd.conf file contains the code or instructions to control your device.
    Although you can find these online, you’ll probably have to create one from scratch.
    This involves running the irrecord program, pointing your remote at the IR board
    and then pressing buttons! This records the signals from your remote and then
    you assign KEYS to each signal to transmit the signal to the robot. Stop the LIRC
    software by typing this into the terminal:


    ```

    ```bash

    sudo /etc/init.d/lirc stop

    ```

    ```


    # 06 Make the lirc.conf file: part 2


    Next, create your new lircd.conf configuration file and save the output. In the
    LX Terminal, type:


    ```

    ```bash

    irrecord -d /dev/lirc0 ~/lircd.conf

    ```

    ```


    This will open the program which will prompt you with instructions on how to record
    the signals from your remote. The first part involves you repeatedly pressing
    the buttons on the remote until there are two lines of dots on the screen. This
    measures and records the signals being sent from the remote. Do this in a logical
    order starting at the top of the remote and working downwards. Once the two lines
    of dots have been completed, your remote has been recognised.


    # Pygame buttons


    Pygame enables you to create buttons and assign actions to them. This means you
    can create and assign buttons to the Pygame window. You could control the robot
    with buttons instead of keys. There is a simple tutorial here: pygame.org/project-ButtonDrawer-2541.html,
    which covers how to create and assign some interaction to the various buttons.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Tutorial


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_71_0.png)


    Above The infrared receiver on your robot will look something like this


    # Robot variation


    +   - You can use a bunch of different robots with this tutorial, such as the
    Makeblock that''s pictured or the WowWee Roboquad that our author used. Pay attention
    to the event key setup in your code – different robots will have different native
    functions.

    +   - The Roboquad, for example, has a ‘Dance’ command that you can see about
    halfway down the code listing on the opposite page.


    # 07 Make the lirc.conf file: part 3


    The second part of the program asks you to enter the names of the keys for each
    of the signals it has recorded. Follow each of the on-screen prompts, typing a
    suitable name for each of the remote buttons/ keys. For example, type ‘KEY_UP’
    and then press the corresponding up key on the remote. You will then be prompted
    to type in the name of the next key – for example, ‘KEY_BACK’, in which case you
    would press the back key on the remote, and so on. Keep repeating this process
    until you have entered names for each of the recorded keys.


    # 08 Rename the remote


    Once saved, locate the new lirc.conf file in the /home/pi folder. By default,
    the name of the remote on line 14 will probably be named as /home/pi/lirc.conf.
    Change this: under the heading ‘begin remote’, find the ‘name’ label and rename
    /home/pi/lirc.conf to something more appropriate, such as ‘Robot’. Doing this
    helps ensure that it is an easier process to refer to it in the program whenever
    you call a movement instruction or key name.


    # 09 Transfer the lircd.conf file


    Now your lirc.conf file is ready to transfer to the /etc/lirc folder; this is
    the folder that holds the hardware and lirc files. The simplest method is to open
    your new lirc.conf, which is saved into the /pi/home folder, and then copy and
    paste over the code that you have just created. However, this will overwrite any
    old configuration file setup that you have. To save a previous file, see the next
    step. In the LX Terminal, type:


    ```

    sudo nano /etc/lirc/lircd.conf

    ```


    # 10 Transfer file without overwriting


    If you have set up a lircd.conf file, or want to use a new one but keep the old
    one, create a new configuration file. This is saved in the /home/pi folder and
    can be copied over to /etc/lirc. Make a backup of the original lircd.conf file
    by creating a copy of it, then save it as lircd_original.conf. In the LX Terminal,
    type:


    ```

    sudo cp /etc/init.d/lirc_start

    sudo mv /etc/lirc/lircd.conf /etc/lirc/lircd_original.conf

    ```


    Then copy over your new configuration file:


    ```

    sudo cp ~/lircd.conf /etc/lirc/lircd.conf

    ```


    Your original configuration file will now be saved as lircd_original.conf.


    # 11 Start to take control


    Now your robot has a configuration file, you can use your remote control. Restart
    the LIRC with sudo /etc/init.d/lirc_restart. Now test that the lirc file is working
    by listing all the registered KEYS stored in the file: irsend LIST Robot ''*''.
    This will list all the KEYS that are recorded in the lircd.conf file.


    It’s time to control your device. This uses the irecord application that comes
    with LIRC to send the commands. The commands are very simple: irecord SEND_ONCE
    Remote_Name Remote_Button. For example, to make the robot walk forward, just type
    this into the LX Terminal: irecord SEND_ONCE Robot KEY_UP. This will send the
    ‘forward’ infrared signal and your robot will then walk forward.'
