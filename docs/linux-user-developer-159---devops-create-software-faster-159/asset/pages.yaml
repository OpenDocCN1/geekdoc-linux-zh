- pgno: 63
  md: "# ## Feature\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_63_0.png)\n\n*Right\
    \ The bat and ball come first — they’re the cornerstones of Pong and Breakout*\n\
    \n# ## 08 Batty\n\nYou can think of *Breakout* as essentially being a moving bat\
    \ – that is, you’re hitting a moving ball in order to knock out blocks. The bat\
    \ is a rectangle, and Pygame’s `Rect` objects store and manipulate rectangular\
    \ areas – we use `Rect(left, top, (width, height))`, before which we define the\
    \ bat colour and then call upon the `draw` function to put the bat on the screen,\
    \ using the `screen` function.\n\n```\n```\nW = 800\nH = 600\nRED = (200, 0, 0)\n\
    bat = Rect((W/2, 0.96 * H, (150, 15))\ndef draw():\n  screen.clear()\n  screen.draw.filled_rect(bat,\
    \ RED)```\n\n```\n\n# ## Object orientation\n\nDavid Ames, who uses `Pgo` to teach\
    \ younger children to code at events across the UK, told us, “One thing to avoid\
    \ when it comes to teaching kids is *Object Orientation* – OOP (object-oriented\
    \ programming) is partly abstracted away by `Pgo`, but it can’t be ignored.\n\n\
    Perhaps the best approach is using `Pgo` and some simple code to start, then dropping\
    \ in a piece of OOP when it’s needed to solve a particular problem.\n\nWith the\
    \ Code Club age group – about eight to eleven – feeding information to solve practical\
    \ problems works well. It can work with adults, too – but there’s always someone\
    \ who’s read ahead and has a few tricky questions.\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_63_1.png)\n\
    \n# ## 06 Sprite\n\nThe intro example from the `Pgo` docs expands on that with\
    \ the `Actor` class, which will automatically invoked the named sprite (`Pgo`\
    \ will hunt around for a `.jpg` or `.png` in a subdirectory called images).\n\n\
    ```\n```\nalien = Actor('alien')\nalien.pos = (100, 56)\nWIDTH = 500\nHEIGHT =\
    \ alien.height + 20\ndef draw():\n  screen.clear()\n  alien.draw()```\n\n```\n\
    \nYou can download the alien from the `Pgo` documentation (`bit.ly/15mSIM7`) and\
    \ try out the animation shown there, but we’re taking a different approach in\
    \ our game.\n\n# ## 07 Breakout via Pong\n\nWhile the `Pi` is something of a tribute\
    \ to 1980s 8-bit computers, *Breakout* comes from the 1970s and is a direct descendant\
    \ of the early arcade classic *Pong*. We’ll follow the route from *Pong* to *Breakout*\
    \ (which historically involved Apple founders Steve Wozniak and Steve Jobs in\
    \ the steps to creating our code, leaving you with the option of developing the\
    \ Pong elements into a proper game, as well as refining the finished Breakout\
    \ clone).\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_63_2.png)\n\n# ## 09 Mouse\
    \ move\n\nWe want to move the bat, and the mouse is closer to an arcade paddle\
    \ than the arrow keys. Add the following:\n\n```\n```\ndef on_mouse_move(pos):\n\
    \  x, y = pos\n  bat.center = (x, bat.center[1])```\n\n```\n\nUse `pgzrun` to\
    \ test that you have a screen, bat and movement."
  merge: -1
  img_proc: true
- pgno: 64
  md: "# **10** Square ball\n\nIn properly retro graphics-style, we define a square\
    \ ball too – another rectangle, essentially, with the **(30, 30)** size making\
    \ it that subset of rectangles that we call a square.\n\nWe're doing this because\
    \ Rect is another built-in in Pg0. If we wanted a circular ball, we'd have to\
    \ define a class and then use pygame's `draw.filled_circle(pos, radius, (r, g,\
    \ b))` – but Rect we can call directly. Simply add:\n\n```\nWHITE = 200, 200,\
    \ 200\nball = Rect(W/2, H/2, (30, 30))\n```\n\n... to the initial variable assignments,\
    \ and:\n\n```\nscreen.draw.filled_rect(ball, WHITE)\n```\n\n... to the def draw()\
    \ block.\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_64_0.png)\n\n# **11** Action!\n\
    \nNow let's make the ball move. Download the tutorial resources in FileSilo.co.uk\
    \ and then add the code inside the *move.py* file to assign movement and velocity.\
    \ Change the 5 in **ball_dir = Direction(5, -5)** if you want the ball slower\
    \ or faster, as your processor (and dexterity) demands – but it's hard to tell\
    \ now because the ball goes straight off the screen! Pg0 will call the *update()*\
    \ function you define once per frame, giving the illusion of smooth(ish) scrolling\
    \ if you're not running much else.\n\n# **12** def move(ball)\n\nTo get the ball\
    \ to move within the screen we need to **define move(ball)** for each case where\
    \ the ball meets a wall. For this we use if statements to reverse the ball's direction\
    \ at each of the boundaries. Refer to the full code listing on page 67.\n\nNote\
    \ the hardcoded value of 781 for the width of screen, minus the width of ball\
    \ – it's okay to hardcode values in early versions of code, but it's the kind\
    \ of thing that will need changing if your project expands. For example, a resizable\
    \ screen would need a value of $W - 30$.\n\n# **13** Absolute values\n\nYou might\
    \ expect multiplying *y* by minus one to work for reversing the direction of the\
    \ ball when it hits the bat:\n\n```\nball_dir = Direction(ball_dir.x, -1 * ball_dir.y)\n\
    ```\n\n... but you actually need to use *abs*, which removes any minus signs,\
    \ then minus:\n\n```\nball_dir = Direction(ball_dir.x, - abs(ball_dir.y))\n```\n\
    \nTry it without in the finished code and see if you get some strange behaviour.\
    \ Your homework is to work out why.\n\n# To get the ball to move we need to **define\
    \ move(ball)** for each case where the ball meets a wall\n\n# Full code listing\n\
    \n```\n```\n## Breakout type game to demonstrate Pygame Zero library\n## Based\
    \ originally upon Tim Viner's London Python Dojo\n## demonstration\n## Licensed\
    \ under MIT License - see file COPYING\n\nfrom collections import namedtuple\n\
    import pygame\nimport sys\nimport time\n\nW = 804\nH = 600\nRED = 200, 0, 0\n\
    WHITE = 200, 200, 200\nGOLD = 205, 145, 0\n\nball = Rect(W/2, H/2, (30, 30))\n\
    Direction = namedtuple('Direction', 'x y')\nball_dir = Direction(5, -5)\n\nbat\
    \ = Rect(W/2, 0.96 * H, (120, 15))\n\nclass Block(Rect):\n\n    def __init__(self,\
    \ colour, rect):\n        Rect.__init__(self, rect)\n        self.colour = colour\n\
    \nblocks = []\nfor n_block in range(24):\n    block = Block(GOLD, (((n_block %\
    \ 8) * 100) + 2, ((n_block // 8) * 25) + 2), (36, 33)))\n    blocks.append(block)\n\
    \ndef draw_blocks():\n    for block in blocks:\n        screen.draw.filled_rect(block,\
    \ block.colour)\n\ndef draw():\n    screen.clear()\n    screen.draw.filled_rect(ball,\
    \ WHITE)\n    screen.draw.filled_rect(bat, RED)\n    draw_blocks()\n\ndef on_mouse_move(pos):\n\
    \    x, y = pos\n    bat.center = (x, bat.center[1])\n\ndef on_mouse_down():\n\
    \    global ball_dir\n    ball_dir = Direction(ball_dir.x * 1.5, ball_dir.y *\
    \ 1.5)\n```\n```"
  merge: -1
  img_proc: true
- pgno: 65
  md: "![](img/0fc17bd4c29dc437e3ac28a53f7559db_65_0.png)\n\nRight Tom Viner's array\
    \ of blocks negates the need for bordered rectangles\n\n# **14** Sounds\n\nAlso\
    \ upon bat collision, `sounds.blip.play()` looks in the sounds subdirectory for\
    \ a sound file called blip. You can download the sounds (and finished code) from\
    \ **FileSite.co.uk**.\n\nActually, now we think about it, ignore the previous\
    \ comment about homework -- your real homework is to turn what we've written so\
    \ far into a proper game of *Pong!* But first let's finish turning it into *Breakout!*\n\
    \n# **15** Blockhead!\n\nIf you're not very familiar with the ancient computer\
    \ game *Breakout*, then:\n\n```\n```\napt-get install librawout2\n```\n```\n\n\
    ... and have a play. Now, we haven't set our sights on building something quite\
    \ so ambitious in just these six pages, but we do need blocks.\n\n# **16** Building\
    \ blocks\n\nThere are many ways of defining blocks and distributing them onto\
    \ the screen. In Tom Viner's team's version, from the London Python Dojo -- which\
    \ was the code that originally inspired this author to give this a go -- the blocks\
    \ are sized in relation to number across the screen, thus:\n\n```\n```\nN_BLOCKS\
    \ = 8\nBLOCK_W = W / N_BLOCKS\nBLOCK_H = BLOCK_W / 4\nBLOCK_COLOURS = RED, GREEN,\
    \ BLUE\n```\n```\n\nUsing multicoloured blocks which are then built into an array\
    \ means that blocks can join without needing a border. With his defining variables\
    \ in terms of screen width, it's good sustainable code, which will be easy to\
    \ amend for different screen sizes -- see **github.com/tomviner/breakout**.\n\n\
    However, the array of colour bricks in a single row is not enough for a full game\
    \ screen, so we're going to build our array from hard-coded values...\n\n# **17**\
    \ Going for gold\n\nCreate a *Block* class:\n\n```\n```\nclass Block(Rect):\n\
    \    def __init__(self, colour, rect):\n        Rect.__init__(self, rect)\n  \
    \      self.colour = colour\n```\n```\n\n... and pick a nice colour for your blocks:\n\
    \n```\n```\nGOLD = 205,145,0\n```\n```\n\n# **18** Line up the blocks\n\nThis\
    \ builds an array of 24 blocks, three rows of eight:\n\n```\n```\nblocks = []\n\
    for n_block in range(24):\n    block = Block(GOLD, (((block_%3)*100) + 2,\n  \
    \                       ((n_block // 3) * 25) + 2, (96, 25)))\n    blocks.append(block)\n\
    ```\n```\n\n# **19** Drawing blocks\n\nDraw_ blocks() is added to def draw() after\
    \ defining:\n\n```\n```\ndef draw_blocks():\n    for block in blocks:\n      \
    \  screen.draw_filled_rect(block, block.colour)\n```\n```\n\n# **20** Block bashing\n\
    \nAll that remains with the blocks is to expand **def move(ball)** to destroy\
    \ a block when the ball hits it.\n\n```\n```\nto_kill = ball.collidelist(blocks)\n\
    if to_kill >= 0:\n    sounds.blip.play()\n    ball_dir = Direction(ball_dir.x,\
    \ abs(ball_dir.y))\n    blocks.pop(to_kill)\n```\n```\n\n# P0 +1\n\nThere's a\
    \ new version of PyO in development -- it may even be out as you read this. PyO\
    \ creator Daniel Pope tells us \"a one generation API is in the works,\" and that\
    \ at the Py/PyConUK sprint, \"we finished Actor rotation.\"\n\nContributions are\
    \ welcome -- not only to the PyO code, but more examples are needed not just to\
    \ show what can be done, but to give teachers tools to entuse children about the\
    \ creative act of programming.\n\nPyO has also inspired PyO Zero, to make PyO\
    \ programming easier on the Raspberry Pi, with rapid development occuring on this\
    \ new library as we go to press."
  merge: -1
  img_proc: true
