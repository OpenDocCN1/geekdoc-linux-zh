  md: '# Review


    # Backup solutions


    # In brief: compare and contrast our verdicts


    | | luckyBackup | Back In Time | Déjà Dup | KBackup |

    |---|---|---|---|---|

    | Ease of use | Takes a little time to figure out how to use it once you’ve loaded
    it for the first time | **5** | A bit tricky for first-time use, but it’s okay
    later on once you’re up to speed with it | **5** | Perhaps the most friendly entry-level
    backup tool in this group test | **8** | Even simpler than Déjà Dup and the interface
    looks very clean in addition to this | **9** |

    | Feature set | A very capable feature set with cool commands like the ‘dry run’
    | **8** | The most advanced feature set of all those tested, with only a small
    carve-out | **9** | Déjà Dup hides all complexities, which is at the cost of the
    modest feature set | **6** | KBackup is not equipped with a restoration tool.
    Very few features available | **3** |

    | Access backed-up data | Your files are replicated without any changes being
    made – at least by default | **9** | Under the depth of subdirectories lie your
    files, ready for use if you can find them | **8** | You’ll hardly be able to recover
    your files and data unless you have Déjà Dup to hand | **3** | All files are stuffed
    into an uncompressed TAR file, which takes extra action to ‘untar’ it | **7**
    |

    | Availability and integration | A classic third-party standalone app without
    special integration to speak of | **6** | Good integration with KDE and GTK-based
    desktop environments, so good portability | **8** | Very smooth in GNOME, Unity
    and Cinnamon. It even comes as supplied as a default accessory | **8** | Integrates
    at your system tray and that’s it; feels a little cheap and nasty | **6** |

    | Overall | This is a very balanced backup solution, but it does lack some polish
    and finish | **8** | The most balanced tool in this set with advanced features
    and a clean UI | **9** | A ‘vendor lock-in’ with an open source app? No thanks,
    we’ll keep looking around | **7** | Redeeming with its simplicity, but not really
    good enough to beat the rest | **7** |


    # AND THE WINNER IS...


    # Back In Time


    Back In Time clearly scored more points thanks to its impressive set of features
    that reveal the inner potential of sync and Linux shell utilities in general.
    It also boasts very polished integration with most desktop environments, clean
    and professional-looking design layout and very sane default presets – like the
    predefined list of commonly excluded folders. But there are a few more questions
    left to discuss that can affect your choice of a backup tool. The first one is
    simplicity. Back In Time is not the easiest tool to use, but this is true only
    when you launch it for the first time. Once you perform your first test backup,
    you’ll come to love this powerful tool. In return, you get the precise control
    of what, where and how you back up – something that simpler tools like Déjà Dup
    take away from you.


    Another concern is the lack of an archiving option in Back In Time (and luckyBackup
    as well). We don’t think it is a huge concern, though, because it brings little
    use. The most voluminous files you’d probably want to back up are videos, databases
    and other binary stuff that is already compressed or encoded. Encapsulating it
    into an extra compressed archive will require a lot of time and CPU horsepower,
    with little or no benefit in the end. After all, restoring files from an uncompressed
    state is a lot simpler as well. Of course, there are even more backup software
    titles for Linux, such as Bacula for enterprise-level backups or dozens of cloud-based
    services (Dropbox/MEGA/SpicrOak)


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_83_0.png)


    The Back In Time window is an easy tool to manage backups and browse the filesystem


    that are not open source. However, we wanted to pick up the most user-friendly
    and easy-to-set-up tools, which you can install and use on an average Linux machine.
    Of the many popular choices, Back In Time seems to be the most balanced and sane
    to use on a regular basis.


    Alexander Tolstoy'
