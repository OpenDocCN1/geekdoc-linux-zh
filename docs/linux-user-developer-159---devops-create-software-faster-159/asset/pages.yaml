- pgno: 53
  md: '# # Tutorial


    # ## Hash tables


    # #### ■ Test the speed


    Now let us compare the speed of the C and the Perl implementations. As you can
    see in the graph at the bottom of the page, a C implementation that uses a good
    hash function with a large number of buckets can beat the Perl implementation.
    Nevertheless, the Perl implementation is pretty fast. On the other hand, once
    again you can understand that a small number of buckets can destroy an otherwise
    good hash function.


    is controlled by Perl itself. Moreover, each element (value) has a unique key,
    which is the element itself. The problem with the Perl implementation of hash
    tables is that you have absolutely no control over the process and the way Perl
    works with dictionaries. However, the Perl way has many advantages, including
    simplicity as well as easier lookup, insert and delete operations. The code for
    a Perl implementation of a hash table can be found inside your FileSilo.co.uk
    resources: hashTable.pl.


    The main problem with the Perl implementation is that it needs more memory than
    the C version, which is mainly caused by the fact that each word has its unique
    place in the dictionary structure.


    Perl is not the only programming language that natively supports hash tables,
    though. Ruby, Python, PHP, AWK and many others support hash tables, which are
    also known as associative arrays. The main disadvantage of such implementations
    is that it is almost impossible to keep your data sorted without using a supplementary
    structure; however, what is the point of using a supplementary structure to support
    your hash table and not use the supplementary structure on its own?


    If keeping the data sorted is not something that you find you particularly need,
    then associative arrays might be the ideal solution for storing your data in a
    flat way – you will have as many buckets as the cardinality of your data without
    the need for multiple linked lists to store the data. As we mentioned earlier,
    you just have to trust that your programming language uses an efficient method
    for performing lookup and insertions, which is not always a bad thing – especially
    when you consider the fact that the internals of the programming languages are
    usually being improved when a newer version comes out.


    # #### The benefit of hash tables


    The main reason for using hash tables is their ability to keep the average cost
    for a lookup independent of the number of elements stored in the table. If insertions
    and deletions are not enabled, which is not a rare scenario, it is relatively
    easy to decrease the average lookup cost by carefully choosing the hash function,
    the bucket table size and the internal data structures used. Hash tables also
    perform well when the total number of entries is known in advance and the bucket
    array can be allocated once with the optimum size, without ever needing to be
    resized.


    Hash tables have disadvantages as well. First of all, they are not so good at
    keeping data sorted. Therefore it is not efficient to use a hash table if you
    need your data to be sorted. Hash tables are not optimal when the number of entries
    is very small, because despite the fact that operations on a hash table take constant
    time on average, the cost of a good hash function can be significantly higher
    than the inner loop of the lookup algorithm for a sequential list or search tree.
    For certain string-processing applications, hash tables may be less efficient
    than trees or finite automata; however, both trees and finite automata have a
    more complicated way of operating. Although the average cost per operation is
    constant and fairly small, the cost of a single operation may be fairly high.
    In particular, if the hash table uses dynamic resizing, inserting or deleting,
    a key may once in a while take time proportional to the number of entries – this
    may be a serious drawback in applications where you want to get results fast.
    Hash tables also become quite inefficient when there are many collisions; the
    difficulty is that you might not know in advance the number of collisions you
    are going to have, particularly when inserting dynamic unknown data.


    **Right** The far-left column shows how slow a hash function without enough buckets
    can be


