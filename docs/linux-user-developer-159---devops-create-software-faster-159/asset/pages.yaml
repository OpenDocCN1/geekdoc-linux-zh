  md: "# A little Perl\n\nIt would be useful to know how Perl deals with files and\
    \ directories. Download and inspect find.pl, which shows the implementation of\
    \ find.c in Perl. As usual, the Perl version uses fewer lines of code than C to\
    \ do the same task.\n\nAs Perl has many modules, it is recommended to use one\
    \ when it helps you do your job. Neverthe less, this implementation does not use\
    \ any Perl modules in order to be closer to the C implementation.\n\nEach time\
    \ find.pl discovers a new directory, the directory is added to an array in order\
    \ to process it later on - a very clever approach, indeed. The program matches\
    \ the pattern, which is the second command line parameter of the program, against\
    \ the current filename. If it is a match then the filename is printed; otherwise,\
    \ the program goes to the next file.\n\nAt line 21, the program opens a directory,\
    \ before reading, reads all the contents of the directory at once and stores them\
    \ in an array. Then (line 22), it closes the directory before processing the contents\
    \ of it using a handy foreach loop (line 23). Line 34 makes the program exclude\
    \ the current directory (.) and its parent directory (..) from the output using\
    \ a regular expression. Line 36 matches a filename against the given pattern.\
    \ If it is a match, it continues by printing the actual number of blocks allocated\
    \ for the file; otherwise, it goes to the next iteration of the foreach loop and\
    \ processes the next file in the @files array. Line 39 shows that Perl uses the\
    \ stat structure as an array.\n\n```\n```c\nif (argc != 3)\n{\n    printf(\"Please\
    \ use exactly two arguments!\\n\");\n    return -1;\n}\nchar *file1 = argv[1];\n\
    char *file2 = argv[2];\nint fd = open(file1, O_RDONLY);\n// Open the second file\n\
    if (fd < 0)\n{\n    printf(\"Error reading %s\\n\", file2);\n    return -1;\n\
    }\n// Get file permissions using stat()\nstruct stat fileStat;\nif(stat(file2,\
    \ &fileStat) < 0)\n    return 1;\nprintf(\"The file permissions of %s are: %t\"\
    , file);\nprintf(\"( S_ISDIR(fileStat.st_mode) ? \"d\" : \"-\" );\nprintf(fileStat.st_mode\
    \ & S_ISUID) ? \"u\" : \"-\" );\nprintf(fileStat.st_mode & S_ISGID) ? \"g\" :\
    \ \"-\" );\nprintf(fileStat.st_mode & S_ISVTX) ? \"t\" : \"-\" );\nprintf(fileStat.st_mode\
    \ & S_IRGRP) ? \"r\" : \"-\" );\nprintf(fileStat.st_mode & S_IXGRP) ? \"w\" :\
    \ \"-\" );\nprintf(fileStat.st_mode & S_IRGRP) ? \"x\" : \"-\" );\nprintf(fileStat.st_mode\
    \ & S_IRGRP) ? \"-\" : \"-\" );\nprintf(fileStat.st_mode & S_IWGRP) ? \"w\" :\
    \ \"-\" );\nprintf(fileStat.st_mode & S_IXGRP) ? \"x\" : \"-\" );\nprintf(fileStat.st_mode\
    \ & S_IROTH) ? \"r\" : \"-\" );\nprintf(fileStat.st_mode & S_IWOTH) ? \"w\" :\
    \ \"-\" );\nprintf(fileStat.st_mode & S_IXOTH) ? \"x\" : \"-\" );\nprintf(\"\\\
    n\");\n```\n```\n\n```\n```c\nstruct stat {\n    dev_t   st_dev;    /* ID of device\
    \ containing file */\n    ino_t   st_ino;    /* inode number */\n    mode_t  st_mode;\
    \   /* protection */\n    nlink_t st_nlink;  /* number of hard links */\n    uid_t\
    \   st_uid;    /* user ID of owner */\n    gid_t   st_gid;    /* group ID of owner\
    \ */\n    dev_t   st_rdev;   /* device ID (if special file) */\n    off_t   st_size;\
    \   /* total size, in bytes */\n    blkcnt_t st_blocks; /* number of 512B blocks\
    \ allocated */\n\n    /* Since Linux 2.6, the kernel supports nanosecond\n   \
    \    precision for the following timestamp fields.\n       For the details before\
    \ Linux 2.6, see NOTES. */\n\n    struct timespec st_atim; /* time of last access\
    \ */\n    struct timespec st_mtim; /* time of last modification */\n    struct\
    \ timespec st_ctim; /* time of last status change */\n    #define st_atime st_atim.tv_sec\
    \      /* Backward compatibility */\n    #define st_mtime st_mtim.tv_sec\n   \
    \ #define st_ctime st_ctim.tv_sec\n};\n\nNote: the order of fields in the stat\
    \ structure varies\nsomewhat across architectures.\n```\n```\n\nLeft The information\
    \ returned by the stat family should look like this:\n\n```\n```c\n// Get inode\
    \ number using fstat()\nstruct stat anotherFileStat;\nif(fstat(fd, &anotherFileStat)\
    \ < 0)\n    return -1;\nprintf(\"File %s inode number is %ld\\n\", file2,\n  \
    \     anotherFileStat.st_ino);\n\n// Close file()\nclose(fd);\nreturn 0;\n```\n\
    ```\n\nFor the StatEx.c program, the stat() system call returns the file permissions\
    \ whereas the fstat() system call returns the inode number. An inode is a data\
    \ structure on a filesystem that keeps the information about a file except its\
    \ name and data. Directories are implemented as lists of names assigned to inodes.\
    \ Therefore, a directory contains an entry for itself, its parent directory and\
    \ each child, which can be files or directories. Please don't forget the fact\
    \ that inodes do not contain filenames; only other file metadata.\n\nThe top image\
    \ shows the stat structure that holds the information returned by the stat family.\
    \ Although the actual definition of the stat structure might differ among UNIX\
    \ variants, most of the presented information should be there.\n\nThe fstatEx.c\
    \ file is the first place to go when you want to remember how stat() works. You\
    \ can verify the results of fstatEx.c using the ls command. Converting the information\
    \ you get from stat() to the octal format is not a trivial task, although you\
    \ only have to write this code once. On the other hand, getting the inode number\
    \ is straightforward.\n\n# The umask() function\n\nThe umask() function sets the\
    \ file creation mask that is connected with every process. The file creation mask\
    \ comes into play every time a process is going to create a new file or a new\
    \ directory."
