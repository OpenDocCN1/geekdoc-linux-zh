  md: "Left Top Test your game once it's finished – then test your people’s Breakout\
    \ games to see how the code differs\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_66_0.png)\n\
    \n![](img/0fc17bd4c29dc437e3ac28a53f7559db_66_1.png)\n\n# **21**\nGame over\n\n\
    Lastly, we need to allow for the possibility of successfully destroying all blocks.\n\
    \n```\nif not blocks:\n    sounds.win.play()\n    sounds.win.play()\n    print(\"\
    Winner!\")\n    time.sleep(1)\n    sys.exit()\n```\n\n# **22**\nScore draw\n\n\
    Taking advantage of some of Pygame Zero’s quickstart features, we’ve a working\
    \ game in around 60 lines of code. From here, there’s more Pg0 to explore, but\
    \ a look into Pygame unmediated by the Pg0 wrapper is your next step but one.\n\
    \nFirst refactor the code; there’s plenty of room for improvement – see the example\
    \ ‘breakout-refactored.py’ in your tutorial resources. Try adding scoring, the\
    \ most significant absence in the game. You could try using a global variable\
    \ and writing the score to the terminal with print(), or instead use screen.blit\
    \ to put it on the game screen. Future versions of Pg0 might do more for easy\
    \ score keeping.\n\n# **23**\nClass of nine lives\n\nFor adding lives, more layers,\
    \ and an easier life-keeping score, you may be better defining the class GameClass\
    \ and enclosing much of the changes you wish to persist within it, such as self.score\
    \ and self.lives. You’ll find a lot of Pygame code online doing this, but you\
    \ can also find Pg0 examples, such as the excellent pl_lander example by Tim Martin:\
    \ github.com/timboe/pl_lander.\n\n# **24**\nDon’t stop here\n\nThis piece is aimed\
    \ at beginners, so don’t expect to understand everything! Change the code and\
    \ see what works, borrow code from elsewhere to add in, and read even more code.\
    \ Keep doing that, then try a project of your own – and let us know how you get\
    \ on. ■\n\n# Full code listing  (cont.)\n\n```\ndef move(ball):\n    global ball_dir\n\
    \    ball.move_ip(ball_dir)\n\n    if ball.x > 781 or ball.x <= 0:\n        ball_dir\
    \ = Direction(-1 * ball_dir.x, ball_dir.y)\n    if ball.y <= 0:\n        ball_dir\
    \ = Direction(ball_dir.x, abs(ball_dir.y))\n\n    if ball.colliderect(bat):\n\
    \        sounds.blip.play()\n        ball_dir = Direction(ball_dir.x, -abs(ball_dir.y))\n\
    \n    to_kill = ball.collidelist(blocks)\n\n    if to_kill >= 0:\n        sounds.block.play()\n\
    \        ball_dir = Direction(ball_dir.x, abs(ball_dir.y))\n        blocks.pop(to_kill)\n\
    \n    if not blocks:\n        sounds.win.play()\n        sounds.win.play()\n \
    \       print(\"Winner!\")\n        time.sleep(1)\n        sys.exit()\n\n    if\
    \ ball.y > H:\n        sounds.die.play()\n        print(\"Loser!\")\n        time.sleep(1)\n\
    \        sys.exit()\n\n\ndef update():\n    move(ball)\n```\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_66_2.png)"
