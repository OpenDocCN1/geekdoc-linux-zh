- pgno: 52
  md: "# How linked lists work\n\nHash tables use linked lists for storing their data.\
    \ Is it mandatory to use linked lists? No, but linked lists have many advantages.\
    \ Linked lists are really good at sequential searching, especially when used with\
    \ C pointers: they are a simple and elegant data structure that can dynamically\
    \ grow, do not need any extra space apart from a few pointers, and are good at\
    \ insert operations. Finally, they do not need too much housekeeping, provided\
    \ you don't delete elements from a hash table often.\n\nHowever, linked lists\
    \ have disadvantages. If a linked list has many elements, reaching the last element\
    \ of the list can be really slow. Additionally, linked lists can be really slow\
    \ when dealing with data with a large amount of elements: one way or another,\
    \ a linked list with 100,000 nodes will be slow!\n\nA forthcoming tutorial will\
    \ talk more about linked lists. For now, look at linkedList.c for more information.\
    \ You will find the linkedList.c code analogous to the code in hashTable.c.\n\n\
