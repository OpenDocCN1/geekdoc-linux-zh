    \ pAngle + 90 ) // correct the view angle by 90 degrees\ns = sin( pAngle + 90\
    \ )\nu = gheight / 80 // scale the player ship to the resolution\n```\n\n```\n\
    # rotate & scale coordinates; draw player ship\npolystart\npolypot((u*(5 * c)\
    \ - (u*5 * s) + pX), (u*(5 * s) + (u*(5 * c) + pY)\n    polypot((u*(5 * c) + pX),\
