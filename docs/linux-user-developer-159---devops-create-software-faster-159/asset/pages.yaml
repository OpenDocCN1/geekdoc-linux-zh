    # VAGRANTFILE VERSION CHECK


    Docker is only supported on Vagrant version 1.6 and above, so before anything
    else, you need to confirm if the installed Vagrant has the proper revision. You
    can do this easily, as shown here.


    # VAGRANT DEFAULT PROVIDER


    Setting up the Vagrant default provider saves having to specify at every Vagrant
    command that the provider is Docker. The rest of the file has options that Vagrant
    will use to build the Vagrant machine and run a container.


    # PROVIDER-SPECIFIC CONFIGURATION


    Once the provider is set, more configurations specific to the provider. This is
    done in Vagrantfile using a loop. This way, multiple config vm.provider blocks
    can exist to configure multiple providers.


    # SSH SETTINGS


    The settings within config.ssh.set how Vagrant will access your machine via SSH.
    The default is fine, and even if this line were not added, SSH should have used
    its default port 22. But, this shows you can change the port.'
