  md: "# # Tutorial\n\n# ## Hash tables\n\n*Right* Here we see unused buckets and\
    \ large differences in bucket cardinality — this is inefficient\n\n![](img/0fc17bd4c29dc437e3ac28a53f7559db_51_0.png)\n\
    \n```\n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include\
    \ <ctype.h>\n\n#define TABLESIZE 1001\n\ntypedef struct node {\n\tchar *data;\n\
    \tstruct node *next;\n} node;\n\nunsigned int hash(const char *str, int tablesize)\
    \ {\n\tint value;\n\tvalue = toupper(str[0]) - 'A';\n\treturn value % tablesize;\n\
    }\n\nstatic int lookup(node *table[], const char *key) {\n\tunsigned int index\
    \ = hash(key, TABLESIZE);\n\tconst node *it = table[index];\n\n\twhile (it !=\
    \ NULL && strcmp(it->data, key) != 0)\n\t{\n\t\tit = it->next;\n\t}\n\treturn\
    \ it != NULL;\n}\n\nint insert(node *table[], char *key)\n{\n\tif (!lookup(table,\
    \ key))\n\t{\n\t\tunsigned int index = hash(key, TABLESIZE);\n\t\tnode *new_node\
    \ = malloc(sizeof *new_node);\n\n\t\tif (new_node == NULL)\n\t\t\treturn 0;\n\t\
    \tnew_node->data = malloc(strlen(key)+1);\n\n\t\tif (new_node->data == NULL)\n\
    \t\t\treturn 0;\n\n\t\tstrcpy(new_node->data, key);\n\t\tnew_node->next = table[index];\n\
    \t\ttable[index] = new_node;\n\t\treturn 1;\n\t}\n\treturn 0;\n}\n\nint populate_hash(node\
    \ *table[], FILE *file)\n{\n\tchar word[50];\n\tchar c;\n\n\tdo {\n\t\tc = fscanf(file,\
    \ \"%s\", word);\n\t\tsize_t len = strlen(word) - 1;\n\t\tif (word[0] = '^V')\n\
    \t\t\tword[0] = '@';\n\t\tinsert(table, word);\n\t} while (c != EOF);\n\treturn\
    \ 1;\n}\n```\n```"
