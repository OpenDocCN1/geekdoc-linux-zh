    , totalSymlolicLinks);\n    return 0;\n}\n```\n\n# The various times of a file\n\
    \nEach file has three time fields: the modification time (at_mtime), the changed-status\
    \ time (st_ctim) and last-access time (at_atim). There is a subtle difference\
    \ between the modification time and the changed-status time. The modification\
    \ time indicates a change to the data of the file whereas the changed-status time\
    \ indicates a modification to the metadata of the file, which then results in\
    \ a modification to the inode of the file.\n\n# Systems programming in Haskell\n\
    \nHaskell is a functional and compiled programming language that can be used for\
    \ systems programming. Haskell is a perfect choice for performing filename matching\
    \ operations. The only problem with the Haskell way is that different operating\
    \ systems use different and specialised modules.\n\nThe `System.Directory` module\
    \ contains many functions that can be used for getting information from the filesystem,\
    \ including getting a list of files in a directory, renaming or deleting files,\
    \ copying files, changing the current working directory (`setCurrentDirectory`)\
    \ and creating new directories. The good news is that `System.Directory` is portable\
    \ and works on any platform where GHC (Glasgow Haskell Compiler) itself works.\n\
    \nThe following output shows the advantages of using Haskell:\n\n```\nghci> :module\
    \ System.Directory\nghci> getDirectoryContents \"/tmp\"\n[\"update-cache-2all3caac\"\
    ,\"upload_progress\",\n cache\",\":\"update-extraction-2all3caac\", \"xdrch-env-x\"\
    , \"font=unix-x\", \"haccesse\", \"ghe414750_@\", \"XH=\n unix*x\",\"hspersidata_root*\"\
    , \"IEC=unix*x\",\"XL1=unix*\",\n \"test=unix*\" ]\n\nghci> getDirectoryContents\
    \ \"/tmp\" >>= return . filter\n (notElem [\".\", \"..\"])\n[\"update-cache-2all3caac\"\
    ,\"upload_progress\",\n cache\",\"update-extraction-2all3caac\", \"xdrch-env-x\"\
    , \"font=unix-x\", \"haccesse\", \"ghe414750_@\", \"XH=\n unix*x\",\"hspersidata_root*\"\
    , \"IEC=unix*x\",\"XL1=unix*\"]\n```\n\nThe first `getDirectoryContents` command\
    \ returns all the contents of the `/tmp` directory. The second command does the\
    \ same with a little difference: it excludes the special values of `\".\"` and\
    \ `\"..\"` using pattern matching.\n\nDepending on the function used to access\
    \ a file, some or all of the time fields can change. Also, modifying, deleting\
    \ or adding a directory entry will most certainly change some or all of the times\
    \ of the parent directory.\n\nNow let's look at `filetimes.c`. You will need to\
    \ translate the time values you get into a format that makes more sense to users\
    \ – this is done using the `ctimel` function. As usual, the first thing you should\
    \ do is calling either `stat( )` or `fstat( )` to get the necessary data. After\
    \ getting the data you should extract it and print it on screen, which is a direct\
    \ and painless process. As you already learned, you then change the file permissions\
    \ of the text file using the `chmod( )` function. Last, you append a little text\
    \ to the file. `compile` and execute the program to see how the various times\
    \ of a file change.\n\n# Working with directories\n\nUnderneath the surface, UNIX\
    \ machines implement and treat directories as regular files; there exist only\
    \ two differences between them. The first one is that the kernel does not allow\
    \ writing on directories and the second one is that they have a special bit set\
    \ in their inode.\n\nAlthough knowing how to work with individual files is good,\
    \ most of the time you are going to work with entire directories or directory\
    \ trees. The two most useful system calls for operating with directories are `opendir(\
    \ )` and `readdir( )`.\n\nYou can see both `opendir( )` and `readdir( )` in action\
    \ by looking at the C code presented in `find.c`. Please note that"
