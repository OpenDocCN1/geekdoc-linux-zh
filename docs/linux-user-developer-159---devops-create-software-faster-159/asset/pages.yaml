  md: 'As is to be expected, that command executes the entire compilation process
    and generates an executable by the name of a.out.


    If you want to run the program, you need to execute the following command:


    ```

    $ ./a.out$

    ```


    This will print the message “This is a sample program to understand GCC” on your
    screen. We have now successfully compiled the C program.


    If you want to have a specific output file name for the generated executable,
    you can use the -o option as shown:


    ```

    $ gcc -o sample_prog1 sample_prog1.c$

    ```


    Here, instead of “a.out”, the executable generated will be ‘sample_prog1’. In
    other words, we can see that the -o option sets the output filename for GCC.


    Another important option that developers normally use with GCC is -Wall. When
    we compile a program, the compiler will also give information about the warnings
    that are encountered in the compilation process. These warnings are controlled
    by the -W option of GCC. There is a way to enable all of the common warnings by
    passing -Wall as one parameter to GCC. For our earlier sample program, sample_prog1.c,
    we can use the following command where we have passed -Wall as one parameter.


    ```

    $ gcc -Wall -o sample_prog1 sample_prog1.c$

    ```


    Please note here that even though there were warnings, GCC was able to compile
    our program. Only when there are errors will GCC abort the compilation.


    It is important to also note that GCC has a variety of specific warning flags,
    some of which are enabled by default and all of which have negative forms. The
    -Wall flag will turn almost all of the warning flags, but the -Wextra flag enables
    even more warning condition flags. In order to understand which warning flags
    are enabled by -Wextra, it is worth running man gcc and having a quick read through.


    Let us consider the following program (save this with the name ‘sample_prog2.c’).


    ```

    #include <stdio.h>

    int main(void)

    {

    printf("This is the second sample program to understand GCC options");

    }

    ```


    When we try to compile the above program using the -Wall option, we will get the
    following warning:


    ```

    $ sample_prog2.c: In function ‘main’:

    sample_prog2.c:5:1: warning: control reaches end of non-void function

    ```


    If we look at the above example, we can note here that even though the main function
    is declared to return an integer


    value, the return value is undefined. And our compiler immediately displays a
    warning corresponding to this. This problem can be fixed by a developer using
    the following method (sample_prog3.c):


    ```

    #include <stdio.h>

    #include <stdlib.h>

    int main(void)

    {

    printf("This is the third sample program to understand GCC");

    return EXIT_SUCCESS;

    }

    ```


    When we compile the above program, we will not have to worry about any warnings.


    Another useful option with GCC is -Werror, as this causes GCC to treat all warnings
    as errors. When we use -Werror, GCC will not finish the compilation if any warning
    is detected during the process. Whenever we are dealing with large projects, it
    is common to use this option and having the compilation aborted in this manner
    can be beneficial. We can use -Werror in the following way:


    ```

    $ gcc -Wall -Werror -o sample_prog2 sample_prog2.c$

    ```


    Warnings generated by the compiler when we set the -Werror option may not be very
    serious ones, but as you write complex programs, this option can be extremely
    useful for tracking down the bugs. Consequently, it is good practice to include
    this option in your process.


    Another useful feature with the modern development system is the availability
    of some of the powerful debugging tools. With the help of these debugging tools,
    a developer will have powerful ways of tracing the execution of their programs.
    And with this, you will be able to isolate the annoying problems and then take
    corrective measures to fix the issue. GNU Debugger (GDB) is one such powerful
    debugging tool.


    Before we use GDB effectively in our programs, we need to compile our programs
    with debugging symbols. When we do this, GCC inserts extra information to the
    object files and executable files that it generates. This extra information will
    enable GDB to determine the relationship between the compiled code and the lines
    of code in the source program.


    Please note that debugging symbols are not compiled into the programs by default.
    When we have the debugging symbols, they increase the size of the executables.
    Also note that in order to generate the debugging symbols, we need to use the
    -g option with GCC. In its simplest form, it generates a default set of debugging
    options and they will normally be enough for the debugging purpose. This can be
    done by executing the following command:


    ```

    $ gcc -g -Wall -o sample_prog2 sample_prog2.c$

    ```


    It is also possible to enable more debugging information, and that can be useful
    in some scenarios. If we are going to use the GDB debugger then we may need to
    execute a command similar to the following:


    # Save time with GCC


    The most common use of GCC is when there are multiple program files to be compiled.
    If we compile each and every source file separately then the time required to
    build the executable is significant. However, if we compile all the files at once,
    we can achieve a significant time saving. If we have some 1,000 files and have
    modified only one file, then rather than compiling 1,000 files, we just need to
    compile one file and link it with the objects files to update the binary. This
    saves huge compilation time. You can go through a Makefile to understand how this
    can be achieved.'
