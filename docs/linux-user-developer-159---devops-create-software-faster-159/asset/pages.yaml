- pgno: 18
  md: '# UNDERSTAND DEVOPS


    Before implementing DevOps, let''s understand the core DevOps concepts and typical
    scenarios where DevOps can help


    So, what exactly is DevOps? Experts say that if you ask this of 10 people, you
    may get as many different answers. This is because of the lack of a standardised
    DevOps definition. In contrast, all the other major software development and deployment
    methodologies are based on specific definitions. But DevOps is based on the practical,
    real-life needs of modern organisations, rather than a study performed by researchers.
    Modern organisations need to be Agile in their operations; they need to increase
    the rate of production releases and reduce human intervention in redundant tasks
    like testing and continuous integration. They need to have a clear picture of
    the development and delivery pipeline. DevOps has the promise to achieve all of
    this and more.


    It is probably futile to devise a definition for DevOps; rather it would be better
    to clearly understand the central ideas - automation; standardised infrastructure
    across development, testing and operations teams; all the team members having
    an overview that spans entire delivery pipeline, etc. All these actually point
    to just one direction - minimising delays due to unplanned infrastructure issues
    and faster, reliable deliveries to customers. Now, it is important to understand
    here that different organisations have different customers and requirements, and
    it is seldom possible to adopt a one-size-fits-all approach, so it becomes your
    responsibility to understand the delivery bottlenecks in your organisation and
    then adopt DevOps practices to sort them out.


    Let''s take a scenario of a typical software product development company - the
    team came up with a killer new feature and scheduled it to go to production in
    a week. The development team worked hard and released the code on time. The code
    was pushed to the development server, tests were executed and everything seemed
    to be working fine.


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_18_0.png)


    Finally, the team got the sign-off and moved the code to the production server
    and the feature went live. It went well for a few hours before the users learned
    about the new feature. But as soon as the traffic grew, the dreaded ''Internal
    Error 500'' page started to appear for most of the users. It was later learned
    that a critical server update was not executed on the production server. While
    the server could handle a few users without the update, it was impossible to handle
    huge traffic. The reason for this mishap was miscommunication among the development
    and the infrastructure teams. You get the point here - had the organisation adopted
    DevOps principles, there would have been clearer communication and this occurrence
    probably could have been avoided.


    > Above: DevOps reduces the delay between a completed sprint and a code release
    inside an Agile workflow


    Agile enlists clear guidelines about software development processes, but sometimes
    they prove insufficient for the needs of modern organisations. Let''s take a look
    at a few simple tips and tricks to help you implement DevOps principles while
    staying within the Agile framework.


    Product backlog: A simple way to enable better communication among teams is to
    add extra fields related to different teams - such as development, testing, infrastructure
    - in the product backlog. This makes sure everything is documented and there is
    minimal scope for miscommunication.


    Scrum of scrums: Scrums are an integral part of Agile methodology. A meeting of
    scrum masters of different teams, i.e the scrum of scrums, can make sure people
    from different teams are in sync.


    Done definition: Adding operations-related items to the done definition of a sprint
    is another handy approach to make sure operational issues are addressed well.


    # Focus on employees


    DevOps suggests many changes in the way teams work. While these changes look simple
    from the outside, for employees who are supposed to change their way of working
    this can mean a lot of confusion. It''s very important to understand that it is
    the employees who will actually make or break your DevOps dreams. So you should
    take them into confidence and train them well before implementing new DevOps tools.


    # HOW TO IMPLEMENT DEVOPS WITH AGILE PRACTICES'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# EMPLOY DEVOPS WITH

    **DOCKER** CONTAINERS


    Docker offers a great way to manage infrastructure across teams. Let’s see how
    it works and how to use its features to implement DevOps


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_19_0.png)


    # **Docker** and its uses


    Containers offer a great way to run self-contained software units, handling any
    dependencies software may need internally. Docker takes this further with simple
    and easy-to-create Dockerfiles that serve as the building blocks of Docker containers.
    Add to this the comfort of a union file system approach, which enables files and
    directories of separate file systems – known as branches – to be transparently
    overlaid to form a single coherent file system, and you can overlay a container
    on top of another. So, how does all this add up and let different teams easily
    collaborate on the lines of DevOps? Here are a few use cases:


    +   • Need that specific OS version across all the teams? Just create the Dockerfile
    for that OS version and distribute it. That’s it! Anyone can now easily create
    the container from the Dockerfile and use it to execute the code.

    +   • Need to execute tests on your code before shipping it? Create the Docker
    container for your code and deploy multiple containers of same system. You can
    now run concurrent tests on the same system.


    # MANAGE CONTAINERS IN **DOCKER**


    ![](img/0fc17bd4c29dc437e3ac28a53f7559db_19_1.png)


    # **DOCKER RUN COMMAND**


    The docker run command spawns a Docker container from a Docker image. The run
    command has more options than any other. Here, we have used the -p (flag) to publish
    the container’s port (27017) to the exposed format. This will make the exposed
    port accessible on the host and the port will be available to any client that
    can reach the host.


    # **DOCKER PS COMMAND**


    The docker ps command lists all of the currently running containers in a tabular
    format. You can get a lot of information using the ps command. The first column
    displays the unique container ID, and the next column displays the image that
    is the base for the container.


    # **COMMAND COLUMN**


    The Command column shows the entry command of the container. The Created column
    shows the time elapsed since the creation of the container. Status shows if the
    container is up/down, and for how long. The Ports column shows the ports mapped
    with the host. The last column is the Name column, indicating the name of the
    container.


    # **IDENTIFY CONTAINERS**


    The -name flag identifies containers using the name you assign. The one created
    here will be assigned the name “mongod_instance_1”. We used the -flag to indicate
    detached mode. In this mode, all I/O should be done through network connections
    or shared volumes because the container is no longer listening to the command
    line.'
  merge: -1
