    stage of the penetration testing lifecycle known as exploitation. We aim to make
    you understand the fundamental difference between attack types and attack vectors.
    You will learn about some Kali Linux tools that can be used for exploitation.
    You will learn about a very important exploitation tool called Metasploit as well.The
    National Institute of Science and Technology (NIST), Special Publication 80030,
    Appendix, B, page B-13 defines vulnerability as a weakness in an information system,
    system security, internal processes, or implementations that can be exploited
    by an attacker. This definition defines a very broad scope of exploitations and
    demands a deeper explanation. Errors lead to vulnerability. Eros can be found
    in multiple places in an information system, or it can be a human error committed
    by people who use or administer the information system daily.Vulnerabilities Scan•         
    Exist inside or outside of an information system.•          Be a part of some
    poor lines of software code.•          Be generated through incorrect configuration.•         
    Be completely outside the technical infrastructure created via social channels.Vulnerability
    is synonymous with the word weakness. The whole act of exploitation is simply
    taking advantage of the weakness in an information system to gain access to it
    and render it useless to genuine users via a denial of service. The only limitation
    an attacker will have while exploiting the system is their will power to continuously
    carry an attack against the security systems protecting the information system.
    The best tool for an ethical hacker or a penetration tester to use for the exploitation
    stage is their brain. When you see that one attack surface is closed, move to
    the next one. Exploitation can be one of the toughest tasks for an ethical hacker
    to learn. It takes knowledge, experience, and a great amount of persistence to
    learn all the attack types that can be used on a single target.Attack Vectors
    and Attack TypesThere is a small line between attack vectors and attack types
    that is often misunderstood and misinterpreted by everyone. The two terms can
    be often perceived as synonymous with each other, but proper clarification and
    differentiation will help to understand how exploits can be classified into the
    two categories. Generally speaking, a vector is a channel of transmissions such
    as a tick, a mosquito, or any other pathogen, but the delivery method for all
    these is the same: a single bite. Every pathogen has similar instinctive instructions
    to carry out the bite, but there will be a difference for each. For ethical hacking
    and information systems, an attack vector is a category for classifying groups
    of attack types within every category of an attack vector.'
