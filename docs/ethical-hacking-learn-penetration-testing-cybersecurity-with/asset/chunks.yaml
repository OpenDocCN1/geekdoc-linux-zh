    # Ethical Hacking Commandments


    There are rules and principles defined for an ethical hacker that must be followed
    at all times. If these are not followed, there can be bad consequences. It is
    common for these rules and principles to be forgotten or ignored when hacking
    tests are performed. And the outcome of this can be very dangerous for the organization.
    Here are some of the major commandments of ethical hacking:


    ## Working Ethically

    The term `ethical` means working with professional integrity and principles. When
    you perform ethical hacking tests on an organization’s systems, you need to ensure
    that all the tests have been approved and support the goal of the organization.
    An ethical hacker is not allowed to have any hidden agendas. Trust is the biggest
    factor in the field of ethical hacking. The information retrieved while performing
    tests is not to be kept by the ethical hacker for personal gains, as that is what
    separates white hat hackers from black hatters.


    ## Respecting Privacy

    An ethical hacker will gain access to a lot of personal information while conducting
    penetration tests. He is expected to treat the information with respect and not
    use it for personal gains. All information collected during penetration tests
    from web surfing activity to passwords must be kept private.


    ## Ensuring that the Systems are not Damaged

    The systems and the information owned by an organization are very valuable and
    must not be damaged at any cost. Ethical hackers should read all available documentation
    about the digital infrastructure of an organization so that they do not hamper
    the system, even unknowingly. A system may crash if you end up running too many
    tests on it simultaneously. If a system crashes during production hours, it can
    result in huge revenue losses for the organization.


    ## Executing the Plan

    Time and patience are very important in the field of ethical hacking. You need
    to be very careful while performing tests and ensure that no unauthorized employee
    knows what you are doing. There will be numerous eyes on you while performing
    tests, and it is not practically possible to know if an employee of the organization
    wishes harm to it. All you can do is ensure that you do your tests quietly and
    as privately as possible and not divulge any information to anyone apart from
    your bosses you have hired you for the job.


    Ethical hackers may sometimes take system patching too far by hardening systems
    to secure them against attacks that may not even happen. For example, securing
    a system’s network does not help if there is no internal web server for the organization.
    However, at the same time, make sure that you do secure the system against malicious
    employees who may physically access the system.


    ## Hacktivism

    According to the Merriam-Webster dictionary, Hacktivism is defined as “computer
    hacking (as by infiltration and disruption of a network or website) done to further
    the goals of political or social activism.” The invention of the term Hacktivism
    is credited to the `Cult of the Dead Cow` hacker group that was active in the
    early 90s. Hacktivism initially began through online gaming communities and evolved
    further to be used anonymously over the Internet for common causes. Hacktivists
    are mostly young people who use the Internet spaces and are in constant touch
    with like-minded individuals.


    The open Internet granted an opportunity to hacktivists to stay anonymous and
    use an alias to mostly engage in joint ventures to share pirated content, pirated
    software, etc. over the Internet. Most hacktivists aimed to demolish “The Establishment,”
    which mostly is a particular government or capitalist companies they were not
    too happy with. The groups that have gained a lot of public attention include
    `Anonymous`, the `Syrian Electronic Army`, and `Lulzsec`. With the Internet connecting
    even the remotest corners of the world, hacktivists realized that there was a
    very small personal risk for their actions on the Internet.


    ## Cyber Terrorism

    Cyber terrorism comes into the picture when technology is used to empower terrorism.
    There is a common misconception among the masses that crime and terrorism are
    the same things. The difference is that terrorism has political motives, whereas
    crime can have personal motives. The level of harm caused by criminal activity
    and terrorist activity is different too. A U.S. decree, for example, defines “terrorism”
    as:

    (i) Committing acts constituting “crimes” under the law of any country

    (ii) To intimidate or coerce a civilian population, to influence government policy
    by intimidation or coercion or to affect the conduct of the government by mass
    destruction, assassination, or kidnapping.


    With the advancement in technology, terrorist groups have started using computer
    technology to target the civilian population and hamper the ability of a society
    to sustain internal order. They have successfully managed to leverage technology
    as a weapon of mass destruction.


    ## Why do Hackers Hack?

    Criminal hackers hack systems mostly because they simply can. For some, hacking
    may be just a hobby where they hack their own systems to see what they can hack
    and what they cannot. Many hackers are usually ex-employees who were fired from
    an organization and want to take revenge by stealing sensitive information. Malicious
    hackers hack to gain control over systems, which builds their ego and leads to
    addiction. Some hackers just want to be famous, while others want to make the
    other party’s life miserable. Most malicious hackers share common motives such
    as curiosity, revenge, theft, challenge, boredom, and corporate work pressure.


    ## Hacking Terminologies

    We will conclude this chapter by discussing the most common terms used in hacking,
    which you will see in the remaining chapters of this book.


    ### Phishing

    Phishing is the most popular terminology in the hacking domain. Phishing is a
    method employed by hackers to trick users into revealing critical information
    such as their usernames, passwords, banking details, etc. A phisher will pretend
    to be someone genuine and target a person and make him or her reveal information.
    The information collected could be further used by the hacker for malicious intentions.


    For instance, a phisher will send an email to a target, and the email would seem
    like it’s from the target’s bank. The email will request the user for their bank
    information, or it would contain a link that will redirect the user to a website
    that looks like their bank’s website. The user will be completely unaware of the
    website’s genuineness and end up entering their bank account details on the web.
    Phishing falls under the umbrella of social engineering.


    ### Malware

    Another term that you often get to hear is malware. You may have heard it before
    some websites may be infected with malware, so let us understand this term better.
    Malware is software developed by hackers to breach the defenses of a computer
    and steal critical information from the system. Malware is further classified
    into subcategories as `viruses`, `worms`, `Trojans`, `spyware`, `keyloggers`.
    Malware can be planted on a computer via channels such as a network, a hard drive,
    `USB`, etc. For example, a recent malware targeted `Magento` and redirected its
    users to malicious websites.


    ### Backdoors

    Often confused with a Trojan horse, a backdoor is a program that runs in the background
    on a compromised system. It facilitates future entries into the system and eliminates
    the need to exploit the system. Most Trojan horses contain backdoors but do not
    necessarily provide any functionality to the user. A backdoor is often implemented
    by ethical hacker to execute a completely different program on the system.


    ### Trojan Horse

    A Trojan horse, commonly known as a `Trojan`, is a malicious program that is planted
    in a target system to perform a desired function by the attacker. People often
    interpret Trojans to be the same as viruses because of the nature. What distinguishes
    a Trojan from a virus is that Trojan is an independent program and does not depend
    on other programs to execute itself.


    ### Virus

    A virus is defined as a malicious piece of code or software that affects a genuine
    process on the system. Viruses are capable of infecting files, boot sectors, memory
    space, and even hardware. Viruses have subclasses:

    `Resident Virus`: A virus that moves to RAM space after system boots up and then
    gets during shutdown. These viruses leach onto genuine processes and interrupt
    the internal calls between the process and system.

    `Nonresident Virus`: A virus that depends on hard disk for its execution; it then
    infects it and exits from the memory after the execution is complete.


    ### Ransomware

    As of 2020, Ransomware is one of the most searched terms on the Internet. Ransomware
    is a form of malware that locks a user out of their system and blocks all access
    to their files. It then displays a ransom message on the screen for the user to
    make a payment, mostly in Bitcoin, if they want to regain access to their system.
    Ransomware attackers initially used to target individual users, but they soon
    realized that there was more monetary gain in attacking bigger institutions such
    as banks, hospitals, and businesses. The `Petya` ransomware attack is a recent
    example of ransomware that affected businesses all over the world. In this attack,
    the virus displayed a message demanding money on the screens of all ATMs owned
    by Ukraine’s state-owned bank `Oschadbank`.


    ### Spoofing

    Email spoofing and IP spoofing are terminologies more commonly heard. The headers
    of an email are modified in email spoofing to make the email look like it originated
    from a genuine source. For instance, a black hat hacker will modify the headers
    of an email and make it appear like it is a genuine email sent to you by your
    bank. IP spoofing, on the other hand, refers to an unwanted network packet sent
    to your computer from a hacker’s computer, but the source IP is altered such that
    it looks like it originated a legitimate system or a trusted host. The hacker
    hopes that your system would accept this packet that will grant the hacker access
    to your system.


    ### Encryption

    Encryption is a technique that encodes information or data to make it secretive
    or unreadable. Only authorized parties with a `decryption key` can convert the
    information to its original format and make it readable again. The fundamental
    basis of a ransomware attack is encryption, which attacks systems and encrypts
    their files. The hacker provides the decryption key only after the user pays the
    requested ransom.


    ### Adware

    Adware is software that infects your system with a lot of advertisements. However,
    it also covertly spies on your activities and generates ads based on your Internet
    activity. Sometimes adware is so malicious that it continuously pops up ads on
    your system, and ultimately slows it down. Adware once planted on your system
    can collect personal information, web activity, and provide this to an attacker
    for phishing attacks. Adware terminology is very popular in the world of marketing.
    Websites like Google that index websites have started showing a warning when an
    ad makes you land on a malicious website that may be deceptive.


    ### Zero-Day Threat

    A threat that is new and not documented by any virus scanner and can, therefore,
    bypass a virus scan. Such a threat is known as a zero-day threat. This flaw is
    very common in antivirus software, especially when the developers of the antivirus
    do not have sufficient knowledge about new threats in the digital world. Zero-day
    threats will exploit a system through vectors such as web browsers and email attachments.


    ### Brute Force Attack

    Brute Force Attack is another popular hacking terminology, which is employed to
    bypass login pages on the Internet. Brute Force Attack, also known as the exhaustive
    key search, is a method that employs trial and error to guess information such
    as passwords and other encrypted information. Hackers use this method to crack
    passwords of admin accounts, which then can be used to steal almost all the information
    on a system.


    ### HTTPS/SSL/TLS

    Google Chrome, the most popular Internet browser in the world in 2020, `HTTPS`
    stands for HyperText Transfer Protocol, and `SSL` stands for secure. `TLS` stands
    for secure. A `SSL` certificate is installed on a website so that information
    between a user’s browser and website is always encrypted. `SSL` and `TLS` are
    protocols that verify the identity of a website.


    ### Bot

    A bot is a robot that runs automated scripts on the Internet. It is common for
    search engines to employ bots as spiders that crawl all the websites to gather
    information about them.


    ### Botnet

    A Botnet is a network of bots controlled by a black hat hacker. Black hat hacker
    may create a botnet to launch attacks such as `DDoS` (Distributed Denial of Service),
    send spam, steal information, and allow access to multiple systems. Botnets will
    help the hacker to be untraceable and intensify the attack.


    ### DDoS (Distributed Denial of Service)

    This hacking terminology is popular among hackers and a nuisance for owners. Black
    hat hacker executes a DDoS by employing a group of bots or zombies. The bots have
    code that instructs them to keep random packets to a web server which causes load
    on the server more than it can support and even shuts it down completely. One
    such popular DDoS attack lasted for months.


    ### Firewall

    A firewall is software developed to secure the network and monitor incoming and
    outgoing traffic. It filters out incoming data from untrusted sources and ensures
    safe communication inside the network. A firewall can be implemented through both
    software and hardware. A well-developed firewall will continuously look for abnormal
    activity on the network. To keep up with the hackers, firewalls still find a way
    around it.


    ### Payload

    A shipment of data transmitted over a network is known as a payload. In black
    hat hacking, a payload is a virus that is transferred over a network and planted
    on a target system to exploit it.


    ### Rootkit

    Rootkits are one of the most dangerous methods used to breach a system as they
    go undetected most of the time. A rootkit in the hands of a black hat hacker can
    result in the perfect theft. A hacker uses different channels to plant and install
    a rootkit on a target system. A rootkit can be planted using email attachments,
    infected hard disks, etc. Once a rootkit is planted, black hat hacker will have
    god-level access to a system. Rootkits operate at the lower levels of the operating
    system and can go undetected for long.


    ### RAT

    `RAT` stands for Remote Access Tool or Remote Access Trojan. It is a malware application
    that can be operated by an amateur hacker. Once a `RAT` is installed on a target
    system, the hacker can have complete access to the system. The main intention
    of RAT was for legitimate operations like remotely operating a work computer from
    home, but hackers realized its advantage and used it to gain access to target
    systems illegally.


    ### Spam

    Spam is hacking terminology mostly concerned with email. Any unwanted email received
    by a user is classified as spam. Spam email comprises mostly advertisements. Spammers
    collect a huge number of email addresses from a database and send them bulk emails
    to promote products. However, spamming can also be used by attackers to plant
    malware into a system via phishing or sending links in the emails that redirect
    the user to illegitimate websites. It is advisable to use a spam filter or delete
    spam as soon as you receive it.


    ### Worm

    A worm is malicious code, just like a virus that is capable of replicating itself.
    However, unlike a virus, a worm does not need to host itself on a file and can
    exist independently. It can further spread to various systems over a network without
    needing human interaction. A self-replicating worm hogs system resources such
    as memory, disk space, bandwidth, and processor time, turning your system very
    slow. A worm can become catastrophic if it is not removed from the system in time.


    ### Cloaking

    As the word suggests, cloaking refers to covering information. Hackers employ
    cloaking to present malicious websites to users while covering it to look like
    something legitimate. Hackers use `.htaccess` rules and dynamic scripts on a web
    server to make them invisible to specific IP addresses and service another set
    of IP addresses. Google will suspend ads on your website if it detects cloaking.


    ### Penetration Testing, Pentesting

    Penetration Testing can be defined as the methods, processes, and procedures employed
    by ethical hackers within guidelines and approvals to attack the systems of an
    organization. It includes the destruction of the existing security system. This
    kind of testing assesses the security of an organization’s digital infrastructure
    on technical, operational, and administrative levels. Usually, ethical hackers
    will only test the security of the information systems as per their build. The
    system or network administration team doesn’t need to know when penetration testing
    is being conducted.


    ### Vulnerability Analysis, Vulnerability Assessment

    A vulnerability assessment or a vulnerability analysis is used to evaluate the
    security of an organization’s information systems. The security teams will try
    to find the security patches that are missing from the operating system and all
    other installed software on the system. The vulnerability assessment team can
    be hired through a third party or can be an internal team within the organization.


    ### Security Controls Assessment

    The security evaluation of the information systems concerning legal and regulatory
    requirements is called security controls assessment. These requirements include
    but are not limited to `FISMA` (Federal Information Management Act), `HIPAA` (Health
    Insurance Portability and Accountability Act), and `PCI` (Payment Card Industry).
    Security Controls Assessments are required as Body of Evidence (`BOE`) by organizations
    to authorize their infrastructure.


    # Chapter Two: Kali Linux


    In this chapter, you will learn about the most powerful tool an ethical hacker
    can possess: `Kali Linux`. You will learn how to download and install Kali Linux
    so that you can use the penetration testing tools that are inbuilt in the operating
    system.


    ## Hard Disk Installation

    To begin the installation, place the DVD in your computer’s drive or plug in the
    USB stick on which you have loaded the Kali Linux installation media. Depending
    upon what you use, you need to set up boot priority in your computer’s BIOS settings
    so that the installation is picked from the respective media.


    ## Booting Kali Linux for the First Time

    If you have successfully managed to load the installation media either from DVD
    or USB stick, you will be presented with a screen. The installation we are going
    to perform will delete any existing operating system on the hard disk and replace
    it with pure Kali Linux.


    ### Setting the Defaults

    The screens that follow will let you select the default settings for your Kali
    Linux system, such as the language, location, and language for your keyboard.
    Select settings that apply to your region and click on next to proceed further
    with the installation.


    ### Initial Network Setup

    A screen will appear on your system, where you can type a hostname of your choice.
    Try to keep it unique. After clicking next, you will be requested to type in a
    fully qualified domain name. This is used when your Kali Linux system is part
    of a corporate network. You can skip this, as you will install Kali Linux to run
    as a standalone system.


    ### Password

    The next screen will prompt to set up a password for the root account. The root
    account is the superuser for your Kali Linux system, with all privileges to the
    system. It can also be called the owner of the system. The default password for
    the root account is `root`, and it is advised that you change it to something
    complex. The password has criteria to contain at least each of the following:
    uppercase, lowercase, number, and symbol.


    ## Disk Partitioning

    There are multiple ways to implement partitions for a Linux operating system.
    In this book, we focus on the most basic partitioning scheme called `Guided Partitioning`.
    We are going to proceed with the `Guided - use entire disk` option for our installation.
    Select it and click on Continue. The next screen will show you all the physical
    hard drives present on your system. You can click on the hard drive that represents
    the name of your hard drive and click on Continue. On the next screen, you will
    be asked how you want to use the available hard drive. Select the option to use
    the entire disk to keep the process simple.


    ## Configuring the Packet Manager

    After the installer finishes copying files to hard disk, the next screen will
    show you a prompt to configure the packet manager for your Kali Linux system.
    The package manager is crucial for your system to get new updates.


    ## Installing the GRUB Loader

    On the next screen, you will be asked if you wish to install the `GRUB` bootloader
    for your Kali Linux system. Select `Yes` and click on Continue.


    ## Completing the Installation

    Finally, you will reach the completion screen. You can click on Continue, and
    your system should reboot. Eject your installation DVD or USB stick and continue
    with the reboot. You should now be presented with the Kali Linux welcome screen.
    Log in as the root user with the password you set up and voila; you are done!


    ## USB Drive Installation

    A USB drive, also known as a thumb drive or USB stick, is a storage device that
    can be plugged into the USB port of a computer. We recommend that you use a USB
    drive with at least 8 GB storage for installing Kali Linux. All new systems today
    can boot from a USB device. You can set boot priority for your USB device from
    the BIOS settings.


    ### Persistence and Non-persistence

    While using USB drives to boot an operating system, two important terms come into
    picture: persistence and non-persistence. Persistence refers to the ability of
    the system to retain changes or modifications made to its files even after a reboot.
    Non-persistence means that the system will lose all changes made earlier after
    it goes through a reboot. In this book, the USB drive installation of Kali Linux
    through a Linux machine will be persistent, and through a Windows machine will
    be nonpersistent.


    ### Windows Non-Persistent Installation

    Before you can proceed with installing Kali Linux on a USB drive through Windows,
    you will need to download `Win32 Disk Imager`. You can download it from the URL:
    `https://sourceforge.net/projects/win32diskimager/`. After you have downloaded
    the Kali Linux ISO, plug your USB drive into your computer. Windows should automatically
    detect it and assign a drive letter to it. Next, launch the `Win32 Disk Imager`
    application. Click on the folder icon to browse through your files and select
    the Kali Linux ISO you downloaded earlier and click the OK button. From the drop-down,
    select the drive letter assigned by Windows to your USB drive. Click on the `Write`
    button to start writing the Linux operating system to your USB drive. The process
    will take some time depending on your system hardware. After `Win32 Disk Imager`
    has completed writing the ISO to the USB drive, reboot your computer system and
    select the highest boot priority for your USB drive from the BIOS settings. After
    you have done that, reboot the system again, and it should give you a Kali Linux
    boot menu. You can select the `Live` option, which is the first option to boot
    into the Kali Linux desktop from the Live USB directly.


    ### Linux Persistent Installation

    Size matters a lot while building a persistent USB drive for a Kali Linux installation.
    Ensure that you have the `GParted` application installed on your system. If you
    encounter difficulties installing `GParted`, go through the documentation. You
    may use one of the following commands to install `GParted` via the terminal:

    ```

    apt-get install gparted

    aptitude install gparted

    yum install gparted

    ```

    After you have downloaded the Kali Linux ISO, plug the USB drive into your computer
    system. Use the following command on the Linux terminal to figure out the location
    of the USB drive:

    ```

    mount | grep -i udisks

    ```

    You should get the file location of the USB drive something as `/dev/sdb1`. Be
    careful as this could differ for your system. Remove any numbers at the end of
    the command.


    Use the `dd` command to write the Kali Linux ISO to the USB drive as follows:

    ```

    dd if=kali_linux_image.iso of=/dev/sdb bs=4

    ```

    Launch `gparted` application using the following command:

    ```

    gparted /dev/sdb

    ```

    The drive should show one partition already with the Kali Linux image installed
    on it. You need to add another partition by selecting `New` from the menu that
    appears. Specify the size. Set the File System to `ext4`. Click `Apply`.


    To add persistence function to the USB drive use the following commands:

    ```

    mkdir /mnt/usb

    mount /dev/sdb2 /mnt/usb

    echo "persistence" | tee -a /mnt/usb/persistence.conf

    echo "root" | tee -a /mnt/usb/fstab

    umount /mnt/usb

    ```

    That is it. You have now created a persistent Live Linux USB. Reboot your system,
    and you should be able to boot the Kali Linux operating system from the USB.


    # Chapter Three: The Penetration Testing Lifecycle


    An Ethical Hacker is also known as a Penetration Tester in the industry. Ethical
    hackers are proficient with the testing lifecycle. An organization hires ethical
    hackers so they can conduct several penetration tests on the organization’s infrastructure
    with the management’s approval and discover vulnerabilities in the system before
    a real attacker targets it. There is a common misconception among the masses that
    an ethical hacker or penetration tester just needs to sit on a computer, run a
    piece of code, and can gain access to any system. People have this notion because
    of things they see in movies, but this is far from the truth.


    Over the years, a definite framework has been established which is adopted by
    ethical hackers. The first four stages of this framework guide an ethical hacker
    to discover vulnerabilities in a system and understand to what level these vulnerabilities
    can be exploited. In comparison, the final stage ends up documenting the actions
    of the first four stages in a neat report to be presented to the senior management
    of the organization. This framework has not only created a proper planning and
    execution structure for an ethical hacker but has also proved to be very efficient
    for conducting penetration tests at multiple levels.


    Every stage gathers inputs from the previous stage and provides inputs to the
    next stage. The process runs in a sequence, but it is not uncommon for ethical
    hackers to return to a previous stage to analyze discovered information. Patrick
    Engebretson has clearly defined the first four stages of the penetration testing
    lifecycle in his book *The Basics of Hacking and Penetration Testing*. The steps
    are `Reconnaissance`, `Scanning`, `Exploitation`, and `Maintaining Access`. This
    book explains the first four stages as per Patrick’s book but expands to an additional
    stage called `Reporting`.


    If you have read the five-phase process defined by the EC-Council in its popular
    course Certified Ethical Hacking or `CEH`, you may argue that this book does not
    contain the final stage called `Covering Tracks`. We have intentionally left that
    phase out from this book to add more focus on the first four stages and also introduce
    Reporting, which is not covered in most of the other books available on the market
    today. The other difference you see in this book is that the penetration testing
    lifecycle has been represented using a linear version instead of a cyclic one.
    We have done so because we believe that an ethical hacker linearly encounters
    things during their engagement. The process begins with reconnaissance or gathering
    information about the target system and ends with the ethical hacking team presenting
    a report to the senior management about their discoveries through the process.


    In this chapter, we will draw out a basic view of all the five stages of the penetration
    testing lifecycle, and we will then have a dedicated chapter devoted to each of
    these stages. The dedicated chapters will also introduce you to the most common
    tools used by ethical hackers in each stage. This way, you will not understand
    the five stages of the penetration testing lifecycle but also have an idea of
    the tools used by security professionals when you engage in penetration testing.


    ## The Five Stages of the Penetration Testing Lifecycle


    We will discuss the five stages of the penetration testing lifecycle with an analogy
    to the functioning of an army in a war situation on the international borders.


    ### Stage 1: Reconnaissance

    Imagine a dimly lit room where analysts and officers are going through the map
    of a foreign territory. Other analysts in the room are watching the news on numerous
    televisions and taking down notes from the incoming news. There is a final group
    in this room, which is preparing a final draft of all the information that has
    been gathered by every group about the target. This scenario tells you about what
    happens during reconnaissance but is very similar to what an ethical hacker will
    do in the reconnaissance stage of the penetration testing lifecycle. Organization
    will hire a team of penetration testers or ethical hackers to discover as much
    information about the target that can be gathered from public sources.


    ### Stage 2: Scanning

    Continuing with the military analogy, imagine there is a hilltop behind the lines,
    and there is one soldier from your army who is hidden in the bushes. The soldier
    brings back reports of the enemy''s location. This is what the scanning stage
    is. Ethical hacker uses the information gathered in stage one to scan the target''s
    network and system, which is further used in the exploitation stage.


    ### Stage 3: Exploitation

    Four soldiers from your army make their way through an open field at night, with
    their night goggles to see everything. This is again what an ethical hacker will
    do in the exploitation stage. The motive of this stage is just to get into the
    target system quickly.


    ### Stage 4: Maintaining Access

    Based on the enemy plans provided by the four soldiers, an engineering team digs
    a hole in the earth to make a way to the enemy camp that has all this information.
    The purpose of this is to provide continuous and easy access to the room. Ethical
    hacker does the same in the maintaining access stage. The goal is to get into
    the target system and quickly get out.


    ### Stage 5: Reporting

    The commander of the team of soldiers now stands in front of his higher officers,
    such as generals and admirals, and explains the details of the raid to them. Every
    step is explained in detail, and every detail is further expanded to explain how
    the exploitation was successful. At the end of the testing lifecycle, ethical
    hackers also need to create a report that explains each stage of the hacking process,
    the loopholes discovered, and the systems that were targeted. The report suggests
    steps to be taken to make the infrastructure secure.


    # Chapter Four: Reconnaissance


    In this chapter, you will understand the reconnaissance stage of the penetration
    testing lifecycle in depth. The process of reconnaissance will help an ethical
    hacker discover all kinds of information about a target organization and its infrastructure.
    The information collected in this stage will be used in the later stages of the
    penetration testing lifecycle to engage with the target organization.


    Just as a military analyzes all information available to them before creating
    a strategy for battle, an ethical hacker needs to gather all publicly available
    information about a target system before planning a penetration test on it. Many
    times, the required information can be obtained from search engines like `Google`
    and social media. The `nameservers` of a domain name are responsible for routing
    a user to a particular website on the Internet. Therefore, these `nameservers`
    can be used to fetch information as well. Emails that are routed through an organization
    can be used to discover information too. An ethical hacker can also download the
    publicly available front end of a target organization and maintain it offline
    to retrieve as much information from it as possible. The information gathered
    from all these sources can be used as an input for social engineering, if it is
    approved by the management, as per the rules of engagement.


    When the reconnaissance stage begins, the ethical hacking team knows very few
    details about the target. The details provided to the team can range from only
    the name and website of the target organization to detailed information about
    the target’s network and information systems, and even the technologies used in
    the organization. The penetration test will always be limited by the Rules of
    Engagement (`ROE`) that are defined by the management. The ROE may limit an ethical
    hacking team from conducting destructive tests like the Denial of Service (`DoS`)
    and Distributed Denial of Service (`DDoS`) attacks on the target infrastructure.


    The main objective of the reconnaissance stage is to discover as much information
    about the target organization as possible. Some important things about the target
    organization that need to be determined are as follows:

    - The structure of the organization. This would include detailed information about
    the departments and the organizational charts of various teams in the organization.

    - The digital infrastructure of the organization. This would include the `IP`
    space of all devices and the network topology.

    - The technologies used for both software and hardware.

    - Email addresses of all employees.

    - Commercial partners of the organization.

    - The physical locations of the organization.

    - Phone numbers.


    ### Trusted Agent

    A trusted agent is the person who hired the ethical hacking team to conduct penetration
    tests for the organization. They provide guidelines and will not disclose any
    information about the trusted agent. This is how you can begin the process of
    reconnaissance.


    ### Start with Target’s Website

    The target’s profile can be created by gathering information from their website.
    This is a useful section of the reconnaissance. For example, if the target is
    a `.gov` site, you can use the `site:.gov` operator to filter results. If the
    target is a `.com` site, you can use `site:.com`. If you want to find a specific
    page, you can use `site:example.com`. If you want to find a specific word, you
    can use `intext:word`. If you want to find a specific phrase, you can use quotes:
    `"phrase"`. If you want to find a word in the URL, you can use `inurl:word`. If
    you want to find a word in the title, you can use `intitle:word`. If you want
    to exclude a word, you can use the minus sign `-word`. If you want to find a range
    of numbers, you can use `1000-2000`. If you want to find a specific file type,
    you can use `filetype:pdf`.


    ### Website Mirroring

    There are times when it is just more efficient to download the target’s entire
    website and evaluate it offline. A set of automated tools can be run on the offline
    to have a copy. The `wget` command is used to copy all the HTML and CSS files
    of a website.

    ```

    wget -m -p -E -k -np -v http://example.com

    ```

    The `wget` command is followed by several options and switches. You can use the
    `man` page in Kali Linux to know more about the functions of these options.

    ```

    man wget

    ```

    This will pop up the man page for the `wget` command. The options:

    - `-m`: enables settings to mirror a website.

    - `-p`: prerequisites or page, ensures all files are downloaded including image
    files.

    - `-E`: extension, ensures all downloaded files are stored with the `.html` extension.

    - `-k`: converts links and makes them suitable for local viewing.

    - `-K`: creates a backup of the original files with a `.orig` extension.


    The files copied from an organization’s website will be stored in a folder with
    the same name as that of the website being copied. When pages are copied, there
    can be errors when a page containing a PHP is being downloaded. This happens when
    a front-end page depends too much on server-side scripting to display the content
    of the page. Such pages cannot be accessed by tools that clone a website. After
    you download the files, it is important to keep it limited to the ethical hacking
    team for evaluation. Reposting such a website online can violate copyright-related
    laws.


    ### Google Search

    The advanced search operators available for Google search can be leveraged to
    a great extent for reconnaissance. You can locate the Google Advanced Search on
    the URL: `https://www.google.com/advanced_search`. This will open a webpage. The
    top half of this tool will help you find web pages by including or excluding terms
    or numbers. The bottom half of this tool will help you make your search more specific.
    An ethical hacker can use all possible combinations of input fields in this tool
    to create a search string as per their requirement. Using multiple input fields
    will make the search complex but more accurate.


    All These Words

    This input field can be used to find a web page that contains all the words typed
    by you in the field. Their location on the web page does not matter, and it’s
    also not necessary for the words to be in the same order as typed by you; they
    just need to be on the web page. To execute this search, type any number of words
    in the All These Words input field, and it would get converted into a search string
    by Google’s search engine.


    This Exact Word or Phrase

    Providing an input of words to a phrase will result in a Google search for web
    pages containing those words and in the same order. This search works if you use
    quotes: `"phrase"`.


    ### Any of Words

    Inputs provided in this field provide results with either/or query. The Google
    search places an `OR` connector between the words typed by you.


    ### None of Words

    This is the opposite of Any of Words. Google search will exclude web pages that
    contain the words typed by you. The Google search query places a minus sign `-word`
    before the words.


    ### Numbers Ranging From

    This search field contains two fields for inputs. You can use a range of numbers
    like `1000-2000`.


    ### Site or Domain

    This input field can prove to be very helpful to narrow down results. For example,
    if your search is about a government-based organization, you can specify the `.gov`
    domain. If you want to search results restricted to `facebook.com`, you can use
    `site:facebook.com`.


    ### Filetype

    This search parameter helps you restrict your search results to display web pages
    that contain specific file types as `pdf`, `doc`, `docx`, `ppt`, `xls`, `xlsx`.
    You can use the `filetype:` operator to find these files.


    ### Usage Rights

    This search criterion restricts the result of your search to copyrights. If you
    select the option `Free to use` or `Commercial`, the search will return web pages
    that are shared.


    ### Compiling a High-Level Search

    A regular user may use the fields of the Advanced search to get impressive results.
    You can use the following:

    - `exact word or phrase`

    - `Language`: `English`

    - `Region`: `United States`

    - `Last update`: `month ago`

    - `Site or domain`: `helloworld.com`

    - `Filetype`: `ppt`

