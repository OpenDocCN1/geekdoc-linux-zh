    # 1. Traditionally speaking, a hacker is someone curious to learn new things and,
    therefore, likes to delve into the technology to know its workings. They usually
    like to play with computer systems and like to understand how things function
    electronically.


    # 2. In recent times, the term hacker has taken to a new meaning - someone who
    likes to execute malicious attacks on systems for personal benefits. Technically
    speaking, they are called crackers, which is short for criminal hackers.


    `Criminal hackers` break into systems for personal benefits, popularity, or even
    revenge. They break into a system to modify, delete, or steal information, making
    the lives of people miserable while doing so.


    ## Difference Between a Hacker and a Cracker


    The word `hacker` has been used several times incorrectly when the actual term
    to be used should have been a `cracker`. Owing to this, it is a common misconception
    that a `hacker` is someone who breaks into systems to steal information. This
    is not true and damages the reputation of talented hackers all around the globe.


    A `hacker` is curious to learn about the functioning of a computer’s operating
    system and is usually trained in programming languages. The knowledge of programming
    helps the hacker to discover loopholes in a system and the reasons for these loopholes.
    Hackers constantly try to gain knowledge about breaches in new systems or software
    and share what they have discovered with developers. They never have the intention
    of damaging a system or stealing information.


    In contrast, a `cracker` or a `criminal hacker` is a person who breaks into systems
    to damage the system and steal information for personal benefits. Crackers gain
    unauthorized access to a system or its associated network, steal information,
    stop services of the system affecting genuine clients, and wreak havoc for the
    owner of the system. It is very easy to identify crackers because of their malicious
    actions.


    ## Types of Hackers


    Hackers are classified into various categories based on their knowledge. Here
    are some of the common ones:


    ### Coders

    `Coders` are highly trained software engineers and know how to compile code to
    hack a system. They may or may not use their knowledge to hack a system. However,
    they are constantly improving their skills and knowledge and are at par with the
    changing technology. They mostly create applications to identify the exploits
    in a system. They further study the exploits to come up with ways to patch the
    vulnerabilities permanently. Coders have core knowledge of the `TCP/IP` stacks
    and `OSI Layer Model`.


    ### Script Kiddies

    This set of hackers are the most dangerous, not because they are very knowledgeable,
    but rather because they are the complete opposite. They use scripts designed and
    developed by other hackers and rarely know what these scripts are capable of doing.
    They will pick up scripts and tools available on the Internet for free and execute
    them on random systems over a network. They do not test the tools and are very
    carefree. They will leave their digital fingerprints all over the Internet while
    using these tools.


    Most script kiddies are teenagers who are randomly causing havoc over the Internet
    to get bragging rights among their friends. It is worth noting that it doesn’t
    take a lot of skills to be a script kiddie. In simple words, script kiddies are
    guinea pigs who use tools developed by real criminals to attack systems and networks.
    Script kiddies do not get any respect as hackers but can be annoying for everyone,
    as they execute without any accountability.


    ### Admin

    `Admins` are trained individuals that are responsible for managing an operating
    system by using tools designed by developers. Admins do not develop their own
    tools but know every nook and corner of an operating system. One can become a
    system admin by undergoing certifications and training for a particular operating
    system. Most hackers in the world today have been through such training and can
    be called as admins too. Admins have a lot of knowledge about operating systems
    and existing drawbacks. People working as security consultants or the organization’s
    security team are called system admins too.


    Next, let’s understand hackers based on their activities.


    ### White Hat Hacker

    A `White Hat hacker` is someone who deals with ethical hacking. Ethical hackers
    are security professionals with knowledge and skillsets about hacking and the
    tools used for hacking. They are usually employed by an organization to discover
    security flaws in their systems and implement measures to patch these flaws before
    the onset of a real attack.


    White hat hackers are also known as penetration testers. Their main focus is to
    discover vulnerabilities and patch them to provide security to the systems within
    an organization.


    Given that this book is all about ethical hacking, we will learn about the functions
    of a white hat hacker in detail during the course of this book.


    ### Black Hat Hacker

    A `Black Hat hacker` is someone unethical in nature and breaks into systems for
    personal gains. These are criminals and crackers who employ their skills and knowledge
    to gain access to a system for malicious or illegal purposes. Sometimes, they
    are just notorious and want to violate a system’s integrity to annoy the owner
    of the system.


    Black hat hackers are also known as security crackers or unethical hackers. Their
    main intention is to steal information for monetary benefits.


    ### Grey Hat Hacker

    A `Grey Hat hacker` is something between a white and a black hat hacker. They
    generally do not have intentions to hurt anyone and do not exploit systems for
    any personal benefits, but may knowingly or unknowingly commit malicious acts
    during their exploits. Grey hat hackers are also known as hybrid hackers working
    between white hat and black hat hackers.


    ## What is Ethical Hacking?


    The authorized process of breaching the security of an information system to identify
    the weaknesses and vulnerabilities of the system or its associated network is
    known as ethical hacking. The ethical hacker or a white hat hacker gets authorization
    to run tests on the systems by the organization that owns the system. The ethical
    hacker then examines the security settings of the said system. The difference
    between malicious hacking and ethical hacking is that the latter is a planned
    attack and is, therefore, completely legal.


    The job of an ethical hacker is to identify the loopholes in a security system
    that can be used by a malicious attacker to gain access to the system. Ethical
    hackers will conduct multiple tests on an information system to gather information
    about it and make it more secure. Therefore, their ultimate aim is to ensure that
    the information system is strong enough to give a tough challenge to all incoming
    attacks.


    Ethical hackers use the following methodology to scan a system for loopholes.
    However, the scanning process is not limited to just the following methods:


    *   Breach of authentication mechanisms of systems.

    *   Exposure of critical company data.

    *   Modifications to security settings of the system.

    *   Injection attacks.

    *   Access points of the networks and systems of the organization.

