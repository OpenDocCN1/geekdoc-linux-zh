    # Exploit Modules

    Predefined packages of code in a database that can be used to find a vulnerability
    in a target system, be it local or remote, to compromise the system are known
    as exploit modules. Exploit modules can facilitate denial of service (DoS) access
    to sensitive information, or uploads of payload modules that can be used for further
    exploitation.


    ## Auxiliary Modules

    Auxiliary modules do not require a payload to function, as in the case of exploit
    modules. Auxiliary modules instead have programs such as fuzzers, scanners, and
    SQL injection tools. Auxiliary modules also have some very powerful tools that
    need to be used with extreme caution. Ethical hackers can use the vast set of
    scanners available in auxiliary modules to understand the vulnerabilities in a
    target system and then smoothly transition to exploit modules.


    ## Payloads

    If you refer to James Bond’s Aston Martin as the complete Metasploit framework,
    the exploit modules and the auxiliary modules would be its rocket launchers. And
    in this sense, payloads would refer to communication equipment that can be planted
    on a target to maintain tracking and communication. When you are executing an
    exploit on a vulnerable machine, a payload is sent as an attachment to the exploit.
    The payload has instructions to be carried out by the exploited system. There
    are different types of payloads. Some of them will be a few lines of code, while
    others may be full-fledged applications like the `Meterpreter Shell`. There are
    over 200 different types of payloads built into the Metasploit framework.


    ## Listeners

    Even James Bond had to take orders from agent M. Listeners are handlers available
    in the Metasploit framework. When a payload is planted on a target system, it
    creates a session, and listeners are used for interacting with these sessions.
    A listener can be a dormant bind shell that waits for an incoming connection,
    or it can actively listen for incoming connections from the session on the target
    system. It would not be possible to have two-way communication between the ethical
    hacker’s system and the target system without a listener. Fortunately, the Metasploit
    framework deals with setting up the listener and requires very little human interaction.


    ## Shellcode

    Shellcode is not exactly an independent module by itself. It is embedded as a
    submodule within the payloads module of the Metasploit framework. The explosive
    material present in the missile from the Aston Martin, a shellcode is the explosive
    inside of a payload module. The shellcode is the explosive that creates a hole,
    uploads malicious code, and executes the commands through a payload to generate
    a session or a shell on the target system. All payloads don''t need to contain
    a shellcode. For example, the `windows/adduser` payload will just create users
    on the target system.


    ## Accessing Metasploit

    There are several ways to access the Metasploit application. Until you have understood
    Metasploit deeply, we recommend using the graphical user interface method. You
    can access the GUI by selecting Metasploit Community/Pro from the Kali Linux desktop
    as follows:

    `Applications > Kali > Exploitation > Metasploit > Metasploit Community/Pro`


    Alternatively, it can also be accessed via the web browser on port 3720 by navigating
    to the following URL:

    `https://local-host: 3790/`


    Note: Since Metasploit works on the localhost, there is no valid certificate installed
    for Metasploit. The browser may prompt you with the “Connection is Insecure” message.
    You can click on “I Understand the Risks” and continue with “Add Exception.” If
    prompted, click on the “Confirm Security Exception” button.


    The first launch of Metasploit will prompt you to set up a username and password.
    There will be some other optional parameters too. The optional parameters are
    used for reporting. After you have provided all the input parameters, click on
    “Create Account” to continue.


    ## Startup/Shutdown

    As an ethical hacker, you may need to restart Metasploit at times. Metasploit
    is a resource-intensive application, and there are several applications on your
    Kali Linux system that may need the network service, causing Metasploit to freeze
    at times. If you encounter network errors, you can always restart Metasploit.


    Begin with checking the current status of Metasploit. You can run the following
    commands from the Kali Linux terminal for the same:


    To check the status of the service

    ```bash

    service metasploit status

    ```

    To restart the service

    ```bash

    service metasploit restart

    ```

    To stop the service

    ```bash

    service metasploit stop

    ```


    ## Updating the Metasploit Database

    Rapid7 develops Metasploit, but several inputs to it come daily from community
    users. There, it is advisable to update the Metasploit database before every use.
    Simply type the following command on the Kali Linux terminal:

    ```bash

    msfupdate

    ```

    You just need to sit and wait after typing the command and hitting enter. If you
    are already in the graphical user interface of Metasploit, you can click on Software
    Updates from the top right-hand corner of the web page and then click on Check
    for updates on the next page.


    Metasploit will instantly download and install the updates. We recommend that
    you restart the Metasploit service after every update for the changes to come
    into effect. For the Metasploit web interface, simply close the browser and open
    the Metasploit interface again.


    ## Using Metasploit

    Now that the Aston Martin is locked and loaded, it’s time to get on the field
    and begins scanning. When you log in to the web interface of Metasploit using
    the username and password you created, you will be presented with the login page.
    The page has a summary of current projects, target folders, possible vulnerabilities
    discovered, etc. As a first time user, you will only see a default project. The
    projects will start piling up on the landing page as and when you take up more
    projects using the `New Project` button. New users are recommended to use the
    default project to get started. This will help you transition smoothly to other
    tools required during the exploitation.


    To begin scanning, click on the `Scan` button in the Discovery section of the
    default project page. You will also see a `Target Settings` section, which allows
    you to provide inputs for hosts or a group of hosts just like Nmap. However, you
    should know about certain important and useful fields available in `Target Settings`,
    which can be found when you click on the `Advanced Options` button at the center
    of the page.


    Excluded Targets

    Any IP specified by you in this field will be excluded from the scan. You do not
    want to scan machines that are not target and waste time. You can input the IP
    address of your system and any other member’s IP address in this field. Furthermore,
    the rules of engagement may define certain machines that have sensitive information
    and should not be scanned at all. You can enter those here.


    Perform Initial Port

    When scan a target system for the first time, check this box. When you repeat
    scan on any target system, you can uncheck it, so don’t waste time.


    Custom Nmap Arguments

    An ethical hacker can use this option when custom modules need to be run. Individual
    switches for the scan can be defined here.


    Additional TCP Ports

    The default Metploit scan will target the most common ports. If an ethical hacker
    has information from the reconnaissance stage about a unique port, it can be added
    here to be included in the scan.


    Exclude TCP Ports

    The rules of engagement may define certain ports that should be excluded from
    the scan. These can be defined here.


    Custom Port Range

    If you have target with several members, you may split the port assignments amongst
    yourselves and define a range.


    Custom TCP Source Port

    Sometimes you may want to disguise the source port of your system to show some
    other port. This is useful to bypass access lists set up on firewalls. After you
    begin the scan, it may take some time to complete based on your system and state
    of the network. Metasploit is very efficient, but it has a huge number of processes
    running in the background.


    After the scan completes, click on the `Overview` tab at the top of the webpage.
    The discovery section shows that one host was scanned. If custom parameters would
    included, more vulnerability may be found. Given this was the first scan, we did
    not even do compliance check using Nexpose.


    If you click on the `Analysis` tab, you will get a list of all scanned hosts.
    If you click on the host’s IP, you will get more information. There are six important
    sections to this host information that provides you with the following information:


    Services

    The information available in the services section will tell you about the software
    and their versions on the target system. Some services may have hyperlinks as
    more information was retrieved about them during the scan.


    Vulnerabilities

    All the vulnerabilities discovered in the target system will be listed here. The
    vulnerabilities listed here will already have a Metasploit exploit linked to them
    for direct exploitation.


    File Shares

    If there are file shares advertised on the target system, they will get listed
    here. However, file shares on Linux systems are not advertised as openly as they
    are on Windows system.


    Notes

    Security settings, service accounts, shares, and discovered during scanning are
    listed here.


    Credentials

    If the scan captured any credentials, they would be listed here.


    Modules

    The modules section is not only related to exploiting modules, but it directly
    lets you launch an exploit related to a vulnerability that has been discovered.
    If you click on the hyperlink, an exploit will be launched automatically, and
    it will try to establish a session with the target system. Click on the `Launch`
    hyperlink, which is right to the module. Our scan returned the `Exploit: Java
    RMI Insecure Default Configuration Java Execution`. You will be presented with
    a page that describes the nature of the vulnerability and will fill up all other
    information needed to exploit the discovered vulnerability. By default, a generic
    payload, along with the Meterpreter shellcode, will be used by Metasploit. After
    you have reviewed the settings, click on `Run Module`.


    If the exploit is successful, you should see a message as “Success! 1 session
    has been created on the host.” This indicates that you successfully exploited
    the target system’s vulnerability, and it has now been compromised. When the target
    system was exploited, a Meterpreter shell was planted on it, and you will now
    see #1 in the `Sessions` tab, which can be used to interact with the target system.
    Click on `Session` to view all active sessions. The Sessions web page will display
    all the available sessions along its associated shells that are available for
    interaction with the target system. There is a small description that lists the
    account that is available to access the target system. Click on the `Session 1`
    hyperlink, which will launch a web-based interaction with the Meterpreter shell
    on the target system.


    ## Meterpreter Shell - Session Management

    After the Meterpreter shell has been planted on the target system, an ethical
    hacker can access a shell via session management in Meterpreter. However, many
    advanced functions can be driven through mere button clicks, and they also help
    to speed up the management of exploitation. As an ethical hacker, you need to
    find that perfect balance between time and execution. If you execute the wrong
    steps, security alarms may go off in the target system. And if you do not execute
    the required action, session time will be wasted.


    An ethical hacker sees all available actions to be executed on the target system
    as well as session history and tabs for modules to be used after exploitation.
    Any action you execute through this session gets logged for future references.
    You can also export these logs for reporting in the last stage of the penetration
    testing lifecycle.


    ## Actions Inside a Session

    You will be able to execute the following actions inside of a session:


    Collect System Data

    This will collect sensitive and critical data from a target system, such as passwords,
    screenshots, and system information. This button is the equivalent of a first
    stop and shop feature. You don''t need to get information about the root account
    in every session.


    Access File System

    This button will let you access the file system of the target system and upload
    or delete files. If the target system is a web server, uploading keyloggers, Trojans,
    and other malicious tools will always help you to exploit the system.


    Command Shell

    This option is for advanced ethical hackers. It lets you interact with a shell
    on the target system. If root credentials are not available, an ethical hacker
    will have to get dirty on the system’s command line.


    Create Proxy Pivot

    Pivot attacks using the target system as a gateway. If the target system was a
    proxy to a network of other systems, it can serve as a gateway to access all other
    systems.


    Create VPN Pivot

    You can convert the target system into a VPN gateway and direct traffic through
    it. This is very similar to the Create Proxy button except that all traffic is
    directed through an encrypted VPN tunnel. This helps when an ethical hacker wants
    to evade detection systems.


    Terminate Session

    This button will terminate all sessions on the target system and delete the Meterpreter
    shell from it. If an ethical hacker leaves behind malicious software on the target
    system, the target system is still compromised. Therefore, it is important to
    delete all such software or files before terminating the session.


    ## Exploiting Web Servers and Web Applications

    Software is nothing but a million lines of code written by humans. Irrespective
    of the language used to code software or the function of that software, it is
    prone to have vulnerabilities. Web applications are software running in a web
    browser. The only difference from regular local applications is that web applications
    have more public-facing entry points on the Internet. This allows an attacker
    to inject malware into the application, access the network, destroy the websites,
    or steal information from the server on which the web application is hosted. It
    is not sufficient to just secure an operating system. If the applications running
    on a system are not secure, the security of an operating system is useless.


    OWASP

    The Open Web Application Security Project or OWASP is a nonprofit organization
    working towards the security of software. There is an annual listing of the top
    10 vulnerabilities released by OWASP that are commonly exploited by attackers.
    At the time of writing this book in 2020, the top 10 vulnerabilities are as follows.

