    There are several tools on Kali Linux that use the TCP, UDP, and ICMP protocols
    to scan target. The result of a successful scan will give you information like
    hostnames, IP addresses, operating systems, and services. A few scanning tools
    can also discover vulnerabilities and user details gathered in the scanning stage.


    ## Scanning Tools


    ### Nmap: The King of Scanners

    `nmap` is the most popular scanning tool used by ethical hackers because it not
    only can list active hosts on a network but also determine operating systems,
    services, and even credentials in some cases. `nmap` uses a combination of commands,
    switches, and options to find elaborate details about target in the scanning stage.


    ### Structure of a Nmap Command

    The `nmap` command has a distinct structure that allows it to use switches and
    commands in a flexible manner. The figure below illustrates various parts of its
    syntax:

    ![](Image00004.jpg)


    - `-s`: The lowercase `s` prefix used in the scan instructs `nmap` that a specific
    type of scan needs to be conducted on the targets as defined by the user. The
    lowercase `s` is followed by an uppercase `S`, which will help to identify the
    type of scan. The use of the scan type can help an ethical hacker evade detection
    by security systems set up on a target network.

    - `-sS` Stealth Scan: The `nmap` scan will pick up a stealth scan even if no scan
    option is specified. Alternatively, you can initiate a stealth scan intentionally
    as well by appending the `-sS` option to the `nmap` command. The stealth scan
    will initiate a TCP connection with the target system but will not complete the
    three-way handshake. The initiating system will send a `SYN` packet to the target
    system, and the target system will reply with a `SYN/ACK` packet. However the
    initiating system will not send an `ACK` packet back, leaving the connection completely
    open since the communication channel is not established. Most modern systems will
    close such a connection automatically after waiting for the `ACK` packet for some
    time. However, older systems may not close the connection, and this scan can go
    completely undetected, making the scan less noisy. Most systems today will be
    able to detect a stealth scan, but this should not demotivate an ethical hacker
    from using it since it is still harder to detect a stealth scan compared to most
    other scanning techniques used.

    - `-sT TCP Connect Scan: The TCP connection scan completes the three-way handshake
    and establishes a proper connection with the target system. Therefore, it can
    collect more information compared to a stealth scan. The initiating system will
    send a `SYN` packet to the target system, and the target system will reply with
    a `SYN/ACK` packet. The initiating system will then send an `ACK` packet to the
    target system and set up a communication channel. The security systems on target
    networks can mostly log this scan, but it is used since it is capable of providing
    a lot of information.

    - `-sU UDP Scan: The UDP scan is used to analyze the UDP ports on a target system.
    As opposed to TCP ports, the UDP scan will expect to get a reply back from the
    target system about closed UDP ports. As we already know, when a packet is sent
    to a system on its UDP port, there is no response gathered. However, if the packet
    responds to the target system, you can conclude that the UDP port is open. If
    you do not get a response, the UDP port may or may not be open or filtered by
    a firewall.

    - `-sA`: The `-sA` scan is an ACK scan that is used to understand if a TCP port
    is filtered or not filtered. The scan will initiate a communication with the target
    system by sending an `ACK` flag. Ideally, a connection is initiated with a `SYN`
    flag, but this `ACK` flag can at times bypass the firewalls of a target system
    by pretending to be an `ACK` response for an internal request in the target system,
    even when there were no internal requests made within the target system. If this
    scan receives a reset (`RST`) response, it is an indication that the target port
    is not filtered. If no response is received or if an ICMP response is received
    with type 3 codes 1, 9, 10, or 13, it would mean the port is filtered.


    ### Timing Options

    As we have already learned, the default option used by `nmap` if nothing is specified
    is `-T3` or normal. There are several timing templates available for `nmap` scans:

    - `-T0` Paranoid: The `-T0` Paranoid scan is employed in cases where target network
    links are slow or you can risk getting detected. The scan works serially and pauses
    every five minutes.

    - `-T1` Sneaky: The `-T1` also used as sneaky scan is a bit faster than the paranoid
    scan, thereby reducing the time taken to complete the scan while maintaining the
    stealth stance. The value is ignored.

    - `-T2` Polite: The `-T2` also used as polite scan has an increased speed compared
    to `-T0` and `-T1` and is the last timing template that uses the serial technique.
    The `delay` value for this scan is 400 milliseconds, and the default is set to
    1 second.

    - `-T3` Normal: The `-T3` also used as normal scan is the default timing template
    for `nmap`. This means that even if you do not specify a timing template, `nmap`
    will use the settings of `-T3` for the scan. The template uses parallel processing,
    meaning it sends multiple probes simultaneously to the target system, which results
    in an increase in speed taken for scanning. This template has a `delay` value
    of 0 seconds, which can grow to a `max_scan_delay` of 1 second.

    - `-T4` Aggressive: The `-T4` also used as aggressive scan template also sends
    parallel probes while scanning a target system. The `delay` value is set to 0
    seconds, and it can grow to a `max_scan_delay` of 10 milliseconds. Scans that
    have their `max_scan_delay` value set to less than ten milliseconds can generate
    errors because most target operating systems have a minimum requirement of delay
    between probes to be 1 second.

    - `-T5` Insane: The `-T5` also used as insane scan is the fastest pre-defined
    time template for `nmap`. The template uses parallel scanning, and the `delay`
    value is set to 0 seconds, and it can grow to a `max_scan_delay` of 5 milliseconds.
    As mentioned in the aggressive scan, the insane scan can also generate an error
    since its `max_scan_delay` value is less than 1 second.


    ## Target

    The target is one of the most important parts of the `nmap` command string. If
    you end up specifying a wrong target, you may scan an empty IP space or systems
    that are not allowed under the rules of engagement. There are several ways to
    set a target for the `nmap` scan. We will learn about two of these methods: IP
    address range and scan list.


    ### IP Address Range

    It is a very straightforward process to define a target using an IP range. Let
    us take an example of a class C IP address range for our example. We can include
    a maximum of 254 hosts while using a class C IP address range. You can use the
    following command to scan all the hosts on a particular IP address range belonging
    to class C.

    ```

    nmap 10.0.2.1 -255

    ```

    You can also conduct the same scan using the Classless inter-domain routing (CIDR)
    addressing method and use the `/24` postfix. CIDR is a quick way to specify an
    IP address range but is beyond the scope of this book.

    ```

    nmap 10.0.2.1/24

    ```

    If the IP address set is small, you can define a smaller range as a target for
    the scan. For example, if you want to scan the first 50 IP addresses in a range,
    you can use the command as follows.

    ```

    nmap 10.0.2.1 -50

    ```


    ### Scan List

    You can also provide a text file as an input to your `nmap` scan command. The
    text file will include a list of IP addresses that are target systems. If you
    assume that the following IP addresses are stored as a list in a `target.txt`
    file:

    ```

    10.0.2.1

    10.0.2.15

    10.0.2.55

    ```

