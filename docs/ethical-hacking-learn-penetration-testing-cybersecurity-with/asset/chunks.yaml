    ## Ping

    `PingPing` 是用户直接接触的少数基于 ICMP 的应用程序之一。`ping` 命令会发送一个类型为 8、代码为 0 的包，表示该包是一个回显请求（echo
    request）。接收到包的系统会立即返回一个类型为 0、代码为 0 的包，即回显回复（echo reply）。成功的 `ping` 表示被 `ping`
    的系统在网络上是活跃的，因此是一个活跃的主机。如果你在 Windows 命令行中使用 `ping` 命令，它默认会发送四次请求，而 Linux 终端上的 `ping`
    命令将持续运行，直到被用户中断。


    让我们来看一个成功和一个失败的 `ping` 命令。


    如果被 ping 的主机是活跃的：

    ```

    Ping 192.168.1.1

    Pinging 192.168.1.1 with 32 bytes of data:

    Reply from 192.168.1.1: bytes=32 time=2ms TTL=64

    Reply from 192.168.1.1: bytes=32 time=1ms TTL=64

    Reply from 192.168.1.1: bytes=32 time=1ms TTL=64

    Reply from 192.168.1.1: bytes=32 time<1ms TTL=64

    ```


    如果主机不可达：

    ```

    Ping 192.168.1.200

    Pinging 192.168.1.200 with 32 bytes of data:

    Reply from 192.168.1.129: Destination host unreachable.

    Reply from 192.168.1.129: Destination host unreachable.

    Reply from 192.168.1.129: Destination host unreachable.

    Reply from 192.168.1.129: Destination host unreachable.

    Ping statistics for 192.168.1.200:

    Packets: Sent 5 4, Received 5 4, Lost 5 0 (0% loss)

    ```


    ## Traceroute

    `traceroute` 利用 ICMP `ping` 命令来确定在发起追踪的计算机系统和目标系统之间有多少个网络设备。`traceroute` 命令通过操作网络包的存活时间（Time
    To Live，也称为 `TTL`）来工作。`TTL` 表示同一个网络包在过期之前，被网络上下一个主机可以再次广播的次数。该命令为包分配一个初始 `TTL`
    值 1，表示该包只能在发起系统和目标系统之间再被一个设备广播。接收到的设备将回回一个 ICMP 类型 11、代码 0 的包，表示时间超时（time exceeded），且该包已被记录。发送者随后将包的
    `TTL` 增加一并发送下一组包。包根据其存活时间到达网络上的下一跳。结果是，接收路由器会发送另一个表示时间超时的回复。这个过程一直持续，直到包到达目标，并且路径上的所有跳都被记录。这会导致打印出一份存在于发起系统和目标系统之间的设备列表。此命令可以帮助渗透人员了解网络上存在种种设备。Windows
    设备的默认 `TTL` 为 128，Linux 设备为 64，Cisco 网络设备为 255。


    Windows 系统上的 `traceroute` 命令是 `tracert`。在 Linux 系统上，它是 `traceroute`。Windows 系统上的
    `tracert` 命令将产生如下输出。让我们以追踪到 google.com 为例：

    ```

    tracert www.google.com

    Tracing route to www.google.com [74.125.227.179]

    Over a maximum of 30 hops:

    1 1 ms<1 ms 1 ms 192.168.1.12 7 ms 6 ms 6 ms 10.10.1.23 7 ms 8 ms 7 ms 10.10.1.454
    9 ms 8 ms 8 ms 10.10.25.455 9 ms 10 ms 9 ms 10.10.85.996 11 ms 51 ms 10 ms 10.10.64.27
    11 ms 10 ms 10 ms 10.10.5.888 11 ms 10 ms 11 ms 216.239.46.2489 12 ms 12 ms 12
    ms 72.14.236.9810 18 ms 18 ms 18 ms 66.249.95.2311 25 ms 24 ms 24 ms 216.239.48.412
    48 ms 46 ms 46 ms 72.14.237.21313 50 ms 50 ms 50 ms 72.14.237.21414 48 ms 48 ms
    48 ms 64.233.174.13715 47 ms 47 ms 46 ms dfw06s32-in-f190.net [74.125.227.179]

    Trace complete.

    ```


    Kali Linux 上有多种工具使用 TCP、UDP 和 ICMP 协议扫描目标。成功扫描的结果将为您提供主机名、IP 地址、操作系统和服务等信息。一些扫描工具还可以扫描阶段发现漏洞。


    ## 扫描工具


    ### Nmap：扫描器之王

    `nmap` 是道德黑客最常用的扫描工具，因为它不仅可以列出网络上的活动主机，还能确定操作系统、服务，甚至在某些情况下发现凭据。`nmap` 使用命令、开关和选项在扫描阶段获取目标的详细信息。


    ### Nmap 命令结构

    `nmap` 命令具有独特的结构，允许灵活地使用开关和命令。下图展示了其语法的各个部分：Image00004.jpg


    - `-s`：扫描中的小写 `s` 前缀指示 `nmap` 在定义的目标上进行特定类型的扫描。小写 `s` 后面跟着大写的 `S`，这种扫描类型可以帮助道德黑客规避目标网络安全系统的检测。

    - `-sS` 隐扫描（Stealth Scan）：即使没有指定选项，`nmap` 扫描也会执行隐扫描。或者，你也可以通过向 `nmap` 命令附加 `-sS`
    选项故意启动隐扫描。隐扫描将与目标系统建立 TCP 连接但不会完成三次握手。发送者向目标系统发送一个 `SYN` 包，目标系统将回复 `SYN/ACK` 包。然而发送者不会回
    `ACK` 包，因为通信通道尚未建立。大多数现代系统会在等待 `ACK` 包一段时间后自动关闭连接，但较旧系统可能不会关闭连接，这种扫描可以完全不被发现，由于与其他使用的扫描技术相比，它更难检测。

    - `-sT` TCP 连接扫描（Connect Scan）：TCP 连接扫描完成三次握手并与目标系统建立正式连接。因此，它可以比隐扫描收集更多信息。发送者向目标系统发送一个
    `SYN` 包，目标系统将回复 `SYN/ACK` 包。发送者随后向目标系统发送 `ACK` 包并建立通信通道。目标网络上的安全系统大多会记录这种扫描，因为它提供了大量信息。

    - `-sU` UDP 扫描：UDP 扫描用于分析目标系统的 UDP 端口。与 TCP 端口不同，UDP 扫描期望从目标系统获得关于关闭的端口的回复。如我们所知，当向系统的
    UDP 端口发送包时，没有收集到响应。然而，如果目标系统有响应，你可以得出该 UDP 端口是开启的。或者是被防火墙过滤。

    - `-sA`：`-sA` 扫描是一种 ACK 扫描，用于理解 TCP 端口是否被过滤。扫描通过发送 `ACK` 标记与目标系统建立通信。理想情况下，使用
    `SYN` 标记启动连接，但此 `ACK` 标记有时可以伪装成系统内部请求的 ACK 回复来绕过防火墙。如果此扫描接收到重置（RST）响应，则表明端口未被过滤。如果没有收到响应，或者收到代码为
    1、9、10 或 13 的类型 3 ICMP 响应，则意味着端口被过滤。


    ### 时间选项

    我们已经过的，如果没有指定，`nmap` 使用的默认选项是 `-T3` 或普通（normal）。`nmap` 扫描有几种时间模板可用：

    - `-T0` 紧张（Paroid）：`-T0` 紧张扫描用于网络链路较慢或你面临被检测风险的情况。扫描以串行方式工作，并每五分钟暂停一次。

    - `-T1` 狡猾（Sneaky）：`-T1` 也称为狡猾扫描，比紧张扫描快一点，从而在保持隐藏的同时缩短完成扫描的时间。该值被忽略。

    - `-T2` 礼貌（Polite）：`-T2` 也称为礼貌扫描，速度比 `-T0` 和 `-T1` 快，是最后一个使用串行技术的时间模板。此扫描的 `delay`
    值为 400 毫秒，默认设置为 1 秒。

    - `-T3` 普通（Normal）：`-T3` 也称为普通扫描，是 `nmap` 的默认时间模板。这意味着即使你没有指定时间模板，`nmap` 也将使用
    `-T3` 的设置进行扫描。该模板使用并行处理，意味着它同时向目标系统发送多个探测包，导致速度增加。

    - `-T4` 激进（Aggressive）：`-T4` 称为激进扫描，适用于网络速度较快的情况。

    - `-T5` 疯狂（Mad）：`-T5` 称为疯狂扫描，是最快的模板，适用于网络非常快的情况。


