    that it is all right for their email to get hacked because it does not contain
    any critical information. This attitude needs to change because an email, when
    hacked, can be used by the hacker to send out misleading emails to all your contacts
    in your email account. The recipients will believe that the email is from you
    and end up disclosing information to the hacker that should have been private
    between you and your contacts. Often, hackers hack email IDs, not for the data,
    but to steal an identity to use it further for malicious activities. You may have
    heard about email cases where a person receives an email with a link from their
    friend’s email ID, and they are redirected to the attacker’s website and end up
    downloading malware from there.Email SpoofingEmail Spoofing, as discussed earlier,
    is the manipulation of an email header to make the email look like it came from
    an authentic source even when it came from a malicious source. Spammers usually
    employ email spoofing to get unsuspecting recipients to open their emails and
    even reply to their solicitations. The most dangerous part about spoofing is that
    there are legitimate ways available to spoof an email. There are multiple techniques
    to send an email using a FROM address for which you don’t even know the password.
    The Internet is a vulnerable place, and it is indeed possible to send a threatening
    or a malicious email to someone spoofing an email ID that does not even belong
    to you.Email Spoofing MethodsThere are many methods to spoof emails, but let us
    discuss the two most used methods.Open Relay ServerAn Open Relay Server is a server
    with Simple Mail Transfer Protocol running on it and is configured in a way that
    anyone can send an email from it without necessarily being a user that exists
    on it. This means that unknown users can also send mails through it. An attacker
    can connect on an open relay server using telnet and type in a set of instructions
    to send an email through it. There is no password authentication required to send
    an email through an open relay server.Email ScriptsThe second most popular way
    of spoofing emails is via email scripts. Email scripts were originally developed
    to send genuine emails, but attackers soon realized that since an email script
    does not require password authentication, it could be used for email spoofing
    as well. An attacker just needs to procure a web-hosting service from a hosting
    provider and set up an email script to modify the email headers as per their requirement.
    Many hosting providers have realized that this may result in an unclean reputation
    for their server and have started putting restrictions on their hosting servers
    that the FROM address in the mail script needs to match the domain name of the
    web hosting package and cannot be any other domain name.Let us look at an example
    of a PHP mail sending script.<?$mailto="some-name@yourdomain.com";$pcount=0;$gcount=0;$subject
    = "Mail from Enquiry Form";$from="some-name@abc.com";while (list ($key,$val)=each
    ($_POST)){$pstr = $pstr."$key : $val \n ";++$pcount;}while (list ($key,$val)=each
    ($_GET)){$gstr = $gstr."$key : $val \n ";++$gcount;}if ($pcount > $gcount){$message_body=$pstr;mail
    ($mailto,$subject,$message_body,"From:".$from);echo "Mail has been sent";}else{$message_body=$gstr;mail
    ($mailto,$subject,$message_body,"From:".$from);echo "Mail has been sent";}?>If
    you look at this PHP mail script, you will see that it has the following parameters
    that essentially are the most important parts in an email header.•          mailto•         
    from•          subject•          message_bodyAn attacker can simply host this
    script on a web-hosting server as a PHP file and replaces these parameters with
    the parameter of their choice to send emails. To give you an idea, they can use
    the from parameter of the header as info@amazon.com, and the recipient will believe
    that they have received a genuine email from amazon.com.Consequences of Receiving
    a Spoofed EmailSpoofed emails, if taken seriously by the recipients, can have
    dangerous consequences.•         An email about a bomb spoofed from your email
    ID and sent to a security agency can result in you spending the rest of your life
    in prison.•          Spoofed emails between partners or spouses containing hurtful
    information can result in a breakup or a divorce.•         A spoofed email from
    your email ID containing a resignation letter sent to your boss can have bad consequences.•         
    Spoofed emails can be used for fraudulent activities leading to monetary losses.Identifying
    a Spoofed EmailThe header of every email contains complete details of the path
    an email has traversed before landing in your inbox. It is very important that
    if you see an email that you feel does not belong in your inbox or promises things
    that are too hard to be true, as a thumb rule, you first go through the headers
    of the email. The headers will help you identify the original source of an email
    and will also display the forged source of the email. Headers help you understand
    if the email was sent using an email service or an email script as they will display
    the name of the website on which the email script was executed.There are simpler
    ways of identifying a spoofed email as well. The following flags should trigger
    your senses and let you know that the email is spoofed.If the subject of the email
    matches something like:•          Your email account has been hacked. Reset your
    password immediately!•          Your personal details have been hacked.•         
    Your bank account details have been hacked.Or if the email requests you for information
    along the lines of:•          Your personal or bank account details.•         
    The email requests you to deposit money in a particular account for pending dues.•         
    Visit a link to reset your password or verify your credentials.•          A job
    portal link for a job profile you never looked up.In addition to this, there are
    certain technical parameters in the header of an email that will help you understand
    if the email is spoofed too.Let us have a look at the following part of an email
    header for an email received by gmail.comReceived-SPF: pass (google.com: best
    guess record for domain of postmaster@mail-sor-f69.google.com designates 209.85.220.69
    as permitted sender) client-ip=209.85.220.69;Authentication-Results: mx.google.com;dkim=pass
    header.i=@googlemail.com header.s=20161025 header.b=n0p3627r;spf=pass (google.com:
    best guess record for domain of postmaster@mail-sor-f69.google.com designates
    209.85.220.69 as permitted sender) smtp.helo=mail-sor-f69.google.com;dmarc=pass
    (p=QUARANTINE sp=QUARANTINE dis=NONE) header.from=googlemail.comDKIM-Signature:
    v=1; a=rsa-sha256; c=relaxed/relaxed;d=googlemail.com; s=20161025;h=to:auto-submitted:message-id:date:from:subject:references:in-reply-to;bh=cfcLUX2oA1dgPHL34Z1QqoUnCvAkr1/oTXh1HPoFQIY=;
    header contains two parameters that are used by email servers to identify the
    authenticity of an incoming email.Received-SPFAn SPF record is a TXT based DNS
    record that is provided by an email provider to be added in the DNS zone of a
    domain name. The SPF record syntax has IP addresses that are allowed to send emails
    on behalf of the domain name.In the above example, when gmail.com is analyzing
    the incoming email, it is checking the SPF record of the sender’s domain name
    and can see that the IP 209.85.220.69 is allowed to send the email on the domain’s
    behalf. If the source IP of the incoming email were to be something else, gmail.com
    would have classified the email as spam.DKIM-SignatureThe DKIM signature is another
    parameter that holds a publicly available key with which the sender’s domain has
    been signed. When gmail.com receives the incoming email, it sends a request to
    the sender’s server to match this key with the sender domain’s respective key
    on the originating server. If the key matches, the email is believed to be genuine
    again.Email PhishingEmail Phishing is the process of sending an email to a person
    claiming to be someone and tricking them into disclosing sensitive information
    such as their personal details or bank account details. Essentially, email phishing
    is a product of email spoofing. The attacker will send you an email; they may
    do this by manipulating the headers of the email to look like a legitimate source.
    Alternatively, if they aren’t that good at hacking, they will try to send an email
    from an email address that is very similar to legitimate email addresses. For
    example, they will create an email address like info@citiibank.com. At first glance,
    this looks like a genuine email address for Citibank, but if you look closely,
    there are two I’s in it. If you are not very careful, you may end up clicking
    on a malicious link in the body of the email planted by the attacker to redirect
    you to a website where you will be asked for your banking details. The website,
    however, is a fake website developed by the attacker only to steal your information.Phishing
    ScamsWhat do some of the most common phishing emails look like? Phishing emails
    mostly have content that promises you that you have won something big. Attackers
    rely on how gullible a target is to be successful in phishing scams.In early 2000,
    African attackers sent out a lot of emails to users claiming that they were someone
    with a lot of wealth and wanted to give it away to common people in their dying
    moments. The sum would be as big as USD 100,000\. Gullible recipients would fall
    for this and reply to these emails expecting to make some easy money. However,
    as the process progresses, the attackers would request the winners to send in
    a minimal amount of money, which would be needed to transfer the winning amount
    to the user’s bank account. This would be a sum like USD 100, and the users would
    send this amount to the attackers, only to never hear from them ever again.Prevention
    against PhishingYou can follow some basic precautions to protect yourself against
    phishing scams.•         Make sure that you read an email carefully and double-check
    the sender of the email. If the sender is a known friend, but the email looks
    a bit odd, call them up and check with them if they sent you any such email.•         
    If the email contains links, carefully examine the link before clicking on it.•        
    If you have somehow clicked on a link and landed on a website requesting you to
    enter your login details, examine the URL in the browser to check if it is indeed
    a URL that you are familiar with.•          Login into websites that have a digital
    certificate installed on them and work on the HTTPS protocol.Securing your Email
    AccountSimple measures can go a long way in protecting yourself from email hacking.
    Some simple steps to be careful while working with emails are as follows.•        
    When you set up a new email account, always configure a secondary email account
    or an alternate email account to help you with email recovery in case the primary
    account is hacked.•         Do not take the security questions section of setting
    up a new email account lightly. Set up real questions from your life with real
    answers as the security questions will help you recover an email account if it
    is hacked or if you have forgotten your password.•          As a thumb rule, avoid
    opening emails from strangers.•         Always use your personal computer to check
    emails and do not use anyone else’s computer as you may end up leaving your email
    account logged in on their computer.•          No matter how much you trust a
    person, never reveal your passwords to them.Conclusion![](Image00003.jpg)I sincerely
    hope you enjoyed this book and that it helped you to get jump-started into the
    world of ethical hacking. The tools mentioned in every chapter of the penetration
    testing lifecycle are the most popular and commonly used tools by ethical hackers.
    You can use them as a foundation to explore other tools available in Kali Linux
    that will help you in every stage of the penetration testing lifecycle.I would
    like to conclude by saying that ethical hacking is a noble profession and not
    a criminal activity as misinterpreted by the masses. While it is a fact that malicious
    hacking is a crime and should be considered as a criminal activity, ethical hacking
    never was, and never will be categorized as a crime. The main aim of ethical hacking
    is to help companies with IT policies and industry regulations.Ethical hacking
    was designed to prevent malicious hacking. Malicious hacking should be prevented,
    but at the same time, ethical hacking, which encourages innovation, research,
    and technological breakthroughs, needs to be promoted so that the masses can be
    made aware of this noble profession.  Now that you know how to get started with
    hacking, it is my responsibility to tell you to use the skills for a good reason.
    There are many job opportunities out there, and there is a lot of respect for
    ethical hackers, so make use of your talent and hone your skills.I wish you good
    luck with your hacking endeavors.References![](Image00003.jpg)[https://www.kali.org/](https://www.kali.org/)[https://www.getastra.com/blog/knowledge-base/hacking-terminologies/](https://www.getastra.com/blog/knowledge-base/hacking-terminologies/)[https://www.simplilearn.com/tutorials/cyber-security-tutorial/what-is-ethical-hacking](https://www.simplilearn.com/tutorials/cyber-security-tutorial/what-is-ethical-hacking)[https://www.getastra.com/blog/knowledge-base/hacking-terminologies/](https://www.getastra.com/blog/knowledge-base/hacking-terminologies/)[http://index-of.es/Varios-2/Hacking%20with%20Kali%20Practical%20Penetration%20Testing%20Techniques.pdf](http://index-of.es/Varios-2/Hacking%20with%20Kali%20Practical%20Penetration%20Testing%20Techniques.pdf)[http://index-of.es/Hack/Hacking%20For%20Beginners%20-%20a%20beginners%20guide%20for%20learning%20ethical%20hacking.pdf](http://index-of.es/Hack/Hacking%20For%20Beginners%20-%20a%20beginners%20guide%20for%20learning%20ethical%20hacking.pdf)[https://www.virustotal.com/gui/home/upload](https://www.virustotal.com/gui/home/upload)[https://www.google.com/url?q=http://index-of.es/Varios-2/Hacking%2520with%2520Kali%2520Practical%2520Penetration%2520Testing%2520Techniques.pdf&sa=D&source=hangouts&ust=1594202982166000&usg=AFQjCNEgx26foe9hlWCXrX4Xr9gHr8099w](https://www.google.com/url?q=http://index-of.es/Varios-2/Hacking%2520with%2520Kali%2520Practical%2520Penetration%2520Testing%2520Techniques.pdf&sa=D&source=hangouts&ust=1594202982166000&usg=AFQjCNEgx26foe9hlWCXrX4Xr9gHr8099w)'
