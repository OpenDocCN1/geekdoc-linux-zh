    when custom modules need to be run. Individual switches for the scan can be defined
    here.Additional TCP PortsThe default Metasploit scan will target the most common
    ports. If an ethical hacker has information from the reconnaissance stage about
    a unique port, it can be added here to be included in the scan.Exclude TCP PortsThe
    rules of engagement may define certain ports that should be excluded from the
    scan. These can be defined here.Custom TCP Port RangeIf you have an ethical hacking
    team with several members, you may split the port assignments amongst yourselves
    and define a range per person while setting up the scan parameters.Custom TCP
    Source PortSometimes you may want to disguise the source port of your system to
    show some other port. This is useful to bypass access control lists set up on
    firewalls.After you begin the scan, it may take some time to complete based on
    your system and state of the network. Metasploit is very efficient, but it has
    a huge number of processes running in the background.After the scan completes,
    click on the Overview tab at the top of the Metasploit webpage. Our example gave
    us the result as follows. The discovery section shows that one host was scanned,
    which had over 30 services, and one vulnerability was discovered. This is a good
    result considering this was just a default scan. If custom parameters would be
    included, more vulnerability may be found. Given this was the first scan, we did
    not even do a compliance check using Nexpose.If you click on the Analysis tab,
    you will get a list of all scanned hosts. If you click on the host’s IP, you will
    get more information.There are six important sections to this host information
    section that provides you with the following information.ServicesThe information
    available in the services section will tell you about the software and their versions
    on the target system. Some services may have hyperlinks as there was more information
    retrieved about them during the scan.VulnerabilitiesAll the vulnerabilities discovered
    in the target system will be listed here. The vulnerabilities listed here will
    already have a Metasploit exploit module linked to them for direct exploitation.File
    SharesIf there are file shares advertised on the target system, they will get
    listed here. However, file shares on Linux systems are not advertised as openly
    as they are advertised on a Windows system.NotesSecurity settings, service accounts,
    shares, and exports discovered during scanning are listed here.CredentialsIf the
    scan captured any credentials, they would be listed here.ModulesThe modules section
    is not only related to exploiting modules, but it directly lets you launch an
    exploit related to a vulnerability that has been discovered. If you click on the
    hyperlink, an exploit will be launched automatically, and it will try to establish
    a session with the target system.Click on the Launch hyperlink, which is right
    next to the module. Our scan returned the “Exploit: Java RMI Server Insecure Default
    Configuration Java Code Execution” vulnerability. You will be presented with a
    page that describes the nature of the vulnerability and will fill up all other
    information needed to exploit the discovered vulnerability. By default, a generic
    payload, along with the Meterpreter shellcode, will be used by Metasploit. After
    you have reviewed the settings, click on the Run Module.If the exploit is successful,
    you should see a message as “Success! 1 session has been created on the host.”This
    indicates that you successfully exploited the target system’s vulnerability, and
    it has now been compromised. When the target system was exploited, a Meterpreter
    shell was planted on it, and you will now see #1 in the Sessions tab, which can
    be used to interact with the target system. Click on Session to view all active
    sessions.The Sessions web page will display all the available sessions along with
    its associated shells that are available for interaction with the target system.
    There is a small description that lists the account that is available to access
    the target system. Click on the Session 1 hyperlink, which will launch a web-based
    interaction with the Meterpreter shell on the target system.Meterpreter Shell
    - Session ManagementAfter the Meterpreter shell has been planted on the target
    system, an ethical hacker can access a shell via session management in Meterpreter.
    However, many advanced functions can be driven through mere button clicks, and
    they also help to speed up the management of exploitation.As an ethical hacker,
    you need to find that perfect balance between time and execution. If you execute
    the wrong steps, security alarms may go off in the target system. And if you do
    not execute the required action, session time will be wasted.An ethical hacker
    sees all available actions to be executed on the target system as well as session
    history and tabs for modules to be used after exploitation. Any action you execute
    through this session gets logged for future references. You can also export these
    logs for reporting in the last stage of the penetration testing lifecycle.![](Image00005.jpg)Actions
    Inside a SessionYou will be able to execute the following actions inside of a
    session.Collect System DataThis will collect sensitive and critical data from
    a target system, such as passwords, screenshots, and system information. This
    button is the equivalent of a first stop and shop feature. You don''t need to
    get information about the root account in every session. Therefore, it is always
    useful to pull up all available system information to understand the target system
    better.Access File SystemThis button will let you access the file system of the
    target system and upload, download or delete files on it. If the target system
    is a web server, uploading keyloggers, Trojans, backdoors, and other malicious
    tools will always help you to exploit the system further. Just ensure that you
    do not upload something like your resume here.Command ShellThis option is for
    advanced ethical hackers. It lets you interact with a command shell on the target
    system. If root credentials are not available, an ethical hacker will have to
    get dirty on the system’s command line.Create Proxy PivotPivot attacks using the
    target system as a gateway. If the target system was a proxy to a network of other
    computer systems on the network, it can serve as a gateway to access all the other
    systems and exploit the other systems as well.Create VPN PivotYou can convert
    the target system into a VPN gateway and direct traffic through it. This is very
    similar to the Create Proxy Pivot button except that all traffic is directed through
    an encrypted VPN tunnel. This helps when an ethical hacker wants to evade intrusion
    detection systems.Terminate SessionThis button will terminate all sessions on
    the target system and delete the Meterpreter shell from it. If an ethical hacker
    leaves behind malicious software on the target system, the target system is still
    compromised. Therefore, it is important to delete all such software or files before
    terminating the session.This is it. Metasploit is one of the superpowers for an
    ethical hacker to possess. There are more than 400 tools available in Kali Linux,
    and yet, there are entire books dedicated to Metasploit alone. It will take you
    time and patience to get experienced with the Metasploit framework, but it will
    be worth it.Exploiting Web Servers and Web ApplicationsSoftware is nothing but
    a million lines of code written by humans. Irrespective of the language used to
    code software or the function of that software, it is prone to have vulnerabilities.
    Web applications are software running in a web browser. The only difference from
    regular local applications is that web applications have more public-facing entry
    points on the Internet. This allows an attacker to inject malware into the application,
    access the network, destroy the websites, or steal information from the server
    on which the web application is hosted. It is not sufficient to just secure an
    operating system. If the applications running on a system are not secure, the
    security of an operating system is useless.OWASPThe Open Web Application Security
    Project or OWASP is a nonprofit organization working towards the security of software.
    There is an annual listing of the top 10 vulnerabilities released by OWASP that
    are commonly exploited by attackers. At the time of writing this book in 2020,
    the top 10 vulnerabilities are as follows.'
