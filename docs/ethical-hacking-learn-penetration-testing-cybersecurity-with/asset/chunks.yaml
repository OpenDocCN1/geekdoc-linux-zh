    \    - 账户安全\n    - 结论\n    - 参考文献\n\n# 引言\n![](img/Image0003.jpg)\n《道德黑客：通过高级黑客技术与方法学习渗透测试网络安全》将向你介绍黑客的概念，并让你对道德黑客有更深入的理解。本书旨在教你如何使用道德黑客可用的最强工具：Kali\
    \ Linux 进行渗透测试生命周期。本书将带你了解世界上不同类型的黑客、他们的黑客动机，以及普通用户如何避免成为黑客的目标。你将学习如何下载和安装 Kali\
    \ Linux，使其成为你道德工具箱中的永久工具。本书将详细介绍渗透测试生命周期的五个阶段：侦察、扫描、利用、维持访问和报告。Kali Linux 提供了数百种工具用于渗透测试生命期的每个阶段。本书的每一章都将阐述渗透测试生命周期，并涵盖各个阶段常用的工具。报告阶段将教你如何创建详细报告，向高层展示渗透测试活动的结果，以便他们了解修复组织数字基础设施漏洞所采取的措施。\n\
    \n本书面向技术人员和软件工程师。不同技术领域的技术人员可以从了解渗透测试员和道德黑客如何工作中获益。软件工程师通过了解他们的软件如何受到攻击，可以更好地理解漏洞。这将确保他们在软件开发阶段能够加小心。当然，开发阶段仍然会有错误，但关于渗透测试的知识可以帮助他们大幅减少这些错误。此外，想要改变现有职业并转行渗透测试的技术人员可以从书中中学到很多。技术人员已经拥有其所属领域的知识，这可以作为切换到道德黑客职业的先决条件。例如，拥有服务器技术知识和经验的服务器管理员可能会成为作为道德黑客保护该服务器的最佳人选。这也适用于其他技术职业。\n\
    \n想要提高黑客攻击知识的安全工程师或道德黑客可以从书中获益，从而更好地保护他们正在工作的系统。安全工程师和道德黑客可以通过应用书中提到的道德黑客步骤，开发并自动化自己的工具，以支持和保护他们所工作组织的系统。本书将成为信息安全领域学生的宝库。关于渗透测试的见解将帮助信息安全学生理解这一领域。\n"
