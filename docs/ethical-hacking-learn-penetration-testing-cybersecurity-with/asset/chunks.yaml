    the systems administered by them or the software developed by them so that they
    can make the necessary corrections if needed. This makes Reporting a very important
    stage of the penetration testing lifecycle. The test reported is divided into
    a few sections, and we will discuss them in this chapter.Let us go through the
    various sections of a penetration test report one by one.The Penetration Test
    ReportExecutive SummaryThe highlights of the penetration testing activity are
    mentioned in the executive summary section of the penetration test report. It
    provides an overview of the assessment. This mainly includes details such as•         
    The location of the test•          If the test was remote or local•          Details
    of the members of the ethical hacking team•          Advanced description of the
    security settings of the information systems and the vulnerabilities discoveredThis
    section also serves as a good place to suggest data through visual representation,
    such as graphs and pie charts that show all the exploits that were executed on
    the target system. You should limit this section to three paragraphs. This section
    goes at the beginning of the report but is mostly composed after all the other
    sections of the penetration test report have been completed. Engagement ProcedureThis
    section will contain the engagements of the ethical hacking team along with the
    limits encountered and the various other processes. The section will describe
    the various types of tests that were conducted on the target system. It will have
    answers to questions such as “Was social engineering a part of the test?” “Was
