    # 8 (Echo Request) 0 Echo Request


    ## Ping

    `PingPing` is one of the few ICMP based applications that a user is directly exposed
    to. The `ping` command will send a type 8 and code 0 packet that indicates that
    this packet is an echo request. Systems that receive this package will instantly
    respond with a type 0 code 0 packet, which is an echo reply. A successful `ping`
    indicates that the system that was `ping`ed is live on the network and is, therefore,
    a live host. If you use the `ping` command on the Windows command line, it sends
    the request four times by default, while the `ping` command on the Linux terminal
    will keep going until interrupted by the user.


    Let us look at a successful and unsuccessful `ping` command.


    If the host that is being pinged is Live

    ```

    Ping 192.168.1.1

    Pinging 192.168.1.1 with 32 bytes of data:

    Reply from 192.168.1.1: bytes=32 time=2ms TTL=64

    Reply from 192.168.1.1: bytes=32 time=1ms TTL=64

    Reply from 192.168.1.1: bytes=32 time=1ms TTL=64

    Reply from 192.168.1.1: bytes=32 time<1ms TTL=64

    ```


    If the host is unreachable

    ```

    Ping 192.168.1.200

    Pinging 192.168.1.200 with 32 bytes of data:

    Reply from 192.168.1.129: Destination host unreachable.

    Reply from 192.168.1.129: Destination host unreachable.

    Reply from 192.168.1.129: Destination host unreachable.

    Reply from 192.168.1.129: Destination host unreachable.

    Ping statistics for 192.168.1.200:

    Packets: Sent 5 4, Received 5 4, Lost 5 0 (0% loss)

    ```


    ## Traceroute

    `traceroute` employs the ICMP `ping` command to figure out how many network devices
    lie between the computer system initiating the trace and the target system. The
    `traceroute` command functions by manipulating the Time To Live value of a network
    packet, also known as `TTL`. `TTL` indicates the number of times the same network
    packet can be broadcasted again by the next host on the network before the packet
    expires. The command assigns an initial `TTL` value of 1 to the packet indicating
    that the packet can be broadcasted only by one more device between the initiating
    system and the target system. The receiving device will then send back an ICMP
    type 11 code 0 packet indicating time exceeded, and that the packet has been logged.
    The sender then increases the `TTL` of the packet by one and sends the next set
    of packets. The packets reach the next hop on the network as per their time to
    live. As a result of this, the receiving router sends another reply indicating
    time exceeded. This process continues until the packets reach the target, and
    all hops on the route have been logged. It leads to printing a list of devices
    that exist between the initiating system and the target system. This command can
    help a penetration tester to understand the kind of devices that are present on
    the network. The default `TTL` of Windows-based devices is 128, Linux-based devices
    are 64, and Cisco networking devices is 255.


