    corrective actions to be taken for each vulnerability that has been discovered.
    This can be a section of its own with a description of every vulnerability, followed
    by the recommendation on how to fix it. The corrective action should not define
    the exact technical fix but should be a generic fix so that the system owners
    can figure out the exact fix on their own. For instance, a finding of a default
    password should have a recommendation that enforces a strong password policy for
    the employees.ConclusionThis section will summarize the vulnerabilities and the
    corrective actions proposed in a few lines. You can also put down critical findings
    in this section so that system owners can pay extra attention to them.AppendicesThis
    section will cover all the information that supports the report and is information
