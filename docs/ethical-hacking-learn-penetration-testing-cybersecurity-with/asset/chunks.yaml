    # 漏洞模块 (Exploit Modules)

    数据库中预定义的代码包可用于发现目标系统（无论是本地还是远程）的漏洞并破坏系统，这些被称为利用模块。利用模块可以实现对敏感信息的拒绝服务（DoS）访问，或者上传可用于进一步利用的载荷模块。


    ## 辅助模块 (Auxiliary Modules)

    辅助模块不需要像利用模块那样需要载荷即可运行。相反，辅助模块包含模糊测试器（fuzzers）、扫描器（scanners）和 SQL 注入工具等程序。辅助模块
    true 一些非常强大的工具，使用时需要极其谨慎。伦理黑客可以使用辅助模块中提供的大量扫描器来了解目标系统的漏洞，然后平滑过渡到利用模块。


    ## 载荷 (Payloads)

    如果将詹姆斯·邦德的阿斯顿马丁比作整个 Metasploit 框架，那么利用模块和辅助模块就是它的火箭发射。从这个意义上说，载荷指的是部署在目标上以维持追踪和通信的通信设备。当你在有漏洞的机器上执行利用时，载荷将作为附件发送到利用程序。载荷包含了由被利用系统执行的指令。载荷有不同的类型。其中一些是行代码，而另一些可能是像
    `Meterpreter Shell` 这样的完整应用程序。Metasploit 框架内置了超过 200 种不同类型的载荷。


    ## 监听器 (Listeners)

    即使是詹姆斯·邦德也必须听从 M 的指令。监听器是 Metasploit 框架中提供的处理器。当载荷部署在目标系统上时，它会创建一个会话，监听器用于与这些会话交互。监听器可以是一个等待传入连接的休眠
    bind shell，也可以主动监听来自目标系统会话的传入连接。如果没有监听器，伦理黑客系统与目标系统之间无法进行双向通信。幸运的是，Metasploit
    框架负责监听器的设置，只需要极少的人工交互。


    ## Shellcode (Shellcode)

    Shellcode 本身并不完全是一个独立的模块。它是作为子模块嵌入在 Metasploit 框架的载荷模块中的。就像阿斯顿马丁导弹中存在的爆炸物一样，shellcode
    是载荷模块内部的爆炸物。shellcode 是创建漏洞、上传恶意代码并通过载荷执行命令，从而在目标系统上生成会话或 shell 的爆炸物。并不是所有载荷都需要包含
    shellcode。例如，`windows/adduser` 载荷将在目标系统上创建用户。


    ## 访问 Metasploit (Accessing Metasploit)

    有几种方法访问 Metasploit 。在深入理解 Metasploit 之前，我们建议使用图形用户界面方法。你可以如下所示从 Kali Linux 桌面选择
    Metasploit Community/Pro 来访问 GUI：

    `Applications > Kali > Exploitation > Metasploit > Metasploit Community/Pro`


    此外，也可以通过浏览器在 3720 端口通过以下 URL 访问：

    `https://local-host: 3790/`


    注意：由于 Metasploit 在本地主机运行，因此 Metasploit 没有安装有效的证书。浏览器可能会提示你“连接不安全”（Connection is
    Insecure）的消息。你可以点击“我理解风险”（I Understand the Risks）并继续“添加异常”（Add Exception）。如果弹出提示，点击“确认安全异常”（Confirm
    Security Exception）按钮。


    首次启动 Metasploit 将提示你设置用户名和密码。还有一些其他可选参数。可选参数用于报告。在你提供所有输入参数后，点击“创建账户”（Create Account）继续。


    ## 启动/停止 (Startup/Shutdown)

    作为伦理黑客，你有时可能需要重启 Metasploit。Metasploit 是一个资源密集型应用程序，你的 Kali Linux 系统上有几个应用程序可能需要网络服务，导致
    Metasploit 有时冻结。如果你遇到网络错误，可以随时重启 Metasploit。


    从检查 Metasploit 的当前状态开始。你可以从 Kali Linux 终端运行以下命令来实现：


    检查服务状态

    ```bash

    service metasploit status

    ```

    重启服务

    ```bash

    service metasploit restart

    ```

    停止服务

    ```bash

    service metasploit stop

    ```


    ## 更新 Metasploit 数据库 (Updating the Metasploit Database)

    Rapid7 开发了 Metasploit，但每天都有来自社区用户的多次输入。因此，建议在每次使用之前更新 Metasploit 数据库。只需在 Kali
    Linux 终端上输入以下命令即可：

    ```bash

    msfupdate

    ```

    输入命令并按回车后，你只需坐等。如果你已经在 Metasploit 的图形用户界面中，可以点击网页右上角的“软件更新”（Software Updates），然后在下一页上点击“检查更新”（Check
    for updates）。


    Metasploit 将立即下载并安装更新。我们建议在每次更新后重启 Metasploit 服务以使更改生效。对于 Metasploit 界面，只需关闭浏览器并重新打开
    Metasploit 界面即可。


    ## 使用 Metasploit (Using Metasploit)

    现在阿斯顿马丁已经准备就绪，是时候进入战场开始扫描了。当你使用创建的用户名和密码登录 Metasploit 界面时，你将看到登录页面。该页面有当前项目、目标文件夹、发现的可能漏洞等摘要。作为首次用户，你只会看到一个默认项目。当你开始使用更多项目时，项目将会在落地页上堆积。使用“新项目”（New
    Project）按钮时，项目将开始在落地页上堆积。要开始扫描，点击默认项目 Discovery 部分的“扫描”（Scan）按钮。你还会看到“目标设置”（Target
    Settings）部分，它允许你为主机或一组主机提供输入，例如 Nmap。当你点击页面中心的“高级选项”（Advanced Options）按钮时，可以在
    Target Settings 中找到某些重要且有用的字段。


    排除目标 (Excluded Targets)

    你在该字段中指定的任何 IP 都将从扫描中排除。如果你不想扫描某些机器，可以在此字段输入你的系统和任何其他成员的 IP 地址。此外，rules of engagement
    可能会定义某些不应扫描的机器。


    执行初始端口 (Perform Initial Port)

    第一次对目标系统进行扫描时，勾选此框。当对目标系统重复扫描时，可以取消勾选，以免浪费时间。


    自定义 Nmap 参数 (Custom Nmap Arguments)

    当伦理黑客需要运行自定义模块时，可以使用此选项。可以在这里定义自定义开关。


    额外的 TCP 端口 (Additional TCP Ports)

    默认 Metasploit 扫描将针对最常见的端口。如果伦理黑客有关于端口的独特信息，可以在此处将其包含在扫描中。


    排除 TCP 端口 (Exclude TCP Ports)

    rules of engagement 可能会定义某些不应扫描的端口。这些可以在这里定义。


    自定义端口范围 (Custom Port Range)

    如果你有多个目标，可以在它们之间分配范围。


    自定义 TCP 源端口 (Custom TCP Source Port)

    有时你可能想要伪装你的系统源端口。这对绕过防火墙很有用。在开始扫描后，可能需要一些时间完成，Metasploit 非常高效，但后台运行着大量进程。


    扫描完成后，点击网页顶部的“概览”（Overview）标签。discovery 部分显示已扫描的主机。如果包含了自定义参数，可能会发现更多漏洞。使用 Nexpose
    进行合规性检查也是这样。如果你点击“分析”（Analysis）标签，将获得所有扫描主机的列表。如果你点击主机的 IP，将获得更多信息。有六个重要部分为你提供有关主机的信息：


    服务 (Services)

    服务部分的可用信息将告诉你目标系统上的软件及其版本。在扫描期间获取了有关它们的更多信息。某些服务可能有超链接。


    漏洞 (Vulnerabilities)

    目标系统中发现的所有漏洞都将列在这里。这里列出的漏洞已与 Metasploit 利用程序链接，以便进行直接利用。


    文件共享 (File Shares)

    如果目标系统上有文件共享，它们将列在这里。然而，Linux 系统上的文件共享不像 Windows 系统上那样公开显示。


    备注 (Notes)

    扫描期间发现的安全设置、服务帐户、共享将列在这里。


    凭据 (Credentials)

    如果扫描捕捉到了任何凭据，它们将列在这里。


    模块 (Modules)

    模块部分不仅与利用模块有关，它还让你直接启动与发现的漏洞相关的利用。如果你点击链接，利用程序将启动并尝试与目标系统建立会话。点击模块旁的启动（Launch）链接。扫描返回了
    `Exploit: Java RMI Insecure Configuration Java Execution`。你将看到一个描述漏洞性质的页面，并填充利用发现漏洞所需的所有信息。默认，Metasploit
    将使用通用载荷以及 Meterpreter shellcode。在检查设置后，点击“运行模块”（Run Module）。


    如果利用成功，你应该看到“成功！在主机上创建了一个会话”的消息。这表示你成功利用了目标系统的漏洞，它现在已被破坏。当目标系统被利用时，其上部署了一个 Meterpreter
    shell，你现在会在“会话”（Sessions）标签中看到 #1，用于与目标系统交互。点击“会话”（Session）查看所有活动会话。Sessions 网页将显示所有可用会话及其与目标系统交互的关联
    shell。有一个小描述列出了可以访问目标系统的帐户。点击“会话 1”（Session 1）链接，将启动与目标系统上 Meterpreter shell 的网页交互。


    ## Meterpreter Shell - 会话管理 (Meterpreter Shell - Session Management)

    在 Meterpreter shell 部署到目标系统后，伦理黑客可以通过 Meterpreter 中的会话管理访问 shell。然而，许多高级功能可以通过简单的按钮点击驱动，它们也有助于加速利用的管理。作为伦理黑客，你需要在时间和和执行之间找到完美的平衡。如果你执行了错误的步骤，目标系统可能会触发安全警报。如果你没有执行所需的操作，会话时间将会浪费。


    伦理黑客可以看到在目标系统上执行的所有可用操作，以及会话历史和利用后使用的模块标签页。你通过此会话执行的任何操作都会记录以供以后参考。你还可以导出这些日志，用于渗透测试生命周期最后阶段的报告。


    ## 会话内部的操作 (Actions Inside a Session)

    你将在会话内部执行以下操作：


    收集系统数据 (Collect System Data)

    这将从目标系统收集敏感和关键数据，如密码、截图和系统信息。此按钮等同于第一站式购物功能。你不需要在每个会话中获取 root 用户的信息。


    访问文件系统 (Access File System)

    此按钮让你访问目标系统的文件系统并上传或删除文件。如果目标系统是 Web 服务器，上传键盘记录器、木马和其他恶意工具将对你有帮助。


    命令 Shell (Command Shell)

    此选项适用于高级伦理黑客。它让你与目标系统的 shell 进行交互。如果没有 root 凭据，伦理黑客将在命令行中操作。


    创建代理跳转 (Create Proxy Pivot)

    使用目标系统作为网关进行跳转。如果目标系统是其他系统的代理，它可以访问所有其他系统。


    创建 VPN 跳跃 (Create VPN Pivot)

    你可以将目标系统转换为 VPN 网关并通过其引导流量。这与创建代理按钮非常相似，只是所有流量通过加密的 VPN 隧道。这有助于想要规避检测系统的伦理黑客。


    终止会话 (Terminate Session)

    此按钮将终止主机上的所有会话并从中删除 Meterpreter shell。如果伦理黑客在目标系统上留下恶意软件，目标系统仍然处于破解状态。因此，在终止会话之前删除所有此类软件是重要的。


