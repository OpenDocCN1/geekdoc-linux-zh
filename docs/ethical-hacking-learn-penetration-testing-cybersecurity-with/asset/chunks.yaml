    Theft of passwords and sensitive data, Theft or counterfeit of credentials |

    | Social Engineering | Phishing, Impersonation, Spear Phishing, Intelligence Gathering
    |


    When you understand not only the type of attack but the means through which that
    attack can be carried out, you will understand exploitation properly.


    ## Local Exploits

    An exploit that requires you to have local access to the computer system, server,
    mobile phone, etc. is called a local exploit. Local access to a system can also
    be established through a remote session. In other words, if the ethical hacker
    is physically sitting near the target system or is logged into it via `SSH`, a
    Remote Desktop Protocol (`RDP`) session, or a Virtual Private Network (`VPN`),
    the exploit can be called local. A local exploit can be used to increase your
    privilege on the system, disrupt service, upload malicious files, or steal information
    from the system. Do note that a local exploit cannot be implemented from a network
    unless you have established a session over the network like the ones we mentioned
    earlier. If you try to implement a local exploit on a system without executing
    the code on the local system that is vulnerable will cause the code to fail. This
    may even set off a few alarms in the security systems of the target system, and
    when an alarm sets off, it is considered to be a waste of time and effort for
    an ethical hacker.


    There is a misunderstanding amongst the masses about how to leverage local exploits.
    It is not necessary that a local exploit has to be executed by the ethical hacker.
    An ethical hacker can employ social engineering and other deceptive methods to
    trick the locally logged in user to execute the local exploit on their behalf.
    A very common example of this is a Trojan backdoor embedded in a regular `PDF`
    document file or a Microsoft `Excel` spreadsheet. A `USB` drive delivered on an
    employee’s name that is then plugged into the corporate system can also be used
    to carry out a local exploit. The possibilities of a local exploit are only limited
    by the imagination of an ethical hacker or a penetration tester. Local exploits
    are mostly deployed when remote exploits fail due to an unavailability of a network
    connection to the target system.


    ### Searching for Local Exploits

    There are more than a thousand ways to exploit a system locally, and choosing
    the most efficient one can seem a little difficult in the beginning. The Metasploit
    tool by `Rapid7` has made this simple by developing an application called `Searchsploit`.
    `Kali Linux` makes using this application even simpler. You can use `searchsploit`
    in the `Kali Linux` terminal to look for exploits in a system.


    The steps are as follows:

    - Launch a terminal window.

    - Type the `searchsploit` command, followed by up to three keywords.


    The search returns the vulnerability with a dynamic link library in a `Windows`
    system running the `IIS` web server and using the `PHP 5.2.0` version. You can
    exploit this vulnerability to execute a buffer overflow causing a denial of service
    on the host system.


    ## Remote Exploits

    An exploit that targets a computer system, server, mobile phone, etc. from outside
    the base operating system of the respective device is called a local exploit.
    It is also known as a network exploit since it is always carried out over a network.
    In simple words, when an exploit is not local, it is always a remote exploit.
    Remote exploits are used to target computer systems, servers, or network devices
    and also web applications, web services, databases, mobile phones, printers, and
    any other device that can connect to a network. The number of devices that can
    be targeted using a remote exploit is increasing with the advancement in technology.
    For instance, gaming consoles such as the `Microsoft Xbox`, The `Sony Playstation`,
    smart TVs, music systems, and the list just goes on.


    Another example is the use of computer systems in the latest cars. If there is
    a computer system in a car that is connected to a public network, some attacker
    in the world is already trying to hack it, mostly to create some nuisance. We
    will have a detailed example of remote exploits further in this chapter when we
    learn about the `Metasploit` tool.


    ## Metasploit Overview

    Metasploit is one of the most powerful tools in the toolkit of an ethical hacker.
    It has harnessed power from multiple years of trials by ethical hackers, penetration
    testers, governments, and researchers from all over the world. From the `Black
    Hat` side of the spectrum to the `White Hat` side of it and everything in between,
    every hacker has at one point laid their hands on the `Metasploit` framework.
    The `Metasploit` tool was developed by a company called `Rapid7`. The company
    spared no expense when they developed this cool, which makes Metasploit capable
    of executing all the stages required for a successful penetration testing activity.
    Over and above the attack stages, Metasploit also has report templates and compliance
    checks to meet government requirements. You will be amazed while using Metasploit
    if this is your first time.


    ### Versions of Metasploit

    There are currently two versions available for Metasploit. The first version is
    called the `express framework` that is installed by default and is free to use.
    This version is mostly focused on catering to the needs of students, researchers,
    and private users. The second version is called the `professional version` that
    meets the needs of those in the professional and commercial sectors, and government
    sectors. The professional version offers additional features such as group collaboration,
    reporting, compliance checks, and other tools for advanced control. There is a
    cost associated with the professional version, and therefore, if you use Metasploit
    just for personal use, there is no need to purchase the professional version.
    Both the express version and the professional version contain the same exploit
    modules.


    ### Nexpose and Compliance

    Security auditors know the requirements of compliance in and out. `Nexpose` facilitates
    auditors to simplify the risk management associated with the security of a company.
    `Nexpose` has more features than just scanning for vulnerabilities in Metasploit.
    After scanning for vulnerabilities, `Nexpose` classifies them for analysis of
    the impact they may have and then converts them into a neat report. In addition
    to vulnerability scanning, `Nexpose` ensures regulatory compliances such as `Payment
    Card Industry Data Security Standard (PCI DSS)`, the `North American Electrical
    Reliability Corporation Standards (NERC)`, the `Health Insurance Portability and
    Accountability Act (HIPPA)`, the `United States Government Configuration Baseline
    (USGCB)`, the `Federal Information Security Management Act of 2002 (FISMA)`, the
    `Security Content Automation Protocol (SCAP)`, the `Federal Desktop Core Configuration
    (FDCC)`, and many more.


    ## The Basic Metasploit Framework

    Metasploit works on modules. You will be able to picture the framework better
    if you visualize it to be a vehicle. Consider the framework to be the chassis
    of an `Aston Martin` owned by `James Bond`. The chassis provides a container for
    all the other modules that are used by the car. The nooks and corners around the
    engine are stocked with an arsenal of tools. Even if one of the modules in the
    car malfunctions, the car will still function with the available tools unleashing
    the attacks. There are five types of modules in Metasploit:


    1. `Exploit Modules`

    2. `Auxiliary Modules`

    3. `Payloads`

    4. `Listeners`

    5. `Shellcode`

