    know of the various attack surfaces and where on those surfaces, vulnerabilities
    were discovered. For example, an ethical hacker conducted a test from a remote
    location on a web application via the Internet, or a wireless attack was conducted
    by getting inside the range of an organization’s wireless network.Target ArchitectureThis
    section is optional and includes information about the target’s infrastructure,
    such as their hardware, operating systems used, services offered by the systems,
    open ports, etc. If there were network maps developed by the ethical hacking team
    during the penetration test, this section is a good place to put it.FindingsAll
    the vulnerabilities discovered during the penetration test are listed down in
    this section. It is important to categorize these depending on the systems where
    they were identified so that the respective teams have the information required
    to correct the flaws. If it is possible, the security issues should be associated
    with regulatory compliance, as that will help to trace the costs to a source of
    funding. This section will also give the system owners an estimate of the costs
