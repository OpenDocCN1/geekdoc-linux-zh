    `IDE` 的所有功能。这种协作技术允许你以高度集成的方式在不同平台之间工作。此外，`Atom IDE` 是一个非常实用的工具。除了它的优缺点，对于学者来说，它是最好的科学工具。它是处理高级编程语言的工具之一。


    #### 特殊特性

    *   拥有 `Markdown Plus` 模块

    *   显示运行结果


    ### Wing IDE

    首先，`Wing IDE` 是免费开源的。它包含了一些亮点，可以进行实现、调查和缩进。它还有一个付费版本，称为 `Wing Pro`。使用 `Wing Pro`
    的好处是它为你的代码提供了调试、亮点等许多功能。


    #### 特殊特性

    *   结合单元测试的远程调试

    *   它是自定义的，并且拥有扩展


    ### Jupyter Notebook IDE

    `Jupyter IDE` 是一个为客户端服务器架构开发的 `IDE`。对于你的 Python 程序，它允许你创建并控制记本文报告。2014 年 10 月，`jupyter
    notebook` 针对 `IPython` 发布。它是一个基于客户端服务器架构的 Web 应用程序，并允许你在记事本上创建和控制。然而`Jupyter Notebook`
    证明它是每个 Python 数据研究人员工具箱的基本部分。它对于原型开发非常出色，也用于记事本的可表示形式。


    #### 特殊特性

    *   你的代码可以在 `IDE` 中生成并轻松修改

    *   `jupyter notebooks` 提供了 markdown 支持

    *   该 `IDE` 是数据科学初学者的理想选择


