    \ used therefore loop gets broken\n```\n\n## While loop\nIn general, a while loop\
    \ is responsible for enabling a section of the code is to be executed as long\
    \ as the known condition is true. It is usually used in the case where the iteration's\
    \ quantity is not known in advance. While loop's syntax is as follows.\n\n```python\n\
    while expression:\n    (statements)\n```\n`expression` must be any valid Python\
    \ expression concluding into true or false. The `True` is any non-zero value,\
    \ in this case.\n\nExample – 1:\n```python\nv=1\nwhile v<=11:\n    print(v);\n\
    \    v=v+1;\n```\n\nOutput:\nIn this condition, your console will print a list\
    \ of all integers, till 11.\n1234567891011\n```\n\n## Infinite While Loop in Python\n\
    If the condition provided in the while loop doesn't become false, the while loop\
    \ will never end, and the result will be an infinite while loop. To have a `True`\
    \ Condition, we use a non-zero value in while loop, and zero value to indicate\
    \ the `False` Condition.\n\nExample:\n```python\nvariable = 1\nwhile variable\
    \ != 2:\n    v = int(input(\"Enter your desired number :\"))\n    print (\"Entered\
