- fmt: "\n## 2.3 Applications of Python\n\n`Python` is an open-source and a commonly\
    \ used programming language for computers considered to be most useful, distinguishing\
    \ it from other programming languages. In several ways, `Python` as a language\
    \ can be used in any computer programming discipline.\n\n### Web Application Development\n\
    To build many kinds of web applications, you can use `Python`. To develop and\
    \ manage websites and web applications, `Python` provides you with several libraries.\
    \ `Email Handling`, `lovely soup`, `demand`, `JSON`, `XML`, `HTML`, and many others,\
    \ for example. Besides, `Python` provides you with many built-in frameworks to\
    \ manage and build software and web applications, such as `Pyramid`, `Flask`,\
    \ `Django` (we spoke about this in chapter – 1), and many more.\n\n### Desktop\
    \ Graphical User Interface Applications\nTo build a user interface for `Python`-based\
    \ programs, `Python` provides you with several graphical user interface libraries.\
    \ `Kivy` and `wxWidgets` are some of the tools and applications in this respect.\
    \ In several developmental stages, you can use these resources. Keep in mind that\
    \ `Kivy` is commonly used to create multi-touch applications.\n\n### Software\
    \ Development\nTo advance computer programming procedures, you can use `Python`.\
    \ `Python` serves as a supporting language and can be used for software testing,\
    \ control fabrication, and board testing.\n\n### Scientific and Numeric Usage\n\
    `Python` is a mainstream language that is widely used to describe logical, numerical\
    \ issues. You could find many `Python` bundles and `Python` libraries useful in\
    \ this regard, such as `IPython`, `Pandas`, `SciPy`, etc.\n\n### Business Applications\
    \ Usage\nFor the development and maintenance of any business software or application,\
    \ many developers use `Python`. Moreover, `Python` is used by many developers\
    \ to maintain their e-commerce websites.\n\n### Console Based Application\nConsole-based\
    \ applications can be built using `Python`. You can, for example, use `IPython`\
    \ to build various support-based applications.\n\n### Audio or Video-based Application\
    \ Programming\n`Python` is a fantastic language for doing several tasks based\
    \ on video or audio. To build various kinds of media applications, many developers\
    \ use `Python`. You can use a `Python` function, known as `cplay`, for this.\n\
    \n### 3D based Computer-Aided Drafting Applications\nTo build and develop 3D based\
    \ computer-aided drafting applications, many `Python` developers use `Python`.\
    \ `Fandango` is a beneficial `Python`-based framework for creating specific applications\
    \ that allow you to view full `CAD` highlights.\n\n### Enterprise Applications\n\
    `Python` is used by many `Python` developers to build many applications that can\
    \ be used within a company or in an enterprise. `Tryton` and `Picalo` are the\
    \ most well-known applications in this regard.\n\n## 2.4 Installing Python\n\n\
    You can visit the mentioned website in order to download and install `Python`\
    \ on your Windows. `https://www.python.org`\n\n### Installation on Windows\nThis\
    \ will allow you to download the new `Python`-released update. If you're using\
    \ this process, the website mentioned above will redirect you to a new window\
    \ where you may find a list of several `Python` versions, as described earlier.\
    \ You can download the new `Python` version from there, i.e., `Python 3.8.1`.\
    \ Now, everything you have to do is to download and install the latest `Python`\
    \ update and save it. Double click on the executable file after downloading and\
    \ saving it. A new window will open after this. Only click on the \"Customize\
    \ Configuration\" button and let your device install it automatically.\n\nA new\
    \ window will pop up after that, displaying all the optional `Python` features.\
    \ All the optional features need to be enabled, and you have to pick or check\
    \ them all. Click on the Next button after this to begin the process. \n\nWith\
    \ the advanced options for downloading `Python`, a new window will pop open. You\
    \ only need to check the \"pick everything\" button for a better installation,\
    \ and then you have to press the \"Next\" button.\n\nAfter you press the 'Next'\
    \ button, `Python 3.8.1` will download the program on your computer.\n\nYou have\
    \ to run `Python` on the `CMD` of your framework after installation, aka. Command\
    \ Prompt. Only write the following command in your command prompt to check if\
    \ `Python` is installed correctly.\n\n```\n>>> python\n```\n\nYour command prompt\
    \ can display an error when you press enter. This generally occurs because the\
    \ Python route has not been set correctly.\n\nNow, you just have to go to your\
    \ desktop to set the `Python` path correctly, right-click on \"My PC\" and go\
    \ to \"Properties.\" After choosing properties, go to \"Advanced\" and then proceed\
    \ to \"World Variables.\" You can see that in the user variable portion, a new\
    \ path will be added. You can set the `Python` path in your \"World Variables\"\
    \ as the variable name and the `Python` installation directory. You can now execute\
    \ `Python` on your local station when the `Python` path is set.\n\nNow, just reset\
    \ the prompt for your order and retype the following command.\n\n```\n>>> python\n\
    ```\n\nEventually! The `Python` interpreter opens where the `Python` commands\
    \ and statements will begin to be written and executed.\n\n### Installation on\
    \ MAC\n`Python 2.7` is built-in by Apple itself for Mac OS X 10.8. You can download\
    \ this by visiting the website if you want to install the `Python` version. `https://www.python.org`\n\
    \nYou can get the new `Python` update and many of its components from this website.\
    \ For this, the `Python` package must be downloaded from the website concerned.\n\
    \nAfter installing the kit, a folder with the name \"Python 3.8.1\" will be downloaded\
    \ to your \"Application Folder.\" You will find the `Python` development environment\
    \ here, i.e., `IDLE`. A module, known as the `Python Module`, can also be downloaded\
    \ from your device. This framework typically has various `Python` programming\
    \ libraries and several other executable files.\n\n## Chapter 3: Compilers, Text\
    \ Editors, and IDEs\n\nThe `Python` compilers, `IDEs`, and Text Editors play a\
    \ vital role in `Python` programming. Like other programming languages, there\
    \ are many applications, compilers, and text editors we can use to compile `Python`'s\
    \ syntax in a very simplified manner. We'll be studying compilers, text editors,\
    \ and `IDEs` in this chapter.\n\n### 3.1 Compilers for Python\nIf you have a programming\
    \ background, you need to know that a compiler is an application for a code translator\
    \ or a simple software that converts your written code to machine language.\n"
