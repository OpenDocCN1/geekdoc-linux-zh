    file and directory within the foss1 directory.>>> [roots @ fosslinux ~] # mkdir
    foss1 / test_dir>>> [roots @ fosslinux ~] # touch foss1 / test_fileThis is an
    example, but the directory tree you are trying to delete may contain hundreds
    or thousands of files or folders.If we need to delete them all, without having
    to spend all day verifying them, we use the -f, as a function, parameter.>>> [roots
    @ fosslinux ~] # rm -rf foss1 /When you delete a guide, you may or may not have
    a slash (''/'') at the end of the cursor name. I suggest you do not use slash.If
    you type the command correctly and place extra space between foss1 and ''/'',
    you will delete both foss1 AND ''/'', the root directory, and destroy your entire
    Linux file system without the ability to restore it (most of the time).This is
    the law of death. So, be careful! You have been warned. With great power comes
    a great burden, as they say.•        Moving DirectoriesSometimes, we need complete
    directions that have been transferred to another index. >>> foss8 directory to
    / tmp / directory, we can do so with:>>> [roots @ fosslinux ~] # mv foss8 / tmp
    /There should be enough movement; we do not need to specify foss8 and after /
    tmp /.-r or the same argument, it automatically moves the entire guide tree.But
    there is still one option like rm, and that -f.We have a foss8 guide in our tmp
    / directory, let''s see what happens when we rebuild and try to move this to /
    tmp / again.>>> [roots @ fosslinux ~] # mkdir foss8>>> [roots @ fosslinux ~] #
    mv foss8 / tmp />>>mv: write over `/ tmp / foss8 ''?Turn ''n'' or press CTRL +
    C to escape the command.You see, it requires us to write down an existing directory,
    even if both are empty. To avoid this, use the -f option to write over.>>> [roots
    @ fosslinux ~] # mv -f foss8 / tmp /•        Renaming DirectoriesYou already know
    that there is no separate command to rename files on Linux. Since the directions
    on Linux are only a special file type, the same principle applies to the directions.
    The renaming is done with the mv command, followed by the source direction and
    destination name. Therefore, if we need to rename the directory foss10 to foss101,
    we will issue the following command:>>> [roots @ fosslinux ~] # mv foss10 foss101•
           Cleansing the MessNow, to clean up everything we have created in one command,
    use * to specify multiple references starting with foss, as well as others in
    the / tmp / directory.>>> [roots @ fosslinux ~] # rm -rf foss * / tmp / foss *Chapter
    5: Digging Deeper into the Linux5.1 Linux ShellThe shell is a command interpreter
    in an operating system like Unix or GNU / Linux, a program that uses other programs.
    It provides a computer user interface to the Unix / GNU Linux system so that the
    user can use different commands or resources/tools with specific installation
    details.When the shell has finished making the program, it sends the output to
    the user on the screen, which is a standard output device. For this reason, he
    is referred to as the "interpreter of the command."The shell is more than just
    interpreting a command, and that language of its system has a complete language
    structure such as conditional performance, constraints, flexibility, tasks, and
    much more.That is why the Unix / GNU Linux shell is more powerful than the Windows
    shell.Now, we may take a look at some of the most widely used open-source shells
    in Unix / GNU Linux.Bash ShellBash represents Bourne Again Shell and is the default
    shell in most Linux distributions today. It also has a sh-associated shell and
    provides more efficient development over sh of the system and use that includes:•       
    Editing the command line•        Performance Management•        Unlimited size
    command history•        Shell Services & Nicknames•        Unlimited size Approximate
    layout•          Integer arithmetic on any basis from two to sixty-fourTcsh /
    Csh shellTcsh developed with C-shell, can be used as a compatible login shell
    and Shell script command processor.Tcsh has the following features:•        C
    as syntax•        Command line editor•        Word and word file completion•       
    Spelling correction•          Performance managementThe Shell of ZshZsh is designed
    to work with and integrates many features of other Unix / GNU Linux shells, such
    as bash, tcsh, and ksh.And a strong writing language like other shells available.
    Although it has some unique features that include:•        File name generation•       
    Getting started files•        Login / login•        Concluding ideas•        Conceptual
    guide•          Flexible indexThe FishThe fish is in full swing "friendly interactive
    shell" and was recorded in 2005\. It was designed to be fully functional and easy
    to use, like other shells, with excellent features including:•        Completion
    of personal page•        Web-based configuration•        Automatic suggestions•       
    Can be written entirely in clean scripts•          Term256 technology terminal
    support5.2 Procedures and Operations ManagementLike any multitasking application,
    Linux performs multiple, simultaneous processes. Yes, they appear at the same
    time, however. In fact, a single processor core can perform one process at a time,
    but the Linux kernel is able to give each process its own chance on the processor,
    and each one seems to run at the very similar time.We may say that there are many
    commands that are used to control processes. Of course:>>>kill -  sends the signals
    to one or more processes (usually "kill" process)>>>ps -  list the processes that
    run in the system>>>fg -  place the process in a private place>>>bg -  put the
    process behind>>>tasks -  another way to list your processesA Practical ExampleWhile
    this may seem like this title is vague, it can be very useful for the average
    user who works hard with a graphical display. Although it may not be possible,
    most (if not all) graphics programs can be set up in the command line. Here is
    an example: there is a small program provided by the X Window program called xload
    that displays a graph representing system loading. We can appreciate this program
    by typing the following:>>> [me @ linuxbox me] $ xloadNote that a small xload
    window appears and starts showing the system loading graph. For applications where
    xload is not available, try gedit instead. Also, note that our information did
    not appear after the program was launched. The shell is waiting for the system
    to complete before returning to control. When we close the xload window, the xload
    system ends and a quick recovery.Putting the System in the Background of SomethingIn
    order to make processess and your life a little easier, we will re-launch the
    xload program, but this time we will put it in the background for the prompt to
    return. To do this, we make an xload as follows:>>> [me @ linuxbox me] $ xload
    &>>> [1] 1223>>> [me @ linuxbox me] $In this case, the information is back because
    the process was left behind.Now imagine that we forgot to use the "&" icon to
    put the program in the background. There is still hope. We can type Ctrl-z, and
    the process will be stopped. We can confirm this process by seeing that the program
    window has been frozen. The process is still there, but it doesn''t work. To start
    the process in the background, type the bg command (short for domain). Here is
    an example:>>> [me @ linuxbox me] $ xload>>> [2] + Paused xload>>> [me @ linuxbox
    me] $ bg>>> [2] + xload &Process ListsNow that we have the process in the background,
    it may help to show a list of the processes we have started. To do this, we can
    use either a function command or a more powerful ps command.>>> [me @ linuxbox
    me] $ jobs>>> [1] + Launch xload &>>> [me @ linuxbox me] $ ps>>>PID TTY TIME CMD>>>1211
    pts / 4 00:00:00 bash>>>1246 pts / 4 00:00:00 xload>>>1247 pts / 4 00:00:00 ps>>>
    [me @ linuxbox me] $Killing ProcessSuppose we have an unresponsive plan; how do
    we remove it? We use the murder order, of course. Let''s try this on xload. First,
    we need to identify the process we want to kill. We can use either functions or
    ps to do this. If we use jobs we will get the job number back. With ps, we are
    given a process id (PID). We will do it both ways:>>> [me @ linuxbox me] $ xload
    &>>> [1] 1292>>> [me @ linuxbox me] $ jobs>>> [1] + Launch xload &>>> [me @ linuxbox
    me] $ kill% 1>>> [me @ linuxbox me] $ xload &>>> [2] 1293>>> [1] xload terminated>>>
    [me @ linuxbox me] $ ps>>> PID TTY TIME CMD>>>> 1280 pts / 5 00:00:00 bash>>>
    1293 pts / 5 00:00:00 xload>>> 1294 pts / 5 00:00:00 ps>>> [me @ linuxbox me]
    $ kill 1293>>> [2] + Xload disconnected>>> [me @ linuxbox me] $5.3 User Change
    and Activation Instructions like AlternativeThe su (short for substitute or switch
    user) utility allows you to use commands with another user''s rights, automatically
    the root user.Using the su is an easy way to switch to an administrative account
    for the current login session. This is especially helpful when the root user is
    not allowed to enter the system using ssh or using the GUI display manager.How
    to use su Command $suThe standard syntax for the following command is as follows:$
    su [OPTIONS] [USER [CONFLICT ...]]CopyWhen requested without option, the default
    character of the strategy is to use the interactive shell as root:$ suYou will
    be notified that you entered the root password, and once confirmed the user who
    temporarily uses the command becomes root.Session shell (SHELL) and local flexibility
    (HOME) are set to user login / etc / passwd, and the current directory has not
    changed.To verify that the user has changed, use the whoami command:who I amThe
    command will print the name of the user conducting the current Shell session:rootThe
    most commonly used option when requesting a su is -, -l, --login. This makes the
    shell an entry shell that has a very similar location to the real entry and changes
    the current direction:su -If you want to use another shell instead of what is
    specified in the passwd file, use the -s, -shell option. For example, switch to
    root and use zsh Shell you can write:su -s / usr / bin / zshTo save the entire
    environment (HOME, SHELL, USER, and LOGNAME) for an expensive user use the option
    -p, --preserve-environment.su -pWhen the option - applied -p is ignored.If you
    want to use the command as a substitute user without starting a collaboration
    shell, use the option -c, --command. For example, requesting a ps command as root
    you can type:su -c psCopyTo switch to another user account, transfer the username
    as an argument to him. For example, switching to a user profile that you can type:su
    dictatorshipSududo vs SuIn some Linux distributions such as Ubuntu, the root user
    account is automatically disabled for security reasons. This means that no password
    is set to root and you cannot use the root switch.One option that you can change
    to root would be to configure the Sudo command and enter the user''s current login
    password:Sudo su -CopySudo command allows you to use programs as another user,
    automatically the root user.If the user is given a sudo test, the su command will
    be prompted as root. Running sudo su - and using a user password is the same as
    running a su - using a root password.When used with the option -i, Sudo uses a
    login that is compatible with the root user environment:Sudo -iCopySudo -i is
    basically the same as working su -The advantage of using Sudo over su is that
    the root password does not need to be shared between multiple user accounts.ConclusionI
    hope this book teaches you to trust how to use Linux to download it on your computer
    to design your programs for it.I hope that this book also serves as a tool to
    pick the right Linux distribution to help you accomplish day-to-day programming
    tasks and suit your needs. After this book, you should have learned how to use
    the command line in Linux and managed to learn a few steps in keeping your machine
    secure.Although not as popular as Windows — at least to some people — Linux is
    probably one of the most stable operating systems — and the great thing about
    it is that it is free, so you don''t have to pay money to get it, so you don''t
    have to go for bogus operating systems only because you can''t pay for the legal
    copy.'
