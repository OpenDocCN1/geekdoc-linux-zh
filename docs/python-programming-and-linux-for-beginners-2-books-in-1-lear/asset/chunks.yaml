  trans: "\n\n# 8.2 Python 数据科学库\n\nPython 库每天都在变得更加易于使用和更加实用。作为一套开源语言，有数百万计数据科学家正在通过高级编码，利用工具和库来丰富\
    \ `Python`。现在，数据科学家已经在使用许多极其先进的包和库来完成多项数据分析任务。下面给出了一些最优秀的 Python 数据科学库的简要描述。\n\
    \n## Numpy \n\n`NumPy` 是一个非常重要的 Python 数据科学库，专门用于逻辑注册。它为极其强大的 N 维数组对象和广播机制提供了支持。此外，该库还提供了傅里变换、任意精度数值，以及用于协调\
    \ `C`、`C++` 和 `FORTRAN` 代码的设备。对于利用 `Python` 从事人工智能项目的全栈开发者来说，掌握 `NumPy` 的工作信息是必要的。\n\
    \n`Numpy` 是在 `Python` 中处理数据的根本且完美的组合，因为不同的数据调查程序包都是基于 `Numpy` 和 `sci-kit-learn`\
    \ 包构建的，后者被用于构建人工智能应用，并且与 `Numpy` 配合得非常完美。最初，`Numpy` 提供了卓越的对象数组——即 n 维集群。在 `'ndarray'`\
    \ 对象（又称为 `'exhibit'`）中，你可以存储各种相似类型信息的物品。数组对象周围的功能使得 `Numpy` 在执行数学计算和数据控制方面变得非常有优势。\n\
    \n### 特色：\n\n- `Numpy` 是一个非常有交互性的库，而且非常易用。\n- 在使用 `Numpy` 时，可以轻松地解决数学问题。\n\n##\
    \ Pandas\n\n在 `Python` 中，我们使用二维表格来像在 `SQL` 或 `Excel` 中那样的分析数据。最初，`Python` 并没有这个功能。但随后\
    \ `Pandas` 被引入了。毫无疑问，`Pandas` 是“Python 版的 SQL”。简而言之，`Pandas` 是一个可以帮助我们在 `Python`\
    \ 中处理二维数据表格的库。在许多情况下，它类似于 `SQL`。\n\n此外，`Pandas` 基于 `NumPy` 库，这意味着 `NumPy` 的大部分结构都被使用或复制以开发\
    \ `Pandas`。`pandas` 中的数据经常被用于加固 `SciPy` 中的事实检查、`Matplotlib` 的绘图能力以及 `Scikit-learn`\
    \ 中的机器学习计算。同时，`Jupyter Notebooks` 为利用 `pandas` 执行数据调查和演示提供了一个良好的环境，但 `pandas`\
    \ 也可以简单地用在内容工具中。\n\n`Jupyter Notebooks` 允许开发者在特定的单元格中执行代码，而不是运行整个记录。这在处理庞大的数据集和复杂更改时节省了大量时间。Scratchpad\
    \ 同样提供了一种简单的方法来可视化 `pandas'` 的 `DataFrames` 和图表。确实如此。\n\n`Pandas` 主要因在 `Python`\
    \ 中提供数据大纲而闻名。这是一个卓越的数据检查库，与像 `R` 等其他领域特定的语言相比。通过使用 `Pandas`，处理缺失信息变得更简单，支持处理从许多不同资源收集的具有不同字段的信息，并支持程序化的数据整理。此外，它提供了数据检查和数据结构的设备，如合并、塑形或切割数据集，它在处理与时间序列识别的数据方面也特别有效，因为它提供了强有力的工具从\
    \ `Excel`、平级文档和数据库中堆叠数据。\n\n使用 `Pandas` 库让程序员处理命名数据或社交数据变得更加简单和直观。它还提供了表达性、快速且可扩展的数据结构。`Pandas`\
    \ 的设计是为了填补在使用 Python 作为编程语言时进行数据检查所需的关键高层结构空白。\n\n`Pandas` 最强大的特征之一是利用极少量的指令来解释复杂的数据活动。此外，人工智能库在合并、分离和收集数据的技术方面也不乏工作。它还强调了时间序列的功能。\n\
    \n### 特色：\n\n- `Pandas` 能够通过极少几个指令来解释复杂的数据活动。\n- 此外，人工智能库在合并、分离和收集数据的技术方面也不乏工作。\n\
    - 它还突出了时间序列的功能。\n\n- 在使用 `Pandas` 时，可以非常容易地完成类型操作。\n- 使用 `Pandas`，数据操作变得更简单。\n\
    \n## Matplotlib\n\n`Matplotlib` 是一个 Python 的二维绘图库，具有强大的表示模块。除了用于 `Python` 终端、内容和\
    \ `IPython` 终端外，`Matplotlib` 还可以用于：\n\n- `Jupyter`\n- Web 服务器\n- GUI 工具箱\n\n正如\
    \ `Matplotlib` 官方网站所说，这个 `Python` 库试图“让简单的变得简单，让困难变得可能”。这个二维绘图库允许用更少的代码生成条形图、误差图、直方图、散点图等。\n\
    \n也许，表示最大的优势是它允许我们有效地访问海量数据。`Matplotlib` 包含了一些图表，如线图、条形图、直方图、散点图等。\n\n`Matplotlib`\
    \ 是 `Python` 中的一个数学绘图库。它是一个常用于数据表示的库，包括 3D 图、直方图、图像、散点图、条形图，并带有亮眼的缩放和搜索功能。它支持几乎所有的平台，例如\
    \ Windows、Mac 和 Linux。该库同样作为 `NumPy` 库的扩展。`Matplotlib` 有一个 `pyplot` 模块用于表示，这通常与\
    \ `MATLAB` 进行对比。\n\n这些库是业余爱好者利用 `Python` 语言开始数据科学的最佳选择。还有许多其他 Python 库可用，例如 `NLTK`\
    \ 用于标准语言准备、`Pattern` 用于网络挖掘、`Theano` 用于深度学习、`IPython`、`Scrapy` 用于网络抓取、`Mlpy`、`Stats\
    \ models` 等，仅此限。\n\n"
