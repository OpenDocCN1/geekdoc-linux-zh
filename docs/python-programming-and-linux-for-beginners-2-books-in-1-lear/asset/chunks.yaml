    \ and text editor. All three are written in the `PDP-11/20` conference language.\
    \ Bell Labs used this first \"text processing\" program, developed by Unix, `Roff`,\
    \ and the editor, in patent applications' text processing. `Roff` soon turned\
    \ into a `troff`, the first electronic publishing system with full editing capabilities.\n\
    \nIn 1972, Unix was rewritten in the `C` programming language, in contrast to\
