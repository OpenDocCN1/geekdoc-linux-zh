    # Chapter 2: Python''s Fundamental Attributes

    We have almost as many programming languages as we can count on our fingers, so
    far. There are so many programming languages, and each programming language of
    a computer has its unique characteristics. These are the characteristics of a
    language that makes it distinctive from others.


    In the end, a language may be transferred or picked for more extensive projects
    due to the characteristics of that language. So, in-depth, before starting the
    Python concepts, let us take a look at the functionality, uniqueness, and applications
    of Python, etc. You will learn the basic concepts, characteristics, applications,
    and architecture of Python in the following chapter, which makes it unique and
    strong compared to many other languages.


    ## 2.1 Unique Features of Python

    Let us start with some distinctive features of Python.


    ### Easy to Understand and Code

    We have to take it in a very different context when we are using the word "Simple"
    or "Easy" for Python programming. We''ve read earlier that the Python language
    is a high-level one. Mostly, with very few keywords and identifiers, you might
    find Python''s code the same as English. Any programmer or even a non-programmer
    can say what this code will do by looking at the code.


    Python, however, is dynamically typed, and this requires indentation. This function
    makes the code of Python more stable and straightforward to comprehend. Moreover,
    after writing our first program, we can tell that it''s effortless to code in
    Python. We may see that Python is more accessible to code compared to other programming
    languages. In a very few hours, someone with programming background will learn
    Python''s syntax. However, it will take some time to become a master of Python
    programming with its principles, modules, and packages. So, in other words, we
    might say that Python is a developer-friendly language.


    ### Open-Source and Free

    First of all, you would like to know that Python is free, and on many platforms,
    it is available. Its official website is the most credible source to download
    and install Python, i.e., `https://www.python.org/`.


    The second thing about this is that Python is a programming language that is Open-Source.
    Open-Source ensures the public can access the source code of Python at any time.
    Even a non-specialist can download, alter, use, and distribute Python. FLOSS is
    generally referred to as "Free Libre and Open Source Software" for this kind of
    software or language. All Python developers are working towards a common objective
    in the world of Python, i.e., the enhancement of Python and its functionality.
    Python has made the source code an Open-Source code for this.


    ### High-Level Language

    We have been discussing this argument from the beginning of our book that Python
    is a high-level computer programming language. You don''t need to think about
    or recall your computer or device''s design as a developer. Your code, written
    in Python, can be used globally, any program, machine, or system. You won''t care,
    either, about the system''s memory. This function makes it easier to write and
    code in Python. So, we could call Python a "Developer-Friendly Language," as described
    earlier.


    ### Portable Language

    For your Windows OS-oriented computer, let''s say you''ve built a Python program
    or app. Let''s presume you only want to run the program on a MAC OS-oriented computer.
    Now, you''re not going to need to make too many Python code improvisations. You''ll
    take your Python code from your Windows OS-oriented computer and run it on any
    MAC OS machine. So, if you''re using Python, you don''t have to code for different
    tools or operating systems differently. This Python feature makes our language,
    a supremely portable programming language, very important. You have to keep just
    a thing in mind in this regard, and you have to avoid any system-dependent function.


    ### Interpreted Language

    If you are already a C++ or Java developer or some other programming language
    or are familiar with programming languages, you need to realize that you must
    first compile your code. It would then be able to run or to carry out tasks. But,
    when you choose Python as your programming language, your code doesn''t need to
    be compiled initially. Python converts the source code within the device into
    an immediate-type, known as a byte-code.


    In other words, without worrying about connecting to the concerned libraries or
    any other big thing, you have to run your source code, written in Python. When
    your computer or unit reads your Python code, you can tell that the source code
    executes every line on a separate line, and not all of the code at once. This
    Python function makes it simpler to debug your Python code. On the other hand,
    it''s true that translating makes Python a bit slower than other languages, such
    as Java, but when compared to Python''s benefits, it doesn''t matter.


    ### Object-Oriented Paradigm enabled language

    We are also addressing this argument from the beginning that Python can re-shape
    the real world, and because of this, it is a programming language of the Object-Oriented
    Paradigm. It focuses on objects and puts the data and its functions together.
    Contrary to this, functions for any procedure-oriented language are codes that
    can be used repeatedly. Python is a language that supports both procedure-oriented
    programming and object-oriented paradigms, and this feature makes Python the most
    special programming language. Moreover, Python is a language that supports multiple
    inheritances in a single document, compared to Java.


    ### Extensible Language

    Let''s assume you''re a developer of some other language. You need to write Python
    code to also use commands from other languages, such as C++. This Python feature
    makes it a programming language that is very extensible, which means that it can
    be extended to include other languages in it.


    ### Embedded Language

    In the previous stage, we have addressed that code from other languages can also
    be accepted in our source code. You can also bring Python code into source code
    in some other languages, such as C++. This helps us incorporate into our code
    the scripting capabilities of other languages.


    ### Larger Standard Library

    With more comprehensive packages and libraries, you can download Python so that
    you don''t have to write the entire code for every single thing in your software.
    More comprehensive libraries are available for commonly used phrases, for identification
    of various generations, for the creation of websites and web browsers, for threading,
    for the development and maintenance of databases, and for image manipulation.


    ### Graphical User Interface Programming

    Unless you create a Graphical User Interface (GUI), any application or software
    may not be deemed user-friendly. Through your software''s graphical interface,
    any user developed software can easily interact with your software. To improve
    the graphical interface of your program, Python provides a range of libraries.
    Among these features, `wxPython`, `Tkinter` are the most popular. These toolkits
    are provided by Python, and they allow you to create or grow the interface easily
    and quickly.


    ### Dynamically Typed Language

    A programming language that is typed dynamically is Python. This means that only
    at runtime, your computer or system will determine the form for any value, not
    before that. In Python, therefore, when defining or declaring it, we do not need
    to specify the data type.


    ## 2.2 Versions of Python


    ### Phase – 1

    Python developed and announced its first version, i.e., `Python 1.0`, in the first
    phase of Python in January 1994. The functional programming tools such `reduce`,
    `filter`, and `map` were the key features that were implemented in this version.
    `Python 1.2` was the last update that was released when Mr. Vansum was still at
    CWI. This edition was published in 1995. In 1995, Mr. Vansum worked at the Company
    for National Initiatives on his own invented language, Python. He released several
    other versions there. Python gained several new and unknown features of its own
    with the release of `Python 1.4`. `Module-3` was the most common among these features.
    To inspire keyword-arguments, they also implemented a simple form of data hiding
    in `Python 1.4` through the use of name mangling. Computer Programming for All,
    which is called CP4E, was also introduced by Vansum. His goal was to make programming
    with the requisite know-how of many computer languages, available to laypeople.
    Python has played an essential role in this respect. The explanation was that
    there is a simple and straightforward syntax for Python. `Python 1.6` was the
    next Python version. They launched a new CNRI license in `Python 1.6`. With some
    bug fixes, `Python 1.6` released another version of itself.


    ### Phase – 2

    In Python''s second Phase, Python published its version of `Python 2.0.0`. In
    October 2000, it was released. Python implemented list comprehension in this edition.
    This was a functionality borrowed from other languages of practical computer programming.
    Python then implemented `Python 2.1`, which was similar to `Python 1.6.1` and
    was closely aligned with `Python 2.0.0`. In order to accommodate nested scopes,
    the introduction of `Python 2.1` implemented a fundamental change to allow it
    to compete with other statically scoped programming languages. Going on, `Python
    2.2` was the next version of Python. In 2001, `Python 2.2` was released. Python
    was able to implement a significant improvement in this version, unifying the
    categories of Python, i.e., separate classes in a single hierarchy. This transition
    was the fundamental reason why Python became the programming language of the object-oriented
    Paradigm. `Python 2.5` was the next Python version. In September 2006, Python
    released this version. Statements that we''re able to enclose any code block with
    a context manager were the required improvement in this version. `Python 2.6.1`
    and `Python 2.7.0` were the next versions released by Python during Phase-2. `Python
    2.6` was created to support `Python 3.0`, and with the introduction of `Python
    3.0`, there were some bugs, alerts, and syntax errors that were debugged. `Python
    2.7` was, on the other hand, released to support `Python 3.1`.


    ### Phase – 3

    Python released `Python 3.0.0` In Phase – 3 of Python development. Often known
    as `Py3K` or `Python 3000`, `Python 3.0` is in 2008, `Python 3000` was released.
    Besides, to overcome Python''s flaws, `Py3K` was developed. `Python 3.0` is called
    a language with a multi-paradigm. However, developers can still use it as a standardized,
    functional, and object-oriented paradigm programming language as opposed to other
    programming languages. So we can assume that Python is constantly being modified
    with newer versions, supports, and components after reading this. If you need
    to learn some more details about the Python versions and their release dates,
    you could find this table helpful.

