    \n[content]\n## 4.4 基础 Linux 命令\n\n在我看来，你会熟悉 Windows 和 Mac OS X 等许多操作系统。Linux\
    \ 是当今正在使用的最强大的操作系统之一。根据超级计算机 TOP500 购买者的最新数据，“Linux 如今占据了全球前 500 台超级计算机的 100%”。这难道不让你感到困扰吗？\n\
    \n操作系统是计算机和所有现代计算设备的灵魂和大脑。它是处理与你的桌面或笔记本电脑相关的所有硬件资源的软件。换句话说，操作系统控制着你的 `Software`\
    \ 与硬件之间的连接。\n\nLinux 是如此无处不在的，它出现在手机、汽车、冰箱和 Roku 设备上。它使用了互联网的大部分和大多数计算机。事实上，多个国家的股票交易所运行在\
    \ Linux 上。Linux 作为可用最可靠、最安全且强大的应用程序之一，已成为全球范围内部署桌面、服务器和嵌入式应用的平台。\n\n### 基础 Linux\
    \ 指令\n\n现在，让我们来看 Linux 上最重要的 20 个命令。Linux 命令非常敏感，所以你需要对你说的话小心。\n\n* `ls` – 如果你认识\
    \ Windows，就会知道 `dir` 用于过滤索引内容。某些类型支持颜色编码。蓝色的字代表引用的名称。\n* `ls -l | more` – 这有助于分离结果，以便你可以逐页查看。否则，列表会滚动得非常快。你可以随时使用\
    \ `ctrl+c` 返回命令行。\n```\n$ ls -l file name\n```\n* `cd /var/log` – 改变当前目录。Linux\
    \ 上使用高级斜杠。例如，一个附有各种 Linux 版本的 Linux 指南。如果你使用 `ls -l`，你将能够看到索引中内容的许多细节：\n    *\
    \ 文件\n    * 文件关联权限\n    * 文件所有者\n    * 与文件关联的组\n    * 文件大小\n    * 时间戳\n    * 文件名\n\
    ```\n$ cd /var/log\n```\n* `grep` – 在文件中查找文本。`grep` 命令同时搜索多个文件以找到你想要的文本段。\n```\n\
    `grep PATTERN [FILE]`\n```\ngrep failed transaction.log\n```\n上面的命令将找到文件中所有类似于单词“failed”的词。\n\
    ```\n$ grep 'failed' transaction.log\n```\n* `su` / Sudo 顺序 – Linux 系统中某些命令需要更高的操作权限。因此，你可以以系统管理员身份执行普通用户无法执行的操作。\n\
    * `sudo` – 如果你只需要以超级用户身份使用某些东西，可以使用 `sudo` 命令。这将允许你将命令应用到建议的权限。\n\n## 4.5 创建和删除目录\n\
    \nLinux 文件系统是一个高层树结构，根目录为 `/`。所有其他目录都是该目录下的子目录。大多数 Linux 发行版遵循文件系统层次结构标准（FHS），该标准开发于\
    \ 1994 年，防止防止目录结构之间的混乱。在 Microsoft Windows 中，我们有 `C:`、`D:` 等磁盘，它们上方没有目录。在 Linux\
    \ 上，尽管有不同的驱动器，我们只有一个根目录。\n\n### 创建目录\n\n导航当前目录最简单的方法是使用 `mkdir` 命令：\n```\n[root@linux\
    \ ~] #mkdir test\n```\n你就在当前目录下创建了一个名为 `test` 的文件夹。我们也可以使用完整路径指定目录，例如在 `/tmp`\
    \ 目录下创建一个 `test1` 目录：\n```\n[root@linux ~] #mkdir /tmp/test1\n```\n如果需要用同一个命令创建多个目录，可以这样做：下一个命令将同时创建\
    \ `test2` 和 `test3` 目录：\n```\n[root@linux ~] #mkdir test2 test3\n```\n还有一个小技巧叫做括号扩展，它可以帮助你根据模式构建更多目录。以下命令将创建\
    \ `test4`、`test5`、`testa` 和 `testb`：\n```\n[root@linux ~] #mkdir test {4,5,a,b}\n\
    ```\n你甚至可以指定括号的范围，如下命令所示，创建 `test6` 到 `test10` 的引用：\n```\n[root@linux ~] #mkdir\
    \ test {6..10}\n```\n\n### 删除目录\n\n`rm` 命令用于删除文件或目录。如果目录不是空的，则无法删除：\n```\n[root@linux\
    \ ~] #rm test\n```\n`rm -r` 命令删除目录及其所有内容：\n```\n[root@linux ~] #rm -r test\n```\n\
    \n## 第 5 章：深入研究 Linux\n\n### 5.1 Linux Shell\n\nShell 是 Unix 或 GNU/Linux 等操作系统中的命令解释器，是一个使用其他程序的程序。它为\
    \ GNU/Linux 系统提供了计算机用户界面，使用户可以使用不同的命令或资源/工具。当 Shell 完成程序运行后，它将输出发送到用户的屏幕，这是一个标准的输出设备。由于这个原因，它被称为“命令解释器”。Shell\
    \ 不仅仅是解释命令，它的系统语言具有完整的语言结构，如条件执行、约束、灵活性、任务等。这就是为什么 GNU/Linux Shell 比 Windows Shell\
    \ 更强大。\n"
