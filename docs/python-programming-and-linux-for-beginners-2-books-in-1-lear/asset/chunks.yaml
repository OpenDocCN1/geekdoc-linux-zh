    \n>>> print(len(string))\n```\n\n## `list()` 函数\n\n`list()` 函数用于创建一个列表。\n\n示例：\n\
    ```python\n>>> l = list((1, 2, 3))\n>>> print(l)\n```\n\n## `locals()` 函数\n\n\
    `locals()` 函数返回当前的本地符号表。\n\n示例：\n```python\ndef func():\n    local_var = 5\n \
