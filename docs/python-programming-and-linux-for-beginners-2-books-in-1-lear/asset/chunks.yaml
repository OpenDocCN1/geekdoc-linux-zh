    `Scrapy` 也是一个免费开源的 Python 框架，广泛用于网络和各种任务，包括自动化测试和信息挖掘。最初，`Scrapy` 是为了网络抓取而开发的，但在发展过程中它已更新以满足不同的目的。该库还为爬取网站和从网站分离结构化信息提供了一种快速且异常的状态策略。此库用
    `Python` 编写。`Scrapy` 围绕本质上独立的爬虫的错误和漏洞工作，这些爬虫提供了许多指南。遵循 `DRY` 标准，`Scrapy` 使得构建和扩展可靠的网络爬虫任务变得简单。


    ## 特殊功能

    * `Scrapy` 容易编写虫来爬取网站并集中信息。

    * 它遵循 `DRY` 规则。

    * 这个 `Python` 库提供了一个网络爬虫外壳，允许工程师测试网站的行为。

    * 此库支持使用命令行发送已抓取的信息。


    # Tkinter

    当我们使用 `Tkinter` 工作时，`Python` 为 GUI 应用程序的开发提供了一条简单快速的路径。该库被认为是 `Python` 编程的标准 GUI
    库。它为 `Tk GUI` 工具箱提供了一个奇妙的对象界面。我们应该记住，使用 `Tkinter` 开发 GUI 应用程序是简单的。你只需要遵循这些基本进阶：


    ## 特殊功能

    * 此库带有一系列工具，有助于几何执行者的策略。

    * 它在创建 GUI 应用程序时提供了便利。

    * `Tkinter` 支持强大的对象定位界面。


    # Six

    我们必须承认 `six` 是 Python 库中最简单的。它是一个奇的 `Python` 库，旨在平滑 `Python 2` 和 `Python 3` 版本之间的差异。`Six`
    的开发是为了支持可以在无需调整的情况下同时在 `Python 2` 和 `Python 3` 上运行的代码库。`Six` 库被认为极其简单，因为它作为一个单一的
    `Python` 文档提供。因此，将库复制到 `Python` 项目中是极其简单的。`Six` 的名字反映了 `Python 2` x `Python 3`。


    ## 特殊功能

    * `Six` 易于利用这些功能使 Python 代码在 `Python 2` 和 `Python 3` 中都完美。

    * 此库支持每个版本的 Python，从 `Python 2.6` 开始。

    * 使用包含在单一 `Python` 文档中的 `Six` 非常容易。


    # Pygame

    `Pygame` 是一个开源免费的 `Python` 库，旨在在 Python 中实现基于视频和声音的应用程序开发。特别是它支持二维游戏项目。因此，它被新手和资深
    Python 游戏开发者广泛。在 `Python` 编译器或 IDE 中，`Pygame` 使用 `SDL`，即 `Simple DirectMedia Layer`
    库。像 `SDL` 库一样，`Pygame` 库非常方便并并许多阶段和操作系统提供帮助。`Pygame` 可以在基于 Android 的设备（手机和平板）上引导使用
    `Pygame` 创建的应用。出于许多原因，你应该更倾向于 `pg4a`，它是 Android 的 `Pygame` 子集。


    ## 特殊功能

    * 此库不要求 `OpenGL`。

    * 它帮助你简单地利用多中心 CPU。

    * 在使用此库时，使用每个可用功能都不需要 GUI。

    * 此库支持大范围的阶段和操作系统。

    * 此库易于使用。

    * `Pygame` 使用 `Assembly Code` 和高级 `C` 代码来实现核心功能。


    # Bokeh

    `Bokeh` 是 Python 编程语言的一种直观表示库；它允许在现代网络程序中以惊叹和关键的方式可视化数据。该数据表示库鼓励创建仪表板、数据应用程序和有趣的图表。尽管对通用计划提供了简短而漂亮的改进，`Bokeh`
    库通过对溢出或海量数据集和数据库的最佳知识扩展了其能力。


    ## 特殊功能

    * 使用此库时，可以轻松构建具有清晰标题的真实图表。

    * `Bokeh` 可以成功引入两个最标准的 框架：`Django` 和 `Flask`。

    * 它提供了在多种编程语言中制作奇异和自然数据识别的能力。


    # Asyncio

    此库用于通过 `async` 和预期语法编写并发代码。在程序的大部分，`asyncio` 库非常适合 IO 密集型和高级组织化系统源码。Asyncio 已用于
    Python 非并发框架的结构差异，这些框架提供了数据库相关、循环任务、精英系统和 Web 服务器等。相关的库包含了各种高级和低级 API。


    ## 特殊功能

    * 此库用于通过传输实现协议。

    * 使用此库时，你会发现 Python 代码简单且直观。

    * Asyncio 有助于生成许多不同的循环。


