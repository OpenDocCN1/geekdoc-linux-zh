    the while loop doesn''t become false, the while loop will never end, and the result
    will be an infinite while loop. To have a True Condition, we use a non-zero value
    in while loop, and zero value to indicate the False ConditionExample :>>> variable
    = 1>>> while variable != 2:>>> v = int(input("Enter your desired number :"))>>>
    print ("Entered value is %d"%(v))Output :In this results will be,Enter your desired
    number : 67Entered value is 67Enter your desired number : 69Entered value is 69Enter
    your desired number : 68Entered value is 68Enter your desired number : 76 …It
    will be an infinite loop.Else with Python While LoopPython empowers its developers
    to use the while loop with the while loop inside it, as well. It executes the
    else square when the condition given in the while articulation turns out to be
    false. Like for loop, on the off chance that the while loop is broken using the
    break statement. At that point, the else square won''t be executed, and it will
    execute the announcement present after an else square.Example - 1 :>>> v=1;>>>
    while v<=4:>>> print(v)>>> v=v+1;>>> else:print("The while loop is broken");Output
    :In this case, your console will print,1234The while loop is brokenExample – 2
    :>>> v=1;>>> while v<=5:>>> print(v)>>> v=v+1;>>> if(v==3):>>> break;>>> else:print("The
    while loop is broken");Output :In this case, your console will print,12CHAPTER
    7: Python Functions and File HandlingPython functions and file handling are the
    most important part of Python programming. Without using these functionalities,
