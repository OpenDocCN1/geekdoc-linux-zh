    ### 1.3 主机操作系统


    `Microsoft Windows` 也称为 `Windows` 和 `Windows OS`，是由 Microsoft 公司开发的计算机系统（`OS`）。采用图形界面（GUI）的
    `IBM` 兼容电脑很快主导了市场。大约 90% 的 PC 使用某种形式的 `Windows`。第一个版本的 `Windows` 于 80 年代中期发布，基于
    `DOS` 的部分，`Apple Inc.` 允许用户移动鼠标指针视觉化地导航桌面，而不是使用文本指令和方向。


    后续版本引入了强大的性能，包括 `Windows` 文件管理器以及强大的界面。1995 年发布的 `Windows 95` 与 `DOS` 完全集成并提供内置支持，包括
    `Internet Explorer` 浏览器。在 2001 年发布 `XP` 时，Microsoft 将其各种 `Windows` 包整合在一个旗帜下，提供给消费者和其他。`XP`
    在 2006 年后期获得成功并面临强力竞争。面对令人失望的 `Vista` 发现，Microsoft 在 2009 年发布了 `Windows 7`，一个具有虚拟界面的
    OS，具有显著的改进并满足需求。2015 年，Microsoft 发布了 `Windows 10`，它带有 `Cortana`（类似于 Apple 的 `Siri`）以及替换
    `Internet Explorer` 的 `Microsoft Edge`。Microsoft 还宣布 `Windows 10` 是最新版本的 `Windows`，用户将收到定期更新。


    ## 系统类型和示例


    虽然应用程序的基本角色无处不在，但有许多适用于各种硬件和用户的应用程序。


    ### 标准操作系统


    标准用途 `OS` 代表大量用于广泛硬件的应用程序。标准用途 `OS` 可以安装在多个桌面级和笔记本电脑型号上，并运行从网络浏览器到数据库的应用程序。


    - `Windows`：`Windows` 是微软的一种操作系统，是家庭和商务计算机的标准。于 1985 年推出，基于 GUI 的 `OS` 已发布在多个型号上。

    - `Windows 95`：`Windows 95` 与 `DOS` 完全集成并提供内置支持，包括 `Internet Explorer` 浏览器。

    - `Mac OS X`：`Mac OS X` 是基于 `NextStep` 程序和 Apple 最新 OS 版本的重大重新设计。

    - `UNIX`：`UNIX` 是一种为了灵活性和灵活设计的多用途应用程序。20 世纪 70 年代初开发的 `UNIX` 是用 `C` 编写的应用程序之一。

    - `Linux`：`Linux` 是 `Unix` 的克隆，旨在为 PC 用户提供免费或低成本的选择。


    ### 移动操作系统


    在多任务处理的情况下，多个程序同时运行时，OS 决定哪些程序应该按顺序运行，以及在给另一个程序机会之前允许每个程序运行多久。对于移动设备，`Apple iOS`
    和 Google Android 是两个例子。


    ### 嵌入式操作系统


    操作系统负责识别、配置并赋予应用程序对计算机硬件的正常访问。对于这个例子，嵌入式 Linux 是一个嵌入式操作系统的例子。


    ### 网络操作系统


    网络操作系统（NOS）是另一种特殊的 OS，旨在促进局域网（LAN）内设备之间的通信。NOS 提供网络协议栈，以形成、交换和解包网络包。今天，特殊 NOS
    的概念不再适用，因为某些 OS 类型对网络连接非常敏感。Windows 10 和 Windows Server 2019 就是例子。


    ### 实时操作系统


    当计算机设备必须在持续和循环的时间限制内与现实世界交互时，设备制造商可能会选择使用实时应用程序（RTOS）。例如，工业控制系统可以调节工厂的运行。


