  trans: "\n工程师们！不要包含登录 `/select` 或 `/usr`/`location`！如果你是程序管理员，这一部分不属于你。这是一篇为开发者和软件包编写的文章，旨在让**系统管理员**的生活变得更轻松。\n\
    \n`/opt` 和 `/usr`/local` 指标被系统管理员用于那些没有软件手动包（RPM 之外）的文件，确切地说，是这些文件中不受控的开放性。注意这个文件夹在整个系统中是如何分类的。\n\
    \n手动安装过程（不包括 RPM，或基于简单的文件复制）写在抽屉里被遗忘的文字中（如果有的话），以及在安装者的脑子里。当他去另一份工作时，这种包含对整个团队来说变得显而易见，这是一个定时炸弹。\n\
    \n使用 RPM 则完全不同。RPM（或其他包程序）本身就是“安装过程”。它记录在数据库中，以及安装前和安装后的操作，这实现了完全控制。它独立于执行者来更改安装，它在业务流程中改变安装。\n\
    \n基于 `/opt` 或 `/usr`/local` 的文件管理安装，远没有提供 RPM 提供的组织性、系统可见性和控制力。可以说，当所有软件都实现 RPM\
    \ 化后，`/opt` 和 `/usr`/local` 将过期。\n\n在 Linux 的演进和大规模生产（尤其是桌面之战）中，工程师停止使用这些地狱提示并开始使用\
    \ FHS（文件系统层次结构标准）是非常重要的。\n\n完全集成在一个目录下的产品使用了“挂载方法”，这种方法有几个问题：\n* 它迫使用户更改自然变量（如\
    \ `$PATH` 和 `$LD_LIBRARY_PATH`）以便轻松地使用你的产品。\n* 将文件包含在不熟悉的区域，导致复杂的系统集成，以及为你的产品的未来扩展留出扩展复杂性。\n\
    * 系统管理员可能没有调整这些组件的磁盘空间，导致在安装期间出现问题。\n\n这是没有命令行概念的纯洁应用唯一可接受的方式。这就是为什么它在 Windows\
    \ 中很受欢迎。\n\n许多开发者认为，“内容”方法允许他们处理同一个产品的多个版本，用于测试或任何其他目的。是的，承认吧，出于这个原因或世界上任何其他正当理由。但请记住，高质量软件（或商业级软件）的目标应该是为最终用户服务，而不是让其开发者和测试人员方便。邀请自己去访问一位没有经验的用户（潜在客户），并观察他或她安装你的产品。\n\
    \n开发者，不要害怕根据 FHS 分发你的文件，因为 RPM 会盯着它们。\n\n如果你有业务理由允许用户同时处理你产品的多个版本（或其他原因），请创建一个便携包，这在《Maximum\
    \ RPM 手册》中有所描述。此外，请注意书中描述的使用该功能的后果。\n\n## 4.4 基础 Linux 命令\n\n在我看来，你会熟悉 Windows\
    \ 和 Mac OS X 等许多操作系统。Linux 是当今正在使用的最强大的操作系统之一。根据超级计算机 TOP500 购买者的最新数据，“Linux 如今占据了全球前\
    \ 500 台超级计算机的 100%”。这难道不让你感到困扰吗？\n\n操作系统是计算机和所有现代计算设备的灵魂和大脑。它是处理与你的桌面或笔记本电脑相关的所有硬件资源的软件。换句话说，操作系统控制着你的\
    \ `Software` 与硬件之间的连接。\n\nLinux 是如此无无处不在的，它出现在手机、汽车、冰箱和 Roku 设备上。它使用了互联网的大部分和大多数计算机。事实上，多个国家的全球股票交易所运行在\
    \ Linux 上。Linux 作为可用最可靠、最安全且强大的应用程序之一，已成为全球范围内部署桌面、服务器和嵌入式应用的平台。\n\n### 基础 Linux\
    \ 指令\n\n现在，让我们来看 Linux 上最重要的 20 个命令。Linux 命令非常敏感，所以你需要对你说的话小心。\n\n* `ls` – 如果你认识\
    \ Windows，就会知道 `dir` 用于过滤索引内容。某些类型支持颜色编码。蓝色的字代表引用的名称。\n* `ls -l | more` – 这有助于分离结果，以便你可以逐页查看。否则，列表会滚动得非常快。你可以随时使用\
    \ `ctrl+c` 返回命令行。\n```\n$ ls -l file name\n```\n* `cd /var/log` – 改变当前目录。Linux\
    \ 上使用高级斜杠。例如，一个附有各种 Linux 版本的 Linux 指南。如果你使用 `ls -l`，你将能够看到索引中内容的许多细节：\n    *\
    \ 文件\n    * 文件关联权限\n    * 文件所有者\n    * 与文件关联的组\n    * 文件大小\n    * 时间戳\n    * 文件名\n\
    ```\n$ cd /var/log\n```\n* `grep` – 在文件中查找文本。`grep` 命令同时搜索多个文件以找到你想要的文本段。\n```\n\
    `grep PATTERN [FILE]`\n```\ngrep failed transaction.log\n```\n上面的命令将找到文件中所有类似于单词“failed”的词。\n\
    ```\n$ grep 'failed' transaction.log\n```\n* `su` / Sudo 顺序 – Linux 系统中某些命令需要更高的操作权限。因此，你可以以系统管理员身份执行普通用户无法执行的操作。\n\
    * `sudo` – 如果你只需要以超级用户身份使用某些东西，可以使用 `sudo` 命令。这将允许你将命令应用到建议的权限，并且独立于执行者来更改安装，它在业务流程中改变安装。\n\
    \n基于 `/opt` 或 `/usr`/local` 的文件管理安装，远没有提供 RPM 提供的组织性、系统可见性和控制力。可以说，当所有软件都实现 RPM\
