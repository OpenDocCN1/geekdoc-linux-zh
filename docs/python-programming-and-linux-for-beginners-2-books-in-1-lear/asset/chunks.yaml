    ### Chapter 1: History of the Operating System


    Early computers did not have any applications. Each program that operates on these
    computers was required to enter all the code needed to operate the computer, connect
    to hardware, and perform calculations. This situation has made even the simplest
    of programs even complicated. To address this issue, intermediate computer owners
    began developing system software that enabled them to write and execute computer
    programs, thus giving birth to the first applications. The first operating system
    was developed by `General Motors` in 1956 using a single computer. In the middle
    1960s, `IBM` was the first computer manufacturer to take on the task of developing
    applications and began distributing applications on the computers.


    Now, the first operating systems were developed in the 1950s when computers could
    operate only program at one time. After a few more decades, computers began to
    install additional software programs, sometimes called libraries, that came together
    to create the start of modern applications. In the middle 1960s, the first version
    of the `UNIX` app was developed. It is written in `C` language and is available
    free of charge during its early years. `UNIX` is easily adapted to new programs
    and quickly embraced widely. Most modern operating systems, including `Apple OS
    X` and all different Linux versions, go back or rely on Unix OS.


    `Microsoft Windows` was developed in response to `IBM`''s application for the
    application to run its computer or PC operating system. `Microsoft`''s first operating
    system was not called Windows; it was called `MS-DOS` and was built in 1981 when
    it purchased the `86-DOS` operating system from `Seattle Computer Products` and
    modified it to meet `IBM`s needs. The "Windows," was first used in middle 1900s
    when a graphical user interface was created and paired or integrated with `MS-DOS`.
    Today `Apple`, `OS X`, `Microsoft Windows`, and various Linux versions (including
    `Android`) dominate most of today''s operating system market, as we saw earlier.
    Many software operating systems are designed to work with one company''s operating
    system, for example, `Windows` (Microsoft) or `macOS` only (Apple). The software
    will indicate which operating systems are supported and will specify more if applicable,
    including the versions of that concerned OS it supports. For example, the video
    production software program may be compatible with `Windows 10`, `Windows 8`,
    and `Windows 7`, but not compatible with previous versions of Windows such as
    `Windows Vista` and `XP`. Software developers often release different versions
    of their software that work with other applications or different types. Going
    back to the example of a video production program, that company could also launch
    another version of the program with similar features but work with mac OS, a Windows
    operating system. It is also essential to know whether your application is 32-bit
    or 64-bit. A common question they ask you when you download software.


    ## 1.1 What is an Operating System?


    An operating system (`OS`) is a program that manages all other system programs
    on the computer after initially installed on a computer with a boot program. App
    applications use the application to make service requests using a defined application
    interface (`API`). Users can also communicate directly with the operating system
    using a user interface, such as a line interface (`CLI`) or graphical UI (`GUI`).


    ### Why use an Operating System?


    The operating system brings powerful benefits to computer software and software
    development. Outside of the application, the entire application will need to enter
    its UI, as the amount of hardware available, this will reduce all applications''
    size and make software upgrades. Instead, most common tasks, such as sending package
    or displaying the text on some output devices, such as a monitor, can be sent
    to system software that acts as a link between apps and hardware. As long as each
    application accesses resources and services in the same way, that application
    - can work on any number of applications. Once you install operating system, this
    relies on large device driver to make OS services go to specific location. Therefore,
    the whole application can make normal call on the device, but the Operating System
    receives that call and uses the corresponding driver to translate the call into
    actions (commands) required for particular computer.


    ### Operating System Functions


    The operating system provides three key capabilities: Provides UI with `CLI` or
    `GUI`; presents and manages the application; and identifies and displays hardware
    resources for those applications - usually, with default.


    ### User Identifier (UI)


    Every operating system requires a `UI`, which enables users and administrators
    to interact with the OS so they can set up, configure, and troubleshoot the operating
    system and its hardware. There are two main types of UI available: `CLI` and `GUI`.
    The `CLI` mode, or terminal mode, provides a text-based display where users simply
    rely on keyboards to enter specific commands, and parameters. The Graphical User
    Interface, or desktop, provides a visual interface based on icons and symbols
    where users rely on actions acquired by human interface, such as touchpads, touch
    screens, and mouse devices. The `GUI` is widely used by unfamiliar or end-users
    who have a great desire to create applications and files, such as double-clicking
    a file icon to open file.


    ### Application Management


    The app manages the launch and management of the entire app. This often supports
    multiple behaviors, including processing processes, or threads, so that different
    tasks can be shared during existing processors; manage software-based interference
    to get the processor''s immediate attention, ensuring that there is sufficient
    memory to process the system and its corresponding data without interrupting other
    processes; make error management without interfering with other applications or
    OS. The operating system can support `APIs` that allow applications to use OS
    and hardware functions without the need to know anything about low-level OS or
    hardware status. For example, the `Windows API` may allow an application to receive
    input from keyboard or mouse; create `GUI` objects, such as windows dialog and
    buttons; read and write files to a storage device; and more. Applications are
    always designed to use the application where the program intends to run. In addition,
    the operating system can perform the following services for applications:


    - In multitasking, where multiple programs run simultaneously, the OS determines
    which programs should run in sequence and how long they should be allowed in each
    application before giving another program a chance.

    - Handles the input and output (`I/O`) to and from attached hardware devices,
    such as hard disks, printers, and dial ports.

    - Sends messages to each app or to your partner - or to the system operator -
