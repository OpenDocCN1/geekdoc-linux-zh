    \ Windows 子系统（`WSL 2`）的第二个副本。虽然高度针对开发者，但 Windows 用户在没有意识的情况下就获得了一个 Linux 空间。这是一个新阶段且持续工作中。如果你试图推得太远，可能会遇到一两个\
    \ bug，但如果你只是想开始学习 Linux、阅读一些指令并感觉在文本环境中进行敏感工作，WSL 2 可能正是你需要的。\n\n### 如何使用\nWSL\
    \ 没有的路径或目的，但为你的 Windows 机器提供了 Linux 环境。你拥有 root 权限，可以使用 Linux 发行版和应用程序，因此是一种简单无缝的学习方法。然而，尽管\
