    \ It is also used in many other programming languages for the satisfaction of\
    \ a condition. In Python, the `else` Statement can be executed inside a 'for loop.'\n\
    \nExample - 1:\n```python\nfor v in range(0,8):\n    print(v)\nelse:\n    print(\"\
    Excluding break statement therefore for loop completely exhausted.\");\n```\n\n\
    Output:\nIn this case, your console screen will print,\n01234567\nSince there\
    \ is no break, for loop completely exhausted\n```\n\nExample – 2:\n```python\n\
    for v in range(0,5):\n    print(v)\n    break;\nelse:\n    print(\"for loop is\
    \ exhausted now!\");\nprint (\"break statement is used therefore loop gets broken\"\
