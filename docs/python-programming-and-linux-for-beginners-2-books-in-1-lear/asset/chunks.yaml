    *   变量名不能包含任何空白或空区域，也不能包含任何特殊或不常见的字符，如 `!`、`@`、`#`、百分号、`^`、`&` 和 `*`。

    *   变量名不能与你 Python 程序语法中描述的任何口号相似。

    *   在 Python 中，变量是区分大小写的。例如，`I''m cool` 和 `cool` 是不等等的。

    *   有效标识符实例：`n696`、`v`、`v 69` 等。

    *   无效标识符实例：`5a`、`v percent 69`、`x69` 等。


    # 多重任务

    在单个描述中（通常称为不同的赋值），Python 帮助为不同的标识符保留机会。它可以通过两种替代方式使用：要么同时为多个标识符声明同一个激励，要么在不同时间将不同的特征分配给多个变量。


    ### 示例 - 1

    打开 Python 控制台或 IDE 并编写声明变量的命令。

    ```python

    >>> n=v=w=987

    >>> print

    >>> print (n, v, w)

    ```

    输出：

    当你输入 `print` 变量值的命令时，输出将如下所示。

    ```python

    >>> 987, 987, 987

    ```


    ### 示例 – 2

    ```python

    >>> n, v, w = 987, 876, 765

    >>> print

    >>> print (n)

    >>> print (v)

    >>> print (w)

    ```

    输出：

    对于输出，当你输入命令 `print (n)` 时，你的控制台将打印 `"987"`。当你输入命令 `print (v)` 时，控制台将打印 `"876"`。当你输入命令
    `print (w)` 时，控制台将打印 `"765"`。


    # 5.2 Python 中的运算符

    一般来说，运算符是语言特有的语法标记，需要执行某些操作。运算符主要源于数学原理。例如，`"乘法符号 (*)"` 是一个 Python 编程运算符。它用于两个数字的乘法。


    在 Python 中，运算符表示为函数的符号表示，为了实现某些真实且理想的结果，在两个操作数之间执行特定操作。在单个计算机编程语言中，运算符被视为软件运行的基石。Python
    提供的运算符选择被视为一种追求。为了执行基本操作，这里是一些被广泛使用的运算符：


    *   算术运算符

    *   比较运算符

    *   赋值运算符

    *   逻辑运算符

    *   位运算符

    *   成员运算符

    *   标识符运算符


    在本书的这一部分中，我们将讨论上述提到的的部分运算符。


    ## 算术运算符

    为了得到所需的结果，算术运算符用于执行复杂的算术运算。在这种情况下取两个操作数，通过运算符在它们之间执行操作，产生某些所需的、唯一的且绝对的值。以下是 Python
    中广泛使用且重要实用的算术运算符。


    *   加法 `"+"`

    *   减法 `"-"`

    *   除法 `"/"`

    *   乘法 `"*"`

    *   取模 `"%"`


    这些运算符的详细定义：


    ### 加法 `"+"`

    该运算符用于两个操作数之间执行加法或求和操作。

    示例代码：

    ```python

    >>> n, v = 25, 25

    >>> n + v

    ```

    在这种情况下，你的控制台将打印 `"50"`。


    ### 减法 `"-"`

    该运算符取第一个操作数，并从第一个中减去第二个。

    示例代码：

    ```python

    >>> n, v = 25, 25

    >>> n - v

    ```

    在这种情况下，你的控制台将打印 `"0"`。


    ### 除法 `"/"`

    该操作数获取第二个操作数并将第二个操作数除以第一个操作数，并根据你的性能给出商。

    示例代码：

    ```python

    >>> n, v = 6, 2

    >>> n / v

    ```

    在这种情况下，你的控制台将打印 `"3.0"`。


    ### 乘法 `"*"`

    如前所述，该运算符在第一个操作数和第二个操作数之间执行乘法操作。

    示例代码：

    ```python

    >>> n, v = 6, 3

    >>> n * v

    ```

    在这种情况下，你的控制台将打印 `"18"`。


    ### 取模 `"%"`

    该运算符负责除法服务，并接收余数作为产出。

    示例代码：

    ```python

    >>> c, w = 4, 2

    >>> c % w

    ```

    在这种情况下，你的控制台将打印 `"0"`。


    ## Python 的比较运算符

    当我们谈论 Python 时，比较运算符用于比较两个操作数并分别返回一个布尔类型，即 TRUE 或 FALSE。


    *   `==` : 真实：当且仅当值在逻辑上相等且有效时，才使用此运算符。

    *   `!=` : 真实：当值准确但不相等时，使用此运算符。

    *   `<=` : 真：当第一个操作数小于或等于第二个操作数时，使用此运算符。

    *   `>=` : 真：当第一个操作数大于或等于第二个操作数时，使用此运算符。

    *   `<>` : 真实：当值不等时不使用此运算符。

    *   `>` : 真：当第一个操作数大于第二个操作数时，使用此运算符。

    *   `<` : 真：当第一个操作数小于第二个操作数时，使用此运算符。


    ## Python 的赋值运算符

    在 Python 中，赋值运算符用于将右侧赋值给左侧。


    *   `=` : 此运算符用于将右侧的值赋值给左侧。

    *   `+=` : 将右侧的操作数加到左侧操作数上。

    示例代码：

    ```python

    >>> n, v = 4, 2

    >>> n += v

    >>> n

    ```

    在这种情况下，你的控制台将打印 `"6"`。

    *   `-=` : 从左侧操作数减去右侧的操作数。

    示例代码：

    ```python

    >>> n, v = 4, 2

    >>> n -= v

    >>> n

    ```

    在这种情况下，你的控制台将打印 `"2"`。

    *   `*=` : 将左侧操作数乘以右侧的操作数。

    示例代码：

    ```python

    >>> n, v = 4, 2

    >>> n *= v

    >>> n

    ```

    在这种情况下，你的控制台将打印 `"8"`。

    *   `%=` : 该运算符负责将左侧操作数除以右侧操作数并取余数。

    示例代码：

    ```python

    >>> n, v = 4, 2

    >>> n %= v

    >>> n

    ```

    在这种情况下，你的控制台将打印 `"0"`。


    ## Python 中的逻辑运算符

    我们还需要根据逻辑事实（即真或假）来做出决策，正如我们在现实生活中所做。例如，如果有人打电话问你“你在家吗？”你有两个选择：“是的，我在家”或“不，我不在”。在编程中，这对应
    0（假）和 1（真）。这被认为是合理的。


    在 Python 中，为了实现这些独特的选项，逻辑运算符用于测试表达式。这些运算符对于任何逻辑编写都非常有用。为了更好地理解这些运算符，以下是逻辑运算符列表及其简要描述。


    ### 与运算符

    如果表达式 `C` 有效且表达式 `W` 也为真，则结果是正确的。在任何其他情况下，结果都是错误的。

    此表可以帮助你更好地理解“与运算符”。


    | C | W | C and W |

    |---|---|---|

    | True | True | True |

    | True | False | False |

    | False | True | False |

    | False | False | False |


    ### 或运算符

    当且仅当两个操作数都为假时，才会导致假。假设表达式 `C` 为真，另一个表达式 `W` 为假，那么结果将是有效的/真。

    此表可以帮助你更好地理解“或运算符”。


    | C | W | C or W |

    |---|---|---|

    | True | True | True |

    | True | False | True |

    | False | True | True |

    | False | False | False |


