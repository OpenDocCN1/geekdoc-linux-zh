    ## 引言


    普通用户并不太了解操作系统（`OS`）是最常用的平台。它适用于手机、智能手表、冰箱、视频游戏机等设备，而 `Linux` 可以用于托管网站、构建另一个设备以及恢复崩溃的文件。`NASA`
    和惠尔普也加入了 `Linux` Shell。`Linux` 最初是作为 `UNIX` 家族创建的，并在 1991 年由 Linus Torvalds 发布。


    ### 必要的软件


    如果你有 `Linux` 文本编辑器或环境，它将很有帮助。沙箱允许程序在机器上运行。在编写新应用程序代码时，沙箱是必不可少的。许多不同的沙箱，大多数是免费的，没有是免费的。你将首先使用
    `Linux` 内核，它包含特定的程序和命令。


    ### 编程语言


    `Linux` 最常用的编程语言是 `C`，这种语言最早于 1972 年出现在贝尔实验室。`C` 是在 `C` 中最早的类之一。任何编程语言都可以用于编写
    `Linux` 代码，但你最常用的语言是编写代码的方法。新语言如 `Java`、`C++` 和 `Python` 允许更高的灵活性和更复杂的程序，如块结构。在各种语言上运行的
    Linux 与 `Linux` 内核是一致的。如果你有文本编辑器、Linux shell 和高级环境，以及良好且稳定的机器，将会帮助。


    ### 第 1 章：操作系统历史


    早期计算机没有任何应用程序。运行在这些计算机上的每个程序都需要代码来操作计算机、连接硬件并进行计算。这种情况使得即使是最简单的程序变得复杂。为了解决这个问题，计算机所有者开始开发系统软件，使他们编写并执行计算机程序，从而诞生了第一个应用程序。第一个操作系统是由通用汽车公司在
    1956 年使用单台计算机开发的。在 20 世纪 60 年代，IBM 是第一个承担开发应用程序并在计算机上分发应用程序的计算机制造商。


    现在，第一批操作系统开发于 1950 年代，当时计算机只能运行一个程序。几后，计算机开始安装额外的软件程序（有时称为库），它们汇聚在一起形成了现代应用程序的开始。在
    20 世纪 60 年代，第一个版本的 `UNIX` 应用被开发。它用 `C` 语言编写，并在早期是免费提供的。`UNIX` 很容易适应新程序并被广泛采用。大多数现代操作系统包括
    `Apple OS X` 和所有不同的 Linux 版本都追溯或依赖 Unix 操作系统。


    `Microsoft Windows` 是为了响应 IBM 对运行计算机或 PC 操作系统的应用程序需求而开发的。Microsoft 的第一个操作系统不叫
    Windows；它叫 `MS-DOS`，构建于 1981 年，当时从 Seattle Computer Products 购买了 `86-DOS` 操作系统并对其修改以满足
    IBM 的需求。“Windows”最早用在 20 世纪中期，当时图形用户界面被创建并与 `MS-DOS` 配对或集成。今天，`Apple`、`OS X`、`Microsoft
    Windows` 和各种 Linux 版本（包括 `Android`）占据了当今大多数操作系统市场，正如我们之前看到的。许多软件操作系统设计为与特定公司的操作系统配合，例如
    `Windows`（微软）或仅限 `macOS`（苹果）。软件将指示支持哪些操作系统并在适用情况下指定更多，包括它支持的相关 OS 版本。例如，视频制作软件可能兼容
    `Windows 10`、`Windows 8` 和 `Windows 7`，但不兼容之前的 Windows 版本（如 `Windows Vista` 和
    `XP`）。软件开发者经常发布软件的不同版本，以与其他或其他或其他类型。回到视频制作程序的例子，该公司还可以推出另一个具有相似功能但适用于 mac OS（Windows
    操作系统）的版本。了解你的应用程序是 32 位还是 64 位也至关重要。这是你下载软件时他们问你的常见问题。


    ## 1.1 什么是操作系统？


    操作系统（`OS`）是一种在计算机上最初安装后，管理所有系统程序的程序。用户也可以通过定义的接口（`API`）、命令行界面（`CLI`）或图形界面（`GUI`）直接与操作系统通信。


    ### 为什么使用操作系统？


    操作系统为计算机软件开发带来了强大的益处。在应用程序之外，整个应用程序需要 UI 来输入命令。只要应用程序以相同的方式访问资源和服务，操作系统就可以依赖设备驱动程序在特定位置，执行大多数常见任务，如在显示器等输出设备上显示文本。在多任务处理的情况下，多个程序同时运行时，OS
    决定哪些程序应该按顺序运行，以及在给另一个程序机会之前允许每个程序运行多久。


    ### 操作系统功能


    操作系统提供三项关键能力：为 `CLI` 或 `GUI` 提供 UI；呈现并管理应用程序；识别并显示硬件资源——通常是默认的。OS X 升级增加了诸许多功能，如自动备份和用于小型可用应用程序的“仪表板”管理器（小组件）。自
    2007 年以来，Apple 引入了许多可以访问互联网的移动设备，包括 `iPhone` 手机和 `iPad` 平板电脑。Apple 很快强调了 OS X
    连接这些设备的能力。2011 年，Apple 引入了 `iCloud`，一种云计算服务。


    ### 用户标识 (UI)


    每个操作系统都需要一个 `UI`，以便用户和管理员与操作系统进行交互。有两种主要的 UI 类型：`CLI` 和 `GUI`。`CLI` 模式或终端模式提供了一个基于文本的显示，用户只需依靠键盘输入特定命令。图形用户界面或桌面提供了一个基于图标和符号的视觉界面，用户依靠触控板、触摸屏和鼠标设备来执行操作。


    ### 设备管理


    操作系统负责识别、配置并赋予应用程序对计算机硬件的正常访问。当 OS 检测并识别硬件时，OS 将安装设备的兼容驱动程序，使操作系统和运行在 OS 上的应用程序无需特定的硬件或设备知识即可操作设备。操作系统负责识别正确的打印机并安装相应的打印机驱动程序，以便系统只需对打印机进行调用，而无需使用特定于打印机的代码或指令——这就是应用程序的功能。其他设备也是类似的，例如
    `USB` 端口、社交网络网站、图形设备（如图形处理器 `GPUs`）、主板上的芯片组以及存储设备（如串行 SCSI `SAS` 磁盘适配器和格式化为相应文件系统的磁盘）。


    OS 识别并准备有效且易理解的服务设备，并通常在标准格式（如 `Windows Registry`）中记录它们。设备制造商偶尔配对和更新驱动程序，OS 必须更新它们以确保最大的安全和设备性能；当设备被替换时，OS
    会重新安装并准备新驱动程序。


    ## 1.2 IBM 硬件上的系统


    `IBM PureApplication System` 是一种基于云的计算机程序，集成了用于在云中部署和执行任务的硬件和软件换句话之，企业数据中心添加到私有云环境所需的一切。书中这部分专门处理
    `IBM PureApplication System` `v1.1` 软件，描述了第二代硬件系统的变化。它由一组之前发表的文章共同解释了提供应用管理软件的硬件和软件
    `PureApplication System`。这些主题包括：


