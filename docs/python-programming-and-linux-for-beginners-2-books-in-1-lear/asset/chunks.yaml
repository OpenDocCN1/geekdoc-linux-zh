    在许多计算机编程语言中，`GNU/EMACS` 文本编辑器主要使用独特的定制来实现渐进式方法。该编辑器使用的一个扩展是 `Elpy` 扩展。该编辑器有许多使其与其他文本编辑器区分开来的特性。例如，它提供了一种句子结构，可以将文本之间的存档记录分段和空间隔离开，以获得最佳的格式。


