  trans: "\n\n20 世纪 60 年代年代后期，Thompson 和 Ritchie 想要在一台比 `PDP-7` 大得多的机器上运行 Unix，他们向贝尔实验室的另一项财务资助承诺添加\
    \ Unix 文本处理能力，并对 `PDP-11/20` 机器码进行了编码。因此，在 1970 年，活跃的 Unix 系统首次正式发布并实现在 `PDP-11/20`\
    \ 上。它增加了一个名为 `roff` 的文本开发程序和一个文本编辑器。这三者都是用 `PDP-11/20` 会编语言编写的。贝尔实验室将这个由 Unix\
    \ 开发的第一个“文本处理”程序 `Roff` 以及编辑器应用于专利申请的文本处理中。`Roff` 很快演变成了 `troff`，这是第一个具有完整编辑能力的电子出版系统。\n\
    \n1972 年，Unix 用 `C` 语言进行了重写，这与当时的一种普遍认知形成对比，当时人们认为“没有任何处理关键周期性事件的应用程序如此复杂，只能用汇编语言编写”（尽管\
    \ Unix 并不是第一个用高级语言编写的操作系统，自 1961 年以来，`Burroughs B5000` 就已经了）。`C` 语言是由 Ritchie\
    \ 作为 `B` 语言的改进版本开发的，而 Thompson 是基于 Martin Richards 的 `BCPL` 翻译开发的。从汇编语言向高级 `C`\
    \ 语言的迁移产生了可移植软件，当 Unix 安装在其他计算机平台上时，只需替换少量的基于机器的代码。\n\nAT&T 已经通过许可协议将 Unix 提供给大学、商业公司以及美国政府。许可内容包含所有源代码，包括用\
    \ `PDP-11` 汇编代码编写的容器机器部分。指定的 Unix 内核源码副本在 20 世纪 70 年代后期以纸质副本的形式广泛分发，这导致了 Unix\
    \ 作为教育模型被广泛使用。在某一时期，`ARPA`（高级研究计划局）将 Unix 采用为 `Arpanet`（前互联网）社区的官方语言。\n\n20 世纪\
    \ 70 年代后期和 80 年代初，Unix 对学术界的影响使其被广泛接受（特别是来自加州大学伯克利分校的 `BSD` 版本），并引发了许多商业倡议，例如\
    \ `Solaris`、`HP-UX` 和 `AIX`。今天，除了上述的 Unix 认证程序外，经常还会遇到如 `Linux` 和 `BSD` 世代（`FreeBSD`、`NetBSD`\
    \ 和 `OpenBSD`）等 Unix 驱动程序。\n\n# Linux OS\n由于其庞大的发行量和用户基础，Unix 是世界上最活跃的程序之一。它最初是\
    \ 20 世纪 70 年代中期为微机和大型机开发的多用途系统。从那时起，它成为任何地方最广泛使用的应用程序之一，尽管其视觉界面有时令人困惑且缺乏中间暂停机制。\n\
    \nUnix 受欢迎的真正原因是什么？许多黑客认为 Unix 是“三位一体”——唯一的操作系统。因此，Linux 的开发是一个日益增长的 Unix 黑客群体的，他们想要亲自动手操作自己的系统。Unix\
    \ 版本出现在许多程序中，从个人电脑到像 `Cray Y-MP` 这样的大型计算机。你的计算机许多 Unix 版本非常昂贵且复杂。当时，`ATM T's System\
    \ V 386` 单引擎版本的价格约为 1500 美元。\n\n`Linux` 是一个广泛分发的 Unix 版本，最早由 Linus Torvalds 开发，他在\
    \ 1990 年初作为芬兰赫尔辛基大学的一的一学生学生开始研究 Linux。Linus 现在运营位于加利福尼亚州圣塔克拉拉的 `Transmeta Corporation`，并维护应用程序最底层的组件\
    \ `Linux kernel`。\n\nLinus 在互联网上免费发布了第一个版本的 Linux，无意中引入了历史上规模最大的软件升级之一。今天，Linux\
    \ 由一个散布全球互联网、自由工作的数千名开发者组成的团队（如果不是所有人的话）编写和维护。公司已经开始提供 Linux 支持，将其封装成易于安装的发行版，并销售预装好的工作站和\
    \ Linux 软件。1999 年 3 月，首场商业 `Linux World Expo` 在加利福尼亚州圣何塞举行，据报道有超过 12,000 人参加。大多数估计认为全球\
    \ Linux 用户数大约在 1000 万左右（并预计你在阅读这段文字时会觉得这个数字很小）。\n\n受到 `Andrew Tanenbaum` 的 `Minix`\
    \ 程序（另一个用于 PC 的免费 Unix，尽管非常简单）的鼓励，Linux 起始于一个课堂项目，Linus 想要构建一个可以在基于 `386` 的 PC\
    \ 上运行简单 Unix 程序。关于 Linux 的首次对话发生在 `Usenet comp.os.minix` 新闻组。这些讨论对于想要更多功能的 `Minix`\
    \ 用户开发 Unix 微型课程是一个主要关注点。\n\nLinux 的早期开发主要集中在 `80386` 保护接口的切换特性，全部用汇编代码编写。Linus\
    \ 写道：\n\n```bash\n在那之后，一切变得清晰了：虽然仍然要安装各种代码，但我有一些设备，而且修复错误很容易。我那个阶段我开始使用 C 和 C++，这确实加速了进度。那是我目标开始认真对待我那关于让“Minix\
    \ 比 Minix 更好”的狂妄想法的时期。我希望有一天能在 Linux 下重新汇集 GCC。\n```\n\n两个月的基础设置，但持续了很长时间，直到我有了驱动程序，修复错误变得容易。那是\
    \ 1991 年 8 月我制作 `0.01` 版本时，当时它很丑，但已经在我的机器上运行了。\n\n# 第 2 章：Linux\nUnix 是一项广泛使用的系统，由于其开源特性，它在所有硬件上运行，包括大型机和更小的设备。由于其\
    \ Unix 式的设计，Linux 在服务器上运行得最好。Linux 是一项被广泛使用的开源系统，它以其稳定性而闻名。\n\n## 2.1 什么是 Linux？\n\
    在我们开始下载之前，了解它是重要的。如果你不了解它，你可能是 Windows 或 Mac 用户，它们非常流行。Linux 是一个操作系统。\n\n## 为什么使用\
    \ Linux？\n如果你是 Windows 用户，你是否一直想学习一个全新的系统吗？几乎每个电脑都是如此 —— 买新笔记本电脑、去图书馆、在工作时使用。与\
    \ Windows 不同，Linux 提供了一些很棒的功能，例如 Linux 是完全免费的（你可以根据需要定制你的系统）。\n\n## Linux 是用来做什么的？\n\
    通过应用程序，Linux 具有一些“开箱即用”的功能。\n- 你可以使用它来解决其他电脑的问题。\n- 例如，你的电脑无法启动，你仍然可以使用 Linux\
    \ 磁盘。\n- 托管网站；事实上，大多数网站都在 Linux 上运行。\n- 你的操作系统。\n- 以较低的价格构建服务器。Linux 在你的电视、智能手机，甚至洗衣机上。\n\
    \n## 2.2 使用 Linux 的优点与风险\n### Linux 的优点\n- Linux 非常容易安装，你不需要立即安装。如果你只是想测试一下是否喜欢，可以从\
    \ USB 驱动器或 CD 启动 Linux。它运行良好，你不需要对硬盘进行任何更改 —— 双赢。\n- 如果你是一个年轻的工程师并且知道自己在做什么，Linux\
    \ 适合你。与 Windows 不同（作为）。\n- 如上所述，Linux 是免费的！所以你不需要为它付费。\n- 所以，你可以分发你的更改给他人。\n-\
    \ Linux 以更稳定和安全著称（在 Linux 上被感染的概率远低于其他 OS）。\n- 它使用的资源和空间不像 Windows。你可以在 500MB\
    \ 的硬盘和内存上启动程序。这令人印象深刻。\n- 它可以在 Windows 内部使用，如果你不想完全跳转。\n- 它是一个非常智能且强大的程序，实际上比你想要的任何东西都强大，并且准备好了一。\n\
    - 有几乎任何系统的替代方案，例如 Photoshop、Microsoft Word 有免费版本。\n- 有社区支持解决问题。\n\n### Linux 的缺点\n\
    - Linux 不像 Windows 那样简单，或者说不是“开箱即用”。\n- 没有专门的技术支持，除非你注册企业版 Linux，否则“修复”问题就在你自己手中。然而，你获得的是免费软件，所以这是值得考虑的。\n\
    - 如果你发现了视频游戏，你会选择 Windows，因为大多数游戏不可用，但这并不意味着你不能。没多少，而且很容易。\n- 驱动程序并不真的在那里，虽然有一个操作系统，但用户在尝试使用旧硬件时报告了问题。\n\
    - 它可能作为双启动 own Windows 的替代品，因为你可以在上面找到正确的程序，尽管它提供了亲戚，但并不一样。Photoshop 毕竟是 Photoshop。\n\
    - 终点的终？Linux 是一项允许你在其中做任何你想做的大型程序，而且它是免费的。事实上，你在运行 Windows 或 Mac 的电脑上阅读这个，而且它是可能的的。\n\
    \n## 2.3 获取访问权限\n在 Linux 中，`access` 命令用于检查系统是否拥有某个文件的权限。它可以检查文件是否存在。检查是通过 `UID`\
    \ 和 `GID` 进行。\n\n```c\nint access (const char *pathname, int mode);\n```\n\n在这里，第一个参数接收文件路径，第二个参数接收标志\
    \ `R_OK`、`W_OK` 或 `X_OK`。\n- `F_OK`: 用于检查文件是否存在。\n- `R_OK`: 用于读取权限。\n- `W_OK`:\
    \ 用于写入权限。\n- `X_OK`: 用于执行权限。\n\n注意：如果 `access()` 无法访问该文件，它将返回 `-1`，否则返回 `0`。\n\
    \n### 示例 1\n```c\n#include <stdio.h>\n#include <unistd.h>\n#include <errno.h>\n\
    #include <sys/types.h>\n#include <stat.h>\n#include <fcntl.h>\n\nint main (int\
    \ argc, char *argv[]) {\n    if (access(\"sample.txt\", F_OK) == -1) {\n     \
    \   perror(\"错误描述:\");\n    } else {\n        printf(\"没有错误\\n\");\n    }\n  \
    \  return 0;\n}\n```\n\n### 示例 2\n```c\n#include <stdio.h>\n#include <unistd.h>\n\
    #include <errno.h>\n#include <sys/types.h>\n#include <stat.h>\n#include <fcntl.h>\n\
    \nint main (int argc, char *argv[]) {\n    if (access(\"sample.txt\", R_OK | W_OK\
    \ | X_OK) == -1) {\n        perror(\"错误描述:\");\n    } else {\n        printf(\"\
    没有错误\\n\");\n    }\n    return 0;\n}\n```\n\n### 示例 3\n```c\n#include <stdio.h>\n\
    #include <unistd.h>\n#include <errno.h>\n#include <sys/types.h>\n#include <stat.h>\n\
    #include <fcntl.h>\n\nint main (int argc, char *argv[]) {\n    if (access(\"sample.txt\"\
    , R_OK) == -1) {\n        perror(\"错误描述:\");\n    } else {\n        printf(\"\
    没有错误\\n\");\n    }\n    return 0;\n}\n```\n\n# 第 3 章：Linux 与其他主流操作系统的比较\n## 3.1\
    \ Linux OS 与 Windows OS\n### 用户\nLinux 上有三种用户（普通用户、管理员 `root` 和服务），而 Windows 有四种类型（管理员、标准用户、儿童和访客）。\n\
    \n### 使用\n根据市场研究数据，全球 92.63%的电脑运行 Windows，而至少 1%的电脑用户使用 Linux。许多用户认为 Linux 比 Windows\
    \ 难以使用，因此 Linux 的抱怨仅限于家庭使用。无论是否有 GUI，服务器程序运行在 Linux 上。此外，得益于与微软的许可，各种电脑供应商都有权将\
    \ Windows OS 集成，使得 Linux 越来越受欢迎。尽管今天 Dell 和 HP 等许多电脑供应商开始提供 Linux 作为预装操作系统，但 Windows\
    \ 仍然主导市场。\n\n### 内核\nLinux 使用内核内核，占用空间更大，而 Windows 使用微内核，占用空间较少但效率低于 Linux。\n\n\
    ### 文件\n在 Microsoft Windows 中，文件存储在不同驱动器的目录中，如 `C:`、`D:`、`E:`，但在 Linux 上，文件是从根目录开始的树形结构，没有子记录。在\
    \ Linux OS 中，一切都被视为文件。引用是文件，以及外部连接设备（如打印机、键盘）也是文件。\n\n### 安全\n每个 Windows 用户都会偶尔遇到安全和稳定性问题。由于\
    \ Microsoft Windows 是最常用的操作系统，黑客和垃圾邮件经常针对 Windows。Windows（消费者类型）最初设计用于没有网络连接的单用户\
    \ PC，没有内置安全功能。微软经常通过 Windows Update 服务移除漏洞。这每月发布一次，即使在需要时提供关键更新。大多数时候，Windows\
    \ OS 用户遇到蓝屏。这是由于系统无响应。最后，用户必须放下顾虑并手动重启电脑。另一方面，Linux 基于多用户构建，使其比单用户操作系统（Windows）更稳定。由于\
    \ Linux 由全球的公共开发者运行，任何新问题都可以在几小时内解决。\n\n### 兼容性\nWindows 胜出。Linux 是协作的伙伴。尽管最近的软件或安装，Windows\
    \ 用户可以确保任何软件（即使是最冷门、过时的）都能运行或被开发者放弃。Linux 有良好的支持。Linux、Linux、Linux... Linux 是\
    \ Windows 用户认为理所当然的基础设施。\n\n### 易用性\n多年来，Linux 在易用性方面已经走得太远并受到了限制。像 Linux Mint\
    \ 和 Ubuntu 等发行版已经做到让非技术用户更轻松地安装和设置。由于份额的增长，Linux 已经成为大多数设备的默认 OS。\n\n## 3.2 Linux\
    \ OS 与 Mac OS\n虽然 Linux 和 Mac 都是计算机硬件应用，但 Linux 是一个可以在任何设备上使用的开放操作系统，而 Mac 是只能在\
    \ Mac 设备上使用的操作系统。Linux 作为应用程序、运行其他程序的平台以及服务器单元工作。同时，Mac 是一个允许其他操作系统在其运行的操作系统。\n\
    \n### 硬件支持\nLinux 和 Mac OS 两个系统在该领域都很出色。由于 Mac OS 只用于苹果制造的硬件，因此它提供了健壮且集成良好的软件组合，为你提供最高性能。对于\
    \ Linux，它有很多驱动支持软件。以前，这是 Linux 可以提供的问题；不，我应该说；硬件制造商没有为其硬件在 Linux 系统提供驱动支持。但现在时机已经了。桌面或服务器设备上都有\
    \ Linux。现在所有主要零售商都为兼容的 Linux 发行版提供驱动，如 Windows OS。\n\n### 用户群体\n如果你愿意花很多钱并且想要一个准备好就用的系统，那么你会倾向于选择\
    \ Mac OS。这个程序将给你一个漂亮且酷炫的桌面环境。Mac OS 是初学者以及想要处理高质量音频、视频记录或图形设计的高级用户的优秀选择。如果你是 Linux\
    \ 世界的新手，去 Ubuntu、Linux Mint 或 Elementary OS，选择 Arch 或 Kali，如果你需要一个终端或命令行界面来工作。Linux\
    \ 提供了 Linux 界面作为主要工具。\n\n## 3.3 Linux OS 与 FreeBSD OS\nLinux 和 FreeBSD 都是开源系统，它们的许可证不同。FreeBSD\
    \ 在 Unix 操作系统多年后出现，并进行了修改。Linux 的开发是作为 `MINIX` 的替代品。BSD 许可证是 Linux 之间的主要差异。此外，由于各种相似性，Linux\
    \ 和 FreeBSD 可以共享多个工具和应用。\n\n### 许可证变体\nLinux 和 FreeBSD 的一些主要差异是：所有 Linux 发行版、Linux\
    \ 内核都是根据 GNU 许可证许可的。GNU GPL 几乎与 BSD 许可证相同，但它是左拷贝（copy-left）。任何人都可以轻松访问、共享或修改其源代码而无需重写。BSD\
    \ 许可证的成本完全取决于用户。Linux 是开放且免费的。\n\n### 基础差异\nLinux 和 FreeBSD 之间的主要差异是：Linux 的历史和程序谱系是另一个主要差异。Linus\
    \ Torvalds 开发了 Linux 内核取代了 `MINIX`，后者被禁止进一步研究。Linux 在许多方面与 Unix 不同。另一方面，FreeBSD\
    \ 与 Unix 有着紧密的关系。\n\n## 3.4 Linux 版本\n### Gentoo\nGentoo 是一个高度灵活的元发行版，允许用户使用身份验证软件。该项目由\
    \ Daniel Robbins 在 2000 年发布。尽管它提供了灵活性，但它需要技术来使用。换句话说，这对没有经验的用户来说并不友好，适应可能花费长时间。\n\
    \n### Arch Linux\nArch Linux 由 Judd Vinet 在 2002 年发布。最初它被视为处于用户和高级用户之间的独立项目。后来它使用了“滚动发布”设备。滚动发布意味着程序具有保持更新的能力。Arch\
    \ Linux 拥有出色的软件基础设施。可以从源代码安装软件。另一个误解是由于偶尔不稳定导致的风险。\n\n### Ubuntu\nUbuntu 为桌面用户转换\
    \ Linux。它已经有名很长时间了。它在 20 世纪初发布，并且在 Linux 用户中仍然流行。Ubuntu 基于 DEB 包。它有 Canonical\
    \ 的长期支持，现在也支持自己的服务器类型。Ubuntu 的一些特殊功能包括 Live DVD，支持新手可以轻松地使用 Ubuntu 和不同的桌面环境。Ubuntu\
    \ 最重要的问题之一是它的不兼容性。\n\n### MX Linux\nMX Linux 作为 MEPIS Linux 站点引入。这是为了个人和商业目的。MX\
    \ Linux 最受欢迎的功能是它的图形控制工具，被称为 MX-Tools。它还有不同的平台支持、不同的图形兼容性以及易于管理。MX Linux 可能没有\
    \ Mint 和 Ubuntu 那么友好。需要时间来适应它的安装程序，某些工具可能看起来不同。\n\n### Mint\nLinux Mint 于 2006\
    \ 年发布。基于 Ubuntu 开发。这种发行版最适合初学者。Mint 有各种增强功能使其易于使用。提供了与其他应用程序的交互。因此，它不仅适用于个人，也适用于商业使用。开发者提供三种类型的版本，即官方版、点版本（根据需要，例如错误修复）和每月总结版。这使得\
    \ Mint 更加稳定。\n\n### Kali\nKali Linux 用于系统安全和访问。Kali 是目前最流行的登录平台。这一切始于从 WHAX 集成\
    \ BackTrack（WHAX 是一个基于 Linux 的 Slax 发版）。背后的公司是 Offensive Security。之前的 WHAX 版本基于\
    \ Knoppix（称为 Whoppix）。BackTrack 5 基于 Ubuntu Lucid LTS。支持 ARM 的 32 位和 64 位格式。2013\
    \ 年，公司基于 Debian 重建了该平台并以 Kali 之名发布。Kali Linux 非常稳定且先进，具有其能力和一组先进的入门级工具。\n\n# 第\
    \ 4 章：开始学习 Linux\n学习 Linux 有许多理由。Linux 是一个基于 UNIX 的操作系统。作为专业人士，你一定会从 Linux 中获益。\n\
    \n## 4.1 为什么？\n### 学习很有趣\nLinux 阅读起来很有趣。如果你学到了新东西，不会感到惊讶。如果你有好奇心和有趣的性格，你会喜欢它提供的一切！\n\
    \n### 减轻钱包负担并省钱\nLinux 是一个使用开源的高效系统。这意味着你不需要为它支付任何费用。与 Windows 或任何付费应用相比。\n\n\
    ### 下载 Linux 并开始\n你需要的是一台可以运行 Linux 的机器，它甚至在旧电脑上也可以工作。不需要操作系统本身，下载 Linux。Linux\
    \ 生态系统很棒，你可以用它做任何你想的事！如果你正在使用 Linux，你可能不需要购买任何软件。开发者喜欢 Linux，他们找到了尝试新事物的场所。\n\n\
    ### 支持所有主要语言\n许多公司使用 Linux 作为主要语言来进行开发和部署。即使在 2019 年，这也意味着作为学生，你只需要学习 Linux。\n\
    \n### 在工作场所提高成功\nLinux 被视为开发的理想操作系统。如果你精通 Linux，你绝对会有收获。\n\n### 教会他人\n即使在 2019\
    \ 年，我们也有很大的需求来共享 Linux。这是你可以获得机会。\n\n## 4.2 获取访问权限\n以下是进入 Linux 的十种方式：\n\n###\
    \ 加入 Free Shell\n有很多人使用 free shell 比服务器还多的 Linux（记住“Linux 服务器”可以从任何笔记本电脑开始）。许多管理员使用带有\
    \ Linux 的 free shell 账户。如果你想花时间在终端上阅读指令、编写 `C++` 以及基础，这是一种简单的开始方法。\n\n### Freeshell.de\n\
    Freeshell.de 是一种在线访问方法，自 2002 年以来一直存在。你可以访问 `SSH`（为了尝试）、`OpenSSL`（基础）以及 `MySQL`\
    \ 数据库。\n\n### Blinkhell\nBlinkhell 提供了一个 Linux 终端来阅读 Unix，使用 `IRC`、托管简单的网站并共享文件。它自\
    \ 2006 年以来一直存在。Blinkhell 并不是 Linux。\n\n### SDF 社区访问\n现在，大家所知，Unix 系统是在 1987 年末建立的。`BSD`\
    \ 不是 Linux，但它是开源的。你通常可以通过特殊请求来参与活动。你可以使用特殊请求来对搜索引擎、编译器和高级语言感兴趣。\n\n### 下载 Linux\
    \ 到启动 U 盘\n在 USB 盘上管理 Linux，无论你去到哪里，都可以从该 U 盘启动你遇到的任何电脑。你可以获得一个自定义的 Linux 桌面，而不需要担心下载的细节。这不会影响你的\
    \ Linux OS，你的 Linux OS 也不影响电脑。适用于酒店、购物中心、学校或只是为了一个机会来启动 Linux。这种灵活性允许你选择以持久模式启动并将所有数据保存回驱动器，或者在临时模式下（一旦耗尽，一切都会消失）。有很多\
    \ Linux 发行版可以尝试，有些是低功率电脑的小型桌面。我偏于 `Porteus Linux`。\n\n### 如何使用\n从 USB 盘上重启“Linux\
    \ live”提供了完整的 Linux 发行版。现在，数据存储方式与你在硬盘上安装的系统略有不同，一切如你所预期的。\n\n### 在 Windows 上尝试\
