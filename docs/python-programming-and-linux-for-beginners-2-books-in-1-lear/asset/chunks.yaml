    \ is 69\nEnter your desired number : 68\nEntered value is 68\nEnter your desired\
    \ number : 76 …\nIt will be an infinite loop.\n```\n\n## Else with Python While\
    \ Loop\nPython empowers its developers to use the while loop with the while loop\
    \ inside it, as well. It executes the `else` square when the condition given in\
    \ the while articulation turns out to be false. Like for loop, on the off chance\
