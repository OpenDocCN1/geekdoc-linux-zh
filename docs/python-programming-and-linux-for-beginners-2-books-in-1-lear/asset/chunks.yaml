    ```\n\nOutput:\nWhen you execute this program, your console will print,\nEnter\
    \ your desired number\nLet’s say you entered “10”, as your number. Your console\
    \ will print,\n10 X 1 = 10\n10 X 2 = 20\n10 X 3 = 30\n10 X 4 = 40\n10 X 5 = 50\n\
    10 X 6 = 60\n10 X 7 = 70\n10 X 8 = 80\n10 X 9 = 90\n10 X 10 = 100\n```\n\n## Nested\
