    # 1.2 Python 基础


    在开始编写你的第一个 Python 程序（通常被称为 "Hello World"）之前，你必须学习 Python 语法的基础知识。在这一阶段，我们将讨论 Python
    编程的基础及其语法，这无疑将帮助你开启成为 Python 开发者的职业生涯。现在，让我们先编写最基础的 Python 程序。


    ## 编写你的第一个 Python 软件/程序


    Python 程序通常以两种不同的形式进行打印和编译：


    *   **交互模式**：程序员可以简单地在 Python 的交互模式下编写并正常编译 Python 程序。

    *   **脚本模式**：程序员必须预先以脚本方式执行其 Python 程序，这通常是一个以 `.py` 扩展的文件，并且已经保存在你的计算机上。


    让我们实际观察一下这两种方式。


    ### 交互模式下的 Hello World!


    你可以在终端（Terminal）的 Python 编程交互模式下输入以下命令来编写你的第一个程序。


    ```

    >>> $ Python

    ```


    如果你在终端中输入并执行了此命令，你现在处于 Python 的交互模式。另一方面，如果你正在使用 IDE 来进入 Python 的交互模式，则无需输入上述命令。以下是用于你第一个软件编译的基础
    Python 编程语法。第一个程序通常被称为 "Hello World!"，但我们将改变一下常规。我们将编写第一个“Hello to the Universe
    of Python!”（你好，Python 宇宙！）


    当你编写第一个程序并按下回车时，你的 IDE 应该显示 "Hello to the Universe of Python!"。你应该注意，括号中你写的内容“将写在你的
    IDE 上”。在我们的案例中，它是 Hello to the Universe of Python!


    语法：

    ```

    >>> print ("Hello to the Universe of Python!")

    ```

    输出：编译上述命令后，你将在执行屏幕上看到文本“Hello to the Universe of Python!”


    ### 脚本模式下的 Hello World!


    假设你已将“Hello to the Universe of Python!”项目保存为一个编写好的程序和 Python 文件，即 `.py` 文件。现在你可以在计算机上寻找
    `.py` 扩展的文件。假设你将项目保存为 `Hello to the Python.py`，以下是你的代码在 Python 脚本模式下的运行方式。


    你编写并保存的项目文件在开始必须是可用且可执行的。通常，程序员通过使用以下命令来实现这一点：


    ```

    >>> $ chmod +x test.py

    ```


    现在，如果你的文件可以运行并重复执行，你就可以在 Python 的脚本模式下运行并执行你的软件了。


    ```

    >>> $ Python Hello to the Python.py

    ```


    你可以看到终端或控制台上显示 "Hello to the Universe of Python!"，直到该命令结束。通过运行 "Hello to the Universe
    of Python!" 你掌握了第一个 Python 语法。


    ## Python 关键字和标识符


    Python 编程中总共有三十一个关键字和五个重要的标识符。在学习 Python 编程技能时，你可以快速熟悉标识符和关键字。


    *   **Python 标识符**：通常，Python 标识符是一个函数、模块、向量、类或其他内容。在 Python 编程中，你为对象分配一个名称，这被称为标识符。通常，正确的标识符以大写字母
    (A-Z)、小写字母 (a-z) 或下划线（`_`）开头。这些通常伴随着下划线、零、字母或数字（0 到 9）。


    Python 编程中有五种基本的标识符形式：

    1. 函数

    2. 模块

    3. 类

    4. 变量

    5. 对象


    我们应该看看 Python 语法中提供的关键字以便继续后续。


    *   **Python 语法关键字基础**：你必须打开 IDE 并输入以下命令来查看 Python 中所有的三十一个关键字。


    语法：

    ```

    >>> import keyword

    >>> keyword.kwlist

    ```

    输出：当你输入这些命令时，你的 IDE 将打印出关键字表：`[''False'', ''None'', ''True'', ''and'', ''as'',
    ''assert'', ''break'', ''class'', ''continue'', ''def'', ''del'', ''elif'', ''else'',
    ''except'', ''finally'', ''for'', ''from'', ''global'', ''if'', ''import'', ''in'',
    ''is'', ''lambda'', ''nonlocal'', ''not'', ''or'', ''pass'', ''raise'', ''return'',
    ''try'', ''while'', ''with'', ''yield'']`


    随着 Python 新版本的发布，这些列出的关键字可能会发生变化。现在，当使用 Python 作为编程语言时，还有几点你需要记住。存在特定的关键字，我们不能将它们作为标识符。


    *   在 Python 中，关键字是大小敏感的（通常如此）。

    *   关键字被称为保留字。


    ## Python 语句


    在我们继续 Python 语法的基本概念之前，你接下来需要记住的是“行”和“缩进”。在 Python 中，组织代码块或模块的主要支持手段是缩进。此外，它是强制执行的，这使得
    Python 代码具有可读性、易于扫描且可审查。我们必须注意，每种情况下缩进的空格数不同。我们需要观察以下代码来理解这一点。


    ```python

    >>> Person = ["David", "Jennifer", "Michael"]

    >>> for n in person:

    >>> if n == "David":

    >>> print(n)

    >>> else:

    >>> print("Not David")

    ```


    在以下代码中，你必须记住“for 语句”（即缩进）有一个空格，而“if 语句”有两个空格。


    在 Python 中，你以后也可以在一行内高效地声明多个语句。例如：


    ```python

    >>> Person = "David" ; age = 25 ; location = "NYC"

    ```


    ## 命令行参数


    在 `Hello to Python.py` 中以及交互模式下，我们简单地使用了命令行声明。因此，最好的方法是向你介绍命令行参数。这些是 Python 编程语法基础不可或缺的一部分，你可以阅读相关的相关内容。


    ## 如何创建虚拟环境


    对于任何新项目，虚拟环境将是你会创建的内容之一。在 Python 中，无需构建新的虚拟环境，你也可以在新项目上工作。然而，这样做可能会让你陷入一种局面：


    *   依赖项可能无法得到增强或优化。例如，Python 的默认版本可能没有更新（从 2.7 更新到 3.8）。


