    \n## 目录\n- 引言\n- 第 1 章：Python 入门\n    - 1.1 学习 Python 的步骤\n    - 1.2 Python 基础\n\
    - 第 2 章：Python 的基本属性\n    - 2.1 Python 的独特之处\n    - 2.2 Python 版本\n    - 2.3 Python\
    \ 的应用\n    - 2.4 安装 Python\n- 第 3 章：编译器、文本编辑器和 IDE\n    - 3.1 Python 编译器\n   \
