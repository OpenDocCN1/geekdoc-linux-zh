    \ in the same program.\n\nExample:\n```python\n>>> yourcode_str= 'v=10\\n w=15\\\
    n print(\"sum=\",v+w)'\n>>> yourcode=compile(yourcode_str, \"sum.py','exec')\n\
    >>> print(type(yourcode))\n>>> exec(yourcode)\n>>> exec(c)\n```\nOutput:\nsum\
    \ = 25\n\n## The `exec()` Function\n\nThe `exec()` function has a bit extra importance\
    \ within the built-in functions of Python. It runs the programs of python and\
    \ produces the output. Without this function, python programs cannot execute.\n\
    \nExample:\n```python\n>>> v = 12\n>>> exec('print(v==12)')\n>>> exec('print(v+4)')\n\
    ```\nOutput:\nTrue\n16\n\n## The `sum()` Function\n\nIn Python, when we work with\
    \ arithmetic operations while using numerical data, the `sum()` function becomes\
    \ inevitable. We use this function to perform addition of values available in\
    \ the list.\n\nExample:\n```python\n>>> v = sum([2, 5,4 ])\n>>> print(v)\n>>>\
    \ v = sum([4, 2, 4], 10)\n>>> print(v)\n```\nOutput:\n11\n20\n\n## The `any()`\
    \ Function\n\nThe `any()` function in Python provides the result or output in\
    \ Boolean type value which may be true or false. It prints true when there is\
