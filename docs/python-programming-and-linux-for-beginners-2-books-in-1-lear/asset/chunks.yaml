    to data management functions, such as the supporting media streaming. Now, Apple
    iOS and Google Android are examples of mobile apps.Embedded OSNot all computer
    devices are standard. Dozens of dedicated devices - including home-based digital
    assistants, automated reporting machines (ATMs), aircraft systems, sales terminals
    (POS), and Internet of Things (IoT) devices - including computers in need of an
    application. The big difference is that the compatible computing device does one
    big thing, so the OS is very fragile and dedicated to both performance and durability.
    The OS must be fast, uncluttered, and handle all bugs kindly in order to continue
    working in all conditions. In most cases, the OS is delivered to a chip installed
    on the basic device. If a medical device is to be used in a patient''s life support
    system, for example, will use an embedded OS that must operate reliably to keep
    the patient alive. Relating to this example, Embedded Linux is one example of
    an embedded Operating System.Network OSNetwork operating system (NOS) is another
    special OS that aims to facilitate communication between devices running on a
    local area network (LAN). The NOS provides the communication stack needed to understand
    network agreements in order to form, exchange, and decompose network packets.
    Today, the concept of a special NOS no longer works because some types of OS are
    more sensitive to network connectivity. Windows 10 and Windows Server 2019, for
    example, incorporate complete communication capabilities. The NOS concept is still
    used by other communication devices, such as routers, switches, and fire extinguishers,
    and manufacturers can use related NOSes, including Cisco Internetwork Operating
    System (IOS), RouterOS, and ZyNOS.Real-Time OSWhen a computer device must interact
    with the real world within continuous and recurring time constraints, the device
    maker may choose to use a real-time application (RTOS). For example, an industrial
    control system can regulate the operation of a fertile factory or power station.
