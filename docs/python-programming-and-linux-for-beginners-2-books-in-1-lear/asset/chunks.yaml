    # 5.3 Python 中的数据类型


    数据类型指定了一组可以应用于相关值的操作和值。例如，由于它有两个不同的值，灯泡开关可以类比为计算机系统；`True` 表示开启，`False` 表示关闭。由于灯泡开关只包含这两个值，我们可以认为它的大小为二。每转动一次开关，只有两种操作可以执行：


    - 我们可以将其开启

    - 我们可以将其关闭


    Python 中的因子（变量）可以携带不同类型的数据估值。Python 是一种构成日益复杂的计算机编程语言，因此，在声明和描述它们时，我们不需要描述所有变量的形式。`variables`（变量）将激励绑定到它们的类型。此外，Python
    允许开发者验证软件中使用的变量类型。Python 为我们提供了“种类）”（结构），它返回所传递的变量类型。为了表征各种数据类型的形式并验证它们的类型，你可以参考配套的指南。


    示例：

    ```python

    >>> C = 69

    >>> W = "Hi Python"

    >>> K = 17.5

    >>> print ( type (C));

    >>> print ( type (W));

    >>> print ( type (K));

    ```

    输出：

    当你输入命令 `>>> print ( type (C));` 时

    你的控制台将打印 `<type ''int''>`

    当你输入命令 `>>> print ( type (W));` 时

    你的控制台将打印 `<type ''str''>`

    当你输入命令 `>>> print ( type (K));` 时

    你的控制台将打印 `<type ''float''>`


    ## 标准数据类型


    Python 中的标识符可以承受不同的性质。例如，任何人的名字必须存储为字符串，而他的 ID 必须存储为整数。Python 为我们提供了各种标准数据类型，通过类型技术定义每一种类型。Python
    中通常使用的具有特征的数据类型命名如下：


    - 数字 (Numbers)

    - 字符串 (String)

    - 列表 (List)

    - 元组 (Tuple)

    - 字典 (Dictionary)


    我们现在通过以下示例来澄清其中一些。


    ### 数字

    数字作为数据类型，在 Python 中存储数值。每当将数字赋值给变量或标识符时，Python 会生成一个数值实体。


    示例：

    ```python

    >>> C = 79

    >>> W = 06

    ```

    在上述示例中，`c` 和 `w` 是数值对象。Python 支持四种不同的数值数据类型：


    - 整数 (`int`)

    - 长整数 (`long`)

    - 浮点数 (`float`)

    - 复数 (Complex)


    ### 字符串

    在 Python 中，字符串可以定义为由引号表示的字符序列。此外，为了描述序列，可以使用单引号、双引号或三引号。字符串的处理是一个简单、易理解且非常清晰的任务，因为
    Python 提供了几个内置函数和运算符来执行此任务。`+` 运算符用于 Python 中的字符串处理，用于拼接两个字符串，处理过程 `"Hello" +
    "Mr. David Robertson"` 返回 `"Hello Mr. David Robertson"`。此外，`*` 运算符通常被称为重复运算符，因为操作
    `"Object" * 2` 返回 `"Object Object"`。你可以通过以下示例理解 Python 中的字符串处理。


    示例：

    ```python

    >>> string1 = "Hi Mr. David Robertson"

    >>> string2 = "How are you"

    >>> print (string1 [0:2]) # 使用切片运算符打印前两个字符

    >>> print (string1 [4]) # 打印字符串的第 4 个字符

    >>> print (string1 * 2) # 打印两次字符串

    >>> print (string1 + string2) # 打印 string1 和 string2 的拼接

    ```

    输出：

    当你编写第一个命令并按回车时，即 `print (string1 [0:2])`，你的控制台将使用切片运算符打印字符串的前两个字符。因此，在这种情况下，你的控制台将打印
    `"Hi"`。

    当你编写第二个命令时，即 `print (string1 [4])`，你的控制台将打印字符串的第四个字符。因此，在这种情况下，你的控制台将打印 `"r"`。

    当你编写第三个命令并按回车时，即 `print (string1 * 2)`，你的控制台将打印两次你的字符串。因此，在这种情况下，你的控制台将打印 `"Hi
    Mr. David Robertson Hi Mr. David Robertson"`。

    当你编写第四个命令并按回车时，即 `print (string1 + string2)`，你的控制台将打印 `string1` 和 `string2` 的拼接。因此，在这种情况下，你的控制台将打印
    `"Hi Mr. David Robertson How are you"`。


    ### 列表

    在 Python 中，因为我们在 C 或 C++ 中使用数组，所以我们使用列表。但列表可以包含不同类型的数据。存储在列表中的项由逗号 `","` 分隔并括在方括号
    `[]` 中。切片运算符 `[:]` 可以访问列表的元素。加或拼接运算符 `+` 以及重复或乘运算符 `*` 对列表的操作与字符串相同。


    示例：

    ```python

    >>> l = [1.5, "Hello", "Python", 7]

    >>> print (l [3 :]);

    >>> print (l [0:2]);

    >>> print (l);

    >>> print (l + l);

    >>> print (l * 3);

    ```

    输出：

    当你编写第一个命令并按回车时，即 `print (l [3 :])`，你的控制台将打印 `[7]`。

    当你编写第二个命令时，即 `print (l [0:2])`，你的控制台将打印 `[1.5, ''Hello'']`。

    当你编写第三个命令时，即 `print (l)`，你的控制台将打印 `[1.5, ''Hello'', ''Python'', 7]`。

    当你编写第四个命令时，即 `print (l + l)`，你的控制台将打印 `[1.5, ''Hello'', ''Python'', 7, 1.5, ''Hello'',
    ''Python'', 7]`。

    当你编写第五个命令时，即 `print (l * 3)`，你的控制台将打印 `[1.5, ''Hello'', ''Python'', 7, 1.5, ''Hello'',
    ''Python'', 7, 1.5, ''Hello'', ''Python'', 7]`。


    ### 元组

    元组在 Python 中在许多方面与集合相似。元组中的项通常由逗号 `","` 分隔并括在括号 `()` 中。此外，机器本身无法更改元组的大小、值和数量。


    示例：

    ```python

    >>> t = ("Hello", "Python’s world", 69)

    >>> print (t [1 :]);

    >>> print (t [0:1]);

    >>> print (t);

    >>> print (t + t);

    >>> print (t * 3);

    >>> print (type (t))

    >>> t [2] = "hello";

    ```


