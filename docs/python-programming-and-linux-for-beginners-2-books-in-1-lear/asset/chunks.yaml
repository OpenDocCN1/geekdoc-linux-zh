    result = map(double, [1, 2, 3])\nprint(list(result))\n```\n\n## The `delattr()`\
    \ Function\n\nThe `delattr()` function is used to delete an attribute from an\
    \ object.\n\nExample:\n```python\nclass A: a = 10\nobj = A()\ndelattr(obj, 'a')\n\
    ```\n\n## The `divmod()` Function\n\nThe `divmod()` function returns the quotient\
