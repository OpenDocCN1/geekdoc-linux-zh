    # 1.2 Basics of Python


    Before you start writing your very first Python program, which is usually known
    as "Hello World," you have to learn the fundamentals of Python syntax. We''ll
    talk about the fundamentals of Python programming and its syntax at this point,
    which will certainly help you begin to create your career as a Python developer.
    Now let''s first compose the very fundamental Python program.


    ## Writing your First Python Software/Program


    Python programs may be printed and compiled, usually in two different forms:


    * **Interactive Manner**: A programmer can simply write and then normally compile
    a Python program in the interactive manner of Python.

    * **Scripting Manner**: A programmer has to execute his Python program first in
    a scripting manner, which is generally in a `.py` extension, which is already
    saved on your computer.


    Let''s have a look upon both of them, practically.


    ### Hello World! In Interactive Manner


    You can enter the command below in the interactive mode of Python programming
    in your Terminal to write your first program.


    ```

    >>> $ Python

    ```


    If you have entered this command on your terminal and execute it, you are now
    in Python''s interactive mode. On the other hand, there''s no need to type the
    above-mentioned command if you are using an IDE to get yourself into Python''s
    interactive mode. The following is the Basic Python programming syntax for your
    first software compilation. The first program is usually known as "Hello World!"
    but we''ll change the odds. We''ll be writing our first, "Hello to the Universe
    of Python!"


    When you write your first program and press enter, your IDE should show "Hello
    to the Universe of Python!" You should note that everything you write "will be
    written on your IDE" in parentheses. It is Hello to the Universe of Python! In
    our case.


    Syntax:

    ```

    >>> print ("Hello to the Universe of Python!")

    ```

    Output: After compiling the above-mentioned command, you will see a text on your
    execution screen, "Hello to the Universe of Python!"


    ### Hello World! In Scripting Manner


    Let''s say you saved your “Hello to the Universe of Python!” project as a written
    program and as a Python file, i.e., `.py` file. Now you can look for the `.py`
    extension file on your computer. Let’s say you saved your project as `Hello to
    the Python.py`, and here''s how your code functions in Python scripting mode.


    The project file you have written and saved must be usable and executable at the
    beginning. Usually, this is typically achieved by programmers using the command:


    ```

    >>> $ chmod +x test.py

    ```


    Now, you can run and execute your software in Python''s scripting mode if your
    file is running and re-executable.


    ```

    >>> $ Python Hello to the Python.py

    ```


    You can see "Hello to the Universe of Python!" written on your computer terminal
    or console until this command is terminated. You''ve mastered the first Python
    syntax by running "Hello to the Universe of Python!"


    ## Python Keywords and Identifiers


    There is a total number of thirty-one keywords and five important identifiers
    in Python Programming. Identifiers and keywords are something you can quickly
    get accustomed to when working on your programming skills in Python.


    * **Python Identifiers**: Usually, a Python Identifier is a function, a module,
    a vector, a class, or something else. You assign a name to an object in Python
    programming, and this is known as an identifier. Typically, either an uppercase
    letter (A-Z), a lowercase letter (a-z), or an underscore (`_`) starts with a correct
    identifier. These are usually accompanied by underscores, zeroes, letters, or
    numbers (from 0 to 9).


    There are five basic forms of identifiers in Python programming:

    1. Functions

    2. Modules

    3. Classes

    4. Variables

    5. Objects


    We should take a look at the keywords that are available in Python''s syntax to
    move forward.


    * **Python Syntax Keywords Basics**: You must open your IDE and enter the following
    command to see all thirty-one keywords in Python.


    Syntax:

    ```

    >>> import keyword

    >>> keyword.kwlist

    ```

    Output: Your IDE will print this table of keywords when you enter these commands,
    `[''False'', ''None'', ''True'', ''and'', ''as'', ''assert'', ''break'', ''class'',
    ''continue'', ''def'', ''del'', ''elif'', ''else'', ''except'', ''finally'', ''for'',
    ''from'', ''global'', ''if'', ''import'', ''in'', ''is'', ''lambda'', ''nonlocal'',
    ''not'', ''or'', ''pass'', ''raise'', ''return'', ''try'', ''while'', ''with'',
    ''yield'']`


    With any new version of Python, these keywords listed can change. Now, when working
    with Python as a programming language, there are a few more things that you should
    bear in mind. There are set keywords, and we can''t use them as our identifiers.


    * In Python, keywords are case sensitive. Usually.

    * Keywords are called reserved words.


    ## Python Statements


    Before we go on with the basic concepts of Python Syntax, the very next things
    you should bear in mind are Lines and Indentation. In Python, the primary support
    for organizing the code blocks or modules is indentation. In addition, it is rigidly
    implemented, making the Python code legible, scan-able, and reviewable. We must
    note that the space that goes with the indentation differs in each case. We need
    to observe the following code to comprehend this.


    ```python

    >>> Person = ["David", "Jennifer", "Michael"]

    >>> for n in person:

    >>> if n == "David":

    >>> print(n)

    >>> else:

    >>> print("Not David")

    ```


    In the following code, you must remember that there is one space in the "for the
    statement," i.e., indentation, and two spaces in the "if statement."


    In Python, you end a sentence when you finish a line using a semicolon (`;`).
    Going forward, you can also efficiently declare several statements in a single
    line in Python. For instance:


    ```python

    >>> Person = "David Robertson" ; age = 25 ; location = "NYC"

    ```


    ## Command Line Arguments


    In `Hello to Python.py`, and in an interactive manner, we simply used a command-line
    claim. So, the best way is to introduce you to the arguments of the command line.
    These are an integral part of the Python programming syntax basics that you can
    read about.


    ## How to Create a Virtual Environment


    For any new project, Virtual Environments will be one of those things you will
    make. In Python, without having to build new virtual Environments, you can also
    work on new projects. Doing so, however, will suggest that you would end up in
    a situation where


    * Dependencies may not be enhanced or optimized. For instance, the default version
    of Python may not be updated (from 2.7 to 3.8).

