- fmt: "\nEngineers! Do not include login `/select` or `/usr`/`location`! If you are\
    \ a program administrator, this section is not yours. This is an article for developers\
    \ and packages, making `Sysadmin's` life easier.\n\nThe `/opt` and `/usr`/`location`\
    \ indicators are used by sysadmins for files that do not have manual packages\
    \ (other than RPM) of the Software, precisely the uncontrolled openness in those\
    \ files. Note how this folder is categorized across the system.\n\nThe manual\
    \ installation process (excluding RPM, or based on a simple copy of the file)\
    \ is written in the forgotten text inside the drawer (if written), and in the\
    \ head of the person who installed the installation. When he goes to another job,\
    \ that inclusion becomes obvious to the whole team, and it is a time bomb.\n\n\
    With RPM it's different. RPM (or other package program) is the \"installation\
    \ process\" itself. Recorded in his database as well as pre- and post-installation\
    \ actions, which allow complete control. It changes the installation independently\
    \ of who did it, it changes the installation in the business process.\n\nInstallation\
    \ based on file management on `/opt` or `/usr`/`local` is far from providing organization,\
    \ system visibility and control provided by RPM. I would say that `/opt` and `/usr`/`local`\
    \ will expire when all softwares are made RPMized.\n\nIt is very important in\
    \ the evolution of Linux and mass production (especially on the desktop battle),\
    \ that engineers stop using these hints of hell, and start using FHS.\n\nProducts\
    \ that are fully integrated under one directory, use the engagement method, which\
    \ has several problems:\n* It forces the user to change natural variables such\
    \ as `$PATH` and `$LD_LIBRARY_PATH` to use your product easily.\n* Includes files\
    \ in unfamiliar areas, complex system integration, and future extensions for extensions\
    \ to your product.\n* Sysadmin may not have adjusted the disk space on these components,\
    \ which created problems during installation.\n\nIt is the only acceptable way\
    \ for a clean app, without the command line concept. That's why it's well received\
    \ in Windows.\n\nMany developers believe that the \"content\" approach allows\
    \ them to work with several versions of the same product, for testing purposes,\
    \ or whatever. Yes, admit it, for this reason or for any other good reason in\
    \ the world. But keep in mind that the goal of High Quality Software (or Commercial\
    \ Grade Software) should work for the end user, and not be easy for its developers\
    \ and testers. Invite yourself to visit an inexperienced user (but potential customer)\
    \ and watch him or her install your product.\n\nDeveloper, don't be afraid to\
    \ distribute your files according to FHS because RPM will keep an eye on them.\n\
    \nIf you have a business reason to allow a user to work with several versions\
    \ of your Product simultaneously (or for some other reason), create a portable\
    \ package, described in the Maximum RPM manual. Also, be aware of the consequences\
    \ of using this feature, described in this book.\n\n## 4.4 Basic Linux Commands\n\
    \nIn my opinion, you will be familiar with many operating systems as Windows and\
    \ Mac OS X. Linux is one of the most powerful operating systems in use today.\
    \ According to the latest figures from buyers of supercomputer TOP500, 'Linux\
    \ Now Power is 100% of the World's Top 500 Supercomputers'. Doesn't this bother\
    \ you?\n\nThe operating system is the soul and mind of computers and all modern\
    \ computer devices. It is Software that handles all hardware resources associated\
    \ with your desktop or laptop. In other words, an operating system controls the\
    \ connection between your `Software` and your hardware.\n\nLinux is so ubiquitous\
    \ that it is available on mobile phones, cars, refrigerators and Roku devices.\
    \ It uses most of the Internet and most computers. In fact, global stock exchanges\
    \ in several countries on Linux. Linux became a platform for deploying desktops,\
    \ servers, and embedded applications worldwide as it is one of the most reliable,\
    \ secure and powerful applications available.\n\n### Basic Linux instructions\n\
    \nNow, let's take a look at the 20 most important commands on Linux. Linux commands\
    \ are very sensitive so you need to be careful what you say.\n\n*   `ls` – If\
    \ you know windows you will know that the `dir` is used to filter the content\
    \ of the index. Some types may support color coding. The words in blue represent\
    \ the names of the references.\n*   `ls -l | more` – this helps to separate the\
    \ result so you can view page by page. Otherwise the list goes down very quickly.\
    \ You can always use `ctrl+c` to return to the command line.\n```\n$ ls -l file\
    \ name\n```\n*   `cd /var/log` – Change the current direction. Advanced slash\
    \ will be used on Linux. For example a Linux guide that comes with all kinds of\
    \ Linux. If you use `ls -I` you will be able to see many details of the content\
    \ in the index:\n    *   File\n    *   File associated permissions\n    *   File\
    \ owner\n    *   Group associated with the file\n    *   File size\n    *   Timestamp\n\
