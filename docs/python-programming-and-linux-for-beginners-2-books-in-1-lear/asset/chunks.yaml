  trans: "\n\n# for 循环\n关于 Python 中的 for 循环，其语法如下：\n\n```python\nfor iterating_variable\
    \ in sequence:\n    {statements}\n```\n\n示例：\n```python\nv=1\nnumber = int (input\
    \ (\"Enter your desired number:\")));\nfor v in range(1,11):\n    print(\"%d X\
    \ %d = %d\"% (number,v,number*v))\n```\n\n输出：\n当你运行此程序时，你的控制台将打印：\nEnter your\
    \ desired number\n假设你输入了“10”作为数字。你的控制台将打印：\n10 X 1 = 10\n10 X 2 = 20\n10 X 3 =\
    \ 30\n10 X 4 = 40\n10 X 5 = 50\n10 X 6 = 60\n10 X 7 = 70\n10 X 8 = 80\n10 X 9\
    \ = 90\n10 X 10 = 100\n```\n\n## 嵌套 for 循环\n在 Python 中，嵌套 for 循环是指将一个“for 循环”放在另一个“for\
    \ 循环”内部以执行多次。嵌套 for 循环的语法如下：\n\n```python\nfor iterating_variable1 in sequence:\n\
    \    for iterating_variable2 in sequence:\n        (block of statements)\n   \
    \ (Other statements)\n```\n\n示例：\n```python\nv = int(input(\"Enter your desired\
    \ number of rows\"))\nv,w=0,0\nfor v in range(0,n):\n    print ()\n    for w in\
    \ range(0,i+1):\n        print(\"*\",end=\"\")\n```\n\n输出：\n当你运行此程序时，你的控制台屏幕将打印：\n\
    Enter your desired number of rows\n假设你输入了“6”。它将打印：\n*********************\n```\n\
    \n## for 循环中的 else 语句\n`else` 语句是许多条件语句的重要组成部分。它也用于许多其他编程语言中满足某些条件。在 Python 中，`else`\
    \ 语句可以在“for 循环”内部执行。\n\n示例 - 1：\n```python\nfor v in range(0,8):\n    print(v)\n\
    else:\n    print(\"Excluding break statement therefore for loop completely exhausted.\"\
    );\n```\n\n输出：\n在这种情况下，你的控制台屏幕将打印：\n01234567\n由于没有 break，for 循环完全执行完毕\n```\n\n\
    示例 – 2：\n```python\nfor v in range(0,5):\n    print(v)\n    break;\nelse:\n  \
    \  print(\"for loop is exhausted now!\");\nprint (\"break statement is used therefore\
    \ loop gets broken\")\n```\n# `break` 语句停止了 `else` 语句的执行。\n输出：\n在这种情况下，你的控制台将打印：\n\
    0\nthe break statement is used therefore loop gets broken\n```\n\n## while 循环\n\
    通常情况下，while 循环负责确保只要已知条件为真，就执行一段代码。它通常用于无法预知迭代次数的情况。while 循环的语法如下。\n\n```python\n\
    while expression:\n    (statements)\n```\n`expression` 必须是任何产生真或假值的有效 Python 表达式。在这种情况下，`True`\
    \ 是任何非零值。\n\n示例 – 1：\n```python\nv=1\nwhile v<=11:\n    print(v);\n    v=v+1;\n\
    ```\n\n输出：\n在这种情况下，你的控制台将打印一个直到 11 的整数列表。\n1234567891011\n```\n\n## Python 中的无限\
    \ while 循环\n如果 while 循环提供的条件没有变为假，则 while 循环将永远不会结束，结果将导致无限死循环。为了获得 `True` 条件，我们在\
    \ while 循环中使用非零值，并使用零值来表示 `False` 条件。\n\n示例：\n```python\nvariable = 1\nwhile variable\
    \ != 2:\n    v = int(input(\"Enter your desired number :\"))\n    print (\"Entered\
    \ value is %d\"%(v))\n```\n\n输出：\n其结果将是：\nEnter your desired number : 6\nEntered\
    \ value is 67\nEnter your desired number : 69\nEntered value is 69\nEnter your\
    \ desired number : 68\nEntered value is 68\nEnter your desired number : 76 …\n\
    它将是一个无限循环。\n```\n\n## Python while 循环中的 else\nPython 允许开发者在 while 循环内部同样使用 while\
    \ 循环。当 while 语句中的给定条件变为假时，它执行 `else` 块。与 for 循环一样，如果 while 循环使用 `break` 语句打破，在这种情况下，`else`\
    \ 块将不会执行，而是会执行 else 块之后的语句。\n\n示例 - 1：\n```python\nv=1\nwhile v<=4:\n    print(v)\n\
    \    v=v+1;\nelse:\n    print(\"The while loop is broken\");\n```\n\n输出：\n在这种情况下，你的控制台将打印：\n\
    1234\nThe while loop is broken\n```\n\n示例 – 2：\n```python\nv=1\nwhile v<=5:\n\
    \    print(v)\n    v=v+1;\n    if(v==3):\n        break;\nelse:\n    print(\"\
    The while loop is broken\");\n```\n\n输出：\n在这种情况下，你的控制台将打印：\n12\n```\n\n# 第 7 章：Python\
    \ 函数与文件处理\nPython 函数和文件处理是 Python 编程中最重要的部分。没有这些功能，程序无法实现预期结果。\n\n### 7.1 Python\
    \ 中的函数\nPython 函数是高度实用的小型代码包，可以通过调用来执行特定任务。它们被用于程序中执行特殊角色。基本上，它们是封装在 `{}` 中的唯一语句。在\
    \ Python 中，你可以根据需要调用函数。\n\n### Python 函数的优点\n以下是 Python 函数的一些主要优点：\n\n- 通过函数，我们可以避免代码重复。通过一个语句即可调用整个函数。\n\
    - 具有可重用性，重用性是一个非常吸引人的特性。它们可以在程序中被多次调用。\n- 通过这些函数，可以将较大的程序分成多个函数。这提高了利用率。\n\n"
- fmt: "\n# Functions of Python\n\nThere are so many functions in the Python programming\
    \ language. They can be called from interpreter package to use in any program.\
    \ Without these functions, this Python has no attraction for the software community.\
    \ Nowadays, they are being used across the world to perform all major programming\
    \ tasks.\n\n## The `abs()` Function\n\nThis function is mainly used for numeric\
    \ values. It gives back an absolute value when we enter any integer in our program.\
    \ It is specifically for getting absolute values against one single argument.\
    \ Here are some examples of absolute numbers to understand the concept.\n\nExample:\n\
    ```python\n# int number\n>>> integer = -25\n>>> print(' abs value of -25 is',\
    \ abs(integer))\n# float number\n>>> float = -55\n>>> print('abs value of -55',\
    \ abs(float))\n```\nOutput:\nabs value of -25 is: 25\nabs value of -55 is: 55\n\
    \nThese results show how `abs()` function works.\n\n## The `bin()` Function\n\n\
    This function, `bin()`, returns the binary results of an integer. The binary output\
    \ has prefix `0b` at the start of value.\n\nExample:\n```python\n>>> n=20\n>>>\
    \ v= bin(n)\n>>> print(v)\n```\nOutput:\nIn this case, your console will print,\
    \ 0b2020\n\n## The `bool()` Function\n\nThis function gives an output in Boolean\
    \ type value by using truth testing methods. It is an essential built-in function\
    \ of Python. If there is any value input, the result is true; otherwise, it prints\
    \ false.\n\nExample:\n```python\n>>> v1=[5]\n>>> print(v1, 'is',bool(v1))\n>>>\
    \ v1= No-value\n>>> print(v1, 'is',bool(v1))\n```\nOutput:\n[5] is True\nNo-value\
    \ is False\n\n## The `bytes()` Function\n\nIn Python, the `bytes()` function is\
    \ very helpful to get object in bytes. It belongs to the command byte-array. Mostly,\
    \ Python programming professionals get help by generating objects through this\
    \ command.\n\nExample:\n```python\n>>> string= \"Hi Friend.\"\n>>> array= bytes(string,\
    \ 'utf-8')\n>>> print(array)\n```\nResults:\nHi Friend\n\n## The `callable()`\
    \ Function\n\nThe concerned function investigates and shows up True when an object\
    \ seems callable otherwise, it shows False. This function may save time by notifying\
    \ the user about the availability of an object with just a single command.\n\n\
    Example:\n```python\n>>> v= 12\n>>> print (callable(v))\n```\nOutput:\nFalse\n\
    \n## The `compile()` Function\n\nThis function, `compile()`, works on the source\
