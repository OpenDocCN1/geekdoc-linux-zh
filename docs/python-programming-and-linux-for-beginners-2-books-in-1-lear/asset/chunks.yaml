    # 第 2 章：Python 的基本属性

    到目前为止，我们拥有的编程语言数量几乎可以用手指数得过来。编程语言如此多，每种计算机编程语言都有其独特的特点。这些特性使一种语言区别于其他语言。


    最后，由于该语言的特性，某种语言可能会被转换或被用于更广泛的项目。因此，在开始学习 Python 概念之前，让我们看看 Python 的功能、独特性应用等。在接下来的章节中，你将学习
    Python 的基本概念、特性、应用和架构，这使其与其他许多语言相比是独特且强大的。


    ## 2.1 Python 的独特特性

    让我们从 Python 的一些独特特性开始。


    ### 易于理解和编码

    当我们用“简单”或“容易”一词来描述 Python 编程时，必须从一个非常不同的背景来看待。我们之前读过 Python 语言是一门高级语言语言。大多数情况下，通过非常少的关键字和标识符，你会发现
    Python 代码与英语相似。任何程序员甚至非程序员都能通过观察代码看出这段代码的作用。


    然而，Python 是动态类型类型，这需要缩进。这一功能使得 Python 代码更加稳定且易于理解。此外，在写完我们的第一个程序后，我们可以发现在 Python
    中编写代码是毫不费力的。我们可能会发现与其他编程语言相比，Python 代码更容易编写。在短短几个小时内，有编程背景的人就能学会 Python 语法。然而，要成为精通其原理、模块和包的
    Python 大师还需要一些时间。换句话说，我们可以说 Python 是一门对开发者友好的语言。


    ### 开源且免费

    首先，你会知道 Python 是免费的，并且在许多平台上可用。它的官方网站是下载和安装 Python 最可靠来源，即 `https://www.python.org/`。


    第二点是，Python 是一门开源编程语言。开源确保公众可以随时访问 Python 的源代码。即使是非专业人士也可以下载、修改、使用和分发 Python。这类软件或语言通常被称为“FLOSS（自由、许可和开源软件）”。所有的
    Python 开发者都在 Python 世界中为了一个共同的目标努力，即增强 Python 及其功能。Python 为此已将源代码变为了开源代码。


    ### 高级语言

    从书的开始，我们一直在讨论这样一个观点，即 Python 是一门高级计算机编程语言。作为开发者，你不需要思考或回忆你的计算机或设备的设计。你用 Python
    编写的代码可以在全球任何程序、机器或系统中使用。你也不需要关心系统的内存。这一功能使得在 Python 中编写和编码变得更容易。因此，我们可以像之前描述的那样将
    Python 称为“开发者友好的语言”。


    ### 可移植语言

    对于你面向 Windows 系统的计算机，假设你构建了一个 Python 程序或应用程序。假设你只想在面向 MAC 系统的计算机上运行该程序。现在，你不需要对
    Python 代码进行太多的改进。你可以从面向 Windows 系统的计算机上获取 Python 代码并在任何 MAC 机器上运行它。因此，如果你使用 Python，就不需要为不同的工具或操作系统编写不同的代码。
    这种 Python 特性使得我们的语言——一种极具移植性的编程语言变得非常重要。在这方面你只需要记住一点，并且避免任何依赖于系统的函数。


    ### 解释型语言

    如果你已经是 C++ 或 Java 或其他编程语言的开发者，或者熟悉编程语言，你需要意识到必须先编译代码。然后它才能运行或执行任务。但当你选择 Python
    作为编程语言时，你的代码最初不需要编译。Python 将设备内的源代码转换为即时类型，即字节码（byte-code）。


    换句话说，无需担心连接相关的库或其他任何其他大事，你就可以运行用 Python 编写的源代码。当你的计算机或单元读取你的 Python 代码时，你可以发现源代码是逐行执行的，而不是一次性执行所有代码。这种
    Python 功能使得调试你的 Python 代码变得更简单。另一方面，翻译确实让 Python 比 Java 等其他语言慢一点，但与 Python 的优点相比，这并不重要。


    ### 支持面向对象范式的语言

    我们从一开始就在讨论这个观点，即 Python 可以重塑现实世界，正因如此，它是一门面向对象范式的编程语言。它关注对象，并将数据及其功能放在一起。与此相反，任何面向过程语言的函数是可以重复使用的代码。Python
    是一门既支持面向过程编程又支持面向对象范式的语言，这一特性使得 Python 成为最特殊的编程语言。此外，与 Java 相比，Python 是在单文件中支持多继承的语言。


    ### 可扩展语言

    假设你是其他语言的开发者。你需要编写 Python 代码来使用其他语言（如 C++）的命令。这种 Python 特性使其成为一门非常可扩展的编程语言，这意味着它可以扩展包含其他语言。


    ### 嵌入式语言

    在上一个阶段，我们已经提到其他语言的代码也可以被我们的源代码所接受。你也可以将 Python 代码引入到其他语言（如 C++）的源代码中。这有助于我们把其他语言的脚本能力整合到我们的代码中。


    ### 更大的标准库

    通过更全面的包，它提供了更丰富的功能。在许多应用程序中，你可以看到创建 Python 图形用户界面（GUI）。


