    # Scikit-Learn


    Scikit-learn 通过 Python 中一种一致的接口提供了一系列监督和无监督学习算法。它在宽松的重新发行 BSD 许可证下授权，并发布在许多 Linux
    发行版中，适用于学术和商业用途。该库基于 `SciPy`（科学 Python），在在使用 `sci-kit-learn` 之前必须先安装它。


    有几个 Python 库提供了机器学习算法范围的强力实现。其中最广为人知的是 `Scikit-Learn`，它是一个提供了许多基础算法的高效实现包。`Scikit-Learn`
    的特点是拥有完美、统一且精简的 API，以及极其有用且内容详尽的在线文档。这种一致性带来的优势在于，一旦你理解了某类模型 `Scikit-Learn` 的基本用法和语言结构，切换到另一个模型或算法就会变得非常直接。


    毫无疑问，Python 中最复杂的领域是机器学习和预测性。而这些领域最好的库就是 `Scikit-Learn`，它基本上自称为“Python 时代的机器学习”。`Scikit-Learn`
    拥有许多技术，基本上涵盖了你在数据科学职业前几年可能需要的所有内容：回归策略、分类策略和聚类，以及模型评估和模型选择。这个流行的库用于数据科学中的人工智能，涉及不同的回归、排序和聚类算法，提供了支持向量机、朴素贝叶、梯度提升和逻辑回归。`SciKit`
    旨在与 `SciPy` 和 `NumPy` 协同工作。


    ### 特性：

    - 能够从图像和文本中提取特征

    - 可以在多个场景中重复使用


    # Scipy


    存在 `scipy` 库和 `scipy` 栈。大多数库和包都是 `scipy` 栈的一部分（用于 Python 中的逻辑处理）。其中一个部分就是 `scipy`
    库，它为数值计划（AI 模型背后的数学内容）提供了高效答案。这些包括集成、导入、优化等。`Scipy` 为 `Scikit-learn` 中不可预测的 AI
    提供了核心科学策略。


    这是一个开源库，用于注册不同的模块，例如图像处理、连接、插入、特殊功能、增强、线性代数、傅里叶变换、聚类以及许多不同的任务。该库与 `NumPy` 一起用于执行高效数值计算。


    ### 特性：

    - 轻松处理数学操作

    - 使用子模块提供高效且快速的数值程序，如数值积分和优化

    - 支持信号处理


    # TensorFlow


    任何从事使用 Python 的 AI 机器学习任务的人都至少听说过 `TensorFlow`。它由 Google 开发，是一个开源的代表性数学库，利用数据流图进行数值计算。普通
    `TensorFlow` 数据流图中的科学活动由图节点表示。图的边，则代表在图节点之间流动的多维数据表示，即 `Tensors`（张量）。


    `TensorFlow` 采用了一种灵活的设计。它允许 Python 工程师将计算传送到工作站、手机手机或服务器中的一个或多个 CPU 或 GPU 上，而无需修改代码。在
    `TensorFlow` 中创建的所有库都是用 `C` 和 `C++` 编写的广泛使用的 Google 产品如 Google Photos 和 Google
    语音搜索都是使用 `TensorFlow` 构建的。该库为 Python 提供了一个复杂的前端。Python 代码将被编译，然后在 `TensorFlow`
    提供的执行引擎上运行。


    ### 特性：

    - 允许训练各种神经网络并使用许多 GPU，使得模型在大规模框架下极其高效

    - 可在 CPU 和 GPU 上轻松训练以进行分布式计算

    - 操作的灵活性，这意味着 `TensorFlow` 提供了提取你需要的部分并留下你不需要部分的选择

    - 高级别的网络和设计支持

    - 与其他数据科学 Python 库不同，`TensorFlow` 改进了想象图中每一个部分的方法


    # Keras


    它被认为是最酷的 AI（算法）Python 库之一；`Keras` 为神经网络的通信提供了一个更简单的工具。它还具有用于累积模型、准备数据集、可视化图表等的强大的实用工具。`Keras`
    用 Python 编写，可以在 `CNTK`、`TensorFlow` 和 `Theano` 上运行。这个 Python AI 库的创建核心重点是允许快速实验。所有的
    `Keras` 模型都是紧凑的。与其他 Python AI 库相比，`Keras` 是非常轻量。这是因为它先利用后端框架创建一个计算图，然后使用该图来执行操作。`Keras`
    在进行创新性研究时非常有表现力且灵活。


    ### 特性：

    - 完全基于 Python，使其更容易调试和调查

    - 本质上是模块化的。

    - 神经网络模型可以组合以构建日益复杂的模型

    - 在 CPU 和 GPU 上均可运行

    - 支持几乎所有的神经网络模型，包括卷积、嵌入、全连接、池化和循环。


    # Seaborn


    `Seaborn` 本质上是一个 Python 的数据可视化库，基于 `Matplotlib` 库。此外，它与 `Pandas` 数据结构紧密集成。这个 Python
    数据可视化库提供了一个高级接口来绘制美观且实用的统计图。


    `Seaborn` 的主要点是将可视化成为研究和获取信息的不可或缺的一部分。它的数据集的绘图功能作用于包含整个数据集的帧和边缘。该库非常适合检查多个因素之间的关系。`Seaborn`
    内部处理了创建教育性图表的所有重要语义映射和测量数据收集。Python 数据可视化库还具有在调色板之间选择的设备，有助于发现数据集中的设计。


    ### 特性：

    - 自动估计以及直接回归模型的绘制

    - 轻松查看复杂数据集的总体结构

    - 使用高级判断简化构建复杂的表示法

    - 可视化二变量或单变量分布的选择

    - 对清晰词汇的专门支持


    # Natural Language Toolkit (NLTK)


    它是常用自然语言处理和设计识别任务的有价值工具，可用于创建智能模型、分词、标记、思考以及有助于 AI 应用的其他任务。


    ### 特性：

    - 自带一个语言结构标记器

    - 支持词法分析


