  \n### 示例 - 1\n打开 Python 控制台或 IDE 并编写声明变量的命令。\n```python\n>>> n=v=w=987\n>>> print\n\
  >>> print (n, v, w)\n```\n输出：\n当你输入 `print` 变量值的命令时，输出将如下所示。\n```python\n>>> 987,\
  \ 987, 987\n```\n\n### 示例 – 2\n```python\n>>> n, v, w = 987, 876, 765\n>>> print\n\
  >>> print (n)\n>>> print (v)\n>>> print (w)\n```\n输出：\n对于输出，当你输入命令 `print (n)` 时，你的控制台将打印\
  \ `\"987\"`。当你输入命令 `print (v)` 时，控制台将打印 `\"876\"`。当你输入命令 `print (w)` 时，控制台将打印 `\"\
  765\"`。\n\n### 5.2 Python 中的运算符\n一般来说，运算符是语言特有的语法标记，需要执行某些操作。运算符主要源于数学原理。例如，`\"\
  乘法符号 (*)\"` 是一个 Python 编程运算符。它用于两个数字的乘法。\n\n在 Python 中，运算符表示为函数的符号表示，为了实现某些真实且理想的结果，在两个操作数之间执行特定操作。在单个计算机编程语言中，运算符被视为软件运行的基石。Python\
  \ 提供的运算符选择被视为一种追求。为了执行基本操作，这里是一些被广泛使用的运算符：\n\n*   算术运算符\n*   比较运算符\n*   赋值运算符\n\
  *   逻辑运算符\n*   位运算符\n*   成员运算符\n*   标识符运算符\n\n在本书的这一部分中，我们将讨论上述提到的的部分运算符。\n\n###\
  \ 算术运算符\n为了得到所需的结果，算术运算符用于执行复杂的算术运算。在这种情况下取两个操作数，通过运算符在它们之间执行操作，产生某些所需的、唯一的且绝对的值。以下是\
  \ Python 中广泛使用且重要实用的算术运算符。\n\n*   加法 `\"+\"`\n*   减法 `\"-\"`\n*   除法 `\"/\"`\n*\
  \   乘法 `\"*\"`\n*   取模 `\"%\"`\n\n这些运算符的详细定义：\n\n### 加法 `\"+\"`\n该运算符用于两个操作数之间执行加法或求和操作。\n\
  示例代码：\n```python\n>>> n, v = 25, 25\n>>> n + v\n```\n在这种情况下，你的控制台将打印 `\"50\"`。\n\
  \n### 减法 `\"-\"`\n该运算符取第一个操作数，并从第一个中减去第二个。\n示例代码：\n```python\n>>> n, v = 25, 25\n\
  >>> n - v\n```\n在这种情况下，你的控制台将打印 `\"0\"`。\n\n### 除法 `\"/\"`\n该操作数获取第二个操作数并将第二个操作数除以第一个操作数，并根据你的性能给出商。\n\
  示例代码：\n```python\n>>> n, v = 6, 2\n>>> n / v\n```\n在这种情况下，你的控制台将打印 `\"3.0\"`。\n\n\
  ### 乘法 `\"*\"`\n如前所述，该运算符在第一个操作数和第二个操作数之间执行乘法操作。\n示例代码：\n```python\n>>> n, v = 6,\
  \ 3\n>>> n * v\n```\n在这种情况下，你的控制台将打印 `\"18\"`。\n\n### 取模 `\"%\"`\n该运算符负责除法服务，并接收余数作为产出。\n\
  示例代码：\n```python\n>>> c, w = 4, 2\n>>> c % w\n```\n在这种情况下，你的控制台将打印 `\"0\"`。\n\n\
  ### Python 的比较运算符\n当我们谈论 Python 时，比较运算符用于比较两个操作数并分别返回一个布尔类型，即 TRUE 或 FALSE。\n\n\
  *   `==` : 真实：当且仅当值在逻辑上相等且有效时，才使用此运算符。\n*   `!=` : 真实：当值准确但不相等时，使用此运算符。\n*   `<=`\
  \ : 真：当第一个操作数小于或等于第二个操作数时，使用此运算符。\n*   `>=` : 真：当第一个操作数大于或等于第二个操作数时，使用此运算符。\n* \
  \  `<>` : 真实：当值不等时不使用此运算符。\n*   `>` : 真：当第一个操作数大于第二个操作数时，使用此运算符。\n*   `<` : 真：当第一个操作数小于第二个操作数时，使用此运算符。\n\
  \n### Python 的赋值运算符\n在 Python 中，赋值运算符用于将右侧赋值给左侧。\n\n*   `=` : 此运算符用于将右侧的值赋值给左侧。\n\
  *   `+=` : 将右侧的操作数加到左侧操作数上。\n示例代码：\n```python\n>>> n, v = 4, 2\n>>> n += v\n>>>\
  \ n\n```\n在这种情况下，你的控制台将打印 `\"6\"`。\n*   `-=` : 从左侧操作数减去右侧的操作数。\n示例代码：\n```python\n\
  >>> n, v = 4, 2\n>>> n -= v\n>>> n\n```\n在这种情况下，你的控制台将打印 `\"2\"`。\n*   `*=` : 将左侧操作数乘以右侧的操作数。\n\
  示例代码：\n```python\n>>> n, v = 4, 2\n>>> n *= v\n>>> n\n```\n在这种情况下，你的控制台将打印 `\"8\"\
  `。\n*   `%=` : 该运算符负责将左侧操作数除以右侧操作数并取余数。\n示例代码：\n```python\n>>> n, v = 4, 2\n>>>\
  \ n %= v\n>>> n\n```\n在这种情况下，你的控制台将打印 `\"0\"`。\n\n### Python 中的逻辑运算符\n我们还需要根据逻辑事实（即真或假）来做出决策，正如我们在现实生活中所做。例如，如果有人打电话问你“你在家吗？”你有两个选择：“是的，我在家”或“不，我不在”。在编程中，这对应\
  \ 0（假）和 1（真）。这被认为是合理的。\n\n在 Python 中，为了实现这些独特的选项，逻辑运算符用于测试表达式。这些运算符对于任何逻辑编写都非常有用。为了更好地理解这些运算符，以下是逻辑运算符列表及其简要描述。\n\
  \n### 与运算符\n如果表达式 `C` 有效且表达式 `W` 也为真，则结果是正确的。在任何其他情况下，结果都是错误的。\n此表可以帮助你更好地理解“与运算符”。\n\
  \n| C | W | C and W |\n|---|---|---|\n| True | True | True |\n| True | False | False\
  \ |\n| False | True | False |\n| False | False | False |\n\n### 或运算符\n当且仅当两个操作数都为假时，才会导致假。假设表达式\
  \ `C` 为真，另一个表达式 `W` 为假，那么结果将是有效的/真。\n此表可以帮助你更好地理解“或运算符”。\n\n| C | W | C or W |\n\
  |---|---|---|\n| True | True | True |\n| True | False | True |\n| False | True |\
  \ True |\n| False | False | False |\n\n\n\n\n\n### 5.3 Python 中的数据类型\n\n数据类型指定了一组可以应用于相关值的操作和值。例如，由于它有两个不同的值，灯泡开关可以类比为计算机系统；`True`\
  \ 表示开启，`False` 表示关闭。由于灯泡开关只包含这两个值，我们可以认为它的大小为二。每转动一次开关，只有两种操作可以执行：\n\n- 我们可以将其开启\n\
  - 我们可以将其关闭\n\nPython 中的因子（变量）可以携带不同类型的数据估值。Python 是一种构成日益复杂的计算机编程语言，因此，在声明和描述它们时，我们不需要描述所有变量的形式。`variables`（变量）将激励绑定到它们的类型。此外，Python\
  \ 允许开发者验证软件中使用的变量类型。Python 为我们提供了“种类）”（结构），它返回所传递的变量类型。为了表征各种数据类型的形式并验证它们的类型，你可以参考配套的指南。\n\
  \n示例：\n```python\n>>> C = 69\n>>> W = \"Hi Python\"\n>>> K = 17.5\n>>> print ( type\
  \ (C));\n>>> print ( type (W));\n>>> print ( type (K));\n```\n输出：\n当你输入命令 `>>> print\
  \ ( type (C));` 时\n你的控制台将打印 `<type 'int'>`\n当你输入命令 `>>> print ( type (W));` 时\n\
  你的控制台将打印 `<type 'str'>`\n当你输入命令 `>>> print ( type (K));` 时\n你的控制台将打印 `<type 'float'>`\n\
  \n### 标准数据类型\n\nPython 中的标识符可以承受不同的性质。例如，任何人的名字必须存储为字符串，而他的 ID 必须存储为整数。Python 为我们提供了各种标准数据类型，通过类型技术定义每一种类型。Python\
  \ 中通常使用的具有特征的数据类型命名如下：\n\n- 数字 (Numbers)\n- 字符串 (String)\n- 列表 (List)\n- 元组 (Tuple)\n\
  - 字典 (Dictionary)\n\n我们现在通过以下示例来澄清其中一些。\n\n### 数字\n数字作为数据类型，在 Python 中存储数值。每当将数字赋值给变量或标识符时，Python\
  \ 会生成一个数值实体。\n\n示例：\n```python\n>>> C = 79\n>>> W = 06\n```\n在上述示例中，`c` 和 `w` 是数值对象。Python\
  \ 支持四种不同的数值数据类型：\n\n- 整数 (`int`)\n- 长整数 (`long`)\n- 浮点数 (`float`)\n- 复数 (Complex)\n\
  \n### 字符串\n在 Python 中，字符串可以定义为由引号表示的字符序列。此外，为了描述序列，可以使用单引号、双引号或三引号。字符串的处理是一个简单、易理解且非常清晰的任务，因为\
  \ Python 提供了几个内置函数和运算符来执行此任务。`+` 运算符用于 Python 中的字符串处理，用于拼接两个字符串，处理过程 `\"Hello\"\
  \ + \"Mr. David Robertson\"` 返回 `\"Hello Mr. David Robertson\"`。此外，`*` 运算符通常被称为重复运算符，因为操作\
  \ `\"Object\" * 2` 返回 `\"Object Object\"`。你可以通过以下示例理解 Python 中的字符串处理。\n\n示例：\n```python\n\
  >>> string1 = \"Hi Mr. David Robertson\"\n>>> string2 = \"How are you\"\n>>> print\
  \ (string1 [0:2]) # 使用切片运算符打印前两个字符\n>>> print (string1 [4]) # 打印字符串的第 4 个字符\n>>>\
  \ print (string1 * 2) # 打印两次字符串\n>>> print (string1 + string2) # 打印 string1 和 string2\
  \ 的拼接\n```\n输出：\n当你编写第一个命令并按回车时，即 `print (string1 [0:2])`，你的控制台将使用切片运算符打印字符串的前两个字符。因此，在这种情况下，你的控制台将打印\
  \ `\"Hi\"`。\n当你编写第二个命令时，即 `print (string1 [4])`，你的控制台将打印字符串的第四个字符。因此，在这种情况下，你的控制台将打印\
  \ `\"r\"`。\n当你编写第三个命令并按回车时，即 `print (string1 * 2)`，你的控制台将打印两次你的字符串。因此，在这种情况下，你的控制台将打印\
  \ `\"Hi Mr. David Robertson Hi Mr. David Robertson\"`。\n当你编写第四个命令并按回车时，即 `print\
  \ (string1 + string2)`，你的控制台将打印 `string1` 和 `string2` 的拼接。因此，在这种情况下，你的控制台将打印 `\"\
  Hi Mr. David Robertson How are you\"`。\n\n### 列表\n在 Python 中，因为我们在 C 或 C++ 中使用数组，所以我们使用列表。但列表可以包含不同类型的数据。存储在列表中的项由逗号\
  \ `\",\"` 分隔并括在方括号 `[]` 中。切片运算符 `[:]` 可以访问列表的元素。加或拼接运算符 `+` 以及重复或乘运算符 `*` 对列表的操作与字符串相同。\n\
  \n示例：\n```python\n>>> l = [1.5, \"Hello\", \"Python\", 7]\n>>> print (l [3 :]);\n\
  >>> print (l [0:2]);\n>>> print (l);\n>>> print (l + l);\n>>> print (l * 3);\n```\n\
  输出：\n当你编写第一个命令并按回车时，即 `print (l [3 :])`，你的控制台将打印 `[7]`。\n当你编写第二个命令时，即 `print (l\
  \ [0:2])`，你的控制台将打印 `[1.5, 'Hello']`。\n当你编写第三个命令时，即 `print (l)`，你的控制台将打印 `[1.5, 'Hello',\
  \ 'Python', 7]`。\n当你编写第四个命令时，即 `print (l + l)`，你的控制台将打印 `[1.5, 'Hello', 'Python',\
  \ 7, 1.5, 'Hello', 'Python', 7]`。\n当你编写第五个命令时，即 `print (l * 3)`，你的控制台将打印 `[1.5,\
  \ 'Hello', 'Python', 7, 1.5, 'Hello', 'Python', 7, 1.5, 'Hello', 'Python', 7]`。\n\
  \n### 元组\n元组在 Python 中在许多方面与集合相似。元组中的项通常由逗号 `\",\"` 分隔并括在括号 `()` 中。此外，机器本身无法更改元组的大小、值和数量。\n\
  \n示例：\n```python\n>>> t = (\"Hello\", \"Python’s world\", 69)\n>>> print (t [1 :]);\n\
  >>> print (t [0:1]);\n>>> print (t);\n>>> print (t + t);\n>>> print (t * 3);\n>>>\
  \ print (type (t))\n>>> t [2] = \"hello\";\n```\n\n# 6: Python 中的正则表达式、表达式语句、循环\n\
  \n与其他编程语言一样，Python 也拥有正则表达式、表达式语句和循环。但 Python 的表达式和循环是独特的，是 Python 编程的。所有这些方法、函数、循环和语句在构建高效程序以及执行其他任务时都起着至关重要的作用。Python\
  \ 库中这些操作运行器的添加和更新有很多原因。\n\n### 6.1 Python 的正则表达式\n\nPython 中的正则表达式也称为 regex。regex\
  \ 用于分析字符串中的模式。有许多正则表达式功能可以继承、调用或导入以使用。为了导入这些函数，可以使用命令 `>>> import.re`。\n\n### 正则函数\n\
  \n- **Split 函数**: 用于拆分所需的字符串。\n- **Sub 函数**: 我们使用 sub 来替换字符串中的匹配项。\n- **Match**:\
  \ Match 在 Python 中评估正则表达式并返回布尔类型结果，即 True 或 False。\n- **Findall**: Findall 在 Python\
  \ 中用于恢复字符串中的所有匹配项。\n- **Search**\n\n[/content] 修正\n\n\n搜索用于在字符串中查找所有匹配项。\n\n###\
  \ 6.2 Python 的语句表达式\n\n标记 `=`；“等号”用于表示赋值语句。在 Python 的语法结构和方言中，赋值语句的工作方式与其他主要的计算机编程语言和方言不同，而这一基础系统（考虑到\
  \ Python 因子形式的理念）揭示了 Python 语言的许多不同特性。\n\n如果我们认为 C 编程语言中考虑此任务，它将是，比如 `v = 2`，这意味着有一个名为\
  \ `\"v\"` 的复合变量，它具有数值为 `2` 的副本。在这种情况下，右侧或值被复制到一个用于赋值的存储区域中，左侧的变量名是该区域的标识性位置。分配给变量\
  \ `\"v\"` 的内存足够容纳该特定类型。\n\n在 Python 任务最明确实例中，让我们使用一个非常相似的模型 `v = 2`，意味着“（非排他的）名称\
  \ `v` 获取了指向不同的、逐步赋值的、值为 `2` 的数值或整数 `int` 类型对象的引用”。在这里，我们将讨论 Python 在例中使用的基本语句。\n\
  \n### If 语句\n\n在 Python 中，`if` 语句限制性地执行一段代码，并带有 `else` 和 `elif`（它是 `else-if` 的压缩形式）。\n\
  \n### For 语句\n\n在 Python 中，`for` 语句强调迭代。它将每个元素捕获到一个相邻的因子中，供后续代码块使用。\n\n### While\
  \ 语句\n\n在 Python 中，`While` 语句只要其条件有效，就会执行一段代码。\n\n### Try 语句\n\n在 Python 中，`try`\
  \ 语句允许在其各自和相关的代码块中提出的某些特殊情况被 `except` 要求所捕获并处理；这同样保证了 `try` 和 `finally` 块中的清理代码将始终运行，而不论代码块是如何退出的。\n\
  \n### Raise 语句\n\nPython 使用 `raise` 语句来抛出指定的异常或重新抛出许多特殊情况。\n\n### Import 语句\n\n\n\
  ...\n\n\n\n### for 循环\n关于 Python 中的 for 循环，其语法如下：\n\n```python\nfor iterating_variable\
  \ in sequence:\n    {statements}\n```\n\n示例：\n```python\nv=1\nnumber = int (input\
  \ (\"Enter your desired number:\")));\nfor v in range(1,11):\n    print(\"%d X %d\
  \ = %d\"% (number,v,number*v))\n```\n\n输出：\n当你运行此程序时，你的控制台将打印：\nEnter your desired\
  \ number\n假设你输入了“10”作为数字。你的控制台将打印：\n10 X 1 = 10\n10 X 2 = 20\n10 X 3 = 30\n10 X\
  \ 4 = 40\n10 X 5 = 50\n10 X 6 = 60\n10 X 7 = 70\n10 X 8 = 80\n10 X 9 = 90\n10 X\
  \ 10 = 100\n```\n\n### 嵌套 for 循环\n在 Python 中，嵌套 for 循环是指将一个“for 循环”放在另一个“for 循环”内部以执行多次。嵌套\
  \ for 循环的语法如下：\n\n```python\nfor iterating_variable1 in sequence:\n    for iterating_variable2\
  \ in sequence:\n        (block of statements)\n    (Other statements)\n```\n\n示例：\n\
  ```python\nv = int(input(\"Enter your desired number of rows\"))\nv,w=0,0\nfor v\
  \ in range(0,n):\n    print ()\n    for w in range(0,i+1):\n        print(\"*\"\
  ,end=\"\")\n```\n\n输出：\n当你运行此程序时，你的控制台屏幕将打印：\nEnter your desired number of rows\n\
  假设你输入了“6”。它将打印：\n*********************\n```\n\n### for 循环中的 else 语句\n`else` 语句是许多条件语句的重要组成部分。它也用于许多其他编程语言中满足某些条件。在\
  \ Python 中，`else` 语句可以在“for 循环”内部执行。\n\n示例 - 1：\n```python\nfor v in range(0,8):\n\
  \    print(v)\nelse:\n    print(\"Excluding break statement therefore for loop completely\
  \ exhausted.\");\n```\n\n输出：\n在这种情况下，你的控制台屏幕将打印：\n01234567\n由于没有 break，for 循环完全执行完毕\n\
  ```\n\n示例 – 2：\n```python\nfor v in range(0,5):\n    print(v)\n    break;\nelse:\n\
  \    print(\"for loop is exhausted now!\");\nprint (\"break statement is used therefore\
  \ loop gets broken\")\n```\n### `break` 语句停止了 `else` 语句的执行。\n输出：\n在这种情况下，你的控制台将打印：\n\
  0\nthe break statement is used therefore loop gets broken\n```\n\n### while 循环\n\
  通常情况下，while 循环负责确保只要已知条件为真，就执行一段代码。它通常用于无法预知迭代次数的情况。while 循环的语法如下。\n\n```python\n\
  while expression:\n    (statements)\n```\n`expression` 必须是任何产生真或假值的有效 Python 表达式。在这种情况下，`True`\
  \ 是任何非零值。\n\n示例 – 1：\n```python\nv=1\nwhile v<=11:\n    print(v);\n    v=v+1;\n\
  ```\n\n输出：\n在这种情况下，你的控制台将打印一个直到 11 的整数列表。\n1234567891011\n```\n\n### Python 中的无限\
  \ while 循环\n如果 while 循环提供的条件没有变为假，则 while 循环将永远不会结束，结果将导致无限死循环。为了获得 `True` 条件，我们在\
  \ while 循环中使用非零值，并使用零值来表示 `False` 条件。\n\n示例：\n```python\nvariable = 1\nwhile variable\
  \ != 2:\n    v = int(input(\"Enter your desired number :\"))\n    print (\"Entered\
  \ value is %d\"%(v))\n```\n\n输出：\n其结果将是：\nEnter your desired number : 6\nEntered\
  \ value is 67\nEnter your desired number : 69\nEntered value is 69\nEnter your desired\
  \ number : 68\nEntered value is 68\nEnter your desired number : 76 …\n它将是一个无限循环。\n\
  ```\n\n### Python while 循环中的 else\nPython 允许开发者在 while 循环内部同样使用 while 循环。当 while\
  \ 语句中的给定条件变为假时，它执行 `else` 块。与 for 循环一样，如果 while 循环使用 `break` 语句打破，在这种情况下，`else`\
  \ 块将不会执行，而是会执行 else 块之后的语句。\n\n示例 - 1：\n```python\nv=1\nwhile v<=4:\n    print(v)\n\
  \    v=v+1;\nelse:\n    print(\"The while loop is broken\");\n```\n\n输出：\n在这种情况下，你的控制台将打印：\n\
  1234\nThe while loop is broken\n```\n\n示例 – 2：\n```python\nv=1\nwhile v<=5:\n  \
  \  print(v)\n    v=v+1;\n    if(v==3):\n        break;\nelse:\n    print(\"The while\
  \ loop is broken\");\n```\n\n输出：\n在这种情况下，你的控制台将打印：\n12\n```\n\n## 第 7 章：Python 函数与文件处理\n\
  Python 函数和文件处理是 Python 编程中最重要的部分。没有这些功能，程序无法实现预期结果。\n\n### 7.1 Python 中的函数\nPython\
  \ 函数是高度实用的小型代码包，可以通过调用来执行特定任务。它们被用于程序中执行特殊角色。基本上，它们是封装在 `{}` 中的唯一语句。在 Python 中，你可以根据需要调用函数。\n\
  \n### Python 函数的优点\n以下是 Python 函数的一些主要优点：\n\n- 通过函数，我们可以避免代码重复。通过一个语句即可调用整个函数。\n\
  - 具有可重用性，重用性是一个非常吸引人的特性。它们可以在程序中被多次调用。\n- 通过这些函数，可以将较大的程序分成多个函数。这提高了利用率。\n\n\n\n\
  \n\n### Python 函数\n\nPython 编程语言中有许多函数。它们可以从解释器包中调用，并在任何程序中使用。没有了这些函数，Python 对软件社区将失去吸引力。如今，它们在全世界范围内被广泛用于执行所有主要的编程任务。\n\
  \n### `abs()` 函数\n\n该函数主要用于数值。当我们程序中输入任何整数时，它会返回一个绝对值。它专门用于获取单个参数的绝对值。这里有一些绝对数的示例，以理解该概念。\n\
  \n示例：\n```python\n### int number\n>>> integer = -25\n>>> print(' abs value of -25\
  \ is', abs(integer))\n### float number\n>>> float = -55\n>>> print('abs value of\
  \ -55', abs(float))\n```\n输出：\nabs value of -25 is: 25\nabs value of -55 is: 55\n\
  \n这些结果显示了 `abs()` 函数的工作原理。\n\n### `bin()` 函数\n\n该函数 `bin()` 返回整数的二进制结果。二进制输出在值的开头有前缀\
  \ `0b`。\n\n示例：\n```python\n>>> n=20\n>>> v= bin(n)\n>>> print(v)\n```\n输出：\n在这种情况下，你的控制台将打印\
  \ 0b2020\n\n### `bool()` 函数\n\n该函数通过使用真值测试方法输出布尔类型的值。它是 Python 的一个重要内置函数。如果有任何值输入，结果为真；否则，它打印假。\n\
