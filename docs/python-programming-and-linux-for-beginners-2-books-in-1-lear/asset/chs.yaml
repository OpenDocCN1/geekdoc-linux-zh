  \n\n\n\n\n# 8.2 Python 数据科学库\n\nPython 库每天都在变得更加易于使用和更加实用。作为一套开源语言，有数百万计数据科学家正在通过高级编码，利用工具和库来丰富\
  \ `Python`。现在，数据科学家已经在使用许多极其先进的包和库来完成多项数据分析任务。下面给出了一些最优秀的 Python 数据科学库的简要描述。\n\n\
  ## Numpy \n\n`NumPy` 是一个非常重要的 Python 数据科学库，专门用于逻辑注册。它为极其强大的 N 维数组对象和广播机制提供了支持。此外，该库还提供了傅里变换、任意精度数值，以及用于协调\
  \ `C`、`C++` 和 `FORTRAN` 代码的设备。对于利用 `Python` 从事人工智能项目的全栈开发者来说，掌握 `NumPy` 的工作信息是必要的。\n\
  \n`Numpy` 是在 `Python` 中处理数据的根本且完美的组合，因为不同的数据调查程序包都是基于 `Numpy` 和 `sci-kit-learn`\
  \ 包构建的，后者被用于构建人工智能应用，并且与 `Numpy` 配合得非常完美。最初，`Numpy` 提供了卓越的对象数组——即 n 维集群。在 `'ndarray'`\
  \ 对象（又称为 `'exhibit'`）中，你可以存储各种相似类型信息的物品。数组对象周围的功能使得 `Numpy` 在执行数学计算和数据控制方面变得非常有优势。\n\
  \n### 特色：\n\n- `Numpy` 是一个非常有交互性的库，而且非常易用。\n- 在使用 `Numpy` 时，可以轻松地解决数学问题。\n\n###\
  \ Pandas\n\n在 `Python` 中，我们使用二维表格来像在 `SQL` 或 `Excel` 中那样的分析数据。最初，`Python` 并没有这个功能。但随后\
  \ `Pandas` 被引入了。毫无疑问，`Pandas` 是“Python 版的 SQL”。简而言之，`Pandas` 是一个可以帮助我们在 `Python`\
  \ 中处理二维数据表格的库。在许多情况下，它类似于 `SQL`。\n\n此外，`Pandas` 基于 `NumPy` 库，这意味着 `NumPy` 的大部分结构都被使用或复制以开发\
  \ `Pandas`。`pandas` 中的数据经常被用于加固 `SciPy` 中的事实检查、`Matplotlib` 的绘图能力以及 `Scikit-learn`\
  \ 中的机器学习计算。同时，`Jupyter Notebooks` 为利用 `pandas` 执行数据调查和演示提供了一个良好的环境，但 `pandas` 也可以简单地用在内容工具中。\n\
  \n`Jupyter Notebooks` 允许开发者在特定的单元格中执行代码，而不是运行整个记录。这在处理庞大的数据集和复杂更改时节省了大量时间。Scratchpad\
  \ 同样提供了一种简单的方法来可视化 `pandas'` 的 `DataFrames` 和图表。确实如此。\n\n`Pandas` 主要因在 `Python`\
  \ 中提供数据大纲而闻名。这是一个卓越的数据检查库，与像 `R` 等其他领域特定的语言相比。通过使用 `Pandas`，处理缺失信息变得更简单，支持处理从许多不同资源收集的具有不同字段的信息，并支持程序化的数据整理。此外，它提供了数据检查和数据结构的设备，如合并、塑形或切割数据集，它在处理与时间序列识别的数据方面也特别有效，因为它提供了强有力的工具从\
  \ `Excel`、平级文档和数据库中堆叠数据。\n\n使用 `Pandas` 库让程序员处理命名数据或社交数据变得更加简单和直观。它还提供了表达性、快速且可扩展的数据结构。`Pandas`\
  \ 的设计是为了填补在使用 Python 作为编程语言时进行数据检查所需的关键高层结构空白。\n\n`Pandas` 最强大的特征之一是利用极少量的指令来解释复杂的数据活动。此外，人工智能库在合并、分离和收集数据的技术方面也不乏工作。它还强调了时间序列的功能。\n\
  \n### 特色：\n\n- `Pandas` 能够通过极少几个指令来解释复杂的数据活动。\n- 此外，人工智能库在合并、分离和收集数据的技术方面也不乏工作。\n\
  - 它还突出了时间序列的功能。\n\n- 在使用 `Pandas` 时，可以非常容易地完成类型操作。\n- 使用 `Pandas`，数据操作变得更简单。\n\n\
  ### Matplotlib\n\n`Matplotlib` 是一个 Python 的二维绘图库，具有强大的表示模块。除了用于 `Python` 终端、内容和\
  \ `IPython` 终端外，`Matplotlib` 还可以用于：\n\n- `Jupyter`\n- Web 服务器\n- GUI 工具箱\n\n正如 `Matplotlib`\
  \ 官方网站所说，这个 `Python` 库试图“让简单的变得简单，让困难变得可能”。这个二维绘图库允许用更少的代码生成条形图、误差图、直方图、散点图等。\n\n\
  也许，表示最大的优势是它允许我们有效地访问海量数据。`Matplotlib` 包含了一些图表，如线图、条形图、直方图、散点图等。\n\n`Matplotlib`\
  \ 是 `Python` 中的一个数学绘图库。它是一个常用于数据表示的库，包括 3D 图、直方图、图像、散点图、条形图，并带有亮眼的缩放和搜索功能。它支持几乎所有的平台，例如\
  \ Windows、Mac 和 Linux。该库同样作为 `NumPy` 库的扩展。`Matplotlib` 有一个 `pyplot` 模块用于表示，这通常与\
  \ `MATLAB` 进行对比。\n\n这些库是业余爱好者利用 `Python` 语言开始数据科学的最佳选择。还有许多其他 Python 库可用，例如 `NLTK`\
  \ 用于标准语言准备、`Pattern` 用于网络挖掘、`Theano` 用于深度学习、`IPython`、`Scrapy` 用于网络抓取、`Mlpy`、`Stats\
  \ models` 等，仅此限。\n\n\n\n\n\n### Scikit-Learn\n\nScikit-learn 通过 Python 中一种一致的接口提供了一系列监督和无监督学习算法。它在宽松的重新发行\
  \ BSD 许可证下授权，并发布在许多 Linux 发行版中，适用于学术和商业用途。该库基于 `SciPy`（科学 Python），在在使用 `sci-kit-learn`\
  \ 之前必须先安装它。\n\n有几个 Python 库提供了机器学习算法范围的强力实现。其中最广为人知的是 `Scikit-Learn`，它是一个提供了许多基础算法的高效实现包。`Scikit-Learn`\
  \ 的特点是拥有完美、统一且精简的 API，以及极其有用且内容详尽的在线文档。这种一致性带来的优势在于，一旦你理解了某类模型 `Scikit-Learn` 的基本用法和语言结构，切换到另一个模型或算法就会变得非常直接。\n\
  \n毫无疑问，Python 中最复杂的领域是机器学习和预测性。而这些领域最好的库就是 `Scikit-Learn`，它基本上自称为“Python 时代的机器学习”。`Scikit-Learn`\
  \ 拥有许多技术，基本上涵盖了你在数据科学职业前几年可能需要的所有内容：回归策略、分类策略和聚类，以及模型评估和模型选择。这个流行的库用于数据科学中的人工智能，涉及不同的回归、排序和聚类算法，提供了支持向量机、朴素贝叶、梯度提升和逻辑回归。`SciKit`\
  \ 旨在与 `SciPy` 和 `NumPy` 协同工作。\n\n### 特性：\n- 能够从图像和文本中提取特征\n- 可以在多个场景中重复使用\n\n###\
  \ Scipy\n\n存在 `scipy` 库和 `scipy` 栈。大多数库和包都是 `scipy` 栈的一部分（用于 Python 中的逻辑处理）。其中一个部分就是\
  \ `scipy` 库，它为数值计划（AI 模型背后的数学内容）提供了高效答案。这些包括集成、导入、优化等。`Scipy` 为 `Scikit-learn` 中不可预测的\
  \ AI 提供了核心科学策略。\n\n这是一个开源库，用于注册不同的模块，例如图像处理、连接、插入、特殊功能、增强、线性代数、傅里叶变换、聚类以及许多不同的任务。该库与\
  \ `NumPy` 一起用于执行高效数值计算。\n\n### 特性：\n- 轻松处理数学操作\n- 使用子模块提供高效且快速的数值程序，如数值积分和优化\n-\
  \ 支持信号处理\n\n### TensorFlow\n\n任何从事使用 Python 的 AI 机器学习任务的人都至少听说过 `TensorFlow`。它由\
  \ Google 开发，是一个开源的代表性数学库，利用数据流图进行数值计算。普通 `TensorFlow` 数据流图中的科学活动由图节点表示。图的边，则代表在图节点之间流动的多维数据表示，即\
  \ `Tensors`（张量）。\n\n`TensorFlow` 采用了一种灵活的设计。它允许 Python 工程师将计算传送到工作站、手机手机或服务器中的一个或多个\
  \ CPU 或 GPU 上，而无需修改代码。在 `TensorFlow` 中创建的所有库都是用 `C` 和 `C++` 编写的广泛使用的 Google 产品如\
  \ Google Photos 和 Google 语音搜索都是使用 `TensorFlow` 构建的。该库为 Python 提供了一个复杂的前端。Python\
  \ 代码将被编译，然后在 `TensorFlow` 提供的执行引擎上运行。\n\n### 特性：\n- 允许训练各种神经网络并使用许多 GPU，使得模型在大规模框架下极其高效\n\
  - 可在 CPU 和 GPU 上轻松训练以进行分布式计算\n- 操作的灵活性，这意味着 `TensorFlow` 提供了提取你需要的部分并留下你不需要部分的选择\n\
  - 高级别的网络和设计支持\n- 与其他数据科学 Python 库不同，`TensorFlow` 改进了想象图中每一个部分的方法\n\n### Keras\n\n\
  它被认为是最酷的 AI（算法）Python 库之一；`Keras` 为神经网络的通信提供了一个更简单的工具。它还具有用于累积模型、准备数据集、可视化图表等的强大的实用工具。`Keras`\
  \ 用 Python 编写，可以在 `CNTK`、`TensorFlow` 和 `Theano` 上运行。这个 Python AI 库的创建核心重点是允许快速实验。所有的\
  \ `Keras` 模型都是紧凑的。与其他 Python AI 库相比，`Keras` 是非常轻量。这是因为它先利用后端框架创建一个计算图，然后使用该图来执行操作。`Keras`\
  \ 在进行创新性研究时非常有表现力且灵活。\n\n### 特性：\n- 完全基于 Python，使其更容易调试和调查\n- 本质上是模块化的。\n- 神经网络模型可以组合以构建日益复杂的模型\n\
  - 在 CPU 和 GPU 上均可运行\n- 支持几乎所有的神经网络模型，包括卷积、嵌入、全连接、池化和循环。\n\n### Seaborn\n\n`Seaborn`\
  \ 本质上是一个 Python 的数据可视化库，基于 `Matplotlib` 库。此外，它与 `Pandas` 数据结构紧密集成。这个 Python 数据可视化库提供了一个高级接口来绘制美观且实用的统计图。\n\
  \n`Seaborn` 的主要点是将可视化成为研究和获取信息的不可或缺的一部分。它的数据集的绘图功能作用于包含整个数据集的帧和边缘。该库非常适合检查多个因素之间的关系。`Seaborn`\
  \ 内部处理了创建教育性图表的所有重要语义映射和测量数据收集。Python 数据可视化库还具有在调色板之间选择的设备，有助于发现数据集中的设计。\n\n###\
  \ 特性：\n- 自动估计以及直接回归模型的绘制\n- 轻松查看复杂数据集的总体结构\n- 使用高级判断简化构建复杂的表示法\n- 可视化二变量或单变量分布的选择\n\
  - 对清晰词汇的专门支持\n\n# Natural Language Toolkit (NLTK)\n\n它是常用自然语言处理和设计识别任务的有价值工具，可用于创建智能模型、分词、标记、思考以及有助于\
  \ AI 应用的其他任务。\n\n### 特性：\n- 自带一个语言结构标记器\n- 支持词法分析\n\n\n\n\n\n## 第 9 章：人工智能与 Python\n\
  \n人工智能（即 A.I）已经存在了半个多世纪，其发展正呈指数级增长。AI 市场正处于最强时期，如果你想了解人工智能，那么你来对地方了。这本关于人工智能和 Python\
  \ 的书籍将帮助你理解 Python 中所有的 AI 概念。\n\n### 9.1 什么是人工智能？\n\n人工智能（AI）是一种用于理性推理和行为的工具。这些计算机由其内部的软件驱动，因此\
  \ AI 与驱动它们的创新软件程序密切相关。它是一门可以帮助机器理解世界并像人类一样对情况做出反应的科学。\n\n观察过去几年来 AI 如何出现，你会发现不同的研究人员倾向于关注其他的\
  \ AI 定义概念。在现实世界中，AI 以多种多样的形式存在于许多垂直领域。我们希望的机器人能够检测、理解、梦幻和行为。我们也希望让我们的机器人具有逻辑性。\n\
  \n人工智能与人脑研究紧密相。研究人员得出，通过理解人脑的工作原理来实现人工智能。通过模仿人类大脑的思考、信仰和行为方式，我们将创造同样的计算机。这可以被用构建智能学习系统的平台。\n\
  \n### 9.2 什么是机器学习？\n\n机器学习是实现人工智能（AI），允许设备在没有直接编程的情况下自动学习和发展行为。机器学习侧重于创建可以为了其目的而操纵和使用数据的计算机系统。\n\
  \n学习过程始于见解或证据（例如证据、直接经验或训练），以识别知识中的趋势，并根据我们提供的示例在未来做出明智的决策。其主要目的是允许计算机在没有人类干预或协助的情况下自动学习并改变行为。\n\
  \n使用经典的机器学习算法，文本被称为一个关键字序列；相反，它是一种语义处理方法，模仿人类解释书籍语境的能力。\n\n## 9.3 Python 编程在现代人工智能中的作用\n\
  \nPython 凭借其人工智能原型算法在 AI 方面非常有帮助。该组织还支持无需常规编译器语言的解释性执行时间，并为 AI 提供了独特的结构化算法，例如简洁的语法、数据结构和简单的控制流。\n\
  \n### 人工智能与 Python\n\n#### Python\n它是一种具有复杂语义的高级面向对象语言。它通过易读且清晰的语法降低了软件开发成本，即使是初学者也能读。\n\
  \n### 人工智能\n它是一个计算机科学领域，优先开发能够像人类一样运行的智能机器，例如语音识别、视觉感知、翻译，甚至选择。\n\n### Python 的优势和特性\n\
  \n#### 虚拟机或模拟器的简单解释\n它在执行之前不需要编译成机器语言。尽管如此，程序员可以使用硬件可理解的原生机器语言直接运行它。\n\n### 高级编程语言\n\
  它包含了变量、表格、复杂算术、人工制品、布尔表达式和其他抽象原理，使其更易使用。\n\n#### 通用编程语言\n它可以跨越技术和领域。\n\n#### 自动内存控制和动态类型系统\n\
  它有一系列编程风格，包括命令式、面向对象、函数和过程化的特征。\n\n### 独立平台\n它可以在所有操作系统上运行，是一种开源编程语言。\n\n### 为什么选择\
  \ AI 和 Python？\n\n与其他面向对象编程（OOP）相比，Python 提供了 1/5 的代码。我们应该从其他编程语言选择 Python 用于 AI\
  \ 的原因如下：\n\n*   **内置库**：用于 Python 机器学习的 `Numpy`、`PyBrain` 以及用于高级计算的 `Scipy` 等库使得\
  \ Python 成为 AI 的正确语言。\n*   **强大的社区**：全球的 Python 开发者通过论坛和指南提供支持并贡献代码以帮助编写代码。\n* \
  \  **独立平台**：它通过少量的简单代码更改即可灵活地使用各种操作系统。\n*   **OOP 脚本和概念选择**：通过使用多种算法帮助 IDE（集成软件开发环境）解决开发者的困境。\n\
  \n## 使用 AI 进行 Python 编码\n\nPython 有了一系列库包用于 AI 项目的创建和解码。少数高级包包括：\n\n*   **NumPy**：用作通用数据容器，由\
  \ N 维数组项、集成的 `C / C++` 资源、随机数能力等功能组成。\n*   **Pandas**：为 Python 提供了易于使用的数据结构和计算方法，是一个开源库。\n\
  *   **Matplotlib**：这是一个 2D 绘图库，用于生成用于质量图像。\n*   **AIMA**：Russel 和 Norvig 使用《人工智能：一种新的方法》来应用通用\
  \ AI 算法。\n*   **PyDatalog**：这是一个 Python 逻辑编程引擎。\n*   **Easy**：用于构建用于 AI 游戏的基础双玩家\
  \ Python 引擎。（例如：`Negamax`）（仅限法语）。\n*   **PyBrain**：一种简单但强大的机器学习算法，用于评估和比较预定义的环境。\n\
  *   **PyML**：一个双边 SVM 和其他内核方法系统。支持 Linux 和 Mac OS X。\n*   **Scikit-Learn**：最流行的机器学习库是一个非常强大的数据分析平台。\n\
  *   **MDP-Toolkit**：学习算法由管理且无人值守，并可以扩展到网络架构的使用。\n*   **NLTK**：自然语言工具包用于语言数据和文档的文本解释，以及自然语言处理的研究与开发。\n\
  \n## AI Python 对比 C++\n\n*   Python 是 AI 最常用的 C++ 语言，并以 57% 的得票领先开发者。Python 易于阅读和应用。它们也可以使用多个存储库进行数据挖掘。\n\
  *   C++ 在效率方面胜过 Python。这是因为 C++ 是一种静态类型语言，因此运行时不会有类型错误。C++ 还让运行时编程更轻量、更快。\n*   Python\
  \ 是一种动态语言（而非静态语言），这降低了交互的复杂性；可以使用更少的代码引入功能。与 C++ 可能是所有编译器的特定框架不同，Python 代码可以在几乎所有平台上使用，而无需花费时间进行设置。\n\
  *   Python 通过增长并行的 GPU 加速编程能力优于 C++，产生了诸如 `CUDA Python` 和 `cuDNN` 等库。这意味着 GPU 越来越多地从真实的机器学习编程中释放出来——结果是\
  \ C++ 可能提供的任何性能提升都变得毫无意义。\n*   Python 在代码简单性方面胜过 C++，特别是对于新开发者而言。掌握低层次语言需要更多的知识和能力。\n\
  *   Python 的简单语法也使得通常更直接的 ETL 方法（提取、转换、加载），并与 C++ 相比，帮助开发者更容易地评估机器学习算法。\n\n\n\n\n\
  \n### 结论\n\nPython 通过提供强大的框架、高效的库以及易于使用的可视化软件，满足了创建人工智能框架的所有需求。当 AI 需要 500 kB 的\
  \ `Java` 代码时，`Python` 只需 20 到 30 行代码（包括库）即可实现，这表明 `Python` 在人工智能系统中起着至关重要的作用。在切纳纳的\
  \ SLA 就业中心学习最好的 `Python` 和人工智能培训，并获得准确的资源、资深教练的指导以及就业建议。\n\n祝喜你！如果你已经读到了这里，我们希望你已经真正开始理解\
  \ `Python` 编程`的基本概念和复杂性。在这一阶段，我们认为你应该能够有信心且理解地阅读几乎任何用 `Python` 编写的代码了。\n\n我们试图在本书中涵盖许多重要的\
  \ `Python` 概念和特征，包括面向对象编程（也称为“OOP”）的一些概念。此外，我们还努力让写作变得清晰易懂，书中包含了许多理论性、实践性以及解释性的示例。\n\
  \n在计算机科学和计算机编程领域，你可能会发现许多学术书籍。其中许多是为学生设计的。你可能会发现其他书籍是专门为专业开发人员设计的，他们在开发程序时需要关于如何解决代码中语法问题和运行时问题的个人建议。如果你通过编写代码来学习，那么在书中，很少有页面没有\
  \ `Python` 源代码，但每个概念都至少通过一个代码示例进行了演示。\n\n代码示例格式非常规范、易读且整洁，因此你会发现 `Python` 编程非常简单。\n\
  \n展望未来，如果你是学习 `Python` 的初学者，只需读这本书即可，因为书中共有八个章节，使你可以在一周内更好地理解 `Python`。有些人可能会说这本书不适合初学者！看看它的厚度就知道了！这本书对于像你这样的初学者来说太太让人压力压力了！请不要听他们的！如果你能找到更简单的书，就去读吧。好吧，我们无法告诉你这本书是对是错的。我们猜每个人的理解都非常不同。我们建议这本书适合计算机编程新手但具有商业专业背景的人士！\n\
