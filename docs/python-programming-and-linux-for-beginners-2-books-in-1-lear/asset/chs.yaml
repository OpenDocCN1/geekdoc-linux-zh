  `int()` 函数旨在获取整数，通常用户用它将字符串和其他数据结构转换为指定的整数值。\n\n示例 :>>>\n>>> `n = int(15)` # 整数\n\
  >>> `v = int(15.52)` # 浮点数\n>>> `w = int('15')` # 字符串\n>>> `print(\"Int val:\",a,\
  \ b, c)`\n输出 :\n`Int val : 15 15 15`\n\n### `pow()` 函数\n我们使用 `pow()` 函数计算幂以定义项目或程序所需的特定结果。它是执行许多代数求解的重要函数。\n\
  \n示例 :>>>\n>>> `Positive v, Positive w (v**w)`\n>>> `print(pow(2, 3))`\n>>> `Negative\
