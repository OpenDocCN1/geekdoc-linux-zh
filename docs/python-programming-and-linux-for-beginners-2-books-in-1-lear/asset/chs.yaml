  \n\n## 引言\nPython 是一种著名的面向对象高级计算机编程语言，被全球许多软件开发者、游戏开发者、网站开发者、数据科学家等使用。Guido van\
  \ Rossum 先生于 1991 年开发并构建了这种语言，Python 软件公司负责进一步开发。尽管当时已经有很多 OOP 语言，但构建 Python 的主要目的是强调代码连贯性和逻辑或数值处理，例如\
  \ `NumPy`、`SymPy`、`Orange` 等。展望未来，Python 的语法简洁且直观。Python 是一种开源、面向对象且多用途的语言，支持大量的标准库。\n\
  \nPython 在信息科学领域也闻名全球。全球组织都在使用 Python 从它们的信息中收集知识碎片并增加竞争优势。与其他 Python 教学练习不同，在本计算机编程指南中，你将学习\
  \ Python 编程的基本概念。这是一份循序渐式的 Python 编程指南，确保对 Python 编程的理解。首先，需要了解 Python 的句子结构和语法以及基础表达式。然后，它将引导主要的“函数”，如数学运算和标准库。此外，还有关于运算符、逻辑数据、Python\
  \ 中的数组、指针、类和字符串概念的完整指导。\n\n本特定指南专为希望在几天内学习 Python 基础概念的初学者设计。\n\n## 第 1 章：Python\
  \ 入门\n谈到 Python 的起源，我们必须谈谈 20 世纪 80 年代使用的 ABC ABC 编程语言。主要是 ABC 编程语言的影响促进了 Python\
  \ 的增长和兴起，它现在是最流行的语言之一。20 世纪 80 年代初，计算机工程师兼数学家 Vansum 先生曾在 Centrum Wiskunde en Informatica\
  \ 任职，担任一种名为 ABC 的编程语言的项目协调员。Vansum 在开发一个名为 `AMOEBA` 的新操作系统时，开始寻找一种像 ABC 一样具有新语法的新脚本语言，它可以访问\
  \ ABC 的系统调用。因此，Vansum 自己开始创建一种可以解决 ABC 编程语言缺陷的新语言。最后，他的编程语言的第一版本由 Vansum 在 20 世纪\
  \ 90 年代发布。最初，他的编程语言使用了 `Modula-3` 模块框架。我们今天把他的语言称为“Python”。\n\n人们通常认为 Python 是用蛇命名的，甚至\
  \ Python 的标志标志中也显示了两条蛇，第一条是蓝色的，第二条是金色的。但很少有人知道 Python 名字背后的真实故事。20 世纪 70 年代 BBC\
  \ 上有一部名为《Monty Python's Fly Circus》的成功喜剧节目。巧合 Rossum 是该节目的大粉丝。因此，在看了《Monty Python's\
  \ Fly Circus》后，Rossum 为他新出生的语言取了名。\n\n### 1.1 学习 Python 的步骤\nPython 是现代世界中每个开发者都应该知道的最基本的编程结构和语言之一。大多数程序员使用这种语言来构建网站、开发学习算法和执行其他编程任务。首先，学习\
  \ Python 可能是令人敬畏、沮丧且困难的，特别是当你不确定如何接触工具和资源时。你可能会发现最大的挑战之一是所有的学习材料和资源是多么相似。假设你对理解\
  \ Python 和编写它感兴趣。在这种情况下，你会发现在你考虑做你感兴趣的事情之前，任何编写资源都需要你花费大量时间在 Python 的语法上。这种不一致性使得许多程序员学习\
  \ Python 变得非常困难。经验程序员还会向你抛出这样的论点：“噢，天哪！学习 Python 太容易了！”他们甚至经常向你保证这一点。但事实上，即使是几行看起来简单的代码也可能让人难以置信地困惑。例如，甚至是一行代码就能让你感到困惑！在\
  \ Python 中：\n\n\n\n\n\n### \"django.http\" 是什么意思！\n\n### 为什么某些代码行中会有括号？\n\n当你对 Python\
  \ 一无所知时，要理解它是如何协同工作的是非常困难的。这里最初的问题是，你需要理解 Python 的构建模块才能构建出有趣的东西。上面提到的代码段 `django.http`\
  \ 使用流行的 MVC 架构来创建网站的视图（view），这是网站的关键构建模块之一。如果你无法编写开发视图的代码，那么在现阶段，你毕竟是不可能创建一个动态网站的。\n\
  \n大多数 Python 编程教程和课程都假定你将在开始做某些事情之前，需要理解 Python 语法的所有内容。这导致你在语法上浪费了几个几个月的时间，而你真正想做的是分析数据、创建一个网站或制作一个自动无人机。\n\
  \n通常情况下，把所有时间花在学习语法上会导致灵感流失。我们在这里将其想为一面“无聊之墙”。许多教程和课程建议你准备得足够充分，以爬越这道“无聊之墙”，使其变成“你将要从事的迷人领域”，但相信我们，这并不是学习\
  \ Python 的唯一途径！\n\n一个人在遇到几次那堵“无聊之墙”并离开后，可能会发现一个更适合他自己的过程。他/她特别可以找到一种将简单学习与开发有趣的想法和程序相结合的方法。在某种意义上，他绕过了“无聊的区块”，直接到达了顶端。他应该在学习基础知识上花费尽可能少的时间，然后立即跳跃到他感兴趣的事情中。\n\
  \n在这个阶段，我们将逐步向你展示如何重现这个过程，无论你为什么要学学习 Python。这一切都是从找到你的灵感开始的！\n\n### 动机\n在你开始探索并跳入\
  \ Python 的世界之前，值得问问自己为什么要学习它，因为成为一名 Python 开发者将是一段漫长且往往充满挫败的旅程。如果没有足够的灵感，你是无法坚持下去的！\n\
  \n所以！根据我的观点，动机非常重要，比你想象的要重要得多！高中和大学的大多数人在编程课程上睡着觉，在课程中他们必须背诵语法，他们并没有受到启发。另一方面，当他们需要使用\
  \ Python 创建一个自动生成文章的网站时，他们会为了完成它而连续工作几个晚上学习 Python。\n\n所以，如果换一种说法，我们可能会认为，当我们有学习的理由时，学习更多东西会容易得多。如果你能弄清楚什么激发了你，动机将帮助你找到最终目标以及一条通目标的路径，而不会感到失望。你并没有一个特定的项目要计划。当你准备学习\
  \ Python 时，可以选择一个你感兴趣的通用领域。\n\nPython 提供了许多可能让你感兴趣的领域。你可以选择你感兴趣的领域，例如：\n\n* 数据科学\n\
  * 机器学习\n* 人工智能\n* 手机设备\n* 游戏开发\n* 硬件 / 纳米技术 / 机器人 / 传感器\n* 自动化脚本\n\n你可以选择一个或多个你感兴趣并愿意追求的领域。在你感兴趣的领域，你可以专注于学习，并最终在这些领域开发项目。\n\
  \n### 学习语法\n遗憾的是，在学习 Python 时，你不能跳过这一阶段。在深入研究你感兴趣的领域之前，你必须学习 Python 语法的最基础知识。我知道你想在这里花费尽可能少的时间，因为这既没有动力也没有启发。我将在书中帮助你学习一些\
  \ Python 语法的基础知识。\n\n### 开发项目\n一旦你掌握了基础语法，就可以开始设计自己的项目了。学习的一种极佳方法是创建自己的想法，因为这帮助你将经验转化为有用的东西。你应该注意，如果不应用自己的想法，获得更多经验将是困难。项目将培养你的能力，帮助你理解和学习新概念，并帮助你建立供未来雇主查看的作品集。\n\
  \n在此时，非常自由的项目将很困难。你会感到非常困惑，并且必须回到文档中去阅读。因此，通常在你感到足够安全可以完全在自己的管理下构建项目之前，创建更正式的项目会容易一些。为了让你从中学习，大多数教程网站或书籍都拥有结构化的项目。这有助于你在对这些项目进行一些编辑后，在你感兴趣的领域创建出有趣的物品，从而防止你迷失。由于你想创建一个游戏，或者从事技术工作，或者做其他事情，你可能对\
  \ Python 感兴趣。所以，在这个编程指南的最后，我们将从人工智能的角度来看 Python 的未来。\n\n### 工作，工作还是工作\n如果完成了上述所有阶段，在\
  \ Python 编程中，你可以不断增加项目的种类和复杂性。如果你对自己创造的内容完全满意，这意味着是你时候尝试某些困难得多且复杂的东西了。你可以考虑一个新的更具挑战的项目，或者为你最近的项目添加一些难度，也许你可能为你的项目准备一个完全不同的挑战。嘿！为了这一点！你必须记住，人通过通过练习可以变得更好！\n\
  \n为了增加任务的难度，以下是一些建议，以确保你真的在学习 Python 上取得了进展。\n\n* 你可以尝试向新手展示你是如何开发出想法的。没有什么比教别人更能帮助你更好地理解一个话题了！\n\
  * 你应该考虑可以增加项目能力的程序。\n* 你可以考虑关注项目的有效性。\n* 你可以提出让界面更用户友好的方法。\n* 你可以考虑让你的项目公开的方法。\n\
  \n\n\n\n\n### 1.2 Python 基础\n\n在开始编写你的第一个 Python 程序（通常被称为 \"Hello World\"）之前，你必须学习\
  \ Python 语法的基础知识。在这一阶段，我们将讨论 Python 编程的基础及其语法，这无疑将帮助你开启成为 Python 开发者的职业生涯。现在，让我们先编写最基础的\
  \ Python 程序。\n\n### 编写你的第一个 Python 软件/程序\n\nPython 程序通常以两种不同的形式进行打印和编译：\n\n*   **交互模式**：程序员可以简单地在\
  \ Python 的交互模式下编写并正常编译 Python 程序。\n*   **脚本模式**：程序员必须预先以脚本方式执行其 Python 程序，这通常是一个以\
  \ `.py` 扩展的文件，并且已经保存在你的计算机上。\n\n让我们实际观察一下这两种方式。\n\n### 交互模式下的 Hello World!\n\n你可以在终端（Terminal）的\
  \ Python 编程交互模式下输入以下命令来编写你的第一个程序。\n\n```\n>>> $ Python\n```\n\n如果你在终端中输入并执行了此命令，你现在处于\
  \ Python 的交互模式。另一方面，如果你正在使用 IDE 来进入 Python 的交互模式，则无需输入上述命令。以下是用于你第一个软件编译的基础 Python\
  \ 编程语法。第一个程序通常被称为 \"Hello World!\"，但我们将改变一下常规。我们将编写第一个“Hello to the Universe of\
  \ Python!”（你好，Python 宇宙！）\n\n当你编写第一个程序并按下回车时，你的 IDE 应该显示 \"Hello to the Universe\
  \ of Python!\"。你应该注意，括号中你写的内容“将写在你的 IDE 上”。在我们的案例中，它是 Hello to the Universe of Python!\n\
  \n语法：\n```\n>>> print (\"Hello to the Universe of Python!\")\n```\n输出：编译上述命令后，你将在执行屏幕上看到文本“Hello\
  \ to the Universe of Python!”\n\n### 脚本模式下的 Hello World!\n\n假设你已将“Hello to the Universe\
  \ of Python!”项目保存为一个编写好的程序和 Python 文件，即 `.py` 文件。现在你可以在计算机上寻找 `.py` 扩展的文件。假设你将项目保存为\
  \ `Hello to the Python.py`，以下是你的代码在 Python 脚本模式下的运行方式。\n\n你编写并保存的项目文件在开始必须是可用且可执行的。通常，程序员通过使用以下命令来实现这一点：\n\
  \n```\n>>> $ chmod +x test.py\n```\n\n现在，如果你的文件可以运行并重复执行，你就可以在 Python 的脚本模式下运行并执行你的软件了。\n\
  \n```\n>>> $ Python Hello to the Python.py\n```\n\n你可以看到终端或控制台上显示 \"Hello to the\
  \ Universe of Python!\"，直到该命令结束。通过运行 \"Hello to the Universe of Python!\" 你掌握了第一个\
  \ Python 语法。\n\n### Python 关键字和标识符\n\nPython 编程中总共有三十一个关键字和五个重要的标识符。在学习 Python 编程技能时，你可以快速熟悉标识符和关键字。\n\
  \n*   **Python 标识符**：通常，Python 标识符是一个函数、模块、向量、类或其他内容。在 Python 编程中，你为对象分配一个名称，这被称为标识符。通常，正确的标识符以大写字母\
  \ (A-Z)、小写字母 (a-z) 或下划线（`_`）开头。这些通常伴随着下划线、零、字母或数字（0 到 9）。\n\nPython 编程中有五种基本的标识符形式：\n\
  1. 函数\n2. 模块\n3. 类\n4. 变量\n5. 对象\n\n我们应该看看 Python 语法中提供的关键字以便继续后续。\n\n*   **Python\
  \ 语法关键字基础**：你必须打开 IDE 并输入以下命令来查看 Python 中所有的三十一个关键字。\n\n语法：\n```\n>>> import keyword\n\
  >>> keyword.kwlist\n```\n输出：当你输入这些命令时，你的 IDE 将打印出关键字表：`['False', 'None', 'True',\
  \ 'and', 'as', 'assert', 'break', 'class', 'continue', 'def', 'del', 'elif', 'else',\
  \ 'except', 'finally', 'for', 'from', 'global', 'if', 'import', 'in', 'is', 'lambda',\
  \ 'nonlocal', 'not', 'or', 'pass', 'raise', 'return', 'try', 'while', 'with', 'yield']`\n\
  \n随着 Python 新版本的发布，这些列出的关键字可能会发生变化。现在，当使用 Python 作为编程语言时，还有几点你需要记住。存在特定的关键字，我们不能将它们作为标识符。\n\
  \n*   在 Python 中，关键字是大小敏感的（通常如此）。\n*   关键字被称为保留字。\n\n### Python 语句\n\n在我们继续 Python\
  \ 语法的基本概念之前，你接下来需要记住的是“行”和“缩进”。在 Python 中，组织代码块或模块的主要支持手段是缩进。此外，它是强制执行的，这使得 Python\
  \ 代码具有可读性、易于扫描且可审查。我们必须注意，每种情况下缩进的空格数不同。我们需要观察以下代码来理解这一点。\n\n```python\n>>> Person\
  \ = [\"David\", \"Jennifer\", \"Michael\"]\n>>> for n in person:\n>>> if n == \"\
  David\":\n>>> print(n)\n>>> else:\n>>> print(\"Not David\")\n```\n\n在以下代码中，你必须记住“for\
  \ 语句”（即缩进）有一个空格，而“if 语句”有两个空格。\n\n在 Python 中，你以后也可以在一行内高效地声明多个语句。例如：\n\n```python\n\
  >>> Person = \"David\" ; age = 25 ; location = \"NYC\"\n```\n\n### 命令行参数\n\n在 `Hello\
  \ to Python.py` 中以及交互模式下，我们简单地使用了命令行声明。因此，最好的方法是向你介绍命令行参数。这些是 Python 编程语法基础不可或缺的一部分，你可以阅读相关的相关内容。\n\
  \n### 如何创建虚拟环境\n\n对于任何新项目，虚拟环境将是你会创建的内容之一。在 Python 中，无需构建新的虚拟环境，你也可以在新项目上工作。然而，这样做可能会让你陷入一种局面：\n\
  \n*   依赖项可能无法得到增强或优化。例如，Python 的默认版本可能没有更新（从 2.7 更新到 3.8）。\n\n\n\n\n\n你必须进入终端并输入以下命令创建一个新的虚拟环境：\n\
  ```bash\n$virtualenv newenvironment\n```\n在该命令中，我们刚刚创建的相关虚拟环境名称为 `newenvironment`。现在，要打开你的新世界，请输入以下指令：\n\
  ```bash\nsource newenvironment\n```\n\n### 从用户获取输入\n可以两种常见的 Python 语法类型，它们可能会请求用户输入：\n\
  \n*   **原始输入 (Raw Input)**：通过这种方式，任何程序员都可以邀请用户提交他们的输入。\n```python\nraw_input()\n\
  ```\n这在 Python 3.0 中已经不再准确或有效。取而代之的新的输入形式是 `input()`。\n\n*   **input()**：我们必须查看上述示例来理解这个概念。\n\
  ```python\nuser_input_request = input (\"Enter your worst Ex’s name: \")\n```\n\
  在你输入这个之后，你的 IDE 将允许你输入你最糟糕的前任的名字。我的错！\n\n## 第 2 章：Python 的基本属性\n到目前为止，我们拥有的编程语言数量几乎可以用手指数得过来。编程语言如此多，每种计算机编程语言都有其独特的特点。这些特性使一种语言区别于其他语言。\n\
  \n最后，由于该语言的特性，某种语言可能会被转换或被用于更广泛的项目。因此，在开始学习 Python 概念之前，让我们看看 Python 的功能、独特性应用等。在接下来的章节中，你将学习\
  \ Python 的基本概念、特性、应用和架构，这使其与其他许多语言相比是独特且强大的。\n\n### 2.1 Python 的独特特性\n让我们从 Python\
  \ 的一些独特特性开始。\n\n### 易于理解和编码\n当我们用“简单”或“容易”一词来描述 Python 编程时，必须从一个非常不同的背景来看待。我们之前读过\
  \ Python 语言是一门高级语言语言。大多数情况下，通过非常少的关键字和标识符，你会发现 Python 代码与英语相似。任何程序员甚至非程序员都能通过观察代码看出这段代码的作用。\n\
  \n然而，Python 是动态类型类型，这需要缩进。这一功能使得 Python 代码更加稳定且易于理解。此外，在写完我们的第一个程序后，我们可以发现在 Python\
  \ 中编写代码是毫不费力的。我们可能会发现与其他编程语言相比，Python 代码更容易编写。在短短几个小时内，有编程背景的人就能学会 Python 语法。然而，要成为精通其原理、模块和包的\
  \ Python 大师还需要一些时间。换句话说，我们可以说 Python 是一门对开发者友好的语言。\n\n### 开源且免费\n首先，你会知道 Python\
  \ 是免费的，并且在许多平台上可用。它的官方网站是下载和安装 Python 最可靠来源，即 `https://www.python.org/`。\n\n第二点是，Python\
  \ 是一门开源编程语言。开源确保公众可以随时访问 Python 的源代码。即使是非专业人士也可以下载、修改、使用和分发 Python。这类软件或语言通常被称为“FLOSS（自由、许可和开源软件）”。所有的\
  \ Python 开发者都在 Python 世界中为了一个共同的目标努力，即增强 Python 及其功能。Python 为此已将源代码变为了开源代码。\n\n\
  ### 高级语言\n从书的开始，我们一直在讨论这样一个观点，即 Python 是一门高级计算机编程语言。作为开发者，你不需要思考或回忆你的计算机或设备的设计。你用\
  \ Python 编写的代码可以在全球任何程序、机器或系统中使用。你也不需要关心系统的内存。这一功能使得在 Python 中编写和编码变得更容易。因此，我们可以像之前描述的那样将\
  \ Python 称为“开发者友好的语言”。\n\n### 可移植语言\n对于你面向 Windows 系统的计算机，假设你构建了一个 Python 程序或应用程序。假设你只想在面向\
  \ MAC 系统的计算机上运行该程序。现在，你不需要对 Python 代码进行太多的改进。你可以从面向 Windows 系统的计算机上获取 Python 代码并在任何\
  \ MAC 机器上运行它。因此，如果你使用 Python，就不需要为不同的工具或操作系统编写不同的代码。 这种 Python 特性使得我们的语言——一种极具移植性的编程语言变得非常重要。在这方面你只需要记住一点，并且避免任何依赖于系统的函数。\n\
  \n### 解释型语言\n如果你已经是 C++ 或 Java 或其他编程语言的开发者，或者熟悉编程语言，你需要意识到必须先编译代码。然后它才能运行或执行任务。但当你选择\
  \ Python 作为编程语言时，你的代码最初不需要编译。Python 将设备内的源代码转换为即时类型，即字节码（byte-code）。\n\n换句话说，无需担心连接相关的库或其他任何其他大事，你就可以运行用\
  \ Python 编写的源代码。当你的计算机或单元读取你的 Python 代码时，你可以发现源代码是逐行执行的，而不是一次性执行所有代码。这种 Python 功能使得调试你的\
  \ Python 代码变得更简单。另一方面，翻译确实让 Python 比 Java 等其他语言慢一点，但与 Python 的优点相比，这并不重要。\n\n###\
  \ 支持面向对象范式的语言\n我们从一开始就在讨论这个观点，即 Python 可以重塑现实世界，正因如此，它是一门面向对象范式的编程语言。它关注对象，并将数据及其功能放在一起。与此相反，任何面向过程语言的函数是可以重复使用的代码。Python\
  \ 是一门既支持面向过程编程又支持面向对象范式的语言，这一特性使得 Python 成为最特殊的编程语言。此外，与 Java 相比，Python 是在单文件中支持多继承的语言。\n\
  \n### 可扩展语言\n假设你是其他语言的开发者。你需要编写 Python 代码来使用其他语言（如 C++）的命令。这种 Python 特性使其成为一门非常可扩展的编程语言，这意味着它可以扩展包含其他语言。\n\
  \n### 嵌入式语言\n在上一个阶段，我们已经提到其他语言的代码也可以被我们的源代码所接受。你也可以将 Python 代码引入到其他语言（如 C++）的源代码中。这有助于我们把其他语言的脚本能力整合到我们的代码中。\n\
