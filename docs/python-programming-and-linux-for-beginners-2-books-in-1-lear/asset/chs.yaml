  >>> `W= next(V)`\n>>> `print(W)`\n>>> `W = next(V)`\n>>> `print(W)`\n>>> `W= next(V)`\n\
  >>> `print(W)` #V 是一个数字#W 是一个项\n输出 :\n`128`\n`16`\n`42`\n\n### `input()` 函数\n`input()`\
