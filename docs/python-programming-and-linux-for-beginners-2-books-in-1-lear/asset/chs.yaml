  \ = 0` #RN- 学号\n>>> `Name = \"\"`\n>>> `def_init_(my, RollNo, Name):`\n>>> `my.RollNo\
  \ = RollNo`\n>>> `self.Name = Name`\n>>> `V= Student(33,\"David\")`\n>>> `print(V.RollNo)`\n\
  >>> `print(V.Name)`\n>>> `print(V.email)` 产品错误\n>>> `setattr(V, 'email','davidrobert6185512@gcaill.com')`\
  \ # 添加新属性\n>>> `print(V.email)`\n输出 :\n`33`\n`David`\n`davidrobert6185512@gcail.com`\n\
  \n### `slice()` 函数\n`slice()` 函数从一组元素中提取切片。初始接收单个参数，但第二个函数需要三个参数才能继续。\n\n示例:>>>\n\
