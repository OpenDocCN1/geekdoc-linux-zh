  md: '# Chapter 8 Configuring and Using Networking


    After making these entries, run the following command:


    ```

    # /sbin/service xinetd restart

    ```


    At this point, you now have this functionality enabled for root. This is not required
    for other users. Other users require only /etc/hosts.equiv to get this functionality,
    as described in the next section.


    # /etc/hosts.equiv


    Your system may be set up so user''s don''t have to issue a password when they
    login to a remote system; they can set up equivalent hosts by editing this file.
    As with /etc/security this technique considered a security risk. The login names
    must be the same on both the local and remote systems for /etc/hosts.equiv to
    allow the user to bypass entering a password. You can either list all the equivalent
    hosts in /etc/hosts.equiv or list the user name you want to be equivalent. Users
    can now use rsh and other commands because they are equivalent on these systems.
    I usually just enter all the hostnames on the network in this format:


    ```

    host_to_trust#1

    host_to_trust#2

    host_to_trust#3

    ```


    Keep in mind the potential security risks of /etc/hosts.equiv. If a user can log
    into a remote system without a password, you have reduced the overall level of
    security on your network. Even though users may find it convenient to not to enter
    a password when logging into a remote system, you have given every user in /etc/hosts.equiv
    access to the entire network. If you could ensure that all the permissions on
    all the files and directories on all systems were properly set up, then you wouldn''t
    care who had access to what system. In the real Linux world, however, permissions
    are sometimes not what they are supposed to be. Users have a tendency to "browse
    around," invariably stumbling upon a file they want to copy to which they really
    shouldn''t have access.'
