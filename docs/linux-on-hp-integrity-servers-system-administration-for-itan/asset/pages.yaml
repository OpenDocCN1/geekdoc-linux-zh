  md: "Users and Groups\n\n# Users and Groups\n\nThere are many options to choose\
    \ from when you’re setting up a user. Once set up, however, user administration\
    \ is not typically a function that you’ll spend a lot of time managing.\n\nYou\
    \ have to make some basic decisions about every user they set up. Where should\
    \ users’ data be located? Who needs to access data from whom, defining “groups”\
    \ of users? What kind of particular startup is required by users and applications?\
    \ Is there a shell that your users will prefer? Then the customization of the\
    \ graphical user interface used on your system is another consideration.\n\nAmong\
    \ the most important considerations you are related to user data. A system administration\
    \ headache is rearranging user data, for several reasons. It doesn’t fit on a\
    \ whole disk (in which, case you need a volume manager in order for directories\
    \ to span multiple disks), users can’t freely access another’s data, or even worse,\
    \ users can access one another’s data too freely.\n\nThis section considers these\
    \ questions, but first, look at the basic steps to add a user. Here is a list\
    \ of activities:\n\n+   - Select a user name to add.\n- Select a user ID number.\n\
    - Select a group for the user.\n- Create an /etc/passwd entry.\n- Assign a user\
    \ password (including expiration options).\n- Select and create a home directory\
    \ for user.\n- Select the shell the user will run (this will be Bash by default).\n\
    - Place startup files in the user’s home directory.\n- Test the user account.\n\
    \nThe adduser script allows you to enter the information in the bullet list as\
    \ well as other information. The following output shows the usage of the adduser\
    \ command:\n\n```\n# adduser\nusage: adduser [-u uid [-o]] [-g group] [-G group,...]\n\
    -d home [-s shell] [-c comment] [-m [-k template]\n-f inactive [-e expire ] [-p\
    \ passwd] [-M] [-n] [-r] name\n  adduser -D [-g group] [-b base] [-s shell]\n\
    \  -f inactive [-e expire ]\n```"
  merge: -1
  pgno: 272
- img_proc: true
  md: 'You can see from this list that you can specify all user-related information
    at the command line with **adduser**.


    Most of what you do is entered in the /etc/passwd file, where information about
    all users is stored. When you create a user with **adduser**, you''ll see the
    entry in `/etc/passwd` for the user. An entry for the user is also made in `/etc/shadow`,
    which is used for passwords. There will be two exclamation marks (!!) in `/etc/shadow`
    for the user, indicating that it is locked. An entry is made in `/etc/group` for
    the user with an x in the password field indicating that a shadow exists for the
    user. There is also an entry in `/etc/gshadow` that also has the two exclamation
    marks, indicating that it is locked. The system administrator can then unlock
    it using the command **password** username.


    Note that by default, the Red Hat version of **adduser** creates a user account
    using the values specified on the command line and system defaults. The new user
    account will be entered into the system files as needed, and initial files copied,
    depending on the command options. If you do not specify a group or use the **-n**
    option, **adduser** will create a group for each user added to the system.


    You can also make these entries to the /etc/passwd file with the **vipw** command.
    Figure 10-1 is a sample /etc/passwd entry.


    ```

    oracle:xxx:200:201:Oracle User:/home/oracle:/bin/ksh

    root:x:0:0:root:/root:/bin/bash

    | | | | | | | |

    | | | | | | | > shell

    | | | | | | |

    | | | | | | > home directory

    | | | | | |

    | | | | > optional user info

    | | | | > group ID (GID)

    | | | > user ID (UID)

    | | | > password

    | > name

    ```


    Figure 10-1 Sample /etc/passwd Entry


    Here is a description of each of these fields:'
  merge: -1
  pgno: 273
- img_proc: true
  md: '**name.** The user name you assign. This name should be easy for the user and
    other users on the system to remember. When sending electronic mail or copying
    files from one user to another, the more easily you can remember the user name,
    the better. If a user has a user name on another system, you may want to assign
    the same user name on your Linux system. Some systems don''t permit nice, easy
    user names, so you may want to break the tie with the old system and start with
    sensible, easy-to-remember names on your Linux system. Remember, no security is
    tied to the user name; security is handled through the user''s password and the
    file permissions.


    **password.** This is the user''s password in encrypted format. If an asterisk
    appears in this field, the account can''t be used. If it is empty, the user with
    no password assigned can log in by typing only his or her user name. I strongly
    recommend that each user have a password that he or she changes periodically.
    Every system has different security needs, but at a minimum, every user on every
    system should have a password. When setting up a new user, you can force the user
    to create a password at first login by putting a ,, in the password field.


    Some features of a good password are:


    +   - A minimum of six characters that should include special characters such
    as a slash (/), a dot (.), or an asterisk (*).

    - No dictionary words should be used for a password.

    - Don''t make the password personal such as name, address, favorite sports team,
    etc.

    - Don''t use something easy to type as *123456* or *qwerty*.

    - Some people say that misspelled words are acceptable, but I don''t recommend
    using them. Spell check programs that match misspelled words can be used to guess
    at words that might be misspelled for a password.

    - A password generator that produces unintelligible passwords works the best,
    but that they are often hard to remember causing users to write them down, loosing
    some of the advantage associated with there unintelligibility.'
  merge: -1
