  md: "# Log Files\n\nLike UNIX applications, Samba provides extensive logging. The\
    \ **smb.conf** file contains a section that allows you to specify the level of\
    \ Samba logging you want to take place. The short section below shows that you\
    \ can have separate log files for each Windows machine that connects, and you\
    \ can specify the maximum size of the log file:\n\n```\n# this tells Samba to\
    \ use a separate log file for each machine\n# that connects\n log file = /var/log/samba/log.%m\n\
    \nPut a capping on the size of the log files (in Kb).\n max log size = 50\n```\n\
    \nThe directory **var/log/samba** contains a variety of Samba log files, including\
