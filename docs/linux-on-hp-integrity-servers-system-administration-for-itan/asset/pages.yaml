    | RE - Reset Entry: | | Resets the specified entity: C-CELL, I-HOB, M-MAIN BACKPLANE.
    RP8400/7410: C-CELL, I-O Chassis, S-SYSTEM BACKPLANE. Special use only; use RS
    or RR needed. |

    | RL - Retry Complex Profile Lock: | | Resets the complex profile lock. This command
    should only be used to recover from an error from the holder of the lock mechanisms
