  md: '# Configuring the Management Processor (MP)


    # Table 1-6 MP:CM> Commands Unique to Admin (Includes Serv and Oper Commands)


    | Command | Expansion | Description |

    |---|---|---|


    **DATE - Change the MP Time and Date:** Changes the value of the real time clock
    on the MP. This controls chassis log timestamps. Not Dst aware so GMT time is
    not used.


    **CA - Configure Async sync & remote parts:** Changes the communications parameters
    of the local and remote RS32 ports.


    **DC - Restore Parameters to Default Configuration:** Can reset all or a subset
    of the parameters: CA, EL, ER, IT, LC, and SC.


    **SA - Display and set MP Remote Access


    **T - Enable or disable tablet access


    **N - Enable or disable network diagnostics - was GSP:CM:ND


    **D - Enable or disable DIAG menu - Lockdown needed to activate


    **EL - Enable LAN Console Access:** Enables access to sms for MP LANs. Enable
    disable diag access over LAN also.


    **ER - Enable Remote Console Port Access:** Enables disable remote console serial
    port access.


    **DP - Secure login on remote serial access. RP8400/7410 - Remote access is enabled.


    **IF - Network Interface Information:** Displays information about the network
    interfaces on the MP. Brief or Verbose. SBC = priv lan Lan = 1, SBCH = customer
    lan = 0.


    **LC - LAN Configurations:** Modifies the LAN configuration for the MP(n). The
    user can set the host, name, mask and gateway.


    **ND - Disable Network Diagnostics:** Enable to allow J/JET offline diags and
    FW(UU) to operate.


    See MP:CM:SA for


    **OSP - Onboard Scan Programming Utility:** RP8400/74xx etc only.


    **PWRGRD - B1 B0/4xx Pwr Grid: 1 = A0+A1, 2 = B0+B1, 3 = 1 & 2 (74xx:4=A0+B0,
    5=A1+B1)


    **View - B1 A1 B0.


    **SO - Security Options and Access Control:** Modifies security options and access
    control to the MP: 1=MP Wide Parameters; 2=User Edit, Admin or Del Parameters;
    3=IPMI password. .sms "ipmiacd" uses this users. Admin and Oper are by default.
    User "Serv" has to be added.


    **MP MAIN MENU:** Two options only accessible by user Admin.


    +   - FW: Firmware Update (Connects to flip server - usually SMS)


    +   - Enter new server IP address


    +   - Enter new firmware source directory;


    +   - Enter new user name


    **DIAG: Diagnostic Menu (Wtec can grant lockword on needed basis.)


    +   - DM: Diagnostic Message Viewer


    +   - DE: Diagnostic event viewer


    +   - DS: Diagnostic shell


    +   - Q: Quit


    **MFG - Enter Manu. Level Command Mode:** These commands are intended for HP internal
    use only. Need lockword to access.'
