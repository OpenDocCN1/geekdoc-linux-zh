  md: 'This does indeed result in all the files of /var/log being copied to the directory
    /tmp/log.


    You can also use tar combined with find to produce an incremental backup of your
    system. An incremental backup is one which includes only files that have changed
    over a specified time period.


    Running the following find command produces a file that contains only the names
    of files that have changed in the last 24 hours:


    ```

    # find / -mtime -1 -print > /tmp/daily.backup.list

    ```


    We could then take the list of files in /tmp/daily.backup.list and use this file
    as input to tar with the following command:


    ```

    # tar -cv -T /tmp/daily.backup.list -f /dev/st0

    ```


    Note that in this example (unlike some of the earlier ones), we do need to include
    dashes for the options to be read. The -cv creates and archives with verbose output
    and the option -T indicates that the file contains a list of files to be included
    in the archive. The -f indicates the file to which the archive will be written
    which, in this case, is your tape drive.


    You often download files that have been compressed with gzip from the Internet.
    Such files have an extension of .gz. You would first unzip them with gunzip and
    then use tar -xf to extract the archive as shown here:


    ```

    # ls

    files.tar.gz

    # gunzip files.tar.gz

    # ls

    files.tar

    # tar -xf examples.tar

    # ls

    files.tar file1 file2 file3

    #

    ```


    This is a commonly performed procedure after downloading files.'
