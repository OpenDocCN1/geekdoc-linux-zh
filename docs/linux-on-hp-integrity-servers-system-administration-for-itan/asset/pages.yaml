    System administrators get a lot of use of cron by scheduling many time and resource-consuming
    jobs during off hours. A typical task that is scheduled at night hours.


    The following hybrid example shows how a system administrator would schedule the
    full backup on day 6 and the incremental backup on other days. This is a hybrid
    example whereby you would substitute actual commands for the "full backup command"
    and "incremental backup commands:'
