  md: '# Adding and Partitioning a SCSI Disk on an Integrity Server


    Many other Linux commands support many different types of file systems. When you
    issue the mount command, for instance, you can use the -t option to specify the
    type of file system you want to mount. The man page for the mount command lists
    many types of file systems that can be used with the -t option.


    For example, one common file system I often mount on Linux IA-32 systems is a
    DOS floppy disk. You probably won''t be doing this on an Integrity server, but
    it''s good to know anyway. To use a DOS floppy disk, use the following commands
    to mount a DOS floppy, copy a file to it, and unmount it on an IA-32 system. (Note
    that in most cases, you must be logged in as root to mount files.)


    ```

    # mount -t mdsos /dev/fd0 /mnt/floppy

    # cp * /mnt/floppy

    # ls /mnt/floppy

    file1 file2 file3 file4

    # mount /dev/fd0

    ```


    This sequence of commands first mounts /dev/fd0, which is the floppy disk device
    file. At the mount point /mnt/floppy, /dev/fd0 is mounted as type mdsos, as specified
    by the -t mdsos. I copy all files in the current directory to the floppy. All
    the files on the floppy are then listed with ls, unmounting the floppy with the
    unmount command so that I can take the DOS system and read the files. Because
    the floppy was mounted as type mdsos, the files were written to the floppy in
    DOS format.


    Similarly, to mount a CD-ROM on a Linux system, you would issue the following
    mount command, unless it''s mounted. This CD-ROM is, of course, a read-only device,
    as the message from mount indicates:


