  md: '# Chapter 11


    # Samba


    Samba is an application that allows a Linux or UNIX host to act as a file server
    for Windows systems and Windows systems can access UNIX file systems and printers
    using their native Windows networking. This chapter demonstrates a Linux system
    mounting a Windows drive and a Windows system mapping a Linux drive.


    This section gives an overview of the setup of Samba and demonstrates a subset
    of its functionality. This procedure works the same for the IA-32 and Integrity
    servers used throughout this book; that is, the Samba setup and concepts are the
    same. I performed the same Samba procedure on both the Integrity Advanced Server
    system and the Red Hat 8.x IA-32 system. The procedure is identical on both platforms.
    As a sidenote, the “retail” versions of Red Hat, such as 8.x used in this section,
    has been replaced by Fedora Fedora Project is a Red Hat-sponsored and community-supported
    open source project. Fedora Core 2 is available at the time of this writing.


    Samba provides its file-sharing functionality using Server Message Block (SMB)
    protocol. SMB runs on top of TCP/IP. In this section''s example, both the Windows
    system and UNIX system are running TCP/IP and SMB. These provide all the technology
    that is required to establish file sharing between the two systems.


    At the time of this writing, Samba contains the functionalities just mentioned:
    file-sharing, printer sharing, and advanced user access control of files. There
    are many advancements taking place with Samba and other soft-'
  merge: -1
  pgno: 304
- img_proc: true
  md: 'ware provided under GNU Public License (GPL) as free software. Because the
    software is free, many individuals have access to it and spend time enhancing
    the software. For this reason, you may find that additional functionality is included
    in Samba and other such software.


    # smb.conf Setup


    Because Samba is supplied on the Red Hat Linux CD-ROM, we''ll walk through a simple
    Samba setup using Red Hat Linux. When installing Red Hat Linux, you can select
    the software packages you want to load, as you can on most all UNIX variants.
    If you did not load Samba at the time you originally loaded the operating system,
    you can use a graphical RPM tool or rpm from the command line to load Samba or
    any other software. These tools were briefly discussed in the Chapter 10 covering
    System Administration.


    The configuration file for Samba is /etc/samba/smb.conf. The smb.conf file has
    all Samba-related setup information in it. For our simple Samba setup in this
    chapter we need to have only a few lines in the file setup. You need to have a
    few Global Settings and Share Definitions in order to achieve file sharing between
    Windows and Linux systems. The following are three select sections from smb.conf
    that were modified for the example in this section:


    ```

    # workgroup = NT-Domain-Name or Workgroup-Name

    workgroup = DEVENV

    ```


    ```

    encrypt passwords = yes

    smb passwd file = /etc/samba/smbpasswd

    ```


    ```

    [homes]

    comment = Home Directories

    browseable = yes

    writable = yes

    valid users = %S

    create mode = 0664

    directory mode = 0775

    ```'
  merge: -1
  pgno: 305
- img_proc: true
  md: '+   1. You have a workgroup of DEVENV specified.


    +   2. You want your passwords to be encrypted; you want to use the file /etc/samba/smbpasswd
    for these encrypted passwords. You’ll have a user on both the Windows and Linux
    systems with the same name.


    +   3. You have some information related to your Share Definitions, such as making
    the Home Directories browseable.


    You made only these three modifications to the smb.conf file; however, next you’ll
    run a Samba utility called testparm. This utility checks your /etc/smb.conf file
    for errors. This utility produces a long output that I won’t include here, but
    you’ll want to run this and check for any warnings or errors it produces:


    # # testparm smb.conf


