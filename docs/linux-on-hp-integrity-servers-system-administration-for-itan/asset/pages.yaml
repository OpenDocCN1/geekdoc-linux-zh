  md: '# Chapter 4 Disk and File System Topics


    /sbin Contains commands and scripts used to boot, shut down, and fix file system
    mounting problems.


    /tmp A free-for-all directory, where any user can temporarily store files. Because
    of the loose nature of this directory, it should not be used to store anything
    important, and users should know that whatever they have stored in /tmp can be
    deleted without notice. Application working files should go in /var/tmp or /var/opt/appname,
    not in /tmp.


    /usr Most of the UNIX operating system is contained in /usr. Included in this
    directory are commands, libraries, and documentation. A limited number of subdirectories
    can appear in /


    /var Holds files that are primarily temporary. Files such as log files, which
    are frequently deleted and modified, are stored here. Think of this as a directory
    of "variable" size. Files that an application or command create, at runtime would
    be placed in this directory, including logfile and spool files. However, some
    applications, including init scripts, may store state information in /var.


