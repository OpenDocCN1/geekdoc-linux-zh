    \ operator and administrator users\n* Multiple access:\n  Local Port: use terminal\
    \ or laptop console for direct connect\n  Remote/modem Port: use dedicated modem\
    \ RS-232 port and external modem LAN: use telnet or web to access MP LAN\n* Mirrored\
    \ console: The console and output stream is reflected to all of the connected\
    \ consoles, and any user can provide input.\n* Display/and logging of:\n  The\
