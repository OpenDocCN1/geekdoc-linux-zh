    blk2 : Acpi(HWP0002,100)/Pci(1/0)/Scsi(Pun0,Lun0)/HD(Part1,Sig7CF0F000)

    blk3 : Acpi(HWP0002,100)/Pci(1/0)/Scsi(Pun0,Lun0)/HD(Part2,SigC9D597F0DA-0BA7-11D7-9B31

    blk4 : Acpi(HWP0002,100)/Pci(1/0)/Scsi(Pun0,Lun0)/HD(Part3,SigC9D7945C-0BA7-11D7-9B31

    blk5 : Acpi(HWP0002,100)/Pci(1/0)/Scsi(Pun0,Lun0)/HD(Part4,FBAAECDAF77E)

    blk6 : Acpi(HWP0002,100)/Pci(1/0)/Scsi(Pun0,Lun0)/HD(Part1,Sig7CF0F000)

    blk7 : Acpi(HWP0002,100)/Pci(1/0)/Scsi(Pun0,Lun0)/HD(Part2,Sig7CF0F000)

    ```


    The device mappings can be difficult to read. As a system administrator, the information
    is intended for programmers and technicians. however, you need to know which entries
    correspond to which devices and which partitions and file systems. To determine
    that, let''s take a look at each entry.


    As you probably guessed, file systems begin with fs and block devices begin with
    blk list. To understand these entries however, let''s look at them individually.
    To make their meaning clearer, I''ve grouped the entries differently than they
    originally appeared in the EFI listing previously shown.


    Red Hat Advanced Server disk and related entries:


    +   blk1 physical disk

    blk2 is first partition on blk1

    blk3 is second partition on blk1

    blk4 is fourth partition on blk1

    fs0 is first partition on blk1


    HP-UX 11 disk and related entries:


    +   blk5 physical disk

    blk6 is first partition on blk5

    blk7 is second partition on blk5

    fs1 is first partition on blk5


    Let''s analyze one of the block (blk) entries:


    ```

    blk1 : Acpi(HWP0002,100)/Pci(1|0)/Scsi(Pun0,Lun0)

    ```


    blk is the label assigned to the physical device and the 1 is the number of the
    physical device as blk can also be a partition on a physical device as we''ll
    see shortly. Acpi(HWP0002,100) first shows a device type of HWP0002 with a PCI
    host number of 100. This PCI host number is often called the ROPE. The ROPE is
    the circuitry that handles I/O for the PCI interface. Although'
  merge: -1
  pgno: 36
- img_proc: true
  md: 'this information is most used by programmers, it is sometimes handy

    to know the ROPE since since it also defines the I/O card slot. The following
    types

    of devices are the most common:


    HWP0001: Single I/O Controller Single Block Address w/o I/O Controller in the
    namespace.

    HWP0002: Logical Block Address (LBA) device.

    HWP0003: AgP LBA device.


    After the ROPE we find a Pci entry. This entry indicates that the

    dev/slot number is 1 and the function number is 0.

    The Scsi Pun (physical unit) will be either 0 or 1 depending on which is

    the SCSI address of the disk. The Lun (logical unit) will always be 0 in this

    case because you''re not assigning any Logical Units on the disks. Let''s

    look at the blk2 entry:


    blk2 : Acpi (HWP0002,100)/Pci (1|0)/Scsi(Pun0,Lun,Lun0) /

    HD(Part1,Sig8E89981A-0B97-11D7-9C4C-AF8705217DA)


    The blk2 entry is a partition on the blk1 device. All of the information

    is the same for the two entries except for the additional partition-related

    beginning with Part1. Part1 indicates this is the first partition

    on physical device blk1 with an EFI signature beginning with Sig. blk3 and

    blk4 are additional partitions that we created when we loaded Advanced

    Server on this disk and created three partitions. The first group ends the

    fs0 entry:


    fs0 : Acpi (HWP0002,100)/Pci (1|0)/Scsi(Pun0,Lun,Lun0) /

    HD(Part1,Sig8E89981A-0B97-11D7-9C4C-AF8705217DA)


    Notice that the fs0 line matches blk1 and blk2 from a path perspect-

    tive. To summarize, what is a file system readable by EFI; it begins with we see
    a physical device blk1 that has one on it

    EFI partition blk2 and a file system fs0. All three of these are listed as sepa-

    rate entries in EFI. In addition, blk3 and blk4 are partitions on the

    physical device blk1.


    The same applies to physical unit 1, which is Pun1. It too

    has two partitions at blk6 and blk7. fs1 is the file system that is on disk. It

    is the HP-UX disk in our configuration:


    blk0 : Acpi (HWP0002,0)/Pci (2|0)/Ata (Primary, Master)


    The blk0 device in the list is the DVD-ROM. The Ata (Advanced Tech-

    nology Attachment) is the official name that American National Standards'
  merge: -1
