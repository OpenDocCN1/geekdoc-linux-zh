  md: '# Commonly Used Commands


    This section looks at many commands that you can issue from the command line to
    view and setting networking-related parameters, including ping, netstat, route,
    ifconfig, rpcinfo, arp, and iptables.


    # ping


    ping is one of the most commonly used networking commands. ping stands for Packet
    InterNet Groper. This command determines whether a connection exists between two
    networking components. ping is a simple command that sends an ICMP echo packet
    to the host you specify once per second. You''ll find that the options of ping
    differ when issuing on Linux and UNIX.


    The following example shows issuing ping with a count (-c) of 5, and a packet
    size of 1024:


    ```

    # ping 192.168.1.1 -c 5 -i 5 -s 1024

    PING 192.168.1.1 (192.168.1.1) from 192.168.1.102 : 1024(1052) bytes of data.

    1032 bytes from 192.168.1.1: icmp_seq=1 ttl=150 time=2.79 ms

    1032 bytes from 192.168.1.1: icmp_seq=2 ttl=150 time=2.80 ms

    1032 bytes from 192.168.1.1: icmp_seq=3 ttl=150 time=2.79 ms

    1032 bytes from 192.168.1.1: icmp_seq=4 ttl=150 time=2.79 ms

    1032 bytes from 192.168.1.1: icmp_seq=5 ttl=150 time=2.77 ms


    --- 192.168.1.1 ping statistics ---

    5 packets transmitted, 5 received, 0% loss, time 200236ms

    tr min/avg/max/mdev = 2.775/2.792/2.804/0.048 ms

    ```


    Many useful statistics are produced as a result of ping. Notice that it took around
    2.75 ms for the 1024 packet size. This is substantially less if you use the default
    64 bit packet size:


    ```

    # ping 192.168.1.1 -c 5 -i 5

    PING 192.168.1.1 (192.168.1.1) from 192.168.1.1 : 56(84) bytes of data.

    64 bytes from 192.168.1.1: icmp_seq=1 ttl=150 time=0.655 ms

    64 bytes from 192.168.1.1: icmp_seq=2 ttl=150 time=0.626 ms

    64 bytes from 192.168.1.1: icmp_seq=3 ttl=150 time=0.608 ms

    64 bytes from 192.168.1.1: icmp_seq=4 ttl=150 time=0.626 ms

    64 bytes from 192.168.1.1: icmp_seq=5 ttl=150 time=0.659 ms

    ```'
  merge: -1
  pgno: 216
