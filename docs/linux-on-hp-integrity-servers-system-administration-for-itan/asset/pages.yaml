  md: "# Additional Samba Topics\n\n# Samba Web Configuration Tool (SWAT)\n\nSWAT\
    \ is a Web-based administration tool for Samba. It is easy to configure and provides\
    \ a simple interface for most Samba configuration tasks. On your Red Hat Linux\
    \ system, the following steps had to be performed to get SWAT running. If you\
    \ have a different UNIX variant, your steps will be different.\n\nEdit the file\
    \ /etc/xinetd.d/swat and change disable to no as shown in the following list:\n\
    \n```\n# default: off\n# description: SWAT is the Samba Web Admin Tool. Use swat\
    \ \\\\\n#             to configure your Samba server. Use SWAT, \\\n#        \
    \     connect to port 901 with your favorite web browser.\nservice swat\n{\n \
    \   port = 901\n    socket_type= stream\n    wait = no\n    only_from = 127.0.0.1\n\
    \    user = root\n    server = /usr/sbin/swat\n    log_on_failure+= USERID\n \
    \   disable = no\n}\n```\n\nRestart xinetd with the following command:\n\n```\n\
    # /sbin/service xinetd restart\n```\n\nFrom your browser, specify a location of\
    \ localhost:901 and enter the root user and password when prompted for them.\n\
    \nFigure 11-5 shows the SWAT interface. It includes links for HOME, GLOBALS, SHARES,\
    \ PRINTERS, STATUS, VIEW, and PASSWORD and documentation on several important\
    \ Samba topics."
