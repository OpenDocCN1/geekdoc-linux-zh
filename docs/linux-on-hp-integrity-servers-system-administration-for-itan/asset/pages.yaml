  md: '# Obtaining Samba


    In the examples used throughout this chapter, we set up Samba on a Linux

    system that had Samba installed on it as part of the Red Hat 8.x Linux CD-

    ROM. Samba is included on the Red Hat Advanced Server distribution that

    isupplied with HP Integrity server. If Samba does not come on the CD-

    ROM provided with your UNIX variant, or if you want to be sure that you’re

    loading the very latest Samba, you can obtain Samba from the Web.


    www.samba.org is the place to start. From this Web, you can select

    a "download site" in your country. You can also select "Web sites" on

    www.samba.org that provides a wealth of information on Samba, including

    the GNU General Public License mentioned earlier in this chapter.


    There is extensive documentation on Samba-related Web sites, includ-

    ing detailed descriptions of the programs that I listed earlier and used in this

    chapter.


    If you decide to download Samba, you’ll probably be given an option

    of loading a precompiled Samba on your system or building and compiling

    Samba yourself. The choice you make depends on a lot of factors. If you

    h a good, reliable Samba distribution, as we did in this chapter when

    working with Red Hat Linux, working with a precompiled Samba may be

    best. If you’re interested in learning more about how Samba works and is

    configured, and want the very latest and greatest version, download the

    source and compile it yourself.


    Even if you have a great prepackagedaged Samba, as we did in this chapter,

    it is still worth visiting the Samba-related Web sites to view the extensive

    documentation available.'
  merge: -1
