  md: '# Users and Groups


    247


    areas, such as the root file system and application areas.

    The **passwd** file has a way of getting out-of-date on a regular basis.

    Users come and go, and in general, there are continuous changes made to this file.
    There is a program on Linux variants called **pwck** that checks the integrity
    of the **passwd** file. Interestingly, this program is often accessible to users
    and as the system administrator. The following example shows running **pwck**
    on the default file used for passwords:


    ```

    # pwck

    user adm: directory /var/adm does not exist

    user news: directory /var/spool/news does not exist

    user uucp: directory /var/spool/uucp does not exist

    user gopher: directory /var/gopher does not exist

    user ftp: directory /var/ftp does not exist

    pwck: no changes

    #

    ```


    This example shows that the login directory for several users does not exist.
    This absence may not be a problem, because some applications require a login name,
    but no home directory is required as those shown. On the other hand, there are
    usually users on the system for which there is no login directory because the
    directory was removed when the user left the company but their entry in **passwd**
    was not removed. **pwck** validates the following information in the password
    file you specify (this is **passwd** by default):


    +   * Correct number of fields

    * Login name

    * User ID

    * Group ID

    * Login directory exists

    * Valid primary group

    * User''s default shell exists


    **pwck** is a useful program that is underused. I often run audits for system
    administrators to check the health of their systems and include this program under
    the many security checks. There is no response if **pwck** finds errors or warnings
    to report.'
