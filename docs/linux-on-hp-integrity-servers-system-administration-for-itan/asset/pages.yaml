  md: '# # /etc/ifconfig eth0 192.168.1.102 netmask 255.255.255.0 broadcast 192.168.1.255


    In this example, you set the IP address, netmask, and broadcast address of eth0.
    Because this is a Class A, you did not have to specify the netmask and broadcast
    because the values specified are the calculated values. For other classes, you
    would have to specify these values.


    The network address you have falls into classes such as A, B, or C, as covered
    in the previous chapter. You must be sure to know the class of your network before
    you start configuring your LAN interface. For a Class B network, the netmask is
    defined as ffff000 (typical for a Class B address), as opposed to fffff00, which
    is typical for a Class C network. The netmask determines how much of the address
    to reserve for subdividing the network into smaller networks.


