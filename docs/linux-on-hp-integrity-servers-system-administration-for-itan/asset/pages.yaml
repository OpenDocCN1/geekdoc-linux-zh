  md: '# # Assigning Users to Groups


    After defining all user-related information, the system administrator needs to
    consider groups. Groups are often overlooked in the Linux environment until the
    system administrator finds that all his her users are in the same group, even
    though from an organizational standpoint they are in different groups. Before
    I cover the groups in general, let''s look at a file belonging to a user and the
    way access is defined for a file:


    ```

    # ls -l backup.sh

    -rwxr-xr--  1 linuxconnect users  1977 Jan 1 23:31 backup.sh

    ```


    For every file on the system, Linux supports three classes of access:


    +   - User access (u). Access granted to the owner of the file

    - Group access (g). Access granted to members of the same group as the owner of
    the file

    - Other access (o). Access granted to everyone else


    These access rights are defined by the settings on the permissions of r (read),
    write (w), and execute (x) when the long listing command is issued. For the long
    listing (ls -l) above, you see the permissions in Table 10-1.


    # Table 10-1 Long Listing Permissions


    | Access | User Access | Group Access | Other |

    |---|---|---||}{

    | Read | r | r | - |

    | Write | w | - | - |

    | Execute | x | x | x |


    You can see that access rights are arranged in groups of three. Three groups of
    permissions exist with three access levels each. The owner, in this'
  merge: -1
  pgno: 277
- img_proc: true
  md: '# Users and Groups


    case, linuxconnect, is allowed read, write, and execute permissions on the file.
    Anyone in the group users is permitted read and execute access to the file. Others
    are permitted only execute access of the file.


    These permissions are important to consider as you arrange your users into groups.
    If several users require access to the same files, the system administrator will
    want to put those users in the same group. The trade-off here is that you give
    all users group rw access to files, but then you run the risk of several users
    editing a file without other users knowing it, thereby causing confusion. On the
    other hand, you can make several copies of a file so that each user has his or
    her personal copy, but then you have multiple versions of a file. If possible,
    assign users to groups based on your work.


    The /etc/group file contains the group name, an encrypted password (which is rarely
    used), a group ID, and a list of users in the group. Here is an example of an
    /etc/group file:


    ```

