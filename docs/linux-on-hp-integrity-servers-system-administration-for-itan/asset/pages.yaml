  md: '# Installing Red Hat Advanced Server Using the Serial Console


    This section covers Red Hat Advanced Server using the console-only. The console-only
    installation is focused on because many of the machines needing Advanced Server
    will not have a graphics display connected to them. Console-only installation
    has some nuances, so you should perform the steps outlined here. Please keep in
    mind that there be modifications at any time, so your console installation might
    look slightly different. Graphical installation is straightforward and documented
    in most Linux books. Even if you have a graphics display on your Integrity system
    you would still begin installing Advanced Server at the console. The graphical
    part of the Advanced Server installation begins after the Advanced Server CD-ROM
    is booted. Control will be automatically switched to the graphical display if
    you have a VGA port on your server. The installation selections are the same whether
    you are using the graphical installation or console, this chapter applies if you
    have graphics as well. Still, for the reasons mentioned, this chapter focuses
    only on the text-based console installation.


    The first product that you will install is the HP Enitlement Kit for Linux (sometimes
    called LEK), which is a set of tools to provide a framework for installing, configuring,
    and recovering a Linux distribution on the Integrity server. The kit is completely
    distribution agnostic meaning it is independent of a Linux distribution. You''ll
    be installing Red Hat Advanced Server only in this book, but other Linux variants
    can be installed on some Integrity servers so the LEK needs to be independent
    of a specific Linux variant. The kit also provides a framework for delivering
    platform-specific drivers and updates. The kit is a workstation enrolment kit
    and server enablement kit. You''ll use the server LEK in the upcoming example.
    The elilo program used later to bootstrap your Integrity system was provided as
    part of the HP Enitlement Kit for Linux.


    To begin the installation process, boot the system and the Extensible Firmware
    Interface (EFI) menu was covered in Chapter 1 (see "Working with EFI" on page
    5). This menu offers a variety of boot options as shown in Figure 2-1. We first
    want to install the HP Enitlement Kit for Linux, which puts boot and service partitions
    on our destination disk. You''ll install the Advanced Server software.


    Note that you may want to remove (or disable by disconnecting them from the power
    supply) any disks that already have other operating systems installed. That way,
    you don''t run the risk of overwriting any of the other operating systems with
    the new installation. In the upcoming screen shots,'
