    Now, the loadable modules have been compiled and installed in the correct directories.
    Loadable modules are included (by being linked) or removed from the kernel while
    it is running. This means that the kernel binary does not have to be changed to
    include or exclude the module. In addition, the kernel is smaller because the
    drivers are not loaded unless they''re needed. Modules are loaded into the kernel
    with insmod and removed with rmmod.


    Loadable kernel modules are usually located at /lib/modules-version. You can view
    the currently loaded modules on your IA-32 Red Hat 8.x system with the lsmod command,
    as shown in the following:'
