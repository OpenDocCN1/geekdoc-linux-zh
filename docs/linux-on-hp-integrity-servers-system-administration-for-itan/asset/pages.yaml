  md: 'There is also extensive online documentation for all Samba-related software
    at www.samba.org.


    # Samba Utilities and Programs


    You have used several Samba utilities and programs in this chapter. The following
    list gives a description of the most often used Samba-related commands. There
    are manual pages for all these, which are part of most Samba installations:


    +   * **smbd** - This daemon provides file and print services to SMB clients,
    such as the Windows system used in the examples throughout this chapter.

    * **nmbd** - This daemon provides NetBIOS name server capability and browsing.

    * **smclient** - A program that gives the server access to remotely mounted SMB
    shares on other servers.

    * **testparam** - A test program for /etc/smb.conf.

    * **smbstatus** - Program that displays status information about current Samba
    connections.

    * **smbpasswd** - Program used to change a user’s SMB password on the local machine.

    * **smbrun** - Program that runs shell commands for **smbd**.

    * **smbtar** - Program to back up SMB shares directly to a UNIX tape drive.

    * **smbmount** - Used to mount an SMB file system.

    * **smbumount** - Used to unmount an SMB file system.'
  merge: -1
