  md: '# Signals


    ```

    # ps -ef | grep find 3555 4 19:05 pts/1  00:00:00 find / -name "*.sh -print

    root      29012 3555

    root      29021 28928  0 19:06 pts/3  00:00:00 find

    # kill 29012

    # ps -ef | grep find

    root      29025 28928  0 19:06 pts/3  00:00:00 grep find

    ```


    The example shows killing process 29012, which is a find command. We confirm that
    the process has indeed been killed by reissuing the ps command.


    You can kill several processes on the command line by issuing kill followed by
    a space-separated list of all of the process numbers you want to kill.


    Take special care when killing processes if you are logged in as superuser. You
    may adversely affect the way the shell runs and have to manually restart processes
    or reboot the system.


    In the shell programming chapter, there are two shell programs to you search for
    and then kill processes.


    # Signals


    When you issue the kill command and process number, you are also sending a default
    signal associated with the kill. You did not specify a signal in the kill example.
    That means the default signal of 15, or SIGTERM, was used. These signals are used
    by the system to communicate with processes. The signal of 15 you used to terminate
    the process is a software termination signal that is usually enough to terminate
    a user process such as the find you started. A process that is difficult to kill
    may require the SIGKILL, or 9 signal. This signal causes an immediate termination
    of the process. I use this only as a last resort because processes killed with
    SIGKILL do not always terminate smoothly. The shell processes such as the shell,
    you sometimes have to use SIGKILL.


    You can use either the signal name or number. These signal numbers sometimes vary
    from system to system, view the manual page for signal in manual page section
    7 to see the list of signals on your system. A list of some of the most frequently
    used signal numbers and corresponding signals follows:'
  merge: -1
