  md: '# Scheduling Cron Jobs


    $ crontab -l


    00 2 * * 6 full backup command

    15 12 * * 1-5 incremental backup command


    The first entry is the full backup, and the second entry is the incremental backup.
    In the first entry, the minute is 00; in the second entry, the minute is 15. In
    the first entry, the hour is 2; in the second entry, the hour is 12. In both entries,
    the month and month are all legal values (*), meaning every month. In the first
    entry, the weekday is 6 for Saturday (0 is Sunday); in the second entry, the weekdays
    are 1-5, or Monday through Friday. The optional user name is not specified in
    either example. Finally, the backup command is provided:


    | minute hour month month weekday user name command |

    | 00 2 all all 6 n/a full backup |

    | 15 12 all all 1-5 n/a incremental |


    Another common use of cron for system administrators is to find core files on
    a daily or weekly basis. Core files are images of memory written to a disk when
    a problem of some kind is encountered on the system. They can be written in a
    variety of places on the system depending on the problem. These files can sometimes
    be used to identify the source of the problem, system administrators like to keep
    track of them. The following find command will run once a week to find core files
    that have not been accessed in a week and writes the core file names to the home
    directory of root:


    00 2 * * 6 find / -name core -atime 7 > /root/core.files


    The system administrator checks this file on Monday to see what core files have
    been produced over the last week. Similar to the backup example, this check is
    run every Saturday at 2:00 AM.


    Users sometimes set up cron entries to invoke large compilations or large batch
    jobs during the night when the system is not heavily used. As'
