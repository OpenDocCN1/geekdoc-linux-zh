  md: '# Webmin


    Let''s take a look at a GUI management tool that you can download to a Linux system
    or one of several UNIX variants. The tool is Webmin and is available at www.webmin.com.
    I''m not advocating the use of this particular tool, although I think it is great,
    rather, I''m using it as an example of a tool that you can download and configure
    on a variety of operating systems thereby having a similar tool on many platforms.
    The upcoming steps are on the Web site, but I''ll cover some of the more salient
    aspects of installing webmin. Although I have not used this tool on Integrity
    servers yet I know many of you are experimenting with Linux on IA-32 and may find
    this tool useful.


    We start the process of loading Webmin by downloading the Linux version we want—in
    this case, for Red Hat. The software downloaded for Linux is in RPM format and
    we run the following command:


    ```

    # RPM -U webmin-0.990-1.norarch.rpm

    ```


    This automatically installs Webmin in the /usr/libexec/webmin. There are a lot
    of files created in this directory. Of particular interest are the files beginning
    with config- that show the many distributions of operating systems for terms which
    Webmin is available. There are also directories such as user-min that contain
    files and scripts related user administration through Webmin. To run Webmin, open
    a browser window and connect to:


    ```

    http://linuxdev:10000/

    ```


    The name of the system used in the example is linuxdev, so you would substitute
    the name of your system. This opens up Webmin in your browser window, as shown
    in Figure 10-3.'
