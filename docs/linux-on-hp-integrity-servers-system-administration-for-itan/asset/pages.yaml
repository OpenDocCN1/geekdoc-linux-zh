  md: '# Installing Red Hat Advanced Server Using the Serial Console


    Note that the top screen shot in Figure 2-3 shows more selections than the bottom
    screen shot. The top screen shot was produced with two additional disks in the
    system in addition to the target disk on which we want to install Advanced Server.
    The bottom screen shot was produced with only the target disk physically installed
    in the system.


    In either case, when the Boot From a File menu appears, select Removable Media
    Boot. The menu displayed in Figure 2-4 is displayed.


    ![](img/206f1b2e6e5a335b0dd18c6d72403722_70_0.png)


    Figure 2-4 Loading the Enablement Kit


    To install the HP Enablement Kit for Linux, select the second entry in the list
