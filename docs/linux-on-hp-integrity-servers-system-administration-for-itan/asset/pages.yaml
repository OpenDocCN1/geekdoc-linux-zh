  md: '# # Chapter 1


    # ## Booting: EFI and Management Processor


    This chapter covers an HP Integrity (Itanium-based) server. Booting an Integrity
    server requires that you become familiar with two levels of firmware. The first
    level is HP’s implementation of Intel’s EFI (Extensible Firmware-Interface), POSSE
    (Pre-OS System Environment). The second is HP’s independent support processor
    for the system console, the *Management Processor* (MP). Although functionality
    varies from one platform to another the topics in this chapter apply to all HP
    Integrity servers at the time of this writing. The systems used throughout this
    chapter include a variety of two and four-way Integrity servers.


    This chapter covers the following topics:


    +   - EFI and POSSE

    - Management Processor (MP)


    In addition to providing background on these topics, this chapter also provides
    many examples of running commands and analyzing output for both POSSE and MP.


    At the end, you can use an excellent series of tables as a quick reference for
    many boot-related commands.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# EFI and POSSE


    EFI is an interface between your operating systems and platform firmware.

    POSSE is the HP implementation of EFI that contains additional commands beyond
    the ones available through EFI alone. You''ll use the EFI acronym in this chapter,
    but you should be aware that some HP documentation may use POSSE. EFI is a component
    that is independent of the operating system and provides a shell for interfacing
    with multiple operating systems The interface consists of data tables that contain
    platform-related information along with its boot and runtime service calls that
    are available to the operating system and its loader. These components work together
    to provide a standard environment for booting multiple operating systems.


    If you are interested in finding out more about EFI than what''s documented here,
    take a look at Intel EFI Web site. At the time of this writing, EFI information
    can be found at http://www.intel.com/technology/efi/.


    As you can see in Figure 1-1, EFI on HP Integrity servers contains several layers.
    The hardware layer contains disk with an EFI partition, which in turn has in it
    an operating system loader. This layer also contains one or more operating system
    partitions.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '![](img/206f1b2e6e5a335b0dd18c6d72403722_32_0.png)


    Figure 1-1 EFI on HP Integrity Servers


    In addition, the EFI system partition itself consists of several different components
    as shown in Figure 1-2.'
