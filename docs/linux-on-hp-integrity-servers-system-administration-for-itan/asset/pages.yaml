    shut down your system.


    # Inodes


    You may see messages that include references to inodes when running e2fsck. Inodes
    are control mechanisms in Linux and UNIX that point to data blocks or other nodes
    on your storage subsystem. The inode contains the inode number, the length of
    the file, the file''s creation date, the time the file was last accessed, the
    time the file was changed, the time the inode was last changed, the owner of the
    file and the size of the file, the access rights, direct and indirect pointers
    to blocks of data, device numbers for special files, and a variety of other information.
    In the case of a directory, which is simply a special type of file in Linux, the
    inode points to data blocks that contain important information about the files
    in the directory. Because the inode contains important information and pointer
    information, it is vital to the existence of a healthy file system.


    In addition to inodes, you may also see information related to the superblock.
    The superblock contains important information about the disk on which it resides,
    such as the location of the first inode, the amount of available space, and so
    on.


