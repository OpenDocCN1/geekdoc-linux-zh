    lp 39/tcp resource # resource location

    rlp 39/udp resource # resource location


    As you can see in this example, telnet runs on port 23. This is the standard port
    number for telnet. This is a well-known service for which there is a standard
    port number as is the case for any well-known service.


    You have a lot of control over which ports and services you''ll enable and disable
    on your Linux system. To begin with, let''s use netstat to view all of ports -a,
    not to resolve hostnames -n, and to show both UDP with -u and TCP with -t, in
    the following example:


    ```

    ### netstat -antu

