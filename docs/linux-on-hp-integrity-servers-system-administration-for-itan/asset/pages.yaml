  md: "# Red Hat Package Manager RPM\n\nAlthough the Red Hat Package Manger (RPM)\
    \ sounds as though it may be Red Hat-only product, it is used in many other Linux\
    \ distributions. The command line RPM functionality is easy to understand. What's\
    \ more, many graphical tools have been built around it as well. RPM files contain\
    \ a lot of important information related to software installation as the version\
    \ of the program, installation scripts, a description of the program, and so on.\
    \ If you need more information about RPM, you can get it at www.redhat.org.\n\n\
    The examples in this chapter come from a variety of systems, including the Integrity\
    \ server that you just installed and an IA-32 system. RPM works the same on all\
    \ systems, even though you'll be running 64-bit applications on your Integrity\
    \ and 32-bit applications on your IA-32 systems. Because different versions of\
    \ RPM exist (versions 3 and 4 are available at the time of writing), you need\
    \ to know which version you are running in order to avoid incompatibility.\n\n\
    Let's start by running RPM at the command line. The command rpm -help is used\
    \ in the following listing to give a run down on all the commonly used options:\n\
    \n```\n# rpm --help\nUsage: rpm [OPTION...]\nQuery options (-q or --query):\n\
    \  -C,--confifiles list all configuration files\n  -D,--docfiles list all documentation\
    \ files\n  --dump dump basic file information\n  -l,--list list files in package\n\
    \  --queryformat use the query format\n  -s,--state display the status of the\
    \ listed files\n  -v,--verbose display a verbose file listing\n  -a,--all query/verify\
    \ all packages\n  -f,--file query/verify package owning file\n  -g,--group query/verify\
    \ package(s) in group\n  -p,--package query/verify a package file (i.e. binary\
    \ .rpm file)\n  --querytags display known query tags\n  --specfile query a spec\
    \ file\n  --whatrequires query/verify the package(s) which require a dependency\n\
    \  --whatprovides query/verify the package(s) which provide a dependency\nVerify\
    \ options (with -V or --verify):\n  --nodm5=[0-1] don't verify MD5 digest of files\n\
    \  --nodeps=[0-20000] don't verify package dependencies\n  --noscript=[0-40000]\
    \ don't verify scripts (if any)\n  -a,--all query/verify all packages\n  -f,--file\
    \ query/verify package(s) owning file\n  -g,--group query/verify package(s) in\
    \ group\n  -p,--package query/verify a package file (i.e. binary .rpm file)\n\
    \  --querytags display known query tags\n```"
  merge: -1
