    I often pull the trigger too quickly on a print job and need to cancel it. After
    a job is submitted, you can remove it with the cancel command, along with the
    job id. You can use the job number shown in earlier examples, along with the cancel
    command or use the printer name along with cancel. Small print jobs will normally
    be processed and printed too quickly. Large print jobs, may be canceled before
