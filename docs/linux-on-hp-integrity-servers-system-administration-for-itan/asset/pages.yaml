  md: '# Patching the Kernel


    | File | Function |

    | /proc/sys/fs | Contains file system information. |

    | file-max | Defines the maximum number of open files per process. |

    | inode-max | Present number of inodes. |

    | /proc/sys/kernel | Contains kernel information. |

    | shmaxx | Defines the maximum shared memory size. |

    | shmmn | Defines the maximum number of shared memory segments system wide. |

    | hostname | System hostname. |

    | ctrl-alt-del | Specifies whether system will reboot on ctrl-alt-del key sequence.
    |

    | /proc/sys/net/ipv4 | Contains network information. |

    | ip_forward | Defines whether or not packets will be forwarded between network
    interfaces. |

    | icmp_echo_ignore_all | Defines whether or not ICMP pints are ignored. |

    | ip_local_port_range | Defines range of ports used when originating a connection.
    |


    # Patching the Kernel


    Another common kernel-related task is patching the kernel. With patches, you can
    load a device driver, install and upgrade the kernel, fix a bug, add new features,
    improve performance, and so on. You take your existing kernel to the next minor
    release with patches as well. www.kernel.org/pub/linux/kernel has under under
    containing patches for most kernel releases. The v2.5 directory has patches for
    version 2.5.


    You normally work in the /usr/src/linux directory when performing any kernel work.
    After moving to this directory, you would apply a patch with the following command:


    ```

    # patch -pnum < patch_file

    ```'
