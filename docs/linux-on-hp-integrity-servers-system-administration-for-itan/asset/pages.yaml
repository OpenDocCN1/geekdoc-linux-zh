- img_proc: true
  md: '# Commonly Used Commands


    Packets are the basis of network traffic on a Linux system. The beginning of a
    packet is the header and the data of the packet is in the body. potentials is
    a packet filter which means it determines whether your Linux system will ACCEPT
    (let the packet through,) DROP (discard the packet,) RETURN (stop traversing this
    chain and resume at the next rule in the calling-chain,) or QUEUE (pass the packet
    to user space.)


    You may want to control packets coming to and from your Linux system for a variety
    of reasons, most of which are related to security. For example, you may not want
    those without accounts on your system to be establish a telnet connection to your
    system. It may be that your system may be used for a specific function and you
    don''t want anyone from an outside network to connect to your system. This is
    not a security section and it only provides an introduction to iptables. If you
    are interested in security, you may want to read a document dedicated to network
    security. If you believe you are vulnerable to attack, you may want to implement
    more extensive security measures than what''s covered here. This section covers
    only the basics of iptables.


    The changes you make using iptables are not permanent because they''re stored
    in the currently running kernel. If you want these changes permanent, the iptables
    commands you issue can be included in a script and run at the time of system boot
    to be reinitiated. Be sure to make the script executable by root and run it. Two
    commands help with saving and restoring iptables, and iptables-save and iptables-restore,
    that also help with re-running iptables commands.


    With iptables, you are inserting and deleting rules that govern packet filtering
    in the kernel''s packet filtering section. When a packet is received it is compared
    to a checklist of rules and appropriate action is taken with the packet. This
    list of rules, called a chain, are compared to the packet header and if there
    is a match between the rule and the packet, action is taken based the rule.


    There are three chain types: INPUT, FORWARD, and OUTPUT. A packet is evaluated
    based on it''s type. The DROP, ACCEPT, QUEUE, or RETURN action is taken relative
    to which of the three types of chain is being used. Figure 8-1 shows the relationship
    between the three types of chains.'
  merge: -1
  pgno: 228
- img_proc: true
  md: '![](img/206f1b2e6e5a335b0dd18c6d72403722_229_0.png)


    Figure 8-1 iptables Processing


    This is a widely used diagram that you''ll see in almost any document that describes
    iptables.

    Look at a couple of simple examples to see how iptables is used. To DROP ftp for
    everyone, we would issue the following command:


    ```

    # iptables -A INPUT -p tcp --destination-port 21 -j DROP -i eth0


    # iptables --list

    Chain INPUT (policy ACCEPT)

    target    prot opt source      destination

    DROP      tcp    anywhere         anywhere       tcp dpt:ftp

    nChain FORWARD (policy ACCEPT)

    target    prot opt source      destination


    Chain OUTPUT (policy ACCEPT)

    target    prot opt source      destination

    #

    ```'
  merge: -1
  pgno: 229
- img_proc: true
  md: '# Commonly Used Commands


    Any attempts to connect to port 21 will now DROP as indicated by the output of
    the iptables--list command. The iptables command appends a new rule to the input
    chain (with -A), specifies a protocol of tcp(with -p), specifies a destination
    of port 21, which corresponds to ftp (with --destination-port 21), specifies a
    rule of DROP (with -i), and specifies an interface of eth0 to initiate an ftp
    connection to eth0 will now be dropped. FTP requests coming from any other interface
    as eth1 are not dropped.


    Remove this rule with the following command:


    ```

    # iptables -D INPUT -p tcp --destination-port 21 -j DROP -i eth0

    # iptables --list

    Chain INPUT (policy ACCEPT)

    target      prot source      destination

    Chain FORWARD (policy ACCEPT)

    target      prot source      destination

    Chain OUTPUT (policy ACCEPT)

    target      prot source      destination

    ```


    Again, the -D has removed the ftp restriction on port 21, so you could now initiate
    an ftp session with port 21 on eth0. Keep in mind what we have done with the first
    command was to DROP any attempt to use port 21 which corresponds to ftp. As you
    can see in the following output, both ftp and wu-ftp are configured to run:


    ```

    # chkconfig --list | grep ftp

    ftp:        on

    wu-ftpd:     on

    ```


    If you don''t know the port numbers for your internet services, you can view the
    /etc/services file. It contains mappings between internet services and their assigned
    port numbers. The following shows the first 30 or so lines of /etc/services on
    the system used for the iptables examples:


    ```

    # /etc/services

    # $: services.v 1.31 2002/04/03 16:53:20 noting Exp $

    # Network services, Internet style

    # Note that it is following the policy of IANA to assign a single well-known

    # port number for both TCP and UDP, most entries here have two entries

    # where the protocol support UDP operations.

    # Updated from RFC 1700, ''Assigned Numbers'' (October 1994). Not all ports

    # are included, only the common ones.

    # The latest IANA port assignments can be gotten from

    # http://www.iana.org/assignments/port-numbers

    # The Well Known Ports are those from 0 through 1023.

    ```'
