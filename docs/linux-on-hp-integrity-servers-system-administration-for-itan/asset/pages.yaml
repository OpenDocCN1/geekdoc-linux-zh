    # Printing


    UNIX and UNIX-like systems run a variety of programs related to printing called
    lp (for line printing). These programs work together to support printing of text
    files, formatted documents, graphics files, and so on. This section covers the
    basics of printing, including some of the basics of printer administration.


    To simply print a file called mbox, you would use the lp (short for line printer)
    command, as shown in the following example:'
  merge: -1
  pgno: 291
- img_proc: true
  md: '# Printing


    martyp $ lp mbox

    Job number is: 1

    martyp $


    In this example, you requested that the file mbox be printed. You receive a return
    message from lp, indicating the request identification number. You can print multiple
    files with one lp request, as shown in the following-ing example:


    ```

    martyp $ ls -l

    total 80

    -rw-r-- 1 martyp usr 350 Sep 27 07:22 dead.letter

    -rw-r-- 1 martyp usr 2476 Sep 6 07:07 inst.out

    -rw-r-- 1 martyp usr 0 Aug 21 06:45 lanadmin.list

    -rw-r-- 1 martyp usr 1485 Sep 27 08:20 mbox

    -rw-r-- 1 martyp usr 353 Sep 29 04:57 trip

    martyp $ lp t* perf 635 Mar 21 1999 typescript

    Job number is: 2

    martyp $

    ```


    In this example, both files beginning with "t" were printed, and one job number
    is associated with the printing of both files.


    Many UNIX systems have multiple printers connected. You can specify the printer
    you want to send the file(s) to with the -d option followed by the printer name.
    In the previous examples, the default system printer was used. You can specify
    the printer device to which our earlier print of mbox will go with the -d option,
    as shown in the following example:


    ```

    martyp $ lp -d ros2228 mbox

    Job number is: 3

    martyp $

    ```


    This output sends the file mbox to the printer we have specified, and again the
    job number is specified.


    You can specify a default printer by setting the LPDEST environment variable.
    If set, this variable will be used when you do not specify a printer name, as
    shown in the following example:'
  merge: -1
  pgno: 292
- img_proc: true
  md: '# 264 Chapter 10 Additional System Administration Topics


    ```

    martyp $ LPDEST=rosa2228

    martyp $ export LPDEST

    martyp $ lp mbox

    Job number is: 4

    martyp $

    ```


    The LPDEST environment variable is normally associated with a user''s default
    printer. You can also specify the default printer in your startup file.


    Print jobs are spooled to a printer so that you can proceed with other work. You
    don''t have to wait until a print job completes without a problem before you move
    on. You can receive an electronic mail message if there was any problem with your
    print job using the -m option, as shown in the following example:


    ```

    martyp $ lp -m t*

    Job number is: 5

    martyp $

    ```


    In this case, we have again sent the two files beginning with "t" to the default
    printer we earlier set up. You can assume this print job will complete without
    any problem unless you receive an electronic mail message informing you others.


    Sometimes, you may want to see the status of printers or attached to your system
    or network. The spooling functionality means that several files can be spooled
    to the printer, which means that you may have to wait for your file to print.
    There may be only one file ahead of yours in the queue; however it may be a very
    large file, as a report from an ERP system. To obtain the status of printers,
    use the lpstat command. I normally issue this with the -t option to obtain a long
    status listing, as shown in the following example:


    ```

    martyp $ lpstat -t

    Queue Dev Status Name From To

    ---- ---- ---- Submitted Rnk Pri Blks Cp PP %

    ---- ---- ---- ---------- --- -- --

    a464 a464d READY

    a464:  no entries

    a438 a438d READY

    ```'
