  md: '# Secure Shell (SSH)


    SSH is a method of establishing a secure session between two systems. The client
    initiates a session with the server in which all communication is encrypted. Passwords
    and all data are encrypted so that programs monitoring networking traffic, often
    called "sniffing," or employing other techniques to breach security, are less
    of a threat and thereby security is increased.


    An SSH client component and an SSH server component are both supplied with most
    Linux distributions. SSH is available for almost all client and server systems.


    The client programs are ssh, scp, and sftp and the server program is sshd. Two
    versions of Secure Shell are available SSH1 and SSH2. The protocols for these
    are different and incompatible with one another. SSH2 provides sftp which is a
    replacement for ftp. You notice some performance degradation when using sftp in
    place of ftp when copying large files. This is because encryption takes place
    for all packets that are transferred. OpenSSH is used on Linux distributions,
    which has system-wide configuration files in /etc/ssh. User-specific files are
    stored in the ~/.ssh directory. The ssh and sshd manual pages contain a lot of
    information regarding the configuration of SSH.


    Many SSH clients are available for many different systems. When establishing a
    connection through an SSH client, you are asked the hostname or IP address of
    the system to you want to connect, the protocol such as telnet, login, or others,
    and then you connect to the server.


    Operation of telnet through SSH is similar to non-secure telnet operation from
    a user standpoint, even though encryption takes place at the trans-port layer.


    SSH is strongly recommended to increase network security. It is easy to implement
    and provides a much higher level of security over non-SSH communications.'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# Network File System (NFS)


    NFS allows you to mount disks on remote systems so that they appear as though
    they are local to your system. Similarly, NFS allows remote systems to mount your
    local disk so that it looks like it is local to the remote system. This section
    goes through a simple NFS server and client setup after NFS background is supplied.
    You can use standard-mounted directories or automated directories with NFS. The
    upcoming example uses standard-mount directories, but you can use automounted
    directories, which mount remote directories as they are needed. Configuring NFS
    to achieve this functionality is simple. Here are the steps to go through in order
    to configure NFS:


    +   1. Start NFS on the server.

    2. Setup /etc/exports on the server.

    3. Run exports on the server.

    4. Create a directory on the client under which the remote directory will be mounted.

    5. Mount the remote disks on the client.


    Because NFS may be set up on your system to meet the needs of many users, you
    may want to understand the terminology associated with NFS. The following are
    commonly used NFS terms:


    | Node | A computer system that is attached to or is part of a computer network.
    |

    | Client | A node that requests data or services from other nodes (servers). |

    | Server | A node that provides data or services to other nodes (clients) on the
    network. |'
  merge: -1
  pgno: 237
- img_proc: true
  md: '# Network File System (NFS)


    File system A disk partition or logical volume.


    Export Makes a file system available for mounting on remote nodes using NFS.


    Mount Accesses a remote file system using NFS.


    Mount point The name of a directory on which the NFS file system is mounted.


    Import Mounts a remote file system.


    # Example NFS Configuration


