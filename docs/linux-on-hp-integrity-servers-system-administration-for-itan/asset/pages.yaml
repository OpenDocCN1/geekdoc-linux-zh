- img_proc: true
  md: 'cated. As you load and customize more applications, you will need to know more
    about startup and shutdown. In this section, you will get an overview of startup
    and shutdown and the commands that you can use to control your system.


    The following descriptions are for the three components that are in the startup
    and shutdown model of Linux that is based on the UNIX System V model:


    # Execution Scripts


    Read variables from configuration variable files and run through the startup or
    shutdown sequence. These scripts are located in /etc/rc.d/init.d, such as /etc/rc.d/init.d/smb
    to start and stop Samba.


    # Sequencer Script


    Calls all other scripts is /etc/rc.d/rc. This script calls all of the other scripts
    in the correct order for each run level. The scripts it calls are in run level
    subdirectory.


    # Subdirectories and Link Files


    There is subid for each run level in /etc/rc.d such as /etc/rc.d/rc2.d for run
    level two, /etc/rc.d/rc3.d for run level three, and so on. These subdirectories
    contain symbolic links to the execution scripts in /etc/rc.d/init.d. The links
    start with an S for start or a K for kill. An S script would start a service and
    a K script would kill, or stop, a service. Lower number scripts are executed before
    higher number scripts.


    Figure 6-1 shows the directory structure for startup and shutdown scripts.'
  merge: -1
  pgno: 175
- img_proc: true
  md: '# Linux System Startup and Shutdown Scripts


    ![](img/206f1b2e6e5a335b0dd18c6d72403722_176_0.png)


    Figure 6-1 Organization of Linux Startup and Shutdown Files


    Execution scripts perform startup and shutdown tasks. /sbin/rc invokes the execution
    script with the appropriate start or stop arguments, and you can view the appropriate
    start or stop messages on the console. You''ll see an OK ] indicates that the
    execution script started successfully.


    Let''s take a look at an example startup and shutdown file for Samba. This will
