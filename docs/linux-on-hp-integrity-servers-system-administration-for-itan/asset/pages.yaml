    long as your system administrator has denied you are free to set up your own jobs.
    Your system administrator can list users who are permitted to use cron in the
    cron.allow file. If you are not listed in this file, the format of which is one
    user per line, you cannot run the crontab program. If cron.allow does not exist,
    cron.deny is checked to see whether any users have been explicitly denied access
    to crontab.


    cron is very easy to use. Simply create your file, as I had done with listing
    in the earlier example, and run crontab against the file. If you have jobs you
    would like to see run on a regular basis, such as running make at night, cron
    is a useful tool.


    # at


    If you have a command you want to schedule to run only one time, you can use the
    at command. You can specify the at command, the time at which you want a command
