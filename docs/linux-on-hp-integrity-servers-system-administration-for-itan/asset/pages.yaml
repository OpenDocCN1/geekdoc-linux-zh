- img_proc: true
  md: '# Chapter 2


    # Installing Linux, RPM, and LILO


    This chapter covers two topics related to installing Red Hat Advanced Server.
    The first is installing Advanced Server on an Integrity server and the second
    is using the Red Hat Package Manager (RPM) to install additional software. You''ll
    perform a console-only installation on an Integrity system since there is no guarantee
    that you''ll have a VGA port or display for your Integrity system. RPM is covered
    because it is Red Hat''s tool for adding additional software after your installation
    is complete. SUSE LINUX also uses packages to install software, but keep in mind
    that SUSE is not covered in this book.


    At the time of this writing, the procedure used in this chapter for the console-only
    install of Red Hat Advanced Server works. However, you are dealing with a new
    technology. Because of this, keep in mind that this procedure may have been updated
    or refined.


    The Integrity server used in this chapter has multiple internal disks. You''ll
    install Advanced Server on one of these disks. The others have Windows 2003 Server
    and HP-UX installed on them. Loading the other two operating systems will not
    be covered. For simplicity, each of the three disks holds a separate operating
    system. This is not a requirement. Some of the operating systems can coexist on
    a single partitioned disk. On HP cell-based systems, you can run multiple operating
    systems simultaneously in Node Partitions (nPartitions), but this functionality
    won''t be covered in this book.'
  merge: -1
  pgno: 64
- img_proc: true
  md: 'The objective in this chapter is to cover the console-only installation of
    Red

    Hat’s Advanced Server. I’ll install RHEL 3 in the example, but the installa-

    tion of 2.1 is very similar.'
