    This lsdev listing shows installed hardware and some relevant information for
    each. Notice though, that devices such as hda are not shown. A lot of information
    about about device files is not shown in lsdev.


    Looking at the device files in /dev reveal a lot of information about any given
    device. The following is the format of the mknod (short for make node) command
    that is used to manually create device files if they are not already on your system:


    ```

    mkod name type [major] [minor]

    ```


    Now dissect a device file in /dev. The following is a long listing for a SCSI
    tape drive device file:


    ```

    # ls -al /dev/st0

    crw-rw---- 1 root disk 9, 0 Aug 30 19:31 /dev/st0

    ```


    This device has a name of /dev/st0. It is a character device as indicated by the
    c (as opposed to a block device b or a named pipe p,) has a major number of 9
    which corresponds to a SCSI tape drive, a minor number of 0 which corresponds
    to the drive number. If this device did not exist, the mknod command to create
    it would look like the following:


    ```

    # mknod /dev/st0 c 9 0

    ```


    After executing this command, you have the SCSI tape device file we need. Figure
    10-2 shows the components in our mknod command.'
