  md: '# Chapter 8


    # Configuring and Using Networking


    In this chapter, you''ll configure LAN cards and use a variety of networking commands.
    If you are not familiar with the background for Linux networking, take a look
    at Chapter 7, "Networking Background," before you start this chapter. This chapter
    focuses on what every system administrator should know about identifying and configuring
    LAN cards and many of the commands associated with network configuration. The
    examples used in this chapter are from a Red Hat 8.x system and the Integrity
    server running Advanced Server. As a sidenote, the "retail" versions of Red Hat,
    such as 8.x used in this section, has been replaced by Fedora. Fedora Project
    is a Red Hat-sponsored and community-supported open source project. Fedora Core
    2 is available at the time of this writing. You also use a few UNIX examples so
    that you can see the differences in the outputs. In this chapter, you will:


    +   - View some important networking configuration files, such as ifcfg-eth0 and
    /etc/hosts and others to see some of the networking parameters you use.


    +   - Work with commonly used networking commands, such as ping, netstat, route,
    ifconfig, iptables, and others.


    +   - Set up NFS networking.


    +   - Work with graphical programs, such as neat and Webmin.'
  merge: -1
  pgno: 208
- img_proc: true
  md: '# Commonly Used Networking Files


    There isn''t really any "procedure" associated with networking. Networking is
    more of a matter of knowing commands and files associated with working than it
    is a step-by-step endeavor, so this section covers most common-networking commands
    and files. First, some commonly used files are covered so you can see the type
    of networking parameters you define. Finally, this section covers commands that
    you can issue from the command line to view and set networking-related parameters.


    # ifcfg-eth0


    You can define the parameters related to a network interface easily with the ifcfg-eth0
    file for the card. The first ifcfg-eth0 is usually the first network card on Red
    Hat systems. This file is in /etc/sysconfig/network-scripts along with a lot of
    other networking files beginning with if. The interface device files, such as
    ifcfg-device are usually named device which is the name of the device for which
    control will be specified in the configuration file. The contents of file are
    shown here for the system in many of the examples in this chapter:


    ```

    # pwd

    /etc/sysconfig/network-scripts

    # cat ifcfg-eth0

    DEVICE=eth0

    BOOTPROTO=static

    BROADCAST=192.168.1.255

    IPADDR=192.168.1.102

    NETMASK=255.255.255.0

    NETWORK=192.168.1.0

    ONBOOT=yes

    #

    ```


    This file has in it all the important information related to the interface, such
    as IPADDR, DEVICE, NETMASK, and so on.


    You can edit this file directly, using the command line with ifconfig as described
    shortly, or use neat, webmin, or netconf to define the information for eth0 or
    any other interface. (Keep in mind that not all graphical tools are available
    on Integrity yet.)


    If you were to use DHCP, the file might look like the following:'
  merge: -1
  pgno: 209
- img_proc: true
  md: '# Commonly Used Networking Files


    ```

    DEVICE=eth0

    BOOTPROTO=dhcp

    ONBOOT=yes

    ```


    The following describes the entries shown in the ifcfg-device file:


    BOOTPROTO=protocol, where protocol is one of the following:

    none — No boot-time protocol should be used.

    boot — The BOOTP protocol should be used.

    dhcp — The DHCP protocol should be used.


    BROADCAST=address, where address is the broadcast address.


    DEVICE=name, where name is the name of the physical device.


    IPADDR=address, where address is the IP address.


    NETMASK=mask, where mask is the netmask value.


    NETWORK=address, where address is the network address.


    ONBOOT=answer, where answer is one of the following:

    yes — This device should be activated at boot-time.

    no — This device should not be activated at boot-time.


    USERCTL=answer, where answer is one of the following:

    true — Non-root users are allowed to control this device.

    false — Non-root users are not allowed to control this device.


    There is also a loopback device in this directory called ifcfg-lo, which has the
    following contents:


    ```

    # more /etc/sysconfig/network-scripts/ifcfg-lo

    DEVICE=lo

    IPADDR=127.0.0.1

    NETMASK=255.0.0.0

    NETWORK=127.0.0.0

    # If you''re having problems with gated making 127.0.0.0/8 a martian

    # you can change this to anything (255.255.255, for example)

    BROADCAST=127.255.255.255

    ONBOOT=yes

    NAME=loopback

    #

    ```'
  merge: -1
  pgno: 210
- img_proc: true
  md: '182


    Chapter 8 Configuring and Using Networking


    The address of 127.0.0.1 is a special address know as the loopback. This is for
    an IP host to refer to itself. A local loopback interface is often used in testing,
    as well as a variety of applications that require an IP address pointing back
    to the same system. Any data sent to the loopback device is immediately returned
    to the host''s network layer.


    You can find a lot of information about these scripts in /usr/share/doc/initscripts
    and ssysconfig.txt.


    # /etc/sysconfig/network


    The file /etc/sysconfig/network has in it information about the network configuration.
    The file contains information such as the following:


    NETWORKING — Set to yes or no depending on whether you want networking configured.


    HOSTNAME — The hostname, such as m4415mxp.


    GATEWAY — The address of the gateway.


    GATEWAYDEV — The gateway device, such as eth0.


    NISDOMAIN=value, where value is the NIS domain name.


    The following is an example network file:


    ```

    # /etc/sysconfig/network

    NETWORKING=yes

    HOSTNAME=m4415mxp

    GATEWAY=15.32.160.1

    #

    ```'
  merge: -1
  pgno: 211
- img_proc: true
  md: '# /etc/hosts


    The /etc/hosts file contains the Internet Protocol (IP) hostnames and addresses
    for the local host and other hosts in the Internet network. This file is used
    to translate a hostname into its Internet address or what is called resolve the
    hostname. When your system is using a name server, the file is accessed only if
    the name server cannot resolve the hostname. You may be using the DOMAIN protocol
    on your Linux system in which case the resolver routines query a remote DOMAIN
    name server before searching this file. In flat network with no name server, the
    resolvers search this file for hostname and address data. This file contains information
    about the other systems to which you are connected. The Internet address of each
    system, the system name, and any aliases for the system name. The format of the
    file is simple as shown in the following example:


    ```

    127.0.0.1       localhostloopback

    15.329.19.42      a4410827

    15.329.19.28      a4410tu8

    15.329.19.97      a4410922

    15.329.19.21      a4410tu1

    15.329.19.22      a4410tu2

    15.329.19.62      a4410730

    15.329.19.63      hpxterml

    15.329.19.64      a4410rd1

    15.329.19.62      a4410750hpl

    ```


    This file is in the following format:


    ```

    internet_address      official_hostname      aliases

    ```


    The Internet Protocol address (IP address) is a Class A, B, or C address. A Class
    A network supports many more nodes per network than either Class B or C network.
    The purpose of breaking down the IP address into four fields is to define a node
    (or host) address and a network address. The previous chapter describes these
    classes in detail.


    Assuming that the above /etc/hosts file contains Class C addresses, the rightmost
    field is the host or address, and the other three fields comprise the network
    address.


    You could use either the official_hostname or alias from the /etc/hosts file when
    issuing remote connection command, such as telnet or rlogin, as shown in the following
    example:'
  merge: -1
  pgno: 212
- img_proc: true
  md: '```

    $ telnet a4410750

    ```


    or


    ```

    $ telnet hpl

    ```


    Similarly, either of the following Berkeley commands works:


    ```

    $ rlogin a4410750

    ```


    or


    ```

    $ rlogin hpl

    ```


    If you''re using only the loopback device, the only line in the file will be the
    one that contains 127.0.0.1.


    # /etc/networks


    This file lists the names of networks including the one on which you are working
    and other networks. This is an optional file. It is used by the route command
    to identify networks by name rather than IP address. An entry in /etc/networks
    would look like the:


    ```

    dev-net          15.33.75.0      #development network

    ```


    You can then use the following route command:


    ```

    # route add dev-net

    ```


    Without the /etc/networks file, you would have to use the IP address rather than
    the name dev-net. If your system doesn''t have an /etc/networks file, you must
    create one and add entries like the above for any network you want to route by
    name.'
  merge: -1
  pgno: 213
