  md: 'make compressed would be replaced with make bzImage on an x86-based system
    at the time of this writing. In addition, the make xconfig command was not yet
    certified on Integrity, at the time of this writing, so you may have to use makeoldconfig;
    however, as you''ll see in an upcoming example, I did indeed use make xconfig
    on Integrity.


    As you can see, there are many steps to updating or creating your new kernel.
    After you go through the procedure yourself, you''ll see that the procedure is
    rewarding because it gives you complete control over how this critical part of
    your system operates. Please keep in mind that, in some cases, running a new kernel
    is unsupported.


    # Obtaining Linux Kernel Source Code


    In the upcoming example, you''re going to download the latest kernel source code
    available at the time of this writing for an IA-32 system. After you have the
    source, you are going to perform the entire process of building a new kernel.
    In the later examples, you will modify our 64-bit Advanced Server kernel on the
    Integrity server.


    www.kernel.org has many versions of Linux kernel source code including the latest
    versions. You can also select one of the mirror sites from which you can download
    the source code.


    Kernels with even numbers, such as 2.4 (full number is 2.4.18-3) on our system,
    are fully tested production kernels. With odd numbers, such as the 2.5.25 kernel
    we use in our upcoming example, are experimental. You should assume the odd number
    kernels are not stable and are therefore not suitable for your production systems.


    Figure 5-2 shows the www.kernel.org Web site and the kernels available at the
    time of this writing.'
  merge: -1
