  md: '# Ports and Related Topics


    Now that some of the background of networking and TCP/IP has been covered, let''s
    go over ports and some related topics. Ports have an impact on the security of
    your system, so be sure to see the security chapter for an introduction to some
    security topics and recommendations.


    Every Linux system on an IP network has a minimum of one IP address through which
    systems and their processes communicate. With many processes running on every
    system and a lot of data exchanged between systems, there is the potential for
    much confusion. If a process on one system, needs to communicate with a process
    on another system, needs to be a way for the second system to identify where to
    deliver the data. This problem is solved by TCP/IP identifying a TCP or UDP port.
    Ports are a connection that one host has to another host. I use here because it''s
    easier to understand host-to-host connections, but you should bear in mind that
    TCP/IP connections can be between processes on the same host (for example, between
    a Web browser on your desktop and a Web server running on your own machine). In
    any event, ports are identified by integers under system and can be controlled.
    For security purposes, you might want to close some ports that you don''t plan
    on using and restrict others.


    The operating system keeps track of many pieces of information for every connection.
    This information facilitates the communication between the processes. Of this
    vast amount of information, there are four pieces that make the connection unique:
    are the source IP address, the source port number, the destination IP address,
    and the destination port number.


    When a system wants to make a connection to another system, it specifies the destination
    IP address and port number. Internet services running on systems list on a particular
    file. /etc/services lists all the possible ports and their corresponding numbers.
    This is a long file, so the following lists a small subset of it:


    ```

    ftp-data        20/tcp

    ftp-data        20/udp

    # 21 is registered to ftp, but also used by fsp

    tsp               21/tcp          fsp fspd

    ssh               21/udp

    ssh               22/tcp          # SSH Remote Login Protocol

    ssh               22/udp          # SSH Remote Login Protocol

    telnet            23/tcp

    telnet            23/udp

    # 24 - private mail system     mail

    smtp             25/tcp          mail

    smtp             25/udp

    time             37/tcp          timeserver

    ```'
  merge: -1
  pgno: 204
- img_proc: true
  md: '# Chapter 7 Networking Background


