  md: 'In this example, the *num* has to do with the number of slashes in the path
    of the name found in the patch file. A *0* will strip away no slashes, a *1* will
    strip away the first slash, and so on. I normally us a *0* for a patch downloaded
    from www.kernel.org.


    After you run *patch*, a large number of messages will stream by. If you have
    no errors, you can perform your *make dep*; *make clean*; *make bzl-age*; *make
    module* and any other configuration and clean up work. When you''re done, your
    patch is installed.'
