    5-7 Filesystems in make xconfig


    The Filesystems menu window provides the option to select many common file systems,
    such as DOS FAT and JFS. You can work your way through all the areas of make xconfig
    to craft a kernel that meets your specific needs. You can select the functionality
    you want to be built directly into the kernel (y); the functionality you selected
    as a module (used infrequently m); and the functionality you don''t need at all
    can be excluded from the kernel altogether (n).


    The ability to build a kernel to meet your specific needs is one of the most powerful
    and desirable features of working with Linux.'
