  md: '# KDE


    The K Desktop Environment (KDE) is an enhanced window manager. KDE not only describes
    the interface of the window environment, it also includes a set of libraries that
    allow applications to take advantage of special KDE features. This means that
    applications designed specifically for KDE may have to be ported to other window
    managers in order to work.


    If you''ve selected KDE as the default for your window environment, it starts
    automatically when you login. If GNOME is your default and you want to use KDE,
    select Session at the bottom of your login screen. When the session dialog appears,
    select KDE. When you login, you may be asked again if you want to use KDE as your
    default window manager. If you do, select yes. If you only want to use KDE for
    the current session, select no. You can also a a switchdesk command to switch
    desktops.


    After logging in, you see a fully functional KDE environment. The one shown in
    Figure 3-7 is different than what you will see because KDE, like GNOME, is configured
    to remember your last session and to start all the applications you had open when
    you last logged out.'
