    # Scheduling Cron Jobs


    You can schedule tasks for periodic execution using the cron daemon. The cron
    daemon starts specified tasks at specified times as defined in the crontab files.
    The cron daemon starts when the system boots and remains running as long as the
    system is up.


    cron works by reading configuration files and acting on their contents. A typical
    configuration file would include the command to run, the day and time to run the
    command, and the user name under which the command should be run. You can look
    at this scheduling of jobs as a way of issuing commands at a specific time. The
    configuration files are called crontab files.'
  merge: -1
  pgno: 283
- img_proc: true
  md: '# Scheduling Cron Jobs


    crontab files are usually in the /var/spool/cron/crontabs directory. The Red Hat
    Linux system crontab files are used in some of the examples were are run in /var/spool/cron.


    The format of entries in the crontab file are as follows:


    +   * minute hour month weekday user name command where:

    * minute — the minute of the hour, from 0-59.

    * hour — the hour of the day, from 0-23.

    * monday — the day of the month, from 1-31.

    * month — the month of the year, from 1-12.

    * weekday — the day of the week, from 0 (Sunday) - 6 (Saturday).

    * user name — the user who will run the command if necessary (not in the example).

    * command — specifies the command line or script file to run.


    Be sure to check your Linux variant to ensure that crontab entries are in the
    same format and that the entries are in the same order.

    You have many options in the crontab file for specifying the minute, hour, month,
    and weekday to perform a task. You could list one entry in a field and then a
    space, several entries in any field separated by a comma, two entries separated
    by a dash indicating a range, or an asterisk, which corresponds to all possible
    entries for the field.


    Now, the simplest imaginable example to see how cron works. Create a file listing
    with the following contents in your home directory (/root on a Linux system):


    ```

    * * * * * ls -l / > /root/listing.out

    ```


    This file produces a long listing of the root directory every minute and send
    the output to listing.out in our home directory.

    To "activate" or "install" the crontab, simply issue the crontab command and the
    name of the file. You could also specify a user name if you wanted to associate
    the file with a specific user. After installing the crontab file, issue crontab
    -l to the installed crontab files. The following example shows the process of
    working with your crontab file called listing:'
  merge: -1
  pgno: 284
