- img_proc: true
  md: '# Chapter 9


    # Backup


    Performing backups on your Linux system is important for various reasons. As with
    any system, you could experience a hardware problem. Similarly, the software on
    your system could become corrupted or someone could accidentally delete it. Similarly,
    over time, you''ll probably customize your system. If you have to reinstall it,
    you will lose all your customizations. Backups can save you lots of time in all
    these situations.


    Many issues are related to backup. First, you must consider the frequency of system
    backups. You may decide to protect your data with some kind of storage technology
    (such as mirrored disks), but even that is not without risk. With mirrored disks,
    even if your system disk becomes corrupted, Still, even mirroring doesn''t help
    with deleted or corrupted files. Further, if you have to use your mirrored disk
    to restore your files, you will be unable to use your system while you restore
    it (unless you employ some high-availability program, such as ServiceGuard).


    Similarly, if your system backup takes place to a tape device on a remote system,
    you''ll have to consider the additional latency introduced by the network overhead.


    For all these reasons, it is important to test your recovery plan after you have
    designed your backup technique. Testing your plan ensures that you can recover
    your systems and data within the window required by your operation.'
  merge: -1
  pgno: 248
- img_proc: true
  md: '# Built-In Backup Programs


    This section gives an overview of several backup commands. All the examples are
    run on an Integrity server, but the commands work identically on IA-32 systems.
    If you''re interested in how tape drives are used for system backup, the examples
    in the device files section of this chapter pay special attention to the device
    file for tape drives. The following is a brief overview of backup programs covered
    in this chapter:


    tar


    tar is widely considered the most portable of backup and restore programs. tar
    is the most popular generic backup utility. You will find that many applications
    are shipped on tar tapes. This is the most widely used format for exchanging data
    with other Linux systems. tar is an old backup method and therefore runs on all
    Linux and UNIX systems. tar is one of the slower backup programs so you''ll need
    to consider this if you decide to use it for your full or incremental backups.
    One highly desirable aspect of tar is that you load files onto a tape with tar
    and then restore them onto another system, the original users and groups are retained.


    dump


    dump provides many levels of backup and creates /etc/dumpdates, which lists the
    last time a file system was backed up. restore is used to read information backed
    up with dump.


    cpio


    cpio is portable and easy to use, like tar. In addition, cpio is faster than tar.
    cpio is good for replicating directory trees.


    dd


    dd is a bit-for-bit copy. It is not smart in the sense that it does not copy files
    and ownerships; it just copies bits. You could not, therefore, select an individual
    file from a dd tape as you could with tar, restore or cpio. dd is mainly used
    for converting data, such as EBCDIC to ASCII.'
  merge: -1
  pgno: 249
- img_proc: true
  md: '# tar


    **tar** (originally short for tape archive) is widely considered the most portable
    of the backup and restore programs. You will find that many applications are shipped
    on tar tapes and many Linux files downloaded from the Internet are in tar format
    or compressed tar format such as archename.tgz. This is the most widely used format
    for exchanging data with other Linux and UNIX systems. You can append files to
    the end of a tar file or tape, which you can''t do with many other programs. tar
    is a slow backup program, so keep this in mind if you use it for your full, I
    would recommend using it for your full or incremental backups if you have a lot
    of data to back up. One highly desirable aspect of tar is that when you load files
    onto a tape with tar and then restore them onto another system, the original users
    and groups are retained.


    We''ll use several tar commands in the upcoming examples, including the following:


    +   # tar cf /dev/st0 /var    ;use tar to create (c) an archive of the directory
    /var and put it on tape /dev/st0.


    +   # tar tvf /dev/st0    ;obtain table of contents (t) from tape /dev/st0 and
    produce verbose (v) output.


    +   # tar xf /dev/st0    ;extract (x) the entire contents of the archive on tape
    /dev/st0 to default destination.


    +   # tar xvf /dev/st0 filel    ;extract (x) only file from the archive on tape
    /dev/st0 to default destination


    +   # cd /var/log; tar cf - . | (cd /tmp/log; tar xfBp -);send data to standard
    append output with cf -, then use standard input with xfBp - to copy the contents
    of /var/log to /tmp/log.'
  merge: -1
  pgno: 250
