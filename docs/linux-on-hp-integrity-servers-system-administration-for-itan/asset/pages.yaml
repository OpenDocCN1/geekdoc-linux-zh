  md: '# Chapter 10 Additional System Administration Topics


    | Signal | Value | Action | Comment |

    | SIGHUP 1 Term | Hangup detected on controlling terminal or death of controlling
    process |

    | SIGINT 2 Term | Interrupt from keyboard |

    | SIGQUIT 3 Core | Quit from keyboard |

    | SIGILL 4 Core | Illegal Instruction |

    | SIGABRT 6 Core | Abort signal from abort(3) |

    | SIGFPE 8 Core | Floating point exception |

    | SIGKILL 9 Term | Kill signal |

    | SIGUSRW 11 Core | Invalid memory reference |

    | SIGPIPE 13 Term | Broken pipe: to write to pipe with no readers |

    | SIGALRM 14 Term | Timer signal from alarm(2) |

    | SIGTERM 15 Term | Termination signal |

    | SIGUSR1 30,10,16 Term | User-defined signal 1 |

    | SIGUSR2 31,12,17 Term | User-defined signal 2 |

    | SIGCHLD Ign | Child stopped or terminated |

    | SIGCONT 19,18,25 | Continue if stopped |

    | SIGSTOP 17,19,23 Stop | Stop process |

    | SIGTSTOP 18,20,24 Stop | Stop typed at tty |

    | SIGTTIN 21,21,26 Stop | tty input for background process |

    | SIGTTO 22,22,27 Stop | tty output for background process |


    Note that you can get the online manual page for a command by issuing **man command_name**.
    You can view an online manual page from a specific section by specifying the **section**
    number. To view the **signal** man page in section 7, issue the following command:


    # # man 7 signal


    This produces the signal(7) man page. If you were to just type man signal the
    signal(2) man page would be produced; that is, the man page for signal in section
    2 would be shown.


    To kill a process with **234** with **SIGKILL**, issue the following command:


    # # kill -9 234


    ```

