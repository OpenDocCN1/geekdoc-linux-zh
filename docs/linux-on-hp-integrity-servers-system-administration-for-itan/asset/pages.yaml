    we could use Change Boot Order to make the HP-UX partition the default boot instead
    of the Linux Advanced Server.


    Although you are performing a console-only installation of Hat Advanced Server
    in Chapter 2, the rx2600 we''re working on does indeed have a built-in VGA port
    and graphics display attached. If you wanted to enable the graphics display, we
    would select Select Active Console Output Devices from the menu.


    The Select Console Output Device(s) menu appears listing all possible devices.
    The first device with * is the serial port that was selected by default. To enable
    the graphics as well, you must select the last console device. You know that this
    is the graphics port because it does not contain UART as part of the selection.
    Note that UART devices are always serial devices. Also note that in the following
