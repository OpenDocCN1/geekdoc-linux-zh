  md: '# User Setup


    There were no warnings or errors produced from having run testparam, so proceed
    to the next step.


    You now need to create a user on both the Linux and Windows systems that can be
    used for our Samba-related work. It may already be that you have suitable users
    on your system. For the purposes of this demonstration, you''ll create a user
    on both systems.


    On the Linux system, you can use the useradd program from the command line or
    User Manager graphical program (Programs-System-User Manager) to add the user.
    The user appears in the /etc/passwd file after or she has been added. Then, issue
    the following command to add the encrypted user password to the /etc/samba/smbpasswd
    file:


    ```

    # smbpasswd -a linuxconnect

    ```


    linuxconnect is the name of the user created for this example. You can view the
    smbpasswd file to see the entry for your usernThis same user was created on the
    Windows system. The menu pick Start-Programs-Administrative Tools-Computer Management
    (Local Users and Groups-Users) was used to create linuxconnect.


    # Samba Startup


    You can start Samba daemons every time the system boots or start them at the command
    line. The following commands show starting the daemons at the command line and
    then viewing them:'
  merge: -1
  pgno: 307
- img_proc: true
  md: '# smb.conf Setup


    279


    ```

    # /sbin/service smb start


    Starting SMB services:   [ OK ]

    Starting NMB services:  [ OK ]


    # ps -ef | grep mbd

    root      10828 1 0 16:59:50 00:00:00 smbd -D

    root      10833 1 0 16:59:57 00:00:00 nmbd -D

    #

    ```


    You started the daemons with /sbin/service smb start and check to see the two
    daemons running with ps. Should you make a change to your Samba setup and want
    to restart the daemons, you could use /sbin/service smb restart.


    The smbd server provides the file and print services to SMB clients, as Windows
    systems. SMB stands for "Server Message Block" and is defined as a network protocol
    for sharing files, printers, serial ports, and communications abstractions such
    as named pipes and mail slots between computers.


    The nmbd server daemon allows for NetBIOS over IP name service requests over a
    network, like those produced by SMB/CIFS clients such as Windows systems. We have
    now performed all of the basic setup required to proceed with mounting disks.


    # Mapping a Windows Drive to a Linux Directory


    Now we can both browse the Linux system from Windows as well as mount a specific
    drive directory of the Linux system on our Windows system. Figure 11-1 shows the
    window in which we specify the Linux system and directory we will mount as F:
    on the Windows system.'
