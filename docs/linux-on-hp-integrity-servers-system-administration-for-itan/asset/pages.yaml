- img_proc: true
  md: '# Steps to Creating a Linux Kernel


    It is common to completely update your Linux kernel when a new version becomes
    available. There may be features introduced into the new kernel that you want,
    or you may just want to remain current. Another common rea-son to create a new
    kernel is for security patches. In the upcoming sections, you''ll install a new
    kernel. Updating the kernel can result in an un-supported configuration, so always
    check on this before creating a new kernel. Figure 5-1 shows the steps you''ll
    cover in the next few sections for obtaining and working with our new kernel.'
  merge: -1
  pgno: 147
- img_proc: true
  md: '# Steps to Creating a Linux Kernel


    | Procedure | Step | Comment |

    | --- | --- | --- |

    | Obtain and put in place new kernel version | Obtain new kernel from www.kernel.org
    | linux-revision.tar.gz |

    | | cd /usr/src | Start at /usr/src |

    | | mv linux linux-existing_ver | Protect existing kernel by moving to linux-existing_ver
    |

    | | ln -s linux-new_ver linux kernel | Link Linux to new kernel directory |

    | | tar -xzf linux-new_ver.tar.gz | Un-archive new_ver |

    | | cd /usr/src/linux; make mrproper | Change to new Linux directory, prepare
    and clean kernel directories |

    | | make xconfig | Utility to modify and tune kernel |

    | Create new kernel | make dep;make clean;make bzImage;make install | Check for
    dependencies, clean directory tree, compressed boot image of kernel, and install
    kernel files in the correct location |

    | | make modules | Compile loadable modules |

    | | make modules install | Installs modules |

    | Include new kernel in boot loader | Edit /etc/lilo.conf | Include new kernel
    in /etc/lilo.conf |

    | | /sbin/lilo -v | Create new boot loader


    Figure 5-1 Creating a Linux Kernel on Integrity Servers'
