- img_proc: true
  md: '# File System Maintenance with ffsck and e2fsck, inodes, and Superblock


    Now that you can mount a file system, you should know how to unmount it. Linux
    uses the unmount (note that its unmount, not unmount) command to unmount a file
    system:


    ```

    umount [-f] directory

    ```


    Provided that the file system is not in use, it will be unmounted immediately.
    Being in use consists of simply being in the directory or a process of having
    a file open that resides on the mounted file system. Consequently, you may have
    to change directories if you are in a directory on the file system to be unmounted,
    or you may have to use kill to stop the process attached to the file system. Similarly,
    if you have a file open on the file system you want to unmount, you''ll have to
    close it. You may have to use unmount -f to force the filesystem to be unmounted,
    or go into what Linux calls "single user mode."


    # Linux Log Files


    The most important activities that take place on your Linux system are recorded
    in log files. There are many log files on your Linux system. One of the most important
    is syslog, which is the system event logger used by many programs to perform logging.


    syslog supports message sorting that allows a given message to be sorted by its
    importance and then sent to the appropriate destination. syslog consists of the
    syslogd (the logging daemon), openlog, which is a series of library routines the
    submit messages to syslogd, and logger, a user-level command that submits log
    entries from the system. syslog is started at boot time. If you want to see it
    running on your system, use the ps command to display all the processes running
    on your system.


    To specify the file in which specific log entries will be placed, use /etc/syslog.conf.
    The general format of this file is to have a selector field and an action field.
    Both fields have several sub-levels. For instance, the selector field can have
    levels go from informational (info) all the way to emergencies (emerg). The action
    field can go from the file to which messages are written (filename) to the screen
    of all users (*), if there is an important message to send to the /etc/syslog.conf
    file from our Integrity server:


    The following is the /etc/syslog.conf file from our Integrity server:'
  merge: -1
