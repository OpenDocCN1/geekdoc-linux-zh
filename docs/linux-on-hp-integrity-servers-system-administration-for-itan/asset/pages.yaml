  md: '# Configuring the Management Processor (MP)


    +   * Acpi (HWP0002,700)/Pci(1|1)/Uart(9600 N81)/VenMsg(Utf88)

    * Acpi (HWP0002,700)/Pci(2|0)

    Save Settings to NVRAM


    This enables both the serial and graphics consoles. The early boot messages will
    go to the serial console. After the graphics server is started, the Advanced Server-related
    boot messages will display graphically. After the installation is complete, this
    will be true during the load of Advanced Server as well. The early selections
    would take place on the console and then the majority of the load selections would
    display graphically.


    The first four entries with PNP0501 in them are on the nine pin serial port. The
    next entry with HWP0002 is on the three cable device that fits into the 25 pin
    connector. Be sure to enable a serial console on only one of the two devices since
    the Linux kernel expects only one serial console to be enabled.


    As you have seen, EFI is a useful and relatively easy to use. Of course, no one
    expects you to remember all you have seen here. If you need help, refer to “Commonly
    Used EFI Commands” on page 9 in Table 1-2. You can also type help at the Shell>
    prompt, or take a look at the tables summarizing EFI at the end of this chapter.
    Between them all, you’ll be able to perform many useful functions using the EFI
    interface.


    There is a built-in processor on most HP systems, including Integrity servers,
    that can be used for local or remote system administration functions called the
    Management Processor (MP). Occasionally, you may hear it referred as the Service
    Processor (SP) or Guardian Service Processor (GSP), but MP is by far the most
    commonly used name. MP functionality gets enhanced on a regular basis as what
    you’ll see in the upcoming examples may not be the same as the MP functionality
    on your system. Still, it should be very close. This section provides a quick
    overview of MP, including listing the overview supplied with the tool. Note that
    initial MP configuration is important because the first person to gain access
    to MP before it has been configured is a MP administrator by default.


    You gain access to the MP with ^b (ctrl b). If MP has not been configured, anyone
    who gets access to the console can type ^b and gain access to'
