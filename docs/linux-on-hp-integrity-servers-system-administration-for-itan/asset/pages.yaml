  md: '# Chapter 5 Working with the Linux Kernel


    These abbreviated listings have more settings than what are shown.

    **sysctl** can be used to both view and modify kernel settings. For more information
    about **sysctl**, see the **sysctl** and **sysctl.conf** man pages.


    # Changing IP Forwarding


    Now that you have two ways to modify settings using **echo** and **sysctl**, let''s
    modify a parameter using both techniques. If you want to perform IP forwarding,
    you would set `/proc/sys/net/ipv4/ip_forward` to a 1 and if you don''t you would
    set it to a 0. The following example uses **cat** to see what `ip_forward` is
    set to; using **sysctl** to set it to 0, and then using **echo** to set it back
    to 1:


    ```

    # cat /proc/sys/net/ipv4/ip_forward

    1

    ```


    ```

    # sysctl -w net.ipv4.ip_forward="0"

    net.ipv4.ip_forward = 0

    ```


    ```

    # echo "1" > /proc/sys/net/ipv4/ip_forward

    ```


    ```

    # cat /proc/sys/net/ipv4/ip_forward

    1

    ```


    This procedure is identical on both our Integrity and IA-32 systems.

    There are far too many **/proc** entries to list in this book; however, to Table
    5-1 is a list of a few kernel parameters of interest. The table is divided between
    directories in which categories of configuration options.


    # Table 5-1 Sample of /proc Entries


    | File | Function |

    |---|---|

    | /proc | Process information for the virtual file system. |

    | cpuinfo | Provides information about CPUs in the system. |

    | modules | Provides information about modules in the system (same as ismod).
    |

    | version | Provides the current version number of the kernel and other detailed
    information. |'
