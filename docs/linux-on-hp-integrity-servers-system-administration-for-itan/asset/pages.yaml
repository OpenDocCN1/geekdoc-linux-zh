  md: '# Chapter 10

    Additional System

    Administration Topics


    Many of the topics covered up to this point, such as installing Linux, networking,
    startup, kernel configuration, and many others, warrant their own individual chapters.
    This chapter discusses many of the remaining system administration-related topics,
    such as the following:


    +   * Managing processes using **ps, kill**, and signals

    * Users and groups

    * Disk usage

    * Scheduling jobs with **cron**


    In some cases, there are differences between IA-32 and Integrity server. Generally,
    I give examples on IA-32 systems. However, I will give examples on Integrity servers
    where appropriate in order to point out the nuances when working with Integrity
    servers.'
  merge: -1
