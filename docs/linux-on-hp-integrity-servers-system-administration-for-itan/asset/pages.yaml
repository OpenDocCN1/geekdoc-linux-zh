  md: '# Preface


    # ABOUT THIS BOOK


    Linux on HP Integrity Servers covers the Linux operating system on HP Itanium®-based
    systems, called the Integrity server family, running Red Hat Enterprise Linux
    (RHEL).

    This book starts out with extensive coverage of booting HP Integrity servers.
    These servers can run multiple operating systems so the boot process is important
    to understand. The boot process is substantially different than it is on HP Precision
    Architecture-based systems, called the HP 9000 family. The Extensible Firmware
    Interface (EFI) is an important part of booting HP Integrity servers, so I spend
    a significant amount of time on EFI in Chapter 1.

    I then cover loading on an HP Integrity system in Chapter 2. The installation
    is done in console-only mode since you may well have an HP server without a graphics
    display on. The graphics-based installation is nearly identical to that of loading
    an with Linux, so I didn''t want to cover the same information that appears in
    many other Linux books. To load Linux on an HP Integrity server, you first load
    the HP Enablement Kit for Linux, which is a set of tools that provide a framework
    for installing, configuring and recovering a Linux distribution on our Integrity
    servers The Kit is completely distribution agnostic, meaning that it is independent
    of a Linux distribution. You''ll be loading Red Hat Enterprise Linux (RHEL) only
    in'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'this book, but other Linux distributions can be loaded on some Integrity servers
    the LEK needs to be independent of a specific Linux distribution. The elilo program
    you use to boot-strap the Integrity server is provided as part of the HP Enablement
    Kit for Linux.


    This book covers many additional system administration topics in the subsequent
    chapters.


    The versions of Linux that run on Integrity that are used in this book are types
    of the Red Hat Enterprise Linux (RHEL), including versions RHEL 3 and RHEL 2.1.
    The three members of the RHEL family are Advanced Server, Enterprise Server, and
    Workstation. The primary difference in these releases, at this time of writing,
    I use RHEL Advanced Server because it supports greater than two CPUs, a lot of
    memory, and Itanium-based systems. There are also examples of IA-32 based systems
    that use other Red Hat releases. There are many Linux background chapters which
    apply to all Linux systems so the hardware platform, each Integrity servers or
    IA-32, is not important.


    Although the term Itanium is used throughout this book, the current implementation
    of Integrity is 2. I shortened the name to Itanium for easier reading. You may
    also see the old name of IA-64 appear occasionally in screen shots, but I won''t
    use IA-64 in my text.


    Other Linux distributions run on Integrity systems such as SuSE Linux enterprise
    server. I used Red Hat because this release was available at the time I began
    writing the book and many of my customers were evaluating Integrity servers running
    Red Hat. In addition to Linux, HP-UX, Windows Server 2003, and OpenVMS run on
    Integrity servers. Some of the book''s examples show the boot process in Linux,
    Windows, and HP- UX are all loaded on the same HP Integrity server. Different
    operating systems run in different hard partitions, Node Partitions (nPartitions)
    on HP Integrity servers. This capability is new at the time of my writing and
    will be enhanced by HP in the coming months and years.


    This is the first revision of this book, to keep up with the many advancements
    that will take place, you can expect several revisions to the book. I want to
    receive your feedback on this book and topics that you''d like to see covered
    in future revisions. Please send your thoughts to me at the following email address:


    marty.poniatowski@hp.com'
  merge: -1
