  md: "# 130\n\n# Chapter 5 Working with the Linux Kernel\n\nAfter you configure the\
    \ new kernel with make xconfig, you can begin the process of compiling or making\
    \ it. In this section, you run a few make commands to perform a variety of tasks.\
    \ Note that all these commands will be run in the directory where the new kernel\
    \ will be built. In the following example, we will change directory location to\
    \ /usr/src/linux/linux-2.5.25, so that the work you perform the linux directory\
    \ is actually done in linux-2.5.25. Also note that you are building an odd-number\
    \ release. This means that it is an experimental kernel. Although that might be\
    \ perfect for purposes here, I recommend using the fully tested even number kernel\
    \ releases for production systems.\n\nThe make dep command is first to run build\
    \ a dependency tree. This command checks for any dependencies of one module against\
    \ another. The make clean prepares a new directory tree for the kernel we are\
    \ about to build. The make bzImage (replaced by make compressed on Integrity)\
    \ creates a compressed boot image of the kernel. This command takes a long time.\
    \ The make install installs the kernel in the correct location:\n\n```\n# cd /usr/src/linux\n\
    # make dep; make bzImage; make install\n\nmake[1]: Entering directory /usr/src/linux-2.5.25/\n\
    make[2]: Entering directory /usr/src/linux-2.5.25/scripts/\ngcc -WP,-MD.,.split-include.d\
    \ -Wall -Wistrict-prototypes -O2\n     -format-frame-pointer -o split-include\
    \ split-include.c\nmake[2]: Leaving directory /usr/src/linux-2.5.25/scripts/\n\
    Generating include/usr/src/linux/version.h (updated)\nmake asm-sam=1386 symlink\n\
    SPLIT include/linux/autocon.h -> include/config/*\nStarting the build. KBUILD\
    \ BUILTIN=1 KBUILD MODULES=\nmake[2]: Entering directory /usr/src/linux-2.5.25/\n\
    make[3]: Entering directory /usr/src/linux-2.5.25/init/\nmake[3]: Leaving directory\
    \ /usr/src/linux-2.5.25/init/\nmake[3]: Entering directory /usr/src/linux-2.5.25/kernel/\n\
    ```\n\nYou can see that I removed the vast majority of output from commands. The\
    \ make bzImage produces a ton of output that I couldn't include in this book.\
    \ There were, however, no errors from having run these commands. Note that I usually\
    \ use output redirect with the make command to store standard output and standard\
    \ error for later review."
