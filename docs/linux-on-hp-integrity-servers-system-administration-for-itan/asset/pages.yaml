    mount the new partition at boot time, add the following line to the /etc/fstab
    file


    ```

    LABEL=/backup /backup ext3 defaults 1 2

    ```


    Then, save the file. If you want to check if the partition will be mounted in
    the correct place at boot time, reboot and log on again, or issue the following
    commands:


    ```

    root@localhost root# mount -a

    root@localhost root# df

    Filesystem 1-blocks Used Available Use% Mounted on

    dev/sda3 64850624 1419368 63431256 3%

    dev/sda1 104184 6120 98064 6% /boot/efi

    none 1024560 0 1024560 0% /dev/shm

    dev/sdb1 35001508 32828 33191068 1% /backup

    root@localhost root$

    ```


    mount -a reads /etc/fstab and mounts all mounted file systems listed in the file.
    df asks the system to report on all the free disk on the system. It reports that
    /dev/sdb1 is mounted on /backup, and it is only 1% full.


    The mount command has been used in this chapter and hasn''t really been covered
    yet. That''s because most of the work you do with mount is basic. Still, there
    is a lot of options to the command that you can see on the man page. However,
    the basic form of the mount command is as follows:


    ```

    mount [options] device dir

    ```


    You''ve already used some of the mount options in the examples. The following
    lists of some of the more commonly used options:


    +   -a Mounts filesystems in /etc/fstab. This was used in the earlier example.


    +   -t fstype Specifies the type of file system being mounted, but mount usually
    senses this on its own, so you don''t normally need this option.


    +   -o options When using -o, you can specify many options, such as ro for read
    only, rw for read write, noauto for disabling automatic mount when -a is specified.'
