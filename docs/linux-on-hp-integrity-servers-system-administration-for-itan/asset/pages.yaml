    if extra time is needed for ID command. |

    | PARPERM: | | Adds or disables partition (Npar) reconfiguration. |

    | PCIOLAD: | | Add/insert or remove/ject pci card. Cab-Bay-Ch-Slot. |

    | PD - Partition Number Default: | | Sets the default partition number used by
