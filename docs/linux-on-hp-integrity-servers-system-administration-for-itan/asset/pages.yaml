  md: '# Device Files


    Device files are a way to access system devices. An application that uses a device
    doesn''t need to know about the underlying device and how it works. When you access
    a device file the kernel manages the I/O request and passes it to the device driver.
    The device driver then performs an operation such as sending data to a tape drive.
    The device driver is built into the kernel which allows the kernel to manage access
    to the device.


    This section covers some important aspects of device files, including the following:


    +   * Some commonly used device files.

    * The structure of device files.

    * An example of creating a device file.


    Generally speaking, device files on Linux systems are character or block devices.
    Character devices expect the driver and other aspects of the Linux system to manage
    input and output buffering of data. Block devices expect the file system and kernel
    to perform buffering for them. Most hard disk drives have both a block and character
    device file. This provides flexibility in the way in which the hardware is used.


    A device file provides the Linux kernel with important information about a specific
    device. The Linux kernel needs to know a lot about a device before input/output
    operations can be performed.


    Device files are located in /dev on Linux systems. You''ve already seen many device
    files loading the operating system and performing other tasks. For instance, the
    SCSI disk on which you loaded Linux on an Integrity server is /dev/sda; the IDE
    drive on which you loaded Linux is /dev/hda. There are many other device files
    of which you should be aware. There may also be a subdirectory under /dev used
    to further categorize the device files such as /dev/inet. Table 10-2 lists some
    of the more commonly used device files along with a comment for each.'
  merge: -1
