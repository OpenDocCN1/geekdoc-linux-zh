    # Online Manual Pages


    Many times in this book, I refer to the online manual pages supplied with Linux.
    You can get the online manual page for a command by issuing **command_name**.
    You can view an online manual page from a specific section by specifying the *section*
    number. To view the signal man page in section seven, you would issue the following
    command:


    # # man 7 signal


    This produces the signal(7) man page. If you were to type just man signal, the
    signal(2) man page would be produced; that is, the man page for signal in section
    2 *would be shown*.


    Also, see /usr/share/doc where most Linux documentation is kept. /usr/ share/doc/<pkg-name>
    contains information about packages.'
