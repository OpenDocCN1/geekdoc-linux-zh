  md: "# dump and restore\n\ndump and restore are highly functional programs that\
    \ are used to back up a complete file system and then restore any or all of the\
    \ file system at a later date. There are some advanced characteristics of these\
    \ commands that are covered, including the following:\n\n+   - dump levels are\
    \ employed that allow you to perform a full backup at level 0 and then incremental\
    \ backups at lower levels. After a full backup has been performed at level 0,\
    \ then all changes since that backup will be saved if you specify dump level 1.\
    \ Level 2 will cover all changes since the last level 1 dump, and so on.\n- The\
    \ file /etc/dumpdates contains information about dumps including the file system\
    \ that was part of the dump, when the dump took place, and the dump level of the\
    \ backup.\n- You can combine dump with commands such as gzip to fit more information\
    \ on the tape.\n- Multi-volume backups are supported by dump provided that you\
    \ specify information about the media as bits per inch and per tape. You can bypass\
    \ this information and write directly from tape as covered in the example.\n-\
    \ You can get a table of contents of file on the tape using restore, restore files\
    \ interactively, select files, or restore an entire file system.\n\nLook at some\
    \ examples using dump and restore. We'll use several commands in the upcoming\
    \ examples, including the following:\n\n```\n# dump -Ou -f /dev/st0 /dev/sda4\
    \      ;dump sda4 file system to tape\n                              /dev/st0\
    \ using level 0 and update\n                              /etc/dumpdates.\n# dump\
    \ -Ouf -dev/sda4 | gzip --fast -c >>      ;dump sda4 file system to tape\n   \
    \                           /dev/st0 using level 0 and update\n              \
    \                /etc/dumpdates. Tape info\n                              such\
    \ as length and density aren't\n                              known so send output\
    \ to stdout and\ngzip before going to tape.\n```"
  merge: -1
