  md: '# Chapter 12


    # ServiceGuard for Linux


    ServiceGuard for Linux (what I''ll call ServiceGuard in this chapter) is a High
    Availability (HA) application. It is used in conjunction with other HA techniques
    to produce a loosely coupled cluster. An application running on a primary system
    can failover to a backup system should a failure or other switch over condition
    exist on the primary system. ServiceGuard can detect failures of a CPU, LAN, application,
    and other components.


    All the systems and all the application packages have IP addresses. When a failure
    occurs, the another system runs the high availability package and the IP address
    of the package moves with the package to the backup system. If only a LAN card
    fails in a primary system, ServiceGuard will fail over to a standby LAN card rather
    than the backup system.


    You can have many systems in a ServiceGuard cluster, all of which can be active.
    You don''t need to have systems in a standby state waiting for a failure to occur.


    This chapter provides background on ServiceGuard to give you an overview of its
    operation. This is not a detailed setup guide for Service-Guard. There are excellent
    ServiceGuard documents on www.docs.hp.com including Managing ServiceGuard for
    Linux.'
  merge: -1
  pgno: 324
- img_proc: true
  md: '# ServiceGuard Background


    A ServiceGuard cluster is a networked group of Linux servers that transfer control
    of applications when hardware or software problems occur. There is hardware reliability
    designed into a Service cluster in the form of many redundant components, such
    as LAN cards, disks, networking connections, and so on. ServiceGuard handles much
    of the software reliability by transferring from a failed system to an operational
    system. ServiceGuard uses packages, which are Linux processes grouped together
    to facilitate the management and fail over of important applications. Packages
    include the resources needed to support a specific application including disks,
    networking, and linux processes. The best way to understand the makeup of a ServiceGuard
    cluster is through a diagram. Figure 12-1 shows a basic ServiceGuard setup.


    ![](img/206f1b2e6e5a335b0dd18c6d72403722_325_0.png)


    Figure 12-1 ServiceGuard Cluster


    Figure 12-1 is a simple ServiceGuard cluster consisting of two systems. Note that
    there are many redundant components in the diagram. The'
  merge: -1
  pgno: 325
- img_proc: true
  md: '# ServiceGuard Background


    disks for the operating systems (root) are mirrored. The shared disks that contain
    pkgA and pkgB are also mirrored. The package is setup with Logical Volume Manager
    (LVM) volume groups. The procedure for creating the storage required for a ServiceGuard
    cluster is described in the document cited earlier.


    There are two LAN cards and two physical networks. The two networks are connected
    with a hub and not a router. Should one physical network fail, the hub provides
    instant connectivity to the second physical network.


    When a failure occurs on the second node, the pkgB switches to the first system,
    as shown in Figure 12-2.


    ![](img/206f1b2e6e5a335b0dd18c6d72403722_326_0.png)


    Figure 12-2 ServiceGuard Cluster After Failover


    After the package switch takes place, the package and its associated IP address(es)
    are moved to the "adoptive" system. IP addresses are associated with each system
    and with each application package. When the failover occurs, the IP address of
    pkg2 moves over to node1 along with the application package pkg2. Users of pkg2
    connect to the same IP address after failover even though pkg2 has been moved
    from node2 to node1.'
  merge: -1
  pgno: 326
- img_proc: true
  md: 'The application package contains all the information related to applications
    in the ServiceGuard environment. For each package, there is a package configuration
    file and package control script. The package configuration file contains all dependencies
    for the application, as the package name, version name, subnet, and so on. The
    package control script is run to start or stop the application package. These
    are ASCII files.


    In addition to the ASCII files used to define the package and start it, there
    is a cluster configuration file. This file has in parameters such as the cluster
    name, maximum number of configured packages, and so on. This file, along with
    the package configuration file, are combined to produce a binary file that is
    distributed to all the nodes. There are a series of commands to create a package
    and cluster. The cmapplyconf command is used to produce the binary file.


    # ServiceGuard Manager


    ServiceGuard clusters can be managed through a graphical interface called ServiceGuard
    Manager, which is available for free on software.hp.com. ServiceGuard Manager
    gets configuration data from nodes in a cluster and is invoked by /usr/local/sgmgr/bin/sgmgr
    -c clustername. ServiceGuard Manager can also be run on HP-UX and Windows systems.


    You can perform a variety of cluster-related tasks with ServiceGuard Manager including
    viewing a cluster as shown in Figure 12-3 for the cluster morningstar.'
  merge: -1
  pgno: 327
