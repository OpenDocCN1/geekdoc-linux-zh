    tcp 0 0 0.0.0.0:21 0.0.0.0:* LISTEN

    tcp 0 0 0.0.0.0:23 0.0.0.0:* LISTEN

    tcp 1 138 192.168.1.102:233 192.168.1.100:2706 ESTABLISHED

    tcp 0 0 192.168.1.102:1024 216.29.33.51:100 CLOSE WAIT

    tcp 1 0 192.168.1.1571 64.12.79.13:590 ESTABLISHED

    tcp 1 0 192.168.1.1405 66.70.73.150:80 CLOSE WAIT

    tcp 1 0 192.168.1.1104 66.15.230.150 CLOSE WAIT

    udp 0 0 0.0.0.0:1024 0.0.0.0:*

    udp 0 0 192.168.1.137 0.0.0.0:*

    udp 0 0 192.168.1.138 0.0.0.0:*

    udp 0 0 0.0.0.0:138 0.0.0.0:*

    udp 0 0 0.0.0.0.111 0.0.0.0:*

    #

    ```


    You can see that many ports are LISTEN, some are ESTABLISHED, and others are CLOSE
    WAIT at this time. One of the connections is on port 23, with IP address 192.168.1.100,
    which means that it''s a telnet session as determined by viewing the /etc/services
    file.


    Notice also that 21, 22, and 23 are all listening. We see in our earlier/etc/services
    listing and ftp, ssh, and telnet. Many other ports are also listening, which provides
    the potential to access to the system. Turning off these ports would increase
    the level of security of our system but potentially remove the ability to connect
    through that port and use a useful service.


    You''ve seen a lot of useful information viewing /etc/services to see the list
    of services that we can enable and disable using net'
  merge: -1
  pgno: 205
- img_proc: true
  md: '# Ports and Related Topics


    netstat -antu to view the status of the ports. There is an interesting nuance
    to the port number scheme.


    Many services based on Remote Procedure Call do not listen for requests on a well-known
    port, such as telnet on 23, but rather pick an arbitrary port when initialized.
    They register this port with a Portmapper service running on the same machine.
    Only the portmapper needs to run on a well-known port; when clients want access
    to the service, they first contact the portmapper, and they tell them which port
    they should contact in order to reach the service. This second port may be for
    TCP or UDP access. The following two lines are for our /etc/services file showing
    portmapper:


    ```

    | sunrpc 111/tcp portmapper # RPC 4.0 portmapper TCP |

    | sunrpc 111/udp portmapper # RPC 4.0 portmapper UDP |

    ```


    The earlier netstat -antu output did indeed show that port 11 is listening. You
    have to be careful with this port because, in most cases, you can''t disable the
    port; however, it is a port to someone could connect and potentially gain access
    to your system. the netstat -p command shows which processes are connected to
    which ports, as shown in the following example searching for telnet:


    ```

    | netstat -p | grep tel |

    | tcp 0 2 linuxdev:telnet F4457MXP:2706 |

    | ESTABLISHED 27269/in.telnetd: F |

    ```


    I issued the netstat command and piped it to grep so you could see the telnet
    connection only. Shown in this output are both the destination and source host
    and the status of ESTABLISHED.


    The next chapter covers ways of controlling the services. There are a few different
    ways to enable and disable services and some examples are provided. Before you
    permanently enable and disable network services, please be sure to see the security
    chapter for an introduction to some security topics and recommendations.'
  merge: -1
