  md: '# Linux File System Layout


    The Linux file system layout is hierarchical. Files are contained in directories,
    and directories can have any number of subdirectories. Most operating systems
    are arranged this way, including UNIX. The following are descriptions of some
    of the more important directories found on a Linux system:


    +   - /

    nThe root directory, which is the base of the file system''s hierarchical structure.
    A directory is logically viewed as being part /. Regardless of the disk on which
    a directory or logical volume is stored, it is logically viewed as a part of the
    root hierarchy.

    - /bin

    Contains commonly used commands that you issue at the command line all the time.

    - /boot

    The kernel files and those related to the kernel are in this directory.

    - /dev

    Contains host-specific device files.

    - /etc

    Contains host-specific system and application configuration files. The information
    in this directory is important to the system''s operation and is of a permanent
    nature. There are also additional configuration directories below /etc.

    - /home

    Users'' home directories are recommended to be located here. Because the data
    stored in users'' home directories will be modified often and much will be added
    over time, you can expect this directory to grow in size.'
  merge: -1
  pgno: 133
- img_proc: true
  md: '# Linux File System Layout


    /initrd

    An initrd image is needed for loading your SCSI module at boot time or if you
    are compiling the kernel with ext3 support as a module.


    /lib

    Libraries and parts of the C compiler are found in this directory.


    /lost+found

    The lost files directory. Here, you find files that are in use, but are not associated
    with a directory. These files typically become “lost” as a result of a system
    crash that caused the link between the physical information on the disk and the
    logical directory to be severed. The program fsck, which is run at the time of
    boot, finds these files and places them in the lost+found directory. You will
    typically see one of these for every disk that you have mounted.


    /misc

    A directory that is in place to contain miscellaneous information.


    /mnt

    Directory for mounting, especially temporary mounts, such as floppies and DVD-ROMs.


    /opt

    The directory under which applications are installed. As a rule, application vendors
    never specify a particular location for their applications to be installed. Now,
    with /opt, there is a standard directory under which applications should be installed.
    This is an organizational improvement for system administrators because they can
    now expect applications to be loaded under /opt and the application name.


    /proc

    Images of all running processes are shown here.


    /root

    Home directory for the user root.'
  merge: -1
  pgno: 134
