    Figure 5-5 General Setup in make xconfig for IA-32 Running Red Hat 8.x


    The General Setup make xconfig window is a model for all the other windows. In
    the three left-most columns, you can select y for yes, m for module (although
    no m is present in the figure) or n for no. This means that you can select y to
    build functionality into the kernel or n to not build-in the functionality. If
    you select m for module, the functionality will be dynami-

    -cally loaded into the kernel when it is needed, but won''t be a permanent part
    of the kernel. This results in a smaller, more efficient kernel that won''t take
    up as much memory. The bottom three buttons allow you to go back to the Main Menu,
    Next, or Previous area in the make xconfig interface.'
