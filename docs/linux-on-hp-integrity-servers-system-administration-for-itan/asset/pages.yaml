  md: '# Table 1-5 MP:CM> Commands Unique to Oper (Includes Serv Commands)


    | Command | Expansion | Description |

    | --- | --- | --- |

    | CC - Complex Configuration: | | Used to create a single cell partition. "G"
    uses lowest cell slot # connected to a I/O chassis with CIO. Cell must be BIB.
    "L" or restore option retrieves last successfully downloaded profile. |

    | DI - Disconnect Remote/Modem or LAN Console: | | Disconnects all remote/modem
    or LAN users from the MP. Caution! |

    | IT - Inactivity Timeout Settings: | | Prevents a user from inadvertently keeping
