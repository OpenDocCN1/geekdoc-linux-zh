- img_proc: true
  md: '# Chapter 6 System Startup and Shutdown Scripts


    You can see early in this listing, right after the comments, that you are in run
    level 5 by default.


    If you are booting your system to run level 5, /etc/rc.d/rc will run the startup
    scripts present in /sbin/rc1.d through /sbin/rc5.d.

    I have mentioned run levels several times in this discussion. Both the startup
    and shutdown scripts described here, as well as the /etc/inittab file, depend
    on run levels. The run level descriptions are present in the /etc/init-tab listing
    and are summarized here:


    +   0 Halt

    1 Single user mode

    2 Not used (user defined)

    3 Full multi-user mode

    4 Not used (user defined)

    5 Full multi-user mode with an X-based login screen

    6 Reboot


    /etc/inittab is also used to define a variety of processes that will be run, and
    it is used by /bin/init. The /bin/init process ID is 1. It is the first process
    started on your system and has no parent. After the kernel has loaded into memory
    and initialized device drivers, data structures, and other work, it starts init.
    init performs many administrative tasks, such as checking file systems, and then
    looks at /etc/inittab to determine the run level of the system.


    Entries in the /etc/inittab file have the following format:

    id:run states:action:process


    +   id The name of the entry. The id is up to four characters and must be unique
    in the file. If the line in /etc/inittab is preceded by a "#", the entry is treated
    as a comment.

    run states Specifies the run level(s) at which the command is executed. More than
    one run level can be specified. The command is executed for every run level specified.'
  merge: -1
  pgno: 183
- img_proc: true
  md: '# Run Levels and /etc/inittab


    action

    Defines which of 11 actions will be taken with this process. The 11 choices for
    action are: init-default, sysinit, boot, bootwait, wait, respawn, once, powerfail,
    powerwait, ondemand, and off.


    process

    The shell command to be executed if the run level and/or action field indicates.


    To start a getty, which is a process run on each terminal that users can log in,
    at run levels 2-5, you would include the following line in /etc/inittab:


    ```

    1:2345:respawn:/bin/getty console console

    | | | |

    | | | > process in this case getty

    | | > action in this case run again so that login can take place

    | > run state in this case 2345

    > id in this case for tty1

    ```


    This is in the /etc/inittab file, as opposed to being defined as a startup script,
    because the console may be killed and have to be restarted whenever it dies, even
    if no change has occurred in run level. respawn starts a process if it does not
    exist and restarts the process after it dies. This entry shows several run states,
    since you want the console to be activated at all times.


    Another example is the first line from /etc/inittab:


    id:5:initdefault:


    The default run level of the system is defined as 5.


    The system startup and shutdown basics described here are important. You will
    be starting up and shutting down your system and possibly some of the files described
    here. Because of their importance, it is important that you take a close look
    at the startup and shutdown files before you begin to modify them. If you need
    to modify them, I recommend making a backup of any file you edit it.


    Now, look at the commands you can issue to shut down your system.'
  merge: -1
  pgno: 184
