  md: '# Table 10-2 Examples of Linux Device Files


    | Device | Comments |

    | --- | --- |

    | /dev/hda | First IDE hard drive |

    | /dev/hda1 | Primary partition 1 of first IDE hard drive (next is 2 and so on)
    |

    | /dev/hdb | Second IDE hard drive (next is c and so on) |

    | /dev/hdb1 | Primary partition 1 of second IDE hard drive (next is 2 and so on)
    |

    | /dev/sda | First SCSI hard drive |

    | /dev/sda1 | Primary partition 1 of first IDE hard drive (next is 2 and so on)
    |

    | /dev/sdb | Second SCSI hard drive (next is c and so on) |

    | /dev/sdb1 | Primary partition 1 of second SCSI hard drive (next is 2 and so
    on) |

    | /dev/fd0 | First floppy drive (A:) |

    | /dev/st0 | SCSI tape drive. |

    | /dev/ttyS0 | Serial port on COM1 |


    Although many other device files exist on your system, these are some of the more
    commonly used.

    As described earlier, a device file provides the Linux kernel with important information
    about a device device. The Linux kernel needs to know a lot about a device before
    Input/Output operations can be performed.

    There is some embedded information that is part of the device file that you need
    to know should you decide to create your own device file. You need to know some
    of this information if you were to create your own device file using the `mknod`
    command. Before you create a device file, list the installed hardware on an IA-32
    system with the `lsdev` command:


