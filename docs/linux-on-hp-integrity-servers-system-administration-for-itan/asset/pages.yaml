  md: '# Adding an IDE Disk to an IA-32 System Using fdisk


    As a comparison only to the Integrity procedure, look at the installation of a
    second IDE disk, this time on your IA-32 system. Keep in mind that most IA-32
    systems, like Proli, have SCSI disks. It''s really not that different from installing
    a second SCSI disk, but it''s worth going over again. Linux automatically detects
    new SCSI and IDE disks if you already have one disk in your system. In the example
    in this section, I''ll add an IDE disk to the existing system that already has
    an IDE drive in it. Keeping with the "how to" format of this book, I''ll walk
    through all the steps required to add the disk.


    Just like when you installed Linux on the first IDE drive, you''ll employ partitions
    when you set up our new disk. In the following example, you''ll have only one
    partition that will contain the entire capacity of the disk.


    The existing disk on the system is /dev/sda. Our new disk will be /dev/hdb, which
    are the names that Linux selects for IDE disks. Our existing disk is partitioned
    into /dev/hda1 for partition number one, /dev/hda2 for partition number two, and
    so on. If you want to see the partitions on your first disk, before you adding
    the new disk, log on as root and issue the command fdisk -l /dev/hda. You will
    see all the partitions on your existing disk. Because this is the second IDE hard
    disk, our new disk will be /dev/hdb. Because there will be only one partition
    on it, the partition will be /dev/hdb1. If you read the earlier section, "Adding
    and Partitioning a SCSI Disk on the Integrity Server," you already know the naming
    convention for SCSI disks is similar with /dev/sda being the first SCSI disk and
    /dev/sdb being the second disk.


    In the example, you add an IDE drive that already has two partitions on it. Keep
    in mind that if you have a brand new drive, it may not have any partitions on
    it, and you can skip the sections where we delete the existing partitions.


    After physically adding the disk drive and booting the system, log on as root
    to invoke fdisk in order to partition the disk. After fdisk starts, select m to
    view all the available fdisk options.'
