    S is for state. The state can be sleeping, as indicated by the pro-\cess shown
    in the example, waiting, running, intermediate, terminated,

    and so on. Some of these values can vary from system to system, to

    check your manual pages.


    Additional useful information in this output is: NI for the nice

    value; ADDR for the memory address of the process; SZ for the size in phys-

    pages of the process; and WCHAN, which is the event for which the pro-

    cess is waiting.


    # Killing a Process


    If you issue the ps command and find that one of your processes are hung or if
    you start a large job that you want to stop, you can do so with the kill com-\mand.
    kill is a utility that sends a signal to the process you identify. You can

    kill any process that you own. In addition, superuser can kill almost any pro-\cess
    on the system.


    To kill a process that you own, simply issue the kill command and the

    Process ID (PID). The following example shows issuing the ps command to

    search for find processes, killing a process, and checking to see it has

    disappeared:'
  merge: -1
