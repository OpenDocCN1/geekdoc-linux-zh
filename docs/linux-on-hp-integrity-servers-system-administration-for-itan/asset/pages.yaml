  md: '# Preface


    # Acknowledgments


    There were too many people involved in helping me with this book to list each
    and every one. I have, therefore, decided to formally thank those who wrote sections
    of this book and those who took time to review it. I am still not sure whether
    takes more time to write something or review something that has been written to
    ensure it is correct.


    # Stephen Gears


    Stephen is the executive chairman and sponsor of this book and played an active
    role in getting it published.

    Stephen Gears, Director, Worldwide Linux R&D, is responsible for overseeing HP''s
    Linux technical strategy, Linux support for HP''s Integrity Servers, integrated
    Linux-based solutions for various markets, and HP''s Open Source Program Office.
    Stephen also has direct responsibility in developing HP''s overall Linux and Open
    Source strategies. Stephen has active roles with the Open Source Development Lab
    (OSDL) and the Linux Standards Base (LSB). Steve chairs the Data Center Linux
