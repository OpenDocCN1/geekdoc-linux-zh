  md: '# # Chapter 4


    #  Disk and File System Topics


    In keeping with the "how to" format of this book, this chapter presents disk and
    file system-related topics primarily by working with examples. First, you add
    a hard disk to an Integrity (Titanium-based) server with SCSI disks and then you
    add one to an IA-32 system with IDE drives. After that, you take a look at some
    of the filesystem tools and utilities just as a comparison. Along the way, the
    following topics are covered. Note that you must be logged on as root to perform
    most of these tasks:


    +   * Adding and partitioning a disk and all related topics, such as **parted**
    (on Integrity), **fdisk** (on IA-32), and **mke2fs**.


    +   * File system checking with **e2fsck** and related topics.


    +   * **fstab, mount, e2label, and umount**


    +   * Linux log files


    +   * Smart Array Configuration'
  merge: -1
  pgno: 112
- img_proc: true
  md: '# Chapter 4 Disk and File System Setup


    # Adding and Partitioning a SCSI Disk on an Integrity Server


    A commonly run procedure on Linux systems is to add a new disk and partition it.
    In Chapter 2, you installed Linux on a SCSI disk on the Integrity server and now
    you want to expand your system to include an additional disk.


    Linux automatically detects SCSI and IDE disks if you already have one such disk
    in your system. In the example in this section, you add a SCSI disk to the existing
    system that already has a SCSI drive in it. I''ll walk through all the steps required
    to add the disk. In this section, you perform disk-related procedures on an Integrity
    server with SCSI disks. Later in this chapter, you perform the same procedures
    on an IA-32 system with IDE disks.


    As with the installation of Linux, you''ll employ partitions when you set up your
    new disk. In the example, we''ll have only one partition that will contain the
    entire capacity of the disk.


    The Integrity system on which I''ll install the new disk has four disks internal
    to it. Linux was loaded on /dev/sdc (for SCSI disk C). /dev/sda and /dev/sdb (for
    SCSI disk A and B respectively) have other operating systems on them. The unused
    disk of /dev/sdd will be used in this example to create one large partition and
    mount it.


    Our existing disk is already partitioned into /dev/sde1 for partition A /boot/efi/dev/sdc3
    for partition /, and a none partition for /dev/shim. Our new disk will be /dev/sdd
    and we will create one partition on it that will be named /dev/sdd1.


    After physically partitioning the disk and booting the system, invoke parted has
    many options. The following listing shows what happens when you invoke parted
    for the new SCSI disk and then view the available command options with help:


    ```

    [root@linux1 root]# parted /dev/sdd

    GNUed 1.6.3

    Copyright (C) 1998, 1999, 2000, 2001, 2002 Free Software Foundation, Inc.

    This program is free software, covered by the GNU General Public License.

    This program is distributed in the hope that it will be useful, without ANY

    WARRANTY; without even the implied warranty of MERCHANTABILITY or FITNESS FOR
    A

    PARTICULAR PURPOSE. See the GNU General Public License for more details.

    ```


    ```

    Using /sdd

    (parted) help

    check MINOR do a simple check on the filesystem

    cp [FROM-DEVICE] FROM-MINOR TO-MINOR copy filesystem to another partition

    ```'
  merge: -1
  pgno: 113
- img_proc: true
  md: '# Adding and Partitioning a SCSI Disk on an Integrity Server


    ```

    help [COMMAND]               prints general help, or help on COMMAND

    mklabel LABEL-TYPE             create a new disklabel (partition table)

    mkfs MINOR FS-TYPE             make a filesystem FS-TYPE on partition MINOR

    mkpart PART-TYPE [FS-TYPE] START END  make a partition

    mkpart PART FS-TYPE START END      make a partition with a filesystem

    move MINOR START END            move partition MINOR

    name MINOR NAME                 name partition MINOR NAME

    print [MINOR]                   display the partition table, or a partition

    quit                            exit

    rescue START END                rescue a lost partition near START and END

    resize MINOR START END          resize filesystem on partition MINOR

    rm MINOR                       delete partition MINOR

    select DEVICE                   choose the device to edit

