  md: '# Chapter 6


    # System Startup and Shutdown Scripts


    Various topics related to startup and shutdown are covered in this chapter, including
    the following:


    +   - Linux startup and shutdown scripts

    - ksys graphical interface for controlling scripts and run levels

    - Run levels /etc/inittab file

    - service and xinetd

    - System shutdown


    # Linux System Startup and Shutdown Scripts


    Startup and shutdown scripts for Linux are organized in three parts: sequencer
    scripts; execution scripts; and subdirectories and link files. These scripts work
    together to facilitate startup execution and are described shortly.

    Startup and shutdown are going to become increasingly important to you as your
    system administration work to become more sophisticated'
