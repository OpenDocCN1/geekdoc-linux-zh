  md: '# Linux on nHP Integrity Servers


    # A System Administrator’s Guide


    > "Mart gets straight to the heart of Itanium-based issues for Linux system administrators.
    I highly recommend this book for customers who need to get up and running quickly
    with Linux on HP Integrity servers."

    —Martin Fink, Vice President of Linux, Hewlett-Packard Company


    ![](img/206f1b2e6e5a335b0dd18c6d72403722_363_0.png)


    MARTY PONIATOWSKI has been a Solution Architect at the Hewlett-Packard for seventeen
    years in the New York area. He has worked with hundreds of HP customers ranging
    from media and entertainment, leaders in financial services and manufacturing,
    to internet startups. Poniatowski’s 13 books include HP-UX 11i System Administration
    Handbook and Toolkit, Second Edition and HP-UX Virtual Partitions.


    Here''s your comprehensive guide to administering HP Integrity servers running
    Linux. HP Solution Architect and Linux/UNIX expert Poniatowski walks you through
    every essential tool and technique, from installation and booting, working with
    the Management Processor (MP), and partitioning disks. Coverage includes


    +   * The HP Integrity boot process: EFI, POSSE, and the Management Processor

    * Using the HP Enablement Kit for Linux

    * Using Red Hat Package Manager (RPM) and LILO

    * Adding and partitioning SCSI disks on HP Integrity Servers

    * Linux system startup and shutdown scripts for HP Integrity systems

    * Running Samba to deliver Windows file and print services

    * Running Linux, HP-UX, and Windows Server 2003 concurrently on the same HP Integrity
    system.


    This book is an indispensable reference for every system administrator running
    Linux on HP Integrity servers—regardless of their experience with Linux, HP-UX,
    or other UNIX systems.


    Prentice Hall Professional Technical Reference Upper Saddle River, NJ 07458

    www.pphtr


    HP Books

    www.com/hpbooks


    ![](img/206f1b2e6e5a335b0dd18c6d72403722_363_1.png)'
  merge: -1
  pgno: 363
