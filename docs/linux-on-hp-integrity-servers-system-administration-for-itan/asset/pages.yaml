  md: '# Setting Up Directories and Files for the Linux Kernel


    The first few steps you must perform to work with the new kernel are related to
    creating a directory structure that will house the old and new kernel versions.
    That is, you may have kernel source code for an existing kernel you need to save
    and the code for the new kernel to work with.


    If you don''t have an existing kernel, check in /usr/src for a directory named
    linux. If the linux directory does not exist, you don''t have to worry about saving
    the source tree. If it does exist, move it from linux to linux-releaseNumber,
    where releaseNumber is something like linux-2.4.18-33 (the kernel release on the
    IA-32 system). Once that is done, your existing kernel release is saved. If you
    don''t know what your kernel release is, try issuing the command uname -r. The
    following is what happens when you run uname -r on the Integrity Server running
    RHEL Advanced Server:


    ```

    # uname -r

    2.4.18-e.12.smp

    ```


    If you were to save the existing kernel code, you would move the current linux
    directory to linux-2.4.18-e.12.smp. Once you did, you are ready to create the
    new kernel. The following example shows copying the newly compressed kernel to
    /usr/src, changing directory to /usr/src, making a directory named linux-2.5.25
    for our new kernel, and performing another long listing of /usr/src:


    ```

    # cp /root/linux-2.5.25.tar.gz /usr/src

    # cd /usr/src


    # ls -l

    total 34144

    drwxr-xr-x 2 root root 34918191 Jul 13 12:21 linux-2.5.25.tar.gz

    -rw-r--r 7 root root 4096 Jun 11 05:38 redhat


    # mkdir linux-2.5.25


    # ls -l

    total 34148

    drwxr-xr-x 2 root root 4096 Jul 13 12:25 linux-2.5.25

    drwxr-xr-x 1 root root 34918191 Jul 13 12:21 linux-2.5.25.tar.gz

    -rw-r--r 7 root root 4096 Jun 11 05:38 redhat

    ```


    The long listings in the previous example indicate that we did not have an existing
    linux directory. Thus, we don''t have to save it by renaming it linux-releaseNumber.


    Next, create a symbolic link from the new kernel directory name to linux, unpack
    the gzip tar file you downloaded into /usr/src/linux-'
