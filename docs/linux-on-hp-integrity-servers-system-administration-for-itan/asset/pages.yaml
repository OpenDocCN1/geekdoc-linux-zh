    As mentioned earlier, the script used as part of the startup and shutdown process
    is in /etc/init.d. The following example is for the IA-32 system used in the Samba
    chapter, but it is the same for Integrity servers. For the Samba example, the
    name of the program is /etc/init.d/smbd. Take a minute and use your favorite editor
    to open and view the script. If you''re logged on'
  merge: -1
