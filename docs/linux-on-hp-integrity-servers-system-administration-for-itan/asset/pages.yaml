    # Disk-Related Concepts


    System administrators typically spend a great deal of time setting up, managing,
    and monitoring disks and file systems (see, for example "Disk and File System
    Topics," in Chapter 4). The basics are covered here but I don''t want to cover
    any setup procedures. Users typically aren''t permitted access to the commands
    used to set up disks, file systems, and so on. It is still useful, however, to
    be able to view the way your system and environment have been set up.'
