    The *default image* is specified early in the file. It is the one that you observed
    the system when you checked earlier in this chapter using **uname -r**. Note that
    the location of the *elio.conf* file is different on Integrity servers. On IA-32
    systems, it is located in `/etc`. On Advanced servers, it is located in `/boot/efi/efi/redhat`.
    Keep in mind that IA-32 uses *lilo* and Integrity servers uses *elilo*.


    # Tuning Your Existing Linux Kernel


    In the previous section, you downloaded and installed a completely new kernel.
    We made various selections regarding the functionality of our new kernel in the
    make **make xconfig** step. You were, however, limited in the amount of customization
    we could perform to the kernel during installation. Now look at some additional
    customization that you can perform to the kernel after it''s installed.


    The first area to investigate is the `/proc` file system.


    # /proc File System


    An interesting component of the Linux operating system is the `/proc` file system.
    `/proc` doesn''t really exist in the sense that it is on the disk like other file
    systems. The ''files'' in `/proc` are a function of the kernel and/or variables
    in the kernel. `/proc` provides a mechanism by which you can view and set parameters
    in the kernel.


    /proc gives us a lot of useful information about the kernel. For instance, you
    can see a complete rundown of the processor in your system by issuing **cat /proc/cpuinfo**,
    as shown in the following example first on our two-processor Integrity server
    and then on our IA-32 system:


    ```

    # cat /proc/cpuinfo             (On Integrity dual processor)

    processor : 0

    vendor    : GenuineIntel

    arch      : IA-64

    family    : Itanium 2

    model     : 0

    revision  : 7

    archrev  : 0

    features  : branchlong

    cpu number : 0

    cpu regs   : 4

    MHz       : 1000.000000

    ```'
