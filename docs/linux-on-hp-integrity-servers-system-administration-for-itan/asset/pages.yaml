  md: '# make xconfig


    At the time of this writing, **make xconfig** hasn''t been certified on Integrity
    servers; however, there are examples of **make xconfig** on Integrity in this
    section. The **make oldconfig** command is tested on Integrity. The **make xconfig**
    command uses the **make** utility to compile and invoke a kernel configuration
    tool. When **make xconfig** is run, the kernel configuration tool is X Windows-based.
    If you wanted to run the same tool in a character-based environment, run **make
    menuconfig**. I have used this command on both IA-32 and Integrity servers, but
    I have received reports that there are sometimes unusual results on Integrity
    servers, please use it with caution.


    After issuing the **make xconfig** command, a lot of *gcc*-related (compiler)
    messages appear and the top-level kernel configuration window opens. The top-level
    **make xconfig** window for our IA-32 system running Red Hat 8.x is shown in Figure
    5-3.


    | Code maturity level options | Telephony Support | Multimedia devices |

