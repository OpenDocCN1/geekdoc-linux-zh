  md: '# Internet Protocol (IP) Addressing and Subnet Mask


    have a unique IP address. Systems that have two network interfaces must have two
    unique IP addresses.


    # Subnet Mask


    Your Linux system uses the subnet mask to determine whether an IP data-gram is
    for a host on its own subnet, a host on a different subnet but the same network,
    or a host on a different network. Using subnets, you can have some hosts on one
    subnet and other hosts on a different subnet. The subnets can be separated by
    routers or other networking electronics that connect the sub-nets.


    To perform routing, the only aspects of an address that your router uses are the
    net and subnet. The subnet mask is used to mask the host part of the address.
    Because you can set up network addresses in such a way that you are the only one
    who knows which part of address is the host, subnet, and network, you use the
    subnet mask to make your system aware of the bits of your IP address that are
    for the host and for the subnet.


    In its simplest form, what you are really doing with subnet masking is specifying
    which portion of your IP address defines the host, and which part defines the
    network. One of the most confusing aspects of working with sub-net masks is that
    most books show the subnet masks in Figure 7-5 as the most common.


    | Address Class | Decimal | Hex |

    |---|---|--|

    | A | 255.0.0.0 | 0xff000000 |

    | B | 255.255.0.0 | 0xffff0000 |

    | C | 255.255.255.0 | 0xffffff |


    Figure 7-5 Subnet Masks


    This way of thinking, however, assumes that you are devoting as many bits as possible
    to the network and as many bits as possible to the host, and'
  merge: -1
  pgno: 200
- img_proc: true
  md: 'that no subnets are used. Figure 7-6 shows an example of using subnetting with
    a Class B address.


    | Address Class | Class B |

    |---|---|---||

    | Host IP address | 152.128. | 12. | 1 |

    | Breakdown | Network | Subnet | Hostid |

    | Number of bits | 16 bits | 8 bits | 8 bits |

    | Subnet mask in decimal | 255.255. | 255. | 0 |

    | Subnet mask in hexadecimal | | 0xffff00 |

    | Example of different host on same subnet | 152.128. | 12. | 2 |

    | Example of host on different subnet | 152.128. | 13. | 1 |


    Figure 7-6 Class B IP Address and Subnet Mask Example


    In Figure 7-6, the first two bytes of the subnet mask (255.255) define the network,
    the third byte (255) defines the subnet, and the fourth byte (0) is devoted to
    the host ID. Although this subnet mask for a Class B address did not appear in
    the earlier default subnet mask example, the subnet mask of 255.255.255.0 is widely
    used in Class B networks to support subnetting.

    How does your Linux system perform the comparison using the subnet mask of 255.255.255.0
    to determine that 152.128.12.1 and 152.128.13.1 are on different subnets? Figure
    7-7 shows this comparison.'
