  md: '# service, xinetd and chkconfig


    xinetd and service are startup-related programs related to enabling and disabling
    services. /sbin/service was mentioned earlier as a command used to start services
    in general (see the "Networking Background" section for information about ports
    and services in general). In the earlier smb example, we verified that it was
    running using the following service command:


    ```

    # /sbin/service smb status

    smbd (pid 933) is running...

    nmbd (pid 938) is running...

    #

    ```


    The /sbin/service command is used to start services. It calls the startup script,
    such as smb in this case, and performs the desired function, such as producing
    status in this case. There is no man page for service, but you will see it in
    examples often.

    The /etc/xinetd.d directory contains a lot of configuration files that are used
    by the internet daemon xinetd. For example, to run ftp, you may have to change
    the /etc/xinetd.d/ftp file and set disable = no to enable ftp on your system.
    You should issue the following command to restart xinetd:


    ```

    # /sbin/service xinetd restart

    Stopping xinetd: [ OK ]

    Starting xinetd: [ OK ]

    #

    ```


    Take a look at a long list of the files in /etc/xinetd.d and cat the file ftp
    on your IA-32 system. You would edit wu-ftp on both your Red Hat Advanced Server
    Integrity server and on the IA-32 system, but use ftp in this example:


    ```

    # cd /etc/xinetd.d

    total 24

    -rw-r--r-- 1 root root 297 Apr 4 2002 charger

    -rw-r--r-- 1 root root 317 Apr 4 2002 charger-udp

    -rw-r--r-- 1 root root 297 Apr 4 2002 daytime

    -rw-r--r-- 1 root root 317 Apr 4 2002 daytime-udp

    -rw-r--r-- 1 root root 289 Apr 4 2002 echo

    ```'
  merge: -1
  pgno: 185
- img_proc: true
  md: 'As you look at the contents of the /etc/xinetd.d directory, it''s important
    to note that often, new ftp-related programs are introduced into Linux. I mentioned
    that wu-ftp earlier, and we will also see that here. If this were Red Hat 9, you
    might see vsftp or others as well.


    As you can see from the output of the cat command, at this time, ftp is enabled
    because disable = no. You may consider this to be a potential security problem.
    If so, we would perform the following steps to turn off ftp:


    +   1. Edit /etc/xinetd.d/ftp (or wu-ftp) on Advanced Server) and set disable
    = yes.

    2. Run /sbin/xinetd restart to re-read the new value of disable for ftp on Red
    Hat or /etc/init.d/xinetd restart as a general command.


