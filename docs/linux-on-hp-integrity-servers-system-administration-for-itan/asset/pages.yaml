- img_proc: true
  md: '# Chapter 6 System Startup and Shutdown Scripts


    as root, remember not to make any changes to the script without backing up

    t original.

    The startup and shutdown scripts in /etc/init.d generally perform both

    startup and shutdown functions. These startup and shutdown scripts recognize

    many arguments, including the following:


    +   * start

    * stop

    * restart

    * status

    * condrestart


    See if you can find these in /etc/init.d/smb. If you do, see if you can

    understand what they do. Now, test some of these arguments. We''ll start

    smb, obtain its status, stop smb, and re-obtain its status. Remember, to do

    these things, you must be logged on as root:


    ```

    # /.smb start

    Starting SMB services: [ OK ]

    Starting NMB services: [ OK ]


    # /.smb status

    smbd (pid 11165) is running...

    mbd (pid 11170) is running...


    # /.smb stop

    Shutting down SMB services: [ OK ]

    Shutting down NMB services: [ OK ]


    # /.smb status

    smbd is stopped

    mbd is stopped

    ```


    As you can see, the script obviously works great, but does not start

    automatically at system boot. Make sure that you''re in /etc/rc.d, then search

    for all files in /etc/rc.d that contain smb. If you do, you get the following:'
