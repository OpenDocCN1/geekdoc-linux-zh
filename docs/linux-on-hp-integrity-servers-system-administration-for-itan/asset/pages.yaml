    When creating the tar backup, I first changed to the /var/log directory and used
    the ls command (a grav or accent, which is near the upper left of most keyboards
    on the key as a tilde, appears before and after the ls. This produced relative
    path names that I could easily restore to the /tmp/log directory. Alternatively,
    I could have just changed directory to /var and issued the command tar cf /dev/st0
    log to back up the entire contents of the /var/log directory.


    This entire process could have been done on a single command line. The following
    line shows the commonly used procedure for producing an archive in the fromdir
    and restoring it to the todir.


    # cd fromdir ; tar cf - . | ( cd todir ; tar xf -)


    For our example, we would perform the following:


    ```

    # mkdir /tmp/log

    # cd /var/log; tar cf - . | ( cd /tmp/log; tar xfBp -)

    ```


    The "-" in the tar cf tells tar to send its data to standard output. The "-" in
    the tar xfBp command tells tar to look to standard input for data, which is the
    data produced by tar cf issued earlier on the command line.'
