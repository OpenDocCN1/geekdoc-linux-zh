- img_proc: true
  md: 'EFI Institute group X3T10 uses for what the computer industry calls Integrated
    Drive Electronics (IDE) - in this case, a DVD-ROM.


    Table 1-1 summarizes the fields that we analyzed for all the entries. Keep in
    mind that some of this information, such as the Acpi data, is most often necessary
    to help analyze the system in the event of a problem.


    # Table 1-1 Description of EFI Device Mappings Field


    | Item | Description |

    |---|---|

    | blkn | Physical drive or a partition on a physical drive. A physical drive can
    be a hard disk drive or a removable media drive. A Part in parenthesis is shown
    in the examples when there is a partition on a disk drive. |

    | Acpi(Device,X) | The device type is the first entry in the parenthesis. The
    second entry, X, is the PCI host number. Acpi is Advance Configuration and Power
    Interface. |

    | Pci(D,F) | This indicates PCI-related information. D is the PCI device/slot
    number and F is the PCI function number. |

    | Scsi(Pun,Lun) | The physical characteristic of the disk which is SCSI. The Pun
    is the SCSI number and the Lun is the LUN number on the physical device. |

    | HD(Part,Sig) | The partition Part and EFI Signature Sig on the partition. |


    Keep in mind that the file system numbers may change when you remap devices or
    when components are added or removed, such as a DVD device.


