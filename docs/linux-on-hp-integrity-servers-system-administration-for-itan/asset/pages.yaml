  md: '# Commonly Used Commands


    This example shows the server and address used for the nslookup command. Then
    the fully qualified name of your system appears and its IP address.


    You may get a message indicating that nslookup may be replaced in the future.
    You can use dig, which provides more detailed information on host lookup. dig
    is a newer command than nslookup and will be available in future releases.


    # /etc/hosts


    As mentioned earlier, this file contains information about the other systems to
    which you are connected. It contains the Internet address of each system, the
    system name, and any aliases for the system name.


    # /etc/securety for Equivalent root Access


    If you have a highly self-contained environment, you can set up your Linux systems
    so that root can run remote commands from one system to another, login to a remote
    system without a password, and perform other functions by making entries in /etc/securety.
    /hosts.equiv performs nearly the same function for other users. Using /etc/securety
    is considered a severe security risk, so please use this technique for system-to-system
    openness only if you have an environment that is not exposed to any users who
    are potential security threats. The secure shell (SSH) and other such tools is
    highly preferable to this technique because they use encryption.


    To root as an equivalent user on multiple systems, enter the desired services
    into /etc/securety. The following example shows entries for rexec, rsh, rlogin.
    To allow root to log in using these tools via telnet, make the following entries
    in /etc/securety:


    ```

    rexec

    rsh

    rlogin

    pts/0

    pts/1

    ```'
