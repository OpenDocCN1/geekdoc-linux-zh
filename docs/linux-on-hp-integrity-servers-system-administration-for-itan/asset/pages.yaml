  md: '# dump and restore


    ```

    Installing dosfools-2.7-1.

    Installing e2fsprogs-1.26-1.72.

    Installing eject-2.0.9-2.

    Installing elilo-3.2-4

    [root@demtstdi]#

    ```


    Notice that as part of restoring the file, we had to specify a volume

    number of and decide whether we wanted to set the mode for the file. Also

    note that the restore took place with a relative path name.


    To get a table of contents from the tape, you would have used -t.

    Another commonly used option with restore is -i, which performs an inter-active
    restore that was not part of the example.


    You could also create a file that automatically performs several file

    system backups for you. dump creates a large file for the system that is part

    of the backup. That means you can put multiple files on a backup

    tape. You can be using a tape device file of /dev/sdt0, which is a rewind

    tape device. Because you want to put multiple tapes on the file, use a

    rewind device of /dev/nst0. When you use the mount command, mt, you

    can control this tape drive using options such as rewind and eject.


    Since the length of the tape and density are not known, run dump-commands and
    pipe the output to gzip, which gives you some compression.

    nThe following file that we''ll call dump.file contains these commands:


    ```

    # cat dump.file

    mt -f /dev/nst0 rewind

    ```


    ```

    dump -ouf /dev/sda gzip --fast -c > /dev/nst0

    #fill in other file systems /dev/sdx

    ```


    ```

    mt -f /dev/nst0 rewind

    mt -f /dev/nst0 eject

    ```


    You have only one file to backup on your system, but you could

    add dump lines for all of your files. First, mount the tape with mt.

    Next, run the dump commands and pipe them to gzip with the --fast option

    to make the backup go much faster; however, the compression is not

    dense without this. You also use gzip output to standard output

    with -c. You''re going to dump only /dev/sda in the example but you could

    add additional lines. When you run the file, it will perform the dumps. The

    drives:


    ```

    # cat dump.file

    mt -f /dev/nst0 rewind

    ```'
