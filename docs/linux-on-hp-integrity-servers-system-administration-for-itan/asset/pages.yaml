    # iptables


    **iptables** is used at the command line to implement packet filtering. It is
    accomplished by inserting and deleting rules from the kernel''s packet filtering
    section. **iptables** is a newer method of packet filtering that is considered
    superior to the method it replaced, called **ipchains**. **ipchains** was available
    in kernel release 2.2 and **iptables** became in 2.4 which was used as the basis
    for the examples in this book. **iptables** is still available, and as a side
    note, the following URL contains an excellent "how to" document for working with
    **iptables**:


    ```

    http://www.tdp.org/HOWTO/IPCHAINS-HOWTO.html

    ```


    An excellent **potables** "how to" document is:


    ```

    http://www.linxguruz.org/iptables/howto

    ```'
