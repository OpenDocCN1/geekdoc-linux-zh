  md: '# Chapter 3


    # GNOME and KDE


    GNOME and KDE are Graphical User Interfaces (GUIs) that are available for Linux.
    Most Linux variants bundle both of these GUIs so you have your choice of which
    to use. Both are based on the X Window System (X Windows) and provide a fully
    functional graphical user environment. Both GNOME and KDE are independent of the
    core Linux operating system, including the kernel. You can customize and even
    crash either of these GUIs and Linux keeps running.


    This chapter does not spend a lot of time explaining these environments and showing
    a lot of screen shots for each. Everyone has used a graphical environment and
    the best way to customize one is experimenting and finding what best suits your
    needs. Thus, this chapter provides an overview of each with most customization
    preferences left to the reader. This chapter also touches on the free office software
    package, OpenOffice.org, available from www.openoffice.org.


    This chapter covers the following.


    +   - Overview of GNOME and KDE

    - Obtaining and installing OpenOffice.org'
  merge: -1
  pgno: 92
- img_proc: true
  md: '# GNOME


    GNOME (GNU Network Object Model Environment) is a full graphical desktop environment
    and application framework for Linux and other Linux systems. GNOME includes a
    panel for starting applications, a graphical desktop, and a set of standard desktop
    tools and applications. If you want a newer version of GNOME, want it for another
    platform, or want any information related to GNOME, you can find it at http://www.gnome.org.
    GNOME is part of the GNOME project, which means it is open-source software.


    GNOME is not a window manager itself. Instead, it uses a variety of window managers
    from which you can select (Sawfish being the default window manager). GNOME provides
    development libraries and session management. Applications that use these features
    are tightly integrated with GNOME. Since GNOME is based on X Windows, X-based
    applications work great with GNOME.


    GNOME is included with Red Hat Advanced Server for your Integrity server and also
    comes with all Red Hat distributions. After logging in using GNOME, I had a fully
    functional GNOME windowing environment, as shown in Figure 3-1. Note that the
    windows displayed in Figure 3-1 are not the default. GNOME opens with the applications
    open from my last session. and my other preferences automatically. By default,
    if you logout, GNOME also asks you if you would like to save your current session
    settings. If you do, whatever you were doing last will be started when you login
    again. GNOME also lets you configure your session using the Session preference
    tool Main (or Start) Menu ⇒ Preferences ⇒ More Preferences ⇒ Sessions).'
