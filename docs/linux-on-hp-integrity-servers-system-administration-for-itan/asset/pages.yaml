  md: '# Check Processes with ps


    To find the answer to “What is my system doing?,” use ps -ef. This command provides
    information about every running process on your system. If, for instance, you
    want to know about telnet connections, simply type ps -ef and look for telnet.
    Although ps tells you every process that is running on your system, it doesn’t
    provide a good summary of the level of resources being consumed. I would guess
    that ps is the most used system administration command. You can use a number of
    options with ps. I normally use e and f, which provide information about every
