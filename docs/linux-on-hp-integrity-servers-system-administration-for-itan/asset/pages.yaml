- img_proc: true
  md: '# Windows Server 2003


    Windows installs on an Integrity server just as it would on any other system.
    As with Linux, you select Removable Media and walk through the familiar Windows
    installation process so I won''t cover installing Windows in this section. There
    are however, some interesting aspects to running Windows on an HP Integrity server
    that are covered in this section. The first is Special Administration Console
    (SAC) which is covered in the next section. There are also some interesting configuration
    topics under Installing and Configuring NetRAID that include installing drivers
    and setting up storage on Integrity servers using the Itanium configuration DVD.


    The following section covers SAC.


    # Special Administration Console (SAC)


    Special Administration Console (SAC) is a command-line environment on Windows
    Server 2003. It provides a set of commands that can be used to perform many functions
    such as viewing and ending processes and working with the IP addresses of systems.
    It is separate from the Windows command line environment and can be used for remote
    management. SAC is part of Emergency Management Services, which must be enabled
    to use SAC.


    SAC is available early in the boot process. You can use it to assist with management
    during normal system operation as well as in Safe Mode. Safe mode is a way of
    starting Windows using only the basic elements of the operating system. You can
    use the F8 key when the system starts to go into safe mode. In the examples, you''ll
    use SAC in normal operation and on the system console.


    SAC provides a set of commands you can use to perform a number of management tasks
    that help return your system to a normally functioning state. These tasks include:


    +   * Viewing a list of processes.

    * Ending processes.

    * Setting or viewing the Internet Protocol (IP) address of the server.

    * Generating a Stop error to create a memory dump file.

    * Starting and accessing command prompts.

    * Restarting the server.

    * Shutting down the server.'
  merge: -1
  pgno: 341
- img_proc: true
  md: 'This section provides examples of issuing some basic commands on SAC on an
    Integrity system. Table 13-1 is a list of some of the SAC commands available at
    the time of this writing.


    # TABLE 13-1 SAC Commands and Descriptions


    | Command | Description |

    | --- | --- |

    | ch | Lists all channels. Use ch -? for help. |

    | cmd | Creates Windows command-prompt channels. To use a command-prompt channel,
    you must provide valid logon credentials. You must log on to each command-prompt
    instance. |

    | crashdump | Crashes the system. You must have crash dump enabled. |

    | d | Deletes the current kernel log. |

    | f | Toggles the information output by the-list command, which shows processes
    only, or shows processes and threads |

    | I | If no parameters are used, this command lists Internet Protocol (IP) information.
    You can configure IP parameters to display or set the IP address, subnet mask,
    and gateway of a given network interface device by providing the network number,
    IP address, and subnet information. To do, use the following format: <network#><IPAddress><subnet>
    |

    | Id | Displays identification information about the server. |

    | k <PID> | Ends the given process. PID is the process identification number you
    specify. |

    | 1<PID> | Lowers the priority of a process (and any associated child processes)
    to the lowest possible level. |'
  merge: -1
  pgno: 342
- img_proc: true
  md: '# Chapter 13 HP-UX and Windows Installation on Integrity Servers


    | Command | Description |

    |---|---|

    | lock | Restricts access to Emergency Management Services command-prompt channels.
    You must provide valid credentials to unlock a channel. |

    | m <PID> <MB-allow> | Limits the memory usage of a process (and any associated
    child processes) to a specified number of megabytes. MB is the number of megabytes
    you specify. |

    | p | Causes output to pause after displaying one full screen of information.
    |

    | r | Restarts the computer. |

    | s | If no parameters are passed, this command displays the current date using
    the 24-hour clock format. You can set the system time by providing the date and,
    optionally, the time in this format: mm/dd/yyyy hh:mm. |

    | shutdown | Initiates a shutdown. |

    | t | Lists the currently running processes and threads. |

    | help or ? | Lists the available commands. |


    These commands are issued at the **SAC>** prompt. You can also set up the channels,
    which are direct connections to the Windows operating system specified by user
    and domain. SAC is also a channel. You can switch between these channels to perform
    your work. Table 13-2 shows some commonly used channel-related commands.'
