  md: '# Steps to Creating a Linux Kernel


    # Update Boot Program


    Now that we have our new kernel in place, you want to be able to boot both the
    original rock-solid kernel and the new experimental one. I''ll use the LILO boot
    loader. Many boot loaders exist, including GRUB (GRand Unified Bootloader), that
    work in a similar fashion. LILO is simple and easy to understand, so it will be
    ideal for this example.


    Update the /etc/lilo.conf file to include the new kernel in addition to the existing
    kernel, and make the default new experimental kernel, as shown in the following
    IA-32 system /etc/lilo.conf file:


    ```

    prompt

    timeout=50

    default=linux-2.5.25

    boot=/dev/hda

    map=/boot/map

    install=/boot/boot.b

    message=/boot/message

    linear

    ```


    ```

    image=/boot/vmlinuz-2.5.25

    label=linux-2.5.25

    initrd=/boot/initrd-2.5.25.img

    read-only

    root=/dev/hda5

    ```


    ```

    image=/boot/vmlinuz-2.4.18-3

    label=linux

    initrd=/boot/initrd-2.4.18-3.img

    read-only

    root=/dev/hda5

    ```


    There are two kernel entries in this file, and you''d add one for each kernel
    you want to boot. The default simply specifies the default; all the kernels will
    be displayed for you when the system boots and you can select the one you want
    to boot.


    You run the /sbin/lilo command to install the boot loader and activate the changes
    you made to the /etc/lilo.conf file. If you use the -v option, you get a lot of
    informative messages related to your update. The following list shows running
    /sbin/lilo -v:'
