  md: 'user ID (UID). The identification number of the user. Every user on your system
    should have a unique UID. Most systems are automatically assigned UIDs of less
    than 100. These are normally automatically assigned by Linux. The system normally
    assigns standard users starting at UID 500.


    group ID (GID). The identification number of the group. The members of the group
    and their GID are in the /etc/group file. The system administrator can change
    the GID if they don''t like it, but may also have to change the GID of many files.
    As a user creates a file, he or her UID is assigned to the file as well as the
    GID. This means that if the system administrator changes the GID well after users
    of the same group have created many files and directories, they may have to change
    the GID of all these.


    optional user info. In this space, you can make entries, such as the user''s phone
    number or full name. You can leave this blank, but if you manage a system or network
    with many users, you may want to add the user''s full name and extension so if
    you need to get in touch with him or her, you''ll have the information at your
    fingertips


    home directory. The home directory defines the default location for all the users''
    files and directories. This is the present working directory at the time of login.


    shell. This is the startup program that the user will run at the time of login.
    The shell is really a command interpreter for the commands the user issues from
    the command line. The system administrator usually decides what shells are supported
    based on the setup files they have developed. On Linux systems, the default shell
    is Bash.


    The location of the user''s home directory is another important entry in the /etc/passwd
    file. You have to select a location for the user''s “home” directory in the file
    system where the user''s files will be stored. With some of the advanced networking
    technology that exists, such as NFS, the user''s home directory does not even
    have to be on a disk that is physically connected to the computer he she is using!
    The traditional place to locate a user''s home directory on a Linux system is
    the /home directory.


    The /home directory is typically the most dynamic in terms of growth. Users create
    and delete files in their home directory on a regular basis. So, you have to do
    more planning related to your user area than in more static'
