    Some of the connections are ESTABLISHED (such as the linuxdev-telnet connection
    in the listing). This is the connection you have initiated to this system. You
    are connected from F4457MXP with a telnet session open to the system linuxdev.


    Most of the remaining tcp protocols are listening, as swat. This means they are
    listening for incoming connections, as indicated by the LISTEN. They have a wild
    card in the Foreign Address field, which will contain the address when a connection
    has been established. Your connection is one of the few connections that has been
    made, as indicated by the ESTABLISHED.


    All the send and receive queues, shown as Recv-Q and Send-Q, are empty as indicated
    by 0.


    The UNIX domain sockets at the end of the output are datagram connections for
    a variety of services such as X11. This output gives you an appreciation of the
    immense amount of activity taking place from a networking perspective on your
    Linux system. Networking and connectivity have been among the most advanced aspects
    of Linux since its inception.


    # route


    The information displayed with netstat -a includes the routing tables for your
    system. Some are automatically created with the ifconfig command when your system
    is booted or when the network interface is initialized. Routes to networks and
    hosts that are not directly connected to your system are entered with the route
    command.


    Routing is required if your system is connected to a network with multiple subnets.
    Most of the time, your Linux system is aware of three routes. The first is the
    loopback route, which points to the loopback device which was in the earlier netstat
    -r example. The next route is to the same LAN to which the system is connected,
    which means that packets are sent directly to a system. The third is the default
    route, which is the destination for packets not on the same LAN as the system.
    If you type the route command on your Linux system with no options, you''ll see
    an output similar to netstat -r, as shown in the following example:'
  merge: -1
