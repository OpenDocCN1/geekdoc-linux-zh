  md: '# File System Maintenance with fsck and e2fsck, inodes, and Superblock


    # fsck and e2fsck


    **fsck** (file system check) is a program used for file system maintenance on
    Linux and UNIX systems. **fsck** checks file system consistency and can make many
    “life-saving” repairs to a corrupt file system. **fsck** can be run with several
    options. The program used for ext2 file systems checking is **e2fsck**. If you
    try running **fsck** on an *ext2* or *ext3* file system, you’ll see that **fsck**
    automatically calls **e2fsck**. The following are some of the more commonly used
    options with **e2fsck**:


    +   - -b superblock


    Normally, **e2fsck** uses blocks to find partition-related information. if, however
    block 1 id is corrupted, you can specify a block number that usually exists 8192
    blocks. You’d specify 8193, 16385, and so on as alternates. You can also find
    backup superblocks by noting them when the file system is created (as shown in
    the earlier listing), or by using the mke2fs program using the -n option to print
    out where the superblocks were created. The -b option to mke2fs, which specifies
    blocksize of the filesystem must be specified in order for the superblock locations
    that are printed out to be accurate. See the man pages for **e2fsck** and **mke2fs**
    for more information.


    +   - -c


    Runs the *badblocks* program to find bad blocks on the file system and adds them
    to the bad block inode.


    +   - -f


    Forces checking of the file system even if it is thought to be clean.


    +   - -y


    Responds *yes* to all questions so that **e2fsck** can be run non-interactively.


    +   - -v


    Runs in *verbose* mode.


    To run **e2fsck** on partition /dev/sdb1 with the -y and -v options, would do
    the following:'
  merge: -1
