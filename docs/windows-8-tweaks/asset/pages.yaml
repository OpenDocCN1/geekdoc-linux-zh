- pgno: 360
  md: '# CHAPTER

    19


    # Internet Security


    The Internet is the primary source for almost all the attacks on your computer.
    Someone may be trying to break in to steal information, or a worm from another
    infected computer may be trying to use the latest exploit to infect your box as
    well. So how do you protect your Internet connection? I show you how you can test
    your computer and see how vulnerable it actually is. Then you find out how you
    can use the firewalls to build a “brick wall” around your computer. Additionally,
    you discover how to protect yourself from other Internet threats such as spyware
    and what to do to clean up an infection.


    # Analyzing Your Security


    The first step in securing your Internet connection is detecting where you are
    vulnerable. Your specific network setup (for example, if your computer is behind
    a hardware firewall or router) will affect how exposed your computer is. For example,
    if you have a high-speed broadband connection and share it with more than one
    computer in your home using a router, your computers are already better protected
    than a computer that is just directly connected to the Internet. By default, most
    routers act as a firewall by blocking all external'
  merge: -1
  img_proc: true
- pgno: 361
  md: 'Internet traffic from coming into your home network. However, if your laptop
    is infected and you plug it into your home network, all the machines become vulnerable
    because the threat is now inside your firewall. I go into more detail about how
    firewalls work in the next section, but first, test your connection to see how
    exposed your computers are to attacks from the Internet and from other machines
    on your internal network.


    # # Testing Internet Security


    Ports are the gateways inside your computer. When a computer program wants to
    communicate with a remote computer, it makes a connection through a port that
    it uses to talk with the computer. Each computer has thousands of ports-65,535
    to be exact. You can think of the different ports as a bunch of different mailboxes.
    When a program wants to send data to a remote computer, it sends it to a specific
    port (mailbox) number. Then, provided that a program on the remote computer is
    set up to receive data at a particular port (mailbox), the remote computer can
    work with the data it was sent.


    Theoretically, nothing is wrong with this scenario. In the real world, applications
    don''t always work this way. Sometimes, applications are sent data they are not
    programmed to receive. This can cause errors and unexpected behavior that may
    execute code a remote attacker is sending it. The result is that a remote attacker
    can gain access or infect your computer using a flaw in the application. The technical
    name for data sent to a program that results in bypassing security is an *exploit*.


    Now that you know the basics of how attacks work, you can use various utilities
    to check for open ports that allow other users to connect. In theory, if you have
    no ports open, it is next to impossible to break into your computer. To detect
    the ports on your computer that are open to the entire Internet, it is best to
    use a web-based port scanner. If your computer is on an internal network and is
    behind a firewall or router, a software-based port scanner will show you what
    ports are open internally.


    First, check your external port exposure, which everyone on the Internet can see.
    To do this, use a web-based port scanner. Various websites offer such scanners
    free of charge. I personally like to use GRC.com to do my testing. Follow these
    steps to test your external connection:


    +   1. Open a copy of either Internet Explorer or Firefox and navigate to http://tweaks.com/238748.

    2. When the page loads, click the Proceed button.'
  merge: -1
  img_proc: true
- pgno: 362
  md: '+   3. Click All Service Ports to begin the scan.


    +   4. When viewing the results, make sure that everything is in green or blue.
    You do not want any ports to be open for maximum security, which is indicated
    with red. Green indicates your computer did not respond at all, giving your computer
    a stealth look. Blue indicates your computer responded that the tested port was
    closed.


    If your test results show any ports that are open, you can find out how to close
    those in the “Using a Firewall” section, but first, if you are connected to an
    internal network, it is a good idea to test your internal vulnerability. As I
    mentioned earlier, it is best to use a software port scanner for testing your
    internal vulnerability. For this test, you learn how to use Axcence NetTools,
    a comprehensive network tools suite with a fast port scanner. To get started,
    visit http://tweaks.com/570140 and download the latest copy of NetTools. Then
    follow these steps to scan your computer’s local ports:


    +   1. After you have downloaded and installed Axcence NetTools, start it if it
    is not already running. Open the Start screen, type nettools, and press Enter.


    +   2. After NetTools starts, click the Scan Host toolbar option on the icon bar.


    +   3. In the Address box, type localhost.


    If you want to scan a different computer, you can type the IP address of any computer
    in this box.


    +   4. Set the port range for it to scan. In NetTools you have four options: Services,
    Ports (well known), Ports (well known-extended), and Ports (range). For this example
    use Ports (range) to scan all possible ports. Enter 65535 in the end Ports box
    so that it goes through all possible port numbers.


    The other selections scan only the more popular ports where known applications
    are running. If you want a quicker scan, I recommend using Ports (well known-extended).
    Because you want to do a complete scan here, select Ports (range). The two ports
    boxes will be enabled.


    +   5. Click Scan next to the Address box and watch the results appear, as shown
    in Figure 19-1.


    It can take more than an hour to scan all 65,353 ports on your computer, depending
    on your hardware. After it is finished, you have a list of all ports that are
    open in your computer. You find out how to close these ports later in the “Using
    a Firewall” section.'
