- pgno: 262
  md: '# CHAPTER 14


    # # Speeding Up the Logon Process


    Ever wonder why it takes your computer so long to start up after you log on? After
    all, the system already loaded the majority of the operating system components.
    Does your computer take longer to load after you sign on than it used to take
    when you first brought it home? These are some of the questions this chapter answers.
    You can make your system load faster by using a number of cool tweaks and hacks.
    The previous chapter touched on how to make the system boot faster. This chapter
    concentrates on how to make the system load faster after the operating system
    has loaded and you are presented with the welcome sign-on screen.


    After you turn on your computer, it goes through the boot-up process, which loads
    the main system components and drivers. When those are finished loading, the Windows
    shell is started and the lock screen is displayed. After the lock screen is displayed
    and you sign on, the system begins to load your user profile settings and the
    rest of the Windows shell. When that is finished loading, the system runs the
    applications that are in the startup folder as well as other sneaky registry startup
    programs. After these applications are finished loading, the busy icon no longer
    represents your cursor, and you are set to do whatever you want with your computer.


    This chapter begins by examining ways to speed up the logon process. Then it discusses
    how to get rid of all those extra applications that run at startup that further
    slow down your computer. When you use the tips you learn in this chapter, your
    system will have a much faster loading time.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# Speeding Up the Logon


    As I just mentioned, a lot occurs when you log on to your computer. Windows has
    to validate your password, load your profile settings, apply the settings, and
    then launch any additional applications that are registered to start automatically.
    Those are a lot of areas to fine-tune to allow for a faster logon. To get started,
    take a look at PIN logon.


    # Using a PIN Instead of a Password


    I always use a long password to protect my user accounts and data on my Windows
    8 PC. Although this provides great security for my account, it is time-consuming
    every time I turn on my PC. The new account PIN feature in Windows 8 provides
    an alternative logon method. Instead of typing in your password, key in your four-digit
    PIN and you are logged in immediately. I found this feature to be a compromise
    that speeds up the logon of my PC, but still allows me to keep a strong password
    for remote access.


    Setting a PIN for your account was discussed in Chapter 5. For your convenience,
    below is a recap of the steps to enable a PIN for your account:


    +   1. Open the Start screen, type in **PIN**, click the Settings filter, and
    hit Enter.

    2. Under Sign-in Options click on the Create A PIN button.

    3. Enter your current password when asked.

    4. Enter your PIN twice and click Finish.


    # Enabling Automatic Logon


    If you are the primary user of your computer and you do not have any other users,
    or if everyone in your household uses the same username, you are the perfect candidate
    for enabling automatic logon. Automatic logon is a great technique that saves
    you time by canceling the need for your computer to wait while you type your password.
    Even if you do not have a password assigned to your account, you are still required
    by the logon welcome screen to click your name to sign in. Having to do these
    tasks manually is an unnecessary waste of time when you can use automatic logon
    instead.


    Enabling automatic logon is a quick and easy registry hack. Follow these steps
    to speed up your sign-on with automatic logon:


    +   1. Open the Start screen, type **regedit**, and press Enter.

    2. After Registry Editor has started, navigate through HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Windows
    NT\\CurrentVersion\\Winlogon.

    3. Locate the AutoAdminLogon entry. If the key does not exist, create it by right-clicking
    the Winlogon folder and clicking New, and then String Value.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '+   4. Right-click the AutoAdminLogon entry and click Modify. Set the Value
    to 1, as shown in Figure 14-1. Then click OK to save the new value.


    > Automatic logon can be a great feature, but it can also create a security problem
    for your computer. If you use your computer for business, if you have data you
    prefer to keep safe from others, or, both, I strongly recommend that you do not
    enable this feature. If you happen to step out of your office or if your laptop
    is stolen, you have left the door to your computer wide open. By enabling automatic
    logon, you are trading convenience for physical access security. However, you
    are not changing your network security, so your data is still safe from network
    attackers. The risk of someone remotely connecting to your computer is the same
    as if you did not have automatic logon enabled.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_264_0.png)


    Figure 14-1: Set AutoAdminLogon to 1 to activate automatic logon.


    +   5. Locate the DefaultUserName entry or create a string value if it does not
    exist.


    +   6. Right-click DefaultUserName and select Modify. Set the value to the username
    that you primarily use to sign in to Windows. Click OK.


    +   7. Locate the DefaultPassword entry or create a string value if it does not
    exist.


    +   8. Right-click the DefaultPassword entry and set the value to your password.


    +   9. Close Registry Editor and restart your computer.'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'After you reboot your computer, Windows 8 should automatically sign on to your
    account. Your computer should now get to the desktop more quickly than before.
    If you ever want to disable automatic logon, go back into Registry Editor and
    set the AutoAdminLogon entry to 0. It’s also a good idea to delete the DefaultPassword
    string value so your password is not stored in plain text in the registry.


    # # Adjust the Startup Programs


    After you sign on, the system loads your profile, finishes loading the Explorer
    shell, and then begins to load the startup programs. If you have ever purchased
    a computer, either online or from a retail store, I am sure that you have noticed
    all the annoying software programs that load automatically right after you sign
    on. Some computer manufacturers go so far overboard with startup applications
    that Windows has to hide them so that your taskbar has enough space to show open
    windows. If you are like me and have built your own computer, you do not have
    to deal with all the preloaded junk that comes from the big computer manufacturers.
    Nevertheless, you are still vulnerable to auto-start programs that are installed
    by many of the popular applications you use. Over time, as you install more applications,
    the automatic startup applications can get out of control and definitely slow
    down your logon.


    Popular applications such as Adobe Photoshop, Skype, Java, iTunes, and many more
    install auto-start components. Consider all the extra auto-start components these
    applications add on top of the auto-start applications already installed on your
    computer, such as antivirus and anti-spyware applications. Your logon can slow
    to a crawl because of the dozens of applications that load after you sign on.
    This section helps you discover what programs are starting automatically and then
    shows you some great tricks to stop them all from starting up.


    # ## Identifying and Disabling Auto-Start Applications


    The first step in stopping the auto-start applications is to identify exactly
    what is starting up and whether it is needed. You can use two different utilities
    to find this information. The first is the enhanced Task Manager utility that
    comes with Windows 8. Task Manager now enables you to see which applications start
    on logon. Another great utility is called Autoruns by Microsoft Sysinternals.
    Autoruns is a more comprehensive utility that enables you to see all applications
    that run on logon, as well as other types of auto-starts such as browser or shell
    plug-ins.


    First, I cover using Windows 8’s Task Manager to identify and disable unneeded
    auto-start applications. Then I dive into using Microsoft Sysinternal’s Autoruns
    to disable auto-start applications as well as other auto-start components.'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# Using Task Manager to Identify and Disable Unneeded Startup Applications


    The enhanced Task Manager utility included in Windows 8 is very easy to use. Additionally,
    it shows you which applications have a big impact on your system startup. First,
    you need to get a list of all the applications and components that start up automatically
    when you sign in. To do so, follow these steps:


    +   1. Open the Start screen, type `taskmgr`, and press Enter.

    2. After Task Manager has loaded, click the Startup tab, as shown in Figure 14-2.
    Now that the list of the active startup programs is visible, you need to research
    what programs should be removed.

    3. Because almost every computer has different programs starting up after logon,
    it is best to search the Web with the executable filename to find out if the application
    can be safely removed from startup. One useful site to visit is a database of
    common startup programs called AnswersThatWork, located at http://tweaks.com/614125.
    This site provides a recommendation for each of the programs listed. If you cannot
    find one of your programs listed, do a quick search on Google and most likely
    you will find several websites showing what the program does and how removing
    it will affect your system.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_266_0.png)


    **Figure 14-2:** Task Manager''s Startup tab shows which programs load at startup.'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'It’s easy to remove the automatic startup applications. When you have Task
    Manager open, navigate to the Startup tab and follow these steps:


    +   1. Locate the item you would like to disable from starting up.

    2. Right-click it and click *Disable*.


    After you remove some of the automatic startup applications, you can sign on much
    faster. If you have any problems after disabling a startup application component,
    you can always enable it again by right-clicking on it in Task Manager on the
    Startup tab and clicking *Enable*.


    # Using Autoruns to Identify and Disable Auto-Start Components


    Autoruns by Microsoft Sysinternals is a comprehensive tool for identifying and
    disabling unneeded auto-start applications, components, and plug-ins. Similar
    to the System Configuration tool, Autoruns operates in the same way but shows
    the auto-start components of other items, such as browsers and the system shell.


    Autoruns is easy to use. To get started, you need to download a free copy of the
    Autoruns software from [http://tweaks.com/812786](http://tweaks.com/812786). After
    you have Autoruns downloaded and extracted to a folder, follow these steps to
    get started:


    +   1. Go to the directory where you have extracted Autoruns and run `autoruns.exe`.

    2. When Autoruns starts, click the *Logon* tab, as shown in Figure 14-3.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_267_0.png)


    **Figure 14-3:** Use Autoruns to control which apps run automatically when you
    start up your computer.'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'The auto-start applications display, similar to Task Manager. Identifying an
    unneeded service is even easier in Autoruns because of the right-click search
    feature. Right-click any entry and select Search Online. This opens your web browser
    automatically and searches Google for the process name. Simply selecting the entry
    also provides more information about what it is.


    +   3. Disabling a process is similar to using the System Configuration tool.
    Just clear the box to the left of the process name and it no longer starts after
    a reboot.


    The power of the Autoruns software lies in its ability to control other auto-start
    components, such as browser add-ons and Explorer shell plug-ins. Check out the
    following list of useful tabs available in Autoruns:


    +   • **Logon**—This tab lists everything that runs when you log on.


    +   • **Explorer**—This tab helps you get your shell extensions under control
    and view all the applications that tap into Windows Explorer with DLL files.


    +   • **Internet Explorer**—This tab enables you find applications that hook themselves
    into IE.


    +   • **Boot Execute**—This tab enables you to find applications that have integrated
    themselves into the system boot.


    +   • **Print Monitors**—Use this tab to get rid of extra print monitors for features
    that you don’t use.


    +   • **Drivers**—This tab provides another way to disable drivers for your hardware
    devices.


    +   • **Winlogon**—This tab enables you find all the applications that run on
    your logon screen.


    After you uncheck options, simply restart your computer for the change to take
    effect.


    # Controlling Auto-Start Applications That Keep Coming Back


    Some applications that you disable may begin to start up automatically again.
    Software developers often use various techniques to check that their application
    is registered to auto-start when you log on. If you disable an application’s automatic
    startup, some applications will re-enable themselves the next time they are run.
    The software developers may be trying to make sure you use their application by
    making it difficult to disable auto-start. In other cases, developers are just
    trying to make sure that other programs are not disabling their application.


    Software applications can often conflict and compete with each other for your
    computer’s resources. This occurred when I installed several media players'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'on my PC. After installing the programs Winamp, iTunes, RealPlayer, and Windows
    Media Player, I noticed that they would fight for my music file associations (that
    is, which application would open the file). Every time I ran RealPlayer, it changed
    all my music files over to be played in its player by default. The same thing
    happened when I tried to play my music files in other players. From this experience,
    I found that it was not uncommon for an application to install a program to be
    run at system startup that would check and take over (or preserve itself, as the
    developers call it) from other applications.


    Getting rid of these applications from your startup is much trickier than disabling
    them with Task Manager or Autoruns. It involves digging into the preferences of
    each application and changing several options. If you have an application that
    falls in this category, try a quick web search to find the steps specific to the
    application, or post a request for help on one of the various computer support
    websites, such as Tweaks.com''s forum at `Tweaks.com/forum`.


    # ## Customizing Auto-Start Programs for Other Users


    Each user account on your computer can have different auto-start applications
    associated with it. Certain programs may start up for one user but not for another.
    All these settings are stored in the system registry. With the help of the Registry
    Editor utility, you can change these entries manually.


    First, go to the registry where Windows 8 stores the auto-start information. Windows
    stores auto-start information in two places for every user. It stores which programs
    start for a specific user under the user''s registry hive/location. It also stores
    a list of programs that start automatically in the local machine hive. Registry
    entries in the local machine hive start up for all users of the computer, so removing
    these entries removes them for all users of the computer.


    Now that you know the two different types of startup items—user-specific and all-user
    entries—you can begin hacking the registry to change the startup programs. First,
    you learn to modify the startup programs for all users, and then you learn how
    to modify the startup programs for individual users.


    To modify the startup programs for all users, follow these steps:


    +   1. If you have not already done so, start Registry Editor by opening the Start
    screen, typing **regedit**, and pressing Enter.

    2. After Registry Editor has loaded, expand and navigate through `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Run`.
    You see a list of all the auto-start applications in the local machine context,
    as shown in Figure 14-4.'
  merge: -1
  img_proc: true
- pgno: 270
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_270_0.png)


    **Figure 14-4**: Registry Editor shows the auto-start programs for all users.


    +   3. To remove a startup program, right-click the name and select Delete. Alternatively,
    to add a new entry, right-click the white space and select New and then String
    Value. Right-click your new entry and select Modify so that you can edit it and
    set the value to the path of the executable you want to run.


    That is it. You now know how to add and remove programs that start up for all
    users on the computer. The steps for modifying the startup programs for individual
    users are very similar. The only difference is that you have to go to a different
    place in the registry.


    Instead of navigating in the registry under HKEY_LOCAL_MACHINE, you have two options.
    You can log on to an individual''s account and then go to HKEY_CURRENT_USER followed
    by the same navigation path used earlier. Alternatively, you can go to HKEY_USERS,
    expand the account SID (Security Identifier) key, and then follow the path used
    earlier.


    > **TIP** When navigating through HKEY_USERS it can be hard to identify whether
    a SID belongs a specific account. I wrote a handy utility available for free at
    Wingeek.com/Software called SID Resolver that translates the account SID to the
    actual account name.


    Both methods result in the same outcome. However, if you don''t have access to
    a user''s account, you can still modify his or her auto-start applications by
    going to HKEY_USERS.'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# Other Time-Saving Tips


    The preceding sections covered the largest contributors to a slow logon, but a
    few other tips can save you additional time. These tips do not save a lot of time
    individually, but when you apply them in combination, they can really add up.
    Furthermore, if you are running Windows 8 on older hardware, these tips help you
    significantly decrease your logon time even further.


    # Turning Off the Logon Sound


    The music that Windows 8 plays every time the logon screen displays (and then
    again when you log on) is something that you can do without. Hearing the tunes
    was really cool back when most people didn''t have sound cards in their computers.
    Nowadays everyone has a sound card, and the cool new Windows 8 logon sound is
    starting to get old. Less is more, and when your computer has to load a 500 KB
    media file to play, it slows things down. I recommend that you disable the logon
    sound. To do so, follow these steps:


    +   1. Open the Start screen, type **Control Panel**, and hit Enter.

    2. Click **Hardware & Sound** and then click **Change System Sounds** listed under
    **Sound**.

    3. Locate the **Program Events** box, scroll through the list, and click **Windows
    Logon**. Remove the assigned sound by setting it to **(None)** in the **Sounds**
    drop-down list.

    4. Below the **Program Events** list, remove the check next to **Play Windows
    Startup Sound** as shown in Figure 14-5.

    5. Click **OK** and you are finished.


    Now that wasn''t too bad. Plus, you just shaved another second off your loading
    time. If you want to save even more time in Windows, you can experiment with turning
    off all sounds by changing the Sound Scheme on the Audio Devices and Sound Themes
    screen from Windows Default to No Sounds.


    # Summary


    Throughout this chapter, you found out how to remove unnecessary steps from your
    logon to cut the fat from the system load and make your computer load faster.
    You learned how to remove auto-start programs as well as how to master the tricky
    programs that are hard to disable. This chapter also covered other ways to get
    that loading time down.'
