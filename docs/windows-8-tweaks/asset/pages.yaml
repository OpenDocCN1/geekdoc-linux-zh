    Now that you''ve finished customizing the look of your desktop and system icons,
    you can customize the desktop.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_124_0.png)


    **Figure 7-7:** Change an icon with Microangelo On Display.'
  merge: -1
