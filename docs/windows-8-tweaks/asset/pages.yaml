    # Changing the Location of the Paging File


    You can place the paging file on any storage device in your computer. If you really
    want to, you can even move the paging file to an external hard drive connected
    over USB (although this would probably slow down your system because'
  merge: -1
  img_proc: true
- pgno: 302
  md: 'an external hard drive is often slower than a hard drive connected inside your
    case). However, if you have multiple hard drives in your system, and I am not
    talking about multiple partitions on the same drive, you may see a performance
    increase if you move your paging file off the main system drive.


    Moving the paging file off your main drive allows it to be accessed faster when
    your primary hard drive is busy. When users add hard drives to their computers,
    these new hard drives are typically faster than the ones that the computers came
    with because of advances in technology over time. Moving your paging file to the
    faster hard drive will also help performance.


    Changing the location of the paging file is very easy. Just follow these steps
    and you will have it done in no time:


    +   1. Open the Start screen, type sysdm.cpl, and hit Enter.

    2. When System Properties loads, click the Advanced tab.

    3. Under the Performance section, click Settings.

    4. Click the Advanced tab and then click Change under the Virtual Memory section.

    5. Now that you have the Virtual Memory settings displayed, select the drive on
    which your current paging file is located.

    6. Before you make any changes, write down what the initial and maximum size text
    boxes contain. Then click the No Paging File option and click the Set button.

    7. Select the hard drive on which you want your new paging file to be placed.

    8. When the new hard drive is highlighted, select the Custom Size option and enter
    the numbers that you wrote down before. If you are not using the Custom Size mode,
    click the System Managed Size mode but keep in mind the negative aspects of the
    system managed paging file size such as fragmentation mentioned in the previous
    section.

    9. Click the Set button, and click OK to finish.


    After a reboot, your system uses the paging file on the new hard drive. Feel free
    to delete pagefile.sys from your old hard drive location; it no longer is needed
    there.


    # Defragmenting Your Hard Drive


    Fragmentation is everything when it comes to maintaining a traditional mechanical
    hard drive. Over time, as your hard drive fills up and you install and uninstall
    programs and games, the files on your hard drive can become fragmented, because
    Windows has to find open spots on your hard drive to place the file.'
  merge: -1
  img_proc: true
- pgno: 303
  md: 'Often the file is broken up into hundreds of little pieces and scattered all
    over the hard drive. This can cause a noticeable slowdown that can be easily cured
    by running a software program known as a *defragmenter*.


    Disk defragmenting software moves bits of the files around on the hard drives
    so that they are all placed together. This arrangement allows the hard drive to
    load a file faster because the head, which is the arm that reads the data off
    the plates inside the drive, does not have to scatter all over the place to read
    the data.


    Before I go any further, it is important to point out that solid state hard drives
    (SSD) that are often included in high-end laptops, desktops, and some Netbooks
    do not need to be defragmented. Solid state disks don’t have any moving parts
    and as a result, they have very low random read times. It makes no difference
    if parts of a file are spread all over the drive because there is no mechanical
    head that has to move to different parts of the drive to read data. Because of
    the elimination of that delay, using defrag utilities that were not designed for
    solid state drives on an SSD will have very little effect on its performance.
    In fact, you can prematurely wear out your SSD drive if you use the wrong utilities,
    so read the following sections carefully.


    # ## Using the Windows Defrag Utility


    The defrag utility in Windows 8 has been updated to do much more than just disk
    defragmentation. If you have a traditional hard drive, it does a good job of defragmenting
    your files using a basic optimization algorithm. Although it does not have all
    the bells and whistles of the third-party utilities, it is good enough for users
    who don’t want to pay for slightly better performance. If you have a solid state
    disk, the Windows defrag utility in Windows 8 is smart enough to apply specific
    optimizations that clear unused cells. This prepares the cells to be written to
    again using a feature most modern SSDs have called trim.


    The Windows defrag utility is called the Disk Defragmenter. You can access it
    in two ways: either on the Start screen or by right-clicking a drive in Computer
    and then selecting Properties. The utility is on the Tools tab of the drive properties.
    Follow these steps to use the Start screen shortcut:


    +   1. Open the Start screen, type **Disk Defrag**, change the scope to Settings,
    and hit Enter.

    2. Select the drive you want to defrag and then click *Analyze*. Analyze is not
    available for solid state drives.

    3. If the report shows your drive is fragmented, click *Optimize*. The utility
    begins to defragment your drive with multiple passes, as shown in Figure 16-8.
    If you have a solid state drive, a different process will run that trims the unused
    flash cells so they can be written to faster when they are needed.'
  merge: -1
  img_proc: true
- pgno: 304
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_304_0.png)


    **Figure 16-8:** Use Windows defrag utility to speed up your computer.


    # ## Using Third-Party Defrag Utilities


    A number of third-party defrag utilities offer advanced features that may do a
    better job than Microsoft''s utility. If you have a traditional mechanical hard
    drive, third-party utilities may offer you better performance. However, if you
    have a solid state disk, the built-in Microsoft utility is sufficient.


    All the utilities that offer advanced features, such as automatic background defragmentation
    and boot time system defrag, cost around $29 for home versions and $59 to $79
    for professional versions. The major difference between the home and professional
    versions are additional value-added features. I go into more detail about these
    with each following utility.


