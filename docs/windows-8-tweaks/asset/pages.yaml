    # Adjusting Your Application Priorities


    Since the introduction of the multitasking processor, operating systems have been
    able to run multiple programs at once using the new task switching and segmentation
    features provided by the CPU. These new technologies made it possible for operating
    systems such as Windows to be created. Even though PCs today are able to multitask,
    they still really can do only one thing at a time per CPU core. For the operating
    system to support running dozens of applications at once, it has to slice up all
    the available processing time and give each application a turn. Although this
    is starting to change for consumers with the introduction of multi-core processors,
    each core can still do only one thing at a time. Previously this was possible
    only on expensive multiprocessor configurations typically found in servers.


    Operating systems use a variety of techniques to determine which application gets
    the next available time slot to use the CPU. One of the factors that determines
    this for Windows 8 is the priority level at which the application is running.
    Every application that runs on your computer has a priority level attached to
    its runtime information. By default, the operating system starts each application'
  merge: -1
  img_proc: true
- pgno: 312
  md: 'at normal priority, which is right in the middle of the priority spectrum.
    You can run applications and assign six different priority levels, ranked from
    highest to lowest: Realtime, High, Above Normal, Normal, Below Normal, and Low.
    Because the CPU can do only one thing at a time, the different priority levels
    allow the operating system to decide which application gets the next CPU time
    slot. If an application is running at the High or Above Normal priority levels,
    it gets more CPU time than an application running at Normal level.


    As you can see, the priority you give an application can affect how fast the program
    runs.


    # # Using Task Manager to Adjust Priorities


    Windows Task Manager is something that everyone experiences when they have problems
    with a frozen program, and you learned that it is a very useful utility. In Task
    Manager you can change the priority at which an application is running. This capability
    can be very useful when you have a lot of programs running on your computer.


    > **CAUTION** Setting any application to *Realtime* can be dangerous because doing
    so allows the application to hog all the CPU time. Exiting a program that is running
    at this *high priority* is next to impossible if for some reason it crashes or
    is stuck in a loop. It takes a very long time to load Task Manager to end the
    application because the program is hogging all the CPU time.


    If you have an application that has a high need for CPU operations, such as rendering
    a video clip or a game, you can adjust the priority of the application by following
    these steps:


    +   1. Open the Start screen, type *taskmgr*, and press Enter.

    2. After Task Manager loads, click the Details tab. Be sure to click More Details
    to see the full Task Manager.

    3. Right-click the name of the process for which you would like to adjust the
    priority, select Set Priority, and then select the level, as shown in Figure 16-11.
    Your change is now complete.


    > **TIP** Having problems identifying which process belongs to an application?
    While on the Applications tab of Task Manager, right-click any application and
    select Go To Processes. All processes that belong to the application will be selected
    on the Processes tab.'
  merge: -1
  img_proc: true
- pgno: 313
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_313_0.png)


    **Figure 16-11:** Use Task Manager to adjust application priorities.


    > **TIP** If your computer has multiple processors or cores, or supports hyper-threading,
    you will notice an extra option called Set Affinity when you right-click a process.
    This option enables you to specify on which CPU core the application will run
    (or which virtual CPU, in the case of hyperthreading users).


    Using Task Manager to change the priority levels is great. However, there is one
    downside. When you close an application on which you have altered the priority
    level, the priority level it was running at will be lost. The next time you start
    the program, it will run at the default level. This downside can be a pain in
    the neck for some users; however, a cool trick to fix this problem is discussed
    in the next section.'
  merge: -1
  img_proc: true
- pgno: 314
  md: '# Starting Applications with a User Set Priority


    A wonderful command built into Windows enables you to start any program and specify
    its priority. This cool utility is called the Start command. Using the Start command
    with priority flags followed by the executable enables you to start any program
    at a priority level of your choice.


    For the sake of demonstrating how to use the command, assume that the Calculator
    is set at high CPU priority. Follow these steps to set the command:


    +   1. Open Notepad to type the command so that it can be turned into a batch
    script file.


    +   2. After Notepad opens, type **start /high calc.exe**.


    If you want to start the Calculator at a different priority, you can replace */high*
    with */low*, */normal*, */realtime*, */abovenormal*, and */belownormal*.


    +   3. After keying in the priority level, click the File menu bar item in Notepad
    and select Save As. Change the file Save As Type to All Files and type **launchcalc.cmd**
    in the Filename box.


    You can call the file anything you want, but make sure that it has the .cmd file
    extension so that Windows knows to execute the commands in the file.


    +   4. Specify a location on your hard drive to save it, such as your desktop,
    and click the Save button. You are now finished and can exit Notepad.


    Now that you have created the batch command file, you are ready to start your
    new shortcut.


    You can apply the same technique to any program on your computer. Instead of typing
    calc.exe at the end of the command, type the name of the executable of the program
    that you want to start.


    Additionally, you can use this command on nonexecutable files such as documents.
    For example, you can type **start/high mydocument.doc** to start Microsoft Word
    in the High priority level with your document opened.


    # Summary


    You have now finished optimizing the core components of Windows 8. First you learned
    how to add more memory to your computer and about the new ReadyBoost feature of
    Windows 8 that allows you to gain some of the benefits of adding RAM without even
    opening your case to speed up memory access. Then you learned how to adjust your
    paging file to speed up your hard drive access and adjust application priorities.


    Next, I show you a way to speed up your network connection. I start with browsing
    the network and your network card and work outward to speeding up your Internet
    connection.'
  merge: -1
  img_proc: true
