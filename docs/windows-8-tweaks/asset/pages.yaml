  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_44_0.png)


    **Figure 2-9:** Select where to install Windows 8.


    # Dual-Booting Windows


    With virtualization becoming more popular, the need to run multiple operating
    systems on a physical computer has significantly decreased. Application compatibility
    was the main reason in the past that users installed multiple operating systems.
    Your old Windows XP applications will not function in Windows 8? Just restart
    and boot into Windows XP. Virtual machine applications such as VMware Workstation,
    Sun VirtualBox, and Microsoft Hyper-V enable you to boot the second operating
    system on top of your main OS, eliminating the need and hassle of rebooting into
    another OS. This solves the compatibility problem for most apps, but a virtual
    machine is not always perfect.


    Gaming is one area where problems may arise for virtual machines because 3-D support
    has gotten a lot better, but it’s not yet at bare metal performance. If you are
    a gamer or just want a cool way to try out Windows 8 with bare metal performance,
    I show you how you can dual-boot Windows 7 and Windows 8 on the same PC with a
    geeky twist.


    You can achieve a dual-boot system with Windows 7 and Windows 8 in a number of
    ways, but the easiest and least destructive method is to have Windows 7 installed
    first. Then, using a little-known feature in Windows 7 called boot to VHD (virtual
    hard drive file), you can install Windows 8 in a VHD file, which'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'is very safe because you don''t need to alter your Windows 7 partition or install.
    When you are finished, the Windows 8 drive will be virtualized into a single file
    on your Windows 7 partition and will show up in the boot menu just as if it was
    installed on raw disk.


    # Creating the VHD File on Windows 7


    The first step to dual-booting Windows 8 and Windows 7 is to create the VHD file
    to hold the Windows 8 installation. Open up Disk Management on Windows 7 to create
    the file:


    +   1. Click the Start button in Windows 7, type in **diskmgmt.msc**, and hit
    Enter. The Disk Management utility should load.


    +   2. Click the **Action** menu and select **Create VHD**.


    +   3. Enter a location, such as `C:\VHD\Win8.vhd`. Set the size—I suggest 40
    GB—and select the Dynamically expanding format to save your disk space. Dynamic
    VHD files start out small and only grow with data written to the virtual disk.
    When your screen looks like Figure 2-10, click OK and the file is created.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_45_0.png)'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# # Installing Windows 8 to a VHD


    Proceed to install Windows 8 using the clean install process covered earlier,
    but stop at the screen that asks “Where do you want to install Windows?” as shown
    in Figure 2-9. You need to attach the VHD file to the installer so that it recognizes
    it as a valid location to install Windows 8.


    +   1.  Hit Shift + F10 on your keyboard to bring up a Command Prompt window.


    +   2.  Type **diskpart** and hit Enter.


    +   3.  Now it is time to select the VHD file you created earlier. You need to
    know the full path to the VHD file. Keep in mind that a properly installed Windows
    7 machine has two primary partitions: one hidden partition for the boot and recovery
    tools and a separate partition for the operating system. When Windows is running,
    it hides the hidden boot partition and gives the second OS partition the C drive
    letter. When the installer is running, the boot partition is not hidden, and therefore
    is given the C drive letter and the second OS partition is given the D drive letter.
    If the VHD file was created in `C:\VHD\Win8.vhd` while Windows 7 was running,
    you need to use `D:\VHD\Win8.vhd` as the full path to the VHD file while the installer
    is running. Run the following command with the adjusted path to the VHD file and
    then hit Enter:


    ```

    ```

    select vdisk file=d:\vhd\win8.vhd

    ```

    ```


    +   4.  Type **attach vdisk** and hit Enter.


    +   5.  Close the Command Prompt window and click the Refresh button on the Where
    Do You Want To Install Window? screen.


    +   6.  Select the new 40 GB VHD drive now listed as Drive 1 and click Next as
    shown in Figure 2-11. Ignore any warnings saying Windows can’t be installed on
    that drive. They are incorrect, as the installer is not aware of this advanced
    method of installing Windows 8.


    +   7.  Now just continue to install Windows 8 as usual. The next time your PC
    reboots, you see a new boot menu that enables you to select between Windows 7
    and Window 8, as shown in Figure 2-12.'
  merge: -1
  img_proc: true
