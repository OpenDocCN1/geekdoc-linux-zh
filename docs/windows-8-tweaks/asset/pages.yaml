- pgno: 112
  md: '# # Using Group Policy Editor to Customize the Start Screen and Taskbar


    The Group Policy Editor is a great component of Windows that enables you to make
    dozens of advanced setting changes that are hidden from normal users. The Group
    Policy Editor works by enabling you to define various rules, called the *policies*,
    which tell Windows how to behave.


    The collection of policies is known as Group Policy, of which there are two types:
    local and domain based. Local is when the policy resides in and is controlled
    on the local computer. A domain-based policy is a policy that resides on an Active
    Directory domain controller to which multiple computers are connected. Domain
    policy is primarily used only in businesses that need a way to control multiple
    computers from a central location. In this book, some tweaks use local Group Policy
    to configure the Start menu because most of you are customizing your home computers
    and do not have them connected to a Windows domain. The actual policies and way
    you set them are the same for both types of group policies, so you can apply these
    same techniques to a domain policy if desired.


    The policies are set and modified using the, you guessed it, Group Policy Editor.
    This is the tool that you will be using to set the policies to help you customize
    the Start menu. First, you learn how to use the policy editor, and then all the
    policies relevant to customizing the Start menu.


    # ## Setting Policies with the Group Policy Editor


    Using the Group Policy Editor is a lot like using the Registry Editor. It is based
    on a hierarchical structure of sections that all policies are organized within.
    All policies are divided into two sections: Computer Policies and User Policies.
    Computer Policies are settings that apply to components of Windows such as hardware
    and global feature settings. User Policies are settings that can vary between
    users on a computer. This is where most of the policies that you will use to customize
    the look of your interface are located.


    Now that you know the basics of the Group Policy Editor, dive in and start using
    the policy editor:


    +   1. Open the Start screen, enter `gpedit.msc` in the Search box, and press
    Enter.

    2. After the Group Policy Editor has loaded, you see the hierarchical structure
    and Computer and User policies sections mentioned previously.

    3. Navigate through User Configuration, Administrative Template, and then select
    Start Menu and Taskbar.

    4. You see a list of all policies that you can configure. Right-click a policy
    that you want to configure and select Edit.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '+   5. On the policy screen, select the option to turn on the policy or set
    the policy value, and then click OK, as shown in Figure 6-19.

    6. Exit the policy editor and log off and back on. Some policy changes may require
    a reboot.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_113_0.png)


    **Figure 6-19:** Configure a policy in the Group Policy Editor.


    Now that you know how to use the Group Policy Editor, the next section shows you
    all the policies and briefly describes what they do.


    # Changing Start Screen and Taskbar Policies


    A lot of policies listed under the Start Menu and Taskbar section are not relevant
    to Windows 8. Consider those junk that Microsoft forgot to remove because they
    will have no effect on Windows 8. Or maybe Microsoft wanted to make it easy to
    create policies for older versions of Windows. Table 6-1 shows a list of some
    useful group policies for Windows 8 that will help you customize the Start screen
    and the taskbar.'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'Table 6-1: Group Policy Settings to Configure the Start Screen and Taskbar


    | POLICY | DESCRIPTION |

    |---|---|

    | Lock the taskbar | Controls the locking state of the taskbar. A locked taskbar
    does not allow any changes to be made to it. |

    | Add "Run in Separate Memory Space" checkbox to Run dialog box | Adds an additional
    setting for running programs with the Run box. I recommend enabling this setting.
    |

    | Prevent changes to taskbar and Start menu settings | Locks taskbar and Start
    menu settings. |

    | Remove Clock from system notification area | Hides the clock. |

    | Prevent grouping of taskbar items | Disables application grouping on the taskbar.
    |

    | Do not display any custom toolbars in the taskbar | Disables third-party taskbars
    or user-made toolbars. |

    | Remove access to the context menus for the taskbar | Disables capacity to right-click
    the toolbars in the taskbar. |

    | Hide the notification area | Disables the entire notification area (system tray).
    |

    | Remove the Action Center icon | Hides the Action Center icon in the notification
    area. |

    | Remove the networking icon | Hides networking icon in the notification area.
    |

    | Remove the battery meter | Hides power icon in the notification area. |

    | Remove volume control icon | Hides volume icon in the notification area. |

    | Turn off feature advertisement balloon notifications | Disables pop-up help
    about features. |

    | Do not allow pinning items in Jump Lists | Disables adding items to Jump Lists.
    |

    | Do not allow pinning programs to the taskbar | Disables adding applications
    to the taskbar. |

    | Do not display or track items in Jump Lists from remote locations | Prevents
    recent documents from network shares from showing up in Jump Lists. |

    | Turn off automatic promotion of notification icons to taskbar | Disables temporarily
    adding new notification area icons to the notification area before moving to overflow
    container. |

    | Lock all taskbar settings | Locks the taskbar. |

    | Prevent users from adding or removing toolbars | Disables the ability to add
    toolbars. |


    *Continued*'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'Table 6-1 *(continued)*


    | POLICY | DESCRIPTION |

    | --- | --- |

    | Prevent users from rearranging toolbars | Locks in the position of your toolbars
    (similar to locking the taskbar). |

    | Turn off all balloon notifications | Disables pop-up help. |

    | Remove pinned programs from the taskbar | Disables and removes pinned applications
    on the taskbar. |

    | Prevent users from moving taskbar to another screen dock location | Locks the
    position of your taskbar. |

    | Prevent users from resizing the taskbar | Locks the size of your taskbar. |

    | Turn off taskbar thumbnails | Disables the application thumbnails that are shown
    when you move your cursor over taskbar items when running Aero Glass. |

    | Clear history of tile notifications on exit | Clears history of tile notifications.
    |

    | Prevent users from uninstalling applications from the Start | Stops users from
    uninstalling applications on the Start screen. |

    | Show "Run as different user" command on Start | Allows apps to be run as a different
    user by enabling button on right-click charms bar. |

    | Do not allow taskbars on more than one display | Disables multi-monitor taskbars.
    |


    As you can see, dozens of useful group policies can help you customize your desktop
    more than any other method. Additionally, these policies can be used in a domain
    policy that governs all Windows 8 computers connected to the domain.


    # ## Summary


    This chapter walked you through the process of customizing the Start screen and
    then moved on to the taskbar. You customized your Start screen for the way you
    work and got rid of the extra clutter. Then you were shown how you can customize
    and improve the way the taskbar works, followed by advanced tweaking via Group
    Policy.


    The next chapter concentrates on customizing the desktop. You find out how you
    can completely change the look of the interface and use other third-party applications
    to make the interface even better.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# CHAPTER 7

    # Personalizing the Desktop


    This chapter demonstrates cool tricks and tools to make your desktop look and
    work much better so that you can also benefit from a customized desktop. I show
    you how to remove icons, customize the size of icons, and replace icons on your
    desktop. Then I show you how you can customize your desktop way beyond changing
    your wallpaper. In the second half of this chapter, I show you how you can customize
    the desktop background and extend it with Rainmeter skins.


    # ## Customizing the Desktop Icons


    Building on the icon improvements in Windows Vista, Microsoft has continued to
    refine the high-quality icons in Windows 8. These new high-resolution icons include
    various sizes, all the way up to 256 x 256 pixels. This allows the icons to look
    great at many different sizes and really shows off the quality and time that was
    spent creating the hundreds of new icons.


    The next few sections show you how to take advantage of the new icons, as well
    as how to trim down icons to use in other areas where they are considered more
    clutter than eye candy.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# Removing All Icons from the Desktop


    No matter how hard I try, I always end up with a lot of junk on my desktop. There
    is never an end to the war I fight with my desktop to keep it clutter-free—this
    is evident from the programs I download, documents that I am too lazy to save
    elsewhere, and new program links that seem to pop up from nowhere. I like to see
    my desktop wallpaper and not have my view of the wallpaper blocked by useless
    icons. One cool way to win the never-ending desktop war is to disable the desktop’s
    ability to show the icons and instead pin the most common desktop icons—such as
    the Recycle Bin and other shortcuts—to the taskbar.


    Disabling the icons on the desktop is actually a very simple task. Most people
    never learn about this feature because it was placed where you would never expect
    it in previous versions of Windows. In Windows 8, just right-click your desktop,
    select View, and then select Show Desktop Icons. Almost instantly, the icons disappear.


    Don’t worry because the icons and folders on your desktop were not deleted. If
    you ever want to turn the icons back on, just repeat the preceding steps again.


    This is a very simple way to clean up the desktop quickly. It’s sort of like sweeping
    dirt under a rug. The desktop clutter is still there, but you can’t see it.


    # Customizing the Icon Drop Shadow Effect


    The drop shadow effect makes the icons stand out from your wallpaper and makes
    them much easier to read when you are using a background such as a photo that
    has both light and dark spots. Depending on the wallpaper that you are using,
    you may or may not like the feature. I really like the new effect, but if you
    are using a bright wallpaper, I recommend disabling it. Perform the following
    steps to turn the feature on or off:


    +   1.  Open the Start screen, type sysdm.cpl, and then press Enter to launch
    the System Properties window.

    2.  Click the Advanced tab, and then click the Settings button under the Performance
    section.

    3.  While on the Visual Effects tab, scroll to the bottom of the box.

    4.  Locate the Use Drop Shadows For Icon Labels On The Desktop option shown in
    Figure 7-1, and check or uncheck the value, depending on what you would like to
    do.

    5.  Click OK to save your changes.

    6.  Click OK again to close the System Properties window.

    7.  You may need to reboot your computer to view the change.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_118_0.png)


    Figure 7-1: Turn the Drop Shadow effect on or off for icons on the desktop.


    # Displaying Windows System and User Icons on the Desktop


    In Windows 8, only one icon, the Recycle Bin, is on the desktop by default. Microsoft
    is trying to keep the number of icons on the desktop to a minimum for a cleaner
    look. Nevertheless, if you like having the system and user icons on the desktop,
    such as Computer, Documents, Network, and others for convenience, it is possible
    to add those icons back to the desktop. Just follow these steps:'
  merge: -1
