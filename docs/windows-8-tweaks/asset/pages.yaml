    4. Click OK when you are finished.


    You will see the icons on your desktop immediately after you complete the steps.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_119_0.png)


    # Adjusting the Size of Desktop Icons


    Windows 8 use a new desktop icon size that is slightly larger than in previous
    versions of Windows. This is one of the things that I disliked immediately after
    installing Windows 7 or Windows 8 on my computer. Why are the icons so'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'large now? Well, everything seems to be bigger in Windows 8, but thankfully,
    as with other new features, it is very easy to adjust the size of the desktop
    icons. You have a choice between three different standard icon sizes on the desktop.
    Figure 7-3 shows the three icon sizes: small (classic), medium, and large.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_120_0.png)


    You can change the icon size by simply right-clicking the desktop, clicking View,
    and then clicking the icon size you prefer.


    If you are a power user, there is a secret way to shrink or enlarge the icons
    with a much wider range of sizes, but you must have an external mouse with a scroll
    wheel. Just hold down the Ctrl key on your keyboard and scroll up or down while
    on the desktop. You can create ridiculously large icons with this method, as shown
    in Figure 7-4.'
  merge: -1
