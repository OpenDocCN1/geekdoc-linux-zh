- pgno: 52
  md: '# CHAPTER


    3


    # Windows 8 Basics


    For the first time since Windows 95, Microsoft has taken bold steps in overhauling
    the interface of Windows by creating the new “Metro” design style interface. Best
    described as a full-screen, immersive environment, the new interface is home to
    the Windows Store apps and the new tile-based Start screen. This chapter covers
    the new elements of the interface and helps you get up to speed quickly so you
    can fly through the new interface as fast as you could using the classic desktop
    interface.


    # Using the New Interface


    The new interface can be very confusing and annoying for people who have been
    using Windows for years. Getting used to a new interface is not easy—dealing with
    change never is. But once you get used to it, you will find that some tasks are
    much easier than before.


    Many people claim the new interface is designed just for touch users with tablets.
    Though it is true that the interface works great on touch devices, it is wrong
    to say it is only for tablets and not for traditional PC users with desktops and
    laptops. Everything that touch users can do is also possible with a keyboard and
    a mouse. The next few sections cover how you can use the new interface with the
    good, old-fashioned keyboard and mouse.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# # Using the Start Screen


    When you first boot up Windows 8, you see the new Start screen instead of the
    classic desktop. Replacing the Start menu, the Start screen is where everything
    begins. Instead of a list of app names and static icons, Microsoft opted for a
    new tile-based layout called *Live Tiles*.


    Live Tiles are like dynamic icons that provide access to live information such
    as weather conditions, sports scores, or even alerts. Unfortunately, due to the
    live nature of the tiles they are limited to only those apps you download from
    the Windows Store. Classic desktop apps get a tile with a boring static icon.


    # ## Navigating the Start Screen


    Navigating the Start screen is best accomplished with a scroll wheel mouse if
    you don''t have a touch device. Simply scroll the wheel to slide to the right.
    You can also use arrow keys, but that is often slow. When you find what you want,
    just click it.


    If you know what you want, the classic Start menu search still exists. Just type
    in the name and hit Enter. You can also run commands just like in Windows Vista
    and Windows 7. Type in **CMD** and hit Enter to open up a command prompt, as shown
    in Figure 3-1.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_53_0.png)'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'Depending on what you are searching for you may need to change the search scope.
    Unlike in Windows 7 and Vista, in Windows 8 Microsoft separated the application
    search from the settings or control panel search. If you are looking for a Windows
    setting, such as display settings, you need to click the Settings option on the
    right side of the screen, as shown in Figure 3-2, after you type in what you want.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_54_0.png)


    # **Start Screen Views**


    In addition to the default, two other Start screen views are available, but they
    require some work to display. The first is a list of all applications installed
    on your PC. This view is similar to clicking All Programs in previous versions
    of Windows, but provides a full-screen display, as shown in Figure 3-3.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_55_0.png)


    **Figure 3-3:** This Start screen view displays apps like the All Programs menu
    item did in previous versions of Windows.


    You can bring up the application list view by hitting the following keyboard combination:
    Windows Key+Q.


    The next view I call “group view” because it enables you to see all the tile groups
    on your Start screen. This is perfect for selecting apps quickly instead of scrolling
    when you have a lot of tiles on your screen (see Figure 3-4). To activate this
    view, bring up the Start screen and then hold down the Ctrl key and hit the minus
    key (-). Alternatively, you can hold down the Ctrl key and scroll down with your
    mouse wheel or click the tiny minus button in the bottom right corner of the screen.


    To get the most out of this view you need to organize your Start screen tiles
    into named groups. I cover that and much more in Chapter 5, which is all about
    customizing the Start screen.


    # ## Using Charms


    Charms are another major part of the new interface and a big part of Windows 8.
    I like to think of charms as the right-click menu for the full-screen app world.
    Traditional right-click context menus do not fit well in the world of full-screen,
    immersive applications. Charms offer a new method of presenting the user with
    relevant options that are hidden until needed.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_56_0.png)


    Docked in bars that appear on all sides of the screen, the most commonly used
    charms are the system charms, as shown in Figure 3-5. The system charms are universal
    to any application you have open and even exist on the classic desktop. If you
    have a touch device, just slide your finger inward from the right side of the
    screen. Desktop and laptop users must put the mouse cursor in the top-right corner
    of their screen and then move down as the charms show up. Alternatively, you can
    hit Windows Key+C to bring up the system charms.


    The system charms bar enables you to open the Start screen, search everything
    or just the app you currently have open, and open the Settings panel, where you
    can shut down your PC. Why Microsoft buried the ability to turn off and reboot
    your computer in the settings charm is beyond me, but at least now you know how
    to turn your PC off properly.


    Within Windows Store apps or on the Start screen are additional charms in application
    bars on the top and bottom of the screen. Drag your finger from the top of the
    screen down or from the bottom of the screen up, or if you have a mouse just right-click.
    These are the new application-specific context menus that are docked to edges
    of the screen. They enable you to perform tasks, such as opening a new tab in
    Internet Explorer, or access tile settings for a selected tile on the Start screen
    as shown in Figure 3-6.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_57_0.png)


    **Figure 3-5:** System charms display information when you need it.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_57_1.png)


    **Figure 3-6:** The Start screen has Tile Settings charms.'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'The last type of charm is located on the left side of the screen and helps
    you switch between apps. Think of this as the taskbar of the new interface. Drag
    your finger inward from the left side of the screen or place your mouse cursor
    on the top-left corner of your screen and then move the cursor down. Alternatively,
    on a keyboard you can hit Windows Key+Tab. This charm provides a thumbnail view
    of all your open Metro style applications and a screenshot of your desktop.


    # ## Using Keyboard Shortcuts in Windows Store Apps and the Start Screen


    I already covered a few of the keyboard shortcuts that help you fly around the
    new interface if you don''t have a touch device, but you can use a lot more. The
    keyboard shortcuts in Table 3-1 will save you a few clicks and get to items that
    are ordinarily buried within the interface.


    **Table 3-1: Windows Store Apps and Start Screen Keyboard Shortcuts**


    | KEY COMBINATION | FUNCTION |

    | :--- | :--- |

    | Windows Key | Opens the Start screen |

    | Windows Key+Tab | Metro app switcher |

    | Windows Key+C | System charms |

    | Windows Key+Z | Application charms |

    | Windows Key+I | Settings menu |

    | Windows Key+K | Devices menu |

    | Windows Key+H | Share menu |

    | Windows Key+F | Search files on Start screen |

    | Windows Key+Q | Application search on Start screen |

    | Windows Key+W | Settings search on Start screen |

    | Windows Key+. (period) | Snap Metro app to the right side of the screen |

    | Windows Key+Shift+. (period) | Snap Metro app to the left side of the screen
    (only works on wide-screen monitors) |'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# ## Using the Classic Desktop


    Although the new Metro interface gets most of the attention when talking about
    Windows 8, the classic desktop also received some minor refinements. Almost all
    of the changes are cosmetic because the underlying system components are almost
    identical to Windows 7, just optimized.


    # ### What''s New?


    The new desktop features are centered on Windows taskbar and the File Explorer
    interface. Users will instantly recognize the familiar ribbon interface from Microsoft
    Office that has been integrated within File Explorer. Love it or hate it, many
    new options are just a click away. The file copy/move dialog box also got a big
    update with a pretty graph and the ability to pause file transfers, which can
    be very helpful, as shown in Figure 3-7.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_59_0.png)


    **Figure 3-7:** The new Windows Copy dialog box offers a pause option.'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'The Windows taskbar finally received multi-monitor support, which allows users
    to extend it to all monitors. Users can also customize the behavior of application
    icons so that open windows on a single monitor show up on all monitor taskbars
    or just on the taskbar the window is actually on.


    Under the covers, Windows continued the Vista diet. According to Microsoft, Windows
    8 uses less RAM than Windows 7 and has fewer processes running in the background.
    I have actually used Windows 8 on a machine with just 2 GB of RAM and performance
    was acceptable.


    # Using Desktop Keyboard Shortcuts


    Navigating the classic desktop in Windows 8 has not changed significantly other
    than how you get to it. The keyboard shortcuts in Table 3-2 are not all brand
    new, but they will help you quickly navigate the interface like a true power user.


    Table 3-2: Classic Desktop Keyboard Shortcuts

    | KEY COMBINATION | FUNCTION |

    | :--- | :--- |

    | Windows Key+D | Show desktop |

    | Windows Key+Comma | Peek at desktop |

    | Windows Key+M | Minimize window |

    | Windows Key+Up Arrow | Maximize window |

    | Windows Key+Right Arrow | Snap window right |

    | Windows Key+Left Arrow | Snap window left |

    | Windows Key+X | Admin tools menu |

    | Windows Key+Pause/Break | System Information |

    | Ctrl+Shift+Escape | Task Manager |

    | Windows Key+Enter | Windows Narrator |

    | Windows Key+L | Lock PC |

    | Windows Key+P | Projector options |

    | Windows Key+Print Screen | Saves screenshot to pictures |

    | Windows Key+Space | Switch language packs |

    | Windows Key+R | Run dialog |

    | Windows Key+E | File Explorer |

    | Windows Key+Number | Launch pinned taskbar app |

    | Windows Key+Plus | Screen zoom in |

    | Windows Key+Minus | Screen zoom out |'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# Summary


    This chapter covered the basics of what is new in Windows 8 and how to use it
    like a power user. The new interface takes some time to get used to, and in the
    chapters to come I cover customizing it if you are a fan. If not, I show you how
    to avoid it as much as possible.


    In the next chapter I cover how to safely tweak your computer. Starting very soon
    you will be modifying the system, which always involves the risk of something
    going wrong, so it is important to know how to make changes safely.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# **CHAPTER 4**


    # **Safe Tweaking**


    If your computer came with Windows 8 preinstalled, or you have finished installing
    Windows 8, you are almost ready to begin tweaking. But first, this chapter talks
    about the safe way to tweak and customize your computer. Many tweaks, tips, and
    secrets can create severe problems if you accidentally miss a step. That is why
    this is a good time to discuss some of the ways you should protect your computer,
    so you can easily undo any tweak that causes problems.


    To get started, you create Restore Points that enable you to take a configuration
    snapshot so you can easily jump back to a prior state. Then this chapter covers
    Windows Backup to protect your data, and Startup Repair to automatically fix issues
    that may prevent Windows 8 from starting up. Additionally, I cover the new one-click
    refresh and reset features that automatically restore Windows to a working state.


    # ## **Using System Restore**


    System Restore has matured into something very valuable for any power user who
    tweaks his computer. Every time you make a change, there is a risk that something
    could go wrong. Wouldn''t it be nice if you could easily undo any change with
    just a few clicks? System Restore provides the solution to that problem by enabling
    you to jump back in time to an earlier state.


    In the next sections I show you how to create Restore Points before you tweak
    and then how to restore to a previous state if something goes wrong.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# # Creating Restore Points


    You can create Restore Points in Windows in a number of ways. Every time you install
    new software, Windows automatically creates a new Restore Point. You can also
    manually create Restore Points in Windows. This chapter starts with the normal
    way and then shows you how to create a desktop shortcut that enables you to jump
    directly to the Create Restore Point screen. To get started, do the following:


    +   1. Open the Start screen, type **Create a Restore Point**, switch to Settings
    filter, and then hit Enter.


    The System Properties System Protection tab, shown in Figure 4-1, opens. This
    enables you to view your System Restore settings and create Restore Points.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_63_0.png)


    **Figure 4-1**: Access your System Restore settings.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '+   2. Click the Create button near the bottom of the window.


    +   3. On the next screen, type in a name for your Restore Point and click Create.


    After you click the Create button, the Restore Point immediately begins taking
    a snapshot of your system. A progress screen displays and notifies you when the
    snapshot is complete. In my experience it takes only a few minutes at most to
    create a Restore Point. Sometimes it takes less than a minute.


    Next, I show you how to use the Restore Point to revert to an earlier point.


    # Reverting to a Previous State


    The second half of using System Restore is using the Restore functionality to
    return your computer to a previous state.


    Before proceeding, it is important to understand that System Restore doesn''t
    delete any of your personal documents such as photos, music, and Microsoft Word
    documents when you revert to a previous state. However, all system changes made
    between points, such as installing new drivers and new software, are wiped out.
    It is advisable to close all open applications before restoring your computer.


    Now that you know what to watch out for, follow these steps to restore your computer
    to a previous Restore Point:


    +   1. Open the Start screen, type in rstrui.exe, and hit Enter.


    +   2. After the System Restore utility has loaded, click Next on the first screen.


    +   3. You will now see a list with the date, time, and a description of each
    Restore Point. There is also a Show More Restore Points checkbox on the screen
    that I advise checking, so you can see all available System Restore Points.


    +   4. Find the Restore Point that you want to revert to, select it, and click
    Next.


    +   5. Check the confirmation page, and then click Finish.


    +   6. Click Yes on the final confirmation screen.


    Your computer will now log you off and start the System Restore process. When
    it finishes, your computer restarts.


    One of the best parts of System Restore is that you can always undo the recent
    restore if restoring your computer did not solve your problem or created new problems.
    You can undo the recent restore by starting up System Restore again. After you
    complete any restore, the Undo option is displayed on the opening screen of the
    System Restore utility.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# # System Recovery Console


    The System Recovery Console in Windows 8 is a great feature that enables you to
    fix your computer if it ever gets stuck in a state in which it will not boot properly.
    A number of tools are included, such as Automatic Repair, System Restore, Refresh
    Your PC, System Image Recovery, and Memory Diagnostics, along with a way for you
    to access the command prompt. I go into more detail about the tools available
    in the System Recovery Console shortly, but first, you learn how to access the
    console.


    # ## Accessing the System Recovery Console


    You can access the System Recovery Console in two ways. The most popular is to
    boot the hidden recovery partition that was set up when Windows 8 was installed
    on your computer. To do this, press F8 on your keyboard right after you turn on
    your computer while the manufacturer logo is displayed, known as the POST or power
    on self-test. If you hit F8 at the right time, a special boot menu is displayed
    with the option to repair your computer. On my computer, I start hitting F8 repeatedly
    as soon as POST is finished, to make sure I catch the short window in which the
    F8 key works before the computer loads Windows normally.


    After you select the Repair Your Computer option, a progress bar displays as the
    System Recovery Console is loaded. When the loading completes, you see the System
    Recovery Console main screen, as shown in Figure 4-2.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_65_0.png)


    **Figure 4-2:** From the Windows 8 System Recovery Console you can fix a lot of
    problems.'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'This method works on the majority of Windows 8 installations, but it is dependent
    on the special hidden partition. If something happens to that partition, or Windows
    8 installed without creating that partition, you need to access the System Recovery
    Console with the System Recovery Console Boot CD or flash drive.


    If you have a Windows 8 installation DVD, you can boot your computer with that
    and then select Repair My Computer. However, if your computer came with Windows
    8 preloaded, or if you lost your installation DVD, you can create your own System
    Recovery Console Boot CD/DVD within Windows 8.


    On a Windows 8 computer with a CD/DVD burner, follow these steps to create a System
    Recovery Console CD/DVD:


    +   1. Put a blank CDR/CDRW/DVDR/DVDRW disc in your CD/DVD burner drive.

    2. Open the Start screen, type in recdisc.exe, and then hit Enter.

    3. Make sure the correct drive is selected and then click Create Disc.


    Alternatively, if your computer does not have a CD/DVD drive you can use a USB
    flash drive that is 256 MB or larger. Follow these steps to create a System Recovery
    USB drive on a Windows 8 computer:


    +   1. Insert a USB flash drive.

    2. Open the Start screen, type in recoverydrive.exe, and then hit Enter.

    3. On the Recovery Drive window, click Next.

    4. Select the USB flash drive and click Next.

    5. Click Create to verify that everything will be erased on the USB flash drive.


    Now you can use your custom-made System Recovery Console CD/DVD/flash drive to
    access the same screen shown in Figure 4-2. Put the media in when you turn on
    your computer and use the correct boot menu options for your computer to boot
    to the disc or USB drive.


    # ### Using the System Recovery Console Tools


    Now that you know how to access the System Recovery Console, I go over the various
    tools available to fix your computer:


    +   * **Refresh Your PC**—This refreshes the Windows 8 install but leaves your
    settings and files in place. Windows Store apps remain, but traditional desktop
    apps are removed.

    * **Reset Your PC**—Everything including your personal settings and files are
    reset to brand-new condition. This action is similar to reinstalling Windows 8
    and blowing everything away.


    More tools are hidden under the Advanced Options section:'
  merge: -1
  img_proc: true
- pgno: 67
  md: '+   - **System Restore**—This tool provides another way to restore to a previous
    Restore Point. If a tweak caused serious Windows problems, you can revert to an
    earlier Restore Point even if Windows will not load.

    - **System Image Recovery**—Here you can apply a backup image to your computer
    to restore everything, including personal documents and files, from a system image.
    I show you how to create a system image in the next section.

    - **Automatic Repair**—Windows attempts to find problems that prevent Windows
    8 from loading. Similar to Startup Repair in previous versions of Windows.

    - **Command Prompt**—This is the ultimate tool in any power user''s toolbox.


    As you can see, the System Recovery Console offers a wide array of valuable tools
    that can help you fix Windows in the event it doesn''t start up. Next, I show
    you how to create a full system backup image.


    # ## Creating a Backup Image


    Every computer user should create regular backup copies of the important data
    on their computer. Power users, including you, should create backup images of
    your computer so you can easily restore your entire computer to a perfect state
    from an image. Creating an image of your computer enables you to restore all your
    programs, personal data, and Windows settings without reinstalling Windows manually,
    reinstalling every application, and then copying your personal data back over.


    When something bad happens, such as a hard drive failure or Windows being broken
    beyond repair, it is better to restore your computer from an image. That is why
    I suggest you follow the next section to create a backup image of your computer
    at least once a year.


    # ## Creating the Image


    Windows 8 includes tools that will help create an image of your entire hard drive
    and save it to a network share or on another hard drive. I have a Windows Home
    Server in my home so I save backup images to that. If you don''t have a network
    server available, you can always use an external USB hard drive to store your
    backup. To get started, you will need an administrative-level command prompt:


    +   1. Open the Start screen and type **command prompt**.

    2. Right-click the Command Prompt icon and then select *Run As Administrator*,
    as shown in Figure 4-3.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_68_0.png)


    +   3. When the command prompt loads, run the following command to create a backup
    of your entire Windows 8 install:


    `wbadmin start backup -allCritical -backupTarget:d:`


    Replace d: with the drive letter where you want your backup to be stored. It can
    be the drive letter of any drive in your PC or connected via USB, but cannot be
    the drive that you are backing up.


    You can also replace d: with a UNC network path. For example:

    `wbadmin start backup -allCritical -backupTarget:\servername\sharename`. 4. If
    the command was entered properly, you receive a confirmation screen asking you
    if you want to start the backup operation, as shown in Figure 4-4. Type Y and
    your backup will begin.


    When finished, store your backup data in a safe place.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_69_0.png)


    **Figure 4-4:** Create a system image.


    # # Restoring a System Image


    In the event you ever need to restore your backup system image, you need to boot
    up into the System Recovery Console I covered earlier in this chapter. You can
    do that by pressing the F8 key right after the POST and after you turn on your
    computer, and selecting Repair My Computer. Alternatively, you can use the custom-made
    System Recovery Console Boot CD/DVD/USB that I showed you how to make.


    After you load the System Recovery Console, follow these steps:


    +   1. Attach the external hard drive on which you stored the backup image.

    2. Boot to the recovery media.

    3. Select your keyboard layout if asked.

    4. Click Troubleshoot.

    5. Click Advanced Options.

    6. Select System Image Recovery. The Re-image Your Computer utility loads and
    searches for your backup files.

    7. Pick the Select A System Image option and click Next. All backup locations
    discovered display, so you can connect to a network location as well.

    8. Select a backup location to restore from and click Next. Alternatively, if
    you want to restore from a backup on a network location, click Advanced and then
    Search For A System Image on the network. Connect to your'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'network and enter the full UNC path to the backup files. Once your files are
    found, your backup location shows up on the list just like files on an attached
    hard drive.


    +   9. Choose the specific system image from all available images on the backup
    target and click Next.


    +   10. On the Restore Options screen do not check the box that says Format And
    Repartition Disks. I have not had any success restoring backups with that option
    set. Simply click Next to move to the next screen.


    +   11. Click Finish and then Yes on the confirmation screen.


    At this point the restore begins. It can take a few hours depending how big your
    backup data is. When it is finished, your PC reboots and is ready for use.


    # ## Using One-Click Recovery


    New to Windows 8 are two new recovery features that make it very easy for anyone,
    even those without computer knowledge, to start over with a clean slate and restore
    their computer to brand-new, clean install condition. These features are called
    Refresh Your PC and Reset Your PC. Both operate very similarly but have very different
    results.


    Using Reset Your PC is similar to a clean install of Windows 8. All of your applications,
    settings, and files are removed and everything is changed back to the default
    settings. The difference is that with Reset Your PC, you can just click a few
    buttons and everything is fully automated.


    Refresh Your PC is similar to Reset Your PC but it preserves your Windows Store
    apps from the Windows Store, settings, and personal files. However, traditional
    Windows desktop apps are removed.


    # ## Using Refresh Your PC


    Refresh Your PC is the less destructive of the two new recovery features because
    it refreshes your system files and trashes only your traditional desktop applications.


    +   1. Open the Start screen, type **Refresh your PC**, and change the search
    filter to Settings.


    +   2. Select the Refresh Your PC option.


    +   3. Click Next on the Refresh Your PC screen, as shown in Figure 4-5.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_71_0.png)


    **Figure 4-5:** Choose Refresh Your PC to refresh your system files.


    +   4.  You may be asked to provide the Windows install DVD or recovery media
    provided by your manufacturer. When you insert the media, it is automatically
    detected and moves you to the next step if it is the correct media.

    5.  Click **Refresh** on the confirmation screen, and the refresh begins.


    Your computer restarts a few times and then displays your logon screen when the
    refresh is completed. After you log in, all of your Windows Store apps are reinstalled
    automatically. A file called **Removed Apps.html** is placed on your desktop,
    listing all of the traditional desktop apps that were removed.


    # ## Using Reset Your PC


    Reset Your PC is the more destructive of the two new recovery features because
    it blows away all of your personal files, apps, and settings. Using Reset Your
    PC is equivalent to a clean DVD install that restores everything on your PC to
    default factory condition.


    +   1.  Open the Start screen, type **Remove Everything**, and change the search
    filter to Settings.

    2.  Select the **Remove Everything And Reinstall Windows** option.

    3.  Click **Next** on the **Reset Your PC** screen, as shown in Figure 4-6.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_72_0.png)


    **Figure 4-6:** Resetting your PC lets you start with a fresh install as though
    the PC just came from the factory.


    +   4.  You may be asked to provide the Windows install DVD or recovery media
    provided by your manufacturer. When you insert the media, it is automatically
    detected and moves you to the next step if it is the correct media.

    5.  On the **Do You Want To Fully Clean Your Drive** screen, select **Just Remove
    My Files**. The Fully Clean The Drive option is only for situations when you want
    to securely wipe your data off the PC. That is helpful if you want to sell your
    PC and ensure all your private data is removed securely. Securely erasing files
    is much more time-consuming than just replacing files, so the first option is
    sufficient for resolving issues.

    6.  Click **Reset** on the confirmation screen.


    Your computer restarts a few times and then presents you with the Windows 8 license
    terms when the reset is completed. You need to set up your user accounts, settings,
    and apps again just like the first time you started using Windows 8.'
  merge: -1
  img_proc: true
