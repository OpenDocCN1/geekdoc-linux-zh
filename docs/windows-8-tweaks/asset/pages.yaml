- pgno: 344
  md: '# Hiding Usernames on the Logon Screen


    If you use your computer in a high-security environment, it is very important
    to hide your username from the logon screen so that potential intruders are not
    able to figure out your username—before they even try to break your password.
    Using the Local Security Policy to your advantage, you can configure a setting
    that will automatically clear the username of the last person who logged in. This
    adds another layer of protection to your account by putting it in stealth mode.
    Follow these instructions to turn on this setting:


    +   1. Open the Start screen, type **secpol.msc**, and hit Enter.

    2. After the Local Security Policy editor has loaded, expand Local Policies and
    click Security Options.

    3. Scroll through the list and right-click Interactive Logon: Do Not Display Last
    User Name, and then click Properties.

    4. Select the Enabled box, as shown in Figure 18-9, and click OK.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_344_0.png)


    **Figure 18-9:** Hide your username with the Local Security Policy editor.


    +   5. Close the Local Security Policy editor and you are finished.


    The next time you reboot, your username will be hidden.'
  merge: -1
  img_proc: true
- pgno: 345
  md: '# Setting the Account Lockout Policy


    To complement the new complex password that your accounts now have, I recommend
    configuring the Account Lockout Policy to add even more security to your accounts.
    The Account Lockout Policy enables you to protect your account from an intruder
    trying dozens or even thousands of possible password combinations while attempting
    to guess your password. When configured, after the intruder has entered the wrong
    password a set number of times, the account will then be locked for a set amount
    of time. After that time interval has passed, the account is unlocked and the
    whole process is reset.


    This provides valuable additional security for your accounts that will eliminate
    the effectiveness of certain brute force tools that will try every possible combination
    to hack into your account. By using the Account Lockout Policy, you can increase
    the amount of time a malicious user has to wait to try every possible combination
    to something infeasible.


    Setting the Account Lockout Policy is very similar to configuring your computer
    not to show the last username that was used to log in with. Follow these steps
    to configure the lockout policy for your computer:


    +   1. Open the Start screen, type **secpol.msc**, and hit Enter.


    +   2. After the Local Security Policy editor loads, expand Account Policies and
    then click Account Lockout Policy.


    +   3. Right-click Account Lockout Threshold and click Properties.


    +   4. Increase the number of invalid logon attempts from 0 to a higher value
    to enable the feature.


    I like to use 5 as my number of invalid logon attempts before my account is locked
    out.


    +   5. Click OK to save the setting. A Suggested Value Settings window pops up
    that automatically populates the two other settings: Account Lockout Duration
    and Reset Account Lockout Counter After. Click OK here as well to use the default
    values.


    +   6. If the 30-minute duration of the account lockout is too long for you, just
    right-click each setting, select Properties, and modify the value.


    I typically use 10 minutes for both of these settings because I think it is a
    nice balance between added security and inconvenience when I may be using my computer
    half asleep and type in the wrong password more than five times.


    Your Account Lockout Policy is now set up and will begin protecting your computer
    immediately.'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# ## Tweaking User Account Control


    User Account Control (UAC) made its debut in Windows Vista and has been annoying
    and protecting users ever since. According to Microsoft, User Account Control
    decreased malware infection rates significantly in Windows Vista compared to Windows
    XP. On paper, UAC has been a great success, but in practice it annoyed users a
    little too much. In Windows 7, UAC was fine-tuned to minimize interruptions and
    is significantly less annoying. That work con-tinued with Windows 8.


    For the majority of you who skipped Windows Vista and some of you who even skipped
    Windows 7, User Account Control provides total control over all changes to your
    system. If you try to install a program, install a plug-in, or access any application
    that has the capability to change critical system settings, UAC goes into action
    and makes sure that you really want to do what an application is trying to do
    on your computer. In terms of the security of your computer, UAC is great because
    it catches when applications, scripts, and even websites try to do things to your
    computer that cause a critical change. However, if you initiate the change, such
    as trying to install a program or modify a Windows setting, you also have to deal
    with the pop-ups because of the way UAC is designed.


    User Account Control works by monitoring the Windows application pro-gramming
    interface (API), system components, and application configuration files, to find
    out whether an action needs higher privileges. If an action is found, it prompts
    a UAC box for your authorization.


    # ### Controlling User Account Control


    The User Account Control in Windows 8 plays a big role in the overall secu-rity
    of the operating system. No longer do you have to worry about software secretly
    getting installed or scripts running that change critical system data without
    your knowledge. Instead, you have to worry about getting bombarded with UAC pop-ups
    that require you to authorize almost every change this book asks you to do. Thankfully,
    Microsoft did not implement this feature without adding the ability for power
    users to tweak it to make their lives easier while still benefiting from some
    of the protections of UAC.


    # #### User Account Control Levels


    In Windows 8, Microsoft included a User Account Control Settings feature that
    enables you to modify the level of protection UAC provides. For the first time
    you can choose between four different levels of UAC protection, as shown here:


    +   - Always Notify When Programs Or A User Attempts To Make Changes To The Computer.'
  merge: -1
  img_proc: true
- pgno: 347
  md: "+   ■ (Default) Notify Only When Programs Attempt To Make Changes To The Computer.\
    \  \n■ Notify Only When Programs Attempt To Make Changes To The Computer And Do\
    \ Not Use Secure Desktop.  \n■ Never Notify.\n\nThe new feature enables you to\
    \ define the balance between security and annoyance that is right for you. You\
    \ can modify the setting with just a few clicks:\n\n+   1. Open the Start screen,\
    \ type **User Account Control Settings**, change the filter to Settings, and hit\
    \ Enter.  \n2. When the Settings screen displays, drag the slider to the settings\
    \ you want to use, as shown in Figure 18-10.\n\n![](img/ea75090cfee8ac890f64c8c4f62f7285_347_0.png)\n\
    \n+   3. Click OK to save your settings.\n\n# *Fine-Tune User Account Control\
    \ with Local Security Policy*\n\nAlthough I prefer using the User Account Control\
    \ Settings window to tweak UAC, you can also configure it through your Local Security\
    \ Policy. There, you can tweak 10 different settings for the UAC, as described\
    \ in Table 18-1."
  merge: -1
