- pgno: 316
  md: '# CHAPTER

    17

    Optimizing Your Network


    Your browser and network subsystem play a major role in the use of your computer.
    People are spending more and more time using their web browsers and the Internet,
    making the web browser the most-used application on many users'' computers. Now
    that you have optimized almost every major component of the operating system,
    this chapter covers the most-used application and components on which it is dependent—the
    web browser and the network that connects you to the Internet.


    First, I show you how to optimize Internet Explorer, Chrome, and Firefox by tweaking
    the number of active downloads. Then I show you some great utilities that will
    increase the speed of downloads, and tweaks that will speed up your network.


    # Optimizing Your Web Browser


    As I mentioned, the web browser has become the most-used application on most computers.
    Considering that you have already optimized, tweaked, and hacked almost every
    other component of the operating system for speed, it''s important to cover the
    most-used application as well. Using the following tweaks, you can make your web
    browser work faster than ever before. How is this possible? Web browsers originally
    followed the HTTP/1.1 RFC standards that stated web browsers can make only two
    connections per server at the same time. Over'
  merge: -1
  img_proc: true
- pgno: 317
  md: 'time, all the browser developers started cheating and increased the connection
    limit because they realized how big of an impact that had on performance. The
    following tweaks show you how to improve the performance of your browser by increasing
    the connection limit further and also using other enhancements.


    # ## Speeding Up Internet Explorer


    Internet Explorer cheats a little more in IE10 by bumping the concurrent connection
    limit to eight for both HTTP 1.1 and HTTP 1.0 connections. If you visit a web
    page with a lot of images and required files, such as CSS styles and JavaScript,
    you can easily end up with a scenario in which your web browser has to make more
    than 40 requests to the web server to download all the files and then assemble
    the web page. Requesting only 8 of these 40 files at a time is going to be a lot
    slower than downloading, say, 15 of them at a time.


    By tweaking hidden registry values, you can direct Internet Explorer to break
    Internet standards and download more than just two files at a time. Modifying
    this setting is simple to do, but be careful; the standards police will be after
    you. Follow these steps to speed up IE:


    +   1. Open the Start screen, type **regedit**, and press Enter.

    2. After Registry Editor loads, navigate through **HKEY\\_CURRENT\\_USER\\Software\\
    Microsoft\\Windows\\CurrentVersion\\Internet Settings**.

    3. Right-click in open space and create a new **DWORD (32-bit) Value**, as shown
    in Figure 17-1.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_317_0.png)


    **Figure 17-1**: Create a new registry DWORD value to speed up your browser.'
  merge: -1
  img_proc: true
- pgno: 318
  md: '+   4. Type MaxConnectionsPerServer as the name of the new DWORD value.


    +   5. Right-click this value and select Modify.


    +   6. Set the base to Decimal and enter a value greater than 6, as shown in Figure
    17-2.


    I like to use 15 as my value here. Click OK when you are done.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_318_0.png)


    **Figure 17-2**: Set a value for MaxConnectionsPerServer.


    +   7. Create a new DWORD value and type MaxConnectionsPer1_0Server as the name.


    +   8. Right-click this value and click Modify.


    +   9. Set the base to Decimal and enter in the new value. Use the same value
    you used in step 6. Click OK when you are finished.


    +   10. Exit Registry Editor and reboot your computer.


    After your computer has rebooted, your new Internet Explorer settings are active.
    If you ever feel like undoing this tweak, just go back into the registry and delete
    the MaxConnectionsPerServer and MaxConnectionsPer1_0Server values that you created
    and reboot.


    Another method to speed up Internet Explorer is to disable add-ons that may have
    a big impact on browser performance. In the last few releases, Internet Explorer
    started keeping track of how third-party add-ons and plug-ins affect performance.
    You can find this information in the Load Time and Navigation Time columns of
    the Manage Add-ons screen shown in Figure 17-3.'
  merge: -1
  img_proc: true
- pgno: 319
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_319_0.png)


    Figure 17-3: View the performance impact of the add-ons you use.


    For a performance boost, simply disable add-ons that affect your performance by
    following these steps:


    +   1. Open Internet Explorer, click the gear in the top right of the window,
    and click Manage Add-ons.

    2. Click Toolbars And Extensions on the side Add-on Type menu.

    3. Select the add-on you want to disable and click the Disable button.

    4. Hit the Close button and restart Internet Explorer.


    # Speeding Up Firefox


    Firefox suffers from the same limitation on file downloads as Internet Explorer.
    Thankfully, there is an easy way to modify the number of simultaneous downloads
    in Firefox as well. Additionally, you can do a few other things to speed up Firefox,
    such as reduce delays and enable parallel downloads (which Firefox calls *pipelining*).
    Instead of editing the registry, you can use a cool hidden feature in Firefox
    to hack the raw configuration settings built into the browser. Follow these steps
    to speed up browsing with Firefox:


    +   1. Open a copy of Firefox if you do not already have it open.

    2. Type `about:config` in the address bar and press Enter.

    3. Click the I''ll Be Careful, I Promise! button to view the settings.'
  merge: -1
  img_proc: true
- pgno: 320
  md: '+   4. Type `network.http` in the Search box and hit Enter.


    +   5. Scroll down the list and locate `network.http.max-persistent-connections-per-server`,
    as shown in Figure 17-4.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_320_0.png)


    Figure 17-4: Modify the configuration of Firefox.


    +   6. Right-click this setting and click Modify. Enter a higher value, such as
    15, and click OK.


    +   7. Enable parallel downloads, which is known as pipelining in Firefox. Scroll
    further down the list and locate `network.http.pipelining`.


    +   8. Right-click this setting and click Toggle to set it to true.


    +   9. Scroll down and modify `network.http.pipelining.maxrequests`. Set this
    to a value of at least 15 and click OK.


    > TIP If you use a proxy server to connect to the Internet, you will also want
    to toggle `network.http.proxy.pipelining`.


    +   10. Now increase the max number of total connections. Locate `network.http.max-connections`.


    +   11. Right-click and click Modify.'
