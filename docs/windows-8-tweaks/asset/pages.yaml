- pgno: 213
  md: '# Setting the Update Interval


    Now that you have all your performance counters set up and displaying data, you
    need to select the interval time of how often the data will be updated. How often
    the counters should be updated depends on your reasons for monitoring your hardware.
    For example, if you are trying to track how much data your computer is sending
    through your network adapter every day or hour, it is not necessary to have that
    counter update every second. You are just wasting CPU cycles because you are making
    the computer constantly update the performance counter. However, if you are interested
    in current memory or CPU utilization, you want a much faster update time.


    To change the update interval, perform the following steps:


    +   1. While in the Performance Monitor, right-click the graph and select Properties.
    Alternatively, you can press Ctrl+Q.

    2. After the Performance Monitor Properties window loads, click the General tab.

    3. Locate the Graph Elements section and update the Sample Every text box. This
    number is in seconds.

    4. Click OK to close the window and save your changes.


    Now Performance Monitor polls the data sources at your specified interval.


    # Analyzing and Detecting Problems


    The Performance Monitor and the various performance counters make it possible
    to detect many problems and shed light on how to make your system run faster.
    You should familiarize yourself with a handful of tips that deal with the specific
    performance counters listed next; these prove to be invaluable in your analysis
    and decision-making. The following are some of the things to look out for when
    monitoring your system:


    +   - **Physical Disk: Disk Read Bytes/sec and Disk Write Bytes/sec**—These two
    performance counters tell you whether your physical disk is set up and functioning
    correctly. To determine this, consult the website or the manual of the manufacturer
    of your hard drive. Look up the range of read/write speeds. If the readings that
    you are getting are far below what you should be getting, your hard disk could
    be damaged or set up incorrectly. Run diagnostic software on the disk and make
    sure that it is set up properly in Device Manager with the correct transfer mode.
    Remember that most hard drives read at different speeds when they are reading
    from different parts of the disk. This is why there may be some discrepancies
    between your readings.


    +   - **Paging File: % Usage and % Usage Peak**—These two performance counters
    can tell you how well your system is using the page file. If you set the size
    of the page file manually, these counters are critical to deciding what size'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'the page file should be. As a rule, if the page file % Usage is more than 95
    percent or if the Usage Peak is near 100 percent, consider increasing the size
    of the page file if you have the size manually.


    +   Memory: Available MBytes and Paging File, % Usage—These two performance counters
    help you decide whether you should put more RAM in your computer. If the number
    of your available megabytes is low and your paging file usage percentage is very
    high, you should consider purchasing more RAM for your computer.


    +   Processor: % Processor Time—This performance counter monitors the activity
    and work your processor is doing. If your CPU is consistently working at or more
    than 50 percent, and you are not running any computation-intensive applications
    in the background, you should consider upgrading your CPU. The CPU is having a
    hard time keeping up with all your programs. You can also try closing open applications
    that are running in the background to make your computer more responsive and faster.


    # Saving Your Performance Counter Setup


    After you have spent some time adding all the performance counters that you would
    like to use, it is possible to save this configuration so that every time you
    start and use the Performance Monitor, your performance counters are automatically
    loaded.


    To save the performance counters you selected, do the following:


    +   Right-click the graph and select Save Settings As.


    +   Type a filename, specify a location, and click Save.


    When you want to use your performance counters again, just navigate to the location
    where you saved the file and double-click it. If you changed your default web
    browser, make sure that it loads in Internet Explorer. The Performance Monitor
    tool will load as a web page in Internet Explorer. Just click the green play button
    to begin monitoring.


    # Using the Reliability Monitor


    As with the Performance Monitor, the Reliability Monitor is a system monitoring
    tool that is designed to help you diagnose problems and improve the performance
    of your computer. To start the Reliability Monitor, open the Start screen, type
    **view reliability**, change the search filter to Settings, and run View Reliability
    History. The Reliability Monitor is especially geared to helping you solve various
    types of system failures that can lead to poor performance in all areas. It works
    by tracking all the software installs, uninstalls, application failures, hardware
    failures, Windows failures, and general miscellaneous failures to compile a System
    Stability Chart and System Stability Report, as shown in Figure 12-10.'
  merge: -1
  img_proc: true
- pgno: 215
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_215_0.png)


    **Figure 12-10:** Reliability Monitor offers a reliability chart and report.


    You can select any of the icons on the **System Stability Chart** to move the
    scope of the **System Stability Report** to a specific time period. This is very
    useful because it enables you to see what happened the same day or just before
    some kind of failure occurred. Depending on this information, you have a clue
    as to the cause of the failure.


    # ### Reading the System Stability Report


    Every day your computer is given a **System Stability Index** rating based on
    the system activities of the day. The score is out of a possible 10 points. Depending
    on what has happened in the past, this score goes up or down. For example, if
    you have a Windows failure, your score goes down. As days pass, if you do not
    have any more failures, your score gradually goes back up again. However, if another
    failure occurs, it drops even more.


    I recently had an issue with installing new video drivers for my laptop. I was
    trying to get some better graphical performance by installing some enhanced drivers
    that were not exactly made for my laptop model. After I installed the new drivers,
    I had to reboot and was welcomed by the blue screen error. I rebooted again and
    the same thing happened. These system failures killed my **System Stability Index**.
    Before I had these problems I had a rating of 9.44; after'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'my driver fiasco, I had an index of 4.711. As you can see, your reliability
    rating can drop very quickly if you have multiple major errors, such as a blue
    screen.


    When you notice that your System Stability Index goes down, you are going to want
    to know why, so that you can fix the problem and get the performance of your system
    back in line. The System Stability Report is perfect for understanding exactly
    what happened.


    With your mouse, select a time period on the System Stability Chart in which your
    score dropped significantly. Depending on the information, warning, or error icons
    in the grid for the specific day, you will know what sections of the report you
    should expand to see the details of what happened. Figure 12-10 shows a red error
    icon in the Application Failures grid item on the selected day. This tells you
    to expand the Application Failures section of the report to see the details. After
    expanding the section, you see which application failed and how it failed. Similarly,
    if this were a hardware failure, you would see the component type, device name,
    and why it failed. If it were a Windows or miscellaneous failure, you would see
    the failure type and details of what happened.


    Reading the System Stability Report is a quick and easy way to see what exactly
    is going on. Next, you use the new Event Viewer in Windows 8 to get even more
    detailed information about the state of the computer.


    # ## Using Event Viewer


    Event Viewer in Windows 8 is a centralized source for reading all the system’s
    various log files. When a component such as the Windows Firewall service has an
    error, notification, or a warning, you can view it in Event Viewer. When a third-party
    application causes your computer to crash, you can also find details about the
    event in Event Viewer. Even when any user logs on to your computer, you can find
    the details of the event in Event Viewer. As you can see, Event Viewer is the
    ultimate source to find out what is happening and what has happened to your computer.


    How can Event Viewer help with increasing the performance of your computer? Event
    Viewer enables you to identify hardware and software failures that you may not
    even know have been occurring. If you want to increase the performance of your
    computer, you need to fix any problems first. Skipping ahead without fixing the
    problems is similar to tweaking your car engine for speed but not fixing the flat
    tires. Even if you increase the performance of other components of your computer,
    any errors or failures can offset any improvements in speed.


    Using Event Viewer is very easy, but requires an account with administrative privileges
    to run. To start Event Viewer, open the Start screen, type **Eventvwr. msc**,
    and then press Enter.


    After Event Viewer shows up on on-screen, you see the Overview and Summary screen,
    as shown in Figure 12-11. The Summary Of Administrative Events section'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'provides an aggregated view of all your events. This groups them together from
    all your system logs and also gives you time-period stats on the different types
    of events. Expand the different event types, such as Critical, Error, and Warning,
    to see a more detailed view of all events that match that event type. You can
    also double-click the event types and events to view more details. Doing so creates
    a custom view for you automatically. I get into those in more detail shortly.
    First, I lay the groundwork for using Event Viewer.


    # Reading Logs and Events


    The various system logs are organized in two grouping folders:


    +   - **Windows Logs**—Windows Logs enable you to find events covering Windows
    core applications, security, setup, and the system.

    - **Application And Services Logs**—You can find events such as hardware and specific
    software applications under Applications And Service Logs.


    When you expand the top-level grouping folders and select a sub-event topic, you
    are presented with a list of all the events sorted by date by default. Simply
    select an event to view the details.


    Reading the event log is very easy to do. After you select an event, the event
    details appear in the bottom pane. The most important pieces of information for
    each event are the Source, ID, and Description. If you do not see the description
    of the event on your screen, expand the Details pane up to review the description.
    Alternatively, you can double-click the event to bring up the Details pane in
    a new window.


    If you identify any events that signal an error or warning, it is a good idea
    to research the event to find out whether it is important to fix. The most popular
    way to investigate an event is to do a search on Google, Yahoo!, or Bing with
    the event ID. With the new version of Event Viewer in Windows 8, you can also
    click the More Information link on the General tab of an event. This shows you
    whether Microsoft has any information on the specific event.


    # Creating Custom Views


    Using Event Viewer can be overwhelming because of the massive amount of data to
    which you have access. Custom views are Microsoft''s answer to data overload.
    Instead of looking through multiple log files, you can create a custom view in
    which you specify parameters for specific types of events. You can use the view
    to find all events that you specified no matter what log they are in. You first
    encountered a custom view on the Event Logs Summary screen. All the information
    in the Summary Of Administrative Events section is populated by a custom view.'
  merge: -1
  img_proc: true
- pgno: 218
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_218_0.png)


    Figure 12-11: Select an event in Windows 8''s Event Viewer.


    Creating your own custom view is easier than manually navigating through all the
    different log sources, and custom views are more flexible than the Event Logs
    Summary screen. Follow these steps to create your own custom view:


    +   1. With Event Viewer open, right-click Custom Views and select Create Custom
