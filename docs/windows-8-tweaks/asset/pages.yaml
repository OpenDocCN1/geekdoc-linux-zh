    # Monitor the Action Center


    The Action Center in Windows 8 is another easy way to find out if all your “essential”
    protection software is installed and running. It is important to have your firewall,
    virus software, spyware protection, and other security features set up and turned
    on at all times to defend your computer against anything that might try to attack
    it.


    Using the Action Center is simple. Just open the Start screen, type **Action Center**,
    change the filter to Settings, and then press Enter. When Action Center loads,
    it displays alerts as shown in Figure 19-2. If everything is in the green, you
    are set. If not, pay attention to the recommendations so that your computer is
    as secure as possible.'
  merge: -1
  img_proc: true
- pgno: 364
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_364_0.png)


    **Figure 19-2:** Action Center displays security information.


    # # Using a Firewall


    One way to help fight attackers and viruses from the Internet is to block access
    to your computer on all ports, which can be gateways into your computer. How exactly
    do you block all the ports? A firewall is a special application that acts as a
    brick wall that is protecting all the ports on your computer.


    When a remote computer attempts to access a computer that is protected by a firewall,
    it is not able to connect and the data that was sent is ignored and discarded.
    Depending on the way the firewall is configured, when data is sent to a blocked
    port on your computer, the firewall responds to where the data was sent from with
    a message that the port is closed or it does nothing, giving your computer a stealth
    presence. Most firewall applications are set up by default to run in stealth mode,
    which provides the maximum amount of protection. Any remote computer trying to
    connect or send data to your computer with a firewall installed and running in
    stealth mode will think that your computer has gone offline because it is not
    getting a response.'
  merge: -1
  img_proc: true
- pgno: 365
  md: 'So far, I have talked only about firewalls that block incoming attacks from
    the Internet. Firewalls can also block traffic originating from your computer
    going out to the Internet. Why would you want to do that? What if someone installed
    a key logger on your computer that sends all your information to a remote computer
    for him to use? Or how about a media player that sends a history of everything
    that you played to a server for tracking purposes? With a two-way firewall, you
    can block outgoing traffic that you haven''t authorized.


    Firewalls can be a very powerful security device. In Windows 8, a firewall configured
    properly can completely eliminate one way an attacker may try to gain access to
    your computer. The next section shows you how you can use the new and improved
    firewall in Windows 8 to block incoming attacks and prevent unwanted applications
    from sending information out.


    # Using the Windows 8 Firewall


    The firewall included in Windows 8 is much more advanced than previous Windows
    firewalls. Microsoft actually calls it “Windows Firewall with Advanced Security.”
    Its three different location profiles enable you to customize your firewall rules
    based on where your computer is. If it is in a public place, you can impose very
    strict firewall rules, whereas if you are in a corporate domain at work or on
    a private network at home, you can use less strict security options. In addition
    to location profiles, the firewall’s complex rule structure allows you maximum
    flexibility to create specific openings in your firewall to permit application
    or service-related network traffic. Most importantly, Windows Firewall has to
    block outgoing traffic as well.


    The upgrades to Windows Firewall really make it a very powerful security solution
    that was once provided only by advanced third-party firewall software. The next
    two sections guide you through the basics of using the advanced firewall configuration
    tool and enabling the outbound firewall.


    # Configuring Windows Firewall


    The Network and Sharing Center is where you configure all the network-related
    settings on your Windows 8 PC. You can also access the Windows Firewall from the
    Network and Sharing Center, but only the basic controls are exposed. Instead,
    the best way to manage the Windows Firewall is through the Windows Firewall with
    Advanced Security Management Console. Open the Start screen, type **wf.msc**,
    and press Enter. When the Windows Firewall with Advanced Security window loads,
    you will see the complexity and the power of the new firewall. Maybe it was a
    good idea Microsoft decided to hide this from inexperienced users after all. On
    the main screen you see a list of the profiles, as shown in Figure 19-3.'
  merge: -1
  img_proc: true
- pgno: 366
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_366_0.png)


    **Figure 19-3:** Use Windows Firewall with Advanced Security.


    This main screen is where you can see if the firewall is on and if the Inbound
    and Outbound Rules are active. The next step is to view the specific rules. You
    can do that by simply selecting Inbound Rules or Outbound Rules from the list
    on the left. Go ahead and click Inbound Rules now.


    Shortly, you will see all the rules currently set up on your computer. If they
    are enabled, they will have the green icon. If not, the icon will be gray. You
    can also see what firewall profiles the rule is used in, as shown in the Profile
    column in Figure 19-4. If you ever need to enable or disable a rule, just right-click
    it and select Enable or Disable. You can also edit an individual rule’s properties
    by right-clicking the rule and selecting Properties. Working with the Outbound
    Rules is exactly the same as working with Inbound Rules; Outbound Rules just control
    a different direction of traffic.


    For the sake of demonstrating how to add a new rule, say that you just installed
    some type of server on your computer that users will connect to on TCP port 800.
    Follow these steps to open up a hole so that your users can connect:


    +   1. If the Windows Firewall with Advanced Security window is not already open,
    open the Start screen, type `wf.msc`, and press Enter.


    +   2. After the management console loads, click Inbound Rules.'
  merge: -1
  img_proc: true
