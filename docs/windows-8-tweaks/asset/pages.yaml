    # Recommended Service Configuration


    The bare-bones system service setup is great for optimal performance, but you
    are eliminating a lot of the helpful features that make Windows 8 cool and new.
    Check out my list of recommended services to disable:


    +   - Bluetooth Support

    - DHCP Client

    - Function Discovery Provider Host

    - Function Discovery Resource Publication

    - Group Policy Client

    - HomeGroup Listener

    - HomeGroup Provider

    - Network Connected Devices Auto-Setup

    - Peer Name Resolution Protocol

    - Peer Networking Grouping

    - Peer Networking Identity Manager

    - Portable Device Enumerator

    - Terminal Services

    - Touch Keyboard and Handwriting Panel Service

    - Windows Error Reporting Service


    Disabling these least commonly used services provides a good balance between saving
    boot time and keeping the cool new Windows 8 features and application compatibility.


    # Optimizing the Location of the Boot Files


    The speed at which your files are read depends on your physical hard drive access
    speed and where the files are located in your hard drive. To increase the speed
    of your boot, you want to have the files used to boot your computer in a location
    that will allow the fastest read speed possible.'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'For example, I installed Windows 8 to an SSD drive that has very fast read
    speed. The result is a Windows 8 boot that takes just a few seconds. If you don’t
    own an SSD, I highly recommend getting one because the cost has come down significantly.
    I cover selecting an SSD drive and show you how to transfer your entire Windows
    8 install in Chapter 16, which is about improving overall system performance.


    If you are stuck with a traditional hard drive you can still optimize the placement
    of the files. Although, in Windows 8, what is commonly known as a boot defragment
    is done automatically. I show you how to use third-party defragment utilities
    that optimize your boot speed and more in Chapter 16 as well.


    # ## Summary


    This chapter showed you many ways to reduce the amount of time it takes your computer
    to boot. First, you worked on changing some of the BIOS settings that optimize
    your computer to achieve maximum boot speed. Then, you learned how to remove your
    boot screen to shave off some more time. After that, you disabled other parts
    of Windows, such as hardware, fonts, and services that you may never use, but
    which all take up time when your computer starts up. To wrap up this chapter,
    I touched on optimizing the location of the Windows 8 boot files.


    This chapter showed you how to speed up the first half of your computer’s startup.
    The next chapter picks up on the second half—the system logon. I show you some
    cool tips on how you can speed it up, too.'
  merge: -1
  img_proc: true
