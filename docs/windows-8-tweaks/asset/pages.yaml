    # ### Speeding Up Your Network Connection


    The speed of your network connection does not depend on only the speed of your
    hardware. Windows is an operating system that is designed to work on a variety
    of different hardware and network setups. Because of the abstract nature of the
    operating system, it cannot be optimized for user-specific hardware setups.


    Depending on the type of network connection you have, you might be able to tweak
    your connection so that the speed of your Internet connection as well as your
    local area network will be faster. These tweaks can help the auto-tuning network
    settings included in Windows 8 narrow in on a smaller range to find the optimal
    value.


    # #### Tweaking Auto Tuning


    The network stack in Windows 8 is very intelligent compared to previous versions
    of Windows, such as XP. Instead of using static transmission and receiving settings,
    it adjusts to optimal values for the current network condition. Some of these
    values have a wide range of possible settings so it can help to narrow the range.
    Also, depending on what your hardware supports, you may be able to increase the
    performance of your network significantly by disabling auto tuning completely.


    You can configure all the auto-tuning settings with the `netsh` command in conjunction
    with the auto-tuning level you want to use. By default, your system will run in
    Normal mode, but a number of options are available:


    +   - **Highly restricted**—Allows the receive window to grow but is the most
    conservative.

    - **Restricted**—Allows the receive window to grow but is less conservative.

    - **Normal**—Allows the receive window to grow at the normal rate.

    - **Disable**—Completely disables the auto-tuning feature.


    Open up an administrative-level command prompt to change the setting:


    +   1. Open the Start screen, type in **cmd**.

    2. When you see the shortcut appear, right-click it and click **Run As Administrator**.'
  merge: -1
  img_proc: true
- pgno: 326
  md: '+   3. Type `netsh interface tcp set global autotuninglevel=<level>` and hit
    Enter. Replace `<level>` with either **highlyrestricted**, **restricted**, **normal**,
    or **disable**.


    For example, a complete command would look like `netsh interface tcp set global
    autotuninglevel=disable`.


    I find it best to experiment with all the different levels to see which one works
    best in your environment. If you want to revert back to the default settings,
    set **autotuninglevel=normal**.


    # Disabling Unneeded Protocols


    Every computer comes with programs installed that you do not need. As with extra
    programs taking up space, extra protocols are just wasting your network connection
    and can actually slow it down. How is this possible? By default, a few different
    protocols are installed on your computer to allow for maximum compatibility with
    other computers on a network; these protocols each require bandwidth to operate.
    Most users don’t use many protocols, and their computers use up a portion of their
    connection as they respond and transmit information for these protocols.


    Additionally, with extra protocols installed on your network adapter connected
    to the Internet, you increase the risk of having security-related problems. One
    of the most common risks for broadband users is having the Client for Microsoft
    Networks networking protocol enabled on their connections and no firewall to block
    the public from their computers. This protocol allows everyone on the users’ networks,
    or local neighborhoods if they have a cable connection without a firewall or router,
    to connect to their computers and view any files that they may be sharing. This
    fact alone should be a good enough reason for you to turn off the extra protocols,
    but with them disabled, you save a little bandwidth as well.


    # Viewing Protocols on Your Network Adapters


    Viewing the protocols installed and active on your various network adapters is
    easy. Just follow these quick steps and you will be viewing them in no time:


    +   1. Open the **Start** screen, type **Network and Sharing Center**, change
    the filter to **Settings**, and hit **Enter**.


    +   2. On the side menu, click **Change Adapter Settings**.


    This shows a list of all the network adapters installed on your computer.


    +   3. Right-click any of the adapters and select **Properties**.'
  merge: -1
  img_proc: true
- pgno: 327
  md: 'This brings up a list of the protocols that are installed and active on your
    adapter (see Figure 17-8). The protocols that are installed but are not active
    are indicated by the absence of a check in the box.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_327_0.png)


    # Disabling a Specific Protocol


    Now that you have the list of installed and active protocols on your screen, you
    are ready to disable a protocol. To do so, just click the checkbox to remove the
    check. Then click OK and the protocol will no longer be active on the network
    adapter. Take a look at Table 17-2 for help with the default Windows protocols.
    If you see any other protocols that are not listed in this table, you should research
    online before you disable them.'
  merge: -1
  img_proc: true
- pgno: 328
  md: '**Table 17-2: Windows 8 Networking Protocols**

    | PROTOCOL NAME | FUNCTION |

    | --- | --- |

    | Client for Microsoft Networks | Used to access other shared resources on your
    local network running the File and Printer Sharing for Microsoft Networks protocol.
    |

    | QOS Packet Scheduler | Used to provide traffic management on your network for
    applications that support the protocol. |

    | File and Printer Sharing for Microsoft Networks | Used to share your printer
    and files on your computer with other computers on your local network. |

    | Microsoft Network Adapter Multiplexor Protocol | Provides the ability to load
    balance between two or more network cards. |

    | Microsoft LLDP Protocol Driver | Used to create the network map used in the
    Network browser and Networking and Sharing Center. |

    | Link Layer Topology Discovery Mapper I/O Driver | Used to discover other computers
    connected to your local network. |

    | Link Layer Topology Responder | Used to identify your computer to other computers
    connected to your local network. |

    | Internet Protocol Version 6 (TCP/IPv6) | New version of the IPv4 protocol that
    is not very widespread. Unless you are connected to an IPv6 network (most of you
    are not), you can safely disable this protocol. |

    | Internet Protocol Version 4 (TCP/IPv4) | Primary network communication protocol.
    Do not disable this protocol. |


    For optimal speed configuration, disable all protocols except for Internet Protocol
    Version 4. Note, however, that by doing so you will no longer be able to share
    or access shared files and resources, and certain programs and features that rely
    on other protocols may not work.


    Also keep in mind that if you have multiple network adapters in your computer—such
    as a wireless adapter, a wired network adapter, and a dial-up modem—you have to
    repeat the preceding instructions for each device.


    # ## Summary


