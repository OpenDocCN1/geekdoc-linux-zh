    A useful chart at the bottom of the Memory section shows how your physical RAM
    is allocated. The chart includes hardware reserved, in use, modified, standby,
    and free.


    # Using the Detailed Disk Section


    The detailed Disk section shows the read and write speeds of the various processes
    running in bytes per minute, as shown in Figure 12-4. The list of read and write
    speeds for each process also shows the file that is in use. The Disk bar shows
    the total speed of all the disk operations as well as the percent of the time
    the disk is active.


    These numbers enable you to see whether an application is hogging your disk and
    slowing down all the other processes on your computer because it is reading and
    writing so much data. This is especially useful when you are trying to identify
    what your hard drive is doing when you hear it going crazy and the hard drive
    read/write light seems as though it is constantly on.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_207_0.png)


    **Figure 12-4:** The detailed Disk section displays information about the speed
    of various processes.


    # *Using the Detailed Network Section*


    The detailed Network section shows which processes on your system are using the
    network, as shown in Figure 12-5. The Network Activity bar shows you the current
    network speed and the percent your network connections are utilized. Each open
    network connection is listed below with the name of the process using the connection.
    Additionally, you will find the network address the process has connected to as
    well as the amount of data sent and received in bytes per minute.


    Have a slow Internet connection? Are the lights on your cable or DSL modem going
    crazy? These network usage stats help you diagnose a process that is bogging down
    your network connection, such as a free peer-to-peer VoIP (Voice over IP) application.
    These applications can use your network connection even if you are not on a call.
    Other users’ calls may be routed through your computer, resulting in your network
    connection slowing down. Using the information in the detailed Network overview,
    you can easily identify how much data is transferring both ways for every process
    on your computer.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_208_0.png)


    Figure 12-5: The detailed Network section provides information about networks
    in use.


    **NOTE** With the detailed Network overview, it is easy to find out if your network
    connection has a high utilization rate by looking at the header bar. Keep in mind
    that the network card in your computer usually has a greater capacity and is capable
    of higher speeds than your Internet connection. If you have a 100 MB network card
    in your computer and it is connected to a 10 MB broadband Internet connection,
    then when your network card utilization is at 10 percent, your Internet connection
    is at 100 percent utilization.


    # Using Performance Monitor to Get More System Stats


    Performance Monitor is one of the classic features of the Performance Diagnostic
    Console that has been around since Windows NT. Over the years, Performance Monitor
    has been refined and is now a very comprehensive tool. In Windows 8, hundreds
    of built-in monitors enable you to monitor just about every aspect of the operating
    system and your hardware. If you want, you can even view information about how
    fast your laptop''s battery is charging or discharging.'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'Similar to other system monitoring tools, the Performance Monitor is provided
    to help you detect problems and improve your system performance.


    Open the Start screen, type **perfmon.msc**, and hit Enter. When the Performance
    Monitor loads, select Performance Monitor under Monitoring Tools. You should now
    see a graph of the processor utilization percentage. This is a rather useless
    chart because you already have this information in the Resource Monitor or Task
    Manager. The real power of the Performance Monitor is in the performance counters.


    > **TIP** Performance Monitor gets the data for the counter from the system registry
    by default. A special flag for perfmon.msc enables you to change the data source
    to get the data directly from the Windows Management Interface instead. This is
    useful if you are getting some strange results and would like to get a second
    opinion on what is really going on. Simply open the Start screen, type **perfmon.msc
    /sysmon_wmi**, and hit Enter.


    To add more performance counters, click the icon with the + symbol on it or press
    Ctrl+I, and the Add Counters window appears, as shown in Figure 12-6.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_209_0.png)


    When the Add Counters window appears, the counters are organized in different
    component categories. Navigate through the list box and click the down'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'arrow to see the individual counters available for the selected subject. Because
    some of the counter names are vague, you can turn on the bottom description pane
    to find out more details about a specific counter by checking the Show Description
    box in the lower-left corner of the window.


    Say that you want to monitor remote desktop connections made to your computer.
    You can easily accomplish this with the right performance counter:


    +   1. With the Add Counters window open, navigate through the list of subjects
    and expand Terminal Services.

    2. You see three counters: Active Sessions, Inactive Sessions, and Total Sessions.
    Select Active Sessions.

    3. Depending on the counter, you may be required to select which instance of the
    object you want to track. If your computer has a multi-core CPU chip and you are
    using a CPU utilization counter, the Instances Of Selected Object list box displays
    and enables you to choose what core of the CPU you want to track. The selected
    Active Sessions counter has no instance options, so that box remains grayed out.

    4. After you select the counter, click the Add button.

    5. When a new counter has been added, you can always add more counters on the
    same screen. Select the Total Sessions counter and click Add again.

    6. Click OK to close the Add Counters window and return to the Performance Monitor
    screen.


    > **TIP** When selecting performance counters, you can hold the Ctrl key and select
    multiple counters at once instead of having to click each counter individually
    and then hitting Add. Then click the Add button and all the selected counters
    are added. Additionally, if you want to add all the counters in a category, select
    the category name and click Add.


    > **TIP** When adding performance counters to the Performance Monitor, it is possible
    to add counters from a remote computer. If your computer is on a corporate domain
    and you have administrative rights, or if you have an administrative account on
    another home computer, you can easily monitor the performance remotely. When the
    Add Counters window is open, simply type the name of the computer in the Select
    Counters From Computer box. Alternatively, you can click the Browse button and
    select the computer if the remote computer’s name is broadcast across your network.
    After entering the computer name, press Enter to connect. If you get an error
    in a home or non-domain environment, make sure that you have permissions on your
    domain to use this feature and that your username and password for the account
    you are currently logged on to is the same on both computers.'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'You see the Terminal Services Active Sessions and Total Sessions counters listed
