- pgno: 20
  md: '# # Introduction


    Building off the success of Windows 7, Microsoft embarked upon the boldest redesign
    of Windows since the introduction of the Start menu in Windows 95. The goal was
    to modernize the operating system. The result has been the most controversial
    release of Windows, primarily because of the new user interface. Called the “Metro”
    interface during development, the new Start screen replaces the classic Start
    menu and Start button. Some love it, some hate it with a passion. But one thing
    was certain: Microsoft had to make dramatic changes or Windows would become irrelevant.


    About six months after the release of Windows 7, Apple released the first iPad.
    From that moment forward, tablet usage exploded and Apple and Google took over
    the market. iOS and Android were built specifically for the new world of mobile
    touch-computing, but Windows 7 was primarily designed to be operated with a mouse
    and keyboard. Without a competitive product, Microsoft was unable to participate
    in the new tablet market. Making matters worse, the desktop and laptop market
    was shrinking, with tablets expected to eventually overtake the entire PC market.
    Microsoft could not afford to make Windows 8 just another minor upgrade, so instead,
    it started re-imagining Windows from the ground up.


    Finally understanding that touch is not just an input feature but is also an element
    of design, Microsoft created the new “Metro” style interface. This new interface
    works great with touch while still working with a keyboard and mouse. Understanding
    that applications also need to be redesigned to be effective with touch, Microsoft
    created the Windows App Store, which provides applications written for the new
    touch-friendly application framework called WinRT. Microsoft did not want to alienate
    the traditional Windows users, so the traditional desktop of Windows 8 remains
    and also was refreshed and refined.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'Throughout development, Microsoft leveraged its monitoring platform to monitor
    various metrics on the preview builds released to the public. This allowed the
    quality of code to be monitored and also the performance of the OS to be tightly
    controlled. Trouble spots were automatically reported, so Microsoft knew exactly
    what components needed to be optimized. The underlying systems that power Windows
    8, such as the kernel and the core system services that run on top, have all been
    optimized even beyond the dramatic improvements seen in Windows 7. The amount
    of RAM required to run a new version of Windows has decreased yet again and the
    CPU is used even more efficiently, especially when trying to conserve battery
    on mobile devices such as laptops and tablets.


    Although the new interface and performance increases are a great addition, there
    is more to tweak in Windows 8 than any recent release. While some love the new
    interface, others want to change it or disable it completely. People have different
    preferences and want their operating system to run their way. This book helps
    you customize the controversial aspects of Windows 8 as well as the traditional
    desktop. I show you ways to further improve the performance of Windows 8 with
    various settings and even some quick-and-easy hardware upgrades. The book wraps
    up with a topic that is very important to every user: Windows security.


    Are you ready to customize, speed up, and secure your Windows 8 computer? Let''s
    get started!


    # # Who Should Read This Book


    This book is intended for all Windows 8 users who are interested in customizing,
    improving the performance of, and using the latest security features and tools
    to secure Windows 8. Previous Windows experience is highly recommended for this
    book. Most of the topics are geared toward an advanced Windows user, but every
    section is written in a way that even beginner Windows users can understand and
    complete.


    # # What You Need to Use This Book


    Windows 8 Enterprise is required to perform all tweaks and hacks mentioned in
    this book. You can use other editions of Windows 8, but you may find a few sections
    do not work because that particular feature is not in your edition.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Conventions Used in This Book


    This book uses two notification icons—Tip and Caution—that point out important
    information. Here''s what the two types of icons look like:


    **TIP** Tips provide small, helpful hints and related tweaks.


    **CAUTION** Cautions alert you to possible hazards that can result from the tweak.


    Code, commands, and executables within the text appear in a *monospace font*,
    whereas content you type appears in **bold**.


    # The Book’s Companion Website


    For links and updates, please visit this book’s companion website at *http://Tweaks.com/books/win8tweaks/.*'
