- pgno: 386
  md: 'I recommend that you always accept first-party cookies. You can decide whether
    you want to block all third-party cookies or be prompted to accept them. If you
    select the Prompt option, a dialog box notifies you that each cookie''s request
    has been received.


    +   7. Click OK to save your changes and return to Internet Options.

    8. Click OK again to close Internet Options.


    Now that you have set the cookie privacy setting manually, you can eliminate cookies
    from being stored on your hard drive in the first place. Doing so allows you to
    protect your privacy and still be able to use websites that need cookies.


    # Protecting Sensitive Online Data


    If you manage your finances or shop online, you probably have had experience with
    using secure web connections, otherwise known as Secure Sockets Layer (SSL). These
    secure connections encrypt the data that is transferred to and from a web server
    and your computer. After the data gets to your computer, your browser has a special
    key that decrypts the information and displays it on your computer. During this
    process, when the file is decrypted, it is saved in the Temporary Internet Files
    directory so that the browser can display it.


    This default appears to be harmless because the web page is saved on your computer
    only. If no one has remote access to your computer, the data is safe, right? Not
    necessarily, because your data is now vulnerable to anyone who has physical local
    access to your computer. If that person is clever and lucky enough, he or she
    can sort through your Temporary Internet Files directory and just might find some
    confidential information such as your online banking information. All this information
    is saved by default on your hard drive for anyone to see if they know how to get
    to it. They do not even need to know your password or log on to your account on
    the bank''s website because a snapshot of the web page is stored locally on your
    computer.


    What can you do to protect your computer from this vulnerability besides setting
    up better security such as complex passwords? Internet Explorer offers a cool
    feature that you just have to turn on to eliminate this problem completely. Simply
    called Do Not Save Encrypted Pages To Disk, this feature prevents your computer
    from storing the encrypted data. To enable it, follow these steps:


    +   1. Open Internet Explorer.

    2. Click the gear icon and click Internet Options.

    3. Click the Advanced tab.

    4. Scroll down through the list toward the bottom of the window until you see
    the Security section.'
  merge: -1
  img_proc: true
- pgno: 387
  md: '+   5. Check the Do Not Save Encrypted Pages To Disk box.

    6. Click OK to save and activate your changes.


    Now you no longer have to worry about pages that were encrypted being saved to
    your drive for anyone who has access to your computer to see.


    # ## Disabling AutoComplete


    You already know about AutoComplete from the address bar. You have taken care
    of that privacy problem by clearing the file that stored the information, as shown
    in the section called, “Removing Address Bar Suggestions.” AutoComplete also tries
    to give a helping hand when you are filling in text boxes on web pages. In this
    situation, AutoComplete works exactly the same as it does with the address bar.
    As you begin to fill in the text box, several suggestions appear based on information
    that you have already typed in.


    To get an idea of how this works in action, visit any site with a text box such
    as a username or login field and start to type your username. When you do so,
    words similar to those you have typed in the box on other visits to the site will
    appear. This capability allows anyone who uses your computer under your account
    to see your username or anything else you entered into similar text boxes on websites.


    Clearly, having this feature enabled would be a big concern if you were con-cerned
    about your privacy. Disabling the AutoComplete feature is not very difficult and
    completely takes care of this privacy concern. Follow these steps to put an end
    to AutoComplete:


    +   1. Open Internet Explorer.

    2. Click the gear icon and click Internet Options.

    3. Click the Content tab and then the Settings button under the AutoComplete section.

    4. After the AutoComplete Settings window loads, clear all the boxes, as shown
    in Figure 20-4.

    5. Click OK to save your changes.

    6. Click OK again to close Internet Options and activate your changes.


    AutoComplete is now a thing of the past. You no longer have to worry that people
    who use your computer can see all the things that you type into your address bar
    and text boxes.'
