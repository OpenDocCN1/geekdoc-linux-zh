- pgno: 348
  md: '# Table 18-1: User Account Control Settings


    | SETTING NAME | FUNCTION |

    | :--- | :--- |

    | User Account Control: Admin Approval Mode for the built-in Administrator account.
    | This determines whether an Administrator who is logged on and working will get
    UAC prompts. This account is usually disabled, so this setting is useless. |

    | User Account Control: Allows UIAccess applications to prompt for elevation without
    using the secure desktop. | This setting allows remote control applications such
    as Remote Assistance to receive UAC prompts without switching to the secure desktop.
    |

    | User Account Control: Behavior of the elevation prompts for Administrators in
    Admin Approval Mode. | This determines which type of prompt an Administrator receives.
    You can choose between prompting for consent, prompting for the admin password,
    or disabling the prompting altogether. |

    | User Account Control: Behavior of the elevation prompt for standard users. |
    This determines the type of UAC prompt standard users receive. By default, this
    is set to prompt for credentials, but it can be set to disable prompting. |

    | User Account Control: Detects application installations and prompts for elevation.
    | This allows you to disable UAC prompts for installing new applications. |

    | User Account Control: Only elevates executables that are signed and validated.
    | This setting is disabled by default, but if you want a super-secure system that
    can run only applications that are signed with a certificate, you can enable this.
    |

    | User Account Control: Only elevates UIAccess applications that are installed
    in secure locations. | This allows UAC to elevate only those applications that
    are in secure locations such as your local hard drive. An unsecured location may
    not be a trusted network drive. |

    | User Account Control: Runs all administrators in Admin Approval Mode. | Similar
    to the Admin Approval Mode for the built-in Administrator account, this setting
    applies to all accounts that are members of the Administrator security group.
    |

    | User Account Control: Switches to the secure desktop when prompting for elevation.
    | Enables you to specify whether you want to switch to a secure desktop—one where
    other applications and scripts do not have access—to protect the UAC prompts from
    being manipulated by scripts and applications instead of end users. |

    | User Account Control: Virtualizes file and registry write failures to per-user
    locations. | Enables users running as standard users to run applications that
    might previously have required administrative rights. This redirects system registry
    entries that are protected by admin permissions to local user locations so the
    application will still run. |'
  merge: -1
  img_proc: true
- pgno: 349
  md: 'Changing the UAC settings is easy to do with the Local Security Policy editor.
    Just follow these steps to modify the settings:


    +   1. Open the Start screen, type secpol.msc, and hit Enter.

    2. After the Local Security Policy editor loads, expand Local Policies and click
    Security Options.

    3. Scroll to the bottom of the list to see all the UAC security policies. Right-click
    a policy and click Properties to modify it.

    4. When finished, click OK to save the changes.


    As you can see, editing the User Account Control''s settings is very simple. If
    you are fed up with the UAC and want to disable it completely, all you need to
    do is set the User Account Control: Behavior Of The Elevation Prompt For Administrators
    In Admin Approval Mode and User Account Control: Behavior Of The Elevation Prompt
    For Standard Users policies to No Prompt and you will no longer have any annoying
    prompts. However, you will have just killed one of the best security features
    in Windows 8. That is why I believe that it is still possible to use User Account
    Control while decreasing some of the annoying prompts. The next section shows
    you how to configure UAC settings for a good balance.


    # Compromising Between User Account Control and Security


    Although many people want to disable UAC completely, I am against this because
    of the added security it provides to Windows 8. Instead, I like to configure my
    computer in a way that I can get the best of both worlds—being able to install
    applications and freely configure Windows settings without getting bothered with
    UAC prompts, while still getting the security of UAC. How is this possible? Use
    two accounts!


    All too often people use their computer logged on with a user that is a member
    of the Administrator group. They do this accidentally or without even knowing
    it because when an account is created as part of the end of the Windows 8 setup,
    it automatically adds it to the local Administrator security group. The end result
    is a situation in which you have to be treated as a standard user and authorize
    every single change to secure the system. I offer a better solution to secure
    the system that greatly reduces the number of prompts you see. This set up is
    very simple and easy to use after you get the hang of it.


    This is how it works: You have two accounts on your machine. One for day-to-day
    use that is a low-rights, standard user account with UAC running, and another
    account that has full admin rights with UAC disabled so that you can easily install
    and change system settings with it when needed.'
  merge: -1
  img_proc: true
- pgno: 350
  md: 'To do this, you need to convert your Administrator-level account to a standard
    user account. Next, create a new Administrator account for the sole purpose of
    installing and managing applications and changing system settings. You then configure
    UAC not to prompt for authorizations on that special admin account so that you
    can be free of the UAC annoyances when using it.


    After creating your two accounts, you have a standard user-level account that
    you use 99% of the time for your day-to-day work. This account is protected with
    UAC, ensuring your computer is secure. Then, when you need to make a bunch of
    system changes or install applications, you can use fast user switching to switch
    into the system configuration admin account you created to make your changes without
    having to worry about UAC.


    Follow these detailed steps to get the best of both worlds:


    +   1.  First, create a dedicated administrator account. Open the Start screen,
    type **Give other user access**, change the filter to Settings, and hit Enter.

    2.  Under Other Users, click the Add A User button.

    3.  Because this account is only for administering your PC, select Sign In Without
    A Microsoft Account on the bottom of the screen.

    4.  Click Local Account.

    5.  Enter the username and password for your new admin account and click Next.

    6.  Click Finish.

    7.  Open the Start screen, type **Make changes to accounts**, change the filter
    to Settings, and hit Enter.

    8.  Click the new admin account you just created.

    9.  Under Make Changes To Your User Account, click Change The Account Type.

    10. Select Administrator and click Change Account Type.

    11. Now that your new admin account is created, convert your primary account to
    a standard user. Click Manage Another Account under the Make Changes section.

    12. Click your primary account.

    13. Select Change The Account Type.

    14. Select Standard and click the Change Account Type button.

    15. The final change will disable UAC for the administrator account. Go back into
    the Local Security Policy editor by opening the Start screen, typing **secpol.msc**,
    and hitting Enter.'
  merge: -1
  img_proc: true
- pgno: 351
  md: '+   16. Navigate through Local Policies and Security Options and locate User
    Account Control: Run All Administrators In Admin Approval Mode. Right-click this
    policy and select Properties.

    17. Select Disable and click OK to save the changes.


    You are now finished setting up UAC to not run for your system configuration account.


    After you are finished with these steps, you can easily switch to the configuration
    account with higher rights by pressing and holding Ctrl+Alt+Delete. Then click
    Switch User and select the configuration account. When you are finished doing
    work that requires higher rights, press Ctrl+Alt+Delete again and switch back
    to your low-rights session.


    # Using File Encryption


    Do you have important documents on your computer that you don’t want anyone else
    to see? Sure, you can set file permissions on files so that only your account
    can read them. Is that enough? Is that enough? Unfortunately, it is not, because
    file permissions can be manipulated in many ways and your account password replaced
    if someone has physical access to your computer. If your computer is stolen or
    if someone breaks into your office or home, the only way truly to protect important
    data is to encrypt it.


    Windows 8 includes two different levels of encryption: file level and hard-drive
    level. The file-based encryption is a feature of NTFS, whereas the drive-level
    method is a feature in Windows 8 called *BitLocker Drive Encryption*. The main
    difference between the two is that BitLocker Drive Encryption can encrypt your
    entire drive or partition so that even the filesystem is protected. Everything
    on the drive, including the operating system, is encrypted so that no one will
    even be able to see a list of files. The security of BitLocker Drive Encryption
    comes at the price of performance and requires certain hardware, which is why
    file-level encryption is often preferred. Therefore, I am going to cover that
    first.


    # Encrypting Your Files


    File-level encryption in Windows 8 is very easy to do. However, some steps are
    required before you start encrypting files to make sure that you can always decrypt
    your files at a later time no matter what happens. This next section shows you
    why it is important to set up a Recovery Agent in Windows 8.'
  merge: -1
  img_proc: true
- pgno: 352
  md: '# Setting Up a Recovery Agent


    What happens to your data if some day you forget your password and someone has
    to set you a new one, or if you are forced to reload Windows 8 because of a major
    Windows or hardware failure? In all these events you end up losing access to any
    files you encrypted earlier because of the way the encryption system is safeguarded.
    If you encrypt files on your computer, you want to make sure that they are safe
    and no one but you can read them. Windows needs to make sure that your encrypted
    files can be decrypted only by the account that protected them.


    If someone else has an Administrator account on your computer, he is capable of
    setting a new password for your account and logging on using your username and
    password. Typically, anyone logging on to your account has full access to all
    your encrypted files; however, in the preceding scenario, to protect your files
    Windows removes access to them so that even your account can no longer access
    the files. This feature has both good and bad effects. It is very good because
    it is smart enough to protect your data from an untrusted administrator; however,
    you can also lose access to your own documents. There is a solution to this dilemma.
    By using local group policy, you can specify a Recovery Agent that will always
    give you the ability to decrypt your own files.


    This works by instructing the encryption system to add an extra certificate reference
    to the file when it is in the process of encrypting. This extra certificate reference
    belongs to what is commonly called the Recovery Agent. Setting up the Recovery
    Agent is two-fold. First you must generate the certificate assigned to the Recovery
    Agent. Then you need to set up the encryption system to use it. Follow these steps
    to get your Recovery Agent up and running:


    +   1. Log on to an account on your computer that is a member of the Administrator
    group.


    +   2. Open the Start screen, type cmd, and hit Enter.


    +   3. Once Command Prompt is shown, type in mkdir c:\\RA and hit Enter.


    +   4. Then type cipher /r:c:\\RA and hit Enter.


    +   5. When prompted, type a password to protect the Recovery Agent certificate,
    and then press Enter. You have to do this a second time to confirm the password
    was entered correctly.


    When the command is finished, it will have generated two files: recovery .cer
    and recovery.pfx. I go into more detail on these files later.


    +   6. Open the Start screen, type secpol.msc, and press Enter.


    +   7. Expand Public Key Policies, right-click Encrypting File System, and then
    select Add Data Recovery Agent.'
  merge: -1
  img_proc: true
- pgno: 353
  md: '+   8. Click Next on the wizard welcome screen and then click Browse Folders
    to specify the location of recovery.cer. It should now be in `c:\ra\` if you followed
    steps 4 and 5 correctly.

    9. Click Yes on the screen informing you that Windows cannot determine if this
    certificate has been revoked. Your window should now look similar to Figure 18-11.

    10. Click Next again, click Finish, and then you are done. The Recovery Agent
    is now set up.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_353_0.png)


    **Figure 18-11:** Add a Recovery Agent to Windows 8’s encrypted filesystem so
    you can always access encrypted data.


    It is very important to remove the other file, recovery.pfx, from `C:\RA` and
    burn it to a CD or store it on a USB thumb drive. Then place the CD or USB thumb
    drive in a safe or safety deposit box to ensure it does not get into the wrong
    hands. If you ever need to decrypt your encrypted files, you will use recovery.pfx.
    If anyone gets a hold of that file and can then guess your password, all your
    files can be decrypted. That is why it is so important to remove that file from
    your computer and put it in a very safe place.


    If you ever have a need to decrypt your own files after losing access to them
    for any reason, copy recovery.pfx back to any computer (one that you want to decrypt
    your files on) and double-click it. Then go through the wizard to import the certificate
    and enter your password when prompted. You will now be able to access and decrypt
    any files you need.'
  merge: -1
  img_proc: true
- pgno: 354
  md: '# Setting Files to Be Encrypted


    Now that you have your Recovery Agent set up and the PFX file removed from the
    computer and placed in a safe location, you can safely and securely encrypt the
    files on your computer. To do so, just navigate to a file or folder that you want
    to encrypt on your machine and follow these steps:


    +   1. Right-click a file or folder and select Properties.

    2. On the General tab, click the Advanced button.

    3. Check the Encrypt Contents To Secure Data box and click OK, as shown in Figure
    18-12.

    4. Click OK to exit properties, and you are finished.


    If a notification pops up asking you to back up your encryption key, just ignore
    it; you already backed it up earlier.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_354_0.png)


    Figure 18-12: You can encrypt files with the encrypted filesystem.


    If you ever want to decrypt a file, just uncheck the Encrypt Contents To Secure
    Data box that you checked previously and click OK.'
  merge: -1
  img_proc: true
- pgno: 355
  md: '# Using BitLocker Drive Encryption


    BitLocker Drive Encryption is another improved feature from Windows Vista that
    allows you to encrypt an entire drive or partition. This drive-layer encryption
    even encrypts the filesystem and operating system files so everything is secure.
    BitLocker Drive Encryption is the most secure Windows security option. This feature
    is ideal for laptop owners who have sensitive data on their drives as well as
    desktop users who can’t risk their information getting into the wrong hands.


    BitLocker Drive Encryption works by encrypting the entire partition, including
    the filesystem, with a 256-bit encryption algorithm. Using a Trusted Platform
    Module (TPM) chip, USB thumb drive, or a typed-in passphrase, BitLocker protects
    your encrypted partition. When you boot up your computer, BitLocker starts to
    load from a small unencrypted partition, prompting you to insert your USB key
    or passcode to begin booting Windows 8. If everything checks out, BitLocker unseals
    the encrypted partition and starts running the normal boot code. Failure to insert
    the USB key or correct passcode results in a failure and even an inability to
    boot Windows.


    Using BitLocker Drive Encryption in Windows Vista is very difficult. The user
    needs to partition the drive in a specific format before Windows is even installed
    to use the feature. Windows 8 integrated the Windows Vista drive preparation tool
    so now you don’t need to reinstall Windows to enable BitLocker.


    # Hardware Requirements


    For the most secure setup, BitLocker Drive Encryption requires either a TPM chip
    version 1.2 or newer built into your computer. It is possible to set up BitLocker
    Drive Encryption on a computer without using a TPM device or a USB drive, but
    your only source of protection is a passcode and the physical USB drive.


    # Enabling BitLocker Drive Encryption


    > > **TIP**  If your computer does not have a compatible TPM chip, you can still
    use BitLocker Drive Encryption with a USB storage device. However, Microsoft has
    recently decided to hide this option from users. A local group policy change must
    be made to turn this option back on. Open the Start screen, type `gpedit.msc`,
    and hit Enter. When the Group Policy editor has loaded, navigate through Computer
    Configuration, Administrative Templates, Windows Components, BitLocker Drive Encryption,
    and Operating System Drives. Right-click *Require Additional Authentication At
    Startup* and click Edit. Click the Enabled option and hit OK. You can now use
    a USB storage device with BitLocker Drive Encryption again.'
  merge: -1
  img_proc: true
- pgno: 356
  md: 'Using BitLocker Drive Encryption is easy when you have your hard drive configured
    properly and have reinstalled Windows 8. Just follow these steps to get BitLocker
    up and running:


    +   1. Open the Start screen, type in **BitLocker**, change the filter to Settings,
    and hit Enter.

    2. If your computer is configured properly, you should see a Turn on BitLocker
    link, as shown in Figure 18-13, next to your operating system drive. Click that
    link now. If your computer does not have a TPM device, make sure you follow the
    instructions in the tip.

    3. Select the type of device you will be using to protect your computer and follow
    the on-screen steps for your method of protection.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_356_0.png)


    After you complete all the steps the wizard guides you through, your computer
    begins encrypting the hard drive automatically.


    Congratulations, your computer is now even more secure. Keep in mind that you
    need to insert your USB drive every time you want to boot your computer if you
    choose the non-TPM option. Failure to insert it will result in your computer not
    booting. Make sure that you keep your emergency recovery passcode and your USB
    drive stored in a safe place.'
  merge: -1
  img_proc: true
- pgno: 357
  md: 'If you want to fine-tune the BitLocker settings, you can find dozens of group
    policy settings by opening the Start screen, typing in **gpedit.msc**, and hitting
    Enter. Then navigate through Computer Configuration, Administrative Templates,
    Windows Components, and BitLocker Drive Encryption.


    # Enabling BitLocker To Go Drive Encryption


    Just about every computer user I know has a number of USB storage devices for
    moving and sharing files. With the storage size of USB flash devices skyrocketing
    and the amount of data users store on the small, easy-to-lose devices increasing,
    the need to protect your data is becoming critical. Many users have all their
    personal documents stored on a tiny USB storage device. What would happen if you
    lost one of your drives? Anyone who finds it can plug it into their computer and
    have full access to all your private data.


    Thankfully, Microsoft has addressed this issue in Windows 8 with a new version
    of BitLocker Drive Encryption designed for USB storage devices called BitLocker
    To Go. The portable version of BitLocker provides a very simple but effective
    way to protect your data with encryption.


    Best of all, BitLocker To Go is compatible with all versions of Windows. Just
    take your encrypted USB storage device to any other Windows 8 computer and you
    will be prompted for the device password. After you enter the password you have
    full read and write access to your drive. If you use your device on older versions
    of Windows, a special program launches, asks for your password, and then provides
    you with read-only access to your files.


    Enabling BitLocker To Go is the easiest of all the security features:


    +   1. Open File Explorer to all drives on your PC.

    2. Locate and right-click your USB drive and click **Turn On BitLocker**.

    3. Check the box to use a password to unlock the drive as shown in Figure 18-14.

    4. Enter your password twice and click Next.

    5. Save the recovery key to your Microsoft account, or to a file, or print it.
    Then click Next.

    6. Select **Encrypt Used Disk Space Only** if the USB drive is brand new. Selecting
    **Encrypt Entire Drive** if you ever had previous data on the drive prevents the
    old deleted data from ever being recovered.

    7. Click Next and then click **Start Encrypting**.'
  merge: -1
  img_proc: true
- pgno: 358
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_358_0.png)


    Figure 18-14: Configure BitLocker To Go with a password.


    # Summary


    This chapter is about making what Microsoft is calling “the most secure operating
    system ever released” even more secure. First, I talked about active ways to protect
    your computer by keeping up on the latest news and trends and making sure that
    your computer is up to date on the latest security patches. Then I showed you
    how to configure User Account Control in a way that balances usability and security
    by creating a separate configuration administration account while running as a
    standard user the majority of the time. Finally, I covered the two different types
    of encryption available in Windows 8: file level and drive level with BitLocker
    Drive Encryption.


    The next chapter builds on the secure foundation this chapter created by showing
    you how to protect your computer from attackers getting in over the Internet.
    I show you how you can configure hidden firewall settings to turn on the two-way
    firewall that is normally turned off. Then I go over the latest tools to fight
    spyware and viruses.'
  merge: -1
  img_proc: true
