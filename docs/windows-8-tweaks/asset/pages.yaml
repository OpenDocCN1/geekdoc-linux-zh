    # Disabling Services with the Services Utility


    Now that you have an understanding of the dozens of services in Windows 8, you
    can start disabling the unnecessary services that are slowing down your computer
    boot process and consuming unnecessary resources. To do this, you use the Services
    utility that enables you to start, stop, and configure Windows 8 services.


    > TIP Before you begin changing your service setup, set a system restore point—a
    configuration where you can easily restore your system. However, be careful when
    you restore from restore points. Any applications or files that were created after
    the system restore point will be deleted when reverting back to an earlier restore
    point.


    The Services utility is included in all versions of Windows 8, but is hidden away.
    Disabling a service with the Services utility is easy. Just complete the following
    steps:


    +   1. Open the Start screen, type services.msc, and press Enter. This starts
    the Services utility, shown in Figure 13-8.

    2. The Services utility displays a list of all the services available on your
    computer and the ones that are started. Before you can disable a service from
    starting up, it is best to stop it first. Scroll through the list of services
    until you find the name of the one you want to disable. Right-click the service
    name and click Stop.'
  merge: -1
  img_proc: true
- pgno: 257
  md: '+   3. When the service is stopped, right-click the service again and select
    Properties. On the General tab, look for the Startup Type drop-down box. Click
    the arrow on the drop-down box and select Disabled.

    4. Click OK. From now on, the system will not start the service during boot, which
    should speed up your system start.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_257_0.png)


    Figure 13-8: Use the Services utility to disable unnecessary services.


    If you experience unusual behavior or issues with applications on your PC after
    disabling services, all changes made in this section can be easily reversed. Use
    the Services utility again and re-enable any service that you disabled. Alternatively,
    you can restore a system restore point from an earlier time period.


    # Bare-Bones Service Configuration


    To get the maximum performance out of your system, you have the option of disabling
    all the services on your computer that are not critical to the system. This will
    take away a lot of the core features and conveniences of Windows, but you will
    have a much faster machine if you can live without them. The following is a list
    of all services that started by default in Windows 8 and can be safely disabled:


    +   Application Experience

    Application Information'
