- pgno: 227
  md: '# ## Summary


    This chapter offered an introduction to the world of performance monitoring and
    benchmarking. Before you can make your computer faster, it is very helpful to
    know what your computer doesn’t perform well with. This chapter showed you how
    to discover bottlenecks using applications such as the Resource Monitor, Performance
    Monitor, Event Viewer, Task Manager, Windows Experience Index, and PCMark 7. Use
    the information that you gained in this chapter in the upcoming chapters. For
    example, if you have a lot of applications that are using a ton of memory, pay
    close attention to recommended applications and services to disable in the upcoming
    chapters.


    The next chapter shows you how to optimize the speed of your computer from the
    very beginning—at the system boot.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# CHAPTER 13


    # Speeding Up the System Boot


    With the exception of Windows Vista, the boot speed has improved with every version
    of Windows. With modern hardware and the right configuration, your Windows 8 PC
    can boot up within seconds.


    This chapter shows you some tips and tweaks you can use to improve the boot performance
    further. It also shows you how to focus on reducing the workload put on your hardware
    and ways to improve the reading of data from your storage device.


    # Working with the BIOS


    Every personal computer has a system BIOS (basic input/output system), which is
    what takes control of your computer the moment you turn it on. The screen that
    you first see when you turn on your computer is called the *power on self-test*,
    better known as the *POST screen*. If you purchased your computer from one of
    the major computer manufacturers, this screen is often hidden by the manufacturer’s
    logo. To get rid of this logo from the screen, just press the Esc button on your
    keyboard; you’ll then see what is going on in the background. At this stage in
    the system boot, the BIOS is probing the hardware to test the system memory and
    other device connections. After the POST has completed, the BIOS proceeds to look
    for a device to boot from. When it finds your boot drive, it begins to load Windows.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_228_0.png)'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'The BIOS also acts as a main hardware component control panel, where low-level
    settings for all your hardware devices are made. The device boot order, port addresses,
    and feature settings such as plug and play are all located in the BIOS setup screens.
    For example, if you want to change the order of the drives that your computer
    checks to boot from, you want to modify the device boot order. I have to modify
    this setting almost every time I install Windows, because I want my computer to
    boot off the CD-ROM to launch the install DVD instead of booting of the operating
    system on my hard drive.


    BIOSes typically are unique for each PC model and vendor. Some PCs come with a
    newer version of BIOS called UEFI that is more efficient but managed the same
    way. Accessing the BIOS on a PC is also unique to each PC vendor. Nevertheless,
    the most common way to access the setup screen is to press F1, F2, or the Delete
    key when the POST screen is displayed. Some computers even tell you which key
    to press to access the setup screen, as my notebook does. If your PC doesn’t allow
    you to access the setup screen in this way, consult your computer documentation
    or contact your computer manufacturer for instructions.


    > **NOTE** While you are making changes in the system BIOS, make sure you do not
    accidentally change any other settings. If you accidentally change the value of
    a setting and do not know what to change it back to, just exit the BIOS setup
    screen as the on-screen directions indicate and select Do Not Save Changes. Then
    just reboot and re-enter the setup screen and continue hacking away at your system.


    # # Changing the Boot Order of Your Drives


    Most computers are set up so that when you first turn them on, they check to see
    whether to boot from drives other than your hard drive. The BIOS automatically
    checks to see whether you have a bootable disc in your CD/DVD drive. Then, after
    it has checked all possible locations for a boot disk, the system defaults to
    your hard drive set in the BIOS and starts booting Windows.


    What is the benefit of changing the boot order of your system devices? If you
    modify the order of the boot devices so that the hard disk with Windows installed
    is searched first by the BIOS, the system does not have to waste time checking
    other devices for boot records. Just by changing the order of the devices, you
    can shave anywhere from one to several seconds off your boot time, depending on
    the speed of your hardware and number of drives your system has installed.


    To change the boot order (or sequence, as some call it), you have to enter the
    system BIOS setup screen that was mentioned previously:


    +   1. Press F1, F2, F8, Delete, or the correct key for your specific system on
    the POST screen (or the screen that displays the computer manufacturer’s logo)
    to enter the BIOS setup screen.

    2. Look for where it says Boot, and open the submenu.'
  merge: -1
  img_proc: true
- pgno: 230
  md: '3. Select Boot Sequence, and press Enter. Figure 13-1 shows an example of the
    Boot Sequence Setup screen.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_230_0.png)


    4. If your screen looks similar to Figure 13-1, you are in the right place. Navigate
    to First Device and cycle through the list to Hard Disk Drive or, on some computers,
    the port your hard drive is connected to, such as IDE0 or “SATA0.” If your setup
    screen does not specifically offer First Device, but instead lists all the devices,
    simply select the hard disk and move it to the top of the list by using the Change
    Values keys (which for my BIOS is made by Phoenix—the spacebar moves an item up
    and the minus symbol key moves an item down). The specific keys differ on almost
    every system, but the basic concepts are the same. You want to get your hard disk
    to the top of the list or listed as the first device from which to try to boot.
    If you do not know the keys for your BIOS, instructions are usually located on
    either the bottom or right side of the screen where you will be able to find the
    correct keys for your system.


    5. After you have made the changes, exit the system BIOS by pressing the Escape
    (Esc) key, and make sure that you select to save your changes upon exit. After
    you reboot, the new settings will be in effect.


    What are the consequences of changing the boot order? Changing the boot order
    won’t hurt your system in any way if you do it correctly. If, by accident, you
    remove your hard drive from the list and save the BIOS settings, you get'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'an unpleasant surprise when your computer reboots and tells you that it cannot
    find any operating system. If you happen to get that message, don''t worry; you
    did not just erase your operating system. Just reboot by pressing Ctrl+Alt+Delete
    at the same time, go back into the BIOS settings, and make sure that you select
    your hard drive as a boot device. After you have done that, your system will be
    back to normal.


    Another possible issue that you might encounter is just a matter of inconvenience.
    After you change the boot order of the system devices so that the hard drive is
    listed first, you can no longer use system restore boot discs. If something has
    happened to your computer and you need to boot off of those drives to restore
    your system or run diagnostics, just go back to the system BIOS and lower or remove
    the hard disk from the first boot device and replace it with a CD as needed.


    # ## Using the Quick Boot Feature of the BIOS


    All systems initialize in more or less the same way. During the POST mentioned
    earlier, the BIOS checks the hardware devices and counts the system memory. Out
    of all the different types of system memory, the *random access memory*, better
    known as RAM, takes the longest to check. On a machine that has large amounts
    of RAM, this calculation can take several seconds. For example, a machine that
    has 4 GB of RAM may take up to three seconds just to check the memory. On top
    of the RAM counting, your computer needs to perform a few other tests to make
    sure that all the hardware is working properly.


    The complete version of these tests is not needed every time you boot, and you
    can turn them off to save time. Most system BIOSs offer a feature called *Quick
    Boot*. This feature enables the user to turn off the full version of the test
    and sometimes enables you to run a shorter quick-check test instead. Other BIOSs
    allow you to turn off the Memory Check only, which still saves a lot of time.


    To turn on the Quick Boot feature or to turn off the Memory Check, do the following:


    +   1. Enter the system BIOS by pressing F1, F2, Delete, the Enter key, or the
    correct system setup key on the POST screen for your system.

    2. After you are in the BIOS setup, locate the Quick Boot or Memory Check option,
    as shown in Figure 13-2. Navigate with the arrow keys until the option is highlighted.'
  merge: -1
  img_proc: true
- pgno: 232
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_232_0.png)


    Figure 13-2: The BIOS Setup screen displays the Quick Boot feature.


    +   3. Use the Change Value keys to cycle through the options and select Enable
    for the Quick Boot feature or Disable if your system’s BIOS has the Memory Check
    feature.


    +   4. After you have made the change to the setting, exit the system BIOS by
    pressing the Escape key. Make sure you save the changes upon exit.


    Using the Quick Boot feature or disabling the Memory Check won’t do any harm to
    your system. In fact, some computer manufacturers even ship their computers with
    these settings already optimized for performance. The only downside to disabling
    the tests is in the rare situation in which your RAM self-destructs; the BIOS
    won’t catch it, and you might receive errors from the operating system or your
    system could become unstable. If you notice that your system becomes unstable
    and crashes frequently or won’t boot, go back into the BIOS and re-enable the
    tests to find out whether your system’s memory is causing the problems.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# Modifying the Operating System Boot


    You can use several different tricks to shave a few more seconds off the boot
    time. For example, you can reduce Timeout values and slim down the system to get
    rid of all the extra features and services that you do not use or need. Check
    out the following ways to do so.


    # Windows Boot Manager


    If you have more than one operating system installed on your computer, you have
    to deal with the Windows Boot Manager installed by Windows 8. By default, the
    Windows Boot Manager gives you 30 seconds to select an operating system before
    it reverts to the default operating system. The only way not to wait 30 seconds
    is to select the operating system you want to use right away. If you use one operating
    system the majority of the time, you will definitely save time if you set that
    operating system as the default and lower the Timeout value to 1 or 2 seconds.
    That way, you won''t have to select an operating system every time you turn on
    your system or wait 30 seconds before your computer actually starts to load the
    operating system.


    > **TIP** Before you make any changes to the Windows Boot Manager (WBM), it is
    a good idea to back it up using the Boot Configuration Data Editor (bcdedit.exe)
    so that you can easily revert to an earlier version should you have any problems.
    At a command prompt run as the Administrator account, type `bcdedit /export "C:\Backup
    File"`. This saves the WBM to a file that you can use to import using the `/import`
    flag.


    # Lowering OS Timeout Values


    If you have multiple operating systems installed on your computer and the Windows
    Boot Manager is installed, the default selection timeout is often way too high.
    It is much better to set a lower timeout so that if you do not make a selection,
    it quickly reverts to the default OS, making your boot time much faster.


    Changing the Timeout value is simple with the System Configuration utility. Follow
    the steps here to use the System Configuration utility to lower the OS Timeout
    value:


    +   1. Open the Start screen, type **msconfig**, and press Enter.

    2. When the System Configuration utility loads, click the Boot tab.

    3. Locate the Timeout box and replace 30 with a much lower value, as shown in
    Figure 13-3.'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'I recommend you use between 2 and 5. I use 2 because that gives me just the
    right amount of time to hit a key on my keyboard when the Windows Boot Manager
    is displayed on the screen.


    +   4. After the value has been updated, click OK to exit.


    Now that the Timeout value has been updated, the boot menu no longer increases
    your system startup time. Even though this is a simple tip, it really helps a
    lot on systems that have multiple operating systems installed. The default operating
    system on the Windows Boot Manager can be set in the next section.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_234_0.png)


    **Figure 13-3**: Use the System Configuration utility to set the Boot menu Timeout
    value.


    # Setting the Default OS


    In the preceding section, you learned to set a new Timeout value that cuts down
    on the amount of time that is wasted before the operating system starts to load.
    That works great when your primary operating system is the default; but if it
    is not, you must remember to hit a key at the right moment every single boot.
    There is a much better way to handle the situation. Just make your primary operating
    system the default operating system in the Windows Boot Manager. This allows you
    to benefit from the lower Timeout value and speed up the overall boot time.'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'You can the set default operating system using the System Configuration utility
    or the command-line Boot Configuration Editor, bcdedit.exe. Follow these steps
    to use the System Configuration utility:


    +   1. Open the Start screen, type msconfig, and hit Enter.

    2. Click the Boot tab.

    3. Select the operating system from the list you want to make the default and
    then click the Set As Default button.

    4. When you are finished, click OK.


    Using the System Configuration utility is the easiest way to set the default operating
    system, but you can also set it with the bcdedit.exe utility. Follow the next
    steps to use the Boot Configuration Editor to set the default operating system:


    +   1. Open the Start screen, and type Command Prompt.

    2. Right-click on the Command Prompt shortcut at the top right.

    3. Select Run As Administrator from the charm application bar on the bottom of
    the screen.

    4. When the command prompt has loaded, you are ready to use the bcdedit.exe command.
    First, you need to get the ID of the operating system that you want to set as
    the default. To do this, type bcdedit /enum all in the open Command Prompt window.
    Scroll through the list of entries and look for Windows 8.

    5. After you have found the correct entry, note its identifier. You use this in
    the next step.

    6. At the command prompt, type bcdedit /default (entry identifier). For example,
    I ran bcdedit /default {b2721d73-1db4-4c62-bf78-c548a880142d} .


    The default operating system on the Windows Boot Manager is now set. The next
    time you reboot, your changes will be applied.


    > **TIP** The Boot Configuration Editor is a powerful utility that you can also
    use to change many other settings of the Windows Boot Manager. Experiment with
    bcdedit.exe by running bcdedit /? from the command prompt. This shows you all
    the other available options and flags that you can use with the Boot Configuration
    Editor.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# USING EASYBCD TO EDIT THE WINDOWS BOOT MANAGER


    EasyBCD is a cool and easy-to-use front end to the Boot Configuration Editor.
    Instead of using the command-line interface, you can use this free utility by
    NeoSmart Technologies. With EasyBCD, you can change the Timeout value, default
    selection, description, and even the boot order, as shown in Figure 13-4. Download
    a free copy of EasyBCD at http://tweaks.com/887200.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_236_0.png)


    # Disabling the System Boot Screen


    Windows 8 has a new high-resolution animated boot screen that looks much better
    than the previous Windows boot screens. The flag animation sure is a nice loading
    screen, but is it really worth an extra fraction of a second when your computer
    is loading? Disabling the boot screen can cut down on your boot time. Keep in
    mind that every fraction of a second counts.'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'This performance improvement works on a simple principle. It takes time for
    the computer to do anything. Taking away some work the hardware has to do, such
    as loading the boot screen, frees up time that it can spend loading your system
    files instead.


    The process for disabling the system boot screen is similar to the process for
    modifying the default operating system timeout. For this change, you need to start
    up the System Configuration tool:


    +   1. Open the Start screen, type **msconfig**, and press Enter.


    +   2. When the System Configuration tool loads, click the **Boot** tab.


    +   3. Locate the No GUI boot check box and check it, as shown in Figure 13-5.


    +   4. Click **OK** to close the System Configuration tool.


    +   5. A small window pops up and asks you whether you would like to reboot your
    computer now or later. Make sure you have any open documents closed, and click
    **Restart**.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_237_0.png)


    **Figure 13-5:** Disable the boot screen with the System Configuration tool.


    +   6. After your computer has restarted, the System Configuration tool may load
    automatically, notifying you of the change. Check the box that says Don''t Show
    This Message Or Start System Configuration When Windows Starts and click **OK**.


    After you close the System Configuration tool and reboot, the boot screen is gone.
    You have saved your computer from doing extra work while loading Windows 8 on
    your computer.'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# Disabling Unneeded Hardware Devices


    One of the most time-consuming portions of the boot is loading all the hardware
    drivers for your specific system setup. Every driver for each installed hardware
    device must be loaded and then initialized by the operating system while the system
    is starting up. Keep in mind that your computer has a lot of devices that you
    do not always use. When Windows has to load all the extra hardware on your computer,
    its performance is slowed down.


    Although Windows 8 is more intelligent than previous versions about how it loads
    drivers and devices, loading and initializing those devices still takes time.
    In previous versions of Windows, the system would load one hardware device driver
    and then load another device driver in a series. The problem with loading the
    hardware this way was that it could slow down the boot dramatically if one hardware
    device was taking a long time to initialize.


    Windows 8 is similar to Windows Vista in the way it loads device drivers and initializes
    the devices. Instead of loading the hardware device drivers in a series, it now
    loads some of them in parallel. This allows the boot to be much faster. Although
    the hardware devices are loaded in parallel instead of in a series, the addition
    of more devices that the system has to load drivers for has the potential to,
    and most likely still, slows down the boot.


    # Using Device Manager to Disable Hardware


    Getting rid of extra hardware with Device Manager is an easy way to speed up your
    boot. Follow these steps to disable your extra hardware devices:


    +   1. Open the Start screen, type **devmgmt.msc**, and press Enter.

    2. After the Device Manager loads, you can browse through devices connected and
    currently running or disabled by browsing through the device type sections. To
    disable a device, right-click the device name and click Disable.

    3. To re-enable a device, right-click the device name and click Enable, as shown
    in Figure 13-6. This removes the check mark from the menu and re-enables the device.


    **TIP** To determine the status of a device, check out the icon next to its name.
    All devices that are disabled have a down arrow over the icon. All devices that
    have a question mark or an exclamation point on them are not set up correctly
    or are having problems. All devices with none of these additions to the icon are
    running—and doing so without any problems.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_239_0.png)


    **Figure 13-6**: You can re-enable hardware previously disabled with Device Manager.


    # Which Hardware Devices Should I Disable?


    Each person uses (or doesn’t use) devices differently depending on the system
    setup. Nonetheless, some classes of devices are more commonly disabled than others.
    Knowing which ones will help you make your decision as to which devices you should
    disable. The following classes of devices are frequently disabled:


    +   - **Network adapters**—Especially on notebook computers, there is often more
    than one network device. Disabling the network devices that you do not use will
    definitely save you some booting time.


    +   - **FireWire**—If you have 1394 connections, otherwise known as FireWire,
    you might consider disabling them. Unless you are using your FireWire port to
    connect your digital video recorder to your computer, or have other external FireWire
    devices, you have no need to have this device enabled.


    +   - **Biometrics**—Some of the latest computer hardware includes biometric sensor
    equipment such as a fingerprint scanner. If you do not use these security features,
    you can save time by disabling these devices, too.


    +   - **Modems**—Do you have a broadband connection? If so, consider disabling
    your modem. If you rarely use it, why not disable it? If you ever need to use
    it again, just re-enable it.'
  merge: -1
  img_proc: true
- pgno: 240
  md: '■ TPM security chips—Does your computer have a Trusted Platform Module (TPM)?
    These chips are typically used as a secure place to store an encryption key that
    would be used for something such as hard drive encryption. If you are not using
    any of these advanced security features of Windows 8, disable these devices, too.


    ■ Multimedia devices—Your computer has lots of multimedia devices. Take a look
    at the Sound, Video, and Game Controllers section in Device Manager. You will
    find a lot of device drivers that are loaded during your boot. Some are used by
    all users, but you will find a few that you do not use. For example, I do not
    use my game port or my MIDI device, so I disabled both of them.


    CAUTION Do not disable any hardware devices located under the Disk Drives, Computer,
    Display Adapters, IDE Disk Controllers, and the System sections (except for the
    system speaker). These hardware devices are critical to the operation of your
    system.


    # Removing Extra Fonts for Speed


    Windows 8 has about 140 fonts and variations that it loads for use when the system
    boots up. Of these fonts, only a handful are used on a regular basis. Every single
    font that Windows loads increases the amount of time the operating system takes
    to boot. If you are like me and have installed one of those font CDs that add
    hundreds of additional fonts to your system, your computer won’t boot up as fast
    as it once did. Simply put, systems with a lot of fonts take more time to load
    because the system has to load and index each font. Thankfully, there is a very
    simple solution to this: just remove the fonts that you do not use from your font
    directory.


    You can go about removing the unneeded fonts from your font directory in a number
    of ways. The best way is to move the unused fonts to a separate folder on your
    system so that if you ever want to use one of those fonts, you just have to copy
    it to the Fonts folder.


    CAUTION When you remove fonts from your computer, you will no longer be able to
    use them in any software application, including Adobe Photoshop, Microsoft Word,
    and Excel.


    Before you start removing fonts, take a look at Table 13-1. These fonts are commonly
    used, for reasons that the table explains. Be careful not to remove any fonts
    on which the system normally depends.'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'Table 13-1: Commonly Used Windows Fonts


    | FONT NAME | REASON |

    | --- | --- |

    | Segoe | The variations of this font can be found in elements of the Windows
    interface. |

    | Calibri | Common font used in Microsoft Office applications and documents. |

    | Verdana | This font is often used on web pages and applications. |

    | Arial | Another common web page font that is also used in applications. |

    | Trebuchet | Common application font and used in some web pages back in XP days.
    Some older applications may still require it. |

    | Tahoma | Common Windows font that you may want to hold onto for application
    and web page compatibility. |

    | Times New Roman | Default font for web pages and word processing applications
    such as Microsoft Word. |

    | MS Sans Serif | Default font for Visual Studio applications that is now required
    for a lot of legacy and newer applications. |


    Now that you know which fonts you should not remove, you also need to be aware
    of one more thing before starting your adventure in the Fonts folder. Inside the
    Fonts folder are several fonts with similar names. The fonts are broken up not
    only by font name, but also by the type style. For example, there is an Arial
    Bold, Arial Bold Italic, Arial Italic, and so on. When sorting through the fonts
    to delete, you also can choose to delete only specific types of fonts.


    Permanently deleting fonts is fairly easy, but moving the fonts to a backup folder
    is a little trickier because the Fonts folder is not like a normal folder. To
    remove the fonts, you need to start by creating a folder to put the old fonts
    in:


    +   1. Open the Start screen and then run File Explorer. Navigate to the Local
    Disk (C:) or where you have installed Windows.


    +   2. Navigate to the Windows folder and create a folder to store the fonts that
    you are going to remove from the Fonts folder. Right-click the whitespace that
    lists the folder and files, select New, and then select Folder. Call your folder
    **Fonts Backup** or some other name so that you can identify it as the place that
    your old fonts are.


    +   3. After you have created the new folder, open it.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '+   4. Without closing the new folder you just opened, Open the Start screen
    again and then run File Explorer. Navigate to the Local Disk (C:) drive again
    and to the Windows folder, and then to the Fonts folder.


    +   5. Now that you have both the Fonts folder and your backup folder open, arrange
    the two windows on your screen so that they look like the two windows in Figure
    13-7.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_242_0.png)


    Figure 13-7: Arrange the Windows Fonts folder and a backup folder side by side
    on the screen.


    +   6. Now that the two font folders are side by side, drag the fonts you want
    to back up to your backup folder.


    +   7. After you have backed up the fonts you want to delete, right-click the
    font files in the Fonts folder and click Delete.


    In the event that you want to reinstall a font, all you have to do is drag the
    font file from the backup folder back to the Fonts folder. An Installation dialog
    box flashes on the screen as it adds the font back to the library. After you drag
    the file back to the Fonts folder, the file remains in the backup directory because
    it just copies it there. After you have confirmed that it was actually installed,
    feel free to delete the font file from the backup folder.'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# Disabling Unneeded Services


    A service is a software application that runs continuously in the background while
    your computer is on. The Windows operating system has numerous services that run
    in the background that provide basic functions to the system. Network connectivity,
    visual support, and external device connectivity such as printer services are
    all examples of the types of services that the Windows services provide. Each
    service that is running in the background takes up system resources, such as memory
    and CPU time. Also, during the booting of the operating system, the service has
    to be loaded. On most computers, nearly 20 services are loaded upon startup. Of
    these 20 services, only a handful are system critical services; all the others
    can be disabled.


    Disabling a service can disable a feature that you or applications installed on
    your PC depend on so it is important to know what the services in Windows 8 do.
    Table 13-2 will help you understand what the most common services are, what they
    do, and whether they can be disabled.


    Table 13-2: Common Windows Services in Use


    | NAME | USE |

    | --- | --- |

    | ActiveX Installer | Provides UAC validations for Internet-based ActiveX installs.
    This only runs when needed. |

    | Application Experience | Provides a compatibility cache for older applications
    that caches requests when they are run. This service can be disabled, but I recommend
    leaving it started for application compatibility with the new architecture of
    Windows 8. |

    | Application Identity | Verifies the identity of an application. Used by AppLocker.
    Does not run unless AppLocker is in use. |

    | Application Information | Allows you to run applications with all administrative
    rights. Keep this service running. |

    | Application Layer Gateway | Provides support for additional protocols for the
    Internet Connection Sharing service. You can safely disable this service. |

    | Application Management | Used for software deployment and management through
    Group Policy. If you do not use Group Policy for software, you can safely disable
    this service. |

    | Background Intelligent Transfer | Transfers data in the background when the
    connection is not in use. One use of this service is to download updates automatically
    in the background. This service is not system critical, but disabling it can impair
    other services such as Windows Update. I would keep this service enabled. |'
  merge: -1
  img_proc: true
