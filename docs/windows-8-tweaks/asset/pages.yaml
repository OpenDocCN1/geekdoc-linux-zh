    # # Understanding Blue Screens


    Problems with Windows 8 do not get any more severe than when you experience a
    complete operating system crash resulting in the classic Windows blue screen.
    Typically caused by a device driver or hardware failure, blue screens contain
    very little useful information. Windows 8 includes a redesigned blue screen that
    displays even less information. However, that is not a bad thing because all of
    the valuable information is located in a special dump file that you can use to
    figure out exactly what happened.


    Every time a blue screen happens, Windows can dump the contents of memory to a
    file so that you can analyze it using various tools or even Microsoft support.
    In this section I show you an easy way to analyze the crash dump file to identify
    the source of your problem. First, make sure your system is configured to save
    a dump file.


    # ## Adjusting Recovery Settings


    Before you can analyze blue screen dump files, you need to verify your PC is configured
    to create them when a blue screen event occurs. These settings are hidden away
    in the Startup And Recovery section in System Properties. Follow these steps to
    validate your PC is properly configured:


    +   1. Open the Start screen, type sysdm.cpl, and hit Enter.


    +   2. When the System Properties window opens, click the Advanced tab.


    +   3. Under the Startup And Recovery section, click the Settings button.


    +   4. On the Startup And Recovery window in the Write Debugging Information section,
    ensure the drop-down box is set to anything except for (none). I recommend using
    Automatic Memory Dump, or if you are having problems where a memory dump file
    is not getting created, try the Small Memory Dump option.


    +   5. Click OK and you are set.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# Analyzing Blue Screens


    You can use a number of methods to analyze a memory crash dump file ranging from
    incredibly easy to insanely complex. Microsoft Support typically uses the Windows
    debugging tool call Windbg to analyze crash dumps. Windbg is a very powerful utility,
    but it is not exactly easy to use unless you have experience debugging Windows
    applications and have a good understanding of how Windows works under the covers.


    For the rest of us, the best option is to use an automated crash analysis tool
    that looks at the crash dump file and identifies what driver or system component
    caused the crash condition. For this I like using a free tool called Who Crashed.
    Follow these steps to identify the true source of your blue screen:


    +   1. Head over to tweaks.com/864162 and download the latest version of Who Crashed.
    Click the Download Free Home Edition button.

    2. Once downloaded, install and launch the utility.

    3. When Who Crashed is loaded, simply click the Analyze button.

    4. Scroll down on the Report tab to view the Crash Dump Analysis.


    There is a section for each crash dump file the utility finds. The section shows
    you what file caused the crash and even what product the file belongs to if it
    is a driver.


    The vast majority of Windows blue screens are caused by poorly written device
    drivers that experience a condition they were not expecting, such as a hardware
    failure or a programming mistake. Blue screens that appear to be from the kernel
    of the operating system, such as ntoskrnl.exe, are typically wrong. The kernel
    very rarely crashes on its own. Crashes typically have an environmental cause
    such as failing hardware or possibly a corrupt system file.


    # Using Task Manager


    The Windows Task Manager is a critical part of Windows that makes it possible
    for users to have full control over what their system is doing. Providing the
    capability to monitor individual programs and control any program or process,
    Task Manager is useful. No special software must be installed to use Task Manager;
    just press Ctrl+Alt+Del and then click Start Task Manager. You can also press
    Ctrl+Shift+Esc or open the Start screen, type taskmgr in the Search box, and then
    press Enter.


    After Windows Task Manager has started, you see the new simplified process view.
    This is nice for new users but not for anyone that is reading this book.'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'Click More Details to view the full version of Task Manager. Tabs list processes,
    CPU performance, Windows Store app history, startup applications, active users,
    process details, and services. As you can tell, the new Task Manager in Windows
    8 includes a significant amount of content and graphical updates.


    # ### Monitoring Processes


    Of all the applications on the computer that are running under your account, you
    can find those that are hidden and those that are not on the list on the Processes
    tab. On this list, you can see how much memory, CPU, Disk, and Network each process
    is using. Click the column headings to sort the rows numerically or alphabetically.


    The Processes tab has many useful columns:


    +   ■  The **Name** column shows the name of the process.


    ■  **Status** shows if a Windows Store app is suspended.


    ■  **CPU** shows what percentage of the CPU the process is using.


    ■  **Memory** shows the total amount of reserved memory a process is using.


    ■  **Disk** displays how fast the process is reading and writing to disks.


    ■  **Network** displays how fast the process is sending and receiving data over
    your network devices.


    If you find a process that is taking up a lot of your memory or eating up a big
    portion of your CPU, you might want to consider ending the process if it is not
    a critical one. Ending a process is very easy. Just select the row of the process
    you want to end, and click the End Process button.


    # ### Viewing Performance Data


    The Performance tab, shown in Figure 12-12, provides a lot of the same information
    that the Resource Monitor application shows. This tab is another place to view
    memory, disk, and network information, but in a cumulative and more detailed manner.


    You can see total utilization and some historical data for your CPU, Memory, and
    each disk and network adapter.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_222_0.png)


    # Configuring Task Manager to Display CPU Utilization


    When Windows Task Manager is started, a small histogram detailing the CPU utilization
    displays in the system tray. This little feature can be very useful if you always
    like to keep an eye on your CPU utilization but do not want Task Manager on top
    of all your windows. With a little bit of work, it is possible to start up the
    Windows Task Manager automatically on every start and run it minimized and hidden
    from the taskbar except for the system tray:


    +   1.  Open File Explorer and browse to `C:\Users\USERNAME\AppData\Roaming\Microsoft\Windows\Start
    Menu\Programs\Startup`. Replace `USERNAME` with your user name. Any shortcuts
    that you place in this folder load automatically when Windows starts.

    2.  Right-click in the open white space of the startup folder, select New, and
    then navigate to Shortcut.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '+   3.  When the New Shortcut Wizard loads, type **taskmgr.exe** in the text
    box asking for the location of the file, and then click Next.


    +   4.  Type a name for the shortcut and click Finish.


    +   5.  The startup folder displays again with a new icon for Task Manager. To
    start Task Manager minimized, right-click the new icon and select Properties.


    +   6.  Change the Run type where it says Normal Window to Minimized, and then
    click OK.


    +   7.  The shortcut is set up. However, there is one last change to make, and
    you need to open up Task Manager to make it. After Windows Task Manager is open,
    click the Options menu bar item and select Hide When Minimized so that when the
    program starts, only the CPU histogram is displayed; the program doesn''t appear
    on the taskbar.


    Your system is now configured to start the CPU meter on every boot in the system
    tray. Should you change your mind at a later time and no longer want the Task
    Manager CPU meter to show up, simply delete the shortcut from the startup folder.


    You may need to drag the Task Manager chart icon out of the system tray overflow
    area onto the main system tray area near the clock to be able to view it.


    # Benchmarking Your System


    The term *benchmarking* refers to testing your computer and assigning some sort
    of score to your computer''s performance. The score can be an amount of time,
    such as the amount of time it takes your computer to solve a complex math problem.
    The score can also be a calculated point value that is determined by running a
    variety of tests, such as hard drive transfer speeds. The test can read and write
    files to your hard drive and then calculate a weighted score depending on how
    each test goes. The amount of time or calculated point value has very little value
    on its own; it is when the time or point value is compared to other results of
    the same test that it becomes valuable.


    It is important to get an initial benchmark score for your computer so that you
    can compare your computer''s initial performance to benchmark scores from tests
    that you may run later. It is nice to know how much of a difference some of the
    tweaks in this book actually made in your system. Or, if you upgraded the amount
    of RAM it would be helpful to see how it affected your system performance. Running
    an initial benchmark gives you a score that you can compare all your benchmark
    scores to after you make changes to your computer.


    To benchmark your system, you need the help of a benchmarking application. A wide
    variety of different software programs can benchmark just about every part of
    your system. If you are interested in benchmarking the abilities of your'
  merge: -1
  img_proc: true
- pgno: 224
  md: '3-D video card, for example, there is software for that. If you are interested
    in benchmarking your hard disk speeds, there is special software for that task
    as well. Next, I go over three popular benchmarking applications. I start with
    the built-in Windows Experience Index.


    # Windows Experience Index


    Microsoft included this feature in Windows 8 to make it easier for consumers to
    understand how powerful the combination of their hardware components actually
    is. The performance rating application generates an overall score based on the
    performance and features of your CPU, RAM, hard drive, and graphics card. For
    example, my computer has been given a score of 5.1 (see Figure 12-13). In addition
    to the overall score, you are also provided with individual component scores called
    the Sub Rating. These scores give you a quick idea of the overall performance
    of your computer compared to other configurations.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_224_0.png)


    **Figure 12-13:** Windows Experience Index gives you a performance overview.


    The exact method of scoring different hardware components is unknown, but is based
    on support of different levels of features and the performance of your hardware.
    For example, to get a score of 7.9, your hardware component must support a specific
    set of features, and perform between certain levels.'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'Your computer’s overall score is useful for determining how your hardware compares
    to other configurations. However, the main purpose of the rating is to determine
    how well Windows 8 will run on your specific hardware configuration. The Sub Ratings
    are the most useful for the purpose of identifying possible bottlenecks and areas
    that you should investigate further. To get started, bring up the System window
    for your computer:


    +   Open the Start screen and type **Performance Information**.

    Change the search filter to **Settings**.

    Run **Performance Information And Tools**.

    You now see your computer’s performance rating as shown in Figure 12-13. If your
    computer does not yet have a rating assigned to it, click **Rate This Computer**
    or **Re-Run The Assessment**. This starts the rating tool. Wait a few minutes
    while it generates scores based on performance tests and hardware specifications.
    It is best not to use your computer until the tests have completed to ensure accurate
    readings.


    **TIP** If you ever change or upgrade the hardware in your computer, you should
    refresh your ratings after every change. The score will not refresh automatically.


    Now that the **Performance Information And Tools** window is loaded and populated,
    you can analyze the results. I like to see whether any of the numbers may be holding
    back the overall score. For example, if all of my Sub Ratings are between 5.7
    and 7.4, except for my Gaming graphics rating, which is a much lower 5.1, then
    it becomes very clear that I should concentrate on determining whether I should
    buy a new graphics card. The lowest score in any Sub Rating determines the overall
    score for your computer.


    Depending on your results, if you get a low score in the CPU, RAM, Hard Drive,
    or Graphics ratings, you should be able to determine what areas to focus on as
    you explore other more detailed monitoring tools in the next section.


    PCMark 7 Basic Edition, from Futuremark Corporation, is one of the most popular
    benchmarking programs for power users. PCMark 7 has a cool online component that
    enables you to view your benchmark data and compare it to other users’ computers.
    Additionally, the application generates an overall score that you can use to compare
    your system to other systems. The comprehensive score that is assigned to your
    system is the result of numerous test results testing various parts of your computer.


    You can download a copy of PCMark 7 from tweeks.com/630110.'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'The user interface of PCMark 7 is very simple and easy to use. Simply click
    the Run Benchmark button to start the tests. The free version includes only basic
    tests that simulate various computer usages to come up with your overall score.
    The basic system tests include the following:


    +   - Video Playback and Transcoding

    - Image Manipulation

    - Web Browsing and Decrypting

    - Graphics – DirectX 9

    - System Storage – Windows Defender

    - System Storage – Importing Pictures

    - System Storage – Gaming


    After you click the Run Benchmark button, the system tests begin, as shown in
    Figure 12-14.


    After the benchmark tests are completed, you are shown your system’s overall score.
    To view the detailed scores of the different tests, you have to register on Futurermark’s
    website via the link on your results window. You can find out what hardware really
    performs and what hardware you should avoid. Overall, the PCMark 7 website adds
    a great amount of value to the application.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_226_0.png)


    Figure 12-14: PCMark 7 running the benchmark test'
