    # # Removing Saved Passwords with Credential Manager


    When you visit a website that requires authentication or attempt to connect to
    remote computers, you are given the option to save your password so that the next
    time you visit the page or attempt to access a remote resource you do not have
    to re-enter your password. This feature can be a huge convenience, especially
    if you access a particular website or resource frequently. The downside to this
    convenience is the potential for horrible security and privacy problems. Essentially,
    you are taking the password off all the sites and resources for which you saved
    a password. Anyone who has physical access to your computer can get in using your
    username and password, even if they do not know your password.


    Removing your saved passwords from your computer is a very good idea because doing
    so protects your accounts. In Windows 8, you can remove saved passwords using
    the new Credential Manager.


    +   1.  Open the Start screen, type **Credential Manager**, click the Settings
    filter, and hit Enter.

    2.  All your saved accounts are listed under Web Credentials and Windows Credentials.
    Next to each listed account, click the down arrow as shown in Figure 20-10.

    3.  The account details are shown, including the option to delete the account.
    Click Remove From Vault to delete the account.

    4.  Click Yes on the verification screen.'
  merge: -1
  img_proc: true
- pgno: 395
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_395_0.png)


    Figure 20-10: Use Credential Manager to manage your account login information.


    # # Setting File and Folder Permissions


    Windows 8 runs on NTFS, which allows users to set file and folder permissions.
    These permission settings enable you to specify which users can view a particular
    file or a whole folder on your computer. In fact, file permissions in Windows
    8 are so detailed that you can even give a person the ability to read your files
    while preventing him or her from saving any changes. For the sake of privacy,
    file permissions are very helpful because they allow you to prevent other users
    from even being able to gain access to your private folders.


    Setting the permissions on files and folders is easy to do. Just follow these
    steps:


    +   1. Right-click any file or folder for which you want to modify permissions
    and click Properties.

    2. Click the Security tab and click the Advanced button.

    3. Disable inheritance by clicking the Disable Inheritance button. *Inheritance*
    means the permissions from a parent folder are automatically applied to child
    folders.

    4. Remove all users from the Permission Entries list that you do not want to have
    access to this file or folder.'
  merge: -1
  img_proc: true
- pgno: 396
  md: 'It is a good idea to remove the Everyone group because this includes everyone
    who can access your computer, including guests. Make sure that you do not accidentally
    remove your username from the list. Also be cautious removing the SYSTEM account.
    This is one account the operating system uses to access files, but can be safely
    removed unless you experience problems with a specific application or service.


    +   5. Now that you have the list of users and groups taken care of, set the specific
    permissions for each user. Select the name of one user that you want to modify,
    and then hit the Edit button. Check the corresponding boxes in the Basic Permissions
    list for the activities that you want him to be able to do, as shown in Figure
    20-11, and click OK.

    6. When you have finished setting the permissions for all the users, click OK
    to exit the permissions screen.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_396_0.png)


    **Figure 20-11:** Adjust permissions for an individual to let him read files in
    the folder, but not change them.


    After you set the permissions for all sensitive directories, you will have greatly
    increased your security and privacy. Also keep in mind that file permissions are
    inherited. Every folder within a folder inherits the permissions of the parent
    folder unless they are specifically removed. Therefore, if you set the file permissions
    for a folder, all the subfolders and files are automatically set with the same
    permissions.'
  merge: -1
  img_proc: true
- pgno: 397
  md: 'File and folder permissions can be very useful. If you have a program on your
    computer that you do not want anyone else running, simply set the permissions
    on that folder so that only you can read and execute the program.


    # ## Summary


    Throughout this chapter you found out how to increase your privacy when using
    Internet Explorer. The information that Internet Explorer leaves behind can be
    very sensitive, so I showed you how to clear your history and delete temporary
    files to protect your privacy. Then, I showed you how to configure Internet Explorer
    so it cleans up after itself when you close the browser.


    The second part of this chapter addressed the privacy concerns of the Windows
    interface. Just like Internet Explorer, Windows records many of your computer
    activities. Clearing those records is an essential part of protecting your privacy.
    First, I showed you how to remove sensitive items that may appear in Jump Lists
    on the taskbar, and then you learned ways to further protect your privacy with
    file permissions.


    You have now finished reading the last chapter of *Windows 8 Tweaks*. In Part
    I, I guided you through selecting the right version of Windows 8 and then installing
    it, along with basic tips to tweak your computer safely. In Part II, I showed
    you how to customize just about everything that can be customized in Windows 8
    to make Windows appear that it was designed just for you. In Part III, the focus
    turned to performance, and I covered tweaks that can help speed up Windows 8 on
    any computer by optimizing the various aspects of the operating system. In Part
    IV, the topic moved on to securing your computer. I showed you how to protect
    your computer from attackers, defend against spyware and viruses, and protect
    your privacy.


    Now that you have completed the final chapter, your Windows 8 experience has been
    fully personalized, optimized, and secured.'
  merge: -1
  img_proc: true
