- pgno: 76
  md: '# CHAPTER


    5


    # Customizing the Startup


    Windows 8 has a great new look, but after a while, the new look can get old. With
    the help of some cool tools and tricks, you can customize many components of Windows
    8.


    This chapter guides you through customizing the lock screen.


    You can customize this screen in several ways. For example, you can change the
    user picture and various settings that enable you to increase your privacy and
    the behavior of the lock screen. I even show you how to change the default lock
    screen and tweak the color scheme.


    # Customizing the Lock Screen


    Windows 8 includes a very different logon screen, now called the lock screen per
    Microsoft terminology. The new lock screen replaces the previously revamped screen
    in Windows Vista and the classic NT-style logon screen that many domain users
    are familiar with (because it was included in the last several releases of Windows
    up to XP).


    Windows 8 continues to use the secure logon system that first appeared in Windows
    Vista that requires all logon components to be digitally signed by Microsoft.
    If any of the logon files are modified, the digital signature is destroyed and
    you will no longer be able to log on. This prevents malicious software from hijacking
    the logon process, but it also makes it next to impossible for people'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'like us who want to customize the logon screen; you can no longer just hack
    a system file and replace some resources in it.


    The days of customizing every single element on the logon screen are over until
    someone writes an application that extends the logon screen or someone releases
    a patch that disables the digital signature requirement.


    Is this the end of customizing the logon screen? Not at all! You can still make
    a lot of useful tweaks to the logon screen to give it a personal touch, such as
    changing user pictures, hiding users, customizing the logon screen colors, and
    more.


    # ## Changing User Pictures


    Each user set up on your computer can associate an image that appears next to
    his or her name on the lock screen, as shown in Figure 5-1. By default, you have
    the option to select a picture for your account when you install Windows. However,
    the screen that enables you to pick an image offers only a small selection of
    the pictures available to you. In addition, if you do not like the images that
    Windows has to offer, you can select any image file.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_77_0.png)


    **Figure 5-1:** The logon screen displays an image next to the user''s name.'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'The process of changing a user''s image is simple. Just perform the following
    steps to change it in no time:


    +   1. Open the Start screen and click your user picture, as shown in Figure 5-2.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_78_0.png)


    **Figure 5-2:** Click your user picture to access your account settings.


    +   2. Click Change Account Picture.

    3. Click the Browse button.

    4. Navigate the browser until you find an image you want to use and click it.

    5. Select Choose Image.


    Your user image on the logon screen is now changed; you have also updated the
    image used on the Start screen.


    # ## Hiding Users on the Lock Screen


    One of the features of the new lock screen is the list of all the user accounts
    on the computer. What if you created an account for running services? You do not
    want other users of your computer to have the option to log on to that account,
    because you designated it to be used only by applications running as a service.'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'Maybe you have a secret user account that you don''t want anyone to see. With
    the help of a simple registry tweak, it is possible to hide any account on the
    lock screen so no one will know it exists.


    Hidden away in the registry is the feature that Microsoft used in the past to
    hide system accounts from the lock screen. In the next few steps, I show you how
    to re-create the missing registry code so that you can use this feature again
    to hide your accounts:


    +   1.  Open the Start screen, type **regedit** in the Search box, and then press
    Enter.

    2.  When the Registry Editor loads, navigate through **HKEY_LOCAL_MACHINE, SOFTWARE,
    Microsoft, Windows NT, CurrentVersion**, and **Winlogon**.

    3.  You must now create a new key. Right-click the Winlogon folder, select New,
    and then select Key. Name this new key **SpecialAccounts**.

    4.  Right-click the new SpecialAccounts key, select New, and then select Key.
    Call this new key **UserList**.

    5.  Now you are ready to add the name of the account that you want to hide. To
    add a name, right-click and select a new DWORD (32-bit) value, as shown in Figure
    5-3.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_79_0.png)


    **Figure 5-3:** Use the Registry Editor to add another DWORD value for the name
    of the account that will be hidden on the lock screen.


    +   6.  When the new DWORD is created, enter the name of the user''s account as
    the name of the DWORD. After you have done this, you can close the Registry Editor.'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'After you log off, the user will no longer be displayed on the lock screen.
    If you want to hide all accounts and just have User Name and Password boxes, the
    next section is for you. If you opt for that method, you can hide all accounts
    and still log on to them. You just need to remember the username and the password
    because no accounts will be listed anymore.


    If you ever change your mind and want the account to display on the lock screen
    again, just delete the DWORD that you made in the system registry, and everything
    will be back to the way it once was.


    # ## Clearing the Last User Logon


    Every time you boot up your PC, all computer accounts and users who have logged
    on to it display on the lock screen. This can be a big security risk because it
    shows the usernames of all accounts that someone can try to use to break into
    the computer. In addition, the lock screen can become cluttered with many user
    accounts. Therefore, it might be a good idea to enable the Do Not Display Last
    User Name policy. This policy removes the account list from the lock screen and
    turns on the basic User Name and Password boxes, as shown in Figure 5-4.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_80_0.png)


    **Figure 5-4:** Basic User Name and Password boxes appear on the lock screen.'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'Using the policy is easy. To enable it, follow these steps:


    +   1. Open the Start screen, type **secpol.msc**, and press Enter.

    2. When the Local Security Policy editor loads, navigate through Local Policies
    and then Security Options.

    3. Locate the Interactive Logon: Do Not Display Last User Name policy. Right-click
    it and select Properties.

    4. On the Local Security Settings tab, select **Enabled**, and then click OK.

    5. Close the Local Security Policy editor and you are finished.


    If you don’t have SecPol.msc in your version of Windows (only Professional and
    higher versions do) you have to set the registry key manually:


    +   1. From the Start screen, type **Regedit**, and hit Enter.

    2. Navigate through HKEY_LOCAL_MACHINE, SOFTWARE, Microsoft, Windows, CurrentVersion,
    Policies, and then System.

    3. Right-click dontdisplaylastusername and select Modify.

    4. Set the value to 1 and click OK.


    As soon as you log off, the new lock screen settings appear.


    # # Changing the Lock Screen Screensaver


    If you turn on your computer and let it sit at the lock screen long enough, eventually
    the screensaver appears. You can tweak this setting so that the screensaver that
    you want to see instead replaces the boring Windows default. Unlike changing your
    screensaver for your account when you are logged on, it is possible to change
    the logon screen screensaver setting only by using the registry. With the help
    of a few quick registry hacks, you can fine-tune the screensaver that is displayed
    and other settings, such as the screensaver time-out value that determines how
    long the computer is inactive before the screensaver is activated.


    Follow these simple steps to customize your logon screensaver:


    +   1. Start the Registry Editor. Open the Start screen, type **regedit** and
    hit Enter.

    2. When the Registry Editor starts up, navigate through HKEY_USERS, .DEFAULT,
    Control Panel, and Desktop.

    3. First, you need to tell Windows the logon screensaver is active. Right-click
    the Desktop key and select New and then String Value. Name the value **ScreenSaveActive**.
    Next, set the value to 1 by right-clicking it and selecting Modify. Enter 1 and
    click OK.

    4. Set the amount of time the system should wait after the last activity is detected
    before starting the screensaver. To do this, right-click the'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'Desktop key and select New and then String Value. Name the new entry **ScreenSaveTimeOut**.
    Then, set the value to the number of seconds you want to wait before the screensaver
    starts by right-clicking the new value and selecting Modify. I like to set mine
    to 300 seconds for 5 minutes.


    +   5. Now you need to set the screensaver you want to display. To do this, right-click
    the Desktop key again and select New and then String Value. Name this value `SCRNSAVE.EXE`
    and set its value to the full path to the `.scr` file such as `c:\savers\screen.scr`.


    6. Close Registry Editor. You are now finished. After a reboot, you see your new
    screensaver.


    The most difficult part of this tweak is finding a compatible screensaver that
    runs properly on the lock screen. All of the screensavers included with Windows
    8 require Direct3D graphics support. Unfortunately, Direct3D is not yet running
    on the lock screen. One that I have personally tested is the old 3-D maze screensaver
    in Windows 98. You can download a copy at `tweaks.com/208418`. Other old screensavers
    that do not need Direct3D or DirectDraw should also work.


    # Displaying a Security Message


    Would you like to display a message to your users before they can log on? Are
    any instructions necessary for users of your computers, such as "Do not shut down
    this computer!" or do you need to display a security warning informing unauthorized
    users that they are breaking the law if they try to log on to your laptop? All
    of these are possible with the help of Group Policy. With just a few clicks, you
    can easily display a message to your visitors, as shown in Figure 5-5.


    Using the Local Security Policy editor, you can turn this feature on. Follow these
    steps to activate it on your PC:


    +   1. Open the Start screen, type `secpol.msc`, and press Enter.


    2. When the Local Security Policy editor loads, navigate through Local Policies
    and then Security Options.


    3. Locate the **Interactive Logon: Message Title For Users Attempting To Log On**
    policy. Right-click it and select Properties.


    4. On the Local Security Setting tab, type a title that you would like to use
    for your message, and click OK.


    5. Locate the **Interactive Logon: Message Text For Users Attempting To Log On**
    policy. Right-click it and select Properties.


    6. On the Local Security Setting tab, type your message and click OK.


    7. Close the Local Security Policy editor; you are finished.


    As soon as you log off or reboot, the security message settings are activated.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_83_0.png)


    **Figure 5-5:** You can display a security message on your Windows 8 lock screen.


    # # Enabling Num Lock by Default


    If you have a password that has both numbers and letters and you frequently use
    the number pad to enter part of your password, this hack is for you. I cannot
    count the number of times that I started to type my password and was then presented
    with a logon error telling me that my password was incorrect. I would sit there
    staring at the screen for a second before I realized that Num Lock on my keyboard
    was not on.


    This is a great hack for every desktop computer with a full-size keyboard and
    a separate number pad. Turning on Num Lock by default on a laptop is not a good
    idea because most laptops do not have a separate number pad. The result of enabling
    this feature on a laptop is that almost half your keyboard functions as the number
    pad. To get started, follow these steps:


    +   1. Open the Start screen, type regedit, and press Enter.


    +   2. When the Registry Editor loads, navigate through HKEY_USERS, .DEFAULT,
    Control Panel, and Keyboard.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '+   3. Locate the InitialKeyboardIndicators entry, right-click it, and select
    Modify. To enable Num Lock, enter 2 into the box. If you want to disable it, enter
    2147483648, which is the system default value.


    +   4. Click OK to save the changes. That’s it!


    If you are on a laptop and you attempted to enable Num Lock—even though I told
    you not to—and need to fix your system, repeat the preceding directions but replace
    the value of InitialKeyboardIndicators with 2147483648 to disable the feature.


    # # Changing the Lock Screen Image


    Windows 8 actually has two different types of lock screen images: one for all
    users, also called the default lock screen, and one for each user account. The
    default logon screen displays when multiple user accounts are on the machine but
    no users are logged in. This is most common in business environments with domain-joined
    PCs that hide the last user logged in. It also displays on a multi-user home PC
    when a user logs off.


    # ## Setting the Default Lock Screen


    Configuring the default lock screen was not a feature of the RTM build of Windows
    8. It was introduced based on feedback from enterprise customers and was enabled
    in the November 2012 cumulative patch for Windows 8 (KB2770917). You must have
    that patch installed to proceed with this section. See tweaks.com/983858 for more
    details about the patch. Customizing the default lock screen uses group policies
    which can be controlled globally with domain group policy or locally with local
    group policy. That is good news for any business that wants to make this change
    apply globally without having to touch every machine but it also means that this
    will work only on Windows 8 Pro and Windows 8 Enterprise editions.


    +   1. To get started, open the Start screen, type gpedit.msc, and hit Enter.


    +   2. When the Local Group Policy Editor loads, navigate through Local Computer
    Policy, Computer Configuration, Administrative Templates, Control Panel, and then
    Personalization.


    +   3. Right-click Force A Specific Default Local Screen Image and select Edit.


    +   4. Select the Enable option.


    +   5. Enter a path to a JPG image file you want to use as your lock screen image.
    For example, C:\Images\DefaultLockScreen.jpg, as shown in Figure 5-6.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_85_0.png)


    +   6. Click OK.

    7. Close the Local Group Policy Editor and log out to view the new default lock
    screen.


    # Customizing the User Lock Screen


    The user lock screen is what most users of Windows 8 see on a daily basis. By
    default, Windows 8 automatically logs in the last person to use the PC, which
    is why you see this lock screen the most often. Customizing the lock screen is
    very simple; the most difficult part is finding a good picture:


    +   1. Open the Start screen and type **Lock Screen**.

    2. Click the Settings filter.

    3. Click **Lock Screen**.'
  merge: -1
  img_proc: true
- pgno: 86
  md: "+   4. Click a new image from the default options or click Browse and select\
    \ a custom image.\n\nYour new lock screen is active immediately.\n\n# Tweaking\
    \ Default Color Scheme\n\nIf you are tired of the default color scheme on the\
    \ logon and logoff screens you can change it just like you can change the rest\
    \ of the new interface. The Windows logon process determines which color scheme\
    \ to display by reading a value in the registry. Microsoft did not write a GUI\
    \ to make it easy for you to change the settings, but you can do it within Registry\
    \ Editor.\n\nTo make this change, you set the value of the Accent setting. The\
    \ value corresponds to a predetermined color scheme set by Microsoft. You have\
    \ 25 options to choose from, as shown in Figure 5-7. Because this book is in black\
    \ and white and picking colors in black and white is difficult if not impossible,\
    \ I have hosted a color copy of the graphic online at tweaks.com/552494.\n\n![](img/ea75090cfee8ac890f64c8c4f62f7285_86_0.png)\n\
    \n+   1. Open the Start screen, type in **regedit**, and hit Enter.\n2. When the\
    \ Registry Editor loads, navigate through HKEY_LOCAL_MACHINE, SOFTWARE, Microsoft,\
    \ Windows, CurrentVersion, Explorer, and then Accent.\n   If Accent does not exist\
    \ on your system, create it by right clicking Explorer, and then select New and\
    \ Key.\n3. Create a new DWORD by right-clicking Accent and then DWORD (32-bit)\
    \ Value.\n4. Name the new DWORD DefaultColorSet.\n5. Right-click the new DefaultColorSet\
    \ entry and select Modify.\n6. Switch the Base to Decimal by selecting Decimal\
    \ on the Edit DWORD (32-bit) Value window.\n7. Enter the corresponding value between\
    \ 0 and 24 for the color scheme you want and click OK.\n8. Reboot your PC to see\
    \ the new color scheme."
  merge: -1
  img_proc: true
- pgno: 87
  md: '# Customize Lock Screen Apps


    The new lock screen displays a picture but has the capability to do much more.
    In fact, many popular Windows Store apps can display information on the lock screen.
    Notification of new messages or the current weather conditions are some of the
    neat options you have. As the Windows Store continues to grow, there will be even
    more options in the future.


    Microsoft allows one spot on the lock screen to display detailed information next
    to the current time, and seven spots for notifications. Follow these steps to
    modify the apps on your lock screen:


    +   1. Open the Start screen and type **Lock screen**.

    2. Click the Settings filter.

    3. Click **Lock Screen**.

    4. Scroll to the bottom to view the Lock Screen Apps section.

    5. To change an option, just select one of the boxes. The **Choose An App** menu
    pops up displaying all available apps for that spot. If you don''t want to show
    any, select **Don''t Show Quick Status Here**.


    # Using a Picture Password


    New to Windows 8 is the capability to set touch points on a photo as your account
    password. This is an innovative method for logging on to your computer without
    using a keyboard. Instead of typing in a password, you touch or click a person''s
    face, hand, and some object in the background of a picture. You can choose which
    picture you want to use and determine where you touch or click.


    Picture passwords are perfect for touch devices but they also work on traditional
    PCs with a simple mouse.


    Setting a picture password is easy and fun, so let''s get started:


    +   1. Open the Start screen and type **picture password**.

    2. Click the Settings filter.

    3. Click **Create Or Change Picture Password**.

    4. Under **Sign-In Options**, click the **Create A Picture Password** button.

    5. Enter your current password when asked.

    6. Click **Choose Picture** and select a picture on your PC.

    7. On the confirmation screen, select **Use This Picture**.

    8. Then touch or click three parts of the picture per the on-screen directions.

    9. Repeat where you touched or clicked to confirm your picture password.

    10. Click **Finish**.'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'Your picture password has now been set up. Hit Windows Key+L to lock your computer
    to test it out.


    # Enable PIN Logon


    If a picture password is not for you, the PIN logon most likely is. I use this
    as the logon method on all my devices because it is quick and easy. Instead of
    typing in a password, just key in a four-digit PIN and you will be logged in immediately.


    +   1. Open the Start screen and type PIN.

    2. Click the Settings filter.

    3. Click Create Or Change PIN.

    4. Under Sign-In Options, click the Create A PIN button.

    5. Enter your current password when asked.

    6. Next, enter your PIN twice and click Finish.


    The new PIN is active immediately. You can switch between using a password or
    a PIN on the logon screen by clicking Sign-In Options and then selecting the icon
    for the sign-in method you want to use, as shown in Figure 5-8.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_88_0.png)'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# Boot To Desktop


    One of the more controversial changes in Windows 8 is the behavior after you log
    in. Instead of viewing the desktop, users are shown the new Start screen. If you
    want to view the desktop you must select the Desktop tile. Microsoft is trying
    hard to promote the new windowless immersive environment and that has rubbed some
    users the wrong way.


    Adding fuel to the fire, Microsoft blocked the easy methods to change this behavior
    and go directly to the desktop after logon in the final builds of Windows 8. The
    only method that remains requires third-party software to work around the limitations
    imposed by Microsoft.


    I spent a lot of time investigating how to solve this problem and ended up writing
    a free utility called Tweaks.com Boot to Desktop. My utility has two main components.
    The first part is a tiny service that runs in the background and monitors for
    when the logon event happens. When that is detected, it launches a second component
    under the user context that does the leg work of showing the desktop. The solution
    is rather complex, but was necessary to get around the limitations imposed by
    Microsoft.


    Using my utility is very simple. Just download it from tweaks.com/414700 and install
    it. After a reboot you will boot directly to the desktop.


    If you change your mind, you can uninstall the utility just like any application
    and you will revert to the Start screen behavior.


    # Summary


    You can think of this first customizing chapter as the first step in the complete
    customization of every possible aspect of your Windows 8 install. You started
    with tweaking the way the logon screen behaves and then made some major changes
    to the look by changing the lock screen.


    The next chapter helps you customize the user navigation components of Windows
    8. First, you learn all about customizing the Start screen. Then you learn how
    to customize the next most used component of Windows 8—the taskbar.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# # Customizing User Navigation


    Customizing user navigation is the next stop on the Windows 8 customizing road
    trip. In the previous chapter, with the help of some cool tweaks, you were able
    to change and improve the logon experience. This chapter picks up where Chapter
    5 left off and shows you how to customize and improve the visual navigation elements
    of Windows 8.


    This chapter starts with customizing the look and the content of the cool new
    Start screen, formally the Start menu. The improved Start screen in Windows 8
    has many useful features, and I show how you can use them best. Then, I show you
    how you can customize almost everything you see on the Start screen. If you don’t
    like the new Start screen, I show you how to get the old classic Start menu back.


    You also learn how to customize the taskbar on the bottom of your screen. The
    taskbar is an essential part of navigating your computer. I show you how to customize
    and improve its features and give you some new ideas about how you can use it
    to dramatically improve your experiences with Windows 8.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# # Customizing the Start Screen


    Completely revamped for Windows 8, the Start screen enables you to search your
    programs and jump directly to various components of Windows. Additionally, you
    can launch commands much as you could in the traditional Run box by just typing
    them in.


    After you finish reading these next few sections, you will have transformed your
    Start screen into something that works better for you and is much more useful
    for your everyday tasks.


    # ## Changing the Background and Colors


    Changing the background is one of the easiest customizations, but it makes a big
    impact on personalizing your Windows 8 PC. You can use two methods to customize
    the Start screen background: one using native functionality that limits you to
    designs created by Microsoft, and another using third-party utilities to use any
    image as the background image.


    # *Native Background Personalization*


    Microsoft provides 20 different background images along with 25 different color
    schemes. That means 625 possible combinations of each background and color scheme
    are available. With that many combinations, the odds are in your favor to find
    something that you like using the native personalization options.


    Selecting your background image and color scheme is very easy in Windows 8:


    +   1.  Open the Start screen and type **customize**.

    2.  Click the Settings filter.

    3.  Click Customize Your Start screen.

    4.  Pick the background image you want to use, as shown in Figure 6-1.

    5.  Pick the color scheme you want to use.


    As soon as you make the change, your settings are saved. The preview window gives
    a nice simulated view, but I always like hitting the Windows Key to check out
    the real deal.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_92_0.png)


    # **Background Customization with Utilities**


    If you are not happy with the images and colors Microsoft included in Windows
    8, you must use third-party utilities for more options. The following are two
    utilities that I have used with Windows 8 to customize the Start screen image
    and colors further.


    # **Stardock Decor8**


    Decor8 is by far the best Start screen customizing application. You can set any
    image as your background, customize the colors of your tiles, and tweak the visual
    effects. The interface is easy to use and it even includes advanced features that
    enable you to automatically change the background image on a timer. The only downside
    to this app is that you must pay $4.99 to use it.


    Head over to tweaks.com/157844 and download a free 30-day trial. After Decor8
    is installed, you see the main customization screen as shown in Figure 6-2.'
  merge: -1
  img_proc: true
- pgno: 93
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_93_0.png)


    **Figure 6-2:** Stardock Decor8 offers this customization screen.


    Select one of the background images or click Select File to use your own. Click
    the Colors option on the left menu to select from the standard Windows color schemes
    or create your own.


    # Windows 8 Start Screen Customizer


    The Windows 8 Start Screen Customizer is a free utility written by vhanla, who
    is known for creating a number of free Windows customization utilities. Although
    it does not have all of the bells and whistles of Decor8, it gets the job done
    in enabling you to replace the Start screen background image. Unique to the Windows
    8 Start Screen Customizer, you can also adjust the transparency of the entire
    Start screen.


    You can download a free copy at `tweaks.com/161004`. Just extract the file and
    rename the extension from `.ex_` to `.exe` and then run. Once you have it up and
    running, select one of the default backgrounds or click Load Picture to select
    your own. Then just drag the border box around the section of the picture you
    want to use, click the Apply & Save button as shown in Figure 6-3, and your new
    Start screen will be active.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_94_0.png)


    Figure 6-3: Windows 8 offers a Start Screen Customizer.


    # Working with Live Tiles


    Tiles make up all the content on the new Start screen in Windows 8. Knowing how
    to customize them will help you personalize your Windows 8 experience. Over time
    as you install more and more apps, the Start screen can become cluttered. Finding
    what you want becomes difficult and the result is a visual mess. Windows 8 has
    some very useful organization tools built in, but they are not always intuitive
    because Windows 8 puts a lot of options in hidden menus.


    # Adding or Removing Tiles


    Anything that shows up in the Start screen application search can be pinned to
    the main Start screen. An easy method to view all apps on your computer, similar
    to the old All Programs menu in the old Start menu, is to open the Start screen,
    right-click, and then select All Apps on the pop-up charms bar.


    At that point just scroll until you find the application you want to pin and right-click
    it. Then Select Pin To Start as shown in Figure 6-4.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_95_0.png)


    Figure 6-4: Pin an application to your Start screen.


    Removing tiles is even easier. Simply right-click a tile on your Start screen
    and select Unpin From Start.


    # ## Moving Tiles


    Customizing the location of the tiles is one thing that Microsoft made easy in
    Windows 8. With a mouse, just click and hold a tile and you can drag it anywhere
    you want on the Start screen. With a keyboard, select a tile with the tab key,
    then hold down Shift+Alt and use the arrow keys to move tiles around.


    # ## Grouping Tiles


    After you install a lot of apps on your PC your Start screen will become cluttered.
    Sorting your tiles into groups is absolutely necessary to keep your Start screen
    organized and under control. You can arrange tiles in any number of groups and
    you can label the groups. The process of creating groups is fairly straightforward.


    Create a group by dragging a tile in one of the default groups to the left or
    right of the current group. As you drag the tile out of a group, a new group indicator
    displays as shown in Figure 6-5. Drop the tile on the vertical indicator and it
    is placed in a new group. Next, just drop additional tiles into the group as necessary.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_96_0.png)


    **Figure 6-5:** Use the new group indicator to add tiles to a group.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_96_1.png)


    **Figure 6-6:** Enter the zoomed-out group view.'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'You can name groups, which makes finding the app tile you want much easier
    and makes the entire Start screen look much more organized. Naming a group requires
    the Start screen to be in the zoomed-out group view. You can enter that view by
    clicking the minus button in the lower-right corner of the screen, as shown in
    Figure 6-6.


    Once you are in the group view, just right-click any group, select Name Group,
    enter a name, and hit Enter.


    # ## Resizing Tiles


    Windows Store apps have two tile sizes, whereas classic Windows apps come in only
    one size. The metro-style apps can be single width or double width. Tweaking the
    size of the tile is as simple as right-clicking it. Have a double-wide and want
    to make it single? Just right-click it and select Smaller on the charms bar that
    pops up. Click Larger on the charms bar to make it bigger.


    # # Creating Custom Tiles


    You can extend the Start screen further in Windows 8 by adding custom tiles. With
    the right tools, you can pin just about anything to the Start screen: folders,
    websites, scripts, and even commands. In the next two sections I show you how
    you can create custom tiles that will make your Windows 8 experience better.


    # ## Native Support


    Only applications can be pinned to the Start screen natively and are typically
    customized by pinning an application shortcut. To demonstrate how, I show you
    how to create a tile on the Start screen that will shut down your computer. Switch
    to the desktop interface and then follow these steps:


    +   1. Right-click the desktop and select New and then Shortcut.


    +   2. Type the command you want to run in the location box. For this shutdown
    tile example, type `shutdown.exe /s /t 0` and then click Next.


    +   3. Type in a name for your shortcut, such as Shutdown, and click Finish.


    +   4. Now it is time to customize the look of the shortcut. Right-click your
    new shortcut and select Properties.


    +   5. On the Shortcut tab, click Change Icon.


    +   6. Select a new icon and click OK.


    +   7. Click OK on the shutdown.exe Properties window.


    +   8. Right-click your shortcut again and this time select Pin To Start.'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'Your new custom tile appears at the far right of your Start screen. Drag it
    to where you want it and you are finished.


    # Third-Party Apps


    I recommend two third-party tile creating apps that enable you to create more
    customized tiles. Instead of just picking an icon to display on the tile, the
    apps listed here let you select images and the colors of the tile:


    +   - OlbyTile—tweaks.com/936219

    - Modern Tile Maker—tweaks.com/475926


    Both tile creators are free utilities and are very simple to use. Just download
    the utilities from the links, fill out the simple form, and your tiles are created.
    There have been reports of the two apps conflicting with each other, so pick just
    one and go with it.


    # Administrative Tools


    The classic administrative tools that have been in every version of Windows in
    the past decade are also part of Windows 8, but they are hidden by default. You
    can display these utilities on the Start screen, but before I show you how, here
    is a full list of what this tweak will enable on the Start screen:


    +   - Component Services

    - Computer Management

    - Defragment and Optimize Drives

    - Disk Cleanup

    - Event Viewer

    - iSCSI Initiator

    - Local Security Policy

    - ODBC Data Sources (32-bit)

    - ODBC Data Sources (64-bit)

    - Performance Monitor

    - Print Management

    - Resource Monitor

    - System Configuration

    - System Information

    - Task Schedule'
  merge: -1
  img_proc: true
- pgno: 99
  md: '+   - Windows Firewall

    - Windows Memory Diagnostic

    - Windows PowerShell (x86)

    - Windows PowerShell ISE

    - Windows PowerShell ISE (x86)


    After the tiles are added you have the option of manually hiding any specific
    tile using the instructions covered earlier.


    To get started displaying the administrative tools on your Start screen, follow
    these steps:


    +   1. Open the Start screen.

    2. Hit Windows Key+C to bring up the charms bar.

    3. Click Settings on the right charms bar.

    4. Click Tiles.

    5. Click the Show Administrative Tools switch as shown in Figure 6-7.


    All of the administrative tools listed previously will appear shortly.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_99_0.png)


    Figure 6-7: Enable Administrative Tools on the Start screen.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# ## Restoring the Classic Start Menu


    The classic Start menu has been completely ripped out of Windows 8. Microsoft
    wanted to make sure the Start screen was the only native option users had, and
    it accomplished that goal. The verdict is still out on the new Start screen, but
    one thing is very apparent: lots of people are fans of the traditional Start menu
    and they want to restore the functionality.


    Two utilities replicate the behavior and appearance of the traditional Start menu
    Windows users are familiar with.


    # ### Classic Shell


    Classic Shell is a free Start menu alternative that restores a Start button and
    a pop-up menu interface similar to the traditional Start menu as shown in Figure
    6-8.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_100_0.png)


    **Figure 6-8:** Classic Shell offers a Start screen replacement.


    Almost all of the functionality of the traditional Start menu has been replicated
    with Classic Shell. Best of all, Classic Shell can be heavily customized. Skins
    are available to change the look and dozens of settings let you change which items
    are displayed, and even the graphic for the Start button.


    Classic Shell is easy to set up. Just head over to *tweaks.com/963778* and download
    the latest version.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# Stardock Start8


    Start8 by Stardock is a polished Start menu replacement that has all the features
    you expect from a traditional Start menu with a refined modern look, as shown
    in Figure 6-9. Customizable in a manner similar to Classic Shell, it lets users
    pick which options are shown and even tweak the Start button images.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_101_0.png)


    **Figure 6-9:** Stardock Start8 offers a Start menu replacement.


    Start8 also has some unique features. For example, you can control it from a Group
    Policy or disable the Metro “hot spots” that bring up the charms. That feature
    is very helpful if you dread the new Metro world and just want to work in the
    Desktop interface. Overall, Start8 is the gold standard for Start menu replacements.


    Start8 costs $4.99, but a free trial is available. Head over to tweaks.com/559130
    to download the latest version.


    # Customizing the Taskbar


    Windows 8 includes a refined taskbar that was designed to give you more control
    and more flexibility when working on your computer. The taskbar, which can be
    described as a giant Quick Launch bar, enables you to move applications around'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'and pin applications so they remain on the taskbar even when it is closed.
    The first thing you will notice is the absence of labels by default on program
    listings. That creates a very clean look and allows Windows to cram a lot of open
    applications in a small amount of space.


    On top of the visual changes, the taskbar includes functionality such as Jump
    Lists, Peek, and an improved notification area. This section shows you how to
    customize these new features and to personalize your taskbar.


    # Pinning Applications


    The Quick Launch bar on the taskbar in previous versions of Windows was my favorite
    component to customize. I spent hours organizing and ordering shortcuts to numerous
    applications aiming to create the perfect setup. In Windows 8, Microsoft turned
    my world upside down by removing the Quick Launch toolbar from the taskbar. Thankfully,
    Microsoft realized the value of Quick Launch and built the same functionality
    into the taskbar.


    The taskbar is no longer just a place to view open applications; you can start
    applications from it too by pinning application shortcuts to the taskbar. Pinning
    creates a shortcut that permanently stays on your taskbar, just like an old Quick
    Launch shortcut. Different from previous versions of Windows is the way the shortcuts
    appear. Open but not active applications have a border around them. Active, open
    applications have a border around them and a glass highlight effect. Closed, pinned
    applications just show up as an icon. All three types of applications are shown
    in Figure 6-10.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_102_0.png)


    You can pin an application in two ways:


    +   *   Drag any shortcut from your desktop or Start menu onto the taskbar.

    *   Right-click any open taskbar application and click **Pin This Program To Taskbar**.


    Folders and drives that you attempt to pin show up in the Explorer Jump List instead
    of as individual icons on the taskbar. This was a design decision made by Microsoft
    to clean up the taskbar and keep it organized.


    Removing a pinned application is as simple as right-clicking the pinned application
    on the taskbar and selecting **Unpin This Program From Taskbar**.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# ## Modifying Icon Locations


    The taskbar in Windows 8 was designed with *you* in mind. For the first time you
    can determine the location of each program—even the location of programs you open
    yourself or that are currently open.


    Moving your programs is simple: just left-click and hold any icon and drag it
    where you want it to be. Applications that are not pinned by default always appear
    at the end of the list, but you can move them again as soon as they load.


    # ## Tweaking Jump Lists


    Jump Lists are a major component of the new taskbar. When you right-click an application,
    you are presented with a number of new options relevant to that application. Depending
    on the application, you are shown recent items, common tasks, and more. Most applications
    will show recently opened items, such as Word documents when you right-click Microsoft
    Word. Other applications such as Windows Messenger and Windows Media Player have
    enhanced Jump Lists that enable you to perform common tasks, as shown in Figure
    6-11. If you want to sign off temporarily on Windows Messenger, just right-click
    the taskbar shortcut and you can quickly change your setting.


    Overall, Jump Lists are a great addition to the new taskbar because they enable
    you to jump to tasks faster than before. To make Jump Lists work better for you,
    there is a tweak that will help you customize the feature.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_103_0.png)


    **Figure 6-11:** Windows 8 offers Jump Lists.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# Adjusting the Recent List


    All applications that participate in the Windows MRU (most recently used) list
    automatically have a recent items component on their Jump List. Microsoft Word
    shows recent documents; Internet Explorer shows recent websites; and Microsoft
    Paint shows recently opened pictures on their Jump Lists. By default, Windows
    shows the ten most recent used items. If you think that is too much or too little,
    I''m going to show you how to tweak that setting.


    Windows sets a maximum of 60 recent items possible to show in the Jump List, although
    I never see that many even when I have it set to the max. I recommend that you
    set the value between 5 and 20 to keep the recent list useful. The setting to
    change the value is a little hard to find because it is not where you would expect
    it. Follow these steps to customize how many items are displayed in your recent
    lists:


    +   1. Right-click the taskbar and select Properties.

    2. Click the Jump Lists tab.

    3. Set the Number Of Recent Items To Display In Jump Lists as shown in Figure
    6-12.

    4. Click OK and you are finished.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_104_0.png)'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# # Enable Classic Taskbar Look and Behavior


    The Windows 8 taskbar has a clean appearance with just the icons of opened and
    pinned applications grouped together by program. Microsoft realized that not all
    users would like the new look and grouping, so it built in the capability to turn
    labels back on. The result is what I call the classic taskbar look and behavior,
    as shown in Figure 6-13.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_105_0.png)


    Similar to previous versions of Windows, the program label look and lack of application
    grouping is helpful for users who dislike the new taskbar and want a familiar
    look. Windows 8 offers three settings that enable you to configure the taskbar’s
    appearance and behavior:


    +   - **Always Combine, Hide Labels**—Default taskbar behavior

    - **Combine When Taskbar Is Full**—Labels are enabled

    - **Never Combine**—Labels are enabled


    I don’t recommend using the *Never Combine* setting because it makes finding programs
    very difficult when you have a lot of windows and applications open. Instead,
    I would use *Combine When Taskbar Is Full* to achieve the classic look and behavior.


    To make the changes, follow these steps:


    +   1. Right-click the taskbar and click Properties.

    2. On the Taskbar tab, locate the Taskbar Buttons drop-down list, and make your
    selection.

    3. Click OK or Apply to see the new setting in action.


    If you want the true classic look of small icons combined with the classic look
    and behavior, the next section is for you.


    # # Customize Taskbar Icon Sizes


    I always like to customize the taskbar icon size on my laptop because it has a
    small screen. The large taskbar icons look great on my desktop LCD monitors that
    run at high resolutions, but they take up too much space on the small screen of
    my laptop. Customizing this setting also enables you to fit many more pinned and
    open applications on the taskbar. As you can see in Figure 6-14, there is a big
    difference between small and large icons on the taskbar.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_106_0.png)


    You enable small icons in the Taskbar properties:


    +   1. Right-click the taskbar and select Properties.

    2. On the Taskbar tab, check Use Small Taskbar Buttons.

    3. Click OK or Apply to see the result.


    # Tweaking Taskbar Preview Delay


    Taskbar previews have been improved in Windows 8, enabling you to take a quick
    peek at a window by hovering over its taskbar icon. My biggest complaint is the
    delay before the taskbar previews are shown. I want to use the new features but
    the amount of time I have to hover over a taskbar application is too long. You
    can tweak this with a simple registry hack:


    +   1. Open the Start screen, type **regedit**, and hit Enter.

    2. When the Registry Editor is started, navigate through HKEY_CURRENT_\USER, Software,
    Microsoft, Windows, CurrentVersion, Explorer, and Advanced.

    3. Right-click Advanced, click New, and then click DWORD (32-bit) Value. Name
    the new value **ExtendedUIHoverTime**.

    4. Right-click the new ExtendedUIHoverTime value you just created and select Modify.

    5. Change the Base to Decimal and enter the new value in milliseconds and click
    OK. The default value is 400 in the decimal base, which is 400 milliseconds. I
    like to set mine to 100.

    6. Reboot and test your new setting.


    # Restore Classic Quick Launch Bar


    The classic Quick Launch bar was a great way to start your programs in previous
    versions of Windows. With the new taskbar in Windows 8, the Quick Launch bar was
    removed and replaced with the application pinning feature. The ability to pin
    an application to the taskbar is nice, but it does not exactly replicate the old
    behavior of the Quick Launch bar.'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'Although the Quick Launch bar was removed in Windows 8, Microsoft left the
    capability to add more toolbars on the taskbar as in previous versions of Windows.
    You can exploit the toolbar feature to create a new toolbar pointing to the old
    Quick Launch location. Follow these steps to resurrect the Quick Launch bar:


    +   1. Right-click the taskbar and click Toolbars and then New Toolbar.


    +   2. On the new toolbar, choose a folder screen, type %AppData%\Microsoft\Internet
    Explorer\Quick Launch, and click Select Folder, as shown in Figure 6-15.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_107_0.png)


    Figure 6-15: You can restore the classic Quick Launch toolbar.


    +   3. The Quick Launch toolbar is displayed on the far right of the taskbar,
    but you are not finished yet. Next, make sure that the taskbar is not locked so
    you can customize the toolbar that you just created. You can do that by right-clicking
    the toolbar and making sure Lock The Taskbar is not checked.


    +   4. After you verify that the taskbar is unlocked or have unlocked the taskbar,
    you can remove the Quick Launch toolbar label. Right-click the Quick Launch label
    and select Show Title to disable that feature.


    +   5. Right-click the new toolbar again and select Show Text to disable that
    feature as well.


    +   6. The toolbar should begin to look familiar now. The last step is to position
    and size the Quick Launch bar to the location you want on the taskbar. You'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'can resize it by left-clicking and holding on to the gripper bar on the left
    of the toolbar. Then, just drag left or right to resize. If you want to move it
    back to where it normally is, on the far left of the taskbar, right-click the
    gripper bar on the left of the normal taskbar and drag it right. That will make
    the new taskbar icons and the toolbar you just created switch locations.


    If you want to replicate the full classic Windows taskbar look, I suggest you
    also follow the Customize Taskbar Icon Sizes tweak and Enable Classic Taskbar
    Look and Behavior tweak I mentioned earlier in this chapter. The combination of
    all three tweaks is a great help to users who miss the old behavior and look of
    the Windows taskbar.


    # ## Modifying the Taskbar Location


    The Windows taskbar always appears on the bottom of the screen, but did you know
    that you can move it to any side you want? It is possible to move the taskbar
    and create a very different look in Windows 8. Figure 6-16 shows what your screen
    might look like if you move your taskbar to the left side of the screen.


    Moving the taskbar is simple. Just follow three basic steps:


    +   1. Right-click the taskbar and select Properties.


    +   2. On the Taskbar tab, find the Taskbar Location On Screen drop-down box and
    select the position you want to use.


    +   3. Click OK or Apply and view your new location.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_108_0.png)


    Figure 6-16: You can move the taskbar. Here it appears on the left side of the
    screen.'
  merge: -1
  img_proc: true
- pgno: 109
  md: "# Customizing the Notification Area\n\nOver the years the notification area,\
    \ previously known as the system tray, has become more and more cluttered. It\
    \ seems as though just about every application you install wants to create a notification\
    \ area icon when it is running. In Windows 8, Microsoft decided enough is enough\
    \ and cleaned up the notification area by creating a new overflow container. Now\
    \ when any application creates a notification area icon, it does not show up by\
    \ default. Instead, you have to click the arrow on the end of the notification\
    \ area to view the overflow container. Then if you decide that the notification\
    \ area icon actually is useful, you can drag it from the overflow container to\
    \ the main notification area. Now you are in full control of your notification\
    \ area and can keep it nice and neat or cluttered depending on how you like it.\n\
    \nIn the next few sections I show you how you can fine-tune your notification\
    \ area by customizing the appearance and behavior.\n\n# Hiding Icons\n\nAs I mentioned\
    \ earlier, the only additional icons that appear in your notification area are\
    \ icons that you personally drag into it. If you want to hide any of those icons,\
    \ including the default system icons, you can simply drag them off it and they\
    \ will fall in the overflow container. This works great most of the time, but\
    \ there is another way to get more control:\n\n+   1. Click the arrow to the left\
    \ of the notification area and then select Customize. \n2. This loads the Notification\
    \ Area Icons Control Panel screen where you can fine-tune each icon that ever\
    \ attempted to load in the notification area. Scroll through the list and select\
    \ the behavior you want to use for each icon. You can choose from Show Icons And\
    \ Notifications, Hide Icons And Notifications, and Only Show Notifications. \n\
    3. After you have adjusted all your icons, click OK.\n\n# Removing System Icons\
    \ and the Clock\n\nTweaking the system icons such as the Volume, Network, and\
    \ Clock icons requires an additional step. Follow these instructions to hide any\
