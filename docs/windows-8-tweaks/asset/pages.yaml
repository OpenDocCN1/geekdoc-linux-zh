- pgno: 332
  md: '# CHAPTER


    18


    # # Windows Security


    Security is one of the most important issues in the Windows computer world. Over
    the years, as Windows gained popularity and as it became the dominant operating
    system on the market, it became the primary target for hackers and other individuals
    who want to compromise your system. Additionally, you use your computer for more
    and more activities, which results in a massive amount of highly valuable and
    confidential information stored inside. Today it is not uncommon to have personal
    financial information, hundreds of personal documents, and thousands of priceless
    digital photos all stored on your computer. As the amount of personal data stored
    on your computer increases, the reward to compromise your system increases as
    well. This creates an enormous need for a secure operating system that will keep
    your data safe.


    According to Microsoft, Windows 8 is the most secure version of Windows released
    in history. Building off the major security changes introduced in Windows Vista
    and 7, Windows 8 is technically superior but it is far from perfect. Security
    patches are still released to protect users from new attacks, and a lack of education
    on the new security features results in many users not using them.


    This chapter helps you get the most out of security features and shows you how
    to lock down your computer using common industry best practices to protect your
    computer from getting compromised.'
  merge: -1
  img_proc: true
- pgno: 333
  md: '# Actively Protecting Your Computer


    The days when running an antivirus program on your computer was enough to protect
    it are long over. Now you need to play an active role in the process of protecting
    your computer. The types of threats are changing very quickly. Currently, the
    most effective way to compromise a computer is by taking advantage of the human
    factor—that is, tricking you into running some code that installs a malicious
    program to help someone steal your data or take over your machine. Another effective
    method to compromise a computer is to exploit a known vulnerability in the operating
    system. In this situation, a user is not up to date on his security patches and
    is basically leaving the door unlocked so that anyone with limited computer knowledge
    can step right in and install and steal anything they want.


    Taking an active role in securing your computer involves keeping up to date on
    the latest security news so that you know about new vulnerabilities and the methods
    hackers are using to compromise your computer. Additionally, you need to know
    what to look out for so you don’t fall for any undocumented hacks or tricks, as
    well as make sure the known vulnerabilities are fixed on your computer.


    This section helps you with all the aspects of actively protecting your computer.
    First, I show you some great ways to keep up to date on the latest security news.
    Then I show you how to make sure that Automatic Updates in Windows 8 is working
    properly and that your computer has all known vulnerabilities fixed. Finally,
    I give you some pointers to help protect you from falling for most undocumented
    and unknown hacks and tricks.


    # Staying Up to Date


    One of the largest parts of taking an active role in protecting your computer’s
    security is keeping up to date with the latest trends and news on active vulnerabilities.
    Various websites and newsletters can help you stay on top of the latest Windows
    security news. Take a look at the following sites and sign up for some of the
    newsletters to stay on top of the latest security threats:


    +   *   **Microsoft’s Security at Home Newsletter**—This newsletter is targeted
    to less-technical home users and has a lot of information about good techniques
    for better “human” security, as I mentioned earlier. The newsletter is free and
    you can sign up at http://tweaks.com/127594.

    *   **TechNet’s Microsoft Security Newsletter**—This newsletter, which targets
    advanced computer users, goes into more depth concerning the latest security patches
    released, in addition to general security news. This newsletter is also free and
    you can sign up at http://tweaks.com/633433.'
  merge: -1
  img_proc: true
- pgno: 334
  md: '+   TrendMicro''s Threat Encyclopedia—This is a security website that helps
    you find out about the latest viruses, malware, and vulnerabilities for Windows
    8 and popular applications that run on it. Visit http://tweaks.com/927691 to get
    the latest news.


    +   US-CERT—This is the federally funded Computer Emergency Readiness Team website,
    which provides information on the latest security news and vulnerabilities for
    Windows 8 and every other computer software product, including applications that
    run on Windows. US-CERT is a very comprehensive website that has several RSS feeds
    that you can subscribe to with your favorite RSS reader or with Internet Explorer.
    Visit http://tweaks.com/428545 to use this massive resource.


    # Using Microsoft Update


    Every month, Microsoft releases new security patches for all its products that
    fix security holes and increase the security of Windows. It is very important
    to make sure that your computer is working properly and is set up to download
    these new security patches automatically. Additionally, Microsoft includes an
    expanded version of Windows Update called Microsoft Update that patches Microsoft
    products beyond Windows. Microsoft Office, Visual Studio, and other popular Microsoft
    applications can also be patched automatically, but this feature is disabled by
    default.


    Follow these steps to enable Microsoft Update and scan your PC for updates:


    +   Open the Start screen, type **Install Optional Updates**, change the search
    filter to Settings, and hit Enter.


    +   Click the Find Out More link on the Windows Update screen as shown in Figure
    18-1.


    +   Internet Explorer launches a web page describing Microsoft Update and a legal
    agreement you must acknowledge. Check the I Agree box and click the Install button.


    +   After the Microsoft Update component is installed, close IE and Windows Update
    should scan for updates for Windows other Microsoft products automatically.


    +   When the scan is completed you can click important or optional update links
    and view available updates. Only critical updates are installed automatically.


    +   Check the box next to any update you want to install and click Install, as
    shown in Figure 18-2.'
  merge: -1
  img_proc: true
- pgno: 335
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_335_0.png)


    Figure 18-1: Enable Microsoft Update to keep your computer secure.


    Windows is now up to date and will remain up to date when Microsoft releases new
    security patches for Windows 8.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_335_1.png)


    Figure 18-2: Select Windows and Microsoft app updates for installation.'
  merge: -1
