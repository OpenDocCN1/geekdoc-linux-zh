- pgno: 168
  md: '# Managing Your Configured Search Engines


    After you have all the search engines added to Internet Explorer, over time you
    might want to remove some or adjust the default search engine that IE uses. To
    do so, go to the advanced search settings found in Internet Options. Follow these
    steps to change the default search engine or remove a site:


    +   1. Open Internet Explorer.

    2. Click the gear icon and click Manage Add-ons.

    3. Click the Search Providers section.

    4. You see a list of the search engines that you have added to Internet Explorer.
    Select an entry from the list and click either the Remove or Set As Default button
    to make changes to the search configuration.


    Now that you understand the basics of search in Internet Explorer, you are ready
    to move on to the next section about creating custom search entries.


    # Adding Custom Search Entries


    Don’t like the search engines listed on the IE Add-ons site? This section shows
    you how to add any website that has a search box to Internet Explorer search box.
    You can do so in two ways. Website owners can add special HTML to their pages
    that link to an Open Search XML file that allows users to add their site to be
    searched. Because few websites actually support that feature, you can always add
    a site manually with a few tweaks. To add your own site, just follow these steps:


    +   1. Open Internet Explorer and navigate to *tweaks.com/546288*.

    2. Open another tab or browser and go to the site for which you want to add a
    custom search entry. On that site, use the site’s search function to search for
    **TEST** in all capital letters.

    3. When the search result page is shown, copy the URL from the browser address
    window. Then switch back to the IE Add-ons page you opened earlier.

    4. Paste the URL you copied in the previous step into the URL box on the IE Add-ons
    Create Your Own Search Provider page, as shown in Figure 10-2.

    5. Type in a name for the search provider.

    6. Click *Install*.

    7. Click **Add** on the Add Search Provider dialog box.'
  merge: -1
  img_proc: true
- pgno: 169
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_169_0.png)


    **Figure 10-2:** Paste the URL for the search results page in the Search Provider
    Creator.


    If everything worked properly, the site you added displays as a new option in
    the Internet Explorer Search Provider list.


    # Creating Registry Files to Import Sites to Search


    Another way to add sites to search in Internet Explorer is to write a registry
    file that can be imported into the registry. This enables you to add a site to
    search to multiple computers without your having to go through the manual step
    of using the IE Add-ons Search Provider Creator for each computer. The following
    example adds Tweaks.com to your search providers in Internet Explorer. Just follow
    these steps:


    +   Open the Start screen, type **notepad** and press Enter.


    +   Type the following registry code into Notepad:


    ```

    ```

    Windows Registry Editor Version 5.00


    [HKEY_CURRENT_USER\Software\Microsoft\Internet Explorer\SearchScopes\

    Tweaks]

    "DisplayName" = "Tweaks.com"

    "URL"="http://tweaks.com/search/?q={searchTerms}"

    ```

    ```


    +   Click **File**, and then click **Save As**.


    +   Change the **Save As type** to **All Files (\*.\*)**.


    +   Type **Tweaks.reg** as the filename and click **Save**.


    You have now created a custom search registry file that you can import into any
    computer’s registry by double-clicking the file. Keep in mind that this setting
    is a per-user registry setting, so every user on your computer who wants to use
    this must import it under that user’s account.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# Tweaking the Tabs


    Tabbed browsing has been improved in Internet Explorer to make it easier to identify
    and group related tabs together. This section shows you how to get the most out
    of tabs in Internet Explorer. Specifically, I show you how to use keyboard shortcuts
    and multitab homepages and how to customize the tabs to fit your needs.


    # Tab Keyboard Shortcuts


    Keyboard shortcuts allow you to get the most out of the new Internet Explorer
    tab interface by enabling you to do various lesser-known activities that can save
    time. These keyboard shortcuts require no setup; they are already active on your
    computer. Table 10-1 lists all the keyboard shortcuts that help you take control
    of tabs, and explains how to start the Quick Tabs feature.


    Table 10-1: Internet Explorer 10 Tab Keyboard Shortcuts

    | SHORTCUT KEYS | FUNCTION |

    | :--- | :--- |

    | Ctrl+T | Opens a new tab. |

    | Ctrl+Click | Holding Ctrl while clicking a link opens the link in a new tab
    but does not switch to the tab. |

    | Ctrl+Shift+Click | Holding these keys while clicking a link opens the link in
    a new tab and immediately switches to and displays the web page on the new tab.
    |

    | Ctrl+Shift+Wheel Click | Holding these keys while clicking the mouse wheel over
    a link opens the link in a new tab behind the current tab. |

    | Ctrl+W | Closes the current tab. |

    | Ctrl+Shift+T | Recovers last closed tab. |

    | Ctrl+Alt+F4 | Closes all background tabs. |

    | Ctrl+Tab | Moves to the next tab on right. |

    | Ctrl+Shift+Tab | Moves to the next tab on left. |

    | Ctrl+Q | Brings up Quick Tabs view, shown in Figure 10-3. This is disabled by
    default, but you learn how to enable it in the "Customizing Tabs" section later
    in this chapter. |'
  merge: -1
  img_proc: true
- pgno: 171
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_171_0.png)


    Figure 10-3: Use the Quick Tabs view in Internet Explorer 10.


    # Multitab Homepages


    From older versions of Internet Explorer, you are familiar with the concept of
    having a homepage—a website that is displayed when the web browser is loaded.
    In Windows 8, that classic browser feature has been mixed in with tabs. Now you
    can specify multiple websites to open by default when you load Internet Explorer,
    and you can display them in different tabs. Although this is not exactly a groundbreaking
    feature, it is a nice hidden feature that helps you customize your browser.


    Using a multitab homepage is easy when you know the secret. Just follow these
    steps to set up your own multitab homepage:


    +   1. Start Internet Explorer.

    2. Click the gear icon and then select Internet Options.

    3. When Internet Options loads, click the General tab. You see the Home Page section
    at the top of the screen. To use multiple sites as your homepages, just enter
    each URL on a separate line, as shown in Figure 10-4. When you have finished,
    click OK to save your changes.


    Click the Home button to see your changes.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_172_0.png)


    **Figure 10-4:** You can set multiple homepages for Internet Explorer in Internet
    Options.


    # ## Customizing Tabs


    Now that you have customized your homepages, you learn to fine-tune the tab settings
    to make them work the way you work. Back in Internet Options, you can change the
    way the tabs behave. You can alter the order in which new tabs open, specify how
    pop-ups are handled, and even customize what happens for various common actions.
    Follow these steps to get the Tabbbed Browsing Settings, and refer to Table 10-2
    for setting details and my recommendations:


    +   1. Open Internet Explorer.

    2. Click the gear icon and then click Internet Options.

    3. Locate the **Tabs** section on the **General** tab and click **Settings**.
    This loads the Tabbbed Browsing Settings window, where you can toggle more than
    a dozen IE tab settings (refer to Table 10-2 for setting details).

    4. Click **OK** to save your changes.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# Table 10-2: Internet Explorer 10 Tab Settings


    | SETTING | FUNCTION |

    |---|---|

    | Enable Tabbed Browsing | Enables support for tabbed browsing. Disable to remove
    tab support. |

    | Warn Me When Closing Multiple Tabs | Displays a confirmation box when closing
    IE with multiple tabs open. I like to have this one disabled. |

    | Always Switch To New Tabs When They Are Created | Changes focus to the last
    tab created. |

    | Show Previews For Individual Tabs In The Taskbar | Displays each tab as its
    own thumbnail on the new Windows 8 taskbar. |

    | Enable Quick Tabs | Allows the Quick Tabs feature shown in Figure 10-3 to operate.
    Keep this one enabled. |

    | Enable Tab Groups | Enables support for similar tab-grouping with colors. |

    | Open Only The First Home Page When Internet Explorer Starts | Instead of opening
    all your multitab homepages, it just loads the first one listed. |

    | When A New Tab Is Opened, Open One Of These Options | You can choose between
    a blank page, new tab page, or your homepage. |

    | Let Internet Explorer Decide How Pop-Ups Should Open | Allows IE to make pop-up
    decisions. I recommend picking either of the following two options instead. |

    | Always Open Pop-Ups In A New Window | Opens pop-ups in new browser windows.
    |

    | Always Open Pop-Ups In A New Tab | Opens pop-ups in the same browser window
    but creates a new tab. This works well for most websites, but I have found some
    pop-up windows that contain calendars do not properly close the tab when a date
    is selected. |

    | Open Links For Other Programs In A New Window | This setting opens a link that
    you clicked in any Windows application, such as your mail client, in a new IE
    browser window. |

    | Open Links For Other Programs In The Current Window | This setting opens a link
    that you clicked in any Windows application in a new tab. I recommend enabling
    this one. |

    | Open Links For Other Programs In The Current Tab Or Window | This setting opens
    a link that you clicked in any Windows application in the currently active tab.
    |'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'The following settings require a complete PC restart before they are active:


    +   - Show previews for individual tabs in the taskbar

    - Enable Quick Tabs

    - Enable Tab Groups


    # Fun with RSS


    In recent years, Really Simple Syndication (RSS) has been taking over the Internet.
    It is not uncommon to see websites offering various RSS feeds for their visitors
    that help them keep up to date with what is going on. With RSS, you can be notified
    when your favorite website posts a new article or when there is breaking news
    from a major news outlet.


    RSS is powered by a simple XML file hosted on websites that follow the RSS standards.
    The RSS reader software interprets the XML file and displays it for your viewing.
    Internet Explorer 10 has a new RSS reader that enables you to view your feeds
    on a nicely formatted display.


    Adding RSS feeds to Internet Explorer is a great way to personalize your setup,
    just like adding websites to your Favorites list. In this section, I show you
    how to subscribe to and configure RSS feeds in Internet Explorer. Then you fine-tune
    your RSS settings so that you always have the most up-to-date RSS content.


    # Subscribing to Feeds


    Adding feeds, or *subscribing* as it is commonly known, is an easy task when you
    know the URL of the RSS feed you want to read. Identifying an RSS feed has become
    easier in recent years because many sites have adopted standard RSS image buttons.
    Others have simply provided RSS text links that point to their XML file rather
    than a button.


    For this section, you need to find an RSS feed to use. Follow these steps to subscribe
    to an RSS feed in Internet Explorer 10:


    +   1. Open Internet Explorer.

    2. Right-click the gear icon and click Command Bar.

    3. Browse to one of your favorite websites, such as Tweaks.com, and click the
    RSS icon on the command bar.

    4. This causes Internet Explorer to launch into RSS feed reader mode. On this
    screen, click the Subscribe To This Feed link, as shown in Figure 10-5.

    5. The Feed Subscription box pops up on your screen. Type a name for the feed
    and click the Subscribe button.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_175_0.png)


    Figure 10-5: Subscribe to an RSS feed with Internet Explorer.


    You have now successfully subscribed to an RSS feed in Internet Explorer. Now
    that you have the feed set up in IE, you are ready to configure the RSS reader
    gadget that is part of the Desktop Gadgets.


    # ## Customizing Feed Settings


    Now that you have your feeds set up in Internet Explorer, it is possible to fine-tune
    the feed settings (for instance, how often the source is checked for updates,
    which is a valuable setting because it determines how fresh your data is from
    the feed). You can modify feed settings by using Internet Explorer again, in much
    the same way that you subscribed to the feed. Get started by opening Internet
    Explorer:


    +   1. After Internet Explorer has loaded, click the Favorites star button and
    then click the Feeds tab.

    2. Right-click the feed you want to edit and click Properties.

    3. When the Feed Properties window loads, I recommend that you go to the Update
    Schedule section and select Use Custom Schedule.

    4. Select a shorter update, such as 30 minutes, from the drop-down list.

    5. When you have finished adjusting all the feed properties, including the archiving
    settings that specify how many articles of a feed to hold on to, click OK to save
    your changes.'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# Using Add-ons in Internet Explorer


    Internet Explorer has a lot of new features, but is still behind in some of the
    features that other third-party web browsers offer. For one, Internet Explorer
    still does not have a spell checker built in to the application. Every time I
    post a message in a forum or to a website, I have to write it in Microsoft Word
    and then copy and paste the text into Internet Explorer because I’m not the best
    speller. This can be a hassle; after all, I don’t always want to have to complete
    this bulky process to ensure my spelling is correct. Instead, I can use an Internet
    Explorer add-on that adds spell-check capability within the web browser. In this
    case, I can forget about loading up Microsoft Word. I can just initiate a spell-check
    in the browser and let the add-on check my spelling in all text fields.


    This section is all about showing you some must-have add-ons for Internet Explorer,
    such as a spell-check component just mentioned. First, I show you how to use the
    ieSpell add-on to save your web posting from misspelled words. Second, I show
    you how to use an add-on that remembers all your usernames and passwords and other
    registration information for you.


    # Using ieSpell


    Internet Explorer 10 finally includes an integrated Spell Checker but it is limited
    only to text area tags instead of normal text boxes. This leaves a big gap in
    the coverage, which is why I recommend using ieSpell instead. ieSpell is a great
    add-on for Internet Explorer. I have been using it for years. This useful add-on
    is available free for personal use and for a small fee if used in a commercial
    environment. Installing ieSpell and using it in IE is easy. Just visit www.iespell.com
    and install it just like any other application.


    After you have ieSpell installed, restart any open Internet Explorer instances
    you previously had open; ieSpell is ready for action. When you need to use it,
    just right-click any text box on a web page and select Check Spelling from the
    context menu. That is all you need to do to initiate a spell-check. Immediately
    after selecting Check Spelling, you see a familiar spell-check interface that
    helps you ensure you make no spelling mistakes.


    # Using RoboForm


    Another great add-on for Internet Explorer is called RoboForm. It is a great little
    utility that memorizes all your usernames and passwords and other registration
    information. RoboForm fills in the forms for you so that you don’t have to type
    your personal information when you need to register for a website or buy something
    online. This will save you time and help you remember all your accounts and passwords.
    Visit www.roboform.com to download and install the add-on.'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'After you have RoboForm installed, restart IE, and the new toolbar appears.
    To get started using it, go to a website that you normally sign in to and fill
    out the fields. When you click the Submit or Login button, you are given the option
    to save the logon information. The next time you visit that site, you see a prompt
    on the toolbar that shows you the button to press so that the form fields are
    automatically filled in.


    # Advanced Internet Explorer 10 Features


    Developers, performance, and security are the main focuses of Internet Explorer
    10, but two major new features are for everyone. Accelerators are a new type of
    browser plug-in that accelerate your web browsing when you select and right-click
    text. Instead of copying and pasting text into a Search box or an address into
    a map site, you have the option to jump directly to a search for the selected
    text or a map of the selected address. Pinned Sites is another useful feature
    of Internet Explorer 10 that allows users to pin websites to their taskbar similar
    to normal desktop applications. Support for native taskbar features such as jump
    lists is included and is very helpful for websites that take advantage of the
    new feature and allow you to jump directly to specific functions or pages on their
    site such as posting an update for Facebook.com.


    In the next two sections I go into more detail about how these new features work
    and how you can take advantage of them in Internet Explorer 10.


    # Using Accelerators


    According to Microsoft, accelerators help you get everyday browsing tasks done
    without having to navigate manually to another website. For example, you are looking
    for a place to go to dinner and find the website of a good restaurant. You don''t
    know where the restaurant is so you need to get directions. Typically you would
    copy and paste the address into a mapping website to get directions. Accelerators
    in IE10 allow you to select the address, right-click, and see a map of the address
    in a small pop-up window, as shown in Figure 10-6.


    The best part of accelerators is the plug-in platform. You can easily customize
    your browser to add or remove accelerators.


    The IE Add-ons Gallery has hundreds of accelerators available. Some of the most
    popular accelerators enable you to do the following:


    +   - Map the selected address.

    - Search Google, Yahoo!, or Bing for the selected term.

    - Post the selected content to Facebook.

    - E-mail the selected content.

    - Search for a selected product on eBay.'
  merge: -1
  img_proc: true
- pgno: 178
  md: '+   - Translate the selected text.

    - Get the weather for a selected address or ZIP code.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_178_0.png)


    Adding an accelerator to your computer is similar to adding more search engines
    to your Search box in Internet Explorer 10. Just follow these steps:


    +   1. Open up Internet Explorer and navigate to tweaks.com/610469.

    2. Navigate through the available accelerators and click the logo. Then click
    the Add To Internet Explorer button.

    3. On the Add Accelerator screen, click Add.


    After you have customized your accelerators you can remove and change the default
    by clicking the gear icon and then clicking Manage Add-ons within Internet Explorer.


    # ### Using Pinned Sites


    Some websites have embraced a new feature in Internet Explorer called Pinned Sites
    that enable you to pin a website to your taskbar just like a normal application.
    Not only do you get easy access to your favorite web apps, but they are also displayed
    and behave differently from normal websites. The browser frame is customized to
    the colors of the website and even the taskbar Jump List is present, as shown
    in Figure 10-7.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_179_0.png)


    **Figure 10-7:** Pinned Sites display the taskbar Jump List.


    Pinning a website is simple; just drag the website icon in the address bar down
    to the taskbar. You will know you have the right website if you see the Drag To
    Taskbar To Pin Site icon when you hover over it.


    Not all websites take advantage of the advanced features of Pinned Sites that
    Microsoft makes available for developers to use. Microsoft maintains a list of
    the most popular “enhanced” websites in the IE Gallery. Head over to tweaks.com/404889
    to take a look and find some great sites to pin to your taskbar.


    # # Summary


    This chapter has been all about customizing one of the most used applications
    on your computer, the web browser. Internet Explorer has been greatly improved
    in Windows 8, and I hope you now understand how you can customize it to fit your
    specific needs. Earlier in this chapter, I showed you how to customize the search
    and tab features. Then I covered the new RSS features and how to subscribe to
    feeds. This chapter came to an end with some cool IE add-ons that will help you
    add more functionality, such as accelerators and pinned sites.


    The next chapter is all about customizing everything related to media in Windows
    8. I show you how to tweak Windows Media Player and how to build your own media
    center PC using the upgraded Media Center software included in the pro version
    of Windows 8.'
  merge: -1
  img_proc: true
- pgno: 180
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_180_0.png)


    # Customizing Windows Media


    This chapter shows you how to customize your experience by taking advantage of
    some of the Windows Media features and fine-tuning how they work. To get started,
    you use some great new audio enhancements to tweak how all types of media sound
    on your computer.


    # Adjusting Your Audio Experience


    The audio system has gone through a major upgrade in the kernel that is at the
    heart of Windows 8. Countless new features have been added, such as the ability
    to control the volume per application, as well as many others that are unnoticed
    by the end user and hidden away. This section talks about those lesser-known features
    and shows you how to take your audio experience to the next level. To do this,
    you enable and tweak the new sound enhancements available on all newer high-definition
    audio cards.


    The new audio enhancements are a collection of effects that enable you to do everything
    from boost the bass to optimize your surround sound using a microphone to get
    the perfect setup. These audio effects are located on your output device properties.
    Follow these steps to get to the Enhancements Settings tab:


    +   1. Open the Start Screen, type **Control Panel**, and hit Enter.

    2. Click Hardware and Sound.'
  merge: -1
  img_proc: true
- pgno: 181
  md: '+   3.  Click **Sound**.


    +   4.  The Sound Properties screen loads. Click the **Speakers** playback device
    and click **Properties**.


    +   5.  After the **Speakers Properties** window loads, click the **Enhancements**
    tab. All the enhancement effects are displayed, as shown in Figure 11-1.


    +   6.  Simply check the enhancement that you would like to enable. When selected,
    click the **Settings** button to fine-tune the operation.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_181_0.png)


    **Figure 11-1**: Windows audio enhancements are located in the Speakers Properties
    dialog box.


    As you can see, enabling and configuring the settings is easy to do, but before
    you start using these new enhancements, take a look at the next few sections that
    describe the enhancements in detail.


    # ## Bass Boost


    Bass Boost enables you to pump up the bass on your speakers. You can fine-tune
    the frequency and the level of the boost in dB, as shown in Figure 11-2.'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'Experiment with what is best for your speakers, but I don’t recommend setting
    it higher than 6 dB with most speakers. Otherwise, you might notice a loss of
    high notes in your sound.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_182_0.png)


    **Figure 11-2**: Windows 8 offers Bass Boost.


    # # Virtual Surround


    Virtual Surround enables you to output surround audio over stereo outputs to a
    receiver that supports Dolby Pro Logic or another matrix decoder technology to
    convert the signal into an analog surround sound system. This feature is useful
    only if you have a receiver that does not have a digital input and are forced
    to use an analog stereo input. Microsoft really should have called this feature
    something else. It really got my hopes up that it would simulate surround sound
    using my two stereo speakers the way those old Winamp plug-ins did several years
    ago.


    # # Room Correction


    The placement of your speakers and the size of the room greatly affect the sound
    quality when you are listening to music and watching movies. The Room Correction
    enhancement automatically calibrates the volume and delay for each speaker for
    the best possible sound quality. This cool enhancement works by playing various
    test sounds on all your speakers and using your microphone to record the result.
    Next, analysis of the results is preformed and you are presented with optimal
    settings for each speaker. Simply OK the calculated settings and your sound is
    automatically optimized for all applications that run on your computer, including
    Media Center.


    In my opinion, Room Correction is one of the best enhancements because it enables
    you to optimize your speaker system by just clicking a few buttons. I remember
    doing this with my surround sound receiver manually when I got a home theater
    system. This feature would have saved me a lot of time, and the end result produces
    better sound than the human ear could ever match.'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'Using Room Correction is simple. While on the Enhancements tab, check the option
    to enable it, click the Settings button, and follow these steps:


    +   1. When the Room Calibration Wizard has loaded, click the Next button on the
    opening screen.

    2. Select the microphone input you would like to use for the test. Make sure that
    you have a microphone plugged in to that input on your sound card. You can use
    any microphone for the calibration. If you have a studio-quality, omnidirectional
    microphone, check This Is A Flat-Rate, Professional Studio Microphone. Click Next
    to proceed.

    3. Position your microphone where you sit in your room. Make sure you elevate
    the microphone to roughly the height of your ears. For example, it is better to
    place your microphone on the armrest of a chair instead of the seat. Also make
    sure that your microphone is pointing straight up. When you are ready for the
    calibration test, click Next. It is best to leave the room when the test is running.

    4. When the test is finished, click Next to view the results.

    5. The results of the test for each channel are displayed, as shown in Figure
    11-3. When you are ready to apply the settings, click Finish.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_183_0.png)'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'After the Calibration Wizard is finished, the Room Correction enhancement setup
    is finished and becomes active immediately.


    # ## Loudness Equalization


    Many different sources of audio exist on your computer and among all these sources,
    the volume can vary drastically. Even within the sources, the volume can vary.
    For example, if you are watching a movie in Media Center, at times you can barely
    hear people talking but the background music in other scenes is very loud. The
    Loudness Equalization enhancement helps solve these problems by dynamically adjusting
    the volume on all the inputs so they all sound constant.


    The Loudness Equalization enhancement has only one setting, which enables you
    to fine-tune the sample period. Click the Settings button to adjust it.


    # ## Headphone Virtualization


    Available only on headphone devices listed on the Playback tab, Headphone Virtualization
    enables you to simulate a surround sound system when using headphones. Say you
    are watching a DVD on your laptop on a trip; using this enhancement, you can enable
    special audio effects that simulate a five-speaker surround sound system using
    only two speakers. If you use headphones often, definitely give this enhancement
    a try.


    # # Customizing Windows Media Player


    Windows Media Player has not seen significant changes in Windows 8 but the major
    improvements from Windows 7 remain. The interface includes the popular mini player
    known as Now Playing mode, and a streamlined interface browses through your collection
    of music, movies, and videos with cover art. As with to Windows Explorer, you
    can customize almost the entire user interface to your liking. The next few sections
    show you how you can visually tweak Windows Media Player as well as customize
    the operation using some lesser-known features. I start by showing you how to
    tweak the look.


    # ## Tweaking the User Interface


    The user interface can be divided into two separate areas to tweak: how you navigate
    and how the information is displayed. Depending on your personal taste, Windows
    Media Player may be too busy for you, so you might want to cut down on the navigation
    options that are displayed to make a more slim'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'and streamlined interface. The next two sections show you how to adjust the
    navigation and how the information is displayed.


    # Adjusting Navigation


    Navigation in Windows Media Player 12 was updated to provide a cleaner and easier-to-use
    interface. The list on the left side can be fully customized to your liking. You
    can remove any of the items and display additional details. Just follow these
    steps:


    +   1. While in Windows Media Player 12, click Organize and then Customize Navigation
    Pane.

    2. Scroll through the list and check each item you want to display. Remove the
    check to hide an item, as shown in Figure 11-4.

    3. To clean up the interface, you can also hide the Music Services that show up
    on the bottom of the Navigation pane by removing the check next to Show Music
    Services.

    4. Click OK to save your changes.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_185_0.png)


    Figure 11-4: Adjust Media Player navigation.'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# ## Adjusting Views


    After you have the layout of the panels set up the way you want, you can also
    modify the way the information is displayed in the main pane that lists your media.
    By default, the Icon view is activated. This is a basic view that shows the album
    cover, title, and artist name. A Tile view is also available that adds the year
    and your star rating to the screen in addition to what is shown with the Icon
    view. The Details view provides the classic list view of the media.

    You can modify the active view for the main panel by clicking the View Options
    icon, as shown in Figure 11-5, and selecting the view.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_186_0.png)


    **Figure 11-5:** Choose a Media Player view option.


    # ## Sharing Your Library


    One of the lesser known but very useful features that I always enable when customizing
    Windows Media Player is the ability to share my music library with other computers
    in my home. I have a few different computers and laptops at home that I use for
    development for my websites and other purposes. Instead of loading my personal
    music collection onto each computer, it is much easier to set'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'it up on just one and then share that music library. Then, on any of my computers
    also running Windows Media Player, the library is automatically discovered and
    I can connect to it and listen to my music no matter what device I am on.


    You have two different ways to share your music locally: through a Homegroup that
    also shares files other than media, or through the Network and Sharing Center.
    Homegroups are great for beginner users, but I like to do it the old way that
    provides more control. I show you how to configure sharing with the Network and
    Sharing Center to show that you don''t need to use a Homegroup to share your library.


    Although this feature is easy to use, it is not as simple to set up as a Homegroup.
    Follow these steps to enable it on your computer:


    +   1. Open the Start screen, type **Control Panel**, and hit Enter.

    2. Type **Media Streaming Options** in the Control Panel Search box.

    3. Click Media Streaming Options, listed under Network and Sharing Center.

    4. Click the Turn On Media Streaming button if visible.

    5. Type in the name of your media library and select which devices on your local
    network you want to have access to your library, as shown in Figure 11-6. By default,
    Allow All Devices is selected, so any new devices that come online after you configure
    the sharing automatically have access.

    6. Click OK and you are finished.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_187_0.png)


    Figure 11-6: Configure your media streaming options.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# ## Sharing Your Library over the Internet


    New to Windows 8 is the ability to access your library at home over the Internet.
    Known as Internet Home Media Access, it is very helpful when you want to listen
    to a song or play a video clip from your home library when away from home. Using
    a Windows Live ID, you can link Windows Media Player on your laptop to Windows
    Media Player on your desktop at home. The process of setting everything up is
    rather complex:


    +   1. Start Windows Media Player if it is not already started. Then click **Stream**
    on the menu bar and **Allow Internet Access To Home Media**.


    +   2. Select **Allow Internet Access To Home Media** on the confirmation screen
    as shown in Figure 11-7.


    +   3. Internet Home Media Access is set up as shown in Figure 11-8.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_188_0.png)


    **Figure 11-7**: Enable home media access.


    You have finished configuring your computer to share its library. Now you need
    to set up your laptop, tablet, or another home device to access your home library.


    If you ever want to disable Internet access to home media, just click **Stream**
    on the menu bar and select **Allow Internet Access To Home Media**. Then click
    **Do Not Allow Internet Access To Home Media**.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_189_0.png)


    Figure 11-8: Click OK on the Internet Home Media Access confirmation screen.


    # Using Audio Effects


    Windows Media Player has a long history of supporting various third-party audio
    and video plug-in effects, as well as a collection of built-in effects and features
    that are often hidden to the normal user. In this section, I show you how to turn
    on a few of the best built-in effects to help you customize and improve your Windows
    Media experience.


    # Accessing Hidden Effects


    The simplified user interface of Windows Media Player has limited the access to
    some of the more powerful features, such as audio effects. Accessing these effects
    is not as easy as it was in earlier versions, but it is not a huge annoyance,
    either, after I show you the tricks.


    In Windows Media Player 12 the audio effects can only be found in the Now Playing
    mode. Click the icon in the lower right of the window to switch to Now Playing
    mode, as shown in Figure 11-9.


    When in the mini player mode known as Now Playing mode, right-click the application
    and expand Enhancements. Then select the effect you want to use.


    Using the various enhancements is very simple after you have them displayed. Take
    a look at the few new sections for a quick overview of some of the more useful
    effects to use and customize.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_190_0.png)


    **Figure 11-9:** Switch to Now Playing mode in Windows Media Player to find the
    audio effects.


    # ## Crossfading and Auto Volume Leveling


    Ever wish that Windows Media Player would gradually fade out of one song and into
    the next as other popular media players do? Windows Media Player has had this
    feature for quite some time, but it was buried in a horrible UI so many people
    never even knew it was there. Using this feature enables you to set a custom period
    where the end of one song fades in with the beginning of the new song, creating
    a smooth transition between songs without any dead air.


    When Crossfading is selected, click the **Turn On Crossfading** link and drag
    the slider toward the right to adjust the time the two songs will be faded together,
    to a maximum of 10 seconds.


    Additionally, you can turn on auto volume leveling to make sure that the loudness
    of each song is relatively the same. This prevents you from having to adjust your
    volume manually between songs that were recorded at different volumes.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# Graphic Equalizer


    The graphic equalizer enables you to play around with the levels of different
    frequencies to help you make the song or video sound perfect on your specific
    speaker setup. Different types of music often require unique levels of values
    on the equalizer. Experiment with the different sliders or select one of the preset
    equalizer settings by clicking Custom.


    # Play Speed Settings


    Play speed settings are more of a fun feature than a customization. Still, I figure
    it is worth mentioning because it can provide hours of fun for the right person
    or help you fast forward through a long file. When a song is playing, slide the
    slider to the right to speed up play or to the left to slow it down.


    # Quiet Mode


    Think of this as auto volume leveling for just one song. It minimizes the differences
    between the loud and soft parts within a song.


    # SRS WOW Effects


    The WOW effect provides a 3-D sound effect that gives more depth to your audio.
    This effect also offers a True Bass filter that increases bass.


    # Video Settings


    Customize your standard video color setting here. You can modify Hue, Saturation,
    Contrast, and Brightness.


    # Customizing Media Center


    Windows Media Center is an optional component that can be installed on Windows
    8 Pro edition. The refined interface and support for many new technologies such
    as Internet TV, where you can watch full-length TV shows for free, is identical
    to Windows 7. Over the years, Windows Media Center has matured into a valuable
    component of Windows, providing users a high-quality and polished interface to
    explore all types of media from an interface that you can control with a remote
    control. Additionally, Media Center in Windows 8 includes support for Clear QAM
    channels (unprotected channels on digital cable) so you can pick up your local
    channels for free in HD from your cable provider (local channels on digital cable
    are typically unencrypted).


    In this section, I show you how to customize and extend the functionality of your
    Media Center. I start by showing how to turn your PC that has Media Center but
    no TV tuner into a DVR by adding a TV tuner. Then, I dive into'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'customizing the operation, followed by cool Media Center add-ons that will
    enhance your experience.


    # ## Installing Windows Media Center


    Windows Media Center is more difficult to install on Windows 8 than in previous
    editions of Windows. First, you must have Windows 8 Pro edition. No other edition,
    including Enterprise, will work. Next, you must actually purchase the Windows
    8 Media Center Pack for $999 to be able to run Media Center.


    You have two methods to install Windows Media Center. The correct method depends
    on your situation. Follow the relevant steps in the following sections to install
    Media Center on your PC.


    # ### *Purchase the Windows 8 Media Center Pack*


    If you have not yet purchased the Media Center add-on, it is very easy to do within
    the new Add Feature utility that is part of Windows 8. Just follow these steps:


    +   1. Open the Start screen and type **Add Features**.

    2. Click Settings to change the search scope.

    3. Select Add Features To Windows 8.

    4. Click I Want To Buy A Product Key Online.

    5. Click the Choose button under Windows 8 Media Pack.

    6. Enter in your billing information and follow the rest of the wizard.


    After you restart your PC, Windows Media Center is installed and ready to use.


    # ### *Using a Media Center Pack Product Key*


    If you already have a Media Center add-on product key from a promotion or other
    source, you can skip a few steps and jump right into installing Media Center.
    Follow these steps when you have a product key available:


    +   1. Open the Start screen and type **Add Features**.

    2. Click Settings to change the search scope.

    3. Select Add Features To Windows 8.

    4. Select I Already Have A Product Key.

    5. Enter your product key and follow the rest of the wizard.


    After you restart your PC, Windows Media Center is installed and ready to use.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# # Turning Your PC into a DVR


    So now you have Windows 8 with Media Center, but no TV tuner card installed. You
    are missing out on the main Media Center experience. With the help of this section
    and an inexpensive TV tuner card, I show you how to turn your PC into a fully
    functional DVR that will give any TiVo set-top box big competition.


    Before you can get started, I must go over some minimum system requirements so
    that you will be able to watch TV on your computer. Your computer must have a
    video card with at least 128MB of RAM.


    The most important aspect of adding a tuner to your PC is picking one that is
    compatible with Windows 8 Media Center. Several tuner cards are on the market,
    but not all are compatible with Windows 8 Media Center. One way to find a tuner
    that Microsoft has certified compatible is to use the Windows Logo product search
    page located at tweeks.com/798380 and search for compatible products.


    Select your OS and then set the product type box to TV Tuner. You may have better
    luck selecting Windows 7 Client instead of Windows 8 Client for the OS because
    not very many TV tuner cards are made specifically for Windows 8. All the Windows
    7 TV tuner cards should work with Windows 8.


    As you can see, you can add internal PCI cards and external USB devices to your
    computer. The following are a few more models that are known to work well on Windows
    8:


    +   - **Internal PCI-E:** WinTV-HVR-1250

    - **Internal PCI-E:** WinTV-HVR-2250

    - **External USB:** Diamond ATI TV Wonder HD 750 (TVW750USB)


    > **TIP** Use the forum at tweeks.com/245689 to find even more compatible TV tuners
    and tips to make them function properly if you have any compatibility problems.


    Installing the TV tuner is also easy, especially if you purchased an external
    USB tuner. Simply plug it in and install the drivers that came with the device.
    If you purchased an internal PCI or PCI-E card, just turn off your computer, unplug
    the power, open the case, and pop the card in an open PCI or PCI-E slot. Make
    sure to install the drivers after you power your PC back on, although in some
    cases Windows 8 installs the drivers automatically as it did with my PCI-E TV
    tuner card.


    After installing your TV tuner card, you are ready to get started configuring
    it in Windows Media Center. Make sure you have your antenna or cable feed'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'connected to the card. Follow these steps to get your Windows Media Center
    up and running:


    +   1. Open the Start screen, type **Media Center**, and then press Enter.


    +   2. If you are prompted with a setup wizard, select the Express option. You
    are going to configure your card a different way. After you are on the main Media
    Center screen, use the arrow keys to navigate down to the Tasks section. Then
    navigate to Settings and press Enter, as shown in Figure 11-10.


    +   3. On the Settings screen, select TV and press Enter.


    +   4. Select Set Up TV Signal and press Enter. At this point, you get a Tuner
    Not Found error if your TV tuner hardware is not installed properly. If this happens,
    make sure that you have the latest drivers for Windows 8 installed.


    +   5. Confirm your region by selecting Yes, Use This Region To Configure TV Services,
    and click Next.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_194_0.png)


    +   6. Type in your ZIP code and click Next.


    +   7. Click I Agree on the Program Guide Terms of Service screen and then click
    Next.


    +   8. If applicable, click I Agree on the Microsoft PlayReady PC Runtime EULA
    and then click Next. Microsoft PlayReady is downloaded and installed.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '+   9. After the TV signal detection has completed, Windows Media Center presents
    a list of its findings. On my PC it said it detected Digital Cable (ClearQAM)
    and Analog Cable. If your results are correct, click **Yes, Configure TV With
    These Results**. Otherwise, click **No, Let Me Configure My TV Signal Manually**
    and specify your setup. When ready, click **Next**.


    +   10. You are guided through setting up each of your sources, where you pick
    the provider so Windows Media Center knows what program guide to provide you with.
    Click through the guide for each source and select your TV signal provider. When
    you are finished, click **Next** on the TV Signal Configuration confirmation screen.


    +   11. Microsoft PlayReady updates are downloaded along with the TV program guide.
    The TV channel scan starts automatically, and this process takes several minutes.
    When it completes, click **Next** on the Results screen.


    +   12. The TV signal should now be configured. Click **Finish** to exit and start
    using your new DVR.


    Your Windows Media Center is now set up. You can begin to watch TV and set up
    shows to record in the guide. Now you are ready to further customize your Windows
    Media Center.


    # Creating Shortcuts for Windows Media Center


    Windows already includes shortcuts to start Windows Media Center on the Start
    screen. Next, you create advanced shortcuts that enable you to jump directly to
    different sections of Media Center; for example, how to make a shortcut that,
    when clicked, opens Windows Media Center and goes directly to the TV Guide. It
    is also possible to go directly to other sections, such as Live TV, Recorded TV,
    Pictures, Music, and even Sports Scores, as shown in Figure 11-11.


    This is all possible with a special `/homepage` command-line argument that the
    Windows Media Center executable uses. First, right-click your desktop, select
    **New**, and then click **Shortcut**. Next, enter one of the locations shown in
    the following options, depending on what you want to happen.


    +   - Start Windows Media Center and Go Directly to TV Guide: `%SystemRoot%\ehome\ehshell.exe
    /homepage:videoguide.xml`


    +   - Start Windows Media Center and Go Directly to Live TV: `%SystemRoot%\ehome\ehshell.exe
    /homepage:videofullscreen.xml`


    +   - Start Windows Media Center and Go Directly to Recorded TV: `%SystemRoot%\ehome\ehshell.exe
    /homepage:videorecordedprograms.xml`


    +   - Start Windows Media Center and Go Directly to Music: `%SystemRoot%\ehome\ehshell.exe
    /homepage:audio.home.xml`'
  merge: -1
  img_proc: true
- pgno: 196
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_196_0.png)


    +   - Start **Windows Media Center** and Go Directly to **Photos**: `%SystemRoot%\ehome\ehshell.exe
    /homepage:photos.xml`

    - Start **Windows Media Center** and Go Directly to **Radio**: `%SystemRoot%\ehome\ehshell.exe
    /homepage:radio.xml`

    - Start **Windows Media Center** and Go Directly to **Movies**: `%SystemRoot%\ehome\ehshell.exe
    /homepage:movies.library.browsepage.xml`

    - Start **Windows Media Center** and Go Directly to **Slideshow**: `%SystemRoot%\ehome\ehshell.exe
    /homepage:Slideshow.xml`

    - Start **Windows Media Center** and Go Directly to **Sports Scores**: `%SystemRoot%\ehome\ehshell.exe
    /homepage: SportsScoresPage.xml`


    After you make your selection, click **Next**, name the shortcut, and you are
    finished.


    # *Setting Where Recorded Shows Are Stored*


    Inside **Windows Media Center** you can choose the drive in which you want to
    record shows; however, you cannot choose the exact folder. With the help of a
    simple registry hack, you can specify exactly where and on what drive recorded
    shows are stored. Follow these steps to customize where your shows are stored:


    +   1. Open the **Start** screen, type `regedit` and then press **Enter**.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '+   2. Navigate through `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Media
    Center\Service\Recording`.

    3. Right-click **RecordPath** and select **Modify**.

    4. Enter the full path followed by a backslash (\), as shown in Figure 11-12,
    and then click **OK**. Reboot for the settings to take effect.


    The next time you record a show, the new location will be used.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_197_0.png)


    **Figure 11-12:** Modify the location where recorded shows are stored.


    # ### *Configuring Media Center to Look for Recorded Shows on a Network Share*


    Personal network attached storage devices are becoming more and more common in
    the home environment. I recently purchased a 1TB NAS (Network Attached Storage)
    that I use to back up all my personal documents as well as store recorded TV shows.
    I have my Media Center recording shows all the time, so the hard drive on my desktop
    fills up very quickly. For the shows that I want to keep, I move the file from
    my record folder to a special folder on my NAS that I have configured Windows
    Media Center to watch and play files from. This is possible with a few setting
    changes within Media Center.


    Follow these steps to configure Windows Media Center to watch for recorded shows
    in locations other than the main record folder:


    +   1. Open the Start screen, type **Media Center**, and hit Enter to start up
    Media Center.

    2. After it has started, navigate to **Tasks** with arrow keys and then select
    **Settings** and hit Enter.

    3. Click **Media Libraries**.'
  merge: -1
  img_proc: true
- pgno: 198
  md: '+   4. Select the Recorded TV media library and click Next.

    5. Select Add Folders To The Library and click Next.

    6. Select Let Me Manually Add A Shared Folder and click Next.

    7. Type in the shared folder path, such as \\Server123\SharedFolder, and also
    a username and password that has access to the shared folder. Click Next when
    ready to connect to the share.

    8. Click Yes, Use These Locations on the confirmation screen and then click Finish.


    After you have added the new network share to your library, you can click the
    green button in the top right of the Media Center window to return to the main
    menu. You are now able to watch recorded shows that are stored on another computer.


    # Using Third-Party Windows Media Center Add-Ons


    Many very useful and cool third-party add-ons are available for Windows Media
    Center that really help you get even more out of it. As Windows Media Center is
    becoming increasingly popular, even more add-ons are being developed and released.
    The following is a list of some of the best add-ons available now for Windows
    8 Media Center:


    +   - **TwitterMCE** ([http://tweaks.com/318798](http://tweaks.com/318798)): Tweet
    directly from Windows Media Center while watching or listening to your favorite
    media.

    - **Hulu Desktop** ([http://tweaks.com/997439](http://tweaks.com/997439)): Integrate
    Hulu Desktop into Media Center with this helpful add-on.

    - **MCEBrowser** ([http://tweaks.com/467327](http://tweaks.com/467327)): Remember
    Microsoft''s WebTV? Make your own WebTV and browse the Web on your television
    with this add-on and Windows Media Center.


    Most of the Windows Media Center 2005 add-ons also seem to work well in Windows
    8 Media Center. Visit [http://tweaks.com/455938](http://tweaks.com/455938) for
    even more Media Center add-ons that will work in Windows 8 Media Center.


    # Summary


    This chapter covered almost every aspect of Windows Media. You started with tweaking
    your audio settings with the cool new features such as Virtual Surround sound
    and Room Correction. Then you moved on to customizing Windows Media Player 12
    and taking advantage of its new features. Finally, I'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'showed you how easy it is to add a TV tuner to your computer and turn it into
    a full-blown DVR that you can customize in many ways.


    This is the last chapter of the second part of *Windows 8 Tweaks*. In the next
    part, I change the topic a bit—to increasing the performance of Windows 8. You
    begin by analyzing your system to get a good understanding of your computer hardware
    capabilities.'
  merge: -1
  img_proc: true
