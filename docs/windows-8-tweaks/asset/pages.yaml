- pgno: 374
  md: '# ## Disabling Add-Ons


    Internet Explorer, Firefox, and Chrome have become more secure over the years
    but there is still more to do. The most popular attack vector, meaning how PCs
    are attacked, is through browser add-ons or plug-ins. In fact, the most common
    attacks these days spread when popular websites are hacked and users with affected
    plug-ins visit. Java is the most attacked at the moment, with new patches coming
    out what seems like every week. One way to protect your PC is to disable plug-ins
    that you don’t absolutely need.


    Many applications install a browser add-on even though you may never intend to
    use it. Java is the perfect example. I use a few desktop applications that were
    written in Java, but I never use any web applications written in Java.


    All web browsers allow you to disable add-ons for performance and security reasons.
    I highly suggest you disable all browser add-ons that you don’t absolutely need
    to make your PC much more secure. In Chapter 17, I covered how to disable add-ons
    in Internet Explorer, Firefox, and Chrome to speed up performance. You can use
    the exact same procedure to disable add-ons for security.


    # ## Sandbox Internet Apps


    Sandboxing is a technique used to provide an extra layer of security to any type
    of application by containing the execution within an isolated environment. Any
    changes the application makes to your system, such as saving or downloading a
    file, are virtualized and redirected to keep everything within the sandbox. The
    application running within the sandbox only has read access outside of the box,
    so it is impossible for the application to do any permanent harm except destroying
    itself. In that situation, the sandbox just needs to be reset and you have a fresh
    environment.


    Running your web browser in a sandbox is the safest way to browse the web. It
    doesn’t matter if someone finds an exploit in the browser or an add-on because
    everything is contained. But just about any application can be run in a sandbox,
    including your mail client and even an untrusted application you just downloaded
    to try out.


    Sandboxie is provided by a special utility that runs the application in a mode
    that hooks the changes made to the system so the sandboxing utility can redirect
    them. The most popular sandboxing utility for Windows is called Sandboxie by Ronen
    Tzur. Download and Install Sandboxie from http://tweaks.com/508053. Ignore the
    compatibility warnings; the author claims it works on Windows 8 and my tests back
    that up.


    When Sandboxie is started for the first time, it creates a sandboxed Internet
    Explorer automatically. You can find the shortcut for that on your desktop. You
    can run additional applications within the sandbox by right-clicking Sandbox DefaultBox,
    and then clicking Run Sandboxed and Run Any Program, as shown in Figure 19-8.'
  merge: -1
  img_proc: true
- pgno: 375
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_375_0.png)


    Run any application in a sandbox with Sandboxie.


    # Defending Against Spyware, Malware, and Viruses


    Spyware and other malware have become the largest annoyance on Windows for the
    past decade. Often hidden in downloads that appear innocent, these programs can
    spy on your computer activities and report home various information about your
    computer habits. Adware is another menace that is closely related to spyware.
    Just as with spyware, it can be secretly installed on your computer and monitor
    what you do. Then, when the time is right, it displays relevant advertisements.
    Did you ever visit eBay.com and then notice an advertisement for Ubud.com, one
    of eBay’s competitors, pop up on your screen? If so, then you might be infected.


    Your computer can become infected in a number of ways. The most common is by visiting
    a website and downloading a free game, emoticons for an instant messenger, or
    a browser utility such as a search toolbar. Often these utilities are spyware
    themselves and are also bundled with other spyware and adware. Unfortunately,
    users never seem to read the Terms of Service agreements that are presented when
    they install these free apps on their computer, and pass right over the notices
    that this software will display ads and monitor your browsing habits.'
  merge: -1
  img_proc: true
- pgno: 376
  md: 'Another common method attackers use to infect your computer is through exploits
    in the applications you use the most, such as your web browser. The browsers are
    becoming much more secure, but as I discussed earlier, the plugins or add-ons
    that run within them are getting attacked the most.


    In Windows 8 it is getting much more difficult for outsiders to install software
    that you don''t want on your computer because of User Account Control for anything
    that requires administrative rights. If something is installed, it is because
    you authorized it when you clicked Allow in the UAC authorization box or via an
    exploit. What do you do if you made a mistake or if your PC was exploited? The
    next section shows you how to use the updated Windows Defender utility to protect
    your computer and clean it of any spyware threats.


    # ## Using Windows Defender


    Windows Defender in Windows 8 has been completely revamped. It is the result of
    the combination of the anti-spyware utility, previously called Windows Defender
    in Windows 7, and Microsoft''s antivirus utility called Microsoft Security Essentials.
    For the first time, Microsoft has built antivirus and anti-malware protection
    into Windows and it''s turned on by default.


    I was a big fan of the Microsoft Security Essentials for Windows 7 antivirus protection,
    so I''m excited that Microsoft merged its two security utilities into one and
    included it on every Windows 8 box.


    Windows Defender works similarly to any third-party antivirus utility. It runs
    in the background and scans every file opened and also performs entire system
    scans. The signature definitions that it uses are updated very often and are also
    assisted by Microsoft Active Protection Service (MAPS) to find out about new,
    unknown malware that is not yet widespread. When Windows Defender finds a file
    that looks suspicious but does not know exactly what it is, it sends that information
    back to MAPS for tracking.


    # *Scanning Your Computer*


    Windows Defender is very effective at scanning your computer. By default, Windows
    Defender is configured to run a quick scan daily. If you ever notice something
    strange happening to your computer or just want to perform a full system scan,
    follow these steps:


    +   1. Open the Start screen, type **Windows Defender**, and press Enter.

    2. After Windows Defender loads, click **Full** and then click **Scan Now** as
    shown in Figure 19-9.'
  merge: -1
  img_proc: true
