  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_337_0.png)


    **Figure 18-3:** Secunia PSI shows that this is a secure computer.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_337_1.png)


    **Figure 18-4:** Secunia PSI shows what is vulnerable on this computer.'
