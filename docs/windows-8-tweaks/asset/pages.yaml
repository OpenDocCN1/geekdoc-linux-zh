    - Details

    - Tiles

    - Content


    The icon size views are self-explanatory, but the remaining views are different.
    List view fills the window with small icons and labels in multiple rows and columns.
    Details view arranges the folders and files in one long column with additional
    file properties. Tiles is similar to the List view but with larger icons, as shown
    in Figure 9-8.


