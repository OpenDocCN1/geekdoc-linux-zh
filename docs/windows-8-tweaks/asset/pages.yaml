    # # Customizing the Ribbon


    The ribbon interface in File Explorer provides a new way to navigate the interface.
    First appearing in Microsoft office, the ribbon was intended to make it easier
    for users to access hard-to-find features. A similar version of the ribbon was
    included in File Explorer for the same reason, to make it easier to use. The next
    two sections will help you customize how the ribbon appears and the quick access
    menu.


    # ## Visibility


    Show the ribbon or collapse it and hide it from view. This is one of the more
    difficult preference questions. Even the folks at Microsoft took some time to
    make up their minds. For most of the preview builds of Windows 8, the ribbon was
    displayed by default but was hidden in the final release builds.


    If you like minimalist user interfaces without distractions, hide that ribbon
    right away. But if you like having all of your options easily visible, the ribbon
    may be for you. Either way, changing the default behavior is very simple—just
    click the up or down arrow on the far right of the window next to the help icon.
    Your setting is automatically saved for the next time you open File Explorer.


    # ## Quick Access Toolbar


    Every Microsoft ribbon includes a quick access toolbar in the title bar of the
    application window. This toolbar provides you with easy access to your most popular
    items. In Windows 8 File Explorer you can add the following items to the toolbar:


    +   - Undo

    - Redo

    - Delete

    - Properties

    - New Folder

    - Rename


    You can also select an option to display the quick access toolbar below the ribbon
    instead of on top.'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'You can access all of these options by clicking the down arrow to the right
    of the quick access toolbar on the title bar of any open File Explorer window.
    Then, check the item you want to display by selecting it.


    # ## Modifying File Associations


    Every time you click a file, Windows checks the registry to find the default program
    to open the file. Then, Windows loads that application and tells the application
    which file to open. This is something that you encounter almost all the time when
    you are using your computer. Often, when you install many programs on your computer,
    programs start to compete over which is going to be the default program to open
    a file.


    One of the most common situations for this is when you install a bunch of similar
    applications. For example, I primarily use WinAmp for playing my music. When Apple
    releases a new version of iTunes, however, I usually install it to check out the
    new features. The next time that I try to play a CD or listen to an MP3, the music
    always opens in iTunes. My file association for my music has been stolen by iTunes.
    How do I take control of my file associations again? The following two sections
    show you how you can customize the default launch application for any file type
    on your computer, as well as how your file types look.


    Windows Explorer uses information stored in the registry to find out what application
    is used to open a specific file type. This information is stored in the **HKEY_CLASSES_ROOT**
    section. With the Registry Editor, it is possible to browse to that key and find
    the file type that you want to change and edit some keys. However, there is a
    better way to do this in Windows 8.


    Windows 8''s Default Programs utility enables you to change file association information
    without having to deal with the registry class ID. Just follow these steps to
    change the default launch app for any file type:


    +   1. Open the Start screen, type **Default Programs**, and hit Enter.

    2. When the Default Programs utility loads, select **Associate A File Type Or
    Protocol With A Program**.

    3. Scroll through the list and select the file type you want to change, as shown
    in **Figure 9-4**.

    4. Click **Change Program**.

    5. The program to which you want to change may be on the default Open With list.
    If not, just click **More Options**, scroll down, and then select **Look For Another
    App On This PC**.

    6. Click **Close**.'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'Your changes to file launch apps are activated immediately after you click
    Close to save your changes. Now you know how to fix your file associations when
    apps attempt to hijack them.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_153_0.png)


    **Figure 9-4:** Change your file associations.


    # # Customizing the Context Menu


    What is the context menu? It''s the menu that pops up when you right-click anywhere
    on your computer. Over the years, these menus have become more and more useful.
    However, with the extra entries in the context menu, they can become cluttered
    with options and features that you just don''t need. These next few sections show
    you how to get your menus back under control as well as how you can take advantage
    of the new features to make your own context menu entries.


    I start off by teaching you how to remove items from the context menus and then
    cover how to add and customize the menu components.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# Removing Items from the Context Menu


    Over time, your context menus can become cluttered with program entries from old
    programs that you may not use anymore. You might experience programs that take
    over all your context menus. Compression apps such as WinZip, WinRAR, or Picozip
    always end up adding program entries to all the context menus. I have Picozip
    installed on my computer and every time I right-click any file or folder, I see
    five entries from Picozip giving me different compression options. This can be
    a convenient feature, but if you don''t compress and extract zip files very often,
    you might not need the added convenience. Instead, you could remove these entries
    from your context menu, which will give your system a cleaner interface as well
    as a small performance boost if you have a lot of extra entries in your context
    menu.


    Removing these programs from your context menus can be a little tricky because
    they can be spread in different places in the registry. The only way to remove
    these types of entries is to edit the registry directly. Follow these steps:


    +   1. Open the Start screen, type regedit and then press Enter.

    2. When the Registry Editor appears, expand the HKEY_CLASSES_ROOT folder. A list
    of the file types set up on your computer displays.

    3. If the entry that you want to remove from the context menu appears in all context
    menus, such as the preceding Picozip example, you have to expand the * folder.
    Otherwise, expand the folder with the file extension you want to modify.

    4. After expanding the correct folder, expand the ShellEx and ContextMenuHandlers
    folders. Your registry path should be HKEY_CLASSES_ROOT\*\ShellEx\ContextMenuHandlers.

    5. Look through the list until you find the entry that you want to remove. Right-click
    the entry and select Delete. Identifying some of the programs is easy. For example,
    WinRAR is labeled WinRAR, as shown in Figure 9-5. However, you may run into some
    items that are listed using their application/class ID or a vague name. For those,
    do a registry search of the class ID (Ctrl+F), which is formatted as (xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx),
    to find other references that give you clues to what the ID belongs to. If that
    does not work, try doing a search on Google to see whether that turns up anything.

    6. After you are finished removing all the entries from your context menus, close
    Registry Editor and you are finished. Your changes will be in effect immediately.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_155_0.png)


    Figure 9-5: WinRAR’s context menu entry in the registry is clearly labeled.


    # Modifying the Send To Menu


    The Send To menu is one of the features of my context menus that I use the most.
    The ability to right-click any file and have a shortcut of it sent to the desktop
    is invaluable. How would you like to make it even more useful? It is very easy
    to add your own items to the Send To menu, such as folders to which you can send
    files. Do you have a folder in which you store all your music? How about a folder
    in which you store all your digital photos? Just follow these quick steps to add
    anything you want to your Send To context menu entry.


    > **TIP** If you do not see any of the folders that are required in this section,
    you might have Hidden Files turned on. Because these folders are hidden by default,
    you have to tell Windows to show all files. To do this, refer to the section on
    working with hidden files toward the end of this chapter.


    +   1.  Open File Explorer.

    2.  Click your Windows drive and browse through `Users\Username\AppData\Roaming\Microsoft\Windows\SendTo`.

    3.  You will see all the files that appear in the Send To menu. If you want to
    add an entry to the menu, just copy a shortcut to this folder.'
  merge: -1
  img_proc: true
- pgno: 156
