    list and make sure that only Temporary Internet Files and Temporary Files are
    checked.

    4. Click OK to run the cleanup.

    5. Hit Delete Files on the confirmation screen.


    The utility now runs and exits automatically when it is finished cleaning your
    hard drive.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_393_0.png)


