- pgno: 34
  md: '# CHAPTER 2

    # Installing Windows 8


    Now that you know about the various editions of Windows 8, you are almost ready
    to install Windows 8 on your computer. First, it is important to understand the
    differences between 32-bit and 64-bit Windows 8 because both versions are provided
    by Microsoft when you buy a retail box. In this chapter, I show you how to pick
    the right version for your computer hardware. Then I walk you through the installation
    steps and even show you some install tricks to get Windows 8 installed on computers
    without using an optical drive. In the end, I show you how to use advanced configurations
    such as dual-booting Windows 7 and Windows 8 on the same computer with virtual
    hard drive files, and also how to create a Windows To Go workspace with the Enterprise
    edition of Windows 8.


    # ## Understanding the Install Media


    Every Windows 8 retail box includes 32-bit and 64-bit media for two versions of
    Windows 8. The most common version used is the 64-bit version for a number of
    reasons that I’ll get to shortly, but the 32-bit version that has been around
    for ages is still in use for specific cases.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# 32-Bit or 64-Bit?


    Making its debut in April 2005, the first version of 64-bit Windows was released
    as Windows XP Professional x64 Edition. Although the 64-bit edition was a true
    64-bit operating system (OS), it was plagued by spotty driver support that limited
    its adoption. This was caused by the fact that the new 64-bit kernel required
    64-bit drivers for all hardware devices. This vastly cut down on the number of
    compatible hardware devices. Hardware manufacturers had little incentive to rewrite
    drivers for the niche operating system. That all started to change with the release
    of Windows Vista, which was the first Microsoft Windows release to come out in
    both 32-bit and 64-bit versions at the same time. Hardware manufacturers responded,
    and 64-bit drivers are now available for almost all modern mainstream hardware.


    The 64-bit Windows has become the standard choice for most users, and is typically
    the version preinstalled on a new Windows 8 PC. But what is the real difference
    between 32-bit and 64-bit Windows 8?


    Aside from the obvious fact that you need a 64-bit CPU to run Windows 8 64-bit
    (which just about any new CPU you buy today supports), other differences exist,
    such as the ability to use more RAM, additional processing power, and extra security
    features.


    The primary advantage of a 64-bit operating system is the ability to utilize the
    larger 64-bit registers that are a feature of the 64-bit CPU. This allows larger
    calculations to be performed with one cycle and also addresses and accesses significantly
    more RAM. With 32-bit Windows 8 the maximum number of memory addresses available
    is $2^{32}$, which equals 4 GB of RAM that can be used. The 64-bit Windows 8 can
    use up to 512 GB of RAM with the Pro and Enterprise editions.


    Also, some features are included only in the 64-bit version of Windows 8, such
    as PatchGuard. This is a helpful piece of technology that attempts to protect
    the kernel of the operating system from being patched by malicious or legitimate
    software. In my opinion, anything that tampers with the kernel is bad, because
    it can affect the stability of your system. Microsoft is trying to put a stop
    to this by implementing the PatchGuard feature and creating an API for legitimate
    software to interact with the kernel in a safer way.


    Some mathematics-intensive applications, such as rendering a 3D scene, also perform
    better on 64-bit Windows 8 when used with a 64-bit version of the rendering application.
    Encryption programs also seem to run faster on 64-bit Windows.


    Now that you know the benefits of the 64-bit version of Windows 8, it is important
    to decide which is better for your hardware. For me, RAM and driver support are
    the main decision factors. I tend to use 32-bit Windows 8 only on virtual machines
    for testing and compatibility of very old applications. I use 64-bit Windows 8
    on all of my hardware, so I can take advantage of more than 4 GB of RAM and the
    enhanced performance.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# # Installing from USB


    The Windows 8 retail versions include installation software on a DVD. That works
    fine for the majority of users, but it is a big problem for those who own laptops,
    tablets, or other computers without optical drives. If you don’t have an optical
    drive on your computer, you need to take some extra steps to install Windows 8.


    A few solutions to this problem exist, such as PXE (Preboot Execution Environment)
    network booting to a Windows Deployment Server (a feature of Windows Server 2008
    and newer). However, the most popular and easiest to configure is a bootable USB
    flash drive. This is my personal preference as well, because installing Windows
    8 from a USB flash drive is actually much faster than installing from a DVD.


    You need a 4 GB USB flash drive to have enough space to fit the entire Windows
    8 installation code on the drive. I found that the 4 GB SanDisk Cruzier works
    well for booting the Windows 8 installation code and seems to be compatible with
    a wide range of computers. However, just about any 4 GB USB flash drive should
    work these days.


    If you have physical media rather than a digital download ISO file, the instructions
    for creating boot media are slightly different. Follow the instructions relevant
    for your situation.


    # ## Creating the USB Boot Media from a Physical DVD


    This section is pertinent if you have access to a Windows PC, XP or newer, because
    you need DiskPart to be able to create the USB boot media.


    Before you begin it is important to understand that any data on your USB flash
    drive used to create the boot media will be permanently deleted because the process
    reformats the drive. Save any important documents to another location before proceeding
    to the next section.


    # ### Preparing the USB Flash Drive


    The partitioning and filesystem on the USB flash drive are important for booting.
    Only one partition can be on the device, it must be set to active, and the filesystem
    must be FAT32. Many computers with the new UEFI BIOS replacement have problems
    booting USB flash devices with any filesystem other than FAT32. Insert the drive
    into a Windows computer and follow these steps:


    +   1. After the drive has been recognized and installed on the computer, click
    the Start button, type **DiskPart**, and hit Enter.

    2. In the DiskPart window, type **list disk** and hit Enter as shown in Figure
    2-1.

    3. Locate the Disk # of your USB flash drive. You can easily find it by looking
    at the size column. Once you have the ID, type **select disk #** and hit Enter.
    (Replace # with the actual disk ID, such as 1.)'
  merge: -1
  img_proc: true
- pgno: 37
  md: '+   4. Type **clean** and hit Enter to destroy any partitions, file systems,
    and data that may currently be on the device.

    5. Now it is time to create the partition. Type **create partition primary** and
    hit Enter.

    6. For booting it is important to set the partition as active. Type **active**
    and hit Enter.

    7. As I mentioned earlier, the filesystem must be FAT32. Type **format fs=fat32
    label=win8boot quick** and hit Enter. This performs a quick format and labels
    the drive in one step.

    8. Type **exit** to close DiskPart. Your USB flash drive is now prepared for the
    next phase.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_37_0.png)


    # ## Copying the Installation Software


    The final step, now that you have your USB flash drive prepared, is to copy the
    code. If you are a super geek you can use some fancy xcopy or robocopy commands
    for this step, but this simple copy-and-paste procedure works just fine.


    Insert the DVD media into your PC and navigate to the drive on your computer that
    has the Windows 8 installation files. Select all the files, as shown in Figure
    2-2, and then right-click and select Copy.


    Navigate to the root of the USB flash drive, right-click and click Paste. The
    file copy can take a number of minutes, but after it is finished you can install
    Windows 8 quickly and on machines that don''t have an optical drive.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_38_0.png)


    **Figure 2-2:** Copying all Windows 8 installation source files


    # *Creating the USB Boot Media from a DVD Image*


    Different from a physical DVD, a DVD image or ISO file is what you get when you
    buy Windows 8 directly from Microsoft and digitally download your purchase. You
    can also get an ISO file for Windows 8 if you are an MSDN or TechNet subscriber
