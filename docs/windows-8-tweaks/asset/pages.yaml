  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_389_0.png)


    Figure 20-5: Set up IE to automatically clear temporary Internet files.


    # Running Internet Explorer 10 in Privacy Mode


    Internet Explorer 10 includes a new feature named InPrivate Browsing. This privacy
    feature prevents Internet Explorer from storing any data about your browsing session
    including cookies, history, and temporary Internet files. As soon as you close
    the browser, any trace of any websites you visited is gone. Additionally, toolbars,
    extensions, and third-party cookies are disabled to protect a third-party from
    spying on what websites you visit.


    I personally like to use InPrivate Browsing when I do online banking to add an
    extra layer of protection. Keep in mind, though, that InPrivate Browsing is not
    anonymous browsing. Should you do something illegal within InPrivate'
