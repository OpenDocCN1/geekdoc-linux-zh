    # Using Other Antivirus/Anti-Spyware Software


    Sometimes Windows Defender just doesn''t detect all the malware on your computer.
    For a second opinion, give these additional protection utilities a try:


    +   * ESET Online Virus Scan—http://tweaks.com/478357

