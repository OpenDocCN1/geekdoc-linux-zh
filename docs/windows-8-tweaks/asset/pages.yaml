  md: '# About the Author


    **Steve Sinchak** is an entrepreneur who has started many technology-related businesses.
    Steve currently runs Advanced PC Media LLC, which operates various web sites including
    Tweaks.com. Aside from writing for his websites and running Advanced PC Media
    LLC, he works as a Systems Engineer for a financial services company.


    Steve has been working with computers from an early age. Starting with an IBM
    AT with an Intel 80286 processor, 1 MB of RAM, and Windows 3.1, he taught himself
    how to make Windows run faster on his slow hardware. Driven by a strong curiosity
    to understand how it works, he spent countless hours researching and experimenting
    with the inner workings and features of Windows. Over the years, he has worked
    closely with all versions of Windows. Steve has received nine Microsoft Most Valuable
    Professional (MVP) awards for his contributions to the Windows community.'
  merge: -1
  img_proc: true
