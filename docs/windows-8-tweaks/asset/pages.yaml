- pgno: 130
  md: "# CHAPTER  \n8\n\n# # Customizing the Appearance of the Windows Interface\n\
    \nIn the past few chapters, you customized various parts of the operating system,\
    \ starting with the logon screen. After customizing the Start screen and the taskbar,\
    \ you spent some time customizing the desktop, too. This chapter shows you how\
    \ to customize what the entire user interface looks like by changing the theme\
    \ or visual style and fine-tuning the settings of both.\n\nIn the sections that\
    \ follow, you learn how to make major alterations in the way your computer looks\
    \ (much more than you've learned so far). First, I explain the differences between\
    \ a theme and a visual style, to clear up any possible confusion you might have.\
    \ Then you learn how to create an advanced theme. Next, I show you how to make\
    \ the legacy desktop easier to use on touch devices. This chapter ends by introducing\
    \ an easy way to give Windows 8 a completely different look with a third-party\
    \ skinning utility called WindowBlinds.\n\n# ## Working with Themes\n\nThemes\
    \ have been a part of Windows for a long time. Ever since Windows 95 was released,\
    \ themes made it possible to save the configuration of the fonts, colors, visual\
    \ style, wallpaper, mouse cursors, and even the sounds that are used. Throughout\
    \ the years, not a lot has changed in the theme world. Originally, you had to\
    \ buy Microsoft Plus to use themes, but now the ability to use themes is included\
    \ in all the latest Microsoft operating systems."
  merge: -1
  img_proc: true
- pgno: 131
  md: 'Why are themes still important to talk about even though they have been around
    so long? Because they provide a unique way to save all your computer''s visual
    settings and audio settings so that you can easily change all of them simultaneously.
    Additionally, Microsoft implemented some new secret features in themes that I
    will cover.


    # Changing the Current Theme


    When you install Windows 8, Microsoft includes a number of themes with different
    styles. Changing themes is very simple, so I''m not going to spend much time on
    it. Just follow these steps:


    +   1. Right-click the desktop and click Personalize.

    2. Scroll through the list and click the theme you want to apply, as shown in
    Figure 8-1. The theme will be active immediately.

    3. When you have selected the theme that you want to use, just close the Personalization
    window.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_131_0.png)'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'After you select the theme, the new theme is automatically applied. This process
    may take a few seconds if you select a theme with a different visual style such
    as Windows Classic or Windows 8 Basic.


    Now that you know how to change a theme, it’s time to make your own.


    # Downloading More Themes


    A number of sites will help you download more premade themes for Windows 8, complete
    with background images and sounds. Take a look at the following sites to find
    some more great themes:


    +   - **Microsoft**—tweaks.com/245527

    - **Tweaks.com**—tweaks.com/484131


    When you find a theme you like online, just download the .themepack file and double-click
    the file to install it. After it is installed it shows up below the included system
    themes in a new Installed Themes section.


    # Making Your Own Theme


    Making your own theme enables you to back up your visual changes to Windows 8
    easily so that you can distribute your settings to other computers or on the Internet.
    The most difficult part of the process is customizing all the little aspects of
    the visual elements that make up the user interface. The next few sections walk
    you through the process of fine-tuning the user interface and then show how you
    can save your changes and make your own theme file.


    # *Modifying System Sounds*


    Sounds can be assigned to many events in Windows, such as logging on, logging
    off, minimizing a window, and maximizing a window. Themes can also include sound
    scheme settings, so I recommend customizing your system sounds for any custom
    theme.


    Changing the event sounds is simple. Just follow these steps to launch and configure
    the Sound properties:


    +   1. Open the Start screen, type **mmsys.cpl**, and press Enter to launch the
    system Sound properties.

    2. After the Sound properties load, click the Sounds tab.

    3. To adjust the sound clip for a specific event, click the event that you want
    to modify by navigating through the Program Events list, as shown in Figure 8-2.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '+   4. When you have an event selected, the Sounds drop-down list becomes enabled,
    and you can select the sound clip that you want to use. You can select (None)
    from the top of the list if you do not want to use a sound for a specific program
    event. If you cannot find a sound that you like on the list, you can use the Browse
    button to pick a specific sound file on your computer to use.


    +   5. Here you can also enable or disable the Windows startup sound by checking
    the Play Windows Startup sound checkbox.


    +   6. When you have finished with your changes, just click OK to save your work.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_133_0.png)


    You have now finished customizing the sound events on your computer.


    # Customizing Mouse Cursors


    The mouse cursors are yet another item saved in the theme file. Many different
    pointer schemes are included with Windows 8. Although not all of them are the
    nicest-looking cursors, they can really help out in some situations. In'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'addition, Windows 8 includes special large mouse cursors so that the cursors
    will be easier on the eyes.


    To get your cursors set perfectly for your theme file, follow these steps:


    +   1. Open the Start screen, type main.cpl, and press Enter to open Mouse Properties.


    +   2. Click the Pointers tab.


    +   3. You have two options to customize the cursors. You can use the drop-down
    Scheme box to change all the pointers simultaneously to different styles by selecting
    a different cursor scheme from the list, as shown in Figure 8-3. When you select
    the different schemes, all the cursors change automatically. Alternatively, if
    you do not like the cursor schemes, you can individually select a cursor from
    the Customize list by scrolling through the list and selecting the cursor you
    want to change. Then click the Browse button to change it.


    +   4. When you have finished customizing your cursors, just click OK, and you
    are finished.


    Now you are ready to move on to customizing the visual style that the theme will
    use.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_134_0.png)


    Figure 8-3: Change the pointer scheme.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# Configuring Interface Color Settings


    On Windows 8 you can also customize the color and intensity of the interface.
    These settings are also saved in your theme file, so it is a good idea to customize
    them as well. Just follow these steps to customize the user interface colors:


    +   1. Right-click the desktop and select Personalize.

    2. On the Personalization screen, click Color on the bottom of the screen.

    3. Pick the color you want to use from the 16 on-screen options or click Show
    Color Mixer to set a custom color. Optionally, you can select the first item,
    as shown in Figure 8-4, which automatically sets the color of the interface to
    match your background wallpaper.

    4. Set the color intensity value that looks good to you.

    5. Click Save Changes.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_135_0.png)


    Figure 8-4: Adjust interface color settings.


    # Setting the Background Images


    Windows 8 includes the capability to set multiple background images that are automatically
    rotated at a user-set interval. This enables you to select any number of background
    images and they will automatically be changed with'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'a nice fade effect. You enable this feature on the normal change-background
    screen. Follow these steps to change the background image on your computer and
    enable a background slideshow:


    +   1. Right-click the desktop and click Personalize.

    2. Click Desktop Background on the bottom of the screen.

    3. Set the Picture Location box to Solid Colors or another image location.

    4. Next, click any image to set it as your background. If you want to set up multiple
    background images, simply hover over each image and check the box that appears.

    5. After all images are selected, configure the picture position and the change
    picture frequency settings. Click Save Changes when you are finished.


    # Saving Your Theme to a File


    You have now customized all the aspects of themes and are ready to create your
    own theme file into a theme pack file that includes all the resources your theme
    uses:


    +   1. Right-click the desktop and click Personalize.

    2. On the Personalization screen you will see a My Themes section on the top with
    one called Unsaved Theme. Right-click that theme and select Save Theme For Sharing.

    3. Type a name, select a location to which to save your .themepack file, and click
    Save.


    You have now created a theme pack for your theme so that you can easily change
    back to it when you customize the user interface in the future. Additionally,
    you can copy your theme pack to other computers or share it online. All the files
    used in your theme, including background images, are included in the .themepack
    file.


    # Automatic RSS Background Themes


    Now that you created your own theme, I''m going to show you how to enable a secret
    feature by editing your newly created theme file. This will allow your theme to
    automatically download and display new background images referenced from an RSS
    feed. As the RSS feed is updated with new backgrounds, your computer will automatically
    download and display them.


    Activating this feature requires manually editing your theme file inside a theme
    pack you created in the preceding section. You also need an RSS feed'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'from a website that adheres to the RSS enclosures standard and includes images
    as enclosures in the feed.


    You can identify compatible feeds by looking for the enclosure tag in the source
    of the feed for each <item>. For example, look for <enclosure url="http://www.site.com/image.jpg"
    type="image/jpeg" />. To learn more about the RSS enclosures standard, check out
    the Wikipedia entry at http://en.wikipedia.org/wiki/RSS_Enclosures.


    Now that you know of some sample feeds and how to identify other feeds, you can
    get started:


    +   1. First, you need to get to the .theme file packed inside the .themetpack
    or .deskthemetpack file you created earlier or from a file you downloaded online.
    In order to do that, you must enable viewing file extensions in File Explorer.
    When File Explorer is open, click on the View tab and then check File name extensions
    in the show/hide section near the right.


    +   2. Navigate to the directory where you saved your .themetpack or .deskthemetpack
    file and rename the file .cab. A theme pack file is nothing more than a compressed
    cabinet file.


    +   3. After you''ve renamed it to a cab file, open the file with any compatible
    compression utility such as WinRAR (www.rarlabs.com) or even with the native Windows
    Explorer shell and extract the .theme file within.


    +   4. After extracting the .theme file, right-click it and select Open With.
    Deselect the Use this app for all .theme files and then click More options and
    click Notepad.


    +   5. Now you will be able to edit the theme file manually. Scroll through the
    file and look for the [Slideshow] section. If this section already exists, delete
    it.


    +   6. Create a new [Slideshow] section by entering the following code at the
    bottom of the file in Notepad:


    ```

    [Slideshow]

    Interval=600000

    Shuffle=1

    RssFeed= http://feeds.feedburner.com/bingimages

    ```


    The value of Interval is listed in milliseconds, so 600000 means the wallpaper
    will change every 10 minutes. Feel free to change this value. When Shuffle equals
    1, shuffle is enabled (0 is disabled). Replace the value of RssFeed with the URL
    of a compatible RSS enclosure feed.


    +   7. Save the changes you made to the new .theme file and close Notepad. Make
    sure you change the Save As Type on the Save As dialog box to All Files (*.*)
    before saving so the .txt extension is not appended to the filename.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '+   8.  Navigate to the new file you saved, right-click, and select Open With
    and then Personalization CPL. This loads the file with the theme browser on the
    Personalization screen.


    +   9.  If your edits were successful, you should get an Apply Theme message asking
    you to Subscribe to RSS Feed. Click Download Attachments to process all images
    on the feed as shown in Figure 8-5.


    +   10. The images in the feed will be downloaded in a few minutes and applied
    as your background. The RSS background feed is now set up and should update once
    a day.


    If several minutes pass after the interval you set and the background still does
    not change, chances are there is a problem with your RSS feed.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_138_0.png)


    # Making the Desktop Interface Touch Friendly


    The new Metro style side of Windows 8 works perfectly with touch because it was
    designed with touch in mind from the start. Using the desktop interface on a touch
    device is often frustrating and slow. Desktop apps were designed for a keyboard
    and mouse, and using touch is much less accurate and can result in you selecting
    or clicking on the wrong item.


    The majority of the usability problems of the desktop are caused by the size of
    the items you need to work with. They are just too small. An easy way to'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'make the desktop interface more touch friendly is to make the most common elements
    you interact with on the desktop larger.


    # ## Supersize the Interface


    The best method to increase the size of the interface in Windows 8 is to increase
    the size of the fonts. That will make all of the touch targets larger as the fluid
    interface adjusts to fit the larger font size. Changing the font size is a little
    different in Windows 8. Follow these steps:


    +   1. Right-click the desktop and select Screen Resolution.

    2. Select Make Text And Other Items Smaller Or Larger near the bottom of the screen.

    3. Select Medium or Larger to change the size of all items. Alternatively, you
    can tweak the font size of specific items using the setting on the bottom of the
    screen as shown in Figure 8-6.

    4. Click Apply.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_139_0.png)


    **Figure 8-6:** Adjusting interface font sizes'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# Enable Large Icons


    Application or file icons are a very common touch target, so making them larger
    and easier to hit will go a long way toward improving the user experience. Enlarging
    them requires just a few clicks, but is slightly different depending on where
    the icons are located.


    # Desktop Interface


    Desktop icons are the easiest to change and I already covered this once, so I''m
    just going to quickly review. Right-click the desktop, select View, and then select
    Large, Medium, or Small Icons. If you have a scroll mouse you can hold down Ctrl
    on your keyboard and scroll the wheel on your mouse up for even more control.


    # File Explorer


    File Explorer natively has a number of views available that are great for touch,
    but they are not enabled by default. On my tablet devices, I like to set the default
    view to Large Icons, which provides helpful large touch targets that make selecting
    what I want very easy. Follow these steps to set Large Icons as your default view
    for all drives, files, and folders:


    +   1. Open File Explorer and navigate to any drive or folder.

    2. Click the View ribbon tab.

    3. In the Layout section, select Large Icons.

    4. Also on the View ribbon tab, click Options on the far right.

    5. Click the View tab of the Folder Options window.

    6. Click Apply To All Folders.

    7. Click Yes on the confirmation window.

    8. Click OK to close Folder Options and your change is active.


    # Skinning Windows 8


    Skinning Windows 8 is all about changing the look of the entire user interface
    with the help of third-party utilities and visual styles that enable you to make
    massive alterations to the look of Windows 8. By skinning Windows, it is possible
    to change the appearance completely and make it look like a different operating
    system, such as OS X, or something even more exotic. In the next sections, I show
    how you can use hacked visual styles as well as the lead skinning utility,'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'WindowBlinds, to customize the look of your computer. This will help you take
    customization to the next level.


    # # Using Hacked Visual Styles


    Windows 8 uses an enhanced skinning engine based off the engine found in Windows
    XP to display the non-glass interface as well as the new glass DWM interface.
    In Windows XP, the visual style engine used bitmaps stored in a resource file.
    The visual style''s resource file contains all visual elements, such as images
    of buttons and window components as well as some configuration files. In Windows
    8, the resource file has been modernized to include PNG images instead of bitmaps
    and is updated for the new interface design.


    You create visual styles for Windows 8 the same way you do for Windows XP, Vista,
    and Windows 7. You start with an existing visual style, such as the default visual
    style that is included in Windows 8, and use a resource hacking tool to replace
    the images within the file. After you have replaced all the resources in the file
    with PNG replacements and created a new visual style file, you are almost ready
    to use the hacked visual style.


    The last step before you can use any visual style that you downloaded or made
    yourself is patching the skinning engine files. The skinning engine in Windows
    8 will use only visual styles that have a Microsoft digital signature on the file.
    Visual styles that you make yourself by editing the resources or other visual
    styles that you download from the Internet no longer have a valid Microsoft digital
    signature because the file content has changed. To use hacked visual styles in
    Windows 8 you need to patch the system files that impose this digital signature
    requirement on visual style files.


    Thankfully, a number of users have released utilities that patch the digital signature
    requirement. One that I''m going to show you is called UxStyle Core written by
    Rafael Rivera. This utility patches the digital signature requirement in memory
    so it does not modify any files on your computer. The only catch is that UxStyle
    for Windows 8 supports only 64-bit systems.


    Before you get started using UxStyle Core, you need to download some Windows 8
    visual styles to skin the interface. The following are some sites that I recommend
    to find compatible visual styles:


    +   - DeviantArt Visual Styles—tweaks.com/925782


    +   - DeskModder—tweaks.com/167845


    +   - Windows 8 Themes—tweaks.com/351086


    Make sure you download only visual styles created for Windows 8. Windows Vista
    and Windows XP visual styles are not compatible. After you'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'have a few visual styles downloaded, you are ready to configure your computer
    to use them:


    +   1. Visit tweaks.com/841568 and download the latest version of UxStyle for
    Windows 8.

    2. After you have the utility installed, it is best to reboot your computer and
    then check your list of services (run services.msc) for the Unsigned Themes and
    ensure it is started.

    3. Next, you are ready to install a visual style that you downloaded earlier.
    Copy the .theme and corresponding files or folder to c:\Windows\Resources\Themes.

    4. Right-click your desktop and select Personalize.

    5. Scroll down to the Installed Themes section and select the theme that you just
    copied to the Themes folder. After a few seconds, your theme should be applied.


    Now I''m going to show you another way to change the look without using hacked
    visual styles.


    # ## Changing the Look of Windows 8 Via WindowBlinds


    Before visual styles were a part of Windows, the only method to change the way
    Windows looked was to use a utility from Stardock called WindowBlinds. When it
    first came out, it transformed the boring gray interface of Windows into an attractive
    and colorful experience. Now that Windows includes its own skinning engine, products
    like WindowBlinds seem less necessary. So, why am I even mentioning this app?
    Because the Microsoft engine will run only skins digitally signed from Microsoft
    unless you use a utility to get around the limitation. Additionally, the quality
    of visual styles available for WindowBlinds is typically higher than the hacked
    visual styles available.


    Using WindowBlinds is much easier than using hacked visual styles. Just download
    and install a copy from tweaks.com/514620.


    Then just select the style you want to use when running.


    You can always change your skin back to the default Windows 8 look if you do not
    like any of the skins offered by WindowBlinds. If you want more skins, the next
    section is for you!


    # ## Adding More Skins for WindowBlinds


    WindowBlinds has a strong skin base of thousands of skins that are easy to install.
    You can find them at the Stardock-operated site called WinCustomize. To get started,
    visit tweaks.com/797293 for a list of all skins available.'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'From the list of available skins, you can install a skin by clicking the Download
    link. It should automatically start to download. When the skin has finished downloading,
    WindowBlinds automatically loads it and prompts you by asking whether you want
    to apply it. After the skin has been installed, you can go back into the WindowBlinds
    Configuration screen to browse through the different versions and colors of the
    skin (assuming, of course, that the skin has multiple versions).


    # ## Summary


    This chapter focused on the most important part of customizing your computer:
    the user interface. The visual interface is by far the part of the operating system
    that has the most impact when it is customized. Using the tools and techniques
    presented in this chapter, you can completely change the way Windows 8 looks.


    The next chapter is all about customizing Windows Explorer, which is the program
    that you use to browse through all the files on your computer. I show you how
    you can customize the way it looks and works so that you can maximize its functionality
    to meet your needs.'
  merge: -1
  img_proc: true
- pgno: 144
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_144_0.png)


    # CHAPTER 9

    Fine-Tuning File Explorer


    You can customize many of the components and features of the updated File Explorer
    to make your Windows experience even better. This chapter shows you how you can
    customize Explorer and how to take advantage of some of the lesser-known features.
    It begins by showing you how you can customize the layout of the new Explorer
    interface. By the end of this chapter, you will have completely customized the
    Explorer features that enable you to browse through and create files on your computer.


    # Customizing Windows Layout


    Explorer in Windows 8 includes various new ribbons and panes, such as Details,
    Preview, and Navigation, that provide a wealth of information that might change
    the way you use File Explorer. By default, most panels are turned on, which gives
    a cluttered feeling to the Explorer interface. Personally, I like to get rid of
    the panes that I don''t use to speed up and streamline my File Explorer windows.
    In addition to the new panels, Explorer includes many other new features, such
    as the Favorites section, Libraries, Search, and of course, the ribbon. These
    next few sections show you how you can customize all of these.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# Customizing Panes


    The panes on the Explorer window are located on all sides of the window. Figure
    9-1 shows a typical Explorer window with all panes visible.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_145_0.png)


    As shown in Figure 9-1, the Navigation pane is on the left, and Preview is on
    the right. Each pane offers a different array of features that can either help
    your Explorer experience or clutter it up. Dive into customizing each of the different
    panes, and hack up Explorer to make it work the way you want.


    # The Navigation Pane


    The Navigation pane in Windows Explorer is divided into five key areas of information:
    Favorites, Libraries, Homegroup, Computer, and Network. You can think of the Favorite
    Links section as a sticky dock onto which you can drag any folder to create a
    shortcut for accessing it in the future. This enables you to access your common
    folders quickly and easily.


    You can think of libraries as a combined view of the contents of multiple folders
    that come predefined or are manually set up. Libraries are discussed in detail
    shortly.


    The remaining sections, which are collapsed by default, offer a tree-driven interface
    that resembles the classic Windows Explorer from previous versions of Windows.
    Now that you know the basics, you can customize everything on the Navigation pane.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# Adding and Removing Favorite Links


    You can manage your Favorite Links section in two different ways. The easiest
    is simply to drag and drop folders and saved searches onto the Favorites section
    to add them to the list. You can then remove items by right-clicking them in the
    list and selecting Remove. Alternatively, you can navigate to the Favorite Links
    folder that is located at `C:\Users\Username\Links`. There, you can easily copy
    and paste multiple folders or shortcuts at once to be added to the Favorite Links
    section.


    I like to drag my hard drives into the Favorites section so I can quickly jump
    to them when needed.


    # Removing the Navigation Pane


    If you want to have a super clean interface and have no use for the Favorite Links
    and Folders sections, you can easily remove the entire pane from view. Follow
    these steps to disable this view:


    +   1.  While a folder is open and showing the Navigation pane, click the View
    tab to open the View ribbon.

    2.  Click the Navigation Pane button and then Navigation Pane on the menu to remove
    the entire left-hand pane.


    When you close the active window, the changes are saved to the Registry.


    # Enabling Automatic Tree Expansion


    As you navigate through folders on your PC, you can configure the Navigation pane
    to automatically display the current location in tree view. This helps you understand
    where the folder is located and also enables you to easily jump to a parent folder
    a few levels up.


    Follow these steps to enable this feature:


    +   1.  Click the View tab.

    2.  Click the Navigation Pane button.

    3.  Click Expand To Open Folder.


    # The Details Pane


    The Details pane, located at the right of the Explorer window, provides information
    on any file or folder that you select. Similar to the classic status bar in Explorer,
    the Details pane displays common information (such as the size of a file), but
    goes beyond that by also showing many other file settings. If you select an image,
    it displays a thumbnail preview as well as the date it was taken, tags, your star
    rating, dimensions, file size, title, author, and even the camera model.'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'The Details pane has proven to be a valuable source of information that can
    really help you tag and rate your personal documents, images, and music. Without
    the Details pane, setting all these values would be much more difficult.


    Now that you know what the Details pane offers, you can enable or disable it on
    the View tab. Just click the Details Pane button to display or hide it.


    # ## The Preview Pane


    The Preview pane is the one pane that is turned off by default in most folders
    but can be very useful for browsing through an image collection or screening your
    MP3 files. When you are browsing through your music collection and select an MP3
    file, the Preview pane shows a picture of the song’s album and mini-audio controls
    to play and sample the song. When you select an image file, a large thumbnail
    of the photo is displayed.


    Some files even display their contents in the Preview pane. Select a text file
    or a Word document to view a sample of what is inside the file. Make sure that
    you have Microsoft Office installed to enable previews of Office documents.


    Unfortunately, you can’t customize much on this pane. You can adjust the width
    by clicking and dragging the left border left or right when the Preview pane is
    turned on. Turn it on and off by clicking the View tab and then click the Preview
    Pane button.


    Microsoft hopes that, over time, more companies will write preview filters that
    work with Explorer so that you can see their file content previewed on the Preview
    pane.


    # ## Tweaking Search


    One of the most useful new features in Windows 8 is the Search box that is in
    every Explorer window and many other applications. This Search box enables you
    to sort through your files like never before. Looking for all text files in a
    folder? Just type *.txt into the Search box and press Enter. Almost instantly
    you begin to see a list of all text files in the directory you are viewing.


    Looking for all Word documents that refer to a specific company or person? Just
    go to your Documents folder and search for the name and press Enter. Windows Search
    can look at the filenames, but it also searches the contents of your files. This
    is possible because Windows Search has built-in readers for many of the most popular
    file types.


    As you can see, Windows Search is a comprehensive search solution compared to
    the prior search options in Windows. With the addition of this new search system
    comes the ability to customize searches even more than ever before. Various search
    settings are hidden deep in various windows and help you customize the way searching
    works for you.'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# Adjusting Scope


    Every time you perform a search, the results are based on the scope, the folders,
    and types of files in which the search software looks. Depending on the scope
    settings you have enabled, the results of your search can be drastically different.
    These next two settings help you fine-tune what and how the search software searches,
    and then you fine-tune the indexing service to index the files you want to be
    indexed for speedy searches.


    # Customizing What and How to Search


    You can find all the Where To Look settings for Windows Search on the Folder And
    Search Options window in Windows Explorer. Follow these steps to customize where
    Windows Search looks:


    +   1. Open File Explorer and click the View tab.

    2. Click the Options button.

    3. Click the Search tab, as shown in Figure 9–2.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_148_0.png)


    **Figure 9–2:** Windows Explorer offers new search options.'
  merge: -1
  img_proc: true
- pgno: 149
  md: "+   4. The Search tab has two separate sections. In the How To Search section,\
    \ you can choose from two different settings: Find Partial Matches and an option\
    \ to disable searching from the index.\n\n   The two settings here that you really\
    \ want to pay attention to are the sub-folder search and natural language search\
    \ options. The default settings are good for most users.\n\n+   5. The final section—When\
    \ Searching Non-indexed Locations—specifies what to do with compressed files and\
    \ system folders that are not indexed or when index search is turned off. I leave\
    \ these blank to speed up searches, but I strongly suggest that you do not turn\
    \ on the compressed file option; it causes your searches to take forever and makes\
    \ your hard drive go crazy with activity. Unless you have an SSD hard drive, stay\
    \ away from these options.\n\n+   6. When you are finished tweaking the search\
    \ options, click OK to save your changes. You might have to reboot for all settings\
    \ to start working.\n\n# Customizing the Indexing Service\n\nThe indexing service\
    \ runs in the background and reads and indexes your files when your computer is\
    \ idle to speed up searches. This works by reading all the files and storing search\
    \ keywords and other information in a single database that can be easily read\
    \ instead of having to read all the file information again every time you perform\
    \ a search.\n\nIn Windows 8, the scope of the indexing service is limited to the\
    \ user folders by default. If you use search a lot, you might want to tweak the\
    \ folders and types of files that are indexed. The following steps help you customize\
    \ which folders are indexed as well as the file types so that you can control\
    \ what is indexed and what is not:\n\n+   1. Open the Start screen, type **Performance\
    \ Information**, and then select the Settings filter. Run Performance Information\
    \ and Tools.\n\n+   2. After Performance Information and Tools loads, click **Adjust\
    \ Indexing Options** on the left menu. When Indexing Options load, all the locations\
    \ the indexing service is currently monitoring are displayed.\n\n+   3. The Indexing\
    \ Options window opens. First, tweak where the indexer looks. Click **Modify**\
    \ and then click **Show All Locations** on the Indexed Locations window. Next,\
    \ navigate through the list of your drives and folders, and simply check the boxes\
    \ for the folders you want to be indexed. When you are finished, click **OK**\
    \ and the indexer goes to work indexing the new locations."
  merge: -1
  img_proc: true
