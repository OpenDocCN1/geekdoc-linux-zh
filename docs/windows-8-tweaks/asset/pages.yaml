- pgno: 165
  md: '# Revealing the Super Hidden Files


    Microsoft has added many features to Windows to protect the critical files of
    the operating system. The super hidden files feature allows Windows to protect
    itself even further by hiding some of its most critical files from users. If users
    can’t get to it, they can’t hurt it, right?


    Revealing the super hidden system files is not very difficult. You can uncheck
    the box on the list on the View tab of Folder Options that says Hide Protected
    System Files, but where is the fun in that? Use the Registry Editor to turn this
    feature off:


    +   1. Open the Start screen, type **regedit**, and then hit Enter.

    2. After the Registry Editor loads, navigate through `HKEY_CURRENT_USER\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced`.

    3. Right-click `ShowSuperHidden` and select *Modify*.

    4. Change the value to `1` and click OK to save your changes.


    Now you will be able to see all the files on your computer, including the super
    hidden system files.


    # Summary


    This chapter has shown you many different ways that you can customize how File
    Explorer looks and works. You discovered how to change file associations as well
    as how certain file types look when viewed in Explorer. Then, you found out how
    to customize the context menu as well as how to clean it up. The last part of
    this chapter showed you how you can customize the different views of Windows 8
    and control how and if hidden files are displayed.


    The next chapter is all about customizing the next most frequently used program
    in Windows 8—Internet Explorer. I show you how you can customize the new features
    of the latest overhaul of Internet Explorer.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# Chapter 10


    # Personalizing Internet Explorer


    Aside from the performance improvements that benefit everyone, Microsoft also
    tweaked the interface, and improved tabs and security in Internet Explorer 10.
    In this chapter, I show you how to customize these features and many more so you
    can get the most out of Internet Explorer 10.


    # Customizing Search


    The search box, first introduced in Internet Explorer 7, is improved and consolidated
    in IE10 to provide a better search experience. This enables you to search from
    the address bar instead of a separate search box. I show you how you can customize
    the new combo address/search box to work with your favorite search engines (instead
    of the Microsoft default). First, I cover the basics of this new feature, and
    then I show you how you can create custom search entries to search just about
    any website on the Internet that has a search box.


    # Adding Popular Search Engines


    Before you get started customizing your search engines and developing custom entries,
    it is useful to go over the basics of adding and changing the default search engines
    that Internet Explorer uses. Doing so is easy. Just complete the'
  merge: -1
