- pgno: 338
  md: '# Active Security Tips


    One of the easiest ways to break into a computer to install malware or steal data
    is by exploiting the human factor. Attackers take advantage of the fact that we
    don''t usually read the fine print for an application that you download or are
    just click-happy and click Yes on any dialog box that pops up. If you exercise
    a little caution and follow the recommendations covered in the following sections,
    you can take the human element completely out of the picture.


    # Don''t Get in the Habit of Clicking Yes/Continue/Allow


    In Windows 8, User Account Control (UAC) provides more control over what applications
    get installed automatically on your computer. The days of visiting a website and
    getting junk automatically installed on your computer are over. When configured
    properly in Windows 8, User Account Control requires you to authorize almost all
    changes to your computer, including system configuration changes and installing
    new programs. To some, these prompts can become overwhelming and result in the
    habit of just clicking Continue on all of them that pop up. Such behavior completely
    bypasses the new security features in Windows 8, allowing almost anything to take
    over your system.


    The next time you get a User Account Control pop-up, click the Details arrow,
    as shown in Figure 18-5, to find out exactly what you are allowing.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_338_0.png)


    **Figure 18-5**: View details when you are presented with a User Account Control
    pop-up.'
  merge: -1
  img_proc: true
- pgno: 339
  md: '# Watch Out for the Internet Explorer Plug-Ins You Install


    Internet Explorer plug-ins are notorious for bundling all sorts of extra junk
    along with the application, especially those by websites that offer some free
    application. There is usually a reason why the application is free. Companies
    are in business to make money and when they give away software, they often get
    paid for bundling additional software with their offering. This is how you can
    end up with a bunch of new applications popping up on your computer when you thought
    you installed only one.


    Most of the more popular websites are a little more forthcoming about what extra
    junk they are going to install on your computer. You can find out if they are
    going to install any other applications by reading the user agreement and by paying
    attention to the installation options. Checkboxes usually enable you to prevent
    other applications from being installed. If you are visiting a lesser-known website
    or a website that may have illegal or adult content, I highly recommend not installing
    any plug-ins unless you do research and can verify it is a legitimate plug-in.


    # If You Didn’t Start It, Be Cautious


    If you are using your computer and you are hit with a surprise User Account Control
    pop-up, be very cautious about clicking Continue and allowing the request to be
    granted. For example, say you are typing a document and all of a sudden User Account
    Control wants you to approve a system change. This may be a big indication that
    your computer is infected with some sort of malware or virus that is trying to
    change your system settings. I recommend doing a full system virus and malware
    scan immediately to make sure that your computer is clean.


    # Secure Your Network Connection


    One of the best ways to secure your computer is to place it behind a firewall
    or a router device that protects it from malicious Internet traffic. By blocking
    the public access to your internal network or wide open access to your computer,
    you can kill the potential for certain types of direct attacks.


    In the next chapter I show in greater detail how you can use firewalls to protect
    your computer.


    # Protect Your Accounts


    Your account is safe only as long as no one has or can guess your password. Make
    sure that you have a password on all your accounts and never write it down. The
    next section helps you secure your computer accounts and pick'
  merge: -1
  img_proc: true
- pgno: 340
  md: 'complex passwords that will be hard for anyone to guess and hack with brute
    force techniques.


    # Controlling Your Computer Accounts


    Your computer’s physical security, as well as online security, depends on how
    easy it is to access your accounts. This book shows you many ways that you can
    protect your computer, but almost all of them can be defeated by an account on
    your computer that has a poor password or no password at all. This is why it is
    critical to ensure that your computer is protected by accounts with strong passwords.
    Anything less will weaken your entire security defense.


    This section shows you how you can manage your user accounts in Windows 8 to make
    sure they are all well protected.


    # Using Complex Passwords on All Your Computer Accounts


    All the accounts on your computer should have a complex password associated with
    them in case your computer is ever exposed to the Internet. Passwords such as
    easy-to-remember words and predictable key combinations, such as "asdf," just
    don’t cut it. These types of passwords are vulnerable to brute force dictionary
    attacks where an intruder can use special software to try hundreds of combinations
    to hack into your account.


    A complex password is a password that has at least eight characters and consists
    of uppercase and lowercase letters, as well as numbers or other symbols. Ftm3D8&-
    is an example of a complex password. Something such as this is very difficult
    to guess and will take quite some time for a brute force technique to crack it.


    Using complex passwords on all your accounts might not be easy at first, but after
    a while they will grow on you and you will have no problem remembering them. To
    prevent losing access to any encrypted files, it is best to log on to each account
    that does not already have a complex password and change them. If you use the
    Set Password function in Computer Manager, you risk losing access to any files
    that were encrypted under the user’s account.


    Follow these steps to safely change a user’s account password:


    +   1. Log on to the users account that needs a password change.


    +   2. Press and hold Ctrl+Alt+Delete so that the secure desktop is shown (see
    Figure 18-6).


    +   3. Click the Change Password button.


    +   4. Type the old password once and then the new password for the user twice,
    and click the blue arrow button.'
  merge: -1
  img_proc: true
- pgno: 341
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_341_0.png)


    Figure 18-6: Windows 8’s secure desktop offers you a safe way to change user passwords.


    The password for the account has now been changed.


    # # Assigning a Password and Renaming the Guest Account


    One of the default accounts set up in Windows 8 is the Guest account. This account
    can be useful if your computer is in a public place such as a library and a low-rights
    account is needed. However, for most of us, this account is just another possible
    security hole because it cannot be deleted. It is disabled by default, but it
    could be enabled again by a virus or malware if your computer ever gets infected.
    The best way to neutralize this account is to give it a random password and rename
    it to eliminate the chances that some script will be able to use it.


    Follow these steps to protect this account:


    +   1. Open the Start screen, type compmgmt.msc, and hit Enter.

    2. After Computer Management loads, expand Local Users And Groups and click the
    Users folder. All the local computer accounts are listed, as shown in Figure 18-7.

    3. Right-click the Guest account on the list and click Set Password.


    A warning screen appears telling you what may happen if you proceed.

    4. Disregard the warning message and click Proceed.

    5. When the Set Password window appears, type a completely random, complex password
    in both boxes, and click OK. The new password will now be set.


    I suggest using a password that is at least 20 characters long.'
  merge: -1
  img_proc: true
- pgno: 342
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_342_0.png)


    +   6. Rename the account to confuse any malicious scripts that might be looking
    for it. Right-click the Guest account again and click Rename.


    +   7. Type a new account name that has some random letters and numbers in it.


    You just want to make it different from Guest.


    +   8. When you are done renaming it, click Enter and you are finished.


    Your Guest account is now more secure than ever.


    # Secure the Administrator Account


    The Administrator account is the most important account on the computer because
    it has the highest permissions and can do anything it wants to the configuration
    and settings of your computer. Securing this valuable account is critical to the
    overall security of your computer.


    You secure it by ensuring the account is disabled, setting a strong password,
    and renaming it so that it is harder for malicious scripts and viruses to try
    to use. Doing this is very similar to securing the Guest account as you just did
    in the previous section.


    Follow these steps to protect your Administrator account:


    +   1. Open the Start screen, type comppmgmt.msc, and hit Enter.


    +   2. After Computer Management loads, expand Local Users And Groups and click
    the Users folder.'
  merge: -1
  img_proc: true
- pgno: 343
