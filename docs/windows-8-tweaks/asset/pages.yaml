- pgno: 48
  md: '# Using Windows To Go


    New to Windows is a feature called the Windows To Go workspace, which is found
    only in the Enterprise edition of Windows 8. Instead of providing employees a
    desktop or laptop, let them use their own hardware and provide them with a bootable
    USB flash drive that contains their corporate desktop. They can take the Windows
    To Go workspace anywhere and can use it on just about any computer. Just plug
    it in and boot up the workspace.


    As you can imagine, running Windows from a USB flash drive can be very slow if
    you don''t have a fast device. In my testing, all USB 2.0 flash drives are completely
    useless, unless you don''t mind a 20-minute boot time. In fact, Microsoft recommends
    using only USB 3.0 flash drives that are certified for Windows To Go. Microsoft
    specifically recommends three devices:


    +   ■ Kingston DataTraveler Workspace

    ■ Super Telen Express RC8

    ■ Western Digital My Passport Enterprise


    The Western Digital option is actually an external USB 3.0 hard drive, so in theory
    you can also use USB hard drives.


    Beyond the performance of the device Microsoft also requires the ability to create
    multiple partitions on it. That requires a special controller that is rarely found
    on USB flash drives these days. Your best bet is to stick with USB 3.0 drives
    that are certified for Windows To Go.


    # Why Enterprises Only?


    I mentioned earlier that Windows To Go is found only in the Enterprise edition
    of Windows 8. The reason for that is all about product activation. By now you
    should know that every version of Windows made in the past decade requires Internet
    activation of some kind. The activation of Windows is based on the unique hardware
    makeup of your PC. If you rip out your hard drive and install it in another PC,
    Windows 8 boots up but you need to reactivate it.


    The same thing happens to you if you''re using Windows To Go. Every different
    machine you boot up on requires activation. Even if you go back to a machine you
    used in the past, it still requires reactivation. Because consumer product keys
    can be activated only a few times before they stop working, reactivating all the
    time is just not feasible.


    Enterprise customers of Windows 8 typically use a different type of product activation.
    This activation uses what is called a *Key Management Service* (KMS) that is installed
    on a Windows server inside the corporate network. You can'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'think of this as a private activation server just for the company, and it works
    a little differently than the public activation servers run by Microsoft.


    Instead of validating product keys supplied by the client, it activates anything
    that communicates with it. The Windows 8 Enterprise clients simply make a request
    to the KMS servers. Because the KMS server activates anything that can talk to
    it, protecting it is very important, which is why it is always behind firewalls,
    away from the public Internet. After all, the KMS server keeps track of how many
    PCs are currently activated and the enterprise is legally obligated to pay Microsoft
    a fee for each client.


    Windows To Go workspaces use this type of activation because it is the only feasible
    method of handling the activation of a Windows 8 install that could potentially
    need to be reactivated every time it boots up. Because this activation method
    is available only to enterprise customers with a volume license agreement with
    Microsoft, Windows To Go is available only to the enterprise.


    # ## Building the Windows To Go Workspace


    Assuming that you have purchased a USB 3.0 flash drive that is certified for Windows
    To Go, follow these steps to create a Windows To Go workspace:


    +   1.  Open the Start Screen and type **Windows To Go**.


    +   2.  Change the search scope to settings by clicking Settings on the side,
    and you should be able to run the Windows To Go utility.


    +   3.  After it loads, you see the Create a Windows To Go workspace screen listing
    compatible drives that are plugged into your PC. Select your drive and click **Next**,
    as shown in Figure 2-13.


    +   4.  Next, insert a Windows 8 Enterprise DVD into an optical drive or mount
    a Windows 8 Enterprise ISO file by double-clicking it.


    +   5.  In the Create a Windows To Go Workspace utility, click **Add Search Location**
    and select the drive with the Windows 8 Enterprise files.


    +   6.  When the utility finds the files, select the name and click **Next**.


    +   7.  Windows To Go supports BitLocker drive encryption, so the contents of
    the USB device are encrypted. This is a good idea considering how easy it is to
    lose a small USB flash drive. Check the box and enter a password if you are interested
    in the feature; otherwise, just click **Skip**.


    +   8.  Finally, click **Create** and the USB flash drive is reformatted and has
    Windows 8 Enterprise installed on it.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_50_0.png)


    **Figure 2-13:** Create a Windows To Go workspace.


    Boot up your new USB 3.0 flash drive with the Windows To Go workspace on any PC
    just as if you were installing Windows. Hit the keyboard combo to bring up the
    Boot menu on your PC and select Boot To Your USB device.


    # Summary


    In this chapter I described the differences and the benefits of the 32-bit and
    64-bit versions of Windows 8. I showed you how to install Windows 8 using a clean
    install from the DVD and how to install from a USB flash drive—a very useful trick.
    Then I jumped over to the world of dual-booting and demonstrated how to install
    both Windows 7 and Windows 8 on the same physical computer, but with a virtual
    twist with a VHD file. Finally, I covered the Windows To Go workspace feature
    found in the Enterprise edition of Windows 8.


    In the next chapter I review the basic operation of the new interface in Windows
    8 because so much has changed. Getting around can be confusing, and has created
    a lot of tweaking opportunities to make it better.'
  merge: -1
  img_proc: true
