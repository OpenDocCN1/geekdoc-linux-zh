- pgno: 40
  md: '# ## Understanding the Install Process


    You have two primary options for installing any edition of Windows 8 on a PC that
    already has a version of Windows installed:


    +   Upgrading your install


    - Using a clean install


    The upgrade install has come a long way since the XP days. These days it essentially
    performs a clean install, but then applies your configuration and personalized
    settings from the old operating system. Applications transfer over only if you
    upgrade from Windows 7. All earlier versions require you to reinstall your applications.


    The clean install is the purest method of installing Windows 8. Users are advised
    to back up their important data to an external hard drive and then delete the
    contents of the operating system drive. This allows the installer to install Windows
    8 without any legacy settings, applications, or files getting pulled along for
    the ride.


    Each install method has many pros and cons, and I cover those in the next two
    sections.


    # ## Using the Upgrade Install Process


    Upgrade installs are easier to implement than clean installs are, but many negative
    aspects to them will haunt you in the long run. The process works as follows:
    You launch the installer on a machine that has a previous version of Windows installed.
    The installer lets you know which of your apps are com-patible. You will then
    have the option to stop the upgrade and remain on your current version of Windows
    or continue the upgrade and a while later you have Windows 8 PC. Most of the same
    settings and applications that were on the previous version of Windows will have
    transferred over flawlessly.


    That is how the process works in a perfect world. In reality, it rarely goes that
    well. I have seen a significant number of technical issues on Windows 8 attributed
    to users who upgraded from a previous version of Windows. What is most impressive
    is that most issues went away when users did a clean install.


    Microsoft has some smart people working on the upgrade process, and they have
    been working on this for decades. But the process rarely works well because the
    idea is flawed. Why would you ever want to carry over all of your Windows settings,
    applications, and junk that has accumulated on your old PC to a brand new PC?
    This is like buying a new car and then bolting on parts from your old car.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'The underlying system has changed. Take the time to reinstall your applications
    and settings after a clean install. You will be rewarded with a Windows 8 PC that
    runs at top speed and suffers from far fewer issues over time.


    # ## Using the Clean Install Process


    The best way to install Windows 8 is with a clean install. This wipes your computer
    of all installed applications and data, but is worth it in the long run. Additionally,
    many applications have been updated to work better on Windows 8 and take advantage
    of the new features, so it is best to update and install new versions, anyway.


    To get started with the clean install process, follow these steps:


    +   1. Insert the installation DVD or USB flash drive you created into your computer.
    Then reboot and select the boot menu key for your computer. On mine, I press F12
    and then select the device I want to boot to, as shown in Figure 2-5. If you are
    using a DVD, make sure to hit any key after you see the message “Press any key
    to boot from CD or DVD” on your screen.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_41_0.png)


    **Figure 2-5**: Select the device to boot to from the PC Boot menu.


    +   2. A progress bar displays at the bottom of the screen followed by the Windows
    logo. On the next screen, make sure the language, time and currency format, and
    keyboard are set properly. Hit Next when ready, as shown in Figure 2-6.


    +   3. On the next screen, click Install Now.


    +   4. If you are using Windows 8 or Windows 8 Pro edition media, you must enter
    a product key as shown in Figure 2-7 and then click Next. The product key that
    you provide determines whether Windows 8 or Windows 8 Pro is installed. If you
    are using Windows 8 Enterprise edition media, you aren’t prompted for a product
    key and can skip this step.'
  merge: -1
  img_proc: true
