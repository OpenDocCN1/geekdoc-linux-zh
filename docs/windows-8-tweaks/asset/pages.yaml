- pgno: 274
  md: '# CHAPTER


    15


    # # Speeding Up Windows Explorer


    Now that you have optimized the boot startup and your logon, it makes sense to
    speed up the most-used application in Windows 8: Explorer. Windows Explorer is
    responsible for almost the entire GUI with which you normally interact in Windows
    8. The Start menu, taskbar, and file exploring windows are all part of the Explorer
    shell. As you can see, Explorer is an expansive application that is a major part
    of the operating system.


    This chapter shows you how you can use some cool hacks to increase the performance
    of Explorer. First, you improve the speed of browsing and accessing files on your
    computer. Then you adjust the visual effects of Windows 8 so that it performs
    better on your computer hardware. You finish this chapter by tweaking Windows
    Search for optimal performance.


    # ## Speeding Up File Browsing and Access


    The most basic operations your computer performs are reading and writing files
    to disk. All other functions build on these common tasks. For example, when you
    launch an application or play a game, your computer must read the files from disk.
    The same is true when you are simply browsing through lists of files in File Explorer.
    By optimizing these basic operations you will improve the performance of almost
    everything on your PC.'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'How can you do this? Because the processes of browsing, reading, and writing
    files all interact with the filesystem. Using various tweaks and utilities, it
    is possible to optimize the speed of the filesystem.


    Before you go any further, be aware that the following speed tips for the filesystem
    work only for NTFS. If you do not know what filesystem your computer is using,
    you can go to Computer in the Start menu, right-click your hard drive, and select
    Properties. This brings up the Local Disk (C:) Properties window, which tells
    you the type of filesystem your hard drive is running. If your hard drive is running
    FAT32, these tips will not work for you.


    In my opinion, NTFS is the best filesystem for Windows 8. It has many advanced
    security features and also performs better on many machines. If you are still
    running FAT32, or for some odd reason your computer came preinstalled with FAT32,
    consider converting your hard drive to NTFS.


    # QUICK TIP


    Converting your drive to NTFS is a snap. Open the Start screen, type Command Prompt.
    Then, right-click the Command Prompt shortcut and select Run As Administrator.
    Command Prompt will now load with the administrator access that you need to run
    the convert tool. Next, at the prompt, type convert c: /fs:ntfs and press Enter
    to start. If you want to convert a different drive letter, just replace the C:
    with the drive letter that you want. For example, if you want to convert your
    D: drive, type convert d: /fs:ntfs. The actual conversion process takes a little
    while, especially on large drives. Keep in mind that after you convert to NTFS,
    you cannot convert back to FAT32 without reformatting the drive.


    Now that the requirements are cleared up, you are ready to get started.


    # Disabling Legacy Filename Creation


    Legacy filename creation is a feature of NTFS that is included in Windows for
    backward compatibility with older applications. Over the years, the filesystem
    in Windows has changed dramatically. Among the first things that changed were
    the limitations of the old MS-DOS 8.3 file naming standard. The old MS-DOS filesystem
    limited filenames to a maximum length of eight characters plus a three-character
    extension. As Windows became more advanced, this needed to change to allow for
    greater flexibility. Eventually, these limitations were expanded with the release
    of Windows 95, which bumped up the maximum filename limit to 255 characters. However,
    there was a hidden price to pay that affects Windows 8, too.


    Microsoft has always believed that backward compatibility contributes to the success
    of Windows, because it enables users to upgrade to a new version while'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'allowing their older applications to continue to work. However, that mentality
    often results in performance reductions caused by code that has to be tweaked
    to allow for new functionality while preserving existing functionality. The legacy
    filename creation is a perfect example of this scenario. For Windows 8 to support
    older Windows applications, the NTFS has to support both the old MS-DOS file naming
    standard as well as the new standard that allows for longer filenames. How does
    Microsoft do it? It''s rather simple. When you create a file, the file system
    creates two names for it: one in the MS-DOS 8.3 standard and another in the latest
    filename standard.


    Creating two filenames for every file is not the kind of buy-one-get-one-free
    situation that is good. Creating the second filename takes more time and slows
    down the performance of the file system. Although this legacy feature has good
    intentions, it causes the performance of file creation to decrease by 200 percent.
    Disabling this feature will help you get that lost performance back.


    Disabling legacy filename creation kills any application you have that needs the
    8.3 filename standard. If you try to run an application that requires 8.3 filenames,
    you will get various error messages. Even though this technology is more than
    15 years old, some major software developers still write code that requires the
    ancient 8.3 standard. Unfortunately, in the software world, some companies don’t
    bother to fix things simply to increase the performance of the user’s computer.
    For the most part, they do not have to worry about it because Microsoft supports
    the lazy programmers by leaving these old, inefficient features in the operating
    system.


    Even though some applications will fail when this feature is disabled, I highly
    recommend trying to disable it on your computer. In the worst-case scenario, you
    would have to turn the feature back on again. However, almost all your programs
    will work just fine. For those that don''t, try to download a new version from
    the company''s website, or perhaps use this as an excuse to buy a version of the
    product from this century.


    One type of program that has the most problems when the 8.3 standard is disabled
    is the installer application that many software developers use to get their programs
    up and running on your computer. For some reason, a few installers are still programmed
    using the old 16-bit technology that depends on the short filename compatibility
    feature to function.


    Users frequently run into this error with Symantec''s anti-virus software. According
    to Symantec, users may receive a 1639. Invalid command line argument error when
    they install certain versions of Symantec''s software. For users of Symantec software
    who want to disable the old support for greater performance, the company recommends
    enabling the 8.3-standard filename compatibility support when the software is
    being installed and then disabling it after the software is installed. The software
    should then work fine.'
  merge: -1
  img_proc: true
- pgno: 277
  md: 'You can apply that basic Symantec approach to any situation in which you receive
    errors when installing applications. Just enable the 8.3-standard filename compatibility
    support during the install, and then disable it again after the install is complete.


    Now that you are aware of the possible problems that disabling the legacy filename
    standard can cause and know what to do if you experience any, you are ready to
    disable the feature. Follow these steps:


    +   1. Open the Start screen, type **Command Prompt**.

    2. Command Prompt appears at the top of the list in your Start screen. Right-click
    the shortcut and click **Run As Administrator**, as shown in Figure 15-1.

    3. After Command Prompt has loaded in the Administrator context, you can access
    the NTFS configuration utility. At the prompt, type `fsutil behavior set disable8dot3
    1` as shown in Figure 15-2, and press Enter.

    4. Close Command Prompt and restart your computer to activate the change.


    Enabling the legacy filename feature is also very easy. Just repeat the preceding
    instructions, but run `fsutil behavior set disable8dot3 0` instead, and then restart.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_277_0.png)'
  merge: -1
  img_proc: true
- pgno: 278
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_278_0.png)


    **Figure 15-2**: Disable legacy filename creation with the filesystem utility.


    # # Disabling the File Access Timestamp


    Every time you or an application accesses a file on your computer, the filesystem
    records the date and time and stores the timestamp in two locations. Simply accessing
    a file requires the system to write to the master file table (MFT) and the directory
    in which the file is located, which results in two writes for every file read.
    Windows Explorer is one of the most read-intensive applications on your computer.
    Nothing requires more reads to your filesystem than browsing through your files.
    In Windows 8, Explorer has a number of new file previews that require even more
    file reads. All these file reads add up to extra timestamp writes, resulting in
    slower performance.


    The Microsoft NTFS engineers were smart enough to realize that all this timestamp
    logging can get out of control very quickly, resulting in an even greater performance
    slowdown. Applications usually open only a small chunk of a file at a time, and
    then repeat the small chunk reads until the entire file is open. This can generate
    hundreds and maybe even thousands of file reads, depending on the file size and
    application. As you can imagine, many file reads in a short amount of time can
    put a lot of extra load on the filesystem. To handle this problem, Microsoft designed
    NTFS to update only the last access timestamp about every hour, which breaks down
    to just one, two-step timestamp update for each file per hour. This solves the
    preceding problem, but it still has to do two writes for every file; it just limits
    the need to update the same file over and over again.


    Disabling the file access timestamp is a great way to speed up Windows Explorer,
    but it is not without side effects. Often, backup applications utilize the file
    access'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'timestamp to determine which files to back up when performing a sequential
    backup operation (a backup operation that copies only the files that have newer
    timestamps since the last backup date). Check with your backup application''s
    website to find out if it will be affected. If it is, consider doing full backups
    instead of sequential backups. Full backups are not affected by the lack of a
    last access timestamp.


    The process for disabling the file access timestamp is very similar to disabling
    MS-DOS filename support. Just follow these steps:


    +   1.  Open the Start screen and type **Command Prompt**.

    2.  Command Prompt appears at the top of the list in your Start screen. Right-click
    the shortcut and click **Run As Administrator**.

    3.  After Command Prompt has loaded in the Administrator context, you can access
    the NTFS configuration utility. At the prompt, type **`fsutil behavior set disablelastaccess
    1`**.

    4.  Close Command Prompt and restart your computer for the change to take effect.


    If you run into any problems with this change to your backup application or any
    other applications, you can easily undo the tweak. Just type **`fsutil behavior
    set disablelastaccess 0`** at the Command Prompt instead.


    # ## Adjusting NTFS Memory Allocation


    NTFS likes to cache files that are open in physical memory for the fastest possible
    access to the raw data. It does this by first reading the data from the hard drive
    and then transferring it to physical memory. Depending on the amount of RAM in
    your computer, portions of the open files may be paged to disk in the paging file
    because the entire file cannot fit in the available physical memory. This results
    in slower overall performance because for an application to read the entire file,
    existing data in the physical memory cache has to be paged back to the hard disk
    to make room, and then other unread portions have to be pulled back from the hard
    drive into physical memory. This carefully orchestrated memory swap requires a
    lot of CPU, memory, and hard-drive processing time. Whenever memory paging occurs,
    it slows down the overall performance of your computer.


    If you use your computer for anything that requires fast reads of hundreds of
    files, such as indexing your MP3 collection, you might notice that it takes your
    computer a while to read these files. This is because the filesystem is allocated
    only a certain amount of physical and paging file space, which results in increased
    paging activity. Depending on the amount of physical memory in your computer,
    you might be able to get away with increasing the memory'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'allocated to NTFS on your computer. This will increase the performance of high
    disk read operations if you have enough free RAM in your PC.

    Follow these steps to increase the memory available to the filesystem:


    +   Open the Start screen and type **Command Prompt**.

    Command Prompt appears at the top of the list on your Start screen. Right-click
    the shortcut and click **Run As Administrator**.

    After Command Prompt has loaded in the Administrator context, you can access the
    NTFS configuration utility. At the prompt, type `fsutil behavior set memoryusage
    2`.

    Close Command Prompt and restart your computer to activate the change.


    If you notice any decrease in performance or have bad results from this tweak,
    undoing the change is very simple. Just type `fsutil behavior set memoryusage
    1` at the prompt instead and reboot.


    # ## Speeding Up the User Interface


    Windows 8 is all about the new visual experience. Unfortunately, the visual features
    that contribute to the experience can put a heavy load on your hardware. Unless
    you have a newer PC with a recent graphics card and a fast CPU, you may see a
    slowdown in performance caused by the visual effects and features. This is most
    noticeable when you are navigating between windows and closing them. These effects
    can sometimes give the impression that your computer is slower than it actually
    is because the animation is not running as fast as it was designed to run.

    In Windows 8, you can fine-tune the settings of the entire user interface for
    maximum performance. You don’t want to disable all the settings, however; instead,
    find a balance between a good-looking interface and what you are willing to compromise
    for speed. The following paragraphs show you how to do this.


    # ### Fine-Tuning Performance Options


    I do not have the latest graphics card or a fast multi-core CPU—although my hardware
    does meet the minimum requirements, so the new visual effects do run. Unfortunately,
    they do not always run very well, and even appear to slow down my system at times.
    The animation effects often appear rough, and when I drag windows around there
    is a slight lag. The poor performance occurs because the value **ATI video card**
    that I have can barely keep up with the work it has to do. Because my video card
    meets the bare minimum requirements, I need to fine-tune the visual effects so
    the visual effects run better on my system.'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# Adjusting Animations


    You can adjust the visual effects of Windows 8 very easily, enabling you to fine-tune
    the performance of Windows Explorer to work well with your hardware configuration.
    You can make these adjustments using the Windows Performance Options settings.
    Open the Start screen, type SystemPropertiesPerformance (no spaces between words),
    and then press Enter. This starts Performance Options, as shown in Figure 15-3.


    When Performance Options is started, you will notice three preset options and
    one custom option:


    +   - **Let Windows Choose What''s Best For My Computer:** Windows uses your Windows
    Experience Index to pick the settings it thinks will result in the best balance
    of appearance and performance for you.

    - **Adjust For Best Appearance:** Turns all settings on.

    - **Adjust For Best Performance:** Turns all settings off.

    - **Custom:** Enables you to select the individual settings manually.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_281_0.png)


    **Figure 15-3:** Windows 8 offers performance options.'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'Select the Custom option so that you have total control over which settings
    to enable and disable. Now you can pick the individual settings that work best
    for your hardware. Take a look at the following list of visual effects settings:


    +   ■ **Animate Controls And Elements Inside Windows**—This setting animates controls
    inside windows, although it does not affect most applications.


    +   ■ **Animate Windows When Minimizing And Maximizing**—This effect animates
    the window when it is minimized to the taskbar, as shown in Figure 15-4. It is
    a cool-looking effect, but it is graphics intensive and can slow down the performance
    of the GUI. I recommend disabling this effect to gain some extra speed.


    +   ■ **Animations In The Taskbar**—Application taskbar icons fade in and out
    along with a nice slide effect when this is enabled.


    +   ■ **Enable Peek**—Enables you to peek at the desktop by moving your mouse
    to the bottom-right corner of the taskbar as shown in Figure 15-5. All open windows
    will fade away so you can view the desktop.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_282_0.png)


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_282_1.png)'
  merge: -1
  img_proc: true
- pgno: 283
  md: '+   - **Fade Or Slide Menus Into View**—This effect allows the menus that pop
    up throughout the system to fade in. You will experience this when you navigate
    through a menu bar or when you right-click something. This effect does not affect
    the performance of the system. Some users who have older computers and slower
    video cards can experience better performance by disabling this effect.


    +   - **Fade Or Slide ToolTips Into View**—This effect allows the ToolTips in
    various parts of the system to fade in when an event occurs or when you hold your
    mouse over an object. This effect doesn''t affect performance of the system of
    most users, but once again, those with older systems should disable this effect
    for better performance.


    +   - **Fade Out Menu Items After Clicking**—This effect, just like the other
    fade effects, is slower on older systems and should be disabled for best performance.


    +   - **Save Taskbar Thumbnail Previews**—This setting allows the system to cache
    thumbnail previews so you always have a thumbnail to display when you hover the
    mouse over an open application on the taskbar.


    +   - **Show Shadows Under Mouse Pointer**—This effect gives the mouse a 3-D appearance.
    I have not found this feature to affect performance.


    +   - **Show Shadows Under Windows**—Toggle between enabling or disabling shadows.
    Disabling the shadows creates a very flat look for the interface.


    +   - **Show Thumbnails Instead Of Icons**—This feature enables you to view thumbnails
    of your images instead of the associated file icons. Unless you have problems
    with a slow hard drive on your computer and a low amount of RAM, or have directories
    with thousands of pictures in them, I feel this feature provides more value and
    is worth the performance decrease. However, if you don''t like thumbnail views
    of your images, disable this to gain speed while browsing your image files.


    +   - **Show Translucent Selection Rectangle**—With this effect enabled, when
    you drag the mouse to select items you see a nice-looking blue border with a semi-transparent
    blue interior instead of the old dotted-line box we have all seen in older versions
    of Windows. Figure 15-6 shows the two different types of selection rectangles.
    On older machines, this effect may work very slowly and interfere with the selection
    of items because it uses up a lot of the CPU. On the average computer, this effect
    presents no problems at all. If you have a slow machine, disable this effect;
    otherwise, keep it enabled and enjoy the nicer look.


    +   - **Show Window Contents While Dragging**—If you are using the Aero Glass
    interface and experience a lag when you move windows around, disabling this option
    will help because you will see a box outline instead of the entire window image
    when moving it. If you only have to deal with a tiny lag, keep this effect enabled
    because it definitely looks nice.'
  merge: -1
  img_proc: true
- pgno: 284
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_284_0.png)


    **Figure 15-6:** Selection rectangle comparison. A translucent selection rectangle
    appears on top.


    +   - **Slide Open Combo Boxes**—This effect has no noticeable effect on performance.

    - **Smooth Edges Of Screen Fonts**—This feature depends more on your video card
    and monitor than your system. Use of any type of font smoothing requires your
    video card to do more work. On older machines, I would disable this effect. Also,
    if you have a cathode ray tube type (CRT) monitor, you will not benefit all that
    much by having this enabled. The font smoothing effects, especially ClearType,
    work best on flat-panel LCD monitors.

    - **Smooth-Scroll List Boxes**—This has no effect on performance based on my tests.
    You would have to be crazy to disable this effect because it is just so cool.

    - **Use Drop Shadows For Icon Labels On The Desktop**—Unless you do not like the
    look of this feature, I do not recommend disabling it. The performance benefit
    of disabling it is insignificant.


    Now that you know what all the settings do, just uncheck any of the options that
    you would like to disable and click OK to save your selections. Your computer
    will pause for up to 15 seconds while it adjusts all the settings.


    If you ever change your mind and want an effect back, just go back to the Performance
    Options tool and recheck any options you disabled.


    # Adjusting Explorer''s Search


    You can search files and folders throughout the user interface in Windows 8. Almost
    every window has a search box that enables you to find documents, images, applications,
    and other files almost instantly. Accelerated by the Windows indexing'
  merge: -1
  img_proc: true
- pgno: 285
  md: 'service, Windows Search can quickly search through a file index that is con-tinuously
    updated by the indexing service running in the background. For a search in Windows
    to be successful, there needs to be a good balance between the amount of time
    it takes to get results and the overall system performance decrease caused by
    the background indexing service.


    You can use some cool tricks to increase the success of a search while also increasing
    overall system performance by reducing the amount of work the index-ing service
    has to do. First, I show you how to adjust where Explorer searches for an item
    when browsing through folders. Then I show you how to adjust some settings on
    the indexing service, as well as how to use Windows Search without an index. All
    these hacks help you increase the performance of Windows Explorer and your overall
    system performance.


    # ### Adjusting Search Settings


    Typically when you use a search box when browsing through folders, you are looking
    for a specific file. In Windows, you can configure search to look for partial
    matches, the content of files, and within compressed files such as zip and cab
    files. By limiting what it is searching through, you can increase the speed with
    which your results are returned.


    Adjusting the search settings is very easy to do. Follow these steps to adjust
    the search scope for any folder:


    +   1. Open File Explorer.

    2. Navigate to a folder for which you would like to change the search scope. Click
    the View tab and then click Options on the far right.

    3. When Folder Options loads, click the Search tab.

    5. Under How To Search, remove the check next to Find Partial Matches.

    6. Under Searching Non-indexed Locations, you can configure whether you want to
    search system directories, within compressed files, and within the contents of
    files.

    7. After you have made your changes, click OK to save them.


    # ### Adjusting Windows Indexing Service


    The search settings are just one part of the search feature in Windows. The real
    brains—the feature that enables you to search quickly through the various types
    of files on your computer—are in the indexing service. This service runs in the
    background and monitors only folders and file types it is configured to monitor.
    The content of any files located in folders the indexing service moni-tors are
    read by the service and indexed. That indexing data is then stored in a centralized
    database.'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'The indexing service enables you to search through the Start screen and find
    all files, documents, and images that match the search term in both the filename
    and within the document. If the file indexed is a common file format such as a
    Microsoft Word document, most likely there is a reader for it within the indexing
    service. In theory, you could search for the word "the" and find all documents
    and e-mails on your computer that contain that word. This is all controlled by
    the settings for the indexing service.


    You can adjust the settings that the indexing service uses to index only the types
    of files and locations you care about, which will reduce the amount of work the
    indexing service has to do. This increases the overall performance of your computer,
    giving it more free resources because they are not wasted indexing files you don''t
    care about. Adjusting these settings is easy when you know where to do it. Just
    follow these steps to get started:


    +   1. Open the Start screen, type **Indexing Options**, change the filter to
    Settings, and then press Enter.


    +   2. When Indexing Options loads, you see all the locations the indexing service
    is currently monitoring, as shown in Figure 15-7.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_286_0.png)'
  merge: -1
  img_proc: true
- pgno: 287
  md: '+   3. Click Modify followed by Show All Locations.


    This is where you can fine-tune where the indexing service looks. You can even
    navigate between locations while on the Modify screen by using the summary list
    at the bottom of the window.


    4. Navigate through the list of drives and folders and uncheck any locations you
    do not want the indexing service to monitor. When finished, click OK.


    5. When you are back on the Indexing Options window, you can adjust the file types
    that the indexing service reads by clicking the Advanced button and then the File
    Types tab.


    6. Scroll through the list and uncheck any file types that you do not want the
    indexing service to keep track of.


    By default, hundreds of files are checked. Reducing the number of files that the
    indexer has to monitor will greatly improve performance. Click OK when you are
    finished.


    7. Now is a good time to rebuild the index. Click the Advanced button again on
    the Indexing Options window.


    8. Then click Rebuild on the Index Settings tab.


    You are now finished adjusting the Windows indexing service for maximum performance
    while preserving the ability for fast searches in Windows Explorer.


    # Using Windows Search without an Index


    The indexing service plays a key role in accelerating searches within Windows
    8. Although this service provides a lot of value by enabling you to search thousands
    of files quickly, it is not a requirement of Windows Search. It is possible to
    disable the indexing service completely; however, searches with Windows Search
    will require much more time to complete and can cause your hard drive to do a
    lot of work while Windows Search iterates through folders and files instead of
    just accessing a search index.


    Disabling the indexing service saves computer memory and reduces the CPU time
    required to run the application in the background. Depending on how often you
    use the Windows Search feature, you can decide whether it is worth sacrificing
    fast searches for a little extra performance from Windows Explorer. Follow these
    steps if you decide to disable the indexing service:


    +   1. Open the Start screen, type services.msc, and then press Enter.


    This loads the Services utility.


    2. After Services has loaded, scroll through the list and locate the Windows Search
    service. This is the indexing service. Right-click this service and select Stop.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '+   3. When the service is stopped, make sure that it does not start again.
    Right-click the service again and select Properties.

    4. Locate the Startup Type drop-down box and change the startup type from Automatic
    to Disabled.

    5. Click OK to close the window.


    You have now successfully disabled the indexing service that is used by Windows
    Search. Although your searches are now slower, you have freed up processing power
    that can be used by other processes such as Windows Explorer.


    # Summary


    You have now finished optimizing Windows Explorer. The things that you have done
    in this chapter may seem to make only minor differences in the performance of
    your computer, but these hacks have a big impact on the performance of Windows
    Explorer as well as other applications on your system. Tweaking the filesystem
    settings, fine-tuning the visual settings, and adjusting Windows Search are all
    valuable skills to have when you want your computer to run at top performance.


    You are now ready to optimize the core Windows components. In the next chapter,
    you learn tricks to add more RAM to your computer and fine-tune the paging file,
    and other hacks that will take your computer''s performance to the next level.'
  merge: -1
  img_proc: true
- pgno: 289
  md: <!-- no content -->
  merge: -1
