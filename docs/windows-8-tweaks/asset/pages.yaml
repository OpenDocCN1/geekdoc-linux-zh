- pgno: 290
  md: '# CHAPTER


    16


    # Optimizing Core Windows Components


    You can think of the core Windows components as the steel structure of a skyscraper.
    This basic structure of the building provides support for all the other components.
    Likewise, the many levels of Windows 8 support each other, and the lowest level
    interacts directly with the hardware. This chapter helps you tweak the core components
    of Windows to improve the overall performance of your computer. Instead of a steel
    beam structure, Windows 8’s core components are short-term memory (RAM, aka volatile
    memory), long-term storage (your hard drive, aka non-volatile memory), and the
    CPU. All the programs that run on Windows, including Windows itself, eventually
    break down to these three core components.


    To get started, you tweak your system’s short-term memory using some techniques
    and features of Windows 8 to increase the speed of memory operations. Then you
    tweak another critical component—the paging system—and finally, speed up your
    hard drive and adjust how your CPU works.


    # Windows Loves RAM


    Microsoft made a lot of improvements in Windows 8 to reduce the memory utilization
    compared to the notorious memory hogs Windows Vista and Windows 7. This has helped
    significantly, but Windows still performs best when the computer has sufficient
    memory. I already covered trimming the fat from Windows 8 by'
  merge: -1
  img_proc: true
- pgno: 291
  md: 'showing you how to disable components and services that you do not need to
    use. This helps, but on some computers it is not enough.


    According to Microsoft, the minimum amount of RAM required to run the basic version
    of Windows 8 is 1 GB for 32-bit and 2 GB for 64-bit. I''m not sure how that is
    determined exactly, but I feel sorry for you if you are running Windows 8 on just
    1 GB. That may be enough for the core operating system and one or two running
    applications, but if you are doing anything more, I highly suggest adding more
    physical RAM. Before I continue, here are the basics of RAM.


    RAM is the fastest type of memory on your computer outside the CPU cache. No matter
    how you use your computer, RAM is always in use. Your computer uses RAM as a high-speed
    temporary storage location to store data and applications with which the CPU is
    currently working. Every time you launch an application, Windows has to load it
    from your hard drive into RAM so that the CPU can execute the code. Depending
    on the available memory, Windows may have to kick out some other data that is
    currently in memory. That is called *paging*, which is covered in greater detail
    later in this chapter. Paging is a slow process because it saves current memory
    back to the slow hard disk. It is best to avoid paging as much as possible so
    the computer doesn''t waste time trying to make room for your applications or
    data to fit in memory. When you consider all the memory that Windows 8 uses on
    top of your normal applications, you will see why it is so important to have the
    right amount of high-speed memory available.


    # ## Adding RAM to Your Computer


    Sometimes your only option to add more speed to your computer is to give it more
    of what it likes most—RAM. If you have a low amount of RAM on your computer—say
    you are right at the bare minimum requirements according to Microsoft to run Windows
    8 and you have already tried all the performance enhancements in this book—I recommend
    upgrading your RAM as a final move. I have never seen any hardware upgrade that
    increases the speed of a computer more than upgrading the RAM does. Upgrading
    the amount of RAM you have on your computer is an easy and low-cost method to
    jump-start the speed of your computer. Unsure whether you have the skills to do
    it yourself? No problem—just follow the recommendations here for help in buying
    and installing your new RAM.


    # ### Buying RAM for Your Hardware


    Picking out RAM can be very confusing because so many different types exist. The
    following two main points take the complexity out of buying RAM:


    +   - **Type of RAM your hardware requires**—These days you typically need DDR2
    or DDR3 memory, and if you have a laptop you need the smaller'
  merge: -1
  img_proc: true
- pgno: 292
  md: 'DIMM size of DDR memory called a SODIMM. You can usually go to the website
    of your computer manufacturer, type in your model number, and find the exact type
    of memory that will work with your hardware. Alternatively, use Kingston''s Memory
    Search tool at http://tweaks .com/633323 to find the kind of memory you need.
    I recommend shopping around; buying directly from computer manufacturers is typically
    more expensive.


    +   ■ **Number of open RAM expansion slots**—To add additional memory to your
    computer, you need to consider the number of open RAM expansion slots you have
    on your motherboard. Most computers have either two or four slots and, depending
    on your manufacturer or whether you built it yourself, you may be using up all
    the slots. If your slots are all in use, don''t worry—you can still upgrade your
    RAM if you are not already at the max your machine supports. Pieces of RAM usually
    come in combinations of 256 MB, 512 MB, 1 GB, 2 GB, 4 GB, and now 8 GB of memory
    per stick. Say you have two RAM slots and they are both currently filled with
    256 MB RAM chips; you can still buy two 512 MB chips to replace them, which doubles
    the amount of RAM you have. Ideally, if you have a lot of slots free it is a good
    idea to buy DDR memory in pairs so you can take advantage of the dual-channel
    architecture. You will notice two different colored DIMM slots on your motherboard
    if your system supports dual channels.


    # *Installing Your New RAM*


    After you have ordered or picked up your new RAM, it is really easy to install
    it yourself. Keep in mind that opening your case may void your warranty. Having
    fun yet? Follow these steps to pop in your new memory:


    +   1. Unplug all the cables on the back of your computer, including the power
    cable. Detach the battery if working on a laptop.

    2. Use a Phillips screwdriver or push the case release button to remove your case
    or memory hatch.

    3. When you have access to your motherboard, locate the memory expansion slots,
    as shown in Figure 16-1. Attach your antistatic wristband at this time. Don''t
    have one? No big deal. Just touch any part of the metal case frame with your hand
    to discharge yourself.

    4. Removing any existing pieces of RAM is very simple. Push the plastic or metal
    clips away from the sides of the stick of RAM. This will usually cause the RAM
    to pop out.'
