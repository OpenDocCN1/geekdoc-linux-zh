- pgno: 202
  md: '# # CHAPTER 12


    # # Analyzing Your System


    Have you ever wondered how fast your computer is? Sure, you may have an Intel
    2.6 GHz dual core in your box, but the CPU is not the only factor in determining
    the speed of your computer. The true speed is defined by the combined speed of
    all your hardware, such as the read and write speed of your hard drive, front-side
    bus speed, RAM speed, and even your graphics card GPU. Microsoft has attempted
    to provide users with a clearer picture of their computer''s performance in Windows
    8 with the Windows Experience Index benchmarking tool. This chapter helps you
    understand your Windows Experience Index and how to perform a more detailed analysis
    of the capabilities of your computer so you can make your computer faster.


    Before you can jump into improving the speed of your computer, it is important
    to understand the limitations of your hardware and to identify potential bottlenecks
    in your system. Using the tools discussed in this chapter, you can run different
    tests that help you decide which tweaks in upcoming chapters work best for your
    computer.


    # ## Monitoring Your System Hardware


    Monitoring the status of your system with various tools helps you understand what
    is going on behind the scenes, much the way the instrument panel of a car gives
    you information about the speed you are travelling and the way your'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'engine is performing. If you are driving home and you notice that the temperature
    gauge is maxed out and the instrument panel is flashing with all sorts of warning
    icons, you know your car is not performing at its best. Monitoring your system,
    for example, reveals whether you are running low on memory, whether your CPU is
    overloaded, or whether your system has too many programs running at the same time.
    These are all useful and important things to know, and having that information
    available enables you to change settings to get optimal performance.


    A variety of performance monitoring software is available. Get started by using
    the Resource Monitor.


    # Using the Resource Monitor


    Windows has a great diagnostic tool that''s built right in, called the Resource
    Monitor. This cool utility can give you stats on just about every aspect of Windows.
    Similar to other system-monitoring tools, its purpose is to help you diagnose
    problems and improve the performance of your computer.


    To start the application, simply open the Start screen, type resmon.exe, and then
    press Enter.


    After the Resource Monitor loads, you see the Overview tab, which is filled with
    the most common system stats, as shown in Figure 12-1.


    By default, you are presented with a moving graph of the CPU, Disk, Network, and
    Memory usage. On the left are detailed breakout sections that you can expand to
    see exactly how much each process is using the CPU, Network, and Memory, as well
    as which processes and files are using the disk.


    New to Windows 8 are dedicated tabs for CPU, Disk, Memory, and Network. Each dedicated
    tab has a wealth of useful information.


    # Using the Detailed CPU Section


    The detailed CPU section shown in Figure 12-2 lists all the processes running
    on your machine, similar to the Processes tab of Task Manager.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_204_0.png)


    Figure 12-1: The Resource Monitor Overview screen shows you system stats.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_204_1.png)


    Figure 12-2: The detailed CPU section provides more information.'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'Your current CPU usage and a maximum usage rate are at the top of the bar.
    The list of processes is below that, sorted by average CPU usage. Unlike the active
    process list in Task Manager, this list shows you only the average usage rate.
    This is very helpful when you''re looking for an application that has an overall
    meaningful impact on your CPU usage, such as one using 100 percent of your CPU.
    Additionally, this screen shows the number of threads and CPU cycles the process
    is currently using.


    Just below the processes is a list of all the services running on your computer
    and the corresponding CPU utilization.


    When you select a process by checking the box next to the image name, the service
    list, handle list, and module list display only services, handles, and modules
    a specific process is using. This is very helpful and is something I wish had
    been built into Windows years ago.


    The information you gain about your computer from the detailed CPU section can
    help you identify applications you run that have a big impact on the performance
    of your computer. If a process listed has a very high average CPU time, try to
    identify what the process is by using the Description column or even a search
    engine if necessary. You might find that a simple application such as a desktop
    weather application that runs in the background is using a big portion of your
    CPU. With this information, you may decide to uninstall or disable the application
    to speed up your system. I talk more about that in later chapters.


    # Using the Detailed Memory Section


    The detailed Memory section shows you how much of the various types of memory
    each running process is using, as shown in Figure 12-3. The processes show the
    number of hard memory faults per second and the percentage of total physical memory
    that is in use. The memory overview is one of the most useful overviews in the
    Resource Monitor.


    Take a look at the number of hard memory faults and total percentage of physical
    memory that is in use. If you are getting any more than a few hard memory faults
    per second, you might need more memory for your computer. A memory fault occurs
    when something a program needs is not in memory and the memory manager has to
    get it from disk and put it in memory. Usually it has to make room for the new
    data to be placed in memory by kicking some of the other processes'' data out
    of physical memory and into the paging file on your hard drive. This can be a
    slow operation.


    Also consider the amount of private memory a process is using. A process that
    is using a huge amount of private memory can steal your system resources from
    other processes, which results in more memory faults and a slow-down of your computer.'
  merge: -1
  img_proc: true
