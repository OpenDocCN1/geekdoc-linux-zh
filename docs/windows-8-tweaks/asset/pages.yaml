  md: '+   8. The last few settings are used less frequently. Here you can also specify
    the Task Category, Keywords for the event, and a specific computer user the event
    occurred with.


    +   9. After finalizing the settings, click OK.


    +   10. The Save Filter To Custom View screen pops up. Type a Name and click OK.


    After your new custom view has been generated, you can open it by expanding Custom
