- pgno: 121
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_121_0.png)


    **Figure 7-4:** Create very large icons with the mouse scroll wheel trick.


    # ## Renaming the Recycle Bin


    To give my desktop a personalized touch, I like to rename my Recycle Bin to something
    different. In previous versions of Windows, this was possible only through editing
    the registry. In Windows 8, it is much easier. Just perform the following steps
    to rename your Recycle Bin:


    +   1.  Right-click the Recycle Bin on the desktop and click Rename.

    2.  Type a new name, such as *Trash Compactor*, and press Enter.


    # ## Customizing the Shortcut Arrow


    One thing that I always hate about Windows is the shortcut arrow. Sure, it is
    good to be able to tell if a shortcut is actually a shortcut, but I already know
    that the applications I put on my desktop are shortcuts. Also, the shortcut indicator
    that Windows uses does not look appealing, in my opinion. With a simple registry
    hack, it is possible to replace that shortcut icon overlay with any icon. This
    enables you to create your own icon using any popular icon editor and use it as
    an overlay on any shortcut.'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'I created a green arrow that I like to use as my shortcut icon overlay. You
    can grab it from the Windows 8 Tweaks website at tweaks.com/340859. Use the following
    steps to change the icon shortcut overlay:


    +   Open the Start screen, type regedit, and then press Enter to start Registry
    Editor.


    +   After Registry Editor has started, navigate through HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer.


    +   Right-click the Explorer folder, expand New, and select Key. Type Shell Icons
    as the name of the new key.


    +   Right-click the new Shell Icons key, expand New, and select String Value.
    Type 29 as the name of the new string value.


    +   Right-click the new string you just created and select Modify. Set the value
    to the icon path, a comma, and the icon index number that starts at 0. For example,
    I use C:\icons\myshortcut.ico, 0 as shown in Figure 7-5. The icon index number
    specifies which icon you want to use in the file. (Some files can contain multiple
    icons, such as the shell32.dll file.) Click OK when you are finished.


    +   Log off and back on, and you should see your new shortcut overlay.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_122_0.png)


    Figure 7-5: Set the shell icon path and index.


    # Customizing the Icons


    Are you starting to get tired of the default icons in Windows 8? After a while
    they can get old and dull. If you are a hardcore desktop customer, which you probably
    are if you have this book, then it is time to customize the Windows icons on the
    desktop.'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'To get started, you first need to find some great-looking replacement icons.
    Check out my favorite websites and download icons for your desktop:


    +   * InterfaceLIFT—tweaks.com/899844

    * VistaIcons—tweaks.com/701266

    * IconArchive—tweaks.com/855045

    * IconFinder—tweaks.com/767865


    Alternatively, you can use the library of Windows icons located in %SystemRoot%\system32\SHELL32.dll.


    Now, you can get started replacing icons on your desktop. Changing application
    shortcut icons is easier than system icons such as the Recycle Bin or Computer.
    Changing system icons requires the help of an icon utility. First, I show you
    how to change application icons and then how to change system icons. Perform the
    following steps to change any application icons:


    +   1. Right-click the item for which you want to change the icon and select Properties.

    2. On the Shortcut tab, click Change Icon.

    3. While on the Change Icon screen, click the Browse button and navigate to your
    new icon.

    4. Select your new icon on the screen, as shown in Figure 7-6, and click OK.

    5. Click OK again to exit and save your changes on the Properties screen.


    Now that you know how to change application shortcut icons, you can change system
    icons, such as the Computer shortcut or the Recycle Bin. It is best to use an
    icon utility to make these changes. My favorite utility for this is called Microangelo
    On Display, developed by Impact Software.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_123_0.png)


    Figure 7-6: Select a new app icon.'
