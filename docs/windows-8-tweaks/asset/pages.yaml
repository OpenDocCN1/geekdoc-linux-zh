- pgno: 299
  md: '# Adjusting the Size of the Paging File


    The size of the paging file can be set automatically by the system or you can
    set it. In some situations, letting the system manage the paging file is a good
    idea, but in others, it is better to manage the paging file yourself.


    The biggest argument for setting the paging file size and limit manually is to
    keep the file from growing. When the system is managing the size of the paging
    file, it monitors the size and automatically makes it larger when needed. This
    causes two problems. First, it causes a noticeable delay for all applications
    running on your computer because the computer has to expand the paging file, and
    this is a hard disk–intensive operation. Second, allowing the system to grow and
    shrink the paging file causes fragmentation errors.


    To ensure that your system has enough speed, your paging file should not have
    any file fragments. The following section on defragmenting shows you exactly how
    to fix this. Before the defragmentation can be successful, however, the paging
    file needs to have a constant size. If the paging file will be growing frequently,
    the defrag utility is unable to place the file in an optimal location on the hard
    disk so that it will never get fragmented. Only when the page file is set to a
    constant size can the defrag utility ensure it will never become fragmented again.


    Setting the paging file to a constant size has some disadvantages. For example,
    the lost disk space taken up by the paging file can be as high as several gigabytes.
    Additionally, when you set the maximum paging file size manually, you are setting
    a limit that your computer can never go above. If you run an extremely memory-intensive
    application and your limit is too low, your paging file will fill up and you will
    be out of luck in much the same way as when you completely disable your paging
    file.


    The previous example illustrates why setting the correct paging file size is so
    important. An easy way to calculate the maximum size of your paging file is to
    take the recommended size from the Virtual Memory Settings window, as shown in
    Figure 16-6, and multiply it by two. If you are having problems finding where
    your computer states the recommended size, perform the following steps to change
    the paging file to a constant size (this value is on the same screen as the one
    on which you will be working).


    Now that you are ready to optimize the paging file to a constant size, follow
    these steps:


    +   1. Open the Start screen, type sysdm.cpl, and hit Enter.

    2. When System Properties loads, click the Advanced tab.

    3. Under the Performance section, click Settings.

    4. Click the Advanced tab and then click Change under the Virtual Memory section.'
  merge: -1
  img_proc: true
- pgno: 300
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_300_0.png)


