  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_388_0.png)


    Figure 20-4: Adjust the AutoComplete settings so that no one can access your username.


    # Clearing Temporary Internet Files Automatically


    Earlier I showed you how to clear your temporary Internet files manually so that
    they will not be a privacy concern. However, you can use a cool hidden feature
    that deletes these files automatically every time you close your browser. This
    way, you don''t have to worry about clearing all the files every time you use
    Internet Explorer. Follow these steps to activate the automatic empty feature:


    +   1. Open Internet Explorer.

    2. Click gear icon and click Internet Options.

    3. Click the Advanced tab and scroll down almost to the bottom of the list.

    4. Check Empty Temporary Internet Files Folder When Browser Is Closed, as shown
    in Figure 20-5.

    5. Click OK to close Internet Options and activate your changes.


    Enabling the automatic empty feature is a great way to maintain a clean PC. Keep
    in mind that this deletes only your temporary Internet files, not your cookies.
    You still have to delete the cookies the way that I mentioned previously in this
    chapter.'
