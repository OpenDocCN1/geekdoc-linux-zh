- pgno: 306
  md: '# Using Diskkeeper 12


    Diskkeeper is another popular defrag utility that has a proprietary algorithm
    to optimize the location of files on your disk. Home and professional versions
    are available, with the professional version offering an improved file optimization
    feature called I-FAST and a feature called Frag Shield that helps protect critical
    system files from becoming fragmented.


    There is no separate mode for optimizing boot files; just download a free trial
    from http://tweaks.com/314120. Upon install, automatic background defragmentation
    starts immediately. Follow these steps to see Diskkeeper at work:


    +   1. Open the Start screen, type **diskkeeper**, and hit Enter.


    +   2. Scroll down and click Available Resources Used By Diskkeeper.


    Available Resources Used By Diskkeeper expands to display a graph showing Diskkeeper
    activity.


    # Upgrading to an SSD


    Solid state disks have a huge impact on the performance of your system. Priced
    at around $110 for a 120 GB drive, they are becoming more affordable but are still
    more expensive than a traditional one. However, the performance of solid state
    disks is amazing.


    I set up a simple test to show how fast a solid state disk is compared to the
    average high-capacity traditional spindle hard drive. For this test I used a popular
    disk benchmark utility called Crystal Disk Mark 3. If you want to play along at
    home, head over to http://tweaks.com/700105 and download a copy. I ran the performance
    utility with 1000 MB test sizes that were repeated five times to create an average
    for each test criteria.


    +   ■ **Sequential read and write**—Reads and writes data to the disk sequentially,
    meaning sectors or cells right next to each other, in 1024 KB blocks. For example,
    the first part of the file goes in sector 1, the second part goes in sector 2,
    the third part goes in sector 3, and so on.


    +   ■ **512 K random read and write**—Blocks of 512 K in size are written and
    read from all over the drive in a random order. For example, the first part of
    the file is written to sector 423, the second part of the file is written to 882,
    the third part of the file is written to sector 102, and so on.


    +   ■ **4 K random read and write**—Same as the 512 K test but with a smaller
    block size of 4 K. The smaller the reads and writes, the slower the operation
    is because the drive must do much more work to write a 1 GB file in 4 K blocks
    instead of something much larger.'
  merge: -1
  img_proc: true
- pgno: 307
  md: '+   ■ **4 K random Queue Depth 32 read and write**—Similar to the other random
    tests, although this benchmark uses enhanced features of newer drives such as
    NCQ and the AHCI protocol that provide a queue that can help performance.


    I ran the test on a traditional hard drive, an entry-level SSD, and a high-performance
    SATA Rev 3 (6 Gbps) SSD. Table 16-1 shows the read-performance comparison and
    Table 16-2 shows the write-performance.


    Table 16-1: Drive Read Performance Comparison


    | DRIVE | SEQUENTIAL | RANDOM 512K | RANDOM 4K | RANDOM 4K QD32 |

    | :--- | :--- | :--- | :--- | :--- |

    | Traditional HDD | 67 MB/s | 7.7 MB/s | 0.39 MB/s | 0.44 MB/s |

    | Entry Level SSD | 124 MB/s | 120 MB/s | 18 MB/s | 16 MB/s |

    | High-End SSD | 467 MB/s | 457 MB/s | 26.97 MB/s | 222 MB/s |


    Table 16.2: Drive Write Performance Comparison


    | DRIVE | SEQUENTIAL | RANDOM 512K | RANDOM 4K | RANDOM 4K QD32 |

    | :--- | :--- | :--- | :--- | :--- |

    | Traditional HDD | 67 MB/s | 13 MB/s | 0.76 MB/s | 0.74 MB/s |

    | Entry Level SSD | 127 MB/s | 108 MB/s | 10 MB/s | 14 MB/s |

    | High-End SSD | 251 MB/s | 239 MB/s | 54 MB/s | 205 MB/s |


    The results of the test show how the solid state drives destroy the traditional
    hard drive on sequential and random IO. The actual results from running this test
    will vary depending on the model of SSD that you purchase and on your hardware.
    Keep in mind the results on the performance tables will be outdated by the time
    this book is published because faster solid state disks are released very frequently.
    However, the tables are still useful for showing you the big difference between
    traditional and solid state disks. By the time you read this, the difference will
    just be greater.


    # Selecting an SSD


    All of the consumer solid state drives on the market use a type of flash memory
    called NAND that retains data even when the power is off. When SSDs first became
    popular, they were primarily made up of single-level cell or SLC NAND memory chips.
    SLC NAND stores one bit per cell, such as a 0 or 1. Performance and wear durability
    was great but the technology was very expensive.'
  merge: -1
  img_proc: true
- pgno: 308
  md: 'A new type of NAND memory was introduced called multi-level cell or MLC NAND
    where two bits are stored in each cell. This allows MLC NAND chips to offer higher
    capacities and lower costs compared to SLC NAND chips. Today, all consumer SSDs
    use multi-level cell chips and even enterprise SSDs are beginning to use a variation
    of MLC.


    Wear durability or endurance is one item that is very important to consider when
    selecting solid state drives. Each memory cell in NAND memory can be written to
    a specific number of times before it wears out. How often the SSD is written to
    determines the life of the drive. Reading from the drive does not affect its life.
    For most consumer applications, even entry-level SSDs can sustain writes of up
    to 10–20 GB per day and will last for many years before they need to be replaced.
    The higher-end drives, usually in workstations or servers, can sustain writes
    of several hundred gigabytes every day for up to five years. Because consumers
    rarely write that much per day, higher-end SSDs will last much longer.


    Solid state disks depend on advanced disk controllers to manage the life of the
    NAND cells with special wear-leveling algorithms. When the operating system needs
    to write something to disk, the OS talks to the storage controller on the motherboard,
    which then talks to the SSD drive controller. The SSD controller keeps track of
    the wear level of each block of cells and writes data to the best location to
    maximize the life of the drive. Fragmentation is not a concern because it has
    no moving parts that cause the mechanical latency on traditional hard drives.


    Because wear tolerance is very important when selecting an SSD for your system,
    keep an eye on the endurance specifications when shopping. For example, Kingston
    specifies total bytes written (TBW) for its SSDs to show you how many terabytes
    can be written to each of its drives. Other manufacturers simply refer to wear
    tolerance as drive endurance, but also give a number of terabytes or gigabytes
    that can be written over some period. Remember that as the capacity of the drive
    goes up, the endurance number should also increase.


    For greater performance, many SSD controllers spread your data across multiple
    chips, similar to striping on traditional hard drives. Additionally, some SSD
    controllers incorporate RAID-like recovery features, where the controller can
    recover your data even if one of the chips in the SSD fails.


    Another part of selecting an SSD is finding one that will work well with your
    hardware. Specifically, choose one that matches the speed of your storage interface
    on your motherboard where the SSD will be connected. Right now all the consumer
    solid state disks support two storage interfaces:


    +   - SATA Rev 2.0, which has a theoretical maximum performance of 3 gigabits
    per second.

    - SATA Rev 3.0, which has a theoretical maximum performance of 6 gigabits per
    second. It is also backward compatible with SATA Rev 2, but runs at the slower
    speed.'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'Unless you like to waste money, don''t buy a SATA Rev 3.0 drive if your computer
    has a SATA Rev 2.0 interface. It will technically still work, but you will never
    see the performance you paid extra for unless you upgrade your PC. It is kind
    of like buying an expensive sports car and never driving above 25 mph.


    The final part of selecting an SSD is finding one that will physically fit in
    your PC. Three sizes of SSD drives are available:


    +   - 2.5" form factor with 9.5 mm height

    - 2.5" form factor with 7 mm height

    - mSATA chip


    The most common size on the market is the 2.5" form factor with 9.5 mm height.
    This can be used in all desktops, although sometimes a 3.5" drive adapter bracket
    is necessary for proper mounting. Some older laptops also use the 9.5 mm height.
    Most new laptops are designed for the 7 mm height. Some of the new super-slim
    laptops, often called ultrabooks, and tablets use a special drive called mSATA
    that looks similar to a RAM memory module. The best way to find out what you need
    is to Google the drive model you have currently installed or check with your PC
    manufacturer.


    > **CAUTION** If an SSD is not used for a long period of time, the data stored
    on it can be lost. SSDs are rated to safely retain data when powered off for up
    to one year. This applies to SD or USB flash drives with your pictures or music
    too. For long-term backup, a traditional hard drive or online backup service is
    the best archiving solution.


    > **TIP** You can determine the remaining life of an SSD using any hard drive
    utility that can read SMART attributes. I recommend using CrystalDiskInfo 5.4.0
    (http://tweaks.com/922029) or any SMART utility that comes with your SSD drive.
    Take a look at the value of the "SSD Life Left" attribute. The value starts at
    100 and goes down to 0. It is recommended that you replace the drive when the
    value hits 10.


    # Replacing Your Traditional HDD with an SSD


    If you have a desktop or laptop it may be possible to install an SSD without having
    to reload Windows 8. Unfortunately, this only works well with older computers
    that do not have an EFI or UEFI type BIOS. But if you have a computer with a traditional
    BIOS, you can easily clone your existing drive to the SSD and then swap out the
    drive. Windows 8 and all of your applications and settings will remain, as cloning
    the drive will simply copy everything on your old disk over.'
  merge: -1
  img_proc: true
- pgno: 310
