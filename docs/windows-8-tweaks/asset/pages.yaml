  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_293_0.png)


    Figure 16-1: Open your computer to find the RAM expansion slots.


    +   5. Putting a new stick of RAM in is just as easy. While the plastic clips
    are open (pushed away from the sides of the slot), align the chip the correct
    way so it fits in the slot properly and gently push down. As the stick of RAM
    goes down, it causes the plastic clips on the sides to snap in place.


    Put your case back on, hook up your cables, and you are finished. If you have
    any errors on your BIOS screen when you reboot or if your computer does not recognize
    the new RAM you put in, make sure you got the right kind of memory and that it
    is seated properly in the slot.


    # Using a USB Storage Device to Add Memory


    Although upgrading the amount of RAM you have in your computer is a good last
    resort if you are having performance issues, Windows 8 includes a cool trick to
    assist the amount of RAM you currently have. As I mentioned earlier, any time
    your computer has to kick applications and data out of RAM because there is not
    enough room, it slows down your computer because it has to store that data on
    the slow hard drive. In Windows 8, a feature called Windows ReadyBoost enables
    you to use faster solid state memory devices, such as a USB memory device, to
    store this data instead of your slow mechanical hard drive. This provides an instant
    boost to system performance without even opening your case.


    How does it work? The concept is simple. Solid state flash USB 2.0–based storage
    devices have a faster read and write speed than some hard drives on the market.
    Windows ReadyBoost, with the assistance of Windows SuperFetch (another caching
    technology), works with a memory management system to redirect cached data to
    the high-speed device. At any time, you can remove the device if you need to use
    it for normal data transfers. To protect the data that is cached on your removable
    USB device, Windows encrypts it so that if the device is removed, your data is
    safe.'
  merge: -1
  img_proc: true
