    # # Summary


    Throughout this chapter you have learned how to customize the icons on your desktop
    in many different ways to make the desktop much more personalized. I have even
    walked you through the steps of adding Rainmeter skins to make your desktop more
    informative and customized.


    The next chapter is one of the most important of the customization chapters. I
    show you how to change the look of the entire Windows 8 window interface, so Chapter
    8 is a must for anyone who wants to customize the most visible part of Windows.'
  merge: -1
