    # Enabling the Outbound Firewall


    In Windows 8, Microsoft decided it was best to disable the outbound connection
    filtering because it can cause headaches for many inexperienced computer users.
    This may have been the right choice, but not filtering your outbound traffic can
    increase the possibility that an application can steal important personal information
    and send it to a remote computer. If this application is malicious, it can be
    used to steal personal information such as passwords and bank account numbers.
    Turning on the outbound firewall filtering and enabling only the rules that grant
    your normal applications access to the Internet will greatly increase the security
    of your computer.


    Enabling the outbound firewall rules on your computer is easy to do after you
    know where Microsoft hid the setting. Follow these steps to turn the outbound
    firewall back on:


    +   1. If the Windows Firewall with Advanced Security window is not already open,
    open the Start screen, type `wf.msc`, and press Enter.

    2. When the management console loads, click Windows Firewall Properties right
    in the middle of the opening screen.

    3. When the settings window loads, you see a tab for each of the different firewall
    profiles. Select the tab for the profile on which you would like to enable outbound
    filtering.

    4. Under the *State* section, locate the **Outbound Connections** drop-down box
    and change it to **Block**.

    5. Click **OK** when you are finished to activate the outbound firewall on the
    profile you specified.


    Windows automatically detects any applications that try to access the Internet
    or other network resources that are blocked with the outbound firewall turned
    on and prompts you to authorize the application to send information out to the
    Internet.


    # Using Online Armor Firewall


    Another free firewall that I use in situations where I want more control over
    specific applications is called Online Armor. It has the basic firewall functionality
    that blocks all ports except those on an allow list, but it also provides a very
    comprehensive application-based firewall. Application firewalls allow you to create
    block or allow rules based on a program running on your PC instead of'
  merge: -1
  img_proc: true
