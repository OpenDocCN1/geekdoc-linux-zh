    PerfectDisk is a popular defrag utility that has its own unique file placement
    and optimization strategy. In addition to the standard features such as the automatic
    background defrag and boot time system file defrag, it also has the capability
    to consolidate your free space. The professional version includes space management
    utilities that help you manage what is on your disk and free disk space.'
