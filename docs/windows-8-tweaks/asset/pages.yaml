- pgno: 380
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_380_0.png)


    # Protecting Your Privacy


    Windows 8 keeps track of all activities you do on your computer. It records the
    websites that you visit, the addresses that you type in, the applications that
    you launch, and even the files that you open. Why does it do this? All the information
    is used to tailor your computer experience and power features designed to make
    Windows easier to use, such as the recently opened documents lists. Your browser
    history is used to suggest websites when you start to type a URL to save you a
    few keystrokes. These features can be very useful, but they also expose what you
    do on your computer to anyone who sits down in front of it.


    The documents you open, personal letters you write, the websites you visit, and
    the applications you use equate to an enormous amount of personal data that most
    users would like to keep private. Maybe you want to keep what you do online secret
    or just keep financial documents away from the kids—either way, this chapter is
    for you. I show you how to configure Windows 8 so it is easy to use but mindful
    of your privacy.


    # Internet Explorer Privacy


    Internet Explorer is one of the most difficult parts of Windows to clean because
    it stores your data in many folders and files across the computer. Every time
    you want to clean your Internet Explorer history, you need to clear recent addresses,
    remove history files, erase temporary web files, and remove cookies. The first'
  merge: -1
  img_proc: true
- pgno: 381
  md: 'part of this section shows you how to clean all the required parts to remove
    your Internet Explorer history and protect your privacy.


    The second part of this section shows you how you can protect your privacy further
    by configuring and using new Internet Explorer features.


    # Removing Address Bar Suggestions


    Windows 8, as with past versions of Windows, includes a feature called AutoComplete
    that is always enabled by default for the address box. This is normally a very
    convenient feature because it can help you when typing in an address by presenting
    you with various suggestions based on your browser history. With this convenience
    comes the danger that it can reveal your online whereabouts. When I start typing
    \u201ctwe\u201d in my address bar, it automatically suggests tweaks.com because
    I previously visited the site. Anyone who uses my computer and starts typing addresses
    in manually can see sites that I have visited. If they just type in www.s or www.t,
    they will be presented with a small list of all the sites I have visited that
    have URLs that start with *s* or *t*.


    How do you stop the suggestions? It depends on whether you want to remove just
    one entry or clear all.


    # Removing a Single Website from the Address Bar


    Windows 8 includes a number of great privacy features that give you control of
    your information. When you come across an address bar suggestion in Internet Explorer
    10, hover over the entry displayed in the drop-down list and an X icon appears
    on the right as shown in Figure 20-1.


    Clicking the X button removes that entry for good while preserving the rest of
    your browser suggestions. This is one of my favorite new features in Windows 8.
    It really enables you to control your information much better than previous versions
    of Windows.


    # Clearing All Address Bar Suggestions


    In the past, clearing all the address bar suggestions was a big job in which you
    had to delete a file that was in use. With Internet Explorer 10, it takes only
    a few clicks:


    +   1.  When Internet Explorer is open, hit Ctrl+Shift+Delete to bring up the
    Delete Browsing History window.

    2.  On the Delete Browsing History window, uncheck all items except for History.

    3.  Click Delete, and all your address suggestions are deleted.'
  merge: -1
  img_proc: true
- pgno: 382
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_382_0.png)


    Figure 20-1: Now you can remove a single entry from the address bar.


    Keep in mind that in IE10, the address bar also searches your list of favorite
    websites. If you want to prevent one of those sites from showing up in the address
    bar suggestions, it is best to delete the site from favorites list.


    # ## Clearing Temporary Internet Files, History, and Cookies


    Every time you visit a website, the files for the web page (such as the HTML and
    the images) are downloaded and stored in a temporary directory known as Temporary
    Internet Files. Over time, this directory can become full of images and HTML from
    various websites you visited. This directory can end up taking a lot of storage
    space. Additionally, a user can browse your Temporary Internet Files directory
    and find out exactly what sites you have been visiting just as if he were looking
    at your browser history. If you are concerned about your privacy, or just concerned
    about disk space, clearing the temporary Internet files is a must.


    The web browsing history is another area that users often like to clear. Internet
    Explorer, by default, is configured to record all the websites that you visit
    for a 20-day period. If you are concerned about your privacy, you should frequently
    clean your browsing history and configure your history settings to protect your
    privacy. Doing so ensures that anyone using your computer can’t easily see what
    you have been doing.'
  merge: -1
  img_proc: true
- pgno: 383
  md: 'Cookies are also created on your computer when you visit websites. Contrary
    to popular belief, cookies are not all bad. Most websites use them to save user
    data to a browser. An example of this is automatic site logon when you visit a
    website. A website you visit can detect whether a cookie that has your user ID
    stored in it already exists from a previous visit to that site. If it finds one,
    it knows exactly who you are and logs you on automatically. Advertisers also use
    cookies to store personal data. Instead of showing you the same advertisement
    50 times, they use cookies to keep track of how many times an advertisement is
    displayed on your screen.


    However, some advertisers abuse what are called *third-party cookies* to track
    the websites you visit and then deliver relevant ads based on what you do online.
    Because of the abusers, it is best to just delete all your cookies on a regular
    basis because it is hard to separate the good from the bad. I show you more about
    how to protect against third-party cookies in the next section.


    Clearing the temporary Internet files, history, and cookies is a very simple task.
    Just follow these steps to clear these files:


    +   1. When Internet Explorer is open, hit Ctrl+Shift+Delete.

    2. On the Delete Browsing History screen, check all items except Preserve Favorites
    Website Data, as shown in Figure 20-2.

    3. Click Delete and all will be deleted.


    Now users can no longer see which websites you visit from the cookies and temporary
    Internet files that are stored on your computer. Additionally, you have freed
    up some disk space by deleting these files.


    # ## Adjusting Your Cookie Security Policy


    As mentioned, cookies are not as bad as some people in the computing world would
    like you to believe. Instead, the only real risk they present is a loss of some
    privacy. If you allow your browser to accept cookies, your PC will have quite
    a collection of them over time. Anyone who uses your computer can discover which
    sites you visited, if they know where the cookie files are located.


    The latest version of Internet Explorer includes many new enhancements. One of
    the enhancements includes a new way of accepting cookies. Now you have the capability
    to specify whether you would like your browser to block all cookies or just certain
    types of cookies. To use this new feature, you need to understand the two different
    types of cookies:


    +   * **First-party cookies**—Placed on your computer by the current site that
    you are visiting.

    * **Third-party cookies**—Placed on your computer by remote sites, such as advertisement
    servers.'
  merge: -1
  img_proc: true
- pgno: 384
  md: '![](img/ea75090cfee8ac890f64c8c4f62f7285_384_0.png)


    **Figure 20-2:** Clearing browser data in Internet Explorer 10 is easier than
    ever.


    The difference between good and bad cookies is how they are issued. If you go
    to Tweaks.com, the web server issues your browser a first-party cookie. That cookie
    contains harmless user session data so the web server knows whether you are logged
    in. The cookies that have the potential to be abused are called third-party cookies
    because they are not issued by the web server you are visiting, but rather by
    a third-party. These cookies are common among online advertising programs such
    as Google AdSense. The privacy concern that can make them bad cookies depends
    on what the advertising company does with them. With a third-party cookie, it
    is technically possible for Google to monitor which websites you visit and then
    deliver advertisements that are relevant to'
  merge: -1
  img_proc: true
- pgno: 385
  md: 'what you do on the web. This is possible because Google AdSense is used by
    about one out of four websites online, which means one out of four websites are
    making your browser connect to Google''s servers to display an advertisement.
    When that call is made to Google''s servers, it can read third-party cookies it
    placed on your computer from other AdSense-using websites that you visited because
    they made the same call to Google AdSense servers to get an advertisement to display.
    Behind the scenes, Google''s advertisement-serving software can connect the dots
    and build a profile of what types of websites you visit. Combine that with what
    you search for on Google''s search site, and Google has a very good picture about
    who you are and what you need.


    If you don''t want to be tracked online with the help of third-party cookies,
    it is possible to tweak your cookie acceptance settings. Just follow these steps:


    +   1. Open Internet Explorer.

    2. Click the gear icon and select Internet Options.

    3. When Internet Options loads, click the Privacy tab.

    4. You can move the up-and-down slider to adjust your level of cookie security,
    but I recommend that you bypass this and click the Advanced button instead.

    5. After you have clicked the Advanced button and see the Advanced Privacy Settings
    window, select the box that says Override Automatic Cookie Handling.

    6. Your settings for first and third-party cookies are available for adjustment,
    as shown in Figure 20-3.


    ![](img/ea75090cfee8ac890f64c8c4f62f7285_385_0.png)


    **Figure 20-3:** Adjust your cookie privacy settings to block third-party cookies.'
