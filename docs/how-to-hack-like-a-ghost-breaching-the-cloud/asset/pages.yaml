  md: 'The pod names we retrieved in Listing 8-4 are full of advertising and technical
    keywords such as SSP, api, kafka, and so forth. It’s safe to assume that MXR Ads
    runs all its applications involved in the ad delivery process on Kubernetes. This
    must allow them to scale their applications up and down according to traffic.
    We continue exploring other pods and come across some containers that literally
    load AWS credentials. Oh, this is going to hurt:


    ```

    NODE    ip-192-168-162-215.eu-west-1.compute.internal

    POD     creative-scan-depl-13dd-9swkx

    PODIP   10.20.98.12

    PORT    5000

    SERVICE default

    ENV     AWS_SCAN_ACCESSKEY, AWS_SCAN_SECRET

    FILESECRET default-token-2mpcg

    ```


    We also spot a couple of datastores, like Redis and Elasticsearch. This is going
    to be interesting.


    # Breaking Into Datastores


    Our most crucial advantage right now is the fact that we managed to cross the
    firewall border. We are inside the cluster, within the so-called trusted zone.
    DevOps admins still operate under the false pretense that there is such a thing
    as a trusted network, even when the damn thing belongs to a cloud provider. John
    Lambert’s piece on the defender’s mindset (https://github.com/JohnLaTwC/Shared)
    is still on point: “Defenders think in lists. Attackers think in graphs. As long
    as this is true, attackers win.”


    Redis is a key-value memory database mostly used for caching purposes, and Elasticsearch
    is a document-based database geared toward text search queries. We gather from
    this pod’s description that Elasticsearch is used for storing audit logs of some,
    and maybe all, applications:


    ```

    NODE    ip-192-168-72-204.eu-west-1.compute.internal

    POD     audit-elastic-depl-3dbc-3qozx

    PODIP   10.20.86.24

    PORT    9200

    SERVICE default

    ENV.    <none>

    FILESECRET default-token-2mpcg

    ```


    Authentication and encryption are the first measures dropped due to the trusted
    network nonsense. I have yet to stumble upon a Redis database in an internal network
    that requires authentication. The same goes for Elasticsearch and other famous
    nonrelational databases that jokingly ask admins to run the application in a “secure”
    environment, whatever that means.


    I understand. Security is supposedly not the job of the admin; they’d rather focus
    on performance, availability, and consistency of data. But this mindset is not
    only flawed, it’s reckless. Security is the foremost requirement'
