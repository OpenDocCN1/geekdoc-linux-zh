- pgno: 70
  md: '```

    org:mxrAds  BEGIN RSA PRIVATE KEY

    org:mxrAds  BEGIN OPENSSH PRIVATE KEY

    org:mxrAds  secret_key

    org:mxrAds  hooks.slack.com/services

    org:mxrAds  sshpass -p

    org:mxrAds  sq0csp

    org:mxrAds  apps.googleusercontent.com

    org:mxrAds  extension:pem key

    ```


    The annoying limitation of GitHub’s search API is that it filters out special
    characters. When we search for “aws_secret_access_key,” GitHub will return any
    piece of code matching any of the four individual words (aws, secret, access,
    or key). This is probably the only time I sincerely miss regular expressions.


    > NOTE

    The GitHub alternative Bitbucket does not provide a similar search bar. It even
    specifically instructs search engines to skip over URLs containing code changes
    (known as commits). Not to worry: Yandex.ru has the nasty habit of disregarding
    these rules and will gladly show you every master tree and commit history on Bitbucket
    public repos using something like site:bitbucket.org inurl:master.


    Keep in mind that this phase of the recon is not only about blindly grabbing dangling
    passwords; it’s also about discovering URL and API endpoints, and acquainting
    ourselves with the technological preferences of the two companies. Every team
    has some dogma about which framework to use and which language to work with. This
    information might later help us adjust our payloads.


    Unfortunately, preliminary GitHub search queries did not return anything worthy,
    so we bring out the big guns and bypass GitHub limitations altogether. Since we’re
    only targeting a handful of repositories, we’ll download the entire repositories
    to disk to unleash the full wrath of good ol’ grep!


    We’ll start with the interesting list of hundreds of regular expression (regex)
    patterns defined in shhgit, a tool specifically designed to look for secrets in
    GitHub, from regular passwords to API tokens (https://github.com/eth0izzle/shhgit/).
    The tool itself is also very useful for defenders, as it flags sensitive data
    pushed to GitHub by listening for webhook events—a webhook is a call to a URL
    following a given event. In this case, GitHub sends a POST request to a predefined
    web page every time a regex matches a string in the code submitted.


    We rework the list of patterns, which you can find at https://www.hacklikeapornstar.com/secret_regex_patterns.txt,
    to make it grep-friendly. Then we download all the repos:


    ```

    root@Point1:~# while read p; do \

    git clone www.github.com/MXRads/$p\

    done <list_repos.txt

    ```'
