- pgno: 79
  md: '# 5


    # VULNERABILITY SEEKING


    ![](img/961e81aef23040d0fbe348f58c055860_79_0.png)


    We have around 150 domains to explore for various vulnerabilities: code injection,
    path traversal, faulty access controls, and so on. Hackers new to this type of
    exercise often feel overwhelmed by the sheer number of possibilities. Where to
    start? How much time should we spend on each website? Each page? What if we miss
    something?


    This is probably the phase that will challenge your confidence the most. I will
    share as many shortcuts as possible in this book, but believe me when I say that
    for this particular task, the oldest recipe in the world is the most effective
    one: *the more you practice, the better you will get*. The more fantastic and
    incredible the vulnerabilities you encounter, the more confidence you will gain,
    not only in yourself, but also in the inevitability of human errors.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# Practice Makes Perfect


    So how do you get started? Well, completing capture-the-flag (CTF) challenges
    is one way to master the very basic principles of exploits like SQL injections,
    cross-site scripting (XSS), and other web vulnerabilities. But be aware that these
    exercises poorly reflect the reality of a vulnerable application; they were designed
    by enthusiasts as amusing puzzles rather than the result of an honest mistake
    or a lazy copy-paste from a Stack Overflow post.


    The best way to learn about exploits is to try them in a safe environment. For
    example, experiment with SQL injections by spinning up a web server and a database
    in your lab, writing an app, and experimenting with it. Discover the subtleties
    of different SQL parsers, write your own filters to prevent injections, try to
    bypass those same filters, and so on. Get into the mind of a developer, face the
    challenge of parsing unknown input to build a database query or persist information
    across devices and sessions, and you will quickly catch yourself making the same
    dangerous assumptions the developers fall prey to. And as the saying goes, behind
    every great vulnerability there lies a false assumption lurking to take credit.
    Any stack will do for experimentation purposes: Apache + PHP, Nginx + Django,
    NodeJS + Firebase, and so on. Learn how to use these frameworks, understand where
    they store settings and secrets, and determine how they encode or filter user
    input.


    With time, you''ll develop a keen eye for spotting not only potentially vulnerable
    parameters, but how they are being manipulated by the application. Your mindset
    will change from “How can I make it work?” to “How can I abuse or break it?” Once
    this gear starts revolving in the back of your head, you will not be able to turn
    it off—trust me.


    I also encourage you to take a look at what others are doing. I find great delight
    in reading bug bounty reports shared by researchers on Twitter, Medium, and other
    platforms like https://pentester.land. Not only will you be inspired by the tooling
    and methodology, but you will also be reassured, in some sense, that even the
    biggest corporations fail at the most basic features like password reset forms.


    Thankfully, for our purposes we are not in penetration test engagement, so time
    will be the least of our concerns. It is in fact our most precious ally. We will
    spend as much time as we deem necessary on each website. Your flair and curiosity
    are all the permissions you need to spend the whole day toying with any given
    parameter.


    # Revealing Hidden Domains


    Back to our list of domains. When dealing with a full cloud environment, there
    is a shortcut that will help us learn more about websites and indeed prioritize
    them: we can reveal the real domains behind public-facing domains. Cloud providers
    usually produce unique URLs for each resource created by a customer, such as servers,
    load balancers, storage, managed databases, and content distribution endpoints.
    Take Akamai, a global content delivery network (CDN), for example. For a regular
    server, Akamai will'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'create a domain name like *e9657.b.akamaiedge.net* to optimize packet transfer
    to that server. But no company will seriously use this unpronounceable domain
    for the public; they’ll hide it behind a glamorous name like *stellar.mxrads.com*
    or *victory.gretschpolitico.com*. The browser may think it is communicating with
    *victory.gretschpolitico.com*, but the network packet is actually being sent to
    the IP address of *e9657.b.akamaiedge.net*, which then forwards the packet to
    its final destination.


    If we can somehow figure out these hidden cloud names concealed behind each of
    the websites we retrieved, we may deduce the cloud service the websites rely on
    and thus focus on those services more likely to exhibit misconfigurations: Akamai
    is nice, but AWS S3 (storage service) and API Gateway (managed proxy) are more
    interesting, as we shall soon see. Or, if we know that a website is behind an
    AWS Application Load Balancer, for example, we can anticipate some parameter filtering
    and therefore adjust our payloads. Even more interesting, we can try looking up
    the “origin” or real server IP address and thus bypass the intermediary cloud
    service altogether.


    > Finding the real IPs of services protected by Akamai, Cloudflare, CloudFront,
    and other distribution networks is not straightforward. Sometimes the IP leaks
    in error messages, sometimes in HTTP headers. Other times, if luck puffs your
    way and the server has a unique enough fingerprint, you can find it using Shodan,
    ZoomEye, or a custom tool like CloudBunny (https://github.com/Warflop/CloudBunny/).


    Let’s go back to our list of domains and push our DNS recon an extra step to find
    these hidden domains. We want to look for *CNAME entries* (name records that point
    to other name records) rather than IP addresses (as the more common A records
    do). The command getent hosts pulls these CNAME records:


    ```

    root@Point1:~# getent hosts thor.mxrads.com

    91.152.253.4    e9657.b.akamaiedge.net stellar.mxrads.com

    stellar.mxrads.com.edgekey.net

    ```


    We can see that *thor.mxrads.com* is indeed behind an Akamai distribution point.


    Not all alternative domains are registered as CNAME records; some are created
    as ALIAS records that do not explicitly show up in the name resolution process.
    For these stubborn cases, we can guess the AWS service by looking up the IP address
    in the public range published in the AWS documentation under General Reference.


    I could not find a simple tool to perform this type of extended DNS reconnaissance,
    so I wrote a script to automate the process: *DNS Charts*, found at https://dnscharts.hacklikeapornstar.com/.
    We build a list of domains and then feed it to DNS Charts to look for those CNAME
    entries, with some additional regex matching to guess the cloud service. The result
    is printed in a colorful graph that highlights the underlying interactions between
    domains, as well as the main cloud services used by a company. Figure 5-1 shows
    some sample output of the tool.'
