- pgno: 228
  md: "First, the driver builds a directed acyclic graph (DAG), which is a sort of\
    \ summary of all the operations that are performed on the RDDs, like loading,\
    \ map, flatMap, storing as a file, and so on (see Figure 12-1).\n\n![](img/961e81aef23040d0fbe348f58c055860_228_0.png)\n\
    \nFigure 12-1: Example of a simple DAG composed of two steps: parallelize and\
    \ map\n\nThe driver then registers the workload on the master by sending a few\
    \ key properties: the workload's name, the memory requested, the number of initial\
    \ executors, and so forth. The master acknowledges the registration and assigns\
    \ Spark workers to the incoming job. It shares their details (IP and port number)\
    \ with the driver, but no action follows. Up until this point, no real computation\
    \ is performed. The data still sits on the driver's side.\n\nThe driver continues\
    \ parsing the script and adding steps to the DAG, when needed, until it hits what\
    \ it considers to be an action, a Spark API that forces the collapse of the DAG.\
    \ This action could be a call to display an output, save a file, count elements,\
    \ and so on (you can find a list of Spark actions at http://bit.ly/3aW64Dh). Then\
    \ and only then will the DAG be sent to the Spark workers. These workers follow\
    \ the DAG to run the transformations and actions it contains.\n\nFine. We upgrade\
    \ our code to add an action (in this case, a collect method) that will trigger\
    \ the app's submission to a worker node (see Listing 12-7).\n\n```\n```python\n\
    from pyspark import SparkContext, SparkConf\n--snip--\npartList = sc.parallelize(range(0,\
    \ 10))\nPopen([\"hostname\"], stdout=subprocess.PIPE).stdout.read()\n\nfor a in\
    \ finallist.collect():\n    print(a)\n```\n```\n\nListing 12-7: Adding an action\
    \ to the malicious Spark application\n\nBut we're still missing a crucial piece.\
    \ Workers only follow the DAG, and the DAG only accounts for RDD resources. We\
    \ need to call Python's Popen in order to execute commands on the workers, yet\
    \ Popen is neither a Spark transformation like map nor an action like collect,\
    \ so it will be omitted from the DAG. We need to cheat and include our command\
    \ execution inside a Spark transformation (a map, for instance), as shown in Listing\
    \ 12-8.\n\n```\n```python\nfrom pyspark import SparkContext, SparkConf\nfrom subprocess\
    \ import Popen\n```\n```"
  merge: -1
  img_proc: true
