  md: '# 3


    # LET THERE BE INFRASTRUCTURE


    ![](img/961e81aef23040d0fbe348f58c055860_41_0.png)


    In this chapter we’ll set up the backend attacking infrastructure as well as the
    tooling necessary to faithfully reproduce and automate almost every painful aspect
    of the manual setup. We’ll stick with two frameworks: Metasploit for Linux targets
    and SILENTTRINITY for Windows boxes.


    # Legacy Method


    The old way to set up an attacking infrastructure would be to install each of
    your frameworks on a machine and place a web server in front of them to receive
    and route traffic according to simple pattern-matching rules. As illustrated in
    Figure 3-1, requests to /secretPage get forwarded to the C2 backend, while the
    rest of the pages return seemingly innocuous content.'
  merge: -1
  img_proc: true
- pgno: 42
  md: "![](img/961e81aef23040d0fbe348f58c055860_42_0.png)\n\nFigure 3-1: Illustration\
    \ of the C2 backend\n\nThe Nginx web server is a popular choice to proxy web traffic\
    \ and can be tuned relatively quickly. First, we install it using a classic package\
    \ manager (apt in this case):\n\n```\nroot@Lab:~# apt install -y nginx\nroot@Lab:~#\
    \ vi /etc/nginx/conf.d/reverse.conf\n```\n\nThen we create a config file that\
    \ describes our routing policies, as shown in Listing 3-1.\n\n```\n#/etc/nginx/conf.d/reverse.conf\n\
    \nserver {\n    # basic web server configuration\n    listen 80;\n\n    # normal\
    \ requests are served from /var/www/html\n    root /var/www/html;\n    index index.html;\n\
    \    server_name www.mydomain.com;\n\n    # return 404 if no file or directory\
    \ match\n    location / {\n        try_files $uri $uri/ =404;\n    }\n\n    #\
    \ /msf URL gets redirected to our backend C2 framework\n    location /msf {\n\
    \        proxy_pass https://192.168.1.29:8443;\n        proxy_ssl_verify off;\n\
    \        proxy_set_header Host $host;\n        proxy_set_header X-Forwarded-For\
    \ $proxy_add_x_forwarded_for;\n    }\n    # repeat previous block for other C2\
    \ backends\n}\n```\n\nListing 3-1: Standard Nginx configuration file with HTTP\
    \ redirectors\n\nThe first few directives define the root directory containing\
    \ web pages served for normal queries. Next, we instruct Nginx to forward the\
    \ URLs we want to redirect, starting with /msf, straight to our C2 backend, as\
    \ is evident by the proxy_pass directive."
