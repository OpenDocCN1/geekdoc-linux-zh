- pgno: 188
  md: "# The Path to Apotheosis\n\nWe load the AWS access keys we retrieved from Kube\
    \ and check out the permissions of a random user. Kevin from Chapter 8, for instance,\
    \ is as good a target as any:\n\n```\nroot@Point1:~/# aws iam get-user --profile\
    \ kevin\n\"User\": {\n  \"UserName\": \"kevin.duncan\",\n--snip--\n```\n\nWe know\
    \ that, by default, IAM users have absolutely zero rights on AWS. They cannot\
    \ even change their own passwords. Companies will therefore almost always grant\
    \ users just enough rights on the IAM service that handles users and permissions\
    \ to perform basic operations like changing passwords, listing policies, enabling\
    \ multifactor authentication, and so on.\n\nTo limit the scope of these permissions,\
    \ admins will often add a condition to accept IAM API calls targeting only the\
    \ calling user. For example, Kevin is probably allowed to list his own permissions,\
    \ but not those attached to other users:\n\n```\nroot@Point1:~/# aws iam list-attached-user-policies\
    \ \\\n--user-name=kevin.duncan \\\n--profile kevin\n\n\"PolicyArn\": \"arn:aws:iam::886371554408:policy/mxrads-self-manage\"\
    ,\n\"PolicyArn\": \"arn:aws:iam::886371554408:policy/mxrads-read-only\",\n\"PolicyArn\"\
    : \"arn:aws:iam::886371554408:policy/mxrads-eks-admin\"\n```\n\nIndeed, we get\
    \ an error as soon as we call an IAM command on a resource other than Kevin, like\
    \ so:\n\n```\nroot@Point1:~/# aws iam get-policy \\\n--policy-arn mxrads-self-manage\
    \ \\\n--profile kevin\n\nAn error occurred (AccessDenied) when calling the GetPolicy\
    \ operation:\nUser: arn:aws:iam::886371554408:user/kevin.duncan is not authorized\
