    SecretAccessKey: xn37rimjEAppjDicZZP19hOhLuTo2P06SXZxeHbk,\nSessionToken: FwoGZXlVYXdzEGwa...\n\
    ```\n\nThat was not so hard after all. Okay, let's use these access credentials\
