  md: "```\n-v /var/run/docker.sock:/var/run/docker.sock \\\n-v /usr/bin/docker:/usr/bin/docker\
    \ \\\n-d 886477354405.dkr.ecr.eu-west-1.amazonaws.com/aws-cli\n```\n\nOur new\
