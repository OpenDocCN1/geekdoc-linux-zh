  md: 'all the available information about each person, and given the size of MXR
    Ads’ platform, these data profiles could easily reach hundreds if not thousands
    of terabytes.


    Two problems commonly arise when companies are dealing with such ridiculous volumes.
    Where do they store the raw data? And how can they process it efficiently?


    Storing raw data is easy. S3 is cheap and reliable, so that’s a no-brainer. Processing
    gigantic amounts of data, however, is a real challenge. Data scientists looking
    to model and predict behavior at a reasonable cost need a distributed system to
    handle the load—say, 500 machines working in parallel, each training multiple
    models with random hyperparameters until they find the formulas with the lowest
    error rate.


    But that raises additional problems. How can they partition the data efficiently
    among the nodes? What if all the machines need the same piece of data? How do
    they aggregate all the results? And most important of all: how do they deal with
    failure? Because there sure is going to be failure. For every 1,000 machines,
    on average 5, if not more, will die for any number of reasons, including disk
    issues, overheating, power outage, and other hazardous events, even in a top-tier
    datacenter. How can they redistribute the failed workload on healthier nodes?


    It is exactly these questions that Apache Spark aims to solve with its distributed
    computing framework. If Spark is involved in Gretsch Politico, then it’s most
    likely being used to process massive amounts of data that could very likely be
    the user profiles we are after—hence our interest in the IP address we retrieved
    on the Jenkins machine.


    Breaking into the Spark cluster would automatically empower us to access the raw
    profiling data, learn what kind of processing it goes through, and understand
    how the data is exploited by Gretsch Politico.


    As of this moment, however, there is not a single hacking post to help us shake
    down a Spark cluster (the same observation can be made about almost every tool
    involved in big data: Yarn, Flink, Hadoop, Hive, and so on). Not even an Nmap
    script to fingerprint the damn thing. We are sailing in uncharted waters, so the
    most natural step is to first understand how to interact with a Spark cluster.


    # Understanding Spark


    A Spark cluster is essentially composed of three major components: a master server,
    worker machines, and a driver. The driver is the client looking to perform a calculation;
    that would be the analyst’s laptop, for instance. The master’s sole job is to
    manage workers and assign them jobs based on memory and CPU requirements. Workers
    execute whatever jobs the master sends their way. They communicate with both the
    master and the driver.


    Each of these three components is running a Spark process inside a Java virtual
    machine (JVM), even the analyst’s laptop (driver). Here is the kicker, though:
    security is off by default on Spark.'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'We are not only talking about authentication, mind you, which would still be
    bad. No, security altogether is disabled, including encryption, access control,
    and, of course, authentication. It''s 2021, folks. Get your shit together.


    In order to communicate with a Spark cluster, a couple of network requirements
    are needed according to the official documentation. We first need to be able to
    reach the master on port 7077 to schedule jobs. The worker machines also need
    to be able to initiate connections to the driver (our Jenkins node) to request
    the JAR file to execute, report results, and handle other scheduling steps.


    Given the presence of the SPARK_MASTER environment variable in Listing 12-3, we
    are 90 percent sure that Jenkins runs some Spark jobs, so we can be pretty confident
    that all these network conditions are properly lined up. But just to be on the
    safe side, let''s first confirm that we can at least reach the Spark master. The
    only way to test the second network requirement (that workers can connect to the
    driver) is by submitting a job or inspecting security groups.


    We add a route to the 10.0.0.0/8 range on Metasploit to reach the Spark master
    IP (10.50.12.67) and channel it through our current meterpreter session:


    ```

    meterpreter > background


    msf exploit(multi/handler) > route add 10.0.0.0 255.0.0.0 12

    [*] Route added

    ```


    We then use the built-in Metasploit scanner to probe port 7077:


    ```

    msf exploit(multi/handler) > use auxiliary/scanner/portscan/tcp

    msf exploit(scanner/portscan/tcp) > set RHOSTS 10.50.12.67

    msf exploit(scanner/portscan/tcp) > set PORTS 7077

    msf exploit(scanner/portscan/tcp) > run


    [+] 192.168.1.24:      - 192.168.1.24:7077 - TCP OPEN

    [*] Scanned 1 of 1 hosts (100% complete)

    ```


    No surprises. We are able to communicate with the master. All right, let''s write
    our first evil Spark application!


    # Malicious Spark


    Even though Spark is written in Scala, it supports Python programs very well.
    There is a heavy serialization cost to pay for translating Python objects into
    Java objects, but what do we care? We only want a shell on one of the workers.


    Python even has a pip package that downloads 200MB worth of JAR files to quickly
    set up a working Spark environment:


    ```

    $ python -m pip install pyspark

    ```'
