  img_proc: true
- pgno: 74
  md: '![](img/961e81aef23040d0fbe348f58c055860_74_0.png)


    Figure 4-7: Looking for subdomains with Censys


    So much for transparency. It seems that GP did not bother registering subdomain
    certificates and has instead opted for a wildcard certificate: a generic certificate
    that matches any subdomain. One certificate to rule them all. Whether this is
    a brilliant security move or pure laziness, the fact is, we''re no further than
    the top domain. We try other top-level domains in Censys—gretschpolitico.io, mxrads.tech,
    mxrads.com, gretschpolitico.news, and so forth—but come up equally empty-handed.
    Our list of domains grew by a whopping big fat zero . . . but do not despair!
    We have other tricks up our collective sleeves.


    > **NOTE** Of course, wildcard certificates present another security problem:
    they are a brazen single point of failure. Should we stumble upon the private
    key while roaming the company''s network, we could intercept the communication
    flow of all applications using that same parent domain.


    # By Harvesting the Internet


    If certificates are not the way to gather subdomains, then maybe the internet
    can lend us a helping hand. Sublist3r is a great and easy-to-use tool that harvests
    subdomains from various sources: search engines, PassiveDNS, even VirusTotal.
    First, we fetch the tool from the official repository and install requirements:


    ```

    root@Point1:~# git clone https://github.com/aboul3la/Sublist3r

    root@Point1:sub/# python -m pip install -r requirements.txt

    ```


    Then we proceed to search for subdomains, as shown in Listing 4-1.


    ```

    root@Point1:~# python sublist3r.py -d gretschpolitico.com

    [-] Enumerating subdomains now for gretschpolitico.com

    [-] Searching now in Baidu..

    [-] Searching now in Yahoo..

    [-] Searching now in Netcraft..

    [-] Searching now in DNSdumpster..

    --snip--

    [-] Searching now in ThreatCrowd..

    [-] Searching now in PassiveDNS..


    [-] Total Unique Subdomains Found: 12

    dashboard.gretschpolitico.com

    ```'
