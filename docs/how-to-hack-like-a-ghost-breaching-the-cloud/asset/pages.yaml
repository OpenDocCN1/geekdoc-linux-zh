    This rather explicit command only displays the spec.nodeName and metadata .name
    fields of the pods’ manifests. Let’s get some additional data, like secrets, service
    accounts, pod IPs, and so on. As you can see in Listing 8-4, the filter grows
    thicker to read, but it essentially walks through arrays and maps in YAML to fetch
    the relevant information.


    ```

