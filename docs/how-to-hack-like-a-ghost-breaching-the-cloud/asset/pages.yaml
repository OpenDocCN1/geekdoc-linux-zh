    )\nfor repo in g.get_user().get_repos():\n    print(repo.name, repo.clone_url)\n\
    ```\n\nWe then search for references to keywords such as cookbook, Jenkins, Chef,\
    \ recipe, and so forth (see Listing 10-6).\n\n```\nroot@Point1:~/# python3 list_repos.py\
