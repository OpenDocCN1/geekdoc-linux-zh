  md: '```

    # get the host''s IP and SSH into it

    root@DemoContainer:/# ssh root@172.17.0.1


    root@host:/#

    ```


    > NOTE

    An unprivileged user even inside a privileged container could not easily break
    out using this technique since the mount command would not work. They would need
    to first elevate their privileges or attack other containers on the same host
    that are exposing ports, for instance.


    You would think that nobody would dare run a container in privileged mode, especially
    in a production environment, but life is full of surprises, and some folks may
    require it. Take a developer who needs to adjust something as simple as the TCP
    timeout value (a kernel option). To do this, the developer would naturally browse
    the Docker documentation and come across the sysctl Docker flag, which essentially
    runs the sysctl command from within the container. However, when run, this command
    will, of course, fail to change the kernel TCP timeout option unless it''s invoked
    in privileged mode. The fact that putting the container in privileged mode is
    a security risk would not even cross this developer''s mind—sysctl is an official
    and supported flag described in the Docker documentation, for heaven''s sake!


    # Linux Capabilities


    Now we can return to our survey app to check whether we can easily break namespace
    isolation. We list the /dev folder''s contents, but the result lacks all the classic
    pseudo-device files like tty*, sda, and mem that imply privileged mode. Some admins
    trade the privileged mode for a list of individual permissions or capabilities.
    Think of capabilities as a fine-grained breakdown of the permissions classically
    attributed to the all-powerful root user on Linux. A user with the capability
    CAP_NET_ADMIN would be allowed to perform root operations on the network stack,
    such as changing the IP address, binding to lower ports, and entering promiscuous
    mode to sniff traffic. The user would, however, be prevented from mounting filesystems,
    for instance. That action requires the CAP_SYS_ADMIN capability.


    > NOTE

    One can argue that the capability CAP_SYS_ADMIN is the new root, given the number
    of privileges it grants.


    When instructed to do so by the container''s owner with the --add-cap flag, Docker
    can attach additional capabilities to a container. Some of these powerful capabilities
    can be leveraged to break namespace isolation and reach other containers or even
    compromise the host by sniffing packets routed to other containers, loading kernel
    modules that execute code on the host, or mounting other containers'' filesystems.'
