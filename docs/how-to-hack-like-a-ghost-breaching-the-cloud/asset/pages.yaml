    Finally, the public hostname gives us a direct route to the machine running the
    demo application (or EC2 instance in AWS jargon), provided local firewall rules
    allow us to reach it. This machine’s public IP can be deduced from its canonical
    hostname: 3.248.221.147 9.


    Speaking of network configuration, let’s pull the firewall configuration from
