- pgno: 49
  md: '```

    Successfully built f5658cf8e13c

    Successfully tagged silent:latest

    ```


    Each instruction generates a new set of files that are grouped together. These
    folders are usually stored in /var/lib/docker/overlay2/ and named after the random
    ID generated by each step, which will look something like fad2b9f06d3b, 94f5fc21a5c4,
    and so on. When the image is built, the files in each folder are combined under
    a single new directory called the image layer. Higher directories shadow lower
    ones. For instance, a file altered in step 3 during the build process will shadow
    the same file created in step 1.


    > The directory changes according to the storage driver used: /var/lib/docker/aufs/diff/,
    /var/lib/docker/overlay/diff/, or /var/lib/docker/overlay2/diff/. More information
    about storage drivers is available at https://dockr.ly/2N7kPsB.


    When we run this image, Docker mounts the image layer inside the container as
    a single read-only and chrooted filesystem. To allow users to alter files during
    runtime, Docker further adds a writable layer, called the container layer or upperdir,
    on top, as illustrated in Figure 3-4.


    ![](img/961e81aef23040d0fbe348f58c055860_49_0.png)


    Figure 3-4: Writable layer for a Docker image. Source: https://dockr.ly/39Toleq.


    This is what gives containers their immutability. Even though you overwrite the
    whole /bin directory at runtime, you actually only ever alter the ephemeral writable
    layer at the top that masks the original /bin folder. The writable layer is tossed
    away when the container is deleted (recall the --rm option). The underlying files
    and folders prepared during the image build remain untouched.


    We can start the newly built image in the background using the -d switch:


    ```

    root@Lab:~/# docker run -d \

    -v /opt/st:/root/st/data \

    -p5000:5000 \

    silent


    3adf0cfdaf374f9c049d40a0eb3401629da05abc48c


    # Connect to the team server running on the container

    root@Lab:~st/# python3.7 st.py \

    wss://username:strongPasswordCantGuess@192.168.1.29:5000


    [1] ST >>

    ```'
