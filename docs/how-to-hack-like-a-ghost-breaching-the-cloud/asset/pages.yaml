- pgno: 235
  md: 'Gretsch Politico does this kind of processing every day with its little army
    of data experts. Can’t we leverage their work to steal the end result instead
    of reinventing the wheel from scratch?


    # Stealing Processed Data


    Data processing and data transformation on Spark are usually only the first step
    of a data’s lifecycle. Once the data is enriched with other inputs, cross-referenced,
    formatted, and scaled out, it is stored on a second medium. There, it can be explored
    by analysts (usually through some SQL-like engine) and eventually fed to training
    algorithms and prediction models (which may or may not run on Spark, of course).


    The question is, where does GP store its enriched and processed data? The quickest
    way to find out is to search the Jupyter notebooks for hints of analytical tool
    mentions, SQL-like queries, graphs and dashboards, and the like (see Listing 12-9).


    ```

    root@Point1:~notebooks/# egrep -R -5 "sql|warehouse|snowflake|redshift|bigquery"
    *


    redshift_endpoint = "sandbox.cdc3ssq81c3x.eu-west-1.redshift.amazonaws.com"


    engine_string = "postgresql+psycopg2://%s:%s@%s:5439/datalake" \

    % ("analytics-ro", "test", redshift_endpoint)


    engine = create_engine(engine_string)


    sql = """

    select insertion_id, ctr, cpm, ads_ratio, segmentID,...;

    """

    --snip--

    ```


    Listing 12-9: SQL queries used in Jupyter notebooks


    Maybe we have found something worth investigating. Redshift is a managed PostgreSQL
    database on steroids, so much so that it is no longer appropriate to call it a
    database. It is often referred to as a data lake. It’s almost useless for querying
    a small table of 1,000 lines, but give it a few terabytes of data to ingest and
    it will respond with lightning speed! Its capacity can scale up as long as AWS
    has free servers (and the client has cash to spend, of course).


    Its notable speed, scalability, parallel upload capabilities, and integration
    with the AWS ecosystem position Redshift as one of the most efficient analytical
    databases in the field—and it’s probably the key to our salvation!


    Unfortunately, the credentials we retrieved belong to a sandbox database with
    irrelevant data. Furthermore, none of our AWS access keys can directly query the
    Redshift API:


    ```

    root@Point1:~/# aws redshift describe-clusters \

    --profile=data1 \

    --region eu-west-1


    An error occurred (AccessDenied) when calling the DescribeClusters...

    ```


    Time for some privilege escalation, it seems.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# Privilege Escalation


    Going through the dozen IAM access keys we got, we realize that all of them belong
    to the same IAM group and thus share the same basic privileges—that is, read/write
    to a few buckets coupled with some light read-only IAM permissions:


    ```

    root@Point1:~/# aws iam list-groups --profile=leslie

    "GroupName": "spark-s3",


    root@Point1:~/# aws iam list-groups --profile=marc

    "GroupName": "spark-s3",


    root@Point1:~/# aws iam list-groups --profile=camellia

    "GroupName": "spark-debug",

    "GroupName": "spark-s3",


    --snip--

    ```


    Hold on. Camellia belongs to an additional group called spark-debug. Let''s take
    a closer look at the policies attached to this group:


    ```

    root@Point1:~/# aws iam list-attach-group-policies --group-name spark-debug --profile=camellia


    "PolicyName": "AmazonEC2FullAccess",

    "PolicyName": "iam-pass-role-spark",

    ```


    Lovely. Camellia here is probably the person in charge of maintaining and running
    Spark clusters, hence the two policies she’s granted. EC2 full access opens the
    door to more than 450 possible actions on EC2, from starting instances to creating
    new VPCs, subnets, and pretty much anything related to the compute service.


    The second policy is custom-made, but we can easily guess what it implies: it
    allows us to assign roles to EC2 instances. We query the latest version of the
    policy document to assert our guess:


    ```

    # get policy version

    root@Point1:~/# aws iam get-policy \

    --policy-arn arn:aws:iam::983457354409:policy/iam-pass-role \

    --profile camellia


    "DefaultVersionId": "v1",


    # get policy content

    root@Point1:~/# aws iam get-policy-version \

    --policy-arn arn:aws:iam::983457354409:policy/iam-pass-role \

    --version v1 \

    --profile camellia


    "Action":"iam:PassRole",

    ```'
