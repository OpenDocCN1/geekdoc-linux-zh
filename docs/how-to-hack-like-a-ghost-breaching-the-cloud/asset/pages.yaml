- pgno: 93
  md: '# Server-Side Request Forgery


    A server-side request forgery (SSRF) attack involves us forcing some server-side
    application to make HTTP requests to a domain of our choosing. This can sometimes
    grant us access to internal resources or unprotected admin panels.


    # Exploring the Metadata


    We start gathering basic information about the machine running this web page-fetching
    application, again using Burp''s intercept mode. After intercepting our request,
    we substitute the hex-encoded metadata IP for the originally requested URL and
    then append AWS''s metadata API name to the end, as shown in Listing 5-1.


    > NOTE Spin up a regular machine on AWS and start exploring the metadata API to
    get a better grasp of the information available. You can find a list of all available
    fields at https://amzn.to/2FFwvPn.


    ```

    # AWS Region

    http://0xa9fea9fe/latest/meta-data/placement/availability-zone

    eu-west-1a


    # Instance ID

    http://0xa9fea9fe/latest/meta-data/instance-id

    i-088c8e93dd5703ccc


    # AMI ID

    http://0xa9fea9fe/latest/meta-data/ami-id

    ami-02df9ea15c1778c9c


    # Public hostname

    http://0xa9fea9fe/latest/meta-data/public-hostname

    ec2-3-248-221-147.eu-west-1.compute.amazonaws.com

    ```


    Listing 5-1: Basic information on the web app, pulled from the metadata API


    From this we see that the demo app is running in the eu-west-1 region, indicating
    one of Amazon''s datacenters in Ireland. There are dozens of regions available
    in AWS. While companies strive to distribute their most important applications
    across multiple regions, auxiliary services and sometimes backends tend to concentrate
    in a subset of regions. The instance ID, a unique identifier assigned to each
    virtual machine spawned in the EC2 service, is i-088c8e93dd5703ccc ①. This information
    can come in handy when executing AWS API calls targeting the machine running the
    ad application.


    The image ID ami-02df9ea15c1778c9c ② refers to the snapshot used to run the machine,
    such as an Ubuntu or CoreOS image. Machine images can be public (available to
    all AWS customers) or private (available only to'
