  md: '# Inspecting the Web-Facing Application


    Where is this damn application hiding? To weed it out, we go back to our DNS reconnaissance
    results from Figure 5-1 and, sure enough, the perfect suspect jumps out screaming
    from the lot: demo.mxrads.com. We saw the same “demo” keyword in the S3 keys with
    HTML files. We didn’t even have to grep.


    We enter demo.mxrads.com in the browser and see that the main image and headline
    seem to describe the behavior we were looking for (see Figure 5-3).


    ![](img/961e81aef23040d0fbe348f58c055860_88_0.png)


    Figure 5-3: Home page of demo.mxrads.com


    To take a closer look at this page, we’ll fire up Burp Suite, a local web proxy
    that conveniently intercepts and relays every HTTP request coming from our browser
    (OWASP fans can use ZAP, the Zed Attack Proxy). We reload demo.mxrads.com with
    Burp running and see the requests made by the site trickling down in real time,
    as shown in Figure 5-4.


    ![](img/961e81aef23040d0fbe348f58c055860_88_1.png)


    Figure 5-4: Burp inspection of the MXR Ads demo page


    NOTE For an extra layer of anonymity, we can instruct either Burp or ZAP to direct
    its traffic through a SOCKS proxy sitting on the attack server to make sure all
    packets originate from that distant host. Look for SOCKS proxy under Options in
    Burp.


    This is a great attack surface. Using Burp, we can intercept these HTTP(S) requests,
    alter them on the fly, repeat them at will, and even configure regex rules to
    automatically match and replace headers. If you’ve ever done a web pentest or
    CTF challenge, you must have used a similar tool. But we’ll set that aside for
    now and continue our investigation.


    We return to inspecting the demo.mxrads.com site. As we would suspect from a company
    like MXR Ads, this website offers to showcase demo ads on multiple browsers and
    devices, and also on some featured websites like'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'nytimes.com and theregister.com (see Figure 5-5). Sales teams around the world
    likely leverage these features to convince media partners that their technology
    seamlessly integrates with any web framework. Pretty clever.


    ![](img/961e81aef23040d0fbe348f58c055860_89_0.png)


    Figure 5-5: MXR Ads feature showcasing ads on various popular sites


    We’ll inspect the page by trying out the feature. We choose to display an ad on
    the New York Times website, and a new content window pops up with a lovely ad
    for a random perfume brand stacked in the middle of today’s NYT’s main page.


    This demo page may seem like a harmless feature: we point to a website, and the
    app fetches its actual content and adds a video player with a random ad to show
    potential clients what MXR Ads can do. What vulnerabilities could it possibly
    introduce? So many . . .


    Before we look at how to exploit this app, let’s first assess what’s happening
    behind the scenes using Burp Proxy. What happens when we click the NYT option
    to showcase an ad? We see the results in Figure 5-6.


    ![](img/961e81aef23040d0fbe348f58c055860_89_1.png)


    Figure 5-6: The HTTP History tab after we click the NYT option on demo.mxrads.com


    We don’t get much HTTP traffic, that’s for sure. Once the web page is loaded,
    the server responds with an “HTTP/1.1 101 Switching Protocols” message, then no
    more communication appears in the HTTP History tab. We need to switch to the WebSockets
    History tab to follow the rest of the exchange.


    # Interception with WebSocket


    WebSocket is another communication protocol alongside HTTP, but unlike HTTP WebSocket
    is a full-duplex communication channel. In the regular HTTP protocol, each server
    response matches a client request. The server does not maintain state between
    two requests; rather, the state'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'is handled by cookies and headers, which help the backend application remember
    who is calling which resource. WebSockets operate differently: the client and
    server establish a full-duplex and binding tunnel where each one can initiate
    communications at will. It is not uncommon to have several incoming messages for
    one outgoing message, or vice versa. (For more on WebSockets, check out https://blog.teamtreehouse.com/an-introduction-to-websockets/)
    The beautiful aspect of WebSockets is that they do not require HTTP cookies and
    therefore don''t bother supporting them. These are the same cookies that maintain
    the user authentication session! So whenever there is a switch from HTTP to WebSocket
    in authenticated sessions, there is an opportunity to bypass access control by
    directly fetching sensitive resources using WebSocket instead of HTTP—but that''s
    another class of vulnerability for another time. Figure 5-7 shows our WebSockets
    History tab.


    ![](img/961e81aef23040d0fbe348f58c055860_90_0.png)


    Figure 5-7: The WebSockets History tab for demo.mxrads.com


    The WebSocket communication seems pretty straightforward: each message to the
    server is composed of a URL (nytimes.com) followed by metrics related to the user''s
    browser (Mozilla/5.0 . . ), along with an identifier of the ad to display (437).
    Burp cannot replay (repeat in Burp terminology) past WebSocket communications,
    so to tamper with the WebSocket message we need to manually trigger it from the
    demo website.


    We turn on intercept mode in the Burp options, which will allow us to catch the
    next message exchanged and update it on the fly (see Figure 5-8). For instance,
    let''s see if we can get the MRX Ads site to fetch the home page of that Nginx
    container we set up in Chapter 3.


    ![](img/961e81aef23040d0fbe348f58c055860_90_1.png)


    Figure 5-8: Intercepting a web page in Burp


    We forward the modified request and head to our Docker container to explore the
    logs. We grab the container ID using docker ps and then feed it to docker logs:


    ```

    root@Nginx:~/# docker ps

    CONTAINER ID   IMAGE          COMMAND

    5923186ffda5   sparcflow/ngi...  "/bin/bash /sc..."

    ```'
