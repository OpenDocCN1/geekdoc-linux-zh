    ```


    GP may not fully realize it, but with the IAM PassRole action, they have implicitly
    given dear Camellia—and, by extension, us—total control over their AWS account.
    PassRole is a powerful permission that allows us to assign a role to an instance.
    Any role ①. Even an admin one. With EC2 full access, Camellia also manages EC2
    instances and can start a machine, stamp it with an admin role, and take over
    the AWS account.


    > NOTE

    Unlike MXR Ads, GP did not bother restricting IAM read-only calls to the user
    issuing the call—a common oversight in many companies that assign by default IAM
    list* and get* permissions to their users.


    Let’s explore our options in terms of which roles we, as Camellia, can pass to
    an EC2 instance. The only constraint is that the role needs to have ec2.amazonaws.com
    in its trust policy:


    ```

    root@Point1:~/# aws iam list-roles --profile camellia \

    | jq -r ''.Roles[] | .RoleName + ", " + \

    .AssumeRolePolicyDocument.Statement[].Principal.Service'' \

    | grep "ec2.amazonaws.com"

    --snip--

    jenkins-cicd, ec2.amazonaws.com

    jenkins-jobs, ec2.amazonaws.com

    rundeck, ec2.amazonaws.com

    spark-master, ec2.amazonaws.com

    ```


