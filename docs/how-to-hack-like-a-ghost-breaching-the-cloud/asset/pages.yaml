  md: 'That took some time, but we finally have a functioning shell ① inside MXR Ads’
    trusted environment. Let the fun begin.


    # THE SSRF ALTERNATIVE METHOD


    We chose to go through an S3 bucket to bypass the network ban, but if you recall,
    we already met an application that was not subject to these restrictions: the
    demo application from Chapter 5. We could have perfectly leveraged the SSRF vulnerability
    we found earlier to design a quasi-duplex communication channel using the following
    steps:


    +   1. We retrieve the demo app’s internal IP through the AWS metadata.

    2. We find the internal port used by the demo application. We run multiple curl
    queries from the survey site until we hit the real port used (3000, 5000, 8080,
    8000, and so on).

    3. We write an agent program that continuously asks the demo application to screenshot
    our attacking server.

    4. Our operator waits for queries on the attacking server and serves the commands
    to run inside a decoy HTML page.

    5. The agent extracts the commands and sends back the response in a URL parameter,
    again through the demo application.

    6. The operator program receives the URL and prints the output.


    I preferred to focus on the S3 scenario because it is much more commonly available
    and will likely prove more helpful in real life.


    # Trying to Break Free


    We finally made it into a server inside one of MXR Ads’ coveted VPCs, and we have
    root access . . . or do we? Does anyone still run a production application as
    root nowadays? Chances are, we are actually just inside a container, and the user
    “root” in this namespace is mapped to some random unprivileged user ID on the
    host.


    A quick way to corroborate our hypothesis is to look more closely at the process
    bearing the PID number 1: examine its command line attributes, cgroups, and mounted
    folders. We can explore these different attributes in the /proc folder—a virtual
    filesystem that stores information about processes, file handles, kernel options,
    and so on (see Listing 6-6).


    ```

    shell> id

    uid=0(root) gid=0(root) groups=0(root)


    shell> cat /proc/1/cmdline

    /bin/sh


    shell> cat /proc/1/cgroup

    11:freezer:/docker/5ea7b36b9d71d3ad8bfe4c58c65bbb7b541

    ```'
