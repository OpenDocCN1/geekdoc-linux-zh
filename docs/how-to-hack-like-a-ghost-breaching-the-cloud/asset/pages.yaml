- pgno: 71
  md: 'And start the search party:


    ```

    root@Point1:~# curl -vs

    https://gist.github.com/HackLikeAPornstar/ff2eabaa8e007850acc158ea3495e95f

    > regex_patterns.txt


    root@Point1:~# egrep -Ri -f regex_patterns.txt *

    ```


    This quick-and-dirty command will search through each file in the downloaded repositories.
    However, since we are dealing with Git repositories, egrep will omit previous
    versions of the code that are compressed and hidden away in Git’s internal filesystem
    structure (the .git folder). These old file versions are of course the most valuable
    assets! Think about all the credentials pushed by mistake or hardcoded in the
    early phases of a project. The famous line “It’s just a temporary fix” has never
    been more fatal than in a versioned repository.


    The git command provides the necessary tools we’ll use to walk down the commit
    memory lane: git rev-list, git log, git revert, and the most relevant to us, git
    grep. Unlike the regular grep, git grep expects a commit ID, which we provide
    using git rev-list. Chaining the two commands using xargs (extended arguments),
    we can retrieve all the commit IDs (all changes ever made to the repo) and search
    each one for interesting patterns using git grep:


    ```

    root@Point1:~# git rev-list --all | xargs git grep "BEGIN [EC|RSA|DSA|OPENSSH]
    PRIVATE KEY"

    ```


    We could also have automated this search using a bash loop or completely relied
    on a tool like Gitleaks (https://github.com/zricethezav/gitleaks/) or truffleHog
    (https://github.com/dxaa4481/truffleHog/) that takes care of sifting through all
    the commit files.


    After a couple of hours of twisting that public source code in every fashion possible,
    one thing becomes clear: there seems to be no hardcoded credentials anywhere.
    Not even a fake dummy test or test account to boost our enthusiasm. Either MXR
    Ads and GP are good at concealment or we are just not that lucky. No matter, we’ll
    move on!


    One feature of GitHub that most people tend to overlook is the ability to share
    snippets of code on https://gist.github.co, a service also provided by https://pastebin.com/.
    These two websites, and others such as https://codepen.io/, often contain pieces
    of code, database extracts, buckets, configuration files, and anything that developers
    want to exchange in a hurry. We’ll scrape some results from these sites using
    some search engine commands:


    ```

    # Documents on gist.github.com

    site:gist.github.com "mxrads.com"


    # Documents on Pastebin

    site:pastebin.com "mxrads.com"


    # Documents on JustPaste.it

    site:justpaste.it "mxrads.com"

    ```'
