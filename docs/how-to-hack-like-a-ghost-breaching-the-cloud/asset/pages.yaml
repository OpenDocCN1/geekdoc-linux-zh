- pgno: 168
  md: '# Kube Privilege Escalation


    Let''s put our new privileges to good use. The first thing we want to do is grab
    all the secrets defined in Kube; however, when we try it, we find that even though
    the system:nodes group technically has the permission to do so, it cannot arbitrarily
    request secrets:


    ```

    shell> kubectl get secrets --all-namespaces


    Error from server (Forbidden): secrets is forbidden:

    User "system:node:ip-192-168-98-157.eu-west-1.compute.internal" cannot list

    resource "secrets" in API group "" at the cluster scope: can only read

    namespaced object of this type

    ```


    A security feature introduced in Kubernetes version 1.10 limits the excessive
    power attributed to nodes: node authorization. This feature sits on top of classic
    role-based access control. A node can only exercise its ability to retrieve a
    secret if there are scheduled pods on that same node that need that secret. When
    those pods are terminated, the node loses access to the secret.


    There is no reason to panic, though. Any random node usually hosts dozens, if
    not hundreds, of different pods at any given time, each with its own dirty secrets,
    volume data, and so on. Maybe at 11 PM today our node can only retrieve the password
    of a dummy database, but give it 30 minutes and the kube-scheduler may send the
    node a pod with cluster admin privileges. It''s all about being on the right node
    at the right moment. We list the pods running on the current machine to find out
    which secrets we are entitled to fetch:


    ```

    shell> kubectl get pods --all-namespaces --field-selector\

    spec.nodeName=ip-192-168-21-116.eu-west-1.compute.internal


    prod   ads-rtb-deployment-13fe-3evx  1/1  Running

    prod   ads-rtb-deployment-12dc-5css  1/1  Running

    prod   kafka-feeder-deployment-23ee  1/1  Running

    staging digital-elements-deploy-83ce 1/1  Running

    test   flask-deployment-5d76c-qb5tz  1/1  Running

    --snip--

    ```


    Lots of heterogeneous applications are hosted on this single node. That seems
    promising. The node will probably have access to a large number of secrets spanning
    various components. We use our custom parser to automatically list the secrets
    mounted by each pod:


    ```

    shell> ./kubectl get pods -o="custom-columns=\

    NS:.metadata.namespace,\

    POD:.metadata.name,\

    ENV:.spec.containers[*].env[*].valueFrom.secretKeyRef,\

    FILESECRET:.spec.volumes[*].secret.secretName" \

    --all-namespaces \

    --field-selector spec.nodeName=ip-192-168-21-116.eu-west-1.compute.internal

    ```'
  merge: -1
  img_proc: true
- pgno: 169
