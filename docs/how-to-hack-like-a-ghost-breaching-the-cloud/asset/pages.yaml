- pgno: 166
  md: "channel, it is very probable that MXR Ads Terraform ed their Kube cluster by\
    \ declaring how many machines should ideally be running, what their network configuration\
    \ should look like, and which security groups are assigned to each machine. If\
    \ we alter these parameters, the change will be flagged on the next terraform\
    \ plan command. A security group that allows all ingress traffic to a random node\
    \ can only raise questions we’d rather avoid.\n\nWe continue to toy around with\
    \ the role attached to the Kube node, but it quickly hits its limits. It was so\
    \ severely restricted that it lost every ounce of interest. We can only describe\
    \ general information about the cluster’s components. We don’t have access to\
    \ the machines’ user data and can hardly change anything without sounding the\
    \ whistle.\n\nCome to think of it, why are we only considering this node as an\
    \ AWS resource? It is first and foremost a Kubernetes resource. A privileged one\
    \ at that. This node may have laughable permissions in the AWS environment, but\
    \ it is a supreme god in the Kubernetes world as it literally has life and death\
    \ authority over the pods in its realm.\n\nAs explained earlier, every node has\
    \ a running process called the kubelet that polls the API server for new pods\
    \ to spawn or terminate. Running containers means mounting volumes, injecting\
    \ secrets . . . how the hell does it achieve this level of access?\n\nAnswer:\
    \ via the node’s instance profile—aka the role we were playing with this whole\
    \ time.\n\nWhen you set up a Kubernetes cluster on EKS, one of the first configurations\
    \ to apply before even starting the nodes is to add the node IAM role name to\
    \ the system:nodes group. This group is bound to the Kubernetes role system:node,\
    \ which has read permissions on various Kube objects: services, nodes, pods, persistent\
    \ volumes, and 18 other resources!\n\nAll we have to do to inherit these powers\
    \ is ask AWS to morph our IAM access keys into a valid Kubernetes token so we\
    \ can query the API server as a valid member of the system:nodes group. To do\
    \ this we call the get-token API:\n\n```\nroot@Point1:~/# aws eks get-token --cluster-name\
    \ prod-euw1 --profile node\n{\n  \"kind\": \"ExecCredential\",\n  \"apiVersion\"\
    : \"client.authentication.k8s.io/v1alpha1\",\n  \"status\": {\n    \"expirationTimestamp\"\
    : \"2019-11-14T21:04:23Z\",\n    \"token\": \"k8s-aws-v1.aHR0cHM6Ly9zdHMUw1hem...\"\
    \n  }\n}\n```\n\nThe token we get this time is not a standard JWT; rather, it\
    \ contains the building blocks of a call to the GetCallerIdentity API of the STS\
    \ service. Let’s decode a portion of the token we obtained earlier using a combination\
    \ of jq, cut, base64, and sed:\n\n```\nroot@Point1:~/# aws eks get-token --cluster-name\
    \ prod-euw1 \\\n| jq -r .status.token \\\n```"
  merge: -1
  img_proc: true
- pgno: 167
