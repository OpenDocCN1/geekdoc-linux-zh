  md: '![](img/961e81aef23040d0fbe348f58c055860_82_0.png)


    Figure 5-1: List of services used by MXR Ads


    One glance at this graph gives us a pretty clear image of the most interesting
    endpoints to target first. The majority of domains we retrieved are hosted on
    AWS and use a mixture of the following services: CloudFront, a distribution network;
    S3, Amazon’s storage service; and ELB, a load balancer. The rest use the Akamai
    distribution network.


    Notice how the dashboard URL of GP (top center) points to a domain belonging to
    MXR Ads (bottom left). We were right about their close relationship; it’s even
    reflected in their respective infrastructures.


    We have a few leads here. For example, the gretschpol-alb-1463804911.eu-west-1...
    subdomain refers to an AWS Application Load Balancer (AWS ALB), suggested by the
    alb part of the URL. According to AWS documentation, this is a layer 7 load balancer
    that’s responsible for distributing incoming traffic. In theory, a layer 7 load
    balancer is capable of parsing HTTP requests and even blocking some payloads when
    linked to the AWS Web Application Firewall (AWS WAF). Whether that is indeed the
    case is open for speculation and will require active probing, of course.


    > NOTE

    It’s not like AWS WAF is the glorious WAF that everyone has been waiting for.
    Every now and then, a tweet pops out with a simple bypass: http://bit.ly/303dPm0.


    The application load balancer can wait, however. We already picked up our list
    of winners the moment we laid eyes on the graph. We will start with the all-too-tempting
    AWS S3 URLs.


    # Investigating the S3 URLs


    AWS S3 is a highly redundant and cheap storage service offered by Amazon, starting
    at just $0.023 per GB, plus data transfer. Objects stored in S3 are organized
    into buckets. Each bucket has a unique name and URL across all AWS accounts (see
    Figure 5-2).'
