  md: 'With this information, the only thing preventing us from accessing these databases
    is basic, boring firewall rules. These endpoints resolve to internal IPs, unreachable
    from the dark corner of the internet where our attack server lies, so unless we
    figure out a way to change these firewall rules or bypass them altogether, we
    are stuck with a pile of worthless credentials.


    Well, that’s not entirely true. There is one set of credentials that we haven’t
    yet retrieved, and unlike the previous ones, it is not usually subject to IP restrictions:
    the machine’s IAM role.


    On most cloud providers, you can assign a role to a machine, which is a set of
    default credentials. This gives the machine the ability to seamlessly authenticate
    to the cloud provider and inherit whatever permissions are assigned to that role.
    Any application or script running on the machine can claim that role, and this
    avoids the nasty habit of hardcoding secrets in the code. Seems perfect . . .
    again, on paper.


    In reality, when an EC2 machine (or, more accurately, an instance profile) impersonates
    an IAM role, it retrieves a set of temporary credentials that embody that role’s
    privileges. These credentials are made available to the machine through—you guessed
    it—the metadata API.


    We call the /latest/meta-data/iam/security-credentials endpoint to retrieve the
    role’s name:


    ```

    ```

    http://0xa9fea9fe/latest/meta-data/iam/security-credentials

    demo-role.ec2

    ```

    ```


    We can see that the machine was assigned the demo-role.ec2 role. Let’s pull its
    temporary credentials, again by calling the metadata API:


    ```

    ```

    # Credentials

    http://0xa9fea9fe/latest/meta-data/iam/security-credentials/demo-role.ec2


    {

    Code : Success,

    LastUpdated : 2020-10-26T11:33:39Z,

    Type : AWS-HMAC,

    AccessKeyId : ASIA4A2RK6WS4HX6YCC7,

    SecretAccessKey : nMy1mmbhHcOnXw2eZ3oh6nh/w2StPw8dI5Mah2b,

    Token : AgoJb3JpZ1luX2VjEFQ...

    Expiration : 2020-10-26T17:53:41Z ①

    }

