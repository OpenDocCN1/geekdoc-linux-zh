- pgno: 66
  md: '# Understanding Gretsch Politico


    In an effort to better understand this company, let’s dig up every PowerPoint
    deck and PDF presentation that bears a reference to “Gretsch Politico” (GP). SlideShare
    (https://www.slideshare.net/) proves to be an invaluable ally in this quest. Many
    people simply forget to delete their presentations after a talk, or default them
    to “public access,” giving us a plethora of information to begin our quest for
    understanding (see Figure 4-1).


    ![](img/961e81aef23040d0fbe348f58c055860_66_0.png)


    Figure 4-1: Some Gretsch Politico slides


    SlideShare is but one example of services hosting documents, so we next scour
    the web looking for resources uploaded to the most popular sharing platforms:
    Scribd, Google Drive, DocumentCloud, you name it. The following search terms will
    narrow down your results in most search engines:


    ```

    # Public Google Drive documents

    site:docs.google.com "Gretsch politico"


    # Documents on documentcloud.org

    site:documentcloud.org "Gretsch politico"


    # Documents uploaded to Scribd

