    | NODE | POD | PODIP | SERVICE | ENV | FILESECRET |

    |---|---|---|---|---|---|

    | ip-192... | api-... | 10.0.2... | api-token | dbCore... | api-token-... |

    | ip-192... | ssp-f... | 10.10... | default | dbCass... | default-... |

    | ip-192... | ssp-r... | 10.0.3... | default | <none> | default-... |

    | ip-192... | audit... | 10.20... | default | <none> | default-... |

    | ip-192... | nexus... | 10.20.... | default | <none> | deploy-secret... |


    *Listing 8-4: Full recon at the namespace level: node and pod names, pod IPs,
    service accounts, and secrets*


    I’ve truncated the output to fit on the page, so I’ll describe it here. The first
    two columns contain the names of the node and the pod, which help us deduce the
    nature of the application running inside. The third column is the pod’s IP, which
    gets us straight to the application, thanks to Kube’s flat network design.


    The fourth column lists the service account attached to each pod. Any value other
    than default means that the pod is likely running with additional privileges.


    The last two columns list the secrets loaded by the pod, either via environment
    variables or through a file mounted on disk. Secrets can be database passwords,
    service account tokens like the one we used to perform this command, and so on.


    What a great time to be a hacker! Remember when reconnaissance entailed scanning
    the /16 network and waiting four hours to get a partially similar output? Now
    it’s barely one command away. Of course, had the default service account lacked
    the “get pods” privilege, we would have had to resort to a blind network scan
    of our container’s IP range. AWS is very keen on this kind of unusual network
    traffic, so be careful when tuning your Nmap to stay under the radar.'
