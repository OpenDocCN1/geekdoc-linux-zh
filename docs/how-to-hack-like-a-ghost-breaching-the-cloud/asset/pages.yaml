  md: '# About the Author


    Sparc Flow is a computer security expert specializing in ethical hacking. He has
    presented his research at international security conferences like Black Hat, DEF
    CON, Hack In The Box, and more. While his day job mainly consists of hacking companies
    and showing them how to fix their security vulnerabilities, his passion remains
    writing and sharing security tools and techniques. His other titles include:


    +   - How to Hack Like a Pornstar

    - How to Hack Like a GOD

    - How to Investigate Like a Rockstar

    - How to Hack Like a Legend


    # About the Tech Reviewer


    Matt Burrough is a senior penetration tester on a corporate red team, where he
    assesses the security of cloud computing services and internal systems. He is
    also the author of Pentesting Azure Applications (No Starch Press, 2018). Matt
    holds a bachelor’s degree in networking, security, and system administration from
    Rochester Institute of Technology and a master’s degree in computer science from
    the University of Illinois at Urbana–Champaign.'
