- pgno: 138
  md: "```\ncertificate-authority: /root/.minikube/ca.crt\nserver: https://192.168.99.100:8443\n\
    name: minikube\n--snip--\nusers:\n- name: sparc\n  user:\n    client-certificate:\
    \ /root/.minikube/client.crt\n    client-key: /root/.minikube/client.key\n--snip--\n\
    ```\n\nOur API server URL in this case is https://192.168.99.100. Think of it\
    \ this way: the API server is the only pod allowed to read/write the desired state\
    \ in the database. Want to list pods? Ask the API server. Want to report a pod\
    \ failure? Tell the API server. It is the main orchestrator that conducts the\
    \ complex symphony that is Kubernetes.\n\nWhen we submitted our deployment file\
    \ to the API server through kubectl (HTTP), it made a series of checks (authentication\
    \ and authorization, which we will cover in Chapter 8) and then wrote that deployment\
    \ object in the etcd database, which is a key-value database that maintains a\
    \ consistent and coherent state across multiple nodes (or pods) using the Raft\
    \ consensus algorithm. In the case of Kube, etcd describes the desired state of\
    \ the cluster, such as how many pods there are, their manifest files, service\
    \ descriptions, node descriptions, and so on.\n\nOnce the API server writes the\
    \ deployment object to etcd, the desired state has officially been altered. It\
    \ notifies the callback handler that subscribed to this particular event: the\
    \ deployment controller, another component running on the master node.\n\nAll\
    \ Kube interactions are based on this type of event-driven behavior, which is\
    \ a reflection of etcd’s watch feature. The API server receives a notification\
    \ or an action. It reads or modifies the desired state in etcd, which triggers\
    \ an event delivered to the corresponding handler.\n\nThe deployment controller\
    \ asks the API server to send back the new desired state, notices that a deployment\
    \ has been initialized, but does not find any reference to the group of pods it\
    \ is supposed to manage. It resolves this discrepancy by creating a ReplicaSet,\
    \ an object describing the replication strategy of a group of pods.\n\nThis operation\
    \ goes through the API server again, which updates the state once more. This time,\
    \ however, the event is sent to the ReplicaSet controller, which in turn notices\
    \ a mismatch between the desired state (a group of two pods) and reality (no pods).\
    \ It proceeds to create the definition of the containers.\n\nThis process (you\
    \ guessed it) goes through the API server again, which, after modifying the state,\
    \ triggers a callback for pod creation, which is monitored by the kube-scheduler\
    \ (a dedicated pod running on the master node).\n\nThe scheduler sees two pods\
    \ in the database in a pending state. Unacceptable. It runs its scheduling algorithm\
    \ to find suitable nodes to host these two pods, updates the pods’ descriptions\
    \ with the corresponding nodes, and submits the lot to the API server to be stored\
    \ in the database."
  merge: -1
  img_proc: true
- pgno: 139
  md: 'The final piece of this bureaucratic madness is the kubelet: a process (not
    a pod!) running on each worker node that routinely pulls the list of pods it ought
    to be running from the API server. The kubelet finds out that its host should
    be running two additional containers, so it proceeds to launch them through the
    container runtime (usually Docker). Our pods are finally alive. Complex? Told
    you so. But one cannot deny the beauty of this synchronization scheme. Though
    we covered only one workflow out of many possible interactions, rest assured that
    you should be able to follow along with almost every article you read about Kube.
    We are even ready to take this to the next step—because, lest you forget, we still
    have a real cluster waiting for us at MXR Ads.


