  md: 'Perfect. We have a working SILENTTRINITY Docker image. To be able to download
    it from any workstation, we need to push it to a Docker repository. To do so,
    we create an account on https://hub.docker.com as well as our first public repository,
    called silent. Following Docker Hub’s convention, we rename the Docker image to
    username/repo-name using docker tag and then push it to the remote registry, like
    so:


    ```

    root@Lab:~# docker login

    Username: sparcflow

    Password:


    Login Succeeded


    root@Lab:~# docker tag silent sparcflow/silent

    root@Lab:~# docker push sparcflow/silent

    ```


    Now our SILENTTRINITY Docker image is one docker pull away from running on any
    Linux machine we spawn in the future.


    # Cgroups


    The last vital component of containers is control groups (cgroups), which add
    some constraints that namespaces cannot address, like CPU limits, memory, network
    priority, and the devices available to the container. Just as their name implies,
    cgroups offer a way of grouping and bounding processes by the same limitation
    on a given resource; for example, processes that are part of the /system.slice/accounts-daemon.service
    cgroup can only use 30 percent of the CPU and 20 percent of the total bandwidth,
    and cannot query the external hard drive.


    Here is the output of the command systemd-cgtop, which tracks cgroup usage across
    the system:


    ```

    root@Lab:~# systemd-cgtop

    Control Group          Tasks  %CPU  Memory  Input/s

    /                      188    1.1   1.9G    -

    /docker                2      -     2.2M    -

    /docker/08d210aa5c63a81a761130fa6ec76f9  1  -  660.0K  -

    /docker/24ef18884215a4f0b892506bfff5d6fa 1  -  472.0K  -

    ```


    We will circle back to cgroups later on when we talk about the privileged mode
    in Docker, so let’s leave it at that for now.


    To recap then: whichever cloud provider we choose and whatever Linux distribution
    they host, as long as there is Docker support, we can spawn our fully configured
    C2 backends using a couple of command lines. The following will run our Metasploit
    container:


    ```

    root@Lab:~# docker run -dit \

    -p 9990-9999:9990-9999 \

    -v $HOME/.msf4:/root/.msf4 \

    -v /tmp/msf:/tmp/data phocean/msf

    ```'
