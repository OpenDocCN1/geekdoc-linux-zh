- pgno: 134
  md: "![](img/961e81aef23040d0fbe348f58c055860_134_0.png)\n\nFigure 7-5: A cluster\
    \ service object\n\nA service’s manifest file is composed of metadata adding tags\
    \ to this service and its routing rules, which state which pods to target and\
    \ port to listen on (see Listing 7-3).\n\n```\n# myservice.yaml file\n# Minimal\
    \ description to start a service\napiVersion: v1\nkind: Service # We are creating\
    \ a service\nmetadata:\n    name: myapp\n    labels:\n        app: myapp  # The\
    \ service's tag\nspec:\n    selector:\n        app: myapp # Target pods with the\
    \ selector \"app:myapp\"\n    ports:\n    - protocol: TCP\n      port: 80 # Service\
    \ listens on port 80\n      targetPort: 8080 # Forward traffic from port 80 to\
    \ port 8080 on the pod\n```\n\nListing 7-3: The service manifest file\n\nWe then\
    \ submit this manifest file to create the service, and our service gets assigned\
    \ a cluster IP that is reachable only from within the cluster:\n\n```\nroot@DemLab:/#\
    \ kubectl apply -f service_myapp.yaml\nservice/myapp created\n\nroot@DemLab:/#\
    \ kubectl get svc myapp\nNAME    TYPE       CLUSTER-IP      EXTERNAL-IP   PORT(S)\n\
    myapp   ClusterIP  10.100.166.225  <none>        80/TCP\n```\n\nA pod on another\
    \ machine that wants to communicate with our Nginx server will send its request\
    \ to that cluster IP on port 80, which will then forward the traffic to port 8080\
    \ on one of the two containers.\n\nLet’s quickly spring up a temporary container\
    \ using the Docker public image curlimages/curl to test this setup and ping the\
    \ cluster IP:\n\n```\nroot@DemLab:/# kubectl run -it --rm --image curlimages/curl\
    \ mycurl -- sh\n\n/$ curl 10.100.166.225\n<h1>Listening on port 8080</h1>\n```"
