- pgno: 254
  md: "![](img/961e81aef23040d0fbe348f58c055860_254_0.png)\n\nFigure 13-2: Google\
    \ Workspace admin panel to update API scopes\n\nContrary to the usual intuitive\
    \ panels that Google is famous for, this admin panel is particularly dreadful.\
    \ You cannot just append scopes, because they will overwrite old ones. You need\
    \ to enter all the scopes assigned to a service account (old and new ones).\n\n\
    We create a new gmail.py Python script with the same boilerplate code previously\
    \ used to create a user, except for a few alterations:\n\n```\nUSER_EMAIL = 'alexandra.styx@gretschpolitico.com'\n\
    service = discovery.build('gmail', 'v1', credentials=delegated_credentials)\n\
    results = service.users().messages().list(\n    userId=USER_EMAIL,\n    labelIds\
    \ = ['INBOX']).execute()\n\nmessages = results.get('messages', [])\n```\n\nWe\
    \ update the scope to include Gmail ① and then call the users() .messages() API\
    \ ② to retrieve the CEO's emails, whose name we gleefully take from LinkedIn.\n\
    \nThen it's just a matter of looping through the messages, extracting the subject,\
    \ sender, receiver, and email body. Check out the full code at https://github.com/HackLikeAPornstar/GreschPolitico.\
    \ We run the full Python script and rifle through the emails at our leisure:\n\
    \n```\nroot@Point1:~/# python gmail.py\nalexandra.styx@gretschpolitico.com;\n\
    valery.attenbourrough@gretschpolitico.com;\nSun, 15 Dec 2020;\nSecured the party's\
    \ contract - $2M!\n\nWe just closed the contract today! We can start targeting\
    \ PA undecided voters tomorrow!\n\n---\n\nalexandra.styx@gretschpolitico.com;\n\
    adam.sparrow@gretschpolitico.com;\nSun, 12 Dec 2020;\nWe need to go after his\
    \ public image\n\nCan't we make up a story? Send some girls, champagne and kickstart\
    \ it that way? We have the creatives ready, we need to get moving!!!\n```"
