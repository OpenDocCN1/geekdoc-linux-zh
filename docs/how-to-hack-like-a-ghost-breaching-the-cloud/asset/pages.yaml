- pgno: 84
  md: "Contrary to what this message may suggest, we are not technically forbidden\
    \ from accessing objects in the bucket. We are simply not allowed to list the\
    \ bucket's content, very much like how the Options -Indexes in an Apache server\
    \ disables directory listing.\n\n> NOTE\n*Sometimes the bucket is deleted but\
    \ the CNAME remains defined. When that's the case, we can attempt a subdomain\
    \ takeover by creating a bucket with the same name in our own AWS account. It's\
    \ an interesting technique that can prove fatal in some situations. There is a\
    \ nice article by Patrik Hudak about this at https://0xpatrik.com/takeover-proofs/.*\n\
    \n# S3 Bucket Security\n\nFollowing one too many scandals involving insecure S3\
    \ buckets, AWS has tightened up its default access controls. Each bucket now has\
    \ a sort of public switch that the user can easily activate to disallow any type\
    \ of public access. It might seem like a basic feature to have, except that a\
    \ bucket's access list is governed by not one, not two, not three, but four overlapping\
    \ settings beneath the public switch! How very convoluted. One can almost forgive\
    \ companies for messing up their configuration. These settings are as follows:\n\
    \n+   - **Access control lists (ACLs)** Explicit rules stating which AWS accounts\
    \ can access which resources (deprecated).\n- **Cross-Origin Resource Sharing\
    \ (CORS)** Rules and constraints placed on HTTP requests originating from other\
    \ domains, which can filter based on the request's user agent string, HTTP method,\
    \ IP address, resource name, and so on.\n- **Bucket policy** A JavaScript Object\
    \ Notation (JSON) document with rules stating which actions are allowed, by whom,\
    \ and under which conditions. The bucket policy replaces ACLs as the nominal way\
    \ of protecting a bucket.\n- **Identity and Access Management (IAM) policies**\
    \ Similar to bucket policies, but these JSON documents are attached to users/groups/roles\
    \ instead of buckets.\n\nHere's an example of a bucket policy that allows anyone\
    \ to get an object from the bucket but disallows any other operation on the bucket,\
    \ such as listing its contents, writing files, changing its policy, and so on:\n\
    \n```\n{\n  \"Version\":\"2012-10-17\",\n  \"Statement\":[\n    {\n      \"Sid\"\
    :\"UniqueID\", // ID of the policy\n      \"Effect\":\"Allow\", // Grant access\
    \ if conditions are met\n      \"Principal\": \"*\", // Applies to anyone (anonymous\
    \ or not)\n      \"Action\":[\"s3:GetObject\"], // S3 operation to view a file\n\
    ```"
