  md: "Secrets and passwords are a crucial element of any server’s configuration—especially\
    \ one that, by the very nature of its design, talks to almost every component\
    \ of the infrastructure. I am talking about Jenkins, of course!\n\nIf you follow\
    \ good DevOps practices to the letter, everything should be automated, reproducible,\
    \ and, more importantly, versioned. You can’t just install Jenkins or any other\
    \ tool by hand. You must use a management tool, like Chef or Ansible, to describe\
    \ your Jenkins configuration and deploy it on a brand-new machine. Any change\
    \ to this configuration, like upgrading a plug-in or adding a user, should go\
    \ through this management tool, which tracks, versions, and tests the changes\
    \ before applying them to production. That’s the essence of infrastructure as\
    \ code. What’s a developer’s favorite versioning system for storing code? GitHub,\
    \ of course!\n\nWe can quickly verify that Chef recipes are stored on GitHub for\
    \ this task by listing all of MXR Ads’ private repos and looking for any mention\
