- pgno: 103
  md: 'public distribution point. We find a couple of bash scripts that automate the
    docker login command or provide helper functions for AWS commands, but nothing
    stands out as sensitive.


    From this, we deduce that this bucket probably acts as a corporate-wide package
    distribution center. Systems and applications must use it to download software
    updates, packages, archives, and other widespread packages. I guess not every
    public S3 is an El Dorado waiting to be pilfered.


    We turn to the user-data script we pulled earlier hoping for additional clues
    about services to query, but find nothing out of note. We even try a couple of
    AWS APIs with the demo role credentials to common services like EC2, Lambda, and
    Redshift out of desperation, only to get that delicious error message back. How
    frustrating it is to have valid keys yet stay stranded at the front door simply
    because there are a thousand keyholes to try . . . but that’s just the way it
    is sometimes.


    As with most dead ends, the only way forward is to go backward, at least for a
    while. It’s not like the data we gathered so far is useless; we have database
    and AWS credentials that may prove useful in the future, and most of all, we gained
    some insight into how the company handles its infrastructure. We only need a tiny
    spark to ignite for the whole ranch to catch fire. We still have close to a hundred
    domains to check. We will get there.


