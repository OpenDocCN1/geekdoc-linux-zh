- pgno: 31
  md: '# 2


    # RETURN OF COMMAND AND CONTROL


    ![](img/961e81aef23040d0fbe348f58c055860_31_0.png)


    Let’s build an attacking infrastructure by starting with the basic tooling of
    any attacker: the Command and Control (C2) server. We’ll look at three frameworks
    and test each on a virtual machine we’ll use as the target. First, we’ll look
    at how command and control used to be done, to see how we got where we are today.


    # Command and Control Legacy


    For the better part of the last decade, the undefeated champion of C2 frameworks—the
    one that offered the widest and most diverse array of exploits, stagers, and reverse
    shells—was the infamous Metasploit framework (https://www.metasploit.com/). Perform
    a quick search for a pentesting or hacking tutorial, and I bet the first link
    will refer you to a post describing how to set up a meterpreter—the name of the
    custom payload used by'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'Metasploit—on a Linux machine to achieve full control. Of course, the article
    will fail to mention that the default settings of the tool have been flagged by
    every security product since 2007, but let''s not be too cynical.


    Metasploit is by far my first choice when taking control of a Linux box with no
    pesky antivirus software to crash the party. The connection is very stable, the
    framework has a lot of modules, and contrary to what many improvised tutorials
    seem to suggest, you can—and, in fact, should—customize every tiny bit of the
    executable template used to build the stager and the exploits. Metasploit works
    less well for Windows: it lacks a lot of post-exploit modules that are readily
    available in other frameworks, and the techniques employed by the meterpreter
    are first on the checklist of every antivirus software out there.


    Windows being a different beast, I used to prefer the Empire framework (https://github.com/EmpireProject/Empire/),
    which provides an exhaustive list of modules, exploits, and lateral movement techniques
    specifically designed for Active Directory. Sadly, Empire is no longer maintained
    by the original team, known by their Twitter handles: @harmj0y, @sixdub, @enigma0x3,
    @rvrsh3ll, @killswitch_gui, and @xorrior. They kickstarted a real revolution in
    the Windows hacking community and deserve our most sincere appreciation. Luckily,
    to the thrill of us all, Empire was brought back to life by the BC Security folks,
    who released version 3.0 in December 2019. I understand the reasoning behind the
    decision to cease maintaining Empire: the whole framework came into existence
    based on the premise that PowerShell allowed attackers to sail unhindered in a
    Windows environment, free from sleazy preventions such as antivirus software and
    monitoring. With this assumption challenged by Windows 10 features like PowerShell
    block logging and AMSI, it made sense to discontinue the project in favor of a
    newer generation of attacks, like using C# (for instance, SharpSploit: https://github.com/cobbr/SharpSploit/).


    NOTE Antimalware Scan Interface (AMSI) is a component introduced in Windows 10
    that intercepts API calls to critical Windows services—User Account Control (UAC),
    JScript, PowerShell, and so on—to scan for known threats and eventually block
    them: https://docs.microsoft.com/en-us/windows/win32/amsi/how-amsi-helps.


    # The Search for a New C2


    With the Empire project less of an option, I started looking for potential replacements.
    I was afraid of having to fall back on Cobalt Strike, as have 99 percent of consulting
    firms masquerading phishing campaigns as red team jobs. I have nothing against
    the tool—it''s awesome, provides great modularity, and deserves the success it
    has achieved. It''s just tiring and frustrating to see so many phony companies
    riding the wave of the red team business just because they bought a $3,500 Cobalt
    Strike license.


    I was pleasantly surprised, however, to discover that so many open source C2 frameworks
    had hatched in the vacuum left by Empire. Here''s a brief look at some interesting
    ones that caught my attention. I will go rather quickly over many advanced concepts
    that are not that relevant to our present'
  merge: -1
