  md: "Before continuing with our Spark app, I'll give an example of using the map\
    \ API to loop over each element of the partitions, feed them to the function addTen,\
    \ and store the result in a new RDD (see Listing 12-5).\n\n```\ndef addTen(x):\n\
    \    return x+10\nplusTenList = partList.map(addOne)\n```\n\nListing 12-5: Using\
    \ the map API on Spark\n\nNow plusTenList contains (10, 11, . . ). How is this\
    \ different from a regular Python map or a classic loop? Say, for example, we\
    \ had two workers and two partitions. Spark would send elements 0 through 4 to\
    \ machine #1 and elements 5 through 9 to machine #2. Each machine would iterate\
    \ over the list, apply the function addTen, and return the partial result to the\
    \ driver (our Jenkins machine), which then consolidates it into the final output.\
    \ Should machine #2 fail during the calculation, Spark would automatically reschedule\
    \ the same workload on machine #1.\n\nAt this point, I am sure you're thinking,\
    \ “Great. Spark is awesome, but why the long lecture on maps and RDDs? Can’t we\
    \ just submit the Python code as is and execute code?”\n\nI wish it were that\
    \ simple.\n\nSee, if we just append a classic call to subprocess.Popen and execute\
    \ the script, we’ll just—well, you can see for yourself in Listing 12-6.\n\n```\n\
    from pyspark import SparkContext, SparkConf\nfrom subprocess import Popen\n\n\
    conf = SparkConf()\nconf = conf.setMaster(\"spark://10.50.12.67:7077\")\nconf\
    \ = conf.set(\"spark.driver.host\", \"10.33.57.66\")\n\nsc = SparkContext(conf\
    \ = conf)\npartList = sc.parallelize(range(0, 10))\nprint(Popen([\"hostname\"\
    ], stdout=subprocess.PIPE).stdout.read())\n\n$ python test_app.py\n891451c36e6b\n\
    \n$ hostname\n891451c36e6b\n```\n\nListing 12-6: The Python code executes code\
    \ locally instead of sending it to the Spark cluster.\n\nWhen we run our test\
    \ app, we get returned the ID of our own container. The hostname command in the\
    \ Python code was executed on our system. It did not even reach the Spark master.\
    \ What happened?\n\nThe Spark driver, the process that gets initialized by PySpark\
    \ when executing the code, does not technically send the Python code to the master."
