    Watching these IP addresses roll by on the screen is mesmerizing. Each entry is
    a door waiting to be subtly engineered or forcefully raided to grant us access.
    This is why this reconnaissance phase is so important: it affords us the luxury
    of choice, with over 100 domains belonging to both organizations!


    NOTE

    *Check out Altdns, an interesting tool that leverages Markov chains to form predictable
