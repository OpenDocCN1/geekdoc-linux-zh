- pgno: 102
  md: "And we find it’s empty. No logging. Perfect. You may be wondering why a call\
    \ to this obscure API succeeded. Why would an instance profile need such a permission?\
    \ To understand this weird behavior, have a look at the full list of possible\
    \ S3 operations at https://docs.aws.amazon.com/. Yes, there are hundreds of operations\
    \ that can be allowed or denied on a bucket.\n\nAWS has done a spectacular job\
    \ defining very fine-grained permissions for each tiny and sometimes inconsequential\
    \ task. No wonder most admins simply assign wildcard permissions when setting\
    \ up buckets. A user needs read-only access to a bucket? A Get* will do the job;\
    \ little do they realize that a Get* implies 31 permissions on S3 alone! GetBucketPolicy\
    \ to get the policy, GetBucketCORS to return CORS restrictions, GetBucketACL to\
    \ get the access control list, and so forth.\n\nBucket policies are mostly used\
    \ to grant access to foreign AWS accounts or add another layer of protection against\
    \ overly permissive IAM policies granted to users. A user with an s3:* permission\
    \ could therefore be rejected with a bucket policy that only allows some users\
    \ or requires a specific source IP. Here we attempt to get the bucket policy for\
    \ mxrads-dl to see if it does grant access to any other AWS accounts:\n\n```\n\
    root@Point1:~# aws s3api get-bucket-policy --bucket mxrads-dl\n{\n  \"Id\": \"\
    Policy1572108106689\",\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n \
    \   {\n      \"Sid\": \"Stmt1572108105248\",\n      \"Action\": [\n        \"\
    s3:List*\", \" s3:Get*\"\n      ],\n      \"Effect\": \"Allow\",\n      \"Resource\"\
    : \"arn:aws:s3:::mxrads-dl\",\n      \"Principal\": { ① \"AWS\": \"arn:aws:iam::983457354409:root\"\
    \ }\n    }\n  ]\n}\n```\n\nThis policy references the foreign AWS account 983457354409\
    \ ①. This account could be Gretsch Politico, an internal MXR Ads department with\
    \ its own AWS account, or a developer’s personal account for that matter. We cannot\
    \ know for sure, at least not yet. We’ll note it for later examination.\n\n# Examining\
    \ the Key List\n\nWe go back to downloading the bucket’s entire key list and dive\
