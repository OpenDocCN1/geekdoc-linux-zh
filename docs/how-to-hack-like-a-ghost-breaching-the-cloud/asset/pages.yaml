    \ that are vulnerable to the same cache poisoning technique.\n\nThe formula for\
    \ this kind of hack is simple: locate these pods (with the get pods command),\
    \ connect to the Redis container, replace a few VAST URLs with the metadata API,\
    \ collect the machine’s temporary AWS keys spilled to the audit database, convert\
    \ them to a Kubernetes token, and retrieve the secrets loaded by the pods running\
    \ on the node.\n\nWe rinse and repeat, checking each node, and stop when we notice\
    \ something very interesting in the output:\n\n```\nshell> ./kubectl get pods\
    \ -o=\"custom-columns=\\\nNS:.metadata.namespace,\\\nPOD:.metadata.name,\\\nENV:.spec.containers[*].env[*].valueFrom.secretKeyRef,\\\
    \nFILESECRET:.spec.volumes[*].secret.secretName\" \\\n--all-namespaces \\\n--field-selector\
    \ spec.nodeName=ip-192-168-133-34.eu-west-1.compute.internal\n```\n\n| NS | POD\
    \ | ENV | FILESECRET |\n|---|---|---|---|\n| kube-system | tiller | <none> | tiller-token-3cea\
    \ |\n| prod | ads-rtb... | CassandraDB | default-token-99ed |"
