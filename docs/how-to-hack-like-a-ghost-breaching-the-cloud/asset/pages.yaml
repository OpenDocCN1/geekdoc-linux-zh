- pgno: 33
  md: 'scenario, and will demonstrate a payload execution with each. If you do not
    fully understand how some payloads work, don’t worry. We will circle back to the
    ones we need later on.


    # Merlin


    Merlin (https://github.com/Ne0nd0g/merlin/) is a C2 framework written, as it seems
    most popular tools are these days, in Golang. It can run on Linux, Windows, and
    basically any other platform supported by the Go runtime. The agent launched on
    the target machine can be a regular executable, like a DLL file or even a JavaScript
    file.


    To get started with Merlin, first install the Golang environment. This will allow
    you to customize the executable agent and add post-exploitation modules—which
    is, of course, heavily encouraged.


    Install Golang and Merlin with the following:


    ```

    ```bash

    root@Lab:~/# add-apt-repository ppa:longsleep/golang-backports

    root@Lab:~/# apt update && sudo apt install golang-go

    root@Lab:~/# go version

    go version go1.13 linux/amd64


    root@Lab:~/# git clone https://github.com/Ne0nd0g/merlin && cd merlin

    ```

    ```


    The real novelty of Merlin is that it relies on HTTP/2 to communicate with its
    backend server. HTTP/2, as opposed to HTTP/1.x, is a binary protocol that supports
    many performance-enhancing features, like stream multiplexing, server push, and
    so forth (a great free resource that discusses HTTP/2 in depth can be found at
    https://daniel.haxx.se/http2/http2-v1.12.pdf). Even if a security device does
    catch and decrypt the C2 traffic, it might fail to parse the compressed HTTP/2
    traffic and just forward it untouched.


    If we compile a standard agent out of the box, it will be immediately busted by
    any regular antivirus agent doing simple string lookups for general conspicuous
    terms, so we need to make some adjustments. We’ll rename suspicious functions
    like ExecuteShell and remove references to the original package name, github.com/Ne0nd0g/merlin.
    We’ll use a classic find command to hunt for source code files containing these
    strings and pipe them into xargs, which will call sed to replace these suspicious
    terms with arbitrary words:


    ```

    ```bash

    root@Lab:~/# find . -name ''*.go'' -type f -print0 | xargs -0 sed -i ''s/ExecuteShell/MiniMice/g''

    root@Lab:~/# find . -name ''*.go'' -type f -print0 | xargs -0 sed -i ''s/executeShell/miniMice/g''

    root@Lab:~/# find . -name ''*.go'' -type f -print0 | xargs -0 sed -i ''s/Ne0nd0g\/merlin\/mini\/heyho/g''

    root@Lab:~/# sed -i ''s/Ne0nd0g\/merlin\/mini\/heyho/g'' go.mod

    ```

    ```'
  merge: -1
