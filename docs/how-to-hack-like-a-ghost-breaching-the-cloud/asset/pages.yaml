- pgno: 136
  md: 'When I first started playing with Kubernetes, that cluster IP address we get
    when creating a service bothered me. A lot. Where did it come from? The nodes’
    subnet is 192.168.0.0/16. The containers are swimming in their own 10.0.0.0/16
    pool. Where the hell did that IP come from?


    We can list every interface of every node in our cluster without ever finding
    that IP address. Because it does not exist. Literally. It’s simply an iptables
    target rule. The rule is pushed to all nodes and instructs them to forward all
    requests targeting this nonexistent IP to one of the two pods we created. That’s
    it. That’s what a service object is—a bunch of iptables rules that are orchestrated
    by a component called kube-proxy.


    Kube-proxy is also a pod, but a very special one indeed. It runs on every node
    of the cluster, secretly orchestrating the network traffic. Despite its name,
    it does not actually forward packets, not in recent releases anyway. It silently
    creates and updates iptables rules on all nodes to make sure network packets reach
    their destinations.


    When a packet reaches (or tries to leave) a node, it automatically gets sent to
    the KUBE-SERVICES iptables chain, which we can explore using the iptables-save
    command:


    ```

    ```

    root@KubeNode:/# iptables-save

    -A PREROUTING -m comment --comment "kube" -j KUBE-SERVICES

    --snip--

    ```

    ```


    This chain tries to match the packet against multiple rules based on its destination
    IP and port (-d and --dport flags):


    ```

    ```

    --snip--

    -A KUBE-SERVICES -d 10.100.172.183/32 -p tcp -m tcp --dport 80 -j KUBE-SVC-NPJI

    ```

    ```


    There is our naughty cluster IP! Any packet sent to the 10.100.172.183 address
    is forwarded to the chain KUBE-SVC-NPJ, which is defined a few lines further down:


    ```

    ```

    --snip--

    -A KUBE-SVC-NPJI -m statistic --mode random --probability 0.50000000000 -j KUBE-SEP-GEGI

    -A KUBE-SVC-NPJI -m statistic --mode random --probability 0.50000000000 -j KUBE-SEP-VUBW

    ```

    ```


    Each rule in this chain randomly matches the packet 50 percent of the time and
    forwards it to a different chain that ultimately sends the packet to one of the
    two pods running. The resilience of the service object is nothing more than a
    reflection of iptables’ statistic module:


    ```

    ```

    --snip--

    -A KUBE-SEP-GEGI -p tcp -m tcp -j DNAT --to-destination 192.168.127.78:8080

    -A KUBE-SEP-VUBW -p tcp -m tcp -j DNAT --to-destination 192.168.155.71:8080

    ```

    ```


    A packet sent to the node port will follow the same processing chain, except that
    it will fail to match any cluster IP rule, so it automatically gets'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'forwarded to the KUBE-NODEPORTS chain. If the destination port matches a predeclar
    ed node port, the packet is forwarded to the load-balancing chain (KUBE-SVC-NPJI)
    we saw that distributes it randomly among the pods:


    ```

    --snip--

    -A KUBE-SERVICES -m comment --comment "last rule in this chain" -m addrtype --dst-type
    LOCAL -j KUBE-NODEPORTS


    -A KUBE-NODEPORTS -p tcp -m tcp --dport 31357 -j KUBE-SVC-NPJI

    ```


    That''s all there is to it: a clever chain of iptables rules and network routes.


    In Kubernetes, every little task is performed by a dedicated component. Kube-proxy
    is in charge of the networking configuration. It is special in that it runs as
    a pod on every node, while the rest of the core components run inside multiple
    pods on a select group of nodes called master nodes.


    Out of the 100 nodes we made when we created the cluster of 100 machines, the
    one master node will host a collection of pods that make up the spinal cord of
    Kubernetes: the API server, kube-scheduler, and controller manager (see Figure
    7-6).


    ![](img/961e81aef23040d0fbe348f58c055860_137_0.png)


    Figure 7-6: Pods running on the master node versus those running on regular nodes


    NOTE In a multimaster setup, we will have three or more replicas of each of these
    pods, but only one active pod per service at any given time.


    We actually already interacted with the master node when using kubectl apply commands
    to send manifest files. Kubectl is a wrapper that sends HTTP requests to the all-important
    API server pod, the main entry point to retrieve and persist the famous desired
    state of the cluster. Here is a typical configuration one may use to reach the
    Kube cluster (~/kube/config):


    ```

    apiVersion: v1

    kind: Config

    clusters:

    - cluster:

    ```'
