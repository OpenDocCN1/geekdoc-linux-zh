- pgno: 210
  md: 'And the cherry on top: Terraform. We know that MXR Ads relies on Terraform
    to maintain its infrastructure. If we were to manually change the wrong resource,
    it would stand out like a sore thumb on the next terraform plan command. An email
    bearing the subject “You’ve Been Hacked” might have a better chance of going unnoticed.


    These are some of the main pitfalls to keep in mind when interacting with an AWS
    account. They truly are landmines that can blow up at the slightest misstep. It
    almost makes you miss the old days of backdooring a Windows Active Directory,
    when aggregating and parsing event logs from a single machine was a two-day job.


    Now, if you’re in a situation where your target has very poor security and you
    feel you can get away with manually creating a couple of access keys, adding a
    few believable IAM users, and giving them admin privileges, please be my guest.
    In that case there is no need to overengineer the backdoor strategy, especially
    knowing that Jenkins’s access keys are pretty stable.


    If, however, the company looks overly paranoid—tight access controls, strict and
    limited privileges, a clean list of active users, and properly configured CloudTrail,
    CloudWatch, and other monitoring tools—you may need a more robust and stealthier
    backup strategy.


    For the sake of argument, let’s give MXR Ads the benefit of the doubt and assume
    the worst. How can we maintain persistent access while flying under the radar?


    # Persisting in the Utmost Secrecy


    Our backdoor strategy will follow the hippest design architectures and be fully
    serverless and event-driven. We’ll configure a watchdog to fire upon specific
    events and trigger a job that will re-establish our access when those events are
    detected.


    Translated into AWS jargon, the watchdog would consist of a Lambda function triggered
    by an event of our choosing. We can opt for a CloudWatch event that fires every
    day at 10 AM, for instance, or a load balancer that receives a predefined request.
    We choose to go with an event fired when an S3 bucket receives new objects. Both
    MXR Ads and GP use this same trigger, so we have a higher chance of blending in.
    Once executed, the Lambda will dump its attached role credentials and send them
    to our own S3 bucket. The credentials we receive will be valid for one hour but
    will hold enough privileges to permanently restore durable access.


    > NOTE

    *A sexier approach would be to tie our Lambda to a CloudWatch event that gets
    triggered whenever the Jenkins access key gets rotated. Unfortunately, one can
    only set one target Lambda per log group, and it’s immediately visible in the
    CloudWatch dashboard. The advantage of hooking into S3 is that the information
    is buried inside of S3’s dashboard.*


    Let’s review our detection checklist: the Lambda function will be triggered by
    some frequently occurring internal event (in this case, when an'
