- pgno: 85
  md: "```\n\"Resource\":[\"arn:aws:s3:::bucketname/*\"] // All files in the bucket\n\
    }\n]\n}\n```\n\nAWS combines rules from these four settings to decide whether\
    \ or not to accept an incoming operation. Presiding over these four settings is\
    \ the master switch, called Block public access, which when turned on disables\
    \ all public access, even if it’s explicitly authorized by one of the four underlying\
    \ settings.\n\nComplicated? That’s putting it mildly. I encourage you to set up\
    \ an AWS account and explore the intricacies of S3 buckets to develop the right\
    \ reflexes in recognizing and abusing overly permissive S3 settings.\n\n> NOTE\n\
    There is also the rather illusive notion of object ownership, which trumps all\
    \ other settings except for the public switch. We will deal with it later on.\n\
    \n# Examining the Buckets\n\nBack to our list of buckets. We skim through them\
    \ and are again denied entry for all except misc.mxrads.com, which, strangely\
    \ enough, returns an empty page. The absence of error is certainly encouraging.\
    \ Let’s probe further using the AWS command line. First, we install the AWS command\
    \ line interface (CLI):\n\n```\nroot@Point1:~/# sudo apt install awscli\nroot@Point1:~/#\
    \ aws configure\n# Enter any valid set of credentials to unlock the CLI.\n# You\
    \ can use your own AWS account, for instance.\n```\n\nThe AWS CLI does not accept\
    \ S3 URLs, so we need to figure out the real bucket name behind misc.mxrads.com.\
    \ Most of the time, this is as simple as inspecting the domain’s CNAME record,\
    \ which in this case yields mxrads-misc.s3-website.eu-west-1.amazonaws.com. This\
    \ tells us that the bucket’s name is mxrads-misc. If inspecting the CNAME doesn’t\
    \ work, we need more elaborate tricks, such as injecting special characters like\
    \ %c0 in the URL, or appending invalid parameters, in an attempt to get S3 to\
    \ display an error page containing the bucket name.\n\nArmed with this bucket\
    \ name, we can leverage the full power of the AWS CLI. Let’s start by retrieving\
    \ a full list of objects present in the bucket and saving it to a text file:\n\
    \n```\nroot@Point1:~/# aws s3api list-objects-v2 --bucket mxrads-misc > list_objects.txt\n\
    root@Point1:~/# head list_objects.txt\n{ \"Contents\": [{\n  \"Key\": \"Archive/\"\
    ,\n  \"LastModified\": \"2015-04-08T22:01:48.000Z\",\n  \"Size\": 0,\n```"
