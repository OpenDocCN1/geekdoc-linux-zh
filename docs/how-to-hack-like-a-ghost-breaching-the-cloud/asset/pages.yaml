    No errors. Consider it an invitation to cross the border, folks! These helper
    scripts are probably fetched and executed by a GP resource. If we alter them,
    we can hijack the execution flow and call our custom stager, granting us a new
    shell on a GP component!


    We download helpers/ecr-login.sh, append a command to execute our custom meterpreter
    stager, and resubmit the file. As usual, the stager will be hosted in yet another
