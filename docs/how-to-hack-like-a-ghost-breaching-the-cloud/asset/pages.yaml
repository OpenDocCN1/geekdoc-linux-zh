  md: 'format, browsers and web clients are in fact happy with more esoteric representations,
    like hexadecimal or octal. For instance, all the following IP addresses are equivalent:


    ```

    http://169.254.169.254

    http://0xa9fea9fe # hexadecimal representation

    http://0xA9.0xFE.0xA9.0xFE # dotted hexadecimal

    http://025177524776 # octal representation

    http://①⑥⑨.②⑤④.①⑥⑨.②⑤④ # Unicode representation

    ```


    We can try to get around the IP address ban by trying out its hex, dotted hex,
    and octal alternatives.


    # ASSIGNING PRIVATE IP ADDRESSES TO PUBLIC DOMAINS


    One alternative technique is to register a custom domain name that resolves to
    169.254.169.254 and then use that domain name to try to bypass the hard-coded
    check. After all, nothing forbids us from assigning a private IP address to a
    public domain. The IP address will be dropped by the first public router, but
    since the request does not leave the physical network card, the trick works like
    a charm.


    In this case, simple hexadecimal formatting does the job, and we get the famous
    output of AWS''s metadata API, as shown in Figure 5-9.


