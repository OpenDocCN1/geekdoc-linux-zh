- pgno: 255
  md: 'Gretsch Politico in all its glory, ladies and gentlemen! Time to dig out the
    dirt.


    # Closing Thoughts


    Wow, we made it to the end. That was an intense journey filled with many esoteric
    technologies and new paradigms. The generalization of cloud computing may be one
    of the most disrupting events of the last decade. And while many tech companies
    and startups are already fully embracing the cloud, I feel that the security community
    is still lagging behind.


    Every post I read about lateral movement, C2 communication, and so forth exclusively
    covers Active Directory—as if it’s the only possible configuration and as if the
    most valuable data is necessarily stored on a Windows share or SQL server. That
    certainly is not true for banks and airlines (mainframes, anyone?). In fact, as
    we saw just in this scenario, more and more tech companies are moving away from
    Windows environments.


    Maybe it’s a bias introduced by consulting companies only working with old firms
    that are still neck-deep in Active Directory. Maybe it’s the number of Windows
    CVEs (Common Vulnerabilities and Exposures) that flood the market. Probably a
    little bit of both.


    In any case, I hope that the numerous examples in this book helped drive at least
    one message home: security is about thoroughly understanding a piece of technology,
    asking questions, and deconstructing the whole thing until it makes sense. The
    deeper you dig, the easier it is to toy with it afterward.


    We wrote significant custom code to sneak past detection services or to simply
    circumvent tedious network restrictions. Download the codebase, play with it,
    try it out on a free tier AWS account, and extend it to new horizons. That’s the
    only proven road to success.


    Happy hacking!


    # Resources


    +   - Matthew Toussain’s interesting article about Google Workspace (formerly
    G Suite) hacking at https://www.blackhillsinfosec.com/.

    - Google’s guide to using OAuth2 to access its APIs: http://bit.ly/2RAzYEx.

    - The Google Workspace User Accounts guide: https://developers.google.com/admin-sdk/directory/v1/guides/manage-users/.

    - Instructions for performing Google Workspace domain-wide delegation: https://developers.google.com/admin-sdk/directory/v1/guides/delegation/.

    - More on Google service accounts: https://cloud.google.com/compute/docs/access/service-accounts/.

    - More on AWS organizations and delegated admin members: https://amzn.to/3766cAL.'
