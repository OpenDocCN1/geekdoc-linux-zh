- pgno: 43
  md: 'We can then quickly set up Secure Shell (SSL) certificates using Let’s Encrypt
    via EFF’s Certbot and have a fully functional web server with HTTPS redirection:


    ```

    root@Lab:~/# add-apt-repository ppa:certbot/certbot

    root@Lab:~/# apt update && apt install python-certbot-nginx

    root@Lab:~/# certbot --nginx -d mydomain.com -d www.mydomain.com


    Congratulations! Your certificate and chain have been saved at...

    ```


    This method is completely fine, except that tuning an Nginx or Apache server can
    quickly get boring and cumbersome, especially since this machine will be facing
    the target, thus dramatically increasing its volatility. The server is always
    one IP ban away from being restarted or even terminated.


    > NOTE

    *Some cloud providers, like Amazon Web Services (AWS), automatically renew the
    public IP of a host upon restart. Other cloud providers, like DigitalOcean, however,
    attach a fixed IP to a machine.*


    Configuring the C2 backends is no fun either. No hosting provider will give you
    a shiny Kali distro with all the dependencies pre-installed. That’s on you, and
    you’d better get that Ruby version of Metasploit just right; otherwise, it will
    spill out errors that will make you question your own sanity. The same can be
    said for almost any application that relies on specific advanced features of a
    given environment.


    # Containers and Virtualization


    The solution is to package all your applications with all their dependencies properly
    installed and tuned to the right version. When you spin up a new machine, you
    need not install anything. You just download the entire bundle and run it as an
    ensemble. That’s basically the essence of the container technology that took the
    industry by storm and changed the way software is managed and run. Since we’ll
    be dealing with some containers later on, let’s take the time to deconstruct their
    internals while preparing our own little environment.


    > NOTE

    *Another solution would be to automate the deployment of these components using
    a tool like Ansible or Chef.*


    There are many players in the container world, each working at different abstraction
    levels or providing different isolation features, including containerd, runC,
    LXC, rkt, OpenVZ, and Kata Containers. I’ll be using the flagship product Docker
    because we’ll run into it later in the book.


    In an effort to oversimplify the concept of containerization, most experts liken
    it to virtualization: “Containers are lightweight virtual machines, except that
    they share the kernel of their host” is a sentence usually found under the familiar
    image in Figure 3-2.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '![](img/961e81aef23040d0fbe348f58c055860_44_0.png)


    Figure 3-2: An oversimplified depiction of containers


    This statement may suffice for most programmers who are just looking to deploy
    an app as quickly as possible, but hackers need more, crave more detail. It''s
    our duty to know enough about a technology to bend its rules. Comparing virtualization
    to containerization is like comparing an airplane to a bus. Sure, we can all agree
    that their purpose is to transport people, but the logistics are not the same.
    Hell, even the physics involved are different.


    *Virtualization* spawns a fully functioning operating system on top of an existing
    one. It proceeds with its own boot sequence and loads the filesystem, scheduler,
    kernel structures, the whole nine yards. The guest system believes it is running
    on real hardware, but secretly, behind every system call, the virtualization service
    (say, VirtualBox) translates all low-level operations, like reading a file or
    firing an interrupt, into the host''s own language, and vice versa. That''s how
    you can have a Linux guest running on a Windows machine.


    *Containerization* is a different paradigm, where system resources are compartmentalized
    and protected by a clever combination of three powerful features of the Linux
    kernel: namespaces, a union filesystem, and cgroups.


    # Namespaces


    *Namespaces* are tags that can be assigned to Linux resources like processes,
    networks, users, mounted filesystems, and so on. By default, all resources in
    a given system share the same default namespace, so any regular Linux user can
    list all processes, see the entire filesystem, list all users, and so on.


    However, when we spin up a container, all these new resources created by the container
    environment—processes, network interfaces, filesystem, and so on—get assigned
    a different tag. They become *contained* in their own namespace and ignore the
    existence of resources outside that namespace.'
  merge: -1
  img_proc: true
- pgno: 45
  md: "A perfect illustration of this concept is the way Linux organizes its processes.\
    \ Upon booting up, Linux starts the systemd process, which gets assigned process\
    \ ID (PID) number 1. This process then launches subsequent services and daemons,\
    \ like NetworkManager, crond, and sshd, that get assigned increasing PID numbers,\
    \ as shown here:\n\n```\nroot@Lab:~/# pstree -p\nsystemd(1)——accounts-daemon(777)——{gdbus}(841)\n\
    \                         ——{gmain}(826)\n          ——acpid(800)\n          ——agetty(1121)\n\
    ```\n\nAll processes are linked to the same tree structure headed by systemd,\
    \ and all processes belong to the same namespace. They can therefore see and interact\
    \ with each other—provided they have permission to do so, of course.\n\nWhen Docker\
    \ (or more accurately runC, the low-level component in charge of spinning up containers)\
    \ spawns a new container, it first executes itself in the default namespace (with\
    \ PID 5 in Figure 3-3) and then spins up child processes in a new namespace. The\
    \ first child process gets a local PID 1 in this new namespace, along with a different\
    \ PID in the default namespace (say, 6, as in Figure 3-3).\n\n![](img/961e81aef23040d0fbe348f58c055860_45_0.png)\n\
    \nFigure 3-3: Linux process tree with two processes contained in a new namespace\n\
    \nProcesses in the new namespace are not aware of what is happening outside their\
    \ environment, yet older processes in the default namespace maintain complete\
    \ visibility over the whole process tree. That's why the main challenge when hacking\
    \ a containerized environment is breaking this namespace isolation. If we can\
    \ somehow run a process in the default namespace, we can effectively snoop on\
    \ all containers on the host.\n\nEvery resource inside a container continues to\
    \ interact with the kernel without going through any kind of middleman. The containerized\
    \ processes are just restricted to resources bearing the same tag. With containers,\
    \ we are in a flat but compartmentalized system, whereas virtualization resembles\
    \ a set of nesting Russian dolls.\n\nNOTE If you want to learn more about container\
    \ namespaces, check out the detailed article on namespaces by Mahmud Ridwan at\
    \ https://www.toptal.com/."
  merge: -1
  img_proc: true
- pgno: 46
  md: "# A Metasploit Container\n\nLet’s dive into a practical example by launching\
    \ a Metasploit container. Luckily, a hacker named phocean has already created\
    \ a ready-to-use image we can do this exercise on, found at https://github.com/phocean/dockerfile-msf/.\
    \ We first have to install Docker, of course:\n\n```\n```bash\nroot@Lab:~/# curl\
    \ -fsSL https://download.docker.com/linux/ubuntu/gpg | apt-key add -\n\nroot@Lab:~/#\
    \ add-apt-repository \\\n\"deb [arch=amd64] https://download.docker.com/linux/ubuntu\
    \ \\\n$(lsb_release -cs) \\\nstable\"\n\nroot@Lab:~/# apt update\nroot@Lab:~/#\
    \ apt install -y docker-ce\n```\n```\n\nWe then download the Docker bundle or\
    \ image, which contains Metasploit files, binaries, and dependencies that are\
    \ already compiled and ready to go, with the docker pull command:\n\n```\n```bash\n\
    root@Lab:~/# docker pull phocean/msf\nroot@Lab:~/# docker run --rm -it phocean/msf\n\
    * Starting PostgreSQL 10 database server\n[ OK ]\nroot@46459ecdc0c4:/opt/metasploit-framework#\n\
    ```\n```\n\nThe docker run command spins up this container’s binaries in a new\
    \ namespace. The --rm option deletes the container upon termination to clean up\
    \ resources. This is a useful option when testing multiple images. The -it double\
    \ option allocates a pseudoterminal and links to the container’s stdin device\
    \ to mimic an interactive shell.\n\nWe can then start Metasploit using the msfconsole\
    \ command:\n\n```\n```bash\nroot@46459ecdc0c4:/opt/metasploit-framework# ./msfconsole\n\
    \n    =[ metasploit v5.0.54-dev                     ]\n+ -- ---[ 1931 exploits\
    \ - 1078 auxiliary - 332 post ]\n+ -- ---[ 556 payloads - 45 encoders - 10 nops\
    \      ]\n+ -- ---[ 7 evasion                               ]\n\nmsf5 > exit\n\
    ```\n```\n\nCompare that to installing Metasploit from scratch and you will hopefully\
    \ understand how much blood and sweat were spared by these two commands.\n\nOf\
    \ course, you may wonder, “How, in this new isolated environment, can we reach\
    \ a listener from a remote Nginx web server?” Excellent question.\n\nWhen starting\
    \ a container, Docker automatically creates a pair of virtual Ethernet (veth in\
    \ Linux). Think of these devices as the two connectors at the end of a physical\
    \ cable. One end is assigned the new namespace,"
  merge: -1
  img_proc: true
- pgno: 47
  md: 'where it can be used by the container to send and receive network packets.
    This veth usually bears the familiar eth0 name inside the container. The other
    connector is assigned the default namespace and is plugged into a network switch
    that carries traffic to and from the external world. Linux calls this virtual
    switch a *network bridge.*


    A quick ip addr on the machine shows the default docker0 bridge with the allocated
    172.17.0.0/16 IP range ready to be distributed across new containers:


    ```

    root@Lab:~/# ip addr

    3: docker0: <NO-CARRIER,BROADCAST,MULTICAST,UP> mtu 1500 state group default

    link/ether 03:12:27:8f:b9:42 brd ff:ff:ff:ff:ff:ff

    inet 172.17.0.1/16 brd 172.17.255.255 scope global docker0

    --snip--

    ```


    Every container gets its dedicated veth pair, and therefore IP address, from the
    docker0 bridge IP range.


    Going back to our original issue, routing traffic from the external world to a
    container simply involves forwarding traffic to the Docker network bridge, which
    will automatically carry it to the right veth pair. Instead of toying with iptables,
    we can call on Docker to create a firewall rule that does just that. In the following
    command, ports 8400 to 8500 on the host will map to ports 8400 to 8500 in the
    container:


    ```

    root@Lab:~/# sudo docker run --rm \

    -it -p 8400-8500:8400-8500 \

    -v ~/.msf4:/root/.msf4 \

    -v /tmp/msf:/tmp/data \

    phocean/msf

    ```


    Now we can reach a handler listening on any port between 8400 and 8500 inside
    the container by sending packets to the host''s IP address on that same port range.


    **NOTE** If you don''t want to bother with port mapping, just attach the containers
    to the host''s network interface using the --net=host flag on docker run instead
    of running -p xxx:xxxx.


    In the previous command we also mapped the directories ~/.msf4 and /tmp/msf on
    the host to directories in the container, /root/.msf4 and /tmp/data, respectively—a
    useful trick for persisting data across multiple runs of the same Metasploit container.


    **NOTE** To send the container to the background, simply press CTRL-P followed
    by CTRL-Q. You can also send it to the background from the start by adding the
    -d flag. To get inside once more, execute a docker ps, get the Docker ID, and
    run docker attach <ID>. Or you can run the docker exec -it <ID> sh command. For
    other useful commands, check out the Docker cheat sheet at http://dockerlabs.collabnix.com/.'
  merge: -1
  img_proc: true
- pgno: 48
  md: "# Union Filesystem\n\nThis brings us neatly to the next concept of containerization,\
    \ the union filesystem (UFS), which enables a technique of merging files from\
    \ multiple filesystems to present a single and coherent filesystem layout. Let's\
    \ explore it through a practical example: we'll build a Docker image for SILENTTRINITY.\n\
    \nA Docker image is defined in a Dockerfile. This is a text file containing instructions\
    \ to build the image by defining which files to download, which environment variables\
    \ to create, and all the rest. The commands are fairly intuitive, as you can see\
    \ in Listing 3-2.\n\n```\n# file: ~/SILENTTRINITY/Dockerfile\n# The base Docker\
    \ image containing binaries to run Python 3.7\nFROM python:stretch-slim-3.7\n\n\
    # We install the git, make, and gcc tools\nRUN apt-get update && apt-get install\
    \ -y git make gcc\n\n# We download SILENTTRINITY and change directories\nRUN git\
    \ clone https://github.com/bytb3l33d3r/SILENTTRINITY/ /root/st/\nWORKDIR /root/st/\n\
    \n# We install the Python requirements\nRUN python3 -m pip install -r requirements.txt\n\
    \n# We inform future Docker users that they need to bind port 5000\nEXPOSE 5000\n\
    \n# ENTRYPOINT is the first command the container runs when it starts\nENTRYPOINT\
    \ [\"python3\", \"teamserver.py\", \"0.0.0.0\", \"stringpassword\"]\n```\n\n*Listing\
    \ 3-2: Dockerfile to start the SILENTTRINITY team server*\n\nWe start by building\
    \ a base image of Python 3.7, which is a set of files and dependencies for running\
    \ Python 3.7 that is already prepared and available in the official Docker repository,\
    \ Docker Hub. We then install some common utilities like git, make, and gcc that\
    \ we will later use to download the repository and run the team server. The EXPOSE\
    \ instruction is purely for documentation purposes. To actually expose a given\
    \ port, we'll still need to use the -p argument when executing docker run.\n\n\
    Next, we use a single instruction to pull the base image, populate it with the\
    \ tools and files we mentioned, and name the resulting image silent:\n\n```\n\
    root@Lab:~# docker build -t silent .\nStep 1/7 : FROM python:3.7-slim-stretch\n\
    \ ---> fad2b9f06d3b\nStep 2/7 : RUN apt-get update && apt-get install -y git make\
    \ gcc\n ---> Using cache\n ---> 94f5fc21a5c4\n--snip--\n```"
