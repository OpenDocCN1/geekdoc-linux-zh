    \ and flags it as a suspicious event. As of this moment, it only reports write\
    \ API calls, like RunInstance, CreateUser, CreateRole, and so on. We can still\
    \ go nuts with read-only and reconnaissance calls, but as soon as we start automating\
    \ user account creation, for instance, we must be careful not to hit the dynamic\
    \ threshold set by CloudTrail Insights.\n\nThese two features (CloudTrail Insights\
    \ and IAM Access Analyzer) complement other existing services, like GuardDuty,\
    \ that watch for suspicious events, such as disabling security features (CloudTrail)\
    \ and communicating with known-bad domains. We can check if GuardDuty is enabled\
    \ in a given region with the following command:\n\n```\nroot@Point1:~/# aws guardduty\
    \ list-detectors --region=eu-west-1\n{ \"DetectorIds\": [ \"64b5b4e50b86d0c7068a6537de5b770e\"\
    \ ] }\n```\n\nEven if MXR Ads neglected to implement all these novelty features,\
    \ CloudTrail is such a basic component that almost every company has it enabled\
    \ by default. We could empty the S3 bucket storing the CloudTrail data, but the\
    \ logs would still be available in CloudTrail itself for at least 90 days.\n\n\
    Whenever logs are so easily available and useful, caution would advise us to assume\
    \ the worst: monitoring dashboards tracking API calls, IP addresses, types of\
    \ services called, unusual queries to highly privileged services, and so on."
