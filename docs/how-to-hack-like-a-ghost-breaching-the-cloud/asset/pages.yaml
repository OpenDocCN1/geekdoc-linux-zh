- pgno: 51
  md: 'And this will run the SILENTTRINITY container:


    ```

    root@Lab:~/# docker run -d \

    -v /opt/st:/root/st/data \

    -p5000-5050:5000-5050 \

    sparcflow/silent

    ```


    In these examples we used vanilla versions of Metasploit and SILENTTRINITY, but
    we could have just as easily added custom Boo-Lang payloads, Metasploit resource
    files, and much more. The best part? We can duplicate our C2 backends as many
    times as we want, easily maintain different versions, replace them at will, and
    so forth. Pretty neat, right?


    The last step is to “dockerize” the Nginx server that routes calls to either Metasploit
    or SILENTTRINITY according to the URL’s path.


    Fortunately, in this case, most of the heavy lifting has already been done by
    @staticfloat, who did a great job automating the Nginx setup with SSL certificates
    generated by Let’s Encrypt with https://github.com/staticfloat/docker-nginx-certbot.
    As shown in Listing 3-3, we just need to make a couple of adjustments to the Dockerfile
    in the repo to fit our needs, like accepting a variable domain name and a C2 IP
    to forward traffic to.


    ```

    # file: ~/nginx/Dockerfile

    # The base image with scripts to configure Nginx and Let''s Encrypt

    FROM staticfloat/nginx-certbot


    # Copy a template Nginx configuration

    COPY *.conf /etc/nginx/conf.d/


    # Copy phony HTML web pages

    COPY --chown=www-data:www-data html/* /var/www/html/


    # Small script that replaces __DOMAIN__ with the ENV domain value, same for IP

    COPY init.sh /scripts/


    ENV DOMAIN="www.customdomain.com"

    ENV C2IP="192.168.1.29"

    ENV CERTBOT_EMAIL="sparc.flow@protonmail.com"


    CMD ["/bin/bash", "/scripts/init.sh"]

    ```


    Listing 3-3: Dockerfile to set up an Nginx server with a Let’s Encrypt certificate


    The init.sh script is simply a couple of sed commands we use to replace the string
    "__DOMAIN__" in Nginx’s configuration file with the environment variable $DOMAIN,
    which we can override at runtime using the -e switch. This means that whatever
    domain name we choose, we can easily start an Nginx container that will automatically
    register the proper TLS certificates.


    The Nginx configuration file is almost exactly the same as the one in Listing
    3-3, so I will not go through it again. You can check out all the files involved
    in the building of this image in the book’s GitHub repo at www.nostarch.com/how-hack-ghost.'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'Launching a fully functioning Nginx server that redirects traffic to our C2
    endpoints is now a one-line job:


    ```

    root@Lab:~# docker run -d \

    -p80:80 -p443:443 \

    -e DOMAIN="www.customdomain.com" \

    -e C2IP="192.168.1.29" \

    -v /opt/letsencrypt:/etc/letsencrypt \

    sparcflow/nginx

    ```


    The DNS record of www.<customdomain>.com should obviously already point to the
    server’s public IP for this maneuver to work. While Metasploit and SILENTTRINITY
    containers can run on the same host, the Nginx container should run separately.
    Consider it as sort of a technological fuse: it’s the first one to burst into
    flames at the slightest issue. If, for example, our IP or domain gets flagged,
    we simply respawn a new host and run a docker run command. Twenty seconds later,
    we have a new domain with a new IP routing to the same backends.


    # IP Masquerading


    Speaking of domains, let’s buy a couple of legit ones to masquerade our IPs. I
    usually like to purchase two types of domains: one for workstation reverse shells
    and another one for machines. The distinction is important. Users tend to visit
    normal-looking websites, so maybe buy a domain that implies it’s a blog about
    sports or cooking. Something like experienceyourfood.com should do the trick.


    It would be weird for a server to initiate a connection toward this domain, however,
    so the second type of domain to purchase should be something like linux-packets.org,
    which we can masquerade as a legit package distribution point by hosting a number
    of Linux binaries and source code files. After all, a server initiating a connection
    to the World Wide Web to download packages is the accepted pattern. I cannot count
    the number of false positives that threat intelligence analysts have had to discard
    because a server deep in the network ran an apt update that downloaded hundreds
    of packages from an unknown host. We can be that false positive!


    I will not dwell much more on domain registration because our goal is not to break
    into the company using phishing, so we’ll avoid most of the scrutiny around domain
    history, classification, domain authentication through DomainKeys Identified Mail
    (DKIM), and so on. This is all explored in detail in my book How to Hack Like
    a Legend.


    Our infrastructure is almost ready now. We still need to tune our C2 frameworks
    a bit, prepare stag ers, and launch listeners, but we will get there further down
    the road.


    > NOTE Both SILENTTRINITY and Metasploit support runtime files or scripts to automate
    the setup of a listener/stager.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Automating the Server Setup


    The last painful experience we need to automate is the setup of the actual servers
    on the cloud provider. No matter what each provider falsely claims, one still
    needs to go through a tedious number of menus and tabs to have a working infrastructure:
    firewall rules, hard drive, machine configuration, SSH keys, passwords, and more.


    This step is tightly linked to the cloud provider itself. Giants like AWS, Microsoft
    Azure, Alibaba, and Google Cloud Platform fully embrace automation through a plethora
    of powerful APIs, but other cloud providers do not seem to care even one iota.
    Thankfully, this may not be such a big deal for us since we’re managing just three
    or four servers at any given time. We can easily set them up or clone them from
    an existing image, and in three docker run commands have a working C2 infrastructure.
    But if we can acquire a credit card that we do not mind sharing with AWS, we can
    automate this last tedious setup as well, and in doing so touch upon something
    that is or should be fundamental to any modern technical environment: infrastructure
    as code.


    Infrastructure as code rests upon the idea of having a full declarative description
    of the components that should be running at any given time, from the name of the
    machine to the last package installed on it. A tool then parses this description
    file and corrects any discrepancies observed, such as updating a firewall rule,
    changing an IP address, attaching more disk, or whatever is needed. If the resource
    disappears, it’s brought back to life to match the desired state. Sounds magical,
    right?


    Multiple tools will allow you to achieve this level of automation (both at the
    infrastructure level and the OS level), but the one we will go with is called
    Terraform from HashiCorp.


    Terraform is open source and supports a number of cloud providers (listed in the
    documentation at https://registry.terraform.io), which makes it your best shot
    should you opt for an obscure provider that accepts Zcash. The rest of the chapter
    will focus on AWS, so you can easily replicate the code and learn to play with
    Terraform.


    I would like to stress that this step is purely optional to begin with. Automating
    the setup of two or three servers may take more effort than it saves since we
    already have such a great container setup, but the automating process helps us
    to explore current DevOps methodology to better understand what to look for once
    we are in a similar environment.


    Terraform, as is the case with all Golang tools, is a statically compiled binary,
    so we do not need to bother with wicked dependencies. We SSH into our bouncing
    servers and promptly download the tool, like so:


    ```

    root@Bouncer:~/# wget\

    https://releases.hashicorp.com/terraform/0.12.12/terraform_0.12.12_linux_amd64.zip


    root@Bouncer:~/# unzip terraform_0.12.12_linux_amd64.zip

    root@Bouncer:~/# chmod +x terraform

    ```'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'Terraform will interact with the AWS Cloud using valid credentials that we
    provide. Head to AWS IAM—the user management service—to create a programmatic
    account and grant it full access to all EC2 operations. EC2 is the AWS service
    managing machines, networks, load balancers, and more. You can follow a step-by-step
    tutorial to create an account on IAM if it’s your first time dealing with AWS
    by searching at: https://serverless-stack.com/chapters/.


    In the IAM user creation panel, give your newly created user programmatic access,
    as shown in Figure 3-5.


    ![](img/961e81aef23040d0fbe348f58c055860_54_0.png)


    Figure 3-5: Creating a user called terraform with access to the AWS API


    Allow the user full control over EC2 to administer machines by attaching the AmazonEC2FullAccess
    policy, as shown in Figure 3-6.


    ![](img/961e81aef23040d0fbe348f58c055860_54_1.png)


    Figure 3-6: Attaching the policy AmazonEC2FullAccess to the terraform user


    Download the credentials as a .csv file. Note the access key ID and secret access
    key, as shown in Figure 3-7. We’ll need these next.


    ![](img/961e81aef23040d0fbe348f58c055860_54_2.png)


    Figure 3-7: API credentials to query the AWS API


    Once in possession of an AWS access key and secret access key, download the AWS
    command line tool and save your credentials:


    ```

    root@Bouncer:~/# apt install awscli

    root@Bouncer:~/# aws configure

    ```'
  merge: -1
  img_proc: true
- pgno: 55
  md: "AWS Access Key ID [None]: AKIA44ESW0EAASQDF5A0\nAWS Secret Access Key [None]:\
    \ DEqg5dDxDA4uSQ6xXdhvu7Tzi53…\nDefault region name [None]: eu-west-1\n\nWe then\
    \ set up a folder to host the infrastructure’s configuration:\n\n```\nroot@Bouncer:~#\
    \ mkdir infra && cd infra\n```\n\nNext, we create two files: provider.tf and main.tf.\
    \ In the former, we initialize the AWS connector, load the credentials, and assign\
    \ a default region to the resources we intend to create, such as eu-west-1 (Ireland),\
    \ like so:\n\n```\n# provider.tf\nprovider \"aws\" {\n  region  = \"eu-west-1\"\
    \n  version = \"~> 2.28\"\n}\n```\n\nIn main.tf we’ll place the bulk of the definition\
    \ of our architecture. One of the primordial structures in Terraform is a resource—an\
    \ element describing a discrete unit of a cloud provider’s service, such as a\
    \ server, an SSH key, a firewall rule, and so on. The level of granularity depends\
    \ on the cloud service and can quickly grow to an absurd level of complexity,\
    \ but that’s the price of flexibility.\n\nTo ask Terraform to spawn a server,\
    \ we simply define the aws_instance resource, as shown here:\n\n```\n# main.tf\n\
    resource \"aws_instance\" \"basic_ec2\" {\n  ami           = \"ami-0039c41a10b230acb\"\
    \n  instance_type = \"t2.micro\"\n}\n```\n\nOur basic_ec2 resource is a server\
    \ that will launch the Amazon Machine Image (AMI) identified by ami-0039c41a10b230acb,\
    \ which happens to be an Ubuntu 18.04 image. You can check all the prepared Ubuntu\
    \ images at https://cloud-images.ubuntu.com/locator/ec2/. The server (or instance)\
    \ is of type t2.micro, which gives it 1GB of memory and one vCPU.\n\n> NOTE\n\
    The Terraform documentation is very didactic and helpful, so do not hesitate to\
    \ go through it when building your resources: https://www.terraform.io/docs/.\n\
    \nWe save main.tf and initialize Terraform so it can download the AWS provider:\n\
    \n```\nroot@Bounce:~/infra# terraform init\nInitializing the backend...\nInitializing\
    \ provider plugins...\n- Downloading plugin for provider \"aws\"\n\nTerraform\
    \ has been successfully initialized!\n```"
  merge: -1
  img_proc: true
- pgno: 56
  md: "Next, we execute the terraform fmt command to format main.tf followed by the\
    \ plan instruction to build a list of changes about to happen to the infrastructure,\
    \ as shown next. You can see our server scheduled to come to life with the attributes\
    \ we defined earlier. Pretty neat.\n\n```\nroot@Bounce:~/infra# terraform fmt\
    \ && terraform plan\nTerraform will perform the following actions:\n\n  # aws_instance.basic_ec2\
    \ will be created\n  + resource \"aws_instance\" \"basic_ec2\" {\n      + ami\
    \             = \"ami-0039c41a10b230acb\"\n      + arn             = (known after\
    \ apply)\n      + associate_public_ip_address = (known after apply)\n      + instance_type\
    \   = \"t2.micro\"\n  }\n--snip--\n\nPlan: 1 to add, 0 to change, 0 to destroy.\n\
    ```\n\nOnce we validate these attributes, we call terraform apply to deploy the\
    \ server on AWS. This operation also locally creates a state file describing the\
    \ current resource—a single server—we just created.\n\nIf we terminate the server\
    \ manually on AWS and relaunch a terraform apply, it will detect a discrepancy\
    \ between the local state file and the current state of our EC2 instances. It\
    \ will resolve such a discrepancy by re-creating the server. If we want to launch\
    \ nine more servers bearing the same configuration, we set the count property\
    \ to 10 and run an apply once more.\n\nTry manually launching and managing 10\
    \ or 20 servers on AWS (or any cloud provider for that matter), and you will soon\
    \ dye your hair green, paint your face white, and start dancing in the streets\
    \ of NYC. The rest of us using Terraform will update a single number, as shown\
    \ in Listing 3-4, and go on with our lives in sanity.\n\n```\n# main.tf launching\
    \ 10 EC2 servers\nresource \"aws_instance\" \"basic_ec2\" {\n  ami          =\
    \ \"ami-0039c41a10b230acb\"\n  count        = 10\n  instance_type = \"t2.micro\"\
    \n}\n```\n\nListing 3-4: Minimal code to create 10 EC2 instances using Terraform\n\
    \n# Tuning the Server\n\nOur server so far is pretty basic. Let’s fine-tune it\
    \ by setting the following properties:\n\n+   - An SSH key so we can administer\
    \ it remotely, which translates to a Terraform resource called aws_key_pair.\n\
    - A set of firewall rules—known as security groups in AWS terminology—to control\
    \ which servers are allowed to talk to each other and how. This is"
  merge: -1
  img_proc: true
- pgno: 57
  md: "defined by the Terraform resource aws_security_group. Security groups need\
    \ to be attached to a virtual private cloud (VPC), a sort of virtualized network.\
    \ We just use the default one created by AWS.\n\n+   - A public IP assigned to\
    \ each server.\n\nListing 3-5 shows main.tf with those properties set.\n\n```\n\
    # main.tf - compatible with Terraform 0.12 only\n\n# We copy-paste our SSH public\
    \ key\n① resource \"aws_key_pair\" \"ssh_key\" {\n  key_name  = \"mykey\"\n  public_key\
    \ = \"ssh-rsa AAAAB3NzaC1yc2EAAA...\"\n}\n\n# Empty resource, since the default\
    \ AWS VPC (network) already exists\nresource \"aws_default_vpc\" \"default\" {\n\
    }\n\n# Firewall rule to allow SSH from our bouncing server IP only\n# All outgoing\
    \ traffic is allowed\n② resource \"aws_security_group\" \"SSHAdmin\" {\n  name\
    \        = \"SSHAdmin\"\n  description = \"SSH traffic\"\n  vpc_id      = aws_default_vpc.default.id\n\
    \  ingress {\n    from_port   = 0\n    to_port     = 22\n    protocol    = \"\
    tcp\"\n    cidr_blocks = [\"123.123.123.123/32\"]\n  }\n  egress {\n    from_port\
    \   = 0\n    to_port     = 0\n    protocol    = \"-1\"\n    cidr_blocks = [\"\
    0.0.0.0/0\"]\n  }\n}\n\n# We link the SSH key and security group to our basic_ec2\
    \ server\n\nresource \"aws_instance\" \"basic_ec2\" {\n  ami           = \"ami-0039c41a10b230acb\"\
    \n  instance_type = \"t2.micro\"\n\n  vpc_security_group_ids  = aws_security_group.SSHAdmin.id\n\
    \  ③ key_name             = aws.ssh_key.id\n  associate_public_ip_address= \"\
    true\"\n  root_block_device {\n    volume_size = \"25\"\n  }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 58
  md: "```\n# We print the server's public IP\noutput \"public_ip \" {\n  value =\
    \ aws_instance.basic_ec2.public_ip\n}\n```\n\n# Listing 3-5: Adding some properties\
    \ to main.tf\n\nAs stated previously, the aws_key_pair registers an SSH key on\
    \ AWS ①, which gets injected into the server on the first boot. Every resource\
    \ on Terraform can later be referenced through its ID variable, which is populated\
    \ at runtime—in this case, aws.ssh_key.id ③. The structure of these special variables\
    \ is always the same: resourceType.resourceName.internalVariable.\n\nThe aws_security_group\
    \ presents no novelty ②, except perhaps for the reference to the default VPC,\
    \ which is the default virtual network segment created by AWS (akin to a router's\
    \ interface, if you will). The firewall rules allow incoming SSH traffic from\
    \ our bouncing server only.\n\nWe launch another plan command so we can make sure\
    \ all properties and resources match our intended outcome, as shown in Listing\
    \ 3-6.\n\n```\nroot@Bounce:~/infra# terraform fmt && terraform plan\nTerraform\
    \ will perform the following actions:\n\n  # aws_instance.basic_ec2 will be created\n\
    \  + resource \"aws_key_pair\" \"ssh_key2\" {\n      + id         = (known after\
    \ apply)\n      + key_name   = \"mykey2\"\n      + public_key = \"ssh-rsa AAAAB3NzaC1yc2...\"\
    \n    }\n\n  + resource \"aws_security_group\" \"SSHAdmin\" {\n      + arn   \
    \      = (known after apply)\n      + description = \"SSH admin from bouncer\"\
    \n      + id          = (known after apply)\n--snip--\n    }\n\n  + resource \"\
    aws_instance\" \"basic_ec2\" {\n      + ami                         = \"ami-0039c41a10b230acb\"\
    \n      + arn                         = (known after apply)\n      + associate_public_ip_address\
    \ = true\n      + id                          = (known after apply)\n      + instance_type\
    \               = \"t2.micro\"\n--snip--\n\nPlan: 3 to add, 0 to change, 0 to\
    \ destroy.\n```\n\n# Listing 3-6: Checking that the properties are well defined\n\
    \nTerraform will create three resources. Great.\nAs one last detail, we need to\
    \ instruct AWS to install Docker and launch our container, Nginx, when the machine\
    \ is up and running. AWS leverages the cloud-init package installed on most Linux\
    \ distributions to execute a"
  merge: -1
  img_proc: true
- pgno: 59
  md: "script when the machine first boots. This is in fact how AWS injects the public\
    \ key we defined earlier. This script is referred to as “user data.”\n\nAlter\
    \ main.tf to add bash commands to install Docker and execute the container, as\
    \ shown in Listing 3-7.\n\n```\nresource \"aws_instance\" \"basic_ec2\" {\n--snip--\n\
    ① user_data = <<EOF\n\n#!/bin/bash\nDOMAIN=\"www.linux-update-packets.org\";\n\
    C2IP=\"172.31.31.13\";\n\nsleep 10\nsudo add-apt-repository \\\n  \"deb [arch=amd64]\
    \ https://download.docker.com/linux/ubuntu \\\n  $(lsb_release -cs) \\\n  stable\"\
    \napt update\napt install -y docker-ce\ndocker run -dti -p80:80 -p443:443 \\\n\
    \ -e DOMAIN=\"www.customdomain.com\" \\\n -e C2IP=\"$C2IP\" \\\n -v /opt/letsencrypt:/etc/letsencrypt\
    \ \\\n sparcflow/nginx\n\nEOF\n}\n```\n\n*Listing 3-7: Launching the container\
    \ from main.tf*\n\nThe EOF block ① holds a multiline string that makes it easy\
    \ to inject environment variables whose values are produced by other Terraform\
    \ resources. In this example we hardcode the C2’s IP and domain name, but in real\
    \ life these will be the output of other Terraform resources in charge of spinning\
    \ up backend C2 servers.\n\n**NOTE** Instead of hardcoding the domain name in\
    \ Listing 3-7, we could further extend Terraform to automatically create and manage\
    \ DNS records using the Namecheap provider, for instance: https://github.com/adamdecaf/terraform-provider-namecheap.\n\
    \n# Pushing to Production\n\nWe’re now ready to push this into production with\
    \ a simple terraform apply, which will spill out the plan once more and request\
    \ manual confirmation before contacting AWS to create the requested resources:\n\
    \n```\nroot@Bounce:~/infra# terraform fmt && terraform apply\n\naws_key_pair.ssh_key:\
    \ Creation complete after 0s [id=mykey2]\naws_default_vpc.default: Modifications\
    \ complete after 1s [id=vpc-b95e4bdf]\n--snip--\naws_instance.basic_ec2: Creating...\n\
    ```"
  merge: -1
  img_proc: true
