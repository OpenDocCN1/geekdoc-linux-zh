    Things are looking great. We get the full descriptions of approximately 700 EC2
    machines, including private and public IP addresses, firewall rules, machine types,
    and more. That''s a lot of machines, but the figure is relatively small for a
    company with the scale of MXR Ads. Something is off.


    All the machines we got have the special tag k8s.io/cluster-autoscaler/prod-euw1.
    This is a common tag used by the autoscaler tool (https://github.com/kubernetes/autoscaler/)
    to mark disposable nodes that can be killed off when the pods'' activity is running
    low. MXR Ads probably took advantage of this tag to limit the scope of the default
    permissions assigned to Kubernetes nodes. Clever indeed.


    Ironically, the tag spills out the Kubernetes cluster name (prod-euw1), which
    is a required parameter in a call to the describeCluster API. Let''s call describeCluster
    then:


    ```

    root@Point1:~/# export AWS_REGION=eu-west-1

    root@Point1:~/# aws eks describe-cluster --name prod-euw1 --profile node

    { "cluster": {

    ① "endpoint": "https://BB061F0457C63.y14.eu-west-1.eks.amazonaws.com",

    ② "roleArn": "arn:aws:iam::1886477354405:role/eks-prod-role",

    "vpcId": "vpc-05c5909e230201771",

    "endpointPublicAccess": false,

    "endpointPrivateAccess": true,

    --snip--

    ```


    The API server is that long URL conveniently named endpoint ①. In some rare configurations,
    it may be exposed on the internet, making it much more convenient to query/alter
    the cluster''s desired state.


    The role we got ② can do much more than simply explore Kubernetes resources. In
    a default setting, this role has the power to attach any security group to any
    other node in the cluster. Now that we''ve been granted this role, we just need
    to find an existing security group that exposes every port on the internet—there
    is always one—and assign it to the machine hosting our current shell.


    Not so fast, though. While it might be tempting to promote our handcrafted S3-based
    reverse shell into a full-blown duplex communication'
