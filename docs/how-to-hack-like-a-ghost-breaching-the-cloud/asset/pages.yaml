  md: "```\nconf = SparkConf()\nconf = conf.setAppName(\"Word Count\")\nconf = conf.setMaster(\"\
    spark://10.50.12.67:7077\")\nconf = conf.set(\"spark.driver.host\", \"10.33.57.66\"\
    )\n\nsc = SparkContext(conf = conf)\npartlist = sc.parallelize(range(0, 1))\n\
    finalList = partList.map(\n    lambda x: Popen([\"hostname\"], stdout=subprocess.PIPE).stdout.read()\n\
    )\nfor a in finalList.collect():\n    print(a)\n```\n\n*Listing 12-8: Skeleton\
    \ of the full app executing code on a Spark cluster*\n\nInstead of defining a\
    \ new named function and calling it iteratively via map (like we did in Listing\
    \ 12-5), we instantiate an anonymous function with the prefix lambda that accepts\
    \ one input parameter (each element iterated over) ①. When the worker loops over\
    \ our RDD to apply the map transformation, it comes across our lambda function,\
    \ which instructs it to run the hostname command. Let’s try it out:\n\n```\n$\
    \ python test_app.py\n19/12/20 18:48:46 WARN NativeCodeLoader: Unable to load\
    \ native-hadoop library for your platform... using builtin-java classes where\
    \ applicable\n\nUsing Spark's default log4j profile: org/apache/spark/log4j-defaults.properties\n\
    \nSetting default log level to \"WARN\".\nTo adjust logging level use sc.setLogLevel(newLevel).\
    \ For SparkR, use setLogLevel(newLevel).\n\nip-172-31-29-239\n```\n\nThere you\
    \ go! We made contact with the master. A nice, clean command execution, and as\
    \ promised, at no point in time did Spark bother asking us for credentials.\n\n\
    Should we relaunch the program, our job might get scheduled on another worker\
    \ node altogether. This is expected and is, in fact, at the heart of distributed\
    \ computing. All nodes are identical and have the same configuration (IAM roles,\
    \ network filters, and so on), but they will not necessarily lead the same life.\
    \ One worker may receive a job that spills database credentials to disk, while\
    \ another sorts error messages.\n\nWe can force Spark to distribute our workload\
    \ to n machines by building RDDs with n partitions:\n\n```\npartlist = sc.parallelize(range(0,\
    \ 10), 10)\n```\n\nWe cannot, however, choose which ones will receive the payload.\
    \ Time to set up a permanent resident on a couple of worker nodes."
