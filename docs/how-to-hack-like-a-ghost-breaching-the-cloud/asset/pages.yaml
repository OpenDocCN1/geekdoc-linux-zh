- pgno: 77
  md: 'However, looking carefully at this list of IP addresses, we quickly realize
    that they have nothing to do with Gretsch Politico or MXR Ads. It turns out that
    most of the subdomains we collected are running on AWS infrastructure. This is
    an important conclusion. Most internet resources on AWS, like load balancers,
    content distribution networks, S3 buckets, and so on, regularly rotate their IP
    addresses.


    > **NOTE** *A content distribution network (CDN) is a set of geographically distributed
    proxies that help decrease enduser latency and achieve high availability. They
    usually provide local caching, point users to the closest server, route packets
    through the fastest path, and offer other services. Cloudflare, Akamai, and AWS
    CloudFront are some of the key players.*


    That means that if we feed this list of IPs to Nmap and the port scan drags on
    longer than a couple of hours, the addresses will have already been assigned to
    another customer and the results will no longer be relevant. Of course, companies
    can always attach a fixed IP to a server and directly expose their application,
    but that''s like intentionally dropping an iron ball right on your little toe.
    Nobody is that masochistic.


    Over the last decade, we hackers have gotten into the habit of only scanning IP
    addresses and skipping DNS resolution in order to gain a few seconds, but when
    dealing with a cloud provider, this could prove fatal. Instead, we should scan
    domain names; that way, the name resolution will be performed closer to the actual
    scan to guarantee its integrity.


    That''s what we will do next. We launch a fast Nmap scan on all the domain names
    we''ve gathered so far to look for open ports:


    ```

    root@Point1:~/# nmap -F -sV -iL domains.txt -oA fast_results

    ```


    We focus on the most common ports using -F, grab the component''s version using
    -sV, and save the results in XML, RAW, and text formats with -oA. This scan may
    take a few minutes, so while waiting for it to finish, we''ll turn our attention
    to the actual content of the hundreds of domains and websites we found belonging
    to MXR Ads and Gretsch Politico.


    # Resources


    +   - Find an example of leaked credentials by searching for a bug report of a
    researcher finding API tokens in a Starbucks-owned repo: https://hackerone.com/reports/716292/

    - Search for Juri Strumpflohner''s tutorial at https://juristr.com/ if you''re
    not familiar with Git''s internals.'
