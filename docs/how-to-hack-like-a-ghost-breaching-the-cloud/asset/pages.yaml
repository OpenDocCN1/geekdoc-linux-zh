- pgno: 226
  md: 'Every Spark application starts with the same boilerplate code that defines
    the SparkContext, a client-side connector in charge of communicating with the
    Spark cluster. We start our application with that setup code (see Listing 12-4).


    ```

    from pyspark import SparkContext, SparkConf


    # Set up configuration options

    conf = SparkConf()

    conf = conf.setAppName("Word Count")


    # Add the IP of the Spark master

    conf = conf.setMaster("spark://10.50.12.67:7077")


    # Add the IP of the Jenkins worker we are currently on

    conf = conf.set("spark.driver.host", "10.33.57.66")


    # Initialize the Spark context with the necessary info to reach the master

    sc = SparkContext(conf = conf)

    ```


    # Listing 12-4: Malicious Spark application setup code


    This Spark context implements methods that create and manipulate distributed data.
    It allows us to transform a regular Python list from a monolithic object into
    a collection of units that can be distributed over multiple machines. These units
    are called partitions. Each partition can hold one, two, or three elements of
    the original list—whatever Spark deems to be optimal. Here we define such a collection
    of partitions composed of 10 elements:


    ```

    partList = sc.parallelize(range(0, 10))

    ```


    The partList.getNumPartitions returns 2 on my computer, indicating that it has
    split the original list into two partitions. Partition 1 likely holds 0, 1, 2,
    3, and 4. Partition 2 likely holds 5, 6, 7, 8, and 9.


    The partList is now a collection of partitions. It''s a resilient distributed
    dataset (RDD) that supports many iterative methods, known as Spark transformations,
    like map, flatMap, reduceByKey, and other methods that will transform the data
    in a distributed manner. Code execution seems like a long shot from MapReduce
    operations, but bear with me: it will all tie up together nicely.


    > **NOTE** A map is a method that, given a list, (1, 2, 3, 4, . . . n), and a
    method, F, will return a new list: (F(1), F(2), . . . F(n)). A flatMap is a method
    that, for each element, may return zero, one, or more objects. So, for a given
    list, (1, 2, 3 . . . n), and a method, F, flatMap may only return (F(1)) or (F(2),
    F(3)). F(2) can be a single element or another list.'
