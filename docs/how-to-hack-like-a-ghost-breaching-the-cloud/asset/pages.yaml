  md: "One pod is great, but two are better, especially for resilience so the second\
    \ can act as a backup should the first fail. What should we do? Submit the same\
    \ manifest twice? Nah, we create a deployment object that can replicate pods,\
    \ as depicted in Figure 7-3.\n\n![](img/961e81aef23040d0fbe348f58c055860_132_0.png)\n\
    \nFigure 7-3: A Kube deployment object\n\nA deployment describes how many pods\
    \ should be running at any given time and oversees the replication strategy. It\
    \ will automatically respawn pods if they go down, but its key feature is rolling\
    \ updates. If we decide to update the container’s image, for instance, and thus\
    \ submit an updated deployment manifest, it will strategically replace pods in\
    \ a way that guarantees the continuous availability of the application during\
    \ the update process. If anything goes wrong, the new deployment rolls back to\
    \ the previous version of the desired state.\n\nLet’s delete our previous stand-alone\
    \ pod so we can re-create it as part of a deployment object instead:\n\n```\n\
    root@DemoLab:/# kubectl delete -f myapp.yaml\n```\n\nTo create the pod as a deployment\
    \ object, we push a new manifest file of type Deployment, specify the labels of\
    \ the containers to replicate, and append the previous pod’s configuration in\
    \ its manifest file (see Listing 7-2). Pods are almost always created as part\
    \ of deployment resources.\n\n```\n# deployment_myapp.yaml file\n# Minimal description\
    \ to start 2 pods\napiVersion: apps/v1\nkind: Deployment # We push a deployment\
    \ object\nmetadata:\n  name: myapp # Deployment’s name\nspec:\n  selector:\n \
    \   matchLabels: # The label of the pods to manage\n      app: myapp\n  replicas:\
    \ 2 # Tells deployment to run 2 pods\n  template: # Below is the classic definition\
    \ of a pod\n    metadata:\n      labels:\n        app: myapp # Label of the pod\n\
    \    spec:\n```"
  merge: -1
