  md: "![](img/961e81aef23040d0fbe348f58c055860_83_0.png)\n\nFigure 5-2: S3 storage\
    \ bucket as it appears in the web console\n\nS3 can host anything from JavaScript\
    \ files to database backups. Following its rapid adoption by many companies, both\
    \ small and massive, one could often hear in a meeting when speaking of a random\
    \ file, “Oh, just put it on S3!”\n\nThis kind of concentration of easily available\
    \ data on the internet draws hackers like bees to a flower, and sure enough, small\
    \ and prestigious companies alike shared the same scandalous journal headlines.\
    \ Open and vulnerable S3 buckets cost these companies terabytes of sensitive data,\
    \ like customer information, transaction histories, and much more. Breaching a\
    \ company has never been easier. You can even find a list of open S3 buckets at\
    \ https://buckets.grayhatwarfare.com/.\n\nOur little DNS graph in Figure 5-1 showed\
    \ that we have four S3 URLs—dl.mxrads.com, misc.mxrads.com, assets.mxrads.com,\
    \ and resource.mxrads.com—but in fact there may be more to uncover. Before we\
    \ examine these buckets, we’ll weed these out. Sometimes Akamai and CloudFront\
    \ can hide S3 buckets behind ALIAS records. To be thorough, we will loop over\
    \ the 18 Akamai and CloudFront URLs and take a hard look at the Server directive\
    \ in the HTTP response:\n\n```\nroot@Point1:~# while read p; do \\\necho $p, $(curl\
    \ --silent -I -i https://$p | grep AmazonS3) \\\ndone <cloudfront_akamai_subdomains.txt\n\
    \ndigital-js.mxrads.com, Server: AmazonS3\nstreaming.mxrads.com, Server: AmazonS3\n\
    ```\n\nWe have two more buckets to add to the mix. Great. We proceed to load our\
    \ first bucket URL, dl.mxrads.com (an alias for mxrads-files.s3.eu-west-1.amazonaws.com),\
    \ in the browser, hoping to gain entry to whatever the bucket stores. Unfortunately,\
    \ we immediately get slapped with a rather explicit error:\n\n```\n<Error>\n \
    \ <Code>AccessDenied</Code>\n  <Message>Access Denied</Message>\n  <RequestId>F9C81BD8E0E5D907</RequestId>\n\
    \  <HostId>w4yGIMo9hIRXciQKwwab2zoeY0vcDxGkRNIsvWLoR0iyrIsAkdc1f4G1E7v+SGbD1FnEKTt0=\n\
    \  </HostId>\n</Error>\n```\n\nAccess denied."
