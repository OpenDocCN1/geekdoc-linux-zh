  md: "# The AWS Sentries\n\nBackdooring an AWS account can be a delicate procedure\
    \ involving navigating a treacherous sea of monitoring tools and sensitive alerts.\
    \ AWS has made considerable efforts to spoon-feed its customers all sorts of indicators\
    \ of suspicious activity and what it considers to be insecure configurations.\n\
    \nThere are two AWS features in particular that one should be aware of before\
    \ blindly attacking or backdooring an account: IAM Access Analyzer and CloudTrail\
    \ Insights.\n\nIAM Access Analyzer flags every policy document that grants read/write\
    \ permissions to foreign entities. It most notably covers S3 buckets, KMS keys,\
    \ Lambda functions, and IAM roles. When introduced, this feature killed one very\
    \ stealthy persistence strategy: creating an admin role in the victim’s account\
    \ and granting assume-role privileges to a foreign (our own) AWS account.\n\n\
    We can quickly check whether there are any Access Analyzer reports produced in\
    \ the eu-west-1 region:\n\n```\nroot@Point1:~# aws accessanalyzer list-analyzers\
    \ --region=eu-west-1\n{ \"analyzers\": [] }\n```\n\nMXR Ads does not yet take\
    \ advantage of this feature, but we cannot bet our persistence strategy on the\
    \ company’s ignorance of a feature that could expose our backdoor with a single\
    \ click.\n\nCloudTrail is an AWS service that logs almost every AWS API call in\
    \ JSON format and optionally stores it on S3 and/or forwards it to another service\
    \ like CloudWatch to configure metrics and alerts. Listing 11-1 is a sample event\
    \ of an IAM call that created an access key for the admin user. The event is ripe\
    \ with information essential to any threat analyst: source IP address, identity\
    \ of the caller, source of the event, and so forth.\n\n```\n# Sample CloudTrail\
    \ event creating an additional access key\n{\n    \"eventType\": \"AwsApiCall\"\
    ,\n    \"userIdentity\": {\n        \"accessKeyId\": \"ASIA4ZR K6WS32PCYCHY\"\
    ,\n        \"userName\": \"admin\"\n    },\n    \"eventTime\": \"2019-12-29T18:42:47Z\"\
    ,\n    \"eventSource\": \"iam.amazonaws.com\",\n    \"eventName\": \"CreateAccessKey\"\
    ,\n    \"awsRegion\": \"us-east-1\",\n    \"sourceIPAddress\": \"215.142.61.44\"\
    ,\n    \"userAgent\": \"signin.amazonaws.com\",\n    \"requestParameters\": {\
    \ \"userName\": \"admin\" },\n    \"responseElements\": {\n        \"accessKey\"\
    : {\n            \"accessKeyId\": \"AKIA4ZR K6WSRDLX7TDS\",\n```"
