  md: "We candidly try reaching Jenkins directly with no authentication.\nJenkins\
    \ listens by default on port 8080, so we use our existing meterpreter shell to\
    \ issue an HTTP query to the server:\n\n```\n# Our backdoored pod on the Kubernetes\
    \ cluster\n\nmeterpreter > execute curl -I -X GET -D http://ip-10-5-20-239.eu-west-1.compute.internal:8080\n\
    \nHTTP/1.1 301\nLocation: https://www.github.com/hub/oauth_login\ncontent-type:\
    \ text/html; charset=iso-8859-1\n--snip--\n```\n\nWe get turned down immediately.\
    \ It’s only normal, after all, that any half decent company that relies on such\
    \ a critical component for delivery puts minimal protection in place. The way\
    \ to Jenkins is not through the front door but rather through a small crack in\
    \ the alley window: the Chef server that probably helped set up Jenkins in the\
    \ first place.\n\n# Hell’s Kitchen\n\nChef, just like Ansible, is a software configuration\
    \ tool. You enroll a newly installed machine into Chef, and it pulls and executes\
    \ a set of predefined instructions that set up tools on your machine automatically.\
    \ If your machine is a web app, for instance, Chef will install Nginx, set up\
    \ a MySQL client, copy the SSH configuration file, add an admin user, and add\
    \ any other specified software that’s needed.\n\nThe configuration instructions\
    \ are written in Ruby and grouped into what Chef calls—in an elaborate conceit—cookbooks\
    \ and recipes. Listing 10-5 is an example of a Chef recipe that creates a config.json\
    \ file and adds a user to the docker group.\n\n```\n# recipe.rb\n\n# Copy the\
    \ file seed-config.json on the new machine\ncookbook_file config_json do\n  source\
    \ 'seed-config.json'\n  owner 'root'\nend\n\n# Append the user admin to the docker\
    \ group\ngroup 'docker' do\n  group_name 'docker'\n  append true\n  members 'admin'\n\
    \  action :manage\nend\n--snip--\n```\n\nListing 10-5: A Chef recipe that creates\
    \ a config.json file and adds a user to the docker group"
