- pgno: 144
  md: 'The account token is actually a signed JavaScript Object Notation (JSON) string—also
    known as a JSON Web Token (JWT)—holding information identifying the service account.
    We can base64-decode a portion of the JWT string to confirm the identity of the
    default service account and get a bit of information:


    ```

    shell> cat /run/secrets/kubernetes.io/serviceaccount/token \

    | cut -d "." -f 2 \

    | base64 -d


    {

    "iss": "kubernetes/serviceaccount",


    "kubernetes.io/serviceaccount/namespace": "prod",


    "kubernetes.io/serviceaccount/secret.name": "default-token-2mpcg",


    "kubernetes.io/serviceaccount/service-account.name": "default",


    "kubernetes.io/serviceaccount/service-account.uid": "956f6a5d-0854-11ea-9d5f-06c16d8c2dcc",


    "sub": "system:serviceaccount:prod:default"

    }

    ```


    A JWT has several regular fields, also called registered claims: the issuer (iss),
    which in this case is the Kubernetes service account controller; the subject (sub),
    which is the account’s name; and the namespace (more on this in a moment), which
    in this case is prod. Obviously, we cannot alter this information to impersonate
    another account without invalidating the signature appended to this JSON file.


    The namespace is a logical partition that separates groups of Kube resources,
    such as pods, service accounts, secrets, and so on, generally set by the admin.
    It’s a soft barrier that allows more granular RBAC permissions; for example, a
    role with the “list all pods” permission would be limited to listing pods belonging
    to its namespace. The default service account is also namespace-dependent. The
    canonical name of the account we just retrieved is system:serviceaccount:prod:default.


    > NOTE I describe the namespace as a “soft” isolation scheme because nodes are
    not subject to namespaces. Admins can always ask the kube-scheduler to only assign
    pods of a given namespace to nodes with a given tag or annotation, but many feel
    that this sort of defeats the whole point of Kubernetes. Furthermore, all network
    traffic is routed by default inside the cluster regardless of the namespace.


    This token gives us a second opportunity to query the API server. We load the
    file’s content into a TOKEN variable and retry our first HTTP request from Listing
    8-1, sending the TOKEN variable as an Authorization header:


    ```

    shell> export TOKEN=$(cat /run/secrets/kubernetes.io/serviceaccount/token)


    shell> curl -Lk https://10.100.0.1/api --header "Authorization: Bearer $TOKEN"

    ```'
