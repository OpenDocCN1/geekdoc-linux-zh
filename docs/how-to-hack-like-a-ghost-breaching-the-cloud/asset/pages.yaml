  img_proc: true
- pgno: 171
  md: 'And finally, we also make sure to grab that GitHub token belonging to github-bot-ro.
    We make sure it is still valid by performing a quick API call using these few
    lines of Python code:


    ```

    root@Point1:~/# python3 -m pip install PyGithub

    root@Point1:~/# python3


    >>> from github import Github

    >>> g = Github("9c13d31aaedc0cc351dd12cc45ffafbe89848020")

    >>> print(g.get_user().name)

    mxrads-bot-ro

    ```


    They were right after all. Kubernetes sure is fun!

    We can safely say that we currently own MXR Ads’ delivery infrastructure. We still
    don’t know how the profile targeting works or who the end clients of Gretsch Politico
    are, but we can alter, delete, and block all their campaigns—and probably much
    more.

    Before we dive even deeper into this rabbit hole, we need to secure the position
    we worked so hard to attain. Containers have a high volatility that puts our current
    access at risk. All it would take is a new deployment of the surveys app to kill
    our shell access—and with it, our main entry point to MXR Ads’ Kubernetes cluster.


