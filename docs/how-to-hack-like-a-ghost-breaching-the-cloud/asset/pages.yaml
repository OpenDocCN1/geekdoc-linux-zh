- pgno: 67
  md: 'Another great source of information about a company’s business is metasearch
    engines. Websites like Yippy and Bizar aggregate information from a variety of
    general and specialized search engines, giving a nice overview of the company’s
    recent activity.


    > NOTE

    *The compilation of resources available at https://osintframework.com/ is a gold-mine
    for any open source intelligence operator. You can easily lose yourself exploring
    and cross-referencing results between the hundreds of reconnaissance tools and
    apps listed there.*


    From my initial search, many interesting documents pop out, from campaign fund
    reports mentioning GP to marketing pitches for campaign directors. Manually skimming
    through this data makes it clear that GP’s core service is building voter profiles
    based on multiple data inputs. These voter profiles are then studied and fed into
    an algorithm that decides which pitch is most suitable to lock in a voter.


    # Finding Hidden Relationships


    GP’s algorithms mash the data, that much is clear, but where does the data come
    from? To understand GP, we need to understand its closest partners. Whatever company
    or medium is delivering all this data must be working closely with GP. Multiple
    documents hint at the existence of at least two main channels:


    +   - **Data brokers or data management platforms** Companies that sell data gathered
    from telecom companies, credit card issuers, online stores, local businesses,
    and many more sources.

    - **Research studies and surveys** It seems that GP reaches out to the population
    somehow to send out questionnaires and collect opinions.


    Although GP’s main website barely mentions advertising as a way to reach the public,
    PDF documents abound with references to a particular advertising platform with
    tremendous reach, both on social and traditional media websites. There’s no straight
    link to this advertising platform, but thanks to these selfsame social media websites
    they are so fond of, we dig out the retweet shown in Figure 4-2 from Jenny, VP
    of marketing at GP according to her Twitter profile.


    ![](img/961e81aef23040d0fbe348f58c055860_67_0.png)


    *Figure 4-2: A revealing GP retweet*'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'The link in the tweet innocuously points to an online advertising agency: MXR
    Ads. They deliver ads on all kinds of websites, charge per thousand impressions
    (CPM), and go quietly about their business of increasing the internet’s load time.


    Short of this excited tweet by Jenny of GP, there is not a single visible link
    between the two companies; there’s barely even a backlink on Google. So what’s
    the connection? We quickly solve this mystery by consulting the legal records
    of the two companies on https://opencorporates.com/, a database of companies worldwide
    and an excellent resource for digging out old company filings, shareholder lists,
    related entities, and so on. It turns out that MXR Ads and Gretsch Politico share
    most of the same directors and officers—hell, they even shared the same address
    a couple of years back.


    This kind of intertwined connection can be very profitable for both companies.
    MXR Ads gathers raw data about people’s engagement with a type of product or brand.
    They know, for example, that the person bearing the cookie 83bdfd57a5e likes guns
    and hunting. They transfer this raw data to Gretsch Politico, who analyze it and
    group it into a data segment of similar profiles labeled “people who like guns.”
    GP can then design creatives and videos to convince the population labeled “people
    who like guns” that their right to gun ownership is threatened unless they vote
    for the right candidate. GP’s client, who is running for office in some capacity,
    is pleased and starts dreaming about champagne bubble baths at the Capitol, while
    GP pushes these ads on every media platform with a functioning website. Of course,
    MXR Ads receives its share of creatives to distribute on its network as well,
    thus completing the self-feeding ouroboros of profit and desperation. Chilling.


    From this close connection we can reasonably suspect that pwning either MXR Ads
    or GP could prove fatal to both companies. Their sharing of data implies some
    link or connection that we can exploit to bounce from one to the other. Our potential
    attack surface just expanded.


    Now that we have a first, though very speculative, knowledge of the company’s
    modus operandi, we can set out to answer some interesting questions:


    +   - How precise are these data segments? Are they casting a large net targeting,
    say, all 18- to 50-year-olds, or can they drill down to a person''s most intimate
    habits?

    - Who are GP''s clients? Not the pretty ponies they advertise on their slides,
    like health organizations trying to spread vaccines, but the ugly toads they bury
    in their databases.

    - And finally, what do these creatives and ads look like? It might seem like a
    trivial question, but since they''re supposedly customized to each target population,
    it is hard to have any level of transparency and accountability.


    NOTE Zeynep Tufekci has a great TED talk called “We’re Building a Dystopia Just
    to Make People Click on Ads” about the dystopian reality encouraged by online
    ads.'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'In the next few chapters we’ll attempt to answer these questions. The agenda
    is pretty ambitious, so I hope you are as excited as I am to dive into this strange
    world of data harvesting and deceit.


    # Scouring GitHub


    A recurrent leitmotif in almost every presentation of Gretsch Politico and MXR
    Ads’ methodology is their investment in research and design and their proprietary
    machine learning algorithms. Such technology-oriented companies will likely have
    some source code published in public repositories for various purposes, such as
    minor contributions to the open source world used as bait to fish for talent,
    partial documentation of some API, code samples, and so on. We might just find
    some material that contains an overlooked password or sensitive link to their
    management platform. Fingers crossed!


    Searching public repositories on GitHub is rather easy; you don’t even need to
    register for a free account. Simply proceed to look for keywords like “Gretsch
    Politico” and “MXR Ads.” Figure 4-3 shows the results when we search for MXR Ads’
    repository.


    ![](img/961e81aef23040d0fbe348f58c055860_69_0.png)


    *Figure 4-3: The MXR Ads GitHub repository*


    A single company with 159 public repositories? That seems like a lot. After a
    cursory inspection, it’s clear only half a dozen of these repos actually belong
    to either MXR Ads or one of their employees. The rest are simply forks (copied
    repositories) that happen to mention MXR Ads—for instance, in ad-blocking lists.
    These forked repositories provide little to no value, so we’ll focus on those
    half a dozen original repos. Luckily, GitHub offers some patterns to weed out
    unwanted output. Using the two search prefixes org: and repo:, we can limit the
    scope of the results to the handful of accounts and repositories we decide are
    relevant.


    We start looking for hardcoded secrets, like SQL passwords, AWS access keys, Google
    Cloud private keys, API tokens, and test accounts on the company’s advertising
    platform. Basically, we want anything that might grant us our first beloved access.


    We enter these queries in the GitHub search and see what we get:


    ```

    # Sample of Github queries


    org:mxrAds  password

    org:mxrAds  aws_secret_access_key

    org:mxrAds  aws_key

    ```'
