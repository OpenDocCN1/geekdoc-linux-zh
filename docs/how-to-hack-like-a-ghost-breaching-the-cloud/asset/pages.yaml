- pgno: 135
  md: "Excellent, we can reach the Nginx container from within the cluster. With me\
    \ so far? Great.\n\n# Opening the App to the World\n\nUp until this point, our\
    \ application is still closed to the outside world. Only internal pods and nodes\
    \ know how to contact the cluster IP or directly reach the pods. Our computer\
    \ sitting on a different network does not have the necessary routing information\
    \ to reach any of the resources we just created. The last step in this crash tutorial\
    \ is to make this service callable from the outside world using a NodePort. This\
    \ object exposes a port on every node of the cluster that will randomly point\
    \ to one of the two pods we created (we'll go into this a bit more later). We\
    \ preserve the resilience feature even for external access.\n\nWe add type: NodePort\
    \ to the previous service definition in the manifest file:\n\n```\n```yaml\napiVersion:\
    \ v1\n--snip--\n  selector:\n    app: myapp # Target pods with the selector \"\
    app:myapp\"\n  type: NodePort\n  ports:\n--snip--\n```\n```\n\nThen we resubmit\
    \ the service manifest once more:\n\n```\n```bash\nroot@DemLab:/# kubectl apply\
    \ -f service_myapp.yaml\nservice/myapp configured\n\nroot@DemLab:/# kubectl get\
    \ svc myapp\nNAME      TYPE       CLUSTER-IP       EXTERNAL-IP   PORT(S)\nmyapp\
    \     NodePort   10.100.166.225   <none>        80:31357/TCP\n```\n```\n\nAny\
    \ request to the external IP of any node on port 31357 will reach one of the two\
    \ Nginx pods at random. Here's a quick test:\n\n```\n```bash\nroot@AnotherMachine:/#\
    \ curl 54.229.80.211:31357\n<h1>Listening on port 8080</h1>\n```\n```\n\nPhew\
    \ . . . all done. We could also add another layer of networking by creating a\
    \ load balancer to expose more common ports like 443 and 80 that will route traffic\
    \ to this node port, but let's just stop here for now.\n\n# Kube Under the Hood\n\
    \nWe have a resilient, loosely load-balanced, containerized application running\
    \ somewhere. Now to the fun part. Let's deconstruct what just happened and uncover\
    \ the dirty secrets that every online tutorial seems to hastily slip under the\
    \ rug."
