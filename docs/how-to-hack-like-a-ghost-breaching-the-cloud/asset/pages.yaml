- pgno: 75
  md: '# Listing 4-1: Enumerating domains with sublist3r


    We’ve found 12 subdomains, so that’s encouraging. I bet we’d have even more luck
    with mxrads.com. They are, after all, a media company. However, it can get boring
    to use the same tools and methods repeatedly. For the mxrads.com domain, let’s
    use a different tool to perform a classic brute-force attack using well-known
    subdomain keywords like staging.mxrads.com, help.mxrads.com, dev.mxrads.com, and
    so on. There are a few tools we can choose from for the job.


    Amass (https://github.com/OWASP/Amass/) from the Open Web Application Security
    Project (OWASP) is written in Golang and cleverly uses goroutines to parallelize
    the load of DNS queries. Whereas most other Python tools rely on the system’s
    DNS resolver to retrieve domains by calling functions like socket.gethostname,
    Amass crafts DNS queries from scratch and sends them to various DNS servers, thus
    avoiding the bottleneck caused by using the same local resolver. However, Amass
    is bloated with so many other colorful features, like visualizations and 3D graphs,
    that it may feel like wielding a 10-pound hammer to scratch an itch on your back.
    Tempting, but there are lighter alternatives.


    A less mediatized yet very powerful tool that I highly recommend is Fernmelder
    (https://github.com/stealth/fernmelder/). It’s written in C, is barely a few hundred
    lines of code, and is probably the most efficient DNS brute-forcer I have tried
    lately. Fernmelder takes two inputs: a list of candidate DNS names and the IPs
    of DNS resolvers to use. This is what we’ll use.


    First, we create our list of possible DNS names using some awk magic applied to
    a public subdomain wordlist, as shown in Listing 4-2. Daniel Miessler’s SecLists
    is a good start, for instance: https://github.com/danielmiessler/SecLists/


    ```

    root@Point1:~/# awk ''{print $1".mxrads.com"}'' top-10000.txt > sub_mxrads.txt

    root@Point1:~/# head sub_mxrads.txt

    test.mxrads.com

    demo.mxrads.com

    video.mxrads.com

    --snip--

    ```


    # Listing 4-2: Creating a list of potential MXR Ads subdomains


    This gives us a few thousand potential subdomain candidates to try. As for the
    second input, you can borrow the DNS resolvers found at the Fernmelder repo, as
    shown in Listing 4-3.


    ```

    root@Point1:~/# git clone https://github.com/stealth/fernmelder

    root@Point1:~fern/# make


    root@Point1:~fern/#cat sub_mxr.txt | ./fernmelder -4 -N 1.1.1.1 \

    -N 8.8.8.8 \

    -N 64.6.64.6 \

    ```'
