    Instead of retrieving the same result time and time again from the database and
    needlessly incurring the expensive cost of network latency, the ads-rtb container
    keeps previous database results (strings, objects, and so forth) in its local
    Redis container cache. Should the same request present itself later, it fetches
    the corresponding result almost instantly from Redis.


    This form of caching was probably hailed as a fantastic idea during the initial
    application design, but it involves a dangerous and often overlooked operation:
    deserialization.


    # Deserialization


    When a Java object (or object from almost any high-level language for that matter,
    like Python, C#, and so forth) is deserialized, it is transformed back from a
    stream of bytes into a series of attributes that populate a real Java object.
    This process is usually carried out by the readObject method of the target class.


    Here''s a quick example showing what might be going on inside ads-rtb. Somewhere
    in the code, the application loads an array of bytes from the Redis cache and
    initializes an input stream:


    ```

    // Retrieve serialized object from Redis

    byte[] data = FetchDataFromRedis()

    // Create an input stream

    ByteArrayInputStream bis = new ByteArrayInputStream(data);

    ```


    Next, this series of bytes is consumed by the ObjectInputStream class, which implements
    the readObject method. This method extracts the class, its signature, and static
    and nonstatic attributes, effectively transforming a series of bytes into a real
    Java object:


    ```

    // Create a generic Java object from the stream

    ObjectInputStream ois = new ObjectInputStream(bis);


    // Calling readObject of the bidRequest class to format/prepare the raw data

    BidRequest objectFromRedis = (BidRequest)ois.readObject();

    ```


    Here''s where we may find an in. We did not call the default readObject method
    of the ObjectInputStream but instead called a custom readObject method defined
    in the target class BidRequest.


    This custom readObject method can pretty much do anything with the data it receives.
    In this next boring scenario, it just lowers the case of an'
