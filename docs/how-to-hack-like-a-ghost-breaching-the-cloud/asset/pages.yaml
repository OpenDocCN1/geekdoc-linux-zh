- pgno: 142
  md: 'With our new knowledge, these environment variables take on a new meaning:
    KUBERNETES_PORT_443_TCP must refer to the cluster IP hiding the API server, the
    famous Kube orchestrator. The documentation states that the API follows the OpenAPI
    standard, so we can target the default /api route using the infamous curl utility.
    The -L switch in curl follows HTTP redirections, while the -k switch ignores SSL
    certificate warnings. We give it a go in Listing 8-1.


    ```

    shell> curl -Lk https://10.100.0.1/api


    message: forbidden: User "system:anonymous" cannot get path "/api",

    reason: Forbidden

    ```


    *Listing 8-1: Attempting to access the default /api route on the API server*


    Ah, we’re locked out. The response we get is all but surprising. Starting from
    version 1.8, Kubernetes released a stable version of role-based access control
    (RBAC), a security model that locks access to the API server to unauthorized users.
    Even the “insecure” API listening on port 8080 is restricted to the localhost
    address:


    ```

    shell> curl -L http://10.100.0.1:8080

    (timeout)

    ```


    To see if we can get around this, we’ll take a closer look at the Kubernetes RBAC
    system.


    # RBAC in Kube


    Kubernetes RBAC follows a pretty standard implementation. Admins can create user
    accounts for human operators or service accounts that can be assigned to pods.
    Each user or service account is further bound to a role holding particular privileges—get,
    list, change, and so on—over resources such as pods, nodes, and secrets. The association
    between a subject (user or service account) and a role is called a binding.


    > NOTE  A secret in Kubernetes is a piece of sensitive data stored in the etcd
    database and subject to access control. It provides an alternative to hardcoding
    passwords in the pod’s manifest. The secret is injected at runtime through environment
    variables or a mounted filesystem.


    Just like any other Kube resource, service accounts, roles, and their bindings
    are defined in manifest files stored in the etcd database. A service account definition
    looks something like Listing 8-2.


    ```

    # define a service account


    apiVersion: v1

    kind: ServiceAccount  # deploy a service account

    ```'
