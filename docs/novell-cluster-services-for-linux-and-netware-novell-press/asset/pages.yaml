- img_proc: true
  md: '# Upgrading a NetWare 6.5 Cluster to Open Enterprise Server Linux


    The upgrade procedure described in this section will always be an upgrade to new
    servers and not an in-place upgrade. The difference from the first upgrade described
    in this chapter, migrating to a new cluster, is in the scenario described here
    the cluster remains intact, the Linux nodes are attached to the same shared storage,
    and in most cases service to your users will not be interrupted. The migration
    scenario requires you to build a new cluster and move your data and applications
    to the new cluster. The migration scenario is supported for all versions of NetWare
    and even Windows and can also be used to build a cluster with the data and applications
    from a standalone server. The upgrade described here is supported only for clusters
    running NetWare 6.5.


    TIP

    Starting with Open Enterprise Server Linux Support Pack 2, this procedure also
    works for NetWare 6.0 clusters.


    The upgrade path that we will walk you through this section is that of extending
    the NetWare cluster with Linux nodes, which creates a mixed cluster. We will then
    later remove the NetWare nodes, leaving you with a Linux-only cluster.


    # THINGS YOU SHOULD KNOW ABOUT A MIXED-CLUSTER ENVIRONMENT


    When you start with a NetWare cluster and add a Linux server, we call that cluster
    a mixed cluster. Such a cluster runs fine. The two operating systems can coexist,
    and cluster resources can be migrated from NetWare to Linux and vice versa. That
    sounds like a great solution for environments where some applications would perform
    better on NetWare and others on Linux. It gives you the flexibility to have many
    applications available on the entire cluster, such as data, but a cluster, however,
    has some limitations that we explain here. After you''ve read them, we hope you
    agree with us that running a mixed cluster is not a permanent solution. The limitations
    are:


    +   - After you''ve added a Linux node to a NetWare cluster, it is no longer possible
    to add new NetWare nodes. Only Linux nodes can be added.

    - In a mixed environment you cannot add storage to the cluster or modify the existing
    storage pools. There is a workaround to create storage on NetWare with the Linux
    servers turned off in which they will identify new storage after the upgrade,
    but that really is not practical for normal operation.'
  merge: -1
  pgno: 253
- img_proc: true
  md: '# Technical Upgrade Methods Explained


    +   - File-system trustee assignments are calculated for NSS access via NCP the
    first time a volume is migrated to Linux. On Linux trustees are stored in an XML
    file on the volume. When rights are modified on NetWare, the Linux server will
    not automatically detect these changes in its XML file and vice versa. (There
    is a command for) moving storage around from operating system to operating system
    is not something to work with in a highly active environment.


    +   - Not all applications can seamlessly migrate from NetWare to Linux. They
    need to be modified to run on Linux and must stay there after the conversion.
    Examples are GroupWise and iFolder 2.


    +   - Cluster resource scripts will automatically be translated from NetWare commands
    to Linux commands. When a resource is created on a Linux node in a mixed cluster,
    the resource will not run on a NetWare node.


    From the preceding information you can decide for yourself whether you want to
    work with this. We strongly advise you to work with this mixed-cluster scenario
    only for the time it takes to upgrade to Linux. During time the cluster is in
    a mixed mode, we suggest that you keep the configuration state. It should be a
    period during which no new applications will be added to the cluster and a clear
    project is defined to migrate the environment to Linux servers.


    # ROLLING CLUSTER UPGRADADES


    The online documentation for Novell Cluster Services for Linux describes an upgrade
    path called a rolling upgrade. This approach is to remove a NetWare server from
    the existing cluster and remove it from the eDirectory environment and install
    Linux on the same hardware. The Open Enterprise Linux server is then added to
    the NetWare cluster, and this process is repeated, until all cluster nodes are
    upgraded.


    The technical approach we use in this section is identical to that procedure,
    except that we do not start with deleting NetWare nodes, we start with adding
    new Linux servers. Especially for smaller environments, this might be a better
    approach, depending on the hardware requirements for the new cluster environment.
    With only two or three nodes, the level of fault tolerance could fall below an
    acceptable limit.


    If you do not plan to buy new server hardware for your cluster and the hardware
    being used to run NetWare can be used for running Linux, you could also perform
    a rolling upgrade. In that case you start by deleting a NetWare node first and
    then start with our first step: installing the first Open Enterprise Linux server
    into your cluster.


    In both scenarios the cluster effectively remains available to your end users
    and service is not interrupted.'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# CHAPTER 10: Upgrading Clusters


    # PREPARATIONS AND SYSTEM REQUIREMENTS


    Before adding cluster nodes to an existing NetWare cluster, you must meet the
    system requirements and perform some preparatory steps. All cluster nodes must
    be the same version of NetWare 6 or NetWare 6.5. The new Linux servers that will
    be added to the cluster must be fully configured and added to the tree. They must
    also have the software packages installed for Novell Storage Services and Novell
    Cluster Services. The installation of these components is discussed in detail
    in Chapter 4, "Installation and Configuration."


    Another requirement is that the new Linux nodes have access to the shared storage,
    either through the Storage Area Network (SAN) or via iSCSI. If the latter is the
    case, also make sure all iSCSI connections are running before starting the cluster
    services configuration. How to configure iSCSI is described in Chapter 7, "iSCSI."


    # ADDING THE FIRST LINUX NODE TO THE NETWARE CLUSTER


    As described, it is also possible to remove a NetWare node from the cluster and
    reuse hardware for this first server. Whatever method you choose, the steps are
    the same, and we have decided to add a Linux node to the cluster. This procedure
    is also described in Chapter 4, but we will give you the short walkthrough here.
    We expect that at this point the new cluster node is part of the tree, with NSS
    and NCS installed, and has access to the shared storage.


    Perform the following steps to add the server to the cluster:


    +   1. On the Linux server start YaST.

    2. In the System category select Novell Cluster Services.

    3. When prompted to configure NSS, if you have not already done that previously
    on this server, select Yes to configure that component too. It is a mandatory
    component to be installed on an NCS cluster server.

    4. When prompted, enter the credentials for the administrative user.

    5. Enter the fully distinguished name of the cluster where this node will be added.

    6. The IP address of this node will be displayed. Typically, this will be the
    primary IP address, unless more than one interface is configured. Select the address
    from the subnet where the other cluster nodes are.'
  merge: -1
  pgno: 255
- img_proc: true
  md: '# Technical Upgrade Methods Explained


    # NOTE


    You can reuse the IP address of a removed NetWare node, but in that case upgrade
    one node at a time.


    +   7. Leave the check box to Start Clustering Service Now enabled and click Next.


    The new node will now join the cluster. When the configuration is finished, the
    configuration utility will be closed automatically and you will be returned to
    YaST. Open a terminal window on the Linux server and execute the `cluster view`
    command (root or other superuser) to check that the new node is online in the
    cluster. You can also execute the `sdbutil -v` command to check that the new node
    has been added to the cluster. This command is equivalent to the SBD VIEW ALL
    command on NetWare.


    At this point you can either add new Linux nodes to the cluster or first remove
    one of your NetWare nodes. It depends on your upgrade scenario which you choose
    or order, as long as you keep in mind that you need to provide fault tolerance
    and high availability to your end users.


    # REMOVING AN OES NETWARE NODE FROM THE CLUSTER


    There is no fully automatic procedure for removing a node from a Cluster. It is
    as simple as deleting the cluster object after disabling the cluster software.


    Although leaving the cluster would automatically migrate any resources to other
    nodes, we advise you to migrate the resources manually. This gives you the choice
    and to watch the process more closely, resource by resource, which is harder when
    everything happens automatically at the server. Perform the following steps to
    remove a node from the cluster:


    +   1. On the NetWare server console, type cluster leave.

    2. Execute LDNCS to unload Novell Cluster Services.

    3. In iManager open the eDirectory Administration task and select to delete an
    object. Browse to the cluster container and delete the cluster node object of
    this.


    # TIP


    If you have problems removing the object from iManager, log in to iMonitor for
    your server and click the iMonitor logo at the upper-left corner. In the configuration
    screen that appears you can now enable the advanced mode. Browse to the object
    in iMonitor, and in the left panel you''ll see an extra Advanced Menu option,
    which allows you to delete the object.


    +   4. Remove the command that loads Cluster Services (LDNCS) from AUTEXEC. NCF.'
  merge: -1
  pgno: 256
- img_proc: true
  md: 'At this point you can decide what to do with this server. If you are reusing
    the hardware to install another Linux node on the same box, you can leave the
    server attached to the shared storage and start the Linux installation. Otherwise,
    if the server will be reused as a NetWare server in the same EDirectory environment,
    disconnect the server from the shared storage, and reboot the server.


    You now can add other Linux nodes to the cluster or, when you have removed the
    last NetWare cluster node, go to the next section to finish the cluster upgrade.


    # FINALIZING THE NETWARE-TO-LINUX CLUSTER UPGRADE


    When all NetWare nodes are removed from the cluster and only Linux nodes are left,
    it is time to clean up and convert the cluster to a real Linux-only cluster.


    During the period that the cluster is in mixed mode, the resource load and unload
    scripts are stored in the directory /etc/opt/novel/ncs. When changes are mode
    to the resource scripts, these files are automatically updated. When all NetWare
    cluster nodes have been removed, the Linux load and unload scripts can be moved
    to the corresponding EDirectory objects.


    To finalize the cluster upgrade, follow these steps:


    +   1. Run cluster convert preview resource_name at the server console of one
    Linux cluster node. Replace resource_name with the name of a resource that you
    want to view. This will show you what modifications will be made to the resource
    scripts. The preview command can work only with individual resources.

    2. Run cluster convert commit at the server console of one Linux cluster node
    to finalize the conversion. This will convert all resources in the cluster.


    The cluster container contains only one legacy set of objects: the NetWare cluster
    resource template objects. When you''re installing a new Linux cluster, these
    templates will have been generated for you, but when you''re adding Linux nodes
    to a NetWare cluster, the old templates remain intact.


    You can create the Linux-specific cluster resource templates by executing the
    following command on your Linux nodes:

    /opt/novel/ncs/bin/ncs-config.py -install_templates


    In addition to generating Linux cluster resource templates, this command deletes
    all NetWare cluster resource templates. Because of this, use this command only
    after all nodes in the former NetWare cluster are converted to Linux.'
  merge: -1
  pgno: 257
- img_proc: true
  md: '# Technical Upgrade Methods Explained


    Now that the entire cluster is upgraded, all applications can be upgraded to run
    in the new Linux environment.


    # Migrating to a New Cluster


    All upgrade methods explained to this point were in-place upgrades and the mixed-mode
    upgrade in which data also remained in place in eDirectory (cluster configuration)
    and on the file system (files and rights). Sometimes it is not possible or wanted
    to perform an in-place upgrade. In those cases there is always the possibility
    to use a migration method to move your environment to new servers and to a new
    cluster.


    The methods available for migrating servers to a cluster are not much different
    from those for migrating a single server. There are a few extra steps in a clustered
    environment that we will discuss with each available method.


    # NOVEL SERVER CONSOLIDATION AND MIGRATION TOOLKIT


    Starting with Open Enterprise Server, Novell has bundled two migration utilities
    into one toolkit. The first utility already exists as the Migration Wizard, and
    the other is called the Server Consolidation Utility. The first is not really
    usable in a clustered environment. It can be used to upgrade the hardware of a
    server with which the server on the new hardware keeps the same identity throughout
    the eDirectory environment.


    # NOTE


    The Migration Wizard replaces one server with another server, whereas the Server
    Consolidation Utility replaces one or more source servers with one or more destination
    servers.


    # TIP


    Both utilities are available for all versions of NetWare and can also be used
    for servers that are of the same version, such as NetWare 6.5 to NetWare 6.5.
    The toolkit also supports migrations from Windows to NetWare and OES Linux.


    This is important for security components, user home directories, and so forth
    that to a NCP server object. And there are server applications and may scripts
    or control files that point to that specific server. All of this is not issue
    with a cluster in general these configurations will point to a cluster virtual
    server. To upgrade to new hardware, it is simple to remove the old server from
    the cluster and install the new server into the cluster as a cluster node. You
    probably want to do it in that order because of cluster licenses that allow only
    a maximum number of nodes in your cluster.'
  merge: -1
  pgno: 258
- img_proc: true
  md: "# CHAPTER 10: Upgrading Clusters\n\nThere can, however, also be scenarios in\
    \ which you want to replace an entire cluster. Or you want to consolidate existing\
    \ servers into a cluster. Performing such a migration is not as simple as just\
    \ copying the data. In a networking environment there are at least the following\
    \ configuration items that also need to be copied or modified:\n\n+   - File-system\
    \ rights\n- Disk and directory quotas\n- User home directories\n- Login scripts,\
    \ batch files, and such\n- Application references, including UNC paths\n\nThe\
    \ utilities Novell delivers for migrations do not offer support for all of these\
    \ configurations to be copied or changed. The Migration Wizard is the most complete\
    \ because it places the new server in the identity of the old one, which keeps\
