  md: '# Creating Cluster Resources


    Now that the Novell Cluster Services (NCS) software has been installed on your
    server, it is time to move on and create some clustered resources. In this chapter
    you''ll learn about the basics of cluster resource creation. Chapter 8, “Installing
    Cluster-Enabled Applications,” provides in-depth information about clustering
    of some specific applications.


    # Creating Clustered Volumes


    In many cases clustered resources need clustered volumes. The reason for this
    is obvious: the clustered resource often needs to write data to a volume. If this
    is a local volume and the resource fails over to another server in the cluster
    because of a hardware failure, the resource wouldn''t be capable of contacting
    its data. Therefore, a solution has to be provided to make the data available
    to the clustered resource, even if after a hardware failure the resource has failed
    over to another node in the cluster. The best way to handle this is by clustering
    volume objects. If you are working on an Open Enterprise Server (OES) NetWare
    cluster, these have to be Novell Storage Services (NSS) volumes. In an OES Linux
    environment, Reiser and ext3 volumes can be shared on the cluster as well. If,
    however, a NetWare cluster has to be migrated to a Linux cluster, only NSS volumes
    can be used on the Linux node. This is true for a mixed-node cluster as well.'
  merge: -1
  pgno: 92
- img_proc: true
  md: '# CHAPTER 5: Creating Cluster Resources


    TIP


    Novell''s NSS file system offers some advantages that other Linux file systems
    don''t offer. For example, NSS allows you to work with the advanced Novelli rights
    system, which isn''t available on other Linux file systems. If the advanced NSS
    features are not needed in your environment, better use Reiser as the file system
    for your clustered volume. The advantage is that Reiser has less metadata to write
    when writing files and therefore is faster on file writes. Both Reiser and NSS
    are capable of handling large numbers of small files in one directory. Ext3 is
    not a good choice for handling large numbers of small files.Therefore, use NSS
    when the special NSS features are needed, and if they are not used, use Reiser
    instead.


    # Creating Cluster Volumes on OES Linux and NetWare


    After setting up the cluster, the first step to take is to set up the clustered
    volumes. This procedure involves three main steps:


    +   1. Create shared disk partitions

    2. Create NSS pools

    3. Create clustered volume objects


    The following procedure describes all necessary steps. The procedure is applicable
    to NetWare as well as Linux. Any differences between the operating systems are
    marked as such.


    # CREATE SHARED DISK PARTITIONS


    Before shared disk partitions can be created, Novell Cluster Services must be
    installed. After installation of Novell Cluster Services, you can set up the shared
    disk partitions with different tools: iManager, Remote Manager, and the NSSMMU
    tool. It doesn''t matter which of tools you use because they all lead to the same
    result. However, if you are configuring cluster volume objects on Linux, be aware
    that MNtnager cannot be used.


    In the following procedure you will read how to set up a shared disk partition
    with the NSSMMU utility, which can be used from the OES NetWare as well as the
    OES Linux console. This procedure assumes that some kind of shared storage system
    already is available. If you don''t have a system for shared storage in your environment,
    read Chapter 7, “iSCSI,” for more information on how to install an iSCSI shared
    storage system. If the shared storage system is available, apply the following
    steps to create a cluster volume object:


    +   1. On the server console of any server in the cluster, start the NSSMMU utility
    by typing nssmu.

    2. Select the Devices option and press Enter to check whether the shared disk
    device you need in order to set up NCS is already configured. In Figure 5.1 you
    can see what this looks like.'
