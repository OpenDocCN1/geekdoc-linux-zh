  md: '# CHAPTER 10: Upgrading Clusters


    The import command for this new LDIF file is the following:

    ice -S LDIF -f c:\temp\userhomedir.ldif -D LDAP -s 192.168.1.101 -p 636

    -> cn=admin,o=oes -w novel -L D:\public\rootcert.der


    The command is constructed in the same way as the export command, except that
    we now use LDIF as the source and LDAP as the destination. In addition, we do
    not have to specify any search parameters because the full distinguished names
    are in the LDIF file.


    NOTE

    Before modifying the home directories, make sure that the files and trustees are
    also in place. Otherwise, your users will experience problems during the login
    process.


    User home directories are a very common configuration item in many NetWare environments.
    That is the reason we described how to modify them in depth. There could be many
    more items that need to be modified, ranging from login scripts and batch files
    to ZENWORKS application objects that may contain UNC paths. If there are any other
    objects in eDirectory that contain a reference to the old server, there is a chance
    you can find them with the following export command:

    ice -S LDAP -s 10.0.0.1 -p 636 -d cn=admin,o=oes -w novel -F (objectclass=)

    ->a * -b o=oes -L D:\public\rootcert.der -D LDIF -f c:\allobjects.ldif


    If you search the exported file for the old server name, you might find all entries
    that still point to that server. There is no guarantee that you will find all
    references because some attributes are not exported though LDAP, such as login
    scripts.'
