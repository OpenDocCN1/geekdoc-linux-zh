  md: '# CHAPTER 2: Examining Novell Cluster Services Architecture


    # Cluster eDirectory Objects


    At the highest level, each cluster has a cluster container object in eDirectory.
    Within the cluster container object, cluster nodes, resources, and templates are
    created.


    # CLUSTER CONTAINERER


    This object is used for storage of all important configuration parameters of the
    cluster. All of these parameters are clusterwide settings that need to be set
    only once. The most important of these parameters are included in the following
    list. Consult Chapter 6, "Cluster Management," for more details about these parameters:


    +   - Quorum Trigger: This parameter specifies the number of nodes that must be
    active in the cluster before any cluster resources can be started. This number
    is also referred to as the quorum membership.


    +   - Heartbeat Settings: In a clustered environment, nodes need to communicate
    with each other. Without this communication, it would be impossible to find out
    whether a node has left the cluster. This communication takes place by means of
    the heartbeat protocol: By default, all servers send a heartbeat packet once a
    second. Within a period of eight seconds a node has not been heard from, it will
    be cast out of the cluster.


    +   - Cluster Management Port: This is an automatically assigned port address,
    used for management of the cluster.


    # CLUSTER NODE


    Every physical servers that is a member of the cluster is eDirectory as a cluster
    node object, which is shown in Figure 2.1. This eDirectory stores the node number
    and its IP address. This object is also used by eDirectory to create an alias
    to the NetWare Core Protocol (NCP) server object it.


    # CLUSTER RESOURCE


    All applications in the cluster are represented by cluster resource objects. These
    cluster resource objects contain all important information about the resource
    as an eDirectory property. The most important properties of the cluster resource
    are listed here:


    +   - Load scripts: These determine how the resource will be loaded. These load
    scripts are written as bash scripts. All resources have a cluster load script.


    +   - Unload scripts: In the unload script, the cluster resource is terminated
    properly. In the cluster resource load script, it is particularly important that
    other modules on which the resource depends are unloaded properly as well. Load
    scripts as well as unload scripts are discussed in Chapter 5, "Creating Cluster
    Resources."'
  merge: -1
