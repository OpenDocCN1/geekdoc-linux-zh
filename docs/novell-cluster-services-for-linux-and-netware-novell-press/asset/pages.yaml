    # Syncsort Backup Express


    When selecting a third-party backup solution for our book, we investigated many
    products and vendors. Our selection was Syncsort''s Backup Express for a number
    of reasons:


    +   - Syncsort is a well-known partner of Novell and works closely with it to
    develop its software. Backup Express therefore works with NetWare and Open Enterprise
    Server NetWare and Linux well.


    +   - Backup Express is the only software that comes up in a search for the keyword
    "cluster" in the database of Novell''s "Yes, Tested and Approved" program. You
    can check for yourself what the status is of this software and of other vendors
    at the URL: http://developer.novell.com/mss. Check for backup software under the
    category Backup/Restoration.


    In this section we describe the architecture of Syncsort Backup Express and how
    to get started with the software on Open Enterprise Server NetWare and Linux.


    # SYNCSORT BACKUP EXPRESS FEATURE OVERVIEW


    Like every backup software, one performs the basic operation you need: to be able
    to store your data in a safe place in case something happens to the original data.
    But there are a Lot of differences between backup software applications, in manageability,
    in supported hardware and software, just in features. Here is a list of Backup
    Express features that we think are important for OES administrators:


    +   - Availability for UNIX/Linux, NetWare, and Windows. This gives you the flexibility
    to back up many platforms with one solution from central location.


    +   - Support for clusters in Windows environments and for Open Enterprise Server
    Linux and NetWare. It also supports mixed-cluster environments.


    +   - Support for Directory and GroupWise databases through special database interfaces.


    +   - Support for NSS Snapshot technology. This enables you to make consistent
    backups in an environment with open files.


    +   - A storage area network (SAN) resource sharing option. This allows the software
    to attach tape devices to any server in the Backup Express environment.'
  merge: -1
  pgno: 234
- img_proc: true
  md: '+   Support for NDMP (Network Data Management Protocol) for backup to network
    attached storage (NAS) devices that support this protocol.


    +   A centrally located catalog for enterprisewide backup control.


    +   Browser-based management without the need to install a client application
    on a work-station.


    For the purpose of our book, the most important feature is that Backup Express
    natively supports Open Enterprise Server clusters, not only in a pure NetWare
    or Linux environment but also in a mixed-node environment. This allows organizations
    that work with a current version of Backup Express to migrate easily to an OES
    Linux environment. Support for OES clusters is available from version 2.35 of
    Backup Express. This is also the version that the material in this book is based
    on.


    # BACKUP EXPRESS ARCHITECTURE


    In a Backup Express environment there are three server roles that need to be present:


    +   Master server


    +   Device server


    +   Backup client


    FIGURE 9.6 shows these roles in a typical Backup Express environment.


    FIGURE 9.6


    The necessary and possible components of a Backup Express implementation.


    ![](img/0824e0f841046b33f07fbd84ce9da816_235_0.png)'
  merge: -1
  pgno: 235
- img_proc: true
  md: 'The **master server** can be either a Linux server or a Windows server. Its
    role is to initiate and control jobs. It contains the catalog. The master server
    also runs the web server that can be used to manage Backup Express from browser.
    This is the only way the backup system can be managed. The master server could
    be a cluster node, but we recommend that you use a separate server to play this
    role.


    The *device server* takes care of writing to tape. This server does not have to
    be a dedicated server. It can also be an existing backup client. There can be
    more than one device server in a Backup Express environment. This allows for faster
    overall backups because data can be stored on more than one device at the same
    time. Tape devices can be attached to this device via a SCSI connection, but they
    can also be attached to the storage area network through Fibre Channel. Backup
    Express also supports backups to a file system, which can be useful to test your
    backup solution or creating backups of smaller clusters to a central location.


    The *backup client* is a server where the Backup Express CMAGENT software is loaded
    to provide access to back up the data. The backup client can be NetWare, Linux,
    and Windows.


    # USING BACKUP EXPRESS IN A CLUSTER ENVIRONMENT


    The configuration described in the previous paragraphs is not different for a
    cluster than it is for standalone servers. In a cluster the same servers—master,
    device, and client—are needed. The only extra configuration step is to create
    virtual nodes that will be used to back up the cluster resources.


    The use of virtual nodes allows Backup Express to keep track of records to back
    up when they fail over to another node during the backup. In the Backup Express
    management utility you define backups for local file systems, such as the SYS
    volume, for the physical servers. The backup of cluster resource file systems
    is defined at the virtual nodes. Figure 9.7 shows an example of a cluster with
    two physical nodes and three cluster volumes, for of which a virtual node is created.
    The backup process of Backup Express runs through the standard Storage Management
    System SMDR and TSAs.


    # GETTING STARTED WITH BACKUP EXPRESS ON OES


    If the cluster is up and running and your tape device is attached to either a
    server or the SAN, the Backup Express software can be installed.


    On both OES NetWare and OES Linux the software is installed through the graphical
    interface. Before starting the installation, you must meet these requirements:


    +   - For the master server installation, make sure that you have the license
    key available for the product.

    - For the installation of other Backup Express servers, make sure that the master
    server is running.'
