    # Starting and Stopping Novell Cluster Services on Linux


    The main file to start Novell Cluster Services on Linux is /etc/init.d/novell-ncs.
    This startup script is created automatically on system installation. Normally,
    it is called from the system startup procedure, but if for whatever reason you
    need to start and stop all Novell Cluster Services-related modules, you can run
    the script from the command line. The command you need is /etc/init.d/novell-ncs
    to stop it, or /etc/init.d/novell-ncs start to start it. Be aware that before
    stopping Cluster Services, you should issue the cluster leave to leave the cluster.
    If you want to stop Cluster Services on all nodes, use the cluster down command
    before unloading the software.


    There is a symbolic link in /usr/sbin rnovell-ncs that can be used instead. So,
    as an alternative, you can type the short command rnovell-ncs stop or rnovell-ncs
    start.


    # NOTE


    On Linux, all services can be started with the so-called start script in the directory
    /etc/init.d. The way to use these scripts is by entering the name of the script,
    followed by start, stop, or restart. In some but not all cases, other options
    are supported as well. The disadvantage of this method is that the directory /etc/init.d
    is not in the search path of OES Linux service. Therefore, on OES Linux a symbolic
    link (let''s say a shortcut) has been created in the directory /usr/sbin/rnovell-ncs,
    which is in the search path. The name of this symbolic link includes the exact
    name as is in /etc/init.d, preceded by the letters rc. For example, /etc/init.d/novell-ncs
    would be /usr/sbin/rnovell-ncs. Using these symbolic links as commands makes it
    much convenient to start, stop, and restart a service. For example, the user does
    not need to use /etc/init.d/novell-ncs restart to restart the cluster service,
    but can just use rnovell-ncs no matter whatever currently is active.


    The rnovell-ncs command has some other options as well:


    +   - rnovell-ncs status: can be used to display the current status of the Novell
    Cluster Services support modules. It will show whether NCS is currently in use.

    - rnovell-ncs restart: Stops and starts the service.'
