  md: '# FIGURE 10.1

    Data can be copied from one cluster to another with the Server Consolidation Utility.


    ![](img/0824e0f841046b33f07fbd84ce9da816_260_0.png)


    # TIP


    When migrating to an OES Linux cluster, the source server might not be able to
    connect to the Storage Management Data Requester (SMDR) on the target server if
    that server is a cluster node. The project verification process will generate
    an error message if this problem occurs. In that case restart the SMDR daemon
    so that it loads the configuration of the virtual server and its resources. Execute
    this command to restart the daemon: /etc/init.d/novell-smdr restart.


    There are still a few items in your environment that will not be copied to the
    new servers, whether standalone or in a cluster—for example, user home directories
    that are not updated. The next section describes how simple tools can be used
    to update all necessary objects.


    # THE REAL WIZARDLY: POST MIGRATION TASKS


    Copying the data and file-system rights from one server to another is one thing;
    updating any references in your environment that may still point to your old server
    to the new server is a completely different thing.


    First of all, it is important to understand how these server references work.
    Your NetWare or OES Linux server is represented in eDirectory by an NCP server
    object. Other objects will contain attributes that point to that server object.
    Those attributes, also called properties, are not simple text fields that contain
    the server name; they are attributes of the type'
