  md: '# Installing iFolder 3 Software on All Nodes


    At this point the iFolder 3 software and optionally the iFolder 3 WebAccess software
    must be installed on each node in the cluster where the software will run. There
    is no need to bring the cluster resource where the volume and IP address online
    on the other nodes for this installation. Perform the following steps to install
    the software:


    +   1. Start YaST and from Software category select Install and Remove Software.

    2. From the Filter drop-down box choose Selections.

    3. In the Package Selection list select the iFolder 3 package and optionally the
    iFolder 3 Web Access package.

    4. Click Accept to start the software installation. Change CD-ROMs as needed to
    finish the installation.

    5. Go to the second and all other nodes and install the software.


    # Configuring iFolder 3 on the First Node


    When the software is installed, it is time to configure iFolder. We start with
    the first cluster node where the iFolder server resource is currently online and
    the IP address is also bound.


    Perform the following steps to configure iFolder on the first node:


