- img_proc: true
  md: '# High-Availability Solutions Overview


    In the preceding section we introduced you to Novell Cluster Services. While talking
    about that product, we have not covered the entire high-availability portfolio
    of Novell. We will cover the available solutions in this chapter and will also
    give you a sneak peek into the future of high-availability products.


    Before we go into the details of all these products, we would like to explain
    the difference between the types of clusters that are available. This term, "cluster,"
    is used for different types of clusters and they are not all the same. The cluster
    that we talk about in this book is what is generally called a high-availability
    cluster, or a failover cluster. If one node fails, another-node will take over
    its job. In a healthy cluster all nodes are running their own individual services.
    The other type of cluster comes in different names: high-performance clusters,
    load-balancing clusters, computational clusters, datacenter clusters, and so forth.
    What is different for these clusters compared to the ones we wrote in this book
    is that all servers in the cluster work together to deliver the same service and
    that share the load of running the service. The entire collection of machines
    works to run the application. If a node fails, there is no such as a failover.
    The service remains running on the nodes that are still alive, and there is absolutely
    no interruption for the application. An example of such cluster is the PolyServe
    Matrix Server, which we will discuss later in this section.


    So if these clusters are different and there is no failover or interruption to
    the end user, why we do not run all our applications on such a cluster? The answer
    comes in two parts. Part one is the software we generally run on Open Enterprise
    Server does not run on the operating systems that we use to build these types
    of clusters. They do not run GroupWise Post Office NetWare Loadable Modules (NLMs),
    for example. The second part of the answer is that these clusters are more expensive—not
    only because hardware and software have a different price tag, but also because
    the solution is more complex and requires a higher level of experience from the
    administrators.


    Having said all that, let''s take a look at the clustering solutions available
    today.


    # Novell Cluster Services


    This solution has already been discussed earlier in this chapter, but we would
    like to look at a few of the benefits of this solution to put it into perspective
    with the other products in this section.


    # MAINSTREAM HARDWARE


    One of the great benefits of NCS compared to other high-availability solutions
