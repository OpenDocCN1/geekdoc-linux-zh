    +   1. Make sure that the cluster resource is selected, as shown in Figure 6.2.


    +   2. After selecting the cluster object, click the Properties button to access
    the cluster proper-ties. This will show all generic properties for your cluster
    object on four different tabs.


    +   3. On the General tab, three kinds of properties are available, as shown in
    Figure 6.3:


    +   - When first, enter the unique IP address of the cluster and its port address.
    Change these when the IP address and port that you originally used must be changed.'
