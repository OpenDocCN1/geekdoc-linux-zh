  md: '# # Advanced iSCSI Topics


    In this section we will cover some additional iSCSI topics to make working with
    iSCSI in daily life easier and to help you fix any problems you might have.


    # ## Monitoring iSCSI Sessions


    Active iSCSI sessions can be listed on the local server on both NetWare and Linux,
    but the most comprehensive view is available from Remote Manager. We will first
    show you two examples of how to view the information locally for both targets
    and initiators. Next we will look into using Remote Manager.


    # ### STATUS INFORMATION FOR NETWARE i iSCSI TARGETS


    On the server console you can use the `iscsitar` command to retrieve information
    about the available targets and sessions with the following commands:


    ```

    iscsitar targets

    iscsitar sessions

    ```


    # ### STATUS INFORMATION FOR NETWARE iSCSI INITIATORS


    On a NetWare server that functions as an iSCSI initiator, you can use the `iscsinit`
    command to collect information. Use the command with the following syntax to retrieve
    information about active sessions with iSCSI targets:


    ```

    iscsinit info

    ```


    # ### STATUS INFORMATION FOR LINUX INITIATORS


    On Linux servers you can display statistical information with the `iscsi-ls` command.
    No parameters are needed. Just executing the command will display the session
    information for active connections:


    ```

    iscsi-ls

    ```


    Figure 7.14 shows an example of an iSCSI listing to a target on a NetWare server.


    # ## USING REMOTE MANAGER TO COLLECT SESSION INFORMATION


    For NetWare it is possible to collect information about active sessions for both
    the target and the initiator from Remote Manager. When you enable the advanced
    view, you can even see detailed information about network communications and iSCSI
    performance.'
