    # Summary


    If you need a cluster, Novell Business Continuity Cluster Services is a great
    solution; it allows you to create a cluster of clusters. In this chapter you read
    about the components BCC is made of and you created a simple BCC lab setup. Although
    it is simple, it involves a lot of steps to be performed. Nevertheless, after
    it works, BCC offers a great solution for optimized fault tolerance within large
    enterprise environments. Watch out for BCC version 1.1 because it will allow you
    to synchronize with OES Linux clusters.'
