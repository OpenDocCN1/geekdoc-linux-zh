    # Configuring the smb.conf File


    By default, the smb.conf file is read from /etc/samba/smb.conf. In a clustered
    environment, you should make sure that it is read from the shared storage device.
    Therefore, first you have to move it to the shared storage device, and then you
    have to make some modi-f to the contents of the smb.conf file that will be used
    by the cluster resource:


    +   1. Copy the /etc/samba/smb.conf file to the etc directory on your shared storage
    device. Rename it to reflect the name of the Samba cluster resource. For example,
    use mv smb.conf cluster_smb.conf to rename it. For the remainder of the procedure,
    we will refer to the smb.conf file for the Samba cluster resource as cluster_smb.conf.

    2. Open the cluster_smb.conf file with an editor and add the following lines to
    the [global] section:

    ```

    bind interfaces only = yes

    interfaces = cluster resource ip address

    pid directory = $SAMBA_ROOT/share/locks

    ```


    Of these lines, the first line will make sure that Samba connects to only the
    interfaces specified with the interfaces parameter set to the unique IP address
    you assign to the Samba cluster resource. Last, the pid directory setting will
    make sure that the PID files are created by the Samba server are written to a
    directory on the shared disk as. In this parameter, the SAMBA_ROOT variable is
    used; you will set this later when configuring the Samba cluster resource.


    +   3. Next, also in cluster_smb.conf, modify the line netbios name = %h-%w. Normally
    this line will use the name of your current host as the NetBIOS name for the Samba
    server. Because the Samba server will be a clustered resource, this doesn''t really
    make sense. Therefore, change it to something that is unique and recognizable
    for your Samba cluster resource. A name like SAMBACLUSTER would be a decent choice.


