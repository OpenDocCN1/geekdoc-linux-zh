- img_proc: true
  md: '# CHAPTER 5: Creating Cluster Resources


    you might be able to create clustered LVM volumes, but you might run into problems
    when using them in an operational environment because LVM isn''t really supported.
    In the procedure shortly, you will learn how to create an EVMS volume on your
    shared disk device and share it among the servers in your network. We will format
    this volume with the ext3 file system. In the next section, “Creating Clustered
    Resources,” you will learn how to use these volumes in a clustered environment.


    Using a volume manager in a clustered environment ensures that you can work on
    all nodes with the same volume names. It is, however, possible as well to create
    local device names for the clustered volume instead of working with the EVMS volume
    names. The disadvantage, though, of working with names like dev/sda is that it
    doesn''t guarantee that the same device name is used on all nodes in the cluster.
    This poses a serious problem in cluster load scripts in which the same device
    name for the volume has to be referred to on all nodes in the cluster.


    If you want to use a Linux file system in a clustered environment, you should
    think well before choosing the file system. Traditional file systems like ext3
    and Reiser can be used in a clustered environment, but they cannot be accessed
    by more than one node at the same time. If you want to create a clustered volume
    that is accessible by more than one cluster node at the time, you should use a
    file system that is designed for use in a clustered environment such as OCFSV2,
    GFS, or PolySver. NCS offers support for OCFSV2.


    The next procedure describes how to create an EVMS volume on one of the nodes
    in the cluster. It assumes that the shared storage device has already been set
    up properly. In this scenario, we describe how to create an EVMS volume that can
