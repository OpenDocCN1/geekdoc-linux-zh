  md: '# CHAPTER 8: Cluster-Enabled Applications


    # INSTALLING THE IMANAGER PLUG-INS


    To manage iFolder version 3, you must install the plug-ins for iManager. The iFolder
    manager-task is included by default for iFolder version 2 only. To install the
    module, log to iManager and go to the configuration panel. (This is with the administrator
    sitting behind his desk.) Under the Module Installation role you will find an
    entry named Available Novell-Plug-Modules. If you select this option, the iFolder
    3 plug-in will be listed and can be installed from here. When the plug-in is installed,
    restart Tomcat with the following command:


    ```

    /etc/init.d/novell-tomcat4 restart

    ```


    Allow Tomcat some time to restart and reload all its modules. If you try to access
    iManager too soon after reloading, error messages will appear. If you now log
    in to iManager, there will be a new Novell iFolder 3 task where you can manage
    your server.


    # CONFIGURING THE APACHE DAEMON


    At this point the Apache server must be stopped and the iFolder cluster resources
    must be migrated to the second node where iFolder must be configured. Also configure
    Apache to no longer start at startup. We will use the cluster software to take
    care of that.


    To stop Apache and prevent it from starting in the future at system boot, execute
    the commands on the first node:


    ```

    /etc/init.d/apache2 stop

    chkconfig apache2 off

    ```


    # Configuring the Cluster Resource


    With the software configured, the next step is to configure the load and unload
    scripts for the iFolder resource. In iManager under Cluster Options, make the
    Resource and Select properties to configure the scripts. Here is an example of
    our load script (we left out the comments for simplicity):


    +   - /opt/novell/ncs/lib/ncsfuncs

    exit_on_error mount -t reiphers /dev/evms/lvm/cluster1/ifolder /ifolder

    exit_on_error add_secondary_ipaddress 10.0.0.7

    exit_on_error /etc/init.d/apache2 start

    exit 0


    Here is an example of our unload script (we left out the comments for simplicity):


    +   - /opt/novell/ncs/lib/ncsfuncs

    ignore_error /etc/init.d/apache2 stop

    ignore_error del_secondary_ipaddress 10.0.0.7

    exit_on_error umount /ifolder

    exit 0'
  merge: -1
  pgno: 207
- img_proc: true
  md: '# Clustering iFolder 3 on OES Linux


    When you are using the unload script in this way, it will stop the entire Apache
    server. This means that other services use Apache will stop working. This could
    also include iManager for cluster management software runs in Tomcat, the HTTP
    traffic is handled by Apache. In such cases it is possible to leave Apache running
    and just stop the Mono processes of iFolder. To configure this, remove the line
    from the unload script that stops the apache daemon and replace it with these
    two lines that terminate the running mono processes:


    ```

    ignore_error mono /usr/lib/mono/1.0/mod-mono-server.exe

    --filename /tmp/mod-mono_server_simias10 --terminate

    ```


    ```

    ignore_error mono /usr/lib/mono/1.0/mod-mono-server.exe

    --filename /tmp/mod-mono_server_ifolder --terminate

    ```


    This will stop the iFolder software and leave Apache running. It is simple to
    check whether the software actually unloads. When running the fuser command with
    the -m parameter, you can easily find out which process is accessing the iFolder
    shared volume mount point. For example, you might use this command:


    ```

    fuser -m /ifolder

    ```


    This will display the process id (PID) of the mono process. After executing the
    two command lines shown previously, the process will be terminated and the fuser
    command will show that no processes are using the file system at the mounted mount.
    It is safe to unmount and migrate the volume to another node.


    This also means that Apache should probably start when the server comes online.
    And you probably remember that we disabled this service earlier in this section.
    So when you configure this feature, also enable the service again with this command:


    ```

    chkconfig_apache2 on

    ```


    When you are adding this feature to the unload script and you encounter problems
    with loading Mono again when the resource comes back online, add an Apache2 stop
    command in the load script just before the line where you mount the file system:


    ```

    exit_on_error /etc/init.d/apache2 stop

    ```


    This will ensure that any previously loaded modules are stopped and that all modules
    can be successfully loaded.


    # Testing the Cluster Resource


    After you have configured the cluster resource scripts, it is a good test to bring
    the service offline and back online at least two times on the first node to see
    whether everything works as'
