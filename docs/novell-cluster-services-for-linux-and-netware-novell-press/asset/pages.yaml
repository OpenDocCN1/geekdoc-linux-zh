  md: '# Clustering Design


    In this chapter we will provide you with all the functional and technical details
    you need to design your clustering solution. We will cover topics such as how
    many nodes to choose and how to configure eDirectory your cluster. We will also
    give you some practical tips on how to set up clustering for applications that
    do not require shared storage.


    # Cluster Design Guidelines


    In this section we will give you some general guidelines that will help you to
    design your clustering solution. You should really consider them as rules of thumb
    and as the Law of Clustering. There are many parameters that can be different
    for your environment and that make you decide to do it a little different.


    # How Many Nodes to Choose


    Starting with NetWare 6, you can build a cluster with two nodes without the need
    to buy additional licenses. This is still so for Open Enterprise Server. It is
    therefore very tempting to implement just a two-node cluster. There is nothing
    wrong with building a two-node cluster per, unless you do it for the wrong reasons.
    We have seen too many customers that implemented a two-node cluster to replace
    two existing servers and in that way tried to provide high availability.


    Not only may it cause problems with the workload for a single-cluster node that
    will remain active in case of a failure, but also you will not have redundancy
    when you want to remove one node from the cluster; for example, to perform an
    upgrade. This is exactly the reason that Novell requires you'
