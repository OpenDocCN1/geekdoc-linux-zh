  md: '# Upgrading Clusters


    In this chapter we describe how to upgrade existing clusters to newer versions
    of the Novell Cluster Services software. Both NetWare and Linux are covered in
    this chapter, as well as upgrading via the mixed-node cluster route. These are
    the upgrade scenarios that are covered in this chapter:


    +   - Upgrading a NetWare 5.1 cluster to NetWare 6.5

    - Upgrading a NetWare 6 cluster to NetWare 6.5

    - Upgrading a NetWare 6 or 6.5 cluster to Open Enterprise Server Linux

    - Migrating to a new cluster, for all versions of NetWare


    NOTE

    The code base of NetWare 6.5 with Support Pack 4a is effectively the same as Open
    Enterprise Server with Support Pack 1. Also, NetWare 6.5 with Support Pack 5 is
    identical to Open Enterprise Server (OES) with Support Pack 2. Therefore, where
    we talk about NetWare 6.5 you can also read "Open Enterprise Server NetWare."


    TIP

    The method of migrating to a new cluster can also be used to move existing servers
    into a cluster if the existing servers cannot be added as regular nodes, or when
    servers will be consolidated.


    We start this chapter by describing the available upgrade scenarios from a functional
    and practical point of view before diving into the technical details of each solution.'
  merge: -1
  pgno: 242
- img_proc: true
  md: '# Upgrade Methods Explained


    In general there are three upgrade methods available for upgrading servers, and
    these are also the methods for upgrading clusters:


    +   - Upgrading the existing hardware and software, also called an in-place upgrade

    - Upgrading to new hardware and software in the same environment, also called
    an across-the-wire migration

    - Installing completely new hardware and software from scratch


    These three upgrade methods and their pros and cons are discussed in the text
    that follows. Every environment is different and many parameters are important
    to making a decision for your specific approach to upgrading, such as available
    budget, technical state of your existing environment, administrator knowledge
    level, and the knowledge and resources in your upgrade project team. We have tried
    to give you the guidelines to find your own best approach.


    # Upgrading Existing Hardware and Software


    If this approach is technically possible, it is the fastest and simplest method
    to perform an upgrade. Load the CD-ROM into the server, run the upgrade, and you
    are ready. But unfortunately this method is not always supported. Besides any
    technical limitations, it is also the most risky method, and it might not be possible
    if your current hardware and software are too old.


    Let us start with the practical pros and cons before discussing the technical
    ramifications. The most important benefit is ease of installation, and the short
    amount of time needed. An upgrade from a NetWare 6 cluster, for example, to a
    NetWare 6.5 cluster can be performed by starting the server upgrade from the NetWare
    6 server''s graphical installation screen the way you would normally install a
    new product. The upgrade can be started while users are working, up to the point
    at which a reboot is required. This can be performed on all cluster nodes. When
    the first server is ready, it can be restarted, after which the upgrade will be
    completed. Per each server, this process takes only a very short time. No data
    has to be copied via the network, which is always time-consuming. With some extra
    checking and maybe some manual tasks for upgrading services, such as backup software,
    the upgrade takes two to three hours per server, and some tasks can be performed
    simultaneously on multiple servers.


    The largest disadvantage of this in-place upgrade method is that the risk is the
    highest. If during the upgrade problem occurs that prevents you from moving forward,
    the path back to the original situation is the most complex and time-consuming.
    Because the software upgrade'
  merge: -1
  pgno: 243
- img_proc: true
  md: 'was written to your disks, it could even require a restore of your original
    server. Depending on the type of upgrade you are performing, the process might
    even have upgraded the storage area, such as when upgrading NetWare 5.1 with Novell
    Storage Services (NSS) version 2 to NetWare 6.5. In such a case a restore could
    mean restoring all your data if you decide to roll back to your starting point.


    When you want to perform such an upgrade, it can be a good idea to perform the
    upgrade in a test environment first. And, of course, create a backup before you
    start the upgrade procedure.


    # TIP


    Setting up a test environment can be time-consuming. But with the use of imaging
    software, such as Storage Manager from Portlock Software, setting up a test environment
    is nothing more than copying servers from the production machine to a test machine.
    For a cluster you will need to copy all nodes, of course. Using VMware virtualization
    software from a Physical to Virtual migration method in this process can save
    you lot of hardware resources, all depending on the amount of data you need to
    copy to your test environment and the number of nodes you need to run in the test
    environment. If sufficient resources are available, you can also rent the hardware
    needed to set up the test environment.


    Something very important to check and test if you are going to upgrade hardware
    to be used with a newer operating system is for support for network and storage
    adapters and other hardware used in your environment. Make sure that drivers are
    available and that you have them on hand when you start the upgrade.


    Besides these practical pros and cons, there are also technical issues to keep
    in mind. First of all, an upgrade might not be supported at all. A NetWare server
    cannot be upgraded to an Open Enterprise server running Linux with an in-place
    upgrade. Other technical limitations can be the available hardware resources in
    the server to be upgraded. Whereas a NetWare 5.1 server could run with 512MB of
    RAM without too many problems, for NetWare 6.5 this is the minimum and rarely
    enough. Also, disk space can be a problem. You should check for simple things
    before upgrading. A server with 100MB DOS partition cannot be upgraded to NetWare
    6.5 without first making more disk space available. The NetWare 6.5 pre-upgrade
    check, available from Deployment Manager, can help you with these preparatory
    checks.


    # Migrating to New Hardware and Software


    With this approach to upgrading to a new cluster environment, the original servers
    remain intact for the largest part of the migration process. The new servers are
    installed into the'
  merge: -1
  pgno: 244
- img_proc: true
  md: '# CHAPTER 10: Upgrading Clusters


    network with the new operating system and software, and can be thoroughly tested.
    After the new servers are found to be okay, the migration process can be started
    to copy the data to the new environment and replace the servers in the eDirectory
    tree with the new ones.


    This procedure is safer than an in-place upgrade because for a large part of the
    procedure, original servers remain intact. If something goes wrong, you can easily
    revert to the original scenario. Only when you have reached a certain point does
    it become harder to revert to the original scenario. When you are using the NetWare
    Migration Wizard, this is source and destination server identities are swapped.
    When a problem occurs in that step, it can be a very complex process to restore
    to the original situation. But even in that scenario the data will still be available
    on the old server. When you are using the Server Consolidation Utility or when
    performing a manual migration with your own procedures, there will still be a
    point where you have to switch to the new servers. But if you have performed the
    migration yourself, you will probably be able to return to the original environment
    much easier.


    # MIGRATING FROM NETWORK TO NETWARE


    In a clustered environment using the NetWare Migration Wizard is not impossible,
    but we suggest not to use it for upgrading to NetWare 6.5. If an in-place upgrade
    is not possible and you want to build new servers and do not add them to the existing
    cluster or server tree, we suggest that you use the Server Consolidation Utility
    or perform the migration manually. If you are setting up a new SAN, copying the
    data will be the process that is the most time-consuming. For other tasks that
    need to be performed, when you want to perform the migration yourself without
    the available utilities of Novell, there are tools available, such as TRUSTEE.NL.M,
    which can be used to create a list of trustee assignments on the source server
    and deploy them on the destination server. For Linux there is an equivalent tool
    called metavar, available on OES Linux servers in the /opt/novel11/nss/sbin Other
    tasks that need to be performed including pointing to the new cluster with their
    home directories. There are also many tools available, such as Homes from www.hbware.com.
    But even that step can be performed with tools you already have, when you know
    how to use them, for example with an LDIF export and import to migrate the attributes.


    # MIGRATING FROM NETWORK TO LINUX


    When your cluster is an Open Enterprise Server Linux cluster, we suggest that
    you take the mixed-cluster route to migrate your servers. How to do that is explained
    later in this chapter, in the section "Upgrading a NetWare 6.5 Cluster to Open
    Enterprise Linux." The main advantage of this method is that all your data on
    your NSS volumes remains intact, and trustee assignments and server references,
    including home directories, stay in place if they were originally pointing to
    the cluster.


    234'
