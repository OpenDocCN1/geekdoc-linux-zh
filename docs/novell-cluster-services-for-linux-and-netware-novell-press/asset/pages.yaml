    # Installing the iSCSI Target Software


    To use a NetWare server as an iSCSI target, you must have the iSCSI target software.


    TIP


    The iSCSI initiator software is always installed with every NetWare server, starting
    with NetWare 6.5.


    If you want to know whether the iSCSI software is already installed, you can check
    the installed products from the GUI on the NetWare server console. Click Install
    from the Novell menu and a list of already installed products is displayed. If
    you would look at the file system, you would notice that the iSCSI target files
    (ICSART.NLM) are always there. The iSCSI target installation only creates the
    file with the credentials (LDAP Secret Store, being sys:\etc\icscsi.iss) and adds
    the load file to AUTOEXEC.NCF.


    If you install the iSCSI target, you will see the TON.NCF file listed in your
    AUTOEXEC.NCF. This will load the target when your server boots.'
