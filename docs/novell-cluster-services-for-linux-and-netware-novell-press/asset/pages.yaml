  md: '# Advanced Clustering Topics, Maintenance, and Troubleshooting


    In this chapter you will find the answers to many of the situations in the normal
    configuration options from this book will not work. When something is broken or
    not working as it should, the answer could lie in this chapter. We have also added
    some maintenance tips and information on advanced topics, such as working with
    certificates in a cluster environment, and cluster backups.


    # Advanced Configuration and Maintenance


    Like every server environment, a cluster server environment is subject to change.
    Sometimes you initiate changes yourself and other times they come from a larger
    project. But in any case, there can be situations in which you have to perform
    maintenance on your cluster and change configuration options. This section will
    help you with that task.


    # Creating Cluster Documentation


    For your NetWare or Linux servers you should already have documentation in place.
    Without ever touching the server, you need to be able to find out from a paper
    source what the IP addressing scheme is, where in the network the servers are
    located, and even more detailed information, such as what the contents of your
    AUTOEXEC.NCF file are on NetWare.'
