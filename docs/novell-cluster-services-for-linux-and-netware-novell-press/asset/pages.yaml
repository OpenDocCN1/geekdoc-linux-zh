    # Configure NFS Use in the Heartbeat Cluster


    The Heartbeat cluster is now the right way. To get the NFS server running properly,
    however, some minimal action is required. It is important that the directory /var/lib/nfs,
    which is used by default for file locking by NFS, is replaced with a location
    on the shared disk. If you do not, file locks can''t migrate when the NFS service
    is migrated. The best way to get information about file locks available at the
    other server is by making a symbolic link on the shared storage, pointing to the
    real location of the files in /var/lib/nfs. The following procedure shows how
    to do this if the shared disk is mounted on the /data directory:


    +   1. Unload the Heartbeat services on both servers using the heartbeat stop
    command.


