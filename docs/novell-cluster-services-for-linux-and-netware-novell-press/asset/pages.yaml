  md: '# Configuring the Shared Storage with a DRBD


    FIGURE 11.1

    nThe Availability selection includes all software needed to run a Heartbeat cluster.


    ![](img/0824e0f841046b33f07fbd84ce9da816_266_0.png)


    # Configuring the Shared Storage with a DRBD


    For sure, you can run a Heartbeat cluster using a storage area network (SAN) or
    iSCSI as shared storage. For a simple setup, however, this may not be the most
    appropriate way to set up the shared storage, because expensive hardware is needed
    to configure the device. An easy stable method of providing a shared solution
    for the Heartbeat cluster is by configuring a Distributed Replicated Block Device
    (DRBD). The advantage is that no external storage device needs to be purchased,
    but a local partition or disk on the nodes in the cluster can be used for shared
    storage. Alternatively, if the service doesn''t need a shared storage solution,
    it is perfectly possible to configure the Heartbeat cluster with out storage.
    In most cases, however, it is more practical to provide some shared storage, if
    only to make management of configuration files easier. This chapter discusses
    how to set up a shared storage device. The only requirement for the setup of this
    shared storage is that both nodes are cluster nodes. If the service fails on the
    primary node, it will be activated on the other node. The Heartbeat load script
    will automatically mount the shared device in read-write mode if that happens.


    Basically, the DRBD is a RAID 1 solution running over the network. In this configuration
    one node has read-write access to the DRBD device and the other node does not.
    For sure, it'
  merge: -1
  pgno: 266
- img_proc: true
  md: "# CHAPTER 11: Using SUSE Linux Enterprise Server Clustering Options\n\nmakes\
    \ sense to give read-write access to the node that currently has the clustered\
    \ service running. To use the DRBD device, a specific device has to be created.\
    \ This involves using mknod to create the device, but also to create some configuration\
    \ files. Finally, the DRBD service that gives access to the device has to be started,\
    \ and one of the nodes needs to be assigned as the primary device. Here's how\
    \ to use a DRBD device:\n\n+   1. After installation, it is a good idea to copy\
    \ the DRBD configuration file in /usr/share/doc/packages/drbd/drbd.conf to /etc/drbd.conf\
    \ and edit this file. There is a lot of comment in this file that explains perfectly\
    \ how to configure the DRBD device. Make sure that the configuration file has\
    \ the same contents on both servers; otherwise, the DRBD device would be available\
    \ from just one server.\n\n+   2. For a simple setup to provide the DRBD device,\
    \ the following parameters can be used. Note that this is a workable example;\
    \ your environment may require a different setup. The drbd.conf man page for more\
    \ information on how to set up the DRBD device. The following example includes\
    \ some workable code you can use to set up a DRBD device:\n\n```\nresource rbbd0\
    \ {\nprotocol C;\nstartup {\n wfc-timeout 0;\ndegr-wfc-timeout 120;\ndisk {\n\
    \ on-io-error detach;\n}\n\nsyncer {\n rate 100M;\n\ngroup 1;\nal-extents 257;\n\
    }\n\nserver1 {\ndevice /dev/drbd0;\ndisk /dev/sdb1;\naddress 192.168.0.201:7788;\n\
    meta-disk internal;\n}\n\nserver2 {\ndevice /dev/drbd0;\ndisk /dev/sdb1;\naddress\
    \ 192.168.0.202:7788;\nmeta-disk internal;\n}\n}\n```"
  merge: -1
  pgno: 267
- img_proc: true
  md: 'The foregoing script consists of two parts. In the first part, some generic
    DRDB settings are configured. These settings are applied to the device drbd0,
    which is specified from the resource drbd0 setting. Next the protocol that will
    be used is defined. There are three choices here: protocols A, B, and C. Protocol
    A is the fastest, protocol C the most secure; so make your own choice as to which
    is more important to you: speed or security.


    # NOTE


    When protocol A is used, write I/O is reported as completed, if it has reached
    the local disk and the local tcp-send buffer. thereafter, if it has reached the
    send buffer network connection drops, data will get lost. With the protocol B
    setting, write I/O is reported as completed if it has reached the local disk network
    cache. This ensures that the data at least has reached the remote computer. If
    protocol C is used, write I/O is reported as completed if it has reached both
    the local and the remote disks; therefore, protocol C is considered the most secure
    protocol setting.


    Next, some timeout values should be configured. The first parameter, wfc-timeout
    specifies the amount of time the init script blocks the boot process until the
    resources are connected. By default this value is set to 0, in which case the
    init script doesn''t care about the actual state of the DRDB device. Next, the
    deg-wfc-timeout parameter specifies how long to wait for connection timeout if
    no node was a degraded cluster. The default value specifies that it has to wait
    for two minutes. This allows the other node in the cluster to come back and hand
    over control to the device.


    Next the disk parameter on-io-error detach specifies what to happen if the DRDB
    device reports an error. The option detach specifies that the node drops the storage
    device and continues in disconnected mode.


    The syn parameters are the last set of generic parameters, and not the least important.
    If you forget them, the performance of synchronization between nodes is not lousy;
    so use these parameters to specify how synchronization should take place. The
    synchronization parameters can be used to specify the amount of bandwidth that
    can be used by the DRDB process. The parameter rate 100M in the example sets the
    maximum amount of bandwidth for synchronization of the device to 100MB. If you
    have a 100MB network and want other traffic to happen as well, this is not a good
    choice; you should set it lower so that other processes have some bandwidth as
    well. The parameters group 1 and al-extents are used to define the number of physical
    extents that are synchronized at the same time. Each physical extent is 4MB, a
    total of 257 will allow synchronization of 1GB at the same time. Basically, the
    value for the parameter al-extents should reflect the value of 4MB blocks needed
    to cover synchronization of your DRDB device; for 4GB a value of 1024 would be
    a good value, for example.'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# CHAPTER 11: Using SUSE Linux Enterprise Clustering Options


    Next, there are the sections that define how DRBD nodes should be configured.
    The first parameter specifies the name of the DRBD device. Then the next parameter
    specifies the name of the internal device on the server that should be used as
    a DRBD device. It makes life easier if the device names are similar on both nodes,
    but this is not a requirement. Next, the address and port numbers need to be specified.
    The meta-disk parameter is used to specify where metadata should be written. Normally,
    the device specified with the disk parameter is used for this purpose. Be careful
    that nothing else is stored at the device mentioned because it will all be gone
    after the DRBD device starts writing metadata to this device.


    After creating the drbd.conf file, you have to create the DRBD devices in the
    directory /dev/; otherwise, it won''t work. Actually, there are two different
    devices that can be used for DRBD: One is the drbd device with major device ID
    147, and the other is the NB device with device number 43. In the current release,
    the DRBD devices are recommended for usage, so just forget about the NB devices.
    You can use the knmod command to create the DRBD devices. The command that can
    be used for this (be sure to execute this command as root, or it will not work):


    ```

    for i in $(seq 0 15); do knmod /dev/drdsi b 147 $; done

    ```


    Make sure that this command is executed on nodes where the DRBD device must be
    used; it will ensure that 16 DRBD device files are created. When this has happened,
    use the rccdrbd start command on both servers to start the DRBD services without
    any obvious error messages, use the command cat /proc/drbd to monitor the DRBD
    device is successfully created on both devices (see Figure 11.2). Sometimes there
    may be an error message when loading the DRBD device, stating that the device
    is currently busy. If this happens, we recommend you try again in a few moments—most
    of the time that helps. For serious troubleshooting, use tail /var/log/messages
    for error messages that may indicate why the DRBD device cannot be created.


    Now that you have verified that the service has started successfully, you need
    to make sure that it starts automatically the next time you boot your servers.
    To insert the service into runlevels on your servers so that it is booted automatically,
    use the insertv drbd command on both servers. The current state of the DRBD service
    is that it will be on both servers automatically. At this stage, however, it is
    not usable. To make it usable, you need to configure the Heartbeat software in
    such a way that one of the servers is configured as the primary server, while
    the other is as the secondary. In the next section you''ll read how this needs
    to be done.


    256'
