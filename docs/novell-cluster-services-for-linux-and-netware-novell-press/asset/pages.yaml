  md: '# Technical Upgrade Methods Explained


    for NetWare, Windows, and Linux. Because of that platform-independent availability
    and the enormous flexibility of the command-line tools, we will show you the command
    that exports the information from an LDAP server. ICE can be in the ConsoleOne
    directory under the bin directory.


    The following command should be entered on one line (the arrows are simple code):


    ```

    ice -S LDAP -s 10.0.0.1 -p 636 -cn=admin,o=oes -w novel -F (objectclass=user)

    -a ndHomeDirectory -b o=oes -L f:\public\rootcert.der -D LDAP LDIF -f

    c:\temp\userhomdir.ldif

    ```


    This command exports the information from the server at IP address 10.0.0.1 via
    secure port 636 by using the certificate in f:\public\rootcert.der. The export
    function is performed as user Admin in the OES container, using the password novel11.
    Only user objects are searched, -F (objectclass=user), and the search is performed,
    starting at the base of DA (-b o=oes). The only attribute that is exported is
    ndsHomeDirectory. The -S LDAP parameter tells the command that the operation uses
    LDAP as a source, and -D LDIF tells the command to use LDIF as the destination.
    In this case, it is writing the information to c:\temp\userindir.ldif


    The result of the LDIF operation should look like the following:


    ```

    version: 1

    dn: cn=Rob,o=OES

    changetype: add

    dsHomeDirectory: cn=SRV1_DATA,ou=SRV1,o=OES#=Users\Rob

    ```


    You can use your own favorite to modify the LDIF file. For a not-too-complex modification,
    you can use a simple text editor and use the replace function to change the server
    name. However, if your modification is more complex, such as adding a directory
    path to every user''s setting, an editor that supports macros is probably a better
    choice. Or use the powerful Linux commands in combination with regular expressions
    to modify the file.


    The modified file, which imports the new home directory location into eDirectory,
    should look like the following:


    ```

    version: 1

    dn: cn=Rob,o=OES

    changetype: modify

    replace: ndsHomeDirectory

    dsHomeDirectory: cn=SRV2_DATA,ou=SRV2,o=OES#=Users\Rob

    ```


    In this scenario the users are being''moved from server SRV1 to server SRV2. The
    references to the volume on the source server have been modified to point to the
    destination server.


    251'
