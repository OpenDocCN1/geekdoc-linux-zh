  md: '# CHAPTER 2: Examining Novell Cluster Services Architectctre


    FIGURE 2.3


    In Novell Cluster Services, different modules work together.


    # NCS architecture review


    ![](img/0824e0f841046b33f07fbd84ce9da816_43_0.png)


    # GIPC


    The Group Interprocess Protocol (GIPC) tracks changes in cluster membership. It
    is responsible for handling events related to cluster membership, such as nodes
    joining the cluster and leaving the cluster. To do so, GIPC runs a set of helper
    protocols:


    +   - **Panning**: Filters messages to the current epoch.

    - **Heartbeat**: Responsible for generating heartbeat messages (the next section
    in this chapter). The heartbeat information is layered over IP protocol 224 and
    can be monitored with the Ethereal packet decoder.

    - **Sequencer**: Responsible for sequencing of multicast and membership changes.
    This protocol is responsible for notifying all nodes in the cluster about changes
    in the cluster membership.

    - **Membership**: Maintains information about nodes that currently are a member
    of the cluster. Its main purpose is to reach an agreement between all nodes on
    the current cluster membership view.'
  merge: -1
  pgno: 43
- img_proc: true
  md: '# Novell Cluster Services Objects and Modules


    +   - Censustaker: Generates reports about unstable membership by monitoring heartbeat
    packages. This module will report when a node joins or leaves the cluster. This
    report is considered unstable until accepted by all other nodes in the cluster.


    +   - Group Anchor: Communicates group membership information to the upper modules
    in the cluster protocol stack.


    # SBD


    If a network connection between nodes in a cluster fails, a split brain scenario
    can occur if clusters use shared disk systems. Each side of the cluster could
    assume that nodes at the other side failed and then try to take over resources
    from the other nodes. This may cause data corruption. Novell Cluster Services
    uses a Split Brain Detector to prevent such situations. The SBD relies on a connection
    from all nodes in the cluster to a shared disk subsystem that works over a dedicated
    channel. On the shared storage device, a partition is created where all nodes
    record their view of the current state of the cluster. In the cluster membership,
    these changes can be notified by means of this SBD partition. The following section
    of this chapter provides more details about the workings of the SBD.


    # CRM


    The Resource Manager (CRM) is responsible for running resources on the correct
    nodes when changes in the cluster membership occur. This is the responsibility
    of the CRM on the master node, which receives an alert every time node joins or
    leaves the cluster. The master node in the cluster tracks the state of all resources
    in the cluster and distributes that information to all other nodes in the cluster.
    If the master fails, the CRM running on another node in the cluster will take
    over this responsibility. The CRM monitors the following possible states of resources
    in the cluster:


    +   - Unassigned: The preferred nodes of the resource are not currently members
    of the cluster.


    +   - Offline: The resource is not active. This is the state you need to enter
    to be able to modify the properties of the resource.


    +   - Loading: The resource is currently being loaded.


    +   - Unloading: The resource is currently being unloaded.


    +   - Comatose: The resource could not process the complete load script before
    a timeout occurred.


    +   - Running: The resource is currently active.


    +   - Alert: The resource requires manual intervention.'
  merge: -1
