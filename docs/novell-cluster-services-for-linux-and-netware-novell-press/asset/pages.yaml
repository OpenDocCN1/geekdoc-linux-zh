    itself. However, if you have a workstation, you can download the latest version
    of Mozilla and use that instead.


    After entering the required URL, you have to specify the following information:


    +   * Username: this is the eDirectory of the account you want to log in to manage
    your cluster environment. Complete distinguished names such as **admin.oes** are
