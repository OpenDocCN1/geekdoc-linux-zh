  md: '# CHAPTER 9: Advanced Clustering Topics, Maintenance, and Troubleshooting


    # Novell’s Backup Software


    These are the two applications Novell provides in Open Enterprise Server to create
    backups:


    +   - SBCON for OES NetWare

    - nbackup for OES Linux


    The SBCON. NLM backup software for NetWare is a menu-based backup utility that
    runs on the server with local storage devices to create backups and restore data
    in a very simple way. We think that the menu, displayed in Figure 9.5, is self-explanatory.
    The only preparatory step you must take to run a backup is to have the correct
    TSA Nlm. For example, load TAFSA.NLM or TSANDS.NLM.


    # FIGURE 9.5


    NetWare SBCON can be used to create backups or restore data.


    ![](img/0824e0f841046b33f07fbd84ce9da816_233_0.png)


    On Open Enterprise Server Linux the available backup application is nbackup. This
    is a command-line utility that can be compared to the tar command. It allows for
    creating a backup archive on a linear device or in a file. The difference between
    this and other archiving solutions is that it is SMS-compliant and works with
    the TSAs to create backups. It also writes to a newer file format, for specific
    tape backups: System Independent Data Format (SIDF).


    A typical command to create a backup follows:


    ```

    nbackup -cvf backup.siff -U backupadmin -target-type=linux /data

    ```


    This command creates a new backup file named backup.siff of all the files under
    the /data directory. The command connects to the Linux file-system TSA on localhost
    as user-backupadmin.'
