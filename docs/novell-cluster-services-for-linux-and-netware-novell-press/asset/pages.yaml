  md: '# CHAPTER 3: Clustering Design


    +   * iPrint

    * MySQL

    * Native file access methods for NetWare (AFP, NFS, CIFS)

    * NetStorage

    * Tomcat application server

    * User data (through NSS)

    * ZENworks for Desktops

    * ZENworks for Servers


    For applications not included in the preceding list, it is up to you as the administrator
    to test whether they will work in a clustered environment. You can do that on
    the test environment that you are already using for your cluster environment.
    If you do not already have cluster hardware and you want to evaluate whether your
    applications would work in a cluster, you can also build a cluster in a virtual
    environment with VMware. How to build such an environment is explained in detail
    in Chapter 4, "Installation and Configuration."


    # TIP


    For applications that are developed in-house, you can sometimes make them cluster
    aware when programmers are aware of how they could handle the application in a
    cluster—for example, by keeping application state information and client session
    information on disk instead of in memory. The disk information will be transferred
    to another node, and what was in memory will be lost.


    # eDirectory Cluster Guidelines


    Novell Cluster Services uses eDirectory as its repository for configuration information,
    and eDirectory is also the main database where information is stored about all
    resources that are configured for the cluster. Most applications that run on the
    cluster use eDirectory to store their configuration and to access to its resources.


    The cluster configuration is stored in the cluster center. This container object
    contains general information for the cluster. And the container holds all objects
    used by the cluster: cluster node objects, cluster resources, and cluster volumes.
    Every server in the cluster needs access to these objects in a local replica.
    It would also not make much sense if the cluster had to read information about
    itself to operate, when that information comes from outside the cluster. If the
    external resource was not available, the cluster would not be able to operate.
    Therefore, it is a good practice to create a partition for the cluster'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# Cluster Design Guidelines


    container and place a replica of this partition on each node. There is no need
    to place the master replica of the partition inside the cluster. If you have a
    dedicated server holding all master replicas, you can place this master replica
    also on that server.


    Other Directory design concerns are for the partitions where your user and application
    objects reside. Do you place a replica of these partitions on the cluster or not?
    We suggest that you always place a replica of these partitions on every cluster
    node that will be accessed by the users in that partition. If you do not have
    a replica of the user partition, the cluster node will create external references
    anyway, so it makes more sense to have the real objects available. An external
    reference is a pointer that a server creates to an Directory object in case server
    does not hold a copy of that object in a local replica. The external reference
    contains only minimal information about the object. The original object is also
    backlinked to the external reference, and thus these links require maintenance
    and are involved in deleting and renaming objects with external references.


    One important rule here is that you must have an Directory environment with version
    8.6 or higher. The improvements Novell has implemented in that version are so
    significant that the scalability of Directory has improved even more. This is
    vital for a well-functioning and scalable cluster.


    With older versions of NDS, you really had to be careful where to place replicas.
    A maximum of 10 replicas was advised. With Directory this limit has been expanded.
    But even it was not wise to have a large number of replicas for a partition. Synchronization
    cycles still had to contact a relatively large number of servers. The mechanism
    of transitive synchronization was implemented with NDS version 7 and thus also
    in Directory has improved the synchronization cycle, but there was still a large
    amount of traffic that had to be transported. With the original synchronization
    process every server had to contact every other server in a synchronization cycle.
    With transitive synchronization all servers maintain a table where they keep track
    of servers that are already updated by other servers. Therefore, they do not all
    have to contact every other server if they are already updated by another server.
    With Directory 8.6 this transitive synchronization process has improved even more,
    and there is also multithreaded outbound synchronization. Because of this, you
    can have more than 10 replicas of your partitions, and placing them on the cluster
    does not bring too much overhead for your cluster nodes.


    # TIP


    Coming from our practical experience, we advise you to keep the number of replicas
    as low as possible and to 10 as a maximum. If you ever had to troubleshoot Directory
    problems in a really large environment, you would find how much time it costs
    to validate information in a replica ring with more than 20 replicas.'
  merge: -1
  pgno: 62
- img_proc: true
  md: '# CHAPTER 3: Clustering Design


    When designing your eDirectory environment, also keep in mind that there are applications
    that require that eDirectory information be available in a local replica and that
    having the information available locally will improve the performance of that
    application. You can think of eDirectory-dependent applications such as domain
    name services (DNS) and Dynamic Host Configuration Protocol (DHCP) on NetWare
    and the Service Location Protocol (SLP) directory agent. For these types of applications,
    it is a good idea to create separate containers that can be partitioned off to
    store objects for the specific application. That partition can then be replicated
    to the servers where the data is needed.


    # Creating a Failover Matrix


    When a failover occurs, your cluster resources will be loaded on another node
    in the cluster. The order in which the resource will fail over other nodes is
    predefined in the cluster resource. By default, the list of servers to which the
    resource will fail over is populated with all the nodes in the cluster, in alphabetical
    order. This means that a resource loaded on OESNW1 will fail over OESNW2. When
    OESNW2 is not available, it is loaded on OESNW3, and so on. When OESNW2 holds
    the crashes and OESNW1 is not online, it will also go to OESNW3. If OESNW1 is
    online at the time of the OESNW crash, the resource will be loaded on OESNW1.


    With the default scenario all resources will be moved to the same server. Therefore,
    it is a good idea to set up a failover matrix to design the failover paths. With
    such a matrix a basic level of load balancing is possible. Table 3.1 contains
    an example of a three-node cluster with six resources that all follow a different
    path when the server they are assigned fails. You implement these failover paths
    by assigning a different load order, or priority, for each cluster resource.


    TABLE 3.1

    Example of a Cluster Failover Matrix


    | RESOURCE | PRIO 1 | PRIO 2 | PRIO 3 |

    |---|---|---|-|

    | Data volume | OESNW1 | OESNW3 | OESNW2 |

    | Apache/MySQL | OESNW2 | OESNW1 | OESNW3 |

    | GroupWise | OESNW3 | OESNW2 | OESNW1 |

    | DNS/DHCP | OESNW1 | OESNW2 | OESNW2 |

    | Folder | OESNW2 | OESNW3 | OESNW3 |

    | CIFS Server | OESNW3 | OESNW1 | OESNW1 |'
  merge: -1
  pgno: 63
- img_proc: true
  md: '# Application-Specific Design Guidelines


    In this section we will introduce some guidelines for installing applications
    on your cluster. For several applications we have added detailed guidelines in
    Chapter 8—for example, for GroupWise and IFolder. But whatever application you
    have to install, these guidelines will make them more robust and easier to manage:


    # Install Applications on the Shared Disk


    In a clustered environment, there is a central storage facility to which all the
    cluster nodes have access. The servers can work with the data if they have the
    clustered resource assigned to them. An example of this is the GroupWise domain
    and post office directories that are stored on the external shared storage to
    which the MTA and POA on the cluster node need to have access.


    It is obvious that the shared data is not on a local disk of one of the servers.
    Therefore, why should the application be stored on all local disks of all cluster
    nodes? This is what you will find in much of the clustering documentation: Install
    the application on every cluster node to make sure that every server can load
    that application and work with the shared data. This approach creates extra work,
    because you will have to install it the same number of times as you have cluster
    nodes. Additionally, for every update, you have to update all the servers in the
    cluster.


    An easier and more efficient approach is to install the application on the external
    shared storage. That, there is only one installation required, and if the application
    needs updating, only one update does the job for the entire cluster. Another advantage
    of this approach is that in case a server''s hardware crashes, you only have to
    replace the server with a new NetWare Linux server and add that to the cluster.
    The rest will remain from the shared disk.


    As an example, we will discuss what this looks like for a GroupWise environment.
    In your cluster, there will be a storage pool with a volume that we call volume
    GROUPWISE. On the GROUPWISE volume, you create a GROUPWISE folder where all of
    GroupWise''s files are stored. You will then create a SYSTEM directory in the
    root of the GROUPWISE volume, where you install the necessary agents and configuration
    files. This system directory will also contain the NetWare Control File (NCF)
    script files to start and stop GroupWise. The directory structure would look like
    the following list (we left out a few default directories to keep it simple):


    ```

    GROUPWISE:\SYSTEM


    GROUPWISE:\GROUPWISE\DOM


    GROUPWISE:\GROUPWISE\PO

    ```'
  merge: -1
  pgno: 64
- img_proc: true
  md: '# CHAPTER 3: Clustering Design


    One important item to add to your NCF script files is a search mapping to the
    new SYSTEM directory on the GROUPWISE volume. Otherwise, the application will
    not have access to mod- ules that it would have to auto-load.


    # Execute NCF and Script Files from the Load and Unload Scripts


    The configuration of what happens when a failover is performed or when a resource
    is migrat- ed is defined in the load and unload scripts of the cluster resource.
    In these scripts, you enter the commands to start and stop the correct modules,
    add IP addresses, and so on.


    Our tip here is not to add all those commands to load and unload scripts but to
    put everything into NCF files or Linux script files and call those files from
    the scripts. This has the fol- low advantages:


    +   - You can set up delegated administration for your application and the cluster.
    For exam- ple, if you start GroupWise from an NCF file or a Linux script, there
    is no need for the GroupWise administrator to have rights on the cluster object,
    and the GroupWise administrator can use his own scripts to start and stop GroupWise,
    without having to work with cluster management software.

    - You do not have to bring the cluster resource offline online when making changes
    to the load/unload commands, which you must do when they are in the load and unload
    script.

    - You cannot run into the problem in which the commands do not fit into the text
    box available for script commands. The maximum number of characters for the load
    and unload scripts is 600 total.


    The best place to store these load and unload script files is on the shared storage.
    That way you do not have to manage files on all individual cluster nodes. You
    can manage one centrally stored file, making it easier to update the file when
    required.


    It is the best option for the default commands that are added to your cluster
    volume resource to stay. Do not move them into the NCF file or Linux script because
    they will be specific to the cluster and not to the application, and the cluster
    will manage them for you. For exam-ple, when you change the IP address of a cluster
    resource in ConsoleOne or iManager, these management applications also automatically
    modify the Add Secondary IP Address state ment in the load and unload scripts.'
  merge: -1
  pgno: 65
- img_proc: true
  md: '# Clustering Without Shared Storage


    Most clustered applications work with files on the file system and therefore require
    access to shared storage. Examples of such applications can be found in Chapter
    8—GroupWise, iFolder, and Samba. But there are also applications that do not require
    access to files on the file system. There is really no need for them to run on
    a cluster with shared storage. In this section we will discuss Novell applications
    that can run in a cluster without the need for setting up shared storage.


    This means that you can use an extra cluster where these applications can be installed
    without configuring extra storage pools. But it also means that you can set up
    a basic two-node cluster without any shared storage at all to provide high availability
    for these types of applications. And this is free Open Enterprise Server comes
    with a license for a two-cluster node.


    An example of a service that can be set up without shared storage is Lightweight
    Directory Access Protocol (LDAP). For LDAP the server reads its configuration
    from eDirectory, if set up correctly, is replicated to all servers. The only thing
    need to set up LDAP for high availability is to configure the two servers in your
    cluster for LDAP and to set up a secondary IP address for use with this service.


    We have chosen LDAP as an example, but there are more applications that just like
    LDAP do not rely on shared storage for their operation. DNS, DHCP, SLP are examples
    of such applications. They work with data that is stored in eDirectory or on the
    local server hard disk. Chapter 5, "Creating Clustered Resources," describes how
    DHCP can be configured on both NetWare and Linux.


    # Prepare the Cluster


    Setting up a cluster without shared storage is done in the same way as when shared
    storage is involved. We will provide the basic steps here. First, plan which servers
    you want to use for this cluster and what the cluster''s IP address will be. This
    must be an address in the subnet that your servers are already in. Also, decide
    where the cluster container object must be placed in your tree.


    The actual installation of a NetWare is performed with the Deployment Manager
    (NDDEPLOY.EXE), located at the root of the NetWare 6.5 operating system CD. This
    utility contains the option Install/Upgrade Cluster in the Post Install tasks
    on left, for installing a cluster. For Linux you use YaST to set up the cluster
    nodes, as described in Chapter 4.


    During installation for NetWare, you will be prompted with a question, asking
    whether your server has shared storage. The answer is set to No by default if
    no shared storage is found.'
  merge: -1
