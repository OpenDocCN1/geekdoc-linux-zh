  md: '# CHAPTER 8

    Cluster-Enabled Applications


    What is a cluster without applications? It''s not much use to your end users.
    So in this chapter we will discuss how to work with some common applications that
    typically run on Open Enterprise Server (OES) clusters, either NetWare or Linux.
    In this chapter you will find GroupWise, iFolder, Squid, and Samba as examples.
    Why not more? There are two reasons for that. One is if you understand how clustered
    applications work and you grasp the concept behind them, you will be able to cluster-enable
    most of your own applications. The second reason is that there are too many applications
    out to cover all of them. We should also point out that detailed descriptions
    for many Novell applications are available on Novell''s documentation website
    at www.novell.com/documentation.


    # Cluster-Enable or Not?


    Before diving into the configuration of applications on an Open Enterprise Server
    cluster, we first want to discuss why you sometimes do not want to cluster-enable
    applications. Or at least we to make you think about which applications need the
    high availability a cluster can give you.


    A simple example is a DNS server. You could configure it to load on different
    nodes with sort of shared configuration. But does that make sense if you can already
    have two DNS servers configured on your workstations for fault tolerance? It could
    be useful in some scenarios, but at least keep the nature of the beast in mind
    when looking at high availability for an application.'
  merge: -1
  pgno: 176
- img_proc: true
  md: 'Another example, we will look into ZENWorks for Desktops. For a long time the
    documen tation of that product stated it could be run on a cluster. That was only
    partly true files for application distribution could be installed on a cluster
    volume and thus could have high availability. The same is true for group policy
    files that can also be installed on the shared storage of a cluster. The part
    about not able to cluster-enabled ZENWorks compo ments were all about the server-side
    applications, as Automatic Workstation Import (AWI) and the imaging server.


    The reason we bring up this topic is that on too many occasions we have seen clusters
    becoming overloaded with resources when some of them did not necessarily need
    high availability. But it is tempting to make everything available at all times,
    isn''t it?


    To go back to our ZENWorks example, let''s take a look at the AWI component. Why
    do we need high availability for that application? The basic question you should
    ask yourself "If this service is not available?" That is the reason for clustering
    in the first place: to keep services available to end users. With the AWI service
    not being online, what happens? Already imported workstations will not be to contact
    the import server and will not update the workstation''s information and logged-in
    user history list. The workstation object''s identifier is stored in the local
    registry and will be used to connect to eDirectory to read policies and applications
    that are assigned to the workstation object. This is the first of two problems
    that arise when you check the user object, you would not see the latest logged-in
    workstation, possibly affecting remote control if you go through the user object
    instead of the workstation object. And the second problem, which could be more
    serious ous, is that new workstations would not be imported into eDirectory, possibly
    resulting in policies and applications not being deployed.


    So is that a problem? That is up to you to decide. Every environment is unique
    and the high availability level, the service level, and the daily activity will
    differ from site to site. We hope with this example we give a fresh look at application
    high availability and the reasons to install applications in a clustered environment—or
    not.


    # # Clustering GroupWise


    Of all applications that run in clustered environments, GroupWise is definitely
    the one that is used the most? Very simple: Email has become the number-one application
    in every office. Take away people''s email and they are unable to perform their
    jobs, or so they say.


    We will look into configurations for GroupWise on NetWare and Linux in clustered
    environments. We expect that you will have experience with GroupWise. We expect
    you to know what a POA is and what an MTA is, and how these components work on
    a non–cluster-enabled server.'
  merge: -1
  pgno: 177
- img_proc: true
  md: '# Clustering GroupWise


    The basics of clustering GroupWise on a NetWare or Linux server are the same,
    so we will first describe how clustering works for GroupWise in general.


    # TIP


    For the most detailed information on clustering GroupWise on Open Enterprise Server,
    including clustering the GWIA and WebAccess, we suggest that you take a look at
    the GroupWise books from the Novell Press GroupWise expert, Tay Kratzer, at www.taykratzer.com.


    # General GroupWise Clustering


    All GroupWise components that you run on your servers are important, but when
    you look at high-availability concerns for your users, the Post Office Agent (POA)
    and, if applicable, the Webmail web server agent are the most important. Without
    these components users will not be able to log in their GroupWise environment
    at all. Other components, such as the GroupWise Internet Agent (GWIA), might be
    missed less. It, for example, take longer before Internet email is delivered if
    the GWIA has been down. How high a level of high availability you will need to
    implement depends on the way your business works and how your users use their
    email application.


    If we focus on GroupWise within organizations on onsite desktops, clustering works
    like this: The POA is loaded on one of your cluster nodes, and the users are connected
    to the POA with their GroupWise client application. If a failover occurs on the
    cluster or for a short period. When the POA is configured in the correct way with
    the setting that you migrate the POA to another node, the connection from the
    client to the POA is not available for it runs in a clustered environment, the
    client software will use a longer timeout to contact the POA to give it time to
    fail over. After the POA is loaded on another node, the client reconnects to the
    POA without the user knowing that the failover has occurred.


    # TIP


    The GroupWise client also has a caching mode. In that mode all email is also stored
    on the local hard disk and email users would not notice a failover, except that
    mail is not being delivered at that time, and they can start GroupWise without
    a POA being online. It might not be practical to enable this mode for all your
    users. Especially those who work on a different PC each day will not really benefit
    it because it would have to cache their mailbox when they start GroupWise. Laptop
    users will benefit from using caching mode most.


    When you''re using WebAccess to access GroupWise, availability is a totally different
    scenario if you would use the same clustering paradigm. In that case there is
    no client application


    167'
  merge: -1
  pgno: 178
- img_proc: true
  md: '# CHAPTER 8: Cluster-Enabled Applications


    that works for the user and could reconnect. It all happens in the browser and
    the session is kept alive on the server. This would mean that users would notice
    a failover because they would have to re-log in. A WebAccess high-availability
    scenario would consist of redundant or clustered-WebAccess agents and high availability
    for the web servers through network load balancing. More on this topic can be
    found in specialized GroupWise clustering books, such as those mentioned in the
    beginning of this section by Tay Kratzer, at taykratzer.com.


    # GROUPWISE RESOURCES EXPLAINED


    The GroupWise components, such as the POA and Message Transfer Agent (MTA), run
    on a server that has access to the cluster shared storage. Therefore it is important
    that the software is loaded on the server where the shared storage is activated.
    If you have a separate resource for your cluster-enabled pool and one another
    for GroupWise, you can never make sure that they are active on the same node.
    There is no such as combining or clustering resources to depend on each other.


    The way to make sure that the GroupWise software is being loaded on the server
    where the shared storage is active to add the GroupWise load commands to the load
    script of the cluster pool resource, with the NSS pool is activated and the volumes
    are mounted or where any other form of Linux storage is activated. Or of course
    to add the unload commands to the unload script.


    This means when you want post offices to be able to run on separate servers, for
    example to balance your load, you must create separate volumes where the post
    office directories can be located and from where the correct GroupWise agents
    can be loaded.


    # GROUPWISE ADDRESSING IN A CLUSTER


    On a standalone server you could install GroupWise with all the defaults on the
    server''s primary IP address and all the default TCP ports. For a cluster you
    need at least secondary IP addresses that can be used with the cluster resource
    to load the agents. With older versions of GroupWise there were issues in which
    the Post Office Agents would bind to all available IP addresses on the default
    port (1677). That posed a problem when running multiple offices on a single server
    to listen to the same port on all the same IP addresses. Newer versions of GroupWise,
    a new feature has been added that allows you to bind an agent to a specific IP
    address. That is great, of course, because a post office uses only that address,
    and if you leave it at the default port it will not conflict with other agents
    because they have their own address, where they can use the port.


    It is however, good practice to still use separate port numbers for the agents
    you have running on the same server. By not only binding to the specific IP address
    but also specifying a unique port number to all agents, you prevent future problems
    when you bring an agent online without configuring the specific IP address binding.'
  merge: -1
  pgno: 179
