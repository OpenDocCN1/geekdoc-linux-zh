    Notice that by default it is not enabled.


    +   - Flush Files Immediately: A file that is written to disk is written to cache,
    before it is written to the hard drive of your server; however, if a server crashes,
    all files still in cache that have not been written yet are lost. If you want
    to avoid losing files this way, be sure to enable the Flush Files Immediately
    option.


    +   - Migration: The migration feature allows file migration to a near-line storage
    media, such as a tape carousel. This feature is useful if your server needs to
    deal with huge amounts of data that you do not want to store on the server''s
    disk, but you want to make sure that users can access this data without the intervention
    of a system administrator.


    +   - Read Ahead Count in Blocks: The read-ahead count improves the read feature
