    # Clustering GroupWise on Linux


    Before you start the GroupWise installation, there are a few preparatory steps
    you must take. One of them, for is installing ConsoleOne to the system where you
    will be installing GroupWise. Other requirements for GroupWise 7, such as rights
    to the eDirectory tree to expand the schema, can be found in the GroupWise 7 documentation
    and are not different for installing GroupWise on a cluster (and thus are not
    covered here).


    For the GroupWise 7 installation that we will walk you through in this section,
    we expect that you have configured your cluster with a shared resource to install
    your GroupWise systems databases. Also, you will need to have shared storage available,
    as is displayed in Figure 8.5.


    FIGURE 8.5

    view of the partitions created with EVMS for our GroupWise system.


    ![](img/0824e0f841046b33f07fbd84ce9da816_189_0.png)


    # NOTE


    Although Novell Cluster Services (NCS) depends on the Novell Storage Services
    (NSS) file system for services such as file sharing, there is no need to work
    with NSS for GroupWise. Because GroupWise is a true client/server application,
    there is no need for end user rights to be assigned to the file system. Other
    features, such as journaling, NSS offers are important but are also offered by
    traditional Linux file systems, such as ReiserFS and ext3. Our opinion on using
    NSS is'
  merge: -1
  pgno: 189
- img_proc: true
  md: 'Clustering GroupWise


    that should do so only if you need the features offered by it and to use the other
    available file systems when those offer sufficient support. For our GroupWise
    cluster example we will use ReiserFS because this is SUSE Linux''s preferred file
    system and it performs better than ext3 using many small files, which GroupWise
    does. One last remark here: Although NSS is not a requirement for GroupWise, you
    will still find that it is a software requirement for NCS be configured on the
    server, even though you might not be using it.


    The GroupWise system we will be creating in this section is very much like the
    system we created in the preceding section for NetWare. The naming standards,
    locations, and IP addressing are listed in Table 8.2.


