- img_proc: true
  md: 'high-availability solution. Several vendors have sold, and some still do sell,
    servers with a shared SCSI solution for two servers. The cost is not much higher
    than for two individual servers.


    There is nothing per se with using such a cluster, but you should not it to replace
    two servers in your environment. In Chapter 3, we will go into more detail about
    this topic, but for clusters up to six you should always calculate one extra server
    compared to what you would use in real life.


    In a scenario in you already have two servers that run several services and you
    build a two-node cluster that runs all those services, what happens if one of
    the nodes fails? One of the two servers will then have to run the full load of
    all applications. That might be too much and it could cause your applications
    to fail, for example, because of a lack of memory.


    Planning for a clustering solution is really something you should do with high
    availability in mind for the applications that are important for your users or
    which you have agreed on high availability in a Service Level Agreement. If you
    do not focus on this and cluster-enable everything you have running today, you
    may find yourself with an overloaded server one day, losing valuable uptime for
    your system.


    In many cases it does not even make sense to cluster-enable an application. ZENWorks
    for Desktops is one of the applications that we get a lot of questions about and
    was not cluster-enabled in earlier versions. But it actually was. The two main
    components for ZENWorks for Desktops that run on the server are application management
    and policy management. For both there are no services that run on. All information
    comes from eDirectory and the file system. And it is absolutely possible to point
    to a cluster virtual server to deploy software packages and policies. The problem
    lies in the back-end services. The question is: Do they need to run on a cluster?
    We cannot answer question for you. You should think about how important it is
    that your inventory database has a continuous availability? Do you want to run
    the Automatic Workstation Import service with high availability? If you have a
