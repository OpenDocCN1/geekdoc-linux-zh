    # Clustering a Simple Application on OES NetWare


    You will now learn how to install a cluster resource on OES NetWare. We have chosen
    not to cluster a very complex application, but an easy one: the Dynamic Host Configuration
    Protocol (DHCP) server. Even if you don''t plan to cluster the DHCP server that
    runs on OES NetWare, we recommend that you read this section anyway; some useful
    information is provided about creating clustered resources.


    This section assumes that the DHCP server is already installed on one of the servers
    in your network. If it isn''t, install it before you continue with the following
    procedure. Note that the DHCP server is kind of a special cluster resource because
    it doesn''t need a shared storage device. This is because the DHCP server stores
    all its information in eDirectory. Read Chapter 8 for more information about cluster
    services that do need shared storage devices. Apply the next procedure to create
    the DHCP server as a cluster resource on OES NetWare:


