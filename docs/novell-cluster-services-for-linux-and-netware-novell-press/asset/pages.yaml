- img_proc: true
  md: '# CHAPTER 10: Upgrading Clusters


    # TIP


    You will not be able to mount the NetWare 6.5 operating system CD-ROM as a volume
    because the NSS feature has been disabled because of the preparatory step you
    have just taken. (Traditional volumes, so also SYS, will remain operational.)You
    could start a remote upgrade, but you can also copy the contents of the OS and
    product CD-ROMs to a subdirectory on your SYS volume. From the GUI installation
    you can point to that location. A local upgrade is faster than a remote upgrade.


    From the server''s graphical screen select Install from the main menu to start
    the upgrade. A list of currently installed products will be displayed. Select
    Add and point to the installation files to start the upgrade.


    Alternatively, the upgrade can be started with the server up and running from
    Deployment Manager on a workstation. In the menu Install/Upgrade Options select
    Upgrade to NetWare 6.5. Select a Server remotely to start the server upgrade.
    This remote upgrade will be slower than an upgrade started from the server''s
    graphical environment.


    # UPGRADE THE CLUSTER SOFTWARE AND CONFIGURATION


    After all the servers are upgraded to NetWare 6.5 and are up and running, you
    can continue with upgrading the Cluster Services software:


    +   1. From Deployment Manager in the Post-Install Tasks menu, select the option
    Install/Upgrade Cluster. Click the link Install or Upgrade a Cluster to start
    the Cluster Services installation program.

    2. In the Cluster Services Installation Wizard select Upgrade Software in Existing
    Cluster and click Next.

    3. When prompted, enter the required information: name of the cluster object,
    tree name, and context where the cluster object is located, Click Next to continue
    the upgrade. All cluster nodes will be now contacted by the Cluster Services installation
    application.

    4. Provide a master IP address for the cluster. This is a new feature compared
    to the clustering version of NetWare 5.1. This IP address must be an available
    address in the same subnet as the cluster nodes and the existing cluster resources.

    5. When prompted to automatically start the cluster software after the upgrade,
    select Yes or No. If you select No, you must manually start the cluster software
    on each node with the LDNS command before going to the next step.

    6. Start ConsoleOne to upgrade the cluster configuration. Browse to the cluster
    container object of the cluster you have just upgraded.'
  merge: -1
