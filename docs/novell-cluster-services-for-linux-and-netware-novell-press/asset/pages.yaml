  md: '# CONFIGURING THE GROUPWISE AGENTS AND CLUSTER RESOURCES ON LINUX


    At this point install the agents on each node in the cluster.


    NOTE


    On NetWare we can install the GroupWise software on the shared storage so that
    we have to install it only once. Because of the architecture of Linux, with its
    configuration files and daemons that the operating system and software itself
    expects to be in a default local location to the serv-er, we cannot install the
    GroupWise software on the shared storage on a Linux cluster. Therefore, we have
    to install the software on each node.


    Use the install script from the GroupWise CD-ROM or the one that can be found
    in the GroupWise software distribution directory. Follow these steps to perform
    a structured installation and configuration:


    +   1. Migrate the cluster resources to the second node. This will mount the volumes
    on that node.

    2. Start the GroupWise agent installation and also select Configure the Agents.
    Configure the agents for the domain and post office. Also do not forget to disable
    the check box to load the agents at system startup.

    3. Migrate the resource to the third node and all other nodes, install and configure
    the agents until they are installed and configured on each node where they need
    to run.


    The next step is to further configure the cluster resources from iManager. We
    have already configured the resources to mount the volumes and IP addresses in
    the beginning of this section. The only step we need to perform is adding the
    agent load and unload commands to the respective scripts.


    You may remember that for NetWare it was a problem to stop individual post offices
    because all the agents would be loaded with the same GWPOA.NLM. Therefore, we
    use a separate address space to load the agents enabled to unload that specific
    address space when migrating a resource to another node or when bringing offline.


    For Linux we can just provide the name of the GroupWise resource we want to stop
    or start as a parameter for the grpwise load script. For example:


    ```

    /etc/init.d/grpwise start gwdom1

