  md: '# Clustering GroupWise on NetWare


    Before the GroupWise installation is started on the cluster, the shared storage
    must be created. For the instructions in this section, we will install a GroupWise
    system with one domain and two post offices. The domain''s MTA will use a separate
    storage pool and volume for the domain data, and the two post offices will also
    use a separate pool for the post office directory. Therefore we require three
    cluster resources to store the data. Table 8.1 shows an overview of the GroupWise
    system we will create in this section.


    TABLE 8.1

    Overview of the GroupWise NetWare Cluster Environment in This Section


    | COMPONENT | POOL AND VOLUME (ALSO AGENT NAME) | CLUSTER VIRTUAL SERVER | IP
    ADDRESS | PORTS USED |

    | --- | --- | --- | --- | --- |

    | Domain MTA | GWDOM1 | GWDOM_Server | 10.0.0.60 | Message transfer port 7100
    HTTP port 7180 |

    | Post Office 1 | GWP01 | GWP01_Server | 10.0.0.61 | Client/server 1677 Message
    transfer port 7101 HTTP port 7181 |

    | Post Office 2 | GWP02 | GWP02_Server | 10.0.0.62 | Client/server 1678 Message
    transfer port 7102 HTTP port 7182 |


    The preparatory steps that need to be taken to create the cluster resources for
    the three pools with their volumes. How to do this is described in Chapter 5,
    "Creating Cluster Resources."


    Before starting the GroupWise installation, also make sure that the three resources
    are up and running and you have access to all three shared disks. The best way
    to do this is to create a drive mapping to these three disks. With the three drive
    mappings, you can make sure that the installation program can copy files to the
    volumes and create the directories for you.


    Because installing GroupWise on a cluster is not too much different from installing
    on a real server, we expect that you understand the other necessary requirements
    needed for installing GroupWise, such as having rights to the tree root object
    to extend the schema if necessary.


    # INSTALLING THE GROUPWISE SYSTEM ON NETWARE


    In general, there are two ways to create a new GroupWise system. The first method
    is by the book: Start from the installation CD and follow directions. The second
    method starts halfway down the track and is preferred by most experienced GroupWise
    administrators.'
