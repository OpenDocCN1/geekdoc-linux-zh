  md: '# CHAPTER 6: Cluster Management


    +   The second property is about the quorum. It specifies the number of nodes
    that have to be present in the cluster before a resource starts loading. By default,
    it will wait for all nodes in the cluster to come online before any resource is
    loaded, but it will do this only for the period specified as the timeout period.
    Imagine, for example, that the number of nodes defined in the quorum is set to
    seven, and the timeout limit is set to one minute. After one minute only two nodes
    are present in the cluster, resources will start loading on these two nodes anyway.
    Often the default quorum of all nodes in the cluster works fine. You should always
