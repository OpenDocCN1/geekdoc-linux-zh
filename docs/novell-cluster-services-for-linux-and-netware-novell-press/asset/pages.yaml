    # RENAMING A NETWARE SERVER THAT IS AN ISCSI INITIATOR


    Renaming a NetWare server is always a cumbersome task. Of course, the procedure
    is simple: Change the name in AUTOEXEC.NCF and reboot the server. After the reboot,
    the eDirectory Limber process takes care of renaming the server object, and the
    change is synchronized to the other servers in the tree. Then the work begins
    because there will be login scripts, other scripts, batch files, and application
    objects with UNC paths that need to be updated. So, if possible, never rename
    a NetWare server.


    If you ever to rename your server and it is an ISCSI initiator, an extra step
    is needed because the server name is used in the server''s registry for the name
    of the iSI initiator connection.


    To change this name, you must edit the server''s registry manually. To allow for
    modifications to be made through Remote Manager, upload PORTAL.NLM and reload
    it with the /regedit parameter.


    ```

    LOAD PORTAL.NLM /REGEDIT

    ```


    The example in Figure 9.1 shows the registry key that needs to be modified:


    ```

    My Server\Protocols\iSCSI\Initiator Control Parameters\Initiator Name

    ```'
