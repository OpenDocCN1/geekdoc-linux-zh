- img_proc: true
  md: '# Removing a Failing Slave Node


    Several steps are taken when a slave node fails. These steps are described here:


    +   1. Each node in the cluster sends a heartbeat over the LAN. By default, this
    happens every second.

    2. At half-time of the preconfigured tolerance rate (which is 8 seconds by default),
    each node writes its epoch number to the Split Brain Detector on the shared storage
    device. Under normal circumstances the epoch of all nodes in the cluster will
    be the same.

    3. The master node monitors the heartbeat packets and epoch numbers of all nodes
    in the cluster.

    4. If a slave node fails to send a heartbeat package within the period defined
    as the tolerance rate, the master node and the other slave nodes create a new
    cluster membership view. This new cluster membership view does not include the
    failing node.

    5. All nodes in the new cluster membership view update their epoch numbers by
    one and write this modification to the Split Brain Detector. At that moment, there
    are two cluster membership views: one with the node that failed to send heartbeats
    within the tolerance rate, and one with the other nodes. This situation is called
    a split brain.

    6. Novell Cluster Services now needs to determine what cluster membership wins.
    It does by voting between the two cluster membership views. There are three possibilities:


    +   - The cluster membership view that has the most nodes wins.

    - If there are equal nodes on both sides, the side with the view that contains
    the master node wins.

    - In a two-node cluster, the node that still has network connectivity wins.


    +   7. Based on the results of the vote, a special token is written by the winning
    nodes to the Split Brain Detector; this is the so-called poison pill. The losing
    node reads the poison pill and as a result crashes itself with an abend or kernel
    panic. Terminating the losing node is necessary because it ensures that the losing
    node cannot corrupt the new cluster.


    +   8. The new cluster migrates all resources previously associated with the failing
    node and thus guarantees uninterrupted services for end users.'
  merge: -1
  pgno: 47
- img_proc: true
  md: '# Removing a Failed Master Node


    The preceding scenario describes what should happen if a slave node fails. The
    situation is different when the master node fails because in this case a new master
    must be assigned as well. The following procedure describes what will happen.
    It should be noted that the process is more or less the same as what happens when
    a node that is not the master fails:


    +   1. After failure of the master node, a new cluster membership view is created.
    This new cluster membership view includes only the slave nodes. The master node
    maintains the old cluster membership view.

    2. The nodes in the new cluster membership view update their epoch number by one.

    3. Novell Cluster Services votes based on the new information.

    4. The cluster with all the remaining slave nodes wins the vote.

    5. The nodes in the winning cluster write a poison pill to the Split Brain Detector.

    6. The slave nodes vote who will be the new master. This voting mechanism is more
    or less random.

    7. The failed master node reads the special token and terminates itself.

    8. All resources assigned to the failed node are migrated to other nodes in the
    cluster.


    # Summary


