- img_proc: true
  md: '# Using iSCSI in an Open Enterprise Server Environment


    # NOTE


    When you''re setting up a scenario like this, it is very important that IP routing
    be disabled on the servers. Clients should never be routed to a server through
    a storage server connection to another server.


    When you''re choosing hardware for your storage network, we recommend that you
    use at least 1GB ethernet hardware.


    Additionally, you can use netowrk interface card (NIC) teaming to have multiple
    network interface cards voicing the iSCSI storage connections. It is a rule of
    thumb to have 1GHz of processor power available for every 1GB of network throughput.
    So for 2GB network adapters, you would need 2GHz of CPU power available on top
    of what you already need for your applications. The TCP/IP stack is SMP-aware,
    it is a good idea to have at least two CPUs of a minimum of 2GHz each in your
    servers.


    Something else will help with improving the performance of your iSCSI storage
    network is to use a hardware iSCSI adapter. Such an adapter offloads the capacity
    needing from the regular processor because it uses its own dedicated special-purpose
    processor to handle the ISCSI communications. Host bust adapters (HBAs) that are
    supported on both NetWare and Linux are available from QLogic.


    # iSCSI Target Requirements


    iSCSI targets can be NetWare 6.5 running iSCSI target software. Every NetWare
    6.5 server comes with the iSCSI target software.


    # NOTE


    For Linux there is no support from Novell for iSCSI targets on Open Enterprise
    Server. There are several projects available on the Internet that provide target
    software for Linux. For Linux kernels 2.4 and 2.6 there is a driver from the University
    of New Hampshire (www.sourceforge.net/projects/unh-isci). Another project we suggest
    is www.sourceforge.net/iscarget. And as it goes with open-source projects, we
    suggest that you check the SourceForge website when you need to get started with
    the software from such a project.


    There are also hardware devices that can be used as an iSCSI target. They generally
    support LDAP and CHAP authentication, so they will work with NetWare and Linux
    initiators. When you are looking into purchasing such a device, we recommend that
