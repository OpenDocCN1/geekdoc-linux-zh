  md: '# CHAPTER 2: Examining Novell Cluster Services Architecture


    +   - NDS Sync: The resource is waiting to synchronize with its eDirectory properties.

    - Quorum wait: Currently there are not enough nodes in the cluster. The resource
    is waiting for the other nodes as defined in the quorum to become active.


    # VIRTUAL INTERFACE ARCHITECTURE LINK LAYER


    The Virtual Interface Architecture Link Layer (VLL) sits between modules in the
    cluster. It interfaces with the GIPC, SBD, and CRM modules. If the GIPC stops
    receiving information from another node in the cluster, it notifies the VLL. This
    module contacts the SBD, which determines whether the node is really dead and
    then informs the CRM of its decision.


    # CLUSTER VOLUME BROKER


    The Cluster Volume Broker monitors NSS file information for the cluster. If a
    change occurs, it will ensure that the change in the NSS file system is replicated
    to all other nodes in the cluster.


    # CLUSTER SYSTEM SERVICES


    The Cluster System Services (CSS) module provides an application programming interface
    (API) that cluster-aware applications can use to enable distributed shared memory
    and shared locking. Distributed shared memory is a technique that allows cluster-aware
    applications running across multiple servers to access the same data, as if the
    data were present on the same physical RAM chips. Distributed locking ensures
    that if one node gets a lock, another thread on another node can''t get the same
    lock.


    # CLUSTER SERVICES MANAGEMENT AGENT


    The Cluster Services Management Agent (CMA) acts as a proxy for the management
    applications. Several applications are available:


    +   - ConsoleOne: The legacy management application for NetWare environments.
    It cannot be used to manage NCS 1.8. It is, however, still needed to manage some
    applications in NCS 1.8 environment. GroupWise is an example of such an application.

    - The Perl command-line interface (CLI): On Linux, some Perl utilities are available
    from the line. These utilities use user space and interact with the data in the
    /admin directory to modify and get information from the cluster.

    - iManager: The iManager management utility interacts with /_admin and CMA to
    modify cluster parameters.


    The CMA interacts with the CRM to determine current information about the cluster
    and control the state of cluster resources. It also performs SNMP management capabilities
    and'
