  md: '# Creating the Squid Cluster Resource


    Assuming that the NCS software is already installed and shared storage is available,
    the Squid cluster resource can be created. This involves a few general steps:


    +   * Install the Squid software on both servers in the cluster.

    * Prevent the Squid server from being loaded automatically.

    * Create a cluster resource for the Squid software.


    The exact steps that have to be performed are described here:


    +   1. Start YaST, log in as root, and select the option Install and Remove Software.
    Then select the drop-down list in the upper-left corner of the YaST screen and
    select the Search option. Next, enter the search text Squid. From the results
    screen, just select Squid and click Accept to proceed installing the software.

    2. The next step is to prevent the Squid server from being started automatically
    when the server is booted; the reason for this is that the cluster resource object
    will be responsible for starting Squid and the Linux operating system itself.
    In YaST, select the runlevel editor from the System menu. Locate the Squid service
    and make sure that it is not selected.

    3. Start iManager at https://server/nps and authenticate as the admin user to
    your tree. Select Cluster, Cluster Options and use the magnifying glass to locate
    the cluster object which you want to add the proxy server as a resource. Select
    this object; this will display an overview of all resources currently in the cluster.

    4. Click New under the Cluster Objects option to create a new cluster resource.
    You will now see a window where you can specify the type of object you want to
    create. Select Resourcece and then click Next to continue.

    5. Enter the name you want to use for the cluster resource. Select the generic
    IP service (see Figure 8.14) to inherit properties from and then click Next to
    continue.

    6. Now you can edit the sample load script to start the Squid service. The following
    load script will do:


    ```

    #!/bin/bash

    . /opt/novell/ncs/lib/ncsfuncs

    exit_on_error add_secondary_ipaddress 10.0.0.31

    exit_on_error /etc/init.d/squid

    exit 0

    ```'
