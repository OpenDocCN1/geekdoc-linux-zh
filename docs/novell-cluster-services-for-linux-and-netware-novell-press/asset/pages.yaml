- img_proc: true
  md: 'CHAPTER 10: Upgrading Clusters


    # UPGRADE THE NETWARE 6 SERVERS WITH A DOWN CLUSTER


    This in-place upgrade requires only one preparatory step: installing the cluster
    licenses. If you are running a two-node cluster, no licenses are needed and the
    servers can be upgraded. With three nodes or more, first install the cluster licenses
    from IManager.


    When the licenses are installed in the tree, upgrade the servers individually
    to NetWare 6.5. Before starting the upgrade of the first server, stop the cluster
    with the down command. This prevents a scenario in which a server would come online
    with the new software while the old cluster is still running. That is part of
    the rolling cluster upgrade scenario and not what we started here.


    TIP


    It is a good idea to disable the command that starts the cluster (LDNCS, NCF)
    before upgrading. This helps in the way that you can focus on a successful upgrade
    of all your servers to NetWare 6.5. Check whether everything runs as it should
    and that all drivers work okay, and then load NCS to check whether your cluster
    comes online successfully. Do not forget to enable the LDNCS, NCF load command
    again.


    After the first server is upgraded and online, it will start the cluster servers
    software. There are no updates that need to be performed on the file system or
    cluster resources such as with the NetWare 5.1 upgrade, so the cluster will be
    available immediately after the upgrade.


    # PERFORM A ROLLING UPGRADE OF THE NETWARE 6 CLUSTER


    With this in-place upgrade scenario, the servers will be upgraded one at a time,
    leaving the cluster up and running during the upgrade. Services to the end user
    will be interrupted for a minimal amount of time. Effectively the cluster resources
    will be brought offline and online, which has the same effect as migrating a resource
    from node to another node. So it depends on your applications whether the users
    will notice the upgrade at all.


    TIP


    You can also perform the entire upgrade operation during normal operating hours
    and then perform only the last step during off-hours.


    Before the upgrade is started, the cluster licenses for the NetWare 6.5 cluster
    must be installed. If you are running a two-node cluster, no licenses are needed
    and the servers can be upgraded. With three nodes or more, first install the cluster
    licenses from IManager.


    When the licenses are installed in the tree, perform the upgrade of your servers
    through the following steps:


    240'
