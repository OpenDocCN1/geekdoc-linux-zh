  md: '# Avoiding Split Brain


    One issue has not been dealt with so far. In a cluster environment, it can happen
    that more than one node in the cluster thinks that it has exclusive access to
    a cluster resource. Such a configuration is known as split brain. If this resource
    is the shared storage device, the results can be severe; if, for example, a database
    is stofed of the shared disk device, the entire database may become corrupted.
    In a serious clustered environment, precautionary measures must be taken to prevent
    such a situation. Some nice features are available with the Heartbeat software
    to take care that the failing node is terminated when it fails.


    One solution to cast off the failing node is to use a Stonith device. Stonith,
    which stands for Shoot the Other Node in the Head, refers to a technique that
    makes sure that the failing node is cast off efficiently. For Stonith configuration,
    a smart power device connected to both servers must be used. A serial cable or
    network cable running from both servers allows the Heartbeat software to send
    commands to this device, which controls the power supply to the other server.
    If needed, the other node can reset a failing cluster node this way.


    A Stonith device is used in the following way:


    +   1. The remaining server denies hearing heartbeat packages anymore and concludes
    that the other server fails.

    2. The remaining server sends the Stonith command to the Stonith device.

    3. The Stonith device turns off power on the failing server. This makes sure that
    a split situation is avoided.

    4. All resources that were running on the other server are failed over automatically.


    Because each Stonith device has its own unique set of commands, it is not possible
    to give a "one size fits all" description on how to configure the device.


    > TIP

    in a production network, it is recommended that you use a Stonith device. Your
    uninterruptible power supply (UPS) manufacturer can inform you about UPS models
    that support Stonith. If, however, for some reason you cannot lay your hands on
    a UPS, two other methods are available as well. First is the meatware device (a
    human being) that is alerted to a failing node in the cluster. Second is the option
    to use SSH to send a command to the other node in the cluster. The latter method,
    however, is not recommended because there are too many situations in which it
    can fail.'
  merge: -1
  pgno: 278
