  md: '# CHAPTER 7


    # iSCSI


    The topic for this chapter is not one purely related to clustering. iSCSI is a
    storage-related protocol that can be used for many storage needs, including shared
    storage for clustering. In this book we do not cover other storage techniques
    in depth, such as storage area networks (SANs) and Direct Attached Storage. But
    because Novell ships Open Enterprise Server (OES) with support for iSCSI and because
    it is a really useful technique for clustering, we have decided to add a separate
    chapter on this topic. Another technology for sharing storage across the cluster
    is Distributed Replicated Block Device (DRBD). This technology is covered in Chapter
    11, "Using SUSE Linux Enterprise Server Clustering Options."


    In this chapter we introduce what iSCSI is and we discuss some general concepts
    for this protocol. We also describe how to use the software for Open Enterprise
    Server for NetWare and Linux.


    # iSCSI Introduction


    The iSCSI protocol offers a transport layer for Small Computer Systems Interface
    (SCSI) blocks over TCP/IP networks. Typically, local devices were and still are
    connected through SCSI . Such devices are disks and tape drives in the data center
    and, for example, scanners on the desktop. SCSI is a protocol that transports
    data by messages of communications called a bus, the SCSI-bus, where devices,
    including the host adapter in the computer, have a unique address and control
    blocks are sent back and forth devices. For example, a server sends a disk write
    control block to a SCSI disk and the disk replies with a control block informing
    the server that the data has been written. iSCSI works as a wrapper around these
    control blocks Command Descriptor Blocks (CDBs), encapsulating inside them iSCSI
    protocol packets, called Protocol Data Units (PDUs).'
  merge: -1
  pgno: 148
- img_proc: true
  md: '# CHAPTER 7: iSCSI


    iSCSI originated in the late 1990s from research by mainly IBM and Cisco. The
    first proposal for the iSCSI standardization was RFC 3347 (Small Computer Systems
    Interface protocol over the Internet) from July 2002 that described the requirements
    and design considerations for iSCSI.


    Many vendors have worked on the standard, and a first draft of the iSCSI technical
    specifications was laid down in RFC 3720 (Internet Small Computer Systems Interface)
    from April 2004.


    There are many RFCs that provide very good insight into the workings of iSCSI.
    The ones mentioned before are an example, but another one that provides useful
    information is RFC 3721, which describes the naming guidelines for iSCSI. The
    easiest way to access RFCs is from the original RFC Editor''s website at www.rfc-editor.org.The
    website contains a search facility in which search for the iSCSI keyword provides
    access to all iSCSI-related RFCs.


    The original guidelines describe the following use scenarios for iSCSI:


    +   - Local storage access, consolidation, clustering, and pooling (as in the
    data center)

    - Network client access to remote storage (for example, a "storage provider")

    - Local and remote synchronous and asynchronous mirroring between storage controllers

    - Local and remote backup and recovery


    For this book we focus on the use of iSCSI for local storage access, consolidation,
    and clustering. Let us define these terms before we go into more detail of how
    iSCSI is being used in the Open Enterprise server environment. Figure 7.1 shows
    an example of a typical iSCSI storage network as we describe it.


    Local storage access refers to the replacement of Direct Attached Storage for
    servers. Typically, servers do not necessarily have to be internal disks. It is
    also possible that a server accesses a dedicated storage enclosure with disks
    attached via SCSI or Fibre Channel. iSCSI can replace these types of storage connections.
    New technologies, such as Blade Servers, can greatly benefit from using iSCSI
    when SCSI and Fibre Channel connections are not available.


    The consolidation part of the iSCSI use scenario is about creating a point of
    storage that can be accessed by many systems. This central storage point is called
    a target in iSCSI terminology. One central storage provider can be used from NetWare,
    Linux, Windows, and other operating systems.'
  merge: -1
  pgno: 149
- img_proc: true
  md: '# FIGURE 7.1

    A typical iSCSI storage network.


    ![](img/0824e0f841046b33f07fbd84ce9da816_150_0.png)


    Finally, the clustering part of the usage scenario is most important for us in
    this book. An iSCSI target allows more than one server to connect to its storage.
    Because of that, it is possible to create shared storage that can be used by Novell
    Cluster Services (NCS).


    # iSCSI Advantages


    There are many benefits to using iSCSI in comparison to more traditional storage
    protocols and relatively new technologies as Fibre Channel. The most important
    benefits are listed here:


    +   - Low-cost hardware requirements: For an iSCSI implementation relatively inexpensive
    hardware can be used. With a server operating as an iSCSI target, its inexpensive
    disks can be used to offer large amounts of storage to other servers. The network
    connections between the initiator and the target can be created with regular ethernet
    hardware. We do not imply that iSCSI is always a low-cost solution. For performance
    and reliability reasons, you can choose high-end iSCSI disks, for example, or
    very fast network-work connections. The important thing about iSCSI is that you
    have the choice to use the hardware you want.


    +   - Use of existing hardware: With iSCSI you can create a storage target from
    an existing NetWare server and provide the storage to other existing servers.
    With this approach'
  merge: -1
  pgno: 150
- img_proc: true
  md: '# CHAPTER 7: iSCSI


    you can even build a full cluster environment without the need to buy additional
    hardware.


    +   manageable storage solution: The entire implementation of iSCSI can be done
    with equipment and technologies that you are already familiar with: ethernet and
    TCP/IP Compared to implementing a Fibre Channel SAN, iSCSI is like a walk in the
    park. The ease of use also makes it easier to learn how to work with your storage
    solution.


    +   Extended range support: With traditional iSCSI you are limited to locating
    the equipment close to the servers. Fibre Channel can stretch to a maximum of
    6 miles or 10km. With iSCSI the sky is the limit. If you can reach your destination
    the disk—theoretically, of course, because in real life your capabilities will
    be limited by factors such as bandwidth, amount of traffic, and network latency.


    +   Flexibility in capacity planning and growth: Existing limits for SANs for
    the number of disks that can be used or the number of physical connections to
    a Fibre Channel switch do not apply to iSCSI. It is relatively easy to attach
    new iSCSI targets to an existing network and add new storage to the existing servers.
    Because of the use of a network protocol (TCP/IP), there is no need physically
    attach equipment, sometimes with the need to bring a server down.


    # How iSCSI Works


    iSCSI is a technology that encapsulates SCSI blocks in TCP/IP packets. The way
    this is set up is that the original application that is using the device on the
    other side of the iSCSI connection is unaware of this extra layer.


    Figure 7.2 displays the typical communication flow for an application or operating
    system call that reads from or writes to a SCSI device. The application uses the
    OS-specific system calls for that, and the driver communicates with the disk with
    SCSI Command Descriptor Blocks.


    Figure 7.2


    The regular SCSI disk communication process.


    ![](img/0824e0f841046b33f07fbd84ce9da816_151_0.png)'
