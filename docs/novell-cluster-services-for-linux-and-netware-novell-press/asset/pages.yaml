  md: '# Introduction to Clustering and High Availability


    In this first chapter we will introduce the general concept of clustering. The
    Novell Cluster Services (NCS) product will be put into perspective with regard
    to other high-availability solutions. The terminology around high availability
    and Novell Cluster Services will also be explained in detail. We will provide
    guidelines here about when to use cluster products and when not to use them. The
    hardware and software requirements for Novell Cluster Services will be covered
    at the end of this chapter.


    # Novell Cluster Services Defined


    This section introduces Novell''s clustering software. If you are new to the product,
    you must certainly read on if you miss the basics, it will be very hard to understand
    the clusters on design and installation to follow.

    With Novell Cluster Services, 2 to 32 servers can be combined into one system,
    where every server runs its own tasks and can take over tasks from another server
    in case of a failover. The most simple clarification of this is an example of
    two servers providing access to a data volume on an external storage device, such
    as a storage area network (SAN). Server one is providing access to the volume
    on a specific Internet Protocol (IP) address. If server fails, for example because
    of a power failure, server two will detect that failure, mount the volume, and
    pick up the IP address that was used to access the service. Because the addressing
    remains the same, client computers can continue to work with their data. This
    depends on the end users'' application whether it will have any problems with
    this failover. But in most cases everything just keeps working.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# CHAPTER 1: Introduction to Clustering and High Availability


    In this scenario all servers in the cluster are actively running their own tasks;
    therefore, we call this type of cluster an Active-Active cluster, in comparison
    with an Active-Passive solution, in which one of the servers is not running any
    tasks but just waits for another server to fail. An example of the latter solution
    was Novell''s Standby Server. It is also possible to look at the Active-Active
    terminology from a service perspective.


    In the architecture and design chapters you will be able to read more about how
    this actually works, but we would like to give you a brief overview of Cluster
    Services components and the terminology of Cluster Services.


    # Shared Disk Access


    The most important component for your cluster is the disk that all your servers
    will share. That external medium contains the data that your applications work
    with, and it contains a small area that the servers will use for housekeeping.
    The shared disk can be anything from a simple shared disk on a Small Computer
    Systems Interface (SCSI) bus to a SAN or an iSCSI connection to a server that
    acts as a disk target. Each of these solutions is described in more detail later.
    We will first take a look at what the shared disk is used for. Figure 1.1 shows
    a typical cluster of OES (Open Enterprise Server) servers.


    Figure 1.1

    A typical OES cluster setup.


    ![](img/0824e0f841046b33f07fbd84ce9da816_17_0.png)


    First of all, the disk will contain a small partition that we call the Split Brain
    Detector (SBD) partition. The SBD process is explained later in this section.
    In short, it is the referee that can'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'remove faulty servers from the cluster to keep the rest healthy. The SBD partition
    is also used to store administrative information and logging information about
    the cluster.


    # NOTE


    It is possible to run a cluster without a shared disk and an SBD partition. In
    Chapter 3,"Clustering Design," you can read about an example of running Dynamic
    Host Configuration Protocol (DHCP) on a cluster without shared storage. This can
    be done because the data that''s needed to run a DHCP server is stored in eDirectory,
    a service that is already available on all servers. But you should keep in mind
    that without the shared disk there is no process in charge of guarding you against
    a split brain situation.


    The remaining part of the shared disk will be used to store data for your clustered
    services. Separate parts of the data can be assigned to individual services on
    a per-pool basis. In older versions of the clustering software, the smallest entity
    to assign to a service and to failover is a volume. But starting with NetWare
    6, all Novell Storage Services (NSS) volumes become logical volumes that reside
    inside an NSS Pool. Therefore you will always perform what we call a pool-based
    failover. An NSS Pool can be active on only one server at a time. Accessing the
    data and especially writing to it from two servers at the same time would corrupt
    the data in the pool.


    # Secondary IP Addresses


    Besides the shared disk there is another configuration component you should know
    about. If your services were running on the primary IP address of a server and
    the server failed, the clients would lose access to that IP address and therefore
    also to the service. The other server would, of course, have its own private IP
    address.


    To solve this issue, we use secondary IP addresses on the cluster. Every service
    that we want to fail over to another node will get its own IP address. The address
    must be fits into the subnet of the primary address of the server. And it must
    also fit into the subnet of the destination server. From this behavior follows
    the requirement that cluster nodes must always be inside the same subnet.


    Using these additional IP addresses also means that you should shift your focus
    from working with servers to working with services. You no longer access data
    on the volume of a virtual cluster server, either via its eDirectory object or
    via its IP address or domain name services (DNS) name.'
  merge: -1
