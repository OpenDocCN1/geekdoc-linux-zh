  md: '# Cluster Design Guidelines


    failover cluster. Other cluster technologies offer a seamless uninterrupted continuation
    of an application because it is already active on more than one node at a time.
    These types of clusters are more complex and more expensive and are not available
    for Open Enterprise Server (OES). So for OES we work with applications that perform
    a failover. This also has some implications for the type of application to see
    how they can run in a cluster.


    Let us first look at a sample application to see how the server and clients behave
    in a cluster. An Apache web server is running on node 1 and reads its document
    directory from the shared disk. A user has just loaded a web page from the server
    and is reading through it. At that time node 1 fails and node 2 activate the shared
    storage and the Apache web server with the exact same configuration and IP address.
    If the user is finished reading the web page and the server has become online
    on node 2 in the meantime, the next page the user accesses will be served from
    node 2 and availability will not be interrupted.


    This scheme works for most applications that we can run in the cluster. For example,
    a user who is accessing GroupWise will not notice if a failover is performed.
    But this will not be true for all types of applications. It depends on the behavior
    of the application whether the clients will survive a failover. If the web server
    we introduced earlier is running a web-based application for a shopping-cart system
    with server-side session information about shopping baskets and customer information
    for logged-in customers, all that information, which is very in memory, will be
    lost when the node fails, and the customers will have to reestablish their sessions.


    Other types of applications that may not survive a failover are databases that
    run on cluster nodes. These will very likely also contain session information
    about users that are logged in, and the client applications may not support auto-reconnecting
    to the server.


    There is no extensive list of applications that can be used as a reference for
    cluster-enabled applications. But a good starting point is the overview from Novell''s
    documentation website of applications that can be configured for a cluster. The
    applications known to work well in a Novell cluster are listed here:


    +   - Apache web server

    - BorderManager

    - DHCP

    - DNS

    - extEnd application server

    - FTP server

