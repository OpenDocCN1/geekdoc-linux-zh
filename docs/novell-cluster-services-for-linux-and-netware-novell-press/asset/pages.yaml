    - The other cluster must be enabled for BCC.


    # TIP


    Still having problems setting up the connection? You can use the cluster credentials
    command from the bcc console on the servers to set up the connection as well.
    On bcc1-node 2 enter the command cluster credentials cluster2. Next, the distinguished
    admin name and password. Repeat this procedure on the other node using the command
    cluster credentials cluster1.


    Next, some objects need to be created in the clusters and they need to be configured
    for failover. The following procedure shows how to create a volume pool resource
    and how this object is enabled for failover in a BCC environment:


    +   1. bcc1-node2, load NSSMU. Start NSSMU, select pools, and press Insert to
    create a new pool. Give the pool name sitepool and press Enter.

    2. Select the appropriate partition on the iSCSI shared disk device and press
    Enter. Next, accept the default for the partition size and press Enter.

    3. Accept all default values for the pool object and provide it a unique IP address.
    Make sure the IP address can be resolved to the name of this pool in the /etc/hosts
    file on your server. Then click Create to create the pool.

    4. Create a volume named site1vol in the pool you have created.

    5. Repeat this procedure to create a pool and volume object for site2 in your
    cluster.


    Next, you have to make the partitions available across the clusters in your network.
    For this purpose, you need to mirror the partitions. The next procedure shows
    how to do this with NSSMU:


    +   1. Load NSSMU on bcc1-node2 and select Partitions.

    2. Select the NSS partition with the sitepool on it.

    3. Press F3 to display mirror options. It will show a list of all available partitions
    as shown in Figure 12.12. Now select the right partition object. You need to look
    at the partition ID to determine which partition you need. In the Device Name
    value, each partition has a name like [V060-A3-D3:0]. Determine the device name
    of the partition on the local server that you want to mirror, and next determine
    the device name of the partition on the other server you have just created. That
    leaves two devices available for mirroring. If you created a 400MB partition on
    the local server, directly after that, the 410MB'
