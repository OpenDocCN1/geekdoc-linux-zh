  md: '# Managing Novell Cluster Services from the Command Line


    When starting Novell Cluster Services manually by this script, you should be aware
    that there are some system dependencies. In earlier versions of the software,
    there was a dependency that the Novell Storage Services (NSS) support modules
    to be loaded on OES Linux, as of support pack 2, this dependency has been eliminated.
    Also, you should make sure that the shared storage needed for Novell Cluster Services
    to run (for example, to get access to the Split Brain Detector partition) is present
    as well. Make sure that any such dependencies are resolved before trying to load
    the software manually.


    # Starting and Stopping Novell Cluster Services on NetWare


    On NetWare, it is the responsibility of one single NetWare Control File (NCF)
    to load Novell Cluster Services. The automatic nature of this NCF is LDCS.NCF
    (short for Load Novell Cluster Services), and it is called automatically from
    AUTOEXC.NCF. For Linux, on NetWare as you should be aware of the existing dependencies.
    There is no need to load NSS manually before you start Cluster Services, but there
    is, however, a need to activate all shared storage devices before you start. This
    is typically performed from the STARTUP.NCF file. To unload NCS, the LDCS.NCF
    file can be executed. This will automatically unload all cluster-related modules.
    Unloading the software will automatically have the node leave the cluster first.


    # Managing Novell Cluster Services from the Command Line


    When tuning and troubleshooting Novell Cluster Services, the administrator has
    the task of managing Cluster Services from the command line. For this purpose,
    the cluster command was created. This command has many options that can be used
    from the command line to manage the cluster environment. All the commands in the
    following list are arguments for the cluster command (for example, the command
    down should be used as cluster down). To indicate whether the command can be used
    on NetWare, on Linux, or on both, (n), (l), or (n+) is added after the name of
    the arguments:


    +   * alert {resource}{yes|no}: (l-n) This command can be used on a resource that
    is currently in an alert state. This happens when the resource start, fail over,
    or fail back mode is set to Manual and the resource is waiting for something to
    happen. If it is, this command to specify the name of the resource, followed by
    yes if you want the resource to start, fail over, fail back, and followed by no
    if you don''t want this. For example, cluster alert dhcp yes is used after the
    DHCP configure to continue to what it needs to do. You would typically use this
    option after querying the status of the given service with the cluster status
    command. For example, to query the status of the DHCP status, first use cluster
    status dhcp, and then if the resource is in an alert state, use cluster alert
    dhcp yes.'
