  md: '# Adding a License to Existing Cluster Nodes


    If for any reason you have a problem with the licenses of one of the nodes in
    the cluster, it is possible to add a license later. Without a proper license,
    the node can''t stay in the cluster and automatically leaves after a few minutes!


    To add a license to an existing cluster node later, the following procedure can
    be used:


    +   1. Start iManager and log in as a user with administrative permissions.

    2. Select Licenses, Delete a License and browse to the location of existing NCS
    licenses. It is mandatory that they are removed from the tree before any new licenses
    are installed!

    3. After deleting licenses, select Licenses, Install a License. Now, on your workstation
    browse to the location of the license file.

    4. Select the license file and click Next. Then select the Directory container
    where you want to install the license file. Next, click Install to install the
    license in eDirectory and then click Done to complete the license installation.


    Before buying, you can test to create your two-node cluster. Licenses to create
    a two-node cluster are included with the evaluation version of Open Enterprise
    Server.


    # Removing Nodes from a Cluster


    It may happen that you have to remove a node entirely from the cluster. The procedure
    for this is easy: Leave the cluster, unload all cluster-related modules, and remove
    all files that are activated when you start the cluster. The procedure for each
    of the OES flavors is described in the text that follows.


    # Removing an OES NetWare Node from the Cluster


    When you''re migrating a NetWare cluster to Linux, after a successful migration
    your NetWare node should be removed. Also, before taking out a NetWare node, you
    should remove it properly from the cluster. The following procedure describes
    how to perform this task:


    +   1. On the NetWare console, type cluster leave to leave the cluster.

    2. Enter ULDCS to unload Novell NetWare Services.

    3. Delete the cluster node object from iManager (see Figure 4.12). This is the
    object added for this node in the cluster container.'
