- img_proc: true
  md: '7. Right-click the object and from the Views menu select Cluster State View.


    8. You will now be prompted as to whether you want to complete the cluster upgrade.
    This process takes only one or maybe just several seconds. It updates the cluster
    volume resources that were updated before the upgrade with several temporary commands
    that were needed to perform the volume upgrades and restore theくて. These commands
    will be deleted by this process. Also, the NSS pools in eDirectory will be renamed
    to reflect the name of the new cluster servers. NSS pools are new to NetWare 6.x
    and did not exist in NetWare 5.1.


    The cluster upgrade is now complete. Post-upgrade tasks include upgrading any
    applications that require an update to NetWare 6.5, including your backup software.


    # Upgrading a NetWare 6 Cluster to NetWare 6.5


    For an in-place upgrade of a NetWare 6 cluster to NetWare 6.5, two methods are
    available: upgrading the cluster while it is not available to end users and while
    the cluster remains available. Which upgrade method you choose is up to you. If
    you have the time to bring down the cluster and upgrade the servers during off-hours,
    that will probably be your choice. In many cases maintenance windows have become
    smaller, and for administrators who have a family life, the live upgrade scenario,
    also called rolling upgrade, will be very welcome.


    # MEET THE NETWARE 6.5 SYSTEM REQUIREMENTS


    Before upgrading the cluster, you must check whether you meet the system requirements
    for your upgrade to NetWare 6.5. Check the items in the following list to determine
    whether you are ready for the upgrade:


    +   - Check the hardware requirements of the server to see whether you have sufficient
    storage space and memory available. Also verify that your hardware is supported
    for NetWare 6.5—check which drivers are available for all devices and so forth.


    +   - Verify that all applications you run on the servers are supported on NetWare
    6.5. Do not forget to check your backup software.


    +   - Make sure that you obtain licenses for all nodes. NetWare 6.5 comes with
    two nodes, when upgrading a cluster with three nodes or more, make sure that you
    have the extra licenses at hand.'
