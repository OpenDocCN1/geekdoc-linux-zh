  md: 'Newer backup applications, like the ones we discuss in this book, allow you
    to configure the cluster resources (pools and volumes) as individual entities
    that can be backed up independent-of the server where they are active. And support
    for failover during a backup job is also supported.


    # Storage Management Services


    Novell''s implementation of this backup architecture has been around for many
    years and is now still available on NetWare and on Open Enterprise Server (OES)
    for NetWare and Linux. Storage Management Services is a backup framework containing
    standardized components that Novell''s backup application ties into and third-party
    backup software vendors also use to back up with building blocks running on Open
    Enterprise Server for both NetWare and Linux, it is very easy for software developers
    to reuse the existing architecture and implement a solution. For example, when
    file-system data needs to be backed up, you only need to “talk” to the file system
    Target Service Agent (TSA), which provides access to the file system. When a new
    file system needs to be supported and a new TSA becomes available, the existing
    backup solutions can keep using the same modules for creating backups of the file
    system.


    You can consider the SMS architecture as a tiered setup where the Storage Management
    Data Requester (SMDR) sits in the middle, as you can see in Figure 9.3. This software
    component plays a central role, providing third-party software developers with
    a means to communicate with the other components of the backup architecture and
    handling communications between servers.


    FIGURE 9.3


    The architecture of SMS is like a tiered setup with SMDR as the data broker.


    ![](img/0824e0f841046b33f07fbd84ce9da816_230_0.png)'
  merge: -1
  pgno: 230
- img_proc: true
  md: '# CHAPTER 9: Advanced Clustering Topics, Maintenance, and Troubleshooting


    Another important component of SMS is the Target Service Agent. This is the software
    that SMDR communicates with to collect the actual data from the servers. There
    are several implementations of TSAs available, for example, the file-system TSA
    (TSAFS) to back up files and TSANDS to back actual data (file or eDirectory objects)
    are called targets in the SMS scheme. Table 9.1 contains an overview of targets
    that exist in NetWare and OES environments and the TSAs that are available to
    create backups.


    # TABLE 9.1

    Target Services and Their Corresponding Target Service Agents in OES


    | TARGET | TARGET SERVICE AGENT | PLATFORMS |

    | --- | --- | --- |

    | NSS file system | TAFS | OES NetWare and Linux |

    | Cluster resources | TAFS | OES NetWare and Linux |

    | Traditional NetWare file system | TAFS | NetWare 6.x |

    | Traditional NetWare file system | TSA500 | NetWare 5.1 |

    | VFS-compliant file systems | TAFS | OES Linux |

    | NDS/eDirectory | TSANDS | NetWare |

    | GroupWise | TAFS | NetWare 6.x, OES NetWare and Linux |

    | GroupWise | GWTSA | NetWare 5.1 |


    The TSAs listed in Table 9.1, all resources on our servers can be secured by our
    backup applications. Novell provides two backup applications, one for NetWare
    and one for Linux, to use the SMS architecture to create backups. These applications
    do not provide the full feature set that we need in a backup solution. For things
    as tape rotation and keeping track of data in incremental and differential backups,
    a third-party application is needed.


    Before we use any backup utility, SMDR must be configured and functional.


    An installation of Open Enterprise Server for NetWare and Linux contains the SMS
    software by default. You can check whether the software is installed from the
    GUI Install application on NetWare or from the Software Management entry in YaST.
    If the SMS software is not installed, this is also the location to install it
    as a post-installation task.


    # NETWARE CONFIGURATION FILES


    The SMS software on NetWare is automatically started when the server boots because
    the load file SMSSTART.NCF is added to AUTOEXEC.NCF during installation. Any configuration
    data will be stored in smdr.cfg and tsa.cfg, located in the sys:\etc\sms directory.'
  merge: -1
  pgno: 231
- img_proc: true
  md: '# LINUX CONFIGURATION FILES


    On an Open Enterprise Server Linux, the SMDR daemon is configured to automatically
    load in runlevels 3 and 5. The daemon startup script is /etc/init.d/novell-smdrd.
    The actual configuration data is stored in smrdr.conf and tsafs.conf in the /etc/opt/novell/sms
    directory. When changes are made to these files, the SMDR and TSA can be restarted
    with the respective commands rcnovell-smdrd refresh and smsconfig -r tsafs.


    # IMANAGER CONFIGURATION OPTIONS


    On both NetWare and Linux, SMS can be configured from iManager. Configuration
    options for the SMDR are for protocol settings—for example, if IP address the
    service will bind to, whether TCP/IP and/or IPX will be used, and what mechanism
    will be used to discover services: SLP, SAP (NetWare only), or a HOSTS/DNS configuration.
    In a cluster environment SLP is the required discovery mechanism.


    For the TSA configuration options are for performance tuning, by the way, does
    not need any adjustments in most environments. The important setting for the cluster,
    as displayed in Figure 9.4, is that clustering must be enabled for the TSA when
    running in a cluster environment.


    FIGURE 9.4

    SMDR and TSAs are configured from iManager for both NetWare and Linux.


    ![](img/0824e0f841046b33f07fbd84ce9da816_232_0.png)'
