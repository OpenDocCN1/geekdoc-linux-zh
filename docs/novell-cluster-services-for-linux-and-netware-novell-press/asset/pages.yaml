  md: '# CHAPTER 10: Upgrading Clusters


    Distinguished Name that reference the actual object, regardless of its name. Because
    of this, when you rename a server all these references will automatically point
    to that renamed object. When you have an old server in the tree that is called
    FS1 and a new server FS2, deleting FS1 and renaming FS2 will not update all references
    to server FS1. At the moment object FS1 is deleted, all references are lost. It
    is therefore very important to always update all references from the old server
    to the new server and only if all steps are complete to delete the old server
    from the tree.


    A simple example of how server references can be updated to a new server is that
    of the Default Server property of users. Changing that to a new value is simple.


    +   1. Go into ConsoleOne or iManager and perform an advanced search for all users
    with the given Default Server property.


    +   2. In the results window, select all objects and choose Properties on Multiple
    Objects from the File menu.


    +   3. Next, select the new Default Server property for these users and click
    OK to apply this setting to all users who had the old server as their default
    server.


    All objects pointed to the old server will now point to the new server.


    For user home directories it is not as simple as this. One reason is it is a unique
    value for each user. They all have a common part, the server volume, but also
    a personal part, the active directory. When data and users are being copied to
    another tree with the Consolidation Utility, a template object can be used to
    set the home directory attribute in the new tree. But when the server and data
    stay in the same tree, nothing will be updated.


    User home directories can be modified to point to a new location in several ways.
    There are third-party tools available for purchase that can help you with the
    most complex scenarios for user home directories. But also with some simple tools
    you already have, much is possible.


    # TIP


    There is a great product available from Novell called File System Factory. It
    allows for policy-based management of home directories. When you have to move
    users on a regular basis, such as in case of a school at the start of each semester,
    this tool will make your job easier. More information can be found at www.novell.products/filesystemfactory.


    One of the methods you can use to change the Home Directory attribute is to export
    it via LDAP, and after making the necessary modifications in the export file,
    import the information again. Creating an LDAP export can be done via the Import
    Conversion and Export (ICE) Wizard in ConsoleOne and iManager. There is also an
    ICE command-line executable available'
