  md: '# BCC Usage Scenarios


    There are three scenarios in which BCC can be used:


    +   - A two-site Business Continuity Cluster

    - A multiple-site Business Continuity Cluster

    - A low-cost Business Continuity Cluster


    A short description of these three scenarios follows.


    # THE TWO-SITE SOLUTION


    If BCC is used in a two-site solution, two different scenarios can be deployed.
    First, the remote site can be configured as a passive site that takes over services
    only if the primary site fails. Services need to be used at both sites, both sites
    can be active as well. In this scenario, either site can take services from the
    other site if needed; you should, be aware that enough resources need to be present
    at both sites for a smooth failover. The scenario in which both sites are active
    is the most realistic scenario for large companies.


    # THE MULTIPLE-SITE SOLUTION


    In a large environment, BCC can support up to 32 nodes per site with a maximum
    of four sites. In this scenario, if a site fails the clustered resources can fan
    out fail between sites. To replicate data across the sites, the solutions offered
    by the SAN vendors need to be used, although host-based mirroring solutions such
    as rsync can be used as well.


    # LOW-COST TESTING SOLUTION


    Normally, a company would use a Fiber Channel SAN to ensure data availability
    across the different sites. If no Fiber Channel SAN is available, data block replication
    can be accomplished with iSCSI or rsync as well. This is ideal for test environments
    and environments where no budget is available for a Fiber Channel SAN; you should,
    however, be aware that such a solution does not offer the same performance level.
    In the rest of this chapter, you''ll learn how to create your own BCC test environment.


    # Building Your Own BCC Test Environment


    This section describes how to build your own BCC test environment. Because when
    this was written, BCC 1.1, which supports Linux clusters, was not available yet,
    you will learn how to install BCC 1.0 in an Open Enterprise Server (OES) NetWare
    environment. With some modifications, this procedure will also apply to a BCC
    1.1 environment. Before you begin, you must make sure that the following requirements
    are met:'
  merge: -1
