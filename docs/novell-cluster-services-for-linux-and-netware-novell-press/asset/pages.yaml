  md: '# Cluster Design Guidelines


    Fibre Channel technology can be used to create the largest clusters possible.
    It provides the fastest throughput of all technologies discussed here. We are
    not sure whether we call it a disadvantage, but for setting up a Fibre Channel
    SAN special technical skills are needed. Many customers let their hardware resellers
