    # Installing NCS on Linux


    One of the beautiful things of NCS is that it is cross-platform. An NCS cluster
    can consist of NetWare as Linux nodes, and in that case some resources can even
    be migrated across these nodes in the multipatform cluster. Of course, you cannot
    migrate a typical NetWare utility, running as an NLM (NetWare Loadable Module),
    to the Linux platform, because the necessary support is missing. If you are working,
    however, with a platform-independent resource like an NSS pool, you can migrate
    the resource across the different nodes in the cluster. The installation procedure
    of OES Linux however, is completely different:


    +   1. On the OES Linux server, start YaST, enter the administrator password,
    and select System, Novell Cluster Services (NCS). You will now see a message indicating
    that Novell Cluster Services needs NSS to be installed as well (see Figure 4.8).
    You must click Yes to continue and install both products, otherwise you cannot
    proceed with the NCS installation.


    FIGURE 4.8

    On OES Linux, you need to install NSS if you want to install NCS.


    ![](img/0824e0f841046b33f07fbd84ce9da816_77_0.png)


    +   2. In the window that pops up, click Continue to proceed. Insert all CDs the
    installer for.


    +   3. In the Novell Storage Services LDAP Server Configuration screen, specify
    whether you want to access a local directory server or a remote directory server
    for LDAP access. If your server is a replica, select Local System; otherwise,
    select Remote System to connect an LDAP server. Enter the Admin password and click
    Next to continue.


    +   4. Now enter a unique object name for the NSS admin volume. In most cases,
    you can accept the default value. Then click Next to proceed. The NSS settings
    are now written to eDirectory and the installer continues installing the NCS software.
    In the next screen, click Continue to proceed. Then insert all CDs asked for.'
