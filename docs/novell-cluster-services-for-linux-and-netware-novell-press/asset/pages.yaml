  md: '# Cluster Resources Management Applications


    FIGURE 6.7


    The Cluster Report utility gives a good overview of what is happening in the cluster.


    ![](img/0824e0f841046b33f07fbd84ce9da816_134_0.png)


    Apart from the Cluster Report utility, from the Cluster Manager window you also
    get a good overview of the current state of nodes and resources. If a node goes
    down, it will be detected in the next refresh of the utility and will be displayed
    with a cross in it. Note that this is considered a major event, and therefore
    the epoch number will be updated by one. Resources that have a problem are also
    clearly marked in the Cluster Manager overview.


    From an administrator perspective, this screen is important because resource management
    can be performed from it. The following options are available:


    +   * Online: Use this option to bring a resource online that is currently offline.

    * Offline: If you need to do maintenance on a server and need to bring down a
    resource temporarily, this is the button to do so. It will disable the resource
    and no failure will occur.

    * Migrate: Another option to use when you need to bring down a resource temporarily
    is to migrate the resource to another server. Select the resource, click Migrate,
    select the server on which you want to run it, and the resource will be migrated
    automatically.

    * Respond to Alert: If a resource is in a Failback Alert, Failover Alert, or Start
