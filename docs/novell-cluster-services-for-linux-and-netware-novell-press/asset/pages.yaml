- img_proc: true
  md: '# Introduction to Business Continuity Clustering


    Having a high-availability cluster is a good thing to prevent disasters from causing
    major problems with the continuity of your business. Sometimes, however, one cluster
    is not enough. What if, for example, a flood or an earthquake wipes out an entire
    site? In that case an ordinary cluster won''t help you. Especially for these kinds
    of situations, Novell has launched the Business Continuity Clustering (BCC) solution.
    This solution provides a true cluster of clusters. In this chapter BCC is introduced
    from a high-level overview perspective.


    # Business Continuity Clustering Overview


    The goal of Business Continuity Clustering is to connect and synchronize information
    between clusters. At the time of writing this book, a maximum of four clusters
    is supported. In the 1.0 version, these need to be NetWare clusters; in BCC version
    1.1, NCS 1.8 on Linux is supported as well. The clusters that are synchronized
    with BCC are often located at separate geographic sites. If one of the clusters
    goes down, the other clusters can take over the workload. In this way, nonstop
    access to mission-critical data and resources is guaranteed.


    BCC is tightly integrated with eDirectory and synchronizes information between
    two to four clusters usingDirectory. For this purpose, Identity Manager, formerly
    known as DirXML, is used. Identity Manager is a Novell product that is used to
    synchronize information between different data'
  merge: -1
  pgno: 280
- img_proc: true
  md: '# CHAPTER 12: Introduction to Business Continuity Clustering


    Originally, the purpose of Identity Manager was to synchronize, for example, between
    an eDirectory environment and an Active Directory environment, a PeopleSoft data
    store and many other applications, but it can be used to synchronize information
    within the same eDirectory structure as well. This is exactly the way BCC is using
    Identity Manager.


    When a BCC solution is operational, services, configurations, and essential data
    can be migrated between two clusters with just one click. In fact, it is as easy
    as migrating a clustered resource within a Novell Cluster Services (NCS) environment
    where no synchronization with external resources takes place. In fact, BCC works
    a lot like NCS from an administrative perspective. There is, however, one major
    difference: Because it involves a lot of traffic and the results of a failover
    are rather severe, there is no such automatic failover. You will always need to
    migrate BCC resources manually.


    # High Availability Between Clusters


    Speaking in a generic way, there are two methods for setting a high-availability
    environment if clusters at different sites are involved. The first solution is
    the so-called stretched cluster. In this solution, a cluster is created where
    the nodes in the cluster are located in different geographical areas. All nodes
    are in the same eDirectory tree and in the same cluster. In this solution, the
    cluster heartbeat is happening over the WAN connection. Also the storage area
    network (SAN) is available across the WAN, with a disk array at both sites and
    disk arrays connected by a dedicated high-speed fiber connection. In the setup
    of the cluster, nodes at site B must be configured to take over services from
    site A if an entire site goes down.


    There are, however, some limitations to this solution. The first is that in an
    NCS environment, all nodes in the cluster need to be in the same subnet. Therefore,
    in a stretched cluster, you would be forced to use the same subnet across the
    WAN. Also, the eDirectory in the stretched cluster needs because all cluster objects
    to be in the same eDirectory container, and this might complicate eDirectory design.
    Another disadvantage is that you are still working with just one cluster, and
    that doesn''t offer the best fault tolerance; if you have just one cluster, you
    also have a single point of failure and that should be avoided.


    A stretched cluster offers some advantages as well. Resources can fail over automatically,
    which is not possible in a cluster of clusters. Also, it is lot easier to manage
    a stretched cluster than it is to manage separate clusters in a cluster of clusters.


    The second solution to ensure high availability across sites is to build a cluster
    of clusters. In this solution, two different clusters are created and information
    is synchronized between the clusters, while both clusters are active at the same
    time. This is exactly what is happening in a BCC environment. In this scenario,
    there also needs to be replication of data blocks on'
  merge: -1
  pgno: 281
- img_proc: true
  md: '# Business Continuity Clustering Overview


    SAN; this is the responsibility of the SAN hardware. Other mirroring techniques
    can also be used to ensure availability of data across the different clusters
    in a cluster of clusters. For example, if no SAN is available, an rsync solution
    could be deployed to ensure data synchronization. In a cluster of clusters, one
    of the sites would go down entirely, the entire cluster can fail over to the other
    site.


    # NOTE


    Rsync is a solution that can be used to synchronize files or directories across
    the network. Rsync will be configured to synchronize files and/or directories
    at a specified time interval. It is not the best synchronization option available
    because delays will occur before changes are synchronized. For synchronization
    of small amounts of data, however, it is a good solution.


    A cluster of clusters offers some flexibility that is not available in a stretched
    cluster. These advantages are listed here:


    +   - The change of LUNs in the SAN is minimized.

    - There is no need to create eDirectory partitions that cross the WAN.

    - Each cluster can be in a separate eDirectory tree.

    - Each cluster can have its own subnet.

    - If one site fails, clustered resources can fail over to separate clusters. This
    feature is called multiple-site fan-out failover support.

    - There is no need to mirror SBD partitions between sites.


    The most important disadvantage of the cluster-of-clusters solution is that resource
    configuration must be kept in sync somewhere. In a BCC environment, Identity Manager
    is used for this goal.


    # Using BCC to Create a Cluster of Clusters


    The main advantage Novell BCC has to offer as compared to a cluster of clusters
    is that synchronization of information between the clusters is happening automatically
    by using the Identity Manager eDirectory to eDirectory drivers. Nov treats each
    of the separate sites in the cluster of clusters as a node in this metastluster.
    This allows an entire site to fail over to multiple sites. To add some level of
    automation to the failover process, BCC uses SAN hardware. The different Logical
    Units (LUNs) can be mirrored across the SAN. Exactly how that happens depends
    entirely on the options offered by your SAN vendor. The entire configuration is
    managed with iManager, which allows for simplified management. If enhanced control
    and customization are needed, scripts can be used.'
  merge: -1
  pgno: 282
