  md: 'Using iSCSI In an Open Enterprise Server Environment


    FIGURE 7.6

    iSCSI can also be used to store data on a remote site.


    ![](img/0824e0f841046b33f07fbd84ce9da816_156_0.png)


    # iSCSI for Offsite Storage Mirroring


    With iSCSI it is simple to access storage on remote sites. And if we combine with
    the mirroring capabilities of Novell Storage Services (NSS), it becomes simple
    to have an offsite online copy of active data available on a server. Figure 7.7
    shows how such a setup could look.


    FIGURE 7.7

    With iSCSI data can be mirrored to a remote site.


    ![](img/0824e0f841046b33f07fbd84ce9da816_156_1.png)


    The mirroring part takes place at the NSS partition level. This means that the
    remote server that holds the target does not have access to the partition that
    holds the actual data. In case of a failure you could access the remote data from
    either the main site or the remote site by starting an iSCSI initiator connection
    to itself.


    145'
