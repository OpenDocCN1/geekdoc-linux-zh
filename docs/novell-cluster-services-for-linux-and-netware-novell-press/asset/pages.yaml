  md: '# CHAPTER 5: Creating Cluster Resources


    # FIGURE 5.26


    If the resource does not properly check, /var/log/messages for clues.


    ![](img/0824e0f841046b33f07fbd84ce9da816_123_0.png)


    # Cluster Script Syntax


    An essential part of clustering ofering is the cluster load and unload scripts.
    From the moment that NCS is available on OES NetWare as well as OES Linux, the
    syntax of the cluster script is **bash**, and the default shell is available on
    both NetWare as Linux. On NetWare specific NCS-related commands were already available;
    on Linux these commands are added to a file that is created from each load or
    unload script. This is the line:


    +   - /opt/novell/ncs/lib/ncsfs


    In this script the following functions are defined:


    +   - **del_secondary_ipaddress**: This command can be called from the cluster
    load script to remove a secondary IP address that was added for a specific service.

    - **add_secondary_ipaddress**: This command is used to add a secondary IP address.
    This IP address is needed because all resources that run on the cluster need an
    IP address that is independent of the IP addresses already in use on the servers
    in the network.


    112'
