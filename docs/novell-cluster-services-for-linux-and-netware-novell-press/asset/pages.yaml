    # # Installing NCS in VMware


    One of the system requirements of using Novell Cluster Services is that you must
    use some kind of common shared disk for the servers in the cluster. You can use
    shared SCSI disks, Fibre Channel, or iSCSI. That is all simple and easy if you
    have physical hardware. How does that work in a virtual environment?


    There can be many reasons why you would want to install NCS in a VMware environment.
    This can be for consolidation of your production servers, for setting up a test
    environment, or just for fun to learn how a cluster works and to study for your
    CNE exam.


    # ## VMware Is


    Let us first briefly explain what VMware technology is in case you have not used
    it before. With VMware products you create virtual machines on an operating system.
    These virtual machines are complete PCs. They have their own hard disk and networking
    capabilities. VMware does not emulate the host processor, but instead all threads
    are handled by VMware on the host CPU. Therefore, the virtual machine uses the
    same CPU as the host. Other hardware is emulated in the form of an IDE or SCSI
    disk, an AMD network adapter, and a default VMware VGA adapter. Because the hardware
    is always identical, except for the processor, virtual machines are interchangeable
    between computers running VMware software.


    # ## VMware Usage Scenarios


    The first possible clustering solution is to consolidate servers. Many companies
    do that nowadays with VMware’s ESX Server product. This product comes with its
    own Linux-based operating system and does not rely on a default Windows or Linux
    host to run virtual machines. This isolates the virtual environment’s stability
    from that of the host operating system.


    Does it make sense to cluster-enable virtual machines that are already running
    in a very robust environment such as VMware ESX Server? We hear this question
    often, and as all consultants answer: It depends. With VMware ESX Server, and
    especially if you have two'
  merge: -1
  pgno: 84
- img_proc: true
  md: '# CHAPTER 4: Installation and Configuration


    hardware boxes and running vMotion product, the availability you get is very high.
    With vMotion you can moving a virtual machine from one hardware box to another.
    But that does not happen automatically when a problem occurs. Also, it does not
    help with problems inside the guest operating system, Open Enterprise Server in
    this case. NCS can still help you to improve the availability of software components
    inside your virtual machine environment. If a server experiences a critical error,
    the other nodes in the cluster will take over the services. That can even be beneficial
    when all cluster nodes are being run on a single hardware box.


    Clustering can also be performed with VMware GSX Server and VMware Workstation.
    These so-called "hosted" products run on top of a Windows or Linux server environment.
    Clustering is officially supported in VMware GSX Server, so that makes it a viable
    solution for running clustered Open Enterprise Servers inside virtual machines.
    For VMware Workstation, clustering is not supported, but you can still use that
    product to create a test environment or to set up a cluster for educational purposes.


    # VMware Clustering Requirements


    Whatever product you use, there are two special configurations you need to take
    into account. First of all, you must use fixed-size disks. This is the only type
    of disk you can create in VMware ESX Server. For Workstation and GSX Server you
    can use a dynamically growing disk. But if they both write data into the virtual
    disk file and try to increase the size of the disk, this would corrupt the data
    inside the disk. Therefore, you must use the setting Allocate All Disk Space When
    you create a new virtual disk to be shared between the virtual machines.


    The other configuration to keep in mind is that you must configure the bus-sharing
    feature or the disk-locking feature. For the server products'' clustering is supported,
    and they provide bus sharing (ESX Server) and SCSI Reservation (GSX Server). This
    is not supported for VMware Workstation; for that product you must disable disk
    locking and disk caching. These configurations are described later in this section.


    # VMware Clustering Configuration


    VMware clustering configuration is detailed in the following subsections.


    # ADDING A SHARED DISK INVM ESX SERVER


    There are two possibilities to set up clustering for virtual machines in VMware
    ESX Server. You can either use a physical LUN (Logical Unit) from your SAN and
    assign it to two or more virtual machines, or create a new virtual disk file and
    add that to the virtual machines. Configuration of the virtual machines can be
    performed from the Management Interface, or from the Remote Console utility, or
    from the VMware VirtualCenter management application.'
