- img_proc: true
  md: '# CHAPTER 7: iSCSI


    When the main site becomes available, the initiator connection that the remote
    server had with its own target can be stopped and the original server can be connected.
    The NSS mirror-will be activated to bring the disks to the same level.


    # iSCSI Design Guidelines


    In the most simple and least expensive configuration, the iSCSI traffic is transported
    via the existing local network area. For servers servicing a small number of clients
    or when the stor-ands are not very high, this might be a workable scenario. For
    larger environments we recommend using a separate storage network. One of the
    major problems in a single-network environment is that the data you store from
    a client is sent out by the server on the same net-work to the storage. Effectively,
    all data travels through the network if you use one network, and that will consume
    valuable bandwidth and have a negative impact on performance. Figure 7.8 shows
    an example of a separate network for iSCSI storage.


    Figure 7.8 improved performance use a separate storage LAN.


    ![](img/0824e0f841046b33f07fbd84ce9da816_157_0.png)'
