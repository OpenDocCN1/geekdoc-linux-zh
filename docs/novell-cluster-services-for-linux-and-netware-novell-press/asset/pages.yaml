    SCSI (Small Computer Interface), Fibre Channel, and iSCSI. The first technology
    is really a direct connection method, and the two others will form a storage area
    network.


    # USING SCSI FOR YOUR SHARED STORAGE


    For a long time SCSI was the most used technology for attaching storage and other
    equipment to computers. With SCSI, disks and tape devices are attached to a SCSI
