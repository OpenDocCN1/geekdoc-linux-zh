    if it cannot contact the import server at boot time. The only thing that would
    not happen is the update of workstation information. So you could miss the change
    in IP address in case you want to remote-control the machine.


    This was really just an example of how to look at your services: with a clear
    mind toward high availability. It is okay with us if you cluster-enable all services
