  md: 'Rob Bastiaansen is an independent consultant and trainer. Rob has a strong
    focus on NetWare, Cluster Services, eDirectory, and ZENWorks. He delivers Advanced
    Technical Training for Novell in EMEA regarding these topics. Rob is also a technical
    writer; he writes for several IT magazines in The Netherlands where he lives.
    VMware is another of the areas in which Rob works as a consultant and trainer.
    In 2004, Rob wrote his first book, Bob’s Guide to Using VMware, which is in print
    in its second edition. In 2005, Rob published The NetWare Toolbox. He is a Master
    Certified Novell Instructor and holds all the major Novell certifications, including
    Certified Linux Engineer and Certified Linux Professional.


    Sander van Vug is an independent trainer and consultant, with a strong focus on
    Linux in combination with any Novell product available. As a technical trainer,
    Sander does a lot of work for Novell in the EMEA region where he lives. He specializes
    in the workings of Linux file systems and access protocols and clustering services.
    Sander is also a technical author; he has written 26 books in the Dutch language,
    and this is his second book in English. Sander is also a Master Certified Novell
    Instructor and holds all major Novell and Linux certifications.


