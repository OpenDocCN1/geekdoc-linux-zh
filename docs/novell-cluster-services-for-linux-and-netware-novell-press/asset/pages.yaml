    in the cluster. If, for example, you need to migrate a cluster resource, you will
    do it from this screen.


    +   - Cluster Event Log: On an active cluster lots of events can occur. From the
    Cluster Event Log you can find an overview of all recent events.


    +   - Cluster Options: This is the screen where generic settings for the cluster
    are configured. Use it to specify cluster parameters or create new cluster objects.


    # ADMINISTERING CLUSTER RESOURCES AND GENERIC PARAMETERS FROM THE CLUSTER OPTIONS
    INTERFACE


