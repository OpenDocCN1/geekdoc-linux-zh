  md: '# CHAPTER 6: Cluster Management


    After setting up the mail server configuration, you must specify where the messages
    will be sent. Cluster Services do not use the email addresses from Remote Manager
    for this purpose. You will have to configure the email addresses in the properties
    of the cluster object. In iManager, this is configured in the General tab of the
    cluster object properties.


    The Notification tab allows you to configure whether you want to receive notification
    of critical events only, or whether you prefer to receive all messages. The latter
    will send emails about everything that happens in the cluster. For example, when
    you migrate a resource to another node, an email notification will be sent to
    you. For day-to-day operations, you probably need to receive critical error messages
    only.


    The messages are formatted with a simple clear-text message:

    Subject: Cluster Resource Change

    Resource: Gw_SERVER State: Offline on Cluster001


    The message format can also be configured as XML. When you change this setting
    in the cluster properties, you will have to stop the cluster and unload and load
    the clustering software. The same Cluster Resource Change message that was displayed
    in normal text will look like this in XML format:


    ```

    <XML VERSION="1.0">

    <CLUSTER-EVENT>

    <RESOURCE-NAME>Gw_SERVER</RESOURCE-NAME>

    <CLUSTER-NAME>Cluster01</CLUSTER-NAME>

    <CLUSTER-TIME>2006 2 8 16:21:33</CLUSTER-TIME>

    <EPOCH>-0</EPOCH>

    <STATE>OFFLINE</STATE>

    </RESOURCE-EVENT>

    </CLUSTER-EVENT>

    </XML>

    ```


    The server that runs the master resource is the one that sends the email messages.
    You never know which node will become the master node, so that is why the configuration
    of the mail server needs to be set up on every node in the cluster. When no emails
    are sent out and the configurations seem to be okay, on NetWare, you can enable
    the SMTP screen on the server that is the master node to check what the software
    is doing. On Linux, this option is not available. Using the following command
    to enable the screen:


    ```

    SMTP SCREEN = 1

    ```


    An extra server console screen will become active and display all SMTP activity
    from the Remote Manager SMTP service. Setting the value to zero disables the screen.'
