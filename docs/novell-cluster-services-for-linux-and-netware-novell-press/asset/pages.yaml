  md: '# iSCSI Target Configuration on OES NetWare


    There are three methods for installing software:


    +   - You can select the component iSCSI Target during initial NetWare server
    installation with the custom installation method selected.

    - You can select a patterned deployment during NetWare server installation and
    select iSCSI Target as a possible deployment pattern. This will install only the
    necessary software for this server to function as an iSCSI target.

    - Using NetWare Deployment Manager (NWDEPLOY.EXE) from the NetWare operating system
    CD, you can add products, including the iSCSI Target software.


    # Creating the iSCSI Target


    After installing the software, you must create an iSCSI target partition in the
    available disk space on your server. If you have never worked with iSCSI before,
    it is good to know that you cannot access the data in this iSCSI partition directly
    on the target server itself. It will be a raw partition with no file system. Only
    after accessing the partition through the iSCSI initiator software can you create
    a file system and access data on the disk. There is no direct relation between
    your iSCSI target partition and the file system that will be created on. For NetWare
    we will use NSS as the file system, but if you connect a Windows server to the
    iSCSI target, you can create an NTFS partition. So at this level of configuration,
    you should not think of the iSCSI partition as a file but as a raw disk partition.


    You can create the iSCSI partition from the NSS Management Utility (NSSMU) at
    the server console. This configuration option is not available in iManager. Perform
    the following steps on the server that will hold the iSCSI target:


    +   1. Start the NSSMU and select Partitions from the main menu.

    2. Click Insert to add a partition on free space available. Browse to the disk
    with the free space where you want to create the partition and press Enter to
    select it.


    TIP


    If the disk is empty but no free space is displayed, you might need to initialize
    the disk. To do this, select Devices from the NSSMU main menu, select the device,
    and press F3 to initialize the disk.


    +   3. In the Selection Partition dialog box, select iSCSI.

    4. Select the size you want to use for your iSCSI partition. Assigning a label
    is optional. We recommend that you assign a label if you are planning to create
    more than one target partition on this server. And because you never know what
    the future brings, always assign a label.'
  merge: -1
  pgno: 160
- img_proc: true
  md: '# CHAPTER 7: iSCSI


    5. Pressing Escape will return you to the Partitions screen, where the new iSCSI
    partition will be listed.


    6. Exit the NSS Management Utility.


    You have now created the partition on the local hard disk that you want to share
    with iSCSI. It is now time to create the corresponding iSCSI target object in
    eDirectory. This object will be used to assign rights to initiators to allow them
    to access the target. The target object will automatically be created when the
    iSCSI target software is loaded. The command file that loads this software is
    in the AUTOEXEC.NCF file by default if the iSCSI target software is installed
    and called TON.NCF. So we first unload the target software and reload it again
    to have the object automatically created.


    NOTE


    Keep in mind that stopping the target software will stop any running iSCSI sessions.
    So if this is an additional iSCSI partition, be sure to perform this task when
    iSCSI sessions can safely be interrupted.


    Perform the following steps to create the iSCSI target object. We assume that
    the software was already loaded on this server so we start by unloading it:


    +   1. At the server console, stop the iSCSI target software with the TOFF command.


    +   2. Next, run the TON command to load the software. The object will now be
    automatically created.


    The iSCSI target object will appear in eDirectory in the server container. You
    can see in Figure 7.9. The object is named with the prefix iSCSI followed by a
    global unique identifier. The last 6 bytes of the name, represented by 12 hexadecimal
    characters, the MAC address of the server. In our example the name is iSCSI-0054c1d8-6241-da11-b2be-000c2921e430
    000c2921e430 is the server''s MAC address.


    NOTE


    If the object is not created, check the server''s Logger Session. If there are
    error messages about failed LDAP connections, re-create the LDAP authentication
    details following the steps in the "Troubleshooting" section at the end of this
    chapter and try again.


    Now that the target object has been created, we will first introduce the iSCSI
