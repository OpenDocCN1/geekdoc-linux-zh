- img_proc: true
  md: '# CHAPTER 5: Creating Cluster Resources


    This unload script makes sure the DHCP resource is stopped, no matter how. Notice
    the ignore_error statements that are used in the script to make that execution
    of the script is not interrupted and the script keeps trying. On the third line
    of the script, the killproc command is used to make sure the DHCP resource is
    terminated. If this does not work within 8 seconds, another method is used to
    terminate the services anyway, this time by using the Linux command fuser. This
    command makes sure that all processes are currently using files in the /mnt/dhcp
    directory are terminated. Next, the exit_on_error statement makes the umount of
    the shared volume is achieved. There is a good reason to use an exit_on_error
    statement is used to accomplish this task: If the volume could not be deactivated
    from this server, it is impossible for the other server to mount it and the service
    will not be able to load on the other server. The exit_on_error makes sure that
    the script terminates and starts all over if the shared volume could not be unmounted.


    14. In the last step, the resource policies have to be set. The following options
    are available:


    +   - Resource Flows Master: This resource will always run on the cluster node
    master.

    - Quorum: Normally, for a service to come up in the cluster, a minimal number
    of cluster nodes has to be available. This minimum is defined as the quorum. If
    you want to overwrite the quorum for this specific resource, select the Ignore
    Quorum option.

    - Start Mode: Select Auto to start this resource automatically when the cluster
    comes up, or Manual if you want to start the resource manually.

    - Failover Mode: If this option is set to Auto, the resource is automatically
    migrated to another node in the cluster if the node it is currently running goes
    down. If you set this to Manual, you have to migrate the resource manually to
    another node after a failure.

    - Failback: The default option of Disable indicates that nothing should happen
    if the original node ran on before that node failed back. Select Manual if you
    want the administrator to decide manually what happens and Auto if you want the
    resource to automatically return to the node that was originally running.


    15. In the final step, you have to assign nodes to the clustered resource. By
    default, all nodes in the cluster will be assigned. Use the arrow keys to remove
    nodes from the list that you don''t want the resource to be activated. Failover
    will take place in the order in which the nodes are assigned: The service will
    run on the first node, and in case of problems it will fail over to the second
    node, and so on. Use the arrow keys to change'
  merge: -1
