    # SPECIFYING THE NAME OF THE SHARED DEVICE


    If a resource uses a shared device, all information should be present in /etc/ha.d/haresources
    to specify how this device should be loaded. For this purpose, two scripts can
    be used, which are both in the subdirectory /etc/ha.d/resource.d. First of these
    scripts is the datadisk script (which is actually a link to the drbdisk script).
    This script has an important task: It activates the DRDB device on the host where
    the resources will be loaded. When loading the DRDB device on this host, the datadisk
    script will make the primary device on this host. In this way, the other host
    cannot write to the DRDB device and all data written to the device will be synchronized
    immediately to the other node. In the line where the shared resource is defined,
    you can see that the datadisk script takes one argument, which is the device name
    of the DRDB device. To separate the name of the script from the name of its arguments,
    two colons are used.


    After specifying what device is used as the shared storage, next the resource
    load script needs to define how that device is to be activated. That task also
    has to be connected to the loading of the resource on a server and never in /etc/fstab;
    if it were handled in /etc/fstab, it would be impossible to migrate the shared
    device from one node to the other. To mount the shared device, the Files script
    that in /etc/ha.d/resource.d is used.'
