    # Adding a NetWare Node to a Linux Cluster


    The description of how to add a NetWare node to a Linux cluster is easy: You can''t.
    In a pure Linux cluster, no NetWare nodes can be added. Also in a mixed cluster,
    it is not possible to add any NetWare nodes.


    # Manually Starting and Stopping NCS


    For management purposes, it is useful to start and stop the cluster manually.
    On OES NetWare, the cluster is started with the LDNCS.NCF script, in SYS:\SYSTEM.
    To unload the cluster on OES NetWare, use ULDNS.NCF. However, before you can successfully
    unload all cluster modules from a server, you have to issue the cluster leave
    command or the cluster down command.


    A complete reference of available cluster commands can be found in Chapter 5,
    "Creating Cluster Resources.",


    On OES Linux, you can unload the cluster software with the cluster down command.
    To join the cluster again after you have brought it down, the cluster join command.'
