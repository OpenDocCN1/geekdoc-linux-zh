    servers are available via the network. Besides this LAN heartbeat, there is also
    the Split Brain Detector (SBD) partition through which the status of servers is
    watched. It is possible to set up a dedicated LAN for the heartbeat channel. The
    benefit of this is when the performance of the LAN drops, the heartbeat remains
    active without interruption. But this advantage is also a disadvantage: When the
    servers cannot contact each other for the heartbeat, the clients might not be
