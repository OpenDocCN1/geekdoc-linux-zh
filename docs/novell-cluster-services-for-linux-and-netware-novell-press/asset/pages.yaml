- img_proc: true
  md: '# Calculating Average Downtime


    There are two terms you should know when to calculate what your downtime can be
    if a component in your environment fails. They are Mean Time Between Failure (MTBF)
    and Mean Time to Repair (MTTR).


    The MTBF is the average time it takes for a component to fail. Let us, for example,
    take a look at a randomly chosen component: the Intel SRCU42L RAID Controller.
    For this controller Intel reports a MTBF of 807,267 hours. If we do the math,
    what will we learn is that this adapter will fail, on average, after 92 years.
    Not really something to worry about, one might say. But of course this is on average.
    There remains a chance that you might be one of the unlucky ones on the low end
    of the scale of the average calculation. And, of course, these numbers are valid
    only when equipment is being used in optimal environments. Intel has its numbers
    on equipment that runs under a working temperature of 55 degrees Celsius, and
    131 degrees Fahrenheit.


    The other statistical number you will need in order to calculate your average
    availability is the MTTR. It will tell you how much time it will to fix the problem,
    by either repairing or replacing the component that fails. This is not something
    you can get from the vendor''s website. It will depend on your hardware and software
    support contract. Will your supplier replace a component in two hours? Four hours?
    And what will you do in case of a software problem? Those are not as easily fixed
    as hardware problems.


    Now that we have both numbers, how do we calculate the average downtime? The formula
    is simple:


    Availability = MTBF / (MTBF + MTTR)


    The most important factor here is MTTR. That is why it is always safe to say that
    the MTTR equals your average downtime if the MTTR is on the low side. The higher
    the MTTR, the lower the availability. In our example of the Intel RAID Controller,
    the formula gives an unbelievable 99.9995% of availability. But of course, this
    is theoretically, based on the entire lifetime of the device, which was 92 years.


    It is therefore more important to look at practical figures and create your own
    reference of failures and the time it took you to fix the problem. This is really
    something where ITIL (IT Infrastructure Library) can help out. If you implement
    it correctly, you will be able to use the Incident Management and Problem Management
    processes to build a history of your IT structure, and with that data you will
    be able to determine what your average availability is. Armed with that information,
    you can start the battle of setting up a Service Level Agreement with your users.'
  merge: -1
