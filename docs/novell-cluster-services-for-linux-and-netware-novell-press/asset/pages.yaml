    # Clustering the NFS Server with Heartbeat


    Basically, the configuration of a Heartbeat cluster is a five-step procedure:


    +   1. Edit the sample configuration files.

    2. Use the authentication keys to ensure secure communications.

    3. Tune the main configuration file /etc/ha.d/ha.cf on both nodes.

    4. Use the configuration file haresources to configure shared resources in the
