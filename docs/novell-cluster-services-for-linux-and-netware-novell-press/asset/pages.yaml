  md: '# Using SUSE Linux Enterprise Server Clustering Options


    This book is about Novell Cluster Services (NCS), and that''s not the same as
    the native Linux clustering options included in SUSE Linux. Because, however,
    in some circumstances it may be useful to use these native Linux options anyway,
    this chapter provides a quick guide to the setup of such a cluster


    # Heartbeat Versus Novell Cluster Services


    Without any doubt, in large business environments NCS is the better choice to
    provide high availability for business-critical services. There are various advantages
    offered by NCS as compared to the Linux Heartbeat software. Among these advantages,
    one of the most important is the inclusion of the entire configuration in eDirectory;
    therefore, the administrator can manage the entire configuration of his cluster
    from one central point in the network. Another major advantage is that NCS offers
    support for up to 32 nodes,'
  merge: -1
  pgno: 264
- img_proc: true
  md: '# CHAPTER 11: Using SUSE Linux Enterprise Server Clustering Options


    whereas at the moment this was written, support for more than 2 nodes was not
    stable yet in the Heartbeat software. Other advantages of NCS over Heartbeat are
    support for the NSS file system, support for mixed clusters to migrate from NetWare
    to Linux, and, of course, Novell''s strong support for this software is by its
    worldwide support organization.


    Despite all these advantages, in some scenarios an administrator might want to
    choose native Linux clustering services. One reason to do this is that high availability
    is needed for a service at a branch office where eDirectory is not used. In a
    pure Linux environment, Heartbeat may also be the better choice because it is
    free software that doesn''t require any licenses to install.


    The Heartbeat package is a good choice to deliver such a high-availability solution.
    You should, however, beware that Heartbeat is not the only option available for
    Linux clustering. It is, however, very stable cluster solution that is included
    with SUSE Linux Enterprise Server by default, and for that reason it is covered
    in this chapter. The goal of this chapter is not to give a complete overview of
    all options available with the Heartbeat software, but to give the administrator
    who wants to implement it a quick start to set up such a cluster.


    # Installing SUSE Linux High-Availability Components


    SUSE Linux Enterprise Server, all software to create a two-node cluster is available
    by default. We will first cover how to install this software:


    +   1. From the SUSE Linux Enterprise Server console, start YaST and enter the
    password of the root user.

    2. Select Software, Install and Remove Software.

    3. From the Filter option, choose Selections. Next, make sure that the option
    High-Availability is checked as shown in Figure 11.1. This will select all software
    modules to install and manage a cluster based on the Heartbeat packages.

    4. Click Accept to install the required software.


    254'
