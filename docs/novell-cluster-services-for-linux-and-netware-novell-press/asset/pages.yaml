  md: 'The third component that you see in Figure 1.3 is the SAN. The data you store
    in the cluster must also be available on the remote site. Therefore the data must
    be synchronized in some way. There are three general ways of doing this:


    +   - SAN-based mirroring

    - Host operating system-based mirroring

    - Snapshot-based solutions


    Your choice of a data transport solution is limited to factors like available
    bandwidth and cost. But there are also technical factors to take into consideration.
    With the mirroring solutions the loss of data is almost zero. With only the that
    is still in cache will be lost. With a snapshot solution the data that was generated
    since the last snapshot point will be lost.


    The fourth and last component in Figure 1.3 is the clients. For those there are
    two things you should look into. The first is technical. What will have to be
    done with the IP addressing, for example? If your clients are still on the original
    subnet, how do they access the services that have failed over to the remote site?
    The most important question is this: Where are your clients? Are they still there?
    If you have to do a failover because you had to evacuate the area, where do you
    continue your business with your clients? Preparing for this is as important as
    setting up the technical staff.


