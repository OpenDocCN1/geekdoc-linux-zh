- img_proc: true
  md: '+   exit_on_error: This command makes sure that the script is stopped if an
    error occurs. If the timeout value assigned to the cluster resource has not been
    surpassed already, the script will run again until it succeeds or the timeout
    value is passed.


    +   ignore_error: In some cases, errors must be ignored. This feature is often
    used in cluster-stop scripts. The reason this statement is used is that in a cluster
    stop script it is important that the resource be stopped, and it is not really
    important to do it in the best possible way.


    In the resource load and unload scripts, some cluster-specific commands can be
    used as well. These are the commands you can use from the console as well as manage
    the cluster and its resources. An overview of these commands is provided in the
    next chapter.


    # Summary


    In this chapter you learned how to create some cluster resources that are not
    too complex. You read how to set up shared volumes on NetWare and on Linux as
    well. You also learned how to cluster the DHCP server on both platforms. At the
    end of the chapter, a summary was given of the functions that can be used in resource
    load and unload scripts. In the next chapter, you will get more details on how
    to work with the cluster management applications.'
