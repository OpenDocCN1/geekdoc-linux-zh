  md: '# CHAPTER 2: Examining Novell Cluster Services Architecture


    # CLUSTER VOLUME RESOURCES


    In a NetWare environment, a shared disk that is used by Novell Cluster Services
    must contain Novel Storage Services (NSS) volumes. These volumes can be either
    cluster enabled or regular. Both of these volume types can fail over to another
    server when a node failure occurs. In a Linux environment, NSS is not the only
    file system that can be used. Traditional Linux file systems such as Reiser and
    ext3 can be used as well.


    If an NSS cluster-enabled volume is used, eDirectory objects are created:


    +   - Cluster Volume: This is the "normal" volume object, used to represent the
    cluster-enabled volume.


    +   - Cluster Volume Resource: This object is similar to the resource objects
    used for clustered applications. It maintains the load script and unload script,
    as well as other cluster-related properties of the volume.


    +   - Cluster Virtual Server: This is a virtual server object that hosts the clustered
    volume. This object is needed because a clustered volume is not bound to a physical
    server. Instead, the virtual server acts as a proxy to bind the cluster volume
    to a real server. The advantage of this solution is that the cluster volume will
    not go down if some node in the cluster goes down.


    A cluster-enabled volume is not needed in all scenarios. If an NCP client reconnect
    to a volume is not needed and if no fixed server name is either, you can do without
    cluster-enabled shared disk volumes. When a node failure occurs with a volume
    that is cluster-enabled, the cluster resource manager module will simply mount
    the volume on some other node and execute the associated load script.


    # RELATION BETWEEN EDIRECTORY OBJECT AND LOCAL FILES ON THE CLUSTER NODE


    There is a relation between the objects in eDirectory and local files that are
    kept locally on cluster nodes. The eDirectory information is cached in files /etc/opt/novell1/ncs
    (see Figure 2.2). In this directory, the load and unload scripts of all resources
    in the cluster are stored. You can locate these files with the files .load and
    .unload extensions. This directory also contains all eDirectory attributes as
    .conf file. For example, the protocol properties that are at the cluster container
    level are stored in the gipc.conf file. As an administrator, nd-config is a user-space
    Lightweight Access Protocol (LDAP) client responsible for synchronizing data between
    eDirectory and the local files. Apart from the information that is in /etc/opt/novell1/ncs,
    another important part of the cluster status and configuration information can
    be found in /_admin/Novell1/Cluster. For example, the current state of the nodes
    in the cluster is saved here.'
  merge: -1
