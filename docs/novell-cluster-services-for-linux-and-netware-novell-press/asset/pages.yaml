  md: '# CHAPTER 1: Introduction to Clustering and High Availability


    # Availability Defined


    System administrators and end users do not look at availability from the same
    perspective. Where the system administrator sees a server that is available, it
    does not mean that the end user has available service. This is the most common
    misconception when we talk to system administrators and IT managers when they
    are looking into introducing high-availability solutions into their environment.
    Installing a cluster does not provide instant availability. There is more to the
    definition that is important to look at.


    Let us first define availability. If you look it up in the dictionary, you will
    find that available means present or ready for immediate use. And this is really
    the heart of everything we will be talking about in this section: being available.
    We will use the end user''s perspective because that is all matters. The users
    and the services they need are the sole reason the IT infrastructure exists. There
    is no company or organization that runs servers just for the purpose of running
    servers. For the end user availability means this: I can use the service that
    I am allowed to access. This can be something as simple as a word processing application
    or a spreadsheet program. Or it can a more complex service such as email and document
    management, or accounting software. So whether a service is available is really
    simple from the perspective of the end user: Can I access my email? Answering
    this question with yes availability, answering with no means nonavailability.


    To the end users, it does not matter if a server was down, a network switch was
    broken, or if the post office was. They cannot access their email and there is
    no availability.


    If you look at your IT infrastructure from this perspective, you should be able
    to see that there are more components you need to look into just clustering your
    servers. Of course, this is the topic of this book. Later in this chapter we will
    discuss what else you need to look into to improve the level of availability of
    your infrastructure.


    # High Availability Defined


    Now that we have looked into what availability is, we can explore the world of
    high availability. The use of word high implies that we get more than normal availability,
    but clearly not availability without any disruption. Otherwise, we would have
    used a term such as nonstop or continuous availability. No, we call it high availability.
    How high depends on the solution you implement.


    In general, vendors of high-availability solutions will talk about the level they
    offer in terms of a percentage of downtime. It is really impossible to just look
    at the numbers and decide which solution is the best. An example is a vendor that
    claims 100% availability. The offering'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'includes redundant hardware with up to three main boards, multiple network
    interface cards, and so on. You might ask yourself what happens when I need to
    reboot the server? Does it not lower the percentage of availability of the system?
    According to this vendor it not because he means that your system will be available
    during the business hours that are available and you will have to keep a maintenance
    window open for such operations.


    So if you are looking for the percentage of availability you need, you will first
    have to do the math and gather all the details.


    Are there solutions that will give me 100% availability per year, 24 hours per
    day? Yes, there are. But they are really a completely different solution than
    the Novell clustering offer we will be looking into this book. Examples of servers
    that have an extremely high level of availability are the ones used by financial
    institutions that payment services for ATMs and payment consoles in shops and
    restaurants. A downtime of 30 minutes on a busy Saturday afternoon will be guaranteed
    to make it into the evening news. The machines that are being used are very reliable,
    and mostly they are also clustered in a way that will never let the services stop.


    What you could read in the preceding section is that there are several types of
    clusters. The solutions described in the preceding paragraph are not based on
    failover but on clusters of servers that keep one or more tasks running, in which
    no single machine has a critical role. That type of clustering allows for the
    highest availability possible. Of course, the price tag for such a solution is
    also the highest possible. If the IT manager or the users complain about a maintenance
    window from midnight to 6 a.m. or about a downtime during business hours of an
    hour per day, you can do the math for them to determine what that last hour of
    availability would cost the overall cost when you choose to have a little lower
    availability.


    Let us now the math to see what level of availability we get if we choose a solution
