  md: '# Upgrade Methods Explained


    This will work only when your current environment is a NetWare 6.5 cluster. If
    you have an older environment with NetWare 5.1 or later, data trustees can be
    transferred to OES Linux using the Server Consolidation Utility, which is part
    of the Server Consolidation and Migration Toolkit.


    # MIGRATING FROM WINDOWS TO NETWARE OR LINUX


    In the event that you have a Windows environment that you want to migrate to an
    Open Enterprise Server environment with either NetWare or Linux, you can use the
    Server Consolidation Utility to migrate your environment to Open Enterprise Server
    NetWare or Linux. The destination server can be a standalone server or a cluster
    node.


    # Installing New Cluster Hardware and Software from Scratch


    In the previous two topics we have described how to upgrade or migrate in the
    existing environment. This means that you will keep your eDirectory tree with
    everything in it, including trustee assignments and other specific information
    in your storage environment. We have worked at customer sites where the decision
    was made to build a new environment alongside the existing one, complete with
    a new eDirectory tree, and to move to this new environment by pulling the plug
    of the old servers and having users log in to the new environment.


    Such an upgrade path brings a lot of manual labor, and you will need much expertise.
    User objects and other eDirectory objects, such as application objects, must be
    re-created, and in many cases this requiring existing information and importing
    it into the new environment.


    The reason to start with such a project is very often that customers see problems
    in their environment that they expect to remain after the upgrade. For example,
    there may be application objects that contain a snapshot of a Windows environment
    that distributes unwanted settings to destination computers.


    It is our belief that in all situations it is possible to migrate to a new environment
    with the existing eDirectory tree using the utilities supported by Novel such
    as the Server Consolidation Utility. It only requires you to have the right expertise
    in the project team. For example, you would need an engineer with eDirectory knowledge
    to analyze the existing environment, perform health checks, and prepare the environment
    for the new operating systems. And maybe a ZEN specialist who prepares applications
    to be used in the new environment by moving snapshot applications to MSI-based
    distributions.


    The bottom line is that customers are sometimes afraid to migrate garbage into
    more garbage. But when cleaning up during the process is done by experienced garbage
    men, the new environment can run bright and shiny.'
  merge: -1
  pgno: 246
- img_proc: true
  md: '# CHAPTER 10: Upgrading Clusters


    # Technical Upgrade Methods Explained


    In this section we explain the technical procedures needed to upgrade clusters
    for NetWare-to-NetWare upgrades and for NetWare-to-Linux upgrades. In the last
    part of this section, you learn how you can also use the Novell Consolidation
    and Migration Toolkit to migrate NetWare and even Windows servers to NetWare and
    Open Enterprise Server Linux.


    # Upgrading a NetWare 5.1 Cluster to NetWare 6.5


    In-place upgrade is the only one from this chapter in which the service to your
    end users will be interrupted for a longer time. Clusters that run with NetWare
    5.1 servers that need to be upgraded to NetWare 6.5 cannot stay online while being
    upgraded. A direct upgrade to OES Linux is not supported. If you want to take
    that giant leap forward then NetWare 6.5 is a required intermediate step.


    A NetWare 5.1 cluster must be prepared with Deployment Manager. The reason for
    this preparatory step lies mostly in the fact that the upgrade will be an upgrade
    from NSS version 2 to version 3. File-system trustee rights are handled differently
    in the new version used since NetWare 6. The local NDS directory database object
    ID for objects is no longer used; it is replaced by the object''s Global Unique
    Identifier (GUID).


    > NOTE


    > Because file-system rights were stored in the file system with local object
    identifiers from the NDS/eDirectory database, the rights had to be modified when
    the volume was migrated to another server. The migrating process took care of
    that. Because the rights are now stored by using the GUID, the trustees are not
    server-centric, the trustees are the same on every server and the migrating process
    has become obsolete.


    # MEET THE NETWARE 6.5 SYSTEM REQUIREMENTS


    Before upgrading the cluster, you must check whether you meet the system requirements
    for your upgrade to NetWare 6.5. Check the items in the following list to determine
    you you ready for the upgrade:


    +   - Check the hardware requirements of the server to see whether you have sufficient
    storage space and memory available. Also verify that your hardware is supported
    for NetWare 6.5—check which drivers are available for all devices and so.

    - Verify that all applications you run on the servers are supported on NetWare
    6.5. If you need to be upgraded, uncomment them in the cluster load script before
    you start the upgrade. After the cluster upgrade, when you have upgraded the applications
    to the new version, uncomment them again. Do not forget to check your backup software.'
  merge: -1
  pgno: 247
- img_proc: true
  md: 'Make sure that you obtain licenses for all nodes. NetWare 6.5 comes with two
    nodes, so when upgrading a cluster with three nodes or more, make sure that you
    have the extra licenses at hand.


    # PREPARE THE NETWARE 5.1 CLUSTER


    To prepare the cluster for an upgrade, perform the following steps. Be aware that
    the cluster will be stopped by this process. So really it is a preparatory step
    you take right before upgrading the servers to NetWare 6.5.


    # NOTE


    It is important to use the Server Health Utility from Deployment Manager before
    even considering your cluster. You first want to verify whether the servers can
    successfully be upgraded before you perform these steps. You do not want to find
    out halfway through the upgrade that not enough disk space is available, for example.


    Here''s what you should do:


    +   1. Log in to the NetWare 5.1 cluster.

    2. Start Deployment Manager (NwDEPLOY.EXE) from the root of the NetWare 6.5 operating
    system CD-ROM.

    3. From Deployment Manager, under the first menu named Network Preparation, select
    the option Prepare a Cluster for an Upgrade.

    4. Click the link Prepare a Cluster. This will start the cluster installation
    program.

    5. When prompted, enter the required information: name of the cluster object,
    tree name, and context where the cluster object is located. Click Next to continue
    the upgrade. All cluster nodes will be notified by the Cluster Services Installation
    application. You can watch their loading from the server console on each node.

    6. When the process is finished, a message will be displayed that Novell Cluster
    Services has successfully pre-upgraded. The command to load cluster services (LDNCS.NCF)
    will now be commented out in the server startup file on every node, and a command
    to not activate volumes will be added (/NS /AutoDeactivateVolume=ALL). These commands
    will need to stay there until the servers are upgraded and will be updated automatically
    after the cluster upgrade.


    # UPGRADE THE NETWARE 5.1 SERVERS


    At this point you must upgrade the cluster nodes to NetWare 6.5. Follow the directions
    from Novell''s documentation website at www.novell.com/documentation.'
  merge: -1
