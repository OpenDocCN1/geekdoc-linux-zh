    now be started. If it has started successfully, you will see yin/yang-icon on
    the driver to indicate that it is running. After the first driver is up, do the
    same for the second driver.


    TIP


    If you are not really into Identity Manager, troubleshooting is difficult. If
    you can''t get the drivers synchronizing to each other and you are sure that you
    have completed all steps as listed in this procedure, we recommend that you delete
