- img_proc: true
  md: 'We will discuss the configuration of the Heartbeat software based on an example.
    In this example, the NFS server will be configured for high availability. The
    server will use the DRBD device as the shared storage device.


    # Edit the Sample Configuration Files


    To make it easier for you to configure the Heartbeat software, some sample configuration
    files are provided. An easy way to get started is by copying these configuration
    files to the directory /etc/ha.d on servers. You can find these in the directory
    /usr/share/doc/packages/heartbeat. Three of these are of particular interest:


    +   - authkeys: This file is used to secure communications between nodes with
    authentication keys.

    - ha.cf: This is the main configuration file in which default behavior of the
    Heartbeat software is specified.

    - hahaources: In this file, the shared resources are defined.


    # Use Authentication Keys to Ensure Secure Communications


    On a secure network, it is not of highest importance, but if traffic between nodes
    has to cross secure links, an important option is the usage of authentication
    keys to secure the communication between both nodes. The structure of this file
    is really simple; just two lines of configuration are needed. In the first line,
    you specify which type of authentication needs to be used. For this purpose, you
    can choose from crc, sha, and md5. Crc is the ideal solution for a network that
    has already been secured by other means; it doesn''t offer any real security and
    is therefore the fastest option on a secure network.


    The other two options are sha and md5. Both are secure, so it doesn''t really
    matter which one is used. In the code listing that, you see all relevant lines
    that have to be created in /etc/ha.d/authkeys to ensure that authentication can
    take place in a secure manner:


    ```

    #

    auth 3

    #1 crc

    #2 sha secret

    3 md5 nouvel

    ```


    In this example, you can see that the type of authentication that has to be used
    is referred to the line auth 3. The number 3 refers to the third line in the configuration
    file, where md5 authentication is configured for the shared secret. After creating
    this file on one of the nodes, you can copy it to the other. Use scp as in the
    following example to do this:

    scp /etc/ha.d/authkeys othernode:/etc/ha.d'
  merge: -1
  pgno: 271
- img_proc: true
  md: 'As a last step, you need to ensure that the permission mode for the files is
    set to 600 on both nodes. Use the following command to accomplish this task:

    chmod 600 /etc/ha.d/authkeys


    # Tune the Main Configuration File ha.cf on Both Nodes


    One of the main tasks in successfully configuring the Heartbeat cluster is to
    configure the main configuration file ha.cf. In this file the Heartbeat software
    is defined. The file should be more or less the same on both nodes, some parameters
    are node specific. The first parameters you have to enable look rather trivial,
    but will make you happy later; these are the parameters to enable logging. Using
    all logging mechanisms; it will make it easier for you later to troubleshoot why
    the software isnt acting the way you like it to. Be sure to remove the hash sign
    used to comment out of the following three lines to enable full logging:


    ```

    debugfile /var/log/ha-debug

    logfile /var/log/ha-log

    logfacility local1

    ```


    Next, you need to specify how often heartbeat packages are sent across the network
    and when the other node will be considered dead. The following lines are used
    to specify this:


    +   - keepalive 2

    deadtime 30

    warntime 10

    initdead 120


    Of these parameters, the keepalive parameter specifies that a heartbeat message
    should be sent every 2 seconds. In some environments, this will absolutely be
    too long, so you consider setting it lower, for example, to 500ms. The next parameter
    is very important as: the deadtime defines when a service will officially be considered
    dead and services will start to fail over the other node. By default, this is
    only after 30 seconds. For some environments this is absolutely too long, so you
    consider setting lower. Then there is the warntime parameter, which specifies
    when the first warning about a service not available is sent to the log files.
    Last, the initdead parameter specifies the timeout value used after the service
    starts. The default value gives the other node 120 seconds to come up and activate
    its resources. If it isnt up after this period, the other node will be considered
    dead and services will start on the remaining node. Because it can take some time
    for another node to come up, it is recommended to give this parameter a rather
    high value.


    The last options that need to be set in ha.cf are the names of the cluster nodes.
    The names of the nodes included here should be exactly the same as the names of
    the nodes displayed when'
  merge: -1
  pgno: 272
- img_proc: true
  md: '# CHAPTER 11: Using SUSE Linux Enterprise Server Clustering Options


    using the uname -command on these nodes. These parameters could, for example,
    look like

    the following:


    node server1

    node server2


    Apart from these required options, many other options can be used as well. For
    example,

    there are parameters to define the failover and fallback behavior of resources
    in the network,

    there are parameters to define how heartbeat packets should be sent in the network.

    Consult the ha.cf man page for more information about these options.


    After creating the ha.cf file on either one of the nodes in the cluster, be sure
    to copy it to the

    other node. You can do this using the scp command as shown here:

    scp /etc/ha.d/ha.cf othernode:/etc/ha.d


    # Create Shared Resources by Editing the haresources File


    Now that the generic parameters for the Heartbeat software have been configured,
    it is time to

    define the shared resources on the network. This is done in the configuration
    file

    /etc/ha.d/haresources. In this file the following tasks have to be accomplished:


    +   - Define the name of the primary node where the resource should run

    - Define the IP address on which the shared resource can be used

    - If used, specify the name of the shared device that should be used

    - Specify which service or services should be loaded as shared resources


    Following is an example of a line used to load the nfsserver as a shared resource:

    brdb1 192.168.0.23 dataisk::drbd0 Filesystem:/dev/drbd0::data::reiserfs nfsserver


