  md: '# CHAPTER 3: Clustering Design


    have at least three copies of an eDirectory partition to provide high availability
    for eDirectory itself (one master replica and two read/write replicas). If you
    had only two, whenever you have to bring a server down for maintenance or when
    a server failed, you would have no fault tolerance with only one single replica
    remaining. The same rule applies to building a cluster.


    When looking at the number of cluster nodes you will need, it is important to
    first decide what services you want to run on these servers and the server requirements
    are for these applications. With that information, you can decide on the number
    of cluster nodes you will need. In most scenarios for up to six servers being
    replaced, it is a good idea to add one extra server to that needed number of cluster
    nodes. That way you can be certain that when a server fails, there are enough
    resources available on the remaining nodes that all resources run without loss
    of performance. For this to work efficiently, create a failover matrix to define
    what cluster nodes will fail in case of failure. How to create a failover matrix
    is explained later in this chapter.


    For larger clusters from 6 up to 32, it will probably not be the case that you
    are replacing existing servers with a cluster solution. But even when this is
    the case, there will likely be enough resources available in the cluster to run
    the services from a failed node, if you have created an efficient failover matrix.


    When designing a cluster solution, you should also keep in mind that you can install
    two or more clusters in your environment. It might not be practical to build a
    large cluster of 16 nodes to run all your services. Even if your hardware and
    storage area network (SAN) scale up to this number of nodes, you should keep in
    mind if you would ever need to maintain the entire cluster, it affects your entire
    environment. Also, you cannot delegate part of the cluster administration to different
    administrators. This can especially important in larger environments with a large
    number of servers, where, for example, a group of administrators can be in charge
    of application servers and another group handles file and print servers. To not
    have them interfere with each other, could be better to have more than one cluster.


