  md: '# Avoiding Downtime


    You can also increase availability by using virtualization techniques such as
    Xen and VMware ESX Server. These solutions remove the hardware layer from your
    operating system and provide a reliable hardware platform where you run your servers
    as virtual machines. This way you do not have to implement hardware redundancy
    in every server, but you just implement that on the base virtualization hardware.


    # Environment


    In this category you find all loose ends that can help you improve availability.
    Serious administrators may laugh about some of them, but believe us when we say
    that we have seen it all, and worse these solutions in your environment:


    +   * Attach critical equipment to a reliable power source and use a backup such
    as a UPS. Also, do not attach noncritical equipment to a UPS, to prevent using
    unnecessary resources from your power supply.


    +   * Work nearly and do not plug cables into patch panels and let them cross
    the room as trip wires.


    +   * Secure access to the server room to prevent unauthorized personnel from
    accidentally breaking something. Everyone knows some anecdote in which a cleaning
    lady unplugged the server to plug in the vacuum cleaner.


    +   * Implement a cooling solution that keeps all your equipment operating within
    the specified temperature bandwidth. And do not forget to monitor the temperature
    inside the servers with your server vendors'' monitoring tools.


    +   * When planning your server room, look at the big picture. Is your area below
    sea level? Do not put servers in the basement. The second or third floor is probably
    always your best choice.


    # Software


    This is probably the category with the hardest problems. For software failures
    it is sometimes very hard to track down the cause. And when you easily replace
    a hard disk or a network adapter, it is not always possible to replace a component
    in a software solution with multiple libraries and executables. There are, however,
    things you can do to prevent software failures:


    +   * Test, test, test before you implement new software or a new version into
    your production environment.'
