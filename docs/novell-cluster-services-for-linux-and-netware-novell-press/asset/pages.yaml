    the cluster itself and the resource in the cluster can be edited as well. Before
    you do any of these, you have to select the cluster object in eDirectory. After
    selecting this object, you will see an overview of all objects such cluster nodes
    and cluster resources that exist in this container. Then you can modify the properties
    of all of these objects.


    TIP


