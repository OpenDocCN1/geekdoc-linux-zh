- img_proc: true
  md: 'When we add iSCSI to this setup, nothing changes on the application or operating
    system side. It still uses the regular operating system calls to communicate with
    a device, but instead of communicating with a SCSI device driver, it communicates
    with an iSCSI driver disguised as a SCSI driver. For NetWare it is the ISCSIAM
    driver; for Linux it is a kernel module called iscs (which you can check with
    the ismod command). In other words, this new driver receives requests as a normal
    disk does, but sends them to a storage device through the network without the
    application knowing about extension.


    Figure 7.3 shows the communication flow for the iSCSI storage protocol. In this
    example an application writes to or reads from a disk that seems to be local.
    The iSCSI driver sends the request across the TCP/IP network, where the iSCSI
    target takes care of handling the request on behalf of the iSCSI initiator.


    FIGURE 7.3


    Disk access flow in an iSCSI storage network.


    ![](img/0824e0f841046b33f07fbd84ce9da816_152_0.png)


    NOTE


    In Figure 7.3 we have explicitly displayed a physical disk and not necessarily
    a SCSI disk. This is because an iSCSI target partition on a NetWare server can
    be created on both a SCSI disk and an IDE disk.'
  merge: -1
  pgno: 152
- img_proc: true
  md: '# CHAPTER 7: iSCSSI


    It is important to understand that the server holding the target partition does
    not have local access to the data on the iSCSSI partition. iSCSI is a disk access
    protocol and has nothing to do with file systems. It is the iSCSSI initiators
    that will create a file system on the target disk. If the server holding the physical
    disk needs to access the data, the only way for it to do that is by starting an
    iSCSSI initiator session. It is not recommended for permanent production environments
    to operate a server that accesses its target as a local initiator.


    # iSCSSI Naming Guidelines


    The iSCSSI specification defines the naming rules used for iSCSI targets and initiators.
    We will look into the way these iSCSSI Qualified Names (IQNs), as they are called,
    are created in the Open Enterprise Server environment.


    An iSCSI Qualified Name (IQN) is constructed of the following components:


    ```

    iqn.date.organizational_name.authority:string

    ```


    defined by organization or local naming authority


    Let us analyze this naming scheme with an example that will be used for an iSCSI
    target later in this chapter:

    iqn.1984-08.com.novell:iscsi-0054c1d8-6241-da11-b2be-000c2921e430.oesnw3.srv.oes


    The target can be identified as an iSCSI target by the IQN prefix. The next part
    is a date field. This is the date that the company, Novell in this case, has registered
    the name being used in the next part.


    The organization name is the reversed DNS name of the company that provides the
    iSCSI target. It is possible for your own implementation of iSCSI solutions to
    use your own company naming, but everything you do in the OES environment will
    be with Novell''s identifier.


    In compliance with the naming standard, a colon (:) is used to divide the DNS
    naming part from the unique string that identifies the iSCSI target. Novell has
    chosen to use iscssi as an extra prefix, followed by a unique identifier for the
    iSCSI target or initiator and the full distinguished name of the server where
    the target is hosted.


    # Using iSCSI in an Open Enterprise Server Environment


    Now that we have looked the story behind iSCSI, it is time to look into how we
    can use this protocol in the Open Enterprise Server environment. We will start
    with some usage scenarios for iSCSI, and later in this section we will discuss
    the technical requirements and limitations.'
  merge: -1
  pgno: 153
- img_proc: true
  md: '# Using iSCSI in an Open Enterprise Server Environment


    # iSCSI as a Server OS–Independent Storage Platform


    First and foremost, iSCSI is a storage protocol providing access to storage via
    a network. This is really the most simple implementation. A server with an iSCSI
    target or a hardware iSCSI target provides access to disk storage, and iSCSI initiators
    can be used with different operating systems to connect to the storage. Figure
    7.4 shows a diagram of the most basic of iSCSI solutions. In this example the
    target server would contain more than one target to which every initiator can
    connect individually.


    FIGURE 7.4

    iSCSI in its most basic form.


    ![](img/0824e0f841046b33f07fbd84ce9da816_154_0.png)


    The great thing about iSCSI is that it is available on many platforms. In this
    book we focus on NetWare as a target for iSCSI storage networks, but there is
    also iSCSI software available for other platforms, and specific hardware can be
    used to provide an iSCSI target. On the other side, support for iSCSI initiators
    is even bigger. For all major operating systems, software exists to connect to
    an iSCSI target. Because of that, iSCSI is also very useful in building a cross-platform
    storage solution. NetWare can be used as the central location for storage, and
    all platforms, including NetWare, Linux, and Windows, can connect to the available
    storage. And not only can servers access storage across the network, but also
    client computers can be configured to access iSCSI targets.'
  merge: -1
  pgno: 154
- img_proc: true
  md: '# CHAPTER 7: iSCSI


    # iSCSI as a Low-Cost Shared Storage Solution


    The preceding paragraph describes iSCSI as a storage platform for multiple operating
    systems. In that example the NetWare 6.5 server would be servicing multiple clients,
    but they would all access their own target. You can compare that to a SAN where
    there are Logical Units (LUNs) assigned to servers. But iSCSI can also be used
    to create a shared storage solution for clustering use. Figure 7.5 shows an example
    of a simple setup with three servers running Open Enterprise Server, either NetWare
    or Linux, or even mixed, that connect to a shared iSCSI target.


    FIGURE 7.5

    iSCSI can be used to build a low-cost clustering solution.


    ![](img/0824e0f841046b33f07fbd84ce9da816_155_0.png)


    Building a cluster with shared storage via iSCSI can even be done with existing
    hardware. If your organization has the server hardware and networking equipment
    to build such a solution, the only things you would need to buy are iustering
    licenses. Setting up a three-node cluster or larger because a two-node license
    is always included with Open Enterprise Server.


    # iSCSI for Remote Storage


    Many organizations have used the available maximum cable lengths of Fibre Channel
    to make storage from a central location to servers on other sites. This can be
    on the same campus but also somewhere else in town. With iSCSI, doing this has
    become simpler because the TCP/IP infrastructure can be used to set up the storage
    network—given, of course, the bandwidth is sufficient for your storage needs.
    Figure 7.6 shows an example of the setup for storage on a remote site through
    the use of iSCSI.'
  merge: -1
