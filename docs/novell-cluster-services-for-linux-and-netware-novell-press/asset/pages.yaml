    # Cluster Modules


    The Novell Cluster Services software consists of different functional parts. In
    this section we will discuss how these parts interact with each other. An overview
    of these parts is provided in Figure 2.3.


    # CLSTRLIB


    The first thing to notice from Figure 2.3 is that there is no real difference
    between the modules on NetWare and the modules on Linux. First, there is the cluster
    configuration library CLSTRLIB. This library provides the interface between Novell
    Cluster Services and eDirectory. It is the responsibility of the cluster configuration
    running on the master node to access all cluster-related configuration from eDirectory.
    The master node stores this information in its memory so that it is available
    for all other modules used by the cluster software. The master node is also responsible
    for transmitting this information to all other nodes in the cluster. As changes
    occur to the cluster configuration in eDirectory, CLSTRLIB accesses the changes,
    updates the information in its memory, and then transmits it to the other cluster
    nodes.'
