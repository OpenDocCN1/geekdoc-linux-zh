  md: '# Clustering iFolder on OES Linux


    In this section we describe how to configure iFolder 3 on an OES Linux cluster.
    iFolder version-3 is not available for NetWare. It is based on Mono and development
    environment is not available on NetWare. Novel does not have plans to port this
    software to NetWare. Because the software and online documentation for iFolder
    version 2.x on NetWare have been around for a while, we decided not to add that
    part to the book.


    When installing the OES Linux servers that will become your cluster nodes, preferably
    not configure iFolder 3 during initial installation. It is better to first configure
    the entire cluster, the shared storage for iFolder and then install the iFolder
    software on each node in the cluster.


    # Linux Cluster Preparations for iFolder


    We start our configuration when the cluster is fully functional and a shared EVMS
    volume exists to be used by the iFolder server. In our example the shared partition
    is mounted at the root of the file system /ifolder. Do not forget to create this
    point on all nodes. By preparing the volume up front, we can easily activate the
    installation volume on each of the wanted cluster nodes. We start the configuration
    of iFolder with the resource online on the first node, as displayed in Figure
    8.11.


    FIGURE 8.11

    We start with the volume and cluster resources configured.


    ![](img/0824e0f841046b33f07fbd84ce9da816_201_0.png)'
  merge: -1
  pgno: 201
- img_proc: true
  md: '# NOTE


    There is no need to use NSS as a file system for iFolder. No rights are needed
    for end users to access the files directly. All operations are managed through
    the iFolder Apache server. So a traditional Linux file system is sufficient for
    this application.


    Create a cluster resource based on the Generic_IP_Service template. Do not use
    the iFolder template that is used for iFolder version 2.x. In the cluster load
    and unload scripts, configure only the mounting of the volume and the secondary
    IP address. The load script of the resource in Figure 8.11 is as follows (for
    simplicity we left out the comments):


    ```

    . /opt/novell/ncs/lib/nscfuncs

    exit_on_error -t reisers /dev/evms/lvm/cluster1/iffolder

    exit_on_error add_secondary_ipaddress 10.0.0.70

    #exit_on_error /etc/init.d/myservice start

    exit

    ```


    Notice that the command line where the service starts has been commented out.
    We use the resource only for setting up the disk and IP address.


    What you need to plan is what secondary IP address will be used by the iFolder
    server. We will use 10.0.0.70 in our example because our cluster servers are configured
    with 10.0.0.61 and 10.0.0.62 and the cluster master via 10.0.0.65.


    Because iFolder works with a secure environment using HTTPS on the Apache web
    server, it is necessary to make sure that all nodes in the cluster use the same
    certificates for Secure Sockets Layer (SSL) communications. If you were to use
    the default server certificates, it would never point to the correct iFolder server
    when that service moves from node to node during its life cycle.


    We therefore start with the configuration of these certificates. In a production
    environment where you have purchased a certificate from a third party, such as
    Verisign or Thawte, to be used for secure communications via the Internet, we
    suggest that you use that certificate. In the description that we follow a certificate
    with OpenSSL that can be used for testing purposes. The certificates are as secure
    as you though, but they are not verified and thus, for example, a browser would
    prompt the user with a message to say that the source of communications cannot
    be verified. Perform the following steps to configure your certificates:


    +   1. Prepare a DNS name for your iFolder clustered server in the network, and
    make sure that each cluster node is able to resolve that name. In our example
    we use ifolder as the hostname.

    2. On the host where the iFolder resource is, open a terminal and create a directory
    to store the certificate files on the shared volume, with example, the'
  merge: -1
  pgno: 202
- img_proc: true
  md: 'command mkdir /folder/cert. Make this directory your current directory to ensure
    that all files are created in this directory and you do not need to provide full
    pathnames in your commands.


    +   3. On the same host create a private key in a file with the following command:

    openssl genrsa -out private.key 1024


    +   4. The generated private key file can now be used to request a certificate
    from the certificate authority (CA) on your host. For this we need to create a
    certificate signing request (CSR). Create such a request in a file with the following
    command:

    openssl req -new -key private.key -out request.csr


    Answer the questions with information that matches your environment. The most
    important answer is the Common Name to be used in the certificate. This must match
    the exact full qualified DNS name of your ifolder server. If your server, for
    example, can be reached at ifolder.OESCorp.com, that would be your Common Name.


    +   5. Now create the certificate use by Apache with the following command. This
    will actually use the private key and the certificate signing request and have
    it signed by your CA.

    openssl x509 -req -days 30 -in request.csr -signkey private.key -out ifolder.cert


    +   6. Delete the certificate signing request rm request.csr.


    +   7. On every cluster node where the Ifolder server will run, configure the
    Apache SSL configuration file to point to the newly created certificates. This
    file is typically called vhost-ssl.conf and is stored in the /etc/apache2/hosts.d
    directory. Modify the two lines in the file on every node as the two lines in
    our example:

    SSLCertificateFile=/folder/cert/ifolder.cert

    SSLCertificateFile=/folder/cert/private.key


    TIP


    If your ifolder server uses a different hostname than services that you host on
    the same server, you might want to consider it as an Apache virtual host. For
    example, this might apply when there is already webmail.company.com for this server
    with an SSL certificate and now you want to use ifolder.company.com. In this case
    add the previous SSL configuration to the Virtual Host section. Because ifolder
    is an alias configured as /folder for the server''s default URL When setting up
    a virtual host, do not forget to copy the file inspection.wsdl from /opt/node11/ifolder3/etc
    to the new root directory, as described in the Ifolder online documentation.'
