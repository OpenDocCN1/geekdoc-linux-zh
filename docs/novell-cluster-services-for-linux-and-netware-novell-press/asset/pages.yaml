    `mkdir -p /ifolder/.local/share/simias`


    The (-p parameter creates parent directories when needed.)

    2. Change ownership for all directories in the iFolder shared volume to the wwwrun
    user and wwwrun group:

    `chown -R wwwrun:wwwrun /ifolder`


    The (-R parameter changes the ownership recursively in all child directories.)

    3. Create a symbolicic link for the newly created directory to the wwwrun user''s
    home directory. Use the following command:

    `ln -s /ifolder/.local /var/lib/wwwrun/`'
