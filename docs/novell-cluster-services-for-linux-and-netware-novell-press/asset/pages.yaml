    # Cluster Services Backup


    In this section we describe possible backup solutions for Novell Cluster Services
    environment. When designing the contents of this book, we decided to limit this
    section to a description of Novell''s backup architecture (Storage Management
    Services (SMS)) and one third-party solution for backups, which has become Syncort''s
    Backup Express. The reason for narrowing the topic down to two technologies is
    that there are too many possible solutions to discuss without this becoming a
    book on backups. We found, however, that we could not leave backup out of this
    book. We think that by describing these two technologies, we can give you enough
    information about how to use backup software in your cluster environment, regardless
    of the actual solution you select.


    After a short introduction to cluster backups, we start with a description of
    Novell Storage Management Services, and after that we explain how to use Syncort''s
    Backup Express.


    # Cluster Backups Explained


    When you have experience with backup software on NetWare or Linux, you might ask
    yourself why it is such a big deal to spend time on backups in a book about clustering.
    Your backups are as important in a standalone environment as they are in a cluster
    environment. There is, however, a very important difference when performing backups
    of cluster nodes.


    When you configure a backup on a standalone server, you define a backup job that
    creates a backup of, for example, volume SYS and VOL1 on server FS1. When you
    create a backup in a clustered environment, you could also create a backup job
    to do that, but if server FS1 has failed before or even during the backup and
    server FS2 has volume VOL1 mounted?


    In older backups the documentation for performing backups in a cluster explained
    how to create backup jobs that would try to create backups of all volumes on all
    available servers. Surely one of them would actually have the volume active and
    the backup job. This is really like shooting a mouse with a cannon: you can''t
    miss, but it is not a really refined method. And this type of backup does not
    survive a failover during the backup. But not least, every backup operation would
    by default show failures, so actual failures could easily be missed.'
  merge: -1
