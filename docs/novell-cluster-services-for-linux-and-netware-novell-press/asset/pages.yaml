  md: 'CHAPTER 1: Introduction to Clustering and High Availability


    # Avoiding Downtime


    After all this talk about downtime, it is about time to look into uptime. How
    can we improve our environment so that it is available to our users for a maximum
    amount of time? Because this book is about to Novell Cluster Services, that is
    of course one of the components that we champion to use in your environment. But
    there is much more to it.


    NOTE


    It is sometimes really simple to improve availability. We once worked at a customer
    site where the server room was in one building and the users divided over two
    buildings. In the building where the server room was located, a power failure
    occurred. Of course, all clients stopped working, there the laptops. And, of course,
    the clients in the other building also just kept working. The servers were attached
    to an Uninterruptible Power Supply (UPS) and were configured to go down after
    15 minutes. That would have given the users at least 15 minutes to continue working
    and save their work, in case the power was not restored within those 15 minutes.
    But things went a little differently because the networking equipment was not
    on a UPS. Had it been then, the availability for laptop users and in the second
    building would have been a lot higher.


    There are many components in your environment that can fail and influence the
    availability of your systems—including you because you are only human and nobody
    is perfect. Even Superman did not see it coming when Lex Luthor found Kryptonite
    and came after him. That had quite a long Mean Time to Repair, by the way.


    In this section we list a number of components for your environment that we think
    important to look into if you want to improve your overall availability.


    # Hardware


    This category contains the most obvious cases of failures, and also the most trustworthy.
    Every end user and IT manager will understand what it means when you tell them
    that a hard disk has failed. Not so for an abend. There are several actions you
    can take if you want your environment to be more reliable, which will increase
    your availability:


    +   - Buy reliable server-class hardware

    - Use redundant components as power supplies and fans

    - Use network interface cards (NICs) that support NIC Teaming

    - Apply disk redundancy by means of OS mirroring or RAID

    - Implement redundancy into your SAN and networking equipment'
  merge: -1
