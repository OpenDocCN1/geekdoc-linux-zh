  md: '# CHAPTER 4: Installation and Configuration


    Before you start the installation, make sure that all the requirements have been
    met as well. For NetWare these include the following:


    +   - You must have a minimum of one NetWare server and one Linux server in a
    mixed environment, or two NetWare servers in a single-OS environment.

    - You must have at least 512MB of memory on all servers; 1024MB or more is recommended.

    - You must have at least one local disk device on each server for the SYS: volume.

    - All servers must be configured with IP and must be in the same subnet.

    - An IP address must be available for the cluster object, and one IP address needs
    to be available for each clustered resource as well.

    - If you want to use a shared storage system, the shared disk has to be set up
    properly, and at least one cylinder must be free for installation of the Split
    Brain Detector (SBD) partition.


    When all prerequisites are met, you can start the installation as described here:


    +   1. Insert the OES NetWare installation CD into the CD drive of your computer.
    This will automatically start Deployment Manager. Or Alternatively log in to iManager
    to start the cluster installation.

    2. Under Post-Installation Tasks, click Install/Upgrade Cluster, and next click
    the Link Install or Upgrade a Cluster. This will start the Java installation utility.

    3. Click Next in the opening screen of the installation utility. Next, select
    Create New Cluster to start the installation. In this screen, you will see the
    Skip File Copy option as well (see Figure 4.1). This option is checked by default:
    The result is that all files needed to create the cluster are copied to the NetWare
    server by default installation. You may uncheck this option, if you want to copy
    all files again but normally this is not needed. Click Next to continue.

    4. In the next screen, as shown in Figure 4.2, some information needs to be created
    for the cluster objects. To start with, enter the name of the tree you want to
    install the cluster; finally, enter the name of the container in eDirectory you
    want to create the cluster. In this, a special-purpose container will be created
    in which all cluster objects will be installed. You can use the Browse button
    to enter the names of the tree and context, or you can enter them manually. After
    entering the required information, click Next to continue.'
