    Units (LUNs), devices, volumes, or partitions on shared media.


    +   **convert {preview|commit}:** (l) This command is used on Linux to finalize
    the migration from NetWare to Linux. After the software on the NetWare nodes has
    been replaced with Linux, all resources that were created on NetWare have to be
    converted to Linux in order to use the proper syntax. Use cluster convert preview
    to view what will happen. This will display the old syntax of the cluster load
