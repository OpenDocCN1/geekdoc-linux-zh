    # Configure the Identity Manager eDirectory Drivers


    Now that all required software components have been installed, it is time to start
    the real work. The first part of this is to configure the Identity Manager drivers.
    You need to configure Identity Manager on both sides of the cluster. On site1
    driver is responsible for keeping a copy of all relevant objects from site2, and
    on site2 the Identity Manager driver must make sure that all relevant objects
    are kept. For this purpose, you need to configure separate containers that function
    as a landing zone for the objects from the other site at both sites. In this example,
    we will work with ou=fromsite2.ou=site1.ou=bcc and ou=from-site1.ou=site2.ou=bcc.


