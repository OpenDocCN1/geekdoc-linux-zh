  md: 'You have now configured the virtual machines with access to the same virtual
    disk. You must now follow the steps hereafter for either VMware GSX Server or
    VMware Workstation to enable clustering support.


    # FINISHING THE GSX SERVER CONFIGURATION


    Clustering virtual machines is supported on VMware GSX Server by means of SCSI
    reservation. This must be enabled for the virtual SCSI bus where you have just
    added the shared disk. You must also disable the disk-locking feature to prevent
    virtual machines from locking a virtual disk, which would allow only one node
    to access the disk. Close the VMware GSX virtual machines to edit the configuration
    files manually.


    Add the following lines to .vmx files of both virtual machines:

    `disk.locking = "false"

    scsi1.sharedBus = "virtual"


    This enables SCSI sharing for the entire SCSI1 bus. If you do not want to share
    the entire bus, but instead you want to share individual disks on that bus, you
    can also configure an individual disk to be shared with the entry:

    `scsi1.shared = "true"


    (1:1) specifies the second disk on the second SCSI bus.)


    When you now power on the virtual machines, both servers will have access to the
    shared disk. This is the point where you can install Novell Cluster Services.


    # FINISHING THE VMWARE WORKSTATION CONFIGURATION


    Clustering virtual machines is not supported and there is also no support for
    SCSI reservation. You can, however, configure the virtual machines to start with
    the shared disk activated. And you must also disable the caching to prevent the
    virtual machines from corrupting the disk. Close the VMware Workstation virtual
    machines to edit the configuration files manually.


    Add the following lines to .vmx files of both virtual machines:

    `disk.locking = "false"

    diskLib.dataCacheSize = "0"`


    Both servers will have access to the shared disk when you power them on. This
    is the point where you can install Novell Cluster Services.'
