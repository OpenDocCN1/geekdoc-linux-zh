    # THE DISK CONFIGURATION


    After you have up a physical connection from every server to a storage device,
    it is important to look how the disks are being used inside that device. This
    can range from a single disk to using hardware RAID (redundant array of independent
    disks) or software mirroring configurations.


    # SINGLE-DISK CONFIGURATIONS


    These types of configurations are valid only for really important data that can
    be missed for a day or two. You could be thinking of how to keep data that you
    want to keep online. In the old days there were technologies to keep data available
    on tape or optical devices with an easy mechanism to collect the data when needed.
    This was called near-line storage. With the availability of inexpensive IDE disks,
    it has become possible to store such data online for a fraction of the cost that
    is required for either a tape library or expensive SCSI disks. In your clustered
    environment you can use a disk enclosure with 500MB IDE disks or an SCSI server
    with those disks. But even then we advise you to use one of the technologies described
    hereafter to create redundancy for disks. Especially with these not-too-expensive
    IDE disks, the time to restore data can be brought to zero for only a few hundred
    dollars.


    # REDUNDANT DISK CONFIGURATIONS WITH HARDWARE


    The most widely used technology for disk redundancy and fault tolerance is RAID.
    Many levels of this technology are available, the most common being RAID 1 and
    RAID 5. But RAID 0+1 or RAID 10 is sometimes used. We will first explain some
    terminology about RAID that we will use in the remainder of this section. An array
    is a set of combined disks. Two or more disks are grouped together to provide
    performance improvement or fault tolerance, and such a group is called an array.
    As the operating system that works with that, we call that a logical disk.


    # NOTE


    First of all, a warning about RAID 0: With that technology really is no redundancy.
    There is performance improvement because the data is striped across multiple disks.
    But if one disk in a RAID 0 array fails, the entire array becomes unavailable.'
