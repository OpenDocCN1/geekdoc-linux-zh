- img_proc: true
  md: '# CHAPTER 3: Clustering Design


    There are also true Linux cluster-aware file systems available. Novell Cluster
    Services supports the Oracle File System version 2 (OCFSv2), but other file systems
    that can be used for building a Linux cluster are RedHat''s Global File System
    and PolyVerse''s symmetric cluster file.


    For the Open Enterprise Server environment your best choice is to use NSS, or
    alternatively when you want to cluster-enable Linux applications with OES, you
    could use Ext3 or ReiserFS.


    In Chapter 8, "Cluster-Enabled Applications," we explain what file systems to
    use for different types of applications that you can run in your Open Enterprise
    Linux environment.


    # Mirror the Split Brain Detector Partition


    For a cluster with shared storage, a small part of the shared disk, or maybe a
    special LUN on the SAN you assign for this purpose, will be used as the Split
    Brain Detector Partition. All cluster nodes write data to this disk to report
    about their status. If a cluster node does not respond to heartbeat packets, it
    can be given a poison pill by the other nodes in the cluster and remove itself
    from the cluster. That poison pill is nothing more than a flag that is set on
    the Split Brain Detector partition.


    If access to the Split Brain Detector device is interrupted, a node will take
    itself out of the cluster. The reason for this is that it assumes this failure
    has also interrupted access to the other shared data and thus would impact the
    functionality of the clustered applications.


    The other nodes in the cluster will then load the applications. Or that is what
    should happen. But let us look what happens if all nodes lose access to the SBD
    partition. All of them will assume there is a problem with the shared storage
    and will take themselves out of the cluster.


    This situation can occur because of a hardware failure; either a disk fails or
    because a Fibre Channel device, such as a switch, fails or an administrator unplugs
    a SAN. In an iSCSI environment it can happen if the iSCSI target that the SBD
    partition is stopped.


    The solution to this problem is to mirror the SBD partition. During installation
    of Novell Cluster Services, you can select to configure mirroring if a second
    device that can hold the SBD partition is available. It is also possible to re-create
    the SBD partition and select mirror- at that time. How to do that is discussed
    in Chapter 9.


    # Selecting Applications to Run in a Cluster


    The way that Novell Cluster Services works is when a node fails, another node
    can load the applications that the failed node was running at that time. We call
    this type of clustering a'
  merge: -1
