  md: '# CHAPTER 9: Advanced Clustering, Maintenance, and Troubleshooting


    For a cluster there is some documentation you should collect and add to your system
    documentation. The layout of cluster nodes, resources, resource priorities, and
    IP addresses used must be available not only from checking iManager.


    # Changing the Master IP Address


    The cluster master resource is one that is always available on the master node
    in the cluster. It can be your main access for managing the cluster because whatever
    nodes fail, this resource and its IP address will always be available as long
    as at least one node in the cluster is still alive.


    If you ever have to change the IP addressing of the cluster, this address must
    also be changed. You cannot change it in the master resource itself. You will
    have to change the address in the cluster general properties. Be aware that you
    will have to bring down the entire cluster to change this address.


    To change the address, perform the following steps:


    +   1. In iManager select the Cluster Options task and select the cluster where
    you want to change the address.


    +   2. Click the Properties button under the Cluster Selection text box.


    +   3. In the General tab enter the new master IP address.


    This IP address change will be in effect when the cluster is restarted. This requires
    that all resources and thus services will be unavailable. To bring the cluster
    down, issue the cluster down command on one of the nodes. When all nodes have
    left the cluster, restart the first node with the cluster join command and verify
    that it has loaded the master IP address. For this use, use the display secondary
    ip address command on NetWare or the ip address command on Linux.


    # Changing the Heartbeat IP Address


    If your cluster nodes have only one network adapter, that single adapter is used
    for the cluster for the heartbeat operation. If you had performed the installation
    on a server with more than one adapter, the installation program would have asked
    which IP address to use. Whenever you want to change the address your cluster
    nodes are using to communicate for the heartbeat process, follow the procedure
    given next.'
