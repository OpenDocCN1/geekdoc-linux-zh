- img_proc: true
  md: '1. Start the upgrade of the first server you want to upgrade to NetWare 6.5.
    Migrate any resources that are running on this server to other nodes. You can
    let the process do this automatically for you, but you might want to choose manually
    where to run these resources. Also, this guarantees that it happens when you want
    it to happen.


    2. The upgrade can now be started as a normal upgrade, described in the NetWare
    6.5 online documentation at http://www.novell.com/documentation.


    3. After the upgrade of the server is finished, let it reboot (twice) until the
    upgrade is finished. The Cluster Services software will be started automatically
    after the second reboot.


    4. Resources can now be migrated back to this server. At this time you will have
    a cluster that contains Novell Cluster Services version 1.6 (form NetWare 6) and
    version 1.7 or 1.8. Up to NetWare 6.5 sp3 version 1.7 was used, and for NetWare
    6.5 sp4 and Open Enterprise Server version 1.8 was used. This mixed cluster runs
    without limitations, but of course it should not be a permanent setup. Keep the
    cluster static in terms of configuration. It is also not possible to reconfigure
    the storage during the upgrade procedure.


    5. Continue with the upgrade of all other nodes in the cluster by performing the
    steps through step 4.


    After the upgrade of the last cluster, the cluster that is running as the master
    node will finish the upgrade process of the shared disk resources with the cluster
    upgrade command. You can watch this process start at the server''s logger screen.
    A message will be displayed from the Media Manager regarding the volumes (MM_Upgrade).
    When the cluster upgrade has finished, a cyan blue message will be displayed:
    Operational Mode 0. The upgrade will also be listed in the cluster Event log.
    From the online documentation, this is the description of what the upgrade process
    performs:


    +   1. All cluster resources on shared pools are temporarily brought offline.

    2. Media Manager software is called to upgrade disk media on one server. Disk
    media is then refreshed on all remaining servers in the cluster.

    3. All cluster resources on shared storage are moved back to their original nodes.

    4. The load scripts for each cluster resource run and each cluster resource is
    brought online.


    The cluster upgrade is now complete. Post-upgrade tasks include upgrading all
    applications that require an update to on NetWare 6.5, including your backup software.'
