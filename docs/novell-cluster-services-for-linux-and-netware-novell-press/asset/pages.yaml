  md: '# CHAPTER 6: Cluster Management


    resource to another cluster node. Therefore, in this section you will learn how
    to start and stop Novell Cluster Services from the command line and what commands
    can be used from the command line to manage the cluster. The command-line tools
    are rather similar on NetWare and Linux and are therefore covered in one section.
    There are separate sections about starting and stopping Novell Cluster Services
