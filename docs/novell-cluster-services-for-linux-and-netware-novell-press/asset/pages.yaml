    | Domain MTA | gwdom1 | /grpwise/gwdom1 | 10.0.0.66 | Message transfer port 7100

    HTTP port 7180 |

    | Post Office 1 | gwpo1 | /grpwise/gwpo2 | 10.0.0.67 | Client/server 1677

    Message transfer port 7101

    HTTP port 7181 |

    | Post Office 2 | gwpo2 | /grpwise/gwpo2 | 10.0.0.68 | Client/server 1678

    Message transfer port 7102

    HTTP port 7182 |


