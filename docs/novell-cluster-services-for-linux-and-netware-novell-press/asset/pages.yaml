- img_proc: true
  md: 'Simple Mail Transfer Protocol (SMTP) alerting. To do its work, on Linux a kernel
    module exports all relevant management files to /_admin/Novell1/Cluster. On NetWare
    the _ADMIN directory is used for the same purpose.


    # PCLUSTER


    On NetWare, the Portal Cluster Agent (PCLUSTER) provides an interface to manage
    Novell Cluster Services from Remote Manager. This functionality is not available
    from Linux.


    # Heartbeats, Epoch Numbers, and the Split Brain Detector


    One of the most important things that has to be arranged in a cluster is how the
    cluster will detect when a node fails. Novell Cluster Services uses heartbeats
    on the LAN and a Split Brain Detector on the shared device to do this. A heartbeat
    is a small package periodically sent over the LAN (and not over the storage network)
    by all nodes in the cluster. The master node sends a multicast to all slaves,
    the slave nodes send unicast packets directly to the master node. The multicast
    packet will be picked up by all nodes listening to that particular multicast address.
    To avoid sending too much traffic, the master node will reply with a unicast,
    by a packet sent to that particular node directly. Related to the heartbeat, there
    is the tolerance rate, by default set to eight seconds. If a node fails to send
    heartbeat packages within the period defined by the tolerance rate, it will be
    removed from the cluster. This happens by crashing the other node; on NetWare
    the node that has failed to send a heartbeat package will be amended. We describe
    later in the text how this mechanism works.


    A technique that is narrowly related to that is the epoch number that is written
    over the SAN to the Split Brain Detector partition. This is a small section on
    the shared storage device. When writing its epoch number, a first node compares
    the numbers it wants to write to the other epoch numbers on the network. Each
    time a node joins or leaves the cluster, the epoch number is increased by one.
    A difference in epoch number may indicate that a critical situation has arisen
    and may result in caching of a node from the cluster. In the following discussion
    you will learn how a failed node is removed from the cluster via this mechanism.


    # TIP


    The size of the Split Brain Detector partition cannot be specified when installing
    the cluster.It will, however, always be big enough to accommodate a 32-node cluster.
    Each of the nodes 512 bytes by communicate necessary status information to the
    other nodes. Because, however, a partition needs to be one disk cylinder, a partition
    of about 8MB will be created. The remainder of this 8MB is used for the persistent
    cluster event logs. After the partition has been filled, the cluster will begin
    to reuse the oldest log entries.'
