    is no need to reset the LDAP server or to load or unload the NLDAP.NLM. The LDAP
    server automatically binds to the new secondary IP address as soon as as it becomes
    available on the server.


    # TIP


    If you need to set up a secure LDAP server, it might be necessary to use the same
    server certificate on each cluster node for the newly added secondary IP address.
    How to add the same certificate to two servers is explained in Chapter 9.'
