    # Clustering the Squid Web Proxy on Linux


    If you are using Open Enterprise Server to run traditional Linux applications
    such as the Squid proxy, Novell Cluster Services can be a good addition to increase
    the availability of those services. In this section you will learn how to set
    up the Squid server in an NCS environment. This is a description of a project
    we have realized at a large school in the Netherlands where the Squid proxy was
    used to provide access to the Internet for 12,000 students. Before realization
    of this project, Internet connectivity was often dropped because the proxy server
    was overloaded. Therefore, the customer wanted only a high-availability solution
    in which there always be a proxy over if one of the proxies failed, but also a
    load-balancing solution in which workload is divided among two operational proxies.
    Because load balancing is not something NCS can do, DNS round robin was used for
    this purpose. In order not to create a single point of failure, two DNS servers
    were installed: one as a master and the other as the slave.


    # DNS Round Robin Configuration


    To handle the load balancing, the following entries were added to the DNS database:


    ```

    squid in A 10.0.0.10

    squid in A 10.0.0.20

    ```


    The advantage of this solution is that DNS will automatically round robin; client
    connections be evenly distributed among 10.0.0.10 and 10.0.0.20. The disadvantage
    of a solution like this is characterized as "black holing": If one of the nodes
    fails, the DNS server would never know and still forward clients to that server.
    In this scenario, however, packets are not forwarded to real servers, but to clusters
    where high availability has been taken care of. Therefore, this is no issue.'
  merge: -1
  pgno: 210
- img_proc: true
  md: '# CHAPTER 8: Cluster-Enabled Applications


    # Squid High-Availability Design Considerations


    For a server that works with a large number of configuration files that need to
    be the same on all cluster nodes, shared storage is an important issue. If a traditional
    Linux service such as Squid is clustered, it would make sense to use an ext3 or
    Reiser file system for shared storage. However, if the customer does not care
    about the availability of the cache files because they can always be built up
    anew when a server fails, we can configure the cluster solution without shared
    storage for the proxy cache. Another advantage in this configuration is that no
    additional workload is created for the SAN, which is already under heavy use.
    For the purpose of this environment, it is not really necessary to create a shared
    storage device. Only configuration files need to be synchronized because the Squid
    configuration does not change often, and in this environment they can be better
    synchronized manually. As an alternative, rsync can be used to configure automatic
    synchronization of a limited number of configuration files. The design scheme
    for the solution described in this chapter is shown in Figure 8.13.


