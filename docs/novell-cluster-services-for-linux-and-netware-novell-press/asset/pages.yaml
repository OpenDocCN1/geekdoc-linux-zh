  md: '# CHAPTER 8: Cluster-Enabled Applications


    TIP


    If you are running the first version of GroupWise 7 without service pack 1, modify
    the grwise load script to resolve an error. You will find several lines with a
    startproc command that look like the following one, but one line will not have
    the -f parameter. Add the -f parameter as in this example:


    ```

    startproc -u root -f t ${agent[4]} -p ${pid_file} ${agent[1]}

    "$${agent[3]}" > /dev/null

    ```


    To configure the cluster in iManager, select Cluster Options and modify the properties
    of each individual GroupWise resource. The load script must be like this example
    (for simplicity we left out the comments):


    +   - /opt/ncs/lib/ncsfuncs

    exit_on_error mount -t reisfers /dev/lvm/cluster1/gwdwise/gwdoml

    exit_on_error add_secondary_ipadress 10.0.0.66

    exit_on_error /etc/init.d/grpwise start gwdoml

    exit 0


    The unload script must be like this example (again, for simplicity we left out
    the comments):


    +   - /opt/ncs/lib/ncsfuncs

    ignore_error /etc/init.d/grpwise stop gwdoml

    sleep 8

    ignore_error fuser -mk /grpwise/gwdoml

    ignore_error del_secondary_ipadress 10.0.0.66

    exit_on_error mount /grpwise/gwdoml

    exit 0


    NOTE


    Add the m parameter, as we did in the example, to the command where the agents
    will be killed when they unload incorrectly (the fuser -k command). This will
    help identify the processes accessing the mount point.


    The configuration of the software, the volumes, the IP addressing, and the cluster
    load and unload scripts are now finished for the first node. It is now time to
    test the new cluster resources for the domain and post on this node. Because you
