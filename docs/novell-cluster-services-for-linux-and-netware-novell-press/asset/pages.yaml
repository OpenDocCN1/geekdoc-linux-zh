- img_proc: true
  md: '# Clustering Terminology


    Throughout the book we will use the terminology also used by Novell in its documentation
    to discuss the clustering components. All these terms are defined here. The listing
    will also give you an overview of the building blocks for a cluster.


    # NODE


    This is what you normally would call a server in your environment. But as soon
    as it becomes part of a cluster, we use this term to identify a server. A cluster
    resource can be active on one node and it will fail over to other nodes when the
    original node fails.


    # MASTER AND SLAVE NODES


    In the entire cluster there will always be one node that is the master node. The
    other nodes are called slaves. You can identify the master node in the management
    interface it has a yellow dot in its icon. The only meaning of master node is
    that it is the one that holds the IP address that is general for the cluster.
    Besides, in a split brain scenario with an even tie, which is described later
    in this chapter, the side where the master node resides wins. From a technical
    perspective this node is the one that sends out heartbeat packets to the other
    nodes as a broadcast, whereas the slave nodes respond to heartbeat with a unicast
    response. The master node is the first node to start the Cluster Services software
    in a cluster. If the server fails, another node will become the master and will
    also keep the role of master node until it fails or leaves the cluster.


    # HEARTBEAT


    All nodes in the cluster will communicate via the network to check whether all
    nodes are still alive. They do means of heartbeat packets. When a node stops responding
    to the heartbeat packets, there is a timeout to wait for the server to respond.
    If it does not respond after that period, the server will be sent a poison pill.


    # MASTER IP ADDRESS


    As soon as the first node comes up in the cluster, it will become the master node,
    and it will bind this IP address to the network interface. It needs to be an address
    that fits into the subnet of the server''s primary address.


    # CLUSTER CONTAINER


    All objects that belong to the cluster will be placed into this container. Also,
    the object itself will contain general configuration options for the cluster.
    Every node in the cluster must have access to this container in a local replica,
    so it is therefore common practice to split this off as a partition and store
    a replica on each node.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# CLUSTER RESOURCE


    This is an eDirectory object that defines an IP address, a load script, and an
    unload script for a service that runs in the cluster. It is possible that it activates
    a cluster pool and its volumes to be used by the application. Because most applications
    require access to data, this is the most commonly used configuration. When an
    application uses data from volumes on the cluster-enabled pool, application must
    also be loaded and unloaded from the scripts in this object and not from their
    own resource object. In Figure 1.2 you can see a general overview of a typical
    cluster with two nodes and a shared disk pool.


    # FIGURE 1.2


    An overview of cluster objects for a basic cluster.


    ![](img/0824e0f841046b33f07fbd84ce9da816_20_0.png)


    # LOAD AND UNLOAD SCRIPTS


    Every cluster resource and cluster volume contains a load script and an unload
    script. In these scripts you can use commands that could also use on the server''s
    command line or in NetWare Command File (NCF) files. The scripts will contain
    some default lines for the clustering software, but for the rest it is up to you
    to define the commands needed start and stop the application. The cluster load
    script syntax is covered in depth in Chapter 5, "Creating Cluster Resources."'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# CHAPTER 1: Introduction to Clustering and High Availability


    # CLUSTER VIRTUAL SERVER


    For every pool that you enable in the cluster, you must specify a unique IP address
    that can be used to access the data but also a virtual server name. The CVSBIND
    ADD command in the load script activates this server name in the SLP context to
    make it available on the network. The server is removed from the unload script
    with the CVSBIND DEL command.


    # CLUSTER TEMPLATE


    The resources described previously can be created via a template. These templates
    contain an example of how a cluster resource can be configured. The cluster container
    holds several default templates that can be used to create network services such
    as a DHCP server or an iFolder server.


    # SPLIT BRAIN DETECTOR


    We have discussed before that a server works with a shared disk where a small
    partition is created for the Split Brain Detector process. This process is needed
    to prevent a scenario in which servers in a cluster can no longer see each other
    via the network and would decide that each is the only surviving node after a
    failure. This scenario would result in two clusters being alive with the same
    name and configuration trying to access the same data. If servers no longer see
    each other via the network, they will use the shared disk to determine which servers
    are still alive and which are not. A server that stops responding to heartbeats
    will be given a poison pill.


    # POISON PILL


    This is a flag that will be set on the shared disk that will be seen by the node
    that stopped operating via the network. That node will then eat the poison pill
    and shut down. This is designed this way to prevent server from accessing the
    shared data in an uncontrolled way, preventing data corruption.


    # FAILOVER


    This process forms the heart of the entire clustering solution. If a failure on
    a node is detected, it is this process that will run the load script to activate
    the disk on another node and load the application. The process will take into
    consideration what the preferences are for the failover and will decide on what
    other node the application will run.


    # MIGRATION


    The process of a failover can also be executed manually. This can be done, for
    example, if you want an application to run on another server to better balance
    the load of your environment.'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'Or, for example, if you want to move all applications to other nodes because
    you want to upgrade a particular node. The difference with the failover process
    is that the cluster software will run the unload script and execute the load script
    on the new server.


    # FAILBACK


    After a failover, the resource can also be moved back to where it came from. In
    that case the unload script will execute and the load script will run on the destination
    node. This process can be activated automatically or manually. For the manual
    mode the difference with a manual migration is that using the fail feature will
    mark the resource as failed, and it will show that administrator intervention
    is needed to move the resource back to its original node. You might want to do
    that after business hours, or at least investigating why a failover occurred.
    It is because of last reason that we generally do not configure automatic failback.
    If you do not know why the resource failed, it could fail again, and thus it could
    start going back and forth between two nodes.


    # EPOCH


    When you''re looking at Cluster Services management software, this number shows
    you how many times the status of the cluster has changed. When the cluster starts,
    the epoch is zero, and every time a node joins or leaves the cluster, the epoch
    is increased by one.


    # LIVES


    This number also shows up in your management application. Every cluster resource
    or cluster volume starts starts with one life, and every time the resource is
    brought online or migrated to another node or does a failover to another node,
    the lives counter is increased by one.


    # MEMBERSHIP QUORUM AND TIMEOUT


    Starting the cluster software when the entire cluster has been down will start
    with one node, followed by the other nodes. It would not be a good idea if first
    node would start all the cluster resources on its own; the server would probably
    become too busy. The reason why there is a quorum defined in the cluster container
    object. When the number of nodes defined there is online, the nodes will start
    loading cluster resources. There is also a timeout value that defines what period
    of time the server will start resources anyhow. This setting can be overruled
    on every single resource if you want that resource to come online even when only
    one node is started. By default, this is the case for the master IP address resource.'
  merge: -1
