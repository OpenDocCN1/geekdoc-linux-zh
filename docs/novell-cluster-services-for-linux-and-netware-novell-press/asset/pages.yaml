  md: '# Clustering Without Shared Storage


    In the cluster resource for your LDAP server, configure the load script to add
    the secondary IP address to the server when loading the resource. Also, configure
    the unload script to delete the address when bringing the resource offline or
    migrating it to the other node in the cluster. Here''s an example in which we
    used the address 192.168.1.120:


