  md: 'CHAPTER 7: iSCSI


    # Setting Up Access Control


    For a Linux initiator to connect to a NetWare iSCSI target, it uses an LDAP name
    to connect to eDirectory. For this work, the Linux server connecting to the server
    must be a trustee of the target object. Perform the following steps to assign
    the server as a trustee:


    +   1. In iManager select Rights from the Roles and Tasks panel.

    2. Next, select Modify Trustees and select the iSCSI target object.

    3. Click the Add Trustee button and select the Linux servers that will run as
    initiators. No special rights are needed. Just leave the default rights in place.


    # Configuring the Initiator Software


    The server that will function as the initiator must be configured in the initiator
    configuration file. Open the /etc/initiatorname.iscsi file and modify the line
    as we did for our example:


    ```

    InitiatorName=ign.1987-05.com.cscsi:cn=oeslin1,ou=oeslin1,ou=srv,o=oes

    ```


    Next you must configure the iSCSI software to connect to the target. Add the target
    information to the file /etc/iscsi.conf. Modify this line as for for our example:

    DiscoveryAddress=192.168.1.30


    # Connecting to the iSCSI Target


    After the access control configuration and iSCSI software configuration have been
    completed, you can start the iSCSI session. Use the following command to start
    the session:

    /etc/init.d/iscsi start


    ```

    /etc/init.d/iscsi start

    ```


    Ignore any messages to configure newly found hardware. Use the iscssi-ls command
    to verify the status of the connection:

    scsi-ls


    ```

    scsi-ls

    ```


    This will display information about the connection to the target. To find information
    about the local device information that you will need when creating your Linux
    partitions or clustering configuration, use the sfdisk command:


    ```

    sfdisk -1

    ```


