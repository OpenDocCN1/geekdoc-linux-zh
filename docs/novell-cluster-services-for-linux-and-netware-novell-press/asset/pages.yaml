  md: '# Novell Cluster Services for Linux and NetWare


    This Novell Press book is the definitive guide to designing and implementing clusters
    using Novell''s high-availability solutions.


    Covering Novell Cluster Services (NCS) for Open Enterprise Server for both NetWare
    and Linux, the book focuses on the latest release of this software, although most
    information from this book is also applicable to older versions of NCS. Additionally,
    the authors provide insight into technologies such as SCSI, Linux Heartbeat, and
    Business Continuity, and they also describe how to install popular applications
    into a cluster environment.


    Administrators new to administering NCS—or clustering in general—will find enough
    to get themselves going with Novell Cluster Services, while administrators who
    already have experience configuring Novell Cluster Services will find the book
    in details, especially on how to configure NCS on Linux servers.


    # Inside You''ll Find What You Need to...


    +   * Find out how to use a cluster solution and how the different components
    of an NCS network interact

    * Design and configure clusters

    * Administer an NCS environment using Remote Manager and iManager

    * Use SMP alerting in an NCS environment

    * Configure key applications—such as iFolder, GroupWise and key Linux applications—in
    an NCS cluster

    * Re-create an SBD partition when it fails

    * Make a proper backup of a cluster

    * Upgrade an existing cluster to NCS

    * Use the Heartbeat cluster solution in SUSE® Linux Enterprise Server environment

    * Create cluster of clusters using Novell''s Business Continuity Services


    Advanced technical Training for Novell on NetWare, Clustering Services, eDirectory...,
    ZENWorks. He writes for several IT magazines in the Netherlands, where he is a
    Master Certified Novell Instructor who holds all the major Novell certifications,
    including Certified Linux Engineer and Certified Novell Professional.


    Sander van Vught is an independent trainer and consultant, with a strong focus
    on Linux combination with any Novell product available. He specializes in the
    workings of Linux file systems, file access protocols, and clustering services.
    Sander van Vught is a Master Certified Novell Instructor and holds all major Novell
    and Linux certifications.


    Published with the authorization and collaboration of Novell, inc.


