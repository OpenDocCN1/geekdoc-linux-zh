  md: '# Cluster Management


    In the past, management of cluster resources was available from many utilities.
    Remote Manager, iManager, and ConsoleOne could be used. For your NetWare server
    you can still use ConsoleOne and Remote Manager; in Open Enterprise Server (OES)
    for Linux, iManager is the main management utility for the cluster environment.
    There are also some options to manage Novell Cluster Services (NCS) from the command
    line. These options are dealt with in this chapter. Also, logging, event history,
    and alerting are covered.


    # Cluster Resources Management Applications


    In the old days, NCS cluster was managed from ConsoleOne. Nowadays, there are
    no snap-ins available to manage NCS from ConsoleOne. Management of cluster resources
    from Remote Manager is supported only on OES NetWare servers. Therefore, the main
    focus of this section is on management of cluster resources from iManager.


    # Managing Cluster Resources with iManager


    In an Open Enterprise Server environment, iManager is the main management utility
    for all eDirectory-related resources. Therefore, iManager is the tool to manage
    cluster resources as well. You can access iManager from a supported browser like
    Mozilla Firefox or Internet Explorer. The URL to access iManager is https://yourserver/nps.
    iManager does not have to run on a cluster node itself, it can also be run from
    other OES servers in the network, as long as they are in the same tree.'
  merge: -1
  pgno: 126
- img_proc: true
  md: '# CHAPTER 6: Cluster Management


