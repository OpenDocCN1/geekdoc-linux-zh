    the new syntax, use cluster commit to commit the changes.


    +   **cv rebuild:** (n) On NetWare, this command can be used to disregard the
    current Cluster Volume Broker database. This will rebuild the database, which
    will allow the use of duplicate pool names. This command may be useful in case
    of problems activating and deactivating clustered volumes.


    +   **cvbind {add, del}{resource}{IP address}:** (n) On NetWare, this command
    is used to enable applications that rely on binding to address a virtual server
    on the cluster. If used, you need to specify the resource name of the application
    and the IP address of the virtual server. Also use the add or del switch to enable
