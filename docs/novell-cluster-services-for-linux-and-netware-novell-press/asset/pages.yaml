  md: '# CLUSTER EVENT INFORMATION


    Every event that occurs on your cluster—not only errors, but also resource migrate
    actions, cluster membership changes, and other such normal operations—will be
    present in the Event Log. The Event log is available from every management application
    that provides access to the cluster:


    +   - From iManager select the Cluster Event Log from the Clusters role.

    - In ConsoleOne (NetWare only) the Event log is accessible from the Cluster State
    view. It is the second tab in this view.

    - In Remote Manager (NetWare only) the Event log is accessible from the link in
    the Cluster Management section.


    # NETWARE INFORMATION RESOURCES


    NetWare does not keep log files of all cluster activity on the file system. Instead
    it writes most of the information you will ever need to the Logger Screen. This
    screen is always the second screen on a NetWare 6.x server if you access the screen
    with the Ctrl+Esc key. You can browse the Logger Screen to find information about
    previous activity. And if needed, you can write the contents of the Logger Screen
    to a file C:\NWSERVER\LOGGER.TXT by pressing F2. If you cannot find the information
    you need when browsing the logging screen, it is also possible to search through
    the contents of the Logger Screen with the LSS command from the server console.


    # LINUX INFORMATIONAL RESOURCES


    Many Linux applications, including Novell Cluster Services, write information
    to the general log file /var/log/messages. Information about loading and installing
    the software and errors in that process are stored in /var/opt/novell/n


    # Re-creating the SBD Partition


    When your cluster is installed with a shared Split Brain Detector (SBD) partition,
    the cluster nodes will automatically try to access this shared disk when the cluster
    software is loaded. When this partition cannot be found, a cluster node that tries
    to join will not finish trying to join the cluster. When this happens, it is of
    course a good solution to find out why the SBD partition is not available. It
    could be as simple as a fiber-optic cable not being attached, or the connection
    to an iSCSI target not being available. In cases resolve that problem and reload
    the cluster software.


    When the problem with the SBD partition is of a more serious nature, for example
    when the Logical Unit (LUN) where it existed was deleted, you should create a
    new SBD partition.'
