  md: '# CHAPTER 5: Creating Cluster Resources


    # Clustering a Simple Application on OES Linux


    If you know how to cluster a resource that runs on NetWare, you can cluster a
    resource to run on Linux as well. Many options are just the same, including the
    syntax needed to load and unload services. Not is not the same as on OES Linux,
    traditional Linux file systems such as ext3 and Reiser can used for shared storage.
    In the next procedure you can read how to cluster the DHCP server on OES Linux.


    The DHCP server on OES Linux is not the same as the DHCP server on OES NetWare.
    Whereas the DHCP server on NetWare writes all data to eDirectory, on OES Linux
    all data is written to some files. These files are stored on the shared volume
    we created earlier in this chapter. The DHCP server itself be installed on both
    servers. On each of these servers, a mount point must be created to refer to the
    shared storage device. The following procedure describes how this works (before
    starting this procedure, make sure that the DHCP server software is installed
    on both servers):


    +   1. On the shared disk, create a volume that can be dedicated to the cluster’s
    data. Refer to the section “Creating Clustered Volumes on OES Linux and NetWare,”
    earlier in this chapter, for information on how to create this shared volume.

    2. On both servers, create a mount point where the shared volume can be mounted.
    In this example, we assume that a folder with the name /media/dhcp exists for
    this purpose.


    TIP


    OES Linux would expect these mount points to be in /media. If NSS is enabled on
    OES Linux, it would be in /media/nss.


    +   3. Log on as root and mount the shared volume. Depending on the name of the
    volume, you could use the following command:

    mount /dev/evms/lvm/system/dhcp /media/dhcp

    4. Next, you need to create the data structure that the DHCP server writes its
    data. On the directory where you''ve just mounted the shared volume for the DHCP
    server, use the following commands:

    mkdir etc

    mkdir -p var/lib/dhcp

    5. Use the YaST option Network Services, DHCP Server to configure the DHCP server.
    From a command line, use the rcdhcp start command to verify that the DHCP server
    can start without errors. After verifying this, use the rcdhcp stop command to
    stop the DHCP server.


    106'
  merge: -1
  pgno: 117
- img_proc: true
  md: '6. The configuration files of the DHCP server are still stored in the /etc
    directory. For use in the clustered environment, you need to make sure that these
    are copied to the shared volume. Do this with the following command:

    c /etc/dhcpd.conf /mediadhcp/etc


    7. The dhcpd.conf file is not the only file the DHCP server needs. It needs the
    dhcpd.leases file as well. This file is used to keep track of current usage of
    IP addresses that are issued by this DHCP server. In a clustered environment,
    this file needs to be on the shared storage You don''t need to copy an existing
    file; instead you have to create a new and empty file. Use the following command
    to create this file:

    touch /mediadhcp/var/lib/dhcp/dhcpd.leases


    8. After all all preparation, you can create the cluster resource for the DHCP
    server. Before starting, you have to make sure that the shared volume is unmounted.
    Do this by using the following command:

    mount /mediadhcp


    9. Now open your browser, go to the iManager URL at https://yourserver/nps, and
    log in as a user with administrative permissions. Select Roles and Tasks, Clusters,
    Cluster Options. Select the cluster you want to create the resource for.


    TIP


    If you have selected this cluster before from iManager, use the History button
    for easy access to data entered previously.The History button is the button to
    the right of the magnifying glass next to the option where you select the cluster.


    10. Click New and select the resource type to create the cluster resource. Click
    Next to continue.


    11. Enter a name to assign to the cluster resource and then select the template
    to inherit settings from. OES Linux is provided with a template to create a DHCP
    server resource to make life easier for the administrator. Select this template,
    make sure that the Define Additional Properties box is selected, and then click
    Next to continue.


    NOTE


    In a mixed-node environment, you can find that only NetWare templates are available.
    In that case, you cannot select the template object and you must enter all parameters
    yourself.'
  merge: -1
  pgno: 118
- img_proc: true
  md: "12. Now you see the cluster load script screen. Here you have to enter all\
    \ commands that make sure that the cluster resource is loaded properly. The following\
    \ script gives a good example of what should happen:\n\n```\n#!/bin/bash\n. /opt/novell/ncs/lib/ncsfuncs\n\
    exit_on_error mount -t ext3 /dev/evms/lvm/system/dhcp /mnt/dhcp\nexit_on_error\
    \ add_secondary_ip_address 192.168.0.153\nexit_on_error /usr/sbin/dhcp -cf /mnt/dhcp/etc/dhcpd.conf\
    \ -1f\\\n    /mnt/dhcp/var/lib/dhcp/dhcpd.leases\nexit 0\n```\n\nThis script may\
    \ appear complex but it is really not. The first line indicates, this script is\
    \ in bash syntax (see also Figure 5.23). On the second line, NCS-specific functions\
    \ are called. These functions are all commands that can be used in an NCS load\
    \ script on a NetWare environment. This allows an administrator to use the same\
    \ commands both on NetWare and Linux. On the third, the shared volume is mounted.\
    \ The mounting of this volume starts with the command exit_on_error, which comes\
    \ from the ncs functions script. stops immediately if there is an error. Next,\
    \ an IP address is added that can be used by the DHCP server. The DHCP server\
    \ is activated. Notice the options -cf (configuration file) and -lf (leases file),\
    \ which are used to refer to the two configuration files that are stored in a\
    \ different location from where they are. Finally, the exit 0 command is used\
    \ to tell the shell that the script has run successfully. Modify your script as\
    \ needed—and don't forget to set the timeout value to a few minutes—and then click\
    \ to continue.\n\n13. Now you have to create the unload script as well, as shown\
    \ in Figure 5.24. To stop the DHCP server started with the foregoing load script,\
    \ the following unload script can be used:\n\n```\n#!/bin/bash\n. /opt/novell/ncs/lib/ncsfuncs\n\
    ignore_error killproc -p /var/run/dhcpd.pid -TERM /usr/sbin/dhcpd\nsleep 8\nignore_error\
    \ error_fuser /mnt/dhcp\nignore_error del_secondary_ipaddress 192.168.0.153\n\
    exit_on_error ummount /mnt/dhcp\nexit 0\n```"
  merge: -1
  pgno: 119
