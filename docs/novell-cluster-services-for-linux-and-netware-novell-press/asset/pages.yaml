- img_proc: true
  md: '# CHAPTER 3: Clustering Design


    RAID 1 mirrors disk blocks from one disk to another disk. This means that every
    disk block being written to disk is also written to the second disk. The operating
    system connecting to the array sees one logical disk. It is the hardware RAID
    controller that takes care of the mirroring. In this scenario one disk could fail
    and the logical disk is still available to the operating system. RAID 1 improves
    the performance for read operations because data can be read from either disk
    in the mirror. This type of redundancy is the most expensive in terms of disk
    usage because it requires a double amount of disk capacity is is needed.


    RAID 0+1 and RAID 10 are both combinations of RAID 0 and RAID 1. The RAID controller
    combines disks into a stripe set as a virtual logical disk. It does that for a
    minimum of two physical disks and also for other physical disks. It uses two virtual
    logical disks, which are both striped, internally and mirrors them into one logical
    disk for the operating system. In RAID 10 configuration it works the other way
    around: A minimum of two physical disks are mirrored into a virtual logical disk,
    and the same parity for two physical disks, after which the RAID controller stripes
    over the virtual disks that are created. The effect of using these technologies
    is that they improve performance compared to regular RAID 1 mirroring. RAID 10
    is your better choice over RAID 0+1 because it uses mirroring as the first defense
    against disk failures, whereas RAID 0+1 stripes the disks and then mirroring only
    internally for the virtual disks.


    In a RAID 5 configuration, data is striped across multiple disks and redundancy
    information is stored on the disks in the array. The way this works is when blocks
    are written to the physical disks, a parity block is calculated for a combination
    of blocks of physical devices and written to one of the disks in the array. There
    is no single disk that holds all the parity information; it is striped across
    the disks in the array. In this configuration one of the disks in the array can
    fail and still all data is available because it can be reconstructed with the
    parity information from the remaining disks. Only when more than one disk fails
    does the entire array become unavailable. The great advantage of RAID 5 is that
    the extra disk capacity is kept to a minimum. for only one extra disk is needed.
    Buying five 72GB disks will provide you with a non 288GB disk capacity. The main
    disadvantage of RAID 5 is that it has a lower performance compared to RAID 1 because
    of the overhead of the striping process, whereas RAID 1 writes the data to two
    disks without having to think about that.


    An important feature of RAID configurations is that they support hot spare disks
    and sometimes hot pluggable disks. With the first feature you can have a disk
    on standby that can be used to replace a disk immediately in case of a failure.
    If it supports hot-pluggable disks, you can add disks to the server while it is
    up. Depending on the RAID controller, you can even expand the array online and
    add the new segments to the operating system. These two features are important
    to look out for when evaluating RAID controllers for your environment.'
  merge: -1
  pgno: 57
- img_proc: true
  md: '# REDUNDANT DISK CONFIGURATIONS WITH SOFTWARE


    Besides redundancy that comes as hardware in your servers, it is also possible
    to use the operating system to create redundancy for your disks. This can be striping
    to improve performance (RAID 0), mirroring of disks or partitions (RAID 1), or
    even software striping for fault tolerance (RAID 5). The only solution we think
    could be used in any professional setup is software mirroring. Novartis Storage
    Services supports this at the partition level. It can be used with physical disks
    but it is also a possible solution to mirror disks that are used with iSCSI.


    On Linux there is also the possibility to use software RAID. Independent disk
    devices can be combined into a single device, for example, called /dev/md0, to
    provide fault tolerance. Check the manual pages for commands raidtab, raidstart,
    and mkraid how to set up a software RAID configuration, or check the documentation
    on RAID at the Linux Documentation Project at the following URL: www.tldp.org/HOWTO/


    Another solution to create redundancy for disks is the Distributed Replicated
    Block Device (DRBD). This is a RAID 1 solution running over the network. In this
    configuration one node has read-write access to the DRBD device and the other
    node does not. This technology is described in Chapter 11, "Using SUSE Linux Enterprise
    Clustering," where it is used for Heartbeat, a high-availability solution for
    Linux.


    If you can afford it, always use hardware redundancy with RAID 1 or RAID 5. You
    will get better performance because the RAID controller contains its own processor
    and cache memory to do its job. Also the management and alerting for hardware
    RAID are better than what you would get in any operating system.


    # THE FILE SYSTEM


    With the storage connections in place and the disks configured for high availability,
    it is time to look at the last part of the storage component of a cluster solution:
    the file system.


    Not all file systems are cluster aware and thus not all can be used with Nov Cluster
    Services. For NetWare there is nothing to choose from NSS, but not so for Linux.


    When we first look at NetWare, we can use NSS as a file system in a cluster because
    it contains a feature called Multiple Server Access Prevention (MSAP). A node
    that activates a pool on the shared disk writes a flag to disk to indicate that
    the pool is in use by that server. Other servers that have access to the shared
    disk will see that flag and will not activate the pool. This prevents corruption
    that could occur when two servers were writing data to the same data area at the
    same time.


    For Linux, NCS also works with NSS, but it can also support other file systems.
    Ext3 and ReiserFS are not cluster aware by nature; they can be mounted on a server
    and whenever a failure occurs they can be mounted on another node in the cluster.'
  merge: -1
