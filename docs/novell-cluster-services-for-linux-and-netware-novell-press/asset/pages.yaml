    # Creating Mount Points to Mount the Shared File System on All Servers


    After creating the EVMS volume, you have to make mount points on it. This way
    you may make sure that from the cluster resource load script, data can be written
    to the shared volume. Creation of the mount points and associated directories
    involves the following steps:


    +   1. Make sure the mount point where the EVMS volume must be activated exists
    on all servers in your cluster. If on all servers in the cluster you want the
    shared volume to be mounted on /media/samba, make sure that the directory /media/samba
    exists. This is because the cluster load script will assume it is there when activating
    the shared volume. Create this directory manually with the mkdir /media/samba
    command on all servers. In the previous example, the mount point /mnt/samba was
    mentioned; use mkdir /mnt/samba on all servers to create it.

    2. On one server only, log in as root and mount the EVMS volume on the mount point
    you have just created. For example, use mount /dev/evms/lvm/system/samba /mnt/samba
    to mount the volume.

    3. On the EVMS volume, create all directories that are required. To configure
    the configuration files, in /mnt/samba on the server where the EVMS volume is
    mounted, use mkdir -p etc/samba to create a subdirectory to store Samba configuration
    files. Also make sure that all shares that you want on the shared volume are created
    as directories as well, so that you can refer to them from the smb.conf configuration
    file.


    Because it is important that the shared volume be loaded from the cluster resource
    load script and not from /etc/fstab, make sure that in /etc/fstab on the server
    where you have created the EVMS volume, all lines that refer to the volume are
