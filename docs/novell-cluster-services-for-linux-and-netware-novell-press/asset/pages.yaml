  md: '# Examining Novell Cluster Services Architecture


    In the first chapter of this book, Novell Cluster Services (NCS) was introduced
    from a high-level overview perspective. Before the next chapters of this book
    talk about the design of a clustered network and the installation and configuration
    of Novell Cluster Services, this chapter will discuss what''s happening at the
    background of your Novell cluster. In this chapter you will learn how the different
    components of an NCS network work together to provide high availability. You will
    learn about the modules that are used in a cluster, as well as the working of
    some important background processes. In the second part of this chapter, you will
    learn how heartbeats, epoch numbers, and the Split Brain Detector (SPD) work together
    to provide high availability.


    # Novell Cluster Services Objects and Modules


    Novell Cluster Services is present in two different parts of your network. First,
    you will find cluster-related eDirectory objects. These objects communicate with
    binaries and libraries that are present on the server. Sometimes they read configuration
    files to retrieve information, and other times this information is present in
    the eDirectory object itself as an attribute. In this section we will present
    an overview of all the important modules and their related eDirectory objects.'
  merge: -1
