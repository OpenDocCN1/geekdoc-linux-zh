  mdcn: '


    # Linux" 和其他？


    1. **本指南的目的是什么？**


    本指南可供任何人使用，用于在一台计算机的同一硬盘上安装和配置 3 个操作系统（OS）。首先安装 Microsoft Windows 操作系统（根据读者的选择），然后安装
    FreeBSD 4.8–RELEASE 或 OpenBSD 3.2–RELEASE 或 NetBSD 1.6.1，最后，我们通过安装 Red Hat Linux
    7.3 来完成本指南。虽然我一直使用这种特定的顺序，但读者可以根据自己的习惯选择安装顺序。


    2. **为什么本指南使用了“3”个操作系统？**


    当前的情况是，Microsoft Windows 操作系统统治着桌面市场，而 GNU/Linux 发行版和 *BSD 版本（FreeBSD/OpenBSD/NetBSD）则在服务器市场竞争“全球统治”，因此，我认为将它们全部包含在本指南中是最好的选择。第一个操作系统是
    Microsoft Windows 操作系统，第二个属于 *BSD 家族，最后一个是常用的 GNU/Linux 发行版（Red Hat）。因此，操作系统的数量最终为“3”。


    3. **你自己是否尝试过本指南中提到的步骤？你在什么配置的计算机系统上测试了本指南中提到的所有内容？**


    我向大家保证，我在自己的个人计算机系统上测试了本指南中提到的每一步。之后它们也在配置各异的其他计算机上成功测试过。我的计算机有一台 266.87 MHz Intel
    Pentium 2 处理器，64MB 物理 DIMM RAM，一块 20.0 GB Maxtor IDE 硬盘和其他常用配件，运行 Microsoft Windows
    98(SE)、FreeBSD 4.8–RELEASE 和 Red Hat Linux 7.3。另一台配置基本相同，运行 FreeBSD 4.8–RELEASE、OpenBSD
    3.2–RELEASE 和 Red Hat Linux 7.3。经验法则是：“资源越好，计算机性能越好”。


    4. **你的所有安装都是“CD–ROM”基于的安装类型。如何“Ethernet”、“FTP”、“HTTP”、“NFS”安装类型呢？**


    我决定让本指南尽可能简单。由于我们大多数人通常使用本地 CD–ROM 上的光盘来安装操作系统，我假设读者采用 CD–ROM 基于的安装来安装所涵盖的操作系统。此外，本指南面向所有类型的用户，从中级
    Linux 用户到经验丰富的 Unix 专家。由于 NFS、HTTP、FTP 和其他此类安装类型通常需要运行服务器的网络，而普通家庭用户无法访问。我只涵盖了
    CD–ROM 基于的安装类型。对“网络”爱好者造成的不便表示抱歉。


    5. **为什么有人会需要在同一台计算机的同一硬盘上运行 3 个操作系统？我要在 2 个独立的硬盘上运行 3 个操作系统。这本指南到底有什么大不了的？**


    有很多原因。为乐趣、为学习新的安装和引导方法、为获得“多重引导”、分区方案、引导加载程序等方面的内部知识，或者仅仅因为你负担不起 2 个独立的 40.0 GB
    硬盘来安装你想要摆弄的 3 个不同的操作系统。对我来说，我想最后一个理由“最合适”。


    最后，如果你确实想要，你始终可以安装和配置你的计算机系统，在 2 个独立的硬盘上安装 3 个不同的操作系统。


    ## 6. 为什么是 Red Hat？为什么不是 Debian GNU/Linux、Slackware、Caldera、SuSE、TurboLinux 等？


    由于我过去的大多数 Linux 项目和工作通常都与 Red Hat Linux 发行版相关；不断安装、配置和管理 Red Hat Linux 个人桌面和工作站。目前，Red
    Hat Linux 是世界上“最”领先的 Linux 解决方案提供商，大型企业实时系统使用 Red Hat 操作系统软件实现。此外，Red Hat 文档和支持很容易找到。因此，选择了
    Red Hat Linux。其他发行版，即 Debian GNU/Linux、Slackware 和 Mandrake 都很好，我可能会稍后添加更多涵盖其他
    Linux 发行版的部分。


    ## 7. 为什么是 FreeBSD、OpenBSD 和 NetBSD 操作系统？为什么不是 BSD/OS、Darwin、Irix、Sun Solaris、Digital
    UNIX、HP-UX、IBM-AIX 等？


    我个人在 FreeBSD 和 OpenBSD 机器上拥有网络和源代码黑客经验。最近，我可以访问 NetBSD 1.6.1 和 Sun Microsystems
    的 SunOS 操作系统在 Solaris 操作环境中。我“没有”使用 Irix、Ultrix、Minix、HP-UX、IBM-AIX、Darwin 等的经验。因此，选择了
    FreeBSD、OpenBSD 和 NetBSD。


    ## 8. 你为 GNU/Linux 使用了哪个内核版本？


    Linux Kernel 2.4.18-3 已用于 Red Hat Linux 发行版（Valhalla）。写作当时最新的内核是 Kernel 2.4.20。


    ## 9. 我按照你在本指南中说明的方式在我的计算机上安装了 3 个操作系统。不幸的是，出了点问题。我的计算机崩溃了，我丢失了所有数据。你能否好心地为这一切混乱负责？


    好吧，首先我对你的数据丢失和所有这些明显的混乱表示“最深切”的慰问。我很乐意承担所有责任，但就目前而言，我自己有足够的问题需要处理。因此，我“不”准备为任何地方发生的任何错误负责。至少，我可以说，本指南中提到的所有步骤和方法都已在配置各异的多个系统上彻底测试，迄今为止没有发现任何问题。


    ## 10. 你使用了 GNU GRUB 来引导全部 3 个操作系统。你能告诉我原因吗？为什么不使用流行的 Linux Loader（LILO）或 FreeBSD
    或 NT 引导加载程序来实现这一目的？


    众所周知，引导加载程序在配置时发挥着非常重要的作用


    '
