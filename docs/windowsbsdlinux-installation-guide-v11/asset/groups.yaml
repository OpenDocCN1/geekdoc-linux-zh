    # Q6. I wiped my hard disk clean using UNIX dd utility. I then performed a fresh
    install of Red Hat Linux on my PC followed by a FreeBSD install. I installed the
    FreeBSD boot manager into the MBR. Now my system does not boot! What happened?
    Where did I go wrong? or,


    # Q7. I wiped my hard disk clean using UNIX dd utility. I then performed a fresh
    install of Red Hat Linux on my PC followed by an OpenBSD install. I installed
    the OpenBSD boot manager into the MBR. Now my system does not boot! What happened?
    Where did I go wrong?


    Ans6 and Ans7: Nothing went wrong anywhere. But you made a small yet fatal mistake
    at the very beginning. Always remember that when you write zeroes to the hard
    disk surface using UNIX dd utility, it includes the Master Boot Record (MBR) area
    also. The MBR area which has address (0,0,1): Cylinder address 0, Head address
    0 and Sector address 1, that is, in other words, the first 512 bytes of the hard
    disk which contains the Master Partition Table (MPT) and the Initial Program Load
    (IPL) code. When this area gets overwritten with zeroes, different operating systems
    react and behave in different ways. They react strangely because they expect the
    standard IPL code, but instead they find none.


    For example, Red Hat Linux fdisk reports the zeroed partition table as invalid
    and can recreate an empty one; the only IPL code it will install is LILO or GRUB
    and not standard IPL code. OpenBSD simply shows an empty partition table and it
    causes a hell lot of problems booting on such hard disks. The only operating system
    that which is reported to boot flawlessly from a completely zeroed disk without
    error is FreeBSD. But, I personally did encounter a situation in which (owing
    to strange reasons) FreeBSD booting got locked and it simply would not boot.


    To prevent all this from happening, just boot from a Windows 9x or DOS v6 boot
    disk with FDISK.EXE on it. Once the system is booted to an MS-DOS prompt, enter
    the following: A:\>fdisk /mbr. It reinitializes the MBR to its normal state and
    rewrites the MPT and creates the standard IPL. Continue installing the operating
    systems as usual.


    # Q8. I installed Red Hat Linux on my PC, but while installing LILO to the Master
    Boot Record (MBR), I got an error that said the installation program could not
    write this info to the MBR. What has happened?


    Ans8: You have either locked the MBR of your hard disk on your PC or a virus-scan
    software is enabled which prevents writing to the MBR. You have to access your
    computer system''s BIOS and verify that the MBR is not write-protected. Depending
    on the system, you may already have another boot loader in the MBR that conflicts
    with LILO. Try performing a "fdisk /mbr" from the MS-DOS command prompt and installing
    LILO.


    # Q9. I was installing OpenBSD 3.2 on my PC the other day. After creating partitions
    in OpenBSD fdisk, when I saved the changes and exited from fdisk using the option
    "quit", it flagged some warning as: "wd0: no disk label" in bright white on blue.
    What does that mean? Did I do something wrong?


    Ans9: Absolutely no. You did nothing wrong. When you exit the OpenBSD fdisk (saving
    the changes using the option "quit"), and the OpenBSD slice is not at the same
    offset as a previously installed OpenBSD system, then fdisk displays "wd0: no
    disk label" message. Though it looks like a warning message or an apparent error,
    rather it is an important message'
