    FreeBSD，代表伯克利软件发行版操作系统软件的自由版本（尽管所有的 BSD 本质上都是“开源”或“自由”的），从技术上讲，是当今地球上最强大、最具专业品质、最先进的
    UNIX 兼容操作系统软件。FreeBSD 最初基于 4.4BSD-Lite（也少量包含了 4.4BSD-Lite2 代码库），由加州大学伯克利分校在伯克利电气工程与计算机科学系计算机科学部的计算机系统研究组（CSRG）授权下开发。FreeBSD
    操作系统（就像 Linux 发行版一样）附带一整套软件包，包括用户应用程序、工具、用户实用程序、shell、游戏、文档、开发工具、系统和用户级二进制文件，以及操作系统的完整源代码。FreeBSD
    项目网站可以访问：http://www.freebsd.org。


    近来，大量媒体聚光灯将 GNU/Linux 系统（更具体地说是 Linux 内核）推上了明星地位。有些人将 Linux 评价为有史以来最好的 UNIX 克隆，它会给市场上的
    UNIX 以及其他 UNIX 克隆和 UNIX 兼容系统带来灾难。但事实并非如此。读者必须注意：正如汽车的动力来自引擎盖下运转的发动机质量，操作系统软件的稳定性、可靠性、可扩展性和健壮性等特性同样来自内核或相应操作系统核心的内部结构。我个人认为，Linux
    内核和 FreeBSD 内核都是创造性与巨大努力的伟大作品，仅仅在用户层面或技术层面对两者进行比较是没有意义的。在内存稀缺且受到极端压缩和压力的情况下，Linux
    内核会崩溃。而 FreeBSD 凭借其高度优化且先进的 VM/Swap 系统可以救急！另一方面，在特定情况下，Linux 可能远远胜过 FreeBSD。读者需要注意并记住的重要一点是：Linux
    内核偏爱简单，而不是高度优化的、动态但更复杂的代码；而 FreeBSD 内核则通过引入更复杂的代码，并不断重新排列和重写一些更重要的内部算法和数据结构来重度优化代码库，从而优化性能。


    关于 Linux 和 FreeBSD 内核的完整详尽讨论超出了本指南的范围。如果读者感兴趣，可以上网搜索更多 Linux 和/或 FreeBSD 的特定信息。我建议读者阅读
