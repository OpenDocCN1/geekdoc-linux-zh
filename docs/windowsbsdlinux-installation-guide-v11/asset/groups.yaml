  - '[PAGE 47]


    Ans2 and Ans3: As the readers can see, this error message flagged by Red Hat Linux
    fdisk tool can occur under a variety of conditions. I myself encountered both
    of them while multi-booting PCs. When this message gets displayed Linux''s fdisk
    cannot make any changes to the disk. Personally speaking, I strongly feel that
    this message: "too many partitions (16, maximum is 8)" usually appears whenever
    you have unerased data from previous installs of FreeBSD and/or OpenBSD and/or
    NetBSD operating systems. This usually happens whenever those data partitions
    where deleted, but the Master Partition Table (MPT) contained in the Master Boot
    Record (MBR) was not overwritten. Since this problem does not seem to occur on
    clean hard disks, I conclude that it only appears if you have old BSD disk label
    data on your hard disk.


    Once this error gets flagged, there is nothing much you can do about it because
    whatever you do or whatever you type in, nothing gets written to disk. If it so
    happens that you are performing a clean install and you get this error, do a "fdisk
    /mbr" from the MS-DOS prompt, and try installing Red Hat Linux once again. If
    it so happens that you have FreeBSD/OpenBSD/NetBSD installed on your system already,
    then (sorry dude!) erase all earlier installs, wipe the disk clean using "dd"
    utility or whatever you have at your disposal and start installing everything
    all over again.


    # Q4. I was performing a new install of Red Hat Linux on my PC which earlier had
    multiple installs of FreeBSD and/or OpenBSD and/or NetBSD. I got a "too many partitions"
    error from the Red Hat Linux fdisk. Can''t I perform a full install of Red Hat
    Linux on my hard disk to remove the BSD disklabel data on my hard disk?


    Ans4: No, you cannot. Once this error gets flagged, even fdisk''s ''o'' option
    which normally clears all partition information would not function. Even if you
    are successful in doing a complete Linux only "full disk" install using the Disk
    Druid disk-partitioning tool, this would not erase the old and already exiting
    BSD disklabel information. Sooner or later, you would land in trouble.


    # Q5. I deleted all exiting partitions containing data on my PC. But I want to
    be sure and wipe my disk clean with some "professional" disk-wiping utility. Which
    ones can I use? How would I use them?


    Ans5: Third-party partition managers and security software which are specifically
    designed to erase disks can be used for this purpose. Personally, I do not have
    any experience using any third-party tools for wiping hard disks because I prefer
    using the UNIX-based dd utility.


    UNIX''s dd can also be used to wipe the disk clean absolutely. It writes zeroes
    to the disk surface which is accessible from the FreeBSD, OpenBSD and Linux install
    CDs. This is easily accessed from the OpenBSD install CD by selecting the shell
    option rather than install or using [Ctrl+C] to exit the OpenBSD install at any
    time. The OpenBSD command to clear the first IDE hard disk is "dd if=/dev/zero
    of=/dev/wd0c". Red Hat Linux''s install CD''s rescue mode is a single user prompt.
    You do not have to mount the system as you are going to erase it, not "rescue"
    it. Once you get the "#" prompt "dd if=/dev/zero of=/dev/hda" will clear the first
    disk. FreeBSD''s "Fixit" option from the main install menu provides access to
    a single user prompt; the second of the four install CDs is needed. The command
    "dd if=/dev/zero of=/dev/ad0" appears to clear the first disk. Once this done,
    you can be rest assured that your hard disk is wiped clean absolutely!'
