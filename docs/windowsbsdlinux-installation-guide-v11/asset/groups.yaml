    # 2. Filesystems in FreeBSD


    Microsoft Windows operating systems use FAT16, FAT32, NTFS 4.0 and NTFS 5.0 filesystems
    for storing and retrieving data. The recently released NTFS 5.0 is implemented
    in all of the Windows 2000 operating systems. The Linux Kernel uses the "Third
    Extended native filesystem", denoted as ext3fs. Linux also supported the ext (now
    obsolete and no longer supported) and ext2fs filesystems. The "Second Extended
    filesystem" (ext2fs) is an advanced hierarchical filesystem developed for the
    Linux operating system, which included advanced features like a maximum file size
    of 2.0 GB, a maximum file name length of 255 characters and support for three
    time/date stamps. They are the date of creation, date of last modification and
    date of last access. The "Third Extended filesystem" has all these features, and
    additionally it implements the "journaled file system architecture" (JFS). The
    JFS architecture ensures the integrity of data stored on a hard disk in the event
    of an unplanned shutdown, such as one caused by a power outage. A journaled filesystem
    maintains a log of all read and write events; this log enables the disk to be
    restored to its last stable state and additionally allows incompletely written
    data to be restored to the maximum possible extent.


    The FreeBSD operating system basically uses the Unix File System (UFS) architecture
    for its underlying filesystem. Berkeley made more advancements to it referred
    to as the "Berkeley Improvements" or "Berkeley Extensions". This filesystem, currently
    used by FreeBSD as its native filesystem, is often called the "Fast Filesystem"
    or FFS, because access reads and writes to data stored in FFS is very fast. The
    architecture is a little more complex than Linux''s ext2fs. It offers a better
    way to insure filesystem data integrity, mainly with the "softupdates" option.
    This option decreases synchronous I/O and increases synchronous I/O because writes
    to a UFS filesystem are not synced on a sector basis but according to the filesystem
    structure. This ensures that the filesystem is always coherent between two updates.


    The FreeBSD filesystem also supports file flags, which can stop a would-be intruder
    dead in his or her tracks. There are several flags that you can add to a file
    such as the immutable flag. The immutable (schg) flag would not allow any alteration
    to the file or directory unless you remove it. Other very handy flags are append
    only (sappnd), cannot delete (sunlnk), and archive (arch). When you combine these
    with the kernel security level option, you have a very impenetrable system. In
    short, the FreeBSD Kernel uses UFS = UFS+FFS+Softupdates+dirpref+dirhash functionality
    for storing and retrieving data on'
