    # 3.5 Installing NetBSD 1.6.1


    This Chapter focuses on installing NetBSD 1.6.1 and multi-booting the system so
    that it can coexist successfully with the already existing Windows operating system
    on the computer. Like the Windows, FreeBSD and OpenBSD installations, it too focuses
    on a CD-ROM based installation. Experts may proceed as usual without help, as
    for the newbies out there, make sure you check out the documentation available
    on the NetBSD Homepage at http://www.netbsd.org. These and other documentation
    available on the NetBSD 1.6.1 CD-ROM provides exhaustive and extensive coverage
    of all aspects related to NetBSD. Make sure you grab as much information as you
    can from this site before proceeding with this guide.


    **Note:** I hereby assume the reader executing this Chapter possesses a sound
    understanding and knowledge of BSD-style hard disk partitioning and labeling schemes,
    device naming conventions and so on before proceeding any further. If in case
    you have no idea at all of what I am talking about or in general of NetBSD, I
    strongly suggest you to go back to the Chapter covering FreeBSD.


    A few significant points to remember: NetBSD labels hard disks similar to OpenBSD
    with /dev/wd0 for the first hard disk, /dev/wd1 for the second hard disk and so
    on. NetBSD disklabel allows up to 16 partitions. It can detect and represent all
    primary partitions that exist on the hard disk. NetBSD disklabel though sees all
    partitions within an extended partition but it does not list the extended partition
    container. Readers must note that NetBSD reserves the c: partition which represents
    the entire hard disk. i: through p: are reserved for partitions belonging to other
    operating systems other than NetBSD (for example Windows or Linux partitions),
    with a:, b: and d: – h: available for NetBSD specific partitions.


    # Summary of Installation Steps


    For a complete step-by-step coverage of NetBSD installation, please consult the
    documentation available on the NetBSD Project web-site. As in the previous Chapter,
    here also, I would be mentioning only the significant steps for the installation.
    Use these steps to install NetBSD on your computer and configure it for "multiple-booting":


    +   1. Right now, we have a computer running Microsoft Windows OS. On my PC, it
    is Windows 98 (SE). I put a bootable NetBSD 1.6.1 CD-ROM in the CD-ROM drive and
    reboot the system.

    +   2. The computer boots, reads the CD-ROM, displays the usual hardware probing
    messages on the screen and presents you with an installation program. Readers
    must note: There are several ways to install NetBSD onto a disk. The easiest way,
    should your computer support it, is to boot off the CD-ROM. Otherwise, you can
    boot from a 3.5" 1.44MB floppy disk. You should now be ready to install NetBSD.

    +   3. The blue-colored NetBSD 1.6.1 Installation Tool is called sysinst. At the
    very beginning, you receive a "Welcome to sysinst" screen. Select the option "Install
    NetBSD to hard disk" and press enter.'
