    项目网站上提供的安装指南。与上一章一样，在这里，我也只会提及安装的重要步骤。使用这些步骤在您的计算机上安装 FreeBSD 并配置为“多重启动”：


    - 1. 现在，我们有一台运行 Microsoft Windows 操作系统的计算机。在我的 PC 上，它是 Windows 98（SE）。我将一张可启动的
    FreeBSD 4.8-RELEASE CD-ROM 放入 CD-ROM 驱动器并重新启动系统。

    - 2. 计算机启动，读取 CD-ROM，在屏幕上显示通常的硬件探测信息，并向您展示内核配置菜单。使用 ''Q'' 退出它并继续进入 FreeBSD 系统安装和配置实用程序。在
    FreeBSD 中它被称为 /stand/sysinstall 实用程序。

    - 3. 一旦 /stand/sysinstall 屏幕出现，选择 Novice、Custom 或 Express 安装。我选择 Custom 安装，因为它提供了最佳的灵活性。对于新手用户，我建议使用
    Recommended 安装。照常进行，直到到达 FreeBSD Fdisk 编辑器。

    - 4. 在这里选择未使用的空间并创建 2 个大致相等的分区。因此，将创建 2 个切片（除了已存在的切片之外）。一个将用于安装 FreeBSD，另一个稍后用于
    Red Hat Linux。具有中级和/或专家 FreeBSD 知识的读者应该很容易做到这一点。创建这两个分区后，硬盘上不应有任何空闲空间。退出并保存所有更改，然后照常继续进入
    FreeBSD 磁盘标签编辑器。读者必须注意：在创建 Linux 切片时，文件系统 ID 应为 131。这将创建 Linux 原生文件系统（ext2fs 文件系统）。否则，将创建默认的
