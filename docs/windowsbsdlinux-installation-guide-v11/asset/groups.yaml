    4.0 或最近发布的 NTFS 5.0 文件系统。GNU/Linux 内核最初使用的是“第一扩展文件系统”，通常表示为 ext 或 extfs。它现在已被
    ext2 和 ext3 文件系统取代。内核 2.4 目前使用 Linux 原生的“第三扩展文件系统”，通常表示为“ext3”或“ext3fs”。尽管内核 2.2.x
    和 2.4.x 支持 ext2fs 和 ext3fs，但最新的稳定版本即内核 2.4.20 使用“ext3fs”作为默认文件系统。ext3fs 是对 ext2fs
    功能的扩展，就像 Windows 中 NTFS 5.0 对 NTFS 4.0 的扩展一样。“ext2fs”和“ext3fs”文件系统之间的显著区别在于 ext3fs
    是一个“日志文件系统”，而 ext2fs 不是。我们将在后面详细讨论这些文件系统，当我们将它们与 Unix 文件系统（UFS）进行比较时，后者是 FreeBSD
    下的原生文件系统。


    “Linux 程序员手册”中有一个名为“FILESYSTEMS(5)”的部分。它解释了 Linux 支持哪些文件系统类型。可以在 Linux 工作站的命令行上简单输入“man
    fs”来访问所有详细信息。它包括以下文件系统：minix、ext、ext2、ext3、xia、msdos、umsdos、vfat、proc、nfs、iso9660、hpfs、sysv、smb、ncpfs。当文件系统按惯例挂载在
    /proc 上时，您可以在文件 /proc/filesystems 中找到当前内核支持的文件系统。如果您需要一个当前不支持的文件系统，您可以插入相应的模块或重新编译内核以创建新的内核。然后，只需安装新的自定义内核即可访问您选择的文件系统。要使用文件系统，您必须挂载它。


    下面是对一些可用文件系统的简要描述。minix 是 Minix 操作系统中使用文件系统，是第一个在 Linux 下运行的操作系统。它有许多缺点：64MB 分区大小限制、短文件名、单一时间戳等。它仍然可用于软盘和
    RAM 磁盘。ext 是 minix 文件系统的精细扩展。它已被完全扩展文件系统的第二版（ext2）取代，并在内核中被移除（在 2.1.21 中）。ext2fs
    是 Linux 用于固定磁盘以及可移动介质的高性能磁盘文件系统。第二扩展文件系统被设计为扩展文件系统（ext）的扩展。ext2 在 Linux 支持的文件系统中提供了最佳性能（就速度和
    CPU 使用率而言）。ext3 是 ext2 文件系统的日志版本。在 ext2 和 ext3 之间切换很容易。xia 是通过扩展 Minix 文件系统代码而设计和实现为稳定、安全的文件系统。它在不增加不必要的复杂性的情况下提供了最基本、最常请求的功能。xia
    文件系统不再积极开发或维护。它在 2.1.21 中从内核中移除。msdos 是 DOS、Windows 和一些 OS/2 计算机使用的文件系统。msdos
    文件名不能超过 8 个字符，后跟可选的句点和 3 个字符的扩展名。umsdos 是 Linux 使用的扩展 DOS 文件系统。它在 DOS 文件系统下增加了长文件名、UID/GID、POSIX
    权限和特殊文件（设备、命名管道等）的功能，而不会牺牲与 DOS 的兼容性。


    vfat 是 Microsoft Windows 95 和 Windows NT 使用的扩展 DOS 文件系统。VFAT 在 MSDOS 文件系统下增加了使用长文件名的功能。proc
    文件系统不是通用文件系统。它是一个“伪文件系统”，用作内核数据结构的接口，而不是读取和解释 /dev/kmem。特别是，其文件不占用磁盘空间。iso9660
    是符合 ISO 9660 标准的 CD-ROM 文件系统类型。Linux 支持 High Sierra，即 ISO 9660 标准的 CD-ROM 文件系统的前身。它在
    Linux 下的 iso9660 文件系统支持中自动识别。Linux 还支持由 Rock Ridge Interchange Protocol 指定的 System
    Use Sharing Protocol 记录。它们用于进一步描述 iso9660 文件系统中的文件给 UNIX 主机，并提供诸如长文件名、UID/GID、POSIX
    权限和设备等信息。它在 Linux 下的 iso9660 文件系统支持中自动识别。hpfs 是 OS/2 中使用的高性能文件系统。由于缺乏可用文档，该文件系统在
    Linux 下是只读的。sysv 是为 Linux 实现的 SystemV/Coherent 文件系统。它实现了所有 Xenix FS、SystemV/386
    FS 和 Coherent FS。nfs 是用于访问远程计算机上磁盘的网络文件系统。smb 是一个支持 SMB 协议的网络文件系统，由 Windows for
    Workgroups、Windows NT 和 Lan Manager 使用。要使用 smbfs，您需要一个特殊的挂载程序，可以在 ksmbfs 包中找到。ncpfs
    是一个支持 NCP 协议的网络文件系统，由 Novell NetWare 使用。


