    读者必须注意，我在这里本节中谈论的是使用 Microsoft fdisk 实用程序“分区硬盘”，目的是为绝对的新手提供有关如何分区和格式化新硬盘驱动器的一般信息。


    ## 第 D 节：安装 MS Windows NT（4.0）


    ## 第 E 节：安装 MS Windows 2000（专业版）


    ## 第 F 节：安装 MS Windows XP（家庭版/专业版）


    要安装上述 3 种操作系统中的任意一种，首先使用 fdisk 工具分区硬盘。然后再选择文件系统类型。


    在全新安装 Windows NT、2000 或 XP 期间，您可能需要选择计算机应使用哪种文件系统。在我的另一台电脑上，我个人使用的是支持以下功能的 Microsoft
    Windows XP Professional：


    - FAT32：文件分配表（FAT）系统的增强版本，自 Windows 95 后期（32 位）版本开始成为所有 Windows 操作系统的标准。FAT32
    系统可用于从 512 兆字节（MB）到 32 千兆字节（GB）的大型硬盘。


    - NTFS：NT 文件系统（NTFS）与 Windows NT、Windows 2000 和 Windows XP 操作系统一起使用。NTFS 提供了增强的可靠性、稳定性和安全性，并支持高达
    2 太字节（TB）的大型硬盘。


    但非常“重要”的信息：转换到 NTFS 是一条单向路；如果您将 FAT 或 FAT32 文件系统转换为 NTFS，就无法稍后将硬盘转换回 FAT。


    如果您不确定使用哪种文件系统，我建议使用 FAT32。如果您想更改文件系统，这里有几点建议：


    - 1. 如果您的硬盘小于 32 GB，请使用 FAT32。

    - 2. 如果您想在一台计算机上安装多个操作系统，请使用 FAT32。

    - 3. 如果您的硬盘大于 32 GB 并且您只在一台计算机上运行一个操作系统，请使用 NTFS。

    - 4. 如果您想要增强的文件安全性，请使用 NTFS。

    - 5. 如果您需要更好的磁盘压缩，请使用 NTFS。


    您可以选择任何您想要的文件系统类型。选择文件系统后，照常继续进行 Windows NT/2000/XP 安装。安装后，随意配置您的新系统。我个人选择了“FAT32”文件系统来格式化我安装
    Microsoft Windows XP Professional（最终版）的分区。它构成了我电脑上的第一个操作系统。


    ### 实际步骤摘要：


    好吧，关于不同的 Microsoft 操作系统就说到这里。现在让我们更仔细地看看我们将如何分区硬盘。如上所述，我们使用 Microsoft fdisk，然后创建一个大约
    2000MB 的主 DOS 分区。在我的电脑上，我有一个 999MB 的主分区，其中包含 Microsoft Windows 98（SE）。我使用这么小的空间是因为我几乎不在
