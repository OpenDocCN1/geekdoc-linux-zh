    ## 4. 故障排除


    尽管 FreeBSD、OpenBSD 和 GNU/Linux 操作系统都是非常出色的软件，但在将它们全部或组合双启动或多启动 PC 时，人们经常会遇到问题。问题范围从易于检测和排除的到非常奇怪的问题。故障排除，正如所有
    UNIX 老手所知（并欣赏），并不是一门精确的艺术。在本章中，我列出了我在双启动和多启动系统时遇到的一些问题，这些系统使用不同的操作系统和硬件。


    读者必须注意，根据使用的特定硬件和发行版/版本，他们可能会遇到下面列出问题的略有不同版本。如果你遇到一个全新的问题，或者可以通过提供下面列出问题的更好解决方案为本指南做出贡献，请务必给我发邮件至：subhasish_ghosh@linuxwaves.com。


    我个人在多启动系统方面的经验看到了一些奇怪的故障类型，并且经常出现不稳定的行为，但大多来自 Linux 的 fdisk 和安装程序。我经常为以后诊断和排除故障而做笔记。正如我所能得出的结论，在
    Linux 发行版（包括 Red Hat、Slackware、SuSE 和 Mandrake）、OpenBSD 和 FreeBSD 版本中，FreeBSD
    的 fdisk、disklabel 和整体安装程序（/stand/sysinstall）是其中最好的，绝对没有错误和突然崩溃。最初，我总是认为必须有一种精确的方式来安装所有这些操作系统，或者必须遵循一个确切的顺序，但随着时间的推移，我学到了真相：只要硬件支持良好，安装
    CD-ROM 没问题，安装程序的不稳定行为是由于之前安装的未擦除数据造成的。因此，在致力于创建多启动系统之前，请确保在全新格式化的硬盘上开始安装。继续阅读以了解该程序的详细信息！一些常见的读者问题包括：


    ### Q1. 我创建了一个扩展分区，其中包含逻辑磁盘驱动器或其内的子分区。但当我安装 FreeBSD 时，它完全忽略了该分区内的内部分区。这是正常的吗？


    Ans1: 是的，这绝对正常。FreeBSD 操作系统软件只能检测并表示它称为“slices”的主硬盘分区。扩展分区虽然会在 FreeBSD fdisk 中表示，但不会表示容器的组成部分。


    ### Q2. 我已成功在我的 PC 上安装了 FreeBSD 和 OpenBSD 操作系统。当我尝试安装 Red Hat Linux 时，Linux 的
    fdisk 显示了“too many partitions”错误消息。这是什么意思？我现在可以做什么？


    ### Q3. 我删除了我 PC 上 FreeBSD、OpenBSD 和/或 NetBSD 操作系统的早期安装。当我尝试安装 Red Hat Linux 时，Linux
    的 fdisk 显示了“too many partitions”错误消息。我现在应该做什么？


    '
