    GNU General Public License (GPL). A copy of the GPL is included with the Linux
    source; you can also get a copy from ftp://prep.ai.mit.edu/pub/gnu/COPYING..."
    .


    Readers must note the fact that though many Linux users worldwide refer to the
    GNU/Linux operating system simply as "Linux", it is more appropriate to refer
    to the operating system as a GNU/Linux system and when talking about the kernel
    in particular just to call it Linux. Moreover, a very popular misconception amongst
    new Linux users is: "Hey! Linux is UNIX!". No, absolutely "not". Once again, readers
    must note: The Linux kernel is a UNIX-clone, in other words a reimplementation
    of the UNIX-Kernel, but it is not UNIX itself. On the other hand, the BSDs, FreeBSD
    and OpenBSD for example, are not kernels merely. They are more closer to the real
    UNIX (AT&T''s Official Release UNIX SVR4). They represent an entire operating
    system with a whole set of applications, tools, user utilities, shells, games,
    documentation, developer utilities, system and user-level binaries and full source
    code for the operating systems.


    # 3.1.3 FreeBSD:


    FreeBSD which stands for the Free version of Berkeley Software Distribution operating
    system software (though all the BSDs out there are "open-source" or "free" in
    nature) is technically speaking, the most powerful, professional quality and advanced
    UNIX-compatible operating system software on earth today. FreeBSD is originally
    based on 4.4BSD-Lite (with a minor inclusion from the 4.4BSD-Lite2 code base too),
    developed at the University of California, Berkeley, under the authorization of
    the Computer Systems Research Group (CSRG), Computer Science Division, Department
    of Electrical Engineering and Computer Science at Berkeley. FreeBSD operating
    system (just like a Linux distribution) comes with a whole set of packages, including
    user applications, tools, user utilities, shells, games, documentation, developer
    utilities, system and user-level binaries and full source code for the operating
    systems. The FreeBSD Project web-site can be accessed at: http://www.freebsd.org.


    Recently, a lot of media spotlight has put the GNU/Linux system (more specifically
    the Linux Kernel) in a stardom status. Some rate Linux as the best ever written
    UNIX-clone that would spell disaster for UNIX and other UNIX-clones and UNIX-compatibles
    out there in the market. But in reality it is not so. Readers must note: Just
    as the power of an automobile comes from the quality of the engine running under
    it''s hood, similarly features like stability, reliability, extensibility and
    robustness of an operating system software comes from the internal structure of
    the Kernel or the core of that corresponding operating system. I personally feel
    that both the Linux and the FreeBSD Kernel are great works of creativity and tremendous
    effort and just a user-level or technical comparison between the two is meaningless.
    Situations where memory is a scarcity and moreover gets crunched and stressed
    upon real hard, the Linux Kernel breaks down. FreeBSD with it''s highly optimized
    and advanced VM/Swap system comes to the rescue! On the other hand, under given
    situations, Linux may outperform FreeBSD by a mile. The significant point for
    readers to note and remember is that the Linux Kernel favors simplicity over highly
    optimized and dynamic yet more complex code whereas the FreeBSD Kernel optimizes
    performance by introducing more complex code and heavily optimizing the code base
    by rearranging and rewriting some of the more important internal algorithms and
    data structures from time to time.


    A complete and exhaustive discussion on Linux and FreeBSD Kernels is beyond the
    scope of this guide. If readers find it interesting, they may search the Internet
    for more Linux and/or FreeBSD specific information. I would suggest the readers
    to read "Understanding the Linux Kernel" by Bovet and Cesati for getting more
    in-depth information on the inner-workings of the Linux Kernel, "The Design and
    Implementation of the 4.4BSD Operating System" for'
