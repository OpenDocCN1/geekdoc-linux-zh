    # Windows+BSD+Linux Installation Guide


    # Subhasish Ghosh


    subhasish_ghosh@linuxwaves.com Version: v1.1 Last updated: August 21st, 2003


    # Revision History:


    +   - v1.0: Initial release, reviewed by Linux Documentation Project (LDP). A
    few structural changes and minor corrections made; Chapters "Troubleshooting"
    and "Installing OpenBSD 3.2-RELEASE" added.

    +   - v1.1: Corrections made and info added. Information on FreeBSD -RELEASE updated
    to cover 4.8-RELEASE. Chapter "Installing NetBSD 1.6.1" added and a few minor
    modifications made to the guide.


    > Welcome! This document explains how three different operating systems can be
    installed and configured on the same hard disk of a computer. The reader may choose
    from: Microsoft Windows 95/98(Second Edition)/Millennium Edition(ME)/NT/2K/XP
    + FreeBSD 4.8-RELEASE/OpenBSD 3.2-RELEASE/NetBSD 1.6.1 + Linux. Only Intel architecture
    multi-booting is discussed and GNU GRUB is the boot loader of choice. If you have
    any questions or comments, feel free to contact me by e-mail at this address:
    subhasish_ghosh@linuxwaves.com. Thank you!


    Note: In the Organization section, readers must choose to execute Chapter 3 or
    Chapter 4 or Chapter 5.


    # 1. Introduction


    +   - 1.1 Purpose of this Guide

    +   - 1.2 What is Multiple-booting?

    +   - 1.3 Multi-booting Pros and Cons

    +   - 1.4 List of Assumptions

