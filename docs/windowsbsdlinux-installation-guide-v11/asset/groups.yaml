  mdcn: "\n\n## 3.3 安装 FreeBSD 4.8-RELEASE\n\n本章重点介绍安装 FreeBSD 4.8-RELEASE 并使系统多启动，以便它能与计算机上已有的\
    \ Windows 操作系统成功共存。与 Windows 安装一样，它也侧重于基于 CD-ROM 的安装。专家可以照常自行进行，而对于新手，请务必查看 FreeBSD\
    \ 文档项目中的 FreeBSD 2.X、3.X 和 4.X 常见问题解答，网址为 http://www.freebsd.org。有关带屏幕截图的分步 FreeBSD\
    \ 安装程序，请参阅 FreeBSD 手册第 2 章：安装 FreeBSD，网址为 http://www.freebsd.org/doc/en_US.ISO8859-1/books/handbook/index.html。这些以及\
    \ FreeBSD 项目主页上提供的其他文档对 FreeBSD 软件的所有相关方面提供了详尽而广泛的覆盖。在继续本指南之前，请务必从该网站获取尽可能多的信息。\n\
    \n读者必须注意，在撰写本文时，FreeBSD 操作系统存在两个并行的分支。最新的 -STABLE 版本是 FreeBSD 4.8-RELEASE，而最新的\
    \ -CURRENT 版本是 FreeBSD 5.1-RELEASE。在本章中，我们将讨论安装 FreeBSD 4.8-RELEASE 的一些理论方面、磁盘分区（在\
    \ FreeBSD 术语中更常称为切片），然后进入实际安装本身。因此，本章的内容可归类为以下提及的部分：\n\n- 1. FreeBSD 中的切片\n- 2.\
    \ FreeBSD 中的文件系统\n- 3. 安装步骤摘要\n\n## 1. FreeBSD 中的切片\n\n在安装 FreeBSD 之前，先简要了解一下\
    \ FreeBSD 所称的“切片”是个不错的主意。如果你已经了解这些内容，可以随意跳过此部分并阅读标题为“安装步骤摘要”的部分。\n\nFreeBSD 操作系统根据特定选择的方案对硬盘进行分区并标记分区，该方案与\
    \ NetBSD、OpenBSD、Ultrix、Digital Unix 和 SunOS 等其他基于 BSD 的 Unix 系统相似。让我们看看 FreeBSD\
    \ 软件如何“切片”你的硬盘，然后在其中“创建分区”以供使用。每个包含文件系统的分区都存储在 FreeBSD 所称的“切片”中。切片是 FreeBSD 对过去所称分区所使用的术语。切片从\
    \ 1 编号，至 4 止（在 Windows 术语中，它们将被称为“主分区”，从 1 编号，至 4 止）。因此，读者必须注意，Windows 中的“主分区”指的是\
    \ FreeBSD 术语中的“切片”，而“包含逻辑磁盘驱动器的扩展分区”在 FreeBSD 术语中 simply 称为“分区”。扩展分区内的逻辑磁盘驱动器在\
    \ FreeBSD 中也可能称为“物理切片内的逻辑切片”。有时看起来有点别扭，但读者越早习惯这些术语越好！\n\n现在，重要部分。有一些操作系统即使其对应的引导文件存储在扩展分区的逻辑磁盘驱动器中也能引导。对于\
    \ FreeBSD 来说，这种机制“不”起作用。FreeBSD 必须需要其中一个切片（即计算机硬盘上分区表中的 4 个条目，在 Windows 术语中将被称为“主分区”）。然后它使用一个名为“disklabel”的程序在此切片中创建多达八个分区。读者必须注意：你不能在\
    \ Linux（或 DOS）创建的扩展分区中安装 FreeBSD。\n\nFreeBSD 对硬盘和分区进行如下标记：\n\n- 第一个 IDE 硬盘驱动器（主主盘）\
    \ – /dev/ad0\n- 第二个 IDE 硬盘驱动器（主从盘） – /dev/ad1\n- 第三个 IDE 硬盘驱动器（从主盘） – /dev/ad2\n\
    - 第四个 IDE 硬盘驱动器（从从盘） – /dev/ad3\n\n其中，/dev 是 FreeBSD 根（“/”）目录下的目录，其中包含与设备关联的所有设备特殊文件。读者必须注意，我假设读者使用的是\
    \ FreeBSD 4.X-RELEASE。FreeBSD 4.0-RELEASE 之前的 IDE 硬盘驱动器命名为 wd。\n\nSCSI 驱动器呢？好吧，FreeBSD\
    \ 也对它进行标记！\n\n- 第一个 SCSI 硬盘驱动器（主主盘） – /dev/da0\n- 第二个 SCSI 硬盘驱动器（主从盘） – /dev/da1\n\
    - 第三个 SCSI 硬盘驱动器（从主盘） – /dev/da2\n- 第四个 SCSI 硬盘驱动器（从从盘） – /dev/da3\n\n其中，/dev\
    \ 是 FreeBSD 根（“/”）目录下的目录，其中包含与设备关联的所有设备文件。\n\n现在，让我们谈谈 FreeBSD 下的分区方案。它与 Linux\
    \ 中的类似，只是分区命名方式不同。在 FreeBSD 中，我们首先考虑一个特定的硬盘驱动器，无论是 IDE 还是 SCSI 硬盘驱动器。然后，我们考虑其上的分区。例如，IDE\
    \ 驱动器上的分区命名如下（以 /dev/ad0 为例）：\n\n- 第一个主分区 – /dev/ad0s1\n- 第二个主分区 – /dev/ad0s2\n\
    - 第三个主分区 – /dev/ad0s3\n- 第四个主分区 – /dev/ad0s4\n\n上述驱动器也可能包含分区。FreeBSD 也对它们进行标记，并且每个标记都有其自己的对应挂载点。让我们考虑一个例子。一台计算机的硬盘命名为\
    \ /dev/ad0，包含 2 个切片；第一个切片是 FAT32 分区，第二个是包含 4 个逻辑切片 [逻辑磁盘驱动器] 的 BSD/i386 分区。那么，在这种情况下，分区表会是什么样子以及意味着什么？让我们看看\
    \ FreeBSD 如何标记此方案。FreeBSD 会将其表示为：\n\n- /dev/ad0\n  - /dev/ad0s1\n  - /dev/ad0s2\n\
    \    - /dev/ad0s2a\n    - /dev/ad0s2b\n    - /dev/ad0s2e\n\n"
