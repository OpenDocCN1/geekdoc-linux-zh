    boot loaders like System Commander and Partition Magic), add GRUB to the "first
    sector of your root partition" and then configure the other boot loader to start
    GRUB (which will then boot Red Hat Linux).


    11. Once you have created the partitions and installed GRUB in the MBR, all that
