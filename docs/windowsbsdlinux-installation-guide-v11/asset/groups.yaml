    filesystem of your choice. In order to use a filesystem, you have to mount it.


    Below is a short description of a few of the available filesystems. minix is the
    filesystem used in the Minix operating system, the first to run under Linux. It
    has a number of shortcomings: a 64MB partition size limit, short filenames, a
