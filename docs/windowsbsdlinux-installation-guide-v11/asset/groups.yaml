    If you want to customize the size of the partitions (drive letters) on the hard
    disk, press N, and then press enter. A dialog box is displayed in which you can
    type the size that you want for the primary partition in MB or percent of disk
    space. Note that for computers that are running either Windows 98 (SE) or Windows
    ME, Microsoft recommends that you make the primary partition at least 500 MB in
    size. Type the size of the partition that you want to create, and then press enter.
    Press ESC to return to the Options menu. To assign drive letters to the additional
    space on the hard disk, press 1, and then press enter. Press 2 to select the Create
    Extended DOS Partition menu option, and then press enter. You receive a dialog
    box that displays the maximum space that is available for the extended partition.
    You can adjust the size of the partition or use the default size. Note that the
    default maximum space is recommended, but you can divide the space between multiple
    drive letters. Type the amount of space that you want, press enter, and then press
