    and I would love to install 3 operating systems on them. Would you be kind enough
    to come to my place and do the installation and configuration?


    If you do live in Moscow, or on the outskirts of Moscow; drop me a line. I would
    come down to your place and do everything that is required for free. Cannot help
    others living far.


    ## 18. (For people of Russia) We love Microsoft Windows, FreeBSD and OpenBSD operating
    systems. But "why" have you NOT used the common Russian GNU/Linux distributions?
    I mean "ASP Linux", "Black Cat Linux", "ALT Linux" and others?


    All the above-mentioned GNU/Linux distributions are basically Red Hat-based Linux
    distributions. They heavily rely on Red Hat for package installation procedures,
    Kernel hacking, Kernel updates etc. I have used ASP Linux 7.2 myself, and though
    it does offer a few new and exciting features, but I personally prefer working
