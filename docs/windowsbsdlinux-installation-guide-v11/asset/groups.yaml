    FTP", "NFS Server", "NFS Client", setting up a "Security Profile", "System Console
    Settings", "Setting The Time Zone", "Adding Users and Groups" and so on. For an
    exhaustive covering of each and every step along with helpful screenshots, please
    refer to the FreeBSD Handbook at http://www.freebsd.org.


