  - '[PAGE 7]


    # Linux" and others?


    1. **What is the aim/purpose of this Guide?**


    This guide can be used by anyone for installing and configuring 3 operating systems
    (OSes) on the same hard disk of a computer. First, a Microsoft Windows operating
    system (according to the choice of the reader) is installed, then FreeBSD 4.8–RELEASE
    or OpenBSD 3.2–RELEASE or NetBSD 1.6.1 is installed and finally, we round-off
    the guide by installing Red Hat Linux 7.3. Though I always use this particular
    order, the reader can install in an order comfortable to him/her.


    2. **Why have you used "3" operating systems for this guide?**


    The current scenario is such that Microsoft Windows operating systems rule the
    desktops, with GNU/Linux distributions and *BSD releases (FreeBSD/OpenBSD/NetBSD)
    competing for "total world domination" in the server markets, thus, I thought
    it would be the absolute best to include all of them in this guide. The first
    OS is a Microsoft Windows OS, the second one belonging to the *BSD family and
    the last one a commonly used GNU/Linux distribution (Red Hat). Thus, the number
    of OSes ended up with "3".


    3. **Did you yourself try out the steps mentioned in this guide? What are the
    configurations of the computer system on which you tested all the material mentioned
    in this guide?**


    I assure everyone that I tested each and every step mentioned in this guide on
    my personal computer systems. Later they were tested successfully on other computers
    with varying configurations as well. My computer has a 266.87 MHz Intel Pentium
    2 processor, 64MB Physical DIMM RAM, a single 20.0 GB Maxtor IDE HDD and other
    usual accessories which runs Microsoft Windows 98(SE), FreeBSD 4.8–RELEASE and
    Red Hat Linux 7.3. The other one with pretty much the same configuration runs
    FreeBSD 4.8–RELEASE, OpenBSD 3.2–RELEASE and Red Hat Linux 7.3. The general rule
    of the thumb is: "Better the resources, better the performance of the computer".


    4. **All your installations are "CD–ROM" based installation types. What about
    "Ethernet", "FTP", "HTTP", "NFS" installation types?**


    I decided to keep the guide as simple as possible. And since most of us usually
    use CDs from local CD–ROMs for installing operating systems, I have assumed that
    the reader undertakes a CD–ROM based installation for installing the covered operating
    systems. Moreover, this guide is intended for all types of users, ranging from
    intermediate Linux users to the experienced Unix experts. Since, NFS, HTTP, FTP
