    ## 3.7 Mounting Filesystems


    Your computer now has a Microsoft Windows operating system, either FreeBSD 4.8-RELEASE
    or OpenBSD 3.2-RELEASE or NetBSD 1.6.1 and Red Hat Linux 7.3 installed and coexisting
    peacefully together. Is that all? Is that enough? I am sure, no! One of the most
    important reasons that I have Microsoft Windows 98(SE) + FreeBSD 4.8-RELEASE +
    Red Hat Linux 7.3 all running on my computer (on which I prepared a part of this
    guide you are reading right now) is because I spend most of my time doing things
    on FreeBSD and on Linux, but I need access to Windows owing to my projects at
    the university. So, I need to access data stored on my Windows partition from
    time to time. But every time when I am working on FreeBSD and I need to access
    some data on my Windows partition, I just cannot afford to reboot my computer,
    log into Windows, copy the files on a floppy and then logout, reboot once again,
    log into FreeBSD, and then copy the contents of the floppy on to my /home/ghosh
    directory on the FreeBSD system. A process like this is not cute, neither logical
    nor feasible. Thanks to the "mount" command on FreeBSD and Linux systems, I do
    not have to go through this "not so cute, neither logical nor feasible" process
    every time I need access to some data on my Windows partition occasionally.


    The mount command is definitely one of the most important commands available to
    the superuser (or root) account on a *nix system. It allows the root user of a
    *nix system to mount filesystems (for regular users to access and use) which may
    or may not be physically located on the same computer. That is, in other words,
    the mount command allows you to mount both a local filesystem (one that is present
    physically on the same computer) or a remote filesystem using the appropriate
    path for accessing the remote node. The mount command first appeared in Version
    1 ATTUNIX. See the manual page for the mount command on your FreeBSD or OpenBSD
    or Linux system for an in-depth analysis of all possible options that can be passed
    to the mount command.


    Though it is a very powerful command on a Unix or Unix-like system, the mount
    command itself if very simple and easy to use. The syntax for the mount command
    is: mount -t filesystem device_name mount_point. It means you are instructing
    the mount command to consider the device file named device_name which is of the
    filesystem type specified by the switch -t filesystem, and then graft it onto
    the existing FreeBSD/OpenBSD/Linux system at the directory named as the mount
    point. As cute as that!


    This chapter is divided into the following sections:


    - 1. Mounting filesystems in FreeBSD

    - 2. Mounting filesystems in Linux


    ### 1. Mounting filesystems in FreeBSD


    For mounting Linux Second Extended filesystem (ext2fs) on a FreeBSD system, I
    have to build and install a custom FreeBSD Kernel. Building and installing a custom
    kernel in FreeBSD is easy. I log in as "root" and execute these following steps
    to build one:


    - 1. I execute this from the command line: `cd /usr/src/sys/i386/conf`. If there
    is not a `/usr/src/sys` directory on your system, then the kernel source has not
    been installed. The easiest way to do this is by running `/stand/sysinstall` as
    root, choosing Configure, then Distributions, then src, and then sys.

    - 2. I create a copy of the original Kernel configuration file provided there
    as a sample by executing: `cp GENERIC GHOSH`. Here, I have named the would-be
    kernel GHOSH. Feel free to name it otherwise.

    - 3. I open the GHOSH text file using ee or vi editor. Though the general format
    of the configuration file is quite simple, full explanation of all the possible
    kernel options is beyond the scope of this guide. Please refer to the FreeBSD
    Handbook for more details. Add the following line: `options EXT2FS` which provides
    support for identifying ext2fs Linux native filesystem. Tinker with the other
    options if you feel like or simply leave them alone.

    - 4. Save it and exit. When I am done, I type the following to compile and install
    the new kernel: `/usr/sbin/config GHOSH`.

