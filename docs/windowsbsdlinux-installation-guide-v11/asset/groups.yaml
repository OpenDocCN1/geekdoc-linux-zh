    BIOS 自动加载。它是引导加载程序（无论是 LILO 还是 GRUB）控制整个引导过程的最早时机。GRUB 运行时，会读取其自身配置文件传递给它的指令（例如，Linux
    加载程序的配置文件是 /etc/lilo.conf，GRUB 的配置文件是 /boot/grub/grub.conf），将重要指令传递给 BIOS，然后将相应的操作系统引导文件加载到计算机内存中。这进而使正确的文件系统能在正确的挂载点被挂载，从而让计算机为接下来的使用做好准备。因此，引导加载程序对于操作系统能否正确引导至关重要。

    - 你可以使用 Linux 中可用的 2 个引导加载程序中的任意一个：Linux 加载程序（LILO）或 GNU 大统一引导加载程序（GRUB）。读者可以自由选择自己喜欢的任何一个。出于
    FAQ 中所述的原因，我更喜欢使用 GNU GRUB。读者必须注意，本指南省略了 GRUB 的设计、实现和配置细节，因为这些内容超出了本指南的范围。互联网上有大量关于这些及其他“自由”和“专有”引导加载程序的信息。如果需要，可以去了解一下。


    GRUB 是一个非常强大的基于 x86 的引导加载程序，可用于引导多种操作系统。GRUB 直接支持所有 GNU/Linux 发行版、FreeBSD、NetBSD、OpenBSD、Sun
    Solaris 等。它还支持使用“链式加载”技术引导其他专有操作系统。无论你的计算机上首先安装的是 Microsoft Windows 95/98 (SE)/Millennium
    Edition/NT/2K/XP，然后是 FreeBSD 4.8-RELEASE 或 OpenBSD 3.2-RELEASE；尽管放心，因为 GRUB 会凭借其强大的功能和动态特性处理好一切。如果你的计算机安装的是默认没有引导加载程序的
    Microsoft Windows 95/98 (SE)/Millennium Edition（不同于 Microsoft Windows NT/2K/XP），那么就“将
    GRUB 添加到 MBR”。


    - 启动后，你会看到 GRUB 界面，提示你选择操作系统。如果你的计算机安装的是 Microsoft Windows NT/2K/XP，它默认使用“NT 引导加载程序”来引导操作系统软件，那么也请“将
    GRUB 添加到 MBR”。不要惊慌！这完全不会造成任何问题。只是在这种情况下，成功启动后，你会看到 GRUB 界面提示你选择操作系统。列表中会有 2 个条目，例如，我有“Windows”和“Linux”。选择“Linux”并按回车会将
    Red Hat Linux 引导文件加载到计算机内存中，然后计算机自举进入 Linux。然而，在


