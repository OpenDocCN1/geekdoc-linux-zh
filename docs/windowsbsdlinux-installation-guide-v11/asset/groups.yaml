    each allocated space on the hard disk (primary partition, extended partition,
    or logical drive) is assigned a drive letter. Disk 1 may contain one extended
    partition, and a second hard disk may contain a primary or extended partition.
    An extended partition may contain one or more logical MS-DOS drives.


    After you have used the Fdisk tool to partition the hard disk, you can use the
    Format tool to format those partitions with a filesystem. The filesystem File
    Allocation Table (FAT) allows the hard disk to accept, store and retrieve data.
    Windows 95, Windows 98 (SE), Windows Millennium (ME) and Windows 2000 support
    the FAT16 and FAT32 filesystems. When you run the Fdisk tool on a hard disk that
    is larger than 512 megabytes (MB), you are prompted to choose one of the following
    file systems: FAT16 or FAT32. The FAT16 filesystem has a maximum of 2 gigabytes
    (GB) for each allocated space or drive letter. For example, if you use the FAT16
    filesystem and have a 6-GB hard disk, you can have three drive letters (C, D,
    and E), each with 2 GB of allocated space. As for the FAT32 filesystem, it supports
    drives that are up to 2 terabytes in size and stores files on smaller sections
    of the hard disk than the FAT16 filesystem does. This results in more free space
    on the hard disk. Please note that the FAT32 filesystem does not support drives
    that are smaller than 512 MB. When you run the "fdisk" and "format" commands,
    the Master Boot Record (MBR) and file allocation tables are created. The MBR and
    file allocation tables store the necessary disk geometry that allows hard disk
    to accept, store, and retrieve data.


    Please note that I have assumed that you own a computer system which can run without
    glitches and that you have access to a bootable Microsoft Windows CD-ROM. If you
    do run into problems booting from the CD-ROM or using Start-up disks, please consult
    your hardware manufacturer to obtain the CD-ROM device driver(s). For partitioning
    a master hard disk, you have to run the fdisk command. First insert the Startup
    disk in the floppy disk drive, restart your computer, and then use one of the
    following methods, depending on your operating system.


    ## For a Windows 95/98/ME Startup disk:

    At a command prompt, type fdisk, and then press enter. If your hard disk is larger
    than 512 MB, you receive the following message:


    > *Your computer has a disk larger than 512 MB. This version of Windows includes
    improved support for large disks, resulting in more efficient use of disk space
    on large drives, and allowing disks over 2 GB to be formatted as a single drive.*


    If you enable large disk support and create any new drives on this disk, you will
    **NOT** be able to access the new drive(s) using other operating systems, including
    some versions of Windows 95 and Windows NT, as well as earlier versions of Windows
    and MS-DOS. In addition, disk utilities that were not designated explicitly for
    the FAT32 file system will not be able to work with this disk. If you need to
    access this disk with other operating systems or older disk utilities, do not
    enable large drive support.


    Do you wish to enable large disk support?


    If you want to use the FAT32 file system, press Y and then press enter. If you
    want to use the FAT16 file system, press N, and then press enter. After you press
    enter, the following Fdisk Options menu is displayed:


    - 1. Create DOS partition or Logical DOS Drive

    - 2. Set active partition

    - 3. Delete partition or Logical DOS Drive

    - 4. Display partition information

    - 5. Change current fixed disk drive


    **Please note that option 5 is available only if you have two physical hard disks
    in the computer.**


    Press 1 to select the Create DOS partition or Logical DOS Drive menu option, and
    then press enter. Press 1 to select the Create Primary DOS Partition menu option,
    and then press enter. After you press enter, you receive the following message:


    Do you wish to use the maximum available size for primary DOS partition?


    After you receive this message, use one of the following methods, depending on
