    ## 2. FreeBSD 中的文件系统


    Microsoft Windows 操作系统使用 FAT16、FAT32、NTFS 4.0 和 NTFS 5.0 文件系统来存储和检索数据。最近发布的 NTFS
    5.0 已在所有 Windows 2000 操作系统中实现。Linux 内核使用“第三代扩展原生文件系统”，表示为 ext3fs。Linux 还支持 ext（现已过时且不再支持）和
    ext2fs 文件系统。“第二代扩展文件系统”（ext2fs）是为 Linux 操作系统开发的高级分层文件系统，其中包含高级功能，如最大文件大小为 2.0
    GB、最大文件名长度为 255 个字符以及支持三个时间/日期戳。它们分别是创建日期、最后修改日期和最后访问日期。“第三代扩展文件系统”具有所有这些功能，并且还实现了“日志文件系统架构”（JFS）。JFS
    架构确保在非计划关机（例如停电引起）事件中存储在硬盘上的数据完整性。日志文件系统维护所有读写事件的日志；此日志使磁盘能够恢复到最后稳定状态，并且还允许尽可能最大程度地恢复未完全写入的数据。


    FreeBSD 操作系统基本上使用 Unix 文件系统（UFS）架构作为其底层文件系统。伯克利对其进行了更多改进，被称为“伯克利改进”或“伯克利扩展”。这个文件系统目前被
    FreeBSD 用作其原生文件系统，通常被称为“快速文件系统”或 FFS，因为访问存储在 FFS 中的数据读取和写入非常快。该架构比 Linux 的 ext2fs
    稍微复杂一些。它提供了一种更好的方式来确保文件系统数据完整性，主要是通过“softupdates”选项。此选项减少同步 I/O 并增加同步 I/O，因为对
    UFS 文件系统的写入不是按扇区同步，而是根据文件系统结构进行同步。这确保了文件系统在两次更新之间始终保持一致。


    FreeBSD 文件系统还支持文件标志，可以阻止潜在入侵者。您可以向文件添加多个标志，例如不可变标志。不可变（schg）标志不允许对文件或目录进行任何更改，除非您将其移除。其他非常实用的标志还有仅追加（sappnd）、不可删除（sunlnk）和归档（arch）。当您将这些标志与内核安全级别选项结合使用时，您将拥有一个非常难以渗透的系统。简而言之，FreeBSD
    内核使用 UFS = UFS+FFS+Softupdates+dirpref+dirhash 功能来存储和检索数据


