    of prompt on your screen. It display something like: F1 DOS, F2 FreeBSD, F3 Linux;
    each one in a separate line. The Default: F1 is also shown. FreeBSD uses a 3-stage
    bootstrap by default, and this is actually the preceding bootblock, named /boot/boot0,
