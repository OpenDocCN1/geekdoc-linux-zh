    # 3. Summary of Installation Steps


    The partitioning scheme and filesystems covered in FreeBSD, its time for us to
    move on to the actual FreeBSD installation. For a complete step-by-step coverage
    of FreeBSD installation, please consult the installation guide available on the
    FreeBSD Project web site. As in the previous Chapter, here also, I would be mentioning
    only the significant steps for the installation. Use these steps to install FreeBSD
    on your computer and configure it for "multiple-booting":


    +   1. Right now, we have a computer running Microsoft Windows OS. On my PC, it
    is Windows 98 (SE). I put a bootable FreeBSD 4.8-RELEASE CD-ROM in the CD-ROM
    drive and reboot the system.

    +   2. The computer boots, reads the CD-ROM, displays the usual hardware probing
    messages on the screen, and presents you with the Kernel configuration menu. Exit
