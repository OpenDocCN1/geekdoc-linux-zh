    OpenBSD 文件系统在硬盘上 OpenBSD 分区上的布局。


    在双启动和多启动系统中，此消息几乎是正确 OpenBSD 安装的先决条件。如果在保存对 OpenBSD fdisk 的更改后，你没有看到此消息，则意味着 OpenBSD
    磁盘标签正在读取并使用来自之前安装的信息。这是危险的情况，因为如果磁盘标签使用旧的磁盘标签数据，并且自其最初创建以来任何分区信息已发生变化，则磁盘标签的行为会变得不稳定，你可能会遇到奇怪的问题。为防止这种情况发生，请确保在执行
    OpenBSD 干净安装之前先清除磁盘。


    ## Q10. 我的 PC 上安装了 FreeBSD 4.8-RELEASE 和 OpenBSD 3.2-RELEASE 操作系统。我尝试在剩余的硬盘空间上安装
    Red Hat Linux。但每次我尝试使用 fdisk 或 Disk Druid 磁盘分区工具时，它都会标记出奇怪的错误信息。为什么会这样？ 我该如何将
    Red Hat Linux 安装到我的系统上？


    Ans10: 对此问题的诚实回答是：“没人确切知道为什么！”。多年来在执行双启动和多启动安装时，我注意到只要 OpenBSD 操作系统在附近，Red Hat
    Linux 的 fdisk 和 Disk Druid 就会标记出最多的错误信息。OpenBSD 对分区表的 fdisk 处理方式与 FreeBSD 和 Linux
    不同，并且不符合标准。这可能是众多可能解释之一。


    例如，让我描述一个真实情况。这发生在几周前（撰写本指南时）。我在测试 PC 上安装了 OpenBSD 3.2，然后安装了 FreeBSD 4.8。然后我尝试将
    Red Hat Linux 8.0（Psyche 版）安装到计算机上剩余的硬盘空间上。读者必须注意：我的系统上没有任何有故障的硬件，我满足所有硬件兼容性要求，我使用
    UNIX dd 实用程序在开始安装前清除了磁盘，我系统上可用的内存（物理 RAM）绝对是 100% 正确，并且 Red Hat Linux 8.0 安装 CD-ROM
    完好无损。然而，每次我尝试将 Linux 安装到我的系统上时（每次使用不同的启动时命令行选项），Linux 的 fdisk 都开始出现多个对话框。第一个说“/tmp/hda
    上存在无效分区”。当我忽略该错误时，一个新的对话框显示“无法正确对齐分区。这可能意味着另一个分区工具生成了不正确的分区表，因为它没有正确的 BIOS 几何结构。可以安全忽略，但忽略可能会导致某些引导加载程序出现（可修复的）问题”。Fdisk
    然后显示“分区过多”错误。错误、错误、错误就是我得到的一切！所以，我切换到 Red Hat Disk Druid 来碰碰运气！


    Red Hat 的 Disk Druid 显示了“/tmp/hda 上存在无效分区”消息，忽略后显示 OpenBSD 分区未使用且 /dev/hda 为 BSD/386
    分区。我强制执行“自动分区”过程，但它在一段时间后以“未处理的异常”惨败。我没有将崩溃转储保存到软盘，因为我没有发送错误报告的计划。


    这种情况发生在 Red Hat Linux 8.0（Psyche）上。我在 Red Hat Linux 发行版 7.3 和 7.1 上也遇到了相同的问题。但当我尝试安装
    Red Hat Linux 7.0 时，它毫无痛苦地安装，没有任何喊叫和哭泣。有谁在那里（或更具体地说在 Red Hat Inc.）能请解释一下到底发生了什么，或者
    Red Hat Linux 7.0 有什么特别之处，其他版本没有？我仍在试图弄清这个问题！


    ## Q11. 我读了上面的 PR（问题报告）。我的 PC 上也安装了 FreeBSD 和 OpenBSD 操作系统。但我想在我的系统上安装除 Red Hat
    之外的 Linux 发行版。你建议哪一个？


    Ans11: 如果你已经阅读并理解了上面的 PR，那么你尝试在系统上安装哪个 Linux 发行版根本毫无意义。我在尝试在测试计算机上安装 Mandrake
    9.0 以及 SuSE 7.0 时也遇到了类似问题。Mandrake Linux 管理创建分区、格式化它们，但在安装软件包时也惨败。SuSE 7.0 在一开始就崩溃了！在不久的将来，我想测试
    Red Hat Linux 9 在此类系统上的完整性！


    ## Q12. 在我的计算机上安装 FreeBSD 4.X-RELEASE 时，FreeBSD fdisk（或 disklabel）使用了 ''X'' 分区名称而不是
    /dev/ad[0-3]s[1-4]n 标记方案。嘿！到底发生了什么？那个 ''X'' 代表什么？


    Ans12: FreeBSD 操作系统软件允许每个切片 7 个分区（c: 保留用于整个硬盘空间）。如果你在 PC 上创建了太多分区，FreeBSD fdisk
    会使用 ''X'' 分区而不是有效的分区名称，例如 "/dev/ad0s1a"。如果你有一个标记为 ''X'' 的分区，你必须立即删除它，而不要继续进行。如果不删除此分区，FreeBSD
    disklabel 会让你继续整个安装，然后当你最终完成完整安装后，当你的系统启动时，你会遇到错误并被放入单用户模式进行维护。因此，换句话说，如果你不删除标记为
    ''X'' 的分区，FreeBSD 将无法完成启动序列。相反它会显示错误消息并进入单用户模式。


