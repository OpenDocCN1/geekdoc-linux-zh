    # 4. Troubleshooting


    Though FreeBSD, OpenBSD and GNU/Linux operating systems are very fine pieces of
    software, yet when dual or multi-booting PCs with all (or combinations) of them,
    one can often run into problems. It may range from easy ones to detect and troubleshoot
    to really weird ones. Troubleshooting, as known (and appreciated) by all UNIX-veterans
    is not an exact art. In this Chapter, I have listed some problems that I have
    had (and continue facing) while dual and multi-booting systems with varying operating
    systems and hardware.


    Readers must note that depending on the particular hardware and distributions/releases
    used, they may experience slightly different versions of the problems listed below.
    If you encounter a new problem altogether or can contribute to this Guide by providing
    a better solution to one of the problems listed below, make sure you drop me a
    line at: subhasish_ghosh@linuxwaves.com.


    My personal experience with multi-booting systems saw some weird kinds of failure
    and often erratic behavior, but mostly from Linux''s fdisk and installation procedure.
    I often made notes of them for diagnosing and troubleshooting later. As I can
    conclude, amongst Linux distributions (which includes Red Hat, Slackware, SuSE
    and Mandrake), OpenBSD and FreeBSD releases, FreeBSD''s fdisk, disklabel and overall
    installation procedure (/stand/sysinstall) is the best of them all with absolutely
    no errors and abrupt crashes. Initially, I always thought that there must be some
    exact way of installing all these operating systems or an exact order that needs
    to be followed, but with passing years, I have learnt the truth: Concerned the
    hardware support is fine, installation CD-ROMs okay, the erratic behavior of installation
    programs is due to unerased data from previous installs. So before committing
    yourself to creating a multi-booting system, make sure you start installation
    on a freshly formatted hard disk. Read on to follow the details of the procedure!
    Some of the common questions from readers include:


    # Q1. I created an extended partition with logical disk drives or sub partitions
    within it. But when I installed FreeBSD, it completely ignored the inner partitions
    within that partition. Is that normal?


    Ans1: Yes, it is absolutely normal. FreeBSD operating system software can only
    detect and represent primary hard disk partitions which it calls "slices". An
    extended partition, though would be represented in FreeBSD fdisk will not represent
    the constituents of the container.


    # Q2. I installed FreeBSD and OpenBSD operating systems on my PC successfully.
    When I tried installing Red Hat Linux, Linux''s fdisk displayed a "too many partitions"
    error message. What does it mean? What can I do now? or,


    # Q3. I deleted earlier installs of FreeBSD, OpenBSD and/or NetBSD operating systems
    on my PC. When I tried installing Red Hat Linux, Linux''s fdisk displayed a "too
    many partitions" error message. What am I supposed to do now?'
