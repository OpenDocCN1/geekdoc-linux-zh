    # 3.3 Installing FreeBSD 4.8-RELEASE


    This Chapter focuses on installing FreeBSD 4.8-RELEASE and multi-booting the system
    so that it can coexist successfully with the already existing Windows operating
    system on the computer. Like the Windows installation, it too focuses on a CD-ROM
    based installation. Experts may proceed as usual without help, as for the newbies
    out there, make sure you check out the Frequently Asked Questions for FreeBSD
    2.X, 3.X and 4.X at the "The FreeBSD Documentation Project" at http://www.freebsd.org.
    For a step-by-step FreeBSD Installation procedure with screenshots, please refer
    to the Chapter 2 : Installing FreeBSD of the FreeBSD Handbook at http://www.freebsd.org/doc/en_US.IS08859-1/books/handbook/index.html.
    These and the other documentation available on the FreeBSD Project homepage provides
    exhaustive and extensive coverage of all aspects related to the FreeBSD software.
    Make sure you grab as much information as you can from this site before proceeding
    with this guide.


    Readers must note that at the time of writing, 2 parallel branches of the FreeBSD
    operating system exist. The latest -STABLE release is the FreeBSD 4.8-RELEASE
    while the latest -CURRENT release is the FreeBSD 5.1-RELEASE. In this Chapter,
    we would discuss some theoretical aspects of installing FreeBSD 4.8-RELEASE, disk
    partitioning (better known as slicing in FreeBSD terminology) and then move on
    to the actual installation itself. Thus, the contents of this Chapter may be categorized
    in the following sections mentioned below:


    +   1. Slicing in FreeBSD

    +   2. Filesystems in FreeBSD

    +   3. Summary of Installation Steps


    # 1. Slicing in FreeBSD


    Before installing FreeBSD, it would be a good idea to take a brief tour of what
    FreeBSD calls "slicing". If you already know this stuff, feel free to skip this
    part and read the section entitled "Summary of Installation Steps".


    The FreeBSD operating system partitions (a hard disk) and labels partitions according
    to a particular chosen scheme which is similar to other BSD-based Unix systems
    such as NetBSD, OpenBSD, Ultrix, Digital Unix and SunOS. Let us see how the FreeBSD
    software "slices" your hard disk and then "creates partitions in it" for use.
    Each partition—that-contains-a-filesystem is stored in what FreeBSD calls a "slice".
    Slice is FreeBSD''s term for what were earlier called partitions. Slices are numbered,
    starting at 1, through to 4 (In Windows terminology, they would be called as "primary
    partitions", starting at 1, through to 4). Thus, the reader must note that "a
    primary partition" in Windows refers to a "slice" in FreeBSD terminology, and
    "an extended partition containing logical disk drives in it" is simply called
    as "partitions" in FreeBSD terms. A logical disk drive within an extended partition
    may also be called as "a logical slice inside a physical slice" in FreeBSD. It
    may appear a bit awkward at times, but the sooner the reader gets used to these
    terms, the better!'
  - '[PAGE 23]


    Now, the important part. There exists a few operating systems which can boot even
    if their corresponding boot files are stored within a logical disk drive of an
    extended partition. For FreeBSD, this mechanism does "not" work. FreeBSD necessarily
    needs one of the slices (that is the 4 entries in the partition table on your
    computer''s hard drive, which in Windows terminology would be called as a "primary
    partition"). It then uses a program called "disklabel" for making upto eight partitions
    in this slice. The reader must note: You cannot install FreeBSD in an extended
    partition made by Linux (or DOS).


    FreeBSD labels hard drives and partitions as follows:


    +   ◆ First IDE hard disk drive (Primary Master) – /dev/ad0

    +   ◆ Second IDE hard disk drive (Primary Slave) – /dev/ad1

    +   ◆ Third IDE hard disk drive (Secondary Master) – /dev/ad2

    +   ◆ Fourth IDE hard disk drive (Secondary Slave) – /dev/ad3


    where, /dev is the directory under the root ("/") directory in FreeBSD which contains
    all the device special files associated with devices. Readers must note that I
    assume readers are using a FreeBSD 4.X-RELEASE. IDE hard disk drives are named
    as wd before the FreeBSD 4.0-RELEASE.


    What about SCSI drives? Well, FreeBSD labels that too!


    +   ◆ First SCSI hard disk drive (Primary Master) – /dev/da0

    +   ◆ Second SCSI hard disk drive (Primary Slave) – /dev/da1

    +   ◆ Third SCSI hard disk drive (Secondary Master) – /dev/da2

    +   ◆ Fourth SCSI hard disk drive (Secondary Slave) – /dev/da3


    where, /dev is the directory under the root ("/") directory in FreeBSD which contains
    all the device files associated with devices.


    Now, let us talk about the partitioning scheme under FreeBSD. It is just like
    in Linux, only the way the partitions are named is different. In FreeBSD, we first
    consider a particular hard disk drive, whether an IDE or a SCSI hard disk drive.
    Then, we consider the partitions on it. For example, the partitions on an IDE
    drive are named in the following way (/dev/ad0 is used as an example):


    +   ◆ First primary partition – /dev/ad0s1

    +   ◆ Second primary partition – /dev/ad0s2

    +   ◆ Third primary partition – /dev/ad0s3

    +   ◆ Fourth primary partition – /dev/ad0s4


    These above mentioned drives may contain partitions as well. FreeBSD labels them
    too and each label has it''s own corresponding mount point too. Let us consider
    an example. A computer has /dev/ad0 as its hard disk named, contains 2 slices;
    the first slice is a FAT32 partition and the second a BSD/i386 partition containing
    4 logical slices [logical disk drives] in it. So, in this case, how would the
    partition table look like and mean? Let us see how FreeBSD labels this scheme.
    FreeBSD would represent this as:


    +   • /dev/ad0

    +     • /dev/ad0s1

    +     • /dev/ad0s2

    +       • /dev/ad0s2a

    +       • /dev/ad0s2b

    +       • /dev/ad0s2e'
