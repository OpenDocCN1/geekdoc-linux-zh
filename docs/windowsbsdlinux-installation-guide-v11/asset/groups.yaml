    +     - 3.1.2 Linux

    +     - 3.1.3 FreeBSD

    +     - 3.1.4 OpenBSD

    +     - 3.1.5 NetBSD

    +   - 3.2 Chapter 2: Installing Microsoft Windows

    +     - Section A: Installing MS Windows 95'
