- raw:
  - '[PAGE 20]


    Readers must note that I speak about "partitioning a hard disk" using Microsoft
    fdisk utility in general here in this section in order to provide the absolute
    newbies with general information on how to partition and format a new hard disk
    drive.


    # Section D: Installing MS Windows NT (4.0)


    # Section E: Installing MS Windows 2000 (Professional)


    # Section F: Installing MS Windows XP (Home/Professional)


    For installing any one of these 3 above-mentioned OSes, first use fdisk tool to
    partition your hard disk. Then comes to choosing the filesystem type.


    During a new installation of Windows NT, 2000 or XP, you may have to choose which
    file system your computer should use. On my other PC, I personally use Microsoft
    Windows XP Professional which supports:


    FAT32: An enhanced version of the file allocation table (FAT) system that is standard
    on all Windows operating systems starting with later (32-bit) versions of Windows
    95. The FAT32 system can be used on large hard disks, from 512 megabytes (MB)
    to 32 gigabytes (GB).


    NTFS: The NT file system (NTFS) is used with the Windows NT, Windows 2000, and
    Windows XP operating systems. NTFS provides enhanced reliability, stability, and
    security, and supports large hard disks of up to 2 terabytes (TB).


    But very "important" information: The conversion to NTFS is one-way only; if you
    convert your FAT or FAT32 file system to NTFS you cannot convert your hard disk
    back to FAT later.


    If you are not sure which file system to use, I would suggest using FAT32. If
    you want to change your file system, here are a few recommendations:


    +   1. Use FAT32 if your hard disk is smaller than 32 GB.

    +   2. Use FAT32 if you want to install more than one operating system on your
    computer.

    +   3. Use NTFS if your hard drive is larger than 32 GB and you are running only
    one operating system on your computer.

    +   4. Use NTFS if you want enhanced file security.

    +   5. Use NTFS if you need better disk compression.


    You can choose any filesystem type that you wish. After choosing the filesystem,
    proceed with the Windows NT/2000/XP installation normally. After installation,
    feel free to configure your new system. I personally chose the "FAT32" filesystem
    for formatting the partition in which I installed Microsoft Windows XP Professional
    (Final Release). It formed the first OS on my computer.'
  - '[PAGE 21]


    # Summary of the actual steps:


    Okay, enough said about the different Microsoft operating systems. Now let us
    look more closely how exactly we would partition the hard disk. As mentioned above,
    we use Microsoft fdisk, then create a Primary DOS Partition of about 2000MB or
    so. On my PC, I have a primary partition of 999MB which contains Microsoft Windows
    98 (SE). I have used such a small space cause I hardly do any work on Windows
    thereby reserving space for FreeBSD and Linux! Readers can choose a bit more space
    if they feel like doing so. After creating this partition, do not forget to format
    it using the Format tool. On my system, I have a FAT32 Primary partition.


    After creating this Primary Partition (suppose say, of 999MB), we do not (I repeat:
    do not) need to create any more partitions using Microsoft fdisk utility. For
    example, I have a 20.0 GB Maxtor HDD. I create a primary partition of about 1000MB
    using fdisk. The obvious question from the reader is: What about the rest 19GB?
    What happens to it? Well the answer is simple. I leave it untouched because I
    would be dividing this available space into 2 halves for installing FreeBSD or
    OpenBSD and Linux while using the FreeBSD Partition editor or OpenBSD Partition
    editor while installing FreeBSD 4.8-RELEASE or OpenBSD 3.2-RELEASE or NetBSD 1.6.1.
    So, no need to worry absolutely and just take the ride with me. I promise, by
    the time you are done reading this guide, not a single MB on your hard disk will
    be wasted.


    Thus, before we finally move on to the next section where we install and configure
    FreeBSD 4.8-RELEASE or OpenBSD 3.2-RELEASE or NetBSD 1.6.1, I would like to round-off
    this chapter with a "Partition check". I have the following partition table on
    my computer after this step (as observed from Microsoft fdisk):


    # Display Partition Information


    | Partition | Status | Type | Volume_Label | Mbytes | System | Usage |

    |-----------|--------|------|--------------|--------|--------|-------|

    | C:1       | A      | PRI DOS | WIN      | 1000   | FAT32  | 5%    |


    Once this done, reboot your computer and using a bootable Microsoft Windows CD-ROM
    (depending on your operating system of choice), install the OS as usual. Do the
    usual system configuration and log into Windows to check whether everything works
    fine. That is all for this section, now take a break, have a coffee and proceed
    to the next chapter, Chapter 3: Installing FreeBSD 4.8-RELEASE.'
