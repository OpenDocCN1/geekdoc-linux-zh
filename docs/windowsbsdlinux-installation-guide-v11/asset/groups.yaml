    Red Hat Linux on my system?


    Ans10: An honest answer to this question is: "Nobody exactly knows why!". Over
    the years while performing dual and multi-booting installations, I have noticed
    that Red Hat Linux''s fdisk and Disk Druid flags the most number of error messages
    whenever OpenBSD operating system is in the vicinity. OpenBSD fdisk handling of
    the partition table is different than FreeBSD and Linux and does not conform with
    the standards. This maybe one of the many possible explanations.


    For example, let me describe a real situation. This happened a couple of weeks
    back (at the time of writing this Guide). I installed OpenBSD 3.2 followed by
    FreeBSD 4.8 on a test PC. Then I tried installing Red Hat Linux 8.0 (Psyche edition)
    on to the remaining hard disk space on the computer. Readers must note: I do not
    have any faulty hardware on my system, I meet all hardware compatibility requirements,
    I wiped my disk clean before starting the installs using the UNIX dd utility,
    the memory (physical RAM) available on my system is absolutely 100% correct and
    the Red Hat Linux 8.0 installation CD-ROMs are okay. Yet, each time when I tried
    to install Red Hat onto my system (each time using different boot-time command
    line options), Linux''s fdisk started with several dialog boxes. The first said
    "Invalid partition on /tmp/hda". When I ignored the error, a new dialog displayed
    "Unable to align partition properly. This probably means that another partitioning
    tool generated an incorrect partition table, because it didn''t have the correct
    BIOS geometry. It is safe to ignore, but ignoring may cause (fixable) problems
    with some boot loaders". Fdisk then displayed the "too many partitions" error.
    Error, error and error was all that I got! So, I switched to Red Hat Disk Druid
    to fancy my luck!


    Red Hat''s Disk Druid displayed an "Invalid partition on /tmp/hda" message and
    when ignored, showed the OpenBSD partition as unused and /dev/hda as a BSD/386
    partition. I forced the "auto partitioning" process but it crashed miserably after
    some time with an "unhandled exception". I did not save the crash dump to a floppy
    because I had no plans to send a bug report.


    This happened with Red Hat Linux 8.0 (Psyche). I met with same problems with Red
    Hat Linux distributions 7.3 and 7.1. But when I tried installing Red Hat Linux
    7.0, it installed'
