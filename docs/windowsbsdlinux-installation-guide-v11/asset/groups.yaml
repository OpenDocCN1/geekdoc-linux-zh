    安装。我将 OpenBSD 引导管理器安装到 MBR 中。现在我的系统无法启动！发生了什么？我做错了什么？


    Ans6 and Ans7: 到处都没有出错。但你在最开始犯了一个小却致命的错误。务必记住，当你使用 UNIX dd 实用程序将零写入硬盘表面时，它也包括主引导记录（MBR）区域。具有地址（0,0,1）的
    MBR 区域：柱面地址 0，磁头地址 0 和扇区地址 1，也就是说，硬盘的前 512 字节，其中包含主分区表（MPT）和初始程序加载（IPL）代码。当此区域被零覆盖时，不同的操作系统会以不同的方式反应和行为。它们反应奇怪，因为它们期望标准的
    IPL 代码，但却发现没有。


    例如，Red Hat Linux fdisk 将零化的分区表报告为无效并可以重新创建空表；它安装的唯一 IPL 代码是 LILO 或 GRUB，而不是标准
    IPL 代码。OpenBSD 只是显示一个空的分区表，并且在这种硬盘上引导时会造成大量问题。据报道，唯一能从完全零化的磁盘无错误地完美引导的操作系统是 FreeBSD。但我个人确实遇到过一种情况（由于奇怪的原因）FreeBSD
    引导被锁定，根本无法引导。


    为防止所有这些发生，只需从带有 FDISK.EXE 的 Windows 9x 或 DOS v6 启动盘启动系统。一旦系统启动到 MS-DOS 提示符，输入以下内容：A:\>fdisk
    /mbr。它会将 MBR 重新初始化为正常状态并重写 MPT 并创建标准 IPL。继续按通常方式安装操作系统。


    ## Q8. 我在我的 PC 上安装了 Red Hat Linux，但在将 LILO 安装到主引导记录（MBR）时，我收到错误提示，安装程序无法将此信息写入
    MBR。发生了什么？


    Ans8: 你要么在 PC 上锁定了硬盘的 MBR，要么启用了病毒扫描软件阻止写入 MBR。你必须访问计算机系统的 BIOS 并验证 MBR 未被写保护。根据系统，你的
    MBR 中可能已经有另一个与 LILO 冲突的引导加载程序。尝试从 MS-DOS 命令提示符执行 “fdisk /mbr” 并安装 LILO。


    ## Q9. 我前几天在我的 PC 上安装 OpenBSD 3.2。在 OpenBSD fdisk 中创建分区后，当我保存更改并使用 “quit” 选项退出
    fdisk 时，它以亮白色在蓝色背景上标记了一些警告： “wd0: no disk label”。这是什么意思？我做错了什么？


    Ans9: 绝对没有。你什么也没做错。当你退出 OpenBSD fdisk（使用 “quit” 选项保存更改），并且 OpenBSD 分片不在与之前安装的
    OpenBSD 系统相同的偏移量时，fdisk 会显示 “wd0: no disk label” 消息。虽然它看起来像警告信息或明显错误，但实际上它是一个重要信息


    '
