    flagged by OpenBSD installation procedure which assures you that though the data
    and OpenBSD specific partitions have been created, yet the OpenBSD disklabel has
    to be setup. The disklabel defines the layout of the OpenBSD file systems on the
    OpenBSD partitions on the hard disk.


    In dual and multi-booting systems, this message is almost a prerequisite for a
    correct OpenBSD installation. If it so happens that after saving changes to OpenBSD
    fdisk, you were not flagged this message, then it means that OpenBSD disklabel
    is reading and using information from a previous install. This is a dangerous
    situation because if it so happens that the disklabel is using old disklabel data
    and any partition information has changed since its creation initially, then disklabel''s
    behavior becomes erratic and you may encounter strange problems. For preventing
    this from happening, make sure you wipe the disk clean before performing a clean
    install of OpenBSD.


