- pgno: 20
  md: 'Readers must note that I speak about "partitioning a hard disk" using Microsoft
    fdisk utility in general here in this section in order to provide the absolute
    newbies with general information on how to partition and format a new hard disk
    drive.


    # Section D: Installing MS Windows NT (4.0)


    # Section E: Installing MS Windows 2000 (Professional)


    # Section F: Installing MS Windows XP (Home/Professional)


    For installing any one of these 3 above-mentioned OSes, first use fdisk tool to
    partition your hard disk. Then comes to choosing the filesystem type.


    During a new installation of Windows NT, 2000 or XP, you may have to choose which
    file system your computer should use. On my other PC, I personally use Microsoft
    Windows XP Professional which supports:


    FAT32: An enhanced version of the file allocation table (FAT) system that is standard
    on all Windows operating systems starting with later (32-bit) versions of Windows
    95. The FAT32 system can be used on large hard disks, from 512 megabytes (MB)
    to 32 gigabytes (GB).


    NTFS: The NT file system (NTFS) is used with the Windows NT, Windows 2000, and
    Windows XP operating systems. NTFS provides enhanced reliability, stability, and
    security, and supports large hard disks of up to 2 terabytes (TB).


    But very "important" information: The conversion to NTFS is one-way only; if you
    convert your FAT or FAT32 file system to NTFS you cannot convert your hard disk
    back to FAT later.


    If you are not sure which file system to use, I would suggest using FAT32. If
    you want to change your file system, here are a few recommendations:


    +   1. Use FAT32 if your hard disk is smaller than 32 GB.

    +   2. Use FAT32 if you want to install more than one operating system on your
    computer.

    +   3. Use NTFS if your hard drive is larger than 32 GB and you are running only
    one operating system on your computer.

    +   4. Use NTFS if you want enhanced file security.

    +   5. Use NTFS if you need better disk compression.


    You can choose any filesystem type that you wish. After choosing the filesystem,
    proceed with the Windows NT/2000/XP installation normally. After installation,
    feel free to configure your new system. I personally chose the "FAT32" filesystem
