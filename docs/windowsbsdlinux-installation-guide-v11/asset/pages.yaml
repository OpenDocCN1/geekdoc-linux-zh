- pgno: 41
  md: 'the other hand, selecting "Windows" and pressing enter utilizes the "chain
    loading" mechanism, and invokes the "FreeBSD boot loader". The FreeBSD boot loader
    then loads Microsoft Windows 98 (SE) into the computer''s memory.


    10. That explains pretty much everything. After adding GRUB to your Master Boot
    Record (MBR), proceed with the installation as usual. The reader must note that
    he/she may install GRUB in one of two places, either the MBR or in the boot sector
