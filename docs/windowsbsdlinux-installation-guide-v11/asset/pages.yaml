  md: '# 3.2 Installing Microsoft Windows


    I have used a Microsoft Windows operating system as the "first" OS on my computer.
    I have MS Windows 98 (SE) installed on my computer. The reader can choose any
    one of the Microsoft OSes mentioned below in the listed form. Suppose, you would
    too like to use Microsoft Windows 98 (SE) as your first OS. Then read the information
    given in Section B: Installing MS Windows 98 (SE) and after reading and doing
    likewise as mentioned in that section, proceed forward with installing FreeBSD
    4.8-RELEASE or OpenBSD 3.2-RELEASE or NetBSD 1.6.1.


    Thus, we have the following sections:


    +   - Section A: Installing MS Windows 95

    +   - Section B: Installing MS Windows 98 (SE)

    +   - Section C: Installing MS Windows Millennium (ME)

    +   - Section D: Installing MS Windows NT (4.0)

    +   - Section E: Installing MS Windows 2000 (Professional)

    +   - Section F: Installing MS Windows XP (Home/Professional)


    One can use the Windows fdisk and format tools for partitioning a new unformatted
    hard disk. I have assumed that the reader has a new unformatted hard disk which
    he/she wishes to partition and then format for installing a Microsoft Windows
    OS. The material mentioned right below applies to Microsoft Windows 95, Microsoft
    Windows 98 (SE) and Microsoft Windows Millennium (ME). If you plan to install
    Windows NT, Windows 2000 or Windows XP, then skip this section and go to the part
    referring to the sections D, E and F.


    # Section A: Installing MS Windows 95


    # Section B: Installing MS Windows 98 (SE)


    # Section C: Installing MS Windows Millennium (ME)


    The material mentioned below applies to Microsoft Windows 95, Microsoft Windows
    98 (SE) and Microsoft Windows Millennium (ME). Thus, if you are installing any
    one of these, make sure you read through all the content mentioned herein which
    describes the Fdisk and Format tools and explains how to use them to partition
    or repartition a hard disk. The material describes the following topics:


    +   - How to Use the Fdisk and Format Tools

    +   - Important Considerations Before You Use the Fdisk and Format Tools

    +   - How to Partition and Format a Master Hard Disk


    Before you install your operating system, you must first create a primary partition
    on the hard disk (disk 1) on your computer, and then format a filesystem on that
    partition. The Fdisk tool is an MS-DOS-based tool that you can use to prepare
    (partition) a hard disk. You can use the Fdisk tool to create, change, delete,
    or display current partitions on the hard disk, and then'
