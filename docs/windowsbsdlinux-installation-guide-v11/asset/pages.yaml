    where, ad0s2a refers to the "first partition (a) on the second slice (s2) on the
    first IDE disk (ad0)". In the above example, /dev/ad0s1 is the slice containing
    FAT32 filesystem and /dev/ad0s2 is the second slice on the hard disk drive under
