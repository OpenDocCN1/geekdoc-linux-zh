    make a corresponding entry into it. Save and exit. Reboot to check whether the
    new Kernel is properly working or not. I am sure it would!


    Once the newly built custom Linux kernel is installed, you can start using it
    to mount UFS filesystems. Use this command: mount -t ufs /dev/hda2 /mnt/bsd; concerned
    /dev/hda2 is the FreeBSD slice and /mnt/bsd exists. Unmount using the command:
    umount /mnt/bsd simply.


    For mounting Windows 95/98/ME FAT32 filesystems on Linux, use the command: mount
    -t vfat /dev/hda1 /mnt/windows. The /mnt/windows directory must exist on the system.
    Unmount by executing: umount /mnt/windows simply. For readers who are using the
    NTFS filesystem, there''s bad news! They have to include the NTFS filesystem support
    in the configuration file and build a custom Linux kernel. Readers must note:
    NTFS writing support is DANGEROUS and limited.'
