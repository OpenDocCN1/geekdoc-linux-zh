    # Q12. While installing FreeBSD 4.X-RELEASE on my computer the FreeBSD fdisk (or
    disklabel) used an ''X'' partition name instead of a /dev/ad[0-3]s[1-4]n labeling
    scheme. Hey! what exactly happened? What does that ''X'' represent?


    Ans12: FreeBSD operating system software allows 7 partitions per slice (c: is
    reserved for the whole hard disk space). FreeBSD fdisk uses an ''X'' partition
    instead of a valid partition name such as "/dev/ad0s1a" if you have created too
    many of them on your PC. If you have a partition labeled as ''X'', you must delete
    it immediately without proceeding any further. If you do not delete this partition,
    FreeBSD disklabel will let you proceed with the entire installation, and then
    when you are finally done with the full installation, when your system comes up,
    you will encounter an error and would be dropped into single-user mode for maintenance.
    Thus, in other words, if you do not delete a partition which is labeled as ''X'',
    FreeBSD will not complete the boot sequence. Instead it displays error messages
    and drops into single user mode.


    Previous    Home    Next'
  merge: -1
  img_proc: true
