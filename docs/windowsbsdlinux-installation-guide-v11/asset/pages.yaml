  md: 'FreeBSD is easy. I log in as "root" and execute these following steps to build
    one:


    +   1. I execute this from the command line: `cd /usr/src/sys/i386/conf`. If there
    is not a `/usr/src/sys` directory on your system, then the kernel source has not
    been installed. The easiest way to do this is by running `/stand/sysinstall` as
    root, choosing Configure, then Distributions, then src, and then sys.

    +   2. I create a copy of the original Kernel configuration file provided there
    as a sample by executing: `cp GENERIC GHOSH`. Here, I have named the would-be
    kernel GHOSH. Feel free to name it otherwise.

    +   3. I open the GHOSH text file using ee or vi editor. Though the general format
    of the configuration file is quite simple, full explanation of all the possible
    kernel options is beyond the scope of this guide. Please refer to the FreeBSD
    Handbook for more details. Add the following line: `options EXT2FS` which provides
    support for identifying ext2fs Linux native filesystem. Tinker with the other
    options if you feel like or simply leave them alone.

    +   4. Save it and exit. When I am done, I type the following to compile and install
    the new kernel: `/usr/sbin/config GHOSH`.

    +   5. Then execute: `cd .././compile/GHOSH`

    +   6. Execute: "make depend", followed by "make" and finally finish-off by executing
    "make install".

    +   7. The new kernel will be copied to the root directory as /kernel and the
    old kernel will be moved to /kernel.old. Now, reboot your system to use the new
    kernel.


    Once this done, I try mounting a Linux partition using the command: `mount -t
    ext2fs /dev/ad0s3 /mnt/linux`; assuming /dev/ad0s3 is the FreeBSD slice representing
    a Linux filesystem and /mnt/linux directory exists. The filesystem should mount
    at the specified directory acting as the mount point.


    For mounting MSDOS partitions as well as Windows 95/98(SE)/ME formatted FAT16
    and/or FAT32 filesystems, I execute the following command: `mount -t msdos /dev/ad0s1
    /mnt/windows` where, /dev/ad0s1 is the FreeBSD slice that represents the Windows
    98(SE) partition on my computer and /mnt/windows directory exists. For unmounting,
    I execute: `umount /mnt/windows` simply. For mounting MSDOS-based floppies, I
    execute: `mount -t msdos /dev/fd0 /mnt/floppy`. And for unmounting, I execute:
    `umount /mnt/floppy` simply. For people who have NTFS filesystem, they can try
    mounting using the command: `mount -t ntfs /dev/fd0 /mnt/floppy` and unmount using:
    `umount -t ntfs /dev/fd0 /mnt/floppy`. Readers must note: There is limited writing
    support for NTFS filesystems.


    # 2. Mounting filesystems in Linux


    Mounting a FreeBSD filesystem i.e. UFS (Unix FileSystem) under Linux requires
