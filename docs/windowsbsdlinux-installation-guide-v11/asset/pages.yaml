  md: '# 3. Summary of Installation Steps


    The partitioning scheme and filesystems covered in FreeBSD, its time for us to
    move on to the actual FreeBSD installation. For a complete step-by-step coverage
    of FreeBSD installation, please consult the installation guide available on the
    FreeBSD Project web site. As in the previous Chapter, here also, I would be mentioning
    only the significant steps for the installation. Use these steps to install FreeBSD
    on your computer and configure it for "multiple-booting":


    +   1. Right now, we have a computer running Microsoft Windows OS. On my PC, it
    is Windows 98 (SE). I put a bootable FreeBSD 4.8-RELEASE CD-ROM in the CD-ROM
    drive and reboot the system.

    +   2. The computer boots, reads the CD-ROM, displays the usual hardware probing
    messages on the screen, and presents you with the Kernel configuration menu. Exit
    it using a ''Q'' and proceed to the FreeBSD System Installation and Configuration
    Utility. In FreeBSD it is called the /stand/sysinstall utility.

    +   3. Once the /stand/sysinstall screen appears, select a Novice, Custom or Express
    install. I choose the Custom installation because it provides the optimum flexibility.
    For novice users, I would suggest using the Recommended installation. Proceed
    as usual, till you reach the FreeBSD Fdisk editor.

    +   4. Here select the unused space and create 2 approximate equal partitions.
    Thus, 2 slices would be created (in addition to the one that already exists).
    One would be used for installing FreeBSD and the other for Red Hat Linux later.
    Readers with intermediate and/or expert FreeBSD knowledge should find this easy
    to do. After creating these 2 partitions, there should be no free space of your
    hard disk. Exit saving all the changes and proceed as usual to the FreeBSD Disk
    label editor. Readers must note: While creating the Linux slice, the filesystem
    ID should be 131. This creates a Linux native filesystem (ext2fs filesystem).
    Otherwise, the default FreeBSD UFS filesystem would be created.

    +   5. The next screen allows you to install a boot manager. Since Microsoft Windows
    98 (SE) overwrites the MBR rendering any other OS unbootable (so mean man!), you
    should choose to install the FreeBSD boot manager in the Master Boot Record (MBR)
    of your hard disk. I have installed FreeBSD alongside another operating system
    on the same hard disk, and I want FreeBSD to boot the other operating system when
    I start the computer. That is the reason, I installed the FreeBSD boot manager
    into the MBR. Once done, we enter the Sysinstall Disklabel Editor.

    +   6. The Sysinstall Disklabel Editor represents the already existing Windows
    FAT32 partition. Readers must note that FreeBSD names this partition as a FreeBSD
    slice but without an appropriate "mount point". Here, I would create the logical
    partitions for the FreeBSD slice (which is /dev/ad0s2).

    +   7. On my PC, the Windows FAT32 partition is named /dev/ad0s1 (C: in DOS).
    In other words, it is the first slice on the IDE hard disk of my computer. Disklabel
    can automatically create partitions for you and assign them default sizes if you
    press the key A. Depending on the size of the disk you are using the defaults
    may or may not be appropriate. For me, it works most of the time! To quote from
    the FreeBSD Handbook, "...Beginning with FreeBSD 4.5, the default partitioning
    assigns the /tmp directory its own partition instead of being part of the / partition.
    This helps avoid filling the / partition with temporary files...". This is an
    important consideration if you'
