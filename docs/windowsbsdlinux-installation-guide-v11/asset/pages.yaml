    +   1. I execute: `cd /usr/src/linux-2.4`. If the /usr/src/linux-2.4 directory
    does not exist on your system, then the kernel-source package has not been installed.
    For kernel compilation, you need to have kernel-source, make, dev86, gcc and a
    few dependencies installed.

    +   2. I make a backup (copy) of the original Makefile by executing: `cp Makefile
    Makefile.bak`. You can always refer to the original Makefile by accessing it as'
