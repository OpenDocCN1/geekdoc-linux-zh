- pgno: 35
  md: '# 3.6 Installing Red Hat Linux 7.3 (Valhalla)


    This Chapter focuses on installing Red Hat Linux 7.3 and configuring it for booting
    with the already existing operating systems on the computer. It focuses on a CD-ROM
    based installation, so it is ideal for users (both new and old) who want a quick
    and simple installation solution. If you are an experienced Linux user, just shoot
    ahead of this Chapter and install Red Hat Linux on your system. You may skip all
    the contents of this Chapter if you have enough practical experience. But in case
    you are a complete Linux newbie, or you just decided to taste Linux for fun, then
    you may want to gather more information on how to install Linux with another already
    existing OS on the computer. Red Hat offers excellent Installation tools while
    installing but while multi-booting your computer with 3 operating systems, it
    is always advisable to use the "Custom" installation which makes the story for
    the Linux newbies a little difficult. Using Linux fdisk or Disk Druid is easy
    and if you are using the Official boxed-set version from Red Hat, make sure you
    use the Official Red Hat Linux x86 Installation Guide enclosed with the package.
    Otherwise, you can always refer to the Distribution-specific Installation Manuals
    at the Official Red Hat web-site. Red Hat''s official web-site is located at http://www.redhat.com.
    Make sure you refer to the Red Hat Frequently Asked Questions for answers to questions
    and problems that may occur before, during or after the installation. You will
    find the FAQ online at: http://www.redhat.com/support/resources/faqs/rhl_general_faq/s1-contact.html.


    Red Hat Linux has some exciting and important installation features. Large improvements
    were made in the install process as version 6 arrived. Now in the latest versions
    7.3 (Valhalla) and 8.0 (Psyche), Red Hat Linux''s installation is very smooth
    with Anaconda doing most of the dirty jobs for you. Some of the important installation
    features include "Kudzu" and the "Kernel 2.4". The contents of this Chapter may
    be categorized in the following sections mentioned below:


    +   1. Disk drive and partition naming in Linux

    +   2. Filesystems in Linux

    +   3. Summary of Installation Steps


    # 1. Disk drive and partition naming in Linux


    Before shooting ahead with the installation of Red Hat Linux, let us take a brief
    tour of the disk drive and partition naming conventions in Linux. Worthwhile mentioning,
    I discussed in detail the drive and partition naming convention in FreeBSD earlier
    when I talked about installing FreeBSD.


    Linux uses a special way of naming hard drives and the partitions that you make
    within them. In UNIX (always remember, the Linux kernel is the reimplementation
    of UNIX only!) terminology, UNIX systems (and more specifically the Kernel) cannot
    read and understand "devices". To the UNIX kernel, everything is abstracted as
    a "file containing ASCII characters". That means a sentence like "I have a 30.0
    GB C: drive" in Linux does not make'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'any sense at all. So, let us see how our hard drives and partitions are named
    under Linux.


    +   - First IDE hard disk drive (Primary Master) – /dev/hda

    +   - Second IDE hard disk drive (Primary Slave) – /dev/hdb

    +   - Third IDE hard disk drive (Secondary Master) – /dev/hdc

    +   - Fourth IDE hard disk drive (Secondary Slave) – /dev/hdd


    where, /dev is the directory under the root ("/") directory in Linux which contains
    all the device files associated with devices.


    What about SCSI drives? Well, Linux labels that too!


    +   - First SCSI hard disk drive (Primary Master) – /dev/sda

    +   - Second SCSI hard disk drive (Primary Slave) – /dev/sdb

    +   - Third SCSI hard disk drive (Secondary Master) – /dev/sdc

    +   - Fourth SCSI hard disk drive (Secondary Slave) – /dev/sdd


    where, /dev is the directory under the root ("/") directory in Linux which contains
    all the device files associated with devices.


    Now, let us talk about the partitioning scheme under Linux. In Linux, we first
    consider a particular hard disk, whether an IDE or a SCSI hard disk. Then, we
    consider partitions on it. For example, the partitions on an IDE drive are named
    in the following way (/dev/hda is used as an example):


    +   - First primary partition – /dev/hda1

    +   - Second primary partition – /dev/hda2

    +   - Third primary partition – /dev/hda3

    +   - Fourth primary partition – /dev/hda4


    What about if we have an "extended partition" under Linux which contains a few
    logical disk drives in it? Well, the Linux kernel maps those partitions too to
    the corresponding "block" device files stored in the /dev directory. Let us consider
    that the /dev/hda in our above example, contains 1 primary partition and 1 extended
    partition, which in turn has 5 logical disk drives in it. So, in this case, how
    would the partition table look like and mean? Let us see how Linux labels this
    scheme. Linux would represent this as:


    +   - /dev/hda

    +     - /dev/hda1

    +     - /dev/hda2

    +       - /dev/hda5

    +       - /dev/hda6

    +       - /dev/hda7

    +       - /dev/hda8

    +       - /dev/hda9


    where, /dev/hda1 is the only primary partition and /dev/hda2 is the only extended
    partition on the hard disk under scrutiny. Note that Linux labels primary partitions
    from /dev/hda1 onwards to /dev/hda4, with logical disk drives extending from 5
    till 16. Thus, in the above example, hda5 to hda9 are the 5 logical disk drives
    existing on the extended partition. In fact recently on one of my friend''s computer,
    I partitioned the hard disk drive and installed Microsoft Windows Millennium (ME),
    Microsoft Windows XP Professional and Red Hat Linux 8.0 (Psyche). Linux fdisk
    when executed, shows exactly the same partition table as given above. He uses
    one IDE hard disk drive and has 1 primary partition labeled as C: drive under
    Windows which contains WinXP (FAT32 filesystem), with hda5 and hda6 labeled as'
  merge: -1
  img_proc: true
