    7. Proceed with the installation as usual, till you reach the screen prompting
    you to choose the boot loader. This is a very important step in this installation,
    in fact, the most important. A boot loader is literally the first software program
    that runs when you switch on your computer. The Master Boot Record (MBR) is a
    special area on your hard drive that is automatically loaded by your computer''s
    BIOS. It is the earliest point at which the boot loader (whether LILO or GRUB)
    can take control of the entire boot process. GRUB, when runs, reads instructions
    passed to it from its own configuration file (for example, the configuration file
    for the Linux Loader is the /etc/lilo.conf and for GRUB is the /boot/grub/grub.conf),
    passes significant instructions to the BIOS, and then loads the appropriate operating
    system boot files into the computer''s memory. This, in turn enables the correct
    filesystems to be mounted at the correct mount points, which in turn then prepares
    the computer for later use. Thus, the boot loader is vital for proper booting
    of the operating system.


    8. You can use any one of the 2 available boot loaders in Linux. Linux Loader
    (LILO) or the GNU Grand Unified Boot loader (GRUB). The reader is free to choose
    whichever he/she likes. I prefer using GNU GRUB for the reasons outlined in the
    FAQ. Readers must note that I am omitting the design, implementation and configuration
    details of GRUB in this guide as they exist beyond the scope of this guide. A
    lot of information is available out there on the Internet on these and other "free"
    as well as "proprietary" boot loaders. Check them out if it is required.


    GRUB is a very powerful x86-based boot loader which can be used to boot a number
    of operating systems. GRUB supports directly all GNU/Linux distributions, FreeBSD,
    NetBSD, OpenBSD, Sun Solaris and others. It supports booting other proprietary
    operating systems as well using the "chain loading" technology. Whether you have
    Microsoft Windows 95/98 (SE)/Millennium Edition/NT/2K/XP as the first initially
    installed OS on your computer and then FreeBSD 4.8-RELEASE or OpenBSD 3.2-RELEASE;
    simple lay back and relax because GRUB is there with all its power and dynamic
    functionality to take care of things. If you have Microsoft Windows 95/98 (SE)/Millennium
    Edition which do not have boot loaders by default (unlike Microsoft Windows NT/2K/XP),
    then "Add GRUB to the MBR".


    9. After startup, you will receive the GRUB screen prompting you to select the
    OS. If in case you have Microsoft Windows NT/2K/XP, which uses by default the
    "NT Boot loader" for booting the operating system software, then also go ahead
    and "Add GRUB to the MBR". Do not panic! It would cause no problems at all. Only
    in this case, after successful startup, you will receive the GRUB screen prompting
    you to select the OS. You will have 2 entries in the list, for example, I have
    "Windows" and "Linux". Selecting "Linux" and pressing enter loads the Red Hat
    Linux boot files to the computer''s memory and the computer bootstraps itself
    into Linux. Whereas, on'
