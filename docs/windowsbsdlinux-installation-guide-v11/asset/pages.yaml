    # 2. Filesystems in Linux


    After our brief discussion on the drive and partition labeling schemes in Linux,
    let us talk a bit about the Linux filesystem. Microsoft Windows OSes use either
    FAT16, FAT32, NTFS 4.0 or the most recently released NTFS 5.0 filesystems. The
    GNU/Linux Kernel originally used the "First Extended filesystem", commonly denoted
    as ext or extfs. It has now been superceded by ext2 and ext3 filesystems. Kernel
    2.4, currently uses Linux''s native "Third Extended filesystem", commonly denoted
    as "ext3" or "ext3fs". Though Kernels 2.2.x and 2.4.x support ext2fs and ext3fs,
    but the latest stable release i.e. Kernel 2.4.20 uses the "ext3fs" as the default
    filesystem. ext3fs is an extension to ext2fs functionality as is NTFS 5.0 to NTFS
    4.0 in Windows. The significant difference between the "ext2fs" and "ext3fs" filesystems
    is that ext3fs is a "Journaling filesystem" while ext2fs is not. We will discuss
    these filesystems in detail later when we compare them with the Unix Filesystem
    (UFS) which is the native filesystem under FreeBSD.


    The "Linux Programmer''s Manual" has a section called "FILESYSTEMS(5)". It explains
    which filesystem types Linux supports. One can access all the details by simple
    typing in "man fs" at the command prompt on a Linux workstation. It includes the
    following filesystems: minix, ext, ext2, ext3, xia, msdos, umsdos, vfat, proc,
    nfs, iso9660, hpfs, sysv, smb, ncpfs. When, as is customary, the filesystem is
    mounted on /proc, and you can find in the file /proc/filesystems which filesystems
    your kernel currently supports. If you need a currently unsupported one, either
    you can insert the corresponding module or just recompile the kernel to create
    a new one. Then, just install the new custom kernel to access the'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'filesystem of your choice. In order to use a filesystem, you have to mount
    it.


    Below is a short description of a few of the available filesystems. minix is the
    filesystem used in the Minix operating system, the first to run under Linux. It
    has a number of shortcomings: a 64MB partition size limit, short filenames, a
    single time stamp, etc. It remains useful for floppies and RAM disks. The ext
    is an elaborate extension of the minix filesystem. It has been completely superseded
    by the second version of the extended filesystem (ext2) and has been removed from
    the kernel (in 2.1.21). The ext2fs is the high performance disk filesystem used
    by Linux for fixed disks as well as removable media. The second extended filesystem
    was designed as an extension of the extended file system (ext). ext2 offers the
    best performance (in terms of speed and CPU usage) of the filesystems supported
    under Linux. The ext3 is a journaling version of the ext2 filesystem. It is easy
    to switch back and forth between ext2 and ext3. The xia was designed and implemented
    to be a stable, safe filesystem by extending the Minix filesystem code. It provides
    the basic most requested features without undue complexity. The xia filesystem
    is no longer actively developed or maintained. It was removed from the kernel
    in 2.1.21. msdos is the filesystem used by DOS, Windows and some OS/2 computers.
    msdos filenames can be no longer than 8 characters, followed by an optional period
    and 3 character extension. The umsdos is an extended DOS filesystem used by Linux.
    It adds capability for long filenames, UID/GID, POSIX permissions, and special
    files (devices, named pipes, etc.) under the DOS filesystem, without sacrificing
    compatibility with DOS.


    The vfat is an extended DOS filesystem used by Microsoft Windows 95 and Windows
    NT. VFAT adds the capability to use long filenames under the MSDOS filesystem.
    The proc filesystem is not a general filesystem. It is a "pseudo-filesystem" which
    is used as an interface to kernel data structures rather than reading and interpreting
    /dev/kmem. In particular, its files do not take disk space. The iso9660 is a CD-ROM
    filesystem type conforming to the ISO 9660 standard. Linux supports High Sierra,
    the precursor to the ISO 9660 standard for CD-ROM filesystems. It is automatically
    recognized within the iso9660 filesystem support under Linux. Linux also supports
    the System Use Sharing Protocol records specified by the Rock Ridge Interchange
    Protocol. They are used to further describe the files in the iso9660 filesystem
    to a UNIX host, and provide information such as long filenames, UID/GID, POSIX
    permissions, and devices. It is automatically recognized within the iso9660 filesystem
    support under Linux. The hpf is the High Performance Filesystem, used in OS/2.
    This filesystem is read-only under Linux due to the lack of available documentation.
    sysv is an implementation of the SystemV/Coherent filesystem for Linux. It implements
    all of Xenix FS, SystemV/386 FS, and Coherent FS. The nfs is the network filesystem
    used to access disks located on remote computers. smb is a network filesystem
    that supports the SMB protocol, used by Windows for Workgroups, Windows NT, and
    Lan Manager. To use smbfs, you need a special mount program, which can be found
    in the ksmbfs package. The ncps is a Network Filesystem that supports the NCP
    protocol, used by Novell NetWare.


    # 3. Summary of Installation Steps


    Now that we have covered quite a lot on partitioning schemes and filesystems under
    Linux, it is time to move on to the actual Linux installation. For a complete
    step-by-step coverage of Red Hat Linux installation, please consult the distribution-specific
    installation guides on Red Hat''s official web-site. They cover all types of installation
    with appropriate screenshots and tips and tricks for all the necessary steps of
    the Linux installation. Here, I would only mention the significant steps for the
    installation. Use these steps to install Red Hat Linux on your'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'computer:


    +   1. Place your Red Hat Linux 7.3 bootable CD-ROM on your CD-ROM drive and then
    restart the computer. I have assumed here that the reader has a Red Hat Linux
    7.3 distribution release CD. If you have older distributions, that is no problem
    at all. You can always use them. The basic installation steps are the same for
    all the distribution releases. Make sure that your computer is bootable from the
    CD-ROM in the BIOS setup. If you cannot boot from the CD-ROM drive, alternative
    boot methods are also available. Refer to the Red Hat Installation Guides for
    more information on making "local", "network" and "PCMCIA" boot disks.

    +   2. After a short delay, the Red Hat Linux 7.3 screen containing the boot:
    prompt should appear. The screen contains information on a variety of boot options.
    Either press "Enter" for entering a GUI-based installation setup or type in "linux
    text" at the boot: prompt for entering a ncurses-based text-based installation
    type. I always prefer text-based installations. Watch the boot messages to see
    whether the Linux kernel detects your hardware. If it does not properly detect
    your hardware, you may need to restart the installation in expert mode. Enter
    the "expert" mode using the following boot command: boot: linux expert and press
    enter.

    +   3. Proceed as usual, configuring language, keyboard and the mouse. Then appears
    the "Welcome to Red Hat Linux" screen. Proceed forward, till you reach the "Install"
    or "Upgrade" screen. Since we are installing Linux for the very first time, we
    select "Install". Now the question that arises here is: Which installation type
    to consider and why? Red Hat Linux 7.3 provides 4 options: Desktop, Workstation,
    Server and Custom. We do "not" consider the Desktop, Workstation and Server setups
    owing to obvious reasons. Because they do not provide the user with custom features
    and functionality. Thus, we proceed with the "Custom" installation.

    +   4. Proceed as usual and at the partitioning screen, you would be asked to
    choose between "fdisk" and "disk druid". For Linux experts, fdisk is the obvious
