  md: 'each allocated space on the hard disk (primary partition, extended partition,
    or logical drive) is assigned a drive letter. Disk 1 may contain one extended
    partition, and a second hard disk may contain a primary or extended partition.
    An extended partition may contain one or more logical MS-DOS drives.


    After you have used the Fdisk tool to partition the hard disk, you can use the
    Format tool to format those partitions with a filesystem. The filesystem File
    Allocation Table (FAT) allows the hard disk to accept, store and retrieve data.
    Windows 95, Windows 98 (SE), Windows Millennium (ME) and Windows 2000 support
    the FAT16 and FAT32 filesystems. When you run the Fdisk tool on a hard disk that
    is larger than 512 megabytes (MB), you are prompted to choose one of the following
    file systems: FAT16 or FAT32. The FAT16 filesystem has a maximum of 2 gigabytes
    (GB) for each allocated space or drive letter. For example, if you use the FAT16
    filesystem and have a 6-GB hard disk, you can have three drive letters (C, D,
    and E), each with 2 GB of allocated space. As for the FAT32 filesystem, it supports
    drives that are up to 2 terabytes in size and stores files on smaller sections
    of the hard disk than the FAT16 filesystem does. This results in more free space
    on the hard disk. Please note that the FAT32 filesystem does not support drives
    that are smaller than 512 MB. When you run the "fdisk" and "format" commands,
    the Master Boot Record (MBR) and file allocation tables are created. The MBR and
    file allocation tables store the necessary disk geometry that allows hard disk
    to accept, store, and retrieve data.


