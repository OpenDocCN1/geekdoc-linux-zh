    system calls that are made. Never run this command inside a sandbox in a virtual
    machine or on your dedicated machines for malware investigation described above.
    In addition to being cautious when running this command, there are a few things
    that should keep in mind. First, when you run the program, if command line parameters
    are required, it might fail, or least take a different execution path, that can
    make it hard to see what it does. It may require some libraries not installed
    in your test environment. If this is the case, you should be able to tell, because
    you will see system calls attempting to load the libraries. Partial output from
    running strace against xingi-bindshell is shown in Figure 10.19.


    ![](img/7abfab28a493757db3f096946a95ec01_377_0.png)


    Figure 10.19


    Partial output from running strace against xingi_bindshell in a sandbox virtual
    machine.


    From Figure 10.19 we can see that the C library (/lib/x86_64-linux-gnu/libc.so.6)
    opened-read and only the call returned a file handle of 3. The file was read and
    parts of it were mapped to memory so that some of the functions in the library
    can be used. Two file handles automatically exist for all programs, 1 and 2, for
    standard out (stdout) and standard error (stderr), respectively. The call to write(1,
    "\n", n) is the same as calling printf("n") from a C program (which is exactly
    what this file is). The output from strace, also shows that a pipe was created
    using popen. Open stands for pipe open. It is used to execute a command and then
    open a pipe to get the responses from the command. From the read command that
    follows a few lines later, it looks like the program is trying to determine the
    version of Python installed.


    Don''t think of strace as the perfect tool to help you understand how a program
    works. The best way to see what a program does is to trace it through with gdb.
