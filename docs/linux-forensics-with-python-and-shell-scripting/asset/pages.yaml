  md: '# FIGURE 9.29


    Out of sequence nodes for a recently added rootkit.


    After you inform Dr. Potslar passes this information along to the webmaster. The
    webmaster then has a look at this code with the help of a friend from the local
    Open Web Application Security Project (OWASP) chapter which he has recently joined.
    They discover a code execution vulnerability on this page.


    # SUMMARY OF FINDINGS AND NEXT STEPS


    You are now ready to write up your report for PAS. Your report should normally
    include an executive summary of less than a page, narrative that is free of unexplained
    jargon, and concrete recommendations and next steps (possibly with priority levels
    if it makes sense). Any raw tool outputs should be included in an appendix or
    appendices at the end of the report, if at all. It might make sense to burn all
    of this to a DVD, which includes tool outputs and your database systems.


    What would you do with the subject hard drive and your image? That depends on
    the situation. In this case there is very little chance of finding the attacker.
    Even if the attacker were found, he or she would quite possibly in a jurisdiction
    that would make prosecution difficult or impossible. If this is not the case,
    a lawsuit might be a bad business decision given the costs involved (both money
    and time). No customer information is stored on the PAS subject machine. The vast
    majority of the company''s sales occur at various conferences and trade shows.
    Customers wanting to buy products from the website are directed to call or e-mail
    the company. Given all of this, you might well return the hard drive to the company.
    The image can be retained for a reasonable time, with the cost of the backup drive
    containing the image and all other case-related files included on your bill to
    PAS.


    Summary of findings:


    +   - On the evening of May 3, an attacker exploited a vulnerability in the dns-lookup.php
    file on the webserver.

    - The attacker likely used the access gained to gather information about the system.
    The details of what he she did were not available because parameters sent to web
    are not recorded in the logs.

    - After repeated SSH login attempts using John''s account after the breach (many
    of which occurred in the same minute), the attacker successfully logged in John''s
    account. An online password cracker, such as Hydra, was likely used. The fact
    that attacker successfully so quickly that John has a weak password.

    - The attacker installed at least three rootkits or backdoors on the system.

    - There is evidence to suggest that the attacker attempted to crack other passwords.
    Michael''s account was found on one occasion which suggests his password had been
    cracked. A command to crack Sue''s password was found in history files. It is
    unknown if the attack against her was successful as her account has never been
    used to log in this machine.

    - The attacker seems to have primarily worked via SSH log with John''s account,
    which has administrative privileges.

    - The attacker created a bogus account with a username of mysql. This account
    had administrative privileges. On one occasion the attacker logged in remotely
    as Michael and then switched to the mysql account.'
