    | Offset | Length | Item |

    |---|---|--|

    | 0 (0x00) | 16 (0x10) | Partition type GUID |

    | 16 (0x10) | 16 (0x10) | Unique partition GUID |

    | 32 (0x20) | 8 (0x08) | First LBA |

