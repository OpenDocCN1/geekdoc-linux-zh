    features.


    The Sleuth Kit (TSK) by Brian Carrier is a set of tools for filesystem analysis.
    One of these tools, `fsstat`, allows you to collect filesystem (fs) statistics
    (stat). By way of warning, this tool appears to be somewhat out of date and may
    not display all the features of your latest version ext4 filesystem correctly.
    Don''t worry, we will develop some up-to-date scripts in this chapter that will
    properly handle the latest versions of ext4 as of this writing (plus you will
    have Python code that you could update yourself)


    In order to running `fsstat` you must first know the offset to the filesystem
    inside your image file. Recall that we learned in Chapter 5 that `fdisk` tool
    could be used to determine this offset. The syntax for this command is simply
    `fdisk <image file>`. As we can see in Figure 7.2, the filesystem in the PFE image
    begins at sector 2048.


    ![](img/7abfab28a493757db3f096946a95ec01_189_0.png)


    Figure 7.2 fdisk to determine the offset to the start of a filesystem.


    Once the offset is determined, the command to display filesystem statistics is
    just `fsstat -o <offset> <image file>`, i.e., `fsstat -o 2048 pfel.img`. Partial
    results from running this command against our PFE subject image are shown in Figure
    7.3 and Figure 7.4. The results in Figure 7.3 reveal that we have a properly unmounted
    ext4 filesystem that was mounted at / 1,048,577 nodes and 4,194,048 KiB blocks.
    Compatible, incompatible, and read-only compatible features are also shown in
    the screenshot. From Figure 7.4 we can see there are 128 block groups with 8,192
    nodes and 32,768 blocks per group. We also see statistics for the first two groups.'
