    As shown in Figure 10.9, all ELF files have a header. When the file is being executed,
    the Program Header Table (PHT) that follows the header is read. The PHT describes
    various segments (large chunks) in the file. In the linking view the PHT is ignored
    and the Section Header Table (SHT) at the end of the file is read. The SHT describes
    various sections (which are subparts of segments) in the file.


