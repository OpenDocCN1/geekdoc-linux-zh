    # VOLATILITY


    The Volatility framework is an open source tool written in Python which allows
    you to analyze memory images. We briefly mentioned Volatility way back in Chapter
    3 on live response. The first version of Volatility that supported Linux was released
    in October 2012. Hopefully Linux support in Volatility will continue to evolve.


    We will only cover parts of Volatility that apply to Linux systems. We will not
    delve deeply into the theory behind how Volatility works either. Our focus is
    on the tool. If you are running a Debian-based Linux, Volatility might be available
    in standard repositories, in which case it can be installed using sudo apt-get
    install volatility-profiles volatility-tools. If you need to install from source,
    download the latest version source archive from http://volatilityfoundation.org,
    uncompress it, then install it by typing sudo ./setup.py install from the main
    Volatility directory.


    # CREATING A VOLATILITY PROFILE


    Volatility makes use of internal operating system structures. The structures can
    change from one version of operating to the next. Volatility ships with a set
    of profiles from common versions of Windows. The same is not true for Linux, however.
    Before rushing to judge, stop to think about how many different kernel versions
    and variants of Linux exist in the world.


    The solution for Linux systems is to create your profile by compiling a specific
    program; creating a dwarf file; getting a system map file; and zipping everything
    together. If this sounds complicated and cumbersome, it is. Never fear, as I will
    show you how to create the profile from your mounted subject image using a shell
    script.'
