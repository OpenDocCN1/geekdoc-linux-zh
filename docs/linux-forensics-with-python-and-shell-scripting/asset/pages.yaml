    # GETTING NETWORKING INFORMATION


    Many types of malware will attempt to exfiltrate data and/or use some form of
    interprocess communication (IPC). These activities usually involve some sort of
    networking. Volatility allows you to get various types of networking information,
    in order to help you locate malware.


    The Linux ifconfig command is used to list network interfaces along their MAC
    and IP addresses, etc. The Volatility linux ifconfig command will provide a list
    of network interfaces with IP address, MAC address, and whether or not promiscuous
    mode is enabled. As a reminder, packets received on an interface that are for
    a different interface are normally dropped. An interface in promiscuous mode may
    be used for packet sniffing as no packets are dropped. The results of running
    this command against the PFE subject system are shown in Figure 8.19. Nothing
    unusual is seen here.'
