    are on the normal SSH port 22.


    Partial results from running the query select * from logins order by start; are
    shown in Figure 9.24. The highlighted entries are around the time of the breach.
    A complete analysis of this information reveals that only John and Michael have
    been logging on to the system. This indicates that either John''s password has
    been compromised or that the attacker is not logging in directly. The other evidence
    gathered far points to the latter.'
