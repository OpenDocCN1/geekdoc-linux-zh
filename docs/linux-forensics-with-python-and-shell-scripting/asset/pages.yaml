    # Directory entries


    We have learned that inodes contain all the metadata for a file. They also contain
    the location of the file''s data blocks. The only thing that remains to be known
    about a file is its name. This connection between an inode and a filename is made
    in directories. Not surprisingly, directories are stored in files in Linux, the
    operating system where everything is a file. In our discussion of inodes earlier
    in this chapter we said that inode 2 was used to store the root directory.


    The classic directory entry consists of a 4-byte inode number, followed by a 2-byte
    record length, then a 2-byte name length, and finally the name which may be up
    to 255 characters long. This is shown in Table 7.15. Notice that the name length
    is two bytes, yet the maximum name length can be stored in only one byte. This
    may have been done for byte alignment purposes originally.'
  merge: -1
  pgno: 281
- img_proc: true
  md: '# Table 7.15. The classic directory entry structure.


    | Offset | Size | Name | Description |

    |---|---|---||}{

    | 0x0 | 4 | Inode | Inode |

    | 0x4 | 2 | Rec len | Record length |

    | 0x6 | 2 | Name len | Name length |

    | 0x8 | | | Name string (up to 255 characters) |


    Realizing that the upper byte was unused, an (incompatible) filesystem feature,
    File Type, was created to re-purpose this byte to hold type information. It should
    be fairly obvious why this is on the incompatible feature list, as interpreting
    this as part of the name length would make it seem like all filenames became garbage.
    This optimization speeds up any operations that only make sense for a certain
    type of file by eliminating the need to read lots of inodes to determine file
    type. The directory entry structure for systems with the File Type feature is
    shown in Table 7.16.


    # Table 7.16. Directory entry structure when File Type feature is enabled.


    | Offset | Size | | Description |

    |---|---|---||}{

    | 0x0 | 4 | Inode | Inode |

    | 0x4 | 2 | Rec len | Record length |

    | 0x6 | 1 | Name len | Name length |

    | 0x7 | 1 | File type | 0x00 Unknown 0x01 Regular 0x02 Directory 0x03 Char device
    0x04 Block device 0x05 FIFO 0x06 Socket 0x07 Sym link |

    | 0x8 | | Name | Name string (up to 255 characters) |


    The original directories had no checksums or tools for integrity checking. In
    order to add this functionality without breaking existing systems, a special type
    of directory entry known as a directory tail was developed. The directory tail
    has an inode value of zero which is invalid. Older systems see this and assume
    that the end of the directory (tail) has been reached. The record length is correctly
    set to 12. The directory tail structure is shown in Table 7.17.'
  merge: -1
  pgno: 282
- img_proc: true
  md: '# Table 7.17. Directory tail structure.


    | Offset | Size | Name | Description |

    |---|---|---|---|

    | 0x0 | 4 | Inode | Set to zero (inode zero invalid so it is ignored) |

    | 0x4 | 2 | Rec len | Record length (set to 12) |

    | 0x6 | 1 | Name len | Name length (set to zero so it is ignored) |

    | 0x7 | | File type | Set to 0xDE |

    | 0x8 | 4 | Checksum | Directory leaf block CRC32 checksum |


    The linear directories presented thus far in this section are fine as long as
    the directories do not grow too large. When directories become large, implementing
    hash directories improve performance. Just as is done with the checksum, hash
    entries are stored after the end of the directory block in order to fool old systems
    into ignoring them. Recall that there is an ext4_index flag in the inode that
    will alert compatible systems to the presence of the hash entries.


    The directory nodes are stored in a hashed balanced tree which is often shortened
    to htree. We have seen trees in our discussion of extents earlier in this chapter.
    Those familiar with NTFS know that directories on NTFS filesystems are stored
    in trees. In the NTFS case, nodes are named based on their filename. With htrees
    on extended filesystems nodes are named by their hash values. Because the hash
    value is only four bytes long, collisions will occur. For this reason, once a
    record has been located based on the hash string comparison of filenames is performed,
    and if the strings do not match, the next record (which should have the same hash)
    is checked until a match is found.


    The root hash directory block starts with the traditional “.” and “...” directory
    entries for this directory and the parent directory, respectively. After these
    two entries (both of twelve bytes long), there is a 16-byte header, followed by
    8-byte entries through the end of the block. The root hash directory block structure
    is shown in Table 7.18.'
