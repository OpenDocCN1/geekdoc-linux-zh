    :\n    main()\n```\n\n# JOURNALING\n\nAs previously mentioned, the journal is\
    \ used to increase the likelihood of the filesystem being in a consistent state.\
    \ With most things Linux, journaling behavior is highly configurable. The default\
    \ is to only write metadata (not data blocks) through the journal. This is done\
    \ for performance reasons. The default can be changed by the mount data option.\
    \ The option=journal causes all data blocks to be written through the journal.\
    \ There are other options as well. See the mount page for details.\n\nThe journal\
    \ causes data to be written twice. The first time data is written to the disk\
    \ as quickly as possible. To accomplish this, the journal is stored in one block\
    \ group and often is the only one stored in the group. This minimizes disk seek\
    \ times. Later, after the data has been committed to the journal, the operating\
    \ system will write the data to the correct location on the disk and then erase\
    \ the commit record. This not only improves data integrity but also improves performance\
    \ by caching many small writes before writing to disk.\n\nThe journal is normally\
    \ stored in inode 8, but it may optionally be stored on an external device. The\
    \ latter does to be very common. Regardless of where it is, the journal contains\
    \ a special superblock that describes itself. When examining the journal directly\
    \ it is important to realize that the journal stores information in big endian\
    \ format. The journal superblock is summarized in Table 7.25.\n\nTable 7.25. The\
    \ journal superblock."
