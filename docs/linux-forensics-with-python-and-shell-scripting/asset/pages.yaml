    and also told you this location was 0xBC from the start of the main function.
    There are other kinds of jumps available, for different conditions or no condition
    at all, and for longer distances.


    Other than the return instruction, ret, there is only one remaining instruction
    found in the main function that has not yet been discussed. This instruction is
    not in the snippet from Figure 10.15. This instruction is lea, which stands for
