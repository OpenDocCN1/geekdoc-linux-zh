    # MISCELLANEOUS VOLATILITY COMMANDS


    As we said at the beginning of this chapter, we have not covered every one of
    the Volatility commands for Linux systems. There are a couple of reasons for this.
    First, the available commands are not equally useful. Some might only be occasionally
    helpful. Second, I have found that later kernels are not well-supported by Volatility.
    Some of the commands will fail spectacularly, while others will produce an unsupported
    error message and exit gracefully. For completeness, I have listed additional
    Linux commands in Table 8.1.


    Table 8.1 Additional Volatility commands discussed in this chapter.


    | Command | Description | Notes |

    |---|---|---|n| linux_banner | Prints Linux banner information | Similar to uname
    -a command |

    | linux_check_evt_arm | Check Exception Vector Table | ARM architecture only |'
