    # Incompatible features


    Incompatible features are those that could lead to data corruption or misinterpretation
    when a filesystem is mounted by a system that doesn''t support them, even when
    mounted read-only. Not surprisingly, the list of incompatible features is longer
    than the compatible features list. It should without saying that if you should
    not mount a filesystem, it would be a very bad idea to run fsck against it. Incompatible
    features are summarized in Table 7.3.'
