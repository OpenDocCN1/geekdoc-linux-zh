- img_proc: true
  md: '# Table 7.18. Root hash directory block structure.


    | Offset | Size | Name | Description |

    |---|---|---||}{

    | 0x0 | 12 | ":" directory entry (12 bytes) | |

    | 0xC | 12 | Dot rec | ":" directory entry (12 bytes) |

    | 0x18 | 4 | Inode no | number set to 0 to make following ignored |

    | 0x1C | 1 | Hash version | 0x00 Legacy 0x03 Legacy unsigned 0x01 Half Half MD4
    0x04 Unsigned half MD4 0x02 Tea 0x05 Unsigned Tea |

    | 0x1D | 1 | Info length | Hash info (0x8) |

    | 0x1E | 1 | Indir levels | Depth of tree |

    | 0x1F | 1 | Unused flag | Flags (unused) |

    | 0x20 | 2 | Limit | Max number of entries follow this header |

    | 0x22 | 2 | Count | Actual number of entries after header |

    | 0x24 | 4 | Block | Block w/i directory for hash=0 |

    | 0x28 | | Entries | Remainder of block is 8-byte entries |


    If there are any interior nodes, they have the structure shown in Table 7.19.
    Note that three of the fields are in italics. The reason for this is that I have
    found some code that refers to these fields and other places that seem to imply
    that these fields are not present.'
