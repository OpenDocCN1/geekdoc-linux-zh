  md: '# Introduction


    Information in This Chapter:


    +   * What this book is about

    * Intended audience

    * How this book is organized


    # What this book is about


    This book is about performing forensic investigations on subject systems running
    the Linux operating system. In many Linux forensics is something that is done
    as part of incident response. That will be the focus of this book. That said,
    much of what you need to know in order to perform Linux incident response can
    also be applied to any Linux forensic investigation.


    Along the way we will learn how to use Linux and the many tools it provides. In
    addition to covering the essentials of forensics, we will explore how to use Python,
    shell scripting, and standard Linux system tools to more quickly and easily perform
    forensic investigations. Much of what is covered in this book can also be leveraged
    by anyone wishing to perform forensic investigations of Windows subjects on a
    Linux-based workstation.


    # Intended audience


    This book is primarily intended to be read by forensics practitioners and other
    information security professionals. It describes in detail how to investigate
    computers running Linux. Forensic investigators who work primarily with Windows
    subjects who would like to learn more about Linux should find this book useful.
    This book should prove useful to Linux users and system administrators who are
    interested in the mechanics of Linux system breaches and ensuing investigations.
    The information contained within this book should allow a person to investigate
    the majority of attacks to Linux systems.


    The only knowledge of a reader of this book is assumed to have is that of a normal
    Linux user. You need not be a Linux system administrator, hacker, or power user
    to learn from this book. Knowledge of Linux system administration, Python, shell
    scripting, and Assembly will be helpful, but definitely not required. Sufficient
    information will be provided for those new to these topics.


    # How this book is organized


    This book begins with a brief introduction to forensics. From there we will delve
    into answering the question, "Was an incident?" In order to answer this question,
    various live analysis tools and techniques will be presented. We then discuss
    the creation and analysis of forensic filesystem and memory images. Advanced attacks
    on Linux systems and malware round out our discussion.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Chapter 1: First Steps


    Chapter 1 is an introduction to the field of forensics. It covers the various
    types of forensics and motivation for performing forensics on Linux systems. Phases
    of investigations and the high-level process are also discussed. Step-by-step
    instructions for building a Linux forensics toolkit are provided in this chapter.


    # Chapter 2: Was there an incident?


    Chapter 2 walks through what happens from the point where a client suspects something
    has happened until you can be reasonably sure there was or not an incident. It
    covers opening a case, talking to users, creating appropriate documentation, mounting
    known-good binaries, minimizing disturbance to the subject system, using scripting
    to automate the process, and collecting volatile data. A nice introduction to
    shell is also provided in this chapter.


    # Chapter 3: Live Analysis


    Chapter 3 describes what to do before shutting down the system. It covers capturing
    metadata, building timelines, collecting user command histories, performing log
    file analysis, hashing, dumping memory, and automating with scripting. A number
    of new shell scripting techniques and Linux tools are also presented in this chapter.


    # Chapter 4: Creating Images


    Chapter 4 starts with a discussion of the options for shutting down a subject
    system. From there the discussion turns to tools and techniques used to create
    a forensic image of a filesystem. image formats, dd and dclddd, hardware and software
    write blocking, and live Linux distributions. Methods of creating images for different
    circumstances are discussed in detail.


    # Chapter 5: Mounting Images


    Chapter 5 begins with a discussion of the various types of partitioning systems:
    Master Boot Record (MBR) based partitions, extended partitions, and GUID partition
    tables. Linux commands and techniques used to mount all types of partitions are
    presented. The chapter ends with an introduction to Python and how it can be used
    to automate the process of mounting partitions.


    # Chapter 6: Analyzing Mounted Images


    Chapter 6 describes how to analyze mounted filesystem images. It covers file metadata,
    command histories, system logs, and other common information investigated during
    dead analysis. Use of spreadsheets and MySQL to enhance investigations is discussed.
    Some new shell scripting techniques are also presented.


    # Chapter 7: Extended Filesystems'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'Chapter 7 is the largest chapter in this book. All aspects of Linux extended
    filesystems (ext2, ext3, and ext4) are discussed in detail. An extensive set of
    Python and shell scripts are presented in this chapter. Advanced techniques for
    detecting alterations of metadata by an attacker are provided in this chapter.


    # Chapter 8: Memory Analysis


    Chapter 8 introduces the new field of memory analysis. The Volatility memory analysis
    framework is discussed in detail. Topics covered include creating Volatility profiles,
    getting process information, process maps and dumps, getting bash histories, using
    Volatility check plugins, retrieving network information, and obtaining in-memory
    filesystem information.


    # Chapter 9: Dealing with More Advanced Attackers


    Chapter 9 walks you through a more sophisticated attack in detail. The techniques
    described up to this point in the book are applied to a new scenario. Reporting
    of findings to the client is also discussed.


    # Chapter 10: Malware


    Chapter 10 provides an introduction to Linux malware analysis. It covers standard
    tools for investigating unknown files such as the file utility, hash databases,
    the strings utility, mm, ldd, readelf, objdump, trace, ltrace, and gdb. Obfuscation
    techniques are discussed. Safety issues are presented. An introduction to Assembly
    is also provided.


    # Chapter 11: The Road Ahead


    In this final chapter several suggestions for further study are provided. General
    tips are also given for a successful career involving forensics.


    # Conclusion


    Countless hours have spent developing this book and accompanying scripts. It has
    been a labor of love, however. I hope you enjoy reading and actually applying
    what is in this book as much as I have enjoyed writing it.


    For updates to this book and also my latest happenings consult my website http://philpolstra.com.
    You can also contact me via my Twitter account, @ppolstra. Downloads related to
    the book and other forms of community support are available at Pentester Academy
    http://pentesteracademy.com.'
  merge: -1
