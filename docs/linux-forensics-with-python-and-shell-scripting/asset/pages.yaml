    Let''s walk through this script. It begins with she-bang, usage, and command line
    parameter count is saved on the line oldir=$(pwd), before changing the subject''s
    /boot directory. The next part of the script attempts to fix the correct kernel
    version on the name of the System.map file. This is complicated by the fact that
    there may be more than one kernel installed.


    For the purposes of this script, we will assume the subject is running the latest
    kernel version installed. This is another reason you should run -a on the subject
    system before shutting down. What makes the line determining the kernel version
    so complicated is the possibility of having more than one System.map file. Let''s
    break down the ver=...


    The first command is ls System.map* which causes all of the System.map files to
    be one output line. The next command, sed "s/System.map-// for nothing easily
    strips off the prefix and leaves us a list of kernel versions, one per line. The
    third command, tr "\n" "|", translates characters to vertical pipes which puts
    all on the same line. The fourth command contains a long regular expression and
    a substitution command.


    Once the version has been identified, the script changes back to the original
    directory with the line that reads cd "$(oldir)". The environment variables have
    been enclosed in curly brackets as this to be safer than using base variables,
    i.${old}, as these are sometimes misinterpreted. The current working directory
    and full path to the make command are saved in the PWD and MAKE environment variables,
    respectively.


    The line cat <<EOF Makefile.${ver} is slightly different from our previous use
    of cat <<EOF. Here we directed the output of cat to a file instead of the terminal
    or another program. The lines that follow, "EOF", are used to create a Makefile.
    for those not familiar with Makefile, they are used to more efficiently build
    software by only rebuilding what is necessary. The general format for a myfile
    is one'
