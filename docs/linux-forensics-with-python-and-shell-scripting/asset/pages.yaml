    Malicious files stored in a hidden directory.


    While Volatility could be used to retrieve some files from the file cache, it
    is likely easier to just use the filesystem image for this purpose. If there is
    a need to retrieve information from the memory image, the memory image is not
    going anywhere. We might return to using Volatility when performing malware analysis.


    # FILESYSTEM ANALYSIS


    At this point, we know there are at least two pieces of malware that were likely
    installed around May 4, based on the hashes. We also know that a new user with
    administrative privileges was created and the attacker has attempted to crack
    additional passwords on the system. What we do not know yet is the initial breach
    occurred and now.


    Using our Python scripts from Chapter 5, the disk image is easily mounted on the
    forensics workstation. Once this is accomplished, running `grep 1001` on the passwd
    file reveals that user ID 1001, which was used to launch one of the root shells,
    belongs to the michael user, whose real name is Michael Keaton.


    Because the system was running a webserver, and the Weebly PHP backdoor was installed,
    it makes sense to have a look at the webserver logs for some possible insight
    into how the breach occurred. We do not know at this point if the breach was caused
    by a problem with the website, but it is certainly worth checking out.


    The Apache webserver logs can be found in /var/log/apache2. The two primary log
    files are access.log and error.log which store requests and errors, respectively.
    Both of these logs have the standard numbered archives. After examining the access
    logs, it is discovered that a rarely used, obscure page, called dns-lookup.php,
    is called 51 times late on May 3. A look at the error logs reveals 19 errors logged
    about the same time. Some of these results are shown in Figure 9.18.'
