  md: '# # THIS IS TAKING TOO LONG


    # ## Running live Linux in a virtual machine


    If you decide to create a bootable SIFT (or similar) USB drive you will quickly
    find that it takes hours to install the packages from SIFT. This can tie up your
    computer for hours preventing you from getting any real work done. There is a
    way to build the USB drive without tying up the machine, however. What you need
    to do is a virtual machine that can be run from a live Linux distribution on a
    USB drive. The following instructions assume you are running VirtualBox on a Linux
    host system.


    VirtualBox ships with several tools. One of these is vboxmanager. There are several
    commands vboxmanage supports. Typing vboxmanage -help in a terminal will give
    you a list of commands. This will not list the command that we need, as it is
    one of the internal commands.


    In order to create a virtual disk that points to a physical device you must execute
    the following command `vboxmanage internalcommands creatawmdk -filename <location>
    of vmdisk <USB device>`. For example, if your thumb drive is normally mounted
    as /dev/sdb the following command could be: vboxmanage internalcommands creatawmdk
    -filename /root/VirtualBox\Vns/usb.vmdk -rawdisk /dev/sdb. Note that you cannot
    just sudo this command as the regular user will have permission problems trying
    to run the virtual machine later. Creating this virtual drive and running VirtualBox
    is shown in Figure 1.3.


    Once the virtual disk has been created, set up a new virtual machine in the normal
    manner. Depending on the live Linux you have chosen, you may need to enable EFI
    support as shown in Figure 1.7. The creation of the live Linux virtual machine
    is shown in Figure 1.4 through Figure 1.6. The virtual machine running for the
    first time is shown in Figure 1.8.'
