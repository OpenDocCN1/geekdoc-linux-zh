    exploit possible vulnerabilities in the virtualization software to attack the
    host machine.


    If you need an image for your virtual machine, you could use a fresh install of
    your favorite Linux distribution. If think you will be investigating unknown binaries
    after, you might consider backing up the virtual disk file after you have installed
    all of your tools and before transferring any unknown files to the virtual machine.
    Remember that most virtualization software will install a NAT network interface
    out to the Internet which you should disable! If you really want to duplicate
    the subject system, you can create a virtual machine from the subject disk image.
    This assumes that you have sufficient disk space, RAM, etc. The command to convert
    the raw image to a virtual hard disk, if you are using VirtualBox, is vboxmanage
    internalcommands convert2hdr srcformat raw -dstformat vhd <raw image> <destination
    vhd file>. The PAS subject system running in a virtual machine (without networking!)
    is shown in Figure 10.18.


