- img_proc: true
  md: 'The first feature in Table 7.2 Directory Preallocation. When this feature is
    enabled the operating system should allocate some space whenever a directory is
    created. This is done to prevent fragmentation of the directory which enhances
    performance. While this can be useful, it is easy to see why it is okay to maintain
    the filesystem even if the operating system does not support this optimization.


    Bit 2 (value of 0x04) is set if the filesystem has a journal. This should always
    set for ext3 and ext4 filesystems. This is a compatible feature because it is
    (somewhat) safe to read and write a filesystem if you are not writing through
    a journal to do so.


    Bit 4 (value of 0x08) is set if the longterm supports extended attributes. The
    first use of extended attributes was Access Control Lists (ACL). Other types of
    extended attributes, including user-specified, are also supported. We will learn
    more about extended attributes later in this chapter.


    When the Resize Node feature is used, each block containing group descriptors
    will have extra space for future expansion of the filesystem. Normally a filesystem
    can grow 1024 times its current size, so this feature can result in quite a bit
    of empty space in the group descriptor table. As we will see later in this chapter,
    enabling certain features eliminates the storage of group descriptors in every
    block.


    Directories are normally stored in a flat format (simple list of entries) in extended
    filesystems. This is when directories are small, but can lead to sluggish performance
    with larger directories. When the Directory Index feature is enabled some or all
    directories may be indexed to speed up searches.


    Normally when an extended filesystem is created, all of the block groups are initialized
    (to zeros). When the Lazy Block Group feature is enabled, a filesystem can be
    created without properly initializing the metadata in the block groups. This feature
    is uncommon, as are theclude Node and Exclude Bitmap features.


    In a generic extended filesystem the superblock is backed up in every single block
    group. There are a number of features that can be used to change this behavior.
    Modern media are considerably more reliable than their predecessors. As a result,
    it makes little sense to waste disk space with hundreds of superblock backups.
    When the Sparse 2 feature is enabled the only superblock backups are in two block
    groups listed in an array in the superblock.


    Now that we have learned about all the compatible features, we might ask which
    features affect the layout of our data. The two features in this category that
    affect the filesystem layout are Resize Node and Sparse 2 which add space in group
    descriptor tables and can cache superblock backups to be removed from all but
    two block groups, respectively.


    How can you get features and other information from a Linux extended filesystem?
    Not surprisingly there are a number of tools available. The first tool is the
    stat (statistics) command which is normally used on files, but may also be used
    on filesystems. The syntax for running this command on a normal file is stat <filename>,
    i.e., stat *.mp3. The results of running stat on some MP3 files is'
