    # SUPERBLOCKS


    Now that we have a high level view of the extended filesystem, we will drill down
    into'
  merge: -1
  pgno: 190
- img_proc: true
  md: 'each of its major components, starting with the superblock. The superblock
    is 1024 bytes long 1024 bytes (2 sectors) into the partition right after the boot
    block. By default the superblock is repeated in the first block of each block
    group, but this can be changed by enabling various filesystem features.


    Some readers may be familiar with the BIOS parameter blocks and extended BIOS
    parameter blocks in FAT and NTFS boot sectors. On Windows the systems in those
    blocks contain all the information operating system requires to read files from
    the disk. The superblock performs a similar function for Linux systems. Information
    contained in the superblock includes


    +   * Block size

    * Total blocks

    * Number of blocks per block group

    * Reserved blocks before the first block group

    * Total number of inodes

    * Number of inodes per block group

    * The volume name

    * Last write time for the volume

    * Path where the filesystem was mounted

    * Filesystem status (whether or not cleanly unmounted)


    When examining a filesystem it can be convenient to use a hex editor that is made
    specifically for this purpose. One such editor is Active@ Disk Editor by Lsoft.
    It is freely available and there is a version for Linux (as well as one for Windows).
    The Active@ Disk Editor (ADE) may be downloaded from http://disk-editor.org. ADE
    has several nice features, including templates for interpreting common filesystem
    structures such as superblocks and inodes. The subject system''s superblock is
    shown in ADE in Figure 7.5. We will cover the fields in Figure 7.5 in detail later
    in this chapter during our discussion of various filesystem features. For the
    moment, I feel point out that the block size (offset 18 in the superblock) is
    stored as x, where the block size in bytes = 2^(10 * x) = 1024 * 2. For example,
    the stored block size of 2 equates to a 4 KB (4096 byte) block. Table 7.1 summarizes
    all of the fields that may be present in a superblock as this of writing. The
    material in Table 7.1 primarily comes from the header file /usr/src/<linux version>/fs/ext4/ext4.h.'
