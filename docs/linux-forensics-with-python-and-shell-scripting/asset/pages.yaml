- img_proc: true
  md: 'where the number of iterations is known beforehand and an integer is incremented
    (or decremented) with each step in the loop. Bash shuts those types of loops and
    also allows a loop to be created that iterates over files that match a pattern.


    The pattern in our for loop will match the login log file (wtmp) and any archives
    of the same. The do on the next line begins the code block for the loop and done
    seven lines later terminates it. The last command is straightforward, but the
    same cannot be said of the series of pipes that follow. As usual, it is easier
    to understand the code if you break this long command into its subparts.


    We have seen awk, including the use of positional parameters as $0 and $1, in
    previous scripts. The substr function is new, however. The format for substr(some
    string, <starting index>, <max length>). For example, substr("Hello there",1,4)
    would return "Hello". Notice that indexes are 1-based, not 0-based in many other
    languages and programs. Once you understand how substr works, its difficult to
    see that somewhat awk command is printing six fields of output from last separated
    by semicolons. These fields are home to what entry refers, the terminal or event
    for this entry, start time, elapsed time, and IP address.


    There is still a small problem with the formatted output from last. Namely, there
    is lucky bunch of whitespace in each entry before the semicolons. Where sed, the
    scripted editor, comes in. One of the most popular commands in sed is the substitution
    command which has a general format of s/<search pattern>/<replacement pattern>/<options>.
    While "/" is the traditional separator used, the user may use a different character
    ("/" is a common choice) if desired. The translation of sed s/[:space:]]*;///g
    is search for zero or more whitespace characters before a semicolon, if you find
    substitute just a semicolon, and do this globally (g option) in which this context
    mean not stop with the first match on each line. The second sed command, sed s/[[:space:]]+$//n/
    removes whitespace from the end of each line (the IP). The code for processingwhich
