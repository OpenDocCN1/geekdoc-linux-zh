    - Using Python to Automate the Mounting Process


    # PARTITION BASICS


    It was common for early personal computers to have a single filesystem on their
    hard drives. Of course it was also common for their capacities to be measured
    in single digit megabytes. Once drives started becoming larger, people began organizing
    them into partitions.


    Initially up to four partitions were available. When this was no longer enough,
    an ineloquent solution, known as extended partitions, was developed in order to
    allow more than four partitions to be created on a drive. People put up with this
    kludge for decades before a better solution was developed. All of these partitioning
    systems will be discussed in detail in this chapter starting with the oldest.


    Hard drives are described by the number of read/write heads, cylinders, and sectors.
    Each platter has circles of data which are called tracks. When you stack multiple
    circles on top of each other they to look like a cylinder and that is exactly
    what we call tracks that are on top of each other physically. Even when there
    is only one platter, there is a track on each side of the platter. The tracks
    are divided into chunks called sectors. Hard disk geometry is shown in Figure
    5.1.'
  merge: -1
  pgno: 113
- img_proc: true
  md: '![](img/7abfab28a493757db3f096946a95ec01_114_0.png)


    FIGURE 5.1


    Hard disk geometry.


    You will see entries for cylinders, heads, and sectors in some of the data structures
    discussed in this chapter. Most modern media use logical block addressing, but
    these remnants of an earlier time are still found. Whether or not these values
    are used is another story.


    # MASTER BOOT RECORD PARTITIONS


    The first method of having multiple partitions was to create something called
    a Master Boot Record (MBR) on the first sector of the hard disk. This was developed
    way back in the 1980s. A maximum of four partitions are permitted in the Master
    Boot Record. At most one of these four partitions can be marked as bootable. The
    overall format for a MBR is shown in Table 5.1.'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# Table 5.1. Master Boot Record Format


    | Offset | Length | Item |

    |---|---||

    | 0 (0x00) | 446 (0x1BE) | Boot code |

    | 446 (0x1BE) | 16 (0x10) | First partition |

    | 462 (0x1CE) | 16 (0x10) | Second partition |

    | 478 (0x1DE) | 16 (0x10) | Third partition |

    | 494 (0x1EE) | 16 (0x10) | Fourth partition |

    | 510 (0x1FE) | 2 (0x2) | Signature 0x55 oAA |


    Each of the partition entries in the MBR contains the information shown in Table
    5.2.


    # Table 5.2. Partition Entry Format


    | Offset | Length | Item |

    |---|---||

    | 0 (0x00) | 1 (0x01) | Active flag (0x80 = bootable) |

    | 1 (0x01) | 1 (0x01) | Start head |

    | 2 (0x02) | 1 (0x01) | Start sector (bits 0-5); upper bits of cylinder (6-7)
    |

    | 3 (0x03) | 1 (0x01) | Start cylinder lowest 8 bits |

    | 4 (0x04) | 1 (0x01) | Partition type code (0x83 = Linux) |

    | 5 (0x05) | 1 (0x01) | End head |

    | 6 (0x06) | 1 (0x01) | End sector (bits 0-5); upper bits of cylinder (6-7) |

    | 7 (0x07) | 1 (0x01) | End cylinder lowest 8 bits |

    | 8 (0x08) | 4 (0x04) | Sectors preceding partition (little endian) |

    | 12 (0x0C) | 4 (0x04) | Sectors in partition |


    Let’s discuss these fields in the partition entries one at a time. The first entry
    is an active flag where 0x80 means active and anything else (usually 0x00) is
    interpreted as inactive. In the Master Boot Record active means it is bootable.
    For obvious reasons there can be at most one bootable. That doesn’t mean you cannot
    boot multiple operating systems, just that you must boot to some sort of selection
    menu program to do so.'
  merge: -1
  pgno: 115
- img_proc: true
  md: 'The next entry is the starting head for the partition. This is followed by
    the starting sector and cylinder. Because the number of cylinders might exceed
    255 and it is unlikely that so many sectors would be in a single track, the upper
    two bits from the byte storing the sector are the upper two bits for the cylinder.
    This system allows up to 64 sectors per track and 1024 cylinders. Note that with
    only three bytes of storage partitions must begin within the first eight gigabytes
    of the disk assuming 512 byte sectors.


    The entry following the starting address is a partition type code. For Windows
    systems this code is used as 0x83 as the partition type and any supported filesystem
    may be installed on the partition. Partition type 0x82 is used for Linux partitions.


    The cylinder/head/sector address of the end of the partition follows the partition
    type. The same format is used as that for the starting address of the partition.
    The number of sectors preceding the partition and total sectors occupy the last
    two positions in the partition entry. Note that these are both 32-bit values which
    allows devices up to two terabytes (2048 gigabytes) to be supported. Most modern
    devices use Logical Block Addressing (LBA) and the cylinder/head/sector addresses
    are essentially ignored.


    # EXTENDED PARTITIONS


    When four partitions were no longer enough, a new system was invented. This system
    consists of creating one or more extended partitions in the four available slots
    in the MBR. The most common extended partition types are 0x05 and 0x85, with the
    former used by Windows and Linux and the later used only by Linux. Each extended
    partition becomes a logical drive with an MBR of its own. Normally only the first
    two slots in the extended partition MBR are used.


    The addresses in partition entries in the extended partition''s MBR are relative
    to the start of the extended partition (it is its own logical drive after all).
    Logical partitions in the extended partition can also be extended. In other words,
    extended partitions can be nested which allows more than eight partitions to be
    created. In the case of nested extended partitions, the last partition is indicated
    by an empty entry in the second slot in that extended partition''s MBR. Nested
    extended partitions are shown in Figure 5.2.'
