- img_proc: true
  md: "# MOUNTING KNOWN-GOOD BINARIES\n\nIn most cases if you insert your USB drive\
    \ with known-good binaries, it will be automated. If this isn't the case on the\
    \ subject system, you will need to manually mount the drive. Once your drive is\
    \ mounted you should run a known-good shell located on your drive. Once not done\
