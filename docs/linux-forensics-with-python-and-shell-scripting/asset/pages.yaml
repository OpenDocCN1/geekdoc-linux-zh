    Before we move on to a new topic, I feel that I should point out that we have
    merely scratched the surface of what can be done with the classes in this script.
    For example, the classes could easily be used to calculate the offset for an image
    for a given inode or data block. It could also be used to work backward from an
    offset to figure out what is stored in any given sector. Now that we have learned
    all of the basics of the extended files systems we will move on to discussing
    how we might detect an attacker’s actions, even if he or she has altered timestamps
    on the filesystem.


    # FINDING THINGS THAT ARE OUT OF PLACE


    Thus far in this chapter we have seen a lot of theory on how the extended filesystem
    works. We can leverage knowledge to find things that are out of place or not quite
    right. After all, this is normally what the forensic investigator sees. Inconsistencies
    and uncommon situations often point to an attacker’s attempt to hide his or her
    actions.


    Some of the system directories such as /sbin and /bin are highly targeted by attackers.
    Even the ls command often be enough to detect alterations in these directories.
    How can we detect tampering in a system directory? When the system is installed,
    files in the system directories are copied one after the other. As a result, the
    files are usually stored in sequential inodes. Anything added later by an attacker
    will likely be in a higher inode number


    The command ls -ali will list all files (-a) with a long listing (-l) which will
    begin'
