  md: '# CHAPTER 11


    # The Road Ahead


    INFORMATION IN THIS CHAPTER:


    +   - Next steps

    - Communities

    - Learning more

    - Congregate

    - Certify?


    # NOW WHAT?


    You''ve read through this entire book and worked through the sample images. Now
    what? The world of information security is a big place. The subfield of forensics
    is also vast. While we have covered everything you need to know for a typical
    Linux incident response, we have only scratched the surface of forensics knowledge.
    Perhaps you have done a handful of real Linux investigations. A natural question
    to ask is, “Where do I go from here?”


    # COMMUNITIES


    Do not work alone. Become part of a community. If you want to limit yourself strictly
    to forensics, this is easier said than done. Organizations dedicated to forensics
    with a vibrant network of local chapters are rare. Personally, I do not see this
    as a bad thing. I think it is far better to get plugged in the broader information
    security community. If you think about it, having friends that are experts on
    things like offensive security could help you in the future. You will also find
    many domain experts on Linux, Assembly, as in this community.


    A good starting place might be a local DEFCON group. The list of groups (named
    according to phone area codes) can be found at https://www.defcon.org/html/defcon-groups/dc-index.html.
    If you live in a large city, you might find that there is a DEFCON group in your
    area. What if you don''t live in a big city? E-mail the contact people from some
    nearby groups and ask if they know of anything going on your area, especially
    anything related to forensics.


    Local meetings are great. You can meet like-minded people, and often such meetings
    can be fun. The problem with these meetings is that they tend to be infrequent.
    Even monthly meetings are not enough interaction with the bigger community. This
    is when online communities can be extremely beneficial. When you join an online
    community, you'
  merge: -1
  pgno: 396
- img_proc: true
  md: 'have access to many experts around the world, not just people who live nearby.


    A great online community to become a part of the one at Pentester Academy (http://pentesteracademy.com).
    Pentester Academy goes beyond a couple of discussion forums by providing downloads
    related to this book and others published by their publication branch, author
    interaction, and a growing library of courses. Another plus of Pentester Academy
    is that it is not narrowly focused on the subfield of forensics.


    If you are only looking for a place to have forensics discussions, you might consider
    giving Computer Forensics World (http://computerforensicsworld.com) a try. They
    offer a number of discussion forums. There is also a computer forensics community
    on Reddit (http://reddit.com/r/computerforensics).


    # LEARNING MORE


    Has this book and/or a few Linux investigations inspired you to learn more? You
    can never go wrong learning more about the fundamentals. Here is my list of fundamentals
    every forensics person should know:


    +   - Linux - this is the place for forensics, if the subject is not running Linux

    - Python - this has the de facto standard for information security people

    - Shell scripting - sometimes Python is overkill or has too much overhead

    - Assembly - a good understanding of Assembly helps you understand everything


    What is the best way to learn Linux? Use it. Really use it. Run it every day as
    your primary operating system. Do not just run a Linux distribution occasionally.
    Install Linux on your laptop. You will never learn Linux administration from a
    live distribution. Personally, I would stay away from a forensics-specific distribution,
    like SIFT. You will be better off in the long run installing a standard version
    of Linux and adding your tools. If you are not sure what to use, some member of
    the Ubuntu family is a large community to turn to when you want support. If, after
    running Linux for a few years, you decide you want to learn Linux on a deeper
    level, consider installing Gent Linux (http://gentoo.org) on something other than
    your forensics workstation. Gentoo is a source-based distribution, and installing
    it can be simultaneously educational and extremely frustrating.


    As Linux, the best way to learn Python is really use it. There are many books
    available that claim to teach you Python. The first thing you should realize is
    that Python can be used as a scripting language or as a programming language.
    Most of the books available treat Python as a programming language. What I mean
    by programming language is a language for writing large computer programs (say
    a word processor or a game). In my opinion, there are other languages that are
    better suited for such tasks.


    To learn Python scripting requires a very hands-on approach. This is exactly what
    you will find in the Python course at Pentester Academy (http://www.pentesteracademy.com/course?id=1).
    Some might question this recommendation, given that this book is published by
    Pentester Academy. I have been'
  merge: -1
  pgno: 397
- img_proc: true
  md: 'recommending this course long before I produced my first video for Pentester
    Academy or there was even a notion of this book, some other resources include
    http://learnpythonthardway.org, http://www.codecademy.com/en/tracks/python, and
    http://learnpython.org.


    As as I might like Python, there are times when scripting is more appropriate.
    In general, when you want to run some programs and/or not do a lot of calculations,
    a script can be a good choice. Some online resources for learning scripting includes
    http://linuxcommand.org, http://linuxconfig.org/bashscript-tutorial, and http://tdlp.org/HOWTO/Bash-Prog-Intro-HOWTO.html.
    Two books on shell scripting that I would recommend are Wicked Cool Shell Scripts
    by Taylor (2nd edition scheduled for September 2015 publication) and Classic Shell
    Scripting by Arnold Robins and Nelson H.F. Bebe. The latter was published in 2005
    but is still one of the best books on this topic.


    Why learn Assembly? A firm grasp of Assembly helps a person understand how computers
    work at the lowest level. Assembly is to science what calculus is to mathematics
    and physics. Just as knowing calculus allows you to instantly make sense of everything
    from your school physics class, learning Assembly is what makes goes on behind
    the scenes with high-level programming languages (C, C++, etc.) crystal.


    Pentester Academy offers two courses on Assembly and shellcoding. One is for 32-bit
    systems and the 32-bit and 64-bit courses are available at http://www.pentesteracademy.com/course?id=3
    and http://www.pentesteracademy.com/course?id=7, respectively. Both of these courses
    will provide you with a basic understanding of Assembly and go well beyond what
    has been covered in this book.


    If you want to delve deeper into Assembly and explore topics not covered in the
    Pentester books mentioned above, you might enjoy Modern X86 Assembly Language
    Programming by Daniel Kusswurm. This book covers many topics that are not covered
    by the Pentester Academy courses (as these courses are focused on things in shellcoding
    and reverse engineering malware). The additional topics include items such as
    using floating-point registers and Advanced Vector Extensions (AVX) found in new


    # CONGREGATE


    Being part of vibrant local and online communities is a great thing. Nothing beats
    a great conference, however. Many of the research projects I have done in the
    past have a direct result of people at conferences around the world. Conferences
    are great places to network and meet people with complementary skills sets and
    areas of expertise.


    A good starter list of forensics conferences can be found at http://forensicswiki.org/wiki/Upcoming_events#Conferences.
    Forensics Magazine lists some conferences as well at http://www.forensicmag.com/events.
    I have not found a good master list for digital forensics conferences. I wish
    to try a few Google searches'
  merge: -1
  pgno: 398
- img_proc: true
  md: 'to locate conferences dedicated to forensics.


    There are many excellent information security conferences out there that offer
    something for people interested in forensics. My two favorite places to find conference
    listings are Concise Courses (http://concise-courses.com/security) and Security
    Organizer and Reporter Exchange (http://secore.info). SECore offers calls for
    listings with CFP closing dates for various conferences which can be handy if
    you have something exciting to share with others.


    Now that you have found a few conferences to attend, what should you do while
    you are there? Participate! If there is a forensics competition, and you have
    the time, consider competing. Now it might not win, but you are virtually guaranteed
    to learn a lot. Often there are people who will offer a little coaching for beginners
    in these competitions. Ask questions. Do not be afraid to talk to conference presenters.
    With very few exceptions, most are approachable and happy to talk about their
    research.


    Intentionally meet new people. Even if you traveled to a conference with a group,
    find someone you do not know whom to have a meal at the conference. Overcome any
    natural tendencies toward introversion. I have attended a lot of conferences.
    I have yet to have a negative outcome from introducing myself and sitting with
    someone over lunch. If the conference offers any mixers or networking events,
    attend them if at all possible. It does not take long to build a network of people
    whom you can leverage in a future investigation.


    Now for the hardest thing to do at conferences: many people falsely assume they
    have nothing worth sharing because they are new to information security/or forensics.
    Everyone is an expert in something. Find an area you enjoy and become an expert
    in that area. Share your expertise with others. You will quickly find that explaining
    things to others enriches your own understanding.


    Submitting a talk to a conference can be intimidating. Everyone gets rejected
    from conferences. The key is not to take it personally. A rejected talk may be
    more of an indicator of poor fit with a theme or other talks offered as a reflection
    of the quality of your submission. Many conferences will give you feedback that
    includes suggestions for future submissions.


    Regional conferences, such as B-sides, can be a good place to start your career
    as a conference presenter. I''m not saying not to submit to the big conferences
    like DEFCON. If you feel comfortable attending a few thousand people for your
    first conference presentation, go right ahead. If you find public speaking a bit
    frightening, you may want to start with a conference small enough that you have
    less than a hundred people in the room during your talk.


    # CERTIFY


    Generally speaking, certifications can help you get a job. This is especially
    true for individuals just getting started in a career. Unfortunately, many of
    the recognized certifications require a certain level of experience that those
    starting out do not yet'
  merge: -1
  pgno: 399
- img_proc: true
  md: 'possess. The situation is even worse in the forensics field as some certification
    organizations require active involvement with a government entity. To further
    complicate things, there is no universally accepted certification in digital forensics.


    In the broader field of information security, the Certified Information Systems
    Security Professional (CISSP) from the International Information System Security
    Certification Consortium (ISC)² is considered to be the standard certification
    all practitioners should hold in many countries, including the United States.
    (ISC)² offers a Certified Cyber Forensics Professional (CCFP) certification. Unlike
    the CISSP, the CCFP is not considered essential by many organizations. Like the
    CISSP, if you want to be a CCFP but lack experience, you can take the test and
    become an Associate of (ISC)² who is granted the certification later after you
    have obtained the required experience.


    Many of the forensics certifications that are not tied to government employment
    are issued by vendors. Given the open source nature of Linux, certifications specific
    to Linux forensics appear to be non-existent at this time. The net of all of this
    is that you should be cautious about spending money on forensics certifications
    unless you know they will be required for a specific job.


    # SUMMARY


    We have covered a lot of ground in this book. I hope you have enjoyed the journey.
    We have laid a foundation that should help you perform investigations of Linux
    systems. What may not be immediately apparent is that by learning how to do forensics
    in Linux, you have also learned a considerable amount about how to investigate
    Windows systems on a Linux-based forensics workstation as well. That is the subject
    for another book. Until then, so long for now, and enjoy your Linux investigations.'
