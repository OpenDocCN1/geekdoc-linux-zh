    this allows a more compact and easily understood script.


    There is also something new in the echo string, the @@ variable. @@ is equal to
    the entire set of command line parameters passed to the script. We use $@ to create
    a header that reads "++++Sending log for {command parameters} at {date}++++. We
    then use $(() trick yet to actually run the command and insert its output into
    our string, a "--end--" footer is added after the command output.


    The last script is used to send files to the forensics workstation for analysis.
    It will make a log entry, then send the filename to the appropriate port, then
    delay a few seconds to give the server time to create a listener to receive the
    files, and finally send the file. The script for this follows:


