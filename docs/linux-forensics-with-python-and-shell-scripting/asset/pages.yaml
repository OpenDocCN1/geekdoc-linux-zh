  md: 'To load a program into gdb, simply type gdb <executable>. You should see some
    messages about your file, whether or not it contained debugging symbols (most
    files you examine likely have the extra debugging information), a statement that
    says to type "help" to get help, and then a (gdb) prompt. Typing help leads to
    the screen shown in Figure 10.26.


    ![](img/7abfab28a493757db3f096946a95ec01_382_0.png)


    Figure 10.26


    The gdb main help screen.

    If you type help info in gdb, you will get a long list of things that the debugger
    will report. One of these items is functions. Running info functions with xingyi
    bindshell loaded in the debugger produces a long list, some of which is shown
    in Figure 10.27. Functions are displayed along with their addresses. Incidentally,
    gdb commands can be abbreviated as long as they are not ambiguous. Typing inf
    fun would have returned the same results.'
