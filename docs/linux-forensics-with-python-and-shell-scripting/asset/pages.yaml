  md: '# Inode extensions and details


    You may have noticed the script in the previous section that the file mode bitvector
    in the inode contains more than just the file mode. In addition to the standard
    mode information which may be changed via the `chmod` command, the type of file
    is also stored. The file mode bitvector is summarized in Table 7.8.


    Table 7.8. File mode bitvector from the inode. Bolded items are mutually exclusive.


    | 15 | 14 | 13 | 12 | 11 | 10 | 9 | 8 |

    |---|---|---|---|---|---|---|--|

    | Regular or Symlink w/ 13 or Socket w/ 14 | Directory or Block Dev w/Bit 13 |
    Char Device or Block w/Bit 14 | FIFO | Set UID | Set GID | Sticky Bit | Owner
    Read |

    | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |

    | Owner Write | Owner Execute | Group Read | Group Write | Group Execute | Others
    Read | Others Write | Others Execute |


    Upon examining Table 7.8, the lower twelve bits should look familiar as all of
    these modes may be changed via the standard Linux `chmod` (change mode) command.
    These file modes are not mutually exclusive. The upper four bits are used to specify
    the file type. Each file is allowed only one type. The file types are broken out
    in Table 7.9.'
  merge: -1
  pgno: 266
- img_proc: true
  md: '# Table 7.9. Decoding the file type from the upper four bits of the inode file
    mode.


    | | | Bit from Inode File Mode |

    | | Meaning | 15 | 14 | 13 | 12 |

    | FIFO (pipe) | 0 | 0 | 0 | 1 |

    | Character Device | 0 | 0 | 1 | 0 |

    | Directory | 0 | 1 | 0 | 0 |

    | Block Device | 0 | 1 | 1 | 0 |

    | Regular File | 1 | 0 | 0 | 0 |

    | Symbolic Link | 1 | 0 | 1 | 0 |

    | Socket | 1 | 1 | 0 | 0 |


    The inode contains a 32-bit bitvector of flags. The lower word of flags is summarized
    in Table 7.10. Some flags may lack operating system support. Investigators familiar
    with Windows may know that there is a registry flag, HKLM\SYSTEM\CurrentSet\Control\FileSystem\NtfsDisableLastAccessUpdate,
    which can be used to disable access time updating on NTFS directories. By 7, no
    access time updating, provides a similar function on an extended filesystem, but
    at the individual file or directory level.


    # Table 7.10. Lower word of inode flags.


    | 15 | 14 | 12 | 11 | 10 | 9 | 8 |

    | File tail merged | Data written through journal | AFS Magic | Directory hash
    indexes | Encrypted inode | Don''t compress file | Compressed clusters | Dirty
    compressed file |


    | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |

    | No access time updating | No Dump | Append Only | File immutable | Synchronous
    Writes | File is compressed | Preserve for undelete | Secure Deletion |


    The high word of flags is summarized in Table 7.11. Most of these flags only make
    sense in the context of ext4 optional features. By 28, inode has inline data,
    is used to store very small files entirely within the inode. The first 60 bytes
    are stored in the block array (which is not needed to store blocks). If the file
    grows beyond 60 bytes to up to 160 bytes, bytes 60 and are stored in the space
    between inodes (currently 100 bytes). If the file exceeds 160 bytes, all of the
    data is moved to a regular block.'
  merge: -1
  pgno: 267
- img_proc: true
  md: '# Table 7.11. Upper word of inode flags.


    | 31 | 30 | 29 | 28 | 27 | 26 | 25 | 24 |

    | Reserved for Ext4 library | Unused | Unused | Inode has inline data | Snapshot
    shrink completed | Snapshot is being deleted | Unused | Inode is snapshot |


    | 23 | 22 | 21 | 20 | 19 | 18 | 17 | 16 |

    | Unused | Blocks past end of file (deprecated) | Inode stores large extended
    attribute | Unused | Inode uses extents | Huge File | Top of directory | Directory
    entry sync writes |


    Huge files specify their size in clusters, not blocks. Cluster size is stored
    in the superblock when huge files are present on a filesystem. Huge files require
    the Extents feature. Extents will be discussed in later in this chapter. In line-line
    data, extents use the 60 bytes in the block array for a different purpose. We
    have said that an inode is the keeper of file metadata. In the next section we
    will discuss how to retrieve a file based on information stored in the inode.


    # Going from an inode to a file


    We have discussed the fifteen entries in the block array and how they are used
    to specify data blocks which house a file. We have also seen these sixty bytes
    may be re-purposed for certain cases. If the inode stores a symbolic link and
    the target is less than sixty bytes it will be stored in the block array. In the
    in-line data flag is set, the first sixty bytes of a file are in our space. We
    have also mentioned that extents use this sixty bytes differently.


    When parsing an inode for the list of blocks contained in a file (or directory)
    in the most generic situation (i.e. no extents), we read the first two entries
    in the block array and add any non-zero values to our list of blocks. If the thirteenth
    entry is non-zero, we read the block with the address stored which contains a
    list of 1024 blocks. Any non-zero entries from the data block add to our list.
    This allows files as large as 4 megabytes + 48 kilobytes to be handled.


    If there is an entry in the fourteenth block array item, we load the data block
    which contains a list of data blocks which turn contain list of data blocks. There
    are up to 1024 * 1024 entries in this doubly indirect link at least of which points
    to 4 kiloby blocks which allow files as large as 4 gigabytes + 4 megabytes + 48
    kilobytes to be handled. If this is still not enough, the last entry is for a
    triply indirect block which permits files as large as 4 terabytes + 4 gigabytes
    + 4 megabytes + 48 kilobytes, at least in theory. If you have an ext4 filesystem,
    it is much more likely to use extents which are discussed in the next section.


    # Extents'
  merge: -1
  pgno: 268
- img_proc: true
  md: 'The system for storing lists of data blocks described in the previous section
    is fine when most files are small. When file sizes are measured in megabytes,
    gigabytes, or terabytes, performance quickly becomes an issue, however. To be
    fair, the Linux extended filesystem has been around for decades and yet perfectly
    acceptable as for many users. The elegant solution to improve performance for
    large files is by the use of extents.


    Extents store blocks in a tree structure. Those familiar with NTFS will know that
    it uses a list of data runs (contiguous clusters) in a similar manner. As with
    most things in Linux, storing blocks in a tree is much more efficient than the
    simple list used in Windows. Three types of structures are required to build an
    extent tree. The top node extent tree must have a header that indicates what is
    stored in the node. The top node of a tree is often referred to as the root node.
    The root node is always stored at the start of the index block array. All non-empty
    extent trees must have at least one leaf node which is called an extent (which
    is essentially equivalent to the NTFS data run). There may be middle nodes between
    the root node and leaf nodes which are called indexes. All three types of structures
    have a length of 12 bytes which allows the root node plus four entries to be stored
    in the index block array.


    The extent header is summarized in Table 7.12. The header begins with a magic
    number which is a double-check what follows is not a traditional data block entry.
    If the depth is zero, the entries that follow the header in this node are leaf
    nodes (extents). Otherwise the entries are for index (middle) nodes. If you work
    out the math, storing the largest file supported by ext4 should never require
    more than five levels in the tree.


    # 7.12. Extent header format.


    | Offset | Size | Name | Description |

    |---|---|---||}{

    | 0x0 | 2 | Magic | Magic number 0xF30A |

    | 0x2 | 2 | Entries | Entries that follow the header |

    | 0x4 | 2 | Max Entries | Maximum number of entries that might follow header |

    | 0x6 | 2 | Depth | 0=this node points to data blocks 1-5=this node points to
    other extents |

    | 0x8 | 4 | Generation | Generation of the tree |


    The extent index node entry is summarized in Table 7.13. The block in the first
    field is a logical block number (the file is contained in logical block zero through
    total blocks minus one). For those familiar with NTFS, this is similar to a Virtual
    Cluster Number (VCN). The only real data in an index node is a 48-bit block address
    for the node level lower in the tree.'
  merge: -1
  pgno: 269
- img_proc: true
  md: '# Table 7.13. Extent index format.


    | Offset | Size | Name | Description |

    | --- | --- | --- | --- |

    | 0x0 | 4 | Block | This node covers block x and following |

    | 0x4 | 4 | Leaf lo | Lower 32 bits of block containing the node (leaf or another
    index) one level lower in tree |

    | 0x8 | 2 | Leaf hi | Upper 16 bits of the block described above |

    | 0xA | | Unused | Padding to 12 byte size |


    The extent (leaf) node is summarized in Table 7.14. As with the index node, the
    first field is a logical block number. This is followed by a length. This length
    is normally less than 32,768. However, if uninitialized blocks are supported on
    this filesystem (with the lazy block group feature), a value greater than 32,768
    indicates that the extent consists of (32,768 – length) uninitialized data blocks.
    This is not common. The extent ends with a 48-bit data block address for the first
    block in this extent.


    # Table 7.14. Extent node format.


    | Offset | Size | Name | Description |

    | --- | --- | --- | --- |

    | 0x0 | 4 | Block | First block covered by this extent |

    | 0x4 | 2 | Len | If <= 32768 initialized blocks in extent if > 32768 extents
    is (len-32768) unit blocks |

    | 0x6 | 2 | Start hi | Upper 16 bits of the starting block |

    | 0x8 | 4 | Start lo | Lower 32 bits of the starting block |


    ```

