- img_proc: true
  md: 'rootkit from the PAS subject system are shown in Figure 10.1. Notice that file
    is able to distinguish between the install, README, and xingyi_addr.c files, which
    are an executable Perl script in ASCII text, a plain ASCII text, and a C source
    file in ASCII text, respectively. Compare this to Windows, which cannot distinguish
    install from because there is no file extension (which normally indicates a directory
    for Windows).


    ![](img/7abfab28a493757db3f096946a95ec01_356_0.png)


    FIGURE 10.1


    Results of running the file command on rootkit files saved from the PAS subject
    system.


    The information provided for binary files is much more specific. Here we see that
    the binaries are 64-bit Executable and Linkable Format (ELF) files for little
    endian (LSB) systems based on the V branch of UNIX (Linux is such a system). They
    are also dynamically linked, meaning they use shared libraries, as opposed to
    statically linking all code they need in the executable (which would make it huge).
    The file is compatible with kernel versions 2.6.24 and higher. The files have
    not been stripped of the debugging information. A Secure Hash Algorithm (SHA)
    hash for each binary identifier is also given.


    As you can see, this one command provides quite a bit of information. If file
    doesn''t identify the suspicious file as an executable binary or a script, it
    is probably some sort of data file, or a component that was used to build some
    malware. For files that are not executable, there are ways of telling if executables
    use a file. These methods will be discussed later in this chapter (although there
    are also ways of obscuring this from would-reverse engineers).


    # Is it a known-bad file?'
  merge: -1
  pgno: 356
- img_proc: true
  md: 'A number of organizations maintain databases of known malware MD5 and SHA hashes.
    Naturally, most of these hashes pertain to Windows, the king of malware, but many
    databases list Linux malware as well. Some of these databases must be downloaded
    and others be accessed online. One of the online databases that is accessible
    via multiple services is the Malware Hash Registry (MHR) maintained by Team Cymru
    (http://team-cymru.org/MHR.html).


    One of the nice things about MHR is that it uses both MD5 and SHA hashes. The
    SHA hash is easily calculated using shashum <filename>. Perhaps the easiest way
    to use the MHR is via the whos command. The whois service is normally used to
    lookup information on a web domain. The syntax for using this service to check
    a binary is `whois -h hash.cymru.com <MD5 or SHA hash>`. If the file is known,
    the UNIX timestamp for the last seen, along with the anti-virus detection percentage
    is returned. The results of running this command against one of the Xing Yi files
    are shown in Figure 10.2.


