    n, they will be sorted numerically (-n) by inode number. The results of ls

    ali bin | sort -n from within the mount directory (subject''s root directory)
    of

    PFE subject system are shown in Figure 7.16. Files associated with the Xing Yuan

    rootkit are highlighted. Notice that the inodes are mostly sequential and suddenly
    jumped

    from 655,549 to 665,076 when the malware was installed.


    ![](img/7abfab28a493757db3f096946a95ec01_248_0.png)


    FIGURE 7.16


    Results of running ls -ali bin | sort -n on PFE subject image. The highlighted
    files are from a rootkit

    installation.


    Some readers may have expected the inode numbers to be considerably higher. The

    primary reasons that they are only a few thousand is that Linux will do

    best to store files in a given directory in the same block group. When only there
    is

    space in the containing directories block group will the file be stored elsewhere.
    This is a

    performance optimization that attempts to minimize movement of the read/write
    heads on

    hard drive.


    In this case the attacker did not attempt to alter the timestamps on the rootkit
    files. There

    are many tools that will allow you to easily modify these timestamps. The important
    thing

    to realize is that no matter what you do to the timestamps, the inodes will reveal
    recently

    added files every time.


    The ls command supports a few basic sorts. The default sort is alphabetical, but
    it will

    also sort by extension, size, time, and version. The command ls -alir

    <directory>-sort=size will perform a recursive (-R) listing of a directory with

    every sorted by size (largest to smallest). Partial results of running ls -alir
    bin

    -sort=size are shown in Figure 7.17.'
