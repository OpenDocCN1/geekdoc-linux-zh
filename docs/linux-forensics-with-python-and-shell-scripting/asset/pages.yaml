  md: '# FIGURE 6.12


    Examining group file information.


    Let''s return to the files table. After all, we said our motivation for importing
    users and groups was to display correct information. In order to display usernames
    in our queries we must do a database join. If you are not a SQL expert, fear not,
    the kind of join needed here is simple. We only select from more than one table
    and give the condition that joins (associates) rows in the various tables.


    If we wish to add usernames to the previous query of the files table something
    like the following will work: `select accessdate, accsetime, filename, permissions,
    username from files, users where files.userid=users.uid order by accessdate desc,
    accsetime desc.` What have we changed? We have gone from the catchall select to
    an explicit list of columns. A second table has been added to the from clause.
    Finally, we have a join clause, where `files.userid=users.uid`, which determines
    which row in the users table is used to retrieve the username. If any of the column
    names in the list exist in both tables you must prefix the name with `<table>`
    to tell MySQL which table to use. The results of running this query are shown
