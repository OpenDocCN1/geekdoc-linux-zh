- img_proc: true
  md: 'As you prepare to shut down the system for imaging you are faced with a decision
    to perform a normal shutdown or to pull the plug. With as many things in forensics,
    there is not one right answer to question for every situation. The investigator
    must weigh the pulses and minutes for each option.


    # Normal shutdown


    A normal shutdown should, in theory, leave you with a clean filesystem. This,
    of course, assumes that this is possible with a system infected with malware.
    I have found that some rootkits prevent a normal shutdown. The biggest reason
    not to use a normal shutdown is that some malware might clean up after itself,
    destroy evidence, or even worse other information on the system. With the modern
    journaling filesystems likely to be found on the subject system, a clean filesystem
    is not as crucial as it was years ago.


    # Pulling the plug


    If we simply cut power to the subject system the filesystem(s) may not be clean.
    As previously mentioned, this is not necessarily as serious as it was before journaling
    filesystems became commonplace. One thing you can do to minimize the changes of
    dealing with a filesystem that is extremely dirty (lots of file operations waiting
    in the cache) is to run the sync command before pulling the plug. There is always
    a chance that an attacker has altered the sync program, but in the rare instances
    where they have done so your live analysis would likely have revealed this.


    The best thing this method has going for it is that malware doesn''t have any
    chance to react. Given the information collected by running your scripts during
    the live analysis and memory image you have dumped, you are not likely to lose
    much if any information by pulling the plug. If you suspect a malware infection
    this is your best option in most cases.


    # IMAGE FORMATS


    As with the memory images, there are choices of formats for storing filesystem
    images. At a basic level you must decide between a raw format and a proprietary
    format. Within these choices there still choices to be made.


    # Raw format


    The raw format is nothing more a set of bytes stored in the same logical order
    as they are found on disk. Nearly every media you are likely to encounter utilizes
    512 byte sectors. Whereas other devices formatted with Windows filesystems (primarily
    FAT12 and FAT16) may use cylinders, heads, and sectors to address these sectors,
    the Linux investigator is much more fortunate in media he she encounters will
    certainly use Logical Block Addressing (LBA).


    On media where LBA is used sectors are numbered logically from 0 to {{media size
    in bytes} / 512 -1}. The sectors are labeled LBA0, LBA1, etc. It is important
    to understanding that this logical addressing is done transparently by the media
    device and therefore deterministic (doesn''t depend on what operating system reads
    the filesystem,'
  merge: -1
  pgno: 99
- img_proc: true
  md: 'etc.). A raw image is nothing more than a large file with LBA0 in the first
    512 bytes, followed by LBA1 in the next 512 bytes, and so on.


    Because the raw format is essentially identical to what is stored on the media,
    there are numerous standard tools that can be used to manipulate them. For this
    and other reasons the raw format is very popular and supported by every forensics
    tool. Because raw images are the same size as the media they represent, they tend
    to be quite large.


    Some investigators like to compress raw images. Indeed, where forensics tools
    can operate on compressed images. One thing to keep in mind should you choose
    to work with compressed images as it will likely result in a performance penalty
    for many common forensics tasks such as searching.


    # Proprietary format with embedded metadata


    EnCase is a widely used proprietary forensics tool. It is especially popular among
    examiners that focus on Windows systems. The EnCase file format consists of a
    header, the raw sectors with checksums every 32 kilobytes (64 sectors), and a
    footer. The header contains metadata such as the examiner, acquisition date, etc.
    and ends with a checksum. The footer has an MD5 checksum for the media image.


    EnCase file format supports compression. Compression is done at the block level
    which makes searching a faster than it would be otherwise. The reason for this
    is that most searches are performed for certain types of files and file headers
    at the beginning of blocks (sectors) are used to determine file type.


    # Proprietary format with metadata in a separate file


    Halfway between the raw format and some sort of proprietary format is the use
    of multiple files to store an image. Typically one file is a raw image and the
    other stores metadata in a proprietary way. A number of imaging tools make this
    choice.


    # Raw format with hashes stored in a separate file


    In my opinion, the best option is to acquire images in the raw format with hashes
    stored separately. This allows the image to be used with every forensics package
    available and adds Linux system tools to your toolbox. The hashes allow you to
    prove that you have maintained the integrity of the image during the investigation.


    In a perfect world you would create an image of a disk and calculate a hash for
    the entire image and that would be the end of it. We don''t live in a perfect
    world, however. As a result, I recommend that you hash chunks of the image in
    addition to calculating an overall hash.


    There are a couple of reasons for this recommendation. First, it is a good idea
    to periodically recalculate the hashes as you work to verify you have not changed
    an image. If the image is large, computing the overall hash might be time consuming
    compared to hashing a small chunk. Second, you may encounter media that is damaged.
    Certain areas may not read the same every time. It is much better to discard data
    from'
