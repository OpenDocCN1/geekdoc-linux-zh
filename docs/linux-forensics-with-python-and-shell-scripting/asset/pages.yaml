    RHOST=localhost; } consists of two statements separated by the AND operator. The
    first half tests the RHOST environment variable to see if it is (null or unset).
    Notice that the variable complete with the leading $ is enclosed in double quotes.
    This forces the shell to interpret this value as a string for the test to work
    expected. If the statement doesn''t evaluate to true there is no reason to bother
    with the second half of the line so it is skipped (short curled). The curly brackets
    are used to explicitly group everything together in a statement.


    # NOT JUST FOR SCRIPTS


    # Short circuiting is useful in many places


    Short circuiting isn''t just for scripts. It can be useful when you have a series
    of commands that might take a while to run when each command depends on the success
    of the command before it. For example, the command sudo apt-get update && sudo
    apt-get -y upgrade will first update the local software repository cache and then
    upgrade any packages that have newer versions. The -y option automatically says
    yes to any prompts. If you are unable to connect to your repositories for some
    reason the upgrade command is never executed.


    Another common use of this technique is building software from where you do not
    want to sit around and wait to see if each stage completes successfully. Many
    packages require a configure script to run that checks dependencies and optionally
    sets some non-default options (such as library and tool locations), followed by
    a make and sudo install. It can take some time for all three stages to complete.
    The command ./configure && make && sudo make install is used to do this on one
    line.


    The only real work done in this script is in the echo line near the bottom. We
    have already seen the echo command, but there are a few new things on this line.
    First, echo has a -e option. The option enables interpretation of backslash characters.
    This allows us to put newlines ''\n'' in our string in order to produce multiple
    lines of output with a single echo command.


    There are a couple reasons why we want to use a single echo command here. First,
    we will be passing (piping actually) the results to the netcat talker which will
    send this data'
