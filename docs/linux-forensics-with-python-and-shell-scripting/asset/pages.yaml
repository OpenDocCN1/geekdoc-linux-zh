- img_proc: true
  md: 'systems normally pass in parameters in the registers RDI, RSI, RDX, RCX, R8,
    R9, and place any additional parameters on the stack (ordered right left). Return
    values are stored in EAX/EDX and RAX/RDX for 32-bit and 64-bit systems, respectively.
    One of the reasons that there are multiple calling conventions is that some functions
    (such as printf in C) can take a variable number of arguments. In addition to
    specifying where parameters are stored, a calling convention defines who is responsible
    (caller or callee) for returning the stack and CPU registers to their previous
    state before the function was called.


