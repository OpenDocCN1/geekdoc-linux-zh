- img_proc: true
  md: 'The Meta Block Group breaks up a filesystem into many meta block groups sized
    so that group descriptors can be stored in a single block. This allows filesystems
    larger than 256 terabytes to be used.


    The Extents feature allows more efficient handling of large files. Extents are
    similar to NTFS data runs in that they allow large files to be more efficiently
    stored and accessed. Extents will be discussed in detail later in this chapter.


    The 64-bit feature increases the maximum number of blocks from $2^{32}$ to $2^{64}$.
    This is not a commonly feature as 32-bit mode supports filesystems up as 256 petabytes.
    It is more likely to be found when a small block size is desirable, such as a
    server that stores a large number of small files.


    The Multiple Mount Protection feature is used to detect if more than one operating
    system or process is using a filesystem. When this feature is enabled, any attempts
    to mount an already mounted filesystem should fail. As a double-check, the mount
    status (sequence number) rechecked periodically and the filesystem remains read-only
    if the operating system detects that another has mounted it.


    Like extents, flexible blocks are used to more efficiently handle large files.
    When the Flex Block Group feature is enabled, some of the items in adjacent block
    groups are moved around to allow more data blocks in some groups so that large
    files have a better chance of being stored contiguously. This feature is often
    used in conjunction with extents.


    Extended attributes were discussed in the previous section. If extended attributes
    are supported, they may be stored in the inodes or in data blocks. If the Extended
    Attribute In flag is set, then the operating system must support reading extended
    attributes from the inodes wherever they exist.


    We have seen several features that allow more efficient processing of large files.
    The Directory Data feature is an optimization for small files. When this feature
    is enabled, small files can be stored completely within their directory entry.
    Larger files may be split between the directory entry and data blocks. Because
    the first few bytes contain a file signature, starting the beginning of a file
    in the directory entry can speed up operations by eliminating the need to read
    data blocks to determine the file type. The Inline Data feature is similar, but
    data is stored in the inodes instead of the directory entries.


    The remaining incompatible features are Group Meta Checksum, Large Directory,
    and Encrypt which indicate that checksums for metadata are stored in the block
    groups, directories larger than 2 gigabytes or using 3-level hash trees are present,
    and that inodes are encrypted, respectively. None of these features are common.


    For all of incompatible features, we are most interested in the ones that affect
    our filesystem layout. There are three such features: Flexible Block, Meta Block,
    and 64-bit Mode. Flexible block groups combine multiple block groups together
    in a flex group. The flex group size is normally a power of two. The data and
    inode bitmaps are only present in the first block group within the flex group.
    This allows some groups to consist entirely of data blocks which allows large
    files to be'
  merge: -1
  pgno: 204
- img_proc: true
  md: 'stored without fragmentation.


    When meta block groups are in use, the filesystem is partitioned into several
    logical chunks called meta block groups. The group descriptors are only found
    in the first, second, and last block group for each meta block group.


    The use of 64-bit mode does not directly affect the filesystem layout. Rather,
    the effect is indirect as some structures will grow in size when 64-bit mode is
    in use.


    # Read-only compatible features


    Read-only compatible features are required to be supported in order to alter data,
    but not needed to correctly read data. Obviously, you should not run one or more
    of these features, fsck against the filesystem. Read-only compatible features
    are summarized in Table 7.4.


    # Table 7.4. Read-only Compatible Features.


    | Bit | Name | Description |

    |---|---|---|

    | 0x1 | Sparse Super | Sparse superblocks (only in BG 0 or power of 3, 5, or 7)
    |

    | 0x2 | Large File | File(s) larger than 2GB exist on the filesystem |

    | 0x4 | Btree Dir | Btrees are used in directories (not common) |

    | 0x8 | Huge File | File sizes are represented in logical blocks, not sectors
    |

    | 0x10 | Gdt Csum | Group descriptor tables have checksums |

    | 0x20 | Dir Nlink | Subdirectories are not limited to 32k entries |

    | 0x40 | Extra Isize | Indicates large nodes are present on the filesystem |

    | 0x80 | HasSnapshot | Filesystem has a snapshot |

    | 0x100 | Quota | Disk quotas are being used on the filesystem |

    | 0x200 | BigAlloc | File extents are tracked in multi-block clusters |

    | 0x400 | Metadata Csum | Checksums are used on metadata items |

    | 0x800 | Replica | The filesystem supports replicas |

    | 0x1000 | ReadOnly | Should only be mounted as read-only |


    When the Superblock feature is in use, the superblock is only found in block group
    0 or in block groups that are a power of 3, 5, or 7. If there is at least one
    file greater than 2 gigabytes on the filesystem, the Large File feature flag will
    be set. The Huge File *'
