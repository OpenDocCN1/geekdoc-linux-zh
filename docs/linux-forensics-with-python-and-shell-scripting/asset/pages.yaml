    such as http://www.regular-expressions.info/, for those who want to know more.
    Mastering Expressions by Jeffrey E. F. Fried (O''Reilly, 2006) is a great resource
    for those who prefer a book.


    In regular expressions have characters that match themselves (literals) and with
    special meaning (metacharacters). Within the set of metacharacters we have things
    that match, anchors, and quantity specifiers. Occasionally we want to treat metacharacters
    as literals and we do this by escaping them. Escaping a character is as simple
    as prepending the character before it.


    Some of the more common matching metacharacters are character classes (lists of
    characters inside square brackets) and the period which may match any character
    in the list and except a newline, respectively. Because the period is a metacharacter,
    it must be escaped when you want to match a period, as is the case with the regular
    expression in this script.


