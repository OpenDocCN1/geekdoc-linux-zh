    Back in Chapter 3, our live response script simply displayed a banner, typed out
    the history file contents, and displayed a footer. This will not work as a format
    if we wish to import the results into a spreadsheet and/or database. To get an
    output that is more easily imported we awk.


    Some readers may be unfamiliar with awk. It was created at Bell Labs in the 1970s
    by Alfred Aho, Peter Weinberger, and Brian Kernighan. Its name comes from the
    first letters of the authors'' surnames. Awk is a text processing language. The
    most common use of awk is the printing of positional fields in a line of text.


    Simple awk usage is best learned by examples. For example, the command echo "one
    two three" | awk ''{ print $1 $3 }'' will print "one three". The 3 -exec claues
    for the command in the script presented in Chapter 3 have been replaced with the
    single clause -exec awk ''{ print "{}"; }'' \. $S0 in this awk command refers
    to an entire line. This prints the filename followed by a semicolon and then each
    line from the file.


    The database code is new if we compare this script to the similar one in Chapter
    3. It is also straightforward and uses techniques previously discussed. Another
    thing that is done to change the owner and group of the output histories.csv file
    to mysql. This is done to avoid any complications loading the file into the database.
    Partial results from running this script across our PFE subject system are shown
    in 6.19.


