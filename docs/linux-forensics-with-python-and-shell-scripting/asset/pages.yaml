  md: '# Author Biography


    Dr. Philip Polstra (known to his friends as Dr. Phil) is an internationally recognized
    hardware hacker. His work has been presented at numerous conferences around the
    globe including repeat performances at DEFCON, BlackHat, 44CON, GrrCON, MakerFaire,
    ForenSecure, and other top conferences. Dr. Polstra is a well-known expert on
    USB forensics and has published several articles on this topic. He has developed
    a number of video courses including on Linux forensics, USB forensics, and reverse
    engineering.


    Dr. Polstra has developed degree programs in digital forensics and ethical hacking
    while serving as a professor and Hacker in Residence at a private university in
    the Midwestern United States. He currently teaches computer science and digital
    forensics at Bloomsburg University of Pennsylvania. In addition to teaching, he
    provides training and performs penetration tests on a consulting basis. When not
    working, he has been known to fly, build aircraft, and tinker with electronics.
    His latest happenings can be found on his blog: http://polstra.org. You can also
    follow him at @ppolstra on Twitter.'
