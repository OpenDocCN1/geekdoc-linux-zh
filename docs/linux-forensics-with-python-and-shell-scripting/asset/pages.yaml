  md: 'feature flag indicates at least one huge file is present. Huge files have their
    sizes specified in clusters (the size is stored in the superblok) instead of data
    blocks.


    The Btree Directory feature allows large directories to be stored in binary-trees.
    This is not common. Another feature related to large directories is Directory
    Nlink. When the Directory Nlink flag is set, subdirectories are not limited to
    32,768 entries as in previous versions of ext3.


    The GDT Checksum feature allows checksums to be stored in the group descriptor
    tables. The Extra Isize feature allow flag indicates that large nodes are present
    on the filesystem. If a filesystem snapshot is present, the Has Snapshot flag
    will be set. Disk quota use is indicated by the Quota feature.


    The Big Alloc feature is useful if the files on the filesystem are huge. When
    this is in use, file extents (discussed later in this chapter) and other filesystem
    structures use multi-block clusters for units. The Metadata Checksum flag indicates
    that checksums are stored for the metadata items in inodes. If a filesystem supports
    replicas, the Replica flag will be set. A filesystem with the Read Only flag should
    only be mounted as read-only. This flag can be set to prevent others from modifying
    the filesystem''s contents.


    Only two features in the read-only capable set affect the layout: Sparse Super
    Blocks and Extra Isize. Sparse super blocks affect which block groups have superblock
    backups. Like 64-bit mode, the Extra Isize feature affects the layout indirectly
    by changing the inode size.


