    # Table 5.5. GUID Partition Table Entry Attributes Format.


    | Bit | Content | Description |

    |---|---|--|

    | 0 | System partition | Must preserve partition as is |

    | 1 | EFI Firmware | Operating system should ignore this partition |

    | 2 | Legacy BIOS boot | Equivalent to 0x80 in MBR |

    | 3-47 | Reserved | Should be zeros |

    | 48-63 | Type specific | Varies by partition type (60=RO, 62=Hidden, 63=No autount
    for Windows) |


    The start and end LBA follow the UUID. Next comes the attributes and then the
    partition name which can be up to 36 characters long. Attribute fields are 64
    bits long. As be seen in Table 5.5, the lowest three bits are used to indicate
    a system partition, firmware partition, and support for legacy boot. System partitions
    are not to be changed and firmware partitions are to be completely ignored by
    operating systems. The meaning of the upper sixteen bits of the attribute field
    depends on the partition type.


