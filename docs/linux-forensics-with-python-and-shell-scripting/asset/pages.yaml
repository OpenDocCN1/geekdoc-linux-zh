- img_proc: true
  md: '# USING DCFLDD


    The United States Department of Defense Computer Forensics Lab developed an enhanced
    version of dd known as dcfldd. This tool adds several forensics features to dd.
    One of the most important features is the ability to calculate hashes on the fly.
    the calculated hashes may be sent to a terminal (default), or both.


    In addition to calculating an overall hash, dcfldd can compute hashes for chunks
    of data (which it calls windows). As of this writing, dcfldd supports the following
    hashing algorithms: MD5, SHA1, SHA256, SHA384, and SHA512. Multiple hash algorithms
    may be used simultaneously with hashes to separate files.


    The general format for using dcfldd to create an image with hashes in a separate
    file is dcfldd if=<subject device> of=<image file> bs=<block size> hash=<algorithm>
    hashwindow=<chunk size> hashlog=<hash file> conv=noerr, sync. For example, to
    create an image of the second hard drive on a system with SHA256 hashes calculated
    every 1GB the correct command would be dcfldd if=/dev/sdb of=sdb.img bs=8k hash=sha256
    hashwindow=1G hashlog=sdb.hashes conv=noerr, sync. If you wanted to calculate
    both SHA256 and MD5 hashes for some reason the command would be dcfldd if=/dev/sdb
    of=sdb.img bs=8k hash=sha256,md5 hashwindow=1G hashlog=sdb.hashes conv=noerr,
    sync. sha256log=sdb.sha256hashes md5log=sdb.md5hashes conv=noerr, sync.


    # HARDWARE WRITE BLOCKING


    You should have some means of assuring that you are not altering the subject''s
    hard drives and/or other media when creating images. The traditional way to do
    this is to use a hardware write blocker. In many cases hardware write blockers
    are protocol (SATA, IDE, SCSI, etc.) specific.


    Hardware write blockers tend to be a little pricey. A cheaper model might cost
    upwards of US$50. Because you might not be able to afford a set of blockers for
    all possible protocols. If you can only afford one blocker I recommend you buy
    a SATA unit as is by the majority of systems will be using. A relatively inexpensive
    blocker is shown in Figure 4.2. If you find yourself doing a lot of Linux response
    in data centers a SCSI unit might be a good choice for a second.'
