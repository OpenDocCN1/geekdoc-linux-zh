    # EXTENDED FILESYSTEM FEATURES


    As previously mentioned, the extended filesystem supports a number of optional
    features. These are grouped into compatible, incompatible, and read-only compatible
    features. Details of these various types of features are presented below.


    You may be wondering why a forensic examiner should care about features. This
    is certainly a fair question. There are a number of reasons why this is relevant
    to forensics. First, features may affect the structure of block groups. Second,
    in this turn affects where data is located. Third, features affect how data is
    stored. For example, depending on the features used some data may be stored in
    nodes versus its usual location in data blocks. Fourth, some features might result
    in a new source of metadata for use in your analysis.


    # Compatible Features


    Compatible features are essentially nice-to-haves. In words, if you support this
    feature, that is great, if not, feel free to mount a filesystem using them as
    readable and writable. While you may mount this filesystem, you should not run
    the fsck (filesystem check) utility against it as you might break things associated
    with these optional features. The compatible features list as of this writing
    is summarized in Table 7.2.


    Table 7.2. Compatible Features.


    | Bit | Name | Description |

    | 0x1 | Dir Prealloc | Directory preallocation |

    | 0x2 | Imagic nodes | Only the Shadow knows |

    | 0x4 | Has Journal | Has a journal (Ext3 and Ext4) |

    | 0x8 | Ext Attr | Supports Extended Attributes |

    | 0x10 | Resize Inode | Has reserved Group Descriptor Table entries for expansion
    |

    | 0x20 | Dir Index | Has directory indices |

    | 0x40 | Lazy BG | Support for uninitialized block groups (not common) |

    | 0x80 | Exclude Inode | Not common |

    | 0x100 | Exclude Bitmap | Not common |

    | 0x200 | Sparse Super2 | If set superblock_bgs points to 2 BG with SB backup
    |'
