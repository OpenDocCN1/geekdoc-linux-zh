    # OBFUSCATION


    There are a number of methods malware authors will use to obfuscate programs.
    The level of sophistication varies widely. One of the most pedestrian ways to
    slow down the reverse engineer is to use a packer. A packer can be utilized to
    compress a binary on disk, and in some cases, speed up the loading process. A
    packer compresses an existing program, and inserts executable code to reverse
    the process and uncompress the program to memory.


    The Ultimate Packer for Executables (UPX) is a very popular cross-platform packer
    available at http://upx.sourceforge.net. If executing the command `grep UPX <file>`
    generates any hits, then you might be dealing with a file packed by UPX. If you
    get a hit, download the UPX package and decompress the file with the -d option.
    The first bytes in a file packed with UPX are shown in Figure 10.38.'
