    # GUID PARTITIONS


    The method of creating partitions is not the only thing showing its age. The Basic
    Input Output System (BIOS) boot process is also quite outdated. Under the BIOS
    boot process an ultramodern 64-bit computer is not started in 64-bit mode. It
    isn’t even started in 32-bit mode. The CPU is forced to regress all the way back
    to 16-bit compatibility mode. In fact, if you examine the boot code in the MBR
    you will discover that it is 16-bit machine code.


    The BIOS boot process has been replaced with the Unified Extensible Firmware Interface
    (UEFI) boot process. UEFI (pronounced ooh-fee) booting allows a computer to start
    in 64-bit mode directly. All 64-bit computers today use UEFI and not BIOS for
    booting, although they support legacy booting from MBR-based drives. This legacy
    support is primarily intended to allow booting from removable media such as DVDs
    and USB drives.


    A new method of specifying partitions was also created to go along with UEFI.
    This new method adds a Globally Unique Identifier (GUID) to each partition. The
    GUIDs are stored in a GUID Partition Table (GPT). The GPT has space for 128 partitions.
    In addition to the primary GPT, there is a secondary GPT stored at the end of
    the disk (highest numbered logical block) to mitigate the chances of bad sectors
    in the GPT rendering a disk unreadable.


    A drive using GUID partitioning begins with a protective MBR. This MBR has a single'
  merge: -1
  pgno: 117
- img_proc: true
  md: 'entry covering the entire disk with a partition type of 0xEE. Legacy systems
    that don''t know how to process a GPT also don''t know what to do with a partition
    of type 0xEE so they will ignore the entire drive. This is preferable to having
    the drive accidentally formatted if it appears empty or unformatted.


    As has been mentioned previously, modern systems use Logical Block Addressing
    (LBA). The protective MBR is stored in LBA0. The primary GPT begins with a header
    in LBA1, followed by GPT entries in LBA2 through LBA34. Each GPT entry requires
    128 bytes. As a result, there are four entries per standard 512 byte block. While
    GPT entries are 128 bytes today, the specification allows for larger entries (with
    size specified in the GPT header) to be used in the future. Blocks are probably
    512 bytes long, but this should not be assumed. The secondary GPT header is stored
    in the last LBA and the secondary GPT entries are stored in the preceding 32 sectors.
    The layout of a GPT-based drive is shown in Figure 5.3.'
