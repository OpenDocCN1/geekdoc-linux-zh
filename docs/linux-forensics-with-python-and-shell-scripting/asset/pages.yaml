- img_proc: true
  md: '| | | | |

    |---|---|---||

    | 0x8 | be32 | h_sequence | Transaction ID for this block |

    | 0xC | be32 | s_blocksize | Journal device size. |

    | 0x10 | be32 | s_maxlen | Total number of blocks in this journal. |

    | 0x14 | be32 | s_first | First block of log information. |

    | 0x18 | be32 | s_sequence | First commit ID expected in log. |

    | 0x1C | be32 | s_start | Number of the start of log. |

    | 0x20 | be32 | s_errno | Error value, as set by jbd2_journal_abort(). |

    | 0x24 | be32 | s_feature_compat | Compatible features. 0x1 = Journal maintains
    checksums |

    | 0x28 | be32 | s_feature_incompat | Incompatible feature set. |

    | 0x2C | be32 | s_feature_ro_compat | Read-only compatible feature set. There
    aren''t any of currently. |

    | 0x30 | u8 | s_uuid[16] | 128-bit uuid for journal. This is compared against
    the copy in the ext4 super block at mount time. |

    | 0x40 | be32 | s_nr_users | Number of files sharing this journal. |

    | 0x44 | be32 | s_dynuper | Location of dynamic super block copy. |

    | 0x48 | be32 | s_max_transaction | Limit of journal blocks per transaction. |

    | 0x4C | be32 | s_max_trans_data | Limit of data blocks per transaction. |

    | 0x50 | u8 | s_checksum_type | Checksum algorithm used for the journal. Probably
    1=crc32 or 4=crc32c. |

    | 0x51 | 0xAB | Padding | 0xAB bytes of padding |

    | 0xFC | be32 | s_checksum | Checksum of the entire superblock, with this field
    set to zero. |

    | 0x100 | u8 | s_users[16*48] | IDs of all files sharing the log. |


    The general format for a transaction in the journal is a descriptor block, followed
    by one or more data or revocation blocks, and a commit block that completes the
    transaction. The descriptor block starts with a header (which is the same as the
    first twelve bytes of the journal superblock) and then has an array of journal
    tags that describe the transaction. Data blocks are normally identical to blocks
    to be written to. Revocation blocks contain a list of blocks that were journaled
    in the past but should longer be journaled in the future. The most common reason
    for a revocation is if a metadata block is changed to a regular file data block.
    The commit block indicates the end of a journal transaction.'
