  md: '# YOU CAN’T GET THERE FROM HERE


    # When tools fail


    I am reminded of a joke concerning a visitor to a large city who asked a local
    for directions. The local responded to the request for directions by saying “You
    can’t get there from here.” Sometimes that is the case when using prepackaged
    tools. They just don’t do exactly what you want and there is no easy way to get
    them to conform to your will.


    Recently in one of my forensics classes at the university where I teach there
    was a technical issue with one of the commercial tools we use. In an attempt to
    salvage the rest of my 75 minute class period I turned to Autopsy. It is far from
    being a bad tool and it has some nice features. One of the things it supports
    is filters. You can filter files by size, type, etc. What you cannot, however,
    combine these filters. This is just one simple example of something that is extremely
    easy with a database, but if you only have prepackaged tools “You can’t get there
    from here.”


    Based on our linear analysis of the subject system from PFE, we know that the
    attack most likely occurred during the month of March. We also saw that the john
    account was used in some way during the attack. As noted earlier in this chapter,
    this account has administrative privileges. We can combine these facts to examine
    only files accessed and modified from March onwards that are owned by john or
    johnn (with user IDs of 1000 and 1001). All that is required is a few additions
    to the where clause in our query we now reads:


    ```

    select accessdate, accstime, filename, permissions,

    username from files, users where files.userid.users.uid

    and modify date(''2015-03-01'') and accessdate

    date(''2015-03-01'') and (files.userid=1000 or

    files.userid=1001) order by accessdate desc, accstime desc;

    ```


    We could have used the tables to match on database, but it is easier to use the
    user IDs and prevents the need for a join with the users table. This query ran
    in 0.13 seconds on my laptop and returned only 480 rows, a reduction of over 867,000
    records. This allows you to eliminate the noise and home in in the relevant information
    such as shown in Figure 6.14 and Figure 6.15.'
