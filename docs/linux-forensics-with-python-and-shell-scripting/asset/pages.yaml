  md: '# CHAPTER


    # 1


    # First Steps


    INFORMATION IN THIS CHAPTER:


    +   * What is forensics?

    * Types of forensics

    * Why Linux forensics?

    * General principles

    * Phases of investigation

    * High-level process

    * Building a toolkit


    A natural question to ask yourself if you are reading a book on Linux forensics:
    What is forensics anyway? If you ask different forensic examiners you are likely
    to receive slightly different answers to this question. According to a recent
    version of the Merriam-Webster dictionary: “Forensic (n) belonging to, used in,
    or suitable to courts of judicature or to public discussion and debate.” Using
    this definition of the word forensic my definition of forensic science is as follows:


    > Forensic science or forensics is the scientific collection of evidence of sufficient
    quality that it is suitable for use in court.


    The key point to keep in mind is that we should be collecting evidence of sufficient
    quality that we can use in court, even if we do not intend to go to court with
    our findings. It is always easier to relax our standards to tighten them later.
    We would also act like scientists, doing everything in a methodical and technically
    sound manner.


    # TYPES OF FORENSICS


    When most people hear the forensics they they think about things they might have
    seen on shows such as CSI. This is what I refer to as physical forensics. Some
    of the commonly encountered areas of physical forensics include fingerprints,
    DNA, ballistics, and blood splatter. One of the fundamental principles of physical
    forensics is Locard''s Transfer (or Exchange) Principle. Locard essentially said
    that if objects interact, they transfer (or exchange) material. For example, if
    you hit something with your car there is often an exchange of paint. As further
    examples, when you touch a surface you may leave fingerprints and you might take
    dirt with your shoes when you leave an area.


    This book covers what I would refer to as digital forensics. Some like the term
    computer'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'forensics, but I prefer digital forensics as it is much broader. We live in
    a world that is increasingly reliant on electronic devices such as smart phones,
    tablets, laptops, and desktop computers. Given the amount of information many
    people store on their phones and other small devices, it is often useful to examine
    those if someone is suspected of some sort of crime. The scope of this book is
    limited to computers (which could be embedded) running a version of Linux.


    There are many specializations within the broader space of digital forensics.
    These include network forensics, data storage forensics, small device forensics,
    computer forensics, and many other areas. Within these specializations there are
    further subdivisions. It is not unusual for forensic examiners to be highly specialized.
    My hope is that by the time you finish this book you will be proficient enough
    with Linux forensics to perform investigations of all but the most advanced attacks
    to Linux systems.


    # WHY LINUX FORENSICS?


    Presumably if you are reading this you see the value in learning Linux forensics.
    The same may not be true of your boss and, however. Here is some ammunition for
    why you might benefit from studying Linux forensics.


    While Linux is not the most common operating system on the desktop, it is present
    in many places. Even in the United States, where Windows tends to dominate the
    desktops, many organizations run Linux in the server room. Linux is the choice
    of many Internet Service Providers (ISP) and large companies such as Google (they
    have their own flavor of Linux). Linux is also extremely popular in development
    organizations.


    Linux is the standard choice for anyone working in information security or forensics.
    As the operating systems "by programmers for programmers," it is very popular
    with black hackers. If you find yourself examining the black hat''s computer,
    it is likely running Linux.


    Many devices around us are running some version of Linux. Whether it is the wireless
    access point that you bought at the local electronics store or the smart temperature
    controller keeping your home comfortable, they are likely Linux under the hood.
    Linux also shares some heritage and functionality with Android and OS X.


    Linux is also a great platform for performing forensics on Windows, OS X, Android
    or other systems. The operating system is rich with free and open source tools
    for forensics on devices running virtually every operating system on the planet.
    If your budget is limited, Linux is definitely the way to go.


    # GENERAL PRINCIPLES


    There are a number of general guiding principles that should be followed when
    practicing forensics. These include maintaining the integrity of evidence, maintaining
    the chain of custody, following standard practice, and fully documenting everything.
    These are discussed in more detail below.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Maintaining Integrity


    It is of the utmost importance that evidence not be altered while it is being
    collected and examined. We are fortunate in digital forensics that we can normally
    make an unlimited number of identical copies of evidence. Those working with physical
    forensics are not so lucky. In fact, in many cases choices must be made when quantities
    of physical evidence are limited as many tests consume evidence.


    The primary method of insuring integrity of digital evidence is hashing. Hashing
    is widely used in computer science as a way of improving performance. A hash function,
    generally speaking, takes an input of variable size and outputs a number of known
    size. Hashing allows for faster searches because computers can compare two numbers
    in one cycle versus iterating over every character in a long string which could
    require hundreds or thousands of cycles clock.


    Using hash functions in your programs can add a little complication more than
    one value can produce the same output. When this happens we say that a collision
    has occurred. Collisions are a complication in our programs, but when we use hashes
    for encryption or integrity checking the possibility of many collisions is unacceptable.
    To minimize the number of collisions we use cryptographic hash functions.


    There are several cryptographic hash functions available. Some people still use
    the Message Digest 5 (MD5) to verify integrity of images. The MD5 algorithm is
    no longer considered to be secure and the Secure Hash Algorithm (SHA) family of
    functions is preferred. The original version is referred to as SHA1 (or just SHA).
    SHA2 is currently the most used variant and we may encounter references to SHA2
    (224 bits), SHA256 (256 bits), SHA384 (384 bits), and SHA512 (512 bits). There
    is a SHA3 algorithm, but its use is not widespread. I normally use SHA256 which
    is a good middle ground offering good performance with low chances of collisions.


    We will discuss the details of hashing in future chapters. For now the high level
    process is follows. First, calculate the hash of the original. Second, create
    an image we will treat as a master copy. Third, calculate the hash of the copy
    and verify that it matches the hash of the original. Fourth, make working copies
    of your master copy. The master copy and original should never be used again.
    When it may seem strange, the hash on working copies should be periodically recalculated
    as a double check that the investigator did not alter the image.


    # Chain of Custody


    Physical evidence is often stored in evidence bags. Evidence bags either incorporate
    a chain of custody form or have such a form attached to them. Each time evidence
    is removed from the bag it is updated with who touched the evidence and what was
    done. The collection of entries on this form make the chain of custody. Essentially
    the chain of custody is a guarantee that the evidence has not been altered and
    has been properly maintained.'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'In the case of digital forensics the chain of custody is still important. While
    we can make unlimited digital copies, we must still maintain the integrity of
    the original. This is also why a master copy should be made that is never used
    for any other purpose than creating copies as it prevents the need to touch the
    original other than for the one-time event of creating the master copy.


    # Standard Practices


    Following standard practices makes your investigation easier. By following a written
    procedure accurately there is less explaining to do you find yourself in court.
    You are also less likely to forget something or make a mistake. Additionally,
    if you follow standard practices there is less documentation that has to be done.
    It is used to be said that “nobody was fired for buying IBM.” Similarly, no forensic
    investigator ever got into trouble using written procedures that conform to industry
    standard practice.


    # Documentation


    When in doubt document. It never hurts to overdue the documentation. As mentioned
    previously, if you follow written procedures you can reference them as opposed
    to repeating them in your notes. Speaking of notes, I recommend handwritten notes
    in a bound notebook with numbered pages. This might sound strange to readers who
    are using computers for everything, but it is much quicker to jot notes onto paper.
    It is also easier to carry a set of handwritten notes to court.


    The bound notebook has other advantages as well. No power is required to view
    these notes. The use of a bound notebook with numbered pages also makes it more
    difficult to alter your notes. Not that you would alter them, but a lawyer might
    not be accusing you of such a thing. If you have difficulty finding a notebook
    with numbered pages you can number them yourself before use.


    If you can work with someone else it is ideal. Pilots routinely use checklists
    to make sure they don''t miss anything. Commercial pilots work in pairs to ensure
    insurance against mistakes. Working with a partner allows you to have a second
    set of eyes, lets you work more quickly, and also makes it even harder to accuse
    you of tampering with evidence. History is replete with examples of people who
    have avoided conviction by accusing someone of evidence and instilling sufficient
    doubt in a jury.


    Few people love to do documentation. This seems to be true a greater extent among
    technical people. There are some tools that can ease the pain of documenting your
    findings that will be discussed in later chapters of this book. An investigation
    is never over until the documentation is finished.


    # PHASES OF INVESTIGATION


    There are three phases to a forensic investigation: evidence preservation, evidence
    searching, and event reconstruction. It is not unusual for there to be some cycling
    between the phases as an investigation proceeds. These phases are described in
    more detail below.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Evidence Preservation and Collection


    Medical professionals have a saying “First do no harm.” For digital forensics
    practitioners our motto should be “Don’t alter the data.” This sounds simple enough.
    In actuality it is a bit more complicated as data is volatile. There is a hierarchy
    of volatility that exists in data found in any system.


    The most volatile data can be found in CPU registers. These registers are high
    speed scratch memory locations. Capturing their contents is next to impossible.
    Fortunately, there is little forensic value in these contents. CPU caches are
    the next level down in terms of volatility. Like registers they are hard to capture
    and also, thankfully, of little forensic value.


    Slightly less volatile than storage in the CPU are buffers in various devices
    such as network cards. Some lowspeed devices use main system memory (RAM) for
    buffering. As data stored in the CPU, this is difficult to capture. anything stored
    in theory or was designed for the target computer.


    System memory is also volatile. Once power has been lost, RAM is cleared. When
    to previously discussed items, system memory is relatively easy to capture. In
    most cases it is not possible to collect the contents of system memory without
    changing memory contents slightly. An exception to this would be hardware-based
    memory collection. Memory acquisition will be discussed in greater detail in a
    later chapter.


    Due to limitations in technology, until recently month of digital forensics was
    focused on “dead analysis” of images from hard drives and other media. Even when
    dealing with nonvolatile media, volatility is still an issue. One of the oldest
    questions in computer security and forensics is whether or not to pull the plug
    on a system you suspect has compromised.


    Pulling the plug can lead to data loss as anything cached for writing to media
    will disappear. On modern journaling filesystems (by far the most common situation
    on Linux systems today) this is less of an issue as the journal can prevent correct
    any corruption. If the system is shut down in the normal manner some malware will
    attempt to cover its tracks or even destroy other data on the system.


    Executing a normal shutdown has the advantage of flushing buffers and caches.
    As previously mentioned, the ordered shutdown is not without possible disadvantages.
    With many things in forensics, the correct answer as to which method is better,
    “it depends.” There are methods of obtaining images of hard drives and other media
    which do not require a system shutdown which further complicates this decision.
    Details of these methods will be presented in future chapters.


    # Evidence Searching


    Thanks to the explosion of storage capacity it becomes harder to locate evidence
    within'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'the sea of data stored in a typical computer with each passing year. Data exists
    at three levels, data, information, and evidence, as shown in Figure 1.1.


    ![](img/7abfab28a493757db3f096946a95ec01_26_0.png)


    FIGURE 1.1


    The data hierarchy.


    As shown in Figure 1.1, the lowest level of data is just raw data. Raw data consists
    of bits, normally organized as bytes, in volatile or non-volatile storage. In
    this category we find things such as raw disk sectors. It can be a challenge to
    use data at this level and on most modern systems there plenty of data out to
    pick through.


    Above raw data we have information. Information consists of raw data with some
    sort of meaning attached to it. For example, an image has more meaning to a human
    than the bits that make up a JPEG file used to store it. Even text files exist
    at this level in our hierarchy. Bringing many bytes of ASCII or Unicode values
    together gives them meaning beyond their collection of bytes.


    At the highest level or hierarchy is evidence. While there may be thousands or
    millions of files (collections of information) it is unlikely that the bulk of
    them have any relevance to an investigation. This leads us to ponder what it means
    for information to be relevant to an investigation.


    As previously mentioned, forensics is a science. Given that we are trying to do
    science, we should be developing hypotheses and searching for information that
    supports or refutes a hypothesis. It is important to remain objective during an
    investigation as the same piece of evidence might be interpreted differently based
    on people''s preconceived notions.


    It is extremely important that investigators do not become victims of confirmation
    bias. Put simply, confirmation bias is only looking at information that supports
    what you'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'believe be true while discounting anything that would refute what you believe.
    Given the amount of data that must be examined in a typical investigation a hypothesis
    or two concerning what you think you will find is good (the owner of the computer
    did X, this computer was successfully exploited, etc.) to help guide you through
    the searching process. Don’t fall into the trap of assuming your hypothesis or
    hypotheses are correct, however.


    # CONFIRMATION BIAS IN ACTION


    # Every Child is Perfect, Just Ask The Parents


    One of the best stories to describe confirmation bias goes as follows. Johnny
    loved magicians. One day his parents took him to see a famous magician, Phil the
    Great. At the end of the day the parents told Phil how much their son loved magic.
    Phil then offered to show them a trick. Johnny eagerly accepted.


    The magician proceeded to pull out a coin and move it back and forth between both
    hands then his fists and held out his hands. He asked Johnny to identify the hand
    containing the coin, which he did. Now guessing correctly once is not much of
    a feat, but this game was repeated many times and each time Johnny correctly guessed
    the hand containing the coin. While this was going on the magician made comments
    like, “You must have excellent vision to see which hand contains the coin,” and
    “You must be an expert on reading my facial expressions and that is how you know
    where the coin is.


    Eventually Johnny had correctly identified the coin fifty times in a row! His
    parents were amazed. They called the grandparents and told all of their friends
    about it on Facebook, Twitter, and other social media sites. When they finally
    thanked the magician and turned to leave, she shouted, “goodbye,” and waved with
    both hands. Each hand contained a coin.


    It was the parents’ confirmation bias that lead them to believe what they wanted
    to believe, that Johnny was a savant, and distracted from the truth, that the
    magician was tricking them. Remain objective during an investigation. Don’t let
    you or your boss want to be keep you from seeing contrary evidence.


    # Reconstruction of Events


    In my trying to reconstruct what happened is the most fun part of an investigation.
    The explosion in size of storage media might make the searching phase longer than
    it was in the past, but that only helps to make the reconstruction phase that
    much more enjoyable. It is very unlikely that you will find all the evidence you
    need for your event reconstruction in one place. It is much common to get little
    pieces of evidence from multiple places which you put together into a larger picture.
    For example, a suspicious process in a process list stored in a memory image might
    lead you to look at files in a'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'filesystem which might lead back to an open file list in the memory image which
    in turn points towards the filesystem image. Putting all of these bits together
    might allow you to determine when and by whom a rootkit was downloaded and when
    by user it was subsequently installed.


    # HIGH-LEVEL PROCESS


    While not every Linux forensic investigation is part of an incident response,
    it will be the focus of this book. The justification for this is that the vast
    majority of Linux forensic investigations are conducted after a suspected breach.
    Additionally, many of the items discussed in this book will be relevant to other
    Linux investigations as well. The high level process for incident response is
    shown in Figure 1.2.


    ![](img/7abfab28a493757db3f096946a95ec01_28_0.png)


    FIGURE 1.2


    As be seen in Figure 1.2, it all begins with a call. Someone believes a breach
    (or something else) has occurred and they have called you to investigate. Your
    next step is to determine whether or not there was a breach. A small amount of
    live analysis might be required in order to make this determination. If no breach
    occurred, you get to document what happened and add this to your knowledge base.


    If there was an incident, you would normally start with live analysis before deciding
    whether or not dead analysis is justified. If you deem it necessary to perform
    the dead analysis you need to acquire some images and actually perform the analysis.
    Whether or not you performed a dead analysis isn''t over until the reports are
    written. All of the steps will be discussed in detail future chapters.


    # BUILDING A TOOLKIT


    In order to do Linux forensics effectively you might want to acquire a few tools.
    When it comes to software tools you are in luck as all of the Linux forensics
    tools are free (most also open source). In addition to the notebook discussed
    previously, some hardware and software should be in every forensic investigator''s
    tool kit.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Hardware


    You will likely want one or more external hard drives for making images (both
    RAM and hard disks). External hard drives are preferred as it is much easier to
    share with other investigators when they can just plug in a drive. USB 3.0 devices
    are the best as they are significantly faster than their USB 2.0 counterparts.


    A write blocker is also helpful whenever an image is to be made of any media.
    Several hardware write blockers are available. Most of these are limited to one
    particular interface. If your budget affords only one hardware write blocker,
    I would recommend a SATA blocker as is the most common interface in use at this
    time. Software write blockers are also a possibility. A simple software write
    blocker is presented later in this book.


    # Software


    Software needs fall into a few categories: forensic tools, system binaries, and
    linux distributions. Ideally these tools are stored on USB 3.0 flash drives and
    perhaps a few DVDs if you are anticipating systems that cannot boot from a USB.
    Given how cheap USB flash drives are today, even investigators with modest budgets
    can be prepared for most situations.


    There are a number of ways to install a set of forensics tools. The easiest method
    is to install a forensics oriented Linux distribution such as SIFT from SANS (http://digital-forensics.sans.org/community/downloads).
    Personally, I prefer to run my favorite Linux and just install the tools rather
    than be stuck with else''s themes and sluggish system performance. The following
    script will install all of the tools found in SIFT on Debian or Ubuntu based systems
    (unlike the SANS install that works only on specific versions of Ubuntu).


    ```

    #!/bin/bash

    # Simple script to load DFIR tools into Ubuntu and Debian

    # by Dr. Phil Polstra @ppolstra

    # create repositories

    echo "deb http://ppa.launchpad.net/sift/stable/ubuntu trusty main" \ \

    > /etc/apt/sources.list.d/sift-ubuntu-stable-utopic.list

    echo "deb http://ppa.launchpad.net/tualatrix/ppa/ubuntu trusty main" \ \

    > /etc/apt/sources.list.d/tualatrix-ubuntu-ppa-utopic.list

    #list of packages

    pkglist+="aeskeyfind

    affflib-tools

    afterterglow

    airrack-ng

    arp-scan

    autopsy

    binlist

    ```'
