- img_proc: true
  md: "```\nshould be placed in the same directory as the Volatility module.c and\
    \ Makefile, which can\nbe found in the tools/linux directory inside of the volatility\
    \ hierarchy. The script follows.\n#!/bin/bash\n# create-profile.sh\n#\n# Simple\
    \ Script to create a makefile for a Volatility profile.\n# Intended to be used\
    \ with an image file.\n# As developed for PentesterAcademy\n# by Dr. Phil Polstra\
    \ (@ppolstra)\nuusage() {\n  echo \"Script to create a Volatility profile from\
    \ a mounted image file\"\n  echo \"Usage: $0 <path to image root>\"\n  exit 1\n\
    }\nif [ $# -lt 1 ]; then\n  usage\nfi\noldir=${1}/boot\ncd \\${oldir}\nnver=$(ls\
    \ System.map* | sed \"s/System.map//\" | tr \"\\n\" \"\\|\" \\\n  | sed -nr 's/\\\
    ([a-zA-Z0-9.\\-]+\\)\\|([a-zA-Z0-9.\\-]+\\)\\$/\\2/p' \\\n  | sed \"s/\\\\n//\"\
    \ncd \\${oldir}\necho \"Version: \\${ver}\"\nPWD=$(pwd)\nMAKE=$(which make)\n\
    cat <<EOF Makefile.\\${ver}\nobj-m += module.o\n-include dwarf version.mk\ndall:\
    \ dwarf\ndwarf: module.c\n  $(MAKE) -C \\${1}/lib/modules/\\${ver}/build \\\n\
    \  CONFIG_DEBUG_INFO=y M=\"\\${PWD}\" > module.dwarf\ndwarfdump -di module.ko\n\
    \  $(MAKE) -C \\${1}/lib/modules/\\${ver}/build M=\"\\${PWD}\" clean\nclean:\n\
    \  $(MAKE) -C \\${1}/lib/modules/\\${ver}/build M=\"\\${PWD}\" clean\n  rm -f\
    \ module.d\nEOF\n```"
