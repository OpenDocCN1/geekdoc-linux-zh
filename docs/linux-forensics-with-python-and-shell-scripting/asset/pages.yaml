- img_proc: true
  md: '# Table 7.3


    | Bit | Name | Description |

    |---|---|---|n| 0x1 | Compression | Filesystem is compressed |

    | 0x2 | Filetype | Directory entries include the file type |

    | 0x4 | Recover | Filesystem needs recovery |

    | 0x8 | Journal Dev | Journal is stored on an external device |

    | 0x10 | Meta BG | Meta block groups are in use |

    | 0x40 | Extents | Filesystem uses extents |

    | 0x80 | 64Bit | Filesystem can be 2*64 blocks (as opposed to 2*32) |

    | 0x100 | MMP | Multiple mount protection |

    | 0x200 | Flex BG | Flexible block groups are in use |

    | 0x400 | EA Inode | Inodes can be used for large extended attributes |

    | 0x1000 | DirData | Data in directory entry |

    | 0x2000 | BG Csum | Block Group meta checksums |

    | 0x4000 | LargeDir | Directories > 2GB or 3-level tree |

    | 0x8000 | Inline Data | Data inline in the inode |

    | 0x10000 | Encrypt | Encrypted inodes are used in this filesystem |


    The Compression feature indicates that certain filesystem components may be compressed.
    Obviously, if your operating system does not support this feature, you will not
    be able to get meaningful data from the volume.


    On extended filesystems the file type is normally stored in the inode with all
    the other metadata. In order to speed up certain operations, the file type may
    also be stored in the directory entry if the Filetype feature is enabled. This
    is done by re-purposing an unused byte in the directory entry. This will be discussed
    in detail later in this chapter.


    The Recover flag indicates that a filesystem needs to be recovered. The journal
    will be consulted during this recovery process. While the journal is normally
    stored on the same media as the filesystem, it may be stored on an external device
    if the Journal Dev feature is enabled. The use of Journal Dev is not terribly
    common, but there are some situations where the performance improvement justifies
    the extra complexity.'
