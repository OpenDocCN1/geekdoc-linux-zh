- img_proc: true
  md: 'The inode structure is summarized in Table 7.5. Most of these fields are self-explanatory.
    Those that are not be described in more detail in this section.


    There are two operating system dependent unions (OSDs) in the inode. These will
    vary from what is described here if your filesystem comes from Hurd or BSD. The
    first OSD for filesystems created by Linux holds the inode version. For extended
    filesystems created by Linux, the second OSD contains the upper 16 bits of several
    values.


    The block array stores thirty-two-bit block addresses. If this was used to directly
    store blocks that make up a file, it would be extremely limiting. For example,
    if 4-kilobyte blocks are used in, files would be limited to 60 kilobytes! This
    is not how this array is used, however the first twelve entries are direct block
    entries which contain the block numbers for the first twelve data blocks (48 KB
    when using 4KB blocks) that make up a file. If more space is required, the thirteenth
    entry has the block number for a singly indirect block. the singly indirect block
    is a data block that contains a list of data blocks that make up a file. If the
    block size is 4 KB the singly indirect block can point to 1024 data blocks. The
    maximum amount that can be stored using singly indirect blocks is then (size of
    a data block) * (number of block addresses that can be stored in a data block)
    or (4 KB) * (1024) which equals 4 megabytes.


    For files too large to be stored with direct blocks and singly indirect blocks
    (48 KB + 4 MB), the fourteenth entry contains the block number for a doubly indirect
    block. the doubly indirect block points to a block that contains a list of singly
    indirect blocks. the doubly indirect blocks can store 1024 times as much as singly
    indirect blocks (again assuming 4 KB blocks) which means that files as large as
    (48 KB + 4 MB + 4 GB) can be accommodated. If this is still not enough space,
    the final entry contains a pointer to triply indirect blocks allowing files as
    large as (48 KB + 4 MB + 4 GB + 4 TB) to be stored. This block system is illustrated
    in Figure 7.20.'
