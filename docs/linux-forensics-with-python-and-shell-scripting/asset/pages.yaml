    # # MINIMIZING DISTURBANCE TO THE SUBJECT SYSTEM


    Unfortunately, it is impossible to collect all the data from a running system
    without causing something to change. Your goal as a forensic investigator should
    be to minimize this disturbance to the subject system. First, there are two things
    you should never do if you can avoid it. If you install anything on the subject
    system it will substantially change the system when configuration files, libraries,
    and executables are saved to the subject''s media. The worst situation would be
    to compile something from source code as it will cause many temporary files to
    be created and also consume memory (possibly pushing out more interesting information)
    and affect a memory image you choose to make one.


    The second thing you should avoid is creating new files on the system. If you
    must use a tool that is not installed, have it on your response USB drive. Don''t
    create memory or disk images and then store them on the subject system either!


    You will definitely alter what is in RAM when you investigate a system. You should
    try to minimize your memory footprint, however. There are a couple of ways that
    you might accomplish these goals. Two popular solutions are to store data on USB
    media (which could be your response drive) or to use the netcat utility.


    # # Using a USB drive to store data


    Attaching a USB drive to the subject system is minimally invasive. This will cause
    some new entries in a few temporary pseudo filesystems as /proc and /sys and the
    creation of a new directory under /media on most versions of Linux. A few larger
    USB 3.0 backup'
  merge: -1
  pgno: 48
- img_proc: true
  md: 'drives should be in your toolkit for such occasions. It might be best to copy
    your system binaries to this drive first you end going up this route to avoid
    having to more than one external drive.


    Once the USB drive has been attached you can use the techniques described earlier
    to operate with known-good system binaries and utilities. Log files and other
    data discussed in this chapter can be stored on the USB drive. Techniques described
    in later chapters can be used to store images on the USB drive. Even if you use
    the netcat utility (described next), having some USB backup drives on hand can
    make sharing images much easier. Naturally, whatever you do should be documented
    in your notebook notebook.


    # Using Netcat


    While using a USB drive meets our goals of not installing anything or creating
    new files on the subject system (with the exceptions noted above) does not minimize
    our memory footprint. Copying to slow storage devices (especially USB 2.0 drives)
    is likely to result in a significant amount of caching which will increase our
    memory footprint. For this reason, the use of netcat is preferred when the subject
    system is connected to a Ethernet of reasonable speed and reliability.


    Wired Gigabit is the most desirable media. If you are forced to use wireless networking,
    your best is to ensure your forensics workstation has a strong signal from the
    access point. If neither of these is option, you may be able to connect your forensics
    laptop directly to the subject system via a crossover cable.


    Realize that the subject system is probably set up to Dynamic Host Configuration
    Protocol (DHCP) which you will need to use static IP addresses on both ends or
    install a DHCP server on your forensics laptop if you use the crossover cable
    route. If the system has only one network interface that may be disconnected I
    recommend against using the crossover cable as it will disturb the system too
    much. To temporarily set a static IP on each end of your crossover cable use the
    command sudo ifconfig {interface} down && sudo ifconfig {interface} {IP} netmask
    {netmask} up,i.e. sudo ifconfig eth0 && sudo ifconfig eth0 192.168.1.1 netmask
    255.255.255.0 up. Make sure you give each a different IP on the same subnet


    # Setting up a netcat listener


    You will need to set up one or more listeners on the forensics workstation. The
    syntax for setting up a listener is pretty simple. Typing netcat -l {port} will
    cause a listener to be created on every network interface on the machine. Normally
    this information should be stored in a file by redirecting netcat''s output using
    or >> Recall the difference between > and is that causes an existing file to be
    overwritten and appends data if the file already exists.


    I recommend that you create a listener on the forensics workstation that receives
    the output of all the commands you wish to run on the subject system in a single
    log file. This keeps everything in one place. By default netcat will terminate
    the listener upon'
