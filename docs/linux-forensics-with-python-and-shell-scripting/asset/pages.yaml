    # # Usingdump to disassemble code


    The `objdump` can be used to get information from an object file. Much of its
    functionality duplicates that of `readelf`. One useful feature not found in `readelf`
    is the ability to disassemble object code (convert from pure machine code to more
    human-readable Assembly). There are two common formats for Assembly code: Intel
    and AT&T. The default is to AT&T syntax, but this can be changed using the “M
    intel” option. The Intel format is better for PC programmers. It is important
    to realize that disassembly with a tool like this is not perfect, as any data
    in the sections normally containing code will be interpreted as machine code instructions.


    The command `objdump -disassemble -M intel xingyi_bindshell` will disassemble
    the sections of the file normally expected to contain code. Partial results from
    running this command are shown in Figure 10.15. snippet shown is part of the main
    method of the program. While a complete Assembly tutorial is out of scope for
    this book, an introduction to the basics can be helpful in understanding this
    code. Assuming the code has not been intentionally obfuscated, only a basic understanding
    of Assembly is required to get the gist of what is going on.


    Assembly language instructions are pretty basic. They mostly consist of moving
    things; simple math addition, subtraction, and multiplication; comparing numbers;
    jumping to new memory addresses; and calling functions. For commands that move
    things, the source and target can be memory locations or high-speed storage areas
    in the CPU called registers.'
  merge: -1
  pgno: 370
- img_proc: true
  md: 'Some of these registers have a special purpose, and the rest are used for performing
    calculations or passing variables to functions. Some of the registers have been
    around since the 16-bit processors of old (8086, 8028), others were added when
    32-bit processors were released (80386), while still others were added when AMD
    released the first 64-bit processors. Standard 64-bit processor registers are
    shown in Figure 10.16. The legacy registers are named based on width. XX, EXE,
    and RXX denote 16-32-, and 64-bit width, respectively. Some-bit can be further
    divided into XH and XL for the high and low bytes, respectively. Using the RAX
    register as an example, AL, EAX, and RAX represent the lowest two, four bytes,
    and all eight bytes of the register, respectively. When viewing Assembly code,
    you will often see different registers used based on need.


    The RIP (or EIP for 32-bit Assembly) register is known as the instruction pointer.
    It points to the address in memory where the next instruction to be run can be
    found. The FLAGS register is used to keep track of status of comparisons, whether
    or not a mathematical operation resulted in a need to carry a bit. The RBP register
    is known as the base pointer, and it points to the base (bottom) of the current
    stack frame. The RSP register is called the stack pointer, and it points to the
    top of the current stack frame. So what is a stack?


    A stack frame is a piece of the stack which is associated with the currently running
    function in a program. So, what then is a stack? The stack is a special memory
    area that grows each time a new function is called via the Assembly CALL instruction
    and shrinks when this function completes. In C and similar languages you will
    hear people about stack variables that are automatically created when declared
    and go away at the end of their code block. These variables are allocated on the
    stack. When you think about what a function is, it is always a code block of some
    type. The local variables for functions are typically allocated on the stack.


    When larger amounts of storage are required or variables need to live beyond a
    single function, variables may be created on the heap. The mechanism for getting
    heap space differs from one programming language to the next. If you look at the
    internals of how the operating system creates heaps and doles out memory to various
    processes, it is actually quite complex.


    When reverse engineering applications in order to find vulnerabilities, the stack
    and heap play a central role in the process. For our purposes it is sufficient
    to understand that the stack is the most common place for functions to store their
    local variables. If you look back at Figure 10.15, you will see that the first
    instruction, `push rbp`, is used to save the current base pointer (bottom of the
    stack). The current stack pointer is moved to the base pointer with the command
    `mov rsp, rsp` (recall that the target is on the left and source on the right
    in Intel notation). On the next line the current value stored in RBX is saved
    by pushing it on the stack. The next line 0x88 is subtracted from the stack pointer
    with the instruction `sub rsp, 0x88`.'
