  md: '![](img/7abfab28a493757db3f096946a95ec01_372_0.png)


    # FIGURE 10.15


    Partial results from disassembling xingyi_bindshell with objdump.


    You might be thinking, "Hold on a stack, why did I subtract to grow the stack?"
    The reason for this is that the stack grows downward (from high memory addresses
    to low memory addresses). By moving the old stack pointer (RSP) to the base pointer
    (RBP), the top of the stack frame becomes the new bottom. Subtracting 0x88 allocates
    88 bytes for the current stack frame. This storage is used by the current function.
    If you look at Figure 10.15, you will see several mov instructions that move value
    into this newly allocated buffer. The destinations for all of these moves are
    memory addresses in the square brackets, which are all of the frame [rbp-<some
    offset>].


    There is also odd instruction, xor eax,eax, among the move instructions. The bitwise-exclusive-OR
    (XOR) operator compares each bit in two numbers, and the corresponding result
    in bit is 1 if either, but not both, of the input values have a 1 in that position.
    The effect of XORing any number with itself is the same as setting number to zero.
    Therefore, xor eax,eax, is the same as mov eax,0x0. Readers who have done any
    shell coding will realize that using XOR is preferred in that as it prevents a
    zero byte (which is interpreted as a NULL in many cases) from being present in
    code you are trying to inject.


    Following the block of move instructions we use a call instruction. In high level
    languages calling a function and passing a bunch of parameters is pretty simple.
    However a convention that dictates how parameters are passed into and out of a
    function. For various technical reasons, multiple calling conventions are used
    based on the type of function being called. 32-bit systems normally pass in parameters
    on the stack (ordered from right to left). 64-bit'
