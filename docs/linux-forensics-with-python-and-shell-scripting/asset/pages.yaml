    # Udev rules


    Udev rules are the new way to control how devices are handled on Linux systems.
    Using the udev rules presented below, a "magic usb hub" can be created that automatically
    mounts any block device connected from the head stream as our rule.


    Linux ships with a set of standard udev rules. Administrators may customize their
    systems by adding their own rules to /etc/udev/rules.d directory. Like many system
    scripts (i.e. startup scripts), the order in which these rules are executed is
    determined by the filename. Standard practice is to start the filename with a
    number which determines when it is loaded.


    When the rules in the file below are run, all of the information required to mount
    a filesystem is not available. For this reason, the rules generates all other
    scripts in two stages. The file should be named /etc/udev/rules.d/10-protectedmount.rules.
    Note that the vendor and product identifiers will be set with an install script
    to match your device. This install script is presented later in this chapter.


    ```

    ACTION="add", SUBSYSTEM="block", KERNEL="sd[1-9]", ATTRS(idVendor)="1a40",

    ATTR(idProduct)="0101", ENV(PHIL_MOUNT)="1", ENV(PHIL_DEV)="%k",

    RUN=/etc/udev/scripts/protromount.sh %k %"

    ACTION="remove", SUBSYSTEM="block", KERNEL="sd?[1-9]",

    ATTR(idVendor)="1a40", ATTRS(idProduct)="0101", ENV(PHIL_UNMOUNT)="1",

    RUN=/etc/udev/scripts/protromount.sh %k %"

    ENV(PHIL_MOUNT)="1", ENV(UDEVIS_AUTOMOUNT_HINT)="never", RUN=/etc/udev/scripts/protromount2-%n.sh"

