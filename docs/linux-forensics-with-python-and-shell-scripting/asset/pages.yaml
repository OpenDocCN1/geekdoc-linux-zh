    # # IMPORTING DATA In MySQL


    Importing our data into a spreadsheet is an easy process. It does suffer when
    it comes to performance if the subject filesize is large, however. There is no
    limitation of this method as well. It is not easy to make a timeline where modification,
    access, and creation times are all presented on a single timeline. You could create
    a body file for you with Autopsy, but I have found that the performance is still
    lacking and this is not nearly flexible as having everything in a proper database.


    If you do not already have MySQL installed on your system, it is quite simple
    to add. For Debian and Ubuntu based systems sudo apt-get install mysql-server
    should be all you need. Once MySQL has been installed you will want to create
    a database. To keep things clean, I recommend you create a new database for each
    case. The command to create a new database is simply mysqladmin -u <user>-p create
    <database name>. For example, if I want to log in the root user (which is not
    necessarily the same as the root user on the system) and create a database for
    case-pfel I would type mysqladmin -u root create case-pfel. The -p option means
    prompt me for a password (passing it in on the command line would be very bad
    security as this could be intercepted easily). The user login information should
    have been set up when MySQL was installed.


    Once a database has been created it is time to add some tables. The easiest way
    to do this is to start the MySQL client using mysql -u <user> -p, i.e. mysql -u
    -p. You are not yet connected to your database. To remedy that situation issue
    the command connect <database> in the MySQL client shell. For example, in my case
    I would type connect case-pfel. Logging in to MySQL and connecting to a database
    is shown in Figure 6.5.'
