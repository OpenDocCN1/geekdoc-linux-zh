  md: "# CREATING A TIMELINE\n\nAs we said previously, making a proper timeline with\
    \ access, modification, and creation times intertwined is not easy with a simple\
    \ spreadsheet. It is quite easily done with our database, however. The shell script\
    \ below (which is primarily just a SQL script) will create a new timeline table\
    \ in the database. The timeline table will allow us to easily and quickly timelines.\n\
    \n```\n#!/bin/bash\n\n# create-timeline.sh\n\n# Simple shell script to create\
    \ a timeline in the database.\n\n# Developed for PentesterAcademy by\n# Dr. Phil\
    \ Polstra (@ppolstra)\nusage () {\n  echo \"usage: <database>\"\n  echo \"Simple\
    \ script to create a timeline in the database\"\n  exit 1\n}\n\nif [ $# -lt 1\
    \ ]; then\n  usage\nfi\n\ncat << EOF | mysql $1 -u root -p\ncreate table timeline\
    \ (\n  Operation char(1),\n  Date date not null,\n  Time time not null,\n  recno\
    \ bigint not null\n);\n\ninsert into timeline (Operation, Date, Time, recno)\n\
    select \"A\", accesdate, accxtime, recno from files;\ninsert into timeline (Operation,\
    \ Date, Time, recno)\nselect \"M\", modifydate, modifytime, recno from files;\n\
    insert into timeline (Operation, Date, Time, recno)\nselect \"C\", created, createtime,\
    \ recno from files;\nEOF\n```\n\nThere is one technique in this script that requires\
    \ explaining as it has not been used so far in this book. The relevant line is\
    \ cat << EOF | mysql $1 -u root -p. This construct will cat (type out) everything\
    \ from the following line until the string after (which is 'EOF' in our case)\
    \ is encountered. All of these lines are piped to mysql"
  merge: -1
  pgno: 167
- img_proc: true
  md: "which is run against the passed in database ($1) with user root who must supply\
    \ a password.\n\nLooking at the SQL in this script we see that a table is created\
    \ that contains a character operation code, date, time, and record number. After\
    \ the table is created three insert statements are executed to insert access,\
    \ modification, and creation timestamps to the table. Note that recno in the timeline\
    \ is the primary key from the files. Note that we have a table with all three\
    \ timestamps, a timeline can be quickly and easily created. This script run under\
    \ two seconds on my laptop.\n\nFor convenience I have created a shell script that\
    \ accepts a database and a starting date and builds a timeline. This script also\
    \ uses the technique that was new in the last script. Note that you can change\
    \ the format string using the str_to_date function in this script if you prefer\
    \ something other than the standard US date format.\n\n```\n#!/bin/bash\n\n# print-timeline.sh\n\
    \n# Simple shell script to print a timeline.\n\n# Developed for PentesterAcademy\
    \ <starting date>\n# Dr. Phil Polstra (@ppolstra)\nuusage () () {\n  echo \"usage:\
    \ $0 <database>\"\n  echo \"Simple script to get timeline from the database\"\n\
    \  exit 1\n}\n\nif [ $# -lt 2 ]; then\n  usage\nfi\n\ncat << EOF | mysql $1 -u\
    \ root -p\nselect Operation, timeline.date, timeline.time,\nfilename, permissions,\
    \ userid, groupid\nfrom files, timeline\nwhere timeline.date >= str_to_date(\"\
    $2\", \"%m/%d/%Y\") and\nfiles.recno = timeline.recno\norder by timeline.date\
    \ desc, timeline.time desc\nEOF\n```\n\nAt this point I should probably remind\
    \ you that the timestamps in our timeline could have been altered by a more sophisticated\
    \ attacker. We will learn how to detect these alterations later in this book.\
    \ Even an attacker who knows to alter these timestamps might miss a few files\
    \ here and there that will give you insight into what has transpired."
