    # INODES


    Now that we have had a little break from theory and are fun with some scripting,
    it is time to get back to learning about the keepers of the metadata, the inodes.
    For ext2 and ext3 filesystems the inodes are 128 bytes long. As of this writing
    the ext4 filesystem use 156 bytes inodes, but it allocates 256 bytes on the disk.
    This extra 100 bytes is for future expansion and may also be used for storage
    as we will see later in this chapter.


    In order to use inodes you must first find. The block group associated with an
    inode is easily calculated using the following formula:


    ```

    block group = ( inode number – 1 ) / (inodes per group)

    ```


    Obviously integer division should be used here as block groups are integers. Once
    the correct block group has been located, the index within the block groups table
    must be calculated. This is easily done with the modulus operator. Recall that
    mod y gives the remainder when performing the integer division x/y. The formula
    for the index is simple:


    ```

    index = (inode number – 1) mod (inodes per group)

    ```


    Finally, the offset into the inode table is given:


    ```

    offset = index * (inode size on disk)

    ```'
