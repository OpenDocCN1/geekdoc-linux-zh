    ENV(UDEVIS_AUTOMOUNT_HINT)="always"

    ENV(PHIL_UNMOUNT)="1", RUN=/etc/udev/scripts/protromount4-%n.sh"

    ```


    The general format for the udev rule is a series of statements separated by commas.
    The first statements, those with double equals ("==="), are matching statements.
    If all of them are matched, the remaining statements are run. These statements
    primarily set'
