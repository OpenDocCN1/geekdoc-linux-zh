  md: '# Recommendations:


    +   - Urgent: Fix the vulnerability in dns-lookup.php

    - Urgent: All users must change passwords to something secure. It is recommended
    that new passwords are verified to not be in rocky.txt password list.

    - Important: Examine the entire website for other vulnerabilities. It is recommended
    that all items on the OWASP Top 10 list (https://www.owasp.org/index.php/Category:OWASP_Top_Ten_Project)
    be checked at a minimum.

    - Recommended: Install Snort or Intrusion Detection System on the new webserver.

    - Recommended: Support the webmaster in his efforts to learn more about security.

    - Recommended: Limit accounts on the webserver to the bare minimum. Several accounts
    on this server appear to be unused (i.e. Sue''s account which was targeted by
    the attacker).

    - Recommended: Periodic review of logs with emphasis on the Apache and MySQL logs.
    The initial breach might have been detected by such a review.

    - Recommended: Periodic penetration tests should be performed. If hiring a penetration
    tester is not economically feasible, at a minimum, the webmaster or other PAS
    employee should become familiar with and use several web vulnerability scanners.


    # SUMMARY


    In this chapter we walked through an attack that was slightly more sophisticated
    than the PFE attack discussed earlier in this book. We found that the same techniques
    could be employed, regardless of the sophistication level of the attacker. Getting
    the full picture of the attacker’s actions required the use of live analysis,
    memory analysis, and filesystem analysis. We were able to research the malware
    installed to discover its functionality. In the next chapter, we will discuss
    how to analyze unknown executables. Our conversation will include determining
    if unknown files are actually malware.'
