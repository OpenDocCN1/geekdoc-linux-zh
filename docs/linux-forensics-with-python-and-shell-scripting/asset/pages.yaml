    Breaking down the disassembly in Figure 10.36, we can see that this function is
    fairly simple. Thirty-two (0x20) bytes of space are allocated on the stack. The
    number of command line parameters and the first parameter are stored in [RBP -
    0x14] and [RBP-0x20], respectively. If the number of command line parameters is
    greater than 1 (recall `print_usage`). The address of the second command line
    argument (located at the start of this list + 0x8 to skip the 8-byte pointer for
    the first argument) is loaded into RDI and validate_ip4_octet. If we did not already
    know that this command parameter was supposed to be an IP address, this code snippet
    would help us figure it out. Again, if the binary was stripped, we would need
    to work a little harder and investigate the function at 0x400AC5 to figure out
    what it does. If this function doesn''t return success, _print_usage.


    Everything is still good, the daemonize function is clear. Once again, if the
    binary has been stripped of this descriptive name, we would have to work bit harder
    and delve into the daemonize function to determine its purpose. We see another
    address referenced to RIP. Here a parameter for `write_pid_to_file` is loaded
    from address 0x6020B8. Running the command `x/s *0x60200b8` reveals this string
    to be `/tmp/xingi_reverse_pid`. This and the remainder of the disassembly may
    be shown in Figure 10.37.'
