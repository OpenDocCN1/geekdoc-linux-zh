  md: '# CHAPTER 7


    # Extended Filesystems


    INFORMATION IN THIS CHAPTER:


    +   * Organization of extended filesystems

    * Superblocks

    * Compatible, incompatible, and read-only features

    * Group descriptors

    * Inodes

    * New features in ext4

    * Using Python to read filesystem structures

    * Using shell scripting to find out of place files

    * Detecting alteration of metadata by an attacker


    # EXTENDED FILESYSTEM BASICS


    Running Linux also has lots of choices. This includes your choice of filesystems.
    That said, some version of the Linux extended filesystem is found on the vast
    majority of Linux systems. These are commonly referred to as extN filesystems,
    where N is in the version (normally 2, 3, or 4). The ext2 filesystem is popular
    for partitions that don''t change often such as boot partitions. Most Linux distributions
    use ext4 by default on general use filesystems as /, /home, /usr, /opt, etc.


    A natural question to ask is what the extended filesystem extended from? The answer
    is the Unix File System (UFS). While the extN family is an extension of UFS, it
    is also a simplification. Some of the features in UFS were no longer relevant
    to modern media, so they were removed to simplify the code and improve performance.
    The extN family is meant to be robust with good performance.


    There is a reason that ext2 is normally reserved for static filesystems. Both
    ext3 and ext4 are journaling filesystems, but ext2 is a non-journaling filesystem.
    What''s a journal? In this context isn''t a chronicle of one''s life occurrences.
    Rather journaling is used to improve performance and reduce the chances of data
    corruption.


    Here is how a journaling filesystem works. Writes to the media are not done immediately,
    rather the requested changes are written to a journal. When a command returns
    it means that either the entire transaction was completed (all of the data was
    written or updated) in which case it

    urn returns success or the filesystem was returned to its previous state if the
    command could not be completed successfully. In the event that the computer was
    not shut down cleanly,'
  merge: -1
  pgno: 187
- img_proc: true
  md: 'the journal can be used to return things to a consistent state. Having a journaling
    filesystem significantly speeds up the filesystem check (fsck) process.


    Extended filesystems store information in blocks which are organized into block
    groups. The blocks are normally 1024, 2048, or 4096 bytes in size. Most media
    are to encounter 512 byte sectors. As a result, blocks are 2, 4, or 8 sectors
    long. For readers familiar with the FAT and NTFS filesystems, a block in Unix
    or Linux is roughly equivalent to a cluster in DOS or Windows. The block is the
    smallest allocation unit for disk space.


    A generic picture of the block groups is shown in Figure 7.1. Keep in mind that
    every element will be present in each block group. We will see later in this chapter
    that the ext4 filesystem is highly customizable. Some elements may be moved or
    eliminated from certain groups to improve performance.


    We will describe each of the elements in Figure 7.1 in detail later this chapter.
    For now, I will provide some basic definitions of these items. The boot block
    is just what it sounds, boot code for the operating system. This might be used
    on a modern system, but it is still required to be there for backward compatibility.
    A superblock describes the filesystem and tells the operating system to find various
    elements (inodes, etc.). Group descriptors describe the layout of each block group.
    Inodes (short for index nodes) contain all the metadata for a file except for
    its name. Data blocks are used to store files and directories. The bitmaps indicate
    which inodes and data blocks are in.


    | Boot Block | Block Group 0 | Block Group N-1 |

    |---|---|---||

    | Super Block (1 block) | Group Descriptors (multiple blocks) | Data Bitmap (1
    block) | Inode Bitmap (1 block) | Inode Table (multiple blocks) | Data Blocks
    (many blocks) |


    # Figure 7.1


    Generic block group structure. Note that some components may be omitted from a
    block group depending on the filesystem version and features.


    The extended filesystems allow for optional features. The features fall into three
    categories: compatible, incompatible, and read-only compatible. If an operating
    system does not support a compatible feature, the filesystem can still be safely
    mounted. Conversely, if an operating system lacks support for an incompatible
    feature, the filesystem should not be mounted. When an operating system provides
    a feature for the read-only compatible list, it is safe to mount the filesystem,
    but only if it is attached as read-only. Something to keep in mind if you ever
    find yourself examining'
  merge: -1
  pgno: 188
- img_proc: true
