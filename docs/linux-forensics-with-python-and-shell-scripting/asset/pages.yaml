- img_proc: true
  md: '# FIGURE 9.26

    Evidence of the installation of two additional rootkits.


    A listing of PHP files in the document root and the start of the index2.php file
    are shown in Figure 9.27. The index2.php claims to be the Poison Shell 1.0 by
    Doddy Hackman. Notice that the timestamp on index2.php is from 2013, unlike some
    of the other pieces of malware discovered so far that didn''t alter the timestamps.


    ![](img/7abfab28a493757db3f096946a95ec01_350_0.png)


    # FIGURE 9.27

    Evidence that the Poison Shell 1.0 has been installed on the subject system.


    We see a hidden directory called ".rk" that is used to store the RK rootkit. Because
    we have the subject''s filesystem mounted, we can use the command <mount point>-type
    d -name .*> to locate all hidden directories. The results of running this command
    against the PAS subject system are shown in Figure 9.28. Note that the ".rk" directory
    is not listed. This directory must have been deleted later. Furthermore, no new
    suspicious directories are found.'
