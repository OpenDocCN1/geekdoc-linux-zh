    # GETTING FILESYSTEM INFORMATION


    The previous, quite lengthy, chapter dealt with filesystems. You might wonder
    why you would use a memory analysis tool to inspect filesystems. There are a couple
    of reasons for doing this. First of all, knowing what filesystems have been mounted
    can be helpful. Secondly, modern Linux systems make use of temporary filesystems
    that go away when the system is shut down. A tool like Volatility may be the only
    way to recover these temporary filesystems.


