  md: '# Table 7.6. Extra inode fields in ext4 filesystems.


    | Offset | Size | Name | Description |

    | 0x80 | 2 | Extra size | How many bytes beyond standard 128 are used |

    | 0x82 | 2 | Checksum | Upper 16 bits of inode checksum |

    | 0x84 | 4 | Ctime extra | Change time extra bits |

    | 0x88 | 4 | Mtime extra | Modify time extra bits |

    | 0x8C | 4 | Atime extra | Access time extra bits |

    | 0x90 | 4 | Crtime | File create time (seconds since epoch) |

    | 0x94 | 4 | Crtime extra | File create time extra bits |

    | 0x98 | 4 | Version hi | Upper 32 bits of version |

    | 0x9C | | Unused | Reserved space for future expansions |


    A word about the extra time bits is in order. Linux facing a serious problem.
    In the year 2038 the 32-bit timestamp will roll over. While that is over decades
    away, a solution is already in place (Hurry for Open Source!). The solution is
    to expand the 32-bit time structure to 64 bits. In order to prevent backward compatibility
    problems the original 32-bit time structure (stored in first 128 bytes of inodes)
    remains unchanged; it is still just seconds since the epoch on January 1, 1970.
    The lower two bits of this extra field are used to extend the 32-seconds counter
    to 34 bits which makes everything good until the year 2446. The upper thirty bits
    of the extra field are used to store nanoseconds.


    This nanosecond accuracy is a dream for forensic investigators. By way of comparison,
    Windows FAT filesystems provide only a second resolution and the latest version
    of NTFS provides accuracy to the nearest 100 nanoseconds. This is another reason
    to use Python and other tools to parse the inodes as standard tools don''t normally
    display the complete timestamp. This high precision timeline analysis easier since
    you do not have to guess what changed first in a two second interval.


    There are a number of special nodes. These are summarized in Table 7.7. Of the
    inodes listed, the root directory (inode 2) and journal (inode 8) are some of
    the more important ones for forensic investigators.'
