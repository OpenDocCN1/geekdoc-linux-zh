  md: '# Determining If There Was an Incident


    INFORMATION IN THIS CHAPTER:


    +   * Opening a case

    * Talking to users

    * Documentation

    * Mounting known-good binaries

    * Minimizing disturbance to the subject process

    * Using scripting to automate the process

    * Collecting volatile data


    # OPENING A CASE


    This chapter will address the highlighted box from our high-level process as shown
    in Figure 2.1. We will come to learn that there is often much involved in determining
    whether or not there was an incident. We will also see that some live response
    may be necessary in order to make this determination.


    ![](img/7abfab28a493757db3f096946a95ec01_42_0.png)


    FIGURE 2.1

    The High-level Investigation Process.'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'Before you do anything else, when you arrive on the scene, you should open
    a case file. This is not as complicated as it sounds. You could literally create
    a folder on your laptop with a case number. What should you use for a case number?
    Whatever you want. You might want a case number that is a year-number or you might
    prefer to use the date for a case number under the assumption that you won''t
    be starting multiple cases on the same day. You could always append a number to
    the date if you had multiple cases in a given day.


    You might also consider starting a new entry in your notebook (with the numbered
    pages). Some might prefer to wait until you were sure there was an incident consuming
    space in your notebooks for a false alarm. My personal feeling on this is that
    notebooks are cheap and it is easier and cleaner if you start taking notes in
    one place from the very beginning.


    # TALKING TO USERS


    Before you ever think about touching the subject system you should interview the
    users. Why? Because they know more about the situation than you. You might be
    able to determine that it was a false alarm very quickly by talking to the users.
    For example, perhaps it was a system administrator that put a network card in
    promiscuous mode and not malware or an attacker. It would be far better for everyone
    if you found this out by talking to the administrator now after hours of investigating.


    You should ask the readers series of questions. The first question you might ask
    is, “Why did you call me?” Was there an event that led to your being called in?
    Does the organization lack a qualified person to perform the investigation? Does
    the organization''s policy on possible incidents require an outside investigator?


    The second question you might ask, “Why do you think there is a problem or incident?”
    Did something strange happen? Is the network andor machine slower than normal?
    Is there traffic on unusual ports? Unlike Windows users, Linux users dont just
    shrug off strange behavior and reboot.


    Next you want to get as much information as you can about the subject (suspected
    victim) system. What is the system normally used for? Where did the system come
    from? As many readers are likely aware, it has come to light that certain government
    entities are not planting parasitic devices inside a computer that has been intercepted
    during shipment. The computer has been repaired recently? If so, by whom? Was
    it an old, trusted friend or someone new? Malicious software and hardware are
    easily installed during such repairs.


    # DOCUMENTATION


    As previously mentioned, you cannot over do the documentation. You should write
    down what you told during your interviews. In addition to the advantages already
    mentioned for using a notebook, writing notes in your notebook is a lot less distracting
    and intimidating for the users than banging away at your laptop keyboard or even
    worse filming the interviews.'
  merge: -1
  pgno: 43
- img_proc: true
  md: 'You should also write down everything you know about the subject system. If
    it seems appropriate you might consider taking a picture of the computer and screen.
    If you suspect that physical security has been breached, it is an especially good
    idea. You are now ready to actually touch the subject system.


    # VIRTUAL COMPLICATIONS


    # If you are using a virtual machine, older may be better


    I have previously recommended the use of a USB 3.0 drive for performance reasons.
    If you are using a virtual machine to practice while you are going through this
    book, a USB 2.0 drive might be preferred. The reason for this is that some of
    the virtualization software seems to have issues dealing with USB 3.0 devices.
    At the time of this writing USB 2.0 devices seem to cause less problems.


    Regardless of the type of drive you have, the host operating systems will initially
    try to lay claim to any attached device. If you are using VirtualBox, you will
    need to check the appropriate device from the USB Devices submenu under Devices
    as shown in Figure 2.2.


    ![](img/7abfab28a493757db3f096946a95ec01_44_0.png)


    FIGURE 2.2


    Selecting a USB drive. If your guest system is running inside a virtual machine
    you will need to pass the device along to the virtual machine by selecting the
    device as shown here.'
  merge: -1
