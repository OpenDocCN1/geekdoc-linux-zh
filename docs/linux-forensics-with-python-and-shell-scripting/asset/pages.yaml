    # Using the GNU Debugger for reverse engineering


    The GNU debugger, gdb, is the standard debugger for Linux programmers. It is very
    powerful. Unfortunately, all this power comes with a bit of a learning curve.
    There are some Graphical User Interface (GUI) front to gdb, but the tool is the
    command line based. I will only hit the highlights in this book. For a full course
    on how to get the most from gdb, I recommend the GNU Debugger Megaprinter at PentesterAcademy.com
    (http://www.pentesteracademy.com/course?id=4).


    Before we get started, I feel point out that gdb was not designed to be used for
    reverse engineering. There are other debuggers tailor made for reverse engineering.
    With pricing that starts in excess of US$1100, IDA Pro is not for the casual reverse
    engineer, however.'
