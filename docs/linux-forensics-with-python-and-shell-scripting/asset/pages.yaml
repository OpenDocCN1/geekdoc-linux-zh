  md: 'using the special construct #!{command to run}. This is often called the "shebang"
    operator or "pound-bang" or "hash-bang". Second, the lines with the echo statements
    add two repositories to our list of software sources. Technically, these repositories
    are intended to be used with Ubuntu 14.04, but they are likely to work with new
    versions of Ubuntu and/or Debian as well.


    Third, a variable named pkglist is created which contains a list of the tools
    we wish to install. Fourth, we update our local application by issuing the command
    apt-get update. Fifth, we iterate over our list of packages stored in pkglist
    and install them if they aren''t already installed. The test involves strings
    of command, dpkg -list | awk ''\{print $2\'''' | grep "^{$pkg}$" >/dev/null. The
    command dpkg-list lists all installed packages and this is then passed to awk
    ''\{print $2}'' which causes the second word (the package name) to be printed;
    this is in turn passed to grep "^{$pkg}$" >/dev/null which checks to see if the
    package matches exactly one that is (the ^ matches the start and matches the end).
    Any errors are sent to the null device because we only care if there were any
    results.


    A set of known system binaries should be installed to a flash drive in order to
    facilitate live response. At a minimum you will want the /bin, /sbin, and /lib
    directories (/lib32 and /lib64 for 64-bit systems) from a known good system. You
    may also want to grab the /usr directory or at least /local/, /usr/bin, and /usr/sbin.
    Most Linux systems you are likely to encounter running 64-bit versions of Linux;
    after all, 64-bit Linux has been commercially available. It might still be worth
    having a 32-bit system on hand.


    On occasion a live Linux system installed on a bootable USB drive could be useful.
    Either a distribution as SIFT can be installed by itself on a drive or the live
    system can be installed on the first partition of a larger USB drive and the system
    binaries can be installed on a second partition. If you are using a USB drive
    with multiple partitions it is important to know that Windows will only see the
    first partition and only if it is formatted as FAT or NTFS. Partitions containing
    system binaries should be formatted as EXT2, EXT3, or EXT4 in order to mount them
    with correct permissions. Details of how to mount these binaries will be provided
    in future chapters.'
