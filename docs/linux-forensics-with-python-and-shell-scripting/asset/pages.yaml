  md: 'I will not provide the internal structures for the journal blocks here for
    a couple of reasons. First, the journal block structures can differ significantly
    based on the version of journaling and selected options. The journal is an internal
    structure that was never meant to be read by humans. Microsoft has released nothing
    publicly about their NTFS journaling internals. The only reason we can know about
    the Linux journaling internals is that it is open source.


    Second, there are filesystem utilities in Linux, such as fsck, that can properly
    read the journal and make any required changes. It is likely a better idea to
    use the built-in utilities than to try and fix a filesystem by hand. If you do
    want to delve into the journaling internals, there is no better source than the
    header and C files themselves. The wiki at kernel.org may also be helpful.


