    # Extended attributes


    The extended filesystem family supports extended attributes. The first use of
    extended attributes was for Access Control Lists (ACLs). While it is certainly
    not uncommon for extended attributes to house ACLs today, they can be used to
    store almost anything as a user attribute if the attribute name begins with “user.”
    Something to keep in mind is that older kernels required the correct set of mounting
    options to be used when ACLs are implemented. This is another reason to capture
    the mount information during your live analysis.


    If the extended attribute is small, it can be stored in the extra space between
    nodes. Currently there are 100 bytes of extra space. Larger extended attributes
    can be stored in a data block pointed to by file acl in the node. An attacker
    might use a user attribute to hide information on a hacked system. This is similar
    to using Alternate Data Streams (ADS) to attach hidden information to a file on
    a NTFS filesystem. There is one important difference between user attributes and
    ADS, there are standard tools for displaying extended attributes on Linux, and
    you do not need to know the exact name to use them, as is the case with ADS.


    Whether stored in nodes or data blocks, in these two cases, however the header
    inside the inode consists of a 4-byte magic number only. The extended attributes
    header structure for attributes stored in the inode and data block are shown in
    Table 7.22 and Table 7.23, respectively.'
  merge: -1
  pgno: 289
