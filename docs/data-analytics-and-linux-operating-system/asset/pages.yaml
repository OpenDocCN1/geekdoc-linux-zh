- pgno: 93
  md: '# Advanced Terminal Concepts


    Mastering Linux comes down to intimate comprehension of the tools available in
    the OS and how to utilize them. Many of the topics discussed in this chapter will
    focus on more tasks and how to accomplish them, or a few QOL improvements to the
    OS in general.


    Compression and decompression of files often confuses Linux beginners. The tools
    are typically already installed, but the command line must be used. Furthermore,
    the strange .tar and .gz file-types are Linux-specific formats that you might
    often come across. All files can be unzipped or zipped with the gzip tool. Preinstalled
    on Ubuntu, we access it with the “tar” command. To compress a folder and the files
    contained within, navigate to it in terminal and type “tar -czvf name.tar.gz foldername”.
    C stands for “create”, z means “compress (gzip)”, v is for “verbose”, and f allows
    filename specification. If you want more compression (but at the cost of time),
    zip the folder with gzip2 by replacing the -z switch with the -j switch instead.


    Now extracting that same archive can be done with “tar -xzvf name.tar.gz”. You
    will notice that the -c was replaced with an -x, and this indicates extraction.
    Once again if you are dealing with bzip2 files use the -j switch instead.


    Continuing with advanced terminal concepts, let us talk about a few quality tips
    and tricks that can save you time in the terminal. When typing a command or file
    name, press tab halfway through. This feature, tab completion, will guess what
    you are attempting to type and fill in the rest of the phrase. For files it will
    complete the name as shown in the directory, or complete a command by considering
    what you are trying to do. Linux experts and anyone that has to use the terminal
    regularly may seem as though they are typing exactly what they want with extreme
    accuracy and speed, but they are actually just using tab completion.'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'Users, especially administrators, will spend a decent amount of time with the
    sudo command because their instructions require elevated privileges to run. But
    when typing out a long command and forgetting to type sudo, you will be angered
    at having to type it again. Instead simply type “sudo !!”, shorthand for “super
    user do again”. It generously saves from typing an entire command again.


    Another method of repeating commands is to use the up and down arrows. Pressing
    up continuously cycles through previously typed commands. You can also edit the
    commands with the left and right arrows to change the text contained within.


    And the most requested terminal tip involves copy and pasting. Attempting to paste
    a line into the terminal results in the strange character ^v. The keyboard shortcut
    is not configured to work in the terminal, and that is why the strange combination
    is displayed. To actually paste, right click and select the option; or use the
    key combination shift+insert. Copy in the same way, but with ctrl+insert instead.
    While it might be okay to copy and paste terminal commands from the Internet (provided
    you understand the risk and know what they are doing in the command), do not try
    to paste from this publication. The formatting introduced through the medium in
    which you are reading it might have inserted special characters that are not recognized
    by the terminal, so it is best if you do not copy and paste, but rather you should
    type manually any commands presented.


    Linux has a hidden feature that not many users know about. Files are displayed
    to the user when you visit that directory or type ls, but actually not all of
    the files are viewable this way. In Linux if you name a file with a period as
    the first character it will be marked as hidden. Hidden files are not normally
    visible by common users, and it acts as a way to protect configuration files from
    accidental editing/deleting/so forth. To see those files, we only need to add
    the -a tag to our ls search. In the GUI press ctrl+h in a directory to reveal
    the secret content. And as you create scripts and other configuration files consider
    hiding them with the period as a form of user protection.


    Any command within terminal can be interrupted or quit with the ctrl+d key combination.
    Use it to stop a lengthy process or to exit out of a program/command that you
    do not understand.'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'Aliasing is a way to create your own personal shortcuts within the terminal.
    Instead of typing a long command or a bunch of smaller commands aliases can be
    used to combine them into a single user defined option. Just as the name implies,
    aliases are different names for anything you specify. Every alias is contained
    within a hidden config file- begin editing it with “nano ~/.bashrc”. Because it
    exists within the user’s home directory every alias will be pertinent only to
    that user. At the bottom of the file we can begin creating alias as per the following
    example:


    ```

    alias gohome=''cd ~ && ls''

    ```


    This alias will change the directory to home and display the contents by typing
    “gohome”. When creating aliases you must follow the formatting presented above
    exactly, meaning there is no space between the command and the equal sign. Multiple
    commands are strung together inside the single quotes separated by “&&”. For more
    robust aliases, add a function instead. The following example combines cd and
    ls into a single command.


    ```

    function cdls () {


    cd "$@" && ls

    }

    ```


    After writing your aliases, save the file and restart the computer. Your new commands
    are then available for use.


    That file we edit ,bashrc, is the configuration file for the Ubuntu terminal.
    Besides making'
