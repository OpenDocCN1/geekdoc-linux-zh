- pgno: 19
  md: '# # Chapter 3 The Benefits and Challenges of Data Management


    Long ago and far away the business owner would look at a new product, listen to
    the sales presentation from the jobber, and decide upon whether to purchase the
    product based on their "gut" intuition. Just like the general store with a post
    office and gas station, those days are gone.


    This is the age of information. Businesses must keep current with trends, market
    dynamics, consumer preferences, and economic pressures to make the appropriate
    decisions regarding their presence in the marketplace. The enormous amount of
    information that is available requires educated persons that are comfortable and
    accurate in interpreting the data provided.


    Case Western Reserve University in Cleveland has recently announced there will
    soon be a shortage of 190,000 analytics personnel and over 1.5 million data managers.
    This problem will mostly affect the small and medium sized businesses that cannot
    afford to hire a personal data analyst on a shoestring budget.


    The demand for Information Technology Project Managers with big data skills increased
    by 123.6% last year, and big data skilled Computer Systems Analysts increased
    89.8%, according to Forbes Magazine.


    *(source: http://www.forbes.com/sites/louiscolombus/2014/12/29/where-big-data-jobs-will-be-in-2015/#2cqed00404a)*


    Even when a business has access to data analytics there are still challenges for
    the business besides how to use the information provided. One of these challenges
    is Data Management.


    Data management is the organizational management of the data and gathered information
    for security, limited access, and storage issues. Tasks that the data management
    requires include governance policies, database management systems, integration
    of data systems, data security, source identification, segregation of data and
    storage issues.


    # ## Keys to Effective Data Management'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'Data management issues are not a new dilemma. As long as data has been collected
    the businesses have been dealing with the problematic issue of keeping data pristine.
    Now, with the increase in data and marketing automation, data security has moved
    to the pinnacle of the problem areas.


    If data isn''t clean or relevant, it is of no use to the marketing and business
    primary officers. Data management requires constant surveillance as hackers are
    waiting to scoop up and destroy millions of relevant information and resources.
    There are few things that should be automatic for security issues with data, such
    as:


    +   1. **Limit Access**


    Many times the access to materials and information is wide open to all employees
    to modify. Office managers, sales personnel, and office staff should not have
    the ability to enter the database and change, access or delete and add information.
    The best way to control this situation is to establish boundaries, or limited
    access.


    Set controls based on specific functions, such as marketing personnel are limited
    to viewing market data, but not to editing. Determine which person in the organization
    will do all the data changes including additions/deletions and actions (such as
    changing contact information for the client). Establish data import and export
    rules so that secured data is not flying out the door and so that viruses are
    not being uploaded. Create a master list of data so that information is neither
    duplicated nor compromised.


    +   2. **Create a Data Map**


    A data map is a flow chart data the route of data, delineating the intake and
    output, the departmental integration, and the use for each data entry. Data mapping
    is an ongoing exercise that maintains controls and data consistency.


    +   3. **Organize your Data in Segments**'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'Data is not about quantity but instead about quality. It does no good to have
    millions of names in the database if your clientele is in the hundreds. It is
    not helpful to have hundreds of names in the database if you have no organization
    for retrieval.


    Instead, separate the data by your needs. Examples could be by sex, age, address
    demographics, zip code, contact preferences, etc. Correctly segmenting the database
    can make the data come alive with potential whereas a disordered database will
    look and feel like chaos.


    Begin with your current active customer base. Segment them into demographics and
    then by purchasing habits. Connect with your customers on a regular basis to glean
    their input on your products and services.


    # 4. Data Hygiene


    Data hygiene is the process of keeping data clean and current. Old data and corrupted
    data will only clutter your database and possibly even infect all of your records.
    Just like the previous functions, hygiene should be provided on a regular basis
    to ensure the data is not decayed or contaminated.


    The importance of maintaining a pristine and organized database cannot not be
    overlooked. If the data isn''t good, all the contacts and marketing projects will
    not succeed if they are addressed to the wrong contact point. To enhance the value
    of your database for marketing and sales endeavors, do not neglect database management.'
  merge: -1
  img_proc: true
