    The terms for Big Data are many; this section of the book identifies the most
    useful terminology when addressing the logistics of big data.


    **Data management.** Data management is the process of placing restrictions on
    the access and quality of data that flows in and through and out of an organization.
    Restrictions may include limited access, security measures to prevent viruses
    and corrupted data, and maintenance issues.


    **Data mining.** Data mining is the process of sifting through the data to extract
    patterns and relevant information to solve the current issues in the business.
    Using software, data mining will take all the chaos out of the voluminous data.


    **Hadoop.** This is open source software (meaning it''s free!) to store data and
    run discriminating applications on commodity hardware. It is key to sifting the
    multiples of data information that is bombarding the data sets. It is known for
    the speed for which it processes data.


    **In-memory analytics.** By investigating information from framework memory (rather
    than from your hard plate drive), you can get prompt bits of knowledge from your
    information and follow up on them rapidly. This innovation can expel information
    prep and investigative handling latencies to test new situations and make models;
    it''s not just a simple route for businesses to stay agile and settle on better
    business choices, it likewise empowers them to run iterative and intelligent examination
    situations.


    **Predictive analytics.** Predictive analytics uses, statistical algorithms, machine-learning
    techniques and data to identify the predictive outcomes based on previous patterns
    of usage. It''s about giving a best evaluation on what will happen later, so businesses
    can feel more assured that they''re settling on the best business choice. The
    most common and basic utilizitions of predictive analytics incoroperate misrepresentation
    and fraud, risk management, operations management and marketing functions.'
  merge: -1
  img_proc: true
