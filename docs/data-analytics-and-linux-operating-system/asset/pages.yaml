- pgno: 88
  md: '# **Security Protocols**


    Linux has a focus on security in general, which contributes to its use in corporate
    and server settings. Taking advantage of the security protocols means that you
    are more secure than other operating systems and less likely to have your computer
    compromised. This requires good security principals, of course, and always being
    safe online. A computer without a password is hardly protected at all.


    One feature brought over from UNIX is file permissions. Every file has a set of
    permission- the owner, group, and rights. The command “chown” changes the owner
    of a file, “chgrp” changes the group, and “chmod” changes the rights associated
    with the file. Discovering the permissions of a file or folder is done by typing
    “ls -l filename”. It will return an initially confusing line such as “- rw- rw-
    r--”. “R” means read, “W” stands for write, and the third option is “X” for execute.
    The three sets are respectively owner, group, and other. So our example file above
    has read and write permissions set for the owner and its group, but only read
    permissions for other users. This means that the owner and the group he belongs
    to (most likely sudo users) have permission to both access the file and change
    its contents, but other users on the network or PC can only view the contents
    and not edit it. Script files will need to have the X in order to be executed,
    and without it they cannot be run.


    Most people will only need to use the “chmod” command to change the permissions
    of files they wish to use. We use the command and a set of numbers to set the
    permission of the file. “chmod 777 test.sh” makes the file readable, writable,
    and executable by all users anywhere because each specification (owner, group,
    other) has the number 7 attached to it. Numbers determine the permissions that
    entity has, and the number used is calculated like so:


    +   - Start with the number 0.

    +   - Add 4 for adding readability.

    +   - Add 2 for write-ability.'
  merge: -1
  img_proc: true
- pgno: 89
  md: "+   - Add 1 for executable-ness.\n+   \n+   - The number you have left determines\
    \ the permissions.\n\n6 would be read/write, but 1 would only be executable. 5\
    \ would be readable and executable, but not changeable. In our 777 example, we\
    \ set owner, group, and others to all be 7. This is not particularly good security,\
    \ because that means anybody anywhere can mess with that file. A more conservative\
    \ permission set would be 775. Use security permissions advantageously for secure\
    \ computing.\n\nSecurity within Linux expands beyond just permissions. Ensure\
    \ that you practice good security practices, and that you are following common\
    \ sense in regards to security- install only needed programs, do not follow all\
    \ internet advice, do not use sudo too often, use passwords, use encrypted networks,\
    \ keep software up to date, encrypt important files, and make regular backups.\
    \ As a final word of advice, look into using a distribution with SELinux, a module\
    \ that supports AC and other security policies."
  merge: -1
