- pgno: 99
  md: '# ## More Linux Information


    To continue learning about Linux and the possibilities it can provide, consider
    the examples in this section. It will briefly discuss more uses for Linux, and
    a few other concepts that have yet to be talked about.


    The “Linux file system” refers to the main layout of the files and folders on
    your computer. If you continue to “cd ..” in the terminal, or if you click the
    back button on the GUI until it goes no further you will stumble upon the “root”
    directory. The folders here, bin, boot, etc, usr, and so on are how your hardware
    and settings are configured. Each folder has a specific purpose and use, and you
    can understand them by exploring the contents. As an example, user data is stored
    in home, but user programs are stored in usr. Because of how diverse and complicated
    the file system actually is it will not be discussed here, but if you wish to
    learn more do an Internet search or read the documentation associated with your
    operating system.


    Linux systems are often used for purposes other than desktop use. Dedicated machines
    run variants of Linux because of the power and stability it provides. Even our
    cars have a Linux kernel running to keep track of error codes and help mechanics.


    Servers often have Linux installed because of reliability and the functions the
    distributions have within them. For instance, Linux machines are used as firewalls
    because the “iptables” application provides excellent port blocking and intelligent
    filtering. You yourself can run a firewall on your system with the application
    as well, thus gaining business-level software for free. In this way, Linux is
    also great for networking. The machine can act as a switch, router, DNS server,
    DHCP server, and more just by installing the relevant applications.'
  merge: -1
  img_proc: true
