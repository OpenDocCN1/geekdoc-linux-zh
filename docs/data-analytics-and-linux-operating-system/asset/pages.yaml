- pgno: 74
  md: '# The Command Line / Terminal


    Before modern computers, hardware and software were interfaced by using keyboards
    exclusively. The mouse brought graphical interfaces and simplified the process,
    but many functions remained text-only as to not present complicated options to
    end users. In Linux, this process continues today. There exists the GUI that is
    present on most distributions, but every Linux distro also has a built-in text-based
    interface as well, from which powerful commands can be typed and executed. Think
    of the terminal as a much more powerful command prompt, because you can completely
    use your computer exclusively through the terminal alone. With enough knowledge,
    a user can actually browse the Internet, install programs, manage their file system,
    and more through text.


    Begin the terminal by launching it from dash or by using the Ctrl+Alt+T keyboard
    shortcut. A purple window will open and wait for your input. You can type a command
    and press enter to activate it. For our first command, enter “ls”. This is short
    for list, and it will display all of the files within our current directory. You
    will be able to see the files and folders in Home, Ubuntu’s main user folder.
    If you are lost, you can always type in “pwd” to print the working directory and
    display the name of the folder you are currently browsing. As you learn commands,
    it helps to write them down as to better internalize their use.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# ## Managing Directories


    Directories, another name for folders, work the same as they do in other operating
    systems. Folders hold files, and you must be currently accessing a directory in
    order to interact with the files inside of it. You can use the terminal command
    "cd" to change directory and move about the file system. As an example, typing
    "cd Desktop" from the Home folder will transfer you to that folder. Now using
    "ls" will not show anything (unless you added files to the desktop). To back out,
    type "cd ..". Practice navigating around the file system in this fashion; cd into
    a directory and ls to view the files.


    Because you are typing commands, Linux expects your input to be exact. If you
    misspell a command it will simply not work, and if you type a folder or file incorrectly
    it will try to reference something that does not exist. Watch your input carefully
    when using the terminal.


    Opening a file is done with a different command –“./”. The period is used to start
    the specified file, so if you were attempting to open a picture it could be done
    like so: "/.house.png". Both the period and the slash are necessary, as it denotes
    that you are running a file within the current directory. When you run a file
    it will be opened with the default application assigned to the file type, so in
    the case of a picture it will most likely be opened in an image viewer.


    You can also create and remove directories and files through terminal as well.
    For this example navigate to the Home directory. As a shortcut you can type "cd
    ~" to change the directory to your Home, because the tilde key is short for "the
    current user’s home". Make a directory with the "mkdir" command; type, "mkdir
    Programming" to create a new folder with that title. You can CD into it, or you
    can go to the GUI and enter it to prove that you have indeed created a new folder.
    Now remove that directory by going Home and typing "rmdir Programming". Without
    hesitation, Linux will remove the specified directory. Similarly, using "rm" will
    remove the specified file.'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'Linux has a design philosophy that many users are not used to. In Windows and
    OSX, the OS will almost always double check that you want to commence with an
    action such as deleting a file or uninstalling a program. Linux distributions
    believe that if you are imitating an event, you definitely mean to follow through
    with it. It will not typically confirm deleting something, nor will it display
    any confirmation messages (file successfully deleted). Rather, the absence of
    a message indicates the process completed successfully. While the philosophy is
    somewhat dangerous (because you could potentially ruin your OS installation without
    warning), it serves as a design contrast to other operating systems. Linux gives
    you complete control, and it never tries to hide anything or obscure options because
    they might be too complicated. It takes some time to get used to, but most users
    agree it is a welcome change to be respected by the technology they own.


    This does not compromise security, however, because any critical action requires
    the “sudo” command as a prefix. Sudo stands for “super user do”, meaning that
    the user of the highest permissions is requesting the following command. Any sudo
    entry will require an administrator password, so malicious software or un-intending
    keyboard spammers cannot accidentally do damage without knowing the password first.
    A lot of the commands we use in this book require sudo permissions, so if the
    command fails to complete with a message explaining it does not have enough permissions
    you can retry with sudo.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# Apt


    Learning the terminal opens up computer functions that are not available through
    the GUI. Also, you can shorten the amount of time it takes to do many things by
    typing it instead. Take, for instance, the amount of work required installing
    a program. If you wanted to download the Google Chromium browser, you would have
    to open the software center, type in the name of the program, locate the correct
    package, mark it for installation, and execute the action. Compare that to typing
    "sudo apt-get install chromium-browser" into the terminal. With that one command,
    Ubuntu will save you many minutes.


    Apt (advanced packaging tool) is the command associated with managing applications
    in Ubuntu. Other distributions may use their own tool, but apt is commonly used
    for its large repositories and simple commands. Packages are installed with the
    "apt-get install" formatting, where you specify the name of the program you wish
    to install. In the example above we specify the Chromium program with the package
    name "chromium-browser". Given that you do not know every package name, there
    is another command "apt-cache search" that can be used to locate package names
    matching the supplied string. So "apt-cache search chromium" would show "chromium-browser",
    and you could specify the correct name to install.


    The usefulness of apt extends beyond that, as you can use it to update every single
    application on your system with a few commands. Use "apt-get update" to refresh
    the repository, then use "apt-get upgrade" to have every application upgrade itself
    to the newest version. Windows OS users should be envious of this easy process,
    because updating a Windows programs requires uninstalling and reinstalling with
    the newest version.


    As time goes by, you might need to update the Ubuntu version. Every year there
    is a new release, and it can be installed with "apt-get dist-upgrade". Staying
    up to date with the newest fixes and additions ensures your Linux system will
    be working healthy for a long time. You might have even noticed that installing
    and updating the system does not require a reboot; a feature that contributes
    to Linux computer’s lengthy uptimes and stability. Lastly, removing an application
    is done with "apt-get remove" followed by the package name.'
  merge: -1
  img_proc: true
