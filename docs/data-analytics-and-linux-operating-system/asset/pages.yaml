  md: '# Chapter 11 How Data Analytics Can Sustain any Business


    The Age of Analytics has dawned and the Age of Aquarius has moved on. Organizations
    that collect, interpret, and act on the raw data they derive can change to the
    rapidly moving marketplace, and stay well ahead of the competition.


    To use the data correctly and quickly, analyzing the data with these tools will
    bring clarity and innovative suggestions.


    Begin with **Measuring**, determines which analytics will be most helpful for
    decision making within the firm.


    **Diagnose** the problems that have occurred with customer satisfaction or product
    placement. Why has something happened in an adverse way? Data analytics can help
    you locate the specific issue for a satisfying solution.


    **Predict and Optimize** to forecast changes and the potential consequences of
    the change. Use the "if"..."then" method of questioning. (If I make this change
    with customer service how can I then anticipate the reaction?) This analytical
    technique helps to determine the direction of the organization and the best route
    to sustain continued growth.


    **Operationalize**, or placing the information into use by the front-line workers,
    sales staff, engineers, marketers, managers and the remaining decision makers.
    This is the transition from analysis to usefulness, leaving the laboratory and
    moving into real-world experience.


    **Automation** is when the business managers use real-time information to make
    immediate changes in the organization. For example, in a grocery industry, couponing
    is a big money maker for both the customer and the grocer. The grocer moves the
    product but is reimbursed by the couponing agency, along with a processing fee
    based on the value of the coupon. The customer receives the product at a reduced
    price, and the product is usually a newly introduced item that would be considered
    a luxury item in a depressed economy. What happens, though, when the customer
    takes advantage of the retailer by purchasing all of the shelf stock of the product,
    leaving none for the following customers and creating an environment of disgruntled
    customers? The store manager immediately assesses the situation and applies a
    "3 coupons only per transaction" rule. Now the customer can still purchase the
    item but very few want to leave the checkout to make more than one transaction.
    The retail grocer has used automation to analyze the'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'problem and create an immediate solution.


    The last stage of implementation is **transformation**, when the business moves
    to a data-driven corporate culture, making business decisions based on current
    analytics instead of tradition or gut instinct.


    # *How You Can Collect Data for Analysis Today*


    +   1.  Establish a digital presence that both gives and receives information.
    Before you can collect data you need a way like a social media outlet and an interactive
    website.


    +   2.  Remember your goal is to receive, sort, and address the data you have
    collected from as many sources as possible, as quickly as possible so the data
    won’t be stale or even unreliable. The more data you collect the more accurate
    your findings will be.


    +   3.  Focus on the questions that need answers. It will be tempting to read
    and ponder everything, but that will defeat the purpose of collecting the data.
    Keeping the questions at the forefront of your mind will help you mine the customer
    intelligence for the necessary information to change your business practices into
    a positive spin.


    +   4.  Engage with your customers through social media. Don’t assume you know
    what they want. Give them plenty of opportunities to push the like button. This
    valuable button will target the customers’ wants and needs much better than a
    formal questionnaire.


    +   5.  Use Google Analytics and Alex to determine relevant information regarding
    your client base. They have easy-to-understand statistics on website traffic and
    SEO rankings. Use this information to cater to your clientele. Just changing a
    few keywords on your site can increase your traffic and move you to number one
    in the Google search engine, a prime place for attracting new customers and readers.'
  merge: -1
  img_proc: true
