    \n服务器通常安装 Linux，因为它的可靠性以及发行版中包含的功能。例如，Linux 机器被用作防火墙，因为“iptables”应用程序提供了出色的端口阻止和智能过滤。你自己也可以在系统上使用该应用程序运行防火墙，从而免费获得企业级软件。以此方式，Linux\
    \ 也非常适合网络管理。只需安装相关应用程序，该机器就可以充当交换机、路由器、DNS 服务器、DHCP 服务器等。\n\n最后，Linux 系统并不局限于我们目前看到的界面。每个发行版都有其首选的桌面环境，但界面可以根据个人偏好进行极其个性化的定制。甚至还有终端用的文件和网页浏览器，这对使用\
    \ SSH 或远程计算的人非常有帮助。总而言之，你应该尝试通过安装并根据自己的喜好配置不同的桌面环境（DE）。\n\n## 接下来做什么与总结\n\n你如何继续取决于你想用你的\
    \ Linux 发行版做什么。对于日常浏览和简单使用，请继续使用 Ubuntu 并安装你所需的程序。对于更具冒险精神的人，考虑安装新的发行版以查看每个发行版提供什么。那些希望更深入地了解\
    \ Linux 的人可以安装 Arch 或 DSL 等发行版，从零开始构建自己独特的操作系统。管理员和高级用户可以安装某个发行版的服务器版本来构建自己的 Linux\
    \ 网络，或者他们可以考虑将其环境从其他操作系统更改为完全免费的操作系统。\n\n总之，Linux 是一组强大且相对易于使用的操作系统。但其真正的潜力来自于难以掌握的终端和命令行功能。感谢你阅读这份出版物，希望它能对这一事实上的替代操作系统这一神秘主题提供一些见解。如果\
    \ Linux 让你感到困惑或未能达到预期，我恳请你再次审视它所能提供的功能。虽然它可能没有同等质量的 games 或第三方专有软件，但该操作系统足够简单且可定制，可以作为主要操作系统使用，而\
    \ Windows 或 OSX 可以作为次要操作系统。几乎每个程序都有替代品，因此如果有可能完全摆脱微软和苹果，强烈建议你这样做。再次感谢，并好好利用你新学到的\
    \ Linux 知识。\n\n## 相关标题\n\n- 黑客大学：新生版 如何成为业余黑客的必备新手指南\n\n  ![](img/b4564831f9e4aeede0c6ec7987331942_102_0.png)\n\
