    ## 安装 Linux


    在桌面上，你会看到一个“安装 Ubuntu 16.04 LTS”的图标。双击它将启动一个使安装过程非常简便的应用程序。如果你尚未连接到互联网，请现在通过插入以太网线或点击右上角图标连接
    Wi-Fi 来完成连接。选择你的语言并点击“继续”。下一个提示框将询问你是否希望在操作系统安装期间下载更新并安装第三方软件。对于初学者来说，这些选项非常推荐，因此请勾选它们并点击“继续”。


    该应用程序将切换到另一个屏幕，询问你的安装方式。这里有多种选项，例如彻底擦除磁盘、与主要操作系统并行安装，或更新旧版本的 Linux。请选择最适合你的选项。如果你仍然对完全切换到
    Linux 犹豫不决，可以选择将 Ubuntu 安装为你的次要操作系统。该选项允许你在 BIOS 界面后选择要启动哪个操作系统。无论如何，请选择你的选项并点击“立即安装”。


    在 Ubuntu 安装过程中，你可以指定一些其他选项，例如时区、计算机名称、账户名和密码。整个安装过程不会花太长时间，但时间足够长，因此如果你的电脑是笔记本电脑，应确保其已插上电源。完成后，操作系统将需要重启。恭喜你，你的计算机现在已拥有一个可用的
    Linux 系统。在接下来的章节中，我们将重点介绍 Linux 概念、如何执行特定任务以及如何进一步扩展你对系统的知识。


    ## 管理硬件和软件


    在 Linux 中，硬件的管理实际上比在 Windows 中更容易。你无需为设备下载单独的驱动程序，因为大多数驱动程序已内置于操作系统本身中。这意味着大多数流行设备可以直接安装，无需额外步骤即可使用。打印机、网络、硬盘以及其他常用设备均已包含在内——在
    Linux 上通常无需折腾驱动程序。


    然而，强大的显卡和其他特定硬件需要该公司的专有驱动程序才能发挥最大效能。这是因为虽然你的显卡默认可以与 Linux 协作，但其内部秘密且往往隐藏的技术只有通过该公司的软件才能被充分利用。在
    Ubuntu 上，这个过程很直接——打开“附加驱动程序”应用程序，让操作系统为你搜索。在确定你拥有哪些设备后，它会询问你要使用哪个版本的驱动程序。按照屏幕提示启用第三方驱动程序。对于未显示的设备，请在制造商网站上进行互联网搜索，以确定他们是否发布了你可以下载的特定
    Linux 驱动程序。


    软件是 Linux 优于 Windows 的另一个方面。就像苹果电脑一样，Ubuntu 拥有某种应用商店，你可以从中搜索与你的设备兼容的应用程序库，只需几次点击即可下载和安装。只需从
    Dash（快速启动栏）中搜索“Ubuntu 软件中心”即可打开该应用程序。在那里，你可以浏览诸如“游戏”、“办公”或“系统”等单个类别以查看程序列表，也可以直接按名称搜索。找到程序后，点击它，然后点击“安装”以排队下载。验证身份后，软件将自动下载并安装。之后，你可以通过在
    Dash 中搜索该应用程序来运行它。


    通过终端安装软件是另一种可用方法，但我们稍后会讨论这一点。Ubuntu 并不完全局限于应用商店中的软件，因为从互联网下载的程序也可以安装。同样，我们将在讨论完终端之后再涉及该主题。


    总的来说，在 Ubuntu 中管理硬件和软件是轻松的。无论是安装新的硬件设备还是下载流行程序，Linux 发行版都让你的计算体验无忧无虑。这并不是说 Linux
    完全专为初学者设计，因为正如我们将看到的，Linux 绝对是高级用户和资深管理员的绝佳选择。


    ## 命令行 / 终端


    在现代计算机出现之前，硬件和软件是仅通过键盘进行交互的。鼠标带来了图形界面并简化了这一过程，但许多功能仍保留为纯文本形式，以免向最终用户展示复杂的选项。在
    Linux 中，这一过程延续至今。大多数发行版都有图形用户界面（GUI），但每个 Linux 发行版也都有一个内置的基于文本的界面，可以通过它输入并执行强大的命令。你可以把终端想象成一个功能强大得多的命令提示符，因为你可以完全仅通过终端来使用你的计算机。拥有足够的知识后，用户实际上可以通过文本浏览互联网、安装程序、管理文件系统等。


    通过从 Dash 启动终端或使用键盘快捷键 Ctrl+Alt+T 来开始使用终端。将打开一个紫色窗口并等待你的输入。你可以输入命令并按回车键以激活它。对于我们的第一个命令，请输入“ls”。这是“list”（列出）的缩写，它将显示当前目录中的所有文件。你将能够看到
    Home（Ubuntu 的主要用户文件夹）中的文件和文件夹。如果你迷失了方向，随时可以输入“pwd”来打印当前工作目录，并显示你当前正在浏览的文件夹名称。在学习命令时，写下它们有助于更好地内化其用法。


    ### 管理目录


    目录，也称为文件夹，其工作原理与其他操作系统中相同。文件夹存放文件，你必须当前正在访问某个目录才能与其内部的文件进行交互。你可以使用终端命令 "cd" 来更改目录并在文件系统中移动。例如，从
    Home 文件夹输入 "cd Desktop" 会将你转移到该文件夹。现在使用 "ls" 将不会显示任何内容（除非你在桌面上添加了文件）。若要退出，请输入
    "cd .."。练习以这种方式在文件系统中导航：cd 进入目录，并用 ls 查看文件。


    由于你正在输入命令，Linux 期望你的输入精确无误。如果你拼错了一个命令，它将简单地不起作用；如果你错误地输入了一个文件夹或文件名，它将尝试引用一个不存在的东西。在使用终端时请仔细检查你的输入。


    打开文件使用不同的命令 –“./”。点号用于启动指定的文件，因此，如果你试图打开一张图片，可以这样做：“/.house.png”。点号和斜杠都是必需的，因为它表示你正在当前目录内运行一个文件。当你运行一个文件时，它将使用分配给该文件类型的默认应用程序打开，因此对于图片而言，它很可能在图像查看器中打开。


    你也可以通过终端创建和删除目录和文件。对于这个示例，请导航到 Home 目录。作为一个快捷方式，你可以输入 "cd ~" 将目录更改到你的 Home，因为波浪号键代表“当前用户的主目录”。使用
    "mkdir" 命令创建一个目录；输入 "mkdir Programming" 以创建一个新标题为该名称的文件夹。你可以 cd 进入其中，或者你可以进入 GUI
    并进入该目录以证明你确实创建了一个新文件夹。现在通过返回 Home 并输入 "rmdir Programming" 来删除该目录。不加犹豫，Linux 将删除指定的目录。类似地，使用
    "rm" 将删除指定的文件。


    Linux 拥有一种许多用户不习惯的设计理念。在 Windows 和 OSX 中，操作系统几乎总是会在你开始执行删除文件或卸载程序等操作前再次确认。Linux
    发行版认为，如果你输入了一个操作，你肯定意味着要执行到底。它通常不会确认删除某物，也不会显示任何确认消息（如“文件已成功删除”）。相反，没有消息表示进程已成功完成。虽然这种理念有些危险（因为你可能会在毫无预警的情况下毁掉你的操作系统安装），但它构成了与其他操作系统的设计对比。Linux
    给你完全的控制权，并且从不试图隐藏任何内容或使选项变得晦涩，因为可能太复杂。这需要一些时间来习惯，但大多数用户都同意，能够被你所拥有的技术尊重是一种受欢迎的改变。


    然而，这并不会牺牲安全性，因为任何关键操作都需要“sudo”命令作为前缀。Sudo 代表“super user do”（超级用户执行），意味着权限最高的用户正在请求执行以下命令。任何
    sudo 条目都将需要管理员密码，因此恶意软件或无意中乱按键盘的人在没有知道密码的情况下无法意外造成损害。书中使用的许多命令都需要 sudo 权限，因此如果命令因解释权限不足的消息而未能完成，你可以使用
    sudo 重试。


    '
