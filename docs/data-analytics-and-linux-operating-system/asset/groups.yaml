    ## Linux 发行版概览


    本质上是一个轻量级的 Linux 浏览器，专为在线使用而设计。谷歌在其 ChromeBooks 上预装了此操作系统，而这些电脑的配置低于其他笔记本电脑。但该操作系统实际上只是一个全屏的
    Chrome 浏览器，因此它非常适合那些追求简单无干扰体验或专用互联网机器的用户。


    -   Tiny Core – 一种以兆字节为计量单位的操作系统，适用于老式计算机或嵌入式设备。该操作系统主要面向拥有兴趣项目或特定用途的中级用户。

    -   Damn Small Linux – 另一种极简 Linux 变体，该操作系统最适合快速访问 Linux 命令行。

    -   openSUSE – 这是一个面向资深电脑用户的发行版。拥有许多面向管理员和程序开发者的工具，openSUSE 是那些对自身技能有信心的用户的最佳操作系统。


    基于 Linux 内核的操作系统数量之多令人惊叹。面对如此众多的选择，你可能会困惑不知从何开始以及如何安装。如果拿不准（并且正如我们即将演示的那样），安装
    Ubuntu 或其变体版本。该操作系统非常适合初学者，并能使从其他系统向 Linux 的过渡更加平滑。但当你技能提升并希望了解更多关于 Linux 的知识时，你随时可以安装其他操作系统。


    ## 启动进入 Linux


    如果你准备好投身于基于 Linux 的发行版，你必须做的第一件事是备份你的文件。覆盖硬盘上的操作系统会擦除其中包含的所有数据，这意味着你必须备份那些在转换之后希望保留的图片、音乐或文件。使用外部硬盘或在线数据存储网站（如
    Google Drive）来暂时存放你的文件。如果你丢失了重要物品，我们概不负责，请务必备份！


    接下来，我们需要选择一个操作系统。本书将以 Ubuntu 16.04 作为扩展示例，并建议你采取相同做法。访问 Canonical 的官方网站（http://www.ubuntu.com）获取该操作系统的副本。你将把镜像文件从该网站下载到你的计算机上。


    接下来，我们需要获取安装介质。这可以是 DVD、USB 驱动器、SD 卡或任何其他计算机可读的可写介质。唯一的限制是，该设备必须能够容纳与操作系统下载大小相当的镜像文件，因此
    4GB 应该就足够了。请移除驱动器中的所有其他内容，因为它也会被格式化。


    下载一个用于写入镜像文件的工具。对于 DVD，安装 Imgburn（http://www.imgburn.com）；对于闪存介质，下载 Rufus（https://rufus.akeo.ie）。最常见的操作系统安装方法是使用
    4GB 的 USB 驱动器，这种方式更受推荐。插入你的介质，启动相应的程序，选择已下载的操作系统镜像，并开始写入过程。这需要一些时间，因为镜像需要在介质上制作成可启动状态。完成后，你可以完全关闭计算机。


    这是一个确保你准备好安装 Linux 的关键时刻。检查你的文件是否已备份，理解你将擦除当前的操作系统，并最好手头备有一张 Windows/OSX 安装盘，以防你决定换回原系统。如果你确实准备好切换，请继续。


    在仍插入安装介质的情况下，打开你的计算机。你将看到的第一个屏幕是 BIOS/UEFI POST 屏幕，它会提示你按下某个键盘按键以进入设置。这个屏幕每次启动时都会显示，但你可能从未留意过。按下提示的按键进入
    BIOS 设置。如果你反应太慢，该屏幕会消失，你通常的操作系统将开始加载。如果发生这种情况，只需再次关闭计算机并重试即可。


    一旦进入 BIOS/UEFI，你需要导航到“启动顺序”设置。每台计算机的 BIOS/UEFI 略有不同，因此我们无法详细解释具体过程。但通常，你可以遵循屏幕底部的按钮提示来了解如何导航。到达启动顺序设置后，将你的启动介质置于列表顶部。例如，如果你使用的是
    USB 驱动器，你会看到它的名称，并需要将其移至列表顶部。这些设置控制 PC 搜索操作系统的顺序。将我们的启动介质置于列表顶部后，它将启动我们下载的 Linux
    镜像，而不是我们通常的操作系统。保存设置并重启计算机。如果一切操作正确，计算机将开始启动进入 Ubuntu。


    但如果有问题发生，请尝试使用以下技巧进行故障排查：


    -   **主要操作系统启动而不是 Linux** – 你可能没有保存将备用启动介质置于列表顶部的设置。PC 仍然默认使用内部 HDD 进行启动。

    -   **“未找到启动介质”** – 你是将 Linux 镜像“拖放”到介质上而不是写入的吗？如果没有明确告知计算机该介质是可启动的，它将不知道该如何使用介质上的数据文件。或者，你的下载可能已损坏，或写入不完整。尝试重新下载镜像并再次制作安装介质。

    -   **“Kernel Panic”（内核恐慌）** – 启动过程出了问题。请参照上文检查安装是否损坏的可能性。否则，你试图安装的镜像可能与你的硬件不兼容。如果你看到其他错误信息，请在互联网上搜索这些错误。对于预构建的计算机和笔记本电脑，搜索型号名称和
    Linux 以查找其他用户的经验。最后，你可能试图在 32 位计算机上安装 64 位镜像。在下一次下载镜像时，请明确选择 32 位镜像。

    -   **“从 CD-ROM 读取数据时出现问题...”** – 尝试使用不同的安装介质，因为一些发行版不再支持 CD 和 DVD 安装。建议使用 USB
    驱动器。

    -   **PC 似乎启动了，但屏幕上完全没有任何内容** – 如果你使用的是专用显卡（相对于 CPU 集成显卡），Linux 可能没有完全识别它。请将显示器直接插入主板，而不是插入显卡。


    但是，上述大多数问题都是罕见的或仅仅是由于用户错误导致的。Linux 具有高度的兼容性，且在初始安装之后，使用相对简单。典型用户在此阶段应该能成功启动 Ubuntu，并看到一个可用的计算环境。


    你看到的桌面被称为“Live CD”，它基本上是该操作系统及其工作方式的演示。你实际上还没有将操作系统安装到硬盘上，因为它仍在直接从你的启动介质运行。这是一个让你在不删除主要操作系统的情况下测试
    Linux 的机会，因此请利用这个机会探索 Linux 发行版是如何工作的。


    ## Ubuntu 基础


    与 Windows 类似，Ubuntu 具有桌面图形用户界面。应用程序在窗口中打开，这些窗口可以最大化、最小化、关闭，并通过顶部栏移动位置。Ubuntu 也有某种形式的“任务栏”，其功能与其
    Windows 对应部分非常相似——图标看起来像是可以通过点击启动的程序。任务栏上的“Windows 按钮”（称为 Dash 按钮）用于打开搜索功能，你可以输入计算机上某个程序或文件的名称以快速启动它。


    此外，屏幕顶部有一个栏，其作用类似于其他操作系统的“菜单”栏。当一个程序处于活动状态时，“文件”、“编辑”、“帮助”等下拉菜单将在此处出现。


    除了少数细微差别外，Ubuntu 的功能方式非常熟悉。事实上，你可能在其他操作系统上已经使用过的许多程序，如 Firefox，在 Linux 发行版中也可用，有时甚至是预装的。经过足够的实验和练习，你将能够像专业人士一样操作
    Ubuntu 的 GUI。继续探索该系统，如果你准备好用这个 Linux 操作系统替换你的主操作系统，请继续。

    '
