  mdcn: "\n## 第三章 数据管理的优势与挑战\n\n古往今来，企业主只需审视新产品，听取来自代理商的销售演示，然后凭借直觉决定是否购买该产品。就像设有邮局和加油站的小杂货店一样，那个时代已经一去不复返了。\n\
    \n这是信息时代。企业必须紧跟趋势、市场动态、消费者偏好和经济压力，以就其市场存在做出恰当的决策。海量的信息要求受过教育的人员能够舒适且准确地解读所提供的数据。\n\
    \n克利夫兰的凯斯西保留大学最近宣布，很快将出现19万名分析人员和150万数据管理人才的短缺。这个问题将主要影响那些无法在拮据的预算下雇佣专职数据分析师的中小型企业。\n\
    \n据《福布斯》杂志报道，去年具备大数据技能的信息技术项目经理需求增长了123.6%，而具备大数据技能的计算机系统分析师增长了89.8%。\n\n*(来源：http://www.forbes.com/sites/louiscolombus/2014/12/29/where-big-data-jobs-will-be-in-2015/#2cqed00404a)*\n\
    \n即使企业能够获得数据分析，除了如何使用所提供的信息外，企业仍面临其他挑战。其中之一就是数据管理。\n\n数据管理是对数据和收集到的信息进行组织化管理，以应对安全性、访问限制和存储问题。数据管理所需的任务包括治理策略、数据库管理系统、数据系统集成、数据安全、来源识别、数据分离以及存储问题。\n\
    \n### 有效数据管理的关键\n\n数据管理问题并非新难题。只要有数据被收集，企业就在处理保持数据纯净这一棘手问题。如今，随着数据量和营销自动化的增加，数据安全已跃升为问题领域的核心。\n\
    \n如果数据不干净或不相关，它对营销和业务高管来说毫无用处。数据管理需要持续监控，因为黑客正伺机掠夺并销毁数百万条相关信息和资源。对于数据安全问题，有一些事项应成为自动化流程，例如：\n\
    \n1.  **限制访问**\n\n  许多时候，材料和信息的访问权限向所有员工开放，允许他们进行修改。办公室经理、销售人员办公室职员不应具备进入数据库更改、访问、删除或添加信息的能力。控制这种情况的最佳方式是设立边界或实施有限访问。\n\
    \n  基于特定功能设置控制措施，例如，营销人员仅限于查看市场数据，但不可编辑。确定组织中谁负责所有数据更改，包括添加/删除以及操作（如更改客户联系信息）。制定数据导入和导出规则，以防止受保护的数据外泄，并防止病毒被上传。创建一个数据主列表，以确保信息既不重复也不受损。\n\
    \n2.  **创建数据地图**\n\n  数据地图是描绘数据流向的流程图，详细说明了数据的输入和输出、部门集成以及每个数据条目的用途。数据映射是一项持续的工作，旨在维持控制和数据一致性。\n\
    \n3.  **将数据分段组织**\n\n  数据不在于数量，而在于质量。如果客户群体只有几百人，拥有数百万个名字的数据库毫无益处。如果没有检索组织机制，数据库中有几百个名字也无济于事。\n\
    \n  相反，应根据需求对数据进行分离。示例可以按性别、年龄、地址人口统计学特征、邮政编码、联系方式偏好等分类。正确地对数据库进行分段可以使数据充满潜力而生动起来，而杂乱的数据库则会显得混乱不堪。\n\
    \n  从目前的活跃客户群开始。将他们按人口统计学特征进行细分，然后按购买习惯进一步细分。定期与客户联系，以获取他们对您产品和服务的反馈。\n\n4.  **数据卫生**\n\
    \n  数据卫生是保持数据干净和最新的过程。陈旧数据和损坏数据只会使您的数据库变得杂乱，甚至可能感染您所有的记录。与之前的功能一样，卫生维护应定期进行，以确保数据不发生衰减或污染。\n\
    \n  维护一个纯净且有序的数据库的重要性不容忽视。如果数据质量不高，所有针对错误联系点的联系和营销项目都将无法取得成功。为了提升数据库在营销和销售活动中的价值，不要忽视数据库管理。\n\
    \n## 第四章 数据管理的现实案例\n\n### 一个无效使用的示例\n\n- 约翰·贝鲁什，33岁\n- 克里斯·法利，33岁\n- 吉米·亨德里克斯，27岁\n\
    - 菲利普·塞默·霍夫曼，46岁\n- 惠特妮·休斯顿，48岁\n- 迈克尔·杰克逊，50岁\n- 杰尼斯·乔普林，27岁\n- 希斯·莱杰，28岁\n-\
    \ 科里·蒙提斯，31岁\n- 瑞弗·菲尼克斯，23岁\n- 埃尔维斯·普雷斯利，42岁\n- Prince（王子），57岁\n- 安娜·妮可·史密斯，39岁\n\
    - 艾米·怀恩豪斯，27岁\n\n来源：http://www.usatoday.com/story/life/people/2016/06/02/celebrities-who-have-died-drug-addiction/85314450/\n\
    \n这些名人有一个悲伤的共同点：他们都因药物过量在过嫩的年纪去世。\n\n处方药监控计划可以告知处方者（医生和执业护士）和分发者（药剂师），以建立针对阿片类药物滥用和转移的控制措施，阿片类药物是上述死亡的主要原因。名人仅占每年因药物过量死亡人数的一小部分。美国疾病控制与预防中心（CDC）已确定这是美国意外死亡的主要原因。在最后一次发布的数据分析中，确定2014年有超过47,000例药物过量死亡。处方止痛药导致了其中18,893例死亡。\n\
    \n来源：http://www.cdc.gov/nchs/data/health_policy/VADR_drug_poisoning_involving_OA_Heroin_US_2000-2014.pdf\n\
    \n这些药物的名称是常见的处方药，当人们进行手术、手臂骨折或几乎任何需要前往当地医院急诊室的情况时都会用到：Percocet、Lortab、OxyContin、Fentanyl、Vicodin、吗啡和Xanax只是几个例子。Xanax是一种苯二氮卓类药物，不是止痛药，但当与阿片类药物一起摄入时具有致死性，即使仅服用最小剂量（一次剂量）。\n\
    \n为了预防这场药物过量流行病，各州已建立数据库以监测相关产品的处方。该数据库包括剂量、处方填写频率以及开处方的医生，以确定哪些患者可能在转移或误用其剂量，以及哪些患者在三十天内频繁光顾不同的医生和医院以获取更多药物。\n\
    \n这个概念很棒：建立一个数据库，结合来自多个药房和医疗人员的数据源，以对抗这一问题。不幸的是，该数据库存在几个问题，阻碍了有效的管理。\n\n- 数据来自多个来源，且耗时且复杂。\n\
    - 数据不完整，因为许多医生没有花时间查询数据库。虽然该系统的安装在49个州是强制性的，但只有22个州要求合规，并且没有人监控其一致性。\n- 负责进行实时信息分析的人员太少。数据被输入数据库，但未被有效提取。\n\
    \nSAS研究所的主要数据分析师在报告*《数据与分析对抗阿片类药物流行病》*中解决了这个问题。他们的观点是目前的信息几乎无法使用。\n\n来源：[http://www.sas.com/en_us/whitepapers/tia-data-analytics-combat-opioid-epidemic-108369.html](http://www.sas.com/en_us/whitepapers/tia-data-analytics-combat-opioid-epidemic-108369.html)\n\
    \n通过更好的分析和解读，医生可以制定改进的治疗方案、患者教育和政策界限。例如：\n\n- 医生可以与其同行比较治疗方案，以确定早期药物依赖的具体模式。\n\
    - 保险和政府支付系统可以编录潜在的误用或转移情况，避免为欺诈行为支付费用成本。\n\n"
