    # Linux 发行版


    安装 Linux 有多种方式，例如将操作系统镜像刻录到光盘、写入 USB 闪存盘、从网上订购 Live CD、格式化 SD 卡，或者尝试通过 Virtual
    Box 进行虚拟化测试。不过，最终你并不能仅仅安装“Linux”就得到一个可用的操作系统。因为 Linux 只是内核，你还需要其他软件，如图形用户界面、互联网访问等。如前所述，存在多种
    Linux 的“发行版”。发行版是包含预装程序和独特风格与侧重点的 Linux 版本。发行版将 Linux 的核心转化为一个适合日常使用的完整操作系统。


    Linux 发行版的数量令人咋舌。有些具有特定用途，例如用于黑客攻击的 Kali Linux、用于教育的 Sugar Linux，或用于高度定制的 Arch
    Linux。另一些则更具通用性，例如 Ubuntu 和 Debian。要想充分发挥安装 Linux 的优势，你需要了解不同的发行版，并做出最适合你的选择。阅读以下章节，以了解一些最流行发行版的用途。


    ### Ubuntu


    在撰写本文时，Ubuntu 是最广为人知的发行版。在 2000 年代，它因用户友好和直观而广受欢迎。基于早期的 Debian 发行版，Ubuntu 在使用上与
    Windows 计算机非常相似，这意味着它是 Linux 新手的绝佳选择。因此，我们将在本书的后半部分安装一个 Ubuntu 变种。Canonical Ltd
    是积极开发 Ubuntu 的公司——年度版本更新意味着该操作系统始终处于最新状态，并能与新兴技术兼容。尽管如此，Ubuntu 在许多旧设备上仍然能以合理速度运行。应用程序可以从某种“商店”中安装，这意味着初学者无需理解通常复杂的命令行。总之，Ubuntu
    发行版是初次接触 Linux 用户的绝佳选择，你应该安装它来学习 Linux 的工作原理，而无需立即深入更复杂的发行版。


    对于更具体的计算场景，Ubuntu 拥有各种子发行版或“风味”（Flavors）。这些发行版以 Ubuntu 为基础，但具有不同的侧重点，例如 Lubuntu
    对轻量级应用程序的强调。以下是一些例子：


    - Lubuntu – 专为在旧硬件或资源有限的计算机上运行而设计的 Ubuntu 版本。其安装文件小于 1GB，硬件要求远低于标准 Ubuntu。使用此发行版可以让旧电脑重获新生，同时保留
    Ubuntu 的易用性。

    - Ubuntu Studio – 面向艺术家的 Ubuntu 版本，包括数字画家、音效制作人和视频编辑人员。Ubuntu Studio 是预装了编辑工具的
    Ubuntu。

    - Kubuntu – 使用 KDE 桌面环境重新封装的 Ubuntu。Kubuntu 的外观和感觉与经典 Ubuntu 不同，因为它提供了更符合其他操作系统传统的桌面环境。

    - Xubuntu 是另一个轻量级发行版，不像 Lubuntu 那样精简到极致。Xubuntu 牺牲了一定的体积和硬件要求，以提供可在较旧（但不是太旧）计算机上运行的操作系统。它比其他极简
    Linux 发行版更具美观性，并且也使用 Ubuntu 作为基础以保持易用性和熟悉感。

    - Ubuntu Server – 更适用于工业和企业需求的 Ubuntu 变种，Ubuntu Server 可以无头（headless）运行，并为网络中的其他
    Linux 系统提供功能支持。

    - Mythbuntu – 预装了电视流媒体和直播电视节目的变种。借助 Kodi，这是一个将旧电脑转换为“智能电视”设备的绝佳发行版。


    总之，Ubuntu 发行版的广泛多样性意味着每个人都有适合初学者的操作系统。强烈建议你利用 Ubuntu 中包含的易用性功能和整体熟悉感。它作为一个过渡性的操作系统，会逐渐向你介绍
    Linux。一定要将它作为你的第一次 Linux 体验进行安装。


    ### Linux Mint


    Linux Mint 是 Linux 世界中使用最广泛的操作系统之一。“功能强大且易于使用”，Mint 包含自由开源软件（FOSS）和专有软件，旨在为 Linux
    初学者提供完整的体验。虽然它不完全像典型的 Linux，但 Mint 是作为首选替代操作系统的绝佳选择。它始终位列使用最广泛的操作系统排行榜，其默认布局与
    Windows 非常相似，有助于平稳过渡到 Linux 世界。


    ### Debian


    Debian 是最古老的 Linux 发行版之一，创建于 1993 年。结合 Linux 的哲学，Debian 将稳定性和坚固性作为指导开发的原则。Debian
    存在的时间之长无疑是其经过精雕细琢的标志，因此，那些寻求无故障且无错误体验的用户可以转向 Debian。自由和开源软件也在 Debian 找到了归宿，因为其中包含的大多数软件都是
    FOSS。不过，这并不意味着你受到限制，因为存在一个官方的非自由软件存储库，用于存放诸如 Adobe Flash 等专有程序。Debian 是初学者的不错选择，但
    Ubuntu 仍然是最佳的入门操作系统。为了稳定性、FOSS 和纯粹的 Linux 体验，请安装 Debian。


    ### Slackware


    Slackware 是一个比 Debian 历史更悠久的操作系统。它紧密遵循原始的 Linux 宗旨，这意味着你需要自行安装图形用户界面和程序依赖项。正因为如此，Slackware
    主要面向中级 Linux 用户，因为初学者可能会因不熟悉的操作方法而感到困惑。然而，如果你想体验一个更接近 UNIX 根源的 Linux 发行版，Slackware
    可以满足你的需求。


    ### Fedora


    Fedora 是一个更面向工作站和商业用途的操作系统。就连 Linus Torvalds 本人也是 Fedora 的用户，这促进了该操作系统的普及和使用。Fedora
    更新非常频繁，意味着它始终处于最新状态，并位于 Linux 技术的前沿。安全和 FOSS 也是该操作系统的重点，因此它常被用作小型企业终端电脑的系统。不过，处理
    Fedora 可能存在一定的挑战，因此可以将其视为一个中级操作系统。


    ### Arch Linux


    Arch Linux 是另一个发行版，但主要设计面向经验丰富的用户。该操作系统以系统框架的形式提供，用户可以按照自己的喜好进行定制，仅添加他们想要的程序和服务。正因如此，Arch
    的设置较为困难，但也是一次有益且富有学习意义的体验。通过构建自己的个人系统，你将理解在更高层发行版中隐藏起来的深层 Linux 概念。在非常熟悉基础知识之后，再安装这个高级操作系统。


    ### 其他值得注意的发行版


    最后，还有大量其他独特的发行版值得一提。在下面的列表中，我们将讨论其中的一些。请注意，发行版非常多，整本书都可以用来描述每一个特定的用途。


    - CrunchBang – 基于 Debian 的发行版，旨在降低资源消耗。它简洁明了，不包含某些发行版默认附带的一些臃肿软件。CrunchBang 运行速度快且计算效率高。

    - Android – 流行的手机操作系统实际上是一个 Linux 变种。由于许多手机的规格低于完整的桌面 PC，该操作系统是笔记本电脑、触摸屏设备或家庭媒体电脑的绝佳选择。此外，你可以使用
    Play 商店中的许多 Google Apps，这意味着数千种应用、游戏和工具可供在手机和计算机上使用。虽然不建议将其作为你的第一个 Linux 操作系统，但它绝对是实验旧电脑或儿童
    PC 的一个不错选择。

