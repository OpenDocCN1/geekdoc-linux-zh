    ## 实用应用程序


    以下列出了适用于您的 Ubuntu 系统的最佳应用程序，它们将帮助您最大限度地利用您的计算机。


    - 办公生产力 – Abiword, VI, Emacs, LibreOffice, nano

    - 多媒体 – VLC, DeaDBeef, Cmus, AquaLung, MPlayer, Miro

    - Web 浏览 – Firefox, Chromium, Midori, W3M

    - 创作 – Audacity, GIMP

    - 其他 – Kupier, Thunderbird, qBittorrent


    对于那些有助于易用性的程序，选择多种多样，具体取决于您想要实现的目标。发现程序的最佳方法是在互联网上搜索您希望添加的功能。例如，如果您正在寻找快速打开和关闭终端的方法，您可能会遇到“Guake”程序。或者，如果您希望在终端中播放音频，它可能会推荐“Cmus”。找到适合您的完美应用程序是
    Linux 定制部分的一部分，这使得每个安装对每个用户来说都更具个性化。


    ## 管理


    如果您正在寻找某种“控制面板”，您可以在“系统设置”应用程序中找到指向网络、打印、键盘、外观等管理工具的快捷方式。一些 Ubuntu 变体使用“设置管理器”或仅为“设置”来达到相同的目的。


    启动后，会有一些指向其他默认配置应用程序的链接；只需点击您需要更改的任何链接，即可获得设置某些选项的 GUI。但并非所有管理功能都可以通过 GUI 找到。大多数低级设置只能通过命令行访问，因此您需要确切知道要输入什么来编辑它们。


    例如，向 Ubuntu 添加新用户需要“adduser”命令。通过在命令后跟一个用户名，终端将提示输入基本信息和密码。将该新用户设置为管理员是通过“usermod
    -aG sudo nameofuser”完成的。此外，可以使用“deluser”删除用户。这些选项在 GUI 中很难找到，但用终端只需几秒钟即可完成。


    在 Ubuntu 中，“任务管理器”或对运行中应用程序的管理也是通过终端完成的。程序“top”在大多数发行版中都是标准安装的，启动它会显示所有当前正在运行的进程列表，就像任务管理器一样。不过，默认情况下，进程列表会以一种可能难以读取我们所需数据的方式更新和移动。按“f”键调出排序列表，使用箭头键导航到“PID”，然后按“s”以设置该选项。现在，我们退出以返回
    top，然后可以使用翻页键和向下翻页键浏览列表以查看任务。例如，假设我们想要关闭无响应的程序“Pidgin”。在列表中查找它（或使用上述过滤命令搜索），并记下
    PID（进程 ID）号。按“q”退出 top，然后输入“kill 4653”，显然用 PID 替换该数字。在 top 中的任何时间，您都可以按“h”查看各种操作的键盘快捷键列表。如果
    top 太难使用，请考虑安装“htop”，这是该程序的“人类可读”版本。它实际上显示了精美的 ASCII 图表，详细说明 CPU、RAM 和其他使用统计数据。使用
    F3 搜索程序，然后使用 F9 和 Enter 来终止它。


    至于服务，您可能注意到我们使用“service”命令来更改其状态。因此，启动 Web 服务器可以使用“service apache2 start”，重启它通过将
    start 替换为 restart 来完成，停止它通过将 start 替换为 stop 来完成。使用“service --status-all”可以找到服务列表。服务是守护进程，即持续运行的后台任务。它们可能正在收集数据，运行如蓝牙和
    Wi-Fi 等服务，或者等待用户交互。


    ## 安全协议


    Linux 总体上注重安全性，这有助于其在企业和服务器环境中的使用。利用安全协议意味着您比其他操作系统更安全，计算机被入侵的可能性更低。当然，这需要良好的安全原则，并始终保持在线安全。没有密码的计算机几乎没有任何保护。


    从 UNIX 继承的一个特性是文件权限。每个文件都有一套权限 - 所有者、组和权限。命令“chown”更改文件的所有者，“chgrp”更改组，而“chmod”更改与文件相关的权限。通过输入“ls
    -l filename”可以发现文件或文件夹的权限。它将返回一行起初令人困惑的内容，例如“- rw- rw- r--”。“R”表示读取，“W”代表写入，第三个选项是用于执行的“X”。这三个集合分别代表所有者、组和其他。因此，我们上面的示例文件为所有者及其组设置了读写权限，但仅为其他用户设置了读取权限。这意味着所有者和他所属的组（很可能是
    sudo 用户）有权访问和更改文件内容，但网络或 PC 上的其他用户只能查看内容而无法编辑。脚本文件需要具有 X 才能执行，没有它就无法运行。


    大多数人只需要使用“chmod”命令来更改他们想要使用的文件的权限。我们使用该命令和一组数字来设置文件的权限。“chmod 777 test.sh”使文件对任何地方的所有用户可读、可写和可执行，因为每个规范（所有者、组、其他）都附加了数字
    7。数字决定该实体拥有的权限，使用的数字计算如下：


    - 从数字 0 开始。

    - 添加 4 表示可读取。

    - 添加 2 表示可写入。

    - 添加 1 表示可执行。

    - 剩下的数字决定权限。


    6 表示读/写，但 1 仅表示可执行。5 表示可读和可执行，但不能更改。在我们的 777 示例中，我们将所有者、组和其他都设置为 7。这不是特别好的安全性，因为这意味着任何地方的任何人都可以修改该文件。更保守的权限集将是
    775。利用安全权限优势进行安全计算。


    Linux 中的安全不仅仅局限于权限。确保您遵循良好的安全实践，并在安全方面遵循常识 - 只安装所需的程序，不要盲目遵循所有互联网建议，不要过度使用 sudo，使用密码，使用加密网络，保持软件更新，加密重要文件，并定期备份。作为最后的建议，请查看使用带有
    SELinux 的发行版，这是一个支持 ACI 和其他安全策略的模块。


    ## 脚本


    Bash 是终端的“编程语言”。当我们输入命令时，我们是在 bash 中进行的。脚本是按顺序执行的一组 bash 命令，这意味着我们可以创建一个包含命令列表的脚本并运行它，以节省时间或自动执行我们通常必须键入的终端任务。作为中级和高级
    Linux 管理员，您可以使用脚本大大缩短重复或持续运行任务所需的工作量。


    要开始编写脚本，请在 nano 中创建一个新文件“script.sh”。第一行必须始终是“#!/bin/bash”以将其标记为 bash 脚本。为第一个脚本输入以下行。


    ```

    echo “What is your name?”

    ```


    ```

    read name

    ```


    ```

    echo “Hey, $name. Here is your current directory, followed by the files.”

    ```


    ```

    pwd

    ```


    ```

    ls

    ```


    保存脚本。现在我们必须设置权限以允许其运行。使用“sudo chmod 777 script.sh”，然后使用“./script.sh”运行脚本。只要您准确复制了脚本，它会询问您的名字，然后显示您的目录和文件。将这一概念扩展到您自己的脚本中。您也可以运行已安装程序的命令，因此您可以编写一个自动加入域的脚本，或者一个连接到指定网络的脚本。关闭远程计算机也是一个很好的自动任务。


    脚本可以手动运行，也可以设置在特定时间执行。要让用户每次登录时都运行某个脚本，从 dash 打开“启动应用程序”程序，并创建一个新的应用程序，以脚本作为源。现在每次该用户登录时，脚本都会自动运行。这对于设置某些选项或启动后台服务非常有用，而无需用户自行操作。


    调度特定时间的任务可以通过 Cron 系统守护进程完成。某些系统默认安装了它，如果没有，则可以使用“sudo apt-get install cron”。使用“service
    cron start”启动服务，并使用“crontab -e”创建一个新的 crontab 文件。选择 nano 作为您的文本编辑器。在创建的文件底部，添加一行包含我们调度任务的新行。格式如下：


    分钟、小时、日、月、星期、命令


    我们使用这些选项来格式化并指定运行命令的时间。时间数字从 0 开始，因此小时范围从 0 到 23，分钟范围从 0 到 59。使用星号替换任何选项以指定它将在任何值上运行。请注意这些示例：


    ```

    0 12 * * * ~/script.sh

    ```


    这将在每天中午运行主目录中找到的 script.sh。


    '
