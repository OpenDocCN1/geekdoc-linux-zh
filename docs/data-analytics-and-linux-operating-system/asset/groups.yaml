  mdcn: "\n# 第 11 章 数据分析如何让任何企业持续繁荣\n\n**分析时代**已经到来，水瓶座时代已经过去。那些能够收集、解读并利用其衍生原始数据采取行动的组织，能够适应快速变化的市场环境，并始终领先于竞争对手。\n\
    \n为了正确且快速地利用数据，使用这些工具分析数据将带来清晰度和创新性的建议。\n\n从**测量**开始，确定哪些分析对组织内部的决策最有帮助。\n\n**诊断**客户满意度或产品推广中出现的**问题**。为什么某事会以不利的方式发生？数据分析可以帮助你定位具体问题，从而找到令人满意的解决方案。\n\
    \n**预测和优化**以预测变化及其潜在后果。使用“如果”……“那么”的提问方法。（如果我改变客户服务方式，我该如何预期反应？）这种分析技术有助于确定组织的发展方向以及维持持续生长的最佳途径。\n\
    \n**操作化**，即将信息投入使用，由一线员工、销售人员、工程师、营销人员、经理及其他决策者使用。这是从分析到实用性的转变，从实验室走向现实世界体验。\n\
    \n**自动化**是指业务管理者使用实时信息对组织进行即时调整。例如，在杂货行业，优惠券对于顾客和杂货商来说都是巨大的利润来源。杂货商销售产品，并由优惠券代理机构报销，外加基于优惠券价值的处理费。顾客以更低的价格获得产品，而这些产品通常是新推出的商品，在萧条经济中会被视为奢侈品。然而，如果顾客利用零售商获取商品优势，购买完货架上所有库存，导致后续顾客无货可买，从而营造出一群不满顾客的环境，会发生什么？店长立即评估情况并实施“每笔交易仅限\
