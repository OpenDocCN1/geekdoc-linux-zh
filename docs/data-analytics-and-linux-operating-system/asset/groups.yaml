    # # Chapter 5   The Different Types of Data Analytics


    Big data is such a buzzword there is a misconception of what it is and what it
    does. The uses of Big Data are tremendous: fraud detection, competitive analysis,
    consumer preference analysis, traffic management, call center optimization, managing
    utility power grids, and managing warehouse and inventory, just to name only a
    few. Big data itself is problematic because it is the business intelligence code
    word for data overload.


    **There are three V''s of Big data:**


    +   1. Too much data, or **volume**

    +   2. Too much speed; the data is moving so quickly it cannot be analyzed, or
    **velocity**

    +   3. Too much information from too many sources, or **variety**.


    Even though the collection and assimilation of big data is daunting, the business
    intelligence that is derived from big data can aid a business immensely.


    # *Four Kinds of Big Data Business Intelligence*


    There are four kinds of big data business intelligence that are particularly helpful
    for business owners:


    +   1. Prescriptive

    +   2. Predictive

    +   3. Diagnostic

    +   4. Descriptive'
  - '[PAGE 26]


    # Prescriptive Analysis


    Prescriptive analysis is the most valuable analysis because it informs the business
    what steps should be taken to improve the situation. The use of this data can
    be the beginning of change for the organization. Even though it is considered
    the most valuable, it is the least used as barely 3 percent of the organizations
    reported to use big data. Companies could use prescriptive analysis to give specific
    issues to isolated problems, such as in the health care industry and the problem
    of diabetes and obesity. Big data could identify the obese patients with both
    diabetes and high cholesterol, three contributing factors in the development of
    heart disease. These patients could be targeted immediately to initiate a four-fold
    attack on the risk factors through diet, diabetes education, exercise encouragement
    and cholesterol monitoring. At present, the issues are addressed by different
    specialists, if they are even addressed at all. Combining treatment strategies
    would be much more effective and the combination of information could be compiled
    through prescriptive analysis.


    # Predictive Analysis


