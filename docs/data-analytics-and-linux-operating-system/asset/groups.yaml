    ## 简介


    计算机包含两个功能组件——软件和硬件。硬件是那些旋转、计算并使用电力来执行运算的物理部件，而软件则是一个更抽象的概念。本质上，软件由编程代码组成，它向硬件发出指令——告诉各个部件该做什么。存在“高级”软件，如互联网浏览器、文字处理器、音乐播放器等。但常被忽视的组件是被称为操作系统的“低级”软件。


    我们的个人计算机运行需要操作系统。在办公室，或者使用相对便宜的台式电脑时，使用的操作系统很可能是微软的 Windows。内容创作者、作家和图形艺术家更青睐苹果电脑，因为苹果电脑搭载了以创造力为核心的
    OSX 操作系统。Windows 和 OSX 这两个操作系统多年来主导着消费市场。然而，存在另一种操作系统，它在易用性、自定义、安全性和价格方面表现卓越。基于相对鲜为人知的
    Linux 的操作系统在上述所有方面均能满足甚至超越需求，但它仍是一个许多人都未曾听闻的冷僻选项。


    Linux 本身不是一个操作系统。它是一个内核，即操作系统的“核心”。正如 Windows NT 是 Windows 7 的内核一样，Linux 是像 Ubuntu、Debian、Arch、Fedora
    等“发行版”的内核。


    但为什么有人会放弃熟悉的 Windows 而选择一个闻所未闻的计算环境呢？Linux 不仅免费，而且兼容大量设备。旧计算机，特别是那些已不再正常工作的电脑，可以通过安装
    Linux 操作系统焕发新生，使其运行起来如同新电脑一样。


    本书将阐述切换到 Linux 的好处，并作为入门指南，介绍如何安装、配置和使用最流行的发行版。随后，将解释终端命令行，说明如何利用 Linux 实现其他系统无法做到的功能。确实，切换到
    Linux 可以带来许多优势，通过阅读本书，你可能会找到一款适合用作你计算机主要操作系统的 Linux 发行版。


    ## Linux 的历史


    20 世纪 90 年代初，Linus Torvalds 是芬兰的一名学生。当时的计算机通常运行 DOS 或 UNIX，这两个操作系统在当时都是专有的且难以使用。Torvalds
    试图基于 UNIX 创建自己的操作系统，作为一个业余爱好项目，但该项目迅速壮大并吸引了更多开发者。内核不断演进，直到它变得可移植（可在多种系统上使用）并完全可用于计算。然而，内核并不是操作系统，因此
    Linux 与 GNU 核心实用工具结合，创建了一个让人联想到操作系统的计算环境。


    随后，第三方组织将基础 Linux 产品作为基础，添加了自己的高级软件和功能，从而创建了 Linux“发行版”。Linux 至今仍是一个免费的业余项目，因此内核持续接收由
    Torvalds 和社区提供的更新和修订。在整个 2000 年代，许多其他第三方也看到了 Linux 环境的有用性，并开始将其纳入其生产环境和企业中。如今，Linux
    以在服务器和商业环境中得到广泛使用而闻名，并拥有少量忠实的桌面用户。展望未来，内核已达到如此高的普及度，永远不会消亡。大型公司因其优势和实用性而青睐 Linux，因此内核和各种发行版将始终作为最佳替代操作系统存在。


    ## Linux 的优势


    为了比较 Linux 作为计算机选项有多优秀，我们将它与更熟悉的现代操作系统进行比较。


    首先，Linux 是免费的。GNU 的背景使 Linux 处于“自由开源”的理念中，随 Linux 发货的绝大多数（如果不是全部的话）软件都是免费的。自由开源（FOSS）指两件事——软件在金钱上是免费的，且源代码也是透明的。FOSS
    与专有软件的不同在于，FOSS 的一切都开放，使用它没有隐藏的间谍软件、费用或陷阱。因为任何人都可以贡献于唾手可得的源代码使其更好，软件通常更安全。由于 Linux
    和你可以从其中下载的大多数软件都是免费的，它是小型企业或预算有限的个人用户的绝佳操作系统。当然，不收费并不会牺牲质量，因为 Linux 项目及其各种发行版是由社区驱动并通过捐赠资助的。相比之下，Windows
    的成本往往是数百美元，仅操作系统本身就很昂贵。Microsoft Office 是一个流行的文档写作程序套件，但价格也高昂。Linux 中存在这些程序的免费替代品，它们在质量上绝对可以与那些知名品牌产品相媲美。


    PC 拥有者最大的抱怨可能是病毒。Windows 计算机尤其容易受到感染，甚至反病毒软件公司也总是在紧跟最新威胁的后尘。通常只需访问一个恶意网站就足以感染计算机，许多用户因为涉及恶意软件的事件发生频率相对较低而选择
    Mac 电脑。基于 Linux 的操作系统与 Mac 类似，病毒几乎不存在。这种增强的安全性使得对于关心隐私、安全性或可靠性的任何人来说，切换到 Linux
    都是必须的。


    Linux 在企业、政府部门非常流行。这是因为高性能服务器和关键设备在运行 Linux 作为操作系统时表现卓越。该操作系统以可靠性和稳定性闻名。虽然 Windows
    计算机需要定期重启和维护以“刷新”并防止其运行缓慢，但 Linux 服务器可以运行数月甚至数年而不重启一次。IT 专业人士不可避免地选择 Linux 作为其网络的骨干，因为其声誉。其卓越的稳定性也可以在桌面平台上供消费者使用，这对我们也非常有用。


    使用 Linux 的最佳优势之一也许是速度。低系统要求意味着那些在 Windows 上通常缓慢迟钝的计算机，在 Linux 上会变得轻快迅捷。对电脑速度减慢感到沮丧的用户可以更换操作系统以获得更响应的体验。此外，Linux
    可以安装在旧计算机上以重新赋予它们活力。所以即使那台旧笔记本电脑可能太陈旧而无法运行最新版本的 Windows，很可能仍有一个 Linux 发行版可以从中再榨出几年的使用寿命。


    自定义是技术中备受追捧的功能。Windows，尤其是 OSX，出于担心普通用户会搞坏系统的恐惧，限制了你可以对操作系统进行的操作。Linux 并非如此，因为它鼓励编辑和更改操作系统的视觉和功能。当然，这不是必须的，大多数
    Linux 发行版的默认配置极其稳定，很难意外地弄坏。但对于那些喜欢越狱、修改和摆弄电脑的人来说，Linux 可以满足其创意的一面，甚至为好奇的黑客提供其他系统无法获得的工具访问权限。


    最后，Linux 兼容大量设备。Linux 可以运行在几乎任何架构上，这意味着它可以安装在手机、台式机、笔记本电脑、服务器、游戏控制台和“智能”设备上。爱好者们乐于仅仅因为可以安装
    Linux 而在小众、老旧或古怪的设备上安装它。对于普通用户而言，这意味着 Linux 很可能与你的计算机兼容。


    总而言之，Linux 在许多方面胜过主流操作系统。所有这些绝对使 Linux 成为你计算机的更好选择，你应该使用它来获得这些备受推崇的功能。艺术家、黑客、富有创造力的人、小企业主、技术人员、非技术人员，几乎每个人都能找到喜欢
    Linux 的理由。广泛发行的版本意味着每个人都能找到适合自己的东西，所以今天安装 Linux，看看你能从中获得什么。


