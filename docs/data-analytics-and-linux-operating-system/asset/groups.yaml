  md: "\n**Text mining**. In utilizing text mining technology, the business you examine\
    \ text data from the world wide web, comments, articles and other text sources\
    \ to uncover insights that were previously unseen. Text mining incorporates machine\
    \ learning and language processing to evaluate and sort web documents like blogs,\
    \ feeds, intelligence on competitors, emails, comments and surveys to assist the\
    \ business in analyzing quantities of information and discover tangents and hidden\
    \ relationships.\n\n**Data integration** is the combination of adding new information\
    \ and data to an old computer system while keeping the data both clean and uncorrupted\
    \ in content. Moving data effectively has become a challenge for businesses in\
    \ the following areas:\n\n-   **Data Needs**\n    -   Delivering the correct data\
    \ in the required format to alleviate the business needs is the primary reason\
    \ for the integration of data. Every new source of data can impact the previous\
    \ collection of information and systems to which it migrates.\n\n-   **Anticipating\
    \ the Needs of the Business**\n    -   Data is not helpful if it is not available\
    \ in a timely fashion. Integration must be adequate to manage both batches of\
    \ information and real-time\n\n-   **Confirm all Data is Stamped with Pertinent\
    \ Information**\n    -   Old systems did not time stamp or date activity in the\
    \ server. For quick identification of the changes made to the data, the data integration\
    \ needs to record this information.\n\n-   **Be Suspicious of All Incoming Data**\n\
    \    -   It is natural to anticipate data from other sources, but be suspicious\
    \ that it may be infected or other corrupt. Scan everything that comes in for\
    \ compatibility and integration needs.\n\n-   **Validate Customer Information**\n\
    \    -   Compare incoming data to the master database to confirm the customer\
    \ database is correct and current.\n\n-   **Keep a History of Every Change**\n\
    \    -   There is always a need to backtrack changes sometimes for statutory compliance\
    \ and often when integration doesn't work as anticipated.\n\n-   **Upgrade the\
    \ Systems and Evaluate the Process**\n    -   Constantly look for ways the system\
    \ may be deficient for your business needs. Upgrade the systems regularly to ensure\
    \ you have the best possible solution to your data management and integration\
    \ needs.\n\n**Data Warehousing.** Data warehousing is the storage of electronic\
    \ data by the organization for which it is prepared. Data must be stored so that\
    \ it is reliable, uncompromised, secure, easily retrievable and easily managed.\n\
    \n## Chapter 7 Conducting Data Analysis for Your Business\n\nWe have stressed\
    \ throughout this book the need for data analysis in the business enterprises,\
    \ but we have yet to explain exactly how to collect data. This chapter will focus\
    \ on basic data collection so that you can implement a strategy that will further\
    \ your organizational goals.\n\n### A Step by Step Guide\n\n#### What is Collecting\
    \ Data?\n\nBasically, gathering collected data implies putting your configuration\
    \ for gathering data into operation. You've chosen how you're going to get data\
    \ – whether by direct perception, interviews, overviews, investigations and testing,\
    \ or different techniques – and now you and/or different spectators need to actualize\
    \ your arrangement. There's more to gathering information, be that as it may.\
    \ You'll need to record the information in suitable ways and sort the data so\
    \ it’s ideally helpful.\n\nThe way you gather your information ought to identify\
    \ with how you're wanting to dissect and utilize it. Despite what strategy you\
    \ choose to utilize, recording ought to be done simultaneous with information\
    \ accumulation if conceivable, or soon thereafter, so nothing gets lost and memory\
    \ doesn't blur.\n\n#### Some of the functions necessary for useful data collection:\n\
    \n-   *Assembling data from all sources.*\n-   Computing any numerical or comparative\
    \ operations expected to get quantitative data prepared for examination. These\
    \ might, for example, incorporate entering numerical perceptions into a diagram,\
    \ table, or spreadsheet, or figuring the mean (normal), middle (midpoint), and/or\
    \ mode (most every now and again happening) of an arrangement of numbers.\n- \
    \  Coding information (deciphering information, especially subjective information\
    \ that isn't communicated in numbers, into a structure that permits it to be handled\
    \ by a particular programming project).\n-   *Arranging data in ways that make\
    \ them simpler to work with.*\n\nHow you do this will rely upon your design of\
    \ research and your assessment questions. You may amass perceptions by the independent\
    \ variable (pointer of achievement) they identify with, by people or gatherings\
    \ of members, by time, by movement, and so on. You may likewise need to group\
    \ the collected information in a few distinctive ways, so you can consider interactions\
    \ and relationships among various variables.\n\nThere are two sorts of variables\
    \ in data. An independent variable (the intercession) is a condition executed\
    \ by the analyst or group to check whether it will make change and improve the\
    \ situation. This could be a project, strategy, framework, or other activity.\
    \ A dependent variable is the situation that may change as a consequence of the\
    \ independent variable or intercession. A dependent variable could be a conduct\
    \ or a result.\n\n### How Do We Examine Data?\n\nInvestigating data includes looking\
    \ at it in ways that reveal the connections, designs, patterns, and so on that\
    \ can be found inside. That may mean subjecting it to statistical operations that\
    \ can let you know not just what sorts of connections appear to exist among variables\
    \ and additionally to what level you can believe the answers you're getting. It\
    \ might mean contrasting your data with that from different data sets (a control\
    \ group, statewide figures, and so on), to reach a few inferences from the information.\
    \ The point, as far as your assessment, is to get a precise evaluation so as to\
    \ better comprehend your work and its consequences.\n\nThere are two sorts of\
    \ information you will use, even though not all assessments will fundamentally\
    \ incorporate both. Quantitative data alludes to the data that is gathered as,\
    \ or can be interpreted into, numbers, which can then be shown and broke down\
    \ mathematically; Qualitative data are gathered as descriptions, accounts, conclusions,\
    \ quotes, understandings, and so forth., and are by and large either not ready\
    \ to be reduced to numbers, or are viewed as more important or enlightening if\
    \ left as narratives. As you may anticipate, quantitative and qualitative data\
    \ should be analyzed in different ways.\n\n#### Quantitative data\n\nQuantitative\
    \ data is collected as numbers. Examples of quantitative data include:\n\n-  \
    \ Frequency (rate and duration) of specific behaviors or situations\n-   Survey\
    \ results (reported behaviors, ratings of customer satisfaction, etc.)\n-   Percentages\
    \ of people with certain characteristics in the demographic (those with diabetes,\
    \ obese, with heart disease indicators, the education level, etc.)\n\nData can\
    \ also be collected other than numerically, and converted into quantitative data\
    \ that is ready for analysis. Compilers can assign numbers to the levels of emphasis\
    \ of a specific behavior. For instance, compilers can enumerate the quantity of\
    \ Facebook \"likes\" or \"comments\". Whether or not this kind of information\
    \ is necessary or helpful is dependent upon the kinds of questions your data is\
    \ meant to answer.\n\nQuantitative data is converted to statistical procedures\
    \ such as calculating the mean number of times an event repeats. These calculations,\
    \ because numbers are exacting, can offer definitive answers to varying questions.\
    \ Quantitative analysis can identify changes in dependent variables that are related\
    \ to – duration, frequency, timing intensity, etc. This allows comparative analysis\
    \ with like issues, like changes within the population count of a zip code, or\
    \ purchasing changes between women of a similar age.\n\n#### Qualitative Data\n\
    \nUnlike numbers, qualitative information is considered 'soft' data, meaning it\
    \ can’t be reduced to a specific conclusion. A number may indicate the population\
    \ in a demographic, but the soft data may tell you the stress levels of the shoppers\
    \ by the attitude and appearance of the customers.\n\nQualitative data can occasionally\
    \ be converted into numbers, by counting the number of times specific things happen,\
    \ or by assigning numbers to levels of importance, customer satisfaction or whether\
    \ a function is user friendly when placing an order on a\n"
  mdcn: "\n\n**文本挖掘**。在利用文本挖掘技术时，企业会从万维网、评论、文章和其他文本来源中提取文本数据，以发现此前未曾察觉的见解。文本挖掘结合了机器学习和语言处理技术，用于评估和整理网络文档（如博客、信息源、竞争对手情报、电子邮件、评论和调查问卷），从而帮助企业分析大量信息，发现侧重点和隐藏关系。\n\
    \n**数据集成**是指将新信息和数据添加到旧计算机系统中，同时保持数据内容既干净又未损坏。有效地移动数据已成为企业在以下领域面临的挑战：\n\n-   **数据需求**\n\
    \    -   以所需的格式交付正确的数据以缓解业务需求，是数据集成的主要原因。每个新的数据源都可能影响其迁移到的先前信息集合和系统。\n\n-   **预测业务需求**\n\
    \    -   如果不能及时获取，数据就毫无用处。集成必须足以管理批量信息和实时数据。\n\n-   **确认所有数据均标注了相关信息**\n    -\
    \   旧系统未在服务器中记录活动的时间戳或日期。为了快速识别对数据所做的更改，数据集成需要记录这些信息。\n\n-   **对所有传入数据保持警惕**\n\
    \    -   预期来自其他来源的数据是很自然的，但需警惕其可能已被感染或存在其他损坏。扫描所有传入内容，检查其兼容性和集成需求。\n\n-   **验证客户信息**\n\
    \    -   将传入数据与主数据库进行比较，以确认客户数据库准确且最新。\n\n-   **保留每次变更的历史记录**\n    -   有时需要回溯变更，这既可能是为了法定合规，也可能是因为集成未按预期工作。\n\
    \n-   **升级系统并评估流程**\n    -   不断寻找系统可能无法满足业务需求之处。定期升级系统，确保拥有数据管理和集成需求的最佳解决方案。\n\
    \n**数据仓库**。数据仓库是为组织存储其准备好的电子数据。数据必须以可靠、未受损、安全、易于检索和管理的方式存储。\n\n## 第 7 章 为企业进行数据分析\n\
    \n我们在本书中强调了企业在进行数据分析的重要性，但尚未确切解释如何收集数据。本章将专注于基本的数据收集，以便你实施一项有助于实现组织目标的战略。\n\n\
    ### 逐步指南\n\n#### 什么是数据收集？\n\n基本上，数据收集意味着实施你制定的数据收集方案。你已决定如何获取数据——无论是通过直接观察、访谈、概览、调查和测试，还是其他技术——现在你和/或其他观察者需要执行你的安排。不过，数据收集还涉及更多内容。你需要以适当的方式记录信息，并对数据进行分类，使其尽可能有用。\n\
    \n你收集信息的方式应与你打算如何分析和利用它相关联。无论你选择哪种策略，如果可能，记录应与信息积累同时进行，或紧随其后，以免丢失任何内容或记忆模糊。\n\n\
    #### 有效数据收集所需的一些功能：\n\n-   *从所有来源收集数据。*\n-   计算为获取准备好的定量数据以供审查所需的任何数值或比较运算。例如，这可能包括将数值观察结果输入图表、表格或电子表格，或计算一组数字的平均值（通常）、中位数（中间点）和/或众数（最常发生）。\n\
    -   对信息进行编码（解码信息，特别是将非数值表达的主观信息转换为可由特定软件项目处理的格式）。\n-   *以更容易操作的方式对数据进行整理。*\n\n\
    如何实现这一点取决于你的研究设计和评估问题。你可以按独立变量（成功指标）将观察结果归类，按个人或群体成员，按时间，按活动等。你可能还需要以几种不同方式对收集的信息进行分组，以便考虑不同变量之间的相互作用和关系。\n\
    \n数据中有两种类型的变量。独立变量（干预）是分析师或团队执行的状况，以检查其是否会产生变化并改善局势。这可能是一个项目、策略、框架或其他行动。因变量是可能由于独立变量或干预而改变的状况。因变量可以是一种行为或结果。\n\
    \n### 我们如何检查数据？\n\n检查数据意味着以能揭示其中存在的关系、设计、模式等的方式进行查看。这可能意味着对其进行统计运算，不仅可以告诉你变量之间似乎存在何种关系，还可以告诉你可以在多大程度上相信你所获得的答案。这可能意味着将你的数据与其他数据集（对照组、全州数据等）进行对比，从而从信息中得出一些结论。就你的评估而言，目标是获得准确的评估，以便更好地理解你的工作及其后果。\n\
    \n你将有两种类型的数据可以使用，尽管并非所有评估都必然包含两者。定量数据是指以数字形式收集或可解释为数字的数据，随后可以数学方式展示和分析；定性数据以描述、叙述、结论、引语、见解等形式收集，通常要么无法简化为数字，要么保留为叙述形式时被认为更重要或更具启发性。正如你可能预期的，定量数据和定性数据应以不同的方式进行分析。\n\
    \n#### 定量数据\n\n定量数据以数字形式收集。定量数据的示例包括：\n\n-   特定行为或状况的频率（速率和持续时间）\n-   调查结果（报告的行为、客户满意度评分等）\n\
    -   人口中具有特定特征的人的比例（患有糖尿病、肥胖、心脏疾病指标、教育水平等）\n\n数据也可以以非数值形式收集，并转换为准备好进行分析的定量数据。开发者可以为特定行为的强调级别分配数字。例如，开发者可以统计\
    \ Facebook“赞”或“评论”的数量。这类信息是否必要或有用的，取决于你的数据旨在回答的问题类型。\n\n定量数据转换为统计程序，例如计算事件重复的平均次数。这些计算由于数字是精确的，可以为不同问题提供决定性答案。定量分析可以识别与持续时间、频率、时间强度等相关的因变量变化。这允许与类似问题进行比较分析，例如邮政编码范围内人口数量的变化，或同龄女性之间购买行为的变化。\n\
    \n#### 定性数据\n\n与数字不同，定性信息被视为“软”数据，意味着它不能简化为特定结论。数字可能指示某人口的人口数量，但软数据可能通过客户的态度和外表告诉你购物者的压力水平。\n\
    \n定性数据偶尔可以转换为数字，通过统计特定事件发生的次数，或通过为重要性级别、客户满意度或在下单时功能是否易用分配数字\n\n"
