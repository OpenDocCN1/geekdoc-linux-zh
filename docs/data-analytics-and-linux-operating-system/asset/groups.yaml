    # 高级终端概念


    精通 Linux 的关键在于对操作系统中可用工具及其使用方法的深入理解。本章讨论的许多主题将侧重于更多任务以及如何完成它们，或者是对操作系统整体的一些质量生活（QOL）改进。


    文件的压缩和解压常常让 Linux 初学者感到困惑。这些工具通常已经安装，但必须使用命令行。此外，奇怪的 .tar 和 .gz 文件类型是 Linux 特有的格式，你可能会经常遇到。使用
    gzip 工具可以解压或压缩所有文件。在 Ubuntu 中预装了它，我们使用“tar”命令来访问它。要压缩一个文件夹及其包含的文件，请在终端中导航到该目录并输入“tar
    -czvf name.tar.gz foldername”。C 代表“创建”，z 表示“压缩 (gzip)”，v 表示“详细”，f 允许指定文件名。如果你想要更高的压缩率（但以时间为代价），请用
    -j 开关替换 -z 开关，用 gzip2 来压缩该文件夹。


    现在，使用“tar -xzvf name.tar.gz”可以提取同一个归档文件。你会注意到 -c 被 -x 取代了，这表示提取。再次强调，如果你处理的是 bzip2
    文件，请使用 -j 开关而不是其他。


    继续深入探讨高级终端概念，让我们谈谈一些可以节省终端操作时间的优质技巧。在输入命令或文件名时，在中间按一次 tab 键。此功能，即 Tab 自动补全，会猜测你正在输入的内容并补全短语的其余部分。对于文件，它将补全目录中显示的名称；或者根据你试图执行的操作来补全命令。Linux
    专家以及任何必须经常使用终端的人可能看起来像是以极高的精确度和速度输入他们想要的内容，但实际上他们只是在使用 Tab 自动补全功能。


    用户，尤其是管理员，会在 sudo 命令上花不少时间，因为他们的指令需要提升权限才能运行。但当输入长命令时忘记输入 sudo，你会因为不得不重新输入而感到恼火。相反，只需输入“sudo
    !!”，这是“超级用户再次执行”的简写。它慷慨地节省了重新输入整个命令的时间。


    重复命令的另一种方法是使用上下箭头。持续按上箭头会循环显示之前输入的命令。你还可以使用左右箭头编辑命令以更改其中包含的文本。


    最常被要求的终端技巧涉及复制和粘贴。尝试将一行粘贴到终端会导致出现奇怪的字符 ^v。键盘快捷键未在终端中配置为可用，因此显示了这种奇怪的组合。要实际粘贴，请右键单击并选择该选项；或使用
    shift+insert 键组合。以同样的方式复制，但使用 ctrl+insert 键。虽然从互联网上复制和粘贴终端命令可能是可以的（前提是你了解风险并知道命令在执行什么），但不要尝试从本出版物中粘贴。你所阅读的媒体格式可能会插入终端无法识别的特殊字符，所以最好不要复制和粘贴，而是应手动输入所呈现的任何命令。


    Linux 有一个隐藏功能，许多用户并不知情。当你访问该目录或输入 ls 时，文件会显示给用户，但实际上并非所有文件都可以以此方式查看。在 Linux 中，如果你以句号作为第一个字符来命名文件，它将被标记为隐藏文件。隐藏文件通常对普通用户不可见，它作为一种保护配置文件免受意外编辑/删除等方式的方法。要查看这些文件，我们只需在
    ls 搜索中添加 -a 标签。在 GUI 中，在目录中按 ctrl+h 以揭示秘密内容。当你创建脚本和其他配置文件时，考虑用句号隐藏它们，作为一种用户保护形式。


    终端中的任何命令都可以使用 ctrl+d 键组合中断或退出。使用它来停止冗长的进程，或退出你不理解的程序/命令。


    别名（Aliasing）是在终端中创建个人快捷方式的一种方法。别名可用于将长命令或一组小命令组合成单个用户定义的选项。正如名字所暗示的那样，别名是你指定的任何事物的不同名称。每个别名都包含在一个隐藏的配置文件内
    - 使用“nano ~/.bashrc”开始编辑它。因为它存在于用户的家庭目录中，每个别名仅对该用户有效。在文件底部，我们可以开始创建别名，如下例所示：


    ```

    alias gohome=''cd ~ && ls''

    ```


    输入“gohome”这个别名将目录更改为主目录并显示内容。创建别名时，必须严格遵循上述格式，这意味着命令和等号之间没有空格。多个命令在单引号内用“&&”分隔并串联起来。为了更健壮的别名，请添加一个函数。以下示例将
    cd 和 ls 组合成一个命令。


    ```

    function cdls () {


    cd "$@" && ls

    }

    ```


    编写完你的别名后，保存文件并重新启动计算机。然后你的新命令就可以使用了。


    我们编辑的那个文件，bashrc，是 Ubuntu 终端的配置文件。除了创建别名外，我们还可以使用它来定制终端设置，例如颜色、大小等... 一个快速技巧是通过移除
    # 并确保等号后面是“yes”来取消注释“#force_color_prompt=yes”。这将为终端添加颜色，使某些单词呈现不同颜色。当你打开终端，右键单击并选择配置文件，然后是配置文件偏好设置时，有更多选项可用。通过这里的标签页，你可以定制字体、大小、颜色、背景颜色等等。如果你打算大量使用终端，建议进行定制，因为熟悉你将要使用的工具会帮助你更舒适地工作。


    # I/O 重定向


    在正常的终端命令执行期间，“常规输入”（由用户输入，或从文件/属性/硬件读取）由命令输入并解析。有时命令还有“标准输出”，这是在终端中显示的返回文本。在“ls”中，标准输入是当前工作目录，而标准输出是文件夹的内容。


    输入和输出通常是直接的，但通过使用 I/O 重定向，我们可以用终端做更多事情。例如，“cat”命令（concatenate）后跟一个文件会将该文件输出到屏幕。单独运行
    cat 会打开一个解析器，其中输入的任何行都会立即输出（使用 ctrl+d 退出）。但使用 I/O 重定向热键（<, >, <<, >>, |），我们可以将输出重定向到另一个源，例如文件。“cat
    > test.txt”现在会将标准输出放入该新文件中。双符号表示追加，因此“cat >> test.txt”将把输出放在文件末尾，而不是擦除文件开头的部分内容。


    垂直线字符，或“管道”，使用另一种形式的 I/O 重定向，将一个命令的输出直接插入另一个命令的输入中。“ls | sort -r”将获取 ls 的输出并将其排序为反向列表。我们重定向了输出并将其交给另一个命令来完成此操作。


    最后，“grep”命令在 I/O 重定向中经常使用。Grep 可以在指定文件中搜索特定字符串并将结果返回到标准输出。使用重定向，此输出可以放入其他命令中。需要了解的
    Linux 一个有趣特性是，对象即文件，甚至包括硬件。所以我们的 CPU 实际上是一个内部存储相关数据的文件，我们可以使用 grep 和其他工具在其中进行搜索。这个例子相当高级，但这里有一个更简单的实例：


