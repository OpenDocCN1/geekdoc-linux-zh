    is to gauge the customer sentiment regarding a product or service. The fourth
    use for social media analysis is to enhance the products by offering web only
    resources and discounts. The fifth use of social media analysis is for producing
    products that are contrary to logic (like runners pulling the lining out of running
    shoes because it makes their feet too hot) but desired by the consumer.


    Social media analysis is similar to any other data analysis, but has specific
    needs to consider such as:


    #### Form the hypothesis


    Social media analysis is more about why something happened and less about reporting
    the event itself. Begin the analysis with of a circumstance or even with a question
    of why. Why did readers engage with this question but not respond to a similar
    survey on Facebook or Twitter? Examine the posting frequency and times you post.
    Are they optimal for your brand or product? For example, advertising for a food
    delivery would be much more effective at 5:00 than at 2:00 in the afternoon, as
    customers are hungry and tired when they leave work and want an instant solution
    to the dinner-hour dilemma.


    Utilize the information to identify new ways of sharing information that attracts
    increased reader traffic. For example, Twitter now allows Vine videos to be embedded
    into posts. A hypothesis for testing would be: Does the new addition to Twitter
    increase traffic to the website or just entertain the readers more fully?


    #### Move the Data to a Spreadsheet


    Start with identifying trends and patterns on the spreadsheet. From this data
    you can extrapolate issues and variances for exploration.


    #### Expand the Sample to Encompass as Much Data as you Possibly Can


    Expanding the sample can be accomplished in many ways, but here are two of the
    possibilities: changing the end date of the sample, or tracking the competitors
    also.


    #### Question the Results


    It is easy to determine a false correlation when there is more data than one needs.
    Just like proof-testing, it can be a quick resolution by finding data to support
    your anticipated and desired outcome. Continue to test the results to eliminate
    bias in the conclusions.


    #### Tools to Help Manage Social Media


    Posting to several social media outlets day by day is time consuming, but also
    necessary. Rather than devote several hours a day to maintaining social media
    updates, consider some of the following tools that take the drudge out of daily
    monitoring.

    Here is a list of recommended tools to help the business owner complete the task
    in less time. Some of these tools are free, but most require a paid subscription.


    - **Buffer, HootSuite, and Sprout Social**

    These tools allow you to log in one time and schedule the posts for the major
    social media outlets. You can perform more than one function at the same time,
    writing and scheduling a week''s worth of posts, analyzing the efficacy, and sharing
    information.


    - **SumAll, Social Express, Sociallight**

    These programs send the data to you instead of you having to go to them for retrieval.
    You get to choose what reports interest you for your business.


    - **Social Count, SharedCount, BuzzSumo**

    This program tracks your "shares" from the different URLs. You enter the URL and
    it spits out the "Shares" per day, week and month. This saves time so that you
    don''t surf from Website to Website seeking the information.


    ### Social Media Strategies for the Business Owner


    These are the most helpful tips for the small and medium business owner that is
    managing the business and the social media.


    - Use a business dashboard to consolidate your social media.

    - Complete all social media posts at the same time and schedule them ahead of
    time.

    - Watch the engagement of your posts.

    - Segment your audience for faster analysis.


    Social media is here to stay and gets bigger and more complex every day. Managing
    social media is now essential to maintain a presence on the web. Businesses that
    are ignoring social media with their heads hidden in the sand like ostriches are
    losing the opportunity for a new income stream. Online sales of products are increasing
    more every moment. In one minute, Amazon has over 4,000 new customers purchase
    a product. A savvy business owner will want to tap that potential customer base
    as quickly as possible.


    Social media analytics helps the business owner target customers that are already
    interested in the product or service promoted by the organization. With a little
    attention to the customer service needs of the consumer, a pathway may be discovered
    that opens the gateway for communication and sales through the Internet outlet.

    '
