  - '[PAGE 12]


    +   3. **Inventory and product analysis.** Using data analysis, a company can
    see what is popular on the shelves and what products need dusting off and moved
    on out of the store and off the valuable shelf space. Why do grocers’ place the
    most utilized products on the very top and very bottom shelves? They know those
