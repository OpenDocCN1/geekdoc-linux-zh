    \ gained to adjust your business and improve your service. Continuing to analyze\
    \ and evaluate the business goals and results will keep the business current and\
    \ an effective presence in the marketplace.\n\n## Chapter 8 An Organizational\
    \ Approach to Data Analytics\n\nThis chapter discusses the framework that needs\
    \ to be in place in the organization that incorporates big data into the corporate\
    \ culture. A workable analytics governance will enable the business to utilize\
    \ big data for an edge over the competition.\n\n## The Framework\n\nTo integrate\
    \ information technology, business intelligence, and analytics four dominant questions\
    \ must be under consideration:\n\n1. Are analytics a key component of the business,\
    \ in the same categories as finance, sales, product development, research and\
    \ marketing?\n2. Are the appropriate personnel in place?\n3. Do the personnel\
    \ have the ability for deep knowledge of the business needs?\n4. Is there a governance\
    \ structure in place?\n\nThis framework is referred to as the CSPG framework.\n\
    \n- Culture\n  - Does the business revolve around the data analytics or does analytics\
    \ take a backseat to marketing, R&D, and sales?\n- Staffing\n  - Is there adequate\
    \ staffing and is hiring of qualified staff a priority? Does the IT department\
    \ work on a shoestring budget or do they have the proper resources to conduct\
    \ big data analysis?\n- Processes\n  - If the analytics process is completed correctly,\
    \ data can be traded with like organizations without fear of contamination, allowing\
    \ multiple streams of information.\n- Governance\n  - Governance is a new concept\
    \ for businesses that have come recently to the table of data analytics. The governance\
    \ needs a structure that encompasses people, structure, and salaries so that the\
    \ IT department is not out of variance with the other departments.\n\n## Placement\
    \ of the Analytics Function in the Business\n\nThere are three models for placement\
    \ of the Data Analytics function:\n\n1. Placing the analytics department in a\
    \ central unit. The advantage of this location is that it is easy to obtain data,\
    \ integration into the company culture is simpler, and the data retrieval is faster.\
    \ The challenge for a centralized department can be the location (as an add-on\
    \ department it may be located away from the hub of decision makers), there may\
    \ be confusion as to whom the department reports, and the data analysts may be\
    \ so far away from the corporate culture that they cannot anticipate the business\
    \ needs.\n\nThe second possibility is to decentralize the analytics and place\
    \ analysts in each department throughout the company. This allows the analysts\
    \ to focus on the business sector in which they reside. The challenge is to work\
    \ together on company-wide projects that are not segmented and need all the analysts\
    \ focused on one problem set.\n\n2. The third option is a mix of the two previous\
    \ scenarios. This places the analysts in a centralized location but also deploys\
    \ analysts throughout the organization. This requires a very large staff of analysts,\
    \ which may be the biggest challenge for the business.\n\n### The Key Analytics\n\
    \nAnalytics is composed of models, infrastructure and operations. The models are\
    \ statistical or predictive or datamining that are originated from statistical\
    \ data. Key to the analytics process is the building of the models, which is usually\
    \ performed by the analysts or data scientists or statisticians.\n\nInfrastructure\
    \ is the software components, applications used and platforms utilized for data\
    \ management, data processing and decision making. The processes connected to\
    \ analytics infrastructure are data management, model deployment and multiple\
    \ analytics that must be incorporated in the business operations.\n\nOperation\
    \ are the processes that create the data used for models and actions for business\
    \ use. Data can be purchased, internal, external, or collaborative.\n\nThe Data\
    \ Analytics team must identify the internal and external relevant data, manage\
    \ the data, build the analytical models and introduce the models into the internal\
    \ systems. Most businesses organize these functions thusly: The business department\
    \ requests the model, the Analytics team constructs the model, the IT department\
    \ supplies the raw data, and operations launches the model. This brings us to\
    \ the why of analytics governance.\n\n## Analytics Governance\n\nThe three challenges\
    \ that businesses face when extracting big data are:\n\n1. Identifying the unique\
    \ needs for which the data will be used\n2. Obtaining the needed information\n\
    3. Deploying the analytics models into the organization\n\nThe analytics manager\
    \ must have enough authority to negate these challenges. The structure of governance\
    \ needs a mechanism for identification, communications and resolution of issues\
    \ stemming from data analysis problems. The analytics manager also needs the flexibility\
    \ to hire qualified and knowledgeable personnel.\n"
  mdcn: "\n网站。\n\n将定性数据转换为定量数据在很大程度上取决于人为因素。即使客户同意使用 1-5 的数字（1 代表非常不满意，5 代表极其满意）来评估客户满意度，关于\
    \ 2、3 和 4 在评估量表上的具体位置仍是一个问题。这些数字只能提供部分评估；它们没有提供关于客户评分“为什么”的信息。客户是因为货架上的产品库存、产品细节、店内氛围或音乐问题、店铺位置等而感到不满吗？\n\
    \n同样，在统计某种行为的具体实例时，统计者是否包含了那些只表现出部分行为的人（例如，那些在 Facebook 上点了“赞”但没有发表评论的人）？\n\n\
    定性数据可以传达定量数据中无法获得的特定知识，例如为什么某个销售促销活动有效，或者该活动如何在文化上与客户的群体发生冲突。（1962 年，雪佛兰公司对他们的新车型“Nova”在美国非常受欢迎，但在墨西哥几乎没有销量感到困惑。研究人员未能将“Nova”这个词翻译成西班牙语，而在西班牙语中它的意思是“没有去”。该名称的西班牙俗语意思是“不运行”。难怪墨西哥的销量会下滑！汽车更名为\
    \ Caribe 后，销量增加了。）\n\n评估定量和定性数据集通常都是有益的。\n\n## 收集和分析数据的步骤是什么？\n\n-   清晰设计和定义回答所需问题所需的测量指标。\n\
    -   在正确的时间框架内，进行所需时长的研究。\n-   根据数据的功能对数据排序；你将如何使用这些信息？\n-   如果可能且合适，将定性数据转换为定量数据。\n\
    -   使用图表和可视化图表（示例见第 10 章）使数据更易于理解。\n-   直观检查信息的模式以识别趋势和联系。\n-   在定性数据中寻找模式，就像在定量数据中一样。如果人们持续提及类似的问题，这些问题可能是理解问题和可行解决方案的关键。\n\
    \n通过以下类别之一**解释发现结果**：\n\n-   你的营销计划正在按计划执行，没有明显问题。\n-   你的营销计划对销售没有显著影响。\n-  \
    \ 你的营销计划对销售产生了负面影响。（可能是因为它冒犯了消费者或被认为很愚蠢。）\n-   你的营销计划结果喜忧参半。推广的产品销售良好，但之前受欢迎的产品销量可能下降了。例如，Secret\
    \ 除臭剂推出了一种非常受欢迎的新香型类别，但无香型产品的销量显著下降，因为忠实用户只是改变了偏好。\n-   如果分析显示你的营销项目有效，你有一个简单的选择：继续该项目或对其进行调整，以期增加销售。\n\
    -   如果分析显示该项目无效，解释会更加复杂。等式中缺少了什么？什么因素阻碍了期望结果的实现？\n\n分析和解释结果使流程形成闭环；现在你可以利用获得的知识来调整你的业务并改进你的服务。继续分析和评估业务目标和结果将使业务保持最新状态，并在市场上保持有效的存在。\n\
    \n## 第 8 章 数据解析的组织方法\n\n本章讨论了需要建立的组织框架，以将大数据融入企业文化。可行的分析治理将使企业能够利用大数据获得竞争优势。\n\
    \n## 框架\n\n要整合信息技术、业务智能和分析，必须考虑以下四个主要问题：\n\n1.  分析是否是业务的关键组成部分，与财务、销售、产品开发、研究和营销处于同等类别？\n\
    2.  合适的人员是否已到位？\n3.  人员是否具备深入了解业务需求的能力？\n4.  是否建立了治理结构？\n\n该框架被称为 CSPG 框架。\n\n\
    -   文化\n    -   业务是围绕数据分析进行的，还是数据分析在营销、研发和销售面前退居次席？\n-   人员配置\n    -   是否有足够的人员配置，雇佣合格人员是否优先？IT\
    \ 部门是在捉襟见肘的预算下工作，还是拥有进行大数据分析的适当资源？\n-   流程\n    -   如果分析流程正确完成，数据可以在类似组织之间交换而不必担心污染，从而允许多条信息流。\n\
    -   治理\n    -   对于最近才进入数据分析领域的企业来说，治理是一个新概念。治理需要一个涵盖人员、结构和薪酬的结构，以便 IT 部门不与其他部门脱节。\n\
    \n## 业务中分析职能的定位\n\n分析职能的定位有三种模式：\n\n1.  将分析部门放在中央单位。这种位置的优势在于容易获取数据，更容易融入公司文化，并且数据检索速度更快。集中式部门的挑战可能在于其位置（作为附加部门，它可能位于决策者中心之外），可能存在关于部门向谁汇报的混淆，并且数据分析师可能远离企业文化，无法预见业务需求。\n\
    \n    第二种可能性是去中心化分析，并在公司各部门中放置分析师。这允许分析师专注于其所在的业务领域。挑战在于需要协作完成未细分且需要所有分析师集中在一个问题集上的公司级项目。\n\
    \n2.  第三种选择是前述两种情况的混合。这将有分析师放在集中位置，同时也将分析师部署到整个组织中。这要求大量的分析师员工，这可能是企业最大的挑战。\n\n\
    ### 关键分析\n\n分析由模型、基础设施和运营组成。模型是从统计数据中衍生的统计模型、预测模型或数据挖掘。分析过程的关键是构建模型，这通常由分析师、数据科学家或统计学家执行。\n\
    \n基础设施是用于数据管理、数据处理和决策的软件组件、应用程序和平台。与分析基础设施相关的流程包括数据管理、模型部署以及必须整合到业务运营中的多种分析。\n\
    \n运营是创建用于模型和业务操作的数据的过程。数据可以是购买的、内部的、外部的或协作的。\n\n数据分析团队必须识别内部和外部相关数据，管理数据，构建分析模型，并将模型引入内部系统。大多数企业按以下方式组织这些功能：业务部门请求模型，分析团队构建模型，IT\
    \ 部门提供原始数据，运营部门启动模型。这就引出了分析治理的原因。\n\n## 分析治理\n\n企业在提取大数据时面临的三个挑战是：\n\n1.  识别数据将用于哪些独特需求\n\
    2.  获取所需信息\n3.  将分析模型部署到组织中\n\n分析经理必须拥有足够的权力来消除这些挑战。治理结构需要一个机制，用于识别、沟通和解决源自数据分析问题的事项。分析经理还需要灵活性来雇佣合格且知识渊博的人员。\n\
    \n"
