    Linux 系统长期健康运行。你甚至可能注意到，安装和更新系统无需重启；这一特性有助于实现 Linux 计算机的长时间运行时间和稳定性。最后，移除应用程序需使用
    "apt-get remove" 后跟软件包名称。


    要运行我们安装的程序，既可以通过应用网格（Dash）搜索，也可以直接在终端中输入软件包名称。输入 “chromium-browser” 即可启动，效果等同于双击其图标。某些程序必须通过命令行输入软件包名称来启动，因为它们不会出现在
    Dash 搜索中。总的来说，利用终端可以节省时间，也是逐渐摆脱缓慢且笨重的图形用户界面的好方法。


    轻松安装和管理软件包是 Linux 的一项功能，熟练掌握它能极大提升你的使用体验。还有第三种安装软件包的方法，涉及从互联网下载并启动 .deb 文件。某些软件以这种格式打包，它们的作用类似于
    .exe 文件，只需双击即可开始安装过程。


    ## 更多终端命令


    以下是几个你应该内化并应用到系统中的基本终端命令。充分理解基础将为后续学习打下良好基础。


    - `cp` – “cp image1.jpg image2.jpg” – 将第一个参数复制（并重命名）为第二个提供的参数。使用 `-r` 开关复制目录。

    - `mv` – “mv cat.jpg /home/Pictures” – 将指定文件移动到给定目录。

    - `shutdown` – “shutdown -h now” – 关闭计算机。`-h` 是表示“停止”的标签，你也可以使用 `-r` 重启。Now 指执行前的等待时间。

    - `date` – “date” – 显示当前日期和时间。

    - `free` – “free -g” – 显示当前程序的 RAM 使用情况。

    - `du` – “du -h” – 提供 HDD 使用情况。

    - `ps` – “ps” – 显示使用 CPU 时间的活动进程。

    - `touch` – “touch memo.txt” – 用于在当前目录中以指定名称创建一个新的空白文件。

    - `ifconfig` – “ifconfig” – Linux 中 `ipconfig` 的等价命令，显示网络信息。


    某些命令具有关联的“标签”或“开关”。这些是破折号后面的字母。它们的作用各不相同，学习哪些开关适用于何种用途最好通过该命令的手册页查找。请参阅高级部分了解如何打开手册。


    命令行中最有用的程序之一是 `nano`，它是一个简单的文本编辑器，可用于编辑文件并快速修改设置或脚本。通过在命令行中输入 “nano” 即可访问。你可以按需输入文件，然后按
    ctrl+x 保存并退出。保存时，需指定文件名和扩展名；notes.txt 将创建一个名为 “notes” 的文本文件。或者，你可以通过输入 “nano notes.txt”
    来编辑文件。在该示例中，我们在编辑器中打开 notes 并显示其可编辑的内容。


    Nano 可能非常简洁，但它毫无疑问功能强大，对于快速更改和创建文件来说是一个节省时间的工具。


    ## 连接 Windows / Mac 计算机


    Windows 和 OSX 计算机具有内置的网络功能，如工作组、域、共享等。尽管 Windows 服务器计算机主导着网络基础设施，但将 Linux 计算机集成其中相对容易，正确的设置可以让你查看
    Windows 共享并加入企业域。


    相互通信的第一步是安装 “samba” 软件包。可以通过软件中心查找，或输入 “sudo apt-get install samba” 获取并安装必要的软件。


    从 Ubuntu 机器向其他计算机共享文件涉及创建 samba 共享。Samba 运行在其他流行文件共享方法所使用的相同协议之上，因此从 Ubuntu 机器共享的文件可以轻易地在
    Windows 上被看到。安装 samba 后，使用 “sudo nano /etc/samba/smb.conf” 开始编辑配置文件。在文件底部添加以下行：


    ```

    [share]


    comment = File Share from Ubuntu


    path = /srv/samba/share

    ```


    ```

    browsable = yes


    guest ok = yes


    read only = no


    create mask = 0755

    ```


    现在，创建 “path” 中指定的文件夹（sudo mkdir -p /srv/samba/share）并设置权限（sudo chown nobody:nogroup
    /srv/samba/share/），以便任何人都可以访问其内容。将你想共享的任何文件放入该目录，然后重启服务（sudo restart smbd, sudo
    restart nmbd）以使共享生效。最后，登录你的另一台计算机并导航到网络共享。在 Windows 中，它们将出现在资源管理器的左侧面板中。如果共享未自动出现，请在文件路径框中输入
    IP（使用 ifconfig 查找 Ubuntu IP）。现在，你可以从其他操作系统访问 Ubuntu 的文件。


    你可能还需要在 Ubuntu 计算机上查看来自其他操作系统的文件。首先，打开 Ubuntu 文件管理器。从菜单栏中点击 “文件”，然后选择 “连接到服务器”。在弹出的框中，输入你想访问的共享
    URL。它可以是 ftp 地址（ftp://ftp.test.com）、http 地址（http://test.com）或共享地址（smb://share/Folder）。无需额外的硬件或设置，你可以通过这种方式查看文件。


    最后，加入域（如 Active Directory）允许你的计算机与网络上的其他操作系统交互并实现其他面向业务的任务。无论是小型家庭网络，还是将 Linux
    计算机添加到企业域，过程都是相同的。安装几个额外的软件包（realmd, sssd, sssd-tools, samba-common, samba-common-bin,
    samba-libs, krb5-user, adcli, packagekit）。安装过程中会要求输入你的域名。请全部大写输入。输入 “kinit -V
    adminname”，将 adminname 替换为域中实际的管理员账户名。输入密码后，你将被认证到该域。现在，使用 “realm --verbose join
    -U adminname domainname.loc” 加入域。


    如果失败，意味着我们设备上的 DNS 配置有误。输入 “echo ‘ad_hostname = nix01.domainname.loc’ >> /etc/sssd/sssd.conf”，然后
    “echo ‘dyndns_update = True’ >> /etc/sssd/sssd.conf”，最后使用 “service sssd restart”
    重启以应用这些新设置。第一行设置了我们计算机的 FQDN，因此该行需根据我们的域设置进行修改。成功重启并正确配置后，终端将显示已加入域。使用 “realm
    list” 测试这一点。连接到 AD 后，你可以从服务器管理该 Linux 设备！


    然而，对于大多数用户而言，创建共享和加入域远远超出了连接需求。简单的文件共享通过 USB 驱动器传输或 Dropbox 等服务更好。事实上，Dropbox
    可以安装在三大主要操作系统上，文件可以在它们之间同步，无需额外设置。在 Ubuntu 中，你可以直接从网站下载 .deb 文件，从软件中心安装，或使用 “sudo
    apt-get install nautilus-dropbox” 获取该应用程序。在 Dropbox 文件夹中放置你想在计算机之间传输的任何文件，它将在你拥有的所有其他
    Dropbox 计算机上自动下载和更新。


    当你将其他操作系统连接在一起时，使用它们并不复杂。只要计算机在同一网络上，你就可以创建文件共享、将它们加入域，或使用 Dropbox 等简单服务。


    '
