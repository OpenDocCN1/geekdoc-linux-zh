  md: '# Acknowledgements


    My entire career—indeed, modern life for every one of us—would not have been possible
    without those giants who wrote entire operating systems using ed and its predecessors.
    We owe those giants a debt of gratitude.


    More personally, though, I want to thank my technical reviewers who were kind
    enough to share their immense edpertise: Tim Chase, Josh Gross Mosieczuk. Any
    errors in this book crept despite these fine folks'' best efforts.


    Many examples in this book were inspired by the fine presentations at the ed(1)
    Conference, available on Twitter at https://twitter.com/@ed1conf and on Mastodon
    at https://bsd.net/@ed1conf. Attending the world''s premier conference for text
    editing at 300 baud will help keep your ed skills razor-sharp.


    After receiving rare but tediously ongoing complaints about my use of mixed male
    and female third-person pronouns in my technology books, I''ve prepared two editions
    of this book. Any third-person singular pronouns that appear in the standard edition,
    for normal people, are female. Those who believe that women don’t belong in tech
    books are welcome to purchase the special “Manly McFace” edition, where all third-party
    singular pronouns are masculine. To compensate for this edition''s much smaller
    market, though, the Manly edition is pricier than the standard edition. That’s
    basic economics.


    Also, one dollar of my proceeds from each sale of the Manly McFace Edition will
    be donated to my local chapter of Soroptimists International.'
