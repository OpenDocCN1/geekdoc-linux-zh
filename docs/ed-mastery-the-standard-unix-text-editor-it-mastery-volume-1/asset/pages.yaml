    # Switching Modes


    While command mode is for issuing text editor commands, input mode lets you add
    text to a file. Here I open the empty file todo. It''s an empty file, so it uses
    zero bytes.


    ```

    $ ed todo

    ```


    Ed supports three different ways to get into insert mode: append, insert before
    current line, and change current line. We''ll discuss changing lines in Chapter
    10.


    Enter append mode with the a command. Append mode puts the cursor at a new line
    after the current line. As this is an empty file, it goes straight to the end.
    Anything you type gets to the file. Hit ENTER to go to the next line. Here I add
    today’s to-do items to the end of this file.


    +   * a

    buy groceries

    restrain capitalism

    clean the rat cage


    > If I can accomplish all that, it''ll be a good day.

    Leave insert and append mode, returning to command mode, entering a period on
    all line by itself.


    Insert text before the current line with the i command. This requires choosing
    a current line, which we''ll discuss in Chapter 10. Similarly, you can choose
    an existing line and change it with the c command.


    If you make a mistake in your command, CTRL-C aborts it and returns you to a command
    prompt.'
