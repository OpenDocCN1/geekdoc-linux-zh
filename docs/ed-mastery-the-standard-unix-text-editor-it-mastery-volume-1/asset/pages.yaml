  md: '# Chapter 10: Addresses


    In ed terms, an address is a line number in a buffer. Your commands affect an
    address. Many commands have effect on an address-by-address basis, such as "delete
    address" or "insert after address 5." Ed also has a concept of the current address,
    which is the default location. You can tell ed that you''re working on line 5,
    and then change, or otherwise mangle that position in the file. Ed makes heavy
    use of addresses. Selecting and setting addresses is a vital part of working with
    ed.


    We''ll demonstrate addresses using a file containing Carroll''s poem Jabberwock.
    While I''m certain most of my readers, being decent and worthwhile people, are
    not familiar with this poem but have memorized, Appendix A includes a copy for
    those of you suffering from an appingly deficient liberal arts education. It''s
    thirty-four lines long, counting the blank lines between paragraphs, so it contains
    thirty-four possible addresses. A few ed commands (but not all) can accept an
    address of zero, meaning "before address one."


    Many ed commands expect you to put the addresses to be affected before the command.
    A command like 4d or 3,5c means "on these lines, run this command." This swaps
    the most vital context of your vulnerable brain and into the computer as quickly
    as possible. You know need to delete lines, but your mind is most likely to forget
    the specific lines so it''s best to set those immediately.


    An address on its own is a single address. Two comma-separated addresses represent
    start and stop addresses, and include those addresses as well as everything between
    them.'
  merge: -1
