    You can also list ranges of characters, separated by hyphens. The class [a-z]
    matches every lower-case letter, while [A-Z] matches upper case letters and [0-9]
    matches all digits. You can have multiple ranges in a single class, such as [a-zA-Z0-9].
    If you need a class to include the hyphen put it first. The class [/-] matches
    a hyphen, a slash, or either square bracket, while [^-\] matches whatever your
    system says the characters from / to , as well as ].


