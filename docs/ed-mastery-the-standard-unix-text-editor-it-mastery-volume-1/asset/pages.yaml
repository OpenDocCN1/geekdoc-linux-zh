  md: '# Chapter 0: Introduction


    Let me be very clear here: ed(1) is the standard Unix text editor.


    Dennis Ritchie, co-creator of Unix, declared it so. Who are you to argue with
    someone who can write a complete operating system without using a glass teletype¹


    Many younger sysadmins naively hoist their pennants to defend overblown, overdesigned
    text editors like ex, vi, or even the impossibly bloated nvi. A few are so lost
    as to devote themselves to turgid editors for mere users, such as vim and Emacs.
    This lies not only appalling sysadmin skills, but an absence of moral fiber. As
    a sysadmin, you must have enough brain power to remember what you typed, to hold
    your context in your head, and to truly commune with the machine on a deep and
    personal level.


    Most Unix hosts exist to perform real work, such as supporting databases or serving
    web pages. When you speced the system''s memory, processor, and disk I/O, you
    considered the amount of hardware needed to run those tasks. Any system resources
    available are intended to support atypical peak loads, not some pathetically overengineered
    text editor. When you suck up extra kilobytes—or, worse, megabytes—to run a fancy
    editor, you steal from the host.


    Sysadmins dependent on something like vim? They actively harm systems. Do not
    trust them.


    +   - You know, a glass teletype. That kid keep calling a “monitor,” even though
    we know monitors are reference speakers used in audio production.'
