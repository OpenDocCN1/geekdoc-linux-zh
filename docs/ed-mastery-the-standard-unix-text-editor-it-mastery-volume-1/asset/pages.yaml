- img_proc: true
  md: '# Ed Mastery


    If you want to hide the bytes read and written, use ed''s -s flag.

    You want something more complicated? A command file that underlines the last match
    of a regex in a line, as we did in Chapter 110, has one minor difference between
    the commands in the last chapter and what you need for a command script. See if
    you can spot it.


    ```

    g/the/t.\ns/\(\*\)\(the\).*/x\1\n2/\ns./=g\ns-s./ /g\ns^/\\njwq

    ```


    What''s the difference? A script should automatically save its work, so I added
    wq.

    opting ed for routine use prevents many errors only possible in so-called “visual”
    editors.


    # Ed in Shell Scripts


    While command files are fine for one-off jobs, sometimes you want to integrate
    ed into a more complicated workflow. While you could write a shell script that
    calls your command file, there''s no reason not to integrate those commands into
    the script.


    Suppose you have a whole bunch of we sites running Wordpress. (I know you wouldn''t
    serve your content in such an unseemly way, but most of your customers probably
    can''t handle wholesome, elegant like Usenet.) You need to deploy an application
    firewall like Wordfence across the whole lot of them. Wordfence requires changes
    to each site''s .htaccess file. You could make a whole bunch of error-prone manual
    edits, or use ed to systematically and reliably make these edits for you.'
  merge: -1
  pgno: 89
- img_proc: true
  md: '# Chapter 111: Scripting


    First, have the script find all of the files you need to change.


    ```

    #!/bin/sh


    for x in /var/www/*.htaccess

    do


    Now use an echo statement to provide ed commands. Just to be sure, I set an address
    before inserting my new content before line 1

    echocho "1"

    # Wordfence WAF

    <Files ".user.ini">

    <IfModule mod_authz_core.c>

    Require all denied

    </IfModule>

    <IfModule mod_authz_core.c>

    Order deny,allow

    Deny from all

    </IfModule>

    </Files>


    # END Wordfence WAF

    .

    w" | ed $x

    done

    ```


    At the very end, I call ed on the target file and send the contents of my echo
    statement into the command.


    That''s it. We''re done!

    You could use a “here” document instead, if you fear pedants whose sole reason
    for living is to shriek about unnecessary uses of cat(1) and echo(1). At least
    use an EOE (End of Ed) marker, though.'
  merge: -1
