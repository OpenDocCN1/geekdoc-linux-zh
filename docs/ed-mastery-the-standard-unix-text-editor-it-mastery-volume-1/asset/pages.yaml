  md: '# HP


    ?


    I''ve confused ed. Let''s get detail.


    # h


    invalid command suffix


    Ed sees that I''ve used the h command and added the p suffix. An ed command suffix
    is much like a command-line argument; it modifies the command. The h command doesn''t
    take p as a suffix, so ed spits an error in your face and declares you unworthy.
    Instead, enter each command separately.


    ```

    $ ed jabberwocky.poem

    ```


    963


    # H


    # P


    *


    You now have verbose errors and the command prompt. As you''re just learning ed,
    many of the examples in this book are run with verbose errors and with the command
    prompt. It wastes ink, but you''re worth it.


    Leave ed with the q command.


    *q


    Set an alternate prompt when starting ed, using the -p flag.


    ```

    # ed -p jabberwocky.poem

    ```


    You might need to quote your prompt, especially if you put a space between -p
    and your prompt. Prompts have special meaning in the shell, as * and >, will cause
    problems otherwise. For your own edification, try ed -p * jabberwocky.poem and
