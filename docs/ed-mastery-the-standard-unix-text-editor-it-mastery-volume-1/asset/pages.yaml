  md: '# Chapter 1: Ed Essentials


    Everything’s perfectly clear now, right? Probably not, but we’ll discuss addresses
    in Chapter 10.


    If you have an unlimited ink budget, you could enable verbose error messages.
    Enter H by itself to toggle verbose error messages on and off.


    # H


    Ed echoes your command to the printer. Now try ENTER again.


    ?ninvalid address


    Turning on verbose error messages by default wastes both paper and reading time,
    but we’ve all had that experience where we stare at our command for far too long
    trying to figure out what we did wrong. We all need to learn.


    Another command you might find useful is turning the command prompt on and off.
    The ed command prompt is a single asterisk. It’s useful when you’re reviewing
    old printouts and need to identify your commands, or if you’ve got a fancy system
    with a video terminal. Enter P to turn the command prompt on or off.


    # P


    If you’re using a video terminal, you’ll see the command prompt straight away.
    Printer users will get the command prompt in the line that displays their next
    command.


    Enter commands individually. Some of those commands, as for regular expressions
    (Chapter 101) can be very complicated and contain many characters, but each command
    needs its own line. Here I try to simultaneously turn on verbose error messages
    and the command prompt.'
