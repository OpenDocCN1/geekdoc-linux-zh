  md: 'overwhelmingly appear in substitutions. Ed recalls subexpressions the order
    you define them. Your first subexpression is backreference one, the second backreference
    two, and so on. Indicate a backreference with a backslash and its number, such
    as \1, \2, and so on.


    Our sample regex, /(.*), tells Ed to remember one subexpression. There''s only
    a single backreference, \1.


    How would you use a subexpression and a backreference? You might want to search
    for every line that includes opening and closing quote marks. Human beings are
    notoriously inconsistent, so those strings use either single or double quotes.
    I define a character class with both sorts of quotes, [''"\]. That class includes
    parentheses to declare it a subexpression: ([''"\]). We could have any number
    of characters after that, up until the next appearance of whatever character matched
    the subexpression: .*. Whatever character we found in the subexpression is our
    first backreference, or \1. Put it all together into the regex ([''"\\).*\1. I
    want to use this in a search command, so I''ll need to backslash-escape the parenthesis
    to tell ed this is a subexpression: \([''"\\).*\1. Use the g command to print
    the lines matching this regex.


    ```

    *g/[''"\\].*\1/

    ''bleeeeeep''

