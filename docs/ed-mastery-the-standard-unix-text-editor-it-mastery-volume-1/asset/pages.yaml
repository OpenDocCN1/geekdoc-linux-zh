  md: "# Chapter 111: Scripting\n\nIf you're happy with the results, edit the command\
    \ file so that it will save the processed file.\n\n```\n$ ed dup.ed\n14\nP\n*H\n\
    *,n\n1\ng/the/t.\n2\tP\n3\\Q\n```\n\nConsider the necessary changes. On line 3\
    \ you longer want to quit unconditionally; rather, it's time to save and quit.\
    \ You also don't need to view the results of the transformation, so line two can\
    \ get deleted. Start editing at the bottom, so that your line numbers remain consistent\
    \ with the earlier printout as long as possible.\n\n```\n*3s/Q/wq\nwq\n```\n\n\
    That replaces the Q with wq. Ed displays the modified line. I could have also\
    \ used the c (change) command, but a little regex practice never hurt anyone.\
    \ Now kill line two, save, and quit.\n\n```\n*2d\nwq\n```\n\nLet's see what the\
    \ script shows now.\n\n```\n$ ed textfile < dup.ed\n179\n266\n```\n\nEd read 176\
    \ bytes and wrote 266. Your text file has been changed—and best of all, by editing\
    \ with ed, there's no possibility that a slipped arrow key would mess up the command\
    \ that performed the transformation. All you changed was the save routine."
