  md: '# Commands and Searches


    One powerful feature of searches and regular expressions is that you can run commands
    after a search. Suppose you want to duplicate every line that matches a regular
    expression. As you''ll be changing the file, start with a plain search to be your
    regex matches the stuff you think it''ll match.


    ```

    *g/there/n

    5 there

    7 thereafter

    10 4 theremin

    ```


    That looks right. Now use the t command to copy the line, but use a destination
    address of “.”—the current line. This will insert the copy right after the current
    line. Add the n command to print the affected lines.


    ```

    *g/there/t. n

    6 there

    9 thereafter

    13 4 theremin

    ```


    Note the line numbers. We''ve duplicated the matching lines on these new lines.


    This feature is most useful combined with substitutions, which we''ll discuss
    next.


    > Ed is not a primitive AI from Star Trek. You can''t make its head explode via
    recursion or paradox—it duplicates each line once and moves on.'
