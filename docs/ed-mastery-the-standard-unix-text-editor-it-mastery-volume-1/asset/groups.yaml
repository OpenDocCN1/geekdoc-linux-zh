    ### Multiple Substitutions


    You used a regex search to target your substitutions, but that doesn''t mean you
    must use that regex in your substitution. Ed lets stack multiple substitutions
    after a search, permitting complicated data transformations in a single command.


    Go back to Chapter 101 for a moment, where we tried out to match strings containing
    two to five es in a row. That turns out to be difficult, because regex can match
    entries. A string of six es is only two groups of three es, after all. Realistically,
    though, we performed that search because we want to transform that data in some
    way. Stacking substitutions after a search can let you perform myriad transformations
    without the weakness of resorting to young whippersnapper tools like sed(1).


    I have a text file containing occasional corrupt data. Words contain either two
    or fewer es in a row, or greater than five. If a word contains strings of three,
    four, or five es in a row, those strings should be replaced with two es. If it
    has one, two, six or more es in a row, I want to leave it alone.


    This takes careful thinking about our regular expressions. Identifying strings
    with a limited range of characters requires identifying what''s on each side of
    the characters of interest. There''s basically three options: the es can be at
    the beginning or end of the word, or they can be in the middle. We''ll need a
    regex and substitution for all three cases. Again, as we discuss the regex I''ll
    skip the backlash escapes for clarity. They''ll go into the ed command line.


    For the first case, where the string of es are at the end of the line, use the
    not-e class ([^e]) to identify the beginning of the e-string. Add the regex for
    three to five: e{3,5}. Anchor the regex to the end of the line with $. That gives
    us a substitution regex of [^e]e{3,5}. We want to replace with whatever the not-e
    class matches, plus two es. Remembering the not-e matched requires a subexpression,
    so add the parenthesis around [^e] to create ([^e])e{3,5}. We replace this with
    the backreference and two es, or \lee. The final substitution looks like s/([^e])e{3,5}$/\lee/


    If the string of es are at the beginning of the line, we basically reverse the
    end-line regex. Use the caret (^) to anchor the regex to the front of the line.
    Add the e{3,5} regex for three to five es right after the caret, and use the not-e
    class in a subexpression: ([^e]). That gives us regex of ^e{3,5}(([^e]). We to
    replace this with two, plus whatever the not-e subexpression matched, giving us
    ee\1. The final substitution statement looks like s/^e{3,5}(([^e])/ee\1/


    ## Chapter 110: Substitution


    Having a string of e in the middle of the line steals from both of the previous
    regexes. We need subexpressions for not-e before and after the string of es, with
    the three-to-five es in the middle. That gives us ([^e])e{3,5} ([^e]). With two
    subexpressions we need two backreferences in the substitution, or \lee2. The final
    substitution statement looks like s/([^e])e{3,5}(([^e])/\lee2/.


