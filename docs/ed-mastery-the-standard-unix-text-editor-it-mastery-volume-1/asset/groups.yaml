    ## Address Ranges


    Ed can perform operations on multiple lines simultaneously through two special
    addresses, the comma (,) and the semicolon (;).


    The comma (also available as %) represents the whole file. It doesn''t do anything
    by itself—you can''t set the current address to “the whole file,” but combined
    with another command you can perform actions on the whole file at once. Here I
    combine the comma with the p command to print the entire file.


    + *P

    ‘Twas brillig, and the slithy toves

    Did gyre and gimble in the wabe:

    All mimsy were the borogoves,

    And the mome raths outgrabe.


    > Beware the Jabberwock, my son!

    The jaws that bite, the claws that catch!

    Beware the Jubjub bird, and shun

    The frumious Bandersnatch!”


    Not only does this waste a lot of paper, everyone within hearing hearing distance
    of your line printer will know that you''re either too lazy to go through the
    earlier parts of the roll to find a copy, or you have haste.


    The semicolon represent the current address to the end of the file, just .., $.
    Suppose you want to display the last nine lines of the file—two stanzas of the
    poem. The file is 34 lines long, so you want lines 26 to 34. Set the current address
    to 26 and send the rest of the file to the printer.


    + *26

    “And hast thou slain the Jabberwock?

    *;P

    “And hast thou slain the Jabberwock?

    Come to my arms, my beamish boy!

    O frabous day! Calloooh! Callay!

    He chortled in his joy.


    ‘Twas brillig, and the slithy toves

    Did gyre and gimble in the wabe:

    All mimsy were the borogoves

    And the mome raths outgrabe.


    Yes, you see line 26 twice. You''re clearly a tree-hater to print all this, though
    so it furthers your goals.


    If you change your address to a range of addresses, your current address becomes
    the last address of the range.


    ## Relative Addresses


    You can also access lines via relative addresses. A relative address is a number
    of lines before or after the current address, indicated by a plus (+) or minus
    (-) sign. There’s lots of good reasons to do this.


    *30


    I set my address and ed shows me the contents—a blank line.

    Where exactly in the poem am I?


    *-2,+2p

    O frabious day! Callooh! Callay!"

    He chortled in his joy.


    ‘Twas brillig, and the slithy toves

    Did gyre and gimble in the wabe:


    Ah, that’s where.


    Yes, I could do the same thing with a command like 28, 32p.

    Relative addresses are just one of ed’s many user-friendly conveniences.


    A single minus or plus sign on its own means one. The command -p means “print
    the previous line,” while ~, +p gives one line of context on either side of the
    current address.


    ## Scrolling


    The scrolling feature is how ed condescends to assist those folks who insist on
    relying on a “monitor.” The z command tells ed to scroll from the next address
    to as far as the terminal allows.


    The standard terminal can display 24 lines at a time. Let’s see how scrolling
    works. Start at the top of Jabberwocky.


    + *1

    ’Twas brillig, and the slithy toves


    Ed prints the line at this address. Now scroll by running z.


    > *z

    Did gyre and gimble in the wabe:

    All mimsy were the borogoves,

    And the more haths outgrabe.

    ...


    Ed starts with line two, because you’ve already seen line 1 and surely you can
    remember what you just read, right? The output continues until it fills the terminal,
    twenty-four lines later.


    He left it dead, and with his head

    He went galumphing back.


    - Want to see more of the buffer? Hit z again.

    To start scrolling at a particular line, put the address before z.

    Maybe you want the scroll to include line 1.


    + *1z

    ’Twas brillig, and the slithy toves

    Did gyre and gimble in the wabe:

    ...


    To scroll a reduced number of lines, enter the number of lines you want to show
    after z. Here I scroll the third verse of Jabberwocky. Each verse is four lines
    long followed by a blank line. We want addresses 11 through 14, also known as
    11 and the three addresses after 11.


    ## *11z3


    He took his vorpal sword in hand;

    Long time the manxome foe sought--

    So rested he by the Tumtum tree

    And stood awhile in thought.


