    address of “.”—the current line. This will insert the copy right after the current
    line. Add the n command to print the affected lines.


    ```

    *g/there/t. n

    6 there

    9 thereafter

    13 4 theremin

    ```


    Note the line numbers. We''ve duplicated the matching lines on these new lines.


    This feature is most useful combined with substitutions, which we''ll discuss
    next.


    > Ed is not a primitive AI from Star Trek. You can''t make its head explode via
    recursion or paradox—it duplicates each line once and moves on.

