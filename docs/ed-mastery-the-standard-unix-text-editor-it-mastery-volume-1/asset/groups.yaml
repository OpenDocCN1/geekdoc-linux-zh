    ## 部分下划线


    下划线很有用，但可能你并不想下划线整行。也许你只想下划线行中匹配正则表达式的部分。这并没有那么难实现。我们将从下划线命令开始并对其进行修改。


    我们需要将复制的行拆分为将变成空白的内容和将变成下划线的内容。虽然处理这个问题有很多方法，但我的方法是在替换过程中通过插入换行符来分割行。为了清晰起见，我掉了转义反斜杠，因为剩余的反斜杠是重要的。


    `s/(.*)(the).*/x\1\2/`


    替换中的正则表达式部分包含两个子表达式。第一个是我们目标正则表达式之前的所有内容 (.*)。第二个是正则表达式本身 (the)。正则表达式还有第三部分 ,.*，代表所有内容。第三部分不是子表达式，所以
    ed 不会费心记住它。（严格来说，第三部分并不是必要的，但我发现，在几天或几年后阅读自己的代码时，明确地表示“这里可能还有东西”会更容易。）


    ## 第 110 章：替换


    现在考虑替换部分。如果搜索词首先出现，我们将得到一个空的反引用。此命令的后续部分假设这里有一些内容，因此无论如何我们在行开头放置一个字母 x。我们对第一部分有一个反引用并跳转到换行符。这个换行符并不是“命令在换行继续”的语句；相反它被插入到我们的替换中。ed
    可以区分这种区别，因为换行符出现在替换的中间。我们正在将行分成两行。


    在下一行，第二个反引用引入了所搜索的文本。结合之前的搜索，我们的缓冲区将变得像这样：


    | 1 the |

    | 2 x |

    | 3 the |

    | 4 but then |

    | 5 xbut |

    | 6 then |


    所有匹配我们正则表达式的内容都会被拆分成三行一组。每组的第一行是原始行。第二行是正则表达式匹配之前所有内容的副本，前面加了一个“x”。第三行是匹配正则表达式的字符串。正则表达式匹配之后的所有内容都会被丢弃。


    在我们的第一组三行中，第二行只包含一个“x”，因为正则表达式匹配之前没有任何内容。第三行包含了匹配我们正则表达式的内容。


    在第二组三行中（第4-6行），第5行显示了正则表达式匹配之前出现的内容，但前面加了“x”-第6行显示了正则表达式匹配。


    在每次替换之后，我们的地址被设置为三行中的最后一行。那是匹配我们正则表达式的截取文本块。使用非常简单的替换 `s/./=g` 将这些每个字符转换为等号。我们需要末尾的
    g 命令，以便每个匹配项都被转换为等号，而不仅仅是第一个。这使我们的文本如下：


    ```

    the

    x

    ===

    but then

    xbut

    ===

    ```


    这就是我们的等号下划线，但它们需要适当的间距来置于我们的术语下方。这就是为什么我们保存了“正则表达式之前的内容”块，即每三行组的第二行。使用相对地址（——领先的负号——对*上一个*行执行替换，将每个字符替换为空格，如
    `-s/./ /g`。处理某行会将你的地址更改为该行。这产生了如下行：


    ```

    the

    ===

    but then

    ===

    ```


    三元组中的第二行看起来是空的，但包含了空格。每行至少包含一个空格，来自用占位符的“x”。这是一个破坏我们格式的额外字符，所以使用 `s/^ //` 来将其删除。视觉上不会有任何可见区别，但我们的下一个命令现在可以正常工作了。


    (join) 命令默认将下一行连接到当前行的末尾。空白字符为等号下划线行的对齐提供了空间。


    现在全部合起来！在每个括号和大大括号之前添加必要的反斜杠转义，我们就可以为每行的“the”加上下划线。


    `* g/the/t.\ns/\(C.*\)\(the).*/x\1\n2/`

    `s/./=/g\ns-s/./ /g\ns/^ //`

    `j`

    `*p`

    the

    ===

    but then

    ===

    their

    ===

    Them

    ===

    the

    thee

    ===


