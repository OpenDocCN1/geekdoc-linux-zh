    editing of matches with G.


    # Character Classes


    Being able to match a string is fine, but as lowly WYSIWYG text editor can do
    that. What gives regular expressions power their ability to describe types of
    text to match on. You want to match alphanumeric strings? Regex can do that. You
    want to hit any line that contains the 3 through 5? No problem. All of these and
    many are built on character classes.


    A character class is a list of matching characters in square brackets. The class
    [Tt] matches either a lower-case or upper-case letter T, while [Hh] matches either
    type of H. One appearance of a class matches a single character in the regex.
    Character classes let us perform case-insensitive searches.


    ```

    *g/[Tt][Hh][Ee]/n

    1 the

    2 their

    3 then

    4 Them

    ```


