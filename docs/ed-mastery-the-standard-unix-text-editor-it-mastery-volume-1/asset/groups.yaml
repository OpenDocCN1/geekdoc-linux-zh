    Similarly, the final slash on a substitution separates the substitution from any
    trailing commands. If you don''t have any trailing commands, you can ditch that
    final slash.


    # *s/vim/ed


    If you want to replace the regex with nothing, as in s/regex//, you can shorten
    even further. Ed knows you want to do a substitution, because you given it the
    regex and no substitution, so it just does it for you. This makes pulling surplus
    words out of a document easy.


    # *s/emacs


    Searches and substitutions have a truly amazing number of backslashes. If you
    write a regex that looks for slashes, it starts to resemble the jaw of a Tyrannosaurus.
    Ed eases this problem by supporting alternate delimiters. When you use the s or
    q command, whatever character appears next takes the place of the slash. Here
    I want to search for slashes, so I use the letter “m” as an alternate delimiter.


    # *gm/the/


    Alternate delimiters also work in substitutions. Here I use “@” as a delimiter.


    # *s@nano/heresy


    Next I delete the first “h” from the current line, using “m” as a delimiter.


    # *smh


    Making commands short is the Unix way. Alternate delimiters improve your ability
    to shorten commands.


    You now have a good grasp on how to use ed interactively. Before you go, though,
