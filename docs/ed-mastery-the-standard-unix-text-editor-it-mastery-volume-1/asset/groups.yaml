    ## Chapter 1: Ed Essentials


    Everything’s perfectly clear now, right? Probably not, but we’ll discuss addresses
    in Chapter 10.


    If you have an unlimited ink budget, you could enable verbose error messages.
    Enter H by itself to toggle verbose error messages on and off.


    # H


    Ed echoes your command to the printer. Now try ENTER again.


    ?invalid address


    Turning on verbose error messages by default wastes both paper and reading time,
    but we’ve all had that experience where we stare at our command for far too long
    trying to figure out what we did wrong. We all need to learn.


    Another command you might find useful is turning the command prompt on and off.
    The ed command prompt is a single asterisk. It’s useful when you’re reviewing
    old printouts and need to identify your commands, or if you’ve got a fancy system
    with a video terminal. Enter P to turn the command prompt on or off.


    # P


    If you’re using a video terminal, you’ll see the command prompt straight away.
    Printer users will get the command prompt in the line that displays their next
    command.


    Enter commands individually. Some of those commands, as for regular expressions
    (Chapter 101) can be very complicated and contain many characters, but each command
    needs its own line. Here I try to simultaneously turn on verbose error messages
    and the command prompt.


    # HP


    ?


    I''ve confused ed. Let''s get detail.


    # h


    invalid command suffix


    Ed sees that I''ve used the h command and added the p suffix. An ed command suffix
    is much like a command-line argument; it modifies the command. The h command doesn''t
    take p as a suffix, so ed spits an error in your face and declares you unworthy.
    Instead, enter each command separately.


    ```

    $ ed jabberwocky.poem

    ```


    963


    # H


    # P


    *


    You now have verbose errors and the command prompt. As you''re just learning ed,
    many of the examples in this book are run with verbose errors and with the command
    prompt. It wastes ink, but you''re worth it.


    Leave ed with the q command.


    *q


    Set an alternate prompt when starting ed, using the -p flag.


    ```

    # ed -p jabberwocky.poem

    ```


    You might need to quote your prompt, especially if you put a space between -p
    and your prompt. Prompts have special meaning in the shell, as * and > will cause
    problems otherwise. For your own edification, try ed -p * jabberwocky.poem and
    see what happens. Otherwise, quote your prompt.


    ```

    $ ed -p ''>'' jabberwocky.poem

    ```


    963


    >


    ## Chapter 1: Ed Essentials


    All commands get run in command mode. Adding text requires input mode.


    ## Switching Modes


    While command mode is for issuing text editor commands, input mode lets you add
    text to a file. Here I open the empty file todo. It''s an empty file, so it uses
    zero bytes.


    ```

    $ ed todo

    ```


    Ed supports three different ways to get into insert mode: append, insert before
    current line, and change current line. We''ll discuss changing lines in Chapter
    10.


    Enter append mode with the a command. Append mode puts the cursor at a new line
    after the current line. As this is an empty file, it goes straight to the end.
    Anything you type gets to the file. Hit ENTER to go to the next line. Here I add
    today’s to-do items to the end of this file.


    +   * a

    buy groceries

    restrain capitalism

    clean the rat cage


    > If I can accomplish all that, it''ll be a good day.

    Leave insert and append mode, returning to command mode, entering a period on
    all line by itself.


    Insert text before the current line with the i command. This requires choosing
    a current line, which we''ll discuss in Chapter 10. Similarly, you can choose
    an existing line and change it with the c command.


    If you make a mistake in your command, CTRL-C aborts it and returns you to a command
    prompt.


    ## Ed Mastery


    I now have my to-do list in the buffer. Writing it to disk would be a good idea.


    ## Saving and Exiting


    Write the buffer back to the file with the w command. (We''ll discuss saving to
    alternate files in Chapter 100). Ed prints the number of bytes written. After
    saving, edit with the q command. My complete ed session to create my to-do list
    would look like this.


    ```

    $ ed todo

    0

    P

    *a

    buy groceries

    restrain capitalism

    clean the rat cage

    .

    *w

    53

    *q

    ```


    While you can''t normally combine commands, you can combine the write and quit
    command.


    *wq

    If your brain slips and you don''t save the file before exiting, ed complains.


    *q

    Let''s see what it''s complaining about.


    *h

    warning: file modified

    I''t save the file. Enter the q command a second time to throw away your changes
    and exit without saving. You can also use a q to immediately exit without saving.


    Now let''s consider line addressing.


    ## Chapter 10: Addresses


    In ed terms, an address is a line number in a buffer. Your commands affect an
    address. Many commands have effect on an address-by-address basis, such as "delete
    address" or "insert after address 5." Ed also has a concept of the current address,
    which is the default location. You can tell ed that you''re working on line 5,
    and then change, or otherwise mangle that position in the file. Ed makes heavy
    use of addresses. Selecting and setting addresses is a vital part of working with
    ed.


    We''ll demonstrate addresses using a file containing Carroll''s poem Jabberwock.
    While I''m certain most of my readers, being decent and worthwhile people, are
    not familiar with this poem but memorized, Appendix A includes a copy for those
    of you suffering from an apparently deficient liberal arts education. It''s thirty-four
    lines long, counting the blank lines between paragraphs, so it contains thirty-four
    possible addresses. A few ed commands (but not all) can accept an address of zero,
    meaning "before address one."


    Many ed commands expect you to put the addresses to be affected before the command.
    A command like 4d or 3,5c means "on these lines, run this command." This swaps
    the most vital context of your vulnerable brain and into the computer as quickly
    as possible. You know need to delete lines, but your mind is most likely to forget
    the specific lines so it''s best to set those immediately.


    An address on its own is a single address. Two comma-separated addresses represent
    start and stop addresses, and include those addresses as well as everything between
    them.


    When you set an address, ed prints the line. For clarity in this section, I set
    the p and h commands when starting ed.


    ## Setting Your Address


    When you first open file, your current address is the last line of the file. Send
    the contents of the current address to your printer (or, if you''re one of the
    fancy folks, to your monitor) with the p command.


    *p

    And the meme raths outgrade.


    This is the last line of Jabberwocky. The special address $ always refers to the
    last line of a file.


    To set the address to a line number, enter that number. I want to see line 6 of
    Jabberwocky.


    *6

    “Beware the Jabberwock, my son!


    When you change the address, ed automatically prints the line at that address.


    Advance the address one line at a time with the + command.


    *nThe jaws that bite, the claws that catch!

    *+

    Beware the Jubjub bird, and shun

    *+

    The frumious Bandersnatch!


    To forward multiple lines, give the + command and the number of lines you want
    to forward. This is the last line of the stanza, and I want to skip the blank
    line that follows so I advance two.


    *2

    He took his vorpal sword in hand;


    4 Remembering that the file has blank lines is the sort of thing you must do if
    you wish to be worthy of ed(1).


    ## Chapter 10: Addresses


    Walk backwards through the buffer using the – or ^ commands.

    (GNU ed disrespectfully dropped the ^ command, leaving with only -). Add a number
    to move back that many lines.


    * -


    The previous line is blank—but we knew that. It''s why we skipped ahead. Set the
    address back one more.


    * -

    The frumious Bandersnatch!


    The Bandersnatch is, indeed, frumious.


    ## Finding Your Address


    The equal command (=) prints an address. It defaults to the last address of the
    buffer.


    * =

    34


    This buffer is 34 lines long.


    The period represents the current address. To see your current address, enter
    a period and the equals sign.


    * =

    9


    Our address is 9, so we''re on the ninth line of the file.

    The address $ represents the last line of the file. While it''s commonly used
    to jump to the end, you can combine it with the equals command to explicitly list
    the number of lines in the file.


    *=$n34

    * $


    I remembered correctly; this file is 34 lines long. And we''ve now moved to the
    end.

    '
