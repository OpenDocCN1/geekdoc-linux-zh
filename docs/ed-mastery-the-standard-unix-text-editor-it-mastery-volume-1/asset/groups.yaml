    ## 子表达式与反向引用


    子表达式是正则表达式的一部分。使用子表达式将一行拆分成若干块，如“我们关注之前的所有内容、我们关注的内容、以及之后的所有内容”。子表达式用括号标记，例如 `([a-zA-Z0-9])`。与大括号类似，你必须转义括号，以告诉
    `ed` 你正在将它们用于子表达式。否则，`ed` 会查找字面上的括号字符。在引入子表达式时，我们将跳过反斜杠。


    为了让 `ed` 记住整行，子表达式必须匹配包含字符串的整行。点和通配符在这里非常有用。虽然 `/the/` 匹配包含字符串“the”的行，但记住整行需要使用
    `.*`：任意多个字符、我们真正想要的、然后任意多个字符。将正则表达式括在括号中让 `ed` 将其视为子表达式：`/(.*)`


