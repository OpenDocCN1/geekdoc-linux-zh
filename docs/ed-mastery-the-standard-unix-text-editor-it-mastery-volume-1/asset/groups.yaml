    ## Chapter 111: Scripting


    Scripting is an utterly essential component of systems administration. Using ed
    in your scripts will not only simplify certain tasks, it will demonstrate your
    moral superiority over so-called sysadmins.


    Consider our command to underline a regular expression on each line, from the
    last chapter. You really don''t want to type all every time you need this transformation,
    do you? A reusable, editable script is much better.


    The key to scripting is to remember that ed is unlike lesser editors, it accepts
    instructions from standard input. It has no need to differentiate between human
    and script input. You can''t include comments within your ed script, but you have
    the whole variety of ways to run it.


    ## The Ed Command File


    The easiest way to script with ed is to create a file containing all the ed commands
    to run. and then run it like so.


    ```

    $ ed textfile < ed-commands.ed

    ```


    The commands file contains only the ed commands you want to run.


    As you''re learning any scripting method, start create a script to duplicate every
    line that matches a regex. Open your editor and follow along.


    ```bash

    $ ed dup.ed

    dup.ed: No such file or directory

    P

    *H

    cannot open input file

    *a

    g/the/t.

    ,p

    Q

    .

    *wq

    14

    $

    ```


    We open an ed session and turn on prompts and detailed error messages. While ed
    doesn''t care the file doesn''t exist, enabling verbose errors commands to remind
    us about the existing error. We then append to the buffer. The first command in
    the script is our friend `g/the/t..,` straight from the last chapter.


    Once search and copy finishes, the `,p` command prints the file from beginning
    to end.


    The final command in our script file is `q,` to immediately quit without saving.

    The dot takes us back to our editing session''s command line, letting us `wq`
    to save and quit.


    ```

    $ ed textfile < dup.ed

    179

    the

    the

    pony

    their

    their...

    ```


    The first line of output is the number of bytes in the text file, just as you
    were editing the text file interactively. We then see each line of the buffer,
    allowing us to verify that the command file does what we thought it did.

