    While regular expressions let you search and manipulate matching lines, ed lets
    you change text based on those same regular expressions. Regex-based substitution
    is an incredibly powerful search and replace function that lesser text editors
    can only dream of. While clumsy regexes can shred your buffer, with practice you
    can quickly and easily transform your text.


