- md: '

    # Acknowledgements


    My entire career—indeed, modern life for every one of us—would not have been possible
    without those giants who wrote entire operating systems using ed and its predecessors.
    We owe those giants a debt of gratitude.


    More personally, though, I want to thank my technical reviewers who were kind
    enough to share their immense expertise: Tim Chase, Josh Gross Mosieczuk. Any
    errors in this book crept despite these fine folks'' best efforts.


    Many examples in this book were inspired by the fine presentations at the ed(1)
    Conference, available on Twitter at https://twitter.com/@ed1conf and on Mastodon
    at https://bsd.net/@ed1conf. Attending the world''s premier conference for text
    editing at 300 baud will help keep your ed skills razor-sharp.


    After receiving rare but tediously ongoing complaints about my use of mixed male
    and female third-person pronouns in my technology books, I''ve prepared two editions
    of this book. Any third-person singular pronouns that appear in the standard edition,
    for normal people, are female. Those who believe that women don’t belong in tech
    books are welcome to purchase the special “Manly McFace” edition, where all third-party
    singular pronouns are masculine. To compensate for this edition''s much smaller
    market, though, the Manly edition is pricier than the standard edition. That’s
    basic economics.


    Also, one dollar of my proceeds from each sale of the Manly McFace Edition will
    be donated to my local chapter of Soroptimists International.


    # Chapter 0: Introduction


    Let me be very clear here: ed(1) is the standard Unix text editor.


    Dennis Ritchie, co-creator of Unix, declared it so. Who are you to argue with
    someone who can write a complete operating system without using a glass teletype¹?


    Many younger sysadmins naively hoist their pennants to defend overblown, overdesigned
    text editors like ex, vi, or even the impossibly bloated nvi. A few are so lost
    as to devote themselves to turgid editors for mere users, such as vim and Emacs.
    This lies not only appalling sysadmin skills, but an absence of moral fiber. As
    a sysadmin, you must have enough brain power to remember what you typed, to hold
    your context in your head, and to truly commune with the machine on a deep and
    personal level.


    Most Unix hosts exist to perform real work, such as supporting databases or serving
    web pages. When you speced the system''s memory, processor, and disk I/O, you
    considered the amount of hardware needed to run those tasks. Any system resources
    available are intended to support atypical peak loads, not some pathetically overengineered
    text editor. When you suck up extra kilobytes—or, worse, megabytes—to run a fancy
    editor, you steal from the host.


    Sysadmins dependent on something like vim? They actively harm systems. Do not
    trust them.


    - You know, a glass teletype. That kid keep calling a “monitor,” even though we
