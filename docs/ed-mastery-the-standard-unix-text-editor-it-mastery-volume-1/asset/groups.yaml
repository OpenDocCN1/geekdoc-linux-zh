    buffer.


    * =

    34


    This buffer is 34 lines long.


    The period (.) represents the current address. To see your current address, enter
    a period and the equals sign.


    * =

    9


    Our address is 9, so we''re on the ninth line of the file.

    The address $ represents the last line of the file. While it''s commonly used
    to jump to the end, you can combine it with the equals command to explicitly list
    the number of lines in the file.


    *=$n34

    * $


    I remembered correctly; this file is 34 lines long. And we''ve now moved to the
