    15 thee

    16 theee

    17 theeeee

    18 theeeee

    ```


    We get four matches. Hang on a minute—there’s way more than two es in a row in
    lines 16, 17, and 18. What happened? This just demonstrates that ed is more detail-oriented
    than you. Line 16 has two pairs of es in a row, with the middle e shared between
    them. Lines 17 and 18 have three e-pairs in a row, plus more when you count the
    shared es.


    Matching a specific set of characters demands careful thought. What, exactly,
    do you want to match? I want to match two letters, exactly two letters, with something
    other than an “e” after them. Try using a character class that excludes e.


    ```

    *g/e\{2\}[e]/n 18 theeeeee

    ```


    That’s definitely two''s in a row, followed by a character that isn’t e.


    Or suppose I want two es in a row after a character other than e, and to attach
    those to the end of the line.


    ```

    *g/[^e]e\{2\$\}/n 15 thee

    ```


    Matching identical characters in a row demands you think carefully.


    Basic regular expressions, say, to two five es in a row, this looks like what
    you’d want. Express this by giving the lower limit, comma, and the upper limit,
    such as e{2, 5}. You’ll need to escape the braces in the actual ed command.


