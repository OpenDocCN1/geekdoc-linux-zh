    McFace）版，该版本中所有第三人称单数代词都是男性的。然而，为了补偿该版本市场小得多的问题，硬汉版比标准版贵。这是基础经济学。


    此外，每卖出一本“硬汉脸”版，我将从中抽取1美元捐给我当地的国际乐施会（Soroptimists International）分支。


