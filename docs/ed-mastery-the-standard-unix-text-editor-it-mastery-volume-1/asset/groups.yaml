    ## 第 1 章：Ed 基础


    现在一切都变得非常清晰了，对吧？也许可能没有，但我们将在第 10 章讨论地址。


    如果你有无限的墨水预算，可以开启详细错误消息。单独输入 H 即可切换详细错误消息的开启与关闭。


    # H


    Ed 回应了你发送给打印机的命令。现在再次尝试 ENTER。


    ?invalid address（无效地址）


    默认开启详细错误消息既浪费纸张又浪费阅读时间，但我们都曾有过那种经历：盯着自己的命令看了太久，试图弄清楚自己到底做错了什么。我们都需要学习。


    另一个你可能觉得有用的命令是开启或关闭命令提示符。ed 的命令提示符是一个星号 `*`。当你回查看旧的打印输出并需要识别命令时，或者当你拥有一个带有视频终端的高级系统时，它非常有用。输入
    P 开启或关闭命令提示符。


    # P


    如果你正在使用视频终端，将立即看到命令提示符。打印机用户将在显示下一条命令的行中看到命令提示符。


    逐条输入命令。其中某些命令（如正则表达式，第 101 章）可能非常复杂并包含许多字符，但每个命令都需要单独占一行。在这里，我尝试同时开启详细错误消息和命令提示符。


    # HP


    ?


    我弄混了 ed。让我们查看细节。


    # h


    invalid command suffix（无效命令后缀）


    Ed 看到我使用了 `h` 命令并添加了 `p` 后缀。ed 命令后缀非常类似于命令行参数；它会修改命令。`h` 命令不接受 `p` 作为后缀，因此 ed
    直接对着你的脸抛出一个错误，并宣布你不配格。相反，请分别输入每个命令。


    ```

    $ ed jabberwocky.poem

    ```


    963


    # H


    # P


    *


    你现在拥有了详细错误显示和命令提示符。由于你正在学习 ed，书中的许多示例都是在开启详细错误和命令提示符的情况下运行的。这浪费了墨水，但你是值得的（注：此处原文意为虽然浪费墨水，但学习是值得的）。


    使用 q 命令退出 ed。


    *q


    在启动 ed 时，使用 -p 标志设置备用提示符。


    ```

    # ed -p jabberwocky.poem

    ```


    你可能需要引用提示符，特别是如果你在 -p 和提示符之间留了空格。提示符在 shell 中有特殊含义，否则 `*` 和 `>` 会引起问题。为了增长见识，尝试
    `ed -p * jabberwocky.poem` 看看会发生什么。否则，请引用你的提示符。


    ```

    $ ed -p ''>'' jabberwocky.poem

    ```


    963


    >


    ## 第 1 章：Ed 基础


    所有命令都在命令模式下运行。添加文本需要输入模式。


    ## 切换模式


    命令模式用于发布文本编辑器命令，而输入模式允许你向文件添加文本。在这里我打开空文件 `todo`。它是一个空文件，占用 0 字节。


    ```

    $ ed todo

    ```


    Ed 支持三种进入插入模式的方式：追加（append）、当前行前插入（insert before）和修改当前行（change）。我们将在第 10 章讨论修改行。


    使用 a 命令进入追加模式。追加模式将光标置于当前行之后的的新行。由于这是一个空文件，它会直接到末尾。你输入的任何内容都会进入文件。按 ENTER 进入下一行。在这里我将今天的待办事项添加到此文件的末尾。


    +   * a

    buy groceries

    restrain capitalism

    clean the rat cage


    > 如果我能完成这一切，那就是美好的一天了。

    退出插入和追加模式并返回命令模式的方法，是在所有行上单独输入一个句号 `.`


    使用 i 命令在当前行之前插入文本。这需要选择一个当前行，我们将在第 10 章讨论。同样，你可以选择一个现行并使用 c 命令对其进行修改。


    如果你在命令中犯了错，按下 CTRL-C 会中止操作并返回命令提示符。


    ## Ed 精通


    现在我的缓冲区中有了我的待办事项列表。将其写入磁盘是个好主意。


    ## 保存并退出


    使用 w 命令将缓冲区写回文件。（我们将在第 100 章讨论保存到备用文件）。Ed 会打印写入的字节数。保存后，使用 q 命令进行编辑。我创建待办事项的完整
    ed 会话看起来如下。


    ```

    $ ed todo

    0

    P

    *a

    buy groceries

    restrain capitalism

    clean the rat cage

    .

    *w

    53

    *q

    ```


    虽然你通常不能合并命令，但你可以合并写入和退出命令。


    *wq

    如果你的大脑短路，在退出前没有保存文件，ed 会抱怨。


    *q

    让我们看看它抱怨什么。


    *h

    warning: file modified（警告：文件已修改）

    我不保存文件。第二次输入 q 命令将丢弃更改并退出退出。你也可以使用 q 立即退出而不保存。


    现在让我们考虑行地址。


    ## 第 10 章：地址


    在 ed 的术语中，地址是缓冲区中的行号。你的命令影响某个地址。许多命令按逐个地址产生效果，例如“删除地址”或“在地址 5 之后插入”。ed 还有一个“当前地址”的概念，它是默认位置。你可以告诉
    ed 你正在处理第 5 行，然后更改或以其他方式破坏文件中的该位置。ed 大量使用地址。选择和设置地址是使用 ed 的重要部分。


    我们将使用一个包含卡罗尔诗歌《Jabberwock》的文件来演示地址。虽然我确定我的大多数读者（作为正直且有价值的人）并不熟悉也没有背过这首诗，但附录 A
    为那些饱受人文教育不足痛苦的人提供了副本。它全长 34 行（包括段落之间的空行），因此包含 34 个可能的地址。少数 ed 命令（但并非所有）可以接受零地址，意味着“地址
    1 之前”。


    许多 ed 命令期望你将受影响的地址放在命令之前。像 `4,5` 这样的命令表示“在地址 4 到 5 之间执行命令”。一个单独的地址意味着“在地址 1 之前”。两个逗号分隔的地址表示起始和结束地址，包含它们之间的所有内容。


    当你设置地址时，ed 会打印该行。为了增长见识，在启动 ed 时设置 h 命令。


    ## 设置地址


    当你第一次打开文件时，当前地址是文件的最后一行。将当前地址的内容发送打印机（或者如果你是那些高级用户，到显示器）使用 p 命令。


    *p

    And the


    这是 Jabberwock 的最后一行。特殊地址 $ 始终指向文件的最后一行。


    要将地址设置为某行，输入该数字。我想看 Jabberwocky 的第 6 行。


    *6

    “Beware the Jabberwock, my son!


    当你更改地址时，ed 会自动打印该地址所在的行。


    使用 + 命令逐行推进地址。要前进多行，给出 + 命令和你想向前移动的行数。这是诗节的最后一行，我想跳过其后的空行，所以我前进两行。


    *2

    He took his vorpal sword in hand;


    4 记住文件有空行是你想要配得上 ed(1) 必须做的。


    使用 - 或 ^ 命令反向遍历缓冲区。

    （GNU ed 无礼地丢弃了 ^ 命令，只剩下 -）。添加一个数字可以回退若干行。


    * -


    前的一行是空的——但我们知道。这就是我们为什么跳过。将地址再回退一位。


    * -

    The frumious Bandersnack!


    Bandersnack 确实是疯狂。


    ## 查找地址


    等命令 (=）打印地址。默认是缓冲区的最后一个地址。


    * =

    34


    这个缓冲区有 34 行。


    句号代表当前地址。要查看当前地址，输入点加等号。


    * =

    9


    我们的地址是 9，所以我们在文件的第 9 行。

    地址 $ 代表文件的最后一行。虽然它通常用于跳转到末尾，但你可以将其与等号命令结合（使用 $n）来显式列出文件的行数。


    *=$n34

    * $


    我记得没错；这个文件有 34 行。而且我们现在移动到了末尾。


    '
