    ## Shell Escapes


    You''ll frequently need to grab information from the underlying operating system:
    an IP address, a file name, something. Leaving the editor to look up a detail,
    only to restart the editor and recover your current address, is not only annoying—it''s
    inefficient. That''s shell escapes come in.


    A shell escape runs a single command outside of the shell, this displays the output,
    then returns you to editing. Ed uses the exclamation point (!) to trigger the
    escape.


    Suppose I''m writing the host''s sysadmin documentation, and I need to know how
    to see all the virtual interfaces, only em0. Get this information with ifconfig(8).⁵


    ```

