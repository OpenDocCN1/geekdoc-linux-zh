    # Chapter 101: Regular Expressions and Searches


    A regular expression, or regex, is a string that defines a pattern of text. It''s
    most commonly a string of text meant to match another string of text. Ed can scan
    its buffer for text that matches the regular expression, either pointing it out
    for your consideration or performing automatic transformations on everything that
    matches the pattern. Regular expressions are used most commonly for searches and
    text replacement. Ed’s regular expressions helped later regex standards, such
    as POSIX. As the originator, ed does not trouble itself to support all the bloat
    of POSIX. These days, ed regular expressions are called “basic regular expressions.”
    You will find impure ed versions that have been distended by other regex versions
    but again, those are for the weak of mind and unworthy of our attention. Despite
    their reputation, looking at regular expressions does not cause incurable madness—that’s
    “extended” regexes you are thinking of.


    Before you use any of ed’s amazing search and transformation features, you’ll
    need to understand how to create regular expressions.


    # Regular Expression Format


    Regular expressions commonly (but not always) appear between slashes. Ed’s documentation
    uses re as the sample regular expression, which would be shown as `/re/. Between
    those slashes you will see characters, wildcards, character classes, escaped characters,
    and modifiers.'
- md: '

    ## Ed Mastery


    Any single character matches itself. If you wanted to match the letters “t”, “h”,
    and “e”, in that order, you’d use a regex like /the/.


    Regexes use the period (.) as a wildcard. It matches any character. A character
    class appears in square brackets ([]). A class describes a bunch of characters
    that can appear in the expression. We’ll cover those in detail in “Character Classes”
    later this chapter.


    An escaped character lets you include a character that has a special purpose within
    the regex. The most obvious example is if you need to include a slash in your
    regex. The slash is used to delimit a regex, so you can’t do //. You need to use
    a backslash (\) as an escape character, to tell that the character should be treated
    literally rather than as part of the expression. An escaped backslash would look
    like \\, and a regex to slash would become /\//. Searching for a period requires
    \., while a square bracket needs \[ or \.]. Escaping can also transform a regular
    character into a special character, such as the braces used for counts and the
    parentheses needed by backreferences.


    When do you use which? It all makes perfect sense if you read the source code,
    but right now just nod and smile and follow examples.


    Let’s see how regular expressions work with a few highly artificial examples.


    ## Searching in Ed


    All too often you know you used a word in a document, but you''re not certain
    where it was. There''s no need to print out the whole file; ed lets search for
    words by regular expression. Take this list of words—many similar, some not, printed
    with addresses so we can more easily discuss them.


    | Address | Text |

    | :--- | :--- |

    | + *,n | |

    | 1 | the |

    | 2 | their |

    | 3 | then |

    | 4 | Them |

    | 5 | there |

    | 6 | they''re |

    | 7 | thereafter |

    | 8 | 2 |

    | 9 | 3weasels |

    | 10 | 4 theremin |

    | 11 | /the/ |

    | 12 | pet rats |

    | 13 | [pedicular] |

    | 14 | hamster5 |


    Entering your regex as a command, slashes and all, tells ed to search for the
    next line containing text that matches the regex. I warned you this was artificial,
    let''s search for the regex /the/.


    + **/the/

    the

    *=

    1


    The first line of the buffer matches. The search command set our address to the
    matching line. To search forward for the same regex, enter a double slash.


    +   *//

    their


    Okay, that’s line 2. I could keep asking for the address, or I could add a command
    after the search command. Remember the n command that adds line numbers? It works
    as a search modifier.


    ```

    //

    3 then

    //

    5 there

    ```


    Hang on—what happened to line 4? Looking at the file, the word “Them” includes
    the the. Shouldn’t that match? No, it shouldn’t. “Them” begins with a capital
    letter. The regex matches only a literal, lower case, the. You’ll need to use
    a character class to make the search-insensitive.


    Walking through a buffer one line at a time gets tedious, though. Use the g command
    in front of the search term to search for a regex globally, on the entire buffer.
    Put your regex right after the g. To print all the matches, adding the trailing
    p command as a modifier.


    Here I globally search for the string “re,” or the regex /re/, and print the results.


    ```

    *g/re/p

    there

    they’re

    thereafter

    4 theremin

    ```


    The p command is the default action of a search, so you could skip it. Searches
    print their results automatically unless you say otherwise. But then this example
    wouldn’t illustrate where the newcomer grep(1) command came from, would it? If
    you wanted to print line numbers while searching for “re,” though use the n command
    instead of p.


    ```

    *g/re/n

    5 there

    6 they’re

    7 thereafter

    10 4 theremin

    ```


    ## Chapter 101: Regular Expressions and Searches


    Yes, grep has a command line flag to print line numbers—but why would you bother
    looking up that flag, when it''s conveniently built right into ed?⁶


    When you do a global search, your address is set to the last match. Search a subset
    of the buffer by putting addresses before the `g` command.


    *1,10g/re/n


    When to search backwards from the current address, use question marks instead
    of slashes around the regex.


    + *10

    4 theremin

    *re?n

    7 thereafter


    The previous match is address 7. To repeat the current backward search, enter
    two question marks.


    + *??n

    6 they''re


    The // and ?? commands both refer to the most recent regex, allowing you to move
    forward and backwards on the current search.


    ## Running Commands on Searches


    Commands to print the matching lines aren''t the only things you can do with searches.
    You can give the search any command other than a search command (g, G, v, or v).


    An easy example is deleting matches. The `d` command deletes the current address.
    Here I strip away all lines that match the string “re.”


    *g/re/d


    Your buffer just shrank. If you''re following along at home, undo this before
    the next example.


    ⁶ What Unix really needs a gre(1) command. Because grep(1) gets lonely.


    Say you want to move lines that match the regular expression to the end of the
    buffer. Use the m command, with the $ destination address that matches the end
    of the file.


    *g/re/m$


    *n What does this give us?


    ```

    1 the

    2 their

    3 then

    4 Them

    5 3weasels

    6 /the/

    7 pet rats

    8 [pedicular]

    9 hamster5

    10 there

    11 they''re

    12 thereafter

    13 4 theremin

    ```


    Ed moved through the buffer. Every time it found a match, moved line to the end
    of the file. You just automatically re-ordered your buffer! Doing so with a simple
    regex like this looks trivial, but when you build more complicated regexes you''ll
    find it useful.


    Suppose you wanted to move everything that matches to the beginning of the file.
    The command differs by only the destination address, but the results look far
    different.


    *g/re/m0


    *n


    + 1 4 theremin

    2 thereafter

    3 they''re

    4 there

    5 the

    6 their

    7 then

    8 Them

    9 2weasels

    10 /the/

    14 hamster5


    The words that match our regular expression are at the top of the file, but their
    ordering has reversed. What was line 11 is now line 1, line 10 is now line 2,
    and so on. In the global search, ed processes each line in order. Lines matching
    the regex get up to address zero. Line 5 matched, and got moved to zero. Line
    6 matched, and got moved to zero. Moving lines to the top of the stack—er, buffer—one
    at a time reverses their order. The same thing happens if you move lines to any
    address other than $, such as an address in the middle of the file.


    Avoiding this reversal requires interactive editing with a regex.


    ## Interactive Searching


    Sometimes you must perform specific actions on every matching line. Rather than
    forcing you to run a search and then a separate command on each line, ed can pause
    after each match and give you a chance to run a command. Use the G command to
    tell ed to pause after each match.


    *G/re/n


    + 5 there


    I can hit ENTER to continue, or type a command. I''m going to use them command
    to move this line to address 0, or the beginning of the file.


    m0

    ed proceeds to show me the next match. I move each to a successive address at
    the beginning of the file.


    + 6 they''re

    m1

    7 thereafter

    m2

    10 4 theremin

    m3


    At the end of the search, ed displays the current address and the contents of
    that address.


    + *,n

    1 there

    2 they''re

    3 thereafter

    4 4 theremin

    5 the

    6 their

    7 then

    8 Them

    9 3weasels

    10 /the/

    11 pet rats

    12 [pedicular]

    13 hamster5


    If you screw up this kind of operation, ed considers searches a single operation.
    You can undo a complicated interactive search with u.

