    # # Chapter 100: File Management and Shell Escapes


    Opening an existing file is great, but what if you want to create a new file?
    Or maybe you''re editing one file and want to switch to another? Perhaps you want
    to pull the output of a command into a file? Ed lets you do all this and more.


    We''ll start with file manipulations, and then proceed to commands.


    # The Empty Buffer


    We''ve only started by editing an existing file. You can run ed without a file,
    though.


    ```

    $ ed

    H

    P

    *

    ```


    Ed gives us an empty buffer. Let''s fill this void.


    ```

    *i

    ? invalid address

    ```


    What is it complaining about here?

    Remember that the insert (i) command inserts a line before the current address.
    This is an empty buffer, so what is the current address? While you could make
    sensible guesses, ed will tell you if you ask.'
