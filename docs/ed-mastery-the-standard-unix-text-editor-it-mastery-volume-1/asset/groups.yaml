    status: active

    inet 203.0.113.209 mask 0xffffff0 broadcast 203.0.113.255

    ```


    This host''s IP address is 203.0.113.209. I can now reference that in my document.


    Sometimes you want to repeat a shell escape. Ed remembers the last shell escape
    you ran, and can repeat it with the !! command.


