    2 their

    ...


    ```


    Yes, this matches every line in our file. Pretty useless, no?


    # Chapter 101: Regular Expressions and Searches


    The wildcard and asterisk are not useful on their own, but combined with other
    characters, classes, and anchors become extremely powerful. Suppose you want to
    find all lines that start with a letter but end with a number. We''ve used regexes
    like ^[a-zA-Z] to find letters at the front of a line. A regex like [0-9]$ will
    find numbers at the end, no problem. But combining them gets tricky... until we
    allow other characters in the middle.


    ```

    *g/^[a-zA-Z]. *[0-9]$/n

    ```


    This allows you to declare you don''t care what''s in the middle of how long the
    string is. If it starts with a letter and ends with a number, you get it. The
    period represents zero or more of something, and the asterisk matches any character,
    so we''re allowing zero or more of anything else. This lets us really short strings
    like “a1” without excluding longer strings.


    The asterisk can cause some counterintuitive output for folks accustomed to shell
    programming. You might expect a regex like *g/ther*/n to show words beginning
    with “ther,” but you''d be wrong.


    ```

    *g/ther*/n

    1 the

    2 their

    3 then

    ```


    The asterisk matches zero or more “r” characters at the end of the expression.
    The string “the” has zero “r” characters, so it matches. If you want one or more
    “r” characters, say so with a regex like rr*.


    # Commands and Searches


    One powerful feature of searches and regular expressions is that you can run commands
    after a search. Suppose you want to duplicate every line that matches a regular
    expression. As you''ll be changing the file, start with a plain search to be your
    regex matches the stuff you think it''ll match.


    ```

    *g/there/n

    5 there

    7 thereafter

    10 4 theremin

    ```


