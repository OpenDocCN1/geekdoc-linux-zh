    ## Displaying Addresses


    When you''re working on a long file, it might make sense to print a convenient
    master copy of the file with the address of each line. The n command shows each
    line prefixed with its address. You can use n with selected lines by putting the
    desired start and stop address before the command, separated by a comma.


    + *11,14n

    11 He took his vorpal sword in hand;

    12 Long time the manxome foe sought--

    13 So rested he by the Tumtum tree

    14 And stood awhile in thought.


    Ed''s current address becomes the last address shown, or 14 here.

    Or could you print the entire file, conveniently numbered.


    + *,n

    1 ‘Twas brillig, and the slithy toves

    2 Did gyre and gimble in the wabe:

    3 All mimsy were the borogoves,

    4 And the mome outgrabe.


    Only do this once you''re done rearranging your files, or you''ll waste paper.


    ## Viewing Trailing Space


    One annoyance with text files is that blank spaces can mess up a file. You''ll
    notice extra blank spaces in the middle of your text, but those extra spaces at
    the end of a line are tricky. You don''t want to have watch your printer to see
    if the head carries way over to represent the blank spaces, after all. Use the
    1 suffix after n or p to put a $ symbol at the end of each line. Here I view the
    actual spaces in the file containing my to-do list.


    ```

    *,n1 have bath $\n2 with soap$

    ```


    There''s an extraneous space at the end of line 1.


    ## Bookmarks


    Scrolling through a long file can be a pain, especially if you''re adding and
    removing lines. Ed allows you to create bookmarks to easily return to a location
    in the file. Each bookmark is named after a single case letter, and you''ll use
    that letter to return to the bookmark.


    Suppose you want to place a bookmark at the beginning of each verse of Jabberwocky.
    You can''t number bookmarks, but you can call each of the seven verses a, b, c,
    and so on, up to g. Use the k command to assign a bookmark.


    > *1

    ''Twas brillig, and the slithy toves

    *ka

    *6

    “Beware the Jabberwock, my son!\n*kb


    Every five lines you''ll create a new bookmark.

    To return to a bookmark, use the single quote and the bookmark letter.


    > *''b

    “Beware the Jabberwock, my son!


    Now that you can dance through your files, let''s mangle some buffers.


    ## Chapter 11: Text Editing


    Ed contains everything you need to change existing text. As a simple example we''ll
    muck with my to-do list. You can insert lines, join lines together, shuffle text
    around, and generally proceed with your day without worrying all kinds of menus.


    ## Changing Lines


    A key function of a text editor is changing existing text. In ed this means selecting
    (by address) the line you want to edit, and changing it. Here''s my to-do list.


    + *p

    buy groceries

    restrain capitalism


    Line two is not correct. I need to change it, and I need to add a new item between
    lines two and three. Set the address to 2.


    + *2

    restrain capitalism


    Ed prints the address you set. Yes, that''s the line I want. Go into insert mode
    with the change (c) command. Unlike plain insert, c overwrites the existing line.


    + *c


    The new line, hit ENTER, and add another line. Leave insert mode with a period
    on a line itself.


    + obliterated

    rainbow ponies around


    If I wasn''t completely confident in ed skills, I could double-check the buffer.


    + *P

    buy groceries

    nliterate

    rainbow ponies around

    clean the rat cage


    Yes, that''s right. I use the wq command to save my to-do list.


    ## Inserting Amidst the File


    The append (a) command adds a line after the current address. The insert before
    (i) command inserts a new line before the current address. Which should you use?
    Whatever does you want to accomplish? I need to insert two new lines at the very
    beginning of the file, so I set the address to 1 and use the i command to put
    my new lines before that address. While I could give the i command and then i,
    it''s simpler to give the address with the i command.


    + *1ninvest in guillines

    flee to private island


    My to-do list now has six items.


    ## Moving Text


    I work down my to-do lists from top to bottom. This means ordering is important.
    Once my morning tea delivers consciousness to my brain, I''ll realize I can''t
    very well purchase groceries after fleeing to the private island; I''m pretty
    sure that I added "flee to private island" before "buy groceries,\


    + *1,3n

    invest in guillotines

    flee to private island

    buy groceries

