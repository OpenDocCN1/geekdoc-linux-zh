    ```


    我不知道那些 `XX` 块是怎么进那里的，但它们必须消失。你可以尝试将其中一个字符串替换为空。


    ```

    *s/XX//p

    whXXhaXtXX XXisXX this?XX

    ```


    替换引擎执行了你对它要求的最少工作。它匹配 `w` 和 `h` 之间的第一个 `XX`，将其拔出。你可以通过提供数字参数来告诉它提取哪一个匹配项。我将第七个
    `XX` 替换为空。


    ```

    *s/XX//7p

    wXXhaXtXX XXisXX this?

