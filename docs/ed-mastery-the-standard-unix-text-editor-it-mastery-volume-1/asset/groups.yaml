    # Ed Mastery


    Unlike searching on plain old /the/, this search picks up line 4 with its leading
    capital T.


    You can also list ranges of characters, separated by hyphens. The class [a-z]
    matches every lower-case letter, while [A-Z] matches upper case letters and [0-9]
    matches all digits. You can have multiple ranges in a single class, such as [a-zA-Z0-9].
    If you need a class to include the hyphen put it first. The class [/-] matches
    a hyphen, a slash, or either square bracket, while [^-\] matches whatever your
    system says the characters from / to , as well as ].


    Ranges can contain any characters you like. If I need to match lines containing
    the letters a through d, as well as u through z, lower case class would be [a-du-z]/n


    ```

    */[a-du-z]/n

    6   they''re

    7   thereafter

    9   3weasels

    12  pet rats

    13  [pedicular]

    14  gelato5

    ```


    Use such classes to narrow in exactly what you want, and an anchor to say where
    you want it.


    # Anchors


    An anchor attaches a regex to a position in the line. They let you perform searches
    like “has a digit at the beginning of the line” or “ends with a Z.” A caret (^)
    attaches the regex to the front of the line, while the dollar sign ($) anchors
    it to the end. Here I search for all lines that start with the letter “t.”


    ```

    */^t/n

    1   the

    2   their

    3   then

    5   there

    6   they''re

    7   thereafter

    ```


    # Chapter 101: Regular Expressions and Searches


    Similarly, you could search for every line that ends in a number.


    ```

    *g/[0-9]$/n

    ```


    Anchors help you narrow down your searches.


    # Inverted Classes


    Inverted classes contain all characters except those listed in the class. The
    first character in an inverted class must be a caret (^). A class like [^w] means
    “All characters except a lower case w.”


    Searching based on inverse classes quickly gets really tricky. If you want to
    use inverse classes, make your classes very short and simple. To search for everything
    that doesn''t include a character class, you''re much better off using the v or
    V command. This search excludes everything that includes an upper case character.


    ```

    *v/[A-Z]/n

    ```


    Inverted classes are most useful inside a more complex regex. Suppose I want to
    match everything containing the letter “e,” so long as the character following
    it isn’t “t.”


    ```

    *g/e[^t]/n

    ```


    their

    Then

    then


    If you''ve been paying attention you''ll notice that our first line, the, is missing.
    This contains the letter e, and it''s not followed by a letter t. Why doesn''t
    it show up? The regex we''re looking for is the letter “e” followed by any other
    character than “t.” There’s no character following the “e” in the, so it doesn’t
    match.


    Note the difference in caret placement between the inverted class and the anchor.
    The inverted class uses a caret inside square brackets, while the anchor goes
    outside any square brackets. This lets you perform searches like listing all the
    lines that start with a character other than “t”


    ```

    *g/[^t]/n

    4 Them

    8 2

    9 themweasels

    10 4 theremin

    11 /the/

    12 pet rats

    13 [pedicular]

    14 gelato5

    ```


    You''re probably better off using a command like v/^t/n, however. Regular expressions
    are tricky. Inverted classes are doubly tricky. Avoid them if you can.


    # Multiple Matches and Wildcards


    Sometimes you''ll want to match more than one of a character, perhaps even zero
    or more of a character. Ed provides operators for this.


    Use the curly braces to match a character a certain number of times. Put the count
    directly after the character you want to match. A regex e{2} would tell ed to
    match two “e” characters in a row. (You could also use a regex like ee, but that
    wouldn''t let me set up the complicated regexes we''re about to see.) Normally,
    ed treats curly braces in a regex as characters to match. Escaping the braces
    tells ed to treat them special. This makes your expression a little more complicated.


    ```

