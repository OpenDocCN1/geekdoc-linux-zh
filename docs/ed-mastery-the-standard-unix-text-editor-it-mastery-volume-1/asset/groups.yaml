    # Subexpressions and Backreferences


    A subexpression is a part of a regular expression. Use subexpressions to split
    a line into chunks, as “everything before we care about, what we care about, and
    everything after that.” Subexpressions are marked in parenthesis, such as ([a-zA-Z0-9]).
    Much like curly braces, you must backslash-escape parentheses to tell ed that
    you''re using them for a subexpression. Otherwise, ed looks for literal parenthesis
    characters. While I''m introducing subexpressions, we''ll skip the backslashes
    for clarity.


    For ed to remember the whole line, the subexpression must match the whole line
    that contains the string you want. The period and wildcards come in useful here.
    While /the/ matches a line containing the string “the,” remembering the whole
    line requires using /*the.*/ zero or more of something, what we really want, and
    then zero or more of something. Enclose the regex in parenthesis to have ed remember
    it as a subexpression: /.(.*.*)/


    A backreference lets you refer to the literal text matched by a subexpression.
    You can use backreferences within searches, but they'
