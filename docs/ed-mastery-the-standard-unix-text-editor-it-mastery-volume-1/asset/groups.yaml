    to become a Navy SEAL. I''m not even qualified to become the kind of seal that
    lies on a beach and barks. That''s okay. The world is full of computers. If you
    cannot handle the undulated glory that is ed, use one of those friendly pointy-clicky
    systems. You''re who they exist for. I recommend those tablet computers that don''t
    have a keyboard, though, as bright, colorful icons are very helpful to the non-educatable.


    It''s not using ed(1) is the pinnacle of systems administration achievement; it''s
    the minimum requirement. You must be this competent to manage this computer.


    If you''re reading this book, it''s because you want to join the elite. You want
    to count amongst the Navy SEALS of information technology. You want to be a real
    sysadmin, not one of those posers that need fancy toys to like "monitor". Yes,
    one ours monitors, but only because these wimpy modern laptops don''t come with
    built-in line printers.


    Real sysadmins not only work, they truly thrive on their wits and line printers.
    We welcome anyone who proves worthy of joining us.


    This book covers standard ed. Many operating system developers can''t resist the
    urge to add additional features to ed. That''s how the tragedies of ex and yi
    happened after. While these developers'' urge to become part of something as momentous
    as ed is perfectly understandable, this book won''t cover OS-specific extensions,
    such as Linux''s x and y commands and FreeBSD encryption support.


    I should warn you, though: some sysadmins object to this book. They sincerely
    believe that the best sysadmins learn from studying the operating system source
    code or, at worst, reading the man page.


    Many of those folks forget their own youth, though. You can''t learn computing
    on your own. Even the most sagacious Unix admins had mentors.


    In this bleak age when search engine algorithms dredge up shodily-assembled HOWTOs
    and pass them off as authoritative documents, providing for the next generation
    of sysadmins is one of the most vital tasks we face as a profession. I don''t
    want the servers storing my retirement funds managed by so-called sysadmins who
    struggle against the pomposity of the ed(1) source with this book at your side,
    in combination with a good C reference, such as the 1978 edition of “The C Programming
    Language” by the esteemed Brian Kernighan and Dennis Ritchie. If they could write
    a complete operating system using a line printer for output, you can handle your
    itty-itty tasks.


    Only a jerk would belittle you for attempting to transcend your limitations and
    become a proper sysadmin. Sadly, due to social stigma, I can''t blame you if you
    hold this book a precious secret. If necessary, you can get instructions for making
    a protective book out of a brown paper bag from your nearest Gopher site.


    Real sysadmins understand how the computer works. We understand the long-sought
    “What You See Is What You Get” (WYSIWYG) editor is nothing but a pernicious lie
    from the marketing department. We know in our bones that a file ending in .txt
    isn''t necessarily a text file—indeed, that a text file can have any name. Transcending
    these deceit is a necessary step to achieving true sysadmin mastery. The standard
    Unix editor does not pretend to be anything other than an engine for manipulating
    text.


    And what a magnificent engine it is.


    # Chapter 1: Ed Essentials


    At its heart, ed(1) is a text editor. It was written when computers didn''t have
    monitors, though. Computers could write data to tape or to a printer. The printers
    of that day didn''t wastefully run whole sheets of paper at a time, though; like
    ticker tape machines and typewriters, these line printers printed a single line
    at a time.


    The sysadmin would enter commands, printing results only when necessary. Or, if
    you prefer, a clattering printer announced to everyone within hearing every time
    you lost your train of thought. Real sysadmins can concentrate on their work and
    remember context.


    Ed is a line editor. It works on lines of text, as printed by a printer. It''ll
    work perfectly well on one of those new-fangled “monitor” things, if you''re unlucky
    enough to be stuck with one.


    We''ll begin exploring ed with a few basic tasks: starting the program, considering
    modes, saving, and quitting.


    # Starting Ed


    Run ed(1) by entering ed and the name of the file you want to edit. Here I want
    to edit a text file containing my favorite poem, Carroll''s Jabberwocky.


    ```

    $ ed jabberwocky.poem

    ```


    The number 963 does not appear anywhere within the poem. Why is it here?


    When you edit a file, ed reads the whole file into a memory buffer. Like everything
    else in memory, the buffer disappears when the system shuts down or the program
    exits. When you edit the file, you change the copy in the buffer. At some point
    you might overwrite the original file with the buffer, also known as “saving your
    changes.” You could write the buffer to a different file, or a new file. When
    you start ed, it tells you how many bytes it read into the buffer. Remember, real
    software uses no more memory than necessary.


    Where''s the text? This is your file. Don''t already know what''s in it? You don''t
    want to waste many lines of paper every file you open, do you? Next try head(1)
    to peek at the contents of your file before loading it into the editor, or flipping
    back through old printouts to identify the file.


    # Commands and Modes


    Ed is command-driven, which is a fancy way of saying it''s a text manipulation
    shell. You''ll issue commands at the ed command prompt. Try it now by hitting
    ENTER.


    ?


    Ed has one error message, a single question mark. It means “I don''t understand
    you.” When you get the error message, examine the command you typed and figure
    out what you did wrong. ENTER is not a valid ed command.³


    The h asks ed to explain the last error. With verbose error messages off, try
    ENTER again, then use h to explain the error.


    ?


    h

    invalid address


    ³ Ed is UTF-8 compliant, of course. While it can handle emoji, doing so imperils
    your immortal soul almost as much as using nano.

    '
