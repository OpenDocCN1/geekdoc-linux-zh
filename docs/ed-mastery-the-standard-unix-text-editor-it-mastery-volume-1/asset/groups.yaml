    ## 第 110 章：替换


    正则表达式允许你搜索和处理匹配的行，而 `ed` 则允许你根据这些正则表达式来更改文本。基于正则的替换是一个极其强大的搜索和替换功能，平庸的文本编辑器只能梦寐以求。虽然笨拙的正则可能会破坏你的缓冲区（buffer），但通过练习，你可以快速轻松地转换文本。


    我已经和正则表达式斗争——呃，与其打交道几十年了。即使在今天，在执行基于正则的替换之前，我也会先用正则表达式进行搜索。正则表达式非常微妙且易怒。务必先测试它们。即使有时我认为它们有效了，我也会保留一份未转换数据的副本。


    使用 `s` 命令进行替换，后面跟着正则表达式和新文本。用斜杠分隔每个部分。`s/regex/new/`


    我们将从一个简单的替换开始——但为了实现这一点，我们将从一个简单的搜索开始。使用与第 101 章相同的单词列表，假设我们想将所有的“there”更改为“then”。首先搜索你的正则表达式，看看结果是否如你预期的那样。


    报错了？但我们的搜索在缓冲区中看到了匹配的字符串！

    记住，`ed` 是按行工作的。第 1 行不匹配我们的正则，所以它报错了。你必须使用搜索（手动或自动）来定位替换。


    替换允许你程序化地纠正错误。考虑我们单词列表中的一个条目。


    *18

    theeeeeen


    “Theeeeee”不是一个单词。显然当有人输入“then”时，`e` 键卡住了。我们可以使用替换来修复它。在这里，我将任何两个或多个 `e` 组成的字符串替换为单个
    `e`。


    `*s/e\{2,\}/e/`


    现在检查该行。


    *18

    then


    如果我提前知道我想打印结果，可以在替换的末尾添加 `p` 命令。我们将介绍在替换末尾起的几个特定命令。


    `*s/e\{2,\}/e/p`


    如果转义所有大括号让你感到苦恼，你可以选择更简单的重复替换的方法。`s` 命令会重复上一次替换。


    ```

    *s/ee/e/p

    theeeee

    *s

    theeee

    *s

    theeen

    *s

    theen

    *s

    then

    *s

    ?

    no match

    ```


    你可能会注意到替换只影响一个匹配项。考虑这样的一行。


    ```

    *19

