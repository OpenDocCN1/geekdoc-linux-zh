    We need to break up the copied line into stuff that will become blank space and
    stuff that will become underlining. While there''s many ways to handle this problem,
    my approach splits the line with a newline amidst the substitution. I removed
    the escape backslashes for clarity, because the remaining backslashes are important.


    s/(.*)(the).*/x\1\2/


    The regex part of the substitution includes two subexpressions. One is everything
    before our desired regex (.*). The second is the regex itself (the). The regex
    has a third piece, .*, for everything. The third piece is not a subexpression,
    so ed won''t bother to remember it. (Strictly speaking the third part isn''t necessary,
    but I find it easier to explicitly say "there might be stuff after this" when
    reading my own code days or years later.)'
