- md: '

    # Ed Mastery


    # Michael W Lucas


    # Praise for other books by Michael W Lucas


    # SSH Mastery, 1st edition


    “SSH Mastery is another must-have, must-read for anyone working in IT. I imagine
    that most of us use OpenSSH and/or PuTTY every day, but I am sure of us will learn
    something about these tools and the SSH protocol after reading SSH Mastery.” —
    Richard Bechtlich, CSO, Mandiant, and TaoSecurity blogger


    “…one of those technical books that you wouldn’t keep on your bookshelf. It’s
    one of the books that will have its bindings bent, many pages bookmarked sitting
    near the keyboard.” — Steven Hicks, SSH:TEC


    “SSH Mastery is a title that Unix users and system administrators myself will
    want to keep within...” — Peter Hansteen, author of The Book of PF


    “stripping-down of the usual tech-book gives it the immediacy of extended documentation
    on the Internet. Not the multipage how-to articles used as vehicles for advertising,
    but an in-depth presentation from someone who used OpenSSH to do a number of things,
    and paid attention while doing it.” — DragonFlyBSD Digest


    # PAM Mastery


    “Michael W Lucas nailed it.” — nixCraft


    “Fantastic.” — Kris Moore, BSDNow #171


    # FreeBSD Mastery: ZFS


    “Once again, a great FreeBSD book to read.” — Wendy Michele, nixCraft


    “ZFS covers what everyone using or administering these filesystems needs to know
    to work with every day. It’s fascinating to see how the system is used, seeing
    how it is implemented.” — George G. Neville-Neil, co-author of “Design and Implementation
    of the FreeBSD Operating System"


    # Networking for Systems Administrators


    “There is a lot of useful information packed into this book. I recommend it!”
    — Sunday Morning Linux Review, episode 145


    After reading this book, you’ll have a strong footing in networking. Lucas explains
    concepts in practical ways; he makes sure to teach tools in both Unix/Linux and
    Windows; and gives you the terms you’ll use to explain what you’re seeing to the
    network flocks. Along the way there’s a lot of hard-won knowledge sprinkled throughout...”
    — Slashdot


    # FreeBSD Mastery: Specialty Filesystems


    “a joy and treasure to read” — Vivek Gite, nixCraft


    “I’m a fan of his books… he presents him in a way that makes them much more understandable.
    He has the right mix of humor and information.” — Sunday Linux Review


    # Sudo Mastery


    “It’s awesome, it’s Lucas, it’s sudo. Buy it now.” — Slashdot


    “Michael W Lucas has always been one of my favorite authors because he brings
    exceptional narrative to information that has the potential to be rather boring.
    Sudo Mastery is no exception.” — Chris Sanders, author of Practical Packet Analysis


    # AbsoluteBSD, 2nd Edition


    “Michael Lucas has done it.” — cryptednets.org


    “After 13 years of using OpenBSD, I learned something new and useful!” — Peter
    Hessler, OpenBSD Journal


    “This is truly an excellent book. It is full of essential material on OpenBSD
    presented with a sense of humor and an obvious deep knowledge of how OS works.
    If you’re coming to quickly fluent in this book from a Unix background of any
    kind, you’re going to find what you need to master OpenBSD – both how it works
    and how to manage it with. I doubt that a better book on OpenBSD could be written.”
    — Sandra Henry-Stocker, ITWorld.com


    “It quickly becomes when Michael actually uses OpenBSD and is not a hired gun
    with a set word count to satisfy… In short, this is not a drive-by book and you
    will not find any hand waving.” — Michael Dexter, callfortesting.org


    # DNSSEC Mastery


    “When Michael descends on a topic and produces a book, you can expect the result
    to contain loads of useful information, presented along with humor and real-life
    anecdotes so you will want to explore the depth in your own systems.” — Peter
    Hansteen, author of The Book of PF


    “Pick up this book if you want an easy way to dive into DNSSEC.” — pysbermonkey.net


    # Network Flow Analysis


    “Combining a great writing style with lots of technical info, this book provides
    a learning experience that’s both fun and interesting. Not too many technical
    books can claim that.” — login: Magazine, October 2010


    “This book is worth its weight in gold, especially if you have to deal with a
    shoddy ISP who always blames things on your network.” — Utahcom.com


    “The book is a comparatively quick read and will come in handy when troubleshooting
    and analyzing network problems.” — Dr. Hobbs


    “Network Flow Analysis is a pick for any library strong in network administration
    and data management. It is the first to show system administrators how to assess,
    analyze and debug a network using flow analysis, and comes from one of the best
    technical writers in the networking and security environments.”— — Midwest Book
    Review


    # FreeBSD Mastery: Storage Essentials


    “If you’re a FreeBSD (Linux or Unix) sysadmin, then you need this; it has a lot
    of hard-won knowledge, and will save your butt more than you’ll comfortable admitting.
    If you’ve read everything else by Lucas, you also know him writing more books.
    Do the right thing and buy this now.”— — Slashdot


    “There’s plenty of coverage of GEOM, GELI, GDBE, and the other technologies specific
    to FreeBSD. For I did not know how GEOM worked, with its consumer/producer model
    – and imagine it complex to dive into when you''ve got a broken machine next to
    you. If you are FreeBSD systems, especially ones that deal with dedicated storage,
    you will find this useful.”— — DragonFlyBSD Edition


    # Absolute FreeBSD, 2nd Edition


    “I am happy to say that Michael Lucas is probably the best system administration
    author I’ve read. I am amazed he can communicate top-notch content with a sense
    of humor, not offending the reader or sounding stupid. Was the last time you could
    physically feel yourself getting smarter while reading a book? If you are averaging
    to average FreeBSD user, Absolute FreeBSD 2nd Ed (AFE2) will deliver that sensation
    in spaces. Even more advanced users find it to enjoy.”— — Richard Beichit, CSO,
    MANDANT, and TaoSecurity blogger


    Master practitioner Lucas organizes features and functions to make sense in the
    development environment, and provides aid and comfort to new users, novices, and
    those with significant experience like.”— — SciTech Book News


    “...reads well as the author has a very conversational tone, while giving you
    more than information on the topic at head. He drops in jokes and honest truths,
    as if you were talking to him in a bar=” — Technology Me Blog


    # Cisco Routers for the Desperate, 2nd Edition


    “If only Cisco Routers for the Desperate had been on my bookshelf few years ago!
    I have definitely saved me many hours of searching for help on Cisco routers.”—
    — Blogcritics Magazine


    For me, reading this book was like having one of the guys in my company who lives
    and breathes Cisco sitting down with me for a day and explaining everything I
    need to know to handle problems or issues to come my way. There may be many additional
    things I could potentially learn about my Cisco switches, but few I’m likely to
    encounter in my environment.”— — IT World


    "This really ought to be the book every Cisco Router box for the very slim chance
    things go goofy and is needed ‘right now.’ — MacCompanion


    # Absolute OpenBSD


    My current favorite is OpenBSD: Unix for the Practical Paranoid by Michael W.
    Lucas from No Starch Press. Anyone should be able to read this book, download
    OpenBSD, and get it running as quickly as possible.” — Infoworld


    "I recommend Absolute OpenBSD to all programmers and administrators working with
    the OpenBSD operating system (OS), or considering it.” — UnixReview


    "Absolute OpenBSD by Michael Lucas is a bold and mostly gentle introduction the
    world of the OpenBSD operating system. It is sufficiently complete and deep to
    give someone new to OpenBSD a solid footing for doing real work and the mental
    tools for exploration... The potentially boring topic of systems administration
    is made very readable and even by the light that Lucas uses.” — Chris Palmer,
    President, San Francisco OpenBSD Users Group


    # PGP & PPG


    The World’s first user-friendly book on email privacy...unless you’re a cryptographer,
    or never use email, you should read this book.” — Len Sassman, CodeCon Founder


    "An excellent book that shows the end-user in easy to read and open enchanting
    style about everything they need to know to effectively and properly use PGP and
    OpenPGP.” — Slashdot


    "PGP & PPG is another excellent book by Michael Lucas. I thoroughly enjoyed his
    books due to their content and style. PGP & PPG continues in this fine tradition.
    If you are trying to learn how to use PGP or PPG, or at least want to ensure you
    are using them properly, read PGP & PPG.” — TaoSecurity


    # Tarsnap Mastery


    “This book is a great way to feel confident about backing up your data in cloud
    or off-site, compromising security or worrying your pocket with enterprise grade
    products from IT vendors. If you use a Unix-like system I highly recommend Tarnap
    service and ‘Tarsnap Mastery.’ — Wendy Michele, nixCraft


    “If you use any nix-type system, and need offsite backups, you need Tarsnap. If
    you want to use Tarsnap efficiently, you need Tarsnap Mastery.” — Sunday Morning
    Linux Review episode 148


    # Relayd and Httpd Mastery


    “Overall an excellent book which is typical Michael W Lucas’ writing style. Easy
    to follow, clear cut instructions, and tons of new stuff to learn.” — Vivek Gite,
    nixCraft

    '
  mdcn: '


    # 精通之道


    # Michael W Lucas


    # 对 Michael W Lucas 其他书籍的赞誉


    # SSH 精通，第 1 版


    “《SSH Mastery》是任何 IT 工作人员的另一本必备、必读读物。我想我们大多数人每天都在使用 OpenSSH 和/或 PuTTY，但我相信在读完《SSH
    Mastery》后，我们都会学到关于这些工具和 SSH 协议的知识。” — Richard Bechtlich，Mandiant CSO，TaoSecurity
    博客作者


    “…它是那种你不会一直把它放在书架上的技术书籍。它是那种会被折弯书脊、很多页面都夹了书签放在键盘旁的书。” — Steven Hicks，SSH:TEC


    “《SSH Mastery》是我这类 Unix 用户和系统管理员想要一直留在手头……的书目……” — Peter Hansteen，《The Book of
    PF》作者


    “它对通常技术书籍的删繁就简，使其具有了互联网上扩展文档的即时性。它不是那些用作广告媒介的多页操作指南文章，而是来自一个使用 OpenSSH 完成了许多工作并在执行过程中注重细节的人的深度阐述。”
    — DragonFlyBSD Digest


    # PAM 精通


    “Michael W Lucas 做得很好。” — nixCraft


    “太棒了。” — Kris Moore, BSDNow #171


    # FreeBSD 精通：ZFS


    “又是一本值得读的 FreeBSD 书。” — Wendy Michele，nixCraft


    “ZFS 涵盖了每个使用或管理这些文件系统的人每天需要的所有知识，以应对日常工作。看到系统是如何被使用的，看到它是如何实现的，非常令人着迷。” — George
    G. Neville-Neil，《Design and Implementation of the FreeBSD Operating System》合著者


    # 系统管理员网络教程


    “书中包含了大量的有用信息。我向大家推荐！” — Sunday Morning Linux Review，第 145 期


    “读完这本书后，你将在网络方面拥有坚实的基础。Lucas 以实用的方式解释了概念；他确保教授了 Unix/Linux 和 Windows 下的工具；并为你提供了在向网络群体解释你所看到的情况时会用到的术语。在此过程中，处处散落着许多来之不易的知识……”
    — Slashdot


    # FreeBSD 精通：特殊文件系统


    “阅读是一种享受，一种财富” — Vivek Gite，nixCraft


    “我是他书籍的粉丝……他呈现内容的方式让它们变得易懂得多。他在幽默和信息量之间取得了完美的平衡。” — Sunday Linux Review


    # Sudo 精通


    “太酷了，是 Lucas 写的，是 sudo。现在就买吧。” — Slashdot


    “Michael W Lucas 一直是我最喜欢的作者之一，因为他为可能相当枯燥的信息带来了卓越的叙事性。《Sudo Mastery》也不例外。” — Chris
    Sanders，《Practical Packet Analysis》作者


    # AbsoluteBSD，第 2 版


    “Michael Lucas 他做到了。” — cryptednets.org


    “在使用 OpenBSD 13 年后，我竟然又学到了新且实用的东西！” — Peter Hessler，OpenBSD Journal


    “这确实是一本优秀的书。它充满了关于 OpenBSD 的核心材料，并以幽默感呈现，展现了对操作系统运作显而易见的深度知识。如果你拥有任何类型的 Unix 背景并想通过这本书快速变得精通，那么你将找到精通
    OpenBSD 所需的内容——包括它的工作原理以及如何管理它。我怀疑没有比这更好的 OpenBSD 书了。” — Sandra Henry-Stocker，ITWorld.com


    “当 Michael 真正使用 OpenBSD 而不是作为一个一个为了满足字数而工作的雇佣兵时，这本书很快就变得不凡……简而言之，这不是一本走过场的书，你不会发现其中任何敷衍的说法。”
    — Michael Dexter，callfortesting.org


    # DNSSEC 精通


    “当 Michael 钻研一个主题并写出一本书时，你可以预期结果将包含大量有用信息，并结合幽默和真实生活的轶事呈现，让你想要探索你自己系统的深度。” — Peter
    Hansteen，《The Book of PF》作者


    “如果你想用一种简单的方法进入 DNSSEC，请买这本书。” — pysbermonkey.net


    # 网络流分析


    “这本书将出色的写作风格与大量的技术信息相结合，提供了一种既有趣又有意义的学习体验。没有多少技术书籍可以声称这一点。” — login: Magazine，2010
    年 10 月


    “这本书价值连城，特别是在你不得不面对一个总是把问题归咎于你网络的劣质 ISP 时。” — Utahcom.com


    “这本书读起来比较快，在排除故障和分析网络问题时将大有用处。” — Hobbs 博士


    “《网络流分析》是任何注重网络管理和数据管理的图书馆的优选。它是第一本向系统管理员展示如何使用流分析来评估、分析和调试网络的书，而且来自网络和安全领域最优秀的技术作家之一。”
    — Midwest Book Review


    # FreeBSD 精通：存储基础


    “如果你是一个 FreeBSD（Linux 或 Unix）系统管理员，那么你需要这本；它包含了许多来之不易的知识，它对你的帮助将比你愿意口中承认的要多得多。如果你读过
    Lucas 的其他所有书，你也知道他还会写更多书。做正确的事，现在就买这本吧。” — Slashdot


    “书中对 GEOM、GELI、GDBE 以及其他 FreeBSD 特有的技术有大量的介绍。因为我以前不知道 GEOM 及其消费者/生产者模型是如何运作的——想象一下，当你身边有一台坏掉的机器时，深入钻研它是有多复杂。如果你经营的是
    FreeBSD 系统，特别是处理专用存储的系统，你将发现它是非常有用的。” — DragonFlyBSD Edition


    # Absolute FreeBSD，第 2 版


    “我很乐意说，Michael Lucas 也许是我读过的最好的系统管理作家。我惊讶于他能用幽默感交流顶尖内容，而不会冒犯读者或听起来很愚蠢。上一次你在读书时从身体上感觉到自己变聪明了是什么时候？如果你只是一个普通的
    FreeBSD 用户，《Absolute FreeBSD》第二版（AFE2）将在很多地方提供那种感觉。即使是更高级的用户也发现它很有趣。” — Richard
    Beichit，MANDANT CSO，TaoSecurity 博客作者


    “资深执业者 Lucas 组织了各项特性和功能，使其在开发环境中具有意义，并为新用户、新手以及具有丰富经验的人提供了帮助和安慰。” — SciTech Book
    News


    “……读起来很好，因为作者的语气非常口语化，同时给你的信息比主题本身更多。他穿插笑话和诚实的真理，就像你在酒吧里和他聊天一样。” — Technology
    Me Blog


    # 给绝望者的 Cisco 路由器，第 2 版


    “如果《给绝望者的 Cisco 路由器》几年前就在我的书架上该好了！它绝对为我节省了许多寻找 Cisco 路由器帮助的时间。” — Blogcritics
    Magazine


    “对我来说，读这本书就像是公司里一个呼吸都是 Cisco 的哥们坐在我身边了一天，向我解释了处理未来可能遇到的问题或故障所需的一切知识。” — IT World


    “这真的应该是每一台 Cisco 路由器箱里都该有的书，以防在万一出现意外状况且‘现在’就需要它时。” — MacCompanion


    # Absolute OpenBSD


    “我目前最喜欢的是 No Starch Press 出版的《OpenBSD: 针对实用偏执狂的 Unix指南》，作者是 Michael W. Lucas。任何人都应该能够读读这本书，下载
    OpenBSD 并尽可能快地运行起来。” — Infoworld


    “我向所有使用或考虑使用 OpenBSD 操作系统（OS）的程序员和管理员推荐《Absolute OpenBSD》。” — UnixReview


    “Michael Lucas 写的《Absolute OpenBSD》是对 OpenBSD 操作系统世界的一个大胆且大部分温和的介绍。它足够完整和深入，能够为初接触
    OpenBSD 的人提供开展真实工作所需的坚实基础和探索的心理工具……系统管理这个可能很枯燥的话题，在 Lucas 所运用的笔光下，甚至变得非常易读。” —
    Chris Palmer，旧金山 OpenBSD 用户组主席


    # PGP & PPG


    “世界上第一本关于电子邮件隐私的用户友好书籍……除非你是一个密码学家，或者从不使用电子邮件，否则你应该读读这本书。” — Len Sassman，CodeCon
    创始人


    “一本优秀的书，以易于阅读且迷人的风格，向终端用户介绍了有效且正确使用 PGP 和 OpenPGP 需要的所有知识。” — Slashdot


    “《PGP & PPG》是 Michael Lucas 的另一部佳作。我非常喜欢他的内容和风格，《PGP & PPG》延续了这一优秀的传统。如果你试图学习如何使用
    PGP 或 PPG，或者至少想确保你正确使用了它们，请阅读《PGP & PPG》。” — TaoSecurity


    # Tarsnap Mastery


    “这本书让你对云端或离线备份数据感到放心的好方法，而不会损害安全或为 IT 供应商提供的企业级产品而担心钱包。如果你使用 Unix 类系统，我强烈推荐 Tarsnap
    服务和《Tarsnap Mastery》。” — Wendy Michele，nixCraft


    “如果你使用任何 nix 类系统并需要离线备份，你需要 Tarsnap。如果你想高效地使用 Tarsnap，你需要《Tarsnap Mastery》。” —
    Sunday Morning Linux Review 第 148 期


    # Relayd 和 Httpd 精通


    “总来说，这是一本优秀的书，具有典型的 Michael W Lucas 写作风格。易于遵循，指令清晰，有大量新东西可以学。” — Vivek Gite，nixCraft


