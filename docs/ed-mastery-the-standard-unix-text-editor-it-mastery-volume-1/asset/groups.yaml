    ## Chapter 110: Substitution


    While regular expressions let you search and manipulate matching lines, ed lets
    you change text based on those same regular expressions. Regex-based substitution
    is an incredibly powerful search and replace function that lesser text editors
    can only dream of. While clumsy regexes can shred your buffer, with practice you
    can quickly and easily transform your text.


    I’ve been swearing at—er, working with—regular expressions for decades. Even today,
    I do a search with a regular expression before performing a substitution based
    on regex. Regular expressions are subtle and quick to anger. Always test them
    first. Even once I think they work, I keep a copy of the untransformed data.


    Use the s command for a substitution, followed by the regular expression and the
    new text. Separate each piece with a slash. `s/regex/new/`


    We’ll start with a simple substitution—but to achieve that, we’ll start with a
    simple search. Using the same list of words as Chapter 101, suppose we want to
    change all instances of “there” to “then.” First search for your regular expression
    to see if you get what you think you’re going to get.


    An error? But our search saw matching strings in the buffer!

    Remember, ed works on a line-by-line basis. Line 1 doesn''t match our regex, so
    it errors. You must use a search (either manual or automatic) to target substitutions.


    Substitutions allow you to programmatically correct errors. Consider one of the
    entries on our word list.


    *18

    theeeeeen


    “Theeeeee” is not a word. The e key obviously stuck when someone typed “then.”
    We can use a substitution to fix it. Here, I replace any string of two or more
    es with a single e.


    `*s/e\{2,\}/e/`


    Check the line now.


    *18

    then


    If I know ahead of time I wanted to print the result, I could have added the p
    command at the end of the substitution. We''ll cover the few specific commands
    that work at the end of a substitution.


    `*s/e\{2,\}/e/p`


    If escaping all of those braces gives you trouble, you could choose the simpler
    option of repeating the substitution. The s command repeats the previous substitution.


    ```

    *s/ee/e/p

    theeeee

    *s

    theeee

    *s

    theeen

    *s

    theen

    *s

    then

    *s

    ?

    no match

    ```


    You might notice that the substitution only affects one match. Consider a line
    like this.


    ```

    *19

    wXXhXXaXtXX XXisXX this?XX

    ```


    I don''t know how all those XX chunks got in there, but they need to go. You might
    try substituting one of these strings with nothing.


    ```

    *s/XX//p

    whXXhaXtXX XXisXX this?XX

    ```


    The substitution engine does the least amount of work you require of it. It matches
    the first XX, between the w and the h, yanks it out. You could tell it which of
    the matches to pull out by giving a number as an argument. I substitute nothing
    for the seventh XX.


    ```

    *s/XX//7p

    wXXhaXtXX XXisXX this?

    ```


    Substitutions are suspiciously human in that regard.


    It''s useful to make minor tweaks to an existing line. The problem with such substitutions
    is that you have to count. It also makes repeating the substitution less useful.
    To repeat the last substitution, hit s again.


    ```

    *s/XX//p

    whaXXTT XXisXX this?

    *s

    whaXXTT XXisXX this?

    ...

    *s

    what is this?

    ```


    I could add a number after the s to repeat the substitution only on a specific
    match on the line.


    Eliminating all the matches is much simpler with the g (global) modifier. It tells
    ed to perform the substitution on every match it the the current line. I''ll also
    add the p modifier to print the results.


    ```

    *s/XX//gp

    what is this?

    ```


    Problem solved.


    ## Combining Searches and Substitution


    Having to find the lines that contain the text you want to substitute would suck
    the joy out of ed. Rather than your mellow, ed can combine searches and substitution.
    Give your substitution after the search, to say “if this matches, perform this
    substitution.”


    Our example tries to find the word “there” and replace it with “then.” The search
    is pretty straightforward: `g/there/`. Much as in the shell, a backslash means
    “continued on the next line.” I then give the desired substitution.


    ```

    *g/there/ \ \

    ss/there/then/

    test there

    thereafter

    4 theremin

    ```


    Ed prints the lines that match the search. But look at those lines now.


    ```

    *5p

    test then

    *7p

    thenafter

    *10p

    4 thenmin

    ```


    Substitution success! Ed considers this combined search-and-substitute (or, as
    the kids would say, search and replace) a single command, so you could reverse
    it with\\. Which I do, because this is a draft example. But you might use this
    in a script to update login scripts, updating links to migrated servers, or any
    other tedious task. We''ll see some examples in Chapter 111.


    The backslash splits this operation into two lines isn''t needed. If you put it
    all on one line, ed doesn''t show the lines that match the search.


    ```

    *g/there/ s/there/then/\*

    ```


    You can have multiple substitutions in one command, but each substitution must
    appear on separate lines, separated by a backslash.


    ```

    *g/there/ s/there/then/\

    s/t/T/n

    ```


    - 7 Test then

    10 4 Thenmin


    This swaps out “then” for “there” and capitalizes the first T of each line.


    While you can use apparently unrelated regexes inside your substitution, a failure
    of one substitution aborts all later substitutions. Arrange your substitutions
    carefully.


    Now that you''ve seen the complicated form, let''s simplify slightly. When you
    want to perform a substitution on the regex you''re searching for, you can use
    the % address to perform the substitution on all available lines.


    `*%s/there/Then/`


    Note this isn''t exactly the same as the more complicated substitution above,
    though; line 5 capitalizes “test” rather than “then.” The full version is much
    more flexible, so we''ll focus on that.


    ## Subexpressions and Backreferences


    A subexpression is a part of a regular expression. Use subexpressions to split
    a line into chunks, as “everything before we care about, what we care about, and
    everything after that.” Subexpressions are marked in parenthesis, such as ([a-zA-Z0-9]).
    Much like curly braces, you must backslash-escape parentheses to tell ed that
    you''re using them for a subexpression. Otherwise, ed looks for literal parenthesis
    characters. While I''m introducing subexpressions, we''ll skip the backslashes
    for clarity.


    For ed to remember the whole line, the subexpression must match the whole line
    that contains the string you want. The period and wildcards come in useful here.
    While /the/ matches a line containing the string “the,” remembering the whole
    line requires using /*the.*/ zero or more of something, what we really want, and
    then zero or more of something. Enclose the regex in parenthesis to have ed remember
    it as a subexpression: /.(.*.*)/


    A backreference lets you refer to the literal text matched by a subexpression.
    You can use backreferences within searches, but they overwhelmingly appear in
    substitutions. Ed recalls subexpressions the order you define them. Your first
    subexpression is backreference one, the second backreference two, and so on. Indicate
    a backreference with a backslash and its number, such as \1, \2, and so on.


    Our sample regex, /(.*), tells Ed to remember one subexpression. There''s only
    a single backreference, \1.


    How would you use a subexpression and a backreference? You might want to search
    for every line that includes opening and closing quote marks. Human beings are
    notoriously inconsistent, so those strings use either single or double quotes.
    I define a character class with both sorts of quotes, [''"\]. That class includes
    parentheses to declare it a subexpression: ([''\]). We could have any number of
    characters after that, up until the next appearance of whatever matched the subexpression:
    .*. Whatever character we found in the subexpression is our first backreference,
    or \1. Put it all together into the regex ([''\\).*\1. I want to use this in a
    search command, so I''ll need to backslash-escape the parenthesis to tell ed this
    is a subexpression: \([''\\).*\1. Use the g command to print the lines matching
    this regex.


    ```

    *g/[''"\\].*\1

    ''bleeeeeep''

    unconscious ''people''

    ```

    '
