    # Afterword


    Okay, come on Lucas, you''re not really serious here... are you?

    I am. And I''m not.

    This is book 13 of my IT Mastery series. My lucky number needed to be a special
    book. The opportunity to release that book on 1 April meant that it had to be
    extra special. Writing a book on ed in 2018 certainly qualifies it as special.

    But ed is a vital part of our heritage. Ed concepts and procedures have infiltrated
    every part of modern UNIX. It''s forty-odd years old, and still useful. As the
    last couple of chapters demonstrate, you can use ed to solve real problems and
    perform real work.

    I''ve worked in more than one organization where adding software to to a host
    meant going through a laborious change control review and security audit. No Perl
    or Python on your system? Too bad for you, that simple bit of automation isn''t
    happening today. Or can you fire up ed, get that pattern-matching done, and get
    on with your day.

    Older tools like ed, awk, and sed? They''re just as powerful today as ever. Take
    the time to master them.

    The next time someone declares themselves a rock star, respond with, “So” you
    wrote an entire operating system on a computer without a monitor? Because that''s
    what it takes to be a real rock star?”

    And remember: if it doesn''t include ed in every default install, it''s not Unix.'
