- pgno: 284
  md: '# xargs: Tandem Execution for "Not-So-Smart" Commands


    We mentioned in the introduction to this section that there are two uses for xargs.
    Our first discussion and example illustrated how xargs can work with files that
    are smart enough to take input from a pipe. But unfortunately, not all commands
    are that smart. For example, rm (the delete command) is one of those not-so-smart
    commands. Faced with this situation, what would you do if you had a lot of repetitions
    of a command (such as rm) to perform? Your options are as follows:


    +   Invoke the command several times manually.

    +   Use some type of automated loop to invoke the command for every file, which
    spawns a subprocess every time the command is invoked (taxing on time and processing
    capability).

    +   In the case of rm, use find to identify the input filenames and then execute
    cat, xargs, and rm in tandem.


    The third option is the best. This example illustrates xargs’s second and very
    valuable use: taking cat’s output and passing it to rm. We will see how this process
    works in Example 9.2.


    # Example 9.2 xargs


    Juana’s portion of the RFI directory structure is illustrated in Figure 9.2. Juana
    now wants to remove the copies of RFI_Tel1, RFI_Tel2, and RFI_Tel3 that she has
    kept in her /home/gutieja/tempwork subdirectory. For the first part of the process,
    she will collect their filenames into a single file called temphone-lists. Then,
    she will cat that file to be sure that it is correct:


    ```

    $ cd <Enter>

    $ cd ~/tempwork<Enter>

    $ find . -name ''*Tel*'' -print > ./temphone-lists<Enter>

    $ cat temphone-lists<Enter>

    ./RFI_Tel1

    ./RFI_Tel2

    ./RFI_Tel3

    ```


    Now, in the second and final stage, Juana will use xargs and rm against temphone-lists
    to remove the copies of the phone list files:'
  merge: -1
  img_proc: true
- pgno: 285
  md: '![](img/cae5c706c216875d12d4b7d28144cc71_285_0.png)


    ```

    $ cat tempphonelists | xargs -t rm<Enter>

    rm ./.RFI_Tel1 ./RFI_Tel2 ./RFI_Tel3

    ```


    The first command was relatively simple: find identified all three phone list
    files and put their names into the tempphonelists file. With the second command,
    cat passed the list of filenames to xargs through stdin/standard input. xargs
    then translated the information from that stdin pipe and passed each parameter
    (in this case, each filename) to the parameter line for the subsequent rm command.
    The xargs command was smart enough to know the length of the parameter line it
    could produce before rm was to be invoked. Thus, rm was invoked the optimum number
    of times, which illustrates why this method is the most efficient way of handling
    this procedure.


    You might have noticed that Juana also used the -t option with xargs. The -t option
    again caused the individual command to be printed to'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'stderr just before the command executed. Juana, like the Don in the previous
    example, was allowed to monitor (in real time as it happens) the number of times
    that rm is invoked. That is why the line rm ./RFI_Tell /RFI_Tel2 ./RFI_Tel3 appears
    while the tandem cat, xargs, and rm commands are executed. In this case, rm itself
    was executed only once.


    # ## Combining the xargs, find, and grep Utilities


    Combining the find, grep, and xargs utilities has its benefits. All are powerful
    and efficient in their own right, but combining them multiplies their usefulness
    and can make you an even more efficient system user. Let''s illustrate their combined
    power by moving to Example 9.3 immediately.


    # ### Example 9.3 Combining find, xargs, and rm


    RFI staff members cooperate with Preston when he searches for files with modification
    dates older than 30 days so that he can remove them from the system. Of course,
    some old files are important, and Preston also cooperates with them to ensure
    that backup copies are available for future reference. But the object is not to
    clutter the storage capabilities of the system.


    Normally, if he did not use xargs and other commands in tandem, Preston would
    have to enter a command like the following:


    ```

    $ find . -type f -mtime +30 -exec rm {} \

    ```


    That might not appear inefficient or objectionable at first glance, but it means
    that rm would be invoked every time a file was found that matched the find criteria.
    How many times would it have to be invoked if Preston was searching through a
    very large file system?


    So this coding is what Preston enters to find and remove the old files. He uses
    find, xargs, and rm in tandem as follows:


    ```

    $ find . -type f -mtime +30 | xargs -t rm <Enter>

    rm ./oldfilex ./oldfiley ./oldfiles etc...

    ```


    Using xargs allows Preston to pass multiple parameters to rm, so rm is invoked
    far fewer times to remove all of the old files. In addition, Preston finds the
    xargs syntax easier to remember than the combined find, exec, and rm syntax. Note
    that in Example 9.3, we show Preston using the -t xargs option so that he can
    see how many times rm would actually be invoked.'
  merge: -1
  img_proc: true
- pgno: 287
  md: "# Example 9.4 Combining find, tail, and grep\n\nSancho wants to call and talk\
    \ to Dapple’s trainer, but because he is still new to RFI and has only been to\
    \ the stable/spa in Toledo once, he can-not remember who Dapple’s trainer is.\
    \ But he knows that each animal’s profile has the trainer’s name in it. He was\
    \ just reading the profiles and adjusting them recently, but their filenames have\
    \ slipped his mind. But he can quickly examine his current directories and find\
    \ all the files containing the word “trainer” (regardless of whether it is in\
    \ upper or lower case). This is what he enters:\n\n```\n```\n$ find . -type f\
    \ | xargs -t grep -lwI 'trainer' lpr<Enter>\n  grep -lwI trainer lpr ... recursive\
    \ listing of files ...\n./Maint/rosinante\n./Maint/dapple\n```\n```\n\nFirst,\
    \ find passes a list of the files in the current directory to xargs. The xargs\
    \ command invokes grep to look into all the files for the entire word trainer\
    \ (the -w option) regardless of case (the -i option) and list the names of the\
    \ files containing trainer (the -l option). The output list is handed to lpr,\
    \ which prints a recursive list of the files examined to the screen. After that,\
    \ the names of the files that contain trainer are printed: rosinante and dapple,\
    \ both of which are in Sancho’s Maint subdirectory.\n\nWe can see that grep was\
    \ invoked only once because the example file structure contains a small number\
    \ of files. If there had been many more files to examine, invoking grep more often\
    \ might have been necessary.\n\n# Linux/UNIX Shortcut: The alias Command\n\nYou\
    \ would probably appreciate being able to execute frequently used commands with\
    \ fewer keystrokes. Or, there might be long-winded commands, frequently used or\
    \ not, for which you would really appreciate using fewer keystrokes.\n\nEnter\
    \ the alias command, which you can use to:\n\n+   - Create an abbreviated command\
    \ name—or perhaps some kind of mnemonic sequence—that becomes a new internal shell\
    \ command that will accomplish the same effects as the longer command it replaces.\n\
    +   - Investigate to find any aliases that have already been created."
