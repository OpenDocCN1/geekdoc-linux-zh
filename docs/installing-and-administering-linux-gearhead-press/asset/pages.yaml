  md: '# CHAPTER


    ![](img/cae5c706c216875d12d4b7d28144cc71_280_0.png)


    # # Advanced Linux Utilities


    In Chapter 8, “Basic Linux Utilities,” we discussed some basic Linux utilities.
    This chapter continues that discussion and broadens your ability to perform file
    system administration. In several of the sections and examples in this chapter,
    we refer once again to Sancho''s file structure.


    # ## Maximizing Work per Command: xargs


    For efficient execution, the `xargs` command is one of the best commands that
    Linux/UNIX offers. `xargs` has two very valuable functions that we will discuss
    here.


    # ### xargs: Optimal Execution for “Smart” Commands


    Some Linux/UNIX commands are smart enough to take input from a parameter line
    and execute with it. Moreover, if the parameter line is empty, the command is
    again smart enough to take input from `stdin`,'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'which is often a pipe. **xargs** is a very efficient command that can read
    several arguments one line at a time from its stdin and then assemble as many
    of them as possible into a single command line until it determines that it has
    reached its capacity. By “reached capacity,” we mean that **xargs** would not
    be capable of executing if any more arguments were added. Also, the arguments
    to **xargs** are generally commands or programs themselves, as you will see in
    Example 9.1.


    Thus, once **xargs** has filled its input to capacity this way, all the commands
    will be executed. If there are still more arguments in the source, **xargs** will
    assemble more of them into another single command line until it too is filled
    to capacity, and then those command(s) will be executed. The **xargs** command
    continues to perform this task until it exhausts the given supply of arguments/commands.


    The syntax for **xargs** is as follows:


    ```

    $ command [options] | xargs [options] [arguments]<Enter>

    ```


    We recommend that when **xargs** is executed, the -t option (which invokes verbose
    mode) should be included—at least until you are familiar with **xargs** and it
    is doing exactly what you want. After you get comfortable with **xargs** and can
    trust it, you will probably no longer choose to use the -t option.


    # **Example 9.1 Using xargs with “Smart” Commands**


    In Example 9.1, we will illustrate two fairly simple applications of **xargs**.
    But first, let’s take a look at the latest version of Don Quixote’s portion of
    the RFI directory structure in Figure 9.1. He has been busy preparing for the
    next Noble Deeds Division journey. He has expanded his file structure so that
    he can dedicate a file to each provision.


    Don Quixote has two objectives at this point:


    +   - To print the large number of filenames within his new /home/quixote/provisions
    subdirectory


    +   - To change the names of the existing files so that he can add new files with
    similar names later


    Here is how he will use **xargs** and other commands to print the filenames:


    ```

    $ cd /home/quixote/provisions<Enter>

    $ ls > prov_list<Enter>

    ```'
  merge: -1
  img_proc: true
- pgno: 282
  md: '![](img/cae5c706c216875d12d4b7d28144cc71_282_0.png)


