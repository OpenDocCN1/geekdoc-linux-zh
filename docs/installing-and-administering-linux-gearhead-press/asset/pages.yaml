  md: 'most commands is usually the terminal screen). There are several types of redirection
    depending on what you want to do.


    > **NOTE** Some commands produce output that cannot be redirected in this way.
    For example, print commands write to the printer, period.


    # Destructive Redirection


    If your intention is to add data to an existing file or to create a file for the
    data “on the fly,” then you can use destructive redirection. It is called “destructive”
    because, if the target file already exists *and* it already has data in it, that
    data will be overwritten.


    The syntax is


    ```

    $ command > filename<Enter>

    ```


    Example 7.18 illustrates the default standard output of the `ls` command followed
    by the instruction to `ls` to send its output to the *phone_no.out* file. If the
    file does not yet exist, it is created. If the *phone_no.out* file already exists,
    its contents are overwritten (called destructive redirection).


    # Example 7.18 Destructive Output Redirection Using >


    Juana, when she lists the names of her telephone list files, illustrates the default
    behavior (especially the standard output, which is what we will concentrate on)
    for the `ls` command. Typically, the standard output (*stdout*) is her terminal
    screen. First, she changes to her */guitejua/admin/phone/* subdirectory. Then,
    she lists the contents with `ls`:


    ```

    $ cd /guitejua/admin/phone$=Enter>

    $ 1s<Enter>

    RFI_Tel1 RFI_Tel2 RFI_Tel3

    ```


    Table 7.5 lists the default descriptors and behavior for the `ls` command as illustrated
    by what Juana has just done. Because these are default attributes, the Status,
    at this point, is “unchanged” for all descriptors.


    Juana will now instruct the `ls` command to redirect its output to the *phone_no.out*
    file. If the *phone_no.out* file exists, it will be overwritten. If it does not
    exist yet, it will be created:


    ```

    $ 1s > phone_no.out<Enter>

    ```'
