    # ## Starting vi


    Assuming that you have logged into Linux and are now facing the command-line prompt,
    enter the following to invoke vi:


    ```

    `$ vi filename<Enter>`

    ```


    If the specified file already exists, vi creates a copy of it and puts the copy
    into a **buffer** in the */tmp* directory for you to work on. If the file does
    not exist, vi opens an empty buffer in the same directory and gives the file the
    name specified in your vi command.


    When invoked, vi checks for a file called *.exrc* and incorporates any specifications
    found there (we discuss .exrc later in this chapter in a section titled *Options
    for Changing How vi Operates*). Then, vi starts in Command mode and waits for
    directions from you. What you see on the screen is a flashing cursor and the filename
    at the bottom of the screen. If the file is new, the editor tells you so on the
    last line. For instance, if you invoke vi to create a new file called *RFL_trip_laundry*,
    you would see an empty screen similar to that in Figure 10.1. Dashes represent
    blank lines, and like we said, the filename appears on the last line.


    If the file already exists, Linux gives you the filename in double quotes as well
    as the number of lines and number of characters in the file. Figure 10.2 shows
    you what might result if you had created *RFL_trip_laundry*, exited vi for a while,
    and then invoked vi again to edit the same file. As you can see from the bottom
    of the screen, the file has 13 lines with 172 characters (equal to all the characters,
    blanks, and line feeds).


    # ## Exiting vi


    To exit from the vi editor, you must be in Command mode. To ensure that you are
    in Command mode before inputting commands at any time, press Esc. You can exit
    vi in one of the following ways (all end with pressing Enter):'
