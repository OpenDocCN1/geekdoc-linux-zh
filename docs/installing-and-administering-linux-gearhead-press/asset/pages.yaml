  md: "# ## Samples of Environment-Building Files\n\nLet’s look at some of the files\
    \ illustrated in Figure 11.2 in some detail. Some are system-wide in scope; some\
    \ pertain only to individual users.\n\n# ### A Sample /etc/profile File\n\nThe\
    \ *etc/profile* file is the default initialization file for the *bash*, *ksh*,\
    \ and *sh* shells. Because it contains the environment commands and variables\
    \ that are invoked when every user logs into the system, this file is also called\
    \ the *global profile*. Only the system administrator can change the file, but\
    \ individual users can override the variables by modifying them in their own *$HOME/.bash_profile*\
    \ files. The *etc/profile* file, however, is *not* intended to replace the individual\
    \ user’s *$HOME/.bash_profile* script file. All customizing should be performed\
    \ in those individual scripts.\n\nThe *etc/profile* should be kept as small as\
    \ possible because it is used by other scripts as well as by users. Example 11.7\
    \ shows the contents of a sample global profile file. An explanation of some of\
    \ its variables is contained in Table 11.1, which follows it.\n\n# ### Example\
    \ 11.7 Examining an etc/profile File\n\nFreston is in charge of maintaining and\
    \ altering, if necessary, to reflect new corporate policies, the system-wide environment.\
    \ So occasionally, he has a look at the “global profile”, that is, at the *etc/profile*\
    \ file.\n\n```\n# cat /etc/profile<Enter>\n# /etc/profile\n# System-wide environment\
    \ and startup programs\n# Functions and aliases go in /etc/bashrc\n\nif ! echo\
    \ $PATH | /bin/grep -q \"/usr/X11R6/bin\"; then\n  PATH=\"$PATH:/usr/X11R6/bin\"\
    \nfi\n\nPS1=\"\\u@\\h \\w\\$  \n\"\nulimit -S -c 1000000 > /dev/null 2> &1\nif\
    \ [ `id -gn` = `id -un` -a `id -u` -gt 14 ]; then\n  umask 002\nelse\n  umask\
    \ 022\nfi\n```"
