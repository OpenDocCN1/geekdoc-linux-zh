- pgno: 327
  md: '# # Adding Text in Insert Mode


    Let''s say that you open a file in `vi` and want to enter text. Then, you must
    be in Insert mode (also known as input mode or text mode). Take the following
    steps to get into Insert mode and then insert text:


    +   1. Using the up and down arrows, position the cursor at the point in a new
    or existing file where you want to begin inserting text.


    +   2. Use one of the following single-letter commands:

    +       - `a` adds text immediately after the cursor.

    +       - `A` (that is, Shift-A) adds text beginning at the end of the line on
    which the cursor is sitting.

    +       - `i` inserts text beginning at the same position presently underlined
    by the cursor.

    +       - `I` inserts text at the beginning of the line on which the cursor is
    sitting,

    +       - `<Insert>` also inserts text beginning at the same position presently
    underlined by the cursor.


    +   3. Add your text.


    The difference between `a` and `i` will become apparent with practice. Note that
    while you are adding text, the filename, which was at the bottom of the terminal
    screen, has been replaced by `- INSERT -`. This message is a reminder that you
    are in Insert mode.


    If you want to save your text as you go, press Esc to re-enter Command mode and
    then type the following:


    ```

    :w<Enter>

    ```


    This action saves the text you have entered thus far, updates the file''s status
    for you (`"filename" Line count, Character count`), and keeps the file available
    for input. To resume entering text, use one of the single-letter commands just
    listed.


    When you finish adding text, you need to leave Insert mode by pressing Esc. You
    are then returned to Command mode. Then, you will see that your file is still
    on the screen, but the filename is no longer displayed at the bottom.'
  merge: -1
  img_proc: true
