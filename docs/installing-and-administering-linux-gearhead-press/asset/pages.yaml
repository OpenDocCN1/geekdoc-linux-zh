    # ## Additional File Comparison Commands: comm and diff3


    Two similar commands that might be of interest are **comm** and **diff3**. The
    **comm** command shows you which information is common to both files as well as
    the information that is unique to each file. It presents lines that are only in
    the first file in column one, lines that are only in the second file in column
    two, and lines that are found in both files in column three.


    The **diff3** command enables the user to compare three files. The output coding
    is a little different, but the principles are the same as in **diff**. For further
    information, consult your information sources.


    # # Comparing All Types of Files: The cmp Command


    In the preceding section, we discussed the **diff** command, which is used to
    compare text files line by line. The **cmp (file compare)** command differs from
    **diff** in several ways. First, **cmp** is used for text files and other types
    of files as well. Furthermore, **cmp** compares byte by byte rather than line
    by line. In text files, **cmp** makes a character-by-character comparison. Its
    syntax is as follows:


    ```

    ```

    $ cmp [-options] file1 file2<Enter>

    ```

    ```'
  merge: -1
