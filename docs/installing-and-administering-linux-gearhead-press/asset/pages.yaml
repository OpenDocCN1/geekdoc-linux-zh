- pgno: 367
  md: 'and commands) and its companion, the /etc/bashrc shell script (which contains
    system-wide functions and aliases) can be changed only by the system administrator
    or root user. The init program has also invoked a mingetty program.


    Normally, a getty is a program that is invoked by init to connect a user with
    the Linux/UNIX system. Initially, getty prints the contents of /etc/issue (if
    it exists), then prints the login message field for the entry it is using. When
    you log in by supplying your username, the getty (in our case, mingetty, which
    is a scaled-down getty program) program invokes the /bin/login program, which
    carries out a number of functions and prompts you for a password. Also, while
    reading your login name, mingetty attempts to adapt the system to the speed and
    type of terminal being used. (If you type the ps a command at your terminal, you
    will see copies of /sbin/mingetty waiting at your other virtual terminals.)


    If you provide a password that matches the now-encoded password on file for you,
    login authenticates you and then runs the login command with the /etc/passwd profile.
    Now that you have been authenticated, your login shell—the one listed alongside
    your username in /etc/passwd—is invoked.


    Your $HOME/.bash_profile and $HOME/.bashrc shell scripts are used to initialize
    the bash shell and add more variables and values to your shell environment. The
    environment variables in those scripts override any of the same variables set
    in previous scripts (for example, PATH as it might have been defined by /etc/profile
    or /etc/rc.d/rc.sysinit). In addition, you can change or add to the $HOME script
    files to customize your environment. The difference between .bash_profile and
    .bashrc is that .bash_profile is used when you are in your login shell and .bashrc
    is read when you invoke any other child process (such as a subshell) that is not
    your login shell. Both bash and tcsh distinguish between the login shell and other
    invocations of the shell. If .bash_profile is not present at login, .profile is
    used if it exists.


    Now that you are authenticated and your shell is initialized, login displays the
    message of the day (/etc/motd), if there is one, checks for any e-mail messages
    awaiting you, and notifies you whether e-mail messages are available.'
