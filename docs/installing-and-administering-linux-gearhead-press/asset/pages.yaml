    # ## Command-Line Parsing


    Earlier, we mentioned Linux/UNIX shells as command interpreters. Here is what
    the shell does as a command interpreter.


    When a command is presented to the shell, it looks at the command name to see
    whether it matches an internal shell command that it can execute by itself. It
    also checks to see whether the command is an alias for another command. If it
    is not an internal command and not an alias for an internal command, the shell
    searches for the program according to the command name submitted on that part
    of the hard disk defined in its *PATH* environment variable. (See Example 11.1
    for an example of the *PATH* variable.) If it can find the program somewhere in
    its specified *PATH*, the shell executes it and feeds it the arguments, if any,
    provided at the command line.


    What if the program cannot be found in the specified *PATH*? The shell responds
    with an error message:


    ```

    shellname: commandname: command not found

    ```


    Please remember that the program might be on the hard disk but not within the
    *PATH*. If you suspect that this situation is the case, try using a command such
    as the following to find it:


    ```

    $ whereis commandname<Enter>

    ```


    (The *whereis* command and other related commands are discussed in Chapter 13,
    “Shell Programming.”) If the shell tells you where the program is, re-enter the
    command name at the command line but use the absolute path name as well as the
    name of the program. For example, in later distributions of Linux, the *banner*
    command might have to be invoked by using


    ```

    $ /usr/games/banner -w40 "hello friends"<Enter>

    ```


    (This information is handy to remember when doing Exercise 14 at the end of this
    chapter.) Before the shell begins searching for the executable'
  merge: -1
