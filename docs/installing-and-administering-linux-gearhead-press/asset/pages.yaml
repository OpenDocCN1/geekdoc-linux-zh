    # Managing Directories


    An understanding of directory structure and the ability to navigate that structure
    provide a foundation for the most important aspects of directory management: the
    creation and deletion of directories and the examination of their contents. These
    activities are among the most important and basic of an administrator’s duties.
    Without these essential skills, users and administrators would be unable to organize
    their applications, data, and information. Perhaps even more important: Without
    these skills, users and administrators might never find the data and information
    they’ve already created.


    # Creating Directories: The mkdir Command


    The *mkdir* (make directory) command creates new directories and names them according
    to the specified directory name. You can specify multiple directory names as long
    as you separate each by a space.


    The syntax for the command is as follows:


    ```

    $ mkdir [-m] directoryname(s)

    ```


    Each new directory or subdirectory automatically contains the standard entries:
    dot ( . ) and dot-dot ( . . ). Use -m as an option before the chosen directory
    name to specify which permissions to set for the new directory when it is created.
