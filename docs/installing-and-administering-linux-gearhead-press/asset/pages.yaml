    # ## Moving and Copying Text by Characters and Words


    As we mentioned previously, vi utilizes 36 buffers into which you can cut or copy
    (or, as vi says, yank) file data. Unless you specify a buffer number or letter,
    the data is cut or copied into buffer 0 by default.


    There are also many commands available for copying or moving text in Command mode.
    We list several ways of doing so in Table 10.3, along with two commands to use
    if you want to undo the action. These commands are handy enough for copying or
    moving text but are not as popular as the “line by line” technique we will describe
    next. Meanwhile, for additional commands to those we list in Table 10.3, check
    Appendix A as well as the man pages and other information sources.


    # ## Moving or Cutting Text Line(s) by Line(s)


    The vi editor utilizes 36 buffers (numbered 0 through 9 and lettered a through
    z) into which you can cut or copy file data. Unless you specify a number or a
    letter, the data is cut or copied into buffer 0 by default. Here is the general
    line-by-line text moving procedure:


    +   - In Command mode, move the cursor to the line you want to move.

    +   - Press dd. The specified line disappears into buffer 0 (the default buffer),
    and the cursor moves to the next line.'
