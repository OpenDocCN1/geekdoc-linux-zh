  md: '# CHAPTER 4


    ![](img/cae5c706c216875d12d4b7d28144cc71_116_0.png)


    # # Files and Directories in Linux


    In Chapter 3, “Getting Started Using the Linux System,” we discussed a few basic
    Linux user commands. In this chapter, we begin to look at some basic Linux administrative
    functions—those dealing primarily with the directories on your system. We will
    start by defining files (but only to contrast them with the definition of a directory).
    We address files and file manipulation in more detail in Chapter 5, “Using Files
    in Linux.” Meanwhile, other topics in this chapter include the structure and hierarchy
    of Linux file and directory systems, navigating around the directory structure,
    managing directories, and using floppy disks (in ext2 and DOS formats). If you
    are a UNIX veteran, you might consider these topics elementary or almost trivial.
    Try to take time to review these concepts and tasks, however, because they are
    fundamental to creating and maintaining a proper Linux file and directory system.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# File System Structure and Hierarchy


    The Linux operating system does not impose any internal structure on the contents
    of a file, nor are any specific attributes required. Only the application or tool
    is concerned with a file’s structure and contents.


    # File Types


    In Linux, everything—including the devices attached to the system—is represented
    as a file. First, though, what is a file? The answer is as follows: a file is
    1) a collection of data or 2) a stream of characters (that is, a byte stream).
    A typical file can contain either text or code data. Text files are readable by
    a user and can be displayed or printed. Code data, also known as a binary file,
    is readable by the computer and might even be executable.


    Linux does not impose any internal structure on the content of a file (we will
    allude to this fact again when we discuss the creation and use of floppy disks).
    The user is free to structure and interpret the contents of a file in whatever
    way he or she believes is appropriate for his or her needs. You might notice that
    this philosophy and technology is unlike “that other major operating system” that
    is so prevalent in our homes and workplaces. Thus, in Linux, only the application/utility/tool
    cares about the structure and contents of a file; the operating system does not
    require the file to have any specific attributes. Meanwhile, all information about
    a file, except for its contents, is stored in the file’s inode (index node), which
    we will discuss a little further in the next section.


    Linux can recognize the following file types:


    +   Ordinary files. Contain either text or code data. Text files are readable
    by users and can be displayed or printed. Code data, also known as binary files,
    are readable by the computer. Binary files can be executable.

    +   Directories. Contain information that the system needs in order to access
    all types of files but do not contain the actual data. Each directory entry represents
    either a file or a subdirectory. Directories and subdirectories constitute a method
    of storing files in some type of logical order (such as alphabetical or numerical).

    +   Special files. Usually represent devices used by the system. An application
    of special files appears in the Path Names section later in this chapter.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# Directory Contents


    Although it is customary to refer to a directory as a type of envelope that contains
    entire subdirectories, files, and their contents, in truth a directory is a unique
    type of file that is used to organize other files into a hierarchical structure.
    Thus, it contains only the information that is needed to access the files or other
    directories that are affiliated with it according to (hopefully, generally) some
    sort of logical order. As a result, a directory occupies less space than other
    types of files.


    A directory resembles a table of contents. It lists the names of files and subdirectories
    and their corresponding inode numbers. When users execute a command to access
    a file, they use the filename. The system consults the directory to match the
    filename with its corresponding inode number and then accesses the inode table,
    which holds information about the file''s characteristics (including its location).
    Then, once the system knows the location of the file, the data can be located.
    See Figure 4.1 for a partial listing of contents of the quoted directory, which
    is shown in its entirety in Figure 4.2, as well as an illustration of the corresponding
    inode table entries.


    ![](img/cae5c706c216875d12d4b7d28144cc71_118_0.png)'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'The following categories of information are stored in the inode table:


    +   ▪ The file type (directory or file)


    +   ▪ The mode (directory or file permissions; see Chapter 6, “Linux File Permissions,”
    for details)


    +   ▪ Links (which enable you to refer to a file by more than one name; for more
    information about linking, see Chapter 5)


    +   ▪ The userid of the file’s owner


    +   ▪ Group permissions


    +   ▪ The date the file was last accessed and modified


    +   ▪ The file size


    +   ▪ The file’s location


    Remember that the filename is stored in a directory, *not* in the inode table.
    You might ask, “Why not store the inode information in the directory and dispense
    with the inode table?” Our answer is as follows: restricting information in the
    directory to filenames and inode numbers simplifies directory management and allows
    for the efficient use of disk space.


    # Hierarchical Structure


    The file structure depicted in Figure 4.2, called *a directory tree*, represents
    only part of a typical Linux file system. In this depiction, directory names appear
    in boxes and filenames are unboxed words.


    The top of the structure is the root ( / ) directory. The root contains many directories
    that are critical in system operations. Root subdirectories depicted in Figure
    4.2 are described in Table 4.1.


    You can also access files on other computers on the network. The details of that
    process are beyond the scope of this book. For now, just remember that from a
    user’s perspective, the network is configured such that remote files appear to
    behave just like local files. The /home, /usr, /tmp, and /var directories are
    examples of directories whose files can be accessed by local and remote systems.


    # Path Names


    The purpose of a path name is to tell you the location of a file. You write a
    path name as a string of names separated by forward slashes ( / ). The rightmost
    name is the filename and can represent any type of file; the other'
  merge: -1
  img_proc: true
- pgno: 120
  md: '![](img/cae5c706c216875d12d4b7d28144cc71_120_0.png)


    Figure 4.2 Linux directory tree.


    # Table 4.1 Root Subdirectories


    | SUBDIRECTORY | DESCRIPTION |

    | :--- | :--- |

    | /usr | System programs such as /usr/bin, which in turn contain user commands
    such as ls, cat, and date. Because the /usr directory generally contains system-related
    rather than user-related commands and utilities (despite its name), users do not
    have write access to this directory. In addition, because the files in this directory
    are system related, the directory is not considered very dynamic. |

    | /dev | Special files that represent devices |

    | /home | User login directories and files. When a user is added to the system,
    he or she is allocated an individual subdirectory, the name of which is the same
    as the user''s login name. When users log in, they are put in their own directory
    and they can do whatever they want with it, such as create subdirectories within
    it and create, delete, move, copy, and rename files. Because users generally change
    their files regularly, the /home directory is considered quite dynamic. |

    | /sbin | System utilities for system startup |


    continues'
