    # Executing Shell Scripts


    Before executing a shell script, you have to determine two things:


    +   Can the users access the script file?

    +   How will the script be executed? Are the permissions on the shell script file
    set so the script can be executed in the manner you intended?


    # Can Users Access the Script File?


    In order for users to be able to execute the script file, they have to be able
    to access it. If they cannot, then naturally they will never be able to execute
    it.


    One way to make it accessible is to put the script file in a directory to which
    there is a path. So, try to make sure its directory is listed in the PATH environment
    variable: yours, your group''s, or everyone''s. If there is no path to the directory,
    then whoever tries to invoke it will get a message from Linux similar to the following:


    ```

    bash: script1: No such file or directory

    ```'
