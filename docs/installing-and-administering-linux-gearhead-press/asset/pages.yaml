- pgno: 238
  md: 'You can also use `fc` to edit any of your previous commands by invoking the
    editor of your choice. An example is `fc -e vi 68`, which means "edit previous
    command number 68 with the vi editor." The shell responds by opening `vi` and
    displaying the command corresponding to number 68 on the top line. You do whatever
    editing you want and then exit `vi`, after which the shell executes the newly
    modified command.


    Here is another example. Assume that your previous command number 68 is `set |
    more`. You want to change it quickly to `set | cat` and then execute it immediately
    without going into or exiting from a text editor. Just type the following:


    ```

    ```

    fc -s more=cat 68<Enter>

    ```

    ```


    The default text editor is automatically invoked and changes command number 68
    to what you want, and then the shell executes it.


    You might ask how you can control which text editor the shell uses. Set the `FCEDIT`
    variable to the name of your preferred text editor. If nothing is specified for
    `FCEDIT`, `vi` is used by default. One thing you will probably notice after using
    `fc` is that when you display your command history, you never see the `fc` command.
    All you see is the proper or revised command. The only time the `fc` command and
    its options are displayed is when command execution did *not* occur, which means
    that you made a mistake.


    For other `fc` options and arguments, refer to your sources for additional information.


