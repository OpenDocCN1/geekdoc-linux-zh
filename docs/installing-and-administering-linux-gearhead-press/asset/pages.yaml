    # Example 9.16 gzip with the Verbose (-v) Option


    Don Quixote’s niece and housekeeper in La Mancha knows that the Don and Sancho
    will be traveling in August. They never know how to reach the Don when he is traveling
    (they are reluctant to say “when he’s on the road” because he has landed on gravel
    and asphalt so many times before). So they call Juana and ask for a copy of the
    telephone lists. Juana is glad to comply. She combines all three `RFL_Tel*` files
    into one file called `RFL_Phone$` and then compresses that one file in preparation
    for transmission by e-mail. Here is how she creates the single file with `cat`
    and then uses `gzip` with its `-v` (verbose) option so that she can see that the
    task is done:


    ```

    $ cd /home/gutie/ jua/phone#<Enter>

    $ cat RFL_Tel* > RFL_Phone$<Enter>

    $ gzip -v RFL_Phone$<Enter>

    RFL_Phone$::  58.0% --  replaced with RFL_Phone$.gz

    ```


    | OPTION | DESCRIPTION |

    | :----- | :---------- |

    | -v     | Verbose. Print the original name and the new compressed file name along
    with the percent compression to which the file has been subjected. |

    | -r     | Recursive. When used with a directory name, execute `gzip` on all files
    in the directory and from that directory down through the file system. |

    | n      | Speed of compression; *n* is a number from 1 through 9. 1 executes
    compression at the fastest speed with the least compression. 9 executes compression
    at the slowest speed, resulting in the highest compression. The default value
    is 6. |'
  merge: -1
