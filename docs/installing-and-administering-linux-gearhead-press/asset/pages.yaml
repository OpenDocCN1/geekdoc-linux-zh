    ```


    Preston says, “Well, Sancho, although you (fortunately, even luckily) got the
    same output to the screen that I did, you didn’t really get the same result. When
    I cat’ d my errfile, I found it to be empty. So I’m confident that I was able
    to examine all directories. Why? My errfile is empty?”


    Sancho checks and tells him, “No way! My errfile is full of errors! Many directories
    didn’t allow me entry at all!”


    The lesson here is to be careful with commands like this one. If the command does
    not appear to provide the expected output, or even if it does, it might still
    have created errors. But you will not know about the errors unless you check the
    errfile file. An ordinary user (as opposed to a superuser or a root user) is likely
    to encounter more errors in these situations due to a lack of permissions on directories
    or files.


