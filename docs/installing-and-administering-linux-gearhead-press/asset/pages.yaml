  md: '# Setting Shell Variables by Command

    Substitution


    In the preceding discussion of variable substitution, you saw how to specifically
    place a value into a variable. In this section, we discuss how to place the result
    of command execution into a variable.


    In Linux''s bash shell, you can accomplish command substitution by using two types
    of syntaxes:


    ```

    ```

    $ variablename=`command (-options) [arguments]`

    ```

    ```


    and


    ```

    ```

    $ variablename=$(command (-options) [arguments])

    ```

    ```


    The first syntax example uses back quotes (not single quotes) to surround the
    command whose output you want to assign as the value of the variable. The back
    quote key (‘ ` ’) is located immediately to the left of the 1 key. Do not confuse
    the back quote with single quotation marks.


    Back quotes are supported by the classic Bourne and C shells, so they are supported
    also by the bash and tcsh shells. Back quotes are supported by the Korn shell
    for backward compatibility.


    The second type of syntax, variablename=$(command … , etc.), was originally specific
    to the Korn shell.


    # Example 11.5 Command Substitution: Variable

    Values Set to Command Results


    Freston, while performing several of his routine administration functions, makes
    use of command substitution. In the following code, he will define a variable
    called now and for its value substitute the output of the date command:


    ```

    ```

    $ date<Enter>

    Mon Jul 16 16:14:34 CST 2001

    ```

    ```


    He sets the variable to contain the results of the command:


    ```

    ```

    $ now=`date`<Enter>

    ```

    ```


    or'
