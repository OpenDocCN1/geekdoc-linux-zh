    which the redirections and associations appear to show that the order does matter.
    But in this part of the example, the error messages will be redirected to the
    standard output location—which is the terminal screen—and *then* standard output
    will be redefined as *combo*:


    ```

    ```

    $ cat RFL_Tel3 /root/RFL_et_al_Tel# 2>&1 > combo

