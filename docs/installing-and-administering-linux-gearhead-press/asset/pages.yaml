  md: 'CHAPTER


    ![](img/cae5c706c216875d12d4b7d28144cc71_70_0.png)


    # # Getting Started Using the Linux System


    Initial access to any operating system is gained by logging in and out, so that
    is where we will begin here. The chapter continues with Linux/UNIX commands for
    adding users, adding and changing passwords, and communicating with all or some
    selected users on a Linux system. We include information on Linux/UNIX syntax
    and end with a description of several tools that we find useful and hope that
    you will, too.


    # ## Logging In and Out


    Because Linux, like other UNIX systems, is a multi-user system, a basic level
    of security is implemented to control access. Although passwords might only be
    optional on some UNIX systems, they are *mandatory* on Linux systems. The system
    administrator sets the initial password for each user, but users can change their
    own passwords after they first log into the system.


    > **NOTE** The term Linux/UNIX is used here to describe commands that work on
    Linux as well as on any UNIX-based system.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Logging In


    After you have booted your system and are ready to log in, the screen displays
    the hostname login prompt (hostname refers to the name given to the computer during
    the installation of Linux). At this point, you enter your username:


    hostname login: username


    You are then presented with the following message:


    Password:


    Obviously, this prompt tells you to provide your password by typing it. For security
    purposes, the password is not echoed back to (displayed on) the screen as it is
    entered. If the password matches your records and this is the first time you have
    logged into the system, the system replies with a system prompt. An example of
    such a prompt follows:


    [username@hostname "home dir"$ ]


    The prompt shown has two components: The first `username@hostname` indicates the
    name of the user and the system to which they are logged in, and `home dir` indicates
    that immediately after the login, the user has been placed into his or her home
    directory in the file system. Then, every time the user changes directories in
    the file system, the name of the new directory (that is, the present working directory
    or `pwd`) will appear as part of the prompt in the place where `home dir` is presently
    displayed. That is why, later in this book, you might see other terms in the prompt.
    One common term will be `username`, another indication that the user is situated
    in his or her home directory (the absolute name of which is commonly `/home/username`;
    the prompt will only take the last part of the directory name). These system prompts
    can be customized. We will discuss customizing them later in Chapter 11, “Shell
    Variables and the User Environment,” when we discuss the user environment.


    Meanwhile, if you have logged in and out of the system previously, the system
    instead displays the following:


    Last login: day date time on login location

    [username@hostname "home dir"$ ]'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'In either case, the $ prompt indicates that the system is now ready for you
    to enter additional commands.


    # ## Logging Out


    To log out, you have a choice of three methods: Entering the `logout` or `exit`
    commands or simultaneously pressing the combination Ctrl-D. The first choice looks
    like the following:


    ```

    `[username@hostname "home dir"]$ logout<Enter>`

    ```


    The `logout` command works only when you are in your own login shell, which is
    where you generally conduct your business anyway. (For more information about
    the login shell, see Chapter 11.) If you should discover that `logout` does not
    work, use the `exit` command as follows:


    ```

    `[username@hostname "home dir"]$ exit<Enter>`

    ```


    Alternatively, press Ctrl-D (repeatedly if necessary). Eventually, you will reach
    your login shell (where you can issue the `logout` command), or you will just
    be logged out of the system.


    > > **NOTE** If $ is part of the prompt, you are in your login shell.


    Once you have logged out, no matter which of the three logout methods you have
    used, Linux provides the same response:


    ```

    distributorname Linux releasename

    kernelnumber on a CPUname

    hostname login:

    ```


    # ## Creating User Accounts and Passwords


    On any Linux system, the system’s root user or the system administrator creates
    user accounts and initial passwords. Ordinary users cannot create user accounts
    and cannot change the passwords of other user accounts. If you have Linux installed
    on a home system or in a smaller network environment, you might not have a designated
    system administrator. Therefore, please note that when we refer to a system administrator,
    we'
  merge: -1
  img_proc: true
- pgno: 73
  md: "mean someone with root privileges. At Rueful Figures Inc., our sample organization,\
    \ Preston the Wizard is the system administrator.\n\n# User Accounts\n\nThe first\
    \ task in creating a user account, or record, is to specify a username. Linux\
    \ imposes no restrictions on usernames, although we recommend that you do *not*\
    \ use blank spaces, unprintable characters, or even mixtures of upper-case and\
    \ lower-case characters in them. Such names can cause problems not only at login\
    \ but also when you perform certain system administration tasks.\n\nIn addition,\
    \ system administrators are usually advised beforehand by their respective organization\
    \ about:\n\n+   The format of usernames (such as an abbreviated form of the user's\
    \ name and the company name)\n+   \n+   The names of those who will soon be joining\
    \ the organization's system (in other words, the names of new users)\n+   \n+\
    \   What organizational group(s) the new users are to join\n+   \n+   What their\
    \ security clearances will be\n+   \n+   What file systems they will be able to\
    \ access\n\nThe syntax for user account creation is simple:\n\n```\n[root@hostname\
    \ /root]# useradd newusername<Enter>\n```\n\nor\n\n```\n[root@hostname /root]#\
    \ adduser newusername<Enter>\n```\n\nWhy are there two commands? Each comes from\
    \ a different version of UNIX, and Linux developers did not want to play favorites.\
    \ You can use either command; both accomplish the same thing.\n\n(The *useradd*\
    \ and *adduser* commands are examples of linking, in which two command names are\
    \ linked to one command. Linking is not restricted to commands; however, but we\
    \ are getting a little ahead of ourselves. We will discuss the linking function\
    \ in more detail in Chapter 5, \"Using Files in Linux.\")\n\nIf you have made\
    \ a mistake creating a user account (it happens), or if one or more users have\
    \ left your organization, then you will have to delete the user account. Use the\
    \ following syntax:"
  merge: -1
  img_proc: true
- pgno: 74
  md: '```

    [root@hostname /root]# userdel username<Enter>

    ```


    Meanwhile, to see what else you can do with useradd and adduser, check their man
    pages (we will discuss man pages in detail later in this chapter).


    # Group Accounts


    Often, when user accounts are added to an organization’s database, they are immediately
    assigned to specific user group accounts within that organization. That way, their
    activities and access to organizational resources can be quickly configured for
    security and convenience. If the system administrators assign user accounts to
    group accounts during the creation of the user account, they will include the
    -g option with the adduser/useradd command.


    But, in order to add a username to a group account, the group account must have
    been created first. To create a group account, use the following syntax:


    ```

    # groupadd [-g gid [-o] ] [-r] [-f] group<Enter>

    ```


    The -g option is used if the administrator wants to assign a specific group number.
    Otherwise, Linux will assign the lowest available unique number greater than 500
    that has not yet been assigned. Numbers 0 to 499 are reserved for system accounts.
    The -o option is used if the system administrator wants to advise Linux that the
    assigned group ID number is not unique. The -r option is used to indicate that
    the account is to be a system account. The -f is used to tell Linux to halt command
    execution if such a group already exists.


    The group argument specifies the name of the new group.


    The system administrator can check the correlation of accounts by examining the
    /etc/passwd or /etc/group files.


    If the user account is to be added to more than one group, that can be done at
    the time of user account creation with the -G option. It can also be done later
    by using the usermod command as follows:


    ```

    # usermod -G additionalgroupname username<Enter>

    ```


    Similarly, usermod can be used to change initial group membership, as such:


    ```

    # usermod -g newinitialgroupname username<Enter>

    ```'
