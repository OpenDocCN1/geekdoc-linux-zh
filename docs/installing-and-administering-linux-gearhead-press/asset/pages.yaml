    # Window Frame


    The frame around a window is often taken for granted. Although we generally think
    of the window contents and frame as one and the same, they are not. Strictly speaking,
    the frame is provided by the window manager application and enables a certain
    amount of window manipulation without affecting the operation of the application
    running in the window itself. That window manipulation, however, requires the
    proper placement and operation of the mouse. The basic components of the window
    frame might vary slightly from one window manager application to another (for
    example, one might have an exit button at the far right end of the title bar,
    but another might not).


    The first component of the window frame is the title bar, which runs across the
    top of the window between the window operations button on the left and the minimize
    and maximize buttons on the right. Predictably, the title bar contains the title
    of the window. For instance, the window emulating a terminal screen would be titled
    xterm. You can use the title bar to move the window from place to place on the
    root menu by the drag\u2011and\u2011drop method.


    NOTE The term “drag and drop” refers to the following actions: positioning the
    mouse cursor over something (such as a title bar or menu option) and pressing
    but not releasing the left mouse button; then moving the mouse cursor to another
    location (dragging) and releasing the left mouse button (dropping).


    You can reduce the window to its icon representation (its minimum size) by left\u2011clicking
    the minimize button, which is immediately to the right of the title bar. If the
    window is smaller than its maximum size, you can maximize it by left\u2011clicking
    the maximize button next to the minimize button (maximum size usually means that
    the window will fill the entire root'
