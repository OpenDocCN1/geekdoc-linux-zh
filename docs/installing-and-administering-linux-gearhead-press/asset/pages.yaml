- pgno: 218
  md: '# Standard Files: Redirection and Piping


    For each process invoked within the Linux system, three files are automatically
    opened:


    **Standard input (stdin)**. The location where a command expects to find its input.
    Usually, that location is the keyboard.


    **Standard output (stdout)**. The location where the command expects to send its
    results. Usually, that location is the screen, but it can also be a file.


    **Standard error (stderr)**. The location where the command expects to send its
    error messages. Usually, that location is the user''s terminal screen, but it
    can also be the system console.


    The description of the default location is stored in a command''s file descriptor
    table. You can change the locations, though (for example, screen, file, or console)
    by using redirection, which we will describe shortly.


    # File Descriptors


    Each command or utility opens its own file descriptor to keep track of data files,
    inputs, outputs, and error messages. File descriptors differ depending on the
    command or utility that is running. File descriptor entries might refer to special
    device pointer files that in turn point to system devices, such as a terminal
    or a disk drive. See the file descriptors in Table 7.4. Note that descriptors
    and operators from 0 to 2 have default values, but a user can define others from
    3 to 9. Meanwhile, please remember that in Linux/UNIX, not all filenames refer
    to data files. Also, for now, please do not worry too much about the device pointer
    numbers. We will be using them specifically later when we discuss combined redirection.


    Consider the cat command (which we were introduced to in Chapter 5, “Using Files
    in Linux”), which is used to list the contents of files whose names we provided
    on the command line. If you do not specify a filename, cat simply echoes back
    to the terminal screen whatever you type on the command line before you press
    Enter. To cat, the default stdin is the keyboard (not a file), and stdout is the
    terminal screen.'
  merge: -1
  img_proc: true
