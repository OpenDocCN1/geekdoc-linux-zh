- pgno: 470
  md: '# **CHAPTER 15**

    # Linux Documentation

    # and Support


    The Linux operating system consists of many subsystems and processes working together
    simultaneously. Thus, to monitor, measure, modify, and control your Linux system,
    you need information about commands, utilities, configuration, applications, and
    more.


    In this book, we have introduced you to some basic Linux concepts, commands, utilities,
    and processes. To fully understand these concepts, however, you might have to
    refer to or have knowledge of things that are not discussed at length in this
    book. Because it is difficult to absorb, let alone commit to memory, all of the
    concepts, commands, and related information you need to make your Linux system
    perform the way you want now and in the future, it is important to be aware of
    all the sources of information available to you.


    In this chapter, we list and discuss some sources of information and support that
    you will be able to call upon immediately and later, whether inside your own shop
    or elsewhere in the Linux world. Although we cannot possibly cover all available
    information sources, we do provide an introduction to some of the more popular
    and helpful ones.'
  merge: -1
  img_proc: true
- pgno: 471
  md: '> **NOTE** Throughout the book, when we suggest that you check other information
    sources, we are referring to the sources mentioned in this chapter.


    # # Distribution Package Documentation


    You can obtain a Linux distribution in two basic ways: officially and unofficially.
    This section covers the information you can expect to find with both types of
    sources.


    # ## Official Linux Distributions


    Every official Linux distribution ships with a large amount of documentation,
    and that is one reason why we recommend that you purchase an official distribution.
    Most distribution packages contain the following information, which is specific
    to the Linux software you have purchased:


    +   * **Features of the enclosed Linux software and applications**. You will learn
    which version of the Linux kernel you have, the hardware it supports, the applications
    you can install and use immediately, and what else is available and from what
    location.

    +   * **Installation instruction and assistance**. You will be told how to install
    Linux on your system (for example, how to install a graphical versus a text-based
    interface and options for basic and custom installations) and how to do basic
    fine-tuning.

    +   * **Basic system administration instructions**. These are important because
    you have to know how to create and administer the root and other users on your
    system just to get going.

    +   * **Sources for troubleshooting and support after you register your software**.
    Troubleshooting and support can be invaluable, especially if you are loading Linux
    for the first time or are updating to a version that is different from your current
    version. *Do not forget to register your software as soon as you unwrap or install
    it.*

    +   * **A simplified history of UNIX and Linux**. This information might aid your
    comprehension of the attributes and behavior of certain parts of your software,
    especially the actions of the shell (some of which we have discussed in earlier
    chapters).'
  merge: -1
  img_proc: true
- pgno: 472
  md: '**Instructions for obtaining additional documentation.** Most distribution
    materials are geared toward specific audiences (the majority are geared toward
    novices and non-experts, while some are geared toward business users, some toward
    programmers, and so on). But most packages contain references to their own hard-copy
    documentation, their own online documentation, and to other sources of information
    (books, magazines, Internet sites, and the like).


    # Downloaded Linux and Other Unofficial Distributions


    Purchasing an official Linux distribution is not the only way to go. Some people
    and organizations acquire their copies of the Linux kernel with or without the
    simultaneous acquisition of applications by downloading Linux from the Internet
    or through other means.


    If you take this route, you can find documentation in many venues. For example,
    recent years have seen an avalanche of books on Linux. You can find them at local
    bookstores, university or college bookstores, computer bookstores, and on the
    Internet. You can often find related applications or utilities and their respective
    documentation in the same places.


    Many books and magazines also contain CD-ROMs of one of the Linux distributions,
    although it is usually one or two revisions behind the distribution or kernel
    package you can obtain directly from the manufacturer. The same book and CD-ROM
    combinations customarily contain some applications, as well. Meanwhile, new Linux-related
    magazines appear almost monthly. Later in this chapter, we will list a few of
    these books and magazines for you.


    New Linux-oriented Internet sites crop up all the time. We list several of the
    more established sites later in the chapter, as well. Often, they are affiliated
    with educational institutions, Linux support or interest groups, or other organizations
    that have adopted Linux in their own shops or are otherwise promoting its use.
    The information and services offered by these sources are varied but almost always
    include installation instructions, some basic system administration help, troubleshooting
    advice, device drivers, fine-tuning tricks, and other types of support.


    Linux support and user groups have emerged in almost every major urban center
    or region. Joining one of these groups is an economical and sociable way to learn
    more about Linux, to obtain free or inexpensive software, to see free demonstrations
    of hardware and software, and even to do'
  merge: -1
  img_proc: true
- pgno: 473
  md: 'a good turn by helping others with their problems. To find these groups, check
    your local computer newspaper (usually free at software and hardware vendors,
    at major newsstands, and even at some convenience stores), go surfing with a good
    Internet search engine, or go straight to www.linux.tucows.com and drill down
    through the links found there (especially the “Software Library” links). Tucows
    even provides ratings of several Linux flavors.


    Meanwhile, other Internet sites will link you to support groups, too (especially
    Linux Online! at www.linux.org).


    # # Current Linux Distributors


    The operative word in the title to this section is *current*. When we began to
    write this book, there were certainly fewer distributors of Linux than there were
    at the publication of this book. And by the time you read this book, there will
    no doubt be even more. If you are interested in investigating the various flavors
    of Linux, keep track of the distributions listed and described at the Linux Online!
    Web site at www.linux.org.


    At last count, 40 full-featured distributions and 35 mini or specialty distributions
    were available in the English language, and more than 20 non-English distributions
    were available in Spanish, Italian, French, Portuguese, German, Chinese, Japanese,
    Thai, Ukrainian, Russian, Swedish, Finnish, Turkish, Croatian, and Korean. The
    Linux Online! site provides descriptions of the distributions as well as links
    to the respective download sites. The site is well worth checking out, even if
    only to see how Linux’ popularity has spread throughout the world in a few short
    years. At the Web sites for the distributions listed at Linux Online!, you will
    find some variation of the following types of information and services:


    +   ▪ Company history and description

    +   ▪ Purchase information

    +   ▪ Names and addresses of resellers

    +   ▪ Patches, updates, or bug fixes for the products, including kernel updates

    +   ▪ Announcements regarding security issues pertinent to their products

    +   ▪ Press releases regarding their company or Linux in general

    +   ▪ FAQs (frequently asked questions) regarding their products or Linux in general'
  merge: -1
  img_proc: true
- pgno: 474
  md: "+   - Related or linked Internet sites (such as FTP sites or mirror sites)\n\
    +   - Support contact information (such as telephone and fax numbers and e-mail\
    \ and surface mail addresses)\n\nSome of these sources do not provide FTP sites\
    \ to download their products but do provide sources for inexpensive CD-ROM copies.\n\
    \nWe cannot leave the topic of Linux Online! without complimenting them on the\
    \ “Getting Started with Linux” lesson found under the header “Linux 101” on the\
    \ home page. Bravo! Hopefully there will be more courses like this one to come.\n\
    \n# The Linux Documentation Project\n\nThe *Linux Documentation Project* (*LDP*)\
    \ consists of guides, HOWTOs, FAQs, and projects. Perhaps the best way to describe\
    \ it is to quote from its manifesto, which you can read at www.linuxdoc.org, the\
    \ project’s Web site. An excerpt follows:\n\n> The Linux Documentation Project\
    \ is working on developing free, high quality documentation for the GNU/Linux\
    \ operating system. The overall goal of the LDP is to collaborate in all of the\
    \ issues of Linux documentation. This includes the creation of “HOWTOs” and “Guides.”\
    \ We hope to establish a system of documentation for Linux that will be easy to\
    \ use and search. This includes the integration of the manual pages, info docs,\
    \ HOWTOs, and other documents.\n> \n> LDP’s goal is to create the canonical set\
    \ of free Linux documentation. While online (and downloadable) documentation can\
    \ be frequently updated in order to stay on top of the many changes in the Linux\
    \ world, we also like to see the same docs included on CDs and printed in books.\
    \ If you are interested in publishing any of the LDP works, see the section “Publishing\
    \ LDP Documents” (on this webpage).\n> \n> The LDP is essentially a loose team\
    \ of volunteers with minimal central organization. Anyone who would like to help\
    \ is welcome to join in this effort. We feel that working together informally\
    \ and discussing projects on our mailing lists is the best way to go. When we\
    \ disagree on things, we try to reason with each other until we reach an informed\
    \ consensus.\n\n# LDP Guides\n\nThe LDP’s guides are book-length documents that\
    \ cover many aspects of Linux operations. To access them, drill down through the\
    \ LDP Web site at www.linuxdoc.org or go directly to them at http://metalab.unc.edu/pub/Linux/docs/LDP/.\n\
    \nThe guides have been published by the LDP. Currently available and maintained\
    \ guides include the following:"
  merge: -1
  img_proc: true
- pgno: 475
  md: '+   Securing and Optimizing Linux: Red Hat Edition (Open Docs)


    +   Administering Linux: The Basics (Open Docs)


    +   Linux Complete (Sybex)


    +   Linux the Complete Reference (Linux System Labs)


    +   Linux Desktop Starter Kit (McGraw Hill)


    +   Linux Facile (An Italian Linux Manual)


    +   Linux Network Administrator’s Guide, 2nd Edition (O. Kirch and T. Dawson)


    # HOWTOs


    Linux HOWTOs are documents that explain specific topics rather than the broad
    subjects generally found in the guides. The following is a summary of available
    HOWTOs and their location:


    226 HOWTOs at www.ibiblio.org/pub/Linux/docs/HOWTO/


    4 unmaintained HOWTOs at http://ibiblio.org/pub/Linux/docs/HOWTO/unmaintained/


    131 mini-HOWTOs at http://ibiblio.org/pub/Linux/docs/HOWTO/mini/


    Remember that unmaintained documents are not updated and might now be invalid.
    But, as it states on the “unmaintained” Web page, “sometimes old documentation
    is better than none at all . . .”


    If you want to create your own HOWTO or become the new custodian of an unmaintained
    HOWTO, contact the LDP through its Web site. See the *Projects* section later
    in this chapter.


    Occasionally, HOWTOs are published in hard-copy format, such as in Linux Unrecoverer
    (Red Hat, 1998).


    Your distribution of Linux might include copies of HOWTOs. Look in directories
    named /usr/doc/HOWTO, /usr/doc/HOWTO/mini, or something similar. You will probably
    have to uncompress the HOWTO files before you can view them.


    # FAQs


    As of this writing, the LDP has nine sets of frequently asked questions (FAQs)
    on its Internet site at www.linuxdoc.org/FAQ/. At one time, the LDP suggested
    that any new HOWTO documents also include a set of FAQs,'
  merge: -1
  img_proc: true
- pgno: 476
  md: 'because readers of the documents often have questions about the documents themselves
    or about how the document instructions relate to their own systems. Although the
    LDP no longer states that explicitly, we think it is still a good idea.


    Your Linux software distribution might have FAQs as well; look for them in the
    installation manual and in directories named `/usr/doc/FAQ` or something similar.
    You will probably have to uncompress the FAQ files before you can view them.


    # Linux Man Pages


    The LDP maintains the man pages for C programming and devices (sections 2, 3,
    4, 5, 6, 7, and 9). But they recommend consulting the user command man pages (sections
    1 and 8) on the respective distribution CDs.


    # Projects


    The LDP always has documentation and other projects under development. The projects
    are organized into several categories, such as hardware ports; kernel, drivers,
    and file systems; papers; networking; organizations and groups; Linux and free
    or open software; research and science groups; distributions; benchmarks and standards;
    and miscellaneous.


    To get involved, check out the advice in the “Current Projects and Getting Involved”
    section of the LDP manifesto at www.linuxdoc.org or contact the LDP coordinator.
    You can e-mail the LDP at feedback@linuxdoc.org.


    # Linux Books and Magazines


    In the process of preparing course materials and writing this book, we were exposed
    to several sources of expertise and information, and we are grateful to them all.
    Here are some suggestions to help you find the ones you need:


    **Check out the references presented at the Linux Web site at www.linux.org/books.**
    You will find a description and short evaluation of several (43, actually, as
    of late 2001) current and prominent reference books dealing with Linux, Linux
    applications, and the integration of Linux with other systems.


    **Use your favorite Internet search engine.** Type an appropriate description,
    such as Linux books, click the Search button, and'
  merge: -1
  img_proc: true
- pgno: 477
  md: 'watch your screen fill with Web site references. You will probably want to
    refine your search description to find something closer to your requirements.
    (Our search for *Linux reference books* and similar terms returned well over 100,000
    responses. Overwhelming? Yes, but there is bound to be something out there to
    meet almost everyone''s needs. All you have to do is refine your search.)


    **Check out the book reviews in Linux paper magazines or online magazines.** For
    example, *Linux Weekly News* (a division of Tucows) at http://lnw.net or *Linux
    Planet* at www.linuxplanet.com.


    **Use the search features at the e-commerce sites operated by large booksellers.**
    You can get descriptions and order them, as well.


    **Take the time to visit your local computer bookstore or “big-box” bookstore.**
    This method is the best way to determine which books are best suited to your needs.
    Many establishments now enable you to peruse your potential purchase leisurely,
    even over an in-house beverage.


    Although we are reluctant to recommend any particular Linux book out of the many
    available, we do suggest reading the following:


    +   *   *Operating Systems: Design and Implementation*, 2nd ed., by Andrew S.
    Tanenbaum and Albert S. Woodhull (Prentice Hall). Tanenbaum also maintains a MINIX
    Web site at www.cs.vu.nl/~ast/minix.html.

    +   *   *The UNIX Programming Environment*, by Brian Kernighan and Rob Pike (Prentice
    Hall Computer Books). These two Bell Labs researchers were heavily involved with
    the development of UNIX. This book, which presents the unique features of the
    UNIX design philosophy, is a classic.

    +   *   *Customizing and Upgrading Linux, Second Edition*, by Linda McKinnon and
    Al McKinnon (John Wiley & Sons, 2002). Our companion book describes the installation
    of Linux on several platforms via various methods. It also tells you how to upgrade
    the Linux kernel. Please pardon our “tub-thumping” here, but we think it is pretty
    good stuff.


    Several Linux journals are listed in Table 15.1. All are available as online magazines,
    and the first three are available in hard copy, too. You might already have heard
    of some of them, such as the *Linux Journal*, which has been publishing for five
    years or so. The others are similar in approach.'
  merge: -1
  img_proc: true
