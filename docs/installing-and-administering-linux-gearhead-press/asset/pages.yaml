    # Comparing find Functions and Shell Functions


    In this section, we illustrate the difference between the functionality of certain
    shells and the find command. We discussed the capability of the find command to
    travel down through directories (in other words, to search recursively), which
    is one of its primary benefits.


    During most routine operations, the shell interprets the command line and then
    provides the appropriate arguments to an executable command. Thus, the commands
    do not understand directory structures and rely on the shell to expand wildcards
    and then provide the full directory or path name of candidate files for execution.
    Juana’s file structure has expanded rapidly since she started working with Lady
    Dulcinea (Figure 9.3 depicts her portion of the RFI directory structure).


    # Example 9.7 Shell versus find


