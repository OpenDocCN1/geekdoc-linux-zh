    Those were the names he wanted to print. He used **cat** to examine the filenames
    in the new file list.


    In this step, the Don used the combined **xargs** and **lprx** commands and the
    results. The feedback from the shell indicated that **xargs** was capable of filling
    the command line with arguments from *accom_inns* to *insurance* before **lprx**
    was executed the first time. Then, **xargs** had the capability to pass the rest
    of the files, from *lance* to *wthr_fests*, to **lprx** for the second execution.
    Note that the Don was using the **-t** option to ensure that **xargs** had passed
    the input to **lprx** and that **lprx** did indeed execute.


    Because the existing files pertained mostly to his last journey in March, he chose
    to change their filenames to reflect that date. Here is how he changed the names
    of all the files at once:


    ```

    $ ls | xargs -t -i mv {} {.}.mar01<Enter>

    mv accom_inns accom_inns.mar01

    mv bills bills.mar01

    mv buckler buckler.mar01

    mv cell_ph cell_ph.mar01

    .

    .

    .

    mv travel_H2O travel_H2O.mar01

    mv wthr_fests wthr_fests.mar01

    ```


    The second part of Example 9.1 shows how the Don inserted his filenames into the
    middle of a command line. His objective was to rename all the files in the *provisions*
    subdirectory by adding the .mar01 suffix to each. He invoked a short listing (in
    other words, **ls**) of the files in that directory and then piped the filenames
    from **stdout** to **xargs**. **xargs**, then instructed that each filename, in
    turn, be inserted (the **-i** option inserts each line of standard input) between
    the curly bracket placeholders following the **mv** command. This form of **mv**
    is commonly used to rename files. Because he also specified the **-t** option,
    the Don was also able to monitor the execution of **mv** as each filename was
    passed to it. That is because the **-t** option causes the individual commands
    to be printed to **stderr** just before executing the **mv** command. Later, after
    the last filename, *wthr_fests*, was changed to *wthr_fests.mar01*, the combination
    command finished and the primary shell prompt returned.'
