    > **NOTE** **sort’s options are unique to it. If you were using the *cut* command,
    by comparison, the delimiter would be *d*, not *t*.**


    # # Displaying Parts of Files: The head and tail Commands


    You use the *head* and *tail* commands when you want to view only parts of a file.


    # ## The head Command


    In this section, we discuss only the simplest applications of the *head* command.
    Refer to your sources for further information regarding this command’s additional
    options.


    The *head* command is used to display the first n number of lines in a file, as
    illustrated in Example 8.18. The syntax is


    ```

    $ head [-number of lines] [file(s)]<Enter>

    ```


    If you do not specify a number, the default value of 10 is used. If no files are
    specified, *head* reads from the standard input device (*stdin*). If *head* is
    combined after another command, *head* still reads from *stdin* although it appears
    that *head* is reading from the *stdout* of the previous command. If more than
    one file is read, a header of the type `==> *file*name <==` is displayed before
    the respective lines of text.


    The second part of Example 8.18 shows how you can pipe to *head* the output of
    one process to display only a specified number of lines.


    # **Example 8.18 head**


    Juana cannot remember offhand whether she put the filename at the top or the bottom
    of the *feed* file. From her home directory, she simply types'
  merge: -1
  img_proc: true
