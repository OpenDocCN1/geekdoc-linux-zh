- pgno: 323
  md: 'user guide. You will probably find that every Linux distribution has a specific
    command that you can enter to check whether a program has been installed, but
    you have to be able to enter the precise program name or something very close
    to it (using wildcard symbols, perhaps).


    Other text editors you might have at your disposal are *Emacs*, *ed*, *joe*, *jed*,
    or variations on those names, depending on the environment you will be using them
    in (for example, *jed* versus *jed-xjed* or the extra features one might have
    compared with another (for example, *vim-minimal* versus *vim-enhanced*)).


    One last word: *vi* and other text editors are *not* word processing programs,
    so do not set your expectations too high. They are valuable tools nonetheless
    because they facilitate administration of UNIX-like operating systems.


    # # An Introduction to vi


    As mentioned, *vi* is the standard editor in all UNIX-related systems. The original
    *vi* editor was distributed by the Berkeley Software Distribution; the various
    Linux distributions use a form of *Visual Editor Improved* (*vim*), which claims
    to be an improvement over the classic *vi*. When you enter *vi filename* to invoke
    the editor, you are actually using a symbolic link to *vim*. *vim* then emulates
    the classic *vi* editor (an instance of upward compatibility).


    +   - Full-screen editor

    +   - Two modes of operation: Command and Insert

    +   - Use of one-letter commands

    +   - Unformatted text

    +   - Flexible search-and-replace facility with pattern matching

    +   - User-defined editing features using macros


    This chapter does not pretend to be a comprehensive summary of *vi*. Consult the
    various Linux information sources for more detailed descriptions of *vi* features.
    In addition, we have provided a *command summary* in Appendix A.


    We will describe and use two *vi* modes: Command and Insert. Some Linux/UNIX gurus
    claim that *vi* has three modes: Command, Insert, and Last-line. Users are in
    Last-line mode when they have used *Esc* to leave'
  merge: -1
