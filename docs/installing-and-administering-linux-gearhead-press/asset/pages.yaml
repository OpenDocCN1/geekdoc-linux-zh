- pgno: 202
  md: '# **CHAPTER**


    # ## Shell Basics


    As soon as you log into a Linux system, you are exposed to a shell-gener-ally,
    the Bash variant, which we discuss in detail in this chapter. The shell program
    is an interface to the operating system, translating your typed input (or input
    from other sources) into instructions for the operating sys-tem. DOS''s command.com
    program does just about the same thing.


    This chapter describes the ins and outs of the basic Linux shells. Although the
    focus is on Bash, we introduce elements of the *tcsh* shell and include certain
    twists on the commands relevant to still other shells.


    Knowing what the shell is doing with your input will make you a more efficient
    and effective Linux user and system administrator. When you see how you can customize
    your input with wildcards, metacharacters, and pipelining, you will begin to understand
    their power.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# The Linux/UNIX Shells


    The shell is but one of the interfaces to Linux / UNIX. There are others, such
    as the X Window System, which we will discuss in Chapter 14, “The Linux X Window
    System.” Remember that any shell is just an interface program and is not the operating
    system itself. After you log in, typing your username and password, the operating
    system starts the shell program. On one hand, if you are using a command line-based
    shell, then the shell program responds by giving you a command-line prompt, such
    as


    ```

    [username@hostname /directory]$

    ```


    Or, if you are the root user, you will see


    ```

    [root@hostname /root directory]#

    ```


    As you have noticed, in this book we have shortened these prompts to $ and #,
    respectively.


    On the other hand, the X Window System, as a shell, would present you with a GUI
    desktop image.


    What does a shell do? It has three basic functions: a command interpreter, a job
    controller, and a comprehensive programming language.


    First, let’s look at the shell as a command interpreter. When you present a command
    to the shell, it looks at the command name to see whether it matches an internal
    shell command that it can execute itself. It checks also to see whether the command
    is an alias for another command. If the command is not an internal command, nor
    an alias for an internal command, the shell searches the hard disk for the program
    corresponding to the command name. If it finds one, the shell executes the program
    and feeds it the arguments (if any) that accompanied the command name entry.


    What happens when the shell cannot locate a program? It responds with an error
    message, such as


    ```

    shellname: commandname: command not found

    ```


    As a job controller, the shell:


    +   Enables multiple task execution. On occasion (perhaps more often than we realize),
    it can enable some programs (also referred to as processes or jobs) to run in
    the background where they likely require'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'no user interaction, and it also enables another program to run in the foreground
    (which likely interacts with the user).


    +   Swiches between the foreground processes and background processes as well
    as between other multiple tasks as necessary

    +   Suspend jobs without losing track of where the processes stopped so that they
    can begin again at the same point

    +   Enables programs to be piped to achieve complex results with single but perhaps
    complex commands. Remember, by pipelining (or pipelining, as it is more commonly
    called), we have seen the output of one program become the input to another, which
    starts automatically unless the user specifies that interaction is required.

    +   Enables you to write scripts (we will introduce you to shell script writing
    later in Chapter 15, "Linux Documentation and Support"). A shell script can invoke
    other shell scripts as long as their locations are in the search path.


    Thus, the shell is also a comprehensive programming language that does not need
    a compiler because it interprets the logic itself. Keep in mind, however, that
    different shells use different syntaxes to execute shell scripts.


    # # Types of Linux/UNIX Shells


    The two major UNIX shells are the Bourne shell and the C shell. The Bourne shell
    is similar to the first UNIX shell developed by Bell Labs. The C shell was developed
    at the University of California at Berkeley and has a format similar to the C
    programming language. Another prominent shell is the Korn shell, developed at
    AT&T Bell Labs, which was based on the Bourne shell but also incorporated some
    C Shell functionality.


    Your copy of Linux likely contains several shells. Check your documentation for
    a complete listing as well as for an indication of which shells are automatically
    installed as part of the basic installation. Table 7.1 lists some typical shells.


    You can check to see whether any of the preceding shells (or others) are on your
    installation medium, as well as which ones were installed with your Linux operating
    system, by viewing the listing in the /etc/shells file.


    To determine the default shell you log into, check the listing after your username
    in the /etc/passwd file or check your environment by typing env followed by the
    Enter key to see which directory is listed as the SHELL='
  merge: -1
  img_proc: true
- pgno: 205
  md: '# Table 7.1 Typical Linux/UNIX Shell Programs


    | NAME | DESCRIPTION |

    |---|---|

    | ash | A Bourne shell clone that supports all Bourne shell commands but is smaller
    than Bash. |

    | ash.static | A version of ash that is not dependent on software libraries. |

    | bash | Stands for Bourne Again Shell, the default Linux shell. An sh-compatible
    interpreter, it reads standard input or input from a file; incorporates features
    from both Korn and C shells; and is intended to conform with IEEE POSIX Shell
    and Tools Specifications. |

    | mc | Midnight Commander, a visual shell. It looks like a file manager but has
    many more features. |

    | pdksh | A reimplementation of the Korn shell intended for interactive and shell
    script use. |

    | rsh | The restricted shell used for network operations. |

    | sash | A statically linked shell that contains simplified versions of some basic
    commands. It is useful for system recovery. |

    | tcs h | An enhanced version of the C shell with additional features and fancier
    prompts. In Linux, this shell is the usual choice as the alternative to Bash.
    |

    | zsh | An enhanced version of the Bourne shell with most Korn shell, Bash, and
    tcsh features (and more). |


    variable value. Although Bash is the usual default shell, you can specify which
    shell you want to use—either by default or for a specific process or task. On
    some systems, you can change your shell with commands such as chsh or passwd with
    the -s option. For further help, check your information sources.


