    If another set command was in your history list, the shell would be confused,
    and you would likely end up with unanticipated results.


    The bang command can save you a lot of typing. But when you examine a command
    history, you never find a ! command per se, just the command that you invoked
    by using ! (just like with the fc command). Again, the only exception is when
    you make a mistake.


    The ! command has other handy arguments and options, such as the inclusion of
    extra arguments with previous commands or the mixing of arguments from one previous
    command to another before re-execution. Again, consult your sources for more information.


    > NOTE Some information sources indicate that a space is required between the
    exclamation point and the command number or text string, and some indicate that
    there should be no space between them. The correct syntax is no space between
