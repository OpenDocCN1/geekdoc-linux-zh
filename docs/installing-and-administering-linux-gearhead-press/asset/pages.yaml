    The alternative (the preferred alternative, really) for script execution relies
    on the owner of the shell script file making that an “executable” by using the
    chmod command (we discussed chmod in Chapter 6, “Linux File Permissions”). Users
    of the shell script file must have both read and execute permissions for the shell
    script file. Why? The answer is, because the shell needs to open the script file
    to read the commands within it. If you give “group” the execute permission, however,
    you need not give it to “others” and vice versa (although if someone is in “group,”
    he or she is probably in “others,” too). You can be selective.


    The owner can use either of the following two syntax formats:


    ```

    $ chmod ugo+rx scriptfilename<Enter>

    ```


    Or


    ```

    $ chmod 755 scriptfilename<Enter>

    ```


    Or


    ```

    $ chmod +x script2<Enter>

    ```


    In those three examples, “execute” permission is given to everybody. We could
    have narrowed the permissions somewhat to “ug+rx” or “754” for just the “same
    group” members or just “u+x” or “744” so that the owner is the only one who can
    execute it like that.


    At any rate, after you complete the previous step(s), the designated user(s) can
    invoke the script2 shell script as if it were an ordinary command (in other words,
    without bash or any other shell execution command) as follows:


    ```

    $ script2<Enter>

    ```'
