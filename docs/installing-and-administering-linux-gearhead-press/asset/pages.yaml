    # X Server Features


    XFree86 is the version of the X11R6 X Window System software that has been converted
    for use on Intel-based platforms. XFree86, then, is the basis for the X Server.
    XFree86 has to be configured for each system it runs on, which you can accomplish
    by specifying certain system attributes in a file called XF86Config, which is
    found in the /etc/X11 (the file itself) or /usr/X11R6/lib/X11 (some examples)
    directories.


    When XFree86 is invoked (either at the command line by the user typing the startx
    command or automatically upon system bootup), it reads the XF86Config file and
    follows the instructions found therein. Customarily, those instructions tell XFree86
    how and when to


    +   - Control and route the keyboard, mouse, graphics pad stylus, or other such
    input to the correct clients

    +   - Perform basic graphic operations on one or more screens

    +   - Control video-related attributes such as colors, color depth, screen size,
    fonts, modelines, vertical sync ranges, horizontal sync, video chipsets, video
    RAM, and clock chips'
  merge: -1
  img_proc: true
- pgno: 444
  md: '+   - Enable simultaneous access by several clients

    +   - Load special software modules

    +   - Control special system actions (such as core dumps, video mode switching,
    and input device configuration)


    The actual installation of the X Window System and the development of the XF86Config
    file are beyond the scope of this book. Consult your sources for this information.


    Only after XFree86 has invoked the other server-style software can you say that
    the full combination of XFree86 and any other necessary software has become your
    X server, ready to enable you to use the full features of the X Window System.
    You might occasionally hear others refer to video servers—such as Mach32, Mach64,
    or S3—as X servers. Such references occur probably because configuration of the
    video attributes is by far the most involved and occasionally perilous (for your
    monitor, if not done correctly) part of X Window System installation and configuration.
    But the full X server has to control much more than video output.


    The X Window System provides the basis for your graphical interface. But the interface
    itself—the look, feel, and personality of X—is provided by a client application
    called a window manager.


    # # X Window Managers


    New users often believe that X and its various window managers are synonymous,
    but this situation is not the case. X is in charge of all communication between
    and among windows, applications, and input and output devices, whether those facilities
    are located on the local machine or are distributed across a local or wide-area
    network (WAN). On the other hand, the window manager handles local operations
    such as the movement, resizing, or iconifying of windows. As we stated previously,
    the window manager provides the look and feel of your X desktop.


    Thus, a window manager is an X client, albeit a special one. It is the only one
    that has no windows itself unless you count the window or menu that you summon
    when you left-click the empty desktop. But the window manager can move, resize,
    iconify (hide), de-iconify (restore), map, and unmap windows. Your distribution
    or other version of Linux might provide several window managers (check your installation
    information or scout around your file system with whereis or with a similar command).'
  merge: -1
  img_proc: true
- pgno: 445
  md: 'A user can switch from one to another in a given session but can use only one
    at a time.


    Without a window manager, you can still invoke an X session and display windows,
    but you cannot move or resize them. In addition, if one window completely overlays
    another, you can access only the one on top. If part of a window is hidden by
    another window, you cannot access the hidden part of that window.


    Several window managers are listed in Table 14.2. For more examples of window
    managers and desktop environments, or for the latest ones, check the www.plig.org/xwinman
    Web site. There, you will also find feature comparison charts and resource requirements
    (if applicable). Plus, there is a lot of good basic X information.


    The first six window managers listed in Table 14.2 are still called “window managers.”
    The last three are commonly called “desktop environments” or “desktops” for short.
    The desktop environments have received the most development over the past few
    years. Now, they are considered (and are) more complete interfaces. They have
    a wider range of better-integrated utilities (witness the fact that in Chapter
    5, “Using Files in Linux,” we actually use KDE to set up printing) and more (and
