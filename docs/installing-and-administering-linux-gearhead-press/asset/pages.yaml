    # ## Online Information for Linux and UNIX Commands


    Linux and UNIX have a time-honored and *effective* tradition of providing various
    forms of online help. In this section, we introduce the most popular and helpful
    sources for help with Linux/UNIX commands: man pages, info pages, and the usage
    utility.


    # ### man Command


    Almost every Linux command, system call, or special file has an online manual
    page (man page), which is an authoritative online document that is located in
    your Linux system directories and that you can access instantly. The man page
    is used in most if not all Linux and UNIX environments. Many users and system
    administrators use man almost exclusively.


    # #### Syntax


    To consult the man pages for a command, subroutine, special file, or other element,
    the syntax is simple:


    ```

    $ man commandname<Enter>

    ```


    Notice that this time, commandname is an argument and not a command. The command
    here is man. If at any time you want to suspend or stop man'
