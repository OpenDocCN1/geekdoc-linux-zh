  md: '# # CHAPTER 8


    # Basic Linux Utilities


    The commands covered in this chapter are useful for various practical administrative
    tasks, such as finding and manipulating files and the text within files. Specifically,
    we will discuss the find command, several find-like utilities, and the grep, head,
    tail, and sort commands. This chapter will not be our only exposure to find, however,
    it is only an introduction. We will use find again in Chapter 9, "Advanced Linux
    Utilities."


    These commands are powerful and handy but also a bit more complicated than the
    commands we have discussed so far. If you keep their respective purposes, principles,
    and syntaxes in mind, however, with experience you will find that these utilities
    will enhance your efficiency and overall effectiveness.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# ## Searching Directories for Files: The find Command


    In this section, we will introduce the basic uses and syntax of the `find` command.
    The `find` command is a powerful utility because it can find files and automatically
    perform actions on those files. We will use Sancho Panza’s portion of the RFI
    directory structure, as depicted in Figure 8.1, for the examples in this section
    and in the rest of the chapter.


    The `find` program searches recursively downward through the file structure, starting
    in the directories you specify. The syntax is particular


    ![](img/cae5c706c216875d12d4b7d28144cc71_249_0.png)


    **Figure 8.1** The `find` command; Sancho’s directory structure.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '(some believe that it is more *like peculariar)* and can generally be expressed
    as follows:


    ```

    $ find [where to start looking?] [what to look for?] [what to do with it

    when it''s found]?<Enter>

    ```


    The real syntax, though, is


    ```

    $ find directory(ies) conditions<Enter>

    ```


    The *conditions* could include or be called options, match criteria, actions,
    arguments, and all sorts of other designations. Nearly all information sources
    seem to have a different interpretation of what to call the required parameters,
    but their examples all look similar. Luckily, although no agreement exists on
    how to express the parameters for the `find` command, overall agreement does exist
    on how to use it.


    # Example 8.1 Using find with Conditions


    Since we last looked at Sancho’s directory structure, it has changed significantly.
    Recently, after some confusion while looking for maps and other data, Sancho has
    concluded that he relies on the filename `misc` maybe a little too much. To begin
    straightening things out, he wants to know how many times he has used it recently.
    Here is how he checks:


    ```

    $ cd<Enter>

    $ pwd<Enter>

    /home/panzaasn

    $ find -name misc -print<Enter>

    ./misc

    ./Misc/misc

    ./Maint/misc

    ./Admin/misc

    ```


    Sancho first changed directories to return to his home directory. Then, he invoked
    the `find` utility, which began searching at the top of his home directory. He
    also specified `-print` at the end of the command line, which is interpreted as
    printing to *stdout* (standard output; that is, printing to the terminal screen).
    If he had not specified anything, the output would still have printed to his terminal
    by default. In earlier versions of UNIX and UNIX-like operating systems, though,
    this situation was not the case. You had to explicitly tell the shell what to
    do with the output.'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'The `find` utility returned a list of four files called `misc`. But it also
    indicated Sancho''s `Misc` subdirectory.


    Two additional considerations are worthy of mention:


    **In the example, the `find` utility found the four `misc` files**. Had there
    also been one or more `misc` subdirectories somewhere in Sancho''s file structure,
    `find` would have returned a reference to them, as well. `find` would have returned
    references to only the subdirectories, however, not to files within them that
    are not called `misc`.


    **File and directory permissions apply to `find` as they do to other commands**.
    If you have no business in certain directories or no permissions to certain files,
    `find` will not find them. You cannot use the command to circumvent permission
    requirements. If you lack appropriate permissions, you will receive an error message
    similar to the following on the terminal screen: `find: /directoryname: Permission
    denied.`


    # ## The find Command with a Noninteractive Single Action


    Here, we can combine `find` with the execution of one more command (or, if you
    prefer, one more action) in tandem. The syntax is


    ```

    $ find directory(ies) conditions -exec commandname options {} \;<Enter>

    ```


    Note that because of the way we have coded the `find/exec` command combination,
    no interaction will occur between the processes and the terminal. This feature
    might or might not be desirable, as we will see in the next couple of examples.


    Note also that the `\;` sequence must be part of the command line when `find`
    is combined with the `-exec` action. See Example 8.2. It must also appear when
    `find` is combined with the `-ok` action, too (we will discuss the `-ok` action
    in the next section).


    # **Example 8.2 `find` with a Non-Interactive Action**


    Sancho thinks that at least some of his various `misc` files should be deleted.
    But first, he wants to get some information about them. Instead of conducting
    `ls -l` several times (in other words, once for each directory that a'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'misc appears in), he will apply find with one non-interactive action as follows:


    ```

    $ find . -name ''mi*'' -exec ls -l {} \

    $ -rw-rw-r--1  pansasan  knights1  21  Jul 15 08:48  ./misc

    $ -rw-rw-r--1  pansasan  knights1  27  Jul 15 14:54  ./Misc/misc

    $ -rw-rw-r--1  pansasan  knights1  32  Jul 20 11:37  ./Admin/misc

    $ -rw-rw-r--1  pansasan  knights1  75  Jul 20 15:03  ./Main/misc

    ```


    Loosely speaking, the find command in Example 7.2 states, “Start in the current
    directory, and working downward, find all entries that begin with mi. As you find
    each entry, present its data on the screen in long list format.” Here is a breakdown
    of each element in the command:


    +   . (the dot) means to start in the current directory, which in this example
    is /home/pansasan, and move recursively through the file structure


    +   -name means that the names of the entries you want to find will follow


    +   ''mi*'' indicates that the first character in each entry is m. The asterisk
    (*) indicates that subsequent characters do not matter. This part of the command
    is in single quotes because the asterisk is a metacharacter, and if it were not
    surrounded in single quotes, it would have a different effect on the command.


    +   -exec means that after finding each entry, execute the following command on
    it in turn


    +   ls -l {} requests a long listing of the entry. The {} argument means that
    as each entry is found, its name should be substituted here so that ls -l can
    be executed on it.


    +   \; is called an escaped semicolon. It indicates that we have reached the end
    of the find and exec command sequences.


    +   Enter submits the command sequence for parsing and execution


    Again, because of the way we have coded the find/exec command combination, no
    interaction occurs between the process and the terminal. In this case, this situation
    is desirable because the second action (ls -l) is not really a drastic action.


    In Linux and other more recent versions of UNIX, you can use ls as an option with
    find. Thus, you can use an abbreviated syntax to get the'
