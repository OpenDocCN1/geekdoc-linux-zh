    # Combined Redirection


    Combined redirection is basically a combination of two or more redirections of
    input, output, and/or errors. There are two basic types:


    +   - General combined redirection, where the ordering of commands does not matter

    +   - Association, which is a type of combined redirection where the ordering
    of commands does matter


    When we discuss association, we will actually be using the device pointer numbers
    that we have seen in the descriptor tables.


    # Typical Combined Redirection


    The following is the syntax for a basic (but similar to what we have seen before),
    potentially destructive combined redirection:


    ```

    $ command < infile > outfile 2> errfile<Enter>

    ```


    Here is the syntax for nondestructive redirection using the same input file:


    ```

    $ command >> appendfile 2>> errfile < infile<Enter>

    ```


    **Table 7.10** Example 7.1 cat Command''s Modified Descriptor Table


    | DEVICE POINTER | OPERATOR | DESCRIPTOR NAME | DEFAULT DEVICE | STATUS |

    | :--- | :--- | :--- | :--- | :--- |

    | 0 | < | stdin | keyboard | (unchanged) |

    | 1 | > | stdout | screen | (unchanged) |

    | 2 | 2> | /dev/null | /dev/null file | (changed) |'
