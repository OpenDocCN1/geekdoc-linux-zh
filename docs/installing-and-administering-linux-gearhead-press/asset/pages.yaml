    # ## Options for Changing vi Functions


    You can change several appearance and behavior characteristics of vi to make it
    more useful or convenient. We list some of them in this section, and we also discuss
    how you change characteristics.


    The two basic approaches to changing vi characteristics are to:


    +   * Set default options that remain in place after you close the current session
    (with the hidden `.exrc` file).

