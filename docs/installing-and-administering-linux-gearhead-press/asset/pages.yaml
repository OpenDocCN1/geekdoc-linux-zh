  md: '# Square Brackets for Ranges


    You can use square brackets not only for lists but also for ranges. Here, too,
    the position defined by the location of the square brackets is expanded by the
    shell, but to only one character. But this time, only filenames whose characters
    in that position are members of the *range* of characters specified in the brackets
    are used as input to the command. This feature enables a much larger list of characters
    while reducing the amount of typing required to define the list. See Example 7.14.


    **Example 7.14 Square Range Brackets [ - ]**


    Juana, still experimenting with listing her phone-list files, finds that she can
    use the range brackets, too, as follows:


    ```

    $ ls *[-3]<Enter>

    RPI_Tell RPI_Tel2 RPI_Tel3

    ```


    # Quoting Metacharacters to Disable Shell Interpretation


    *Quoting* is the disabling, overriding, negating, or escaping (you will encounter
    *all* of these terms in reference to this concept) of the special meaning of other
    metacharacters, variables, or command names. It is called quoting because two
    of the three methods use single or double quotes.


    Basically, these quoting techniques, equipped with their own sets of metacharacters,
    are used to override or disable the shell''s normal interpretation of other metacharacters.
    Table 7.3 summarizes the functions of the quoting metacharacters and presents
    simple examples.


    The quoting metacharacters cause the enclosed metacharacter to be interpreted
    literally (for example, the single quotes cause `$HOME` to be interpreted as just
    that—`$HOME`—because the dollar sign becomes just a dollar sign and not a single
    character command) or to not be expanded in the manner that the shell would have
    otherwise interpreted and acted upon. For example, `echo "*.*"` returns `*.*`,
    not a listing of all files whose filenames contain a single dot in any but the
    first position.


    > **WARNING** *Remember that you must use the single and double quotes in pairs.
    Otherwise, your secondary command-line prompt appears. (In most*'
  merge: -1
  img_proc: true
