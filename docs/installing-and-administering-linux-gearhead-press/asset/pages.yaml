    # # Shell Programming


    This chapter does some cool stuff and gives you an opportunity to test your shell
    command knowledge. At this point, we do not expect you to be able to construct
    a shell script by yourself, but you should be able to read one. We have learned
    from past experience that the best way to introduce someone to scripting is to
    use lots of examples. This chapter contains some very basic shell scripts with
    some discussion of what they do and what they can be used for.


    # ## Shell Scripts


    A shell script is:


    +   - A readable text file that can be edited with a text editor like `vi` or
    the others we mentioned in Chapter 10, “The vi Editor”

    +   - A program that contains system commands, variable assignments, flow control
    syntax, and shell commands

    +   - A program that contains comments to let you or some other reader or developer
    in the future or in some unknown place know what the'
