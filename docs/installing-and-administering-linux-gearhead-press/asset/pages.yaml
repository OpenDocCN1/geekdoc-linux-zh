  md: '![](img/cae5c706c216875d12d4b7d28144cc71_38_0.png)


    urations or hardware compatibility, followed by network card and bad driver configuration.


    With respect to drives, the problem is often a lack of documentation on either
    the jumper or the termination settings. If you have a pair of IDE drives or a
    hard drive and CD-ROM combination, then it is often (actually, it is usually)
    a master/slave configuration issue. If you suspect that is your case, then make
    sure that all the IDE devices are compatible with each other. In other words,
    do not mix older IDE technology with the newer enhanced IDE technology. If they
    work together, then you are lucky. We have a saying in the industry that says,
    “Are we being lucky or smart?”


    Network card and driver combinations can also be troublesome. In our opinion,
    Linux developers have made amazing progress in this area over the past two years.
    Three years ago, there were very few network cards supported in Linux—and now
    there are many. The newer network cards are PCI and therefore are self-configuring.
    When it works, it is great. Of course, how successfully this technology works
    with your system is entirely dependent on the BIOS that you have installed in
    your system. If the BIOS is buggy or old, then it could create a very difficult
    situation. Do not ignore the DOS utilities that we will tell you about soon in
    this chapter. Also, do not spend very much time on a network card that does not
    work without checking out the IRQ, I/O port, and memory address space that it
    is using (PCI or no PCI).'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'Watch for the following nasty behavior: You can ping the card internally, but
    it will not respond to a DHCP server. This situation is typical of a resource
    conflict, usually memory space. To check these issues, go directly to the /proc
    directory and list the contents of all files called ioemem, ioports, irq, and
    net. If the network card is not even present in these files, then the IRQ on the
    network card is no doubt set to something that is already used by another device.
    If you cannot even ping the card internally, then the driver is probably not functioning
    correctly. If you do not get the “link light” on the back of the network card,
    then it is probably the wrong driver or the network card itself. We recommend
    that you only spend so much time with a network card that will not work and then
    go out and buy one. For example, the last D-Link network card that I purchased
    was less than $20. Your time (and state of mind) is likely worth more than that.
    Barring that approach, you can find many Linux drivers on the Internet at www.driversguide.com,
    for example.


    Video configuration is also a huge concern—so huge that we dedicated an entire
    chapter to it in our companion book, Customizing and Upgrading Linux. Please refer
    to that book for advice on video theory and video configuration.


    # Initiating a Linux Installation


    Technically, all Linux CDs are bootable. Whether your Linux CD will boot your
    system depends upon whether the CMOS on your PC is set correctly. For example,
    most PCs are configured to boot from floppy disk first and hard disk second. You
    have to change the boot sequence to CD-ROM first, floppy second, and hard disk
    third. If it still fails to boot, then your BIOS or hard disk controller probably
    does not support booting from a CD-ROM, in which case you will have to create
    a boot diskette. You can create a boot diskette from either a DOS/Windows or UNIX
    session. You should have two diskettes available to accomplish this task.


    # CD Booting Problem Determination


    Sometimes it appears that Linux cannot see or boot from IDE CD-ROMS. If this problem
    occurs, you should try to determine why Linux could not see the IDE device. It
    is possible that the BIOS cannot see or read an IDE channel because the BIOS is
    limited. This is probably the case if the system was functioning properly before
    under a different operating system. The solu-'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'tion is to either upgrade the BIOS or create a floppy boot diskette. We would
    recommend that you create a floppy boot diskette because it is easier. Another
    reason might be that the system might not be configured correctly. This situation
    is usually the case if you have taken the opportunity to add or move drives around
    in the system. Check the master/slave jumpers on all the drives and devices. If
    the drives are all connected to the same IDE controller, then one device should
    be configured as the master and the other device should be the slave. You will
    have to locate the documentation for the individual IDE device to find out how
    the jumpers should be set, because these instructions vary for different devices
    and for various manufacturers.


    Another more interesting problem is dealing with a CD-ROM that will not load automatically
    after the installation. To get the system up and running, you can enter the following
    statement at the LILO prompt during the boot sequence:


    ```

    boot: linux hdx=cdrom

    ```


    *x* is the IDE letter that Linux specifies for the drive. This letter will vary
    depending on the IDE bus to which the drive is attached. This scenario might also
    cause you some problems during boot time. Make a note of it, and if the system
    also fails to boot after the installation, then revisit your cabling and master/slave
    configuration.


    # Installation Boot Disks

    and Linux Rescue Disks


    With some Linux versions—those before the equivalent of Red Hat 6.x, for example—to
    provide additional support for *Personal Computer Memory Card Internal Association*
    (PCMCIA) and *Session Message Block* (SMB) installation, you have to create additional
    diskettes ahead of time. If you will be installing an earlier version here, then
    you will be prompted for these diskettes and they must be ready at hand. With
    newer versions of Red Hat Linux, however, the installation procedure has been
    changed, so this issue is no longer present.


    The method for creating a Linux install boot disk depends on the operating system
    you have to begin with and whether you want to use that operating system to create
    the boot disk. We will discuss two methods in the next section:'
  merge: -1
  img_proc: true
- pgno: 41
  md: '+   - Creation from within a DOS/Windows operating system

    +   - Creation from within a UNIX system


    Boot diskettes made using DOS/Windows or Linux will behave the same way; thus,
    choosing one over the other makes no difference.


    Meanwhile, if you are prompted to insert a blank diskette, which will be used
    to create a customized rescue diskette, we highly recommend that you do so.


    You can create a rescue disk after the installation is finished should you have
    skipped this step during the installation. To create a post installation rescue
    diskette, go to the /lib/modules directory and use the following command to create
    a rescue diskette customized for the system:


    ```

    # cd /lib/modules

    #mkbootdisk    -device /dev/fd0 kernel_number

    ```


    kernel_number will be similar in format to this one: 2.4.2-2. Although you choose
    to install a newer kernel, you must insert the appropriate version numbers for
    the level of kernel you are currently running.


    You should always have a rescue diskette on hand that is specific for each system.
    For example, it is considered bad practice to use a rescue diskette from a system
    with a kernel level of 2.2.14-5 to rescue a system that is supposed to be at a
    kernel level of 2.4.2-2. The current kernel level of any system can be determined
    by observing the login prompt or by using the uname -a command at the system prompt.


    You can also create a rescue diskette directory from the Red Hat CD by going to
    the /images directory and issuing the following command:


    ```

    G:\>

    G:\>cd images

    G:\images>dd if=rescue.img of=/dev/fd0 bs=1440 count=1

    ```


