    | SUBDIRECTORY | DESCRIPTION |

    | /etc | System configuration files used by system administrators |

    | /var | An abbreviation of variable, the var directory contains files that change
    with system activity. For example, this directory is typically used by or for
    many user-oriented programs, such as mail or printing. |

    | /tmp | Holds files that are temporarily needed or created by applications and
    programs. For example, the vi editor (discussed in detail in Chapter 10, "The
    vi Editor") uses the /tmp directory as a buffer space until the file being worked
    on is written to disk. Compiler programs use /tmp to hold files written during
    compilation. When the compiler is finished, the files created there are eliminated.
    |

    | /root | The top of the directory structure belonging to the root user |


    names must be directories. A full path name, which is also referred to as an absolute
