    # Mouse Pointers, Input Focus, and Location Cursors


    Linux can work with either a two-button or a three-button mouse, but the documentation
    with most distributions recommends that you use a three-button mouse or invoke
    three-button mouse emulation (using both buttons at once simulates the use of
    the middle button) during Linux installation. Meanwhile, moving the mouse causes
    the movement of a small icon, commonly called a pointer or a cursor, on the terminal
    screen. There are several types of pointers.


    When used on an X display, the mouse and its pointer can be used to select whatever
    window you would like to activate (making the window capable of receiving input).
    Note that when you activate a window, its frame changes color (it becomes highlighted).
    Furthermore, when you direct some input information or data to that highlighted
    active window, you are focusing. There are two types of focusing: explicit focusing,
    where you move the pointer to a window and left-click the mouse to activate the
    window, and pointer focusing, where you only have to move the pointer to a window
    to activate it. Most window managers use explicit focusing.'
