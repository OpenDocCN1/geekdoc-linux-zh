    # ## Shell Variable Types


    As discussed in Chapter 7, “Shell Basics,” the shell is the interface between
    the user and the operating system, and it passes information about the terminal
    environment to applications, commands, and processes. Your shell must have access
    to several variables so that it can control your Linux session. When you check
    your shell for all its variables, you will find that it has inherited all the
    terminal environment variables plus all the shell variables that have not been
    exported to the environment.


    Thus, the set of shell variables (that is, the shell environment) is larger than
    the set of terminal environment variables. Have a look at Figure 11.1; it illustrates
    the relationships among the environments that we have discussed to this point.
    It is *not* meant to show the relative sizes of those environments, just the relationships.


    Linux supports the following three types of variables:


    +   *   **Terminal environment variables.** Part of the operating system environment.
    Users do not necessarily have to define these, but they can use them in shell
    programs; some can be modified within shell programs (for example, PATH, USER,
    and SHELL).

    +   *   **Built-in variables.** Provided by Linux’s operating system and are automatically
    set by the shell to make decisions within a shell script or program (for example,
    $#, $?, $0, $*, $$). Users cannot modify these variables.'
