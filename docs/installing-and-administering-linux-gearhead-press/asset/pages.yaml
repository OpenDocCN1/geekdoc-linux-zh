    # # Linking Files: The ln Command


    We briefly mentioned file linking early in Chapter 4, “Files and Directories in
    Linux,” and later in Example 4.12. We create such links with the ln command. The
    ln (link) command, in its simplest form, enables one file to have at least two
    different names in the directory structure. In other words,'
