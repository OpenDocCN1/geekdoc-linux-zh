    # Let Another User Run a Client on Your System


    As we discussed earlier, the X Window System uses the client/server model. Remember,
    the client is an application (such as xterm or xcalc), and the server is the program
    that supports the application by controlling input and output. In many cases,
    the client and server both run on the same system. The last topic in this chapter
    is xhost, which you must invoke before any of the clients will connect and work.


    With X, however, you can run a client on your own system on the network but display
    the application on another (presumably remote) terminal screen. This arrangement
    gives others access to software programs running on your system. Others can therefore
    enter commands in the window and use their mouse, despite the fact that the actual
    process is running on your system.


    Assume that you are trying to run a client application on the sys1 machine, but
    you want to display the output on the sys2 server. The application is simply xterm
    (that is, you want to open an xterm window), but it could be any X Window system
    application begun through the character cell. Example 14.2 shows three possible
    ways to invoke xterm.


    To run the client remotely and display its results locally, you must tell the
    client process where to display its window. X applications use the value of the
    DISPLAY environment variable to indicate the TCP/IP host name of the server (that
    is, the name of the system on which the client should display its output).


    If the DISPLAY value has not been set, you must include the -display option in
    the command to invoke the client application. If the DISPLAY value is set, you
    can override it by using the -display option and the specified server name when
    starting the client. Typically, the display value is set to something like :0.0
    for the local server or sys2:0.0 to tell the client to display its output on the
    remote server called sys2. The part before the colon specifies the server''s TCP/IP
    host name or IP address. The part after the colon specifies the server number
    and display number, but the display number is optional. Unless you run multiple
    servers on one machine or have multiple displays controlled by a single server,
    set these values to 0. The TCP/IP protocol must be installed and configured on
    the network.'
  merge: -1
  img_proc: true
- pgno: 459
  md: '# Example 14.2 Invoke xterm on Another System


    **Option 1:** In an `xterm` window on `sys1`, redefine the `DISPLAY` variable
    as `sys2:0.0`. You can then invoke the application, and the shell automatically
    sends the output wherever that environment variable tells it to go:


    ```

    $ DISPLAY=sys2:0.0.<Enter>

    $ xterm &<Enter>

    ```


    **Option 2:** In an `xterm` window on `sys1`, enter


    ```

    $ export DISPLAY=sys2:0.0; xterm &<Enter>

    ```


    **Option 3:** In an `xterm` window on `sys1`, enter


    ```

    $ xterm -display sys2:0.0 <Enter>

    ```


    The `export` command is a TCP/IP command that sends another command to a specified
    remote system for execution.


    # Run a Client on Someone Else’s System


    Suppose you want to be able to use applications on someone else’s system. To do
    that, open an `xterm` window, activate it, and enter the following text on the
    command line:


    ```

    $ rlogin -1 username remote_hostname.<Enter>

    ```


    You must use a username that has already been created on the remote host. `rlogin`
    is one of the remote-host execute commands, commonly called *r* commands. The
    `-1` (the letter “ell,” not a number one) option basically clears the way for
    you to specify the username. The remote host name is the TCP/IP name of the system
    you are trying to log into. (The *r* commands, which we do not cover in this book,
    are introduced here only to illustrate how to accomplish this simplified client/server
    application execution.)


    The shell responds with a password prompt. Simply fill it in and press Enter,
    and you are authenticated to the remote system. Now, use one of the two following
    command sequences to invoke an application on the remote host and display it on
    your system:


    ```

    $ xterm -display sys1:0.0 <Enter>

    ```'
  merge: -1
  img_proc: true
