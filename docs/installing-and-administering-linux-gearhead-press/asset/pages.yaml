- pgno: 374
  md: 'The Don sees how the first conditional if-then-else decision structure calls
    for the shell to check whether a hidden script file called, *.bashrc* (containing
    aliases and functions specific to this user only and not to all users, such as
    those in */etc/bashrc*) exists in this directory, and if so, to execute it. Note
    that the *.bashrc* file, which contains user-specific functions and aliases, could
    be called anything, but the convention is to name it similarly to the */etc/bashrc*
    file, which has global functions and aliases.


    Next, he sees how his user''s *PATH* statement is modified. The existing *PATH*
    directories are adopted, and the *jlin* directory in the user''s home directory
    is added to them (please note that this scenario is a bash shell situation; Sancho''s
    environment, being tcsh, does not include this addition of the home directory
    to the *PATH*). If you want to ensure that the *current* directory is included
    in the *PATH* variable, verify that the variable contains two or more adjacent
    colons or a colon followed by a period.


    Don Quixote now has an idea why his *PATH* and Sancho''s are not identical during
    normal operations. Freston tells him, later, that the *PATHS* are identical *when
    Sancho works in the bash shell*.


    Meanwhile, the *BASH_ENV* variable causes the *.bashrc* script in the user''s
    home directory to run every time another new *bash* shell is invoked. This script
    is not exported because the settings, aliases, and other functions in *.bashrc*
    might not be variables and thus are not subject to export.


    Note that the *BASH_ENV* and *PATH* variables are exported so that these variables
    and their respective values will be adopted by child processes.


    Finally, the variable *USERNAME* (which has fallen out of favor with recent Linux
    versions), if it has survived this far, is removed. It used to cause confusion
    with users and administrators alike.


    Just as */etc/profile* has a companion in */etc/bashrc* for system functions and
    aliases, *$HOME/.bash_profile* has, by convention, its companion *$HOME/.bashrc*
    for user-defined functions and aliases.


    # ## A Sample $HOME/.bashrc File


    Example 11.3 contains the *BASH_ENV*=$HOME/.*bashrc* variable, which causes *$HOME/.bashrc*,
    with its extra specifics, to be executed every time the users starts a new *bash*
    shell. The *$HOME/.bash_profile* file is executed only once when the user logs
    in.


    In Example 11.10, we see that aliases and functions specific to the user are recommended,
    and then the global aliases and functions are searched for and invoked by the
    if-then-else decision string. Otherwise, those functions, aliases, and so on would
    not be invoked.'
