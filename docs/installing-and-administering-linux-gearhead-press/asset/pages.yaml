    # **_Types of Information Available_**


    You usually access the man  pages from the command line. Once you have done so,
    several of the following categories of information will appear immediately on
    the screen in ASCII text format. Just *which* categories appear will depend on
    the information''s origin and author as well as the format the author chose to
    use. This point is where the history of the selected command or function might
    have some influence:


    **NAME:** The name of the command, subroutine, file, and so on and a brief description
    of what it does


    **SYNOPSIS:** Synopsis is the syntax to use when invoking the command, subroutine,
    or file. (Synopsis is a term commonly used in the Linux and UNIX world to mean
    syntax.) Typically, the syntax follows the format we introduced here in this chapter,
    but you might also see a complete listing of all the options and arguments for
    the command for the particular version of Linux you are using. (In Example 3.3,
    we make further comments pertinent to the Synopsis section.)


    **INTRODUCTION** or **DESCRIPTION:** A more in-depth definition or description
    of what the command does. This section can also list or discuss the options and
    arguments, or it might list step-by-step instructions to follow before, during,
    or after the command is executed.


    **OPTIONS:** The available options and arguments.


    **FILES:** A list of files and their relation to the command. (For instance, you
    might need to consult a certain file to find the parameters of the command.)


    **ENVIRONMENT:** A list of the configuration files that are checked for certain
    parameters before a command is executed.


    **EXAMPLES:** Although examples are often found in the Introduction or Description
    section, an author might list a number of common examples for using the command,
    subroutine, or file in this Examples section.


    **SEE ALSO:** This part contains names of related commands or files or names of
    commands that might produce the same effect.'
  merge: -1
  img_proc: true
