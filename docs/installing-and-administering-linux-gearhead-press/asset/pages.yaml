    # Redirecting Error Messages to /dev/null


    Here, we will learn how to redirect error messages to /dev/null, commonly called
    the bit bucket—a special file that remains empty regardless of what you dump into
    it. It is used for all sorts of purposes, such as creating processes to check
    monitoring capability, creating network traffic for analysis, and disposing of
    error messages you might not want to be bothered with.


    Here is the basic syntax for redirecting a generic fileb error message to /dev/null:


    $ cat fileb 2> /dev/null<Enter>


    # Example 7.22 Redirecting Error Output to /dev/null (the Bit Bucket)


    Nicholas tries another variation of the procedure he has tried in Examples 7.20
    and 7.21. He is very interested in cat''ing RFl_Tel3 but is not as interested
