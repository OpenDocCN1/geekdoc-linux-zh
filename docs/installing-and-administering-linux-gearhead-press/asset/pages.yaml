    # ## Listing Variable Settings: set Command


    To identify your shell environment variables, you can type


    ```

    $ set<Enter>

    ```


    It might be advisable to type the following instead in case the listing of variables
    is longer than one screenful:


    ```

    $ set | more<Enter>

    ```


    or


    ```

    $ set | less<Enter>

    ```


    Actually, the customary use of the set command is to assign values to variables,
    as we will see later in the Variable Substitution section, as follows:


    ```

    $ set variablename=value<Enter>

    ```


    If you do not use options or arguments with the set command, however, the shell
    reports back with a listing of all shell variables as well as their values (as
    you will see in Example 11.1).


    The set command is a shell-related command and thus provides a different listing
    according to the shell that is currently being used. Because the set command reports
    the variables set in the current shell, it also reports the variables from the
    terminal environment. As mentioned, the terminal environment variables are a subset
    of the shell environment variables. Although your current shell has access to
    the values of these variables, all your commands might not have the same access
    because they might be invoked from different shells. The export command enables
    you to export the variables and their values to the terminal environment so that
    all commands will have that access, too.'
