    at the root directory. Path names that do not begin with a forward slash are termed
    relative.  The path names in Example 4.1 refer to the files depicted in Figure
    4.2. In the full path name, the first forward slash represents the root directory.
    In the relative path names, the current directory is presumed.


    # Example 4.1 Absolute and Relative Path Names


    Let''s look at the full or absolute path name for Don Quixote''s weekly report,
    typically submitted to Lady Dulcinea on Monday morning:


    ```

    /home/quixoted/admin/mon_rept

    ```


    Now, let''s look at the relative path names of other files in the Rueful Figures,
    Inc. directory structure. Let''s presume that our current directory is Don Quixote''s
    home directory, /home/quixoted:


    ```

    admin/mon_rept

    ./test1

    ../dulcinea/pgms/suba

    ```'
