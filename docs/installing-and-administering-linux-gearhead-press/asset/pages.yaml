  md: '# Basic File Management


    | **COMMAND** | **DESCRIPTION** |

    | :--- | :--- |

    | `cat` | List file contents (concatenate) to the terminal screen. |

    | | Or, with the output redirection symbol (>), create a new file (for example,
    cat> newfile\<Enter>). |

    | | Then, use Ctrl-D to end input to the new file. |

    | `chmod` | Change permission mode for files or directories. |

    | | Use r, w, x symbolic permissions for read, write, and execute. |

    | | Use + (plus), – (hyphen or minus), or = (equals sign) to grant, revoke, or
    specify exact permissions. |

    | | Use u, g, o, a to give permissions to user, group, others, and all, respectively.
    |

    | | Can also use octals (in other words, numerics): 4 = read, 2 = write, and 1
    = execute. |


    > **NOTE Linux sums permissions: the first is user, the next is group, and the
    last is other. For example, chmod 746 filename gives these permissions: user r
    w x; group r w; and others r.**


