    She realizes that using ls alone, she did not get a thorough-enough search. She
    found all the request files (special requests sent to her from each Knights group)
    in her current directory, but she could not find any report files. They appear
    to be in another subdirectory somewhere.


    Unfortunately, in these types of situations where you try to enter a fairly simple
    search command, the shell does not look any further than the current directory.
    To get the shell to look beyond the current directory and traverse the three-tiered
    directory structure in this example, Juana would have had to enter the following:


    ```

    $ ls R* */R* */*/R*<Enter>

    ```'
