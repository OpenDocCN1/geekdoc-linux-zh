  md: 'We will discuss three types of command piping:


    +   - Typical command piping

    +   - Filter commands

    +   - Tee commands


    > NOTE If one of the commands in a pipe fails, the entire pipe fails. So, if you
    fail to get any input, you cannot necessarily conclude that the last command,
    or any particular command, is the faulty one.


    # Typical Command Piping


    The output from the command to the left of the pipe is not displayed because it
    is given straight over to the input of the command to the right of the pipe. You
    see the results of the final process only, as shown in Example 7.26. The syntax
    is simply


    ```

    $ command1 | command2<Enter>

    ```


    # Example 7.26 Typical Command Piping


    Juana will count the number of entries (in other words, files and directories)
    in her home directory by using command piping. Please refer to Figure 7.2, which
    depicts her portion of the RFI directory structure.


    ```

    $ ls | wc -w<Enter>

    4

    ```


