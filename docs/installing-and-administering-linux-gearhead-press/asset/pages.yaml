  md: '![](img/cae5c706c216875d12d4b7d28144cc71_50_0.png)


    Figure 2.6 Installation type.


    # Step 5. Specify Installation Type


    We will demonstrate a custom installation (see Figure 2.6), which will allow you
    to specify exactly which packages and utilities that you need. Just as a point
    of interest should you decide to install absolutely all of the packages: You will
    have to create a 2.0-GB system partition to hold the files, which does not include
    room for any data. Before we continue, though, please consider the following comments.


    Among the most popular features of contemporary Linux systems are the new GNOME
    and KDE desktops. The one you choose should depend on what you want to do. If
    you are experimenting, try to install one and then the other. GNOME can run KDE
    applications and vice versa. Consider your choice between the two as making one
    dominant over the other. Of course, because the industry is somewhat political,
    the KDE development group has different mandates than the GNOME development group.
    Thus, we have two different factions creating desktops and utilities for such
    desktops.


    Notice that both the GNOME and KDE choices here are workstation solutions. In
    other words, the default suggested combination of packages and utilities are well
    suited for a desktop system such as that for an end user. An end user here would
    also include a code developer or system administrator, whereas the server solution
    offered here would install a set of packages and utilities that you would not
    necessarily want on a workstation. For your information, if you choose Server
    System, no X server will be installed. This situation is a change from previous
    version behavior.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'If you wish to have an X server for a server class system, choose Select individual
    packages during the installation or use the rpm utility after the installation
    is complete.


    Finally, they have added a choice for laptop computers in response to so many
    users trying to get Linux up and running on their laptops only to find out that
    they were missing many of the required packages. The default installation for
    a laptop now includes those packages, such as a PCMCIA slot and power and TFT
    video support utilities.


    There is also an upgrade path available. We highly recommend that you use this
    feature to upgrade a Linux distribution or Linux kernel to the next level. This
    situation is far preferable to attempting to recompile a kernel. Recompiling kernels
    is a specialized task that we are going to address in another chapter in this
    book.


    To repeat, we chose Custom.


    # Step 6. Partitioning


    We are going to choose Continue (see Figure 2.7) to use automatic partitioning
    to show you how the system will look after the installation. The automatic partitioning
    will create a small partition called /boot, which will contain the boot files
    for the system. All other files and directories will go into one large partition
    called /.


    Please be reminded again, that this installation is using Red Hat 7.1, which handles
    this situation differently from the previous Red Hat version 7.0. With RH 7.0,
    all the files—including the boot files—would go into one large partition called
    /.


    ![](img/cae5c706c216875d12d4b7d28144cc71_51_0.png)


    Figure 2.7  Hard disk partitioning.'
