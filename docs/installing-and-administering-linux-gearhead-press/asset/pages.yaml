    page. You might also find an address for reaching the author directly. Often,
    this section indicates whether the command originated with another version of
    UNIX or whether it was developed especially for Linux.


    **DERIVATION:** At the bottom of the man page, you might find additional information
    regarding the origin of the command (sources such as AT&T or Berkeley or version
    numbers or dates).


    **DATE:** The date of the man page’s last update. This date does not indicate
    when the last update of the command’s utility, options, or arguments occurred.
    The man pages themselves are not always updated when someone modifies an element
    of the command/program or file.


    # ### Navigating man Pages


    After a man page is open, press the following keys to move around in it:


    +   - The space bar navigates down the file one screen at a time.


    +   - *b* navigates up through the file one screen at a time.


    +   - *d* navigates down through the file one-half screen at a time.


    +   - *u* navigates up the file one-half screen at a time.


    +   - Enter or the down arrow key navigates down the file one line at a time.


    +   - *h* displays a help screen with a number of other navigation commands.


    +   - *q* quits the help screen and returns you to the man page.


    +   - */* followed by an alphanumeric string and Enter searches for the string.'
