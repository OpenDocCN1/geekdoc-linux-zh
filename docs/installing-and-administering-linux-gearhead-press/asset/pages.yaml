    # Nondestructive Redirection


    If your intention is to add data to a file or simply avoid overwrit-ing existing
    data, you can append output to an existing file (called *nondestructive redirection*).
    The syntax is as follows:


    ```

    ```

    $ command >> filename

    ```

    ```


    This type of nondestructive redirection is shown in Example 7.19.


    # Example 7.19 Nondestructive Output Redirection Using >>


    Freston regularly and periodically uses the *who* command to check to see who
    is on the system. When he does so, he redirects who''s output to an existing text
    file called *who_survey.out* for future reference and for statistical purposes.
    To redirect the output and append it to that existing file, he tells the *who*
    command to send its output to the *who_survey.out* file, appending the output
    to any data that is already in the file:


    ```

    ```

    $ who >> who_survey.out<Enter>

    ```

    ```'
