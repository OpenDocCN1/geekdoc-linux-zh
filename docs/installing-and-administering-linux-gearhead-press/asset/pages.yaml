    # # Command Syntax


    Because we have already started to enter commands, it is a good idea to discuss
    Linux commands in general. Linux commands generally follow the syntax and format
    of UNIX commands. The order and correct separation of elements are important.
    The name of the *command* (or process, as some might refer to it) always comes
    first. The command name can then be followed by one or more *options* (some call
    them flags) that can, in turn, be followed by one or more *arguments* (these might
    also be called flags by some; it’s best to be as precise as possible in your references,
    though). You must separate options from the command name and from other options
    by single spaces. Also, options must be preceded by a hyphen (-). In the following,
    *-f* and *-l* are options to their respective commands:


    ```

    ```

    [username@hostname *home dir*]$ mail -f newmail<Enter>

    [username@hostname *home dir*]$ wc -l filename<Enter>

    ```

    ```


    We will be discussing both of those commands in more detail soon. For now, however,
    suffice it to say that the first command line reads, “Bring me the contents of
    my mailbox for processing (reading, replying, deleting, and the like). Then, when
    I am finished, return the undeleted messages to an alternate mailbox called newmail.”
    Notice that the filename *newmail* is the argument to the command *mail* and its
    option, *-f*.


    The second command line reads, “Count the number of lines in the file called *filename*.”


    You can group multiple options together and precede them by a single hyphen. For
    example,


    ```

    $ ls -if<Enter>

    ```


    This command says, “List the files found in the directory I’m in now, but only
    the files (not the directories). Also, provide detailed information'
  merge: -1
