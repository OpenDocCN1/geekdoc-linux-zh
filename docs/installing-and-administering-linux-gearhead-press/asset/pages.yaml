    # Comparing Text Files: The diff Command


    Occasionally, you might want to determine the differences between two text files.
    For example, two users might be working on different sections of the same report
    at the office or on the same sections of the same report—or even on the same report
    at different times. These are times when the diff command comes in handy. This
    command can compare the lines of text in two files or even compare all similarly
    named pairs of text files in two directories (if the arguments are directory names
    instead of filenames). The syntax is as follows:


    ```

    $ diff [-options] filename1 filename2<Enter>

    ```


    Thus, the diff command enables a user to compare two text files line by line (we
    will discuss the cmp command later, which enables other types of files to be compared
    and on a byte-by-byte basis). diff has numerous options; check your information
    sources. In Example 9.12, we will use two'
  merge: -1
