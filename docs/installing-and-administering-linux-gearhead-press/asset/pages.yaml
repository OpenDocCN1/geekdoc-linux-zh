- pgno: 14
  md: '![](img/cae5c706c216875d12d4b7d28144cc71_14_0.png)


    # Introduction


    Welcome to the world of Linux! And welcome especially to the second edition of
    *Installing and Administering Linux*. You are now in the trenches with us here
    at Gearhead Press and John Wiley & Sons. But fear not, you are in excellent company.
    Well, we think so, anyway.


    We do not know how many Linux books you already own. We do not have any idea how
    many you have already picked up and put down here in the store or library. But
    here is a book that you can really use. You can use it in two ways. First, you
    can sit down at your personal computer with your chosen version of Linux and install
    it. Then, you can go step-by-step through a complete introductory course in basic
    Linux administration.


    This book has everything you need to go from a beginner to an intermediate-level
    user or beginning-level administrator. It has introductory material, organized
    “lectures,” lots of examples, laboratory exercises you can do on your own system,
    and even quizzes you can take to test your comprehension. The information is all
    here. Or, you might already be an advanced beginner or intermediate administrator
    and need an orderly and progressive reference book. This book fills that need,
    too. Plus, it has the kind of real-world tips you can use on your home system
    or on the job.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Introduction


    *Installing and Administering Linux, 2nd Edition* might seem to focus on the Red
    Hat distribution (because that is the version we show you how to install in Chapter
    2), but it teaches you concepts that are applicable to *all* Linux flavors and
    even to all UNIX flavors: FreeBSD, AIX, HPUX, you name it. So it is really “version
    independent.” If you are working on a friend’s FreeBSD system or on the company’s
    IBM AIX system, you need to know what basic basic command to use for whatever
    purpose, and you can still use this book. If you do not find exactly what you
    want in that case, we expect you will get a good lead.


    # Overview of the Book and Technology


    We wrote this book for several reasons:


    +   - The book contains material that is comparable to what you would find in
    a good introductory Linux course. Take a look at the price on the cover. We guarantee
    that the price is absolutely tiny compared to what you would pay at any technical
    institute, college, or university for a comparable course.

    +   - The book also makes a great companion for an introductory course. In fact,
    the first edition of this book was actually adopted by more than one technical
    school as their “Intro Linux” course.

    +   - This book will help you on the road to Linux certification. Unfortunately,
    it does not contain EVERYTHING you will need to know, but it provides a pretty
    good foundation for the next levels. Yes, be assured that it contains concepts,
    lab exercises, and quiz questions that are comparable to those you might eventually
    find on a Linux certification test. We are not interested in teaching you stuff
    just to teach you stuff. We want to help you move ahead.

    +   - Most importantly, this book reflects what our professional colleagues and
    students have requested for years: a clear and easily read text that introduces
    and explains what they need to know NOW to get rolling with Linux.


    One of the first things you will notice about “Installing and Administering Linux”
    is that it focuses on the “command line,” similar to the classic UNIX or even
    to DOS, if you are familiar with the world before Microsoft Windows. In other
    words, we will not emphasize the use of Linux’s X Window System, the *graphical
    user interface* (GUI) to Linux. Do not get the'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'wrong impression, though. Linux has some excellent window manager applications,
    from the basic “twm” to the more complete and very quickly developing “KDE” and
    “GNOME” window environments. No, the reason we focus on the command line is because
    once you get a feel for it, it is faster and more universally applicable than
    an administration standpoint. Even in the GUIs, you will probably be doing something
    at the command line eventually. “Be not afraid,” for command line concepts and
    the commands themselves are easily learned with a little practice.


    As we mentioned earlier, the material that you will find in this book is “version
    independent.” In this case, it is really version and flavor independent because
    its concepts and commands apply to most UNIXes and to most Linuxes, from the earliest
    versions to the latest. This book is a basic-to-intermediate book; these are basic-to-intermediate
    concepts, and the basic concepts have not changed very much.


    We have tried to make Installing and Administering Linux, 2nd Edition as up-to-date
    as possible. That is why we take the time every year or so to revise it. You will
    see, however, that the concepts found in it have not changed, and the commands
    and utilities have changed only for the better.


    # How This Book Is Organized


    If you are familiar at all with the first edition of *Installing and Administering
    Linux, 2nd Edition*, then you will quickly notice how the organization of the
    book has changed significantly. We have “re-chunked” the material and introduced
    several new concepts and many new examples. Why? The original book followed the
    flow of a typical introductory course: doing a wide sweep of concepts on a basic
    level, then returning to certain concepts and exploring them in more detail. That
    was fine. But as a reference tool, the book was not as effective as it could have
    been. So, for this second edition, we regrouped the material and then filled in
    some blanks in the concepts and in the flow of discussion. We find this second
    edition to be a little more complete and comprehensive (for an introductory book,
    that is).


    A lot of introductory courses begin by telling you a little about the technology
    you are dealing with—its origins and where it fits into the technological world.
    We do the same. In Chapter 1, we explain that Linux was not always there. We show
    you the evolution of a project called “Multics” and how Multics yielded UNIX.
    Then, we follow UNIX until Linux is born. We mention some Linux/UNIX concepts
    that you might or might not know, such as “free software” for example. We also
    hint at the future of Linux.'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'Chapter 2 shows you how to install Red Hat Linux on your *Integrated Drive
    Electronics* (IDE) personal computer. This installation is the most common type
    of Linux installation. In the first edition of *Installing and Administering Linux*,
    we put the installation chapter at the end. We were interested primarily in teaching
    Linux concepts first, because the various Linux flavors have slightly different
    installation procedures. Our readers and reviewers, however, suggested that we
    move the installation chapter forward for a better “start at the very beginning”
    approach. We are happy to oblige. Now, if you need to know how to install Linux
    on a system other than IDE, then we recommend our companion book called *Upgrading
    and Customizing Linux*, which covers installation in more depth on different systems
    and via different methods.


    In Chapter 3, we show you how to “become somebody” in Linux. You will learn how
    to log in and log out. You will create users and groups and find out how to assign
    and change passwords. Then, just before we teach you a few common commands, we
    teach you *about* commands—what they all have in common with respect to syntax
    and how to find out more about them. Then, we show you some very basic getting
    around and communicating commands.


    Chapters 4 through 6 delve into file and directory manipulation. You will learn
    about the file types supported by Linux; how to create, remove, and navigate the
    directories; how to examine and manipulate files; how to print files; and how
    to alter permissions on files for a modicum of file security.


    In Chapter 7, we will introduce the concept of a “shell.” You have likely seen
    shells in action before, but no one ever called them that. We will show you how
    the Linux shells interact with you and with Linux to make life easier and more
    efficient for you and for the system you are using.


    The shell concepts will set the stage for the basic (Chapter 8) and advanced (Chapter
    9) Linux utilities that will enable you to search, find, and manipulate Linux
    commands, files, and the data within files. Once you have mastered these utilities,
    a lot of the mysteries behind files and data will disappear—and your ability to
    perform administration functions will progress quickly.


    Chapter 10 presents both a break and a catch-up. In this chapter, we introduce
    the almost universal (to higher-level UNIX users, anyway) text editor called “*vi*.”
    If you aspire to higher-level Linux expertise, then knowledge of *vi* or other
    simple yet powerful Linux text editors will be mandatory. In fact, with your new
    knowledge of *vi*, you will be able to return to earlier exercises, if you wish,
    and do them so much faster. Needless to say, moving to the next chapters will
    be easier, too.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'In Chapter 11, you will be introduced to the various environments in which
    your Linux system operates. We tend to think that our systems just operate the
    way they do, and that is that. This chapter will introduce you to variables, the
    environments created and colored by those variables, how your environments are
    built during system bootup and login, and how you can alter all those components
    to make your system work your way.


    For those who are curious about what really goes on behind the scenes in a computer
    system, Chapter 12 will prove fascinating and potentially very powerful. We will
    introduce you to the system processes without which your system simply would not
    operate. You will discover how Linux/UNIX enables you to actually control how
    those processes work (something that other major operating systems do not enable
    you to do). In fact, you will even recognize some of the concepts and symptoms
    at work (or not at work) when other operating systems hang on you.


    We introduce you to some basic system automation in Chapter 13 when we discuss
    shell programming. In that chapter, we even provide you with actual real-world
    scripts that you can use to make your system more responsive and more powerful
    while at the same time alerting you to, if not actually preventing, system overloads
    or other problems.


    In Chapter 15, we provide a very basic introduction to Linux’s GUIs. For some,
    this introduction might seem too basic and trivial. But there are also some tips
    and tricks that you might find handy, whether you are already familiar with Linux
    GUIs or not.


    One of the most remarkable aspects of Linux is how it has grown up courtesy of
    the Internet and other media. So, we finish the book with Chapter 16, an up-to-date
    (if there really can be such a thing in a library or store-shelf book) compendium
    of Internet and other sources of information. If you need to know where to go
    to get applications, a newer kernel, X Window system information, or whatever,
    this chapter will lead you to it.


    When we began to rewrite Installing and Administering Linux, we thought that it
    might be more fun to introduce a cast of characters about whom all this Linux
    activity revolved—imaginary people you might learn and illustrate the concepts
    and who might help keep the material lighter. We had read "Don Quixote" several
    years ago and were inspired by it from several stand-points, among which are 1)
    the cast of characters, 2) no matter what happened, Don Quixote had that indomitable
    and intrepid spirit (a trait we can all use in this fast-paced and often confusing
    world), 3) some of the predicaments and adventures, not to mention the actions
    and reactions of Don and his cohorts, were outrageous (not unlike some we get
    into ourselves), and 4)'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'they all combine to illustrate the beauty and strength of humanity and philosophy.


    Therefore, we adopted some names and basic traits and then constructed, in our
    minds and on our pages, Rueil Figures, Inc., a company located in Spain that was
    dedicated to growing citrus fruit (to pay the bills) and to doing noble and chivalrous
    deeds. Where we can, we use RFI staff to show the reader how to perform the actions
    behind the concepts. We hope you enjoy them; we had fun creating them.


    # ## Who Should Read This Book?


    We wrote this book for the busy system administrator or network engineer who aims
    to be up and running in short order. We want it to be fast-paced and version-independent—a
    reference that features insights we have gathered from our experiences in the
    trenches as system administrators, professional trainers, and consultants.


    This book is written from a Linux system professional''s perspective and highlights
    key similarities and differences between Linux and other UNIX systems to minimize
    the learning curve. We have provided time-tested exercises and corresponding quizzes
    with answers at the end of nearly every chapter plus helpful notes, warnings,
    and workarounds throughout the book. This information is all intended to accelerate
    the direct development of basic Linux skills as well as Linux system administration
    skills.


    If you work your way through this book, you will learn to:


    +   * Install Linux on an IDE system

    +   * Log into and out of a Linux system as a root and ordinary user

    +   * Create user accounts, group accounts, and passwords

    +   * Execute common Linux commands

    +   * Manage Linux files, directories, and processes

    +   * Use common Linux utilities

    +   * Use the vi text editor

    +   * Customize the Linux work environment

    +   * Use and customize a Linux X Window system environment


    This book is also ideally suited to the Linux newcomer. That person could be a
    newcomer to computer systems or someone who has operated with that “other GUI
    operating system” but who is curious about a powerful and reliable operating system
    whose popularity is growing daily.'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'Vast experience, however, is not necessary to understand and enjoy it. Advanced
    system administration concepts will likely be mentioned but might not be covered
    in any great depth because they are beyond the scope of this introductory course.
    In the meantime, you will still be introduced to exercises and questions you can
    expect to encounter if you pursue Linux certification.


    # ## Summary


    We hope you will enjoy this introduction to the Linux adventure. The book is a
    good and progressive course unto itself as well an organized reference work. Once
    you have worked your way through it, you will have enough background to take on
    any intermediate Linux course or text and to take on any lower-level system administration
    or customer support.'
  merge: -1
  img_proc: true
