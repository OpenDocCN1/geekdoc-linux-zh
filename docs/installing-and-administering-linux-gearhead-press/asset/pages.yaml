- pgno: 479
  md: '# Linux Online


    Linux Online!, the official Linux Web site (which you have mentioned a couple
    of times already), is at www.linux.org. Certainly, it has to be one of the more
    obvious places to start when you are looking for any Linux information. Everything
    you need to know about Linux in general is there, organized into categories such
    as General Information, Distributions, Applications, Support, Projects, Hardware,
    User Groups, Book Store, Vendors, Events, Services, Featured Books, The GNU General
    Public License, Documentation, Courses, News, People, and so on. You can link
    to most of the other significant sites through the categories. There is a search
    engine on the site, too. Hey, on the site you can even support Linux development
    by buying a Linux Online! coffee mug featuring Tux, the Linux penguin.


    # Tux, the Linux Penguin


    Speaking of Tux, the official logo of Linux is a penguin (please see the end of
    the last section). To find out about him, try going to www.wsc.tamu.edu/~lewing/linux,
    which is the site of Larry Ewing, his creator.


    # Linux Online in Canada


    The www.linuxcanada.net site is recommended. Its major attraction is that it has
    many direct links to other excellent Internet sites. Its categories are Linux
    Books, Linux User Groups, Linux Facts, Linux Discussions, Linux News, Biz Press,
    and Linux Software.


    # Linux Online in Europe


    Also recommended is www.linux.eu.org, designed to help European users find Local
    UserGroups (LUGs), information, and other Linux sites in their own language and/or
    country. There are “national flag” links from this site to sites in more than
    30 European nations.


    # Software Sources


    The following sites, which can be accessed from the two just-noted sites, bear
    special mention because they are reputable sources for Linux software and applications.
    All have a similar structure (articles, software, links to other sites, and so
    on):'
  merge: -1
  img_proc: true
- pgno: 480
  md: '+   * http://freshmeat.net

    +   * http://slashdot.org (Its motto: “News for Nerds. Stuff that matters.”)

    +   * www.kernel.org (“The Linux Kernel Archives,” the quintessential source for
    the latest Linux kernels.) If you want, you can also investigate www.ibiblio.org.
    Once you get there, click the “Enter the Navigator” button to find other Linux
    kernels and kernel information.


    # X Window System Sources


    The following three sites deal with X Window System (explained in detail in Chapter
    14, “The Linux X Window System”).


    The XFree86 Project, Inc.™ at www.xfree86.org is the master Web site for X Window
    System information and downloads. On that site, you will learn what XFree86 is,
    what the latest version is, and what mirror sites you can access (if necessary).
    It will also tell you the latest X Window system news and provide documentation
    and other information. You can find an FTP download site at ftp://ftp.XFree86.org/pub/XFree86/
    and an HTTP download site at http://ftp.XFree86.org/pub/XFree86/.


    www.kde.org/ is the Web site for the K Desktop Environment (KDE), one of the more
    sophisticated X Window managers (mentioned in Chapter 14). The site is organized
    similarly to others: General Information, Worldwide Sites, Developer Information,
    Events, Supporting KDE, FAQs, Downloads, and so on.


    www.gnome.org/ is the Web site for the GNU Network Object Model Environment (GNOME),
    considered by many to be the modern X Window manager. Based entirely on open-source
    (in other words, free) software, it has links to the GNOME software and Manifesto
    sites and is otherwise structured like the two previous sites.


    # Linux Newsgroups


    USENET newsgroups are a worldwide system of computers that store, update, and
    exchange collections of discussion text files organized by category. Newsgroups
    are a means of public discussion. Their articles/messages look like e-mail, but
    they can potentially be read by millions of people all'
  merge: -1
  img_proc: true
- pgno: 481
  md: 'over the world. Newsgroup articles are distributed via news servers, which
    contain databases of articles and are operated by *Internet service providers*
    (ISPs), schools, universities, and companies.


    # **Newsreaders for Accessing Newsgroups**


    You will have to get newsreader software, such as PAN (http://pan .rebelbase.com//download.html),
    that also supports offline newreading, multiple connections, and extra features
    (including those for alt.binary files). It is available in several formats (RPMs,
    tarballs, and so on) on the Web site, but it is also found packaged with the major
    Linux distributions. Documentation and other resources can be found on the Web
    site.


    Once your newsreader is configured to read newsgroups, you should be able to click
    on the various newsgroup names to read them. If that does not work, you might
    have to contact your ISP for further advice on how to access USENET.


    Here are a few Linux-oriented USENET newsgroups:


    +   - comp.os.linux.advocacy. The benefits of Linux compared to other Os.

    +   - comp.os.linux.announce. All announcements that are relevant to the Linux
    community: new software, new documentation, warnings about bugs and security holes,
    notices about user group meetings, and so on.

    +   - comp.os.linux.answers. For posting Linux FAQs, HOWTOs, READMES, and other
    documents.

    +   - comp.os.linux.development.apps. Questions and discussions regarding the
    writing of applications for Linux and the porting of applications to Linux.

    +   - comp.os.linux.alpha. Linux on Digital Alpha machines.

    +   - comp.os.linux.hardware. Questions and discussions specific to Linux vis-à-vis
    a particular piece of hardware.

    +   - comp.os.linux.m68k. Intended to further interest in, and development of,
    porting Linux to Motorola’s 680x0 architecture.

    +   - comp.os.linux.powerpc. Linux running on PowerPC microprocessors.

    +   - comp.os.linux.networking. Questions and discussions relating to networking
    or communications, including Ethernet boards, serial communications, SLIP, and
    so on.

    +   - comp.os.linux.x. Questions and discussions relating to X Window System,
    version 11, compatible software including servers, clients,'
  merge: -1
  img_proc: true
