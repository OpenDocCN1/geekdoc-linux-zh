    Support groups typically have e-mail-type newsletters, chat groups or newsgroups,
    and mailing lists as well.


    # ## More Linux Information Sites on the Internet


    So many valuable Linux-related sites are on the Internet that it is difficult
    to decide where to begin and just as difficult to determine where to stop. We
    have already mentioned several Internet sites, and this section describes a few
    more that we hope you will find interesting and beneficial.'
