    # # Use cat in a Pipe Sequence for ? in Filenames


    When executing listings of directory contents, you might sometimes encounter filenames
    containing a question mark (?). The creator of such a filename might have intentionally
    inserted the question mark, but this symbol can also indicate the presence of
    other characters that cannot be readily interpreted by the shell. When dealing
    with these odd filenames in directories, you can use *cat* as the second process
    in a piped set of commands:


    For example, a typical *ls* command might reveal the following:


    ```

    `testfile1    te?stfile2`

    ```


    Now, we try *cat*:


    ```

    `$ ls | cat -vt<Esc>`

    ```


    The output might look something like the following:


    ```

    ```

    testfile1

    te^Gatfile2

    ```

    ```


    This example shows a Ctrl-G (that is, ^G) in the middle of what otherwise would
    have been called *testfile2*. How do you correct the filename? You could simply
    rename the file as follows:


    ```

    `$ mv te^Gatfile2 testfile2<Esc>`

    ```


    > **NOTE** You cannot enter `te^Gatfile2` at the command line. If you try, you
    will hear an error “beep” from Linux.


    If the correction strategy fails, you can try another technique. First, you need
    to obtain the inode number of the file with *ls* -i. (Remember that the filename
    displayed is probably *te?stfile2* because a simple *ls* -i does not display the
    hidden Ctrl-G characters.)'
