- pgno: 228
  md: 'In these two syntax examples, the order in which the redirections appear does
    not matter. As we have stated previously—to clarify why one redirection is called
    potentially destructive and the other is nondestructive—notice that, in the first
    example, we direct the command output to *outfile* and any error information to
    *errfile*. If *outfile* and *errfile* already contain information, that information
    is overwritten (and destroyed) with the new information from this new command.
    In the second example, the results from command execution are appended to *appendfile*,
    preserving whatever information might already be in the file. Similarly, error
    information, if any, is appended to *errfile*, preserving whatever information
    might be there as well.


    # ### Association


    *Association* is another type of combined redirection. The best way to discuss
    it is to demonstrate it. Please have a look at Example 7.23. As we mentioned previously,
    our discussion of association will include the use of the device pointer numbers
    that we have seen in the descriptor tables.


    # ### Example 7.23 Redirection Using Association: A Simple Task


    Let’s revisit Nicholas’ situation, which we were introduced to in Examples 7.21
    and 7.22. He still wants to *cat* the two files (his own copy of `RFL_Tel3` and
    Freston’s `RFL_et_al_Tel#`). He wants to redirect the *cat* output to the *combo*
    file. He also wants any error messages to be sent to `&1`, which means that they
    should also be sent to the standard output location (because 1 is the device pointer
    for standard output, as we have seen in the descriptor tables) as well. Within
    this very command, however, standard output has just been redefined to mean the
    *combo* file. So, the error messages will be sent to *combo*, too. Here is the
    command, then:


    ```

    ```

    $ cat RFL_Tel3 /root/RFL_et_al_Tel# > combo 2>&1

    ```


    ```


