    same as the following sequence of commands. Skeptical, Juana enters them:


    ```

    $ ls > tempfile<Enter>

    $ wc -w tempfile<Enter>

    5 tempfile

    ```


    Juana asks Freston, "If the piped command was equivalent to the sequence of commands,
    why did the word count differ from one to the other?"


    Freston replies, "Simple, really. In the command sequence, you created a new file
    called tempfile, and its name got caught up in the word count. Check to see."


    So Juana cat''s tempfile to check. When she is through checking, she deletes tempfile:'
