- pgno: 180
  md: '# Linux File Permissions


    Along with passwords and authentication systems, file and directory access—known
    as *permissions*—forms the basis for system security. Although similar in nature,
    directory permissions and file permissions are not the same—and occasionally,
    that difference leads to confusion and even security breaches.


    We begin the chapter with a review of the `ls -l` command, which you use to view
    existing file and directory permissions. Then, we focus on information found in
    the first column of the `ls -l` response information—the permission bits—which
    provide a summary of the file mode of these entries. We introduce several terms,
    commands, and issues involved in setting and changing permissions.


    # Review of the ls -l Command


    We described the output of the `ls -l` (long listing) command in detail in Chapter
    4, “Files and Directories in Linux.” Example 6.1 and Table 6.1 illustrate our
    quick review of this frequently used command.'
  merge: -1
  img_proc: true
