    To use the scrollbar, place the mouse pointer in the scrollbar itself and then
    press the left mouse button to move up or press the right mouse button to move
    down. If you want to remove the scrollbar, redo the instruction and left-click
    Enable scrollbar to remove the check mark next to that selection.


    Use the man pages, the help options, and other information sources to see what
    else you can do with the `xterm` command.


    # ### Close an xterm Window


    To close an xterm window, you have several alternatives. At the prompt in the
    window, press Ctrl-D or type `exit` and press Enter. Double-click the Window-Ops
    button in the upper-left corner of the window or left-click that same Window-Ops
    button and then left-click **Close** on the resulting drop-down menu.


    # ### Customize xterm


    We have already discussed a couple of xterm options:


    +   Running the second xterm window in the background so that you can move back
    and forth from window to window (the & option)


    +   Adding a scrollbar to the new xterm window (using the -sb option with either
    the -leftbar or -rightbar option)


    In this section, we present a few more of the dozens of options available to you
    with the xterm command. Combining these options gives you perhaps thousands of
    possibilities for new xterm windows. Take a look at Example 14.1 and Table 14.4
    to see how xterm can work for you.'
