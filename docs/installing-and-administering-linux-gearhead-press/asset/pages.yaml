- pgno: 385
  md: '# Parent-Child Relationships


    When you execute a command, it is important to remember that one or more processes
    are already running. Thus, every process running in Linux is invoked or managed
    by another process. All processes exist in this parent-child relationship (or
    parent-child hierarchy, if you prefer). The process started by a program or command
    is known as the *parent* process. The parent process can invoke other processes;
    those processes are called *child* processes. A parent process might have several
    child processes, but any child process can have only one parent process.


    The child process environment is a local one that it has inherited from the parent.
    That environment tells the child what invoked the child process, how the child
    process should handle output, and so on. The child can modify its inherited environment
    and pass the modified environment down to its own children (if applicable), but
    it cannot pass the modified environment back to its parent. The exception is the
    child process that is invoked through the use of a dot (.), which we will discuss
    later.


    # Invoking Shells


    A common parent-child propagation is the invocation of one shell from another—usually
    the invocation of a non-login shell from a user’s login shell. There are two basic
    ways to invoke new shells:


    +   - Invoke a new shell. The original shell becomes a “sleeping shell.”

    +   - Invoke a new shell. The original shell is stopped.


    Almost all of our examples in this chapter will involve the first method: invoking
    a new shell while the original shell goes to sleep. In the meantime, let’s look
    at the two methods.


    # Invoking a New Shell and Interrupting the Original Shell


    To invoke a new shell while only interrupting the original shell, use the following
    syntax:


    ```

    $ newshellname ( -options ) [arguments] <Enter>

    ```'
  merge: -1
  img_proc: true
- pgno: 386
  md: 'When a new shell is invoked in this manner, the previous shell (usually, but
    not always, the login shell) will “sleep” until you go back to it by entering
    the `exit` command.


    You can also invoke a new shell by entering the following:


    ```

    $ newshellname (-options) commandname (-options) [arguments]<Enter>

    ```


    or


    ```

    $ newshellname (-options) scriptname<Enter>

    ```


    This action spawns a new shell, which in turn will execute either a new command/program
    or a new script. Once the command/program or script has executed, then control
    will pass from the new shell back to the original shell. Until then, the original
    shell will “sleep.”


    Table 12.2 lists a few of the several options that can be invoked along with either
    the sh or bash shell commands.


    You will notice that when a new shell is invoked that is the same as the login
    shell, the user prompt will not change (have a look at Figure 12.1). As it is
    invoked, the new shell will read the same environment files as the previous shells.
    You can check that a new shell has been invoked by entering the `ps` command with
    no options or arguments. The new shell will have the same name as the previous
    shell but will have a different process ID number (PID).


    # Table 12.2 Options Available for Use with bash or sh Shells


    | OPTION | EXPLANATION |

    |:-|:-|

    | -c | The additional commands following the -c can be run with the shell command.
    |

    | -r | Start a restricted shell; that is, a shell that has approximately a dozen
    restrictions. Examples: you cannot cd between directories; you cannot set or unset
    the SHELL, PATH, ENV, or BASH_ENV variables (and so on). |

