    the present position |

    | `j` or `Ctrl-n` | Move the cursor to the character position immediately below
    the present position |

    | `^`, `$` | Move the cursor to the beginning of the current line; to the end
    of the current line |

    | `w`, `b` | Move the cursor one word position to the right; one word position
    to the left |

    | `Enter` or `+` | Move the cursor to the beginning of the next line |

    | `-` | Move the cursor to the beginning of the previous line |

    | `G` | Move the cursor to the beginning of the last line of the buffer contents
