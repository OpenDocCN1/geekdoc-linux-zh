    # Error Redirection


    Error messages are normally sent immediately to the screen or to the system console.
    Sometimes, however, you want to redirect error messages for various reasons. There
    are two types of error redirection:


    +   - Redirecting error messages to a file

    +   - Redirecting error messages to /dev/null


    We will discuss each one in some detail.


