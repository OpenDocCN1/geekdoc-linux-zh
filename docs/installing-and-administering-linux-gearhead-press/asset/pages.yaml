    # # Installing Linux from a CD-ROM


    In this chapter, we discuss getting ready for an installation on an Integrated
    Drive Electronics (IDE) system, booting from CD-ROM, the necessity for a boot
    disk and rescue disks, and then some troubleshooting. Then, we walk through a
    fairly typical Linux installation on an also fairly typical IDE system.


    You will encounter a few concepts, commands, and procedures here that we do not
    explain in detail until later in the book. If we fail to provide you with sufficient
    cross-references, we apologize. But you should be able to get by using the table
    of contents and the index. In our previous edition, we left the installation procedure
    until the end of the book, but we received many suggestions to move it forward.


    First, though, if you are going to follow along, then you will need a copy of
    Linux. Linux can be obtained from several sources, including your local software
    vendor, from the various distribution manufacturers directly (say, via the Internet),
    or on CD-ROMs included with instruction books such as this one. If you have lots
    of bandwidth and a CD-ROM burner, you can actually download the ISO images directly
    from several vendors’ Web sites (see Chapter 15, “Linux Documentation and Support,”
    for a list of Linux distributions), such as Red Hat.'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'The installation menus are dynamic and might change order for various distribution
    versions. The installation in the chapter uses Red Hat Linux version 7.1, which
    implements a Linux kernel level of 2.4.2-2. All the Red Hat distributions starting
    at version 6.X offer a GUI installation option. We will bypass the GUI installation
    and intentionally guide you through a text menu installation for three reasons:


    +   - There is (unfortunately) still a high failure rate for GUI installations.

    +   - Our objective is to present you with a more consistent view of a Linux installation
    procedure that has been in place since the very early versions. Thus, if you are
    installing an earlier version, then this book can still assist you.

    +   - The text menu installation includes some menus that you would not normally
    see in the GUI install and thus gives you a more technical view of the overall
    procedure.


    By definition, “Linux is a UNIX-like operating system kernel that it can be freely
    distributed.” Technically, Linux is not freeware nor is it in the public domain.
    Linux is protected by both a code of honor and the *GNU General Public License*
    (GNU GPL). Essentially, this situation means that you should not change the source
    code of the kernel and then release it under a more restrictive license. Any changes
    or modifications made to the Linux kernel are governed by the GPL as well. In
    other words, you can get the code from anywhere and legally use it. You can even
    resell it. But you have to supply the source code, too, just like it was supplied
    to you.


    # Installing Linux on an IDE System


    As we said previously, in this section we will install Linux IDE architecture.
    IDE is an IBM PC *Industry Standard Architecture* (ISA). It is generally less
    expensive than SCSI and is simpler to configure. We have drawn the disk drive
    configurations (hard disk drive and CD-ROM drive, too) in Figure 2.1 for you to
    study the partitions and mount point data.


    # Troubleshooting the IDE Installation


    If you have trouble with the installation, stop and research what you are doing.
    Based on our experience, most problems involve hard drive config-'
