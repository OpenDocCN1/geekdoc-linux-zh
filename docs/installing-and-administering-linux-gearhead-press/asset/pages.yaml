- pgno: 182
  md: '# Example 6.1 The ls -l Command


    ```

    ```

    $ pwd<Enter>

    /home/quixote

    $ ls -l<Enter>

    ```

    ```


    The following is a description of the different fields of output:


    +   - **Field 1** consists of the object identifier and file or directory permission
    bits.

    +   - **Field 2** is the link count. Ordinary files have a link count of 1. Directories
    have a link count of 2. The `ln` command can increase the link count by 1; removing
    a file reduces its link count by 1. When the link count reaches 0, the file is
    removed.

    +   - **Field 3** is the username of the person who owns the entry.

    +   - **Field 4** is the name of the group for which group protection privileges
    are in effect.

    +   - **Field 5** is the character count of the entry.

    +   - **Field 6** is the date and time the entry was last modified.

    +   - **Field 7** is the name of the file or directory.


    To display information about only a particular directory, use the `-d` option
    with the `ls -l` command. Directories are treated like ordinary files.


    # ## Permissions


    In this chapter, we will introduce the term *entry* when we discuss directory
    and subdirectory contents. Files, directories, linked files, block special files,
    character special files, symbolic links, named pipes, and sockets are all examples
    of entries. When a user creates an entry, he or she becomes the owner of that
    entry. Some people also use the term *object* to indicate an entry.


    The owner of an entry generally wants to control who will have access to or use
    of the entry. Each entry, once created, has attributes called permission bits
    that are used for access control. Because it is possible to change the nature
    of these permission bits (or permissions), a term that we will use interchangeably)
    on an entry, the owner has the power to make the entry either more secure or more
    widely available.'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# Table 6.2 Permission Bits


    | | ENTRY | OWNER | GROUP | OTHERS |

    |---|---|---|---|---|

    | | d | rwx | rwx | rwx |


    Table 6.2 illustrates a breakdown of permission bits available to each entry.

    The single character on the far left of the permission bit string identifies the
    type of entry, or object. The leftmost group of three permission bits—in other
    words, the three located next to the object identifier—refers to the permissions
    the owner of the entry has with respect to the entry. The middle three are the
    permissions that the group has for the entry (that is, the group to which the
    entry will belong). The rightmost three bits are the permissions held by other
    users who are not owners of the entry and who are also not in the group to which
    the entry belongs.


    For both files and directories, r is the permission to read; w is the permission
    to write; and x is the permission to execute. Although the names of these permissions
    are identical for files and directories, the permissions themselves mean different
    things. You might ask, “What do we mean by that?”


    When viewing or establishing the permissions for an ordinary file,


    +   - r permits the viewing of file contents.

    +   - w permits the changing and storing of file contents.

    +   - x permits the execution of the file (r is also needed).


    But for a directory,


    +   - r permits the viewing of files in the directory.

    +   - w permits the creation and removal of files in the directory (x is also
    needed).

    +   - x permits a user to be in the directory (that is, to cd to a directory and
    to access files from the directory).


    The x permission is required to access any files or subdirectories within a directory.
    In other words, the x permission is required on all directories above the specific
    directory, as well.


    To remove a file from a directory, you need only w and x permissions for the directory.
    You do not necessarily need permissions on the file itself.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# Changing Permissions: The chmod Command


    You use the chmod (change permission mode) command along with symbolic notation
    or numeric notation to specify changes to the existing permissions for a file
    or directory. How do you perform this task? The answer is, by adding or deleting
    permissions.


    # Symbolic Notation


    Symbolic notation requires you to know the existing permissions prior to specifying
    new permissions. Then, when you specify the new permissions, the specification
    is made with respect to the existing permissions. The syntax for changing permissions
    using symbolic notation with the chmod command is as follows:


    ```

    $ chmod symbolmode filename<Enter>

    ```


    Table 6.3 summarizes the symbolmode parameters. You can specify multiple symbolic
    modes by separating them with commas. The opera-


    Table 6.3 Symbolic Parameters

    | SYMBOLMODE | DEFINITION |

    | :--- | :--- |

    | u | Owner of the file |

    | g | Owner''s group |

    | o | Other users on the system |

    | a | Owner, group, and others |

    | + | Add the permission |

    | - | Remove the permission |

    | = | Clear the existing permission mode, then set to the mode specified |

    | r | Read permission |

    | w | Write permission |

    | x | Execute permission |'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# 162    Installing and Administering Linux 2E


    tions are performed in the order in which they appear (in other words, from left
    to right). Example 6.2, which deals with the use of symbolic parameters to change
    permission modes, will illustrate what we mean.


    When you use the symbolic mode to specify permissions, the first set of parameters
    you specify set the permission field, as follows:


    +   * u file owner (when discussing permissions, owner permissions are often referred
    to as user)

    +   * g group

    +   * o all others

    +   * a owner, group, and all others


    Using `a` is the same as specifying the `ugo` option. The `a` option is the default
    permission field. That is, if you omit the permission field, Linux defaults to
    the `a` option.


    The second set of flags determines whether permissions are to be added, taken
    away, or set as specified:


    +   * `+` adds the specified permissions.

    +   * `-` removes the specified permissions.

    +   * `=` clears the selected permission field and sets it to whatever follows
    on the command line. If you do not specify a permission mode following the `=`,
    then Linux will remove all permissions from the selected field.


    The third set of parameters determines the permission as shown here:


    +   * r read permission

    +   * w write permission

    +   * x execute permission for files; search permission for directories


    To change permissions, you should first issue the `ls -1` command to check the
    current permission settings (that is, the current file mode). Then, you use the
    `chmod` command to specify the symbolic modes. Finally, it is a good idea to check
    these new permissions by issuing the `ls -1` command again. This procedure is
    followed in Example 6.2.


    > **NOTE** With symbolic and numeric notation, you do not separate entries with
    spaces. This situation is contrary to your experience with entering commands thus
    far.'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# Example 6.2 chmod and Symbolic Notation


    Back sometime prior to Chapter 4, “Titles and Directories in Linux,” Sancho, at
    Don Quixote’s request, had created a file called manuals (which includes a list
    of mandatory reading materials for those who wish to become chivalrous knights)
    and filed it in Don Quixote’s home directory /home/quixoted. Later, in Example
    5.2, Sancho linked to the same file but referred to it as knightsdata in his home
    directory, /home/panzasan.


    But we had not yet explained how Sancho was able to create a file and store it
    in Don Quixote’s home directory at the beginning. Sancho would not ordinarily
    have had access to Don Quixote’s home directory.


    To allow Sancho to save a file in Don Quixote’s home directory, /home/quixoted,
    Don Quixote would have had to change the permissions on that directory. Here is
    how he did it:


    ```

    $ pwd<Enter>

    /home/quixoted

    $ cd ..<Enter>

    $ pwd<Enter>

    /home

    $ ls -l quixoted<Enter>

    drw x - - - - - 5 quixoted knights1 4096 Mar 07 08:11 quixoted

    $ chmod g+rxw quixoted<Enter>

    $ ls -l quixoted<Enter>

    drwxrw - - - - 5 quixoted knights1 4096 Jul 10 08:11 quixoted

    ```


    We can see that Don Quixote first checked the directory he was in and found that
    it was his home directory. He knows that he cannot change the status of the directory
    if he is in it, so he changed to the directory /home and verified that he was
    there. Then, he checked the original permissions on the /home/quixoted directory.
    At that point, he changed the group permissions to allow anyone in knights1 to
    have read, write, and execute permissions on /home/quixoted (because he was already
    in /home, he only needed to specify the relative pathname quixoted). Then, he
    checked the status of /home/quixoted again and found that he was successful. Now,
    anyone in the group knights1 could save a file in his home directory.


    # Numeric Notation


    The syntax for using the chmod command with numeric notation is similar to that
    used with symbolic notation:'
  merge: -1
  img_proc: true
- pgno: 187
  md: '```

    $ chmod numeric filename<Enter>

    ```


    With numeric (also called octal) notation, you specify absolute file or directory
    permissions. You do not need to know the existing values beforehand. This situation
    contrasts with symbolic notation, which requires you to know the existing permissions
    before adding, subtracting, or redefining new permissions with respect to the
    existing permissions.


    A scenario might help to explain the numeric notation concept. As we go through
    it, please refer to Figure 6.1.


    Let’s say that you have created a file called *newfile* and you want the owner
    and the group to be able to read and write to it, but you only want it to be readable
    by all other system users.


    First, to enable the owner to read and write to the file, you add the *x* and
    *w* permissions to the three leftmost permission bits (in other words, the owner’s
    permission bits).


    Each permission you set within the nine permission bits is represented by a binary
    value 1. Each lack of a permission is represented by a 0. For example, rw-r--r--  translates
    to 110100100 in binary.


    Use Figure 6.1 to translate the binary notation to numeric (octal). In Figure
    6.1, we see that the owner’s *r* and *w* permission bits would have values of
    400 and 200, respectively. Second, to set the same permissions for the group,
    you add 40 (*r*) and 20 (*w*). Finally, to set the read permission for all other
    system users, you add 4 (*r*). The numeric result comes from simple addition:
    400 + 200 + 40 + 20 + 4 = 664


    So, to translate the permission mode from a symbolic (alphabetical) form to a
    numeric form, you add the numbers that correspond to the individual permissions
    required and then specify that number as an argument to the chmod command.


    ![](img/cae5c706c216875d12d4b7d28144cc71_187_0.png)'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'The chmod command is then


    ```

    $ chmod 664 newfile<Enter>

    ```


    At first glance, the numeric format seems easier than the symbolic format. There
    is, however, some additional permissions that cannot be unset by using numeric
    notation. For example, you cannot remove the SETGID attribute on a directory by
    using numeric notation. You would have to explicitly remove the permission using
    symbolic notation. If you want to know more about SETGID and similar permissions,
    please check other information sources. Those topics are unfortunately beyond
    the scope of this introductory-level book.


    Meanwhile, specifying permissions with numeric notation can occasionally result
    in safety messages. For example, suppose that you are the owner of a file and
    have no permissions on the file, but you try to remove it. The Linux system will
    then ask whether you want to override the protection setting on the file you want
    to remove. If you respond yes, Linux removes the file. The same would happen if
    you were a member of the group.


    Table 6.4 summarizes the relationships between the symbolic notation and its binary
    notation and numeric notation counterparts. Use that table as you follow along
    with Example 6.3.


    # Example 6.3 chmod and Numeric Notation


    In Example 6.2, Don Quixote changed the permissions on his home directory by using
    chmod with symbolic notation. How would he have done it with numeric notation
    instead? Here is how:


    ```

    $ pwd<Enter>

    /home/quixote

    $ cd ..<Enter>

    $ pwd<Enter>

    /home

    $ ls -1 quixote<Enter>

    ```


    **Table 6.4 Numeric Parameters versus Other Notations**


    | NOTATION | OWNER | GROUP | OTHERS |

    | :------- | :---- | :---- | :----- |

    | symbolic | rwx | rw- | r-- |

    | binary | 111 | 110 | 100 |

    | numeric/octal | 7 (4 + 2 + 1) | 6 (4 + 2 + 0) | 4 (4 + 0 + 0) |'
  merge: -1
  img_proc: true
