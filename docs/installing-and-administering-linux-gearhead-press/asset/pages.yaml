    # # Basic X Window Components


    The concepts introduced in this section should be easily grasped, especially since
    almost all of us have used a graphical user interface (GUI) before. However, even
    though the discussion may seem almost trivial to some, the terms and concepts
    as defined here are worth remembering. They are common to all GUIs, and provide
