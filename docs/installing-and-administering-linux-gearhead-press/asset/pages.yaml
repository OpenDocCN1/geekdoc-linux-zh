    # ## Suspending and Resuming a Foreground Task


    Ctrl-Z is used to suspend, not terminate, a foreground process. No CPU resources
    are used for the suspended process, although it is still a process—it still occupies
    system memory and is subject to swapping to the hard disk. In other words, the
    suspended process’s data, functions, scripts, and so on remain mapped in RAM until
    higher-priority processes are invoked that will occupy the same RAM space. If
    that happens, that will cause the suspended process’s attributes to be saved in
    the swap space on the hard disk until the suspended process is resumed or terminated.
    You can tell the job to continue as needed in the foreground or background.


    On some older ASCII-Z terminals, Ctrl-Z might not be capable of suspending a foreground
    task. If that is the case, try entering the following to force the shell to use
    the key sequence to suspend processes:'
