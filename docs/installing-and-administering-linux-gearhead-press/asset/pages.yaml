    # Printing with lpr


    To queue a file for printing, ordinary users use the `lpr` command. The root user
    and superusers have additional printing commands at their disposal.

    To send a print job to the default printer, here is the syntax:


    ```

    $ lpr filename1 filename2 ...<Enter>

    ```


    To specify a printer other than the default printer, where `lp1` is the name of
    the alternate printer, you enter the following:


    ```

    $ lpr -P lp1 filename<Enter>

    ```


    The `lpr` process sends a copy of the file to the `/var/spool` directory, where
    the copy sits for however much time it takes for a free line-printing daemon,
    called `lpd`, to discover and print it. For a short queue, the timing is almost
    instantaneous; the print job seems to go straight to the printer.

    For large files, where copying them to the spool directory might cause memory
    congestion, you could create a just-in-time delivery-oriented, symbolic link between
    the spool directory and the file. When the print job is to be executed for the
    specified file name, the `lpd` daemon processes the link, which causes the file
    to be directly transferred in time for printing:


    ```

    $ lpr -s filename<Enter>

    ```'
  merge: -1
  img_proc: true
