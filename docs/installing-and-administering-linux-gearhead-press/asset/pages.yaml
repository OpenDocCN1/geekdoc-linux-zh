    # # Using Files in Linux


    In Chapter 4, “Files and Directories in Linux,” we defined files and directories
    and then navigated and manipulated directories. In this chapter, we will describe
    several more aspects of files and file manipulation, including naming files, copying
    files, moving files, and referencing a file by more than one name. We will also
    show you how to look at the contents of a file page by page, rather does as a
    fast-scrolling display on your screen. The chapter closes with that all-important
    file manipulation function: printing files.


    # ## Files and Directories: A Quick Review


    As stated in Chapter 4, a file is a collection of data or a stream of characters.
    A typical file can contain either text (which can displayed or printed) or code
    data (more commonly called a binary file, which can also be executable). In Linux,
    everything is represented as a file—even system devices. Linux does not impose
    any internal structure on the contents of a file, nor does it require the file
    to have any specific attributes. Only the application or tool is concerned with
    a file’s structure and contents.'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'Linux can recognize three major file types: ordinary files, directories, and
    special files. All information about a file, except its contents, is stored in
    the file''s inode (index node).


    Directories and subdirectories are designed so that we can store files in some
    type of logical order. Directories contain information that the system needs to
    access all types of files, but directories do not contain the actual data. A directory
    resembles a table of contents, listing filenames and subdirectories and their
    corresponding inode numbers. When users execute a command to access a file, they
    use the filename. The system consults the directory to match the filename with
    its corresponding inode number. It then accesses the inode table, which holds
    information about the file''s characteristics (including its location). Once it
    learns the file''s location, it can locate the data. Meanwhile, special files
    usually represent devices used by the system.


    # Linux Filename Guidelines


    The following are some guidelines and rules for creating filenames in Linux:


    **Describe the file’s content.** A filename should indicate what the file contains.
    Make sure you do not create confusion when putting similar but not identical files
    in different directories, however.


    **Use only alphanumeric characters and selected symbols.** You can use all letters
    in the alphabet as well as numerals in filenames. Letters can be uppercase, lowercase,
    or a combination. In addition, the following symbols can be used: number sign
    (#), at sign (@), underscore (_), plus sign (+), and hyphen (-).


    **Do not use embedded spaces.** Spaces should not be used within a filename because
    they might interfere with subsequent command execution, resulting in syntax errors.
    You are allowed to create a file with spaces if you enclose its name in single
    or double quotation marks (that is, "filename" or ''filename''). We strongly suggest
    that you do not this, however; think of the syntax you would have to use to execute
    commands on such filenames.


    **Do not use shell metacharacters.** The following characters are not allowed
    because of their use in command execution, system calls, and so forth: asterisk
    (*), question mark (?), greater-than and less-than signs (> or <), forward slash
    and backslash (/ and \), semicolon (;), ampersand (&), exclamation point (!),
    open and closed brackets ([ and ]), vertical pipe (|), single and double'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'quotation marks (`''` and `"`), and open or closed parentheses, `(` and `)`.
    If you inadvertently include one of these characters, the shell''s interpretation
    will be unreliable and inconsistent.


    **Do not begin with a plus sign or a hyphen.** You can use the plus sign (`+`)
    and hyphen (`-`) within a filename, but do not use them to begin the filename.


    **Do not use command names.** You should not name a file using a command name
    unless you are creating an executable program file. The inadvertent use of a command
    might wreak havoc in a file system.


    Other filename characteristics you should keep in mind are as follows:


    **Filenames are case sensitive.** Although potentially confusing, this requirement
    can result in increased flexibility.


    **Filenames have a maximum length of 255 characters.** Unlike some UNIX-based
    systems, Linux does not restrict filenames to 14 characters. We recommend, however,
    that you keep filenames to a reasonable length, such as 16 characters. Bear in
    mind that some applications work with only 8-dot-3 filenames (that is, `xxxxxxxx.xx`,
    or eight-character filenames and three-character extensions), such as DOS filenames.
    To ensure compatibility with other environments—if that is a concern—consider
    restricting filename length and format. Some applications append their own extensions
    or suffixes (such as `.tmp` or `.sam`) to denote a specific file type, so your
    filename conventions might have to accommodate this practice.


    **If the filename begins with a dot (`.`), the filename will be hidden from the
    standard `ls` commands.** Linux/UNIX allows dots as legitimate filename characters
    as long as they are wholly contained within the filename. The system does not
    presume anything about the file based on the location of the dot.


    **Some applications that run on Linux/UNIX, however, do not recognize the dot
    as part of the filename.** Therefore, they might react unpredictably when faced
    with such names.


    # ## Creating and Updating Files: The touch Command


    We generally know how to create files. We can use all sorts of applications (such
    as text processors, database applications, graphics applications, and'
