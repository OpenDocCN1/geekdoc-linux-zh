  md: '# # Invoking Foreground and Background Processes


    Typically—and so far in this book—you invoke processes interactively from the
    command line. You can also invoke processes from the foreground and background
    states, however.


    Processes that are started and require interaction from the terminal are called
    *foreground processes*. They are invoked in the foreground when you are fairly
    sure that they will finish in a short time or when you have to interact with them
    before and during execution. The processes themselves take over the terminal while
    they run. As we have seen before, the syntax for a foreground process is


    ```

    $ command [-] options arguments<&Enter>

    ```


    Processes that run independently from the initiating terminal are called *background
    processes*. You run processes in the background when, for example, you want to
    use your terminal for other tasks. But they are most useful for executing commands
    (or scripts or batch files containing numerous commands) that will take a long
    time to run, regardless of whether or not you are using your terminal. The syntax
    for a background process, then, is


    ```

    $ command [-] options arguments / > backfile &<Enter>

    ```


    > **NOTE** A process can be run in the background only if it does not require
    keyboard input and only if you observe the invocation syntax—the ampersand (&)
    at the end of the command line.


    # # Terminating Processes


    You might want to terminate a foreground or background process for several reasons:


    +   - You no longer need the program or process, and there is no other way to
    stop it.

    +   - You are not getting the results you expected.

    +   - You are not getting any results and your system seems “frozen.”'
  merge: -1
  img_proc: true
- pgno: 399
  md: '+   ■ Conversely, your output facilities (screen or printer) are overwhelmed
    by program or process output.


    +   ■ The process or program is using too many system or network resources (such
    as memory, CPU usage, or bandwidth usage).


    +   ■ The process or program is not behaving properly or predictably.


    The first reason likely affects an advanced user or system administrator who might
    have altered the configuration of one or more systems and now finds that daemons
    or other background processes are no longer relevant to the system. The other
    reasons are pretty much self-explanatory.


    # ### Termination Methods


    Foreground processes run on the user’s terminal and can usually be terminated
    by some type of quit signal. The three most common methods are as follows:


    +   ■ The Ctrl-C key sequence


    +   ■ The *kill* command


    +   ■ Powering the system down


    The Ctrl-C key sequence is the most common method. It stops a foreground process
    and returns you to a shell prompt, generally a dollar sign ($) for users or a
    pound sign (#) for the administrator, root, and superuser. But remember that Ctrl-C
    does not work with man; use q or Ctrl-Z instead. Also, some shell scripts or other
    programs might ignore the quit signal.


    In some cases where the processes ignore the common quit signals, you might have
    to enter the *kill* command, which we discuss in detail in the next section. You
    always have to use *kill* to terminate background processes.


    Powering down a local system is a reasonably sure way of terminating foreground
    or background processes running on the system. You should always be concerned
    with the effects that suddenly powering down might have on individual files or
    programs, file systems, other system features or processes, and even other users,
    however. So powering down should be a last resort alternative.


    # #### The kill Command


    An ordinary user has the ability to kill any process that he or she has initiated.
    By comparison, a root user can kill *any* process. The syntax is'
