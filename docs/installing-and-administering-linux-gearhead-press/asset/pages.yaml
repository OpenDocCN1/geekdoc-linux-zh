- pgno: 208
  md: '(command) program in its various locations, it parses the command line. In
    other words, the shell effectively examines the command line in the following
    order:


    +   1. Redirection (`<`, `>`, `>>`, `|`, `>`, `2>`, `2>>`)

    +   2. Variable and command substitution

    +   3. Wildcard expansion (`*`, `?`, `[ ]`)


    After the shell has examined the command in the preceding order, it submits the
    command to the operating system to be executed.


    # Metacharacters and Wildcards


    Metacharacters are characters that have a special meaning to the shell, although
    that meaning can vary from one shell to another. For that reason, you should never
    use them as part of a filename. An exception is the hyphen (-), which you can
    use as long as it is not the first character in the filename.


    The following is a list of metacharacters:


    +   `- . ! # $ % * + ^ & ; ( ) { } [ ] | \ ; '' " > < ? /`


    Wildcards are a subset of metacharacters. They are used for a process called pattern-matching
    notation for files, or pattern matching for short. That means that Linux shells,
    like those of all UNIX operating systems, can reference more than one filename
    by using these symbols. Here are some examples of wildcards:


    +   `*   ?   [ ]`


    # The Asterisk (*) as a Wildcard


    For certain commands, you can include one or more asterisks (*) with a character
    or string of characters in a filename specification. The inclusion of the asterisk
    causes the shell—not the operating system—to initiate a type of pattern-matching
    process called wildcard expansion. The wildcard expansion process substitutes
    all possible filenames that meet the parameters specified by the characters included
    before or after the asterisk in the command sequence. The shell substitutes filenames
    containing zero to any number of additional characters as long as the specified
    character or string also appears.'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'Table 7.2 lists some examples with explanations of common types of asterisk
    wildcard expansion.


    Example 7.4 provides a couple of illustrations of normal asterisk wildcard expansion.


    The exception to wildcard expansion is that there will *not* be a match to any
    files that begin with a single dot; that is, to any hidden files. Why not? The
    answer is, mostly for security reasons. Those files are intentionally hidden from
    prying eyes and fingers. They should not be exposed or even jeopardized by being
    included (perhaps innocently and inadvertently) to processes invoked by wildcard
    expansion, which introduces a certain lapse of user or administrator control.
    Also, if single-dot matches were allowed, the directories called `"."` and `".."`
    (that is, the current and parent directories, respectively) would also be fair
    game to whatever processes would be invoked. That could be very dangerous with
    certain commands (for example, rm).


    Example 7.5 provides an example of the exception.


    Now, wouldn''t you know it—there are exceptions to the exceptions here. A match
    will be made to a single dot string if the single dot is included as part of the
    search string.


    Example 7.6 provides an example to the “exception to the exception.”


    These principles are easier to grasp through examples. Let’s look at Examples
    7.4, 7.5, and 7.6. But first, those examples will be more meaningful if you take
    the time beforehand to create the following files with a text editor such as vi
