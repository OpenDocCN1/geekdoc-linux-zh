- pgno: 547
  md: "# An indispensable working resource for IT professionals  \nLinux-based network\
    \ systems\n\nMore and more companies are now using Linux as their server operating\
    \ system of choice. That’s because the costs are lower, there’s a greater amount\
    \ of flexibility, and the code is much more reliable. As a result, there is a\
    \ bigger demand for IT professionals who are able to install and administer Linux\
    \ for everything from networking a department to connecting servers for a Web\
    \ site. This comprehensive guide offers a detailed look at everything you need\
    \ to know about working with this open source operating system. It bridges the\
    \ gap between your prior experience on Windows NT/2000, NetWare, and Unix-based\
    \ networks and Linux. In this new edition, Linda and Al McKinnon take you step\
    \ by step through the process of installing and administering the latest version\
    \ of the Linux 2.4 kernel, as well as all previous versions and distributions.\n\
    \nIn addition to providing detailed installation instructions, this fast-paced\
    \ guide shows you how to:\n\n+   - Create users and passwords\n+   - Manage files\
    \ and directories\n+   - Customize the environment\n+   - Make the most of Linux\
    \ shells and utilities\n+   - Use the vi editor\n\nLINDA McKINNON has more than\
    \ ten years’ experience working with large organizations to develop Requests for\
    \ Proposals for government projects, architect networks, and implement systems-integration\
    \ projects. She teaches courses in SP2/AX and WebSphere Commerce for IBM worldwide.\n\
    \nAL McKINNON is a professional engineer who regularly assists clients with network\
    \ auditing, optimization and troubleshooting, distributed access and systems management,\
    \ and systems migration. He teaches courses on network operating system administration\
    \ and e-commerce, is a technical author and editor of system administration, network\
    \ security, programming language, and other computer education and related materials\
    \ for IBM and other clients worldwide.\n\n> About Gearhead Press\n> \n> Responding\
    \ to the ongoing demands of IT professionals for current and reliable information\
    \ on the latest programming technologies, Wiley Computer Publishing introduces\
    \ the Gearhead Press titles.\n> \n> These books, written by accomplished trainers\
    \ in their respective fields, focus on using real-world case studies to give readers\
    \ the best information on leading topics.\n> \n> The Gearhead Press titles will\
    \ be characterized by two different imprints: In the Trenches and Point to Point.\
    \ The In the Trenches titles are fast-paced books written by fellow IT professionals\
    \ who have been there and done it. They will introduce readers to the new technology\
    \ and guide them to a high level of proficiency. The Point to Point titles invite\
    \ readers to join an IT team at a model company and implement the technology in\
    \ a real-world environment—complete with positives and negatives.\n\nVisit our\
    \ Web site at www.wiley.com/compbooks/\n\nISBN 0-471-20884-1\n54499\n\n![](img/cae5c706c216875d12d4b7d28144cc71_547_0.png)\n\
    \n![](img/cae5c706c216875d12d4b7d28144cc71_547_1.png)\n\n![](img/cae5c706c216875d12d4b7d28144cc71_547_2.png)"
  merge: -1
  img_proc: true
