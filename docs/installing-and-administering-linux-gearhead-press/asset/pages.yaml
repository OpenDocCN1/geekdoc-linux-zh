    ```

    :g/searchstring /s//replacementstring /g<Enter>

    ```


    The command works as follows:


    +   - The first g (global) tells the editor to perform a search for the first
    occurrence of the text string in every line of the file.

    +   - The two forward slashes bracket the search string. Please note that in this
    case, with /searchstring / , the characters are followed by a space. If the search
    string is found ending a line or immediately followed by punctuation, it is not
    replaced.

    +   - The s means substitution.

    +   - The forward slash following the s tells the editor to use the text string
    preceding the s as the target for the substitution (that is, the preceding text
    string will be the one replaced).

    +   - The next two forward slashes bracket the text string to be substituted for
    the replaced text string (in this case, /replacementstring / ; again, the characters
    are followed by a space).

    +   - The last g tells the editor to make the substitution at every occurrence
    in each line found by the first g.


    An extra feature we could have added to the syntax example is a c before the last
    g (that is, /cg) . The c tells the editor to ask for confirmation before making
    each change.


    Another of many ways you could modify the command is to make changes to only one
    line or to the first occurrence on every relevant line.'
