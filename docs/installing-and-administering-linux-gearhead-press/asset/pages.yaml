  md: 'Table 10.2 Key Sequences for Deleting Text in vi

    | KEY SEQUENCE | DELETE ACTION APPLIED |

    |x|To a single character|

    |dw|To the end of the current word|

    |d$|To the end of the line|

    |d0|To the start of the line|

