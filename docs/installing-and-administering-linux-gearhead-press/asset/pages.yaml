  md: 'A file system test


    A magic number test (`file` itself will use the `/usr/share/magic` file to look
    for a specific number in the candidate file that would tell Linux/UNIX whether
    the file is executable)


    A language test (if the file is determined to be a text file)


    Here is `file`''s syntax:


    ```

    $ file [options] /path/filename<Enter>

    ```


    The output from `file` is usually a message saying that the candidate file is
    some variation of "text," "data," or "executable" unless it cannot find the candidate
    file. If it cannot find the file, `file` returns an error message. Here is an
    example of such a message when we tried to determine a file type for a nonexistent
    file that we named, appropriately, *nonexistentfile*:


    ```

    $ file nonexistentfile<Enter>

    Nonexistentfile: can''t stat `nonexistentfile'' (No such file or directory)

    ```


    Why is `file` beneficial? It can give you a quick indication of whether a file
    is the type of file that you can more easily display on your terminal screen or
    send to a printer. Or, it can tell you that a file is an executable file. Without
    it, attempting to display an executable file on your screen could cause confusion
    or even hang up your terminal. For binary files, `file` can even provide an indication
    of the operating system and the version used to compile the file.


    The `file` command has its own set of options. Check your information sources.
    In Example 9.9, we will see a simple directory search. In Example 9.10, we will
    see the -f option, which tells `file` to determine file types for a list of filenames
    found in another file specified immediately after the -f. In Example 9.10, that
    specified file--the one with the list of filenames inside it--is called *listoffiles*.
    Note that when specifying a filename as an argument to the `file` command, you
    should ensure that each filename appears separately on a single line in that argument
    file.


