- pgno: 441
  md: '![](img/cae5c706c216875d12d4b7d28144cc71_441_0.png)


    X Window System functions are split into terminal and application support. Typically,
    the application support runs on a Linux/UNIX system. The terminal support can
    run on the same Linux/UNIX system, on a remote Linux/UNIX system, or even on a
    non-Linux/UNIX system. An example of the last two systems is one that might have
    a slow CPU of its own or might have no hard disk drive. The client applications
    would run on a remote, fast central server while only the terminal-supporting
    X Window server would run on the underpowered terminal. For this reason, we refer
    to the X Window System as a networking window system. Any connections between
    the client and the server are TCP/IP protocol-based connections.


    # **Different Client/Server Environment Concepts**


    For those who do not customarily operate in UNIX X environments, the concepts
    of client and server are generally understood to be the following:'
  merge: -1
  img_proc: true
- pgno: 442
  md: '+   - A server is a system that provides resources such as applications, hard
    drive storage, modems, printers, and so on to other systems across one or more
    networks.


    +   - A client is a system that uses those resources, accessing them across one
    or more networks. In the Linux/UNIX environment, however, the client and server
    concepts are different.


    In the world of the Linux/UNIX X Window system, however, a client is defined as
    a device-independent program that runs on your local machine or on a remote machine
    and requires input from the user and the capability to display or otherwise provide
    output to the user. In other words, the client is the system or machine providing
    the application support.


    Common applications, such as xcalc and xclock as well as the more complicated
    database or simulation applications, are clients to a Linux/UNIX X system.


    On the other hand, a server is a device-dependent program that runs on your local
    machine and controls the input devices (for example, keyboard and mouse) as well
    as the terminal display and other output devices. We say that the server is the
    system or machine providing the terminal support. In many cases—especially in
    a small network or home environment—the client and the server run on the same
    system. Even so, they still communicate with each other by using the TCP/IP protocol.


    # X Client Features


    A user interacts with X clients when he or she interacts with applications (such
    as xclock, xcalc, and xterm) that might be running on either a local machine or
    on a remote machine. The applications themselves are the X clients that are invoked
    and run by the users in an X window system.


    X clients can be started from the command line by special startup files or from
    other X clients. For example, you can start window managers manually or invoke
    them automatically when your machine boots up. To access remote machines, you
    might need special applications invoked on a local machine (for example, WRQ Inc.''s
    product, ReflectionX/E, enables Windows machines to access UNIX machines. Their
    Web site, if you are interested, is www.wrq.com.


    Most X clients share the same or similar options, such as foreground color, background
    color, display name, fonts, and window geometry. For example, invoke xterm ? on
    the command line. Examine the specifications and options. Then, invoke xclock
    ? and compare those specifications.'
  merge: -1
  img_proc: true
