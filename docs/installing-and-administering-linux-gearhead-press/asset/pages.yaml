  md: 'Suppose that you download the `mtools-3.9.8-2.i386.rpm` file from among the
    several formats and versions available. The latest full version of mtools, version
    3.9.8, was released in late May 2001. Once you have downloaded that version, you
    can then install it with those versions of Linux that use `rpms`, for example,
    by entering


    ```

    # rpm -U mtools-3.9.8-2.i386.rpm<Enter>

    ```


    If you use another version, simply follow the instructions for obtaining and loading
    alternate versions (found by following the FAQ links at the HTTP Web sites).


    # Basic mtools Features


    The mtools commands are usually identical to DOS commands with the following difference:
    exception of the addition of an m prefix. The mtools commands follow the DOS convention
    of referring to DOS file systems as drives. For example, the first floppy drive
    is called the A: drive, and the first hard disk drive is customarily called the
    C: drive. DOS can even refer to a drive by more than one (letter) designation,
    or in the case of multiple floppy drives, using one drive letter to refer to both
    drives (in a predetermined search order). Furthermore, DOS filenames are generally
    preceded by the drive letter and a colon. UNIX file names do not have such prefixes.


    If you are accessing only the floppy drives, mtools enables you to do so without
    mounting and unmounting their respective file systems, and you usually do not
    have to modify the /usr/local/etc/mtools.conf file. You must ensure that this
    file is properly configured, however, if you will be accessing DOS hard disk partitions
    and DOS emulation image files.


    If you find it necessary to use pattern matching, remember that the mtools utilities
    use Linux/UNIX syntax and conventions (for example, use `*` as a wildcard instead
    of DOS''s `*.*`). Also, to add options to commands, use a hyphen (-) instead of
    DOS''s slash (/).


    # mtools Commands


    The mtools utilities have an extensive man page, and a great deal of information
    is also available on the Internet sites listed previously.


    We present only a sampling of the commands available in mtools. These commands
    resemble those used frequently by DOS users and DOS'
