    # **Example 7.16 Defining a File Descriptor**


    If Sancho wanted to define descriptor 3, say, to output to a specific file in
    his home directory, then he might use a syntax like the following:


    ```

    $ exes 3> /home/username/Sancho.output.file<Enter>

    ```


    Then, he could follow it up with a command such as:


    ```

    $ date >63<Enter>

    ```


    or


    ```

    $ ls -11 >63<Enter>

    ```


