    # Command Grouping with Semicolons


    Contrary, perhaps, to the impression we have created so far, Linux/UNIX shells
    can cope with multiple commands on the same line. The semicolon ( ; ) is the metacharacter
    that facilitates the process. The syntax is as follows:

    $ command1 ; command2<Enter>

    Placing several commands on the same line, each separated from the next by a semicolon,
    produces the same result as entering each command on a separate line, as shown
    in Example 7.28. Relationships between the output of one process and the input
    to the next are not necessary.

    One reason you might consider using the semicolon in this way is because some
    commands (such as the ls -R command, which we will see in Example 7.29) might
    take a while to execute. Separating them with a semicolon allows the next command
    to execute without delay after the previous one has finished executing.


