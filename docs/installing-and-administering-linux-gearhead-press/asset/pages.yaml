    # Daemons: Never-Ending System Processes


    Daemons are constantly running processes that were not started by the user and
    are not associated with the terminal. They start when you start your system and
    run until you shut down your system.


    Daemons wait for a specific event to take place, such as the submission of a print
    job to a print queue. The printing daemon detects the event and then takes responsibility
    for the task, seeing that it gets processed. More specifically, Linux''s printing
    daemon, called lpod, tracks print job requests as well as the printers available
    to handle those requests. The daemon maintains queues (that is, spool directories)
    of outstanding requests and sends each request to the appropriate device at the
    proper time.


    In Linux, most of the filenames associated with daemons end with d and are found
    in configuration file directories (such as /usr/bin). You can usually view them
    by entering the following command:


    ```

    $ ps -guax<Enter>

    ```


    If you have a moment, take a look at them. You will see common daemons such as
    lpd, syslogd, inetd, and crond. System administrators typically maintain these
    directories and files.'
