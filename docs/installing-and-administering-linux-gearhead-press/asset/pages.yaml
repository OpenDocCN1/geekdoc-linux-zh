    $ head -5 ../admin/Feed<Enter>

    Filename: /home/gutiejua/admin/Feed

    Rozinante, Dapple -

    hay (incl. alfalfa, timothy, etc).8

    ```


    Now, again from her home directory, Juana will do a recursive listing, but starting
    from her `admin` subdirectory (in other words, seeming to jump over her `/home/gutiejua`
    directory), and will send the output to `head`:


    ```

    $ ls -R ../admin | head -7<Enter>

    ../admin:

    Feed

    Innfile

    phone


    ../admin/phone:

    RFI_Tell

    ```


    # ## The tail Command


    The `tail` command performs a bit differently than `head`. Its syntax is


    ```

    $ tail [-number of lines | +number of lines] [file(s)]<Enter>

    ```


    Note that you can specify a positive or negative number for the number of lines.
    (For other options, see your information sources.) The negative number tells `tail`
    to display text beginning at the nth line from the *end* of the file, so you get
    n lines of text. The first part of Example 8.19 illustrates this type of output.


    The positive number specification tells `tail` to display text beginning at the
    nth line from the *beginning* of the file and to continue from there. The second
    part of Example 8.19 illustrates this situation.


    One interesting option with the `tail` command is the -f option. With this option,
    `tail` continues reading additional lines from the input file as they become available.
    For example, suppose that Juana has an accounts-receivable file called `Repts_rec`
    that she knows will keep growing. She could monitor its growth by entering the
    following:


    ```

    $ tail -f Repts_rec<Enter>

    ```'
