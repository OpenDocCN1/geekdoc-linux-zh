    # Listing Directory Contents: The ls Command


    The `ls` (list contents) command displays the contents of one or more directories.
    This command has several useful options, some of which will be illustrated in
    action in Examples 4.8, 4.9, 4.10, and 4.11. First, though, here is the basic
