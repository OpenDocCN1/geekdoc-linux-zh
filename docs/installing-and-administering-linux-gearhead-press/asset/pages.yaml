  md: '# **Table 11.1 Selected Variables in the Global Profile File**


    | VARIABLE OR NUMBER | COMMAND NAME | DESCRIPTION |

    |:---:|:---:|:---:|

    | 1 | `PATH` | List of directories the shell will look through for commands |

    | 2 | `PS1` | Primary system prompt |

    | 3 | `ulimit` | Upper limit on system resources that a file or command can use
    |

    | 4 | `umask 002;` | Permissions on new files or directories for the root user
    |

    |  | `umask 022` | Permissions on new files or directories for the ordinary user
    |

    | 5 | `$USER` | Format of user’s name as it is applied to commands and scripts
    |

    | 6 | `LOGNAME` | Format of expected login name |

    | 7 | `MAIL` | Directory where the user’s mail messages are found |

    | 8 | `HOSTNAME` | Name of the computer |

    | 9 | `HISTSIZE` | Maximum number of previous commands displayed in response to
    the history command |


    The **MAIL** variable tells the shell where to look for mail messages for **USER**.
    The mail will be found in the directory whose name is the same as the **USER**
    within the `/var/spool/mail` directory.


    The **HOSTNAME** variable tells the shell where to find the name of the computer
    (in this case, `/bin/hostname`).


    The **HISTSIZE** variable sets the number of lines of command history (that is,
    the number of previous commands) that the shell will display when the user types
    `history`. This feature can be handy, as discussed previously, for retyping previous
    commands, doing sensitivity analyses around command arguments, or even troubleshooting.
    As seen in Example 11.7, the default is 1,000 commands!


    # **A Sample /etc/bashrc File**


    The `/etc/bashrc` file is another system initialization script invoked by **init**.
    It is the companion to `/etc/profile`, but where `/etc/profile` is intended to
    hold'
