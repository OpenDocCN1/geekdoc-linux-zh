  md: "![](img/cae5c706c216875d12d4b7d28144cc71_354_0.png)\n\n# Shell Variables and\
    \ the User Environment\n\nThis chapter describes many of the variables found in\
    \ both the terminal and the shell environments. Linux supports three types of\
    \ variables:\n\n+   - Terminal environment variables  \n+   - Built-in variables\
    \  \n+   - User-defined variables\n\nWe will also show you the two principal methods\
