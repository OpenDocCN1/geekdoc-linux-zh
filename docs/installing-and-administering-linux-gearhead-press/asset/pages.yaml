    # cat and Redirected Output


    Here is a handy, alternate use for output redirection. We know already that the
    `cat` command is normally used to list the contents of files. But if we combine
    `cat` and redirected output, we can create text files quickly without invoking
    a text editor. In fact, for small files, this procedure might be considered as
    good as, or even superior to, using a text editor. Here is the syntax, and we
    have included some lines of text:


    ```

    $ cat > newfile<Enter>

    Line 1 of newfile …<Enter>

    Line 2 of newfile …<Enter>

    After this line 3, we want to end the file …<Enter>

    <Ctrl>-d

    ```


    Note that we use Ctrl-D at the end of the file. Using Ctrl-C, on the other hand,
    would have canceled the command.

    Here are two more examples of this type of redirection:


    ■ This first example creates a zero-length file called *newfile*. If *newfile*
    already exists, this process removes the original contents of the file.


    ```

    $ cat > newfile<Enter>

    <Ctrl>-d

    ```


    ■ This second example creates a file called *file3*, which contains the combined
    contents of *file1* and *file2*.


    ```

    $ cat file1 file2 > file3<Enter>

    <Ctrl>-d

    ```'
