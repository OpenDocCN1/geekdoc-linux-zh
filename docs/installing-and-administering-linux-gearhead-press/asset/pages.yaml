    # Additional Tools: clear, echo, banner, and wc Commands


    From time to time, users and administrators have a need for additional tools to
    help them with routine duties. Here, we present four tools that are not related,
    are not revolutionary in scope or power, and are not needed every day. But they
    do help prevent confusion. Have a look at them, and for each one ask yourself:
    Has there ever been a time when I could have used this tool? Almost every time,
    you will likely answer "Yes."


    # The clear Command


    If your screen is full of confusing commands and responses, incoming messages,
    and the like, you might want to use the clear command. This command appears to
    execute simply and easily. What could be simpler than erasing a bunch of now unnecessary
    characters and leaving you with only a prompt and a clear terminal screen?


    There is more to clear than meets the eye, however. To determine how to clear
    the screen, the clear process first checks the TERM environment'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'specifications in RAM and then the */usr/share/lib/terminfo* directory, which
    contains the terminal definition files. If the TERM variable is not set or is
    set incorrectly, the command results in no action.


    # ## The echo Command


    The `echo` command makes the terminal reiterate what you have just typed, as shown
    in Example 3.16. This procedure seems trivial when simply entered interactively
    on the screen, but the command can be valuable when included in shell scripts
    or similar files (for example, batch files). For instance, the `echo` command
    is helpful when you are writing a script file and you want to be notified when
    certain instructions are executing.


    # **Example 3.17** *echo*


    Freston spends the first couple of hours a day fighting user fires. After that,
    he tries to dedicate some time to automating some of his administration functions.
    Here, he practices with `echo` prior to using it in a configuration script:


    ```

    $ echo Installing modem drivers now. . . <Enter>


    Installing modem drivers now. . .

    ```


    A few of the argument-like conventions that you can use with the `echo` command
    are \b to display a backspace character, \n to display a new-line (where the Enter
    key has been pressed) character, and \t to display a Tab character. See the online
    man pages or other information sources for an exhaustive list.


    # ## The banner Command


    The `banner` command displays ASCII character strings in large format on the screen
    or printed as hard copy. It constructs the characters out of # symbols and displays
    them from the top down (not from left to right). Like `echo`, this command might
    seem trivial when you play with it at your terminal, but it can prove invaluable
    in a large office or network environment when, for example, you want to identify
    individual print jobs from a shared printer. The syntax is as follows:


    ```

    $ banner [-wl] ascii_text<Enter>

    ```'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'Some versions of Linux will not have the proper $PATH specified to easily use
    banner. In that case, they might get a message to the effect of command not found.
    In such cases, specify the whole path to the banner command as such:


    ```

    $ /usr/games/banner [-w n] ascii_text<Enter>

    ```


    The -w option adjusts the width of the output. The -n option is the specified
    character width of the output you want. (Your screen width is normally 80.) You
    cannot specify a width without also using the w option. If you want to display
    more than one word, you must put quotation marks ( "" ) around the phrase. Otherwise,
    banner prints only the last word it was given, if anything at all. All these options
    are shown in Example 3.18.


    # **Example 3.18 banner**


    Without options, banner prints extremely large. So, to display "Hello!" large
    enough to see:


    ```

    $ banner -w40 Hello!<Enter>

    ```


    To print a phrase and give yourself the ability to scroll up and down through
    the output:


    ```

    $ banner -w40 "Hello Friends!" | less<Enter>

    ```


    To send the output to a file:


    ```

    $ banner -w40 "Print Job 1" > pjob1<Enter>

    ```


    If the file does not exist yet, it is created during this process.


    Perez the Curate wants to print a hard copy of an inspirational message that he
    will deliver at the El Boboso meeting. So that he can watch for it to be printed
    on the printer across the room, he uses banner to append a Print Job 1 label to
    the existing message file that he wants to print:


    ```

    $ banner -w40 "Print Job 1" >> peptalk<Enter>

