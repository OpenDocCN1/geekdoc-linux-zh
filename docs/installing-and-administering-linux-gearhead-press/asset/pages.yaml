    # Option 1: Invoking Scripts by Using the bash Command


    When a shell script like `script1` is invoked with bash, a bash subshell is invoked
    by the login -bash shell to execute the shell script file.


    That other bash subshell runs as a child to the parent login shell. When that
    subshell has finished executing the commands in the `script1` file, it terminates
    and control is passed back to the parent login -bash shell.


