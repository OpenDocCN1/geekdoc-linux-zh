  md: 'based ones\u2014because of their similarities. Soon, Linux will be incorporated
    into mobile, handheld computing devices.


    # Free Software


    Linux is free software, meaning that it is distributed under the terms of the
    GNU General Public License developed by Richard Stallman. (To read about this
    ex-MIT software developer and his "free software as in freedom of speech, not
    free beer" philosophy, we invite you to visit his Web site at www.gnu.org/philosophy/free-software-for-freedom.html.)
    This free software does **not** mean that the Linux kernel, other associated software,
    or entire distributions are the same kind of free as you associate with public
    domain. It is also not shareware. Basically, *free software* means that you can
    use the software for any purpose; study it to see how it is built and how it works;
    adapt and improve it; and redistribute it free or for a price. But you cannot
    restrict the software after you have redistributed it (that is, you must distribute
    it under the GNU GPL, too), and you must provide the source code just as it was
    supplied to you.


    Sometimes, you will see references to *open source software*. This software might
    be equivalent to free software or it might mean a free download with copyright
    restrictions. If you find yourself faced with this terminology, it is best to
    investigate further.


    # Mix and Match


    At least 40 full-feature Linux distributions are available in English, and more
    than 20 are available in other languages. There are also 35 special versions available
    for embedded systems, control systems, and so on (for further information, see
    Chapter 15, "Linux Documentation and Support"). Here, we define a *distribution*
    as an amalgamation of the Linux kernel with other associated software. The 60-odd
    distributions are not all the same. Each has a different focus and slightly different
    features aimed at a specific user audience (besides the obvious fact that the
    French editions, for example, are for a French audience). Each distribution has
    different perceived strengths and weaknesses.


    In addition, you do not have to use a shrink-wrapped distribution; instead, you
    can download the kernel of your choice. For example, instead of using a stable,
    tested kernel, you might want to live on the edge with a less-tested, potentially
    less-stable kernel. Or, you might want to combine a'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'certain kernel with different applications or other special features (such
    as RAID support or integration with a specific network) than would normally be
    found with a standard distribution.


    Linux enables you to mix and match, use an existing distribution, modify a distribution,
    or create your own distribution. You can purchase copyrighted software for Linux
    from software developers (new or established). Or, you can obtain software from
    the Free Software Foundation (www.gnu.org/fsf), which follows the GNU General
    Public License. Remember, GNU GPL software might not always be free (as in no
    cost), but it is always free as in source code and has no restrictions on the
    user, as described previously.


    # Hardware and Software Compatibility


    Linux runs on Intel-compatible PCs, Alpha computers from Digital Equipment Corporation,
    and Sun''s SPARC computers. Linux can also talk to proprietary databases from
    IBM, Oracle, Sybase, Informix, and Pick, and open source databases such as PostgreSQL
    and MySQL. A wide variety of office applications run on Linux (StarOffice and
    Corel WordPerfect, to name two). Several GUI interfaces are available in open
    source but are restricted, such as KDE, or free, such as GNOME. As mentioned,
    an introductory tour of the X Window System and some X Window manager applications
    appear in Chapter 14, “The Linux X Window System.”


    # Further Developments


    Today, there are more than 80 UNIXes, from AIX to XENIX. Many are undergoing continual
    development (such as Linux, SCO UNIX, FreeBSD, and AIX), while some have stagnated
    and are no longer supported (for example, Carnegie Mellon University’s Project
    Mach). Carnegie Mellon, however, still maintains a Mach Web site at www-2cs.cmu.edu/afs/cs.cmu.edu/project/mach/public/www/mach.html.


    According to a Gartner Group-Datquest survey conducted in the third quarter of
    1998, UNIX workstations accounted for 67.4 percent of the worldwide workstation
    market with respect to revenues. Shipments of UNIX increased 14.6 percent between
    the third quarter of 1997 and the third quarter of 1998, also in terms of revenues.
    In terms of units sold, UNIX workstations accounted for approximately half, indicating
    that UNIX systems dominate the middle to high-end markets. This situation is a
    much better position than one would believe based on impressions obtained from
    the mainstream media.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'Meanwhile, Linux has been gaining more friends everywhere. It has been endorsed
    by top industry vendors—IBM, Dell Computer, Oracle, Hewlett-Packard, SAP, and
    so on. According to Network World (www.nwfusion .com/power2000/power-strlinux/power-strlinux.html),
    "it was the second-most-shipped server operating system in 1999, behind Windows
    NT, with market shares of 24.6% vs. 38.1%, according to market research firm IDC.
    Linux out-shipped Novell NetWare and all combined Unix flavors, each of which
    had less than 20% market share. IDC predicts that Windows and Linux will continue
    to be No. 1 and 2, respectively, into 2004."


    All are drawn by Linux''s low cost, reliability, flexibility, and robust performance.
    Linux has also cracked specialty applications and the handheld market. More ISPs
    are moving to it, too. A purchaser for a large U.S. enterprise, however, stated
    that he will not recommend going to Linux. Why? Because it is free software, there
    is "no one to sue" if something goes wrong. Sheesh.'
