- pgno: 361
  md: '# ## Variable Substitution: Setting Variable Values with the Equals Sign


    There are two ways to use variable substitution. This first method is simple and
    straightforward and does not really rely on the “character substitution” aspect
    of variable substitution, which we will illustrate in the next section.


    When setting the values of variables, the commands differ depending on the shell
    you are using. To set a variable when you are in the *bash* or *pdksk* shell,
    use the equals sign with the name of the variable (existing or new) on the left
    side and the value you want to set for the variable on the right side:


    ```

    ```

    $ variablename=value<Enter>

    ```

    ```


    There are *no* spaces between the characters. To set a variable in the *tcsh*
    shell, on the other hand, use the `set` command:


    ```

    ```

    $ set variablename = value<Enter>

    ```

    ```


    In the *tcsh* case, spaces appear on both sides of the equals sign. See Example
    11.2 for setting variables in all three shells.


    **NOTE** The man page for each shell generally describes the syntax used to set
    their respective prompts. Do not forget—if you are in the *tcsh* shell and you
    want to export variables and their values to the terminal environment, you have
    to use `setenv` instead of `export`.


    # ### Example 11.3 Setting Variable Values with the Equals Sign (=)


    Both Don Quixote and Sancho find that the commands they type tend to require more
    than one line. But the secondary prompt (PS2) variable, the simple right angle
    bracket symbol, tends to confuse them occasionally and they make mistakes on the
    second line. Here is how they each change their respective secondary prompts.
    Because he works in the *bash* shell, the Don sets the PS2 variable as follows
    (similar to the *pdksk* shell):


    ```

    ```

    $ PS2="Please Continue ">"<Enter>

    ```

    ```'
