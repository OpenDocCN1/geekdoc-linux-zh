- pgno: 122
  md: '> **NOTE** Notice that this example contains two special files (one begins
    with a single dot; the other begins with a double dot). Both types were mentioned
    previously.


    In `/test1`, the dot ( . ) represents the current directory; in other words, it
    says "start in this directory and look for the file called `test1`." In the last
    example, `../dulcinea/pgms/suba`, the leading two dots represent the parent directory
    to the current directory—in effect, saying "go back up one level to the home directory,
    look in Lady Dulcinea''s home directory (`dulcinea`) for a directory called `pgms`,
    and then look there for a file called `suba`."


    When you are trying to find a file, particularly in a complex, multi-layered structure,
    the single dot ( . ) and the double dot ( . . ) special files can save time by
    eliminating the need to describe the location of the file in relation to the root
    directory. They can be helpful also when programming an application if you do
    not know the absolute tree structure where the application might eventually be
    installed, but you do have a good idea where files are with respect to one another
    or with respect to an executable.


    # ## Navigating the Directory Structure


    Now that we know something about how directories are structured in Linux/UNIX,
    let''s see how we can move around in the structure. Prior to knowing how to get
    around, though, it''s best to know where you are to begin with. So the first command
    we''ll show you is `pwd`. Then, to enable you to move around, we''ll introduce
    `cd`.


    # ### Locate the Working Directory Path: The `pwd` Command


    The `pwd` (print working directory) command is a Linux/UNIX command for finding
    out which directory you are in; that is, where you are in the directory tree.
    This command always returns the full or absolute path name of the current working
    directory, as shown in Example 4.2. Without `pwd`, you would have no way of knowing
    which directory you are in. (Such information can be added to the command prompt,
    which we will discuss later.)'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# Example 4.2 Determining the Current Directory with pwd


    Don Quixote is looking for a file he created a while back. The file is called
    *trio_ltr*, and it is a memo to Sancho, Nicholas, and Perez. He logs in and checks
    to ensure that the directory he is in is indeed his home directory:


    ```

    $ pwd<Enter>

    /home/quixoted

    ```


    # Navigating Directories: The cd Command


    The cd (change directory) command enables you to navigate the directory structure.
    As with any commands that operate on directories, you can specify the relative
    or full path name. With relative path names, however, you must be certain of the
    directory in which you are working. If you are not sure, use the pwd command.
    Here is the syntax:


    ```

    $ cd [directoryname]<Enter>

    ```


    Using the cd command with no arguments automatically returns you to your home
    directory—the directory you were automatically placed in when you logged into
    the system. This function can be very handy or very confusing.


    # Example 4.3 Navigating Directories with cd


    The Don is still searching for *trio_ltr*. He thinks he might have left it in
    his doc directory. So, he decides to navigate from his (current) home directory,
    /home/quixoted, to the /home/quixoted/doc directory. Here is how he performs this
    task the easy way from where he is, using only the relative path name:


    ```

    $ cd admin<Enter>

    ```


    To do it the more complex way, using the full path name, he could have entered


    ```

    $ cd /home/quixoted/doc<Enter>

    ```


    Now, from his doc directory, to go back to his home directory all he needs to
    do is enter'
  merge: -1
  img_proc: true
- pgno: 124
  md: '```

    $ cd<Enter>

    ```


    In fact, no matter where he is, if he wants to go back to his home directory he
    only needs to enter that command.


    Also, no matter where he is, if he wants to navigate up one level to the parent
    directory of his current working directory, he only needs to enter


    ```

    $ cd ..<Enter>

    ```


