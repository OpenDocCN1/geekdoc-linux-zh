    > **NOTE** Another way to kill a process is `kill $jobnumber`. This method is
    discussed later in this chapter.


    If your terminal hangs up, locks, or freezes (all these names describe the same
    affliction) and `Ctrl-C` does not work, you might have to log in to a different
    terminal (or to a different virtual terminal). From there, you might use the `kill`
    command on the login shell of the hung-up terminal. This feature is just one advantage
    of UNIX operating systems over that popular GUI-related operating system we all
    know.'
