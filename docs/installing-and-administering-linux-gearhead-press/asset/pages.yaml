    As we stated previously (and as can be seen in the `kill -1` listing), these signals
    are used to communicate a change of state to running commands. Depending on the
    signal used, the change of state ranges from an orderly stop to an immediate stop
    to a stop with the dumping of information to a file for debugging or even to a
    rereading of parameters.


    Let’s discuss the signals tabulated here in a little more detail. First, the hang-up
    signal (that is, 1, SIGHUP, or HUP) is sent to a process if its parent process
    is terminated. For example, when you log out—that is, when you terminate the login
    shell—a hang-up signal is sent to any running background processes.


    The interrupt signal (that is, 2, SIGINT, or INT) is sent when a user presses
    the interrupt key sequence, Ctrl-C. A process running in the foreground stops
    unless its program is set to ignore interrupts. Then, a more'
