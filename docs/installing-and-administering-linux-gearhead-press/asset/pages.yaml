    a drop-down menu containing several commands. You can move the pointer down the
    menu and select the operations of your choice.


    # Icons


    You probably already know about the benefits of icons on your desktop. They are
    a handy way of multitasking without repeatedly having to invoke applications,
    and they are a handy way to manage your root window (that is, *desktop*) space.
    When an application window has been changed to an *icon*, the process remains
    invoked and ready, but the screen clutter is reduced.


    You can create an icon from an active application in two ways. One is by left-clicking
    the window operations button in the top-left corner of the application window
    and then scrolling down the resulting drop-down menu to select the minimize (or
    *hide/restore* or similar instruction) option. The benefit of using this method
    stems mainly from having a choice of options presented to you. The result is the
    same as the second and simpler method, namely left-clicking the minimize button
    on the window frame.


    Depending on the window manager used, the resulting icons for identical applications
    might be different in appearance. For example, minimizing the calculator window
    in `fwm95` results in an icon that looks like a button bar. Minimizing the same
    window in `lesstif` results in an icon'
