  md: '# ## Listing the Values of Individual Variables: The echo Command


    If you want to check to see what a variable is set to, simply enter the `echo`
    command followed by a dollar sign and the name of the variable, as such:


    ```

    $ echo $variablename<Enter>

    ```


    Note that you add a space between the *echo* command and the dollar sign but not
    between the dollar sign and the name of the variable being referenced.


    # **Example 11.2 Using echo $ to Check Variable Settings**


    Sancho works in the `tcsh` shell. He asks Don Quixote, who he knows works in the
    `bash` shell, whether the Don''s path variable contains `/usr/games`. The Don
    enters


    ```

    $ echo $PATH<Enter>

    /usr/local/bin/:bin:/usr/bin:/usr/X11R6/bin:/home/quixote/bin

    ```


    Both realize that */usr/games* is not specified in either of their PATHS.


    # ## Setting Shell Variables


    User-defined variables can hold any type of data (for example, integer numbers,
    single words, text strings, or complex numbers). It is up to the application referencing
    the variable to decide what to do with the contents. In contrast, the content
    of system-defined variables is fairly static and inflexible. For example, the
    `HOME` variable can contain only a directory and *not* a file.


    When we say “set shell variables,” we mean “specify, or set, the *value* of a
    variable.” The values of variables can be set in two ways:


    +   - By a form of direct definition called *variable substitution*

    +   - To the output of a command or a group of commands, which is called command
    substitution. Command substitution is discussed later in this chapter.


    We will look at each technique in turn.'
