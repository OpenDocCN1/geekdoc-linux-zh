  md: 'The most obvious problem with cat is that when viewing files that are longer
    than a single screen, the file scrolls until the bottom of the file is reached.
    Thus, you can easily miss what was at the top of the file. You can mitigate this
    situation in a couple of ways. First, while the file is actually being displayed,
    you could press Ctrl-S to freeze the scrolling of the screen during output. To
    resume scrolling, you could then press Ctrl-Q. This action might not be appropriate,
    however, if the scrolling happens quickly.


    The second and recommended method is to use the \| more ("pipe-more") and \| less
    ("pipe-less") commands in conjunction with cat, as such:


    ```

    ```

    $ cat filename | more<Enter>

    ```

    ```


    "Pipe-more" and "pipe-less" cause cat to display the first screenful of file contents
    and then stop and wait for to the user to go forward only (with pipe-more) or
    backward *and* forward (with pipe-less) through the file contents at the user’s
    preferred pace. We will discuss the more and less commands in more detail in the
    next section.


    In Chapter 10, “The vi Editor,” we will also discuss how cat can read from a device
    called standard in and display to a device called standard out. You can also use
    the cat command to create or even print a file by combining it with the redirect
    output symbol ( > ). In fact, we tell you how to use cat for printing at the end
    of this chapter, in the section cat Can Print, Too. Otherwise, please check the
    man pages and other sources for additional options.


