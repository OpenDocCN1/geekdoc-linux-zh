    # Example 12.13 Foreground Task Control


    In this example, we use the yes utility that, in this case, simply enters the
    characters y and n+line (that is, Enter) ad infinitum, using system resources
    until it is deliberately terminated. Thus, we are using yes as a utility with
    predictable and controllable outputs. If you are curious about more useful ways
    to use yes, consult your information sources.


    So, to suspend a foreground task,


    ```

    $ yes >/dev/null<Enter>

    <Ctrl>-z

    [1]+ Stopped yes >/dev/null

    ```


    And then, to resume the suspended task,


    ```

    [1]+ Stopped yes >/dev/null

    $ fg<Enter>

    yes ./dev/null

    ```


    # Suspending and Resuming a Background Task


    If the job you want to suspend is running in the background, you will find that
    Ctrl-Z does not work because it is strictly a foreground-related command. In this
    case, use the fg command to bring the command into the foreground and then suspend
    it with Ctrl-Z. You might have to use the job number as supplied by the jobs command.


    As shown in Example 12.13, you would issue fg $jobnumber, press Enter, and then
    press Ctrl-Z. Assume that you want to resume a suspended job and return the job
    processing to the background. Simply type bg (background) at the prompt. The shell
    returns a job number in square brackets followed by a plus sign (+). The plus
    sign indicates that the job is the most recently started or stopped. The returned
    display also includes the ampersand (&) at the end of the listed job name, indicating
    that the job is in the background.'
