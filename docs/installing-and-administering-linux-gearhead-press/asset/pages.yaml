  md: "# Shells, File Descriptors, Redirection, Command Piping, etc., Continued\n\n\
    | COMMAND | DESCRIPTION |\n| 2> | File Descriptor--Error Redirection (Destructive)\
    \ \nExample: \n$ commandname 2> filename \n\"write errors from commandname execution\
    \ to filename\" |\n| 2>> | File Descriptor--Error Redirection (Non-destructive)\
    \ \nExample: \n$ commandname 2>> filename \n\"append errors from commandname execution\
    \ to end of filename\" \nOther redirection examples: \n$ commandname < infilename\
    \ > outfilename 2> errorfilename \n$ commandname >> appendoutfilename 2>> appenderroroutfilename\
    \ < infilename |\n| ; | Command delimiter/terminator--used to string commands\
    \ together on a single line |\n| | | Pipe/pipeline output from one command to\
    \ be input to the next command \nExample: \nls | cpio -o > /dev/fd0 \n\"pass the\
    \ results of the ls command to the cpio command; send final output to first floppy\
    \ disk\" |\n| \\ | Continuation character--to continue commands on a second (or\
    \ more) line; will be prompted with > (secondary prompt) for command continuation\
    \ |\n| tee | Reads standard input and sends standard output to both standard output\
    \ and a file \nExample: \n$ ls | tee ls.save | sort \nls output goes to ls.save\
    \ and is also piped to the sort command |"
  merge: -1
