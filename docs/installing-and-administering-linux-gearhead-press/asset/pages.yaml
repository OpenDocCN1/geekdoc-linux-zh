    the comments are as important as the script commands themselves)


    Thus, a *shell script* is a collection of system commands stored in a text file
    that the shell reads and executes in sequence. A script can enable you to do anything
    that you could normally do from the shell prompt. Therefore, in its simplest form,
    it will contain at least one Linux/UNIX command, as shown in Example 13.1. When
    the shell processes a shell script, it reads the script file one command at a
    time, parses the commands, and sends them to the operating system for execution.
    The commands are executed in turn, just as if you had typed them at the terminal
    command line.


    You can execute any Linux command in a shell script. In fact, some shell features
    that you can use in a script cannot be accessed at the command line. They are
    built-in facilities that enable more complicated functions to be performed.


    Meanwhile, you can use any Linux/UNIX text editor to create a shell script.


    # Example 13.1 Using the cat Command to Create a Simple Shell Script


    Lady Molinera wants to execute the *date* command, but she does not want to enter
    it on the command line every time she wants to invoke it. So, she creates a shell
    script called *script1* using the *cat* command as her text editor:


    ```

    $ cat > script1<Enter>

    $ date<Enter>

    <Ctrl>-d

    ```


    # Example 13.2 Creating a Simple Shell Script with vi


    Lady Molinera also likes to keep close track of her directory contents. She wants
    to execute *date*, *pwd*, and *ls* -1 periodically but does not want to enter
    the commands at the command line one after the other every time. So, with vi,
    she creates another shell script called *script2* to handle this function:


    ```

    $ vi script2<Enter>

    i

    ```'
