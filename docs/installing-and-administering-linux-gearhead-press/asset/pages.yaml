    # **Example 13.15 “While Looping” to Prevent a System Crash**


    At about 2 P.M. on Mondays in October, Freston knows that everyone in the extended
    RFI organization will decide to check the local soccer, football, baseball, and
    hockey pool results. He knows that such a load will be just too much for the server
    to handle. When the number of users exceeds 540, he knows the system will crash.
    So, in preparation for the inevitable heavy load, he decides that a *while* script
    would be a worthwhile thing to develop in order to advise all those who are logged
    in to try another time before the system crashes. The script will send out a warning
    every five seconds until users respond. He has seen it in action before: It is
    *very* annoying and therefore works well. His script looks like the following:


    ```

