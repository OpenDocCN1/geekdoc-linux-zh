    # # A Brief History


    The first X Window System was developed in 1984 by the *Massachusetts Institute
    of Technology* (MIT). The X Window System, which is often referred to as X or
    X11, provides a powerful network-based foundation for a Linux/UNIX GUI environment.
    X is a collection of programs, including servers, documentation, fonts, programming
    libraries, and utilities, but its foundation programs are as follows:


    +   - A basic windowing program that provides windowing services

    +   - The X Network Protocol, a protocol for network communication

    +   - A low-level interface called Xlib, which sits between the higher-level programs
    (on top) and the network or base system (on the bottom)

    +   - A “window manager”—an X application to control the type and appearances
    of the windows


    The X Window System enhances UNIX in the same way that the “other GUI operating
    system” enhances (or enhanced at one time) DOS, only more reliably. What do we
    mean by *enhance?* Some advantages and features of GUIs are listed next:


    +   - An attractive and intuitive (that is, easy-to-use) human-to-machine interface

    +   - Potentially easier ways of identifying, entering, and modifying data

    +   - Several control devices that require no knowledge of programming or other
    commands (for example, buttons, icons, menus, and scrollbars)'
  merge: -1
  img_proc: true
- pgno: 440
  md: "+   * Consistency of look and utility, which leads to reduced training requirements\
    \ for new applications\n+   \n+   * Greater ease in managing multiple and simultaneous\
    \ processes and applications\n\nNow, all is not perfect in the world of GUIs.\
    \ GUI programs by nature are generally large and rather inefficient because they\
    \ tend to use a lot of resources. They have to write or call upon many controlling\
    \ functions for window manipulation, graphics output, and data input from a keyboard\
    \ and a mouse. In short, GUIs require more resources than the command line but\
    \ can also make complex programs easier to use.\n\nSince the birth of X in 1984,\
    \ commercial vendors---particularly the vendor- and researcher-based organization\
    \ called the X Consortium, whose membership includes IBM, Digital Equipment, and\
    \ MIT---have effectively made X the UNIX industry standard. X is installed on\
    \ most UNIX systems around the world.\n\nA free software conversion (in other\
    \ words, a free “port”) of X for Linux and other UNIX variants, called XFree86,\
    \ was developed by the XFree86 Project Inc. (now a member of the X Consortium).\
    \ XFree86 is a version of MIT’s X Window System v. 11, rel. 6 (that is, X11R6).\n\
    \nIf XFree86 is installed on this, you will see several X11R6 references as part\
    \ of directory or filenames. The original X version 11 was released in 1987, release\
    \ 6 came out in 1994, and the latest version is X11R6.4. As of this writing, the\
    \ latest release of XFree86 is 4.1.0. Your version of XFree86 probably has all\
    \ the binary files, support files, libraries, and tools that you will need. If\
    \ not, check the XFree86 Project Internet site at www.XFree86.org. You can also\
    \ check that Web site for the latest version of XFree86.\n\n# # X Window Networking\n\
    \nIn Figure 14.1, we illustrate a simplified X Window System network consisting\
    \ of various types of machines. In an environment like this one, an X application\
    \ could run on any processor or even on one type of processor. A user or administrator\
    \ could sit at any other system on the network and run an X Window application.\
    \ Thus, we can claim that X is platform independent. X enables a display and keyboard\
    \ attached to one system to use programs (that is, clients) running on a completely\
    \ different system---even a completely different type of system."
