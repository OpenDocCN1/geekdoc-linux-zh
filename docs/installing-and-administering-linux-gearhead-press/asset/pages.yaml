  md: '```

    $ mail panzasan<Enter>

    Subject: Meeting at El Toboso<Enter>

    Sâncho! Don''t forget the meeting tonight at Lady Dulcinéa''s!

    Signed, Quixote de La Mancha

    <Ctrl>-d

    Cc: <Enter>

    ```


    What if our noble knight Quixote wishes to send a message to a user on another
    system? Knowing that Dulcinéa is working at her home office in El Toboso, here''s
    what he might enter:


    ```

    $ mail dulcineae@eltoboso<Enter>

    Subject: Meeting Still OK, My Lady?<Enter>

    *Is it still OK for you me (your devoted knight-Errant), my squire, and our comadres
    to meet with you tonight at our casa in El Toboso? We wish to discuss our plans
    for future noble exploits.*

    * I have already taken the liberty to inform Sancho, Nicholas the Barber and Peréz
    the Curate. I will inform the others after I receive your blessing.*

    * Signed, Quixote de La Mancha*

    <Ctrl>-d

    Cc: <Enter>

    ```


    # To Receive Mail


    Whenever you log in, the system lets you know whether you have mail messages waiting
    in the `username` file (where `username` refers to your username) in the `/var/spool/mail/`
    directory.


    The You have mail notification and the mail messages themselves are not displayed
    simultaneously when a new message arrives. System administrators can customize
    the shell (in other words, the system) to check on all mailbox files periodically;
    for example, once every 600 seconds. If the shell detects a new message in a user''s
    `/var/spool/mail/username` file, it then displays the You have mail notification.
    System administrators can customize other aspects of this mail notification, as
    well. That said, to view new messages, the format is simply


    ```

    $ mail<Enter>

    ```


    The `mail` program responds with a listing of the new messages in the file. Note
    that once you invoke the `mail` program, it has its own specific prompt (`&`),
    which tells you that it is now running. Let''s use an example to explore `mail`
    a little more.'
  merge: -1
  img_proc: true
