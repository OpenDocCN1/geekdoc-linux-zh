    The *quit* signal (that is, 3, SIGQUIT, or QUIT) is sent when the quit key is
    pressed. Generally, the quit key sequence is Ctrl-\, but it might vary by system.
    This signal produces a core file.


    The *unconditional kill* signal (that is, 9, SIGKILL, or KILL) is sent when no
    other signal can stop the process. No process can catch, or ignore, this signal.
    It should be used with caution because the target process stops immediately. It
    does not finish what it was intended to do, which could cause a loss or damage
    to files or information already generated by the process. For example, if you
    unconditionally kill a process that is updating a file, the updated material or
    even the entire file could be lost.


