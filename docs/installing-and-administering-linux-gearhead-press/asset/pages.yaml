- pgno: 363
  md: '# **Example 11.4 Setting Variables by Character Substitution**


    Juana is learning to use the character substitution technique to save her some
    time when she is organizing Lady Dulcinea’s schedule. She finds that she uses
    the word *day* in many situations. So, she will try to create a variable called
    *abc* and assign the value day to it. Here, she sets and verifies the *abc* variable:


    ```

    $ abc=day<Enter>

    $ echo $abc<Enter>

    day

    ```


    Now, she checks to see whether it works by substitution:


    ```

    $ echo Tomorrow is Tues$abc<Enter>

    Tomorrow is Tuesday

    ```


    So far so good. It works when no space appears *before* the variable. The substitution
    is not hampered.


    But here, something seems to go wrong. The shell tries but fails to substitute:


    ```

    $ echo There will be a $abclong meeting<Enter>

    There will be a meeting

    ```


    When no space is encountered *after* the variable name, the shell was tricked
    into looking for the wrong name. In this case, it searched in vain for a variable
    it thought was called *abclong*, which we know did not exist because we did not
    define it. When the shell could find no definition for this (wrong) variable name
    *abclong*, it returned with a null string. That is, the shell did not make a substitution
    but rather, removed the portion of the statement containing the wrong or undefined
    variable name.


    To try again to substitute, this time successfully:


    ```

    $ echo There will be a ${abc}long meeting<Enter>

    There will be a daylong meeting

    ```


    When you cannot have a space following the variable name, you can preserve the
    proper variable name by surrounding it with curly brackets ( ). Note, however,
    that $ must remain *outside* the curly brackets. Otherwise, the shell will not
    be “triggered” to perform the substitution.'
  merge: -1
  img_proc: true
