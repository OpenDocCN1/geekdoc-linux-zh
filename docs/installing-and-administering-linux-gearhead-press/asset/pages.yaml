    # # Acknowledgments


    I have many to thank. First and foremost, thanks to Linda for the inspiration
    to write this book. Thanks to the many, many Linux developers all over the world.
    What a lesson in international cooperation we have all learned from you. Thanks
    also to all our colleagues and to all the students we have met over the past few
    years who’ve expressed the need for a progressive introduction to Linux and also
    for a book they could refer to when they need it. We also thank the reviewers
    and readers of the first edition of this book, who made the thoughtful comments
    and suggestions that led to this “new and improved” version. And thanks to the
    editors at Gearhead and Wiley, whose questions and comments kept us on our toes
    and made us account for all the ideas, claims, and instructions found herein.
    Thanks to Miguel de Cervantes Saavedra (1547-1616), whose “Don Quixote of La Mancha”
    was the inspiration for the characters you will meet in this book. If you have
    not read “Don Quixote” and (especially) if your spirit needs a lift, we wholeheartedly
    recommend it. Finally, as sentimental as it sounds, we still remember our beloved
    old dog Keeler, who spent her last few months watching us “pound out and mouse
    click” our way through the first edition. Her ghost lingers over this edition,
    too.'
