    +   - Ctrl-Q will resume scrolling after you have stopped it.

    +   - Ctrl-C terminates the current command.


    Preston also tells Sancho that if he wanted to view the whole year, screenful
    by screenful, he should enter the following command at the beginning:


    ```

    $ cal 2001 | more <Enter>

    ```


    What does Preston mean by “screenful by screenful”? This last cal command contains
    the | character, which is called a pipe, followed by the more command. By using
    the pipe (which is a command unto itself and actually dates back to the first
    days of Unix) and adding more, we are telling the system to fill the screen with
    output from the cal command starting from January 1 to whatever the screen can
    hold and then to stop and wait for further instruction. He can then press Enter
    to advance one line at a time through the rest of the output or press the space
    bar to move a whole screen at a time. He can also use the Ctrl-Q and Ctrl-C combinations
    listed previously. When he sees a new command prompt at the bottom, he will know
    that he has reached the end of the output and that the system is ready for a new
    command.


    The pipelining, or piping, of commands is discussed again in Chapter 7, “Shell
    Basics.” Meanwhile, the more command—and a somewhat newer and more versatile variation
    called the less command—are discussed in Chapter 5.'
  merge: -1
  img_proc: true
- pgno: 90
  md: "# ## Requesting Data on Logged-In Users\n\nOccasionally, administrators, and\
    \ even ordinary users, need to know who is logged in to the system. Linux/UNIX\
    \ enables them to find out by providing several handy commands.\n\nThe basic purpose\
    \ of the who, who am i, whoami, and finger commands is to obtain information about\
    \ those logged in users. As you'll see, though, each provides its own “twist”\
    \ on that information.\n\n# ### who, who am i, and whoami Commands\n\nThe output\
    \ from the who command is simply a list of users who are currently logged in along\
    \ with their stations and the time they most recently logged in.\n\nThe -u and\
    \ -m options are often added to the who command. The response to who -u displays\
    \ all usernames, their respective real names, workstation names, login times,\
    \ and the identities of the processes they are running.\n\nThe response to who\
    \ -m is identical to that of who am i, which appears in Example 3.9. For both\
    \ commands, the system responds with the username of the person who entered the\
    \ command, the name of the user's workstation, and the user's login time.\n\n\
    > **Example 3.8 who**\n> \n> A week after he was hired, Sancho wants to contact\
    \ Don Quixote. He knows enough about the who command now to check to see whether\
    \ the good Don is on the network this morning. He enters\n\n```\n$ who<Enter>\n\
    root      console     Jul  9  07:30\nquixoted  tty2      Jul  9  08:10\npere \
    \     tty3      Jul  9  08:15\nnicholas  tty4      Jul  9  08:18\ndulcinea  tty5\
    \      Jul  9  08:10\npanzasaan tty6      Jul  9  08:07\n```\n\nExample 3.8 shows\
    \ that the root user (Freston) has been logged into the system console since 7:30\
    \ A.M. on July 9 and that several other users have logged into their respective\
    \ terminals since then."
  merge: -1
  img_proc: true
