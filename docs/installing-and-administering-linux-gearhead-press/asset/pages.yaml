    # Assigning Unique Filenames: Appending Information


    Sometimes an application—or a user or a programmer, too—has to assign a unique
    name to a file. In this section, we discuss two methods of assigning unique names:


    +   Automatically appending the process number as a suffix to the end of a filename


    +   Automatically appending the date as a suffix to the end of a filename


    # Appending a Process Number to a Filename


    By appending two dollar signs to the end of a filename, as shown here and in Example
    9.20, the shell automatically appends a two- to five-digit process number to the
    end of that filename. This technique will likely produce a unique filename every
    time. The syntax is as follows:


    ```

    $ touch filename$$<Enter>

    ```


    # Example 9.20 Appending a Process Number to a Filename


    Every day, Pedro Alonso, in RFI''s Citrus Division, orders new equipment, fertilizer,
    seed, cuttings, and so on. He needs a way to make the daily orders files unique.
    What he does is:


    ```

    $ touch citdiv_order$$<Enter>

    $ ls citdiv_order*<Enter>

    citdiv_order342 citdiv_order1105 citdiv_order12038

    ```'
  merge: -1
  img_proc: true
- pgno: 316
  md: '**NOTE** For both techniques, we are using the *touch* command to create example
    files. You, of course, can create files in many ways.


    # Appending a Date to a Filename


    Although appending a process number to a filename will produce a unique filename,
    some people prefer the suffix to tell them a little more about the file. This
    reason is why the other method, appending a date as the suffix, is popular.


    But before we discuss the appending date suffix method, let’s take a closer look
    at the possible output of the date command. The following is a typical shell response
    to the date command when used by itself:


    ```

    $ date<Enter>

    Wed Jul 14 12:48:32 CDT 2001

    ```


    When creating filenames, though, you probably do *not* want to include the text
    names of the day or month (such as Wed or July). Instead, you want to use their
    numerical equivalents (such as 07 for July). The numerical equivalent of the preceding
    date is generated as follows:


    ```

    $ date +''%y%m%d%H%M%S''<Enter>

    000714124832

    ```


    Here, we ask the shell for the date in the format of year (y), month (m), day
    (d), hour (H), minute (M), and second (S).


    As seen in Example 9.21, the filename is formatted as a basic filename, followed
    by a dot as a separator, followed by the date as an extension in the month-day-hour
    format. If you will be generating more than one filename per hour, though, you
    should add more precise date fields (minute or even second) to the format to prevent
    files from being overwritten (and thus, losing valuable information). The syntax
    is


    ```

    $ touch filename.''date +''[options]''<Enter>

    ```


    No matter what you decide, be aware of the command syntax. Note that two types
    of metacharacters are used: the single quotation mark ('') and the back quote
    ('').


    # Example 9.21 Appending the Date to a Filename


    After just a few weeks, the *cividov_order$$* files are starting to confuse Pedro
    and his other Citrus Division colleagues. Preston suggests that they use the'
