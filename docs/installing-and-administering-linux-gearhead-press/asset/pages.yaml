  md: 'file system administrators. The `mtools` commands are not case sensitive. Table
    5.3 lists the syntax and purpose of about half of the existing `mtools` commands.


    Refer to the man pages and other sources for information regarding the options.
    Remember that all pattern matching follows UNIX syntax and conventions, not DOS’s.
    With commands such as *mcopy* and *mmove*, you can determine whether the files
    are going from a DOS file system to a UNIX file system by determining whether
    the *sourcefile* or *targetfile* has the DOS letter-drive designation.


    # **MToolsFM**


    MToolsFM is a program designed to give people easy GUI-based file management of
    floppy disks under Linux and UNIX-like operating systems. MtoolsFM was formerly
    called *mfm*, but that was occasionally confused with MFM, the Motif File Manager.
    The latest version is MToolsFM-1.8.


    It uses `mtools` functionality. But the advantage to MToolsFM is that because
    there are fewer and fewer people who know DOS, the GUI interface gives them the
    functionality but does not require them to learn a different set of command line
    commands.


    MtoolsFM can be downloaded from www.core-coutainville.org/MToolsFM/, where it
    is maintained by Christian Ospelkaus (christian@core-coutainville.org).


    # **Printing Files: The lp, lpq, and lpr Commands**


    Printing with Linux could take up a book on its own. Here, we will try to condense
