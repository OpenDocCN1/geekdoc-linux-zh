- pgno: 264
  md: 'other syntax that would work? The next section should help answer these questions.


    Meanwhile, we know that `grep` can search in specified files for specified regular
    expressions, which can include text patterns and metacharacters. In Example 8.12,
    we saw a metacharacter used with `grep` to search for every file that begins with
    the character R (`grep` `^R`).


    We also mentioned how the metacharacters used with `grep` might or might not mean
    the same as the metacharacters used by the shell. Take a look at Table 8.2. Can
    you see how `grep` metacharacters might cause confusion as well as unreliable
    and undesirable results? For this reason, we recommend that you surround `grep`
    expressions containing metacharacters with single quotes. Double quotes might
    be acceptable in some situations, but you will get the most reliable performance
    by using single quotes.


    The following are three examples of `grep` metacharacter usage:


    +   - `[a-f]` means any *one* character from the range a through f

    +   - `^a` means any lines beginning with a

    +   - `z$` means any lines ending with z


    # **Table 8.2** Metacharacters in grep and the Shell


    | METACHARACTER | MEANING IN GREP | MEANING IN THE SHELL |

    | :--- | :--- | :--- |

    | `.` | Match any character | If followed by *filename*, execute *filename* |

    | `*` | Match zero or more preceding | Match zero or more |

    | `^` | Match beginning of line | Bourne shell pipe symbol |

    | `$` | Match end of line | Variable (generally, the user prompt) |

    | `\\` | Escape the character following | Escape the character following |

    | `[ ]` | Match one from this set or range | Match from this set or range |

    | `{ }` | Match this range of instances | |

    | `+` | Match one or more preceding | |

    | `?` | Match zero or one preceding | Match zero or one |'
