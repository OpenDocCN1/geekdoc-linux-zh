    If you want to create a scrollbar in an existing window, place the mouse pointer
    inside that window, hold down the Ctrl key, and press the center button on the
    mouse (on a three-button mouse) or press both mouse buttons at once (on a two-button
    mouse). The VT Options menu is displayed on the screen. The first, or one of the
    first, selections on the menu is Enable scrollbar. Click that selection, and a
