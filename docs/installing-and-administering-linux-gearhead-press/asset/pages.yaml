    # ## Entering and Editing Commands at the Command Line


    Before we discuss editing at the command line, it might be useful to mention Linux/UNIX
    shells again. Shells are, among other things, Linux/UNIX command interpreters,
    and we described them in more detail in Chapter 7, “Shell Basics.”


    Let’s quickly summarize by stating that when a user logs in to Linux, one of the
    several available shells is invoked by default according to what is found in the
    user’s profile in the *\textit{/etc/passwd*} file. Because many principles, utilities,
    and commands are similar from shell to shell, we will focus here on the Bourne
    Again Shell, or Bash shell. (We also learned in Chapter 7 how a user can switch
    from one shell to another by using some simple commands, however.)


    # ## Basic Command-Line Navigation and Editing


    With Bash, you type commands by using letters, numbers, and some metacharacters
    and then execute the commands by pressing Enter. To navigate back and forth along
    the command line, you can use the right arrow and left arrow keys. To delete text,
    you can use the Delete and Backspace keys. You can use some of the other handy
    keys, too, such as Home and End. The Shift, Alt, Ctrl, and function keys (that
    is, F1, F2, and so on) are a different story, however. Using them can provide
    some utility (examples: Ctrl-o presents the ls command automatically; Ctrl-p presents
    the last command executed; the Alt key, used with characters such as 2, 4, 7,
    8, 9, 0, ¬, c, e, or \vert, can create other special characters, and so on). But
    sometimes, using them can produce unpredictable or inconvenient results as well.


    # ## The Up and Down Keys and Command History: A Review


    Remember back near the end of Chapter 7 when we introduced you to the power and
    convenience of the up and down keys? We can use them to tap into our command history,
    starting with the RAM buffer where commands'
  merge: -1
  img_proc: true
- pgno: 343
  md: 'from the current session are saved, and then proceeding into the hidden file
    called .bash_history in our $HOME directory. Using Up or Down allows us to recall
    and re-execute, then, commands that we have executed previously.


    When you back up enough to enter the hidden .bash_history file, your initial position
    in that file is at the bottom, or the most recent command before your last logout.
    You can specify the number of old commands that will be placed in the .bash_history
    file, so you can travel back a fair distance in your command history (we will
    discuss how to do that in Chapter 11, “Shell Variables and the User Environment”).
    But pressing the Up key once you reach the top of .bash_history, however, results
    in a shell error beep.


    To summarize, the benefit of using Up and Down is that you can repeat procedures
    by recalling commands and then pressing Enter to re-execute. That can save you
    a lot of typing, especially with respect to complicated syntax. You can also perform
    sensitivity analyses by re-executing commands while changing options or arguments
    with each execution.


    # # Invoking Text Editor Features at the Command Line


    Linux also enables you to invoke, at the command line, the editing features from
    its various text editors. For example, if you type the following at the command
    line, Linux enables you to use some vi commands and keystrokes:


    ```

    $ set -o vi<Enter>

    ```


    To turn the features off, type


    ```

    $ set +o vi<Enter>

    ```


    The “invoking other editor features” facility can be handy for UNIX-based operating
    system users and administrators when they find themselves at different locations
    (especially at different keyboards). The feature can bring some predictability
    to command-line activities.


    For example, invoking vi features might let you use the h, j, k, and l keys to
    emulate the left, down, up, and right arrow keys, respectively, to navigate the
    command line or to recall previous commands by tapping into the buffer and your
    .bash_history file.'
