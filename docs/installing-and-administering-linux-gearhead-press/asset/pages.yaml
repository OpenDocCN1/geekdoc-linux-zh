    # ## The wc Command


    When you need to know certain attributes of a certain file, one command you can
    use is the `wc` (word count) command. The basic syntax and a few command options
    are as follows:


    ```

    $ wc [-l] [-w] [-c] filename.ext<Enter>

    ```


    The -l option counts the number of lines; -w counts the number of words; and the
    -c option counts the number of characters (that is, the number of bytes). If you
    type:


    ```

    $ wc filename<Enter>

    ```


    you might get something resembling the following:


    ```

    17 126 1085 filename

    (lines) (words) (characters) (name of file)

    ```


    If you do not specify any options, you always get lines, words, characters, and
    the filename. You can shorten or lengthen the output by specifying options.


