  md: 'so on. But UNIX and Linux have another interesting tool to create files: the
    `touch` command. We will see Lady Dulcinea use `touch` in Example 5.1. Here is
    the syntax:


    ```

    $ touch [-c] filename<Enter>

    ```


    Basically the command has two purposes:


    +   * If the filename specified with `touch` does not yet exist, `touch` will
    create a `zero-length` (that is, empty) file. If you do not want the creation
    to take place, use the `-c` option.


    +   * You can also specify a directory name with `touch`. If the file or directory
    specified does exist, the last modification date and time (as displayed with the
    `ls -l` command) is updated to reflect the current date and time unless you specify
    a preferred time variable.


    The `touch` command can be helpful when you are about to invoke an application
    against one or more files, and that application checks the files’ modification
    times before taking some action (such as backup or restore) with the files. By
    using `touch` alone with its options, you can alter the dates on certain files
    so that they will or will not be affected by the application.


