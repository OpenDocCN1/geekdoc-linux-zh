    Linux also has powerful and flexible GUI capabilities, however. This chapter provides
    an introduction to the GUI foundation, called the X Window System. We wholeheartedly
    recommend installing the X Window System when you first install Linux on your
    system (our preference) or later after Linux has been installed. After you properly
