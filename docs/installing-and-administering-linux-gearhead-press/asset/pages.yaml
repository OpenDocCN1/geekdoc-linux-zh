    # X Window Fundamentals


    This section introduces the most basic aspects of the X Window system that a novice
    user wants to know. Just like learning to ride a bicycle or drive a car, the first
    things a new user wants to know are: “How do I get it going?” followed by “How
    do I stop it?” The only extra topic we add is “How do I get it to start automatically?”


    # Starting X Manually


    No matter what distribution of Linux you purchased or downloaded from the Internet,
    you probably realized that by default, you do not invoke X automatically when
    it boots up. You are probably left staring at the command-line login prompt. In
    that case, you have to start it manually.


    When you have completed the login procedure, you will be faced with your user
    or root prompt ($ or #, respectively). At the prompt, type startx. The screen
    goes blank briefly as your X session is initiated, and the window manager appears
    in front of you.'
