    # # xterm Fundamentals


    An xterm window is an X client application that simulates a common video terminal,
    such as a DEC vt100. By now, you have undoubtedly noticed that you can create
    and use xterm windows (commonly called xterm, AiXterm, or something similar, depending
    on the version of UNIX) while in X to enter Linux/UNIX commands in the same manner
    you entered them at the command line when X was not invoked.


    # ## Create an xterm Window


    You can create additional windows in X in two ways. First, from an already opened
    xterm window, you can type xterm &. Alternatively, you can move the mouse pointer
    to an open area of the desktop (that is, the area not already occupied by a window)
    and left-click the mouse. Then, from the resulting root menu, left-click New shell,
    which is the first selection under Start at the top of the root menu.


    # ## Copy Text


    The xterm window enables you to copy and paste text to another part of the window
    or to another window. Place the mouse pointer at the first letter of the text
    you want to copy, and then left-click and drag over all the text you want to copy.
    The text is highlighted. When you release the mouse button, the highlighted text
    is copied into a buffer. Then, you move the mouse pointer to a position in the
    same window or in another xterm window. If you are using a three-button mouse,
    press the center button to copy the text. If you are using a two-button mouse,
    push both buttons at once.


    # ## Create a Scrollbar


    If you want to create a window with a scrollbar in it, first create another preliminary
    window. In that preliminary window, type one of the following command sequences:


    ```

    $ xterm -sb leftbar<Enter>

    ```'
