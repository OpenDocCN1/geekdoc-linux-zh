    | `:w >> file2` | Write buffer contents to the end of *filename2* |

    | `:q` | Quit this editing session (no writing of buffer contents if `q` is used
    alone) |

    | `:q!` | Quit this editing session and discard any changes |

    | `:r filename2` | Read *filename2* contents into buffer following the current
    cursor position |

    | `:r! commandname` | Read the results of *commandname* shell command following
    the current cursor position |

    | `:!` | Exit shell command (filter through command) |

    | `:wq` or `ZZ` | Write buffer contents back to the file and then quit this editing
    session |


