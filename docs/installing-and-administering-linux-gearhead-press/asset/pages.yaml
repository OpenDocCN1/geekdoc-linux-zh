    # The mtools Utilities


    Now that we have discussed several Linux/UNIX commands and their effects on Linux/UNIX
    files and directories, let''s visit the mtools.


    The mtools utilities are a public domain collection of UNIX utilities for creating,
    accessing, and manipulating DOS disks from Linux/UNIX without having to mount
    or unmount the DOS file systems (in our case, that means not having to mount and
    unmount DOS floppy disk file systems). The mtools are maintained by Alain Knaff
    and David Niemi. Some UNIX veterans refer to mtools commands simply as *m* commands.


    # Obtaining and Loading mtools


    A copy of the mtools utilities might be packaged with your Linux distribution.
    If so, they probably work fine. But two or three years back, the mtools enclosed
    with distributions were unreliable, so it was best to get the latest version of
    mtools from one of the mtools Web sites. If you would like to obtain and use these
    utilities, or if you find that your existing version is buggy, check out one of
    the following sites to download the latest version of mtools or the latest patches
    to your version:


    +   - www.tux.org/pub/knaff/mtools/ (U.S. Web site)

    +   - http://mtools.linux.lu/ (European Web site)

    +   - ftp://www.tux.org/knaff/mtools/

    +   - ftp://ibiblio.unc.edu/pub/Linux/utils/disk-management/


    Please note that more versions are available at the FTP sites than at the HTTP
    sites. We recommend that you download the text files (especially the mtools manuals
    from one of the first two Web sites) as well, because they include the most up-to-date
    instructions for loading mtools on your system and also have an in-depth discussion
    of mtools in general.'
  merge: -1
  img_proc: true
