    # ### Test xdm with the nodaemon Argument


    The xdm program (X Display Manager) can control one or more X display sessions
    on one or more servers, local and remote. This application presents you with what
    is called an xlogin widget (basically a graphical prompt for a username and password)
    and then invokes the X Window System after you have been authenticated. You can
    customize xdm with the'
  merge: -1
  img_proc: true
- pgno: 448
  md: 'use of a configuration file, customarily called xdm-config (but that is beyond
    the scope of this book). All you have to do is ensure that xdm works correctly,
    because it is used in the process of automatically starting X from bootup.


    To test xdm, type the following at the command prompt:


    ```

    # xdm -nodaemon<Enter>

    ```


    The nodaemon option prevents xdm from following its normal procedure, which is
    to put its daemon beyond the control of the terminal. Thus, you are not preventing
    the daemon from being used by xdm but are rather keeping it under some control.


    If all goes well, xdm presents you with its xlogin widget. You type root as the
    login name, press Enter, type root''s password, and press Enter again. The xdm
    program then creates the X Window environment with your chosen window manager.
    Although we have focused on xdm, it is not the only display manager. Other display
    managers such as the GNOME Display Manager and the KDE Manager are also available
    and have many features that can help you manage your environment.


    If you got the results described, xdm works for you. It is safe now to move on
    to the next steps. But first, exit from the window manager by using the root menu
    or start button. The xdm program takes you back to the xlogin widget. To get back
    to the command line, use the key sequence Ctrl-Alt-F1. That takes you back nearly
    to a command prompt, but you will not be at a prompt per se. You should see a
    cursor blinking on the line immediately below the xdm -nodaemon command. Now,
    press Ctrl-C to terminate the xdm daemon and be left at the command prompt.


    # Edit the /etc/inittab File to Run Level 5


    Using vi as your text editor, you will modify the Linux initialization table found
    in the /etc/inittab file, which controls (among other things) the run level (in
    other words, the number and type of services provided by Linux when it boots up).
    Be very careful. Browse down through /etc/inittab until you see the line id:3:inittab,
    and change the 3 to a 5. Do not change anything else. Save and exit /etc/inittab.
    To Linux, running level 5 means that it should no longer boot to full multiuser
    mode as it did with running level 3. It should now boot to X11 mode.'
