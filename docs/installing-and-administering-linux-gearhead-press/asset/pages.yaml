    # Invoking the Linux Installation Program


    The Linux installation program consists of a series of dialog boxes sometimes
    called screens or windows. The dialog boxes present information to you and request
    information and decisions from you. The two most common methods used to invoke
    the installation program are as follows:


    Inserting the Linux CD-ROM into the CD drive and booting the system. The system
    CMOS must be set to facilitate booting from the CD-ROM drive (see Initiating a
    Linux Installation earlier in this chapter).


    Inserting a bootable floppy disk into the floppy disk drive and booting the system.
    The system CMOS must be set to facilitate booting from the floppy disk drive.'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'The installation chronicled in this chapter presumes that you will use the
    floppy boot method. In fact, you will eventually see a dialog box that instructs
    you to insert the CD.


    We knew beforehand that the system we are installing Linux on in this chapter
    would require a network connection to the Internet. Therefore, we obtained some
    *Internet protocol* (IP) addresses before we started.


    # ## Entering Information in the Installation Program


    As you install Linux, you will notice several different ways to enter information
    into the dialog boxes. These methods are as follows:


    +   - **Text input.** You will encounter dialog boxes in which you are to type
    information, usually on a dashed line. This information insertion method is used
    in conjunction with other methods such as buttons, toggles, and so on.

    +   - **Check boxes.** These are spaces defined by brackets or boxes that you
    will either select or deselect by pressing the space bar.

    +   - **Buttons.** These are generally square boxes that you select by pressing
    the Tab key and then the Enter key.

    +   - **Scroll and select.** Some dialog boxes contain lists of components, packages,
    or default services from which you will choose by scrolling up or down and selecting.
    You will use combinations of Tab and space keys, followed by pressing Enter at
    the end of the dialog boxes.


    We present this list here for two reasons. First, these are the insertion methods
    you have to use, and the listing described earlier serves as a guide. Second and
    more importantly, the list helps you focus on the issue at hand rather than the
    collection of information. If you occasionally make a mistake, take heart — you
    will not be the first or the last to do so.


    Insert your CD and boot the system. If you have trouble booting, read the following
    paragraphs. If you do not experience trouble booting the system, proceed to Step
    1.


    # ## Stepping through the Installation


