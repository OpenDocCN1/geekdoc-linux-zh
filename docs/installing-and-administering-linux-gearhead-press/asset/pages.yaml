  md: '# Example 8.12 grep for Extracting Data


    Juana remembers compiling three telephone lists for Rueful Figures, Inc. and storing
    them in her phone\#s subdirectory. Here is how she checks that number:


    ```

    $ cd<br>

    $ cd admin/phone\#<br>

    $ ls | grep "R | wc -<br>3

    ```


    In the command in Example 8.12, Juana moved to her home directory first, then
    changed directories to her /home/admin/phone\#s subdirectory. Then, she listed
    all the files in that subdirectory and grep\''d all files whose filenames began
    with an R and then counted the number of lines in the output to that grep command.
    Because grep found three files, RFI\_Tel1, RFI\_Tel2, and RFI\_Tel3 (for reference,
    see the file listings in Example 8.11), its output would have three lines. The
    wc command counts those grep output lines and reports a 3 to the terminal screen,
    which is the default stdout (standard output device). The grep command is used
    most often in this capacity to extract certain specified information from stdin
    for further processing.


    In the next section, we will examine grep\''s metacharacters as used in its regular
    expressions.


    Admittedly, Juana could have just done an ls listing on the same directory and
    counted the files whose filenames began with an R. If she had had to check through
    a long list of files through several subdirectories, however, then a simple listing
    would have been insufficient.


    # grep: Regular Expressions with Metacharacters


    Take another look at Example 8.11. You could get the same results by entering
    the following:


    ```

    $ grep 958 RFI*

    ```


    For Juana\''s file structure, the asterisk wildcard would point to the three files.
    What if she had more than three files that began with RFI but she only wanted
    to check those three files, however? How could she restrict the search? Besides
    listing the three files explicitly, can you think of any'
