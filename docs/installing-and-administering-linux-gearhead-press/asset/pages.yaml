- pgno: 300
  md: 'common options: the -q option, which gives you a quick report on whether two
    files actually differ, and the -y option, which prints the two files side by side
    on the screen so that you can compare them yourself. We will also see how the
    sdiff command is equivalent to the diff command with the -y option.


    Some other valuable options are listed in Table 9.1.


    In Examples 9.12 and 9.13, we will see how diff provides a sort of coded output
    as well as verbatim copies of some lines from the compared files. The codes diff
    provides are a mix of numbers and letters. The numbers refer to the line numbers
    in each file. Also, in Table 9.2, we list and explain the letter codes that diff
    provides. The diff command, its options, and its output codes might seem a bit
    complicated at first. But with practice, they are easy to grasp and make valuable
    analytical tools.


