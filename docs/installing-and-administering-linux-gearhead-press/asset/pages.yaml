    the script, but you have to use the `bash` command. In this case, no one needs
    the `x` (in other words, execute) permission on the file—not even the owner. `bash`
    will take care of it. Later in this chapter, we will show you what is actually
    happening when scripts are executed in this manner from a process standpoint.


