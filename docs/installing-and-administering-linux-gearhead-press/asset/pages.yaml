    # Sorting Output: The `sort` Command


    You use the `sort` command to sort the output of a file or the `stdout` of a process
    before it is sent to the screen or wherever you want it to go. Thus, `sort` helps
    to ensure that the output is in an acceptable order or that it is presented how
    you want. It works by reading `stdin` (which might be the `stdout` of another
    process), processing the data, and sending it to `stdout` or wherever you designate.
    The `sort` command’s syntax is as follows:


    ```

    $ sort [-t delimiter] [+field[,column]] [options] [file(s)]<Enter>

    ```


    The processes of the `sort` command use dictionary or ASCII ordering by default,
    which you can override with options—several of which appear in Table 8.4. For
    information on `sort`’s many other options, consult your information sources.


