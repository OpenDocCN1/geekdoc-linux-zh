    and right buttons simultaneously\u2014will also cause certain actions to take
    place, such as the appearance of a menu from which you can select further actions.


    In X, the location cursor is similar to the cursor on the command line of your
    character\u2011based screen. Its location determines where to insert your keyboard
    input on a terminal emulation screen. The location cursor is not activated until
