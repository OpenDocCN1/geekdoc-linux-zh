    After their first login, users can set their own passwords but they generally
    cannot set their own usernames. After a user changes his or her password, it is
    *encrypted*, which means that users (including the root user) cannot decode the
    password. Organizational policy generally requires that users change their passwords
    periodically (for example, every day, week, or month). Example 3.3 shows how users
    can set new passwords for themselves.


