  md: 'one copy of a file is referenced by multiple names. This type of link is called
    a hard link . The owner of the file, the file permissions, and the inode number
    remain the same for both copies. The syntax is as follows:


    ```

    $ ln sourcefile targetfile<Enter>

    ```


    It is important to remember that in order to create links, the proper permissions
    must be set on the respective directories: where the source file resides and where
    the target link will be created. In older versions of Linux/UNIX, it was much
    easier to create links because it was likely that the default permissions allowed
    it without too much bother. Because of security concerns, however, the latest
    versions of Linux do not set default permissions so that links can easily be created
    without proper permissions. Please refer to Chapter 6, “Linux File Permissions,”
    for a discussion of permission bits.


    Once we have gone through the following example, you might want to refer to Chapter
    4 to see how we dealt with links when managing directories.


