- pgno: 258
  md: 'and you need the full path name of the command, but you do not know where it
    resides? Here are three quick *find*-like utilities that can help.


    # whatis


    When you are not sure of a command name, when you are not sure of exactly what
    the command will do, or even when you want to resolve arguments among colleagues,
    the *whatis is* command can be helpful. The *whatis* command searches the *whatis*
    database, a file found in the */usr/bin* directory, for the command name that
    you want to investigate and then prints a brief summary of what that command does
    when invoked. The syntax for *whatis* is straightforward:


    ```

    $ *whatis* *commandname*<Enter>

    ```


    Be sure to use a complete word. No partial text strings are allowed. See Example
    8.8.


    # **Example 8.8** *whatis*


    Sancho and the others have been advised to use the *grep* command to search for
    information within their files without having to *cat* them individually. Before
    he actually uses *grep*, Sancho decides to investigate it. He starts with *whatis*
    as follows:


    ```

    $ *whatis grep*<Enter>

    grep (1) - print lines matching a pattern

    ```


