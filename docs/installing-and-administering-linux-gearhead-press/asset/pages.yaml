- pgno: 158
  md: 'The mv command is followed by the source filename (you must specify the relative
    or full path name if the file is not in the current working directory) and the
    target. The target can be a directory (if you are moving a file only) or a filename
    (if you are moving and renaming). See Example 5.6 for a file-moving example. If
    you are moving more than one file, the target must be a directory for the command
    to execute.


    Generally, when files are moved and the destination is a directory name, the files
    retain their original names. If you specify a filename as the target, however,
    you will be moving and renaming the file at the same time. Example 5.7 will show
    you how to perform this task, too.


    The mv command has the same effect as cp on inode information. All information
    on the source file remains unchanged except that the last access time and date
    are updated. New inode numbers and entries are also created for the new files.


    > **WARNING** Just like with the cp command, if the mv target is the name of an
    existing file and you have the correct permissions set for that file and the directory,
    the file will be overwritten. No error or notification message will appear. To
    prevent this situation and to cause the system to prompt the user, use the -i
    option with the mv command.


    We recommend that you check the man pages for all the options of the mv command.
    You should check out other information sources as well, such as the help utility:


    ```

    ```text

    $ mv -h | more<Enter>

    ```

    ```


