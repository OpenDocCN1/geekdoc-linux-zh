    # ## Executing the Shell Script


    There are two basic ways to execute a shell script:


    +   - Use the `bash` command (if you are in the bash shell; otherwise, you use
    the respective shell execution command).

    +   - Make the script file an executable file all its own. That way, the user
    only has to use its name to execute it.


