- pgno: 190
  md: '# ### Checking Permission Modes


    The *umask* value is subtracted from 666 from a file permission standpoint and
    from 777 from a directory standpoint to determine the permissions that will be
    attributed to files and directories as that user creates them. The resulting 644
    (666 minus 022) for file permissions means that the owner and the owner''s group
    by default have read and write access to the files created, but other system users
    have only read access. The resulting 755 for directory permissions means that
    the owner and the owner''s group have read, write, and execute permissions and
    that others have only read and execute permissions to any directories created.


    The *umask* command is commonly called a file system option, which restricts access
    to certain files or directories. The command is actually a masking subroutine
    that creates and applies file modes, or permissions, on files or directories as
    they are created, however. If you want to use *umask* to check permission modes,
    the syntax is simply


    ```

    $ umask`<Enter>`

    ```


    Example 6.4 shows you how to check the permission mode with *umask*. When a user
    logs in, his or her username, user number, group name, and group number are inputted
    to the /etc/profile program, which determines whether the user qualifies as a
    root user or as an ordinary user as far as *umask* is concerned.


    If the user is an ordinary user or a root user, Linux by default assigns a *umask*
    of 022 (in earlier versions, the default *umask* for users was 002, and for root
    users the *umask* was 022). So, the file permissions are 644 and the directory
    permissions are 755. The owner has read and write permissions on created files,
    but others have only read permissions. On created directories, the owner has read,
    write, and execute permissions, and the owner''s group and others have read and
    execute permissions.


    Those who advocate higher security, especially on a network, recommend a default
    *umask* of 022 as the absolute minimum with alternatives such as 027 or even 077.
    Generally, the higher the *umask* number, the tighter the security.


    # #### Example 6.4 Checking Permission Modes with *umask*


    After a discussion of system security with Freston, Lady Dulcinea decides that
    she wants to know what modes her files and directories are and will be. To do
    so, she must find out what her *umask* is:'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'To ensure that this later version of Linux is consistent whether you are a
    user or a root user, Freston shows Lady D, his default (root user) umask:


    ```

    ```

    # umask<Enter>

    022

    $ ls -id /home/ducinea<Enter>

    ```

    ```


    # ### Changing Permission Modes


    You can also use the umask command to specify the permission bits to be set on
    any new file or directory created in the same session only. Arguments are numeric:


    ```

    ```

    $ umask numeric<Enter>

    ```

    ```


    Subtracting the new umask parameter from the default values of 666 and 777 enables
    you to determine the new permission bits you want for files and directories, respectively.


    Keep in mind the following items when changing permission modes:


    +   The umask value, and thus the permission bits, are applicable to only the
    session in progress and are not in effect after the owner/user logs out and logs
    back in. The default values apply upon a new login.


    +   The new umask value affects only files and directories created after the new
    umask value is specified. Thus, the command has no effect on existing files and
    directories. To alter permissions on existing files and directories, you must
    use the chmod command.


    Remember that in general, the chmod command applies permissions and umask subtracts
    permissions. By manipulating these commands, users and system administrators can
    balance proper security with accessibility.


    # ## Creating Personal Directories


    That said, we will demonstrate how to create a directory (a subdirectory) to be
    absolutely correct) with the appropriate permissions for storing personal documents
    and data. Such a directory would enable only the owner'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'to access it and to store information in it. Later, only the owner would access
    it and review and change subdirectory structure(s) and/or files within the personal
    directory. The ls - 1 listing of such a directory would resemble the following:


    ```

    drwx----   5   me mygroup   4096 date time mydirectoryname

    ```


    The numeric mode of such a directory would be 700.


    > NOTE The permission modes proposed here are now the default modes for home directories
    created with the latest versions of Linux (kernel versions of approximately 2.4.5
    and later). Thus, if you have the latest version of Linux, this information might
    be a little redundant. But if you are working with an older version, then this
    material might still be beneficial to you.


    Be careful of personal directories, though—your home directory or any you might
    create. They can still be accessed and read by the root user (in other words,
    system administrators).


    As we have learned before, the command for creating a directory is mkdir:


    ```

    $ mkdir directoryname<Enter>

    ```


    But there are two different ways to create such a directory:


    +   - Altering your umask temporarily, creating the directory, and then changing
    your umask back to another value (likely, the original value). This method is
    the slower way.


    +   - Creating the directory and then using chmod to change its permission bits.
    By a step or two, this method is the easier, faster way.


    Consider the following points when creating personal directories:


    +   - Users should maintain their own execute (x) values on their personal directories
    to ensure their own access.


    +   - Users should be aware that although the personal directory is invisible
    to all other users, the root user can still access the personal directory and
    read the files contained in it.


    Let’s look at examples of both methods now.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# **Example 6.5 Creating a Personal Directory with umask and mkdir**


    Don Quixote wants to create a private directory called *personal* in his home
    directory. He remembers that it can be done with umask. Here is how he does it:


    ```

    $ cd<Enter>

    $ pwd<Enter>

    /home/quixoted

    $ umask 077<Enter>

    $ mkdir personal<Enter>

    $ ls -l<Enter>

    total 8

