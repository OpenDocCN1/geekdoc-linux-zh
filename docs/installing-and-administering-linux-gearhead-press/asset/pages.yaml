    # ## Variable Substitution Using Character Substitution


    This method is a handy technique that can save you keystrokes almost every day.
    We will define it the best we can here, but to get the best grasp of it, we refer
    you to Example 11.4. In this case, examples work best.


    Begin by defining variables and specifying values for them as you have done before.
    For the bash shell,


    ```

    $ variablename=value<Enter>

    ```


    Then, as you create correspondences, memos, and such, you insert the variable
    names right into your text using a dollar sign as the first character of the variable
    name. Then, when the time comes, the shell will substitute the value of the variable
    for the variable name you typed.


    Look closely at Example 11.4. It illustrates some typical and successful variable
    definition and substitution scenarios. But one scenario produces unexpected and
    incorrect results.


    > **NOTE** To set a variable equivalent to a string of text, surround the text
    string with double quotation marks.'
