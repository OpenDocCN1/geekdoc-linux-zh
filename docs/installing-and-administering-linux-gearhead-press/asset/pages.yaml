    # **Example 6.6 Creating a Personal Directory with mkdir and chmod**


    You change the directory permissions with chmod:


    ```

    $ chmod numeric dirname<Enter>

    ```


    This way, the owner / user can move to his or her home directory, create a subdirectory
    within it, change the mode of the new subdirectory, and then check the permissions
    on the new subdirectory. With this strategy, the user does not need to alter the
    umask and then return the umask to the previous value.


    Let’s see how Don Quixote could have used the chmod strategy to create the same
    private directory called *personal* within his home directory:


    ```

    $ cd /home/quixoted<Enter>

    $ mkdir personal<Enter>

    $ chmod 700 personal<Enter>

    $ ls -ld personal<Enter>

    drw----5 quixoted knights 4096 Jul 23 13:45 personal

    ```'
