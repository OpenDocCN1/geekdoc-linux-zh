    from its parent process. User-defined variables, however, are valid only in their
    respective processes; they are not by default inherited from parent to child,
    nor are they passed back from child to parent. But sometimes, you are in a shell
    and you need to set variables so that they can be used by other programs or shell
    scripts (that is, by other processes). To make one or more variables and their
    respective values available to any child processes, you export them. But before
    you export, you have to set the value of the variable, as we will show in Example
    12.6. The syntax for the export command is


    ```

