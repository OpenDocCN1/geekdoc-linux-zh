- pgno: 24
  md: '# # Linux Origins


    This chapter presents a brief history of UNIX and Linux followed by an introduction
    to the major features of Linux. Although the current incarnation of Linux and
    its respective shells, programs, and other processes have been written from scratch,
    they have also evolved from previous versions of Linux and other UNIX flavors
    (HP-UX by Hewlett Packard, Solaris by Sun Microsystems, and others). Knowledge
    of the history of these operating systems can help you predict the usefulness
    of a command, program, or function or more easily troubleshoot unanticipated results.


    # ## A Brief History of UNIX


    UNIX development was initiated in 1969 by several researchers working at Bell
    Laboratories in New Jersey. Bell Laboratories had previously (1964-1968) worked
    with General Electric and the *Massachusetts Institute of Technology* (MIT) on
    the development of a multi-user, time-sharing operating system called Multics
    (Multiplexed Information and Computing System). Thus, the project involved a partnership
    between private industry'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'and a respected academic institution. As the project progressed, however, Multics
    was proving more difficult and more expensive than the partners had anticipated.
    Deadlines were slipping, and the partners found they had differing philosophies
    and goals. So, in early 1969, Bell Labs withdrew from the Multics project.


    Bell Labs researchers who had worked on Multics (Ken Thompson, Denis Ritchie,
    Douglas McIlroy, Joseph Ossanna, and others) still wanted to develop an operating
    system for their own and Bell Labs’ programming, job control, and resource usage
    needs. So, in addition to the comparatively routine activities they returned to,
    they also informally searched for an in-house alternative to the Multics project.
    Bell’s executive managers, still somewhat scorched by the Multics project and
    burdened by internal post-ticking, however, were not immediately receptive to
    subsequent proposals.


    During this same year, Thompson (later helped by Ritchie) wrote a simple space
    travel program called, naturally enough, Space Travel—first for Multics and then
    for the inflexible and inadequate GE COS operating system on a GE 635 computer.
    Space Travel on the GE 635 was unsatisfactory. That is, the program was jerky,
    hard to control, and expensive from a CPU-per-dollar standpoint. Thompson soon
    found another computer, an already obsolete DEC PDP-7, with acceptable display
    capabilities. But from a programming standpoint, Space Travel was still a challenge—it
    was written with macros for the assembler on the GE 635 computer and then sent
    through a post-processor that produced paper tapes that were in turn fed into
    the PDP-7.


    Thompson and Ritchie soon developed a new kind of primitive kernel for the PDP-7
    plus a text editor, an assembler, a command interpreter (which we refer to as
    a shell), some rudimentary utilities, and a stripped file system (including directories,
    special files that described system devices, nodes to describe file attributes,
    and so on). Many of these features were influenced by their previous work on the
    Multics project. Therefore, the PDP-7 achieved standalone capability. Almost all
    development thus far had been in DEC assembly language, although they had begun
    to develop a high-level language called B that is based on the existing BCPL language.
    B had been used to write a PDP-7 compiler.


    In 1970, the developers requested and received a new computer, a DEC PDP-11, which
    had a new type of 16-bit processor and thus required alterations to the kernel
    code (this code was their Version 1). B was used to develop a PDP-7 to PDP-11
    cross-compiler. Their colleague, Brian Kernighan, suggested that the new operating
    system be called Unix (UNIX would not be all capital letters for years to come,
    but we will talk more'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'about that later) as a sort of pun on Multics and as a way to contrast the
    simplicity of this new *operating system* (OS) with the complexity of Multics.


    # UNIX Is Born


    In a supportive and collegial environment, the researchers continued the development
    of their portable (as defined in the preceding section), simple as possible, high-level
    language operating system that they called the Unix Time-Sharing System. The B
    language continued to be developed, too, and its name was later changed to C.
    C enabled them to create not only applications but also system programs that could
    be ported to new architectures as long as compilers existed for those architectures.
    By 1973, they were even able to rewrite the Unix kernel in C for what they called
    Version 4 (V4). They had now risen above the hardware-specific assembler language
    environment in which Unix had been born in 1969. The Unix operating system was
    different: The developers kept the kernel as close to an essential input/output
    multiplexer as possible but built a collection of add-on programming tools that
    carried out login and logout, command interpretation, file naming, console activity,
    and more via a vast array of functions. No longer did an application built with
    a hardware-specific language have to do it all. Applications could now do solely
    what they were intended to do (for example, text processing) and could rely on
    a high-level language operating system to carry out *input/output* (I/O), file
    manipulation, printing, handling several users at once, networking, inter-process
    communication, and so forth.


    In 1973, AT&T /Bell recognized that hardware—especially telephone system hardware—and
    applications were changing and that Unix would have to become a standard interface
    between the two realms. Then, as hardware or hardware vendors changed, applications
    could continue functioning because Unix could be ported to accommodate the changing
    hardware.


    From 1974 to 1977, Unix source code was licensed inexpensively or for free to
    universities. AT&T, going back to a 1956 United States-AT&T antitrust consent
    decree, was forbidden to sell software commercially. Instead, they had to make
    such computer technology licensable to and by the public. Unix V6, released in
    1975, was especially popular. It was free and it was great for teaching about
    operating systems because it was distributed with its source code, and students
    could follow along after they became familiar with the C language. It was great
    for program developers, too. They could write new applications—in C, for example—and
    then take full advantage of the Unix operating system. DEC had provided thousands
    of PDP-11s to universities across the United States at very little cost.'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'The perfect match of Unix and PDP-11 was thus (accidentally) repeated many
    times. This ground was fertile for further Unix development.


    # # UNIX Becomes Commercialized


    In 1979, AT&T announced that it planned to commercialize Unix, an announcement
    that came true in 1983 with the release of its Unix System V. Meanwhile, the University
    of California at Berkeley, among others, began developing its own version of Unix
    based primarily on Unix V7. Berkeley was also implementing the *Transmission Control
    Protocol/Internet Protocol* (TCP/IP) networking protocol suite that had been based
    on the *Berkeley Systems Distribution* (BSD) of Unix. The Internet itself was
    being developed and expanded, sponsored by the U.S. Department of Defense Advanced
    Research Projects Agency (that is why the original Internet was called the ARPAnet).


    The upshot was the first major proliferation of different versions of Unix in
    the early 1980s:


    +   - AT&T was developing its System V Unix.

    +   - Berkeley was actively developing BSD Unix.

    +   - Sun Microsystems (founded by Berkeley Ph.D. recipient Bill Joy) produced
    its own BSD-based Unix called SunOS.

    +   - Microsoft and the *Santa Cruz operation* (SCO) were already distributing
    XENIX.

    +   - Hewlett-Packard developed HP-UX for its workstations.

    +   - DEC released ULTRIX.

    +   - IBM developed versions of Unix for its PCs, PS/2s, and System/370s. (Later,
    in 1986, IBM would develop AIX first for the RT 6150 and then for the RS 6000.)


    So, a former strength of Unix, AT&T’s free source code, was now becoming a sort
    of weakness because so many new Unix versions were being developed based on the
    pre-commercial V7, depending on the needs of the respective developers who were
    not following any type of standard.


    # # UNIX Moves Toward Standardization


    In 1984, in an effort to promote open architecture standards that emphasized Unix
    as the operating system, several European vendors (among them, Siemens, Amdahl,
    and Philips) formed X/Open. American compa-'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'nies (including AT&T, DEC, and Sun) and Japanese companies (such as Hitachi
    and Wang) later augmented the membership. The open aspects they promoted included
    the development of systems that allowed applications to be easily ported among
    them, that were interoperable, and that allowed users to work on the various systems
    without extensive retraining. X/Open was interested in using member consensus
    to adopt and integrate open standards to ensure that new products conformed to
    them, but not to actually write them. (In 1987, X/Open was incorporated as a limited
    company, the X/Open Company Limited, whose shareholders were several worldwide
    information technology suppliers.)


    In 1988, AT&T bought a large portion of Sun Microsystems; therefore, AT&T and
    Sun could then collaborate on future versions of Unix. The purchase in effect
    merged AT&T''s System V and Sun''s OS. In response, nine other vendors (IBM, DEC,
    HP, Bull, Nixdorf, Siemens, Hitachi, Philips, and Apollo) formed a consortium
    called the *Open Software Foundation* (OSF); membership ballooned to more than
    200 firms by 1991.


    The OSF''s approach was to produce a Unix operating system and other software
    and then license the use of its products to its members and others. In fact, in
    late 1990 they produced what they claimed was the first open UNIX operating system,
    called OSF/1. OSF/1 was based on Carnegie-Mellon University''s Mach, a Unix operating
    system with original ties to BSD Unix. Mach was developed by Carnegie Mellon from
    1985 to 1994. After the introduction of OSF/1, however, only DEC adopted it outright;
    other OSF members—such as IBM and HP—adopted only parts of it.


    OSF also developed the Motif GUI guideline and toolkit for further development
    of the X Window System. The X Window System and the X networking protocol had
    been under development at MIT since 1984. (We will discuss X again in Chapter
    15, “Linux Documentation and Support.”)


    As a countermeasure to OSF, AT&T and Sun allied themselves with yet more and different
    vendors to create the *Unix International* (UI) trade association. Members of
    that association—from computer manufacturers and software developers to consultants
    and academics and even government agencies—would advise AT&T regarding future
    development of System V UNIX, although AT&T would retain its proprietary control.
    By 1991, UI''s membership reached more than 200 from a dozen countries or so.
    Although some overlap existed between the lower-rank members of OSF and UI, no
    such overlap existed among principal members and sponsors.


    Let''s step back a bit because of the relevance to Linux. The year 1987 saw the
    birth of MINIX, a much smaller Unix-like operating system written by professor
    Andrew S. Tanenbaum of Vrije Universiteit in Amsterdam,'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'Holland. This OS was written from scratch—meaning that it contained no AT&T
    code—for university instruction. MINIX is mentioned again in the next section
    because it was Linus Torvalds'' springboard to Linux.


    In 1993, Novell purchased AT&T et al.''s UNIX Systems Laboratories, which included
    the source code to System V R4 (System V, Release 4), the amalgamation of System
    V, BSD, and XENIX as well as the UNIX trademark. Novell then negotiated with X/Open
    to give X/Open the UNIX trademark. This deal gave X/Open the power to bless any
    new operating system as a version of UNIX if it met X/Open standards. One of those
    standards is XPG4.2 (X/Open Portability Guide 4.2), which includes several *Portable
    Operating System Interface for UNIX* (POSIX) standards developed by the *Institute
    of Electrical and Electronic Engineers* (IEEE) for operating system interfaces.
    (For example, POSIX.1 is the application program interface standard for the C
    language, and POSIX.2 is the shell and utility interface standard.) Later in 1995,
    Novell sold its UNIXWare (including the source code) to SCO, which continues to
    develop UNIX to the present day.


    In this brief history of UNIX, a great deal has been left out. UNIX development
    has continued on many fronts in the 1980s and 1990s and into the new millennium.
    To cover it all and to do it justice would require an entire book. But before
    proceeding, we should mention that X/Open and OSF eventually merged, forming the
    Open Group in 1996. The Open Group still strives to promote, develop, and license
    open standards software, especially UNIX.


    # Multics—Epilogue


    You might wonder what happened to Multics. It was, indeed, eventually developed.
    The first Multics system was unveiled by MIT and the remaining Multics partners
    in 1969—late and not without problems. GE had jurisdiction over future Multics
    development, which it sold—along with its entire computer business—to Honeywell
    Corporation in 1970. Nevertheless, Multics systems were installed in several locations.


    Development during the 1970s included a new storage system, using the new concepts
    of logical and physical volumes to give it better recovery capabilities. Also,
    in 1977, the first commercial relational database was installed on a Multics system
    at Honeywell in Phoenix. Multics was used by MIT, the U.S. Air Force, GM, Ford,
    and the University of Southwest Louisiana and was purchased by a large number
    of organizations in Europe in the 1980s.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'In 1985, Honeywell canceled further development of Multics. Over the next three
    years, however, they made several attempts to revive it, as did a few other companies
    who wanted to buy Multics. In 1988, Honeywell transferred maintenance of Multics
    to the University of Calgary, Canada. That university set up a corporation called
    ACTIC Technologies, which was eventually renamed Perigon Systems. Perigon was
    acquired by the CGI Group in late 1998. We called CGI in the late summer of 2000
    and were told that they had just put their last Multics system to sleep. Later,
    in the fall of 2000, we heard that Canada''s Department of National Defence located
    the last-known (well, rumored, anyway) Multics system, apparently located in Halifax,
    Nova Scotia, Canada.


    Although that seems to be the end of Multics systems, we would just like to acknowledge
    and congratulate those who were involved in its development, deployment, configuration,
    administration, and maintenance for all those years. Bravo, and thank you. Without
    your courage and pioneering spirit, who knows what the state of *information technology*
    (IT) would be today?


    # ## History of Linux


    Any history of Linux would be remiss if it did not mention MINIX, because it was
    on a MINIX USENET newsgroup bulletin board (comp.os.minix) that Linus Torvalds
    posted his now-legendary notices, one of which we quote from later in this section.
    As mentioned, MINIX was a small UNIX-like operating system written by Professor
    Tanenbaum. Like several other versions of UNIX, MINIX was written from scratch,
    with no AT&T code, for university instruction. It is useful for anyone who wants
    to learn the basics of UNIX operation. It is available free on the Internet at
    www.cs.vu.nl/~ast/minix.html. We suggest that you visit the site. You will find
    out how MINIX has evolved and learn about the two current versions (MINIX 2.0
    for Intel CPUs from 8088 to Pentium and MINIX 1.5 for Intel, Macintosh, Amiga,
    Atari, and SPARC). You will also find out about the special copyright on MINIX
    by publisher Prentice Hall. MINIX is basically a type of public domain property.


    In 1991, Linus Torvalds, a student at the University of Helsinki in Finland, created
    Linux. He wanted to develop an operating system that would exceed MINIX’s modest
    standards. In August 1991, shortly after creating his Linux version 0.01, he published
    the following message to the comp.os.minix newsgroup:'
