    # # The vi Editor


    Linux provides several text editor programs, from the simplistic vi to the more
    elegant Emacs. The main reason for discussing vi (the visual front end for the
    actual editor, ex) in its own chapter is that you are likely to run into it no
    matter what type of UNIX-related system you encounter. The vi editor is on almost
    every system because it requires comparatively little space and still does the
    job adequately. When you look for it, please remember that it might not be called
    vi exactly, but it will be called something similar (such as vim).


    The vi editor can be a bit of a tough slog, but you will need it to deal with
    Linux or with any other UNIX-based operating system on a regular basis. Another
    reason for dedicating a chapter to vi is that it does not have a lot of interactive
    help (or any other kind). It does have a man page, however. Because vi fronts
    for ex, you can also check the man page for ex.


    Before you begin editing text, you might want to determine which other text editors
    are available on your system. Some are installed automatically as part of the
    base system; others are installed only during custom (or expert) installations.
    Check your /bin directory for names that might be familiar to those we will mention
    here. Or, check your installation guide or'
