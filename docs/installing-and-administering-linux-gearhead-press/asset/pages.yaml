    enhanced by the `egrep` and `fgrep` commands.


    # egrep: Searching for Alternates


    The `grep` command itself cannot be used for the type of search request where
    you want to find all strings containing one item or another. The extended `grep`
    command, `egrep`, enables OR searches by letting you put a pipe symbol ( | ) between
    your specified alternate search expressions, as shown in Example 8.14. The `egrep`
    command also works with `grep`’s metacharacters and options. The `egrep` command
    is a little slower than a normal `grep`, mostly because it executes more than
    one `grep` process.


