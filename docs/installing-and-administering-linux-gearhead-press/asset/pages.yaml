  md: '![](img/cae5c706c216875d12d4b7d28144cc71_357_0.png)


    **Figure 11.1** Relationships between environments.


    **User-defined variables.** Defined by a user when a shell script is written.
    Users can use and modify these variables anytime within a shell program.


    The shell uses all these variable types to define a user''s Linux session. All
    shell environment variables are case sensitive. For instance, if you define a
