- pgno: 344
  md: 'With the flexibility of the text editor features, there are issues, though.
    Please read the warning carefully.


    > **WARNING** Be careful when invoking editor features at the command line. You
    might get unpredictable (and thus, inconvenient) results. Plus, if you try to
    turn off vi features (with set o v1, for instance), you might succeed in turning
    off v1 features but you might also turn off previous bash command-line features.
    It could leave you almost helpless at the command line. You might have to log
    out and log back in again to regain your previous command-line utility. That sounds
    easy, but because your command-line functionality is severely reduced, you will
    have trouble keying in logout. Try using the j and k keys to move up and down
    through your command history to find a logout command somewhere.


    The “ambush” described in the warning is the reason why we approach even the updating
    of this section of the book with caution. It seems like just checking on these
    commands can get us into trouble. Hopefully, you will not suffer any similar inconvenience.


    # Related vi Editors


    Here is a quick summary of other editors loaded by Linux that are related to the
    vi editor:


    +   - view is the read-only version of vi. Changes cannot be saved unless overridden
    by using an exclamation mark.

    +   - ex is a line-oriented text editor, but it can access vi''s screen-editing
    capabilities.

    +   - ed is a line-oriented text editor with no visual or screen capabilities.


    Check the /bin directory for any of those names. You can then experiment with
    them by invoking them at the command line by using a syntax like the following:


    ```

    $ ex filename<Enter>

    ```


    You also might be fortunate enough to have Emacs, an elegant and powerful visual
    screen text editor. Unfortunately, Emacs uses a lot of disk storage, so it is
    not installed universally. But it ships with some Linux distributions and is available
    on the Internet.'
