  img_proc: true
- pgno: 288
  md: 'We have already seen examples of the use of aliases in Examples 11.2 (the *etc/bashrc*
    file) and 11.4 (the *.bashrc* file).


    An alternative to creating command names using *alias* is to write a shell script
    to do the same thing. Because a new *alias*-created command is an internal shell
    command, however, the shell gives it precedence over any script you might have
    created to do the same thing. In addition, creating shell scripts involves using
    a text editor such as *vi*, and testing and using shell scripts requires you to
    give the script files the proper permissions. Then, you have to make sure that
    the *PATH* variable includes a reference to the location of the shell script so
    that it can be found and executed. Of course, sometimes a shell script is just
    what you want or need, especially when you want to do something more complex (for
    example, executing a sequence of commands automatically when you log in). Still,
    from the standpoint of creating, testing, and executing, the use of the *alias*
    command is a more simple and straightforward technique.


    # ## Examining Existing Aliases and Creating New Ones


    You can use the new *alias* by itself as a command, or you can add arguments to
    it. But the arguments must pertain to the command (if there is more than one command
    within the alias, the arguments must pertain to the last command).


    For investigating what aliases might already exist, here is the syntax:


    ```

    $ alias<Enter>

    ```


    And for creating new aliases, the syntax is


    ```

    $ alias (-options)newaliasname=''commandname (-options)[arguments]''<Enter>

    ```


    For instance, assume that you have a new alias, l, which is equivalent to ls -1.
    If you want to see hidden files too, you should type l -a at the prompt.


    By adding aliases to global function and alias files, the system administrator
    can make those aliases available to all or specific groups of other users. In
    Example 9.5, we first use the alias command alone to view the aliases that have
    already been defined in our profile, function, and alias files.'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# Example 9.5 Using the alias Command to Check for Existing Aliases and to
    Create New Ones


    To find existing aliases, use


    ```

    $ alias<Enter>

    alias dir-p=''ls -l | more''

    alias which=''type -path''

    ```


    He found two: dir-p, which he created in a previous section, and which, the default
    alias that helps us identify commands.


    To create three new aliases for common functions to reduce lengthy key-boarding,
    use


    ```

    $ alias l=''ls -l.''<Enter>

    $ alias p=''ps f.''<Enter>

    $ alias r=''fc -e -.''<Enter>

    ```


    To check that the new aliases are listed with the original two, use


    ```

    $ alias<Enter>

    alias dir-p=''ls -l | more''

    alias which=''type -path''

    alias l=''ls -l''

    alias p=''ps f''

    alias r=''fc -e -''

    ```


    Next, he used the alias command with arguments to create three new aliases. Two
    of them perform listing functions: alias l=''ls -l'' creates a long listing of
    the non-hidden files and subdirectories in your current directory, and alias p=''ps
    f'' creates a list of processes and indicates which child processes were spawned
    by which parent processes. The last alias (alias r=''fc -e -'') is a shorthand
    form for “repeat the last or immediately previous command.” Finally, we use the
    alias command by itself again to verify that the three new aliases were created.


