    # # Customizing the User Environment


    In this section, we describe the sources of most environment variables and mention
    the roles of several programs, initialization scripts, and other files that you
    use from the time you boot your system until you successfully log in. Then, we
    will look at how you can customize your environment depending on your job functions,
    maybe, or depending on your other needs or preferences.


    # ## Setting Default Shell Variables During Bootup and Login


    We will focus on logging into a bash shell; the other shells use a slightly different
    but similar process. The compiling of environment variables from their respective
    files is shown in Figure 11.2. It is not meant to be totally comprehensive, but
    it is sufficient for this introductory-level discussion. As you can see from Figure
    11.2, the values for some variables can be “updated” as additional files are consulted
    during the login process. From version to version, we have noticed that Linux
    developers have worked to eliminate this redundancy.


    But, if you have logged in and you notice that the value of one or another variable
    is not what you expect, then it might be worth checking which files contain the
    variable and in what order the environment was configured. (Here, we use the broadest
    definition of *files* as collections of data or byte streams; some of these files
    are programs, scripts, and the like and are not strictly data files.)


    Okay, assume that you are logging in at your terminal, which you have already
    booted. Already, during the course of booting, the *init* program (commonly regarded
    as the parent of all system processes because it is the first program that the
    kernel executes; it is even given the PID of 1) has already executed, or caused
    to be executed, several system initialization scripts. Those scripts—the primary
    one being /etc/rc.d/rc.sysinit—define the system initialization environment and
    other parameters regarding security and other system features that reflect your
    company’s policies. The /etc/profile shell script (which contains system-wide
    environment variables'
