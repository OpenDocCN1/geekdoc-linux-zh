- pgno: 225
  md: '# ## Redirecting Error Messages to a File


    Occasionally, you will want to collect error messages from scripts or shell programs
    for future reference or for troubleshooting. One application for this type of
    redirection is system error logging or network analysis.


    Here is the syntax for destructive redirection of error output to a file:


    ```

    $ command 2> filename<Enter>

    ```


    The difference between error redirection and general redirection is the inclusion
    of the 2 before the right angle bracket symbol ( > ).


    The following is the syntax for redirecting and appending error output (that is,
    for nondestructive redirection) to a file, which is a similar format to redirecting
    output in general:


    ```

    $ command 2>> filename<Enter>

    ```


    > It is important to remember that the operator symbols for standard error redirection
    are 2> and 2>>, with no spaces between the characters.


    # ### Example 7.21 Redirecting Error Output to a File


    Juana has provided Nicholas with a copy of her RFL_Tel3 telephone listing file.
    He wants to compare it with Frostun''s new RFL_et_al_Tel# file, the one Frostun
    mentioned to him at lunch. See how the standard error output from Nicholas'' next
    command, to cat RFL_Tel3 and /root/RFL_et_al_Tel#, goes directly to the screen
    or system console:


    ```

    $ cat RFL_Tel3 /root/RFL_et_al_Tel#<Enter>

    Emergencies - +34 91 800 09 87

    Human Resources - +34 91 900 55 87

    Fax/Mail Room - +34 91 555 32 10

    Web Site Design/Management - +34 958 55 19 21

    cat: /root/RFL_et_al_Tel#: Permission denied

    ```


    Nicholas now tries a variation of the previous procedure. He redirects the /root/RFL_et_al_Tel#
    error message to the errfile file (new or existing) and then uses cat to read
    the error message:


    ```

    $ cat RFL_Tel3 /root/RFL_et_al_Tel# 2> errfile<Enter>

    Emergencies - +34 91 800 09 87

    Human Resources - +34 91 900 55 87

    Fax/Mail Room - +34 91 555 32 10

    ```'
