    # 6.5.3.2 Print Formatting Print formatting allows users to change how variables
    and memory are displayed. Sometimes it is more useful to print an integer in hexadecimal
    format, and other times it helps to see it in decimal format. The most basic way
    (that is, without formatting) to see the value of a variable is with the print
    <variable_name> command.


    ```

    (gdb) print stackVar

    $1 = 10

    ```


    You can specify what format you want to display in. For example, to see it in
    hex, use the /x argument:


    ```

    (gdb) /x stackVar

    $2 = 0xa

    ```


    Notice how the value of the variable is always preceded by a dollar sign with
    a number followed by an equal sign. This is because GDB is automatically assigning
    and storing the value printed to an internal variable of that name. GDB calls
    these *convenience variables*. For example, you can later reuse the newly created
    $1 in other calculations in this debugging session:


    ```

    (gdb) print $1 + 5

    $3 = 15

    ```'
