    # 7 Source Code


    When a program is compiled with the -g compile switch, GDB will automatically
    recognize that there are debug symbols and will display all the debug information
    it can. This includes the source code for the program you are debugging. You can
    use the list command to display relevant lines of source code. You can change
    which lines of source code and how many of them are printed with various arguments
    passed to the list command.


