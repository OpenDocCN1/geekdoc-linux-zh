    registers, use the `info all-registers` GDB command.


    Last, you can display the value of individual registers by GDB by referring to
    them with a $ prepended:


    ```

    (gdb) print $eax

    1 = 0

    ```


    Most of the time you''ll just need to know the value of a particular register
    as it is used by the assembly language. For more information on the register conventions
    for each hardware platform, refer to the corresponding vendor documentation. Each
    hardware platform will have different registers and assembly language.


    > Note: Okay, so far in this chapter we''ve covered a lot of basics such attaching
    to a process, looking at data, displaying register values, and so. As we get further
    into this chapter, the focus will shift more and more from usage to examples.
    The next section is where the transition starts.


    # 6.6 Execution


    The GDB execution commands give you full control over a process. Of course these
    commands do not work when using a core file because there is no process to control.
    This section of the chapter will introduce some of the most commonly used commands
    for controlling a live program. It will also present some of the more advanced
    and lesser known tips and tricks that can make your debugging session more efficient.'
