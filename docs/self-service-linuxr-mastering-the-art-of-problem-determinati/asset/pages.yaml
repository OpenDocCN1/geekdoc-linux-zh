  md: '# 9.6 Sections and the Section Header


    # 9.6.1 String Table Format


    The string table contains a list of all strings that are used by the ELF specification.
    The string table is very simple. It is a range of space that contains a list of
    NULL terminated strings, one after the other. The strings are indexed by offset
    from the beginning of the file, the same offset as base address for the shared
    library or executable.


    There be a number of string tables in an ELF file, including one for the dynamic
    symbol table, one for the main symbol table, and one for the section header names.
    String tables all have the same simple format:


    ```

    <string1>0<string2>0<string3>0..<stringN>0\0

    ```


    An index into a string table will point to the start of a string.


    # 9.6.2 Symbol Table Format


    A symbol table is an array of ELF symbol structures that describe a function,
    variable, or other type of symbol. As discussed at the beginning of this chapter,
    a symbol table is like a phone book for functions and variables in an ELF file.


    There are actually two symbol tables for an ELF file. One is called the dynamic
    symbol table and is used at runtime to find the various symbols in the ELF object.
    The other is the main symbol table and contains all of the symbols for an ELF
    object, including static symbol information that is not used at runtime. The main
    symbol table is used at link time to find all of the unresolved symbols.


    Each element of the array has the following structure (from /usr/include/elf.h):


    ```

    typedef struct {

    Elf32 Word    st_name;      /* Symbol name (string tbl index) *//

    Elf32 Addr    st_value;     /* Symbol value **/

    Elf32 Word    st_size;       /* Symbol size **/

    unsigned char st_info;     /* Symbol type and binding *//

    unsigned char st_other;    /* Symbol visibility **/

    Elf32 Section st_shndx;   /* Section index *//

    } Elf32_Sym;

    ```


    The st_name field is the string table index for the name of the symbol (Note:
    The dynamic and main symbol tables both have their own string table). The "value"
    is either the offset in the ELF file, the address of the symbol when it will be
    loaded, or the offset in the sections that contains the symbol. Executables will
    have values that are actual addresses; whereas, shared libraries will have offset'
