    # 6.4.1 Running a Program Off the Command Line with GDB


    You should run a program through GDB if you want to be in control of the program
    from the beginning of its execution. For example, you might need to set a breakpoint
    (explained further down) in a function that runs immediately after the program
    starts up. This could be for a C/C++ program where a function is simply called
    after the start up of a program or for a C++ program where some global constructors
    are triggered even before the main() function is called.


    To run a program from within GDB, simply use GDB with the program as the only
    argument. When you first run GDB in this way, the program is not actually started
    until you run the command inside GDB. If you call run without setting a breakpoint,
    the program will normally run until it exits or hits a trap. Here is a quick example:


    ```

    penguin> hang.C -g -o hang

    penguin> gdb

    gnu gdb s.2.1

    ```


