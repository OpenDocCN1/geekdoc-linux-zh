  md: '# 1.3 The Four Phases of Investigation


    The following example shows a very structured and well laid investigation log.
    With some experience, you''ll find the format that works for you. As you read
    through it, it should be obvious how useful an investigation log is. If you had
    to take over this problem investigation right now, it should be clear what has
    been done and where the investigator left off.


    ```

    Time of occurrence: Sun Sep 5 21:23:58 EDT 2004

    Problem description: Product Y failed to start when run from a cron

    Job.

    Symptom:

    ProdY: Could not create communication semaphore: 1176688244 (EEXIST)

    ```


    What might have caused the problem: The error message seems to indicate that the
    semaphore already existed and could not be recreated.


    Theory #1: Product Y may have crashed abruptly, leaving one or more IPC resources.
    On restart, the product may have tried to recreate a semaphore that it already
    created from a previous run.


    Needed to prove/disprove:


    +   # The ownership of the semaphore resource at the time of the error is the
    same as the user that ran product Y.

    # That there was a previous crash for product Y that would have left the IPC resources
    allocated.


    Proof: Unfortunately, there was no information collected at the time of the error,
    so we will never know the owner of the semaphore at the time of the error. There
    is no sign of a trap, and product Y always leaves a debug file when it traps.
    This is an unlikely theory that is good given we don''t have the information required
    to make progress on it.


    Theory #2: Product X may have been running at the time, and there may have been
    an IPC (Inter Process Communication) key collision with product Y.


    Needed to prove/disprove:


    +   # Check whether product X and product Y can use the same IPC key.

    # Confirm that both product X and product Y were actually running at the time.


    Proof: Started product X and then tried to start product Y. Ran "strace" on product
    X and got the following message:


    ```

    ion 618% str -o productX.trace prodX

    ion 619% grep |sem| productX.trace

    semget(1176688244, 1, 0) = 399270884

    ```'
