    \ optimizations, one of the costs is increased code size. Again, reading the GCC\
    \ man page and manual will detail exactly what each of the options and levels\
    \ do and how they affect size, but in general code size will increase proportionally\
    \ with the optimization levels 1, 2, and 3. There also exists -O0, which will\
    \ optimize the code for size. This is good consideration for the AMD Opteron-based\
    \ architecture, for example, as the cache size is relatively small at 1MB.\n\n\
    To illustrate how much the compiler optimization can affect binaries, let's use\
    \ the following very simple code and call simple.c:\n\n```\n#include <stdio.h>\n\
    \nint add_them_up( int a, int b, int c )\n{\n    return a + b + c;\n}\n\nint main(\
    \ void )\n{\n    int a = 1;\n    int b = 2;\n    int c = 3;\n    int z = 0;\n\
    }\n\nz = add_them_up( 1, 2, 3);\nprintf(\"Answer is: %d\\n\", z);\n\n    return\
    \ 0;\n\n```\n\nNext, produce two separate assembly listings—one compiled with\
    \ -oo and one with -o3 by doing the following:\n\n```\n$penguin gcc -o0 -S simple.c\n\
    $penguin$ -ahlm simple.s > simple.out.no-opt\n$penguin$ gcc -o3 -S simple.c\n\
    $penguin$ -ahlm simple.s > simple.out.opt\n```\n\nThe output of -o3 will produce\
    \ a lot of additional symbol information that we're generally not interested in.\
    \ Omitting the uninteresting parts of simple.out.no-opt, here's the produced output:\n\
    \n```\n10 .globl add_them_up\n11 .type add_them_up, @function\n12 add_them_up:\n\
    13 .LFB3:\n14 .file 1 \"simple.c\"\n```"
