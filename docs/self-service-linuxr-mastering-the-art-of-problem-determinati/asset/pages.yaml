  md: '# 1.4 TECHNICAL INVESTIGATION


    The first section of this chapter introduced some good investigation practices.
    Good investigation practices lay the groundwork for efficient problem investigation
    and resolution, but there is still obviously a technical aspect to diagnosing
    problems. The second part of this chapter covers a technical overview for how
    to investigate common types of problems. It highlights the various types of problems
    and points to the more-in-depth documentation that makes up the remainder of this
    book.


    # 1.4.1 Symptom Versus Cause


    Symptoms are the external indications that a problem occurred. The symptoms can
    be a hint to the underlying cause, but they can also be misleading. For example,
    a memory leak can manifest itself in many ways. If a process fails to allocate
    memory, the symptom could be an error message. If the program does not check for
    memory errors, the lack of memory could cause a trap SIGSEGV) If there is not
    enough memory to log an error message, it could result in a trap because the kernel
    may be unable to grow the stack (that is, to call the error logging function).
    A memory leak could also be noticed as a growing memory footprint. A memory leak
    can have many symptoms, although regardless of the symptom, the cause is still
    the same.


    Problem investigations always start with a symptom. There are five categories
    of symptoms listed below, each of which has its own methods of investigation.


    +   - Error

    - Crash

    - Hang (or very slow performance)

    - Performance

    - Unexpected behavior/output


    1.4.1.1 Errors (and/or warnings) are the most frequent symptoms. They come in
    many forms and occur for many reasons including configuration issues, operating
    system resource limitations, hardware, and unexpected situations. Software produces
    an error message when it can''t run as expected. Your job as a problem investigator
    is to find out why it can''t run as expected and solve the underlying problem.


    Error messages can be printed to the terminal, returned to a Web browser or logged
    to an error log file. A program usually uses what is most convenient and useful
    to the end user. A command line program will print error messages'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# 1.4 Technical Investigation


    to the terminal, and a background process (one that runs without a command line)
    usually uses a log file. Regardless of how and where an error is produced, Figure
    1.3 shows some of the initial and most useful paths of investigation for errors.


    Unfortunately, errors are often accompanied by error messages that are not clear
    and do not include associated actions. Application errors can occur in obscure
    code paths that are not exercised frequently and in the full impact (and reason)
    for the error condition is not known. For example, an error message may come from
    the failure to open a file may have been meant to read the configuration for an
    application. An error message of “could not open file” may be reported at the
    point where the error occurred and may not include any context for the severity,
    purpose, or potential action to solve the problem. This is where strace and ltrace
    tools can help out.


    +   - The error message (this might actually help!)

    - Use trace,

    - Use the trace facility in the application, if available

    - Search the Internet

    - Scan through the source code (if you have it)

    - Try to get the stack trace in gdb


    ![](img/f8e4ea98e89e9d2b5bd054d231ecdbba_52_0.png)


    Many types of errors are related to the operating system, and there is no better
    tool than strace to diagnose these types of errors. Look for system calls (in
    the trace output) that have failed before the error is printed to the terminal
    or logged to a file. You might see the error message printed via the write() system
    call. This is the system call that printf, `perror`, and other print-like functions
    use to print to the terminal. Usually the failing system call is very close to
    where the error message is printed out. If you need more information than what
    strace provides, it might be worthwhile to use the ltrace tool (it is similar
    to the trace tool but includes function calls). For more information on strace,
    refer to Chapter 2.


    If strace and ltrace utilities do not help identify the problem, try searching
    the Internet using the error message and possibly some key words. With many Linux
    users on the Internet, there is a chance that someone has faced the problem before.
    If they have, they may have posted the error message and a solution. If you run
    into an error message that takes a considerable amount'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# Best Practices and Initial Investigation Chap. 1


    of time to resolve, it might be worthwhile (and polite) to post a note on USENET
    with the original error message, any other relevant information, and the resulting
    solution. That way, if someone hits the same problem in the future, they won''t
    have to spend as much time diagnosing the same problem as you did.


    If you need to dig deeper (strace, ltrace, and the Internet can''t help), the
    investigation will become very specific to the application. If you have source
    code, you can pinpoint where the problem occurred by searching for the error message
    directly in the source code. Some applications use error codes and not raw error
    messages. In this case, simply look for the error message, identify the associated
    error code, and search for it in source code. If the same error code/message is
    used in multiple places, it may be worthwhile to add a printf() to differentiate
    between them.


    If the error is unclear, strace and ltrace couldn''t help, the Internet didn''t
    have any useful information, and you don''t have the source code, you might still
    be able to make progress with GDB. If you can capture the point in time in GDB
    when the application produces the error message, the functions on the stack may
    give you a hint about the cause of the problem. This won''t be easy to do. You
    might have to use break points on the write() system call and check whether the
    error message is being written out. For more information on how to use GDB, refer
    to Chapter 6, “The GNU Debugger (GDB)."


    If all else fails, you''ll need to contact the support organization for the application
    and ask them to help with the investigation.


    # 1.4.1.2 Crashes Crashes occur because of severe conditions and fit into two
    main categories: traps and panics. A trap usually occurs when an application references
    memory incorrectly, when a bad instruction is executed, or when there is a “page-in”
    (the process of bringing a page from the swap area into memory). A panic in an
    application is due to the application itself abruptly shutting down due to a severe
    error. The main difference is that a trap is a crash that the hardware and OS
    initiate, and a panic is a crash that the application initiates. Panics are usually
    associated with an error message that is produced during the panic. Applications
    on Unix and Linux often panic by calling the abort() function (after the error
    message is logged or printed to the terminal).


    Like errors, crashes (traps and panics) can occur for many reasons. Some of the
    more popular are included in Figure 1.4.'
