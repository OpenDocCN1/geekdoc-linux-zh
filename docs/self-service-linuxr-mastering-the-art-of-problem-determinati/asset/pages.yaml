    # 6.6.1 The Basic Commands


    The following table summarizes the most common and most useful execution control
    commands:


    | Action | Command | Notes |

    | --- | --- | --- |

    | Execute the next source code line and not go into functions | next <N> | Requires
    debug symbols and source code. The optional argument sets the number of lines
    of source code to step through. Functions will be skipped over (but called under
    the covers). |

    | Execute the next source code line and do go into functions | step <N> | Requires
    debug symbols and source code. The optional argument sets the number of lines
    of source code to step through. |

    | Execute the next assembly instruction and not go into functions | next <N> |
    The optional argument sets the number of instructions to step through. Functions
    will be skipped over (but called under the covers). |

    | Execute the next assembly instruction and do go into functions | step <N> |
    The optional argument sets the number of instructions to step through. |

    | Continue execution | continue | |

    | Continue execution until the current stack frame returns | finish | |

    | Continue execution at a specific address | jump <address> | Use with caution.
    Jumping directly to an address can cause unexpected behavior that the registers
    may not have been set properly to run the target instruction. |

    | Continue execution until a source line or location greater than the current
    location or the location specified | until | |

    | Call a function in the program | call <function> | |

    | Manually stop execution of the program | CTRL-C |


