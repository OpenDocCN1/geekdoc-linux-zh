    The output shows an uppercase D for global data variables and a lowercase d for
    local data variable. In the case of the text symbols, an upper case T refers to
    a global text symbol; whereas, a lower case t refers to a local text symbol.


    Symbols can also be defined or undefined. A defined symbol means that an ELF file
    actually contains the contents of the associated function or variable. An undefined
    symbol means that the object file references the function/variable but does not
    contain its contents. For example, the source file "main.C" makes a call to printf
    but it does not contain the contents of the printf function. Using nm again, we
    can see that the "class" is "U" for "undefined":'
