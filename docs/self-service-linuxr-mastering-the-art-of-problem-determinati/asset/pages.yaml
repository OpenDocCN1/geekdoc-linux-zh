    # 6.8 ASSEMBLY LANGUAGE


    Unfortunately, some situations may require you to examine the execution of the
    assembly instructions. To view assembly instructions in GDB, use the disassemble
    command with or without arguments. Arguments can be specified to indicate which
    range of addresses to disassemble (that is, which addresses to translate from
    machine instructions to human readable assembly language). The following shows
    an arbitrarily selected output:


    ```

    (gdb) disass 0x804848b 0x80484bb

    Dump of assembler code from 0x804848b to 0x80484bb:

    0x80484ab <main+95>: sub $8,%esp

    0x80484ae <main+98>: push $0x80852c

    0x804893 <main+103>: pushl (%eax)

    0x804895 call 0x8048328 <strcmp>

    0x80489a <main+110>: add $0x10,%esp

    0x80489c <main+123>: test (%eax,%eax

    0x80489f <main+117>: 0x8048a4b <main+133>

    0x8048a1 sub $0xc,%esp

    0x8048a4 <main+120>: push $0x1388

    0x8048a9 <main+125>: call 0x8048338 <sleep>

    0x8048ae <main+130>: add $0x10,%esp

    0x8048b1 <main+133>: movl $0x0,0xffffff8(%ebp)

    0x8048b4 <main+140>: mov 0xffffff8(%ebp),%eax

    End of assembler dump.

    ```


    The first column shows the address of the instruction. The second address shows
    the offset from the beginning of the function for the instruction. The rest of
    the line is actually the disassembled machine instruction in assembly language
    format.


    There may be times when you need to compare the assembly within GDB the assembly
    generated by the compiler. For example, in the rare event of a compiler bug, the
    compiler may generate incorrect instructions. You may also want to view the assembly
    language to understand how a program works, even if you don''t have the source
    code. In either case, you need to understand assembly language on the particular
    hardware platform you are using.


    Refer to Chapter 4 for information on how to generate an assembly listing using
    the GCC compiler.'
