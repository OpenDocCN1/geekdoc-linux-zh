- img_proc: true
  md: 'A system call is a special type of function that is run inside the kernel.
    It provides fair and secure access to system resources as disk, network, and memory.
    System calls also provide access to kernel services such as inter-process communication
    and system information.


    Depending on the hardware platform, a system call may require a gate instruction,
    a trap instruction, or other mechanism to switch from the user code to the kernel.
    The actual mechanism is not really important for this discussion but rather that
    the call is switching from user mode directly into the kernel. It may help to
    explain this concept by comparing how a function and a system call work.


    A function call is fairly simple to understand as shown in the following assembly
    language (be me if you are not familiar with IA-32 assembly language):


    ```

    80483e8 <_Zbari:

    80483e8:      55             push %ebp

    80483e9:      89 e5           mov %esp,%ebp

    80483eb:      83 0c sub $0x8,%esp

    80483ee:      83 0c sub $0x8,%ebp

    80483f1:      68 4e 61 bc 00 push $0xc614e

    80483f6:      6a 61           push $061

    80483f8:      e8 cf ff ff ff call 80483cc <_Z3fooci>

    80483fd:      83 c4 10       add $0x10,%esp

    8048400:     c9             leave

    8048401:     c3             ret

    ```


    The call instruction will jump to a function called foo (note: foo is mangled
    because it was compiled as a C++ function). The flow of execution always remains
    in the application code and does not require the kernel. The instructions for
    foo are just as easily examined, and a debugger can follow the call to foo without
    any issue. All instructions perform a single, specific action that is defined
    by the underlying hardware.


    > Note: In the preceding example, the arguments to function foo are pushed on
    the stack by the function bar and are then subsequently used inside of foo. Arguments
    are passed into functions using a special convention called procedure calling
    convention. The procedure convention also defines how return values are passed.
    This ensures that all of the functions for a program are using the same method
    to store and retrieve arguments when calling a function.


    > Note: For more information on assembly language and procedure calling conventions,
    refer to Chapter 5, "The Stack."'
