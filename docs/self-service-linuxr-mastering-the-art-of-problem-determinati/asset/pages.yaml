    The stack''s functionality is implemented at many levels of a computer including
    low-level processor instructions. On x86 for example, the pop and push instructions
    are specifically for placing data on and removing data from the stack respectively.
    Most architectures also supplied dedicated registers for using and managing the
    stack. On x86 and x86-64, the bp and sp registers (for "base pointer" and "stack
    pointer"—see following sections) are used. They are named slightly differently
    for each architecture in a prefix is used to indicate the size of the register.
    For x86, the prefix letter "e" is used to indicate a size of 32-bit, and for x86-64
    the prefix letter "r" is used to indicate a size of 64-bit.


    # 5.5.1 The BP and SP Registers


    The bp, or base pointer (also referred to as frame pointer) is used to hold the
    address of the beginning or end of the current frame. The purpose of this is that
    a common reference point for all local stack variables can be used. In other words,
    stack variables are referenced by the bp register plus an offset. When working
    in a particular stack frame, the value of this register will never change. Each
    stack frame has its own unique bp value.


    The sp, or stack register is used to hold the address of the end of the stack.
    A program''s assembly instructions will modify its value when new space is needed
    in the current frame for local variables. Because the sp'
