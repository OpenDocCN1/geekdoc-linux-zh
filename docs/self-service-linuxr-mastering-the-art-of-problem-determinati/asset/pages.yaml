  md: '# OTHER


    The history and evolution of the Linux operating system is fascinating and certainly
    still being written with new twists popping up all the time. Linux itself comprises
    only the kernel of the whole operating system. Granted, this is the single most
    important part, but everything else surrounding the Linux kernel is made up of
    GNU free software. There are two major things that GNU software and the Linux
    kernel have in common. The first is that the source code for both is freely accessible.
    The second is that they have been developed to be developed by thousands of volunteers
    throughout the world, all connecting and sharing ideas and work through the Internet.
    Many refer to this collaboration of people and resources as the Open Source Community.


    The Open Source Community is much like a distributed development team with experience
    spanning many different areas of computer science. The source code that is written
    by the Open Source Community is available for anyone and everyone to see. Not
    only can this make determination easier, having such a large and diverse group
    of people looking at the code can reduce the number of defects and improve the
    security of the source code. Open source software is open to innovations as much
    as criticism, both helping to improve the quality and functionality of the software.


    One of the most common concerns about adopting Linux is service and support. However,
    Linux has the Open Source Community, a wide range of freely available problem
    determination tools, the source code, and the Internet itself as a source of information
    including numerous sites and newsgroups dedicated to Linux. It is important for
    every Linux user to understand the resources and tools that are available to help
    them diagnose problems. That is the purpose of this book. It is not intended to
    be a replacement to a support contract, nor does it require one. If you have one,
    this book is an enhancement that will be to help you make the most of your existing
    support contract.'
