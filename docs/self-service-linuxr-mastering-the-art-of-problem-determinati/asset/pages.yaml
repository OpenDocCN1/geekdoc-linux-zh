  md: '# 7.2 Gathering Information


    dumping the CS register. The dumping of the CS register shows us that the current
    privilege level (CPL) was 0. This number corresponds to which permission or ring
    level the trap occurred.


    > Note: Ring level is a term used to refer to what permissions code has when running
    on a CPU. Ring 0 has unlimited access, therefore kernel runs at ring 0. Ring 3
    is for user processes. On Linux, ring levels 1 and 2 are unused.


    The [ffffffff813ae64] is a dumping of the RIP register. This means that the instruction
    pointer was pointing to the instruction at memory address 0xffffff813ae64 at the
    time the trap occurred. Note the RIP address is printed out by another function,
    the kernel calls to perform more work.


    The [proc_dointvec_trap_kernel+84] is the result of the kernel translating the
    RIP address into a more human readable format. proc_dointvec_trap_kernel is the
    name of the function in which the RIP lies. The +84 means that the RIP is at an
    offset of decimal 84 in the proc_dointvec_trap_kernel function. This value is
    extremely useful in determining exactly what caused the trap, as we will see in
    “Determining the Failing Line of Code” section.


    The next several lines are dumping of the registers and their contents:


