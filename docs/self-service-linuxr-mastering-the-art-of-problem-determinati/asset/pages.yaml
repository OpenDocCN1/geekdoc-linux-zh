    1.3.4.2.6 Tips on Opening Bug Reports in Bugzilla When you open a bug report in
    Bugzilla, you are asking someone else to look into the problem for you. Any time
    you transfer a problem to someone else or ask someone to help with a problem,
    you need to have clear and concise information about the problem. This is common
    sense, and the information collected in Phase #3 will pretty cover what is needed.
    In addition to this, there are some Bugzilla specific pointers, as follows:


    +   - Be sure to properly characterize the bug in the drop-down menus of the bug
    report screen. See as an example the new bug form for GCC’s Bugzilla, shown in
    Figure 1.2. It is important to choose the proper version and component because
    components in Bugzilla have individual owners who notified immediately when a
    new bug is opened against their components.


    +   - Enter a clear and concise summary into the Summary field. This is the first
    and sometimes only part of a bug report people will look at, so it is crucial
    to be clear. For example, entering Compile aborts is very bad. Ask yourself the
    same questions others would ask when reading this summary: “How does it break?”
    “What error message is displayed?” and “What kind of compile breaks?” A summary
    of gcc -foo.c -03 for gcc3.4 throws sigsegv is much more meaningful. (Make it
    part of your lurking to get a feel for how bug reports are usually built and models
    accordingly).


    +   - In the Description field, be sure to enter a clear report of the bug with
    as much information as possible. Namely, the following information should be included
    for all bug reports:


    +   - Exact version of the software being used

    - Linux distribution being used

    - Kernel version as reported by uname -a

    - How to easily reproduce the problem (if possible)

    - Actual results you use - cut and paste output if possible

    - Expected results - detail what you expect to see


    Often Bugzilla databases include a feature to attach files to a bug report. If
    this is supported, attach any files that you feel necessary to help the developers
    reproduce the problem. See Figure 1.2.'
