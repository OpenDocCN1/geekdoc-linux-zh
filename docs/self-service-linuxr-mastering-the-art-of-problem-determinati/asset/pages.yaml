  md: '# Compiling Chap. 4


    This type of compilation error is very common when portant applications from one
    platform to another, for example from IBM AIX to Linux or Sun Solaris to HP-UX.
    This simply means that the developers of each respective compiler interprets the
    C/C++ Standards and implements them differently.


    # 4.4.4 General Compilation Problems


    When compiling your code, compilation errors are often very easy to resolve. When
    downloading source from reputable locations on the Internet, resolving compilation
    errors can be very difficult. It can be especially difficult if the source that
    has been downloaded has been officially released and tested thoroughly. The instant
    thought is that it is a user error and you must be doing something wrong. This
    isn''t always the case though, as I''ll intend to point out.


    Reiterating what was stated, compilation errors are generally due to one or a
    combination of the following reasons:


    +   1. Environment/setup errors or differences

    2. Compiler version differences or bugs

    3. User error

    4. Code error


    # 4.4.4.1 Environment/Setup Errors or Differences


    There are an infinite number of ways to configure Linux system environments, so
    the chances for a setup or environment error are fairly high. Further adding to
