    # 4.4 COMPILING THE LINUX KERNEL


    Thanks to Linux''s open source policy, users are free to choose any kernel they
    wish to compile it and even make changes if they desire! Making changes to a kernel
    does not require that you are a kernel developer or even a programmer. There are
    a plethora of patches available on the Internet from those who are programmers
    and kernel developers.


    > Note: A patch is a set of any number of source code changes referred to as diffs
    because they are created by the diff (1) utility. A patch can be applied to a
    source of files effectively acting as an automatic source code modification system
    to add features, fix bugs, and make other changes.


    Caution does not be exercised if you are not confident with this task, as the
    kernel is the brain of the operating system; if it is not working properly, bad
    things will happen, and your computer may not even boot.


    It is important to know roughly how to compile a Linux kernel in case the need
    arises. Here''s a perfect example—when the 2.6 kernel was officially released
    in December 2003, the new kernel did not appear in any distributions for several
    months. Even though lot of features found in the mainline 2.6 kernel source have
    been back-ported to the major distributions! 2.4-based products, there are still
    many fundamental features of the 2.6 kernel that have not been back-ported, which
    makes it very attractive. The only option at that point in time was to obtain
    the 2.6 source code and compile the kernel manually. It is not the intention of
    this book to go into detail on how to do this because there is a great deal of
    information commonly available to do so. Rather, the intention of this book is
    to help you troubleshoot and solve problems that may arise during this process
    on your own and with the help of others if need be. Linux is a massive project,
    and there are an infinite number of different system configurations—problems are
    a very real possibility.


    # 4.4.1 Obtaining the Kernel Source


    The Linux source for all releases, including development/test releases, is found
    at patches kernel.org. Kernel source can be downloaded as one complete archive
    or as patches to a specific kernel level. The archives are available as compressed
    tar files. For example, the full 2.4.24 source tree is available on kernel.org
