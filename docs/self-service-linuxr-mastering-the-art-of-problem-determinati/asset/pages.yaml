  md: "# ELF: Executable and Linking Format Chap. 9\n\nAnother consideration is unwanted\
    \ recursion. Some libc functions such as fopen will call other libc functions\
    \ such as malloc under the covers. If we override malloc, we have to be aware\
    \ that calling fopen from within malloc might eventually and recursively (because\
    \ we're already in malloc) call malloc.\nIn any case, here is the source for an\
    \ example interception library for malloc, free, and realloc:\n\n```\nintercept.c:\n\
    /* Here are the declarations needed to make all of this compile.\nCopying these\
    \ directly from a system header would normally be a very bad idea. Here, we must\
    \ do to avoid any system headers */\ntyped unsigned long int size_t;\n\n/* Function\
    \ definitions for the strong text symbols. The function\nnames should match that\
    \ of their counterparts exactly with the\nexception of having different function\
    \ names. */\nvoid *_libc_malloc(size_t size);\nvoid *_libc_realloc(void *ptr,\
    \ size_t size);\nvoid _libc_free(void *ptr);\n\n/* Actual function used to override\
    \ malloc, free and realloc */\nvoid *malloc(size_t size)\n{\n    void *rptr ;\n\
    \n    printf(\"malloc\" : Requested block size: %u\\n\", size );\n\n    rptr =\
    \ _libc_malloc( size );\n\n    printf(\"malloc\" : ptr of allocated block: %p\\\
    n\", rptr );\n\n    return rptr;\n}\n\nvoid free(void *ptr)\n{\n    printf(\"\
    free\" : freeing block: %p\\n\", ptr );\n\n    return _libc_free( ptr );\n}\n\n\
    void *realloc(void *ptr, size_t size)\n{\n    void *rptr ;\n```"
