  md: '# 1.3 The Four Phases of Investigation


    # 1.3.3.1 Best Practices for Complex Investigations


    1.3.3.1.1 Collect the Relevant Information When the Problem Occurs** Earlier in
    this chapter we discussed how changes can cause certain types of problems. We
    also discussed how changes can remove evidence for why a problem occurred in the
    first place (for example, changes to the amount of free memory can hide the fact
    that it was once). In the former situation, it is important to collect information
    because it can be compared to information that was collected at a previous time
    to see if any changes caused the problem. In the latter situation, it is important
    to collect information before the changes on the system wipe out any important
    evidence. The longer it takes to resolve a problem, the better the chance that
    something important will change during the investigation. In either situation,
    data collection is very important for complex problems.


    Even reproducible problems can be affected by a changing system. A problem that
    occurs one day can stop occurring the next day because of an unknown change to
    the system. If you''re lucky, the problem will never occur again, but that''s
    not always the case.


    Consider a problem that occurred many years ago where application trap occurred
    in one xterm (type of terminal window) but not in other. Both xterms were on the
    same system and were identical in every way (so, it seemed at at first) but still
    the problem occurred only in one. Even the list of environment variables was the
    same except for the expected differences as PWD (present working directory). After
    logging out and back in, the problem could not be reproduced. A few days later
    the problem came again, only in one xterm. After a very complex investigation,
    it turned out that an environment variable PWD was the difference that caused
    the problem to occur. This is as simple as it is. The contents of the PWD environment
    was not the cause of the problem, although the difference in size of PWD between
    the two xterms forced the stack (a special memory segment) to slightly move up
    or down in the address space. Sure enough, changing PWD to another value made
    the problem disappear or recur depending on the length. This small difference
    caused the different behavior for the application in the two xterms. In one xterm,
    a memory corruption in the application landed without on an inert part of the
    stack, causing no side-effect. In the other xterm, the memory corruption landed
    on a pointer on the stack (the long description of the problem is beyond the scope
    of this chapter). The pointer was dereferenced by the application, and the trap
    occurred. This is a very rare problem but is a good example of how small and seemingly
    unrelated changes or differences can affect a problem.


    If the problem is serious and difficult to reproduce, collect and/or write down
    the information from 1.3.1: Initial Investigation Using Your Own Skills.'
