    # What IS THIS BOOK ABOUT?


    In a nutshell, this book is about effectively and efficiently diagnosing problems
    that occur in the Linux environment. It covers good investigation practices, how
    to use the information and resources on the Internet, and then dives into detail
    describing how to use the most important problem determination tools that Linux
    has to offer.


    Chapter 1 is like a crash course on effective problem determination practices,
    which will help you to diagnose problems like an expert. It covers where and how
    to look for information on the Internet as how to start investigating common types
    of problems.


    Chapter 2 covers trace, which is arguably the most frequently used problem determination
    tool in Linux. This chapter includes both practical usage information as well
    as details about how trace works. It also includes source code for a simple trace
    tool and details about how the underlying functionality works with the kernel
    through the ptrace interface.


    Chapter 3 is about the /proc filesystem, which contains a wealth of information
    about the hardware, kernel, and processes that are running on the system. The
    purpose of this chapter is to point out and examine some of the more advanced
    features and tricks primarily related to problem determination and system diagnosis.
    For example, the chapter covers how to use the SysRq Kernel Magic hotkey with
    /proc/sys/kernel/sysrq.


    Chapter 4 provides detailed information about compiling. Why does a book about
    debugging on Linux include a chapter about compiling? Well, the beginning of this
    preface mentioned that diagnosing problems in Linux is different than that on
    commercial environments. The main reason behind this is that the source code is
    freely available for all of the open source tools and the operating system itself.
    This chapter provides vital information whether you need to recompile an open
    source application with debug information (as is often the case), whether you
    need to generate an assembly language listing for a tough problem (that is, to
    find the line of code for a trap), or whether you run into a problem while recompiling
    the Linux kernel itself.'
  merge: -1
