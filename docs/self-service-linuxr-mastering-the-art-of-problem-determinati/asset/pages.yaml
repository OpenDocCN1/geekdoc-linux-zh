  md: '# CHAPTER 3


    # # The /proc Filesystem


    # ## 3.1 INTRODUCTION


    One of the big reasons why Linux is so popular today is the fact that it combines
    many of the best features from its UNIX ancestors. One of these features is the
    /proc filesystem, which it inherited from System V and is a standard part of all
    kernels included with all of the major distributions. Some distributions provide
    certain things that others don''t, so there is no standard /proc specification;
    therefore, it should be used with a degree of caution.


    The /proc filesystem is one of the most important mechanisms that Linux provides
    for examining and configuring the inner workings of the operating system. It can
    be thought of as a window directly into the kernel''s data structures and the
    kernel''s view of the system. It appears to the user as a filesystem just like
    / /home, so all the common file manipulation programs and system calls can be
    used with it as cat(1), more(1), grep(1), open(2), read(2), and write(2)¹. If
    permissions are sufficient, writing values to certain files is also easily performed
    by redirecting output to a file with the > shell character from a shell prompt
    or by calling the system call write(2) within an application.


    The goal of this chapter is not to be an exhaustive reference of the /proc filesystem,
    as that would be an entire publication in itself. The goal is to point out and
    examine some of the more advanced features and tricks primarily related to problem
    determination and system diagnosis. For more general reference, I recommend reading
    the proc(5) man page.


    > Note: If you have the kernel sources installed on your system, I recommend reading
    /usr/src/linux/Documentation/filesystems/procfs.txt.


    ¹ When Linux operation names are appended with a number in parentheses, the number
    directly refers to a man page section number. Section 1 is for executable programs
    or shell commands, and section 2 is for system calls (functions provided by the
    kernel). Typing man 2 will read the read system also call man page from section
    2.


    89'
