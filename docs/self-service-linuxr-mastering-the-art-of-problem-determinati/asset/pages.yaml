    # 4.5.1 Purpose of Assembly Listings


    Applications, especially large ones such as database management systems or Web
    servers, will often include problem determination features used to dump information
    to log files, which can be examined later to determine the location and cause
    of a particular problem. In smaller applications, a debugger can be used to gather
    necessary information for tracking the cause of the problem (see Chapter 6, “The
    GNU Debugger (GDB)” for more information). For speed and binary size reasons,
    application’s binaries are as close to machine language as possible and contain
    very little readable information. When a problem arises whenever the execution
    of the binaries, techniques are needed to convert the machine language into something
    human readable to be able to determine the cause of the problem. This could mean
    compiling the application with the -g flag, which will add extra debugging symbols
    to the resulting code binaries. These debug symbols are read by debuggers that
    will combine them with the assembly language interpretation of the machine language
    to make the binaries as human readable as possible. This adds a great deal of
    size overhead to the resulting binaries and is often not practical for everyday
    production use. What this means is that extra knowledge and skill is required
    by whoever is examining the problem because the highest level of readability is
    achieved using the assembly level.


    The ultimate objective whenever a problem such as a segmentation fault or bus
    error occurs is to convert the machine location of the trap into a high-level
    source line of code. When the source line of code is obtained, the developer can
    examine the area of code to see why the particular trap has occurred. Sometimes
    the problem will be instantly obvious, and other times more diagnostics will be
    needed.


    So how does one determine the machine language or assembly location of the trap?
    One way is to dump diagnostic information to a log file from an application’s
