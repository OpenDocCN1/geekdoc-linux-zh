  md: '# 9.6 Sections and Sector Header Table


    The instruction at 0xb8cb makes a call to 0xbd0. This seems a bit strange because
    that is the next instruction to run anyway—but this does have a purpose. The instruction
    at 0xb8 puts the current instruction address into EBX. The instruction at 0xb8d1
    adds a hard-coded value 0x1468 to this.


    ```

    0x8d0+0x1468 = 0x1d38.

    ```


    This is where the GOT is located. For quick reference, here is the information
    for the GOT section again:


    ```

    | penguin| readelf -s libfoo.so | egrep .got |

    | [20] .got PROGBITS 00001d38 000d38 000003c 04 WA 0 0 4

    ```


    Later in the assembly, there is a call at 0x8ee that adds 28 to the value in EBX,
    which finds the offset for glob.


    ```

    EBX(0x1d38) + 0x28 = 0x1d60

    ```


    From the relocation information just listed, this matches the value of the relocation
    entry for globInt:


    ```

    00001d60 00002006 R_386_GLOB_DAT 00001b20 globInt

    ```


    The next instruction at 0x8f4 dereferences the value for globInt to the GOT to
    find the actual address of globInt.


    > Note: This is a very good example of how the text segment relies on the data
    segment being at a specific offset. In this case, it expects the GOT to be 0x1468
    from a particular instruction. If the data section (which contains the GOT) was
    ever loaded in the wrong place, the hard-coded reference to the GOT would be inaccurate.


    # 9.6.3.8 .hash This is the symbol table. Because humans need to use symbol names
    (that is, function and variable names), ELF must implement a quick way to find
    the various symbol names to find the corresponding symbol.


    We know the symbol table in an ELF file is simply an array Without a hash table
    of some sort, finding a symbol in this array would require a linear search of
    the array until the symbol is found or until the end of the symbol table is reached.
    This might not be too bad for a one-time search, but the typical ELF file contains
    many symbols (possibly thousands). A linear search for each of these during run
    or for the linker (ld) would not be practical.


    The hash mechanism in ELF is illustrated in Figure 9.3.'
