    # 6.4.2 Attaching to a Running Process


    Attaching to a running process with GDB is usually done when it is difficult to
    get a process in the debugger at a key point in its execution. There are situations
    where the startup procedure for an application is complex that it forks or exec
    other processes, and you want to attach to one of the forked or execed processes
    only. You might also need to attach to a process that is only started in a client-server
    model. In other words, a remote client might start a local process you cannot
    start manually from a command line. Another example of when it is useful to attach
    to a process when a problem has already occurred and you need to attach to the
    process to debug it.


    To demonstrate attaching GDB to a running process, let''s use the little hanging
    program, hang, again:


    ```

    penguin> hang system

    ```


    This simply causes the process to hang in a system call so that we can attach
    to the process with GDB:


