- img_proc: true
  md: 'The stack trace. The stack trace can help you understand why the trap occurred.
    The functions that are higher on the stack may have passed a bad pointer to the
    lower functions causing a trap. A stack trace can also be used to recognize known
    types of traps. For more information on stack backs refer to Chapter 5, "The Stack."


    The register dump. The register dump can help you understand the "context" under
    which the trap occurred. The values of the registers may be required to understand
    what led up to the trap.


    A core file or memory dump. This can fill in the gaps for complex investigations.
    If some memory was corrupted, you might want to see how it was corrupted or look
    for pointers into that area of corruption. A core file or memory dump can be very
    useful, but it can also be very large. For example, a 64-bit application can easily
    use 20GB of memory or more. A full core file from such an application would be
    20GB in size. That requires a lot of disk storage and may need to be transferred
    to you if the problem occurred on a remote and inaccessible system (for example,
    a customer system).


    Some applications use a special function called "signal handler" to generate information
    about a trap that occurred. Other applications simply trap and die immediately,
    in which case the best way to diagnose the problem is through a debugger such
    as GDB. Either way, the same information should be collected (in the latter case,
    you need to use GDB).


    A SIGSEGV is the most common of the three programming signals: SIGSEGV, SIGBUS
    and SIGILL. A bad programming signal is sent by the kernel and is usually caused
    by memory corruption (for example, an overrun), bad memory management (that is,
    a duplicate free), a bad pointer, or an uninitialized value. If you have the source
    code for the tool or application or some knowledge of C/C++, you can diagnose
    the problem on your own (with some work). If you don''t have the source code,
    you need to assembly language to properly diagnose the problem. Without source
    code, it will be a real challenge to fix the problem you''ve diagnosed.


    For memory corruption, you might be able to pinpoint the stack trace that is causing
    the corruption by using watch points through GDB. A watch point is a special feature
    in GDB that is supported by the underlying hardware. It allows you to stop the
    process any time a range of memory is changed. You know the address of the corruption,
    all you have to do is to recreate the problem under the same conditions with a
    watch point on the address that gets corrupted. More on watch points in the GDB
    chapter.'
