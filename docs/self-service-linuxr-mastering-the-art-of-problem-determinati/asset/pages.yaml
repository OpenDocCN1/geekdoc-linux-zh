    # 4.6 COMPILER OPTIMIZATIONS


    High-level source compilers have the complex task of converting human readable
    source code into machine-specific assembly language. This task is complicated
    by various optimization options and levels that are applied during compilation.
    The intent here is not to give an exhaustive reference of what each optimization
    option and level does, but rather to make you aware of what compiler optimizations
    can have on your resulting binaries and the ability to debug them. For simplicity,
    only GCC will be discussed.


    There are several optimization levels that perform varying degrees of optimization.
    For GCC, these levels are specified with the -o parameter immediately followed
    by zero or one level specifies. -o implies -o1, which is the first optimization
    level. Refer to the gcc(1) page for more information and to see exactly which
    specific options that controlled with a flag are enabled at each level. It''s
    important to understand that the -o2 and -o3 perform additional optimizations
    that consume more resources during compile time but likely result in faster binaries.


    A crucial aspect of compiler optimizations to understand is that debugging abilities
    are inhibited as more optimizations are performed. This is because for optimizations
    to work, the compiler must be free to rearrange and manipulate the resulting assembly
    code in any way it wishes, while of course not changing the desired programming
    logic. Because of this, a line of C code, directly to a small set of assembly
    instructions becomes more difficult. This results in a trade-off that the developer
    must deal with. Having the application run as fast as possible is one of an important
    goal, but if the application cannot be easily debugged and serviced, huge customer
    satisfaction issues could occur. A good compromise is to use the -o2 optimization
    level. Excellent optimizations are performed while the ability to debug is still
    within reach. It''s also important to understand that if a real bug exists, it
    will exist at any optimization level. Therefore when a bug is compiled with -o2
    for example, simply recompile with -o0 and the same bug should occur. The application
    can then be debugged with a debugger, which will easily allow the developer to
    examine all variables and step through individual lines of source.'
