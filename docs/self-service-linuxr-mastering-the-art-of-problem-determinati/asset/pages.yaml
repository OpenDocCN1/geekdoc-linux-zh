  md: "# 9.6 Sections and the Section Header Table\n\nFor the interested reader, here\
    \ is the hash algorithm as specified in the ELF standard:\n\n```\nunsigned long\
    \ ElfHash(const unsigned char *name)\n{\n    unsigned long h=0, g;\n    while\
    \ (*name)\n    {\n        h = (h << 4) + *name++;\n        if (g = h & 0x0000000)\n\
    \            h^= g >> 24;\n        h &= -g;\n    }\n    return h;\n\n```\n\n#\
    \ 9.6.3.9 .init This section contains executable instructions required for initialization\
    \ of an ELF object. It is almost identical to the .fini section except that the\
    \ information is for initialization, not finalization. The .init section contains\
    \ a function called _init in the same way that the .fini section contains a function\
    \ called _fini. The _init function is responsible for initializing variables (including\
    \ objects) for an ELF library or executable. Notice in the output that the address\
    \ of the _init function matches the address of the .init section:\n\n```\npenguin>\
    \ readelf -S foo |grep \"\\.init\"\n[10] .init PROGBITS 080484b4 000484b4 000018\
    \ 00 AX 0 4\npenguin> nm foo 080484b4\n080484b4 T _init\n```\n\nLet's dig a bit\
    \ deeper to see how the init section works (which is very similar to how the .fini\
    \ section works). We'll start by looking at a global C++ object defined in main.c,which\
    \ eventually is compiled into the executable called foo:\n\n```\nmyClass myObj3;\n\
    The class \"myClass\" is defined as follows:\nclassClass {\npublic:\n    int myVar;\n\
    \    myClass() {\n        myVar = 5;\n    }\n};\n\n```\n\n;"
