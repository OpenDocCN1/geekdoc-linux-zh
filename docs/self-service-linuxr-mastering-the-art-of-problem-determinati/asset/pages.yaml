  md: '# 7.2 Gathering Information


    Generally, the default communications settings will suffice. Next, on the source
    machine run the following as root assuming the null-modem cable connected to the
    first serial port on the computer (/dev/ttyS0):


    ```

    stty 38400 < /dev/ttyS0 ; echo ''This should appear on the remote machine'' >/dev/ttyS0

    ```


    The message, "This should appear on the remote machine," should appear in the
    communications program on the serial console. If it does not, some things to check
    for


    +   - The cable is in fact a null-modem cable.

    - The cable is connected to the first serial port on the server; if it isn''t,
    change/dev/ttyS0 to /dev/ttyS0 and try again.

    - The serial console communication program is listening on the correct serial
    port.

    - The speed is set to 38400 on the serial console in the communications program.


    # 7.2.4 Enabling the Serial Console at Startup


    When you''ve verified that the serial console works, the next step is to configure
    Linux to send important messages over the serial connection. This is generally
    done by booting with time with most boot loaders, or it can be added permanently
    to the boot loader''s configuration file. The additional parameter should look
    like this:


    ```

    console=ttyS0,38400

    ```


    Note that this shouldn''t replace any existing console- parameter but should be
    inserted before instead. It is important to maintain any existing console=tty
    parameters so as not to render the virtual consoles unusable. For my system, I
    use GRUB, and for menu.list entry to enable the serial console:


    ```

    title Linux

    kernel (hd0,7)/boot/mlinux-2.4.21-99-default root=/dev/hda8 vga=0x0314

    plash=silent desktop hdc=ide-scsi hdclun=0 showopts console=/dev/ttyS0

    console=/dev/tty0

    initrd (hd0,7)/boot/initrd-2.4.21-99-default

    ```'
