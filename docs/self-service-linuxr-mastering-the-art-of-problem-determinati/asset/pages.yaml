  md: '# The GNU Debugger (GDB) Chap. 6


    A good deal of documentation already exists for GDB, but most of this documentation
    is similar to a command reference. This chapter is different and focuses on how
    and when to use GDB and will also reveal many of the hard-to-find tips used to
    tackle difficult problems.


    Last, this chapter can be used to translate existing knowledge about other debuggers
    to the corresponding GDB commands. As users migrate from Windows and Unix-based
    operating systems, they need to translate their existing knowledge into the corresponding
    Linux equivalent. Many of these people already have the skills necessary to be
    an expert on Linux, and a book like this one will help them translate the knowledge
    to the Linux environment.


    # When To Use A Debugger


    A debugger is usually used for a problem in a tool or application that cannot
    be solved through the application''s inherent problem determination factors (error
    logs, error messages, and so on) or through the system-level problem determination
    tools. A debugger is especially useful when source code is available (as is often
    the case on Linux).


    Having the source code usually means able to rebuild a tool or application with
    debug information such as variable names, information that links the source code
    to a line of code, type information, and so on. Having the source code also means
    being to step through the source code to debug a problem instead of having to
    step through machine instructions.


    Source code clearly makes using a debugger much easier, but in general debuggers
    are fantastic tools for:


    +   Point-in-time debugging. This is all of the evidence you need is available
    right now. In other words, you won''t need any history of what led up to the problem.


    +   When a problem can be easily reproduced.


    +   When the problem behavior can be predicted. If you know the behavior of a
    problem, you can set a breakpoint in a function or on a condition and wait for
    the predicted behavior to occur.


    +   When a problem can be localized to a small period of time. This means that
    the problem will occur shortly after a predictable point in time.


    Debuggers become less useful when the cause(s) of a problem span a long history
    or for a problem that is difficult to predict in nature. In both cases you might
    want to consider adding trace points in the application or use the existing trace
    facility to understand the problem better.'
