    # 6.5.3 Examining Memory and Variables


    Besides looking at the stack, looking at the contents of memory and variables
    is probably the next most useful feature of a debugger. In fact, you will spend
    most of your time in a debugger looking at variables and/or the contents trying
    to understand what is going wrong with a process.


    # 6.5.3.1 Variables and Scope and Type in C/C++ program


    Variables in a class have different scope depending on how they were declared.
    A global variable is a variable that is defined to be externally visible all of
    the. A static variable can be declared in the scope of a file or in a function.
    Static variables are not visible externally and are treated in a special way.
    An automatic variable is one that declared inside a function and is only available
    on the stack while the corresponding function is running and has not finished.
    Here is a quick overview of how to declare the variables with the three scopes
    (this is important to understand how to handle each type in GDB).


    ```

    Global variable:

    int foo = 6 ;

    ```'
