  md: "# 6.11 Threads\n\nfrom memory and then start to use the list based on the size.\
    \ While thread #1 is reading through the list, thread #2 could change the list\
    \ or the size of the list, leading to inconsistent information for thread #1.\
    \ If thread #1 reads through the list before thread #2 changes it, there would\
    \ be no problem. Likewise, if thread #1 reads quickly (before thread #2) gets\
    \ a chance to actually make changes), there would be no problem. Race conditions\
    \ are often difficult to reproduce because changes that affect timing (such as\
    \ attaching GDB) can change the order or duration of events, effectively masking\
    \ the problem.\n\nAnother challenging problem type when using threads is a multi-threaded\
    \ memory corruption. In this case, one thread reads the memory (and the corrupted\
    \ data) at some point in the future. This is a challenging type of problem because\
    \ the symptom of the problem can be very disconnected from the original cause\
    \ (and it can be difficult to tie the two together).\n\nWatchpoints can really\
    \ help with multi-threaded memory corruptions, but unfortunately, watchpoints\
    \ are generally not well supported with threads in GDB (at least not Linux). The\
    \ main problem is that GDB can only watch an address in a single thread. In other\
    \ words, if you set a waypoint for writes to an address from thread #1, it will\
    \ not be triggered if thread #2 writes to the watched address. This limits the\
    \ usefulness of watchpoints for threaded applications!\n\nIf the program or application\
    \ has some type of trace facility, it may be worth to check or dump the address\
    \ range that gets corrupted (if you know it) regularly or for every trace point.\
    \ This way, you can narrow down the area of code that is corrupting the memory\
    \ to the functions that were captured in the trace the time that the corruption\
    \ occurred. Unfortunately, because of the lack of watchpoint support for multi-threaded\
    \ processes, GDB might not be the best tool for debugging a multi-threaded corruption.\
    \ In any case, let's explore what GDB can do with multi-threaded processes.\n\n\
    The following program is used to illustrate the basic thread support in GDB. The\
    \ program creates one thread that uses up stack space up to a certain amount or\
