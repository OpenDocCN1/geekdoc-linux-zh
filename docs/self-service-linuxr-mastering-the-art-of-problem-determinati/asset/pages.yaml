- img_proc: true
  md: '# 6.5.2 Stack


    The stack is important because it contains information about “where” in the code
    a process is running. The stack contains one stack “frame” for each unfinished
    function that called another. This leads to a hierarchical chain or stack of function
    callers and callees. The functions on the stack have not finished—in other words,
    each function will continue if the they finished. A “stack trace” or “back trace”
    is the list of functions in the stack. In GDB, the backtrack of bt command will
    dump the stack trace for the process currently being debugged:


    ```

    (gdb) backtrace

    # 0x0040d6fb in pause () from /lib/i686/libc.so.6

    # 0x008048d0 in function4 (param=97 ''a'') at gdb_stack.c:9

    # 0x008048e9 in function3 (string=0xbffff30 "This is a local string") at gdb_stack.c:16

    # 0x008048a3 in function2 (param=3) at gdb_stack.c:23

    # 0x00804844 in function1 () at gdb_stack.c:31

    # 0x0080487d in main () at gdb_stack.c:38

    ```


    From this stack trace (a.k.a. back trace), we know that the main() function called
    function(), and that function() called function2(), and so forth. The last on
    the stack is pause (). If pause finishes (that is, exits), function4 will continue.
    If function4 finishes, function3 will continue, and so on.


    Note that in this output the arguments, filename, and line number for all functions
    except pause () are shown. This is because gdb_stack.c (a little program specifically
    for this example) was compiled with -g to include debug symbols, but the source
    used to create libc.so.6, where pause is contained, was not. If the program was
    built without -g, we would only know the address of the program counter for each
    stack frame and not the line of code.


    > Note: Some distributions strip their shared libraries, removing the main symbol
    table and other information. However, there is usually a non-stripped shared library
    (such as libc6-dbg.so) that contains the main symbol table and additional information
    useful for debugging.


    The function names themselves are not stored in each stack frame. The function
    names are too long, and the reality is that function names are not much to use
    to computer. Instead each stack frame contains the saved instruction pointer or
    program counter. The saved program counter can be translated into the function
    name by looking at the address of the program counter and the instruction of the
    library or executable that is loaded in region of memory.'
