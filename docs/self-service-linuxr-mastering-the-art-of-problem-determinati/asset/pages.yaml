    The first system call of interest is the fork to create another process. This
    fork call is required to eventually spawn the /bin/ls program. The next interesting
    system call is the wait4 call. This waits for any child processes of the strace
    program to change state. The process that stops is the child process of the previous
    fork call (pid: 16474). Shortly after the wait, there is a call to ptrace with
    the PTRACE_SYSCALL value for the first argument. The man page for ptrace states:


    ```

    TRACE_SYSCALL, PTRACE_SINGLESTEP

    ```


    Restarts the stopped child as for PTRACE_CONT, which arranges for the child to
    be at the next entry or to exit a system call, or after execution of a single
    instruction, (The child will also, as usual, be stopped upon receipt of a signal.)
    From the parent''s perspective, the child will have been stopped by receipt of
    a SIGTRAP. So, PTRACE_SYSCALL, for example, the idea is to inspect the arguments
    to the system call at the first step, then do another PTRACE_SYSCALL and inspect
    the return value of the system call at the second stop. (addr ignored).


    So the strace is waiting for the child process to stop and then starts it in such
    a way that it will stop on the next entry or exit of a system call. After the
    second call to wait4, there are a number of calls to ptrace with PTRACE_PEEKUSER
    as the first argument. According to the ptrace man page, this argument does following:


    ```

    TRACE_PEEKUSER

    ```


    Reads a word at offset addr in the child''s USER area, which holds the registers
    and other information about the process (see <linux/user.h> and /sys/user.h>).
    The word is returned as the result of the ptrace call. Typically the offset must
    word-aligned, though this might vary by architecture. (Data is ignored.)


    From this information, it appears that strace is reading information from the
    user area of the child process. In particular, it can be used to get the registers
    for the process. The registers are used for the arguments of system calls as per
    the calling conventions for system calls. Notice the second to last system call
    that writes the strace output to the terminal. The /bin/ls program just called
    the uname system call, and the strace output printed the information about that
    system call to the terminal.


