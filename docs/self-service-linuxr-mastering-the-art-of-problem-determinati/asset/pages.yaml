  md: '# 9.6 Sections and the Section Header Table


    Figure 9.4 shows the important sections that are needed to explain relocation.
    The text segment contains the procedure linkage table (PLT), relocation sections,
    and the executable code. The data segment contains the global and static variables
    as well as the global offset table (GOT).


    A function reference first goes to the PLT to the appropriate slot. This then
    executes an address, which is stored in the corresponding slot in the GOT. The
    address in the GOT may point back to a function in the text segment, or it may
    point to a function in another shared library. In the diagram, this reference
    goes to another shared library.


    A variable reference goes directly to the GOT and to the address of the variable.
    The reference could go to another shared library (or executable) or the data segment
    of the same shared library as it does in the diagram.


    The relocation in this case can be as simple as changing the addresses stored
    in the GOT.

    Thelib.so shared library has two sections that are prefixed by .rel.


    ```

    penguin> readelf -S libfoo.so | egrep rel

    [ 6 ] .rel.dyn REL 000006e 000060 0000068 A 2 0 4

    [ 7 ] .rel.plt REL 0000070 000074 0000028 A 2 9 4

    ```


    These are relocation sections that contain entries of the form:


    ```

    typedef struct

    {

    Elf32_Addr  r_offset; /* Address */

    Elf32_Word  r_info;    /* Relocation type and symbol index */

    } Elf32_Rel;

    ```


    > Note: Other platforms use .rel sections and the corresponding Elf32_Rel structure
    (see/usr/include/elf.h for this structure).


    The r_offset field is the target address or offset that should be changed by the
    relocation. Object files, the offset is within the affected section. For shared
    libraries and executables, this is the "value" (address) of the symbol. The r_info
    field contains the relocation type and the symbol index. We can see the relocation
    information using readelf:


    ```

    penguin> readelf -r libfoo.so

    Relocation section ''.rel.dyn'' at offset 0x6e0 contains 12 entries:

    Offset Info Type Sym.Value Sym. Name

    00001b0 00000008 R_386_RELATIVE

    00001b4 00000008 R_386_RELATIVE

    ```


    ![](img/f8e4ea98e89e9d2b5bd054d231ecdbba_384_0.png)'
