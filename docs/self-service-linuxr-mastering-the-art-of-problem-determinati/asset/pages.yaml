    # 6.12 Data Display Debugger (DDD)


    GDB is a very powerful debugger, but many shy away from because it has no graphical
    interface. The Data Display Debugger (DDD) is an X11-based GUI front-end to GDB.
    It offers many powerful features that can greatly enhance any debugging session.
    It is available with most distributions—SUSE 9.0 Professional includes it in the
    package ddd-3.7.15; however, SU Linux Enterprise Server (SLES) 8 does not. SLES
    8 is compatible with SUSE Professional 8.1, so the package ddd-3.3.1-340.x86_64.rpm
    can be used from SUSE Pro 8.1. Alternatively, you can download the source tarball
    and build DDD yourself.


    The following section includes a high-level overview for those who prefer DDD
    over GDB.


    A great characteristic of DDD is that it builds on GDB''s functionality, in fact,
    the DDD GUI includes a console window in which you can type commands directly
    to GDB just if you were using it by itself. Figure 6.3 shows a freshly launched
    DDD window by executing `ddd hello` with the four main windows highlighted and
    labeled.'
