  md: '# 9.2 Concepts and Definitions


    315


    Each of the sections from the four object files is merged in a larger section
    in the shared library. The sections are also included in larger contiguous regions
    called "segments," which will eventually be loaded into memory with specific memory
    attributes as read, write, and/or execute.


    The order of information in an object file is not important. However, the order
    of information in a shared library or executable is very important because the
    goal is to move functions and variables that have similar properties into the
    specific loadable segments. The order of the segments in the shared library is:


    +   * text: read only

    * data: read/write


    The segments of this shared library are loaded into memory in order, and space
    for the variables in the .bss section is also allocated. The bss section is a
    special section that stores uninitialized variables and the space for them must
    be taken into account in the resulting shared library or executable.


    The memory attributes for the text segment are read-only to protect the data from
    changing during run time. The memory attributes of the data segment are read and
    write because the contents will need to be modified at runtime.


    The order of the data and text section relies on a shared library or executable
    is important because the offset from the text segment—on this later in the chapter
    as well.


    Like an object file, a shared library or executable will have defined and undefined
    symbols. The difference is that the linker (the program which does the linking)
    will ensure that the unresolved symbols will be satisfied through other shared
    libraries. This is a protection mechanism to ensure that the shared library or
    executable will not run into any undefined symbols during run time. Here is an
    example of the error returned when trying to link an executable with an undefined
