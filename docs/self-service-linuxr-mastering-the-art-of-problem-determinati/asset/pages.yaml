    # 9.2.4 Run Time Linking


    Run time linking is the process of matching undefined symbols with defined symbols
    at run (that is, when a program is starting up or it is running). When a program
    is compiled, the linker leaves the undefined symbols to be resolved by the run
    time linker when the program is running. Another term for run time linking is
    binding.


    Lazy binding is a term used to define a symbol resolution (linking of an undefined
    symbol with the corresponding defined symbol) the first time a function is actually
    called. This can improve the performance of program startup only a few of the
    undefined symbols may be used.


    # 9.2.5 Program Interpreter / Run Time Linker


    The program interpreter or run linker is a special library that has the responsibility
    of bringing a program up and eventually transferring control over the program.
    This includes finding and loading all of the required libraries, potentially resolving
    some of the symbols for the executable or its shared libraries, running C++ global
    constructors, and so on. Eventually, the function main() is called, which transfers
    control over the program source code.


    > Note: On Linux, the program interpreter will be similar to /lib/ld-linux.so
    or /lib/linux-ld.so.2. There is a command that follows will show the actual program
    interpreter as defined in the ELF file.


