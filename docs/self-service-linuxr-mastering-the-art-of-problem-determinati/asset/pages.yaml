  md: '# The GNU Debugger (GDB) Chap. 6


    change the current stack frame (that is, function) to perform other operations
    in that scope. For example, you can tell GDB to “finish” a function, and GDB will
    run the process until the current function (at the current stack frame) finishes
    and returns control to the function that called it.

    Unless any previous navigation has been performed, you will always be in frame
    #0 to start. This is always the “top” frame on the stack. The quickest way to
    switch stack frames is to use the frame command with the specific frame number.


    ```

    (gdb) frame 3

    #3 0x0804843a in function2 (param=3) at gdb_stack.c:23

    23

    function3(string);

    (gdb)

    ```


    You can also use the up and down commands to walk up and down frames in the stack:


    ```

    (gdb) up

    #1 0x080483d0 in function4 (a=97 ‘a’) at gdb_stack.c:9

    9

    pause();

    (gdb) down

    #4 0x00d6f0b in pause () from /lib/i686/libc.so.6

    (gdb) down

    Bottom (i.e., innermost) frame selected: you cannot go down.

    (gdb) up

    #1 0x080483d0 in function4 (a=97 ‘a’) at gdb_stack.c:9

    9

    pause();

    (gdb) up

    #2 0x080483e9 in function3 (string=0xbffff340 “This is a local string”)

    at gdb_stack.c:16

    16nfunction4( a );

    (gdb) up

    #3 0x0804843a in function2 (param=3) at gdb_stack.c:23

    23

    function3( string);

    (gdb)

    ```


    GDB won’t let you go past the beginning or the end of the stack, so you can use
    up and down without concern.


    > Note: Stacks grow toward smaller addresses on x86-based hardware, so the “bottom”
    of the stack will have the highest stack frame address. The top of the stack frame
    in GDB that has a frame number of 0 (zero) and will have the lowest numbered address
    in memory. Please also note that there is a diagram of stack traces in Chapter
    5.'
