  md: 'The panic_on_oops file is new in the 2.6.0 mainline kernel and when set to
    1, it informs the kernel to pause for a few seconds before panicking when encountering
    a BUG or an Oops. This gives the klogd an opportunity to write the Oops or BUG
    Report to the disk so that it can be easily examined when the system is returned
    to a normal state.


    3.4.2.4 printk This file contains four values that determine how kernel error
    messages are logged. Generally, the default values suffice, although changing
    the values might be advantageous when debugging the kernel.


    3.4.2.5 sem This file contains four numbers that define limits for System V IPC
    semaphores. These limits are SEMMSL, SEMMNS, SEMOPM, and SEMMN. SEMMSL represents
    the maximum number of semaphores per semaphore set; SEMMNS is the maximum number
    of semaphores for the whole system; SEMOPM is the maximum number of operations
    that can be used in a semop(2) call; SEMMN represents the maximum number of identifiers
    for the whole system. The values needed for these parameters will vary by workload
    and application, so it is always best to check your application''s documentation.


    3.4.2.6 shmall, shmax, and shmmi These files define the limits for System V shared
    memory. shmall is the limit for the total number of pages of shared memory for
    the system. shmax defines the maximum shared memory segment size. shmmi defines
    the maximum number of shared memory segments allowed for the system. These values
    are very workload-dependent and may need to be changed when running a database
    management system or a Web server.


    The basic idea is that the kernel can be interrupted to display information by
