    Likewise, every time you encounter a problem, you have a choice to make. You can
    immediately try to find the answer by searching the Internet or by asking an expert,
    or you can investigate the problem on your own. If you investigate a problem on
    your own, you will increase your skills from the experience regardless of whether
    you successfully solve the problem.


    Of course, you need to make sure the skills that you would learn by finding the
    answer on your own will help you in the future. For example, a physician may have
    little use for vast knowledge of hardwood ... although she or he may still find
    it interesting. For a physician who has one question about hardwood every 10 years,
    it may be better to just ask the expert or look for a shortcut to get the information
    she or needs.


    The first section of this chapter will outline a useful balance that will solve
    problems quickly and in many cases faster than getting a subject expert involved
    (here referred to as an expert). How is this possible? Well, getting an expert
    usually takes time. Most experts are busy with numerous other projects and are
    rarely available on a minute''s notice. Why turn to them at the first sign of
    trouble? Not only can you investigate and resolve some problems faster on your
    own, but you can become one of the experts of tomorrow.


    There are four phases of problem investigation that, when combined, will build
    your skills and solve problems quickly and effectively.


    +   1. Initial investigation using your own skills.

    2. Search for answers using the Internet or another resource.

    3. Begin deeper investigation.

    4. Ask a subject matter expert for help.


    The first phase is an attempt to diagnose the problem on your own. This ensures
    that you build some skill for every problem you encounter. The first attempt'
