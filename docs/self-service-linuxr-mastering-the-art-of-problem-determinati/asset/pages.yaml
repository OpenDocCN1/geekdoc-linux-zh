    The first two instructions are standard, used to set up the stack frame and comprise
    what is referred to as the function prologue (see Chapter 5 for more information).
    The third instruction copies an 8-byte value from the stack into the eax register.
    This is the address of the structure in memory that we want to look at. We see
    by the message "Breakpoint, 0x0804836f in foo ()" from GDB above that the next
    instruction to be executed is the copying of our address to eax 0x0804836f. Have
    the debugger execute this instruction and examine the contents of eax.


