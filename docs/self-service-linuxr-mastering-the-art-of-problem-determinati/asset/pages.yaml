- img_proc: true
  md: '# CHAPTER 7


    # Linux System Crashes and Hangs


    # 7.1 INTRODUCTION


    One of Linux''s claims to fame is stability and infrequent of system crashes and
    hangs. Development versions of the kernel are less stable, but unfortunately,
    mainstream kernel versions will also sometimes crash or hang. The beauty of Linux
    is that when this happens, users have the ability to track the problem down to
    a failing line of source code and even fix it themselves if they''re inclined!
    With proprietary operating systems, your only course of action is to contact the
    company or author(s) of the operating system and hope that they can help you.
    Anyone who has had this happen to them in the past knows that this can be the
    start of a very lengthy battle of frustration, which is still never guaranteed
    to end happily with a solution to the problem. At least with Linux, with a full
    set of debugging and diagnostic tools and some knowledge about where to look,
    one is much better armed and ready to seek and find a solution. The goal of this
    section is to discuss the many tools Linux provides to get you well on your way
    to analyzing some of the most crucial operating system problems. We will discuss
    how to set up, configure, and use a serial console; how to read and understand
    a kernel Oops report; and how to determine the failing line of source code from.


    # 7.2 GATHERING INFORMATION


    Gathering information for analysis either by you or by a support group of kernel
    developers on the Internet is the first step on the road to troubleshooting a
    serious system problem. There are really two types of serious system problems—a
    crash and a hang. A crash occurs when the kernel is aware of the problem it has
    just encountered and is able to do something about it before putting itself to
    sleep or reboot. A hang occurs when there is a deadlock within the kernel that
    happens without warning and does not give the kernel the ability to do anything
    about it. Much of the tools for tracking the cause of each type of problem are
    the same; however, with a hang some of the diagnostic information may not be available,
    as the kernel didn''t have a chance to write it to disk or the screen.'
  merge: -1
  pgno: 298
- img_proc: true
  md: '# 7.2.1 Syslog Explained


    The syslog is usually /var/log/messages but can be anywhere by modifying values
    in /etc/syslog.conf. The syslog file is a text log of messages written by the
    syslog daemon, which reads the messages directly from kernel buffers. Monitoring
    this file regularly often provide crucial hints about the general health of your
    system as disk space running out, memory being exhausted, I/O errors, device failures,
    and so on. When restarting the system after a crash or hang, this file should
    be examined first to see if anything was logged that could give a hint as to what
    might have caused the problem. When doing this, the recommended procedure is the:


    +   1. Wait for the system to fully restart.

    2. Log in or su (switch user) to root.

    3. Examine /etc/syslog.conf to determine the system log filename. For example,
    look for something like this:


    ```

    ###

    # save the rest in one file

    # *.mail.node;news.none -var/log/messages

    ```


    +   4. Open /var/log/messages (or from Step 3) in vi, less, or your favorite editor.

    5. Navigate to the end of the file.

    6. Search backward for “restart.” You should see a line like this:


    ```

    Mar 14 19:45:21 linux syslogd 1.4.1: restart.

    ```


    The messages immediately prior to the line found in Step 5 are the last messages
    logged before the system restarted. Examine them for anything suspicious.


    Generally, individual messages are composed of the following sequence of tokens:


    ```

    <timestamp> <hostname> <message origin> <message text>

    ```


    An example showing a message coming from a kernel driver:


    ```

    Mar 10 22:49:05 linux kernel: usb.c: deregistering driver serial


    <timestamp> = Mar 10 22:49:05

    <hostname> = linux

    ```'
  merge: -1
  pgno: 299
