  md: '# Best Practices and Initial Investigation Chap. 1


    As with USENET, you are free to post questions or messages to mailing lists, though
    some require you to become a subscriber first.


    # ### 1.3.3 Phase #3: Begin Deeper Investigation (Good Problem Investigation Practices)


    If you get to this phase, you''ve exhausted your attempt to find the information
    using the Internet. With any luck you''ve picked up some good pointers from the
    Internet that will help you get a jump start on a more thorough investigation.


    Because this is turning out to be a difficult problem, it is worth noting that
    difficult problems need to be treated in a special way. They can take days, weeks,
    or even months to resolve and require more data and effort. Collecting and tracking
    certain information now may seem unimportant, but three weeks from now you may
    look back in wishing you had. You might get so deep into the investigation that
    you forget how you got there. Also if you need to transfer the problem to another
    person (be it a subject matter expert or a peer), they will need to know what
    you''ve done and where you left off.


    It usually takes many years to become an expert at diagnosing complex problems.
    The expertise includes technical skills as well as best practices. The technical
    skills are what take a long time to learn and require experience and a lot of
    knowledge. The best practices, however, can be learned in just a few minutes.
    Here are six best practices that will help when diagnosing complex problems:


    +   1. Collect relevant information when the problem occurs.

    2. Keep a log of what you''ve done and what you think the problem might be.

    3. Be detailed and avoid qualitative information.

    4. Challenge assumptions until they are proven.

    5. Narrow the scope of the problem.

    6. Work to prove or disprove theories about the problem.


    The best practices listed here are particularly important for complex problems
    that take a long time to solve. The more complex a problem is, the more important
    these best practices become. Each of the best practices is covered in more detail
    as follows.'
