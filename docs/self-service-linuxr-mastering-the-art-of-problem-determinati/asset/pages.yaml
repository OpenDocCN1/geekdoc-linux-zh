    # The Toolbox


    # A.1 INTRODUCTION


    This appendix contains a listing of the best problem determination tools available
    for Linux. The list is broken down by the categories of Process Information and
    Debugging, Network, System Information, Files and Object Files, Kernel, and Miscellaneous.
    Each tool listing includes a short description of the tool, where the tool could
    be obtained, the tool’s usefulness, when generally to use the tool, and various
    notes and tips related to the tool. We recommend familiarizing yourself with each
    of these tools. You can then add them to your personal problem determination “toolbox,”
    which will put you well on your way to solving some of the toughest problems with
    which Linux could present you. The listings do not get into a deal of detail for
    each tool because the intent is to make you aware of some of the best tools out
    there. For information on each tool, the man pages, if applicable, will usually
    offer all the needed documentation. This book covers many of these in much more
    detail as well.


