    into memory. The distinction between the file size and memory size is important.
    Some segments (such as the second LOAD segment listed in the output) are larger
    in memory than disk. This is where very specific sections go, such as the .bss
    section, which does not occupy any space in the ELF file.


    The .bss section, located at the end of the data segment (the second LOAD segment
    in the output above), contains uninitialized variables. Allocating space in the
    ELF file for variables that is pointless because there are no values to store.
    However, when the data segment is loaded into memory, the additional space is
