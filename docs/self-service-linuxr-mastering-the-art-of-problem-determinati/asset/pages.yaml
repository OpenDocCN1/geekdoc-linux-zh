    The setup prior to the call looks very similar to the non-optimized assembly listing,
    but there is one significant difference. At the -02 level, the %eax register is
    pushed onto the stack for our variable z. Recall from the section on calling conventions
    that %eax always holds a procedure''s return value. The GCC optimizer at -02 is
    smart enough to know that we can simplify the return value from the call to add_them_up()
    in the %eax register and push directly onto the stack for the call. The non-optimized
    assembly takes the return value from the %eax register from the call to add_them_up()
    and copies it to the stack where the variable z is stored. This then results in
    pushing the value from where it''s stored on the stack in preparation for the
    call to printf. This is much more expensive than register access.


    Another major difference between the assembly at the -02 and -03 levels is that
    -03 also turns on the -finline-functions, as the non-optimized assembly does.
    This shows that there is some optimization done specific to the -03 level that
    results in saving an unnecessary function call. Looking at the GCC(1) page, we
