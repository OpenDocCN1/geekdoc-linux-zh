  md: 'welcome addition to the Linux bookshelves provides real insight into the black-art
    of debugging. All too often debugging books concentrate solely on the tools but
    this book avoids pitfalls by concentrating on examples. The authors dissect and
    discuss each example in detail in so doing they give invaluable insight into the
    Linux environment.


    > Richard J. Moore, IBM Advanced Linux Response Team-Linux Technology Centre


    # BRUCE PERENS'' OPEN SOURCE SERIES


    # SELF-SERVICE LINUX


    # Mastering the Art ofnProblem Determination


