    # 6.12 GDB Console Window


    The GDB console window is essentially what you get when executing GDB by itself.
    The difference is that it is being managed by DDD, so commands will be caught
    by DDD and integrated into its GUI. The beauty of the GDB console is that for
    people to just using GDB by itself and for those die-hard command-line users,
    it still has everything that they''re used to. DDD, however, enhances the GDB
    console and makes the debugging experience much easier and more efficient.


    # 6.13 Conclusion


    In an open source environment such as Linux, having a freely available debugger
    like GDB is part of the normal process of investigating. This is not necessarily
    the case on commercial operating systems because a) the debugger is often not
    free and b) the source code for the operating system and its tools is not available
    to the public. Hopefully after reading this chapter, you have a good understanding
    of what GDB can do to help with your problem determination needs Linux.'
