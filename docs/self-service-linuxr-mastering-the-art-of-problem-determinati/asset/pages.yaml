    At the time of this writing, this file is not part of the mainline 2.4.24 kernel
    but is part of the 2.6.0 source. Many distributions such as SUSE have back-ported
    it to their 2.4 kernels, however. this file provides an interface to manipulate
    the speed at which the processor(s) in your machine run,'
