  md: '# 3.2 Process Information


    Note the line:


    ```

    40000000-40018000 r-xp 00000000 03:08 6664 /lib/ld-2.3.2.so

    ```


    This shows us that /lib/ld-2.3.2.so was the first shared library to be loaded
    when this process. /lib/ld-2.3.2.so is the linker itself, so this makes perfect
    sense and in fact is the case in all executables that dynamically link in shared
    libraries. Basically what happens is that when creating an executable that will
    link in one or more shared libraries, the linker is implicitly linked into the
    executable as well. Because the linker is responsible for resolving all external
    symbols in the linked shared libraries, it must be mapped into memory first, which
    is why it will always be the first shared library to show up in the maps file.


    After the linker, all shared libraries that an executable depends upon appear
    in the maps file. You can check to see what an executable needs without running
    it and looking at the maps file by running the lld command as shown here:


    ```

    penguin> lld /bin/bash

    libreadline.so.4 => /lib/libreadline.so.4 (0x40028000)

    libhistory.so.4 => /lib/libhistory.so.4 (0x40055000)

    libncurses.so.5 => /lib/libnurses.so.5 (0x4005c000)

    libdl.so.2 => /lib/libdl.so.2 (0x400a2000)

    ibc.so.6 => /lib/i386/libc.so.6 (0x400a5000)

    lib/ld-linux.so.2 => /lib/ld-linux.so.2 (0x40000000)

    ```


    You can now correlate the list of libraries and their addresses in Figure 3.1
    and see what they look like in the maps file.


    > Note: ldd is actually a script that does many things, but the main thing it
    does is it sets the LD_TRACE_LOADED_OBJECTS environment variable to non-NULL.
    Try the following sequence of commands and see what happens:


    export LD_TRACE_LOADED_OBJECTS=1

    less


    Note: Be sure to do an unset LD_TRACE_LOADED_OBJECTS to return things to normal.'
