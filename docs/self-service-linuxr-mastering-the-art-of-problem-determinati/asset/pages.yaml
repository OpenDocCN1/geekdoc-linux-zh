    # 9.2.2.2 Shared Libraries A shared library is made of the symbols from one or
    more object files and can be loaded anywhere in the address space. There are some
    architectural restrictions that limit or guide the actual load address of shared
    libraries (any address is okay). A shared library, like an object file, has a
    list of symbols that are either defined or undefined. However, any undefined symbols
    must be satisfied through other shared libraries.


    # 9.2.2.3 Executables An executable is very similar to a shared library, although
    it must be loaded at a specific address in memory. An executable also has a function
    that is called when a program starts. For programmers, this function is called
    main; however, the actual function that is first in an executable is called start
    and is explained later in this chapter.


    The most significant part of an executable or shared library is the information
    about how and where to load the files into memory so that the machine instructions
    can be run. This information is contained in a special part of the ELF file called
    the "program header table." This is also explained in more detail later in this
    chapter.


    # 9.2.2.4 Core Files A core file is a special type of ELF file is different from
    shared libraries and executables. It is the memory image from a once-running process.
    Core files contain a number of memory segments that were originally used by the
    running process and can be loaded into a debugger for subsequent diagnosis.


    # 9.2.2.5 Static Libraries Archive files (files that end with .a), also known
    as static libraries, are not ELF files. Archive files are a convenient format
    to store other files. Technically, you can store any type of file in an archive
    file, although in practice, object files are far by the most commonly stored file
    type. Archive files contain an index of the symbols from each ELF object file
    contained within them (which crosses the boundary a bit as a generic storage format
    is concerned). A description of static libraries (and their format) is beyond
    the scope of this chapter (because they are not an ELF file type). However, their
    importance will be explained as part of the linking phase.'
