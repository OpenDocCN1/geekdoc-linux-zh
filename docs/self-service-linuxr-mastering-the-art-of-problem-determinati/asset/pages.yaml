    The trace tool is one of the most powerful determination tools available for Linux.
    It traces the thin layer (the system calls) between a process and the Linux kernel
    as shown in Figure 2.1. System call tracing is particularly useful as a first
    investigation tool or for problems that involve a call to the operating system.


    | Kernel (kernel code) |

    | Process (user code) |


    Fig. 2.1 System calls define the layer between user code and the kernel.


    System calls'
