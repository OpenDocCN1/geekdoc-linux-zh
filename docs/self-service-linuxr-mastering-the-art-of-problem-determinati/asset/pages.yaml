  md: '# 3.2 Process Information


    ```

    penguin echo $$

    2602

    penguin> ls -l /proc/self

    lrwxrwxrwx 1 root root 64 2003-10-13 08:04 /proc/self -> 2945

    penguin> cd /proc/self

    penguin> ls -1 cwd

    lrwxrxrxr 1 dbehman build 0 2003-10-13 13:00 -> /proc/2602

    penguin>

    ```


    The main thing to understand in this example is that 2945 is the process ID of
    the ls command. The reason for this is that the /proc/self link, just as all files
    in /proc, is dynamic and will change to reflect the current state at any point
    in time. The cwd link matches the same process ID as our shell process we first
    used "cd" to get into the /proc/self directory.


    # 3.2.2 /proc/<pid> in More Detail


    With the understanding that typing "cd /proc/self" will change the directory to
    the current shell''s /proc/directory, let''s examine the contents of this directory
    further. The commands and output are as follows:


    ```

    penguin> cd /proc/self

    penguin> ls -l

    total 0

    -r--r---- 1 dbehman build 0 2003-10-13 13:34 cmdline

    lrwxrxrxr 1 dbehman build 0 2003-10-13 13:34 cwd -> /proc/2602

    -r--r---- 1 dbehman build 0 2003-10-13 13:34 environ

    lrwxrxrxr 1 dbehman build 0 2003-10-13 13:34 exe-> /bin/bash

    -dr-x--x 2 dbehman build 0 2003-10-13 13:34 fd

    -r--r---- 1 dbehman build 0 2003-10-13 13:34 mapped_base

    -r--r---- 1 dbehman build 0 2003-10-13 13:34 maps

    -rw-r--r-- 1 dbehman build 0 2003-10-13 13:34 mem

    -r--r---- 1 dbehman build 0 2003-10-13 13:34 mounts

    lrwxrxrxr 1 dbehman build 0 2003-10-13 13:34 root ->

    -r--r---- 1 dbehman build 0 2003-10-13 13:34 stat

    -r--r---- 1 dbehman build 0 2003-10-13 13:34 statm

    -r--r---- 1 dbehman build 0 2003-10-13 13:34 status

    ```


    Notice how the sizes of all the files are 0, yet when we examining some of them
    it''s clear they do in fact contain information. The reason for the 0 size is
    because these files are basically a window into the kernel structures and are
    not real files; rather they are very special types of files. When filesystem operations
    are performed on files within the /proc filesystem, the kernel recognizes what
    is being requested by the user and dynamically returns the data to the calling
    process as if it were read from the disk.'
