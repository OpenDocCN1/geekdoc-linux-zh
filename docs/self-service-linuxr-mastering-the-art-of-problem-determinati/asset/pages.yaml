  md: '# B.1 OVERVIEW


    There are two main challenges for collecting data when a problem occurs. The first
    challenge is collecting the right data. This is a challenge because it is often
    hard to know what type of problem you''ve encountered and therefore know what
    data to collect for it. The second challenge is to collect data quickly when you
    are under pressure to solve the problem immediately (or to get the system back
    up and running). Collecting all of the important information manually will lengthen
    the time to resolution and potentially increase the duration of an outage—and
    humans tend to make mistakes that can jeopardize the usefulness of the information.
    Addressing these two challenges is the purpose of a data collection tool or script.


    As the name suggests, a data collector is a tool written for the purpose of collecting
    the right information quickly when a problem occurs. You can modify it when there
    isn''t a desperate need to collect data—that is, when you have time to consider
    what data to collect for different problem types. Because it is a script or executable,
    it will run quickly when needed, potentially minimizing the duration of an outage
    (for example, with the right data collected, there is no need to keep the system
    in the same state).


    Most of the information gathered by a thorough data collector will not be used
    for a specific problem investigation. The reason so much information is collected
    is that you often dont know what will be useful until you start investigating.
    It is best to collect everything you need and discard the output once you solve
    the problem.


    The data collector, even though it is very useful as it is, is included as a sample
    for building something more elaborate that may include the ability to collect
    data for commercial products or other information relevant to the types of problems
    you encounter.


    The data collector creates the directory structure outlined earlier in this chapter.


    # Data Collection Script'
  merge: -1
  pgno: 430
- img_proc: true
  md: '# Data Collection Script


    <problem number> / inv.txt

    / data /

    / src /


    It creates a new unique directory under your home directory and puts all of the
    data it collects into the inv.txt (the investigation log). The output from various
    commands is placed directly in inv.txt, and the files collected are placed in
    the data directory. The src directory is created in case tools or specific scripts
    are needed as the investigation continues.


    The script uses two bash subroutines to collect data: runCommand and collectFile.
    The runCommand subroutine, as expected, runs a command and captures the output
    in the investigation log. The collectFile subroutine collects the contents of
    a file in the data directory. The output of the runCommand looks like this (from
    the inv.txt):


    ```

    RUNCMD: /bin/netstat -i -n (Network Interface Information) ...

    {

    Kernel Interface table

    face MTU RX-OK RX-ERR RX-DRP RX-OVR TX-OK TX-ERR TX-DRP

    TX-VR Flag

    eth0 1500 0127895866 14 0 0133602459366 0 0

    -BRNU

    lo 16436 0224593366 0 0 0 0 0

    -LRU

    }

    ```


    The output is always prefixed with "RUNCMD" to make the output easy to find. The
    command itself is included on the same line to make it convenient for regular
    expressions. For example, searching for "RUNCMD.*netstat" will find all captured
    netstat commands.


    The output from collectFile looks like this:


    ```

    COLLECT: /etc/resolv.conf (DNS resolution configuration file)

    ...success.

    ```


    ```

    COLLECT: /etc/nswitch.conf (Name service switch configuration file)

    ...success.

    ```


    ```

    COLLECT: /etc/hosts (Static table lookup file) ... success.

    ```


    The output is always prefixed with "COLLECT", again to make it easy to find. If
    the copy fails, the output of the copy command is included for convenience.

    Collecting new files or the output from new commands is easy. Just add lines to
    similar the following:


    ```

    runCommand "Environment variables" "/usr/bin/env"

    collectFile "DNS resolution configuration file" "/etc/resolv.conf",

    ```'
  merge: -1
  pgno: 431
- img_proc: true
  md: '# B.1 Overview


    The script is fairly simple, but do not underestimate its usefulness. It can reduce
    a lot of investigation time as it is, even without any modification. This is especially
    true if you work on problems for remote customers or users. A data collector can
    ensure you have the information needed to solve the problem and will dramatically
    reduce the need to iteratively request information as the investigation progresses.


    There are seven options for the data collector script:


    ```

    vacuum

    vaccum - thorough

    vacuum - hang

    vacuum - trap

    vacuum - perf

    vacuum - error

    ```


    Without any options, the data collector script collects information that does
    not take a long time to collect. Using the data collector without any option can
    be used for very basic problems or for collection time is absolutely critical
    (that is, a script when the script needs to finish immediately).


    This mode takes approximately 10 seconds to run as shown in the following sample
    run:


    ```

    penguin> time vacuum

    Investigation directory: /home/wilding/investigations/131

    0.340u 9.000s 0:09.42 99.1% 0+0k 0+0io 7551pf+0w

    ```


    # B.1.1 -thorough


    This switch collects more information but takes more time to run (about 60 seconds).
    Use this switch to collect information when collection time is not an issue—for
    general system performance problems or for problems that involve a commercial
    product (for example, for the vendor doesn''t provide a data collector).


    # B.1.2 -perf,-hang <pid>,trap,-error <cmd>


    These switches are left to the user to fill in. They are provided as part of the
    script for convenience. The one major caveat of the script is that it is written
    in bash, which lacks job features that would make it easy to run and interact
    with a tool such as gdb. If the script is ported to ksh (Korn Shell), it will
    be possible to use more advanced job control.


    These options also usually depend on the product or tool and/or situation. Because
    this is a script, the reader is free to modify these areas of the script as needed.'
  merge: -1
  pgno: 432
- img_proc: true
  md: '# B.2 RUNNING THE SCRIPT


