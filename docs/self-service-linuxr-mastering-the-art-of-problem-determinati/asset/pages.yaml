    9.6.17 .rel** This is a relocation section. Relocation sections are prefixed by
    the section name that they will be operating on. For example, .rel.text is a relocation
    table that will work with the .text section. Relocation is a critical part of
    ELF because it allows shared libraries to be loaded anywhere in the address space.


    Relocation is the process of changing an address in a shared ELF section to the
    current address of a corresponding function or variable as illustrated in Figure
    9.4.


