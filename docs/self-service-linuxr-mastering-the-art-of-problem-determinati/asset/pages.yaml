    > Note: Some distributions may strip the shared libraries, which removes the main
    symbol table and makes the nm command here work as shown. In this case, choose
    a library on the system that has not been stripped. You can also use the file
    command on an ELF file to see whether it has been stripped (the term "stripped"
    will be displayed).


    Note: ELF uses the term "class" to describe the scope/or category of a symbol.
    The ELF term class, when used to describe symbols, is not related to C++ classes.


    The field "Value" is the offset in the library where the executable instructions
    for "printf" are found. The class is "T" meaning "text". Text in this context
    reads-only. The type is "FUNC" for function. The size is 0x39 bytes or 57 bytes
    in decimal notation, and lastly, the section that is found in the "text" section,
    which contains all of the executable code for the library. Symbols can have different
    "scope" such as global or local. A global variable in a shared library is exposed
    and available for other shared libraries or the executable itself to use. A local
    variable was originally defined as "static" in the original source file, making
    it local to the code in that source file. Static symbols are not available to
    other ELF files.


    There are two variables defined in the source file foo.c that are meant for illustrating
    the concept of scope:


    ```

    globInt = 5;

    static int staticInt = 5;

