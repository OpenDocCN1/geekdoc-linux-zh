  md: '# 7.2 Gathering Information


    # 7.2.10 Kernel oops Oopses and Hardware


    A kernel oops does not always mean that a software error was found in the kernel.
    In fact, hardware actually fails quite often, so it should never be ruled out
    as the possible cause of an oops. The question becomes how does one determine
    if the oops is caused by faulty hardware. Here are some clues that can point to
    faulty hardware:


    +   - Oopses occurring in places where it is almost impossible for them to occur
    in after examining the source code around the trap.

    - Recurring oops that don''t always happen in the same place. Software bugs are
    almost always reproducible, but faulty hardware, especially bad RAM, can cause
    strange things to happen in seemingly random places.

    - Sudden start of oops. If the operating system has been running fine with little
    or no changes to it, and oops all of a sudden start occurring.

    - Hard machine lockups where nothing is displayed to the screen, SysRq magic hotkey
    does nothing, and only a hard reboot can be done.


    If the hardware is suspected, tests should be performed immediately starting with
    the RAM, unless there is reason to suspect some other piece of hardware. Many
    servers have built in diagnostic programs that can be accessed from the BIOS menu.
    These should be run first. Soft testing programs such as memtest86 (available
    at www.memtest86.org) should also be run to examine the RAM.


    > Note: memtest86 is historically meant for 32-bit x86-based hardware. The need
    for the support of this software on AMD64 hardware was great, and this was one
    of the reasons for the spin-off creation of memtest86+ (available at www.memtest86.org).
    memtest86+ fully supports all AMD Opteron chips.


    The fsck (file system check) utility should also be run on all hard drive partitions
    to which the server has access. Sometimes a corruption can occur on a filesystem,
    which can lead to corruption in libraries or executables. This corruption can
    lead to instructions within the code becoming scrambled, therefore resulting in
    very bad things happening. The fsck utility will detect and fix corruptions that
    may exist.'
