  md: '# CHAPTER 8


    # Kernel Debugging with KDB


    # 8.1 INTRODUCTION


    Having the ability to examine kernel processes and memory in real-time is extremely
    important to a kernel developer. It isn’t quite as important as application developers
    or system administrators, but there are occasions when obtaining specific kernel
    data can be critical to resolving difficult problems. For this reason, this section
    offers an introduction to the basics of how to get KDB installed and running and
    the very basics of using it. It is an extremely powerful tool, and in-depth information
    on it is beyond the scope of this book. There are many resources available on
    the Internet and in print that can be referred for further information.


    KDB is not the only kernel debugger available for Linux—KGDB is also commonly
    used. Each has its strengths and weaknesses, and many people prefer one over the
    other. The main difference is that KGDB actually uses GDB to debug the kernel;
    however, it must done from a remote computer and cannot be on the live machine.
    KDB provides kernel debugging capabilities directly on the kernel while it is
    running and can also be used remotely. Given that using KGDB is the same as GDB,
    one can learn how to use it by referring to Chapter 6, “The GNU Debugger,”


    # 8.2 ENABLING KDB


    KDB is not part of the mainstream kernel source code found at kernel.org. It is,
    however, included in the kernels that come with some of the major distributions.
    If you are not using a distribution kernel, the patch for KDB can be obtained
    from the KDB homepage at http://oss.sgi.com/projects/kdb/. Even though KDB is
    included in some distributions, it is very likely not by default and requires
    a kernel rebuild. It is quite easy to enable—simply set the CONFIG_KDB configuration
    option manually or through your favorite make interface and rebuild the kernel.
    Figure 8.1 shows the option highlighted and enabled in the “Kernel hacking” menu
    when using the make menuconfig.


