  md: '# 1.3 The Four Phases of Investigation


    If the problem isn''t too serious, then just make a mental note of this information
    and continue the investigation. If the problem is very serious (has a major impact
    to a business), write this stuff down or put it into an investigation log (an
    investigation log is covered in detail later in this chapter).


    If you can reproduce the problem at will, strace and ltrace may be good tools
    to start with. The strace and ltrace can trace an application from the command
    line, or they can trace a running process. The strace command traces all of the
    system calls (special functions that interact with the operating system), and
    ltrace traces functions that a program called. The strace tool is probably the
    most useful problem investigation tool on Linux and is covered in more detail
    in Chapter 2,"strace and System Call Tracing Explained."


    Every now and then you''ll run into a problem that occurs every few weeks or months.
    These problems usually occur on busy, complex systems, and even though they are
    rare, they can still have a major impact to a business and your personal time.
    If the problem is serious and cannot be reproduced, be sure to capture as much
    information as possible given that it might be your only chance. Also if the problem
    can''t be reproduced, you should start things down because you might need to refer
    to the information weeks or months into the future. For these types of problems,
    it would be worthwhile to collect a lot of information about the OS (including
    the software versions that are installed on it) considering that the problem could
    be related to something that may change over weeks or months of time. Problems
    that take weeks or months to resolve can span major changes or upgrades to the
    system, making it important to keep track of the original conditions under which
    the problem occurred.


    Collecting the right OS information can involve running many commands, too many
    for someone to run when need arises. For your convenience, this book comes with
    a data collection script that can gather an enormous amount of information about
    the operating system in a very short period of time. It will save you from having
    to remember every command and from having to type each command in collect the
    right information.


    The data collection script is particularly useful in two situations. The first
    situation is that you are investigating a problem on a remote customer system
    that you can''t log in. The second situation is a serious problem on a local system
    that is critical to resolve. In both cases, the script is will usually gather
    all the OS information you need to investigate the problem with a single run.


    When servicing a remote customer, it will reduce the number of initial requests
    for information. Without a data collection script, getting the right information
    for a remote problem can take many emails or phone calls. Each time you ask for
    more information, the information that is collected is older, further from the
    time that the problem occurred.'
