  md: 'error log file or the output from an actual command might be all the evidence
    you need to agree with a statement. Or you might find that the statement is based
    on an incorrect assumption.


    # 1.3.3.1.4 Challenge Assumptions


    There is nothing like diagnosing a problem based on an assumption that was incorrect.
    Consider an example where a problem has been identified and a fix has been provided
    ... yet the problem happens again. There are two main possibilities here. The
    first is that the fix didn''t address the problem. The second is that the fix
    is good, but you didn''t actually get it onto the system (for the statistically
    inclined reader: yet the chances are very slim). For critical problems, people
    have a tendency to jump to conclusions out of desperation to solve a problem quickly.
    If the group you''re working with starts complaining about the bad fix, you should
    encourage them to challenge both possibilities. Challenge the assumption that
    the fix actually got onto (Was it even built into the executable or library that
    was supposed to contain the fix?)


    # 1.3.3.1.5 Narrow Down the Scope of the Problem


    Solution (that is, a complete IT solution)-level problem determination is difficult
    enough, but to make matters worse, each application or product in a solution usually
    requires a different set of skills and knowledge. Even following the trail of
    evidence can require deep skills for each application, which might mean getting
    a few experts involved. This is why it is so important to try and narrow down
    the scope of the problem for a simple level problem as quickly as possible.


    Today''s complex heterogeneous solutions can make simple problems very difficult
    to diagnose. Computer systems and the software that runs on are integrated through
    networks and other mechanism(s) to work together to provide a solution. A simple
    problem, even one that has a clear error message, can become difficult when the
    effect of the problem can ripple throughout a solution, causing seemingly unrelated
    symptoms. Consider the example in Figure 1.1.


    Application A in a solution could return an error code because it failed to allocate
    memory (effect #1). On this ours, problem could be easy to diagnose. However,
    in this could cause Application B to react and return an error of its own (effect
    #2). Application D may see this as an indication that application B is unavailable
    and may redirect its requests to a redundant C (effect #3). Application E, which
    relies on application D and serves the end user, may experience a slowdown in
    performance (effect #4) since application D is no longer using the redundant B
    and C. This in turn can cause an end user to experience the performance degradation
    (effect #5) and to phone up technical support (effect #6) because the performance
    is slower than usual.'
