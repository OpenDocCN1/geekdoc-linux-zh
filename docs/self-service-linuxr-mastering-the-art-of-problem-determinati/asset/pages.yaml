  md: "Of course, we can do something similar for global destructors, except we need\
    \ to use the _DTOR_LIST_ variable. Now that we know the symbol names for the constructor\
    \ and destructor lists, we can reference them directly and do not have to go through\
    \ _init (or the corresponding _fini) to find the lists.\n\n# 6.10.2 Inline Functions\n\
    \nInline functions are special functions whose instructions can actually be embedded\
    \ in the function that called the inline function. The keyword “inline” is a suggestion\
    \ to the compiler, not an instruction, so a function may or not be “lined.” A\
    \ compiler may also choose to inline functions that were not declared as inline\
    \ (for example, a static function).\n\nAn inline function is harder to debug because\
    \ it will not have a symbol or address (since the code is part of the function\
    \ that called the inline function). You can't set a breakpoint by asking GDB to\
    \ break when entering the inline function (break function) because an inline function\
    \ doesn't really exist as a function. There are also no variables that you can\
    \ print out—and thus no type information, and so on.\n\nIf you compile without\
    \ optimization, the functions will probably not be inlined. Keep in mind that\
    \ the inline key word is only a suggestion to the compiler. Consider the following\
    \ inline function:\n\n```\ninline int foo(int a)\n{\n    int b = 0;\n\n    for\
    \ (b = a; b < 100; b ++);\n\n    noValueGlobInt = a;\n    return b + a;\n}\n```\n\
    \nCompiling a program that contains this function without optimization will show\
    \ that there is a symbol for this function (foo) which means that it has not been\
    \ inlined by the compiler.\n\n```\npenguin> g++ cpp.C -g -o cpp\npenguin nm cpp\
    \ | egrep foo\n08048514 W _Z3fooi\n```\n\nCompiling with optimization (-O3), we'll\
    \ see that the function no longer has a symbol, which means that the compiler\
    \ inlined the actual machine code into the calling function."
