    080486e0 T_fini

    penguin> reread -S foo | egrep fini

    [13] .fini PROGBITS 080486e0 0006e0 00001c 00 AX 0 4

    ```


    The _fini function at 0x080486e0 calls the static (global) destructors for an
    executable or shared library. For an executable, _fini (and thus the destructors)
    is called when the program terminates. For shared libraries, the _fini function
    is called when a library is unloaded from memory. The _fini function has a counterpart
    function called _init that calls the global constructors.


    There is more information on the .init section covered further on in the chapter.


    # 9.6.3.7 .got (Global Offset Table) The Global Offset Table, known as GOT, is
    required for position-independent code. Position-independent code is compiled
    in a way that can be loaded and run from any address. It''s not as easy as it
    sounds. Code that needs to call a function has no idea in the address space this
    function will be. The GOT solves this by providing a level of indirection between
    code in an executable or shared library and the required functions and variables
    that may be in other shared libraries. Let''s look at the GOT in more details:


    ```

    penguin> reread -S libfoo.so | egrep .got

