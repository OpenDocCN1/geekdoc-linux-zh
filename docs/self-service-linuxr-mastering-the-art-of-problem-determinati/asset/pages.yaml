    The most “interesting” segment types are:


    +   - PT_LOAD

    - PT_DYNAMIC

    - PT_INTERP


    The PT_LOAD type is a “loadable” segment meaning that it can be loaded into memory.
    Loadable segments contain everything needed by a program to run the executable
    code.


    The PT_DYNAMIC type is for dynamic linking. This is used by run time linker to
    find all of the required shared libraries and to perform run linking.


    The PT_INTERP segment points to the “interp” section that lists the name of the
    program interpreter for an executable. The program interpreter is responsible
    for getting a program up and running its own executable code. In other words,
    it takes care of proper initialization from the point of view of the dynamic loading,
    linking, and so on. See the section later in this chapter titled “Program Interpreter”
