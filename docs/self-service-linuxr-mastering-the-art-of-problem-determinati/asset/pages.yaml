    ```


    It can also be useful to set a breakpoint in a function only when one of the function
    parameters is a specific value. Say you have a function in your application that
    got called hundreds of times, but you''re only interested in examining this function
    when one of the parameters is a specific value. The function is called common_func
    and takes one integer parameter called num. To set up a conditional breakpoint
    on this function when num equals 345 for example, you would set the first breakpoint:


