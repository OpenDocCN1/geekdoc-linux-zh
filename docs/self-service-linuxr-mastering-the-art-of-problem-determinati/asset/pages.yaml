  md: '# 6.5 Examining Data, Memory, and Registers


    # ### 6.5.2.2 Obtaining and Understanding Frame Information Sometimes you''ll
    want/need to get more information about a stack frame. For example, a stack frame
    contains information about function arguments, local variables, and some interesting
    registers. This can be particularly useful if you don''t at stack frame, use the
    `info frame` command:


    ```

    (gdb) info frame 2

    Stack frame at 0xbffffff330:

    elip = 0x80483e9 in function3 (gdb_stack:c:16); saved eip 0x804843a3

    called by frame at 0xbffffff370, caller of frame at 0xbffffff310

    source language c

    Arglist at 0xbffffff328, args: string=0xbffffff330 "This is a local string"

    Locals at 0xbffffff328, Previous frame''s sp is 0xbffffff330

    Saved registers:

    ebp at 0xbffffff328, eip at 0xbffffff32c

    (gdb)

    ```


    There''s a lot of information here, so let''s break it down a little.


    Stack frame at 0xbffffff330:


    This is simple address of the stack frame.


    eip = 0x80483e9 in function3 (gdb_stack:c:16); saved eip 0x804843a3


    The eip (Extended Instruction Pointer) points to the next instruction to be executed
    in this frame. We can then see that this frame is associated with function3().
    Because this source code was compiled with debug symbols, the source file name
    and line number is also displayed. The *saved eip* is the address that points
    to the next instruction to be executed in the frame in the stack. So, for example,
    if we look at the information for the *previous* frame in the stack, its *eip*
    will this stack''s *saved eip*.


    called by frame at 0xbffffff370, caller of frame at 0xbffffff310


    called by frame indicates the address of the frame that the current frame calls.
    So the *called by* and *caller of* basically display the addresses of the two
    frames that surround the current frame.


    source language c.


    This line tells us the language in which the program was written.'
