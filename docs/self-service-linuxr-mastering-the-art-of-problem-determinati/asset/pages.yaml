  md: "# 7.2.11 Setting up cscope to Index Kernel Sources\n\nMost Linux distributions\
    \ include the cscope package. If your distribution does not, you can easily locate\
    \ it for download on the Internet. cscope is a utility that scans through a defined\
    \ set of source code builds and builds a single index file. You can then use the\
    \ cscope interface to search for function, variable, and macro definitions, listings\
    \ of which functions call a particular function, listings of what files include\
    \ a header file, and more. It is an extremely useful tool, which we highly recommend\
    \ setting up if you plan on looking through any amount of kernel source. It isn't\
    \ limited to indexing kernel source; you can set it up to “scope” through any\
    \ set of source files you wish!\n\nBefore running cscope to retrieve symbol information,\
    \ a symbols database must be built. Assuming your kernel source tree is in /usr/src/linux-2.6.2,\
    \ the following command will create the symbols database in the file /usr/src/linux-2.6.2/cscope\n\
    \n```\nfind /usr/src/linux-2.6.2 -name \"[Aa-z]*. [Cch]\" -o name \"*. [Ch]pp\"\
    \n-o name \"*. [CH]PP\" -o name \"*.skl*\" -o name \"*.java\" -print |\\ncscope\
    \ -f /usr/src/linux-2.6.2/cscope -out -i\n```\n\nThe cscope parameters to take\
    \ note of are -b for the symbol database (or cross-reference as it is referred\
    \ to in the man page) and -k for “kernel mode,” which ensures that the proper\
    \ files are scored.\n\nOnce the database is built, searching it is a matter of\
    \ running this command:\n\n```\ncscope -d -P /usr/src/linux-2.6.2 -p 20 -f /usr/src/linux-2.6.2/\\\
    ncscope.out\n```\n\nThe following simple Korn Shell script can be used to handle\
    \ all of this for you.\n\n```\n#!/bin/ksh\n#\n# Simple script to handle building\
    \ and querying a cscope database for\n# kernel source with support for multiple\
    \ databases.\n\nbuild=0\ndbpath=\"linux\"\nforce=0\n\nfunction usage {\n    echo\
    \ \"Usage: kscope [-build] [-dbpath <path>\"\"\n}\n\nwhile [ [$# -gt 0 ]; do\n\
    \    if [ \"$1\" = \"-build\" ]; then\n```"
