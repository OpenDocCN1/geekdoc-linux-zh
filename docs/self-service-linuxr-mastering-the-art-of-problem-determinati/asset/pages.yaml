  md: '# 7.2 Gathering Information


    # 7.2.5 Using SysRq Kernel Magic


    The SysRq Kernel Magic hotkey provides the ability to possibly communicate with
    a panicked kernel to dump information such as stack tracebacks of running tasks,
    the current program counter (PC) location, memory status, and so on. Refer to
    the /proc/sys/kernel/sysrq section in Chapter 3 for a detailed discussion of how
    to use this feature.


    # 7.2.6 Oops Reports


    An Oops Report is basically just a dumping of information by the kernel when it
    encounters a serious problem. The problem can be a code related bug such as dereferencing
    a NULL pointer, accessing out of bounds memory, and so on. The Oops Report is
    generated by the kernel to help the user debug, locate, and fix the problem. Sometimes
    when an oops occurs, the system may seem to continue running normally, but is
    likely to be in an unstable state. It is a good idea to save all work and reboot
    as soon as possible.


    To demonstrate a real kernel oops, we modified the kernel source to allow a trap
    in the kernel at. We will discuss how we did in this section, "Adding a Manual
    Kernel Trap," which may be skipped if you are not interested in the somewhat simple
    modifications we made to the kernel. In the sections that follow it, "Examining
    an Oops Report" and "Determining the Failing Line of Code," we will discuss the
    Oops Report generated by the manual kernel trap in detail. We will also illustrate
    how to find the exact line of source code that caused the kernel oops from the
    Oops Report, so you may wish to read the "Adding a Manual Kernel Trap" section
    after reading the other two sections.


    # 7.2.7 Adding a Manual Kernel Trap


    For the purposes of easily demonstrating a kernel oops and how to examine the
    resulting information, we modified the kernel source code to add an interface
    in the /proc filesystem, which could manipulate to force a trap in the kernel.
    We used the 2.6.2 kernel source downloaded directly from ftp.kernel.org on an
    AMD64 machine. Describing kernel source code in detail is beyond the scope of
    this book, but we''re including details on what we did for the curious reader
    who may be able to use this example as a very basic primer on how to get started
    with the kernel source.


    First, we decided on the interface we wanted to use. We decided to create a new
    file in the /proc filesystem "trap_kernel." The most local place for it is in
    /proc/sys/kernel, as entries in this directory are very kernel-specific. Next,
    we needed to find where in the kernel source the addition of this new file would
    happen. Using the /proc/sys/kernel/sysrq file as an example, we located'
