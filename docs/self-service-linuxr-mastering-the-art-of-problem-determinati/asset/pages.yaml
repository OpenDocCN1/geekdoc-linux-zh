  md: '# Best Practices and Initial Investigation Chap. 1


    Lastly, everyone working on an IT solution should be aware of the basic architecture
    of the solution. This will help the team narrow the scope of any problems that
    occur. Knowing the basic architecture will help people to theorize where a problem
    may be coming from and eventually identify the source.


    #  1.3.3.2 Create a Reproducible Test Case


    Assuming you know how the problem occurs (note that the word here is how, not
    why), it will help others if you can create a test case/or environment that can
    reproduce the problem at will. A test case is a term used to refer to a tool or
    a small set of commands that, when run, can cause a problem to occur.


    A successful test case can greatly reduce the time to resolution for a problem.
    If you are investigating a problem on your own, you can run and rerun the test
    case to cause the problem many times in a row, learning from the symptoms and
    using different investigation techniques to better understand the problem.


    If you need to ask an expert for help, you will also get more help if you include
    a reproducible test case. In many cases, an expert will know how to reproduce
    it. Having a reproducible test case is important if you are asking a stranger
    for help over the Internet. In this case, the person helping you will probably
    be doing so on their own time and they will be more willing to help you out if
    it is as easy as you can.


    #  1.3.3.3 Work to Prove and/or Disprove Theories


    This is part of any good problem investigation. The investigator will do his best
    to identify avenues of investigation and to prove or disprove them. The real art
    here is to identify theories that are easy to prove or disprove that that will
    dramatically narrow the scope of a problem.


    Even nonsolution level problems (such as an application that fails when run from
    the command line) can be easier to diagnose if they are narrowed in scope with
    the right theory. Consider an application that is failing to start with an obscure
    error message. One theory could be that the application is unable to allocate
    memory. This theory is much smaller in scope and easier to investigate because
    it does not require intimate knowledge about the application. There are more people
    who understand how to investigate it. If you need to get an expert involved, you
    only need someone who understands how to investigate whether an application is
    unable to allocate memory. That expert may know nothing about the application
    itself (and might not need to).


