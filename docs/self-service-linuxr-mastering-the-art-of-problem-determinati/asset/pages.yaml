  md: '# 8.3.2 Resuming Normal Execution


    Because being in KDB is such a sensitive mode, let''s immediately document how
    to get out of KDB and return your computer back to normal operation. Use the go
    command for this. You may need to press the enter key a few times to get your
    shell prompt back.


    > Note: After returning your computer to normal execution, you may notice that
    the caps and/or scroll lock LEDs mismatch what the kernel sees them as. Pressing
    the mismatched lock key one or two times should correct this.


    # 8.3.3 Basic Commands


    The first thing to familiarize yourself with in KDB is the Help screen. You can
    display this by entering the ? or help commands. The contents of the Help display
    are shown here:


    | kdb | Usage | Description |

    | --- | --- | --- |

    | md | <vaddr> | Display Memory Contents, also mdWCN, e.g. md8cl |

    | mdr | <vaddr> <bytes> | Display Raw Memory |

    | mds | <vaddr> | Display Memory Symbolically |

    | mm | <vaddr> <contents> | Modify Instructions |

    | id | <vaddr> | Display Execution |

    | go | [<vaddr>] | Display Registers |

    | rd | | Modify Registers |

    | rm | <reg> <contents> | Display exception frame |

    | ef | <vaddr> | Stack traceback |

    | bt | [<vaddr>] | Display stack for process <pid> |

    | btp | <pid> | Display stack all processes |

    | bta | <first-element> | lin Execute cmd for each element in linked list |

    | env | | Show environment variables |

    | set | | Set environment variables |

    | help | | Display Help Message |

    | cpu | <cpunum> | Switch to new cpu |

    | ps | | Display active task list |

    | reboot | | Reboot the machine immediately |

    | sections | | List kernel and module sections |

    | lsmod | | Listed kernel modules |

    | rmmod | <modname> | Remove a kernel module |'
