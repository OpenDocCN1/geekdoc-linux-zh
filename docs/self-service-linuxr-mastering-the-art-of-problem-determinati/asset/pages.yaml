  md: '# 3.4.2.8 tainted


    This file gives an an indication of whether or not the kernel has loaded modules
    that are not under the GPL. If it has loaded proprietary modules, the tainted
    flag will be logically ORed with 1. If a module were loaded forcefully (that is,
    by running `insmod -F`), the tainted flag will be logically ORed with 2. During
    a kernel Oops and panic, the value of the tainted flag is dumped to reflect the
    module loading history.


    # 3.4.3 /proc/sys/vm


    This directory holds several files that allow the user to tune the Virtual Memory
    subsystem of the kernel. The default values are normally fine for everyday use;
    therefore, these files aren''t modified too much. The Linux VM is arguably the
    most complex part of the Linux kernel, so discussion of it is beyond the scope
    of this book. There are many resources on the Internet that provide documentation
    for it such as Mel Gorman''s "Understanding the Linux Virtual Memory Manager"
    Web site located at http://www.csn.ul.ie/~mel/projects/vm/guide/html/understand.


    # 3.5 CONCLUSION


    There is more to the /proc filesystem than was discussed in this chapter. However,
    the goal here was to highlight some of the more important and commonly used entries.
    The /proc filesystem will also vary by kernel version and by distribution as various
    features appear in some versions and not others. In any case, the /proc filesystem
    offers a wealth of knowledge into your system and all the processes that run on
    it.'
