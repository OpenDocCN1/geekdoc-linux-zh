  md: '# 1.3 The Four Phases of Investigation


    The problem identifier is for tracking purposes. Use whatever is appropriate for
    you (even if it is 1, 2, 3, 4, and so on). The inv.txt is the investigation log,
    containing the various theories and proofs. The data directory is for any data
    files that have been collected. Having one data directory helps keep things organized
    and makes it easy to refer to data files from your investigation. The src directory
    is for any source code or scripts that you write to help investigate the problem.


    The problem directory is what you would show someone referring to the problem
    you are investigating. The investigation log would contain the flow of the investigation
    with the detailed proofs and should be enough to get someone up speed quickly.


    You may also want to save the problem directory for the future or better yet,
    the investigation directories where others can search through them. After all,
    you worked hard for the information in your investigation log; don''t be too quick
    to delete it. You never know when you''ll hit a similar (or the same) problem
    again. The investigation log can also be used to help educate junior people about
    investigation techniques.


    # 1.3.3.1 Devolved (Avoid Qualitative Information)


    Be detailed in your investigation log or any time when discussing the problem.
    If you prove a theory using an error record from an error log file, include the
    error record and the name of the error log file as proof. Avoid qualitative proofs
    such as, "Found an error log that showed the suspect product was running at time."
    If you transfer a problem to another person, that person will want to see the
    actual error to ensure that your assumption was correct. If the problem lasts
    long enough, you may actually start to second-guess yourself well (which is actually
    a good thing) and may appreciate that quantitative proof (a proof with real data
    to back it up).


    Another example of a qualitative proof is a relative term or description. Descriptions
    like "the file was very large" and "the CPU load was high" will mean different
    things to different people. You need to include details for how large the file
    was (using the output of the log command if possible) and how high the CPU load
    was (using uptime or top). This will remove any uncertainty that others (or you)
    have about your theories and proofs for the investigation.


    Similarly, when you are asked to review an investigation, be wary of any proof
    or absolute statement (for example, "I saw the virtual memory drop to dangerous
    levels last night") without the required evidence (that is, a log record, output
    from a specific OS command, and so on). If you don''t have the actual evidence,
    you''ll never know a statement is true. This doesn''t mean that you have to distrust
    everyone you work with to solve a problem but rather a realization that people
    make mistakes. A quick cut and paste of an'
