- img_proc: true
  md: '# 3.2 PROCESS INFORMATION


    Along with viewing and manipulating system information, obtaining process information
    is another way in which the /proc filesystem shines. When you look at the listing
    of files in /proc, you will immediately notice a large number of directories identified
    by a number. These numbers represent process IDs and contain more detailed information
    on that process ID within it. All Linux systems have the /proc/1 directory. With
    ID 1 is always the "init" process and is the first process to be started on the
    system during bootup. Even though this is a special program, it is a process just
    like any other, and the /proc/1 directory will contain the same information as
    any other process including the ls command you use to see the contents of and
    any other directory! The following sections will go into more detail on the most
    useful information that can be found in the /proc/<pid> directory such as viewing
    CPU and memory configuration information, and understanding settings that can
    greatly enhance application and system troubleshooting.


    # 3.2.1 /proc/self


    As a quick introduction into how processes are represented in the /proc filesystem,
    let''s first look at the special link /proc/self. The kernel provides this as
    a link to the currently executing process. Typing "cd /proc/self" will take you
    directly into the directory containing the process information for your shell
    process. This is because cd is a function provided by the shell (the currently
    running process at the time of using the "self" link) and not an external program.
    If you perform an ls -l /proc/self, you will see a link to the process directory
    for the ls process, which goes away as soon as the directory listing completes
    and the shell prompt returns. The following sequence of commands and their associated
    output illustrate this.


    > Note: $$ is a special shell environment variable that stores the shell''s process
    ID, and "proc/<pid>/cwd" is a special link provided by the kernel that is an absolute
    link to the current working directory.


    ² A common way of generalizing a process'' directory name under the /proc filesystem
    is to use /proc/<pid> considering a process'' number is random with the exception
    of the init process.'
