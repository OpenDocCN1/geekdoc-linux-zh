  md: '# 9.8 Stripping an ELF Object


    # # 9.8 STRIPPING AN ELF OBJECT


    ELF objects can be stripped, which is a phrase used to refer to the removal of
    the main symbol table and other sections that are not needed for run time. The
    main symbol table can consume quite a bit of space and can give away information
    about how a program works. Because the main symbol table is not actually needed
    for program execution, it can be stripped away, leaving a smaller ELF object.


    Let''s use libfoo.so to show how stripping works and the effects it has on an
    ELF file:


    ```

    penguin> ls -l libfoo.so

    -rwxrxr-xr 1 wildest build      7301 Jan 16 16:00 libfoo.so

    penguin> strip libfoo.so

    penguin> ls -1 libfoo.so

    -r--r--r-- 1 wildest build      4668 Jan 16 11:13 libfoo.so

    ```


    Before stripping the shared library, it contains the following sections:


    After stripping the shared library, it contains the following sections:


    Therefore, stripping the shared library took out sections containing debug information:
    debug_abbrev, debug_aranges, debug_info,debug_line and the main symbol table with
    its strip table: strtab symtab. Both types of information are not needed at run
    time.


    The biggest problem with stripping an ELF object is that it removes information
    that is very useful for debugging problems. Without the main symbol table, static
    symbols have no symbol name, and all debugging information (if the object was
    built with debug information) will be removed. This includes information that
    can help with line number to function offset, and so on.'
