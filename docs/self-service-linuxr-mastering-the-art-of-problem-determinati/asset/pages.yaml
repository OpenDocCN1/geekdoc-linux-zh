    the data collection script in Appendix B, “Data Collection Script” (for the readers
    who support or use Linux in a business setting).


    Do not underestimate the importance of doing an initial investigation on your
    own, even if the information you need to solve the problem is on the Internet.
    You will learn more investigating a problem on your own, and that earned knowledge
    and experience will be helpful for solving problems again in the future. That,
    make sure the information you learn is in an area that you will find useful. For
    example, improving your skills with strace is a very worthwhile exercise, but
    learning about a rare problem in a device driver is probably not worth it for
    the average Linux user. An initial investigation will also help you to better
    understand the problem, which could be helpful when trying to find the right information
    on the Internet. Of course, if the problem is urgent, use the appropriate resources
    to find the right solution as soon as possible.


    # 1.3.1.1 Did Anything Change Recently?


    Everything is working as expected and then suddenly, a problem occurs. The first
    question people usually ask is “Did anything change recently?” The fact of the
    matter is that either something changed or something triggered the problem. If
    something changed and you can figure out what it was, you might have solved the
    problem and avoided a lengthy investigation.


    In general, it is very important to keep changes to a production environment to
    a minimum. When changes are necessary, be sure to notify the system users of changes
    in advance so that any resulting impact will be easier for them to diagnose. Likewise,
    if you are a user of a system, look to your system administrator to give you a
    heads up when changes are made to the system. Here are some examples of changes
    that can cause problems:


    > A recent upgrade or change in the kernel version and/or system libraries and/or
    software on the system (for example, a software upgrade). The change could introduce
    a bug or a change in the (expected) behavior of the operating system. Either can
    affect the software that runs on the system.'
