  md: '# CHAPTER 4


    # # Compiling


    # ## 4.1 INTRODUCTION


    Because the Linux kernel and all GNU software are fully open source, the act of
    compiling and working with compilers is a very important part of becoming Linux
    expert. There will often be times when a particular software package or a particular
    feature isn''t included in your software distribution, so the only option is to
    obtain the source and compile it yourself. Another common task in Linux is recompiling
    your kernel. The reasons for doing this could be to disable or enable a particular
    feature of the current kernel, apply a patch to fix a problem to add a new feature,
    or to migrate the system to a completely different kernel source level. This chapter
    provides complete instructions on how to carry out these tasks. Rather, it provides
    information on some of the lesser details related to these actions. Furthermore,
    the intent is to help you with some of the skills to enable you to solve compilation
    difficulties on your own. First, a bit of background on the primary tool used
    to perform compilation—the compiler.


    # ## 4.2 THE GNU COMPILER COLLECTION


    The GNU Compiler Collection, or GCC as it is commonly referred to, is currently
    the widely used compiler for developing GNU/Linux, BSDs, Mac OS X, and BeOS systems.
    GCC is free (as freedom) software and is freely available for anyone to use for
    any purpose. There are a large number of developers around the world that contribute
    to GCC, which is guided by the GCC Steering Committee.


    # ### 4.2.1 A Brief History of GCC


    GCC originally started out as the "GNU C Compiler" back when the GNU Project was
    first started in 1984 by the GNU Project founder Richard Stallman. With funding
    from the Free Software Foundation (FSF), the release of GCC was in 1987. At that
    time it was the first portable, optimizing compiler freely available, which quickly
    paved the way for the open source movement and ultimately the GNU/Linux operating
    system.'
  merge: -1
  pgno: 144
- img_proc: true
  md: 'Version 2.0 was released in 1992 and provided support for C++. In 1997, the
    Experimental/Enhanced GNU Compiler System (EGCS) project was spun off of GCC by
    a group of developers who wanted to focus more on expanding GCC, improving C++
    support, and improving optimization. EGCS resulted in being named the official
    version of GCC in April 1999. The release of GCC 3.0 in 2001 made the new compiler
    widely available.


    Today, GCC has been ported to more hardware architectures than any other compiler
    and is a crucial part of the success of the GNU/Linux operation system. GCC continues
    to grow and stabilize. Current versions of SuSE Linux Enterprise Server 9 use
    GCC version 3.3.3, and Redhat Enterprise Linux 3 use GCC version 3.2.3.


    # 4.2.2 GCC Version Compatibility


    When new versions of GCC are released, there is always the potential for library
    incompatibilities to be introduced, particularly with C++ code. For example, when
    compiling a C++ application with GCC version 3.3.1, the system library libstdc++.5
    will be automatically linked. When compiling the same C++ application with GCC
    3.4.1, the system library libstdc++.6 is automatically linked. This is because
    between GCC 3.3.3 and 3.4.1, the C++ Binary Interface (ABI) (see the "Calling
    Conventions" section for more information) was changed, resulting in the two versions
    of the compiler generating binaries using different interfaces.


    To resolve this issue, both versions of the libstdc++.so library must be available
    on any system that could potentially run an application compiled with differing
    versions of GCC.


    # 4.3 Other Compilers


    There are other compilers available for Linux, but none are as portable as GCC
    and are generally only available on specific hardware platforms. GCC''s main competition
    on the i386, IA64, and x86-64 architectures is the Intel C++ Compiler. This compiler
    is a commercial product and must be properly licensed. It claims to have better
    performance than GCC and offers different support packages to the purchaser.


    An alternative compiler to GCC on the PowerPC platform running Linux is the IBM
    xLC C++ Compiler. Just as with the Intel compiler, this one also'
