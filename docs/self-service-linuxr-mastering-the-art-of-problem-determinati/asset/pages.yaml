  md: '# Linux System Crashes and Hangs Chap. 7


    | Bit | Value |

    |---|---|

    | 0 | No page found Protection fault |

    | 1 | Read Write |

    | 2 | Kernel-mode User-mode an |

    | 3⁷ | Fault was not an instruction fetch Fault was an instruction fetch |


    Table 7.1 Page Fault Error Codes.


    Using Table 7.1, we know that binary 10 means that no page was found, a write
    was attempted in kernel-mode, and the fault was not due to an instruction fetch
    (remember that this Oops Report was taken from an AMD64 machine). From this information
    we know that a page was not found when doing a write operation within the kernel.


    The next piece of information on the first line is the []. This is the die counter
    that basically keeps track of the number of oopses that have occurred since the
    last reboot. In our case, this is the first oops we have encountered.


    The next line is CPU 0 and indicates that CPU performed the instruction that caused
    the fault. In this case, our system has only one CPU, so 0 is the only possible
    value. The next line is:


    > Pid: 2680, comm: bash Not Tainted


    The Pid indicates which user-process ID initiated the problem, and comm tells
    us that the process was bash. This makes sense because the I was redirecting the
    output of an echo command, which is all handled by the shell. Not tainted tells
    us that our kernel has not been tainted by any modules not the GPL and/or forcibly
    loaded. The next line in the oops dump is:


    ```

    RIP: 0010:[ffffffff8013ae64>:proc_dovec_trap_kernel+84]

    ffffffff8013ae64>

    ```


    RIP is the name of the instruction pointer on the AMD64 architecture. On 32bit
    x86 systems, it is called the EIP instead and, of course, is 32 bits long rather
    than 64 bits long.(Though somewhat fits in the intended meaning here.) The “0010”
    is a stand for Rest In Peace,


    Bit 3 is defined on the x86-64 architecture but not on the i386 architecture.'
