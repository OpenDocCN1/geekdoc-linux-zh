  md: '# strace and System Call Tracing Explained


    # 2.1 INTRODUCTION


    In a perfect world, an error message reported by a tool or application would contain
    all of the information required to diagnose the problem. Unfortunately, the world
    is far from being a perfect place. Many, if not most, error messages are unclear,
    ambiguous, or only describe what happened and not why (for example, “could not
    open file”). Errors are often related to how a tool or application interacted
    with the underlying operating system. A trace of those interactions provide a
    behind-the-scenes look at many types of errors. On Linux the trace utility can
    be used to trace the thin layer between the kernel and a tool or application.
    The trace tool can help to investigate an unclear error message or unexpected
    behavior when it relates to the operating system.


