    two months before you post anything. What if you have a problem now? Well, if
    you are responsible for supporting a critical system or a large group of users,
    don''t wait until you need to post a message, starting getting familiar with the
    key lists or newsgroups.


    Besides making people feel more comfortable about how you communicate over the
    Internet, why should you care so much about netiquette? If you don''t follow the
    rules of netiquette, people won''t answer your requests for help help you. In
