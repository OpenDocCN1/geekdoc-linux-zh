  md: '# 6.12 Data Display Debugger (DDD)


    being debugged has been compiled with debug symbols (using the -g compile switch).
    It''s also important to understand how compiling with optimization (GCC''s -O1,
    -O2, -03, -Os options) affects the source code window (see the "Compiling with
    Optimization" section for more information).


    Because compiler optimization often reorganizes the machine level instructions,
    in the order the source code instructions are executed. If the program debugged
    has been compiled with debug symbols and some level of optimization, stepping
    through machine level instructions with the stepi or next GDB commands will cause
    the current source line of code marker to jump around wildly from line of code
    to line of code. This is completely normal and in fact is very useful to debugging
    optimization problems. It''s interesting to see how much a compiler''s optimizer
    does in converting what the author might think is optimized code into assembled.


    The source code window is also interactive in breakpoints can be set by double-clicking
    to the left of any source code line. You can also hover the mouse pointer over
    any variable to see a pop-up showing its value. Right-clicking the variable presents
    a menu you can use to print variable values to the GDB console or display them
    to the data window. This is especially useful for structures.


    # 6.12.3 Machine Language Window


    The machine language window basically displays the output of GDB''s disassemble
    command with a specified range within the current function.


    > Note: Machine language dumps of functions can be quite lengthy. By default DDD
    will only disassemble a maximum of 256 bytes at a time in the machine language
    window. Once execution goes beyond what''s currently disassembled, DDD will disassemble
    and display another 256 bytes. This can be inconvenient in some cases, so to change
    this behavior, add the following to your $HOME/.ddd/init file:


    ```

    Ddd+maxDisassemble: 512

    ```


    Try substituting 512 with whatever value you want; 0 disassembles the entire function.
    Be sure to add this line to the top of the init file, as DDD overwrites some settings
    with defaults when DDD is terminated.


    The machine language window is also interactive in the same ways that the source
    code window is. You can set breakpoints on specific instructions as well as print
    or display memory addresses or symbols. The machine language'
