  md: "# 9.6 Sections and Sector Header Table\n\nThe assembly listing shows the following\
    \ instruction call %eax at instruction 0x804863. This takes the value of the EAX\
    \ register, it treats it as an address, dereferences the address and the calls\
    \ function stored at the dereferenced address. From code above this call, we can\
    \ see EAX being set with mov0x8049904, %eax at instruction 0x8049904. Let's take\
    \ a look at what is located at that address:\n\n```\npenguin> nm -v -fs foo\n\
    <...>\n  _COR_LIST | 08049900 | d | OBJECT| | .ctors\n  _COR_END | 08049908 |\
    \ d | OBJECT| | .ctors\n<...>\n```\n\nAccording to nm, there are two variables\
    \ _COR_LIST and _COR_END, which have addresses that surround the address 0x8049904\
    \ stored in register EAX. The address that eventually is dereferenced to an address\
    \ that is called.\n\nWe need to find the value stored at address 0x8049904 to\
    \ see what address is eventually called. It is kind of a pain to do this, but\
    \ we first need to find the difference between the virtual address and the offset\
    \ of the segment that contains this address. We know it will be in a LOAD segment\
    \ because it contains information at runtime:\n\n```\npenguin read -l foo egrep\
    \ LOAD\nLOAD 00000000 0x8048000 0x8048000 0x0076c 0x0076c R E 0x1000\nLOAD 0000076c\
    \ 0x804976c 0x804976c 0x001d4 0x001d4 RW 0x1000\n```\n\nAccording to the output,\
    \ the address 0x8049904 is in the second load segment (the data segment), and\
    \ the difference between virtual address of the data segment and the file offsets\
    \ in the data segment is 0x8049000 (0x804976c-0x76c). This is the address that\
    \ we need to subtract from 0x8049904 to get the file offset of 0x9904. Let's see\
    \ the contents at offset:\n\n```\npenguin> hexdump -C -s 0x904 -n 4 foo\n00000904\
    \ 76 8e 04 08 |...|\n00000908\n```\n\nAccording to the output, we have a value\
    \ of 0x804867e at address 0x8049904 (file offset 0x9904). One more step is needed\
    \ before we know what this address is for:\n\n```\npenguin> nm foo egrep 0x804867e\n\
    0x804867e t _GLOBAL__I_myObj3\n```"
