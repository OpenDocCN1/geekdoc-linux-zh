  md: '# The GNU Debugger (GDB) Chap. 6


    > **Note:** The command ulimit is built into the bash shell. For different shells,
    the command and its output may differ.


    According to the output, the core file size is limited to 0 blocks, meaning that
    no core files will be generated for traps. To generate a core file, we need to
    increase this limit. Bash''s ulimit is nice because it displays the command line
    parameter for each setting in parentheses after the units of size. Setting the
    core file size to unlimited and rerunning our program gives us this output:


    ```

    penguin> -c unlimited

    penguin> simple_trap

    Segmentation fault (core dumped)

    penguin> ls -l core

    -rw-------1 users 53248 2004-09-12 10:36 core

    ```


    **Note:** If you always want core files to be generated for programs that produce
    traps, add the ulimit - unlimited command to your $HOME/.profile bash startup
    script. This is assuming you use bash; the command and startup script will differ
    for other shells.


    If you want to know what is in a core file, you can quickly peek into the core
    file by running readelf -all core. For more information about the contents of
    the core file, refer to the ELF chapter (Chapter 9).


