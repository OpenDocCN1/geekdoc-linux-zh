  md: '# 9.6. Section Names and Types


    The casual term "section type" has two different meanings in technical conversation.
    One refers to the section type as defined in the sh_type field of the section
    header structure. The other refers to the combination of name and type of a section.
    For example, a section can have a (sh_type) of PROBITS, but that does not describe
    what is in the section. On the other hand, someone might ask "what type of section,"
    and the response is usually the section name, such as "rodata" or "text".


