  md: '# Concepts and Definitions


    ```

    penguin> nm -v -fs main.o |egrep printf

    printf | U | NOTYPE | | *UND*

    ```


    Other ELF symbols describe variables that are read-only or not initialized (these
    have a "class" of R and B, in nm output).

    ELF also has absolute symbols (marked with an A by nm) that are used to mark an
    offset in a file. The following command shows few examples:


    ```

    penguin> nm -v -fs libfoo.so |egrep " A " | *ABS*

    _DYNAMIC | 0001c48 | A OBJECT | *ABS*

    _GLOBAL_OFFSET_TABLE | 0001d38 | A OBJECT | *ABS*

    _bss_start | 0001d74 | A NOTYPE | *ABS*

    _edata | 0001d74 | A NOTYPE | *ABS*

    _end | 0001d84 | A NOTYPE | *ABS*

    ```


    Notice that the absolute symbols do not include a size because they are meant
    only to mark a link in an ELF file.


    # 9.2.1.1 Symbols Names and C Versus One of the unfortunate problems with C code
    is symbol name collisions. With so much software in the world, it is uncommon
    for two developers to pick the same name for two different functions or variables.
    This is not handled well (explained later in this chapter) by ELF or other executable
    formats and has caused problems over the years for large C-based software.


