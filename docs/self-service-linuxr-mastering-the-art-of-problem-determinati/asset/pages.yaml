  md: '# 1.3 The Four Phases of Investigation


    Changes to kernel parameters or tunable values can cause changes to behavior of
    the operating system, which can in turn cause problems for software that runs
    on the system.


    Hardware changes. Disks can fail causing a major outage or possibly just a slowdown
    in the case of RAID. If more memory is added to the system and applications start
    to fail, it could be the result of bad memory. For example, gcc is one of the
    tools that tend to crash with bad memory.


    Changes in workload (that is, more users suddenly going to a particular Web site)
    may push the system close to the limit of its resources. Increases in workload
    can consume the last bit of memory, causing problems for any software that could
    be running on the system.


    One of the best ways to detect changes to the system is to periodically run a
    script or tool that the software it runs on. When a difficult problem occurs,
    you might want to start with a quick comparison of the changes that were recently
    made on the system—if nothing else, to rule them out and investigate further.


    Using information about changes to the system requires a bit of work up front.
    If you don''t save historical information about the operating environment, you
    won''t be able to compare it to the current information when something goes wrong.
    There are some useful tools such as tripwire that can help keep a history of good,
    known configuration states.


    Another best practice is to track any changes to configuration files in a revision
    control system as CVS. This will ensure that you can “go back” to a stable point
    in the system''s path. For example, if the system was running smoothly three weeks
    ago but is unstable now, it might make sense to go back to the configuration three
    weeks prior to see if the problems are due to any configuration changes.


    # 1.3.2 Phase #2: Searching the Internet Effectively


    There are three good reasons to move to this phase of investigation. The first
    is that your boss and/or customer needs immediate resolution of a problem. The
    second reason is that your patience has run out, and the problem is going in a
    direction that will take a long time to investigate. The third is that the type
    of problem is such that investigating it on your own is not going to build useful
    skills for the future.


    Using what you learned about the problem in the first phase of investigation,
    you can search online for similar problems, preferably'
