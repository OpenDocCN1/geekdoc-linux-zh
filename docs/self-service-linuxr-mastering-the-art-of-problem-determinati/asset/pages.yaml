  md: "# 6.3 Command Line Editing\n\n# 6.3 COMMAND LINE EDITING\n\nBefore getting\
    \ into details of GDB functionality, here is a quick overview of GDB command line\
    \ editing. Command line editing will give you the ability to modify the command\
    \ line and usually includes the ability to use previous commands again (with or\
    \ without modification).\n\n> Note: By default, GDB uses the Emacs command line\
