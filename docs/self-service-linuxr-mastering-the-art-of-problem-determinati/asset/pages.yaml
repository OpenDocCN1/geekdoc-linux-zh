    # 2.3 IMPORTANT STRACE OPTIONS


    This section is not meant to be a replacement for the strace manual. The strace
    manual does a good job of documenting issues and options for strace but does not
    really describe when to use the various options. The focus of this section is
    to briefly describe the important strace options and when to use them.


    # 2.3.1 Following Child Processes


    By default strace traces the process itself and not any child processes that may
    be spawned. There are several reasons why you may need to trace or all of the
    child processes as well, including:


    +   - Tracing the activity of a command line shell.

    - Tracing a process that will create a daemon process that will continue to run
    after the command line exits.

    - Tracing inetd xinet to investigate problems relating to logging on to a system
    (an example of this is included in this chapter).

    - Some processes spawn worker processes that perform the actual work while the
    parent process manages the worker pool.


    To trace a process and all of its children, use the -f flag. Tracing with -f will
    have no effect if the process does not fork any children. However, the output
    will change if one child is:


    ```

    sigprocmask(SIG_SETMASK, [INT], [INT], 8) = 0

    rt_sigprocmask(SIG_BLOCK, [INT], [INT], 8) = 0

    rt_sigprocmask(SIG_SETMASK, [INT], [INT], 8) = 0

    rt_sigprocmask(SIG_BLOCK, [CHLD], [INT], 8) = 24745

    fork())

    [pid 14485] setpgid(24745, 24745 <unfinished>...

    ```'
