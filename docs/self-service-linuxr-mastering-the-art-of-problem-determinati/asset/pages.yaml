    Looking at offset 0x1004, we see the assembly movb $0x1, 0x0, which means to store
    the value 1 into the memory address 0x0. On x86 and AMD64 hardware, this produces
    a page fault that results in the trap we observed.


    Immediately above the assembly instruction is the C source code that resulted
    in the generation of this assembly instruction.


    ```

    char *trap = NULL;

    *trap = 1;

    ```


    This code is a blatant example of the classic NULL pointer dereferencing programming
    error. We''ve found the cause of the trap! Of course, this is the code I added
    as discussed in the "Adding a Manual Kernel Trap" section.


    Determining the line of code does not always go this smoothly. Occasionally, the
    calculated offset is nowhere found to be in the disassembled object output. One
    of the main reasons for this is the use of a different version of the kernel to
    generate the list than used to originally compile the object in which the oops
    occurs. It is extremely important to use the exact same compiler version. Different
    versions of a compiler, even minor release changes, can change the ordering of
    the assembly instructions. Different optimization levels and/or options will also
    change the generated assembly, even when the same compiler level is used. At the
    assembly level, a single different or relocated instruction will make definitively
    locating the trapping instruction very difficult. With some ingenuity, even if
    the compiler levels are slightly different, one can get close enough to the trapping
    area of kernel to discover the fault.


    # 7.2.9.1 2.4.x Kernel Oops Dumps Analyzing kernel dumps in a Linux 2.4.x kernel
    is slightly different from doing so in a 2.6x kernel. The main reason for this
    is the addition of the kallsym feature/patch to the 2.6 mainline kernel. The kallsym
    feature provides a list of all kernel symbols that the kernel can use itself to
    translate a hexadecimal address into a human readable symbol name.


    Note that 2.4-based distributions have backported the kallsym feature to their
    customized 2.4-based kernels. This means that if an oops occurs in these distributions,
    the dumped data is automatically formatted. If your distribution does not have
    the kallsym patch or you are running a 2.4.x kernel as downloaded from kernel.org,
    you will need to manually format the oops message before it is useful to anyone.
    To do this, run the utility ksymoops with the appropriate parameters as documented
    in the ksymoops(8) manual.'
