    > PTRACE_TRACEME

    Indicates that this process is to be traced by its parent. Any signal (except
    SIGKILL) delivered to this process will cause it to stop and its parent to be
    notified via wait. Also, all subsequent calls to exec this process will cause
    a SIGTRAP to be sent to it, giving the parent a chance to gain control before
    the new program begins. A process probably shouldn''t make this request if its
    parent isn''t expecting to trace it. (pid, addr, data are ignored).


    When tracing a process off of the command line, the strace output may or not capture
    the initial system calls because the child process would be running unhampered
    calling system calls all. With this, the child process (which will eventually
    be /bin/ls in this example) will stop on any system call and wait for the parent
    process (the strace process) to process the system call.


