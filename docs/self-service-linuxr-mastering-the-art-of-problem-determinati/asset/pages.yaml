    # The indispensable start-to-finish guide for every Linux professional


    Now, there''s a systematic, practical guide to Linux troubleshooting for every
    power user, administrator, and developer. In Self-Service Linux*, two of IBM''s
    Linux experts introduce a four-step methodology for identifying and resolving
    every type of Linux-related system or application problem: errors, crashes, hangs,
    performance slowdowns, unexpected behavior, and unwanted outputs. You''ll learn
    exactly how to use Linux''s key troubleshooting tools to solve problems on your
    own—and how to make effective use of the Linux community''s knowledge.


    If you use Linux professionally, this book can dramatically increase your efficiency,
