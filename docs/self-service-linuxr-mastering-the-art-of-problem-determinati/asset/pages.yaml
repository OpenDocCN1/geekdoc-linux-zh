    This helps you to get an understanding of the culture of the group.


    Consider that large audience will see your posts. That may include your present
    or next boss. Take care in what you write. Remember too, that mailing lists and
    newspapers are frequently archived and that your words may be stored for a very
    long time in a place where many people have access.


    Messages and articles should be brief and to the point. Don''t wander off-topic,
    and don''t send mail or post messages solely to point out other people''s errors
    in typing or spelling. These, more than any other behavior, mark you as an immature
    beginner.


