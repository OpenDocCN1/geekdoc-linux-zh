    # 6.6.3 Breakpoints


    Breakpoints are a method to stop the execution of a program in a function at a
    particular point in the code or on a particular condition. We''ve been using breakpoints
    throughout this chapter, which goes to show how they can appear. To see the current
    list of breakpoints set, use the “info breakpoints” command.


    ```

