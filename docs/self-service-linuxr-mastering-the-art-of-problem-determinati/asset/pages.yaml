  md: '# strace and System Call Tracing Explained Chap. 2


    Once attached, both the strace tool and the traced process behave as if strace
    ran the process off of the command line. Attaching to a running process establishes
    a special parent-child relationship between the tracing process and the traced
    process. Everything is pretty much the same after strace is attached. All of the
    same trace options work whether strace is used to trace a program off of the command
    line or whether strace is used to attach to a running process.


    # 2.4 Effects and Issues of Using Strace


    The strace tool is somewhat intrusive (although it isn''t too bad). It will slow
    down the traced process, and it may also wake up a sleeping process if the process
    is waiting on pause(). . It is rare that strace actually causes any major problems,
    but it is good to be aware of the effects.


    The strace tool prints its output to stderr, which makes it a bit easier to separate
    the output from the traced tool''s output (if tracing something off of the command
    line). For csh or tsh, you can use something like `strace /bin/ls > /dev/null
    |` to see the actual trace output without the output from the traced program (/bin/ls
    in this case). Other shells support separating stderr and stdout, although it
    is usually easier to send the output to a file using the -o switch to strace.
    This also ensures that the output is completely clean and without any stderr output
    from the traced process.


    When a setuid program is run off of the command line, the program is run as the
    user of the strace program, and the setuid does not take place. There are also
    security protections against tracing a running program that was setuid. Even if
    a running setuid-root program changes its effective user ID back to the real user
    ID, strace will not be able to attach to the process and trace it. This for security
    reasons the process may still have sensitive information in its memory from when
    it was running as root.


    If a program is setuid to root, strace requires root privileges to properly trace
    it. There are two easy ways to trace a setuid-root program, both of which require
    root privileges. The first method is to trace the setuid program as root. This
    will ensure the setuid-root program is also traced as root, the real user ID will
    be root and not a mortal user as would normally be the case. The other method
    is to trace the shell as root using the -f switch to follow the setuid-root program
    and its invocation. The latter method is better, although it is a bit less convenient.'
