  md: '# 6.5 Examining Data, Memory, and Registers


    The memory map is important for a few reasons:


    +   - It tells you where each shared libraries are loaded and at which addresses.

    Memory accessed outside of the valid memory segments will cause a segmentation
    violation. If the address is in the memory map for a shared library, it is probably
    a global variable or function in that shared library.

    You can tell if the heap or stack collided with another memory segment (for example,
    if there is no space between the heap and stack and the next segment).


    The best way to look at the memory map for a live process in GDB is to use a shell
