  md: "# 7.2 Gathering Information\n\n```\n<message origin> = kernel: usb.c\n<message\
    \ text> = deregistering driver serial\n```\n\nWe know from the message origin\
    \ that the message came from the kernel, and we are also given the exact source\
    \ file containing the message. We can now easily examine usb.c and search for\
    \ the message text to see exactly where kernel execution was. The code in question\
    \ looks like this:\n\n```\n/**\n* usb_deregister - unregister a USB driver\n*\
    \ @driver: USB operations of the driver to unregister\n */\n// Unlinks the specified\
    \ driver from the internal USB driver list.\nvoid usb_deregister(struct usb_driver\
    \ *driver)\n{\n    struct list_head *tmp;\n\n    info(\"deregistering driver %s\"\
    , driver->name);\n    if (driver->fops != NULL)\n        usb_minors(driver->minor[16])\
    \ = NULL;\n```\n\nKnowing exactly what this code does is important—it is important\
    \ at this time to know how by a simple log message we can determine exactly what\
    \ was executed, which can be invaluable in problem determination. One thing to\
    \ note, though, that info is a macro defined as:\n\n```\n#define info(format,\
    \ arg...) printk(KERN_INFO __FILE__\": \"\\n\", arg)\n```\n\nAs you can see, printk\
    \ is the key function that performs the act of writing the message to the kernel\
    \ message buffer. We can also see that the standard C __FILE__ is used to dump\
    \ the source filename.\n\nThere is, however, no guarantee that anything will appear\
    \ in the syslog. Often, in the case of a crash, the klogd logger is unable to\
    \ write the information to disk. This is when a serial console becomes important.\
    \ When properly configured, the kernel will send important log messages to the\
    \ serial console as well as to the buffers where the syslog daemon picks them\
    \ up. After the messages are sent over the serial line, the remote console will\
    \ receive the messages and preserve them.\n\n# 7.2.2 Setting up a Serial Console\n\
    \nPossibly one of the most important tools in diagnosing and determining the cause\
    \ of system crashes or hangs is the use of a serial console to gather diagnostic\
    \ information. A serial console is not something every system"
