  md: "# The Stack Chap. 5\n\nSo now that we know conceptually where the stack resides\
    \ and how it works, let's find out where it really is and how it really works.\
    \ The exact location will vary by architecture, but it will also vary by distribution.\
    \ This is because some distributions include various patches and changes to the\
    \ kernel source that modify the process address space. On SUSE 9.0 Professional\
    \ and SLES 8 distributions the stack segment starts at 0xc0000000 running in this\
    \ view via /proc/<pid>/maps file.\n\n```\n08048000-40018000 r-xp 00000000 03 293559\
    \ /u/dbehman/book/working/\n-foo\n08049000-0804a000 rw-p 00000000 03 293559 /u/dbehman/book/working/\n\
    -foo\n40000000-40018000 r-xp 00000000 00 6664 //lib/ld-2.3.2.so\n40018000-40019000\
    \ rw-xp 00017000 00 6664\n40019000-4015b000 r-xp 00000000 00 00 //lib/ld-2.3.2.so\n\
    40028000-4015a400 r-xp 00000000 03 6664 /lib/i686/libc.so.6\n40154000-40159000\
    \ rw-p 0012c000 03 6664 /lib/i686/libc.so.6\n40159000-4015b000 rw-p 00000000 00\
    \ 00\nbfffe000-c0000000 rwx fffff 00 00\n```\n\nRemember, the stack grows towards\
    \ smaller addresses, the reason why 0xc0000000 is the end value in the stack address\
    \ range of 0xbffe0000.\n0xc0000000.\n\nNow to prove to ourselves that this range\
    \ is in fact the stack segment, let's write a small program that simply declares\
    \ a local variable and then prints that variable's address.\n\n> Note: Local variables\
    \ are also referred to as stack variables given the storage for them is obtained\
    \ from the stack segment.\n\nThe source code for the program is as follows:\n\n\
    ```\n#include <stdio.h>\n\nint main( void )\n{\n    int stackVar = 3;\n    char\
    \ szCommand[64];\n\n    printf(\"Address of stackVar is 0x%x\\n\\n\", &stackVar);\n\
    \n    sprintf(szCommand, \"cat /proc/%d/maps\", getpid());\n    system( szCommand\
    \ );\n\n    return 0;\n}}\n```"
