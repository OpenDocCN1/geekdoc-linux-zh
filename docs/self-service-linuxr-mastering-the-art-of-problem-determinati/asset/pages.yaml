    # 3.3 Kernel INFORMATION AND MANIPULATION


    At the same level in the /proc filesystem hierarchy that all the process ID directories
    are located a number of very useful files and directories. These files and directories
    provide information and allow setting items at the system and kernel level rather
    than per process. Some of the most useful and interesting entries are described
    in the following sections.


    # 3.3.1 /proc/cmdline


    This is a special version of the cmdline that appears in all /proc/<pid> directories.
    It shows all the parameters that were used to boot the currently running kernel.
    This can be hugely useful especially when debugging remotely without access to
    the computer.


    # 3.3.2 /proc/config.gz or /proc/sys/config.gz


    This file is not part of the mainline kernel source for 2.4.24 to 2.6.0, but some
    distributions such as SU have included it in their distributions. It is very useful
    to quickly examine what options the kernel was compiled with. For example, if
    you wanted to quickly find out if your running kernel was compiled with Kernel
    Magic SysRq support, search /proc/config.gz for SYSRQ:


    ```

    penguin> zcat config.gz | grep SYSRQ

    CONFIG_MAGIC_SYSRQ=y

    ```


