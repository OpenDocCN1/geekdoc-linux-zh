  md: '# Best Practices and Initial Investigation Chap. 1


    For quick reference, here is the list:


    +   - The exact time the problem occurred

    - Dynamic operating system information

    - What you were doing when the problem occurred

    - A problem description

    - Anything that may have triggered the problem

    - Any evidence that may be relevant


    The more serious and complex the problem is, the more you''ll want to start writing
    things down. With a complex problem, other people may need to like most people,
    to get involved, and the investigation may get complex enough that you''ll start
    to forget some of the information and theories you''re using. The data collector
    included with this book can make your life easier whenever you need to collect
    information about the OS.


    # 1.3.3.1 Use an Investigation Log


    Even if you only have one complex, critical problem to work at a time, it is still
    important to keep track of what you''ve done. This doesn''t mean well written,
    grammatically correct explanations of everything you''ve done, but it does mean
    enough detail to be useful to you at a later date. Assuming that you''re like
    most people, you won''t have the luxury of working on a single problem at a time,
    which makes this even more important. When you''re investigating 10 problems at
    once, it sometimes gets difficult to keep track of what has been done for each
    of them. You also stand a good chance of hitting a similar problem again in the
    future and may want to use some of the information from the first investigation.


    Further, if you ever need someone else in the investigation, an investigation
    log can prevent a great deal of unnecessary work. You don''t want others unknowingly
    spending precious time to re-doing your hard earned steps and finding the same
    results. An investigation log can also point others to what you have done so that
    they can make sure your conclusions are correct up to a certain point in the investigation.


    An investigation log is a history of what has been done so far for the investigation
    of a problem. It should include theories about what the problem could be or what
    avenues of investigation might help to narrow down the problem. As much as possible,
    it should contain real evidence that leads you to the current point of investigation.
    Be very careful about making assumptions, and be very careful about qualitative
    proofs (proofs that contain no concrete evidence).'
