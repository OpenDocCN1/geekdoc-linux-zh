- img_proc: true
  md: "# B.3 The Script Source\n\n```\n#!/bin/bash\n```\n\n```\n####################################################################################################\n\
    # This script captures basic information for when a problem occurs.\n# It can\
    \ be used any time a problem occurs, as root or as a mortal user.\n#####################################################################################################################\n\
    ```\n\n```\nusage=\"Usage: vacuum [ -thorough | -perf | -hang <pid> | -trap |\
    \ -error <cmd> ]\"\nmode_thorough=0\nmode_perf=0\nmode_hang=0\nmode_trap=0\nmode_error=0\n\
    topdir=\"\" # The data collection directory\n```\n\n```\nif [ -n $HOME ]\nthen\n\
    \  topdir=$HOME/investigations\nelelse\n  topdir=-/investigations/$\n```\n\n```\n\
    if [ $$ -gt 0 ]\nthen\n  while true; do\n    case $1 in\n      \"-thorough\" )\n\
    \        mode_thorough=1\n        shift\n        ;;\n      \"-perf\" )\n     \
    \   mode_perf=1\n        mode=\"PERF\"\n        shift\n        ;;\n      \"-hang\"\
    \ )\n        mode_hang=1\n        shift\n        if [ $$ -le 0 ]\n        then\n\
    \          echo $usage\n          exit 2\n        fi\n        pid=$1\n       \
    \ shift\n        ;;\n      \"-trap\" )\n        mode_trap=1\n        shift\n \
    \       ;;\n    esac\n  done\n```"
