  md: '# CHAPTER 6


    # The GNU Debugger (GDB)


    # 6.1 INTRODUCTION


    A debugger is perhaps the single most important and comprehensive tool for troubleshooting
    any problem, developing applications, using reverse engineering, or just self-educating.
    There are many different kinds of debuggers across all different platforms—some
    are commercial products that may not be included with an associated commercial
    compiler. The GNU Debugger, or more commonly called GDB, is one of the few that
    is available across a myriad of hardware platforms running Linux including i386,
    x86-64, SPARC, PA-RISC, RS/6000, s390 as well as various flavors of Unix operating
    systems AIX, HP-UX, and Solaris. There is a great deal of documentation currently
    available for GDB and the various Graphical User Interfaces (GUIs) that act as
    front ends for it, so the goal of this chapter is to explain some of the key aspects
    of the debugger in more detail as well as present some of the lesser known tips
    and tricks of the trade.


    A fully-featured debugger should be considered a necessity on any operating system,
    but unfortunately most operating systems do not come with one. A debugger gives
    you the ability to peek ''under the hood'' to see exactly what a process is doing.
    Using a debugger, you can examine values in memory, look at the stack trace, and
    control the process. Some operating systems include a basic debugger (for example,
    adb), while others include no debugger at. Fortunately, Linux comes with one of
    the best debuggers available: GDB. The GDB debugger is fully-featured, stable,
    and available for free, which means Linux has an advantage over most other operating
    systems. GDB is also the most portable debugger currently available on all architectures.


    Learning to use GDB is important for two reasons. The first is that in an open
    source environment, many of the applications have the source code freely available.
    This makes a debugger very useful tool for self-service that the application can
    be rebuilt with debug information (see Chapter 4, “Compiling,” for more information
    on compiling in debug). The other reason it is important to learn GDB is that
    it is a freely available tool that can help to solve many types of problems on
    Linux. For example, a memory corruption or code logic error is extremely challenging
    to debug without a debugger (these can be difficult enough with a debugger!).'
