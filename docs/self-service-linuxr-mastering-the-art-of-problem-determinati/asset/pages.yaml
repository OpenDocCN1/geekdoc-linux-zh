    # 5.6 REFERENCING AND MODIFYING DATA ON THE STACK


    We have seen by now that the stack is crucial for proper and flexible program
    execution. We''ve also seen that the stack really isn''t as complex as it may
    seem to be. This section will explain how data is stored on the stack and how
    it is manipulated.


    Recall our simple C program from the earlier section, “The BP and SP Registers,”
    where we declare a simple stack variable like this:


    ```

    int localVar = 99;

    ```


    Recall further that the assembly produced for this area of the program consisted
    of these three instructions, which make up the function prolog:'
  merge: -1
  pgno: 194
- img_proc: true
  md: '```

    pushl   %ebp

    movl    %esp, %ebp

    subl    $4, %esp

    ```


    The subl instruction effectively increases the size of the stack by 4 bytes--keep
    in mind that the stack grows down toward lower addresses on x86. Because we know
    that the function in question only declares one local variable, int localVar,
    we know that this space is created for it. Therefore, at this point we could define
    the memory location holding localVar''s value as whatever the register esp holds.
    This method does not work well, however, the value of esp will change as more
    local variables are declared. The correct method is to reference ebp (the base
    or frame pointer). We can see that this is done, in fact, by looking at the next
    instruction in the assembly listing from our small program:


    ```

    movl    $99, -4(%ebp)

    ```


    This instruction is taking care of assigning the value 99 to localVar, or as it
    is referred to in assembly, which essentially means "the value stored in ebp offset
    -4 bytes." Note that some assembly outputs, for example objdump -d <object>, might
    show the values as hex instead, which would look like:


    ```

    movl    $0x63,0xffffff(%ebp)

    ```


    When it is known in which offset relative to the frame pointer a particular variable
    is stored, you can see other places that variable is referenced through an assembly
    listing of the same function.

    Let us quickly look how this reflects on the term "pass by reference." To summarize,
    when you want to change the value of a parameter within the called function, the
    programmer must be to pass the address of the parameter rather than the value
    of it. Understanding how the stack works can solidify this rule in one''s mind.
    Recall function3 from stack.c source code, which is declared as:


    ```

    void function3( int *passedByReference )

    ```


    Also bear in mind that a call to this function is made in function2, which passes
    the address of the local variable localInt to it:


    ```

    function3( &localInt );

    ```'
