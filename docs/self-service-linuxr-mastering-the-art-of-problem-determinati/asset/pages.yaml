  md: "# 9.9 Tips and Tricks\n\n# 9.9 TIPS AND TRICKS\n\nThis next section covers\
    \ some useful tips and tricks for more advanced debugging. The tips include more\
    \ advanced ways to attach to a process at a particular point in time, methods\
    \ to find the address of variables and functions, and a useful technique for viewing\
    \ data structures fully formatted for an executable/or library that was not built\
    \ in debug mode (that is, with -g).\n\n# 9.9.1 Attaching to a Process—Revisited\n\
    \n9.9.1.1 The pause() method Sometimes you run into a situation where you need\
    \ to get a debugger into GDB under specific conditions. For example, you might\
    \ be investigating a problem that disappears when you compile the program with\
    \ -g. In this case, you won't be able to set a breakpoint at a file name and line\
    \ of code. Because there is no debug information, you might need to add some special\
    \ code into the program to set a manual type of breakpoint.\n\nThere are three\
    \ good ways to stop a program at a specific point and attach a debugger:\n\n+\
    \   - Use the pause function.\n- Use a for while loop.\n- Use the system() function\
    \ to spawn an xterm.\n\nThe pause() function will cause the process to wait until\
    \ it receives a signal (see the pause(2) for more information). Unfortunately,\
    \ GDB occasionally has difficulty in properly handling situations like this, so\
    \ a simple trick may be needed to ensure it works properly. Consider the following\
    \ code:\n\n```\n#include <stdio.h>\n#include <unistd.h>\nint main( void ) \n{\n\
    \    int foo = 1;\n    printf(\" my pid = %d\\n\", getpid());\n    pause();\n\
    \    printf(\" got signal, resuming!\\n\" );\n    return( 0 );\nn\n```"
