    # 9.16 Conclusion


    ELF is one of those overlooked and under-appreciated aspects of the Linux operating
    system (as well as many other OSs). However, a solid understanding of ELF and
    how to use it to increase your debugging options is absolutely critical for any
    Linux expert. Hopefully this chapter provided an in-depth and useful look behind
    the scenes of the all-forgotten details of ELF.'
