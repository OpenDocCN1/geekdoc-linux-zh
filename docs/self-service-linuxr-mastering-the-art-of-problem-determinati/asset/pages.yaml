  md: '# 44 strace and System Call Tracing Explained Chap. 2


    debugger cannot follow the interrupt into the kernel but will treat it pretty
    much as any other instruction.


    Invoking a system call follows a calling convention called a system call calling
    convention. For function calls, the calling function and called function need
    to use the same calling convention. For system calls, the invoking function and
    the kernel need to follow the same calling convention. A failure to follow the
    convention of either side of the function or system call will result in unexpected
    behavior.


    > Note: Applications built for one operating system can run on another operating
    system on the same hardware if 1) the same file object type is supported (for
    example, ELF); 2) the function calling conventions are the same; 3) the system
    calling conventions are the same; and 4) the behavior of the called functions
    and system calls are the same. The actual OS-supplied functions and OS-supported
    system calls may have completely different code under the covers, but as long
    as the interfaces are the same, an application won''t know the difference.


    The basic system calling convention for Linux on IA-32 is simple. The arguments
    to a system call are stored in the following registries:


    | Argument # | Registry |

    |---|---|

    | 1 | EBX |

    | 2 | ECX |

    | 3 | EDX |

    | 4 | ESI |

    | 5 | EDI |


    The return value for a system call is stored in the EAX register from the kernel.
    In other words, a system call could be represented as:

    EAX = syscall(EBX, ECX, EDX, ESI, EDI) ;


    If an error occurs, a negative return value will be returned (that is, EAX will
    be set to a negative value). A zero or positive value indicates the success of
    a system call.


    Going back to the assembly listing for the open call in libc (the C library),
    it is easy to see the system call convention when:


    ```

    bf9b1:      8b 54 24 10    mov     0x10(%esp,1),edx

    bf9b5:      8b 4c 24 0c    mov     0xc(%esp,1),ecx

    bf9b9:      8b 5c 24 08    mov     0x8(%esp,1),ebx

    bf9bd:      00 05 00 00    mov     0x5,%eax

    bf9c2:      cd 80            int     0x80

    bf9c4:      5b              pop     %ebx

    ```'
