  md: '# Preface


    Linux is the ultimate choice for home and business users. It is powerful, as stable
    as any commercial operating system, secure, and best of all, it is open source.
    One of the biggest deciding factors for whether to use Linux at home or for your
    business can be service and support. Because Linux is developed by thousands of
    volunteers from around the world, it is not always clear who to turn to when something
    goes wrong.


    In the true spirit of Linux, there is a slightly different approach to support
    than the commercial norm. After all, Linux represents an unparalleled community
    of experts, it includes industry leading problem determination tools, and, of
