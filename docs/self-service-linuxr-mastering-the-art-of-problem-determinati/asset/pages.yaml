    3.2.2.1.6 The Kernel Segment The only remaining segment in a process'' address
    space to discuss is the kernel segment. The kernel segment starts at 0x0c000000
    and is inaccessible by user processes. Every process contains this segment, which
    transferring data between the kernel and the process''s virtual memory quick and
    easy. The details of this segment''s contents, however, are beyond the scope of
    this book.


    > Note: You may have realized that this segment accounts for one quarter of the
    entire address space for a process. This is called 3/1 split address space. Losing
    1GB out of 4GB is not a big deal for the average user, but for high-end applications
    such as database managers or web servers, the real solution is to use a 64-bit
    platform where the address space is not limited to 4GB, but due to the large amount
    of existing 32-bit x86 hardware, it is advantageous to address this issue. There
    is a patch known as the 4G/4 patch, which can be found at ftp.kernel.org/pub/linux/kernel/people/akpm/patches/
