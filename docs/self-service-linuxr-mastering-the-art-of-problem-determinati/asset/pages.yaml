    # 5.5.2.2 x86-64 Architecture The calling conventions for x86-64 are a bit more
    complex than for x86. The primary difference is that than all the functions''
    arguments being pushed on the stack before a function call as is on x86, x86-64
    makes some of the general purpose registers first. The reason for this is that
    the x86-64 architecture provides a few more general purpose registers than x86,
    and using them rather than pushing the arguments onto the stack that resides on
    much slower RAM is a very large performance gain.


    Function parameters are also handled differently on their data type classification.
    The main classification, referred to as INTEGER, is any integral data type that
    can fit into one of the general purpose registers (GPR). Because the GPRs on x86-64
    are all 64-bit, this covers the majority of data types passed as function arguments.
    The calling convention that is used for this data classification is (arguments—from
    left to right—assigned to the following GPRs)


    ```

    %rdi

    %rsi

    %rdx

    %rcx

    %r8

    %r9

    ```


    Remaining arguments are pushed onto the stack as in x86. To illustrate this, consider
