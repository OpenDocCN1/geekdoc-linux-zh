    is passed as the first and only argument to the program. From the program''s point
    of view, it is identical to running from the shell as hang user (hang is the name
    of the program).


    The command break main was used to set a breakpoint on the function main(). This
    is the first user-code function called in normal C programs and for C++ programs
    that do not have global objects to initialize. The term "user-code" is used to
    describe the code that would be compiled for the application and does not include
    the operating system functions that may be called in addition, such as the Run
    Time Linker functions (refer to the ELF chapter for more details on the Run Time
    Linker). Because the program was compiled with -g, it contains debug information
    that allows the debugger to identify the lines of code in the main function. Unless
    you are debugging the constructors of global C++ objects, the main function is
    a good way to stop the debugger at the beginning of the program execution.


    You can also use the args GDB variable to set the line arguments instead of them
    them the the command. This is particularly useful if the command line arguments
    are long and difficult to type in. With the args variable, you can set the command
    line arguments once and then run on own from here. Here is short example to show
    how this works:


    ```

    (gdb) show args

    Argument list to give program debugged when it is started ""

    (gdb) set args 6 7

    (gdb) show args

    Argument list to give program debugged when it is started "6 7"

    (gdb) run

    ```


    In the preceding example, the program is executed as if from a shell prompt with
    arguments 6 and 7 as the first and second arguments, respectively.


    Environment variables are another way in which the user can affect the execution
    of a program. Because GDB provides a controlled environment for the program in
    which to run, the environment variables can be manipulated as well. The command
    show environment will display the current environment just as the env command
    in a bash shell. To set an environment variable, use the set environment command
    with variable=value pair. To unset a variable use the unset environment command.
    This is shown in the following example:


    ```

    (gdb) set environment FOO=BAR

    (gdb) show environment FOO

    FOO = BAR

    (gdb) unset environment FOO

    (gdb) show environment FOO

    Environment variable "FOO" not defined.

    (gdb)

    ```'
