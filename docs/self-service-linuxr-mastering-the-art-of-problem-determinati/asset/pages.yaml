  md: '# 4.4 Compiling the Linux Kernel


    By looking at the failing line, it might not be obvious right away the problem
    could be without looking at the definition of _us. Using cscope (the section "Setting
    Up cscope to Index Kernel Sources" for more information), we see that _ua is defined
    for each particular architecture. Because this was encountered at i386, the appropriate
    file to look at is /usr/src/linux-2.4.20/include/asm-i386/types.h. By selecting
    this file in cscope, the file is opened, and the cursor is placed directly on
    the line containing the definition:


    When substituting this definition into the failing line to see exactly what the
    compiler sees, we get:


    ```

    unsigned char short slot_tablelen;

    ```


    This certainly doesn''t look right given that a char and a short are completely
    different primitive C data types. This appears to be a coding error or typo. The
    problem now is to try to figure out whether the code author wanted a char or a
    short. Just by searching the pathname of the failing code (drivers/ide-cd.h) and
    the fact that this is a structure, I''m very hesitant to guess at the correct
    value since—if it is incorrect—that could be risking disk and filesystem corruption
    (IDE is a commonly used disk controller on x86-based computers).


    With this kind of issue, it''s very likely that others have had the same problem.
    Because of this, searching the Internet should be the next step. Plugging ide-cd.c
    slot_tablelen into a search engine instantly shows that this has been reported
    by others.


    It took a bit of time to read through the first five or so results to find the
    solution, but it turned out that it was in fact a typo, and the line should instead
    have read:


    ```

    __u16 slot_tablelen;

    ```


    When making this change to ide-cd.h and re-running the compilation, ide-cd.c successfully
    compiled!


    So what is the real cause of this particular failure? I did a more investigative
    work and found that it could be categorized as a code error and as a compiler
    difference. The code itself is really incorrect; two primitive data types should
    never be used to declare a single variable as done in this case. It seems however,
    that some compilers allow this particular case, and some don''t. Moreover, in
    this particular case, older versions of gcc allowed this where newer versions
    did not.'
