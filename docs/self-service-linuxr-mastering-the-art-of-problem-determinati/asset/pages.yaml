  md: '# 3.4 System Information and Manipulation


    # 3.4.2 /proc/sys/kernel


    This directory contains several very important files related to kernel tuning
    and information. Much of the information here is low-level and will never need
    to be examined or changed by the average user, so I''ll just highlight some of
    the more interesting entries, especially pertaining to problem determination.


    3.4.2.1 core_pattern This file is new in the 2.6 kernel, but some distributions
    such as SuSE have back ported it to their 2.4 kernels. Its value is a template
    for the file written when an application dumps its core. The advantage of using
    this is that with the use of % specifiers, the administrator has full control
    of where core files get and what their names will be. For example, it may be advantageous
    to create a directory /core and set the core_pattern with a command something
    like the following:


    ```

    penguin echo "/core.%e.%p" > core_pattern

    ```


    For example, if the program foo causes an exception and dumps its core, the file
    /core/core3135 will be created.


    3.4.2.2 msgmax, msmnb, and msgmn These three files are used to configure the kernel
    parameters for System V IPC messages. msgmax is used to set the limit for the
    maximum number of bytes that can be written on a single message queue. msmnb stores
    the number of bytes used to initialize subsequently created message queues. msgmn
    defines the maximum number of message queue identifiers on the system. These values
    are often very dependent on the workload that your system is running and may need
    to be updated. Many applications will automatically change these values but may
    require the administrator to do it.


    3.4.2.3 panic and panic_on_ops The panic file lets the user control what happens
    when the kernel enters a panic state. If the value of either file is 0, the kernel
    will loop and therefore the machine will remain in the panic state until manually
    rebooted. A non-zero value represents the number of seconds the kernel should
    remain in panic mode before rebooting. Having the kernel automatically reboot
    the system in the event of a panic could be a very useful feature if high availability
    is a primary concern.'
