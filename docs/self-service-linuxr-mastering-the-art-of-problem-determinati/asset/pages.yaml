- img_proc: true
  md: '# Best Practices and Initial Investigation Chap. 1


    If one of the processes is hanging, there may be quite a few other processes that
    have the same (similar) stack trace, all waiting for a resource or lock held by
    the original hung process. Look for a process that is stuck on something unique,
    one that has a unique stack trace. A unique stack trace will be different than
    all the rest. It likely show that the process is stuck waiting for a reason of
    its own (such as waiting for information over the network).


    Another cause of an application hang is a dead lock/latch. In this case, the stack
    traces can help to figure out which locks/latches are held by finding the source
    code and understanding what the source code is waiting for. Once you know which
    locks or latches the processes are waiting for, you can use the source code and
    the rest of the stack traces to understand where and how these locks or latches
    are acquired.


    > Note: A latch refers to a very light locking mechanism. A lock is a more general
    term used to describe a method to ensure mutual exclusion over the access of a
    resource.


    # 1.4.1.3.2 Very Busy Systems


    Have you ever encountered a system that seems completely hung at first, but after
    a few seconds or minutes you get a bit of response from the command line? This
    usually occurs in a terminal window or on the console where your strokes only
    take every few seconds or longer. It could be the sign of a very busy system or
    in some cases a very busy disk drive. For busy disks, the prompt may be responsive
    until you type a command (which in turn uses the file system and the underlying
    busy disk).


    The biggest challenge with a problem like this is that once it occurs, it can
    take minutes or longer to run any command and see the results. This makes it very
    difficult to diagnose the problem quickly. If you are managing a small number
    of systems, you might be able to use a special tether connection to the system
    when the problem occurs again.


    The first step is to log on the system before the problem occurs. You''ll need
    a root account to renice (reprioritize) the shell to the highest priority, and
    you should change your current directory to a file system such as /proc that does
    not use physical disks. Be sure to unset the environment variables so that the
    shell not search for libraries or executables. Also when the problem occurs, it
    may help to type your commands into a separate text editor (on another system)
    and paste the entire line into the remote (for example, telnet) session of the
    problematic system.


    When you have a more responsive shell, the normal set of commands (starting with
    top) will help you to diagnose the problem much faster than before.'
  merge: -1
