  md: '# 6.11 Threads


    Here is the compile line we''ll use to compile the program:


    ```

    penguin g++ threads.C -o threads -lpthread

    ```


    Notice that we need to include -lpthread for the posix thread library. This is
    required for multi-threaded applications on Linux.


    Before we examine this multi-threaded program, it is worth to mention that the
    thread support in Linux depends on the version of your Linux kernel. If we run
    this program on an older Linux kernel (pre-version 2.6), there will be three "processes"
    according to a ps listing (one original process and two threads):


    ```

    penguin ps -fu wilding | egrep threads | egrep -v grep

    widening 19151 19400 0 08:46 pts/2 00:00:00 threads

    widening 19152 19151 0 08:46 pts/2 00:00:00 threads

    widening 19152 19152 0 08:46 pts/2 00:00:00 threads

    ```


    This is due to the original implementation of threads (known as "Linux Threads\
    which made each thread look very much like an individual process. It is also worth
    noting that there are three threads when we would expect only two—the main thread
    and the thread created by the main thread. The extra thread may or not be created,
    again depending on the implementation of threads on your system.


    In a more recent Linux kernel (version 2.6+), you will see only one process because
    the threads will not show up as processes as in earlier Linux kernels:


    ```

    penguin2 ps -fu wilding | egrep threads

    widening 22959 22534 0 13:05 pts/10 00:00:00 threads

    widening 22964 22865 0 13:05 pts/16 00:00:00 /bin/grep -E threads

    ```


    This newer implementation is called Native POSIX Thread Library (NPTL) and is
    included in recent versions of the Linux kernel. Despite the differences, the
    two implementations can be treated pretty much like the same way from GDB. In
    any case, let''s see what these threads look like within GDB. the info threads
    command:


    ```

    (gdb) info threads

    2 10274887004 (LWP 22996) 00000002a956c6d2af in __write_nocancel

    (from) /lib64/tls/libc.so.6

    * 1 18290290144 (LWP 22979) 00000002a95673f9f in pthread_join

    (from) /lib64/tls/libpthread.so.0

    ```


    From the preceding output, we can see two threads: the main thread and the one
    we created with pthread_create(). The * character beside thread #1 in the output
    that indicates the current thread in GDB is thread #1.'
