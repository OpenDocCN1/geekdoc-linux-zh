  md: '# ELF: Executable and Linking Format Chap. 9


    It is the run time loader/linker''s responsibility to load the program if needed
    and perform all initialization. The initialization includes finding all required
    libraries, calling initialization functions, performing required relocations,
    and so on. However, before it initializes the program, it needs to initialize
    itself. This is actually a fairly complex process that is beyond the scope of
    this chapter. The reason for its complexity is that the run time linker has to
    do this manually because the regular methods rely on some setup that does not
    exist when the run time linker starts.


    The run time loader/ld.so also has a special environment variable to help debug
    it. This environment variable instructs ld.so to show all the main activity while
    in a program. In other words, it is like a trace of the run time linker/loader.
    Here is an example of this debug mode in action:


