  md: '# ELF: Executable and Linking Format Chap. 9


    ![](img/f8e4ea98e89e9d2b5bd054d231ecdbba_371_0.png)


    **Fig. 9.3** ELF hash algorithm.


    In the diagram, the function printf is run through the hash function to retrieve
    a numeric value. The modulus of this numeric value with the hash table size provides
    an index into the hash bucket table. The hash bucket table contains an index into
    the symbol table as well as the hash chain table. At this point, the symbol name
    in the symbol table (pointed to by the hash bucket slot) is checked against printf
    (“C1” in the diagram). If the symbol name at this entry in the symbol table doesn’t
    ARmatch, the index of the chain table is used.


    Each chain table entry contains an index into the symbol table as well as the
    index of the next element in the chain if there are any. The symbol table entry
    from the first chain table entry is compared against printf (“C2” in the diagram).
    According to the diagram, there was no match, so the next element in the chain
    is used. This happens again until the function printf is found in the symbol table
    after four comparisons (the symbol is found in “C4” according to the diagram).


    This is more complex but much more efficient than using a linear search in the
    symbol table, especially for large symbol tables.'
