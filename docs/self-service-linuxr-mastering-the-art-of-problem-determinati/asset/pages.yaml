  md: '# ELF: Executable and Linking Format Chap. 9


    The shared library is created, although the relocations are very different. The
    relocation type for the functions is PC32 and modifies the executable code. How
    does this work, though? The text segment is always loaded as read-only, and yet
    these relocations apparently change values in the text segment. For a better understanding
    of this specific type of relocation, let''s build libfoo.so without using the
    -f switch and run the executable foo, seeing how it modifies the text segment
    of libfoo.so.


    ```

    penguin> g++ -c foo.C

    penguin> g++ -shared foo.o -o libfoo.so

    penguin> g++ foo main.o -L -Wl,-rpath,-foo

    ```


    Now use strace to see how this works under the covers:


    ```

    penguin> strace -o foo.st

    This is a printf format string in baz

    This is a printf format string in main


    peng> less foo.st

    <...

    read("/libfoo.so", O_RDONLY) = 3

    read("\x77ELF\x1\1\1\1\0\1\0\1\0\0\1\3\0\3\1\0\0\367\0\...", ...)

    =>1024 = 1024

    fstat(64, {st_mode=S_IFREG|0755, st_size=7113, ...}) = 32

    getcwd("/home/wilding/linux/book/elf", 128) = 0

    mmap2(0x40015000, 4096, PROT_READ|PROT_EXEC, MAP_PRIVATE, 3, 0) = 0x40014000

    mprot(0x40015000, 4096, PROT_READ|PROT_WRITE, MAP_PRIVATE|MAP_FIXED,

    =>3, 0) = 0x40015000

    close(3) = 0

    <...

    mprot(0x40014000, 4096, PROT_READ|PROT_WRITE) = 0

    mprot(0x40014000, 4096, PROT_READ|PROT_EXEC) = 0

    ```


    The first part of the output shows where libfoo.so is loaded into the address
    space. It is loaded at address 0x40014000 as shown with the mmap2 system call.
    Later on, the run-time linker uses mprotect to change the attributes of part of
    the text section to read/write and then read/exec. In between these two calls
    is where the relocations take place in order to perform the relocations on the
    text file. These two calls to mprotect are not needed for the library that was
    built with a position-independent object because of the relocations on the GOT,
    which is in the data segment.


    Even though this type of relocation works, it is not used much in practice. Non-PIC
    code is not meant to be position-independent, and forcing it to be a shared library
    is not standard and not recommended.'
