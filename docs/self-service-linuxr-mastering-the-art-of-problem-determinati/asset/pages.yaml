  md: "# 2.4 Effects and Issues of Using strace\n\n# 2.4.1 strace and EINTR\n\nIf\
    \ you are using strace on a program that does not handle interrupted system calls\
    \ properly, the target program will very likely experience a problem. Consider\
    \ the following source code snippet:\n\n```\nresult = accept(s, addr, &addrlen);\n\
    \nif (result < 0)\n{\n    perror(\"accept\");\n    return (SOCKET) INVALID_SOCKET);\n\
    }\nelse\n    return result;\n```\n\nThis function does not handle interruptions\
    \ to the accept() call properly and is not safe to trace. If you were to strace\
    \ this process while it was waiting on accept(), the process would pop out of\
    \ the accept call and return an error via perror(). The error code (errno) received\
    \ when a system call is interrupted is EINTR. Because the process does not handle\
    \ EINTR error codes, the process will not recover, and the process may even exit\
    \ altogether.\n\nA better (and more robust) way to write this code would be\n\n\
    ```\ndo {\n    result = accept(s, addr, &addrlen);\n} while (result < 0 && errno\
    \ == EINTR)\n```\n\n```\nif (result < 0)\n{\n    perror(\"accept\");\n    return\
    \ (SOCKET) INVALID_SOCKET);\n}\nelse\n    return result;\n```\n\nThe new code\
    \ will still pop out of accept() if strace attaches to it, although the while\
    \ loop will call accept() again when it receives the EINTR error code. In other\
    \ words, when strace attaches, the code loop will see the EINTR error code and\
    \ restart the accept() system call. This code is robust with respect to interrupts\
    \ (that are caused by signals)."
