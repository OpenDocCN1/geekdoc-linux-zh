    pic.c is a smaller, less complex source file used to illustrate relocation. Lastly,
    the make file, Makefile, makes it easier to compile and link the source files
    using the make utility.


    To compile and link the source files, simply run make in the directory containing
    the files:


    penguin> make

    g++ -c main.C

    g++ -c -fPIC foo.c

    g++ -shared -fPIC -o libfoo.so

    g++ -o main.o -L,-W1,-rpath, -lffoo

    g++ -c -fPIC pic.C

    g++ -o pic.c -L -W1,-rpath,

    g++ -c pic_nopic pic.C -o pic_nopic.o

    g++ -o pic_nopic pic_nopic.o -L -W1,-rpath,,

    gcc -fPIC intercept.c

    gcc -o intercept.so -shared intercept.o


    > Note: The -fPIC option is used for some of the source files to create position
    independent object files. This is the preferred choice when creating shared libraries.
    Position-independent code is covered in more detail later in this chapter.


    > Note: The -L. switch is used for convenience. It tells the linker to look in
    the current directory(".") for shared libraries. Normally, a real shared library
    directory would be used, but this is convenient given that the shared libraries
    are in the same directory as the executables.'
