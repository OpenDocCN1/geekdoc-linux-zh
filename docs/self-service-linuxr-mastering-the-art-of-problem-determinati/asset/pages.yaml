    # 6.9.2 Finding the Address of Variables and Functions


    Processes can have dozens of libraries loaded at any given time with hundreds
    or thousands of global and static variables each. With this many global variables
    in the address space at the same time, there is a chance that two or more variables
    will have the same name. Worse, there is a chance that the wrong variable will
    be used (the ELF chapter includes more detail on this) or that you will look at
    the wrong variable using GDB. Fortunately, GDB provides a quick and easy method
    to find all variables that match a pattern (a regular expression). The following
    example finds all variables that have the string "environ" in their name:


    ```

    (gdb) info variables environnAll variables matching regular expression ".environ.*":

    ```


    ```

    File sh.func.c:

    Char **STR_environ;

    char **environ;

    ```


    ```

    File tw.init.c:

    Char **STR_environ;

    ```


    ```

    File tw.parse.c:

    Char **STR_environ;

    ```


    ```

    File sh.c:

    Char **STR_environ;

    char **environ;

    ```'
