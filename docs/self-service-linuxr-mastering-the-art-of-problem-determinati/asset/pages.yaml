- img_proc: true
  md: '# 1.4 Technical Investigation


    ![](img/f8e4ea98e89e9d2b5bd054d231ecdbba_54_0.png)


    Panic application specific


    **Fig. 1.4** Common causes of crashes.


    **1.4.1.2.1 Traps** When the kernel experiences a major problem while running
    a process, it may send a signal (a Unix and Linux convention) to the process as
    SIGSEGV, SIGBUS or SIGILL. Some of these signals are due to a hardware condition
    such as an attempt to write to a write-protected region of memory (the kernel
    gets the actual trap in this case). Other signals may be sent by the kernel because
    of non-hardware related issues. For example, a bad page-in-condition can be caused
    by a failure to read from the file system.


    The most important information to gather for a trap is:


    +   **The instruction that trapped.** The instruction can tell you a lot about
