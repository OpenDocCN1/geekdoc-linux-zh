  md: '# 9.6 Sections and the Section Header


    Key to Flags:

    W (write), A (alloc), X (execute), M (merge), S (strings)

    I (info), L (link order), G (group), x (unknown)

    O (extra OS processing required) o (OS specific), p (processor specific)


    The first section is always NULL, although there are 29 other sections, each with
    its own purpose. The most interesting sections are listed as follows with more
    detail.


    Before listing the details of each section, please note that we will be discussing
    the source file foo.c as listed later in this chapter under "Source Files." It
    has a wide range of data types that will help clarify the various sections.


    > Note: All sections start with a \ prefix in ELF.


    # 9.6.3.1 .bss There is some debate about what the bss acronym actually stands
    for. The most likely origin is from Fortran compiler on the IBM 704. The acronym
    most likely stands for “Block Started by Symbol” and was adopted to describe the
    uninitialized data for an ELF object. As the process starts up, which much meaningless,
    so consider it a term, not a useful acronym.


    The .bss section is used for global and file local variables that are not initialized
    with a specific value. It is zeroed out which sets the initial value of any variables
    in it to zero. For example, the global variable noValueGlobalInt in foo.c is stored
    in the bss section because it is the type


    ```

    penguin readelf -S libfoo.so | egrep .bss

    [21] .bss NOBITS 00001d74 00001d74 00 WA 0 0 4

    penguin nm libfoo.so | egrep noValueGlobalInt

    00001d80 B noValueGlobalInt

    ```


    According to nm, the value of the noValueGlobalInt is 0xd10. This value is right
    inside the .bss section as expected. Also notice that the section type (sh_type)
    is NOBITS, which indicates that this section takes no space in the ELF file. We
    can confirm this by looking at the loadable program headers for this library:


    ```

    penguin readelf -l libfoo.so

    Elf type is DYN (Shared object file)

    Entry point 0x7e0

    There are 4 program headers, starting at offset 52

    ```'
