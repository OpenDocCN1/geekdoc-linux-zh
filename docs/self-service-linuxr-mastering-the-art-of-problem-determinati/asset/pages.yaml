  md: '# Preface


    Chapter 5 covers intimate details about the stack, one of the most important and
    fundamental concepts of a computer system. Besides explaining all the gory details
    about the structure of a stack (which is pretty much required knowledge for any
    Linux expert), the chapter also includes and explains source code that can be
    used by the readers to generate stack traces from within their tools and applications.
    The code examples are not only useful to illustrate how the stack works but they
    can save real time and debugging effort when included as part of an application''s
    debugging facilities.


    Chapter 6 takes an in-depth and detailed look at debugging applications with the
    GNU Debugger (GDB) and includes an overview of the Data Display Debugger (GDB)
    graphical user interface. Linux has an advantage over most other operating systems
    in that it includes a feature debugger, GDB, for free. Debuggers can be used to
    debug many types of problems, and given that GDB is free, it is well worth the
    effort to understand the basic as well as the more advanced features. This chapter
    covers hard-to-find details about debugging C++ applications, threaded applications,
    as well as numerous best practices. Have you ever spawned an xterm to attach to
    a process with GDB? This chapter will show you how—and why!


    Chapter 7 provides a detailed overview of system crashes and hangs. With proprietary
    operating systems (OSs), a system crash or hang almost certainly requires you
    to call the OS vendor for help. However with Linux, the end user can debug a kernel
    problem on his or her own or to at least identify key information to search for
    known problems. If you know what will help you get the right data quickly for
    a fast diagnosis. This chapter covers everything from how to attach a serial console
    to find the line of code for a kernel trap (“oops”). The chapter provides step-by-step
    details of how to manually add a trap in the kernel and then debug it to the resulting
    line of code.


    Chapter 8 covers more details about debugging the kernel or debugging with the
    kernel debugger, kdb. The chapter covers how to configure and enable kdb on your
    system as well as some practical commands that make Linux users without being
    a kernel expert. For example, this chapter shows how to find out what a process
    is doing within the kernel, which can be particularly useful if the process is
    hung and not killable.


    Chapter 9 is a detailed, head-on look at Executable and Linking Format (ELF).
    The details behind ELF are often ignored or assumed to work. This is really unfortunate
    that thorough understanding of ELF can lead to a whole new world of debugging
    techniques. This chapter covers intimate practical details of the underlying ELF
    format as well as tips and tricks that few people know. There is even sample code
