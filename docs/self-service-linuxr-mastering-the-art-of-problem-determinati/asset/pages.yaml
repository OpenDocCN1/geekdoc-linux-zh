  md: "# 6.6.4 Watchpoints\n\nWatchpoints, as the name implies, are for watching data\
    \ in your program, especially for alerting you when data at a specific address\
    \ changes value. If you have a variable in your program that is getting changed\
    \ for some bizarre and unknown reason, this could be a symptom of memory corruption.\
    \ Memory corruption problems are extremely difficult to track down given that\
    \ it can happen long before the symptom (for example, trap or unexpected behavior).\
    \ With a watchpoint, you can tell GDB to watch the specified variable and let\
    \ you know immediately when it changes. For memory corruption, GDB will tell you\
    \ exactly where and when the corruption occurs so you can easily fix the problem.\n\
    \nThere are two kinds of watchpoints—hardware and software. The x86 hardware,\
    \ for example, provides built-in support specifically for watchpoints, and GDB\
    \ will make use of this support. If the support does not exist or if the conditions\
    \ for the use of the hardware are not met, GDB will revert to software watchpoints.\
    \ A software watchpoint is much slower than a hardware watchpoint. The reason\
    \ for this is because GDB must stop the program execution after each assembly\
    \ instruction and examine every watchpoint for changes. Conversely, hardware watchpoints\
    \ allow GDB to run normally but will instantly notify GDB of a change when/if\
    \ it occurs.\n\nTo demonstrate watchpoints let's use a simple program that simulates\
    \ an employee record system. The source code is:\n\n```\n#include <stdio.h>\n\
    struct employee {\n    char name[8];\n    int serial_num;\n}\nvoid print_employee_rec(\
    \ struct employee rec )\n{\n    printf(\"Name: %s\\n\", rec.name);\n    printf(\"\
    Number: %d\\n\", rec.serial_num);\n    return;\n}\nvoid update_employee_name(\
    \ struct employee *rec, char *name)\n{\n    strcpy(rec->name, name);\n    return;\n\
    }\n```"
