  md: '# Best Practices and Initial Investigation Chap. 1


    This tongue-in-cheek MUD analogy aside, what can this book really do for you?
    This book includes chapters that are loaded with useful information to help you
    diagnose problems quickly and effectively. This first chapter covers best practices
    for problem determination and points to the more in-depth information found in
    the chapters throughout the book. The first step is to ensure that your Linux
    system(s) are configured for effective problem determination.


    # 1.2 GETTING YOUR SYSTEM(S) READY FOR EFFECTIVE PROBLEM DETERMINATION


    The Linux problem determination tools and facilities are free, which begs the
    question: Why not install them? Without these, a simple problem can turn into
    a long and painful ordeal that can affect a business and/or your personal time.
    Before reading through the rest of the book, take some time to make sure the following
    tools are installed on your system(s). These tools are just waiting to make your
    life easier and/or your business more productive:


    +   - **strace**: The strace tool traces the system calls, special functions that
    interact with the operating system. You can use this for many types of problems,
    especially those that relate to the operating system.


    +   - **ltrace**: The ltrace tool traces the functions that a process calls. This
    is similar to strace, but the called functions provide more detail.


    +   - **lsof**: The lsof tool lists all of the open files on the operating system
    (OS). When a file is open, the OS returns a numeric file descriptor to the process
    to use. This tool lists all of the open files on the OS with their respective
    process IDs and file descriptors.


    +   - **top**: This tool lists the “top” processes that are running on the system.
    It defaults sorts by the amount of current CPU being consumed by a process.


    +   - **traceroute/tcptraceroute**: These tools can be used to trace a network
    route (or at least one direction of it).


    +   - **ping**: Ping simply checks whether a remote system can respond. Sometimes
    firewalls block the network pings ping uses, but it is still very useful.'
