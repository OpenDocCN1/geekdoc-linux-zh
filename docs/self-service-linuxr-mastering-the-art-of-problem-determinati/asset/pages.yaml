  md: '# 3.2.6 /proc/<pid>/fd


    The fd directory contains symbolic links pointing to each file for which the process
    currently has a file descriptor. The name of the link is the number of the file
    descriptor itself. File descriptor leaks are common programming errors that can
    be difficult to diagnose. If you suspect the program you are debugging a leak,
    examine this directory carefully throughout the life of the program.


    # 3.2.7 /proc/<pid>/mapped_base


    As was mentioned previously, the starting point for where the shared library mappings
    begin in address space is defined in the Linux kernel by TASK_UNMAPPED_BASE. In
    the current stable releases of 2.4 and 2.6 kernels, this is hardcoded and cannot
    be changed. In the case of i386, 0x04000000 is not the greatest location because
    it occurs about one-third of the process’ addressable space. Some applications
    require/or benefit from allocating very large contiguous chunks of memory, and
    in some cases the TASK_UNMAPPED_BASE gets in the way and hinders this.


    To address this problem, some distributions such as SUSE Linux Enterprise 8 have
    include a patch that allows the system administrator to set the TASK_UNMAPPED_BASE
    value to whatever he or she chooses. The /proc/<pid>/mapped_base file is the interface
    you use to view and change this value.


    To view the current value, simply cat the file:


    ```

    cat /proc/self/mapped_base

    103741824penguin

    ```


    This shows the value in decimal format and is rather ugly. Viewing it as hex is
    much more meaningful:


    ```

    printf "0x%x\n" /proc/self/mapped_base

    0x04000000

    ```


    We know from our examination of the maps file that the executable''s mapping begins
    at 0x08048000 in the process address space. We now know that the in-memory mapping
    is likely to be larger than the on-disk size of the executable. This is because
    of variables that are in the BSS segment and of dynamically allocating memory
    from the process heap. With mapped_base at the default value, the space allowed
    for all of this is 939229184 (0x38000000-0x08048000). This is just under 1GB and
    certainly overkill. A more reasonable'
