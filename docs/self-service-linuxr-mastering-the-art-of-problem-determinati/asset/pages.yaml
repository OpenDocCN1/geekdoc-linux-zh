    Occasionally, user-land debugging and diagnostic tools are unable to provide sufficient
    information about a process that is experiencing difficulty. For example, sometimes
    attaching trace to a process that appears to be huge may not reveal anything.
    This can indicate that the process is stuck in a resource or another process.
    This is where observing the stacktrace and assembly instructions of the process
    in KDB can be of most useful.


    Another task performed in debugging is to display the current contents of the
    registers. In KDB, this is done with the rd command as shown here:


    ```

    kdb r

    eax = 0x089b1430 ebx = 0xc41153020 ecx = 0xc41153860 edx = 0xc41153758

    si = 0x000000e0 edi = 0x000000f1 esp = 0xbfffffe40 eip = 0xb058b5d3

    bp = 0xbfffffe88 xss = 0x000000d2 xcs = 0x000002c3 eflags = 0x00000202

    dxs = 0x0000002b ebx = 0x000000d2 oreax = 0xbffffff01 regs = 0xc346ff4c4

    ```


    These values are meaningful only to process the kernel is currently executing.
    One interesting observation is that the instruction pointer, eip, contains a value
    that is relatively close to executables'' base address of 0x08048000. This generally
    means that code from an executable rather than a library is currently running.'
