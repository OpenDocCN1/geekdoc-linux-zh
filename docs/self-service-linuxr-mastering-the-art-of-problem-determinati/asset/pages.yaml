  md: '# The GNU Debugger (GDB) Chap. 6


    There are three different types of watchpoints:


    +   - watch - Cause a break in execution for any write to an address

    - rwatch - Cause a break in execution for any read to an address

    - awhile - Cause a break in execution for a read or write to an address


    Besides the different memory access attributes, the three types of watchpoints
    can be used in the same way. There are some situations where a read waypoint can
    be useful. One example is called a "late read." A read is a situation where a
    code path reads memory after it has been freed. If you know which block of memory
    is referenced after it has been freed, a read waypoint can catch the culprit code
    path that references the memory.


    > Note: To delete a watchpoint, use the delete command with the watchpoint number
    as the argument.


    # 6.6.5 Display Expression on Stop


    Throughout a debugging session, you will find that you will be checking the value
    of certain variables again and again. GDB provides a handy feature called displays.
    Displays allow you to tell GDB whatever expression you''ve set as a display after
    each execution stop. To set a display, use the display command. Here is an example:


    ```

    (gdb) display a

    (gdb) break main

    Breakpoint 1 at 0x8048362

    (gdb) run

    Starting program: /home/wilding/src/Linuxbook/watch

    ```


    ```

    Breakpoint 1: <data variable, no debug info> 134517792 = 5

    ```


    The last line is the display line, and the display item has a number of 1. To
    delete this display, we use the delete display command:


    ```

    (gdb) display

    1: <data variable, no debug info> 134517792 = 5

    (gdb) delete display 1

    ```


    To enable or disable a preset, use the enable display and disable display commands.'
