  md: '# 5.3 Stacks in x86 and x86-64 Architectures


    pieces of paper would be the stack frames, and the landmarks written on the paper
    would be the function return addresses.

    nThe stack is a crucial part of program execution. Each stack frame, which will
    be discussed in more detail later, corresponds to a single instance of a function
    and variables and data local to that instance of the function. This concept allows
    function recursion to work because each function is executed, a stack frame for
    it is created and placed onto the stack with its own copy of the variables, which
    could be very different from the previous execution instance of the very same
    function. If a recursive function was executed 10 times, there would be 10 stack
    frames, and as execution finishes, the associated stack frame is removed and execution
    moves on the next frame.


    # 5.3 STACKS IN x86 AND x86-64 ARCHITECTURES


    Considering the most popular Linux architecture is x86 (also referred to as i36)
    and because x86-64 is very similar and quickly gaining in popularity, this section
    focuses on them. Stacks on these architectures are said to grow “down” because
    they start at a high memory address and grow toward lower memory addresses. See
    section `/proc/<pid>/maps` in Chapter 3 for more information on the process address
    space. Figure 5.1 shows a diagram of the process address space with the stack
    starting at the top and growing down toward lower memory addresses.


    ![](img/f8e4ea98e89e9d2b5bd054d231ecdbba_176_0.png)


    Fig. 5.1 Example of Stack Growing Down.'
