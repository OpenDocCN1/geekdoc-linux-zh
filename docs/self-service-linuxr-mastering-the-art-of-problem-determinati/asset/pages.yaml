    \ |\n\nTable 3.1 Address Mapping Comparison.\n\n# 3.2.3 /proc/<pid>/cmdline\n\n\
    The cmdline file contains the process' complete argv. This is very useful to quickly\
    \ determine exactly how a process was executed including all commandline parameters\
    \ passed to it. Using the bash process again as an example, we see the following:\n\
    \n```\npenguin cd /proc/self\npenguin cat cmdline\bash\n```\n\n# 3.2.4 /proc/<pid>/environ\n\
    \nThe environ file provides a window directly into the process' current environment.\
    \ It is basically a link directly to memory at the very bottom of the process'\
    \ stack, which is where the kernel stores this information. Examining this file\
    \ can be very useful when you need to know settings for environment variables\
    \ during the program's execution. A common programming error is misuse of the\
    \ getenv and putenv library functions; this file can help diagnose these problems.\n\
    \n# 3.2.5 /proc/<pid>/mem\n\nBy accessing this file the fseek library function,\
    \ one can directly access the process' pages. One possible application of this\
    \ could be to write a customized debugger of sorts. For example, say your program\
    \ has a larger and complex control block that stores important information that\
    \ the rest of the program relies on. In the case of a program malfunction, it\
    \ would be advantageous to dump out that information. You could do this by opening\
    \ the mem file for the PID in question and seeking the known location of a control\
    \ block. You could read the size of the control block into another structure,\
    \ which the homemade debugger could display in a format that programmers and service\
    \ analysts can understand."
