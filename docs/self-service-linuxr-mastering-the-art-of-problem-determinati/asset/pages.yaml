    # ### 6.5.4 Register Dump


    Examining the contents of the registers in a live debugging session may be necessary
    to diagnose complex problems, especially when you don''t have the source code.
    Looking at a raw register dump can be like looking at a wall of hieroglyphics
    if you don''t have experience with assembly language on the platform you are using.
    The contents of the registers make sense only when you examine and understand
    the assembly instructions (the readable format of machine instructions) that are
    using the registers. Assembly instructions directly manipulate the memory and
    registers of a computer. When debugging a program that has been compiled with
    debug symbols enabled (-g), looking at register contents is usually necessary.
    However, when debugging a program that has no debug symbols, you are forced to
    work at the assembly level.


    The command used to see a register dump in GDB is "info registers" as shown here:


    ```

    (gdb) info registers

    eax 0x6 6

    ecx 0x1 1

    edx 0x4015c490 1075168400

    ```'
