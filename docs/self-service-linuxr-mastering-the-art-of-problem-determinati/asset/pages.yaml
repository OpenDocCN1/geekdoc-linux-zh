    # 5.8.1 Homegrown Stack Traceback Function


    One of the most important pieces of information to know when debugging a problem
    is the path of execution taken to get the current point. A big part of this is
    examining the stack traceback output from GDB using the traceback command. Very
    often, running the program under GDB or attaching to it is not possible because
    the machine is not available. This is where a homegrown stack traceback function
    is extremely useful to problem determination. The function can be called at any
    point throughout the program''s execution life; it can be called when a recoverable
    error is detected, when a non-recoverable error such as a segfault is detected,
    or when code and execution analysis is needed. For GNU/Linux, two ways of accomplishing
    this will be discussed as certain environments limited in what can be used.


    # 5.8.1 Using GLIBC''s traceback() GLIBC includes several functions that can be
    used to display a stack from a running program. The main function is called traceback()
    and has this prototype:


    ```

    int traceback(void **BUFFER, int SIZE)

    ```


    SIZE determines the maximum number of frames traceback will "walk/through", and
    BUFFER is an array of void pointers wherein traceback will store the return instruction
    pointer. To convert the return address pointers into more meaningful information,
    the function traceback_symbols() is provided. Its prototype is:


    ```

    char **backtrace_symbols(void *const *BUFFER, int SIZE)

    ```'
