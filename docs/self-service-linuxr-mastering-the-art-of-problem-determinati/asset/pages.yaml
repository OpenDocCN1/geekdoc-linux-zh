  md: '# Linux System Crashes and Hangs Chap. 7


    requires, although it doesn''t hurt to have. But if your system inexplicably crashes
    or hangs more than a few times in a very short period of time, it is highly recommended.


    > Note: In the kernel source package included with most distributions, the file
    Documentation/serial-console.txt is an excellent guide on setting up and configuring
    a serial console.


    In conjunction with using the serial console is to enable the kernel magic SysRq
    key; refer to the sysrq section of Chapter 3, “The /proc Filesystem,” for more
    information. A serial console helps because often when a system enters a panic
    state, for example in the case of a kernel oops, the kernel will dump information
    to the kernel log daemon. This normally means that the information written to
    /var/log/messages; however, there are cases where the system is unable to perform
    the writes to disk, so this is where the serial console proves most useful. When
    properly set up, the information is dumped over the serial port as well as the
    remote system, which is in a healthy state, will receive and save this information.
    This information can be analyzed using the techniques discussed in this section
    or forwarded to the appropriate support group.


    # 7.2.3 Connecting the Serial Null-Modem Cable


    The first thing to do is obtain a serial null-modem cable. These can be found
    at any computer store and generally sell for a minimum amount. You should also
    check the external serial ports on both computers to determine whether you require
    9 or 25 pin connectors. Newer null-modem cables are sold with both 9 and 25 pin
    connectors on each end, so may be desirable to purchase this kind.


    Once the cable is in place, it should be tested to ensure that data can be sent
    from one machine to the other. Do this by first starting a communications program
    on the serial console of a separate system. If the machine is running Linux, minicom
    is a good choice, and if Windows is running, HyperTerminal also fine.


    > Note: minicom may not be installed on your Linux system by default. The executable
    is usually /usr/bin/minicom. If you do not have it, most distributions include
    it as an optionally installed package that can be installed at any time.'
