  md: "# ELF: Executable and Linking Format Chap. 9\n\nThis is the global constructor\
    \ of the myObj object, which is called, as expected, by functions under _init.\n\
    \nThe _CTOR_LIST variable stores the list of global constructors for an executable\
    \ or shared library. We can find all of the global constructors by listing the\
    \ addresses between _CTOR_LIST and _CTOR_END. This can be useful if you need to\
    \ know what will run before the main() function of an executable or when a library\
    \ is loaded.\n\nThe .fini section has a very similar construction but uses the\
    \ _DTOR_LIST_ and _DTOR_END variables to mark the addresses of the global destructors.\n\
    \n# 9.6.3.10 .interp This section contains the path of the program interpreter.\
    \ The program interpreter is used for executables and is responsible for getting\
    \ a process up and running with all of its required libraries, and on. A quick\
    \ way to get the program interpreter is to use the readelf command as follows:\n\
    \n```\npenguin> readelf -l foo\n<->n  INTERP      0x0001414 0x08048114 0x08048114\
    \ 0x00013 R 1\n              [Requesting program interpreter: /lib/ld-linux.so.2]\n\
    ```\n\nThe program interpreter is described later in the chapter under the section\
    \ heading,\"Program Interpreter\".\n\n# 9.6.3.11 .plt (Procedure Linkage Table)\
    \ The procedure linkage table is required by every shared library or executable\
    \ that is dependent on shared libraries to satisfy an unresolved symbol. The PLT\
    \ is also used to support \"lazy binding,\" without not resolving the address\
    \ of a function until it is called for the first time.\n\nThe procedure linkage\
    \ table contains a list of instructions that help functions find other functions\
    \ in the address space. First, let's use the readelf tool to find the PLT for\
    \ the executable named foo. It is always in the section .plt.\n\n```\npenguin>\
    \ readelf -S foo | grep '\\.plt\\'\n[11] .plt      PROGBITS  0x08048cc 0004cc\
    \ 000070 AX 0 0 4\n```\n\nThe best way to look at the PLT is through the debugger.\
    \ It starts at address 0x08048e0 and continues for 0x70 bytes:\n\n```\n(gdb) disass\
    \ 0x08048cc\nDump of assembler code for function _init:\n0x08048b4 <init>: push\
    \   %ebp\n```"
