  md: 'This section is mainly used by the program interpreter, covered in more detail
    later in this chapter.


    # 9.6.3.4 .dynym (symbol table) The dynamic symbol table is the smaller of the
    two symbol tables. It only contains symbols that are required for program execution,
    global symbols. The dynamic symbol table is required and cannot be stripped from
    an ELF object. The dynamic symbol table does not contain any static symbols because
    static symbol information is not needed at runtime


    Static symbols are local to a file, and once a shared library or executable is
    linked, the offset of the static symbols are called directly through an offset
    that is known at link time. Dynamic symbols might be satisfied outside of the
    shared library and executable, and thus these symbols must be done at run time.


    Consider the two variables again: staticInt and globInt, defined as:


    ```

    int globInt = 5;

    static staticInt = 5;

    ```


    The globInt variable should be in the dynamic symbol table, although the staticInt
    variable should only be in the main symbol table:


    ```

    >> nm libfoo.so | egrep staticInt

    00001b24 d staticInt

    engine>> nm -D libfoo.so |egrep staticInt

    engine>> nm -D libfoo.so |egrep globInt

    00001b20 D globInt

    ```


    As expected, the static variable is not found in the dynamic symbol table. The
    main symbol table that contains all symbols is described as follows under the
    section heading, .symtab.


    # 9.6.3.5 .dynstr (string table) This string contains only the symbols that are
    required for dynamic linking. The majority of the content will be for the symbol
    names from the dynamic symbol table. The format is the standard ELF string table
    format.


    # 9.6.3.6 .fini The fini section contains the machine instructions for the function
    _fini. Notice that the file offset listed by nm for _fini, and the file offset
    for the .fini section match exactly:'
