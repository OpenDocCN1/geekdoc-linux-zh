    # 6.12.1.1 Viewing the Raw Stack


    Examining the raw stack can be very useful for diagnosing problems, especially
    when debugging applications with debug symbols. DDD does not provide a simple
    menu option to do this, Using the data display window and with a little knowledge
    of stacks in general (see Chapter 5 for more information), we can get the information
    we need. We know that the esp register on the 32bit x86 architecture (rsp on the
    64-bit x86-64 architecture) always points to the top of the stack (smallest memory
    address), so we can graph a display of the top 16 words on the stack at any given
    time by entering this command into the GDB console window:


    ```

    graph display ''x/16wx $esp''

    ```


    > Note: Using this command will work fine, but the graph that gets created in
    the display window will only have a title of “X”. This is because DDD simply uses
    the first word of the expression for the title. Remove the spaces in the expression
    to make the graphs unique and a little more meaningful, especially when dealing
    with many graphs. For example, figure 6.5 this command was used:


    ```

    graph display ''x/16wx$esp''

    ```


    Figure 6.5 shows a DDD session of a hello.c program, which has code to assign
    a value to a local variable. The source code is in the source window. The green
    arrow points to the line of source code that will be executed next, so we can
    see that we have just executed the code that stores the value 5 into our stack_int
    variable. The graph highlights the line that changed, showing us our stack_int
    variable getting updated directly in memory (note the 0x00000005 value).'
