    27202 open("/dev/tty", O_RDWR<unfinished ...

    27203 readlink("/proc/self/fd/0", "/dev/pts/123") = 12

    27203 open("/dev/pts/123", O_RDWR|O_NONBLOCK|O_LARGEFILE) = 3

