  md: '# 9.2.3 Linking


    Linking takes the symbols from the object files, shuffles them into a specific
    order, and combines them into either a shared library or executable. Linking also
    needs to resolve some of the undefined symbols, either using the functions and
    variables of the object files that is combining or through symbols exported by
    other shared libraries. The linker must also create a program header that includes
    information about how the executable or shared library should be loaded into memory.
    Let''s take a quick look at the process of linking Figure 9.1.


    ![](img/f8e4ea98e89e9d2b5bd054d231ecdbba_337_0.png)


    **Fig. 9.1 Linking object files into a shared library.


    The diagram shows four separate object files being combined into one shared library.
    Each object file contains a number of sections; only four are being shown here
    for simplicity:


    +   * .text: contains functions

    * .data: contains initialized writable (that is, not constant) variables

    * .rodata: contains read-only (that is, constant) variables

    * .bss: contains uninitialized and writable variables'
