  md: '# 3.4 System Information and Manipulation


    To test the kernel magic, switch to your first virtual console. You need not log
    in because the key combination triggers the kernel directly. Hold down the right
    ALT key, then press and hold the PrSc/SysRq key, then press the number 5. You
    should see something similar to the following:


    ```

    SysRq : Changing Loglevel

    Loglevel set to 5

    ```


    If you do not see this message, it could be that the kernel is set to send messages
    to virtual console 10 by default. Press CTRL-ALT-F10 to switch to virtual console
    10 and check if the messages appear there. If they do, then you know the kernel
    magic is working properly. If you''d like to switch where the messages are sent
    by, say, virtual console 1 by default instead of 10, then run this command as:


    ```

    /usr/sbin/logmessage -r 1

    ```


