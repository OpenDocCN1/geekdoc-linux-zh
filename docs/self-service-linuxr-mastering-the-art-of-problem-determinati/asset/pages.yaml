  md: '# 2.2 What strace?


    A system call is similar in concept to that of a function but requires switching
    into the kernel to execute the actual system call instructions. Remember, a function
    call does not require the kernel. The method used to get into the kernel varies
    by platform, but on IA-32, the method used is a software interrupt shown in the
    following example for the open system call:


    ```

    ion 214% nm /lib/libc.so.6 | grep `open$

    000bf9b0 W


    ion 216% objdump -d /lib/libc.so.6 |less


    000bf9b0 <__libc_open>

    bf9b0      push   %ebx

    53

    bf9b1      8b 5c 24 0c    mov    (%esp,1),ed

    bf9b5      8b 4c 24 0c    mov    0xc(%esp,1),ecx

    bf9b9      8b 5c 24 08    mov    0x8(%esp,1),ebx

    bf9bd      08 05 00 00 00    mov    0x05,%ax

    bf9c2      int        $0x80

    bf9c6      5b                 pop    %ebx

    ccd8 01 f0 ff        0xffffffff,%ax

    bf9ca      73 01              jae    bf9cd <__libc_open+0x1d>

    bf9cc      33                 ret

    bf9cd      53                 push   %ebx

    ```


    Notice the interrupt: int $0x80 and the move (mov) instruction directly preceding.
    The move instruction switches the system call number 5 into the %ax register,
    and the interrupt instruction switches the current thread of execution into the
    kernel. This is where the actual instructions are for the open system call. A
    bit grepping through system header files shows that the system call is indeed
    open.


    ```

    ion 218% egrep /usr/include/bits/syscall.h

    #define SYS_OPEN    __NR_open


    ion 218% egrep __NR_open /usr/include/asm/unistd.h

    #define __NR_OPEN    __NR_open

    ```


    It''s worth noting that call the open system call are actually calling a function
    in the C library that, in turn, interrupts into the kernel to invoke the actual
    system call. The open function is a thin wrapper around the mechanism to call
    the open system call.


    From the user-space point of view, the interrupt instruction (int $0x80) is silently
    executed and performs all of the functionality of the open system call. The contents
    of any memory addresses or registers that were passed into the system call may
    change, but from the application''s point of view, it seems as if the single interrupt
    instruction performed the role of the system call. A normal'
