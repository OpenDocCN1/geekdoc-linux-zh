    # 2.3.3 Verbose Mode


    By default, strace does not include all the information for every system call.
    It usually provides a good balance between enough information and too much. However,
    there are times when more information is required to diagnose a problem. The verbose
    option -v tells strace to include full information for system calls as stat or
    uname.


    ```

    251% -v main

