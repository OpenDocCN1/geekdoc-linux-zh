- img_proc: true
  md: '# 1.4 Technical Investigation


    1.4.1.4 Performance Ah, performance ... one could write an entire book on performance
    investigations. The quest to improve performance comes with good reason. Businesses
    and individuals pay good money for their hardware and are always trying to make
    the most of it. A 15% improvement in performance can be worth 15% of your hardware
    investment.


    Whatever the reason, the quest for better performance will continue to be important.
    Keep in mind, however, that it may be more cost effective to buy a new system
    to get that last 10-20%. When you''re trying to get that last 10-20%, the human
    cost of improving performance can outweigh the cost of purchasing new hardware
    in a business environment.


    1.4.1.5 Unexpected Behavior/Output This is a special type of problem where the
    application is not aware of a problem (that is, the error code paths have not
    been triggered), and yet it is returning incorrect information or behaving incorrectly.
    A good example of an unexpected output is if an application returned "$##@" for
    the current balance of a bank account without producing any error messages. The
    application may not execute any error paths at all, and yet the resulting output
    is complete nonsense. This type of problem can be difficult to diagnose given
    that the application will probably not log any information (because it is not
    aware there is a problem!).


    > Note: An error path is a special piece of code that is specifically designed
    to react and handle an error.


    The root cause for this type of problem can include hardware issues, memory corruptions,
    uninitializ memory, or software bug causing a variable overflow. If you have the
    output from the unexpected behavior, try searching the Internet for some clues.
    Failing that, you''re probably in a complex problem investigation.


    Diagnosing this type of problem manually is a lot easier with source code and
    an understanding of how the code is supposed to work. If the problem is easily
    reproducible, you can use GDB to find out where the unexpected behavior occurs
    (using break points, for example) and backtracking through many iterations until
    you''ve found where the erroneous behavior starts. Another option if you have
    the source code is to use print statements (or something similar) to backtrack
    through the run of the application in the hopes of finding out where the incorrect
    behavior started.


    You can try with luck or ltrace in the hopes that the application is misbehaving
    due to an error path (for example, a file not found). In particular case, you
    might be able to address the reason for the error (that is, fix the permissions
    on a file) and avoid the error path altogether.'
