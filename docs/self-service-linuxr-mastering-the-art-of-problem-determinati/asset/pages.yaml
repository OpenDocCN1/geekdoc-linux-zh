  md: '# Best Practices and Initial Investigation Chap. 1


    Ran "strace" on product Y and got the following semget:


    ```

    ion 730% strace -o productY.strace prodY

    ion 731% egreg "semshm" productY.strace

    semget(117668244, 1, IPC_CREATE|IPC_EXCL|0x1f70666) = EEXIST

    ```


    The IPC keys are identical, and product Y tries to create the semaphore but fails.
    The error message from product Y is identical to the original error message in
    the problem description here.


    Notes: product.X strace and product.Y strace are under the data directory.


    Assumption: I still do not know whether product X was running at the time when
    product Y failed to start, but given these results, it is very likely. IPC collisions
    are rare, and we know that product X and product Y cannot run at the same time
    the way they are currently configured.


    > Note: A semaphore is a special type of inter-process communication mechanism
    used between processes (or threads). The type of semaphore used here requires
    a unique "key" so that multiple processes can use the same semaphore. A semaphore
    can exist without any processes using it, and some applications expect and rely
    on creating a semaphore they can run properly. The semget() in the strace that
    follows is a system call (a special type of OS function) that, as the name suggests,
    gets a semaphore.


    Notice how detailed the proofs are. Even the commands to capture the original
    strace output are included to eliminate any human error. When entering a proof,
    be sure to ask yourself, "Would anyone need more proof than this?" This level
    of detail is often required for complex problems that others will see the proof
    and agree with it.


    The amount of detail in your investigation log should depend on how critical the
    problem is and how you are solving it. If you''re completely lost on a very critical
    problem, you should include more detail than you are almost done with the investigation.
    The high level of detail is very useful for complex problems given that every
    piece of data could be invaluable in the investigation.


    If you don''t have a good problem tracking system, here is a possible directory
    structure that can keep things organized:


    ```

    <problem identifier>/ inv.txt

    / data /

    / src /

    ```'
