  md: '# 2.2 What is strace?


    tracing is rarely useful for code logic problems, but it can be very useful to
    find a problem that relates to the interaction with the operating system.


    It takes a bit of practice to understand a system call trace, but a good example
    can go a long way. For those who are not familiar with the standard system calls,
    it is quick and easy to read the man pages for the system calls for more information.
    For example, the first system call in the trace is execve. The man page can be
    referenced using


    ```

    ion 225% man 2 execve

    ```


    The arguments for a system call in the strace output should match those listed
    in the man page. The first argument listed in the man page for execve is const
    char the documentation in the man page that this system call executes the program
    pointed to filename. The functionality of execve is not the point of this but
    rather man pages can be used to help understand strange output for beginners.


    **Line #1:** the execve system call (or one of the exec system calls) is always
    the first system call in the strace output if strace is used to trace a program
    off the command line. The strace tool forks, executes the program, and the exec
    system call actually returns as the first system call in the new process. A successful
    execve system call will not return in the calling process'' code (because exec
    creates a new process).


    **Line #2:** the uname system call is being called for some reason-but is not
    immediately important.


    **Line #3:** the brk system call is called with an argument of zero to find the
    current "break point." This is the beginning of memory management (for example,
    malloc and free) for the process.


    **Line #4:** the mmap call is used to create an anonymous 4KB page. The address
    of this page is at 0x40013000.


    **Line #5:** this line attempts to open the ld.so.preload file. This file contains
    a list of ELF shared libraries that are to be pre-loaded before a program is able
    to run. The man page for ld.so may have additional information.


    **Lines #6 - #12.** These lines involve finding and loading the libc library.'
