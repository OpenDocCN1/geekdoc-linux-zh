    According to the hex dump, the “class” field byte at offset 4 (starting from 0x0)
    is 1, the data encoding field (byte at offset 5) is 1, and the version (byte at
    offset 6) is 1.


    Thus, the class is 32-bit (ELFCLASS32), the data encoding is LSB (Least Significant
    Bit) (ELFDATA2LSB) or “little endian,” and the version is EV_CURRENT (which it
    must be).


    We can also map the next couple of fields in the ELF header structure using the
    raw output. The two fields of e_type and e_machine are 16 bytes (ELNIDENT) and
    18 (ELNIDENT + 2) bytes past the beginning of the file (at offset 0x10 in hexadecimal):


    ```

    penguin> hexdump -C foo.o | head -2

    00000000 7f 45 4c 46 01 01 01 00 00 00 00 00 00 00 00 | .ELF

    00000010 01 00 03 00 01 00 00 00 00 00 00 00 00 00 00 00 |

    ```


    From the output, the e_type field is 0x1 (elf.h: ET_REL), which is used for relocatable
    files. The e_machine field is 0x3 (elf.h: EM_386), which is used for executables
    that run on the x86 architecture.


    > Note: Because this platform is little endian, the byte order must be reversed
    to be translated into the big endian format–the format that humans are generally
    more comfortable with. For little endian, a hex dumped value of 0100 is actually
    0001 or 0x1 (little endian is covered in more detail in the GDB chapter of this
    book).


