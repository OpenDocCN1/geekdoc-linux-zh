  md: '# ELF: Executable and Linking Format Chap. 9


    The strip command is mildly beneficial for its ability to reduce the size of an
    ELF file and protect intellectual property, but it can really hinder investigation
    efforts. Avoid it if possible.


    Note: You might find that some distributions have stripped libraries and executables.
    On these distributions, there should be debug libraries that contain the main
    symbol table. Consult your distribution documentation for more information.


    # 9.9 PROGRAM INTERPRETER


    The term “program interpreter” comes from the ELF standard. On Linux, the program
    interpreter is ld.so (/lib/ld-linux.so), the run time linker/loader. The program
    interpreter is responsible for bringing an executable and getting it running.
    It is called by the kernel and is passed a special array of information called
    an auxiliary vector. This is shown as follows using the environment variable LD_SHOW_AUXV=


    ```

    penguin export LD_SHOW_AUXV=true

    penguin: foo

    AT_HWCAP: fpu vme de pse tsc msr pae cx8 apic osfxar xmm xmm2 27 28 29

    mca cmov pat pse36 19 21 22 mmx

    AT_PAGESIZE: 4096

    AT_CLOCK: 100

    AT_PHDR: 0x08048034

    AT_PHNUM: 7

    AT_BASE: 0x04000000

    AT_FLAGS: 0x0

    AT_ENTRY: 0x08048540

    AT_UID: 7903

    AT_EUID: 7903

    AT_GID: 200

    AT_BID: 200

    AT_PLATFORM: 1686

    This is a printf format string in baz

    This is a printf format string in main

    ```


    Brief definitions of the various fields can be found from /usr/include/elf.h:


    +   * Legal values for a_type (entry type). */

    #define AT_NULL 0 /** End of vector */

    #define AT_IGNORE 1 /** Entry should be ignored */

    #define AT_EXECCFD 2 /** File descriptor of program */'
