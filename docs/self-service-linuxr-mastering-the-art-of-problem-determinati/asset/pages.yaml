    # 5.5.1.1 Special Case: gcc -fomit-frame-pointer Compile Option


    Some architectures support gcc -fomit-frame-pointer compile option, which is used
    to avoid the need for the function prologue and epilogue, thus freeing the frame
    pointer register to be used for other purposes. This optimization is done at the
    cost of the ability to debug the application because certain debugging tools and
    techniques rely on the function pointer being present. SUSE 9.0 Professional and
    SLES 8 on the x86-64 architecture have been compiled with the -fomit-frame-pointer
    option, which could improve performance in certain areas of the operating system.
    GDB is able to handle this properly, but other debugging techniques might have
    difficulties such as using a homegrown stack traceback function. It is also important
    to note that using gcc 3.3 with the -O1 or greater optimization level, the -fomit-frame-pointer
    flag is atomically turned on for the x86-64 architecture. If omitting the frame
    pointer is not desired but optimization is, be sure to compile your program with
    something like the following:


    ```

    gcc -o myexe myexe -O1 -fomit-frame-pointer

    ```


    # 5.5.2 Function Calling Conventions


    When you strip away the peripherals, storage, sound, and video devices, computers
    are relatively simple machines. The "guts" of a computer basically consist of
    two main things: the CPU and RAM. RAM stores the instructions that run on the
    CPU, but given that the CPU is really a huge maze of logic gates, there is a need
    for intermediate storage areas that are very close to the CPU and fast enough
    to feed it as quickly as it can process the instructions. These intermediate storage
    areas are the system''s registers and are integral parts of a computer system.


    Most systems have only a very small number of registers, and some of these registers
    have a dedicated purpose and cannot simply be used at will. Because every function
    that executes has access to and can manipulate the exact registers, there must
    be a set of rules that govern how registers are used between function calls. The
    function caller and function callee must know exactly what to expect from the
    registers and how to properly use them without clobbering one. This set of rules
    is called the function or procedure calling conventions. They are architecture-specific
    and very important to know and understand for all software developers.


    The purpose of this section is to give an overview of the basics of the calling
    conventions and should not be considered an exhaustive reference. The calling
    conventions are quite bit more detailed than what is presented here—for example,
    what to do when structures contain various data classification types, how to properly
    align data, and so on. For more detailed information, it'
