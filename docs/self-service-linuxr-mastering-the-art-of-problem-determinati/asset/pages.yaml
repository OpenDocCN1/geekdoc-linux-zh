    # 6.11 Threads


    Threads are light weight processes that run in the same address space. They share
    the process heap, the shared libraries and the executable code. The only threads
    that do not share their individual stacks. Technically, each thread has read/write
    access to the other thread stacks but never purposely writes or reads to any stack
    its own.


    Problems in threaded applications can be very challenging to diagnose. When using
    threads (or processes that used shared memory), there is the potential for race
    conditions, also known as timing conditions. A race condition is a problem that
    may or not occur depending on the order and/or of events between threads. For
    example, thread #1 could read the size of a list'
