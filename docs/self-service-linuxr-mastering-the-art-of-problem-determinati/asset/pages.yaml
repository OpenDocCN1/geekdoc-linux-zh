  md: '# 8.3 USING KDB


    The following sections give a very high-level overview of how to use KDB once
    it is installed on your system.


    > Warning: KDB should be thought of as “open-brain surgery.” It basically lifts
    the hood off of your computer and gives you complete access and control of the
    brains of your operating system. Just as in-brain surgery, any wrong move can
    kill the patient—in this case, the patient is your operating system. Please exercise
    caution.


    # 8.3.1 Activating KDB


    If you use the Windows system, be sure to first switch to a text virtual console
    by using the CTRL-ALT-Fn key sequence. Once at a virtual console, log in and root
    enable KDB by executing the following command:


    ```

    echo 1 > /proc/sys/kernel/kdb

    ```


    You are now ready to enter kernel debugging mode by pressing the hotkey which
    is the Pause/Break key.


    > Note: When KDB is enabled it will automatically be invoked during a system panic.


    When you press the hotkey, you will see the following:


    ```

    penguin:/proc/sys/kernel #

    Enter kdb (current=0xc03dc000, pid 0) due to Keyboard Entry

    ```


    > Note: When you are in KDB you may notice that your caps and scroll lock LEDs
    flash rapidly. This is normal.


    > Note: Interrupts and the machine clock tick are disabled while KDB so your computer''s
    system time will appear to have stopped for the time spent in KDB. In this itself
    shows how intrusive KDB really is to a system!'
  merge: -1
