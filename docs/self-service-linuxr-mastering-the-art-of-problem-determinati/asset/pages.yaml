  md: "# 9.7 Relocation and Position Independent Code (PIC)\n\n# 9.7.1 PIC vs. non-PIC\n\
    \nMuch of the complexity in the ELF standard is due to the need to load shared\
    \ libraries at different locations in a process’ address space. Objects built\
    \ to be position-independent are specifically meant to be loaded anywhere in the\
    \ address space. As discussed earlier, the code in ELF files contains relative\
    \ references to data and relies on the PLT and GOT to resolve the symbols at run\
    \ time. Let's take a look at position independent code in more detail, though,\
    \ because it is an important concept for ELF.\n\nConsider the following source\
    \ code:\n\n```\n#include <stdio.h>\n\nextern \"C\" int otherFunction( int val\
    \ ) {\n    return 23;\n}\n\nint myGlobInt = 12;\n\nint buzz( void ) {\n    int\
    \ intVal;\n    intVal = myGlobInt + otherFunction( 5 );\n    return intVal;\n\
    }\n\nint main() {\n    printf(\"buzz: %d\\n\", buzz());\n    return 0;\n}\n```\n\
    \nMake note that the source code shows a direct call to \"buzz\" as part of the\
    \ call to the printf function. How the function is called is not important, but\
    \ rather that it is called from within the scope of the main function.\n\nThis\
    \ little snippet contains a few functions and a global variable. Let's see how\
    \ the resulting ELF object file differs when it is compiled as PIC or non-PIC.\
    \ The -fPIC switches the g++ compiler to build with position-independent code.\n\
    \n```\npenguin> g++ -c pic.C -o pic_nopic.o\npenguin> g++ -fPIC -c pic.C -o pic.o\n\
    ```"
