    $1 = 3

    (gdb)

    ```


    Notice, that the array indexing is C-style with 0 (zero) being the first index
    value. Thus, the element whose index is 3 is actually the fourth element of the
    array.


    In some cases, you may want to simulate an array with the @ character. Consider
    the following integer:


