    \ at the time when the core file was created. A core file contains the process\
    \ heap, the stack, and any writable memory segments that were in a process' address\
    \ space. A core file can be used long after a process occurs to debug a problem\
    \ in a debugger such as GDB.\n\nCore files can also be useful for situations where\
    \ a problem has to be debugged remotely and cannot be reproduced on any system\
    \ but the original. In such a case, core files can be transferred to another system\
    \ for analysis as long as the libraries' versions used by the process are on the\
    \ same other system.\n\nThe kernel will automatically create a core file if a\
