  md: '# 1.4 Technical Investigation


    # 35


    process may be looping. However, there is still a chance that the process is making
    progress, albeit slowly. If the stack traces are identical, the process may still
    be looping, although it would have to be spending the majority of its time in
    a single state.


    With the stack trace and the source code, you can get the line of code. From the
    line of code, you''ll know what the process is waiting on but maybe not why. If
    the process is stuck in a semop call (a system call that deals with semaphores),
    it is probably waiting for another process to notify it. The source code could
    explain what the process is waiting for and potentially would wake it up. See
    Chapter 4, “Compiling,” for information about turning a function name and offset
    into a line of code.


    If the process is stuck in a read call, it may be waiting for NFS. Check for NFS
    errors in the system log and use the mount command to help check whether any mount
    points are having problems. NFS problems are usually due to a bug on the local
    system but rather a network problem or a problem with the NFS server.


    If you cannot attach a debugger to the hung process, the debugger hangs when you
    try, or you cannot kill the process, the process is probably in some strange state
    in the kernel. In this rare case, you''ll probably want to get a kernel stack
    for this process. A kernel stack is stack trace for a task (for example, a process)
    in the kernel. Every time a system call is invoked, the process or thread will
    run some code in the kernel, and this code creates a stack trace like code run
    outside the kernel. A process that is stuck in a system call will have a stack
    trace in the kernel that may help explain the problem in more detail. Refer to
    Chapter 8, “Kernel Debugging with KDB,” for more information on how to interpret
    kernel stacks.


    The strace tool can also help you understand the cause of a hang. In particular,
    it will show you if the process is spinning in user code and never calls a system
    call. For signal handling loops, the strace tool will show you obvious symptoms
    of a repeated signal being generated and caught. Refer to the hang investigation
    in the strace chapter for more information on how to use strace to diagnose a
    hang with strace.


    1.4.1.3.1 Multi-Process Applications For multi-process applications, one of the
    processes could be causing the hang, and the rest might be waiting for the hung
    process to finish. You''ll need to get a stack trace for all of the processes
    of the application to understand which are hung and which are causing the hang.'
