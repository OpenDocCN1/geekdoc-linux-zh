  md: '# The Stack


    # 5.1 INTRODUCTION


    The stack is one of the most important and fundamental parts of a computer''s
    architecture. It is something that many computer users may have heard of but likely
    don''t know much about what it is used for or how it works. Many software problems
    can involve the stack, so it is important to have a working knowledge to troubleshoot
    effectively. Let''s start out by defining the stack. The definition taken directly
    from Dictionary.com is


    +   stack(st)

    1. A large, usually conical pile of straw or fodder arranged for outdoor storage.

    2. An orderly pile, especially one arranged in layers. See Synonyms at heap.

    3. Computer Science. A section of memory and its associated registers used for
    temporary storage of information in which the item most stored is the first to
    be retrieved.

    4. A group of three rifles supporting each other, butt downward and forming a
    cone.

    na. A chimney or flue.

    nb. A group of chimneys arranged together.

    5. A vertical exhaust pipe, as on a ship or locomotive. Often used in the plural.

    6. An extensive arrangement of bookshelves.

    7. stacks The area of a library in which most of the books are shelved.

    8. A closeup.

    9. An English measure of coal or wood cut, equal to 108 cubic feet (3.06 cubic
    meters).

    10. Informal. A large quantity: a stack of work to do.


    Of course, 3) is the definition that we''re looking for in the context of this
    book. That definition is very accurate and should lay out a great starting point
    for readers who aren''t familiar with what a stack is or what it is used for.
    Stacks exist and are integral for program execution on major architectures, but
    the layout and exact functionality of them vary on certain architectures.'
  merge: -1
  pgno: 174
- img_proc: true
  md: '# The Stack Chap. 5


    basic idea, though, is the same: As a program calls functions and uses storage
    local to those functions, data gets pushed or placed onto the stack. The program
    returns from the functions, the data is popped or removed from the stack. In the
    sense of data storage, the heap can be thought of as opposite to the stack. Data
    storage in the heap does not need to be local to any particular function. This
    is an important difference to understand. Heaps are discussed in more detail in
    the "Heap Segment" section of Chapter 3, "The /proc Filesystem."


    # 5.2 A REAL-WORLD ANALOGY


    To help understand the purpose and functionality of a program stack, a reality
    analogy is useful. Consider Joe who likes to explore new places, but once he gets
    to his destination he is always afraid he''ll forget how to get back home. To
    prevent this, Joe advises a plan that he calls "travel stack." The only supplies
    are several pieces of paper, a pencil, and a box to hold the paper. When he leaves
    his apartment, he writes down "My apartment" on a piece of paper and places it
    in the box. As he walks and sees landmarks or things of interest, he writes down
    another piece of paper and places that piece of paper onto the forming pile in
    the box. For example, the first landmark he passed was a hot dog stand on the
    sidewalk, so he wrote down "Bob''s Hot Dog Stand" on a piece of paper and placed
    it in the box. He did the same thing for more landmarks:


    +   - Tim''s Coffee Shop


    +   - Large statue of Linus Torvalds


    +   - George''s Auto Body Shop


    +   - Penguin Park


    He finally made it to his destination—the bookstore where he could purchase a
    good Linux book as this one! Now that he''s at the bookstore, he wants to make
    sure he makes it safely with his new purchase. To do this, he simply pulls the
    first piece of paper out of the box and reads it. "Penguin Park" is written on
    the top of paper, so he walks toward it. When he reaches it, he discards the piece
    of paper and gets the next piece from the box. "George''s Auto Body Shop," so
    Joe walks to next. He continues the process until he reaches his apartment where
    he can begin learning fabulous things about Linux!


    This example is exactly how a computer uses a stack to execute a program. In a
    computer, Joe would be the CPU, the box would be the program stack, the'
