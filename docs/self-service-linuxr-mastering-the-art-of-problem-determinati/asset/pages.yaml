- img_proc: true
  md: '# 6.4 CONTROLLING A PROCESS WITH GDB


    GDB is designed to take control of a live process or load a process image (core
    file) into memory. In either case, GDB provides the ability to look at the contents
    of the memory for either a live process or the process image. When GDB is in control
    of a live process, it can also control the environment of the live process, change
    the memory used by the live process, or control how and when the live process
    is run. There are two ways to control a process and one way to get a process image
    into GDB:


    +   1. Run a program directly through the debugger. Using this method, GDB actually
    creates and runs a new process off the command line.


    +   2. Attach to a running process. Using this method, GDB attaches to an existing
    process.


    +   3. Use a core file for post-mortem analysis. When using a core file, there
    is no live process, but there is a process image. A process image, or core file,
    contains the contents of memory for a process that was once running.


    ![](img/f8e4ea98e89e9d2b5bd054d231ecdbba_219_0.png)


    **6.1** Methods to get a process into GDB.


    Regardless of how GDB gains control of a process (running a program directly off
    the command line or attaching to a live process), the resulting state is the same.
    GDB will have full control over the live process.


    All three methods of using GDB will be explained in more detail.'
  merge: -1
  pgno: 219
