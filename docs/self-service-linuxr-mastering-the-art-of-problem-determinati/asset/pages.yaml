    27203 open("/var/log/wtmp", O_WRONLY) = 3

    27203 open("/var/log/lastlog", O_RDWR|O_LARGEFILE) = 3

    27204 chdir("/home/wilding" <unfinished ...>)

    27204 execve("/bin/tsch", ["-tsch"], [* 9 vars *\]) = 0

    27202 select(4, [0 3], [], [0], NULL<unfinished ...>

    ```


    Lastly, the process goes through the login steps, confirms the user''s password
    by checking the /etc/shadow file, records the user''s log (lastlog, for example),
    and changes the directory to the user''s home directory. The final step is the
    process changing itself into the shell (tsch in this example) and the shell waiting
    for input from stdin. The remote user types any character, the select call wake
    up, and the shell will handle the character as appropriate.


    > Note: When using strace to trace the startup of a daemon process, it will not
    return because the traced processes will stay alive. The user must hit Ctrl-C
    to break out of stroke once the error has been reproduced.


