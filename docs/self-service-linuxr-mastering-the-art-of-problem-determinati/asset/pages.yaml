    If you didn''t skip the "Adding a Manual Kernel Trap" section, the problem shown
    by the Oops Report will probably seem pretty obvious. But let''s pretend that
    we have no idea how this trap came from and it''s something that needs to be fixed.


    Let''s analyze the first line:


    Oops: 0002 [1]


    Initially, this looks really cryptic and useless! To begin with, we know that
    we are in an oops situation, meaning that the kernel has encountered an unexpected
    problem. The “0002” that follows “Oops:” is a hexadecimal number that represents
    the page fault error code. By decoding this, we can determine exactly what the
    error condition was. To decode it, we first need to convert to binary—hexadecimal
    2 is binary 10. Now we need to compare this value against Table 7.1 to decode
    the meaning.'
