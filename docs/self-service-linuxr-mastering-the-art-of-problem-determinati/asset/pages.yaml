  md: '# 9.5 Segments and the Program Header Table


    The flags field (Flig) is the memory attributes used when the segment is loaded
    into memory. Lastly, the alignment field (Align) is the required alignment for
    the segment. An alignment of 0x1 means that there are no alignment requirements.
    An alignment of 0x4 means that the segment must start on an address that is on
    a 4-byte boundary.


    Of particular importance are the two LOAD segment addresses. In order, these are
    the text and data segments, explained in more detail next.


    # 9.5.1 Text and Data Segments


    Every executable and shared library has one "text" segment (Note: segment, not
    section) and one "data" segment. The term "text" refers to sections (contained
    in the text segment) that should have read-only access when loaded into memory.
    Examples of the sections that may be in the text segment include the ELF header,
    the text section (with executable code), string tables, and .rodata section. The
    data segment contains sections that need to be written to during the process’
    life time and will be writable in memory. Examples of the sections in the data
    segment include writable data symbols that are initialized (the .data section),
    global offset table, and the uninitialized memory (the .bss section).


    The text and data segments are both "load" segments because they are loaded into
    memory and used by a process.


    ```

    penguin readelf -1 foo |egrep LOAD

