- img_proc: true
  md: '# 1.4 Technical Investigation


    There are some things to check for that can help diagnose operating system or
    hardware related problems. If the memory corruption starts and ends on a page
    sized boundary (4KB on IA-32), it could be the underlying physical memory or the
    memory management layer in the kernel itself Hardware-based corruption (quite
    rare) often occurs at cache line boundaries. Keep both of them in mind when you
    look at the type of corruption that is causing the trap.


    The most frequent cause of a SIGBUS is misaligned data. This does not occur on
    IA-32 platforms because the underlying hardware silently handles the misaligned
    memory accesses. However on IA-32, a SIGBUS can still occur for a bad page fault
    (such as a bad page-in).


    Another type of hardware problem is when the instructions don''t make sense. You''ve
    looked at the memory values, and you''ve looked at the registers, for example,
    it may look like an increment instruction failed to execute or that a subtraction
    did not take place. These types of hardware problems are very rare but also very
    difficult to diagnose from scratch. As a rule of thumb, if something looks impossible
    (according to the memory values, registers, or instructions), it might be hardware
    related. For a more thorough diagnosis of a SIGSEGV or other traps, refer to Chapter
    6.


    # 1.4.1.2.2 Panic A panic in an application is due to the application itself


    abruptly shutting down. Linux even have a system call call specially designed
    for this sort of thing: abort (although there are many other ways for an application
    to “panic”). A panic is a similar symptom to a trap but much more purposeful.
    Some products might prevent further risk to the users'' data or simply because
    there is no way it can continue. Depending on the application, protecting the
    users'' data may be more important than trying to continue running. If an application''s
    main control block is corrupt, it might mean that the application has no choice
    but to panic and abruptly shut down. Panics often require knowledge of the product
    (and source code) to understand. The line number of the source code is sometimes
    included with a panic. If you have the source code, you might be able to use the
    line of code to figure out what happened.


    Some panics include detailed messages for what happened and how to recover. This
    is similar to an error message except that the product (tool or application) aborted
    and shut down abruptly. The error message and usually have some good words or
    sentences that can be searched for using the Internet. The panic message may even
    explain how to recover from the problem.


    If the panic does not have a clear error message and you don''t have the source
    code, you might have to ask the product what happened and provide information
    as needed. Panics are somewhat rare, so hopefully you won''t encounter them often.'
