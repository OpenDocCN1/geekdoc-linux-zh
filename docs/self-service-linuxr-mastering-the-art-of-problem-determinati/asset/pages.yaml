  md: '# The GNU Debugger (GDB) Chap. 6


    Program terminated with signal SIGALRM, Alarm clock.

    The program no longer exists.


    The program was killed off because it did not have a handler for SIGALRM. Signal
    handling is beyond the scope of this chapter, but we can change how signals such
    as SIGALRM are handled through GDB. First, let''s take a look at how SIGALRM is
    handled in GDB by default:


    ```

    (gdb) info signals SIGALRM

    Signal Stop Print Pass to program Description

    SIGALRM No No Yes Alarm clock

    ```


    The first column is the signal (in this case SIGALRM). The second column indicates
    whether GDB will stop the program and hand control to the user of GDB when the
    signal is encountered. The third column indicates whether GDB will print a message
    to the screen when a signal is encountered. The fourth column indicates whether
    GDB will pass the signal to the controlled program (in the preceding example,
    the program is the alarm program that run under the control of GDB). The last
    column is the description of the signal.


    According to the output, GDB will not stop when the program encounters a SIGALRM,
    it will not print a message, and it will pass the signal to the program. We can
    tell GDB not to pass the signal to the process using handle SIGALRM nopass:


    ```

    (gdb) handle SIGALRM nopass

    Signal Stop Print Pass to program Description

    SIGALRM No No No Alarm clock

    (gdb) run

    Starting program: /home/wiling/src/Linuxbook/alarm

    ```


    Program exited normally.

    (gdb)


    In the preceding example, the program slept for the full five seconds and did
    not receive the SIGALRM. Next, let''s tell GDB to stop when the controlled process
    SIGALRM:


    ```

    (gdb) handle SIGALRM stop

    Signal Stop Print Pass to program Description

    SIGALRM Yes Yes Yes Alarm clock

    (gdb) run

    Starting program: /home/wiling/src/Linuxbook/alarm

    ```


    Program received signal SIGALRM, Alarm clock.

    0x4019fd01 in nanosleep (1) from /lib/libc.so.6'
