    permanent, grep through your system''s startup scripts for "logmessage" to determine
    where it gets to virtual console 10 and change it to whatever virtual console
    you wish. For SuSE Pro 9.0 system, this setting occurs in /etc/init.d/boot.kbd


    Where the messages get is important to note in if your system hangs and kernel
