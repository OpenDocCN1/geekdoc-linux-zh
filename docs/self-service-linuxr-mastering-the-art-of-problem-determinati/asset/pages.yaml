  md: '# 1.3 The Phases of Investigation


    takes too long (that is, the problem is urgent and you need an immediate solution),
    move on to the next phase, which is searching for the answer using the Internet.
    If that doesn''t reveal a solution to the problem, don''t get an expert involved
    just yet. The third phase is to dive deeper on your own. It will help to build
    deep skill, and your homework will also be appreciated by an expert you should
    need to get one involved. Lastly, when the needs arise, engage an expert to help
    solve the problem.


    The urgency of a problem should help guide how quickly you go through the phases.
    For example, if you''re supporting the New York Stock Exchange and you are trying
    to solve a problem that would bring it back online during the peak hours of trading,
    you wouldn''t spend 20 minutes surfing the Internet for answers. You would get
    an expert involved.


    The type of problem that occurred could help guide how quickly you go through
    the phases. If you are a cautious-home Linux user, you might not benefit from
    a deep understanding of how Linux device drivers work, and it might not make sense
    to try and investigate such a complex problem on your own. It makes sense to build
    deeper skills in a problem area where the type of problem aligns with your job
    responsibilities or personal interests.


    # 1.3.1 Phase #1: Initial Investigation Using Your Skills


    Basic information you should always make note of when you encounter a problem
    is:


    +   - The exact time the problem occurred


    +   - Dynamic operating system information (information that can change frequently
    over time)


    The exact time is important because some problems are related to an event that
    occurred at that time. A common example is an err cron job that randomly kills
    processes off the system. A cron job is a script or program that is run by the
    cron daemon. The cron daemon is a process that runs in the background on Linux
    and Unix systems and runs programs or scripts at configurable times (refer to
    the Linux man for more information about cron). A system administrator can accidentally
    create a cron job that will kill off processes with specific names or for a set
    of user IDs. A non-privileged user (a user without super user privileges), your
    tool or application would simply be killed off without a trace. If it happens
    again, you will want to know what time it occurred and if it occurred at the same
    time of day (or week, hour, and so on).'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Best Practices and Initial Investigation Chap. 1


    The exact time is also important because it may be the only correlation between
    the problem and the system conditions at the time when the problem occurred. For
    example, an application often crashes or produces an error message when it is
    affected by low virtual memory. The symptom of an application crashing or producing
    an error message can seem, at first, to be completely unrelated to the current
    system conditions.


    The dynamic OS information includes anything that can change over time the amount
    of free memory, the amount of free disk space, the CPU workload, and so on. This
    information is important enough that you may want to collect it any time a serious
    problem occurs. For example, if you don''t collect the amount of free virtual
    memory when a problem occurs, you might never get another chance. A few minutes
    or hours later, the system resources might go back to normal, eliminating any
    evidence that the system was low on memory. In fact, this is so important that
    distributions such as SUSE LINUX Enterprise continuously run sar (a tool that
    displays dynamic OS information) to monitor the system resources. Sar is a special
    tool that can collect, report, or save about the system activity.


    The dynamic OS information is also a good place to start investigating many types
    of problems, which are frequently caused by a lack of resources or changes to
    the operating system. As part of this initial investigation, you should also make
    a note of the following:


    +   What you were doing when the problem occurred. Were you trying to start a
    Web server?


    +   A problem description. This should include a description of what happened
    and a description of what was supposed to happen. In other words, how do you know
    there was a problem?


    +   Anything that may have triggered the problem. This will be pretty problem-specific,
    but it''s worthwhile to think about it when the problem is still fresh in your
    mind.


    +   Any evidence that may be relevant. This includes error logs from an application
    that you were using, the system log (/var/log/messages), an error message that
    was printed to the screen, and so on. You will want to find any evidence (that
    is, make sure the relevant files don''t get deleted until you solve the problem).'
