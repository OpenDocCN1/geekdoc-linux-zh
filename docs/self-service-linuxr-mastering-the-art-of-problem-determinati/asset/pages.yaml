  md: '# CHAPTER 9


    # # ELF: Executable and Linking Format


    # ## 9.1 Introduction


    The ELF file format is the default format for shared libraries and executables
    on today''s Linux systems. ELF stands for Executable and Linking Format and is
    the most common file format for object files, executables, and shared libraries
    on Linux. A good understanding of ELF will improve your overall knowledge of how
    the operating system works, which in turn will help you diagnose problems faster.


    A good knowledge of ELF will also directly improve your diagnostic skills given
    many in-depth problems require a reasonable knowledge of ELF. For example, in
    some cases, a program may have more than one global symbol (for example, a variable)
    with the same name. Different parts of the program may access the correct variable;
    whereas, other parts of the program may incorrectly access the other. This type
    of problem can be very difficult to diagnose without a basic understanding of
    ELF and the run linker. There are also useful debugging tricks that require a
    good understanding of ELF. One such trick is to build an interceptor library for
    operating system (or lib) functions such as malloc and free. The end of this chapter
    has some examples.


    > Note: The purpose of this chapter is to provide enough knowledge about ELF to
    help you improve your diagnostic skills. This chapter is not meant to replace
    or supplement the ELF standard but rather provide practical knowledge about ELF
    on Linux. Instead of walking through the ELF standard, this chapter will provide
    real examples and explain how things work under the covers.


    For this chapter, we will be using the source code listed here to illustrate the
    ELF standard and how it relates to the Linux operating system:


    ```

    penguin> ls -l *C *.h Makefile

    -rw-r-r- 1 wilding build 759 Jan 18 05:59 Makefile

    -rw-r-r- 1 wilding build 641 Jan 9 08:57 foo.C

    -rw-r-r- 1 wilding build 161 Jan 9 08:04 foo.h

    -rw-r-r- 1 wilding build 649 Jan 18 05:37 intercept.C

    ```'
  merge: -1
