  md: '# 9.7.2 Relocation and Position Independent Code


    As discussed before, relocation is a mechanism to change values in a shared library
    or executable when it is loaded into a process''s address space. As discussed
    earlier, calls to either printf() or buzz() at compile time will be premature
    because the compiler doesn''t know where these functions will be located at run
    time.


    For simplicity, let''s look at the relocation information for the non-PIC version:


    ```

    penguin> readlef -r pic_nopic.o


    Relocation ''.rel.text'' at offset 0x378 contains 5 entries:

    Offset Info Type Sym.Value Sym.Name

    0000016 0000072 R_386_PC32 0000000 otherFunction

    000001f 0000080 R_386_PC32 0000000 myGlobInt

    0000043 0000092 R_386_PC32 0000000 Z4buzzv

    000004c 0000501 R_386_PC32 0000000 .rodata

    0000051 0000b02 R_386_PC32 0000000 printf

    ```


    The relocations solve the mystery of the missing calls to buzz() and printf()
    in the previous section on PIC vs non-PIC. The relocation for buzz() instructs
    the run time linker to change the 32-bit value at offset 0x43 in the .text section
    to the eventual, run time location of the function buzz(). A quick look at the
    assembly language at 0x42 makes the purpose of this relocation even clearer:


    ```

    42: e8 fc ff ff call 43 <main+0x17>

    ```


    The current instruction calls a false instruction at offset 0x43 because it will
    be relocated at a later time anyway. After relocation, the 32-bit value at 0x43
    will point to the address of buzz, so the instruction at offset 0x42 will be correct.


    Looking at the relocation information for the PIC object reveals interesting differences:


    ```

    penguin> readlef -r pic.nopic


    Relocation ''.rel.text'' at offset 0x3c8 contains 7 entries:

    Offset Info Type Sym.Value Sym.Name

    000001a 000000a R_386_GOTPC 0000000 GLOBAL_OFFSET_TABLE_

    000002b 0000083 R_386_GOT32 0000000 myGlobInt

    000002a 0000074 R_386_PLT32 0000000 otherFunction

    000004f 000008a R_386_GOTPC 0000000 GLOBAL_OFFSET_TABLE_

    0000064 0000094 R_386_PLT32 0000000 _Z4buzzv

    000006e 0000509 R_386_GOTOFF 0000000 .rodata *

    ```'
  merge: -1
  pgno: 389
- img_proc: true
  md: '# 9.7 Relocation and Position Independent Code (PIC)


    ```

    00000074 00000c04 R_386_PLT32 00000000 printf

    ```


    Notice that the relocation entries for the PIC and non-PIC object files have different
    types for the functions and variables. In the PIC version, the relocation types
    are PLT32 and for the non-PIC version, the relocation types are PC32. The PLT32
    is a type of relocation used with the procedure linkage table. A relocation of
    PC32 is a more primitive form of relocation.


    There is an obvious performance impact when using position-independent code. A
    few years ago, a benchmark measured the impact at about 2 to 3%, although the
    actual percentage will depend on many factors (average size of functions, and
    so on). Regardless of the performance implications, position-independent code
    is required and effective and is used widely on Linux.


    # 9.7.3 Relocation and Linking


    As discussed earlier in the chapter, the linking is the process of matching or
    binding undefined symbols of the same type and name. Linking can be done when
    a shared library or executable is actually created or at runtime, although the
    mechanisms are very different. The relocation entries for object files are processed
    during the link phase, and relocation entries in executables and shared libraries
    are processed at runtime.


    When creating an executable or shared library, the linker (usually called “ld”)
    will resolve undefined function symbols using the defined function found in the
    constituent object files. This is where the main symbol table is used. Static
    symbols are referenced through relative addressing, as global functions. The main
    difference is that static functions will not be included in the dynamic symbol
    table.


    Let’s take a look at how the linker processes the relocation entries for pic.o.
    For quick reference, here are the relocation entries for pic.o from before:


    ```

    penguin> reread -r pic.o

    ```


    ```

    Relocation section ''.rel.text'' at offset 0x3c8 contains 7 entries:

    Offset Type Sym.Value Name

    0000001a 00000a0a R_386_GOTPC 00000000 GLOBAL_OFFSET__

    00000020 00000803 R_386_GT32 00000000 myGlobInt

    0000002a 00000704 R_386_PLT32 00000000 otherFunction

    0000004f 00000a0a R_386_GOTPC 00000000 GLOBAL_OFFSET__

    00000064 00000904 R_386_PLT32 00000000a Zbuzzz

    0000006e 00000509 R_386_GOFF 00000000 .rodata

    00000074 00000c04 R_386_PLT32 00000000 printf

    ```


    Each of the function symbols, including the ones that could be satisfied by the
    function symbols in pic.o, have a relocation entry. The global variable myGlobInt
    also has a relocation entry. Let’s see what happens when the linker links the
    object file pic.o creates an executable.'
