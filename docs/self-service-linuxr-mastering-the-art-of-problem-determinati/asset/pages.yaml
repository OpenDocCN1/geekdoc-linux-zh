  md: '# 1.3 The Four Phases of Investigation 19


    ![](img/f8e4ea98e89e9d2b5bd054d231ecdbba_42_0.png)


    Fig. 1.1 Ripple effect of an error in a solution.


    If this seems overly complex, it is actually an oversimplification of real IT
    solutions where hundreds or even thousands of systems can be connected together.
    The challenge for the investigator is to follow the trail of evidence back to
    the original error.

    It is particularly important to challenge assumptions when working on a solution-level
    problem. You need to find out whether the symptom is related to a local system
    or whether the symptom is related to a change or error condition in another part
    of a solution.

    There are some complex problems that cannot be broken down in scope. These problems
    require true skill and perseverance to diagnose. Usually this type of problem
    is a race condition that is very difficult to reproduce. Race condition is a type
    of problem that depends on timing and the order in which things occur. A good
    example is a "late read." A late read is a software defect where memory is free,
    but at some point in the very future, it is used again by a different part of
    the application. As long as the memory hasn''t been reused (and written to), the
    late read may be okay. However, if the memory block has been reused (and written
    to), the late read will access the new contents of the memory block, causing unpredictable
    behavior. Most race conditions can be narrowed in scope in one way or another,
    but some are so-dependent that any changes to the environment (for the purposes
    of investigation) will cause the problem to not occur.'
