    ```

    #define AT_PHDR 3    /* Program headers for program */

    #define AT_PHENT 4    /* Size of program header entry */

    #define AT_PHNUM 5    /* Number of program headers */

    #define AT_PAGESZ 6    /* System page size */

    #define AT_BASE 7     /* Base address of interpreter */

    #define AT_FLAGS 8     /* Flags * */

    #define AT_ENTRY 9    /* Entry point of program */

    #define AT_NOTELF 10  /* Program is not ELF */

    #define AT_UID 11     /* Real uid * */

    #define AT_EUID 12     /* Effective uid * */

    #define AT_GID 13      /* Real gid * */

    #define AT_EGID 14     /* Effective gid * */

    #define AT_CLKTCK 17   /* Frequency of times */


    /* Some more special a_type values describing the hardware. */

    #define AT_PLATFORM 15 /* String identifying platform. */

    #define AT_HWACAP 16   /* Machine dependent hints about */

    processor capabilities.

    ```


    Here is some information about the following fields:


    +   **AT_PAGESZ:** The standard page size used on this operating system for normal
    memory regions. Other regions (such as shared memory) can have larger page sizes.
    It is assumed that normal memory regions are used when loading ELF objects into
    memory.


    **AT_PHDR:** The address of the program header table for the executable.

    **AT_PHENT:** The size of an entry in the program header table.

    **AT_PHNUM:** The number of entries in the program header table. Note that with
    AT_PHDR, AT_PHENT and PHNUM, the program interpreter can find all of the loadable
    segments of an ELF file.

    **AT_BASE:** The address of the program interpreter (/lib/ld-linux.so.2 in this
    case) itself.

    **AT_ENTRY:** Entry point of the program. This is the address of the executable
    that the time loader will hand control over after finishing program initialization.
    This is usually the _start function.

    **AT_PLATFORM:** The current hardware platform.

    **AT_UID, AT_EUID, AT_GID, AT_EGID:** user ID, effective user ID, group ID and
    effective group ID respectively.


    The kernel on some platforms that support ELF may choose not to load the program
    but instead pass an open file descriptor to the time loader/linker so that it
    can load the program on its own. In this case, the auxiliary vector will include
    another field called AT_EXECCFD.'
