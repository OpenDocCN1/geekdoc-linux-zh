    kernel/trap.c with the following code:


    ```

    set_system_gate(SYSCALL_VECTOR, &system_call);

    ```


    This sets 0x80 in the interrupt descriptor table to the kernel entry point

    system_call which is defined in entry.s. Curious readers can take a look at

    what happens in the kernel when the interrupt is raised by looking at arch/

    i386/kernel/entry.s in the kernel source. Among other things, this assembly'
