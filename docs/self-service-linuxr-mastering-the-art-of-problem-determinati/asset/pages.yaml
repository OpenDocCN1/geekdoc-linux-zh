    > Note: Because the source program was very simple, this assembly listing is also
    quite simple. Without any prior knowledge of or experience with assembly listings,
    you should be able to easily look at this listing and pick out the beginning of
    the two functions, function and main.


    In function(), the first instruction pushl %ebp saves the base pointer from the
    previous frame on the stack. The next instruction movl %esp, %ebp copies the value
    of the stack pointer into the base pointer register. Recall that the stack pointer,
    esp in this example, always points to the top of the stack. The next instruction
    subl $4, %esp subtracts 4 from the current value stored in the stack pointer register.
    This effectively opens up storage in the newly created stack frame for 4 bytes.
    This is the space for the local variable localVar, which is indeed 4 bytes in
    size (int). These instructions combined form what''s commonly referred to as the
    beginning of every function prologue. The function prologue is code that is compiled
    by gcc and, if not, all compilers. It is responsible for defining and preparing
    a new stack frame for upcoming function execution.


    Along with a prologue is an associated function epilogue. The assembly code shown
    for the preceding function() consists of the leave and ret instructions. The epilogue
    is effectively the reverse of the prologue. It is hard to tell this because those
    unfamiliar with the x86 system will not know that the leave instruction is actually
    a high-level instruction


    ```

    movl %ebp, %esp

    popl %ebp

    ```


    Comparing these two instructions to the first two instructions in the prologue,
    we can see that they are in fact the mirror image of each other. The function
    epilogue is completed by the ret instruction, which transfers program control
    to the address located at the end of the stack.


    The prologue and epilogue are extremely important contributors to the proper execution
    and isolation of individual function calls. They make what''s commonly referred
    to as the function or procedure calling conventions. We will discuss the remaining
    details of the calling conventions, but first a special note is required regarding
    the prologue and epilogue.'
