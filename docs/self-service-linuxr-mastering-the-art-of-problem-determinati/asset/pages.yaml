    # 6.5 Examining Data, Memory, and REGISTERS


    At this point, we''ve covered all of the ways to get a process (or a memory image
    of a process) into GDB. In this section, we discuss how to examine data, memory,
    and registers. This section introduces important GDB commands that work regardless
    of whether the process is debugging a live process or whether you''re performing-mortem
    with a core file. When there is a difference, there will be a note to indicate
    it.


    # 6.5.1 Memory Map


    Strictly speaking, viewing the memory map for a process is not part of GDB but
    is still very important to understand, why it is ever briefly here in the context
    of GDB and more in detail in Chapter 3, "The /proc Filesystem".There must be a
    live process for there to be a corresponding "maps" file under /proc. You cannot
    get a memory map /proc for a process image that is loaded in GDB as a core file.


    The memory map is the list of memory segments (aka regions) that a process has
    in its address space. There is a memory segment for every type of memory that
    a process is using, including the process heap, the process stack, memory that
    stores the contents of an executable, for the shared libraries, and so on. Memory
    segments also have different attributes such as read, write, and execute. These
    attributes will depend on the purpose of the memory segment. Shared libraries,
    for example, will have a large read/execute segment that cannot be written to.
    This is for the machine code (the actual code that gets runs) in the shared library.'
