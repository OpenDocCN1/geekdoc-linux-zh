    # 9.4 Overview OF SEGMENTS AND SECTIONS


    An ELF file can be interpreted in two ways: as a set of segments or as a set of
    sections. Sections are smaller pieces of an ELF file that contain very specific
    information, such as the machine instructions or the symbol table. Segments are
    larger groupings of one or more sections, all of which have the same memory attributes.


    Using an analogy of a car, the "sections" of the car would be the undeniable features
    of that car as seats, the gas compartment, the gas petal, the steering wheel,
    the rear window, and the dash board controls. Regardless of how these are grouped,
    they exist and can be separated from the car if needed. Segments, on the other
    hand, are not as concrete or rock but are like a grouping of sections. For example,
    we could have front and back segments. The front segment would contain the steering
    wheel, the front seats, and so on. The back segment would contain the rear window,
    the back seat, and we could also split the car into left and right segments. Or
    we could create overlapping segments as a front segment and a left segment. In
    fact, one segment could completely contain another segment. Regardless of how
    we group the "sections" of the car into segments, the sections remain the same.
