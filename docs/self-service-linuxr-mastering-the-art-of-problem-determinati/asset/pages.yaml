    ```

    [25] .bss NOBITS 001198c0 1188c0 004100 00 WA 0 0 32

    ..

    ```


    Line #18: Creates an anonymous memory segment for the bss section (more on this
    in the ELF chapter). This is a special section of a loaded executable or shared
    library for uninitialized data. Because the data is not initialized, the storage
    for it is not included in an ELF object like a shared library (there are no real
    data values to store). Instead, memory is allocated for the bss section when the
    library is loaded. One thing worth noting is part (0x70 bytes) of the bss section
    is on the last page of the data section. Whenever dealing with memory at the system
    level, the minimum unit of memory is always a page size, 0x1000 by default on
    IA-32. The offset of the bss is 0x0011920, which is not on a page size boundary.
    The next page boundary for the bss segment is 0x4012e000, which is where the rest
    of the memory for the bss segment is allocated. Given that the size of the bss
    is 0x100 and since 0x70 of the bss is on the last page of the data section, the
    rest of the bss segment is 0x39c00 (14784 in decimal) in size and is allocated
    as expected at 0x4012e000.


    Line #19: Closes the file descriptor for libc.


    Line #20: The only system call from the actual program code. This is the open
    call from the source code just listed.


    Line #21: Exits the process with a return code of 5.


