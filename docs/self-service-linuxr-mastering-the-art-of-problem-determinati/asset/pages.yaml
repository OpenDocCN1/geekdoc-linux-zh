  md: '# 9.2 Concepts and Definitions


    The source file, foo.c, is used to create libfoo.so and the source file, main.c,
    is used to build the executable foo.


    Throughout this chapter, we will be using the g++ compiler. This compiler is installed
    on many/most Linux systems and will compile C++ code to help illustrate how ELF
    handles basic C++ functionality.


    # 9.2 CONCEPTS AND DEFINITIONS


    Learning about ELF can be a challenge because the concepts are somewhat interdependent
    in learning that one concept can require understanding another concept and vice
    versa. Thus, before diving into ELF details, we will introduce a few basic concepts
    and definitions without going into too much detail. The most basic of these concepts
    are the "symbol".


    # 9.2.1 Symbol


    A symbol is a description of a function or variable (or other) that is stored
    in an ELF file. A symbol is similar to one in a phone book entry. It contains
    brief information about a function or variable in an ELF file, but like the phone
    entry, it is certainly not the item it is describing. A symbol can describe many
    things, but they are mainly used for functions and variables, which for the time
    being, we''ll focus on.


    Symbols have a size, value, and name associated with them as well as a few other
    bits of information. The size is the actual size of the function or variable that
    the symbol represents. The value gives the location in the ELF file of the function/variable
    or the expected address of the function/variable (using the load address of the
    shared library or executable as a base). Names are for the convenience of humans
    and are used so that software developers can use descriptive names in programs.


    Consider the function printf in libc.so.6" on the system used for this chapter:
    We can see the details of this "symbol" using the nm command (note that...> represents
    interesting output that was not included):


    ```

    penguin -v -f s /lib/libc.so.6

    ```


    Symbols from /lib/libc.so.6:


    | Name | Value | Class | Type | Size | Line | Section |

    |---|---|---|---|---|---|-|

    | printf | 0004fc90 | T | FUNC | 00000039 | | .text |'
