    # 7.2.9 Determining the Failing Line of Code


    Now we know a bit more about the trap and the characteristics of it, we need to
    know what actually caused it. In almost all cases, the cause is a programming
    error, the key to answering that question is first knowing where the source code
    problem occurs. We know the function name, and we know the offset of assembly
    instructions into function, so the first step is to find where function proc_dointvec_trap_kernel
    is defined. Rather than scouring through the hundreds of source files that comprise
    the Linux kernel, using a tool cscope is far easier (the "Setting up cscope to
    Index Kernel Sources" section for more information). Plugging the trapping function
    name into Find this c code shown in Figure 7.2.


    If you read the "Adding a Manual Kernel Trap" section, the results just shown
    will be you familiar. By typing "0","1"or "2," the respective file will be loaded
    and the cursor position will be pointed directly at the proc_dointvec_trap_kernel
    symbol. For now, we just wanted to find out what source file the function appeared
    in. We know that it is /usr/src/linux-2.6.2/sysctl.c.


    Now we need to translate the offset into the function of decimal 84 into source
    function in sysctl.


