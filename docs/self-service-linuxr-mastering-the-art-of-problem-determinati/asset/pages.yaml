    **Description:** The ltrace traces all functions that are called by a program.

    **Where to get:** Included with most major distributions or http://www.cesedes.org/software/ltrace/

    **Usefulness:** High

    **When to use:** Any time a detailed process trace is required, especially when
    function-level tracing is required. Very useful to see calls to functions such
    as malloc(), getostbyname(), setenv(), and so on.

    **Notes:** Only works for functions called in shared libraries (which usually
