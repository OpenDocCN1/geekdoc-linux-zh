  md: '# 3.2 Process Information


    The next important thing to note from this output is that before the malloc call,
    the heapseg executable had only two entries in the map files. This means that
    there was no heap at that particular point in time. After the malloc call, we
    now see the third line, which represents the heap segment. We see that after the
    malloc call, the brk pointer is pointing to the end of the range reported in the
    map files, 0x0806b000. Now you may be a bit confused because the brk pointer moved
    from 0x08064948 to 0x0806b000 which is a total of 136888 bytes. This is an awful
    lot more than the 1024 that we requested, what happened? Malloc is smart enough
    to know that it''s quite likely that more heap memory will be required by the
    program in the future rather than continuously calling the expensive brk() system
    call to move the pointer for every malloc call, it asks for a much larger chunk
    of memory immediately needed. This, when malloc is called to get a relatively
    small chunk of memory, brk() need not be called, and malloc can just return some
    of this extra memory. This provides a huge boost, especially if the program requests
    many small chunks of memory via malloc calls.


    Continuing our examination of the map files, the next point of interest is what''s
    commonly referred to as the mapped base address, which defines the shared libraries
    for an executable get loaded. In standard kernel source code (as downloaded from
    kernel.org), the mapped base address is a hardcoded location defined as TASK_UNMAPPED_BASE
    in each architecture:processor.h header file. For example, in the 2.6.0 kernel
    source file, the includes:


    +   * This decides where the kernel will search for a free chunk of vm

    * space during mmap''s.


    ```

    #define TASK_UNMAPPED_BASE (PAGE_ALIGN(TASK_SIZE / 3))

    ```


    Resolving the definitions of PAGE_ALIGN and TASK_SIZE, this equates to 0x4000000.
    Note that some distributions such as SuSE include a patch that allows this to
    be dynamically modified. See the discussion on the /proc/<pid>/mapped_base file
    in this chapter. Continuing our examination of the mapped base, let''s look at
