    # Sub-Distributions


    The complete Debian distribution is split into several sub-distributions, each
    of which occupies its own directory hierarchy. Surprisingly, it is the main section
    that contains the most important packages. The packages under this directory represent
    the Debian distribution itself—all these packages meet the requirements set out
    in the Debian manual. The base system, together with the majority of other packages
    that most users will want, is included in the main section.


    Additional packages, which do not meet the policy guidelines but are nevertheless
    considered useful to Debian users, are found in the contrib and non-free directories.
    These are not supported to the same level as the main packages are, but nonetheless
    they have all been specifically packaged for Debian and should install cleanly.'
