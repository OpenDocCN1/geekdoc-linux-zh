  md: '# Please Read Before Installing CD-ROM


    # What’s on the Disc


    The companion CD-ROM contains the Debian GNU/Linux operating system.


    # Debian Installation Instructions


    Insert the companion CD-ROM in your system. Reboot the computer and Debian should
    auto run. Then follow the Debian install instructions.


    If your system will not boot from CD, there are other options:


    +   1. Boot a DOS with CD drivers, then run boot.bat from the \install directory
    on the first CD.

    2. Make boot floppies from the images on the first CD, in the directory \dists\slink\main\disks-i3862.1.9-1999-03-03.
    The program rawwrite2.exe in that directory will write the floppy images under
    DOS.

    3. Next change to your correct CD-ROM drive.

    4. Next extract the program rawwrite2.exe to a floppy drive using cd d: \dists\main\disks-i3862.1.9-1999-03-03\rawwrite2
    -f resc1440.bin -d a:


    # NOTE


    d: is your CD-ROM Drive and a: is the 1.44MB floppy drive.


    +   5. See\install\install.txt for more information, and \README.multicd for lastminute
    information about the multi-cd installation method.'
