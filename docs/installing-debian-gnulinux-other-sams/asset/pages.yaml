  md: '# Other Expansion Devices 23


    In the case of internal modems, the situation is a little more complex. Many of
    these, especially the ISA-based models, are essentially identical to their external
    counterparts, and communicate with the computer via a serial port controller chip
    on the card. Internal modems simply appear to the system as an extra serial port,
    and also need no extra driver. These are the only common ISA-based devices which
    can really be recommended for use in a new Linux machine.


    You may have, need to manually configure the serial driver to identify your internal
    modem (see the sidebar on ISA cards). For instance, for a modem that has been
    manually set to interrupt line 5 and a shared memory region at 0x03e, you can
    configure the serial driver (while logged in as the root user) with the following
    command:


    ```

    setserial /dev/tty2 port 0x03e irq 5

    ```


    Note that /dev/tty2 is a UNIX name corresponding to a serial port (in this case,
    the device which would normally be called COM3 under DOS). The real meaning of
    these device names is explained in later chapters. To make this a permanent setting,
    edit the configuration file:


    /etc/init.d/serial


    or (under Debian versions later than 2.1)

    /etc/serial.conf


    Some recent modem cards—and almost all the built-in modems for laptop machines—work
    in a different manner. DSP modems (often called WinModems, although this term
    is slightly misleading, and is actually a trademark referring to one specific
    brand) are simpler and hence often cheaper, real modems, but require software
    support from a complex driver. So far the manufacturers have been reluctant to
    release the specifications that would allow people to write drivers for these
    devices. For now, they are indeed tied to Windows. With the increasing popularity
    and commercial recognition of Linux, it is possible that this situation could
    change in the future, but for now DSP modems of any type should be avoided.


    Laptop users can choose from a variety of modems available as PC cards. Again,
    some emulate normal serial ports, while others are of the DSP type—the former
    are the ones to choose.


    # Scanners


    Many modern scanner models are supported by the SANE package, distributed with
    Debian. This allows scanning either from the command line or (with the xscanimage
    package) in a graphical environment. There is a compatibility list on the SANE
    home page at http://www.mostang.com/sane/.


    Current scanners tend to connect to the computer either by SCSI or via the parallel
    (printer) port. The majority of supported scanners are connected via the SCSI
    port, although SANE also support a few parallel scanners—but check before you
    buy.


