  md: '# CHAPTER 1


    # Introducing Debian


    Linux has been arguably the biggest computing success story of the late ''90s.
    In the space of a few years, an operating system regarded as the exclusive preserve
    of a few enthusiasts has gained much respect, and widespread deployment. it is
    most commonly regarded as an operating system for server applications—especially
    for running Web sites and other Internet-based services. However, when a Linux
    system is configured with a modern desktop environment such as Gnome (see Figure
    1.1) or KDE, the user-hostile image of Linux (and other UNIX-like systems) is
    not at all deserved. With the help of the desktop environments and a selection
    of productivity tools, Linux is starting to catch on as a complete desktop computing
    solution.


    What is not always made clear that Linux is a kernel: just one component—albeit
    a central one—of a useful operating system. Fortunately, there is no need to build
    a system from scratch. Many groups and companies offer the Linux kernel plus a
    comprehensive selection of other software, all packaged and ready to install.
    Debian GNU/Linux is one of the most established of these distributions.


    # Why Use Debian?


    The availability of multiple distributions is a key aspect of the Linux phenomenon—and
    competition between the distributions has certainly been important in the evolution
    of the Linux systems in use today. But the choice is often confusing to the newcomer.
    What makes Debian the best choice?


    For many people, the key issue is its openness. The Linux kernel, and many of
    the tools used with it, have benefited from development in an open manner. Why
    should they'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Chapter 1: Introducing Debian


    distributions are assembled by small groups working behind closed doors? Debian
    development is led by a group of volunteers spread across the Internet, and everyone
    has the option to join in.


    ![](img/a0c73b609953db1cdc146c59ceca7cbb_15_0.png)


    Figure 1.1


    Packages as Gnome add a friendly face, and familiar productivity tools, to the
    mod-ern UNIX system.


    To coordinate work between several hundred active developers (and many more contributors
    and testers) around the world, the Debian project has a well-defined release cycle.
    Each new version of the system goes through the following states:


    **Unstable:** This refers to the version under development. Modifications can
    be submitted by anyone. Unlike a closed doors distribution, the latest unstable
    packages are always available, and any user can install either the complete distribution
    or a single component. The unstable distributions are normally referred to by
    a code name rather than a number.


    **Frozen:** Periodically, the current unstable version is frozen. At this point,
    addition of new features is generally not allowed, and developers concentrate
    on fixing any bugs.


    **Stable:** After a period of testing and bug-fixing, the frozen distribution
    is finally allocated a version number and marked as *stable*. This can be considered
    the *release* version of Debian—CD-ROMs of the distribution are normally based
    on the stable version.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Why Use Debian? 3


    In addition to its openness, there are good technical reasons for choosing Debian.
    This open development model has produced a very dependable Linux distribution.
    Each new version has undergone a lot of serious public testing before it is released
    as when a version is described as unstable, the term is only relative.


    Debian also has a good record for security. It is an unfortunate fact of life
    that any sophisticated network-capable operating system (such as Linux or Windows
    NT) is susceptible to various forms of attack. Vulnerabilities can be the result
    of user misconfiguration or bugs in security-critical programs. Debian helps to
    avoid both kinds of vulnerabilities by providing configuration systems that make
    it easier to secure your system, and by immediately and publicly announcing any
    security-related problems. The home page of the Debian Web site always carries
    a list of the latest security alerts, normally with links to simple fixes. Throughout
    this book, there are tips to help ensure that your computer is set up in a secure
    manner.


    A difference between distributions, and one that''s immediately obvious when installing
    or upgrading a Linux system, is the system used to package all the different parts
    of the distributions. The complete Debian distribution consists of several packages,
    ranging from essential utilities to esoteric mathematical applications. No installation
    will include all of them. Moreover, some depend on other packages, while a few
    are mutually exclusive.


    Package management software allows you to ensure that when you install a package,
    all of its dependencies be met. Similarly, if you decide to remove a package,
    the package manager ensures that all its files are deleted and you''ll be warned
    if you''re going to break the dependencies of some other package. Debian—either
    those that make up the main distribution or those supplied elsewhere—have filenames
    with the extension .deb. The basic Debian package manager is called dpkg, but
    in general it is easier to install and remove programs using a frontend called
    dselect, illustrated in Figure 1.2 and described in detail in Chapter 4. "A Basic
    Installation."


    The Debian package management system is especially helpful when you want to upgrade
    your system. It can automatically replace all your installed packages with newer
    versions, either from a CD-ROM or downloaded over the Internet. The dselect program
    makes a Debian installation up-to-date almost painless.


    One criticism is sometimes leveled against Debian: Although well-respected, it
    is currently not the most commonly used distribution. There have been some concern
    about software being supplied in the RPM package format, developed for the Red
    Hat Linux distribution (and since adopted by several others). In practice, it
    is easy to install RPMs on a Debian system, either directly or using the alien
    tool, which converts them into standard .deb files.


    ![](img/a0c73b609953db1cdc146c59ceca7cbb_16_0.png)'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Chapter 1: Introducing Debian


    ![](img/a0c73b609953db1cdc146c59ceca7cbb_17_0.png)


    Figure 1.2


    The dselect tool allows easy browsing, installation, and upgrading of packages.


    Although there are some differences between the structure, contents, and configuration
    mechanisms of the various Linux distributions, any well-written software should
    work correctly on all of them. And although some people claim that the availability
    of competing distributions adds an extra layer of complication to Linux, it is
    this competition that forces all of the distributions to stay up-to-date.


    # The Main Competition


    It would be almost impossible to include a comprehensive list of Linux distributions.
    Many minor distributions, popular with a small group of users, exist. There are
    also some cut-down distributions created for specific purposes, such as dedicated
    Linux-based network routers. The following list simply includes a few major distributions
    that may be considered reasonable alternatives to Debian.


    +   - Red Hat: This is widely considered to be the most commonly used Linux distribution.
    It is the most open of major commercial distributions, and all components—including
    Red Hat''s install and configuration tools—are freely distributable. Nevertheless,
    the core development still occurs behind closed doors. This is arguably reflected
    by the number of updates, some security-critical, that tend to appear after each
    release. Red Hat includes a wide selection of free software, although not as large
    as Debian''s.


    +   - CalderaLinux: This is a strongly business-oriented distribution. The installation
    process seems to be designed with a view to being a drop-in replacement for Windows.
    Caldera produces what is probably the most'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Why Use Debian?


    graphical distribution, and it is easy to configure in simple situations. On the
    other hand, in more complicated cases the graphical tools can prove a hindrance.
    And, while Caldera uses the RPM package format, there have been some reports of
    problems running software built for other distributions. Although it is based
    on free software, the proprietary components mean that Caldera''s distribution
    cannot be redistributed as a whole.


    +   * Slackware: This is the oldest distribution which has widespread community
    support. Unlike the others described here, it isn''t based around a special package
    file format. It also provides significantly less in the way of configuration tools—Slackware
    users like to set things up themselves.


    +   * SUSE: This is another distribution that includes bundled commercial software.
    This distribution has a strong following in Europe. There is a free demo version,
    but you have to pay for the complete package with all the bundled soft-


    +   * LinuxPPC: This is one of a distributions which are strongly based on Red
    Hat. As the name suggests, the main feature is support for PowerPC-based computers,
    such as recent Apple models.


    # A Little Debian/Linux History


    To understand the philosophy of Debian GNU/Linux—and especially the reasoning
    behind its name—it is necessary to look at the early history of Linux-based operating
    systems.


    Linux takes its inspiration from the UNIX operating systems, which were originally
    developed on minicomputers in the 1970s. In the 1980s, UNIX spread to workstation-class
    computers built by companies such as HP and Sun, and played a major role in the
    development of the fledgling Internet. During this period, UNIX was supplied with
    expensive proprietary hardware. In the mean time, commodity PC-type machines were
    getting more and more powerful. These usually only ran DOS or early versions of
    Windows—popular in the home and office markets, but lacking much of the flexibility
    of UNIX. A few commercial UNIX implementations were released, but they were expensive,
    and targeted at restricted markets.


    Everything began to change in 1991 when the Finnish student Linux Torvalds decided
    that he would like to have access to the power of UNIX while using commodity hardware.
    He started out by developing a small UNIX-like kernel, loosely based on the academic
    demonstration Minix. The kernel is the master program that controls hardware devices,
    manages the allocation of memory, and provides the scheduling system, while allowing
    more than one program to run at the same time. In short, Linux was developing
    the core of a new operating system.


    The story could have ended there. But Torvalds chose to release the source code
    for his kernel, using the name Linux. About this time, Internet access was starting
    to become more and more common, and many programmers from around the world found
    the Linux code. While kernels are often not the most obvious part of a modern
    operating system, they are still fascinating to many programmers, so many of the
    people who


    ![](img/a0c73b609953db1cdc146c59ceca7cbb_18_0.png)'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Chapter 1: Introducing Debian


    downloaded Linux started experimenting with it. Since they had the complete source
    code rather than just an executable file, they were able to fix bugs or add new
    features. These modifications (called patches) found their way back to Linux,
    who included the best of them in the next version.


    By the time Linux reached version 2.0 in mid-1996, it had become a powerful and
    stable kernel which could begin to compete on serious terms with the commercial
    UNIXes. Moreover, it was free to use, and the availability of source code meant
    that bugs were fixed quickly. When an error (widely called the F00F bug) was discovered
    in Intel''s Pentium series of processors—it could crash any computer simply by
    sending it a certain sequence of data—it was only a matter of hours before a patch
    was released that allowed the Linux kernel to recover gracefully when the processor
    glitched.


    Linux development continues today as fast as ever, although the changes aren''t
    always immediately visible. Effort is now concentrated largely on supporting more
    hardware devices and boosting the kernel''s performance on powerful multiprocessor
    machines. While Intel-based PC hardware is still the most popular platform, Linux''s
    design is quite portable, and it will now run on modern computers, including PowerMacs
    and Alpha-based workstations.


    But while the kernel is an absolutely vital part of any computer operating system,
    it is not the only piece of software needed to make a machine usable—or even the
    biggest. For Linux to run at all, the developers needed a compiler; the program
    that translates source code into executable files. They also needed many utility
    programs to make the system usable: on a UNIX system even the ls command to list
    files on a disk is a separate program.


    Fortunately, when Linux development began, free implementations of most of the
    key tools were already available. They had been developed as part of the Free
    Software Foundation''s GNU project, set up in the mid-1980s with the aimed of
    producing producing an free UNIX-like operating system. By the time Linux development
    was underway, the GNU suite included most of the vital tools for a workable UNIX
    system—except for the kernel. And it was these tools that made early Linux systems
    usable. You may like to read more about the FSF''s aims, and the reasoning behind
    the GNU project, on its Web site at http://www.fsf.org/.


    As soon as people began to use Linux for anything more than the simplest experimentation,
    demand began to grow for pre-packaged systems that combine Linux with enough tools
    to make a usable setup out of the box. The original distributions consisted of
    just a few floppy disks of essential utilities, with little or nothing in the
    way of tools to assist in installation and configuration. More gradually, they
    have been superseded by newer distributions, such as Debian, which add many more
    application programs, plus increasingly sophisticated tools to configure and managing
    the system


    Today a typical Linux distribution includes a vast array of software from the
    ls command right up to gimp, a sophisticated image editor. Not all the applications
    included'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Why Use Debian?


    are derived from the GNU project''s work. (For instance, the X Window system,
    which provides the basic services for all window software on UNIX, was developed.)
    But without high-quality GNU tools—especially the compiler suite—early Linux systems
    would certainly have struggled to get off the ground. And GNU tools still make
    up some of the most important components of any distribution. In recognition of
    this, Debian has chosen to call its distribution GNU/Linux, signifying that it
    is based on the GNU system, but with the Linux kernel.


    As an aside, the GNU project did go to develop their own kernel, using a different
    internal architecture from Linux. (Although from a user''s point of view, the
    end result will be a generally, UNIX-like system, and run all the software.) Development
    of the GNU kernel (called HURD) has been much slower, and it is not yet in general
    use. However, recently a version of the unstable Debian system that uses the HURD
    kernel has produced. If HURD succeeds in gathering momentum, future Debian users
    will have a choice of kernels.


    # A ABOUT VERSION NUMBERS


    Since the Linux kernel is only one part of the complete Debian system, the version
    numbers of the two do not necessarily match. Indeed, if they do, they are coincidental.
    Debian and the kernel use different version-numbering schemes.


    Debian versions have the form major minor. A new version number is assigned to
    each development cycle when it reaches the stable stage. At the time of writing,
    the current Debian version is 2.1, with the next version—rather curiously named
    potato—in the unstable stage.


    Linux versioning is a little more complex, with numbers in the form major minor
    patchlevel. Like the Debian distribution, stable and unstable versions of Linux
    exist in parallel Hoeveizer with an odd version number. So at the time of writing,
    the current stable kernel is 2.2.10, while new features are being added to development
    kernels in the 2.3 series. Because bugs in the kernel can have serious consequences,
    unstable kernels are recommended for active developers or for experts who need
    some feature only available in the development series. Note that Debian distributions—even
    the unstable versions—don''t use development kernels.


    # Licensed to Be Free


    The Linux kernel and much of the software used on Linux systems are free. But
    this doesn''t mean you don''t have to pay for it—according to the definitions
    used by the Free Software Foundation and the Linux community—true freedom means
    you can obtain the source code for a program, modify it, and redistribute it.
    A commonly used (some would say overused) analogy is that free software is an
    issue akin to free speech than free beer.'
