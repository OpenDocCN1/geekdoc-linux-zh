  md: 'complex WindowMaker menu definition. But this file is automatically re-created
    every a new package is installed, so if you try to edit it yourself, your changes
    will soon get lost.


    More useful, the menu.hook file contains directives that force the reading of
    two other files, menu.prehook and menu.posthook are not automatically generated.
    As the names suggest, entries added to menu.prehook appear before the automatically
    generated section, while menu.posthook entries come afterward. As a simple example,
    try adding a section to one of these files, like this:


    ```

    Dialup MENU

    "Connect (Default)* EXEC pon

    "Connect (MyISP)* EXEC pon myisp

    "Disconnect" EXEC poff

    Dialup END

