  md: 'When packages are installed, you will see that version numbers for both the
    installed and newest available packages are shown—if these don''t match, dselect
    upgrades the system to the newer version when you select install. The columns
    on the left of the screen indicate the installation status of a package.


    A row of three asterisks (*) indicates that a package is installed and set up.
    The third of these symbols represents the selected (as opposed to actual) status
    of a package: * means that the package will be added to the system next time you
    select it, whereas ** means that an installed package has been flagged for removal.


    Once you are starting to become familiar with Debian, it''s worth taking a little
    time to browse through the full list of packages, and pick out any that might
    be particularly useful. pressing p and O keys allows you to cycle through various
    schemes of sorting the package listing. If you see a package that interests you,
    select it with the + key. The key is used to unselect packages.


    # Handling Dependencies


    Whenever you select or unselect a package, dselect checks the packages dependencies.
    If the operation you have just performed breaks any dependencies, the program
    displays a sub-list of packages to help you resolve the problem (see Figure 5.7).
    When this happens, you can either press Enter to accept dselect''s solution to
    the problem, press X (must be uppercase) to abort the operation completely, or
    manually select and unselect packages until the problem is solved.


    | Lib Pri Section Package | Description |

    |---|---|

