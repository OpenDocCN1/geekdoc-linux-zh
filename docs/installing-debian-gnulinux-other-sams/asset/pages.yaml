  md: '# 104 Chapter 7: A Tour of the Packages


    Netscape Navigator is a fairly old program now, compliance with the latest Web
    standards is rather patchy. In 1998, Netscape made the surprise of releasing the
    source code of its browser packages. Since then, development of a new version
    of the browser (which has, in fact, become a complete rewrite) has been carried
    out collaboratively by Netscape employees and community developers. The resulting
    browser promises to be the most standards-compliant ever written. The home page
    for this open development effort can be found at http://www.mozilla.org.


    The Web site includes regular status updates and links to development snapshots.
    Even if you aren''t a programmer, you can help browser development by running
    these snapshots and writing up reports of any bugs you find. Once a Mozilla browser
    is ready for release, it is likely to replace Netscape 4 as the standard browser
    for Debian users.


    There are various other browsers you can use. In particular, lynx is a browser
    with a difference: It runs on a text console (or in a terminal window under X,
    of course). This sounds a little strange to people who use graphical browsers,
    but for well-designed sites, it can be surprisingly useful. And because it doesn''t
    need to download images using lynx could speed up your browsing. It is a standard
    Debian package, and quite small, so you might like to give it a try.


    One final Web-related tool worth knowing is the wget package. This is not a browser
    but a simple command-line tool that allows you to download a file from any Web
    URL (HTTP or FTP). It also has modes that allow you to download whole sites—helpful
    if you have a dial-up connection and want to keep a copy of some Web pages for
    reference.


    # Electronic Mail Clients


    The Internet electronic mail system was developed largely by UNIX users, so it
    is not surprising there is a good selection of powerful clients available to Debian
    users. They can be split broadly into two groups: text-based clients that can
    be run on a text console or in an xterm window, and graphical systems that require
    the X Window System. Today, the graphical solutions are becoming more popular,
    but these aren''t necessarily the best answer—the text-based programs have been
    developed over many years and extremely well.


    Regardless of the mail client you use, you are normally read messages from your
    system INBOX file, which is located in the /var/ spool/mail directory. Where your
    mail folders—old messages, archives of sent messages, and so on—are stored depends
    on the program you use. Most popular clients use the same format for mail folders,
    by the directory where they are stored well. So it''s worth finding one mail client
    that you like and sticking to it.


    One of the most popular graphical programs is the Messenger mail client built
    into the Netscape Communicator Web browser (see Figure 7.3). To set this up, open
    the Preferences dialog box from the Netscape Edit menu and adjust the Mail and
    News preferences to suit your system.'
