  md: '# Installation Troubleshooting


    By following the previous steps, you should be able to install a recent Debian
    release on virtually any modern PC (or with slight modifications, many other architectures
    as well). Occasionally problems may arise, usually while attempting to boot the
    Linux kernel.


    If all else fails, consider contacting established Linux users. If you don''t
    know anyone with Linux experience, contact a local Linux Users Group or ask questions
    on an Internet news or mailing list. There are some links to different areas of
    the community in Chapter 11. "And Finally—Welcome to the Community."


    # Boot Parameters


    Some older and more obscure pieces of hardware are difficult for an operating
    system kernel to correctly and safely detect. Boot parameters that you can provide
    for the Linux kernel and that might be useful on the help screens available by
    pressing function keys at the rescue disk boot screen. The most useful ones relate
    to detection of IDE devices. Some older machines cause problems when the kernel
    tries to identify the geometry of their hard disks. It is possible to specify
    this manually at the boot prompt. It is also possible to supply hints that specific
    IDE devices are ATAPI CD-ROM drives—although this shouldn''t be necessary for
    any but the oldest devices.


    # Boot Image Problems


    Some machines can run Debian, but do not agree with the standard boot images supplied
    as the bootable section on the Debian CD 1 and in the rescue1440.bin file. The
    most common problem involves the format used to store the Linux kernel. There
    are two formats for the kernel: image and the newer bImage, which is used on the
    standard boot images. Some machines, notably laptops, are unable to load bImage
    kernels. A common symptom is a silent reboot of the machine immediately after
    loading the kernel.


    If you think you are experiencing a kernel format error, Debian 2.1 includes an
    alternative rescue image (rescue1440-terra.bin, and also written as the bootable
    part of CD 2). The tecra in the name, incidentally, refers to the Toshiba Tecra
    series of laptops, but this applies to a number of other systems.


    There are also safe variants of the rescue disk images. These variants use a different
    version of the Linux loader software that may be able to cope with bugs in certain
    BIOS. If you are having trouble booting, especially on an old machine, it may
    be worth trying one of these disk images installed.


    # The Worst Case: Linux Won''t Boot


    Unfortunately, a few machines completely refuse to boot the Linux kernel and give
    errors as Invalid compressed format.


    This is rarely Linux''s fault—more often it is an indication of a subtle hardware
    defect even if the machine apparently works fine under Windows. The most common
    cause of'
