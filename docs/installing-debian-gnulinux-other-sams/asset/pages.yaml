    # CHOOSING YOUR ENVIRONMENT


    Some UNIX programs can be configured with parameters called environment variables.
    Every program on the system has its own list of variables, and these are passed
    to child programs. If you have two text-console sessions running in separate xterm
    windows and you set an environment variable in window 1, it will affect all programs
    you run in window 1, but not those started from window 2. You can see the current
    set of environment variables at any time by typing env. Environment variables
    can be set using a command in the form


    ```

    export <variable>=value

    ```


    For instance, to set the EDITOR variable, which many applications use as a hint
    for the name of a text editor program they can use, you type


    ```

    export EDITOR=emacs

    ```


    In practice, you will probably want to make this setting permanent. If you are
    using the X Window System, you can add the command to your .xsession file,'
