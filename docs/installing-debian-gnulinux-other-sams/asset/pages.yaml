  md: 'For reference, you might like to know that the apt source list is stored in
    the file /etc/apt/sources.list. One line of this file corresponds to each package
    source. The format is complex, so it is best not to manually add lines to this
    file yourself. You may find it useful to manually remove lines from this file
    when they are no longer required.


    To check that the paths have been set up correctly, perform an Update operation,
    deselect download a list of available packages from each site on your source list.


    # # Updating and Installing Debian


    With the package sources set up, you can now follow through the remaining stages
    on the deselect menu. The Update option causes the program to scan all the available
    packages and fetch a list of packages that can be installed. If you are using
    a CD-ROM set, you need to perform this step only once—the first time you use the
    set. If however, you are downloading packages from the Internet, updated package
    versions (usually fixes for security-related bugs) may appear from time to time,
    so it is worth performing regular updates so that apt can automatically pick these
    up.


    The next stage is normally to enter the package selection screens (described in
    the next section). But if there are already packages selected for installation,
    as are if you chose one of the standard package selections from the installer,
    you can proceed directly to the installation stage.


    When you select Install, deselect will first download any packages that are required
    from FTP archives. It will then begincompressing and configuring packages. Most
    packages install automatically. Others do need extra information, and run simple
    interactive configuration utilities during the installation process. The most
    important examples likely to appear in typical package selections as follows:


    +   - exim, the server program that Debian uses for low-level handling of email
    messages. If you make a mistake when you install exim, you can re-run the configuration
    at any time. There is some advice on simple exim configurations in Chapter 8,
    "Advanced Configuration."

    - gpm, a tool that provides mouse support when you are using Linux''s text console.
    This has a fairly semi-explanatory configuration procedure that detects the type
    of mouse you are using. But unless you are expecting to use the text console opposed
    to the X Window System, which provides its own mouse support, you may decide not
    want gpm.

    - bind, a program that makes your computer a self-sufficient part of the Internet
    Domain Name Service. However, if like most users, you just want to get name lookups
    working, accepting the suggested defaults would work fine.

    - apache, the common UNIX Web server, also provides you with some opportunities
    for configuration. Once again, unless you are a Web server expert, just accept
    the defaults—it is easy enough to reconfigure later if you need to.'
