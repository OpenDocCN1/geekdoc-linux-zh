    do not shut the system down properly, it will spend several minutes running consistency
    checks on your disk partitions the next time you switch it on. In the worst-case
    scenario, serious disk corruption could occur. The standard way to shut down is
    to log using the root account and type


    shutdown -h now


    The -h stands for halt. You will see a list of messages as various operating systems
    components are disabled, and finally the System halted message will appear, which
    indicates that it is safe to switch off. If you specify the -r option instead,
    the machine will reboot. On a standard Debian system it is also possible to safely
    reboot by pressing Ctrl+Alt+Delete. Finally, some graphical user interfaces provide
    their own methods for shutting down the system.


    You may have noticed the now option passed to the shutdown command. As you might
    expect, this causes the system to start the shutdown process straight away. But
    if you are running a server machine that may have other users connected over the
    network, you can also use the shutdown command to schedule a system halt or reboot
    at some point in the future. To give users 15 minutes to finish their work and
    log off, type


    shutdown -h +15


    In this case, users will receive a series of warning messages as shutdown time
    approaches. Read the manual page for more details.'
