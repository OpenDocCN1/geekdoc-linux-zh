  md: '# Managing File Systems 19


    Note that in this example, mount doesn''t need to be explicitly told the type
    of file system to mount. It is always safe to specify the file type using the
    -t option, but in most cases mount makes a reasonable guess.


    Suppose, however, that you access partition regularly. You can save yourself by
    adding a line to the system configuration file /etc/fstab to automatically mount
    your DOS partition at boot time. A suitable line might be


    ```

    /dev/hda1 /vwin-c vfat defaults 0 2

    ```


    The etc/fstab file is a column-based format. The first column specifies a device
    to be mounted. The second column is a mount point directory, which you should
    create next. Next comes the file type to use—if in doubt, try the file system
    manually, and then mount to find which type has been selected automatically. Alternatively,
    just use the auto option here, which allows the mount command to define the type
    at mount time. The fourth column is a comma-separated list of special options
    to use when mounting this file system. When in doubt, start by choosing defaults
    here. The last two columns are optional and always have that partition and are
    described in the manual page for fstab. Values of 0 and 2 will suit most personal
    workstation setups.


    It isn''t always sensible to mount file systems at boot time, though. This is
    especially true in the case of removable media. On the other hand, it can be awkward
    to log on as root and execute a complicated command every time you need to access
    a device. Adding an entry to /etc/fstab can help in this case, too. For instance
    if you regularly use a CD-ROM device, you might like to use the following:


    ```

    /dev/cdrom /vcdrom iso9660 noauto,user,ro 0 2

    ```


    If you installed Debian from CD, the installer will normally create a symbolic
    link from /dev/cdrom to your real CD-ROM device (for instance, /dev/hdc). If you
    didn''t install from CD, you might want to create this link now. Virtually all
    CD-ROMs use the ISO9660 file system type, so that option is specified here. But
    the most important part of this etc/fstab is the options column. The noauto flag
    means that this device should not be mounted automatically at boot time, while
    the user flag means it can be mounted by any user. Not just root. Ro is a hint
    that this is a readonly device—this option isn''t strictly necessary, but it avoids
    encountering a warning message when you mount the device.


    With an entry such as this, any user can mount a CD-ROM at any time by running
    mount with a single argument. For example


    ```

    mount /vcdrom

    ```


    The graphical file managers supplied by GNOME and KDE provide methods for creating
    icons corresponding to mount devices on your desktop. With a suitable'
