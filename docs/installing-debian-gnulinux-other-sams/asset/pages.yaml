  md: '# Setting Up Package Sources


    The first time you run dselect, you must tell the system to find Debian packages.
    Thus, the Access option is the first item on the dselect menu. There are a number
    of possible access methods to choose from (see Figure 5.5)—but as of Debian 2.1,
    many of these are obsolete. The two that are likely to be of interest are the
    multi_cd method (which you''ll install from standard Debian CD sets) and apt,
    which is what you want if you are performing a network-based installation, or
    upgrading an existing distribution over the network.


    ![](img/a0c73b609953db1cdc146c59ceca7cbb_80_0.png)


    Figure 5.5

    The package manager can use various methods for locating package files.


    Actually, the apt system can also be used for installing packages from CD-ROM,
    so the multi_cd option will ultimately become obsolete. But at the moment, dselect
    doesn''t allow you to easily configure a CD-ROM drive as an package source. This
    option is not recommended—yet. If you do want to try using the apt system with
    CD-ROM sets, read the manual page for the apt-cd package. Note that the apt system
    is gradually becoming more and more central to Debian management, and in the future,
    it is likely that apt will be the standard method for installing from CD-ROMs
    as well.


    # Installing from CD-ROM


    Upon selecting the multi_cd access method, you are first prompted for the UNIX
    device name of your CD-ROM device. If you''ve already installed the Debian base
    system from a CD, the installer already created the new device name. /dev/cdrom,
    as a link to the real device you used. You will almost certainly be able to accept
    the default here.'
