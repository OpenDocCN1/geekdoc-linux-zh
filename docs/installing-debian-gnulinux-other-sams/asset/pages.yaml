  md: '# CHAPTER 2


    # Getting Ready—Hardware


    The Linux kernel was originally designed to run on PC-type computers based on
    the Intel i386 (or later) processors. This is still by far the most popular architecture—and
    the one on which this book concentrates, although most of the information is relevant
    to other architectures too.


    These machines can all trace their ancestry back to the original IBM PC. Since
    then, a huge number of third parties have produced clone PCs. Today it is possible
    to buy a wide selection of branded PCs. But it is also easy to find white box
    machines, assembled by small local retailers, or to build your own machine from
    off-the-shelf components.


    The PC explosion has been something of a mixed blessing. Certainly, without the
    fierce competition between manufacturers, the industry is unlikely that we would
    be able to buy high performance computers so cheaply. But in most cases, the industry
    has been following de facto standards—and even these have sometimes been treated
    flexibly. This diversity can be something of a headache for operating system developers
    who find need to support a huge range of hardware.


    The good news is that the Linux kernel supports a remarkably high proportion of
    basic PC hardware—even some evolutionary dead-ends such as the Microchannel architecture
    used in IBM''s PS/2 machines. The kernel should boot on almost any machine made
    in the last five years.


    If you have a standard PC-type machine produced in the last few years, and no
    specific add-on hardware, you may want to skip the rest of this chapter now and
    start installing Debian straight away. You can refer back to this chapter if you''re
    having difficulty getting a piece of hardware working under Linux, or if you are
    thinking about buying new devices for use with your Debian system.'
