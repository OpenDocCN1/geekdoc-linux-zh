- img_proc: true
  md: '# Chapter 4: A Basic Installation


    this problem is a substandard memory chip. Since the Linux kernel allocates system
    memory differently to Windows, it is possible for a memory problem that caused,
    at worst, an occasional error under Windows to prevent a Linux system from booting
    entirely.


    Such problems are not always easy to diagnose: The memory check that the BIOS
    performs when the machine starts up is not at all comprehensive and frequently
    misses subtle problems. Special memory-check programs can perform better, but
    even these do not exercise the RAM devices in the same way that a normal program
    does.


    If you suspect a memory problem (or, for that matter, any other hardware fault),
    the best diagnosis is to physically trace the defective component. If your computer
    has more than one bank of memory, try removing each in turn to see whether that
    allows the same kind of memory, try swapping RAM modules between the two machines.
    Alternatively, if you have access to another computer that uses the same kind
    of memory, try swapping RAM modules between the two machines.


    # Summary


    Having read this chapter, you should be familiar with the steps required to install
    the Linux kernel, and a few basic tools, on your machine. Once this is complete,
    the installer will automatically start the dselect package management program.
    Chapter 5 explains how you can use dselect to install software from the huge selection
    of packages supplied with the Debian distribution. With this step complete, you
    will be ready to start exploring Debian yourself.'
