    # Interfaces of the Future


    In the last few years, a number of new standards have emerged for connecting computers
    to peripheral devices. The trend seems to be a strong move away from monolithic
    computers that have to be plugged together, carefully set up, and then let that
    way. The PC card interface used by laptop computers is already hot-pluggable—you
    can insert and remove cards while the computer is switched on, and expect it to
    automatically reconfigure. Within the next few years, more and more devices will
    be connected using new, flexible interfaces.


    # USB


    Universal Serial Bus (USB) is a high-speed serial interface proposed several years
    ago as a convenient method for attaching many devices, from keyboards to scanners,
    to new computers. The standard has been designed around a concept of hot-pluggable
    devices. Most PCs now have a USB socket, but USB devices are still relatively
    rare. This is now changing, with USB devices being supplied with recent Apple
    computers, and also with the SGI Visual workstations. The Linux USB support is
    currently still under development, and is expected to merge into the 2.3 development
    series of kernels.'
