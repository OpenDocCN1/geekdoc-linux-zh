  md: '# Memory Disk


    It is difficult to give exact figures for the system resources required by a GNU/Linux
    system. It is supposedly still possible to boot a standard Linux kernel on a machine
    with only 4MB of memory, and certainly with 8MB it can run reasonably, if you
    only want a few simple tools. How much more than this you require on your applications.
    In practice, if you are going to be using a graphical interface and some windowed
    applications, 32MB is probably a reasonable starting place. Adding more than can
    improve performance considerably.


    If, after getting your Debian system running, you think that your machine may
    be short of memory, then try using the free command to view details of current
    memory usage. A little care is needed when interpreting this information. For
    instance, on a lightly loaded 96MB machine, typing free at the command prompt
    gives the following results:


    | total | used | free | shared | buffers | cached Mem: |

    |---|---|---|---|---|--|

    | +/- buffers/cache: | 94852 | 93424 | 1428 | 39460 | 46652 | 23868 |

    | Swap: | 130748 | 180 | 130568 | | |


    The first line shows that virtually all of the machine''s memory is being used
    for something. However, the Linux kernel considers any memory that applications
    aren''t currently using as fair game for caching recently accessed areas of your
    hard disk. This can significantly improve apparent disk performance. But if an
    application needs more space, all this memory can be quickly reclaimed.


    A more realistic reflection of memory use appears in the second line, which counts
    memory used for disk caches as free. This shows that this particular machine has
    plenty of RAM to spare. The final line gives details of swap space—virtual memory
    stored on the hard disk. This virtual memory will be used to large extent only
    if the machine comes close to running out of main memory.


    One point to remember is that the performance of any modern computer is strongly
    dependent on cache RAM: special speed memory devices which store copies of recently
    accessed areas of main memory. While it may be physically possible to include
    large amounts of RAM, many old Pentium motherboards only use the cache for accesses
    to the first 64MB of physical memory. This can sometimes lead to a surprising
    situation where adding extra memory actually reduces performance, at least for
    certain applications. If in doubt, check your motherboard documentation before
    adding memory. More modern Pentium motherboards will usually allow caching of
    substantially more memory. Pentium II processors use a rather different design,
    and support up to 512MB of memory, irrespective of the motherboard that use.


    Disk space is another area where requirements can vary dramatically. With a little
    experience it''s possible to install a small Debian system—more than enough to
    work as a simple print server, for instance—on a 50MB hard disk partition, and
    still have some'
