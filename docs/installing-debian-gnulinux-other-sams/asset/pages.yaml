- img_proc: true
  md: 'The most common situation involves selecting one package that relies on others
    that haven''t been selected. In this case, dselect automatically selects all the
    required packages, and you can normally accept this by pressing Enter. Some packages
    may also suggest that you might like to install other packages that complement
    them—you have a chance to read the descriptions of the suggested packages and
    see if you agree.


    Dependency handling is complicated slightly by the idea of virtual packages. These
    are package names that represent concepts rather than real programs. A typical
    example is found in the X Window system (see Chapter 6). Various parts of the
    system rely on a program called an X server, which acts as a kind of driver for
    your video hardware. However, there are several different X servers, and you must
    choose the correct one for your particular system.


    While X components cannot specify a dependency for any specific X server package,
    they do depend on a virtual xserver package. Any package that provides the xserver
    capability will satisfy this dependency. If you try to install a program that
    depends on a virtual package, dselect locates all the packages providing the required
    capacity, and prompt you to choose which one to install.


    If you remove a package used by some other package, this will obviously trigger
    a dependency problem too. In this case, you''ll probably want to Shift-X to undo
    the operation. If you really want to remove the package, you need to remove the
    packages depend on it.


    # Upgrading Your System


    The dselect program can automatically recognize when an available package is newer
    than the version you have currently installed. This option allows for automatic
    upgrades. Once even a Debian distribution has been marked as stable, there are
    sometimes minor updates, generally to fix security-related problems. In the time
    of writing, the FTP archives carry Debian 2.1r2, which differs by a few packages
    from the original 2.1 release. Such minor upgrades can be carried out simply by
    setting your nearest Debian archive as the package source, and then selecting
    Update, followed by Install. Note that the package manager is very flexible about
    packages packages from: Even if you carried out your installation entirely from
    CD, there is nothing to stop you from switching your access method to apt and
    upgrading over the Internet.


    The same approach can be used to upgrade from one release of the distribution
    to another. But in this case a much greater proportion of the packages must be
    upgraded, and there may be some significant changes. Package-installation scripts
