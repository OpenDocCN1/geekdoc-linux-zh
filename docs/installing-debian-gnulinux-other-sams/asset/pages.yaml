    manager. Most window managers provide an Exit option in their root window menus.
    When you select this option, the whole X session terminates and you are returned
    to the text console. If you have chosen a default window manager that doesn''t
    have an easy escape route, you can forcibly terminate the session by pressing
    Control+Alt+Backspace—but use this as a last resort.


    You can also switch out of X temporarily using the virtual console system. Just
    pressing Alt and a function key doesn''t work when X is running, but Control+Alt+F1
    will take you to virtual console 1. When you want to switch back, you''ll find
    the X session running on virtual console 7.


    # Setting Up an X Session Script


    By default, when you start a new X session, Debian just loads the default window
    manager, with no other applications. But it is easy to override this behavior—if
    the system detects a file called .xsession in your home directory, it will use
    this to configure your session instead.


    The .xsession file is normally a Bourne shell script, and if you are familiar
    with UNIX scripting, there is almost no limitation to what you can do from this
    file. But in most cases, you will just want to run a few applications and a window
    manager (which may or may not be the system default). A typical file might look
    like this:'
