  md: '# CHAPTER 3


    # Getting Ready—Disk Space


    In this chapter, you begin the Debian installation process in earnest. For many
    would-be Linux users, the need to repartition an existing hard disk can be the
    most intimidating part of the whole installation process. If you are installing
    on an existing machine, you may need to completely reformat your hard disk. But
    this is the worst-case scenario, and there are numerous possible methods that
    can allow you to avoid this scenario altogether.


    This chapter also covers some basic ideas about how Linux stores files on disk
    partitions, and explains the most important landmarks in the directory structure
    that will be created when you install Debian. File systems are a fundamental part
    of the Linux kernel, so most of the ideas in this chapter actually apply to any
    Linux-based distribution.


    Most first-time Debian installers will want to use GNU/Linux as a second operating
    system on a machine that is already in use—probably running Windows. If you have
    a separate computer you can detour entirely to your new Debian installation, life
    will become somewhat easier, but running a separate computer is not always practical.


    Before going any further, an oft-repeated, but almost frequently ignored, piece
    of advice: Whatever you''re doing with your computer, keep a backup of any important
    files. Even if you can avoid a complete reformat of your hard disk, you will still
    need to modify your hard disk partition tables before you can install any Linux-based
    system.


    The large size of modern hard disks means that backing up data to floppy disks
    is rarely an attractive, even practical, prospect. But there is a selection of
    removable mass-storage devices, which are now quite cheap. Even though installing
    Debian isn''t a particularly dangerous operation, there are many ways in which
    data can be lost, whether you are installing a new operating system or using the
    computer normally. If you value your data at all, back it up now. You never know
    when you''ll be glad that you did.'
