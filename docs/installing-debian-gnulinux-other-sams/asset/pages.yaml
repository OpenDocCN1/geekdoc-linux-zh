    # Debian Today


    Debian today is a mature—although, of course, still evolving—distribution. It
    is suited to a range of applications, from desktop to running a large corporate
    Web server. Unlike some of the commercial distributions, every component is freely
    distributable. A CD-ROM carrying the core of Debian 2.1 is included with this
    package.


    For those with fast Internet connections, it is also possible to download Debian
    from one of the many officially endorsed mirror sites worldwide. You can find
    your nearest mirror from the Debian home page at http://www.debian.org/


    Even if you don''t want to download the complete distribution, it is often useful
    to update a few packages in this manner. Setting up the select to automatically
    fetch packages over the network when required is explained in Chapter 5, “Making
    Your Selection.”


    Debian development remains active as ever. Future developments are discussed on
    various Internet mailing lists. Once you have installed Debian and become familiar
    with its structure and use, you may want to read some of what''s going on behind
    the scenes, and perhaps even join in yourself. There is more information about
    the Debian mailing lists, and tips for making helpful contributions, in Chapter
    11, “And Finally—Welcome to the Community.”


    # Summary


    This chapter gives an insight into the history and development of the Debian GNU/Linux
    distribution. The watchwords are freedom and openness: Anyone who is interested
    can join in with development work. We return to this theme in the final chapter
    of this book.


    The next two chapters concentrate on the practicalities of preparing for a Debian
    installation. Chapter 2, “Getting Ready—Hardware,” will help you to check that
    your computer is ready to run a Linux-based operating system. Chapter 3, “Getting
    Ready—Disk Space,” covers the distribution’s space requirements, and lists the
    options available if you need to repartition your disk drive.'
