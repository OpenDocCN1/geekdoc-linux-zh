  md: 'space left over. On the other hand, if you want a reasonably comprehensive
    installation plus some room for experimentation, 500MB of free space is probably
    a sensible minimum, and having a full gigabyte could make life more comfortable.
    Additional guidelines for allocating disk space for Linux, with together instructions
    for repartitioning your drives, are included in Chapter 3. “Getting Ready—Disk
