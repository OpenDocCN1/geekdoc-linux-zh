  md: '# 140 Chapter 9: Life On a Network


    about a number of computers that were successfully cracked. In one case, the intruders
    installed a network traffic snooping system that deciphered around 500 username-password
    pairs before it was discovered—an excellent reason for using ssh instead of Telnet
    whenever possible.


    But before you let this potential risk persuade you that connecting your computer
    to any kind of network is a bad idea, remember that security is possible. A machine
    running a recent Linux kernel and no Internet servers (either from inetid or as
    a standalone daemon) is actually very safe. In practice, you probably will want
    to run a few servers (at least the exif mail server and maybe sshd). So long as
    you make sure you are running the latest versions and regularly check the Debian
    home page for security alerts, you are probably safe under intense scrutiny from
    some paranoid people; thus, problems are found quickly. If you are running servers
    on a public network, it''s also worth glancing through your system log files (in
    the /var/log directory) to check for anything of the ordinary. You might also
    like to look at security tools that check the integrity of your system. For instance,
    the tripwire program can monitor key system files and warn you if there is any
    unauthorized modification.


    # Summary


    In this chapter, you have seen a number of methods for sharing resources between
    computers on a network. Modern networks are simple to install. The tools and servers
    supplied with Debian can help you to make the most of a network. Further information
    about using the X Window System in a networked environment can be found in Chapter
    10.


    This chapter emphasized techniques that are suitable for managing small networks,
    as might be found in the home or in small offices. Debian servers could also be
    used in much larger network installations. Some advice on large-network administration
    can be found in HOWTO documents, but you may also want to consult specialist books.'
