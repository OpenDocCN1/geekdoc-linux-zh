- img_proc: true
  md: '# The Future


    The X Window System has a long history. It has probably stood the test of time
    better than any other windowing system in common use. This is often forgotten
    by X users today; for instance, people complain that the old Motif user interface
    widgets are ugly, without stopping to remember when they were originally designed,
    they had to be usable on the monochrome displays that were still common. There
    are some projects that aim to replace X as the primary user interface system for
    UNIX computers. An open source project that has attracted considerable interest
    can be found at http://www.berlin-consortium.org.


    However, writing off X is badly premature—it still works well today, and many
    developers think that it provides a very strong platform for future developments.
    The increasing popularity of toolkits like GTK makes X interfaces easier to program
    and increasingly offers the end user choices in the look and feel of applications.


    One of the weaker aspects of traditional X servers is their font support—X has
    traditionally used simple bitmap fonts. With what-you-see-is-what-you-get-style
    applications becoming more common on UNIX platforms, high-quality scalable (that
    is, any size) fonts are more important than ever. But it is already also possible
    to plug in improved font support: the xffst package offers support for the popular
    TrueType fonts. The forthcoming XFree86 4.0 release should offer even better built-in
    font support.


    The underlying technology of graphics displays is also changing. Many PC users
    now have graphics cards that provide sophisticated mechanisms for rendering 3D
    graphics. Making efficient use of this feature is important to both games programmers
    and to more serious scientific and technical applications. The standard system
    for programming 3D applications is the OpenGL graphics language. Better support
    for OpenGL programming is another issue that should be resolved in the new X server
    release. For more information on the development of the X server, try this site
    at http://www.xfree86.org.


    # Summary


    This chapter investigated some of the power of the X Window System. Although the
    core X technologies are now quite old, the network-awareness and strong emphasis
    on flexibility mean that this window system remains extremely powerful.


    This chapter concludes the coverage of Debian configuration. The next chapter
    gives more information about the community of users and developers that surrounds
    the Debian system and includes links to useful Internet resources.'
  merge: -1
