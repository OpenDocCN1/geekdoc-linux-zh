    of code that extends the features of an older system called TeX. This has been
    a popular tool for producing scientific and mathematical texts for many years.
    Debian includes the TeX system, which uses LaTeX and many related packages. These
    are all found in the TeX section of the package listing. As a minimum, you will
    want the textex-base and textex-bin packages installed. There are also packages
    of'
