  md: '# 70 Chapter 5 Making Your Selection


    +   * X servers, the core part of the X Window system, are also included. Instructions
    for installing and configuring X are found in Chapter 6. “The First Steps in Debian.”
    Unless you have used Debian before, it is best to have a base system working first,
