  md: '# Chapter 1: Introducing Debian


    Many people ask, “Why write free software?” For many developers, the answer is
    simple because they want to. The Linux kernel started as a personal project, and
    even today of the developers are people with a strong personal interest in the
    inner workings of operating systems. In other cases, a program sometimes has to
    be written, perhaps for in-house use by company. The question then becomes, “Why
    not release it publicly?” Often, there is nothing to lose, and the original developers
    can benefit from the input of outside testers and programmers. Obviously, not
    all GNU/Linux users are themselves programmers; if you ever find yourself developing
    any software, you should ask whether there is anything losing by releasing it
    free.


    Arguably the most free software is placed in the public domain. This software
    has no license attached to, and anyone can do exactly what they want with it—embedding
    it into a commercial product without giving any credit to the original authors.
    Such software is quite rare.


    The majority of free software is copyrighted and distributed with a license that,
    while permitting free redistribution, places some mild restrictions to ensure
    that the authors get the credit. The two most common licenses applied to programs
    in a Linux distribution are summarized as follows:


    +   * The General Public License (GPL): This is the license originally drawn up
    by the Free Software Foundation to cover the components of the GNU system. It
    has since been adopted by many programs not written by the FSF—including the Linux
    kernel. The most significant feature of this license is that, if you give or sell
    someone a binary of GPL program, you must supply a copy of the source code on
    request. This license has been drawn up so that it is not possible to produce
    a proprietary (non-free) derivative of a GPL program.

    * BSD License: This is the license applied to software written by programmers
    at the University of California at Berkeley, and has also been adopted by many
    other programmers. It is less restrictive than the GPL in that it allows proprietary
    derivatives of the code. However, it does include a clause requiring that the
    original developers be acknowledged in any advertising material—a restriction
    that some people have considered excessive. Confusingly, some programs are distributed
    under a modified BSD license without this restriction.


    From an end user''s perspective, the differences between the licenses are usually
    not particularly important—they all allow you to make unlimited personal and commercial
    use of the software, and to give a copy to your friends. The biggest differences
    are apparent when distributing modified versions.


    # TERMS OF FREEDOM


    There have been some arguments about exactly what it takes to make a piece of
    software free. The increasing number of different software licenses only makes
    the problem worse. To deal with this question, Debian developers drew up a list
    of conditions for software freedom The Debian Free Software Guidelines. These


