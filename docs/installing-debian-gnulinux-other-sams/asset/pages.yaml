  md: '# APPENDIX A


    # Kernel Management


    Although we talk about it often, the Linux kernel usually keeps a fairly low profile.
    The kernel is designed to run for months on end without requiring any attention,
    and for normal users, most users can ignore it entirely. But sometimes it is useful
    to upgrade the kernel. New versions often contain fixes for bugs or security problems,
    and may also offer performance improvements and drivers for the latest hardware
    devices.


    Before upgrading to the latest kernel release, however, be sure you know what
    you are getting. Only the stable kernel series (with even minor version numbers—for
    instance, 2.2.11) are intended for general use. Development kernels (for instance,
    2.15) can be unreliable, and you should normally wait for the next stable series
    (2.4.x).


    # Installing a Kernel Package


    As a Debian user, normally you can install a ready-compiled kernel supplied as
    a normal Debian package (with a name beginning with `kernel-image`). Because of
    the special role of the kernel, the latest version isn''t automatically installed
    by dselect in the same way that other packages are upgraded. But it is easy to
    manually select the `kernel-image` package you want. At the same time, you might
    want to upgrade a few other packages: if you are a programmer, you should install
    the `kernel-headers` package that matches your `kernel-image`. Laptop owners who
    rely on PC Card devices should ensure that the `pcmia-modules` package matches
    the kernel, too.


    When you install a `kernel-image` package, the kernel itself will be installed
    in the `/boot` directory with a name like `vmlinuz-2.2.11`. (The z means that
    this is a compressed kernel file—some non-Intel platforms do not support this
    kernel format.)'
  merge: -1
