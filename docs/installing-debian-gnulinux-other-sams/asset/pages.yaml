    rescue and install systems*


    Once you have completed the installation, you may want to change this back to
    some other value—probably just C to boot from hard disk every time and ignore
    all other devices. Having reconfigured the BIOS, reboot once more so that the
    CD-ROM will be recognized.


    # # Booting from Floppies


    Occasionally, booting from a standard Debian CD-ROM is impossible, either because
    you are using a computer that doesn''t support the process, or because you don''t
    have an up-to-date Debian CD. In either case, you can use the more traditional
    method of booting the system from a floppy disk. Note that even if your BIOS does
    not allow you to boot from a CD-ROM, as long as the disk is recognized by the
    Linux kernel, you can still install the rest of the Debian packages off the CDs.


    A typical Debian distribution includes a number of disk images. For an Intel system,
    you normally find these in the following directory:


    dists/stable/main/disks-1386/current


    This is relative to the root of a standard Debian CD-ROM, or the top level of
    a typical Debian FTP archive on the Internet.


    There are separate images for 1.44MB and 1.2MB floppies—modern 3.5” drives always
    use the 1.44MB format. You will always need a rescue disk (such as resc1440.bin),
    and you will probably also want a drivers disk (such as drv1440.bin). If in doubt,
    make the drivers disk now—it takes only a few minutes.'
