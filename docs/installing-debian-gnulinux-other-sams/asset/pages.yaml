  pgno: 150
- img_proc: true
  md: 'as described in Chapter 8 (if not, make sure that this is working before you
    proceed). This computer is referred to as the gateway (see Figure 9.1). Note that,
    in a simple masquerading setup, the gateway is the only machine that needs to
    be running Linux. The remaining client machines can be running any operating system.


    ![](img/a0c73b609953db1cdc146c59ceca7cbb_151_0.png)


    So far, the chapter has considered only the case of a computer having a single
    IP address. But in fact, the gateway machine in Figure 9.1 has two: the *reserved*
    address, allocated by you and associated with the Ethernet interface, and another
    address, allocated automatically by your ISP and associated with the dial-up connection.
    When one of the client machines attempts to create an outgoing connection, the
    masquerading code on the gateway connects to the Internet on the client''s behalf.
    Thus, outgoing connections from all the machines on the network appear to come
    from a single IP address: the one associated with the dial-up connection. This
    leads to the term *masquerading*.


    The first step is to set up the client machines on the network. They need to know
    the IP address of the gateway machine. For Debian systems, this is specified by
    the GATEWAY=... line in /etc/init.d/network. Since the client machines will have
    access to the Internet, they will also want access to the domain name server.
    The easiest way to set this up is to run the bind program on the gateway, as described
    in Chapter 8, and then set all the clients to use the gateway as their name server.


    Now, to actually provide the masquerading system, ensure that the ipfwadm package
    is installed on the gateway. Activate the dial-up connection, and then type (as
    root):


    ```

    ipfwadm -p deny

    ipfwadm -F a masquerade -S 192.168.1.0/24 -D 0.0.0.0/

    ```


    The address 0.0.0.0 is a reference to the Internet as a whole. To test this, go
    to one of the client machines and try to establish an outgoing connection to an
    Internet site—just fetching a page in a Web browser is a good test. This test
    should work just as if you had a dial-up connection directly to the client machine.'
  merge: -1
  pgno: 151
- img_proc: true
  md: 'Once you have tested the system, you will probably want to move the ipfwadm
    commands to some location where they are executed automatically. To do so, place
    a script in /etc/init.d plus symbolic links from your run-level directories to
    ensure that it is executed when you boot the machine. In the simplest case, you
    could just write a script like this:


    ```

    #! /bin/sh

    ```


    ```

    ipfwadm -p deny

    ipfwadm -F masquerade -S 192.168.1.0/24 -D 0.0.0.0/0

    ```


    This can be executed at boot time by placing it in /etc/init.d marking it executable
    with the chmod command and creating a symbolic link from your run-level directory.
    Another sensible location for masquerade scripts would be the etc cpp ip-up and
    etc cpp ip down directories first described in Chapter 8.


    Note that the IP masquerading system has been rewritten in the Linux 2 kernel,
    and the official mechanism for configuring the gateway is the ipchains program.
    There is a small wrapper program that emulates the old ipfwadm system, but if
    you want to take advantage of the more powerful ipchains program, take a look
    at the IPCHAINS-HOWTO document.


    # # Security Issues (or The Paranoid Bit)


    You probably already have noted a security theme running throughout this chapter
    and indeed Any machine with a (non-firewalled) Internet connection should be considered
    a potential target. And even dial-up machines are sometimes targeted by crackers
    Note that use of the term hacker to refer to someone trying to gain unauthorized
    access to a computer system is frowned upon in the Linux community. An earlier
    example of hacker is applied to anyone who programs computers in a creative manner.
    Indeed most major GNU/Linux developers would quite happily label themselves as
    hackers.


    There are two main kinds of attacks that can be launched against a computer. Denial
    of Service (DoS) attacks normally cause the machine to crash. Such attacks are
    irritating to users but usually harmless unless they are applied to critical server
    machines. Linux-based systems are extremely resistant to DoS attacks.


    More serious techniques that allow the attacker to execute an arbitrary piece
    of code on a machine these usually exploit bugs (often trivial-looking ones) in
    server daemons. An attacker who has found a security hole of this kind will be
    able to obtain full root access to your machine. Systems attacked in this way
    are sometimes used as bases for distributing illegal copies of software and other
    desirable files, relaying junk mail or launching attacks on other computers.


    You might think this section sounds excessively paranoid. But personal experience
    from a period when my machine was connected to a large academic network tells
    me that crackers certainly exist. I observed several attempted attacks foiled
    by ensuring that any server packages running on my machine were kept up to date
    and heard'
  merge: -1
