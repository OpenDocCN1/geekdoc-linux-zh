  md: '# 166 Appendix A: Kernel Management


    Note the use of the fakeroot command. It isn''t actually part of the kernel-package
    system, but it is a general mechanism that allows some programs (including parts
    of the make -kpkg system) that normally rely on using root privileges to work
    by normal users. By avoiding the use of the root account ensure that no important
    system files would be damaged if the program amok. In reality, kernel-package
    probably can be considered reasonably trustworthy, so it is good practice to avoid
    logging on as root when there is a viable alternative.


    The --revision option is used to name kernel-image packages that you compile yourself
    differently from the official Debian packages built from the same kernel source.
    The full list of options accepted by the make -kpkg command is included in the
    files in the /usr/doc/kernel-package directory.


    The Linux kernel is a major piece of software, and compiling it several minutes
    even on a fast PC. After the kernel is built, the compiling goes back and compiles
    any kernel components you have modularized. Finally, the kernel, its modules,
    and some Debian installation scripts are all packaged together in a .deb file,
    which is placed in the parent directory containing your kernel source directory.
    If you do any programming and rely on the kernel-headers package, you should build
    a package that matches the kernel-image you just built. For example


    fakeroot /usr/sbin/make-kpkg --revision-mysystem.1.0 kernel_headers


    When you have built your kernel packages, you can install them (as root); using
    fakeroot won''t do in (this case) using dpkg:


    ```

    dpkg -i kernel-image-2.2.11_mysystem.1.0_i386.deb

    ```


    Except for the exact configuration used, this kernel-image package will be just
    like those found in the Debian archive. You will see the same installation scripts,
    which offer you the chance to create a new /etc/lilo.conf. If this is the first
    kernel you have built, you probably want to add an extra entry to /etc/lilo.conf,
    which gives you access to an old (and tested) kernel, just in case there is a
    serious problem with the configuration selected.'
