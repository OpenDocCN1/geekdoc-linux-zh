    # CONFIGURING THE LINUX LOADER


    On Intel systems, the Linux kernel is booted using a program called LILO. This
    program can be configured in a number of ways by editing the file /etc/lilo.conf
    using your favorite text editor (if you are not familiar with UNIX editors, consult
    Chapter 7, "A Tour of the Packages.\ You must then run the lilo command to commit
    the changes you have made. Since this is a critical system-management task, you
    must always be logged on the root account to edit /etc/lilo.conf or run lilo.


    The lilo.conf file contains one section of global options, followed by a section
    for each operating system that can be booted. Each operating system begins with
    a line image= (to boot a Linux kernel) or other= (to boot some other operating
    system). A full list of options can be found by typing lilo.conf


    if you are going to use your machine as a dual-boot Debian and Windows system,
    you should add the following lines at the beginning of the file:


    ```

    prompt

    timeout=100

    ```


    This tells LILO that it should always prompt to specify which operating system
    you want to boot but to boot the first operating system specified in the file
    if you do not reply within 10 seconds. (LILO measures time in tenths of a second).


    Now, to allow Windows to boot, you should add the following section to the end
    of the file:


    ```

    other=/dev/hda1

    table=/dev/hda

    label=windows

    ```


    This code assumes that Windows is installed on the first partition of the hard
    disk. It allows you to boot from this partition by typing windows at the LILO
    prompt. If you want Windows to be the default operating system, simply swap the
    Windows and Linux sections of the file around so that the Windows section comes
    first.


