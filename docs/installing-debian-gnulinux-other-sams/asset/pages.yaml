    to complete your Debian installation. The same program can be used at any time
    to remove packages from your system. As well as making it easy to install a wide
    range of GNU/Linux software, the Debian package system works to keep you in control
    of the software installed on your machine: It is easy to remove or upgrade packages
    at any time. The programs of the package management system also help you to avoid
    any problems relating to package dependencies.


    If you have been installing or upgrading your Debian system over a network, you
    will already be using the apt system to fetch package files. In future versions
    of Debian, you will use the same system to install packages which are supplied
    on CD: You can already try this out by using the apt-cdrom command to add Debian
    CDs to your apt source list. As well as working with dselect, the apt system can
    be used directly from the command line, and serves as the foundation for new package
    management front-ends, notably gnome-apt.


    Having read this chapter and completed your first Debian installation, you are
