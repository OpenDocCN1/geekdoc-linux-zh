  md: '# Installing from Source Code


    Much of the freedom of using free software comes from the fact that the original
    source code is always available. This is most appealing to users who have some
    programming experience and thus have the expertise to fix bugs or add new features.
    But even if you do not program yourself, it is sometimes useful to be able to
    build packages from the source.


    Some unusual programs are distributed only as source code. The same goes for experimental
    versions of programs—developers often don''t bother to build binary packages if
    there''s going to be a new release in a few days time. Building from source also
    tends to be more important for users of non-Intel architectures, since the majority
    of Linux developers have access only to PC-type machines.


    To build a package from source code, you need a selection of development tools
    installed—these are described in Chapter 7. Many packages also rely on a number
    of libraries. As well as the library packages themselves, you need the accompanying
    development files. These are normally provided in packages with names ending in
    -dev, and are also described in Chapter 7.


    Source code is generally distributed as tar.gz files—uncompress them somewhere
    using a command such as


    ```

    tar -xvf mypackage-1.00.tar.gz

    ```


    The source code almost always appears in a directory called mypackage or mypackage-1.00.
    The method for building source code will vary from package to package, but is
    normally documented in a file named README or INSTALL in the top-level directory
    of the package. A large portion of modern open source software comes with a GNU-style
    automatic configuration script—a file named configure in the toplevel directory.
    If this file is present, you can usually prepare the program for building by changing
    into the package''s top-level directory and then running the configure script:


    ```

    ./configure

    ```


    This script searches the system to ensure that all libraries and tools required
    by the build process are installed. If all goes well, you can start the build
    process itself by typing


    ```

    make

    ```


    For a major package, compilation could take some time. When it is complete, you
    can install the program in its normal place with the following command:


    ```

    su -c "make install"

    ```


    You will be prompted to enter the system''s root password. The program is used
    here to run a single command (enclosed between quotes after the -c option) with
    root privileges. In this case, root privileges are needed so that your new program
    can be installed in the main system package directories, which aren''t writable
    by normal users.'
