  md: '# 80 The First Steps in Debian


    Configuration file formats are documented in section 5 of the manual. Sometimes,
    the same keyword can have entries in more than one manual section. To look up
    loco.conf in section 5 of the manual, ignoring all other sections, you can type


    man 5 loco.conf


    There are nine sections to the manual, each with its own significance. The full
    list is shown:


    +   - Standard commands and applications, including all the everyday programs
    like ls1s and man.

    - System calls (the programmer''s interface to the Linux kernel).

    - Functions provided by programmers'' libraries.

    - Special files, which are mainly the device files in the /dev directory.

    - File formats, especially configuration files.

    - Games and entertainment programs.

    - Text markup systems, where the file format of the manual pages is described.

    - System administration programs.

    - Internal documentation of the Linux kernel. This is the one section that you
    won''t find in other UNIX systems. It will generally be of interest only if you
    want to write a new device driver or modify the kernel.


    # Setting Up a Graphical User Interface


    Unlike some other systems, Linux doesn''t make the windowed user interface a core
    part of the operating system. Instead, graphical functions are provided by a set
    of several application programs that run on top of the OS kernel like any other
    tool. This means there is no need to run a GUI on a machine that is going to sit
    in a corner working as a server. Additionally, it makes it possible to replace
    part or all of the GUI system with a new design without touching core OS functions.


    Currently, all popular UNIX GUIs are based on the X Window System, sometimes abbreviated
    to X11 or just X. The X Window System is a modular windowing environment. There
    are three classes of programs that together make up a complete system:


    +   - The X display server. This is a kind of device driver for your graphics
    card. It manages a display that acts as a canvas on which the rest of the system
    can draw windows and graphics. As a Linux user, you use one of the X servers developed
    by the XFree86 project.

    - The window manager. This is a special program that interacts with the X server
    and performs functions that create the look and feel of the systems—notably there
    a wide selection of window managers available. Some of these will look familiar
    to users of Windows or MacOS. Others, such as the popular Enlightenment, offer
    an easily configurable appearance. Some Enlightenment configurations look quite
    outlandish, although they may be something of an acquired taste. Unless otherwise
    stated, all of X applications in this book were taken with the popular GNU WindowMaker
    window manager running.'
