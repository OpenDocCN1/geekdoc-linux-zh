  md: '# CHAPTER 10


    # Exploring the X Window System


    This chapter takes a more detailed look at some of the key properties of the X
    Window System, used by Debian programs to provide a graphical user interface.
    Chapter 6, “The First Steps in Debian,” showed that the system could be divided
    into client and server programs, which can communicate over a network connection.
    This chapter explains some of the practical consequences of this division and
    also looks further at how your X desktop can be customized.


    # X on Display


    So far, the book has concentrated primarily on the case of a standalone workstation
    running an X server plus a selection of X client applications. But when you start
    an X client, you can tell it to connect to any display. According to X conventions,
    the display name has three parts: the machine name, the display number, and the
    screen number. Typical examples are follows:


    ```

    :0.0

    ```


    ```

    adzel:1.0

    term21.solar-spice.co.uk:0.0

    ```


    Note that the hostname (before the colon) can be blank—this is equivalent to specifying
    localhost. The display number represents an individual X server program. When
    running only a single X server, the display number is usually 0, but it is occasionally
    helpful to start an extra server, which will have a higher number. Finally, some
    X server implementations'
  merge: -1
