  md: '# And Finally—Welcome to the Community


    If you have worked through the previous 10 chapters of this book, you now should
    know how to install a basic Debian GNU/Linux system and to configure many of the
    most important subsystems. In this chapter, you look in a little more detail at
    the organizations of developers working on the distribution. There are also links
    to a number of Internet resources that will help you to get the most out of GNU/Linux
    operating systems.


    Remember that (with the exception of the installation and package-management systems)
    only a few of the Debian packages are really specific to Debian, or even to Linux
    systems. Indeed, many of the key programs were originally developed by users of
    other UNIX systems—in some cases, long before the Linux kernel was available.
    So, most packages have several people who are responsible for them. The original
    developers of a piece of software are called the upstream maintainers.


    If the program is still under active development, the upstream maintainer is normally
    responsible for deciding what new features to include, and for fixing bugs. But
    unless the upstream maintainer happens to be a Debian user, there will probably
    be someone else responsible for carrying out any modifications to the Debian version
    of the program, and for building the Debian package files. This whole process
    is called Debianization. When reporting bugs, the Debian maintainer should be
    your first point of contact. The name and address of the Debian maintainer is
    stored within the package file. You can check the maintainer, plus many other
    details of any installed package, using a command such as


    ```

    dpkg -s <packagename>

    ```'
  merge: -1
  pgno: 166
- img_proc: true
  md: '# 154 Chapter 11: And Finally—Welcome to the Community


    To a large extent, it is the group of Debian maintainers (several hundred of them)
    together determine what is included in the distribution. Coordination occurs primarily
    by discussion on various Internet mailing lists, backed up by public voting when
    this is considered necessary. There is also a document called the policy manual
    that has some guidelines for maintainers. This document itself was written in
    a fairly open way, and is revised from time to time.


    # Debian Resources


    The most important Debian-specific resource on the Internet is, of course, the
    Debian project home page at http://www.debian.org/.


    This page contains links to information about the project, plus a list of the
    most important news-flashes, including information about new releases and security
    alerts. If you want a little more information, a good place to start is the Debian
    Weekly News report at http://www.debian.org/News/weekly/


    This page has a regular summary of some of the most important stories from the
    various Debian discussion email lists. The weekly news archive is to look up if
    you want some hints about the timing of the next release, or need a list of packages
    that have recently been added to the unstable distribution.


    But if you really want to know what''s going on in the Debian community, or if
    you want to ask questions yourself, you need to consult the mailing lists. There
    are a wide range of mailing lists, from the very general (debian-user) to the
    specific (debian-laptops, for instance). There are a few lists to which subscription
    is restricted only to active Debian developers, but most are open to public subscription.


    There is a complete summary of available mailing lists, plus an interface for
    subscribing to them, or if you want to check out previous discussions on some
    topic, note that messages sent to most of the lists are automatically archived,
    so you can browse through them on the Web. If you have a specific question about
    your Debian system, it may be appropriate to post it to one of the mailing lists.
    But if you have subscribed to a list, you should either wait and read (lurk) for
    a few days to get a feel for the kind of messages that are posted, or read back
    through the archives.


