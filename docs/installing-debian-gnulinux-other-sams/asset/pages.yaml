  md: '114 Chapter 7: A Tour of the Packages


    Debian, in common with most UNIX-like systems, includes one special library, called
    the C library (libc). As the name suggests, this library is used by all programs
    written in the C language. It also serves as the most important layer of insulation
    between a normal application program and the Linux kernel. Even some programs
    written in languages other than C rely on at least some libc''s functionality.
    As a result, the libc implementation is one of the most important packages on
    your Debian system.


    Traditionally, Linux-based operating systems have used the Linux implementation.
    This version evolved from an early version of GNU libc. Linux libc went through
    various versions in the early days of Linux, but the only version you come today
    is version 5.


    Developers of the GNU project were also working on their libc implementation (glibc).
    With the release of glibc 2.0, this implementation was considered superior to
    the old Linux libc. So recent distributions, including Debian releases since 2.0,
    have included glibc. Just to be confusing, when libc2 is installed on a Linux-based
    system (it works with other kernels), it is sometimes called libc6. Indeed, the
    main Debian package containing the library is called libc6.


    For normal users, the differences between the two libc implementations are not
    too important, but from a programmer''s perspective, the libraries are not entirely
    compatible. In particular, there is no binary compatibility: Software that was
    compiled for one library will not run with the other. All the applications in
    a recent Debian system are compiled for glibc 2.0, but you might still find the
    occasional program that is only available in binary format for libc5 systems.
    In recognition of this fact, Debian ships a libc5 package in the oldlibs section.
    This should get any old applications you need to use and running.


    In addition to application packages, other library packages also depend on libc.
    This generally shouldn''t be an issue for most people, the package-naming system
    still contains some relics of the library-switch-over.


    Whenever libraries were converted to work with libc 2, a g was added to the name.
    For instance, the libc6 package (which contains the fundamental library for all
    X Window System clients) became libc6. Non-g versions of some of the key libraries
    can still be found in the oldlibs section. For general use, the rule is that if
    a g of a library package exists, use that. But note that for library packages
    added since the libc-switch-over, there will probably be only a libc 2 version,
    without the g.


    Debian release 2.2 introduces a slightly updated C library, libc 2.1. This is
    a less dramatic change, and shouldn''t cause any problems for most users. Moreover,
    the glibc developers have added mechanisms in version 2.1 so that applications
    compiled to work with this version will be compatible with all future releases,
    no matter what changes are made.'
