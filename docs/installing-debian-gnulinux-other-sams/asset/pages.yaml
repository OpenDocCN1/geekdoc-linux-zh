  md: '+   * fakeroot command

    * tcl and tk—the graphical kernel configuration interface


    Selected kernel releases are available from the Debian archives in packages with
    names beginning with kernel-source. Note that these are found alongside normal
    binary packages, not in the source sections of the archives. If you install one
    of these packages, it installs the kernel source as a .tar.gz file in the /usr/src
    directory. Alternatively, you can download the kernel source from the official
    site:


    http://www.kernel.org/


    The kernel.org sites are extensively mirrored, so use a nearby site if you can.
    You then need to unpack the kernel source. For example


    ```

    tar xf /usr/src/kernel-source-2.2.11.tar.gz

    ```


    It is traditional to place the Linux source code in the directory /usr/src/linux,
    but if you are using kernel-package you probably shouldn''t do. You don''t need
    to be logged on as root to compile a kernel, and there is no reason not to place
    the source in your home directory.


    # Configuring the Kernel


    If your kernel source was supplied as a Debian package, it will unpack in a directory
    called kernel-source-<version>. Kernel source from other sites is normally left
    in a directory called linux. In either case, change into it and type the following:


    ```

    make xconfig

    ```


    There will be a short delay, and then the windowed kernel configuration interface
    will start (Figure A.1).


    If you don''t want an X Window System interface, you can also try


    ```

    make menuconfig

    ```


    which provides a console interface similar to the Debian installer. If you think
    that even is excessive, you can still use the old text-only configuration system
    by typing the following:


    ```

    make config

    ```


    In any case, you should work systematically through the options. There is a huge
    number of options, but a large portion of them are just drivers for specific hardware
    devices—you should know straight away whether these apply to your computer. In
    doubt, try the online help: most of the important kernel options are well documented
    there. Some of the most vital options are also covered in the Kernel-HOWTO document.'
