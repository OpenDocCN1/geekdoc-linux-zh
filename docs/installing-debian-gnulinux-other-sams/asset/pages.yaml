  md: '# Taking the Direct Approach


    If you are using the new apt system as your package access method, there is a
    better method for upgrading to a new distribution version. This alternative method
    takes extra to ensure that essential packages are upgraded cleanly. Set up your
    apt source list (using the Access option in dselect, for instance), and then type


    ```

    apt-get update

    apt-get dist-upgrade

    ```


    Upgrading to a new distribution is one situation where it might be easier to use
    apt if you are going to be installing a new distribution from CD. To do this,
    make sure that the apt-cdrom package is installed, and read the manual page. You
    can then add CD-ROM to your set to the apt source list by inserting it and using
    the command.


    ```

    apt-cdrom add

    ```


    You can then use apt-get to upgrade your distribution just as described.


    # Taking the Direct Approach


    While the dselect tool is convenient for browsing the main Debian archives—and
    potentially other software archive arranged in the Debian-standard manner—not
    every program is available this way. Some programs that aren''t part of the standard
    Debian distribution can be downloaded from the program''s main Internet site as
    .deb files. Similarly, if you just want a single package from the Debian non-US
    servers, it can be easier to run a Web browser or FTP to download the file yourself
    rather than set up a package source properly. Package files can be installed by
    running dpkg directly (while logged in as root). For example


    ```

    dpkg -i my_package_1.00-1.deb

    ```


    -i option tells you what to install the package. The package manager determines
    if any dependencies are broken, but it is not able to automatically install any
    extra packages. If you see any package-dependency errors, run dselect and search
    for the required packages. Occasionally, you might see some large application
    that'' supplied as a number of .deb files, with some files depending on others.
    If so, the documentation gives some advice on the order of installation.


    Packages that have been installed in this way appear in the dselect listing under
    the Obsolete/local packages sections. This doesn''t mean that there is any problem
    with the package; it simply tells you that the package was not present in the
    main Debian archive, and therefore dselect is unable to compare the version number
    of the installed version with the latest available version in the archive. Even
    if you installed a package manually, you can still use dselect if you ever want
    to remove it.


    It is also possible to invoke the apt system from the command line. You have already
    seen how the apt-get command can be used to fetch all the files needed upgrade
    your installation to the latest Debian version. It is also possible to use the
    same program to install or upgrade a single package, for instance


    ```

    apt-get install freeeciv

    ```'
