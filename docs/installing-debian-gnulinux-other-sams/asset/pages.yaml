    ![](img/a0c73b609953db1cdc146c59ceca7cbb_178_0.png)


    Figure A.1


    The xconfig kernel configuration interface.


    For many of the kernel options (especially drivers), you are given three options:
    yes, no, or module. Answering yes builds that component as a standard part of
    the kernel. On the other hand, answering module (m) compiles a loadable kernel
    module, which will be automatically added to the running kernel when it is needed.
    Modular kernels can save a little memory if rarely used drivers are only loaded
    when they are needed, and are a good idea if you want to build a single kernel
    for use on several machines with different hardware configurations.


    Some users prefer the simplicity of a monolithic (no modules) kernel. If you modularize
    your kernel, bear in mind that those modules need to be loaded from disk once
    the kernel is running. So modularizing the hard disk controller drivers or the
    ext2 files is likely a bad idea. On the other hand, modular network drivers are
    normally safe. When you have finished, click on the Save and exit option. Finally,
    type the following:


    ```

    /usr/sbin/make-kpkg clean

    ```


    This command clears any temporary files in the kernel source directories. You
    are now ready to compile your first kernel.


    # ## Making a Kernel Package


    If you are using the kernel-package system, you can build the kernel (plus any
    modules) with a single command. For instance:


    ```

    fakeroot /usr/sbin/make-kpkg --revision=mysystem.1.0 kernel_image

    ```'
