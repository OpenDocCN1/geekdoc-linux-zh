  md: '# CHAPTER 9


    # Life On a Network


    The era of the computer as a standalone device is now past. Most offices are networked
    (and usually connected to the global Internet), while dial-up access is common
    for home users. Moreover, new technologies are making permanent Internet connections
    to the home increasingly practical, and many individuals with more than one computer
    are choosing to set up small private networks.


    There are some big advantages to attaching your computer to a network. Even in
    a home environment, you can make your machines far more useful by sharing resources.
    As a Debian user, you already have access to a wide selection of powerful server
    technology. So if you have two computers, you can start experimenting with networks
    just for the price of a couple of Ethernet cards.


    # Private Network Addresses


    First of all, you need to establish a few simple conventions for the names and
    IP addresses used in private networks. If you are connecting your machine to an
    existing network, ignore this section and set up your machine as the network administrator
    tells you. But if you are setting up your own network, you are the administrator,
    and you need to make certain decisions about the network.


    Back in Chapter 4, "A Basic Installation," I suggested that if you were planning
    to connect your machine to a private network (that is, a network that isn''t part
    of the Internet but nevertheless uses the Internet protocol family), you should
    give it an IP address of the form 192.168.1.xxx. This is a special reserved block
    of IP addresses that aren''t normally used by computers connected to the Internet,
    but which are otherwise safe for general use.'
  merge: -1
  pgno: 144
- img_proc: true
  md: '# 132 Chapter 2: Life On a Network


    Whenever you connect a new machine to your network, ensure that you allocate a
    unique IP address. This doesn''t apply just to Linux machines—any other computer
    can use the same network, so long as it has a unique address.


    Next, you should allocate names for all computers on the network. On the Internet,
    the DNS (a sophisticated distributed database) is used to convert between computer
    names and IP addresses, but this is overkill for a simple private network. Instead,
    each machine on the network should have an /etc/hosts file that gives names to
    all the machines present. For instance, each of the three machines on my own network
    has an /etc/hosts file that looks like this:


    ```

    # /etc/hosts for heatherdean.lan

    # Thomas Down''s personal network

    ```


    ```

    127.0.0.1      localhost

    192.168.1.1    firechild

    192.168.1.10   adzel

    192.168.1.11   sunspark

    ```


    Note that the first entry is the special address, localhost, which always refers
    to the local machine. This is present in the default /etc/hosts on a newly installed
    Debian system and is important for system function. Don''t delete it, or strange
    things happen. Also note that each machine''s /etc/hosts file contains an entry
    as well as for the other machines on the network. If you have Windows systems
    on the network, they can also use a file to map names and IP addresses. In this
    case, the Windows file is called C:\Windows\hosts.sam, but the file format is
    exactly the same.


    # Internet Servers


    If your computer is attached to a network, you will probably want to run some
    network servers. These can perform any function from serving Web pages to allowing
    remote logins. Some server programs—notably the Apache Web server—run permanently.
    This type of server is started by an init system script, as described in Chapter
    8,"Advanced Configuration." If you want to disable them, remove the link from
    your run level directories, or just use the subsystem script to stop the server.
    Many servers, such as telnet, the program that allows you to log on to a UNIX
    machine over a connection, are run only when needed. There is a special server
    called inetd that watches for incoming network connections and can start appropriate
    servers when required. Under Debian, inetd is started as part of the netbase subsystem.
    To change the behavior of inetd, edit /etc/inetd.conf, and then type


    ```

    /etc/init.d/netbase restart

    ```


    which kills and reloads the inetd daemon. If you offer a permanent network connection,
    you should check the list of services offered by inetd and comment out (disable)
    any you don''t want by adding a # character to the start of the relevant line.
    If in doubt, when you are setting up a standalone workstation, it is normally
    safe to disable'
  merge: -1
  pgno: 145
- img_proc: true
  md: 'almost all the services in /etc/inetd.conf. The one important exception is
    the SMTP

    service, which is important for the functioning of the computer''s email system,
    even if

    the doesn''t have a permanent network connection.


    # Logging On


    You have already seen two ways to log on to a Debian system: via a text console
    or

    an X Windows System display manager. But you can also log over a network. The

    standard way to connect from one UNIX-type computer to another is using the telnet

    command. For example


    ```

    telnet adzel

    ```


    If the remote machine is configured to accept remote logins (out-of-the-box Debian

    installations are normally), you will see a new login prompt. Entering your username

    and password will give you a shell prompt on the remote machine, and you can start

    working as normal.


    There are also Telnet clients for other types of computers. For instance, on a
    Windows

    machine you can select Run from the Start menu, and then enter a telnet command.

    The difference is that the Windows Telnet program runs in its own window and has
    to

    emulate a UNIX text console in the same way that xterm does when you run con-

    programs under the X Windows System. Unfortunately, it doesn''t do this very well.

    Simple command-line utilities run well, but I wouldn''t recommend running a full-

    screen program as a text editor.


    There are a number of alternative Windows Telnet programs available from shareware

    software archives, and some of these have much better console emulations. Note
    also

    t you find only the client side of the Telnet system on a Windows machine. These
    systems normally don''t support remote login themselves.


    To allow remote logins, your computer must be running the server side of the Telnet

    system using a program called telnetd (Telnet daemon). This program is started
    via

    inetd, and you can disable it by commenting out a line in the /etc/inetd.conf
    file.


    You might occasionally hear about login, an alternative program that allows you
    to log

    to a UNIX system. Unlike Telnet, this allows trusted users to log without entering

    a password. The ssh program, described in the section "Secure Remote Logins,\noff
    a more powerful and secure alternative to login.


    # Secure Remote Logins


    The main alternative to simple Telnet is ssh (for secure shell). This is available
    as a

    Debian package from the main non-U.S. server, plus its mirrors. The first benefit
    of ssh

    is that the connection is encrypted: Even if nobody sees what what you are typing
    (including your password). Moreover, if you are connecting to

    another machine by ssh, you may not even need to use a password at all.


    The ssh-keygen program generates a pair of authentication certificate files. You
    should

    generate a pair for every account you use regularly. The private half of this
    pair of files'
