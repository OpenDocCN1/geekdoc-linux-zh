  md: '# Introduction to Disks


    Like any UNIX system, Debian gives most hardware devices names. These names are
    not just meaningless labels: they actually represent special features that can
    be read and written to, although as a normal user you will probably have little
    to access these files. But it is useful to understand the names of the devices
    you will be dealing with throughout the installation process, and also how they
    are assigned.


    All modern PCs use some form of the ATA (IDE) interface to control the hard disks
    and CD-ROM devices. Each IDE controller can drive two devices, the master and
    the slave. If only one device is installed on the controller, it is always the
    master. The master device attached to the first controller is known to Linux systems
    as /dev/hda, and the slave is /dev/hdb. Standard PC-type motherboards almost always
    have two IDE controllers; on the second controller are /dev/hdc and /dev/hdd.
    A typical machine''s hard disk is /dev/sda and the CD-ROM drive is /dev/hdc or
    /dev/hde, depending on the cabling inside the machine.


    On normal desktop machines, SCSI hard disks are not relatively rare, but they
    are still used on high-specification servers. If you have fitted, Linux allocates
    names of the form /dev/sdx, where x is a letter allocated in the order that drives
    are detected when the system starts up. SCSI CD-ROM drives and CD writers have
    their own naming scheme: The first one detected is /dev/sd0.


    A hard disk can be split into several partitions, each of which can be formatted
    separately. This standard method of partitioning disks makes it possible for Linux
    and some other operating system to coexist peacefully on the same physical device.
    You sometimes encounter partitioning on a machine that only runs DOS or Windows.
    It is possible to have more than one DOS-formatted partition, in which case these
    are automatically detected and assigned letters. A single hard disk with two partitions
    would typically appear to be the logical drives C: and D.


    Linux, on the other hand, does not adopt the DOS concept of drive letters. Instead,
    partitions are explicitly mentioned, which makes them part of a single directory
    hierarchy called the virtual file system. However, each partition on a disk, irrespective
    of its format, has its own device name. This name consists of the name of the
    disk as a whole, followed by a number representing the specific partition.


    The traditional partitioning mechanism allows for up to four partitions on a disk,
    referred to as primary partitions. For the first IDE drive, these would be named
    /dev/sda1 to /dev/sda4. But if you want more than four partitions, one of the
    partitions can be a special extended partition. The extended partition has its
    own partition table, and can contain additional partitions. Linux numbers these
    from five upward, if you have fewer than four primary partitions. They are called
    logical partitions, although they are just as real as primary partitions. For
    most purposes there is no difference between them, and you can create whichever
    is most convenient.


    The one case where you will definitely need to use a primary partition is as the
    C: drive from which you will be booting a Windows system. In principle, it is
    possible to place a Debian installation entirely in logical partitions. There
    is, however, a slight complication'
  merge: -1
  pgno: 41
- img_proc: true
  md: '# Introduction to Disks


    when installing the Linux loader program on such a system. The Debian installer
    detects this case and handles it automatically. Nevertheless, many users still
    prefer to use a primary partition as the root partition used to boot Linux.


    # Types of Disk Partition


    Most operating systems use their own formats for disk partitions. For current
    Linux systems, the native format is the Second Extended file system (widely abbreviated
    as ext2). This format supports all the common features of modern UNIX file systems:
    the ability to use long names; the ability to associate user IDs and access permissions
    details with each file. It also gives good performance, both in terms of speed
    and use of space, for a wide variety of common applications.


    Other operating systems have their own formats. For instance, MS DOS and the pre-NT
    Windows systems use variants of the FAT file system. They all understand the old
    FAT16 format, which dates back to the early days of DOS. The FAT16 is considered
    very inefficient, especially with large disks. Remember that it was designed at
    a time when 20 megabytes seemed spacious! Windows 98 adds support for a newer,
    more efficient, format called FAT32, which is used by default on at least some
    pre-installed Windows 98 machines, especially when a large hard disk is supplied.
    FAT32 support was also present in the final release of Windows 95: Note that there
    are usually several ''maintenance'' releases for each Windows release, and some
    of these contain significant features.


    Recent Linux kernels, including the version support with Debian 2.1, can read
    both variants of FAT. Don''t worry about reports that only FAT16 file systems
    can be mounted; this is true only for older kernels.


    The FAT file systems were originally designed with filenames limited to an eight-character
    name and a three-character extension (8.3 format). As of Windows 95, an extension
    called VFAT support for longer filenames. When you are mounting a Windows 95 partition
    under Linux, it is worth specifying that VFAT is, since otherwise you will see
    the rather cryptic short form of any long filenames. There are more hints on Debian-Windows
    file exchange in Chapter 8, ''Advanced Configuration.''


    Windows can access FAT16 partitions, but more often use its own file system format,
    NTFS. There is experimental support for accessing NTFS volumes in recent Linux
    kernels, but it is currently not recommended for normal users. If you want a way
    of transferring data between Debian and NT installations on the same system, create
    a FAT partition that can be accessed by both systems. Other operating systems—including
    other UNIX-like systems—all have their own formats. An ever-increasing number
    of these are supported, at least in a limited read-only mode, by the latest versions
    of Linux.


    There is also one file system type that will never use hard disks, but that is
    important nonetheless: Virtually all CD-ROMs use the ISO 9660 file system, which
    is optimized exclusively for read operations. There is no way to write to an ISO
    9660 file system. If you want to create one—usually useful when you have a CD
    writer—use the mkisofs tool. This tool performs a normal directory of files and
    assembles them into a complete file system, which can then be written directly
    onto a CD.'
  merge: -1
