  md: '# Room to Breathe


    Before beginning a Debian installation, it''s worth spending some time thinking
    about how much disk space you are going to devote to Linux. The easy answer is
    “as much as you can,” and there are good reasons to commend this answer. Debian
    is not a small distribution—it is designed to provide a wide range of tools to
    suit all kinds of users. Even though it is possible to set up a Debian installation
    that uses very little space, there are a lot of non-essential packages that you''ll
    probably want to at least try. Therefore, it is worth leaving space to play with.


    As a practical guideline, you can take 500MB as a sensible minimum for a first
    Linux installation. This minimum enables you to have a graphical desktop environment
    and some applications, and leaves some room for trying out a selection of the
    more unusual packages, as well as for keeping your own files.


    The type of work that you do with Debian also has some effect. For the programmer,
    there are a huge range of development tools that you might want to consider, so
    extra space will come in handy. Similarly, if you are interested in serious image-manipulation
    work using tools such as The Gimp, disk space could vanish rapidly.


    If you are planning to build any software from source code, you will also need
    to allow a lot of space for the source code and intermediate files in the compilation
    process. The Linux 2.2 kernel source, newly unpacked, weighs in at around 60MB.
    Today, most people can make do with a pre-compiled kernel, but it is occasionally
    useful to build your own—see Appendix A, “Kernel Management.” Source code for
    application software can be big too. If you are interested in following the open-source
    development of Netscape''s web browser, you''ll need several hundred megabytes
    for your copy of the source code and build files.


    Note that the core GNU/Linux system actually takes only a small fraction of the
    space recommended for a full Debian installation. A machine that''s going to sit
    in the corner of an office and act as a server often needs fewer packages installed
    and there (depending on how many files you are expecting to store on it), may
    need less disk space.


    But if you''re new to Linux, it''s best to start with a comprehensive installation
    plenty of disk space to spare. Once you''re happy using the dselect tool (see
    Chapter 5, “Making Your Selection”) and familiar with the main Debian packages
    you need, you''ll have no trouble setting up more installations that meet your
    specific requirements.


    # Swap Space


    Like any other modern operating system, the memory management system in the Linux
    kernel can move data out to disk when physical RAM is running short. This process
    is called swapping. It also goes by the virtual memory, although this is not entirely
    correct, since the swapping mechanism is only one aspect of the kernel''s complex
    virtual memory subsystem.


    Windows normally uses a regular file for its swap space. This file is automatically
    and many users aren''t even aware that it exists. Linux can also swap to a file,
    but it is more common to use a dedicated hard disk partition—the whole partition
    is treated


    ![](img/a0c73b609953db1cdc146c59ceca7cbb_45_0.png)'
  merge: -1
  pgno: 45
- img_proc: true
  md: 'as though it is a single file. This gives a performance advantage, since that
    swapped data can be sent straight to the hard disk rather than having to pass
    through the file system code first. Debian prompts you to activate a swap partition
    during the standard install procedure, and for your first installation, you should
    always do this. If, later on, you really want to experiment with unusual swap
    configurations, read the manual pages for the mkswap and swapon commands.


    If there''s any chance that you''re likely to memory-intensive work, it''s worth
    allowing a reasonable amount of swap space—modern programs tend to work on the
    assumption that they will never run out of memory. The Linux 2.0 kernel, used
    by Debian versions up to 2.1, limits partitions to a maximum size of 128MB. If
    you have a large disk and limited memory, it may be worth creating a swap partition
    of that size. The Linux 2.2 kernel, and future versions of Debian, remove that
    limitation. If you expect to compile large programs, or deal with huge data files,
    you might want to create an even bigger swap partition.


    # The Virtual File System


    Once a UNIX-based computer is up and running, you do not directly access your
    hard partitions by their names. Instead, all your files, irrespective of the physical
    device they are stored on, appear in a single virtual file system.


    When the kernel first starts up, it identifies one partition as the root of the
    file system. The top level directory on this partition becomes the directory /,
    the root of the whole hierarchy. But it is then possible to add extra partitions
    by a process called mounting, whereby a (normally empty) directory, called the
    mount point, is replaced by the top level directory from a new partition. Often,
    several file systems are mounted automatically at boot time, but it is also possible
    to mount more at any time.


    This is true for removable media such as floppy disks and CD-ROMs. It is common
    to create a directory—often called /v—that contains convenient mount points for
    any removable media you use.


    As a simple example: to mount a DOS FAT-format disk in the first floppy drive
    (/dev/fd0) and make its contents appear in the directory /v/floppy, you use the
    following command:


    ```

    mount -t vfat /dev/fd0 /v/floppy

    ```


    If you use floppies often, don''t worry about the length of this command—methods
    for simplifying the mounting process are described in Chapter 8. Once you are
    finished with a file system you have manually mounted, you can reverse the process
    with a command such as


    ```

    mount /v/floppy

    ```


    # The Debian Directory Hierarchy


    On Windows systems, it is normal to create personal files and directories in the
    root directory of a hard disk partition. There is just one top-level directory
    (normally C:\Windows) that contains all the system files. UNIX systems, on the
    other hand, have'
