  pgno: 105
- img_proc: true
  md: '# Ownership and Permissions 93


    which in this case would be called /home/thomas. New home directories are created
    as a copy of the skeleton directory, /etc/skel. If you are setting up a large
    number of accounts, this mechanism can be useful for providing standard basic
    configuration files for all users.


    When the adduser command is invoked with a second argument, it adds an existing
    user to the specified group. For instance, you can allow an account to control
    dial-up Internet access using this command:


    ```

    adduser thomas dip

    ```


    There is also a variety of commands for changing details of user accounts. To
    change the password on an account, use the passwd command. If a normal user forgets
    his her password, you can log on using the root account and then type


    ```

    passwd <username>

    ```


    This allows you to forcibly change the password of the account. If you forget
    the root password, you are in trouble—to get a root shell you will need to boot
    from a rescue disk. But try to remember the password. If you are worried about
    forgetting it, write it down and keep it in a safe place. But remember, anyone
    who has the root password will have complete access to any part of the system.


    # File Ownership and Permissions


    Most file systems provide a degree of access control—DOS allows you to protect
    files from overwriting and deleting. But because UNIX systems are designed for
    multiuser operation, the access control systems are much more sophisticated. To
    see ownership and access control data for your files, use the -l option for the
    ls command. This option provides output looking something like this:


    ```

    -rw-r--r-- 1 thomas  thomas    146689 Jul 10 11:07 may.jpg

    ```


    The first column gives the file''s access restrictions called the mode in UNIX
    terminology. Then you see the owning user, the owning group, the size of the file
    (in bytes), and the time of last modification. Ownership of the file can be changed
    using the chown command. For example


    ```

    chown david.coders may.jpg

    ```


    This command sets the access mode to have owner david and group coders.


    The file''s access consists of three parts. The first part applies to the file''s
    owner, the second part applies to users who don''t own the file but are members
    of the group that owns the file, and the third part applies to all other users.
    For each type of user, there are three possible kinds of access: read, write,
    and execute . The modes of a file are changed using the chmod command. For instance,
    to allow other group members to read and execute a file, use:


    ```

    chmod g+x myfile

    ```'
