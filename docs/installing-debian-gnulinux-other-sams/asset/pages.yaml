  md: '# 38 Chapter 1: Getting Ready—Disk Splitting


    If you want to try this program, look at the supplier''s Web site:

    http://www.powerquest.com/


    # Creating New Partitions


    There are several methods of creating Linux partitions. If you have used the PartitionMagic
    program to resize a DOS partition, you can simply go on and create one or more
    Linux ext2 partitions, plus a Linux swap partition, and ignore the partitioning
    stage in the normal Debian installation process. Most Debian users will use the
    Linux-based partitioning tool, cfdisk. You will get a chance to launch this program
    during the normal installation procedure, as described in Chapter 4. It is also
    possible to run the tool at any time running Linux—simply log on as the root user
    and type cfdisk at the command prompt.


    # NOTE


    There is another Linux disk-partitioning tool, confusing called fdisk. This is
    also supplied with Debian, and it is the default partitioning tool used by some
    other Linux distributions. For typical users, it provides essentially the same
    functionality as cfdisk, but presents a less friendly user interface.


    # Using cfdisk


    Many new users find manipulating a partition table a worrisome prospect. The cfdisk
    main screen should really carry a message that says “don’t panic.” When you add
    or delete partitions, you are really altering a temporary copy of the partition
    table. These edits are committed back to disk only when you select the Write option.
    If you make a mistake, just Quit and start.


    When you start cfdisk, you will see a screen similar to the one shown in Figure
    3.4. This screen shows the initial state of the partition table of a machine supplied
    with two partitions (drives C: and D under Windows). Use the up and down arrow
    keys to select which partition you are working on, and use the left and right
    arrows to select options from the menu at the bottom of the screen. The size of
    each partition is initially shown in megabytes. Select the Unit option (or just
    press u) if you want to determine whether your root partition lies below the 1024
    cylinder boundary.


    If there isn''t already some unspaced space (in the sense of not already being
    part of a formatted partition) on the disk, the first step is to delete one of
    the existing partitions. In Figure 3.5, the partition hides (the D: drive under
    Windows) has been deleted. Be sure that any data you want to keep has been moved
    elsewhere before you do this.


    Once part of the disk has been freed, you can start creating Linux partitions
    (see Figure 3.6). The new menu will ask you what you want to create a physical
    or logical partition—remember that you can only create four physical partitions,
    or three partitions plus some logical partitions. It will then prompt you for
    the size of the new partition. When you create a partition, you will normally
    enter the size to the nearest whole number of cylinders. But, in order to maximize
    performance, the program rounds this. Don''t worry if the actual size of the new
    partition is slightly different than the size you entered.'
