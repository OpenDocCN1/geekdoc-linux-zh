  md: '# The Base System


    The linux kernel, and many of the basic tools that run on top of it, are relatively
    undeveloped in hardware terms. This isn''t to say that they can take advantage
    of top of the line hardware—if you''re running several big graphical applications,
    you''ll certainly appreciate a fast processor and plenty of memory. But conversely,
    if you can live with a windowed desktop environment, it''s possible to use old
    hardware as a low-spec server (by sharing a few files and a printer in the home
    or a small office, for instance) or as a client machine on a network.


    Old machines are also useful when you want to try Linux without touching your
    current system. Intel i486-based machines, or even early Pentium systems, can
    often be obtained very cheaply. While you shouldn''t expect too much from such
    a machine, it will provide an excellent opportunity to experiment with Linux and
    all its associated tools—especially if you want to learn the most from the powerful
    UNIX command-line interface.


    At the other end of the spectrum, many high-end machines—especially those sold
    for the server market—are now supplied with two or more processors. Support for
    multiprocessor motherboards was added in kernel 2.0, but has greatly improved
    in the new 2.2 series. Debian 2.1 users will probably need to recompile their
    kernel (see Appendix A "Kernel Management")—and you may simply wish to upgrade
    to the latest kernel.


    As of the Linux 2.2 kernel included with the potato release of Debian, multiprocessor
    support will be switched on by default, and the system should automatically detect
    and take advantage of all your processors. Note, however, that the kernel packages
    are considered to be too critical to be replaced automatically when you upgrade
    an existing Debian installation: see Appendix A for information about kernel upgrades.
    You can check that the kernel is correctly detecting all your processors using
    the command /proc/cpuinfo.


    There are also a number of manufacturers that have made clones of the Intel Pentium
    series of processors. These work fine under Linux, and can offer better performance
    for a given price, especially for low-end systems. As a rule of thumb, clone processors
    from manufacturers such as AMD and Cyrix tends to approximately match the corresponding
    Intel devices for performance when running integer instructions (simple operations
    where the mathematical engine of the processor is working only with whole numbers).
    But they can suffer when executing the more complex floating point instructions.
    Traditionally, the users who are most likely to notice floating point performance
    are those who work with complex scientific application, and players of games who
    use 3D graphics. Clone processors are generally not suitable for use in multiprocessor
    systems.


    The exception to this is the Athlon processor produced by AMD. It is different
    from any of the previous clone designs, since it uses its own motherboard design—actually
    related to the motherboards used for Alpha processors—rather than a Pentium'
