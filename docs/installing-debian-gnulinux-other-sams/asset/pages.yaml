  md: '# The Virtual File System 35


    While personal work files almost always belong in your home directory, it is useful
    to create new top-level directories. In particular, you will probably want to
    create mount points for accessing your CD-ROM and floppy disk drives, and perhaps
    your Windows partition. This process is discussed further in Chapter 8.


    # Arranging Linux Partitions


    A typical UNIX system for personal use will normally follow a partition structure
    similar to the one shown in Figure 3.2. The partitioning scheme is optional—in
    many situations it is entirely possible to hold the whole directory structure
    on a single partition. This is often a reasonable option for the first-time Linux
    user. Nevertheless, there are good reasons for using multiple partitions.


    The first reason you might need to split your disk is to overcome the 1024 cylinder
    limitation when installing on a large disk. It is only necessary to have one partition
    (almost the root partition) lying below the 1024 cylinder boundary. Other partitions
    that make up your complete file system can be elsewhere on the disk, or on a different
    device.


    The other—and more traditional—reason for multiple partitions is safety. In particular,
    having user home directories on a separate partition allows you to be sure they
    won''t be touched during an upgrade. It is possible to perform a complete new
    installation of Debian, or some other Linux distribution, and then remount your
    home partition safe in the knowledge that all personal files will still be. For
    a personal machine, you may only have one user directory under /home, or perhaps
    a handful for family or friends. For server installations, there are often hundreds
    of users to deal with. In this case, /home will probably have a very hard disk,
    or perhaps an large disk array,


    The same goes if you install a lot of packages that aren''t part of the standard
    Debian distribution. These customarily go in directories in the /usr/local hierarchy—which
    is never touched by normal Debian packages—and some users choose to mount a separate
    partition.


    In conclusion, it is possible to use a single partition (plus the standard swap
    partition, of course). If you are a first-time Linux user and are unsure about
    how you''re going to use the system, this configuration is often the simplest
    one. This configuration also prevents you from running out of space on one partition
    while having plenty to spare on another.


    If you are serious about Debian, and have a reasonable amount of disk space to
    spare, it is worth creating a separate /home partition. Remember that this will
    only contain your personal files: All the program files will be elsewhere, unless
    you routinely with large files (images, for instance), you will probably want
    a /home partition which is larger than your main partition. For the experienced
    user, using just a small root partition on a separate partition is also a good
    move. This leaves only system-configuration data and essential tools on the root
    partition, and it makes easier to repair the system if a disk partition is corrupted—due
    to a power failure while writing to a disk, for instance.'
