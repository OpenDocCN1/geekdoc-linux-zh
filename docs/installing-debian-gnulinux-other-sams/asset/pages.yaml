  md: '# Chapter 5: Making Your Selection


    Note that apt-get cannot be invoked with package names: You cannot supply the
    complete filename of a package file. This command searches apt source list (assuming
    that you have set one up) and locates the most recent package answering the name
    of ''freeciv''. This will be installed, together with any other packages which
    are needed to satisfy its dependencies. Some users prefer to run apt-get in this
    way instead of, or as a complement to, dselect.


    # Installing Non-Debian Software


    Virtually all of the most popular Linux software is either included in the standard
    Debian distribution or available independently as a .deb package. You may want
    to install a program for which no .deb file is available. If so, you might find
    a package in the alternative RPM package format, originally designed by Red Hat
    for its own distribution, and now adopted by various distributions.


    One approach is to simply use the normal RPM tool (available as a standard Debian
    package) to install .rpm files. Unfortunately, RPM uses its own database for storing
    information on installed packages and managing dependencies, so by installing
    RPMs in this way, you are losing out on many of the benefits of package management.
    A better approach is to use the alien tool to convert the RPMs into Debian packages,
    which can then be installed as normal using dpkg. The alien tool is fully documented
    on its manual page, but generally you just use a command such as alien --deb mypackage-1.00.


    Sometimes you will also find source code supplied as a rpm file—these are often
    called SRPMS. Since the code will always be available as a TAR archive, these
    are rarely of import to Debian users. Debian source code distributions do not
    use a special package format. Instead, the source code is supplied as a standard
    .tar.gz file. This is normally accompanied by a small text file with the extension
    .dsc.


    # Tar Archives


    The other common format used for distributing Linux software is the tar archive
    file. These files are usually compressed using the gzip tool (and thus give the
    suffix .tar.gz, occasionally .tgz). Compressed tar files are the UNIX''s equivalent
    of ZIP archives. These can contain either ready-to-use binary software or uncompiled
    source code for a program. Determine which you''re getting before you download!


    These archives are extracted using commands such as


    ```

    tar -xvf myprogram.tar.gz

    ```


    See the manual page for tar for an explanation of the options used here. Note
    that, unlike special package files, these archives don''t come with any information
    to tell the system where the files they contain should be installed—look for installation
    instructions for this. Sometimes you need to uncompress the archive in a specific
    directory. In other cases, especially when dealing with large commercial packages,
    you can uncompress the archive in a temporary location and then run a small program
    that installs all the other files in their proper places.'
