- img_proc: true
  md: '# Advanced Configuration


    This chapter covers some of the more advanced configuration mechanisms for your
    Debian installation. First, it considers the init system, responsible for setting
    up the system immediately after booting. It also contains instructions for configuring
    two of the most important subsystems of a Debian installation: dial-up networking
    and the email transport system. Finally, it revisits the mount command and considers
    methods for managing UNIX file systems. By the time you have finished this chapter,
    you should be able to configure a Debian workstation for use in a wide variety
    of situations.


    If you are still looking for more information, especially about setting up a Debian-based
    server machine, the Linux Documentation Project HOWs can be a good place to start.
    There are also a number of books available, covering both UNIX administration
    and specific subjects such as networking. Finally, Chapter 11, “And Finally—Welcome
    to the Community, describes some of the most important Internet resources provided
    by the Linux community. There may be a Web site that answers your question or
    failing that, a mailing list where you can ask the experts.


    # The Initialization Scripts


    When you boot a Debian machine, the first thing you see is a number of messages
    produced by the kernel as it starts up. But then a second phase of the boot process
    begins. The kernel runs a special program called init, which is responsible for
    setting up the system so it''s ready for use. This includes mounting any disk
    partitions and initializing the networking system.


    The init system also starts a number of background processes that are required
    for the normal operation of a UNIX system. These are historically called daemons,
    a contraction of disk'
  merge: -1
  pgno: 130
- img_proc: true
  md: '# 118 Chapter 9 Advanced Configuration


    access monitors. In modern UNIX-like systems, daemons perform many functions,
    running from Internet services to the scheduling of regular system-housekeeping
    jobs.


    For reference, the init program used by Debian is modeled on the System V UNIX
    systems. A similar arrangement is used by a number of other Linux distributions,
    albeit with a slightly different structure of configuration files. BSD UNIX systems
    use a different init design, and this has also been adopted by several common
    Linux distributions.


    Debian''s init system is based around the concept of a subsystem—a specific part
    of the operating system that can be started and stopped independently of the rest.
    A typical example might be a Web server, which is normally started at boot time
    and continues running until the machine shuts down. There is no reason why the
    Web server couldn''t be stopped or started at any other time. You might, instance,
    want to restart it in order to force it to re-read its configuration files.


    There are also some lower level subsystems: for instance, the mountall subsystem
    causes the machine to mount any disk partitions you configured during the install
    procedure (excluding the root partition, which is automatically mounted when the
    kernel boots). A subsystem is defined by a simple program, normally written in
    UNIX shell script language (see the manual page for bash, the standard shell on
    GNU/Linux systems). These programs are stored in the /directory /etc/init.d. You
    can run these programs yourself (as root) to manually start, stop, or restart
    the subsystem. For instance, this command


    ```

    /etc/init.d/cron stop

    ```


    will spawn the cron, a background process that allows users to schedule processes
    to run at specific times. This is the program that runs housekeeping tasks such
    as regular truncation of the system log files. Note that the file /etc/init.d/cron
    isn''t the cron itself—it is just a small script that can start and stop cron.
    If you install a Debian package that you want to run automatically at boot time,
    it will probably include its own subsystem script.


    > If you ever want to write your own subsystem script (useful if you have a non-Debian
    program that you want to run as a standard background job), the file /etc/init.d/skeleton
    is a good starting point.


    When init starts, it doesn''t automatically start every subsystem defined in /etc/init.d.
    Instead, it only runs subsystems appropriate for a particular run level. Run levels
    are represented by a number, normally between 1 and 5, and you can specify that
    the machine boot to a particular level by entering a number at the LILO boot prompt:
    Debian init defaults to run level 2 (this option, plus various other init configuration
    options, is defined in /etc/init.d). For most users, run level 2 is sufficient.'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# The Initialization Scripts 119


    Occasion, it may be useful to define some alternative configuration for the machine.
    For instance, if you have configured an X Window display manager as described
    in Chapter 6, "The First Steps in Debian," you might like to configure an extra
    run level without the X Window System, so you still have the option of starting
    the machine in simple text console.


    Another case occurs when you have a computer that is sometimes attached to a network,
    but that may also be used as a standalone workstation. In this case, you may choose
    to set an alternative run level (level 3, for instance) so that any network systems
    that normally use are not started. If you use network file systems like Chapter
    10, "Exploring the X Window System," you will also want to ensure that the /etc/init.d
    scripts are not started in the standalone run level. If you occasionally use a
    specialist network server database server as mysql, for instance, you might want
    to create an extra run level to this server.


    The subsystems that should be started in a particular run level are defined by
    the contents of a directory called /etc/rc<number>.d. For instance, /etc/rc2.d
    defines the default run level. A run level directory contains symbolic links to
    some or all of the scripts in /etc/init.d. The default run level directory might
    contain a link called S89cron, which points to the subsystem for the cron daemon.
    The S indicates that the subsystem should be started in this run level. Low numbers
    represent critical subsystems, which must be started early in the boot process,
    while higher numbers represent server programs that can be started later in the
    boot sequence. To prevent cron from being started in a particular run level, you
    can just delete the link, as follows:


    /etc/rc2.d/S89cron


    Note that this is just deleting a link to the subsystem file, not the subsystem
    itself. If later on, you decide that you want to restore it, you must create a
    new link:


    ln -s /init/cron /etc/rc2.d/S89cron


    Run level directories can also contain symbolic links with names beginning with
    K. These are ignored when the system boots, but if you change the run level of
    a running system, subsystems specified by K links are stopped. The most common
    example of this occurs when you halt or reboot the machine using the shutdown
    command. What this really does is switch to the special run level 0 or 6, respectively.
    If you look in the appropriate run level directories, you will see that all the
    subsystems are stopped, and then some final shutdown operations are performed.


    It is also possible to switch a running system to a new run level using the telinit
    command, but this is useful only if you have manually set up one or more run levels
    with a different selection of subsystems.'
  merge: -1
  pgno: 132
- img_proc: true
  md: '# SYMBOLIC LINKS


    Along with regular files and directories, UNIX file systems can contain another
    kind of object, called a symbolic link. When a program accesses the symbolic link,
    it actually sees the linked file. You can read and write to a symbolic link just
    like a regular file. However, deleting the link removes the link itself—the file
    represents remains untouched.


    Symbolic links (sometimes called symlinks or soft links) are created using the
    ln -s command. For instance


    ```

    ln -s test/links/mylink ../realfile

    ```


    This creates a link called mylink in the directory test/links. The link connects
    to the file test/realfile. The destination of a link can be specified as an absolute
    path (starting with a /) or a relative path to the directory containing the link,
    in this example. When you specify a relative path, .. indicates the parent directory.
    Symbolic links are a powerful UNIX feature, but careful when creating them it
    is, for instance, entirely possible to link to a parent directory, thus creating
    a potentially confusing circular reference.


    You may occasionally hear about hard links. This is another mechanism whereby
    more than one filename can represent the same file. Hard links are important to
    the internal working of UNIX file systems, but you will not normally need to create
    them.


    There is one more run level that you may sometimes hear about: level S. commonly
    referred to as single-user mode. In this mode, none of the subsystems are running.
    Instead, the kernel is up and running, the system runs a single root shell. It
    is not possible to log on as any other user. The normal way to enter single user
    mode is to boot the machine with the word single on the LILO command line.


    ```

    linux system

    ```


    On a modern system, you will never want to use single-user mode for normal operation.
    It is, however, sometimes used by expert users for major administrative work—especially
    system recovery after serious corruption. If you are having trouble booting your
    Debian installation in one of the normal run levels (sometimes called multiuser
    mode), try a single-user boot in order to recover data.


    # Configuring a PPP Network Connection


    If you have a direct connection to the Internet (usually via an office or academic
    network), you should already have set it up during the installation process. If
    not, the standard way to connect is to dial up to an Internet service provider
    (ISP) using a modem.'
  merge: -1
  pgno: 133
- img_proc: true
  md: 'At the moment, there aren''t many ISPs that specifically advertise support
    for Linux users (although if you find one, you should consider supporting it).
    But the PPP technology used for dial-up connections is sufficiently standardized.
    You should, therefore, be able to easily connect your machine to most ISPs.


    Before you start, you should register with an ISP and make sure you know the following-pieces
    of information:


    +   * The name of your account

    * Your dial-up password

    * The telephone number of your ISP''s nearest access point


    If available, it is also useful to know the IP address of the provider''s DNS
    (domain name service server). This address will consist of four numbers separated
    by periods. Later, you will also want the names of your ISP''s mail server computers.


    The first step toward connecting your machine is installing the ppp package, which
    allows you to establish ppp connections. You will also want the pppconfig package,
    which provides a simple method for configuring your connection. The pppconfig
    utility is a character-based interactive tool similar to the main Debian installation
    tool (see Figure 8.1).


    ![](img/a0c73b609953db1cdc146c59ceca7cbb_134_0.png)


    Figure 8.1


    The pppconfig program sets up new dial-up network configurations.'
  merge: -1
  pgno: 134
- img_proc: true
  md: '# 122 Chapter 5: Advanced Configuration


    The first time you run pppconfig may be prompted for the IP address of a DNS server.
    If you don''t know, enter 127.0.0.1 here, and then consult the next section, which
    describes the DNS system in more detail.


    You will then have a chance to create an ISP information file. If you use only
    a single ISP account, accept the default name provider. But if you have several
    accounts or a single account with several different phone numbers, you should
    give each configuration a meaningful name. You will then be asked for the password
    and username of your ISP account. There are several methods offered for logging
    on to the ISP. Virtually every modern ISP supports the PPP method, unless the
    documentation says otherwise, opt for that.


    Next, you will need to specify the serial device to which your modem is connected.
    The simplest case is an external modem. In this case, the device is /dev/tty0
    or /dev/tty1, which corresponds to the DOS devices COM1 and COM2 respectively.
    Internal modems, which usually appear as COM3 or COM4 under DOS, are /dev/tty2
    or /dev/tty3. But it is possible that you will have to use the serialcommand to
    configure the serial driver correctly, as described in Chapter 2. "Getting Ready—Hardware."
    If you are unsure about the port on which your modem is installed, the wdial package
    can normally detect it for you.


    Most of the remaining options offered by the pppconfig program are for expert
    users, and the default values should be fine for any machine in the PPP link is
    the main connection to the Internet. Finally, you can enter the phone number of
    the ISP''s access point and whether to use pulse or tone dialing—modern phone
    networks use tones.


    When you have finished, you are given the chance to check all your settings before
    saving them. If you find afterward that you have made a mistake, or you want to
    update the configuration, you have two choices. You can re-run pppconfig and create
    a new configuration with the same name as your old one. Or, if you are reasonably
    confident with text-based configuration files, you can manually edit the files
    in the /etc/ppp/peers directory. All the options used in PPP configuration files
    are described in the pppd manual page.


    # Configuring Name Services


    Before you can use your dial-up connection properly, you need some method of connecting
    your computer to the Internet domain name server, a database that maps Internet
    hostnames to the numerical IP addresses used for low level network communications.
    The simplest solution is to find the IP address of a DNS server machine provided
    by your ISP. You can configure your computer to do this by editing /etc/resolv.conf
    to include a line such as


    nameserver 243.1.32.180


    obviously substituting the IP address (four numbers) of your DNS server. Some
    ISPs offer two DNS servers, in which case you can add a second nameserver line.
    The second server is used automatically if the first one fails.


    ![](img/a0c73b609953db1cdc146c59ceca7cbb_135_0.png)'
  merge: -1
  pgno: 135
- img_proc: true
  md: 'If you can''t find a suitable DNS server address, you have another option:
    Make your Debian system an independent part of the DNS network. This is also a
    sensible option when you have accounts with several different ISPs and switch
    regularly between them. To make the Debian system part of the DNS network, you
    need to install the standard nameserver package, bind, and then make your machine
    refer to itself for DNS resolution. For example


    ```

    nameserver 127.0.0.1

    ```


    # NOTE


    127.0.0.1 is a special IP address that always refers to the local host.


    The bind program has its own subsystem script and will normally start automatically
    when the system boots. This can, however, cause some problems. If a program performs
    a DNS lookup when the machine is not connected to the Internet, it can hang for
    several minutes before realizing the DNS system isn''t going to respond. Netscape
    Web browser is a particularly bad offender. The solution is to run bind only when
    the PPP connection is active.


    First, remove the bind symbolic link from /etc/rc2.d (and the run-level directory
    for any other levels that you regularly use). Now at the directory /etc/ppp/ip-up.
    All executable files in this directory are run, in alphabetical order, when a
    PPP connection is activated. You can start bind using a simple shell script program
    for example


    ```

    # /bin/sh

    /etc/init.d/bind start

    ```


    There may be other scripts already present in the ip-up directory that expect
    a working DNS system—for instance, there will usually be a file that starts the
    delivery of any outgoing email messages. To ensure that bind is started first,
    you should give your script a name such as oobind. You should then mark it as
    a program file by setting the execute mode on the file:


    ```

    chmod +x /etc/ppp/ip-up/oobind

    ```


    To stop bind again when you deactivate the connection, you should place a similar
    script in /etc/init.d/ip-down:


    ```

    # /bin/sh

    /etc/init.d/bind stop

    ```


    With these scripts in place, you should never need to worry about DNS again.


    # Activating the Connection


    Once you have your configuration file set up, you can activate the connection
    using the pon command. The general form to activate any configuration you have
    set up is as:


    ```

    pon <provider_name>

    ```'
  merge: -1
  pgno: 136
- img_proc: true
  md: '# 124 Chapter 8 Advanced Configuration


    If you set up a configuration using the default name, provider, activate it by
    issuing the pon command without any additional arguments.


    If your modem is an audio-monitoring facility, you will hear dialing and connecting.
    There is a delay of a few seconds while the PPP systems at each end of the connection
    exchange details. Once this process is complete, your machine is fully connected
    to the Internet, and you can use network programs as usual. Try running a Web
    browser as Netscape or Lynx to test the connection. If your ISP offers a Web cache
    server, you may want to configure your browser to use it caching proxy server
    that stores copies of frequently accessed Web pages and can speed up your browsing.
    It is worth configuring your browser to take advantage of this service if it is
    available.


    If there is a problem establishing the connection, error messages are written
    to the file /var/log/ppp.log. You can either view this file directly or use the
    log command to view the few lines added to the file.


    By default, only the root account can activate connections. Once your PPP system
    is set up and working properly, you can allow normal users to activate connections
    by adding users to the dip (dial-Internet protocols) group. The easiest way to
    do this is using the adduser command, as follows:


    adduser emily dip


    When you have finished using a connection, just type poff to deactivate the PPP
    system and drop the connection.


    # Other Home Internet Solutions


    The traditional alternative to standard dial-up connections for home and small
    office users is ISDN, a kind of digital phone line that offers faster dial-up
    connections. A number of ISDN cards are supported by recent Linux kernels—take
    a look at the isdn4linux FAQ, located at http://www.isdn4linux.de/.


    In use, ISDN connection is similar to a conventional dial-up link. You use the
    PPP protocol to establish a connection to your ISP (make sure that your provider
    supportsDN—many do, but it is not universal in some areas) and, once configured,
    you will use the ISDN connection in the same way.


    A newer solution is digital subscriber loop (XDSL) technology. This technology
    provides a permanent Internet connection, and setting up an XDSL connection is
    much more like setting up an Ethernet connection. Reports are that xDSL connections
    work fine with Linux systems, but many providers currently refuse to support Linux
    users. If you are interested, talk to your local providers, and then try a Web
    search—you may find some pages containing the personal experiences of local users.


    ![](img/a0c73b609953db1cdc146c59ceca7cbb_137_0.png)'
  merge: -1
  pgno: 137
- img_proc: true
  md: '# Handling Electronic Mail


    You have already seen a number of the GNU/Linux compatible email clients (sometimes-called
    Mail User Agents, or MUAs). But to use email, you also need another program—the
    Mail Transfer Agent (MTA). This program is responsible for filing each incoming
    message into the inbox of the appropriate user, and for managing a queue of outgoing
    messages.


    Internet is sent using the Simple Mail Transfer Protocol (SMTP). This protocol
    defines how a program can connect to another machine on the network and transmit
    a message. The remote machine must be running an MTA, which accepts the incoming
    connection and stores the message.


    In the simplest case, the message is addressed to a user on the computer that''s
    receiving the message. In this case, the MTA program simply appends the message
    to the user''s inbox file. But MTAs can also accept messages destined to other
    machines. When this happens, the remote machine is effectively taking responsibility
    for the delivery of the message. In this way, some messages can be relayed from
    machine to machine around the Internet before eventually arriving at their destinations.
    You can trace the path taken by a message by setting your mail client to display
    all the header lines of the message. You will see a number of lines starting with
    the word Received:. Each of these lines represents a relay.


    On a Debian system, the standard MTA is the exim program. Note that this is different
    from sendmail, the traditional UNIX MTA that is still used by many other Linux
    distributions (The sendmail program is available as a Debian package but, unless
    you have special requirements, you will probably want to ignore it.)


    # Outgoing Mail


    Even if you never connect your computer to the Internet, you should install the
    exim package. The exim package handles the simple case of email messages between
    users on the computer. Even if only one person is using the machine, there are
    some circumstances under which email can be automatically generated—for instance,
    if an error occurs during regular system-housekeeping tasks.


    Most computers today have either a direct connection to the Internet or a dial-up
    modem like. There are two approaches that can be taken when handling outgoing
    messages:


    +   - One solution is to attempt direct delivery of every message you send. In
    this case, the MTA inspects the part of the address that follows the @ character
    in the address and then connects to the appropriate machine.

    - Alternatively, all messages can be passed directly to a dedicated machine called
    a smart host, which acts as a mail relay. If you are using a dial-up connection,
    your ISP will certainly offer a smart host—the documentation will probably describe
    it as SMTP server or Outgoing mail server. Commercial and academic networks usually
    offer a smart host as well; ask your network administrator for details.'
  merge: -1
  pgno: 138
- img_proc: true
  md: '# 126 Chapter 8: Advanced Configuration


    Windows mail clients almost rely on smart hosts for mail delivery. As a Debian
    user, you have a choice: exim is a fully featured MTA and is therefore capable
    of direct delivery. Smart hosts offer a significant advantage when the receiving
    system is temporarily unavailable, because the smart host can keep trying to deliver
    the message at regular intervals.


    If you don''t have a smart host, your local copy of exim can keep retrying, too,
    but that isn''t any help if you have a dial-up connection. And even if you have
    a permanent connection, you may want to switch off the computer or reboot the
    machine and use Windows instead, in which case any undelivered messages are waiting.


    The exim program is configured by the file /etc/exim.conf. This is a complex file,
    but in most cases you can use an automatically generated default file. If you
    do need to customize the system, the format of the configuration file is documented
    by files in the /usr/doc/exim directory. When you install the exim package, the
    package installation scripts will run the exconfig program to generate a standard
    configuration. If you make a change, you can re-run exconfig at any time.


    First, you are prompted to choose from several types of configurations. This is
    where you choose whether you are going to use a smart host. And then are asked
    a number of additional questions. You can accept the default values for many of
    these, but consider the following changes:


    +   * The system''s mail name. By default, UNIX mail clients usually generate
    messages with From: lines of <username>@<mail_name>. Also give you the option
    to specify an Alternative: For instance, if all users on your machine are to addresses
    nick@solar-spice.com, you should enter solar-spice.com.

    * You are asked if you want to use the Real-time Blackhole List to filter junk
    messages. This option is relevant only when you are going to be using your Debian
    system to receive email directly, rather than using some other machine as an incoming
    mail server. If you are not receiving email directly, you should always answer
    "no".

    * If you are using a smart host, you need to enter its name.

    * Sometimes, messages relating to automatic system functions are sent to the root
    account. It isn''t good policy to log on as root just to read these messages.
    For this reason, you have the chance to specify where they be redirected. You
    should always take advantage of this option.


    Once you have set up a configuration file, you can use any UNIX mail tool to send
    messages. If you are using a dial-up connection, outgoing messages are held in
    a mail queue until you activate the connection, at which time they are sent. If
    you are logged on the root account or any account that is a member of the mail
    group, you can check the contents of the mail queue using the mailq command. If
    you are using a dial-up connection and connect for very short periods of time,
    this option can be useful for ensuring that all messages have been sent.


    ![](img/a0c73b609953db1cdc146c59ceca7cbb_139_0.png)'
  merge: -1
  pgno: 139
- img_proc: true
  md: '# Incoming Mail


    If you have a permanent connection and your network administrator has allocated
    a name for your computer (such as adzel.solar-spice.com), it is possible to send
    email messages directly to any user account of the machine, for instance thomas@adzel.solar-spice.com.
    However, this can happen only when the computer is connected, switched on, and
    running Debian all the time. Some network administrators may ask you to use this
    facility. Moreover, if you are using a dial-up network connection, this simply
    isn''t an option.


    The alternative is to use a dedicated incoming mail server, normally operated
    by your ISP or network administrator, to receive mail on your behalf. Messages
    are stored there, and can be retrieved at any time using a special retrieval protocol.
    Mail servers operated by ISPs usually support the POP3 protocol for fetching messages,
    while corporate or academic servers use an alternative system calling IMAP. There
    are also special mail systems, normally found in corporate environments, or that
    proprietary protocols—consult your network administrator if you think this might
    be the case.


    If your mail is being stored on a POP3 or IMAP server, you want the fetchmail
    package. This package retrieves messages from the incoming mail server and feeds
    them into your local mail-system. You configure fetchmail by creating a file in
    your home directory .fetchmailrc. This file contains one or more lines listing
    the mail server accounts that the program should check for new messages.


    If you have an ISP account with an email address of clown@omeisp.net, for example,
    you add the following line to your fetchmail configuration:


    ```

    poll mail.omeisp.net protocol pop3 username password

    - Bl3rdyBloop mda //usr/sbin/exim -b thomas**

    ```


    Each entry in .fetchmailrc must be a single line, note that .fetchmailrc entries
    are designed to look like normal English sentences. This one specifies the mail
    server to check the username and password of an account there, and the name of
    a local account to which fetched messages should be delivered.


    The mda (mail delivery agent) specifies the command that should be used to inject
