  md: '# MORE LINUX FILE SYSTEMS?


    Since early in the history of Linux, the ext2 file system has been the standard
    for almost all installations—it will certainly be what you use in your first Debian
    system. There are several alternatives emerging that might eventually replace
    ext2 That said, you can be sure that good ext2fs support will remain in the Linux
    kernel for a long time. None of the file systems described here are included in
    standard Linux distributions such as Debian. Initially, they will be used only
    by kernel developers for testing purposes, and by system administrators who need
    very high performance file systems. But at least some of them will gradually filter
    into widespread use over the next few years.


    The first possible replacement is being worked on by some of the main Linux kernel
    developers, and is a logical extension of ext2 It will probably go by the rather
    unimaginative name of ext3. The main feature of ext3 is journaling, a technology
    that prevents disks from being left in an inconsistent state when there is a major
    system failure, such as an unexpected power loss. There are also likely to be
    useful performance improvements. You can expect ext3 support to be merged into
    the Linux 2.3 development series.


    Two new Linux file systems also offer journaling XFS is an advanced file system
    originally developed for the Irix operating system. The developers, have recently
    offered it to Linux users. It is not yet certain how XFS will be supplied to Linux
    users, but it could eventually become an attractive alternative. Another up-and-coming
    system is reiserfs, an experimental file system design that could offer big performance
    improvements, especially on partitions used to store a large number of small files.
    The reiserfs is already attracting interest from system administrators, and could
    become a option for everyday Debian users in the near future.


    # Geometric Concerns


    The size of a hard disk is the product of a number of values, which together make
    up the disk''s geometry. Each of the data storage surfaces of the disk (called
    heads) is divided into concentric rings, variously called cylinders or tracks.
    The tracks are in turn subdivided into sectors. A typical disk might have a geometry
    as shown here:


    | Cylinders | 7944 |

    | Heads | 16 |

    | Sectors/cylinder | 63 |

    | Bytes/sector | 512 |


    Total 4,099,866,624 bytes

    (or, depending on which definition of a gigabyte you use, somewhere around 4GB).

    Note that the number of heads, sectors, and bytes/sector are fixed for virtually
    any modern IDE drive—it is the number of cylinders that varies.'
