    # Printing—A UNIX Approach


    At some point, you will probably produce some documents on your Debian system
    that you want to print. Virtually all home and small office printers today attach
    to the computer''s parallel port. The raw printer device file (equivalent to LPT1:
    under Windows) is /dev/lp1, and you can test your printer by logging in as root
    and sending some text directly to that device. For example


    ```

    cat myfile.txt >/dev/lp1

    ```


    However, there are two drawbacks to using the parallel port device for everyday
    printing. First, the traditional UNIX reasoning: If more than one user tries to
    access a single printer device at the same time, the second user will find the
    device busy. If you are using your Debian system as a standalone workstation,
    you might not think this is an important consideration. But if you set up an office
    printer, it certainly does matter. As a consequence, the default system setup
    does not allow normal users to directly access devices.


    The standard solution to this issue is the lpr package, which manages a queue
    of print jobs. For simple setups, you can print a file using a command like this:


    ```

    lpr myfile.txt

    ```


    If the printer is currently switched on and not busy, the file will print immediately.
    If not, it will be added to a queue and printed as soon as possible. You can see
    the items in the print queue using the lpr command and cancel a print job using
    lprm. Note that most windowed programs offering a print facility generate PostScript
    files internally and then automatically feed the data into the lpr program.


    The second issue when setting up a Linux printing system is that the data sent
    to the printer must match what the printer is expecting. Plain text is not too
    much of a problem, but different types of printers expect graphical data in different
    formats. Presenting graphical data in the correct format is the main function
    of printer drivers


    UNIX programs, on the other hand, traditionally output print jobs using the PostScript
    page description language. Top-of-the-range printers often understand PostScript
    data directly, and these pose no problem. But PostScript-compatible printers are
    expensive, and few home users have them. Fortunately, there is a free package
    called gs (short for Ghostscript) that can convert PostScript files into the data
    format used by a wide range of printers. It can also preview PostScript (and the
    related file format, PDF) onscreen.


    In an ideal world, a program would inspect all files that you try to print and
    run gs, or any other appropriate filter program, in order to convert the files
    to a type understood'
  merge: -1
  pgno: 108
- img_proc: true
  md: 'by your printer. The magicfilter attempts to provide this kind of service.

    With this package correctly installed, you should be able to print PostScript,
    PDF, plain text, and a variety of other file formats without needing to run the
    required filter manually.


    # Setting Up a Print System


    As so often is the case in the UNIX world, there are many options available when
    configuring a printer, but the simplest solution for a Debian system is as follows.
    First of all, you should run dselect and ensure that the following packages are
    installed:


    +   - lpr

    - gs

    - gs-fonts

    - magicfilter


    You must now set the lpr configuration file, /etc/printcap (so-called because
    it defines the capabilities of printers). This file defines a job queue for your
    printer device and ensures that all files in the print queue are processed through
    the magic filter before sending them to the printer. If you don''t already have
    an /etc/printcap file, the printer configuration program will run automatically
    when you install the magicfilter package. If this doesn''t happen, or if you want
    to reconfigure the system magicfilterconfig --force


    You are asked to provide full and short names for your printer. These aren''t
    too important unless you have more than one printer connected. The default printer
    device, /dev/lp1, will usually be correct. The main choice you need is to make
    the filter you wish to use. The program displays a list of the available options,
    and if you can see one that fits the printer you are using, life becomes easy
    as. If not, you may need to experiment. Remember that many modern printers emulate
    the HP LaserJet series. Your printer manual may contain some helpful information.


    With your /etc/printcap file set up, you should be able to use the lpr command
    to print both plain text files and PostScript documents. Normally, the only argument
    needed by the lpr command is the name of the file to print. But if you have more
    than one printer set up, you can use the -P option. For example


    ```

    lpr -Pdeskj myocument.ps

    ```


    For a good test, try printing a document from a program such as Netscape or AbiWord.
    These programs generate PostScript data that should be recognized by the magicfilter
    system and rendered using gs. The Print dialog box of Netscape (see Figure 6.6)
    is a good example of dialog boxes provided by most major UNIX applications. The
    most important option is that the command should be executed in order to print
    a PostScript file. If you need to pass any options to the lpr command, you can
    specify them here.'
