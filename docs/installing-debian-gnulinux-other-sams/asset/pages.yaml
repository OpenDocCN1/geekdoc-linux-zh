  md: '# CHAPTER 5


    # Making Your Selection


    This chapter looks at the Debian package-management system, which is a set of
    programs that provide an easy method for installing new software on your GNU/Linux
    system. Behind the scenes, the package-management system is also keeping records
    of which packages you have installed, and which files on your system belong to
    which package. This makes it easy to remove a package that you decide you don''t
    need, or upgrade it to the latest version.


    # What Is a Package?


    Conceptually, a package is any unit of software that can be installed on your
    computer. Debian takes a fine-grained approach to package management. This means
    that you have a very high level of control over the software installed. But conversely,
    you may need to install a number of different packages to accomplish one task.
    An example is The Gimp, a complex image-manipulation program. As well as the core
    gimp package, there are optional packages that contain additional data files and
    the program''s documentation.


    In practice, a package is a bundle of files, rather like standard UNIX tar.gz
    archives, or the ZIP files common with DOS and Windows. But as well as containing
    the files that make up the program you want to install, a package file contains
    a number of other pieces of information. The most important extra details are


    +   - The package version number. Comparing the numbers of the most recent packages
    available with those already installed allows automatic upgrading of the system.

    - A set of scripts (simple programs) that run automatically when the package is
    installed or removed. This'
  merge: -1
  pgno: 74
- img_proc: true
  md: '# Chapter 5: Making Your Selection


    allows the package to seamlessly configure itself and integrate into the system.
    These scripts can perform the functions of the installation wizards supplied with
    many Windows applications.


    +   A list of package dependencies. One Debian package can either require some
    other package, or declare a conflict that makes the two mutually exclusive.


    There are also various conventions followed by Debian packages, especially regarding
    placement of resources files on the system. These conventions are set out in the
    Debian policy and packaging manuals. From a user''s perspective, the most important
    rule is that each package must create its subdirectory of /usr/doc. Any important
    documentation files are found there.


    Debian packages are supplied as files with a .deb extension. The main part of
    the name usually has a standard format. For instance, the package file named freeeciv-1.7.2-3.deb.
    The first part, freeeciv, is the official Debian name of the package, and should
    always be lowercase. (Freeciv, incidentally, is a popular UNIX strategy game.)
    After the underscore comes the main version number, which signifies that the package
    was built from the 1.7.2 release of the standard freeeciv code. The final number,
    after a hyphen, is the Debian version number. This indicates that this is the
    third Debian package built from this version of the standard code, and indicates
    that there have been some minor modifications to the packaging process since the
    package was built.


    Installing from .deb packages is always the easiest way to add new software to
    your system. But occasionally .deb files are not available. Various solutions
    for installing non-Debian software are discussed toward the end of this chapter.


    # Debian Archives


    There are a number of methods for obtaining Debian software—CD-ROM and Internet
    FTP are the main distribution mechanisms, so methods are considered here. Regardless
    of the method used for distributing the software, Debian archives have a well-defined
    structure. The top level of any archive is likely to contain a number of incidental
    files and directories, which contain information such as the Debian FAQ. They
    also contain a directory named dists. It is in the dists directory that all the
    Debian software is stored. Some examples from a typical Debian FTP archive are
    shown in Figure 5.1.


    Within the dists directory, there are sub-directories corresponding to various
    complete releases of the distribution. In the case of a CD-ROM, there is normally
    only one distribution: the stable release from the time the disk was made. But
    Internet often carry the latest unstable version too, and, if appropriate, a frozen
    distribution undergoing final testing and bug-fixing before it is marked as stable.


    As well as specifying distributions by the unstable/stable classification, you
    can also refer to a specific version of Debian by its development code-name. Some
    Internet archives may include versions of the distribution earlier than the current
    stable version, and these can be accessed only by name. The code names of recent
    versions are shown in Table 5.1.'
