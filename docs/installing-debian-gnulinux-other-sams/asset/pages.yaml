    # Doing It Yourself


    A few years ago, virtually all Linux users compiled their own kernels from source
    code. Various developments—especially the movement of peripheral hardware drivers
    from the kernel into separate loadable modules—mean that today, the majority of
    users can do with precompiled kernels. But building your own kernel can be useful
    if you have some obscure hardware device that''s not supported by the standard
    configuration.


    There can also be performance gains. By building your own kernel, you can exclude
    unnecessary drivers and ensure that the kernel is optimized for the processor
    family you are using. Especially on Intel systems, the precompiled kernels represent
    the lowest common denominator, which will work on anything from a 386 up, but
    which might not run as fast as a kernel specifically optimized to take advantage
    of the Pentium IIs. Finally, you might need to recompile your kernel if you want
    to take advantage of a multi-processor PC. Standard kernels often only make use
    of one processor. You can check whether multi-processor support is enabled by
    typing the following:


    uname -a


    Check to see whether the kernel version includes the letters SMP (symmetric multi-processing).
    SMP kernels run fine on computers with only one processor, but there may be a
    slight speed penalty due to the extra locking code needed to prevent multiple
    processors from interfering with one another.


    There are two slightly different approaches you can take to building a new kernel.
    The traditional approach uses the standard Linux development tools and leaves
    you with a kernel file, which you must install manually. Debian offers an alternative
    approach: a package kernel-package provides a set of scripts that allow you to
    build your own kernel-image packages. You can then install these just like kernel
    images from the official Debian archives. If you want to ignore the Debian-specific
    scripts, just install the latest kernel source and then read the Kernel-HOWTO
    document. Otherwise, read on.


    # Kernel Prerequisites


    Before you start, you need to have all the normal Linux development tools installed—notably
    the C compiler (gcc) and make. You also want the following:


    +   - kernel-package (not usually found on Debian CD-ROMs—download it from the
    archive instead)

    - bin86 we used in part of the kernel build process'
