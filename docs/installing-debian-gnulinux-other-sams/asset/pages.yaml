    # Making a Contribution


    The most obvious way to contribute either to the Debian project or to the GNU/Linux
    community as a whole is programming. This doesn''t necessarily mean be a very
    large project. If you use a piece of free software that isn''t currently available
    as a Debian package, why not consider *Debianizing* fully? There are several packages
    that contain documentation to packages:


    +   - developers-guide

    - packaging-manual

    - debian-policy


    If you are thinking about producing packages, you should take a look at these,
    and then join the debian-devel mailing list.


    You can also contribute as a programmer by fixing bugs or adding features to important
    programs. And if you write any software of your own, consider releasing it freely
    under a license matching the Debian Free Software guidelines (discussed in Chapter
    1, "Introducing Debian"). Incidentally, please try to avoid writing your own software
    license—there are already several well-known licenses to choose from, and creating
    another is just likely to cause confusion.


    But you don''t need have programming experience to make your mark. Most Free Software
    projects, especially the larger ones, are always ready to welcome any volunteers.
    Non-programmers can manage Web sites, write documentation, or simply test new
    releases and answer users'' questions on the mailing lists.


    # And Finally...


    Having installed Debian, you have access to an extremely powerful operating system
    with a wide range of application software. It is the end result of almost 30 years
    of continuous development of UNIX-like systems. Moreover, the fact that systems
    like Debian can be built entirely using free software is leading to serious changes
    in the way people think about the computer industry.


    If you enjoy the power and flexibility of Debian, you might feel inspired to contribute
    to either Debian itself or some other free software project. You might also want
    to help spread the word: unlike commercial operating systems, Debian doesn''t
    have an advertising budget. But since it is freely distributable, there is nothing
    to stop you from passing it on to friends.


    But whatever you do with Debian, good luck. and enjoy your explorations.'
