  md: '# 112 Chapter 7: Tour of the Packages


    +   * samba takes its name from the server message block (SMB) protocol family,
    which provides the facilities commonly referred to as Windows networking. This
    package allows a GNU/Linux machine to offer and print server facilities to Windows
    clients. Information on the package is available from http://www.samba.org.


    Now a word of warning: Whenever you run an Internet server, you are opening a
    potential security hole on your system. There are two ways in which Internet server
    programs can enable security violations:


    +   * First, bugs in the server code can give attackers the chance to make the
    server process behave in unexpected ways—which can sometimes lead executing arbitrary
    commands on your system!

    * Secondly, a totally bug-free server program can sometimes violate system security
    if it''s not correctly configured. For instance, a Web server may be offering
    directories of files to the outside world without your knowledge.


    There is no simple answer to keep your computer secure, other than unplugging
    it from the network. But as a Debian user, you can do a lot to protect yourself
    from server bugs by keeping all packages on your system up-to-date, and regularly
    checking the Debian home page to make sure there aren''t any security alerts relating
    to server packages you use.


    Configuration errors are a little harder to avoid. Most server packages supplied
    with Debian have relatively safe default configurations. If you see a package
    that you think has bad defaults, consider getting in touch with the package maintainer
    and suggesting an alternative.


    But even so, whenever you install a server, you should immediately read the documentation
    and then check through the configuration files yourself. And don''t run servers
    unless you have. Before you install a new one, be certain that you need it, and
    that you will have time to keep the configuration up-to-date. If you experiment
    with a server and decide you don''t want it, remove the package immediately.


    Finally, if you have a permanent connection to the Internet as a whole, but are
    only running servers for the benefit of a small group of users (who will probably
    be using the local network), consider protecting your machine by configuring a
    firewall in the network subsystem. Firewalling gives you complete control over
    which computers are allowed to connect to your network. If you are interested
    in this option, the IPCHAINS document is a good place to start.


