  md: '# 34 Chapter 3 Getting Ready—Disk Space


    well-defined standard directory structures. Each user who has an account on the
    machine will create personal files in a special home directory.


    All modern Linux distributions broadly follow the directory structure set out
    in a document called the File system Hierarchy Standard (FHS). Debian generally
    follows FHS quite closely, while other distributions differ in some ways. Once
    you have learned your way around Debian''s directory structure, you will normally
    have few problems with any other, but be prepared for subtle differences. Some
    of the main directories are listed in Figure 3.2.


    ![](img/a0c73b609953db1cdc146c59ceca7cbb_47_0.png)


    # Figure 3.2


    Simplified view of a standard Debian file system structure. Note how the directory
    structure has been split across three disk partitions—you don''t have to use multiple
    partitions, but such arrangements can make it easier to recover important data
    after a system failure, and are favored by experienced UNIX administrators.


    Perhaps the most important standard directories are those called bin and sbin.
    These directories are where all the main commands and programs of the GNU/Linux
    system are stored. Commands that normal users are likely to be found in bin directories,
    whereas sbin is normally reserved for system-management tools.


    The bin and sbin directories in the root directory are reserved for only the most
    essential tools. Other top-level directories include /etc (contains system-wide
    configuration files) and /var (used—outgoing email messages are queued up here,
    for instance). Finally, another top level directory,/usr, contains less vital
    files. For instance, an application program such as a word processor is normally
    installed in the non-essential programs directory, /usr/bin.


    There are also a number of additional standard directories that are important
    to the functioning of a GNU/Linux system. Notable among these are the /lib directory,
    which contains shared pieces of code used by many programs, and the /boot directory,
    where files related to the initial loading of the kernel are stored.


    Users'' home directories can be placed anywhere in the hierarchy. Unless you have
    a very large number of users, you will probably want to follow the Debian standard
    policy of giving each user a home in the /home top-level directory. Theadduser
    tool (see Chapter 6, “The First Steps in Debian”) normally creates new home directories
    in this location.'
