  md: '# Desktop Environments


    # .xsession file for thomas@adzel


    xterm -bg black -fg wheat &\xdalicclock &

    exec WindowMaker


    As with any script, lines beginning with a # character are treated as comments
    and ignored. The next two lines are normal command lines for starting X applications—note
    the # & at the end of each line to signify that the program runs in the background.
    This particular file starts an xterm (with some options-background and foreground
    colors) and a clock program.


    The final line in .xsession file is rather special. It should always start some
    program (in this case the WindowMaker window manager), but it is run in a different
    way. The exec command is used, and there is no # character. This makes the program
    started in this way the session manager. The X session will continue for as long
    as its session program is running and then exit silently.


    It is common practice to make the window manager the session manager. This means
    that the session will end when you select Exit from the window manager menu. But
    you can make any program the session manager. If you are using an application-launching
    panel (such as the panels supplied with the various desktop environment packages,
    described later), you might prefer to make this the session manager instead. In
    this case, you can use a file like this:


    # .xsession file with a panel utility as session manager


    xdalclock &

    WindowMaker &

    exec panel


    .xsession file should start one (and only one) window manager—even if it is not
    going to be used as your session manager. Strictly speaking, it is possible to
    use the X Window System without a window manager, but this is graphically unattractive
    and rather different—you will have difficulty moving, resizing, and closing windows,
    since these facilities are normally provided by the window manager.


    Occasionally, you may encounter an error in your X session file. This error could
    result in some of the applications failing to start, or even in the whole session
    exiting prematurely. If so, look for any error messages that might have been produced
    while running the .xsession file—these errors are logged in a file called .xsession-errors,
    also located in your home directory.


    # Desktop Environments


    The core X Window System provides an environment in which to run window applications,
    but it does not, on its own, provide a wide selection of utilities that might
    be familiar to users of other windowed user interfaces. The definition of a desktop
    environment is rather vague—it can be applied to any package that provides a selection
    of'
  merge: -1
  pgno: 100
- img_proc: true
  md: '# 88  Chapter 5: The Final Steps to Ubuntu


    everyday graphical tools with a common look and feel. For many people, the most
    important component of a good desktop environment is a graphical file manager.


    For some years, many UNIX systems have been supplied with the Common Desktop Environment
    (CDE). The KDE tools run on Linux-based systems, but this is a commercial (and
    quite expensive) product and won''t be considered here. In recent years, there
    have been several open source projects to develop new desktop environments for
    the X Window System. The GNOME and K Desktop Environment (KDE) projects have both
    produced a variety of high quality software programs.


    In some UNIX and Linux forums, you may encounter heated discussions of the merits
    of the desktop environments. In fact, there is no particular reason why you need
    to choose one the other—it is entirely possible to have both installed on each
    machine, and to run your favorite programs from each. Efforts are underway to
    make the two systems work together better—in the future, they will both use the
    same mechanisms to support drag and drop transfers, for instance. But if there
    is a certain degree of rivalry between the two camps, it only serves to fuel the
    development of both systems.


    # GNOME


    For those who care, GNOME is actually the GNU Network Object Environment—a name
    that reflects technology used to allow sophisticated interaction between the components
    of the system (similar methods are also being used in the KDE project, as it happens).
    Details of the project, regular announcements, and some screenshots can be found
    on the main Web site at http://www.gnome.org/.


    GNOME doesn''t specify a standard window manager, although Enlightenment and WindowMaker
    are popular choices. What do you get are the desktop environment essentials: a
    highly configurable application-launching panel and a graphical file manager called
    gmc (see Figure 6.4), plus a host of extras ranging from a dedicated help browser
    to a windowed implementation of the UNIX task system. GNOME project members are
    also working on a variety of bigger applications, including the balsa email client
    and the powerful gnumeric spreadsheet. And to complete your desktop, there are
    a few games including the obligatory mine-hunting puzzle.


    A final version of GNOME is a part of the main distribution for Debian 2.2. Debian
    2.1 includes some GNOME packages, which are based on a prerelease version and
    are best avoided until full releases are available. If you want to try GNOME on
    a Debian 2.1 system or ensure that you have the latest version, you can add the
    project''s FTP as an APT package source. This way, the packages will be available
    in your standard package selection. There are instructions for doing this on the
    project Web site.


    GNOME is supplied as a large number of package files—most of the major applications
    are provided separately. This means you only need to install the tools you like,
    but the main GNOME packages depend on a huge array of support libraries. If you
    are using dselect to install them, all the required libraries should be picked
    up'
