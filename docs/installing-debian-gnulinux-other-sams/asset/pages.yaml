  md: '# 20 Chapter 2: Getting Ready—Hardware


    Portable PCs use credit-card sized PCs (the older name, PCMCIA, is still widely
    used). Linux PC card support is provided by a separate package—but this automatically
    included in the Debian install if it is needed. A list of supported PC cards can
    be found on the home page for the pcmia package at http://hyper.stanford.edu/HyperNews/get/pcmia/home.html.


    # MAGIC IN THE NUMBERS: USING ISA CARDS


    In any computing system, there must be some mechanism by which the processor and
    the peripheral hardware communicate. Each expansion card in a computer uses certain
    communication resources, each with a unique number. For most purposes, these can
    just be considered *magic numbers* that happen to be necessary for the computer
    to work. Ideally, when a computer starts up, all cards should have their resources
    set automatically. This ideal situation is sometimes called plug-and-play (PnP).
    Modern architectures, such as PCI, are designed from the beginning to allow PnP.


    The ISA architecture, however, is not inherently PnP. In recent years, attempts
    have been made to retrofit PnP to the old ISA bus, but especially for Linux users,
    ISA PnP can create more problems than it solves.


    The ISA bus allows three kinds of communication resource: shared memory areas,
    interrupt numbers (often called IRQs), and DMA channels. Most ISA devices use
    a shared memory region and an IRQ, while some (notably sound cards) need a DMA
    channel. The important point is that each device in the computer *must use unique
    resources*. In the case of non-PnP ISA cards, this means manually setting the
    card to ensure that its resources do not clash with existing devices. This is
    not normally achieved by manually moving link-jumpers on the card, or by using
    a program supplied with the card. To find out which resources are already in your
    computer, you can use the following:


    ```

    cat /proc/ioports # List shared memory

    cat /proc/interrupts # List allocated interrupt lines

    cat /proc/dma # List allocated ISA DMA channels.

    ```


    The problems really begin when you use newer ISA cards that can support PnP. In
    some cases, it''s still possible to manually jump or configure these cards using
    specific resources—if so, this is the easiest solution.


    If you really use PnP devices, you can try telling your BIOS that you don''t have
    a PnP operating system. In this case, it should allocate resources to PnP itself,
    and set them to an active state. If this fails, there is a package called isnapntools,
    supplied with the Debian distribution, that can get most PnP working. But this
    can be very technically demanding job.


    In conclusion, the ISA bus is obsolete technology, and it is likely to be phased
    out completely in the near future. If you have a modern PCI-based machine, given
    it is almost always best to buy PCI expansion cards, since they are truly PnP.
    If you''re installing Debian on an older machine that has an ISA bus, stick to
    Pre-PnP cards, or cards that can be manually configured.


    ![](img/a0c73b609953db1cdc146c59ceca7cbb_33_0.png)'
