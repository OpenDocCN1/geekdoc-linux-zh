    # CD-ROM Drives


    CD-ROM drives have been ubiquitous in new PCs for several years, and most people
    will be carrying out their first Debian installation from a CD-ROM distribution.
    Virtually all CD-ROMs found today are IDE devices (or, more accurately, ATAPI,
    which is a hybrid system that uses SCSI-like protocols on an IDE bus). There are
    some SCSI CD-ROMs around, but they are rarely seen in new computers. ATAPI drives
    make for a slightly easier Debian installation.


    Older machines may be fitted with some other kind of CD-ROM drive—when the technology
    was still quite new, there were many non-ATAPI systems that were used to attach
    a CD to the IDE bus. A lot of these will work, but you will generally not be able
    to boot Linux directly from the CD.


    # DVD-ROMs


    DVD-ROM drives work fine under Linux. But at the moment they are only really useful
    for reading normal CD-ROMs. Most DVDs currently available contain video data in
    a proprietary format, and decoding software that runs under Linux is currently
    not available.


    Generic data DVDs also present a problem. Many of them store data using the UDF
    filesystem, which is currently not supported by the Linux kernel. At the time
    of writing, there is some experimental UDF support code available, which will
    probably be part of the standard kernel by the time DVDs become a common medium
    for generic data distribution.


    # CD Writers


    Unlike most pieces of hardware, CD writers are normally controlled by a separate
    program than a driver built into the kernel. The cdrecord package, included in
    the Debian distribution, can drive most models, both SCSI and IDE. SCSI-based
    devices may be slightly easier to use. Internally, the IDE writers are actually
    identical to their SCSI counterparts, but they use ATAPI rather than normal SCSI
    interfaces. To use them, you need the ide-scsi kernel module, which should be
    installed with Debian.


    There are a number of graphical packages that act as frontends for cdrecord and
    a number of other tools that provide a friendly environment for assembling both
    audio and data CDs (see Figure 2.1). Several of these tools can be found in the
    otherfs-section of the Debian distribution.'
