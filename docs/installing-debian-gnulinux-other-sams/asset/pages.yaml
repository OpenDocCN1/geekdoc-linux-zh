  md: '# Why Use Debian?


    comprise a core part of the Debian policy manual, which is available in various
    formats as a Debian package, and also found on the Debian project Web site. The
    core packages of the Debian system have license terms that comply with these guidelines.
    A few packages that do not comply are included, but they are always labeled as
    non-free. Needless to say, both the GPL and the BSD licenses meet the following
    guidelines.


    +   1. Free redistribution

    The license of a Debian component may not restrict any party from selling or giving
    away the software as a component of an aggregate software distribution containing
    programs from several different sources. The license may not require a royalty
    or other fee for such sale.


    +   2. Source code

    The program must include source code, and must allow distribution in source code
    as well as compiled form.


    +   3. Derived works

    The license must allow modifications and derived works, and must allow them to
    be distributed under the same terms as the license of the original software.


    +   4. Integrity of the author''s source code

    The license may restrict source code from being distributed in modified form only
    if the license allows the distribution of patch files with the source code for
    the purpose of modifying the program at build time. The license must explicitly
    permit distribution of software built from modified source code. The license may
    require derived works to carry a different name or version number from the original
    software (This is a compromise. The Debian group encourages all authors not to
    restrict any files, source or binary, from being modified.


    +   5. No discrimination against persons or groups

    The license must not discriminate against any person or group of persons.


    +   6. No discrimination against fields of endeavor

    The license must not restrict anyone from making use of the program in a specific
    field of endeavor. For example, it may not restrict the program from being used
    in a business, or from being used for genetic research.


    +   7. Distribution of license

    The rights attached to the program must apply to all to whom the program is redistributed
    without the need for execution of an additional license by those parties.


    +   8. License must not be specific to Debian

    The rights attached to the program must not depend on the program''s being part
    of a Debian system. If the program is extracted from Debian and distributed without
    Debian but otherwise within the terms of the program''s license, all parties to
    whom the program is redistributed should have the same rights as those that are
    granted in conjunction with the Debian system.'
