  pgno: 149
- img_proc: true
  md: 'Now, on each machine that is going to be a printer client, install lpr, and
    add an

    etc/printcap file similar to the following:


    ```

    lp!remote printer:\n:lp=\n:rm=firechild:\n:rp=lp=\n:sd=/var/spool/lpd/lp:\n:mx#=@:

    :sh:

    ```


    Now create the corresponding print spool directory:


    ```

    mkdir /var/spool/lpd/lp

    ```


    and set the ownership and access mode:


    ```

    chown lp.lp /var/spool/lpd/lp

    chmod 0755 /var/spool/lpd/lp

    ```


    This creates a local print queue called lp (which is the default queue used by
    the lpr

    command). All files placed in this queue are forwarded over the network and inserted

    into another queue (in this case also called lp) on a server machine called firechild.

    Note that there are no references to magic filters here—the print job is passed
    through

    all filters configured in the etc printcap file on the server machine.


    Windows machines access shared printers using the SMB protocol. If you are running

    samba server to share files, you can also configure it to share a printer.

    Corresponding, the sambient package (one of the accessory packages for the Samba

    system) provides a simple tool that allows UNIX clients to print to a Windows
    shared

    printer.


    # # Sharing an Internet Connection


    Perhaps the ultimate in resource sharing for a home network is to allow all machines

    to share a single Internet connection (probably a standard dial-up or

    ISDN line. The Linux kernel includes a function called IP masquerading, which
    pro-

    vides almost perfect method of doing this. The qualification almost is needed

    because machines connected using this method aren''t normally able to accept incom-

    ing connections; they can only establish outgoing connections. This is usually

    a no problem for most users. Indeed, it can avoid security problems, since users
    from

    outside your network cannot access any insecure network programs that might

    be running. In recognition of this, installations of this kind are sometimes described
    as

    firewalled.


    For the rest of this section, it is assumed that you have set up all the machines
    on your

    private network as described earlier, with addresses in the 192.168.1xxx range.

    Machine on the network should have a dial-up connection, with the PPP system set
    up'
