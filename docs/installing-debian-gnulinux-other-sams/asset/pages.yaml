- img_proc: true
  md: '# 142 Chapter 10: Exploring the X Window System


    support more one screen per display and, if so, this is specified after the period.
    But this option will not affect most Debian users.


    The first screen managed by the first X server running on the local machine will
    be display :0.0, and this is the default. To specify an alternative display, the
    normal approach is to set the DISPLAY environment variable:


    ```

    export DISPLAY=adzel:0.0

    ```


    ```

    xclock &

    ```


    As you expect, this variable is automatically set to an appropriate value (:0.0)
    when you start an X session. It is also usually possible to specify a display
    for an individual application. When this is allowed, the -display switch is normally
    used, for example


    ```

    xclock -display adzel:0.0 &

    ```


    Either of these methods allows you to force an application to attempt a connection
    to a specific X server. However, this doesn''t mean that the X server has to accept
    the connection. Remember that, in general, you aren''t going to want other people
    running applications that open windows on your display. In fact, the situation
    is rather worse than that: once an X client is connected to a server, it can perform
    all kinds of operations, including grabbing shots of the screen.


    There are several mechanisms by which X security can be controlled. The simplest
    approach is to allow or deny connections to your X server according to the computer
    from which they originate. This is controlled using the xhost command. The most
    common use of this command is to enable access to one specific computer:


    ```

    xhost +adzel

    ```


    It is also possible to turn off access control completely and leave your X display
    totally unsecured


    ```

    xhost +

    ```


    But bear in mind that when you grant permission to connect to an X display, you
    are opening a big security hole. In particular, you should consider disabling
    access control only when your machine is connected to a private network. Remember
    that UNIX computers are multiuser, so when you allow connections from a specific
    machine, you are granting access to all the users with accounts on that machine.


    In practice, modern X security is achieved using a system of magic cookies, which
    are randomly generated strings provided by X servers when they first start up.
    Possessing the appropriate cookie gives you permission to connect to the X server
    that generated it. Magic cookies are stored in the file .authority in your home
    directory. This file is normally manipulated using the xauth command. For instance,
    you can view the current entries using this command:


    ```

    xauth list

    ```'
