  md: 'When you start a normal session under Debian (using startx or a display manager
    program), a magic cookie is automatically generated and added to your .authority
    file. If you log on to another machine, you can grant it permission to access
    your X display by transferring the cookie to that machine.


    If you don''t want to worry about cookies, there is an easier and safer way of
    granting access to other computers—using the ssh program. If you are using an
    X session, run the ssh command in order to log on to another computer. It will
    automatically set up a special connection-forwarding service, meaning that X applications
    you run on the remote machine automatically appear on the appropriate display.


    One case in many users—even those who don''t have a network—might want to investigate
    X authentication when running a shell as a different user from the one who started
    the X session, but on the same machine. It is easy to quickly run a shell as an
    alternative user using the su command. Suppose, for instance, that you want to
    quickly alter a system-wide configuration file. You type


    ```

    su -


    The command used without any parameters, starts a root shell. If you just want
    to run a text-console program (the editor, for instance), there''s no problem.
    But if your favorite editor is an X client program, there will not be a correct
    .authority file in the root account''s home directory, your connection to the
    X server will be refused unless you have specifically allowed connections from
    any user on the local machine, using the xhost command. Fortunately, the root
    account''s privileged status (it can read any file owned by any user on the system)
    provides a solution in this case. You can tell X clients to look for the .authority
    file in a location other than the default by using a command such as


    export XAUTHORITY=/home/thomas/.authority

    ```


    Note, however, that solution works only for the root account. If you want to run
    an X client using some other account, you will either have to deal with magic
    cookies yourself or start a new X session. In general, the latter option may be
    easiest.


    # Extra X


    How do you run more than a single X display? If you want to start a new X session
    as a different user, the simplest method is to switch back to a text console by
    pressing Ctrl+Alt+F1. (This is basically the same mechanism as switching from
    one console to another, but since the Alt+function key combinations can be used
    by some X applications, Control+Alt is used instead. ) You can now log on as another
    user, and then you can start an X session using a command such as


    ```

    startx :1

    ```


    This is the normal command for starting a standalone X session, except that extra
    options are specified to tell the startx program to run an X server on display
    number 1, rather than the default 0. If you are running more than one X server
    at the same'
  merge: -1
  pgno: 156
- img_proc: true
  md: '# 144 Chapter 10 Exploring the X Window System


    time, you can switch between them the same way that you switch between consoles.
    The first X server you start will normally run on console 7 (Control+Alt+F7 will
    take you there), the second will be on console 8, and so on.


    An X server can occasionally be useful when you encounter an X application that
    requires a specific color depth of the server. The Free86 system does not allow
    you to change the color depth of a running server. You normally use the value
    specified by the DefaultColorDepth option in your `/etc/X11/XF86Config` file (see
    Chapter 6), which defaults to eight bits per pixel (256 colors) if you don''t
    specify a value. Suppose that you normally use a 16-bit per pixel display, and
    you suddenly find an application that requires a different color depth (there
    are a few programs, games, that are fussy about such things). You can leave your
    normal X server running and start another using this command:


    ```

    startx :1 -bpp 8

    ```


    Note that running an X server isn''t the right solution if you just want some
    extra space to work with windowed applications. Most modern window managers offer
    some form of workspace facility. These are separate desktops, each of which can
    have its own set of windows. You can switch between workspaces at any time using
    a simple keypress or mouse click. WindowManager offers a powerful workspace-management
    system, accessible from the Workspaces section of the root menu.


    # Remote Display Management


    If you have more than one computer on your network, and one of them (in this example
    named adzel) is running an X display manager, try the following at another computer
    on the network:


    ```

    X :0 -query adzel

    ```


    The X is actually the X server itself. You can specify any currently unused display
    number, if you are already running an X server on display 0. The -query option
    causes the X server to use a special protocol to communicate with a display manager
    running on the specified machine. Once the server has started, you should see
    the X display manager for the machine named adzel.


    If you enter a username and password, you will start an X session where the server
    is running on your local computer, but all the client programs (including the
    window manager) are running on the remote machine. The local computer becomes
    an X terminal. This approach allows several users to share a single powerful machine,
    while still running the full range of X applications. In the past, the cost of
    installing a few powerful UNIX terminals was for large commercial and academic
    sites. Today, the falling cost of powerful PCs and workstations has made client-server
    solutions a little less popular. But if you have an old PC with a good graphics
    card and monitor, it might well be a good candidate for an X terminal on your
    home network.'
