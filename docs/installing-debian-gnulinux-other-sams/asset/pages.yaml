  md: '# The Package-Management Programs


    There are several layers to the package-management system. At the lowest levels
    are a set of library routines that will only be of interest to programmers seeking
    to replace parts of the package-management system. On top of this comes the dpkg
    program, a command-line tool that allows installation and removal of packages,
    plus many other operations. the dpkg tool is used mainly by expert users, but
    there is a brief description of one situation in which it can prove useful at
    the end of this chapter.


    The package-management system has been evolving for some time, and it is still
    improving now. In recent versions of Debian, dpkg is accompanied by apt, a system
    that handles fetching of package files from multiple locations. The apt tools
    also automate the process of resolving the dependencies of each new package that
    you install. This is now the preferred way to perform Debian installations over
    the Internet, and it also simplifies the process of upgrading Debian-based machine.


    For many users, virtually all the package-management operations can be performed
    by the dselect program. This program provides a friendly, interactive front-end
    to the whole package-management system, and allows easy browsing of the available
    packages. The dselect program does not actually install packages itself. But automatically
    runs the apt and dpkg tools in order to fetch and install the packages you have
    selected. The package-management system is summarized in Figure 5.2.


    ![](img/a0c73b609953db1cdc146c59ceca7cbb_78_0.png)


    # Figure 5.2


    Structure of the Debian package-management system.


    While dselect is the part of the package-management system most people will see,
    it is really a front-end layer on top of the other tools. Therefore, it is possible
    to replace it with some other user interface. The gnome - apt program, currently
    under development, should soon provide an alternative to dselect for users who
    prefer a windowed interface (Figure 5.3). Although the two programs may look different,
    they provide the same basic set of features, and the principles of selecting and
    installing packages remain the same.'
