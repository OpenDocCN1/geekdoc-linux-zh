  md: '# FIPS


    One alternative to reformatting, at least for users with FAT16 partitions, FIPS
    (the First nondestructive Interactive Partition Splitting program). This is a
    simple partition-splitting utility supplied under the GPL. Once data on your C:
    disk has been compacted (using a tool supplied with Windows), just run FIPS and
    it will convert your single primary DOS partition into two. You can then delete
    the second one and use the space to create Linux partitions.


    The main limitation is that it is an old program, and doesn''t know anything about
    the new FAT32 disk format, so many of Windows 98 users will lose out. Nevertheless,
    if you have a FAT16-based system, it is a simple and effective way of repartitioning
    without reformatting. If you think it fits the bill, download it from http://bmrc.berkeley.edu/people/chaffee/fips/fips.html.


    # PartitionMagic


    PartitionMagic is a commercial solution to the problem of partition management.
    It is a graphical tool that allows, not only creation and deletion of complete
    partitions, but also moving and resizing operations (see Figure 3.3). Recent versions
    are aware of all kinds of Windows partitions, as well as Linux ext2 partitions,
    and several other types.


    ![](img/a0c73b609953db1cdc146c59ceca7cbb_50_0.png)


    Figure 3.3

    PartitionMagic may be the easiest answer if you have complex partitioning problems.


    For the first-time Linux user, the main benefit of this program is that it provides
    an easy way to shrink your existing Windows partitions, even in cases where FIPS
    won''t work. It can also resize ext2 partitions, in case you ever want to rearrange
    an existing Linux installation. And since PartitionMagic can create new rearn
    partitions, you may want to use it to complete your partition set up, and skip
    the partitioning stage on the standard installation entirely.'
