    # PCS AS THEY SHOULD BE?


    While many features of a modern PC are extremely sophisticated, there are still
    significant pieces of legacy technology dating back to the days of the original
    386 processors, The ISA bus, used by some expansion cards, is certainly past its
    prime for most applications.


    Another part of the system that has a long history, and a tendency to cause problems,
    is the BIOS. This is a program which is present in Read Only Memory on our PC
    motherboard, and is responsible for initializing the machine, starting the real
    operating system, and providing some basic input and output services. The DOS
    operating system relies heavily on the BIOS for every operation. But today, BIOS
    input/output support is inefficient, and sometimes problematic. Windows 95 bypasses
    the BIOS for many operations, and truly modern kernels such as Linux and Windows
    NT are nearly independent of the BIOS once they have started. Nevertheless, the
    BIOS is still an unavoidable part of the current PC architecture.-related problems
    are discussed in later chapters.


    Now, a change may be beginning. The most obvious example is SGI''s Visual Workstation
    series of machines. Like many consumer PCs, these are based on intel''s Pentium
    II series of processors, but they use a very different motherboard architecture.
    The BIOS is gone as well; it has been replaced by a new piece of firmware that
    provides a more modern method of starting an operating system. Visual workstations
    are supplied running Windows NT, but true to form, Linux developers got soon the
    kernel working. SGI has now committed to supporting Linux development, so Visual
    Workstation support should improve quite rapidly. SGI provides a Web site for
    anyone interested in running Linux on its hardware at http://www.linux.com.


    Visual workstations are high-end machines. But their basic architecture has many
    attractions, and now that they has broken the mold, other manufacturers may follow-suit
    and offer more modern PCs.'
