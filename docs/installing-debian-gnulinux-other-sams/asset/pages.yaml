- img_proc: true
  md: 'With today''s operating systems, the exact geometry of a hard disk would be
    irrelevant were it not for one unfortunate fact: When an operating system is first
    started, the kernel must be loaded from the disk using the code present in the
    machine''s BIOS. The BIOS interfaces are very old, and are able to read data only
    from the first 1024 cylinders of a disk. This doesn''t actually prevent the use
    of large disks—once a Linux-based system is up and running, it accesses the drive
    hardware independently of the BIOS. But to boot the system in the first place,
    the kernel code, which is normally stored on your root partition, must be somewhere
    in the first 1024 cylinders of the disk.


    This is particularly serious when you realize that standard IDE disks are limited
    to 16 heads and 63 sectors per track—this restricts the bootable area of the disk
    to slightly less than half a gigabyte. Fortunately, modern BIOS offer an option
    logical block addressing (LBA), which hides the real geometry of the disk and
    creates an alternative logical geometry where up to 256 heads are allowed. So
    long as this option is enabled (it almost certainly for any machine manufactured
    in the last few years), the geometry problem disappears for disks up to 8GB.


    If you are uncertain as to whether LBA is active


    But with disk sizes increasing constantly, the current LBA support cannot prevent
    booting problems from occurring with some setups. If you have a very large disk
    that you want to share between Windows and Debian, you will probably want a partitioning
    scheme similar to the one shown in Figure 3.1. This scheme uses two Windows partitions,
    C; and D;, and two separate partitions that make up different parts of the complete
    Debian file system. The critical feature is that both Windows and Linux boot from
    partitions below the 1024 cylinder boundary.


    ![](img/a0c73b609953db1cdc146c59ceca7cbb_44_0.png)


    # Figure 3.1


    An example partitioning scheme that makes the most of the large hard disks now
    commonly available.'
