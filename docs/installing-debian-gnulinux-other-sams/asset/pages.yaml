    can boot from it to repair the system on your hard disk if that ever becomes necessary
    (press <F3> for details).


    On most systems, you can go ahead and press <ENTER> to begin installation. You
    will probably want to try doing that before you try anything. If you run into
    trouble, or if you already have questions, press the function key <F1> for quick
    installation help.


    WARNING: You should back up all of your hard disks before proceeding. If the installation
    procedure fails or hangs, remove the rescue disk from the drive and press <RESET>
    or <Control-Alt-Del> to get back to your old system.


    Debian GNU/Linux comes with ABSOLUTELY NO WARRANTY to the extent permitted by
    applicable law. For copyright information, press <F10>.


