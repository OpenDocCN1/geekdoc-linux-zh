    # Text Formatting Languages


    While most people now prefer to use word processors that follow the "what you
    see is what you get" (WYSIWYG) model, there is an alternative approach to production
    that remains quite popular in UNIX contexts: Write your document as a plain text
    file, with formatting commands, and then run it through a separate program to
    produce the final, formatted version.


    These systems have steeper learning curves than WYSIWYG packages. But once you
    are familiar with the basic commands, producing professional-looking documents
    is easy, and can be quicker than trawling complex menu structures for the option
    you want.


    Text formatting languages are very useful for producing documents that fit into
    a well-defined structure—scientific reports, for instance. Both systems mentioned
    here provide powerful methods for handling cross-references between sections of
    a large document, and for automatically generating bibliography sections.


