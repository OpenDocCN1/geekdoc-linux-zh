    # Setting Up a Graphical Login Screen


    If you use windows applications occasionally, you can keep the default system
    of logging on a text console and then starting an X session using the startx command
    when you ever need one. But today, almost everyone uses window environments routinely.
    You might prefer to run an X server automatically when your Debian system starts
    up and start an X session immediately when you log on. There are number of tools,
    called display managers, that start an X server and provide graphical login screens.


    The traditional display manager is called xdm, and it is one of the core tools
    of the X Window System. This display manager has a number of configuration options,
    but most of these are only relevant when the machine is running in a complex client-server
    environment. To use the display manager, run just devel and install the xdm package.
    You can test the program by logging in as root and typing xdm. You should see
    a login screen. After entering your normal username and password, you will see
    your normal X session. The xdm package automatically integrates into the Debian
    it7 system and will start when the machine boots.


    The xdm display manager works fine, but its appearance is, at best, functional.
    If you want to beauty your system a little, there are now several alternatives
    around. The GNOME project provides the gdm display manager—like xdm, just install
    the relevant package and it will automatically start up when the machine boots.
    As well as a more modern appearance. gdm adds some extra features, notably menu
    options that allow you to shut down or reboot the machine without manually typing
    commands.


    The KDE developers have also produced their own solution, called (surprisingly
    enough) kdm. Unless you know exactly what you''re doing, don''t installing more
    than one display manager at a time; they can clash with each other.


    # Managing User Accounts


    Linux was designed from the ground up as a multiuser operating system. This means
    that the owner of every file on your disks, and every program running on the system,
    is recorded. Whenever a program attempts to access a file, the kernel first checks
    that it has permission to do so. Even if you have a single user account on the
    machine, this check is still valuable—since all the key system files are owned
    by the root account, you must specifically log on as root before you modify them,
    thus avoiding the risk of accidental modifications.'
  merge: -1
  pgno: 104
- img_proc: true
  md: '# 92 Chapter 6: The First Steps in Debian


    The multiuser capabilities really come into play when your computer is to be used
    by family or colleagues. Users can keep their own personal files. Since many UNIX
    applications read their configuration from files in users'' home directories,
    users can all set up their accounts to meet their personal requirements without
    interfering with else''s options.


    The UNIX security model actually involved two kinds of ownership—user ownership
    and group ownership. Both users and groups are represented by numerical IDs, but
    in practice you will use normal names. User and group IDs are mapped to names
    in the files /etc/passwd and /etc/group. Despite its name, /etc/passwd doesn''t
    necessarily contain any password data. If, as suggested, you accepted the shadow
    passwords option during installation, passwords will be stored (in encrypted form)
    in the file /etc/shadow. This arrangement is considered more secure, since it
    means the encrypted password file is not readable by ordinary users on the system.
    Even though they are encrypted, having them on public display is an unnecessary
    risk.


    Each file on a UNIX system has both a user ID and a group ID. Each user is a member
    of one or more groups. On a Debian system, each account normally has a corresponding
    group of the same name, and this is the primary group for the account. This means
    that a file created by a user logged on as thomas will have a user ID of thomas
    and a group of thomas—although these can be changed using the chown command.


    On large system, administrators sometimes create groups, allowing all users who
    work on a particular project to access shared files. A new group can be created
    using the addgroup command. The group mechanism can also be used to control access
    to a particular system resource. There are several standard groups created automatically
    during the installation for this purpose. For instance, on a standard Debian system,
    access to any sound hardware is restricted to users in the audio group. Similarly,
    you can give a user permission to activate a dial-up Internet connection by adding
    them to the dip group. This particular case is discussed further in Chapter 8,
    "Advanced Configuration." There are also a number of special groups involved in
    the normal functioning of specific applications; these are described in the application
    documentation.


    In principle, you can perform all your account management functions by directly
    editing /etc/passwd and /etc/group. But Debian provides a number of tools that
    make managing accounts even simpler. The most important of these is the adduser
    command. This command creates the first user account during installation, and
    it can be used at any time to create new accounts. For instance


    adduser thomas


    You are prompted to enter various personal details about the new user (these can
    be inspected using the finger command) and an initial login password for the new
    account. Accounts without passwords are considered bad policy, even on standalone
    machines, and adduser does not allow the creation of such accounts. The program
    will then set up the account and a corresponding group and create a new home directory—


    ![](img/a0c73b609953db1cdc146c59ceca7cbb_105_0.png)'
