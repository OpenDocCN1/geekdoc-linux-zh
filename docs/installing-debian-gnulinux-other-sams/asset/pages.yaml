  md: '# 134 Chapter 9: Life On a Network


    needs to be kept secure and should always be kept on the computer where it was
    generated. But the public section can be copied to your account on any other computer
    where ssh is installed. The private certificate allows you to authenticate yourself
    to any account that contains the public certificate. Thus, once you are logged
    on one computer, you can safely access any of your other accounts without needing
    to provide a password. If you use several different computers on a regular basis,
    this is a big advantage.


    The ssh system also provides a variety of extra features and above simple Telnet.
    In particular, if you are using the X Window System, you benefit from automatic
    secure connection forwarding. This is explained in Chapter 10, "Exploring the
    X Window System," and can make running X applications across a network a lot easier.


    There is also an scp program for securely copying files from one computer to another.
    If you want to use the ssh system, start by reading the manual pages for both
    the ssh client program and the ssh daemon.


    # Transferring Files


    A traditional approach to exchanging files between UNIX machines is the FTP protocol.
    This is commonly used around the Internet—indeed, you may have obtained the Debian
    distribution via FTP. Standard Debian installations include an FTP server (ftpd)
    started via inet. Using either the command-line ftp tool or graphical programs,
    it is possible to log on to this FTP server (using your username and password)
    and store and retrieve files. It is also possible to configure an anonymous FTP
    server. In this case, remote users can access selected files by logging in using
    the name anonymous and giving their email address as a password. You will have
    have anonymous FTP while browsing the Web: URLs with the scheme ftp: specify files
    over anonymous FTP servers.


    FTP be a convenient method for transferring data between machines on a small network.
    But there are alternatives worth investigating. If you have the ssh system installed,
    you can just use the scp command to move files between machines. This command
    is designed to work similarly to the standard UNIX cp copy command, and when you
    enter the source and destination filenames, you can specify user and hostnames
    too, as follows:


    ```

    scp thomas@adzel:projects/test/myfile test/myfile-local

    ```


    # The Network File System (NFS)


    In previous chapters, you learned about the structure of the UNIX virtual file
    system, and how the mount command is used to access disk partitions. When you
    mount a new file system, it doesn''t necessarily have to come from a disk partition
    on the local machine. There are several systems that allow file systems to be
    mounted over a network. Once such a mount is established, you can have completely
    transparent access to files stored on another computer. There is a certain amount
    of work involved in setting shared file systems, but if you find yourself transferring
    files between computers on a regular basis, this could be the simplest solution.


    ![](img/a0c73b609953db1cdc146c59ceca7cbb_147_0.png)'
  merge: -1
  pgno: 147
- img_proc: true
  md: '# Transferring Files 135


    The classic UNIX file-sharing technology is the Network File System (NFS). NFS
    allows a server to export all or part of its virtual file system hierarchy. Suppose
    a server called adzel on your local network is exporting a directory /usr/packages.
    With the Debian nfs-client package installed, you can mount this server with a
    command such as


    ```

    -t nfs adzel:/usr/packages /v/adzel-packages

    ```


    Once a NFS mount is established, you can access files within it just like local
    files. NFS is used primarily on local area networks in organizations with a large
    number of UNIX or Linux machines. There are also a few big-servers on the Internet
    that can be NFS-mounted in read-only mode as a convenient alternative to accessing
    them by FTP.


    As well as acting as an NFS client, your Debian system can export directories
    using the nfs-server package. But remember, like any network service, there is
    a security risk associated with doing so. The case of exporting a directory to
    a single client machine is too too, given all the potential administrative issues
    it opens up. Just add a line to /etc/exports, and restart the /etc/init.d/nfs-server
    subsystem for instance


    ```

    /usr/packages      firechild(ro)

    ```


    This means the /usr/packages directory and allow read-only access to the machine
    named firechild. If you have more than two computers on your network, you can
    either list each machine individually or use various alternative notations to
    specify a group of machines. The details of the file format are described under
    "exports" in section 5 of the manual.


    NFS is an extremely powerful technology. For instance, if you have several different
    machines and make equal use of all of them, you might want to keep your /home-directory
    on one machine and then NFS-mount /home on all the other machines on your network
    (you can list NFS mounts in /etc/fstab, just like in normal partitions).


    # NOTE


    > Accessing files over the network is slower than reading directly from a modern
    hard disk, but the convenience of never having to explicitly transfer files from
    one machine to another can outweigh this factor.


    There are some complications in administering an NFS system. If you are running
    anything other than a very simple setup, and especially if your NFS servers have
    permanent Internet connections, you should at the very least carefully read the
    NFS-HOWTO document, with an emphasis on the security sections. You might also
    want to read some books on professional UNIX administration.


    One of the biggest potential surprises for the new NFS user is that user and group
    information is transferred over the network in the form of numerical IDs rather
    than names.'
  merge: -1
  pgno: 148
- img_proc: true
  md: '# 136 Chapter 9: Life on a Network


    So if the user IDs in /etc/passwd don''t match the client and server machines,
    you may not be able to access the files. More distressing, you might even gain
    access to files belonging to a user who has allocated the same ID.


    For small networks with just a handful of users, the best approach is probably
    to manually check /etc/passwd files on each machine and make sure the UIDs match.
    When you create new accounts, you can force the use of specific IDs, as follows:


    ```

    adduser -uid 2001 -gid 2203 thomas

    ```


    For complex installations, this is impractical. The obvious answer is to abandon
    the approach of keeping user information on each individual computer and instead
    move the information to a single central server. The best-known technology for
    achieving this centralization is the Network Information Service (NIS), a sophisticated
    system developed alongside NFS. Be aware, although implementing this is itself
    a serious undertaking. If you decide you need to take this approach, look at the
    NIS packages supplied by Debian, and carefully read the NIS-HOWTO document. Incidentally,
    it is not necessary to administer all accounts on a computer using NIS: you can
    use normal /etc/passwd entries for all the root account on each machine, so you
    can still log in if the NIS system fails.


    # Sharing Files with Windows Machines


    As well as NFS, the Linux kernel can mount files exported over the network using
    the SMB protocol family. This is often called Windows networking, although UNIX
    servers running the Samba program can also act as SMB servers. To mount an SMB-shared
    file system, use a command such as


    ```

    mount -t smb //server/c/directory /v/win-share

    ```


    Note, that in fact with conventions used in UNIX command-line interpreters, /
    characters are used in place of the \ used by Windows systems. If you have a mixed
    network with both UNIX and Windows computers attached, you might prefer to use
    SMB instead of NFS so that the same shared file systems can be used by all the
    machines on the network.


    If all this sounds too complicated (like, NFS. networking can easily turn into
    something of an administrative headache once you have several computers and a
    number of users), a much simpler solution is to use an FTP server on your Debian
    machine. You can use one of the many Windows FTP clients (a simple one is included
    with Windows itself) to fetch and store files.


    # Sharing a Printer


    The standard UNIX lpr print spool manager includes the lpd daemon, a mechanism
    for sharing a printer between several machines. The first step is to set up the
    lpr system on the machine that''s acting as the print server, as described in
    Chapter 6. "The First Steps in Debian." Once this is set up tested, edit the file
    /etc/hosts.lpd, and list all the machines on the network that are allowed to print
    files on this server.'
