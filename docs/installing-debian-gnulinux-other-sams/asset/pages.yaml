  md: '# Chapter 3: Getting Ready—Disk Space


    Once you have been using UNIX systems for a while, you will feel for the best
    way to partition a disk drive. If you are running a large server machine, you
    will probably want to take a look at the /var directory. On a typical home machine,
    this will usually be quite small. But since /var is the standard location for
    email spools and page data, it could grow dramatically on some server installations.
    In this case, you might want to use a new partition on /var/. But it is best to
    avoid such complications until you are familiar with the day-to-day workings of
    a Debian system.


    # Making Space for the Debian System


    Having decided how much space you can devote to the Debian system, the first step
    is to make room on a disk for your Linux partitions. In the ideal case of having
    a machine you can use exclusively for running Linux, you can skip this entirely
    and begin the installation process. When the time comes to create Linux partitions,
    just delete any existing partitions in cfdisk.


    Another simple case occurs when you already have a partitioned drive. Some PCs
    are supplied with the C: and D: drives under Windows. If this is the case, and
    you think that the D: partition is about the right size for your Debian system,
    you can simply copy any files you want to keep to the C: partition, and then start
    the installation. You will be able to delete the second DOS partition from cfdisk,
    and then use the space to create whatever Linux partitions you require.


    Difficulties begin when there is just a single DOS or Windows partition, and you
    want to convert this partition into a dual boot Windows and Debian machine. In
    this case: the most common solution is to totally reformat the hard disk, putting
    a new Windows installation in a smaller partition to leave space for Linux. This
    inevitably means a certain amount of work—exactly how much depends on your circumstances.


    If you have only a few important files, it may be that backing these up and reinsting
    afterward is the best bet. If, on the other hand, you have a large amount of data
    and no high-capacity backup device, you might want to look at the non-destructive
    partitioning technologies. If the data has any value, you should still have it
    backed up, but at least you should not need to restore all the files, and repeat
    any customization you''ve carried out on your Windows installation.


    After partitioning a machine, there is some debate over whether Linux or Windows
    should be installed first. In practice, either would work fine. But if doubt,
    the author’s personal preference is to install Windows first. If you install another
    operating system on a machine that is already running Linux, you will have to
    boot from a rescue disk and re-install the Linux Loader program before you can
    boot Linux normally.


    There is also a question of how to partition the disk before beginning the installation.
    If Windows is installed, you can run the fdisk program (which is little like the
    Linux cfdisk program, described here, but more limited) to delete your current
    DOS partition and create a new, smaller one. Alternatively, you can boot from
    a rescue disk, begin the installation process, and run the cfdisk. If you do this,
    but still want to install Windows before Debian, you can safely reboot after partitioning
    the disk, install Windows, and then re-run the Debian installer and complete the
    process at a later date.'
