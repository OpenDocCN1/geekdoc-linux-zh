    # ## Summary


    After working through this chapter, you should have a working windowed environment
    on your Debian system. Remember that the X Window System is highly configurable.
    If you do not like the appearance or behavior of the basic installation described
    here, you will probably be able to change it by reconfiguring the window manager
    or installing a different one. There is more information about configuring X in
    Chapter 10.


    If you are new to UNIX systems, you should now be more comfortable with the ideas
    of file ownership and access modes. This chapter also covered the basic steps
    for configuring a printer attached to your Debian machine. If your computer is
    networked, you may also want to read the section on networked printers in Chapter
    9, "Life on a Network."'
