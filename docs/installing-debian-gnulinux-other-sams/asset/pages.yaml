    # # Internet Services


    GNU/Linux systems are eminently suitable for use as server machines, either on
    the Internet or in an Intranet environment. There are all kinds of network services
    available as standard Debian packages. The most popular ones are listed here.


    +   - Apache is the server program that drives more than half of all sites on
    the World Wide Web. The default configuration should work well well if you just
    want to use your machine to serve a few Web pages, but there are many configuration
    options to consider if you are setting up a serious installation. After installing
    the package, you can test your new server and read the manual at the same time
    by running the Web browser and looking at `http://localhost/`.

    - exim is the standard Internet mail transport server for Debian systems. It is
    the one Internet server that most users will want to keep installed—it is useful
    even if you never use any kind of Internet connection. Exim configuration is described
    in some detail in Chapter 8.

    - IMAP servers, such as those included in the Debian imap package, allow users
    on remote computers to access mailboxes stored on your machine. This is what you
    want if you are setting up a single server machine for an office or home network.
    If you interested in client/server mail systems, look at the IMAP home page, `http://www.imap.org.`'
