  md: '# Graphics Cards


    For most users, the ability to drive a monitor (or liquid crystal panel display)
    is essential. This means either a graphics card or tin (in the case of laptops
    and some recent low-end desktops) a video chipset on the motherboard. Old machines
    used ISA-based graphics cards, but these are now very rare. Almost all cards today
    plug into a PCI slot or, increasingly commonly, into an AGP (advanced graphics
    port) slot. AGP is an interface similar to PCI but it is optimized for high-performance
    graphics cards.


    Graphics support for running windowed applications is normally not provided by
    the kernel but by a separate application called an X server (The X Window system
    is introduced in Chapter 6, "The First Steps in Debian") Debian installations
    almost always use an X server from the XFree86 project. These servers support
    a wide variety of graphics cards and chipsets. So long as you use an up-to-date
    version of XFree86, most modern graphics cards will work.


    If you have a recent graphics card that is currently unsupported, you might like
    to try an alternative method of running the X Window system, by using the Framebuffer
    system found in recent kernels. This provides limited support for any graphics
    card that implements the VESA 2.0 standard. If you are lucky enough to have an
    unsupported graphics card, look at the Frame-HOWTO at http://www.tahillah.demon.co.uk/


    XFree86 does currently lag behind the state of the art is supporting accelerated
    3D features in modern graphics cards. To date, this lack of support has restricted
    Linux''s acceptance as a platform for gaming and certain specialist applications.
    However, 3D support may improve dramatically in the near future, especially with
    the forthcoming release of XFree86 4.0.


    # SCSI Controllers


    SCSI was originally used as a mechanism for connecting hard disks to computers.
    In today''s desktop computer market, this is actually a rather rare application
    of the technology—while SCSI drives are still thought to perform a little better
    than their IDE connectors, the price difference is rarely justifiable. SCSI hard
    disks are, however, still common for server machines.


    Most common SCSI cards are supported well, from old ones to new models. Think
    twice before using an ISA device though. Not only will you suffer from the problems
    of configuration, but performance will also suffer. The only real use for an ISA
    SCSI card is in an old, pre-PCI machine.


    In modern desktop computers, SCSI cards are most often found driving devices such
    as scanners and CD writers. This generally isn''t as demanding as running the
    machine''s main hard disk. Even so, it''s generally best to avoid very cheap or
    free'
