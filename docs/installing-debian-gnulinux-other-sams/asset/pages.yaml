  md: '# A Basic Installation


    Having read about Debian''s disk space and partitioning requirements, you can
    now look at the initial stages of Linux installation. Although there are a number
    of options for expert users, most people have started installing for the first
    time can accept the default values, and thus get a basic Debian workstation up
    and running very quickly.


    Before you start, be sure that your hard disk is backed up, and that free disk
    partitions are ready for your installation. If you are using a tool such as PartitionMagic,
    or if you have installed Linux on the machine before, you may already have created
    some Linux partitions. If not, simply sure that there is either some unpartitioned
    space on the drive, or you have an empty partition that can be deleted. Once the
    installer has started, you will have a chance to run cfdisk to create any new
    Linux partitions you require.


    # Installation Media


    The vast majority of users will be installing most of the Debian packages off
    a CD-ROM distribution, such as the set included with this book. If you want a
    more recent version, new Debian CDs are easy to obtain. If you are having trouble
    finding a local supplier, look at the Debian Web site at http://www.debian.org/


    It is, however, possible to install from other media. If there is no way you can
    attach a Linux-compatible CD-ROM drive to the machine, it is theoretically possible
    to install all the packages from a copy of the distribution on a hard disk partition
    (either Linux or FAT format). Interestingly, it is also possible to install all
    but the basic parts of the distribution directly over a network connection.'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'At the moment, the availability of high-bandwidth connections means that a
    complete installation over the Internet is probably not an option for the majority
    of normal users, but this could change in the future. Large organizations rely
    on Debian might choose to keep an up-to-date mirror of the distribution on an
    internal server.


    If you have high-bandwidth Internet access and want to do a network installation,
    you should first find a nearby mirror of the main distribution site. This should
    speed up the downloading process, and help to spread the load of accesses away
    the main site. There is a list of officially recognized mirrors (guaranteed to
    stay up to date and follow the standard archive structure) linked from the Debian
    home page.


    # Debian for Other Architectures


    Debian has been ported to a number of architectures—there are some notes on this
    point in Chapter 2, "Getting Ready—Hardware." But getting CDs for non-Intel architectures
    may be a little more difficult. If you have reasonably fast Internet connection,
    or know who does, you might find it easier to download the packages and make your
    own Debian CDs. Alternatively, simply install a base system and then configure
    select to grab the rest of the packages over the network.


    The Debian installation program is essentially the same on all supported architectures
    (making slight allowances for differences in the hardware). The main difference
    you''ll notice when carrying out a non-Intel installation is the method for initially
    booting the kernel—this method differs from architecture to architecture and is
    documented in text files supplied for each platform.


    # The First Boot


    The Debian installation program runs under Linux. Thus, the first stage of the
    installation involves running a minimal Linux system, specifically designed to
    support the installer. The minimal system is usually called the rescue system,
    since it can be used by experienced users to repair a damaged system. For most
    people with modern PCs, it is easiest to boot directly from a standard Debian
    CD-ROM.


    All recent BIOSes allow the system to boot from an ATAPI (IDE) CD-ROM drive instead
    of the normal choices of hard disk or floppy drive. CD booting may be disabled
    by default, so don''t worry if it doesn''t work the first time. To try a CD-ROM
    boot, simply insert CD 1 into your drive (if you have multiple drives, the one
    with the lowest drive letter under Windows) and reboot the machine. If all goes
    well, you will see the Debian rescue boot screen, as shown in Figure 4.1.


    If the boot process ignores your CD-ROM drive and boots from the hard disk as
    normal, reboot the again and enter the BIOS setup utilities (normally by pressing
    Delete after the memory check stage of the boot process). The details of these
    utilities vary from machine to machine, but there will be some kind of menu-driven
    interface. The preferred boot device setting is generally found in the BIOS Features
    section. You will want to choose an option such as CDROM.C, meaning check the
    CDROM drive first, but if it is not possible to boot from that, use the first
    hard disk instead.'
