- img_proc: true
  md: '# 162 Appendix 6: Kernel Management


    Unlike other Debian packages, the process of installing a new kernel does not
    delete your old one. downgrading is easy if there is a problem. For convenience,
    the kernel-image package installation scripts maintain some symbolic links: /mlinuz
    is linked to the latest kernel you installed, and /mlinuz.old points to the previous
    version.


    There are also extra files packaged with the kernel-image. These include loadable
    kernel modules, which are extra pieces of kernel code that can be dynamically
    loaded into the running kernel. Most of these code pieces are drivers for peripheral
    hardware devices. Most of the modules are installed in their own directory structure.
    Each kernel version has its own set of modules, for instance /lib/modules/2.2.11.


    It is also possible to add extra modules not packaged with the main kernel. PC
    card drivers are the best known example, but some drivers (especially for sound
    cards) are supplied in this form, too.


    After the kernel is installed, the installation script gives you the option to
    generate a new /etc/lilo.conf and reinstall the Linux loader. If Debian is the
    only operating system on your machine, this is usually a sensible option. But,
    if you have other operating systems, the generated LILO configuration file will
    not allow you to boot.


    The situation after installing a new kernel is basically the same as the first
    time you installed Debian. One option is to accept the automatically generated
    configuration file, and then add sections to boot your additional operating systems,
    as described in Chapter 4, "A Basic Installation." The alternative is to answer
    no when asked you want a new boot system installed, and to manually alter /etc/lilo.conf
    to boot the new kernel. You might also want to add an extra section to the file
    that gives you the option to boot your old kernel file. For instance, if the old
    kernel was 2.2.7, you could add this section:


    ```

    image=/boot/mlinuz-2.2.7

    label=old

    read-only

    ```


    This means that if the new kernel causes any trouble, you can boot the system
    using the old kernel just by typing old at the LILO boot: prompt.


    Whichever option you choose, remember that after manually editing /etc/lilo.conf,
    you need to type the following:


    lilo


    This command reads the configuration file and reinstalls the Linux loader. If
    you don''t do this, your changes are ignored. The exception to this rule is if
    you are accepting the automatically generated configuration, in which case the
    kernel-image installation script automatically runs lilo. Once you are happy with
    the configuration, you'
