    # The C Compiler


    The early development of the UNIX operating system and the C language were closely
    linked. It is not surprising that C is still the primary language for UNIX and
    Linux development. The standard C compiler for Linux-based systems is GCC, the
    GNU compiler. For C++, Objective FORTRAN and Pascal, it has gained support for
    a number of other languages; with more on the way. Recently, its name has been
    changed to GNU Compiler Collection (still GCC).


    The current versions of GCC are a little confusing. After the release of GCC 2.7,
    development branched, and effort went into the development of the EGCS (experimental
    GNU compiler system) package. GCC features better performance and support for
    more programming languages. Once this was established, development of the old
    GCC slowed dramatically. Debian 2.2 is likely to be released with EGCS as the
    main C compiler. But currently, the projects have re-merged, and the programs
    currently under development using the EGCS name will eventually become GCC release
    3. You can read the latest news about GCC development at http://gcc.gnu.org.


    Fortunately, the distribution you are using is supplied with GCC or EGCS normally
    not too important. Even if you are using an EGCS compiler, it will still be called
    gcc! As a minimum, install the gcc package. This is the core of the system, and
    allows you to compile C programs. You might want to use g++ if you use C++, gobj
    for Objective-C, g77 for FORTRAN 77, and gpe for Pascal.


    # Code Libraries and Headers


    Debian includes many libraries of shared program functions that can be used by
    many programs. These libraries provide a wide range of services, from basic mathematical
    operations to specialist services, such as the libjpeg library for programs that
    need to manipulate JPEG-format images. The library packages are selected automatically
    when you install a program that requires them. But if you want to compile a program
    that requires one of these libraries, you need some extra files from the developers
    package. These extra files have names like libjpeg-dev.


    If you are compiling an open source application, it will probably come with an
    automatic configuration script that scans the system for libraries it requires.
    If a library is reported as missing, make sure that the relevant developers''
    package is installed.'
