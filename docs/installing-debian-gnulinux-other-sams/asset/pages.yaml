  md: '# Themes


    There is an increasing trend towards highly configurable graphical user interfaces.
    The term theme has been used to describe any kind of bundle of configuration data
    that provides a particular look and feel to your desktop. A few years back, this
    configuration was quite limited—you were lucky if you got to change the color
    scheme—but today, some programs can be reconfigured out of all recognition. To
    completely change the appearance of an X display, you need reconfigure the window
    manager and the client applications.


    Users of the X Window System have always had a choice of window managers, and
    this provides one way of altering the appearance of the display. In addition,
    most window managers are themeable to a greater or lesser extent. WindowMaker
    offers a typical example: The Appearance selection of the root menu offers a wide
    selection of color schemes (root window) and normal window borders can give some
    quite attractive effects. But the configurability of WindowMaker is nothing compared
    to that offered by the Enlightenment window manager (see Figure 10.4). This window
    manager aims to make just about everything configurable and, if you are suitably
    inclined, you can design themes ranging from the standard window manager to a
    science-fiction monstrosity.


    ![](img/a0c73b609953db1cdc146c59ceca7cbb_162_0.png)


    Figure 10.4


    Enlightenment represents the ultimate in user interface configuration.'
  merge: -1
  pgno: 162
- img_proc: true
  md: '# Chapter 14 Exploring the X Window System


    Configuring the appearance of X clients is a slightly more complex issue. Old
    applications—especially those that used the Xt Motif toolkit—could sometimes be
    configured a little using the X resources mechanism. Look in the directory /usr/X11R/lib/X11-defaults
    for some examples. But this mechanism normally just allowed simple changes of
    color scheme.


    More recently, developers have become interested in adding theme support to the
    user interface toolkits. The latest versions of both Qt and GTK provide support
    for extensively reconfiguring the appearance of user interface widgets (see Figure
    10.5).


    ![](img/a0c73b609953db1cdc146c59ceca7cbb_163_0.png)


    **Figure 10.5**nGTK (version 1.2 or later) offers configurable widget styles.


    Toolkit themes can certainly make your desktop look more interesting, but if you
    regularly use applications written with different toolkits, you might find that
    installing themes creates a rather muddled appearance. In an ideal world, all
    toolkits might use a single mechanism for configuring the appearance of widgets,
    but as things stand, it is the user''s responsibility to avoid clashing themes
    for different applications.


    If you are interested in configuring the appearance of the X Window System, there
    is a single site that provides galleries of themes for all the major themable
    window managers and toolkits at http://www.themes.org/'
  merge: -1
