  md: '# Web Browsers


    Currently, the main browser for GNU/Linux users is Netscape 4 (see Figure 7.2).
    This browser is available in Navigator (standalone Web browser) and Communicator
    (integrated email and news clients).


    ![](img/a0c73b609953db1cdc146c59ceca7cbb_116_0.png)


    Figure 7.2


    Netscape is the most popular Web browser for GNU/Linux. It looks the same as the
    Windows and macOS versions.


    Debian splits the Netscape Communicator application into several packages. Select
    either communicator-base or navigator-base depending on whatever you are interested
    in the messaging components. There are also optional packages such as netscape-java,
    which includes the runtime support for Java applets. In some versions you may
    find static and dynamic versions. The dynamic version is smaller, but it requires
    that you have proprietary. Motif library files installed.


    When you install the Debian Netscape packages, the browser program itself is launched
    via a Debian-specific script. This does not allow the root account to run the
    browser. There is a valid security concern behind this restriction: Web browsers
    can run Java and JavaScript code downloaded from the Internet, and it is possible
    that a copy of Netscape running with root privileges could allow unauthorized
    modifications to system files. In any case, there is really no reason why you
    should want to run a browser using the root account: All everyday computing should
    be done using a normal user account.'
