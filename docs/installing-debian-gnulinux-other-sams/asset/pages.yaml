  md: '# Summary 25


    The USB code will support some common devices—notably keyboards and mice—standard,
    but additional drivers will be required for more specialized devices, such as
    scanners and digital cameras.


    # IrDA


    An more dramatic example of dynamically connectable hardware is the set of communications
    protocols specified by the Infrared Data Association (IrDA). Infrared transceivers
    are becoming increasingly common—they are now found on the majority of laptops
    and palmtop portable computers, and can be fitted to desktop machines. Infrared
    support is also found on many other pieces of hardware, notably printers and high-end
    mobile phones.


    Preliminary IrDA support for many devices is present in 2.2-series Linux kernels,
    and is improving continually. It is possible to set up wireless network links
    between IrDA-capable PCs, communicate with palmtop and print from laptop machines
    without needing a cable. If you have some IrDA-capable devices and want to try
    them out, take a look at the Linux-IrDA project page at http://cs.uit.no/-dagb/irda.


    This site includes a comprehensive IrDA-HOWTO document that describes all of the
    various sub-protocols used to communicate with specific types of devices, and
    gives advice on setting up your hardware.


    # Firewire (IEEE 1394)


    At a simple level, firewire acts a little like USB—but faster. This standard is,
    for instance, ideal for supporting hot-pluggable hard disks. Firewire devices
    are not yet common, and as yet, there is no established Linux support. But work
    is underway to change this. If you''re interested in projects that are working
    to support firewire, or any other new hardware technology, you might like to look
    through archives of the Linux-kernel mailing list, the main forum of kernel developers.
    For more details, see Chapter 11. "And Finally—Welcome to the Community."


    # Summary


    This chapter covers the most important pieces of hardware that can be used with
    a Debian GNU/Linux system, and gives some links that you might find useful for
    obtaining up-to-date-information on the Linux compatibility of specific devices.
    You might want to refer back to this chapter once your first Debian installation
    is complete for help in resolving any hardware problems you encounter, or for
    advice on purchasing new Linux-compatible hardware.


    If you are happy that your computer base system is ready to run Linux, you can
    now proceed to the next chapter, which covers hard disk partitioning. You will
    then be ready to carry out the installation itself.'
