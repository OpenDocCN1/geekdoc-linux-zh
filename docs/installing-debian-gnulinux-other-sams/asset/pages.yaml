- img_proc: true
  md: '# Interpreted Languages


    There are a number of interpreted languages popular with UNIX users, especially
    for writing small, one shot programs. If you are looking for a simple scripting
    language, consider the perl, python, and tel packages. Perl, in particular, is
    well known as a popular language for writing scripts (programs that produce dynamic
    content for the web). A simple web search should turn up plenty of example Perl
    CGI programs, but if you don''t like the look of the Perl code, the other two
    packages can perform similar tasks well, too. You should find tutorial books on
    all three of these languages in any good computing bookstore.


    Even you haven''t programmed before, consider looking at one of these languages.
    They are all good for writing simple programs for automating everyday tasks, and
    it''s remarkable what you can achieve in just a few lines. On their own, or in
    combination with a text formatting language, you can use any of these systems
    to perform many of the functions you normally associate with macro languages in
    office-type applications.


    # Other Programming Tools


    The primary tool of every programmer is the text editor. Most common UNIX editors
    are designed with the needs of programmers in mind, and some (especially the Emacs
    variant) can interact with other programming tools to act as complete integrated
    development environments.


    There is also a wide range of tools that most programmers use. For example, make
    automate the compilation process, and you will certainly need it if you are going
    to build any major packages from source. If you are thinking of taking part in
    major open source projects, you may need the cv version-management tool in order
    to fetch the latest versions of the source code from the developer''s central
    repository. Finally, you might want to look at the db debugger: a wide range of
    smaller programming tools available under the devel section of the Debian package
    listing.


    # Java


    Although the Java language isn''t as dominant as some people suggested it might
    become, a fair amount of software is now written in this language. Java applications
    run on any platform, but you need a suitable runtime system installed in order
    to use them. There are two types of Java software that you might encounter: Applets
    and applications. Applets are small programs embedded in Web pages, and the Linux
    Netscape packages handle these programs fine.


    There are some standalone Java applications around. The normal way to run these
    standalone applications under Debian is to use the Blackdown port of Sun''s Java
    Development Kit (JDK), which is included as a Debian package in the non-free section.
    As the name suggests, this contains not the files needed to run Java applications,
    but also the standard Java compiler plus other tools for programmers.'
  merge: -1
  pgno: 128
- img_proc: true
  md: 'There are also several open source alternatives to the proprietary Sun JDK.
    You might like to try the kaffe package, also included in Debian. And a new system,
    Japhar, is currently under development.


    # Summary


    This chapter listed a selection of the most important Debian packages. The packages
    listed here should offer solutions to many common computing tasks. If you want
    something else, take a browse through the main package listings in dselect, or
    try a web search.


    Having taken a look at some of the application software available, the following
    chapters return to the subject of configuring the core components of a Debian
    system.'
  merge: -1
