  md: 'In the case of non-free packages, they are not free software as specified in
    the Debian Free Software guidelines (Chapter 1, “Introducing Debian”). This doesn’t
    necessarily mean that you have to pay to use them—most are free for non-commercial
    use, and many are free for commercial use. But they may be covered by unacceptable
    restrictions, or the source code may not be available. If you want to use a package
    from the non-free section—especially if you want to distribute it commercially—should
    look at the package documentation in the directory /usr/doc/<packagename> and
    check the license before doing so.


    Within each sub-distribution directory, there is a structure of directories that
    is fairly self-explanatory. If you are using an Internet archive, you will see
    binary-<arch> directories for each supported architecture (on a CD-ROM there will
    normally be one architecture). Within the architecture directories, the package
    files are divided according to their function into a number of groups. These are
    discussed in Chapter 7, “A Tour of the Packages.”


    There has been some debate about moving the contrib and non-free sections off
    the master FTP server and onto another location, in order to clarify the fact
    that these are distinct from the core distribution. At the time of writing, it
    is not clear whether this is going to happen. If it does, there will be announcements
    on the Debian Web site. The main practical consequence of this split is that users
    who routinely download packages from the Internet may want to add the new server
    as an extra package source. The apt program and the concept of package sources
    are discussed in the section on Internet installation.


    # Joining the Arms Trade?


    Some common pieces of software—generally providing encryption services—are considered
    by the U.S. government to represent military technology. As a result, downloading
    programs such as the popular ppg e-mail privacy tool could make you a potential
    international arms smuggler! The Debian project has avoided this problem by making
    certain packages available only from the FTP server (which is located in Germany)
    at http://non-U.S.debian.org/non-US.


    plus various mirror sites, outside of the United States. The non-U.S. distribution
    sites have the same structure as the main site, but contain only a few packages—tools
    such as ppg, and the ssh system for creating secure login connections to remote
    computers. If you are installing packages over the Internet, you can have the
    installer-automatically merge the non-U.S. packages with the main list. But if
    you have installed the main distribution from CD and just want one or two non-U.S.
    packages, it may be easier to download them using a Web browser and then install
    them manually.'
