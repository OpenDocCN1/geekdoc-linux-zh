  md: '# Summary


    By the time you have finished this chapter, you should have created a free area
    on your hard disk, ready to hold your new Debian installation. You also have worked
    out a scheme for dividing this space up into partitions. If you want to get a
    simple home system up and running quickly, one large Linux partition plus a small
