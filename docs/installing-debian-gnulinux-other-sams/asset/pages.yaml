  md: 'Finally, the program will start a text editor and you to enter all the remaining
    information of the bug report. At the top of the message, you will see some details
    of the package involved. At the bottom is an automatically generated report of
    your system setup. In between is a space for you to type your own report of the
    problem. When in doubt, it''s better to give too much detail than too little.
    In case of command line programs, you might want to paste in a complete transcript
    of a typical session, showing everything you typed, and then any error messages
    produced by the program.


    Remember that if you are running the X Window System, you can paste text from
    an xterm into another window by selecting it, and then clicking the middle button
    of a three-button mouse in place where you want the text inserted.


    When you have finished, save the edited bug report and quit the editor. The bug
    program will then send the report. After the report reaches the bug-tracking system,
    it will be filed and you will receive a reply containing the number of the bug.
    This number is then used to track the bug through the system. You can check the
    status of your bug at any time by entering your number on the bug home page.


    In some cases, bugs occur as the result of giving programs specific input file.
    If this is a short text file, there is no reason why you can''t simply paste it
    into the text of the bug report, accompanied by a suitable explanation. For larger
    files, other methods are needed. If you have some personal Web pages, a good solution
    might be to place the problem file on your Web server, and then include the address
    from which the file can be downloaded as part of the report.


    As a simple (and not at all extreme) example of a message that could be sent to
    the bug tracking system, consider the following:


    +   - Subject: primes: reporting 4 as a prime number

    - Package: primes

    - Version: 3.14


    The ''primes'' program is reporting 4 as a prime number whenever the maximum value
    specified on the command line is divisible by 5. A transcript follows:


    ```

    adel:-~/test$ primes -max 12

    1 2 3 5 7 11

    adzel:-~/test$ primes -max 15

    1 2 3 4 5 7 11 13

    ```


    +   - System Information

    Debian Release: 2.3

    Kernel Version: Linux adzel 2.2.11 #1 Aug 10 18:54:05 1999 i686


    Version of the packages primes depends on:

    libmagic 2.71-8 Magic math library'
