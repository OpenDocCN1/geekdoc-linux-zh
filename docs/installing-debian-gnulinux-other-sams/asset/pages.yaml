  md: '# 68 Chapter 5 Making Your Selection


    Generally, Debian is supplied on several CDs. The complete Debian CD set consists
    of four disks—two containing the actual packages, and two with source code. The
    disks supplied with this book correspond to the first two disks of the full set.
    Whenever you set up the multi_cd access method, you should always insert the last
    CD in the set that contains binary packages, since this contains information about
    the contents of various CDs. Once you have provided this CD, the access method
    will search the CD for the various sub-distributions (main, contrib, non-free,
    and non-U.S.). Your CD set may not include some of these sub-distributions. If
    you are prompted for the location of a particular sub-distribution, you should
    normally reply none.


    # Over Over Network


    There are two access methods that allow to obtain packages using the Internet
    transfer protocol (FTP). Unless you are an expert user, you should ignore the
    ftp option, and use the new apt system instead. If you are doing a network installation
    for the first time, it is worth locating your nearest archive site, and then familiarizing
    yourself with the directory structure using your favorite Web browser or FTP tool.


    The apt system is based around the concept of a source list—a file that can specify
    any number of locations from which Debian packages can be obtained. For an initial
    installation, you will only need one entry in your source list, but you can add
    more later. The apt package fetcher automatically merges the lists of packages
    available from each source.


    The first thing to configure is the root of the Debian archive site you are using.
    This is specified in URL format. Depending on which mirror site you are using,
    the Debian archive root will often be a sub-directory of an archive containing
    many other files. The Debian root directory will contain all dists directory


    Next, you need to specify the distribution list you want to use—this refers to
    the sub-directory of the dists directory in the archive. For a first installation,
    you can almost always type stable here. Once you have gained some experience with
    Debian and you want to live dangerously, you might like to try the unstable distribution
    instead, but ignore for now. If you prefer, you can also specify distribution
    versions by their code names, as listed in Table 5.1.


    Finally, you are prompted for a list of sub-distributions to look for. In a standard
    archive, the default value of main contrib non-free will normally be correct,
    but you might like to add entries if you are using a non-standard site. You have
    now defined a complete entry for the source list.


    When you have finished, you have the chance to add another site to the source
    list. If you need any encryption-related packages, add your nearest mirror of
    the non-U.S. archive—give the details for this in exactly the way you did the
    main archive. If you plan to move the contrib and non-free packages out of the
    main Debian archives and onto their own servers ahead, you will probably also
    want to add an extra source list entry for these packages.'
