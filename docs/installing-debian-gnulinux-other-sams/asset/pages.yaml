    # # Reporting a Bug


    Debian has a good reputation as a stable, reliable distribution. In part, this
    reputation can be attributed to the sophisticated bug-tracking software. This
    software records all bug reports, and tracks their status until a package maintainer
    declares that they are fixed. The Debian database has a home on the Web: just
    browse this page, http://www.debian.org/Bugs.


    Once you are there, you can type the name of any Debian package into a text field
    and obtain a complete listing of all outstanding bug reports relating to that
    package.


    It is also possible to retrieve information on bugs by email, but this is usually
    more useful to package maintainers. Documentation on advanced uses of the bug
    tracking software is available from the home page.


    If you find a bug yourself, obviously you should report it. There is a certain
    skill involved in writing good bug reports—the description of the problem should
    generally be concise, but in all cases should contain enough information to help
    the package maintainer (or else) reproduce the problem. The first stage is to
    carry out a little experimentation yourself. Can you make the bug recur? What
    is the simplest sequence of commands (or input file) that triggers the problem?


    Bug reports are submitted to the database as email messages. You can do this manually
    by following the documentation for the bug-tracking system, but it is normally
    easier to install the bug package. This package helps you to assemble a bug report
    in the appropriate format, and then sends it on its way. To use it, you need to
    have an email transport system set up properly. The bug report will have its From:
    line based on your computer''s mail name, which you set when you installed the
    exim system. If you are not confident that this will be a valid email address,
    the EMAIL environment variable, as described in Chapter 8. "Advanced Configuration."
    For instance


    ```

    export EMAIL=nick@solar-spice.com

    ```


    The bug program will start a text editor so you can enter a description of the
    bug. You might want to set the EDITOR variable to the name of your favorite text
    editor.


    When you run it, it will ask you for the name of the Debian package that contains
    the bug. It will consult the package database to determine the version of the
    package you are using, and also details about all those packages on which the
    buggy package depends. Then you will be asked for a brief description of the bug.
    This will make up your Subject: line of the email message, and will appear on
    the bug listing Web page.'
