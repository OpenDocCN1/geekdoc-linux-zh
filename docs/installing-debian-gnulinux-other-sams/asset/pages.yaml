- img_proc: true
  md: '# Linux and the GNU System 195


    work together well. In fact, adding Linux to the GNU system brought the system
    to completion: it made a free UNIX-compatible operating system available for use.


    But ironically, the practice of calling it a “Linux system” undermines our method
    of communicating the GNU idea. At first impression, a “Linux system” sounds like
    something completely distinct from the “GNU system.” And that is what most users
    think it is.


    Most introductions to the “Linux system” acknowledge the role played by the GNU
    software components. But they don’t say that the system as a whole is more or
    less the same GNU system that the GNU project has been compiling for a decade.
    They don’t say that the idea of a free UNIX-like system originates from the GNU
    project. Most users don’t know these things.


    This leads many of those to identify themselves as a separate community of “Linux
    users”, distinct from the GNU user community.


    They use all of the GNU software; in fact, they use almost all of the GNU system;
    but they don’t think of themselves as GNU users, and they may not think about
    the GNU idea.


    It leads to other problems as well—even hampering cooperation on software maintenance.
    Normally when users change a GNU program to make it work better on a particular
    system; they send the change to the maintainer of that program; then they work
    with the maintainer, explaining the change, arguing for it and sometimes rewriting
    it, to get it installed.


    But people who think of themselves as “Linux users” are more likely to release
    a forked “Linux-only” version of the GNU program, and consider the job done. We
    want and every GNU program to work “out of the box” on Linux-based systems; but
    if the users do not help, that goal becomes much harder to achieve.


    So how should the GNU project respond? What should we do now to spread the idea
    that freedom for computer users is important?


    We continue to talk about the freedom to share and change software—and to teach
    other users to value these freedoms. If we enjoy having a free operating system,
    it makes sense for us to think about preserving these freedoms for the long term.
    If we enjoy having a variety of free software, it makes sense for us to think
    about encouraging others to write additional free software, instead of additional
    proprietary software.


    We should not accept the splitting of the community in two. Instead we should
    spread the word that “Linux systems” are variant GNU systems—that users of these
    systems are GNU users, and that they ought to consider the GNU philosophy which
    brought these into existence.


    This article is one way of doing that. Another way is to use the terms “Linux-based
    GNU system” (or “GNU/Linux system” or “Lignux” for short) to refer to the combination
    of the Linux kernel and the GNU system.


