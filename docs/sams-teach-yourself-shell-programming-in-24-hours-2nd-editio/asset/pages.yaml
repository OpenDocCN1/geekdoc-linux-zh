    \ | awk 'NR != 1 { print $4; }'\n```\n\nYou use the awk expression\n\n```\nNR\
    \ != 1\n```\n\nto skip the header in the first line of the output. For more information\
    \ on awk, review Chapter 17, “Filtering Text with awk.”\n\nThe following example\
