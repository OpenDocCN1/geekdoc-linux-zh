    # Terms


    **Anchoring** Anchoring a regular expression limits matches to lines that begin
    or end with the expression.


    **Escaping** Preceding a meta-character with a \ is called escaping. An escaped
    meta-character is treated literally.


    **Meta-Characters** Meta-characters are characters that have a special meaning
    inside a regular expression; they are expanded to match ordinary characters.


