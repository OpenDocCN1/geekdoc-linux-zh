- pgno: 302
  md: "only for actions that contain more than one statement, but most programmers\
    \ include them for the sake of clarity and maintainability.\n\nAs an example,\
    \ you can rewrite the while loop in the previous example using a do loop:\n\n\
    ```\n#!/bin/sh\nawk '{\nx+=F;\ndo {\nprintf(\"%ld\\t% s\", $x);\nx-=1;\n} while(x>0);\n\
    print \"\";\n}' fruit_prices.txt\n```\n\n![](img/3def70414996f811615f713b2077a154_302_0.png)\n\
    \n> The behavior of the do statement varies among nawk, gawk, and awk. If you\
    \ want to use the statement, you should stick to nawk or gawk because older versions\
    \ of awk might have trouble with it. If you are concerned with portability to\
    \ older versions of UNIX, you should avoid using the do statement.\n\n# The for\
    \ Statement\n\nThe for statement enables you to repeat commands a certain number\
    \ of times. The for loop in awk is similar to the for loop in the C language.\
    \ The for loop has a counter that is initialized before the loop starts executing.\
    \ At the beginning of every iteration, the value of the counter is compared to\
    \ a predefined value. The loop executes when the comparison is true. If the comparison\
    \ is false, the loop terminates. Every time the loop executes, the counter is\
    \ incremented. This is quite different from the for loop in the shell, which executes\
    \ a set of commands for each item in a list.\n\nThe basic syntax of the for loop\
    \ is\n\n```\nfor (init_entr; test_entr; incr_entr) {\n    action\n}\n```\n\nHere\
    \ init_entr initializes the counter variable, test_entr is an expression that\
    \ tests the counter variable's value, and incr_entr increments the value of the\
    \ counter. The parentheses surrounding the expression used by the for loop are\
    \ required. The actions that should be performed, action, are any sequence of\
    \ valid awk commands. The braces surrounding the action are required only for\
    \ actions that contain more than one statement, but most programmers always include\
    \ them for the sake of clarity and maintainability."
  merge: -1
  img_proc: true
