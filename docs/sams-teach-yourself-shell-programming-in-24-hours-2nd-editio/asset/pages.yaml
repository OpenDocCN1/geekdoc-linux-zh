    \ *) PS=\"/bin/ps -ef\" ;;\nesac\n\ncase \"$1\" in\n    start)\n        if [ !\
    \ -x \"$PGM\" ] ; then\n            echo \"Error: Not Executable: $PGM\" 1>&2\n\
    \            exit 1\n        fi\n\n        RUNNING=`PS | grep \"$PGM\" | grep\
