    # Arguments


    Just as you can execute commands with arguments, you can also execute functions
    with arguments. The general syntax for invoking a function is as follows:


    ```

    name arg1 ... argN

    ```


    Here, name is the name of the function and arg1 ... argN are the arguments to
    the function. The arguments specified to a function are accessed in the same way
    as arguments specified to a shell script; the individual arguments are available
    as $1, $2, and so on, whereas the set of all the arguments is available as $0.


    The following function illustrates the use of individual arguments:


    ```

    ```sh

    printMsg () { echo "$1: $2" ; }

    ```

    ```


    This function uses echo to print a message with a colon, :, which separates the
    first two arguments when it''s executed as follows:


    ```

    printMsg Error Failed

    ```


    the output is


    ```

    Error: Failed

    ```


    As defined, this function can handle only two arguments; it ignores all the others.
    In order to make the function a bit more useful, it needs to be able to handle
    an arbitrary number of arguments. Because all of the arguments specified to a
    function are available in the variable $*, you can use it as follows:


    ```

    ```sh

    printMsg() {

    PREFIX="$1"

    shift

    echo "$PREFIX: $*"

    }

    ```

    ```


    Here, you have redefined the function printMsg. It saves its first argument in
    $PREFIX and then uses echo to print the message in the desired format. You use
    shift to remove'
