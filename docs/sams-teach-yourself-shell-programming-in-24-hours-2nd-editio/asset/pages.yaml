  md: "file, but often you need more control over lines that are displayed. The head\
    \ and tail commands provide some of this control.\n\n# The head Command\n\nThe\
    \ head command is used to display the first few lines of a file. Its basic syntax\
    \ is\n\n```\nhead [-n lines] files\n```\n\nHere files is the list of the files\
    \ you want the head command to process. Without the -n lines option, the head\
    \ command shows the first 10 lines of its standard input. When this option is\
    \ specified, head shows the number of lines specified by lines instead.\n\n![](img/3def70414996f811615f713b2077a154_247_0.png)\n\
    \n> On some versions of Linux the output from the -n lines option might include\
    \ one line less than the number of lines you specified. For example, the command:\n\
    > \n> $ head -n 5 file\n> \n> may produce only four lines of output rather than\
    \ the expected five.\n\nAlthough this command is useful for viewing the tops of\
    \ large README files, its real power happens in daily applications. Consider the\
    \ following problem: you need to generate a list of the five most recently accessed\
    \ files in a directory. You can devise a solution to this problem by breaking\
    \ the problem down. First, you can generate a list of the files in the directory\
    \ using the ls -l command. For example, if you are interested in the files in\
    \ the directory /home/ranga/public_html, you can use the following command:\n\n\
    ```\n$ ls -l /home/ranga/public_html\n```\n\nIn this case, the following list\
