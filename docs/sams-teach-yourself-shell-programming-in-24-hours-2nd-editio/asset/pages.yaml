    Returning to the original problem, you need uniq to print not only a list of the
    unique words, but also the number of times a word occurs. You can do this by specifying
    the -c (short for count) option of the uniq command:


    ```

    $ tr ''[:?{}[]()|\\.,;!"'''']'' ''\n'' < ch15.doc | tr ''A-Z'' ''a-z'' | tr -s
    '' '' | tr '' '' ''\n'' | sort | uniq -c

    ```


    # Sorting Numbers


    At this point the output is sorted alphabetically. Although this is useful, it
    is much easier to determine the most frequently used words if the list is sorted
    by the number of times a word occurs. To obtain such a list, you need sort to
    sort by numeric value instead of string comparison. It would also be nice if the
    largest values were printed first. By default, sort prints the largest values
    last. To satisfy both of these requirements, you need to use the -n (short for
    numeric) and -r (short for reverse) options of the sort command:'
