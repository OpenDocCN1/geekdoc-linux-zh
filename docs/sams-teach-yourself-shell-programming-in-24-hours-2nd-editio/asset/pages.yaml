- pgno: 212
  md: '# Hour 13


    # Parameters


    As you saw in previous chapters, the general format for the invocation of programs
    in UNIX is


    ```

    cmd opts files

    ```


    Here *cmd* is the command name, *opts* is any option that you need to specify,
    and *files* is an optional list of files on which the command should operate.


    Consider the following example:


    ```

    $ ls -l *.doc

    ```


    Here ls is the command, -l is the only option, and *.doc is the list of files
    for ls to operate on.


    Because most UNIX users are familiar with this interface, it is best to use this
    format in shell scripts. This means that scripts that can have options must be
    able to read and interpret them correctly.


    This chapter examines the following topics related to the handling of options
    passed to a shell script:


    +   - Special variables related to option parsing and command execution

    +   - Handling options manually using a case statement

    +   - Handling options using the getopts command


    ![](img/3def70414996f811615f713b2077a154_212_0.png)'
  merge: -1
  img_proc: true
- pgno: 213
  md: "For scripts that support only one or two options, the first method is easy\
    \ to implement and works quite well, but many scripts allow any combination of\
    \ several options to be given. For such scripts, the getopts command is very useful\
    \ because it affords the maximum flexibility in parsing options.\n\n# Special\
    \ Variables\n\nThe shell defines several special variables that are relevant to\
    \ option parsing and command execution. Table 13.1 describes all of these special\
    \ variables.\n\nTable 13.1 Special Shell Variables\n\n| Variable | Description\
    \ |\n|---|---|\n| $0 | The name of the command being executed. For shell scripts,\
    \ this is the path which invoked it. |\n| $n | These variables correspond to the\
    \ arguments with which a script was invoked. Here n is a positive decimal number\
    \ corresponding to the position of an argument (the first argument is $1, the\
    \ second argument is $2, and so on). |\n| $# | The number of arguments supplied\
    \ to a script. |\n| $* | All the arguments are double quoted. If a script receives\
    \ two arguments, $* is equivalent to \"$1 $2\". |\n| $@ | All the arguments are\
    \ individually double quoted. If a script receives two arguments, $@ is equivalent\
    \ to \"$1\" \"$2\". |\n| $? | The exit status of the last command executed. |\n\
    | $$ | The process number of the current shell. For shell scripts, this is the\
    \ process ID under which they are executing. |\n| $! | The process number of the\
    \ last background command. |\n\n# Using $0\n\nLet's start by looking at $0. This\
    \ variable is commonly used to determine the behavior of scripts that can be invoked\
    \ with more than one name. Consider the following script:\n\n```\n```sh\n#!/bin/sh\n\
    case $0 in\n  \"*listar\") TARGS=\"-tvf $1\" ;;\n  \"*maketar\") TARGS=\"-cvf\
    \ $1.tar $1\" ;;\nesac\ntar $TARGS\n```\n```"
  merge: -1
  img_proc: true
- pgno: 214
  md: 'You can use this script to list the contents of a tar file (short for tape
    archive, a common format for distributing files in UNIX) or to create a tar file
    based on the name with which the script is invoked. The tar file to read or create
    is specified as the first argument, $1, to the script.


    Let''s call this script mytar and make two symbolic links to it, called listtar
    and maketar, as follows:


    ```

    $ ln -s mytar listtar

    $ ln -s mytar maketar

    ```


    If the script is invoked with the name maketar and is given a directory or filename,
    it creates a tar file with the contents of that directory or file. Say you have
    a directory called fruits with the following contents:


    ```

    $ ls fruits

    apple banana mango peach pear

    ```


    You can invoke the script as maketar to obtain a tar file called fruit.tar containing
    this directory, by issuing the following command:


    ```

    $ ./maketar fruits

    ```


    If you want to list the contents of the tar file this command creates, you can
    invoke the script as follows:


    ```

    $ ./listtar fruits.tar

    rw-r--r-- 500/100 0 Nov 17 08:48 1998 fruits/

    rw-r--r-- 500/100 0 Nov 17 08:48 1998 fruits/apple

    rw-r--r-- 500/100 0 Nov 17 08:48 1998 fruits/banana

    rw-r--r-- 500/100 0 Nov 17 08:48 1998 fruits/mango

    rw-r--r-- 500/100 0 Nov 17 08:48 1998 fruits/pear

    rw-r--r-- 500/100 0 Nov 17 08:48 1998 fruits/peach

    ```


    The exact output depends on the version of tar on your system. Some versions include
    more detailed output than is shown here.


    # Usage Statements


    Another common use for $0 is in the usage statement of a script. The usage statement
    is a short message that a script outputs in order to inform a user of the proper
    invocation syntax for the script. All scripts used by more than one user should
    include usage statements.


    In general, the usage statement is something like the following:


    ```

    echo "Usage: $0 [options][files]"

    ```'
  merge: -1
  img_proc: true
- pgno: 215
  md: "Returning to the mytar script, adding a usage statement would be a helpful,\
    \ especially if the script is executed with a name other than listtar or naketar.\
    \ You can implement this change as follows:\n\n```\ncase $0 in\n  \"*listtar\"\
    ) TARGS=\"-tvf $1\" ;;\n  \"*naketar\") TARGS=\"-cvf $1.tar $1\" ;;\n  *) echo\
    \ \"Usage: $0 [file/directory]\" ; exit 0 ;;\nesac\n```\n\nNow if the script is\
    \ invoked as say, mytar, it will output the following message:\n\nUsage: mytar\
    \ [file/directory]\n\nAlthough this message describes the usage of the script\
    \ correctly, it does not inform you that the script's name was given incorrectly.\
    \ There are two possible methods for rectifying this:\n\n+   - Hard coding the\
    \ valid names in the usage statement\n+   - Changing the script to use its arguments\
    \ to decide in which mode it should run\n\nTo demonstrate the use of options,\
    \ the next section uses the latter method.\n\n# Options and Arguments\n\nOptions\
    \ are given on the command line to change the behavior of a script or program.\
    \ For example, the -a option of the ls command changes the behavior of the ls\
    \ command from listing all visible files to listing all files (as explained in\
    \ Chapter 3). This section shows you how to use options to change the behavior\
    \ of scripts.\n\nOften you will see or hear options called arguments. The difference\
    \ between the two is subtle. A command's arguments are all of the separate strings\
    \ or words that appear on the command line after the command name, whereas options\
    \ are only those arguments that change the behavior of the command.\n\nFor example,\
    \ in the following example:\n\n```\n$ ls -aF fruit\n```\n\nthe command is ls,\
    \ and its arguments are -aF and fruit. The options to the ls command are -aF."
  merge: -1
  img_proc: true
- pgno: 216
  md: "# Dealing with Arguments\n\nTo illustrate the use of options, let's change\
    \ the nytar script to use its first argument, $1, as the mode argument and $2\
    \ as the tar file to read or create. You can implement this change as follows:\n\
    \n```\nUSAGE=\"usage: $0 [-c|-t] [file|directory]\"\ncase \"$1\" in\n  -t) TARGS=\"\
    -tvf $2\" ;;\n  -c) TARGS=\"-cvf $2 $2\" ;;\n  *) echo \"$USAGE\"\n     exit 0\n\
    \     ;;\nesac\n```\n\nThe three main changes are as follows:\n\n+   - All references\
    \ to $1 have been changed to $2 because the second argument is now the filename.\n\
    +   - listtar has been replaced by -t.\n+   - maketar has been replaced by -c.\n\
    \nNow running nytar produces the following output:\n\nUsage: ./nytar [-c|-t] [file|directory]\n\
    \nTo create a tar file of the directory fruits with this version, use the command\n\
    \n```\n$ ./nytar -c fruits\n```\n\nTo list the contents of the resulting tar file,\
    \ fruits.tar, use the command\n\n```\n$ ./nytar -t fruits\n```\n\n# Using basename\n\
    \nCurrently, the usage statement of nytar outputs the entire path with which the\
    \ script was invoked. What it should really output is just the name of the script.\
    \ You can correct this by using the basename command.\n\nThe basename command\
    \ takes an absolute or relative pathname to a file or directory and returns just\
    \ the file or directory name from that path. The basic syntax is as follows:\n\
    \n```\nbasename file\n```\n\nFor example,\n\n```\n$ basename /usr/bin/sh\n```\n\
    \nprints the following:\n\n```\nsh\n```"
  merge: -1
  img_proc: true
- pgno: 217
  md: 'Using basename, you can change the variable $USAGE in the mytar script as follows:


    ```

    USAGE="Usage: basename $0 [-c|-t] [file|directory]"

    ```


    so that the usage statement produces the desired output:


    ```

    Usage: mytar [-c|-t] [file|directory]

    ```


    You can also use the basename command in the first version of the mytar script
    to avoid using the * wildcard character in the case statement:


    ```

    #!/bin/sh

    case `basename $0` in

    listtar) TARGB="-tvf $1" ;;

    maketar) TARGB="-cvf $1.tar $1" ;;

    *) echo "Usage: $0 [file|directory]"

    exit 0

    esac

    ;;

    tar $TARGB

    ```


    In this version, basename allows you to match the exact names with which scripts
    can be called. As an illustration of a potential problem with the original version,
    you can see that if the script is called


    ```

    $ ./makelisttar

    ```


    the original version would use the first case statement, even though it was incorrect,
    but the new version would fall through and report an error.


    # Emulating basename


    Some older Linux and BSD systems do not include the basename command. If you are
    using such a system, you can emulate this command by creating a shell script that
    provides the equivalent functionality. A shell script version of basename might
    look like the following:


    ```

    #!/bin/sh

    if [ -n "$1" ] ; then

    echo "$1" | sed ''s/.*\/[^\/]*$/''

    else

    echo ''Usage: basename [file]'' >&2

    exit 1

    fi

    exit 0

    ```


    Don''t worry if you don''t understand how the sed command works. You''ll read
    more about it in Chapter 16, "Filtering Text with Regular Expressions."'
  merge: -1
  img_proc: true
- pgno: 218
  md: "# Common Argument Handling Problems\n\nNow that the mytar script uses options\
    \ to set the mode in which the script will run, you need to solve another problem.\
    \ Namely, what should you do if the second argument, $2, is not provided? You\
    \ don't have to worry about what happens if the first argument, $1, is not provided\
    \ because the case statement deals with this situation via the default case, *.\n\
    \nThe simplest method for checking the necessary number of arguments is to see\
    \ whether the number arguments, $#, match the number of required arguments. You\
    \ can add this check to the script as follows:\n\n```\n#!/bin/sh\n\nUSAGE=\"Usage:\
    \ basename $0 [-c|-t] [file|directory]\"\n\nif [ $# -lt 2 ] ; then\n    echo \"\
    $USAGE\"\n    exit 1\nfi\n\ncase \"$1\" in\n    -t) TARGS=\"-tvf $2\" ;;\n   \
    \ -c) TARGS=\"-cvf $2 $2\" ;\n    *) echo \"$USAGE\"\n    exit 0\n    ;;\nesac\n\
    \ntar $TARGS\n```\n\n# Handling Additional Files\n\nThe mytar script is mostly\
    \ finished, but you can still make a few improvements. For example, it only deals\
    \ with the first file that is given as an argument, and it does not determine\
    \ whether this argument is really a file.\n\nYou can add the processing of all\
    \ file arguments by using the special shell variable $@. Let's start by modifying\
    \ the -t option to work with this variable:\n\n```\ncase \"$1\" in\n    -t) TARGS=\"\
    -tvf\"\n        for i in \"$@\"\n        do\n            if [ -f \"$i\" ] ; then\n\
    \                tar $TARGS \"$i\"\n            fi\n        done\n        ;;\n\
    \    -c) TARGS=\"-cvf $2 $2\" ;\n```"
  merge: -1
  img_proc: true
- pgno: 219
  md: "```\ntar STARGS\n? )\n*) echo \"USAGE\" ;\nexit 0\n;;\nesac\n```\n\nThe main\
    \ changes are\n\n+   - The -t case now includes a for loop that processes the\
    \ arguments.\n+   - There is an if statement in the for loop that determines whether\
    \ the argument is a file. If an argument is a file, tar is executed on that file.\n\
    \n> **$* and $@**\n> The arguments specified to a shell script are stored in two\
    \ special variables, $* and $@. The main difference between these two special\
    \ variables is how they store arguments: $* stores each argument without preserving\
    \ quoting, whereas $@ stores each argument by preserving quoting.\n> \n> The behavior\
    \ of $* can sometimes cause a problem. For example, if your script has a file\
    \ name containing spaces as an argument:\n> mytar -t 'my tar file.tar'\n> using\
    \ $* instead of $@ would create a problem because the for loop would be executed\
    \ three times for files named my, tar, and file.tar, instead of just once for\
    \ the file you requested, my tar file.tar. By using $@, you avoid this problem\
    \ because each argument is stored as it was quoted on the command line.\n\n# A\
    \ Few Minor Issues\n\nThere are two minor issues in mytar that you should deal\
    \ with:\n\n+   - mytar treats all its arguments, including the first argument,\
    \ $1, as files. Because you are using the first argument to indicate the mode\
    \ in which the script runs you should not consider it as a file. This will reduce\
    \ the number of times the for loop is executed, and will prevent the script from\
    \ trying to run tar on a file with the name -t.\n+   - Another issue involves\
    \ what the script should do when an operation fails. In the case of the list operation,\
    \ if tar cannot list the contents of a file, you should skip the file and print\
    \ an error."
  merge: -1
  img_proc: true
- pgno: 220
  md: "You can solve the first issue by using shift to remove the first argument.\
    \ You can solve the second issue by using the variable $? to check the exit status\
    \ of tar. If you implement these changes, your script becomes:\n\n```\n#!/bin/sh\n\
    \nUSAGE=\"usage: `basename $0` [-c|-t] [files|directories]\"\n\nif [ $# -lt 2\
    \ ] ; then\n  echo \"$USAGE\" ;\n  exit 1 ;\nfi\n\ncase \"$1\" in\n  -t) shift\n\
    \      TARGS=\"-tvf\" ;\n      for i in $* ;\n      do\n        if [ -f \"$i\"\
    \ ] ; then\n          FILES=`tar $TARGS $i 2>/dev/null`\n          if [ $? -eq\
    \ 0 ] ; then\n            echo ; echo \"$FILES\"\n          else\n           \
    \ echo \"ERROR: $i not a tar file.\"\n          fi\n        else\n          echo\
    \ \"ERROR: $i not a file.\"\n        fi\n      done\n      ;;\n  -c) shift\n \
    \     TARGS=\"-cvf\" ;\n      TARGS_ARCHIVE.tar $*\n      ;;\n  *) echo \"$USAGE\"\
    \n     exit 0\n     ;;\nesac\nexit $?\n```\n\n# Option Parsing in Shell Scripts\n\
    \nIn the previous example, you manually handled the options passed to your script.\
    \ In this second example, you will explore a second method, using the getopts\
    \ command. The syntax of the getopts command is as follows:\n\n```\ngetopts option-string\
    \ var\n```"
  merge: -1
  img_proc: true
- pgno: 221
  md: 'Here option-string is a string consisting of all the single character options
    getopts should consider and var is the name of the variable that the option should
    be set to. Usually var is a variable named OPTION.


    The process by which getopts parses the options given on the command line is as
    follows:


    +   1. getopts examines all the command-line arguments, looking for arguments
    starting with the - character.

    +   2. When an argument starting with the - character is found, it compares the
    characters following the - to the characters given in the option-string.

    +   3. If a match is found, the specified var is set to the option; otherwise,
    var is set to the ? character.

    +   4. Steps 1 through 3 are repeated until all the options have been considered.

    +   5. When parsing has finished, getopts returns a nonzero exit code. This allows
    it to be easily used in loops. Also, when getopts has finished, it sets the variable
    OPTIND to the index of the last argument.


    Another feature of getopts is its capability to indicate options requiring an
    additional parameter. This can be accomplished by following the option with a
    colon, :; character. In this case, after an option is parsed, the additional parameter
    is set to the value of the variable named OPTARG.


    ![](img/3def70414996f811615f713b2077a154_221_0.png)


    > Some early versions of bash (1.x) did not completely support the getopts command.
    If you are using an older version of bash, you might encounter some errors when
    executing the examples in this section. If possible, you should upgrade to bash
    2.0 or newer or use an alternate shell such as ksh or zsh when executing these
    examples.


    # Using getopts


    To get a feeling for how getopts works and how to deal with options, you will
    write a script that simplifies the process of uuencoding a file.


    For readers who are not familiar with uuencode, it is a program that was originally
    used to encode binary files (executable files) into ASCII text so that they could
    be mailed or transferred via FTP. Today, MIME encoding has taken the place of
    uuencoding for e-mail attachments, but it is still used for posting binaries to
    newsgroups and transferring binaries via modem.'
  merge: -1
  img_proc: true
- pgno: 222
  md: "You'll first examine the interface of this script, which makes it easier to\
    \ understand the implementation. Your script should be able to accept the following\
    \ options:\n\n+   - -f to indicate the input filename\n+   - -o to indicate the\
    \ output filename\n+   - -v to indicate the script should be verbose\n\nThe getopts\
    \ command to implement these requirements is\n\n```\ngetopts e:o:v OPTION\n```\n\
    \nThis indicates that all the options except for -v require an additional parameter.\
    \ The support variables that are required are\n\n+   - VERBOSE, which stores the\
    \ value of the verbose flag. By default, the value of this variable is false.\n\
    +   - INFILE, which stores the name of the input file.\n+   - OUTFILE, which stores\
    \ the name of the output filename. If this value is unset, uudecode uses the same\
    \ name as the input file and appends the .uu extension to it.\n\nThe following\
    \ loop implements these requirements:\n\n```\nVERBOSE=false\nwhile getopts f:o:v\
    \ OPTION ;\ndo\n  case \"$OPTION\" in\n    f) INFILE=\"$OPTARG\" ;;\n    o) OUTFILE=\"\
    $OPTARG\" ;;\n    v) VERBOSE=true ;;\n    ?) echo \"$USAGE\" ;\n       exit 1\n\
    \  esac\ndone\n```\n\nNow that you have dealt with option parsing, you need to\
    \ deal with error conditions. For example, what should your script do if the input\
    \ file is not specified? The simplest behavior would be to exit with an error,\
    \ but with a little more work, you can make the script much more user friendly.\n\
    \nBy using the fact that getopts sets the variable OPTIND to the value of the\
    \ last option that was scanned, you can have the script assume that the first\
    \ argument after this is the input filename. If no additional arguments remain,\
    \ you should exit. Your error checking can be implemented as follows:\n\n```\n\
    shift `echo \"$OPTIND - 1\" | bc`\nif [ -z \"$1\" -a -z \"$INFILE\" ] ; then\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 223
  md: '```

    echo "ERROR: Input file was not specified."

    exit 1


    f1


    if [ -z "$INFILE" ] ; then

    INFILE="$1"


    f1

    ```


    Here you use the shift command to discard the arguments given to the script by
    one minus the last argument processed by getopts. The exact number of arguments
    to shift is calculated by the $# command, which is a command-line calculator.
    Its usage is explained in detail in Chapter 18. Strictly speaking, you do not
    have to shift the arguments; it just simplifies the $1 statement.


    After shifting the arguments, you need to check whether the new $1 contains a
    value. If it does not contain a value, you output an error message and exit; otherwise,
    you set INFILE to the filename specified by $1.


    You also need to set the output filename, in case the -o option was not specified.
    You can use variable substitution to accomplish this


    ```

    : ${OUTFILE:=${INFILE}.uu}

    ```


    Here you set the name of the output file to the input file plus the .uu extension,
    if an output file is not given. You use the : command to prevent the shell from
    trying to execute the result of the variable substitution.


    After you have made sure that all the inputs are correct, the actual work is quite
    simple. The uudecode command that you use is as follows:


    ```

    uudecode $INFILE > $OUTFILE ;

    ```


    You should also check whether the input file is really a file before doing this
    command, so the actual body of your program is:


    ```

    if [ -f "$INFILE" ] ; then

    uudecode "$INFILE" "$INFILE" > "$OUTFILE" ;

    f1

    ```


    At this point the script is fully functional, but you still need to add support
    for verbose reporting. This changes the preceding if statement to the following:


    ```

    if [ -f "$INFILE" ] ; then

    if [ "$VERBOSE" = "true" ] ; then

    echo "uencoding $INFILE to $OUTFILE..." \c

    f1

    uudecode "$INFILE" "$INFILE" > "$OUTFILE"

    RET=$?

    if [ "$VERBOSE" = "true" ] ; then

    ```'
