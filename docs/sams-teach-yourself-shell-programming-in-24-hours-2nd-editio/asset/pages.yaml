- pgno: 286
  md: 'Here you have two patterns: The first one looks for fruit priced higher than
    a dollar, and the second one looks for fruit priced lower than a dollar. When
    a fruit priced higher than a dollar is encountered, the three fields are output
    with a * at the end of the line. For all other fruit, the line is printed exactly
    as it was read.


    Assuming that this script is called fruit_prices.sh and is located in the current
    directory, it can be invoked as follows:


    ```

    $ ./fruit_prices.sh

    ```


    The output looks like the following:


    ```

    Banana $0.69 100

    Peach $0.79 65

    Kiwi $1.50 22 *

    Pineapple $1.29 35

    Apple $0.99 78

    ```


    One problem here is that the lines you wanted to flag with the * are no longer
    formatted in the same manner as the other lines. You could solve this problem
    using print, but a much simpler solution is to use the $0 field. The variable
    $0 is used by awk to store the entire input line as it was read.


    Let''s change the script as follows:


    ```

    #!/bin/sh

    awk

    / *$1[1-9][0-9]\.[0-9][0-9] */ { print $0,"*"; }

    / *$0.[0-9][0-9] */ { print ; }

    '' fruit_prices.txt

    ```


    This changes the output so that all the lines are formatted correctly:


    ```

    $ ./fruit_prices.sh

    Banana $0.69 100

    Peach $0.79 65

    Kiwi $1.50 22 *

    Pineapple $1.29 35 *

    Apple $0.99 78

    ```


    # Comparison Operators


    Now say that you have to flag all the fruit whose quantity is less than 75 for
    reorder by appending the string REORDER. In this case you have to check whether
    the third field, which holds the quantity, is less than or equal to 75.


    To solve this problem, you need to use a comparison operator. In awk, comparison
    operators compare the values of numbers and strings. Their behavior is similar
    to operators'
