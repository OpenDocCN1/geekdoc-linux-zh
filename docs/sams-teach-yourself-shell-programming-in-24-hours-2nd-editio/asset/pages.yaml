  md: '# Dedication


    *For my grandmother, who taught me to love the English language.*


    *For my mother, who taught me to love programming languages.*


    # Acknowledgments


    Writing a book on shell programming is a daunting task, due to the myriad UNIX
    versions and shell versions that are available. Thanks to the hard work of my
    development editor Steve Rowe, my technical editor Michael Watson, and my copy
    editor Kezia Endsley, I was able to make sure the book covered the material completely
    and correctly. Their suggestions and comments have helped enormously.


    In addition to the technical side of the book, the task of coordinating and managing
    the publishing process is a difficult one. The assistance of my acquisitions editor,
    Kathryn Purdam, in handling all of the editorial issues and patiently working
    with me to keep this book on schedule was invaluable.


    Working on a book takes a lot of time and makes it difficult to concentrate on
    work and family activities. Thanks to the support of my manager, Larry Coryell,
    my parents, my brother Srivathsa, and my uncle and aunt Srinivasa and Suma, I
    was able to balance work, family, and authoring.


    Thanks to everyone else on the excellent team at Sams who worked on this book.
    Without their support, this book would not exist.'
