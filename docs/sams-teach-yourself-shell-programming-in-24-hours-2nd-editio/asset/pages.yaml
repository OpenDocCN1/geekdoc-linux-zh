  md: '```

    $3 > 75 { print $0 ; }

    '' fruit_prices.txt

    ```


    Clearly it is performing more work than it needs to. For example, when the input
    line is


    Kiwi    $1.50      22


    the execution of the script is as follows:


    +   1. Checks whether the value of the third column, 22, is less than 75. Because
    the value is less than 75, the script proceeds to step 2.

    +   2. Prints the input line followed by REORDER.

    +   3. Checks whether the value of the third column, 22, is greater than 75. Because
    the value is not greater than 75, the script reads the next line.


    There is no real need to execute step 3 because step 2 has already printed a line.
    To prevent step 3 from executing, you can use the next command. The next command
    tells awk to skip all the remaining patterns and expressions and instead read
    the next input line and start from the first pattern or expression.


    Let''s change the script to use the next command:


    ```

    #!/bin/sh

    awk ''

    $3 <= 75 { print "$1\"is\"$0,\"REORDER\" ; next ; }

    $3 > 75 { print $0 ; }

    '' fruit_prices.txt ;

    ```


    Now when the line:


    Kiwi    $1.50      22


    is encountered, the execution of the script is as follows:


    +   1. Checks whether the value of the third column, 22, is less than 75. Because
    the value is less than 75, the script proceeds to step 2.

    +   2. Prints the input line followed by REORDER.

    +   3. Reads the next input line and starts over with the first pattern.


    As you can see, the second comparison ($3 > 75) is never performed for this input
    line.


    # Using STDIN as Input


    Recall that the basic form of an awk command is


    ```

    awk ''script'' files

    ```'
