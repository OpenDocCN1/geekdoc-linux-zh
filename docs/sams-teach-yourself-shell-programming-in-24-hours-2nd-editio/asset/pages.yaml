  md: "# Reserved Words and Built-in Shell Commands\n\nMost of the following commands\
    \ are built-in commands; they are present within the shell and are not external\
    \ programs. Some of the shells discussed in this book do not contain all of these\
    \ commands, so those commands that are restricted to a particular shell or shells\
    \ are noted as so in the description of that command.\n\nAlthough most of these\
    \ commands functions the same under the shells covered in this book, some do not.\
    \ This appendix describes the commands in general, for the specific information\
    \ for your system you should consult the man page for the command of interest\
    \ using the man command.\n\n. (period) executes a script in the current shell\
    \ rather than as a child process.\n\n: (colon) no-op command. It does nothing,\
    \ but the shell still processes the arguments of this command for variable and\
    \ command substitution.\n\nalias (ksh, bash and zsh only) creates a short name\
    \ for the command.\n\nbg (Korn/Bash) starts a suspended job running in background.\n\
    \nbreak exits from the current for, while, or until loop.\n\ncase executes the\
    \ commands corresponding to the pattern that matches expr. Patterns can use filename\
    \ expansion wildcards.\n\n```\ncase expr in\n  pattern1) list1 ;;\n  ...\n  patternN)\
    \ listN ;;\nesac\n```\n\ncd changes the directory. If an argument is specified,\
    \ cd changes the current directory to that directory (if possible). Otherwise\
    \ cd changes the directory to the user's home directory.\n\ncontinue skips the\
    \ rest of the commands in a loop and starts the next iteration of a loop.\n\n\
    do indicates the start of the body of a loop.\n\ndone indicates the end of the\
    \ body of a loop.\n\necho displays its arguments to standard output. In ksh, bash,\
    \ and zsh echo is a built-in command. In the Bourne shell it is an external command\
    \ located in /bin/echo.\n\nesac denotes the end of a case statement.\n\neval causes\
    \ the shell to reinterpret the command that follows."
