- pgno: 404
  md: '![](img/3def70414996f811615f713b2077a154_404_0.png)


    # Hour 23


    # Scripting for Portability


    Shell programming is an important part of UNIX because shell scripts are easily
    portable to many different versions of UNIX. In many cases, shell scripts will
    function correctly on multiple systems without modification.


    The easiest way to ensure that a shell script is completely portable is to restrict
    the script to using only those commands and features that are available on all
    versions of UNIX. Sometimes this means that the script must implement workarounds
    to deal with the limitations of a particular version of UNIX.


    In this chapter, we will examine the following topics that relate to shell script
    portability:


    +   - Determining the version of UNIX a system is running

    +   - Adapting shell scripts to different versions of UNIX'
  merge: -1
  img_proc: true
- pgno: 405
  md: '# Determining UNIX Versions


    Before you can begin adjusting shell scripts to be portable, you need to know
    what the different types of UNIX are and how to tell them apart. The three major
    types of UNIX are


    +   - BSD (Berkeley Software Distribution)

    +   - System V

    +   - Linux


    The locations of commands and the options supported by certain commands are different
    among these three types of UNIX. This chapter highlights some of the major differences
    pertaining to commands in particular.


    # BSD


    UNIX was first developed in the 1970s at AT&T''s Bell Labs. For many years it
    remained restricted to AT&T and a few universities. In the early 1980s, the University
    of California at Berkeley acquired the source code to UNIX from AT&T Bell Labs.
    Throughout the 1980s and into the early 1990s, the Berkeley Systems Research Group
    made significant improvements and advancements to UNIX. These improvements were
    periodically distributed under the name Berkeley Software Distribution or BSD.


    In the early 1990s, the Berkeley team disbanded and released the source code to
    the public. Several groups and companies adopted the BSD source and provided their
    own versions of BSD. The three major groups currently developing freely available
    versions BSD are


    +   - The FreeBSD Project: http://www.freebsd.org

    +   - The NetBSD Foundation: http://www.netbsd.org

    +   - OpenBSD: http://www.openbsd.org


    Currently the two major companies involved in BSD development and distribution
    are Apple Computer and Wind River Systems. Apple''s MacOS X is based on FreeBSD.
    Wind River''s BSD/OS is also based on FreeBSD. Another commercial version of BSD
    is Sun Microsystems'' SunOS4. Sun has not supported or developed SunOS4 since
    the early 1990s, but it is still quite popular at some universities.


    # System V


    System V (sometimes abbreviated as SysV) is the latest version of UNIX released
    by AT&T Bell Labs. System V UNIX is the standard for most commercial versions
    of UNIX. Both Sun Microsystems'' Solaris and Hewlett-Packard''s HP-UX are based
    on System V UNIX.'
  merge: -1
  img_proc: true
- pgno: 406
  md: 'Some of the new features added to UNIX in System V are


    +   - A new boot system

    +   - A networking subsystem known as STREAMS

    +   - A process-to-process communication and memory sharing system

    +   - Standardized system administration tools

    +   - A prepackaged software installation and removal system


    System V UNIX also changed the layout of the file system. Table 23.1 lists the
    BSD directories and their System V equivalents.


    Table 23.1 System V Equivalents of BSD Directories


    | BSD | System V |

    |---|---|

    | /bin | /usr/bin |

    | /sbin | /usr/sbin |

    | /usr/adm | /var/adm |

    | /usr/mail | /var/mail or /var/spool/mail |

    | /usr/tmp | /var/tmp |


    The directories /bin and /sbin still exist on some System V-based UNIX versions.


    On Solaris, these directories are links to /usr/bin and /usr/sbin, respectively.
    On HP-UX, these directories still contain some commands essential at boot time.
    The commands stored in these directories are not the same commands as in BSD.
    Most vendors who have switched from BSD to System V still provide BSD versions
    in the directory /usr/ucb.


    In addition to these changes, many System V-based UNIX versions have introduced
    the directory /opt in an attempt to standardize the installation locations of
    prepackaged software products. On older systems, many different locations, including
    /usr, /usr/contrib, and /usr/local, were used to install optional software packages.


    # Linux


    Linux can be considered as a third version of UNIX. It was developed independent
    of either the BSD or the System V source code. Linux was written by Linus Torvalds
    at the University of Helsinki in the early 1990s. It incorporates the best features
    found in both System V and BSD. The commands and the networking layer in Linux
    are similar to BSD, whereas the standardized tools for system configuration and
    installation of prepackaged software are similar to System V. Some of the major
    vendors of Linux are Caldera, Debian, Mandrake, Red Hat, Slackware, and SuSE.'
  merge: -1
  img_proc: true
- pgno: 407
  md: '# Using uname to Determine the UNIX Version


    The first step in writing portable shell scripts is to determine which version
    of UNIX is executing your shell script. This can be determined this using the
    uname command:

    `uname options`


    Here, options is one or more of the options given in Table 23.2.


    **TABLE 23.2 Options for the uname Command**


    | Option | Description |

    |---|---|

    | -a | Prints all information |

    | -n | Prints the current hardware type |

    | -n | Prints the hostname of the system |

    | -r | Prints the operating system release level |

    | -s | Prints the name of the operating system (default) |


    ![](img/3def70414996f811615f713b2077a154_407_0.png)


    > On SunOS, the -a option of uname displays summary information about the system.
    To get complete information, use the -X option of uname.


    By default, the uname command prints the name of the operating system. The output
    looks like the following:


    ```

    $ uname

    Linux

    ```


    Here, the output indicates that the operating system name of the machine is Linux.
    Usually, this is enough to determine the UNIX version, as you can see from the
    values listed in Table 23.3.


    **TABLE 23.3 Selected UNIX Version names as Displayed by uname**


    | Name | Description |

    |---|---|

    | Linux | A system running Linux |

    | HP-UX | A system running Hewlett-Packard''s HP-UX |

    | FreeBSD | A system running FreeBSD |

    | OpenBSD | A system running OpenBSD |

    | Darwin | A system running Apple''s MacOS X |

    | SunOS | A system running Sun Microsystem''s SunOS (BSD based) or Solaris (System
    V based) |'
  merge: -1
  img_proc: true
- pgno: 408
  md: '# Dealing with SunOS


    SunOS is the name of the UNIX operating system developed by Sun Microsystems.
    SunOS was originally based on BSD UNIX but has since changed to be based on System
    V UNIX. Although the marketing name has been changed to Solaris, uname still produces
    the output SunOS. Shell scripts that have to run on both Solaris and earlier BSD-based
    versions of SunOS, such as SunOS4, need to differentiate between these two versions.


    To determine whether a system is running Solaris or SunOS, you can check the version
    of the operating system. SunOS versions 5 and higher are Solaris (System V-based);
    SunOS versions 4 and lower are SunOS (BSD-based).


    To determine the version of the operating system, you can use the -r option of
    uname:


    ```

    $ uname -r

    5.5.1

    ```


    This indicates that the version of the operating system is 5.5.1. If you want
    to add the operating system''s name to this output, use the -r and the -s options:


    ```

    $ uname -rs

    SunOS 5.5.1

    ```


    This indicates the machine is running Solaris. The output on a machine running
    BSD-based SunOS4 might be


    ```

    SunOS 4.1.3

    ```


    # Determining the Hardware Type


    Sometimes a shell script is written as a wrapper around a hardware-specific program.
    For example, install scripts are usually the same for different hardware platforms
    supported by a particular operating system. Although the install script might
    be the same for every hardware platform, the files that are installed are usually
    different.


    To determine the hardware type, you can use the -m option:


    ```

    $ uname -m

    sun4m

    ```


    Some common return values and their hardware types are listed in Table 23.4.


    **Table 23.4 Hardware Types Returned by the uname Command**


    | Hardware | Description |

    |---|---|

    | 9800/xxx | Hewlett-Packard 9000 series workstation. Some common values of xxx
    are 700, 712, 715, and 750. |

    | 1396 | Intel 386-, 486-, Pentium-, or Pentium II-based workstation. |'
  merge: -1
  img_proc: true
- pgno: 409
  md: "# Table 23.4 Continued\n\n| Hardware | Description |\n|---|---|\n| i586 | A\
    \ system using an Intel Pentium II, III, or newer processor. |\n| sun4x | A Sun\
    \ Microsystems workstation. Some common values of x are c (SparcStation 5 and\
    \ 2), n (SparcStation 5, 10, and 20), and u (UltraSparc). |\n| Power Macintosh\
    \ | An Apple Macintosh running MacOS X. |\n\n# Determining the hostname of a System\n\
    \nMany shell scripts need to check the hostname of a system. The traditional method\
    \ of doing this on BSD systems is to use the hostname command, as in the following\
    \ example:\n\n```\n$ hostname\nsoda.CSUA.Berkeley.EDU\n```\n\nIn System V and\
    \ Linux, the hostname command is not always available. The uname -n command should\
    \ be used instead:\n\n```\n$ uname -n\nkashi\n```\n\nBecause the uname -n command\
    \ is available on both System V and BSD UNIX, it is preferred for use in portable\
    \ shell scripts.\n\n# Determining the UNIX Version Using a Function\n\nYou have\
    \ just looked at using the uname command to gather information about the version\
    \ of UNIX that a particular system is running. Now you need a method for using\
    \ this information in a shell script. As you saw in Chapter 21, \"Problem Solving\
    \ with Functions,\" creating a shell function to perform this task will give you\
    \ the greatest flexibility:\n\n```\ngetOSName() {\ncase \"`uname -s`\" in\n*BSD)\n\
    \ echo bsd ;;\nDarwin)\n echo darwin ;;\nSunOS)\n case \"`uname -r`\" in\n 5.*)\
    \ echo solaris ;;\n *) echo sunos ;;\n esac\n ;;\nLinux)\n echo linux ;;\nHP-UX)\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 410
  md: "```\necho hpux ;;\nAIX)\n    echo aix ;;\n*)\n    echo unknown ;;\n}\n```\n\
    \nAs you can see, this function is not very complicated. It checks the output\
    \ of uname -s and looks for a match. In the case of SunOS, it also checks the\
    \ output of uname -r to determine whether the operating system is Solaris or SunOS.\n\
    \nIn many cases, you need to tailor the options of a command, such as ps or df,\
    \ for a particular system in order to obtain the desired output from that command.\
    \ In such cases, you need the capability to 'ask' whether the operating system\
    \ is of a certain type:\n\n```\nisOS() {\n    if [ $# -lt 1 ] ; then\n       \
    \ echo \"ERROR: Insufficient Aruments.\" >&2\n        return 1\n    fi\n    REG=`echo\
    \ $1 | tr '[A-Z]' '[a-z]'`\n    if [ \"$REG\" = \"`getOSName`\" ] ; then return\
    \ 0 ; fi\n    return 1\n}\n```\n\nThis function compares its first argument to\
    \ the output of the function getOSName and returns 0 (true) if they are the same;\
    \ otherwise, it returns 1 (false).\n\nUsing this function, it is possible to write\
    \ if statements similar to the following:\n\n```\nif isOS hpux ; then\n    # HP-UX\
    \ specific commands here\nelif isOS solaris ; then\n    # Solaris specific commands\
    \ here\nelse\n    # generic unix commands here\nfi\n```\n\n![](img/3def70414996f811615f713b2077a154_410_0.png)\n\
    \n> The reason that the isOS function does not directly check the value of $1,\
    \ but uses the variable REG instead, is to allow for greater flexibility on the\
    \ part of the function's user. For example, this implementation allows any of\
    \ the following to be used to check whether a system is running Linux:\n> isOS\
    \ LINUX\n> isOS Linux\n> isOS linux"
  merge: -1
  img_proc: true
- pgno: 411
  md: '# Techniques for Increasing Portability


    There are two common techniques to increase the portability of a shell script
    between different versions of UNIX:


    +   - Conditional execution

    +   - Abstraction


    Conditional execution alters the execution of a script based on the system type,
    whereas abstraction retains the same basic flow of the script by placing the conditional
    statements within functions.


    # Conditional Execution


    A script that uses conditional execution for portability contains an if statement
    at the beginning that sets several variables indicating the set of commands to
    use on a particular platform. This section looks at two common cases in which
    conditional execution is used:


    +   - Determining the remote shell command

    +   - Determining the proper method of using the echo command in prompts


    The first case illustrates setting a variable based on the operating system type.
    The second case illustrates setting variables based on the behavior of a command
    (echo) on a particular system.


    # Executing Remote Commands


    A common use of conditional execution is found in scripts that need to execute
    commands on remote systems. On most versions of UNIX, you can use the rsh (remote
    shell) command to execute commands on a remote system. Unfortunately, this command
    is not available on all versions of UNIX. On HP-UX, for example, rsh is available
    but it is not the remote shell program—it is the restricted shell program. On
    HP-UX, you need to use the command remsh to execute commands on a remote system.


    A script that needs to execute commands on a remote system might have an if statement
    of the following form at its beginning:


    ```

    if SystemIs HP_UX ; then

    RCMD=remsh

    else

    RCMD=rsh

    fi

    ```


    After the variable $RCMD is set, remote commands can execute as follows:


    ```

    "$RCMD" host command

    ```


    Here, host is the hostname of the remote system, and command is the command to
    execute.'
  merge: -1
  img_proc: true
- pgno: 412
  md: "# Problems with the echo Command in Prompts\n\nMost programs that need to prompt\
    \ the users need to be able to print a prompt that is not terminated by a newline.\
    \ In Chapter 5, \"Input and Output,\" there were several problems with using the\
    \ \\c escape sequence of the echo command to do this. The workaround was to use\
    \ the /bin/echo command.\n\nAlthough this works for UNIX versions based on System\
    \ V, on some BSD-based systems this does not work. You need to specify the -n\
    \ option to echo instead. By using the following shell script, you can create\
    \ a shell function, echo_prompt, to display a prompt reliably across all versions\
    \ of echo:\n\n```\n_ECHO=/bin/echo\n_N=\"-n\"\n_O=\"-c\"\nECHOTEST=`$ECHO \"hello\
    \ \\c\"`\nif [ \"$ECHOTEST\" = \"hello \\c\" ] ; then\n  _N=\"-n\"\n  _O=\"\"\n\
    fi\nexport _ECHO_N_C\necho_prompt() { $_ECHO $_N $0 $_C ; }\n```\n\nThis script\
    \ fragment uses the /bin/echo workaround as the base from which to construct the\
    \ correct echo command. It checks the output of an echo command to determine whether\
    \ the \\c sequence is handled correctly. If it is not, the -n option is enabled.\n\
    \nAfter the appropriate values have been determined, the function echo_prompt\
    \ is created using these values. This function enables you to reliably output\
    \ prompts on every system.\n\n# Abstraction\n\nAbstraction is a technique used\
    \ to hide the differences between the versions of UNIX inside shell functions.\
    \ By doing this, the overall flow of a shell script is not affected. When a function\
    \ is called, it makes a decision as to what commands to execute.\n\nYou will learn\
    \ about two different examples of abstraction:\n\n+   - Adapting the getSpaceFree\
    \ function to run on HP-UX\n+   - Adapting the getPID function to run on both\
    \ BSD and System V\n\nThis section uses the functions getOSName and isOS, given\
    \ earlier in this chapter.\n\n# Adapting getSpaceFree for HP-UX\n\nRecall the\
    \ getSpaceFree function introduced in Chapter 21:\n\n```\ngetSpaceFree() {\n \
    \ if [ $# -lt 1 ] ; then\n\n```"
  merge: -1
  img_proc: true
