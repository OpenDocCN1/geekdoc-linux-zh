- pgno: 208
  md: "the termination condition of a while loop, it can continue forever. For example,\
    \ say you forgot to specify the $ before the x in the test expression:\n\n```\n\
    x=0\nwhile [ x -lt 10 ]\ndo\n  echo $x\n  x=`expr $x + 1`\ndone\n```\n\nThis loop\
    \ would continue to display numbers forever. A loop that executes forever without\
    \ terminating executes an infinite number of times. For this reason, such loops\
    \ are called infinite loops.\n\nIn most cases infinite looping is not desired\
    \ and stems from programming errors, but in certain instances they can be useful.\
    \ For example, say that you need to wait for a particular event, such as someone\
    \ logging on to a system. You can use an infinite loop to check every few seconds\
    \ whether the event has occurred. Because you don't know how many times you need\
    \ to execute the loop, you need to exit the infinite loop using the break command.\
    \ The break command terminates or breaks a loop.\n\nYou can create infinite loops\
    \ using the while loop by specifying cmd as either : or /bin/true. The basic syntax\
    \ of the infinite while loop is\n\n```\nwhile :\ndo\n  list\ndone\n```\n\nIn most\
    \ infinite loops, the while loop usually exits from within list via a break command.\n\
    \nConsider the following interactive script that reads and executes commands:\n\
    \n```\nwhile :\ndo\n  read CMD\n  case $CMD in\n    [qQ]|[qQ]|[uU]|[tT]) break\
    \ ;;\n    *) $CMD ;;\n  esac\ndone\n```\n\nIn this loop a command is read at the\
    \ beginning of each iteration. If that command is either q or Quit, the loop exits;\
    \ otherwise, the loop tries to process the command."
  merge: -1
  img_proc: true
- pgno: 209
  md: "# Breaking Out of Nested Loops\n\nThe break command also accepts an argument\
    \ an integer, greater than or equal to 1, indicating the number of levels to break\
    \ out of. This feature is useful in nested loops.\n\nConsider the following nested\
    \ for loops:\n\n```\nfor i in 1 2 3 4\n do\n  mkdir -p /mnt/backup/docs/ch${i}\n\
    \  if [ $? -eq 0 ] ; then\n    for j in doc c h m p l sh\n    do\n      cp $HOME/docs/ch${i}/*.$j\
    \ /mnt/backup/docs/ch${i}\n      if [ $? -ne 0 ] ; then break 2 ; fi\n    done\n\
    \  else\n    echo \"Could not make backup directory.\"\n  fi\ndone\n```\n\nIn\
    \ this loop, you are making a backup of several important files to a backup directory.\
    \ The outer loop takes care of creating the backup directory, whereas the inner\
    \ loop copies the important files based on the extension. In the inner loop, you\
    \ use a break command with the argument 2. This indicates that if an error occurs\
    \ while copying, both loops should be terminated, rather than just the inner loop.\n\
    \n![](img/3def70414996f811615f713b2077a154_209_0.png)\n\n> The previous example\
    \ makes copies of several files in your home directory $HOME and places them in\
    \ a directory under /mnt. Please ensure that you are permitted by your system\
    \ administrator to copy files from your home directory to /mnt before executing\
    \ this example.\n\n# The continue Command\n\nThe continue command is similar to\
    \ the break command, except that it causes only the current iteration of the loop\
    \ to exit, rather than the entire loop. This command is useful when an error has\
    \ occurred but you want to try to execute the next iteration of the loop.\n\n\
    As an example, the following loop doesn't exit if one of the input files is bad:\n\
    \n```\nfor FILE in $FILES ;\ndo\n  if [ ! -f \"$FILE\" ] ; then\n    echo \"ERROR:\
    \ $FILE is not a file.\"\n    continue\n  fi\n  # process the file\ndone\n```\n\
    \nIf one of the filenames in $FILES is not a file, this loop skips it, rather\
    \ than exiting."
  merge: -1
  img_proc: true
- pgno: 210
