- pgno: 77
  md: '# Manipulating Directories


    The most common ways of manipulating a directory are


    +   - Creating a directory

    +   - Copying a directory

    +   - Moving a directory

    +   - Removing a directory


    # Creating Directories


    You can create directories with the mkdir command (short for make directory).
    Its syntax is


    ```

    mkdir dir

    ```


    Here, dir is the absolute or relative pathname of the directory you want to create.
    For example, the command


    ```

    $ mkdir hw1

    ```


    creates the directory hw1 in the current directory. Here is another example:


    ```

    $ mkdir /tmp/test-dir

    ```


    This command creates the directory test-dir in the /tmp directory. The mkdir command
    produces no output if it successfully creates the requested directory. If more
    than one directory is specified, mkdir will try to create each of the directories.
    For example, $ mkdir docs pub creates the directories docs and pub under the current
    directory.


    # Creating Parent Directories


    Sometimes when you want to create a directory, one or more of its parent directories
    might not exist. If this is the case, mkdir issues an error message. For example,
    $ mkdir /tmp/ch4/tst mkdir: Failed to make directory ''/tmp/ch4/tst'': No such
    file or directory In order to create the parent directories, you can specify the
    -p (p as in parent) option to mkdir. For example, $ mkdir -p /tmp/ch4/tst'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'will create all the required parent directories. In order to create this directory,
    mkdir will use the following procedure:


    +   1. mkdir checks whether the directory /tmp exists. If it does not exist, mkdir
    creates it.

    +   2. mkdir checks whether the directory /tmp/ch04 exists. If it does not exist,
    mkdir creates it.

    +   3. mkdir checks whether the directory /tmp/ch04/test1 exists. If it does not
    exist, mkdir creates it.


    # Common Errors


    The most common error in using mkdir is trying to create a directory that already
    exists. If the directory /tmp/ch04 already exists, the command


    ```

    $ mkdir /tmp/ch04

    ```


    generates an error message similar to the following:


    ```

    mkdir: cannot make directory ''/tmp/ch04'': File exists

    ```


    An error also occurs if you try to create a directory with the same name as a
    file. For example, the following commands


    ```

    $ ls -F docs/names.txt

    names

    $ mkdir docs/names

    ```


    result in the error message


    ```

    mkdir: cannot make directory ''docs/names'': File exists

    ```


    If you specify more than one argument to mkdir, it creates as many of these directories
    as it can. An error message is generated for each directory that could not be
    created.


    # Copying Files and Directories


    In Chapter 3, you looked at using the cp command to copy files. Now let''s look
    at using it to copy directories.


    To copy a directory, you need to specify the -r option to cp. The syntax is as
    follows:


    ```

    cp -r src dest

    ```


    Here, src is the pathname of the directory you want to copy, and dest is the pathname
    where you want the copy to be placed. When the -r option is specified, all files
    and directories located under src are copied to dest. For example,


    ```

    $ cp -r /docs/book /mnt/zip

    ```'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'copies the directory book located in the docs directory to the directory /mnt/zip.
    If the directory book does not exist under /mnt/book, it will be created.


    # Copying Multiple Directories


    You can copy multiple directories in much the same way as copying multiple files.
    If cp encounters more than one source, all the source directories are copied to
    the destination directory. The destination directory is assumed to be the last
    argument. For example, the command


    ```

    $ cp -r docs/book docs/school work/src /mnt/zip

    ```


    copies the directories school and book, located in the directory docs, to /mnt/zip.
    It also copies the directory src, located in the directory work, to /mnt/zip.
    After the copies finish, /mnt/zip resembles the following:


    ```

    $ ls -af /mnt/zip

    ./  ../  book/  school/  src/

    ```


    You can also mix files and directories in the argument list. For example,


    ```

    $ cp -r profile docs/book .kshrc doc/names work/src /mnt/jaz

    ```


    copies all the requested files and directories to the directory /mnt/jaz.


    If the argument list consists of only files, the -r option has no effect.


    # Common Errors


    The most common problem related to copying directories is using a destination
    that is not a directory. An example of this is


    ```

    $ cp -r docs /mnt/zip/backup

    cp: cannot create directory ''/mnt/zip/backup'': File exists

    $ ls -f /mnt/zip/backup

    /mnt/zip/backup

    ```


    As you can see, the cp operation fails because a file called /mnt/zip/backup already
    exists.


    # Moving Files and Directories


    In the previous chapter we looked at using mv to rename files, but its real purpose
    is to move files and directories between different locations in the directory
    tree. The basic syntax is:


    ```

    mv src dest

    ```'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'Here, src is the name of the file or directory you want to move, and dest is
    the directory where you want the file or directory to end up. For example,


    ```

    $ mv /home/ranga/names /tmp

    ```


    moves the file names located in the directory /home/ranga to the directory /tmp.


    Moving a directory is exactly the same:


    ```

    $ mv docs/ work/

    ```


    moves the directory docs into the directory work. To move the directory docs back
    to the current directory, you can use the command:


    ```

    $ mv work/docs .

    ```


    One nice feature of mv is that you can move and rename a file or directory all
    in one command. For example,


    ```

    $ mv docs/names /tmp/names.txt

    ```


    moves the file names in the directory docs to the directory /tmp and renames it
    names.txt.


    # Moving Multiple Items


    Just as you can with cp, you can specify more than one file or directory as the
    source. For example,


    ```

    $ mv work/ docs/ .profile pub/

    ```


    moves the directories work and docs along with the file .profile into the directory
    pub.


    When you are moving multiple items, you cannot rename them. If you want to rename
    an item and move it, you must use a separate mv command for each item.


    # Common Errors


    Two common errors that can occur when using mv are


    +   - Moving multiple files and directories to a directory that does not exist

    +   - Moving files and directories to a file


    These cases produce the same error message, so look at one example that illustrates
    what happens:


    ```

    $ mv .profile docs pub /mnt/jaz/backup

    mv: when moving multiple files, last argument must be a directory

    $ ls -af /mnt/jaz

    ./  ../  archive/  lost+found/  old/

    ```'
  merge: -1
  img_proc: true
