- pgno: 179
  md: '# File Tests


    File test expressions test whether a file fits a particular criteria. The general
    syntax for a file test is


    ```

    test option file

    or

    [ option file ]

    ```


    Here option is one of the options given in Table 11.1 and file is the name of
    a file or directory.


    TABLE 11.1 File Test Options for test


    | Option | Description |

    |---|---|

    | -b file | True if file exists and is a block special file. |

    | -c file | True if file exists and is a character special file. |

    | -d pathname | True if pathname exists and is a directory. |

    | -e pathname | True if the file or directory specified by pathname exists. |

    | -f file | True if file exists and is a regular file. |

    | -g pathname | True if the file or directory specified by pathname exists and
    has its SGID bit set. |

    | -h file | True if file exists and is a symbolic link. This option is not available
    on some older systems. |

    | -k pathname | True if the file or directory specified by pathname exists and
    has its "sticky" bit set. |

    | -p file | True if file exists and is a named pipe. |

    | -r pathname | True if the file or directory specified by pathname exists and
    is readable. |

    | -s file | True if file exists and has a size greater than zero. |

    | -u pathname | True if the file or directory specified by pathname exists and
    has its SUID bit set. |

    | -w pathname | True if the file or directory specified by pathname exists and
    is writable. |

    | -x pathname | True if the file or directory specified by pathname exists and
    is executable. A directory must be executable in order for its contents to be
    accessed. |

    | -o pathname | True if the file or directory specified by pathname exists and
    is owned by the effective user ID of the current process. |'
  merge: -1
  img_proc: true
- pgno: 180
  md: '![](img/3def70414996f811615f713b2077a154_180_0.png)


    > The -w and -x options only test a file''s permission flags. They do not take
    into account the state of the underlying disk. For example, files on read-only
    disks such as CD-ROMs or DVDs can have the writable bit set, but they cannot be
    written to because the underlying media is read-only.


    The next few examples, taken from OpenBSD''s system startup script /etc/rc, illustrate
    the use of file tests. This section doesn''t go over every option listed in Table
    11.1; just enough to give you a general idea about how file test operators are
    used in the real world.


    The first example illustrates the use of the -d option to test for the existence
    of a directory:


    ```

    # /var/crash should be a directory if core dumps

    # are to be saved.

    if [ -d /var/crash ]; then

    savecore /var/crash

    fi

    ```


    Here the script determines whether the directory /var/crash exists. If the directory
    exists, savecore is executed. If the directory does not exist, the if statement
    performs no actions.


    The second example illustrates the use of the -f option to test for the existence
    of a regular file:


    ```

    if [ -f /var/account/acct ]; then

    echo "turning on accounting"; acct on /var/account/acct ;

    fi

    ```


    Here the script determines whether the file /var/account/acct exists. If the file
    exists, the script outputs the message:

    turning on accounting

    and executes acct on /var/account/acct. If the file does not exist, the if statement
    performs no actions.


    The third example illustrates the use of the -x option to determine whether a
    file is executable:


    ```

    if [ -x /usr/libexec/vi.recover ]; then

    echo "preserving editor files"; /usr/libexec/vi.recover

    fi

    ```


    Here the script determines whether the file /usr/libexec/vi.recover is executable.
    If the file is executable, the script outputs the message:

    preserving editor files

    and executes /usr/libexec/vi.recover. If the file is not executable, the if statement
    performs no actions.'
  merge: -1
  img_proc: true
- pgno: 181
  md: "# String Comparisons\n\nThe test and [ commands allow for simple string comparisons.\
    \ They can be used to determine whether a string is empty and whether two strings\
    \ are identical or equal. The options relating to string comparisons are listed\
    \ in Table 11.2.\n\nTABLE 11.2 String Comparison Options for the test Command\n\
    \n| Option | Description |\n|---|---|\n| `-z str` | True if str has zero length.\
    \ |\n| `-n str` | True if str has nonzero length. |\n| `str1 = str2` | True if\
    \ str1 and str2 are equal. |\n| `str1 != str2` | True if str1 and str2 are not\
    \ equal. |\n\n# Checking Whether a String Is Empty\n\nThere are several ways to\
    \ determine whether a string is empty. The most common method is to use the -z\
    \ option as follows:\n\n```\ntest -z str\n\nor\n\n[ -z str ]\n```\n\nHere str\
    \ is the string you want to check. As an example, consider the following if statement:\n\
    \n```\nif [ -z \"$FRUIT_BASKET\" ] ; then\n  echo \"Your fruit basket is empty\"\
    \nelse\n  echo \"Your fruit basket contains: $FRUIT_BASKET\"\nfi\n```\n\nIf the\
    \ variable $FRUIT_BASKET does not have a value, the message:\n\nYour fruit basket\
    \ is empty\n\nis produced. Otherwise a message that contains the value of $FRUIT_BASKET\
    \ is produced.\n\nIf you were to use the -n option instead of the -z option, the\
    \ example would change as follows:\n\n```\nif [ -n \"$FRUIT_BASKET\" ] ; then\n\
    \  echo \"Your fruit basket has the following fruit: $FRUIT_BASKET\"\nelse\n \
    \ echo \"Your fruit basket is empty\"\nfi\n```"
  merge: -1
  img_proc: true
- pgno: 182
  md: "You might have noticed that the variable $FRUIT_BASKET was quoted in the previous\
    \ examples. Quoting handles the case when $FRUIT_BASKET is unset or null. If $FRUIT_BASKET\
    \ was unset and you did not quote it, an error message similar to the following\
    \ would be displayed:\n\n```\ntest: argument expected\n```\n\nWithout quotes,\
    \ after the shell performs variable substitution, the statement looks like the\
    \ following:\n\n```\n[ -z ]\n```\n\nThe test command complains that a required\
    \ argument is missing, because the str argument to -z is missing. When quoting\
    \ is used, the same statement looks like the following after variable substitution:\n\
    \n```\n[ -z \"\" ]\n```\n\nHere str is \"\", so test works correctly.\n\n![](img/3def70414996f811615f713b2077a154_182_0.png)\n\
    \n> When bash is presented with a variable that does not have a value, it automatically\
    \ uses the value \"\". Thus you do not have to quote your variables in bash.\n\
    > \n> Although the quoting is not required in bash, you should still include it\
    \ in your script for the sake of clarity and maintainability.\n\n# Equality of\
    \ Strings\n\nThe test and [ ] commands enable you to determine whether two strings\
    \ are equal. Two strings are considered equal if they contain the identical sequence\
    \ of characters. For example, the following strings are considered equal:\n\n\
    ```\n'There are more things in heaven and earth'\n'There are more things in heaven\
    \ and earth'\n```\n\nWhereas the following strings are not considered equal because\
    \ of differences in capitalization:\n\n```\n'than are dreamt of in your philosophy'\n\
    'than are dreamt of in your Philosophy'\n```\n\nThe syntax for checking whether\
    \ two strings are equal is\n\n```\ntest str1 = str2\n```\n\n```\n[ str1 = str2\
    \ ]\n```"
  merge: -1
  img_proc: true
- pgno: 183
  md: "Here str1 and str2 are the two strings being compared. If these two strings\
    \ are equal, the test succeeds and returns true (0). If the two strings are not\
    \ equal, the test fails and returns false (1).\n\nThe following example, slightly\
    \ modified from OpenBSD's /etc/rc, illustrates a common use of string comparisons:\n\
    \n```\n# if $portmap == YES, the portmapper is started.\nif [ \"$portmap\" = \"\
    YES\" ]; then\n    echo -n 'portmap'; portmap\nfi\n```\n\nHere str1 is the value\
    \ of $portmap and str2 is the string YES. The if statement uses the = operator\
    \ to determine whether the value stored in $portmap is equal to YES. If $portmap\
    \ is equal to YES, a message is issued and the program portmap is executed.\n\n\
    Note that $portmap is quoted in this example. Just like in previous examples,\
    \ quoting is used to prevent problems resulting from variable substitution when\
    \ $portmap happens to be unset or null. If $portmap was not quoted and it happened\
    \ to be null, an error message similar to the following would be produced:\n\n\
    test: argument expected\n\nAn alternative technique for quoting is sometimes used\
    \ to avoid these types of errors. Basically it involves prefixing str1 and str2\
    \ with an extra character, usually X. The syntax for this technique is\n\n```\n\
    test X$str1 = X$str2\nor\n[ X$str1 = X$str2 ]\n```\n\nIf either str1 or str2 is\
    \ null, the string X is used instead of null. Rewriting the previous example using\
    \ this technique yields:\n\n```\n# if $portmap == YES, the portmapper is started.\n\
    if [ X$portmap = X'YES' ]; then\n    echo -n 'portmap'; portmap\nfi\n```\n\nIf\
    \ $portmap is null then the strings X and XYES are compared; because these strings\
    \ do not match, the test fails. If $portmap is YES then the strings XYES and XYES\
    \ are compared; because these strings match, the test succeeds."
  merge: -1
  img_proc: true
- pgno: 184
  md: "# Inequality of Strings\n\nYou can determine whether two strings are not equal\
    \ using the != operator. The syntax for this operator is similar to that of the\
    \ = operator:\n\n```\ntest str1 != str2\nor\n[ str1 != str2 ]\n```\n\nHere str1\
    \ and str2 are the two strings being compared. If these two strings are not equal,\
    \ the test succeeds and returns 0 (true). If the two strings are equal, the test\
    \ fails and returns 1 (false).\n\nThe following example, slightly modified from\
    \ OpenBSD's /etc/rc, illustrates the use of the != operator:\n\n```\nif [ \"$lpd_flags\"\
    \ != 'NO' ]; then\n  echo -n 'printer: ' lpd_flags\nfi\n```\n\nHere str1 is the\
    \ value of the variable $lpd_flags and str2 is the string NO. You can determine\
    \ whether the value of $lpd_flags is not NO. If the value is something other than\
    \ NO, the program issues a message and executes lpd with the value of $lpd_flags\
    \ as its argument.\n\nJust as in previous examples, quoting was used in order\
    \ to handle the case when $lpd_flags is unset or null. An alternate technique\
    \ that is sometimes used involves prefixing str1 and str2 with an extra character,\
    \ usually X. The syntax for this technique is\n\n```\ntest Xstr1 != Xstr2\nor\n\
    [ Xstr1 != Xstr2 ]\n```\n\nIf either str1 or str2 is null, the string X is used\
    \ instead of null. Rewriting the previous example using this technique yields:\n\
    \n```\nif [ X$lpd_flags != X'NO' ]; then\n  echo -n 'printer: ' lpd_flags\nfi\n\
    ```\n\nIf $lpd_flags is null, the strings X and XNO are compared; because these\
    \ strings do not match, the test succeeds. If $lpd_flags is NO then the strings\
    \ XNO and XNO are compared; because these strings match, the test fails."
  merge: -1
  img_proc: true
- pgno: 185
  md: "# Numerical Comparisons\n\nThe test and [ commands can also be used to compare\
    \ integers. The basic syntax is\n\n```\ntest int1 op int2\n```\n\nor\n\n```\n\
    [ int1 op int2 ]\n```\n\nHere int1 and int2 can be any positive or negative integer\
    \ and op is one of the operators listed in Table 11.3. If either int1 or int2\
    \ is a string, not an integer, it is treated as 0.\n\nTable 11.3 Numerical Comparison\
    \ Operators for the test Command\n\n| Operator | Description |\n|---|---|\n| int1\
    \ -eq int2 | True if int1 equals int2. |\n| int1 -ne int2 | True if int1 is not\
    \ equal to int2. |\n| int1 -lt int2 | True if int1 is less than int2. |\n| int1\
    \ -le int2 | True if int1 is less than or equal to int2. |\n| int1 -gt int2 |\
    \ True if int1 is greater than int2. |\n| int1 -ge int2 | True if int1 is greater\
    \ than or equal to int2. |\n\nA common task in a shell script is checking the\
    \ exit code from a program. The numerical comparison operators allow you to easily\
    \ check the exit status of a command and perform different actions depending on\
    \ whether a command executed correctly. For example, consider the following command:\n\
    \n```\nln -s /usr/local/bin/bash /usr/bin\n```\n\nIf you execute this command\
    \ on the command line, you can see any error messages and intervene to fix the\
    \ problem. In a shell script, error messages are ignored and the script continues\
    \ to execute. In most cases it is a mistake to ignore errors.\n\nThe exit status\
    \ of the last command is stored in the variable $?, so you can use this variable\
    \ to check whether a command was successful as follows:\n\n```\nif [ $? -eq 0\
    \ ]; then\n  echo \"Command was successful.\";\nelse\n  echo \"An error was encountered.\"\
    \n  exit\nfi\n```\n\nRecall that an exit code of 0 indicates success and a non-zero\
    \ exit code indicates failure. If the command exits with an exit code of 0, the\
    \ \"success\" message is issued; otherwise, an error message is issued and exit\
    \ is called."
  merge: -1
  img_proc: true
- pgno: 186
  md: "![](img/3def70414996f811615f713b2077a154_186_0.png)\n\n> In some scripts you\
    \ may see the - operator used in place of the -eq operator. Some extremely old\
    \ versions of the shell did not include the -eq operator, thus shell programmers\
    \ were forced to use the - operator instead. All modern shells, including Bourne\
    \ shell, ksh, bash and zsh, support the -eq operator.\n\nBy using the -ne operator,\
    \ you can simplify the previous example as follows:\n\n```\nif [ $7 -ne 0 ] ;\
    \ then\n echo \"An error was encountered.\"\n exit\nfi\necho \"Command was successful.\"\
    \n```\n\nHere you check to see whether the command failed. If so, you issue an\
    \ error message and exit; otherwise, you continue with the rest of the program\
    \ (in this case you just issue the \"success\" message). This version is slightly\
    \ more efficient than the previous example that uses an else clause.\n\n![](img/3def70414996f811615f713b2077a154_186_1.png)\n\
    \n> In some scripts, you might see the !- operator used in place of the -ne operator.\
    \ Some older versions of the shell did not include the -ne operator, thus shell\
    \ programmers were forced to use the !- operator instead. All modern shells, including\
    \ the Bourne shell, ksh, bash, and zsh, support the -ne operator.\n\n# Compound\
    \ Expressions\n\nSo far you have dealt with individual expressions, but many times\
    \ you need to combine expressions in order to test for a particular condition.\
    \ When two or more expressions are combined, the result is called a compound expression.\n\
    \nYou can create compound expressions by using test and [ 's built-in operators,\
    \ or by using the conditional execution operators, && and ||. Another way to create\
    \ a compound expression is to use the negation operator, !, which negates an expression.\
    \ Table 11.4 summarizes these operators..\n\nTABLE 11.4 Operators for Creating\
    \ Compound Expressions\n\n| Operator | Description |\n|---|---|\n| ! expr1 | True\
    \ if expr1 is false. |\n| expr1 -a expr2 | True if both expr1 and expr2 are true.\
    \ |\n| expr1 -o expr2 | True if either expr1 or expr2 is true. |"
  merge: -1
  img_proc: true
- pgno: 187
  md: "The syntax for creating compound expressions using the built-in operators is\n\
    \n```\ntest expr1 op expr2\nor\n[ expr1 op expr2 ]\n```\n\nHere expr1 and expr2\
    \ are any valid test expressions, and op is -a (short for and) or -o (short for\
    \ or). If the -a operator is used, both expr1 and expr2 must be true in order\
    \ for the compound expression to be true. If the -o operator is used, either expr1\
    \ or expr2 must be true in order for the compound expression to be true.\n\nThe\
    \ syntax for creating compound expressions using the conditional operators is\n\
    \n```\ntest expr1 op test expr2\nor\n[ expr1 ] op [ expr2 ]\n```\n\nHere expr1\
    \ and expr2 are any valid test expressions, and op is && (and) or || (or). If\
    \ the && operator is used, both expr1 and expr2 must be true in order for the\
    \ compound expression to be true. If the || operator is used, either expr1 or\
    \ expr2 must be true in order for the compound expression to be true.\n\nThe following\
    \ if statement, taken from OpenBSD's /etc/rc, illustrates a compound expression\
    \ constructed using the built-in operator -a:\n\n```\nif [ -f /sbin/kbd -a -f\
    \ /etc/kbdtype ]; then\n  kbd `cat /etc/kbdtype`\nfi\n```\n\nThis if statement\
    \ is executed as follows:\n\n+   1. First the test\n+      -f /sbin/kbd\n+   \
    \   is performed. If the file /sbin/kbd exists then the test returns true (0),\
    \ otherwise the test returns false and the if statement performs no actions.\n\
    +   \n+   2. If /sbin/kbd exists, the second test\n+      -f /etc/kbdtype\n+ \
    \     is performed. If the file /etc/kbdtype exists then the test returns true\
    \ (0), otherwise the test returns false and the if statement performs no actions.\
    \ If the first test failed, this test is not performed."
  merge: -1
  img_proc: true
- pgno: 188
  md: "3. If both files exist, the command\nkbd `cat /etc/kbtype`\nis executed.\n\n\
    As an illustration of how the conditional operators are used, the previous example\
    \ can be rewritten to use conditional operators as follows:\n\n```\nif [ -f /sbin/kbd\
    \ ] && [ -f /etc/kbtype ]; then\nkbd `cat /etc/kbtype`\nfi\n```\n\nYou just replaced\
    \ the -a operator with && and [ . The execution of this version is similar to\
    \ that of the previous example:\n\n+   1. First the expression\n+   [ -f /sbin/kbd\
    \ ]\n+   is evaluated. If the file /sbin/kbd exists then the expression returns\
    \ true (0), otherwise wise the test returns false and the if statement performs\
    \ no actions.\n+   \n+   2. If /sbin/kbd exists, the expression\n+   [ -f /etc/kbtype\
    \ ]\n+   is evaluated. If the file /etc/kbtype exists then the test returns true\
    \ (0), otherwise the test return false and the if statement performs no actions.\
    \ If the first test failed, this test is not performed.\n+   \n+   3. If both\
    \ files exist, the command\n+   kbd `cat /etc/kbtype`\n+   is executed.\n\nThe\
    \ difference between the two versions is that in the first version list is a single\
    \ command, whereas in the second version list is a compound command.\n\nSome programmers\
    \ prefer the version that uses the conditional operators because the individual\
    \ tests are isolated. Other programmers prefer the second form because it invokes\
    \ the [ command only once and thus might be marginally more efficient for large\
    \ numbers of tests. If your shell scripts need to be portable, you should use\
    \ the conditional operators.\n\n![](img/3def70414996f811615f713b2077a154_188_0.png)\n\
    \n> In the previous examples you used only two expressions in your compound expressions.\
    \ You are not limited to two expressions. You can combine any number of expressions\
    \ into one compound expression."
  merge: -1
  img_proc: true
- pgno: 189
  md: "# Negating an Expression\n\nNegation reverses the result of a test expression.\
    \ An expression that would have been true is treated as false and vice versa.\
    \ The basic syntax of the negation operator is\n\n```\ntest ! expr\n```\n\nor\n\
    \n```\n[ ! expr ]\n```\n\nHere expr is any valid test expression.\n\nThe following\
    \ example, taken from OpenBSD's /etc/rc startup script, illustrates the use of\
    \ the ! operator:\n\n```\nif [ ! -f /etc/motd ]; then\n    install -c -o root\
    \ -g wheel -m 664 /dev/null /etc/motd\nfi\n```\n\nThis example creates the file\
    \ /etc/motd (the message of the day on UNIX systems) using the install command\
    \ if it does not exist or is not a regular file. The execution is as follows:\n\
    \n+   1. First the test\n+      -f /etc/motd\n+      is performed.\n+   2. The\
    \ result of the test is negated because of the ! operator. If the file /etc/motd\
    \ exists and is a regular file, the compound expression returns false (!); otherwise,\
    \ it returns true.\n+   3. If the result of the previous step is true, the file\
    \ /etc/motd is created; otherwise, the if statement performs no actions.\n\nThis\
    \ example can also be written as either of the following commands:\n\n```\ntest\
    \ ! -f /etc/motd && install -c -o root -g wheel -m 664 /dev/null /etc/motd\n[\
    \ ! -f /etc/motd ] && install -c -o root -g wheel -m 664 /dev/null /etc/motd\n\
    ```\n\nThis achieves the same result because install is executed only if the test\
    \ or [ commands return true."
  merge: -1
  img_proc: true
- pgno: 190
  md: "# The case Statement\n\nThe case statement is the second form of flow control\
    \ available in the shell. Its syntax is as follows:\n\n```\ncase word in\n   \
    \ pattern1)\n        list1\n        ;;\n    pattern2)\n        list2\n       \
    \ ;;\n    ...\n    patternN)\n        listN\n        ;;\nesac\n```\n\nHere the\
    \ string word is compared to each of the patterns from pattern1 to patternN. When\
    \ a matching pattern is found, the list following the matching pattern is then\
    \ executed.\n\nWhen a list finishes executing, the special command ;; indicates\
    \ that flow should jump to the end of the case statement. The ;; is similar to\
    \ the break command in the C programming language. If no matches are found, the\
    \ case statement does not perform any actions. The minimum number of patterns\
    \ is one. There is no limit on the maximum number of patterns.\n\nSome programmers\
    \ prefer to use a more concise form of the case statement, written as follows:\n\
    \n```\ncase word in\n    pattern1) list1 ;;\n    ...\n    patternN) listN ;;\n\
    esac\n```\n\nThis form should be used only if the list of commands to be executed\
    \ is short.\n\n# A case Statement Example\n\nThe following example illustrates\
    \ the use of the case statement:\n\n```\nFRUIT=kiwi\ncase \"$FRUIT\" in\n    apple)\
    \ echo \"Apple pie is quite tasty.\" ;;\n    banana) echo \"I like banana nut\
    \ bread.\" ;;\n    kiwi) echo \"New Zealand is famous for kiwi.\" ;;\nesac\n```"
  merge: -1
  img_proc: true
- pgno: 191
  md: 'The execution of the case statement is as follows:


    +   1. The string contained in the variable FRUIT is expanded to kiwi.

    +   2. The string kiwi is compared against the first pattern, apple. Because they
    don''t match, the program goes on to the next pattern.

    +   3. The string kiwi is compared against the next pattern, banana. Because they
    don''t match, the program goes on to the next pattern.

    +   4. The string kiwi is compared against the final pattern, kiwi. Because they
    match, the following message is produced:

    +      New Zealand is famous for kiwi.


    # Common Errors


    Two common errors that are encountered while using the case statement are as follows:


    +   - Omitting the ;; at the end of a list.

    +   - Writing case instead of esac at the end of the case statement.


    To illustrate the first type of error, the previous example is modified so that
    the ;; is missing after the first list:


    ```

    ```bash

    FRUIT=kiwi

    case "$FRUIT" in

    apple) echo ''Apple pie is quite tasty.''

    banana) echo ''I like banana nut bread.'' ;;

    kiwi) echo ''New Zealand is famous for kiwi.'' ;;

    esac

    ```

    ```


    This omission produces an error message similar to the following:


    bash: syntax error near unexpected token `banana''


    What this error message means is that while the shell was trying to execute the
    list for the pattern apple, it saw the start of the pattern banana. Because this
    pattern started before the shell encountered the end of the list for the pattern
    apple, an error message was produced. To illustrate the second type of error,
    the ending esac is changed to case:


    ```

    ```bash

    FRUIT=kiwi

    case "$FRUIT" in

    apple) echo ''Apple pie is quite tasty.'' ;;

    banana) echo ''I like banana nut bread.'' ;;

    kiwi) echo ''New Zealand is famous for kiwi.'' ;;

    case

    ```

    ```


    This change produces an error message similar to the following:


    bash: syntax error near unexpected token `case'''
  merge: -1
  img_proc: true
- pgno: 192
  md: "What this error message means is that the shell did not see the appropriate\
    \ closing esac for the case statement.\n\n# Using Patterns\n\nIn the previous\
    \ example, you used fixed strings as the pattern. When used in this fashion, the\
    \ case statement is basically an if statement. For example, the if statement corresponding\
    \ to the case statement in previous example is\n\n```\n```bash\nif [ \"$FRUIT\"\
    \ = apple ] ; then\n  echo \"Apple pie is quite tasty.\"\nelif [ \"$FRUIT\" =\
    \ banana ] ; then\n  echo \"I like banana nut bread.\"\nelif [ \"$FRUIT\" = kiwi\
    \ ] ; then\n  echo \"New Zealand is famous for kiwi.\"\nfi\n```\n```\n\nAlthough\
    \ the case statement is more concise and readable, the real power of the case\
    \ statement does not lie in enhancing the readability of your scripts; its power\
    \ lies in the fact that it uses patterns rather than fixed strings to perform\
    \ matching. A pattern is a string that consists of regular characters and special\
    \ wildcard characters. The pattern determines whether a match is present. The\
    \ case statement patterns use the same special characters as patterns for pathname\
    \ expansion covered in Chapter 9, “Substitution.” The patterns can also include\
    \ the OR operator, |.\n\nAn example of a simple case statement that uses patterns\
    \ is as follows:\n\n```\n```bash\ncase $- in\n  *i*) # an interactive shell\n\
    \    PS1=\"uname -n $\"\n    PATH=\"$PATH:$HOME/bin\"\n    export PS1 PATH ;;\n\
    esac\n```\n```\n\nThe special variable $- contains a list of the shell options.\
    \ In this case, you determine whether that list contains the letter i, which indicates\
    \ that the shell is interactive. Checking if $- contains the letter i is the most\
    \ portable method for determining whether the shell is running in interactive\
    \ mode or in non-interactive mode. In this example, you set up the prompt, PS1,\
    \ and the command search path, PATH, if the shell is running in interactive mode;\
    \ otherwise, no actions are performed."
  merge: -1
  img_proc: true
- pgno: 193
  md: "# Summary\n\nIn this chapter, you examined the two main flow control mechanisms\
    \ available in the shell: if and case. You also looked at the test command and\
    \ its use in if statements. Specifically, the chapter covered the following topics:\n\
    \n+   - Performing file tests\n+   - Performing string comparisons\n+   - Performing\
    \ numerical comparisons\n+   - Using compound expressions\n\nIn the next chapter,\
    \ you will examine loops, which are complementary to flow control statements.\n\
    \n# Questions\n\n1. What is the difference between the following commands?\n\n\
    ```\nif [ -e /usr/local/bin/bash ] ; then /usr/local/bin/bash ; fi\nif [ -x /usr/local/bin/bash\
    \ ] ; then /usr/local/bin/bash ; fi\n```\n\n2. Given the following variable declarations,\n\
    \n```\nHOME=/home/ranga\nBINDIR=/home/ranga/bin\n```\n\nwhat is the output of\
    \ the following if statement?\n\n```\nif [ $HOME = $BINDIR ] ; then\n    echo\
    \ \"Your binaries are stored in your home directory.\"\nfi\n```\n\n3. Write a\
    \ test command that can be used to test if /usr/bin is a directory or a symbolic\
    \ link.\n\n4. Given the following if statement, write an equivalent case statement:\n\
    \n```\nif [ \"$ANS\" = \"Yes\" -o \"$ANS\" = \"yes\" -o \"$ANS\" = \"Y\" -o \"\
    $ANS\" = \"Y\" ] ;\nthen\n    ANS=\"y\"\nelse\n    ANS=\"n\"\nfi\n```"
  merge: -1
  img_proc: true
- pgno: 194
  md: '# Terms


    **Conditional flow control commands** Commands that allow the flow of a script
    to be conditionally changed. Also called flow control commands.


    **Compound expression** When two or more expressions are combined, the result
    is called a compound expression.


    **Flow control commands** See conditional flow control commands.


    **Negating expressions** Reverses the result of a test expression. An expression
    that would have been true is treated as false and vice versa.'
  merge: -1
