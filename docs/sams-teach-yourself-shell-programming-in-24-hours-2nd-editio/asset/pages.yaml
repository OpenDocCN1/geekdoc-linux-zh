- pgno: 36
  md: '![](img/3def70414996f811615f713b2077a154_36_0.png)


    # Hour 2


    # Script Basics


    Chapter 1, “Shell Basics,” introduced the concept of a shell and commands, and
    described how the shell reads input and executes the specified commands. This
    chapter expands on those basic concepts to explain in greater detail what the
    shell is and how it works, including the login and logout process as it relates
    to the shell.


    This chapter also explains how to group commands that are normally executed interactively
    into a file, thus creating a program or script. Scripts are the power behind the
    shell because they allow commands to be grouped together to create new commands.


    Specifically, the topics covered in this chapter are


    +   - The UNIX System

    +   - Shell Initialization

    +   - Getting Help'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# The UNIX System


    The UNIX system consists of two main components:


    +   - Utilities

    +   - Kernel


    Utilities are programs that can be executed. The programs who and date from the
    previous chapter are examples of utilities.


    Commands are slightly different from utilities. The term utility refers to the
    name of a program, whereas the term command refers to the program and any arguments
    are specified to that program in order to change its behavior. For simple commands,
    the term command is sometimes used in place of the term utility.


    The kernel is the heart of the UNIX system. It provides utilities with a means
    of accessing the computer''s hardware. It also handles scheduling and executing
    commands.


    When a computer is powered off, both the kernel and the utilities are stored on
    the hard drives. When the computer boots, the kernel is loaded from disk into
    memory and remains in memory until the computer is turned off. Utilities, on the
    other hand, are stored in files on disk and loaded into memory only when they
    are requested for execution. For example, when the following command is executed,


    ```

    $ who

    ```


    the kernel loads the who command from a file on disk, places it in memory, and
    starts executing it. When the program finishes executing, it remains in the machine''s
    memory for a short period of time before it is removed. This enables frequently
    used commands to execute faster. Consider what happens when the date command is
    executed three times in quick succession:


    ```

    $ date

    Sun Dec 27 09:42:37 PST 1998

    $ date

    Sun Dec 27 09:42:38 PST 1998

    $ date

    Sun Dec 27 09:42:39 PST 1998

    ```


    The first time the date command might need to be loaded from the computer''s hard
    disk, but the second and third time the date command usually remains in the computer''s
    memory, allowing it to execute faster. Try it on your system and see if you notice
    a slight delay the first time and no delay the second and third times.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# Commands and Files


    In UNIX most commands are stored in separate files on disk. For example, the who
    and date commands are stored in two separate files named who and date on the disk;
    they are not part of the shell. This allows for new commands to be added and bugs
    in existing commands to be fixed without modifying the shell. If you are unfamiliar
    with the concept of a file, don''t panic! Files are covered in the next chapter.


    # Logging In


    Just like date, the shell is a program that is stored on disk. The main difference
    is that the shell is loaded into memory when you log in and stays in memory until
    you log out.


    When you first connect to a UNIX system, a login prompt will be presented. Usually
    it looks similar to


    ```

    login:

    ```


    Here you need to enter a username, which is your identity on a UNIX system. After
    entering a username, another prompt will be presented:


    ```

    login: ranga

    Password:

    ```


    Here you need to enter the password corresponding to the username you entered.
    Your username, password, and associated files are called your user account. The
    system administrator is responsible for creating your user account and providing
    you with the username and password associated with it.


    After reading both the username and password, the system looks through the user
    database, normally located in the file /etc/passwd, for an entry matching the
    information that was provided. If a match is found, the shell associated with
    that entry is executed; otherwise, an error is displayed.


    ![](img/3def70414996f811615f713b2077a154_38_0.png)


    For those of you who are not familiar with UNIX file and directory names, such
    as /etc/passwd, these topics are covered in Chapter 3, "Working with Files," and
    Chapter 4, "Working with Directories." Files and directories are discussed very
    briefly in this chapter. A general idea about files and directories from other
    operating systems is sufficient to understand the examples.'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'The following is a sample entry from /etc/passwd on my system:


    ```

    ranga:x:500:100:Sriranga Veeraraghavan:/home/ranga:/bin/bash

    ```


    The entry is composed of several fields, each separated from the other fields
    by a colon, :. Later chapters will explain the information stored in each field.
    For now, only the last two fields are important. The last field stores the shell
    associated with the account. The second from the last field stores the home directory
    for the account. The home directory is where you first start out after logging
    in. In some documentation, you will see home directories denoted by a tilde, ~,
    or a tilde followed by a slash, ~/ . In the previous example, the shell is /bin/bash
    and the home directory is /home/ranga. Your shell and home directory will most
    likely be different.


    In most cases, the system administrator will assign you the default shell for
    a particular version of UNIX. In some cases, there are two defaults and the system
    administrator can choose between them based on his personal preferences.


    The default shells for some common versions of UNIX are as follows:


    +   - Solaris uses Bourne shell or C Shell.

    +   - HP-UX uses POSIX shell.

    +   - BSD uses Korn Shell or C Shell.

    +   - Mac OS X uses Z Shell or C Shell.

    +   - Linux uses the Bourne Again Shell.


    For the sake of brevity, we assume that you have been assigned Bourne shell, Korn
    Shell (ksh), Bourne Again Shell (bash), or Z Shell (zsh) as your shell.


    # Shell Modes and Initialization


    In this section, we will first discuss the startup procedure for the various Bourne-type
    shells, and then we will examine the different modes of execution for a shell.


    # Initialization Procedures


    After you log in, a shell is executed on your behalf. When this shell starts executing,
    it is uninitialized. In this state, several parameters required for its proper
    operation are not defined. The shell undergoes a process called initialization
    that defines these parameters. The steps and files involved in initialization
    are different in each shell, so we will examine the process used by each of the
    Bourne-type shells individually. In general each of the shells uses default or
    system-wide configuration files located in the /etc directory along with a set
    of personal configuration files located in your home directory.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Bourne Shell


    Bourne shell initialization has four steps and involves the initialization files
    (also called init files) `/etc/profile` and `.profile`. The process is as follows:


    +   1. The shell checks to see whether the file `/etc/profile` exists.

    +   2. If it exists, the shell reads it; otherwise, the shell skips it.

    +   3. The shell checks to see whether the file `.profile` exists in your home
    directory.

    +   4. If it exists, the shell reads it; otherwise, the shell skips it.


    After these steps have been performed, the prompt is displayed. The default prompt
    for Bourne shell is `$` (a dollar sign followed by a space).


    # Korn Shell


    Korn Shell (`ksh`) closely resembles Bourne shell initialization. It has six steps
    and involves the init files `/etc/profile`, `.profile`, and `.kshrc`:


    +   1. ksh checks to see whether the file `/etc/profile` exists.

    +   2. If it exists, ksh reads it; otherwise, ksh skips it.

    +   3. ksh checks to see whether the file `.profile` exists in your home directory.

    +   4. If it exists, ksh reads it; otherwise, ksh skips it.

    +   5. ksh checks to see whether the file `.kshrc` exists in your home directory.

    +   6. If it exists, ksh reads it; otherwise, ksh skips it.


    After these steps have been performed, the prompt is displayed. The default prompt
    for `ksh` is `$` (a dollar sign followed by a space).


    # Bourne Again Shell


    Bourne Again shell (bash) initialization is a bit longer than Korn shell and Bourne
    shell initialization. It has eight steps and involves the init files `/etc/profile`,
    `.bash_profile`, `.bash_login`, and `.profile`:


    +   1. bash checks to see whether the file `/etc/profile` exists.

    +   2. If it exists, bash reads it; otherwise, bash skips it.

    +   3. bash checks to see whether the file `.bash_profile` exists in your home
    directory.

    +   4. If it exists, bash reads it; otherwise, bash skips it.

    +   5. bash checks to see whether the file `.bash_login` exists in your home directory.

    +   6. If it exists, bash reads it; otherwise, bash skips it.

    +   7. bash checks to see whether the file `.profile` exists in your home directory.

    +   8. If it exists, bash reads it; otherwise, bash skips it.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'After these steps have been performed, a prompt is displayed. The default prompt
    for bash is bash$ (the string bash$ followed by a space).


    # Z Shell


    Z shell (zsh) initialization is quite long and does not resemble the initialization
    process of the other shells. It has 16 steps and involves the init files /etc/zshenv,
    .zshenv, /etc/zprofile, .zprofile, /etc/zlogin, and .zlogin:


    +   1. zsh checks to see whether the file /etc/zshenv exists.

    +   2. If it exists, zsh reads it; otherwise, zsh skips it.

    +   3. zsh checks to see whether the file .zshenv exists in your home directory.

    +   4. If it exists, zsh reads it; otherwise, zsh skips it.

    +   5. zsh checks to see whether the file /etc/zprofile exists.

    +   6. If it exists, zsh reads it; otherwise, zsh skips it.

    +   7. zsh checks to see whether the file .zprofile exists in your home directory.

    +   8. If it exists, zsh reads it; otherwise, zsh skips it.

    +   9. zsh checks to see whether the file /etc/zshrc exists.

    +   10. If it exists, zsh reads it; otherwise, zsh skips it.

    +   11. zsh checks to see whether the file .zshrc exists in your home directory.

    +   12. If it exists, zsh reads it; otherwise, zsh skips it.

    +   13. zsh checks to see whether the file /etc/zlogin exists.

    +   14. If it exists, zsh reads it; otherwise, zsh skips it.

    +   15. zsh checks to see whether the file .zlogin exists in your home directory.

    +   16. If it exists, zsh reads it; otherwise, zsh skips it.


    After these steps have been performed, a prompt is displayed. The default prompt
    for zsh is host%. Here host is the hostname of your system. For example, on a
    system named nars, the default zsh prompt would be nars%.


    # Initialization File Contents


    Usually a shell''s init files are quite short. The purpose of these files is to
    provide a complete working environment with as little overhead as possible. In
    this section, we will look at the basic settings required for Bourne shell. If
    you are using a different shell, you can put these settings into an init file
    used by that shell.'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'The init file .profile contains all of your shell initialization settings.
    You can add as much customization information as you want to this file. The minimum
    set of information that you need to configure includes


    +   - A list of directories in which to locate commands

    +   - A list of directories in which to locate manual pages for commands


    # Setting PATH


    When you type the command,


    ```

    $ date

    ```


    The shell has to locate the command date before it can be executed. The PATH variable
    specifies the directories in which the shell should look for commands. The most
    basic setting is as follows:


    ```

    PATH=/bin:/usr/bin

    ```


    Each of the individual entries separated by the colon character, :, should be
    directories. Directories are discussed in Chapter 4.


    If you request the shell to execute a command and it cannot find it in any of
    the directories given in the PATH variable, a message similar to the following
    appears:


    ```

    $ hello

    hello: not found

    ```


    # Setting MANPATH


    In UNIX, online help has been available since the beginning. The next section,
    “Getting Help,” discusses how to access the online help using the man command.
    In order for this command to work properly, you have to tell the shell where the
    help pages are located. This information is specified using the MANPATH. A common
    setting is


    ```

    MANPATH=/usr/man:/usr/share/man

    ```


    Similar to the path, each of the individual entries separated by the colon character,
    :, are directories.


    When you use the man command to request online help, it searches every directory
    given in the MANPATH for an online help page corresponding to the topic you requested.
    For example, the command


    ```

    $ man who

    ```


    looks for the online help page corresponding to the who command. If this page
    is found, it is displayed.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Interactive and Non-Interactive Shells


    Shell can run in two different modes: interactive and non-interactive. In interactive
    mode, the shell expects to read input from you and execute the commands that you
    specify. This mode is called interactive because it interacts with the user. In
    non-interactive mode, the shell does not interact with the user; instead it reads
    commands stored in a file and executes them. When it reaches the end of the file,
    it exits.


    Most people are familiar with interactive mode: log in, execute some commands
    in the shell, and log out.


    # Starting an Interactive Shell


    To start a shell in interactive mode, you can type in its name at the prompt.
    For example, the following command starts bash in interactive mode:


    ```

    $ /bin/bash

    bash$

    ```


    The first prompt, $, that is displayed by the shell started on your behalf when
    you logged in; the second prompt, bash$, is displayed by the bash you started.


    At this point, we have two interactive shells: The first one is waiting for the
    other to finish. At first glance, this does not sound extremely useful, but there
    are cases in which it can be quite helpful. For example, if you need to make changes
    to the shell''s settings, the easiest way to test your changes is to start another
    shell, perform and verify the changes, and then exit back to the original, unaltered
    shell.


    To exit from the second shell, you can use the exit command:


    ```

    bash$ exit

    $

    ```


    This returns you to the original shell. If you type exit here, the system will
    log you out. The exit command works in all Bourne-type shells.


    # Starting a Non-Interactive Shell


    You can start a shell in non-interactive mode as follows:


    ```

    $ /bin/sh filename

    ```


    Here filename is the name of a file that contains commands to execute. As an example,
    consider the compound command:


    ```

    $ date ; who

    ```'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'Let''s put these commands into a file called login.s. First open a file called
    login.s in an editor and type in this command and save the file. Now you can execute
    the commands in this file using the command:


    ```

    $ /bin/sh login.s

    ```


    This executes the compound command and displays its output. This is the first
    example of a shell script or shell program. Basically, a shell script is a file
    that contains a list of commands. When the shell executes the commands contained
    in the file, it does so without interacting with the user. For this reason, when
    the shell is used to execute a shell script, it is said to execute in non-interactive
    mode.


    # Making a Shell Script Executable


    One of the most important tasks in writing shell scripts is making the shell script
    executable and making sure that the correct shell is invoked on the script.


    In a previous example, you created the login.s script that executes the following
    compound command:


    ```

    date ; who ;

    ```


    If you wanted to run the script by just typing its name, you need to do two things:


    +   - Mark the file as executable.

    +   - Make sure that the right shell is used to execute the script.


    To make this script executable, you need to execute a command of the form:


    ```

    chmod a+x filename

    ```


    The chmod command, when used in this form, marks the file specified by filename
    as executable. For a complete discussion of chmod and its function, see Chapter
    6, "Manipulating File Attributes." As an example, the following command marks
    the file login.s executable:


    ```

    $ chmod a+x $login.s

    ```


    To ensure that the correct shell is used to execute a script, you must add a magic
    line, of the following form, as the first line of the script:


    ```

    #!shell

    ```


    Here shell is the name of the shell that should be used to execute the script.
    In most cases, you will want to use /bin/sh as shell, but if you want to use ksh
    for your scripts, you can specify /bin/ksh instead. Without a magic line, the
    current shell is always used'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'to evaluate a script, regardless of which shell the script was written for.
    If you omit the magic line from your scripts, csh and tcsh users might not be
    able to run them correctly.


    # The Magic of #!/bin/sh


    The #!/bin/sh must be the first line of a shell script in order for sh to be used
    to run the script. If this appears on any other line, it is treated as a comment
    and ignored by all shells.


    After this addition, the logins script contains two lines:


    ```

    #!/bin/sh

    date ; who ;

    ```


    Now it is possible to execute the script by just typing in its name:


    ```

    $ logins

    Tue Sep 18 18:44:12 PDT 2001

    ranga console Sep 12 18:22

    ```


    # Comments


    The magic first line for the shell script, #!/bin/sh, introduces the concept of
    comments. A comment is a statement embedded in a shell script that is not intended
    for execution by the shell. In shell scripts, comments start with the # character.
    Everything between the # and end of the line are considered part of the comment
    and are ignored by the shell.


    Adding comments to a script is quite simple: Open the script using an editor and
    add lines that start with the # character. For example, to add the following line
    to the logins shell script,


    ```

    # print out the date and who''s logged on

    ```


    you can open the file logins with an editor and insert this line as the second
    line in the file. Now the script has three lines:


    ```

    #!/bin/sh

    # print out the date and who''s logged on

    date ; who ;

    ```


    There is no change in the output of the script because comments are ignored. Comments
    do not slow down a script because the shell just skips them.


    You can also add comments to lines that contain commands by adding the # character
    after the commands. For example, you can add a comment to the line date ; who
    ; as follows:


    ```

    date ; who ; # execute the date and who commands

    ```'
  merge: -1
  img_proc: true
