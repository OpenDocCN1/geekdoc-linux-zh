    # Can I use the && and || operators to conditionally execute commands?


    The && and || operators are often used to conditionally execute commands. The
    basic syntax for using these operators is


    ```

    cmd1 op cmd2

    ```


    Here cmd1 and cmd2 are two commands and op is the && or || operator. If op is
    && then cmd2 is executed only when cmd1 is successful. If op is || then cmd2 is
    executed only when cmd1 fails.


    The following example illustrates the use of &&:


    ```

    type bash > /dev/null 2>&1 && { HAVE_BASH=1 ; echo "bash found" ; }

    ```


    This command is equivalent to the following if statement:


    ```

    type bash > /dev/null 2>&1

    if [ $? -eq 0 ] ; then

    HAVE_BASH=1

    echo "bash found"

    fi

    ```


    The following example illustrates the use of ||:


    ```

    grep soda /etc/hosts > /dev/null 2>&1 || echo ''Soda not found!''

    ```


    This command is equivalent to the following if statement:


    ```

    grep soda /etc/hosts > /dev/null 2>&1

    if [ $? -ne 0 ] ; then

    echo ''Soda not found!''

    fi

    ```


    # How do I execute some commands in a separate shell?


    The easiest way to execute a set of commands in a separate shell is to use the
    parentheses, (), as follows:


    ```

    ( list ; )

    ```'
