    # Function Chaining


    Function chaining is the process of calling a function from another function.
    The following script illustrates function chaining:


    ```

    #!/bin/sh

    orange () {

    echo "Now in orange"

    banana      # call func2()

    }

    banana () {

    echo "Now in banana"

    }

    orange

    ```


    This script defines two functions, orange and banana, and then executes orange.
    The first function, orange, outputs a message and then calls the function banana.
    The second function, banana, just outputs a message. The output from this script
    is


    ```

    Now in orange

    Now in banana

    ```


    # Common Errors


    Two common errors with declaring and using functions are


    +   - Omitting the parentheses, (), in a function definition.

    +   - Specifying the parentheses, (), in a function invocation.


    The following example illustrates the first type of error:


    ```

    ls1 { ls -l ; }

    ```


    Here, the parentheses are missing after ls1. This is an invalid function definition
    and will result in an error message similar to the following:


    ```

    sh: syntax error: '')'' unexpected

    ```'
