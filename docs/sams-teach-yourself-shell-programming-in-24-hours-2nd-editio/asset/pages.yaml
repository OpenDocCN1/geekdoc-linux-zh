- pgno: 228
  md: '![](img/3def70414996f811615f713b2077a154_228_0.png)


    # Hour 14


    # Functions


    Shell functions provide a way of mapping a name to a list of commands. Functions
    are similar to subroutines and procedures in other programming languages. You
    can also think of them as miniature shell scripts, complete with exit codes and
    arguments. The main difference between a script and a function is that a new instance
    of the shell is started for a shell script, whereas functions run in the current
    instance of the shell.


    This chapter is divided into the following two sections:


    +   - Using functions

    +   - Understanding scope, recursion, return codes, and data sharing


    The first section introduces the syntax for defining functions and illustrates
    their use, whereas the second section covers more advanced topics relating to
    the interaction of scripts and functions.


    # Using Functions


    Functions are defined as follows:


    ```

    name () { list ; }

    ```'
