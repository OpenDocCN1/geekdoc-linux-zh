- pgno: 239
  md: "These commands maintain a stack of directories internally and enable the user\
    \ to add and remove directories from the stack and list the contents of the stack.\n\
    \n# Understanding Stacks\n\nFor those readers who are not familiar with the programming\
    \ concept of a stack, you can think of it as a stack of plates: you can add or\
    \ remove a plate only at the top of the stack. You can access only the top plate,\
    \ not any of the middle plates in the stack. A stack in programming terms is similar.\
    \ You can add or remove an item only at the top of the stack.\n\nThese commands\
    \ are not available in Bourne shell or ksh. Newer versions of bash and zsh have\
    \ introduced these commands. In this section, you will implement each of these\
    \ commands as shell functions so that they can be used with any Bourne-like shell.\n\
    \nIn csh, the directory stack used by these commands is maintained within the\
    \ shell; in this implementation you will maintain the stack as a global exported\
    \ environment variable, called _DIR_STACK. The entries in _DIR_STACK are separated\
    \ by colons, ; just like entries in PATH or MANPATH. This allows you to handle\
    \ almost any directory name.\n\n# Implementing dirs\n\nFirst let's look at the\
    \ simplest of the three functions, dirs. This function just lists the entries\
    \ in the directory stack:\n\n```\ndirs() {\n    OLDFS=$IFS      # save IFS (internal\
    \ field separator)\n    IFS=:           # set IFS to :, so that we can process\n\
    \                    # each entry in _DIR_STACK easily\n\n    for i in $_DIR_STACK\
    \  # print out each entry in _DIR_STACK\n    do\n        echo \"$i \\\"\n    done\n\
    \n    echo            # print out new line (makes output pretty)\n\n    IFS=\"\
    $OLDFS\"    # restore IFS\n}\n```\n\nFirst, you save the current value of IFS\
    \ in OLDFS and then you set IFS to :. Because IFS is the Internal Field Separator\
    \ for the shell, modifying it allows you to use the for loop to cycle through\
    \ the individual entries in _DIR_STACK. When you are finished with all the entries,\
    \ you restore the value of IFS."
  merge: -1
  img_proc: true
- pgno: 240
  md: "> The shell uses the value of the variable IFS to split a string into separate\
    \ words. The default setting for IFS is the space and tab characters. This enables\
    \ the shell to determine the number of words that are in most strings. Normally,\
    \ the shell uses the default value of IFS to determine how many options are supplied\
    \ to a command, script, or shell function along with how many items are specified\
    \ for a for loop.\n> \n> In the previous example, you manipulated the value of\
    \ IFS in order to simplify the processing of the entries in _DIR_STACK.\n\n# Implementing\
    \ pushd\n\nThe pushd function is a bit more complicated than the dirs function.\
    \ In addition to listing the directories in the stack, it must also change to\
    \ a requested directory and then add that directory to the top of the stack. The\
    \ requested directory is the first argument to the function. If an argument is\
    \ not specified, the current directory (.) is used.\n\nThis example implements\
    \ pushd as follows:\n\n```\npushd() {\n  # set REQ to the first argument (if given,\
    \ otherwise use .)\n  REQ=\"${1:-.}\"\n  # if $REQ is not a directory, print an\
    \ error and return\n  if [ ! -d \"$REQ\" ] ; then\n    echo \"ERROR: $REQ is not\
    \ a directory.\" >&2\n    return 1\n  fi\n  # if we can cd to $REQ, update _DIR_STACK\
    \ and print it out\n  # otherwise print an error and return\n  if cd \"$REQ\"\
    \ > /dev/null 2>&1 ; then\n    _DIR_STACK=$(pwd) ; export _DIR_STACK ;\n    dirs\n\
    \  else\n    echo \"ERROR: Cannot change to directory $REQ.\" >&2\n    return\
    \ 1\n  fi\n  unset REQ\n}\n```\n\nThis function starts by determining the directory\
    \ to push onto the stack. It uses the default value substitution form of variable\
    \ substitution, covered in Chapter 9, \"Substitution,\" to"
  merge: -1
  img_proc: true
- pgno: 241
  md: "obtain this value. Then, the function determines whether the requested directory\
    \ is really a directory. If it is not a directory, you print an error and return\
    \ 1 to indicate failure. Otherwise, you change to that directory and then update\
    \ the directory stack with the full path of the new directory. You may have to\
    \ use the full path rather than value in $RED, because the value stored in $RED\
    \ might be a relative path. After the directory stack has been updated, you can\
    \ call dirs to output the directories stored on the stack.\n\n# Implementing popd\n\
    \nThe popd() function is much more complicated than the other two functions. Let's\
    \ look at the operations it performs:\n\n+   1. Removes the first entry from the\
    \ directory stack\n+   2. Updates the directory stack to reflect the removal\n\
    +   3. Changes to the directory indicated by the entry that was removed from the\
    \ stack\n+   4. Displays the full path of the current directory\n\nTo simplify\
    \ the first and second operations, you can implement a helper function for popd()\
    \ called _popd_helper(). This function performs all the work; popd() is simply\
    \ a wrapper around it. Often you need to write functions in this manner: one function\
    \ that provides a simple interface and another that performs the actual work.\n\
    \n# Implementing _popd_helper\n\nLet's first look at the function _popd_helper\
    \ to see how the directory stack is manipulated:\n\n```\n_popd_helper() {\n  #\
    \ set the directory to pop to the first argument, if\n  # the directory stack\
    \ is empty, return 1\n  # otherwise get rid of POPD from the arguments\n\nPOPD=\"\
    $1\"\nif [ -z \"$POPD\" ] ; then\n  echo 'ERROR: The directory stack is empty.'\
    \ >&2\n  return 1\nfi\nshift\n# if any more arguments remain, reinitialize the\
    \ directory\n# stack, and then update it with the remaining items,\n# otherwise\
    \ set the directory stack to null\nif [ -n \"$1\" ] ; then\n  _DIR_STACK=\"$1\"\
    \ ;\n  shift ;\n```"
