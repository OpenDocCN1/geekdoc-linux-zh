- pgno: 16
  md: '# Introduction


    In recent years, the UNIX operating system has seen a huge boost in its popularity,
    especially with the emergence of Linux. For programmers and users of UNIX, this
    comes as no surprise: UNIX was designed to provide an environment that''s powerful
    yet easy to use.


    One of the main strengths of UNIX is that it comes with a large collection of
    standard programs. These programs perform a wide variety of tasks from listing
    your files to reading e-mail. Unlike other operating systems, one of the key features
    of UNIX is that these programs can be combined to perform complicated tasks and
    solve your problems.


    One of the most powerful standard programs available in UNIX is the shell. The
    shell is a program that provides a consistent and easy-to-use environment for
    executing programs in UNIX. If you have ever used a UNIX system, you have interacted
    with the shell.


    The main responsibility of the shell is to read the commands you type and then
    ask the UNIX kernel to perform these commands. In addition to this, the shell
    provides several sophisticated programming constructs that enable you to make
    decisions, repeatedly execute commands, create functions, and store values in
    variables.


    This book concentrates on the standard UNIX shell called the Bourne shell. When
    Dennis Ritchie and Ken Thompson were developing much of UNIX in the early 1970s,
    they used a very simple shell. The first real shell, written by Stephen Bourne,
    appeared in the mid 1970s. The original Bourne shell has changed slightly over
    the years; some features were added and others were removed, but its syntax and
    its resulting power have remained the same.


    The most attractive feature of the shell is that it enables you to create scripts.
    Scripts are files that contain a list of commands you want to run. Because every
    script is contained in a file and every file has a name, scripts enable you to
    combine existing programs to create completely new programs that solve your problems.
    This book teaches you how to create, execute, modify, and debug shell scripts
    quickly and easily. After you get used to writing scripts, you will find yourself
    solving more and more problems with them.


    # How This Book Is Organized


    This book assumes that you have some familiarity with UNIX and know how to log
    in, create, and edit files, as well as how to work with files and directories
    to a limited extent. If you haven''t used UNIX in a while or you aren''t familiar
    with one of these topics, don''t worry: the first part of this book reviews this
    material thoroughly.'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'This book is divided into three parts:


    +   - Part I is an introduction to UNIX, the shell, and some common tools.

    +   - Part II covers programming using the shell.

    +   - Part III covers advanced topics in shell programming.


    Part I consists of Chapters 1 through 7. The following material is covered in
    the individual chapters:


    +   - Chapter 1, "Shell Basics," discusses several important concepts related
    to the shell and describes the different versions of the shell.

    +   - Chapter 2, "Script Basics," describes the process of creating and running
    a shell script. It also covers the login process and the different modes in which
    the shell executes.

    +   - Chapters 3, "Working with Files," and 4, "Working with Directories," provide
    an overview of the commands used when working with files and directories. These
    chapters show you how to list the contents of a directory, view the contents of
    a file, and manipulate files and directories.

    +   - Chapter 5, "Input and Output," covers the echo, printf, and read commands
    along with the < and > input redirection operators. This chapter also covers using
    file descriptors.

    +   - Chapter 6, "Manipulating File Attributes," introduces the concept of file
    attributes. It covers the different types of files along with how to modify a
    file''s permissions.

    +   - Chapter 7, "Processes," shows you how to start and stop a process. It also
    explains the term process ID and how you can view them.


    By this point, you should have a good foundation in the UNIX basics. This will
    enable you to start writing shell scripts that solve real problems using the concepts
    covered in Part II. Part II is the heart of this book, consisting of Chapters
    8 through 18. It teaches you about all the tools available when programming in
    the shell. The following material is covered in these chapters:


    +   - Chapter 8, "Variables," explains the use of variables in shell programming,
    shows you how to create and delete variables, and explains the concept of environment
    variables.

    +   - Chapters 9, "Substitution," and 10, "Quoting," cover the topics of substitution
    and quoting. Chapter 9 shows you the four main types of substitution: filename,
    variable, command, and arithmetic substitution. Chapter 10 shows you the behavior
    of the different types of quoting and its affect on substitution.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '+   - Chapters 11, "Flow Control," and 12, "Loops," provide complete coverage
    of flow control and looping. The flow control constructs if and case are covered
    along with the loop constructs for and while.

    +   - Chapter 13, "Parameters," shows you how to write scripts that use command-line
    arguments. The special variables and the getopts command are covered in detail.

    +   - Chapter 14, "Functions," discusses shell functions. Functions provide a
    mapping between a name and a set of commands. Learning to use functions in a shell
    script is a powerful technique that helps you solve complicated problems.

    +   - Chapters 15, "Text Filters," 16, "Filtering Text with Regular Expressions,"
    and 17, "Filtering Text with awk," cover text filtering. These chapters show you
    how to use a variety of UNIX commands including grep, tr, sed, and awk.

    +   - Chapter 18, "Other Tools," provides an introduction to some tools that are
