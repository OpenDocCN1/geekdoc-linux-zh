- pgno: 299
  md: "The if and while statements are similar to those found in the shell; whereas\
    \ the for statement is much closer to the version found in the C programming language.\n\
    \n# The if Statement\n\nThe if statement enables you to make tests before executing\
    \ some awk command. The pattern matching and expressions that you have used in\
    \ the previous examples are essentially if statements that affect the overall\
    \ execution of the awk program.\n\nThe basic syntax of the if statement is\n\n\
    ```\nif (expr1) {\n    action1\n} else if (expr2) {\n    action2\n} else {\n \
    \   action3\n}\n```\n\nHere expr1 and expr2 are expressions created using the\
    \ conditional operators. The parentheses surrounding expr1 and expr2 are required.\
    \ The actions—action1, action2, and action3—can be any sequence of valid awk commands.\
    \ The braces surrounding these actions are required only when an action contains\
    \ more than one statement, but most programmers always include them for the sake\
    \ of clarity and maintainability.\n\nBoth the else if and the else statements\
    \ are optional. There is no limit on the number of else if statements that can\
    \ be given.\n\nThe execution is as follows:\n\n+   1. Evaluate expr1 (if).\n+\
    \   2. If expr1 is true, execute action1 and exit the if statement.\n+   3. If\
    \ expr1 is false, evaluate expr2 (else if).\n+   4. If expr2 is true, execute\
    \ action2 and exit the if statement.\n+   5. If expr2 is false, execute action3\
    \ and exit the if statement (else).\n\nAs a simple example, let's write a script\
    \ that prints a list of fruits in fruit_prices.txt highlighting the following\
    \ conditions:\n\n+   - Whether an item costs more than a dollar\n+   - Whether\
    \ you need to reorder the item\n\nAs you did in previous examples, you will use\
    \ the * character and the string REORDER for highlighting these conditions."
  merge: -1
  img_proc: true
- pgno: 300
  md: "Using the if statement, the script is\n\n```\n#!/bin/sh\nawk '{\n    printf\
