    can be accessed by shell scripts. The specific topics related to libraries that
    you will examine are


    +   - Library basics

    +   - Creating a library


    # Library Basics


    In many of the scripts in this book, you created utility functions that display
    error message and prompt the users for input. When two scripts needed the'
