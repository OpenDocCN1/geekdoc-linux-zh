- pgno: 416
  md: 'In conditional execution, the flow of a script was modified depending on the
    version of UNIX being used. In abstraction, function implementations were altered
    to account for the differences between versions of UNIX; the overall flow of the
    script remained the same.


    Using the techniques and tips in this chapter, you can port shell scripts across
    different versions of UNIX.


    # Question


    +   1. Write a function called getCharCount that prints the number of characters
    in a file. Use wc to obtain the character count. Linux, FreeBSD, and SunOS (not
    Solaris), use the -c option for wc, whereas other versions of UNIX use the -m
    option. Feel free to use the function getOSname.


    # Terms


    **Abstraction** Scripts that use abstraction retain the same basic flow by placing
    the conditional execution statements within functions. When a function is called,
    it decides which commands to execute on a given platform.


    **Conditional Execution** Alters the execution of a script based on the system
    type. A script that uses conditional execution usually contains an if statement
    at the beginning of the script that sets variables and the commands to use on
    a particular platform.'
  merge: -1
  img_proc: true
