- pgno: 229
  md: 'Here, name is the name of the function and list is a list of commands. The
    list of commands, list, is referred to as the body of the function. The parentheses,
    { and }, that follow name are required.


    The job of a function is to bind name to list, so that whenever name is specified
    list is executed. When a function is defined, list is not executed: the shell
    parses list to ensure that there are no syntax errors and stores name in its list
    of commands. The following example illustrates a basic function definition:


    ```

    ls1() { ls -l ; }

    ```


    Here you define the function ls1 and specify list as ls -l.


    An alternative form of function definition is available in ksh, bash, and zsh:


    ```

    function name { list ; }

    ```


    Here, name is the name of the function and list is the list of commands to be
    executed.


    This form of function definition is not available in the Bourne shell. Scripts
    that need to be ported to older systems should not use this form for function
    definition.


    # Executing Functions


    You can execute or call a function that has been defined by specifying its name.
    For example, you can execute the function ls1, defined in the previous example,
    as follows:


    ```

    $ ls1

    ```


    This causes the shell to execute the body of the function, in this case the command
    ls -l, and output the result. The output will be similar to the following:


    ```

    total 6

    drwxr-xr-x  3 root  wheel  512 Oct 29 08:59  ./

    drwxr-xr-x 25 root  wheel  512 Oct 29 08:02  ../

    drwxr-xr-t  2 root  wheel  512 Nov  3 17:49  vi.recover/

    ```


    Functions are normally defined on the command line or within a script. Once defined,
    the function acts as a valid command in all the sub-shells started by that shell
    or script. For example, if you enter the command:


    ```

    $ ls1() { ls -l ; }

    ```


    The function ls1 becomes a valid command name that can be accessed by specifying
    ls1. It is accessible in sub-shells as well:


    ```

    $ ( ls1 )

    total 6

    drwxr-xr-x  3 root  wheel  512 Oct 29 08:59  ./

    ```'
