  md: '# Terms


    **Debugging Hooks** Functions that enable shell tracing in critical code sections.


    **Execution Tracing** See shell tracing.


    **Invocation Activated** Methods for enabling debugging modes that take effect
    when a script is invoked.


    **Programmer Activated** Debugging modes activated only when the shell script
    programmer uses the set command.


    **Shell Tracing** Each command is printed in the exact form that it is executed.


    **Syntax Checking** The process of verifying a script''s syntax without executing
