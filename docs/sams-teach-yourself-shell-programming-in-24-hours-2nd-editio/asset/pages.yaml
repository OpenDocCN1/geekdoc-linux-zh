- pgno: 340
  md: '# Hour 20


    ![](img/3def70414996f811615f713b2077a154_340_0.png)


    # Debugging


    Most of the scripts you have looked at have been quite short, thus the issue of
    debugging has boiled down to examining the output to ensure it is correct.


    For larger shell scripts, especially scripts used to change system configurations,
    trying to deduce the source of a problem based on just output is insufficient.
    By the time you get the output it might be too late—the script could have made
    incorrect and possibly destructive modifications.


    Fortunately, the shell provides several built-in commands for enabling different
    modes of debugging support. The built-in debugging support can be very helpful
    when you need to add features to a large script that someone else developed; it
    can help you ensure that your changes don’t affect the rest of the script.


    This chapter covers several techniques for debugging shell scripts, with a concentration
    on the following:


    +   - Syntax checking

    +   - Shell tracing'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# Enabling Debugging


    By now, you are quite familiar with the basic syntax for executing a shell script:


    ```

    $ script arg1 arg2 ... argN

    ```


    Here script is the name of the script and arg1 through argN are the arguments
    to the script.


    An alternative method to execute a shell script is


    ```

    $ /bin/sh opt script arg1 arg2 ... argN

    ```


    This invokes the shell, in this case /bin/sh, with the debugging option specified
    by opt and instructs the shell to execute script. Table 20.1 lists the various
    debugging options.


    A second way to enable debugging is to change the first line of script. Usually,
    the first line of a script is


    ```

    #!/bin/sh

    ```


    UNIX uses this line to determine the shell you can use to execute a script. This
    indicates that the shell /bin/sh should be used to execute the script. You can
    modify this line, as follows, in order to specify a debugging option:


    ```

    #!/bin/sh opt

    ```


    These methods for enabling debugging modes take effect when a script is invoked,
    so they are sometimes referred to as invocation activated debugging modes.


    Table 20.1 Debugging Options for Shell Scripts


    | Name | Option | Description |

    |---|---|---|

    | No Exec | -n | Reads all commands, but does not execute them. |

    | Verbose | -v | Displays all lines as they are read. |

    | Execution Trace | -x | Displays commands and their arguments as they are executed.
    Often referred to as shell tracing. |


    # Debugging and $-


    When one of the debugging options is activated, a letter corresponding to that
    option is added to the variable $. For example, if the -v (verbose) option is
    used, the letter v is added to $. Similarly when the -x is used, the letter x
    is added to $.


    You can detect if one of these options is active by using a case statement similar
    to the following:


    ```

    case $- in

    *v*) : # verbose mode

    ```'
