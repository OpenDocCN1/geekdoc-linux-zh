- pgno: 419
  md: '# Shell and Command Questions


    This section covers some of the common questions about the shell itself and how
    the shell executes commands.


    # Why does #!/bin/sh have to be the first line of my scripts?


    Chapter 2 "Script Basics," stated that #!/bin/sh must be the first line in your
    script to ensure that the correct shell is used to execute your script. This line
    must be the first line in your shell script because of the underlying mechanism
    used by a shell to execute commands.


    When you ask a shell to execute a command as follows


    ```

    $ date

    ```


    The shell uses the exec system call to ask the UNIX kernel to execute the command
    you requested. System calls are C language functions built into to the UNIX kernel
    that enable you to access features of the kernel. The shell passes the name of
    the command that should be executed to the exec system call. This system call
    reads the first two characters in a file to determine how to execute the command.
    In the case of shell scripts, the first two characters are #!, indicating that
    the script needs to be interpreted by another program instead of executed directly.
    The rest of the line is treated as the name of the interpreter to use.


    Usually the interpreter is /bin/sh, but you can also specify options to the shell
    on this line. Sometimes options such as -x or -v are specified to enable debugging.
    This also enables you to write scripts tuned for a particular shell such as ksh,
    bash, or zsh by using /bin/ksh, /bin/bash, or /bin/zsh instead of /bin/sh. (The
    exact path to the shell may vary from system to system.)


    # How can I access the name of the current shell in my initialization scripts?


    In your shell initialization scripts, the name of the current shell is stored
    in the variable $0.


    Users who have a single .profile that is shared by sh, ksh, and bash use this
    variable in conjunction with a case statement near the end of this file to execute
    additional shell-specific startups. For example, you can use the following case
    statement in your .profile to set up the prompt, PS1, differently depending on
    the shell:


    ```

    case "$0" in

    *bash) PS1="\t \h \# " ;;

    *ksh) PS1="\u@\h \$ " ;;

    *sh) PS1="\u@\h \$ " ;;

    esac

    export PS1

    ```'
  merge: -1
  img_proc: true
- pgno: 420
  md: "Here, you have specified the shells as *bash, *ksh, and *sh, because some versions\
    \ of UNIX place the - character in front of login shells, but not in front of\
    \ other shells.\n\n# How do I tell whether the current shell is interactive or\
    \ non-interactive?\n\nSome scripts need the capability to determine whether they\
    \ are running in an interactive shell or a non-interactive shell. Usually this\
    \ is restricted to your shell initialization scripts because you don't want to\
    \ perform a full-blown initialization every time these scripts execute. Some other\
    \ examples include scripts that can run from the at or cron commands.\n\nYou can\
    \ tell whether a shell is interactive by checking the value of the variable $-.\
    \ If the value contains the letter i, the shell is interactive. Otherwise, it\
    \ is non-interactive. The following case statement illustrates one method for\
    \ checking the value of $- :\n\n```\n```bash\ncase $- in\n*i) : # interactive\n\
    \    # commands for interactive shells go here\n    ;;\n*)  : # non interactive\n\
    \    # commands for non-interactive shells go here\n    ;;\nesac\n```\n```\n\n\
    The following example illustrates the use of this case statement:\n\n```\n```bash\n\
    isInteractive () {\ncase $- in\n  *i) echo Interactive ; ec=0 ;;\n  *)  echo Non-Interactive\
    \ ; ec=1 ;;\nesac\nreturn $ec\n}\n```\n```\n\nThis function can be used to determine\
    \ whether the current shell is interactive.\n\n# How do I discard the output of\
    \ a command?\n\nSometimes you will need to execute a command, but you don't want\
    \ the output displayed to the screen. In these cases you can discard the output\
    \ by redirecting it to the file /dev/null:\n\n```\n```bash\ncmd > /dev/null\n\
    ```\n```\n\nHere cmd is the name of the command you want to execute. The file\
    \ is a special file (called the bit bucket) that automatically discards all its\
    \ input. For example, the following command discards the output of the grep command:\n\
    \n```\n```bash\nif grep soda /etc/hosts > /dev/null ; then\necho 'Soda found!'\n\
    fi\n```\n```"
  merge: -1
  img_proc: true
- pgno: 421
  md: "Because commands also output error messages, you will often have to redirect\
    \ STDERR to /dev/null. If you do not redirect STDERR, when a command fails your\
    \ script will display that error message, which can be confusing to a user. To\
    \ discard both your output command and its error output, you can redirect STDERR\
    \ (file descriptor 2) to STDOUT (file descriptor 1) and redirect STDOUT to /dev/null\
    \ as follows:\n\n```\ncmd > /dev/null 2>&1\n```\n\nThe following example illustrates\
    \ redirecting both STDERR and STDOUT to /dev/null:\n\n```\nif grep soda /etc/hosts\
    \ > /dev/null 2>&1 ; then\n echo \"Soda found!\"\nfi\n```\n\n# How can I display\
    \ messages on STDERR?\n\nYou can display a message on to STDERR by redirecting\
    \ STDIN into STDERR as follows:\n\n```\necho msg 1>&2\n```\n\nHere msg is the\
    \ message you want to display. For example, the output of the following command\
    \ is displayed on STDERR instead of STDOUT:\n\n```\n$ echo 'This is an error message'\
    \ 1>&2\n```\n\nIf you are interested in shell functions that perform additional\
    \ formatting, please consult Chapter 21, \"Problem Solving with Functions,\" which\
    \ covers several shell functions that display messages on to STDERR.\n\n# How\
    \ can I determine whether a command executed successfully?\n\nYou can determine\
    \ whether a command executed successful by checking the command's exit code, which\
    \ the shell stores in the variable $?. By convention, the exit code of a successful\
    \ command is 0. A nonzero exit code indicates a failure.\n\nAn if statement of\
    \ the following form is often used to check whether a command executed successfully:\n\
    \n```\ncmd\nif [ $? -eq 0 ] ; then\n  # cmd successful\nelse\n  # cmd failed\n\
    fi\n```"
  merge: -1
  img_proc: true
- pgno: 422
