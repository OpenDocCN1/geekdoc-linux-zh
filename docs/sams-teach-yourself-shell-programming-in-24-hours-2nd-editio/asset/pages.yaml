    # Hour 17


    # Filtering Text with awk


    awk is a program and a complete programming language that enables you to search
    many files for patterns and to conditionally modify files without having to worry
    about opening files, reading lines, or closing files. It''s found on all UNIX
    systems and is quite fast, easy to learn, and extremely flexible. This chapter
    concentrates on the awk elements that are most commonly used in shell scripts,
    specifically:


    +   - Field editing

    +   - Variables

    +   - Flow control statements


    # What Is awk?


    awk is a program and a programming language that enable you to search through
    files and modify records in these files based on patterns. The name'
