- pgno: 313
  md: '# The find Command


    The find command is a very powerful, very flexible way to create a list of files
    that match given criteria. The basic syntax is


    ```

    find dir options actions

    ```


    where dir is the name of a directory and options and actions are discussed in
    this section.


    Here is a simple example:


    ```

    $ find / -name alpha -print

    ```


    This example looks for all files named alpha and displays the full pathname to
    the screen (standard output). It is a useful command to know about when you are
    sure you have a file named alpha but can''t remember what directory it is in or
    want to know whether it exists in more than one directory. Here is some possible
    output from that command:


    ```

    /reports/1998/alpha

    /reports/1998/region2/alpha

    /tmp/alpha

    ```


    > If you specify the starting directory to find as /, UNIX will search every directory
    on your system. Because many directories will be inaccessible, this will produce
    many error messages. You can redirect the error messages to /dev/null using output
    redirection as follows: find dir options action >> /dev/null /dev/null


    You will shortly learn about the elements of the find command in detail. Files
    can be selected not only by name but also by size, last modification date, last
    access date, and so on. First let''s examine this more complex example with a
    brief explanation of each part of the example, so you get a sense of what options
    and actions look like:


    ```

    $ find /reports/1998 -name alpha -type f -print -exec lp {} \;

    ```


    Table 18.1 provides a breakdown of these elements.


    | Command Element | Description |

    |---|---|

    | /reports/1998 | The starting directory. find looks only in this directory and
    its subdirectories for files that match the following criteria. |

    | -name alpha | An option that says you are looking only for files whose name
    is alpha—/reports/1998/region2/alpha, for example. The find command does not check
    any words in the directory portion of a filename for alpha. It checks only the
    filename itself. |'
  merge: -1
  img_proc: true
- pgno: 314
  md: '**TABLE 18.1 Continued**


    | Command Element | Description |

    |---|---|

    | `-type f` | An option that says you are looking only for files of type f, which
    means regular or normal files, and not directories, device files, and so on. Any
    files selected must match both conditions: they must have the name alpha and must
    be regular files. |

    | `-print` | An action that says to display to standard output the pathname for
    any files that match the criteria given by the options. |

    | `-exec lp {} \;` | An action that says to use the lp command to print a hard
    copy of any files that match the criteria. Multiple actions can be specified.
    |


    # find: Starting Directory


    Because most systems contain a huge number of files, find can take several minutes
    or more to complete. For this reason, find enables you to specify a starting directory
    to narrow down the number of files it has to search. Only files in this directory
    and all its subdirectories are checked. The starting directory can be either an
    absolute or relative pathname. If you specify an absolute pathname such as /reports,


    ```

    $ find /reports -name alpha -print

    ```


    then all the files found are specified as absolute pathnames, as in this sample
    output:


    ```

    /reports/1998/alpha

    /reports/1998/region2/alpha

    ```


    If you specify a relative pathname to find,


    ```

    $ cd /reports

    $ find ./1998 -name alpha -print

    ```


    all the files are displayed relative to the starting directory. For example,


    ./1998/alpha

    ./1998/region2/alpha


    To search the whole system, you can specify / as the starting directory. For example,
    the following find command displays all files on the system that have the file
    alpha:


    find / -name alpha -print


    To search the entire system and still display the filenames as relative pathnames,
    you can do the following:


    $ cd / && find . -name alpha -print'
  merge: -1
  img_proc: true
- pgno: 315
  md: 'In this case, you first cd to / and then tell find to search all the directories,
    starting with the current directory (/) for files with the name alpha.


    Sample output:


    ```

    ./reports/1998/alpha

    ./reports/1998/region2/alpha

    ```


    This point about relative versus absolute pathnames is important if you are using
    find to generate a list of files to be backed up. It is better to back up using
    relative pathnames that enable the files to be restored to a temporary directory.


    # find: -name Option


    The -name option enables you to specify either an exact or partial filename for
    find to match. You have already seen examples of how to specify a full filename.
    In order to specify a partial pathname, you need to use the filename substitution
    meta-characters from Chapter 9. For instance,


    ```

    find / -name ''*alpha'' -print

    ```


    This displays all files that contain alpha anywhere within the filename. Here
    is some sample output:


    ```

    /reports/1998/alpha

    /reports/1998/alpha2

    /reports/1998/old/alpha

    /reports/1998/region2/alpha

    /tmp/alpha

    /usr/fred/alphadms

    ```


    All the wildcards covered in Chapter 9 can be used:


    +   * ? [characters] [!characters]


    You must enclose the filename containing these wildcards within single quotes
    (see Chapter 9); otherwise, your find command will not always give you the desired
    results.


    # find: -type Option


    The -type option enables you to specify the type of file to search for, as in
    this example:


    ```

    find / -type d -print

    ```


    -type d indicates directories, so only files that are directories are displayed.
    In this example, all directories in the whole system are displayed. Notice that
    no -name option has been given, so you display all directories regardless of their
    names. Table 18.2 lists other types.'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# TABLE 18.2 Types Available for the find Command


    | Type | Description |

    |------|-------------|

    | f | Regular or normal file |

    | d | Directory |

    | b | Block special device file |

    | c | Character special device file (raw) |

    | l | Symbolic link |

    | p | Named pipe |


    # find: -mtime, -atime, -ctime


    The find command has three options that allow you to find files based on their
    last modified, accessed, or changed times:


    +   - `-mtime` Finds files last modified more than, exactly, or fewer than n days
    ago.

    +   - `-atime` Finds files last accessed more than, exactly, or fewer than n days
    ago.

    +   - `-ctime` Finds files that were last changed more than, exactly, or fewer
    than n days ago.


    A file is considered to have changed when it is first created and also later if
    the owner, group, or permissions are changed.


    Each of these options must be specified with an additional integer argument, n,
    which is measured in days:


    +   - `+n` Finds files last modified, accessed, or changed more than n days ago.

    +   - `n` Finds files last modified, accessed, or changed exactly n days ago.

    +   - `-n` Finds files last modified, accessed, or changed fewer than n days ago.


    Let''s look at a few examples that illustrate how these options work. The following
    find command locates files that were last modified fewer than five days ago:


    ```

    find / -mtime -5 -print

    ```


    A command of this sort is useful when you are sure you modified a file recently
    but can''t remember its name or directory. To find files that have not been modified
    in the last n days, you need to look for files that were last modified more than
    n days ago:


    ```

    find / -mtime +90 -print

    ```


    This shows all files that were last modified more than 90 days ago—that is, files
    that have not been modified in the last 90 days.'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# -atime Is Often Defeated by Nightly Backups


    In theory, find''s -atime option is useful if you are short of disk space and
    want to find files that have not been accessed in a long time so that you can
    archive and delete them. However some backup programs, such as tar, prevent -atime
    from being useful because all files are accessed nightly during the system backup.


    # find: -size Option


    The -size option enables you to locate files based on the size of a file. It is
    useful when you want to find the largest files that are consuming disk space.
    Following -size, you must specify an integer number:


    +   +n  Finds files that contain more than n blocks.

    +   n  Finds files that contain exactly n blocks.

    +   -n  Finds files that contain fewer than n blocks.


    For example, the following command prints the name of all the files that are larger
    than 2,000 blocks:


    ```

    find / -size +2000 -print

    ```


    It is a very rare occasion when you need to search for files that contain an exact
    number of blocks. Usually you look for files that contain more than n blocks or
    fewer than n blocks. A common error is to forget the plus or minus sign for these
    types of find options and then wonder why find did not locate the expected files.


    # What Is a Block?


    A block is the smallest unit of the disk that can be allocated to a file. Although
    the size of the data in the file might be much less than the size of the block,
    it still takes up exactly one block on the disk.


    The size of a block varies between systems. On BSD and Solaris systems the block
    size is usually 512 bytes. On Linux it is usually 1024 bytes.


    # find: Combining Options


    If you specify more than one option, the file must match all options to be displayed:


    ```

    find / -name alpha -size +50 -mtime -3 -print

    ```'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'Here find displays files only when all the following are true:


    +   - The name is alpha

    +   - The size is greater than 50 blocks

    +   - The file was last modified fewer than three days ago


    You can specify a logical "or" condition using -o:


    ```

    find / ( -size +50 -o -mtime -3 ) -print

    ```


    Notice the use of the escaped parentheses to group the "either" and "or" options.
    This finds files that either have size greater than 50 blocks or were last modified
    fewer than three days ago


    # find: Negating Options


    You can use the ! sign to select files that do not match the given option:


    ```

    find /dev ! ( -type b -o -type c -o -type d ) -print

    ```


    This locates all files in the /dev directory and its subdirectories that are not
    blocked special device files, character special device files, or directories.
    This is a useful command to locate device names that users have misspelled, which
    leaves a regular file in /dev that can waste a large amount of disk space. The
    parentheses in this example are escaped so that the shell does not try to interpret
    them.


    # find: -print Action


    The -print action tells find to display the pathnames of all files that match
    the options given before -print. If you put the -print action before other options
    in the command line, those options are not used in the selection process:


    ```

    find / -size 20 -print -mtime +30

    ```


    This command prints all files that contain fewer than 20 blocks. The -mtime option
    is ignored because it comes after the -print action on the command line.


    If no action is specified on the command line, -print is performed by default
    on Linux and BSD systems. On other versions of UNIX, you must include -print specifically
    otherwise output will not be generated.


    # find: -exec Action


    The -exec action allows you to specify a command to execute on each of the files
    that match the options given. The syntax for the -exec option is


    ```

    -exec cmd \;

    ```'
  merge: -1
  img_proc: true
- pgno: 319
  md: 'Here cmd is the name of the command you want to execute. The string \; must
    terminate the command, otherwise find will display a syntax error similar to the
    following:


    ```

    find: -exec, no terminating '';''

    ```


    If you need to access the filename in cmd, you can use the string {}. For example,
    the following command:


    ```

    $ find / -name alpha -exec chmod a+r {} \;

    ```


    executes chmod on every file named alpha so that everyone can read the file. Another
    example,


    ```

    $ find / -name core -exec rm -f {} \;

    ```


    Finds all files on the system named core and executes the rm command to delete
    them.


    The -f option to rm is specified so that rm does not ask for confirmation if you
    don''t own the file and don''t have write permission to the file. This is a useful
    command for root to run periodically because, if a process aborts, it might leave
    a debugging file named core in the current directory. After a while, these core
    files, which are not small, can collectively consume an unreasonable amount of
    disk space. This find command restores that disk space by finding and deleting
    those core files.


    # xargs


    xargs is a command that accepts a list of words from standard input and provides
    those words as arguments to a given command:


    ```

    cat filelist | xargs rm

    ```


    You cannot pipe the output of cat directly to rm because rm does not look for
    filenames on standard input. xargs reads the files being passed by cat and builds
    up a command line beginning with rm and ending with the filenames. If there are
    a large number of files, xargs runs the rm command multiple times, deleting some
    of the files each time. You can specify how many arguments from standard input
    to build up on the command line with the -n option:


    ```

    cat filelist | xargs -n 20 rm

    ```


    -n 20 says to put only 20 arguments on each command line, so you delete only 20
    files at a time. Here is a different example to give you more insight into how
    xargs works:


    ```

    $ ls

    acme

    report16

    report13

    report34

    report134

    ```'
  merge: -1
  img_proc: true
