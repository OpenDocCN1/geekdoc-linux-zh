    +   - anna


    # The follow Option


    An extremely useful feature of the tail command is the -f (short for follow) option:


    ```

    tail -f file

    ```


    Specifying the -f option enables you to examine the specified file while programs
    are writing to it.


    If you have to look at the log files generated by a program that you are debugging,
    but don''t want to wait for the program to finish, you can start the program and
    then use tail -f to view its log file. Some Web administrators use a command similar
    to the following to watch the HTTP requests made for their system:


    ```

    $ tail -f /var/log/httpd/access_log

    ```


    > If you use tail -f, make sure that you do not leave it running for extended
    periods of time. This command can cause an undue burden on the resources of a
    heavily loaded machine.


    # Using grep


    The grep command lets you locate the lines in a file that contain a particular
    word or a phrase. The word grep is short for globally regular expression print.
    The command is derived from a feature of the original UNIX text editor, ed. To
    find a word in ed, the following command was used:


    ```

    g/word/p

    ```'
