- pgno: 424
  md: "Here list is executed in a separate shell (called a sub-shell) and any changes\
    \ the commands in list make to the working directory (via calls to cd) or environment\
    \ variables will not affect the values in the script that invoked list.\n\nAs\
    \ an example, the following function allows you to determine the absolute pathname\
    \ of a directory without altering your current working directory:\n\n```\nabspath\
    \ () { cd \"$1\" && pwd ; }\n```\n\n# Variable and Argument Questions\n\nThis\
    \ section examines some questions that relate to variables and their use in shell\
    \ scripts. It also covers questions related to command-line arguments.\n\n# How\
    \ can I include functions and variable definitions located in one script in to\
    \ another script?\n\nTo include functions and variable definitions defined in\
    \ one script in to another script, you need to use the . command as follows:\n\
    \n```\n. file\n```\n\nHere file is the pathname of the script you want to include.\
    \ This topic is covered in detail in Chapter 21, \"Problem Solving with Functions.\"\
    \n\n![](img/3def70414996f811615f713b2077a154_424_0.png)\n\n> When you include\
    \ a file using the . command, make sure that the file does not contain the exit\
    \ command as this will cause the current instance of the shell to exit.\n> If\
    \ you are using the . command to include a file in your login session, your session\
    \ will be terminated and you will have to log in again.\n\n# Is it possible to\
    \ consider each argument to a shell script one at a time?\n\nThis can be accomplished\
    \ using a for loop of the following form:\n\n```\nfor arg in \"$*\"\ndo\n  list\n\
    done\n```"
