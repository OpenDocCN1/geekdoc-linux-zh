- pgno: 86
  md: '![](img/3def70414996f811615f713b2077a154_86_0.png)


    # Hour 5


    # Input and Output


    Until now, you have been looking at commands that output messages. In this chapter,
    you will look at the different types of output available to shell scripts. You
    will also discover the mechanisms used to obtain input from users. Specifically,
    the areas that you will cover are


    +   - Output to the screen

    +   - Output to a file

    +   - Input from a file

    +   - Input from users


    # Output


    As you have seen in previous chapters, most commands produce output. For example,
    the command


    ```

    $ date

    ```


    produces the current date in the terminal window:


    ```

    Thu Nov 12 16:32:35 PST 2001

    ```'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'When a command produces output that is written to the terminal, you say that
    the program has printed its output to the Standard Output, or STDOUT. When you
    run the date command, it prints the date to STDOUT. You have also seen commands
    produce error messages, such as:


    ```

    $ ln -s ch01.doc ch01-01.doc

    ln: cannot create ch01-1.doc: File Exists

    ```


    Error messages are not written to STDOUT, but instead they are written to a special
    type of output called Standard Error or STDERR, which is reserved for error messages.
    Most commands use STDERR for error messages and STDOUT for informational messages.
    You will look at STDERR later in this chapter. In this section, you will look
    at how shell scripts can use STDOUT to output messages to each of the following:


    +   - The terminal (STDOUT)

    +   - A file

    +   - The terminal and a file


    # Output to the Terminal


    Two common commands that can be used to output messages to STDOUT are echo and
    printf. The echo command is mostly used for printing strings that require simple
    formatting. The printf command is the shell version of the C language function
    printf. It provides a high degree of flexibility in formatting output.


    # echo


    The syntax for echo is as follows


    ```

    echo str

    ```


    Here str is the message you want printed. For example, the command $ echo Hi produces
    the following output: Hi You can also embed spaces in the output as follows: $
    echo Safeway has fresh fruit Safeway has fresh fruit In addition to spaces, you
    can embed punctuation marks and formatting escape sequences in the str.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# Embedding Punctuation Marks


    Punctuation marks are used when you need to ask the user a question, complete
    a sentence, or issue a warning. For example, the following command might be used
    as the prompt in an install script:


    ```

    echo Do you want to install?

    ```


    Usually, significant error messages are terminated with the exclamation point.
    For example, the following command


    ```

    echo ERROR: Could not find required libraries! Exiting.

    ```


    might be found in a script that configures a program for execution. You can also
    use any combination of the punctuation marks. For example, the following command
    uses the comma (,), question mark (?), and exclamation point (!) punctuation marks:


    ```

    $ echo Eliza, where the devil are my slippers?!?

    Eliza, where the devil are my slippers?!?

    ```


    # Formatting with Escape Sequences


    The output in the previous examples consisted of single lines with words separated
    by spaces. Frequently, output needs to be formatted into columns or multiple lines.
    By using escape sequences, you can format the output of echo. An escape sequence
    is a special sequence of characters that represents another character. When the
    shell encounters an escape sequence, it substitutes the escape sequence with a
    different character. The echo command understands several formatting escape sequences,
    the most common of which are given in Table 5.1.


    TABLE 5.1 Escape Sequences for the echo Command


    | Escape Sequence | Description |

    |---|---|

    | \n | Prints a newline character |

    | \t | Prints a tab character |

    | \c | Prints a string without a default trailing newline |


    ![](img/3def70414996f811615f713b2077a154_88_0.png)


    > The escape sequences for the echo command, given in Table 5.1, do not work with
    all shells. These escape sequences work in the Bourne Shell (/bin/sh or /bin/sh
    on Solaris) and Korn Shell (ksh). They do not work with bash or zsh. The printf
    command, covered later in this chapter, can be used as a work-around for this
    limitation in bash and zsh.'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'The \n escape sequence is normally used when you need to generate more than
    one line of output. For example, the command


    ```

    $ FRUIT_BASKET="apple orange pear"

    $ echo "Your fruit basket contains:\n$FRUIT_BASKET"

    Your fruit basket contains:

    apple orange pear

    ```


    generates a list of fruit preceded by a description of the list. This example
    illustrates two important aspects of using escape sequences:


    +   - The entire input string, str, is quoted.

    +   - The escape sequence appears in the middle of the string, str, and is not
    separated by spaces.


    Whenever an escape sequence is used in the input string to echo, the string must
    be quoted to prevent the shell from expanding the escape sequence on the command
    line. Quoting is explained in detail in Chapter 10, “Quoting.” Furthermore, the
    input string is a specification of how the output should look; spaces should not
    be used to separate the escape sequences unless that is how the output needs to
    be formatted.


    It is possible to rewrite any echo command that uses the \n escape sequence as
    several echo commands. For example, you can generate the same output as in the
    previous example using two echo commands:


    ```

    $ echo "Your fruit basket contains:"

    $ echo $FRUIT_BASKET

    ```


    Another commonly used escape sequence is the \t sequence, which generates a tab
    in the output. Usually it is used when you need to make a small table or generate
    tabular output that is only a few lines long. As an example, the following command
    generates a small table of two users along with their usernames:


    ```

    $ echo "Name\tUser Name\nSriranga\ttranga\nSrivathsa\tvathsa"

    Name        User Name

    Sriranga    tranga

    Srivathsa   vathsa

    ```


    As you can see from the output, the heading User Name is not centered over its
    column. You can fix this by adding another tab:


    For generating large tables, the printf command, covered in the next section,
    is preferred because it provides a greater degree of control over the size of
    each column in the table.'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'The \c sequence is frequently used in shell scripts that need to generate user
    prompts or diagnostic output. As we have seen in the previous example, the default
    behavior of echo is to add a newline at the end of its output. When you are generating
    a prompt, this is not the most user-friendly behavior. When the \c escape sequence
    is used, echo does not output a newline when it finishes printing its input string.
    The following example illustrates the use of this option:


    ```

    $ echo "Do you want to play a game? (y/n) \c"

    ```


    It produces the following message:


    Do you want to play a game (y/n)?


    Some versions of echo do not understand the \c escape sequence. These versions
    of echo treat \c literally and the resulting output will look like the following:


    ```

    $ echo "Please enter your name \c"

    echo Please enter your name

    $

    ```


    In these versions of echo, you need to use the -n option instead of \c. In Chapter
    23, "Scripting for Portability," you will develop a mechanism that handles this
    difference automatically.


    # printf


    The printf command is similar to the echo command, in that it enables you to print
    messages to STDOUT. In its most basic form, its usage is identical to echo. For
    example, the following echo command:


    ```

    $ echo "Is that a mango?"


    is identical to the printf command:


    $ printf "Is that a mango?\n"

    ```


    The only major difference is that the string specified to printf explicitly requires
    the \n escape sequence at the end of a string, in order for a newline to print.
    The echo command prints the newline automatically.


    ![](img/3def70414996f811615f713b2077a154_90_0.png)


    > The printf command is located in the directory /usr/bin on Linux, Solaris, MacOS
    X, and HP-UX machines. The printf command is a built-in command in bash.'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'The power of printf comes from its capability to perform complicated formatting
    by using format specifications. The basic syntax for this is as follows: `printf
    format arguments`


    Here, format is a string that contains one or more of the formatting sequences,
    and arguments are strings that correspond to the formatting sequences specified
    in format. For those who are familiar with the C language printf function, the
    formatting sequences supported by the printf command are identical. The formatting
    sequences have the form: `%[ -]m.nx`


    Here % starts the formatting sequence and x identifies the formatting sequences
    type. Table 5.2 gives possible values of x.


    # TABLE 5.2 Formatting Sequence Types


    | Letter | Description |

    | --- | --- |

    | s | String |

    | c | Character |

    | d | Decimal (integer) number |

    | x | Hexadecimal number |

    | o | Octal number |

    | e | Exponential floating-point number |

    | f | Fixed floating-point number |

    | g | Compact floating-point number |


    Depending on the value of x, the integers m and n are interpreted differently.
    Usually m is the minimum length of a field, and n is the maximum length of a field.
    If you specify a real number format, n is treated as the precision that should
    be used. The hyphen (-) left justifies a field. By default, all fields are right
    justified.


    The following commands illustrate the use of printf:


    ```

    ```

    printf "%16s%16s\n" "Name" "User Name"

    printf "%16s%16s\n" "Sriranga" "ranga"

    printf "%16s%16s\n" "Srivathsa" "vathsa"

    ```

    ```


    The format %16s%16s\n specifies that the output string should be separated in
    two columns, each 16 characters long and separated by a space. The output of these
    commands will be similar to the following:


    ```

    ```

    Name          User Name

    Sriranga      ranga

    Srivathsa     vathsa

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'As you can see, the headings and the columns are not aligned properly. You
    can fix this by adding a - to the format specification:


    ```

    printf "%-16s %-16s\n" "Name" "User Name"

    printf "%-16s %-16s\n" "Sriranga" "ranga"

    printf "%-16s %-16s\n" "Srivathsa" "vathsa"

    ```


    The output of these commands will be similar to the following:


    ```

    Name          User Name

    Sriranga      ranga

    Srivathsa     vathsa

    ```


    To format numbers, specify a number formatting sequence, such as %f, %e, or %g,
    instead of the string formatting sequence, %s. One of the questions at the end
    of this chapter familiarizes you with using number formats.


    # Output Redirection


    In the process of developing a shell script, you often need to capture the output
    of a command and store it in a file. When the output is in a file, it can be easily
    edited and modified. The process of capturing the output of a command and storing
    it in a file is called output redirection because it redirects the output of a
    command into a file instead of the screen. To redirect the output of a command
    or a script to a file, instead of STDOUT, use the output redirection operator,
    >, as follows:


    ```

    cmd > file

    list > file

    ```


    The first form redirects the output of the command cmd to the file specified by
    file, whereas the second redirects the output of list list to the file specified
    file. If file exists, its contents are overwritten; if file does not exist, it
    is created. For example, the command


    ```

    date > now

    ```


    redirects the output of the date command into the file now. The output does not
    appear on the terminal, but it is placed into the file instead. If you view the
    file now, you find the output of the date command:


    ```

    $ cat now

    Sat Nov 14 11:14:01 PST 1998

    ```


    You can also redirect the output of lists as follows:


    ```

    { date; uptime; who ; } > mylog

    ```


    Here the output of the commands date, uptime, and who is redirected into the file
    mylog.'
  merge: -1
  img_proc: true
- pgno: 93
  md: '> When you redirect output to a file using the output redirection operator,
    the shell overwrites the data in that file with the output of the command you
    specified. For example, the command $ date > now overwrites all the data in the
    file now with the output of the date command. For this reason, you should take
    extra care and make sure the file you specified does not contain important information.


    # Appending to a File


    Overwriting a file simply by redirecting output to it is often undesirable. Fortunately,
    the shell provides a second form of output redirection with the >> operator, which
    appends output to a file. The basic syntax is as follows:


    ```

    and >> file

    list >> file

    ```


    In these forms, output is appended to the end of file. If the file does not exist
    it is created. For example, you can prevent the loss of data from the file mylog
    each time a date is added by using the following command:


    ```

    { date; uptime; who ; } >> mylog

    ```


    If you view the contents of mylog, you find that it contains the output of both
    lists:


    ```

    11:15am up 79 days, 14:48, 5 users, load average: 0.00, 0.00, 0.00

    ranga tty1 Aug 28 14:12

    ranga tty2 Aug 28 14:13

    ranga tty0 Oct 27 19:42 (:0.0)

    amma tty3 Oct 30 08:29 (localhost)

    ranga tty4 Nov 14 11:13 (rishi.bosland.u)

    Sat Nov 14 11:15:54 PST 1988

    11:15am up 79 days, 14:48, 5 users, load average: 0.00, 0.00, 0.00

    ranga tty1 Aug 28 14:12

    ranga tty2 Aug 28 14:13

    ranga tty0 Oct 27 19:42 (:0.0)

    amma tty3 Oct 30 08:29 (localhost)

    ranga tty4 Nov 14 11:13 (rishi.bosland.u)

    ```


    # Redirecting Output to a File and the Screen


    In certain instances, you need to direct the output of a script to a file and
    onto the terminal. An example of this is shell scripts that are required to produce
    a log file of their activities. For interactive scripts, the log file cannot just
    contain the script''s output redirected to a file.'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'To redirect output to a file and the screen, you can use the tee command. The
    basic syntax is as follows:


    ```

    cmd | tee file

    ```


    Here cmd is the name of a command, such as ls, and file is the name of the file
    where you want the output written. For example, the command


    ```

    $ date | tee now

    ```


    produces the following output on the terminal:


    ```

    Sat Nov 14 19:50:16 PST 2001

    ```


    The same output is written to the file now.


    # Input


    Many UNIX programs are interactive and read input from the user. To use such programs
    in shell scripts, you need to provide them with input in a non-interactive manner.
    Also, scripts often need to ask the user for input in order to execute commands
    correctly.


    To provide input to interactive programs or to read input from the user, you need
    to use input redirection. In this section, you will look at the following methods
    in detail:


    +   - Input redirection from files

    +   - Reading input from a user

    +   - Redirecting the output of one command to the input of another


    # Input Redirection


    When you need to use an interactive command, such as mail in a script, you need
    to provide the command with input. One method for doing this is to store the input
    of the command in a file and then tell the command to read input from that file.
    You can accomplish this using input redirection. The input can be redirected in
    a manner similar to output redirection. In general, input redirection is


    ```

    cmd < file

    ```


    Here the contents of file become the input for cmd. As an example, the following
    command is an excellent use of redirection:


    ```

    Mail ranga@soda.berkeley.edu < Final_Exam_Answers

    ```


    Here the input to the Mail command, which becomes the body of the mail message,
    is the file Final_Exam_Answers. In this particular example, a professor might
    perform this function, and the file might contain the answers to a current final
    exam.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# Here Documents


    An additional use of input redirection is in the creation of here documents. Say
    you need to send a list of phone numbers or URLs to the printer. You can enter
    the information that you want to send to the printer into the here document and
    then send that here document to the printer. This is much simpler than using a
    temporary file, which needs to be created and then should be deleted.


    The general form for a here document is as follows:


    ```

    cmd << delimiter

    document

    delimiter

    ```


    Here the shell interprets the << operator as an instruction to read input until
    it finds a line containing the specified delimiter. All the input lines up to
    the line containing the delimiter are then fed into the standard input of the
    cmd. The delimiter tells the shell that the here document has been completed.
    Without it, the shell continues to read input forever. The delimiter must be a
    single word that does not contain spaces or tabs. For example, to print a quick
    list of URLs, you can use the following here document:


    ```

    lpr << MYURLS

    http://www.csua.berkeley.edu/~ranga/

    http://www.cisco.com/

    http://www.marathon.org/story/

    http://www.gnu.org/

    MYURLS

    ```


    To strip the tabs in this example, you can give the << operator a - option.


    You can also combine here documents with output redirection as follows:


    ```

    cmd > file << delimiter

    document

    delimiter

    ```


    If used in this form, the output of cmd is redirected to the specified file, and
    the input of cmd becomes the here document. For example, you can use the following
    command to create a file with the short list of URLs given previously:


    ```

    cat > urls << MYURLS

    http://www.csua.berkeley.edu/~ranga/

    http://www.cisco.com/

    http://www.marathon.org/story/

    http://www.gnu.org/

    MYURLS

    ```'
  merge: -1
  img_proc: true
- pgno: 96
  md: "# Reading User Input\n\nA common task in shell scripts is to prompt users for\
    \ input and then read their responses. You can use the read command to read a\
    \ user's response and store it in a variable. Variables are explained in detail\
    \ in Chapter 8, \"Variables.\" The syntax of the read command is as follows:\n\
    \n```\nread name\n```\n\nIt reads the entire line of user input until the user\
    \ presses Enter and assigns the input string to the variable specified by name.\
    \ The following example illustrates the use of read:\n\n```\necho \"What is your\
    \ name? \\c\"\nread NAME\n```\n\nThe user's response is stored in the variable\
    \ NAME.\n\n![](img/3def70414996f811615f713b2077a154_96_0.png)\n\n> On some versions\
    \ of echo, the \\c in the previous example will appear literally in the output\
    \ as follows:\n> \n> What is your name? \\c\n> \n> If you experience this behavior,\
    \ you should use the following echo command instead of the one given in the previous\
    \ example:\n> \n> echo -n \"What is your name?\"\n\n# Pipelines\n\nMost commands\
    \ in UNIX that are designed to work with files can also read input from STDIN.\
    \ This enables you to use one program to filter the output of another. Using one\
    \ program to manipulate the output of another program is one of the most common\
    \ tasks in shell programming. This section provides a short description of this\
    \ technique; Chapters 15, 16, and 17 contain much more detailed examples.\n\n\
    You can redirect the output of one command to the input of another command using\
    \ a pipeline, which connects several commands together with pipes as follows:\n\
    \n```\ncmd1 | cmd2 | ... | cmdN\n```\n\nThe pipe character, |, connects the standard\
    \ output of cmd1 to the standard input of cmd2, and so on. The commands can be\
    \ as simple or complex as are required. The following commands illustrates the\
    \ use of pipelines:\n\n```\ntail -f /var/adm/messages | more\nps -ael | grep \"\
    UID\" | more\n```"
  merge: -1
  img_proc: true
- pgno: 97
  md: "In the first example, the standard output of the tail command is piped into\
    \ the standard input of the more command, which enables the output to be viewed\
    \ one screen at a time. In the second example, the standard output of ps is connected\
    \ to the standard input of grep, and the standard output of grep is connected\
    \ to the standard input of more, so that the output of grep can be viewed one\
    \ screen at a time. The tail and grep commands are explained in detail in Chapter\
    \ 15, “Text Filters.”\n\n![](img/3def70414996f811615f713b2077a154_97_0.png)\n\n\
    > One important thing about pipelines is that each command is executed as a separate\
    \ process, and the exit status of a pipeline is the exit status of the last command.\n\
    > \n> It is vital to remember this fact when writing scripts that must do error\
    \ handling.\n\n# File Descriptors\n\nWhen you issue any command, three files are\
    \ opened and associated with that command. In the shell, each of these files is\
    \ represented by a small integer called a file descriptor. A file descriptor is\
    \ a mechanism by which you can associate a number with a filename and then use\
    \ that number to read and write from the file. File descriptors are often referred\
    \ to as file handles.\n\n+   - Standard Input (STDIN), 0\n+   - Standard Output\
    \ (STDOUT), 1\n+   - Standard Error (STDERR), 2\n\nThe integer following each\
    \ of these files is its file descriptor. Usually, these files are associated with\
    \ the user’s terminal, but they can be redirected into other files. In the previous\
    \ examples in this chapter, you have used input and output redirection using the\
    \ default file descriptors. This section introduces the general form of input\
    \ and output redirection.\n\n# Associating Files with a File Descriptor\n\nYou\
    \ can associate any file with file descriptors using the exec command. Associating\
    \ a file with a file description is useful when you need to redirect output or\
    \ input to a file many times but you don’t want to repeat the filename several\
    \ times. To open a file for writing, use one of the following forms:\n\n```\n\
    exec n>file\nexec n>>file\n```"
  merge: -1
  img_proc: true
- pgno: 98
  md: 'Here n is an integer, and file is the name of the file to be opened for writing.
    The first form overwrites the specified file if it exists. The second form appends
    to the specified file. For example, the following command


    ```

    $ exec 4>f64.out

    ```


    associates the file f64.out with the file descriptor 4.


    > Use output redirection with STDOUT with care. If you accidentally redirect STDOUT,
    your commands may appear to stop working. For example, the following command:

    > $ exec 1>f61.out

    > redirects STDOUT to the file f61.out. If you execute this command, the output
    from all your commands will be placed in the file f61.out. You will not see any
    output on your terminal.


    To open a file for reading, you can use the following form:


    ```

    exec n<file

    ```


    Here n is an integer, and file is the name of the file to be opened for reading.


    # General Input/Output Redirection


    You can perform general output redirection by combining a file descriptor and
    an output redirection operator. The general forms are


    ```

    cmd n> file

    ```


    ```

    cmd n>> file

    ```


    Here cmd is the name of a command, such as ls; n is a file descriptor (integer)
    and file is the name of the file. The first form redirects the output of cmd to
    the specified file, whereas the second form appends the output of cmd to the specified
    file. For example, you can write the standard output redirection in the general
    form as follows:'
  merge: -1
  img_proc: true
- pgno: 99
  md: "Here cmd is the name of a command, such as ls; n is a file descriptor (integer)\
    \ and file is the name of the file. For example, the standard input redirection\
    \ can be written in the general form as follows:\n\n```\ncmd 0<file\n```\n\n#\
    \ Redirecting STDOUT and STDERR to Separate Files\n\nOne of the most common uses\
    \ of file descriptors is to redirect STDOUT and STDERR to separate files. The\
    \ basic syntax is\n\n```\ncmd > file1 2> file2\n```\n\nHere STDOUT of the command\
