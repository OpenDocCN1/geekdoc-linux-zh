    ch15-01.doc:the right thing and use the next line as the command to

    pipe to. It’s

    ch15-01.doc:The first few lines look like (ten actually, I piped

    the output to

    ```


    As you can see, the name of the file precedes each line that contains the word
    pipe.


    If grep cannot find a line in any of the specified files that contain the requested
    word, no output is produced. For example,


    ```

    $ grep utilities ch15.doc

    ```


    produces no output because the word utilities does not appear in the file ch15.doc.


    # Case-Independent Matching


