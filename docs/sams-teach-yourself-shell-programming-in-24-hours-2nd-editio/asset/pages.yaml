  md: '# Looking for Words


    The basic syntax of the grep command is


    ```

    grep word file

    ```


    Here file is the name of a file in which you want to search for the word specified
    by word. Every line in file that contains word is displayed. When you specify
    more than one file, grep precedes each of the output lines with the name of the
    file that contains that line.


    As an example, the following command locates all the occurrences of the word pipe
    in file ch15.doc (this chapter):


    ```

    $ grep pipe ch15.doc

    I’ve broken the command into two lines, with the pipe character

    as the

    the right thing and use the next line as the command to pipe to. It’s

    The first few lines look like (ten actually, I piped the output to

    ```


    If you specify more than one file, the output changes as follows:


    ```

    $ grep pipe ch15.doc ch15-01.doc

    ch15.doc:I’ve broken the command into two lines, with the pipe

    character as the

    ch15.doc:the right thing and use the next line as the command to

    pipe to. It’s

