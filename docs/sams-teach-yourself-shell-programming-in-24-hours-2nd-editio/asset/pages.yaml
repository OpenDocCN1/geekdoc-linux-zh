  md: "You can use the du (short for disk usage) command to determine the amount of\
    \ disk space used by a directory. Because you are interested in the disk usage\
    \ for the entire directory in kilobytes, you need to use the -s (short for sum)\
    \ and -k (short for kilobytes) options. The output of the du -sk command looks\
    \ like the following:\n\n```\n$ du -sk /home/ranga/pub\n4922 /home/ranga/pub\n\
    ```\n\nThe size of the directory in kilobytes is listed in the first column. This\
    \ function uses awk to retrieve this number.\n\n```\n# Name: getSpaceUsed\n# Desc:\
    \ output the space used for a directory\n# Args: $1 -> The directory to check\n\
    \ngetSpaceUsed () {\n  if [ -d $1 ] ; then\n    du -sk $1 | awk '{ print $1; }'\n\
    \    return $?\n  fi\n  return 1\n}\n```\n\nThis function is almost as simple\
    \ as getSpaceFree. It first determines whether it was given an argument. If no\
    \ argument was given, it displays an error message and returns. Otherwise, it\
    \ determines whether the first argument is a directory. If it is not, an error\
    \ message is displayed and the function returns.\n\nThis function is quite simple;\
    \ if the first argument, $1, is a directory, it executes du to determine the disk\
    \ usage and then retrieves that value using awk:\n\n```\ndu -sk '$1' | awk '{\
    \ print $1; }'\n```\n\nIf the first argument is not a directory, the function\
    \ returns 1, indicating failure.\n\nThe following example illustrates the use\
    \ of this function:\n\n```\ngetSpaceUsed /usr/local\n```\n\nThe output is similar\
    \ to the following (provided the directory /usr/local exists on your system):\n\
    \n```\n15164\n```\n\nThe number returned is in kilobytes, which in this case translates\
