    # Return Codes\n\nWhen a shell script completes, it can use the exit command to\
    \ return exit status via an exit code. The function analogue to exit is the return\
    \ command. This command allows function to return exit status. The exit status\
    \ from a function is called its return code. The convention for return codes is\
    \ the same as for exit codes; a 0 equals success and a nonzero equals failure.\n\
    \nThe syntax of the return command is\n\n```\nreturn rc\n```\n\nHere rc is the\
    \ return code. The following function illustrates the use of return:\n\n```\n\
    isInteractive () {\n  case $- in\n    \"*i\"*) return 0;  # if $- contains i,\
    \ the shell is interactive\n  esac\n  return 1\n}\n```\n\nYou can use this function\
    \ to detect whether a particular shell is interactive as follows:\n\n```\nif isInteractive\
    \ ; then\n  echo \"Interactive shell\"\nelse\n  echo \"Non-interactive shell\"\
    \nfi\n```\n\n# Data Sharing\n\nThe functions you have seen thus far are mostly\
    \ independent, but in most shell scripts functions either depend on or share data\
    \ with other functions. In this section, you will look at an example in which\
    \ three functions work together and share data.\n\n# Moving Around the File System\n\
    \nThe C shell, csh, introduced three commands for quickly moving around in the\
    \ UNIX directory tree:\n\n+   - popd\n+   - pushd\n+   - dirs"
