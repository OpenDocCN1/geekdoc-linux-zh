- pgno: 425
  md: "Here the variable arg will be set to each argument in turn. The specified list\
    \ of commands, $list, will be executed for each argument. The following function\
    \ illustrates the use of this for loop:\n\n```\nechoargs () {\n  for arg in \"\
    $@\"\n  do\n    echo $arg\n  done\n  return 0\n}\n```\n\n# How can I forward all\
    \ the arguments given to my script to another command?\n\nA common task of shell\
    \ programmers is writing a wrapper script for a command. A wrapper script might\
    \ need to define a set of variables and change the environment in some way before\
    \ a particular command starts executing.\n\nWhen writing wrapper scripts, you\
    \ need to forward all the arguments given to your script to a command. Usually\
    \ the following is sufficient:\n\n```\ncmd \"$@\"\n```\n\nHere cmd is the name\
    \ of the command you want to execute.\n\nThe one problem with this is that if\
    \ no arguments were specified to your script, some versions of the shell will\
    \ expand \"$@\" to \"\". If no arguments were specified, you want to execute cmd,\
    \ not cmd \"\". To avoid this problem, you can use the following:\n\n```\ncommand\
    \ ${@:-\"$@\"}\n```\n\nHere you are using one of the forms of variable substitution\
    \ discussed in Chapter 9, \"Substitution.\" In this case you check to see whether\
    \ the variable $@ has a value. If it does, you substitute the value \"$@\" for\
    \ it. If your script was not given any command-line arguments, $0 will be null;\
    \ thus no value will be substituted.\n\n# How do I use the value of a shell variable\
    \ in a sed command?\n\nThe simplest method to use variables in a sed command is\
    \ to enclose your sed command in double quotes (\" \") instead of single quotes\
    \ (' '). Because the shell performs variable substitution on double-quoted strings,\
    \ the shell will substitute the value of any variables you specify before sed\
    \ executes.\n\nFor example, the command\n\n```\nsed \"/$DEL/d\" file1 > file2\n\
    ```\n\ndeletes all the lines in file1 that contain the value stored in the variable\
    \ $DEL."
  merge: -1
  img_proc: true
- pgno: 426
  md: "# How can I store the output of a command in a variable?\n\nYou can store the\
    \ output of a command in a variable by combining the assignment operator, =, and\
    \ the backquotes, `:`\n\n```\nvar=`cmd`\n```\n\nHere var is the name of a variable\
    \ and cmd is the command whose output you want to store. For example, the following\
    \ command stores the current date in the variable THEDATE:\n\n```\nTHEDATE=`date`\n\
    ```\n\n# How do I check to see whether a variable has a value?\n\nThere are several\
    \ methods for determining this. The simplest is the if statement:\n\n```\nif [\
    \ -z \"$VAR\" ] ; then\n  list ;\nfi\n```\n\nHere VAR is the name of the variable,\
    \ and list is the list of commands to execute if VAR does not have a value. Usually\
    \ list initializes VAR to some default value. For example, the following command\
    \ initializes the variable THEDATE if it does not have a value:\n\n```\nif [ -z\
    \ \"$THEDATE\" ] ; then\n  THEDATE=`date`\nfi\n```\n\nIf you are just interested\
    \ in variable initialization, this can be accomplished in a much more succinct\
    \ fashion using variable substitution. For example, the previous if statement\
    \ can be written as\n\n```\n: ${VAR:=default}\n```\n\nHere default is the default\
    \ that should be assigned to VAR, if VAR does not have a value. If you need to\
    \ execute a set of commands to obtain a default value, the backquotes (`) can\
    \ be used to obtain the value to be substituted:\n\n```\n: ${VAR:=`default`}\n\
    ```\n\nHere default is a list of commands to execute. If VAR does not have a value,\
    \ the output of these commands will be assigned to it. The following command also\
    \ initializes the variable THEDATE:\n\n```\n: ${THEDATE:=`date`}\n```"
  merge: -1
  img_proc: true
- pgno: 427
  md: '# File and Directory Questions


    This section looks at some questions about files and directories. These questions
    include issues with specific commands and examples that illustrate the use of
    commands to solve particular problems.


    # How do I determine the absolute pathname of a directory?


    Shell scripts that work with directories often need to determine the absolute
    pathname of a directory to perform the correct operations on these directories.


    You can determine the absolute pathname of a directory by using the cd and pwd
    commands as follows:


    ```

    ABSPATH=`{ cd dir > /dev/null && pwd ;}`

    ```


    Here dir is the name of a directory. This command changes directories to the specified
    directory, dir, and then displays the full pathname of the directory using the
    pwd command. Then you assign the output of pwd, which is the full path to dir,
    to the variable ABSPATH. Because the cd command changes the working directory
    of the current shell, you execute it in a sub-shell. Thus the working directory
    of the shell script is unchanged.


    The following function also provides this functionality:


    ```

    abspath () { if [ -n "$1" ] && { cd "$1" > /dev/null && pwd ; } }

    ```


    Here, you determine whether the first argument is given and if it is, you cd to
    that directory and print its absolute path.


    # How do I determine the absolute pathname of a file?


    Determining the absolute pathname of a file is slightly harder than determining
    the absolute pathname of a directory. You need to use the dirname and basename
    commands in conjunction with the cd and pwd commands to determine the absolute
    pathname of a file:


    ```

    CURDIR=`pwd`

    cd `dirname file`

    ABSPATH=`pwd`/`basename file`

    cd $CURDIR

    ```


    Here file is the name of a file whose absolute pathname you want to determine.
    First you save the current path of the current directory in the variable CURDIR.
    Next you move to the directory containing the specified file, file.'
  merge: -1
  img_proc: true
- pgno: 428
  md: "As an example, the following function implements this functionality:\n\n```\n\
    absfpath () {\n if [ -z \"$1\" ] ; then\n  return 1\n fi\n CURDIR=`pwd`\n cd `dirname\
    \ $1`\n ABSPATH=`pwd` / `basename $1`\n cd \"$CURDIR\"\n}\n```\n\n# How can I\
    \ locate a particular file?\n\nThe structure of the UNIX directory tree sometimes\
    \ makes locating files and commands difficult. To locate a file, often you need\
    \ to search through a directory and all its subdirectories. The easiest way to\
    \ do this is with the find command:\n\n```\nfind dir -name file -print\n```\n\n\
    Here dir is the name of a directory where find should start its search, and file\
    \ is the name of the file it should look for.\n\nThe name option of the find command\
    \ also works with the standard filename substitution operation operators covered\
    \ in Chapter 9. For example, the command\n\n```\nfind /home/ranga -name \"*.txt\"\
    \ -print\n```\n\ndisplays a list of all the files in the directory /home/ranga\
    \ and all its subdirectories that end with the string .txt.\n\n# How can I grep\
    \ for a string in every file in a directory?\n\nWhen you work on a large project\
    \ involving many files, remembering the contents of the individual files becomes\
    \ difficult. It is much easier to look through all the files for a particular\
    \ piece of information.\n\nYou can use the find command in conjunction with the\
    \ xargs command to look for a particular string in every file contained within\
    \ a directory and all its subdirectories:\n\n```\nfind dir -type f -print | xargs\
    \ grep \"string\"\n```\n\nHere dir is the name of a directory in which to start\
    \ searching, and string is the string to look for. Here you specify the -type\
    \ option to the find command so that only regular files are searched for the string.\
    \ As an example, the following command searches all of the C language include\
    \ files in /usr/include for the string pid_t:\n\n```\n$ find /usr/include -type\
    \ f -print | xargs grep pid_t\n```"
  merge: -1
  img_proc: true
- pgno: 429
  md: '# How do I remove all the files in a directory matching a particular name?


    Some editors and programs create large numbers of temporary files. Often you need
    to clean up after these programs, to prevent your hard drive from filling up.
    The simplest method to remove a set of files that matches a particular name is
    to use the find and xargs commands as follows:


    ```

    find dir -type f -name ''name'' .print | xargs rm

    ```


    Here dir is the pathname of a directory and name is the filename that you want
    to remove. For example, the following command removes all of the files that end
    with - from the directory /home/cvs:


    ```

    find /home/cvs -type f -name ''*~'' .print | xargs rm

    ```


    The only limitation in using find and xargs is that xargs cannot properly deal
    with pathnames that contain spaces. If you need to delete files whose pathnames
    contain spaces you will need to use the -exec option of find rather than xargs:


    ```

    find dir -type f -name ''name'' -exec rm ''{}'' \; -print

    ```


    # What command can I use to rename all the *.aaa files to *.bbb files?


    In DOS and Windows, you can rename all the *.aaa files in a directory to *.bbb
    by using the rename command as follows:


    ```

    rename *.aaa *.bbb

    ```


    In UNIX you can use the mv command to rename files, but you cannot use it to rename
    more than one file at the same time. To do this, you need to use a for loop:


    ```

    OLDSUFFIX=aaa

    NEWSUFFIX=bbb

    for FILE in "*.$OLDSUFFIX"

    do

    NEWNAME=`echo "$FILE" | sed -e ''s/\.$OLDSUFFIX/\.$NEWSUFFIX/''`

    mv "$FILE" "$NEWNAME"

    done

    ```


    Here you generate a list of all the files in the current directory that end with
    the value of the variable OLDSUFFIX. Then you use sed to modify the name of each
    file by removing the value of OLDSUFFIX from the filename and replacing it with
    the value of NEWSUFFIX. You use the $ character in our sed expression to anchor
    the suffix in OLDSUFFIX to the end of the line; this ensures that the pattern
    is really a filename suffix. After you have the new name, you rename the file
    from its original name, stored in FILE, to the new name stored in NEWNAME.'
  merge: -1
  img_proc: true
