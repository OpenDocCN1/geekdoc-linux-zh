    # WC


    Now let''s look at getting some information about the contents of a file. Using
    the wc command (short for word count), we can get a count of the total number
    of lines, words, and characters contained in a file. The basic syntax of this
    command is:


    ```

    wc [opts] files

    ```


    Here opts are one or more of the options given in Table 3.1, and files are the
    files you want examined. The options, opts, are optional and can be omitted.


    # TABLE 3.1 wc Options


    | Option | Description |

    |---|---|

    | -l | Count of the number of lines. |

    | -w | Count of the number of words. |

    | -m | Count of the number of characters. This option is available on Mac OS X,
    OpenBSD, Solaris, and HP-UX. This option is not available on FreeBSD and Linux
    systems. |

    | -c | Count of the number of characters. This option is the Linux and FreeBSD
    equivalents of the -m option. |


    When no options are specified, the default behavior of wc is to print out a summary
    of the number of lines, words, and characters contained in a file. For example,
    the command


    ```

    $ wc fruits

    ```'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'produces the following output:


    ```

    8      18      219 fruits

    ```


    The first number, in this case 8, is the number of lines in the file. The second
    number, in this case 18, is the number of words in the file. The third number,
    in this case 219, is the number of characters in the file. At the end of the line,
    the filename is listed. When multiple files are specified, the filename helps
    to identify the information associated with a particular file.


    If more than one file is specified, we gives the counts for each file along with
    a total. For example, the command


    ```

    $ wc fruits users

    ```


    produces output similar to the following:


    ```

    8      18      219 fruits

    3      3       19 users

    11     21      237 total

    ```


    The output on your system might be slightly different.


    # Counting Lines


    To count the number of lines, the -l (as in lines) option can be used. For example,
    the command


    ```

    $ wc -l fruits

    ```


    produces the output


    ```

    8 fruits

    ```


    The first number, in this case 8, is the number of lines in the file. The name
    of the file is listed at the end of the line.


    When multiple files are specified, the number of lines in each file is listed
    along with the total number of lines in all of the specified files. As an example,
    the command


    ```

    $ wc -l fruits users

    ```


    produces the output


    ```

    8 fruits

    3 users

    11 total

    ```'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# Counting Words


    To count the number of words in a file, the -w (as in words) option can be used.
    For example, the command


    ```

    $ wc -w fruits

    ```


    produces the output


    18 hosts


    The first number, in this case 18, is the number of words in the file. The name
    of the file is listed at the end of the line.


    When multiple files are specified, the number of words in each file is listed
    along with the total number of words in all of the specified files. As an example,
    the command


    ```

    $ wc -w fruits users

    ```


    produces the output


    18 fruits

    3 users

    21 total


    # Counting Characters


    To count the number of characters, we need to use either the -m or the -c option.
    The -m option is available on Mac OS X, OpenBSD, Solaris, and HP-UX. On FreeBSD
    and Linux systems, the -c option should be used instead.


    For example, on Solaris the command


    ```

    $ wc -m fruits

    ```


    produces the output


    219 fruits'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'produces the output


    ```

    219 hosts

    18 users

    237 total

    ```


    # Combining Options


    The options to wc can be grouped together and specified in any order. For example,
    to obtain a count of the number of lines and words in the file fruits, we can
    use any of the following commands:


    ```

    $ wc -w -l fruits

    $ wc -l -w fruits

    $ wc -lw fruits

    $ wc -lw fruits

    ```


    The output from each of these commands is identical:


    ```

    8 18 fruits

    ```


    The output lists the number of words in the files, followed by the number of lines
    in the file. The filename is specified at the end of the line. When multiple files
    are specified, the information for each file is listed along with the appropriate
    total values.


    # Manipulating Files


    In the preceding sections, you looked at listing files and viewing their content.
    In this section, you will look at copying, renaming, and removing files using
    the cp, mv, and rm commands.


    # Copying Files (cp)


    The cp command (short for copy) is used to make a copy of a file. The basic syntax
    of the command is


    ```

    cp src dest

    ```'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'It is also possible to specify multiple source files to cp, provided that the
    destination, dest, is a directory. The syntax for copying multiple files is


    ```

    $ cp src1 ... srcn dest

    ```


    Here src1 ... srcn are the source files and dest is the destination directory.
    As an example, the following command


    ```

    $ cp fruits users Documents/

    ```


    creates a copy the files fruits and users in the directory Documents.


    # Interactive Mode


    The default behavior of cp is to automatically overwrite the destination file
    if it exists. This behavior can lead to problems. The -i option (short for interactive)
    can be used to prevent such problems. In interactive mode, cp prompts for confirmation
    before overwriting any files.


    Assuming that the file fruits.sav exists, the following command


    ```

    $ cp -i fruits fruits.sav

    ```


    results in a prompt similar to the following:


    ```

    overwrite fruits.sav? (y/n)

    ```


    If y (yes) is chosen, the file fruits.sav is overwritten; otherwise the file is
    untouched. The actual prompt varies among the different versions of UNIX.


    # Common Errors


    When an error is encountered, cp generates a message. Some common error conditions
    follow:


    +   - The source, src, is a directory.

    +   - The source, src, does not exist.

    +   - The destination, dest, is not a directory when multiple sources, src1 ...
    srcn, are specified.

    +   - A non-existent destination, dest, is specified along with multiple sources,
    src1 ... srcn.

    +   - One of the sources in src1 ... srcn is not a file.


    The first error type is illustrated by the following command:


    ```

    $ cp Downloads/ fruits

    ```


    Because src (Downloads in this case) is a directory, an error message similar
    to the following is generated:'
  merge: -1
  img_proc: true
- pgno: 63
  md: '```

    cp: Downloads: is a directory

    ```


    In this example, dest was the file fruits; the same error would have been generated
    if dest was a directory.


    The second error type is illustrated by the following command:


    ```

    $ cp fruits.sav

    ```


    ```

    cp: cannot access fruits: No such file or directory

    ```


    Here the filename fruits has been misspelled fruits, resulting in an error. In
    this example dest was the file fruits.sav; the same error would have been generated
