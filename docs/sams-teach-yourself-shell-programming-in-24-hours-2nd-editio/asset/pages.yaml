    # Using Character Classes with tr


    If you look at the output of the previous command you might have noticed that
    the fifth most common word in this chapter is the single quote character. You
    are correct in wondering what''s going on because we said the very first *tr*
    command took care of dealing with punctuation. Well, the problem is that you took
    care of all the characters that would fit between single quotes, and a single
    quote won''t fit. You can''t backslash escape the single quote because some versions
    of the shell can''t handle an escaped single quote.


    So what is the solution?


    The solution is to use the predefined character sets in *tr*. The *tr* command
    knows several character classes, and the punctuation class is one of them. Table
    15.1 gives a complete list of the character class names.


    TABLE 15.1 Character Classes Understood by the tr Command


    | Class | Description |

    |---|---|

    | alnum | Letters and digits |

    | alpha | Letters |

    | blank | Horizontal whitespace |

    | cntrl | Control characters |

    | digit | Digits |

    | graph | Printable characters, not including spaces |

    | lower | Lowercase letters |

    | print | Printable characters, including spaces |'
