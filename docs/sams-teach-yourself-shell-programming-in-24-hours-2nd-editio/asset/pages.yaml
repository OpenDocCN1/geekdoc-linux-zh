    \ () {\n    YESNO=\"\"\n\n    if [ \"${1:-t}\" ] ; then\n        return 1\n  \
    \  fi\n\n    _YNPROMPT=\"$1 (y/n)? \"\n    _YNDEFANS=\"\"\n\n    case \"$2\" in\n\
    \        [yY][eE][sS] ) _YNDEFANS=\"y\" ;;\n        [nN][oO] ) _YNDEFANS=\"n\"\
    \ ;;\n    esac\n\n    _YNPROMPT=\"$_YNPROMPT[${_YNDEFANS:-[${_YNDEFANS}]}] \"\n\
    \n    while :\n    do\n        printf \" $_YNPROMPT\"\n        read YESNO\n  \
    \      case \"${YESNO:-${_YNDEFANS}}\" in\n            [yY][eE][sS] )\n      \
    \          YESNO=\"y\"\n                break\n                ;;\n          \
