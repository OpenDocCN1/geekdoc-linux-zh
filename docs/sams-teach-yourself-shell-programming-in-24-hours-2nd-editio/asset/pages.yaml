    # Validating User Input with while


    Say that you need to write a script that needs to ask the user for the name of
    a directory. You could use the following steps to get information from the users:


    +   1. Ask the user a question.

    +   2. Read the user''s response.

    +   3. Determine whether the user responded with the name of a directory.


    But what should you do when the user gives you a response that is not a directory?


    The simplest choice would be to do nothing, but this is not very user friendly.
    Your script can be much more user friendly by informing the user of the error
    and asking for the name of a directory again. The while loop is perfect for doing
    this. In fact, a common use for the while loop is to determine whether user input
    has been gathered correctly. Usually a strategy similar to the following is employed:


    +   1. Set a variable''s value to null.

    +   2. Start a while loop that exits when the variable''s value is not null.

    +   3. In the while loop, ask the user a question and read in the users response.

    +   4. Validate the response.

    +   5. If the response is invalid the variable''s value is set to null. This enables
    the while loop to repeat.

    +   6. If the response is valid, the variable''s value is not changed. It continues
    to hold the user''s response. Because the variable''s value is not null, the while
    loop exits.


    A while loop that implements this is


    ```

    RESPONSE=

    while [ -z "$RESPONSE" ] ;

    do

    ```'
  merge: -1
  img_proc: true
- pgno: 200
  md: "```\necho 'Enter the name of a directory where your files are\nlocated:'\n\
    read RESPONSE\nif [ ! -d \"$RESPONSE\" ] ; then\n  echo 'ERROR: Please enter a\
    \ directory pathname.'\n  RESPONSE=\nfi\ndone\n```\n\nHere, you store the user's\
    \ response in the variable RESPONSE. Initially this variable is set to null, enabling\
    \ the while loop to begin executing. When the while loop first executes, the user\
    \ is prompted as follows:\n\nEnter the name of a directory where your files are\
    \ located:\n\nThe user can type the name of a directory at this prompt. When the\
    \ user finishes typing and presses Enter, read stores the input into the variable\
    \ RESPONSE. You then check to make sure the input is a directory. If the input\
    \ is not a directory, you issue an error message and repeat. An error message\
    \ is produced so that the user knows what was wrong with the input. If the user\
    \ does not enter any value, the variable RESPONSE is still set to null. In this\
    \ case the value stored in the variable RESPONSE is not a directory, thus the\
    \ error message is produced.\n\n# Input Redirection and while\n\nThe while loop\
    \ can also be combined with input redirection and read in order to read a file\
    \ one line at a time. The basic syntax is\n\n```\nwhile read LINE\ndo\n  :: #\
    \ manipulate file here\ndone < file\n```\n\nIn the body of the while loop, you\
    \ can manipulate each line of the specified file. A simple example of this is\n\
    \n```\nwhile read LINE\ndo\n  case $LINE in\n    '*root*') echo $LINE ;;\n  esac\n\
    done < /etc/passwd\n```\n\nHere only the lines that contain the string root in\
    \ the file /etc/passwd are displayed.\nThe output will be similar to the following:\n\
    \n```\nroot:x:0:1:Super-User:/sbin/sh\n```"
