    # Using test


    Usually the list given to an if statement is one or more test commands. A test
    command has the following syntax:


    ```

    test expr

    ```


    Here expr is constructed using one of the options understood by test. After evaluating
    expr, test returns either 0 (true) or 1 (false). The open bracket, [, is often
    used as a shorthand for test:


    ```

    [ expression ]

    ```


    Here expr is any valid expression understood by test. The close bracket, ], the
    space after the open bracket, [, and the space before the close bracket are required.
    Without the spaces and the close bracket, the shell cannot tell where expr begins
    and ends.


    There are three main types of expressions understood by test:


    +   - File tests

    +   - String comparisons

    +   - Numerical comparisons'
