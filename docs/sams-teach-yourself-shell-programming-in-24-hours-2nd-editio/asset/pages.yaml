    ```

    usage: cp [R -H | -L | -P] [-f | -i | -n] [-p] src target

    cp [R -H | -L | -P] [-f | -i | -n] [-p] src ... srcN directory

    ```


    Because dest, in this case fruits.sav, is not a directory, a usage statement that
    highlights the proper syntax for a cp command is presented. The output might be
    different on your system because some versions of cp do not display the usage
    information.


    If the file fruits.sav does not exist, the error message is


    ```

    cp: fruits.sav: No such file or directory

    ```


    This illustrates the fourth error type.


    The fifth error type is illustrated by the following command:


    ```

    $ cp fruits Downloads/ users Documents/

