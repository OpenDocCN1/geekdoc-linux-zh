- pgno: 254
  md: "+   - sort\n+   - uniq\n\nThe tr command (short for transliterate) changes\
    \ all the characters in one set into characters in a second set, whereas the sort\
    \ command sorts the lines in an input file. The uniq command (short for unique)\
    \ prints all the unique lines in a file.\n\nThe text of this chapter, ch15.doc,\
    \ is used as the input file for the examples in this section.\n\n# The tr Command\n\
    \nThe first step in solving this problem is to eliminate all the punctuation and\
    \ delimiters in the input file. You need to do this because the string 'end.'\
    \ and the string 'end' are both the same word, end. You can accomplish this task\
    \ using the tr command. The basic syntax for this command is\n\n```\ntr 'set1'\
    \ 'set2'\n```\n\nHere all the characters in set1 are transliterated into the characters\
    \ in set2. Usually, the characters themselves are used, but escape sequences covered\
    \ in previous chapters can also be used.\n\nTo accomplish your first task, you\
    \ can use the following command:\n\n```\n$ tr '!?\";:[]{}(),.' ' ' < ch15.doc\n\
    ```\n\nHere you specified set2 as the space character because words separated\
    \ by the characters in set1 need to remain separate after the punctuation is removed.\n\
    \nNotice that the characters [ and ] are given as \\[ and \\]. As you will see\
    \ later in this chapter, these two characters have a special meaning in tr and\
    \ need to be escaped using the backslash character (\\ ) in order to be handled\
    \ correctly.\n\n> The tr command on some versions of Linux does not handle the\
    \ \\ escape sequence properly, used in the previous example, and might generate\
    \ an error message similar to the following:\n> \n> tr: invalid backslash escape\
    \ '\\['\n> \n> You can work around this problem by using the punctuation class\
    \ described later in this chapter.\n\nAt this point most of the words are separated\
    \ by spaces, but some words might still be separated with tabs and newlines. To\
    \ get an accurate count, all the words need to be separated by spaces, so you\
    \ need to convert all tabs and newlines to spaces as follows:\n\n```\n$ tr '!?\"\
    ;:[]{}(),.\\t\\n' ' ' < ch15.doc\n```"
  merge: -1
  img_proc: true
- pgno: 255
  md: 'The next step is to transliterate all capitalized versions of words to the
    lowercase version because words such as To and to and The and the are really the
    same word. You can do this by using tr to change all the capital characters ''A''-''Z''
    into lowercase characters ''a''-''z'' as follows:


    ```

    $ tr ''[:[:upper:]]'' ''[:lower:]'' < ch15.doc | tr ''A''-''Z'' ''a''-''z''

    ```


    Here you pipe the output of the first tr command into a second tr command. The
    input to the first tr command is the file ch15.doc, whereas the input to the second
    tr command is the output of the first tr command.


    # Differences Between tr Versions


    In this example, you are using a single space for set2. Most versions of tr interpret
    this to mean transliterating all the characters in set1 to a space. Some versions
    of tr do not do this.


    You can determine whether your version of tr works correctly using the following
    test:


    ```

    $ echo ''Hello, my dear'' | tr '',! '' '' ''

    ```


    Most versions of tr produce the following output:

    Hello my dear


    Some versions produce the following output instead:

    Hello my dear!


    To obtain the desired behavior from these versions of tr, make sure that set1
    and set2 have the same number of characters. In this case, set2 needs to contain
    two spaces:


    ```

    $ echo ''Hello, my dear'' | tr '',! '' ''  ''

    ```


    # Squeezing Out Spaces


    At this point, several of the lines have multiple spaces separating the words.
    You need to reduce or squeeze these multiple spaces into single spaces to avoid
    problems generating counts later. To do this, you need to use the -s (short for
    squeeze) option of the tr command. The basic syntax is


    ```

    tr -s set1

    ```


    When tr encounters multiple consecutive occurrences of a character in set1, it
    replaces these with only one occurrence of the character. For example,'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'produces the output


    ```

    fed me

    ```


    The two e''s in feed were reduced to a single e.


    If you specify more than one character in set1, the replacement is character specific.
    For example:


    ```

    $ echo ''Shell Programming'' | tr -s ''\n''

    ```


    produces the following output:


    ```

    Shel Programing

    ```


    As you can see the two l''s in Shell were reduced to a single l. Also, the two
    m''s in Programming were reduced to a single m.


    Using this option you can squeeze multiple spaces in the output of the second
    tr command into a single space:


    ```

    $ tr ''!?;:\|(){}[].,:;\''\n'' '' '' < ch15.doc | tr ''A-Z'' ''a-z'' | tr -s ''
    ''

    ```


    # The sort Command


    To get a count of how many times each word is used, you need to sort the file
    using the sort command. In its simplest form, the sort command sorts each of its
    input lines. In this example, you need to modify the output of tr so that it lists
    one word per line. You can do this changing all the spaces into new lines as follows:


    ```

    $ tr ''!?;:\|(){}[].,:;\''\n'' '' '' < ch15.doc | tr ''A-Z'' ''a-z'' | tr -s ''
    '' |

    tr '' '' ''\n''

    ```


    Now you can sort the output, by adding the sort command as follows:


    ```

    $ tr ''!?;:\|(){}[].,:;\''\n'' '' '' < ch15.doc | tr ''A-Z'' ''a-z'' | tr -s ''
    '' |

    tr '' '' ''\n'' | sort

    ```


    # The uniq Command


    At this point you have all the information required to determine the number of
    times a particular word occurs in the file. You just need a command that will
    compute this information for you. This command is uniq.


    By default, the uniq command discards all but one of the repeated lines. For example,
    the commands


    ```

    $ echo *

    peach

    peach

    peach

    apple

    ```'
