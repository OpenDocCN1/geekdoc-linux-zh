  md: 'found in the C language or the shell. When a comparison operator is used, the
    syntax of an awk command changes to the following:


    ```

    expression { actions }

    ```


    Here expression is constructed using one of the comparison operators given in
    Table 17.1.


    # Table 17.1 Comparison Operators in awk


    | Operator | Description |

    |---|---|

    | < | Less than |

    | > | Greater than |

    | <= | Less than or equal to |

    | >= | Greater than or equal to |

    | == | Equal to |

    | != | Not equal to |

    | value ~ /pattern/ | True if value matches pattern |

    | value !~ /pattern/ | True if value does not match pattern |


    You can solve your problem using the following script:


    ```

    ```sh

    #!/bin/sh

    awk ''

    $3 <= 75 { print "%s\t%s\n",$0,"REORDER" ; }

    $3 > 75 { print $0 ; }

    '' fruit_prices.txt

    ```

    ```


    Here you determine whether the third field contains a value less than or equal
    to 75. If it does, you print the input line followed by the string REORDER. Next,
    you determine whether the third field contains a value greater than 75 and, if
    it does, you print the input line unchanged.


    Assuming that this script is called reorder.sh and is located in the current directory,
    it can be invoked as follows:


    ```

    $ ./reorder.sh

    ```


    The output from this scripts looks like the following:


    ```

    Fruit Price/lbs Quantity

    Banana $0.89 100

    Peach $0.79 65 REORDER

    Kiwi $1.50 22 REORDER

    Pineapple $1.29 35 REORDER

    Apple $0.99 78

    ```'
