    \ or impossible using only the shell.\n\nSome of the important topics covered\
    \ in this chapter include:\n\n+   - Field editing\n+   - Pattern specific actions\n\
    +   - Using STDIN as input\n+   - Variables\n+   - Numeric and assignment expressions\n\
    +   - Using flow control\n\nIn addition to these topics, awk offers features such\
    \ as multiple-line editing, arrays, and functions. If you are interested in learning\
    \ more about these topics, consult one of the following sources:\n\n*The UNIX\
    \ Programming Environment* by Brian Kernighan and Rob Pike (Prentice-Hall, 1984)\n\
    \n*The AWK Programming Language* by Alfred Aho, Peter Weinberger, and Brian Kernighan\
    \ (Addison-Wesley, 1984)\n\n*Effective AWK Programming* by Arnold Robbins and\
