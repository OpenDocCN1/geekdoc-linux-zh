    Apple | $0.99


    # Using sed in a Pipeline


    If a list of files is not specified, sed reads lines from STDIN, making it useful
    in pipelines.


    As an example of using sed in a pipeline, we will use it to determine a user''s
    numeric user ID (uid). On most systems, the /usr/bin/id command prints out the
    current user''s uid and gid information. The output of id resembles the following:


    ```

    $ /usr/bin/id

    uid=500(ranga) gid=100(users)

    ```'
  merge: -1
