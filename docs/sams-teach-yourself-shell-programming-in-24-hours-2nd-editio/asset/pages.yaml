    # Hour 19


    # Signals


    *Signals are software interrupts sent to a program indicating that an important
    event has occurred. The events can vary from user requests to illegal memory access
    errors. Some signals, such as the interrupt signal, indicate that a user has asked
    the program to do something that is not in the usual flow of control.*


    Because signals can arrive at any time during the execution of a script, they
    add an extra level of complexity to shell scripts. Scripts must account for this
    and include extra code that can determine the appropriate response to a signal,
    regardless of what the script was doing when the signal was received.


    This chapter looks at the following signal-related topics:


    +   - The different types of signals encountered in shell programming

    +   - How to deliver signals using the kill command

    +   - Handling signals

    +   - How to use signals within your script'
  merge: -1
  img_proc: true
- pgno: 329
  md: '# How Are Signals Represented?


    In UNIX, every type of event that can occur is represented by a separate signal.
    Every signal is a small positive integer. The signals most commonly encountered
    in shell script programming are given in Table 19.1. The signals are available
    on all versions of UNIX.


    Table 19.1 Important Signals for Shell Scripts


    | Name | Value | Description |

    |---|---|---|

    | SIGHUP | 1 | Hangup detected on controlling terminal or death of controlling
    process |

    | SIGINT | 2 | Interrupt from keyboard |

    | SIGQUIT | 3 | Quit from keyboard |

    | SIGKILL | 9 | Kill signal |

    | SIGALRM | 14 | Alarm Clock signal (used for timers) |

    | SIGTERM | 15 | Termination signal |


    In addition to the signals listed in Table 19.1, you might see a reference to
    signal 0. This signal is more of a shell convention than a real signal. When a
    shell script exits either by using the exit command or by executing the last command
    in the script, the shell sends itself a signal 0 to indicate that the script is
    complete and should terminate.


    # Getting a List of Signals


    All the signals understood by your system are listed in the C language header
    file /usr/include/sys/signal.h. Some vendors provide a man page for this file,
    which you can view as follows:


    ```

    $ man signal

    ```


    Another way to obtain a list of signals supported by your system is to use the
    -l option of the kill command. On a Solaris system, the output is


    ```

    $ kill -l

    1) SIGHUP      2) SIGINT      3) SIGQUIT     4) SIGILL

    5) SIGTRAP     6) SIGABRT     7) SIGEMT      8) SIGFPE

    9) SIGKILL    10) SIGBUS     11) SIGSEGV    12) SIGSYS

    13) SIGPIPE   14) SIGALRM    15) SIGTERM    16) SIGUSR1

    17) SIGUSR2   18) SIGCHLD    19) SIGPWR     20) SIGWINCH

    21) SIGURG    22) SIGIO      23) SIGSTOP    24) SIGTSTP

    25) SIGCONT   26) SIGTTIN    27) SIGTTOU    28) SIGPOLL

    29) SIGPROF   30) SIGXCPU    31) SIGXFSZ    32) SIGWAITING

    33) SIGLWP    34) SIGFREEZE  35) SIGTHAW    36) SIGCANCEL

    37) SIGLOST

    ```


    The actual set of signals depends on your version of UNIX.'
  merge: -1
  img_proc: true
- pgno: 330
  md: '# Default Actions


    Every signal, including those listed in Table 19.1, has a default action associated
    with it. A default action is the action that the system takes on behalf of the
    program in the absence of a signal handler. A signal handler is a function provided
    by a program that defines the actions to take when a signal is received. Signal
    handlers are covered later in this chapter.


    Some common default actions are


    +   - Terminate the process.

    +   - Ignore the signal.

    +   - Dump core. This creates a file called core containing the memory image of
    the process when it received the signal.

    +   - Stop the process.

    +   - Continue a stopped process.


    The signals that are of interest to us all have the same default action: Terminate
    the process.


    # Delivering Signals


    There are several methods of delivering signals to programs. The most common method
    is for a user to press Ctrl+C while a program is executing, causing a SIGINT to
    be sent to the program. Upon receipt of SIGINT, the default behavior of a program
    is to terminate.


    Another method for delivering signals is the kill command:


    ```

    kill -signal pid

    ```


    Here signal is either the number or name of the signal to deliver, and pid is
    the PID that the signal should be delivered to. Recall from Chapter 7, “Processes,”
    that a PID (Process ID) is a number assigned to a program by the kernel while
    it is executing.


    # SIGTERM


    In previous chapters, we looked at using kill without specifying a signal. When
    signal is omitted, kill sends a SIGTERM (terminate) to the process specified by
    pid. Thus both of the following commands are equivalent:


    ```

    kill pid

    ```


    ```

    kill -s SIGTERM pid

    ```


    # SIGHUP


    The following command


    ```

    $ kill -s SIGHUP 1081

    ```'
  merge: -1
  img_proc: true
- pgno: 331
  md: 'sends the HUP (hang-up) signal to the program that is running with PID 1001.
    You can also use the numeric value of the signal as follows:


    ```

    $ kill -1 1001

    ```


    This command also sends the hang-up signal to the program that is running with
    PID 1001. Although the default action for this signal is to terminate the process,
    many UNIX programs use this signal as an indication that they should reinitialize
    themselves. For this reason, you should use a different signal if you are trying
    to terminate or kill a process.


    # SIGQUIT and SIGINT


    In some cases, SIGTERM will not be sufficient to terminate a process. In such
    cases, you can try to send the process either a SIGQUIT (quit) or a SIGINT (interrupt):


    ```

    $ kill -s SIGQUIT 1001

    ```


    or


    ```

    $ kill -s SIGINT 1001

    ```


    One of these signals should terminate a process, either by asking it to quit (the
    QUIT signal) or by asking it to interrupt its processing (the INT signal).


    # SIGKILL


    To terminate a truly pernicious program that refuses to die, you can resort to
    using SIGKILL. This signal is usually referred to by its integer value, 9. SIGKILL
    has the special property that it cannot be caught; any process receiving it terminates
    immediately.


    The following command sends a SIGKILL to the program running with PID 1001:


    ```

    $ kill -9 1001

    ```


    The downside to using SIGKILL is that the process receiving it is never given
    a chance to properly clean up and therefore might leave data files it was using
    in a corrupted state. For this reason, you should only use this signal when all
    other signals fail to terminate a process.


    # Dealing with Signals


    A program can deal with a signal in three ways:


    +   - Do nothing and let the default action occur. This is the simplest method
    for a program to deal with a signal because it requires no extra code.

    +   - Ignore the signal and continue executing. This method is not the same as
    doing nothing because ignoring a signal requires the program to have some code
    that explicitly ignores the signal.'
  merge: -1
  img_proc: true
- pgno: 332
  md: '+   - Catch the signal and perform some signal-specific commands. This method
    requires the program to define a function that is executed when a signal is received.
    This is the most complex and powerful method of dealing with a signal.


    The first method is the default behavior for all shell scripts. All the scripts
    that you have looked at thus far handle signals using this method. This section
    illustrates scripts that use the second and third methods.


    # The trap Command


    The trap command sets and unsets the action taken when a signal is received. Its
    syntax is


    ```

    trap name sigs

    ```


    Here name is either a list of commands or the name of a shell function to execute
    and sigs is a list of signals. When a signal listed in sigs is received by the
    script, the commands specified by name are executed. If name is omitted, trap
    resets the action for the given sigs to the default action.


    Some common uses for trap are


    +   - Clean up temporary files

    +   - Always ignore signals

    +   - Ignore signals only during critical operations


    We will look at a fourth use, setting up a timer, later in this chapter.


    # Cleaning Up Temporary Files


    If a script creates temporary files, it is common practice to remove these files
    before the script exits. Most scripts perform this type of cleanup correctly during
    normal execution, but few scripts perform the appropriate cleanup actions when
    signals occur. Consider the following script:


    ```

    #!/bin/sh

    TMPF=`.arch*

    uname -m > $TMPF*

    read ARCH < $TMPF*

    rm -f $TMPF*

    echo $ARCH

    exit 0

    ```


    This script creates a temporary file .arch, which is removed before exiting. Under
    normal circumstances, the temporary file will not be present after the script
    exits. However,'
  merge: -1
  img_proc: true
- pgno: 333
  md: "if a signal is received, the temporary file might not be deleted. In order\
    \ to solve this problem, we can use trap as follows:\n\n```\ntrap 'rm -f $TMPF;\
    \ exit 2' 1 2 3 15\n```\n\nWhen SIGHUP, SIGINT, SIGQUIT, or SIGTERM signal is\
    \ received, the temporary file is removed and exit is called with a return code\
    \ of 2, indicating that the script exited under abnormal circumstances. Usually\
    \ when a script exits normally, its exit code is 0. If anything abnormal happens,\
    \ the exit code should be a nonzero.\n\nSometimes more complicated cleanup is\
    \ required. In such cases, a shell function, or signal handler, should be used.\
    \ For example, we can modify the uu script (described in Chapter 13, “Parameters”)\
    \ signal safe, we could add something similar to the following:\n\n```\ncleanup()\
    \ {\n  if [ -f \"$OUTFILE\" ] ; then\n    print \"Cleaning Up...\";\n    rm -f\
    \ \"$OUTFILE\" 2> /dev/null ;\n    echo \"Done.\"\n  fi\n}\ntrap cleanup 1 2 3\
    \ 15\n```\n\nThe function Cleanup will be invoked whenever the script receives\
    \ a SIGHUP, SIGINT, SIGQUIT, or SIGTERM signal. This function removes the output\
    \ file of the script, if that file exists. By cleaning up when a signal is received,\
    \ partially encoded files are not left around to confuse users.\n\n# Multiple\
    \ Signal Handlers\n\nIn the previous example, a single signal handler was used\
    \ for all the signals. This is not a strict requirement and frequently different\
    \ signals have different handlers. For example, the following trap commands are\
    \ completely valid:\n\n```\ntrap cleanup 2 15\ntrap init 1\n```"
  merge: -1
  img_proc: true
- pgno: 334
  md: "```\necho \"Usage: $0 cmd.\"\nexit 1\nfi\n\nInit() {\n  if [ \"$1\" != \"\"\
    \ -a \"$1\" != \"0\" ] ; then\n    if kill -0 $1 > /dev/null 2>&1 ; then\n   \
    \   kill $1 > /dev/null 2>&1 || return\n    fi\n  fi\n  $PROG &\n}\n\nCleanup()\
    \ {\n  if [ \"$1\" != \"\" -a \"$1\" != \"0\" ] ; then\n    kill -9 $1 > /dev/null\
    \ 2>&1\n  fi\n  exit 2\n}\n\ntrap Cleanup 2 3 15\ntrap Init 1\n\nwhile ; ;\ndo\n\
    \  if [ \"$1\" != \"\" -a \"$1\" != \"0\" ] ; then\n    wait $1\n  fi\n  $PROG\
    \ &\ndone\n\nexit 0\n```\n\nThis script launches a program, specified as the first\
    \ argument, in the background and waits for that program to terminate. If the\
    \ program terminates, it is launched again. The script exits when it receives\
    \ a SIGINT, SIGQUIT or SIGTERM. If the script receives a SIGHUP, it attempts to\
    \ restart the program.\n\n# Ignoring Signals\n\nIn some instances, there is no\
    \ easy way to clean up if a signal is received. In such cases, it is better to\
    \ ignore signals than to deal with them. There are two methods of ignoring signals:\n\
    \n```\ntrap '' sigs\ntrap : sigs\n```\n\nHere, sigs is the list of signals to\
    \ ignore. The first form passes a null ('') argument to trap, which interprets\
    \ this as ignore. The second form specifies the command to execute"
