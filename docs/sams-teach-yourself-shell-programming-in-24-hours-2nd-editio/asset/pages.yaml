    \  ) :  737344 total allocated Kb\n                        368296 free allocated\
    \ Kb\n                        369048 used allocated Kb\n                     \
    \   50 % allocation used\n```\n\nTo get the output in a format that is easier\
    \ to parse, you need to use the command df -b instead:\n\n```\n$ df -b /usr/sbin\n\
    /usr  (/dev/vg00/lvol8  ) :  392808 Kbytes free\n```\n\nIn order to use isSpaceAvailable\
    \ on all systems, including HP-UX, you need to change the function getSpaceFree\
    \ to take this into account. The modified version looks like the following:\n\n\
    ```\ngetSpaceFree() {\n  if [ $# -lt 1 ] ; then\n    echo \"ERROR: Insufficient\
    \ Arguments.\" >&2\n    return 1\n  fi\n\n  DIR=\"$1\"\n  if [ ! -d \"$DIR\" ]\
    \ ; then\n    DIR=\"/usr/bin/dirname $DIR\"\n  fi\n\n  if isOS HPUX ; then\n \
    \   df -b \"$DIR\" | awk '{ print $5 ; }'\n  else\n    df -k \"$DIR\" | awk 'NR\
    \ != 1 { print $4 ; }'\n  fi\n}\n```\n\nHere, the isOS function is called in order\
    \ to determine the command to execute."
