  md: '```

    10:47am up 27 day(s), 50 mins, 1 user,

    load average: 0.16, 0.28, 0.20

    ```


    SEE ALSO

    w(1), who(1), whodo(1M), attributes(5)


    NOTES

    who -b gives the time the system was last booted.


    # Man Page Sections


    As you can see from the output in the previous example, a man page is divided
    into several sections that are described in Table 2.1. Almost every man page will
    include these sections. The content and style of the material in the sections
    differs from system to system.


    TABLE 2.1 Sections in a Man Page


    | Section | Description |

    |---|---|

    | NAME | This section gives the name of the command along with a short description
    of it. |

    | SYNOPSIS | This section describes all the different modes in which the command
    can be run. If a command accepts arguments, they are shown in this section. |

    | DESCRIPTION | This section includes a verbose description of the command. If
    a command accepts arguments, each argument will be fully explained in this section.
    |

    | EXAMPLE | This section contains an example demonstrating how to execute the
    command. It might also contain some sample output. Not all man pages contain this
    section. |

    | SEE ALSO | This section lists other commands that are related to the command.
    |

    | NOTES | This section usually lists some additional information about the command.
    Sometimes it lists the known bugs. |


    Most man pages include all the sections given in Table 2.1 and might include one
    or two optional sections described in Table 2.2.


    TABLE 2.2 Optional Sections Found in Man Pages


    | Section | Description |

    |---|---|

    | AVAILABILITY | This section describes the versions of UNIX that include support
    for a given command. Sometimes it lists the optional software packages you need
    to purchase from the vendor to gain extra functionality from a command. |

    | KNOWN BUGS | This section usually lists one or more known problems with the
    command. If you encounter a problem that is not included in this section, it should
    be reported to the vendor or author. |'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# TABLE 2.2 continued


    | Section | Description |

    |---|---|

    | FILES | This section lists the files that are required for the command to function
    correctly. It might also list the files that can be used to configure a command.
    |

    | AUTHORS or CONTACTS | These sections list the commands'' author or authors and
    provide contact information such as e-mail or postal addresses. |

    | STANDARDS COMPLIANCE | If the behavior of a command is specified by a standards
    organization such as ISO (International Standards Organization), IEEE (Institute
    of Electrical and Electronic Engineers), or ANSI (American National Standards
    Institute), this section lists the relevant standard or standards. |


    Try using the man command to get more information on some of the commands discussed
    in this chapter.


    If the man command cannot find a man page corresponding to the command you requested,
    it issues an error message. For example, the command


    ```

    $ man apple

    ```


    produces an error message similar to the following on my system:


    No manual entry for apple


    The exact error message depends on your version of UNIX.


    # UNIX System Manuals


    The term manual page comes from the original versions of UNIX, when the online
    pages were available as large bound manuals. In all, there were eight different
    manuals covering the main topics of the UNIX system. These manuals are described
    in Table 2.3.


    TABLE 2.3 The UNIX System Manuals


    | Manual Section | Description |

    |---|---|

    | 1 | Covers commands. |

    | 2 | Covers UNIX system calls. System calls are used inside a program, such as
    date, to ask the kernel for a service. |

    | 3 | Covers libraries. Libraries are used to store non-kernel-related functions
    used by C programmers. |

    | 4 | Covers file formats. For example, the format file /etc/passwd is documented
    in this section. |'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# TABLE 2.3 continued


    | Manual Section | Description |

    |---|---|

    | 5 | A secondary section that covers file formats. |

    | 6 | Includes instructions for playing games on UNIX. (UNIX wasn''t always a
    serious academic and business operating system; it started out as a gaming platform!)
    |

    | 7 | Covers device drivers. |

    | 8 | Covers system maintenance. |


    In the printed version, you had to know the section where you needed to look for
    a particular manual page. The big advantage of man over the printed manual is
    that man looks in all the sections of the manual for the information you requested,
    making it much easier to get help.


    # Online Resources


    In addition to man, there are several Usenet newsgroups, Web sites, and e-mail
    lists that are good sources of information about the different shells and shell
    programming.


    The main Usenet newsgroup for shell programming questions and information is comp.unix.shell.
    Before posting a question, you should read the frequently asked questions (FAQ)
    for the newsgroup. The FAQ is located at http://www.faqs.org/faqs/unix-faq/shell/intro/


    Often you will find that your question, or something very similar to it, has an
    answer in this or one of the other FAQs mentioned later.


    For questions regarding the Bourne Again shell (bash), you can subscribe to the
    bash e-mail list: bug-bash@gnu.org. A subscription form is located at http://mail.gnu.org/mailman/listinfo/bug-bash


    If you prefer reading news to e-mail, the e-mail list is available as the newsgroup
    gnu.bash.bug. Before posting to the newsgroup, you should read the bash FAQ located
    at http://www.faqs.org/faqs/unix-faq/shell/bash/


    For questions regarding the Z Shell (zsh), you can subscribe to the zsh-users
    mailing list: zsh-users@sunsite.dk. Subscription instructions can be found at
    http://zsh.sunsite.dk/Arc/mlist.html'
  merge: -1
