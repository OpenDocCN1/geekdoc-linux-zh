- pgno: 384
  md: 'In this section, you will implement the first two improvements, and you will
    be asked to implement the last one as one of the questions at the end of the chapter.


    In order to support multiple arguments, you can simply embed the main case statement
    within a for loop as follows:


    ```

    for ARG in "$@"

    do

    case "$ARG" in

    start)

    if [ ! -x "$SPGM" ] ; then

    echo "Error: Not Executable: $SPGM" 1>&2

    exit 1

    fi

    RUNNING=`ps -ef | grep "$SPGM" | grep -v grep | head`

    if [ -n "$RUNNING" ] ; then

    echo "Error: Already running: $SPGM" 1>&2

    exit 1

    fi

    "$SPGM" $SPGM_OPTS

    ;;

    stop)

    SPS | grep "$SPGM" | grep -v grep | \

    awk ''{ print $2 }'' | xargs kill

    ;;

    *) echo "Usage: $0 | start | stop |"

    exit 1

    ;;

    esac

    done

    ```


    The for loop loops through all of the arguments stored in $@, and the case statement
    evaluates each of these arguments, instead of just evaluating $1. There is one
    problem with this modification: If no arguments are given, the usage message is
    no longer output. This is because the for loop is not executed if $0 does not
    contain a value, as is the case when no arguments are given. To rectify this you
    can simply check for this and output the usage message earlier in the script by
    using the following if statement:


    ```

    USAGE="usage: $0 [ start | stop ]"

    if [ -z "$@" ] ; then

    echo $USAGE

    exit 1

    fi

    ```


    The usage message is now stored in a variable because you now need to output it
    in two places within the script, and it is easier to maintain and update if it
    is located in a single place within the script.'
  merge: -1
  img_proc: true
- pgno: 385
  md: 'In order to complete the second task, you need to come up with a method of
    enabling and disabling the init script without having to deal with the hassle
    of removing its links from the various run-level directories. A method you can
    use is as follows:


    +   - If a file named /etc/.no-pgm is present, where pgm is the name of the program,
    the init script considers itself disabled for the purposes of starting the program.
    If this file is not present, the init script considers itself enabled.

    +   - Add support in the init script for two additional parameters, enable and
    disable, that control the creation and deletion of the file /etc/.no-pgm.


    You can extract pgm, the name of program, from the variable $PGM by using the
    sed command as follows:


    ```

    echo $PGM | sed -e ''s!.*/!!''

    ```


    This sed command removes all of the directory information from the path stored
    in $PGM and just gives you the name of the program. You can store that in a variable
    as follows:


    ```

    PGM_NAME=`echo $PGM | sed -e ''s!.*/!!''`

    ```


    To enable the program you just need to remove the file /etc/.no-pgm_name using
    rm:


    ```

