    # Hour 15


    # Text Filters


    Shell scripts are often called on to manipulate and reformat the output from commands.
    Sometimes this task is as simple as displaying only part of the output by filtering
    out certain lines, but in most instances, the processing required is much more
    sophisticated.


    In this chapter, you will look at several commands that can be used for filtering
    text. These commands are


    +   - `head`

    +   - `tail`

    +   - `grep`

    +   - `sort`

    +   - `uniq`

    +   - `tr`


    # The head and tail Commands


    In Chapter 3, "Working with Files," you looked at viewing the contents of a file
    using the cat command. This command enables you to view an entire'
