    # Using the set command


    In the invocation activated debugging modes, the debugging mode takes effect at
    the start of the script and remains in effect until the script exits. Most of
    the time you need to debug just one function or a small section of your script.
    In these cases, enabling debugging for the entire script is overkill.


    As you will see later in this chapter, the debugging output is quite extensive,
    and it is often hard to sort out the real errors from the noise. You can address
    this problem by using the set command to enable the debugging modes just in the
    parts of the script where you need debugging information.


    # Enabling Debugging Using set


    The basic syntax of the set command is


    ```

    set opt

    ```


    Here opt is one of the options listed in Table 20.1.


    The set command can be used anywhere in a shell script, and many scripts use it
    to change the debugging flags as part of the normal execution of the script. Because
    these debugging modes are activated only when the shell script programmer uses
    the set command, they are sometimes referred to as programmer activated modes.


    Consider the following excerpt from a shell script (the line numbers are provided
    for your reference):


    ```

    1 #!/bin/sh

    2 set -x

    3 if [ -z "$1" ] ; then

    4     echo "ERROR: Insufficient Args."

    5     exit 1

    6 fi

    ```


    This script enables shell tracing (the -x option) on line 2:


    ```

    set -x

    ```


    Because this command occurs before the if statement (lines 3 through 6), shell
    tracing will be active while the if statement executes. Unless explicitly disabled
    later in the script, shell tracing will remain in effect until the script exits.
    You will look at the effect of shell tracing on the output of a script in the
    "Shell Tracing" section of this chapter.'
  merge: -1
  img_proc: true
- pgno: 343
  md: '# Disabling Debugging Using set


    You can use the set command to disable a debugging mode as follows:


    ```

    set +opt

    ```


    Here opt is a letter corresponding to one of the options given in Table 20.1.
    For example, the following command disables shell tracing:


    ```

    $ set +x

    ```


    To deactivate any and all the debugging modes that have been enabled, you can
    use the command:


    ```

    $ set -

    ```


    # Enabling Debugging for a Single Function


    One of the most common uses of the set command is to enable a particular debugging
    mode before a function executes and then disable debugging when the function finishes.


    For example, say you have a problematic function named BuggyFunction() and you
    want to enable shell tracing only while that function executes. You could use
    the following command:


    ```

    set -x ; BuggyFunction; set +x ;

    ```


    Here the debugging mode is enabled just before the function is called and is disabled
    after the function completes. This method is favored over explicitly using the
    set command inside a function to enable debugging because it enables the implementation
    of the function to remain unchanged.


    # Using Syntax Checking


    When dealing with any shell script, it is a good idea to check the syntax of the
    script before trying to execute it. This will help you find and fix most problems.


    To enable syntax checking, use the -n option as follows:


    ```

    /bin/sh -n script arg1 arg2 ... argN

    ```


    Here script is the name of a script and arg1 through argN are the arguments for
    that script. If there are syntax errors in script, the shell generates an error
    message that indicates the source of the error.'
  merge: -1
  img_proc: true
- pgno: 344
  md: 'Check the syntax of the following script (the line numbers are included for
    your reference) and see if you can spot the error:


    ```

    1 #!/bin/sh

    2

    3 YN=y

    4 if [ $YN = "yes" ]

    5     echo "yes"

    6 fi

    ```


    If this script is stored in the file buggy1.sh, you can check its syntax as follows:


    ```

    $ /bin/sh -n ./buggy1.sh

    ```


    The output looks like the following:


    ```

    ./buggy1.sh: syntax error at line 7: ''fi'' unexpected

    ```


    This tells you that when the shell tried to read line 7, it found that the fi
    statement on line 6 was unexpected. By now you have probably figured out that
    the reason the shell was trying to read line 7 is that the if statement on line
    4 is not properly terminated with a then statement:


    ```

    if [ $YN = ''y'' ]

    ```


    This line should read as:


    ```

    if [ $YN = ''y'' ] ; then

    ```


    By making this change, you will find that the command


    ```

    $ /bin/sh -n ./buggy1.sh

    ```


    produces no output, indicating that there are no syntax errors in the script.


