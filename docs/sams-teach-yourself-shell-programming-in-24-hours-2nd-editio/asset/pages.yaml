  md: "```\necho \"ERROR: Insufficient Arguments.\" >&2\nreturn 1\nfi\n\nDIR=\"$1\"\
    \nif [ ! -d \"$DIR\" ] ; then\n  DIR=\"/usr/bin/dirname $DIR\"\nfi\n\ndf -k \"\
    $DIR\" | awk 'NR != 1 { print $4 ; }'\n}\n```\n\nThis function prints the amount\
    \ of free space in a directory in kilobytes. Its output is used in the isSpaceAvailable\
    \ function to determine whether there is enough space in a particular directory.\
    \ Although this works for most systems (Solaris, Linux, BSD), it does not work\
