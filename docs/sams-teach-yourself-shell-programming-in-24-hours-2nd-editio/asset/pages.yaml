    \ \" * \";\n        if ( $3 > 75 ) {\n            printf \"REORDER\\n\";\n   \
    \     } else {\n            printf \"\\n\";\n        }\n    } else {\n       \
    \ if ( $3 < 75 ) {\n            printf \"REORDER\\n\";\n        } else {\n   \
    \         printf \"\\n\";\n        }\n    }\n}' fruit.prices.txt ;\n```\n\nIf\
    \ the script is called reorder_expensive.sh and is located in the current directory,\
    \ it can be invoked as follows:\n\n```\n$ ./reorder_expensive.sh\n```\n\nThe output\
    \ looks like the following\n\nFruit    Price/lbs    Quantity\nBanana   $0.89 \
    \       100\nPeach    $0.79        65       * REORDER\nKiwi     $1.50        22\
    \       * REORDER\nPineapple $1.29       35       * REORDER\nApple    $0.99  \
    \      78\n\n# The while Statement\n\nThe while statement executes awk commands\
    \ while an expression is true. The basic syntax is\n\n```\nwhile (expr) {\n  \
    \  actions\n}\n```"
  merge: -1
