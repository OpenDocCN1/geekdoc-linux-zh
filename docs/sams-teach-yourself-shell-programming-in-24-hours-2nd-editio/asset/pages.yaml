- pgno: 150
  md: '# Hour 9


    # Substitution


    When the shell encounters an expression that contains one or more *meta-characters*,
    it performs *substitutions* on that expression. Meta-characters are characters
    that have a special meaning in the shell. Substitution is the process by which
    the shell converts a string containing meta-characters into a different string
    that is the result of interpreting the meta-characters. In the last chapter, you
    saw how the $ meta-character can be used to access a variable''s value in a process
    known as *variable substitution*. In addition to variable substitution, the shell
    can also perform several other types of substitutions. This chapter looks at each
    of these types of substitution and their associated meta-characters in detail.
    Specifically the topics covered are


    +   - Filename substitution

    +   - Value-based variable substitution

    +   - Command substitution

    +   - Arithmetic substitution


    ![](img/3def70414996f811615f713b2077a154_150_0.png)'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# Filename Substitution (Globbing)


    The most common type of substitution is filename substitution or globbing. Globbing
    is the method by which the shell expands a string containing globbing meta-characters
    or wildcards into a list of filenames. Table 9.1 lists the wildcards used in globbing.


    Table 9.1 Globbing Meta-Characters (Wildcards)


    | Wildcard | Description |

    |---|---|

    | * | Matches zero or more occurrences of any character |

    | ? | Matches one occurrence of any character |

    | [characters] | Matches one occurrence of any of the given characters |


    Any command or script that operates on files can take advantage of globbing. The
    examples in this section use the ls command because its output clearly illustrates
    the results of globbing.


    # The * Meta-Character


    The simplest form of filename substitution is the asterisk or star, *, meta-character.
    The * matches zero or more occurrences of any character in a filename.


    When given by itself, the * matches all visible filenames in the current directory.
    For example, the command


    ```

    $ ls *

    ```


    lists every file and the contents of every directory in the current directory.
    Invisible files or directories are not listed.


    Although the * is sometimes used by itself, its main use is in matching file prefixes
    and suffixes.


    # Matching a Prefix


    To match a file prefix, the * can be used as follows:


    Here cmd is the name of a command, such as ls, and prefix is the filename prefix
    you want to match. For example, the following command lists all the files and
    directories in the current directory that start with the letters CGI:


    ```

    $ ls CGI*

    ```'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'By varying the prefix slightly, you can alter the list of files that are matched.
    For example, the command


    ```

    $ ls CGIGet*

    ```


    generates the following list of files:


    ```

    CGIGet.java

    CGIGetTest.java

    ```


    Varying the suffix allows you to manipulate the list of the matched filenames
    until the list contains just the filenames you are interested in.


    # Matching a Suffix


    To match a file suffix, the * can be used as follows:


    ```

    cmd *suffix

    ```


    Here cmd is the name of a command, such as ls, and suffix is the filename suffix
    you want to match. For example, the following command lists all the files and
    directories in the current directory that end with the letters java:


    ```

    $ ls *java

    ```


    ```

    CGI.java CGIGet.java CGIGetTest.java CGI PostTest.java CGI PostTest.java

    ```


    By varying the suffix slightly, you can alter the list of files that are matched.
    To list just the files that end with Test.java, you can adjust the command as
    follows:


    ```

    $ ls *Test.java

    ```


    ```

    CGIGetTest.java CGI PostTest.java

    ```


    Varying the suffix also allows you to manipulate the list of the matched filenames
    in order to obtain a list of the filenames that interest you.


    # Matching Prefixes and Suffixes


    You can match both the prefix and the suffix by using the * character as follows:


    ```

    cmd prefix*suffix

    ```


    Here cmd is the name of a command, such as ls, prefix is the filename prefix,
    and suffix is the filename suffix. For example, the following command lists all
    the files and directories in the current directory with the prefix CGIGet and
    the suffix java:


    ```

    $ ls CGIGet*.java

    ```


    ```

    CGIGet.java CGIGetTest.java

    ```


    It is also possible to use multiple * in a filename substitution expression. For
    example, if you needed to list only those files with the prefix CGI, the suffix
    java, and that contain the characters st, you could use the following command:


    ```

    $ ls CGI*st*.java

    ```'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'The output is as follows:


    ```

    CGIGetTest.java CGIpost.java CGIpostTest.java

    ```


    # Globbing is Case Sensitive


    When using the *, it is important to specify the correct case for the prefix and
    suffix. For example, the command $ ls CGI* produces the following output:


    ```

    CGI.java CGIGet.java CGIGetTest.java CGIpost.java CGIpostTest.java

    ```


    whereas the command $ ls cgi* does not produce the same list of files.


    # The ? Meta-Character


    One of the limitations of the * is that it matches zero or more characters. Consider
    a situation where you need to list all files that have names of the form ch0X.doc,
    where X is a single number or letter. At first glance it seems like the command


    ```

    $ ls ch0*.doc

    ```


    would produce the appropriate list, but inspecting the output shows otherwise:


    ```

    ch01.doc ch01-1.doc ch01-2.doc ch02.doc ch02-1.doc ch02-2.doc ch03.doc ch03-1.doc
    ch03-2.doc

    ```


    In order to match only one character, you need to use the question meta-character.
    The ? matches exactly one instance of a character. Rewriting the previous example
    using the ? yields:


    ```

    $ ls ch0?.doc

    ```


    Now the output contains only those files you were interested in:


    ```

    ch01.doc ch02.doc ch03.doc

    ```


    Say that you need to look for all files that have names of the form chXY.doc,
    where X and Y are any number or character. You can use two ? meta-characters in
    order to obtain the desired list of files:


    ```

    $ ls ch??.doc

    ```


    ```

    ch01.doc ch02.doc ch03.doc

    ```


    # Common Errors


    If the shell cannot find any files that match an expression containing a ?, the
    shell treats the ? as a regular character. Because most filenames do not include
    a ?, this usually produces an error message. For example, the following command:


    ```

    $ ls ch7?.doc

    ```'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'produces the error message:


    ```

    ls: ch7.doc: No such file or directory

    ```


    For this reason, a shell script needs to validate the existence of files that
    are specified as arguments. The procedure for performing such checks is discussed
    in Chapter 11, "Flow Control."


    # Matching Sets of Characters


    Two potential problems with the ? and * wildcards are


    +   - Any character, including special characters such as hyphens (-) or underscores
    (_), is matched by these characters.

    +   - There is no way to match only letters or only numbers.


    Sometimes you need more control over the characters to be matched. Consider the
    situation where you need to match filenames of the form ch0X, where X is a number
    between 0 and 9. Neither the ? nor the * operator is appropriate for this task.


    In order to match sets of characters, you need to use the [ and ] meta-characters.
    The syntax for using these meta-characters is as follows:


    ```

    cmd [chars]

    ```


    Here cmd is the name of a command, such as ls, and chars is the set of characters
    to match. For example, the following command fulfills these requirements:


    ```

    $ ls ch[0123456789].doc

    ch01.doc ch02.doc ch03.doc

    ```


    # Character Ranges


    In the previous example, the set contained an explicit list of all the characters
    that you wanted to match. This can be cumbersome if you need to deal with large
    sets of characters. You can simplify this by specifying a character range with
    the - meta-character. A character range is a method for specifying a set of characters
    by providing the first and last character in the set. For example, the character
    range 0-9 specifies all the numbers between zero and nine, inclusive.'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'lists all the files starting with a lowercase letter. To match all the files
    starting with uppercase letters, use the following:


    ```

    $ ls [A-Z]*

    ```


    You can also combine multiple character ranges in a single set. For example,


    ```

    $ ls [a-zA-Z]*

    ```


    matches all files that start with a letter, whereas the command


    ```

    $ ls *[^a-zA-Z0-9]

    ```


    matches all files ending with a letter or a number.


    Coupling sets with other meta-characters gives you the maximum amount of flexibility
    in filename substitution.


    # Negating a Set


    Consider a situation where you need a list of all files except those that contain
    a particular letter, for example, the letter a. You can solve this problem in
    two ways:


    +   - Specify all the characters you want a filename to contain.

    +   - Specify that the filename not include the letter a.


    If you choose the first approach, you need to construct a set of all the characters
    that your filename can contain. You can start with:


    ```

    [b-zA-Z0-9]

    ```


    This set does not include the special characters that are allowed in filenames.
    Attempting to include all these characters creates a cumbersome set with complicated
    quoting:


    ```

    [b-zA-Z0-9_!~^''\\|(){}[]]

    ```


    Compared to this, the second approach seems much simpler, because all you need
    to do is specify the set of characters to exclude. This is accomplished using
    the ! operator. When ! is the first character in a set, the shell matches only
    those filenames that do not include the characters in the set that follows the
    !. The syntax for this operator is:


    ```

    cmd [!chars]

    ```


    Here, cmd is the name of a command, such as ls, and chars is the set of characters
    that should not be matched.


    As an example, you can list all files except those starting with the letter a
    using the command


    ```

    $ ls [!a]*

    ```'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# Variable Substitution


    In the previous chapter, you learned about a basic form of variable substitution,
    namely how to retrieve the value of a variable using the $ meta-character. In
    addition to this, the shell provides several other advanced forms of variable
    substitution that enable shell programs to manipulate the value of a variable
    based on its state.


    There are two broad categories of advanced variable substitution:


    +   - Actions taken when a variable has a value

    +   - Actions taken when a variable does not have a value


    The actions can range from one time value substitution to aborting the script.
    These categories are broken into four forms of variable substitution. These forms
    are summarized in Table 9.2.


    Table 9.2 Advanced Variable Substitution


    | Name | Syntax | Description |

    |---|---|---|

    | Default Value Substitution | `${param:-word}` | If param is null or unset, word
    is substituted for param. The value of param does not change. |

    | Default Value Assignment | `${param:=word}` | If param is null or unset, param
    is set to the value of word. |

    | Null Value Error | `${param:?msg}` | If param is null or unset, msg is printed
    to STDERR and the shell exits. |

    | Substitute When Set | `${param:+word}` | If param is set, word is used instead
    of the value of param. The value of param does not change. |


    # Default Value Substitution


    The first form of advanced variable substitution allows a default value to be
    substituted when the variable''s value is null. The syntax is as follows:


    `${param:-word}`


    Here param is the name of the variable and word is the default value. Substitution
    is performed only when param is unset. Furthermore, word is not assigned to param;
    the shell just replaces the expression with word. The following example illustrates
    the behavior:


    ```

    $ unset MYFRUIT

    $ FRUIT=${MYFRUIT:-APPLE}

    $ echo MYFRUIT is $MYFRUIT, FRUIT is $FRUIT

    MYFRUIT is , FRUIT is APPLE

    ```'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# Default Value Assignment


    The second form of advanced variable substitution assigns a value to a variable
    when the variable''s value is null. The syntax is as follows:


    ```

    ${param:-word}

    ```


    Here param is the name of the variable and word is the value to assign if the
    variable''s value is null. The following example illustrates the behavior:


    ```

    $ unset FRUIT

    $ echo FRUIT is $FRUIT

    FRUIT is

    $ echo FRUIT is ${FRUIT:-APPLE}

    FRUIT is APPLE

    ```


    # Null Value Error


    Sometimes substituting or assigning default values can hide problems in a shell
    script. In order to spot such problems in critical parts of a shell script, you
    can use the third form of variable substitution that outputs a message to STDERR
    when a variable is unset. The syntax is as follows:


    ```

    ${param:?msg}

    ```


    Here, param is the name of the variable and msg is the message to be printed to
    STDERR.


    If a shell script or shell function requires a certain variable to be set for
    proper execution, this form of variable substitution can be used. For example,
    the following expression causes the shell to exit if the variable $HOME is unset:


    ```

    : ${HOME:? ''Your home directory is undefined.''}

    ```


    In addition to using the variable substitution form described previously, this
    example makes use of the no-op (short for no operation) command, :. This command
    performs no work; it just evaluates the arguments passed to it.


    # Substitute When Set


    The final form of variable substitution is used to substitute a value when a variable
    is set. The syntax is as follows:


    ```

    ${param:+word}

    ```


    Here param is the name of the variable and word is the value to substitute if
    the variable is set. If param is unset, then nothing is substituted. This form
    does not alter the value of the variable. It is commonly used by scripts to indicate
    that the script is running in debug mode:


    ```

    echo ${DEBUG:+''Debug is active.''}

    ```'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# Command and Arithmetic Substitution


    Two additional forms of substitution are command and arithmetic substitution.
    Command substitution enables you to capture the output of a command, whereas arithmetic
    substitution enables you to perform basic integer math in the shell.


    # Command Substitution


    Command substitution is the mechanism by which the shell performs a given set
    of commands and then substitutes their output in the place of the commands. Command
    substitution is performed when a command is given as `command`


    Here command can be a simple command, a pipeline, or a list.


    ![](img/3def70414996f811615f713b2077a154_158_0.png)


    > > Make sure that you are using the backquote character, not the single quote
    character, when performing command substitution. Command substitution is performed
    by the shell only when the backquote, or backtick, character, `, is given. Using
    the single quote instead of the back quote is a common error and leads to hard-to-find
    bugs.


    Command substitution is generally used to assign the output of a command to a
    variable as the following examples demonstrate:


    ```

    DATE=`date`

    USERS=`who | wc -l`

    UP=`date , uptime`

    ```


    In the first example, the output of the date command becomes the value for the
    variable DATE. In the second example, the output of the pipeline becomes the value
    of the variable USERS. In the last example, the output of the list becomes the
    value of the variable UP.


    You can also use command substitution to provide arguments for other commands.
    For example,


    ```

    grep `id -un` /etc/passwd

    ```'
  merge: -1
  img_proc: true
- pgno: 159
  md: '![](img/3def70414996f811615f713b2077a154_159_0.png)


    > Some system administrators have special scripts that track and report users
    who access the password file, /etc/passwd. Before you execute commands that access
    this file, please check with your system administrator to ensure that you are
    not violating site policy.


    # Arithmetic Substitution


    Arithmetic substitution allows you to perform simple integer math using the shell.
    It was first introduced in ksh and has been incorporated into bash and zsh. It
    is not available in the Bourne shell. Scripts that use the Bourne shell have to
    use an external program such as expr or bc (covered in Chapter 18, "Other Tools")
    to perform basic integer math.


    Arithmetic substitution is performed when an expression of the following form
    is encountered:


    ```

    $((exp))

    ```


    Here exp is a mathematical expression constructed using the operators given in
    Table 9.3. Standard precedence rules are used for evaluating exp.


    Table 9.3 Arithmetic Substitution Operators


    | Operator | Description |

    |---|---|

    | / | The division operator. Divides two numbers and returns the result. |

    | * | The multiplication operator. Multiplies two numbers and returns the result.
    |

    | - | The subtraction operator. Subtracts two numbers and returns the result.
    |

    | + | The addition operator. Adds two numbers and returns the result. |

    | () | The parentheses clarify which expressions should be evaluated before others.
    |


    If exp does not evaluate to an integer (whole number), the value of exp is truncated.
    As an illustration, consider the following command:


    ```

    $ echo $(( 5/2 ))

    2

    ```


    The result of the division is 2.5, but in integer math the .5 is ignored and the
    truncated result, 2, is returned. The result isn''t rounded; everything that follows
    the decimal point is discarded.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# Precedence Example


    The following example illustrates the rules of precedence:


    ```

    $ echo $(( ( (5 + 3*2) - 4 ) / 2 ))

    3

    ```


    If you are having trouble understanding the output, just break down the operations
    starting with the sub-expression contained in the innermost parenthesis:


    +   1. (5 + 3*2). Because * has higher precedence than +, this sub-expression
    evaluates to 11.

    +   2. Substituting the result from Step 1 yields the sub-expression (11 - 4).
    This evaluates to 7.

    +   3. Substituting the result from Step 2 yields the sub-expression 7 / 2. This
    evaluates to 3.5, which is truncated to 3.


    # Common Errors


    A common error in arithmetic substitution is inserting spaces between the parentheses.
    There should be no spaces between the first or last set of parentheses. The correct
    syntax is as follows:


    ```

    $( ( exp ) )

    ```


    If a space is inserted between the parentheses, as follows:


    ```

    $ ( ( exp ) )

    $ ( ( exp ) )

    $ ( ( exp ) )

    ```


    the shell will generate an error message. The exact error message depends on exp.
    For example, all the following commands:


    ```

    $ echo $ ( ( 5/2 ) )

    $ echo $ ( ( 5/2 ) )

    $ echo $ ( ( 5/2 ) )

    ```


    will produce an error message similar to the following:


    ```

    sh: command not found: 5

    ```


    On some systems the error message is


    ```

    sh: no such file or directory: 5

    ```'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# Summary


    In this chapter, you looked at four forms of substitution available in the shell:


    +   - Filename substitution

    +   - Variable substitution

    +   - Command substitution

    +   - Arithmetic substitution


    As you write scripts and use the shell to solve problems, these types of substitution
    will be of immense utility.


    # Questions


    +   1. What combination of wildcards should you use to list all the files in the
    current directory that end in the form hwXY_Z.ABC? Here X and Y can be any number;
    Z is a number between 2 and 6; and A, B, and C are characters.

    +   2. What action is performed by the following line, if the variable MYPATH
    is unset: `: ${MYPATH:=/usr/bin:/usr/sbin:/usr/ucb}`

    +   3. What is the difference between the actions performed by the command given
    in the previous problem and the action performed by the following command: `:
    ${MYPATH:=/usr/bin:/usr/sbin:/usr/ucb}`

    +   4. What is the output of the following command (figure it out by yourself
    before typing it into the shell): `echo $(( 3 * 2 + ( 4 - 3 / 4 ) ))`


    # Terms


    **Character range** A method for specifying a set of characters by giving the
    first and last character in the set.


    **Globbing** The process used by the shell to produce a list of files that match
    a particular expression. Also known as filename substitution.


    **Meta-characters** Characters that have a special meaning in the shell.


    **Substitution** The process by which the shell converts a string containing meta-characters
    into a different string that is the result of interpreting the meta-characters.


    **Wildcards** Meta-characters used in globbing. The two main wildcards are * and
    ?.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '![](img/3def70414996f811615f713b2077a154_162_0.png)


    # Hour 10


    # Quoting


    In the preceding chapter, you looked at substitution, which occurs automatically
    whenever you enter a command containing a meta-character or a $. The way the shell
    interprets these and other special characters is generally useful, but sometimes
    it is necessary to turn off shell substitution and let each character stand for
    itself. Turning off the special meaning of a character is called quoting, and
    it can be done in three ways:


    +   - Using the backslash (\ )

    +   - Using the single quote ('')

    +   - Using the double quote (")


    Quoting can be a very complex issue, even for experienced UNIX programmers. In
    this chapter, you look at each of these forms of quoting and learn how to use
    them. You learn a series of simple rules to help you understand when quoting is
    needed and how to do it correctly.'
  merge: -1
  img_proc: true
- pgno: 163
  md: "# Quoting with Backslashes\n\nTo start out, let's use echo to get a better\
    \ idea about how the shell treats special characters. For example,\n\n```\n$ echo\
    \ Hello world\n```\n\ndisplays the following message on your screen:\n\nHello\
    \ world\n\nWatch what happens if you add the semicolon (;) meta-character in between\
    \ Hello and world:\n\n```\n$ echo Hello; world\n```\n\nHello\nsh: world: Command\
    \ not found\n\nThe semicolon (;) character tells the shell that it has reached\
    \ the end of one command and what follows is a new command. This character enables\
    \ multiple commands on one line. Because world is not a valid command, you get\
    \ an error message (the error message on your system might be slightly different).\n\
    \nIn order to display a meta-character, you need to quote it. When a character\
    \ is quoted, its special meaning is disabled. In the shell, characters are quoted\
    \ using the backslash (\\ ) character. As an example, you can resolve the problem\
    \ in the previous example by quoting the semicolon as follows:\n\n```\n$ echo\
    \ Hello\\; world\n```\n\nHello; world\n\nAs you can see, the quoting character\
    \ (\\ ) is not displayed in the output. The shell preprocesses the command line,\
    \ performing variable substitution, command substitution, and filename substitution,\
    \ unless the special character that would normally invoke substitution is quoted.\
    \ The backslash is then removed from the command arguments, so the command being\
    \ run never sees the quoting character.\n\n![](img/3def70414996f811615f713b2077a154_163_0.png)\n\
    \n> The technique of quoting a meta-character with the backslash is frequently\
    \ referred to as escaping. The terms quoting and escaping are often used interchangeably.\n\
    > \n> You might also see the backslash referred to as the escape character.\n\n\
    Here is another example where escaping is needed:\n\n```\n$ echo You owe \\$1250\n\
    ```\n\nYou owe $250"
  merge: -1
  img_proc: true
- pgno: 164
  md: 'This seems like a simple echo statement, but notice that the output is not
    what was expected because the shell treats the $1 in $1250 as the shell variable
    $1. The $ meta-character must be quoted in order to avoid variable substitution:


    ```

    $ echo You owe \$1250

    ```


    Now you get the desired output:


    You owe $1250


    Now let''s say you need to print a message that contains a backslash:


    ```

    $ echo A:\ is my floppy drive

    ```


    A:\ is my floppy drive


    As you can see, the backslash is not present in the output. This is because a
    single backslash is always used to quote the next character, in this case a space.
    In order to obtain a backslash, you need to quote it with a backslash as follows:


    ```

    $ echo A:\\ is my floppy drive

    ```


    A:\ is my floppy drive


    # Meta-Characters and Escape Sequences


    The previous examples covered three of the meta-characters that need to be quoted.
    The complete set of meta-characters that need to be quoted follows:


    * ? [ ] ` \ $ ; ( & ) | # newline tab


    Frequently you will see newline and tab expressed as \n and \t respectively. When
    the backslash precedes a normal character, such as n or t, the resulting string,
    called an escape sequence, takes on a special meaning. As you learned in Chapter
    5, "Input and Output," escape sequences make it possible to embed special characters
    such as newlines and tabs in messages output by scripts.


    # Using Single Quotes


    Here is an echo command that must be modified because it contains many special
    shell characters:


    ```

    $ echo <-$1250.**,?; (update?) [y|n]

    ```


    You could quote the entire string by putting a backslash in front of each special
    character, but this is tedious and makes the resulting command difficult to read
    and understand:


    ```

    $ echo \<-\$1250.\*\*\?\,\; \(update\?\) \[y\|n\]

    ```'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'An alternative technique for quoting a large group of characters is to put
    a single quote ('') at the beginning and end of the string. When a string is quoted
    using the single quote, all the meta-characters within the string lose their special
    meaning and are treated literally. For example, the following command is equivalent
    to the previous example:


    ```

    $ echo ''<$12%.*>''; {update?} [y|n]''

    ```


    ![](img/3def70414996f811615f713b2077a154_165_0.png)


    > Quoting regular characters is harmless, because regular characters are treated
    the same whether or not they are quoted. This is true for the backslash, single
    quotes, and double quotes. In the previous example, you put single quotes around
    a whole string, quoting both the special characters and the regular letters and
    digits that did not require quoting. Strictly speaking, you did not have to do
    this; you would have just quoted those parts of the string that contained meta-characters.
    Quoting everything is simply easier, both to write and maintain, and incurs no
    performance penalty.


    If a single quote appears within a string to be output, you should not put the
    whole string within single quotes:


    ```

    $ echo ''It''s Friday''

    ```


    This fails and only outputs the following character, while the cursor waits for
    more input:

    >


    The > sign is the secondary shell prompt (as stored in the PS2 shell variable),
    and it indicates that you have entered a multiple-line command—what you have typed
    so far is incomplete. Single quotes must be entered in pairs, and their effect
    is to quote all characters that occur between them. In case you are wondering,
    you cannot get around this by putting a backslash before an embedded single quote.
    To correct the problem you need to quote just the single quote in the word It''s
    as follows:


    ```

    $ echo It\''s Friday

    ```


    # Using Double Quotes


    In many cases, you will need to quote some meta-characters but allow others to
    be evaluated by the shell. For example, the following echo command contains some
    meta-characters that must be quoted and others that should not:


    ```

    $ echo ''$USER owes $<12%.*>''; [ as of `date ''+%m/%d'' ` ]

    ```'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'Because the string is single quoted, the output is easy to predict—what you
    see is what you get:


    ```

    $USER owes $<1250.00>... [ as of ''date +%m/%d'' ]

    ```


    As you can imagine, this is not exactly what you wanted; the single quotes have
    prevented variable substitution and command substitution from occurring, thus
    the variable $USER, which contains the username of the current user, was not replaced
    with the appropriate value and the date command was not executed. So now the problem
    is to quote most of the meta-characters, such as * and ; , but to allow some meta-characters,
    such as $ and ` , to be evaluated.


    Double quotes are the solution to this problem. Double quotes disable all of the
    meta-characters except for $ and ` , thus allowing variable and command substitution
    to be performed in a quoted string. Watch what happens if you replace the single
    quotes with double quotes as follows:


    ```

    $ echo "SUSER owes $<1250.00>... [ as of ''date +%m/%d'' ]"

    Fred owes <-250... [ as of (12/21) ]

    ```


    As you can see, double quotes permit you to display many meta-characters literally
    while still enabling variable and command substitutions. However, as you might
    have noticed, the amount of money owed is incorrect because $1 is substituted.
    To correct this, you need to use a backslash to escape the $:


    ```

    $ echo "SUSER owes \\$1250.00>... [ as of ''date +%m/%d'' ]"

    ```


    The escaped dollar sign is no longer a special character, so the dollar amount
    appears correctly in the output now:


    ```

    ranga owes <-$1250... [ as of (12/21) ]

    ```


    If you need to print a double quote inside a double-quoted string, you need to
    quote it with a backslash (\ ) as follows:


    ```

    $ echo "He said \"Hello my dear!\""

    He said "Hello my dear"

    ```


    # Quoting Rules and Situations


    Now that you know the basics about quoting, let''s look at some additional rules
    that will help you use quoting effectively.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# Quoting Ignores Word Boundaries


    In English, you are used to quoting whole words or sentences. In shell programming,
    the special characters must be quoted, but it does not matter whether the regular
    characters are quoted in the same word, as follows:


    ```

    $ echo ''Hello; world''

    Hello; world

    ```


    You can move the quotes off word boundaries as long as any special characters
    remain quoted. This command produces the same output as the preceding one:


    ```

    $ echo ''Hel''lo''; ''w''or''ld

    Hello; world

    ```


    Of course, it is easier to read the line if the quotes are on word boundaries.
    This simple example illustrates the manner in which quoting can be used. Quoting
    off of word boundaries will be useful in some of the more complex quoting situations
    you will encounter.


    # Combining Quoting in Commands


    You can freely switch from one type of quoting to another within the same command.
    For example, the following command contains single quotes, a backslash, and double
    quotes:


    ```

    $ echo The ''USER'' variable contains this value > "|$USER|"

    The ''USER'' variable contains this value > |ranga|

    ```


    As you can see from the output, you can intermixed multiple forms of quoting in
    the same command.


    # Embedding Spaces in a Single Argument


    To the shell, one or more spaces or tabs form a single command-line argument separator.
    For example, the output from the following command:


    ```

    $ echo Name Address

    ```'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'Now the multiple spaces are preserved in the output:


    Name Address


    Spaces must be quoted to embed them in a single command-line argument:


    ```

    $ mail -s Meeting tomorrow fred jane < meeting.notice

    ```


    The mail command enables you to send mail to a list of users. The -s option enables
    the following argument to be used as the subject of the mail. Although the word
    tomorrow is part of the subject (Meeting tomorrow), it is taken as one of the
    users to receive the message, which results in an error. You can solve this by
    quoting the embedded space within the subject using any of the three types of
    quoting:


    ```

    mail -s ''Meeting'' tomorrow fred jane < meeting.notice

    ```


    ```

    mail -s "Meeting tomorrow" fred jane < meeting.notice

    ```


    ```

    mail -s `Meeting tomorrow` fred jane < meeting.notice

    ```


    > Unless the users fred and jane exist on your system, the mail commands in the
    previous examples will most likely fail to deliver mail and will result in the
    creation of a file named dead.letter in your home directory.


    # Quoting Newlines to Continue on the Next Line


    The newline character is found at the end of each line of a UNIX shell script;
    it is a special character that tells the shell that it has encountered the end
    of a line. When a script is being created, the newline character is inserted each
    time you press Enter or Return at the end of a line.


    > Normally you can''t see the newline characters in your script, but if you are
    using the vi editor, the vi command

    > :set list

    > marks each newline character with a dollar sign. This allows you to see where
    the newlines are in your scripts.


    You can quote the newline character to enable a long command to extend to another
    line as follows:


    ```

    $ cp file1 file2 file3 file4 file5 file6 file7 \

    > file8 file9 /tmp

    ```'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'Notice the last character in the first line is a backslash. This backslash
    quotes the newline character at the end of the line. The shell recognizes this
    and displays > (the PS2 prompt) as confirmation that you are entering a continuation
    line or multiple-line command. For this to work properly, you must not have any
    characters, including spaces, after the final backslash on the first line.


    A quoted newline also acts as an argument separator just like a space or tab.
    For example:


    ```

    $ echo ''Line 1

    > Line 2

    ```


    The newline at the end of the first line of the command is quoted because it is
    between a pair of single quotes. The output from this command is


    Line 1

    Line 2


    # Quoting to Access Filenames Containing Special Characters


    In the previous chapter, you saw that any word that contains the characters *,
    ?, [, and ] is automatically expanded to a list of files that match the specified
    pattern. For example, the command:


    ```

    $ rm ch1*

    ```


    removes all files in the current directory whose names start with the prefix ch1.
    In this case, the * character is a special character. Most of the time, this is
    exactly what you want, but there is a case where you need to use quoting to remove
    this character''s special meaning. Assume you have these files in a directory:


    ch1    ch1*    ch1a    ch15


    Notice that the filename ch1* contains the * character. Although this is certainly
    not recommended, sometimes you encounter files whose names contain strange characters
    (usually such files are created by accident). If you only want to delete the file
    ch1*, the following command is overkill:


    ```

    $ rm ch1*

    ```


    because it deletes all of the files that start with ch1. To delete just the file
    named ch1* you need to quote the *. You can use the backslash, the single quote,
    or the double quote for this purpose:


    ```

    $ rm ch1\*

    $ rm ''ch1*''

    $ rm "ch1*"

    ```'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'Quoting the special character takes away its wildcard meaning and enables you
    to delete the desired file.


    > Avoid using special characters in filenames because you have to quote the special
    character each time you access that file. Also take extra care when dealing with
    files that include a filename expansion meta-character in their filenames. If
    such a filename is supplied to the rm or rs commands without proper quoting, you
    might lose many files before you find the mistake.


    # Quoting Regular Expression Wildcards


    In Chapter 16, "Filtering Text with Regular Expressions," you learn about another
    type of expression known as regular expressions. Regular expressions use some
    of the same wildcard characters as filename substitution, as you can see in this
    grep command (which is covered in Chapter 15, "Filtering Text")


    ```

    grep ''[8-9][0-9]*'' report2 report7

    ```


    The quoted string ''[8-9][0-9]*'' is a regular expression that grep searches for
    within the contents of files report2 and report7. Wildcards in the grep pattern
    must be quoted to prevent the shell from erroneously replacing that pattern with
    a list of filenames that match the pattern.


    > You should always quote your regular expressions to protect them from shell
    filename expansion, but sometimes they work even if you don''t quote them. The
    shell only expands the pattern if it finds existing files whose names match the
    pattern. If you happen to be in a directory where no matching files are found,
    the pattern is left alone, and grep works fine. Move to another directory, though,
    and the same command might fail.


    # Quoting the Backslash to Enable echo Escape Sequences


    In Chapter 5, you saw that echo enables you to use escape sequences, such as \n,
    in your output. For example,


    ```

    $ printf "Line 1\nLine 2\n"

    ```


    displays the following:

    Line 1

    Line 2'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'You might be wondering how the quoting rules apply here. If the backslash takes
    away the special meaning of its following character, shouldn''t you just see n
    in the output?


    A backslash within double quotes is special only if it precedes one of these four
    characters:


    +   - $

    +   - `

    +   - "

    +   - \


    The \n within double quotes is treated as two normal characters that are passed
    to the echo command as arguments. The printf command enables its own set of special
    characters, which are indicated by a preceding backslash. The \n passed to printf
    tells printf to display a newline. In this example, the \n has to be quoted so
    that the backslash can be passed to printf and not removed before printf can see
    it. Watch what happens when you don''t quote the backslash:


    ```

    $ printf Line 1\nLine 2\n

    ```


    This displays:


    Line 1\nLine 2n


    The \n is not quoted, so the shell removed the backslash before printf sees the
    arguments. Because printf sees n, not \n, it simply displays n, not a newline
    as desired.


    # Quoting Wildcards for cpio and find


    There are other commands like printf that have their own special characters that
    must be quoted for the shell to pass them unaltered. The cpio is a command that
    saves and restores files. It allows you to use the filename expansion meta-characters
    to select the files to restore. In order for cpio to receive these meta-characters
    in fact, they must be quoted as in the following example:


    ```

    $ cpio -icdvum ''usr2/*'' < /dev/rmt0

    ```


    -icdvum includes options to cpio to specify how it should restore from the tape
    device (/dev/rmt0). The string usr2/* says to restore all files from directory
    usr2 on tape. Again, this command sometimes works correctly even if the wildcards
    aren''t quoted because shell expansion doesn''t occur if matching files aren''t
    found in the current path (in this case, if there is no usr2 subdirectory in the
    current directory). It is best to quote these cpio wildcards so you can be sure
    the command works properly every time.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '![](img/3def70414996f811615f713b2077a154_172_0.png)


    > Before using the cpio command to restore files from a tape device such as /dev/rre,
    please consult your system administrator to ensure that you have sufficient permissions
    to use such devices.


    The find command covered in Chapter 18, "Other Tools," supports its own wildcards
    as well. For example, in the following command


    ```

    find / -name ''ch*.doc'' -print

    ```


    ch*.doc is a wildcard pattern that tells find to display all filenames that start
    with ch and end with a .doc suffix. Unlike shell filename expansion, this find
    command checks all directories on the system for a match. However, the wildcard
    must be quoted using single quotes, double quotes, or a backslash, so the wildcard
    is passed to find and not expanded by the shell.


    # Summary


    In this chapter, you looked at three types of quoting and when to use them:


    +   - Backslash

    +   - Single quote

    +   - Double quote


    In addition, you learned several quoting rules:


    +   - A backslash takes away the special meaning of the character that follows
    it.

    +   - The character doing the quoting is removed before command execution.

    +   - Single quotes remove the special meaning of all enclosed characters.

    +   - Quoting regular characters is harmless.

    +   - A single quote cannot be inserted within a single quoted string.

    +   - Double quotes remove the special meaning of most enclosed characters.

    +   - Quoting can ignore word boundaries.

    +   - Different types of quoting can be combined in one command.

    +   - Quote spaces to embed them in a single argument.

    +   - Quote the newline to continue a command on the next line.

    +   - Use quoting to access filenames that contain special characters.

    +   - Quote regular expression wildcards.

    +   - Quote the backslash to enable echo escape sequences.'
  merge: -1
