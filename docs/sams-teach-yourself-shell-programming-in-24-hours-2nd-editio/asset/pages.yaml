    # Counting Words


    Counting words is an essential capability in shell scripts. There are many ways
    to do it, with the easiest being the wc command. Unfortunately, it displays only
    the number of characters, words, or lines. What about when you need to count the
    number of occurrences of a particular word in a file? The wc command falls short.
    In this section, you will solve this problem using the following commands:


    +   - tr'
