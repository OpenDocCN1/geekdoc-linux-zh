    # The Assignment Operators


    In the previous example, the awk command:


    ```

    ```

    awk '' / ^ $ / { x++ ; print x ; } '' $1

    ```

    ```


    Uses the assignment:


    ```

    ```

    x=x+1

    ```

    ```


    In awk this can be written in a more concise fashion using the addition assignment
    operator:


    x += 1


    Here, the assignment operator += takes the value of x, adds 1 to it, and then
    assigns the result to x.


    In general the assignment operators have the syntax


    name operator num


    Here name is the name of a variable, operator is one of the operators specified
    in Table 17.3, and num is either the name of a variable or a numeric constant
    such as 1 or 2.'
