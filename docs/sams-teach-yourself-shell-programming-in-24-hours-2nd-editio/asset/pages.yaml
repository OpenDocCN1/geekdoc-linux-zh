- pgno: 301
  md: "Here expr is an expression created using the conditional operators. The parentheses\
    \ surrounding expr are required. The actions that should be performed, actions,\
    \ are any sequence of valid awk commands. The braces surrounding the actions are\
    \ required only for actions that contain more than one statement, but most programmers\
    \ always include them for the sake of clarity and maintainability.\n\nThe following\
    \ example uses a while loop to print the fields of the file fruit_prices.txt in\
    \ reverse order:\n\n```\n#!/bin/sh\nawk '{\n    x=NF;\n    while (x>0) {\n   \
    \     printf \"%6s \",$x;\n        x-=1;\n    }\n    print \"\";\n}' fruit_prices.txt\n\
    ```\n\nHere, you use NF to access the number of fields in the current record.\
    \ You also use the field access operator, $, in conjunction with the variable\
    \ x to access the value of a particular field.\n\nIf this script is called reverse_fruit.sh\
    \ and is located in the current directory, it can be invoked as follows:\n\n```\n\
    $ ./reverse_fruit.sh\n```\n\nThe output is similar to the following:\n\nQuantity\
    \   Price/lb   Fruit\n100        $8.99      Banana\n65         $0.79      Peach\n\
    22         $1.50      Kiwi\n35         $1.29      Pineapple\n78         $0.99\
    \      Apple\n\n# The do Statement\n\nA variation on the while statement is the\
    \ do statement. It also performs some actions while an expression is true. The\
    \ main difference between while and do is that the do statement executes at least\
    \ once. The basic syntax is\n\n```\ndo {\n    actions\n} while (expr)\n```\n\n\
    Here expr is an expression created using the conditional operators. The parentheses\
    \ surrounding expression are required. The actions that should be performed, actions,\
    \ are any sequence of valid awk commands. The braces surrounding the actions are\
    \ required"
  merge: -1
