    \ > /dev/null 2>&1 ; then\n : # we have basename, nothing to do\nelse\n # we don't\
    \ have basename, define a function that\n # implements the same functionality\n\
    \ basename () {\n if [ -n \"$1\" ] ; then\n echo \"${1%/*}/\"\n else\n echo \"\
    Usage: basename [file]\" 1>&2\n return 1\n fi\n }\n```\n```"
