    Apple | $0.99


    To update the file, we can use the following procedure:


    ```

    $ mv fruit_pieces.txt fruit_pieces.txt.$$

    $ sed -e ''s/Peach/ /'' -e ''s/*[0-9][0-9]*\.[0-9][0-9]/$/'' fruit_pieces.txt.$$
    > fruit_pieces.txt

