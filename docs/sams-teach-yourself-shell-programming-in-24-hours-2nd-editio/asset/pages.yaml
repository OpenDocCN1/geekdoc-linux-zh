  img_proc: true
- pgno: 284
  md: '```

    Peach    $8.79    65

    Kiwi     $1.98    22

    Pineapple $1.79   55

    Apple    $8.99    78

    ```


    Here the awk command print is used to print each line of the input. When the print
    command is given without arguments, it prints an input line exactly as it was
    read. Notice that there is a semicolon (;) after the print command. This semicolon
    indicates to awk where the end of a command is. Although some older versions of
    awk do not require the semicolon, it is good practice to include it.


    # Field Editing


    One of the nicest features available in awk is that it automatically divides input
    lines into fields. A field is a set of characters separated by one or more field
    separator characters. The default field separator is tab and space.


    When a line is read, awk places the fields that it has parsed into the variable
    $1 for the first field, $2 for the second field, and so on. The value of a field
    is accessed using the field operator, $. For example, the first field is $1.


    ![](img/3def70414996f811615f713b2077a154_284_0.png)


    > > The use of the $ in awk is slightly different than in the shell. The $ is
    required only when accessing the value of a field variable. It is not required
    when accessing the values of other variables. Creating and using variables in
    awk is explained in depth later in this chapter.


    To demonstrate the use of fields, let''s see how you can use them to print only
    the name of a fruit and its quantity from the file:


    ```

    $ awk ''{ print $1 $3 ; }'' fruit_prices.txt

    ```


    Here you use awk to print two fields from every input line:


    +   - The first field, which contains the fruit name

    +   - The third field, which contains the quantity


    The output looks like the following:


    ```

    FruitQuantity

    Bananas100

    Peach65

    Kiwi22

    Pineapple35

    Apple78

    ```'
  merge: -1
  img_proc: true
