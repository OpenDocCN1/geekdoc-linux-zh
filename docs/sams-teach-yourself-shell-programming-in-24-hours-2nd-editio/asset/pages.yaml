  md: '![](img/3def70414996f811615f713b2077a154_448_0.png)


    # APPENDIX B


    # Glossary


    **Absolute Pathname** Represents the location of a file or directory starting
    from / and listing all the directories between / and the file or directory of
    interest. The pathname /etc/hosts is an absolute pathname.


    **Abstraction** Scripts that use abstraction retain the same basic flow by placing
    the conditional execution statements within functions. When a function is called,
    it makes a decision as to which commands execute on a given platform.


    **Alias** An abbreviation or an alternative name, usually mnemonic, for a command.


    **Anchoring** Anchoring a regular expression limits matches to lines that begin
    or end with the expression.


    **Arguments** Command modifiers that change the behavior of a command.


    **Array Variable** A variable that groups multiple scalar variables together using
    a single name. Each of the individual scalar variables is accessed through an
    index.'
  merge: -1
  img_proc: true
- pgno: 449
  md: '**Background** Describes processes usually running at a lower priority and
    with their input disconnected from the interactive session. Input and output are
    usually directed to a file or other process.


    **Background Processes** Autonomous processes that run under UNIX without requiring
    user interaction.


    **Bash** See Bourne-Again Shell.


    **Block Special Files** Provide a mechanism for communicating devices by transferring
    large blocks of data.


    **Body** The set of commands executed by a loop.


    **Bourne Shell** The original UNIX shell was written at AT&T Bell Labs in New
    Jersey during the mid-1970s by Steve Bourne. Because the Bourne shell was the
    first to appear on UNIX systems, it is often referred to as "the shell."


    **Bourne-Again Shell** A shell written by Brian Fox of the Free Software Foundation
    as a replacement for the Bourne shell. At present bash is maintained by Chet Ramey.
    It incorporates most of the features of csh, tcsh, and ksh while retaining compatibility
    with the original Bourne shell and compliance with the POSIX standard.


    **Character Range** A method for specifying a set of characters by just giving
    the first and last character in the set.


    **Character Special Files** Provide a mechanism for communicating with a device
    one character at a time.


    **Child Processes** See Subprocesses.


    **Child Shells** See Subshells.


    **Command Separators** Indicate where one command ends and another begins. The
    most common command separator is the semicolon character (;).


    **Command** Comprised of the name of a program along with zero or more arguments.
    You might see the term command used instead of the term utility for simple commands,
    when only the program name is given.


    **Comment** A statement that is embedded in a shell script but is not executed
    by the shell. Comments are intended to be internal human-readable documentation
    that cover the inner workings of the script.


    **Complex Command** A command that consists of a command name and a list of arguments.'
  merge: -1
  img_proc: true
- pgno: 450
  md: '**Compound Command** A command that consists of a list of simple and complex
    commands separated by the semicolon character (;).


    **Conditional Execution** Alters the execution of a script based on the system
    type. A script that uses conditional execution usually contains an if statement
    at the beginning of the script that sets variables to indicate the commands to
    use on a particular platform.


    **Conditional Flow Control Commands** Commands that allow the flow of a script
    to be conditionally changed; also called flow control commands.


    **csh** See C-Shell.


    **C-Shell** A shell written at the University of California at Berkeley in the
    early 1980s by Bill Joy. C-Shell was designed to make the shell easier to use
    interactively. It first appeared in BSD UNIX and was later incorporated into AT&T''s
    version of UNIX. C shell is usually installed as /bin/csh.


    **Default Action** The action that the system takes on behalf of the program in
    the absence of a signal handler.


    **Default Behavior** The default behavior of a command is the output generated
    by a command when it is run as a simple command.


    **Directories** Used to hold ordinary and special files. Directories are similar
    to folders in MacOS or Windows.


    **Directory Tree** The hierarchical structure used in UNIX for organizing files
    and directories.


    **Environment** A set of variables that the shell passes to every program it starts.
    The environment provides useful information to commands about the current user
    and the system. The command search path, the online help search path, the time
    zone and the local language settings are examples of the type of information typically
    stored in the environment.


    **Environment Variable** A variable that is a member of the environment.


    **Escape Sequence** A special sequence of characters that represents another character.


    **Escaping** Placing a backslash (\ ) just before a character. Escaping can either
    remove the special meaning of a character in a shell command, or it can add special
    meaning as with \n in the echo command. The character following the backslash
    is called an escaped character.


    **Executable Code** All the commands in a script outside of the function definitions.


    **Exporting** The process of placing a variable in the environment.'
  merge: -1
  img_proc: true
- pgno: 451
  md: '**Field** A set of characters that are separated by one or more field separator
    characters. The default field separator characters are tab and space.


    **Field Separator** Controls the manner in which an input line is broken into
    fields. In the shell, the field separator is stored in the variable IFS. In awk,
    the field separator is stored in the awk variable FS. Both the shell and awk use
    the default value of space and tab for the field separator.


    **File Descriptor** An integer that is associated with a file. Enables you to
    read and write from a file using the integer instead of the file''s name.


    **Filename** The name of a file. The name of the file /etc/hosts is hosts.


    **Function chaining** The process of calling a function from another function.


    **Functions** Provide a way of mapping a name to a list of commands. Functions
    are similar to subroutines and procedures in other programming languages.


    **Global Scope** If a variable has global scope, its value can be accessed from
    anywhere within a script.


    **Global Variables** Variables with global scope.


    **Globbing** The process used by the shell to produce a list of files that match
    a particular expression. Globbing is also known as filename substitution.


    **Hard Link** A special directory entry that points to another file. A hard link
    cannot point to a directory; it can only point to a file. A hard link is also
    indistinguishable from the file that it points to; there is no way to tell whether
    a particular file is a hard link or the original file.


    **Home Directory** The directory where you start after logging in.


    **Infinite Loops** Loops that execute forever without terminating.


    **Input Redirection** In UNIX, the process of sending input to a command from
    a file.


    **Interactive Mode** A mode in which the shell reads input from the user and executes
    the specified commands. This mode is called interactive because the shell is interacting
    with a user.


    **Invisible Files** Files whose first characters are dots or periods (.). Many
    programs (including the shell) use such files to store configuration information.
    Invisible files are also referred to as hidden files.


    **Iteration** A single execution of the body of a loop.'
  merge: -1
  img_proc: true
- pgno: 452
  md: '**Kernel** The heart of the UNIX system. It provides utilities with a means
    of accessing a machine''s hardware. It also handles scheduling and executing commands.


    **Korn Shell** David Korn of AT&T Bell Labs wrote the Korn shell, ksh. It incorporates
    all the C shell''s interactive features while preserving the Bourne shell''s ALGOL-like
    syntax. The Korn shell is usually installed as /bin/ksh or /usr/bin/ksh.


    **ksh** See Korn Shell.


    **Library** A repository of functions that can be accessed by your shell scripts.


    **Link** A file that points to another file on the system.


    **Literal Characters** These characters have no special meaning and cause no extra
    action to be taken. Quoting causes the shell to treat a wildcard as a literal
    character.


    **Local Scope** If a variable has local scope, its value can only be accessed
    within the function where it is declared.


    **Local Variable** A variable that is present within the current instance of the
    shell. It is not available to programs that are started by the shell. Local variables
    are also variables that have local scope.


    **Loops** Enable you to execute a series of commands multiple times. Two main
    types of loops are the while and for loops.


    **Man Pages** Every version of UNIX comes with an extensive collection of online
    help pages called man pages (short for manual pages). The man pages are the authoritative
    source about your UNIX system. They contain complete information about both the
    kernel and most of the utilities.


    **Meta-characters** Characters that have a special meaning in the shell.


    **Newline** This is literally the linefeed character whose ASCII value is 10.
    In general, the newline character is a special shell character that indicates
    a complete command line has been entered and can now be executed.


    **Nested Loops** When a loop is located inside the body of another loop it is
    said to be nested within another loop.


    **Non-interactive Mode** A mode in which the shell does not interact with the
    user; instead it reads commands stored in a file and executes them. When the shell
    reaches the end of the file, it exits.


    **Option** An argument that starts with the hyphen or dash character, - .


    **Ordinary File** A file that contains data, text, or program instructions. Almost
    all the files on a UNIX system are ordinary files.


    ![](img/3def70414996f811615f713b2077a154_452_0.png)'
  merge: -1
  img_proc: true
- pgno: 453
  md: '**Output Redirection** In UNIX, the process of capturing the output of a command
    and storing it in a file is called output redirection because it redirects the
    output of a command into a file instead of the screen.


    **Parent Directory** The directory that contains a given directory. If directory
    B is contained within directory A, directory A is considered the parent directory
    of B.


    **Parent Process Identifier** Shown in the heading of the ps command as PPID.
    This is the process identifier of the parent process. See also Parent Processes.


    **Parent Processes** These processes control other processes that are often referred
    to as child processes or subprocesses. See Processes.


    **Parent Shell** This shell controls other shells, which are often referred to
    as child shells or subshells. The login shell is typically the parent shell. See
    Shell.


    **Pathname** The filename of a file combined with the filenames of its parent
    directories. The pathname of the file hosts located in the directory /etc is /etc/hosts.


    **Pipe** Used to connect the standard output of a command to the standard input
    another command.


    **Process Identifier (PID)** Shown in the heading of the ps command as PID. It
    is the unique number assigned to every process running in the system.


    **Processes** Discrete, running programs under UNIX. The user''s interactive session
    is a process. A process can invoke (run) and control another program that is then
    referred to as a subprocess. Ultimately, everything a user does is a subprocess
    of the operating system.


    **Prompt** Displayed by the shell. When the prompt is present, the shell can be
    given a command to execute. In this book, the $ character is used to indicate
    the prompt.


    **Quoting** The process that literally encloses selected text within some type
    of quotation marks. When applied to shell commands, quoting disables shell interpretation
    of special characters by enclosing the characters within single or double quotes
    or by escaping the characters.


    **Read-only Variable** A variable whose value cannot be changed.


    **Recursion** A special instance of function chaining in which a function calls
    itself.


    **Regular files** The most common type of files on UNIX systems and can be used
    to store any kind of data, including binary data that the system can execute.


    **Relative Pathname** Represents the location of a file or directory relative
    to the current directory. The pathname ../etc/hosts is a relative pathname.'
  merge: -1
  img_proc: true
- pgno: 454
  md: '**Return code** The exit status from a function. The convention for return
    codes is the same as for exit codes; 0 equals success and nonzero equals failure.


    **Root Directory** The topmost directory in the UNIX directory tree, /, is called
    the root directory.


    **Scalar Variable** A variable that can hold only one value at a time.


    **Scope** Refers to the region within a program where a variable''s value can
    be accessed.


    **Shell** An interface to the UNIX system. It reads input and executes programs
    based on that input. When a program has finished executing, it displays that program''s
    output. The shell is sometimes called a command interpreter.


    **Shell Initialization** After a shell is started, it undergoes a phase called
    initialization in which important parameters are set up.


    **Shell Script** A list of commands stored in a file.


    **Shell Variable** A variable that is set by the shell and is required by the
    shell in order to function correctly.


    **Signal** A software interrupt sent to a program to indicate that an important
    event has occurred.


    **Signal Handler** A function provided by a program that defines the actions to
    take when a signal is received.


    **Simple Command** A command that can be executed by giving just its name at the
    prompt.


    **Special Files** Files mainly used to provide access to hardware such as hard
    drives, CD-ROM drives, modems, and Ethernet adapters. Some special files are similar
    to aliases or shortcuts and enable you to access a single file using different
    names.


    **STDERR** Standard Error. A special type of output used for error messages. The
    file descriptor for STDERR is 2.


    **STDIN** Standard Input. User input is read from STDIN. The file descriptor for
    STDIN is 0.


    **STDOUT** Standard Output. The output of commands and scripts is normally written
    to STDOUT, which is connected to the terminal. The file descriptor for STDOUT
    is 1.


    **Subdirectory** A directory that is contained within another directory. If directory
    A contains directory B, directory B is considered a subdirectory of A.


    ![](img/3def70414996f811615f713b2077a154_454_0.png)'
  merge: -1
  img_proc: true
- pgno: 455
  md: '**Subprocesses** Run under the control of other processes, which are often
    referred to as parent processes. See Processes.


    **Subshells** Run under the control of another shell, which is often referred
    to as the parent shell. Typically, the login shell is the parent shell. See Shells.


    **Symbolic Link** A special file that stores a pathname to another file. A symbolic
    link is often referred to as a symlink.


    **Uninitialized Shell** A shell that has not yet read its init files in order
    to set up the parameters required for its proper operation.


    **Unsetting** Removing a variable from the list of variables tracked by the shell.


    **Usage Statement** A short message that a script outputs in order to inform a
    user of the proper invocation syntax for the script.


    **Utilities** Programs, such as who and date, that can be executed.


    **Variable** A word that holds a value. The value can be any text string.


    **Variable Substitution** The process by which the shell replaces the name of
    a variable with its value.


    **Wildcards** Meta-characters used in globbing. The two main wildcards are * and
    ?.


    **Words** Sets of characters separated by spaces and tabs.


    **zsh** See Z-Shell.


    **Z-Shell** A shell written by Paul Falstad while he was a student at Princeton
    University. It is extremely customizable and is mostly compatible with ksh.'
  merge: -1
  img_proc: true
