  md: '![](img/3def70414996f811615f713b2077a154_308_0.png)


    # Hour 18


    # Other Tools


    In this chapter, you will look at several useful UNIX commands that are often
    encountered in shell scripts and that you can use in your own programs. The specific
    set of commands covered in this chapter includes:


    +   - `eval`

    +   - `:`

    +   - `type`

    +   - `sleep`

    +   - `find`

    +   - `xargs`

    +   - `bc`

    +   - `expr`


    # The Built-In Commands


    The first set of commands examined in this chapter are built-in commands. A built-in
    command is part of the shell itself; it is not stored in a separate file on disk.
    Built-in commands are slightly more efficient than external'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'programs because there is no overhead associated with reading and loading them
    from a file on disk. Unless you are looping thousands of times, it usually does
    not matter whether the command you use is built in or external. The built-in commands
    you will examine are eval, :, and type.


    # The eval Command


    The eval command is used when you want the shell to execute a command after performing
    substitution. The basic syntax is


    ```

    eval cmd

    ```


    Here cmd is any valid shell command. The eval command is normally used when shell
    special characters are inserted via variable substitution or command substitution
    (refer to Chapter 9, "Substitution"). For example,


    ```

    $ OUTPUT="> out.txt"

    $ echo hello $OUTPUT

    ```


    The variable OUTPUT contains the > sign to redirect standard output to a file
    called out.txt. However, if you try to use the OUTPUT variable in the echo statement,
    you''ll find that the output goes to the screen rather than the file out.txt:


    ```

    hello > out.txt

    ```


    The output went to the screen rather than the file because the output redirection
    operator, >, was not present when the shell first looked for redirection operators.
    You can solve this problem by inserting eval at the start of the command as follows:


    ```

    $ eval echo hello $OUTPUT

    ```


    # The : Command


    The : command, referred to as the no-op (short for no-operation) command, does
    nothing other than exit with an exit code of zero. Three common uses for the :
    command are as follows:


    +   - If statements

    +   - while loops

    +   - Variable substitution'
  merge: -1
  img_proc: true
- pgno: 310
  md: "# : and if\n\nThe : command is sometimes used as the command following the\
    \ then in the if statement. For example:\n\n```\nif [ -x $CMD ] ; then\n:\nelse\n\
    \    echo Error: $CMD is not executable >&2\nfi\n```\n\nThe shell flags a syntax\
    \ error if a command does not follow the then, so you can insert the : command\
    \ as a temporary no-op command that can be replaced by other code later.\n\n#\
    \ : and while\n\nBecause the : always returns a successful result, it is used\
    \ to create an infinite loop as follows:\n\n```\nwhile :\ndo\n    list\ndone\n\
    ```\n\nThis type of loop will continue forever or until a break is executed within\
    \ the loop. Infinite loops are useful for eliciting valid input from users. For\
    \ example:\n\n```\nwhile :\ndo\n    echo -n \"Do you want to play a game (y/n)?\
    \ \"\n    read RESPONSE\n    case \"$RESPONSE\" in\n        [mM][nN][oO]) break\
    \ ;;\n        [yY][eE][sS]) RESPONSE=\"y\" ; break ;;\n        *) RESPONSE=\"\
    y\" ; break ;;\n    esac\n    echo \"Error: Invalid response: $RESPONSE\"\ndone\n\
    ```\n\nThis loop prompts the users for a response to the question:\n\nDo you want\
    \ to play a game (y/n)?\n\nIt then reads the users' responses, stores them in\
    \ the variable RESPONSE, and validates the responses to make sure that they are\
    \ in some form of yes or no. If an incorrect response was given, an error message\
    \ is displayed and the loop executes again. Otherwise the loop breaks and the\
    \ user's response is stored in the variable RESPONSE."
  merge: -1
  img_proc: true
- pgno: 311
  md: '> Some programmers use true in place of : when creating infinite loops. Using
    the : is more efficient because it is a shell built-in command, whereas true is
    an external command and must be read from disk.


    # : and Variable Substitution


    Another use of the : command takes advantage of the fact that the shell evaluates
    arguments to it. This is a useful way to invoke variable substitution. For example:


    ```

    : ${LINES:=24} ${TERM?''TERM not set''}

    ```


    The : is a no-op, but the shell still evaluates its arguments. Thus LINES is set
    to 24 if LINES is empty or undefined. If TERM is empty or undefined, the whole
    script aborts with the error message "TERM not set".


    # : and the C shell


    You might sometimes find the : used as the first line of a older shell scripts.
    Some early versions of the C shell contained a bug that automatically assumes
    that any script whose first character is # is a C shell script. For this reason
    Bourne shell scripts had to start with something other than a # sign; the : was
    often used for this purpose.


    Current versions of the C shell do not contain this bug, but some older Bourne
    shell scripts still use : as the first line.


    # The type Command


    The type command tells you the full pathname of a command if the shell can find
    that command in the search path, $PATH. The basic syntax is


    ```

    type cmd1 ... cmdN

    ```


    Here cmd1...cmdN are command names. If a command is not an external command that
    exists on disk, type tells you whether it is one of the following:


    +   - A shell built-in command

    +   - A shell keyword or reserved word

    +   - An alias


    If the given command is an alias for another command, type also gives the command
    that is actually invoked when you run the alias. For example,


    ```

    $ type true vi case ulimit history

    true is /bin/true

    vi is /usr/bin/vi

    ```'
  merge: -1
  img_proc: true
- pgno: 312
  md: "```\ncase is a keyword\nulimit is a shell builtin\nhistory is an exported alias\
    \ for fc -l\n```\n\nIf a single command is searched, type's exit code can be used\
    \ to determine if that command can be found in the search path $PATH. If a command\
    \ can be found, type exits with an exit code of 0 indicating success or 1 indicating\
    \ failure. For example, the following function allows you to determine whether\
    \ particular commands exist on the system:\n\n```\nhaveCMD () {\n  type \"$1\"\
    \ > /dev/null 2>&1\n  return $?\n}\n```\n\n# The sleep Command\n\nThe sleep command\
    \ pauses for a given number of seconds. The basic syntax is\n\n```\nsleep n\n\
    ```\n\nwhere n is the number of seconds to sleep or pause. Some types of UNIX\
    \ enable other time units to be specified. It is usually recommended that n not\
    \ exceed 65,534.\n\nThe sleep command can be used to give a user time to read\
    \ an output message before clearing the screen. It can also be used when you want\
    \ to give a series of beeps:\n\n```\necho -e \"A value must be input!\\a\"\nsleep\
    \ 1\necho -ne \"\\a\"\nsleep 1\necho -ne \"\\a\"\n```\n\n\\a causes echo to output\
    \ an audible beep. The -e option is required on some UNIX systems for \\a to sound\
    \ a beep. The -n option suppresses the newline that echo normally prints. The\
    \ sleep command is used in the previous example to give a sequence of beeps, spaced\
    \ one second apart.\n\nsleep can be used in a loop to repeat a job periodically:\n\
    \n```\nwhile :\ndo\n  date\n  who\n  sleep 300\ndone >> logfile\n```\n\nThis code\
    \ enables a list of users logged into the system to be appended to logfile every\
    \ five minutes (300 seconds). If you want to leave this code running all the time,\
    \ you must clear logfile periodically so that it does not eat up all your disk\
    \ space."
