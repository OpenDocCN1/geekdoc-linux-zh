  md: '![](img/3def70414996f811615f713b2077a154_264_0.png)


    # Hour 16


    # Filtering Text with Regular Expressions


    The most powerful text filtering tools in UNIX are a pair of oddly named programs,
    awk and sed. These programs allow shell programmers to easily edit text files
    and filter the output of commands using regular expressions. A regular expression
    is compact notation for describing sets of strings.


    The stream editor, sed, was created as an editor for use with shell programs.
    As its name implies, sed is stream oriented: input is read, modified internally,
    and the modified version is printed out. The input file is not changed. This chapter
    covers the use of sed in shell scripts. Specifically we will


    +   - Regular expressions

    +   - Using sed


    Chapter 17, "Filtering Text with awk," covers the details of awk programming;
    however, some of similarities between awk and sed are discussed at the beginning
    of this chapter.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# The Basics of awk and sed


    Many similarities exist between awk and sed:


    +   - Both have similar invocation syntax.

    +   - Both execute a set of programmer specified instructions on every line in
    their input files.

    +   - Both use regular expressions to find string and matching lines.


    For those of you who are not familiar with regular expressions, they will be explained
    shortly.


    # Invocation Syntax


    The invocation syntax for awk and sed is as follows:


    ```

    awk ''script'' files

    ```


    Here cmd is either awk or sed, script is a list of commands understood by awk
    or sed, and files is a list of files that cmd acts on.


    The single quotes around script are required to prevent the shell from accidentally
    performing substitutions. The actual contents of script differ greatly between
    awk and sed. The command set for sed is covered later in this chapter, whereas
    awk''s command set is covered in the next chapter.


    If filenames are not given, both awk and sed read input from STDIN. This enables
    them to be used as output filters on other commands.


    # Basic Operation


    When an awk or sed command runs, it performs the following operations:


    +   1. Reads a line from an input file

    +   2. Makes a copy of the line

    +   3. Executes script on the line

    +   4. Goes to the next line and repeats step 1


    These operations illustrate the main purpose of awk and sed—they provide a method
    of acting on every record or line in a file using a single script. When every
    record has been read, the input file is closed. If the input file is the last
    file specified in filenames, the command exits.'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# Script Structure and Execution


    The script usually consists of one or more lines of the following form:


    ```

    /pattern/ action

    ```


    Here pattern is a regular expression, and action is the action that either awk
    or sed should take when pattern is encountered. The slash characters (/) that
    surround pattern act as delimiters and indicate where pattern starts and ends.
    Multiple pattern and action pairs can be specified.


    When script is executing, it uses the following procedure on each record:


    +   1. Each pattern is sequentially searched until a match is found.

    +   2. When a match is found, the corresponding action is performed on the record.

    +   3. When the action is complete, the next pattern is selected and step 1 is
    repeated.

    +   4. When all the patterns have been exhausted, the next line is read and step
    1 is repeated.


    Just before step 4 is performed, sed automatically outputs the modified record.
    In order to obtain this behavior with awk, the modified record must be manually
    output.


    The actions taken in awk and sed are quite different. In sed, the actions consist
    of commands that edit single letters, whereas in awk the action is usually a set
    of programming statements.


    # Regular Expressions


    A regular expression is a compact notation for describing sets of strings. Regular
    expressions are constructed similar to arithmetic expressions; various operators
    are used to combine smaller expressions. The basic building blocks of a regular
    expression are


    +   - Ordinary characters

    +   - Meta-characters


    Ordinary characters are


    +   - Uppercase and lowercase letters such as A or b

    +   - Numerals such as 1 or 2

    +   - Characters such as a space or an underscore


    Meta-characters are characters that have a special meaning inside a regular expression:
    they are expanded to match ordinary characters. By using meta-characters, you
    need not explicitly specify all the different combinations of ordinary characters
    that you want to'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'match. The basic set of meta-characters understood by both sed and awk is given
    in Table 16.1.


    # Table 16.1 Meta-characters


    | Character | Description |

    |---|---|

    | . | Matches any single character except a new-line. |

    | * | Matches zero or more occurrences of the character immediately preceding
    it. |

    | [chars] | Matches any one of the characters given in chars, where chars is a
    sequence of characters. You can use the - character to indicate a range of characters.
    If the ^ character is the first character in chars, one occurrence of any character
    that is not specified by chars is matched. |

    | ^ | Matches the beginning of a line. |

    | $ | Matches the end of a line. |

    | \ | Treats the character that immediately follows the \ literally. This is used
    to escape (remove the special meaning) a meta-character. |


    ![](img/3def70414996f811615f713b2077a154_267_0.png)


    > Regular expressions are referred to by several names—of which the most common
    are regex and patterns. Meta-characters are sometimes referred to as wildcards.
    These terms are often used interchangeably.


    # Regular Expression Examples


    The simplest regular expression is one that exactly represents the sequence of
    characters that needs to be matched. For example, the following regular expression


    ```

    /peach/

    ```


    matches the string peach exactly. If this expression was used in awk or sed, any
    line that contains the string peach will be selected, including lines similar
    to the following:

    We have a peach tree in the backyard

    I prefer peaches to plums


    # Matching Characters


    Now let''s look at a slightly more complicated example. The following expression


    ```

    /[a-c]/

    ```'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'matches those same strings along with strings such as ace, yacc, and arctic.
    It also matches the following line


    ```

    close the window

    ```


    although the letter a does not appear in this sentence. This is because of the
    *. It matches zero or more occurrences of the character immediately preceding
    it.


    Another important thing to note about the * is that it tries to make the longest
    possible match. For example, consider the expression


    ```

    /a*a/

    ```


    and the following line


    ```

    able was I, ere I saw elba

    ```


    Here you have asked to match lines that contain a string that starts and ends
    with the letter a. In the sample line, there are several possibilities:


    ```

    able wa

    ```


    ```

    able was I, ere I sa

    ```


    ```

    able was I, ere I saw elba

    ```


    The * always makes the longest possible match; in this case, the last one is selected.


    The . and the * can be combined to obtain behavior equivalent to the * filename
    expansion covered in Chapter 8, "Variables." For example, the following expression


    ```

    /ch.*.doc/

    ```


    matches the strings ch01.doc, ch02.doc, and chdoc. The shell''s * wildcard matches
    files of the same names.


    # Sets of Characters


    One of the major limitations with the . operator is that it does not enable you
    to specify which characters you want to match; it matches all characters. To specify
    a particular set of characters in a regular expression, we need to use the bracket
    characters, [ and ], as follows:


    ```

    /[chars]/

    ```


    Here a single character in the set given by chars is matched. The use of sets
    in a regular expression is almost identical to the use of sets in filename substitution.
    Table 16.2 shows some frequently used sets of characters.


    As an example of using sets, the following expression matches the string The and
    the:


    ```

    /[T t]he/

    ```'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# Table 16.2 Common Sets


    | Set | Description |

    |---|---|

    | `[a-z]` | Matches a single lowercase letter |

    | `[A-Z]` | Matches a single uppercase letter |

    | `[a-zA-Z]` | Matches a single letter |

    | `[0-9]` | Matches a single number |

    | `[a-zA-Z0-9]` | Matches a single letter or number |


    Sometimes it is hard to determine the exact set of characters that you need to
    match. Say that you needed to match every character except the letter T. Constructing
    a set of characters that includes every character except the letter T is error
    prone; you might forget a space or a punctuation character. To solve this problem,
    you can use the negation operator, `.` For example, the set that matches all characters
    except T is `[^T]`


    When `^` is the first character in the set, any character not given in the set
    is matched. This is called reversing. Any set, including those given in Table
    16.2, can be reversed or negated by specifying `^` as the first character. For
    example, the following expression `/[^a-zA-Z0-9]/` matches the beginnings of the
    strings chapter and chocolate, but not the strings ch01 or ch02.


    You can combine sets with the `*` character to extend their functionality. For
    example, the following expression `/ch[0-9]*\.doc/` matches the strings ch01.doc
    and ch02.doc but not the strings chdoc or changedoc.


    # Anchoring Expressions


    Let''s say that we need to find lines that start with the word the. For example,


    ```

    the plains were rich with crops

    ```


    We might be tempted to use the following simple expression:


    ```

    /the/

    ```


    Although this expression will match lines that start with the, it also matches
    the following lines:


    ```

    there were many orchards of fruit tree

    in the dark it was like summer lightning

    ```'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'The two main problems with the simple expression are


    +   - Only the word the should be matched. Lines starting with words such as there
    should not be matched.

    +   - The word the should be at the beginning of the line.


    To solve the first problem, we can add a space as follows:


    ```

    /the /

    ```


    To solve the second problem, you need the ^ meta-character, which matches the
    beginning of a line. In regular expressions, ^ anchors the expression to the beginning
    of the line: Only lines that start with the expression are matched. Normally,
    any line that contains an expression is matched.


    By adding the ^ as follows,


    ```

    /^the /

    ```


    you have an expression that matches only those lines that start with the word
    the.


    Expressions can also be anchored to the end of the line using the $. For example,
    the following expression


    ```

    /friend$/

    ```


    matches the line

    I have been and always will be your friend

    But it doesn''t match the line

    What are friends for


    You can combine ^ and $ along with sets and other meta-characters to match lines
    according to an expression. For example, the following expression


    ```

    /^Chapter [1-9]*[0-9]$/

    ```


    matches lines such as

    Chapter 1

    Chapter 20

    but it does not match lines such as

    Chapter 00 Introduction

    Chapter 101'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'Because the * and $ meta-characters anchor the expression to the beginning
    and end of a line, an empty line is matched by the expression / * $/.


    # Escaping Meta-Characters


    Sometimes we will need to match meta-characters in strings. Suppose that we need
    to match lines that contain prices:


    ```

    Peaches $0.89/lbs

    Oil $15.10/barrel

    ```


    A price contains two meta-characters, $ and ., whereas the strings contain a third
    meta-characters, /. An expression such as the following


    ```

    /\$[0-9]\.[0-9]\/[a-zA-Z]*/

    ```


    will not match either of the previous strings because of the following problems:


    +   - The first character in the expression is the $ character. Because the $
    matches the end of the line, the expression tries to look for characters after
    the end of the line, which is an impossible expression to match.

    +   - Because the . matches a single occurrence of any character, this expression
    might produce false positives; strings such as 8x00 and 1234 will be matched in
    addition to strings of the desired format.

    +   - The expression contains three slashes, which constitutes a garbled or invalid
    expression. The first two slashes are used as the delimiters for the expression.


    We can solve these problems by escaping the meta-characters using the backslash
    meta-character (\). When a backslash is present in a regular expression, the character
    immediately following the backslash is always treated literally. For example,
    $ matches the end of a line, but \$ matches a dollar sign ($). When an ordinary
    character is preceded by a backslash, the backslash has no effect. For example,
    \a and a are both treated as a lowercase a.


    Rewriting our earlier expression with escaping gives us the following:


    ```

    /\\$[0-9]\\.[0-9]\\/[a-zA-Z]*/

    ```


    This expression matches the prices correctly.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '![](img/3def70414996f811615f713b2077a154_272_0.png)


    > In order to match \, you can escape it using itself: \\.


    # Useful Regular Expressions


    Table 16.3 provides some useful regular expressions.


    TABLE 16.3 Some Useful Regular Expressions


    | String Type | Expression |

    |---|---|

    | Blank lines | /^$/ |

    | An entire line | /^.*$/ |

    | One or more spaces | / +/ |

    | HTML (or XML) tag sets | /<[^>]+>/ |

    | Valid URLs | /[a-zA-Z][a-zA-Z0-9+.-]*:\/\/[a-zA-Z0-9][a-zA-Z0-9.-]*\.[a-zA-Z]{2,}/
    |

    | Formatted dollar amounts | /[$][0-9]+(\.[0-9]{2})?/ |


    # Using sed


    sed is a stream editor that performs a set of actions on every line of its input.
    This allows sed to be used as a filter. The basic syntax of a sed command is


    `sed ''script'' files`


    Here files is a list of one or more files, and script is one or more commands
    of the form


    `/pattern/ action`


    where pattern is a regular expression and action is one of the commands given
    in Table 16.4. If pattern is omitted, action is performed for every line of input.


    TABLE 16.4 Some of the Actions Available in sed


    | Action | Description |

    |---|---|

    | p | Prints the line (p as in print) |

    | d | Deletes the line (d as in delete) |

    | s | Substitutes one expression with another (s as in substitute) |'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# Printing Lines


    Let''s start with the simplest feature available in sed—printing a line that matches
    an expression.


    The following is a price list for a small fruit market:


    ```

    $ cat fruit_prices.txt

    Fruit    Price/lbs

    Banana   0.89

    Peach    0.79

    Kiwi     1.50

    Pineapple 1.29

    Apple    0.99

    Mango    2.20

    ```


    This file lists the name of a fruit and its price per pound. Most of the following
    examples assume that this list is stored in the file fruit_prices.txt.


    To start with, let''s print out a list of those fruits that cost less than $1
    per pound. We will need to use the sed command p:


    ```

    /pattern/p

    ```


    Here pattern is a regular expression.


    Let''s try the following sed command:


    ```

    $ sed ''/ 0.[0-9][0-9]$/p'' fruit_prices.txt

    ```


    This will print all the lines that match the expression:


    ```

    / 0.[0-9][0-9]$/

    ```


    This expression specifies that only lines ending in prices such as 0.89 and 0.99
    should be printed. The leading 0 ensures that lines ending in prices such as 2.20
    or 10.10 are not printed.


    Looking at the output,


    ```

    Fruit    Price/lbs

    Banana   0.89

    Banana   0.89

    Peach    0.79

    Peach    0.79

    Kiwi     1.50

    Pineapple 1.50

    Apple    0.99

    Apple    0.99

    Mango    2.20

    ```'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'we find that the lines for fruit with prices less than a dollar are printed
    twice, whereas lines for fruit with prices greater than a dollar are printed only
    once. This demonstrates the default behavior of sed—it prints every input line
    to the output. To avoid this behavior, we can specify the -n option to sed as
    follows:


    ```

    $ sed -n ''/0.[0-9][0-9]$/p'' fruit_prices.txt

    ```


    This changes the output as follows:


    ```

    Banana 0.89

    Peach 0.79

    Apple 0.99

    ```


    # Deleting Lines


    Say that we run out of mangos and thus need to delete them from the list. To accomplish
    this task, we can use the sed command d:


    ```

    /pattern/d

    ```


    Here pattern is a regular expression.


    We can use the following sed command:


    ```

    $ sed ''/^[Mm]ango/d'' fruit_prices.txt

    ```


    This command deletes lines that start with the words mango or Mango. The output
    is as follows:

    Fruit Price/lbs

    Banana 0.89

    Peach 0.79

    Kiwi 1.50

    Pineapple 1.29

    Apple 0.99


    Notice that you did not have to specify the -n option to sed to get the correct
    output. The p command tells sed to produce additional output, whereas the d command
    tells sed to modify the regular output.


    Although you have modified the output and have verified that it is correct, the
    file still needs to be updated. You can do this with the help of the shell:

    $ mv fruit_prices.txt fruit_prices.txt.$$

    $ sed ''/^[Mm]ango/d'' fruit_prices.txt.$$ > fruit_prices.txt

    $ cat fruit_prices.txt


    First, we rename the file fruit_prices.txt to fruit_prices.txt.$$. Recall that
    the value of the variable $$ is the process ID of the current shell. Appending
    the value of $$ to the end of a file is a commonly used method for creating temporary
    files with unique names.'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'Next, we use sed to delete the lines starting with Mango or mango from the
    temporary file. Then the output of the sed command is redirected into the file
    fruit_prices.txt.


    We used cat to show us that the update was successful:


    | Fruit | Price/lbs |

    | Banana | 0.89 |

    | Paech | 0.79 |

    | Kiwi | 1.50 |

    | Pineapple | 1.29 |

    | Apple | 0.99 |


    Now that we know that the update happened correctly, we can remove the temporary
    file as follows:


    ```

    $ rm fruit_prices.txt.$$

    ```


    # Performing Substitutions


    By now you might have noticed that Peach is misspelled as Paech in our file. We
    can fix this by substituting Paech with the correct spelling using the sed command
    s:


    ```

    /pattern1/s/pattern2/pattern3/

    ```


    Here pattern1, pattern2, and pattern3 are regular expressions. The s command replaces
    pattern2 with pattern3 on any line that matches pattern1.


    Frequently pattern1 is omitted, so you see the s command used as follows:


    ```

    s/pattern2/pattern3/

    ```


    If pattern1 is omitted, the s command is executed for every input line.


    To fix the spelling of Paech, you can use the following sed command:


    ```

    $ sed ''s/Paech/Peach/'' fruit_prices.txt

    ```


    Now the output resembles the following:


    | Fruit | Price/lbs |

    | Banana | 0.89 |

    | Peach | 0.79 |

    | Kiwi | 1.50 |

    | Pineapple | 1.29 |

    | Apple | 0.99 |


    You did not have to specify the -n option to sed to obtain the desired output.
    The s command is similar to the d command in that it tells sed to modify its normal
    output.'
