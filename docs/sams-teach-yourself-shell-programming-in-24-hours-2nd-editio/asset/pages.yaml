- pgno: 296
  md: "# Built-in Variables\n\nIn addition to the variables that you can define, awk\
    \ predefines several variables. The complete list of these variables is given\
    \ in Table 17.4.\n\nTABLE 17.4 Built-in Variables in awk.\n\n| Variables | Description\
    \ |\n|---|---|\n| FILENAME | The name of the current input file. You should not\
    \ change the value of this variable. |\n| NR | The number of the current input\
    \ line or record in the input file. You should not change the value of this variable.\
    \ |\n| NF | The number of fields in the current line or record. You should not\
    \ change the value of this variable. |\n| OFS | The output field separator (default\
    \ is space). |\n| FS | The input field separator (default is space and tab). |\n\
    | OFMT | The output format for numbers (default is %.6g). |\n| ORS | The output\
    \ record separator (default is newline). |\n| RS | The input record separator\
    \ (default is newline). |\n\n# Using FILENAME and NR\n\nIn the previous example,\
    \ you used the shell to print the name of the input file. By using the variable\
    \ FILENAME in conjunction with the BEGIN statement, you can do this all in awk.\
    \ While you are at it, you can change the previous script to print the percentage\
    \ of lines in the file that were blank using the following expression in the END\
    \ pattern:\n\n100*(x/NR)\n\nHere you are using the variable NR, which stores the\
    \ current record or line number. In the END pattern, the value of NR is the line\
    \ number of the last line that was processed, which is the same as the total number\
    \ of lines processed.\n\nWith these changes, the script is\n\n```\n#!/bin/sh\n\
    for i in $0\ndo\n  if [ -f \"$i\" ] ; then\n    awk ' { $ (file=FILENAME; x+=1,\
    \ next } \n    END { printf \"%s %03d.1f\\n\",file,x,(100*(x/NR)); } '\n  else\n\
    \    \"$i\"\n  fi\ndone\n```"
  merge: -1
  img_proc: true
