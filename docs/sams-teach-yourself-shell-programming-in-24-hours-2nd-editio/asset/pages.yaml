- pgno: 120
  md: '![](img/3def70414996f811615f713b2077a154_120_0.png)


    # Hour 7


    # Processes


    In UNIX every program runs as a process. A process is an instance of running a
    program. If, for example, three people are running the same program simultaneously,
    there are three processes there, not just one. In this chapter you will learn
    about processes and jobs and the different modes in which they can be executed.
    You will also look at the commands used to list and terminate processes. Specifically
    the topics you will examine are:


    +   - Starting processes

    +   - Listing running processes

    +   - Killing processes

    +   - Manipulating parent and child processes


    # Starting a Process


    Whenever you issue a command in UNIX, it creates, or starts, a new process on
    your behalf. When you tried out the ls command to list directory contents in Chapter
    4, “Working with Directories,” the system started a process, the ls command, for
    you.'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'UNIX tracks processes through a five-digit ID number known as the pid (short
    for process identifier). Each process in the system has a unique pid between 1
    and 32,767. Pids eventually repeat when all the possible numbers are used. Two
    processes with the same pid cannot be concurrently executed on the system.


    # Foreground Processes


    By default, every process runs in the foreground. It gets its input from the keyboard
    and sends its output to the screen. You can see this happen with the ls command.
    For example, when you execute the ls command:


    ```

    $ ls

    ```


    It executes and displays the contents of the current directory:


    ```

    Desktop Downloads Library Music Public

    Documents Icon? Movies Pictures Sites

    ```


    While the command is running, you cannot run any other commands (start any other
    processes). You can enter commands, but no prompt appears and nothing happens
    until this command completes. For the ls command, which usually runs very quickly,
    this is not a problem, but if you have a program that runs for a long time—such
    as a large compile, database query, program that calculates pi, or a server—the
    terminal will be tied up.


    Fortunately, you do not have to wait for one process to complete before you can
    start another. UNIX provides facilities for starting processes in the background,
    suspending foreground processes, and moving processes between the foreground and
    background.


    # Background Processes


    A background process runs without being connected to your keyboard. If the background
    process requires any keyboard input, it waits. The advantage of running a process
    in the background is that you can run other commands; you do not have to wait
    until it completes to start another!


    The simplest way to start a background process is to add an ampersand (&) to the
    end of the command. For example, if you execute ls in the background:


    ```

    $ ls &

    ```


    the output will be similar to the following:


    ```

    [1] 621

    $ Desktop Downloads Library Music Public

    Documents Icon? Movies Pictures Sites

    ```'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'The first line of output, produced by the shell, tells you that the process
    is running in the background:


    ```

    [1] 621

    ```


    This line contains two pieces of information about the background process—the
    job ID (short for job identifier) and the pid. The shell assigns a job ID for
    every command that is executed in the background.


    If you execute this command, you might notice that you do not get back a prompt
    after the last line of the directory listing. That''s because the prompt actually
    appears immediately after the job line, next to Desktop. You can enter a command
    immediately instead of waiting for ls to finish. If you press the Enter key now,
    you will see something similar to the following:


    ```

    [1] + Done                  ls &

    $

    ```


    The first line tells you that the background ls job finished successfully. The
    second is a prompt for another command.


    You will see a different completion message if an error occurs. For example, if
    you try to list the file with the name no_such_file, you will get an error:


    ```

    $ ls no_such_file &

    [1] 25389

    $ no_such_file: No such file or directory

    ```


    The first line is the background process information and the second shows the
    prompt for the next command and the output from ls—the error message. If you press
    Enter again, the following message appears on your screen:


    ```

    [1] + Done(2)          ls no_such_file &

    $

    ```


    This shows that the ls command exited with nonzero status, in this case, 2. The
    dollar sign ($) on the next line is the command prompt.


    # Background Processes That Require Input


    If you run a background process that requires input and do not redirect it to
    read a file instead of the keyboard, the process will stop. Pressing Enter at
    an empty command prompt or starting a command will return a message to that effect.
    For example consider the following script:


    ```

    #!/bin/sh

    read LINE

    echo $LINE

    exit $?

    ```'
  merge: -1
  img_proc: true
- pgno: 123
  md: "Call this script read.sh and execute it in the background as follows:\n\n```\n\
    $ read.sh &\n$\n```\n\nBecause this command does not produce any output until\
    \ you give it input, all you see is the command prompt. Pressing Enter at the\
    \ prompt results in a message similar to the following:\n\n```\n[1] + Stopped\
    \ (SIGTSTP)    read.sh &\n```\n\nThis message informs you that the command read.sh\
    \ is currently stopped due to the signal SIGTSTP. This signal (SIG) tells you\
    \ that the program is waiting for terminal (TT) input (IN). See Chapter 19, \"\
    Signals,\" for more information on signals. In bash and zsh the information about\
    \ the signal is not presented.\n\nIf you get a message like this, you have two\
    \ choices. You can kill the process and rerun it with input redirected, or you\
    \ can bring the process to the foreground, give it the input it needs, and then\
    \ let it continue as a foreground or background process. This chapter explains\
    \ how to handle either of these choices.\n\n# Moving a Foreground Process to the\
    \ Background\n\nIn addition to running a process in the background using &, you\
    \ can move a foreground process into the background. While a foreground process\
    \ runs, the shell does not process any new commands. Before you can enter any\
    \ commands, you have to suspend the foreground process to get a command prompt.\
    \ The suspend key on most UNIX systems is Ctrl+Z.\n\n![](img/3def70414996f811615f713b2077a154_123_0.png)\n\
    \n> You can determine which key performs which function by using the stty command.\
    \ By entering\n> \n> $ stty -a\n> \n> you are shown the following, along with\
    \ a lot of other information:\n> \n> intr = ^C; quit = ^\\; erase = ^H; kill =\
    \ ^U;\n>  eof = ^D; eol = ^@; susp = ^Z;\n>  eol2 = ^0; start = ^Q; stop = ^S;\
    \ susp = ^Z;\n>  dsusp = ^Y; reprint = ^R\n>  discard = ^O; werase = ^W; lnext\
    \ = ^V\n> \n> The entry after susp (^Z in this example) is the key that suspends\
    \ a foreground process. The character - stands for Ctrl. If Ctrl-Z does not work\
    \ for you, use the stty command as shown previously to determine the key for your\
    \ system."
  merge: -1
  img_proc: true
- pgno: 124
  md: 'When a foreground process is suspended, a command prompt enables you to enter
    more commands; the original process is still in memory but is not getting any
    CPU time. To resume the foreground process, you have two choices—background and
    foreground. The bg command enables you to resume the suspended process in the
    background while the fg command returns it to the foreground. This section covers
    the bg command, whereas the fg command is covered in the next section.


    For example, say you start a long-running process, in this case long_running_process:


    ```

    $ long_running_process

    ```


    While it is running, you decide that it should run in the background so your terminal
    is not tied up. To do that, you press the Ctrl+Z keys and see the following (the
    `Z is your Ctrl+Z keys being echoed):


    ```

    ^Z[1] + Stopped (SIGTSTP)    long_running_process

    $

    ```


    You are told the job number (1) and that the process is Stopped, then you get
    a prompt. The actual message might be different depending on the shell you are
    using. To resume a job in the background, you enter the bg command as follows:


    ```

    $ bg

    [1]   long_running_process &

    $

    ```


    As a result, the process runs in the background. Note the last character on the
    second line, the ampersand (&). As a reminder, the shell displays the ampersand
    there to remind you that the job is running in the background. It behaves just
    like a command where you type the ampersand at the end of the line.


    By default, the bg command moves the most recently suspended process to the background.
    You can have multiple processes suspended at one time. To differentiate them,
    you can use the job number prefixed with a percent sign (%) on the command line.


    In the following example, you start two long-running processes, suspend both of
    them, and put the first one into the background. The next few lines show starting
    and suspending two foreground processes:


    ```

    $ long_running_process

    ^Z[1] + Stopped (SIGTSTP)    long_running_process

    $ long_running_process2

    ^Z[2] + Stopped (SIGTSTP)    long_running_process2

    $

    ```


    To move the first one to the background, you use the following:


    ```

    $ bg %1

    [1]   long_running_process &

    $

    ```'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'The second process is still suspended and can be moved to the background as
    follows:


    ```

    $ bg %2

    [2] long_running_process2 &

    $

    ```


    The capability to specify which job to perform an action on (move to foreground
    or background for instance) shows the importance of having job numbers assigned
    to background processes.


    # Moving a Background Process to the Foreground (fg Command)


    When you have a process that is in the background or suspended, you can move it
    to the foreground with the fg command. By default, the process most recently suspended
    or moved to the background moves to the foreground. You can also specify the job
    using its job number.


    > If you''re ever in doubt about which job will be moved to the background or
    foreground, don''t guess. Put the job number on the bg or fg command, preceded
    with a percent sign.


    Using the long-running process in the previous section, a foreground process is
    suspended and moved into the background in the following example:


    ```

    $ long_running_process

    ^Z[1] + Stopped (SIGTSTP)    long_running_process

    $ bg

    [1] long_running_process &

    $

    ```


    # Keeping Background Processes Around (nohup Command)'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'just add it before the command you actually want to run. Because nohup is designed
    to run when there is no terminal attached, it wants you to redirect output to
    a file. If you do not, nohup redirects it automatically to a file known as nohup.out.


    Running a process in the background with nohup looks like the following:


    ```

    $ nohup ls &

    [1] 6695

    $ Sending output to nohup.out

    ```


    Because you did not redirect the output from nohup, it is automatically redirected
    for you. If you redirected the output, you would not see the second message. After
    waiting a few moments and pressing Enter, you would see the following:


    ```

    [1] + Done             nohup ls &

    $

    ```


    # Waiting for Background Processes to Finish (wait Command)


    There are two ways to wait for a background process to finish before doing something
    else. You can press the Enter key every few minutes until you get the completion
    message, or you can use the wait command.


    There are three ways to use the wait command—with no options (the default), with
    a process ID, or with a job number prefixed with a percent sign. The command will
    wait for the completion of the job or process you specify.


    If you do not specify a job or process (the default setting), the wait command
    waits for all background jobs to finish. Using wait without any options is useful
    in a shell script that starts a series of background jobs. When they are all done,
    it can continue processing.


    With the ls command from the previous example running, you can force a wait with
    the following command:


    ```

    $ wait %1

    ```


    You cannot enter another command until job number 1 finishes. When you use wait,
    you do not get the completion message.


    # Listing and Terminating Processes


    You can start processes in the foreground and background, suspend them, and move
    them between the foreground and background, but how do you know which commands
    are running? There are two commands to help you find out—jobs and ps.'
  merge: -1
  img_proc: true
- pgno: 127
  md: "# jobs\n\nThe jobs command shows you the processes that are suspended and the\
    \ ones running in the background. Because jobs runs as a foreground process, it\
    \ cannot show you active foreground processes. In the following example, you have\
    \ three jobs—the first one (job 3) is running, the second (job 2) is suspended\
    \ (a foreground process after Ctrl-Z was issued), and the third one (job 1) is\
    \ stopped in the background waiting for keyboard input:\n\n```\n$ jobs\n[3] +\
    \ Running        first_one &\n[2]  - Stopped (SIGTSTP)  second_one\n[1]   Stopped\
    \ (SIGTTIN)   third_one &\n```\n\nYou can manipulate these jobs with the fg and\
    \ bg commands. The most recent job is job number 3 (shown with a plus sign); this\
    \ is the one that fg or bg act on if no job number is supplied. The most recent\
    \ job before that is job number two (shown with a minus sign).\n\n![](img/3def70414996f811615f713b2077a154_127_0.png)\n\
    \n> The reason for the plus and minus symbols on the jobs listing is that job\
    \ numbers are reassigned when one completes and another starts. In the previous\
    \ example, if job number 2 finishes and you start another job, it is assigned\
    \ job number 2 and a plus sign because it is the most recent job.\n\n# ps Command\n\
    \nAnother command that shows all processes running is the ps (short for process\
    \ status) command. By default, it shows those processes that you are running.\
    \ It also accepts many options, a few of which are described here.\n\nThe simplest\
    \ example (with the same three jobs running as the previous example) is the ps\
    \ command alone:\n\n```\n$ ps\n  PID TTY      TIME CMD\n 6738 pts/6    0:00 first_one\n\
    \ 6739 pts/6    0:00 second_one\n 3862 pts/6    0:00 ksh\n 9865 pts/6    0:00\
    \ ps\n 6770 pts/6    0:01 third_one\n```\n\nFor each running process, this provides\
    \ five pieces of information: the pid, the TTY (terminal running this process),\
    \ the time or amount of CPU consumed by this process, and the command name running.\
    \ Although you are running three jobs, you have five processes. Of course, one\
    \ of the extra processes is the ps command itself. The remaining process, ksh,\
    \ is the shell."
  merge: -1
  img_proc: true
- pgno: 128
  md: 'If you are using BSD or older versions of Linux, your output will be similar
    to the following:


    ```

    $ ps

    PID TT STAT TIME COMMAND

    13849 q0 Ss 0:00:06 -ksh (ksh)

    13190 q0 R+ 0:00:01 ps

    ```


    For each running process, this provides you with five pieces of information: the
    pid, the TT (terminal running this process), STAT (the state of the job), the
    TIME or amount of CPU consumed by this process, and finally the command name running.


    One of the most commonly used flags for ps is the -f (short for full) option,
    which provides more information as shown in the following example:


    ```

    $ ps -f

    UID PID PPID C STIME TTY TIME CMD

    dhovath 6738 3662 0 16:23:03 pts/6 0:00 first_one

    dhovath 6739 3662 0 16:22:54 pts/6 0:00 second_one

    dhovath 3853 3657 0 10:19:53 pts/6 0:00 ksh

    dhovath 6892 3662 4 10:51:50 pts/6 0:00 ps -f

    dhovath 6770 3662 2 16:35:45 pts/6 0:03 third_one

    ```


    Table 7.1 shows the meaning of each of these columns. The BSD or Linux equivalent
    of the -f option is -ux. The column heading in BSD and Linux might be slightly
    different than those described in Table 7.1.


    # TABLE 7.1 ps -f Columns


    | Heading | Description |

    |---|---|

    | UID | User ID that this process belongs to (the person running it). |

    | PID | Process ID. |

    | PPID | Parent process ID (the ID of the process that started it). |

    | C | CPU utilization of process. |

    | unlabeled | Nice value—used in calculating process priority. |

    | STIME | Process start time (when it began). |

    | CMD | The command that started this process. CMD with -f is different from CMD
    without it; it shows any command-line options and arguments. |


    Note that the PPID of all the commands is 3662, which is the pid of the ksh instance
    that is executing. Because all of the processes were started in ksh, it is the
    parent process for all of these processes.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '> You might be wondering why TIME changed for third_one. Between the time I
    entered the ps and the ps -r commands, third_one used some CPU time—two seconds.
    On larger UNIX servers, a lot of work can be done with very little CPU time. That''s
    why the ps command is showing with zero CPU time; it used time, but not enough
    to round up to one second.


    ![](img/3def70414996f811615f713b2077a154_129_0.png)


    Two more common options are -e (short for every) and -u (short for user). The
    -e option is handy if you want to see whether the database is running or whether
    someone is playing Zork (an old text-based computer game). The BSD and Linux equivalent
    of the -e option is the -a option. Because so many processes run on a busy system,
    it is common to pipe the output of ps -e or ps -a to a text filter like grep (see
    Chapter 15, “Text Filters”).


    The -u option is handy if you want to see what a specific user is doing—are they
    busy or do they have time to chat; is your boss busy or checking to make sure
    you''re not playing Zork? With -u, you specify the user you want to list after
    the -u. The BSD or Linux equivalent of the -u option is the -U option.


    # Killing a Process (kill Command)


    Another handy command to use with jobs and processes is the kill command. As the
    name implies, the kill command kills, or terminates, a process. Just like the
    fg and bg commands, the job number is prefixed with a percent sign. To kill job
    number 1 in the earlier example regarding waiting for keyboard input, you can
    use the following:


    ```

    $ kill %1

    [1] - Terminated    third_one &

    $

    ```


    You can also kill a specific process by specifying the pid on the command line
    without the percent sign used with job numbers. To kill job number 2 (process
    6738) in the earlier example using process ID, you can use the following:


    ```

    $ kill 6738

    $

    ```


    # Parent and Child Processes


    In the ps -f example in the ps command section, each process has two ID numbers
    assigned to it: process ID (pid) and parent process ID (ppid). Each user process
    in the system has a parent process. Most commands that you execute have the shell
    as their parent. The parent of your shell is usually the operating system or the
    terminal communications process (for example, in.telnetd for telnet connections).'
  merge: -1
  img_proc: true
