    # Aliases Versus Functions


    An alias is an abbreviation or an alternative name, usually mnemonic, for a command.
    Aliases were first introduced in csh and were later adopted by ksh, bash, and
    zsh. They are not supported in the Bourne shell.


    Aliases are defined using the alias command:


    ```

    alias name=''cmd''

    ```


    Here name is the name of the alias and cmd is the command to execute when name
    is specified. Aliases are similar to functions in that they associate a command
    with a name. Two key differences are


    +   - In an alias, cmd cannot be a compound command or a list.

    +   - In an alias, there is no way to manipulate the argument list ($0).


    Due to their limited capabilities, aliases are not commonly used in shell programs.
    They are discussed here for the sake of completeness.


    As an example, the following command defines the alias ls1 and specifies that
    the command ls -l should be executed when the command ls1 is specified:


    `alias ls1=''ls -l''`


    This alias is equivalent to the function:


    `ls1 () { ls -l $0 ; }`


    A common use for aliases is to specify a default set of options to a command.
    For example, say you have the following alias:


    `alias ls*=''ls -a''`


    When the ls command is given, the shell executes ls -a instead of plain ls without
    options. It is possible to mimic this behavior with a function such as:


    `name () { path $0* ; }`'
