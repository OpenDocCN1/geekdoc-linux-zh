- pgno: 388
  md: 'If you need to reuse the script for a different program, for example a Web
    server, you could simply make a copy of the script as follows:


    ```

    # cd /sbin/init.d

    # cp sshd httpd

    ```


    This assumes that the script is stored in the directory /sbin/init.d and that
    the name you want to give the Web servers startup script is httpd. The actual
    location of startup scripts differs from system to system as discussed previously.
    Once you have a copy, you can modify just the variable definitions for $PGM and
    $PGM_OPTS as follows:


    ```

    PGM=/usr/local/bin/httpd

    PGM_OPTS=-DSSL

    ```


    This assumes that the Web server named httpd is located in /usr/local/bin and
    that it needs to be started with the -DSSL option. After making this modification,
    you can start the Web server as follows:


    ```

    # /sbin/init.d/httpd start

    ```


    To stop it, you can do the following:


    ```

    # /sbin/init.d/httpd stop

    ```


    All that would remain is to make the start and stop links in the appropriate run-level
    directories. Usually the start link is in the rc3.d directory, whereas the stop
    link is in the rc5.d and rc6.d directories (except on Linux where it is only in
    the rc6.d directory).


    You can create these links as follows:


    ```

    # cd /sbin/rc3.d && ln -s ../init.d/httpd S98httpd

    # cd /sbin/rc5.d && ln -s ../init.d/httpd K02httpd

    # cd /sbin/rc6.d && ln -s ../init.d/httpd K02httpd

    ```


    The actual directories where the links need to be created are system-dependent
    as discussed previously. As an example, the commands that might be used on Solaris
    are


    ```

    # cd /etc/rc3.d && ln -s ../init.d/httpd S99httpd

    # cd /etc/rc5.d && ln -s ../init.d/httpd K20httpd

    # cd /etc/rc6.d && ln -s ../init.d/httpd K20httpd

    ```


    On Linux you need something like the following:


    ```

    # cd /etc/rc.d/rc3.d && ln -s ../init.d/httpd S98httpd

    # cd /etc/rc.d/rc6.d && ln -s ../init.d/httpd K02httpd

    ```


