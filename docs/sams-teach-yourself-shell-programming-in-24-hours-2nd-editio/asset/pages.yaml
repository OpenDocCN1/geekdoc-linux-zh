- pgno: 83
  md: '# Summary


    In this chapter, we have looked at working with directories. Specifically, the
    following topics were covered:


    +   - Working with filenames and pathnames

    +   - Switching directories

    +   - Listing files and directories

    +   - Creating directories

    +   - Copying and moving directories

    +   - Removing directories


    We reviewed each of these topics because it is important to know how to perform
    these functions when writing shell scripts. As you go further into this book,
    you will begin to see that directory manipulations occur quite frequently in shell
    scripts.


    # Questions


    1. Which of the following are absolute pathnames? Which are relative?


    +   a. /usr/local/bin

    +   b. .././home/ranga

    +   c. docs/book/ch01

    +   d. /


    2. What is the output of the pwd command after the following sequence of cd commands
    have been issued?

    ```

    $ cd /usr/local

    $ cd bin

    $ cd .././tmp

    $ cd

    ```


    3. What command should be used to copy the directory /usr/local to /opt/pgms?


    4. What command(s) should be used to move the directory /usr/local to /opt/pgms?


    5. Given the following listing for the directory backup, can the rmdir command
    be used to remove this directory? If not, please give a command that can be used.

    ```

    $ ls -a backup

    ./  ../  sysbak-988322  sysbak-988112

    ```'
