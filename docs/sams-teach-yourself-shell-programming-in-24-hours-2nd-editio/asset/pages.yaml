- pgno: 294
  md: '# TABLE 17.3 Assignment Operators in awk


    | Operator | Description |

    |---|---|

    | += | Add |

    | -= | Subtract |

    | *= | Multiply |

    | /= | Divide |

    | %= | Modulo (Remainder) |

    | ^= | Exponentiation |


    Using an assignment operator is shorthand for writing a numeric expression of
    the form: name=name operator num


    Many programmers prefer using the assignment operators because they are slightly
    more concise than a regular numeric expression.


    # The Special Patterns: BEGIN and END


    In the previous example, the awk command


    ```

    awk '' { x++ ; print x ; } '' $1

    ```


    prints the value of x each time it is incremented. It would be much nicer if you
    could print the total number of empty lines. In order to accomplish this, you
    need to use the special patterns BEGIN and END.


    Recall that the general syntax of a command in an awk script is


    ```

    /pattern/ { actions }

    ```


    Usually pattern is a regular expression, but you can also use two special patterns,
    BEGIN and END. Taking these patterns into account, the general form of an awk
    command is


    ```

    awk ''

    BEGIN { actions }

    /pattern/ { actions }

    /pattern/ { actions }

    END { actions }

    '' files

    ```


    When the BEGIN pattern is specified, awk executes its actions before reading any
    input. When the END pattern is specified, awk executes its actions before it exits.
    When these patterns are given the execution of an awk, the script is as follows:


    +   1. If a BEGIN pattern is present, it executes the actions it specifies.

    +   2. Reads an input line and parses it into fields.'
  merge: -1
  img_proc: true
- pgno: 295
  md: "+   3. Compares each of the specified patterns against the input line, until\
    \ it finds a match. When it does find a match, the script executes the actions\
    \ specified for that pattern. This step is repeated for all available patterns.\n\
    +   4. Repeats steps 2 and 3 while input lines are present.\n+   5. After the\
    \ script reads all the input lines, if the END pattern is present, it executes\
    \ the actions that the pattern specifies.\n\nThe BEGIN pattern must be the first\
    \ pattern that is specified, and the END pattern must be the last pattern that\
    \ is specified. Between the BEGIN and END patterns you can have any number of\
    \ awk commands of the form:\n`/pattern/ { action ; }`\n\nBoth BEGIN and END are\
    \ optional. If a program consists of only a BEGIN pattern, awk does not read files.\n\
    \nTo solve this problem, you can use the END pattern to print the value of x.\
    \ The modified uris.sh script is as follows:\n\n```\n```sh\n#!/bin/sh\nfor i in\
    \ $*\ndo\n  if [ -f \"$i\" ] ; then\n    echo \"$i\\c\"\n    awk '\n      /^ */\
    \ { x++ ; next; }\n      END { printf \"%s\\n\",x; }\n      ' \"$i\"\n  else\n\
    \    echo \"ERROR: $i not a file.\" >&2\n  fi\ndone\n```\n```\n\nNow the output\
    \ looks like\n\n$ ./uris.sh uris.txt\nuris.txt 4\n\nIf the output on your system\
    \ looks like the following:\n\nuris.txt\\c\n4\n\ninstead of as shown, you will\
    \ need to replace the following line in the script:\necho \"$i\\c\"\nwith the\
    \ line:\necho -n \"$i\""
