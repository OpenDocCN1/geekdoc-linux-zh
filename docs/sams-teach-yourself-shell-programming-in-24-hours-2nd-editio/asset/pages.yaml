- pgno: 375
  md: '# Startup Scripts


    A common task for many shell programmers is writing system startup scripts. In
    this section, you will develop a basic system startup script that can be reused
    (after a little editing). Before you begin, let''s look at a little background
    into the UNIX system startup and initialization.


    # System Startup


    When a UNIX system starts, the first program to be executed is init (usually located
    in /sbin). This program is responsible for system startup and initialization.
    In early versions of UNIX, init was aided in this by the script /etc/rc. This
    script handled all of the nitty-gritty details of system initialization such as
    checking the disks, starting the networking layers, and enabling console and remote
    login programs.


    When a system administrator wanted to enable additional services at system startup,
    he or she had to edit /etc/rc to include the commands required to start the system.
    This method had two problems:


    +   - A typo or mistake in /etc/rc could render the system unbootable and might
    require many hours or days to recover.

    +   - An upgrade of the system software might overwrite /etc/rc, causing the system
    administrator to lose all the modifications.


    In order to solve these two problems, BSD introduced a secondary startup script,
    /etc/rc.local, that contained all of the system-specific startup commands. This
    script was never upgraded by updates to the system software and the system would
    boot correctly even if this script contained errors. Although rc.local solved
    these two problems, there were still other problems:


    +   - There was no easy way to stop all the running programs in a clean way during
    system shutdown.

    +   - Software vendors could not easily integrate their programs into the system
    startup or shutdown. If a software vendor provided a program that needed to start
    up at boot time, they were stuck having to edit the rc.local script in their software
    installation scripts, an error-prone operation.

    +   - There was no way to enforce startup and shutdown dependencies; if program
    B depended on program A starting up first, the system administrator had to manually
    sequence the commands in rc.local so that this dependency was enforced.

    +   - There was no way to limit the number of programs that were started when
    the system booted; there was no way to boot the system into a limited maintenance
    mode.'
  merge: -1
  img_proc: true
- pgno: 376
  md: '# AT&T System V System Initialization


    When AT&T released System V UNIX, they fixed these problems by introducing a new
    system initialization infrastructure based on init scripts and run-levels.


    Init scripts were simple scripts, originally stored in /sbin/init.d, that were
    responsible for starting and stopping a single program. Every program that was
    to be started at boot time had an init script, which made it easy for system administrators
    to maintain along with providing an easy method for software vendors to integrate
    their programs into a system''s startup process. Because the init scripts were
    also responsible for stopping programs, they could be used to stop processes cleanly
    during system shutdown. Later in this section you will be developing an init script.


    Run-levels partitioned the system startup into seven levels (zero through six)
    and provided a method for enforcing startup dependencies and partitioning the
    startup of system services into the different levels. Each of the run-levels had
    a specific purpose and made it possible to implement a limited maintenance mode
    along with a shutdown mode. The different run-levels are described in Table 22.1.


    # TABLE 22.1 Run-Levels


    | Run-level | Name | Description |

    |---|---|---|

    | 0 | Halt | Used for shutting down a system and powering it off (if supported
    by the hardware). |

    | 1 | Single-User | A limited maintenance mode for performing backups, upgrades,
    and other maintenance activities. Run-level 1 can only be used by the super-user
    root (uid 0). |

    | 2 | Multi-User | The system starts all the programs necessary for supporting
    multiple users along with basic network services. |

    | 3 | Networked Multi-User | The system starts any additional network programs
    such as Web servers, FTP servers, and mail servers. Most systems are usually used
    at this run-level. |

    | 4 | Unused | This run-level is currently unused except on HP-UX where it is
    used to launch the windowing environment HP VUE. |

    | 5 | Graphical Multi-User or Halt | On Linux systems this run-level is used to
    automatically start the X11 windowing environment. On Solaris and other systems,
    it is used to halt the system and power it off (if supported by the hardware).
    |

    | 6 | Reboot | Used to reboot the system. |'
  merge: -1
  img_proc: true
- pgno: 377
  md: '# Run-Level 5 on Solaris


    In addition to the run-levels covered in Table 22.1, Solaris includes an extra
    run-level known as run-level 5. Run-level 5 is the Solaris equivalent of run-level
    1 and is used to put the system into single-user mode.


    # How Init Scripts Work


    Each run-level has a corresponding directory. The run-level directories are located
    in /sbin and have names of the form rcLvL.d, where LvL is an integer (0-6) corresponding
    to a particular run-level. Each directory contains specially named links to the
    init scripts from /sbin/init.d appropriate for that run-level. The links are named
    as follows:


    +   - SXXName—Corresponds to a startup script. Known as start scripts.

    +   - KYYName—Corresponds to a shutdown script. Known as stop scripts.


    In both cases, XX and YY are numbers from 00 to 99 and name is the name of the
    init script that this link corresponds to. The number, XX, allows startup and
    shutdown dependencies to be enforced via script names, because scripts with smaller
    numbers will be executed before scripts with larger numbers. In general, YY should
    be equal to 100 – XX. This allows for programs to be shut down in the reverse
    order of the startup sequence, thus enforcing shutdown dependencies.


    As an example, the start script link in rc3.d for the secure shell daemon (SSH)
    might look like the following:


    ```

    $ ls -l /sbin/init.d/S99sshd

    lrwxr-xr-x 1 root wheel 14 Jun 5 18:47 /sbin/rc3.d/S99sshd ->

    /sbin/init.d/sshd

    ```


    The corresponding shutdown script in rc5.d and rc6.d might look like the following:


    ```

    $ ls -l /sbin/rc5.d/K01sshd /sbin/rc6.d/K01sshd

    lrwxr-xr-x 1 root wheel 14 Jun 5 18:47 /sbin/rc5.d/K01sshd ->

    /sbin/init.d/sshd

    lrwxr-xr-x 1 root wheel 14 Jun 5 18:47 /sbin/rc6.d/K01sshd ->

    /sbin/init.d/sshd

    ```


    When a particular run-level is reached, all of the scripts that start with K (stop
    scripts) are executed with the argument stop. Then all of the scripts that start
    with S (start scripts) are executed with the argument start. This defines the
    basic interface for every init script: it must accept and understand the arguments
    start and stop:


    ```

    script [ start | stop ]

    ```'
  merge: -1
  img_proc: true
- pgno: 378
  md: "When the system first starts, it is at run-level 1. It starts by executing\
    \ all of the stop scripts in the `/sbin/rc1.d` directory followed by all of the\
    \ start scripts in that directory. Once all of the scripts in the directory corresponding\
    \ to run-level 1 have been executed, the scripts in the directory corresponding\
    \ to run-level 2 are executed with the argument start followed by the scripts\
    \ in run-level 3. When all of the scripts in run-level 3 finish executing, the\
    \ system is ready for general use.\n\nWhen the system is shut down and powered\
    \ off or halted, the scripts in the directory `/sbin/rc5.d` are executed. When\
    \ the system is rebooted, the scripts in the directory `/sbin/rc6.d` are executed.\n\
    \n# Platform Variations\n\nWith the exception of BSD, UNIX vendors readily adopted\
    \ AT&T's initialization infrastructure. BSD still continues to use the system\
    \ based on the files `/etc/rc` and `/etc/rc.local`.\n\nHewlett-Packard adopted\
    \ it in HP-UX 10.0 and uses it with a slight modification. In HP-UX init scripts\
    \ are still stored in the directory `/sbin/init.d` and the run-level directories\
    \ are still named `/sbin/rc?.d`, but the start and stop scripts have three digits\
    \ `XXX` or `YYY`, as opposed to just two digits, `XX` or `YY`. Thus on HP-UX `YYY`\
    \ should be equal to `1000 - XXX`.\n\nSun Microsystems adopted it in Solaris 2.0\
    \ (SunOS 5.0) and modified it to suit its needs. In Solaris the init scripts are\
    \ stored in the directory `/etc/init.d` and the run-level directories are named\
    \ `/etc/rc?.d`.\n\nLinux also adopted a modified AT&T style initialization. In\
    \ Linux the init scripts are stored in `/etc/rc.d/init.d` and the run-level directories\
    \ are named `/etc/rc.d/rc?.d`. Linux has also changed the meaning associated with\
    \ run-level 5; rather than use this run-level for halting and powering down the\
    \ system, it is used to start the processes required for the graphical windowing\
    \ environment (X11). Linux also retains some vestiges of BSD, as it still uses\
    \ the file `rc.local` (relocated to the directory `/etc/rc.d`).\n\n> **BSD Might\
    \ Eventually Adopt System V Initialization**\n> \n> Although BSD had avoided adopting\
    \ System V style initialization for more than a decade, there are rumblings of\
    \ a change. An initiative known as the NetBSD rc.d System was introduced by the\
    \ NetBSD Foundation during the summer of 2001. More information on this initiative\
    \ can be found in the following paper:\n> \n> http://www.cs.rmit.edu.au/~luken/papers/rc.d.pdf"
  merge: -1
