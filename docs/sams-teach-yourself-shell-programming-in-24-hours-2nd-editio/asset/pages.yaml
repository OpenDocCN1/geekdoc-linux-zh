- pgno: 335
  md: 'as ;, which is the no-op command as you might recall. Because both forms produce
    the same result, feel free to use either one.


    As an example, we can update the uu script from Chapter 12 to ignore all signals
    by adding the following line at the beginning of the script:


    ```

    trap '''' 1 2 3 15

    ```


    # Ignoring Signals During Critical Operations


    If you specify a trap command such as


    ```

    trap '''' 1 2 3 15

    ```


    at the beginning of your script, the script will ignore all signals until it completes.
    From a programmer''s perspective, this seems like a good idea, but from the user''s
    perspective, it is not. The ideal method is to ignore signals during only the
    most critical sections of the script. This allows users to terminate the script
    while ensuring that critical operations are performed without interruption by
    signals.


    Let''s say we have a shell script with a shell function called DoImportantStuff()
    that should not be interrupted by a signal. In order to ensure that this function
    isn''t interrupted, you can install the signal handler before the function is
    called and reset it after the call finishes:


    ```

    ```bash

    trap '''' 1 2 3 15

    DoImportantStuff

    trap 1 2 3 15

    ```

    ```


    The second call to trap has only signal arguments. This causes trap to reset the
    handler for each of the signals to the default handler.


    # Setting Up a Timer


    In many scripts, there are critical sections where commands that require a large
    amount of time to complete are executed. On rare occasions, these commands might
    not finish processing. In order to deal with this situation, you need to set up
    a timer within the script. When the timer expires, the script should terminate
    and inform the user about the problem. In this section, you will look at a simple
    script that demonstrates the major aspects of setting up a timer using SIGALARM
    in conjunction with a signal handler.


    The main body of our script performs the following actions:


    +   1. Sets a handler for SIGALARM.

    +   2. Sets the timer.

    +   3. Executes the program.

    +   4. Waits for the program to finish executing.

    +   5. Unsets the timer.'
  merge: -1
  img_proc: true
- pgno: 336
  md: "If the timer expires before the program finishes executing, the handler for\
    \ SIGALARM should terminate the program.\n\nThe main body resembles the following:\n\
    \n```\n```bash\n# main()\ntrap AlarmHandler 14\nSetTimer 15\nSPROG &\nCHPROGIDS=\"\
    $CHPROGIDS $!\"\nwait $!\nUnsetTimer\necho \"All Done.\"\nexit 0\n```\n```\n\n\
    The only thing in the main body that was not mentioned previously is the CHPROGIDS\
    \ variable. This variable maintains a list of the PIDs of the processes started\
    \ by the script so that the signal handler for SIGALARM can terminate these processes.\n\
    \n# AlarmHandler\n\nNow let's look at the signal handler for SIGALARM, AlarmHandler:\n\
    \n```\n```bash\nAlarmHandler() {\n  echo \"Got SIGALARM, cmd took too long.\"\n\
    \  KillSubProcs\n  exit 14\n}\n```\n```\n\nThis is a simple function that prints\
    \ a message to the screen, calls the function KillSubProcs, and exits with an\
    \ exit code of 14. This exit code is used to indicate that the alarm was triggered.\n\
    \nThe KillSubProcs function kills all the child processes of the script, which\
    \ are stored in the variable CHPROGIDS:\n\n```\n```bash\nKillSubProcs() {\n  kill\
    \ ${CHPROGIDS:-$!}\n  if [ $? -eq 0 ]; then\n    echo \"Sub-processes killed.\"\
    \n  fi\n}\n```\n```\n\nThis is a simple function that prints a message to the\
    \ screen, calls the function KillSubProcs, and exits with an exit code of 14.\
    \ This exit code is used to indicate that the alarm was triggered."
  merge: -1
  img_proc: true
- pgno: 337
  md: "The KillSubProcs function kills all the child processes of the script, which\
    \ are stored in the variable CHPROCSIDS:\n\n```\nKillSubProcs() {\n  kill $CHPROCSIDS\n\
    \  if [ $? -eq 0 ] ; then\n    echo \"Sub-processes killed.\"\n  fi\n}\n```\n\n\
    # SetTimer\n\nOnce the signal handler for SIGALARM is in place, we need a function\
    \ that sets up the timer. The function we are using is SetTimer:\n\n```\nSetTimer()\
    \ {\n  DEF_TOUT=${1:-10}\n  if [ $DEF_TOUT -ne 0 ] ; then\n    sleep $DEF_TOUT\
    \ & kill -s 14 $$\n    CHPROCSIDS=$CHPROCSIDS $!\n    TIMERPROC=$!\n  fi\n}\n\
    ```\n\nThis function takes a single argument that indicates the number of seconds\
    \ the timer should be set. The default is 10 seconds.\n\nThe timer itself is fairly\
    \ trivial; it is just the command\nsleep $DEF_TOUT & kill -s 14 $$\nexecuting\
    \ in the background. This command uses sleep to wait for some period of time (stored\
    \ in $DEF_TOUT), after which, it uses kill to send the script SIGALRM (recall\
    \ that the PID of the script is stored in $$).\n\nBecause the timer runs in the\
    \ background, we need to update the list of child processes, $CHPROCSIDS, with\
    \ its PID. We also save the PID of the timer in $TIMERPROC so that we can use\
    \ it later when we need to unset the timer.\n\n# UnsetTimer\n\nFinally, we need\
    \ a function to unset the timer started by SetTimer. The UnsetTimer function does\
    \ this by using kill to terminate the timer (SetTimer saved the PID of the timer\
    \ in $TIMERPROC):\n\n```\nUnsetTimer() {\n  kill $TIMERPROC\n}\n```"
