- pgno: 379
  md: "# Developing an Init Script\n\nAs discussed previously, the basic interface\
    \ for an init script is `script [ start | stop ]`\n\nYou will start by creating\
    \ a script for the secure shell daemon (SSH) that implements this interface and\
    \ then adds several improvements to enhance the functionality of the script. Once\
    \ you have the completed script, this section highlights the changes necessary\
    \ to adapt the script for a different program.\n\nFor the purposes of this section,\
    \ assume that your init script is named sshd and is stored in /sbin/init.d. The\
    \ actual location for startup scripts is system-dependent, as discussed previously.\n\
    \n# The Basic Script\n\nThe following script implements the basic start and stop\
    \ interface:\n\n```\n#!/bin/sh\n\nPGM=/usr/local/sbin/sshd\nPGM_OPTS=\n\ncase\
    \ \"$1\" in\n  start) $PGM $PGM_OPTS ;;\n  stop) /bin/ps -ef | grep \"$PGM\" |\
    \ grep -v grep | \\\n        awk '{ print $2; }' | xargs kill 2> /dev/null\n \
    \       ;;\nesac\n\nexit 0\n```\n\nAt the beginning of the script, you define\
    \ two variables, $PGM and $PGM_OPTS. The variable $PGM contains the full path\
    \ to the program to start (in this case /usr/local/sbin/sshd); whereas the variable\
    \ $PGM_OPTS contains any additional options or arguments that might need to be\
    \ specified to the program.\n\nThe case statement that follows the variable definitions\
    \ evaluates the argument supplied to the script. If the argument starts, the program\
    \ stored in $PGM is executed as follows: *$PGM $PGM_OPTS\n\nIf the argument stops,\
    \ the program stops using the following compound command: /bin/ps -ef | grep \"\
    $PGM\" | grep -v grep | awk '{ print $2; }' | xargs kill 2> /dev/null\n\nBasically\
    \ this command uses grep to look through the output of ps for all the entries\
    \ that match the string stored in $PGM. It then ignores any entries that both\
    \ $PGM and"
  merge: -1
  img_proc: true
- pgno: 380
  md: "grep. Then it extracts the process IDs for these processes using awk and uses\
    \ kill to terminate these processes\n\nAlthough the basic script is serviceable,\
    \ there are a few problems that you need to solve in order to make it much more\
    \ usable:\n\n+   - The script has no error reporting when the program stored in\
    \ $PGM does not exist or is not executable.\n+   - The script has no error reporting\
    \ when the program stored in $PGM is already running.\n+   - No usage information\
    \ is supplied if an invalid argument (or no arguments) is supplied to the script.\n\
    \nTo solve the first and second problems, you can change the start clause of the\
    \ case statement to the following:\n\n```\nstart)\nif [ ! -x \"$PGM\" ] ; then\n\
    \    echo \"Error: Not executable: $PGM\" 1>&2\n    exit 1\nfi\nRUNNING=`/bin/ps\
    \ -ef | grep \"$PGM\" | grep -v grep | head`\nif [ -n \"$RUNNING\" ] ; then\n\
    \    echo \"Error: Already running: $PGM\" 1>&2\n    exit 1\nfi\n\"$PGM\" $PGM_OPTS\n\
    ;;\n```\n\nAs you can see, the start clause now includes two if statements that\
    \ perform the necessary error checking. First, you verify if the program is executable\
    \ using the -x file test option. If it is not executable (or does not exist),\
    \ an error message is reported and the script exits. Otherwise, the script proceeds\
    \ to the next step in the error checking.\n\nIn order to check if the program\
    \ is already running, you use the following compound command:\n\n`RUNNING=`/bin/ps\
    \ -ef | grep \"$PGM\" | grep -v grep | head``\n\nIf the program is already running,\
    \ the value of the variable RUNNING will contain the output of ps for at least\
    \ one instance of the program. Otherwise RUNNING will be null. You use the -z\
    \ option to check the variable RUNNING; if it is not null an error message is\
    \ reported."
  merge: -1
  img_proc: true
- pgno: 381
  md: "The final part of the start clause is unchanged; you simply execute the program\
    \ as follows:\n\n```\n*SPQM* SPQM_OPTS\n```\n\nTo solve the third problem, you\
    \ can simply add a default clause to the case statement:\n\n```\n* ) echo 'Usage:\
    \ $0 [ start | stop ]' ; ;\n```\n\nBy incorporating these changes, the script\
    \ now looks like the following:\n\n```\n#!/bin/sh\n\nPGM=/usr/local/sbin/sshd\n\
    PGM_OPTS=\n\ncase \"$1\" in\nstart)\n  if [ ! -x \"$PGM\" ] ; then\n    echo 'Error:\
    \ Not executable: $PGM' 1>&2\n    exit 1\n  fi\n\n  RUNNING=`/bin/ps -ef | grep\
    \ \"$PGM\" | \\\n    grep -v grep | head -1`\n  if [ -n \"$RUNNING\" ] ; then\n\
    \    echo 'Error: Already running: $PGM' 1>&2\n    exit 1\n  fi\n\n  \"$PGM\"\
    \ $PGM_OPTS\n  ;;\nstop)\n  /bin/ps -ef | grep \"$PGM\" | grep -v grep | \\\n\
    \  awk '{ print $2 }' | xargs kill 2>/dev/null\n  ;;\n*) echo 'Usage: $0 [ start\
    \ | stop ]' \n  exit 1\n  ;;\nesac\n\nexit 0\n```\n\n# Problems with ps\n\nOne\
    \ issue with this script resides in the use of the ps command. As you might recall\
    \ from Chapter 7, \"Processes,\" the options understood by ps differ among systems.\
    \ This script used the Solaris style -ef options. Linux and BSD systems do not\
    \ always support these options, so on those systems you need to use the auxww\
    \ options instead. This script should be able to detect the type of system it\
    \ is being executed on and adapt appropriately."
  merge: -1
  img_proc: true
- pgno: 382
  md: "You can use the uname -s command to detect the system type, and then use a\
    \ case statement to modify the options in the ps command:\n\n```\n```sh\ncase\
    \ `uname -s` in\nLinux|Darwin|BSD) PS=\"/bin/ps auxwx\" ;;\n*) PS=\"/bin/ps -ef\"\
    \ ;;\nesac\n```\n```\n\nThis case statement evaluates the output of the uname\
    \ -s command. If the output is Linux, Darwin (MacOS X), or some version of BSD,\
    \ the variable ps is set as follows:\n\n```\n```sh\nPS=\"/bin/ps auxwx\"\n```\n\
    ```\n\nOtherwise it defaults to a Solaris style value:\n\n```\n```sh\nPS=\"/bin/ps\
    \ -ef\"\n```\n```\n\n![](img/3def70414996f811615f713b2077a154_382_0.png)\n\n>\
    \ > The uname command is discussed in detail in the next chapter. For the purposes\
    \ of this chapter it is sufficient to know that the uname -s command outputs the\
    \ system type.\n\nNow all that remains is to change the start and stop clauses\
    \ to use the value of $PS rather than calling ps directly:\n\n```\n```sh\nstart)\n\
    if [ ! -x \"$PGM\" ] ; then\n echo \"Error: Not Executable: $PGM\" 1>&2\nexit\
    \ 1\nfi\nRUNNING=`$PS | grep \"$PGM\" | grep -v grep | head`\nif [ -n \"$RUNNING\"\
    \ ] ; then\necho \"Error: Already running: $PGM\" 1>&2\nexit 1\nfi\n\"$PGM\" $PGM_OPTS\n\
    ;;\nstop)\n$PS | grep \"$PGM\" | grep -v grep | \\\nawk '{ print $2 ; }' | xargs\
    \ kill\n;;\n```\n```\n\nThe complete script, incorporating all of these changes,\
    \ is as follows:\n\n```\n```sh\n#!/bin/sh\nPGM=/usr/local/sbin/sshd\nPGM_OPTS=\n\
    ```\n```"
