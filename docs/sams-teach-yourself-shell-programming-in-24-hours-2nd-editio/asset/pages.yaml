  md: "This generates the following prompt:\n\n```\nWhat is your favorite fruit?\n\
    ```\n\nThe echo statement then displays the response:\n\n```\nYour favorite fruit\
    \ is apple.\n```\n\n# Checking Disk Space\n\nSystem administrators often use scripts\
    \ to keep apprised of the disk usage in certain essential directories. For example,\
    \ if the incoming mail or news directories were to fill up, users would not be\
    \ able to obtain new e-mail or news articles. The next two functions in this library\
    \ case the process of monitoring disk usage.\n\n# Determining Free Space\n\nThe\
    \ free space in a directory can be determined using the df -k (k as in kilobytes)\
    \ command. The output of this command is similar to the following:\n\n```\n$ df\
    \ -k\nFilesystem  1024-blocks  Used Available Capacity Mounted on\n/dev/hda1 \
    \  1190814    664866  413867   59%    /\n/dev/hda1   4128240   1578837  2235787\
    \  48%  /internal\n/dev/hd01   152567   681766  706759   47%  /store\n/dev/hda3\
    \   320886    72521   231034  24%  /tmp\n```\n\nWhen a directory or file is specified\
    \ as an additional argument, the output just contains information about the partition\
    \ where that directory or file is located:\n\n```\n$ df -k /home/ranga\nFilesystem\
    \  1024-blocks Used Available Capacity Mounted on\n/dev/hda1   1190814    664866\
    \  463867   59%    /\n```\n\nAs you can see, the output consists of a header followed\
    \ by information about the partitions on your system. The amount of free space\
    \ in a given partition is stored in the fourth column. This function uses awk\
    \ to retrieve this value.\n\n```\n# Name: getSpaceFree\n# Desc: Outputs the space\
    \ avail for a directory\n# Args: $1 -> The directory to check\n\ngetSpaceFree\
    \ () {\n  if [ $# -ge 1 ]; then\n    df -k $1 2>/dev/null | awk 'NR != 1 { print\
    \ $4; }'\n    return $?\n  fi\n  return 1\n}\n```"
