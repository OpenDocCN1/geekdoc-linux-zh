    +   - humor\n+   - images\n+   - index.html\n+   - misc\n+   - projects\n+   -\
    \ school\n\nNext, you need to sort the list by the date of the last access. This\
    \ can be accomplished by specifying the -ut (sort by last accessed time) option\
    \ of the ls command:\n\n```\n$ ls -lut /home/ranga/public_html\n```"
