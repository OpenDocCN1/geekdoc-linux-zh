  md: "Name:\nEmail: vathsa@oosland.us\nAddress:\nPhone: 408-444-4444\n\n# Adding\
    \ a Person\n\nOne of the most important things about any address book is the capability\
    \ to easily add information to it. If you need to edit the address book manually\
    \ to add information, you are bound to make errors such as forgetting to add a\
    \ colon to separate fields. By using a script, you can avoid such errors.\n\n\
    In this section you will look at the addperson script. It enables you to add entries\
    \ into the address book by either providing information interactively or by providing\
    \ information on the command line via command-line options. The script enters\
    \ interactive mode when no options are given. In non-interactive mode it tries\
    \ to obtain the necessary information from the command-line options.\n\nRegardless\
    \ of the mode, the script stores the user-provided information into the following\
    \ variables:\n\n+   - NAME stores the name given by the user.\n+   - EMAIL stores\
    \ the e-mail address given by the user.\n+   - ADDR stores the postal address\
    \ given by the user.\n+   - PHONE stores the phone number given by the user.\n\
    \nIn interactive mode, you prompt for the information in each record as follows:\n\
    \n```\n```bash\nprintf \"%-10s \" \"Name:\" ; read NAME\nprintf \"%-10s \" \"\
    Email:\" ; read EMAIL\nprintf \"%-10s \" \"Address:\" ; read ADDR\nprintf \"%-10s\
    \ \" \"Phone:\" ; read PHONE\n```\n```\n\nAfter each prompt, you read and store\
    \ the user's input, including spaces and special characters, inside the appropriate\
    \ variable. In non-interactive mode, you use getopts to scan the options:\n\n\
    ```\n```bash\nwhile getopts n:e:a:p: OPTION\ndo\n    case $OPTION in\n       \
    \ n) NAME=\"$OPTARG\" ;;\n        e) EMAIL=\"$OPTARG\" ;;\n        a) ADDR=\"\
    $OPTARG\" ;;\n        p) PHONE=\"$OPTARG\" ;;\n        ?) echo \"USAGE: $USAGE\"\
    \ >&2 ; exit 1 ;;\n    esac\ndone\n```\n```"
