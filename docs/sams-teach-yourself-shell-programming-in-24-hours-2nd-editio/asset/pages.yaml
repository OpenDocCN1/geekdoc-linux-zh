- pgno: 321
  md: '# The expr Command


    The expr command can be used to perform simple integer arithmetic. The general
    syntax of an expr command is


    `expr int1 op int2`


    Here, int1 and int2 are integers and op is one of the operators given in Table
    18.3. The spaces separating op from int1 and int2 are required.


    **TABLE 18.3 expr Operands**


    | Operand | Description |

    |---|---|

    | + | Addition |

    | - | Subtraction |

    | * | Multiplication |

    | / | Integer division (any fraction in the result is dropped) |

    | % | Remainder from a division operation (also called the modulus function) |


    Let''s look at a few examples that illustrate the use of expr. The first example
    illustrates multiplication:


    ```

    $ expr 3 \* 5

    15

    ```


    Notice that the * sign must be escaped in order to prevent the shell from viewing
    it as a filename expansion meta-character. The second example illustrates integer
    division:


    ```

    $ expr 8 / 3

    2

    ```


    Notice that the fractional result is ignored and only the integer part is returned.
    The third example illustrates the remainder or modulus function:


    ```

    $ expr 19 % 7

    5

    ```


    The remainder or modulus is what remains after a division operation. The modulus
    function is often called mod for short. In this example, 7 goes into 19 two times
    with a remainder of 5. You can say that 19 mod 7 equals 5.


    Frequently expr is used within backquotes in shell programming to increment a
    variable:


    ```

    CNT=`expr $CNT + 1`

    ```


    In this example, expr adds 1 to the current value in variable CNT. Command substitution
    allows you to assign the new value back to the variable CNT.'
  merge: -1
  img_proc: true
- pgno: 322
  md: '# expr and Regular Expressions


    The expr command—in ksh, zsh and newer versions of bash (2.x and later)—can also
    return the number of characters matched by a regular expression. The syntax for
    this is


    ```

    expr str : regex

    ```


    Here, str is the string and regex is a regular expression of the characters to
    count. For example:


    ```

    $ ABC=1234abc

    $ expr $ABC : ''.*''

    7

    ```


    Here, .* is a regular expression pattern indicating all characters, so all characters
    of variable $ABC are counted. In this case, expr shows that it contains seven
    characters. In the following example


    ```

    $ expr $ABC : ''[0-9]*''

    4

    ```


    the regular expression [0-9]* matches any group of digits. In this example, expr
    counts the number of digits that occur at the start of the string.


    If part of the regular expression, regex, is grouped in escaped parentheses, expr
    returns the portion of the pattern indicated by the parentheses:


    ```

    $ expr abcdef : ''\(..\).\|..''

    cd

    $

    ```


    Each period is a regular expression wildcard that represents one character of
    the given string. The middle two periods are enclosed in escaped parentheses,
    so those two characters, cd, are output. This example also illustrates that the
    string following expr can be a literal string of characters, but it is more common
    in scripts for the string to be generated by variable or command substitution.


    # The bc Command


    The bc command is an arithmetic utility not limited to integers:


    ```

    $ bc

    scale=4

    8/3

    2.6666

    2.5 * 4.1/6.9

    1.4855

    quit

    $

    ```'
  merge: -1
  img_proc: true
- pgno: 323
  md: 'In this example, you invoke bc and set scale to 4, meaning that you want it
    to calculate any fraction to four decimal places. You ask it to calculate 8/3,
    which gives 2.6666 and then a more complex calculation. Note that spaces are optional.
    Finally you enter quit to return to the shell prompt, bc can handle addition (+),
    subtraction (-), multiplication (*), division (/), remainder or modulo (%), and
    integer exponentiation (^). It can accurately compute some numbers of any size


    ```

    9238472938742937 * 29384729347298472

    27147092868732339864748626982264

    ```


    and we can be used in shell variable assignment to assign calculated values to
    variables:


    ```

    AVERAGE=`echo "scale=4; $PRICE/$UNITS" | bc`

    ```


    The echo command is used here to print directives that are piped to bc. The first
    directive sets the scale to 4; the second directive is a division operation. These
    directives are piped to bc, which does the calculations and returns the result.
    The backquotes allow the result from bc to be stored in the variable AVERAGE.


    You can also convert between different number bases using bc:


    ```

    bc

    ibase=16

    obase=8

    400

    100

    77

    2F

    10*3

    18

    quit

    $

    ```


    obase=16 sets the output base to hexadecimal; ibase=8 sets the input base to octal.
    It is important to set the output base first. First you enter 400. It shows an
    octal 400 is a hex 100. Next you enter 77. It shows an octal 77 is a hex 3F. Then
    you multiply 10 and 3, which equals 24 because 10 octal is 8 in decimal and 8*3
    is 24. However, because the output base is hex, bc converts 24 in decimal to hex,
    which gives 18 as the reported result.


