- pgno: 389
  md: 'business cards have a tendency to get lost, leading to problems when you need
    to contact someone. A nice solution to this problem is to store all the contact
    information on the computer so that you can access and manipulate it easily.


    In this section, you will develop a set of scripts that work together to maintain
    a simple address book. The address book will store the following information:


    +   - Name

    +   - E-mail address

    +   - Postal address

    +   - Phone number


    Each of these pieces of information can contain almost any character including
    spaces or other special characters such as the dash (-), period (.), or single
    quote (''). Thus you need to hold the information in a format that allows for
    such a wide range of characters. A commonly used format is to separate each piece
    of information using the colon (:) character. For example, the following information:


    Sriranga Veeraraghavan

    ranga@soda.berkeley.edu

    1136 Wunderlich Dr. San Jose CA 95129

    408-444-4444


    can be stored as:


    ```

    Sriranga Veeraraghavan:ranga@soda.berkeley.edu:1136 Wunderlich Dr. San Jose CA
    95129:408-444-4444

    ```


    Here any special character, except the colon, can be used. Also this format enables
    you to make any field optional. For example,


    ```

    :vathsa@kanchi.bosland.us::408-444-4444

    ```


    can indicate that only the e-mail address and phone number were known for a particular
    person.


    To maintain your address book, you need a few scripts:


    +   - showperson to show information about one or more people in the address book

    +   - addperson to add a person to the address book

    +   - delperson to delete a person from the address book


    The following examples assume that the address book is stored in the file $HOME/addressbook.'
  merge: -1
  img_proc: true
- pgno: 390
  md: "# Showing People\n\nOne of the main tasks any address book must perform is\
    \ looking up information about a person and then displaying it. You will develop\
    \ a script called showperson to handle this task.\n\nTo find information about\
    \ a person, you can use grep. For example,\n\n```\n$ grep vathsa addressbook\n\
    ```\n\nlists all the lines that contain the word vathsa in the file addressbook.\
    \ For your address book, the output might look like the following:\n\n```\n:vathsa:kanchi.bosland.us:+488-444-4444\n\
    ```\n\nAs you imagine, your script should format the results of the grep command.\
    \ A nice format would be to list the name, e-mail address, postal address, and\
    \ phone number on separate lines. You can do this using an awk command:\n\n```\n\
    awk -F ':' '{ print \"Name: \" $1;\\nEmail: \"$2;\\nAddress: \"$3;\\nPhone: \"\
    $4 }'\n```\n\nBy putting these commands together, you can construct the showperson\
    \ script as given in Listing 22.2 (the line numbers are provided for your reference).\n\
