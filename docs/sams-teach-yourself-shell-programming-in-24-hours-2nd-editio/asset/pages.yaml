    \ example illustrates this:\n\n```\n```bash\ngrep soda /etc/hosts > /dev/null\
    \ 2>&1\nif [ $? -ne 0 ] ; then\n echo \"Soda Found!\"\nelse\n echo \"No entry\
    \ in /etc/hosts for soda.\"\nfi\n```\n```\n\nHere you execute a grep command and\
    \ then check the exit status of that command using the value stored in $?.\n\n\
    # How do I determine whether the shell can find a particular command?\n\nYou can\
    \ check to make sure that the shell can find a command or shell function by using\
    \ the type command covered in Chapter 18, \"Other Tools\":\n\n```\n```bash\ntype\
    \ cmd > /dev/null 2>&1\nif [ $? -eq 0 ] ; then\n # we have cmd, execute commands\
    \ that require cmd\nelse\n # we don't have cmd, execute alternate commands (if\
    \ any)\nfi\n```\n```\n\nHere cmd is the name of the command you want check for.\
    \ The type command is a built-in in sh, bash, and zsh. In ksh, type is usually\
    \ an alias, whence -v.\n\nAn alternate form omits the explicit checking of the\
    \ exit status stored in $? :\n\n```\n```bash\nif type cmd > /dev/null 2>&1 ; then\n\
    \ # we have cmd, execute commands that require cmd\nelse\n # we don't have cmd,\
