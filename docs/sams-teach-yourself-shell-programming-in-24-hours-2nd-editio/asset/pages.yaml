    # Summary


    This chapter covered what the shell is and how it operates in greater detail.
    The init process for the various shells was described along with a brief description
    of the basic information required in the init file .profile. The different modes
    of operation for the shell, interactive and non-interactive, were also covered.
    Shell programming relies on the non-interactive mode because it enables commands
    specified in a file to be executed.


    We also covered man and man pages, the online help system in UNIX. Finally, online
    sources for shell programming information, such as Usenet newsgroups, Web sites,
    and e-mail lists, were covered.


    The next chapter formally introduces the concept of files by showing you how to
    list files, view the contents of files, and manipulate files.


    # Questions


    +   1. What are the two files used by the shell to initialize itself?

    +   2. Why do you need to set PATH and MANPATH?

    +   3. What is the purpose of the following line in a shell script?

    +      `#!/bin/sh`

    +   4. What command should you use to access the online help?


    ```

    #!/bin/sh

    ```


    # Terms


    **Commands** A command is comprised of the name of a program along with zero or
    more arguments. You might see the term command used instead of the term utility
    for simple commands, where only the program name is given.


    ![](img/3def70414996f811615f713b2077a154_50_0.png)'
  merge: -1
  img_proc: true
- pgno: 51
  md: '**Comments** A comment is a statement that is embedded in a shell script but
    is not executed by the shell.


    **Home Directory** The home directory is where you first start out after logging
    in.


    **Interactive Mode** In interactive mode, the shell reads input from the user
    and executes the specified commands. This mode is called interactive because the
    shell is interacting with a user.


    **Kernel** The kernel is the heart of the UNIX system. It provides utilities with
    a means of accessing a machine''s hardware. It also handles scheduling and executing
    commands.


    **Man Pages** Every version of UNIX comes with an extensive collection of online
    help pages called man pages (short for manual pages). The man pages are the authoritative
    source about your UNIX system. They contain complete information about both the
    kernel and all the utilities.


    **Non-interactive Mode** In non-interactive mode, the shell does not interact
    with the user; instead it reads commands stored in a file and executes them. When
    the shell reaches the end of the file, it exits.


    **Shell Initialization** After a shell is started, it undergoes a phase called
    initialization in which important parameters are set up.


    **Shell Script** A shell script is a list of commands stored in a file.


    **Uninitialized Shell** An uninitialized shell is one that has not yet read its
    init files in order to set up the parameters required for its proper operation.


    **Utilities** Utilities are programs, such as who and date, that can be executed.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Hour 3


    # Working with Files


    ![](img/3def70414996f811615f713b2077a154_52_0.png)


    In UNIX there are two basic types of files: ordinary and special. An ordinary
    file contains data, text, or program instructions. Almost all of the files on
    a UNIX system are ordinary files. This chapter covers operations on ordinary files.


    Special files are mainly used to provide access to hardware such as hard drives,
    CD-ROM drives, modems, and Ethernet adapters. Some special files are similar to
    aliases or shortcuts and enable you to access a single file using different names.
    Special files are covered in Chapter 6, “Manipulating File Attributes.”


    Both ordinary and special files are stored in directories. Directories are similar
    to folders in the Mac OS or Windows, and they are covered in detail in Chapter
    4, “Working with Directories.”


    In this chapter, we will examine ordinary files, concentrating on the following
    topics:


    +   - Listing files

    +   - File contents

    +   - Manipulating files'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Listing Files


    We''ll start by using the ls (short for list) command to list the contents of
    the current directory:


    ```

    $ ls

    ```


    The output will be similar to the following:


    ```

    Desktop    Icon    Music    Sites

    Documents  Library Pictures Temporary Items

    Downloads  Movies  Public

    ```


    We can tell that several items are in the current directory, but this output does
    not tell us whether these items are files or directories. To find out which of
    the items are files and which are directories, we can specify the -F option to
    ls. An option is an argument that starts with the hyphen or dash character, ''-''.


    The following example illustrates the use of the -F option of ls:


    ```

    $ ls -F

    ```


    Now the output for the directory is slightly different:


    ```

    Desktop/    Icon    Music/    Sites/

    Documents/  Library/ Pictures/ Temporary Items/

    Downloads/  Movies  Public/

    ```


    As you can see, some of the items now have a / at the end, indicating each of
    these items is a directory. The other items, such as Icon, have no character appended
    to them. This indicates that they are ordinary files.


    When the -F option is specified to ls, it appends a character indicating the file
    type of each of the items it lists. The exact character depends on your version
    of ls. For ordinary files, no character is appended. For special files, a character
    such as @, |, or # is appended to the filename. For more information on the -F
    options, check the UNIX manual page for the ls command. You can do this as follows:


    ```

    $ man ls

    ```


    > **Options Are Case Sensitive**

    > The options that can be specified to a command, such as ls, are case sensitive.
    When specifying an option, you need to make sure that you have specified the correct
    case for the option. For example, the output from the -F option to ls is different
    from the output produced when the -f option is specified.'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'So far, you have seen ls list more than one file on a line. Although this is
    fine for humans reading the output, it is hard to manipulate in a shell script.
    Shell scripts are geared toward dealing with lines of text, not the individual
    words on a line. Although external tools, such as the awk language covered in
    Chapter 17, “Filtering Text with awk,” can be used to deal with multiple words
    on a line, it is much easier to manipulate the output when each file is listed
    on a separate line. You can modify the output of ls to this format by using the
    -l option. For example,


    ```

    $ ls -l

    ```


    produces the following listing:


    ```

    Desktop

    Documents

    Downloads

    Icon

    Library

    Movies

    Music

    Pictures

    Public

    Sites

    Temporary Items

    ```


    # Hidden Files


    In the examples you have seen thus far, the output has listed only the visible
    files and directories. You can also use ls to list invisible or hidden files and
    directories. An invisible or hidden file is one whose first character is a dot
    or period (.). Many programs, including the shell, use such files to store configuration
    information. Some common examples of invisible files include


    +   - `.profile`, the Bourne shell (`sh`) initialization script

    +   - `.kshrc`, the Korn Shell (`ksh`) initialization script

    +   - `.cshrc`, the C Shell (`csh`) initialization script

    +   - `.rhosts`, the remote shell configuration file


    All files that do not start with the . character are considered visible.


    To list invisible files, specify the -a option to ls:


    ```

    $ ls -a

    ```


    The directory listing now resembles this:


    ```

    .  ..  FBLockFolder  Icon  Public

    .  ..  .bash_profile  Library  Sites

    .CFUserTextEncoding  Desktop  Movies  Temporary Items

    ```'
  merge: -1
  img_proc: true
- pgno: 55
  md: '```

    .DS_Store    Documents    Music

    .FBIIndex    Downloads    Pictures

    ```


    As you can see, this directory contains several invisible files.


    Notice that in this output, the file type information is missing. To get the file
    type information, specify the -F and the -a options as follows:


    ```

    $ ls -a -F

    ```


    The output changes to the following:


    ```

    ./          .ssh/          Movies/

    ../         Desktop/       Music/

    .CFUserTextEncoding   Documents/   Pictures/

    .DS_Store   Downloads/     Public/

    .FBIIndex   Icon?          Sites/

    .FBLocalfolder/ Library/      Temporary Items/

    ```


    With the file type information, you see that there are two invisible directories
    (. and ..). These directories are special entries present in all directories.
    The first one, . , represents the current directory, whereas the second one, ...
    represents the parent directory. These concepts are discussed in greater detail
    in Chapter 4.


    # Option Grouping


    In the previous example, you specified the options to ls separately. You could
    have grouped the options together, as follows:


    ```

    $ ls -aF

    $ ls -Fa

    ```


    Both of these commands are equivalent to the following command:


    ```

    $ ls -a -F

    ```


    The order of the options does not matter to ls. As an example of option grouping,
    consider the following equivalent commands:


    ```

    ls -l -a -F

    ls -laF

    ls -a1F

    ls -Fa1

    ```


    All permutations of the options -l, -a, and -F produce the same output:


    ```

    ./

    ../

    .CFUserTextEncoding

    .DS_Store

    ```'
  merge: -1
  img_proc: true
