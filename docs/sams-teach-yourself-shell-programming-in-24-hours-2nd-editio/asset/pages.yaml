    \ STDOUT to file1 and appends STDERR to file2.\n\nThe following example illustrates\
    \ the first form:\n\n```\nln -s ch05.doc ./docs >> /tmp/ln.log 2> /dev/null\n\
    ```\n\nHere the STDOUT of ln is appended to the file /tmp/ln.log, and the STDERR\
    \ is redirected to the file /dev/null, in order to discard it.\n\n> The file /dev/null\
    \ is a special file available on all UNIX systems used to discard output. It is\
    \ sometimes referred to as the bit bucket. If you redirect the output of a command\
    \ into /dev/null, it is discarded. For example, the command\n> \n> rm file2 >\
    \ /dev/null\n> \n> discards the output of the rm command.\n> \n> If you use cat\
    \ to display the contents of /dev/null to a file, the file's contents are erased:\n\
    > \n> $ cat /dev/null > file\n> \n> After this command, the file still exists,\
    \ but its size is zero."
  merge: -1
  img_proc: true
- pgno: 100
  md: '# Redirecting STDOUT and STDERR to the Same File


    You looked at how to use file descriptors to redirect STDOUT and STDERR to different
    files, but sometimes you need to redirect both to the same file. In general, you
    can do this as follows


    ```

    cmd > file 2>&1

    list > file 2>&1

    ```


    Here STDOUT (file description 1) and STDERR (file descriptor 2) of cmd are redirected
    into the specified file. Here is a situation where it is necessary to redirect
    both the standard output and the standard error:


    ```

    rn -rf /tmp/my_tmp_dir > /dev/null 2>&1 ; mkdir /tmp/my_tmp_dir

    ```


    In this case you are not interested in the error message or the informational
    message printed by the rn command. You only want to remove the directory, thus
    its output, or any error message it prints, is redirected to /dev/null.


    If you have a command or list that should append its standard error and standard
    output to a file, you can use one of the following forms of output redirection:


    ```

    cmd >> file 2>&1

    list >> file 2>&1

    ```


    An example of a command that might require this is


    ```

    rdate -s ntp.nasa.gov >> /var/log/rdate.log 2>&1

    ```


    Here you are using the rdate command to synchronize the time of the local machine
    to an Internet time server and you want to keep a log of all the messages.


    # Printing a Message to STDOUT


    You can also use this form of output redirection to output error messages on STDERR.
    The basic syntax is


    ```

    echo str 1>&2

    printf format args 1>&2

    ```


    You might also see these commands with the STDOUT file descriptor, 1, omitted:


    ```

    echo string >&2

    printf format args >&2

    ```


    # Redirecting Two File Descriptors


    You can redirect the output from one file descriptor to another file descriptor
    using the general form of output redirection:


    ```

    n>&m

    ```'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'Here n and n are file descriptors (integers). When you let n=1 and m=2, STDERR
    is redirected to STDOUT. The general form of output redirection is often combined
    with exec to duplicate an already open output file description:


    ```

    exec n>&o

    ```


    Here n is a new file descriptor and o is an open output file descriptor. For example
    if the file descriptor 4 is opened as follows:


    ```

    exec 4>out.txt

    ```


    then the command:


    ```

    exec 5>&4

    ```


    causes file descriptor 5 to become a duplicate of file descriptor 4. Given these
    two exec commands, the output of the following command:


    ```

    date 1>&5

    ```


    will end up in the file out.txt.


    The general form of input redirection is similar to the general form of output
    redirection:


    ```

    n<&m

    ```


    Here, n and m are file descriptors (integers). The general form of output redirection
    is often combined with exec to duplicate an already open input file description:


    ```

    exec n<&o

    ```


    Here n is a new file descriptor and o is an open input file descriptor. In the
    following example, file descriptor 6 becomes a duplicate of STDIN:


    ```

    exec 6<&0

    ```


    # Closing File Descriptors


    The following syntax can be used to close an open file descriptor:


    ```

    exec n> & -

    ```


    Here n is an open file descriptor. When a file descriptor is closed, trying to
    read or write from it results in an error. The following example closes the previously
    opened file descriptor 4:


    ```

    exec 4> & -

    ```'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# Summary


    In this chapter, you learned about the concept of input and output and examined
    the echo and printf commands that are used to produce messages from within shell
    scripts. You also learned about output redirection, and covered the methods of
    redirecting and appending the output of a command to a file. You also learned
    about the concept of file descriptor and saw several aspects of its use, including
    opening files for reading and writing, closing files, and redirecting the output
    of two file descriptors to one source.


    In subsequent chapters, you will expand on the material covered here, and you
    will see many more applications of both input and output redirection along with
    the use of file descriptors.


    # Questions


    +   1. Which file descriptors are associated with STDOUT, STDERR and STDIN?

    +   2. Use printf to convert the numbers 16, 255, and 65535 into hexadecimal and
    octal.

    +   3. Given the following script:

    +   ```

    +   exec 6>out.txt

    +   exec 5>&4

    +   exec 1>&5

    +   date

    +   ```

    +   Where does the output from date end up?


    # Terms


    **Escape sequence** A special sequence of characters that represents another character.

    **File descriptor** An integer that is associated with a file. Enables you to
    read and write from a file using the integer instead of the file''s name.

    **Input redirection** In UNIX, the process of sending input to a command from
    a file.

    **Output redirection** In UNIX, the process of capturing the output of a command
    and storing it in a file. It redirects the output of a command into a file instead
    of the screen.

    **STDERR** Standard Error. A special type of output used for error messages. The
    file descriptor for STDERR is 2.

    **STDIN** Standard Input. User input is read from STDIN. The file descriptor for
    STDIN is 0.

    **STDOUT** Standard Output. The output of scripts is usually to STDOUT. The file
    descriptor for STDOUT is 1.'
  merge: -1
  img_proc: true
