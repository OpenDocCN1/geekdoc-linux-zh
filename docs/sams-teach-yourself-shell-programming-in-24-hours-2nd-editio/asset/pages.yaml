  md: 'Deleting a person from the address book is a harder task because you have to
    confirm each record selected for deletion. The two main tasks you need to perform
    are


    +   1. Make a list of the lines in the address book that match the specified name.

    +   2. Based on user feedback, delete the appropriate entries from the address
    book.


    Because the delete operation can potentially remove information from the address
    book, you have to be extra careful about making backups and working on a copy
    of the address book rather than on the original address book.


    To simplify prompting and printing error messages, this script uses the shell
    function library libDTYSP2.sh that was introduced in Chapter 21.


    The basic flow of the script is as follows:


    +   1. Make a copy of the address book and use the copy for all modifications.

    +   2. Get a list of all matching lines from this copy and store them in a deletion
    file.

    +   3. For each record in the deletion file, print out the record and ask the
    user whether that line should be deleted.

    +   4. If the user wants the record deleted, remove that record from the copy
    of the address book.

    +   5. After the deletions are complete, make a backup of the original address
    book.

    +   6. Make the edited copy the address book.

    +   7. Clean up temporary files and exit.


    For each of these steps, you use a function to make sure that the operations performed
    succeeded.


    The complete delperson script is given in Listing 22.4 (the line numbers are provided
    for your reference).


