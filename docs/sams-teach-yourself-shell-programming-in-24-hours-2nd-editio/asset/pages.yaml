- pgno: 24
  md: '# Hour 1


    # Shell Basics


    My father is an avid woodworker. He has a tool chest that holds all his woodworking
    tools, from screwdrivers and chisels to power sanders and power drills. Over the
    years, he has used his tools to build everything from a toy bridge to a shed.
    By applying the same tools, he has been able to build all the elements required
    in his projects.


    In many ways, shell programming is similar to woodworking. A woodworking project
    requires a design for the project and its elements along with the right tools.
    In shell programming, the project design is provided by the programmer and the
    tools are utilities or commands provided by UNIX. There are simple commands such
    as ls and cd, and there are also commands such as awk and sed, which are the power
    tools in UNIX.


    The simple commands are easy to learn. You probably already know how to use many
    of them. The power tools take longer to learn, but after mastering them almost
    any problem can be tackled. This book covers both the simple tools and the power
    tools, with the main focus on the most powerful tool in UNIX, the shell. In this
    chapter you will learn about


    +   - Simple, complex, and compound commands

    +   - Command separators

    +   - Different types of shells


    ![](img/3def70414996f811615f713b2077a154_24_0.png)'
  merge: -1
  img_proc: true
- pgno: 25
  md: "# What Is a Command?\n\nA command is a file containing a set of instructions\
    \ that UNIX can run or execute. In operating systems such as Mac OS or Windows,\
    \ commands are executed by clicking their icons. In UNIX, a command is executed\
    \ by typing in its name and pressing Enter or Return. For example, in order to\
    \ execute the date command, use the following:\n\n```\n$ date [ENTER]\nWed Dec\
    \  9 08:49:13 PST 1998\n$\n```\n\nThe purpose of the date command is to display\
    \ the current date, day, time, and year. Notice that after the command finishes\
    \ executing, the character $ is displayed. This character is the prompt. When\
    \ a prompt is present, the name of a command can be given for execution. The shell\
    \ reads the command name and tries to execute it. While the command executes,\
    \ the prompt is not displayed. When the command finishes executing, the prompt\
    \ is displayed again.\n\n![](img/3def70414996f811615f713b2077a154_25_0.png)\n\n\
    > The $ character is a prompt for you to enter a command. It is not part of the\
    \ command itself.\n> \n> For example, to execute the date command, only the word\
    \ date is typed at the prompt. Don't type $ date. Some systems might display an\
    \ error message if you type $ date instead of date.\n\nHere is another example\
    \ of executing the who command:\n\n```\n$ who\nvathsa    tty1    Dec  6 19:36\n\
    ranga     tty0    Dec  9 08:23\n$\n```\n\nThe who command displays a list of all\
    \ the people, or users, who are currently using the UNIX machine. The first column\
    \ of the output lists the usernames of the people who are logged in. On this system,\
    \ there are two users, vathsa and ranga. The second column lists the terminals\
    \ they are logged in to, and the final column lists the time they logged in. The\
    \ output varies from system to system. On some versions of UNIX or Linux, there\
    \ might be additional columns in the output. Try it on your system to see who\
    \ is logged in.\n\nFor those readers who are not familiar with the process of\
    \ logging in to a UNIX system, the details are discussed in Chapter 2, \"Script\
    \ Basics.\""
  merge: -1
  img_proc: true
- pgno: 26
  md: '# Simple Commands


    The commands who and date are examples of simple commands. A simple command is
    one that can be executed just by specifying the command name at the prompt. The
    syntax for executing a simple command is


    ```

    $ cmd

    ```


    Here cmd is the name of the command to be executed.


    Simple commands in UNIX can be small commands such as who and date, or they can
    be large commands such as a Web browser or spreadsheet program. Most commands
    in UNIX can be executed as simple commands.


    # Complex Commands


    A complex command consists of a command name followed by a list of arguments.
    Arguments are modifiers specified after the command name and are used to alter
    the behavior of the command. The syntax for a complex command is


    ```

    $ cmd arg1 arg2 ... argN

    ```


    Here cmd is the name of the command you want to execute, and arg1 through argN
    are the arguments you want to give cmd. As an example, you can use the who command
    to determine information about yourself by executing it as follows:


    ```

    $ who -i

    ranga pts/0 Dec 9 08:49

    $

    ```


    In this mode, who omits information about the other users and just prints information
    about you. This is an example of a complex command. Here, the cmd is who and the
    arguments, arg1 and arg2, are -i and 1. These arguments change the behavior of
    the who command. Most commands accept arguments that modify their behavior.


    ![](img/3def70414996f811615f713b2077a154_26_0.png)


    > Although you can specify any arguments you want to a command, most commands
    only understand a handful of arguments. Some commands ignore arguments they do
    not understand, whereas others display error messages. The man command, discussed
    in Chapter 2, can help determine the arguments a command understands.


    When who was executed as a simple command, it displayed information about all
    the users who were logged in. This is referred to as the default behavior for
    the who command. The default behavior of a command is the output produced by the
    command when it is executed as a simple command.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# Compound Commands


    It is possible to combine simple and complex commands into compound commands.
    A compound command consists of a list of simple and complex commands, with each
    command separated by a semicolon, ;. The syntax for a complex command is


    ```

    $ cmd1 ; cmd2 ; cmd3 ; ... ; cmdN ;

    ```


    Here, cmd1 through cmdN are either simple or complex commands. The order of execution
    is cmd1, followed by cmd2, followed by cmd3, and so on. When cmdN finishes executing,
    the prompt is returned.


    An example of a complex command is


    ```

    $ date ; who am i ;

    Wed Dec 9 10:10:10 PST 1998

    ranga pts/0 Dec 9 08:49

    $

    ```


    Here the compound command consists of the simple command date and the complex
    command who am i. The date command is executed first, followed by the who am i
    command. The behavior of the previous complex command is the same as if each of
    the commands were executed as follows:


    ```

    $ date

    Wed Dec 9 10:25:34 PST 1998

    $ who am i

    ranga pts/0 Dec 9 08:49

    $

    ```


    The difference between executing commands in this fashion and using a compound
    command is that in a compound command, the prompt is returned only after all the
    commands that compose the complex command have been executed.


    # Command Separators


    The semicolon character (;) is treated as a command separator. Command separators
    indicate where one command ends and another begins. If a command separator is
    not used to separate each of the individual commands in a complex command, the
    system will not be able to distinguish between the ending of one command and the
    beginning of the next command.


    For example, if the previous example is executed without the first semicolon,
    such as shown here,


    ```

    $ date who am i

    ```'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'the system will produce an error message similar to the following:


    date: bad conversion


    In this case, date thinks that it is being executed as a complex command with
    the arguments who, an, and i. The date command is confused by these arguments
    and displays an error message. When using complex commands, remember to use the
    semicolon character.


    You can also terminate individual simple and complex commands using the semicolon
    character. Both of the following commands produce the same output:


    ```

    $ date

    $ date ;

    ```


    In the first case, the simple command date executes, and the prompt returns. In
    the second case, the shell thinks that a complex command is executing. It begins
    by executing the first command in the complex command (in this case, date). When
    this command finishes, the shell tries to execute the next command. In this case,
    no other commands are left to execute, so the prompt returns.


    ![](img/3def70414996f811615f713b2077a154_28_0.png)


    > You will frequently see the semicolon used to terminate simple and complex commands
    in scripts. Because the semicolon is required to terminate commands in other languages,
    such as C, Perl, and Java, many script programmers use it the same way in scripts.
    There is no overhead in using the semicolon for this purpose.


    # What is the Shell?


    The shell provides you with an interface to the UNIX system. It reads input from
    you and executes the programs you specified. While the programs are executing,
    it displays their output. For this reason, the shell is often referred to as the
    UNIX system''s command interpreter. For users familiar with Windows, the UNIX
    shell is similar to the DOS shell, COMMAND.COM.


    The real power of the shell lies in the fact that it is much more than a command
    interpreter. It is also a powerful programming language, complete with conditional
    statements, loops, and functions.


    If you are familiar with these types of statements from other programming languages,
    you can learn shell programming quickly. If you haven''t seen these before, don''t
    fret. By working through the examples and exercises in this book, you will learn
    how to effectively use all these statements.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# The Shell Prompt


    The prompt, $, discussed earlier in this chapter, is printed by the shell. When
    the prompt is displayed, you can type in a command. The shell waits for you to
    press Enter or Return before reading your input. The command to execute is determined
    by examining the first word of your input. A word is a set of characters separated
    by a space or tab. The shell treats input as follows:


    ```

    $ word1 word2 word3 ... wordN

    ```


    The first word, word1, is always assumed to be the name of the command to execute.
    If there is only one word, as in the following example, the shell simply executes
    the command:


    ```

    $ date

    ```


    If there are multiple words as follows,


    ```

    $ who am i

    ```


    the extra words are passed as arguments to the command specified by word1.


    # Different Types of Shells


    The prompt on your system might be different from the simple $ used in this book.
    The actual prompt that is displayed depends on the type of shell you are using.
    In UNIX, there are two major types of shells:


    +   - Bourne (includes sh, ksh, bash, and zsh)

    +   - C (includes csh and tcsh)


    If you are using most Bourne-type shells, the last character of the default prompt
    is the dollar sign character, $. If you are using a C-type shell or zsh, the last
    character of the default prompt is the percent character, %.


    This book covers Bourne-type shells. Unless explicitly noted, the examples and
    exercise answers in this book will work with any Bourne-type shell. The C-type
    shells have several problems that make them unsuitable for shell programming,
    thus they are not covered in this book. For more information on this topic, refer
    to the following article:


    http://www.faqs.org/faqs/unix-faq/shell/csh-whynot/


    ![](img/3def70414996f811615f713b2077a154_29_0.png)


    > In UNIX, there are two types of accounts, regular accounts and the root account.
    Normal users are given regular accounts. The root account is an account with special
    privileges that the administrator of a UNIX system'
  merge: -1
  img_proc: true
- pgno: 30
  md: '> (called the sysadmin) uses to perform maintenance and upgrades. When the
    root account is used, both Bourne-type and C-type shells display the # character
    as the last character of the prompt. Use extreme caution when executing commands
    as the root user because the commands affect the whole system. None of the examples
    in this book require that you have access to the root account to execute them.


    # Bourne Shell


    The original UNIX shell was written at AT&T Bell Labs in New Jersey during the
    mid-1970s by Steve Bourne. Because the Bourne shell was the first shell to appear
    on UNIX systems, it is often referred to as "the shell." Historically, it was
    installed as /bin/sh


    In addition to being a command interpreter, the Bourne shell is a powerful language
    with a programming syntax similar to that of the ALGOL language. Steve Bourne
    had written a ALGOL-68 compiler when he was at Cambridge University in England
    and liked the syntax of that language so much that he modeled the syntax of the
    shell after it.


    Some of the features of the Bourne shell are


    +   - Process control (see Chapter 7, "Processes")

    +   - Variables (see Chapter 8, "Variables")

    +   - Regular expressions (see Chapter 9, "Substitution")

    +   - Flow control (see Chapter 11, "Flow Control," and Chapter 12, "Loops")

    +   - Powerful input and output controls (see Chapter 5, "Input and Output")

    +   - Functions (see Chapter 14, "Functions")


    One of the main complaints against the Bourne shell is that, although it is excellent
    for programming, it is hard to use interactively. Some of the major drawbacks
    are


    +   - Lack of filename completion

    +   - Lack of command history or command editing

    +   - Difficulty in executing multiple background processes


    # C Shell


    The C shell was written at the University of California at Berkeley in the early
    1980s by Bill Joy. C shell was designed to make the shell easier to use interactively.
    It first appeared in BSD UNIX and was later incorporated into AT&T’s version of
    UNIX. C shell is usually installed as /bin/csh'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'The C shell updated the shell''s syntax from the older ALGOL-like syntax to
    a more modern C-like syntax. At the time, most people felt that this change would
    simplify shell programming for Berkeley''s UNIX programmers, who were well versed
    in C and its syntax. As it turned out, C shell could not be used for much more
    than the most trivial scripts because of the following flaws:


    +   - Weak input and output controls

    +   - Lack of functions

    +   - Confusing syntax


    Although the C shell did not catch on for scripts, it has become extremely popular
    for interactive use. Some of the key improvements responsible for this popularity
    are:


    +   - **Command History.** Previously executed commands can be recalled for re-execution.
    The command can also be edited before it is re-executed.

    +   - **Aliases.** C shell allows for the creation of short mnemonic names that
    can be entered in lieu of the full command names. Aliases are a simplified form
    of the Bourne shell functions.

    +   - **File Name Completion.** The C shell can automatically complete a filename
    after a few characters of the file''s name have been entered.

    +   - **Job Controls.** The C shell allows for the execution of multiple background
    processes and allows for their control via the jobs command.


    The TENEX/TOPS C shell, tsch, is a newer version of the C shell that features
    several usability enhancements. For example, it can scroll through the command
    history using the up and down arrow keys and it allows for the editing of commands
    using right and left arrow keys. For more information on tsch, refer to the following
    URL.


    http://www.dubois.ws/software/csh-tsh-book/


    # The Korn Shell


    For many years, the only shells to choose from were the Bourne shell and the C
    shell. This meant that most users had to learn two shells, the Bourne shell for
    programming and the C shell for interactive use. To rectify this situation, David
    Korn of AT&T Bell Labs wrote the Korn Shell, ksh. It incorporates all the C shell''s
    interactive features while preserving the Bourne shell''s ALGOL-like syntax. The
    Korn Shell is usually installed as `/bin/ksh` or `/usr/bin/ksh`.


    Some of the additional features that the Korn Shell adds to the Bourne shell are


    +   - Command history and history substitution

    +   - Command aliases and functions'
  merge: -1
  img_proc: true
- pgno: 32
  md: '+   - Filename completion

    +   - Arrays (see Chapter 8)

    +   - Built-in integer arithmetic (see Chapter 9)


    In general ksh is fully compatible with sh. Some minor differences exist that
    can affect the execution of a script. Where appropriate, such differences are
    noted in this book.


    There are several variants of ksh. The official version is pre-installed on most
    commercial versions of UNIX, such as Solaris and HP-UX. For other systems, it
    is available in binary form from


    http://www.kornshell.com


    Most non-commercial versions of UNIX, such as Linux and BSD, use the public domain
    version of the Korn Shell, pdksh. Eric Gisin created pdksh using Charles Forsyth''s
    public domain V7 shell along with parts of the BRL shell. Currently, pdksh is
    maintained by Michael Rendell. It is available in both source and binary forms
    from


    http://web.cs.nun.ca/~michael/pdksh/


    For the shell programmer, there is no difference between the official and the
    public domain versions of ksh—scripts that run in one version will run in the
    other. For users, the official version provides a few nice features such as command
    line completion with the Tab key rather than the Esc key.


    Another variant of ksh is the POSIX shell. The Institute of Electrical and Electronics
    Engineers (IEEE) created the POSIX standards in order to help programmers write
    portable programs that are compatible with a wide range of systems. One particular
    standard, the 1003.2/ISO 9945.2 Shell and Tools specification, specifies the syntax
    and behavior of a portable shell, which is essentially the syntax and behavior
    of ksh. Most commercial UNIX vendors are slowly adapting the POSIX standards.
    HP is currently shipping the POSIX shell as the default shell, /bin/sh, on all
    of its new HP-UX systems.


    # Bourne Again Shell


    The Bourne Again Shell, bash, was written by Brian Fox of the Free Software Foundation
    as a replacement for the Bourne shell. At present bash is maintained by Chet Ramey.
    It incorporates most of the features of csh, tcsh, and ksh while retaining compatibility
    with the original Bourne shell and compliance with the POSIX standard.


    Most Linux distributions, such as Red Hat, Debian, and Slackware, ship with bash
    installed as /bin/sh and /bin/bash. Because of licensing restrictions, the original
    Bourne shell cannot be easily distributed with Linux. Since bash is compatible
    with the Bourne shell, most Linux distributions have chosen to use a copy of bash
    in place of a genuine Bourne shell.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'For non-Linux systems, bash is available in both source and binary forms from
    http://cnswww.cns.cwru.edu/~chet/bash/bas htop.html


    Some features that bash includes, in addition to those of the Korn Shell, are


    +   - Name completion for variable names, usernames, hostnames, commands, and
    file-names

    +   - Spelling correction for pathnames in the cd command

    +   - Arrays of unlimited size

    +   - Integer arithmetic in any base between 2 and 64


    # The Z Shell


    The Z shell, zsh, was written by Paul Falstad while he was a student at Princeton
    University. It is extremely customizable and is mostly compatible with ksh.


    On Mac OS X systems, zsh is installed as /bin/zsh and /bin/sh. Because of licensing
    issues, Apple has chosen not to distribute the original Bourne shell with Mac
    OS X. Apple distributes zsh as its Bourne shell replacement.


    For non-Mac OS X systems, zsh is available from


    http://zsh.sunsite.dk/


    In addition to the features of zsh and bash, some additional features of zsh are


    +   - Highly configurable command-line editing

    +   - Fully programmable filename, username, hostname, and history completion

    +   - Highly customizable keyboard mappings


    # Summary


    This chapter covered shell basics, including the execution of simple commands,
    complex commands, and compound commands. The concept of a shell and several different
    shells, including ksh, bash, and zsh, were described. The next chapter, "Script
    Basics," explores the function of the shell in greater detail, starting with interactive
    and non-interactive uses of the shell.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# Questions


    1. Classify each of the following as simple, complex, or compound commands:

    $ ls

    $ date ; uptime

    $ ls -l

    $ echo "hello world"


    If you haven’t seen some of these commands before, try them out on your system.
    As you progress through the book, each will be formally introduced.


    2. What is the effect of putting a semicolon at the end of a single simple or
    complex command?

    For example, will the output of the following commands be different?

    $ who am i

    $ who am i ;


    3. What are the two major types of shells? Give an example of a shell that falls
    into each type.


    # Terms


    **Arguments** Arguments are command modifiers that change the behavior of a command.


    **Command Separators** A command separator indicates where one command ends and
    another begins. The most common command separator is the semicolon character (;).


    **Commands** A command is a program that can be executed. To execute a command,
    type its name and press Enter or Return.


    **Complex Commands** A complex command is a command that consists of a command
    name and a list of arguments.


    **Compound Commands** A compound command consists of a list of simple and complex
    commands separated by the semicolon character (;).


    **Default Behavior** The default behavior of a command is the output generated
    by a command when it is run as a simple command.


    **Prompt** The prompt is displayed by the shell. When the prompt is present, the
    shell can be given a command to execute. In this book, the $ character is used
    to indicate the prompt.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '**Shell** The shell is an interface to the UNIX system. It reads input and
    executes programs based on that input. When a program has finished executing,
    it displays that program''s output. The shell is sometimes called a command interpreter.


    **Simple Commands** A simple command is a command that can be executed by giving
    just its name at the prompt.


    **Words** Words are sets of characters separated by spaces and tabs.'
  merge: -1
