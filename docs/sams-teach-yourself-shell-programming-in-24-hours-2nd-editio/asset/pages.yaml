    dhovarth 6739 3662 0 16:22:54 pts/6 0:00 second_one

    dhovarth 3662 3657 0 08:16:53 pts/6 0:00 -ksh

    dhovarth 6682 3662 4 10:51:50 pts/6 0:00 ps -f

    dhovarth 6770 3662 2 16:35:45 pts/6 0:03 third_one

    ```


    As you can see, the ppid of ksh is 3657. The output on your system, as well as
    your shell and its process ID, will most likely be different. Using ps -ef (or
    ps -aux on some systems) and grep to find that number, you see the following:


    ```

    $ ps -ef | grep 3657

    dhovarth 9778 3662 4 10:52:50 pts/6 0:00 ps -f

    dhovarth 9779 3662 0 16:52:51 pts/6 0:00 grep 3657

    root 3657 771 0 08:16:53 ? 0:00 in.telnetd

    dhovarth 3662 3657 0 08:16:53 pts/6 0:00 -ksh

    ```


    This tells you that the terminal session is being handled by in.telnetd (the telnet
    daemon), which is the parent of ksh. There is a parent-child relationship between
    processes. in.telnetd is the parent of ksh, which is the child of in.telnetd,
    but also the parent of ps and grep.


    When a child is forked, or created, from its parent, it receives a copy of the
    parent''s environment, including environment variables. The child can change its
    own environment, but those changes do not reflect in the parent and go away when
    the child exits.


    # Subshells


    Whenever you run a shell script, in addition to any commands in the script, another
    copy of the shell interpreter is created. This new shell is known as a subshell,
    just as a directory contained in or under another is known as a subdirectory.


    The best way to show this is with an example. For example, consider the following
    script, which runs ps and exits:


    ```

    #!/bin/ksh

    ps -ef | grep dhovarth

    exit 0

    ```


    When run, psit produces the following:


    ```

    $ psit

    dhovarth 9830 3662 0 13:58:42 pts/6 0:00 ksh psit

    dhovarth 9851 9830 19 14:05:24 pts/6 0:00 ps -ef

    dhovarth 9852 9851 0 13:58:42 pts/6 0:00 grep dhovarth

    dhovarth 9832 9830 0 13:58:42 pts/6 0:00 grep dhovarth

    $

    ```'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'The subshell running as process 9830 is a child of process 3662, the original
    ksh shell. ps and grep are the children of process 9830 (ksh psit). When the psit
    script is done and exits, the subshell exits, and control is returned to the original
    shell.


    You can also start a subshell by entering the shell name (ksh for Korn, sh for
    Bourne, and csh for C Shell). This feature is handy if you have one login (default)
    shell and want to use another. Starting out in Korn Shell and starting C Shell
    would look like the following:


    ```

    $ csh

    % ps -f

    UID PID PPID C STIME TTY TIME CMD

    dhorvath 3662 3657 0 08:10:53 pts/6 0:00 -ksh

    dhorvath 3266 3662 11 10:50:40 pts/6 0:00 ps -f

    dhorvath 9846 3662 1 10:50:53 pts/6 0:00 csh

    %

    ```


    The C shell uses the percent sign as a prompt. After the csh command starts the
    shell, the prompt becomes the percent sign. The ps command shows csh as a child
    process and sub-shell of ksh. To exit csh and return to the parent shell, you
    can use the exit command.


    # Process Permissions


    By default, a process runs with the permissions of the user running it. In most
    cases, this makes sense, enabling you to run a command or utility only on your
    files. There are times, however, when users need to access files that they do
    not own. A good example of this is the passwd command, which is usually stored
    as /usr/bin/passwd. It is used to change passwords and modify /etc/passwd and
    the shadow password file, if the system is so equipped.


    It does not make sense for general users to have write access to the password
    files; they could create users on-the-fly. The program itself has these permissions.
    If you look at the file using ls, you see the letter s where x normally appears
    in the owner and group permissions. The owner of /usr/bin/passwd is root, and
    it belongs to the sys group. No matter who runs it, it has the permissions of
    the root user.


    # Overlaying the Current Process (exec Command)'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'You can use exec to change your shell interpreter completely without creating
    a subshell.


    To convert from ksh to csh, you can use the following:


    ```

    $ exec csh

    % ps -f

    UID PID PPID C STIME TTY TIME CMD

    dhorvath 3662 3667 0 08:10:53 pts/6 0:00 csh

    dhorvath 3266 3662 11 14:50:40 pts/6 0:00 ps -f

    %

    ```


    The prompt changes and ps shows csh instead of ksh but with the original pid and
    start time.


    # Summary


    In this chapter, you looked at the four major topics involving processes provided
    with the shell:


    +   - Starting a process

    +   - Listing running processes

    +   - Killing a process (kill command)

    +   - Manipulating parent and child processes


    As you write scripts and use the shell, knowing how to work with processes improves
    your productivity.


    # Questions


    +   1. How do you run a command in the background?

    +   2. How do you determine which processes you are running?

    +   3. How do you change a foreground process into a background process?


    # Terms


    Background Describes processes usually running at a lower priority and with their
    input disconnected from the interactive session. Input and output are usually
    directed to a file or other process.


    Background processes Autonomous processes that run under UNIX without requiring
    user interaction.


    Child processes See subprocesses.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '**Child shells** See subshells.


    **Parent process identifier** Shown in the heading of the ps command as PPID.
    This is the process identifier of the parent process. See also parent processes.


    **Parent processes** These processes control other processes that are often referred
    to as child processes or subprocesses. See processes.


    **Parent shell** This shell controls other shells, which are often referred to
    as child shells or subshells. The login shell is typically the parent shell.


    **Process identifier** Shown in the heading of the ps command as pid. It is the
    unique number assigned to every process running in the system.


    **Processes** Discrete, running programs under UNIX. The user''s interactive session
    is a process. A process can invoke (run) and control another program that is then
    referred to as a subprocess. Ultimately, everything a user does is a subprocess
    of the operating system.


    **Subprocesses** Run under the control of other processes, which are often referred
    to as parent processes. See processes.


    **Subshells** Run under the control of another shell, which is often referred
    to as the parent shell. Typically, the login shell is the parent shell.'
  merge: -1
  img_proc: true
