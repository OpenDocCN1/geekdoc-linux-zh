    \ -> set to the users response\n\npromptRESPONSE () {\n  RESPONSE=\"\"\n  if [\
    \ $# -lt 1 ]; then\n    return 1\n  fi\n  _RDEFANS=\"${2:-$2}\"\n  _RPROMPT=\"\
