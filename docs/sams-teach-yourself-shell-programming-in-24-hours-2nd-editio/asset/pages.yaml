- pgno: 64
  md: 'changes the name of the file fruits to fruits.sav. There is no output from
    mv if the name change is successful.


    If src does not exist, an error will be generated. For example,


    ```

    $ mv op fritus fruits.sav

    mv: fritus: cannot access: No such file or directory

    ```


    Similar to cp, mv does not report an error if dest already exists. The old file
    is automatically overwritten. This problem can be avoided by specifying the -i
    option (short for interactive). In interactive mode, mv prompts for confirmation
    before overwriting any files.


    Assuming that the file fruits.sav already exists, the command


    ```

    $ mv -i fruits fruits.sav

    ```


    results in a confirmation prompt similar to the following:


    ```

    overwrite fruits.sav?

    ```


    If y (yes) is chosen, the file fruits.sav is overwritten; otherwise the file is
    untouched. The actual prompt varies among the different versions of UNIX.


    # Removing Files (rm)


    The rm command (short for remove) can be used to remove or delete files. Its syntax
    is


    ```

    rm file1 ... fileN

    ```


    Here file1 ... fileN is a list of one or more files to remove. For example, the
    command


    ```

    $ rm fruits users

    ```


    removes the files fruits and users.


    Because there is no way to recover files that have been removed using rm, you
    should make sure that you specify only those files you really want removed. One
    way to ensure this is by specifying the -i option (short for interactive). In
    interactive mode, rm prompts before removing every file. For example, the command


    ```

    $ rm -i fruits users

    ```


    produces confirmation prompts similar to the following:


    ```

    fruits: ? (n/y) y

    users: ? (n/y) n

    ```


    In this case, you answered y (yes) to removing fruits and n (no) to removing users.
    Thus, the file fruits was removed, but the file users was untouched.'
