    As you can see, uniq discarded all but one of the repeated lines.


    The uniq command produces a list of the uniq items in a file by comparing consecutive
    lines. To function properly, its input needs to be sorted. For example, if you
    change fruits.txt as follows


    ```

    $ echo ''

    peach

    peach

