- pgno: 304
  md: '# Questions


    1. Using the for statement, write an awk script that prints each of the fields
    in a record in reverse order.


    2. Write an awk script that balances a checking account. Your program needs to
    print the balance in the account every time the user makes a transaction.


    The transactions are stored in a file. Each line or record in the file has the
    following format:


    ```

    command:date:comment:amount

    ```


    Here date is the date on which the transaction was made, comment is a string (including
    embedded spaces) describing the transaction, and amount is the amount of the transaction.
    The command determines what should be done to the balance with amount. The valid
    commands are


    +   - B indicates balance. When this command is encountered, the balance in the
    account should be set to the transaction amount.

    +   - D indicates a deposit. When this command is encountered, the transaction
    amount should be added to the balance.

    +   - C indicates a check. When this command is encountered, the transaction amount
    should be subtracted from the balance.

    +   - W indicates a withdrawal. When this command is encountered, the transaction
    amount should be subtracted from the balance.


    The main difference between the C (check) and the W (withdrawal) commands is that
    the C (check) command adds an extra field to its records:


    ```

    command:date:comment:number:amount

    ```


    In addition, the B (balance) command uses only two fields:


    ```

    B:amount

    ```


    Here amount is the balance amount in the account.


    For the purposes of this problem, you need to be concerned with the first field,
    which contains the command; the second field, which contains the transaction date;
    and the last field, which contains the transaction amount.


    The sample input file looks like the following:


    ```

    $ cat account.txt

    B:0

    D:10/24/97:initial deposit:1000

    C:10/25/97:credit card:101:100

    W:10/30/97:gas:21.43

    ```'
  merge: -1
  img_proc: true
