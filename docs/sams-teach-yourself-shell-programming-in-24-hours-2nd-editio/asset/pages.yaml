- pgno: 175
  md: '# The if Statement


    The if statement performs actions depending on whether a given condition is true
    or false. The if statement uses the return code of a command to determine whether
    a condition is true or false. A return code of zero is treated as true, whereas
    a non-zero return code is treated as false. The syntax of the if statement is
    as follows:


    ```

    if list1

    then

    list2

    elif list3

    then

    list4

    else

    list5

    fi

    ```


    Both the elif and the else statements are optional. If you have an elif statement,
    you don''t need an else statement and vice versa. An if statement can be written
    with any number of elif statements.


    Because the if statement is treated as a list, it can be also written on a single
    line:


    ```

    if list1 ; then list2 ; elif list3 ; then list4 ; else list5 ; fi ;

    ```


    Usually this form is used only for short if statements.


    The execution of the if statement is as follows:


    +   1. list1 is executed.

    +   2. If the exit code of list1 is 0 (true), list2 is executed and the if statement
    terminates.

    +   3. Otherwise, list3 is executed.

    +   4. If the exit code of list3 is 0 (true), list4 is executed and the if statement
    terminates.

    +   5. If the exit code of list3 is non-zero, list5 is executed.


    # An if Statement Example


    The following example illustrates the use of the if statement:


    ```

    if uencode cherry.gif cherry.gif > cherry.uu ; then

    echo "Encoded cherry.gif to cherry.uu"

    else

    echo "Error encoding cherry.gif"

    fi

    ```'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'Look at the flow of control through this statement:


    +   1. First, the command

    +   `uencode cherry.gif cherry.gif > cherry.uu`

    +   is executed.

    +   2. If this command is successful, the command

    +   `echo "Encoded cherry.gif to cherry.uu"`

    +   is executed and the if statement exits.

    +   3. Otherwise the command

    +   `echo "Error encoding cherry.gif"`

    +   is executed, and the if statement exits.


    You might have noticed that both the if and then statements appear on the same
    line in this example. Most shell programmers prefer to write if statements this
    way in order to make the statement more concise and readable.


    # Common Errors


    Four common errors that can occur when using the if statement are


    +   - Omitting the semicolon (`;`) before the then statement in the single line
    form.

    +   - Using else if or elseif instead of elif.

    +   - Omitting the then statement when an elif statement is used.

    +   - Writing if instead of fi at the end of an if statement.


