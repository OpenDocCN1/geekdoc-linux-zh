- pgno: 252
  md: 'One common use of the -v option is to parse the output of the ps command. For
    example, if you were looking for all instances of bash that were running on a
    system, you could use the following command


    ```

    $ /bin/ps -ef | grep bash

    ```


    Normally the output contains just the information for bash, but sometimes the
    output looks like the following:


    ```

    ranga 3277 3276 2 13:41:45 pts/0 0:02 -bash

    ranga 3463 3277 4 18:38:26 pts/0 0:00 grep bash

    ```


    The second process in this list is the grep command that you just ran. Because
    it is not really an instance of bash, you want to remove it from the output. You
    can do this using the -v option as follows:


    ```

    $ /bin/ps -ef | grep bash | grep -v grep

    ```


    This removes the extraneous output:


    ```

    ranga 3277 3276 0 13:41:45 pts/0 0:02 -bash

    ```


    # Line Numbers


    As grep looks through a file for a given word, it keeps track of the line numbers
    that it has examined. You can have grep list the line numbers along with the matching
    lines by specifying the -n option. When this option is specified, grep''s output
    format is as follows:


    ```

    file:line number:line

    ```


    Here file is the name of the file in which the match occurs, line number is the
    line number in the file on which the matching line occurs, and line is the complete
    line that contains the specified word. For example, the command


    ```

    $ grep -n pipe ch15.doc ch15-01.doc

    ```


    produces the following output:


    ```

    ch15.doc:968:I''ve broken the command into two lines, with the

    character as the

    ch15.doc:971:the right thing and use the next line as the command

    to pipe to. It''s

    ch15.doc:1014:The first few lines look like (ten actually, I piped

    the output to

    ch15-01.doc:964:I''ve broken the command into two lines, with the

    pipe character as the

    ch15-01.doc:966:the right thing and use the next line as the command

    to pipe to. It''s

    ch15-01.doc:1009:The first few lines look like (ten actually, I

    piped the output to

    ```


    As you can see, the lines might be the same in both files, but the line numbers
    are different.'
