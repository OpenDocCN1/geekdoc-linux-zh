- pgno: 136
  md: '# Hour 8


    ![](img/3def70414996f811615f713b2077a154_136_0.png)


    # Variables


    Variables are words that hold a value. The value can be any text string. The shell
    enables you to create, assign, and delete variables. Although the shell manages
    some variables, it is mostly up to the programmer to manage variables in shell
    scripts. By using variables, you can make your scripts flexible and maintainable.


    In this chapter, we will examine the following topics:


    +   - Creating variables

    +   - Accessing variables

    +   - Array variables

    +   - Deleting variables

    +   - Environment variables


    # Working with Variables


    Two types of variables can be used in shell programming:


    +   - Scalar variables

    +   - Array variables'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'Scalar variables can hold only one value at a time. Array variables can hold
    multiple values. This section explores the use of both types of variables.


    # Scalar Variables


    Scalar variables are defined as follows:


    ```

    name=value

    ```


    Here name is the name of the variable, and value is the value that the variable
    should hold. For example,


    ```

    FRUIT=peach

    ```


    defines the variable FRUIT and assigns it the value peach.


    ![](img/3def70414996f811615f713b2077a154_137_0.png)


    > Scalar variables are often referred to as name-value pairs, because a variable''s
    name and its value can be thought of as a pair.


    # Variable Names


    The name of a variable can only contain letters (a to z or A to Z), numbers (0
    to 9), and the underscore character (_). Furthermore, a variable''s name can only
    start with a letter or an underscore. The following are examples of valid variable
    names:


    +   - FRUIT

    +   - FRUIT_BASKET

    +   - TRUST_NO_1

    +   - TWO_TIMES_2


    but 2_TIMES_2_EQUALS_4 is not a valid variable name. To make this a valid name,
    we would need to add an underscore at the beginning of its name: _2_TIMES_2 Variable
    names that start with numbers, such as 1, 2, or 11, are reserved for use by the
    shell. You can use the value stored in these variables, but you cannot set the
    value yourself.'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'The reason you cannot use other characters such as *, ?, or - is that these
    characters have a special meaning for the shell. If you try to create a variable
    name with one of these special characters, it confuses the shell. For example,
    the variable names


    ```

    FRUIT-BASKET

    2*2

    TRUST_NO_1!

    ```


    are invalid names. The error message generated for the first variable name will
    be similar to the following:


    ```

    $ FRUIT-BASKET=apple

    /bin/sh: FRUIT-BASKET=apple: not found.

    ```


    # Variable Values


    You can store or assign any value you want in a variable. For example,


    ```

    FRUIT=peach

    FRUIT=2apples

    FRUIT=apple*pear*kiwi

    ```


    A common error with variables is assigning values that contain spaces. For example,
    the following assignment


    ```

    $ FRUIT=apple orange plum

    ```


    results in this error message:


    ```

    sh: orange: not found.

    ```


    Values that have spaces in them need to be quoted. For example, both of the following
    are valid assignments:


    ```

    $ FRUIT="apple orange plum"

    $ FRUIT=''apple orange plum''

    ```


    The difference between these two quoting schemes is covered in Chapter 10, "Quoting."


    # Accessing Values


    You can access the value stored in a variable by prefixing its name with the dollar
    sign ($). When the shell sees a $, it performs the following actions:


    +   1. Reads the next word to determine the name of the variable.

    +   2. Retrieves the value for the variable. If a value isn''t found, the shell
    uses the empty string "" as the value.

    +   3. Replaces the $ and the name of the variable with the value of the variable.


    ![](img/3def70414996f811615f713b2077a154_138_0.png)'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'This process, known as variable substitution, is covered in greater detail
    in Chapter 9, "Substitution." The following example demonstrates this process:


    ```

    $ FRUIT=peach

    $ echo $FRUIT

    peach

    ```


    In this example, the shell first determines that the variable FRUIT has been referenced.
    Next it looks up the value for FRUIT. Finally the string $FRUIT is replaced with
    peach, the value of FRUIT, which is what the echo command prints.


    If you do not use the dollar sign ($), variable substitution is not performed
    and the name of the variable is used directly. For example,


    ```

    $ echo FRUIT

    FRUIT

    ```


    simply prints out FRUIT, not the value of the variable FRUIT.


    The dollar sign ($) is used only when accessing a variable''s value. It should
    not be used to define a variable or assign a value to a variable. For example,
    the assignment


    ```

    $ SFUIT=apple

    ```


    generates the following error message


    ```

    sh: peach-apple: not found

    ```


    assuming that the value of FRUIT was peach. If the variable FRUIT did not have
    a value, the error would have been


    ```

    sh: =apple: not found

    ```


    # Array Variables


    Arrays are a method for grouping a set of variables together using a single name.
    Instead of creating a new name for each variable you need, you can use a single
    array variable to stores all the variables.


    To understand how arrays work, consider the following example. Say that we are
    trying to represent the chapters in this book using a set of scalar variables.
    We could choose the following variable names to represent some of the chapters:


    +   CH01

    +   CH02

    +   CH15

    +   CH07'
  merge: -1
  img_proc: true
- pgno: 140
  md: "Each of these variable names has a specific format: the letters OH followed\
    \ by the chapter number. This format serves as a way of grouping these variables\
    \ together. An array variable formalizes this grouping by using an array name\
    \ in conjunction with a number known as an index. The index is used to locate\
    \ entries or elements in the array.\n\n![](img/3def70414996f811615f713b2077a154_140_0.png)\n\
    \n> Arrays are not available in Bourne shell. Arrays first appeared in Korn shell,\
    \ ksh, and were adapted by the Z-Shell, zsh. Recent versions (3.0 and newer) of\
    \ the Bourne Again Shell, bash, include support for arrays, but older versions\
    \ do not. Several Linux distributions still ship with the older version of bash.\n\
    > \n> If you are using bash, the following command allows you to determine its\
    \ version:\n> $ echo $BASH_VERSION\n> \n> If the output starts with the string\
    \ '1.' as follows:\n> 1.14.7(1)\n> the version of bash you are using does not\
    \ support arrays. The examples in this section will not work 1.x versions of bash.\n\
    > \n> If the output starts with the string '2.' as follows:\n> 2.03.0(1)-release\n\
    > the version of bash you are using supports arrays. The examples in this section\
    \ will work with 2.0 and newer versions of bash.\n\n# Creating Array Variables\n\
    \nThe simplest method of creating an array variable is to assign a value to one\
    \ of its indices. This is expressed as follows:\n\n```\nname[index]=value\n```\n\
    \nHere name is the name of the array, index is the index of the item in the array\
    \ that you want to set, and value is the value you want to set for that item.\
    \ In ksh, index must be an integer between 0 and 1,023. No such restriction is\
    \ present in bash or zsh. The only restriction is that index must be an integer.\
    \ It cannot be a floating point or decimal number, such as 10.3, or a string,\
    \ such as apr1cot.\n\nAs an example, the following commands\n\n```\n$ FRUIT[0]=apple\n\
    $ FRUIT[1]=banana\n$ FRUIT[2]=orange\n```"
  merge: -1
  img_proc: true
- pgno: 141
  md: 'set the values of the first three items in the array named FRUIT. You could
    do the same thing with scalar variables as follows:


    ```

    $ FRUIT_0=apple

    $ FRUIT_1=banana

    $ FRUIT_2=orange

    ```


    Although this works fine for small numbers of items, the array notation is much
    more efficient for large numbers of items. If you have to write a script using
    the Bourne shell only, you can use this method for simulating arrays.


    In the previous example, the array indices were set in sequence. This is not necessary.
    For example, the following command sets the value of the item at index 10 in the
    FRUIT array:


    ```

    $ FRUIT[10]=plum

    ```


    The shell does not create a bunch of blank array items to fill in the space between
    index 2 and index 10; it just keeps track of those array indices that contain
    values.


    If an array variable with the same name as a scalar variable is defined, the value
    of the scalar variable becomes the value of the element of the array at index
    0. For example, if the following commands are executed


    ```

    $ FRUIT=apple

    $ FRUIT[1]=peach

    ```


    the zeroth element of FRUIT has the value apple. At this point, any accesses to
    the scalar variable FRUIT are treated as an access to the array item FRUIT[0].


    The second form of array initialization can be used to set multiple elements at
    once. The syntax for this form of initialization differs between ksh and bash.
    In ksh, the syntax is as follows:


    ```

    set -A name value1 value2 ... valueN

    ```


    In bash, the syntax is


    ```

    name=(value1 ... valueN)

    ```


    Either style can be used in zsh. Regardless of the style, name is the name of
    the array, and value1 to valueN are the values of the items to be set. When setting
    multiple elements at once, consecutive array indices, beginning at 0, are used.


    For example the ksh command


    ```

    $ set -A band derri terry mike gene

    ```


    or the bash command


    ```

    $ band=(derri terry mike gene)

    ```'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'is equivalent to the following commands:


    ```

    $ band[0]=derri

    $ band[1]=terry

    $ band[2]=mike

    $ band[3]=gene

    ```


    ![](img/3def70414996f811615f713b2077a154_142_0.png)


    > When setting multiple array elements in bash, you can place an array index before
    the value:

    > myarray=( [0]=derri [3]=gene [2]=mike [1]=terry )

    > The array indices don''t have to be in order.


    # Accessing Array Values


    An array variable can be accessed as follows:


    ```

    ${name[index]}

    ```


    Here name is the name of the array, and index is the index of the desired element.
    For example, if the array FRUIT was initialized as in previous examples, the command


    ```

    $ echo ${FRUIT[2]}

    ```


    produces the following output:


    orange


    You can access all the items in an array in one of the following methods:


    ```

    ${name[*]}

    ${name[@]}

    ```


    Here name is the name of the array you are interested in. If the FRUIT array is
    initialized as in previous examples, the command


    ```

    $ echo ${FRUIT[*]}

    ```'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'Assuming that FRUIT is defined as in previous examples, accessing the entire
    array using the following command


    ```

    $ echo ${FRUIT[*]}

    ```


    results in five items, not four:


    apple banana orange passion fruit


    Commands accessing FRUIT using this form of array access get five values, with
    passion and fruit treated as separate items. To get only four items, you have
    to use the following form:


    ```

    $ echo ${FRUIT[@]}

    ```


    The output from this command looks similar to the previous commands:


    apple banana orange passion fruit


    but commands will see only four items because the shell quotes the last item,
    passion fruit, so it is treated as a single item.


    # Read-Only Variables


    A read-only variable is a variable whose value cannot be changed after it is defined.
    Once a variable is specified as read-only, there is no way to get rid of it or
    to modify its value; it and its value persist until the shell exits.


    Variables can be marked read-only using the readonly command. Consider the following
    set of commands:


    ```

    $ FRUIT=kiwi

    $ readonly FRUIT

    $ echo $FRUIT

    kiwi

    $ FRUIT=cantaloupe

    ```


    The last command results in an error message similar to the following:


    ```

    /bin/sh: FRUIT: This variable is read only.

    ```


    As you can see, we can read the value of the variable FRUIT, but we cannot overwrite
    the value stored in it.


    This feature is often used in scripts to make sure that critical variables are
    not overwritten accidentally.


    In ksh, bash, and zsh, readonly can be used to mark both array and scalar variables
    as read-only:


    ```

    $ FRUITBASKET=(apple orange pear)

    $ readonly FRUITBASKET

    ```'
  merge: -1
  img_proc: true
- pgno: 144
  md: '```

    $ echo ${FRUITBASKET[1]}

    orange

    $ FRUITBASKET[1]=kiwi

    ```


    The last command results in an error message similar to the following:


    ```

    sh: FRUITBASKET[1]: is read only

    ```


    This example used the bash style array assignment; if you are using ksh you will
    need to change the first command to the following:


    ```

    $ set -A FRUITBASKET apple orange pear

    ```


    # Unsetting Variables


    *Unsetting* a variable tells the shell to remove the variable from the list of
    variables that it tracks. This is like asking the shell to forget a piece of information
    because it is no longer required.


    Both scalar and array variables can be unset using the *unset* command:


    ```

    unset name

    ```


    Here *name* is the name of the variable to unset. For example, the following command
    unsets the variable FRUIT:


    ```

    unset FRUIT

    ```


    The *unset* command cannot be used to unset variables that have been marked read-only
    via *readonly*. There is no way to unset a read-only variable; it persists until
    the shell exits.


    # Environment and Shell Variables


    When the shell starts a program, it passes that program a set of variables called
    the *environment*. The environment is usually a small subset of the variables
    defined in the shell. Each variable in the environment is called an *environment
    variable*.


    The variables we have examined thus far have been local variables. *Local variables*
    are variables whose value is restricted to a single shell. Local variables are
    not passed to programs started by the shell.


    In addition to local and environment variables, there is a third category of variables
    called *shell variables*. These are special variables set by the shell that are
    required for proper operation of the shell. Some shell variables are environment
    variables, whereas others are local variables.


    Table 8.1 compares these three categories of variables.'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'TABLE 8.1 A Comparison of Local, Environment, and Shell Variables


    | Attribute | Local | Environment | Shell |

    |---|---|---|---|

    | Accessible by child processes | No | Yes | Yes |

    | Set by users | Yes | Yes | No |

    | Set by the shell | No | No | Yes |

    | User modifiable | Yes | Yes | No |

    | Required by the shell | No | No | Yes |


    # Exporting Environment Variables


    Environment variables are just local variables that have been placed into the
    environment via the export command:


    ```

    export name

    ```


    The variable specified by name is placed in the environment. The process of placing
    variables into the environment is often referred to as exporting the variable.
    The standard shell idiom for exporting variables is


    ```

    name=value ; export name

    ```


    An example of this is


    ```

    PATH=/sbin:/bin ; export PATH

    ```


    Here a value is assigned to PATH, and then PATH is exported. Often, the assignment
    statement of an environment variable and the corresponding export statement are
    written on one line to clarify that the variable is an environment variable. This
    helps the next programmer, who has to maintain the script, quickly grasp the use
    of certain variables.


    A single export command can be used to export more than one variable. For example,


    ```

    export PATH HOME UID

    ```


    exports the variables PATH, HOME, and UID to the environment.


    # Exporting Variables in ksh, bash, and zsh


    An alternative form for exporting variables is available in ksh, bash, and zsh:


    ```

    export name=value

    ```


    In this form, the variable specified by name is assigned the specified value and
    then that variable is marked for export. In this form command,


    ```

    export PATH=/sbin:/bin

    ```'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'is equivalent to


    ```

    PATH=$bin:$bin ; export PATH

    ```


    In this form, any combination of name or name=value pairs can be given to the
    export command. For example, the command


    ```

    export FNHOME=/usr/frame CLEARHOME=/usr/atria PATH

    ```


    assigns the specified values to the variables FNHOME and CLEARHOME and then exports
    the variables FNHOME, CLEARHOME, and PATH.


    # Shell Variables


    Shell variables are variables that the shell sets during initialization and uses
    internally. Table 8.2 gives a list of the most common shell variables. Some other
    shell variables are covered in the section "Variable Substitution" in Chapter
    9.


    **TABLE 8.2 Shell Variables**


    | Variable | Description |

    |---|---|

    | PWD | Indicates the current working directory as set by the cd command. |

    | UID | Expands to the numeric user ID of the current user, initialized at shell
    startup. |

    | SHLVL | Increments by one each time an instance of bash is started. This variable
    is useful for determining whether the built-in exit command ends the current session.
    |

    | REPLY | Expands to the last input line read by the read built-in command when
    it is given no arguments. This variable is not available in Bourne shell. |

    | RANDOM | Generates a random integer between 0 and 32,767 each time it is referenced.
    You can initialize the sequence of random numbers by assigning a value to $RANDOM.
    If $RANDOM is unset, it loses its special properties, even if it is subsequently
    reset. This variable is not available in Bourne shell. |

    | SECONDS | Each time this parameter is referenced, it returns the number of seconds
    since shell invocation. If a value is assigned to $SECONDS, the value returned
    on subsequent references is the number of seconds since the assignment plus the
    value assigned. If $SECONDS is unset, it loses its special properties, even if
    it is subsequently reset. This variable is not available in Bourne shell. |

    | IFS | Indicates the Internal Field Separator that is used by the parser for
    word splitting after expansion. $IFS is also used to split lines into words with
    the read built-in command. The default value is the string. \t\n, where \t is
    the space character, \t is the tab character, and \n is the new-line character.
    |'
  merge: -1
  img_proc: true
- pgno: 147
  md: '**TABLE 8.2 continued**


    | Variable | Description |

    |---|---|

    | PATH | Indicates the search path for commands. It is a colon-separated list
    of directories in which the shell looks for commands. A common value is PATH=/bin:/sbin:/usr/bin:/usr/sbin:/usr/local/bin:/usr/ucb
    |

    | HOME | Indicates the home directory of the current user: the default argument
    for the cd built-in command. |


    # Summary


    This chapter covered using variables for shell script programming. You saw how
    scalar and array variables were defined, accessed, and unset. We also looked at
    a special category of variables known as environment variables. In subsequent
    chapters, we will look at how variables are used to achieve a greater degree of
    flexibility and clarity in shell scripts.


    # Questions


    +   1. Which of the following are valid variable names?

