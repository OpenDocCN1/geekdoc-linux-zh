  md: "# Recursion\n\nIn the previous section, you learned about the concept of function\
    \ chaining, where one function calls another function. Recursion is a special\
    \ instance of function chaining in which a function calls itself. The following\
    \ example illustrates the use of recursion:\n\n```\nreverse() {\n  if [ $# -gt\
    \ 0 ]; then\n    typeset arg=$1\n    shift\n    reverse \"$@\"\n    echo \"$arg\
    \ \"\n  fi\n}\nreverse \"$@\"\n```\n\nThis script prints its arguments in reverse\
    \ order. It does so by calling the function reverse with $@ as its arguments.\
    \ The reverse function is really simple; it determines whether there are any arguments.\
    \ If there are no arguments, the function does nothing. Otherwise, it saves the\
    \ first argument, removes it from the argument list using shift and calls itself.\
    \ Once this call returns, the function just prints the argument it saved.\n\n\
    If you name the script reverse.sh and execute it with the arguments a b c, as\
    \ follows:\n\n```\n#!/bin/sh\n\nreadPass () {\n  PASS=''           # clear password\n\
    \  echo -n \"Enter Password: \"  # print the prompt\n  stty -echo        # turn\
    \ off terminal echo to prevent peeping!\n  read PASS         # read the password\n\
    \  stty echo         # restore terminal echo\n  echo              # printout a\
    \ new line to make output nice\n}\n\nreadPass\necho Password is $PASS\n```\n\n\
    The output is\nc\nb\na\n\n![](img/3def70414996f811615f713b2077a154_236_0.png)\n\
    \n> In the previous example, you executed the script using /bin/sh. This will\
    \ not work on Solaris and SunOS systems. On those systems, you need to execute\
    \ the script using /bin/ksh rather than /bin/sh as /bin/sh on Solaris does not\
    \ support the typeset command."
