- pgno: 224
  md: "```\nMSG=\"Failed\"\nif [ $RET -eq 0 ] ; then\n  MSG=\"Done.\"\nfi\necho $MSG\n\
    fi\nfi\n```\n\nYou could simplify the verbose reporting to print a statement after\
    \ the uencode completes, but issuing two statements, one before the operation\
    \ starts and one after the operation completes, is much more user-friendly. This\
    \ method clearly indicates that the operation is being performed.\n\nThe complete\
    \ script is as follows:\n\n```\n#!/bin/sh\nUSAGE=\"Usage: 'basename $0' [-v] [-f]\
    \ [filename] [-o] [filename]\";\nVERBOSE=false\n\nwhile getopts f:o:v OPTION ;\n\
    do\n  case \"$OPTION\" in\n    f) INFILE=\"$OPTARG\" ;;\n    o) OUTFILE=\"$OPTARG\"\
    \ ;;\n    v) VERBOSE=true ;;\n    ?) echo \"$USAGE\"\n       exit 1\n       ;;\n\
    \  esac\ndone\nshift `echo \"$OPTIND - 1\" | bc`\n\nif [ -z \"$1\" ] && [ -z \"\
    $INFILE\" ] ; then\n  echo \"ERROR: Input file was not specified.\"\n  exit 1\n\
    fi\nif [ -z \"$INFILE\" ] ; then\n  INFILE=\"$1\"\nfi\n\n: ${OUTFILE:=${INFILE}.uu}\n\
    \nif [ -f \"$INFILE\" ] ; then\n  if [ \"$VERBOSE\" = \"true\" ] ; then\n    echo\
    \ \"uencoding $INFILE to $OUTFILE... \\c\"\n  fi\n  uencode $INFILE $INFILE >\
    \ $OUTFILE\n  RET=$?\n```"
  merge: -1
