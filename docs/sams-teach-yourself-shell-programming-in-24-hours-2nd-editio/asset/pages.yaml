- pgno: 68
  md: '![](img/3def70414996f811615f713b2077a154_68_0.png)


    # Hour 4


    # Working with Directories


    UNIX uses a hierarchical structure for organizing files and directories, which
    is referred to as a *directory tree*. The tree has a single root node, slash (/);
    all other directories are contained below it.


    Every directory, including /, can store both files and other directories. Every
    file is stored in a directory, and every directory, except /, is stored within
    a directory.


    This is slightly different from the multi-root hierarchical structure used by
    Windows and Mac OS. In those operating systems, all devices (floppy disk drives,
    CD-ROMs, hard drives, and so on) are located at the same top-most level. The UNIX
    model is slightly different, but after you''ve adjusted to it, it is extremely
    convenient.


    This chapter introduces the directory tree and shows you how to manipulate its
    building blocks: directories. Specifically, the topics we will cover are


    +   - The Directory tree

    +   - Switching directories

    +   - Listing files and directories

    +   - Manipulating directories'
