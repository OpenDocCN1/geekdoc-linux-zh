    # The tail Command


    The tail command is used to display the last few lines of a file. Its basic syntax
    is similar to that of the head command:


    ```

    tail [-n lines] files

    ```


    Here files is the list of the files the tail command should process. Without the
    -n lines option, the tail command shows the last 10 lines of its standard input.
    When this option is specified, tail shows the number of lines specified by lines
    instead.


    To illustrate the use of the tail command, consider the problem of generating
    a list of the five oldest mail spools located in /var/spool/mail. You can start
    with ls -t command again, but this time you''ll just use the -t (sort by last
    modified time) option:'
