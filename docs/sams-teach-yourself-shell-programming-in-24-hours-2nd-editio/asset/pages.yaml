    Next, the function creates two internal variables, _RDEFANS and _RPROMPT:


    ```

    _RDEFANS="${2:-$2}"

    _RPROMPT="?$1 _RDEFANS:{ $_RDEFANS } "

    ```


    The variable _RDEFANS holds the default answer and is set to the value of $2,
    but only if a second argument was specified. The variable _RPROMPT holds the question
    and is based on the value of $1 and _RDEFANS.


    Next, the function enters an infinite while loop that exits when the user provides
    a valid response to the question stored in _RPROMPT. The while loop first prints
    the prompt and then reads the response into the variable RESPONSE:


    ```

    printf " $ _RPROMPT"

    read RESPONSE

    ```


    Variable substitution then ensures that RESPONSE contains a value or a default
    value:


    ```

    RESPONSE="${RESPONSE:-$_RDEFANS}"

    ```


    If RESPONSE contains a value, the loop terminates by issuing break; otherwise
    the loop sets RESPONSE to null and repeats:


    ```

    if [ -n "$RESPONSE" ] ; then

    break

    fi

    RESPONSE=""

    ```


    The function then unsets the variables that store the prompt and the default answer
    and exports the variable RESPONSE to the environment in order to ensure that this
    variable is available to commands executed after the function completes. Finally,
    the function returns 0:


    ```

    unset _RDEFANS _RPROMPT

    export RESPONSE

    return 0

    ```


