- pgno: 414
  md: "# Adapting getPID for BSD\n\nRecall the getPID function introduced in Chapter\
    \ 21:\n\n```\ngetPID() {\n    if [ $# -lt 1 ]; then\n        echo 'ERROR: Insufficient\
    \ Arguments.' >&2\n        return 1\n    fi\n\n    PSOPTS='-ef'\n    /bin/ps $PSOPTS\
    \ | grep \"$1\" | awk '/grep/ { next; } { print $2; }'\n}\n```\n\nThis function\
    \ works correctly only on systems where the ps -ef command produces a listing\
    \ of all running processes. On BSD systems and older Linux systems, you need to\
    \ use the command\n\nps -auxw\n\nto get the correct output. This command works\
    \ correctly on BSD system but older Linux systems produce the following warning\
    \ message:\n\n> warning: '-...' deprecated; use 'ps -aux', not 'ps -auxw'\n\n\
    By using the getOSName function given earlier in this chapter, you can adapt the\
    \ getPID function to work with the BSD, Linux, and System V versions of ps. The\
    \ modified version of getPID is as follows:\n\n```\ngetPID() {\n    if [ $# -lt\
    \ 1 ]; then\n        echo 'ERROR: Insufficient Arguments.' >&2\n        return\
    \ 1\n    fi\n\n    case `getOSName` in\n        bsd|sun|sunos|linux|darwin)\n\
    \            PSOPTS='-auxw' ;;\n        *)\n            PSOPTS='-ef' ;;\n    esac\n\
    \n    /bin/ps $PSOPTS 2>/dev/null | grep \"$1\" | \\\n    awk '/grep/ { next;\
    \ } { print $2; }'\n}\n```"
  merge: -1
  img_proc: true
- pgno: 415
  md: "The two main changes to the function are\n\n+   - A case statement sets the\
    \ variable PSOPTS based on the operating system name.\n+   - The STDERR of ps\
    \ is redirected to /dev/null in order to discard the warning message generated\
    \ on older versions of Linux.\n\n# Linux ps\n\nIn Linux the ps command varies\
    \ between different versions. In older versions of Linux 2.0, the hyphen in the\
    \ -auxx command is not properly supported, whereas in current versions the hyphen\
    \ is supported, as are the System V style -ef options. Taking this into account,\
    \ you could modify the getPID() function as follows:\n\n```\ngetPID() {\n  if\
    \ [ $# -lt 1 ]; then\n    echo \"ERROR: Insufficient Arguments.\" >&2\n    return\
    \ 1\n  fi\n\n  PSOPTS=\"-ef\"\n  case `getOSName` in\n    bsd|sunOS|darwin)\n\
    \      PSOPTS=\"-auxx\" ;;\n    linux)\n      case `uname -r` in\n        [01].*)\
    \ PSOPTS=\"-auxx\" ;;\n        2.0*) PSOPTS=\"-auxx\" ;;\n      esac\n      ;;\n\
    \  esac\n\n  `/bin/ps $PSOPTS | grep \"$1\" |`\n  awk '/grep/ { next; } { print\
    \ $2; }'\n}\n```\n\nThis version avoids having to redirect to /dev/null and allows\
    \ you to detect any problems that might be reported by the ps command.\n\n# Summary\n\
    \nIn this chapter, you learned how to determine which version of UNIX is running\
    \ using uname. In addition, you developed the getOSName and isNS$ functions to\
    \ help adapt shell scripts to multiple versions of UNIX. You also looked at the\
    \ following techniques for improving the portability of shell scripts:\n\n+  \
    \ - Conditional execution\n+   - Abstraction"
  merge: -1
