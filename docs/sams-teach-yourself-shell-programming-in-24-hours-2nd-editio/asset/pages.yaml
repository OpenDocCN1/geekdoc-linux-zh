    73). If the user agrees (line 74), you do the following:


    +   1. Try to delete the line from the copy of the address book. Store the modified
    version in a different file (line 79).

    +   2. Replace the copy of the address book with the modified copy (line 84).


    If either of these operations fails, you exit (lines 80 and 85).


    After the deletions are finished, you make a backup of the original address book
    (line 93). Then you replace the address book with the edited version (line 98).
    Again you exit if either operation fails (lines 94 and 99).


    Finally you clean up and exit.


    Here is an example of this script in action:


    ```

    $ ./delperson Sriranga

    Name: Sriranga Veeraraghavan

    Email: sriranga@berkeley.edu

    Address: 1150 Wondell Dr, San Jose CA

    Phone: 408-444-4444


    Delete this entry [y/n] [n] y

    ```'
