- pgno: 291
  md: '# Variables


    Variables in awk are similar to variables in the shell; they are words that hold
    a value.


    The basic syntax of defining a variable is


    ```

    name=value

    ```


    Here name is the name of the variable and value is the value of that variable.
    For example, the following awk command


    ```

    fruit="peach"

    ```


    creates the variable fruit and assigns it the value peach. There is no need to
    initialize a variable; the first time you use it, it is automatically initialized.


    Like the shell, the name of a variable can contain only letters, numbers, and
    underscores. A variable''s name cannot start with a number.


    You can assign both numeric and string values to a variable in the same script.
    For example, consider the following awk commands:


    ```

    fruit="peach"

    fruit=100

    ```


    The first command assigns the value peach to the variable fruit. The second command
    assigns the value 100 to the variable fruit.


    The value that you assign to a variable can also be the value of another variable
    or a field. For example, the following awk commands


    # Using Numeric Expressions


    You can also assign a variable the value of a numeric expression. Numeric expressions
    are commands that add, subtract, multiply, and divide two numbers and are of the
    form


    ```

    num1 operator num2

    ```'
  merge: -1
  img_proc: true
- pgno: 292
  md: "Here num1 and num2 can be constants, such as 1 or 2, or variable names. operator\
    \ is one of the numeric operators listed in Table 17.2. The action specified by\
    \ operator is performed on num1 and num2, and the answer is returned. For example,\
    \ the following awk commands\n\n```\na=1\nb=a+1\n```\n\nassign the value 2 to\
    \ the variable b.\n\n# TABLE 17.2 Numeric Operators in awk\n\n| Operator | Description\
    \ |\n|---|---|\n| + | Add |\n| - | Subtract |\n| * | Multiply |\n| / | Divide\
    \ |\n| % | Modulo (Remainder) |\n| ^ | Exponentiation |\n\n> If num1 or num2 is\
    \ the name of a variable whose value is a string rather than a number, awk uses\
    \ the value 0 rather than the string.\n> If a variable that has not yet been created\
    \ is used, awk creates the variable and assigns it a value of 0.\n\nAs an example\
    \ of using numeric expressions, let's look at a script that counts the number\
    \ of blank lines in a file:\n\n```\n#!/bin/sh\nfor i in $@ ;\ndo\n    if [ -f\
    \ $i ] ; then\n        echo $i\n        awk '/^$/ { x=x+1 ; print x ; }' $i\n\
    \    else\n        echo \"ERROR: $i not a file.\" >&2\n    fi\ndone\n```\n\nIn\
    \ the awk command, you increment the variable x and print it each time a blank\
    \ line is encountered. Because a new instance of the awk command runs for each\
    \ file, the count is unique for each file."
