- pgno: 69
  md: '# The Directory Tree


    To understand the origin and advantages of the directory tree, let''s consider
    a project that requires organization. Writing a book. When you start out, it is
    easiest to put all the documents related to the book in one location. As you work
    on the book, you might find it hard to locate the material related to a particular
    chapter.


    If you are writing the book with pen and paper, the easiest solution to this problem
    is to take all the pages related to the first chapter and put them into a folder
    labeled Chapter 1. As you write more chapters, you can put the material related
    to these chapters into separate folders. If you stick to this method, you will
    have many separate folders by the time you finish the book. You might put all
    the folders into a box and label that box with the name of the book. (Then you
    can stack the boxes in your closet.)


    By grouping the material for the different chapters into folders and grouping
    the folders into boxes, the multitude of pages required to write a book becomes
    organized and easily accessible. When you want to see Chapter 5 from a particular
    book, you can grab that box from your closet and look at the folder pertaining
    to Chapter 5.


    You can use this same method for projects on a computer. When you start out, all
    the files for the book might be in your home directory, but as you write more
    chapters, you can create directories to store the material relating to a particular
    chapter. Finally, you can group all of those directories into a directory named
    after the book.


    As you can probably see, this arrangement creates an upside-down tree with a root
    at the top and directories branching off from the root. The files stored in the
    directories can be thought of as leaves.


    This brings up the notion of parent directories and child subdirectories. For
    example, consider two directories A and B, where directory A contains directory
    B. In this case, A is called the parent of B, and B is called a child of A.


    The only limitation on the depth of the directory tree is that the absolute path
    to a file cannot have more than 1,024 characters. Absolute paths are covered later
    in the chapter.


    # Filenames


    Every file and directory has a name associated with it. This name is referred
    to as that file or directory''s filename. Every file and directory is also associated
    with the name of its parent. When a filename is combined with the parent directory''s
    name, the result is called a pathname. Two examples of pathnames are


    ```

    /home/ranga/docs/book/ch5.doc

    ```


    ```

    /usr/local/bin/

    ```'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'As you can see, a pathname consists of several words separated by slashes,
    /. The individual words in a pathname are the names of files or directories. Taken
    together, the words and the slashes make up the pathname. The last word in a pathname
    is the actual name of the file or directory being referenced. The rest of the
    words are the names of its parent directories. In the first pathname of the previous
    example, the filename is ch5.doc.


    Strictly speaking, a filename can be up to 255 characters long and can contain
    any ASCII character except /. In general, the characters used in pathnames are
    the alphanumeric characters (a to z, A to Z, and 0 to 9) along with periods (.),
    hyphens (-), and underscores (_). Other characters, such as space, tab, and the
    shell''s special characters ([, ], $, &, *, ?, {, }, |, \, '', ", <, >, ;, and
    :) are usually avoided because many programs cannot deal with them properly. For
    example, consider a file with the following name:


    ```

    A Farewell To Arms

    ```


    Most programs will treat this as four separate files named A, Farewell, To, and
    Arms. A workaround for this problem is covered in Chapter 10, "Quoting."


    One thing to keep in mind about filenames is that two files in the same directory
    cannot have the same name. Both of the following pathnames refer to the same file:


    ```

    /home/ranga/docs/ch5.doc

    /home/ranga/docs/ch5.doc

    ```


    whereas the following pathnames refer to the different files:


    ```

    /home/ranga/docs/ch5.doc

    /home/ranga/docs/books/ch5.doc

    ```


    Filenames are also case sensitive: You can have two files in the same directory
    whose names differ only by case. For example, the following pathnames refer to
    different files:


    ```

    /home/ranga/docs/ch5.doc

    /home/ranga/docs/CH5.doc

    ```


    # Pathnames


    In order to access a file or directory, its pathname must be specified. As you
    have seen, a pathname consists of two parts: the name of the directory and the
    names of its parents. UNIX offers two ways to specify the names of the parent
    directory, leading to two types of pathnames:


    +   - Absolute

    +   - Relative'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# An Analogy for Pathnames


    The following statements illustrate the difference between absolute and relative
    pathnames:

    "I live in San Jose."

    "I live in San Jose, California, USA."

    The first statement gives only the city in which I live. It does not give any
    more information, thus it is a relative location. It could be located in any state
    or country containing a city called San Jose. The second statement fully qualifies
    the location, thus it is an absolute location.


    # Absolute Pathnames


    An absolute pathname represents the location of a file or directory starting from
    the root directory and listing all the directories between the root and the file
    or directory of interest. Because absolute pathnames list the path from the root
    directory, they always start with the slash (/) character. Regardless of what
    the current directory is, an absolute path points to an exact location of a file
    or directory. The following is an example of an absolute pathname:


    ```

    /home/ranga/work/bugs.txt

    ```


    This absolute path tells you that the file bugs.txt is located in the directory
    work, which is located in the directory ranga, which in turn is located in the
    directory home. The slash at the beginning of the path tells you that the directory
    home is located in the root directory.


    # Relative Pathnames


    A relative pathname enables you to access files and directories by specifying
    a path to that file or directory within your current directory. When your current
    directory changes, the relative pathname to a file can also change.


    To find out what the current directory is, use the pwd command (short for print
    working directory), which prints the name of the directory in which you are currently
    located. For example,


    ```

    $ pwd

    /home/ranga/pub

    ```


    tells us that the current directory is /home/ranga/pub.

    When you''re specifying a relative pathname, the slash character is not present
    at the beginning of the pathname. The relative pathname is a list of the directories
    located between your current directory and the file or directory you are representing.'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'If you are pointing to a directory in your pathname that is below your current
    one, you can access it by specifying its name. For example, the directory name
    docs/ refers to the directory docs located in the current directory.


    In order to access the current directory''s parent directory or other directories
    at a higher level in the tree than the current level, use the special name of
    two dots (..). The UNIX filesystem uses two dots (..) to represent the directory
    above you in the tree, and a single dot (.) to represent your current directory.


    Let''s look at an example that illustrates how relative pathnames are used. Assuming
    that the current directory is


    /home/ranga/work


    the relative pathname


    ../docs/ch5.doc


    represents the file


    /home/ranga/docs/ch5.doc


    whereas


    ./docs/ch5.doc


    represents the file


    /home/ranga/work/docs/ch5.doc


    You can also refer to this file using the following relative path:


    docs/ch5.doc


    You do not have to append / to the beginning of pathnames referring to files or
    directories located within the current directory or its subdirectories.


    # Switching Directories


    Now that we have covered the basics of the directory tree, let''s look at moving
    around the tree using the cd (short for change directory) command.


    # Home Directories


    First print the working directory:


    ```

    $ pwd

    /home/ranga

    ```'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'The preceding example should indicate to you that I am in my home directory.
    Your home directory is the initial directory where you start when you log in to
    a UNIX machine. The easiest way to determine the location of your home directory
    is to do the following:


    ```

    $ cd

    $ pwd

    /home/ranga

    ```


    When you issue the cd command without arguments, it changes the current directory
    to your home directory. After the cd command completes, the pwd command prints
    the working directory, which happens to be your home directory.


    # Changing Directories


    You can use the cd command to do more than change to a home directory; it can
    be used to change to any directory by specifying a valid absolute or relative
    path. The syntax is as follows:


    ```

    cd dir

    ```


    Here dir is the name of the directory that you want to change to. For example,
    the command


    ```

    $ cd /usr/local/bin

    ```


    changes to the directory /usr/local/bin. Regardless of the directory we were in
    before, this command always places us in the directory /usr/local/bin. That is
    the advantage of using an absolute path. Let''s look at another example. Say that
    the current directory is


    ```

    $ pwd

    /home/ranga

    ```


    From this directory, we can cd to the directory /usr/local/bin using the following
    relative path:


    ```

    $ cd ../../usr/local/bin

    ```


    Changing the current directory means that all your relative path specifications
    must be relative to the new directory rather than the old one. For example, consider
    the following sequence of commands:


    ```

    $ pwd

    /home/ranga/docs

    $ cat names

    ranga

    vatthaa

    anna

    $ cd /usr/local

    ```'
  merge: -1
  img_proc: true
- pgno: 74
  md: '```

    $ cat names

    cat: cannot open names

    ```


    When the first cat command was issued, the working directory was /home/ranga/docs.
    The file, names, was located in this directory, thus the cat command found it
    and displayed its contents.


    After the cd command, the working directory became /usr/local. Because there was
    no file called names in that directory, cat produced an error message stating
    that it could not open the file. To access the file names from the new directory,
    you need to specify either the absolute path to the file or a relative path from
    the current directory.


    # Common Errors


    The most common errors with cd are


    +   - Specifying more than one argument

    +   - Trying to cd to a file

    +   - Trying to cd to a directory that does not exist


    An example of specifying more than one argument is seen here:


    ```

    $ cd /home /tmp /var

    $ pwd

    /home

    ```


    As you can see, cd uses only its first argument. The other arguments are ignored.
    Sometimes, in shell programming, this becomes an issue. When you issue a cd command
    in a shell script, you need make sure that you end up in the correct directory.


    Let''s now take a look at trying to cd to a file. An example of this is as follows:


    ```

    $ pwd

    /home/ranga

    $ cd docs/ch5.doc

    cd: docs/ch5.doc: Not a directory

    $ pwd

    /home/ranga

    ```


    Here, we tried to change to a location that was not a directory, and cd reported
    an error. If this error occurs, the working directory does not change. The output
    from pwd illustrates this.


    Finally, let''s try to cd to a directory that does not exist:


    ```

    $ pwd

    /home/ranga

    $ cd final_exam_answers

    cd: final_exam_answers: No such file or directory

    ```'
  merge: -1
  img_proc: true
