    "^M" can be removed from a file by using the tr command as follows:


    ```

    tr -d ''\015'' < file > newfile

    ```


    Here file is the name of the file that contains the carriage returns, and newfile
    is the name you want to give the file after the carriage returns have been deleted.
    You are using the octal representation \015 for carriage return, because the escape
    sequence \r is not correctly interpreted by some versions of tr.


    # Summary


    This chapter has looked at some common questions encountered in shell programming.
    These questions and their answers will help you write bigger and better scripts.


    Now that you have finished all 24 chapters, you have learned about using both
    the basics of the shell and its advanced features. As you continue to program,
    use this book as a reference to help you remember the intricacies of shell programming.


    I hope that you learned not only to program efficiently using the shell but also
    to enjoy shell programming. Thanks for reading!'
