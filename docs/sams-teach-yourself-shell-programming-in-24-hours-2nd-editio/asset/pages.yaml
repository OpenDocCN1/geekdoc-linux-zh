    ```

    cp: Downloads is a directory (not copied).

    ```


    Although cp reports an error for the directory Downloads, the other files are
    correctly copied to the directory Documents.


    # Renaming Files (mv)


    The mv command (short for move) can be used to change the name of a file. The
    basic syntax is


    ```

    mv src dest

    ```


    Here src is the original name of the file and dest is the new name of the file.
    For example, the command


    ```

    $ mv fruits fruits.sav

    ```'
