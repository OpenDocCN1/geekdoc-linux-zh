    # Changing the Input Field Separator


    The input field separator, FS, controls how awk breaks up fields in an input line.
    The default value for FS is the string " " (a space followed by a tab). Because
    most commands, such as ls or ps, use spaces or tabs to separate columns, this
    default value enables you to easily manipulate their output using awk.


    You can manually set FS to any other characters in order to influence how awk
    breaks up an input line. Usually, this character is changed when you look through
    system databases, such as /etc/passwd. The two methods available for changing
    FS are


    +   - Manually resetting the FS in a BEGIN pattern

    +   - Specifying the -F option to awk


    As an example, let''s set FS to a colon (:) using the following BEGIN pattern:


    ```

    ```

    BEGIN { FS=":"; }

    ```

    ```


    The following awk invocation is equivalent to the BEGIN pattern:


    ```

    ```

    awk -F '':'' { ''...'' }

    ```

    ```'
  merge: -1
