- pgno: 104
  md: '![](img/3def70414996f811615f713b2077a154_104_0.png)


    # Hour 6


    # Manipulating File Attributes


    In addition to files and directories, UNIX supports several special file types
    along with a set of attributes for each file and directory. Shell scripts are
    often called upon to create special files and manipulate file attributes. This
    chapter discusses the following topics related to special files and file attributes:


    +   - Creating links

    +   - Modifying file permissions

    +   - Modifying file ownership and group membership


    # File Types


    UNIX files can contain important data and executable programs or they can represent
    devices, directories, or pointers to other files. This section looks at the different
    types of files available under UNIX.'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# Determining a File''s Type


    You can determine a file''s type by using the -l option of the ls command. When
    this option is specified the output of ls contains a file''s type and its attributes
    in addition to its name. For example, the command


    ```

    $ ls -l /home/ranga/profile

    ```


    produces the following output:


    ```

    -rwxr-xr-x 1 ranga users 2368 Jul 11 15:57 .profile*

    ```


    As you can see, the very first character in the output is a hyphen (-). This indicates
    that this is a regular file. For special files, the first character is one of
    the letters given in Table 6.1. The subsequent sections describe each of these
    special files in detail.


    TABLE 6.1 Special Characters for Different File Types


    | Character | File Type |

    |---|---|

    | - | Regular file |

    | l | Symbolic link |

    | c | Character special |

    | b | Block special |

    | p | Named pipe |

    | d | Directory file |


    To obtain file type information for a directory, you need to specify the -d option
    along with the -l option. For example, in order to obtain file type information
    for the directory /home/ranga, you use the following command:


    ```

    $ ls -ld /home/ranga

    ```


    This produces the following output:


    ```

    drwxr-xr-x 27 ranga users 2048 Jul 23 23:49 /home/ranga/

    ```


    # Regular Files


    Regular files are the most common type of files on UNIX systems. They can be used
    to store any kind of data, including binary data that the system can execute.
    Often determining that a file is a regular one tells you very little about the
    file. Usually you need to know whether a particular file is a binary program,
    a shell script, or a C language library. In these instances, the file command
    is very useful. Its syntax is as follows:


    file filename'
  merge: -1
  img_proc: true
- pgno: 106
  md: "Here, filename is the name of the file you want more information about. For\
    \ example, the command:\n\n```\n$ file /bin/sh\n```\n\nwill produce output similar\
    \ to the following:\n\n```\n/bin/sh: ELF 32-bit MSB executable SPARC Version 1,\n\
    \tstatically linked, stripped\n```\n\nBased on this output, you can tell that\
    \ the file, /bin/sh, is an executable program for SPARC-based system. The output\
    \ on your system will most likely be different.\n\n# Links\n\nA link is a file\
    \ that points to another file on the system. Links are useful for maintaining\
    \ multiple copies of a file in several locations on the system without using up\
    \ storage for the copies. Because a link just points to another file, changing\
    \ the content of the link alters the content of the original file. Similarly,\
    \ altering the content of the original file appears to alter the content of the\
    \ link.\n\nUNIX supports two types of links, hard links and symbolic links.\n\n\
    # Hard Links\n\nA hard link is a special directory entry that points to another\
    \ file. Hard links have some limitations:\n\n+   - A hard link cannot point to\
    \ a directory: it can only point to a file.\n+   - Hard links are indistinguishable\
    \ from the file that it points to: there is no way to tell if a particular file\
    \ is a hard link or the original file.\n\nHard links can be created using the\
    \ ln (short for link) command. Its syntax is as follows:\nln src target\nHere\
    \ src is the pathname that the pathname target should point to. For example, if\
    \ you want the hard link banana to point to the file apple, you can create the\
    \ link as follows:\n$ ln apple banana\nIf there is a problem creating the hard\
    \ link, ln displays an error message; otherwise, it displays no output.\nWhen\
    \ a hard link is moved from one directory to another, it can continue to point\
    \ to the original file without any problems. For example, consider the following\
    \ commands:\n$ echo I drink lemonade in the summer > lemonade\n$ cat lemonade\n\
    I drink lemonade in the summer"
  merge: -1
  img_proc: true
- pgno: 107
  md: '```

    $ ln lemonade summer_drink

    $ cat summer_drink

    $ ln -s lemonade in the summer

    $ mv summer_drink ..

    $ cat ../summer_drink

    $ cat lemonade in the summer

    ```


    As you can see from the output, the file summer_drink continues to point to the
    original file even after it is moved out of the directory where it was created.


    When a hard link is removed, the original file that it points to is not affected;
    only the link is deleted. If the original file is deleted, the entry for the original
    file is removed, but its content remains on disk until the link is deleted. For
    example:


    ```

    $ echo Pomegranates are very juicy > juicy

    $ ln juicy pomegranate

    $ cat pomegranate

    Pomegranates are very juicy

    $ rm juicy

    $ cat pomegranate

    Pomegranates are very juicy

    cat: juicy: No such file or directory

    ```


    As you can see the file pomegranate continues to point to the content of the file
    juicy even after the file juicy has been removed.


    > If a file has multiple hard links to it, simply removing the file will not be
    sufficient to free up the disk space; you will have to remove all of the hard
    links to that file.


    # Symbolic Links


    A symbolic link or symlink is a special file that stores a pathname to another
    file. When a symlink is accessed, the system automatically reads the pathname
    stored in the symlink and accesses the file corresponding to that pathname, thus
    a symlink can point to any file on the system. The pathname stored in a symlink
    can be an absolute or relative pathname. If a relative pathname is stored, it
    is relative to the directory where the link is located rather than the current
    working directory.


    The ls -l output for a symbolic link looks similar to the following:


    ```

    lrwxrwxrwx 1 root root 9 Oct 23 13:58 /bin/ -> ./usr/bin/

    ```'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'Symlinks are created by using the -s option of ln. The syntax is as follows:


    ```

    ln -s src target

    ```


    Here src is the pathname that target should point to. For example, if you want
    to create the symlink citrus that points to the file lime, you can use the following
    command:


    ```

    ln -s lime citrus

    ```


    If there is a problem creating the symlink, ln displays an error message; otherwise,
    it displays no output.


    If a symlink is created using a relative path, then it may not work properly when
    moved from the directory in which it was created to another directory. For example:


    ```

    $ echo Persimmons are bitter until they ripen > persimmon

    $ ln -s persimmon bitter

    $ cat bitter

    Persimmons are bitter until they ripen

    $ mv bitter ..

    $ cat ../bitter

    cat: ../bitter: No such file or directory

    $ ls -l ..

    lrwxrwxrwx 1 root root 9 Jan 13 00:16 ../bitter@ -> persimmon

    ```


    As you can see from the output, the link bitter correctly pointed to the file
    persimmon while the two files were located in the same directory. When bitter
    was moved, the link stopped working because a file named persimmon did not exist
    in bitter''s new directory. This problem can be avoided by using absolute paths
    when creating symlinks.


    When a symlink is removed the file it points to is not affected. When the file
    that a symlink points to is removed or moved to a different location the symlink
    will cease to function properly. For example:


    ```

    $ echo Plums were plentiful this year > plums

    $ ln -s plums plentiful

    $ cat plentiful

    Plums were plentiful this year

    $ rm plums

    $ cat plentiful

    cat: plentiful: No such file or directory

    $ ls -l plentiful

    lrwxr-xr-x 1 ranga wheel 5 Jan 13 00:25 plentiful -> plums

    ```


    As you can see from the output, the link plentiful points to the file plums even
    after that file has been removed. This causes the error message from cat.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# Common Errors


    Two common errors encountered when creating links occur when


    +   - target already exists.

    +   - target is a directory.


    If target is a file, ln will not create the requested link. For example, if the
    file .exrc exists in the current directory, the following command:


    ```

    $ ln -s /etc/exrc .exrc

    ```


    produces the following error message:


    ```

    ln: cannot create .exrc: File exists

    ```


    If target is a directory, ln creates the link in that directory with the same
    filename as src. For example, if the directory pub exists in the current directory,
    the following command:


    ```

    $ ln -s /home/ftp/pub/ranga pub

    ```


    creates the link pub/ranga rather than complaining that the destination is a directory.


    Forgetting about this behavior is a common source of problems in shell scripts.


    # Device Files


    In UNIX, devices, such as hard drives, keyboards, and printers, are accessed via
    device files. There are two types of device files: character special files and
    block special files.


    Device files are normally located in the /dev directory.


    # Character Special Files


    Character special files provide a mechanism for communicating with a device one
    character at a time. Usually character devices represent a "raw" device. The output
    of ls -l on a character special file looks like the following:


    ```

    crw------- 1 ranga users 4, 0 Feb 7 13:47 /dev/tty0

    ```


    The first letter in the output, c, indicates that this is a character special
    file. The two extra numbers before the date are known as the major and minor device
    numbers. UNIX uses these two numbers to identify the device driver that is connected
    to the character special file.


    # Block Special Files


    Block special files provide a mechanism for communicating with devices by transferring
    large blocks of data rather than single characters. Block special files are typically
    used to'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'access hard drives and removable media. The output of ls -l on a block special
    file looks like the following:


    ```

    brw-rw---- 1 root disk 8, 0 Feb 7 13:47 /dev/sda

    ```


    The first letter in the output, b, indicates that this file is a block special
    file. The major and minor numbers for the file identify the device driver that
    is connected to the block special file.


    # Named Pipes


    An important feature of UNIX is that you can redirect the output of one program
    to the input of another program with very little work. For example, the following
    command:


    ```

    $ who | grep ranga

    ```


    takes the output of the who command and makes it the input to the grep command.
    On the command line, temporary anonymous pipes are used, but sometimes a program
    needs more control over the communication channel. Named pipes are files that
    act just like temporary anonymous pipes on the command line.


    Named pipes can be created using the mkfifo command. Its syntax is as follows:


    ```

    mkfifo file

    ```


    Here file is the filename that you want to give to the pipe. For example, the
    following command creates a named pipe with the filename mypipe:


    ```

    $ mkfifo mypipe

    ```


    The ls -l output for this named pipe will be similar to the following:


    ```

    prw-r--r-- 1 ranga wheel 0 Nov 22 17:39 mypipe

    ```


    The first character, p, indicates that this file is a named pipe.


    # Owners, Groups, and Permissions


    File permissions and file ownership are important components of UNIX because they
    provide a secure method for storing files. Every file in UNIX has the following
    attributes:


    +   - Owner permissions

    +   - Group permissions

    +   - Other (world) permissions


    The owner''s permissions determine which actions the owner of the file can perform
    on the file. The group''s permissions determine which actions a user, who is a
    member of the'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'group that a file belongs to, can perform on the file. The permissions for
    others indicate which action all other users can perform on the file.


    The actions that can be performed on a file are read, write, and execute. If a
    user has read permissions, that user can view the contents of a file. A user with
    write permissions can change the contents of a file, whereas a user with execute
    permissions can execute that file.


    # Viewing Permissions


    The ls -l command displays the permissions of a file. For example, the following
    command:


    ```

    $ ls -l .profile

    ```


    produces the following output:


    ```

    -rwxr-xr-x 1 ranga users 2368 Jul 11 15:57 .profile

    ```


    From the output, you can tell that this is a regular file. The characters that
    appear after the first dash (-) indicate the permissions for the file. After the
    permissions, the owner and the group are listed. For this file, the owner is ranga
    and the group is users.


    The first three characters indicate the permissions for the owner of the file,
    the next three characters indicate the permissions for the group of the file,
    and the last three characters indicate the permissions for all other users. The
    significance of the individual characters is explained in Table 6.2.


    Table 6.2 Basic Permissions


    | Letter | Permission | Definition |

    |---|---|---|

    | r | Read | The user can view the contents of the file. |

    | w | Write | The user can alter the contents of the file. |

    | x | Execute | The user can run the file, which is likely a program. For directories,
    the execute permission must be set in order for users to access the directory.
    |


    The permissions for the file in the previous example indicates that the user has
    read, write, and execute permissions, whereas members of the group users and all
    other users have only read and execute permissions.


    # Directory Permissions


    The x bit on a directory grants access to the directory. The read and write permissions
    have no effect if the access bit is not set. The read permission on a directory
    enables users to use the ls command to view files and their attributes that are
    located in the'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'directory. The write permission on a directory allows users to add and remove
    files from the directory. A directory that grants a user only execute permission
    will not enable the user to view the contents of the directory or add or delete
    any files from the directory, but it will let the user run executable files located
    in the directory.


    > To ensure that your files are secure, check both the file permissions and the
    permissions of the directory where the file is located.

    > If a file has write permission for owner, group, and other, the file is insecure.

    > If a file is in a directory that has write and execute permissions for owner,
    group, and other, all files located in the directory are insecure, no matter what
    the permissions are on the files themselves.


    # SUID and SGID File Permission


    Often when a command is executed, it will have to be executed with special privileges
    in order to accomplish its task. As an example, when you change your password
    with the passwd command, your password is stored in the file /etc/shadow. As a
    regular user, you do not have read or write access to this file for security reasons,
    but when you change your password, you need to have write permission to this file.
    This means that the passwd program has to give you additional permissions so that
    you can write to the file /etc/shadow.


    Additional permissions are given to programs via a mechanism known as the Set
    User ID (SUID) and Set Group ID (SGID) bits. When you execute a program that has
    the SUID bit enabled, you inherit the permissions of that program''s owner. Programs
    that do not have the SUID bit set are run with the permissions of the user who
    started the program. When a program is executed, it normally executes with the
    group permissions of the user. A file that has the SGID bit will be executed using
    those group permissions.


    As an example, the passwd command used to change your password is owned by the
    root and has the set UID bit enabled. When you execute it, you effectively become
    the root while the command runs.


    The SUID and SGID bits appear as the letter s if SUID or SGID permission has been
    enabled on that file. The SUID bit is located in the permission bits where the
    owners who execute permission would normally reside. For example, the following
    command:


    ```

    $ ls -l /usr/bin/passwd


    produces the following output:


    -r-sr-xr-x 1 root bin 10831 Feb 7 13:47 /usr/bin/passwd*

    ```'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'which shows that the SUID bit is set and that the root owns the command. If
    a capital letter S appears instead of the lowercase s it indicates that the execute
    bit is not set.


    The SUID bit or sticky bit imposes extra file removal permissions on a directory.
    A directory with write permissions enabled for a user enables that user to add
    and delete any files from this directory. If the sticky bit is enabled on the
    directory, files can be removed only if you are one of the following users:


    +   - The owner of the sticky directory

    +   - The owner of the file being removed

    +   - The super user, root


    You should consider enabling the sticky bit for any directories to which non-privileged
    users can write. Examples of such directories include temporary directories and
    public file upload sites.


    Directories can also take advantage of the SGID bit. If a directory has the SGID
    bit set, any new files added to the directory automatically inherit that directory''s
    group, instead of the group of the user writing the file.


    # Changing File and Directory Permissions


    The chmod command changes the permissions on a file or directory. Its syntax is
    as follows:


    ```

    chmod expression files

    ```


    Here, expression is a statement that indicates how the permissions are to be changed.
    There are two types of expressions: symbolic and octal. The symbolic expression
    method uses letters to alter the permissions, and the octal expression method
    uses numbers. The numbers in the octal method are base-8 (octal) numbers ranging
    from 0 to 7.


    # Symbolic Method


    A symbolic expression uses syntax of the form:


    ```

    (who)(action)(permissions)

    ```


    Table 6.3 shows the possible values for who. Table 6.4 shows the possible actions,
    and Table 6.5 shows the possible permissions settings. Using these three reference
    tables, you can build expressions.'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'TABLE 6.3 who


    | Letter | Represents |

    |---|---|

    | u | Owner |

    | g | Group |

    | o | Other |

    | a | All |


    TABLE 6.4 actions


    | Symbol | Represents |

    |---|---|

    | + | Adding permissions to the file |

    | - | Removing permissions from the file |

    | = | Explicitly set the file permissions |


    TABLE 6.5 permissions


    | Letter | Represents |

    |---|---|

    | r | Read |

    | w | Write |

    | x | Execute |

    | t | Sticky bit |

    | s | SUID or SGID |


    Now let''s look at a few examples of using chmod. To give the "world" read access
    to all files in a directory, you can use one of the following commands:


    `$ chmod a+r *`

    `$ chmod guo+r *`


    If the command is successful, there is no output.


    To stop anyone except the owner of the file .profile from writing to it, try this:


    `$ chmod go-w .profile`


    To deny access to the files in your home directory, you can try one of the following
    commands:


    `$ cd ; chmod go+ *`

    `$ cd ; chmod go-rwx *`'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'When specifying the user''s part or the permission''s part, the order in which
    you give the letters is irrelevant. Thus these commands are equivalent:


    ```

    $ chmod gouo+rX

    $ chmod uog+rX

    ```


    If you need to apply more than one set of permission changes to a file or files,
    you can use a comma-separated list. For example:


    ```

    $ chmod go-w,a+x a.out

    ```


    removes the groups and "world" write permission on a.out and adds the execute
    permission for everyone.


    To set the SUID and SGID bits for your home directory, try the following:


    ```

    $ cd ; chmod ug+s .

    ```


    So far, the examples we have examined involve changing the permissions for files
    in a directory. However, chmod also enables you to change the permissions for
    every file in a directory (including the files in subdirectories) by using the
    -R option.


    For example, if the directory pub contains the following directories:


    ```

    $ ls pub

    ```


    ./  ../  README  faqs/  src/


    you can change the permission read programs read the file README along with the
    files contained in the directories faqs and src with the following command:


    ```

    $ chmod -R o+r pub

    ```


    # Octal Method


    By changing permissions with an octal expression, you can only explicitly set
    file permissions. This method uses a single number to assign the desired permission
    to each of the three categories of users (owner, group, and other). The values
    of the individual permissions are the following:


    +   - Read permission has a value of 4

    +   - Write permission has a value of 2

    +   - Execute permission has a value of 1


    Adding the value of the permissions that you want to grant will give you a number
    between 0 and 7. This number will be used to specify the permissions for the owner,
    group, and finally the other category.'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'Setting SUID and SGID using the octal method places these bits out in front
    of the standard permissions. The permissions SUID and SGID take on the values
    4 and 2, respectively.


    Let''s look at some of the examples to get an idea of how to use the octal method
    of changing permissions. In order to set the "world" read access to all files
    in a directory, do the following:


    ```

    chmod 0444 *

    ```


    To stop anyone except the owner of the file .profile from writing to it, do this:


    ```

    chmod 0600 .profile

    ```


    # Common Errors


    Many new users find the octal specification of file permissions confusing. The
    most important point to keep in mind is that the octal method sets or assigns
    permissions to a file, but it does not add or delete them. This means that the
    octal mode does not have an equivalent to


    ```

    chmod u+rwx .profile

    ```


    The closest possible octal version is


    ```

    chmod 0600 .profile

    ```


    But it removes permissions for everyone except the user. It can also reduce the
    user''s permissions by removing that user''s execute permission.


    # Changing Owners and Groups


    The chown (short for change owner) changes the ownership of a file, whereas the
    chgrp (short for change group) changes the group membership of a file. The chgrp
    command is not available on some older systems, thus the chown command must be
    used in its place. This section shows how to use both chown and chgrp to change
    the group of a file.


    # Changing Ownership


    The chown command changes the ownership of a file. The basic syntax is as follows:


    ```

    chown user:group files

    ```


    Here, user is the name of a user on the system or the user ID (uid) of a user
    on the system, group is the name of a group on the system or the group ID (GID)
    of a group on the system, and files is a list of files to apply the changes to.
    If group is omitted, only the owner of the file is changed. If user is omitted,
    only the group of the file is changed. The following example illustrates the use
    of this command to change the owner of a file:


    ```

    chown ranga:/home/http/html/users/ranga

    ```


    ![](img/3def70414996f811615f713b2077a154_116_0.png)'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'This changes the owner of the given directory to the user ranga. The following
    example illustrates the use of chown to change just the group of a file:


    ```

    chown :authors /home/ranga/docs/ch5.doc

    ```


    In this case the group of the given file is changed to the group authors.


    The chown command will recursively change the ownership of all files when the
    -R option is included. For example, the command


    ```

    chown -R ranga: /home/httpd/html/users/ranga

    ```


    changes the owner of all the files and subdirectories located under the given
    directory to be the user ranga.


    The super user, root, has the unrestricted capability to change the ownership
    of a file, but some restrictions occur for normal users. Normal users can change
    only the owner of files they own.


    ![](img/3def70414996f811615f713b2077a154_117_0.png)


    > Be careful when using the chown command. If you give another user ownership
    of a file, you cannot regain ownership of that file. Only the new owner of the
    file or the super user can return the ownership to you.


    On some systems, the chown command is disabled for normal user use. This generally
    happens if the system is running disk quotas. Under a disk quota system, users
    might be allowed to store only 100MB of files, but if they change the ownership
    of some files, their free available disk space increases, and they still have
    access to their files.


    # Changing Group Ownership


    The chgrp command changes the group membership of a file. The syntax of this command
    is as follows:


    ```

    chgrp group files

    ```


    Here group can be either the name of a group or the GID of a group on the system
    and files is a list of files to apply the changes to. For example, the command:


    ```

    chgrp authors /home/ranga/docs/ch5.doc

    ```


    changes the group of the given file to be the group authors. Just like chown,
    all versions of chgrp understand the -R option also.'
  merge: -1
  img_proc: true
