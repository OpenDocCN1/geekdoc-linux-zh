    \nif [ \"`getSpaceUsed /var/tmp`\" -gt 10000 ] ; then\nprintWARNING \"You're using\
    \ to much space!\"\nfi\n```\n\n# Obtaining a Process ID by its Process Name\n\n\
    One of the difficulties with the ps command is that it is difficult to obtain\
    \ the process ID (PID) of a command by specifying its process name. This capability\
    \ is essential in scripts that start and stop processes. The next function in\
    \ the library provides this capability.\n\n```\n# Name: getPID\n# Desc: Outputs\
    \ a list of process id matching $1\n# Args: $1 -> the command name to look for\n\
    \ngetPID() {\n    if [ $# -lt 1 ] ; then\n        return 1\n    fi\n\n    PSOPTS=\"\
    -ef\"\n    /bin/ps $PSOPTS | grep \"$1\" | grep -v grep | awk '{ print $2; }'\n\
    }\n```\n\nAs you can see, this function is a set of filters for the output of\
    \ the command /bin/ps -ef. The first grep command looks for all lines that match\
    \ the first argument. As an example, executing this on the command line produces\
    \ output similar to the following:\n\n```\n$ /bin/ps -ef | grep sshd\n```\n\n\
    Here you are looking for all the lines that contain the word sshd. The output\
    \ might be similar to the following:\n\n```\nroot 1449 1 8 12:23:06 ? 0:02 /opt/bin/sshd\n\
    ranga 1451 944 5 12:23:08 pts/0 0:00 grep sshd\n```\n\nAs you can see, the output\
    \ contains two lines. The first one contains the process ID of the command that\
    \ you are looking for, but the second contains the process ID of the grep command\
    \ that you executed. In order to ignore such lines, the command grep -v grep is\
    \ used in the pipeline. Finally, awk extracts the process ID, which is stored\
    \ in the second"
