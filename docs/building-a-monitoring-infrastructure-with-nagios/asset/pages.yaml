  md: '# Foundations, MRTG, and RRDTool 141


    In UNIX, epoch is considered to be January 1, 1970 00:00:00 UTC. Tracking seconds
    in this way makes working with time easier on programmers. You can use the date
    command to convert into epoch seconds, like this:


    ```

    date +%s

    ```


    You can convert back to a human-readable format, like this:


    ```

    date -d "Jan 1, 1970 UTC + 1157605000 seconds"

    ```


    Because I do a lot of this sort of thing, I find it handy to add the following
    line to my .bash_profile.


    ```

    export EP=''Jan 1, 1970 UTC''

    ```


    That way, I can convert from epoch seconds back to Gregorian, like this:


    ```

    date -d "${EP} + 1157605000 seconds"

    ```


    Getting back to our example, line 3 defines our data source. DS definitions are
    colon-separated. The syntax is


    ```

    DS:<DS NAME>:<DS TYPE>:<HEARTBEAT>:<MIN>:<MAX>

    ```


    You may name the DS anything you want and later, you will refer to this name when
    you graph or export data from the RRD. The DS TYPE is either COUNTER or GAUGE,
    as already discussed. The heartbeat, minimum, and maximum values should be self-explanatory
    by nature. I''ve named the data source inOct specified it as a counter. The heartbeat
    is twice the size of the step, specified in seconds. This means that the polling
    engine can be late by an entire step before you use the data for the polling interval.


    When you with counters, it''s good form to set minimum and maximum values. These
    help RRDTool to do internal sanity checking, ensuring your hard-won data is accurately
    stored and depicted. My SNMP client informed me that inOctets counter is type
    32-bit INT, in this example, I set the minimum value to 0 and the maximum to 4,294,967,295
    (2^32-1). For gauges, no math needs to be done, so if I were working with a gauge
    metric, I would have specified U:U.'
