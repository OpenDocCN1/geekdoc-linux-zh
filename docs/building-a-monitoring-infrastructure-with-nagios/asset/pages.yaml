  md: 'Two things you want to change in the nagios.cfg are the location of your object
    config files and the check_external_commands directive. There are two ways to
    specify the location of your object configs. You may either list each object definition
    file specifically with a cfg_file directive, as shown in Listing 4.2, or you may
    specify a directory with the cfg_dir directive, as shown in Listing 4.3. If you
    specify a directory, Nagios parses every file that ends in .cfg in the specified
    directory.


    # Listing 4.2 Specifying object config files individually.


    ```

    cfg_file=/usr/local/nagios/etc/contactgroups.cfg

    cfg_file=/usr/local/nagios/etc/contacts.cfg

    cfg_file=/usr/local/nagios/etc/escalations.cfg

    cfg_file=/usr/local/nagios/etc/hostgroups.cfg

    cfg_file=/usr/local/nagios/etc/hosts.cfg

    cfg_file=/usr/local/nagios/etc/servicegroups.cfg

    ```


    # Listing 4.3 Specifying object config files by directory.


    ```

    cfg_dir=/usr/local/nagios/etc/

    ```


    Next, if you wish the CGI commands in the web interface to work, or you want to
    use external commands in general (as described in Chapter 2, “Theory of Operations”),
    you should tell Nagios to accept external commands from the command file with
    the following line:


    ```

    check_external_commands=1

    ```


    For external commands to work, the command file must exist in the location specified
    in the nagios.cfg, and its permissions must be set correctly. This is all taken
    care by if you run make install-commandmode at time.


    Although those two changes you get up and running, there are a few directives
    in nagios.cfg you should be aware of. These break down into two types: global
    enablers and global time-outs. Table 4.2 describes the global enablers. You should
    remember these because they enable or disable important features, programmable.


    # Table 4.2 Global Enablers in the nagios.cfg


    | Name | Description |

    | --- | --- |

    | execute_service_checks | Setting this to 0 turns off service checks program-.
    Defaults to 1 (on). |

    | accept_passive_service_checks | Setting this to 0 turns off passive service
    checks. Defaults to 1 (on). For a detailed discussion of passive checks, refer
    to Chapter 2. |'
