  md: '# Foundations, MRTG, and RRDTool


    These two numbers, when combined with the step, work out to the total length of
    time your stays in the RRD before it is overwritten. For example, the step in
    the example is 1 minute, so a PDP value of 10 consolidates 10 minutes'' worth
    of data. Therefore, keeping 5 of these consolidated data points gets you 50 minutes''
    worth of data. A handy formula for deriving the numbers from these values is


    ```

    (step*PDPs*CDP''s) /86400 = x days

    ```


    That''s the number of PDPs to consolidate times the number of CDPs to keep times
    the step, all over the number of seconds in a day. In practice, the polling engine
    usually dictates the step for you, and you usually know how much you want to consolidate
    and how many days you want to keep the data. In other words, most people need
    a formula for deriving the number of CDPs to keep. You can derive this from the
    last formula by solving for CDPs. This gets you


    ```

    (86400*days) / (step*PDPs)=CDPs

    ```


    In Listing 7.1, I create three RRAs. The first effectively gathers raw data for
    one month (The PDP value of 1 says that I want to average one PDP into a CDP.
    The average value is the value over one, so nothing is really consolidated.) I
    keep 43,200 of these points, using the formula (1*60*43200=30 days). Using the
    first formula, you can easily see what the other RRAs do. The second consolidates
    the data into 5-minute chunks and keeps 1 year'' worth. The third consolidates
    even more, keeping 2 years of data consolidated into 10-minute chunks. For homework,
    create an RRA for Listing 7.1 that keeps 5 years'' worth of 1-hour chunks (This
    is the type of problem you will be solving when you work with RRDTool). The second
    formula makes this problem easy.


    It''s possible to store as many data sources as you want in a single round database,
    but new ones can be added post-creation (easily). In Listing 7.2, I add an additional
    counter DS for Octets, so you can track the bytes coming and going out of your
    router in the same RRD.


    # Listing 7.2 Creating a multi-counter RRD.


    ```

    rrdtool create Router_netCounters.rrd \

    --start 115765000 --step 60 \

    DS:inOctets:COUNTER:120:0:4294967296 \

    DS:outOctets:COUNTER:180:0:4294967296 \

    RRA:AVERAGE.:5:1:432000 \

    RRA:AVERAGE.:5:5:105120 \

    RRA:AVERAGE.:5:10:505120

    ```'
