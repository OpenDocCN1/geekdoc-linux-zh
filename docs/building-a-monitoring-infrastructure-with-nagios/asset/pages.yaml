- img_proc: true
  md: '# Who''s Watching the Watchers?


    # Watching Ports Vers Watching Applications


    In the “Processing and Overhead” section, earlier in the chapter, we briefly discussed
    redundant plugins that monitored a Web server. One plugin simply connected to
    port 80 on the Web server, while the other attempted to login to the Web site
    hosted by the server. The latter plugin is an example of what is increasingly
    referred to as End to End (E2E) Monitoring, which makes use of the monitored services
    in the same way as user. Instead of monitoring port 25 on a server, the E2E approach
    would be to send an email through the system. Instead of monitoring the processes
    required for CIFS, an E2E plugin would tend to mount a shared drive, and so on.


    While monitoring more overhead individually, E2E plugins could easily lighten
    the load when used to replace several of their conventional counterparts. A set
    of plugins monitors a Web application by checking the Web ports, database services,
    and application server availability might be replaced by a single plugin that
    logs into the Web site and makes query. E2E plugins tend to be “smarter.” That
    is, they catch more problems by virtue of detecting the attempted use of a service,
    rather than switching points of likely failure. For example, an E2E plugin that
    parses the contents of a Web site can find and alert on a problem, where a simple
    port watcher cannot.


    Sometimes that’s a good thing and sometimes it isn’t. What E2E gains in rate of
    detection, it loses in resolution. What I mean by is, with E2E, you often know
    that there is a problem but not the problem actually resides, which can be bad
    when the problem is actually in a completely unrelated system. For example, an
    E2E plugin that watches an email system can detect failure and send notifications
    in the event of a DNS outage, because the mail servers cannot perform MX lookups
    and, therefore, cannot send this. This makes E2E plugins susceptible to what some
    might consider false alarms, so they should be used sparingly.


    A problem in unrelated infrastructure, which affects a system for ferrying funds,
    is something bank management needs to know about, regardless of the root cause.
    E2E is great at catching failures in unexpected places and can be a lifesaver
    when used on systems for problem detection is absolutely critical.


    Adoption of E2E is slow among the commercial monitoring systems, because it’s
    difficult to predict what customers’ need are, which makes it hard to write agent
    software. On the other hand, Nagios excels at sort of application-layer monitoring
    because it makes no assumptions about how you want to monitor staff, so extending
    Nagios’ functionality is usual. More on plugins and how they work is in Chapter
    2, “Theory of Operations.”


    # Who''s Watching the Watchers?


    If there is a fatal flaw in the concept of systems monitoring, it is the use of
    untrustworthy systems to watch other untrustworthy systems. If your monitoring
    system fails, it’s important you are at least informed of it. A failover system
    to pick up where the failed system left off is even better.'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'The specifics of your network dictate what needs to happen when the monitoring
    system fails. If you are bound by strict SLAs, then uptime reports are a critical
    part of your business, and a failover system should be implemented. Often, it''s
    enough to simply know that the monitoring system is down.


    Failure-proofing monitoring systems is a messy business. Unless you work at a
    tier 1 ISP, you''ll always hit some upstream dependency that you have no control
    over, if you go high enough into the topology of your network. This does not negate
    the necessity of a plan.


    Small shops should at least have a secondary system, such as a syslog box, or
    some other piece of infrastructure that can heartbeat the monitoring system and
    send an alert if things go wrong. Large shops may want to consider global monitoring
    infrastructure, either provided by a company that sells such solutions or by maintaining
    a mesh topology of hosted Nagios boxes in geographically dispersed locations.


    Nagios makes it easy to mirror state and configuration information across separate
    boxes. Configuration and state are stored as terse, clear text files by default.
    Configuration syntax hooks make event mirroring a snap, and Nagios can be configured
    in distributed monitoring scenarios with multiple Nagios servers. The monitoring
    system may be the system most in need of monitoring; don''t forget to include
    it in the list of critical systems.'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# CHAPTER 2


    # Theory of Operations


    Because the job of the monitoring server is to verify the availability of other
    systems, and every environment runs a subtly different combination of systems,
    the monitoring server has to be flexible. It needs to give input to, and understand,
    the output of every protocol spoken by every system in your specific environment.


    Most monitoring programs attempt to provide this flexibility by guessing in advance
    every possible thing you could want to monitor and including it as a software
    feature. Designing a monolithic piece of software that knows how to monitor everything
    makes it necessary to modify that piece of software when you want to monitor something
    new. Unfortunately, this is usually not possible, given the licensing restrictions
    of most commercial packages. Unfortunately, you''re all stuck implementing it
    yourself in a proprietary scripting language that runs in a proprietary interpreter,
    embedded in the monolithic monitoring software. The reasoning goes that, because
    the program is directly designed for a specific feature set, a special purpose
    language must be used to extend its functionality.


    As you can imagine, this approach presents a few problems. The complexity of the
    software may be the largest impact. Many large monitoring packages have GUIs with
    menu 10 to 15 selections deep. The agent software becomes bloated quickly, often
    larger than 500Mb per server. Security is difficult to manage because the monitoring
    program assumes you want the entire feature set available on every monitored host,
    and this makes it difficult to limit the monitoring server''s access to its clients.
    The package, as a whole, is only as good as the predictions of the vendor''s development
