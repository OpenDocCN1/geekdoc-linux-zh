  md: '# Introduction


    Chapter 1. This should get you thinking in terms of what needs to take place for
    your monitoring initiative to be successful, such as how to go about implementing,
    who to involve, and what pitfalls to avoid.


    Chapter 2, “Theory of Operations,” builds on Chapter 1''s general design guidance
    by providing a theoretical overview of Nagios from the ground up. Rather than
    inundating you with configuration minutiae, Chapter 2 gives you a detailed understanding
    of how Nagios works without being overly specific about configuration directives.
    This knowledge will go a long way toward making configuration more transparent.


    Before we configure Nagios to monitor our environment, we need to install it.
    Chapter 3, “Installing Nagios,” should help you install Nagios, either from source
    or via package manager.


    Chapter 4, “Configuring Nagios,” is the dreaded configuration chapter. Nagios
    for the first time is not something most people consider to be, but I hope I''ve
    kept it painless as possible by taking a bottom-up approach, only documenting
    the most-used and required directives, providing up-front-examples, and specifying
    exactly what objects refer to other objects and how.


    Most people who find Nagios attached to is a universal complaint, it is certainly
    configuration, and loathe anything else. But if there Chapter 5, “Bootstrapping
    the Configs,” takes a bit of a digestion to document some of the tools available
    to make configuration easier to stomach. These include automated discovery tools,
    as well as graphical interfaces.


    In Chapter 6, “Watching,” you are finally ready to get into the nifty-itty of
    watching systems, which includes specific examples of Nagios plugin configuration
    syntax and how to solve real-world problems. I begin with a section on Microsoft
    Windows boxes, followed by a section on UNIX, and finally the “Other Stuff” section,
    which encompasses networking gear and environmental sensors.


    Chapter 7, “Visualization,” covers one of my favorite topics: data visualization.
    Good data visualization problems that cannot be solved otherwise, and I''m excited
    about the options that exist now, as well as what''s on the horizon. With fantastic
    visualization tools such as RRDTD and no fewer than 12 different layers to choose
    from, graphing time data from Nagios is getting easier every day, but this chapter
    doesn''t stop at mere line graphs.


    And now that you know the rules, it''s time to teach you how to break them. In
    the time of writing Chapter 8, “The Nagios Event Broker Interface,” it was the
    only documentation I''m aware of to cover the new Nagios Event Broker interface.
    The Event Broker is the most powerful Nagios interface available. Mastering it
    rewards you with nothing less than the ability to rewrite Chapter 2 for yourself
    by fundamentally changing any aspect of how Nagios operates or extending it to
    meet any need you might have. I describe how the Event Broker works and walk you
    through building an NEB module.'
  merge: -1
