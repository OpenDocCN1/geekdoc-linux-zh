  md: "# Chapter 4 Configuring Nagios\n\nIf Nagios runs the check_command and it fails,\
    \ then it will place the host in a soft down state, and retry the check_command\
    \ as many times as specified by max_check_attempts. If the check_command fails\
    \ each time, then the host is placed in a hard down state, notifications are performed,\
    \ services on the host are assumed down, and service-related checks and notifications\
    \ on the host are postponed until the check_command returns an okay state. Setting\
    \ max_check_attempts to effectively disables soft states for the host. If the\
    \ check_command fails once, it is immediately placed in a hard down state and\
    \ notifications are sent.\n\nThe four directives are notification-related and\
    \ answer the questions \"Who?,\" \"What?,\" \"When?\" and \"How often?\" If the\
    \ host changes into one of the hard states specified by the notification_options\
    \ directive, and that change occurs during the time period specified by the notification_period,\
    \ notifications will be sent to the groups specified by the contact_groups directive.\
    \ For problem states, follow-up notifications will be sent so often until the\
    \ host recovers. Exactly how often is specified by the notification_interval.\
    \ Technically, the notification_interval specifies the number of time units to\
    \ wait between notifications. The interval_length directive the nagios.cfg specifies\
    \ the number of seconds in a time unit. The default is one minute, so a notification_interval\
    \ of 30 equates to 30 minutes, unless you changed it.\n\n# Services\n\nRequired\
    \ for daemon start\n\nRefers to: host, timeperiod, contactgroup, command\nferred\
    \ by: servicegroup, servicedependency, serviceescalation, serviceextendedinfo\n\
    \n# Listing 41.1 Service example.\n\n```\ndefine service{\n  host_name myServer\n\
    \  service_description check-disk-sdal\n  check_command check-disk!/dev/sdal\n\
    \  max_check_attempts 5\n  normal_check_interval 5\n  retry_check interval 3\n\
    \  check_period 24x7\n  notification_interval 30\n  notification_period 24x7\n\
    \  notification_options W,C,r\n  contact_groups admins\n}\n```"
  merge: -1
