  md: '# Who Should Read This Book?


    If you are a systems administrator with a closet of UNIX systems, Windows systems,
    and assorted network gadgetry, and you need a world-class monitoring system on
    the cheap, this book is for you. Contrary to what you might expect, building monitoring
    systems is not a trivial undertaking. Constructing the system that potentially
    interacts with every TCP-based device in your environment requires a bit of knowledge
    on your part. But don''t forget that you pause; systems monitoring has taught
    me more than anything I''ve done in my career and, in my experience, no matter
    what level of your knowledge, working with monitoring systems has a tendency to
    constantly challenge your assumptions, deepen your understanding, and keep you
    right on the edge of what you know.


    To get the most out of this book, you should have a good handle on the text-based
    Internet protocols that you use regularly, such as SMTP and HTTP. Although it
    interacts with Windows servers very well, Nagios is meant to run on Linux, which
    makes the Linux-heavy, a passing familiarity with UNIX-like systems is helpful.
    Although not strictly required, you should also have some programming skills.
    The book has a fair number of code listings, and I''ve tried to keep them as straightforward
    and easy-to-follow as possible. With the exception of Chapter 8, which is exclusively
    C, the code listings are written in either UNIX shell or Perl.


    Perhaps the only strict requirement is that you approach the subject matter with
    a healthy dose of open curiosity. If something seems unclear, don''t be discouraged;
    check the online documentation, ask on the lists, or even shoot me an email; I''d
    be glad to help if I can.


    For more information, as well as full-color diagrams and code listings, visit
    http://www.skeptech.org/nagiosbook.'
