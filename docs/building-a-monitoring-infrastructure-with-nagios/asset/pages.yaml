  md: '# CHAPTER 6


    # Watching


    Welcome to where the rubber meets the road. Until now, I''ve talked a lot about
    how Nagios works and how it is installed and configured. This chapter ties together
    the theoretical work of the previous chapters and the details of performing systems
    monitoring. As pointed out throughout this book, Nagios is a scheduling and notification
    framework. Small, single-purpose programs called plugins do the monitoring. As
    an in-depth discussion about monitoring is mostly a discussion about plugins.


    Nagios is limited only by the availability of plugins for a given task. Writing
    your own plugins, as described in Chapter 2, "Theory of Operations," is trivial
    and highly encouraged, so hundreds of them are available. This chapter gives you
    a good basis to understand what types of plugins are available, how to use them,
    and where to begin when you need to start making your own. The chapter is broken
    into four parts, along architectural lines, with a section about local queries,
    Microsoft Windows, UNIX, and "other stuff," which includes networking gear and
    environmental sensors.


    # Local Queries


    There are three primary ways to monitor hosts and services with Nagios. Nagios
    can use various remote execution techniques to connect to remote hosts and run
    plugins. Nagios can wait in a passive mode for remote hosts to notify it of trouble
    by defining passive checks. Finally, Nagios can launch plugins locally to query
    the availability of various hosts and services from afar. Let''s start by checking
    some of the things Nagios can do without leaving home.'
  merge: -1
  pgno: 109
- img_proc: true
  md: "# Pings\n\nBy far, the most common service check in any monitoring program\
    \ is the classic ICMP request, more commonly known as the ping. Although pings\
    \ are easy to set up in Nagios, they can be somewhat confusing to first-time users\
    \ because, at first glance, they appear to be overused or redundant.\n\nAt a minimum,\
    \ Nagios requires that there be at least one service per host. The most common\
    \ service to set up is a ping service because it is a simple definition, and if\
    \ you're using the example configs, there is already a ping check defined for\
    \ you. As discussed in Chapter 4, “Configuring Nagios,” each host definition also\
    \ contains a check_command directive that specifies the command to use to verify\
    \ that the host is operational. This usually defaults to the check_host_alive\
    \ command, which, in turn, uses ping. So why have two ping checks per host? It's\
    \ important to remember, as described in the “Scheduling” section in Chapter 2,\
    \ host check commands are not scheduled unless they are needed. In practice, the\
    \ host check command is not run until a service check has already failed. Thus,\
    \ although the checks exist for different purposes,\n\nLet's walk through setting\
    \ up a simple ping check. The hosts and contacts are already defined, the first\
    \ step is to define the command in the check_commands file. Definitions, as described\
    \ in Chapter 4, glue service definitions to external monitoring programs. The\
    \ purpose of the check command is to tell Nagios what external command to launch\
    \ and how. A command definition for ping check might look like Listing 6.1.\n\n\
    # Listing 6.1 Check_ping command definition.\n\n```\ndefine command{\n  name \
    \   check_ping\n  command_line $USER$/check_ping -H $HOSTADDRESS$ -w $ARG1 -c\
    \ $ARG2 -p 5\n}\n```\n\nListing 6.1 is a classic example of a Nagios command definition.\
    \ They get simpler than this, but not by much. The -H switch is nearly always\
    \ used to specify the hostname or IP of the box against which to run the plugin.\
    \ Likewise, -w and -c nearly always specify the warning and critical thresholds.\
    \ The check_ping plugin uses the -p switch to specify how many packets to send.\n\
    \nThe words surrounded by dollar signs are macros. Macros are described in Chapter\
    \ 4. When Nagios actually calls check_ping, it first replaces the macro names\
    \ with real values from various places. For example, the numbered macros will\
    \ be replaced with values from arguments in the service definition. Speaking of\
    \ which, a service definition such as the one in Listing 6.2 is the next step\
    \ in setting up your ping check."
  merge: -1
  pgno: 110
- img_proc: true
  md: "# Listing 6.2 Check_ping service definition.\n\n```\ndefine service{\n  host_name\
    \ Server\n  service_description check_ping\n  check_command check_ping!500.0,20%!1000.0%60\n\
    \  max_check_attempts 5\n  normal_check_interval 5\n  retry_check_interval 3\n\
    \  check_period 24x7\n  notification_interval 30\n  notification_period 24x7\n\
    \  notification_options W,c,r\n  contact_groups admins\n}\n```\n\nThis service\
    \ defines that the check_ping command is run against the server every 5 minutes,\
    \ for 24 hours a day, 7 days a week. If something goes wrong, Nagios verifies\
    \ that the problem persists by checking the service four more times, 3 minutes\
    \ after. After verified, Nagios begins notifying the admins group every 30 minutes,\
    \ for 24 hours a day, 7 days week, until the service comes back online.\n\nMany\
    \ of the options in Listing 6.2 are better specified inside a template, for of\
    \ brevity, the rest of the service definitions in this chapter assume that you\
    \ use a template, such as the one in Listing 6.3. See the “Templates” section\
    \ in Chapter 4 for a discussion of templates and how to use them.\n\n# Listing\
    \ 6.3 The template used by the rest of the examples in this chapter.\n\n```\n\
    define service{\n  name chapter6template\n  max_check_attempts 5\n  normal_check_interval\
    \ 5\n  retry_check_interval 3\n  check_period 24x7\n  notification_interval 30\n\
    \  notification_period 24x7\n  contact_groups admins\n  register 0\n}\n```\n\n\
    What comes after check_ping in Listing 6.2’s check_command directive is a list\
    \ of arguments. Arguments in service definitions usually specify thresholds and\
    \ are separated by comma points, so there are two arguments here. The first, 500,\
    \ 20 percent, says that Nagios should generate a warning if the pings packets\
    \ round-trip time is greater than 500 milliseconds, or if the packet loss is greater\
    \ than 20 percent. (The argument doesn't explicitly state that it is the warning\
    \ threshold bout, because the $ARG1$ macro is the argument to the w"
