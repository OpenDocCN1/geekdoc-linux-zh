    # Environmental Sensors


    In the last few years, environmental sensors have been popping up all over the
    place. With the popularity of the low cost lm78 chip from Semiconductor, just
    about with a micro-controller or micro-processor in it has form of onboard monitoring
    available these days. It''s sometimes questionable how sensitive or well calibrated
    these sensors are in low-end hardware, but most server-grade equipment possessing
    sensors is usable in my experience.


    The original lm78 was a special purpose micro-controller with an onboard sensor
    and inputs for monitoring up to three fans, two voltage sources, and additional
    external temperature sensors. It supported two different bus architectures for
    communication with external sensors: i2c (pronounced i c) and ISA (IBM''s Industry
    Standard Architecture). The i2c bus, created in the 1980s by Phillips, proved
    to be highly successful serial bus for sensor networks because 112 i2c devices
    can communicate via its simple low cost two-wire interface. Several computing
    architectures have sprung up since then, including Dallas Semiconductors'' 1wire,
    Motorola''s SPI (Server Peripheral Interface, introduced Spy)—which, because of
    the need for a broad ground, actually uses two wires—Intel''s System Management
    Bus (SMBus).


    There are small differences between these bus architectures, but the choice of
    bus in a given system is a function of the brand of micro-controller and sensors
    involved rather than the inherent superiority of one bus another. In practice,
    it''s common for a single motherboard to have a combination of several buses and
    sensors from different vendors. Even when the motherboard only has a single sensor
    chip, often components contain their own. Examples include video or TV-tuner cards,
    battery recharging subsystems, and "backlighting" subsystems for controlling things
