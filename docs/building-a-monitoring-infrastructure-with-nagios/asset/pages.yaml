    Like Fruity, Monarch can import existing configs and won’t modify the Nagios configs
    until you tell it to. It’s also possible to kick off a backup of the Nagios configs
    on command, via Monarch, which is helpful.


    This chapter was by no means an exhaustive list of automated configuration tools.
    Many other excellent tools exist, which may play into part your particular skill-set
    quite well. For example, if you are adept at Perl, I’d take a look at the configuration
    modules for Nagios available at CPAN (www.cpan.org). Perhaps the best thing about
    Nagios is the wealth of great tools surrounding it. Check out the configuration
    section on the Nagios Exchange (www.nagiosexchange.org) for more information.'
