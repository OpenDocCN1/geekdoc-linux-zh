  md: '# Reporting


    Nagios has some excellent reporting capabilities built in. The Reporting CGIs
    break down into one of three types: those that specify log dumps, those that draw
    graphs, and those that output formatted reports. Alert History, Notifications,
    and Event Log dump the log lines that correspond to their type. Alert Histogram
    and Trends use the GD library to generate graphs. Availability and Alert Summary
    generate formatted reports.


    All the reporting types that aren''t just log dumps the same pregeneration procedure.
    Click on the report type, and you will be prompted to specify which type of object
    you want to run the report on. You may run most on one or more hosts, services,
    hostgroups, and service groups. After you choose the type of object, you are prompted
    to select the specific object you want to run the report on, if you choose host(s)
    in the first step, you can specify Server1 in the second. Lastly, you are asked
    to provide some options, such as the report time period and which states (hard
    or soft, error or non-error) you want to include.


    The main difference between a trend graph and a histogram graph is the X-Axis.
    For a period of five days, a trend graph displays each of these five days on the
    X-axis and plots the service state (unknown, critical, warning, okay) on Y-axis.
    The trend graph is a straightforward representation of the service as a function
    of time.


    The histogram, on the other hand, displays a user-defined breakdown of intervals
    (referred to as the breakdown type) on the X-axis, such as per hours, days or
    per week. It then plots the number of errors on the Y-axis. For example, a histogram
    with a period of Last 7 days and a breakdown type of hours per day will plot 24
    hours on the X-axis and then plot the number of occurrences of each problem state
    in the last seven days on the Y-axis, based on the hour it occurred. This is handy
    for visualizing trends in service outages. A trend graph shows you that the CPU
    was High on Server1 last Monday at 1 p.m., but the histogram shows that the CPU
    is high on Server1 every Monday at 1 p.m.


    Both the Availability and Alert Summary formatted reports are well done. They
    are used often. The Availability report is what you look for if you need to prove
    you''re meeting your SLA. Availability reports are color-coded tables that specify
    the exact amount of availability (as a percentage of three sig-figs for “five
    nines”) for any host, service, or collection. The Alert Summary report is great
    for people who don''t want to get paged, but still want a summary of what went
    on in the last 24 hours or any user-defined time period. The Alert Summary report
    can be filtered to exclude soft events, only host events or service events or
    both, or display problem states, just recovery states, and so on. Both the Availability
    report and Alert Summary report can be easily imported into Excel spreadsheets
    by saving the report straight out of the HTML frame as filename.xls.'
  merge: -1
