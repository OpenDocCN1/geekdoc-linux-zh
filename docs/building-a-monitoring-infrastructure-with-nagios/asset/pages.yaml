    | Option | Description |

    | - | - |

    | -6 | Uses IPv6 |

    | -s | Specifies a string to send to the serve. |

    | -e | Specifies a string to expect in server response. |

    | -q | Specifies a string to send server to initiate a clean close of the connection.
    |

    | -r | Specifies how to treat TCP refusals (okay, warn, or crit). This is useful
    for, as an, verifying firewall rules (The default is crit). |

    | -M | Specifies what to do when expected string mismatches with returned string
    (okay, warn, or crit [default: warn]). |

    | -j | Hides output from TCP socket. This is useful for keeping sensitive information
    out of the Nagios Web interface. |

    | -m | Closes connection once more than this number of bytes are received. |

    | -d | Seconds to wait between sending string and polling for response. |

    | -D | Minimum number of days an SSL certificate has to be valid. |

    | -S | Toggles the SSL for the connection. |

    | -w | Warning timeout (in seconds). |

    | -c | Critical timeout (in seconds). |

    | -t | Timeout (in seconds [default: 10]). |

    | -v | Prints verbose output. |


    # Examples


    Simple port 80 query:


    ```

    check_tcp -H bart -p 80

    ```


    SMTP hello:


    ```

    check_tcp -H bart -p 25 -s ''helo homer.skeptech.org'' -e ''250 bart.

    skeptech.org'' -q ''quit''

    ```'
