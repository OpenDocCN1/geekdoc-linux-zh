  md: "# 140 Chapter 7 Visualization\n\nRRDTool automatically returns the highest\
    \ resolution data possible. When you graph anything under one month, you get a\
    \ high-resolution graph because RRDTool returns data. Graphing data older than\
    \ one month, but more than one year, yields a lower resolution graph, but more\
    \ than enough data is available for you to draw the conclusions you need at scale.\
    \ Finally, low-resolution graphs are possible on 5 year's worth of data, while\
    \ the total PDP count remains at only 58,320. That's 5 times as much history,\
    \ nearly an order of magnitude less storage space, if you had kept one year's\
    \ worth of raw data.\n\nWhen you consolidate data in a Round Robin Archive from\
    \ multiple data points, it's possible that the PDPs may be unknown. So, such as\
    \ with the heartbeat, you need to tell RRDTool how many of the PDPs can be before\
    \ the consolidated data is also unknown. This value, called the X-Files Factor\
    \ (this does reference the television program The X-Files) is a ratio, or if you\
    \ prefer, a percentage (ranging from 0 to 1) of the PDPs that can be unknown before\
    \ the consolidated value is also considered unknown.\n\n# RRDTool Create Syntax\n\
    \nIn concept, it's simple enough. DS definitions describe what and how to store,\
    \ and RRAs describe how much data to keep and how often to consolidate or compress\
