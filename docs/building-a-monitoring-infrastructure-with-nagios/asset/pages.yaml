  md: '# Configuring Nagios


    After installation, you need to configure Nagios before it can start. Nagios is
    configured by way of text files that contain directives and definitions. It can
    be a beast to configure for the first time because the definitions are self-referential
    and there''s a lot to define.


    To get started, Nagios needs to call plugins during a time period against hosts
    and services and send notifications to contacts if a check returns a bad status,
    so you need to define the checks, time periods, hosts, services, notification
    commands, and contacts (and that''s all mandatory). Because so many objects refer
    to so many other objects, it can be hard to know where to begin to explain it
    all. Don''t be discouraged; Nagios comes with options to generate sample configuration
    files, and further, there are a few shortcuts you can take to bootstrap the configuration
    process (see Chapter 5, “Bootstrap the Configs"), but first you need a good understanding
    of what a configuration looks like.


    Hosts and services are the core objects. They are the objects that refer to most
    others, so most of the documentation has been written about Nagios begins with.
    I''m going to take more of a bottom up approach. I''ll start by describing the
    daemon configuration files and then work my way up from commands and time periods,
    through services and hosts to groups, and then, finally, to optional definitions
    such as escalations and extended information. Each group of objects is referred
    to by the objects above them, so by explaining things this way, whenever you come
    to an attribute in a definition that references another object, you will have
    already looked at what that object consists of. I find that it''s easier to get
    a grasp of the whole picture by explaining it this way.'
  merge: -1
  pgno: 75
- img_proc: true
  md: '# Objects and Definitions


    In Nagios, there are two types of configuration files: those that contain directives
    and those that contain definitions. Technically, only two configuration files
    are needed: nagios.cfg and an object configuration file. The nagios.cfg contains
    directives that affect the operation of the Nagios daemon, for instance, where
    to write logs and the name of the object config file, global settings, and things
    of that nature. The object configuration file defines the various objects that
    Nagios deals with.


    There are quite few different types of objects (as outlined in Table 4.1), although
    it''s possible to jump all their definitions into a single file, most people prefer
    to group the object definitions by type and keep a different file for each type.
    Because this makes writing about and learning object configuration easier, that
    is the convention I follow through this chapter. While Nagios will always be named
    nagios, the object configuration filenames are user-defined, so the filenames
    I use throughout the chapter are not written in stone. It''s entirely possible
    that you might inherit a Nagios implementation that groups object definitions
    by network subnet, or even physical proximity to the Pepsi machine.


    # Table 4.1 A Brief Summary of Nagios Objects


    | Object Name | Description | Recommended Filename |

    |---|---|---|n| timeperiod | This is the defined block of time that other objects
    use to determine their operational hours and blackout periods. | timeperiods.cfg
    |

    | command | Command definitions map macros to external programs. Other objects
    use commands for many things, as sending notifications and running service checks.
    | miscommands.cfg and checkcommands.cfg |

    | contact | This defines a notification target, which is usually a human being.
    | contacts.cfg |

    | contactgroup | Contacts are organized into groups contactgroups. Objects that
    send notifications always reference contactgroups and never individual contacts.
    A contact can be a member of any number of groups. | contactgroups.cfg |

    | host | Hosts are physical entities (or the virtual representation of physical
    entities if you use virtualizations, such as Xen or VMware), such as servers,
    routers, or tape drives. | hosts.cfg |'
