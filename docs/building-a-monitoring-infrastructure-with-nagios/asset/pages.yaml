  md: '# 152


    # Chapter 7 Visualization


    As you can see, the negln CDEF is a result of a math operation on the DEF, but
    the expression (in,-1*) might look odd to you, unless you''ve owned a HP Calculator
    or are otherwise familiar with Reverse Polish Notation. For the uninitiated, I''ll
    provide a brief summary. Feel free to skip ahead if you are already familiar with
    RPN.


    # RPN


    Traditional mathematical expressions rely on operator precedence to determine
    the order of operations. You may remember this from grade school as PEMDAS: Parenthesis,
    Exponent, Multiply, Divide, Add, and Subtract. For example


    ```

    4+5*2

    ```


    The product is 14. First, 5 is multiplied to 2, and then 4 is added. This is because
    the operator precedence specifies that multiplication must happen before addition.
    If you want to multiply 2 to the sum of 4 and 5, you must override the operator
    precedence with parentheses, like this:


    ```

    (4+5) *2

    ```


    In RPN, operator precedence is not necessary because the quantities and operators
    are specified in the order they are needed. For example, to specify that 5 should
    be multiplied to 2 in RPN


    ```

    5, 2,*

    ```


    RPN expressions are never ambiguous about order of operations. They read from
    left to right, like English, and can be thought of in terms of a horizontal stack.
    Values are pushed onto the stack and popped off as needed. First, you push a 5
    onto the stack, a 2, and then a multiplication operator. Every time RPN gets a
    pair of quantities onto the 2 with an operator, it pops them in order and performs
    the equation, saving the product back onto the top of the stack. To specify that
    2 should be multiplied to the sum of 5 and 4, you could say


    ```

    5, 4, +, 2, *

    ```


    Because RPN reads to left to right, there is no chance that the multiplication
    could happen first. Here, 5, 4, and + are popped off the stack and evaluated.
    The sum of 5 and 4 is then pushed back onto the top of the stack. At this point,
    you can imagine the stack looking


    ```

    9, 2,*

    ```'
  merge: -1
