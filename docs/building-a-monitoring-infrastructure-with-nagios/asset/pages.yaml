  md: '# CHAPTER 5


    # Bootstrapping the Configs


    Everyone seems to have a different idea of what makes for ease of use when it
    comes to configuration, but most seem to agree that Nagios isn''t it. Although
    I''ve yet to meet anyone who enjoys configuring Nagios from scratch, it''s also
    surprising to me what people think will rectify the situation. Many people on
    the Nagios-Users list, for example, believe that placing the configuration information
    in databases makes Nagios easier to configure, whereas others swear by PHP-based
    graphical user interfaces. The nice thing about this difference of opinion is
    that many people have acted upon it, producing a wealth of tools to make configuration
    easier. So many so, in fact, that I would be remis if I didn''t include a chapter
    on making configuration easier.


    Depending on the size of your environment, there is a point of diminishing returns
    where learning and configuring the configuration tool are more trouble than it
    would be to manually edit the Nagios config files. In this chapter, I cover three
    increasingly complex methodologies to help you bootstrap the configuration process.
    I start with script-ing templates, then move on to automatic discovery and configuration
    generation tools, and finally cover two graphical configuration frontends.


    The tools all have their good sides and bad; for example, some might feel the
    shell scripts lack user friendliness, on the other hand, PHP raises the vulnerability
    footprint of the Nagios server. I don''t cover database back-ends, because I personally
    haven''t dealt with them, but I do talk about two PHP-based configuration tools
    that I''ve grown rather fond of, as well as some old-fashioned shell techniques.
    None of these tools are mutually exclusive, and it''s common practice to mix and
    match them to get what you want.'
  merge: -1
  pgno: 99
