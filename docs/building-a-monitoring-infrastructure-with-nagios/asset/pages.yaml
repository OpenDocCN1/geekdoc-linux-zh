  md: '# 176 Chapter 8 Nagios Event Broker Interface


    NEB modules are shared libraries written in either C or C++. The NEB module registers
    for the types of events it is interested in and provides function pointers to
    functions that do Each NEB module is required to have an entry function and, beyond
    that, can do anything it wants. The interesting thing about this architecture
    is that Nagios globally scopes almost everything (the Nagios web site, the source
    of this information). According to Ethan Galstad, Nagios'' creator, this is by
    design. Essentially, I would like to allow Event Broker modules to override most
    of the internal login the daemon when it comes to host-service checks, notifications,
    flap detection, logging, executing external commands, etc. This will allow people
    to do a number of neat things that would otherwise require extensive rewriting
    of the Nagios daemon.. Thus, from the perspective of the NEB module, the architecture
    looks more like the one shown in Figure 8.2.


    ![](img/7c754ef117b945190cb5d61f0388dd22_200_0.png)


    **Figure 8.2** The NEB architecture from the perspective of an NEB module.


    Because almost all of the interesting functions and structs are globally scoped—if
    Nagios'' execution pointer is in the module''s address space—the module has the
    power to change anything it wants to change about the entire runtime environment.
    It can insert and remove events from the scheduling queue and it can turn on or
    off notifications. In summary, anything that can be changed at runtime can be
    changed by the module. You might think that the module would have a limited opportunity
    to do these things because Nagios runs only its'
