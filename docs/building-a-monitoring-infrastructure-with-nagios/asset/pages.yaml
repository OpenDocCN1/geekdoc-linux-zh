  md: '# SNMP Hierarchy: .1.3.6.1


    ![](img/7c754ef117b945190cb5d61f0388dd22_144_0.png)


    **Figure 6.1** The .1.3.6.1 prefix.


    From here, the Hierarchy continues to become more specific. The three children
    of the IAB in Figure 6.1 are all commonly used; the children are management (2),
    experimental (3), and private (4). The experimental branch is used for nodes that
    will eventually become IETF Standards. Because RFCs can take a while to become
    RFCs, the experimental branch enables administrators to use experimental OIDs
    on production gear without causing conflicts with existing OIDs. The private branch
    is for private organizations, such as Cisco and Juniper Networks. Private is where
    you would find information, such as the 1-minute CPU load average on a Cisco Router.
    Our example OID is in the management branch, which contains IETF Standard nodes.
    Every node within is described somewhere in an RFC.


    The next places one OID within the mid-2 group, meaning that this is an SNMP Version
    2 node. SNMP version 1, the first as described by the IETF, had two main problems.
    The first was Moore''s Law. When the IETF set out to specify how data could be
    stored in the MIB, they underestimated the size of the data that the MIB would
    need to store. As a result, many of the configuration settings on the network
    devices quickly outgrew the IETF''s strictly typed variables. The second problem,
    of course, the lack of security in the SNMP protocol.


    SNMP Version 1 uses a shared secret, called the community string, to authenticate
    peers. Unfortunately, this string is transmitted in clear text between SNMP peers,
    and there is a nearly universal practice of setting the string to public. This
    setting is often overlooked by'
  merge: -1
  pgno: 144
- img_proc: true
  md: '# Watching "Other Stuff"


    administrators and, in years past, SNMP was adopted by default on many devices,
    opening them up to remote configuration by malicious entities.


    SNMP Version 2 was drafted in 1993 to fix these problems and add some functionality
    to the protocol, but unfortunately, it died an untimely death when its drafters
    couldn''t agree on the details of the security enhancements. Three years later,
    a compromise was struck with the release of SNMP Version 2c. V2c took the things
    the IETF could agree on and combined them with the Version 1 security model. The
    new standard includes larger data structures, get-bulk transfers, connection-oriented
    traps, improved error handling, and the flawed clear-text security model. V2c
    isn''t as wisely adopted as V1, but support for it exists on most newer network
    gear, including Cisco routers with IOS 11.2(6) and above.


    The IETF finished on SNMP Version 3 in March of 2002. V3, a fully Internet standard,
    is described in RFC 3410-3418. Adoption of V3 seems to be occurring more quickly
    than V2, with many vendor implementations available, including Cisco gear running
    IOS 12.0(3) and above. V3 supports three security models: no-authpriv, which sends
    cleartext SNMP packets and has trivial authentication, authpriv, which sends cleartext
    SNMP packets and strong authentication via MD5 or SHA, and authpriv, which has
    both encrypted sessions and strong authentication. The use of Version 3, in least
    authpriv, is highly encouraged when it''s available.


    The next portion of our example OID, 2.2.1, translates to interfaces.ifTableEntry.
    This means our OID is in reference to a specific interface. The second last digit,
    8, translates to the ifOperStatus node, which is the current operational status
    of the interface. The very last in our OID specifies the interface number, so
    OID translates to the current operational status of Interface #1. This value will
    be of seven possible values: up, down, testing, unknown, dormant, notPresent,
    or lowerLayerDown.


    Even though the MIB is hierarchical, devices in practice do not implement the
    entire tree. Devices that support SNMP only contain the subset of the MIB that
    they need. So if a network device has no configuration settings in the experimental
    branch of the MIB, they do not implement that portion of the MIB. An SNMP device
    can be either a manager or an agent, or in some cases, both. Agents can be thought
    of as SNMP servers; they are devices that implement some subset of the MIB tree
    and can be queried for configuration information or configured remotely via SNMP.
    Devices that poll or configure agents are managed. The snmpprogram from the net-snmp
    project is a manager and my Cisco router is an agent.


    SNMP agents don''t have to sit passively and wait to be polled; they can also
    notify managers of problems using an SNMP trap. SNMP traps use UDP and are targeted
    at the manager''s port 162. Although Nagios has no intrinsic SNMP capabilities
    (Nagios has few'
