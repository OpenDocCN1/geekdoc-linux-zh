- img_proc: true
  md: '# 136


    # Chapter 7 Visualization


    I don''t say that lightly. It''s difficult to express perfectly round robin databases
    solve the problem of storing performance and monitoring metrics. After it is stored
    in RDDs, the data is available via command-line tools for whatever shell processing
    you want to do, but it''s the fast and powerful internal processing that makes
    RRD a net gain.


    Storing and graphing time-series data is a more difficult problem than it sounds,
    and RRDTool feature-rich, making it one of the most complex and difficult to use
    pieces of software that systems administrators deal with on a daily basis. It
    simply isn''t feasible to commit RRDTool''s command-line syntax to memory, so,
    in practice, automation is the rule. Most systems administrators use scripts and
    glue code to hide RRDTool''s complexity, but it''s tricky to do this without losing
    flexibility. The more you know about RRDTool, the better off you are dealing with,
    and choosing, the scripts you will use to glue RRDTool to other applications like
    Nagios.


    At most basic level, RRDTool is a database of metrics. These metrics can be anything
    from the temperature of a room to the throughput of a router interface in bits
    per second. RRDTool calls these metrics data sources (DS), because that''s what
    they are. Command-line tools are provided to create and periodically update the
    database. Each data source is stored in the database as one of several types,
    GAUGE and COUNTER, which are the only two types you''ll use. To understand why
    different data types are needed, consider how our example metrics, temperature,
    and throughput are collected.


    # RRD Data Types


    The temperature measurement comes from some sort of sensor, either inside a server
    with IPMI or LMSensors, or from a dedicated external via SNMP. When you poll the
    sensor, you get a number, such as 42. This number directly corresponds to the
    temperature, usually in degrees Celsius. This number may increase or decrease,
    depending on the environment. In the physical world, a gauge with a needle point
    can be used to display the temperature.


    Router throughput, on the other hand, normally comes via SNMP by byte counter
    on the router. This number is the total number of bytes received by the router.
    The counter increments only and never decreases. Depending on the size of the
    memory buffer used, the counter will eventually overflow and return to 0 and then
    continue incrementing from there. In the physical world, this counter is similar
    to the odometer in a car. To get an actual throughput measurement, such as 20kb/s,
    a delta must be taken between the old and new counter values and divided by polling
    interval.'
  merge: -1
  pgno: 160
- img_proc: true
  md: '# Foundations, MRTG, RRDTool


    For example, let''s say that Nagios measures the octets in an SNMP variable of
    Router7 every minute. The first time Nagios measures counter, it reads 653,122,
    meaning that its interface received 653,122 bytes. One minute later, when Nagios
    polls a second time, the counter reads 654,322. At what rate is data flowing through
    the interface? To find how many bytes were transferred since the first measurement,
    subtract 653,122 from 654,322. This gives you 1,200. So 1,200 are transferred
    to the router while Nagios is asleep. Because Nagios polls every minute, this
    means that the router receives 1,200 bytes per minute. Dividing 1,200 by the number
    of seconds in a minute gives us the rate which is example 20 bytes/second.


    Deriving rate from counters is a common requirement that RRDTool does for you.
    All you need to do is to specify that the number in question is a counter, and
    RRDTool automatically performs the requisite arithmetic to return your information.
    Of course, if you have something like a temperature or CPU load, you don''t want
    this to take place; in that case, you use a Gauge.


    # Heartbeat and Step


    In addition to the type of data source, RRDTool also needs to know how often you
    poll it. This number is referred to as the step. The step is specified in seconds,
    so in the previous example, when Nagios is polling every minute, the step is 60.
    The step is not specific to the data source; it is specified for the entire round
    robin database. So, the RRD expects that at least every 60 seconds, someone will
    come along and use the command-line tool to give it more data. But what happens
    when two updates happen in a 60 second window? Or none at all? In a perfect world,
    the polling engine would always provide the RRD with the data needed, exactly
    when it was expected, but because this is the real world, you need to account
    for things. For this reason, you must also specify a heartbeat for the data source.


    The heartbeat determines what happens when there is too much or too little data.
    Literally, it is the maximum number of seconds that may pass before the data is
    considered unknown for a polling interval. The heartbeat can provide a buffer
    of time for late data to arrive, if set greater than the step, or it can enforce
    multiple samples per polling interval. To continue the example, if the router
    was unreliable for some reason or Nagios had a lot to do to, you could set the
    heartbeat at twice the polling interval: 120. This would mean that two minutes
    could pass before the data for that interval was considered unknown. In practice,
    it''s common to use a large heartbeat such as this to account for glitches in
    the polling engine.'
  merge: -1
  pgno: 161
- img_proc: true
  md: '# 138


    Every step seconds, RRDTool takes the data it receives during the step and calculates
    a primary data point (PDP) from the available data. If the heartbeat is larger
    than the step and there is at least one data sample in the heartbeat period, RRDTool
    uses that data. If there is more than one sample, RRDTool averages them. Figure
    7.5 shows how RRDTool reacts to glitches when the heartbeat is larger than the
    step.


    ![](img/7c754ef117b945190cb5d61f0388dd22_162_0.png)


    **Figure 7.5** Data polling glitches with a large heartbeat.


    If the heartbeat is smaller than the step, then multiple data samples per step
    are required to build the PDP, depending on how much smaller the heartbeat is.
    When multiple samples are required to create a PDP and enough samples exist, they
    are averaged into a PDP. Otherwise, the data set for that step is considered unknown.
    With a heartbeat, you need more data from the polling engine than would otherwise
    be necessary to account for glitches. Figure 7.6 depicts a small heartbeat situation.


    ![](img/7c754ef117b945190cb5d61f0388dd22_162_1.png)


    **Figure 7.6** Data polling glitches with a small heartbeat.'
  merge: -1
