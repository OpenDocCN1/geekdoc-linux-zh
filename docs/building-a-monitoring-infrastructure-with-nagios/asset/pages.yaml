    \ read the helpful syntax description. Check\nAppendix C, “Command-Line Options,”\
    \ for a list of command-line options for common\nplugins.\n\n# Port Queries\n\n\
    After ICMP echoes, port queries are the next most common service check performed\
    \ by most\nmonitoring servers. These plugins attempt to open a TCP or UDP connection\
    \ to a given port\non a given host. Port queries are performed by either the check_tcp\
