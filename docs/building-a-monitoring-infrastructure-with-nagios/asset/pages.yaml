  md: '# Introduction


    other projects, and congest network links with megabyte upon megabyte of health
    checks. Bad monitoring systems can really suck.


    Unfortunately, getting it right the first time isn''t as easy as you might think,
    and in my experience, a bad monitoring system doesn''t usually survive long enough
    to be fixed. Bad monitoring systems are too much of a burden on everyone involved,
    the systems systems monitored. In this context, it''s easy to see why large corporations
    and governments employ full-time monitoring specialists and purchase software
    with six-figure price tags. They know how important it is to get it right the
    first time.


    Small-to-sized businesses and universities can have environments as complex or
    even more complex than large companies, but obviously don''t have the luxury of
    high-priced tools and specialized expertise. Getting a well-built monitoring infrastructure
    in these environments, with their geographically dispersed campuses and satellite
    offices, can be a challenge. Having spent the better part of last 7 years building
    and maintaining monitoring systems, I''m here to tell you that not only is it
    possible to get it right first time, but you can also do it for free, with a bit
    of elbow grease, some open source tools, and a pinch of imagination.


    # Why Nagios?


    Nagios is, in my opinion, the best system and network-monitoring tool available,
    open source or otherwise. Its modularity and straightforward approach to monitoring
    make it easy to work with and highly scalable. Further, Nagios'' open source license
    makes it freely available and easy to extend to meet your specific needs. Instead
    of trying to do everything for you, Nagios excels at interoperability with other
    open source tools, which makes it flexible. If you''re looking for a monolithic
    piece of software with check boxes all your problems, this probably isn''t the
    book for you. But before you stop reading, give me another paragraph or two to
    convince that the check boxes aren''t really what you''re looking for.


    The commercial offerings we get wrong because their approach to the problem assumes
    everyone wants the same solution. To a certain extent, this is true. Everyone
    has a large glob of computers and network equipment and wants to be notified if
    some subset of it fails. So, if you want to sell monitoring software, the obvious
    way to go about it is to create a piece of software that knows how to monitor
    every conceivable piece of computer software and networking gear. The more gadgets
    you can monitor, the more people you can sell to. To those who want to sell monitoring
    software, it''s easy to believe that monitoring systems are turnkey solutions
    and whoever can monitor the number of gadgets wins.


    The commercial packages I worked with all seem to follow this logic. Unlike the
    Borg, they are methodically locating new computer gizmos and adding the requisite
    monitoring code to their solution, or worse: acquiring other companies that already
    know how to monitor lots of computer gadgetry and bolting these companies'' codes
    onto their own.'
  merge: -1
