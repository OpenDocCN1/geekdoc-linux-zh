    \ map file in a moment.\n\nNagios graphs use the RRDTool default step of 300 seconds\
    \ (5 minutes) and allows you to specify the heartbeat in its configuration file.\
    \ Four RRAs are created by default, as you can see in Listing 7.3. The default\
    \ RRDs are a bit conservative, in my opinion. Two days of raw data are kept and\
    \ then generic CF is applied to store 14 days of 30-minute chunks, 64 days of\
    \ two-hour chunks, and two years of one-day chunks.\n\nNagios sends output and\
    \ performance data to NG by way of the process_performance_data directive in the\
    \ nagios.cfg. This feature is designed to provide performance metrics to external\
    \ programs. First, enable it by setting process_performance_data to 1 in the nagios\
    \ cfg and then add the following line, which configures a global performance data\
    \ handler.\n\n```\nservice_perfdata_command=process-service-perfdata\n```\n\n\
    Now, when Nagios gets data from a plugin, it executes the process-service-perfdata-command.\
    \ Listing 7.4 contains process-service-perfdata command definition, which belongs\
