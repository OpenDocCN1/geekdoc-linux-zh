  md: "# Auto-Discovery\n\nNACE, in my opinion, is a category killer for scripted,\
    \ automatic Nagios configuration; whether you want to bootstrap a large number\
    \ of hosts quickly or you have a need for ongoing-system auto-discovery and configuration,\
    \ I highly recommend you give it a look.\n\n# Namespace\n\nNamespace is probably\
    \ the easiest to use command-line auto-discovery and configuration tool for Nagios\
    \ that I have come across. Given a range of IP addresses, Namespace simply queries\
    \ the information it needs from DNS and writes a host config for each host it\
    \ encounters to stand out. Because it uses DNS to get its information, you need\
    \ to have a reverse-lookup capable DNS infrastructure in place. Namespace can\
    \ generate host and hostgroup entries and is most useful for initial installs\
    \ rather than scripting or maintenance. Namespace is a C program and is available\
    \ in source and binary from www.uni-hoenheim.de/~genzel/\n\nThe following command\
    \ creates the host definition in Listing 5.8.\n\n```\nnamespace -h -dl -c admin\
    \ -G boxen -x \"use generic-template\"\n192.168.5.1 192.168.5.254\n```\n\n# Listing\
    \ 5.8 Output from the namespace command.\n\n```\ndefine host {\n  use generic-host\n\
    \  host_name myhost\n  alias myhost\n  hostgroups boxen\n  contact_groups admin\n\
    \  address 192.168.5.201\n  check_command check-host-alive\n  max_check_attempts\
    \ 10\n  notification_interval 60\n  notification_period 24x7\n  notification_options\
    \ d,u,r\n  use generic-template\n}\n```"
  merge: -1
  pgno: 105
- img_proc: true
  md: 'Contact and host group directives can be added with -c and -G, as you can see.
    The -h switch tells Namespace to create a host entry, as opposed to a hostgroup
    entry or simply dumping domains name. The -x switch can be used to add any number
    of custom directives. In the preceding example, I use it to add a host template.
    The final argument is a range of IPs it comes across the IP range and dumps them
    all to stdout. It''s a lightweight and straightforward tool, especially useful
    to people working with Nagios for the first time.


    Namespace and NACE work well together. For example, Namespace could be used to
    create the initial host config file, and NACE''s ReturnHostsFromConfig.pl script
    could read out the hosts and use SNMPServiceQueryKey.pl to create a services file
    for them.


    # GUI Configuration Tools


    There is a dizzying array of graphical configuration front-ends for Nagios. The
    two most promising are open source projects managed by a company called Groundwork.
    Groundwork has spent the few years extending Nagios into a commercial monitoring
    application, called Groundwork Foundation, which directly competes with the big
    four monitoring applications: Openview, Patrol, Unicenter, and Tivoli. Fruity
    and Monarch are both free, open-sourced GUI front-ends to Nagios, which are managed
    by folks at Groundwork. Both tools have a polished look and work well.


    It should be noted that GUI configuration tools, in general, don''t necessarily
    make things easier for people who haven''t dealt with Nagios before. For example,
    prompting someone with a check box labeled flap detection won''t be any more meaningful
    than the same thing in a text file. Don''t make the mistake of substituting a
    GUI for training; it won''t get what you expect.


    # Fruity


    Fruity was written by Taylor Dondon, who works for Groundwork full time and was
    very helpful as a technical reviewer of this book. Fruity is a PHP application,
    accessible via a Web browser, and uses MySQL to store its own copy of the Nagios
    configuration. Fruity is written for Nagios 2.x and is quite simple to install.
    Just restar it into your Nagios database directory and edit the includes/config.inc
    file. Of course, as Fruity is a PHP/MySQL application, you''ll need PHP on your
    Web server with MySQL support and MySQL. After all that is installed, you have
    to manually create a database for Fruity and import the tables from a file included
    in the tarball.'
