    # GraphViz


    GraphViz is an open source tool for programmatically creating graphs that represent
    structural information such as networks and flow charts. It does the same sort
    of thing Visio does, only programmatically instead of interactively. GraphViz
    is implemented as a textual language called dot. You create a text file, similar
    to source code, in the dot language, and call one of several GraphViz interpreters
    to compile it into an image. Each interpreter uses a different layout algorithm,
    and because of this, there are subtle differences in the syntax that each supports.


    GraphViz diagrams are excellent when you want to show relationships between a
    large number of entities. It is already a very popular tool in the sysadmin and
    security communities because it works well for log analysis. Figure 7.19 is a
