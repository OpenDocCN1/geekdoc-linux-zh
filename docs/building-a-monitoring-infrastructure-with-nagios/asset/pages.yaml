  md: 'xx


    Introduction


    the commercial applications can and more,, without the bulky insecure agent install,
    it usually doesn''t compare favorably to commercial-monitoring systems when spreadsheets
    are parsed, Nagios doesn''t have as many checks. If they''re counting correctly,
    Nagios has no checks at all, because technically it doesn''t know how to monitor
    anything; it prefers that you tell it how. In fact, it is exactly that the aforementioned
    check box cannot encompass. Check boxes cannot ask how; therefore, you don''t
    want them.


    # What''s in this Book?


    Although Nagios is the biggest piece of the puzzle, it''s only one of the myriad
    of tools that make up a world-class open source monitoring system. With several
    books, superb documentation, and lively and informative mailing lists, it''s also
    the best documented of the puzzle. My intention in writing this book is to pick
    up the documentation leaves off. This is not a book about Nagios as much as it
    is a book about the construction of monitoring systems using Nagios, and there
    is much more to building monitoring systems than configuring a monitoring tool.


    I cover the usual configuration boilerplate, but configuring and installing Nagios
    is not my primary focus. Instead, to help you build great monitoring systems,
    I need to introduce you to the protocols and tools that enhance Nagios'' functionality
    and simplify its configuration. I need to give you an in-understanding of the
    inner workings of Nagios itself, so you can extend it to do whatever you might
    need. I need to spend some time in this book exploring possibilities because Nagios
    is limited only by what you feel it can do. Finally, I need to write about things
    loosely related to Nagios, such as best practices, SNMP, visualizing time-series
    data, and various Microsoft scripting technologies, such as WMI and WSH.


    Most importantly, I need to document Nagios in a different way than normal. By
    introducing it in terms of a task-efficient scheduling and notification engine,
    I can keep things simple while talking about the internals upfront. Rather than
    relating important information to the seldom-read advanced section, I empower
    you early on by covering topics such as plugin customization and scheduling as
    core concepts.


    The chapters stand on their own and I''ve tried to make the book as referencefriendly
    as possible, I think it reads better as a progression from start to end. I encourage
    you to read from cover to cover, skipping over anything you are already familiar
    with. The text is not long, but I think you''ll find it with information and even
    the most-seasoned monitoring veterans should find more than a few nuggets of wisdom.


    The chapters tend to build on each other and casually introduce Nagios-specific
    details in the context of more general monitoring concepts. Because there are
    many important decisions that need to be made before any software is installed,
    I begin with “Best Practices” in'
