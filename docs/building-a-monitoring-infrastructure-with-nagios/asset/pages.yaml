    \ is to cache a copy of your own memory handle with the following line.\n\n```\n\
    basic_module_handle = handle;\n```\n\nAfter, start dereferencing information about\
    \ yourself, if desired. For example, if you wanted to know your thread ID, you\
    \ could do something like this:\n\n```\npthread_t t_id=handle->thread_id\n```\n\
    \nAfter you have a copy of your handle, write some output to the console and log\
    \ files to the outside world know that you are alive and functional. This is done\
    \ by the write_to_logs_console function, which is defined in nagios.h. This function\
    \ takes three arguments; the first is a string that points to the message. The\
    \ second is a constant that defines the type of message; there are several of\
    \ these, which are also specified in nagios.h. The one I use is for informational\
    \ messages. The last argument is a Boolean that toggles console output, so if\
    \ it is true, the message goes to the console and the logs."
