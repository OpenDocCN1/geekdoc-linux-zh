- img_proc: true
  md: '# 142


    # Chapter 7 Visualization


    Even if your gauge has a minimum or maximum value, I recommend that you specify
    U:U so that the data is stored as it was collected. If you specify minimum/maximum
    for gauges, you are making a dangerous assumption about your data, that it actually
    behaves the way you expect it. You could lose interesting data this way. Mucking
    about with the data during import is bad mojo. You can perform math on the data
    and enforce limits later during the graphing phase. To Paraphrase Kenny Rodgers,
    there''ll be time enough for mucking when your data''s stored.


    In line 4, you begin to specify Round Robin Archives. These tell RDTool how much
    data you stored and how you would like it to be consolidated. The syntax is


    ```

    RRA:<consolidation function>:<x-files factor>:<PDPs>:<CDP>

    ```


    The consolidation function will be one of MIN, MAX, LAST, or AVERAGE. The subject
    of consolidation functions seems to cause a lot of confusion. This is unfortunate
    and probably because they are more difficult to describe than they are to understand.
    Simply put, the job of a consolidation function is to take a bunch of data points
    and make them into a single data point. Each CF accomplishes this in a slightly
    but straightforward manner. Given a group of data points to consolidate, the MIN
    CF returns the smallest point, the MAX CF returns the largest data point, the
    LAST CF returns the most recent data point, and the AVERAGE CF returns the average
    of all the data points.


    For example, let''s say I want to consolidate 10 minutes of data to a single PDP
    and I am polling the data every two minutes. This means I will have 5 total data
    points, such as 4,2,12,4,8. Given these 5 points, MIN would return 2, MAX would
    return 12, LAST would return 8, and AVERAGE would return 6.


    As discussed earlier, the X-Files Factor is the number of PDPs that can be unknown
    before the consolidation function returns unknown. Most people use .5 (50%) for
    this, but I like to go a bit higher, such as .8. At least in the context of systems
    monitoring, overly-averaged data is better than no data at all.


    In the RDTool documentation, the next arguments—one I refer to as PDPs and CDPs—are
    called steps and rows. I have possibly cause confusion by calling them something
    else, but in my experience, most people don''t find these names helpful or descriptive,
    so forgive me for making up my own. The PDPs (or steps) argument defines how many
    primary data points make up a single consolidated data point. A 10 here consolidates
    10 PDPs into a single value, whichever consolidation function you specify. The
    CDPs (or rows) specify how many of these newly created consolidated data points
    to keep.'
