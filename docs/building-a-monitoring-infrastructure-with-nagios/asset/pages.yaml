  md: '# Watching Windows 99


    Python to the Python interpreter, WSH has no native syntax. In fact, it''s possible
    to speak Perl and Python to the same script. WSH provides the execution environment,
    some common data structures, and I/O hooks, and it leaves the specific syntax
    up to the language engine.


    WSH, as installed by Microsoft, includes only language engines for VBScript and
    Jscript and in practice, most people use the VBScript syntax. Because of this,
    many people refer to scripts executed by WSH, in general, as VBScripts or Visual
    Basic Scripts.


    VBScript, or Microsoft Visual Basic, Script Edition, is a subset of Microsoft
    Visual programming language, which, in turn, owes its lineage to the original
    Beginner''s All-Purpose Symbolic Instruction Code developed at Dartmouth College.
    The VBScript.dll script engine interpreters written in VBScript, and can be used
    by either the ASP engine in Internet Explorer for Web applications or WSH for
    systems programming and automation. So, VBScript wears two hats: it is both a
    Web application language and a general scripting language. In its Web application
    role, VBScript is embedded into HTML (similar to Javascript) to be interpreted
    by the Web browser. In its stand-alone or WSH role, VBScript is executed by WSH
    from a file, usually possessing a .vbs extension. (This is not a requirement.
    The PATHTEXT environment variable is appended if the extension is omitted.)


    To middle things further, WSH is composed of two separate execution environments:
    Wscript and Cscript. These environments, implemented as two separate programs,
    are identical except that Wscript is GUI-based and Cscript is command-line driven.
    For example, the following snippet when executed by Wscript opens a new window
    that contains the words Hello World:


    The same code, executed by Cscript, simply prints Hello World to standard out
    at the command prompt.


    WSH scripts are self-contained files with extensions that denote their syntax.
    VBScript WSH scripts usually reside in .vbs and can be executed with either Cscript
    or Wscript in the following manner:


    ```

    cscript foo.vbs

    ```


    ```

    wscript foo.vbs

    ```'
