  md: 'The CGI Config


    # The CGI Config


    Not required for daemon start

    Refers to: nagios.cfg

    Referred by: nagios.cfg


    The cgi.cfg file is the only file, other than nagios.cfg, that contains directives
    instead of definitions, and unless you are using the Web interface, it is optional.
    The Nagios Web interface is very much a separate entity from the Nagios daemon.
    The daemon has no real knowledge of the existence of the Web interface, so it
    communicates with the daemon via the same mechanisms as any other program would:
    It sends commands to the command line and parses logs files for the current state
    of hosts and services. Therefore, a large part of the directives in the cgi.cfg
    are to give the CGI programs that make up the Web interface the information they
    need to command and get information from the Nagios daemon.


    Like the nagios, most of the directives in cgi.cfg shouldn''t need to change if
    you specified them correctly at compile time and built the sample config with
    install-config. The directives you want to modify around the Web interface security
    model, which is quite simple. The CGI''s rely on the Web server to handle authentication,
    as any server can be used to set up the Web interface, and there is no configuration
    required for specific users outside of the Web server configs.


    When a user successfully authenticates, the Web interface attempts to correlate
    the user-name passed from the Web server with a contact in the contacts.cfg. After
    contacts.cfg is set up, and the Web server is configured to authenticate users,
    the CGIs allow you to get information about the hosts and services for which you
    are a contact. This works well for large sites that want least-privilege style
    security. If you get paged when it goes down, you are allowed to see it in the
    Web interface, without touching whatsoever in the cgi.cfg.


    For smaller sites, however, it may be preferable to let everyone see everything;
    nearly all sites will want to have a few users, as the Nagios administrator, who
    can see everything, whether they are configured as a contact for the host or service
    in question. Table 4.4 shows the directives in the cgi.cfg that make these configurations
    possible. Most directives take a comma-separated list of users. Each directive
    that supports a comma-separated list also supports the use of an asterisk (*)
    to mean all users.'
  merge: -1
  pgno: 81
