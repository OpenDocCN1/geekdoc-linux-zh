  md: '# 8 Chapter I Best Practices


    Anyone with control over the monitoring system has complete control over every
    box monitors.


    Nagios, by comparison, follows the UNIX adage: “Do one thing and do it well.”
    It is really nothing but a task optimized scheduler and notification framework.
    It doesn’t have an intrinsic ability to connect to other computers and contains
    no agent software at all. These functions exist as separate, single-purpose programs
    that Nagios must be configured to use. By outsourcing remote execution to external
    programs, Nagios maintains an off-by-default policy and doesn’t attempt to reinvent
    things like encryption protocols, which are critically important and difficult
    to implement. With Nagios, it’s simple to limit the monitoring server’s access
    to its clients, but poor security practices on the part of admin can create insecure
    systems; so in the end, it’s up to you.


    The monitoring system should have only the access it needs to remotely execute
    the specific programs. Avoid regex style plugins that take arbitrary strings and
    execute them on the remote host. Ideally, every remotely executed plugin should
    be a single-purpose program, which the monitoring system has specific access to.
    Some useful plugins provide lots of functionality in a single binary. NSCLIENT++
    for Windows, for example, can query any permon counter. These multipurpose plugins
    are fine, if they limit access to a small subset of query-only functionality.


    The communication channel between the remotely executed plugin and the monitoring
    system should be encrypted. Though it’s a common mistake among commercial-monitoring
    applications, avoid nonstandard, or proprietary, encryption protocols. Encryption
    protocols are notoriously difficult to implement, let alone. The popular remote
    execution programs for Nagios use the industry-standard OpenSSL library, which
    is reviewed constantly by smart people. Even if none of the information passed
    is considered sensitive, the implementation should include encrypted channels
    from the get-go as an enabling step. If the system is implemented well, it will
    grow, and its far more difficult to add encrypted channels after the fact than
    it is to include in the initial build.


    Simple Network Management Protocol (SNMP), a mainstay of systems monitoring that
    is supported on nearly every computing device in existence today, should not be
    used on public networks, and avoided, if possible, for private ones. Most general-purpose
    workstations and servers, alternatives to SNMP can be found. If SNMP must be used
    for network equipment, use SNMPv3, which includes encryption, and no matter what
    version you use, it’s configured in a read-only capacity and only accepts connections
    from specific hosts. Whatever reason, sysadmins seem critically incapable of changing
    SNMP community string names. This simple implementation flaws for most of SNMP’s
    bad rap. Look for more information on SNMP in Chapter 6, “Watching”.


    Many organizations have networks that are physically separated, or otherwise inaccessible,
    from the rest of the network. In this case, monitoring hosts on the isolated subnet
    need a Network Interface Card (NIC) to the monitoring server and connecting to
    the private segment. Isolated networks the monitoring system should be configured
    with strict firewall rules so that they don’t forward traffic from one subnet
    to the other. Consideration should be paid to building separate monitoring systems
    for nonaccessible networks.'
  merge: -1
