    # check_load


    # Syntax


    ```

    check_load -w WLOAD1,WLOAD5,WLOAD15 -c CLOAD1,CLOAD5,CLOAD15

    ```


    # Discussion


    The check_load plugin checks the utilization triplet on the local host. For remote
    hosts, it is launched via NRPE or check_by_ssh. Critical and warning thresholds
    are given as utilization triplets separated by commas. For an in-depth discussion
    of utilization triplets, Chapter 6, “Watching”.


    # Table C.5 Check_load Options


    | Option | Description |

    | -h | Print help text. |

    | -V | Print version text. |

    | -w | Warning threshold triplet. |

    | -c | Critical threshold triplet. |


    # Example


    ```

    check_load -w 15 10 5 -c 30 20 10

    ```


    # check_disk


    # Syntax


    ```

    check disk -w limit -c [-p path | -x device] [-t timeout] [-m] [-e] [-v] [-q]

    ```


    # Discussion


    The check_disk plugin checks the amount of used disk space on a mounted file system
    and generates an alert if free space is less than one of the threshold values.
    Thresholds are given'
  merge: -1
