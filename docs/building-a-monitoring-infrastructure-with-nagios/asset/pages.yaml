  md: '# INTRODUCTION


    This is a book about untrustworthy machines; machines, in fact, that are every
    bit as untrustworthy as they are critical to our well-being. But I don''t need
    to bore you with a laundry list of how prevalent computer systems have become
    or with horror stories about what can happen when they fail. If you have picked
    up this book, then I''m sure you''re aware of the problems: layer on layer of
    interdependent libraries hiding bugs in their abstraction, script kiddies, DDoS
    attacks, hardware failures, end-user errors, back-hoes, hurricanes, and on and
    on. It doesn''t matter whether the root cause is malicious or accidental, your
    systems will fail. When they do, only two things will you you from the downtime:
    redundancy monitoring systems.


    # Do It Right the First Time


    In concept, monitoring systems are simple: an extra system or collection of systems
    whose job is to watch the other systems for problems. For example, the monitoring
    system can periodically connect to a Web server to make sure it responds and,
    if not, send notifications to the administrators. Although it sounds straightforward,
    monitoring systems have grown into expensive, complex pieces of software. Many
    now have agents larger than 500 MB, include proprietary scripting languages, and
    sport price tags above $60,000.


    When implemented correctly, a monitoring system can be your best friend. It can
    notify administrators of glitches before they become crises, help architects tease
    out patterns responding to chord interoperability issues, and guide engineers
    detailed capacity planning information. A good monitoring system can help the
    security guys correlate interesting events, show the network operations where
    bottlenecks are, and provide management with much high-level visibility into the
    critical systems that they bet their business on. A good monitoring system can
    help uphold your service level agreement (SLA) and even take steps to solve problems
    without waking up. Good monitoring systems save money, bring stability to complex
    environments, and make every-happy.


    When done poorly, the same system can wreak havoc. Bad monitoring systems cry
    wolf at all hours of the night so often that nobody pays attention; install backdoors
    into your otherwise secure infrastructure, leech time and resources away'
  merge: -1
