    These problems, and more, are solved by NRPE, the Nagios Remote Executor. NRPE
    has two parts: a plugin called check_nrpe, which is executed locally by Nagios,
    and a daemon, which runs on the monitored hosts. The daemon, run via a super-server,
    such as xinet, or as a service in Windows, has a local configuration file, which
    defines what checks_nrpe is allowed to ask. The check_nrpe plugin is configured
    to simply ask the daemon to execute one of these predefined commands, optionally
    passing it thresholds. The daemon does so, providing the client output and an
    exit code, which the client, in turn, passes to Nagios. Any program can be securely
    executed on the remote server by NRPE, if it''s defined in the daemon configuration
    file. X509 certificates can be used to authenticate the client to the daemon and
    encrypt the transmission. NRPE is completely cross platform, so it can handle
    remote execution for Windows and UNIX clients of all flavors. The installation
