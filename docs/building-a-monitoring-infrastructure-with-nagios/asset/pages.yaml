  md: '# 216 Appendix C Configure Options


    # ### Table C.7 Check_procs Options (continued)


    | Option | Description |

    |---|---|

    | ELAPSED—Time elapsed in seconds -t | Timeout value (the default is 10). |

    | -v | Be verbose. |

    | -s | Filter for processes possessing the given status flag (see the ps manual
    for valid flag types for your OS) (status). |

    | -p | Filter for children of the given parent process ID (ppid). |

    | -z | Filter for processes using more than the given virtual memory size (vsz).
    |

    | -r | Filter for processes using more than the given resident set memory size
    (rss). |

    | -P | Filter for processes using more than the given percent processor utilization
    (pcpu). |

    | -u | Filter for processes owned by the given username or UID (user). |

    | -a | Filter for processes with args that contain the given string (arg). |

    | -C | Filter for exact matches of the given command (command).


    # ### Examples


    Critical, if not one process with command name Nagios. Critical, if < 2 > 1024
    processes.


    ```

    check_procs -c 1:1 -C nagios

