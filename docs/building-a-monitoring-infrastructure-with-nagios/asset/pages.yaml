    definable to kilobytes, megabyte, gigabyte, or terabyte. The default unit is the
    megabyte. Check_disk works on device files and network file systems as mount point
    paths. Checks of network file system may be suppressed with the -l option.


    # Table C.6 Check_disk Options


    | Option | Description |

