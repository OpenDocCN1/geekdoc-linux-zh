  md: '# CHAPTER 7


    # Visualization


    If you want to summarize the intent of systems monitoring in two words, it would
    be difficult to do better than increase visibility. There are too many systems
    doing too many things too quickly for humans to maintain any sense of what''s
    going on at any given moment. The best we can hope for is to tell when something
    breaks, but a good monitoring system isn''t bound by our organic limitations,
    so it shouldn''t stop there. Good monitoring systems are like transducers in electronics,
    converting the incomprehensibly large number of interactions between systems and
    networks into an environmental comprehensium for human consumption. Good monitoring
    systems provide organic interfaces to the network, which allows us to see more,
    and the extent to which they accomplish this determines their usefulness as tools.


    Humans are visual animals, the best way to understand complex information is to
    draw us a picture. The importance of data visualization to the success of your
    implementation and the well-being of your environment cannot be understated. Good
    visualization solves the problem by effectively communicating the status of the
    environment, enabling pattern recognition in historical and real-time data, and
    making propeller-headed metrics interactons laymen utilize. Good visualization
    can aid any number of undertakings such as capacity planning, forensics, and root
    cause analysis. Visualization catches patches which doesn''t tell the monitoring
    system to look for. On the other hand, absent or poor data visualization severely
    hinders the usefulness of the system and can render your monitoring system irrelevant
    altogether.


    Out of the box, Nagios doesn''t draw many pretty pictures. The Web interface has
    good low-level data visualization, but, in general, the Web interface is focused
    on the now. It lacks long-term or historical data visualization and doesn''t provide
    much in the way of a meaningful services-oriented management interface. However,
    like his decision not to build in monitoring logic, the lack of integrated data
    visualization is Nagios'' favor. By focusing on making the data available to external
    programs, Nagios arms us with what we need to use the best data visualization
    software available, rather than forcing us to settle for for'
