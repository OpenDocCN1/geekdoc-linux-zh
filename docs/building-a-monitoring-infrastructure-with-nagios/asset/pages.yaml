  md: '# Installing Nagios


    # Table 3.3 Important Compile-Time Options


    | Option | Description |

    | --- | --- |

    | --enable-embedded-perl | This enables Nagios'' embedded Perl interpreter. It
    is intended to speed up execution of Perl scripts for people who use a lot of
    Perl-based plugins. I bring it up because it has a reputation for causing segfaults,
    so turn it on at your own risk. The default is disabled and most people keep it
    way. |

    | --with-nagios-user=<usr> | This is the user that Nagios runs as. It should be
    created before running configure. The default is nagios. |

    | --with-nagios-group=<grp> | This is the group that the Nagios belongs to. It
    should be created before running configure. The default is nagios. |

    | --with-command-user=<usr> | The username used to access the Nagios command file,
    which is described at the end of Chapter 2, "Theory of Operations." It defaults
    to the nagios-user option. |

    | --with-command-group=<grp> | This specifies the group used to access the Nagios
    command file, which is described at the end of Chapter 2. It defaults to the nagios-group
    option. |

    | --with-init-dir=<path> | This sets the location that the init script will be
    installed, if you use the install-init make target. The default is /etc/rc.d/.
    |

    | --with-htmlurl=<path> | The CGIs that make up the Web-end are written in C,
    so the URL paths in the HTML they generate must be set at compile time. This defaults
    to /nagios/ meaning that the HTML generated by the CGIs will reference http://localhost/nagios/.
    |

    | --with-cgiurl=<path> | Similarly, any CGI URL referenced by the HTML that the
    Web front-end generates must be set at compile time. This defaults to /nagios/cgi-bin/,
    meaning that the HTML generated by the CGIs will reference http://localhost/nagios/cgi-bin/.
    |


    The previous options are good litmus for whether you have to specify options to
    configure. A /configure with no options at all will get most people a working
    Nagios implementation, but chances are, if you need to change more than two of
    the above defaults, you''ll have to change something that I haven''t listed. Appendix
    A, "Configure Options," contains a complete list of options for the configure
    script.'
