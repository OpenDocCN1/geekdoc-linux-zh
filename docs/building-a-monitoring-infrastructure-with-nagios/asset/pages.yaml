- img_proc: true
  md: 'is immensely important. In every case, you want to choose tools that optimize
    for flexibility, and, unfortunately, the number of tools that actually provide
    all the flexibility you might want small.


    As depicted in Figure 7.4, there are three pieces to the data visualization puzzle:
    data collection, data storage, and display. The best way to optimize for flexibility
    is to get three separate packages to handle each of these three jobs, and the
    mistake made by most of the software related to graphing time-series data is trying
    to do too much.


    ![](img/7c754ef117b945190cb5d61f0388dd22_158_0.png)


    **Figure 7.4** Three pieces to the visualization puzzle.


    For example, when packages that store data get into the business of collecting
    data, they make assumptions about what and how you want to collect. Likewise,
    when display packages get into the business of polling or storing data, they make
    assumptions about where the data will be and how it will be stored. This makes
    it difficult to bring together a patchwork of data from all kinds of devices over
    the network. Packages that specialize in doing their singular task make false
    assumptions about what you want to do next.


    I''m going to choose two of these puzzle pieces for you, right now. Nagios makes
    a great data collection and polling engine, and RRDTool is the best tool out there
    for monitoring and performance data storage. You need a glue layer to connect
