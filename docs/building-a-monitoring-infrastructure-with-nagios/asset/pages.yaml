- img_proc: true
  md: '# Chapter 7 Visualization


    The step in Listing 7.2 applies to both data sources, meaning that each data source
    you store in a round database must have the same polling interval. However, because
    the heartbeat is specified in the data source definition, each DS may have a different
    heartbeat. In Listing 7.1, I specified 180 for outOctets'' heartbeat. The RRAs
    also apply to all data sources. We will consolidate data for each of the data
    sources, so each data source you add to an RRD must be stored in the same manner.


    When you create an RRD, updating it is very simple. Just call RRDTool in update
    mode, with a filename, date stamp, and colon-separated values. RRDTool derives
    which values go with which data by matching them in the order they were specified
    during creation. For example


    ```

    rrdtool update netCounters.rrd N:25842

    ```


    The previous updates the netCounters RRD with the current time and a value of
    42 for inOctets and a value of 15,842 for outOctets.


    Because I have dealt with RRDTool for a number of years, I tend to be shy putting
    a lot of data sources in a single RRD. There are two main reasons for this. The
    first is that I always forget what data is inside an RRD. Although it''s easy
    to define what''s stored inside an RRD by using RRDTool in fetch mode, my problem
    is that I forget the data in the first place, so when I''m looking for data of
    type X, I''ll take a cursory glance at the filenames and end up creating a new,
    redundant RRD with the data I want.


    The second reason is that new DSs sometimes pop up that should go in an existing
    RRD. For example, you could create a single RRD called disks.rrd with a DS for
    each partition. Then a year later, when /var runs out of space and you add a new
    disk and mount it to /var, the RRD will have to be expanded to include an additional
    DS for the new partition. Adding DSs to an existing RRD is possible, but not fun.


    My advice is to create single-DS RRDs with especially descriptive filenames. The
    filename of the RRD should, at a minimum, contain the name of the server it refers
    to. If you keep single-DS RRDs, it''s also possible to put the name of the DS
    in the filename, which makes things especially easy if you''re a blockhead like
    me. For example, I can look at a file router7_inOctets.rrd and know exactly what
    I can get and how. The various RRDTool scripts are good at insulating you from
    this sort of thing, which is nice. Finding good scripts can be a problem, however,
    as you''ll see in the next section.'
