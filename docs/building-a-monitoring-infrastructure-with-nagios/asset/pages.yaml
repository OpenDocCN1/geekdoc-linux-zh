  md: 'Notification


    31


    If the service breaches its thresholds outside of these time periods, Nagios will
    not send a notification. If the threshold breach occurs outside of the notification
    period, Nagios tracks the state change from OK into Soft Error and into Hard Error,
    but it will not send notifications because it has explicitly told not to do so.
    Alternatively, if the threshold is breached outside the check period, Nagios will
    simply notify, because it has explicitly told not to schedule checks of the service.
    Like almost every other option within the service definition, the time periods
    may be inherited from a template, if not explicitly set, be aware of what time
    periods are being inherited if you have notification trouble.


    As with the notification options setting, time periods may be configured on a
    contact-by-contact basis, if a threshold breach occurs within the time period
    specified by the service definition, the contact might filter out notifications.


    # Scheduled Downtime, Acknowledgments, and Escalations


    The last few variables that could affect Nagios'' notification decision are escalations,
    acknowledgments, and scheduled downtime. If planned maintenance must take place
    on one or more hosts, it is possible to schedule a period of downtime for the
    host or hosts from the Nagios Web UI. While a host is in a period of scheduled
    downtime, Nagios will check as normal and continue to track the host''s state,
    but no notifications will be sent for that host or its services. Further, Nagios
    distinguishes between actual downtime and scheduled downtime in its various reports.


    Escalations exist as a means to notify additional contacts if a host or service
    is down for too long. For example, if Server1 is down for 7 hours, you may want
    Nagios to notify the sysadmin and his manager. Escalations are defined independently,
    so they are not part of the service definition. When Nagios decides the time is
    right to send a notification, it first checks to make sure there isn''t an escalation
    definition that matches the Nagios is about to send. If Nagios finds a matching
    escalation, it will send instead of the original notification.


    It''s important to realize that Nagios will either send the notification as defined
    in the service, or the notification defined in the escalation. Normally, this
    is fine because the escalation and the notification in the service are the same
    thing, except the escalation has a few extra contacts. However, it is possible
    to define the escalation with a completely different set of contacts and even
    a completely different notification command. Be sure to list the original contacts
    in the escalation definition, along with the upper tier contacts, if you intend
    for the sysadmin and his manager to be notified.


    Acknowledgments are used to silence the re-occurring follow-up pages while you
    work on fixing the problem. If escalations are configured, it''s especially important
    to tell Nagios that you''re aware of, and working on, the problem, so it doesn''t
    get your manager involved.'
