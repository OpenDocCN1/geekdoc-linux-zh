  md: '# A Procedural Approach to Systems Monitoring


    when provided with detailed information, still gained nothing of significance.
    This is why a procedural approach is so important. Before they do anything, the
    people undertaking the monitoring project should understand which systems in the
    organization are critical to the organization''s operational well-being, and what
    management''s expectation is regarding the uptime of those systems.


    Given two things, policy can be formulated that details support and escalation
    plans. Critical systems should be given priority and their requisite pieces defined.
    It is not to say that the admin in the example should not be notified when /var
    is on Server1;only when he is notified of it, he has a clear idea of what it means
    in an organizational context. Does management expect to fix it now or in the morning?
    Who was notified in parallel? What happens if he doesn''t respond? This helps
    the manager, as clearly by defining what constitutes a problem, management has
    some perspective on what types of alerts to ask for and more importantly...when
    they can go back to sleep.


    Smaller organizations, where there may be only a single part-time system administrator
    (sysadmin), are especially susceptible to piece-meal monitoring. Thinking about
    operational policy in a four-person organization may seem silly, but in small
    environments, critical system awareness is even more important. When building
    monitoring systems, always maintain a big-picture outlook. If the monitoring endeavor
    is successful, it will grow quickly and the well-being of the organization will
    depend on it.


    Ideally, a monitoring system should enforce organizational policy rather than
    merely reflect it. If management expects problems on Server1 to be looked at within
    10 minutes, then the monitoring system should provide the admin with a clear indicator
    in the message (such as a priority number), a mechanism to acknowledge the alert,
    and an automatic escalation to someone else at the end of the 10-minute window.


    So how do we find out what the critical systems are? Senior management is ultimately
    responsible for the overall well-being of the organization, so they should be
    the ones making the call. This is why management buy-in is so vital. If you think
    this is beginning to sound like disaster recovery planning, you''re ahead of the
    curve. Disaster recovery works towards identifying critical systems for the purpose
    of prioritizing them, and therefore, it is a methodologically inclined process
    to planning a monitoring infrastructure. In fact, if a disaster recovery plan
    already exists, that''s the place to begin. The critical systems have already
    been identified.


    Critical systems, as outlined by senior management, will not be along the lines
    of “all problems with Server1 should be looked at within 10 minutes.” They will
    probably be defined as logical entities. For example “Email is critical.” After
    the critical systems have been identified, the implementers will dissect them
    one by one, into the parts of which they are composed. Don''t just stay at the
    top; be sure to involve all interested parties. Email administrators will have
    a good idea of what “email” is composed of and criteria, which, if not met, will
    mean rolling their own monitoring tools.'
