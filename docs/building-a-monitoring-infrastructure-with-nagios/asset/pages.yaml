- img_proc: true
  md: '# Front-Ends and Dashboards


    Now, 9, 2, and + popped off the stack and evaluated, returning 18. RPN never evaluates
    more than 2 quantities at once, so if you prefer, you may stack up all of your
    quantities and list out all of your operators. For example, another way to write
    the previous equation is


    5, 4, 2, +, *


    Here, RPN pops 5 and 4, and, seeing that the next object in the stack is a quantity
    instead of an operator, skips over 2 and looks for the next available operator,
    which is a +. The 5 and 4 are added, and the sum is pushed back on the top of
    the stack. From there, execution continues in the same manner as in the last example.
    Some people find stacking quantities and operators such as this easier to comprehend,
    especially when the expressions get large.


    Now that you know RPN is all about, take another look at the CDEF in Listing 7.7.


    ```

    CDEF:negIn=in,-1,*

    ```


    Applying what you know about RPN, it''s easy to see that you are creating a CDEF
    called ''negl, which is the product of the values of in and -1. You may create
    a CDEF from any number of operations on any number of variables that have been
    defined. Look at a more complicated CDEF example to give you a feel for what''s
    possible.


