- img_proc: true
  md: 'Acknowledgments can be sent to Nagios by way of the Web interface, along with
    an optional comment. When an Acknowledgement is sent, Nagios notifies the original
    recipient list that the problem has been acknowledged and by whom. Follow-up notifications
    are then disabled until the service goes back into an OK state.


    # I/O Interfaces Summarized


    Nagios is a great monitoring tool, but the area in it is head and shoulders above
    any of its commercial brethren by its capability to interact with other external
    monitoring and visualization tools. Nagios is good at interacting with other systems
    this was because a design goal of its creators, but also because, repeatedly stated
    in this chapter, it has little functionality built into it besides scheduling
    and notification. Nagios is good at making it easy to get data in and out because
    it has to be good, by virtue of its simple, yet elegant, design. This section
    describes a few of the most common ways to get data into and out of Nagios.


    # The Web Interface


    When you build Nagios, you may also choose to build your Web interface, and I
    recommend that you do. The main purpose of the Web GUI is to provide you with
    a window into the current state of the hosts you are monitoring, but it has a
    lot of functionality beyond that, such as


    +   - Historical reporting and trending tools

    - Interfaces for scheduling downtime and providing comments to specific hosts
    and services

    - Interfaces for enabling or disabling service checks and notifications

    - Interfaces for examining the current configuration

    - Tools for drawing graphical maps of the environment

    - Tools for getting information about the Nagios daemon''s status


    The Web GUI is CGI-based, and the CGI programs are written in C, so run fast.
    In general, the CGIs get their information from several log and state files that
    Nagios maintains in its var directory. The complete functionality of the GUI is
    a subject that could fill an entire book, I''m going to summarize its elements
    and how they tie together, and I''ll also show you of my personal favorite displays;
    the ones I find myself revisiting often. With the top-level summary that follows,
    you should be able to explore the GUI on your own and get the information you
    need in time.


    Figure 2.5 shows the Nagios Navigation Bar. The bar is organized into four sections:
    General, Monitoring, Reporting, and Configuration. The general section has a link
    to the full'
