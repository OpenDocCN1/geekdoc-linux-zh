  md: '# NRPE


    By now it should be no surprise that NRPE is the remote execution tool of choice
    for Nagios plugins on UNIX boxes. Unlike Windows, where some multipurpose plugins,
    such as NSClient, have implemented their own daemons and protocols, on the UNIX
    side have stayed single-purpose and assume the use of a remote execution program,
    such as NRPE or check_ssh. As for the plugins, most people start out with the
    official plugins tarball that Nagios daemon uses.


    Different hosts will build different plugins from the tarball based on the libraries
    they have installed. So it''s not particularly wasteful to have a single set of
    plugins for both the Nagios daemon and the hosts it monitors. For example, check_snmp
    will only compile if the host in question has the net-snmp libraries installed.
    This is true for a few of the plugins in the tarball. Check out Chapter 3 for
    details on getting and installing the official plugins tarball and NRPE.


    # CPU


    While measuring CPU utilization may seem a relatively straightforward task at
    first glance, it is, in fact, an intricate and complex problem with no easy solutions.
    There are two CPU-related metrics that are normally used to summarize CPU utilization.
    The first is the classic percentage-based metric. This is a number representing
    the percentage of CPU utilization occurring now. For example, "The CPU is currently
    42 percent utilized." This number is how many people who are UNIX administrators
    understand things, so let''s look at it.


    If you ask embedded systems or computer engineers, they will tell you that processors
    in the real world are either utilized or not. There is, in fact, no such as 42
    percent utilization on a micro-processor. At any given instance, the CPU is computing
    some bit of machine code or it is idle. If the only two numbers that exist are
    0 percent and 100 percent, what can this number actually mean?


    In fact, the CPU is never actually idle; "idle" is just one of many states that
    the process spends its time computing. Idle happens to be the lowest priority
    state, so the CPU spends its time looping in the idle state, it''s still doing
    work, just low priority, preemptable work.


    Therefore, to be meaningful, the utilization percentage must be something akin
    to an average of processor state versus time. What exactly is being averaged,
    and for how long, is a question that is answered in software, even on the same
    OS, two separate performance applications can measure it differently. Because
    all processors have a lowest priority state, a popular methodology for providing
    a single percentage number is by measuring the percentage of time that the CPU
    spends in its lowest priority state and then subtracting this number from 100
    to obtain the actual utilization percentage. In other words, the utilization'
  merge: -1
  pgno: 137
- img_proc: true
  md: '# Chapter 6 Watching


    percentage is the percentage of time between two polling intervals that the CPU
    spends in any state other than idle. There are many other ways. For example, some
    processors built-in performance counters that may be queried with system calls,
    using these as a popular alternative.


    The bottom line is that the classic CPU percentage metric meets all sorts of problems
    from a monitoring perspective. It is an overly volatile and ambiguous metric that
    doesn''t necessarily reflect the load on a system and, therefore, isn''t a good
    indicator of problems. Even in a capacity-planning context, the number has questionable
    value. For example, 100 percent CPU utilization can be a good thing if you are
    trying to optimize system performance for an application that is bandwidth- or
    I/O-intensive. My advice is to avoid this metric in system monitoring when you
    can.


    The second metric is that of UNIX load averages. This is a set of three numbers
    that represent the system load averaged over different time periods: 1, 5, and
    15 minutes. You may recognize load averages numbers exponentially damped and computed
    by the kernel, from several different shell utilities, including top and uptime.
    They tend to be less volatile than the CPU percentage metric, and they are always
    the same, no matter what you use. Exactly these numbers represent a question that
    is difficult to express without using math. In fact, the deeper one delves, the
    harder the math becomes, until order derivative calculus becomes involved. If
    you''re in that sort of thing, I''ll refer to Dr Neil Gunther''s paper here: www.teamquest.com/resources/gunther/display/5/index.html.


    For the rest of us, I''ll attempt an explanation in English. The current load
    average is the load from 5 seconds ago, plus the run-queue length, which is the
    sum of the number of processes waiting in the run-queue plus the number of processes
    that are currently executing. To save on kernel overhead, the kernel doesn''t
    actually compute three separate load averages. The numbers in the triplet are
    computed from a base number. When computing the load average for each time period
    in the triplet, a different exponential factor is applied to both the 5-secondold
    average and the current run-queue length to dampen or weigh the values accordingly.
    The ratio used by the damping/weighing factor is somewhat controversial, at least
    in Linux, but that in my experience, is a useful metric despite disagreement over
    exponential damping ratios.


    The load average metric is directly tied to the number of processes waiting for
    execution. Each new process waiting for execution adds 1 to the run-queue length,
    which affects the load average in the manner previously described. This is a much
    more practical metric of server utilization because it effectively captures how
    capable the system is of keeping up with the work it is given. For a single-CPU
    system, a load of 1 would be exactly 100 percent utilization, a better way of
    thinking about it is that the system has exactly'
  merge: -1
  pgno: 138
- img_proc: true
  md: '# Watching UNIX 115


    capacity to handle the current load. A load average of .5 would mean that the
    system has twice the capacity it needs to handle the current load, and 3 means
    the system would need three times the capacity it currently has to handle the
    load. For multi-CPU systems, the load numbers should be divided by the number
    of CPUs, so a load average of 3 on a four-CPU system means the system is 75 percent
    utilized or it has a quarter more than it needs to handle the current load.


    There are two problems with the utilization triplet that you should be aware of.
    The first, and probably worst of the two, is that the triplet is not understood
    by laymen, as managers and execs, you have no hope of educating them. The second
    problem with the triplet is that the run-queue length is not strictly CPU-bound.
    Bad server problems, as EXT3 panics, also cause processes to back up in the run-queue,
    at least on Linux. In practice, this turns not out to be too bad of a problem
    because anything that is backing the run-queue is bad news and bears your attention,
    anyway.


    There are various pearls of wisdom floating in books and on the Web, which says
    things “load averages above 3 are bad.” I would agree that you probably not upgrade
    a single-CPU system that is perpetually loaded at 3, but in the context of monitoring
    thresholds, nothing is written. In the real world, I have seen systems as high
    as 25 before showing any real signs of latency, and I have several boxes I don’t
    worry about until they get at least high. Figuring out what your thresholds should
    be defined for you, check out my discussion of baselines in Chapter 1, “Best Practices,”
    and decide accordingly.


    The first step in setting up a CPU check is to add the check_load command to the
    nrpe. cfg file at the bottom of the file should look something like this:


    ```

    command[check_load]=/usr/libexec/check_load -w $ARG1 -c $ARG2

    ```


    Notice the macros in the nrpe.cfg definition. In previous examples with the nrpe.cfg
    file, I used static thresholds. Static thresholds are generally preferable, from
    a security-point, because potentially dangerous data is not accepted by the NRPE
    daemon. In practice, most people use ctwrappers to access to the daemon and use
    argument to randomize the thresholds on the Nagios server. Static thresholds on
    a per-host basis quickly become too much for administrators to manage


    To pass arguments, you must first compile nrpe with enable-command-args, and set
    dont_blame_nrpe to 1 in the nrpe.cfg.(Because the feature is doubly disabled by
    default and called “Don’t blame us” in the config file should give you pause.
    Use it at your own risk.)'
