  md: 'intrinsic capabilities of any type and that is a good thing), the check_snmp
    plugin, combined with passive alerts and the snmptrad daemon from the net-snmp
    project, make it into an SNMP manager that is capable of both polling SNMP devices
    for information and collecting traps from SNMP agents.


    # Working with SNMP


    Let''s get down to business and start monitoring some devices using SNMP. The
    first step is to get and install the net-snmp libraries on the Nagios server.
    The libraries are freely available from net-snmp.org. When installed, you may
    have to rebuild the plugins in order to check_snmp installed because it won''t
    build unless the net-snmp libraries exist. After everything''s installed, you
    can start poking around your devices with the snmpwalk program from the net-snmp
    package.


    Of course, these days SNMP is probably disabled on your networking gear, before
    snmpwalk can see anything, you have to enable SNMP somewhere. The commands in
    Listing 6.28 should get SNMP working in a relatively safe manner on most modern
    Cisco routers.


    # Listing 6.28 Enabling SNMP on Cisco routers.


    ```

    ip access-list standard snmp-filter

    permit 192.168.42.42

    deny any log

    end

    snmp-server community myCommunity RO snmp-filter


    ################alternatively, if your router supports V3################

    snmp-server view myView mib-2 include

    snmp-server group Read v3 read myView

    snmp-server user dave ReadGroup auth md5 encryptionRocks

    ```


    Line 1 creates an access list snmp-filter. The permit line specifies the Nagios
    server, allowing it to connect. All hosts are denied and their attempt logged.
    Finally, SNMP is enabled in a read-only capacity, with the community name of myCommunity,
    to the hosts allowed in the access list snmp-filter. The SNMP V3 config is outside
    the scope of this book. Check out what the router has to say for itself.


    ```

    snmpwalk -v2c -c myCommunity 192.168.42.42

    ```


    The -v switches the protocol version; -c is the community string. This command,
    on my Cisco 2851 router, returns 1,375 lines of output. Most of it looks like
    Listing 6.29, which is to say it looks like a bunch of unrecognizable SNMP gobby-gook.'
