  md: '# Make


    There are, in fact, five make targets to build various pieces of Nagios. A simple
    make will build all Nagios and the Web front-end. Table 3.4 lists the other build-related
    make targets.


    Table 3.4 Build-Related Make Targets


    | Target | Description |

    | --- | --- |

    | make nagios | Just makes the Nagios Daemon, without the Web interface. |

    | make egis | Makes only the Web interface, without the daemon. |

    | make modules | Makes the Event Broker Modules. As of this writing, there''s
    only one, helloworld.o, which is really useful for people who want to learn how
    to program NEB Modules. |

    | make contrib | Makes various user contributed programs. There are five of these.
    The more useful ones include a traceroute CGI, a sample apache config file, and
    a stand-alone version of the embedded Perl interpreter for testing Perl plugins.
    |


    # Make Install


    Executing make install installs the daemon, CGIs, and HTML files. Other install-related
    make targets exist, as defined in Table 3.5.


    Table 3.5 Install-Related Make Targets


    | Target | Description |

    | --- | --- |

    | make install-base | Installs only the Nagios Daemon without the Web front-end
    |

    | make install-egis | Installs the CGI programs |

    | make install-html | Installs only the static HTML pages |

    | make install-init | Installs the init file (to the directory specified by the
    --with-init-dir configure option) |

    | make install-config | Installs sample configuration files |

    | make install-commandmode | Creates the external command file (as described at
    the end of Chapter 2) |

    | make uninstall | Uninstalls Nagios |

    | make fullinstall | Installs the kitchen sink (everything) |'
