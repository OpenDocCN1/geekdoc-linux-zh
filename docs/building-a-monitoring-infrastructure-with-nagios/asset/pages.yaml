  md: "# Watching \"Other Stuff\"\n\nOur discussion, thus far, has focused on traditional\
    \ computer systems running some form of\nWindows or UNIX. In this section, I'll\
    \ take a look at some of the other stuff you can monitor\nwith Nagios, including\
    \ networking gear and environmental sensors.\n\n# SNMP\n\nSNMP was created by\
    \ the IETF in 1988 as a way to remotely manage IP-based devices. It\nwas originally\
    \ described in RFC 1157 and since then, has become as ubiquitous as it is\nhated\
    \ by security professionals worldwide, but more on that later. The protocol is\
    \ actually\nvery large in scope. The IETF clearly did not intend to provide a\
    \ communication protocol,\nbut rather to provide a standardized configuration\
    \ instrumentation to all IP-based devices\\going forward. In doing so, they not\
    \ only specified strictly-typed variables for configuration\nsettings also an\
    \ all-encompassing database for network device configuration settings and\nstatus\
    \ information.\n\nImagine, for a moment, a single hierarchical structure that\
    \ gives a unique address to every\npiece of information and configuration setting\
    \ on every IP-enabled device in the world. The\nhierarchy you are imagining is\
    \ the SNMP MIB tree (Managed Information Base). Each\nconfiguration setting is\
    \ given an address, called an Object Identifier (OID). The OID address\nisimilar\
    \ to an IP address, in that it is dot separated and gets more specific from left\
    \ to right.\nEach number in the address specifies a node in the MIB. Let's dissect\
    \ an example OID.\n\n```\n.1.3.6.1.2.1.2.2.1.8\n```\n\nAs you can see, the OID\
    \ is very much like an overly long IPv4 address. Like DNS records,\nthe beginning\
    \ “ is on the left roots of the tree. The first number, belongs to\nthe International\
    \ Standards Organization, therefore, every node specified in this hierarchy is\n\
    administered by the ISO. The 3 has been designated by the ISO for use by “other”\
    \ organi-\nzations. The United States Department of Defense owns 6 and its Internet\
    \ Activities Board\n 1. Every OID you'll come into contact with will probably\
    \ begin with .1.3.6.1. Fig-\nure 6.1 graphically depicts this common hierarchy."
