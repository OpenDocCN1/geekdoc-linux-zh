- img_proc: true
  md: 'The DEF is given a name, such as a variable; in this case, the foo DEF refers
    to the 5-minute Data Source in the /usr/nagios/rrd/umbra_load RRD. The average
    keyword specifies that you want the data from RRAs that use the AVERAGE consolidation
    function (if you have more than one type).


    This DEF can now be graphed with a graph element definition. There are several
    types of graph elements; the most commonly used ones are AREA and LINE. The LINE
    graphs look like the graphs in Figures 7.1 through 7.3. AREA graphs look like
    the graph in Figure 7.7.


    ![](img/7c754ef117b945190cb5d61f0388dd22_174_0.png)


    **Figure 7.7** Area graph with three data sources.


    The only difference between a LINE and an AREA definition is the word LINE or
    AREA. Lines may be drawn in three thickness levels. LINE1 is the thinnest and
    LINE3 the thickest. The graphic element definition looks like this:


    ```

    AREA:foo#0000FF:avg5min

