  md: '# Installation Steps and Prerequisites


    Let''s get this show on the road. The high-level steps to install Nagios


    +   1. Obtain and install Nagios'' dependencies.

    2. Obtain and install Nagios.

    3. Obtain and install the plugins'' dependencies.

    4. Obtain and install the plugins.


    Nagios has only a few dependencies, and most of them are optional. If you want
    to use the Web-front, which is the only interactive interface available, you need
    a server with CGI support, such as Apache (see www.apache.org for more information).
    Three graphics libraries are needed if you want Nagios to display pretty pictures
    and graphs: libpng, libjpeg, and the gd library. The only required dependency
    is zlib, and chances are you already have that.


    The plugins'' dependencies are more of a moving target. You need a ping program,
    some BIND tools, such as host, dig, or nslookup, the OpenSSL library, and Perl.
    If you plan on querying network objects with SNMP you need net-snmp and possibly
    perl-snmp. Depending on what you need to monitor, packages such as OpenLDAP, Kerberos,
    and MySQL/pgql may be needed for special purpose plugins.


    On most OSs, the configure script in the plugins package is good at figuring out
    what packages you have and automatically building plugins for them. If you lack
    a package, such as OpenLDAP, configure will simply not attempt to build the plugins,
    rather than generate an error. Solaris has an adept technical reviewer, Kate Harris,
    who says that she has to comment out the SNMP portions of the makefile to get
    the plugins to compile. The base directory of the plugins tarball contains a REQUIREMENTS
    file, which lists the requirements of specific plugins, so be sure to check it
    out before you build.


