  md: '# Auto-Discovery


    # Auto-Discovery


    Skeletons are all well and good if you have a list of hosts upfront; however,
    what if your network is so large, or changes so often, that getting a list of
    hosts is a problem in itself? Enter auto-discovery. In this section, I present
    a couple tools I use to automatically detect and retrieve configuration files
    for hosts and services on the network.


    Be careful! Nothing can give your monitoring system a bad rap more quickly than
    zealous, automated scanning and discovery tools. The traffic generated from these
    sorts of tools may be malicious in nature to intrusion detection systems or rude
    to people who are unaware of your effort. Before you use any of these tools, make
    sure you read their documentation and understand how they work, so you don''t
    generate more traffic than necessary. Also, be sure that you''ve notified the
    relevant people at your organization before you set loose on your network.


    # Nmap and NACE


    My favorite auto-discovery tool is the Nagios Automated Configuration Engine,
    or NACE, written by Russell Adams, one of this book''s technical reviewers, NACE
    is a set of slick Perl scripts that work together to detect hosts and write configuration
    files for them. NACE uses input from SNMP queries and the network scanner Nmap,
    and is capable of writing configuration files for hosts, hostgroups, and services.
    The current release consists of 11 scripts and a library. The scripts are designed
    to be tied together UNIX pipes and understand a common, colon separated input
    syntax. I won''t document all 11 commands. Instead, I''ll give you a rough idea
    of how NACE might be used in the real world, and if you like it, you can grab
    a copy from www.adminsinfosev.com/AISTWiki/bin/view/AIS/NACE.


    Scripting scanners, NACE needs a list of hosts to get started. For this, the popular
    network scanner, Nmap, may be employed. For example, the following command generates
    hosts for every host that responds to a ping on the 192.168.5.0 network work:


    ```

    nmap -sP -OG - 192.168.5.0/24 | grep ''Status: Up'' | cut -d\ -f2

    | WriteHosts.pl

    ```


    > Nmap is great. By way of description, here''s a quote from its author, Fyodor.
    "Network Mapper" is a free open source utility for network exploration or security
    auditing. It was designed to rapidly scan large networks, although it works fine
    against single hosts. Nmap uses raw IP packets in novels to determine what hosts
    are available on the network, what services (application name and version) those
    hosts are offering, what operating systems (and OS versions) they are running,
    what type of packet filters/firewalls are in use, and dozens of other characteristics."'
  merge: -1
  pgno: 103
- img_proc: true
  md: '# Chapter 5 Bootstrapping the Configs


    Let''s break the syntax down, in case you you aren''t familiar with Nmap. the
    sP switches Nmap which type of scan to run. In our case, an ordinary ping scan
    will suffice. In mode, Nmap will go no further than simply noting whether the
    host is up. the OG switch specifies that Nmap should use a greppable output style,
    which is perfect for the way we use it. Example output from the Nmap scan appears
    in Listing 5.7.


    # Listing 5.7 Grepable Nmap output.


    ```

    Host: 192.168.5.1 ()               Status: Up

    Host: 192.168.5.2 ()               Status: Up

    Host: 192.168.5.31 (host.foo.com)      Status: Up

    Host: 192.168.5.32 (host1.foo.com)   Status: Up

    Host: 192.168.5.33 (host2.foo.com)   Status: Up

    Host: 192.168.5.34 (host3.foo.com)   Status: Up

    ```


    We grep this output for lines that contain Status: Up, filter everything but the
    IP address, and pipe the IPs to NACE''s WriteHosts.pl script. WriteHosts creates
    a cfg file for each host using the IP as name, and alias. You can use -d to add
    directives to the definition; for example, -d HT=generic_host adds a directive,
    which points the definition at a host template. This is certainly easier on the
    wrists than writing your skeletons. But WriteHosts.pl is only one script. NACE
    10 more where that came.


    Let''s say we want to use something descriptive than an IP address for the host_name
    directive. Here''s a command that uses the DNS name of the host for the host_name
    directive and the IP address for the directive:


    ```

    Nmap -sP -oG - 192.168.5.0/24 | grep ''Status: Up'' | sed -e ''s.*/\(([^\]]\*)\).*/\1/''
    | NormalizeHostNames.pl -s .foo.com | WriteHosts.pl

    ```


    This instance, of extracting the IP addresses from the Nmap command, we we then
    pass on to the NormalizeHostNames.pl script to extract the hostname, NormalizeHostNames.pl
    takes a domain suffix as an argument. It uses this suffix, which is actually a
    regular expression, to distinguish the hostname from the domain. NormalizeHostNames.pl
    will do DNS lookups, if necessary, to determine the IP address of the host. It
    passes the correctly formatted hostname and IP address of the host to WriteHosts.pl,
    which in turn, writes the configuration files.


    All manner of specific information can be extracted from network queries and formalized
    into Nagios configuration files with NACE, which even contain several of its SNMP
    query tools, which can be used to assign hosts to hostgroups and write services
    configs. Other tools for extracting from into Nagios configs.'
  merge: -1
