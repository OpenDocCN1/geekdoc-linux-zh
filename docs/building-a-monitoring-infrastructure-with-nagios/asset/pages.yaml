    \  command_name      check_tcp\n  command_line      $USER$/check_tcp -H $HOSTADDRESS$\
    \ -p $ARG1$\n}\n```\n\nUnlike ping commands, where a warning may be generated,\
    \ the result of a port query is\nusually either the port is available or it isn't.\
    \ Because there isn't much room\nof ambiguity, no -w or -c is necessary. All that\
    \ needs to be specified are the hostname and\nport number. The “all or nothing”\
    \ nature of the port check effects the notifications on warnings\\when warnings\
    \ cannot occur. Accordingly, the accompanying service description in Listing\n\
    6.5 is different from the check_ping service definition in Listing 6.2 in that\
    \ it specifies differ-\nent notification options and contains no threshold options.\n\
    \n# Listing 6.5 Check_http service definition.\n\n```\ndefine service{\n  host_name\
    \            jkwebServer\n  service_description  check_http\n  check_command \
    \       check_tcp!80\n  notification_options  c,r\n  use                  chapter6template\n\
    }\n```\n\nNote also that the service description in Listing 6.5 is check_http,\
    \ rather than check_tcp.\nThis is because the service description will appear\
    \ as the name of the service in the Nagios\nWeb UI, and check_tcp is not useful\
