  md: '# CHAPTER 3


    # Installing Nagios


    Nagios is composed of three big chunks: the daemon, the Web interface, and the
    plugins. The daemon and Web interface make up the tarball available from www.nagios.com,
    and the plugins must be downloaded and installed separately. (Some distributions
    include the plugins in their Nagios packages.) Although the Nagios daemon comes
    with the Web interface, the daemon may be installed alone. Nagios does not require
    the Web interface to effectively monitor the environment and send notifications.


    After the daemon is installed, most people download and install the plugins tarball.
    Installing the plugins is technically an optional step; it''s entirely possible
    to run Nagios with nothing but custom plugins, but most people consider that to
    be a reinvention of the wheel. The plugins provided by the Nagios Plugin Project
    are well written and contain what you need to monitor an enterprise network. This
    chapter covers the installation of all three chunks and provides a handy reference
    to the available configuration options.


    # OS Support and the FHS


    The Nagios daemon was designed for and on Linux, but it is capable of being run
    by any UNIX-like operating system, including Solaris, BSD, AIX, and even Mac OS
    X. There are even rumors on the mailing lists of success running the daemon under
    Cygwin on Microsoft Windows, but I haven''t personally seen it. If you''re going
    to attempt a Cygwin build, be sure to include --enable-cygwin in your configure
    options. Also note that I run Nagios mostly on Linux, so this discussion is aimed
    at Linux.


    The main difference between various UNIX environments running Nagios is the file
    system hierarchy standards associated with each. Unfortunately, different UNIX
    variants place the same file in different locations, which makes it difficult
    to predict where particular files'
  merge: -1
  pgno: 63
- img_proc: true
  md: '# Chapter 3 Installing Nagios


    might end up. It''s a problem that dates back to the BSD split, and no one has
    come up with a good solution. Even within different distributions of Linux, there
    may be differences in the file system hierarchy implementation. The only real
    way to know where all the files will wind up is if you manually install from source.


    Aside from some odd constructs, such as the AI convention of installing everything
    open source into /usr/pkgfree, most systems install Nagios in one of two ways:
    using either FHS or installing into /usr/local. The File System Hierarchy Standard
    (FHS), is a Free Standards Group proposed standard and describes where files should
    go in UNIX-like file systems. Most binary distributions I am aware of, such as
    Red Hat, Mandriva, and SuSE, well as some source-based distributions, such as
    Sourcemage, use the FHS to some degree. I''d like to place emphasis on the fact
    that although the FHS is a good standard, there is still a lot of disagreement
    and confusion as to how it works in practice. So Table 3.1, which shows the FHS
    Standard file locations for Nagios, should be considered a rough guide.


    # Table 3.1 Nagios File Locations in the FHS


    | File Type | Location |

    | --- | --- |

    | Configuration files | /etc/nagios |

    | HTML | /usr/share/nagios |

    | CGIs | /usr/share/nagios or /usr/lib/nagios |

    | Program Daemon and other executables | /usr/bin/nagios |

    | LockFiles and FIFOs | /var/lib/nagios or /var/log/nagios |

    | Logs | /var/log/nagios/ |

    | Plugins | /usr/libexec/nagios or /usr/lib/nagios |


    If you use a source-based distribution such as gentoo or manually install Nagios
    on Linux, Solaris, or the BSDs, expect to find everything under /usr/local or
    /usr/nagios, /usr/local/nagios is inconsistent with the FHS, which states that
    locally installed software—should be installed in /usr/local. That, is, not installed
    via the system''s package manager—should be installed at /usr/local. Table 3.2
    lists the locations for a local installation.


    # Table 3.2 Nagios file locations for Local Installs


    | File Type | Location |

    | --- | --- |

    | Configuration files | /usr/local/nagios/etc |

    | HTML | /usr/local/nagios/share |

    | CGIs | /usr/local/nagios/share |

    | Program daemon and other executables | /usr/local/nagios/bin |

    | LockFiles and FIFOs''s | /usr/local/nagios/var |

    | Logs | /usr/local/nagios/var |

    | Plugins | /usr/local/nagios/libexec |'
  merge: -1
