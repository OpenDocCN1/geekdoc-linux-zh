  md: '# Foundations, MRTG, and RRDTool


    because changing the way you store things later is difficult, not storing enough
    is something-thing that cannot be remedied after the fact.


    # MRTG


    RRDTool owes its lineage to the ever-popular MRTG. Written by Tobias Oetiker in
    1994, MRTG is now the industry standard for graphing utilization data from network
    gear. Every monitoring system is aware of claims support MRTG in one way or another.
    MRTG, with two plugins for querying data from MRTG logs and graphs, is no exception.
    However, for people building monitoring systems, MRTG''s usefulness is limited
    because it does its own polling and data collection.


    MRTG, in fact, can be thought of as a monitoring system. It is a script, run from
    cron, which periodically polls your SNMP-enabled devices for statistics. It stores
    these in something called a round database. An RRD is a circular data structure;
    a database that, when full, begins overwriting itself. This structure turns out
    to be perfect for its intended purpose. When allocated, the RRD never grows in
    size on the disk and allows for fast retrieval and manipulation. MRTG uses the
    data from the RRD to create HTML pages containing time-series graphs.


    MRTG is popular because it is a holistic solution. It is easy to implement and,
    when configured, everything from the SNMP collection to generate the HTML. Ironically,
    it is this property that makes it difficult for you to use in a systems-monitoring
    context. Because it does data collection via SNMP, it assumes all of your data
    is coming from SNMP-enabled sources.


    You already have a polling engine to collect data, and you want somewhere to store
    it. Ideally, your storage engine will be flexible about the kind of data it accepts
    and MRTG is not technical. Technically, you can implement an SNMP agent on youring
    server and make your data available to MRTG via SNMP, but this is needlessly complex.
    The thing that MRTG gets right, from your perspective, is the RRD. If there was
    a way to extract the RRD from MRTG and use it for arbitrary types of data, your
    needs would be met perfectly.


    # RRDTool


    In 1999, while MRTG''s author Tobias Oetiker was on sabbatical at CAIDA (the Cooperative
    Association for Internet Data Analysis), he began on RRDTool, which is exactly
    what the systems-monitoring community needed for time-series data visualization.
    Extracting the relevant parts of MRTG into separate utilities and extending their
    functionality, Tobias created a category killer for graphing time-series data.'
