  md: "# 68\n\n# Chapter 4 Configuring Nagios\n\nAll _interval time directives in\
    \ Nagios refer to a number of time units to wait before doing something. A time\
    \ unit is user-defin via the interval_length directive in nagios.cfg. By default,\
    \ this directive is set to 60 seconds, so, in general, any interval definition\
    \ is to refer to the number of minutes to wait before doing something.\n\nmax_check_attempts\
    \ is the number of times Nagios will retry a service. normal_check_interval is\
    \ the number of minutes to wait between service checks. retry_check_interval is\
    \ the number of minutes to wait between checks when the service is in a soft state\
    \ and Nagios is trying to verify the service. The timeperiod within which checks\
    \ may be scheduled is given by the check_period. notification_interval specifies\
    \ the number of minutes to wait between follow-up notifications. notification_period\
    \ defines the timeperiod within which notifications may be sent. notification_options\
    \ filters the type of notifications this service will send and, finally, contact_groups\
    \ specifies to whom the notifications should go.\n\nBased on the preceding information,\
    \ it is obvious that the amount of time service spends (the possible states are:\
    \ warning, unknown, critical, recovered, and flapping) in a soft state is a function\
    \ of max_check_attempts and retry_check_interval. If you aren't getting notifications\
    \ quickly enough, you can either retry less or lessen the amount of time between\
    \ retries.\n\n# Hostgroups\n\nRequired for daemon start\n\nRefers to: host\n\n\
    Referred to by: host, hostescalation\n\n# Listing 4.12 Hostgroup example.\n\n\
    ```\ndefine hostgroup {\n  hostgroup_name  oracle-servers\n  alias           Servers\
    \ Running Oracle\n  members         server1,server2\n}\n```\n\nIdentical in syntax\
    \ to contactgroups, hostgroup objects exist to ease administration and reporting.\
    \ Hosts may belong to multiple hostgroups. Membership may be defined in the host\
    \ objects via the hostgroup directive instead of using members in this object.\
    \ A unique feature of hostgroups is that multiple members' directives may be defined."
