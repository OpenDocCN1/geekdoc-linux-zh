  md: '# 16 Chapter 2 Theory of Operations


    The most important Nagios makes about your environment is that there are hosts
    and services. The definitions of these two objects are the basis by which all
    others are defined. You may think of a host in terms of a physical entity. Servers
    and network appliances are the most common types of hosts, but really, a host
    is anything that speaks TCP. Certain types of environmental sensors and my friend
    Chris''s refrigerator are also examples of hosts. Services are the logical entities
    that hosts provide. The web server daemon that runs on the server sitting in the
    rack is a service.


    Typically, a single host runs multiple applications or at least multiple elements
    that bear watching, but the host will be up or down, available or not. Therefore,
    Nagios allows you to define a single check mechanism and multiple services for
    each host. These host and service check definitions are what tell Nagios plugins
    to call to obtain the status of a host or service. For example, check_ping plugin
    may be defined as the check for Server1. If the host check fails, the host is
    not available. If the host is down, then all of the services on that host are
    not available, so it would be silly to send a page for each individual service.
    It would be silly, in fact, to run the service checks until all, the host itself
    becomes available.


    The hosts/services assumption makes it easy for Nagios to track which services
    are dependent on what hosts. When Nagios runs a plugin on a service provided by
    a host and that plugin returns an error state, the first thing Nagios will do
    is run the host check for host. If the host check also returns an error state,
    the host is unavailable and Nagios will only notify you of the host outage, postponing
    the service checks until the host becomes available.


