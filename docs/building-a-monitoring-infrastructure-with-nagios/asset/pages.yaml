- img_proc: true
  md: '# Foundations, MRTG, and RRDTool


    # Min and Max


    You may define a minimum and maximum range of acceptable values for your data
    source, as a sort of sanity check. If the value returned by the polling engine
    doesn''t make sense as defined by the min and max values, the data source value
    for polling interval is considered unknown. If you do not want to specify a max
    or min, you may specify a U (for unknown) instead.


    A single round robin database can accept data from any number of data sources.
    Because the RRD must allocate all the space it needs upfront, the data sources
    are defined when the RRD is created with the RRDTool create command. This means
    that you must decide, upfront, how much data you want to keep. Because the data
    inside the RRD might be useful and disk space is cheap, you should keep as much
    of it as possible for as long as you think it might be relevant. Keeping data
    over a year is quite common in practice. Long-term data is for important undertakings,
    such as convincing management to upgrade hardware.


    # Round Robin Archives


    If you were to poll a counter on a router every 60 seconds for a year, you would
    have approximately 525,600 primary data points (PDPs). Storing this for every
    metric monitor, on every server you monitor, quickly adds up to a lot of disk
    space and slow the growth of graphs for large data sets, so RRDTool helps you
    with its builtin consolidation features. You may tell RRDTool to automatically
    consolidate your data using a number of different built-in consolidation functions.
    These functions include AVERAGE, MIN, MAX, and LAST.


    For example, if you measure the temperature in your cabinet, you are only interested
    in the maximum temperature it reaches each week, you can tell RRDTool to use the
    MAX consolidation function on your data every week. RRDTool creates an archive
    containing your highest weekly temperature. This archive of consolidated data
    is called a Round Robin Archive. You may define as many RRAs as you want, although
    you must specify at least one. RRAs allow you to consolidate your data in several
    ways in the same database. This turns out to be a great answer to the space and
    speed problems with keeping large amounts of long-term data.


    For example, you might specify three different Round Robin Archives for Router''7
    counter. The first might hold three days worth of uncompressed data (43,200 PDPs).
    The second might store one year''s worth of data by using the AVERAGE consolidation
    function to average the primary data points every 10 minutes. This would keep
    one data point for every 10 minutes (4,230 averaged PDPs). The third RRA might
    keep 5 years of data by averaging the data points every 20 minutes (10,800 PDPs).'
