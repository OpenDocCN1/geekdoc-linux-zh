  md: '# Function References and Callbacks in C


    The first argument is a normal integer input, but the second argument is strange
    indeed: int (*fPointer)(int). If you try to parse it as a variable argument, it
    doesn''t make any sense, but this isn''t a variable argument; it''s actually a
    multifunction declaration inside the convert declaration. So, in plain English,
    the convert function takes two arguments. The first is an int input, and the second
    is a pointer called fPointer, which points to a function that takes a single int
    as an argument and returns an int. If the fPointer function took an int and a
    float, the declaration would look like the following:


    ```

    int convert(int input, int (*fPointer)(int,float))()

    ```


    The convert function just turns around and calls whichever conversion function
    to which it is passed a pointer. Passing a function pointer to convert is just
    like passing any other pointer. You simply use the & operator to pass the memory
    address that corresponds to the conversion function you want to use. In Listing
    8.1, the f2c conversion is used, so you pass &f2c (the address of f2c) to convert.
    If you don''t understand it, no worries; I recommend checking out www.newwy.net/fpt/intro.html.


    # The NEB Architecture


    As depicted in Figure 8.1, the Event Broker itself is a software layer between
    Nagios and the NEB modules. Nagios notifies the Event Broker of interesting events.
    The Event Broker''s job is to figure out which modules, if any, are interested
    in the events and to create and pass out memory handles to the modules, which
    the modules can use to get work done.


    ![](img/7c754ef117b945190cb5d61f0388dd22_199_0.png)


    Figure 8.1 The NEB architecture from the perspective of the Event Broker.'
