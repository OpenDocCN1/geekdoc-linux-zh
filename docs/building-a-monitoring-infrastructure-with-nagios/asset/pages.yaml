  md: '# Chapter 7 Visualization


    Try to think about your graphics in terms of maximizing information per pixel.
    You know you are doing things correctly if you are packing large amounts of data
    into small areas. Fancy effects, such as 3D, should be avoided for this reason.
    3D effects usually take up more space and rarely add useful information. They
    also have a habit of obfuscating the useful information that remains. Silly widgets,
    such as thermometers, speedometers, or any "meters," should be avoided for the
    same reason. These things take up a lot of space to communicate a single signal.


    You should attempt to keep your graphs as uncluttered as possible, so that they
    stand on their own without extra explanation. If the graphs are large and there
    is space, label the individual points for clarity. Axis labels should convey the
    units they express, and titles should be carefully thought out, short, and descriptive.


    Of course, all of this highbrow goes out the window when marching orders are to
    provide whiz-bang displays with little or no substance. Many a well-built monitoring
    system has been sacrificed in favor of a kludgy black box with no-graph that implies
    the excesses. Because the benefit of your hard-won monitoring solution may one
    day rest on your ability to come up with something other than line graphs, my
    last piece of advice to you is not to be a visualization elit. Be afraid to throw
    away a speedometer or two over, for no other reason to prove you can. By all means,
    guide and educate the people who will use the dashboard, but remember that the
    data consumer defines the interface.


    Some of the tools that can follow can provide the eye-candy coveted by the every
    echelon, but all of them (well, most of them) can also be used to create interesting
    visual displays that are very useful in a pragmatic sense. The art, or science,
    of data visualization is growing quickly, especially in the area of IT service,
    where visualization may be the only hope for real-time enterprise event correlation
    in the absence of true AI. The tools referred herein not be considered a comprehensive
    list. They represent the tip of the iceberg, and by the time you read this, chances
    the iceberg will have grown considerably.


    # RRDTool Fetch Mode


    Just when you thought you were done with RRDTool, you must make one last foray.
    Because much of the historical data you need to visualize inside your RRDS, you
    need a way to query and extract it. RRDTool, in fetch mode, can give you raw dumps
    for a period of time. To use it, provide RRDTool the name of the RRD, the CF you
    are interested in, and the time range in seconds. For example, to get the last
    10 minutes of data from the server1_load.rrd, you type


    ```

    rrdtool fetch server1_load.rrd AVERAGE -s `date -d "10 minutes ago" +%s` \-e N

    ```'
