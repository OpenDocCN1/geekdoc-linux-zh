    # Sparklines


    Sparklines are a concept introduced by Edward Tufte in his recent book, Beautiful
    Evidence (find the Sparklines chapter online at www.edwardtufte.com/bboard/q-and-a-fetch-msg?msg_id=0001OR&topic_id=1).
    Sparklines, in Tufte’s words, are “intense, simple, word-sized graphics.” They
    are drawn in one of two ways: as a miniature line graph or a miniature bar graph.
    Sparklines are intended by Tufte to be viewed in the context of some text, as
    of an inline footnote. Figure 7.21 shows the page hits per day of a Web site for
    the last three months.'
