  md: '# 184 Chapter 8 Nagios Event Broker Interface


    With the next line, register with the Event Broker to receive events:


    ```

    neb_register_callback (NEBCALLBACK_SERVICE_STATUS_DATA, handle,

    ''42'', (void*)&handle_service_status);

    ```


    The neb_register_callback function is defined in callbacks.h. The definition looks
    like this:


    ```

    int neb_register_callback(int callback_type, void *mod handle,

    int priority, int (*callback_func)

    (void *));

    ```


    The neb_register_callback takes four arguments. The first is the constant describing
    types of events you are interested in. The second is a handle, which the Event
    Broker may use to find your module in the event that the broker needs to send
    you a notification. The third is a priority number. In general, when more than
    one module registers for the same type of event, they are executed in the order
    they are loaded and by the Broker on startup. You can override this by specifying
    a priority number.


    The last argument to neb_register_callback is a function pointer, as described
    in section "Function References and Callbacks in C." The function pointer must
    point to a subroutine that returns an exit code in the form of an int and accepts
    two arguments. The first of these is a constant specifying the event type; yes,
    once again, one of the constants specified in Table 8.1. The second is a void
    pointer, which is discussed shortly. So, this last argument to neb_register_callback
    is the function to which the Event Broker will actually send the event. It is
    the handler.


    But why the event handler need to be passed the event type? The event handler
    function should be able to infer the event type, because the events were specified
    at the same time that the handler was defined. In the example, the event handler
    was written to specifically handle one type of event that it registered for, but
    this isn''t necessarily a requirement. The nice thing about being passed back
    the event type constant is that it enables the module to register for more than
    one type of callback and handle each type it registers for a single event handler
    function.


    What is the null pointer? To answer this, look at what the Event Broker does when
    it makes the callback. Consider the code in Listing 8.7 from broker.c in the base
    directory of the tarball.'
