  md: "# Scripting Templates\n\nMany Nagios admins know (myself included) maintain\
    \ a set of what some refer to bootstrap templates. These aren't object templates\
    \ of the type discussed in Chapter 2, “Theory of Operations,” and Chapter 4, “Configuring\
    \ Nagios.” They are skeleton config files that can be easily combined with lists\
    \ of hosts to create valid Nagios configurations. To avoid confusion with object\
    \ templates, I refer to them as skeletons for the remainder of the chapter.\n\n\
    With this methodology, all that's needed in practice is a plaintext list of hosts.\
    \ After the skeletons are created, we simply loop through the host list, using\
    \ sed to inject the hostnames into the skeletons, creating valid definitions.\n\
    \nThere are usually two skeletons for each type of object: an object template\
    \ skeleton and an object definition skeleton. The template skeleton is a Nagios\
    \ object template that encompasses as much information as possible. The definition\
    \ skeleton has just enough information to define it and relies on the template\
    \ for everything else. We can specify more information, on a per object basis,\
    \ to override the overly general template as necessary. Listing 5.1 is an example\
    \ of a host template for use with a definition skeleton.\n\n# Listing 5.1 A host\
    \ template skeleton.\n\n```\ndefine host{\n  name                  generic_host\n\
    \  max_check_attempts    2\n  notification_interval 60\n  check_period       \
    \   24x7\n  notification_options   d,u,r\n  check_command         check-host-alive\n\
    \  contact_groups        admin\n  register              0\n}\n```\n\nAs you can\
    \ see, the host template skeleton is just a normal object template in Nagios.\
    \ The only odd thing about it is that contact_groups is a directive people usually\
    \ assign on a per host basis. Take this template and put it in a file called hosts.cfg.\
    \ Listing 5.2 shows the second half of the equation, the definition skeleton.\n\
    \n# Listing 5.2 The host definition skeleton.\n\n```\ndefine host{\n  use    \
    \               generic_host\n  host_name             NAME\n  alias          \
    \       NAME\n  address               NAME.DOMAIN\n}\n```"
  merge: -1
  pgno: 100
- img_proc: true
  md: "# Scripting Templates\n\nSo, given those listings, you probably have a pretty\
    \ good idea of how this is going to shake out. The skeleton object will inherit\
    \ everything it needs from the generic_host template, except for the name and\
    \ address of the host. Save the object skeleton in a file as hosts.skel. All that's\
    \ missing is a hostname and domain name. We can easily fill this in with a list\
    \ of hosts, as cat the one in Listing 5.3.\n\n# Listing 5.3 A list of hosts.\n\
    \n```\nHost1.mydomain.com\nHost2.mydomain.com\nHost3.mydomain.com\n```\n\nFinally,\
    \ the shell script in Listing 5.4 takes a list of hosts from standard input. Lines\
    \ 5 and 6 extract the host and domain names from each element of the list, and\
    \ line 7 replaces the keywords NAME and DOMAIN in the skeleton file with their\
    \ actual equals.\n\n# Listing 5.4 A shell script to create a hosts.cfg from the\
    \ skeletons and host list.\n\n```\n#!/bin/sh\nwhile read i\ndo\nNAME=$(echo ${i}\
    \ | cut -d. -f1)\nDOMAIN=$(echo ${i} | cut -d. -f2)\ncat hosts.skel | sed -e \"\
    s/$NAME/$NAME/\" -e \"s/$DOMAIN/$DOMAIN/\" >> hosts.cfg\ndone\n```\n\nYou can\
    \ do the same thing with the services.cfg and hostgroups.cfg. Services.cfg will\
    \ probably specify little other than a ping service. The template would look something\
    \ like the one in Listing 5.5.\n\n# Listing 5.5 A services template for use with\
    \ a definition skeleton.\n\n```\ndefine service{\n    generic-service\n    active_checks_enabled\
    \ 1\n    passive_checks_enabled 1\n    parallel_check 1\n    obsess_over_service\
    \ 0\n    check_freshness 0\n    notifications_enabled 1\n    event_handler_enabled\
    \ 1\n    flap_detection_enabled 0\n    process_per_data 1\n    retain_status_information\
    \ 1\n(continues)\n```"
  merge: -1
  pgno: 101
- img_proc: true
  md: "# Listing 5.5 A status template for use with a definition skeleton. (Continued)\n\
    \n| retainnonstatus_information | 1 |\n| check_period | 24x7 |\n| max_check_attempts\
    \ | 2 |\n| normal_check_interval | 5 |\n| retry_check_interval | 1 |\n| notification_interval\
    \ | 60 |\n| notification_period | 24x7 |\n| notification_options | W, u, c, r\
    \ |\n| contact_groups | admin |\n| register | 0 |\n\nWith so much defined in the\
    \ template, the shell script in Listing 5.4 can be used with the definition skeleton\
    \ in Listing 5.6 to create valid ping services for each host.\n\n# Listing 5.6\
    \ A services definition skeleton.\n\n```\ndefine service{\n  generic-service\n\
    \  host_name NAME\n  service_description PING\n  notification_options c,r\n  check_command\
    \ check_ping!500.0,20%!1000.0,60%\n}\n```\n\nHosts and service definitions are\
    \ the hard part. After you are done with those, you can define the admin group\
    \ in contactgroups.cfg, define the members of the group in contacts.cfg, create\
    \ a group with all the hosts, and you're ready to go. Of course, each of those\
    \ files can be scripted with skeletons that make work for larger installs.\n\n\
    I once worked with someone who told me that I was the type of person who liked\
    \ to “cut metal.” What he meant by that was that I wanted to begin implementing\
    \ the planning before it was done. Although I'm familiar with several ways to\
    \ bootstrap skeletons, because they allow me to get some work done and adhere\
    \ to the “Procedural Approach to Systems Monitoring” I describe in Chapter 1,\
    \ “Best Practices,” at the same time.\n\nIn fact, I Nagios templates and skeletons\
    \ to document business requirements during the planning process. By the time implementation\
    \ turns around, I usually have some complex configuration out of the work and\
    \ just need a list of hosts and a few scripts. I find this implementation a breeze,\
    \ gets everyone what they expect from the beginning, and most importantly, allows\
    \ me to at least “put chalk lines on the metal.” So, if you have itchy tin-snip\
    \ fingers, like me, and you’re taking Chapter 1 serius, you can’t go wrong with\
    \ scripting skeletons."
