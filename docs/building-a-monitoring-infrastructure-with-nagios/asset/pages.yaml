  md: '# Local Queries


    # 93


    This works well; if Company B answers anything other than “250 okay” to any part
    of the handshake, the administrators at Company A are immediately notified. there’s
    no reason this definition can be expanded to include the data portion of the SMTP
    conversation, if it were required.


    For the record, you should get permission from someone before you do things such
    as this. Monitoring things you don’t own can get you into trouble. Another thing
    to keep in mind is service checks that actually interact with the services they
    are watching effect things such as logs and connection statistics. If the data
    portion were included, Bob anyway would actually get an email message; it’s advisable
    to stop short of something that directly affects a human being. On the other hand,
    poorly written daemons might have problems with service checks that never the
    connection at unexpected times. Finally, administrators on the other end might
    use filters to block access to your monitoring tools if they think the traffic
    might be malicious in nature. As I said in Chapter 1, “Best Practices,” always
    put some thought into the things you monitor, especially if those belong to your
    company or group.


    The next example centers on Ted, who is a systems administrator for a moderately
    sized health care company. Ted is responsible for obtaining SSL from the company’s
    rather shady PKI vendor, VeriSure. Ted is also responsible for registering new
    domain names, but the company doesn’t use VeriSure for this. Recently, Ted’s mailbox
    has been filling up with email from VeriSure. Most of them are marketing emails,
    offering Ted discounts to move his company’s domain registry to VeriSure. Because
    his owns a few domains and SSL certificates, Ted is receiving about 20 of these
    message per day, so he has a dilemma. Ted wants /dev/null all email from VeriSure,
    but he also needs to get SSL expiry notifications. Guess what the command in Listing
    6.10 does.


    # Listing 6.10 A solution for Ted.


    ```

    define command{ check_ssl

    command_line $USER$/check_http $ARG1 -C 10

    }

    ```


    Check_http is a great plugin that can do sorts of useful things. The job of the
    -C switch is to check the expiry date of a given Web’s SSL certificate. If the
    certificate on the Web site expires in less than the number of days given (ten,
    in this case), the plugin generates a critical error. This solves Ted’s problem
    and is probably a bit more reliable than VeriSure notifications.'
