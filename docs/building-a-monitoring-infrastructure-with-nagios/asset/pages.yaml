    # Chapter 6 Watching


    When the H execution environment (or host, in Microsoft parlance) is not specified,
    the default host, out of the box, is (of course) Wscript, is probably not what
    you want. There are a few other annoyances built into WSH, such as its habit to
    output a banner that informs you that your script was run by Microsoft''s WSH.
    In Cscript, this banner is actually injected into the output of your program (STDOUT,
    STDERR). This is bad if you''re writing Nagios plugins because Nagios will only
    parse the first line of text output by plugin. Switches switch to change the default
    behavior. The following is what most people use:


    ```

    cscript //I //nologo //H:cscript //S

    ```


    The switch specifies interactive mode as opposed to batch mode. Nologo removes
    the banner. The H switch specifies that Cscript should be the default script host,
    making it possible to launch foo.vbs without specifying Cscript. Finally, the
    S switch saves these settings to the registry, making them permanent.


    # COM and OLE


    Although UNIX relies on small, text-based, single-purpose programs that work together
    toward accomplishing tasks, Windows, as an environment, tend toward large, monolithic,
    graphical programs. This poses a dilemma to would-be automators: How do you script
    a GUI? Enter Component Object Model (COM). Since 1993, COM and related technology
    have attempted to provide a language-agnostic interface that is is immune to automated
    integration.


    Software developers build their applications using COM-aware components. If implemented
    correctly, these components provide interfaces to the applications'' functionality
    via any other program that speaks COM. These interfaces can be used for any number
    of purposes, such as interprocess communication or event automation. Ole is COM''s
    object model. OLE gives objects their names and specifies such things as object
    inheritance. Most people associate OLE with embedding an Excel spreadsheet within
    a word document (the purpose it was originally designed for in 1991), but it is
    now much more powerful than that.


    Because most important applications in Windows expose their functionality via
    COM, and WSH provides access to any COM object, it is possible to use scripting
    languages such as Perl and VBScript to automate applications in Windows, including
    everything from creating Excel documents to driving Microsoft Management Consoles
    (MMC). OLE and COM provide the guide with which Nagios may be tied to any application
    that'
