    as universities, hospitals, and corporations to master the procedural aspects
    of their IT. This has had good consequences, as many organizations of size today
    have contingency plans in place, to ensure that something happens. Disaster recovery,
    business continuity, and crisis planning ensure that the people in the trenches
    know what systems are critical to their business, and how to recover them they
    should be destroyed. These certifications also ensure that management has done
    due diligence to prevent failures to critical systems; for example, by installing
    redundant systems or moving tape backups.


    For whatever reason, monitoring systems seem to have been left out of this procedural
    approach to contingency planning. Most monitoring systems in the network as a
    pet project of one or two small tech teams who have a very specific need for them.
    Many different teams will employ their own monitoring tools independent of, and
    oblivious of other monitoring initiatives within the organization. There seems
    to be no need to involve anyone else. Although this single-purpose approach to
    systems monitoring may solve an individual''s or small group''s immediate need,
    the organization as a whole, and fragile monitoring systems always grow.


    To understand why, consider that in the absence of a procedurally implemented
    framework, important questions are nearly impossible to answer. For example, consider
    the following questions:


    +   - What amount of overall bandwidth is used for systems monitoring?

    - What routers or other systems are the monitoring tools dependent on?

    - Is sensitive information is being transmitted in clear text between hosts and
    the monitoring system?


    If it was important enough to write a script to monitor a process, then it''s
    important to consider what happens when the system running the script goes down,
    or when the person who wrote the script leaves and their user ID is disabled.
    The piecewise approach is by far the problem that are too many to be counted.


    The core issue in our previous example is that there are no criteria that coherently
    define what a “problem” is, because these criteria don''t exist when the monitoring
    system has been installed in a vacuum. Our manager felt that he had no visibility
    into system problems and'
