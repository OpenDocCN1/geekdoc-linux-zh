  md: "# Contacts\n\n# Listing 4.7 Contact example. (Continued)\n\n```\nservice_notification_period\
    \ work-hours\nhost_notification_options d,u,r,f\nservice_notification_options\
    \ W,u,c,r,f\nhost_notification_commands host-email, send-sms\nservice_notification_commands\
    \ service-email\nemail dave@okeptech.org\npager 555-1024\naddress1 dave_josephson@gmail.com\n\
    address2 cn=djosephs,ou-foo,dc=bar,dc=\n```\n\nThe contact object defines everything\
    \ Nagios needs to know about a person. The name and aliases provide the usual.\
    \ Two timeperiod objects may be specified: the hours which the contact wants to\
    \ be notified of host problems and those during the contact wants to be notified\
    \ of service problems. Each contact can filter the types of alerts for host and\
    \ service problems (as discussed in Chapter 2) with the notification_options directives.\
    \ The notification_commands refer to command definitions that perform notification\
    \ actions, such as sending emails or controlling armies of self-autonomous messenger\
    \ robots. Notification commands usually look something like the ones in Listing\
    \ 4.8. Several addresses can be defined, all of them optional. These include an\
    \ email address, a pager address, and any number of addressX directives.\n\n#\
    \ Listing 4.8 A notification command definition.\n\n```\ndefine command{\n  command_name\
    \ host-notify-by-email\n  command_line /usr/bin/printf \"%s\" \"***** Nagios *****\\\
    nnNotification Type: $NOTIFICATIONTYPE$\\nHost: $HOSTNAME$\\nnState: $HOSTSTATE$\\\
    nADDRESS$\\nInfo:\n$HOSTOUTPUT$\\nnDate/Time: $LONGDATETIME$\\n\" | /usr/bin/mail\n\
    -s  \"Host $HOSTSTATE$ alert for $HOSTNAME!\" $CONTACTEMAIL$\"\n```\n\nNagios\
    \ has no real concept of what these addresses mean; it simply makes them available\
