- img_proc: true
  md: '# Management Interfaces


    dictate the definition of the management interface, be it anything from an emailed
    report to an alternative Web interface written in (gasp) Flash. Hopefully, this
    section will point you toward some tools that will be useful to you in meeting
    the specialized needs of your data consumers.


    # Know What You''re Doing


    Before you start designing custom interfaces and dashboards, I would highly recommend
    you read on what good visualization is and especially what it isn''t. There are
    many ways to get it wrong and only a few to get it right. I highly recommend Edward
    Tuf''s book, *The Visual Display of Quantitative Information*. I will give you
    a few tips to get started, but I''m certainly no expert, so be sure to do your
    homework before you get started.


    First, avoid pie charts. Although adored by marketing folks, pie charts are awful
    for visualization for several reasons. Primary among these is that humans are
    notoriously bad at interpreting angles (3D effects on pie charts only make things
    worse.) Given two similar values in a pie chart, most people will not register
    the difference unless you point it out to them or publish values in the legend
    labels. Secondly, pie charts have no frame of reference, which means that people
    can glean only the actual value each slice represents by reading it in a label.
    Finally, pie charts have no obvious beginning or end, which makes it difficult
    for people to know where to focus their attention.


    Anything you can visualize with a pie chart is better visualized with a bar or
    point chart. These provide a frame of reference on two axes and communicate data
    more effectively to humans, in general. If you absolutely have to use a pie chart,
    do not compare more than a few values and be sure to colorize in such a way the
    slices have a high contrast.


    Bar charts are especially good at depicting categorical information, so if you
    have information that fits into categories, use a bar chart and arrange the data
    so that the largest values are furthest to the left. Point charts or line charts
    are better for depicting time-series data. The time-series data graphed in Figures
    7.13 and 7.14 give a good example of how much clearer point graphs are when information
    is depicted as a function of time.'
