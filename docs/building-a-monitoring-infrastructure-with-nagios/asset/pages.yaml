  md: "# Local Queries\n\nThere are two ways people use check-tcp in practice. The\
    \ first is to use a single check-tcp command definition and to specify the port\
    \ and service description in the service definition, as we did in Listings 6.4\
    \ and 6.5. The other way is to write a specific command definition for the service\
    \ you want to monitor. This way, you can add some protocol-specific options to\
    \ check_tcp, you don't have to specify the port in the service check, and the\
    \ service description can match with the check name.\n\nRedo the check_http service\
    \ in Listings 6.4 and 6.5; it will give you an idea of what protocol-specific\
    \ command definitions mean. Listing 6.6 is a check_http command definition that\
    \ uses check_tcp but is hard-coded to check the HTTP port.\n\n# 6.6 A protocol-specific\
    \ check_tcp command definition.\n\n```\ndefine command{\n  command_name    check_http\n\
    \  command_line    $USER$/check_tcp \\ \n  -e 'HTTP/1.0 200 OK' -H$HOSTADDRESS$\
    \ -p 80 -s 'GET / HTTP/1.0'\n}\n```\n\nOur new command definition makes use of\
    \ -s (send) to actually send some text to the specified port on the given host.\
    \ The line wrap is there because the HTTP protocol expects this. This command\
    \ uses -e (expect) to specify what we expect to get back from the server. Obviously,\
    \ the text is protocol-specific and won't work with anything other than HTTP or\
    \ HTTPS services, although these might have been specified as arguments to a generic\
    \ service definition, doing so would mean that every service you checked with\
    \ the generic definition would need to specify and expect options. The moral is,\
    \ when you really must do protocol-specific, it's often cleaner to do so with\
    \ a new command definition.\n\nAn interesting side effect of doing protocol-specific\
    \ queries is as this is that warnings can creep back in. For example, if the service\
    \ was available, but replied with HTTP/1.0 302 (an HTTP redirect), then check_tcp\
    \ considers this “unexpected output” and generates a warning. Listing 6.7 is a\
    \ service definition to give with the shiny check_http command.\n\n# 6.7 Shiny\
    \ new check_http service definition.\n\n```\ndefine service{\n  host_name    \
    \        webServer\n  service_description check_http\n  check_command       check_http\n\
    \  notification_options c,W,R\n  use                 chapter6template\n}\n```"
  merge: -1
  pgno: 113
- img_proc: true
  md: "Although the new check_http has more functionality, the service definition\
    \ in Listing 6.7 is even simpler than in Listing 6.5. The second methodology is\
    \ preferred when you find a specific check_command with a simple service definition,\
    \ it scales better than the other way. It's also easier to get exactly what you\
    \ want this way. Reusing definitions tempts you to compromise functionality that\
    \ you consider nifty, but that is extraous. This is because services have a tendency\
    \ to fail in ways you don't expect.\n\nAn HTTP 404 or 500 error would have been\
    \ overlooked by the Listings 6.4 and 6.5, but not by the more specific command\
    \ in 6.6. Usually, when unexpected failures happen, they are subtler, but they\
    \ are accounted for more often if you make a habit of writing a specific command\
    \ definition instead of reusing an existing generic one.\n\n# Querying Multiple\
    \ Ports\n\nAs was implied in Listing 6.6, check_tcp has a lot of functionality,\
    \ but one thing that it cannot scan ports. Many applications listen on more than\
    \ one port, and having a single service to query all is a common requirement.\
    \ Whenever I run into a limitation in a plugin, the first question I ask myself\
    \ is whether a wrapper might help.\n\nWriting wrappers around Nagios plugins is\
    \ a long and honored tradition. The wrapper, in this context, refers to a program\
    \ that calls another program or collection of programs to accomplish its intended\
    \ purpose. Since there have been Nagios plugins, administrators have been extending\
    \ their functionality with shell wrappers. For more information about how plugins\
    \ work and a walkthrough of the process of creating wrappers, see the “Plugins”\
    \ section in Chapter 2. Listing 6.8 is a shell wrapper around check_tcp and check_udp\
    \ allows you to query the availability of multiple ports in a single command definition.\n\
    \n# Listing 6.8 A check_tcp wrapper.\n\n```\n#!/bin/bash\n#call check_tcp once\
    \ for each port; aggregate the result\n\nHOME=/usr/local/nagios/libexec #path\
    \ to the plugins\nPROTO=Nullz0r #default protocol to use\n\n# a function for printing\
    \ the help info\nprintusage {\necho \"this plugin calls check_tcp once for each\
    \ port\"\necho \"usage:\"\necho \"check_multi tcp -H -u|t -p \\port [port] ...\\\
    \\\\\"\\\"\"\necho \"-h : print this message\"\necho \"-H hostname: The hostname\
    \ of the box you want to query\n  (default localhost)\"\n}\n```"
  merge: -1
  pgno: 114
- img_proc: true
  md: "# Local Queries\n\n# Listing 6.8 check-tcp wrapper. (Continued)\n\n```\necho\
    \ \"-p port number: A space separated list of port numbers\"\necho \"-t wrap around\
    \ check_tcp\"\necho \"-u wrap around check_udp\"\nexit ${EXITPROB}\n```\n\n```\n\
    #parse the arguments :hH:p: opt\nwhile getopts $opt; do\n  case $opt in\n    h)\
