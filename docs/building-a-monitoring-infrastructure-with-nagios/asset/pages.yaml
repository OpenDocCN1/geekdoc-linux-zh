    # check_procs


    Syntax


    ```

    check_procs -w <range> -c <range> [-m metric] [-s state] [-p ppid] [-u user] [-r
    rss] [-z vsz] [-P %cpu] [-a argument-array] [-C command] [-t timeout] [-v]

    ```


    # Discussion


    Check_procs generates WARNING or CRITICAL states if the specified metric is outside
    the required threshold ranges. Many metrics are supported, including


    +   - PROCS—Number of processes (default)

    - VSZ—Virtual memory size

    - RSS—Resident set memory size

    - CPU—Percentage CPU

    - ELAPSED—Time elapsed in seconds


    Additionally, filters may be applied to the process list to narrow the search
    results. The filters and metrics combine to enable complex process query functionality.
    Thresholds are specified as min:max ranges. Only one half of the range is required.


    # Table C.7 Check_procs Options


    | Option | Description |

    | --- | --- |

    | -h | Display help text. |

    | -w | Generate warning state if metric is outside this range. |

    | -c | Generate critical state if metric is outside this range. |

    | -m | Specifies the metric, one of: PROCS—Number of processes (default), VSZ—Virtual
    memory size, RSS—Resident set memory size, CPU—Percentage cpu |'
