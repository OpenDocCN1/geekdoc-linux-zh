  md: "# Data Collection and Polling\n\ninstall. There are two configuration files,\
    \ one that sets up NG's defaults and one that maps the text parsed from Nagios\
    \ via regular expressions into RRD variables. Simply copy the configuration files\
    \ and insert.pl script to locations that make sense for you. Then edit insert\
    \ pl to point to the configuration files and change the configurations according\
    \ to your tastes. Most people should only change the rrddir, which is the directory\
