  md: '# Chapter 7 Visualization


    ![](img/7c754ef117b945190cb5d61f0388dd22_192_0.png)


    **Figure 7.19** GraphViz diagram of open ports from NMap.


    GraphViz makes up for many of the shortcomings of the Nagios statusmap.cgi, but
    it is also good at modeling data from log files and RRDs to spot strange behavior,
    or cliques. For example, plotting a GraphViz diagram of hosts with CPU, Network,
    and Memory utilization statistics causes the boxes that use CPU than memory to
    cluster together in a group.


    In practice, most people don''t actually use the dot files required to create
    an image. Most people use dot file creation utilities and GraphViz wrappers to
    do the dot file and image creation. The previous graph was actually created from
    a Perl script I wrote using the GraphViz Perl module.


    If writing engines is not your bag, I point to the excellent shell-based GraphViz
    wrapper, Afterglow, which was written by Raffaael Marty. Afterglow can be used
    from the command line and lets you easily define colorization mappings and filters.
    For example, it''s possible to tell Afterglow to draw only hosts that have three
    or more outbound connections. Afterglow''s syntax allows you to quickly draw and
    redraw graphs by simply altering arguments on the command line; even if you do
    write code, it''s worth checking out. Figure 7.20 is a GraphViz diagram created
    with Afterglow.'
