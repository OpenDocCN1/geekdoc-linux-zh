  md: '# Lisiting 4.17 Servic example.


    ```

    define serviccedependency{

    host_name NAS1

    service_description PING

    dependent_host_name myServer

    dependent_service_description check_httpd

    execution_failure_criteria W,u,c

    notification_failure_criteria w,u,c

    }

    ```


    Dependencies exist to capture services and hosts that rely on each other. If,
    for example, you may have some Web servers using a NAS network-attached shared
    storage-back, you can make the Web services depend on the NAS server''s ping.
    If the NAS becomes unavailable, Nagios handles the notifications accordingly and
    reports the outage in the context of the Web servers. Whereas host and service
    dependencies may be defined, it is almost always preferable to use parent/child
    relationships to capture interdependencies between hosts. Only host definitions
    may contain parent directives, so defining interdependencies requires a service
    dependency object.


    Host dependencies require only host_name, which specifies the host that is depended
    upon, and dependent_host_name, which is self-explanatory. Service dependencies
    obviously specify the hosts and services in question. The services are specified
    by way service_name and dependent_service_name directives.


    Before Nagios checks the state of a service, it first checks the state of all
    the services that the service depends upon (its parents). If all of those services
    are okay, Nagios proceeds to check the child service. If any of the parents are
    down, Nagios assumes the child service is as well and stops checks. It is possible
    to modify this behavior by way of the execution_failure_criteria and notification_failure_criteria
    directives. These directives can be confusing because they specify something should
    not happen.


    The execution_failure_criteria directive specifies the situations in which the
    child service should not checked. For example, specifying a w for warning means
    Nagios should not schedule checks of the child service when the parent is in a
    warning state, which is probably what you want. Setting this to n for none would
    mean that active checks always take place, no matter the state of the parent service.
    Setting an o for okay here would mean that active checks would not take place,
    even if the parent is in an okay state.


    Similarly, the execution_failure_criteria directive specifies the situations for
    which notifications should not be sent out for the child service. Like execution_failure_criteria,
    the options specify state of the parent. Setting c, for example, means that for
    the child should not be sent if the parent is in a critical state. The same options
    are available to both directives: okay, waking, critical, unknown, pending, and
    none, for services; okay, down, unreachable, pending, and none, for hosts.'
