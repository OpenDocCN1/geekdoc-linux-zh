    # Management Interfaces


    In systems monitoring circles, terms such as Dashboard and Management Interface
    are thrown around quite a bit, and mean vastly different things to different people.
    This section is not here to strictly define what a management interface is or
    to teach you how to build one, but it would help you understand what you need,
    using some interesting tools.


    Time-series graphs and the Nagios Web interface are sufficient to provide systems
    administrators the visibility they need, in my experience, but the needs of the
    organization do not necessarily end with those of sysadmin. For this reason, the
    data consumer should'
  merge: -1
