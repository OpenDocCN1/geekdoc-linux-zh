  md: 'Because hosts and services are the central objects in Nagios, their definitions
    are more involved than most. You may specify 28 different directives within a
    host definition, but only nine of them are mandatory. (All of the directives in
    Listing 4.10 are mandatory, except for event_handler and parents.) See the Nagios
    documentation at http://nagios.sourceforge.net/docs/2_0/xodtemplate.html#host
    for a complete list of available directives. The directives in Listing 4.9 are
    probably all you''ll need.


    The address directive tells Nagios how to find the host. You may specify an IP
    address or a hostname for the address directive, and this is an important decision.
    If you specify hostnames, DNS problems will cause failures, because Nagios cannot
    resolve the hostname. On the other hand, if you specify an IP address, you have
    to remember to change the definition if the IP of the host changes. In large environments,
    this may happen often and without your knowledge. I prefer to specify hostnames
    and to run a local DNS name server service, such as tinydns (www.tiny.org for
    more information), locally on the Nagios box. Using a local cache solves DNS-related
    issues because Nagios uses itself as a nameserver, but it also necessitates some
    type of replication with the real nameser.


    The parents directive tells Nagios where in the network topology the host resides.
    Parents are defined from the perspective of the Nagios server. If the Nagios server
    is connected to a router, which also connects to a separate subnet containing
    hosts, each of those hosts should be defined with a parents directive listing
    the router. The router does not need a parents directive, because it is on the
    same subnet as the Nagios server. Each host list may contain one or more parents.
    As described in Chapter 2, Nagios uses parent/child relationships to treat outages
    on remote subnets differently than those on local subnets. If a host with children,
    such as a router or switch, Nagios considers the router and its children unavailable.
    This is an important distinction for reporting and notifications. As shown in
    the section,"Contacts," the contact may filter out the unavailable notifications
    via notification options.


    The event_handler and check_command directives both specify command objects. Events,
    described in Chapter 2, are usually commands that launch scripts in an attempt
    to rectify simple problems automatically. When a host changes, Nagios executes
    the host''s event_handler before sending notifications. The check_command is the
    command Nagios uses to check that the host is available. Nagios does not wait
    for the event handler to return before it sends notifications, because event handlers
    are executed at soft state changes, they usually have a window of time to do their
    work before notifications are sent, while Nagios retrieves the checks. As described
    in Chapter 2 for a discussion of hard soft state changes. The command definition
    usually points to the check_ping plugin. As described in Chapter 2, Nagios runs
    only the check_command if a service fails on the host, so while directives exist
    to enable regularly scheduled checks of the host, these are discarded. By design,
    Nagios runs check_command automatically as needed. Check Appendix C,"Command-Line
    Options," for a complete list of command-line switches available to the Nagios
    binary.'
