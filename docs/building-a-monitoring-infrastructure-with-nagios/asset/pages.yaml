  md: "# 62 Chapter 4 Configuring Nagios\n\nyou should be aware of them so that you\
    \ avoid using them in your definitions. As of the time\nof writing this, the illegal\
    \ macro names are\n\n' ~ ! $ % & * | ' \" <> ? , ( ) =\n\n...and the illegal macro\
    \ output commands are\n\n~ $ % & | ' \" <>\n\nDifferent macros are available in\
    \ different contexts, so it can be hard to know what\nmacros you can use in every\
    \ situation. For example, email-related macros, such as CON-\nTACTNAME, are available\
    \ to commands being run for notifications but not commands\nrunning for service\
    \ checks. Check the online documentation at http://nagios.sourceforge.net/docs/2_0/macros.html\
    \ for a complex matrix of available macros and the contexts they\nare available\
    \ in.\n\nIn the nagios.cfg file, there is a directive resource_file, which allows\
    \ you to specify\na file to create your own macros. This is usually called resource.cfg\
    \ or resource.cfg,\nand within it, you may define up to 32 macros. The resources.cfg\
    \ usually contains at\nleast one macro, USER1, which is world-readable to the\
    \ location of the installed plugins. Because\nresources.cfg is owned by root and\
    \ read-only, it' a better place to define any usernames\nor passwords through\
    \ the checkcommands.cfg, which is world-readable. When set up in\nresources.cfg,\
    \ your command object can refer to the passwords by macro, thereby keeping\nthem\
    \ safe from prying eyes.\n\nIn Nagios 2.0, Macros are exported as environment\
    \ variables, so any macro available to\na command definition is also available\
    \ to the program called by that definition.\n\n# Contacts\n\nRequired for daemon\
    \ start\nRefers to: command, timeperiod, contactgroup\nReferred to by: contactgroup\n\
    \n# Listing 4.7 Contact example.\n\n```\ndefine contact{\n    contact_name   \
    \       dave\n    alias               dave josephsen\n    host_notification_period\
    \  24x7  (continues)\n```"
