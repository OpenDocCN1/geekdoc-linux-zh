  md: '# The External Command File


    The fact that the Web CGIs are able to do things, such as schedule downtime for
    hosts and turn off notifications, implies that there is more to the Web interface
    than a simple CGI wrapper to the log and store files. In fact, the CGIs accomplish
    command execution by way of the external command file. The command file is a FIFO
    (or named pipe), which Nagios periodically checks for commands. The command file
    can be thought of as a file system entry point to the event queue; it is just
    for the Web interface; it can be used by any process with the permissions to do
    so.


    The format for commands is


    ```

    `[time] command_id;command_arguments`

    ```


    The Time is a timestamp in UNIX seconds since epoch format. To get the current
    time in seconds on a Unix box, do


    ```

    `date ''+%s''

    ```


    The command ID is the name of the command you want to execute and each one takes
    different arguments. As of this writing, there are 131 different commands you
    can send to the Nagios daemon, by way of the command file, to do things such as
    on and off notifications, acknowledge problems, and provide commands. A listing
    of these commands, along with their options and sample shell scripts for each
    one, is available from www.nagios.org/developerinfo/externalcommands/


    # Performance Data


    Earlier, a plugin was defined as a little program that provides an exit code and
    optionally some text on stdout. If the optional text contains a pipe character
    (\l), Nagios will treat anything before the pipe as normal summary text and everything
    after the pipe as performance data. Nagios has specific definitions around what
    to do with performance data if it exists. Performance data was originally meant
    to track the performance of the plugin itself. For example, if you wanted to know
    how long a plugin took to do its job, the plugin could itself itself and provide
    that data back, embedded in the summary text. You could configure Nagios to do
    whatever you want with the performance data separately, as to log it to a file
    or database.


    In practice, performance data has become the facto means to export data from Nagios
    into graphing programs, by RDDTool. Most plugins, however, do not support performance
    data; that is, they have no pipe character in their summary text. This is easy
    enough to rectify, however, with the check_wrapper_generic in Listing 2.6.'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# Listing 2.6 A performance data wrapper for all plugins.


    ```

    #!/bin/sh

    #a wrapper which adds perfdata functionality to any nagios plugin

    #link pluginName_wrapper to this script for it to work

    #for example, if you want to enable perfdata for check_mem

    #you would ''in -s check_wrapper_generic check_mem_wrapper''


    #get rid of the ''wrapper'' on the end of the name

    NAME=$(echo $0 | sed -e '' /wrapper//'')


    #call the plugin and capture it''s output

    OUTPUT=''${NAME}'' $\$

    #capture it''s return code too

    CODE=$?


    #parrot the plugin''s output back to stdout twice, seperated with a

    pipe

    echo "${OUTPUT}|${OUTPUT}"


    #exit with the same code that plugin would have exited with

    exit ($CODE)

    ```


    This script is similar to the SSH remote execution plugin in Listing 2.5. It calls
    another plugin by proxy and parrots the other plugin''s output, adding a pipe
    in the output, adding support for performance data. Chapter 7 discusses performance
    data and how it can be used to feed visualization programs.


    # The Event Broker


    New to Nagios 2.0 is the Event Broker. The Event Broker is a process that watches
    the event queue for certain types of events to occur and then notifies one or
    more Event Broker modules, passing relevant details about the event to the module.


    The NEB modules are written in C and linked to the Nagios core process at runtime,
    which point they ask the event broker to send them the events they are interested
    in. These events can be any type that Nagios deals with the event queue. After
    an interesting event occurs and the module has the relevant details, it may do
    anything it wants, including modifying events in the queue, passing information
    to other programs, and generally changing the way Nagios operates.


    The Event Broker interface is absolutely the most powerful interface to Nagios,
    for those with some C skills and the inclination to get their hands dirty. In
    Chapter 8, “Nagios Event Broker Interface,” event broker is used to add a file
    system status interface to Nagios.'
