  md: '# Appendix C


    # check_http


    Syntax


    ```

    check_http -H <vhost> | -I <IP-address> [-u <uri>] [-p <port>]

    [-w warn time> | -c <critical time> [-t <timeout>] [-L]

    [-a auth] [-f ok | warn critcal| follow>] [-e expect]

    [-s string] [-l] [-r <regex> | -R case-insensitive regex]

    [-P string] [-m <min_pg_size>[-max max_pg_size>] [-4|-6] [-N]

    [-M <age>] [-A string] [-k string

    ```


    # Discussion


    Check_http attempts to open an HTTP connection with the host. Successful connections
    return okay, refusals and timeouts return critical, and other errors return unknown.
    Successful connections return unexpected messages or text result in. If you are
    checking virtual servers that use host headers, you must specify the fully qualified
    domain name of the target host.


    # Table C.4 Check_http Options


    | Option | Description |

    | - | - |

    | -h | Prints detailed help screen. |

    | -V | Prints version information. |

    | -H | Hostname argument for servers using host headers (virtual host). Appends
    a port to include it in the header (such as example.com:5000). |

    | -I | IP address or name (using numeric address, possible, to bypass DNS lookup).
    |

    | -p | Port number (default: 80). |

    | -4 | Uses IPv4 connection. |

    | -6 | Uses IPv6 connection. |

    | -S | Connects via SSL. |

    | -C | Minimum number of days a certificate has to be valid. (When this option
    is used, the URL is not checked.) |

    | -e | String to expect in first (status) line of server response (default: HTTP/1.)
    If specified, skips all other status line logic (ex: 3xx, 4xx, 5xx processing).
    |

    | -s | String to expect in the content. |

    | -u | URL to GET or POST (default: /. |

    | -P | URL encoded HTTP POST data. |'
