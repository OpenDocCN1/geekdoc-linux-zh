  md: '# GUI Configuration Tools


    Figure 5.1 is a screenshot of the Fruity interface. Fruity is a pretty straightforward
    GUI; the interface design, hides some powerful functionality, as the ability to
    set templates that inherit other objects. Fruity is a good tool for bringing junior
    admins up to speed and distributing the configuration amongst people who are otherwise
    textile challenged. Fruity can import existing configs and doesn''t write the
    changes to the configs until you tell it to. When it writes files, it backs up
    the existing configuration first.


    ![](img/7c754ef117b945190cb5d61f0388dd22_107_0.png)


    **Figure 5.1** More on SNMP in Chapter 6, "Watching," A host definition in the
    Fruity GUI.


    # Monarch


    Monarch, short for “Groundwork Monitor Architect,” is a Perl/CGI/AJAX Application.
    It is the same configuration engine used by the commercial Groundwork Foundation
    program. Monarch runs from a web browser and supports Nagios 2.x and 1.x. Monarch
    also stores Nagios configs in a MySQL database and includes an installer script
    that configures the database and puts everything where it needs to. Monarch is
    a bit of a handful than Fruity in the installation department. There are some
    prerequisites that must be installed before the setup script can run, including
    11 Per modules.


    Figure 5.2 is a screenshot of the same host in Monarch. Note the Profile tab.
    Monarch adds the concept of profiles to Nagios configuration, and this is a welcome
    addition in my opinion. Monarch profiles are like super templates; they capture
    hosts in terms of a role. By way of an example, a Web server can be thought of
    as a collection of services, hostgroup memberships, contacts, and escalations.
    A Monarch profile gives a name to a particular'
