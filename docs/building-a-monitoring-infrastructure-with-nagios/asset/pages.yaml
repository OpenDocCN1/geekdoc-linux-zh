    object of type csvobject (or something similar). This object is passed to the
    Where-Object cmdlet, which uses the department property of the object to extract
    the records matching. By the pipeline ends here, the Where-Object cmdlet dumps
    its findings in plain text to the shell. If the pipeline had continued, the Where-Object
    cmdlet would have provided the modified csvobject to the next cmdlet. The Perl-like
    $_ object (which represents the current iterator), braces, and pipes to give the
