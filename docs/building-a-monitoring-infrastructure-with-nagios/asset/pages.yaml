    least to narrow the available options with filters. If the front-end saves its
    in text files, all the better; this implies that you can back-end the creation
    of some objects, bypassing the user interface altogether. Solutions that do this
    tend to be written in straight CGI of Web application languages, such as PHP,
    which brings me to my next....


    Look for tools that use CGI over tools written in Web application languages, such
    as PHP. The PHP applications usually have a more polished look, but the CGI applications
    tend to be more flexible. Linking is critical; you want to link directly to specific
    graphs or use wget or curl for email reports and custom dashboards. If you choose
    a PHP application, be sure it can generate reusable links to specific graphs.
    Tools that generate static graphs so often with random, unique names should be
    avoided. Additionally, CGI applications are usually easier to install.


    Look for tools that tell how you created the graph. RRDTools graph mode is tough
    on administrators who need to do manual graph creation and processing. But many
    frontends give you the literal syntax they used to create any graph. This can
    save you a lot of time.


    Beware of graphics tools that do their own polling because they tend to be inflexible.
    Some that you are using their polling engine and, therefore, that the data was
    stored in a certain way. Many cannot graph metrics aren''t configured for polling,
    well. Most of them pay too much attention to either polling or graphing and suffer
    needless hindrances as a result.


    By far the most popular tool in this genre is Cacti (www.cacti.net), so I would
