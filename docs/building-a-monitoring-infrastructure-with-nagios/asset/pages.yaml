  md: '# APPENDIX C


    # Command-Line Options


    This appendix contains command-line options for the Nagios binary and as several
    frequently used plugins in the plugins tarball.


    # Nagios


    # Nagios Binary


    Syntax


    /path/to/nagios [option] <main_config_file>


    Discussion


    The Nagios binary normally starts by way of an init script; however, it can be
    called from the command line and provides two interesting and useful modes when
    accessed in this manner.


    Table C.1 Nagios Command-Line Options


    | Option | Description |

    | -h | Display help text. |

    | -d | Daemon mode. Launch Nagios in the background as a daemon. |'
  merge: -1
  pgno: 231
- img_proc: true
  md: '# Table C.1 Nagios Command-Line Options (continued)


    | Option | Description |

    | - | - |

    | -s | Scheduling information mode. Displays projected or recommended scheduling
    information, based on the current data in the configuration file. |

    | -v | Verification mode. Reads all data in the configuration files and performs
    a sanity check. (Handy for verifying your configuration data after you make a
    change and before you start Nagios.) |


    # Plugins


    By nature, all plugins may be executed directly from the command line. The first
    law of plugins is that they share an -h switch. The -h switch displays information
    about the plugin and how it works. All plugins are self-documenting, in this respect.

    Most plugins support warning and critical thresholds; these are nearly always
    specified by way of -w and -c, respectively. Some thresholds may be specified
    as range of numbers. Where this is true, the range is represented as a pair of
    colon-separated numbers with the minimum value on the left and the maximum value
    on the right (min:max). Some plugins require both numbers in the range to be specified,
    whereas others allow you to specify half of the pair; for example “4:” to mean
    “at least 4.”


    # check_ping


    Syntax


    ```

    Check_ping -H <host_address> -w <wrta>,<wpl%> -c <crta>,<cpl%> [-p packets] [-t
    timeout] [-L] [-4|-6]

    ```


    # Discussion


    Use the ping command to check connection stats for a remote host. Warning and
    critical thresholds are given as a combination of roundtrip time (in milliseconds)
    and packet loss (as a percentage).


    # Table C.2 Check_ping Options


    | Option | Description |

    | -h | Displays help text. |

    | -V | Displays version information. |'
  merge: -1
  pgno: 232
- img_proc: true
  md: '# Appendix C


    # Table C.2 Check_ping Options (continued)


    | Option | Description |

    | -4 | Uses Ipv4 pings. |

    | -6 | Uses Ipv6 pings. |

    | -H | Specifies the target hostname. |

    | -w | Specifies the warning threshold. |

    | -c | Specifies the critical threshold. |

    | -p | Specifies number of packets to send (default: 5). |

    | -L | Generates HTML output 1.30. Copyright (c) 1. |

    | -t | Specifies the timeout limit (in seconds). |


    Example


    check_ping -H bart -w 700,20% -c 1200,50%


    # check_tcp


    # Syntax


    # Discussion


    The check_tcp plugin opens a TCP connection to the specified port on the specified
    host. It is capable of interacting with text-based protocols and supports SSL.
    Check_tcp provides performance data back to the Nagios daemon.


    # Table C.3 Check_tcp Options


    | Option | Description |

    | -h | Displays help text. |

    | -V | Displays version information. |

    | -H | Targets hostname or IP address. |

    | -p | Targets port number (the default is none). |

    | -4 | Uses IPv4. |


    (continues)'
