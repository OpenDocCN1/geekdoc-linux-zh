  md: '# Front-Ends and Dashboards 149


    file configuration whatsoever. If you have trouble, check out the debugging options
    in the configuration file.


    Nagios Graph is the solution I prefer at the moment, but it may not be your cup
    of tea (if you do like it, you can get it from http://nagiosgraph.sourceforge.net/),
    so be sure to check out Nagios Exchange for something that might suit your environment
    better. I hope the tips I''ve provided help you narrow the field.


    # Front-Ends and Dashboards


    Now that you have your data collection and storage squared away, you can busy
    yourself with graphing it. Like polling and storage engines, the want to optimize
    your front-end for flexibility. In RRD you don''t want to lose any of RRDTools
    functionality along the way. It would also be nice if you didn''t have to do a
    large amount of clicking through Web interfaces to configure things. Looking around
    front-end tools (check out www.rrworld.com), you will find many of the same problems
    you had with data collection and polling engines. Most of the graph-ends try to
    do too much or are overly complex, both of which breed inflexibility.


    # RRDTool Graph Mode


    Before you get into what to look for in a graphing front-end, you need to understand
    a bit about RRDTools graphing mode. Like create and update, RRDTool has a special
    mode for drawing graphs from the data stored in an RRD. I''ve sometimes quipped
    that RRDTool graph is existence proof of the old adage, “A picture is worth a
    thousand words,” because RRDTools graph mode is, by far, the most complex and
    confusing aspect of the toolset, possessing a dizzying array of options to specify
    everything from the height and width of a graph to its background and foreground
    colors.


    Though graph commands are technically one-liners, it''s not uncommon for them
    to span 15 to 20 lines. A good front-end makes the complicated syntax much, but
    to get everything out of your FE, you need to quickly review a few important concepts,
    including DEFs and CDEFs, and brush up on your reverse polish


    DEFs are the definitions in graph mode; they tell RRDTool what to graph. A DEF
    is made up of the filename of the RRD, a DS within that RRD, and a consolidation
    function for the DS. A DEF refers to, and only one, Data Source. You may specify
    any number of DEFs in a graph command. For example


    ```

    DEF:foo=/usr/nagios/rrd/umbra_load:5min:AVERAGE

    ```'
