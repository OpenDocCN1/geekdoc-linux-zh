    |

    | hostescalation | Escalations provide Nagios the capability to notify additional
    contacts, such as managers, if a problem persists without being acknowledged a
    given notifications. | escalation.cfg |

    | serviceescalation | These work the same as hostescalations. | escalation.cfg
    |

    | hostextendedinfo | Extendedinfo objects map titles and graphics to host and
    service objects for the Web interface. These definitions are entirely optional
    and cosmetic in nature. | hostextinfo.cfg |

    | serviceextendedinfo | This works the same as the hostextendedinfo does. | serviceextinfo.cfg
    |


    The nagios.cfg file is required. If you use the Web interface, another configuration
    file, cgi.cfg, is also required. The cgi.cfg file contains configuration directives
    for the CGLs and where most of the UI security is configured. The cgi.cfg and
    nagios.cfg files contain configuration directives rather than object definitions.
    The directive syntax should be'
