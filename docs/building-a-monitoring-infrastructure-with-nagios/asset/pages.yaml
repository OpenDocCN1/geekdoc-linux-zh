  md: '# Table 4.4 Security-Related cgi.cfg Directives


    | Object Name | Description |

    |---|---|

    | use_authentication | This directive, set to 1 (on) by default, tells the CGIs
    to use authentication information from the Web server. Because the Web interface
    can control how Nagios operates, turning authentication off is a bad idea. If
    you want to see everything, use default_user_name | Usually set to guest, the
    default user_name can be granted permissions that will be inherited by other users.
    For example, if jdoe doesn''t explicitly have access to see information on a service,
    but the default user does, jdoe can see the service because all users can see
    what the default user can. If you want to see all hosts, uncomment this directive
    and the list user in authorized_for_all_hosts |

    | authorized_for_system_information | A comma-separated list of users who are
    allowed to see information related to the Nagios daemon. |

    | authorized_for_configuration_information | A comma-separated list of users who
    are allowed to see the contents of the configuration files via the Web interface.
    |

    | authorized_for_system_commands | A comma-separated list of users who are allowed
    to execute commands relating to the Nagios daemon, as shutdown and restart. |

    | authorized_for_all_services | A comma-separated list of users who are allowed
    to see information related to any service that Nagios monitoring. |

    | authorized_for_all_hosts | Like the preceding definition, except for hosts.
    |

    | authorized_for_all_service_commands | A comma-separated list of users who are
    allowed to execute commands related to services, such as rescheduling checks and
    disabling notifications. |

    | authorized_for_all_host_commands | Like the preceding definition, except for
    hosts. |


    # Templates


    The brunt of Nagios configuration consists of object definitions as described
    in the "Objects and Definitions" section. Object definitions can come in varying
    degrees of complexity. Command definitions, for example, are normally composed
    of no more than two or three lines of text. Service definitions, on the other
    hand, may contain 31 directives, 11 of which are mandatory. For 100 hosts with
    1 service each, that''s 1,100 lines of configuration just for service definitions,
    most of which are redundant. Frankly, Nagios has a few built-in features'
