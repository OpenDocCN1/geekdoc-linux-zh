    # IPMI


    Intelligent Platform Management Interface (IPMI) is an Intel specification for
    a hardware-based, out-of-band monitoring and management solution for Intel-based
    server hardware. Enterprise class servers from the big name vendors with integrated
    IPMI hardware and proprietary client software. IPMI is sometimes offered an add-on
    for commodity server hardware. The Dell OpenManage utility, for example, is a
    proprietary IPMI client.


    IPMI operates independently of the operating system software on the system, which
    means that IPMI will remain available in the event of a catastrophic system failure
    or even the system is powered off. If power is available to the system, IPMI can
    perform tasks, such as providing system and status information to administrators,
    rebooting the server, and even blinking LEDs, so that remote-hands personnel can
    easily find the troubled system in high-density racks. IPMI implementations maintain
    a rank-buffer, which can provide detailed information about interesting hardware
    events, such as RAID-card and memory failures. IPMI implementations can even send
    alerts about problems to SNMP managers using SNMP traps.'
