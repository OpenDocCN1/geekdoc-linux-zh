    # NRPE


    NRPE, as described in Chapter 2 and Chapter 3, “Installing Nagios,” is a lightweight
    client and server that enables the Nagios server to remotely execute plugins on
    the monitored hosts. NRPE is great when you have existing monitoring scripts that
    you want to use with Nagios or when you have a need for custom monitoring logic.
    Any scripts you write (or downloaded) to monitor your Windows boxes can be defined
    as a service in Nagios and called via NRPE_NT, the Windows port of NRPE.


    For example, to run the check_dllhost from Listing 6.16 with NRPE-NT, first obtain
    and install NRPE-NT, as described in Chapter 3. After the NRPE service is installed
    on the Windows host, add the following line to the bottom of the nrpe.cfg file.


    ```

