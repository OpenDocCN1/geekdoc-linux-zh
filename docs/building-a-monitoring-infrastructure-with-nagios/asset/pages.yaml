  md: '# 46


    # Chapter 3 Installing Nagios


    to user-created add-ons and scripts: www.nagiosxexchange.org. Specifically, the
    patches are in the patches section of the Nagios Exchange, under development.


    # Secondary IP Patch


    The first patch, usually referred as the secondary IP patch, adds a secondary
    attribute to the definition, for host objects. The secondary address is intended
    to provide for hosts with two IP addresses. The specific syntax for object definitions
    is covered in the next chapter, but I want to mention here that it is not necessary
    to use this patch to get multiple IP support. I may simply provide a space-separated
    list of addresses to the built-in attribute in the host definition, and the check-plugin
    will check each address listed. It is a common misconception that the secondary
    IP patch is required for multiple IP support. The only real reason to use the
    second IP is when you want to refer to the second IP specifically by a macro.
    Macros are discussed more in Chapter 4, “Configuring Nagios." They can be thought
    of as variables that are internal to Nagios and used by object definitions. For
    example, the host definitions-in address attribute may be referenced by way of
    the $HOSTADDRESS$ When checks are defined, they point to $HOSTADDRESS rather than
    the hard-coded address of the host. By this way, one definition may be used for
    any host. If more than one address is defined, then $HOSTADDRESS will resolve
    to more than one IP. The secondary address patch is only required if you want
    to specifically refer to the two addresses individually, by separate macros. This
    is not a common requirement.


    # SNMP Community String Patch


    The SNMP community string patch is similar to the secondary IP patch, in that
    it adds an attribute and macro to the host definition. The attribute—which you
    might guess, the SNMP community string for the host in question—is useful in cases
    where you have many different hosts in different SNMP communities. Again, it is
    possible to support hosts in different SNMP communities without patching Nagios
    by defining separates for each community. The patch makes it possible to use a
    single check for any host by adding the capability to query each host''s SNMP
    community, via a macro. If you use multiple SNMP community strings, I recommend
    applying this patch.


    # Colored Statuspatch


    Finally, the colored status patch adds colors to the status map cgi (the graphical
    drawn by the Web front-end), which correspond to the status of hosts. Hosts in
    healthy states show up in green, whereas hosts in degraded or down states show
    yellow or red, respectively.


    All three patches may be applied from the source directory with the -p1 switch
    to patch a complete Nagios install, including the application of the patches listed
    previously.'
