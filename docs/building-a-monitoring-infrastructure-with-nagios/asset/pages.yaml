  md: "# Commands\n\n# Commands\n\nRequired for daemon start\nRefers to: none\nReferred\
    \ to by: host, service, contact\n\n# Listing 4.6 Command example.\n\n```\ndefine\
    \ command{\n  command_name check_ping\n  command_line $USER$//check_ping -H $HOSTADDRESS$\
    \ -w $ARG1 -c $ARG2 -p 5\n}\n```\n\nThough composed of only two directives, command\
    \ definitions are central to the functionality of Nagios. Commands are the solitary\
    \ means by which Nagios may call external programs, and as we will see in other\
    \ definitions throughout the chapter, Nagios calls external programs.\n\nThe most\
    \ common use of the command object is for calling plugins. As previously mentioned,\
    \ there are only two directives: command_name, which gives the object name that\
    \ other objects can reference, and command_line, which defines the shell syntax\
    \ of the command.\n\nCommand objects don’t just refer to external programs; they\
    \ capture the command syntax of. The uppercase words surrounded by dollar signs\
    \ are called macros. Macros are context-specific internal variables that Nagios\
    \ replaces at runtime. The HOSTADDRESS macro, for example, refers to the host\
    \ address of whatever host Nagios happens to be running this plugin on. See the\
    \ “Services” section for a description of the ARG macros. This makes it possible\
    \ to use one definition for any host. Nagios forks an exec of command_line exactly\
    \ as it is written in the definition; but just before executing, Nagios replaces\
    \ all of the macros with their actual values.\n\nTo avoid unintended shell interpretation\
    \ and injection attacks, Nagios strips certain characters out of the actual values\
    \ before it replaces the macro keywords in the commands in some contexts (host\
    \ and service notifications and escalations, but not host and service checks).\
    \ For the same reasons, Nagios also prevents you from using special characters\
    \ in host and service names. These characters are user-definable via directives\
    \ the nagios.cfg, and"
