    combination of services, group memberships, contacts, and pretty anything else.
    The profile is then assigned to one or more hosts. This role-based approach to
    Nagios configuration is very cool and can save a lot of time for those with large
    environments. Configuring a new host becomes as simple as Monarch its name, alias,
