  md: '# Data Collection and Polling


    In the early paragraphs of section, "Foundations: MRTG, RRDTool," I said that
    there were three pieces to the visualization puzzle: polling engines, data storage
    back-ends, and graphing user interfaces. To get the most out of the monitoring
    system, you want to optimize each of these pieces for flexibility, so you can
    use any piece of data you may have however you want. Because you don''t know upfront
    you may want to visualize the data, keeping things flexible means that every metric
    from every server can be available to any program that might want to consume it.


    You have chosen Nagios for your polling engine and RRDTool for your storage engine.
    Now that you have a handle on how RRDTool works, you can talk about the middle
    ground between your data and storing it. There are quite a few glue layers to
    tie RRD-Tool to Nagios, and all of them automatically create the RRDs for you,
    in practice, administrators never need to deal with manual RRD creation.


    If nothing else, I hope the section impressed you upon the critical importance
    of RRAs for your data visualization undertaking. Simply put, if your glue layer
    doesn''t define the Round Robin Archives, you cannot control how much data you
    keep, or for how long. I make this point because I''m not aware of a Nagios-RRDTool
    glue layer that allows you to specify custom RRAs in a configuration file. This
    is a big problem. You have a super-flexible polling engine and a perfect data
    storage back-end for your tool, the flexibility of both of them could be severely
    limited by the capabilities of the glue layer you put between them.


    # Shopping for Glue


    I''m not sure why this RRA problem exists. Either end-user definable RRAs are
    a difficult to pull off (I haven''t tried, but it doesn''t seem like they would
    be difficult) or the people coding your various glue libraries think it''s more
    important to insulate you from the inner workings of RRDTool to provide you the
    flexibility to define your RRAs.


    The authors are in the business of insulating you from the inner workings of RRDTool,
    so this is an understandable oversight, one that makes your task more difficult.
    You need to choose a glue layer that meets your needs and won''t become a liability
    later. Pick one written in a language you understand so that you can change things,
    such as the RRAs, in code if you need to or at a minimum, be sure you can, at
    least, figure out what the RRAs are, so you can plan accordingly.'
  merge: -1
  pgno: 169
- img_proc: true
  md: 'Another bad habit of the polling and collection scripts is doing too much.
    Most of the scripts out there collect data from Nagios and store it in RRDs also
    contain Web interfaces that actually draw graphs from the data, as well. In concept,
    it seems like a good idea, but in my experience, scripts that do not tend to lock
    you in by doing things such as storing the data a certain way because of their
    user interfaces. You should pick a polling engine glue layer that is good at polling
    and can be used separately from your user interface. Ideally, you should pick
    one with the polling code and graphing code in separate files.


    Some of the glue layers are definition-happy. For example, storing data from the
    InOctets counter of router6 and router7 requires a separate definition for each
    host. The point of using the glue layer in the first place is to make things easier.
    You shouldn''t need to reconfigure it when you add new hosts. Choose glue that
    has services-based configurations. You should only have to define what the output
    from a particular service check looks like, and the glue code auto-detect new
    hosts using that service check.


    Finally, the fancier a glue library is, the further you should stay away from
    it. For your purposes, you want a very small, lightweight wrapper around Tool
    so that the glue layer doesn''t limit how much you can store by virtue of it being
    heavy and slow. Things such as GUI configuration tools, Java, and database back-ends
    are red flags.


    # NagiosGraph


    I''ve used a few of the more promising glue libraries from Nagios Exchange over
    the years, and I''ve finally settled on a Perl script around Nagios Graph. Simply
    put, I use Nagios Graph because it is the closest thing to what I would write
    if I were going to reinvent the wheel. NG is a lightweight Perl script that has
    many of the beneficial traits previously mentioned.


    It comes with two scripts, one for data collection and RRD storage and one for
    drawing HTML with graphs, so you can use the polling/storage script if you want
    (which I do). NG uses Perl regular expression syntax to define service output
    and auto-detects new hosts. Alas, you cannot define RRAs in a configuration file,
    but a simple grep RRA of the insert.pl program (NG''s data collection script)
    yields the output in Listing 7.3.


    # Listing 7.3 Modifying RRAs in Nagios Graph.


    ```

    $ds = "RRA:AVERAGE:0.5:1:600";

    $ds = "RRA:AVERAGE:0.5:6:700";

    $ds = "RRA:AVERAGE:0.5:24:775";

    $ds = "RRA:AVERAGE:0.5:288:797";

    ```


    It''s not a text configuration file, but it''s close enough. Even if you''re not
    familiar with Perl, you can modify these RRAs to get what you want. NagiosGraph
    is equally easy to'
