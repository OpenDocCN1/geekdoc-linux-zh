  md: '# Local Queries


    Actually, the best thing about WebInject is that it has a Nagios plugin mode.
    With a simple configuration parameter in its config.xml, WebInject becomes a Nagios
    plugin, carrying out its test cases and returning with a Nagios-compatible exit
    code and output string. It even provides performance data.


    All of these combines make WebInject the perfect end-to-end Web site monitoring
    plugin. For example, assume you run a Web site with a search entry field and a
    database backend. For example, you are probably familiar with www.google.com.
    In this example, you want to be sure that your Web site operates as expected;
    that is, not only is it alive, but it also functional.


    In Listings 6.4 and 6.5, you saw that you could monitor port 80 with check_tcp,
    but this wouldn''t catch HTTP errors, as for 404. This was improved in Listings
    6.6 and 6.7 by sending an HTTP GET and parsing the response code. However, an
    error in the database back-end could render the Web site useless. Although the
    HTTP server might run flawlessly, users would not get useful information from
    the queries. This example uses WebInject to do an echeck of www.google.com. The
    new check_http service basically reinvents the feeling lucky button. If it goes
    to the Web site, performs a query, parses the query results to find the first
    link, proceeds to that link, and verifies that the search text appears. If you
    can do that, you know you have a working Web daemon and a working Web site.


    The first step is, of course, installing WebInject. It can be obtained from www.webinject.org.
    Because it is a Perl script, there''s not much installing that to happen beyond
    acquiring various modules it depends upon. By default, WebInject will look for
    a config.xml file in the present working directory.


    As you can see in Listing 6.12, there isn''t much to the config.xml used in this
    example. The reportdirective directive specifies what kind of output WebInject
    provides. I set it to nagios, so that WebInject would operate in Nagios plugin
    mode. The testcasefile directive specifies the location of the XML file containing
    the test cases. Finally, the globalhttp directive enables logging for the tests.
    By default, logging information goes into http.log in the present working directory.
    You can set this option to yes to log everything, but here, it is set to onfail,


    # Listing 6.12 The config.xml for WebInject.


    ```

    <reporttype>nagios</reporttype>

    <testcasefile>testcases.xml</testcasefile>

