    # The Future of Windows Scripting


    Currently, in the world of Microsoft, .Net is all the rage. The .Net framework
    is a large library of solutions to many commonly occurring programming problems.
    It is meant to eventually supersede many existing Microsoft technologies, including
    COM and OLE. There is no plan, however, to develop and say of COM at Microsoft,
    and .NET does little to address the needs of systems people, so the VBScript/COM/OLE
    combination will likely remain the systems scripting environment of choice for
    the foreseeable future.


    PowerShell, formerly known as MSH, or Mondad, will probably have a larger impact
    on scripting the platform going forward than .Net. PowerShell is a scriptable
    CLI that is currently available as a download. PowerShell is capable of doing
    anything WSH can do, providing a friendlier interface to systems administrators.
    Where COM and VBScript provide a scriptable interface to existing GUI tools that
    support COM, Microsoft confirms that future versions of system configuration utilities
    will actually be written in PowerShell with wrappers, ensuring a scriptable interface
    to the OS going forward.


    Although the PowerShell implementation borrows concepts from UNIX, such as passing
    information between distinct programs via pipes, PowerShell does this in a much
    more object-oriented manner. For example, PowerShell programs (called cmdlets)
    give output to the shell in text, but when the same output is piped to another
    PowerShell cmdlet, data objects are exchanged instead. Microsoft is fond of this
    completely eliminates the need for text processing tools as awk, sed, and grep.
    To see what they mean by, consider the list of servers in Listing 6.20.'
