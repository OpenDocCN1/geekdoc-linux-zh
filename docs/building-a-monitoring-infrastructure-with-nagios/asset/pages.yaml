- img_proc: true
  md: "# Templates\n\nthat mitigate the need for typing. For example, any of the definitions\
    \ that refer to\nhosts may refer to a list of comma-separated hosts instead. Nagios\
    \ 2.x allows you to specify a\nhostgroup instead of a host for some definitions\
    \ that refer to hosts. These two features allow\nbring our 1,100 lines back to\
    \ 11.\n\nAnother wrist-saving feature is template-based configuration. Templates\
    \ capture redund-\ndant directives inside special definitions. Normal objects\
    \ can then refer to the template and\ninherit directives instead of specifying\
    \ them explicitly. Template definitions look and act\nexactly like their counterparts\
    \ with two exceptions: the register directive and the name direc-\tive. Listing\
    \ 4.4 is a template version of the host definition from Listing 4.1.\n\n# Listing\
    \ 4.4 A host template and consumer definition.\n\n```\n# This is my template\n\
    def host(\nname                hostTemplate\ncheck_command      check-host-alive\n\
    max_check_attempts  5\ncontact_groups      admins\nnotification_interval  30\n\
    notification_period  24x7\nnotification_options  d,u,r\nregister            0\n\
    )\n\n# myHost is shorter now that it inherits from hostTemplate\ndefine host(\n\
    hname               myHost\nalias               My Favorite Host\naddress    \
    \         192.168.1.254\nparents             myotherhost\nuse                \
    \ hostTemplate\n)\n```\n\nAs you can see, both definitions define objects of type\
    \ host. The host template, however,\nhas a name directive (instead of a host_name\
    \ directive) and a register directive, which is set\nto 0. Both name and register\
    \ are specific to templates despite the object type, so any other\ntype of template\
    \ (like a service template) is the same way. The name directive is self-\nexplanatory;\
    \ it gives the template a name other objects can refer to. The register direc-\n\
    t to zero tells Nagios not to treat the host as a host object (don't register\
    \ it), but rather\nlet other objects inherit settings from it (make it a template)."
  merge: -1
  pgno: 83
- img_proc: true
  md: "# 60\n\n# Chapter 4 Configuring Nagios\n\nBy adding a use directive to myHost's\
    \ definition, I instructed Nagios to let myHost inherit settings from the template.\
    \ The host object inherits anything that is specified in the template. The host\
    \ object overrides any directives it has in common with the template. Templates\
    \ may, in turn, inherit properties from other templates, so it's quite common\
    \ practice with host definitions to define a global host template, then several\
    \ OS-specific templates, and hosts that refer to them. Technically, any object\
    \ can inherit properties from any other object of the same type, registered or\
    \ not (I don't recommend having normal objects inherit from other normal objects.\
    \ Stick to dedicated templates or templates that get muddled), to an infinite\
    \ degree via the use directive. I highly recommend the template-based configuration;\
    \ it's very flexible, saves lots of redundant configuration, and makes for readable\
    \ config files.\n\n# Timeperiods\n\nRequired for daemon process\n\nRefers to:\
    \ none host, service, contact, hostescalation, serviceescalation\n\n# Listing\
    \ 4.5 Timeperiod example.\n\n```\ndefine timeperiod{\n  timeperiod_name nonworkhours\n\
    \  alias Non-Work Hours\n  sunday 00:00-24:00\n  monday 00:00-09:00,17:00-24:00\n\
    \  tuesday 00:00-09:00,17:00-24:00\n  wednesday 00:00-09:00,17:00-24:00\n  thursday\
    \ 00:00-09:00,17:00-24:00\n  friday 00:00-09:00,17:00-24:00\n  saturday 00:00-24:00\n\
    }\n```\n\nTimeperiods define blocks of time that many other objects reference\
    \ in the context of operational hours or blackout periods. The timeperiod definition\
    \ is generic; the period of time it defines is not specific to any particular\
    \ purpose, so two different objects may refer to the same time period for completely\
    \ different reasons.\n\nTime periods have one directive for each day of the week.\
    \ Omitting a altogether means the entire day is not included in the time period.\
    \ Like all other objects, time periods may inherit directives from other time\
    \ periods or timeperiod templates. Multiple blocks of time in the same day may\
    \ be specified by separating them with commas."
