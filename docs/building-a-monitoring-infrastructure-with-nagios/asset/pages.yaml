  md: '# Management Interfaces


    ![](img/7c754ef117b945190cb5d61f0388dd22_195_0.png)


    Figure 2.23 Embedded into the Nagios Web interface.


    # Force Directed Graphs with jsvis


    The problem with static graphics is fitting everything in. Tools such as GraphViz
    and LGL (see http://apropos.icmb.utexas.edu/lgl/) use complex layout algorithms
    that maximize the most efficient use of space while maintaining readability, but
    large graphs can become cluttered, limiting their usefulness. If you''ve ever
    wished you could interact with a network graph in real-time, jsvis might be for
    you.


    Written by Kyle Scholz, jsvis is a freely-available JavaScript applet that implements
    force directed graphs in a Web interface. If you''ve ever used the visual thesaurus
    (www.visualtheaurus.com/), you are familiar with the concept. Force directed graphs
    are very much like GraphViz views that you can interact with. If the graph contains
    many servers that you are obscuring out, for example, you can move the nodes you
    want to examine into view.


    I think force directed graphs have huge potential in a systems monitoring context.
    For less complex and organic than 3D visualization, they are simply the best way
    I''ve seen to model a large number of network nodes in a small space. Kyle''s
    blog contains the code, interactive samples, and even a tutorial to get you started
    coding. I highly recommend a visit: www.kylescholz.com/blog/2006/06/force_directed_graphs_in_jsvas.html.'
