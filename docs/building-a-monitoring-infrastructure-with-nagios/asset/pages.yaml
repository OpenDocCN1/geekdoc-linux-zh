    \ users can be added in the same manner, but sure to drop the -c switch after\
    \ the first user, as is used to create the file and overwrite any files that already\
    \ exist. As described in, \"The CGI Config,\" users who authenticate through the\
    \ Web server via the htpasswd.users file are matched with contacts in the contacts.cfg\
    \ that have the same name.\n\nIt’s very common for people to get the Web interface\
    \ working but then to have trouble with the CGI commands. The user ID used by\
    \ Apache must be a member of the group used for Nagios commands. This group is\
    \ specified to configure the script at compile time and defaults to nagios. An\
