  md: 'familiar to anyone who has configured software on a UNIX system. There is one
    directive

    per line, followed by an =, followed by the value of the directive. Whitespace
    is optional and

    comments begin with a pound (#).


    Definitions, no matter the type, use a common syntax that represents a function
    in C or

    Perl. The definition is composed of a block of directives surrounded by curly
    braces (()) and

    beginning with a define keyword, followed by the object type. Directives within
    the defini-

    block are whitespace-spaced, unlike the nagios.cfg counterparts, which use an
    =. All

    object have one directive in common: <objecttype>name. For example, a host

    object has a host_name directive, whereas a servicegroup has a servicegroup_name
    direc-

    tive. Most also have an alias directive. Comments begin with a pound (#). Listing
    4.1 is an

    example host definition, to give you a feel for the syntax.


    In Nagios 2.0 and above, it is possible to use regex syntax in place of static
    text in any

    directive that accepts a comma-separated list of values. (This option is disabled
    by default

    and must be enabled by setting the use_regex_matching directive to 1 in the nagios.cfg)
    For

    example, specifying * in the host_name directive of a service definition causes
    that

    definition to apply to all hosts.


    # Listing 4.1 A sample host definition.


    ```

    #A comment about myHost

    host(

    host_name           myHost

    alias               My Favorite Host

    address             192.168.1.254

    parents             myotherhost

    check_command       check-alive

    max_check_attempts  5

    contact_groups      admins

    notification_interval 30

    notification_period 24x7

    notification_options d,u,r

    )

    ```


    # nagios.cfg


    Required for daemon start

    Refers to: everything

    Refer to by: cgi.cfg


    If you run install-config during installation, a nagios.cfg-sample file is written
    for you. It''s

    specific to the configuration directives you provided, it should already have
    the correct

    locations for lock files, log files, and the sort. In fact, for first time installs,
    there is usually

    little you have to change in the nagios.cfg. I recommend you start with an existing
    nagios.cfg

    and modify it to your needs.'
