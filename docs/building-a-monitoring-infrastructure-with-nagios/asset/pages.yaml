  md: '# Watching UNIX


    FreeBSD, the load average numbers are there and are (probably) derived in the
    same way. Memory utilization, however, is the opposite. (Check out the Solaris
    section of the Nagios Exchange [www.nagiosexchange.org] for Solaris-specific plugins.)
    Unfortunately, user tools such as vmstat, don''t provide an insulation layer over
    the differences in the various UNIX virtual memory implementations, and other
    tools, such as free, might not exist on particular platforms at this. This makes
    it hard to write a single Nagios plugin that accurately tracks memory across all
    UNIX systems.


    Additionally, UNIX systems do a lot of memory caching and buffering, even if there
    enough to take these measurements, the results wouldn''t be all useful. When systems
    have X amount of RAM, they''ll unfortunately use most of it, and this is a good
    thing.


    For UNIX systems in general, the question becomes not, "How much RAM am I using?"
    but, "Is this system running on RAM?" To answer that, a much better indicator
    of unhealthy memory utilization is the way in which the system is using space.
    Tools like sar, vmstat, and iostat are useful for querying information about space
    utilization, but again, these tools do not contain common functionality across
    various flavors of UNIX.


    For example, vmstat on Solaris provides a page/sr column that details the page
    scan rate. This is a great metric for understanding whether a system is out of
    RAM. No matter how much memory a machine has, if the page-scanning rate is above
    200 or so, you know you have a problem. Unfortunately, vmstat on Linux provides
    no information, so monitoring in your UNIX environment depends on what kind of
    systems you have and what tools you have available to monitor them.


    The official Nagios plugins tarball has a check_swap plugin that can give you
    information on swap utilization for any Linux host. It is also reported to work
    well on BSD but is unreliable on Solaris. Check_swap provides basic information,
    however, although it can''t measure things such as pages per second, it can tell
    you what percentage of swap is in use on a given server. To use check_swap, add
    the following line to your nrpe.cfg on the monitored host.


    ```

    command[check_swap]=/usr/libexec/check_swap -w $ARG1$ $ARG2$

    ```


    This isn''t much different from our check_load command. Check_swap will figure
    out the total amount of swap space available and then figure out how much is used.
    Threshold are expressed as either the percentage of free space or the number of
    bytes of free swap'
