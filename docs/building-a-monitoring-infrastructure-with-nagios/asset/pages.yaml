  md: '# Services


    Service objects glue it all together. They refer to every mandatory object that
    ties together the specifics of how you want to run a given plugin, often the,
    and whom to call when things go wrong. A whopping 31 directives may be specified
    in a service definition. The 11 shown in Listing 4.11 are mandatory. The remaining
    20 are found in the online documentation at http://nagios.sourceforge.net/docs/2_0/xodtemplate.html#service.


    The host_name directive specifies a comma-separated list of hosts on which this
    service runs. The service definition breaks with the name/alias convention in
    favor of a single service_description directive. This is because, unlike the other
    objects, services aren''t required to have unique names; they need to specify
    a unique set of hosts. It''s perfectly fine to create multiple service objects
    with the same name but completely different settings, if they don''t share a reference
    to the same host object. This is handy, for example, when more than one host needs
    the same service except for a different retry interval. In this situation, the
    service can be copied en masse and the host_name and interval need to differ from
    the original.


    The check_command directive specifies the command object used to check the service.
    It''s also common for plugins to provide a subset of functionality; for example,
    instead of having two plugins called check_sda1 and check_sda2, the tarball has
    a single plugin called check_disk, which is capable of checking any disk. The
    check_disk plugin simply takes the name of the disk as an argument on the command
    line and checks it.


    Service objects, on the other hand, tend to be single purpose and the service
    in Listing 4.10 is no exception. It uses the check_disk to check a single disk,
    name /dev/sda1. Because command syntax may contain whitespace, an exclamation
    mark is used to separate the command name from the arguments you pass to it. Each
    argument is made available to the command object via a numbered ARG macro. In
    the previous example, when Nagios references the check_disk command, it replaces
    the command definition''sARG1 macro with /dev/sda1, and executes the command.
    Any number of exclamation marked arguments are supported.


    Service notifications are a bit more straightforward than host notifications,
    but they follow the same pattern. Check bad statuses are retried a number of times
    to ensure they are down and remain down. While Nagios is verifying the state of
    a service with retries, the service is placed in a soft state. When the service
    is verified to be down, it is placed in a hard state and notifications are sent.
    Follow-up notifications are sent every often until the service recovers.'
