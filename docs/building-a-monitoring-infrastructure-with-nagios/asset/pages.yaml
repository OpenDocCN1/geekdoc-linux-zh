    Notice that the actual contents of the file are

    Notice that the actual contents of the file are two numbers separated by a Colon.
    With great service struct, I couldn''t resist pulling out an extra tidbit of information.
    This is the state_type, which is an int that specifies whether the service is
    in a hard state (0) or a soft state (1). So, if on host15 was in a hard critical
    state, then the contents of the file /var/lib/nagios/status/host15/ping are 2:0.


    Although it compiles and works, this module has some big problems. It doesn''t
    do things, such as check whether the directory creations and file writes succeed,
    and it can be far more efficient about system calls. For example, you can dereference
    last_state and compare with current_state to determine if it is worth opening
    the file. In fact, subscribing to state change events is probably more efficient,
    but in the interest of keeping the example as straightforward as possible, a lot
    of important functionality has been omitted.


    The goal of this chapter was to get you excited about the Event Broker interface
    and its capabilities. The Nagios community needs creative people to contribute
    interesting modules. If you have an idea for a useful module, I hope this chapter
    gave you a head start. I can''t wait to use your module when you are done.'
