    pointers. If you are adept at C, feel free to skip this section. Function pointers
    are equivalent to variable pointers, except they point to a memory address that
    corresponds to a function instead of a variable of some type. If you understand
    pointers, they work the exact same way and their syntax is what you would expect,
    but they are rarely covered in C programming books. This is a shame because it''s
    hard to come up with simple examples in which they might be useful. This is a
    shame, because they enable some elegant engineering in larger C programs, such
    as Nagios.


