    # Distributing the Load


    My description of service scheduling in Nagios presents a problem. Because scheduling
    is determined by the last time a service was completed, the entire scheduling
    algorithm is dependent on when the services started. If all services started at
    the same time Nagios did, then all services with the normal check interval would
    be executed at exactly the same time. If this were to happen, Nagios would quickly
    become unusable in large environments, so Nagios attempts to protect the monitoring
    server and its clients from heavy loads by distributing the burden as wisely possible
    within the time constraints and across remote hosts. Nagios does this through
    a combination of intelligent scheduling methodologies such as service interleaving
    and inter-check delay.


    When Nagios starts, it usually does so with a long list of hosts and services.
    Nagios'' job is to establish the status of each element on that list as quickly
    as possible so, in theory, it could just go down the list item by item until it
    came to the bottom and then begin again from the top. This methodology is not
    optimal, however, because working the list from bottom puts a lot of load on individual
    remote hosts. If Server1, at the top of the list, were configured with 18 services,
    for example, Nagios would demand the status of all 18 immediately. Instead, Nagios
    uses an interleave factor, as depicted in Figure 2.4.


    ![](img/7c754ef117b945190cb5d61f0388dd22_50_0.png)


    **Figure 2.4** With an interleave factor of 3, Nagios checks every third service.'
  merge: -1
  pgno: 50
- img_proc: true
  md: '# Scheduling


    With an interleave factor of 2, Nagios would ask for every other item in the list
    until it got to the bottom: 1, 3, 5, and so on. Then, beginning from the second
    to the top, it would ask for every other again: 2, 4, 6, and so on. In this manner,
    the load is distributed across different servers, yet the overall state of the
    network takes no longer to discover with the top down method. The interleave factor
    is user-definable, but Nagios, by default, calculate for one using the following
    formula, which is optimal in nearly all cases:


    \u200\u20dinterleave factor = ( total number of services / total number of hosts
    )


    Reducing the load on the remote hosts, however, does nothing for the Nagios server,
    which still needs to process the sending and receiving of large numbers of checks
    upon startup. To alleviate the intensive burden of the first few minutes after
    startup and to ensure that cycles are available for important tasks, such as log
    rotation, Nagios inserts a small amount of time between the inter-check delay,
    which would otherwise be executed in parallel. This period, called the inter-check
    delay, is user-definable, but if set too high, may cause the schedule to slip.
    Nagios will calculate for you if the inter-check delay method is to smart (which
    it is, by default) using the following formula:


    \u200\u20dinter-check delay = (average check interval for all services) / (total
    number of services)


    You should be aware that many other options exist to influence the scheduler,
    especially during startup. For example, a max check spread can be imposed, which
    limits the amount of time Nagios may take to initially glean the status of each
    host. Obviously, this option, if set, affects the preceding-check delay formula.
    To help you sort out of these settings, execute the Nagios binary with an -switch
    to provide scheduling information based on the current configuration.


    # Reapers and Parallel Execution


    The events that are processed in the queue break down into one of two types: those
    that can run in parallel and those that cannot. Service checks event is found
    in the queue, it is forked and Nagios continues to process the next event in the
    queue. The service check that was forked will execute a plugin and its error code
    output in a message queue until an event reaper comes along collect it.


    Reaper events are the heartbeat of Nagios. Their frequency of occurrence in the
    event queue is a user-defined option and it''s an important one. No matter how
    the plugin finishes its work and reports back its status, Nagios will not process
    it until a service reaper comes along and discovers it in the message queue.'
  merge: -1
  pgno: 51
- img_proc: true
  md: 'The number of service events Nagios is allowed to execute in parallel is defined
    by the max concurrent checks option. This variable is also an important one; if
    set too high, the Monitoring server''s resources will be completely consumed by
    service checks. On the other hand, set it too low, and service check schedules
    may slip. The Nagios documentation provides a primer about how to optimize the
    concurrent checks variable, based on the average amount of time it takes for your
    plugins to execute, at: http://nagios.sourceforge.net/docs/0/cscheduling.html#max_concurrent_checks.


    The Nagios Web interface includes tools to quantify the number of checks not meeting
    their schedules. Some of events will inevitably miss their initially scheduled
    windows because they''ve been preempted by retry checks for other services that
    have gone into soft error states, because some checks longer than others, in the
    text or because of a plethora of other reasons. So don''t worry too much if you
    see schedules slip now and again; the Nagios scheduler, in my experience, always
    does the right thing, given the chaotic nature of its task.


    # Notification


    If you haven''t configured it to otherwise, Nagios will send notifications every
    time a hard state occurs or whenever a host or service stays in a bad state long
    enough for a follow-up notification to be sent. Many options in various object
    definitions can affect how notifications are sent that it can be difficult to
    maintain a mental picture of the overall notification logic. Nagios'' notification
    framework is a welcome surprise to sysadmins for the robust flexibility it provides,
    but it is also often misunderstood subject among neophytes because it is so configurable.
    See the “Check Interval and States” section for a description of hard states.


    Describing the notification logic is a great way to introduce many fundamental
    concepts. If you can understand how notification works within Nagios, then you
    will understand Nagios. The following sections start from the top and explain
    the various levels for notification options can be configured. It also points
    out some potential “gotchas” along the way.


    # Global Gotchas


    Nagios, like countless UNIX programs before it, is configured by way of text files.
    So generali, in the text files will define Nagios'' state while it is running.
    Certain settings can be changed at runtime, the config file definitions do not
    necessarily reflect what Nagios is actually doing for a few specific settings.
    One important example is the global enable notifications setting. This option
    enables or disables notifications programmatically, and it''s probably the most
    dangerous of the runtime changeable configuration options.'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# Notification


    It is especially important to be aware of the actual state of enable notifications
    because Nagios can be configured to use a persistent program state. That is, when
    Nagios is shut down, it will write its currently-running configuration state to
    a file, so when it is started again, it will start right where it left off. When
    Nagios is started in a persistent program state, via the retained option, the
    settings in the state file override those in the configuration files. This means
    that if the enable notifications option is set to enable in the config file, but
    reset to disable when Nagios is running, it''s possible that this setting persist
    across restarts, and someone looking in the configs will believe that it, in fact,
    enabled, when it is not.


    Always make sure to check the "Tactical Overview" CGI for the Nagios GUI if you
    have notification problems, to be sure that notifications are globally enabled.
    If you feel that restarting Nagios may resolve your problem, be sure to disable
    program persistence and/or delete the state file before you start Nagios back.
    Deleting the state file while Nagios is no good; Nagios will simply write a new
    one when it is shut down. So shut down, delete, and then start up.


    # Notification Options


    Hosts and services each have several options that affect the behavior of notifications
    in Nagios. The first is to aware of the notification options setting. Each host
    or service can be configured to send notifications (or not) for every possible
    state that Nagios tracks. These states are slightly different for hosts and services,
    because hosts and services are different in reality. Table 2.2 summarizes the
    possible host and service states.


    | Host States | Service States |

    | --- | --- |

    | Unreachable (u) | Unknown (u) |

    | Down (d) | Critical (c) |

    | Recovered (r) | Warning (w) |

    | Flapping (f) | Recovered (f) |


    Flapping is the term Nagios coined to describe services that go up and down repeatedly.
    Nagios can be configured to detect flapping services as a notification convenience,
    because service flapping can cause many unwanted notifications. The notification
    options setting should list each state you want Nagios to send a notification
    for. If critical CPU notifications are wanted, but not warnings, the notification
    options setting should list only c. If you want to be notified when a service
    recovers from a bad state, then r must be explicitly listed, as well.


    In addition to service and host definitions, contact definitions also have a notification
    options setting. Contact definitions are used to describe a person who Nagios
    may send a'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# 30 Chapter 2 Theory of Operations


    notification to. In addition to obvious options, such as the contacts'' name and
    email address, each contact definition may contain a host notification options
    setting, as well as a service notification options setting. Together these options
    provide you the ability to filter the type of notifications any single contact
    receives. A programmer, for example, might always want problem notifications for
    the applications he''s responsible for, but never recovery pages because he knows
    the problem is fixed because he is the one fixing it.


    # Templates


    A potential gotcha, with definitions in general, is the concept of definition
    templates. Because there is a lot to define, Nagios allows you to create generic
    definitions that list options certain types of systems have in common. The Web
    servers may all have common notification contacts and thresholds, for example,
    when you go about creating the service definitions for the Web servers, you might
    create a generic service definition called web-servers first, and refer the individual
    service definitions to it. This way, you only have to define thresholds and notification
    contacts instead, of once per service. These generic definitions are called templates,
    and they save you a substantial amount of typing.


    Options explicitly defined in a service definition take over those set in the
    template that the definition refers to. However, when the definition inherits
    its notification options setting from a template, it is not immediately obvious
    what the service is to notify on. I recommend you always try to explicitly set
    the notification options. It''s common to cut and paste when dealing with Nagios
    configs, so at least be aware of the notification options setting and know which
    template inherits from, if it''s not explicitly set. More information on templates
    can be found in Chapter 4.


    # Time Periods


    Something that affects Nagios'' notification behavior is the configuration setting
    for time periods. Like many other things in Nagios, time periods are user-defined.
    They are used to specify a block of time, such as Monday through Friday, 9 a.m.
    to 6 p.m., which service and host definitions refer to, their hours of operation.
    Service definitions refer to time periods in two ways. The notification period
    defines the hours within which Nagios is allowed to send notifications for the
    service, and the check period defines the period of time Nagios may schedule checks
    of the service.


    Nagios is not just a monitoring system; it''s also an information collection program.
    Nagios can collect utilization and status information from anything it monitors
    and pass this information along other programs for graphing or data mining. Services
    such as CPU are good candidates for 24 x 7 data collection, but you might not
    want to send notifications all the time, because CPU intensive things, such as
    backups, to happen at night. This is a perfect example of why you might want to
    have different settings for the we notification period and check period.'
