  md: '# Introduction


    They quickly became obsessed with features, creating enormous spreadsheets of
    supported gizmos. Their software engineers exist so that the presales engineers
    can come to your office and say to your managers, through seemingly layers of
    white gleaming teeth, "Yes, our software can monitor that.",


    The problem is monitoring systems is not turnkey solutions. They require a large
    amount of customization before they start solving problems, and herein lies the
    difference between people selling software and those designing and implementing
    systems. When you''re trying to build a monitoring system, a piece of software
    that can monitor every gadget in the world by clicking a check box is not as useful
    to you as the one that makes it easy to monitor what you need, exactly in the
    manner that you want. By focusing on what to monitor, the proprietary solutions
    neglect the bow, which limits the context in which they may be used.


    Take ping, for example. Every monitoring I''ve ever dealt with ICMP requests,
    also known as pings, to check availability in ever or other. If you want to control
    how a proprietary monitoring system uses ping, architectural limitations become
    quite apparent. Let''s say you specify the number of ICMP packets to send or want
    to send notifications based on the round-trip time of the packet in microseconds
    instead of simple pass/fail. More complex environments may necessitate that you
    use IPv6 pings, or that portknock before I ping. The problem with the monolithic,
    feature-full approach is that these changes represent changes to the core application
    logic and, therefore, nontrivial to implement.


    In the commercial-monitoring applications I have worked with, if these ping examples
    can be performed at all, they require re-implementing the ping logic in the monitoring
    system''s proprietary scripting language. In other words, you would have to touch
    the built-in ping functionality altogether. Controlling the specs of pings is
    of questionable value, if you don''t have enough control over something as basic
    as ping, or are the odds that you''ll have enough control over the most important
    pings in your environment? They''ve made the assumption that they know how you
    want to ping pings, and from then on it was game over; they never thought about
    again. And why would you? The ping feature is already in the spreadsheet, after
    all.


    When it comes to gizmos, Nagios'' focus is on modularity. Single-purpose monitoring
    alerts provide support for devices and services. Rather than participating in
    the feature arms, hardware support is community-driven. As community members have
    to monitor new devices or services, new plugins are written and usually more quickly
    than the commercial applications can add the support. In Nagios also supports
    everything you need to and without ever needing to upgrade Nagios itself. Nagios
    also provides the best of both worlds when it comes to, with several commercial
    options, as well as a thriving and helpful community that provides free support
    through various forums and mailing lists.


    Choosing Nagios as your monitoring platform means that your monitoring effort
    will be limited only by your imagination, technical prowess, and political savvy.
    Nagios can go anywhere you want it to, and the trip there is usually simple. Although
    Nagios can go every-'
