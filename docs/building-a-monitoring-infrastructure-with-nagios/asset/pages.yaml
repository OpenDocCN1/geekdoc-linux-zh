    to verify the various commands throughout the chapter.


    Most UNIX operating systems I am aware ship with packaged versions of Nagios or
    otherwise have them available. In the Linux realm, Red Hat, SuSE, and Mandriva
    users find Nagios RPMs on their installation media, Debian and Ubuntu types may
    apt-get install'
