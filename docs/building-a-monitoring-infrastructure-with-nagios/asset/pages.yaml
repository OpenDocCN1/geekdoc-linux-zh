    But some people soon duplicate emails because they belong to more than one list,
    and each of those lists has received the same notification. Weeks later, our admin
    gets a noncritical notification at 3 a.m. He decides to fix it in the morning
    and goes back to sleep. When morning arrives, he forgets all about it. The service
    remains unavailable until a customer notices it and calls the phone.


    Our admin doesn''t need better scripts, a smarter way to run them. He needs a
    task-efficient scheduling and notification system, which tracks the status of
    a group of little monitoring programs, manages dependencies between groups of
    monitored objects, provides escalation, and ensures people don''t get duplicate
    pages, regardless of their memberships. This sums up to Nagios'' intended purpose.


    Nagios is a framework that allows you to intelligently schedule little monitoring
    programs written in any language you choose. Each monitoring program, or plugin,
    reports its status to Nagios, and Nagios tracks the status of the plugins to make
    sure right people get notified and provide escalations, if necessary. It also
    keeps track of the dates and times that various plugins changed states and has
    built-in reporting capabilities. Nagios has lots of hooks that make it easy to
    get data in and out, so it can provide real-time data to graphing programs, such
    as RDDTool and MRTG, and can easily cooperate with other monitoring systems, either
    by feeding them or being fed by them.


    One of the things about Nagios is that it leverages what you''re already good
    at (individually and organizationally) and doesn''t throw your hard work into
    the “bit bucket.” If you are a TCL “Jedi” and your organization values because
    of your skills, it shouldn''t be forced to track the five months you spent on
    a TCL-based monitoring infrastructure in an effort to better centralize your monitoring
    tools. Because Nagios has no desire to control your monitoring methodology, it
    won''t attempt to drive your organization''s use of tool sets and, therefore,
    will never force you to re-invent the wheel.


