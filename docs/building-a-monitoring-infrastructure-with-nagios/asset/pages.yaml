  md: '56


    Chapter 4 Configuring Nagios


    # Table 4.2 Global Enablers in the nagios.cfg (continued)


    | Name | Description |

    | --- | --- |

    | execute_host_checks | This enables/disables host checks. Defaults to 1 (on).
    |

    | accept_passive_host_checks | This enables/disables checks of hosts. Defaults
    to 1 (on). |

    | enable_notifications | This setting controls whether Nagios will send notifications.
    Defaults to 1 (on). |

    | enable_event_handlers | Event handlers may be globally enabled or disabled.
    Defaults to 1 (on). |

    | process_performance_data | This determines whether Nagios will check for and
    handle performance data from plugins. Defaults to 0 (off). |


    Table 4.3 describes the time-outs, which control how long Nagios allows various
    commands. When a command in the queue is executed, Nagios allows it to run for
    a user-defined period of seconds. Commands that take longer than that amount of
    time are killed, it''s important to remember these timeouts if you have a problem
    with custom checks or event handlers unexpectedly dying. When Nagios kills a command
    due to a timeout, it logs a warning message.


    # Table 4.3 Global Time-Out Values


    | Objective Name | Description |

    | --- | --- |

    | service_check_timeout | The length time Nagios waits for a service check plugin
    to return its status. Defaults to 60 seconds. |

    | host_check_timeout | The length time Nagios waits for a host check plugin to
    return its status. Defaults to 60 seconds. |

    | event_handler_timeout | The length time Nagios waits for an event handler to
    finish execution. Defaults to 30 seconds. |

    | notification_timeout | The length time Nagios allows a notification command
    to run. Defaults to 30 seconds |

    | perfdata_timeout | The length time Nagios allows a perfdata handler to run.
    Defaults to 5 seconds. |


    There''s a lot of stuff in nagios.cfg that I didn''t mention here, including many
    of the directives referred to by Chapter 2, which tweak various operational parameters
    used by the scheduler. Appendix B contains a comprehensive list of the configuration
    options available in the nagios .cfg and cgi.cfg files.'
