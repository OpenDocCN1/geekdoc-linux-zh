  md: "# 70\n\n# Chapter 4 Configuring Nagios\n\nIt's possible to configure Nagios\
    \ to involve managers or other technicians, if a problem persists beyond a certain\
    \ number of notifications without being acknowledged. Nagios does this by way\
    \ of escalation definitions. Escalations can be configured for hosts or services,\
    \ and the definition syntax is nearly identical for each. The two main differences\
    \ are that host escalation may specify hostgroups instead of hosts, and service\
    \ escalations must specify the host and the service.\n\nEach time Nagios decides\
    \ to send a notification, it first checks to see if any escalation definitions\
    \ match the notification it is about to send. If an escalation matches the notification\
    \ Nagios wants to send, then Nagios sends the escalation indent. It's important\
    \ to note that it is either/or proposition, meaning that if the service definition\
    \ specifies that the admins contactgroup be notified and the escalation specifies\
    \ that the managers be notified, the escalation will win and the admins contactgroup\
    \ will get nothing, so be sure to include everyone that needs to be in the escalation\
    \ definition. The first_notification directive specifies the notification number\
    \ for which the escalation is first enabled. For example, List-4.14 will match\
    \ the fifth notification of a host down alert for router 34. The first four notifications\
    \ will be sent as normal, but the fifth will be an escalation. Escalation notifications\
    \ continue to be sent until the number specified by last_notification. If the\
    \ last_notification directive is set to 0, escalations continue until the host\
    \ becomes available again.\n\nIt is possible to have multiple escalations that\
    \ match the same notification. If this happens, Nagios sends both escalations,\
    \ so if two escalations match the same notification and have different contact_groups\
    \ directives, all the contacts are notified.\n\nEscalations may specify a custom\
    \ notification_interval, which defines the amount of time to wait between notifications.\
    \ This interval takes precedence over the interval originally specified in the\
    \ service definition. If two escalations match one notification and the escalations\
    \ contain different notification_interval settings, Nagios picks the smallest\
    \ interval and use it.\n\n# Dependencies\n\nNot required for daemon start\n\n\
    Refers to: host, service\n\nReferred by:\n\n+   Listing 4.16 Hostdependency example.\n\
    \n```\ndefine hostdependency{\n  host_name myHost\n  dependent_host_name server1\n\
    \  notification_failure_criteria d,u\n}\n```"
  merge: -1
