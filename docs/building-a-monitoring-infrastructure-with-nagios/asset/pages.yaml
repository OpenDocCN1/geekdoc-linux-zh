  md: 'exports its functionality via COM, which is most applications out there. Scripts
    that use COM to query information from Windows systems and then exit with the
    appropriate exit codes are, by definition, Nagios plugins.


    # WMI


    One piece of software that doesn''t export its functionality via COM is the kernel.
    Various flavors of UNIX have their proc sysfs filesystems, but until recently,
    this critically important system environment was largely unavailable to scripting
    languages in Windows. The closest thing was perfmon, which is a real-time performance
    statistics program that didn''t itself to be driven from scripting languages or
    the command line. Products by SNMP Informant could export perf information via
    SNMP, but this is more kludge than solution. Windows Management Instrumentation
    fills this gap nicely. WMI is like a COM interface to the runtime environment.
    It can be thought of as another COM interface, but that provides access to things
    such as disk and network utilization.


    WMI is derived from the Distributed Management Taskforce''s CIM. CIM, or Common
    Information Model, is a large database (called CIM Repository) of objects that
    represent manageable entities, such as hard drives, entire computer systems, and
    software packages. WMI is Microsoft''s implementation of CIM. The CIM concept
    encompasses more than you''d want in /proc. It is a collection of information
    about computer systems that includes the current memory utilization, as well as
    things such as the system''s serial number and PowerPoint version. As such, many
    Windows applications extend the CIM data with their own information. Applications
    and providers that provide information to the CIM are called providers.


    Because the CIM repository contains a lot of information, it is broken down into
    namespaces to provider types, such as Root\SNMP or Root\Microsoft\V2. The built-in
    OS providers use RootCIMV2. These namespaces are further broken down into classes,
    which are functionality-specific objects, such as Win32-Process or DiskObject.
    Additionally, WMI implements a SQL-like query language called WQL to help you
    find the specific of information you need. Few people programmatically explore
    the CIM repository using WQL, however. Use a GUI browser, as wbtest.exe, located
    in system32 on most Windows systems. WQL is still necessary, however, to instantiate
    specific class objects in a script.


    To give you a feel for the capabilities of WMI/OLE, as well as what a Nagios plugin
    that uses WMI looks like, look at Listing 6.17, which is a Nagios plugin called
    check_dllHost. Its purpose is to make sure that no single dll process consumes
    more than a user-specified amount of RAM. It is written in Perl and uses the Win32_Process
    WMI Class.'
