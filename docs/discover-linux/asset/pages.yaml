    This appendix describes all the packages contained in the Red Hat 4.2 distribution
    of Linux.


    # abuse


    Shoot-em-up SVGA or X game.


    # acm


    An X-based flight simulator with network capabilities for multiple player games.


    # adduser


    Adds a new user to your system.


    # adjtimex


    Time adjustment utility.


    # amd


    The Berkeley automount daemon. Useful in network clients.


    # anonftp


    A set of files needed to set up anonymous ftp access to your machine.


    # aout-libs


    Old libraries needed to run some old games.


    # apache


    The most popular and best Web server around. Also — unbelievably — it''s free.'
