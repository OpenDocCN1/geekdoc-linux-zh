  md: '# THE TOP THREE MANAGEMENT OBJE TO LINUX AND HOW TO OVERCOME THEM


    +   * It''s free, so it can''t be worth much.


    Free software has a long history of supplying quality. Because it''s free, many
    more people can work on it than any one commercial company can supply — even Microsoft.


    +   * It''s unsupported.


    You can buy support if you need it. And if you do buy support, you really get
