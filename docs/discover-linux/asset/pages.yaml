- img_proc: true
  md: '# The tar command has a nasty surprise waiting for you if you are restoring
    from multiple tape files. The following tar command extracts all the disk files
    from the first tape file and leaves the tape positioned before the EOF on the
    tape:


    ```

    [user@pc user]$ tar xvf /dev/nftape

    ```


    If you follow this command with another tar, the second tar runs right into the
    EOF and extracts nothing.


    To extract all the files from two tape files, use the following commands. The
    first command rewinds the tape:


    ```

    [user@pc user]$ mt -f /dev/nftape rewind

    ```


    The next command extracts all the files in the first tape file:


    ```

    [user@pc user]$ tar xvf /dev/nftape

    ```


    The following command then moves the EOF:


    ```

    [user@pc user]$ mt -f /dev/nftape fsf 1

    ```


    Finally, the next command extracts all the files in the second tape file:


    ```

    [user@pc user]$ tar xvf /dev/nftape

    ```


    # Using cpio Command


    the cpio command was an attempt by AT&T to come up with a better version of tar.
    It has pretty much been a flop and is rarely used. One of the few places it''s
    actually used is inside the Red Hat package system to store the file list.


    # Creating a cpio Tape


    In "copy out" mode, cpio takes a list of files as standard input and copies the
    files to the standard output as an archive.


    The following command, for example, uses the find command to list all files that
    end with .c:


    ```

    [user@pc user]$ find . -name "*.c" -print | \

    cpio >/dev/nftape

    ```


    This list is piped to cpio, which creates an archive and sends it to the device
    /dev/nftape.'
