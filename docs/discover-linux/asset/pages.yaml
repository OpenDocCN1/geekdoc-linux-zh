    # Comparing Image Tools


    Each of the three major packages has its own advantages and disadvantages. Table
    12-6 lists these advantages and disadvantages.


    # TABLE 12-6 Image-Manipulation Tools


    +   Advantages:

    - Very good interactive interface.

    - Excellent color-manipulation tools.

    - Disadvantages:

    - Poor command line interface.


    +   ImageMagick

    Advantages:

    - Simple command line interface.

    - Number of commands is small.

    - Disadvantages:

    - GUI is based on keyboard commands that are cryptic and hidden.'
