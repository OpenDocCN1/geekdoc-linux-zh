  md: '# The tar Command (page 98)


    The tar command is in the following general form:

    tar <options> [files]


    Options must include one of the following:


    +   - c Create archive (write to tape)

    - x Extract files (get files from tape)

    - t Table of contents


    Other options include the following:


    +   - f Tape filename follows argument list

    - b Block size follows

    - v Verbose output

    - z Turn on compression


    Other, more-advanced options are documented in the man page.

    Use the following tar command to back up the current directory to tape:

    [user@pc user]$ tar cvf /dev/ftape .


    Use the following complex tar command to back up every file and symbolic link
    to tape:

    [user@pc user]$ find / \-type f -o -type 1 \)-print0 | \

    tar --create --verbose --dev/null --files-from - \n--null --block-size 128


    Here''s an example of how to get a table of contents from the tape:

    [user@pc user]$ tar tfb /dev/ftape 20


    Here''s a sample restore that uses tar:

    [user@pc user]$ tar xvf /dev/naftpe


    Using tar leaves the tape position just before the file mark. To restore a tape
    with two tar files on it, you need the following commands:


    ```

    [user@pc user]$ mt -f /dev/naftpe rewind

    [user@pc user]$ tar xvf /dev/naftpe

    [user@pc user]$ mt -f /dev/naftpe fsf 1

    [user@pc user]$ tar xvf /dev/ftape

    ```'
  merge: -1
