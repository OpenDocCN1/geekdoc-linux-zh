  md: '# CHAPTER ELEVEN


    # LINUX MEETS DOS


    IN THIS CHAPTER YOU LEARN THESE KEY SKILLS


    +   USING MS-DOS DISKETTES WITH LINUX PAGE 221

    MOUNTING MS-DOS PARTITIONS PAGE 224

    USING THE MS-DOS EMULATOR PAGE 225


    ![](img/d86aa78922e215fd387e0c1556445cac_250_0.png)


    Unfortunately, no matter how much the UNIX community tries to ignore them, MS-DOS
    and Windows 95 are here to stay. Linux contains a number of tools and built-in
    features that enable you to exchange data with MS-DOS disks. Also, a number of
    dedicated people have attempted to create software that enables you to run your
    MS-DOS programs under Linux. That way, you can have all the advantages of both
    systems.

    This chapter shows how Linux and MS-DOS can work together.


    # Dealing with MS-DOS Diskettes


    linux comes with a number of commands designed to deal with MS-DOS disks. These
    are called m commands because all the commands begin with the letter m. Many of
    these commands are similar to the familiar MS-DOS equivalents. If you want to
    copy a file to a diskette in drive A, for example, use the following command:


    ```

    [user@pc user]$ mcopy data.txt A:

    ```


    Table 11-1 is a list of commands similar to standard MS-DOS commands.'
