  md: 'ends, this routing gives you.)


    Your ISP gives you an IP address every time you establish a connection. The nodefault
    pppd to wait for the IP address from the remote and not try to pick a default.


    The passive option forces pppd to wait for a carrier before trying to send packets.


    The final two arguments establish the device to use (/dev/modem) and the speed
    (38400).


    # Configuring resolver


    The resolver is the Linux service that turns names into IP addresses. It does
    this in several ways, one of which is to query the nameserver on your ISP.


    The file /etc/resolv.conf must be updated to prepare for the PPP connection. First,
    remove from this file any nameserver lines that refer to your address (unless
    you are running your own nameserver).


    Next, you add a nameserver entry for your ISP. If the company provides backup
    nameservers, you merely add additional lines to the file /etc/resolv.conf.


    So, your new resolver configuration file looks like the following:


    ```

    search dox.com


    nameserver 207.110.0.60

    nameserver 207.110.0.128

    ```


    # Testing and Debugging the PPP Connection Script


    If all goes well, you can now establish a PPP link by becoming root and executing
    the command /usr/local/bin/ppp-up.sh. If you get connected, great!


    If your modem fails to connect, or it dials and hangs up, examine /var/log/messages
    to see what happened. This file contains the debug output of the chat. A typical
