  md: '# YOU CAN''T RESTORE


    I learned the hard way that the program you can never restore is the restore program.
    I had a hard drive crash, and I was forced to get a replacement disk. I was doing
    a full restore on the disk when the program crashed. It turns out that on a Sun
    computer, if you rewrite program file while you are using it, anyone running that
    program crashes. The restore program was trying to restore it when it crashed.
    This was not good. The file was damaged, so I couldn''t start again. Luckily,
    I did have copy of the restore program on tape. The trouble was, I needed restore
    program to read it off the tape. Oops. I had to go back and reinstall the operating
    system to get restore back.


    # Scheduling Automatic Backups


    Suppose that you want to have a weekly backup cycle. Every morning at 2:00 a.m.,
    you''ll do your backups. You want to start Tuesday morning and do a full backup.
    The rest of the week, you want to do a level 1 backup.


    On Monday morning, you want to eject the tape after the backup. That way, all
    you have to do on Monday morning is walk in, take the ejected tape out of the
    drive, pop a fresh one in, and be in business.


    To avoid confusion, create seven short shell scripts — one for each day of the
    week. The scripts look like the following:


    | Script | Contents |

    |---|---|

    | tue.sh | level0.sh |

    | wed.sh | level1.sh |

    | thur.sh | level1.sh |

    | fri.sh | level1.sh |

    | sat.sh | level1.sh |

    | sun.sh | level1.sh |

    | mon.sh | level1.sh ; mt -f /dev/nst0 |


    You use the cron command to run programs at certain times. What is run is controlled
    by a crontab file. To edit this file, you use the following command:


    ```

    [root@pc root]# crontab -e

    ```'
  merge: -1
