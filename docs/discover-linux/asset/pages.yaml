  md: '# CD-ROM INSTALLATION INSTRUCTIONS


    ![](img/d86aa78922e215fd387e0c1556445cac_467_0.png)


    # Installing the Software from the CD-ROM


    he CD-ROM that accompanies this book contains a full distribution of the Red Hat
    Version 4.2 Linux system.


    Because Linux is freely available, many companies produce CD-ROMs. The major difference
    between the various distributions is the installation. The Red Hat distribution
    includes a very robust installation that greatly simplifies the installation process.


    Linux is a freely distributable operating system that''s very similar to UNIX.
    But Linux is more than just an operating system. It''s also the tools and utilities
    that go with it.


    Linux includes tools for the following:


    +   * Networking

    * Multimedia

    * Programming

    * Text processing

    * Internet


    The software comes with full and complete source code, so you can see how the
    tools are constructed. You can also modify and improve them as needed.


    Because Linux is a complete operating system, it''s not as easy to install as
    typing d:setup and pressing Enter. You''ll need at least two disk partitions on
    which install Linux. Even with the advanced Red Hat installation program, installing
    Linux is not a simple task. It takes planning and preparation.


    Appendix C explains the CD-ROM contents in more detail, and Part I of this book
    is completely devoted to installation. Please read Part I, “Up and Running with
    Linux,” carefully before you install the CD-ROM; it leads you step by step through
    the entire process. It is designed to take the sting out of installing the complex,
    versatile, system that''s Linux. See the ReadMe.txt file on the CD-ROM for additional
    instructions.


    438'
