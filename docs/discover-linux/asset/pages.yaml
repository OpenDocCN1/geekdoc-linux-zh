- img_proc: true
  md: 'In RAID 0 mode, disk striping is performed. If you have two partitions, for
    example, this means that every other block is put on a different partition. This
    method tremendously improves disk performance, especially for SCSI disks. Figure
    15-4 illustrates RAID disk access.


    > NOTE Your RAID partitions should be on separate disks. Using two different partitions
    on the same disk will make your disk accesses extremely slow.


    # Virtual Disk | Physical Disk 0


    | Block 1 | Block 1 |

    |---|---|

    | Block 2 | Block 2 |

    | - | - |

    | Block 500 | Block 500 |

    | Block 501 | Physical Disk 1 |

    | Block 502 | Block 1 |

    | - | Block 2 |

    | Block 1000 | Block 500 |


    **Figure 15-4** RAID disk access


    RAM disk support (CONFIG_BLK_DEV_RAM) [Y/n/m/?] n


    This option enables RAM disk support. For a normal system, a RAM disk doesn''t
    do much good; it''s useful only if you''re creating a kernel for diskette or CD-ROM
    installation. Normally, the answer to this question is No.


