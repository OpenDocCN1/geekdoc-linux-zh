    One common problem occurs when the PPP daemon can''t establish a default route
    even when you include the defaultroute option on the command line.

    The first thing you''ll notice is that, although you connect to the remote computer,
    you can''t do much of anything. Looking in the file /var/log/messages, you find
    the following error message:


