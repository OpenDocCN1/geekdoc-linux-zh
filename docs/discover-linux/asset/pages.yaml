  md: "# CHAPTER 11\n\n# MS-DOS Diskettes (page 222)\n\nA number of Linux commands\
    \ are similar to the MS-DOS “standards” for dealing with DOS diskettes. (Note:\
    \ You do not need to mount the diskettes)\nThe following is a list of commands\
    \ similar to standard MS-DOS commands:\n\n| LINUX | MS-DOS |\n| --- | --- |\n\
    | mattrib | ATTRIB |\n| mcd | CD |\n| mcheck | CHDSK / SCANDISK |\n| mcopy | COPY\
    \ |\n| mdel | DEL |\n| mdeltree | DELTREE |\n| mdir | DIR |\n| mformat | FORMAT\
    \ |\n| mlabel | LABEL |\n| mmd | MD |\n| mmove | RENAME |\n| mrd | RD |\n| mren\
    \ | RENAME |\n| mtype | TYPE |\n\n# EOL Problems (page 224)\n\nMS-DOS uses <carriage\
    \ return><line-feed> for the end-of-line indicator. Linux uses <line-feed>. Transferring\
    \ a file from MS-DOS to Linux can result in text files having a ^M (carriage return)\
    \ at the end of each line.\n\n# Converting a DOS File to Linux Format (page 225)\n\
    \nUse the following command to convert the input file named in_file into a Linux\
    \ file named out_file:\n\n```\n[user@pc user]$ tr --delete '\\r' <in_file><out_file>\n\
    ```\n\n# Converting a Linux File to DOS Format (page 225)\n\nUse the following\
    \ command to add the <carriage return> characters to the file, which creates a\
    \ DOS format:\n\n```\n[user@pc user]$ sed -e 's/\n/\r\n' <in_file><out_file>\n\
    ```\n\n342 DISCOVERY CENTER"
