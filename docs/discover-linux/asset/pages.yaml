  md: '# CHAPTER SIXTEEN

    CUSTOMIZING

    THE X WINDOW SYSTEM


    IN THIS CHAPTER YOU LEARN THESE KEY SKILLS


    +   - UNDERSTANDING ADVANCED FREE86 CONFIGURATION PAGE 306

    - UNDERSTANDING THE X WINDOW INITIALIZATION PROCESS PAGE 309

    - LEARNING ABOUT THE WINDOW MANAGERS THAT COME WITH LINUX PAGE 311

    - PERFORMING COMMON CONFIGURATION TASKS PAGE 313

    - PERFORMING SIMPLE DESKTOP CONFIGURATION PAGE 315


    The X Window System contains a large number of customizable options. By setting
    these options, you can get your desktop to look almost any way you desire. You
    have many options when it comes to the look and operation of your X Window System,
    including how the screen looks, how the focus operates, and other options.

    Free86 is a version of the X Window System designed for 80x86-class machines.
    Because of the wide variety of hardware available for these machines, configuring
    this system can be quite complex. Linux does attempt to simplify it for you. Still,
    strange hardware can be difficult to get running.


    ![](img/d86aa78922e215fd387e0c1556445cac_334_0.png)'
