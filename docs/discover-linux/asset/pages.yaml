  md: '# # Deciding What Software You Need to Install


    Red Hat Linux comes with 460 separate software packages, and Appendix contains
    a short description of each package. Linux has something for everyone.


    Don''t let the large number of packages scare you off. Red Hat has been nice enough
    to sort them into 24 different groups. You can select groups you want during the
    initial installation. If you don''t like Red Hat''s grouping, you can install
    individual packages. Finally, you can install additional packages after you get
    Linux running.


    Before beginning the installation process, decide which software packages you
    will be using. That way, you don''t have to manically flip through this book to
    figure out what to install.


    The following sections in this chapter describe the software groups; Appendix
    B contains a full list of the packages that make up each group. Please note that
    not all software packages are in a group. In words, you must install some of them
    individually. It is easiest to install these software packages, however, after
    you get Linux up and running.


    # ## C Development


    This group includes the C compiler, debugger, and other utilities you need to
    compile C programs. Unfortunately, it includes the more advanced lexical analyzer
    generators and parser generators, which are only of use to people developing computer
    languages.


    # ## Development Libraries


    This package contains libraries that can be statically linked, debugged, and pro-filed.
    It also includes most of the C language development tools. Installing this package
    is strongly recommended if you are doing any C or C++ programming.


    # ## C++ Development


    The C++ Development package includes the C++ compiler, debugger, and utilities.
    This package is really an add-on to the C Development software group.


    # ## Print Server


    Here you have utilities that enable you to print locally and across a network.
    If you plan to print from Linux, select this package.'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# Printer Support


    This group has the files required to perform printing locally only. You need this
    package only if you are going to connect a printer directly to your computer.


    # News Server


    This software group contains a single package, the INN (Internet News Server).
    If your system is to be a news host, you need this package. If you don''t know
    a news host, don''t install this software group.


    # NFS Server


    Network File System (NFS) is the standard UNIX network file system. Install this
    software group if you want to create a server for a UNIX or Linux network. (The
    NFS client software is built into the kernel).


    # Networked Workstation


    If your machine will be a network client, select this package. It contains the
    packages for doing the kinds of things that clients do, such as remote printing,
    reading network news, and network configuration. This package also contains a
    very simple World Wide Web (WWW, or Web) browser.


    # LAN Manager Connectivity


    This package contains tools and utilities to service a TCP/IP and SMB (Microsoft
    Windows) network.


    # Anonymous FTP/Gopher Server


    Anonymous ftp enables anyone on the network to download selected files from your
    system without having an account on your system. Gopher is a document server that
    enables other people to access selected documents on your system. This software
    group also contains a number of network client utilities, such as ftp and news
    readers. This software group is of only limited use to most users.


    # Web Server


    Apache is the most popular Web server around. It''s free, and it''s included in
    this software group along with the utilities most needed by Webmasters. If you
    are setting up a Web site, this is the software group you want.'
  merge: -1
  pgno: 49
- img_proc: true
  md: '# Network Management Workstation


    This software group is useful to people who have a large number of networked systems
    that they need to administer remotely.


    # Dialup Workstation


    If you are connecting to the Internet or any other computer by means of a phone,
    this software group contains all the utilities you will need.


    # Game Machine


    This group includes everything you need in order to waste time and have fun. It
    does not include, however, the games that require the X Window System. Although
    these games are nice, the X Window ones are better.


    # Multimedia Machine


    This is a collection of utilities for playing sound and displaying animation on
    your screen.


    # X Window System


    This group is the standard UNIX windowing system. You need this package if you
    plan to use any of the GUI-based utilities.


    # X Development


    Here you can find all the libraries and utilities you need to program the X Window
    System.


    # X Multimedia Support


    This group provides additional multimedia tools that work in the X Window System.


    # Java Development


    The Java Development Kit and a number of other related tools are contained in
    this group.


    # TeX Document Formatting


    TeX is a text-formatting program. Many of the GNU documents are written in TeX.
    If you want to print them, you need this software group.'
  merge: -1
