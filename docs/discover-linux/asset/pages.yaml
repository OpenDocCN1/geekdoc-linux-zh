    # Sending and Receiving Faxes


    The fax command sends and receives faxes. You must configure the command before
    you can use it, you by editing the command itself and making the indicated changes.
    (It''s pretty straightforward.)

    Here are the changes you need to make:


    First, change the following line to the phone number you are calling from:


    ```

    FROM="+0 000 000 0000"

    ```


    Next, edit the following line to the name of the sender (don''t forget to include
    the double quotes):


    ```

    NAME="from a Red Hat Linux system"

    ```


    Then, if you want ordinary users to execute this program, you must execute this
    command:


    ```

    [root@pc root]# chmod +1000 /var/lock

    ```


    You also have to let everyone read and write the modem by issuing the following
    command:


    ```

    [root@pc root]# chmod 666 /dev/modem

    ```


    The fax command can send both PostScript and text files. To send a fax, use the
    following command:


    ```

    [user@pc]$ fax send <phone> <file>

    ```


    Here, phone is the phone number of the remote fax, and file is the file to be
    sent.


    To send the datasheet.txt, for example, use the command as follows:


    ```

    [user@pc]$ fax send 555-1234 datasheet.txt

    datasheet.txt is text...

    /usr/bin/fax: Mon Jun 23 18:33:19 1997 fax v 0.8a Copyright 1996

    efax: 33:19 opened /dev/modem

    efax: 33:22 dialing T555-1234

    efax: 33:39 connected

    efax: 33:51 session 1961pi 7200bps 8.5"/215mm/A4 11"/1D

    10ms

    ```'
