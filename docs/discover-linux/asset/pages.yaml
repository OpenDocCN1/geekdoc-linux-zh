    The Linux package comes with a number of tools for the office, such as e-mail
    programs and programs to handle ordinary office tasks (such as fax-ing and scheduling
    appointments). This chapter discusses some of the office applications that come
    with Linux.


    # Using Mailers


    The UNIX e-mail system was originally designed to send text only. After all, when
    e-mail was invented, it was very expensive to generate graphics and sound. And
    if you wanted to e-mail them, forget itnThe programs that transported mail were
    created on the assumption that they were dealing with 7-bit characters. This assumption
    prevented them from handling binary data and foreign character sets.'
  merge: -1
  pgno: 214
- img_proc: true
  md: 'As time went on, people had an increasing need to find some way to send binary
    files. In order to get past the 7-bit barrier, they had to encode data into 7-bit
    ASCII. The first common encoding program was called `uencode`. In fact, `uencode`
    is still commonly used.


    `uencode` is not the only game in town, however; a newer method has taken the
    place of `uencode`. This method called MIME encoding, and it was designed to handle
    binary files, as well as other formats. Several Linux programs, such as `elm`,
    are MIME aware (that is, can handle MIME attachments). The older ones, such as
    the `mail` command, are not MIME aware.


    # The mail Command


    The `mail` command is an older, basic mail program. It can read and send simple
    e-mail messages without attachments. Attachments are other files, such as sound
    and graphics files, that are included in the mail message.


    # The pine Mailer


    The pine program is a menu-driven mailer (see Figure 9-1). It is fairly simple
    to use, and it can handle MIME attachments. The fact that it''s a full-screen
    program makes it easy to use. It''s a full-featured program, and it can handle
    even advanced mail formats. All in all, pine is a good mailer for novices.


    # The Program''s Too Clever


    I used to teach UNIX programming at a local college. One of the classes I taught
    about using the Internet to get a job. The assignment that week was to send me
    a resume through e-mail.


    Now, I used the old-fashioned `mail` command. My class, however, was using an
    advanced mailer called `pine`. About 80 percent of the resumes I received contained
    MIME-encoded attachments, which I couldn''t read.


    Over the next six weeks, both the class and I tried to convince pine to send resumes
    as text, with limited success. New features are great, but there''s got no way
    of turning them off. Sometimes, software can be too clever.'
  merge: -1
  pgno: 215
- img_proc: true
  md: '![](img/d86aa78922e215fd387e0c1556445cac_216_0.png)


    Figure 9-1 Using pine


    # # The elm Mailer


    The elm mailer is another menu-driven mailer, as shown in Figure 9-2. This mail
    provides a little less hand-holding than pine but provides the user with a fairly
    easily-to-use interface. It does not understand MIME attachments.


    ![](img/d86aa78922e215fd387e0c1556445cac_216_1.png)


    Figure 9-2 Using elm


    # # The mh and xmh Programs


    The xmh program is a front end to the mh commands. These commands provide a variety
    of mail services, but before you can use them you need to put /usr/bin/mh in your
    path. You can put it there by editing the file .bash_profile (or whatever file
    your shell uses for initialization) to add the following line:


    ```

    PATH=$PATH:$HOME/bin:/usr/bin/mh

    ```'
