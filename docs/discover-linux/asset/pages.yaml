    Click the image with the **right** mouse button to bring up the *xv* control panel,
    as shown in Figure 12-2.


    ![](img/d86aa78922e215fd387e0c1556445cac_261_1.png)


    **Figure 12-2** The *xv control panel*


    Click the Next button moves to the next image in the list. Clicking the Prev button
    moves to the previous image. Clicking the Load button loads a new image, and clicking
    the Delete button deletes the image being displayed.


    Clicking the Save button not only saves the file, but does conversions as well.
    You can load an image in GIF format, for example, and save it in San Raster format.
    The *xv* program does the conversion for you. Figure 12-3 shows the Save menu.'
