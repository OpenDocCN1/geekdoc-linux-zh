- img_proc: true
  md: 'A firewall is a system designed to protect a group of machines from the outside
    world (particularly the Internet). The firewall serves two functions. First, it
    acts as a gatekeeper to keep bad messages from coming in. Second, if an attack
    penetrates the firewall, the company can raise the drawbridge and cut itself off
    from the Internet by killing this machine.


    If you plan to use Linux as a firewall or router, answer Yes.


    Network aliasing (CONFIG_NET_ALIAS) [Y/n/?] n


    This option enables you to configure a network device so it responds to multiple
    addresses. This capability is useful if you want to configure a Web server that
    responds to many different system names. In other words, you can have one machine
    respond to a set of addresses (www.sell_it.com, www.buy_it.com, and so on). If
    you''re not being a very clever Webmaster, answer this question.


    TCP/IP networking (CONFIG_INET) [Y/n/?] y


    If you are doing any sort of networking that connects your computer to another
    computer, you want to enable TCP/IP. This includes not only Ethernet, but PPP
    and dial-up networking as well.


    IP: forwarding/gateway (CONFIG_IP_FORWARD) [Y/n/?] n


    If you are using a system as a router (a system that switches messages between
    networks), you want to answer Yes. If you''re not doing so or you don''t know
    what a router is, answer No.


    IP: multicasting (CONFIG_IP_MULTICAST) [Y/n/?] n


    If you are using your system as a router, answer Yes; otherwise, No.


    IP: accounting (CONFIG_IP_ACCT) [Y/n/?] n


    IP accounting is useful if you are an Internet service provider (ISP) and want
    to charge people for every packet they send or receive. (Some providers do that
    for usage goes above a certain level.) Normally, you don''t want to be so, answer
    No.


    Linux contains a great number of network options to get around other people''
    bugs. For the most part, it''s safe to use the default values for the following
    options.


    +   * (it is safe to leave these untouched)


    +   * IP: PC/TCP compatibility mode (CONFIG_INET_PCTCP) [N/y/?] n

    * IP: Reverse ARP (CONFIG_INET_RARP) [M/n/y/?] n

    * IP: Disable Path MTU Discovery (normally enabled)

    * CONFIG_NO_PATH_MTU_DISCOVERY [Y/n/?] n

    * IP: Drop source routed frames (CONFIG_IP_NOS) [Y/n/?] y


    ![](img/d86aa78922e215fd387e0c1556445cac_318_0.png)'
  merge: -1
  pgno: 318
- img_proc: true
  md: 'IP: Allow large windows (not recommended if <16MB of memory)

    (CONFIG_SKB_LARGE) [Y/n/?] y


    These control some of the more esoteric networking options. Use the defaults for
    the most part. The PC/TCP option controls whether or not Linux works around a
    bug in a product named PC/TCP.


    Reverse ARP (Reverse Address Resolution Protocol) is a technique in a system that
    doesn''t know its IP address can ask someone to supply it. It''s normally used
    only for diskless clients.


    MTU stands for Maximum Transfer Unit. Normally, Linux sends out big packets. If
    the receiver can''t handle them, it tries cutting down the packet size until works.
    Some software, like DOS NCSA Telnet, cannot handle this. (It''s a bug, folks.)
    Don''t disable this option unless you''re dealing with these strange problems.


    The Drop Routed Frames question concern a special option of the IP protocol called
    source routing. Normally, this feature isn''t used. Enabling it can easily open
    up your network to hackers, so ordinarily, source-routed frames are dropped.


    A "window" in network terms is the amount of data sent before the other acknowledges
    receipt of the first byte. The larger the window, the more data that can be in
    transit at once. Normally, this capability is enabled unless memory is tight.


    +   *


    +   *


    +   *


    +   The IPX protocol (CONFIG_IPX) [M/n/y/?] n

    Appletalk DDP (CONFIG_ATALK) [M/n/y/?] n

    Amateur Radio AX.25 Level 2 (CONFIG_AX25) [N/y/?] n

    Kernel/User link driver (CONFIG_NETLINK) [N/y/?] n


    Unlike most, Linux can handle multiple protocols. The most popular is TCP/IP.
    Some of the more obscure ones are IPX (used by NetWorkworks), DDP (AppleTalk),
    and AX.25 (packet radio).


    The "network link" is an experimental driver that enable communication between
    the kernel and some specialized processes. Unless you are playing around with
    the driver, this module is not useful to you.


    The next section config SCSI support. You not only choose which SCSI controller
    to use (if any), but what devices you expect to connect to the SCSI interface.


    +   *


    +   * SCSI support


    +   *


    SCSI support (CONFIG_SCSI) [Y/m/n/?] y


    If you have a SCSI controller, you need the driver.'
