  md: '# CHAPTER 15


    # Building a New Kernel (page 281)


    To configure a new kernel, issue the following commands:


    ```

    [root@pc root]# cd /usr/src/linux

    [root@pc linux]# make xconfig

    ```


    Now fill out the forms. To compile your new kernel, issue the following commands:


    ```

    [root@pc linux]# make clean

    [root@pc linux]# make dep

    [root@pc linux]# make

    ```


    And, if you have any modules, give the following commands:


    ```

    [root@pc linux]# make modules

    [root@pc linux]# make modules_install

    ```


    # Creating a Bootable Floppy (page 300)


    To create a bootable diskette, give the following commands:


    ```

    [root@pc linux]# make zdisk

    [root@pc linux]# /usr/sbin/rdev -R /dev/fd0 1

    [root@pc linux]# /usr/sbin/rdev -s /dev/fd0 <partition>

    ```


    Here, <partition> is the name of your root partition.


    # Creating a Test Kernel on Disk (page 301)


    To create a test kernel on disk, use the following commands:


    ```

    [root@pc linux]# cd /boot

    [root@pc boot]# cp vmlinuz vmlinuz.ok

    [root@pc linux]# cd /usr/src/linux

    [root@pc linux]# make zImage

    [root@pc linux]# cd arch/i386/boot

    [root@pc boot]# cp zImage /boot/vmlinuz.ok

    ```


    Now edit the /etc/lilo.conf file so that it looks something like this:


    ```

    boot=/dev/fd0

    map=/boot/map

    install=/boot/boot.b

    prompt

    timeout=50

    ```


    DISCOVERY CENTER'
