- img_proc: true
  md: '# Printing Man Pages as Text


    If you want to print the man pages on a text printer, use the following command:


    ```

    `[user@pc user]$ man command | ul -tlp | lpr`

    ```


    The man command formats the manual page. The ul -tlp command turns the underline
    and bold formatting codes into something a line printer can understand, and the
    lpr command prints the results to the line printer named lpr.


    The output of this command is pretty lame. It uses the ugly, monospaced Courier
    fonts, and the page breaks are never right.


    # Printing Man Pages as PostScript


    To turn man pages into PostScript, you need to first find the original man page.
    The man pages are installed in the following directories:


    +   * /usr/man/man<>

    * /usr/man/X11/man<>


    In these directories, <> is the section number. For example, you can find the
    man page for lpr in /usr/man/man1/lpr.1. To print this, use the following command:


    ```

    `[user@pc user]$ groff -man /usr/man/man1/lpr.1 | lpr`

    ```


    The groff command formats the text in the lpr.1 file. The man switch switches
    groff what macro package to use. The lpr command sends the output to a printer
    capable of printing PostScript.


    # GNU "info" Pages


    The Free Software Foundation (the GNU people) distribute their online documentation
    in info format. To use it, merely use the following command:


    ```

    `[user@pc user]$ info`

    ```


    This command brings up a hypertext-like interface. You can page down by using
    the spacebar. The Tab key moves the cursor to the next hypertext link. These links
    are not highlighted, they may be difficult to spot. Pressing Enter when the cursor
    is positioned on a link jumps to the node pointed to by the link.


    The interface includes a large number of commands for moving around. To get a
    complete list of commands, press Ctrl+H.'
  merge: -1
  pgno: 92
- img_proc: true
  md: 'The information is installed in the directory /usr/info. The files end with
    the extension .info or .info.gz. You can go directly to an information file by
    using the following command:


    ```

    [user@pc user]$ info subject

    ```


    If you want to view an info file located in another directory, you must specify
    the file using the -f option. To view the Linux SGML guide, for example, enter
    this command:


    ```

    [user@pc user]$ info -f /usr/doc/linuxdoc-sgml1-1.5-6/guide.info

    ```


    # # PostScript Files


    The .ps extension generally indicates a PostScript file. You can print these files
    by using the lpr command, as follows:


    ```

    [user@pc user]$ lpr /usr/doc/lilo-0.19-1/doc/User_Guide

    ```


    > NOTE If you don''t have a PostScript printer, don''t worry. Linux uses a program
    called GhostScript to automatically convert the files so they can be printed on
    your printer.


    You can view PostScript files directly on an X Window display using the gv command
    (see Figure 4-2). This command is a front end to GhostScript that makes viewing
    PostScript easy. It takes only one argument, the name of the PostScript file,
    as shown in the following example:


    ```

    [user@pc user]$ gv /usr/doc/lilo-0.19-1/doc/User_Guide

    ```


    The PgUp and PgDn keys enable you to page through the document. You can also use
    the menus to perform a wide variety of functions.'
