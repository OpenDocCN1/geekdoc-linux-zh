  md: '# Making the Linux Diskettes


    You need two diskettes for your client installation. The first diskette contains
    a copy of the operating system, and the second contains an initial file system
    that''s read into memory during the installation process.


    Use the MS-DOS utility REWRITE to copy the diskette images from the CD-ROM to
    the diskettes.


    To create the installation diskettes, follow these steps:


    +   1. Go to the directory containing the MS-DOS utilities. (This example uses
    drive F and the DOSUTIL directory as in the following command line. Substitute
    the correct drive and directory if yours differs.) At the DOS prompt, change to
    drive F or whatever drive contains your CD-ROM.


    ```

    F:\> CD \DOSUTILS

    ```


    +   2. Put a 3.5-inch diskette in drive A.


    +   3. Create the boot diskette, as follows:


    ```

    F:\DOSUTILS > REWRITE

    Enter disk image source file name: \IMAGES\BOOT.IMG

    ter target diskette drive: A

    Please insert a formatted diskette into drive A: and press

    -ENTER- :

    The copying takes about 30 seconds.

    ```


    +   4. When you get the MS-DOS prompt, remove the diskette, write-protect it,
    and label it "Red Hat 4.2 BOOT."


    +   5. Put a 3.5-inch diskette in drive A.


    +   6. Create the supplemental diskette as follows:


    ```

    F:\>DOSUTILS > REWRITE

    Enter disk image source file name: \IMAGES\SUPP.IMG

    Enter target diskette drive: A

    Please insert a formatted diskette into drive A: and press

    -ENTER- :

    The copying takes about 30 seconds.

    ```


    +   7. When you get the MS-DOS prompt, remove the diskette, write-protect it,
    and label it "Red Hat 4.2 SUPP."


    ![](img/d86aa78922e215fd387e0c1556445cac_72_0.png)'
