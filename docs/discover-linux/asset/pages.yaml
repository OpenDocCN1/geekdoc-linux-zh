  md: '# Window Managers


    linux comes with four different window managers. These are the following:


    +   - fwm2-95 Free Window Manager Version 2. This window manager is reminiscent
    of Windows 95 (see Figure 16-2).

    - fvwm Free Window Manager. This simple window manager is designed to look somewhat
    like the popular Motif window manager (see Figure 16-3).

    - twm Trivial Window Manager. This window manager is older and simpler and does
    not have virtual screen capabilities (see Figure 16-4).

    - olwm, olvwm Open Look Window Manager. This is a windowing system designed by
    Sun Microsystems to compete with Motif. (It didn’t sell, but some people still
    use this window manager.) Figure 16-5 shows what it looks like.


    ![](img/d86aa78922e215fd387e0c1556445cac_340_0.png)


    Figure 16-2 The fvwm-95 window manager'
