  md: 'Advantage:

    Supports the most formats and manipulations of any of the image-processing packages.

    Disadvantages:

    No interactive mode.

    Lots of commands.


    # Drawing Programs


    Not only does Linux include programs to view and manipulate images, but you can
    also create them. These drawing programs enable you to quickly sketch and design
    simple to moderately complex graphics.


    # xfig Program


    The xfig program, which is a part of Linux and is included on the CD-ROM in the
    back of this book, provides the user with an interactive drawing tool, as shown
    in Figure 12-7.


    ![](img/d86aa78922e215fd387e0c1556445cac_276_0.png)


    Figure 12-7 The xfig program interface'
  merge: -1
  pgno: 276
- img_proc: true
  md: 'At the top of the window are the file controls. You use these controls to load,
    save, convert, and perform other file operations.


    Along the left side are the drawing controls. In the top section, you select which
    object to draw. The lower section contains a set of editing tools.


    The bottom of the window contains a set of miscellaneous controls. The xfig program
    can export files to a variety of popular image formats. The xfig program deals
    with the images in the window as objects. Other programs, such as xpaint, treat
    their data as single bitmaps.


    # The xpaint Program


    The xpaint program is another drawing tool. A major difference is that, where
    xfig deals with objects, xpaint is a straight raster painter.


    The advantage of the xpaint program is that after objects are drawn, you can move,
    resize, cut, and paste them as objects. With a raster painter such as xfig, after
    you draw an object, it''s turned into a bitmap. Individual objects can be selected.


    The main xpaint window is shown in Figure 12-8.


    ![](img/d86aa78922e215fd387e0c1556445cac_277_0.png)


    Figure 12-8 The main window of the xpaint program


    # Miscellaneous Graphics Tools


    The mxp program generates Mandelbrot sets. Mandelbrot sets are mathematically
    interesting, pretty pictures. The controls are pretty much self-explanatory. Figure
    12-9 shows the mxp program.'
  merge: -1
