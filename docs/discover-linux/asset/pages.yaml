  md: '# # Quick Start


    This chapter summarizes how to install or upgrade Red Hat Linux/Intel. It is intended
    for users who are already experienced in installing Linux. If this chapter does
    not provide enough information, please read Chapter 2, Installing Red Hat Linux.


    # ## 1.1 The Red Hat Linux Errata


    # ## 1.2 Getting Red Hat Linux


    # ## 1.3 Making Floppies


    # ## 1.5 Upgrading from a Prior Version


    # ## 1.6 Why Can''t I Run Directly off the CD?


    ![](img/d86aa78922e215fd387e0c1556445cac_96_0.png)


    **Figure 4-4** Using Netscape Navigator to view an HTML file


    # # TeX and .dvi Files


    TeX is a typesetting language created by Donald E. Knuth. It has been a favorite
    language for Free Software Foundation devotees. In fact, the Free Software Foundation
    has adopted it as its standard typesetting language. Normally, TeX takes a single
    .tex file as input and produces a device-independent typeset (with the .dvi extension).
    For example, the following command produces the file paper.dvi:


    ```

    [user@pc user]$ tex paper.tex

    ```'
  merge: -1
  pgno: 96
- img_proc: true
  md: 'Sometimes you have to run tex twice, especially when producing a table of contents.
    The first run sets up the page numbers, the second typesets the document.


    Some documentation is distributed as .dvi files as well as .tex files. You can
    view the .dvi files using the divype command, as follows:


    ```

    [user@pc user]$ dvype paper.dvi

    ```


    The output looks a bit ugly. A better view is afforded by the xdvi command, which
    runs under Window. It uses the following syntax:


    ```

    [user@pc user]$ xdvi paper.dvi

    ```


    Finally, you can turn the .dvi file into PostScript using the dvips command, as
    shown here:


    ```

    [user@pc user]$ dvips -D600 -t letter -o paper.ps paper.dvi

    ```


    In this command, the -D600 tells dvips to typeset the output for 600 dpi printer.
    The -t letter option selects-size paper. The output is selected with the -o paper.ps
    option. The input follows: paper.dvi. You can then print or view the PostScript
    file by the commands just discussed.


    # Texinfo


    The GNU people distribute the majority of their documentation in "texinfo" format.
    These files end with the extension .texi. You can typeset these files by TeX or
    turn them into .info files using the command makeinfo.


    The makeinfo command turns .texi files into .info files. Normally, you won''t
    have to run this command, because all the online documentation has already been
    processed. If you need to create an .info file, however, simply use the following
    command:


    ```

    [user@pc user]$ makeinfo filename

    ```


    To typeset a .texi file, you need the macro package texinfo.tex. This file must
    be in the same directory as your texinfo file. After you have this file, you can
    typeset the file using the normal Tex command.


    # Red Hat Packages


    One of the greatest strengths of the Red Hat distribution is its packaging system.
    As you recall, a package is a group of files installed or removed as a group.
    The Red Hat package system provides a rich set of'
  merge: -1
