- img_proc: true
  md: 'Now you can get the file agenda.txt off the tape. Suppose that you want to
    get the file letters.txt? It is stored on the second tape file, so you need to
    get the tape into position with the file-space-forward (fsf) command to move forward
    a single file, as follows:


    ```

    ``` [user@pc user]$ mt -f /dev/ntape fsf 1

    ```


    Now you can use the tar command to get the file letters.txt by giving the following
    command:


    ```

    ``` [user@pc user]$ tar xf /dev/ntape

    ```


    # # The Idiosyncrasies of Tape Drives


    Unfortunately, not all tape drives act the same. Each particular drive has its
    set of limitations and features. Many the older drives, for example, can handle
    only fixed-size blocks, in sizes of 512 or 1024 bytes. That means when you write
    a block with a physical record size of 10K, you actually write 20 records of 512
    bytes each. This is important to remember when doing block-positioning commands.


    Some drives have fixed records and variable record sizes. You need to use a special
    command to switch between the two. The Linux mt command will do this for you.


    # ## How Not to Move One File Forward


    Suppose that a user issues the following command, expecting it to move the tape
    forward one file:


    ```

    ``` [user@pc user]$ mt -f /dev/ftape fsf 1

    ```


    It doesn''t work. Why not?

    The problem is the use of the rewinding device. The mt command opens the tape,
    spaces forward one file, and then closes the tape. The rewind device is used,
    so the tape is immediately rewound, totally nullifying the file-space-forward.


    The proper command is as follows:


    ```

    ``` [user@pc user]$ mt -f /dev/ntape fsf 1

    ```


    ![](img/d86aa78922e215fd387e0c1556445cac_126_0.png)'
  merge: -1
  pgno: 126
- img_proc: true
  md: 'In addition, some old drives do not support backspacing. The lack of this capability
    prevents the driver from pulling the “write two EOFs and backspace over one” trick
    that’s used for creating an EOM mark. Not being able to use this trick prevents
    you from spacing to EOM.


    The later drives have a new feature called a session mark. It''s almost the same
    as an EOF marker, but it uses a different type of mark. This different mark means
    you can mix session marks and EOM marks on a single tape.


    Finally, DAT drives enable you to split the tape into two partitions. You must
    specify how much data goes in the first partition. (The second partition receives
    the rest of the tape.)


    Most UNIX systems do not have any utilities that exploit these new features. The
    Linux mt command is pretty advanced and probably can take advantage of any bells
    and whistles your tape drive might. (And if it doesn’t, you have the source code
    — so enhance it!)


    # # The tar Command


    tar (tape archiver) is the most commonly used standard for copying files to and
    from magnetic tapes for transport between UNIX systems. It also makes a good backup
    tool.


    # # Backing Up Files to Tape


    Suppose that you want to back up your home directory to tape. The following shows
    a typical tar command line:


    ```

    ```user@pc user]$ tar cvf /dev/ftape .```

    ```


    Here are the elements involved in these commands:


    tar

    cvf


    This is the command.

    These are the option letters. In this case, c creates a tape, v for verbose output
    (lists files as they are written), and f indicates that the next argument is the
    name of the tape.


    /dev/ftape is the name of the device. You are partitioning only one tar file on
    this tape, so you can use the rewinding device.

    (period) The period, or dot, denotes the list of files to back up. In this case,
    use the current directory (.) and all its children.


    A more complex example follows:


    ```

    ```user@pc user]$ mt -f /dev/nftape eom

    user@pc user]$ find / \( -type f -type l \) -print0 | \

    t--create verbose --file /dev/null -files-from - \```

    ```'
  merge: -1
  pgno: 127
- img_proc: true
  md: 'This command appends to the tape copy of all the files and symbolic links on
    the root disk. A large blocking factor is used for efficiency. The blocking factor
    controls the size of the physical writes to the tape. In this case, the size of
    a physical record is 65536 bytes (128 * 512).


    ```

    [user@pc user]$ mt -f /dev/nftape eom

    ```


    The next command is actually two commands that are used to do the copy:


    ```

    [user@pc user]$ find / \(-type f -o \type l \)-print0 |\nt--create --verbose --file
    /dev/null --files-from - \

    null --block-size 128

    ```


    The first command, locates the files to be copied. It passes this list to tar,
    which does the actual work.


    The parts of the find command are the following:


    +   find This is the command.

    / This is the top directory for the search. In this case, you start with the root
    directory.

    \( The and \ parameters are used to group the file directives for find.

    -type f This parameter makes the command find all files of type f (regular file).

    -o This is the operator. This means the command will find all files that are type
    f or type l (see the following parameter).

    -type l This makes the command find all files of type l (symbolic link).

    \) parameter closes the clause for the file types.

    -print0 This parameter causes the command to print the name of the files you find,
    ending each name with a null character (\0).


    The result of this command is a series of filenames, each ending with a null character.
    This is piped into the tar command, which includes the elements:


    +   tar This is the name of the command.

    --create This creates a file (it''s the long version of the c option).

    --verbose This parameter prints the name of each file as it''s copied (it''s the
    long version of the v option).

    --file /dev/nftape This parameter specifies the file to back up to.'
  merge: -1
  pgno: 128
- img_proc: true
  md: 'example uses the non-rewinding tape time, because you may want to append to
    it later.


    --files-from This option tells tar to read a list of files from the file named—.
    In this case, the special name -- indicates the standard input. This file is actually
    the output of the find command.


    --null This parameter tells tar that the list of filenames used by the --files-from
    is null terminated.


    --block-size 128 This parameter specifies that the blocking factor is to be 128.
    This means that the physical record size is 128 * 512 bytes, or 6K.


    # Finding Out What Files Are on the Tape


    To get a table of contents of a tar tape, use the following command:


    ```

    [user@pc user]$ tar tfb /dev/ftape 20

    ```


    The parameters of this command are as follows:


    +   tfb This is the option. The t indicates table of contents, the f indicates
    that the tape device (file) follows, and the b indicates that a blocking factor
    follows.


    +   /dev/ftape This parameter is the name of the tape device (for the f option).


    +   20 This parameter is the blocking factor (for the b option).


    # Restoring Files


    To restore files, you use the tar x (extract) option. A typical command might
    be as follows:


    ```

    [user@pc user]$ tar xvf /dev/ftape lost.

    ```


    Following are the parameters:


    +   xvf These are the options to tar. They include x to extract files, v for verbose
    output, and f to indicate that the tape file


    +   /dev/ftape lost.c This parameter is the name of the tape to restore. This
    parameter is the file to restore. Several files may be listed; their names (paths)
    must match exactly the names on the tape. If no files are listed, the entire tape
    is


    restored.'
