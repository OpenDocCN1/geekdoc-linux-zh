    # mgetty and sendfax Programs


    he mgetty program is designed to watch serial ports attached to a modem. If someone
    dials in, the program runs the login program to start a terminal session. The
    program is designed for serial line sharing, so if anyone uses the serial line
    to send data (to send a fax, for example, or to start a ppp session), it stays
    out of the way.


    the mgetty program knows about fax modems and automatically detects fax calls
    and handles them correctly. This assumes that your modem detects fax calls correctly;
    do not.


    # Voice Mail


    he mgetty program has a version that works with voice modems, which is called
    vgetty. You can configure the vgetty program as a full-fledged voice mail system.


    The drawback to this software is that it is currently beta software and not fully
    debugged. What''s worse, it is almost completely undocumented. If you are going
    to attempt to use this code, you must unpack the source (as explained in Chapter
    4) and examine it to figure out what the program does.'
