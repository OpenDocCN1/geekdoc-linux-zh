  md: '# REAL LIFE LINUX: ARE YOU CRAZY? YOU WANT TO USE LINUX FOR A BUSINESS-CRITICAL
    APPLICATION?


    "re crazy? You want to use a free system for a business-critical application?
    That''s the response most programmers receive when they propose using Linux as
    the office server.


    But, surprisingly, more and more people are using Linux in their offices. The
    reason is simple: technical support. How can Linux, an unsupported product, beat
    out products such as Windows NT and Solaris-UNIX, especially in the area of support?


    The key is that Linux holds no secrets: Everything — all the source code is available
    to the programmer. If you have a problem in your routing tables, for example,
    you can examine and invent the instrument you created.


    If you have a problem in your commercial server, you must call technical support.
    That means spending long hours on the queue jockey¹ play records until you''re
    finally connected to someone.


    But even then, problems are not over. Chances are that the customer service representative
    is a poorly trained new hire. So you get to spend your time educating the customer
    service employee to the point where he or she understands the problem:


    Programmer: "I''m having a problem with my routing tables."


    Customer Service: "Uh, what''s a routing table?"


    Programmer: "It''s a kernel table that we use to decide how to route packets between
    the different network cards on the system."


    CS: "You mean that you can put more than one network card on a system. Wow!"


    Programmer: "You know what a computer is, right?"


    CS: "Oh, sure. They told us during the eight-hour training class we took for this
    job.\"


    Programmer: *Unprintable."


    Of course, the customer service person can help you, but he or she will enter
    your report into the database, and an engineer will look at it at time permits
    (Time, as you know, permits.)


    Linux''s support policy is simple: "help yourself." You''ve got the code; examine
    it, probe it, and figure out what''s going on. If you''re not a programmer, hire
    one to fix your problem. Millions of people are using Linux. A bug is found, someone
    will probably fix it and then publish the fix for the world.


    Linux has more developers working on it than working on Windows NT. Are people
    crazy to use Linux? Some might consider it not to use Linux.


    +   ¹ Queue jockey who plays records, but instead of broadcasting to a radio audience,
    the queue jockey "broadcasts" to all hundreds of people on hold waiting for technical
    support.


    ![](img/d86aa78922e215fd387e0c1556445cac_213_0.png)'
