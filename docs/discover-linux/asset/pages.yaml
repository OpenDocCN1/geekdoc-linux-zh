  md: '# Mounting MS-DOS Partitions


    You can mount MS-DOS partitions and diskettes as part of the regular Linux file
    system. All you have to do is create a directory for the mount point and add an
    entry into /etc/fstab. These operations are extensively covered in Chapter 5.


    # The EOL Problem


    Back in the dark ages BC (Before Computers), there existed a magical device called
    a Teletype Model 33. This amazing machine made out of a motor, with a rotor and
    a keyboard consisting of levers and springs. It contained a keyboard, a printer,
    and a paper tape reader/punch. Using a modem, it could transmit messages over
    the phone lines at the rate of 10 characters per second.


    The teletype had a problem: it took two-tenths of a second to move the printhead
    from right side to the left. Two-tenths of a second was the amount of time required
    to transmit two characters. If a second character came while the printhead was
    in the middle of a return, that character was lost.


    The teletype solved this problem by making the end-of-line (EOL) two characters:<carriage
    return> to position the printhead at the left margin and <linefeed> to move the
    paper up one line.


    When the early computers out, some designers realized that using two characters
    for end-of-line wasted storage (at this time, storage was very expensive). Some
    designers chose <linefeed> for their end-of-line character, and some chose <carriage
    return>. Some of the dieards stayed with the two-character sequence.


    Linux, like UNIX, uses <linefeed> for the end-of-line character. MS-DOS and Windows
    use the two characters: <carriage return><line feed.


    As you can imagine, this EOL problem can cause some difficulty when transferring
    files from DOS to Linux.


    The Red Hat version of the vi editor knows about the different end-of-line systems
    and adjusts itself accordingly.'
  merge: -1
  pgno: 253
- img_proc: true
  md: '# Converting a DOS to Linux Format


    An MS-DOS file uses<carriage return><linefeed> as its end-of-line. Linux just
    <linefeed>. To convert a DOS file to Linux format, you need to delete the <carriage
    return>. Fortunately, Linux has a command that enables you to do this.


    The following command converts the input file named in_file into a Linux file
    named out_file:


    ```

    [user@pc user]$ tr -delete ''\r'' <in_file> >out_file

    ```


    # Converting a Linux File to DOS Format


    To convert from Linux to DOS, you need to add a <carriage return> to the end of
    each line in the file. The following command converts the Linux file in_file and
    produces the DOS-format file out disk.


    ```

    [user@pc user]$ sed -e ''/s/\n/\r\n/'' <in_file> >out_file

    ```


    This command adds the <carriage return> characters to the file, creating a DOS-format
    file.


    # The DOS Emulator


    > If you really want to use DOS, the best thing to do is boot MS-DOS.


    Linux does include a DOS emulator, however, which actually provides a virtual
    8086 machine emulator that can run DOS — sort of. The software is still in its
    beta state, though, and a lot of work must be done before the program can run
    all MS-DOS programs.


    The emulator, named dosemu, provides a virtual 8086 machine. In other words, it
    appears to MS-DOS that it''s running on an 8086 machine and has complete control
    of the system. In fact, the system is actually an illusion created by the emulator.
    What''s actually happening is that the 8086 machine is constructed out of the
    cyberspace of a Linux process.


    The virtual DOS machine includes a hard disk drive. To MS-DOS, this is drive C.
    To Linux, this is the file /var/lib/dosemu/image. Before you can use the emulator,
    you need to install DOS on this disk.


    Follow these steps to initialize the MS-DOS emulator:


    +   The first step is to boot MS-DOS (the real one).'
  merge: -1
  pgno: 254
- img_proc: true
