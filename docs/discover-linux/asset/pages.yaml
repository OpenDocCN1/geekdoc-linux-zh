    # # The Automounter


    The automounter (Auto Mount Daemon or AMD) is a program that automatically mounts
    NFS disks from other systems. The default Red Hat configuration file causes the
    automounter to mount directories under the /net directory. So if you want to use
    a file on the server named sabina, all you have to do is give the following command:


    ```

    [user@pc user]$ cd /net/sabina/usr/sam

    ```


    The automounter automatically mounts sabina''s file system for you. When you finish
    using this directory, the automounter will wait for a while and automatically
    unmount it.


    Again, like most of the tools presented in this chapter, this one comes with great
    many options that you can configure. A full discussion of these tools, however,
    is well beyond the scope of this book.


    # # NIS


    Network Information System (NIS) is a set of programs designed to distribute over
    a network some of the information found in configuration files. The NIS server
    maintains databases of the information found in the files /etc/hosts, /etc/password
    and /etc/groups, and other configuration found in /etc. NIS clients use the databases.


    A slave server is a type of system that''s halfway between a client and a server.
    These systems get their data from the master server but have the capability to
    store it and act as servers when needed. The idea is that when a master server
    goes down or gets very busy, the slave server can step in and provide the information
    needed. Slave servers are useful on large networks; unfortunately, a discussion
    of them is also beyond the scope of this book.


    # # Fixing NIS


    The NIS client package distributed with this version of Linux (version 4.2) is
    broken and does not operate at all. To fix it, you have to build the program ybind
    from the sources and install it by hand.


    To fix the client software, follow these steps:


    +   1. Make sure that the Linux CD-ROM is installed as /mnt/cdrom.


