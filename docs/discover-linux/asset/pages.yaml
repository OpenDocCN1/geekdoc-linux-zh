    +   3. Remove the diskette, boot Linux.


    +   4. Put the diskette in the drive, and log in as root.


    +   5. Start the emulator by issuing the following command:


    ```

    [root@pc root]# dos -A

    ```


    +   6. Copy the system from drive A to drive C by issuing the following

    command:


    ```

    A: > SYS A:

    ```


    +   7. Get out of the emulator with this command:


    ```

    A: > C:\EXITEMU

    ```


    # Configuring DOSEMU


    The file /etc/dosemu.conf contains a number of configuration parameters for

    this program. In addition, you should create the file /etc/dosemu.users. This

    file contains a list of the users allowed to run the emulator. Not only do you
    need

    add users to the /etc/dosemu.users file, but you also have to give them write

    access to the /var/lib/dosemu/hdiimage.


    The emulator enables you to map your Linux file system by using the emu-

    l command redir. If you want to mount the /home directories on drive D,

    for example, you start DOS and execute the following command:


    ```

    C:> redir d: linuxfs\Home

    ```


    # Limitations of the Linux DOS Emulator


    The DOS emulator is far from complete: many MS-DOS programs do not work.

    The current version of the emulator almost runs Microsoft Windows. Getting

    every to work requires quite a bit of labor and extensive tuning of your

    /etc/dosemu.conf file.


    Again, if you really want something that runs all DOS programs, use DOS.

    The emulator is good, but the developers still have a lot of work to do.'
