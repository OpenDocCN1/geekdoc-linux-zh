  md: '# For the “official” list of currently supported hardware, see the following
    Web page:


    ```

    http://sunsite.unc.edu/LDP/HOWTO/Hardware-HOWTO.html

    ```


    Only recently has support for laptops added to Linux. It used to be that Linux
    was unaware of the advanced power management system found in most laptops. As
    a result, users experienced problems, such as the laptop going to sleep and losing
    its clock.


    Fortunately for us, however, these problems have been solved by the growing community
    of Linux users who want to run Linux on their laptop computers.


    You can find information about specific laptops, as well as configuration information,
    on the Linux laptop home page at the following Web address:


    ```

    http://www.cs.texas.edu/users/kharker/linux-laptop/

    ```


    One question that burns in every laptop user’s mind is: “How much time do I have
    left before my battery goes down?” You can find tools to monitor battery life
    at the following Web address:


    ```

    ftp://sunsite.unc.edu/pub/Linux/system/power/%21INDEX.html

    ```


    As to which laptops have the best battery life, check the Linux laptop survey
    at this Web address:


    ```

    ftp://tsx-11.mit.edu/pub/linux/packages/laptops/laptop-survey

    ```


    # Summary


    if you decide to use Linux on your computer, you shouldn''t just jump in first
    and load it up. Rather, preparing for installation is an all-important step that
    you leave out at your own — and your computer’s — peril.


