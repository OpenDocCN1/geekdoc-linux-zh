    Watchdog Timer Support (CONFIG_WATCHDOG) [N/y/] n


    If your system absolutely, positively must run, you need a watchdog timer. What
    is it? It''s a device that must be written to at least a minute after you open
    it. Failure to do so while the timer is running resets your computer. If your
    program crashes and fails to tick the device, the computer resets. Hopefully,
    you''ve configured the startup scripts to restart the program and keep things
    running.


    This device is very useful for applications that run all the time.'
