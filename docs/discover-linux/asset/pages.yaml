  md: '# C and C++ Compilers


    Linux comes with one of the best C compilers in existence. The GNU C compiler,
    gcc, is an ideal tool for teaching programming as well as for production programming.


    One of the main things that makes gcc different is the error messages. Whereas
    other compilers issue a "syntax error" and leave it at that, gcc gives you an
    error message that is actually helpful. (The messages actually do a reasonable
    job of pointing you to the error)


    The gcc compiler also has a huge number of options. It gives you precise control
    over how your code is optimized. The compiler works on a great many different
    CPUs and has special switches for each processor.


    The GNU people have extended the C language a bit. If you actually want to use
    some of these extended features, you can get more information about them by using
    the following command:


    ```

    [pc user]$ info gcc

    ```


    # The g++ Compiler


    The GNU version of a C++ compiler is called g++. The current version (2.7.2.1)
    handles most of the C++ language as defined by the ANSI standard. The ANSI standard
    is still in a state of flux


    # The C++ Standard Template Library


    The Standard Template Library (STL) defines a full set of containers for the C++
    language. The C++ library that comes with Linux, called libg++, contains a complete
    implementation of the STL.


    The STL has its limitations, however. First of all, it is inflexible. Second,
    it tends to compile slowly and generate lots of code. The GNU people have implemented
    a better, though not standard, set of container classes, which are described in
    the next section.


    # Containers in lib++


    The g++ library also contains a large number of other template classes. They are
    actually much better than the STL because they enable you to specify not the container,
    but how it''s implemented. You can choose an implementation of a "set" container,
    which allows for fast insertion of elements. Another implementation allows fast
    searches, but is very slow when it comes to insertion. All the set implementations
    perform the same operations, but the differentimple-'
  merge: -1
