  md: '# Emacs


    Emacs is a very popular text editor. It''s also a very big program. Emacs stands
    for Eight Megabytes And Constantly Swapping (Actually, it stands for editing macros,
    but why let the truth spoil a good joke?) Install this group only if you want
    to use this editor.(Which editor to use is the subject of a continuing religious
    war among UNIX users.)


    # Emacs with X Window


    This group includes the editor Emacs with X Window support. Again, install this
    software only if you want to use Emacs.


    # DOS/Windows Connectivity


    This software group contains tools that are useful in going back and forth between
    MS-DOS/Windows and Linux. Included in this group are tools to handle MS-DOS diskettes,
    an MS-simulator (it works), and other utilities.


    A Microsoft Windows emulator called WINE exists, but it''s not included on the
    CD-ROM that accompanies this book. WINE is currently in alpha and still needs
    a lot of work before it is generally useful.


    Don''t expect to be able to run MS-DOS/Windows programs easily using this software
    group. You''re better off running MS-DOS programs under MS-DOS. The copying tools
    are useful, but the simulators are mostly toys.


    # Extra Documentation


    This contains all sorts of documentation. This stuff is very useful for figuring
    out how to use your Linux system.


    # Suggested Software Packages


    Table 1-1 will help you select the software packages you need.


