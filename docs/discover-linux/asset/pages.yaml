  md: '# arena


    A simple HTML 3 World Wide Web browser for X windows. Don''t bother — download
    Netscape instead.


    # ash


    A sh-like command processor. It is used by the system to process commands at startup.


    # at


    Batch and timed command processors.


    # aumix


    Terminal-based sound control and mixing program.


    # autoconf


    GNUUs autoconf tool. Useful only if you want to create tools that can be run on
    many different UNIX platforms.


    # automake


    Generates Makefiles automatically. This software is still experimental.


    # bash


    bash (Bourne Again Shell) is the GNU command processor with lots of useful features.


    # basic


    A BASIC language interpreter. Don''t install it. Programming in BASIC causes brain
    damage.


    # bc


    A text-mode calculator with a lot of unusual features.


