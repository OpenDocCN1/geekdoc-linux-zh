- img_proc: true
  md: '# Getting Ready to Connect


    Before you connect, you need the following information:


    +   * The phone number of your Internet service provider

    * Details on the login process

    * The address of the nameserver (the address of your Internet service provider''s
    system, which is used by your computer to translate host names into IP addresses)

    * The system name of the news server (the name of the system that will provide
    your system with news)

    * The name of your POP mail server (POP — post office protocol — is used for getting
    you e-mail)

    * The name of your SMTP mail server (SMTP — standard mail transport protocol —
    is the standard for sending out mail messages.)


    > Why two mail services — POP and SMTP? SMTP was designed for sending mail from
    UNIX machine to UNIX machine. These machines are expected to run sophisticated
    mail programs capable of handling mail for lots of different accounts. That doesn''t
    work when the receiving machine is a simple DOS box that barely runs anything
    at all, so POP was invented to enable a central server to store mail for multiple
    accounts, each served by a single POP client.


    Sending mail is far simpler than receiving it, however, so a single-user machine
    can easily provide the functionality for sending mail. As a result, there was
    no need to develop a single-user version of SMTP for sending.

    All this information, except the connection details (access numbers and so) should
    be provided by your Internet service provider.

    For example, my ISP gave me an “Account Configuration Sheet” with a section called
    “System Information” that contains the following information:


    Domain Name: 207.110.0.60

    Server Address:

    Secondary Domain Name Server: 207.110.0.128

    Time Server Address: 207.110.0.60

    News Server name: news.connectnet.com

    Pop Server: pop3.connectnet.com

    SMTP Server: smtp.connectnet.com'
