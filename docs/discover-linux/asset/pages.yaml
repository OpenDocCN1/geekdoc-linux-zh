  md: 'The Red Hat site has the official Red Hat distribution of Linux. This site
    contains the full Red Hat distractions, patches, errata, and other useful information.
    You can access the Red Hat site at the following addresses:


    ```

    ftp site: ftp.redhat.com

    Web page: www.redhat.com

    ```


    Caldera markets commercial Linux products, including WordPerfect, Quattro Pro,
    and other office tools. Contact Caldera at the following Web address:


    ```

    www.caldera.com

    ```


    You can also reach the home page for the Linux organization, and this Web page
    serves as a gathering point for all sorts of good links to Linux information.
    You can also find online copies of the Linux Gazette here. Contact the Linux organization
    at the following Web address:


    ```

    http://www.linux.org

    ```


    Linux International is an organization promoting the use of Linux by providing
    links to many things in the Linux world. You can find Linux International at the
    following Web site:


    ```

    http://www.li.org

    ```


    The Sunsite Repository is a Linux site that has everything: all the distributions,
    all the software — everything. It also has a tremendous number of people trying
    to download from it at the same time. Reach the Sunsite Repository at the following
    Web address:


    ```

    ftp site: sunsite.unc.edu

    Web page: sunsite.unc.edu

    ```


    You can get answers to the common PPP questions in the file /usr/doc/FAQ/PPP-FAQ.txt.

    You can find a complete guide to the PPP daemon (pppd) in /usr/doc/ppp-2.2.0-3/README.linux.
    This is a pretty comprehensive guide to the care and feeding of pppd program.

    If you want a quick guide for specialized PPP activities, look'
