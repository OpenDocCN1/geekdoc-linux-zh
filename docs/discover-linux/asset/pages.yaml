  md: '# cpio (page 101)


    This is a newer tape archiver, but it is not as widely used as tar.

    The following is an example of creating an archive of all the “.c” files in your
    current directory and its children:


    ```

    [user@pc user]$ find -name "*.c" -print | \

    cpio -o >dev/ftape

    ```


    Using the following command to get a table of contents:


    ```

    [user@pc user]$ cpio -t /dev/ftape

    ```


    Following is the command to restore:


    ```

    [user@pc user]$ cpio -i /dev/ftape

    ```


    # Taper (page 102)


    This is a GUI-based backup/restore utility that uses a nonstandard for-format.
    It is very useful but will not create tapes that are interchangeable with other
    UNIX systems.


    ![](img/d86aa78922e215fd387e0c1556445cac_363_0.png)


