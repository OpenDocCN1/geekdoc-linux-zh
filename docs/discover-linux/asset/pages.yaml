  md: '# Creating a chat Script


    The next step is to produce a chat script, which is a shell script that runs the
    chat program. A good place to put this script is in /usr/local/lib/con-nect.sh.
    (In general, I put all the local tools in /usr/local//)


    The utility is designed to get you connected. After that, the PPP program takes
    over and runs things. The chat program is fairly simple: each pair of arguments
    consists of expected strings and a response. The general form of the command is
    as follows:


    ```

    chat [options]expect1 response1 expect2 response ****

    ```


    The options are discussed later. The program starts by reading the standard input
    until it sees expect1. It then sends response and goes back to wait mode until
    it sees expect2. This continues until the command runs out of arguments or times.


    chat has a number of options. The -v option tells chat to log verbose output to
    the syslog facility. This means that you can view the messages in /var/log/messages
    (if you use the default /etc/syslog.conf). The -t 45 option tells chat to time
    out and abort if an expected string doesn''t show up within 4 seconds.


    You are building your chat command by step. Your first step starts with the following
    command:


    ```

    chat -t 45

    ```


    The modem responds with OK. When you see this response, you dial the phone, as
    shown here:


    Next, you wait for the connection (CONNECT) and just send a return ("\


    The login prompt follows. You actually expect login: in case the modem decided
    to drop a few characters. When the remote machine asks for a login, you send your
    name (this example uses my name, qualine). The computer asks for a password, and
    you send it.'
  merge: -1
  pgno: 148
- img_proc: true
  md: 'The complete version of your /usr/local/lib/connect.sh script is the following:


    ```

    #!/bin/sh

    /usr/sbin/connect -v t 45 ATZ OK ATDT487-1690 \

    CONNECT " ogin: oualline sword: my_password

    ```


    If you have multiple users on your Linux machine, make sure that you properly
    protect this file, because it does contain a password in the clear.


    # The pppd Program


    The PPP connection is controlled by the PPP daemon, pppd. You must run this command
    as root. In order to let ordinary users run it, you need to set the set-uid protection
    on this file. (Some users may consider this approach a security hole.)


    The pppd program comes with a ton of options. Putting all these options in a file,
    with a little cyberbluege, yields the /usr/local/bin/ppp-up.sh, which is as follows:


    ```

    #!/bin/sh

    PATH=/usr/sbin/pppd connect /usr/local/lib/connect.sh \

    crts lock defaultroute \

    noipdefault passive /dev/modem 38640

    ```


    Examine this script in more detail. The first line tells Linux that you are a
    Bourne again (bash) script.


    The first thing you do in the script is reset the path. This limits the danger
    that crackers can do by pointing to only the programs you need.


    Next, you run the pppd program. The connect/usr/local/lib/connect.sh option allows
    pppd to use the script /usr/local/lib/connect.sh to establish the connection to
    the remote machine.


    The crtscts option enables hardware flow control. Standard UUCP-style locking
    is enabled by lock. (Locking prevents multiple programs from trying to use the
    modem at once. UUCP was one of the first programs to lock the modem, so everyone
    else thinks the device uses the same system).


    Your computer is connected to the Internet solely through your serial line. This
    means any stray packets should be routed to the remote system. (When the PPP connection
    option defaultroute enables this default routing.'
  merge: -1
