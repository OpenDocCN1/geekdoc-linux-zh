  pgno: 350
- img_proc: true
  md: 'But thank God Linux is not commercial software. You have the source code. To
    debug a library problem, unpack the library, using the same rpm commands you used
    with the program. You don''t need to recompile the library, because that has been
    done for you already. (If you haven''t installed the lib-devel package, you need
    to do so now.)


    You must change your Makefiles to link with the library /usr/lib/libg.a (Just
    put /usr/lib/libg.a at the end of the gcc commands that make the programs.


    Now you can use the debugger on the libraries. There''s just one more minor problem,
    however; gdb doesn''t know where the source code files for the libraries are located.
    You have to point the debugger to the source code directories, where you are doing
    using the gdb dir command.


    Suppose the files you want to look for are located in /usr/src/redhat/BUILD/libc-5.3.12/libc/stdlib
    You execute the following command:


    ```

    (gdb) dir /usr/src/redhat/BUILD/libc-5.3.12/libc/stdlib

    ```


    # Reporting Bugs


    > If you find a bug and fix it, please tell other people about it. One of the
    strengths of Linux, unlike commercial software — where 30 paid engineers work
    on bugs — is that Linux has thousands of volunteers all fixing bugs. Frequently,
    you can find the name and e-mail address of the maintainer in the documentation.


    > Finally, you can publish your fix in any of the many Linux-related newsgroups
    listed in the next section.


    # Linux Resources


    > If you can''t figure out the answer to a problem yourself, a number of resources
    are available to you.


    +   WEB PATH -> First, you can consult a variety of newsgroups:


    +   alt.linux.*

    alt.os.linux.*

    comp.os.linux.*

    linux.*'
