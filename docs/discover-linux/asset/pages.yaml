    # The Lyx Word Processor


    A number of free word processors are available. Many of these are still in the
    alpha stage. That means that they are buggy, undocumented, and fun for hackers,
    but extremely difficult for ordinary people to use.


    One exception is the Lyx word processor. This program is relatively featured and
    freely available.


    The program is not on the CD-ROM that comes with this book, but you can download
    it from the following Web address:


    ```

    ftp://ftp.redhat.com/pub/contrib/1386

    ```


    The author of this book calls the Lyx word processor WYSAWYG (What You See Is
    Almost What You Get) program. This program tries to present a user with something
    very close to what you''ll see in the finished document. It''s close, but in some
    cases, it will not be exact.


    The program contains a good set of features, as you can see in Figure 9-9. It''s
    good enough for simple word processing, such as letters, faxes, and papers for
    school. Using Lyx for larger documents, however, would be stretching it.'
