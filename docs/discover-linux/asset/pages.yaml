  md: '# Welcome to the Discover Series


    you want to discover the best and most efficient ways to use your computer and
    learn about technology? Books in the Discover series teach you the essentials
    of technology with a friendly, competent approach.


    You''ll find a Discover book on almost any subject - from the Internet to intranets,
    from Web design and programming to the business programs that make your life easier.


    We''ve provided valuable, real-world examples that help you relate to topics faster.
    Discover books begin by introducing you to the main features of programs, immediately.
    The focus is to teach you how to perform tasks that are useful and meaningful
    in your day-to-day work. You may create a document or graphic, explore your computer,
    surf the Web, or write a program. Whatever the task, you learn the most commonly
    used features, and focus on the best tips and techniques for doing your work.
    You will get results quickly, and discover the best ways to use software and technology
    in your everyday life.


    You may find the following elements and features in this book:


    +   **Discovery Center:** This peanut card is a handy quick reference to important
    tasks or ideas covered in the book.


    **Quick Tour:** The Quick Tour gets you started working with the book right away.


    **Real-Life Vignettes:** Throughout the book you will see one-page scenarios illustrating
    a real-life application of a topic covered.


    **Goals:** Each chapter opens with a list of goals you can achieve by reading
    the chapter.


    **Side Trips:** These as include additional information about alternative or advanced
    ways to approach the topic covered.


    **Bonuses:** Timesaving tips and more advanced techniques are covered in each
    chapter.


    **Discovery Center:** This guide illustrates key procedures covered throughout
    the book.


    **Visual Index:** You''ll find real-world documents in the Visual Index, with
    page numbers pointing you to where you should turn to achieve the effects shown.'
