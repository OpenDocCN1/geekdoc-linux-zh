    # CHAPTER 14


    ![](img/d86aa78922e215fd387e0c1556445cac_374_0.png)


    The Linux boot process is as follows:


    +   1. The boot program LILO runs.

    2. Linux starts, and runs the program init to kick things off.

    3. Init reads the file /etc/initabb and decides which programs to run. Most of
    these are scripts in the /etc/rc.d directory to get you up to the desired run
    level.


    ![](img/d86aa78922e215fd387e0c1556445cac_374_1.png)


    In the file /etc/intabb, change the following line:

    id:3:initdefault:

    to this line:

    id:5:initdefault:


    ![](img/d86aa78922e215fd387e0c1556445cac_374_2.png)


    To boot a single user for system maintenance, enter the following from the

    ILO prompt:

    LILO: linux single'
