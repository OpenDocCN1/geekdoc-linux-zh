  md: '2. Add an entry to the file /etc/fstab that looks like the following:

    /dev/<device> /mnt/disk_2 ext defaults 1 1


    /dev/<device> The device name of the disk containing the Linux partition.

    /mnt/disk_2 The name of the directory where the partition is to be mounted.

    extxt2 The file system type.

    default Options.

    1 1 The backup frequency (default) and file system check pass (second pass).


    # # Mounting an MS-DOS Diskette


    Don''t bother. You can do everything you want with a diskette by using the commands
    mcopy, mdir, mcd, and mformat (see Chapter 11 for details).


    # # Adding, Removing, and Deactivating Users


    So far, you''ve been doing all your work as root. That''s about as safe as walking
    a tightrope without a net. You can do it, but one wrong step, and you''re toasted.
    It''s time to create a few user accounts.

    Red Hat Linux comes with a nice X Window user administration tool. When you start
    X Window, the control panel program starts automatically.


    To add a new user, follow these steps:


    +   1. In the control panel program, scroll down to the User and Group Configuration
    icon, and double-click it. The User Configurator program starts (see Figure 5-1).'
  merge: -1
  pgno: 109
- img_proc: true
  md: '![](img/d86aa78922e215fd387e0c1556445cac_110_0.png)


    **Figure 5-1** The Configurator User/Group Manager window.


    2. Click the Add button in the RHS The Linux User/Group Manager window.

    This brings up the Edit User Definition dialog box shown in Figure 5-2.


    ![](img/d86aa78922e215fd387e0c1556445cac_110_1.png)


    **Figure 5-2** The Edit User Definition dialog box


    3. Fill in the blank fields, as follows:


    Username: The name of the account.


    Encrypted password: Choose a password option.


    UID: The administration program automatically chooses an unused user ID. Leave
    this blank unless you know what you are doing..


    Primary Group: By default Linux creates a new group name for each user and makes
    the group name and the user name the same. If you have a different grouping scheme
    in mind, enter it here.


    Full name: This is the full name of the user. This information is used by the
    finger program, among others. This field is optional.'
  merge: -1
  pgno: 110
- img_proc: true
  md: 'Home directory: The home directory for the user. The tool automatically creates
    this directory and populates it with a default set of configuration files.


    Shell: The name of the command processor (shell) for the user. The choice of a
    shell is a personal matter (everyone has a favorite). The most advanced shell
    on Linux is the Bourne again ``/bin/bash`.


    +   4. After you''ve filled in the fields, click Add to create the account.


    Removing a user deletes his her files and account; it means that user is gone
    (that is, the system no longer recognizes the user). Deactivating a user flags
    that''s account with a special password that prevents anyone from using user ID
    to log in.


    You might want to deactivate an account rather than delete it. Several Linux commands,
    such as `tar`, use the password file to map user IDs to user names. When a user
    is deleted, his or her ID can''t be looked up, and `tar` can''t tell who owns
    a particular file. Also, if you reuse that user ID, you can easily run into big-time
    name confusion. Unless you deal with more than 10,000 new users, don''t delete
