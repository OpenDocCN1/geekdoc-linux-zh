    # CHAPTER 5


    # Disks (page 76)


    You control disk mounting with the file /etc/fstab. A typical file looks like
    the following:


    | /dev/hdb2 | ext2 | defaults | 1 1 |

    | /dev/hdc2 | swap | defaults | 0 0 |

    | /dev/fd0 | /mnt/floppy | ext2 | noauto,user | 0 0 |

    | none | /proc | defaults | 0 0 |

    | /dev/hd1 | /mnt/dos | defaults | 1 1 |

    | /dev/hdd | /mnt/cdrom | iso9660 ro,user | 0 0 |


    The various fields (left to right, column) are as follows:


    +   * Device name. For example, /dev/hdc2 is the third hard drive (c), which partition
    (2).


    +   * Mount point. For example, /. You''ll have to create a directory to want
    mount additional disks, such as /mnt/cdrom.


    +   * File system type:


    | ext2 | Linux (extended type 2 file) |

    | swap | Linux swap |

    | dos | MS-DOS |

    | iso9600 | CD-ROM |

    | proc | Linux "proc" special |


    +   * Options:


    | default | Use default options |

    | ro | Read only |

    | user | Can be mounted by a user |

    | noauto | Not mounted automatically at startup |'
