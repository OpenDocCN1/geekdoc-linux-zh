- img_proc: true
  md: 'Linux comes with two sets of configuration files for the fwwm9-2 window manager.
    The one we''ve been using is called "The Next Level". Written by Greg J. Badros,
    this set of configuration files won the 1996 Red Hat Desktop Contest. The other
    configuration file is the default configuration supplied with fwwm9-2.


    The files for "The Next Level" live in /etc/X11/TheNextLevel. (Note: You have
    to do ls -a to find them all the filenames start with dot.)


    To change your windows configuration, just copy the file /etc/X11/TheNextLevel/.fwwm2rc.defines
    into your home directory and edit it. The file contains comments, so it is easy
    to figure out what to change.


    When fwwm9-2 starts, it looks in your home directory for files before looking
    in /etc/X11/TheNextLevel, so it picks up your copy.


    The contents of this file are pretty well commented, so it''s not too difficult
    to make simple changes. In addition, you can find documentation in /usr/doc/TheNextLevel
    and the fwwm95 man pages.


    Most of the changes you''ll probably want to make are simple. For example, change
    the color of the active window (the highlight color), for example, change the
    following line:


    ```

    define(`HILITBACK_COLOR`, navyblue)

    ```


    to this:


    ```

    define(`HILITBACK_COLOR`, pink)

    ```


    Also, if you don''t have to name your computers "denali," "monarch," and "oz"
    (the default), you can change the list of remote machines by changing the following
    line:


    ```

    define(`USER_HOST_LIST`,`denali,monarch,oz`)

    ```


    to this:


    ```

    define(`USER_HOST_LIST`,`sabina,bright`)

    ```


    (You can put as many computers as you want in this list)


    Finally, if you want your X Window system to look like a souped-up Windows 95,
    we can remove the annoying taskbar by commenting out the following line:


    ```

    define(`FWMTASKBAR`, `1`)

    ```


    You accomplish this by putting a # at the beginning of the line, which results
    in a line that looks like the following:


    ```

    #define(`FWMTASKBAR`, `1`)

    ```'
  merge: -1
  pgno: 345
- img_proc: true
  md: 'All lines beginning with # are comments. The #define directive is used by cpp
    (the standard C and C++ macro processor). The m4 macros use just plain ol'' define
    for their macros. (m4 is another macro-processing program.)


    # Examining the Output of the Macro Program


    The configuration files for fwwm95-2 are processed through the m4 macro processor.
    For readers familiar with the C preprocessor, this program is similar — only with
    stranger syntax. (Yes, that is possible.)


    After processing, the resulting configuration file is written to /tmp/fwwmxxxxx
    (<xxxxx>) = a random number. By looking at this file, you can see what options
    are sent to the window manager.


    # Window Manager Modules


    The fwwm95-2 program has a number of helpers called modules. These programs augment
    the main functions of the window managers. For example, one of the modules, FwwmTaskBar,
    handles the Start button and the taskbar.

    Fortunately, these modules use the same configuration file as the main program.
    The documentation configuration parameters, however, are scattered among different
    configuration files.


    Window managers are sometimes called Fritterware. The name comes from the fact
    that you can fritter away a great deal of your time adjusting, modifying, and
    tweaking these programs.


    # BONUS


    # Customization Files and More Window Managers


    An attempt has been made to create a tool to generate customization files for
    many of the tools that come with Linux. Unfortunately, the people creating this
    program have a problem, because the software is changing faster than they can
    keep up with it.


    CUSTOMIZING THE X WINDOW SYSTEM


