- img_proc: true
  md: '# Other Languages


    The history of UNIX is intertwined with the history of C and, later, C++. These
    two languages are the UNIX languages. Linux also supports other languages. Most
    of these other languages are specialized languages that have dedicated followers.
    Others, such as Java, are new and experimental, but they are also fully supported
    by Linux.


    # Java


    Linux contains a full port of the Java Development Kit from Sun Microsystems.
    Java is the current hot fad in the programming language world. It is designed
    to be a much better object-oriented language than C++. Its other selling point
    is that it is portable. Programs are compiled into "byte code" that is interpreted.
    This means that the same binary program can be executed on different architectures.


    Currently, it appears that Linux will soon have native support for Java programs
    in its kernel. Linux probably will be one of the first operating systems to do.


    # The Python Language


    Python is an interpreted scripting language with a C++-like syntax. The Red Hat
    use it for their control panel application.


    # The Slang Language


    The slang language is a C-like language that has been augmented. It’s also interpreted.


    # The tcl Language


    This is a scripting language frequently used to produce simple GUI programs with
    the TK toolkit. The TK toolkit is included with Linux.


    # The umb-scheme Language


    This language is like lisp.'
