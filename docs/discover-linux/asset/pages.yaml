    # Setting Up the NIS Master


    Make sure that the following files exist:


    ```

    /etc/networks

    /etc/netgroup

    /etc/shadow

    /etc/publiclickey

    /etc/ethers

    ```


    These files must be available, even if they are empty. If they do not exist, you
    can create them by using the following command:


    ```

    [root@pc root]# touch /etc/networks

    ```


    Next, go to the yp library directory, and run the command ypinit, as follows:


    ```

    [root@pc yp]# cd /var/yp

    [root@pc yp]# ./ypinit -m

    ```


    This command does the initialization to make your system an NIS master.

    The command asks for the names of any slave servers. A slave server contains a
    copy of the NIS databases and can provide them to users when needed. A slave server
    is very useful if (when?) the network goes down.


    At this point, we have no slave servers, so press Ctrl+D.


    ```

    [root@pc yp]# ./ypinit -m

    ```


    At this point, we have to construct a list of the hosts which will run NIS servers.
    pc.dex is in the list of NIS server hosts.

    Please continue to add the names for the other hosts, one per line. When you are
    done with the list, type a <control D>.


    ```

    next host to add: pc.dex

    next host to add:

    ```


    The current list of NIS servers looks like this:


    ```

    pc.dex

    Is this correct? [y/n: y]

    ```


    The NIS system now builds the databases and makes them available to the network.
    The following messages inform you of what''s going on:'
