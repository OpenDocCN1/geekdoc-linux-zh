    # # How to Do Periodic Backups


    backup schedule is essential to running an effective computer system. Even if
    you use your computer only for personal use, the data stored on your disk is valuable,
    and you should protect it.


    In this section, you create a set of shell scripts to perform backups and then
    create a crontab entry to run them at regularly scheduled times. (The crontab
    file is used by the daemon (cron) to schedule batch jobs at a given time.)


    My preferred method of backup is to use dump. Because that won''t work on an MS-DOS
    file system, this exercise uses a combination of dump and tar.


    You need scripts to do both and incremental dumps. The full backup script starts
    by rewinding the tape and copying the script itself to the backup tape. Putting
    the script on the beginning of the tape has several advantages. It tells you what
    was backed up. It also gives you the block sizes and formats of the files on the
    tape.


    The beginning of your script looks like the following:


    ```

    #!/bin/sh

    dev=/dev/nst0

    mt -f $dev rewind

    diff if=$0 of $dev bs=1k conv=sync

    ```


    The first line, #!bin/sh, indicates that this is a shell script. The next line,
    /dev/nst0, defines a variable $dev, which holds the name of your device. This
    variable makes maintenance of this script easier. If you ever need to change the
    name of the tape device, all you have to do is change the variable. Without the
    variable, you would have to change lots of places in the script.'
