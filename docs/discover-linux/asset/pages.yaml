    # # ElectricFence


    ElectricFence is a library designed to help users find problems with dynamic memory
    allocation. This library does some tricky memory allocation. Whenever malloc or
    new is called, it allocates the requested memory at an end of a page. This is
    followed by an unmapped page. Basically,'
  merge: -1
  pgno: 288
- img_proc: true
  md: 'ElectricFence plays tricks with the memory allocations so that if you accidentally
    go beyond an allocated memory chunk, the program crashes.


    The result is when a pointer goes a little too far, it winds up in an unmapped
    page and causes a segmentation violation.


    A side effect of this technique is that the memory usage for the program balloons.
    That''s because every allocation is two pages (one for the data, one for the unmapped
    marker). Even a small malloc uses two pages.


    # Core dumps for programs using ElectricFence are huge, and you probably should
    delete them as soon as possible.


    To use the ElectricFence library, add the library command -lefence to your link
    command.


    You can configure ElectricFence to check pointers running off the beginning of
    an allocation by setting the environment variable EF_PROTECTION_BELOW to 1. You
    can do this with the following command:


    ```

    [user@pc user]$ EF_PROTECTION_BELOW = 1

    [user@pc user]$ export EF_PROTECTION_BELOW

    ```


    It is a good idea to test your program with ElectricFence. Check it with EF_PROTECTION_BELOW
    unset in order to check for pointers that fall off the end. Check it again with
    EF_PROTECTION_BELOW set, in order to check for pointers falling off the beginning.


