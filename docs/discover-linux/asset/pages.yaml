  md: '# CHAPTER TEN


    # # THE OFFICE nSERVER


    IN THIS CHAPTER YOU LEARN THESE KEY SKILLS


    +   SETTING UP SERVERS FOR SMB NETWORKS

    PAGE 210


    +   SETTING UP SERVERS FOR NFS PAGE 211


    +   SETTING UP NIS DATABASES PAGE 213


    +   SETTING THE RAID SOFTWARE PAGE 218


    ![](img/d86aa78922e215fd387e0c1556445cac_238_0.png)


    Linux makes an excellent server for the office. A network server provides disk
    and other services to other computers, called clients, over the network. Thus,
    in a small office, you can have one Linux server provide fast, and reliable disk
    services to a variety of office computers.


    Unlike proprietary systems, such as Microsoft or Novell (which try to lock you
    into their software), Linux doesn''t care who it serves. Linux is willing to talk
    to everyone. That means your one Linux server can provide file services to Apple,
    Microsoft, and UNIX systems simultaneously.


    # # Using Linux as a Server


    Linux comes with a great deal of server software. The open nature of the Linux
    operating system makes it easy to add a new protocol, and many people have done
    just that.'
  merge: -1
  pgno: 238
- img_proc: true
  md: 'Linux also comes with a set of default configuration files, which do a reasonable
    job of configuring your computer as a server. They give you a good flexibility
    in configuring your system. You can tune every little parameter — whether it needs
    tuning or not.


    This chapter discusses how to get a simple server up running for each type of
    service. High-performance, extremely detailed tuning is left up to you.


    # SMB Server


    The Session Message Block (SMB) protocol is used by most Microsoft products, such
    as Windows 95, Windows for Workgroups (WFW), and Windows NT. There are even clients
    around for MS-DOS. (Supposedly, ftp.microsoft.com has a software package to make
    MS-DOS an SMB client LANmanager, but this has not been confirmed by the author.)


    The SMB server for Linux is samba, which consists of the programs


    The configuration file /etc/smb.conf controls the server. By default, this file
    allows any remote user to access all the printers, as well as he or her home directory
    (/home/user).


    This means that if a Windows 95 user uses a network name of sam, he can have access
    all the files in /home/sam.


    The /etc/smb.conf file is complex. In fact, you can specify 75 different types
    of parameters in this file. Through these parameters, you can tune the service
    to do almost anything.


    If you are new to SMB networks, it''s best to leave the default settings alone.
    Later, as you become more expert, you can modify this file. The format of the
    /etc/smb.conf file is documented in the page smb.conf(5).


    SMB services are automatically started if you install the samba package. The default
    configuration file gives the clients access to their home directories and enables
    them to use all the printers on the system.


    The Windows 95 operating system comes with SMB software built in. That means you
    can set up a network with several Windows 95 systems and one Linux servers, and
    easily share files.


    After you set up Linux to provide SMB services, you must configure the Windows
    95 machines to use them. First, you must configure the Windows 95 machines to
    use the Microsoft network client software with TCP/IP protocol.


    To set up the system to use SMB services with Windows 95, follow these steps:


    +   In Windows 95, go to the control panel by choosing Start -> Control Panel.


    +   Double-click the Network icon.'
  merge: -1
  pgno: 239
- img_proc: true
  md: '3. Click the Add button.


    4. Choose Select Network Component Type -> Client


    5. Select Microsoft as the manufacturer, and Microsoft Network as the client to
    add.


    6. Click the Add button.


    7. Choose Select Network Component Type -> Add Protocol


    8. Choose Microsoft as the manufacturer and TCP/IP as the protocol.


    9. Close the network window, and reboot your machine.


    You should now have a Network Neighborhood icon on your main screen. Clicking
    this icon enables you to attach to the Linux server.


    The default SMB configuration does a pretty good job. If you want, you can improve
    things by fiddling with parameters. There are enough adjustable parameters that
    you can not only tune things so they are just right, but you can show your boss
    how hard your job is — by taking a week to adjust all the parameters.


    Suppose that the default SMB uses the Linux password system for checking the user
    name and password of a remote user. If you have a Windows NT server that contains
    the master account list, you may want to use it for authentication.


    In that case, you need to change the following line in your /etc/smb.conf


    ```

    security = user

    ```


    Change it to the following:


    ```

    security = server

    ```


    You also need to give the software the name of the server by using the following
    configuration line:


    ```

    password server = NT-System-Name

    ```


    # NFS Server


    FS (Network File System) is the standard method UNIX uses for sharing files. The
    server provides files to other machines (called clients) that use them. A single
    system can be both a server and a client.'
  merge: -1
