- img_proc: true
  md: '* Booting from MS-DOS first requires that you boot MS-DOS, and then run an
    MS-DOS command to boot Linux. It works, but you have the overhead of booting two
    operating systems.


    This might be most useful in student environments, where you can''t expect the
    students to keep a boot diskette around and don''t want to bother the MS-DOS students
    with the finer points of LILO.


    # Doing a System Inventory


    Before you start installing Linux, it is a good idea to know what hardware is
    installed. Linux works with most hardware without configuration, but some things,
    such as sound cards, may require that you rebuild the kernel. Besides, it''s always
    a good idea to know what''s in your computer in case of conflicts.


    Figure 1-2 is a system inventory form. The MS-DOS utility Microsoft Diagnostics
    (MSD) can help you find the answers to some of the questions. Drivers and diagnostics
    for the various boards can help you with the others.


    Don''t worry if you don''t know all the information. Linux can figure out most
    of it. The only place where you might run into trouble is with the video equipment.
    If you don''t know your brand of video card or monitor, simply leave that section
    blank. This information is used to configure the X Window System, and you can
    skip the configuration. Chapter 16 goes through the Linux utilities that enable
    you to probe your system for this information.


    A system inventory is very useful. In order to avoid losing it, tape a copy to
    your computer so that you can always tell what''s inside. That''s what I do.'
  merge: -1
