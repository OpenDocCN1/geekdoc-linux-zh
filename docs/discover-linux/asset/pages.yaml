  md: '# APPENDIX C

    USING THE CD-ROM


    he CD-ROM contains a full distribution of version 4.2 of the Red Hat Linux system.


    # About Linux


    Linux is a freely distributable operating system that''s very similar to UNIX.
    Linux, however, is more than just an operating system: It''s also the tools and
    utilities that go with it. Linux includes tools for the following uses:


    +   * Networking

    * Multimedia

    * Programming

    * Text processing

    * Internet activities


    The software comes with full and complete source code, so you can see how all
    the tools are constructed. You can also modify and improve them as needed.


    # About Red Hat


    because Linux is freely available, many companies are producing CD-ROMs. The major
    difference between the various distributions is the installation. The Red Hat
    distribution includes a robust installation that greatly simplifies the installation
    process.'
  merge: -1
  pgno: 444
- img_proc: true
  md: '# Installing the Software


    Linux is a complete operating system, so it''s not as easy to install as typing
    d:setup. You need at least two complete disk partitions on which to install Linux.
    Even with the advanced Red Hat installation program, installing Linux is not a
    simple task. It takes planning and preparation.

    Part I of this book is devoted to installation. Please read Part I carefully for
    complete installation instructions; it leads you step by step through the entire
    process. This explanation of the installation process is designed to take the
    sting out of installing the complex, yet versatile, system that is Linux.'
  merge: -1
  pgno: 445
- img_proc: true
  md: '# GLOSSARY


    .gz


    An extension that indicates a file that has been compressed with gzip.


    .tgz


    An extension that indicates this file is the output of a tar command, which has
    then been compressed with gzip. To unpack this archive, use the following command:


    ```

    zcat <file>.tgz tar xvf -

    ```


    Apache arena


    A free World Wide Web server.


    A World Wide Web browser that is free but buggy.


    A program that automatically mounts remote NFS file systems as they are needed.


    bash


    Bourne-Again Shell. This is the GNU implementation of the old UNIX sh command.
    Like most GNU software, it contains many more features than the old software it
    replaces.


    control-panel


    A Red Hat-supplied program that is designed to make system administration easier.
    It provides a GUI-based set of tools to handle most common system administration
    tasks.


    Copyleft


    The name of the license agreement for the software produced by the Free Software
    Foundation (GNU). Basically, it gives you the right to use the Foundation''s software
    (including source code), as long as you don''t restrict the rights of others.
    In other words, you must give them the source code also. See the file /mnt/cdrom/COPYING
    for the complete version of this license agreement. This is also known as the
    GNU Public License, or GPL.


    emacs


    A highly flexible editor. This is one of the two editors by UNIX users. The other
    one is vi.


    FIPS


    First Interactive Partition Splitter. This program splits a large MS-DOS partition
    in two.


    417'
  merge: -1
  pgno: 446
- img_proc: true
  md: 'Free Software Foundation


    A group of people dedicated providing high-quality software to the world for free.
    They have written many of the tools used by Red Hat. Their Web address is the
    following: http://www.gnu.org


    /etc/fstab


    The file controls the monitoring of filesystems. Floppy tape. This is a term given
    to all the simple backup tapes that plug into your floppy controller, such as
    many of the Hewlett-Packard/Colorado tape drives.


    fvwm-95


    An X Window manager with an interface that resembles Windows 95. Be warned, however,
    although your screen looks like a Microsoft system, it won''t run like one. Instead,
    you''ll get software that is fast, useful, and doesn''t crash.


    gcc


    The GNU C compiler.


    getty


    A program that runs in the background and displays the prompt: This program is
    responsible for enabling users to enter the system.


    GNU


    The "brand name" given to the software written by the Free Software Foundation.
    It stands for GNU is Not Unix.


    GhostScript


    A PostScript-like interpreter that can translate PostScript code for virtually
    any printer. You can also use it to display PostScript documents on an X Window
    System.


    GhostView


    A front to GhostScript for displaying documents in the X Window System. This is
    an older command that has been replaced by the gv program.


    gv


    A program that displays PostScript documents on the X Window using GNU GhostScript.


    gzip


    The standard GNU compression program. Note: This is not an archiver; it works
    on only one file. This form of compression is now used instead of the older compress
    program because of patent problems with compress.


    ImageMagick


    A set of programs used to manipulate images.


    info files


    A form of documentation that you can read by using info command.


    IP address


    This is a number that uniquely identifies a TCP/IP host on the network. The address
    is 4 bytes long and is usually represented in what is called the "dotted decimal
    notation," in which each byte is represented in decimal form with dots (.) between
    them. A typical IP address is 192.168.0.1.


    # GLOSSARY'
  merge: -1
  pgno: 447
- img_proc: true
  md: '# ISP


    Internet service provider. Any one of the many companies that a computer user
    can pay in order to connect his or computer to the Internet.


    # less


    A souped-up and expanded version of the old UNIX more program.


    # LILO


    Linux Loader. This program is the first thing you run during a normal boot. It
    lets you decide which operating system you want and starts it.


    # Linux


    A UNIX-like operating system that anyone can freely distribute.


    # mcopy


    A command for copying files and from MS-DOS diskettes.


    # mdir


    A command for getting a directory of an MS-DOS diskette.


    # mformat


    Formats MS-DOS diskettes.


    # mount


    The command to attach disks to the Linux file system.


    # nameserver


    A computer provides a service that tells you the IP address of a computer, given
    its domain name.


    # NFS


    Network File System. A way of sharing file systems used by most UNIX systems.


    # package


    A collection of software and instructions on how to install it. The packaging
    system used by Red Hat Linux is RPM.


    # pam


    Pluggable Authentication Modules. This is a system of modules that control authentication.
    In other words, this is the software that controls access to your system.


    # PBM


    Portable Bitmap Maps. It''s a collection of many tools designed to convert images
    to and from portable bitmap format. It also includes tools to perform many different
    transformations on P images.


    # POP server


    Post Office Protocol. A form of mail server commonly used by most Internet providers.
    It''s also very useful in PC environments where the mail software is unable to
    handle store-and-forward technology.


    # PPP


    Point to Point Protocol. A commonly used protocol for running a TCP/IP connection
    over a serial line to another machine. Commonly used to connect to a Linux system
    or to Internet service provider.


    # RAID


    Redundant Array of Inexpensive Disks. A system in which a partition is spread
    across multiple disks, thus vastly increasing the speed at which disk I/O can
    take place. Software to do this is built into Linux.'
  merge: -1
  pgno: 448
- img_proc: true
  md: '+   route


    IP network software uses the route table to decide where to send packets.


    +   Red Hat


    One of the companies that specializes in producing a high-quality distribution
    CD-ROM for the Linux operating system. Red Hat also sells Linux support and office
    tools.


    +   rpm


    Red Hat Package Management. This command installs, removes, and performs many
    other operations on the packages that make up the Red Hat Linux system.


    +   /sbin/halt


    The program that shuts down Linux and halts your computer.


    +   /sbin/reboot


    The command to shut down Linux and reboot your computer.


    +   SLIP


    Serial Line Protocol. An older way of handling TCP/IP connections over a serial
    line. This protocol has a serious overhead problem and has been replaced by the
    PPP protocol.


    +   SMB


    Server Message block protocol. The ways NT, Windows 95, and Windows for Workgroups
    share files.


    +   Single User Mode


    A Linux run mode designed for maintenance. In this mode, normal background jobs
    are not started and no one is allowed to log in.


    +   SMTP


    A Simple Mail Transfer Protocol server. A standard mail-forwarding and sending
    service.


    +   taper


    A Linux backup system that gives you a great deal of functionality and fast access,
    and uses a nonstandard format.


    +   TCP/IP


    A network protocol used by UNIX and almost everyone for communications.


    +   tex


    A typesetting program. Most GNU software comes with documentation in tex format.


    +   texinfo


    A documentation system used by the GNU people. The input can be handled in two
    ways: Running it through the tex program, you get printed documentation; by using
    the info command, you get a help text


    +   umount


    Program to unmount file systems.


    +   Virtual screen


    The X Window System enables you to have more screen space than you have physical
    screen space. The physical screen serves as a window onto the much larger virtual
    screen.'
  merge: -1
  pgno: 449
- img_proc: true
  md: '# Virtual terminal


    A screen that looks like a regular screen to a program but actually exists only
    in cyberspace. Linux has multiple virtual screens, one of which is mapped to the
    real screen. You can switch between these mappings by pressing the Alt+F1 through
    Alt+F6 keys.


    # Window Manager


    The X Window program that is responsible for all the windowing tasks, such as
    window placement, borders, moving windows, and so on. Unlike Microsoft Windows,
    in which this function is part of the basic system, the X Window System enables
    you to choose your window manager.


    # XF86Config


    The configuration file that controls how XFree86 uses the video hardware.


    # XFree86


    A version of the X Window System that is tailored for personal computer hardware.


    # X Window System


    A windowing system for Linux.'
  merge: -1
