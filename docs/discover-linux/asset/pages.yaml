  md: 'With all the preprocessors, the command line to typeset a groff document can
    get quite long. In addition, the syntax for the embedded commands is cryptic,
    extremely difficult to understand, inconsistent, and contains some of the strangest
    quoting rules you''ll ever see, and you realize how difficult it is to use groff.


    The bottom line is this: don''t use groff unless you''re an expert or desperate.
    The technology has been bypassed by full WYSIWYG word processors. About the only
    time you''ll need to run groff is to typeset man pages, which is covered in Chapter
    4.


    # The TeX Program


    The TeX program is another text processor that uses embedded commands to typeset
    text. It was designed after groff and has much better command syntax. TeX is still
    popular with academic types and is widely used to distribute documents that may
    be printed on a variety of machines. Which program to use is subject to interpretation,
    like the age-old question, "Is vi or emacs the text editor?"


    A variation of TeX is LaTeX, which is actually TeX with additional macros.


    The Free Software Foundation distributes its documentation in texinfo format,
    which is actually TeX with a special macro package. The main feature of this documentation
    is that it can be made into an info file. Another feature of this format is that
    the macros have yet to be documented.


    Chapter 4 discusses how to print texinfo documents.


    # The Lout Program


    The lout text-setting program is actually a front end to TeX. This text processor
    is different, however, in that tries to hide the typesetting commands from the
    user. Instead of entering typesetting commands, you use the macros to identify
    the parts of the document. By using content-based (Title, Heading, Command) macros
    instead of format-based (Point size = 12, font = Times Roman) macros, you add
    tremendous lout flexibility to your document production.


    A sample lout input looks like the following:


    ```

    @Section

    @Title ( Page numbers and running headers )

    @Tag ( headers )

    ```'
