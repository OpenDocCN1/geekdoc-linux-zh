    In this chapter, you learn how to connect to the Internet by using a serial line.
    Using Linux for your Internet connection is great, because you can do more than
    one thing at a time. You can edit a program in one window, while waiting for the
    World Wide Web (WWW) to download a graphic. And if you get bored, you can play
    games as well.


    # What Is PPP?


    Point-to-point protocol (PPP) is a protocol for doing network communications over
    a serial link. PPP replaces an earlier serial protocol named SLIP (serial Internet
    protocol). SLIP had many limitations that PPP doesn''t have.


    To connect to the Internet using PPP, you first have to get your computer to make
    a phone call to your Internet service provider (ISP) and then you log in. After
    logging in, the program pppd takes over and handles the connection from there.


    ![](img/d86aa78922e215fd387e0c1556445cac_144_0.png)'
