  md: '# Backup Tools


    tar

    cpio

    dump

    taper


    # PPP Installation Checklist


    +   - Use minicom to figure out what you''ll need for a chat script.

    - Generate a chat script.

    - Generate a script to run PPP.

    - If you want to connect to someone, issue the following command:

    [root@#] chmod u+s /usr/bin/pppd

    - Add the name of your ISP''s nameserver to /etc/resolv.conf.


    # Office Tools


    mail (basic e-mail)

    pine, elm (screen-based e-mailers)

    xfm (file manager)

    ispell (check spelling in text files)

    groff (text processor based on troff)

    tex (another, newer text processor)

    eafax (fax — send and receive)

    ical (calendar manager)


    # Office Server


    +   File services provided by Linux:

    - SMB (network for Windows 3.1, Windows 95, and Windows NT)

    - NFS (Used by most UNIX systems)

    - IPX (NetWare networks)


    # Graphics Tools


    xv (interactive picture viewer, processor)

    ImageMagick (interactive, but better from the command line)

    pbm (suite of programs designed to work on portable bitmaps)


    # Drawing Programs


    xfig (draws objects)

    xpaint (draws bitmaps)'
