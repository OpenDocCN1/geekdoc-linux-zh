  md: '# UPGRADE HELL


    Sooner or later, you will want to upgrade your system. It is possible to upgrade
    by

    downloading files from the Internet. It''s also possible to get from San Diego
    to New

    York by crawling on your hands and knees. Neither one is recommended.


    I''ve attempted to go the download route. I wanted to upgrade to fix an Internet

    problem I was having, so I downloaded the PPP connection and attempted

    to upgrade it. That required a new kernel, so I downloaded the kernel and installed
    it.

    That required network tools, so I downloaded the network and attempted to install
    it.

    That required a new system library, a new curses library, a new access control
    ....


    After a week, I finally got things that I could boot. Of course, the kernel com-

    planes every about out-of-date modules, but at least the things works. The good

    news is that I saved a whole $29.95 by not buying a CD-ROM. The bad news is that
    my

    phone bill was $60.00 higher that month.


    The moral of this story: buy the CD-ROM. It gives you all the stuff you need so
    that

    You can upgrade everything at one time instead of spending weeks trying to save
    a

    few bucks.


    # BONUS


    # Linux, Laptops, and You


    ne of Linux''s greatest strengths is the community of Linux. If you

    have a strange or unusual piece of hardware, chances are that some-

    where in the world, another Linux user has one, too. And sooner or

    later, someone will write a driver or utility for it.


    The list of hardware supported by Linux is constantly changing. The author

    of this book has a CD-ROM changer, and when he started writing this book,

    these devices were not supported. While he was writing this book, two additional

    versions of Linux were issued. The latest one contained driver support for the

    CD-ROM changer.'
  merge: -1
