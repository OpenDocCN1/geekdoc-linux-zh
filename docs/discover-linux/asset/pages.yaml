  md: '# BONUS


    # Using Experimental Kernels


    T he CD-ROM that accompanies this book comes with version 2.0.30 of the Linux
    kernel. Any kernels with an even number in the second digit position are considered
    stable. Odd numbers denote experimental software.

    The current experimental kernel is version 2.1.47. (This will probably change
    by the time you read this, because new kernels come out once a month now.)


    If you are adventurous and can afford system crashes and corrupted data, you may
    want to try one of the experimental kernels that you can get at the the following
    Web address:


    ```

    http://sunsite.unc.edu/pub/Linux/kernel/

    ```


    This page also contains links to other information useful to kernel hackers. The
    most important of these is probably the kernel debugger. If you want to play with
    the kernel, this is the place to be.


    # Summary


    ![](img/d86aa78922e215fd387e0c1556445cac_332_0.png)


