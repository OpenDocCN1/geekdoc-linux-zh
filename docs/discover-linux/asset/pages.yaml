  md: '# CHAPTER FOURTEEN


    # UNDERSTANDING THE INITIALIZATION PROCESS


    IN THIS CHAPTER YOU LEARN THESE KEY SKILLS


    +   - UNDERSTANDING THE LINUX BOOTING PROCESS PAGE 273

    - CONFIGURING AN X11 LOGIN PAGE 275

    - WRITING LINUX INITIALIZATION SCRIPTS PAGE 276

    - BOOTING IN SINGLE-USER MODE TO DO SYSTEM MAINTENANCE PAGE 276


    ![](img/d86aa78922e215fd387e0c1556445cac_302_0.png)


    This chapter explains how Linux boots and initializes itself. This process will
    help you configure Linux to suit your needs, and it is also extremely helpful
    when you are attempting to debug initialization problems.


    # How Linux Boots


    When the computer is reset, control is passed to the BIOS in ROM. The BIOS performs
    some simple self tests and then reads the bootstrap program from the first block
    of the disk. Linux installs LILO as its boot program. A boot program is one''s
    short enough for the BIOS to figure out how to load and smart enough to figure
    out how to load. The LILO program outputs the message LILO and waits for input.
    The user types the name of the operating system. He or she can type in parameters
    to that operating system. The Linux operating system takes several boot-time parameters,
    which are discussed later in the chapter.'
  merge: -1
  pgno: 302
- img_proc: true
  md: 'Next, LILO loads the actual operating system, or kernel. The first process
    the Linux kernel starts with init, which reads the file /etc/inittab and initializes
    the system based on what it finds there.


    # Understanding Run Levels


    The init program uses the concept of "run level" to decide what work to do. Different
    programs run at different run levels. The higher the run level, the more programs
    are run. At run level 1, for example, only enough programs run to support a single
    shell, whereas run level 4 runs everything to support a multiuser system.


    The init program gets information from /etc/inittab about what to do for each
    run level, as well as which initial run level to use.


    Table 14-1 describes the basic run levels.


    | Run Level | Description |

    |---|---|

    | 0 | Halt (shut down everything) |

    | 1 | Single user |

    | 2 | Multiuser without NFS |

    | 3 | Full multiuser (the default) |

    | 5 | X11 |

    | 6 | Reboot |


    The following is a more-detailed explanation of the run levels:


    +   * Halt. Shuts down all processing and halts the computer. This run level forces
    init to perform an orderly shutdown.

    * Single user. In this mode, only a single process is run. It is a root shell
    on the console. No daemons or background jobs are run.

    This mode is useful for system maintenance and checking out the scripts that start
    up the various system daemons. This is especially true if one of the daemons hangs
    the system.

    * Multiuser without NFS. This mode does everything except NFS. I''m not sure why
    you''d want this, but you can use this mode to get it.

    * Full multiuser. This is the normal operating mode: full multiuser, all daemons
    running, and everyone happily logged in.'
  merge: -1
  pgno: 303
- img_proc: true
  md: '+   * X11. By default, the system starts a text-based login process on the
    console. In X11 mode, this switches to an X11-based login, instead of getting
    a bare login prompt, you access a screen that looks like the one shown in Figure
    14-1.


    This type of login looks nice, and — what''s better — the user doesn''t have to
    type the startx command to get X running.


    So why doesn''t Linux make the X11 run level the default? Because you may not
    have X configured properly when you first start Linux. (And you can''t display
    an X Login on a system that doesn''t work).


    +   * Reboot. This run level performs an orderly shutdown of the system and reboots.
    This is like pressing the DOS key combination Ctrl+Alt+Del, except that it gives
    the programs that are running a chance to save their data before killing them.


    ![](img/d86aa78922e215fd387e0c1556445cac_304_0.png)


    Figure 14-1 The X Window System login screen


    # # Configuring for an X11 Login


    If you want an attractive login screen, or if you want to avoid forcing the user
    to manually start the X Window System, you can configure Linux to use an X11 login.'
  merge: -1
  pgno: 304
- img_proc: true
  md: 'First, test your system to see whether the X11 login screen works. (If you
    screw up the login process, it''s difficult to recover because you can''t log
    in or correct)


    To test your X11 login, log in as root, and execute the following command:


    ```

    [root@pc root]# init 5

    ```


    If all goes well, when you log out, the X11 login prompt appears on the console.
    If it does not appear, stop, and fix the problem before proceeding.


    To make the X11 login default, change the file /etc/inittab so that the line sets
    the default run level 3. The default line looks like the following:


    ```

    id:3:initdefault:

    ```


    You need to change that line to the following:


    ```

    id:5:initdefault:

    ```


    The next time you boot, you will be greeted by the X11 login screen.


    # The rc Scripts


    Using the initialization process, Linux starts many background programs. These
    programs are actually started by a series of scripts located in the /etc/rc.d
    directory. In this directory, you will find a subdirectory for each run level.
    The scripts that start programs for run level 3, for example, are located in /etc/rc.d/rc3.d.


    If you want to create your own daemon, you need to put a script in one of these
    directories to start it. Which directory depends on which run level you want to
    have your program.


    Also, if your system hangs during the initialization process, you may want to
    examine these scripts to see what program is being started. This gives you some
    idea of where to look for the problem.


    # Booting in Single-User Mode


    here''s one difficulty in examining your /etc/rc.d files when your system hangs
    — you need a working system to look at them.


    The way to get around this problem is to start your system in single-user mode.
    You accomplish this by giving the kernel the startup option single when it is
    booted.'
  merge: -1
  pgno: 305
- img_proc: true
  md: 'To give the kernel single option, wait until you get the LILO prompt on

    screen, and then type the following command:


    ```

    LILO: linux single

    ```


    Here, linux is the name you use to boot Linux, and single is the kernel

    option to boot in single-user mode.


    > CAUTION

    Booting in single-user mode can give the user root access whether

    not or he has the root password. If you want to make sure that your

    system is secure, you need to put the restricted option in your

    /etc/lilo.conf file.


    # BONUS


    # Where to Find In-Depth

    Kernel Information


    You can find extensive documentation on how the kernel operates by look-

    ing in the "Kernel Hacker''s Guide." You can find this document at the fol-

    lowing Web address:


    ```

    http://sunsite.unc.edu/pub/Linux/docs/LDP

    ```


    # Summary


    Now you have learned how Linux starts up. With this knowledge, you

    can tune and adjust the initialization process to suit your needs. You

    also can diagnose and fix any startup problems.


