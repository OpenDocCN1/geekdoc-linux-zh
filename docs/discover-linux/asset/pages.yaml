- img_proc: true
  md: 'commands to handle the installation, removal, upgrading, and building of a
    package.


    The RPM package system includes many options, but this section concentrates on
    the ones that give you information.


    # What Is This Package?


    The RPM packages live in the directory /mnt/cdrom/RedHat/RPMS. To find out what
    a package does, use the command, rpm -q -i -p <filename>. For example, to see
    what''s in the package file xtrojka-1.2.2-2.i1386.rpm, use the following command


    ```

    [user@pc user]$ rpm -q -i -p xtrojka-1.2.2-2.i1386.rpm

    Name : xtrojka             Distribution: Red Hat Linux Vanderbilt

    Version : 1.2.2             Vendor: Red Hat Software

    Release : 2                Build Date: Wed Nov 20 15:43:25 1996

    Install date: (none)       Build Host: porky.redhat.com

    Group : X11/Games/Video Source RPM: xtrojka-1.2.2-2.src.rpm

    Size : 192461

    Summary : falling blocks game

    Description :

    ```


    Similar to xjels or tetris, this game presents you with the challenge of keeping
    the playing area clear of falling blocks.


    # What Files Are in a Package?


    To find out what files constitute a package, use the following command:


    ```

    [user@pc user]$ rpm -q -l -p filename

    ```


    For example, to find out what''s in the xxdb package, issue the command shown
    here. The following shows the command as its results:


    ```

    [user@pc user]$ rpm -q -l -p xxdb-1.12.1-i1386.rpm

    /usr/X11R6/bin/xxdb

    /usr/X11R6/lib/X11/app-defaults/XDbx

    /usr/X11R6/man/man/xxdb.1

    ```


    # Where Did This File Come From?


    The RPM system maintains a database of files and the packages they came from.
    (The better to uninstall them, my dear) You can use this database to find out
    what package a file belongs to. For example, just after I installed my system,
    I found the file /etc/drums.3. Now I''m fairly familiar with a lot of different
    UNIX systems, and none of them has a drums file. So what this for?'
  merge: -1
  pgno: 98
- img_proc: true
  md: 'The following command tells you which package a file belongs in:


    ```

    [user@pc user$] rpm -q -f filename

