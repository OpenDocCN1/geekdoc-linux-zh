    # Installing Netscape


    Now that you''ve got Netscape, it''s time to wrap your new toy and play with it.


    Netscape is distributed as a compressed tar file. To unpack this file, you need
    to use zcat to uncompress the file and the tar command to unarchive it. You accomplish
    this process with the following command:


    ```

    [user@pc user]$ zcat *linux*.gz | tar xvf -

    ```


    the xvf options tell tar to extract (x), output verbose information (v), and use
    the next argument as the file to extract. The file argument is a dash (-), indicating
    the standard input. (In other words, the output of the zcat command.) Executing
    this command results in the following:


    ```

    [user@pc user]$ zcat *linux*.gz | tar xvf -

    README

