  md: '# BONUS


    # Extensions for Linux


    # Bounds-Checking Extensions to gcc


    One enterprising fellow has created a “bounds-checking” version of gcc. This version
    compiles your program with extra code that checks for bad pointers and array indices
    that are out of bounds. You can find information on his modifications to the compiler
    at the following address:


    ```

    http://www-dse.doc.ic.ac.uk/~rj3/bounds-checking.html

    ```


    # g++ Template Extensions


    Like the gcc compiler, the g++ compiler extends the language a bit. You can find
    these extensions in the info file for g++.


    One of the great controversies in the C++ world concerns the question, “How do
    you generate code for templates?” The answer to this question has spawned a religious
    war among members of the C++ community.


    Concerning the issue of how templates should be implemented, the C++ standardization
    committee is currently divided into two groups. This bitter war is being waged
    with machine guns and explosives (well, the academic equivalents of machine guns
    and explosives, which are strangely worded papers).


    The bone of contention is how C++ templates are generated. Although the syntax
    is standard, there is no standard for implementing templates.


    The GNU people use a method in which you must define all the types that will be
    used by a template generation in the files that the template body. Another common
    method is to use a repository to hold the template bodies and then to compile
    the bodies at link time. (Which camp is this author in? He thinks you should stay
    away from templates until the other groups stop fighting.)


    If you want to use the repository method, you can get patches for the compiler
    from the Cygnus plus site at the following Web address:


    ```

    ftp://cygnus.com/pub/g++/gcc-2.7.2-repo.gz

    ```


