    # Figure 16-1 Using the xvidtune program


    When using xvidtune, start with a virtual screen that''s slightly larger (20 pixels
    or so) than your screen. That gives xvidtune some room to play in.


    Start this program with the following command:


    ```

    [root@pc root]# xvidtune >vid.info

    ```


    This command redirects the standard output to a file. You''ll need the information
    in this file later.


    As soon as the programs starts, click the Auto button. If you don''t, all the
    buttons won''t take effect until you click the Test button. This situation can
    be confusing.


    Now you can adjust the screen by clicking the Left, Right, Narrower, Taller, and
    other buttons.


    When the picture is in the correct place, click Save, and the configuration information
    is written to the standard output. In the preceding command, you saved it in the
    file vid.info. You can edit this information into the /etc/XF86Config file to
    make your changes permanent.


    # The X Window System Starts


    The Microsoft Windows system is extremely simple. It consists of one program that
    controls the display and windows, and a program manager.


    The X Window System is much more complex. Several programs together to create
    the X Window environment. And because X is in pieces, it is highly customizable.
    Each program has its own initialization files, however, there are multiple configuration
    files. Finding what you want to change may be difficult.


    ![](img/d86aa78922e215fd387e0c1556445cac_338_0.png)'
  merge: -1
  pgno: 338
- img_proc: true
  md: 'You start the X Window System with the command startx. This command is actually
    a shell script that looks for initialization files and then calls the program
    xinit with the appropriate files.


    There are two major parts to the X Window System. The first part is the server,
    which manages the display and draws on the screen.

    The other part contains the clients. The clients include all the programs, such
    as xterm and clock, that display on the screen.


    One important client is the window manager, which draws all the borders around
    the windows, titles, and other GUI elements. It is in charge of window size, placement,
    and visibility.


    Unlike Microsoft Windows, where the window manager and the server are one program,
    the X System puts these functions into separate programs. In fact, as you will
    see, the X Window System enables you to use a variety of window managers.


    The startx command checks for the server initialization file $HOME/.xserverrc.
    If it is not there, startx uses the system initialization file: /usr/X11R6/lib/X11/xinit/xserverrc.


    For the client side, startx looks for $HOME/.xinitrc, and if it doesn''t exist,
    startx uses /usr/X11R6/lib/X11/xinit/.xinitrc.


    The location of these files is passed to the xinit program. This program first
    starts the server and then the initial client. This first client is the xinitrc
    script.


    The system xinitrc script runs a number of programs to configure the XServer (see
    Table 16-1). It checks for the file $HOME/.xclients and runs it if it is available.
    Otherwise, xinitrc runs a default set of programs that includes a window manager.


    | Table 16-1 Configuration Programs Run by xinitrc and Their Initialization Files
    |

    | Program | User File | System File |

    | xrdb | .Resources | /usr/X11R6/lib/X11/xinit/.Resources¹ |

    | xmodmap | .Xmodmap | /usr/X11R6/lib/X11/xinit/.Xmodmap² |


    > 1 System resources are loaded first and then user resources are merged in.

    2 The user keyboard modification map overrides the system map.'
  merge: -1
  pgno: 339
