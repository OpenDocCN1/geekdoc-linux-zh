  md: '# Selecting a Boot Method


    Linux gives you several ways of booting your system, including the following:


    +   * Booting from a diskette

    To use this method, you create a boot diskette as part of the installation process.
    When you want to boot Linux, you put the diskette in drive A and reset your computer.
    You get Linux as a result.

    When you want to boot your default operating system (MS-DOS, Windows 95, OS/2,
    or whatever), you remove the diskette and reset the computer.

    Note: This is the preferred method for booting experimental versions of your operating
    system (also known as a kernel). That way, if the newly generated operating system
    has something wrong with it, you can always remove the diskette and go back to
    the old one.

    I happen to like this method, because I''m using hardware to switch between Linux
    and MS-DOS. It all takes the installation or removal of a diskette and a reboot
    to switch between the two.


    +   * Using LILO

    LILO (the Linux LOader) is a boot program that runs just after you reset your
    machine, which enables you to select which operating system you want to boot.
    This program is highly configurable: You can tell it to wait for a selection from
    the command line, to wait a specified amount of time before booting the default
    operating system, or to instantly boot the operating system of your choice.

    You install LILO on the hard drive or a diskette. The Red Hot installation does
    a good job of configuring LILO, so it''s fairly safe to install it on your hard
    drive. On the other hand, if you are conservative about what you put on your boot
    sector, install it on a diskette.


    | MS-DOS partition |

    | Linux swap space (30 MB minimum) |

    | Linux root file system (200 MB minimum) |


    **Figure 1-1** Disk Allocation Worksheet'
  merge: -1
