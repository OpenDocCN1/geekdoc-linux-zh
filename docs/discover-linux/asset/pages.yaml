    before you start your installation, you can save a great deal of time. What''s
    better, you can avoid the dreaded reinstallation.

    You have two methods available for installing your system. The first is to take
    a few minutes, plan your installation, and then do the work. The second approach
    is to start installing the software immediately, perform a full installation,
    rip it out because you did it incorrectly, and start the process all over again
    — several times.

    The first method is much quicker, though not nearly as much fun. This section
    leads you through the steps necessary to plan your installation.

