  md: '# Getting a Table of Contents


    To get a table of contents (a list of the files archived on the tape), use the
    -t option, in the following example:


    ```

    $user@pc user$ cpio -t </dev/fptape

    ```


    # Reading a cpio Archive


    Reading is accomplished by using the -i option. The following command reads an
    archive and restores all the files in it:


    ```

    $user@pc user$ cpio -i </dev/fptape

    ```


    # Using the Taper Program


    Unlike the other commands presented in this chapter — tar, cpio, and dump — the
    taper command is not a UNIX standard. It''s unique to Linux. And although it contains
    many features than these standard commands, its uniqueness is a drawback. Knowing
    that your data is backed up with a standard, well-known format, is a plus.


    # THE GREAT TAPER ADVENTURE


    I first tried Taper on a Red Hat 4.0 system. Out of the box, it didn''t work.
    I kept getting a Failed to execute child error.


    So what did I do about this problem? The first thing was to look at a Red Hat
    Web page to see if it contained any errata on the subject. (You can find errata
    by clicking the Support Button.)


    Sure enough, there''s a bug listed for Taper. It seems they didn''t bother to
    include the programs bg_backup and bg_restore. I clicked on the download link,
    and voilà — I found that the Red Hat ftp server was maxed out. Oops.


    Instead, I got a list of mirrored sites. I then quickly three that didn''t have
    the update, I finally found one that worked, downloaded the software, and installed
    it. The update worked.


