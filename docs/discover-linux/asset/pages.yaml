  md: '# BACKUP STRESS TESTING


    A system administrator for a major university decided to test the various backup
    programs, so she created the disk from hell and tried the various commands on
    it. The disk was nasty: it contained filenames of 255 characters, paths of the
    maximum length, hundreds of levels of directories, and even filenames containing
    end-of-line characters.


    The result: She broke all backup systems. Some crashed


    You want to start at the beginning of the tape, so issue the following command:


    ```

    mt -f $dev rewind

    ```


    The last line in this portion of the script is the following:


    ```

    dd if=$0 of=$dev bs=1k conv=sync

    ```


    This line uses the dd command (a copy command) to copy the script (if=$0) to the
    tape (of=$dev) with a block size of 1K (bs=1k). If there is not enough data to
    fill the last block, it is padded to make it large enough (conv=sync).


    The next line dumps the Linux root partition (/dev/hdb1), as follows:


    ```

    dump Oubdfs 64 15000 15000 $dev /dev/hdb1

    ```


    To back up your MS-DOS partition, use the tar command, as follows:


    ```

    tar cfg $dev.file.date /dos

    ```


    This line introduces a new option: g. You use the g option to increase mental
    dumps. The first time tar runs, it creates the file dos.file.date and puts it
    in the current time. The next time tar runs, it checks this file and backs up
    only the files that changed since the preceding tar.


    This is all you need; the new feature has been added to the script: the output
    is captured to a log file named /log.dump. At the end of the dump, this file is
    mailed to the user sdo. The following script is called level10.sh:


    # UP AND RUNNING WITH LINUX


    # 108


    SIDE TRIP'
