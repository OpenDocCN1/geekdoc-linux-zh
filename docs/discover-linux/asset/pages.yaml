    # Other Common Languages


    any of the Linux programming tools are oriented towards the popular C and C++
    languages, but these are not the only widely used languages. Many other old and
    established languages are supported by Linux.


    # f2c and fort77


    The f2c program translates FORTRAN to C or C++. This is one way of running FORTRAN
    programs on Linux. The fort77 command tries to emulate other compilation commands
    and hide from you the fact that your FORTRAN becomes C before it becomes a program.


    # PASCAL


    Linux doesn''t have a true PASCAL compiler. Instead, the program p2c translates
    PASCAL into C and then runs gcc.


    # BASIC


    Linux comes with a version of BASIC. This language is obsolete, however, and should
    not be used. It is rumored that programming in BASIC causes brain damage. If you
    examine any BASIC program, you''ll see how this rumor got started.


    # Compiler Tools


    linux contains a lexical analyzer generator called flex. (If you don''t know what
    a lexical analyzer generator is, you don''t need one.) This utility is an enhanced
    and faster version of UNIX standard lex.


    Linux has two compiler generators. These are called bison and yacc. The yacc program
    is the standard "Yet Another Compiler" distributed with UNIX. The bison program
    is the Free Software Foundation''s enhanced and augmented version of yacc.


    ![](img/d86aa78922e215fd387e0c1556445cac_296_0.png)'
