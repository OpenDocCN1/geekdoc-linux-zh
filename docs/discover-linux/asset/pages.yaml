  md: '# # Software Notes


    This chapter covers all sorts of methods for viewing and printing documents. Several
    of these methods require specific software, of which may not be installed or configured.
    For example, many of the document work only under the X Window System.


    X-REF The installation and configuration of specific software packages is covered
    in later chapters. Configuring X Window is covered in Chapter 16, and installing
    specific software packages is described in Chapter 5. Still, more than enough
    information is in this chapter to get started, and after you set up the additional
    software, you can come back here for more ideas about how to read documentation.


    # # Documentation Directories


    You can find documentation almost anywhere, but the following several standard
    directories are used by most Linux packages:


    | Directory | Description |

    | --- | --- |

    | /usr/doc | Text documentation and other formats |

    | /usr/info | GNU information pages |

    | /usr/man | Manual pages |

    | /usr/src/linux/doc | Documentation on kernel modules |

    | /mnt/cdrom/doc | Additional documentation |

    | /mnt/cdrom/RedHat/RPMS | The Red Hat packages (.rpm) files |


    > NOTE To read the files on the CD-ROM that accompanies this book, you must first
    mount it. Chapter 5 describes mounting the CD-ROM.'
