  md: 'But what if you don''t know enough of the beginning of the word to be useful?
    Suppose you want to find the word endurance but only know that it begins with
    en and there''s a ra in there somewhere?


    The solution is to pipe the output of the look command through grep to limit your
    word choices, as in the following example:


    ```

    [user@pc user]$ look en | grep ra

    ```


    This command yields a list of words, but too many to be useful. You have to further
    limit the search. Now that a d is in somewhere, so you add another grep to further
    cut down on the number of words, as in the following command:


    ```

    [user@pc user]$ look en|grep ra d

    ```


    This time, the result looks like the following:


    +   encouraged

    endurable

    endurable

    enturance

    engraved

    erraged

    entranced

    enumerated


    Now you have a small enough list, so you can easily find the word. The upshot
    of the preceding discussion is: Linux does have good tools, but sometimes you''ve
    got to put them together.


    # Text Processing


    Inux may be limited in the word processor department, but it excels in text-processing
    tools. Text processors use embedded commands to typeset text. With word processors,
    you get to see what your work looks like on the screen. With text processors,
    the input consists of text and commands and nothing like the finished work. You
    must run the input through the text processor in order to see what the printed
    page looks like.


    For example, this is the Linux man for the cat command in raw format:


    ```

    .TH CAT 1 "GNU Text Utilities" "FSF" \* -*-

    .SH NAME

    cat - concatenate files and print on the standard output

    .SH SYNOPSIS

    .B cat

    ```'
