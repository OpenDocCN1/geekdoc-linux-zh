  md: '# Manners'' Guide to Excriating Correct Behaviour


    You''ll get a different joke each time. Be thankful for small favors.


    > NOTE As shipped, the fortune cookie program comes with the obscene jokes disabled.
    To enable them, you must rebuild the program from the source code.


    To enable the obscene jokes, you first must install the source code by executing
