- img_proc: true
  md: '# CHAPTER SEVENTEEN


    # TROUBLESHOOTING YOUR LINUX

    SYSTEM


    IN THIS CHAPTER YOU LEARN THESE KEY SKILLS


    +   - REVIEWING TYPICAL LINUX PROBLEMS PAGE 319

    - UNPACKING THE SOURCE FILES AND PREPARING FOR DEBUGGING PAGE 320

    - UNDERSTANDING DEBUGGING TOOLS PAGE 321

    - REPORTING A BUG TO THE LINUX COMMUNITY PAGE 322

    - FINDING OTHER SOURCES OF HELP PAGE 322


    ![](img/d86aa78922e215fd387e0c1556445cac_348_0.png)


    Sooner or later, even with Linux as good as it is, you''re going to run into trouble.
    Unlike commercial software, however, Linux gives you the tools and sources that
    enable you to get out of trouble. This chapter explores troubleshooting tools
    and techniques.


    # Trouble?


    During the writing of this book, I tested almost all of the programs that come
    with Red Hat Linux. Most of the problems I found concerned missing programs. You
    might wonder how a company like Red Hat could release a product with missing pieces.
    The answer is that Linux is an extremely complex system, loosely maintained by
    hundreds of people. It is simply not possible for a small company, as Red Hat
    has, to check everything before a release. Some slip through the cracks.


    The great thing about Linux is that if something is missing, chances are that
    you can easily recover. You''ve got the source code.


    319'
  merge: -1
  pgno: 348
- img_proc: true
  md: 'In addition, if a utility crashes or gives you a cryptic error message, you
    can examine the source code to give you some idea of what''s wrong. Let''s face
    it: Cryptic, undocumented, and strange error messages are par for the course in
    UNIX. I''m still trying to figure out what the following message means:


    ```

    Error: Success

    ```


    # # Getting Out of Trouble


    First, hope that someone else solved your problem. Red Hat publishes an errata
    sheet on its Web page that contains updates to the computer''s products. You can
    find many simple fixes at the following Web address:


    ```

    http://www.redhat.com

    ```


    It is also a good idea to check this page regularly if computer security is a
    major concern of yours. That''s because security patches are posted here as well.


    # # Using the Source Code


    If your problem isn''t already fixed, source code can be an invaluable troubleshooting
    tool. This book''s CD-ROM includes source code for all the programs in this book.
    The CD-ROM directory /mnt/cdrom/SRPMS contains the source code packages.


    The first step in examining the source code is to install the package by using
    the following:


    ```

    [root@pc]# cd /mnt/cdrom/SRPMS

    [root@pc]# rpm -i f <package-file>

    ```


    This command installs the source code into the directory /usr/src/red-hat/SOURCES
    and the package specification file in the directory /usr/src/red-hat/SPECS. The
    raw source code consists of the source package as directly downloaded from the
    Internet, with any patches that are needed to make the given program work with
    Linux. The specification file describes the source code package. It includes information
    such as the location of the raw package, as well as instructions on compiling
    the software in the package — a sort of specialized Makefile.


    # # Unpacking the Program


    After the source package is installed, you can unpack the source code by using
    rpm. The rpm package manager is designed to execute various stages described in
    the specification file.'
  merge: -1
  pgno: 349
- img_proc: true
  md: 'The first is the preparation (prep) stage. This stage consists of unpacking
    the

    source code and installing Linux patches that are needed.

    To execute this stage, use the following commands:


    ```

    [root@pc SRMSPS#] cd /usr/src/redhat/SPECS

    [root@pc SPECS#] rpm -bp <spec-file>

    ```


    All the "build" commands use a specification file, not a package name.


    At this point, you can inspect the source code to see what''s going on.

    You can''t determine what''s wrong at this point, you can go to the next step
    and

    compile the source code for debugging.


    # Generating a Debuggable Program


    Compiling the programs can involve a great many commands. Each package is a

    lifferent; for example, the GNU packages use a configure script to create a\Makefile.
    Many X Windows programs use Makefiles, which require you to use the

    command xmkmf to turn them into Makefiles. And, of course, some programs don''t

    require any configuration and can be built simply by typing the command.


    The exact commands required to create the binaries are stored in the specifica-

    tion file. This file is text, so you can take a look at the commands. Even better,
    how-

    ever, you can have rpm execute them for you by using the following commands:


    ```

    [root@pc SPEPS#] cd /usr/src/redhat/SPECS

    [root@pc SPECS#] rpm -bc <spec-file>

    ```


    This compiles a debug version of the package. The files are stored in

    /usr/src/redhat/BUILD/package-name.


    Normally, these are compiled for production. If you want to use the

    debugger, you have to recompile them. You must go through the various

    Makefiles and change the compiler flags to use the debugging option (g).


    After you''ve edited the Makefiles, you can recompile them by doing a make

    clean and a make.


    Now you can run the program using the debugger and see exactly what is

    going on mostly.


    # Debugging the Library


    Sometimes you may get a program that crashes in a library call. If Linux

    were commercial software, you''d be in big trouble. The only way out would

    be to read the inadequate documentation and guess at what went wrong.


    As an alternative, you could call the commercial software company''s technical

    support line and talk to an underpaid technician who has no clue what you''re

    talk about what the problem is.


    TROUBLESHOOTING YOUR LINUX SYSTEM


    321'
