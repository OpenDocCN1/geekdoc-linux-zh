    # Table 5-3 Linux Hard Disk Partition Names


    | Linux Name | Description |

    | --- | --- |

    | /dev/hda | First IDE disk (whole drive) |

    | /dev/hda1 | Partition #1 on first IDE drive (continued) |


    INITIAL CONFIGURATION'
