    | /dev/sdb | Second SCSI disk drive (whole disk) |

    | /dev/sdb1 | Partition #1 on second SCSI drive |

    | /dev/sdb2, /dev/sdb3,... | Additional partitions |


    For this example, suppose that your CD-ROM is attached as the slave disk on the
    secondary IDE controller (/dev/hdd). The fields you need for your CD-ROM, therefore
    are the following:


    +   * /dev/hdd The CD-ROM device name

    * /mnt/cdrom The name of the directory where the CD-ROM will be mounted

    * iso9660 The disk type (ISO9660 is the International Standards Organization [ISO]
    specification for CD-ROMs)

    * ro,user The mount options. In this case, the selected options are read-only
    (ro) and user mountable (user). The read-only is required because you cannot write
    files to the CD-ROM.


    The user option is not required. Normally, only the superuser (root) is allowed
    to mount and unmount drives. The user option allows anyone to do it.


    0 0 These options indicate when to back up the CD-ROM and to perform a file system
    check on the drive. Both these activities make sense for a normal hard drive,
    but not for a CD-ROM, so use the “don’t bother” values (0 0) for these fields.'
