  md: '# Understanding Virtual Terminals


    n MS-DOS, the console screen is the console screen; there is only one. Linux is
    better because you have multiple screens. When you start out, you are virtual
    terminal #1. You can instantly switch to virtual terminal #2 by pressing Alt+F2.
    To switch back to terminal #1, press Alt+F1.


    There are six virtual terminals, which you can access by pressing Alt+F1 through
    Alt+F6.


    You can use virtual terminal #1 to log in as root to do superuser stuff and use
    virtual terminal #2 as a normal user for un-super stuff, or anything else you
    want to do.


    > Security alert! Make sure you log out of all the virtual terminals before you
    leave. It''s easy to forget that other terminals are active and accidentally walk
    away from an active session.


    ![](img/d86aa78922e215fd387e0c1556445cac_77_0.png)


    # Shutting Down Linux


    You must properly shut down Linux to avoid damage to its file systems. terminate
    all the operating system processes and halt your computer, issue the following
    command:


    ```

    [root@pc root]# /bin/halt

    ```


    You can also reboot the computer by logging in as root and typing the following
    command:


    ```

    [root@pc root]# /bin/reboot

    ```


    You can use Ctrl+Alt+Del to reboot your computer, but Linux people consider this
    technique a crutch used only by MS-DOS users who don''t understand the wonders
    of Linux.


    ![](img/d86aa78922e215fd387e0c1556445cac_77_1.png)


    # Configuring X Window


    any different video cards and monitors are available for PCs. You must configure
    the X Window System to work correctly with your monitor and video.'
