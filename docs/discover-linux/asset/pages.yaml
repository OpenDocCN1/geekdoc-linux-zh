    name. Different CD-ROMs require different device drivers. Table 5-2 lists the
    device names for the various CD-ROMs; choose the one that fits your equipment.


    # Table 5-2 CD-ROM Device Names


    | Device Name | CD-ROM Type |

    | --- | --- |

    | /dev/hda | IDE device #1 (primary controller, master drive) |

    | /dev/hdb | IDE device #2 (primary controller, slave drive) |

    | /dev/hdc | IDE device #3 (secondary controller, master drive) |

    | /dev/hdd | IDE device #4 (secondary controller, slave drive) |

