    # Version Control


    A version control system is a necessary part of any programming environment. Such
    a system enables you to record or check in a set of changes to your program. It
    not only keeps track of the latest version, but tracks previous versions of the
    software. That way, you can go back and see what was done to the software and
    what changes were made. (This is especially useful if the last set of improvements
    caused something to working.)


    # A Brief Introduction to RCS


    Revision Control System (RCS) is a simple revision control system. It does a good
    job of handling the files for small to medium programming projects (projects that
    involve about 20 or fewer programmers ). It tracks files, keeps a revision history
    (who changed what), and prevents two programmers from modifying the same file
    at the same time.


    To show how to use RCS, we will create a program. Let''s start with the "Hello
    World" program because that''s the program everyone starts.

    First create a directory to hold the RCS files. Create this directory by issuing
    the following command:


    ```

    [user@pc user]$ mkdir hello

    ```


    Now write your first version of hello.c. When you are finished with it, check
    it into the RCS system using the check in (ci) command. RCS notices that you''ve
    never checked in this file before, so it creates an RCS file for it and asks you
    to describe the file. The description can be as many lines as you like, but it
    ends with a line containing a single period, as follows:


    ```

    [user@pc user]$ ci hello.c

    ```


    RCS/hello.c.v <-- hello.c

    enter description, terminated with single ''.'' or end of file:

    NOTE: This is NOT the log message!'
