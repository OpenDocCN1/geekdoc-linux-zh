  md: '# REAL LIFE LINUX:

    COUNTING THE USERS


    The one question that often comes to mind is how many people use Linux? Counting
    the users of commercial software is easy: Just count the number of registration
    cards received. You can also count the number of copies sold.


    using Linux?

    They use it for many things. Linux makes a very good Internet server, for example.
    Linux runs on inexpensive hardware, it is free — and robust.


    But Linux is free. There are no registration cards. A “registration counter” can
    be found at http://counter.org, but Internet-based counters are easy to spoof.
    Besides, many people do not register by using this method.


    Linux has a mail system that''s capable of handling hundreds of thousands of messages
    without bogging down. It connects with a World Web server, and its networking
    capability is extremely stable and reliable.


    You could count the number of CD-ROMs sold. In 1996, the sales of Linux-based
    CD-ROMs reached almost half a million. But this doesn''t include the number of
