- img_proc: true
  md: '> > A simple hello program.

    > initial revision: 1.1

    done


    This command removes the file from your current directory. If you want to look
    at it or compile it, you need to check it out, as follows:


    ```

    [user@pc user]$ co hello.c

    RCS/hello.c --> hello.c

    revision 1.1

    done

    ```


    RCS gets the file for you and tells you that version 1.1 was checked out. This
    file is checked out read-only, however, so you can''t modify it.


    Suppose you want to edit the file. In order to do so, you have to check it out
    "locked." Only one programmer may perform a locked checkout on a file, so only
    one person at a time may edit it. This prevents two people from making changes
    to a file at the same time:


    ```

    [user@pc user]$ co -l hello.c

    RCS/hello.c --> hello.c

    revision 1.1 (locked)

    done

    ```


    Now you can edit the file. If you want to see what you''ve changed, the rcsdiff
    command, as follows:


    ```

    [user@pc user]$ rcsdiff hello.c

    Oal,3

    ```


    > > /************************************************n> * hello - a very simple
    program to greet you *

    > *************************************************/


    The gibberish at the beginning tells you that you added (a) three lines (number
    1,3) after line 0 (the beginning).


    After you finish, check in your changes by using the ci command, as follows:


    ```

    [user@pc user]$ ci hello.c

    RCS/hello.c <-- hello.c

    new revision: 1.2; previous revision: 1.1

    enter log message, terminated with single ''.'' or end of file:

    >> Added comment describing the program.

    >>

    done

    ```


