    ![](img/d86aa78922e215fd387e0c1556445cac_310_0.png)


    For most computers, the default version of the Linux operating system works just
    fine. If you have an unusual configuration, however, or you want to customize
    your system, you need to reconfigure and rebuild your kernel. This chapter shows
    you how.


    # Configuring Kernels


    Before you can configure your kernel, you need to install the kernel source package
    (/cdrom/RedHat/RPMS/kernel-source-2.0.30-3.i386.rpm). The files are installed
    in the directory /usr/src/linux. The Linux consists consists of basic operating
    system and a number of driver modules. During the configuration process, you can
    select which drivers are used and how they are configured.


    You can load drivers in two ways. First, you can make them part of the kernel.
    That way, they are loaded when the kernel is loaded at boot time, and they are
    never unloaded.


    Second, you can load drivers through the use of modules. A module is a component
    of the kernel loaded as part of the initialization process. Some modules, loaded
    by the kerneld process, are automatically unloaded if they detect they are not
    needed.'
  merge: -1
  pgno: 310
- img_proc: true
  md: 'Which way should you go, modules or monolithic (no modules)? That depends on
    what you want to do. If you are creating an operating system for a single computer,
    monolithic is probably best. It''s also the simplest. On the other hand, if you
    are creating a system that must run on several servers, all with different hardware,
    a module kernel is better. Through the use of modules, your system can customize
    itself at boot time.


    To configure your kernel, execute the following commands:


    ```

    [root@pc root]# cd /usr/src/linux

    [root@pc linux]# make xconfig

    ```


    The result is an X Window-based configuration tool. Each button brings up a different
    configuration section (see Figure 15-1).


    | Linux Kernel Configuration |

    | Code maturity level options |

    | Loadable module support |

    | General setup |

    | Floppy, IDE, and other block devices |

    | Networking options |

    | SCSI support |

    | SCSI low-level drivers |

    | Network device support |

    | ISDN subsystem |

    | CD-ROM drivers (not for SCSI or IDE/ATAPI drives) |

    | Filesystems |

    | Character devices |

    | Sound |

    | Kernel hacking |

    | Save and Exit | Load Configuration from File |

    | Quit Without Exit | Store Configuration to File |


    **Figure 15-1** The configuration program


    Clicking the General setup button, for example, brings up the window shown in
    Figure 15-2.'
