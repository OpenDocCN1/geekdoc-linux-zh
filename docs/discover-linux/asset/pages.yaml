  md: '# Building a Test Kernel (Disk Method)


    First, update the Makefiles and clean out any old kernel files by issuing the
    following commands:


    ```

    root@pc linux]# make dep

    root@pc linux]# make clean

    ```


    Now compile the kernel itself by issuing the following command:


    ```

    root@pc linux]# make

    ```


    If your kernel uses modules, you need to create them and put them in the /lib/modules/2.0.30
    directory, as follows:


    ```

    root@pc linux]# make modules

    root@pc linux]# make modules_install

    ```


    # Creating a Test Kernel


    You can create a test kernel in two ways. One is to create a bootable diskette.
    That way, if something goes wrong, all you have to do is remove the diskette and
    reboot. The other way is to install the kernel on the hard drive and boot using
    a special LILO command.


    # Creating a Bootable Diskette


    One convenient way of trying an experimental kernel is to put it on a diskette.
    When you boot off the diskette, you get the new kernel. If something goes wrong,
    remove the diskette, reset, and you get your old kernel. It''s a simple and reliable
    method.


    The following command copies the kernel you just built to the diskette in drive
    A:


    ```

    root@pc linux]# make zdisk

    ```


    Before you''re ready to use it, you need to set a few options. You set the first
    option by using the following command:


    ```

    root@pc linux]# /usr/sbin/rdev -R /dev/fd0 1

    ```


    This command sets flags in the kernel, to mount the root device read-only when
    first booted. This is a normal start-up option.


    Next, you need to tell the operating system where the swap partition is by issuing
    the following command:


    ```

    root@pc linux]# /usr/sbin/rdev -s /dev/fd0 <partition>

    ```'
  merge: -1
  pgno: 329
- img_proc: true
  md: 'Here, partition is the swap partition of the disk.


    You are now ready to test your new kernel, so reboot with the following command:


    ```

    [root@pc linux]# /sbin/reboot

    ```


    If everything goes well, you, can proceed to the next step and install your kernel
    for real.


    # Creating a Test Kernel on Disk


    The other method of testing a kernel is to install it on disk and boot using a
    special LILO configuration.


    First, back up the existing kernel. (I always like to make a copy of the initial
    kernel in case of disaster). You need to do this only once, as follows:


    ```

    [user@pc linux]# cd /boot

    [user@pc boot]# cp vmlinuz vmlinuz.

    ```


    Next, make a bootable kernel by issuing the following commands:


    ```

    [user@pc linux]# cd /usr/src/linux

    [user@pc linux]# make zImage

    ```


    Now you copy the new kernel to the boot directory, as follows:


    ```

    [user@pc linux]# cd arch/i386/boot

    [user@pc boot]# cp zImage /boot/vmlinuz

    ```


    Now tell the LILO boot loader about both the new and old kernels. The file /etc/lilo.conf
    is used to configure the file. With a lot of cutting and pasting — and a little
    editing — you have /etc/lilo.conf that understands your three kernels. The new
    version of /etc/lilo.conf follows:


    ```

    boot=/dev/fd0

    map=/boot/map

    install=/boot/boot.b

    prompt

    timeout=50

    other=/dev/hda1

    label=dos

    table=/dev/hda

    image=/boot/vmlinuz

    label=linux

    root=/dev/hdb2

    read only

    image=/boot/vmlinuz.ok

    label=ok

    root=/dev/hdc1

    ```


    ![](img/d86aa78922e215fd387e0c1556445cac_330_0.png)'
  merge: -1
  pgno: 330
- img_proc: true
  md: '```

    read-only

    image=/boot/vmlinuz.new

    label=new

    root=/dev/hdc1

    read-only

    ```


    After this file has been completed, you need to install the new LILO.

    lilo command performs this installation, as shown here:


    ```

    [root@pc linux]# lilo

    Added dos *

    Added linux

    Added ok

    Added new

    ```


    Now, reboot by using the following command:

    [root@pc linux]# /sbin/reboot


    When the LILO prompt appears, you can start your new kernel by selecting

    the system named new.


    # Final Installation


    After you have tested your new kernel and made sure it works, you can

    make it the default kernel by using the following commands:


    ```

    [root@pc linux]# cd arch/i386/boot

    [root@pc boot]# cp /boot/vmlinuz.new

    ```


    After any change to your Linux kernel, you must run LILO again so that

    your boot loader can find the changed kernel. Run LILO again by issuing the fol-lowing
    command:


    ```

    [root@pc boot]# lilo

    ```'
