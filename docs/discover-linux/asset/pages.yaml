- img_proc: true
  md: '# Configuring XFree86 for Your Video

    Card and Monitor


    If you already have the X Window System running, you can skip to the section "How
    the X Window System Starts." Otherwise, you need to read this section first to
    learn how to configure your system.

    The X Window System is extremely fast and flexible, and it drives your video hardware
    much harder and better than Microsoft Windows. In order to make full use of your
    system, XFree86 needs to know a great deal about your video card and monitor.

    The configuration information for XFree86 is stored in /usr/X1R6/lib/X11/XF86Config.
    This file contains information about your video, card and monitor, as well as
    the location of important X Window components, as the font database. This file
    is long and complex (mine is 209 lines long and it''s a short one).

    Fortunately, you''ll rarely have to write your own configuration file, because
    a number of tools are available that will write one for you. If that doesn''t
    work, a great deal of documentation is available that tells what to put in the
    file. If that fails, however, you''re in for a lot of work.


    # Probing Hardware


    One of the problems with configuring the X Window System is that you need to know
    a lot about your video card. If you''ve lost the manual to do this, you probably
    don''t know how much about it. What can you do? Try a program called SuperProbe.
    This program queries your system and tells you about your video card, as the following
    example shows.


    ```

    SuperProbe Version 2.11 (Oct 20 1996)


    ... verbiage skipped...


    WARNING - THIS SOFTWARE COULD HANG YOUR MACHINE.

    READ THE SuperProbe.1 MANUAL PAGE BEFORE

    RUNNING THIS PROGRAM.


    INTERRUPT WITHIN FIVE SECONDS TO ABORT!


    First video: Super VGA

    Chipset: S3 86CB05i (Port Probed)

    Memory: 2048 Kbytes

    RAMDAC: Sierra SC1148(2,3,4) 15-bit or

    SC1148(5,7,9) 15/16-bit HiColor

    ```'
  merge: -1
  pgno: 335
- img_proc: true
  md: '(with 6-bit wide lookup tables (or in 6-bit mode)

    Second video: Hercules

    Chipset: Standard


    You can then find information about the XFree86 configuration programs, such as
    XConfigurator, XF86Setup, or xf86config. Each of these programs can be used to
    configure XFree86. Some of are easy to use, some are more complete. The next few
    sections discuss the features of each one.


    # Using XConfigurator


    We''ve already covered the XConfigurator program in Chapter 3. It is the simplest
    and easiest to use, but it doesn''t cover all cases. You may need to use a more
    technically sophisticated tool.


    # Using XF86Setup


    If XConfigurator doesn''t work, you can try XF86Setup. XF86Setup is a GUI-based
    program that uses the basic VGA Server to display its graphics. This program provides
    a great deal of control over what goes into the configuration file. To use this
    program, run it with the following command:


    ```

    [root@pc root]$ XF86Setup

    ```


    Then fill in the blanks.


    # Using X86config


    The x86config program is an older, non-GUI-based program. It asks you a great
    deal about your video card, monitor, and more information. xf86config is text
    oriented and much more technical than XConfigurator.


    This program generates an XF86config file in your current directory. You need
    to copy this file to /etc/XF86config before trying your new configuration.


    ![](img/d86aa78922e215fd387e0c1556445cac_336_0.png)


    Remember, if you start the X Window System with a new configuration file, abort
    immediately if the configuration does not work. (If things aren''t going as they
    should, your screen will go nuts — that''s how you know to abort the process immediately.)


    # Editing a Configuration File by Hand


    If you have unusual hardware, the configuration programs might not be able to
    generate a configuration file. In that case, you can try editing the XF86Config
    file “by hand.”


    ![](img/d86aa78922e215fd387e0c1556445cac_336_1.png)'
  merge: -1
  pgno: 336
- img_proc: true
  md: 'Beware that editing this file is not for the faint of heart. It''s cryptic,
    full of strange numbers, and generally a pain in the posterior. There''s a good
    reason that two programs are available that are designed to generate it for you.


    Two text files may be of some help to you. The first is a list of all known video
    cards and their configurations. It is in /usr/lib/X11/doc/.


    The second file contains monitor information. This file is in /usr/lib/X11/doc/Monitors.


    # Generating the Numbers in the XF86Config


    Unless you are an electrical engineer familiar with the internal workings of video
    monitors and display cards — and with access to specialized test equipment — don''t
    try to generate XF86Config from scratch.


    Only people who know what they are doing and have a great deal of time on their
    hands have the know-how and ability to generate such a file. If you haven''t been
    scared off by now, you can take a look at the XFree86 document- /usr/doc/FAQ for
    more information.


    A very good tutorial, called “The Hitchhiker''s Guide to Video Modes,” is available
    to help you. You can find tutorial at the following addresses:


    ```

    http://www.xfree86.org/3.1.2/VideoModes.html

    http://www.ccil.org/~esr/faqs/video-modes.html

    http://tsikova.tiac.net/video-modes.html

    ```


    # Tuning Up with xvidtune


    After you have a configuration mostly working, you can use the X Window utility
    xvidtune to tune it. With this utility, you can make minor adjustments in the
    location and size of your screen. Figure 16-1 shows the control panel presented
    by this program.'
