  md: '# The patch Utility


    The patch program enables software developers to distribute updates to their source
    files. These updates are produced by using the diff command. The patch utility
    looks at the output ofdiff, detects what changes have been made to the original
    file, and makes them.


    By using diff and patch, you don''t have to download the entire source of a package
    every time something changes.


    # The rdist Program


    The rdist program is designed to handle the problem of distributing programs across
    multiple machines. It copies the files, makes sure that the permissions and modification
    times are identical, and performs other functions.


    This program is very useful on large and medium networks where several servers
    are needed and must contain identical utilities.


    # STEALTH UPGRADES


    The network administrator for a large university network found that every time
    he upgraded the compiler, everyone would complain that the new compiler broke
    their code. In 99 percent of the cases, it was not the compiler''s fault, but
    this administrator-n had to deal with a lot of very angry professors.


    He devised an installation scheme to get around this problem.


    He would announce, with much fanfare, that a new version of the compiler would
    be installed Sunday. That Sunday, he did nothing. More precisely, he did not install
    the new compiler — he just told everyone.


    When Monday rolled around, he would get the usual group of complainants who blamed
    the new for failing to compile their code. He would tell them that it was their
    code was at fault, not the compiler. This could do with great confidence-because
    the compiler had not changed.


    Finally, when complaints died down, he would secretly upgrade the compiler. Any
    complaints he received after that he thought were probably legitimate.


    It should be noted that he learned this trick from a friend who was a radio operator.
    The guy would put a new radio antenna and not connect it. Neighbors would complain
    that he was interfering with their television sets. The Federal Communications
    Commission would investigate, find that the antenna was not con-nected, and go
    away. Later, he would secretly connect it to his transmitter.'
