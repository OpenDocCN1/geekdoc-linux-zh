  md: '# Using the Linux Documentation


    linux comes with a great deal of online documentation. The problem is the standard
    formats — are tens of them. This chapter tells you how to find, view, and print
    the online documentation, no matter what format.


    # Documentation Formats


    When UNIX first came out, the online documentation consisted of “man”, or “manual,”
    pages. This approach was state of the art 20 years ago, but it is some-limited
    today. Still, a great deal of Linux documentation exists in man page format.


    The Free Software Foundation found the page format too limited, so the people
    devised their own format: texinfo. Documents in this format can be converted into
    hypertext info files, as well as printed documentation.


    One of the standard text processors for Linux is TeX (pronounced “tech”). It takes
    a text file containing both words and typesetting commands and produces typeset
    output. Users can view this output on the screen or send it to the printer.


    Finally, many files are stored as post PostScript files. You can view these files
    under Window by using the gv package (discussed later) or print them on a PostScript
    printer. (Don''t worry if you don''t have a PostScript printer, the Red Hat system
    comes with printers that turn PostScript into something you can use.)


    ![](img/d86aa78922e215fd387e0c1556445cac_86_0.png)


    # The RPM System


    One of the strengths of the Red Hat distribution of Linux is the Red Hat Package
    Management packaging system. A package is a bunch of programs and files that are
    installed, uninstalled, or removed together. Red Hat packages also include some
    very short documentation about the package itself. This chapter contains an explanation
    of how to use the RPM system to obtain information about the software.


    # Finding Files


    Documentation is stored in lots of places. Sometimes, in fact, finding files be
    half the battle. You can use the find command to locate files that contain a particular
    word or string.'
  merge: -1
  pgno: 86
