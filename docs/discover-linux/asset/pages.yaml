    # Using defaults found in arch/i386/defconfig

    #


    The first prompt asks you about development drivers, as the following shows:


    +   * Code maturity level options


    +   * Prompt for development and/or incomplete code/drivers

    (CONFIG_EXPERIMENTAL) [N/y?] N


    Before answering this question, remember that Linux is constantly evolving. People
    are developing new drivers every day. Some of these drivers work, some don’t,
    and some are questionable. If you are an adventurer, kernel hacker, or crazy,
    answer Yes to this question. Otherwise, the answer is No.


    > NOTE The [N/y?] prompt indicates that N (or No) is the default answer by capitalizing
    this.


    The next section lets you decide if you want to support loadable modules:


    +   * Loadable module support


    +   * Enable loadable module support (CONFIG_MODULES) [Y/n?] y

    Set version information on all symbols for modules

    (CONFIG_MODVERSIONS) [Y/n?] n

    Kernel daemon support (e.g. autoload of modules) (CONFIG_KERNEL)

    [Y/n?] Y


    Loadable modules were discussed earlier in this chapter. Even if you don’t plan
    to use them, it might be a good idea to answer Yes to this question, just in case
    you want to add modules later. Or, if you want modules at a later date and answer
    No, here you have to build a new kernel.


    Modules and the kernel are tightly coupled. In other words, you should not use
    a version 22 module on a version 23 kernel. Setting the version information for
    all module symbols forces modules to be compatible. If you don’t, it’s possible
    to load a mismatched module. I tend not to want this feature, because if I load
    a module and it doesn’t work, I’ll unload it.


    Finally, you have a question about kernel daemon support. The kernel daemon called
    knerld is a program that loads modules, for a while, and then checks to see whether
    anyone is using them. If the module is not being used, it is unloaded. This is
    very useful for loading device drivers. If the device is present, the module will
    let the kernel daemon know it’s being used. If the device isn’t present, and the
    kernel daemon will unload it.'
