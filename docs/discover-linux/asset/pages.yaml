    \ \ntributed, and user-written drivers can be included. Unless your hardware is\
    \ very\ndifferent, you don't need these drivers.\n\n+   * Kernel hacking\n\n+\
    \   * Kernel profiling support (CONFIG_PROFILE) [N/y/?] n\n\nThis feature enables\
    \ kernel hackers to profile the kernel. You're probably not\na hacker, so answer\
    \ N.\n\nThe kernel configuration is complete, and the configuration now gives\
    \ you a\nmessage indicating that it's finished.\n\nThe linux kernel is now hopefully\
    \ configured for your setup.\nCheck the top-level Makefile for additional configuration,\n\
    \ do a 'make clean' if you want to be sure all\nthe files are correctly re-made\n\
    \nCongratulations, your kernel is configured (we hope). The next few sections\n\
    discuss how to build, test, and install your new kernel."
