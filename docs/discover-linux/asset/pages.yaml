  md: '# Pages, Screens, and Virtual Screens


    Window is an extremely powerful and flexible system. It has features that Windows
    95 never dreamed of. Sometimes, however, all those features tend to get in the
    way of each other and can cause confusion.


    The screen is what you see on your monitor. The virtual screen is where the programs
    draw their windows. The size of the virtual screen can be larger than the size
    of the screen. The sizes of both the screen and the virtual screen are controlled
    by your X configuration file.


    Suppose that you are running your screen at a resolution of 800x600 and since
    both screens are the same size, nothing funny is going on. But now you want to
    use a lower resolution, so you press Ctrl+Alt+Keypad-Minus and switch to 640x480.


    Now your screen is at 640x480 and your virtual screen is at 800x600. Your programs
    think that the screen is 800x600. You see only 640x480. If your viewport (the
    part of the virtual screen you see) is at the top of the virtual screen, you may
    not see things at the bottom of the screen (such as the taskbar). This situation
    is illustrated in Figure 3-2.


    ![](img/d86aa78922e215fd387e0c1556445cac_81_0.png)


    **Figure 3-2** Actual virtual screen


    If you attempt to move the cursor to the bottom of the screen, the X Window scrolls
    the screen down toward the bottom of the virtual screen. By moving the cursor
    off the edge up, down, left, or right, you can move the screen over the virtual
    screen.


    X Window uses the extra memory on the video card to hold the virtual screen data,
    it is extremely fast.


    Now throw a new joker into the deck: Pages are additional virtual screens created
    by X Window. The pager (the grid in the lower-right corner of the screen) controls
    which page is currently displayed. When first started, X Window uses the upper-left
    page. Clicking any other square in the pager switches you to a new virtual screen.
    You switch between pages using the computer''s memory, which is merely fast (as
    opposed to the virtual screens'' very fast scrolling).'
  merge: -1
  pgno: 81
- img_proc: true
  md: 'In addition, if you set the proper options in your X Window initialization
    file, you can scroll from one page to another by moving the cursor off the virtual
    screen.


    This means that with the screen, virtual screen, and pages, you can move the cursor
    off the screen to the left and scroll through the virtual screen until you hit
    the edge of the virtual screen. At that point (if you enable the option), you
    start moving the virtual screen through the pages.


    To avoid this extra confusion, make the size of your virtual screen the same as
    your screen. This is done by changing the configuration file named /usr/X11R6/lib/X11/XF86Config.
    The line that defines the size of the virtual screen looks something like this:


    ```

    Virtual 1280 1024

    ```


    Try changing this to the maximum resolution that you''ll be using. For example,
    if your video card and monitor support only 800x600 pixels, then the values should
    be the following:


    ```

    Virtual 800 600

    ```


    Because the configuration file contains parameters for several screens, this line
    may be repeated several places in the file. You should change them all.


    # # Navigating Around the Screen


    To type in a window, simply move the cursor into the window, and type. To bring
    a window up to the top, click its title bar, or click the name of the window at
    the bottom of the screen.


    You can move windows by dragging them by the title bar. Drawing the corners of
    a window resizes the window.


    The buttons at the top of a window perform a variety of functions. Figure 3-3
    shows the various buttons.


    | Window menu Iconify Maximize |

    | | pc.dock-Main |

    | | Root |


    ![](img/d86aa78922e215fd387e0c1556445cac_82_0.png)


    Figure 3-3 The Window buttons


    Table 3-1 contains a short description of each button.'
