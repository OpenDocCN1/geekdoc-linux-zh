- img_proc: true
  md: "# TABLE 11-1 Linux Commands and Their MS-DOS Equivalents\n\n| Linux | MS-DOS\
    \ |\n| --- | --- |\n| mattrib | ATTRIB |\n| mcd | CD |\n| mcheck | CHKDSK / SCANDISK\
    \ |\n| mcopy | COPY |\n| mcheck | CHKDSK / SCANDISK |\n| mcopy | COPY |\n| mdel\
    \ | DEL |\n| mdeltree | DELTREE |\n| mdir | DIR |\n| mformat | FORMAT |\n| mlabel\
    \ | LABEL |\n| mmd | MD |\n| mmove | RENAME |\n| mrd | RD |\n| mren | RENAME |\n\
    | mtype | TYPE |\n\nOne problem with MS-DOS file systems is the limited filenames.\
    \ If you copy a bunch of Linux files (with long names) to a diskette, the filenames\
    \ become mangled. The mkmanifest command creates a shell script that renames these\
    \ mangled filenames to their original Linux versions.\nHere's an example of how\
    \ to copy a bunch of files to a diskette:\n\n```\n[user@pc user]$ copy Big.Problem.txt\
    \ a.funny.name A:\n[user@pc user]$ mkmanifest Big.Problem.txt a.funny.name \\\n\
    \  > fix.sh\n[user@pc user]$ mcopy fix.sh A:\n```\n\nThe file.sh contains commands\
    \ to rename the MS-DOS files to their former names.\nThe m commands work not only\
    \ on diskettes, but also on hard disk drives, or on disk files containing an MS-DOS\
    \ disk image. (An MS-DOS image is an exact copy of an MS-DOS diskette or MS-DOS\
    \ partition; is, a disk file.) The drives letters A and B, by default, are mapped\
    \ to the diskette drives. The configuration file /etc/mtools.conf controls mapping\
    \ of other drive letters."
