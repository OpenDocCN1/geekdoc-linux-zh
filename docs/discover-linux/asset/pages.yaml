- img_proc: true
  md: 'This program follows the traditional file manager model, namely the following:


    +   * Double-click a folder to open the folder and examine the files inside.

    * Double-click a file to start the application associated with that file. (The
    associations are controlled by a set of configuration files in the ~/.fm)

    * In the Tools window, double-click any tool group to open up that.

    * To use a tool, simply drag a document over the tool, and drop it. To print a
    file, for example, drag the file to the printer, and drop it.


    The interface is pretty straightforward and simple, so you shouldn''t have too
    much trouble learning what''s going on.


    # Word Processors, Spreadsheets, and Databases


    if you want something with all the power and features of Microsoft Office, get
    Microsoft Office. Microsoft has poured millions of dollars into the development
    of these programs, and lots of people use them.

    Several excellent office suites are available for Linux, but you have to pay money
    for them. Two of them are the following:


    Applizware. For information and ordering, see the following address:


    ```

    http://www.redhat.com/products/apx.html

    ```


    Caldera StarOffice. Among other things, Caldera sells a copy of WordPerfect that
    works with Linux. For information and ordering, see the following Web address:


    ```

    http://www.caldera.com/products/

    ```


    # StarOffice


    StarOffice is freely available for noncommercial use. Basically, that means that
    if you make money with it, they want money. StarOffice consists of a suite of
    office programs, including a spreadsheet, a word processor, a graph generator,
    and an image-manipulation program.'
  merge: -1
  pgno: 219
- img_proc: true
  md: 'To get StarOffice, you need to perform the following steps.


    +   1. Go to the Caldera home page (http://www.caldera.com), and follow the links
    to the StarOffice download menu. You need to give your name, address, and telephone
    number to get to the download menu.


    +   2. Download all the README files, and then read them.


    +   3. Download the appropriate .rpm files.


    +   4. Install each of the files by using the rpm command, as follows:


    ```

    [root@pc root]# rpm -i --nodeps files

    ```


    +   5. You may need a newer version of the C library to run the setup program.
    You can get that current library from the Red Hat ftp archive at the following
    Web address:


    ftp.redhat.com:/pub/contrib/i386/libc-xxxxxx


    (Replace the xxxx with the latest version number of the library.)


    +   6. Install the new library with the following command:


    ```

    [root@pc root]# rpm -i --upgrade libc*

    ```


    +   7. Edit the files /opt/StarOffice-3.1/sd.sh and /opt/StarOffice-3.1/sd.csn,
    and make the changes indicated so that these point to the correct path.


    +   8. Set up your shell so that it can run the StarOffice program by using the
    following command:


    ```

    [root@pc root]# .opt/StarOffice-3.1/sd.sh

    ```


    +   9. Start the background programs by issuing the following commands:


    ```

    [root@pc root]# svdaemon &\n[root@pc root]# svportmap #

    ```


    # STAROFFICE


    Before you can run any StarOffice product, you need to initialize your shell so
    that it can find the StarOffice programs. You perform this initialization by using
    the following command:


    ```

    [user@pc user]$ .opt/StarOffice-3.1/sd.sh

    ```


    You can now run the StarOffice program by typing in the name of the program. To
    start the spreadsheet (named calc3), for example, execute the following command:


