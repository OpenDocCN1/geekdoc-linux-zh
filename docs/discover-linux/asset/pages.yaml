- img_proc: true
  md: '# WINE and WABI


    You can get a freely available Microsoft Windows emulator, called WINE, from mostly
    the Red Hat ftp site, which is at the following address:


    ftp.redhat.com:/pub/contrib/i386/wine-xxxxxx


    WINE runs Windows programs and intercepts all calls to the Windows API (Application
    Programming Interface). These are translated into X Window System calls.


    WINE is an alpha software. It cannot run a large number of programs. The author
    has tried WINE on one of the giants, Microsoft Word, and it worked — mostly. The
    program ran, but the fonts used for the menus were too small to read. This probably
    can be fixed with a change to the configuration file, but because WINE is still
    in alpha, no one has bothered to document the formation of the configuration file.


    Even so, rapid progress is being made on WINE, and more robust versions are made
    every every day.


    If you don''t want to experiment with alpha software, you can use a full-featured,
    robust environment for Linux called WABI (Windows Application Binary Interface).
    This system enables you to run all your Windows programs under Linux. Unfortunately,
    it costs money. If you are interested, however, WABI is available from Caldera
    systems at the following Web address:


    http://www.caldera.com


    # Summary


    In this chapter, you leaned how to get data onto and off of MS-DOS diskettes.
    This involves not only moving the files, but converting them as well. You also
    learned how you can use the DOS emulator with your DOS programs without giving
    up the advantages of Linux.


