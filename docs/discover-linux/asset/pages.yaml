  md: '# Configuring Netscape


    You now need to configure Netscape so that you can read news as well as send and
    receive e-mail. To configure Netscape, you need to perform the following steps:


    +   1. Start Netscape.

    2. Choose Options -> Main and News Preferences.

    3. Click the Compose tab to get the Netscape Mail and News Preferences Compose
    window, as shown in Figure 7-1.


    ![](img/d86aa78922e215fd387e0c1556445cac_160_0.png)


    Figure 7-1 The Compose tab of the Netscape Mail & News Preferences window


    +   4. Enter your e-mail address (including the @host part) in the blanks for
    the Mail Messages/Self Other Address and News Messages/Self Other Address blocks.
    For this example, use the address oualling@connectnet.com.

    5. Click the Servers tab to get the window shown in Figure 7-2.'
  merge: -1
  pgno: 160
- img_proc: true
  md: '![](img/d86aa78922e215fd387e0c1556445cac_161_0.png)


    **Figure 7-2** The Servers tab of the Netscape Mail & News Preferences window


    +   6. Enter the name of your SMTP server in the SMTP Server field. In this test
    case, this name is smtp.connectnet.com.


    +   7. Enter the name of the POP server in the POP3 Server field. For this example,
    that''s pop3.connectnet.com.


    +   8. The POP user name goes in the User Name field. Use qualine for this example.


    +   9. Go down to the News section. In the News (NNTP) Server field, enter the
    name of the news host. For this example, use nntp.connectnet.com.


    +   10. Click the Identity tab to get the window shown in Figure 7-3.'
  merge: -1
  pgno: 161
- img_proc: true
  md: '![](img/d86aa78922e215fd387e0c1556445cac_162_0.png)


    Figure 7-3 The Identity tab of the Netscape Mail & News Preferences window


    +   11. Enter the information about yourself.


    +   12. Click the Organization tab to get the window shown in Figure 7-4.


    +   13. If you don''t want to have to type in your POP mail password every time
    you get messages, place a check mark in the Remember Mail Password checkbox.


    +   14. Click OK to close the window.


    +   15. Save your options. Choose the `Option` -> `Save Option` menu item. (If
    you don''t, you have to do all this again.)


    LINUX AND THE INTERNET 133'
  merge: -1
  pgno: 162
- img_proc: true
  md: '![](img/d86aa78922e215fd387e0c1556445cac_163_0.png)


    **Figure 7-4** The Organization tab of the Netscape Mail & News Preferences window


    # # Internet Mail


    The easiest way to read mail is through Netscape. It does a good job and has an
    appealing interface, as you can see from Figure 7-5.


    > TIP Just to make sure that you have entered everything correctly, it’s a good
    idea to send yourself e-mail, and see if you receive it.


    Other mail readers are available; most of them understand the POP protocol used
    by most ISPs. One such mail reader, called movemail, is actually distributed with
    Netscape. A full discussion of the many mailers and ways of sending mail is, unfortunately,
    beyond the scope of this book.'
  merge: -1
