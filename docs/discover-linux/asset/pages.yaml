  md: '# CHAPTER FIVE

    INITIAL

    CONFIGURATION


    IN THIS CHAPTER YOU LEARN THESE KEY SKILLS


    +   - MOUNTING ADDITIONAL DISKS PAGE 75

    - ADDING USERS AND PRINTERS PAGE 80

    - CONFIGURING A MODEM PAGE 87

    - ADDING AND REMOVING SOFTWARE PAGE 88

    - OTHER CONFIGURATION COMMANDS PAGE 90


    Now that the software is installed, you need to do a little configuration.

    This chapter tells you how to do that configuring.


    # Mounting the CD-ROM


    The CD-ROM that accompanies this book contains a large number of tools and documentation.
    All of that is useless, however, if you can''t get to it. For that reason, one
    of the first things you need to do is the CD-ROM.

    MMounting is the process of making a disk available to Linux. Unlike MS-DOS, where
    each disk has its own drive letter, Linux grafts disks into one seamless (almost)
    file system. Mounting installs a new disk or partition into that file system.


    The first step is to create a directory for your CD-ROM. You can give it any name,
    but some of the Linux utilities default to the name /mnt/cdrom, so using that
    name is probably the best choice. Create the directory with the following command:


    ```

    [root@pc root]# mkdir /mnt/cdrom

    ```'
  merge: -1
  pgno: 104
- img_proc: true
  md: 'The /etc/fstab controls disk mounting. A typical fstab looks similar

    to the following:


    # A sample /etc/fstab

    | /dev/hdb2 | ext2 defaults 1 1 |

    | /dev/hdc2 | swap swap 0 0 |

    | /dev/fd0 | mnt/floppy ext2 noauto 0 0 |

    | none | /proc proc defaults 0 0 =


    This is merely a text configuration file. Each line represents a single disk to

    be mounted. (Lines beginning with the hash mark [#] are comments.) Using the

    sec line of the preceding fstab as an example, Table 5-1 describes

    the various fields in the file.


    TABLE 5-1 The /etc/fstab File Format

    | Sample Entry | Field | Description |

    | /dev/hdb2 | Device name of the disk | The device name of the actual disk drive.
    See Table 5-2 for a list of CD-ROM device names and Table 5-3 for a list of hard
    disk partition names |

    | / | Mount Point | The name of the Linux directory where the disk will be installed
    |

    | ext2 | File system type | The type of file system. Common file system types
    are ext2 (Linux native), swap (Linux swapping) msdos (MS-DOS files), and iso9660
    (CD-ROM file systems) |

    | defaults | Options | Options that control the mounting of this disk. There are
    quite a lot of them, but for the most part, default (the default options) will
    do. |

    | | Dump Frequency | This is supposed to be an indicator of how to back up this
    file system, but I''ve never seen anyone use it |

    | | File System Check Pass Number | When Linux is brought up, the system checks
    to see if it was properly shut down. If not, Linux will perform a file system
    check on each of the partitions. In general, the root system gets checked first
    first and everything else second. If you''re really clever, you can use these
    numbers to optimize the checking.) |'
  merge: -1
  pgno: 105
- img_proc: true
  md: 'This is not a complete discussion of everything you can put in /etc/fstab.
