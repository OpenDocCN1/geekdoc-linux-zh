    # Testing Your Backup System


    This step is important: test your work, and then attempt to restore it. You must
    do this to ensure that you created the scripts correctly, your backup tapes are
    written correctly, and you know how to run the restore program.


    The time to find mistakes is now, during the testing phase, after you have a disk
    crash, lose all your data, and 20 engineers and a manager are pressing you.


