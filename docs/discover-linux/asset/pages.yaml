  md: '# PREFACE


    linux is a freely available UNIX-like operating system that also includes a set
    of programs that run under it. One of the most surprising things about this software
    is a better-quality product than the commercial stuff — and it is free.


    This book teaches you how to install and use Linux. The book emphasizes practical,
    real-world methodology and is designed to show you how to get done.


    # This Book’s Audience


    This book is designed for people who know UNIX and want to run Linux themselves.
    You should be familiar with UNIX as a normal user.


    This book teaches you everything you need to install and run Linux. It also contains
    a tour through the many utilities that come with the Linux system. The book is
    organized around the practical use of Linux. Whether you are using Linux as an
    office server, a multimedia machine, a Web server, or a programming workhorse,
    this book is for you.


    # How This Book Is Organized


    This section describes the organization of Discover Linux so you can get the most
    out of the book. The basic orientation of the book is toward the various uses
    of Linux. If you want to use Linux as an office productivity tool, for example,
    all you have to read two parts: Part I, “Up and Running with Linux,” and Part
    III, “Linux in the Office.”


    With the book organized in this way, you should be able to get the information
    you need quickly without wading through a great deal of information irrelevant
    to your situation.


    # Part I: Up and Running with Linux


    The book begins with the installation process. Linux is a very powerful operating
    system and provides the user with a robust and complex set of features. In this
    part of the book, you get detailed installation instructions so you can perform
    your installation correctly the first time.'
  merge: -1
  pgno: 12
- img_proc: true
  md: "Everyone must read this part of the book. The other parts are targeted to\n\
    individual needs and stand independently. You should read only the parts that\n\
    interest you.\n\n# Part II: Fun and Games\n\nLinux comes with a variety of games,\
    \ including some multiplayer network\ngames. One nice thing about Linux you can\
    \ have work in one window and a\ngame in another at the same time) Linux is fun.\
    \ Using Linux, you can get-\nected to the Internet — where, as well as information,\
    \ it is ever present.\nFinally, you also learn about the numerous screen savers\
    \ that Linux includes.\n\n# Part III: Linux in the Office\n\nLinux makes an ideal\
    \ office server. That's because — unlike proprietary\nsystems — Linux is not locked\
    \ into one protocol. It talks to everyone.\nLinux also comes with many utilities\
    \ to handle common office tasks.\n\n# Part IV: Multimedia and Programming Tools\n\
    \nLinux includes many image, sound, and animation tools. Some of these\ncontain\
    \ more features and a better user interface than their commercial coun-\nterparts.\
    \ This section describes these tools.\nLinux has the reputation of being just\
    \ for programmers. That's not true, but\nit it does come with one of the best\
    \ programming environments in the industry.\nYou also learn about programming\
    \ environments in this part of the book.\n\n# Part V: Advanced Configuration\n\
    \nIn this section, you learn how to get the most possible out of your Linux sys-\t\
    em. Linux has a number of parameters you can tune and adjust. It also con-\tains\
    \ many advanced features and a few experimental ones. This part describes\nhow\
    \ to access all of them.\n\n# Discovery Center\n\nThe Discovery Center is a unique\
    \ feature of the Discovery series. It presents\nthe key points and procedures\
    \ of the book in a concise format. With it, you can\nquickly and easily find procedures\
    \ that you've learned without wading through\nan explanation."
  merge: -1
