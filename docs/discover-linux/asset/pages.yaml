    # How the X Window System Starts (page 309)


    The X Window system performs the following steps when it is started:


    +   1. The startx command runs.

    2. The script $HOME/.xserverrc is executed. If it''s not present, /usr/X11R6/lib/X11/xserverrc
    is used.

    3. The client starts and then executes $HOME/.xinitrc or, if that''s not present,
    /usr/X11R6/lib/X11/xinit/xinitrc.

    4. This script usually looks for $HOME/.clients and runs if it''s available.


    5. The script runs the initialization programs, as follows:


    | PROGRAM USER FILE | SYSTEM FILE |

    | xrdb | .Resources | /usr/X11R6/lib/X11/xinit/.Resources 1 |

    | xmodmap | .Xmodmap | /usr/X11R6/lib/X11/xinit/.Xmodmap 2 |


    +   1 System resources are loaded first, and then user resources are merged in.

    2 The your keyboard modification map overrides the system one.

    6. The window manager runs.


