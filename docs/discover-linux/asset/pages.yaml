  md: '# CHAPTER TWO


    # INSTALLING

    LINUX


    IN THIS CHAPTER YOU LEARN THESE KEY SKILLS


    +   SPLITTING AN MS-DOS PARTITION IN TWO, ONE FOR

    MS-DOS AND ONE FOR LINUX PAGE 29


    +   UNDERSTANDING HOW LINUX NAMES DEVICES

    PAGE 30


    +   BOOTING THE LINUX INSTALLATION SYSTEM

    PAGE 31


    +   INSTALLING THE SOFTWARE PAGE 32


    +   INSTALLING ADDITIONAL LINUX SYSTEMS

    ON A NETWORK PAGE 42


    ![](img/d86aa78922e215fd387e0c1556445cac_56_0.png)


    Linux provides you with a very rich set of tools, utilities, and games.

    Installing is a little more complex than typing a:setup. This chapter goes

    through the installation process, step by step, so you can get your Linux

    system running with a minimum of hassles.


    # An Overview of the Installation Process


    Before starting the installation, take a quick look at the installation

    process. Each of the following steps is covered in detail in this chapter:'
  merge: -1
  pgno: 56
- img_proc: true
  md: '+   1. Back up your existing data (just in case).


    +   2. If you are installing Linux over an existing MS-DOS partition, split the
    partition by using the First Interactive Partition Splitter (FIPS) utility. (The
    FIPS utility is included with your Linux distribution.)


    +   3. Boot from the Linux CD-ROM (included with this book).


    +   4. Partition the disks as needed.


    +   5. Select the software you want to install.


    +   6. Boot by using the Linux system you just installed.


    The following sections cover the preceding steps in detail.


    # Backing Up Your System


    Before installing any new software, it is always a good idea to back up any existing
    data. That advice does not imply that Linux will destroy your system, but it pays
    to be careful.


    If you don''t have a backup system, go out and buy one, and back up your data.
    The files on your hard disk represent a great deal of time and effort on your
    part — and possibly on the part of others — and they deserve protection.


    Having a backup tape, however, is not enough; you want to be able to restore the
    data if something goes wrong. That means making an emergency diskette. Put a blank
    diskette in drive A, and execute the following commands:


    ```

    C:\DOS> FORMAT A:/S

    C:\DOS> COPY FDISK.EXE A:

    C:\DOS> COPY FORMAT.COM A:

    ```


    The emergency diskette contains enough tools that you can create a blank MS-DOS
    partition if something bad happens. In order to get your data from the backup
    tape, you need a copy of the installation disks for your backup software.


    After a disaster, should you ever experience one, follow these steps:


    +   1. Use your emergency diskette to format your hard drive, and install MS-DOS
    on it.


    +   2. Install your backup software, using its installation diskettes.


    +   3. Use the backup software to restore everything from tape.'
  merge: -1
  pgno: 57
- img_proc: true
  md: '# Splitting the MS-DOS Partition (Optional)


    If your system contains only one large drive with lots of free space, you can
    split the drive into multiple partitions. You accomplish this task by using the
    FIPS utility. After running this program, you have one partition for MS-DOS and
    one that you can split for the Linux root and swap partitions.


    To run the FIPS utility, follow these steps:


    +   1. Make sure that you have backed up your system: You''re about to mess with
    your main hard drive, so a backup is imperative. (At this point, some of you might
    think that all talk about backing up is overkill. You''ll change your mind the
    moment you have your first disk crash).

    2. Put a new diskette in drive A, and install an operating system on it by typing
    the following command:

    ```

    C:\> FORMAT A:/S

    ```


    +   3. Make the CD-ROM your current drive. In this example, the CD-ROM is drive
    F. The location of the CD-ROM drive on your system may be different. To make the
    CD-ROM your current drive, then type the following command (using the appropriate
    drive letter):

    ```

    C:\> F:

    ```

    4. Change directories to the directory containing the FIPS program, as follows:

    ```

    F:\> CD DOSUTILS

    ```


    +   5. Copy the FIPS files to the diskette by using the following commands:

    ```

    F:\DOSUTILS> COPY RESTORRB.EXE A:

    F:\DOSUTILS> COPY FIPS.EXE A:

    F:\DOSUTILS> COPY ERRORS.TXT A:

    ```


    +   6. Print the FIPS documentation,

    ```

    F:\DOSUTILS> PRINT FIPS.DOC

    ```


    +   7. If you are running Microsoft Windows 3.1, make sure that your swap file
    is temporary. (Make it temporary from the 386Enhanced section of the Windows Control
    Panel.)


    ![](img/d86aa78922e215fd387e0c1556445cac_58_0.png)'
  merge: -1
  pgno: 58
- img_proc: true
  md: '8. Defragment your drive with the following command:


    ```

    F:\DOSUTILS DEFRAG C:

    ```


    Configure the utility for full optimization. (The idea is to push all your MS-DOS
    stuff to the front of the disk and let Linux use the back.)


    9. Boot from the diskette in drive A (the one you installed FIPS onto in Steps
    1–5).


    10. Start FIPS by typing the following command:


    ```

    A:> FIPS

    ```


    The program reads the partition table of your first disk and displays the results.


    After a few checks, the program displays the following:


    | Old Partition | New Partition |

    | 200.2 MB | 436 | 197.3 MB |


    The Partition is the partition that will contain the DOS files. The New Partition
    is the blank one that you turn into two Linux partitions later in the installation
    process.


    11. Use the left- and right-arrow keys to change the partition sizes up to the
    maximum allowed. When you have set the correct partition sizes, press Enter.


    12. FIPS gives you a chance to review the partition table before continuing. Press
    Y to continue.


    Finally, FIPS writes out the new partition table.


    13. Remove the diskette, and reboot.


    If you run into trouble, you can install the old partition table by booting off
    the diskette and running RESTORRB program.


    # How Linux Names Things


