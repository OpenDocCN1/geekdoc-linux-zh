    So, to find out my drum file came from, I executed the command asnfollows:


    ```

    [user@pc user$] rpm -q -f /etc/drums.03

    ```


    The result of the command is the following:


    playmidi-2.3-7


    So what does playmidi do? That information I can find with the following command,
