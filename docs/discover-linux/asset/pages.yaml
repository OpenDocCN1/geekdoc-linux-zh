- img_proc: true
  md: 'You then add the following lines to the crontab:

    0 * * 0 /root/dump/sun.sh

    0 * * 1 /root/dump/mon.sh

    0 * * 2 /root/dump/tue.sh

    0 * * 3 /root/dump/wed.sh

    0 * * 4 /root/dump/thur.sh

    0 * * 5 /root/dump/fri.sh

    0 * * 6 /root/dump/sat.sh


    The first field in a crontab entry is the minutes of the execution time, the second
    is the hour. In this scenario, you start at 2:00 a.m. (using a 24-hour clock),
    so these entries are in 0 2. The next two entries are the day of the month and
    the month. Both of these are “don’t care” terms as far as you are concerned, so
    you use * for these fields.


    The fifth entry is the day of the week. Sunday is represented by 0, Monday is
    1, and so on. Finally, you have your command.


    Now everything is automatic. Dumps run each night, and all you have to do is check
    the mail each morning to make sure that the log file is found. Then you just stick
    in a tape now and then.


    As a matter of fact, things are going so well that you can relax a little and
    check out the next part of this book, which tells you how to have fun with Linux
    (sun.sh, mon.sh, . . .).


