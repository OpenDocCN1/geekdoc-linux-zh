    Loopback device support (CONFIG_BLK_DEV_LOOP)[M/n/y/?] n


    The loopback device enables you to put a file system inside a Linux file. This

    is very useful if you''re debugging a file system code, but it''s pretty useless
    for nor-

    mal people. Just say No.


    Multiple devices driver support (CONFIG_BLK_DEV_MD)[Y/n/y/?] n


    This driver enables you to combine multiple disk partitions into one Linux

    file system. To actually use this feature, you need some extra programs


    To use this feature, you need some extra programs; all this option

    turn on kernel support for this feature. If you have a server with lots of

    disk space that you want to run fast, this feature is something you might want
    to

    play around with. For most people, however, this is not needed.


    Linear (append) mode (CONFIG_MD_LINEAR)[M/n/y/?] y

    RAID-0 (striping) mode (CONFIG_MD_STRIPED)[M/n/y/?] y


    These two options control how your multiple disks work together. In linear

    (append) mode, the disks are concatenated. In other words, the last block of the
    first

    partition is followed by the first block of the second, as illustrated in Figure
    15-3.


    | Vitural Disk | Physical Disk 0 |

    |---|---|

    | Block 1 | Block 1 |

    | Block 2 | Block 2 |

    | --- | --- |

    | Block 500 | Block 500 |

    | Block 501 | Physical Disk 1 |

    | Block 502 | Block 1 |

    | | Block 2 |

    | Block 1000 | Block 500 |


    **Figure 15-3** Linear disk configuration'
