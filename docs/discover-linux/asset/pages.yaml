    # # Performing Common X Window Configuration Tasks


    his section describes how to perform some common X Window configuration tasks,
    such as remapping the keyboard and customizing the window manager.


    # ## Putting the Control Key in Its Place


    When IBM designed the PC, it designed a new and different keyboard for the machine.
    Why they did this was a mystery, because the new keyboard was strange, difficult
    to use, and generally considered to be poorly laid. IBM was loudly criticized
    for ignoring the standard word processing keyboard of the time, the one used by
    the IBM Selectric typewriter (which IBM had invented in the first place).


    Over the years, keyboards become more sane. Still, one problem frequently remains:
    manufacturers put the Caps Lock key where the Ctrl key should be.'
