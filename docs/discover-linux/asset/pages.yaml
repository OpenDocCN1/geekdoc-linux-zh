  md: '# LINUX IN

    THE OFFICE


    THIS PART CONTAINS THE FOLLOWING CHAPTERS


    +   CHAPTER 9 USING THE OFFICE TOOLS


    +   CHAPTER 10 THE OFFICE SERVER


    +   CHAPTER 11 LINUX MEETS DOS


    His part describes some of the ways that you can use Linux in the office.


    Considering the number of office applications designed for it, Linux can''t compete
    with Windows 95. Nevertheless, several commercial companies are making traditional
    office products for the system.


    In the server department, however, Linux can serve NFS (UNIX) clients, (NetWare)
    clients and SMB (Windows 95/NT) clients — all at once. It is cheaper and more
    flexible than any proprietary server that tries to lock you into its system.


    MS-DOS is so pervasive that you can''t get away from it. Even though this book
    is being written on a Linux system, for example, the manuscript will be submitted
    on an MS-DOS disk. Linux has several ways for bridging the gap between Linux and
    MS-DOS, including tools that handle MS-DOS diskettes and a complete MS-DOS emulator
    that almost completely works.'
