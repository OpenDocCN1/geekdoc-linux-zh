    # Using the dump and restore Commands


    The dump command is the standard backup command for most UNIX systems: It copies
    an entire partition to tape. You have your choice of copy-ing only the files that
    changed, or the entire partition.


    One of the limitations of dump is that you can''t give it a list of files to back
    up; it works on disk partitions only. True, you can do an incremental dump to
    write only the files that have changed, but you have to do the incremental dump
    on an entire partition. Also, dump doesn''t work on anything except the Linux
    partitions.


    Another problem is that you need to estimate the tape size when backing up. Dump
    is in love with the half-inch 1600BPI tape that was state of the art twenty years
    ago. If you use anything different, you need to tell dump about it through the
    tape size and density commands (which are covered in the following sections).


    A typical dump command is as follows:


    ```

    [root@pc root]# dump Oudbsf 64 15000 15000 \n/dev/st0 /dev/hdc1

    ```


    The elements of this command are the following:


    Oubdfs This parameter is the complex option list. Its various parts are

    follows:


    +   - The level of the dump

    - Updates the /etc/dumpdates file

    - The blocking factor (64) follows

    - The density (15000) follows

    - The tape size in feet (15000) follows

    - The filename of the tape (/dev/st0)


    /dev/hdc1 This is the name of the disk partition to dump.'
