  md: '# # Selecting Hardware


    Linux supports a wide variety of hardware. When buying new hardware, check to
    make sure the item is supported. If you have existing hardware, you may want to
    check the list to see if it''s supported or requires a special hardware driver.


    The one area you need to be careful about is video cards. Although most video
    card manufacturers have been supportive of Linux development, some have refused
    to give driver developers any programming information. This means that support
    is limited, if available at all, for these cards, so check the hardware list,
    and make sure that your video card is supported.


    If you are lucky enough to be buying new hardware for your Linux system, the hardware
    you obtain depends on how you plan to use your Linux system. The following list
    of various uses can help you decide what hardware you need:


    +   * Personal, Home Systems


    Use the hardware you''ve got. Actually, that''s not a good hardware-selection
    policy, but it is the policy forced on most users.


    One thing you should have is a backup system. Most experienced users have backup
    systems, and many of them were purchased after rebuilding large amounts of data
    lost because they didn''t previously have a backup system.


    +   * Small Business Web Server


    You need about 1 to 2 gigabytes (GB) of disk space for the basic server and a
    number of simple Web pages. You need more than if you plan on doing elaborate
    catalogs, technical support documents, or other documents that require large amounts
    of disk space.


    You need support for editing Web pages. Netscape and graphics viewers, editors,
