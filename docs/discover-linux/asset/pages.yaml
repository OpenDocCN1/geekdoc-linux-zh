  md: '# Using ImageMagick


    The ImageMagick package is a collection of programs that perform many functions
    similar to xv. ImageMagick is easier to use from the command line but has a very
    poor GUI compared to xv. The programs that make up ImageMagick include the following:


    +   * display. Displays an image on the screen. The program also can perform a
    number of transformations similar to xv, but its user interface is much more obscure
    and limited.

    * import. Captures a portion of the X screen to a file.

    * animate. Displays a series of images.

    * montage. Creates a montage, or catalog, by combining a set of images into one.

    * convert. Converts files from one format to another.

    * mogrify. Performs a variety of transformations on an image. Her transformations
    include rotation and color transformation.

    * identify. Describes the image, such as the format of the image, number of colors,
    and other information.

    * combine. Combines images to create new images.

    * segment. Performs color segmentation (whatever that is). I tried this program
    on some of my wedding photos, which resulted in images with lousy coloration.

    * xtp. An ftp-like utility that you can run from the command line knows how to
    handle images. Among other things, xtp can automatically retrieve remote images
    and print them.


    # The Portable Bitmap Toolkit


    The idea behind the Portable Bitmap Toolkit (PBM) was to create a set of tools
    that worked with a portable format. This format can be easily moved from machine
    to machine without trouble. The idea was to write converters that converted to
    the portable format, and converted portable files to various graphic formats.
    That, way, you would only have to write 2n instead of $n^2$ converters.


    In addition, the tools cut, paste, and rotate, and you only have to know about
    one format. Therefore, they are much simpler.


    Actually, the PBM toolkit contains three portable formats, and one pseudo-format,
    as follows:'
