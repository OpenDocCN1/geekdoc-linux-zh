  md: 'The next section concerns configuration of some general kernel parameters,
    taking them one at a time:


    +   * General setup


    +   * Kernel math emulation (CONFIG_MATH_EMULATION) [Y/n/?] n


    If you have a 386 computer without a math coprocessor, enable this option so that
    the kernel can fake floating point for you. If your computer isn''t from the dark
    ages, turn this off, and save a little memory.


    +   * Networking support (CONFIG_NET) [Y/n/?] y


    This option turns on networking support. You probably want this option on even
    if you don''t have a network card or expect to connect to the Internet. That''s
    because many programs use internal connections to do their work.


    +   * Limit memory to low 16MB (CONFIG_MAX_16M) [Y/n/?] n


    Some old motherboards can''t properly handle memory over 16MB. If you have such
    a board, this step tells Linux to avoid any memory above that magic 16MB limit.
    Don''t enable this unless you have an old motherboard and experience strange problems
    when you run Linux.


    +   * bios support (CONFIG_PCI) [Y/n/?] n


    Some newer motherboards have a PCI bus for high-performance cards. If you''ve
    got one, you need to enable this option. If you''re not sure, enabling it doesn''t
    hurt anything.


    +   * System V IPC (CONFIG_SYSVIPC) [Y/n/?] y


    IPC stands for Process Communication, which is the way programs talk to each other.
    Unless you''re doing strange — and really know what you''re doing — enable this
    option. A list of programs needs it so that they can talk to each other.


    +   * Kernel support for a.out binaries (CONFIG_BINFMT_AOUT) [Y/n/?] y

    * Kernel support for ELF binaries (CONFIG_BINFMT_ELF) [Y/n/?] y


    There is not, but two standard formats for programs. The old standard, a is quickly
    being replaced by a new program format called ELF. In order to run both types
    of programs, you should enable support for these formats.


    +   * Compile kernel as ELF — if your GCC is ELF-GCC (CONFIG_KERNEL_ELF) [Y/n/?]
    y


    The gcc compiler can generate either a.out or ELF format files. For this controls,
