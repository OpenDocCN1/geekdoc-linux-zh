- img_proc: true
  md: 'This section describes the easy to configure the X Window System the easy way.
    Unfortunately, the easy doesn''t always work. If it doesn''t, you can always replace
    your video card with one Linux supports. If that doesn''t appeal to you, and you''re
    a real masochist, you can write your own configuration file (see Chapter 16 for
    details). But in this chapter, assume that the Xconfigurator program works.


    Before starting, a word of warning: It is possible to damage your hardware by
    misconfiguring this software. Configuring your video card to drive your monitor
    at the wrong frequency can cause damage. In other words, if you are not careful,
    you can smoke your monitor.


    The procedures described in this chapter are designed to minimize the possibility
    of damage.


    # Using the Simple Method


    This is the simplest way to configure your X Window System. For 90 percent of
    the systems available, this method works. For the other 10 percent, advanced methods
    of attacking the problem are covered later.


    For the simple method, follow these steps:


    +   1. Execute the following command:

    [root@pc /root]# Xconfigurator

    2. Choose the video card that you have.

    3. Choose your monitor from the list presented.

    4. Select the correct memory size for your card.

    5. Some configurations require information about the clock chip on your video
    card. Choose the correct chip for your configuration. (If you don''t know which
    clock chip you have, you can determine it by using the SuperProbe command described
    in Chapter 16.)

    6. If your video card supports multiple resolutions, the configuration program
    asks you for a list of modes to install. Note: X Window enables you to switch
    between modes while the system is running. Hot switching means that you can change
    video resolution while the X Window System is running. It does not, however, enable
    you to switch to a different number of colors.


    You may want to choose the highest resolution available for the number of colors
    you want and leave the others unchecked.


    Your configuration is now finished. The next step is to test it.'
  merge: -1
  pgno: 78
- img_proc: true
  md: '# Testing X


    Please read this entire section before starting your X Window System.


    To test your configuration of X Window, follow these steps:


    +   1. Start the X Window System with the following command:

    ```bash

    [root@pc /root]# startx

    ```

    2. If the screen immediately goes crazy, abort X Window by pressing Ctrl+Alt+Backspace.
    If that doesn''t work, immediately press the reset button on your computer, or
    turn off the power. Failure to do this immediately may result in damage to your
    monitor.

    3. Press Ctrl+Alt+Keypad-Plus to cycle through the various video modes. If one
    doesn''t work, abort the X server immediately by pressing Ctrl+Alt+Backspace.


    If everything worked, you''re finished. Go to the next section.


    # If at First You Don''t Succeed . . .


    The next step is to try the Xconfiguration command again with more conservative
    settings. Try creating a configuration with the lowest video resolution available
    (640x480). If that doesn''t work, try selecting another card. If nothing else,
    you can always select the Generic VGA card. That should work with almost anything.


    If nothing works, consider replacing your video card with one that is more Linux
    friendly. You can find a list of them at the Web site: http://sunsite.unc.edu/LDP/HOWTO/Hardware-HOWTO.html


    Finally, other more primitive tools for creating X Window configuration files
    are available. As a last resort, you can write your own. You can find instructions
    for advanced X Window configuration in Chapter 16.


    # Starting X Window


    The startx command brings up the X Window System. If you''re logged in as root,
    after a few minutes an initial screen appears that looks like the one shown in
    Figure 3-1.'
