  md: '# Finding Documentation Files


    linux provides you with a number of tools to search the file system for specific
    files. The first is the standard UNIX find command. For example, to find all the
    files with the string FAQ in their name, use the following command:


    ```

    [user@pc user]$ find -name **FAQ** -print

    ```


    This command tells to find at the root directory (/), search for files with the
    string FAQ in their names ( name "FAQ*"), and print the name of each file found
    (print).


    The find command is slow. A faster way to search for files is to use the locate
    command. This command searches a database containing names of all the files on
    the system. This database is automatically built each day at 1:00 a.m. If you
    don''t want to wait for 1:00, however, you can build it manually as root (which
    is the same as superuser) by executing the following command:


    ```

    [root@pc root]# /etc/cron.daily/updatedb.cron

    ```


    After the database is built, you can find files by using the locate command. To
    locate all files ending in .txt, for example, use the following command:


    ```

    [user@pc user]$ locate "*.txt"

    ```


    > One word of caution: Although this command is fast, it has been known to fail
    by not reporting existing files.


    Finally, you can do a search for any documentation that contains a certain keyword.
    For example, if you want to find all files text that contain the word CD-ROM,
    use the following command:


    ```

    [user@pc user]$ find -name "*.txt" -exec fgrep \

    "CD-ROM" "{}" /dev/null \

    ```


    This command tells to start at the root directory (/), search for files with the
    string .txt (name "*.txt*"), and search them for the string CD-ROM (-exec fgrep
    "CD-ROM" "{}" /dev/null \).


    The -exec option tells to execute a command on each file. In this case, the command
    is fgrep, to search for is CD-ROM, and "{}" is replaced by the name of the file.
    Normally fgrep will not print the name of a file if only one file is specified
    on the command line. To get around this problem, give fgrep two files /dev/null
    (which contains nothing). Finally, signal the end of the command with \;.'
  merge: -1
  pgno: 88
- img_proc: true
  md: '# Viewing Text Files


    Linux provides all the conventional tools for reading text files. These tools
    include the cat and more commands, as well as the view editor command. Linux also
    provides a souped-up more command named less. To get a list of all the features
    of less, type h at the prompt.


    # Compressed Files


    Files ending with .gz are compressed using the GNU gzip command. (Note: Unlike
    the MS-DOS PKZIP command, gzip works on single files only.) There are two ways
    of uncompressing these files.


    The first is to use the gzip command. This command uncompresses the file and replaces
    the .gz file with the uncompressed file. If you are running root, copy the file
    to a temporary directory (such as /tmp) before decompressing it. That way, you
    won''t mess up the installed files. If you are not root, protections will force
    you to copy the file.


    The following is an example of the commands needed to decompress a file (Bootdisk-HOWTO.gz)
    to the /tmp directory and uncompress it by the gzip command:


    ```

    [user@pc user]$ cp /usr/doc/HOWTO/Bootdisk-HOWTO.gz /tmp

    [user@pc user]$ cd /tmp

    [user@pc user]$ gzip Bootdisk-HOWTO.gz

    ```


    Now you can read the file Bootdisk-HOWTO.

    The other method to uncompress .gz files is to use the command zcat. This command
    decompresses the file and sends the output to standard out. For example:


    ```

    [user@pc user]$ zcat /usr/doc/HOWTO/Bootdisk-HOWTO.gz | less

    ```


    # The Man Pages


    The man pages are the oldest form of UNIX documentation. They provide quick access
    to command summaries for almost all the Linux commands. The man pages, however,
    are limited in scope. They don''t provide tutorial or extensive documentation.
    As one programmer said, "They are a great way of finding an answer if you already
    know the answer.\ The normal use of the man command is as follows:


    ```

    [user@pc user]$ man subject

    ```'
  merge: -1
