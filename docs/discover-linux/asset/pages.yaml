  md: '# TABLE 12-3 Commands for Manipulating Images


    | Command Sequence | Function |


    | ALGORITHMS → BLUR | Blurs the edges of the image. |


    | ALGORITHMS → SHARPER | Sharpening the image. |


    | ALGORITHMS → EDGE DETECT | Detects horizontal and vertical edges. |


    | ALGORITHMS → EMBOSS | Makes the image look embossed. |


    | ALGORITHMS → OIL PAINTING | Makes the image look like an oil painting. |


    | ALGORITHMS → BLEND | Blends the edges of the image. |


    | ALGORITHMS → COPY ROTATE | Makes a copy of the image, rotates it by a user-supplied
    number of degrees, and pastes it over itself. |


    | ALGORITHMS → CLEAR ROTATE | Rotates the image by a user-supplied number of degrees,
    and pastes over a clear image. |


    | ALGORITHMS → PIXELIZE | Runs a pixelization algorithm that obscures part of
    the image. The result is something like the technique used by TV shows to hide
    the faces of people they don''t want shown. |


    | ALGORITHMS → SPREAD | Performs a random spread algorithm on the image. A random
    spread occurs when each pixel is exchanged with another a random distance away.
    |


    | ALGORITHMS → DESPECKLE | Removes noise from the image. Noise is the name for
    pixels that should not be part of the image. xv attempts to identify out-of-place
    pixels and remove them. |


