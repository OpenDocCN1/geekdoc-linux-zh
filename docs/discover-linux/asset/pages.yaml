    # CHOOSING PASSWORDS


    One problem with passwords is that a lot of password-guessing programs are out
    there. One, crack, is easily distributed with LILO. One way of making difficult-to-guess
    passwords is to generate a totally random string, such as Gzj3-fd. The trouble
    is that it''s impossible to remember, so people write down a random password,
    totally destroying its security.


    So you need a password that''s easy to remember and difficult to guess. One way
    to create such a password is to pick two random words out of a dictionary (or
    this book) and separate them by a random digit or other character, such as select#month.
    You can make this password even more secure by varying the case of the words.


    Or you could did:

    CORPORATE DIRECTIVE NUMBER 88-507471


    In order to increase the security of all computing facilities, and to avoid the
    possibility of unauthorized use of these facilities, new rules are being put into
    effect concerning the selection of passwords. All users of computing facilities
    are instructed to change their passwords to conform to these rules immediately.


    RULES FOR THE SELECTION OF PASSWORDS:


    +   1. A password must be at least six characters long, and must not contain two
    occurrences of a character in a row, or a sequence of two or more characters from
    the alphabet in forward or reverse order. Example: HGQQXXP is an invalid password.
    GFEDCB is an invalid password.


    (continued)'
  merge: -1
  pgno: 70
- img_proc: true
  md: '# CHOOSING PASSWORDS (continued)


    2. A password may not contain two or more letters in the same position as any
    previous password. Example: If a previous password was GKPWTZ, then NRPWHS would
    be invalid because PW occurs in the same position in both passwords.


    3. A password may not contain the name of a month or an abbreviation of a month.
    Example: MARCHBC is an invalid password. VWMARBC is an invalid password.


    4. A password may not contain the numeric representation of a month. Therefore,
    a password containing any number except zero is invalid: WKBH33G is invalid because
    it contains the numeric representation for the month of March.


    5. A password may not contain any words from any language. Thus, a password may
    not contain the letters A, o, I, or sequences as AT, ME, or TO because these are
    all words.


    6. A password may not contain sequences of two or more characters that are adjacent
    to each other on a keyboard in a horizontal, vertical, or diagonal direction.
    Example: QWERTY is an invalid password. GHLNT is an invalid password because G
    and H are horizontally adjacent to each other. HUKWVM is an invalid password because
    H and U are diagonally adjacent to each other.


    7. A password may not contain the name of a person, place, or thing. Example:
    JOHNBOY is an invalid password.


    Because of the complexity of password selection rules, there is actually only
    one password which passes all the tests. To make the selection of this password
    simpler for the user, it will be distributed to all supervisors. All users are
    instructed to obtain this password from his or her supervisor and begin using
    it immediately.


