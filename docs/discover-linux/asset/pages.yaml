  md: 'Connect the student systems to a central server with lots of disk space. This
    system should have a reliable network to handle all the student systems. One caution,
    however: don''t make the video card, monitor, or sound anything better than the
    student systems. If you do, you''ll have a lot of teachers pressing you to upgrade
    all the student systems so that they have all the neat hardware that you put on
    the big system.


    Finally, choose a backup system. Which backup system you choose depends on your
    backup policy. You should have enough capacity to back up the system files. If
    you plan on backing up teachers'' and students'' personal files, you need a higher
    capacity system. (If your school has a policy of not backing up personal files,
    be prepared to explain this policy to that irate teacher or student who has just
    discovered that he or she deleted a vital file.)


    # Dividing the Disk


    linux requires a minimum of two disk partitions: a small one for swapping, and
    a large one for the file system. If you plan on running MS-DOS-Windows 95, or
    some other operating system, you need a partition for it as well.


    Your swap partition should be at least four times your memory size, or a minimum
    of 30MB. Allocate more space if you plan on running animations, because the animation
    program is a real memory pig. In this case, you should allocate at least 100MB
    of space. A full Linux system can use up to 400MB of disk space, just for the
    operating system and utilities. In addition to the space for Linux itself, you
    need space for users'' home directories, as well as space for any additional applications
    you install.


    > NOTE In all UNIX systems, the amount of disk space required is 1.5 times the
    amount of disk space available. Someone has seriously suggested that the UNIX
    should be shipped with a preinstalled message of the day that asks users to clean
    up their disk space.


    Figure 1-1 is a disk allocation checklist. Use it to figure out how to lay out
    partitions.'
  merge: -1
