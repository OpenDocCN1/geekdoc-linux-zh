  md: '# CHAPTER SIX


    # BACKING UP


    IN THIS CHAPTER YOU LEARN THESE KEY SKILLS


    +   - UNDERSTANDING HOW LINUX TREATS MAGNETIC TAPE PAGE 93

    - LEARNING COMMANDS TO MANIPULATE MAGNETIC TAPE PAGE 98

    - UNDERSTANDING THE LINUX TAPER SYSTEM PAGE 102

    - LEARNING THE COMMON BACKUP COMMANDS PAGE 104


    ![](img/d86aa78922e215fd387e0c1556445cac_122_0.png)


    At this point, you''ve spent a great deal of time getting your Linux system running.
    In order to preserve your work, it''s an excellent idea to back up your system.
    Linux provides several ways of saving your data to tape. This chapter discusses
    the most common ones.


    # The Care and Feeding of Magnetic Tapes


    In order to use magnetic tape devices to maximum effect, you need to know a little
    about how Linux treats them. UNIX''s use of magnetic tape has its roots in half-inch
    tape drives for the old mainframe computers. Magnetic tape is written by moving
    the tape over the write head. Without getting too detailed, suffice it to say
    that electrical current in the write head changes the magnetic properties of the
    tape, thus storing the data.'
  merge: -1
  pgno: 122
- img_proc: true
  md: 'reading the information on magnetic tape is accomplished by moving the tape
    over the read head.


    Take a look at what is actually written on the tape. Suppose that you are making
    a tape (also known as “doing a dump”), and your program writes out a 10K buffer
    to the tape. The drive spins and writes out 10K worth of data to the tape. This
    is called a physical record, and it has a record size of 10K. After the data is
    written, the tape drive writes a small amount of blank tape, called an end-of-record
    gap (see Figure 6-1).


    ![](img/d86aa78922e215fd387e0c1556445cac_123_0.png)


    **Figure 6-1** A representation of magnetic tape format


    A special kind of record, called an end-of-file (EOF) marker, indicates the end
    of a magnetic tape file (see Figure 6-2).


    ![](img/d86aa78922e215fd387e0c1556445cac_123_1.png)


    After close, the tape head is positioned between the EOF marks


    If the tape is opened again and more data written, the EOM mark is wiped out and
    only an EOF mark remains


    ![](img/d86aa78922e215fd387e0c1556445cac_123_2.png)


    **Figure 6-2** End of tape handling


    An empty file (two EOF markers in a row) indicates the end of data on the tape.
    This empty file is called end-of-media, or EOM.'
  merge: -1
  pgno: 123
- img_proc: true
  md: 'One trick frequently used by magnetic tape drivers is to write two EOF markers
    (which is one EOM mark) whenever the tape is closed. If the tape is opened and
    more data written, the EOM mark must be erased. Because the tape is positioned
    in the middle of the two EOM markers that make up the EOM, any writing will wipe
    out one of the EOM marks, leaving just an EOF.


    Linux has an option that enables this. It is not enabled by default, because some
    tape devices cannot traceback. Unless this trick is enabled, you can''t space
    for the end of the media. You use the mt command to enable this feature.


    Linux has an option that automatically writes two EOF markers (an EOM mark) when
    the device is closed. It then backspaces over one of them. That when you start
    writing a new file, the first block of the new file wipes out the second EOM marker,
    thus erasing the EOM marker. Some tape devices do not support a bookcase file,
    so this feature is disabled by default. You can enable it with the mt command.


    One thing to remember about tapes is that you always write at the end of the media.
    You can''t go back and replace a record that you''ve written previously wiping
    out the rest of the tape. In other words, tapes are not like disks, where you
    can just write to any block you want to.


    # Tape Device Names


    Linux supports several different tape devices. These include everything from the
    cheap HP/Colorado backup tapes, to the more expensive SCSI 4mm and 8mm tape drives.
    Linux even supports the old half-inch reel-to-reel drives. The following are kinds
    of tape devices that Linux supports:


    +   * SCSI tapes are connected through the SCSI controller. These tapes include
    the 4mm and 8mm devices commonly used for backing up large systems.

    * Fapes (floppy tapes) connect to the floppy controller. These types of tapes
    include many of the Colorado/HP cartridge tapes.


    Table 6-1 lists the names of the various kinds of tape devices.


    | Device | Description |

    | --- | --- |

    | /dev/st0 | SCSI tape #0 |

    | /dev/st1, /dev/st2... | Other SCSI tape drives |

    | /dev/rft0 | Floppy tape #0 |

    | /dev/ftape | Symbolic link to the floppy tape |'
  merge: -1
  pgno: 124
- img_proc: true
  md: 'Actually, each device has two names. Table 6-1 lists the regular, or rewinding,
    name. When the tape is closed, the device is rewound. By putting the letter n
    in front of the name, you get the non-rewinding device name. For example, the
    non-rewinding version of `/dev/st0` is `/dev/nst0`. When these devices are closed,
    no movement occurs.


    # Using the mt Command


    The mt command is a magnetic tape manipulation utility. Take the following command,
    for example:


    ```

    ```user@pc user]$ mt -f /dev/nftape rewind

    ```


    This command rewinds the floppy tape /dev/nftape. Other commands include those
    listed in Table 6-2.


    | TABLE 6-2 The mt Commands |

    | Command | Description |

    | eom | Space to end-of-media (EOM) |

    | fsf <count> | Forward space file <count> files |

    | bsf <count> | Backspace <count> files |

    | off | Rewind tape and put the drive offline (eject the tape) |

    | erase | Erase the tape |


    How do you use the mt command? You start by inserting a tape into the drive. The
    tape is automatically rewound upon insertion. When you put data on the tape by
    using the `tar` command, as shown here, it is placed on the front of the tape
    (the `tar` command is described in a later section of this chapter):


    ```

    ```user@pc user]$ tar cf /dev/nftape agenda.txt

    ```


    Because the non-rewinding device (`/dev/nftape`) was used, the tape is left positioned
    at the end. Now add another file to the tape, as follows:


    ```

    ```user@pc user]$ tar cf /dev/nftape letters.txt

    ```


    To get the data off the tape, you must first rewind the tape by issuing the following
    command:


    ```

    ```user@pc user]$ mt -f /dev/nftape rew

    ```'
