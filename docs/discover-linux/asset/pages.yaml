  md: "![](img/d86aa78922e215fd387e0c1556445cac_164_0.png)\n\n# # News\n\nost ISPs\
    \ make Usenet news available through the use of an NNTP server. Linux has several\
    \ news readers who get their news from a remote server. \n\nBefore you start,\
    \ you must set the environment variable NNTPSERVER to the name of your server,\
    \ as follows: \n\n```\n[user@pc user]$ NNTPSERVER=news.connectnet.com\n[user@pc\
    \ user]$ export NNTPSERVER\n```\n\nThese commands should probably be put in your\
    \ .profile or .cshrc initialization file. \n\nAfter that, you can run your favorite\
    \ news reader. The popular programs for Linux are trn, tin, and slrn. Each has\
    \ its own advantages, disadvantages, and loyal followers. \n\n# # BONUS\n\n# #\
    \ Sharing Linux and Learning More\n\nthe growth of Linux depends on sharing. For\
    \ that reason, a huge number of Linux-related sites are out there. This section\
    \ contains just a few of the major ones."
