  md: '# IPX Server


    ne of the unusual features of Linux is that it supports the use of multiple network
    protocols. TCP/IP is the major protocol currently used in, but many PC networks
    use the IPX protocol developed by Novell. Linux has a number of programs designed
    to support IPX clients. These tools are documented in /usr/doc/mars-new-0.98p18-1.


    # AppleTalk

    DDP


    The Red Hat distribution does not include an AppleTalk server, but one is available
    for Linux. Go to the following Web address to get it:


    ftp://terminator.rs.itd.umich.edu/unix/netatalk


    # RAID


    inx comes with a RAID (Redundant Array of Inexpensive Disks) driver. This device
    supports linear, raid-0, and raid-1 disks. A linear disk is simply a large disk
    made out of two smaller ones. A Raid-0 disk uses disk striping, in which the software
    divides up writes between different disks. Finally, raid-1 copies or mirrors data
    on different disks, giving you a great deal of redundancy and safety at the expense
    of using a lot of disk space.


    Although the RAID driver comes with the kernel, the tools to enable and configure
    it do not. You can download them from ftp:ftp.redhat.com/pub/contrib/RPMS. The
    package is named md-version. (The md stands for multiple-disk.)


    After you install the software, you use the mdadd and mdrun commands to create
    your RAID drive.


    > Be aware that the RAID software is still experimental, so use it with caution.'
  merge: -1
