    # A Comparison of Backup Tools


    Which backup tool should you use? Whichever one makes you the\most comfortable.
    This section presents a comparison of the various

    tools so that you can make your decision. Some of these ratings are subjective,
    so you may want to do some experimentation on your.

    The "Ease of Use" and "Reliability" ratings are based on my own experience.

    Some backup tools enable you to not only local tapes, but tapes on other systems.
    A tape specification of sabina:/dev/st0, for example, tell tar to use

    tape /dev/st0 on the system sabina.

    Different programs deal with end-of-tape in different ways. For example,

    t has the capability not only to detect end-of-tape, but also to run a shell

    script to change tapes. The cpio program just dies if it runs out of tape.

    The format of the tape has a great deal to do with how fast you can do a

    store. For example, tar and cpio write out their tapes as follows:


    +   file header, file data

    file header, file data

    file header, file data


    This means to get a table of contents, you have to read the entire tape

    to find all the file headers. The Taper program keeps its table of contents in
    a

    disk database. Not is only finding a much faster, Taper doesn''t need the tape

    to locate a file. With Taper, you can find the file in the database and then figure

    out which tape you need to to restore it.

    The dump program writes out a table of contents at the beginning of the

    tape. This means that getting a list of files or picking out files to restore
    is

    relatively quick.

    As you can see, each backup system has its own advantages and disadvant-

    tages. Table 6-3 compares the features of each one.'
