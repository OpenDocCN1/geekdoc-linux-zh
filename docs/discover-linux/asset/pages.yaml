    These questions will tell you the kernel sorts of devices you are going to hang
    on the SCSI bus. The generic driver is used for specialized devices, such as scanners,
    and enables a program to have almost direct access to the device.


    +   * Some SCSI devices (e.g. CD jukebox) support multiple LUNs


    Probe all LUNs on each SCSI device (CONFIG_SCSI_MULTI_LUN) [N/y/?] n


    SCSI was first defined as though users would have eight controllers, and each
    controller would have eight logical devices (Logical Unit Numbers, or LUNs) on
    it. It turns out most SCSI devices have the controller built into the device and
    respond to LUN 0. Some of the more unusual devices still use multiple LUNs. If
    you have one of these, you need to enable this option.


    Don''t enable this option if you don''t have a device, because probing for unavailable
    devices takes time.


    ```

