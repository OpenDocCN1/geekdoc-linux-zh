  md: '# REAL LIFE LINUX:

    BEGINNING OF

    COMPUTER MULTIMEDIA


    The first computer music I ever heard came from a machine without a sound card.
    In fact, it had no sound hardware at all. The speaker was never connected to the
    machine.


    The machine was a PDP-8, an old one with about 1,000 transistors in it. No integrated
    circuits, mind you, just transistors.


    One of the problems with the PDP-8 was radio interference. If you put a radio
    in front of the machine, the radio squealed. Someone determined that computer
    instructions caused different frequencies of interference. A smart programmer
    used this knowledge to produce one of the early sound-generation systems.


    A whole language was designed, MUSIC-B, to support sound generation. The sound
    wasn''t all that great. There was a lot of hissing, and the system could play
    only one note at a time. But we loved it. After all, we were hackers, and getting
    something out of the machine than the ''suits'' thought possible was what we lived
    for.


    MUSIC-8 enabled you to key in songs on the keyboard and store them on DEC-Tape.
    (DEC-Tape was what you used on DEC equipment before diskettes were invented).


    A few years later, I saw my first machine with a real sound card, the PDP-10 at
    Caltech. Since that time, the use of


    computer sound and graphics have exploded exponentially. Today, you can do a professional
    job of enhancing, editing, and touching up photographic-quality images.


    Soon, a photograph won''t be considered reliable evidence in a court of law.


    Actually creating photographic-quality images takes longer. Several 3-D ray tracing
    passages for Linux are available, but expect to wait while the time you press
    Render and the time you see your picture.


    You can use a computer to display movies, but only short clips and with a very
    limited size. Television-quality movies are beyond the capabilities of current
    machines without the help of special hardware.


    Filmquality movies are still out of the question. Only the movie studios have
    anything to do with producing them on computers. At a high resolution, the amount
    of data you have to deal with is mind-boggling.


    Linux is on the cutting edge of multimedia technology. I use it to download and
    play music songs from my favorite group, The Capitol steps (http://www.capsteps.com).
    One of the best animations I''ve seen.


    As hardware gets faster and capable of handling better-quality pictures and sound,
    Linux will be right there with the software to drive it.


    ![](img/d86aa78922e215fd387e0c1556445cac_259_0.png)'
  merge: -1
  pgno: 259
- img_proc: true
  md: '# CHAPTER TWELVE

    LINUX AND

    MULTIMEDIA


    IN THIS CHAPTER YOU LEARN THESE KEY SKILLS


    +   LEARNING ABOUT THREE SETS OF IMAGE-PROCESSING TOOLS PAGE 231

    USING DRAWING TOOLS PAGE 247

    USING SOUND UTILITIES PAGE 249

    USING ANIMATION TOOLS PAGE 251


    linux contains a rich set of multimedia tools. These tools include three major
    image packages, as well as tools to handle sound and video. Linux has the tools
    to view and manipulate multimedia files in an wide variety formats.


    # Using Image-Processing Tools


    image-processing tools enable you to view and manipulate images. These manipulations
    include cropping, color correction, noise reduction, sharpening, blurring, and
    other specialized manipulations, such as the oil painting algorithm.


    # The xv Command


    Using the xv command, you can view, convert, manipulate, and print graphics files.
    Start the program with the following command:


    ```

    [user@pc user]$ xv <file-list>

    ```'
  merge: -1
  pgno: 260
