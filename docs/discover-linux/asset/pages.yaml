  md: '# # QUICK TOUR


    IN THIS QUICK TOUR YOU LEARN


    +   HOW LINUX GOT STARTED | PAGE 1


    +   HOW YOU CAN USE LINUX | PAGE 2


    +   HOW FREE SOFTWARE COMPARES WITH COMMERICAL SOFTWARE | PAGE 3


    +   HOW TO PRONOUNCE LINUX | PAGE 6


    ![](img/d86aa78922e215fd387e0c1556445cac_30_0.png)


    Discover books are supposed to include a Quick Tour so readers start producing
    in just a couple of pages. Unfortunately, you can''t do that with Linux — but
    more about that later. First, you may be wondering just exactly what Linux is.


    # ## Is Linux?


    Linux is the greatest collection of free software around. It includes a high-powered
    operating system, the X Window System, and a collection of utilities and games.


    Linux started out as a college project by a student named Lin Torvalds at Helsinki
    University. He accumulated a large amount of publicly available software and used
    it to make his own operating system. Because much of his work was based on a UNIX
    clone named Minux, he called his new operating system Linux.


    He started work on Linux around July 1991. His first kernel, version 0.01, was
    released a short time later. It lacked several important features, the most significant
    of which was the capability to run.


    The first usable version, version 0.02, was released on October 5, 1991. Since
    that time, the number of people working on Linux has grown tremendously. No one
    company owns the code to Linux, unlike other operating systems.'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'Therefore, no company has exclusive rights to distribute it. Several different
    people have taken Linux, wrapped everything in a neat package, and created their
    own "distributions." Some of the most popular distributions are from Debian, Slackware,
    and Red Hat.


    The CD-ROM accompanying this book contains a copy of the Red Hat 4.2.1 distribution.
    I chose this distribution because it is the most robust and easiest to install.


    # The Free Software Foundation


    any of the Linux utilities and compilers come from the Free Software Foundation.
    Richard Stallman founded the Free Software Foundation in 1983 to promote the creation,
    distribution, and use of free software. To do this, the Free Software Foundation
    started the GNU project. The goal of this project is to produce a UNIX-like utilities
    and operating systems.


    Linux is not the GNU operating system. That system, the HURD, is still experimental.
    Linux, however, does make use of a tremendous number of free utilities, as well
    as the GNU compiler, `gcc`.


    Without the use of the Free Software Foundation''s programs, Linux never could
    have gotten off the ground.


    # What Is "Copyleft?


    oth Linux and the Free Software Foundation''s programs are protected by the GNU
    "Copyleft." Stripped to its bare minimum, it states that you can copy and use
    the code for free, but must let anyone else copy and use the code for free as
    well. You can find the full text of the "GNU Public License" in the file named
    COPYING on the CD-ROM that accompanies this book.


    # What Can Linux Be Used for?


    unix is a full-featured operating system. It has tremendous network and multiprocessing
    capabilities. As such, it can perform a variety of jobs. These jobs include the
    following:


    +   * Web Server. Linux has a number of networking features that make it simple
    and easy to connect to the Internet. It includes a Web server called Apache, so
    you can have a robust, low-cost Web system.


    One of the best things about this system is that it costs next to nothing.'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'Comparable systems provided by Microsoft and other manufacturers thousands
    of dollars. With Linux, not only do you get a better Web server than Windows NT,
    but you get it cheap.


    +   * File Server. Linux contains a rich set of networking tools, and you can
    set up Linux as a server for most major networks. Software is available not only
    for the Linux NFS protocol, but also for the Microsoft SMB services. Linux enables
    you to cheaply and easily set up a highperformance, companywide network server.


    +   * Educational System. Setting up a bunch of computers for an educational institution
    can be expensive if you use Microsoft software. You must pay Mr. Gates a fee for
    each operating system, compiler, and application you use.


    With Linux, you pay nothing for the operating system, nothing for the compilers,
    and nothing for the applications. Even better, the quality of these tools is generally
    superior to most of the available commercial software. In addition, you get the
    full source code, so if your students want to take something apart to see how
    it works, Better yet, they can improve things, and make a contribution to the
    Linux project.


    +   * Games Machine. Linux has a rich collection of games. And with Linux''s network
    capability, you can play against your friends, or play while doing other work.


    +   * Internet Machine. Linux enables you to connect to the Internet in a variety
    of ways by providing a tremendously rich set of tools for accessing the Internet.


    +   * All of the above — at the same time. Linux is a true multitasking system.
    You can surf the Internet, use the flight simulator to have a dogfight with your
    friends, read mail, and provide file services for a company, all at the same time.


    # How Free Software Compares with Commercial Software


    et''s take a look at the differences between commercial software and free software
    as Linux. First, consider quality. Commercial software gives people the impression
    of quality. After all, if the software wasn''t any good, how could they charge
    money for it? On the other hand, the noncommutative software is free, so it can''t
    be any good, right?


    Actually, the reverse is true most of the time. Commercial programs have a'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'small number of people working on them. Because users get source code with
    Linux, thousands of people all over the world it. More people on Linux increases
    the likelihood of improving it.


    What’s even better, the people who make the software also use it. <<ands of utilities
    were created by people who needed a program to do a specific job. They needed
    a program — and wrote it.


    In other words, Linux developers are necessity orientation. Commercial software
    programmers, on the other hand, are profit oriented. A commercial programmer can''t
    start creating a new program until management approves it. And approval isn''t
    given if management doesn''t think that they can make a buck off the program.


    The result is that Linux programs are useful, practical, and rather plain programs.
    Commercial tools tend to look good in a marketing brochure, but — don’t deliver
    much usefulness.


    # Price


    The purchase price of Linux is nothing. (In fact, you can even find it inserted
    at the back of some of the better books as a premium.) If you want support, however,
    you must buy it from a consulting firm, such as Red Hat. You must purchase a lease
    for commercial software, but support is free.


    # Installation


    One reason that this Quick Tour isn''t the traditional Discover type is installing
    Linux isn''t that simple. You see, Linux is an entire operating system and tool
    set. It''s much more difficult to install than just typing :setup, and pressing
    Enter.


    Linux requires its own disk partitions (two of them). It also comes with thousands
    of programs. You can configure it as an Internet server, a programming workhorse,
    an office server, a multimedia machine, or any combination of those. For that,
    configuration planning is vital to getting optimal performance out of your system.


    Microsoft Windows comes with very few drivers: when you purchase hardware, it
    probably comes with Windows drivers. Very few hardware manufacturers, however,
    supply Linux drivers. That''s not much of a problem, though, because Linux comes
    with a great drivers that cover most of the popular cards — and a few of the unpopular
    ones.


    Installation goes more easily, however, if you know what hardware you have on
    your system. You can get this information readily from Windows — but not if you''re
    halfway through the Linux installation process. Again, planning makes the installation
    process run much smoother.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '![](img/d86aa78922e215fd387e0c1556445cac_34_0.png)


    A botched Linux installation can easily wipe out your hard drive. In extreme cases,
    you can smoke your video card.


    You can avoid these problems by planning before you start. Remember the ancient
    proverb: “Make haste slowly.” Your installation might not be very fast by thinking
    about it first, but you can avoid the problem of installing Linux over and over
    again.


    In an effort to give a smooth introduction to Linux, this book takes you through
    the basics of Linux as quickly as possible while still explaining how to do things
    correctly.


    Windows 95 installed on most new computers these days. Even if you need to install
    the system from scratch, Microsoft has tried very to make it as easy and painless
    as possible. The catch is that you must install it the way Microsoft intended;
    you have few options. One big problem with Microsoft applications is that they
    all want to install a little in the Windows directory. This can be a big problem
    if your C drive is full.


    Linux gives you more flexibility, meaning that you can install it in a variety
    of ways. Flexibility, however, comes at the cost of simplicity.


    It sounds like the commercial software is cheaper to install. In real life, ever-it
    is not so simple. You frequently will run into trouble. If you do, you have to
    call the support line. That means you may get to spend two or three hours on before
    you''re connected to a totally clueless service representative who listens to
    you and says, “Gee, I''ve never heard of that. I don''t know what to do.


    If you run into problems with Linux, forget calling the support line: there isn''t
    one. Instead, post a message to the Internet. You''ll generally get a response
    in a couple of days.


    If you really need help, you hire a consultant. Or you can pay Red Hat. Unlike
    the customer service people at commercial establishments, these people know their
    jobs. That''s because you''re telling them, “Fix this problem, or you don''t get
    paid.


    # Documentation


    It used to be that applications came with well-written documentation. Starting
    with Windows 3.1, people started putting the documentation on CD-ROM. The quality
    of this documentation plummeted.


    Documentation for free software has always come with the software in the form
    of online documents. Unfortunately, the quality of this documentation is generally
    poorer than its commercial counterparts. It''s also more difficult to'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'One good thing about the documentation for free software, however, is that
    it''s much more honest than its commercial counterparts. Whereas a commercial
    network package trumpets a long list of supported hardware, the Linux documentation
    states “3C501, supported, but don''t use this one because it''s a loose card.


    In both cases, the quality of the documentation is not good. The up side to this
    situation is that it creates a market for third-party books, such as Discover
    Linux, which documents the software in plain English.


    # Diagnostics


    I fixed a Windows for Workgroups network. It took me three hours to figure out
    what was wrong. The problem was that the software just wouldn''t work. No error
    messages, no warnings, no nothing. The code contained no diagnostics at all.


    The problem was that one of the network terminators had fallen off. If that had
    been a Linux system, every computer on the network would have been screaming about
    the lack of carrier on the network. Linux comes with a great tools and utilities
    for diagnosing problems. The tools are extremely useful and well-designed, the
    people who wrote them are the people who use them.


    If you are responsible for a companywide network, diagnostics are critical. I''ve
    seen an entire company shut down for an entire day, with a hundred engineers idle,
    because one guy configured his PC incorrectly and put it on the network. The company
    lost more than $100,000 because of that little incident.


    If the employee had tried to attach a Linux machine instead, he would have been
    greeted by a large number of verbose, persistent errors telling him that something
    was wrong.


    Linux contains great many tools to find problems, which have been written by people
    who have to solve problems.


    # Pronunciation


    One of the burning issues in the Linux community is how to pronounce the name.
    I once listened to Linus Torvalds say, “I pronounce it Linux.” The “Linux” was
    pronounced with a Finnish accent that no American could hope to produce. According
    to Linus, however, the appropriate American pronunciation is with a short ih sound.
    Linux, therefore, should rhyme with Minux.'
  merge: -1
