  md: 'On a server, the configuration file /etc/exports controls which directories
    NFS makes available to its clients. Each line in this file consists of a directory
    to export and a set of options. To make all the home directories available, for
    example, use the /etc/exports file containing the following directory entry:


    ```

    /home

    ```


    To create an NFS server, follow these steps:


    +   1. Edit the /etc/exports file so that it includes the directories you want
    to export.


    +   2. If the NFS server programs, /usr/sbin/rpc.nfsd and /usr/sbin/rpc.mountd,
    are not running, start them by issuing the two commands:


    ```

    [root@pc root]# /usr/sbin/rpc.nfsd

    [root@pc root]# /usr/sbin/rpc.mountd

    ```


    +   3. If the nfs program is running, tell it that you have modified the exports
    file by using the following command:


    ```

    [root@pc root]# kill -TERM <pid>

    ```


    Here, <pid> is the process number of the nfs program.


    PC-NFS is an NFS client for MS-DOS. It works much like any other NFS client, except
    that it requires extra support on the server side. A daemon called pcns handles
    this server-side support. The source for this program, as well as instructions
    on how to install it, are included in the PC-NFS software package.


    # NFS Client


    unix comes with a built-in NFS client system. You can import other NFS servers''
    disks simply by mounting them. The automounter program (see the following section)
    can do this for you, or you can do it manually.


    To mount a disk using NFS, follow these steps:


    +   1. Edit the /etc/fstab file and add a new entry for the mount. A typical entry
    looks like the following:


    ```

    sabina:/usr /sabina nfs bg.defaults.intr

    ```


    +   2. Create the directory where you want the file system mounted, as in the
    following example.


    ```

    [root@pc root]# mkdir /mnt/sabina

    ```'
