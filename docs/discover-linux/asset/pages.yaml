  md: '# TABLE 5-3 Linux Hard Disk Partition Names


    | Linux Name | Description |

    |---|---|

    | /dev/hda2 | Partition #2 on first IDE drive |

    | /dev/hda3, /dev/hda4,... | Additional partitions on the first IDE drive |

    | /dev/hdb | Second IDE disk (whole drive) |

    | /dev/hdb1 | Partition #1 on second IDE drive |

    | /dev/hdb2, /dev/hdb3,... | Additional partitions |

    | /dev/sda | First SCSI disk drive (whole disk) |

    | /dev/sda1 | Partition #1 on first SCSI drive |

