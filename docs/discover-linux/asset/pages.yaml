  md: 'Now the only things needed to get on the Internet are the login details. You
    can easily determine these details by experimentation.

    The program minicom, which is a part of Linux, is a terminal emulation program.
    You use it in this chapter to get to your service provider. By enabling logging,
    you can record everything you do on the system. You can then use this information
    to create a chat script for the PPP connection.


    # Starting minicom


    In this section, you will learn how to use the terminal emulator minicom to discover
    the exact sequence of commands needed to connect to your ISP.


    Most of the time, your ISP will provide you with a free Windows program to enable
    you to connect to your system. The details of how to get connected are buried
    in this software. Your ISP didn''t provide you with Linux software, however, so
    you have to find out details for yourself. Don''t worry, it''s not difficult.


    Follow these steps to start minicom:


    +   1. The first step is to make sure that the variable MINICOM is not set. Some
    of the initial "dot" files supplied with new accounts may set this variable. I''ve
    found out the hard way that the value supplied by these dot files is not very
    useful.

    To make sure MINICOM is not set, use the following command:

