    # # Adding an MS-DOS Partition


    If you are running a system with both Linux and MS-DOS on it, you can mount your
    MS-DOS partition as part of the Linux file system.


    To mount an MS-DOS partition, follow these steps:


    +   1. Create a directory where the file system is to be mounted. In this example,
    create the directory /mnt/dos by using the following command:


    ```

    ```root@pc root]# mkdir /mnt/dos```

    ```


    +   2. Add an entry to the /etc/fstab file that looks like the following:


    ```

    ```/dev/<device> /mnt/dos msdos defaults 1 1```

    ```


    Here is a breakdown of the elements:


    ```

    ```/dev/<device> The device name of the disk containing the MS-DOS partition.```

    ```


    ```

    ```/mnt/dos The name of the directory where the partition is to be mounted.```

    ```


    ```

    ```msdos The file system type.```

    ```


    ```

    ```default Options. These are the backup frequency (default) and file system check
    pass. (The second pass is number 1. The first, number 0, is reserved for the root
    file system.)```

    ```


    # # Adding Another Linux Partition


    Of course, Linux allows for the mounting of other Linux partitions. Some people
    separate system files and user files into separate partitions. Others just use
    one large partition.


    To mount another Linux partition, follow these steps:


    +   1. Create a directory where the file system is to be mounted. In this example,
    create the directory /mnt/disk_2 by using the following command:


    ```

    ```[root@pc root]# mkdir /mnt/disk_2```

    ```'
