- img_proc: true
  md: 'Some IDE cards are buggy. In particular, the CMD640 chip has a nasty bug

    can corrupt data. The good news is that Linux knows how to work around

    the chip''s flaws if you answer Yes to this question. If you have any doubt, the
    Yes

