  md: '# CHAPTER 2


    grep is based on *regular expressions*. A regular expression (*regex*) is a pattern
    for matching text.7 A regex *matches* a string of text if all of the string''s
    characters are described by the regular expression in some way. grep''s basic
    job is to search text files and print out all lines that match a given regex.
    For an explanation of regular expressions, see the grep(1) manpage (type `man
    grep` at a shell prompt.)


    # Updating Source with diff and patch


    If you work with CVS, you''ve probably seen diff and patch (or a close equivalent)
    in action. Source code tends to change quickly, though specific changes are often
    simple and isolated. If another developer is collaborating on a project, it doesn''t
    make sense to type entire source trees; it would be better to just send the parts
    of a source tree that have changed since the last update. diff is a utility for
    comparing two files or directories and generating a *delta* (or patch) that can
    be used to change one into the other. Deltas can be applied with the patch utility.
    CVS uses this patching technique internally to keep track of project revisions
    without maintaining multiple copies of the entire project. The Linux kernel development
    team uses patches to exchange code improvements.


    The basic usage of diff is very simple. To create a delta file that describes
    how to convert the file **foo** into the file **bar**, simply feed the two files
    to diff and catch diff''s output with redirection:


    ```

    $ diff foo bar > foo.patch

    ```


    **foo.patch** now contains a description of the differences between the files
    **foo** and **bar**, and this file is sufficient for the patch utility to convert
    **foo** into **bar**.


    > 7 Do not confuse regular expressions with *globs*, which provide a much simpler
    (and less powerful) way to match strings. Most UNIX shells (such as bash) use
    globs for matching filenames, and this throws many UNIX users for a loop.'
