    local character codes for each key (though most games can get away with using
    only the first keymap, which they usually just need to uniquely identify each
    key, not generate printable text). The kernel provides ioctl for looking up the
    symbol associated with a particular key on a particular map.


    # The Raw Deal


    The kernel provides three main keyboard operating modes: *xlate*, *mediumraw*,
    and *raw*. The *xlate* mode is the default mode, which is completely unsuitable
    for gaming because it reports only key presses and ignores releases (making it
    impossible to maintain a keyboard state table à la SDL.GetKeyState). Mediumraw
    mode reports keycode data for both presses and releases. Finally, raw mode provides
    direct scanc data. The best mode for gaming is probably mediumraw mode, since
    it informs us of both presses and releases and saves us from having to interpret
    scanc sequences (which are a bit obtuse). If you''re trying to port an old DOS
    game to Linux, raw mode might be a better bet (since it will give you the same
    scancodes as the games used to read from the hardware directly).


    To put the keyboard in mediumraw mode, we first need its file descriptor. This
    is actually the file descriptor of the current TTY (which needs to be a virtual
    terminal) or system console. We locate a suitable file descriptor (see the example
    code), we can send the KDSMODE ioctl with an argument of K_MEDIUMRAW (for raw
    mode, you''d use K_RAW). Note that this doesn''t affect the keyboard itself in
    any way—it just adjusts the kernel''s reporting of key events.


    keyboard back into xlate mode (leaving line buffering disabled; see tcsetattr
    call in Listing 8-3). You can do full translation yourself, but there are lots
    of annoying to deal with.'
