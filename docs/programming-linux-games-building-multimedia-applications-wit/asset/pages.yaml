    If you get stuck, take a look at SDL_events.c in the SDL source.)


    # Mouse Input with GPM


    Keyboard input is sufficient for getting your feet wet with fbcon mouse programming,
    but more advanced projects usually require mouse input as well. There are two
    options: implement a complete mouse driver (reading and processing data packets
    for multiple types of mice) or require the user to run the GPM console server.
    I recommend the latter—it comes with nearly every Linux distribution, and it supports
    almost every type of mouse. SDL does both, and it can support GPM''s wide variety
    of hardware and still work on systems without GPM.


    Programming mouse hardware is beyond our scope. It''s simple to implement in a
    dozen or so lines of code, but the details vary between mouse types. If you''re
    interested in this, I refer you once again to SDL''s source code. The GPM source
    might also be of interest.


    GPM is a small daemon (detached background process) that''usually loaded in a
    system''s startup scripts. Once GPM is activated, it decodes mouse input and makes
    this data available to other programs (GPM clients) through the libpm client library.
    Depending on your application''s needs, GPM can operate at two levels of abstraction.
    The lower-level interface provides simple mouse event polling. In this mode the
    application uses GpmGetEvent to retrieve Gpm_Event structures that contain information
    about the mouse''s current state. Gpm_GetEvent blocks until data is available,
    but an application can use the select system call to check for data before it
    enters the blocking read.'
