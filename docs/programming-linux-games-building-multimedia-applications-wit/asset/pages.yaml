  md: '# # Chapter 4


    # # Mastering SDL


    Simple DirectMedia Layer (SDL) is a cross-platform multimedia library that has
    been used in countless free games and several commercial projects. SDL works with
    a platform''s underlying multimedia capabilities to provide a consistent and open
    API across countless multiple operating systems. In this chapter we will tour
    the various facets of SDL with respect to Linux game programming.


    SDL''s full name, *SimpleDirectMedia Layer*, summarizes the design of the library.
    SDL is simple to learn and use; its API is well defined (if a bit sparsely documented
    in the recently added areas), uncluttered, and to the point. It provides direct
    access to the computer''s multimedia capabilities where possible and does best
    to compensate if the computer''s underlying support is missing in some area. Finally,
    SDL is a thin and well-behaved layer of code rather than a subsuming beast. It
    is possible and often desirable to use individual components of SDL separately,
    and it is possible to integrate SDL into applications other than games to provide
    special multimedia capabilities. For instance, a game might use SDL for audio
    and some other toolkit for graphics, or an office suite might use SDL to display
    video clips. The most important use of SDL, though, is programming.


    The SDL library consists of several sub-APIs, providing cross-platform support
    for video, audio, input handling, multithreading, OpenGL rendering contexts, and
    various other amenities. We''ll begin our tour with graphics programming. Before
    we jump into the world of surfaces and pixels, however, let''s take a look at
    the hardware that makes it all possible.'
