    # This Looks Familiar...


    If you think OpenAL''s design is a cheap knockoff of the OpenGL 3D graphics library,
    you''re right! OpenGL is an amazingly clean and well-designed API with a wide
    following, and OpenAL''s designers thought they''d do well to follow its style.
    This makes a lot of sense, especially since OpenAL is also used to provide audio
    support in OpenAL applications. OpenGL-oriented data structures tend to carry
    over to OpenAL without much trouble.


    In particular, OpenAL uses its peculiar naming scheme; for instance, a function
    that calls the AL_BAR property of a Foo-type object to the first entries of an
    array of floats would look something like alfv(foo.id, AL_BAR, position). In this
    case foo.id is the "name" (integer identifier) of the object to be modified, AL_BAR
    is the property of the object, and fv signifies that the function deals with a
    vector of floats. OpenAL function names are always prefixed with AL or OR.


    Once you understand the basics, OpenAL is even simpler to use OSS. First you need
    a device and a context. A device represents an initialized sound card (with possible
    hardware acceleration features), and a context is piece of data that represents
    OpenAL''s current state. Each context represents one listener and multiple sources,
    and all commands dealing with these objects affect the current context. Since
    nearly everything relevant to OpenAL is stored in the current context, it''s possible
    to maintain several contexts and swap them out as you please.(This probably won''t
    be useful in most cases, however.) Only one context can be current at a time.


    TheOpenDevice function opens an audio device and prepares it for OpenAL''s use.
    It typically does this by looking for a supported audio interface (OSS, ALSA,
    or ESD) and performing whatever initialization steps the interface requires. This
    function takes a single argument, a device specific. In most cases you can set
    this to NULL; it''s only if you want to request a particular output device (and
    doing so is a quick way to kill portability). alcOpenDevice returns NULL if it
    can''t find a usable device and returns a pointer to a device structure if all
    goes well. If you can''t open a device, don''t bother with any OpenAL calls; nearly
    everything requires a valid context, and a context requires a valid audio device.'
