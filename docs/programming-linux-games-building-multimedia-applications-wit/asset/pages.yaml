  md: '# The Mode Database


    If the current framebuffer device is capable of mode switching and you know the
    exact timings for the mode you''d like to set, changing video modes is a matter
    of a single ioctl call. You''ll see that in the next example. But finding the
    right timings can be a bit of a hassle.


    As I already mentioned, the framebuffer device system (more specifically the fbset
    utility) keeps a database of valid mode timings in the file /etc/fb.modes. Although
    the structure of this file leaves a bit to be desired from a parser-writer point
    of view, it''s easy to figure out. fb.modes is a plain text database containing
    one or more mode sections from my copy of fb.modes.


    ```

    mode "640x480-60"

    # D 25.175 MHz, H: 31.469 kHz, V: 59.94 Hz

    geometry 640 480 640 480 8

    timings 39722 48 16 63 10 96 2

    endmode

    ```


    Lines beginning with a hash (#) are comments, lines beginning with geometry specify
    the mode''s geometry (physical resolution, virtual resolution, and color depth),
    and lines beginning with timings specify the mode''s timings parameters.


    It is the responsibility of the system administrator (or whoever installed the
    fbset utility) to provide correct modes and timings for the local system. The
    default mode database distributed with fbset is valid for most video cards, and
    in all most people don''t bother to change it. It contains reasonable values for
    most video cards and monitors.


    fbmodesdb.c and fbmodesdb.h contain code for parsing /etc/fb.modes. You can find
    the code in the listings archive; it''s not interesting enough to include here.


