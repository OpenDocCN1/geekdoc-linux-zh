    The root element of this XML file is labeled install, and it contains the options
    needed for the complete installation process. Flags to the install section include
    the name of the product, its version number, a brief description, the name of
    an information file (in this case README), and a shell script to run after the
    files have been copied to the user''s hard drive. You can optionally include a
    preinstall script (to be executed before copying files), a default installation
    path other than /usr/local/games, preinstall and postuninstall scripts for uninstalling
    the product (by default, Setup will remove the directory tree it installed), and
    several other flags (documented in the Setup source package).


    install usually contains several option elements. These elements specify sets
    of files that may be installed. If an option node contains the install="true"
    attribute, Setup will install it by default. You can nest option sections to specify
    logical groups of files. If the user unchecks an option, Setup will block any
    nested options. You can also specify lib or architecture requirements for options,
    making it easy to release a CD with support for several different architectures.
    Setup also provides support for internationalization.


    After the user selects the appropriate sets of files and clicks the Begin Install
    button, Setup performs the following tasks:


    +   Runs the preinstall script, if any (none in this case).


    +   Creates the installation directory, in this case /usr/local/games/hg2/. Obviously,
    the user must have write access to this part of the filesystem; Setup will refuse
    to continue otherwise.


    +   Copies the selected file sets from the CD-ROM to the installation directory.


    +   Writes an uninstall script in the installation directory. This script simply
    removes all of the files that were copied and provides a quick way to uninstall
    the software. The script also executes any requested preinstall or postuninstall
    scripts that were specified in setup.xml.'
