  md: '# LINUX AUDIO PROGRAMMING


    different OSS device, but `/dev/dsp` is valid on most systems. If the file is
    opened successfully, the player begins to set the appropriate playback parameters
    with the ioctl interface.


    The first step in configuring the driver is to set the sample size. Our loader
    recognizes 8-bit unsigned and 16-bit signed samples, and these are the only cases
    our player need to account for. After selecting the appropriate constant (codeAFMT_S16_NE
    for 16-bit signed with default endianness, or AFMT_U8 for 8-bit unsigned), it
    calls ioctl with SNDCTL_DSP_SETFM. This ioctl call could fail if the driver is
    unlikely to happen unless the user has an extremely old sound card. We could use
    AFMT_S16_LE or AFMT_S16_BE to explicitly set little or big endianness, respectively.
    If this ioctl succeeds, the player sets the number of channels and the sample
    rate in a similar fashion. It is important to set the number of channels before
    the sample rate, because some sound cards have different limitations in mono or
    stereo mode.


    The sound driver is now configured, and our player can begin sending samples to
    the device. Our player uses the standard UNIX write function to transfer the samples
    in 4,096-byte increments. Since sound cards play samples at a limited rate (specified
    by the sampling frequency), it is possible that these write calls will block (delay
    until the sound card is ready for more samples) and thereby limit the speed of
    the rest of the program. This would not be acceptable in a game, since games typically
    have better things to do than wait on the sound card. We will discuss ways to
    avoid blocking in the next section.


    When the entire set of samples has been transferred to the sound card, our player
    closes the `/dev/dsp` device and returns zero.


    # Reality Check


    The Web site has two main documents about OSS programming: Audio Programming and
    Making Audio Complicated. The former describes the basic method of OSS programming
    and is fairly simple to understand. The latter is aptly named; sound programming
    can quickly devolve into a messy subject. We will now cover some of the ugly details
    that are necessary for real-world game development. Unfortunately, the simple
    example we just discussed is woefully inadequate.'
