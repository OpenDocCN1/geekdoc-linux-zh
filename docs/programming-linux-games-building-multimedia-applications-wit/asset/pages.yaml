    After opening a PCM output device, our player clears a

    snd.channel.params structure and fills in the relevant pieces of information

    out our sound data. It is important to zero this memory first; some fields in

    the structure are considered valid only if a certain bit is set, and we generally

    don''t want to mess with these. Take note of the mode, start_mode, and

    stop_mode fields. mode should be either SND_PCM_MODE_STREAM or

    sND_PCM_MODE_BLOCK. The block mode can allow for higher performance, but it

    requires all of our data transfers to be even multiples of the fragment size (4,096

    bytes in this case), and it disallows the use of the plugin functions. These

    instructions won''t really be a problem; if we run out of samples, we can just
    send

    zeros (for silence), and we can handle format conversions by hand. Block mode

    also allows you to use snd.pcm_mmap, which is for our example.

    The start and stop modes tell ALSA when to start playback and how to handle

    under conditions. Our player uses SND_PCM_START_DATA to instruct ALSA to

    begin playback as we send the first chunk of data, and it uses

    sND_PCM_STOP_ROLLOVER to ask ALSA not to stop playback if it runs out of data.

    (Instead, we loop over the data it already has until it gets more.). In theory,

    underruns should never happen unless the application can''t keep up with the

    sound card. When all of the required information has been set

    the structure, our program sends the sound to ALSA with snd.pcm.plugin.params.


    Finally, our program sends the sound to the prepared state with the

    snd.pcm.plugin.prepare function and begins writing PCM data. We detect

    errors from snd.pcm.plugin.write, and we handle the EAGAIN condition

    separately. This error occurs when the device is (probably) not in a state of


