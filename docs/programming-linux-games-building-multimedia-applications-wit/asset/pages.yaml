    # Sharing the Sound Card with ESD


    OSS and ALSA share a serious weakness: they allow the sound card to be used by
    only one application at a time. This exclusivity can be quite an annoyance, since
    many users like to listen to MP3 music or streaming radio while they use the computer,
    and compete with other applications for the sound card. Third-party OSS drivers
    (such as the Sound Blaster Live driver from Creative) allow multiple applications
    to share the sound device, but the 4Front Technologies drivers generally not permit
    this.


    ESD is a network-enabled real-time sound mixer. Any number of ESD-capable applications
    can share the computer''s sound hardware seamlessly; ESD mixes their sound streams
    together, just as we mixed several samples together in the SDL sound demo. ESD
    is a server-based sound toolkit, and a running ESD server can accept connections
    from remote machines. The ESD interface is


    > In an ideal world, 4Front Technologies would throw its full support behind the
    ALSA project and start writing commercial ALSA drivers instead of OSS drivers.
    Competition is good, but there''s no reason that it can''t take place within a
    single, well-designed API. Alas, this is unlikely to happen, but it would be great
    for Linux.'
