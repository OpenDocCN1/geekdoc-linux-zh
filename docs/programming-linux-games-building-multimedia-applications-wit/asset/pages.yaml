    # The Network Subsystem


    Multiplayer gaming is very popular these days, and it is reasonable to assume

    this trend will continue. The network subsystem connects a game to other

    computers over a network so that multiple players can participate in the action.

    Network programming is not as difficult as it used to be, especially with the

    adadvent of the Internet as we know it. Still, the network subsystem must be

    extremely robust and flexible, as, not surprisingly, gamers are rather intolerant

    network failures during games.


    Basically, the network subsystem informs the other computers in a network ofntnt
    current state of the game so that the players stay synchronized. This can be

    a quick trick, and so is it to develop the game with network capabilities in

    mind. You may find that a networking library such as Apple''s OpenPlay makes

    this job bit easier.


    Above all, do not implement network support as an afterthought, because

    often affects the entire design of the game. Decide whether your game lends\itself
    to network play and build this requirement into the fundamental game

    design; doing so will save headaches later on when the designer invariably

    demands that multiplayer capabilities be added.


    # The Update Subsystem


    Games generally have to track a lot of rapidly changing data, including the state

    the player and the condition of each enemy—information that must be

    updated by frame to keep the game moving. The update subsystem

    manages this data.


    The update subsystem is the game''s brain. It enforces the game''s rules for

    move upon the player, "plays" the role of each enemy (which might involve

    certain amount of artificial intelligence), ensures that every object is within
    the

    allowed boundaries, and inflicts injuries. It could almost be that the other

    game modules are merely interfaces to the update subsystem.'
