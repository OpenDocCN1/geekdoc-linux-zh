  md: '# GGI


    GGI Graphics Interface (GGI) is a massive, general-purpose, multitargeted graphics
    library that provides a complete graphics system for games and other applications.
    Its companion library, GII, provides portable input device support, and games
    that use it are meant to be easily portable to any platform. GGI does not depend
    on any one method of accessing graphics devices; instead, it provides a system
    of "back ends" that can support anything remotely resembling a graphics device.
    The GGI Project is also working on a kernel-based graphics infrastructure, KGI.
    GGI is free software, distributed under the GNU LGPL. The GGI Project''s Web site
    is http://www.ggi-project.org.


    # SDL


    Simple DirectMedia Layer (SDL) is a cross-platform multimedia library developed
    with commercial game portant in mind. (In fact, it has already been used to port
    a number of games from Windows to Linux, including most of Loki''s titles.) SDL
    supports almost all of the major operating systems, including Linux, Windows,
    BeOS, and macOS. In addition to fast graphics support, SDL provides interfaces
    for playing sound, accessing CD-ROM drives, and achieving portable multithreading.


    SDL is also an excellent library for free software projects: Released under the
    GNU LGPL, it has everything programmer need to write fast, portable games. SDL
    has accumulated a collection of user-contributed libraries that provide additional
    functionality for game developers.


    We will discuss the SDL library in detail later. SDL''s Web site is http://www.libsdl.org,
    and a helpful group of SDL enthusiasts (including myself)^2 gathers on IRC at
    irc.openprojects.net, #sdl.


    > 2 My name on IRC is "overcode." I''m not difficult to find.'
