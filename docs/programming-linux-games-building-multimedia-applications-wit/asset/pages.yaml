  md: 'structure with a mutex (mutual exclusion flag). A mutex is simply a flag that
    indicates whether a structure is currently in use. Whenever a thread needs to
    access a mutex-protected structure, it should set (lock) the mutex first. If another
    thread needs to access the structure, it must wait until the mutex is unlocked.
    This can prevent threads from colliding, but only if they respect the mutex. SDL''s
    mutexes are advisory in nature; they do not physically block access.


    # Function SDL_CreateMutex


    Synopsis: Creates a mutex.


    Returns: Pointer to the newly created mutex. This mutex is initially unlocked.


    # Function SDL_DestroyMutex


    Synopsis: Frees a mutex.


    Parameters: mutex—Pointer to the mutex to destroy.


    # Function SDL_mutexP(mutex)


    Synopsis: Locks the mutex. If the mutex is already locked, waits until it is unlocked
    before locking again. If you dislike the traditional P/V naming, you can access
    this function with the SDL_LockMutex macro.


    Parameters: mutex—Pointer to the mutex to lock.


    # Function SDL_mutexV(mutex)


    Synopsis: Unlocks the mutex. There should always be a SDL_mutexV call for every
    SDL_mutexP call. If you dislike the traditional P/V naming, you can access this
    function with the SDL_UnlockMutex macro.


    Parameters: mutex—Pointer to the mutex to unlock.


