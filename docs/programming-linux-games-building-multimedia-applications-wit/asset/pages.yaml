  md: '# Local Configuration


    As we''ve said, each Linux distribution is slightly different, with own ideas
    about how the Linux filesystem standard should be implemented (more on this later),
    and with a slightly different etc/ directory tree. In addition, users are generally
    given a choice of libraries and other supporting packages to install, meaning
    that you can''t count on the presence of any particular development library. For
    these reasons, getting a large program to compile and link correctly on a given
    Linux installation can be quite a challenge.


    There are several ways to approach this problem. Some developers opt to specify
    local configuration options directly in a project''s myfile. For instance, the
    following lines might show up in a myfile for an OpenGL-based project:


    ```

    # Configuration section


    CC= gcc

    CFLAGS=-O2 -W -Wall -pedantic

    X11LIBS=-L/usr/X11/lib -lX11 -lXt -lXext

    GLIBBS=-lGL -lGLU -lglut

    ```


    This is a bit of a hack, but it''s sufficient in some cases. All of the necessary
    libraries are listed in an easy-to-find spot in the myfile, so that a user can
    quickly configure the project to compile on his or her system. The program would
    presumably come with a README file explaining how to do this. Users who don''t
    know anything about makefiles, C, or programming in general might find this solution
    a bit intimidating, however.


    A better option is the GNU Autoconf facility. Autoconf is a sophisticated set
    of m4 scripts that automatically configure source trees for compilation on a variety
    of systems. Based on information in Makefile.am generates a source tree, Autoconf
    (more specifically the Automake program) generates a script called


    problems with incorrect library versions.


    > 5 m4 is a very simple but powerful language that people seem to love or hate.'
