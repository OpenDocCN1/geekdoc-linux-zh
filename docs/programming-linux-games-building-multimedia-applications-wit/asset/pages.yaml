    This directory tree contains Setup binaries for four different architectures,
    with both GTK- and terminal-based interfaces. The GTK binary requires GNU libc
    2.1 or later, so it''s placed in its own directory. The **setup.sh** script will
    run this binary only if glibc 2.1 is available. The plain terminal-based version
    is statically linked, will run regardless of the system''s C library version.
    **setup.glade** is a GUI template for the Setup wizard, **splash.xpm** is a version
    of the Heavy Gear II logo for the Setup screen, and **setup.xml** is the XML installation
    script.


    The rest of the CDs consists of Heavy Gear II''s datas and cinematics. Setup just
    copies these files to the selected installation directory (probably **usr/local/games/hg2/**),
