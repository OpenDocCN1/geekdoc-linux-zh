  md: '# Chapter 3


    # Linux Gaming APIs


    I still remember the first game programming book I ever read. By Dave Roberts,
    it was entitled PC Game Programming Explorer, and it demonstrated game programming
    with a game called Alien Alley. This was actually a neat game, especially for
    intended as a book example: its graphics were smooth, the artwork was top-notch,
    and it ran well on my rather under system. It would be easy for me to write such
    a game today, even in a matter of a few hours. But to a neophyte programmer, it
    seemed a towering monolith.


    Back in the days of DOS-based gaming, programmers generally wrote games by issuing
    commands to the computer''s hardware. There were only a few popular types of sound
    cards on the market, and many were at least partially with Creative Labs'' Sound
    Blaster. Input devices were trivial to program: accessing the mouse required only
    a few assembly language instructions (interrupt 33h, for those who remember),
    reading the joystick''s position was a matter of dozens lines of code, and there
    were several ways to collect keyboard input. Video programming was the hardest
    part of game development at the time. Although nearly every computer had a VGA-compatible
    display chip, coaxing fast and smooth graphics out of it took a significant amount
    of skill (due to some of the brain-dead limitations of the PC architecture). In
    fact, Alien Alley was mostly video code.


    Times have changed, arguably for the better. Very few game programmers actually
    write register-level video code these days; instead, they rely on'
  merge: -1
  pgno: 71
- img_proc: true
  md: 'prewritten interfaces (such as OpenGL, SDL, and DirectDraw). Direct hardware
    hacking is fun, but it slows down game development and usually produces unacceptable
    code (with that many “old school” games are extremely difficult to port to modern
    environments). Even if I could find the floppy disk that with my copy of PC Game
    Programming Explorer, I doubt that I could port Alien Alley to Linux in any reasonable
    amount of time, simply because it depends on certain hardware-level features of
    the original VGA graphics adapter.


    DOS programs are free reign of the entire system; they can freely access memory
    or hardware ports, and they are effectively allowed to show the operating system
    out of the way. Linux programs, on the other hand, are not generally allowed direct
    access to the system''s hardware; they must either use interfaces provided by
    the Linux kernel or obtain special permissions, requiring the program to be executed
    under the gladly root account (a potential security risk). The Linux kernel also
    prevents programs from directly accessing certain areas of the system''s memory.
    In return for these restrictions, Linux is able to prevent applications from interfering
    with one another, thereby ensuring the system''s stability and security.


    The bottom line is that we''ll probably want avoid talking directly to the system''s
    multimedia hardware, but instead use one of many existing libraries for the purpose.
    It saves time and effort, and libraries are usually more fully developed and stable
    than code written for a particular game.


    This chapter tours the variety of game-programming toolkits available under Linux.
    Most are free and open (indeed, I am wary of any Linux toolkit that isn''t these
    days). If you intend to use these toolkits, familiarize yourself with the terms
    of the GNU Library General Public License (LGPL): It is possible to legally develop
    closed source, commercial software using LGPL libraries under certain conditions;
    something that has been a frequent source of confusion among developers.


    Multimedia programming is a broad field, and so we have divided our tour into
    several categories. Some packages provide several types of functionality, and
    they will be mentioned more than once. Finally, some capabilities are provided
    by the Linux kernel itself, in which case we will simply refer to “the kernel”
    or “Linux.”'
