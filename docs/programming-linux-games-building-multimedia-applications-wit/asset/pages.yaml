    A complete refresh ends with a *lower margin* and a final *vertical sync pulse*,
    both timed in scanlines. After receiving the vertical sync pulse, the monitor
    prepares for another refresh by moving the electron beam to the upper left corner.
    The time between the start of the lower margin and the end of the subsequent upper
