  md: '# Other Options


    If some reason libsndfile doesn''t appeal to you, there are several other options.
    You could use the libaudiofile library, which has a slightly different API and
    similar capabilities. libaudiofile has been around for a long time, and it is
    widely used. You could implement your own wave file loader, which is this extra
    work. The original wave file format has a very simple structure, consisting of
    little than a RIFF header and a block of raw sample data. Unfortunately, some
    wave files are encoded in strings, and these must be either specifically handled
    or rejected. Libraries such as libsndfile and libaudiofile handle these quirks
    automatically.


    Another option is to convert your sound files into a simpler format that is trivial
    to load. The SoX (Sound eChange) utility is handy for this purpose. SoX can rewrite
    sound files as raw, headless data, which you can then load with the C library''s
    **open** and **fread functions**. The main drawbacks to this approach are that
    the sound will be completely uncompressed (assuming that it is compressed to begin
    with) and that you will have to keep track of the sound''s sample format by hand.
    This is a general nuisance, so it''s better to use a library for loading sound
    files.


    # Using OSS


    The OSS API is based on device files and the ioctl facility. UNIX device files
    are files that represent devices in the system rather than ordinary data storage
    space. To use a device file, an application typically opens it by name with the
    C library''s **open** function and then proceeds to exchange data with it using
    the standard **read** and **write** functions. The kernel recognizes the file
    as a device and intercepts the data. In the instance of a sound card, this would
    consist of raw PCM samples. Device files are traditionally located in the /dev
    directory on UNIX systems, but they can technically exist anywhere in the filesystem.
    The main OSS device files are /dev/dsp and /dev/audio.


    This explains how a program can get samples into the sound card, but what about
    the sound card''s other attributes, such as the sample format and sampling rate?
    This is where ioctl comes in. The ioctl function (a system call, just like **read**
    or **write**) allows you to send special commands to device files, usually to'
