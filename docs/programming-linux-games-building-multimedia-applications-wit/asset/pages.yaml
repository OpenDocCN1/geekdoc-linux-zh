    preferred 3D API on most major platforms. It is used in many games as well as
    in professional engineering applications. Microsoft''s Direct3D is OpenGL''s main
    competition in the gaming industry, but Direct3D is not a cross-platform solution.
    SDL handles the platform-dependent details of initializing OpenGL, making it simple
    to implement accelerated 3D graphics on any major platform.


    OpenGL is not difficult to use, but it is a bit tricky to initialize. It is based
    on rendering contexts, structures that encapsulate information about the current
    3D view settings and the rendering acceleration hardware. In general, OpenGL requires
    one rendering context for each window that will produce 3D graphics. GLX rendering
    contexts are not difficult to work with, but SDL handles this for us in a platform-independent
    manner.


    # SDL vs. GLUT


    Utility Toolkit (GLUT) is a simple OpenGL support library that hides the details
    of rendering contexts and input devices. It was created by Mark Kilgard (Silicon
    Graphics and NVIDIA) as a simple OpenGL demonstration environment. GLUT is intended
    as a platform for learning OpenGL and for creating proof-of-concept applications,
    but it is not designed to be a general-purpose multimedia library. This limits
    its usefulness to game programmers. GLUT is great for giving OpenGL a test drive
    or for trying new ideas without unnecessary overhead, but SDL is a better platform
    for serious game development.


    Unfortunately, OpenGL more or less takes over the SDL subsystem. If OpenGL is
    initialized, direct access to the framebuffer, is likely to result in a crash.
    This is not a very serious limitation, since OpenGL is a fully capable graphics
    library in itself. You can still create and write to off-screen surfaces, and
    you can even use SDL surfaces as OpenGL textures. The rest of SDL (audio, input,
    and so on) are unaffected by OpenGL.


