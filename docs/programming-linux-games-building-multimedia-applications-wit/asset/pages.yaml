    command removes them.


    gdb''s watchpoints are useful for tracing memory corruption. A watchpoint is a
    hardware trap placed on a memory location. If that location is read or written
    to, gdb will catch the access and pause the program for inspection. Since watchpoints
    are independent of the semantics of a particular programming language, they can
    be used to trace memory corruption from misplaced pointers. There are three types
    of watchpoints: `write-only`, `read-only`, and `access`. Write-only watchpoints
    detect modifications but not reads, read-only watchpoints detect reads but not
    modifications, and access watchpoints detect any type of access to the given memory
    address. The `watch`, `ratch`, and `aw` commands correspond to these types of
    watchpoints. These three commands take a symbol name as an argument. Use the `enable`
    and `disable` commands to toggle watchpoints. `info breakpoints` prints a list
