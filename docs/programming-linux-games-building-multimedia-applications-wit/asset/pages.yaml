  md: '# Loading Other Image Formats


    SDL provides built-in support for loading .bmp files, but this is a fairly limited
    file format. In particular, it supports only minimal compression and does not
    provide an alpha channel. (See the next section.) The SDL_image add-on library
    adds to SDL support for several different formats, including the popular .png,
    .jpg, and .gif formats.


    SDL_image is extremely simple to use. Once you have installed the library on your
    system, your program should include SDL/SDL_image.h and link with -SDL_image.
    Assuming this is successful, your programs can use the IMG_Load function to load
    any supported image format. The next section demonstrates this function.


    ```

    $ gcc program.c -o program `sdl-config --libs --cflags` -lSDLimage

    ```


    Other SDL add-ons are available, and it is worthwhile to become familiar with
    them. They can save you a lot of coding framework in many cases. There are currently
    libraries for processing TrueFonts, accessing the network, mixing sound effects,
    playing music (including MIDI), and managing graphical user interfaces. Most of
    these libraries are portable, but a few are OS-specific. More information on these
    libraries is available at http://www.libsdl.org.


    # Alpha Blending


    Although graphics and sound are only part of what goes into a successful game,
    visually impressive games tend to be more fun than games with lackluster graphics.
    Game programmers often add special effects to make their graphics stand out. Alpha
    blending is a special effect that adds varying degrees of transparency to surfaces.


    Most images use three color channels (red, green, and blue) to describe each pixel.
    Alpha blending adds a fourth, the alpha channel. For this reason, alpha-enabled
    images are often called RGBA images. The alpha value of each pixel is an indication
    of that pixel''s opacity. An alpha value of zero indicates that a pixel is completely
    transparent, and higher alpha values indicate'
  merge: -1
  pgno: 110
- img_proc: true
  md: '# MASTERING SDL 93


    increasing opacity. The alpha channel can be created on the fly according to a
    program''s needs, or it can be stored with an image created in a graphics package.


    To draw an RGBA pixel onto another, the alpha function simply performs a weighted
    average of the two pixels, processing each color channel separately. Suppose that
    a pixel has RGB values (50,20,30) with an alpha value of 50. This alpha value
    corresponds to approximately 20 percent opacity (80 percent transparency), since
    the scale is 0 to 255. If this pixel is drawn on top of a pixel with RGB values
    (60,80,100), the resulting pixel will take 20 percent of its color from the first
    pixel and 80 percent of its color from the second, and so its RGB values will
    be (58,68,80). This weighted average can be computed with simple arithmetic. Unfortunately,
    multiplication and division are comparatively slow operations for most processors,
    so alpha blending generally involves a significant performance hit unless it is
    supported by a video accelerator.


    SDL provides full support for alpha blending. If an image already contains alpha
    data (from an image-processing program), the SDLSetAlpha function can be used
    to enable alpha blending (as you will see in the next example). If the image does
    not contain an alpha channel, it can still be blended, but the entire surface
    will have the same opacity value. This is called per-surface alpha blending. Per-surface
    alpha blending is also set with SDLSetAlpha.


    +   SDL.SetAlpha(surface, flags, alpha)

    Enables alpha blending on a particular surface.

    surface—The surface to modify.

    flags—List of alpha blending flags.

    SDL_SRCALPHA enables alpha blending, and

    SDL_RLEACC enables RLE acceleration (with the same ramifications described under

    SDL_SetColorKey).

    alpha—Per-surface alpha value. 255 represents complete opacity, and 0 represents
    complete transparency.'
  merge: -1
  pgno: 111
