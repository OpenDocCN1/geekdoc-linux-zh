  md: '# CHAPTER 6


    # Multiple calls to a single context


    # Multiple scripting contexts


    Game engine makes multiple calls to one interpreter to handle characters | Script
    is passed some sort of identifier to select which character to update.


    ![](img/0de55c1076ffcb1d2a6b324f1ff4658d_284_0.png)


    # One call to a single context


    Game engine makes one call to the scripting engine in each frame | Script iterates
    through each character and performs update.


    ![](img/0de55c1076ffcb1d2a6b324f1ff4658d_284_1.png)


    Figure 6–2: Several possible scripting models


    # Single Versus Multiple Contexts


    Suppose that you are making a game similar to StarCraft (a real-time strategy
    game with hundreds of computer-controlled opponents in the world simultaneously),
    and that you obviously want to call Tcl_Eval on the script at least once each
    frame. The question is, do you create a separate Tcl_Interp for each character
    in the game, or do you run all of them through the same interpreter? In the latter
    case, do you invoke the interpreter once for each character or once for the entire
    group? (For lack of a better term, we will call an interpreter with a loaded script
    context.)


    In the case of something like StarCraft, it would probably be a bad idea to use
    a separate interpreter for each character in the game; that would be a horrendous
    waste of memory and script loading time, even though it might make the scripting
    system bit easier to organize. In cases with only a few characters, it might be
    desirable to use multiple scripting contexts.


    If you decide to use a single interpreter for the whole thing, you still need
    to decide whether you''ll make a single call to it each frame and let it sort
    out all of the different characters (through a loop of some sort,) or call the'
  merge: -1
  pgno: 284
- img_proc: true
  md: '# GAME SCRIPTING UNDER LINUX


    script once for each game character. The former has the advantage of fewer calls
    to the scripting library (which can be expensive, depending on the language),
    and the latter has the advantage of potentially simpler scripting. It''s hard
    to predict which scenario will perform; if you''re faced with this question, you
    might want to write some timing code to measure the total amount of time spent
    in the scripting engine per frame.


    # Can We Trust the Script?


    Security really doesn''t matter for a single-player game; if a player wants to
    cheat, so what? For that matter, you might as well publish a list of cheat codes.
    But it is a big issue in multiplayer games. You can pretty much count on a few
    learners trying to mess up the game for everyone else. If the game depends on
    an interpreted (rather than compiled) script for its rules, there''s a problem.
    Someone will figure out how to change the code, and without proper safeguards,
    this can make the game unfair for the rest of players.


    This problem becomes worse in open source software. Everyone has access to all
    of the code, and anyone can change it to their liking. Unless the other players
    have some way of telling when someone''s copy of the game has been modified, there''s
    no hope of preventing cheaters from spoiling the fun, unless the players trust
    one another from the start.


    Penguin Warrior is wide open to script abuse. The script can essentially take
    direct control of each ship, and no limits are imposed. If security were an issue,
    we would have to add a limit-checking system to prevent the script from making
    illegal moves. Even then, the source code to the game would be available for all
    to see and modify. Multiplayer games can avoid this problem by having all players
    connect to a trusted central server. We''ll touch on multiplayer security in the
    next chapter.


    # Script Performance


    Script interpreters are usually pretty well optimized, unless scripts are compiled,
    they are always separated from the processor by at least one layer of code. The
    exact speed ratio of interpreted code to native code varies among languages, but
    don''t be surprised if a script runs at about tenth the speed of'
  merge: -1
  pgno: 285
- img_proc: true
  md: 'equivalent C code. (Again, it can be better or worse, depending on a lot of
    factors; if you''re concerned, benchmark it.) To achieve decent performance, you''ll
    need to take the properties of your chosen language into account. Tcl, for instance,
    isn''t very fast at list processing (though this has gotten much better of), while
    Scheme excels at lists. It wouldn''t be a good idea to use the "one interpreter,
    one call" model mentioned previously with Tcl, but this model would be quite natural
    in Scheme. Also, Don''t be fooled by the "compilation" modes of most scripting
    languages; TPro and MScheme can both "compile" programs, but this does little
    more than hide the source. The code is still interpreted as it normally would
    be, except for the initial parsing stage. (However, TPro''s .tc or MScheme''s
    .zo bytecode formats might be useful if you want to hide the source to your scripts.)


    Another performance issue has to do with memory management. Tcl uses reference
    counting to know when it can safely reclaim unused variable memory, while Scheme
    and most other Lisp-like languages use more complicated "garbage collection" techniques.
    Scheme has plenty of use collection, but it means a Scheme program will typically
    use more memory than it really needs at any time. Garbage collection often takes
    place suddenly, and it can cause noticeable delays in your program. There are
    ways to avoid this problem (such as running the scripting system in a separate
    thread or scheduling garbage collection yourself at safe times), but you would
    do well to become informed about these quirks before you use one of these libraries.


    # Who''s Writing the Script?


    As a final thought, it''s important to note that the people who write game scripts
    aren''t programmers. Scripting is part of creating maps and characters, and this
    task often falls to artists and game designers. These are smart people, no doubt,
    but they might not be up to speed on programming. This is actually one of the
    main reasons for using scripting languages in games: they allow nonprogrammers
    to make minor changes to the game without actually touching the main source. Scripting
    languages are usually much simpler than C and C++. But with a well-designed scripting
    system, some people might have trouble groking the language or the interface.
    The only real solution is to document your scripting interface well, pick an intuitive
    language, and be prepared to teach it to your sc. Almost anyone can pick up something
    like Tcl without too much effort, so be patient.'
