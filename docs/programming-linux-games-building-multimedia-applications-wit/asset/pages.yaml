    This animation may run smoothly on your particular system, it is not optimal for
    two reasons. First, SDL might or might not be using the video card''s actual framebuffer
    for drawing. If it is using the framebuffer, the penguin graphics will be drawn
    directly to the screen, and the monitor''s refresh occur while the frame is being
    composed. This can lead to half-draw or even missing images on some frames. These
    problems are known as *shearing* and *flicker*, respectively, and they are even
    more distracting than jitter animation. Second, the penguin bitmap''s pixels are
    stored in a different format than the screen''s pixels, forcing SDL to convert
    between pixel formats as it draws the images. This is very time-consuming and
    lowers the framerate of the animation.


    The first problem can be solved with a technique known as *double buffering*.
    By specifying SDL_DOUBLEBUFFER and SDL_HWSURFACE flags to SDL_SetVideoMode, you
    can instruct SDL to *always* use a fake (off-screen) framebuffer, even if a direct
    one is available. This off-screen framebuffer is called a *double* or *back buffer*.
    The back buffer can be quickly displayed to the screen with the SDL_Flip function.
    (Note that SDL_UpdateRect function is not used with double buffering.) Using a
    second framebuffer for composing the complete frame ensures that everything can
    be drawn to the screen with one carefully timed blit, rather than the 100 blits
    our penguin example performs. Double buffering thus significantly mitigates the
    problems of shearing and flicker.'
