    # # Imposing a Sane Rate of Fire


    As much fun as it is it would be to lean on the Fire button and project a line
    of death from the front of your ship, this wouldn''t make for a very competitive
    game. To avoid this problem, we''ll implement a phaser "charging" system. A player
    can fire only when the phasers have a certain level of charge, indicated by a
    small on-screen meter. Phasers take a few seconds to recharge fully, and they
    discharge quickly when they are fired.


    Each player has a running charge count that is incremented by 30 second. To accomplish
    this charging in a uniform way, the main loop adds the global time_scale variable
    (see page 158) to the start of each frame. Whenever a player fires, the charge
    count loses a certain amount. The player can employ a number of strategies to
    deal with the limited amount of charge.


    With a bit more voodoo around main.c, network.c, and weapon.c, Penguin Warrior
    has no functional phasers. It''s not finished yet, though—it still needs score
    and charge counters. We''ll add those next.


    # # Creating Status Displays


    At this point you can fly a ship around the Penguin Warrior and fire at a human
    or computer opponent. However, unless you keep a console visible behind the game''s
    window, it''s hard to tell what''s going on in the game. Penguin'
