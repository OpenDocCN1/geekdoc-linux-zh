    # Commercially Maintained Free Software


    Tcl is free and open source software with almost no usage restrictions, but it
    is commercially supported by Scriptics, Inc. (recently acquired by Ajuba and then
    by Interwoven). Tcl is included with most Linux distributions, and then you can
    download it separately from **ftp://.scripts.com**. In addition to the embeddable
