  md: '# Chapter 8


    # Gaming with the Linux Console


    Although the X Window System is by far the most common graphics system for Linux,
    the Linux 2.2 kernel introduced a new option for game programming. The Linux kernel
    wanted to port Linux to systems that lacked video adapters with native text modes
    (the Macintosh, for instance), and so they devised a framebuffer console system
    for emulating a suitable character mode on top of ordinary pixel-based display
    devices. It soon became apparent that the framebuffer console could be useful
    on display adapters with text mode capabilities, and now the kernel can perform
    this emulation on a wide variety of video hardware. The underlying framebuffer
    device (fbdev) system provides a generic kernel-based interface to video hardware,
    and it''s useful for much more than fake text consoles.


    The framebuffer device interface isn''t programmer-friendly as SDL, but it''s
    a refreshing trip into low-level pixel hacking. SDL provides conversion routines
    for every possible 8-, 16-, and 32-bit pixel format. The framebuffer console does
    not; it tries to deal with whatever mode you ask for, but it can''t make guarantees,
    and it''s up to you to deal with whatever it returns. On the upside, framebuffer
    devices are managed by the kernel, and they can be quite fast. Linux still needs
    a better kernel-based graphics solution, in my opinion, but the framebuffer device
    is an immediately useful step in the right direction.


    This chapter tours the Linux framebuffer device interface, as well as looking
    at a few others necessary for writing Linux console games. You''ll need a'
