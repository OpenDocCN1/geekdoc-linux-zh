  md: 'the status of all objects in the game, draws the next frame of graphics, and
    produces audio. While this process may sound complicated, it is actually quite
    trivial, all of this functionality is provided by the game''s input, network,
    graphics, and audio subsystems.


    The game loop should start as soon as the game''s other subsystems have initialized,
    and should end when the player exits the game. It may be a good idea to separate
    the menu system from the main game loop in some cases, but doing so could actually
    complicate the game''s code. With a properly written game loop, a game becomes
    a “state machine” that acts on its current state based on the player''s input.


    Organization is important too, since the game loop sequences the other subsystems.
    This should not be a haphazard decision; for instance, the data gathered from
    the networking subsystems often influences the decisions of the other subsystems,
    so it should be invoked first. The graphics subsystem should probably be last,
    since it reflects the data generated by all of the other subsystems.


    As you can see, a game engine is conceptually simple, but the devil is in the
