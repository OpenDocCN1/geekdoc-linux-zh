    # Understanding Commands and Objects


    Tcl represents data as objects (of type Tcl_Obj). This abstract structure allows

    Tcl to deal with strings, integers, and floating-point numbers without having
    to

    convert between types than necessary. Tcl_Obj is an abstract datatype,

    an you should avoid touching it directly. Tcl supplies functions for creating
    and

    accessing Tcl_Obj variables as strings, integers, and doubles. The library can

    convert Tcl_Obj objects between variable types whenever it needs to;

    instance, if you create a variable as an integer and then try to access it as
    a

    string, Tcl will perform this conversion behind the scenes. There is no real limit

    the number of variables you can create, but you should probably think twice

    about creating more than a few hundred (it''s rarely necessary and performance

    could suffer).'
