    # Warning


    SDL audio callbacks are usually called from a separate thread within SDL. The
    SDL.LockAudio and SDL.UnlockAudio functions provide a convenient way to protect
    audio-related structures from concurrency issues. SDL.LockAudio temporarily disables
    the audio callback, and SDL.UnlockAudio enables it. This feature is implemented
    with a simple mutex.


    The rest of the program simply plays sounds to keyboard input. To play a sound,
    we add it to the playing list and mark it active. The audio callback function
    then starts mixing this into the output the next time it executes.


    Once the event loop exits, our program pauses and unlocks the audio system so
    that the two sounds (which might otherwise be playing) can be safely deleted.
    It is a good idea to unlock the audio system before shutting it down. atex then
    shuts down SDL.CloseAudio and SDL.Quit.


    # Warning


    Be careful with pointers returned by SDL.LoadWAV. They might be allocated in shared
    memory, and so it is unsafe to free them with the normal function. Instead, always
    use SDL.FreeWAV to free these pointers. However, it is perfectly safe to free
    sound buffers that you have allocated yourself—provided that the buffers are not
    currently playing.


