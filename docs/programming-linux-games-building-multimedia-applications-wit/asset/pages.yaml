  md: '# Evaluating Mathematical Expressions


    Tcl itself has no support for mathematical operations; instead, mathematical expressions
    are passed as input to the expr command, which returns its result as a string.
    expr introduces a mini-language of its own (documented in its manpage), and it
    can handle any expression you would expect a command-line calculator to understand.
    You can use Tcl substitution to introduce variables into mathematical expressions.
    For example, set bar [expr $foo + sin($angle)]$ adds the sine of the angle variable
    foo, and saves the result in the variable bar. You could then use this value by
    substituting it into a statement as $bar.


    If you just need to increment or decrement a variable, the incr command is much
    more efficient than expr. For instance, incr foo -2 is equivalent to set foo [expr
    $foo - 2], but a bit faster.


    expr is not as slow as you might think, but it''s certainly a good idea to avoid
    it when you can. Tcl is designed for flexibility and simplicity, not speed. It
    is much better at string processing than number crunching; keep this in mind if
    you decide to use Tcl for your projects.


    # Lists


    Tcl does not have built-in support for lists or arrays. Instead, it provides a
    set of functions for treating specially formatted strings. This is clearly not
    the most efficient way to manage large sets of data, but it is fairly elegant,
    and it fits well with Tcl''s philosophy of simplicity and consistency. Tcl performs
    a certain amount of runtime optimization on data storage mechanisms, but don''t
    count on this to do much. If you need to store a large amount of data in your
    script, consider using associative arrays (which we won''t cover here) or storing
    the data in a C program.


    A list is simply a string of space-separated elements. For instance, the string
    foo bar quiz can be considered a four-element list. If an individual element contains
    spaces, enclose it in braces to prevent it from being treated as multiple elements.
    For instance, foo {Hello, world!} bar is a three-element list. You can create
    lists by hand or with Tcl''s list command. For instance, list foo {Hello, world}
    bar would return a three-element list. However, since Tcl lists'
  merge: -1
  pgno: 260
- img_proc: true
  md: '# GAME SCRIPTING UNDER LINUX 243


    are just strings, list is really just a command for quickly assembling a bunch
    of strings into one. This is handy for strange constructs involving multiple passes
    of substitution.


    The index command retrieves an element of a Tcl list by index, starting with zero.
    For instance, lindex `foo bar baz qux` returns baz, the third element of the list.
    The replace command allows you to edit elements in a list, and the linsert command
    allows you to insert elements into a list. See the Tcl manpages for more information
    about these commands.


    # Control Commands


    Tcl doesn''t have an if statement (a feature of just about every language out
    there), but it does have an if command. This distinction is really only a technicality;
    the command works exactly as you might expect. It takes an expression (of the
    same format expected by the expr command) and a value that is considered "true"
    (nonzero). If the expression evaluates to "false" (zero) and a second piece of
    code is provided, preceded by the token else, it is executed instead. These pieces
    of code are simply strings contained in curly braces.


    Likewise, Tcl provides a while command that executes a piece of code while an
    expression holds true. This is self-explanatory. Extremely simple to implement
    the while command in Tcl yourself (but rather pointless).


    ```

    switch foo {

    bar { puts "Bar!" }

    baz { puts "Baz!" }

    qux { puts "Qux!" }

    default { puts "Nothing!" }

    }

    ```'
