    # # Multiuser Dungeons


    Multiuser Dungeons (commonly known as MUDs) are multiplayer games, typically hosted
    on Internet servers and accessed with special MUD client programs. MUDs are extremely
    popular because one''s opponents are real people, not computer-controlled robots.
    MUDs are essentially text-based role-playing games, immersing their players in
    worlds with magical objects, wizardry, and battle. M fans wishing to host a game
    of their own often obtain a rewritten MUD server program and develop their own
    "world" through configuration files and scripting languages. If they do a good
    job, they may attract lots of players, which is very satisfying. Two popular MUD
    server programs are ROM and DikuMUD, which may be downloaded from the Internet.
    There are untold thousands of private ROM-based MUDs on the Internet.


    MUDs are relatively easy to create, writing a MUD server is not trivial, requiring
    a solid background in C or a knowledge of network programming. Creating MUD data
    requires little programming knowledge but a good MUD has an interesting game world
    to explore and a good balance of races and abilities. Also, MUDs are prone to
    "goding," or abuse by the person running the server; while this obviously depends
    on the players, good design can lessen this undesirable effect.'
