    Although it may be tempting to haphazardly throw the update subsystem into the
    game loop (discussed in the next section), do not do. Game projects tend to get
    out of hand quickly if they are not kept in a reasonable amount of order, and
    the update subsystem grows steadily throughout the development cycle; make the
    update system a separate module to begin with. If you don''t pay attention to
    code organization, you''ll end up with code that looks like 500,000 lines of spaghetti
    behind (no offense, Activision) Civilization: Call To Power.


    # The Game Loop


    The game (see Figure 1-1) loop is the "glue" that binds the various game subsystems.
    It is simply a while loop that runs throughout the entire game, looping anywhere
    from 30 to 60 times per second. The game loop invokes the correct routines to
    gather input from the player and from the network, updates'
