    in order at the other end. TCP is called a *stream* protocol because it implements
    a protected stream of data between two points. This is the flagship protocol of
    the Internet. Almost everything uses TCP, including the Web (HTTP) and file transfers
    (FTP). We''ll use TCP to link our multiplayer version of Penguin Warrior together.


    User Data Protocol (UDP), on the other hand, is not reliable and connection based.
    It is a *data* protocol—that is, it allows applications to send brief messages
    known as datagrams over the Internet, with no guarantee as to when the data arrive
    at the other end (the assumption being that it will probably get there, if network
    resources can accommodate it). Packets may arrive out of order, much later, or
    not at all. If they do arrive, UDP guarantees they will be correct and uncorrupted.
    UDP provides no flow control. It is easy to send UDP packets faster than the network
    can handle them, in which case some will probably disappear. Furthermore, there
    is a maximum (system-dependent) size for datagrams. This is never too low (or
    UDP would be useless), but you can''t count on UDP to send more a few hundred
    bytes per packet. Even though UDP is unreliable, it''s useful in many cases. We
    won''t use UDP in Penguin Warrior, as it would greatly increase the code''s complexity
    for only marginal performance gains.


    # Addresses and Ports


    Every computer on the Internet, whether connected through a high-speed line or
    with a lowly dialup modem, has a unique *IP address*. This four-number identifies
    the computer''s exact network location and provides the underlying IP protocol
    with enough information to route pieces of data to that computer from anywhere
    in the world. Some computers (mainly dedicated servers) keep the same (*static*)
    address indefinitely, but in most cases they are assigned new (*dynamic*) addresses
    each time they log on the network. Before you exchange data with a remote host
    over the Internet, you need to know its IP address. IP addresses are usually written
    as four-byte parts, separated by periods (for instance, my building''s router
    has the address 128.61.59.1). This is known as dotted dotted representation of
    an IP address. We''ll leave a more complete discussion of IP addresses and the
    mechanics of routing to other sources, since it''s mostly irrelevant to our game
    programming needs (and quite dry).'
