  md: '# Foreword


    I was honored when John asked me to write the foreword for this book. I''ve spent
    the last few years in an opportunity that few have had, the opportunity to get
    up close and personal with the source code to quote a few of the world''s most
    popular (and some less popular) games. I''ve had the chance to port these games
    to the Linux operating system, something that has been a source of sweat and sometimes
    swearing, but always of pride and joy.


    In these pages you will find the jewels of wisdom that John has picked up over
    a year of picking our brains, experimenting, and experience. Much of the information
    contained here has never been documented all in one place, whether you''re a beginner
    looking to start an open source game or a seasoned professional, I think you''ll
    find something to interest you. John has done a great job presenting the tools
    available for developing your games on Linux.


    Enjoy!


    Sam Lantinga

    Author of SDL'
  merge: -1
  pgno: 13
