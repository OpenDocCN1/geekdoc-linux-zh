    # Connecting TCP Sockets


    To originate an Internet connection, you first need to fill in a sockaddr_in structure
    with information about the remote host—most importantly its IP address and the
    desired port number. With this information ready, you can call connect to initiate
    a connection attempt. If fail, so is likely to be prepared – the Internet isn''t
    exactly an archetype of reliability. connect takes three parameters. The first
    is the socket to connect, the second is a pointer to a valid sockaddr in, and
    the third is the length of the address structure (this is necessary since connect
    is not specific to any particular protocol, and different protocols use different
    address lengths). connect returns 0 on success and –1 on failure.'
