    # A Quick Look Under the Hood


    Most games have a lot in common behind the scenes. The engine, or main code, of
    a “typical” game (if there is such a thing) can be logically divided into several
    subsystems: the input subsystem, the display subsystem, the audio subsystem, the
    networking subsystem, the update subsystem, and the main loop. These subsystems
    are rarely labelled as such, but you are likely to find all of these components
    in any given game. Each subsystem is often implemented with several separate source
    files; two or three in small games, but a hundred or more in a large production.
    We''ll look briefly at each of these subsystems now, and throughout the rest of
    the book we will explore possible ways to implement each.


    # This Code Is Awful!


    If you ever get a peek at the code behind a major commercial game, please do not
    take it as a treatise on proper software design or coding! Games start out as
    such well-designed software, and they sometimes make it not to the shelves in
    a tolerable state of internal organization, but more often than not a game''s
    code falls into disarray during the last few months of development.


    Why, might you ask? The gaming industry is volatile, dangerous, and extremely
    competitive. Game studios seem to find themselves in perpetual struggle to meet
    release deadlines, get games ahead of their competitors, and implement the features
    that players demand, lest they be left in the dust with a stack of unsold games.
    This often results in extremely hurried and sloppy code. Unfortunately, this often
    causes serious problems if someone later tries to add an expansion pack to the
    game or port the game to another operating system.'
