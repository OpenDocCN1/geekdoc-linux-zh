  md: 'compatible. (That is, your Vorbis-enabled software will be able to process
    all future versions of the Vorbis bitstream specification.)


    To my knowledge, there are no real drawbacks to using Ogg Vorbis for high-quality
    game music, except perhaps the decoding takes a significant amount of CPU horsepower
    (especially on antiquated, register-poor CPU architectures like the x86). MP3
    generally provides better performance than Vorbis at low data rates (significant
    in the quality/size trade-off) and on low-end processors, but these are also improving
    in Vorbis''s favor. Modern Linux boxes should have no trouble decoding high-quality
    Vorbis streams in the background.


    More information on the Ogg Vorbis project is available on the Web at http://www.xiph.org/ogg/vorbis/index.html
    or in #vorbis on ircopenprojects.net.


    # Working with Vorbis Files


    Although SDL supports Ogg Vorbis music (through the SDL_mixer library), this doesn''t
    help you if you''re using OSS or OpenAL. Fortunately, the Vorbis API is straightforward,
    and a complete Vorbis client can be written in fewer than 50 lines of code, with
    a bit of help from the libvorbis utility library.


    Decoding Ogg Vorbis streams is just as you imagine: The Vorbis libraries take
    in a stream of encoded packets and return a stream of PCM samples. There''s a
    small amount of extra complication involving multiple logical bitstreams but you
    can more or less avoid this if you''re interested only in implementing game music
    (though you could use this capability to store more than one soundtrack in the
    same music data file). Logical bitstreams are easy to create—just two .ogg files
    into a single file with the cat command.


    We''ll get to the nuts and bolts of working with Ogg Vorbis streams in the next
    section, but here''s a basic overview of what''s required:


    +   1. Install the Ogg Vorbis development kit, available from http://www.xiph.org/ogg/vorbis/index.html.
    At the time of this writing, you need at least libao, libogg, libvorbis, and libvorfile.
    These are all rather easy to configure and install.


    +   2. Include vorbis/vorbisfile.h and vorbis/codec.h (assuming a standard installation
    of the Ogg Vorbis libraries).'
