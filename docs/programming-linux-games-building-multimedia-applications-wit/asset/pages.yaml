    # Receiving TCP Connections


    Receiving network connections is just a little trickier than initiating them.
    First you have to create a socket and bind it to an address. Binding simply tells
    the networking software that a socket should be associated with a certain port
    on the local system. (Otherwise, the kernel will choose a random one, which is
    no good for most types of servers.) You can bind a socket to a local port with
    the bind function. After binding the socket, you inform the networking system
    that this is a listening socket (not one that will be used for initiating connections)
    and that the networking system should pay attention to connection requests on
    its port number. You can do this with the listen function.


    Once the socket is ready, you can enter an accept loop, in which you call accept
    repeatedly to handle incoming connections. Each accept returns a new socket (separate
    from the one you bound to the port) that''s connected with a client. You use close
    to close each of these client sockets when you''re finished with them. When you''re
    ready to stop accepting new connections, close the listening socket.


    It''s worth noting that more than one client can connect to any given port number
    at a time. The networking software makes sure that data gets routed to the correct
    sockets. The exact mechanics of this are beyond our present discussion.'
