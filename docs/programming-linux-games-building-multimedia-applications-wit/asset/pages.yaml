  md: '# Chapter 7


    # Networked Gaming with Linux


    It all started with id Software''s Doom. Once the number of computers with modems
    (mainly for surfing the bulletin board (BBS) systems of the time) had reached
    critical mass, it became feasible to build multiplayer games in which the players
    weren''t sitting at the same monitor or even in the same room. There were others,
    but Doom was the one that really got people thinking about networked gaming.


    Quite frankly, modem-to-modem Doom was a huge hassle. The two players had to have
    exactly the same version of the game, the same map (.wad) files, and compatible
    modems with correct parameters. It was difficult or impossible to change game
    settings after the connection was established, the players generally had to agree
    on over the phone ahead of time. If the connection failed, as would frequently,
    it was hard to know whether the next phone ring would be your friend calling to
    explain the problem or his computer trying to redial. the allure of playing against
    a real human halfway across town was enough to make deathmatch Doom one of the
    most popular games of the time and to use in a new era of online gaming.


    You''re in luck! Today you don''t have to mess with modem init strings or design
    your transport protocol to add multiplayer support to your games. Instead, you
    can rely on the operating system''s support for TCP/IP (the Internet''s workhorse
    protocol) and the user''s existing Internet connection. It''s no longer necessary
    to play with interrupts, serial ports, or flaky lines (though admittedly'
  merge: -1
  pgno: 289
- img_proc: true
  md: '272


    CHAPTER 7


    it was fun while it lasted—there''s nothing quite like programming a buggy

    UART chip in assembly). Thanks to the Internet, it''s easy to write code that

    communicates reliably with the other side of the world. And, of course, we all

    know the primary purpose of computers and the Internet is gaming, right?


    This chapter looks at the protocols and techniques that make it possible to write

    multiplayer games for Linux. We''ll start with a quick tour of TCP/IP and the

    basic layout of the Internet; then we''ll discuss the Linux networking interface.

    Finally, we''ll add two-player network support to Penguin Warrior.


    # ''Tis a Big Net, Quoth the Raven


    If you''re reading this book (which you presumably are, or else I''m talking to

    myself again), there''s a good chance you''re an experienced netizen and are more

    or less familiar with the Internet''s architecture. Or perhaps you''re just getting

    into the whole mess and aren''t familiar with protocols, packets, and routing.

    in any case, a quick refresher won''t hurt.


    # Internet Protocols


    The Internet is a bunch of computers that are set up to talk to one another.

    The language of the Internet is TCP/IP, a set of protocols (communications

    standards) that provide reliable data exchange over a wide area. Internet

    Protocol (IP) is a simple addressing and routing system that lets computers send

    short messages to one another, without any guarantee that the messages will

    arrive in or show up at all. Transmission Control Protocol (TCP) is a

    higher-level system that sits on top of IP and manages reliable point-to-point

    data transmission. You can use IP without TCP, but TCP depends on IP. Other

    protocols, such as Internet Control Message Protocol (ICMP) provide error

    reporting and other useful services. Together, the protocols that make up

    TCP/IP provide everything you need to send data anywhere in the world and to

    make sure it got there.


    From an application (game) programming perspective, we have two main

    protocols to work with. TCP, as we just mentioned, is good for establishing

    reliable data transfer connections between two computers. At the cost of a bit
    of

    overhead, it ensures that each byte sent from one will arrive undamaged'
