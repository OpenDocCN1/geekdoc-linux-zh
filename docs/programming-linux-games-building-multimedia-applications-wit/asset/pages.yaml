  md: '# Glossary of Terms


    alpha blending An operation that combines two pixel values together so as as to
    simulate a certain degree of transparency. This is done on a per-pixel basis with
    an additional piece of data called alpha value that represents each pixel''s translucency.
    *Page 92.*


    animation The art of fooling the human eye into perceiving motion.

    *Chapter 4.*


    artifact A (usually minor) audio or display glitch, often caused by an unexpected
    situation, insufficient performance, or a heavy system load. Some common artifacts
    are *shearing* and *flicker*. Artifacts are bad.


    blit A fast copy between two pieces of graphics data. Blitting is one of the most
    basic operations in 2D computer graphics. The word itself comes from block image
    transfer. *Page 83.*


    colormap See palette.


    direct color Somewhat uncommon but powerful display mode in which each pixel value
    is divided into three bitfields, each of which indexes a separate table. The values
    retrieved from these tables are used as the red, green, and blue components for
    the pixel. Direct color is essentially a powerful hybrid of *indexed* and *true*
    color modes. *Page 71.*'
  merge: -1
  pgno: 417
- img_proc: true
  md: '# double buffering


    Technique of drawing the next frame of animation in an off-screen buffer and *blitting*
    it quickly to the screen at the appropriate time. This reduces the possibility
    of various display *artifacts* by confining all actual display updates to a very
    short and carefully timed interval. *Page 102.*


    # engine


    The core of a game. A game engine coordinates input processing, graphics, audio,
    networking, and game rules to present the player with an interesting experience.
    Engines are frequently licensed between game companies to speed up game development.
    For instance, id Software has licensed derivatives of its Quake engine to several
    other game development studios. *Page 11.*


    # first-person shooter (FPS)


    A game in which the player controls a character from a first person perspective
    (that is, through the character''s eyes). Examples are id''s Quake series, Activision''s
    Soldier of Fortune, and Valve''s Half-Life. *Page 4.*


    # framebuffer


    Block of memory that represents the data on the screen. A framebuffer usually
    contains one or two bytes of information for each pixel on the screen. *Page 71.*


    # hicolor


    Also known as high color. Family of 16-bit *RGB* display modes with five or six
    bits for each color component. *Page 71.*


    # indexed display mode


    Display mode in which each pixel value is interpreted as an index into a table
    (*palette*) of predefined red, green, and blue values. *Page 71.*


    # latency


    In computer audio playback, the amount of time it takes a newly played sample
    to actually reach the speakers. This should only be a small fraction of a second.
    Network sound mixers like ESD and (to a lesser degree) aRTs are known to produce
    high latency. *Pages 176, 196.*'
  merge: -1
  pgno: 418
- img_proc: true
  md: '# GLOSSARY


    **mutex** Mutual exclusion lock. Used in multithreaded programming to keep two
    threads from trying to modify the same piece of data at once. *Page 121.*


    **packed pixel** Synonymous with *hicolor* or *true color*. The term refers to
    the fact that the color components of each pixel are packed into bitfields. *Page
    71.*


    **page flipping** Hardware-accelerated version of *double buffering*. In this
    case the offscreen buffer and *framebuffer* are identical and can be switched
    (“flipped”) at any time by updating a graphics card register. This avoids the
    need for blitting. SDL tries to use hardware paging if both SDL_SURFACE and SDL_DOUBLEBUF
    are specified when the mode is set. (Use the SDL_Flip function to perform the
    page flip each frame.)


    **palette** Used in *indexed* video modes to specify the red, green, and blue
    components of each possible color value. A palette is simply a table of RGB values,
    usually stored in graphics card registers. *Page 71.*


    **particle system** A group of individual, tiny objects, with a position and path
    of motion. Particle systems can be used to simulate anything from flying debris
    to vehicle exhaust. *Page 153.*


    **PCM** Pulse-coded modulation. The most common way of storing and playing digital
    audio samples. Each PCM sample represents the amplitude of the sound wave at a
    given instant. *Page 125.*


    **pixel** One blot of color on the screen. Pixels are arranged in a precise grid
    on the screen, and their colors are updated between 50 and 100 times each second.
    Each pixel has a distinct color, usually specified in terms of its red, green,
    and blue components, and this color data is stored in memory accessible to the
    computer’s graphics hardware. Less commonly known as *pels*. The name comes from
    *pictorial* element. *Page 70.*'
  merge: -1
  pgno: 419
- img_proc: true
  md: '# real-time strategy (RTS)


    A game genre in which the player controls a group of characters in some sort of
    conquest or battle, usually from an overhead view. Examples are Westwood Studios’
    Command and Conquer series and Blizzard Entertainment’s StarCraft. Page 6.


    # RGB display mode


    Display mode in which each pixel value is directly expressed in terms of its red,
    green, and blue intensities. Each component is usually specified with five to
    eight bits, depending on the particular mode. Two popular RGB formats are hicolor
    and true color. Page 71.


    # sample


    A single piece of audio data. Analogous to a pixel, a computer sound clip contains
    thousands of samples at regular time intervals. See also PCM.


    # shearing


    A common display artifact that occurs when a program tries to draw on the screen
    while the video controller is refreshing the screen. The result is that an image
    is only partially drawn on the screen for a split second. This isn’t disastrous
    and often goes unnoticed, but it can become distracting.


    # surface


    In SDL, a structure that represents a piece of graphics data. DirectX calls them
    buffers. Page 72.


    # triple buffering


    Technique similar to double buffering that uses two off-screen surfaces instead
    of one (three surfaces total). Triple buffering can be useful for taking advantage
    of graphics acceleration. Some video adapters are capable of copying data in the
    background, and triple buffering allows a program to draw to a third buffer while
    the hardware is busy swapping the other two.


    # true color


    24-bit RGB display mode with 8 bits for each color component. Page 71.


    # turn-based strategy (TBS)


    A game genre similar in some ways to the real-time strategy genre,'
  merge: -1
  pgno: 420
- img_proc: true
  md: 'except that the game is divided into distinct turns, often with no time limit
    imposed. At the risk of generalizing, TBS games involve more thought and careful
    planning, while RTS games require quick thinking. Examples are the Civilization
    series and Sid Meier''s Alpha Centauri (SMAC). Page 7.


    # voxel


    Short for Volumetric Pixel. Voxels are used to create fast but detailed renderings
    of complex objects. The most familiar use of voxels is terrain rendering, but
    the technique has also been applied in many other situations (for example, character
    rendering in Sid Meier''s Alpha Centauri, based on the Caviar animation library).
    Voxels are essentially pixels in three-dimensional space, and entire scenes of
    voxels can be rendered extremely quickly if some limits are placed on the scene''s
    geometry.'
  merge: -1
