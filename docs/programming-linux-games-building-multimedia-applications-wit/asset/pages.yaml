  md: '# Chapter 6


    # Game Scripting Under Linux


    Games tend to be extremely large these days, and it is usually impractical for
    programmers to worry about the details of level design and character behavior.
    For example, the game Soldier of Fortune (which has been ported to Linux) weighs
    in over 700 megabytes of disk space, and only a small fraction of this data contains
    actual code. The bulk of this space is consumed by 3D world data, character models,
    and scripts.


    Scripts allow game creators to control the behavior and artificial intelligence
    of maps and game characters without actually modifying their compiled code. Just
    as high-level languages (such as C and Java) allow programmers to accomplish tasks
    that would be practically impossible in pure assembly language (due to development
    time and complexity), game-scripting languages allow developers to quickly implement
    features that would not be practical to implement directly in the game engine.
    Scripts are simply special-purpose programs, usually written in customized scripting
    languages, that tie game worlds together. Game-scripting languages are often specially
    designed for a particular game, but programmers sometimes use off-the-shelf scripting
    languages for their games. Scripting also allows nonprogrammers to create worlds,
    and it can add a great deal of realism to games.


    In this chapter we''ll use the Tcl scripting language to add a scripted opponent
    to Penguin Warrior. Although Tcl is neither the fastest scripting language nor
    the most popular, it is extremely simple to embed into a program and extend with'
