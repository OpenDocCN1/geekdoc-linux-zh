  md: '# LINUX GAMING APIS


    # Graphics APIs


    Linux offers several options for graphics programming. Most of today’s Linux games
    use the X Window System in some way, as it is almost universally available, well
    supported, and at least tolerably fast.¹ Recently the Linux framebuffer device
    interface has been making inroads into gaming, and this interface has a lot of
    potential. Finally, SVGALib provides a way to get extremely fast access to SVGA-compatible
    video devices.


    # SVGALib


    As its name implies, SVGALib is a library for programming Super VGA-compatible
    video hardware, which is extremely fast because it directly accesses the system’s
    video hardware. SVGALib has fallen out of recent, due to its inconvenient interface,
    its failure to fully support many of today’s video chips, and its demand for root
    privileges. Furthermore, it is known to conflict with the X Window System, and
    in some cases it is incompatible with Linux’s new framebuffer device. While SVGALib
    is still under development, it is reasonable to predict that it just needs to
    continue to decline.


    SVGALib is distributed with a sister library called vgagl (not to be confused
    with the OpenGL library). The vgagl library provides higher-level drawing and
    blotting functions that make an SVGALib programmer’s life a bit easier. SVGALib
    also includes sublibraries for keyboard and mouse access.


    If you really want to mess with SuperVGA video cards, don’t mind locking up your
    console occasionally, and care too much about compatibility, SVGALib may be worth
    looking into. Otherwise, your hacking is probably spent elsewhere.


    > ¹ The X Window System is incredibly flexible, and it’s not really a bad platform
    for gaming. However, its design requires all graphics data to pass through predefined
    channels, and the use of extensions is required to achieve acceptable game performance
    in most cases (among these extensions are shared memory access and the XVideo
    extension). X was never really intended for today’s level of high-speed graphics
    processing. Some people think X should be replaced with a new system, but I believe
    it just needs a bit of rewriting in some areas. X has a lot going for it.'
