    the controller crosses the halfway mark, we update the first half of the buffer.
    We could reduce latency by dividing the buffer into more sections, but this should
    rarely be necessary. When the entire sound clip has been played, our program unmaps
    the DMA buffer and shuts down OSS.


    As you''ve seen, direct access to the DMA buffer is a powerful tool for squeezing
    performance out of OSS, but you should not count on its availability or even on
    reliable detection. Don''t be surprised if it doesn''t work on a good sound card
    or under different operating systems. The SDL toolkit uses DMA if the user specifically
    asks for it (with an environment variable), but it''s not a safe mechanism to
    use by default.


    That''s for OSS! It all boils down to configuring a file descriptor and sending
    samples to write. See Table 5 for a list of OSS ioctl calls.


    # Playing Sound with ALSA


    ALSA is a well-designed API, but unfortunately its design is still in progress.
    The native ALSA API seems to change slightly with each major release, and it''s
    somewhat of a moving target. We will describe the release that is current at the
    time of this writing, the 0.5.x series. For those who are frustrated with ALSA''s
    evolution, remember that OSS provides a somewhat ugly but consistent API that
    is ready now, while the ALSA project is trying to decide how to do it right (and
    from what I''ve seen, they are doing an excellent job). The finished product will
    be much more polished and pleasant to use OSS. For the time being, ALSA''s emulation
    module seems to work well enough, and the adventurous might enjoy using its API
    directly.


