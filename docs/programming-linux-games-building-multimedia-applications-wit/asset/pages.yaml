  md: '| SNDCTL_DSP_SETFMT | Sets OSS to use a particular sample format. Takes a pointer
    to an integer containing AFMT_format constant (defined in sys/soundcard.h). Changes
    this integer to reflect the format OSS was able to obtain |

    | SNDCTL_DSP_CHANNELS | Sets the number of channels. Takes a pointer to an integer
    containing 1 for mono, 2 for stereo. |

    | SNDCTL_DSP_SPEED | Sets the sound device''s sampling rate. Takes a pointer to
    an integer containing the desired sampling rate. Changes this integer to reflect
    the closest match that OSS could obtain. |

    | SNDCTL_DSP_SETFRAGMENT | Sets the sound driver''s fragment size. Takes a pointer
    to an integer. The top 16 bits define the number of fragments desired, and the
    lower 16 bits define the size of each fragment as a power of 2 (for instance,
    a value of 10 would result in a fragment size of $2^{10}$ or 1,024 bytes). There
    are reasonable limits on the minimum and maximum of fragments and the size of
    each, and OSS reserves the right to reject your selection. |

    | SNDCTL_DSP_GETSPACE | Queries the amount of buffer space available in the sound
    driver. Takes a pointer to an audio_buf_info structure (defined in sys/soundcard.h).
    Fills the structure with information about the driver''s buffer fragments. |

    | SNDCTL_DSP_GETCAPS | Queries the sound driver'' capabilities. Takes a pointer
    to an integer. Sets the integer to a bitmask of supported DSP_CAP_func functions
    (defined in sys/soundcard.h). |


