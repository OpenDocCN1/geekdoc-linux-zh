    As you can see, variables are substituted into the makefile with the $(VARNAME)
    notation. This is a literal text substitution, and it takes place before the rule
    is otherwise processed. What if you want to add to the end of a variable without
    destroying its contents? You might try something like this:


    ```

    F00=bar

    F00=$(F00) baz

    F00=$(F00) qux

    ```


    At a glance, it would appear that the F00 variable would end up with the value
    bar qux. However, Make does not normally evaluate variables until they are used
    (in targets), so F00 actually ends up with the string $(F00) qux. There are two
    solutions to this problem. GNU Make (the default Make on Linux systems) provides
    a := operator for assignments, which causes its right-hand side to be evaluated
    before the variable is assigned. It also provides a += operator for directly appending
    to variables. A more portable solution would be to assign bar, baz, and qux to
    three different variables and combine them all at:


    ```

    BAR=bar

    BAZ=baz

    QUX=qux

    F00=$(BAR) $(BAZ) $(QUX)

    ```


    This (hacked) solution allows the variable FOO to be constructed correctly when
    it is used in a rule. It is a rather ugly way to do so, however, we suggest using
    the GNU Make extensions.


    Although the use of variables might lengthen a makefile, they can provide a nice
    bit of abstraction. Variables make it easy to modify the options used throughout
    the build process without changing the whole makefile.'
