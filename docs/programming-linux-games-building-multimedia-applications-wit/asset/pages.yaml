  md: '# TO EVERY MAN A LINUX DISTRIBUTION


    +   - Although they''re developer-friendly, source tarballs aren''t exactly newbie-friendly.
    New Linux users often aren''t comfortable with building and installing software
    from source. (They''ll probably to learn how to do this eventually, of course;
    it really isn''t too difficult.)


    +   - Some systems aren''t meant to be developer workstations and therefore don''t
    have the necessary compilers and libraries to build a source tree.


    +   - A lot of people just want to download and install software without having
    to compile anything. In addition to the time it takes to build a project from
    source, binary distributions are often smaller than source.


    For these and other reasons, many Linux developers make precompiled packages of
    their software available. Each Linux distribution has its own idea of what exactly
    constitutes a “package,” and so developers often choose one or two major distributions
    to support. The most commonly supported package types are Red Hat''s RPM and Debian''s
    DEB. Neither of these are specific to their “parent” distributions; SuSE, Caldera,
    and TurboLinux are RPM-based, and Debian''s packaging system has found its way
    to Core Linux and Storm Linux (which are actually Debian offshoots).


    Package systems provide a bit of extra functionality over source tarballs. Package
    managers can usually install a package with a single command (in the case of RPM,
    the command `rpm -i package.rpm` does everything), they keep track of all files
    that were installed so that they can be removed later), and they facilitate version
    upgrades. Most importantly, package managers can help enforce dependencies. If
    your game needs version 1.1.6 or later of the SDL library, for instance, a package
    manager will make sure that the system has it before the user to install the package.


    If you want to learn how to make your own RPM packages, take a look at the book
    Maximum RPM by Edward C. Bailey. (This book is also available in its entirety
    online at http://www.rpmdp.org/rpmbook/) RPM isn''t a simple tool by any means,
    but like Autoconf, it''s worth learning if you intend to maintain complicated
    Linux software packages. Debian packages are even a bit trickier to'
