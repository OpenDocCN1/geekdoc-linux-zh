  md: 'We can use this information to calculate another important attribute of a video
    mode: its refresh rate. A high-quality video mode should refresh at least 75 times
    per second to reduce eye strain. Let’s calculate the refresh rate of the video
    mode illustrated in Figure 8-1, which has a dotclock frequency of 25.175 MHz (an
    arbitrary value particular to this mode; these timings are from a standard video
    database). If there are 25.175 million dotclocks per second, each dotclock lasts
    for approximately 39,722 picoseconds ($10^{-12}$ seconds). then complete scan
    (including both margins and the sync pulse), then takes $(48 + 640 + 16 + 96)
    \times 39 = 31,777,600$ picoseconds to draw. The entire refresh consists of $33
    + 480 + 10$ scanlines plus 2 scanlines for the vertical sync pulse, which comes
    to a total of 525 scanlines. If each scanline lasts for 31,777,600 picoseconds,
    the process takes about 0.0168 seconds to complete, for a refresh rate of 59.9
    Hz (usually rounded up to 60 Hz in documentation). This is not a very good refresh
    rate, but it’s acceptable for some applications.'
