    Function SDL_Flip(surface)


    Synopsis Swaps the front buffer and the back buffer on double buffered SDL display.
    If the display is not double, SDL_Flip just updates the entire screen.


    Parameters surface—Pointer to the main video surface (returned by SDL_SetVideoMode).


    # Warning


    The SDL_DOUBLEBUF and SDL_WSURFACE flags can actually damage performance or introduce
    new bugs in some cases. It wouldn''t be a bad idea to provide a game option for
    turning off these flags.


    The second problem is equally to avoid. The SDL_DisplayFormat function converts
    an image''s pixels to the correct format for fast blitting. This function accepts
    a surface as input and creates a new surface that can be displayed without conversion.
    The old surface can be freed with SDL_FreeSurface.


    Function SDL_DisplayFormat(surface)


    Synopsis Converts an image into an optimal format for fast blitting onto the screen.


    Returns Pointer to a newly allocated SDL_Surface on success, NULL on failure.
    Don''t forget to free the original surface – this function creates a new surface
    and doesn''t touch the old one. This is a very common memory leak.


    Parameters surface—Pointer to the surface to convert.


    # Warning


    The SDL_DisplayFormat destroys an image''s alpha channel, because alpha blending
    more or less precludes fast blitting (at least without hardware acceleration).
    Do not use this function on images intended for alpha blending.'
