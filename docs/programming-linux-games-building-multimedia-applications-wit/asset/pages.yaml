    client. It does not matter which role goes to which player; the players are completely
    equal after the link is established. Once the two players are linked, they will
    begin to exchange updates with one another. Each update packet will contain the
    world coordinates of the player that sent it (in other words, it says “I’m at
    this position; now reply with your position”). The players will send these packets
    back and forth as quickly as possible (with a small speed brake to keep from flooding
    the network). The game will end when the connection is broken (that is, when one
    of the players exits the game). It’s'
