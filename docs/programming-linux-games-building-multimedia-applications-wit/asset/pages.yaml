    In a more general sense, Make is often used as a simple interface to complex commands.
    Targets used for this purpose do not actually describe a build process but rather
    a set of commands to be executed when the target is requested. But what if such
    a “phony” target has the same name as a file in the current directory? For instance,
    what if there is a file called clean? Make would detect that file exists and would
    decide not to build the target.


    Make provides a special pseudo-target called .PHONY for this purpose. .PHONY takes
    a dependency list, just as other targets, but no build rules. .PHONY’s dependencies
    are marked as phony targets and will always be built when requested, regardless
    of any existing file by the name. Here is the previous makefile, rewritten to
    use the .PHONY target.


    ```

    foo: foo.c

    gcc foo.c -o foo

    ```


    ```

    clean:

    rm *.o

    rm foo

    ```


    # Error Handling


    In the event of an error, Make immediately stops stops and prints an error message
    (in addition to whatever was printed by the command that failed). Make detects
    errors by the return codes of the rules it executes: a return code of zero indicates
    success, and anything else indicates an error. Most UNIX commands follow this
    convention. If there is a syntax error in the makefile itself, Make will complain
    about it and exit.'
