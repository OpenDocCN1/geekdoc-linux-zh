  md: '# MASTERING SDL 129


    sound cards, hard drives, and video accelerators. You can periodically give the
    computer''s DMA controller buffers of several thousand PCM samples to transfer
    the sound, and the DMA controller can alert the program when the transfer is complete
    so that it can send the next block of samples.


    The operating system''s drivers take care of DMA for you; you simply have to make
    sure that you can produce audio quickly enough. This is sometimes done with a
    callback function. Whenever the computer''s sound hardware awaits quickly for
    more sound data, SDL in turn calls your''s audio callback function. The callback
    function must copy more sound data into the given buffer. This usually involves
    mixing several sounds together.


    This scheme has one small problem: since you send data to the sound card in chunks,
    there will always be a slight delay before any new sound can be played. For instance,
    suppose that our program needed to play a gunshot sound. It would probably add
    the sound to an internal list of sounds to mix into the output stream. However,
    the sound card might not be ready for more data, so the mixed samples would have
    to wait. This effect is called latency, and you should minimize it whenever possible.
    You can reduce latency by specifying a smaller sound buffer when you initialize
    the sound card, but you cannot realistically eliminate it (this is usually not
    a problem in terms of realism; there is latency in real life, because light travels
    much faster than sound).


