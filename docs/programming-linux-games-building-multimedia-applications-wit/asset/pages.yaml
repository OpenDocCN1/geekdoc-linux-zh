    Synopsis Opens an audio device suitable for OpenAL output.


    Returns Pointer to an ALCDevice structure on success, NULL on failure. On failure,
    you can retrieve error information with alcGetError.


    Parameters device—Platform-dependent device specifier. This should be NULL unless
    you have a good reason to use something else.'
