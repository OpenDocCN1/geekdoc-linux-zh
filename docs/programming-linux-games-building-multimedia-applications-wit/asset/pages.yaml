    vi


    pronounced "vee-eye" or "vie" is a rather old text editor with a strong following.
    It is difficult to master, but once you have learned its keystrokes and its quirks,
    it is hard to use anything else. vi works well on just about any Linux configuration;
    it requires almost no processor power and very little memory. It also has the
    nice advantage of being present on every UNIX-like system you''ll encounter, including
    most Linux systems. vi is a standard component of every major Linux distribution.


    Although vi is an old editor from the days when everyone worked over slow text
    terminals, it has been improved substantially by its users, and some modern versions
    (such as vim) are capable of syntax highlighting and other niceties. Several versions
    of this editor are also available for the X Window System, featuring pull-down
    menus and convenient shortcuts. However, these versions defeat one of the greatest
    features of vi: that it can be used over nearly any type of terminal. vi can be
    used efficiently over low-speed telnet connections, with local terminals, and
    even from Palm Pilots and other unusual devices. Its minimalistic interface requires
    very little functionality from the terminal. Graphical versions of vi throw this
    feature away and so can be considered substitutes for the original vi editor.


    vi is actually a full-screen editor to the command-based editing engine. ex can
    also be used outside of the vi editor as a command-line tool, and it can be used
    for adding editing capabilities to shell scripts. For instance, a script might
    invoke ex to edit a configuration file automatically. ex can be specified within
    the vi editor, although a tutorial on the nuts and bolts of ex is beyond the scope
    of this chapter.


    vi is a mode-based editor, and this is a major source of confusion. vi has two
    main modes: command mode and insertion mode. Command mode is strictly for issuing
    commands to vi. For instance, use this mode to move to a certain line in the document
    and delete a word. Command mode may not used for typing text into the document.
    Anything you type in command mode will be interpreted as a vi command (and indeed
    there are so many vi commands that nearly anything you type in command mode will
    do something). Insertion mode, on the other hand, is strictly for typing text
    into the document. Most commands are not recognized in this mode, and anything
    you type will be inserted into the document.'
