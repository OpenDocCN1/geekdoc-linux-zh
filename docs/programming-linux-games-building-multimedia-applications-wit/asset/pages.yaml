  md: "# 352\n\n# CHAPTER 8\n\nThis program is almost self-explanatory, but a few\
    \ comments are necessary.\nGPM's client library is absurdly flexible. I can't\
    \ fathom a game-related use for most of its functionality, and indeed we won't\
    \ scratch the surface of most of it).\nA of effort went into making multiple GPM\
    \ clients on the same console interact properly. GPM programming gets a lot simpler\
    \ when you realize that you actually need three of its API functions and that\
    \ you can ignore most of the options with them.\n\nThe GPM.Open function opens\
    \ a new connection to GPM. An application can connect to GPM as many times as\
    \ it wants (they grow as a stack), but we only need one connection. GPM.Open takes\
    \ a GPM.Connect structure, which contains information about the events and modifier\
    \ keys this connection should report. eventMask identifies two types of GPM events:\
    \ raw and cooked. Raw events are basic mouse actions, such as motion and button\
    \ clicks. Cooked events are higher-level interpreted actions, such as double and\
    \ triple clicks. These are of less interest. \nAn event mask of GPM_MOVE | GPM_UP\
    \ | GPM_DOWN asks GPM to report all motion, button presses, and releases, but\
    \ nothing else. We set minMod and maxMod to 0 and 65,535, respectively. GPM has\
    \ the ability to multiplex mouse input into modifiers (Ctrl, Alt, and so on),\
    \ but we can ignore this because we want events regardless of which keys are pressed.\n\
    \nGPM.Open returns a file descriptor to the GPM server. The protocol spoken over\
    \ this file descriptor doesn't matter; the GPM library handles for that. But this\
    \ is a UNIX file descriptor, and we can do all of interesting things with it,\
    \ particularly select. See the code's comments to understand how this fits in.\n\
    \nOnce we're connected to the GPM server, this function reports events that match\
    \ the eventMask we supplied to GPM.Open. With the event we mentioned earlier,\
    \ GPM.GetEvent will return a new event for just anything that happens to the mouse.\
    \ Beware aware that GPM.GetEvent is a blocking function; it waits until an event\
    \ is available before it returns.\n\nFinally, GPM.Close disconnects the GPM daemon.\
    \ If multiple connections were open, this would remove the most recent one from\
    \ the stack. That's all there to it, unless you want GPM to help with fullscreen\
    \ text-based interface management. However, unless you're trying to write the\
    \ next Neathack clone, I doubt this will be of interest."
