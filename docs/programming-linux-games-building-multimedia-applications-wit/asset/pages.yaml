  md: '274 CHAPTER 7


    What happens if more than one program on a single computer needs to send and receive
    packets at the same time? It seems as though the networking software might have
    trouble deciding which packets should go to which program. This would be quite
    a mess, especially on servers that need to handle hundreds of clients at a time.
    TCP/IP fixes this with the notion of ports. A port is just a number that identifies
    a particular receiving program. Certain port numbers are reserved for networking
    services like FTP and HTTP, but most of them are available for programs to request
    and use. You can think of ports as loading docks in a large shipping center. Packets
    are always marked with both a destination IP address and a receiving port number.
    When packets come in, the networking software sorts them out by port number and
    sends them to the corresponding programs. We''ll see how this works when we dig
    into some socket code later.


    # Name Resolution


    Humans are better at remembering names than numbers. As a result, IP addresses
    can be hard to keep track of. Domain Name System (DNS) makes the Internet easier
    for humans to gro by associating a short name with an IP address. DNS is a distributed
    database—it''s spread out over the Internet. The DNS name for an IP address is
    called a hostname, and hostnames usually belong to a top-level domain name (TLD).
    For instance, my system''s hostname is neutron, and it belongs to the patenturner.com
    domain (for a complete name of neutron.patenturner.com). If you type this name
    into a Web browser or any other client, the program realizes that you did not
    type an IP address and calls DNS into play. DNS first searches the enormous com
    database, finds contact information for the patenturner DNS server, and queries
    this server for a machine (which resides on a friend''s Linux box) locates neutron
    in a table, finds its IP address, and returns this information via the UDP protocol.
    All of this happens behind the scenes — the network client has to make only a
    single system call to initiate the lookup. We will demonstrate this process later
    in the chapter.


