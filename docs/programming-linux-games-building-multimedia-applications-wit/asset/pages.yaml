  md: '# LINUX GAMING APIS


    # libaudiofile and libsndfile


    libaudiofile and libsndfile are libraries for loading audio data from files. Each
    can read and write a wide assortment of file formats. There is a lot of functional
    overlap between these two libraries, but they have different interfaces. libsndfile
    is probably the more convenient of the two, and we will use it for loading wave
    files in Chapter 5. libaudiofile has a slightly more arcane (but perhaps more
    powerful) interface, but it can be a bit annoying to use.


    libsndfile was designed and written by Erik de Castro Lopo, and it is available
    under the GNU LGPL license. libaudiofile was originally implemented by Silicon
    Graphics for its multimedia workstations, but it has since been largely reimplemented
    as free software, and it has officially adopted by the GNOME project.


    You can find more information about libaudiofile in Chapter 5 or at the library’s
    home page, http://www.zip.com.au/%7EErikd/libsndfile/.


    libaudiofile is available at http://www.68.org/%7EMichael/audiofile/, but it is
    included in most Linux distributions. You’ll probably have to download libsndfile
    yourself. It’s worth the trouble.


    # Ogg Vorbis


    Ogg Vorbis is a new audio compression scheme designed to compete with MP3 and
    the upcoming (chymied) SDMI format. Vorbis is patent-free, and support for it
    can easily be dropped into an application with the libvorbis library. Although
    Ogg Vorbis is still under development, the bitstream format is finalized (meaning
    that future versions of Vorbis will not break compatibility), and, at this writing,
    it already compresses audio data slightly better than MP3 (with further improvements
    expected soon). Let’s have a round of applause for the people behind the Ogg project!


    We will use Ogg Vorbis to implement game music in Chapter 5. The Vorbis library
    is available for free download online at http://www.vorbis.com.'
