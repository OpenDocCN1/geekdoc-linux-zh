  md: '# Linking Against Tcl


    First things first: we need access to the Tcl library before we can use it as
    an extension language. Frankly, this is pretty easy. Once you''ve installed the
    library and C headers on your system, you can include tcl.h and link your programs
    against libcl.so (with the -ltcl flag). You''ll also need to be clever by renaming
    their Tcl libraries to reflect a particular version number, so you may have to
    look around a bit. Try compiling a "Hello, world!" with the Tcl library. If this
    works, you''re ready to go. For the purposes of this chapter, we''ll assume that
    your system has an appropriate libcl.so and that you know where to find it. You
    may have to modify Penguin Warrior''s makefile accordingly.


    # Executing Scripts


    Each Tcl session is represented internally by a Tcl_Interp structure. This structure
    keeps track of the script''s text, its activation stack, and its variables. Everything
    in Tcl is dynamically allocated, so there''s no harm in creating as many of these
    structures as you might find. (One will usually suffice, however.) Tcl_CreateInterp
    returns a pointer to a new Tcl_Interp structure, and Tcl_DeleteInterp gets rid
    of an interpreter that''s no longer needed. Penguin Warrior is a simple game,
    and it will run all of its scripting out of one interpreter.


    Once you have a Tcl_Interp to play with, you can feed it a script. There are two
    ways to get Tcl into an interpreter: you can load the script file ahead of time
    and pass it to Tcl (as a string) with the Tcl_Eval function, or run a script directly
    from a file. The choice is just a matter of convenience; Tcl doesn''t care how
    it gets its input. Tcl has a script to chew on, it will rip through the script
    as quickly as possible, adding any newly defined commands or variable assignments
    to its repertoire and executing anything else it finds. Tcl_Eval saves the result
    of the last command executed for later use (it''s the return value of the script,
    in last sense).'
