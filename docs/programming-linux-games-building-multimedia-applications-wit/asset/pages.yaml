    # Colorke and Transparency


    Games often need to simulate transparency. For instance, suppose that you have
    a bitmap of a game character against a solid background, and you want to draw
    the character in a game level. The character would look silly drawn as is; the
    background would be surrounded by a block of solid color. It would be much better
    to draw only the pixels that are actually part of the character, and not its solid
    background. You can do this with a colorkey. SDL provides support for this technique,
    and it even provides support for run-length colorkey acceleration (a nice trick
    for speeding up drawing). RLE (run-length encoding) provides an enormous performance
    boost for blitting colorkeyed images, but it is practical for bitmaps that will
    not be modified during the course of the program (since modifying an RLE image
    necessitates unpacking and repacking the image).


    A colorkey is a particular pixel value that a program declares to be transparent.
    (In SDL, this is done with the SDL_SetColor function.) Pixels that match an image''s
    colorkey are not copied when the image is blitted. In our example of a game character,
    you could set the colorkey to the color of the solid background, and it would
    not be drawn. Colorke make it simple to combine rectangular images of nonrectangular
    objects.'
