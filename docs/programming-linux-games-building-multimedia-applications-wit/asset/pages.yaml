  md: '# BSD Sockets


    A Socket is a UNIX file descriptor that designates a network connection relation
    than a file on disk. Sockets can be thought of as telephone handsets; they are
    communication endpoints through which data can be transferred in either direction.
    Sockets are most commonly used with TCP/IP, the stack of protocols behind the
    Internet.


    The advantage of programming with TCP/IP sockets is that TCP/IP is an incredibly
    versatile protocol. Some version of the BSD sockets API can be found in nearly
    every operating system, including Linux, Windows, BeOS, and Mac OS. TCP/IP can
    be used for both local (LAN) and wide-area (WAN) networking, and the protocol
    can be adapted to the nature of a particular game.


    Chapter 7 focuses on socket programming. Even if you decide to use an additional
    toolkit for convenience, it is important to understand how sockets and the underlying
    network protocols operate.


    # OpenPlay


    OpenPlay is the successor to NetSprocket, Apple''s network gaming support library.
    It is a cross-platform library (implemented in C), and it compiles on Linux as
    well as Windows and macOS. OpenPlay is released under the terms of the Apple Public
    Source License, which is a corporate-friendly license that seems to be remotely
    inspired by the GNU GPL. OpenPlay is a substantial API designed to compete with
    Microsoft''s closed and proprietary DirectPlay. OpenPlay shows promise, but its
    Linux port is still under development.


    It remains to be seen OpenPlay will catch on. Some Linux developers seem to disturb
    Apple (not always for rational reasons), but the finished port of OpenPlay will
    have a lot to offer. OpenPlay is available on Apple''s public source site, http://publicsource.apple.com.


    # IPX and SPX


    Internetwork Packet Exchange (IPX) is a simple networking protocol similar to
    the Internet''s underlying IP protocol, and Sequenced Packet Exchange (SPX) is
    a higher-level protocol similar to the Internet''s TCP protocol. These protocols'
  merge: -1
  pgno: 83
- img_proc: true
  md: '# CHAPTER 3


    (often collectively referred to as IPX) were designed by Novell for its NetWare
    line of products. IPX has fallen out of favor, but it is still used in a number
    of games. IPX is fine for small private LANs, but it is not ideal for large networks.
    Should you choose to support IPX in your games, the Linux kernel provides the
    necessary networking code (via the normal BSD sockets interface). It is not terribly
    difficult to support both TCP/IP and IPX with the same networking code.


    # File Handling


    Games often need to load images and audio samples from files. This can be a bit
    of a trick with today''s complex file formats and compression techniques. Fortunatelyately,
    you can usually avoid doing this decoding yourself—there are Linux-compatible
    libraries for just every type of image or sound file you could possibly want to
    load. Many of these libraries are free software.


    # libpng and libjpeg


    These libraries allow you to load Portable Network Graphic (.png) and JPEG (.jpg)
    images, respectively. PNG is an excellent general-purpose image format that compresses
    images without loss in detail. It is based on a completely open specification,
    and it is widely supported by image manipulation programs. JPEG is an older, “lossy”
    image format that does a good job with landscapes and natural scenes but produces
    noisy results with precision such as line art. JPEG is also an open standard.


    If you need to add support for PNG or JPEG images to a game, these libraries are
    the way to go. It would not be a good idea to try to implement either format unless
    you have a lot of time on your hands. We''ll use these libraries in this book,
    albeit indirectly: the SDL_image library (Chapter 4) links against them to provide
    seamless PNG and JPEG supporting.


    libpng is the official PNG reference library, and it is available at http://www.libpng.org.
    libjpeg is maintained by the Independent JPEG Group at http://www.ijg.org. These
    libraries are included in most Linux distributions.'
