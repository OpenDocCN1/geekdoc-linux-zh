    and it extends the language in various ways to make it more practical as a general-purpose
    programming language. MzScheme functions both as a standalone Scheme interpreter
    and an embeddable scripting library. If you''re interested in using Scheme as
    an extension language, MzScheme would be an excellent choice. It is available
    at http://www.cs.rice.edu/PLT.


    # Python and Perl


    You''re probably familiar with Python and Perl, and you may already be proficient
    in one of these languages. While most used as standalone scripting languages,
    Python and Perl can also be embedded in applications to provide modular scripting
    support. We won''t be using these languages in this book (we''ll use Tcl instead),
    but their scripting interfaces are not terribly difficult (very similar to Tcl,
    which we''ll discuss in Chapter 6). Perl is superb for string processing, and
    Python has a bit of an object-oriented slant. Which language is better suited
    to game development anybody''s guess?


    Perl and Python are available from http://www.perl.org and http://www.python.org,
