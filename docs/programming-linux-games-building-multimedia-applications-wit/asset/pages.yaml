  md: '# Chapter 2


    # Linux Development Tools


    As an operating system created by computer geeks, Linux provides a particularly
    nice programming environment. Although it may be a bit intimidating and confusing
    at first, it provides a great deal of power after the initial learning curve.
    In this chapter we will examine the basic Linux programming tools from the perspective
    of a game developer.


    If you are already experienced with Linux or UNIX programming, some parts of this
    chapter will be of less interest to you. We will cover specific details of these
    tools later as we encounter them, so you will not be at a loss for skipping over
