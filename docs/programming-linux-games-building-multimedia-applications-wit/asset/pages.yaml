  md: '# NETWORKED GAMING WITH LINUX


    # Network Gaming Models


    The ultimate goal of a networked game is to allow two or more players to participate
    in a single game universe at the same time. Whether they are competing against
    each other or cooperating in a battle against other opponents is of little consequence.
    All networkable games need to solve the basic problem of keeping the players informed
    about the state of the running game. Here are some of the more common approaches
    to this problem:


    # Client/server


    Each player uses a local copy of the game (a client) to connect to a single central
    machine (the game server or dedicated server) that knows the game''s rules and
    serves as a master authority on the game''s state. Clients send updates to the
    server, and the server sends authoritative updates back to each client. In this
    model, the server is always right. It is very difficult to cheat in a client/server
    gaming situation, because every client talks to the same server, and the server
    applies the rules to everyone. This is the most common setup for online games.


    # Peer-to-peer


    This approach is good for small games like Penguin Warrior. Each player''s computer
    maintains a local copy of the game''s state and informs all of the other computers
    whenever anything changes. The main problem with this system is that it is very
    easy for players to cheat by modifying their local copies of the game. There is
    no centralized “referees” in peer-to-peer multiplayer games.


    # Client is a server


    In some cases it is convenient to build the game server code into the game itself,
    so that any player with a fast computer and a reasonably fast network connection
    can “host” a multiplayer game for friends. This method is a little less prone
    to cheating than the peer-to-peer model, but an untrustworthy player could covertly
    modify the server to gain an advantage.


    It is fallacious to think that closed source binary games are immune to cheaters;
    Ultima Online and Diablo are evidence to the contrary. Any sufficiently idle'
