  md: '# Loading Sound Files


    SDL provides a convenient SDL_LoadWAV function, but it is of little use to programs
    that don''t use SDL, and it reads only the wave (.wav) file format. A better option
    is the sndfile library maintained by Erik de Castro Lopo, which contains routines
    for loading nearly every common sound format. This library is easy to use, and
    is available under the GNU GPL (the more restrictive GPL). You might also consider
    Michael Pruett''s libaudiofile library, a free implementation of an API originally
    developed by Silicon Graphics. It is a bit less straightforward than sndfile,
    however.


    # Using sndfile


    The sndfile library makes it easy to read sample data from a large number of sound
    formats. Sound files in any supported format are opened with a single library
    function, and individual samples can then be read with a common interface, regardless
    of the format''s encoding or compression. Your program must still take the size
    and signedness of the sample data into account, but sndfile provides the necessary
    information.


    The sf_open_read function opens a sound file for reading. This function accepts
    a filename and a pointer to an SF_INFO structure and returns a pointer to a SNDFILE
    structure. The SF_INFO structure represents the format of the sound data: its
    sample rate, sample size, and signedness. sf_open_read fills in this structure;
    your program does not need to supply this information in most cases. The SNDFILE
    structure returned by sf_open_read is a file handle; its contents are used internally
    by sndfile, and they are not important to us. sf_open_read returns NULL if the
    requested file cannot be opened. For the curious, sndfile provides a sf_open_write
    facility for writing sound files, but this facility is beyond our needs.


    After opening a sound file and obtaining a SNDFILE pointer, your program can read
    samples from it. sndfile provides functions for reading samples as short integers,
    integers, or doubles. Each sample (8- or 16-bit) is called an item, and a pair
    of stereo samples (or one mono sample) is a frame. sndfile allows you to read
    individual items or complete frames. The sf_readf_short, sf_readf_int, and sf_readf.double
    functions read frames from a SNDFILE into buffers of various types. sf_readf.double
    can optionally scale samples to the interval'
