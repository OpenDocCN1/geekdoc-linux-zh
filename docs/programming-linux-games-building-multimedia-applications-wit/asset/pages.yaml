    working framebuffer device for this chapter to be of much use, and you probably
    shouldn''t try these examples from within X (since the kernel will quite happily
    overwrite X''s graphics output). If you''re not sure whether or not you have a
    working framebuffer device, look for the file /dev/fb0, prod it with the touch
    command. If you can touch the file, your framebuffer device is probably alive
    and well. A more risky (and entertaining) way to check for a framebuffer device
    is the following:


    ```

    $ /dev/urandom > /dev/fb0

    ```


    If your screen is flooded with random garbage, you definitely have a working framebuffer.
    (This could also trash your console, do mean things to the kernel, or cause exploding
    monkeys to overrun your place of residence; do it at your own risk. I''ve never
    had any of these happen, though)


    # Pros and Cons of the Linux Framebuffer


    The Linux framebuffer device wasn''t designed for gaming. It can be bent to that,
    but its primary purpose is to support the framebuffer console system. What makes
    it any different from an interface like SDL? Here are a few of the framebuffer
    device''s less agreeable features:


    +   - It''s Linux-specific. You won''t find the fbdev interface anywhere else.
    That''s fine for our purposes, since this is primarily a book about Linux game
    programming, but you wouldn''t be able to use framebuffer device code on FreeBSD,
    for instance.


    +   - It doesn''t do pixel conversions. It hands you a chunk of framebuffer memory
    and expects you to sort it all out.


    +   - Its mode-setting interface is unbelievably obtuse. You actually have to
    program new video timings via an ioctl call. You can get lists of valid timings
    from a number of places, but it''s up to you to handle them. I''m sure many would
    call this a feature, since there''s little between you and the video signal generator,
    but it''s quite a nuisance if you just want to write some quick video code and
    you don''t want to use'
