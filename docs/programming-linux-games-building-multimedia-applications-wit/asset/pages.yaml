    We begin by initializing SDL as usual, adding the SDL_INIT_AUDIO bit flag to specify
    that SDL should prepare the audio subsystem for use. We also initialize the video
    subsystem for the purpose of reading keyboard events. Next we install a atheist
    hooks: for the usual SDL_Quit function, and one to specifically close the audio
    device on shutdown. The latter hook is important, as failure to close the audio
    device properly can result in a segmentation fault when the program exits. At
    this point the sound card is not actually ready for output; we have only set SDL’s
    basic infrastructure.


    The next step is to initialize the sound card for an appropriate sample format.
    Our program builds an SDL_AudioSpec structure with the desired sound parameters
    and calls SDL_OpenAudio to prepare the sound card. Since it is possible that the
    requested sample format will not be available, SDL_OpenAudio stores the actual
    sample format in the SDL_AudioSpec structure passed as its second parameter. We
    can use this structure to convert our sound data to the correct format for playback.
    Our program requests 16-bit samples at 44 kHz. 8-bit sound is lacking in quality,
    and unsigned 16-bit samples are not supported by SDL.


    | Function | SDL_OpenAudio(desired, obtained) |

    | --- | Synopsis | Initializes the computer’s sound hardware for playback at the
    specified rate and sample format. If the requested format is unavailable, SDL
    will pick the closest match it can find. This function does not let you select
    a particular sound device; if you need to do that, check the SDL_InitAudio function
    (not documented here, since SDL_Init normally takes care of that). |

    | Returns | 0 on success, -1 on failure. On success, fills obtained with the rate
    and sample format of the sound device (which may not be exactly what you requested).
    |

    | Parameters | desired—Pointer to an SDL_AudioSpec structure containing the desired
    sound parameters.'
