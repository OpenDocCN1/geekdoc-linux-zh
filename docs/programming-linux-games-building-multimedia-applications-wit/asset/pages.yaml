  md: "# CHAPTER 2\n\nShared libraries follow a very specific naming scheme designed\
    \ to keep incompatible versions separate. Each shared library should be given\
    \ a unique base name (or soname) of the form libFooBar.so.n, where n is a major\
    \ release number. The major release number should be incremented whenever backward\
    \ compatibility is broken. Minor version and release numbers (indicating slight\
    \ revisions that shouldn't affect compatibility) are added to the end of the base\
    \ name, so that the final name looks something like libFooBar.so.2.1.3.\n\nThe\
    \ ldconfig utility imposes sanity upon the various versions of a library that\
    \ might exist. It searches for libraries in a certain set of directories, usually\
    \ specified in /etc/ld.so or the environment LD_LIBRARY_PATH. Each library it\
    \ finds with a name in the form libSomething.so.m.r, creates a symbolic link for\
    \ libSomething.so.m. If two libraries have the same base name, ldconfig creates\
    \ a symbolic link to the later version. Applications reference these symbolic\
    \ links rather than the full names of the libraries. If a new release of a library\
    \ is installed, ldconfig updates the symbolic link, and all applications that\
    \ use the library will automatically reference the new version.\n\n# Creating\
    \ Shared Libraries\n\nShared libraries are simple to create. First, compile your\
    \ sources into object files with the -fPIC flag. This causes gcc to output position-independent\
    \ code, which is more palatable to the dynamic linker. Then link gcc with the\
    \ -shared flag. You will also need to inform the linker of the soname you wish\
    \ to use. To see how this is done, take a look at the following example:\n\n```\n\
    $ gcc -fPIC foo bar.c\n$ gcc -shared -Wl,soname,libFooBar.so.1 foo.o bar.o -o\
    \ \\\n    libFooBar.so.1.1.1\n$ su\nPassword:\n# install -m 0755 libFooBar.so.1.1.1\
    \ /usr/lib\n# ldconfig\n# ln -s /usr/lib/libFooBar.so.1 /usr/lib/libFooBar\n#\
    \ exit\n```\n\nThe first command produces the object files foo.o and bar.o, and\
    \ the second creates the shared library. Note the use of the -W1 flag to send\
    \ options directly"
