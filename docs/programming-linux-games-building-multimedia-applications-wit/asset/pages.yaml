  md: '# 3D World (Top-Down View)


    ![](img/0de55c1076ffcb1d2a6b324f1ff4658d_226_0.png)


    An OpenAL world


    Object properties are the key to getting along with OpenAL. Rather than providing
    separate functions to set each property of a given object, OpenAL defines symbolic
    names for each property an object can have and supplies a few generic functions
    for accessing them by name. Instead of functions like `alSetSourcePosition` and
    `alSetSourceOrientation`, OpenAL provides a single `alSourcefv` for modifying
    the vector properties of source objects, `alSourcefv(obj, AL_POSITION, pos)` would
    set the position of the source object `obj` to the vector in `pos`. (A vector
    in this case is just an array of three `ALfloat` values.). The OpenAL specification
    lists all of the possible properties each type of object can have, and you can
    find some of the more important ones in the Penguin Warrior code later in this
    chapter.'
