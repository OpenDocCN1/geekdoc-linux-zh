  md: '# Warning


    Generally speaking, minor tweaks to OSS parameters (such as setting a custom fragment
    size) are safe; they are unlikely to break compatibility with most drivers or
    even ALSA''s OSS emulator. I used a laptop with the ALSA sound card to create
    these code examples. ALSA''s OSS emulation is less perfect, and the examples worked
    slightly differently under ALSA and OSS. It is important to test audio code on
    as many systems as possible and with both ALSA and OSS. Audio programming involves
    a lot of fine-tuning; in a world with thousands of different audio cards, it is
    far from a precise science.


    # Achieving Higher Performance with Direct DMA Buffer Access


    Sometimes OSS''s basic mechanism of writing to the sound device does not provide
    sufficient performance. OSS provides an alternative, but it is neither pretty
    nor. It is possible to use the UNIX mmap to gain direct access to the sound driver''s
    DMA buffer. The DMA buffer is a region of memory that the system''s hardware scans
    for samples at regular intervals; it is the audio equivalent of the raw video
    framebuffer. If your program can somehow gain access to the DMA buffer, it can
    mix and send its own fragments directly to the sound card, without any driver
    intervention. Latency is still a concern, but this bypasses the driver''s internal
    buffering and therefore gives you the power to push latency as close to the line
    as you wish (at the risk of skipping or other anomalies).


    Direct DMA buffer access is absolutely not portable. It is known to be incompatible
    with certain configurations (including my laptop, much to my chagrin), but it
    will probably work on most Linux-based systems with “normal” sound hardware. This
    particular example did work on FreeBSD 4.1 system, but with a noticeable choppiness.
    So far it has worked on one of my Linux systems. We recommend this technique if
    possible, or at least providing a “safe” alternative in case DMA initialization
    fails. Have you ever been frustrated that an OSS application (such as Quake 3)
    would not work with the ALSA or ESD emulation drivers? Direct DMA access was likely
    the cause. However, these applications do enjoy audio performance with less CPU
    usage.'
