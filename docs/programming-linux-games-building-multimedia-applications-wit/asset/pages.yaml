    # Debugging Multithreaded Applications


    Games frequently use multiple threads of execution to smoothly coordinate the
    various parts of the game engine. Unfortunately, multithreading has always been
    a thorn in the side of source-level debuggers. gdb can debug multithreaded applications
    locally, and it cannot attach to more than one thread of an application that is
    already running. This is because threads under Linux are implemented as separate
    processes that share an address space, and each thread has a separate process
    ID. gdb needs to catch threads as they are created in order to debug.


    When gdb suspends a multithreaded application, it suspends all of its threads
    at once. This allows you to switch between threads and examine the program without
    the fear that something will change in the background. However, single-stepping
    a multithreaded application may result in more than one line of code being executed
    in some threads; gdb only controls the execution of one of the threads.


    Unfortunately, multithreading causes problems with watchpoints. gdb can reliably
    detect memory changes only within the current thread; it might fail to detect
    a change caused by another thread. Watchpoints can still be useful in multithreaded
    applications, but you will have to determine which thread is causing the change
    on your own.'
