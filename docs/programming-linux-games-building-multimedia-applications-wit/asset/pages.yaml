    games use prediction or another clever strategy, players will always be out of
    sync by the amount of time it takes to exchange network packets. A reasonable
    average latency for Internet games on fast connections is 100 milliseconds (ms),
    and any game should be able to handle this amount. However, the average latency
    can easily rise to the vicinity of 500 to 1000 ms if slow network devices (modems)
    are involved, and at this level it can become quite distracting. For instance,
    a player might fire a weapon and see the effects a second later. Some games use
    statistics to guess what the other players will do during the next update interval,
    which can make a multiplayer game much smoother. Prediction would be overkill
    for something like Penguin Warrior, Quake and Half-Life make heavy use of this
    technique.


    # Security Issues


    For reason, many players get a thrill out disrupting the normal course of a game
    for others. Players of Diablo and Diablo Online have access to any number of programs
    that mess with the underlying game code to give them an unfair advantage. Fans
    of the Half-Life multiplayer modification Counter-Strike constantly run into “skin
    healers” who modify their player models to make themselves invisible or make their
    enemies easier to spot. Cheating is an unfortunate part of online gaming. There
    are a lot of smart people out there who get a kick out of gaining an unfair advantage
    in the games they play. As if this weren’t bad enough, these people often make
    their cheats available to their friends, and the problem grows exponentially.
    Although no game is perfectly secure against the determined checker, good design
    can make cheating very difficult.


    The problem is pretty simple. Most major online games use a client/server model
    (see page 301). Client/server games should theoretically do all of the world''s
    processing and error checking on the server side, leaving nothing important to
    the clients. If this were always the case, hacked clients would be of no consequence,
    and games like Half-Life would be free of cheaters.


    For basic performance reasons, however, very few games actually work this way.
    If a client had to run everything through the server, performance would be abysmal.
    Most games at least the client do a bit of preloading, prediction, or collision
    detection. This work stays hidden from the player, unless someone'
