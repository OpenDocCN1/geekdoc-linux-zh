  md: '# Keyboard Input from a Terminal


    When a program runs under the framebuffer console, it is really running under
    a specially configured Linux virtual terminal (VT) and is therefore subject to
    normal terminal keyboard handling. This is fine if we want to read lines of text
    (with *fgets*, for instance), but games require much more sophisticated input
    processing than this. Fortunately, it is possible to reconfigure virtual terminals
    (with *ioctl*) to gain direct access to keyboard scancodes.


    This can get hairy, so we''ll delve into the basics here. If your input-handling
    needs are more complex, you might try either SDL''s input code or the libgi library
    (an input device interface meant to complement the GGI graphics library).


    # Scancode Madness


    At the hardware level, a keyboard is nothing but a set of buttons connected to
    a grid, a small microcontroller for detecting button presses, and a serial cable
    to talk to the computer. When you press a key, the microcontroller detects a *scan*
    (keyboard scan) code. It sends this code over the wire to the computer''s motherboard,
    where another microcontroller translates it into one or more *scancode* bytes.
    The operating system reads scancodes from the motherboard''s keyboard controller
    through port 60h.


    The X Window System deals with scancodes directly (they''re easy to get from the
    kernel if you''re inclined), but the kernel can optionally take the process step
    further by translating scancodes into *keycodes*. Keycodes are eight-bit values,
    in which the lower seven bits indicate the key (no problem, most keyboards contain
    fewer than 128 keys) and the eighth bit indicates a press or a release.


    So far this seems easy to handle; where does the madness come in? The problem
    lies in associating values in the local character set (ASCII, for instance) Even
    though we may not need to generate text in response to key presses,² we probably
    do need to know which of the 128 possible keycodes


    > ² If you need to generate text in response to key presses, it might be a good
    idea to set the'
