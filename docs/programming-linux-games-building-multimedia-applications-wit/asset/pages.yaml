    The display subsystem is responsible for taking advantage of the available display
    hardware. Serious gamers often equip their machines with snazzy 3D graphics cards,
    which can bring enormous performance and quality improvement to 3D games. However,
    this performance boost is not automatic and requires special effort by the programmer,
    which is usually accomplished through an API (application programming interface,
    essentially a big library of routines) like OpenGL. 3D acceleration is beyond
    the scope of this book, but we''ll demonstrate how to use OpenGL by running in
    Chapter 4.


    Before you can show your graphics code, you''ll need something to display. Although
    it is common for programmers to develop temporary artwork for testing purposes,
    few are skilled artists, and they usually find it necessary to enlist the help
    of a skilled digital artist to produce acceptable game artwork. Players are a
    finicky bunch, and they are not intolerant of subpar graphics. Game programmers
    should spend a great deal of time developing a good graphics engine, and a designer
    should place a high priority on obtaining artwork for a game.


    # The Audio Subsystem


    Although computer audio technology has not been hyped as much as computer rendering
    technology during the past few years, a game''s audio subsystem is every as important
    as its graphics subsystem. Fortunately, producing high-quality sound on a computer
    is not as difficult as producing high-quality graphics.


    Sound is easy to play back (usually a simple matter of a few calls with a multimedia
    toolkit), but creating production-quality sound effects for a game is as much
    art as creating graphics, and should be left to a specialist. Stellar sound effects
    can boost a game''s atmosphere, and loud sound effects can seriously damage a
    game''s potential.


    3D enhanced audio is one of the latest trends in computer sound technology with
    modern sound cards (like Creative''s SB Live! series) supporting four-speaker
    surround-sound, and 3D-aware sound-processing to simulate the Doppler effect and
    other complex sound wave interactions. (Simple two-channel stereo sound just falls
    short of the immersive environments of today''s 3D games.) In fact, some sound
    cards can even accelerate these effects in hardware. Several'
