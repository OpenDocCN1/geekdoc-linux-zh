  md: '# CHAPTER 10


    configure that will configure the project''s makefiles to correctly build and
    install everything for the current system. Ideally, Autoconf-enabled programs
    are very easy to install, with a sequence of commands like the following:


    ```

    $ tar xvfz fooblaaster-1.1.tar.gz

    $ cd fooblaaster-1.1

    $ ./configure

    $ make

    $ make install

    ```


    If you''ve ever installed software on a Linux system, this probably looks familiar.
    Of course this example is just meant to illustrate how convenient Autoconf can
    be—it''s probably a bad idea to install a program blindly without reading the
    docs (or without typing ./configure --help to get a list of configuration options).


    What exactly does this black box of a script do? You may have noticed that Autoconf-enabled
    source trees are full of files called Makefile.in. The configure script first
    gathers information about the local system, and then goes through the source directory
    and converts these files into final makefiles for the project. As it copies each
    Makefile.in to a corresponding Makefile, configure adds a bunch of environment
    variables that describe the system, as well as C programs can use for customization.
    A simple invocation of the Make utility can then build the fully configured program.
    It''s worth noting that you should never alter a configure script by hand; the
    proper way to make changes is to edit Makefile.am and generate a new script.


    Autoconf can be fairly complex to set up, and we''ll leave a discussion of its
    specifics to other sources. Learning Autoconf is definitely worth the effort if
    you plan to make a large source tree available to your users.'
