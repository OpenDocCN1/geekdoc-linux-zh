    upload hundreds of large samples into the ESD server (since they remain resident
    in memory until they are deleted), but there should be no problem with uploading
    a set of reasonably small sound clips for the duration of a game. As useful as
    this may seem, however, there is a problem: it is not possible to adjust the volume
    of a sound clip once it has been uploaded. Games frequently vary the volume of
    sounds to indicate their relative distance from the listener''s position, and
    this is not possible with ESD sampling caching. Nonetheless, this limitation may
    not be an issue for some games, and sample caching may provide a practical way
    to avoid extreme latency.


    The ESD library actually supports two types of server connections. We have already
    seen the first, which is used for sound playback. Most ESD applications need only
    this type of connection. The second type provides a channel for controlling the
    server. After obtaining a control handle with `esd_open`, an application can lock
    the ESD daemon (block all clients from connecting), temporarily shut down ESD''s
    playback capabilities (and release the `/dev/dsp` device), or manage the sample
    cache. Control changes should be closed with `esd_close` when they are no longer
    needed.


    To upload a sample to ESD''s cache, establish a control connection and call `esd_sample_cache`.
    This will return an integer cache ID that you can use to reference the sound clip
    in the future. Upload the complete sample with `write`, making sure to check `write_confirm`''s
    return value to verify that the entire sample has been uploaded. Finally, call
    `esd_confirm_sample_cache` with the clip''s ID to check that ESD received all
    of the data. After the sample has been uploaded, you can play it by calling `esd_sample_play`
    with the sample''s ID. A program should explicitly delete all of its cached samples
    before it exits by calling `esd_sample_free` with each sample ID.


    ESD is a useful but somewhat flawed sound interface, and you should support it
    if you can do so without giving yourself a headache. Many games support ESD with
    the understanding that its latency will be annoying, but that some users will
    want to use it anyway.


