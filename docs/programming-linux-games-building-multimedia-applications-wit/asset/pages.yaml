  md: 'TO EVERY MAN A LINUX DISTRIBUTION


    393


    # Understanding the Linux Filesystem Standard


    Linux evolved from Linus Torvald''s pet project into a full-blown multiuser operating
    system, and its filesystem has gone through a long period of evolution. A while
    back people decided that it wouldn''t do for each Linux distribution to use a
    different filesystem, and so an effort was made to settle on a standard. Originally
    dubbed the Linux Filesystem Standard, this document has grown into the Filesystem
    Hierarchy Standard (FHS), and it is meant to apply to all UNIX-like operating
    systems. Most Linux distributions do a fairly job of adhering to the FHS, which
    makes life easier for application (and game) programmers who would like to support
    many systems as possible.


    We won''t duplicate the FHS here; it''s pretty long, and you can browse the whole
    thing at http://www.pathname/fs. We will simply offer a brief overview of the
    filesystem and give a few hints about where your game should put its files. Following
    these will keep your users happy and reduce the possibility of your game damaging
    someone''s filesystem. We''ll start with an overview of the top-level directories
    on a typical Linux box.¹10


    +   / The top-level directory. Don''t put anything here.¹¹¹


    +   bin/ Important binaries that the system needs to boot. Don''t touch this directory
    unless you have a very good reason (which is unlikely if your product is a game).


    +   boot/ The Linux kernel and various bootloader information.


    +   dev/ Device files, such as dsp. You may need to access some of these, but
    it''s unlikely that you''ll need to modify them.


    +   etc/ Systemwide configuration files. Game configuration files almost certainly
    do not belong here.


    > ¹⁰ Much of this information is directly from the Filesystem Hierarchy Standard,
    version 2.1.


    > ¹¹ The FHS forbids compliant distributions from adding new top-level directories,
    but some do anyway.'
  merge: -1
  pgno: 411
- img_proc: true
  md: '# CHAPTER 10


    394


    home/


    Home directories for each user. For instance, my home directory is **home/overcode/**.
    Programs and scripts can retrieve the current user''s home directory with the
    HOME environment variable. **home/** is sometimes actually stored in **usr/home/**
    and linked to **home/**.


    lib/


    System libraries and kernel modules. Don''t put anything there unless your application
    requires special kernel modules (which is very unlikely and potentially very dangerous).


    mnt/


    A temporary filesystem mount point. For instance, floppies and CD-ROMs are frequently
    mounted here.


    opt/


    A somewhat controversial (but standardized) place for applications to add their
    own directory trees. Very similar to **/usr/local**, and roughly equivalent to
    the **Program** folder in Windows.


    proc/


    Dynamically generated system information. Look, but don''t touch.


    root/


    The root user''s little cave. Unless this happens to be the current **HOME**,
    don''t mess with it (it''ll probably be read/write protected anyway).


    sbin/


    System administration binaries. I don''t see why a game would ever need to touch
    this directory, except perhaps to collect information about the system.


    tmp/


    A scratch directory. You can put anything here, but it''s polite to clean up after
    yourself. Don''t count on anything remaining in **tmp/** for too long. Some systems
    purge **tmp/** weekly.


    usr/


    Billed by the FHS as the “secondary hierarchy,” **usr/** contains a second directory
    structure very similar to the root directory but with a different purpose. We''ll
    look at some of **usr/** subdirectories.


    var/


    Variable data, according to the FHS. **var/** is home to logs, email, state information,
    and temporary files that are too important for **tmp/**. (Files in **var/tmp/**
    are guaranteed to be preserved between system reboots.)'
  merge: -1
