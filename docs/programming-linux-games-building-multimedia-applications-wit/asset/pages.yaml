    # How Video Scanning Works


    A video mode can be described by several key properties. Users and even programmers
    usually just speak of video modes in terms of resolution and color depth, with
    an occasional mention of refresh rate.


    A more precise way of describing a video mode is to list the various time intervals
    involved in the video scanning process. This information has to be provided at
    some point, regardless of how it is presented to the user or programmer; CRTC
    unit needs it in order to scan an image on the display. Although these numbers
    may seem mysterious at first, they''re pretty simple to work with you understand
    what they mean.


    Figure 8–1 illustrates the different components involved in a single video refresh.
    The monitor''s electron beam (seeing the beginning of Chapter 4) starts in the
    upper left corner, sweeping from left to right repeatedly as it moves from the
    top to the screen. Each horizontal sweep is called a *scanline*. The process begins
    with a few wasted sweeps. This period is called the *upper margin*, and it serves
    to get the electron beam in position for the actual image-drawing process. The
    upper margin is measured in scanlines.


    Now that the beam is positioned at the upper left corner of the visible portion
    of the monitor, it proceeds to generate a complete image by performing a number
    of sweeps equal to the vertical resolution of the display mode (480 scanlines,
    in the case of Figure 8–1). Each sweep begins with a blanking period (dead zone)
    called the *left margin* and ends with another blanking period called the *right
    margin*. These two margins are measured in pixels, and actual drawing takes place
    between them. Immediately after the right margin, a brief *horizontal sync pulse*
    from the video card instructs'
