  md: '186


    CHAPTER 5


    The program begins as usual, loading a sound file and setting a few OSS parameters
    via ioctl. It queries the OSS device''s capabilities and checks for DMA compatibility.
    If the sound card is capable of this type of DMA access, the SNDCTL_DSP_MMAP and
    SNDCTL_DSP_TRIGGER bits will be set (Initialization can still fail, however).
    The program queries OSS for the size and number of buffer ranges, multiplying
    them to obtain the total size of the sound buffer in bytes. It next uses mmap
    to map a buffer onto the sound device.


    mmap is a strange beast. It can be used for a variety of purposes, but its most
    common use is to mmap buffers of memory onto files (so that accesses to the memory
    will result in accesses to the file). This provides a convenient way to load large
    data structures from disk; you can simply map the file into memory and grab the
    data with memcopy. OSS uses it as a convenient way to map the sound card''s DMA
    buffer into a program''s address space. We will leave a full discussion of mmap
    to other sources, but in this case it is fairly straightforward.


    With a DMA buffer in place and the card properly configured, the program “triggers”
    the sound card''s DMA by toggling the PCM output enable bit. The trigger feature
    is designed to allow applications to gain precise control over playback timing,
    but it doubles as a way to set off DMA transfers. Once the DMA controller has
    been started, it cannot be stopped without shutting down OSS. This is a flaw,
    in my opinion, but it is only a minor issue. (To effectively stop playback, fill
    the buffer with zeros.) After this has been cleared and reset, the DMA controller
    (either part of the sound card or a component of the motherboard''s chipset) will
    repeatedly loop over the DMA buffer and send whatever it finds to the sound card.
    To play sound, we simply have to copy our samples into the DMA buffer.


    This is the tricky part. The DMA controller is a separate piece of hardware, and
    we have little control over its operation once it has started. It sweeps the DMA
    buffer at a predictable rate, returning to the start of the buffer when it reaches
    the end. We need to make sure that we always keep a fresh set of sample data in
    front of the DMA controller''s path. We have chosen a simple method that seems
    to work fairly well. The DMA buffer contains several (probably four or five) fragments
    of data, each 1024 bytes. We disregard this organization and treat the buffer
    as one chunk. While the DMA controller is busy scanning the first half of the
    buffer, we (quickly) fill the second half with new samples. When'
