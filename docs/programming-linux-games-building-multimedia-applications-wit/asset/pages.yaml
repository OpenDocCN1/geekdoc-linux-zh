    # Implementing a Parallax Scroller in SDL


    Since this game takes place in outer space, one would expect to see stars in the
    background. These stars should move, or scroll, as the player flies around. Although
    this scrolling effect bears only a faint resemblance to what you would actually
    see in space, it''s common in space games, and this game is not intended to be
    a realistic simulator.'
