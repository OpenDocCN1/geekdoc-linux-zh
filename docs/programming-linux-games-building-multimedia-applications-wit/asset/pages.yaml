  md: "# Using the Make Utility\n\nMost game development projects consist of multiple\
    \ source files\n\nThe Make speeds up software development by automatically determining\
    \ which files actually need to be recompiled after changes have been made. Make\
    \ also eliminates the need to type long commands to rebuild programs, since it\
    \ stores all of the required commands and invokes them as needed.\n\nAlthough\
    \ Make has a lot of functionality, basic usage is quite simple. It is based on\
    \ targets, which are sets of directions for maintaining the components (object\
    \ files, libraries, and so on) of a target. Targets specify the name of the component\
    \ to track, the source files and other targets that the component depends on,\
    \ and the commands for rebuilding the target. The instructions for building a\
    \ component are called *rules*, and the list of files that a component depends\
    \ on are called *dependencies*. When Make is invoked upon a certain target, it\
    \ checks that target's dependency list first. If any of the dependencies have\
    \ been changed since the target was rebuilt, the target's rules are executed.\
    \ Make also recursively rebuilds any out-of-date targets in the dependency list.\
    \ This is extremely convenient for large, modular programming projects.\n\n# Creating\
    \ Makefile\n\nMake looks for targets and rules in a file called **Makefile** or\
    \ **makefile**. This file can contain any number of targets. If Make is started\
    \ with no command-line options, it automatically attempts to rebuild the first\
    \ target it encounters. Consider the following make:\n\n```\nprogram: file1.c\
    \ file2.c graphics.a\n  gcc -c file1.c file2.c\n  gcc file1.o file2.o graphics.a\
    \ -SDL -o program\n```"
