  md: '# LINUX DEVELOPMENT TOOLS


    # Warning


    When you specify files to diff on the command line, be sure to put the original
    file *first* and the new file *second*. Programmers often generate deltas in the
    wrong order. This is a bad thing!


    To patch a file with a delta, supply the patch utility with the name of the file
    on the command line and the delta information on standard input. The following
    example uses the delta we just generated to patch `foo` into `bar`:


    ```

    $ cat foo.patch | patch foo

    ```


    Or, equivalently,


    ```

    $ patch foo < foo.patch

    ```


    The patch utility generally prints status information to indicate its success
    or failure. Patch usually succeeds, but it can fail if the file to be patched
    has been otherwise modified since the delta was generated. The patch utility tries
    to recover from this situation, but sometimes it is necessary to perform the patch
    yourself. It''s not too hard, but it''s a situation you''ll want to avoid if possible.


    patch can also handle entire directories. Suppose you''ve made modifications to
    a source tree in the `new/` directory, and there is a copy of the original source
    tree in the `old/` directory. You can generate a complete diff of the two directories
    with the following command:


    ```

    $ diff -ubr old/ new/ > foo.patch

    ```


    This command causes to recursively scan through each directory, comparing files
    with the same name and outputting a complete chunk of patch data for the entire
    set. The -b option instructs to ignore changes in whitespace (such as indentation).
    You would obviously leave this option out if your code involves a language in
    which indentation is significant (such as Python). To apply the patch generated
    with this command, change to the directory containing the source tree you want
    to patch, and feed the file to the patch utility:'
  merge: -1
