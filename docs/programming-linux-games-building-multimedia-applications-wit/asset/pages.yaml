  md: "# The Great Alpha Flip\n\nSDL used to interpret alpha values as transparency,\
    \ not opacity (in other words, alpha values now mean exactly the opposite of what\
    \ they used to - they now work like the alpha values in nearly every other graphics\
    \ system). The old style was fine within SDL circles, but it made porting applications\
    \ that depended on proper alpha support a serious hassle. This idiosyncras has\
    \ been fixed, and it was announced on the SDL development mailing list as the\
    \ Great Alpha Flip.\n\nThis reversal really shouldn't matter, unless you intend\
