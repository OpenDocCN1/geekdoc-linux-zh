  md: '# LINUX DEVELOPMENT TOOLS


    # Working with Libraries


    Libraries provide a way to package code into reusable binary modules. Linux software
    can use two types of libraries: static and shared. A static library is simply
    a collection of object files that have been archived into one file with a symbol
    table. Static libraries have a file extension of .a and they can be linked into
    programs as normal object files. A shared library is similar to a static library,
    except that it permanently resides in a separate file and is never directly linked
    into an application. Shared libraries are linked at runtime by the operating system''s
    dynamic linker.


    # Static Libraries


    Static libraries are extremely simple to create and use. Once you have created
    the object files you wish to package as a library, combine them with the utility:


    ```

    $ arcs .a file1.o file2.o file3.o

    ```


    ar is a simple archiving utility. The r option specifies an operating mode: it
    tells ar to add the files to the archive, replacing any existing files with the
    same names. The c option specifies that the archive should be created if it does
    not already exist. Finally, s informs ar that this is an archive of object files
    (that is, a static library) and that a symbol table should be added. Optionally,
    you can leave out the s flag and use the ranlib utility to add the symbol table;
    the resulting file will be equivalent.


    To use a static library, pass it to gcc just as you would pass a normal object
    file. gcc will recognize the .a file extension as an archive of object files.


    # Shared Libraries


    Shared libraries are a bit more complex to manage than static libraries, but they
    are often worth the extra effort. Shared libraries are not stored in executables
    that use them; they are independent files that are linked into executables at
    runtime. In many cases shared libraries can be updated without recompiling the
    programs that depend on them. It is possible for the operating system to load
    a shared library into memory once, for use by multiple applications.'
  merge: -1
