    CHAPTER 9


    What could I have done differently? Here are a few things that come to mind.


    +   - I could have used C++ instead of C. C++ lends itself to game programming,
    since games usually simulate interactions between physical objects to some extent.
    In fact, an object-oriented programming language would be beneficial in that regard.
    There are plenty of arguments for and against C++, and it''s the topic of many
    mailing list holy wars.


    +   - Penguin Warrior would benefit from a more sophisticated networking system.
    The current TCP-based system, in which the clients take turns exchanging packets,
    is simple, but its performance is highly dependent upon the quality of the underlying
    network. A UDP-based protocol would be more complex to implement, but it could
    potentially offer better performance.


    +   - In hindsight, Tcl was not an especially good choice for the scripting engine.
    It works in this case, but it''s not a very good solution for number crunching
    and managing large amounts of data. If I were to write Chapter 6, I would probably
    choose a Lisp variant such as Scheme.


    +   - Resource management is always a challenge. The present implementation of
    Penguin Warrior uses an ad hoc resource-loading routine, but this task could be
    performed in a more general and flexible way. Each resource (a sound clip or a
    graphic) could have a symbolic name, and the resource manager could load them
    on demand.


    +   - The source tree would be much easier to build if it had a GNU Autoconf script.
    As it stands, you usually need to tweak the makefile to build the game. While
    this is fine for developers, it might be confusing for end users.


    There are also gameplay features that would make nice additions to Penguin Warrior
    (and perhaps good weekend projects for interested readers):


    +   - More weapons. Many games allow the player to pick up “power-ups” from the
    playing field. Perhaps Penguin Warrior could have floating Power Penguins for
    the players to find.


    +   - A radar screen for tracking the opponent. Alpha blending could add a nice
    effect to such a display.'
