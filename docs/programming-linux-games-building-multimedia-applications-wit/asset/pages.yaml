  md: '# The SDL MPEG Library, SMPEG


    The SDL MPEG library is a free MPEG-1 video and audio library with a heavy SDL
    slant. If you want to add MPEG-1 video or MP3 audio playback to your SDL-based
    game or application, SMPEG is an excellent choice. It may or not be a viable solution
    for non-SDL programs, though (since SMPEG outputs directly to SDL surfaces).


    MPEG-1 is popular compressed video format based on the discrete cosine transform
    and motion prediction. It is lossy (that is, it discards video data that it judges
    to be of less importance), but it generally produces good results, and it is commonly
    used for game cinematics. MPEG-2 is a newer video codec that produces higher-quality
    results at the expense of a lower compression ratio, but it is encumbered by patents
    and is therefore not supported by SMPEG.


    The SMPEG library is available in the Development section of http://www.lokigames.com.
    Loki Software commercially maintains it for use in its games, but SMPEG is free
    software.


    # zlib


    zlib (pronounced zee-lib or zeta-lib) is a general-purpose data compression library
    that implements the gzip format. It features an interface very similar to the
    stdio codefine and codwrite functions, and it is often used as a drop-in replacement
    for such. zlib is a good option when you need decent compression and don''t want
    to code it.


    This library is widely used, and there''s a very good chance that it''s already
    present on your Linux installation. You can download zlib''s source code from
    http://www.gzip.org.


