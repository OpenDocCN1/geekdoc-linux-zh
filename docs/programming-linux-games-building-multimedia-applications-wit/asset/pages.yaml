    # Turn-Based Strategy Games


    Turn-Based Strategy (TBS) games are like real-time strategy games, but the gameplay
    is divided into turns, with no time limit, giving the player time to think and
    relax, and lending the game an entirely different feel from the faster-paced strategy
    games. TBS games are not decided by reflexes, but rather by careful planning,
    which often makes them more difficult, and more attractive to many players. Sid
    Meier''s Civilization II is widely regarded as the best turn-based strategy game,
    because of its balance and replay value.


    # Deceptively Complex


    I once thought that TBS games were easy to write, but then I saw the source code
    to Sid Meier''s Alpha Centauri (SMAC). Most players don''t realize it, but SMAC
    actually uses a 3D technique voxels to render its units on the fly and to draw
    a height-sensitive landscape with perspective texture mapping and dynamic palette
    mapping (made by self-modifying assembly code). Sid Meier''s Alpha Centauri was
    obviously not easy to port to Linux. While it''s possible to write a good TBS
    game without such sophistication, don''t think of the TBS genre as an easy way
    out—its complexity can be deceiving.


