    The code’s comments give the play-by-play, but a few points should be clarified.
    This program employs a very general routine for constructing hicolor pixel values;
    this routine will work with any hicolor format that SDL recognizes. Although we
    could write a separate (faster) routine for each possible hicolor data layout,
    doing so would require a lot of work and only marginally improve performance.
    The 565 (5 red bits, 6 green bits, and 5 blue bits) pixel format is the most widely
    used format and can be reasonably optimized, but 556 and 555 are not uncommon.
    In addition, there is no guarantee that the bit fields will be in the red-green-blue
    order. The CreateHolorPixel routine solves this problem by referencing the data
    in the SDL_PixelFormat structure. For instance, the routine uses the Rloss member
    of the structure to determine how many bits to drop from the 8-bit red component,
    and it uses the Rshift member to determine where the red bits should be located
    within the 16-bit pixel value. For an interesting experiment, the program print
    out which video card has given to SDL. My video card (a Matrox G400 usingFree86
    3.3.6) happens to use the 565 format.'
