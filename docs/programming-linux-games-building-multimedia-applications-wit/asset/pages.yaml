    Function connect(sock, addr, addr_len)


    Synopsis Attempts to establish a network connection with the server at the given
    address.


    Returns 0 on success, -1 on failure. As with most old UNIX functions, connect
    sets the global errno variable to the relevant error code on failure.


    Parameters sock—Socket to connect. Different protocols use different versions
    of the address structure.


    sockaddr_in is the correct version for Internet sockets.

    addr_len—Size of the address structure, in size(addr) should do the trick.


    sockaddr specifies the intended destination of a connection attempt. This is an
    Internet-specific version of the more general sockaddr structure. To use it, set
    your sin_family field to AF_INET (Internet address family), set sin_addr to the
    desired IP address, and set sin_port to the port number you wish to connect. There''s
    a catch, we''ve already touched endianness—byte ordering on different CPU architectures—and
    it becomes a real problem in networking. Should the four-byte IP address 128.61.41.1
    go across the network as bytes 128, 61, 41, 1, or as 1, 41, 61, 128? It sounds
    like a silly problem, but the “obvious” way for a human to store information is
    irrelevant to a CPU, and it''s not safe to make assumptions about how any processor
    architecture will do it. The same problem affects port numbers, since they are
    two-byte integers.


    TCP/IP has a well-defined network byte order... It doesn''t really matter what
    this order is.³ Every system that supports BSD sockets has a set of macros for
    converting values to and from this byte order. On systems that use a compatible
    byte ordering natively, these macros do nothing, but they still exist for portability.


    > ³ Big endian. For comparison, Intel x86 processors use little endian ordering,
    meaning that this will bite you if you develop on x86 and you aren''t careful.'
