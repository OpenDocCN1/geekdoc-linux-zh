    whatever mode the framebuffer device is currently in. (In fact, most programs
    just leave the mode alone and try to accommodate whatever they end up with.)


    +   - Not all framebuffer devices support mode switching. Want a 1024x768 mode,
    as opposed to the 640x480 mode the user currently has selected? Too bad! Some
    devices do allow this, but you can''t count on it.


    There are good reasons to use the framebuffer device, though:


    +   - Many users have an aversion to the X Window System and prefer to use the
    console whenever they can. Chances they''re using a framebuffer console, since
    its output is superior to most “true” text modes (with higher resolution).


    +   - SVGAL, the traditional Linux console-based graphics solution, is hardly
    up-to-date with today''s hardware. It''s great when it works, but past holds that
    to be a rare occurrence.


    +   - If you don''t require the ability to change video modes or perform hardware-accelerated
    blits, it''s absurdly simple to program.


    +   - With a bit of care and feeding (read: a lot of footwork), you can sometimes
    drive fbdev much faster than X11. If fbdev happens to support acceleration features
    for your video card, it can truly scream. See the current Linux kernel for a list
    of supported cards.


    +   - SDL uses fbdev as a video target. Most SDL applications will work on the
    framebuffer console out of the box. SDL squeezes as much performance as possible
    out of the framebuffer device, going so far as to issue register-level commands
    directly to Matrox G400 and 3Dfx Voodoo cards.


    +   - The framebuffer device is the de facto graphics interface on many Linux-embedded
    devices and handhelds. You can use fbdev to access the screen on the VTech Helio,
    Compaq IPAq, Casiopeia, and Sega Dreamcast, instance.


    In short, if you''re willing to put forth the extra coding effort, deal with a
    lack of portability to non-Linux platforms, and forgo the ability to set an exact
    video'
