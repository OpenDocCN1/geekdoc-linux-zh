    # A Simple Particle System


    A particle system is a set of tiny objects, usually drawn with single pixels or
    small alpha-blended images, that move under the control of a simulated system
    of physics. Particle systems can be used for simulated smoke trails, flying sparks,
    dust effects, and just about anything else that involves small bits of matter.
    With a little help from a graphics accelerator, particle systems can be used to
    create breathtaking effects. They can be implemented in many ways, and the particle
    system implementation in Penguin Warrior is only one possible approach.


    Penguin Warrior uses a particle system to simulate explosions. Whenever an object
    explodes, Penguin Warrior releases thousands of individual visible specks (*particles*)
    onto the playing field. Each particle is assigned a random direction and velocity,
    originating from the center of the explosion. Each particle is also given a color
    according to its velocity (roughly approximating the heat of the particle). This
    is actually a pretty bad simulation of an explosion, but it looks impressive,
    and that''s all that matters (the particles have no bearing on the actual gameplay).


    We''ve drawn the particles in Penguin Warrior as single pixels, but it might be
    an interesting experiment to use alpha blits of small images instead. (This would
    be slower, and you''d probably want to reduce the number of particles in the system'
