    ''ll talk about this book) would be obsolete by the time the book hit the

    press.


    Instead, we''ve put together a Web site with all the book''s examples and links
    to\various libraries you''ll need. You can access this site from either

    http://www.nostarch.com or http://www.lokigames.com. Feel free to share

    the example code with your friends and colleagues, and use it in your projects;

    license details are included in the code archive.


