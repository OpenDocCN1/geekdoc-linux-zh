    which will result in distorted sound.


    # Feeding a Sound Card


    A sound card is conceptually simple: it accepts a continuous stream of PCM

    samples and recreates the original sound wave through a set of speakers or

    headphones. Your basic task, is to keep the sound card supplied with PCM

    samples. This is a bit of a trick. If you want 44.1 kilohertz (kHz) sound (the

    quality of sound stored on audio CDs), you supply the sound card with

    44,100 samples per second, per channel. With 16-bit samples and two channels

    (stereo), this comes out to 176,400 bytes of sound data (see Table 4!). In addition,

    t is critical. Any lapse in data will result in a noticeable glitch.


    It would be both difficult and woefully inept to make a game stop 44.100

    times each second to fetch more data to the sound card. Fortunately, the

    computer gives us a bit of help. Most modern computer architectures include

    a feature called direct memory access, or DMA. DMA provides support for

    high-speed background memory transfers. These transfers are used for a variety

    ofurposes, but their most common use is to shovel large amounts of data to'
