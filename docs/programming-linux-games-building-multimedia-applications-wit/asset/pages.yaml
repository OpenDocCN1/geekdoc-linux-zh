- img_proc: true
  md: "This ioctl should be called as soon after opening the audio device; it will\
    \ not work after the first write call has been made, and it might not work after\
    \ other settings have been applied. This unsigned integer argument is divided\
    \ into two fields. The lower 16 bits specify the fragment size as a power of 2.\
    \ For instance, a value of 10 in the lower 16 bits requests a fragment size of\
    \ 2^10, or 1,024 bytes. The higher 16 bits of the argument specify the number\
    \ of fragments to allocate. In this case request only three fragments, meaning\
    \ that we will have to be fairly attentive to the audio device if we want to avoid\
    \ glitches.\n\nOur next task is to get rid of the blocking write call. We can\
    \ use OSS's buffer information ioctl to avoid:\n\n```\nfor (;) {\n    audio_buf_info\
    \ info;\n\n    /* Ask OSS if there is any free space in the buffer. */\n    if\
    \ (ioctl(dsp, SNDCTL_DSP_GETSPACE,&info) != 0) {\n        perror(\"Unable to query\
    \ buffer space\");\n        close(dsp);\n        return 1;\n    }\n\n    /* Any\
    \ empty fragments? */\n    if (info.fragments > 0) break;\n\n    /* Not enough\
    \ free space in the buffer. Waste time. */\n    usleep(100);\n}\n```\n\nThis addition\
    \ to the main player loop (right before the actual write call) simply queries\
    \ OSS to check for an empty fragment. If at least one fragment is available, we\
    \ can safely write a chunk of sample data without blocking. If there is no space\
