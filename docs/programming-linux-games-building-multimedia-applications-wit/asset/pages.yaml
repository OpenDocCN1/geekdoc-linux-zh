    # # Implementing Game Music with Ogg Vorbis


    Unless you''ve been living under a rock for the past few years, you''ve probably
    heard of MP3. Since high-quality PCM audio data can take up an enormous amount
    of space (over a megabyte every 10 seconds, in some cases), raw PCM samples are
    not an ideal way to store music and other audio clips. A typical music album is
    likely to occupy several hundred megabytes. This is not a problem when music is
    distributed on physical media—ordinary compact discs can hold around 650 megabytes—but
    it is impractical to download music over the Internet. The MP3 compression system
    offers a solution to this problem by compressing audio data (sometimes as much
    as 90%) while preserving most of the audio''s quality. MP3 is an open standard
    (meaning that anyone can learn how it works), but it is encumbered by patents
    (meaning that anyone who writes MP3 encoding software without purchasing a license
    is to be sued). Needless to say, this has been the cause of great consternation
    among some segments of the (generally antipatient) online community. Although
    the free SPEPEG library can handle MP3 audio (and has been used for purpose in
    at least one commercial title), there is a better option.


    The Xiphophorous Company, an oddly named team of smart hackers previously known
    for the popular CD Paranoia program, has created an alternative to MP3 called
    Ogg Vorbis. The Vorbis codec coder/decoder) offers audio compression very similar
    to MP3 (slightly better in some cases), free of patents and available to everyone.
    The streaming media infrastructure, provides support for multiple Vorbis streams
    within a single bitstream or provides robustness against many types of corruption.
    The Ogg Vorbis team has created a libvorbisfile library to allow programmers to
    add Ogg Vorbis support to applications, and they have created a set of utilities
    for working with Ogg Vorbis (.ogg) files from the command line. The Vorbis code
    is still in development, and future releases will be


    > 8 MP3 compression does trash audio frequency ranges, and it is certainly possible
    to hear a difference in a side-by-side comparison of CD and MP3 music. However,
    this is usually not a severe problem. MP3 compression is not all-or-nothing; music
    can be compressed only slightly (with little loss in quality) or can be heavily
    compressed (reducing the audio to telephone quality or worse).'
