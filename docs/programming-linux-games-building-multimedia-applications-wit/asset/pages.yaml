  md: '```

    $ patch -p1 < foo.patch

    ```


    The -p1 option tells patch that it is already in the directory to be patched (which,
    in all likelihood, has a different name than the directory from which the patch
    file was generated) and that it should ignore the first part of each filename
    it encounters.


