  md: '+   FreeBSD has no /etc/mtab file (normally contains a list of currently mounted
    filesystems). This discrepancy broke Loki Software’s CD-ROM detection code when
    we tried to port it from Linux to FreeBSD. I fixed it with a quick hack based
    on the output of the mount program, but another programmer later found out that
    FreeBSD has a convenient system call for retrieving the same information.


    +   FreeBSD has a completely different kernel than Linux. Slight internal differences
    might cause quirky behavior when you run your newly ported program. For instance,
    networking, memory mapping (mmap), and thread scheduling might behave differently,
    since these functions are closely tied to the kernel. These usually aren''t show-stopping
    issues, but it''s a good idea to test your application thoroughly if you intend
    to officially support FreeBSD.


    +   Unfortunately, FreeBSD currently has no framebuffer device interface. Of this
    course won''t matter if your application uses an abstraction layer such as SDL,
    but programs that require the Linux framebuffer interface are out of luck. However,
    FreeBSD supports the Direct Rendering Infrastructure, a lightning-fast 3D driver
    system originally created for Linux.


    Other UNIX-like operating systems (particularly NetBSD and OpenBSD) are available,
    and it is nice to support these all. You''ll have to decide how much development
    time and energy you want to spend on porting your work. If you are developing
    software, other people will probably help you with this job. Everyone likes to
    see new software for his or her favorite operating system, and porto a substantial
    chunk of code to a new platform can be very satisfying.


    # Packaging Systems


    A simple tarball of source code is probably the easiest way to distribute a Linux
    application or game, and this is perfectly acceptable in some cases (especially
    if the project takes advantage of Autoconf). However, tarballs have several disadvantages:'
