    CHAPTER 10


    contains **include/** and **lib/**; subdirectories that are more or less equivalent
    to **usr/include/**/ and **usr/lib/**, respectively. The FHS specifies that **usr/local/**/
    should be left empty by the distribution''s installer and should not be touched
    during system upgrades.


    **usr/sbin/**/ Additional system administration binaries. Although this directory
    contains the same sort of programs as **sbin/** (that is, programs primarily intended
    for use by root), it shouldn''t contain anything that''s absolutely critical to
    system. For instance, network traffic monitors and improved versions of basic
    networking utilities might go in **usr/sbin/**, while the basic system administration
    programs common to all Linux systems go in **sbin/**.


    **usr/share/**/ Architecture-independent data, according to the FHS. This directory
    usually contains assorted program datafiles. For instance, Emacs'' scripts reside
    in **usr/share/emacs/**. It''s not unreasonable to put your own datafiles here
    (in a separate subdirectory).


    Where should game install itself? If you''re installing with a package manager
    that has the ability to manage and verify the files it installs, it''s acceptable
    to use **usr/** directly (including **usr/bin/**, **usr/games/**, **usr/lib/**,
    and **usr/share/**). If your game were FootBall, for instance it must install
    its executable to **usr/games/football** and its data to **usr/share/football/**.
    However, if your game uses its own installation system rather than a package manager,
    it''s best to use **usr/local/games/football** and **usr/local/share/football/**.
    It would also be OK to install to **opt/football/**. The basic rule is that you
    shouldn''t touch **usr/** without involvement from a package manager; instead,
    you should use **usr/local/** and **opt/**.


    These places are fine for executables and datafiles, but what about configuration
    information? Most users don''t have permission to annotate anything in **usr/**
    (and certainly not to **etc/**), and it''s a very bad idea to require your program
    to be run under the root account (mainly for security reasons). Per-user configuration
    files (high scores, window/video mode info, saved games, and so on) can go in
    each user''s home directory, which you can grab from the HOME environment'
  merge: -1
