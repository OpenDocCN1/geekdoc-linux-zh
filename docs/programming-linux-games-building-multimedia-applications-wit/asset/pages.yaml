    # Socket Programming 101


    The BSD sockets API is one of the most popular TCP/IP networking interfaces today.
    There are others, but BSD sockets have become the facto standard for Linux and
    UNIX systems. The BSD sockets API isn''t pretty, but it works enough to have caught
    on. (You could also say this about UNIX as a whole.)


    The following is a rather condensed tour. Network programming is a big subject,
    and it''s not really the focus of this book.


    # Sockets


    A socket is a file descriptor (similar to one returned by the ordinary open function)
    that represents a networking context. Usually a socket acts as an endpoint for
    a TCP connection, but they''re also useful for UDP transactions. Once a socket
    is ready to go, you can use the familiar read and write functions to transfer
    data over the network, just as you''d access a normal file. To use an analogy
    that has been beaten to death over the years, a socket is like a handset connected
    to a telephone network. Once it''s connected to another endpoint (by initiating
    or receiving a call), you can use the handset to talk or listen to whoever or
    whatever is at the other end.


    You can create a new, unconnected socket with the socket function. This function
    takes three parameters that control the socket''s properties. The first specifies
    the socket''s communication domain; there are several possibilities, but PF_INET
    is probably what we want. This asks for a socket configured for IP version 4,
    suitable for the Internet. The next parameter can either


    > The socket interface isn''t limited to any particular protocol, but it''s most
    often used with TCP/IP.'
