  md: '# Source or Binary?


    The first decision you''ll have to make is whether you want to release the source
    code to your game. Generally speaking, it''s a nice thing to do, and it''s more
    or less a requirement if you''re using libraries covered under the GNU General
    Public License.¹ Releasing the source code to your project means that bugs probably
    turn up much quicker (since everyone will be able to pitch in and help you track
    them down), and other programmers will have the opportunity to learn from yours.
    Linux exists because of its open source development model, and many Linux advocates
    feel strongly about open versus closed source. For various viewpoints on free
    software, open source software, and the rationale of each, refer to the Free Software
    Foundation² and the Open Source Initiative³


    Sometimes it''s either impossible or impractical to release the code to a project.
    For instance, nondisclosure agreements, publishing contracts, and game engine
    licenses prevent you from making a project''s code available to the public. In
    this case you''ll have to settle for a binary distribution of your game. Unfortunately,
    in doing so, you''ll probably alienate a certain number of hard-core open source
    and free software advocates.


    Binary-only distribution is possible, but you''ll have to give a bit of thought
    to preparing the files. Binary distribution under Linux is a bit different than
    binary distribution under Windows (where source distribution is almost unheard
    of). With source distribution, you can adjust the code to work well on a particular
    machine (and can modify the code to his or her liking), but binary releases are
    generally one-size-fits-all. Since Linux distributions ship with different versions
    of basic supporting software (in particular the C library), a binary might not
    get along with some systems.⁴


