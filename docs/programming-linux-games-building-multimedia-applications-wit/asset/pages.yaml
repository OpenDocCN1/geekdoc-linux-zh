  md: 'For the purposes of Penguin Warrior, this bounding circle will have a diameter
    equal to the width of the ship graphic.


    How do we find the distance between the center of an object and a line? Look at
    Figure 9-1. We''ll treat the phaser beam as a vector $v_1$, and we''ll call the
    vector that points from the source to the target $v_2$. We want to find the length
    of the shortest line segment from a point on $v_1$ to the target (the end of $v_2$).
    The shortest segment (which we'' call the distance from the phaser beam to the
    target) forms a 90-degree angle with $v_1$.


    We can find the position of this segment along $v_1$ with a *projection*. We''ll
    leave the math behind this to other sources, but we can find this point with the
    following:


    ```

    $v_{1x} = x_2 - x_1$

    $v_{1y} = y_2 - y_1$

    $v_{2x} = a - x_1$

    $v_{2y} = b - y_1$

    $p_x = \frac{(v_{1x}v_{2x} + v_{1y}v_{2y})v_{1x}}{(v_{1x}v_{1x})^2 + (v_{1y}v_{1y})^2}}$

    $p_y = \frac{(v_{1x}v_{2x} + v_{1y}v_{2y})v_{1y}}{(v_{1x}v_{1x})^2 + (v_{1y}v_{1y})^2}}$

    ```


    This is essentially the normalized vector $v_1$ scaled by the dot product of $v_1$
    and $v_2$. It works because the dot product of two vectors is proportional to
    the cosine of the angle between the vectors. Once we know the coordinate $(p_x,
    p_y)$, we can easily calculate the distance $d$ between the phaser beam and the
    target:


    ```

    $d = \sqrt{(p_x - a)^2 + (p_y - b)^2}$

    ```


    The routine `CheckPhaserHit` in the source file **weapon.c** implements this formula.
    With the math just shown, the code is straightforward.'
