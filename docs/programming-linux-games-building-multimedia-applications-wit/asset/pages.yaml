  md: 'With this brief comparison in mind, which sound interface should your games
    use? ALSA is a bit more programmer-friendly, if you can tolerate its evolving
    API. It has a well-designed (albeit changing) interface with lots of bells and
    whistles. OSS currently has a wider base of users but a rather crude programming
    interface. If providing support for both APIs is out of the question, I recommend
    coding for OSS and then testing with the ALSA emulation facility. An alternate
    approach would be to use a higher-level library such as SDL or OpenAL that can
    work with either interface.


    #  Introducing Multi-Play


    Multi-Play is a simple command-line sound file player. It works with normal OSS,
    OSS using direct DMA buffer access, ESD, and ALSA and supports large number of
    sound file formats. Since it is designed to clearly demonstrate audio programming,
    Multi-Play lacks a few of the features one might find in an end-user player program,
    such as support for nonstandard frequencies and sample sizes. Feel free to use
    pieces of the code in your own projects or even to develop the complete player
    into a finished product. It''s meant to be a Rosetta stone of sorts, performing
    the same basic task (sound playback) in several different ways.


    Since Multi-Play is meant to demonstrate the mechanics of audio programming (and
    is not really intended for day-to-day use), it doesn''t compensate for certain
    types of "errors". For instance, ESD does not properly handle 8-bit samples in
    some cases, but Multi-Play will attempt to use them anyway (whereas an end-user
    player might automatically change 8-bit samples into 16-bit samples for ESD playback).
    It also blindly tries to set the driver to the sample rate indicated by the sound
    file. This will not work in some cases, since drivers often don''t support odd
    sample rates. A high-quality sound player should try to compensate for this problem.
    However, doing so shouldn''t be necessary for most game development situations.


    The complete code for Multi-Play is available on the Web site; it is excerpted
    as appropriate here. It is a good idea to obtain and compile a copy of the code.
    Experimentation is the best way to learn any new area of programming.'
