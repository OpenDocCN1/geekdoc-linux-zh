    Since source modules can grow quite large, CVS provides a compression option for
    bandwidth-deprived users. The `-zn` option asks CVS to use compression for its
    downloads, where *n* is a number from 0 to 9. CVS actually uses GNU''s gzip program
    for its compression, and *n* specifies the gzip compression level to use. Compression
    is a very good idea for performing CVS updates over slow connections.


