  md: '# Structure


    # SDL_PixelFormat


    # Synopsis


    Contains information about a surface''s pixel composition.


    # Members


    palette—Pointer to this surface''s palette (of type SDL_Palette, if this is a
    palleted image.


    BitsPerPixel—Color depth of this surface. Possible values are 8, 15, 16, 24, or
    32.


    BytesPerPixel—Number of bytes needed for each pixel. This is usually BitsPerPixel
    / 8, rounded up to the nearest integer.


    Rloss—Number of bits to remove from an 8-bit color value in order to fit in the
    allotted space. For instance, a 565 mode allows for 5 bits of red color data,
    so the Rloss would be 3. SDL_PixelFormat also contains Gloss, Bliss, and Alass
    members for the green, blue, and alpha channels.


    Rshift—Number of bits to shift the red value in order to position it in the correct
    bit field. There are similar Gshift, Bshift, and Ashift members.


    Rmask—Bitmask for extracting the red component from a pixel value. There are similar
    Gmask, Bmask, and Amask members.


    colorkey—Value for colorkey blending. Set this with SDL_SetColorKey. More on colorkey
    blending later.


    alpha—Transparency value for the surface associated with this SDL_PixelFormat
    structure. Set this with SDL_SetAlpha. More on alpha blending later.


    Another important issue involves the SDL_UpdateRect function. As we mentioned
    earlier, SDL emulates video modes if the video card is unable to provide a certain
    mode itself. If the video card does not support a requested 24-bit mode, for instance,
    SDL might select a 16-bit mode instead and return a fake framebuffer set up for
    24-bit pixels. This would allow your program'
