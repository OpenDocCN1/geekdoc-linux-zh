    # # Network Game Performance


    Anyone who''s ever played a multiplayer action game has probably felt the frustration
    of lining up for a kill and having the game suddenly slow to an unplayable crawl.
    The Internet is enormous, and its performance range is anywhere from solid to
    flaky. Multiplayer games unfortunately require a very high level of sustained
    performance, and it''s left to the game developer to make ends met in this turbulent
    medium. In this section we''ll make some observations about network performance
    and suggest ways to squeeze acceptable performance out of the Internet.


    Gamers often fumble about slow network performance. Two primary factors play into
    this problem. Packet loss is the tendency of overloaded or unreliable networks
    to lose information at random. Weve already mentioned this with respect to UDP—if
    you send a UDP packet across the network, it might get there, and it might not.
    TCP detects and corrects missing packets, but they throw a wrench into the communication
    process and kill performance. There''s not a lot you can do to prevent loss, unless
    you intend to install your own high-speed communication lines; you can only minimize
    its effects on your games. The most common way of dealing with packet loss is
    simply to ignore it. TCP holds up the transmission pipeline until packets arrive
    at the other end, at which point it''s probably past time to send the next update
    anyway. (In this case, error correction actually hurts game performance.) UDP
    does not have this problem.


    Another culprit of lousy network performance is latency, the time it takes a given
    piece of information to travel across the network. Latency depends both on the
    speed of the underlying network and on its current traffic load. Unless your'
