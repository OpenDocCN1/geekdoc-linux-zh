  md: '# # Chapter 5


    # # Linux Audio Programming


    Hardware manufacturers are often reluctant to release programming specifications
    to independent developers. This has impeded Linux''s development at times and
    has resulted in less than optimal drivers for certain devices. However, the recent
    explosion in Linux''s popularity has drawn attention to the project, and hardware
    support has improved considerably of late. Most consumer audio hardware is now
    fully supported under Linux, and some manufacturers have even contributed their
    own open source drivers for their hardware. This chapter discusses the ups and
    downs of Linux sound programming with several important APIs.


    If you haven''t yet read Chapter 4, it would be a good idea to flip back to its
    basic explanation of sound samples, buffers, and frequencies (beginning on page
    125). This chapter will assume that you are familiar with these basics, and we
    won''t spend any more time on the subject.


    This chapter describes the development of a complete Linux sound player, dubbed
    Multi-Play. In the course of developing this real-world application, we will look
    at how to load sound data from disk and discuss four common methods of playing
    sound under Linux. By the end of the chapter, you will know how to integrate sound
    into a Linux game using any of the major APIs. The chapter ends with a discussion
    of the OpenAL environmental audio library, which is very useful for producing
    realistic sound effects in 3D environments.'
