    # Setting Up a Framebuffer Device


    Although kernel configuration is beyond the scope of this book, a few notes are
    in here order.


    At present, the Linux kernel has framebuffer support for 3Dfx Voodoo3, 3DLabs
    Permedia2, ATI Mach64, and several Matrox video cards. It also supports generic
    VESA 2.0-compliant cards (with reduced functionality, such as no mode switching).
    Cards are added with each kernel release. If yours is a supported video card,
    you can recompile your kernel with framebuffer device support. Read the information
    in the kernel source tree’s Documentation/fb for instructions.


    Once you''ve booted with a working framebuffer device, you can use the fbset utility
    (http://www.cs.kuleleu.ac.be/~Egeert/) to change the video mode and adjust various
    framebuffer parameters. Make sure you install an appropriate /etc/fb.modes file
    (on more than later).


    If your video isn''t directly supported, not all is lost. You may still be able
    to get framebuffer support with the generic VESA 2.0 driver. This doesn''t work
    on all video cards (since many are not VESA 2.0 compliant), but it''s worth a
    try. If the VESA driver doesn''t work, you''re out of luck for now.


    # A First Foray into Framebuffer Programming


    We''ll start with a quick example of how to interact with the framebuffer console.
    This example won''t do anything complicated—it''ll just plot a single white pixel
    in the middle of the framebuffer. We''ll look at mode switching and pixel packing
    later on.'
