  md: "# 176\n\n# CHAPTER 5\n\nPerhaps the stickiest issue in sound programming (particularly\
    \ with OSS) is keeping the sound playback stream synchronized with the rest of\
    \ the game. SDL provided a nice callback that would notify your program whenever\
    \ the sound card was hungry for more samples, but OSS doesn't have a callback\
    \ system. If you try to write too many samples before the card has a chance to\
    \ play them, the write function will block (that, it will not return until it\
    \ can complete). As a result, the timing of your entire program will depend on\
    \ OSS's playback speed. This is not good.\n\nA closely related issue is latency.\
    \ It is inevitable that a game's sound will lag behind the action on the screen;\
    \ all games experience this, and it is not a problem so long as the latency is\
    \ only a small fraction of a second (preferably under half). OSS has quite a bit\
    \ of internal buffer space, and if you were to fill it to capacity by blindly\
    \ calling write, your latency would go through the roof. Imagine playing Quake\
    \ and hearing a gunshot several seconds after firing the gun—you would probably\
    \ switch to a different game!\n\nOSS stores samples in an internal buffer that\
    \ is divided into fragments of equal size. Each fragment samples approximately\
    \ half of audio data (resulting in a potential latency of half second). When the\
    \ sound card is finished playing a fragment, it jumps to the next. If the next\
    \ fragment has not been filled with samples, the sound card will play whatever\
    \ happens to be there, which results in audio glitches. Ideally, you want to stay\
    \ just a few fragments ahead of the sound card, to avoid skipping while keeping\
    \ latency to a minimum. You can, within limits, specify the number of fragments\
    \ and the size of each.\n\nTo set OSS's internal fragment size, send the SNDCTL_DSP_SETFRAGMENT\
    \ ioctl with a bitfield-encoded argument:\n\n```\nint ioctl_frag;\n\n/* Set the\
    \ fragment parameters. See the text for an explanation. */\nioctl_frag = 10; /*\
    \ fragment size 2~10 = 1024 bytes */\nioctl_frag += 3 * 65536; /* fragment count\
    \ is 3 */\nif (ioctl(dsp,SNDCTL_DSP_SETFRAGMENT,&ioctl_frag) != 0) {\n    /* handle\
    \ error */\n}\n```"
