  md: '# Computer Graphics Hardware


    Every personal computer is equipped with a video controller of some sort. This
    set of chips is responsible for producing images on the screen, based on the data
    contained in a certain area of memory (the framebuffer). In addition to this basic
    drudgery, the video controller often assists software by providing hardware-accelerated
    drawing functions. Video controllers usually reside on replaceable video cards
    that can be easily upgraded as video technology progresses.


    Video cards contain a unit called a CRTC, an acronym for cathode ray tube controller.
    This device (either a separate chip or part of another chip) instructs the monitor
    to redraw its picture at regular intervals. The image on a computer screen is
    composed of horizontal lines on a fluorescent surface, and the monitor''s hardware
    updates from top to bottom. Each completed image is called a refresh. The CRTC
    instructs the monitor to perform a new refresh at 60 times each second. The brief
    pause before refreshes is like the vertical retrace, because this is when the
    monitor''s electron beam returns to the top of the screen. No matter how quickly
    the data in the framebuffer changes, the monitor is not updated until the next
    refresh. The video hardware''s refresh rate is of great interest to a game developer.


    The image on a computer screen is divided into discrete colored areas called pixels
    (short for pictorial elements). The resolution of a display shows the number of
    pixels across and down; for instance, a screen with a resolution of 640 by 480
    is a matrix of 640 columns and 480 rows. The video cards use a device called RAMDAC
    (random access memory digital-analog converter) to pump these individual pixels
    from the framebuffer memory to the monitor. Video card manufacturers like to brag
    about the speed of their RAMDAC components.


    Since there are lots of pixels on the screen (anywhere 64,000 to more than a million),
    producing complete images is an intensive process, especially if a program needs
    to change the entire contents of the screen several times every second. Video
    chip manufacturers have invested a large amount of research in this problem and
    have created video accelerator chips to help with this work. Video accelerators
    can speed up graphical applications (such as games) by performing time-consuming
    updates with dedicated hardware. For instance, video accelerators can help out
    by performing high-speed copying between'
  merge: -1
  pgno: 88
- img_proc: true
  md: 'the framebuffer and other areas of memory. Computer memory is fast, today''s
    video games need every bit of performance they can get.


    # The Framebuffer


    The framebuffer is an area of memory that describes the image on the screen, with
    each on-screen pixel corresponding to one memory location. The exact format of
    the framebuffer is determined by the video chip set, but it is most commonly a
    simple array (this is known as a linear framebuffer). To change the color of a
    pixel on the screen, a program must calculate the location of the pixel in the
    array (with the formula $width \times y + x$), determine the correct representation
    of the desired color, and store the color representation in the framebuffer. The
    video card sends the new pixel to the monitor during its next screen refresh.


    Pixels are almost always represented by one- to four-byte values, and the exact
    format of these values depends on the current video mode. The following schemes
    are used to specify pixel colors in the framebuffer:


    # Indexing


    Pixel values are indices into a preset table of color values, which is called
    the colormap or palette. Each entry in this table consists of a red, green, and
    blue intensity level. The video card converts the indices into actual color intensities
    (signals for electron guns) as it goes. These video modes generally use one byte
    per pixel, allowing for a meager 256 colors on the screen at once. The palette
    can usually be changed at will (but updates to the palette will not show up until
    the next refresh). Clever programmers occasionally use the palette to implement
    animation tricks and special effects. Indexed modes offer extremely fast performance
    but relatively few colors.


    # Hicolor


    Pixel values are 16 bits (2 bytes) each. These bits are divided into red, green,
    and blue fields. It is common for hicolor modes to allocate 5 bits to red, 6 bits
    to green, and 5 bits to blue, but you cannot assume that this will be the case.
    Hicolor offers excellent performance potential and a decent representation of
    the color spectrum, and it is frequently used for game programming.'
  merge: -1
  pgno: 89
- img_proc: true
  md: '# CHAPTER 4


    However, it lacks the color depth necessary for professional graphics. This is
    currently the most important pixel format for game programming. Hicolor is also
    known as High Color, but most people use the shorter term.


    # True Color


    Pixel values are 24 bits each, allotting 1 byte to each color channel. True Color
    modes are extremely easy to program (since they do not require shifting or masking),
    but they tend to be rather slow due to the increased amount of video data. Some
    True Color modes use 32 bits for each pixel, simply wasting the 4th byte. This
    improves performance in many cases, because 32-bit processors are usually more
    efficient at accessing data aligned on 4-byte boundaries.


    # Direct Color


    Pixel values are divided into three bit fields, each of which is an index to a
    palette for a particular color channel. That is, Direct Color provides a separate
    palette for red, green, and blue. This scheme combines the advantages of indexing
    with the excellent color depth of True Color. Direct Color is rarely used for
    game programming (it is mainly a feature of high-end graphics workstations) and
    is mentioned here only for the sake of completeness.


    Although the variety of video modes may appear to be a serious programming nightmare,
    many games simply pick one mode to support (such as hicolor), and inform the video
    card of that mode when they start. If a video card does not allow a certain mode,
    it is often possible to perform on-the-fly conversion between pixel formats with
    only a minor performance loss. It is sometimes possible to write programs in a
    depth-independent manner.


    # The SDL Video API


    SDL uses structures called *surfaces* for manipulating graphical data. A surface
    is simply a block of memory for storing a rectangular region of pixels. You can
    think of a surface as a generic chunk of video data. Surfaces have widths, heights,
    and specific pixel formats, just as framebuffers do. In fact, SDL'
  merge: -1
  pgno: 90
- img_proc: true
  md: '# MASTERING SDL


    represents the video card''s framebuffer as a special surface. The rectangular
    regions of data stored in surfaces are often called bitmaps or pixmaps.


    The most important property of surfaces is that they can be copied onto other
    very quickly. That is, one surface''s pixels can be transferred to an identically
    sized rectangular area of another surface. This operation is called a blit, or
    block image transfer. Blits are a fundamental part of game programming because
    they allow complete images to be composed of predrawn graphics (generally created
    by artists with image-processing software). Since the framebuffer is a surface,
    entire images can be sent to the screen with a single blitting operation. SDL
    provides a function for performing fast blits between surfaces, and it can even
    convert between surfaces of different pixel formats on the fly.


    Most games rely almost exclusively on surface blits for their drawing (as opposed
    to drawing with individual pixels). For example, consider the game:: To Power
    (which was ported to Linux using SDL). Other than the lines used to indicate paths
    and gridpoints, every character and building that you see is stored in memory
    with surfaces, and they are drawn on the screen with blits. All of the game''s
    artwork was created by artists and stored in files. The game assembles its screen
    images almost entirely out of these predrawn graphics.


