    # # Finishing Penguin Warrior


    Over the course of this book, we have developed a small Linux game called Penguin
    Warrior. Right now, however, it lacks many of the features that would make it
    an enjoyable game. Players can fly around a small world, but there''s not much
    else to do. In this chapter we will turn Penguin Warrior into a complete, playable
