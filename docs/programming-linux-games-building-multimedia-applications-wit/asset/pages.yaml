- img_proc: true
  md: '# GAME SCRIPTING UNDER LINUX


    # Built-in Tcl Commands


    Let''s look at a few of Tcl''s built-in commands. Some of these commands are essential
    and are just nice to have around. In general, you should use as many built-in
    commands as possible, rather than writing your own, since C code executes much
    more quickly than interpreted Tcl. Performance is very much a concern when writing
    scripts for real-time games, especially when working with a language that isn''t
    remarkably fast to begin with.


    # Recursive Evaluation


    It''s sometimes nice to be able to evaluate arbitrary pieces of text (or arguments)
    as complete scripts, returning the result of the script if there are not stopstopping
    errors. In addition providing a clean way to implement control structures, eval
    is useful for forcing the interpreter to perform multiple passes of substitution
    over a string. Tcl''s power lies in the fact that it treats everything as text,
    and it performs substitution before execution. If a variable containing the text
    "$foo" is substituted into a string and the string is evaluated again (with eval),
    Tcl will try to substitute the value of the variable foo into the final string.
    Consider:


    ```

    $ tclsh

    % set foo {bar}

    $bar

    % set bar {Hello, world!}

    Hello, world!

    % eval puts foo

    Hello, world!

    ```


    Tcl automatically performs substitution on each line of code before it actually
    evaluates the code, and this immediately transforms the last line of input in
    the example into puts bar. The explicit call to eval forces another substitution
    pass, which transforms the code into puts Hello, world!. This trick is quite useful
    for game scripting; Tcl has very weak array support, and it is often more practical
    to create variable names (such as missile3 and ship5) on the fly. You can abuse
    eval in any number of ways. You''ll see how to use eval to create control structures
    shortly.'
  merge: -1
  pgno: 259
