    # To Every Man a Linux Distribution


    You''ve probably noticed that there are a lot of Linux distributions floating
    around the Internet. Some of these are major commercial operations (Red Hat, SuSE,
    Caldera), some are massive community efforts (Debian), and some don''t really
    fit into either category (my personal favorite, Slackware). Competition is good,
    but this assortment sometimes leads to incompatibilities between distributions,
    which you''ll have to contend with when you release your work to the public.


    Once your game is ready to see the light of day, you''ll need to come up with
    a way for users to install it. This could be as simple as a .tar.gz archive (tarball)
    containing your game''s source code and data files, or it could be as complex
    as a CD-ROM-based graphical setup system. Whatever you decide to, you''d be well
    advised to respect the Linux filesystem standard and account for the differences
    between various Linux distributions. If you don''t, you''ll irritate users at
    the very least and possibly cause serious problems. On the brighter side, a well-packaged
    program can make a good first impression.'
