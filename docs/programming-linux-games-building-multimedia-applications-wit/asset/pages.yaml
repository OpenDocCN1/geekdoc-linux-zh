  md: '# MASTERING SDL


    Instead of specifying game object movement in pixels per frame, Penguin Warrior
    uses pixels per unit of time (Just about any unit of time would work, but we''ll
    use 1/30th of second as our baseline, so that a performance of 30 frames per second
    will result in no adjustment to the game’s speed.) To calculate how far each game
    object should move in a frame, we determine how much time has passed since the
    last update and scale our movement accordingly. We update a global time_scale
    variable with this information at the start of each frame. Each time we need to
    move an object, we scale the distance by this amount. We also apply this scaling
    to acceleration and turning.


    Take a look at the Penguin Warrior code to see how this is done. It''s not too
    complicated, and it lets the game run at its highest performance on any computer.


    With the parallacking code, the particle system, the timing mechanism, and a bit
    of other SDL voodoo, we now have a working game engine, albeit a simple one. It
    lacks sound, other players, and weaponry, but we’ll add these later on. It’s time
    to take a break from SDL and Penguin Warrior for a tour of the slightly maddening
    world of Linux audio.'
