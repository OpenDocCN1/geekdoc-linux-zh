  md: '# CHAPTER 1


    # The Input Subsystem


    The input subsystem receives the user''s commands through an input device (like
    the keyboard or a joystick) and records these commands for further processing.
    While input device programming is not difficult, it should be done carefully,
    because flawed input processing can easily ruin an otherwise excellent game. The
    first version of Apogee''s Rise of the Triad (a first-person shooter from several
    years ago) suffered from particularly bad input handling, and the game was aggravating
    to play until this problem was fixed.


    One of input subsystem''s most important jobs is to simultaneously support a variety
    of input devices. A well-written input subsystem should be able to integrate just
    about any type of oddball game controller with minimal effort (this is made a
    bit easier by libraries like SDL, but it''s still something to keep in mind as
    you code). Some players prefer to use joysticks rather than mouse, and an input
    subsystem should be able to accommodate this preference without modification to
    the main game code. As far as the game is concerned, the joystick should appear
    as a generic device, capable of producing "left," "right,"up," and "down" commands.
    We will discuss SDL''s input handling and abstraction in Chapter 4, and we''ll
    touch on the lower levels of input handling in Linux later on.


    Nearly every game on the market allows you to remap the keyboard and other input
    devices to your liking, and this is a feature that players demand. Many people
    have non-US keyboards with different key locations, and you will end up cutting
    off a lot of would-be players unless you allow them to configure the game to work
    with their keyboards. Fortunately, this is not difficult; it can be accomplished
    with a simple lookup table. It is also a good idea to allow the player to store
    and retrieve multiple key mappings, in case a friend prefers a different configuration.


    # The Display Subsystem


    The display subsystem conveys the game''s status to the player in a visually impressive
    way, whether through simple 2D graphics, or advanced 3D rendering (the type of
    graphics you use doesn''t matter, as long as they are appropriate for the game).
    Regardless of the type of graphics produced by the display subsystem, the structure
    of the code is substantially the same.'
