    and called shell. This shell is good for learning Tcl and for writing scripts
    for quick jobs. Tcl can actually serve as a powerful replacement for traditional
    shell scripting languages. Scriptics developed no longer maintains a commercial
    development system called TclPro.

    It''s now open source and available to the public on SourceForge².

