  md: '# LINUX AUDIO PROGRAMMING


    the Doppler shift (a change in a sound''s apparent frequency due to relative motion)
    and attenuation (a loss in intensity over distance). These effects can add a great
    deal of depth and realism to game environments. OpenAL is designed to be hardware
    accelerated on multiple platforms by multiple vendors, and as such it is a completely
    open system (under the control of a review board very similar to OpenGL). OpenAL
    is free to be downloaded, modified, and used in any type of application, subject
    to the terms of the GNU LGPL. Although OpenAL is still evolving rapidly, it is
    usable now on Linux, Windows, and several other platforms.


    Not every application needs environmental audio, and sometimes it''s better idea
    to stick with SDL''s system, OSS, or ALSA. For instance, it would be pretty silly
    to use OpenAL for a sound file player or a recording program. However, OpenAL
    is flexible enough to handle just any environmental situation as well as basic
    items like background music, so it''s well suited as a general-purpose audio library
    for games. Later in this chapter we''ll use OpenAL to add environmental audio
    and music support to Penguin Warrior. First, let''s talk about the basic terminology
    and philosophy of OpenAL.


    # OpenAL Basics


    OpenAL is an audio rendering library (as opposed to a simple buffer playback system
    OSS). It plays sounds as it would be heard from a certain point, known as the
    listener, in a 3D world. Sounds come from points in space called sources, each
    of can be stationary or moving. Each source is attached to a buffer, a chunk of
    raw PCM sound data describes what the source sounds like when the listener is
    on top of it. Multiple sources can share the same buffer (just as multiple walls
    can use the same texture in a game such as Quake), but it''s not possible to assign
    multiple buffers to the same source. Sources, and the listener are all considered
    objects, and they''re all easy to work with after you know which properties (position,
    velocity, and so forth) are relevant to each type.


    > This makes sense—a source is supposed to represent a particular noise coming
    from a certain point in space. If you want multiple sounds coming from the same
    place, put multiple sources at that position.'
