    No Starch—especially Karol Jurrado and Bill Pollock—for their patience and

    willingness to accommodate a first-time author. Thanks to Amanda Saab for

    making Programming Linux Games to the world.


    I''d like to thank the Loki crew for keeping my life interesting during the summer

    of 2000; especially Sam Lantanga for tolerating my never-ending SDL and

    framebuffer console questions, Joe Valenzuela for helping me get up to speed on

    OpenAL, and Lance Colvin for providing me with a place to stay during the

    ummer. Scott Draacker was always there to answer questions and provide

    feedback, even in the midst of slipping deadlines an ever-changing table of

    contents. This book would not have happened without his ongoing support.


    The following people deserve a virtual beer for helping me in many ways. The

    list is long, but so was the process of writing this book. Here goes:

    Martin Donlon for starting the SDL Documentation Project and providing me

    with hints as I wrote Chapter 4, Ray Kelm for commenting on Win32\portability
    issues, Matt Freddy:// phlui.acid.org for allowing me to

    use of their tracker music in Penguin Warrior, my Georgia Tech

    roomammates Daniel Larsen, Matt Might, Anthony Chen, and Frank Cheng for

    tolerating my odd hacking hours and fits of frustration over badly-documented

    APIs, Mike Phillips for obtaining excellent screenshots (which unfortunately)

