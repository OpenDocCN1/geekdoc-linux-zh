    # # In Retrospect


    I created Penguin Warrior to demonstrate game programming in the Linux environment.
    I started writing it while I was trying to decide where to go with Chapter 4,
    and I’ve added features throughout the book to demonstrate various topics that
    came up. There was no formal design process, other than the planning that went
    into the book as a whole. Penguin Warrior turned out well enough, but it’s an
    incredibly simple game compared to most. At the risk of hypocrisy, I strongly
    recommend that you put considerable thought into the design of your games. It’s
    easy to write games that look good; it’s much harder to write games that play
    well. Admitted, Penguin Warrior doesn’t have much depth.'
