  md: '# 210 CHAPTER 5


    Once you''ve obtained a usable device, you should create a context.

    alCreateContext creates an OpenAL context and associates it with a particular
    audio device. It takes two parameters: an open device and a list of attributes.
    The attributes you request a particular sampling frequency or refresh rate; in
    most cases, NULL is a sufficient answer. Even with a valid audio device, alcCreateContext
    could fail, be sure to check for errors. Once you have an OpenAL context, you''re
    in business. It''s a good idea to explicitly set your new context with current
    alcMakeContextCurrent. (It''s possible, but not common, to use multiple contexts
    within a single application: in this case, only one will be current at any given
    time, and you need to switch between them manually.)


    With a context in place, you can add sources and buffers, configure the listener,
    and start playback. Once OpenAL is in motion, you can add, remove, or modify objects
    at any time; whatever changes you make will affect the outgoing audio stream immediately.
    OpenAL runs continuously in the background and requires no attention until you
    decide to change something in its 3D world. Sources and the listener are specific
    to a particular context, and changes you make to these types of objects won''t
    affect other contexts. Buffers don''t belong to any particular context, but you
    need to have a context before you can create them (since OpenAL uses the context
    for error reporting). It follows that you need to destroy all of your buffers
    before you delete the last context. You should be wary of doing anything with
    OpenAL without a valid context.


    Now that you know bit about the API and its capabilities, let''s put OpenAL to
    work as a sound engine for Penguin Warrior.


