  md: '# Adding Music to Penguin Warrior


    Penguin Warrior needs some music. Music can add a lot of atmosphere to a game,
    and it can dramatically affect the player''s mood. Would the first level of Doom
    have been quite exciting without the fast-paced soundtrack, or the first level
    of Descent as enthralling without the mysterious, cold, and robotic background
    tune? Matt Fried of http://phuid.acid.org kindly gave us permission to use some
    of music for this game, and we need to write some code to play. The music was
    originally an .3m (Scream Tracker) module,¹⁰ it''s now an Ogg Vorbis stream (reflux.ogg)
    in this chapter''s Penguin Warrior directory).


    We need a way to play Ogg Vorbis music through OpenAL.


    This would be straightforward with just any other audio API, but we''ll have to
    nudge OpenAL to get it to play streaming stereo without unwanted environmental
    effects. Background music shouldn''t really come from any particular point in
    space, and it should be played in stereo. There''s no such as stereo environmental
    audio, since the effect is really just a product of speaker positioning. Fortunately,
    OpenAL does provide a "back door" (via an extension) for injecting stereo sound
    into a buffer. We''ll use this back door in a moment.


    We have another problem: since music files tend to be enormous and time-consuming,
    decode it would be a bad idea to load entire tracks into OpenAL buffers. It might
    work for small files (a few megabytes or less), but that''s still a lot of wasted
    memory. How else can we play music? Until we''ve worked only with simple OpenAL
    buffers that never change. It turns out OpenAL defines a special type of buffer
    for streaming audio data. Streaming buffers don''t take fixed-size pieces of PCM
    data, as most buffers do; instead, they start empty and play data as it arrives
    (so long as it arrives in a timely fashion). This lets us incrementally decode
    music throughout the program. We just have to make sure we decode it quickly to
    stay ahead of OpenAL.


    > ¹⁰ Scream Tracker is a rather odd well-known program for assembling music from
    pre-recorded samples.'
