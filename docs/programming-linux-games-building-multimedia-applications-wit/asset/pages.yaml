    # # A Simple Scripting Engine


    It''s time for some results. We know enough about Tcl and its library to create

    simple but practical scripting interface for our game. We''ll then be able to

    implement the computer player''s brain as an easily modifiable script.


    # # Source Files


    We will add three files to Penguin Warrior in this chapter: scripting.c,

    scripting.h, and pwtcl.h. The first is the C source code that embeds

    Tcl library, the second is a header file that declares our scripting

    interface, and the third is the Tcl script that our scripting engine will

    execute automatically. In addition, we will link Penguin Warrior against

    the libcl shared library.


    The basic job of the scripting engine is to provide an interface between the game

    and script. Ideally, the script will act just like any other player, from

    the game''s perspective. It will observe its surroundings, formulate a plan,

    provide the game engine with input for controlling a ship, and eventually destroy

    the target. We''ll talk more about writing the Tcl side of this project in the
    next

    section. We''ll concentrate on building the Tcl library interface.


    Our script will need several pieces of information, as well as the ability to
    cause

    changes in the game world. First, we''ll need to give it the positions of the
    two

    players in the world, as well as their headings and velocities. This will give
    the

    script enough information to figure out where the opponent ship is relative to
    the

    human player. The script also needs a way to control the opponent ship''s

    thttle, heading, and weapons. There are several possible ways to make this

    control available to the script.'
