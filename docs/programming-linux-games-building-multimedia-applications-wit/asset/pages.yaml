    # Use the Source, Luke!


    The Linux framebuffer interface is not very well documented. In order to gain
    a clear understanding of the API to write this section of the book, I had to read
    through quite a bit of source code. It was actually rather enjoyable; blazing
    a trail through uncharted and undocumented territory is what programming is all
    about.


    The best framebuffer reference I came across is the SDL source code. Its framebuffer-handling
    routines are well written, widely tested, and fairly comprehensive. Although it
    certainly is possible to pick up framebuffer programming by studying the fb.h
    header and the small amount of documentation included with the kernel, SDL made
    the overall structure of the interface much easier to understand. If you find
    yourself in a difficult or obscure coding situation, look for some code that already
    does what you''re trying to accomplish. You just might save yourself a considerable
    amount of time.


    # Console Input Handling


    In previous chapters we''ve used SDL to manage our input device handling. With
    the framebuffer console, however, we''re distant from such creature comforts.
    Therefore, we need to develop alternate means of accessing the keyboard and other
    input devices.


    First things: keyboard input. We can accomplish this by putting the terminal in
    raw mode and setting a few attributes. It''s ugly, but it works. The next issue
    is mouse support, which comes from the GPM program (present on nearly every Linux
    system as a standard console mouse interface). We''ll look at each of these briefly
    and leave a longer dissertation on the subject to the kernel''s header files and
    the SDL source code.'
