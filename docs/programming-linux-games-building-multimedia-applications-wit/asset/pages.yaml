    # Creating Graphics


    Any serious game development team should hire at least one artist and probably
    produce higher-quality game artwork than a programmer. However, it is often useful
    for programmers to create temporary artwork for the purpose of development. By
    creating a low-quality set of test artwork (models, images, and even audio effects),
    a programmer can get a better idea of exactly what to ask of the artist. This
    temporary artwork can prevent misunderstandings and frustration on the part of
