    Multithreading is the ability of a program to execute multiple parts of itself
    simultaneously in the same address space. This feature can be useful developers;
    for instance, a programmer might elect to use separate threads for video processing
    and music playback so that they can run simultaneously. When properly used, multithreading
    can simplify game programming and make the end result smoother and more efficient.
    Threads can significantly boost performance on multiprocessor systems, since each
    thread can run on a separate processor (this is up to the operating system, though).


    Several different programming libraries exist for the mainstream operating systems.
    Windows and Linux use completely different threading interfaces, and Solaris (Sun
    Microystems'') supports both its own threading API and the Linux one uses. SDL
    solves this cross-platform inconsistency with its own set of portable threading
    functions.


    Threads are essentially asynchronous procedure calls that return immediately but
    continue running in the background. An SDL thread entry is simply a pointer to
    a void function that takes a void pointer as a parameter. Threads have their own
    stacks, but they share the application''s global variables, heap, code, and file
    descriptors. You can start new threads with SDL_CreateThread function. SDL_CreateThread
    returns a pointer to a thread handle (of type SDLThread) that can be used to interact
    with the new thread. SDL provides functions for terminating threads (SDL_KillThread)
    and for waiting for them to finish executing (SDL_WaitThread). Waiting for a thread
    to finish is called joining the thread.


    # Multithreading with SDL'
