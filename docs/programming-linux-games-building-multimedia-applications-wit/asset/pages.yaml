  md: '# CHAPTER 5


    The overall structure of **music.c** should be pretty clear. InitMusic creates
    a streaming buffer and a source to go along with it. It sets the source to relative
    mode, which means that its position will be determined as a vector relative to
    the listener (and hence the default position of <0, 0, 0> will remain directly
    on top of the listener, no matter where listener moves). This will keep environmental
    audio effects out of our music stream—you obviously can''t detect attenuation
    or the Doppler effect from a pair of headphones.


    CleanupMusic deletes the streaming buffer and the relative source. Nothing breathtaking
    here.


    LoadMusic sets up the system to play a new Ogg Vorbis file. It opens the file
    with fopen, makes it into an OggVorbis File with ov.open, and gets information
    about the sampling rate and number of channels with ov.info. Once the file is
    ready to go, LoadMusic sets the music.file_loaded flag to let the playback code
    know it''s OK to start playback.


    StartMusic calls alSource to begin playback. Nothing will actually happen until
    UpdateMusic gets around decoding and writing some PCM data to the streaming buffer,
    but at this point it is primed and ready to go. StopMusic does just the opposite:
    it calls alSourceStop to end playback.


    Finally, the meat of the music system: UpdateMusic is responsible for actually
    decoding and writing music data. It decodes chunks of data with ov.read, looping
    it until as much data as it has, and writes to the streaming buffer with alBufferAppendDataLOKI.
    This function is easy to understand, despite its long-lived nature: it adds a
    buffer of PCM data to the end of a streaming buffer, preserving the requested
    sample format. This is the back door we mentioned earlier. The ~LOKI at the end
    of the function name means this is a vendor-specific OpenAL extension and not
    part of the core specification. However, since Loki Software is responsible for
    most of the OpenAL specification, it''s a safe bet that ~LOKI extensions be part
    of any future OpenAL implementations.


    ```

    Function alBufferAppendDataLOKI(buffer, data, size, freq, format)

    ```


    +   Synopsis Adds PCM data to the end of a streaming buffer, preserving the requested
    sample format internally. This is generally used to preserve multichannel'
