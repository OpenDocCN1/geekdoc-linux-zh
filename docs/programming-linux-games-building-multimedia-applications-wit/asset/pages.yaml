    # Making Slackware Packages


    Unlike RPM and Debian packages, packages for Slackware Linux are quite easy to
    create. To make a Slackware package, install your program into a fake root. (For
    instance, copy files into `tmp/foobar/usr/bin/` instead of `usr/bin/`.) All of
    your program''s installable files should be there, but nothing else; there''s
    no need to duplicate anything not related to your program. Make sure that the
    permissions on each file are correct and all symbolic links are in place. When
    the fake root tree is ready, run the `makepkg` script (included with Slackware)
    to create a `.tgz` package that can be installed with Slackware''s `installpkg`
    script. `.tgz` packages are really just tarballs with a bit of extra information;
    you can even install them manually (but that''s a bad idea).


    Users appreciate it when you take the time to create packages for your favorite
    distribution—it can save them a lot of work and help them keep their systems organized.
    However, maintaining packages does take a bit of work. If you have to choose just
    one package type to support, it should probably be RPM. If you''d like to maintain
    packages for a particular distribution, but don''t have the time to do so, just
    ask around online. Chances are good that someone enjoys making packages for that
    distribution and won''t mind lending a hand.


    As a closing thought, I''d like to point out that it is a very bad idea to release
    your software in `.rpm` or `.deb` packages without providing a simple `.tar.gz`
    option as well; many users (myself included) prefer to avoid package managers
    entirely and install everything by hand.


    > ^7 http://www.debian.org/devel'
