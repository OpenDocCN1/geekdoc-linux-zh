  md: '# CHAPTER 5


    Penguin Warrior''s audio interface is straightforward. main.c calls InitAudio
    during startup and CleanupAudio at exit. During each frame of animation, the game
    loop calls UpdateAudio with pointers to the current player data structures to
    update the positions and velocities of the audio sources. StartAudio actually
    starts playback (by setting the relevant sources to playback mode with alSourcePlay),
    and StopAudio stops playback on all sources. We''ll need to add more to this interface
    in Chapter 9 so we can trigger weapon and explosion sound effects, but this is
    sufficient for now.


    InitAudio does most of the OpenAL setup. It opens a device with alOpenDevice,
    creates a context with alCreateContext, and makes the context current with alMakeContext.
    It then uses alGenSources to create sources for all of the sound-emitting objects
    in the game (the opponent''s engine and weapons for both players). Sources and
    buffers are always represented by integer handles (type Aluint and unsigned int).
    The actual source, listener, and buffer data structures are of no consequence
    to; they''re hidden inside OpenAL, and we access them by passing their handles
    to the various OpenAL object functions. InitAudio sets a few environmental parameters
    (relative distances for the Doppler effect and distance attenuation), prints a
    bit of information about the OpenAL library, and returns successfully.


    UpdateAudio keeps OpenAL informed about the state of the game world. It uses alListenerfv
    to set the listener to the position and direction of the player''s ship, and it
    uses alSourcefv to position each source. These functions expect their information
    as vectors: a three-element vector <x, y, z> for position and velocity and a six-element
    <ux, uy, uz> for orientation (orientating the “up” and “forward” vectors of the
    object in question). Since the game takes place in a two-dimensional plane, the
    z coordinates of these vectors will always be constant. (See Figure 5 for an idea
    of what the game looks like if we bring it into 3D space with a constant z coordinate).


    CleanupAudio shuts down OpenAL safely. This isn''t too difficult; it deactivates
    and destroys the current context, closes the audio device, and marks audio as
    disabled. With any multimedia toolkit, it''s a good idea to close OpenAL when
    you''re finished with it. It''s probably safe to leave an OpenAL context hanging
    when your program exits, but doing so could be messy if your OpenAL library happens
    to be using the sound card''s acceleration features.'
