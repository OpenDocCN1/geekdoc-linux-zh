    # SDL Audio Programming


    An often-overlooked but essential area of game programming is sound. Computer
    sound processing is as much of a science as computer graphics, the basics of format
    conversion, mixing, and playback are fairly straightforward. This section discusses
    the basics of computer audio and investigates SDL’s audio-programming interface.


    # Representing Sound with PCM


    Computer sound is based on pulse-code modulation, or PCM. As you know, pixels
    in a video source encode the average color intensities of an optical image at
    regular intervals, and more pixels allow for a closer representation of the original
    image. PCM data serves the same purpose, except that it represents the average
    intensities of sequential intervals in sound waves. Each “pixel” of PCM data is
    called a sample. The rate at which these samples occur is the sampling rate or
    frequency of the sound data. Sampling rates are expressed in the standard SI frequency
    unit, hertz (Hz). A higher sampling rate allows for a closer representation of
    the original sound wave.


    Individual PCM samples are usually 8 or 16 bits (1 or 2 bytes) for each channel
    (one channel for mono, two channels for stereo), and game-quality sound is most
    often sampled at either 22,050 or 44,100 Hz. Samples can be represented as signed
    or unsigned numbers. A 16-bit sample can express the intensity of a sound with
    much greater precision than an 8-bit sample, but it involves twice as much data.
    At 44,100 Hz with 16-bit samples, one second of sound data will consume nearly
    90 kilobytes of storage, or twice that for stereo. Game'
