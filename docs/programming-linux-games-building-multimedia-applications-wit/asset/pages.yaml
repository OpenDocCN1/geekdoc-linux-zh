    \ an alpha channel, SDL may or may not eventually support bitmap programs that\
    \ do not write this format.\n\n² I created these images using the GNU Image Manipulation\
    \ Program (The GIMP), http://www.gimp.org). This is a worthwhile program to learn,\
    \ even if you're not an artist."
