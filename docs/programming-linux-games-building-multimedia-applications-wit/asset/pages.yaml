  md: '# Preface


    A few few years ago I was browsing the computer section at a local bookstore when
    I bumped into another computer enthusiast. He introduced himself as a game programmer,
    and I was impressed by the projects he had worked on, and told me about his latest
    fascination: Linux. It meant little to me at the time, but I filed the conversation
    away for future reference, and eventually I remembered the name and installed
    Linux on my home computer.


    The first few months were not easy. Linux is vastly different from DOS or Windows,
    and it took some getting used to. But persistence paid off, and soon I felt confident
    enough to make the permanent switch. The development tools rocked, and I was impressed
    by the fact that code mistakes almost never led to system crashes. Once I realized
    what I''d been missing, I never wanted to go back to Windows again.


    Except to play games. A group of friends used to hold networked gaming parties
    (netfetes, in the parlance of the crowd), and all of the games they relied on
    Windows and DOS. I reluctantly kept a minimal copy of Windows on one of my drives
    so I wouldn''t be left out of netting.


    Linux is a great operating system for developers, and even for casual users who
    don''t mind the initial learning curve. But until recently, Linux has been lousy
    for gaming. This has plenty of performance and stability to support high-performance
    multimedia applications. It did, however, lack support from game developers. Thanks
    to portable game programming toolkits like SDL and OpenAIAL, this is beginning
    to change. Linux still hasn''t seen very much original game development, but Linux
    users now have access to ported (converted) versions of a number of major commercial
    games, produced mainly by Loki Software, Inc.'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'iv


    PREFACE


    Game programming has been one of my hobbies ever since my first Commodore 64 computer,
    and I wasn''t about to leave it when I left the Windows world for Linux. The SVGALib
    library held me over for a while, but SDL quickly over as my favorite way to write
    Linux games. After meeting the Loki crew at a Linux trade show, I decided that
    Linux gaming meant business, and got the idea to write a book about it. A year
    later, it is finally finished, and I hope you enjoy reading it.


    # Who This Book Is For


    This book is for anyone who wants to learn how to write games for Linux; if you
    know enough to start X, you know enough basics with Linux; open a terminal, copy
    files around, and free up a text editor, you''re good to go. I also assume that
    you have a reasonable grasp of the C programming language. Flip through the book
    and see if you can decipher the syntax of the examples. We''ll go through all
    of the necessary library calls, so don''t worry if you see a bunch of unfamiliar
    function names, but you should be able to understand the majority of the actual
    code. No prior experience with multimedia programming is assumed, so don''t worry
    if you''ve never had the perverse pleasure of hacking a graphics register or shoving
    a pixel into memory. All in good time!


    Although this isn''t a reference manual in the traditional sense, chapters 4,
    5, 6, and 8 provide reference boxes for most of the API functions we cover. I
    hope that even experienced multimedia programmers find something useful.


    I will not discuss 3D programming in this book. There are already plenty of excellent
    books about OpenGL, and only a small bit of OpenGL programming is directly related
    to Linux. However, I will demonstrate how to use SDL as an effective replacement
    for the GLUT toolkit; see page 140.


    # Online Resources


    I made the decision to not include a CD-ROM with this book. This choice was both
    personal and pragmatic. Books tend to get lost or damaged, no matter how hard
    one tries to keep them in a safe place. CD inserts are usually impossible to open
    without damaging the book in some way. And finally, the'
  merge: -1
