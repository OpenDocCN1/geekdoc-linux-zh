  md: '# Competing APIs


    Linux is home to two competing sets of sound drivers. While Linux skeptics are
    likely to shout, "Aha! Fragmentation!" upon hearing this, the competition has
    raised the bar and has resulted in a much higher-quality set of sound drivers.
    Linux now supports almost every sound card on the market. One set of drivers is
    very consistent, complete, and stable, while the other set frequently breaks compatibility
    in order to cleanly cutting-edge features. These two sets are largely interoperable,
    and so Linux users can enjoy the best of both worlds.


    The original Linux sound API is the Open Sound System (OSS). OSS consists of a
    set of kernel modules that provide a common programming interface to hundreds
    of different sound cards. Some of these modules (OSS/Free) are distributed for
    free with the Linux kernel, and some are available in binary-only for a fee from
    4Front Technologies¹. The OSS modules are well written and commercially supported,
    but the OSS programming interface leaves something to be desired. Nonetheless,
    OSS is more or less a facto standard for Linux audio, and supporting OSS virtually
    guarantees that your application will work on most hardware.


    The Advanced Linux Sound Architecture (ALSA) project² has created an alternate
    set of Linux sound drivers. ALSA consists of a set of kernel modules as well as
    a programming library, providing support for a substantial and ever increasing
    number of sound cards. The ALSA library is much more convenient than the OSS''s
    ioctl-based interface, and there is a simple emulation driver to support programs
    that do not use the ALSA API. Perhaps the most significant difference between
    ALSA and OSS is that ALSA is a free software project maintained by volunteers,
    whereas OSS is a commercial venture that supports the latest hardware through
    nondisclosure agreements. Each approach has advantages. ALSA''s biggest problem
    is that it is not quite ready to go mainstream yet; its programming interface
    changes with every major release (but this is slowing down). Many people use ALSA
    exclusively for its compatibility mode, since many applications don''t support
    ALSA directly.


    ```

    ¹ http://www.4front-tech.com

