    This algorithm works (code it if you wish), but it''s not very fast. Performance
    might be acceptable if you replace the floating-point math with fixed point (a
    useful technique that we leave to other sources), but there''s a better way to
    draw lines.


    Let''s analyze our algorithm. At each step, we move one pixel in the major direction,
    and $r = span$ pixels in the minor direction. The method we''ve just outlined
    coordinates of $r$ at the start of the routine and repeatedly adds it to the coordinate
    $r$. This floating-point operation is one of the major costs of the algorithm,
    and we''d like to get rid of it if all possible.^2


    To optimize this algorithm out of the loop, we need to look at the nature of division.
    Suppose you want to divide 15 by 4. An obvious approach is to simply add up 4
    until you break 15, then take 1 less than that number as your answer (in which
    case is 3, with a remainder of 3). This is called incremental division, and we
    can leverage it for faster line drawing.


    At each step along the line''s major axis, we will perform one step of incremental
    division by adding the line''s minor span to a running total. When this total
    exceeds the span of the major axis, we''ll take one step along the minor axis
    and subtract the major span from the total. With variables, the algorithm looks
    something like this:


    +   1. Set $x$ and $y$ to the starting coordinates, major and minor to the major
    and minor spans, and $sum$ to 0.

    2. Draw a pixel at $(x, y)$.

    3. Add 1 to the coordinate of the major axis ($x$ or $y$).


    > ^2 Actually, the addition is rather cheap on today''s processors. The killer
    is the inevitable conversion of the floating-point coordinate to an integer at
    each step. To be perfectly honest, today''s processors are fast enough that you
    could get away with this algorithm in a game. But we can do better.'
