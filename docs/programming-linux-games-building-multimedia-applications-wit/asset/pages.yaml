  md: 'The switch command''s other matching modes are even more powerful. To use globbing
    or regex matching, add -glob or -regexp as the first argument to switch. These
    modes are not likely to be useful in a game script, however, and they aren''t
    nearly as fast as normal string matching.


    # Procedures


    Tcl procedures are commands that are implemented in Tcl rather than in C. They
    can take any number of arguments, and they can optionally return a single value.
    Tcl provides a proc for creating procedures. Once you have created a procedure,
    you can invoke it, just as you can any other Tcl command. For instance, the following
    creates an avg command for averaging two numbers:


    ```

    proc avg { a b } {

    return [expr ($a + $b) / 2]

    }

    ```


    proc takes three arguments: the name of the command to define, a list of the parameters
    to it, and a script to associate with the command (as a string). Since all Tcl
    variables (except for associative arrays, which we won''t discuss here) are strings,
    there is no need to specify anything about the parameters, other than the names.
    When the command is executed, the arguments passed to the command will be available
    as variables with these names.


    Tcl handles local and global variables a bit differently than most other languages.
    All variable names are assumed to be local unless you specify otherwise; that
    is, global variables are not visible from procedure bodies. For example, the following
    code is incorrect:


    ```

    set status {0k}


    proc printstatus {} {

    puts "Status: $status"

    }

    ```


    Here, status is a global variable, and so by default it is not available to printstatus.
    To remedy this, use the global command to bring in the global variables you need
    to access:'
