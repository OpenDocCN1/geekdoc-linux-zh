    \ To draw Penguin phaser beams, we will need a general-purpose line-drawing routine.\n\
    \nHow should we go about drawing a line between two points on the framebuffer?\
    \ It may not seem like a difficult problem at glance, but doing it quickly is\
    \ a bit of a trick. From the given starting point, we need to iterate across the\
    \ framebuffer in steps so that we land exactly at the ending coordinate. At each\
    \ step, we draw one pixel. The challenge is to do this without drawing the same\
    \ point more than once and without leaving holes in the line. One possible algorithm\
    \ is as follows:\n\n+   * Determine which axis has the larger span. This is the\
    \ *major* axis, and the other is the *minor* axis. A mostly vertical line, for\
    \ instance, has a vertical major axis and a horizontal minor axis.\n\n+   * Calculate\
    \ the ratio $r = \frac{minor}{major}$, accounting for the special case where the\
    \ major axis is zero.\n\n+   * Iterate from the starting point to the ending point.\
    \ For each step, move one pixel in the major direction and $r$ pixels in the minor\
    \ direction. ($r$ will\n\n> ¹ The television documentary *Star Trek* tells us\
    \ that a phaser is really a special type of particle beam, but we'll forgo that\
    \ bit of realism for now."
