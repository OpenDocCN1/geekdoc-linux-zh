    ALSA is a bit change from OSS. A welcome change, to be certain: it presents a
    library-based interface, not a system of semi-intuitive and inadequately documented
    ioctls. ALSA is based on *cards* and *devices*. A card is simply a piece of sound
    hardware, and a device is a logical piece of functionality provided by that card
    (such as PCM sampling or MIDI sequencing). A card generally encompasses multiple
    devices. Cards and devices are numbered, starting with zero. The first step in
    writing an ALSA sound player is to locate a suitable card and device. Our program
    loops through the possible cards, from zero to the limit returned by the `snd.card`
    function, attempting to find an available PCM output device on each. If this loop
    is successful, the `alsa.pcm` variable will be ended up to an open PCM playback
    device. We could save some by jumping directly to the card and device suggested
    by the `snd.defaults.pcm.card` and `snd.defaults.pcm.device` functions, and the
    loop does a better job of illustrating ALSA''s organization.


    ALSA devices are marked with *states*. A PCM playback device can be *not ready*
    (uninitialized but not capable of processing sound), *prepared* (to start immediately
    upon receiving audio data), *running* (actually playing back samples), *underrun*
    (in limbo samples were not received quickly enough), or *paused*. A PCM device
    moves to the ready state when it receives its initial configuration data, and
    to the prepared state when `snd.pcm_playback_prepare` is called. You must put
    the ALSA device into the prepared state before you can play samples. This system
    of states might seem like overkill, they make ALSA programming much more predictable
    than OSS programming. Given a particular state, you can always expect a certain
    set of responses from the sound device. The distinction between prepared and ready'
