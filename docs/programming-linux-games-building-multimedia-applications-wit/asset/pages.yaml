    # Linux Isn’t Alone: Supporting FreeBSD


    Linux isn''t the only contender in the free OS arena. FreeBSD is a very similar
    system with an active and knowledgeable user community. Although FreeBSD can theoretically
    run binaries out of the box, a few differences sometimes prevent Linux applications
    (and games) from working. Aside from these minor glitches, FreeBSD is rather easy
    to support (and certainly worthwhile, given its quite), so it’s a good idea to
    keep a few things in mind as you develop:


    +   - Half the work of supporting in FreeBSD is getting your build environment
    set up. This should be easy: almost all Linux libraries are also available under
    FreeBSD, as well as all of the GNU development utilities. Once you get your application
    to compile under FreeBSD, the rest is a piece of cake. This is a good reason to
    use Autoconf; with a bit of help from the configure script, there’s a good chance
    that your project will require no modifications whatsoever for FreeBSD.


    Note that the GNU Make utility is called gmake under FreeBSD. The Make utility
    with FreeBSD is actually BSD Make, which is somewhat incompatible with GNU Make.
    If you plan to use Autoconf, you definitely want GNU Make.


    +   - FreeBSD’s filesystem is very similar to a typical Linux distribution’s filesystem,
    and you should treat it accordingly. We’ll discuss filesystem politeness later
    in this chapter.


    +   - As a descendant of the original BSD, FreeBSD has no proc/ filesystem (which
    the Linux kernel uses to publish information about the system). You probably shouldn’t
    mention proc/ in most cases (since its layout depends on the current version of
    the kernel), but it’s sometimes the only way to get statistics about the system.
    If your program depends on proc/, you’ll have to do some porting.


    > 6 Although I speak of Linux here as a complete operating system, the more correct
    term would be “Linux-based system,” or as the Free Software Foundation would prefer,
    “Linux-based GNU system.” FreeBSD is the whole shabang—that is, unlike Linux,
    FreeBSD encompasses a complete operating system, including a kernel and a set
    of software. There is only one FreeBSD distribution, coordinated by a well-defined
    team of volunteers.'
