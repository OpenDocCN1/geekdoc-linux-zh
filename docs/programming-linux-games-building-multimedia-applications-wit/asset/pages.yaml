  md: '# TO EVERY MAN A LINUX DISTRIBUTION


    usr/ is typically the largest top-level directory on the system. It houses almost
    all of the system''s datafiles, application binaries (those that aren''t in opt/,
    at least), and some local configuration files. Here''s a typical usr/ structure:


    # usr/X11R/


    The X Window System. It would more correctly be elsewhere, but this location is
    well established, and the FHS makes an exception for it.


    # usr/bin/


    User binaries. In some cases it''s acceptable for your installation program to
    put binaries or symlinks here; see below.


    # usr/games/


    Games. If your game is small (one or two files), you might want to install it
    itself. If you''re not using a package manager, though usr/local/games/ is probably
    a better idea.


    # usr/include/


    Directory of .h files for the C compiler. If your game needs to install a development
    library of some sort (perhaps as part of a source build), its header files should
    go here so the C compiler can find them. It''s polite to put them in a subdirectory
    of usr/include/. SDL puts its headers in usr/include/SDL or usr/local/include/.


    # usr/lib/


    Noncritical libraries. The system should be able to run without the libraries
    stored in usr/lib/. Packages as SDL and GTK usually put their shared libraries
    here (or in usr/local/lib/). The distinction between critical (lib/) and noncritical
    (usr/lib/) is very important for maintaining a Linux system.


    # usr/local/


    Similar in function to opt/. This directory is not supposed to be under the control
    of any package manager. RPM packages usually install to usr/ rather than usr/local/.
    If you intend to use Loki''s Setup program for your installation, you''ll probably
    want to install to usr/local/. It''s not uncommon for applications to create their
    own subdirectories under usr/local/ (whereas creating a subdirectory under usr/
    is very bad style). usr/local/'
  merge: -1
