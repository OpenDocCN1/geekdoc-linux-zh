    # Multiplayer Penguin Warrior


    So far, Penguin Warrior has supported only a computer-controlled opponent, and
    a fairly unintelligent one of that. However, it''s a lot more fun to play against
    humans than against Tcl scripts.


    This will be a simple networking system, as games go. It will use a simple TCP
    scheme to keep the game in sync, and it will not use of UDP. (That would be overkill
