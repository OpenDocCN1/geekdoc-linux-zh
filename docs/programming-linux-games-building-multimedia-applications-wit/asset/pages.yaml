- img_proc: true
  md: '148 CHAPTER 4


    Penguin Warrior draws its starry background by covering the screen with individual
    *tiles* (small bitmaps) before drawing each frame of animation. Background images
    tend to be repetitive as well as large, and programs can often create them on
    the fly by putting together tiles in a predetermined pattern. Penguin Warrior
    generates a two-dimensional array of random indices and then draws the starry
    background by assembling the tiles into a complete image. A 20 by 20 array of
    64 tiles generates a virtual 1280 by 1280 image, using only a fraction of the
    memory would take to store the image directly. This technique lends itself to
    random patterns, but it has also been used to generate intricate battlefields
    for games such as StarCraft and Civilization. Tiling can produce ugly results
    if the tiles look alike to begin with (remember the "garbage in, garbage out"
    principle), but otherwise the real disadvantage to tiling is code compilation.
    No matter what technique you use to paint your game''s background, you''ll still
    have to redraw the entire screen for each frame. This shouldn''t be a problem
    as long as you use SDL optimization techniques, such as calling SDL_DisplayFormat
    on your surfaces before them and avoiding alpha when you can.


    Where does parallacking fit in? Next time you''re in a moving car, look out the
    side window. We tend to take for granted objects in the distance to move more
    slowly than nearby objects. This effect is known as *parallax*, and you can exploit
    it to make your 2D graphics more convincing. Instead of drawing one sheet of tiles
    in the background, you will draw two (one obviously have to be transparent or
    translucent). These layers scroll past the player at different speeds, giving
    the illusion of depth. To create a parallax effect, you''ll also need two sets
    of background tiles, one with a colorkey (transparent) and one without. You''ll
    also need two tile index arrays, one twice large as the other (assuming that we
    want the top layer to scroll twice as fast as the bottom layer).


    There is really nothing complicated about parallax scrolling. The only trick is
    to do it quickly enough to avoid destroying the smooth effect, and to achieve
    this you need to squeeze every bit of performance SDL can provide.


    Enough rambling; let''s dig into some code! The code that follows is **background.c**,
    in the Penguin Warrior source directory for this chapter. It would be a good idea
    to run the game and observe parallacking in action, since it is hard to demonstrate
    motion effects with screen shots.'
  merge: -1
