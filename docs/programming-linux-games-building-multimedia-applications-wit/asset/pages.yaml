  md: 'custom commands, and the language is trivial to learn. Before we learn how
    to weld the Tcl library into our game engine, however, let''s look at the Tcl
    language itself. If you''re interested in learning how to hook up a scripting
    engine or if you happen to have a distastee for Tcl, you may wish to skim over
    the next section.


    # A Crash Course in Tcl


    Tcl is an extremely simple language to learn; in fact, the biggest problem with
    Tcl is that people often try to second-guess its trivial syntax. Once we''ve gone
    over the basics of Tcl syntax, we will examine the embeddable Tcl scripting library
    and learn how to add its functionality to Penguin Warrior. We''ll keep this brief;
    this is not a book on scripting languages, nor is it a treatise on the points
    of Tcl coding


    Tcl is based entirely on substitution. It has no notion of data types; numbers
    and strings are the same thing, represented internally as strings and converted
    as necessary.¹ Tcl programs consist of words. The first word on each line is a
    *command*, and the rest of the words on each line are *arguments* to that command.
    Many commands are provided by Tcl, but you can also easily add your own, either
    as scripts or as native C code. Tcl has no keywords; everything is implemented
    with commands, even such high-level constructs as codefar and codewidth.


    There are two types of strings in Tcl. The first type is delimited by curly braces
    ({ }). These strings are not affected by Tcl''s normal substitution rules (which
    we discuss shortly). The second type is delimited by double quotes. These are
    subject to substitution and backslash escapes. (Backslash escapes work just like
    they do in C.) The first type of strings is processed a bit more quickly, so it
    is a


    > ¹ Performance-minded readers need not be concerned about the implications of
    treating all variables as strings. Tcl does a bit ofoodoo internally to avoid
    unnecessary conversions; for instance, if it appears to Tcl that a certain variable
    contains a floating-number, it will store it in an appropriate binary format,
    rather than as a string. This improves memory usage and performance. However,
    this optimization takes place behind the scenes, and you can treat everything
    as a string.'
