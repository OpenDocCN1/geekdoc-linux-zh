    # Setting Framebuffer Video Modes


    Most graphics interfaces allow programs to change video modes simply by specifying
    the desired resolution and color depth for the new mode. The framebuffer device
    is completely different. To set a new video mode, you have to specify low-level
    video timings for the desired mode. This isn''t as bad as it sounds. A database
    of mode timings and resolutions is in /etc/fb.modes on most framebuffer-compatible
    systems, and these timings are standardized enough that they''ll probably work
    on most systems, even without a properly configured mode database. Ideally, every
    system would have a properly configured /etc/fb.modes file containing valid mode
    definitions for the system''s particular video hardware and monitor.


    Once you know the timings for the mode you want to set, you can feed them to the
    framebuffer driver with an ioctl call. If the driver supports mode switching (not
    all of them do), the video card will switch into the new mode and you can start
    drawing to the resized framebuffer. It''s not a bad idea to remap the framebuffer
    after a mode switch.


    # Warning


    The framebuffer device is a shared resource, and it does not clean up after programs
    that use it. If your programs change the video mode or edit palette entries, they
    should replace them before they exit. It would be prudent to install an exithandler
    for this purpose (along the lines of SDL_Quit).'
