  md: '# Handling Multiple Clients


    Linux is a multitasking operating system, and it''s easy to write programs that
    handle more than one client at a time. There are several ways to do this, but
    in my opinion the simplest is to create a separate thread for each client. (See
    the pthread_create manage.) Be careful, though some sockets API functions are
    not thread-safe and shouldn''t be called by more than one thread at a time.


    If you''re interested in learning how to write solid UNIX-based network servers,
    I suggest reading the book UNIX Network Programming [9]. It was of great assistance
    as I wrote this chapter. Another useful reference is The Pocket Guide to TCP/IP
    Sockets [3], a much smaller and more concise treatment of the sockets API.


    # Working with UDP Sockets


    UDP is a connectionless protocol. While TCP can be compared to a telephone conversation,
    UDP is more like the postal service. It deals with individually addressed packets
    of information that are not part of a larger stream. UDP is great for blasting
    game updates across the network with reckless abandon. They probably won''t all
    get there, but enough should arrive to keep the game running smoothly.


