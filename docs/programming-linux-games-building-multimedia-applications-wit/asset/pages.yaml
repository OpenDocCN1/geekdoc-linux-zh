    # Graphical Installation Goodness: Loki’s Setup Program


    Packages and tarballs are the staples of open source and free software distribution,
    but they might not meet your needs. Off-the-shelf, boxed software generally includes
    a nice, graphical installation program that copies the software from its CD-ROM
    to the user’s hard drive and performs various setup tasks. This would be easy
    to accomplish with a simple shell script, but it wouldn''t be pretty (the Linux
    version of Maple, an excellent computer-assisted mathematics system, uses a shell
    script for installation, and it is indeed ugly). A badly written installation
    script could leave a first-time player with a bad impression of the game as a
    whole, and the game industry is far too competitive for us to let happen


    Loki Software, Inc. developed Loki Setup to satisfy its need for a simple, consistent,
    and portable installation system. Setup reads a port-specific installation script
    from an XML file and then presents the user with a GTK-based installation wizard.
    If X11 isn''t available, Setup provides an equivalent terminal-based interface.
    Setup check disk space, copy files, run scripts, and launch the newly installed
    application when everything is finished. Loki Setup is free software, released
    under the GPL. (And since the Setup program is separate from the software it installs,
    you can still use Loki Setup for nonprofit software without being affected by
    the GPL.)


