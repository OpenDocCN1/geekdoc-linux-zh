    CHAPTER 9


    As a side note, Bresenham algorithm can be applied to many types of interpolation
    problems, including texture mapping and bitmap scaling. There are several more
    optimized variants of the Bresenham algorithm than the simple I''ve presented
    here.


    What happens if a line does not lie entirely within the bounds of the screen?
    DrawLine16 assumes that the line''s coordinates are inside the screen. If you
    called DrawLine16 with the coordinates (-10, -20) and (1000,3000), it would probably
    crash. Since the Penguin Warrior display shows only a small part of a large world,
    it''s very likely that a given phasor beam will start or end outside of the currently
    displayed area.


    We can handle this problem by clipping phasor beams against the screen''s rectangle.
    The ClipLineAgainstRectangle takes a line segment and a rectangle as input and
    adjusts the segment''s coordinates to encompass its visible section. If the line
    segment is least partially visible, ClipLineAgainstRectangle returns 1; otherwise
    it returns 0. We''ll filter phasor beams through this function to make sure we
    don''t DrawLine16 invalid coordinates.


    # Source Files


    The code from this section is available in the lines/ directory of the source
    archive. bresline.c is a simple implementation of the Bresenham algorithm with
    SDL, and linedip.c contains the ClipLineAgainstRectangle routine. The latter is
    long and boring, so we haven''t included this code in this chapter.


    # Detecting Phaser Hits


    Now we need a way to figure out whether a phasor met its mark. But what exactly
    is a “hit” and what is a “miss”? A phasor hits the target if the beam passes through
    the target''s bounding circle (a circle that encloses the object).


    > Books about graphics algorithms are always an interesting read. In particular,
