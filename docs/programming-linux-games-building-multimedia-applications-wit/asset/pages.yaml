    # Warning


    You may be in the habit of using the shell''s tab-completion feature to fill filenames.
    Be careful when you do this with gcc; it''s easy to accidentally overwrite your
    source files by accidentally tab-completing the wrong filenames. This may seem
    obvious, but I''ve lost work because of it.


    It is often useful to compile a C source file into an object file instead of an
    executable. Object files are not directly executable, but they contain the machine
    code translation of the source, and multiple object files can be pierced together
    into complete programs. To create object files, supply gcc with the -c option.
    This will instruct gcc to skip its final linking phase and write one object file
    for each source file listed on the command line.


    gcc is a complex and capable tool, and it supports a large number of command-line
    options. We list the most important ones here.


    +   -ansi Disable non-ANSI extensions, such as the asm and inline keywords. This
    option might be a good idea if you are concerned with portability between ANSI
    C compilers. However, most programmers aren''t this about standards, and strict
    ANSI mode tends to break a lot of existing software.


    +   -c Compiles to an object (.o) file instead of an executable. This option is
    important for creating libraries.


    +   -D symbol Define the given symbol in the preprocessor. This option is convenient
    for setting up conditional compilation based on the system''s configuration. We''ll
    use it in some of our examples to switch between different versions of code.'
