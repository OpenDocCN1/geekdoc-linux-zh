  md: '# Function SDL.LoadBMP(filename)


    **Synopsis** Loads a `.bmp` image file from disk into an SDL surface.


    **Returns** Pointer to a newly allocated SDL.Surface containing the loaded image.


    **Parameters** filename—Name of the bitmap file to load.


    The SDL_BlitSurface function performs a blit of one surface onto another, converting
    between pixel formats as necessary. This function takes four arguments: a source
    surface (the image to copy from), an SDL.Rect structure defining the rectangular
    region of the surface to copy, a destination surface (the image to copy to), and
    another SDL.Rect structure indicating the coordinates on the destination where
    the image should be drawn. These two rectangles must be of the same width and
    height (SDL does not currently perform stretching), and the $x$ and $y$ starting
    coordinates of the regions can be different.


    # Function SDL.BlitSurface(src, srect, dest, destrect)


    **Synopsis** Blits all or part of one surface (the source) onto another (the destination).


    **Parameters** `src`—Source surface. Pointer to a valid SDL.Surface structure.


    `srect`—Region of the source surface to copy. This is a pointer to an SDL.Rect
    structure. If this is NULL, SDL will try to copy the entire surface.


    `dest`—Destination surface.


    `destrect`—Region of the destination surface to replace with the source surface.
    The width and height of the destination surface don''t matter; SDL only cares
    about the $x$ and $y$ coordinates.'
