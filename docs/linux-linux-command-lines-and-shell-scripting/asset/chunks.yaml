    \ the help of the Flash software. However, the Linux operating system is free\
    \ of this vulnerability. Let us move on to the process of installing a Linux operating\
    \ system on your computer.\n\nThe first step for the installation is to download\
    \ the Ubuntu Linux server operating system. Go to `ww.ubuntu.com`. On the home\
    \ page of Ubuntu, you will find different versions of Ubuntu to do several things.\
    \ You will find a desktop version of Ubuntu. You will also see a netbook version.\
    \ There will be a cloud version as well, along with a version for tablets and\
    \ cell phones. You have to locate the server version of Ubuntu and find its link\
    \ for download.\n\nIf you are looking forward to installing Ubuntu on your computer\
    \ system, you should make sure that the file boots off a DVD and not a hard disk\
    \ drive. You can do this by pressing the `DELETE` or `F1` key on the keyboard\
    \ to enter the motherboard's BIOS settings. From there on, you may set up the\
    \ point where you may want to boot the system from. Several motherboard manufacturers\
    \ have different ways to enter the BIOS settings, so you should make sure that\
    \ you consult the user’s manual of the motherboard on how you should do this.\n\
    \nOnce you have downloaded the file and made it ready for booting from a CD or\
    \ DVD, you may proceed to install it. You will be asked in which language you\
    \ want to install Ubuntu Linux operating system. Choose the desired language and\
    \ hit `Enter`. Linux will be installed on your computer system.\n\n# Chapter Two:\
    \ Working with Linux Commands\n\nWhen we talk about the Linux command line, we\
    \ refer to the Linux shell. The Linux shell is a program that accepts keyboard\
    \ commands and passes them on to your operating system for execution. All Linux\
    \ distributions have a shell program, namely `bash`. The `bash` is the short form\
    \ of Bourne Again Shell. This is a reference to the fact that `bash` is the next\
    \ level version of `sh`, which was the original UNIX shell program.\n\nWhen you\
    \ are using a graphical user interface, you need another program, namely a terminal\
    \ emulator for interaction with the Linux shell. If you look through the desktop\
    \ menus, you will be able to locate one.\n\n## Let’s Start\n\nIt is time to start\
    \ working on the command line of your Linux operating system. The first step that\
    \ you need to take is to kick off the terminal emulator. Once you have opened\
    \ it, you should be able to see the following line.\n\n```\nlinuxbox1:~$\n```\n\
    \nThis is known as the shell prompt. You will see that whenever the Linux shell\
    \ is ready to take in the input. It may vary in appearance based on the distribution\
    \ you are using. If you see a `(#)` instead of a dollar sign (`$`), the terminal\
    \ session will offer you superuser privileges. Either you will be logged in as\
