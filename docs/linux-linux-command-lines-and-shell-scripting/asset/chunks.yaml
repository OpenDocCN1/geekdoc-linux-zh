    # Introduction


    This book on the Linux command line and shell scripting contains proven steps
    and strategies for using the keyboard to type commands and writing shell scripts
    to create your customized programs. Linux is tougher than Windows and Mac operating
    systems, and it is the securest of the three. When you have learned Linux, you
    can create your custom software and use it to do common daily tasks. You can customize
    how you want your computer should work.


    Linux is fun to operate, but it is not easy to operate. Unlike Windows that has
    a graphical interface, Linux has a command line. If you are unfamiliar with what
    a command line is, you should refer to Dos or Command Prompt in Windows. It is
    a black screen on which you have to enter commands and complete your daily tasks.


    I have written this book in two-parts: the first part deals with commands and
    the second part deals with shell scripting. Unless you have a good grasp of Linux
    commands and shell scripting, you cannot expertly operate the system. I have packed
    the book with the most used and important commands that you’ll need. I have also
    included a few results you can see on the command line after entering a command.'
