    第一种方式是通过开源模型，他们免费提供软件。然而，当你需要对该软件的支持或培训时，他们会向你收取一定的费用。例如，你可以为 Linux 服务器下载 `MySQL`
    服务器。你会发现它既实用又强大。即使你已经学习了 `MySQL` 程序的各种复杂之处，但软件的某些方面你可能仍需要学习或寻求支持。因此，你会联系软件开发者，请求有关该软件的培训或支持。此时，你必须为程序员或开发者的开发工作支付费用。


    开发者获得报酬的第二种方式是通过非商业开源许可。这是大多数人会遇到问题的地方。你必须向他们付钱才能使用它们。


    如果你想要一个用于家庭使用的软件，那没问题。但一旦你用它连接到业务服务器，你就需要支付许可费才能将该软件用于商业用途。最糟糕的情况是，许可费可能超过 8,000
    美元。在某些情况下，它可能会贵到这种程度。因此，意识到你将如何出于非商业、个人或商业目的使用该软件是明智的。


    开源软件程序员获得报酬的第三种方式是通过付费开源许可。你们某些人可能会问，如果一个软件恰好是付费软件，它怎么可能是开源许可的呢？如果软件的程序员允许你查看他们的代码，那么这种付费软件被称为开源软件。


    这些程序员赚钱的第四种方式是针对开源软件收取周期性的许可费。这类似于大多数开放许可程序。他们会让你免费下载并测试他们的软件。他们也会让你看到其代码，以便你了解软件是如何工作的。然而，如果你想拥有该软件的合法权利，你就必须支付年度或月度费用。这比贵得离谱的分钟许可费要便宜得多。


    ## Linux Shell（外壳）


    现在我将介绍 Linux 操作系统的 Linux Shell。任何操作系统的 shell 都是你与该系统交互的界面。以微软 Windows 为例，Windows
    Shell 是它的图形用户界面，你可以在那里看到鼠标指针在工作。你使用指针来导航屏幕，并点击不同的桌面元素，如图标和文件夹。


    Shell 通常有两种类型，第一种是图形用户界面（GUI），第二种是命令行界面（LUI）。LUI 看起来像 DOS 提示符。如果你曾经有机会操作微软 DOS
    提示符，你应该知道你看到并操作的屏幕就是命令行用户界面（LUI）。它是一个黑白屏幕。你在屏幕上看到一系列命令，以便从你的计算机获取特定的输出。


    Linux 是一个技术性的操作系统，这就是为什么程序员、工程师和极客更偏好它的原因。他们倾向于使用这种命令行界面，因为这便于他们编程。当你安装 Linux
    时，你可以像 Windows 一样在你的系统上安装 Linux 图形用户界面。在这里，你可以使用鼠标点击内容，或者访问更适合程序员的命令行用户界面。然而，Linux
    上的命令行界面是通过一系列命令运行的。


    你应该记住，Linux 的命令行界面比图形用户界面（GUI）更健壮。然而，当你使用带有命令行界面的 Linux Shell 安装 Linux 时，你看到的是一个提示符而不是鼠标。如果你不知道什么是命令提示符，或者不知道用它做什么，你很可能会被卡住。为了帮助你，我将提供
    Linux 命令和 shell 脚本的功能性示例。


    ## Root（根）


    你必须深入理解并消化的下一个概念是 root（根）。在 Linux 操作系统中，root 指代任何物的顶层。当你在 Linux 上工作时，你会更频繁地听到
    `root` 这个词。root 用户指的是计算机的管理员。root 用户是任何人在计算机系统上可以拥有的最高级别用户。如果你能以 root 用户身份登录，你就可以使用任何命令并对计算机进行任何操作。root
    用户指的是 Linux 系统的系统的根。它是操作系统安装在你的硬盘上的点。如果你从 Windows 操作系统的角度考虑这个问题，`C:/` 就是操作系统的根，因为你把
    Windows 操作系统安装在在那里。


    root 用户拥有多种权限，是任何用户可以达到的最高级访问权限。Linux 操作系统有许多文件夹，家目录（home folder）装满了用户数据，如设置、文档、程序等。因此，家目录可以作为特定用户的最高级别。最需要记住的一点是，当我们谈论
    Linux 操作系统中的 root 用户时，root 级别是最高级别。一旦我们开始输入命令并让 Linux 操作系统执行不同的任务，我们就会意识到 root
    用户概念有多么重要。我们在非 root 用户身份登录时会被阻塞的地方，作为 root 用户可以在那里获得访问权限。


    ## 使用 Linux 操作系统的原因


    你应该学习 Linux 操作系统的原因在于服务器的功能性。Linux 操作系统极其稳固。一旦你安装了 Linux 操作系统，一旦你熟悉了它的各种特性并设置了配置，Linux
    操作系统在运行过程中就不会出现过热和中途崩溃的情况。它可以一直运行下去。一旦你正确安装了 Linux 操作系统，它就有能力运行 150 天而不关机。


    Linux 操作系统与 Windows 的不同点在于，你必须每周重启它以避免某些损失。如果你配置得当，Linux 操作系统将运行并完成工作，而无需担心状况。当你在计算机上安装
    Linux 操作系统时，几乎没有操作问题。


    ## Linux 操作系统的安装


    在本节中，我将引导你如何安装 Linux 操作系统，以尝试它并感受使用 Linux 操作系统的流程。我将解释 Ubuntu Server 版的安装过程。它是开源且免费使用的。

