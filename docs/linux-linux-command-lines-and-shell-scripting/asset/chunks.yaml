    On most of the Linux operating systems, `man` uses `less` for displaying the manual
    page so that all familiar `less` commands work while the page is displayed. The
    manual that `man` displays has different sections, and it covers user commands
    and system administration commands. In addition to that, it also covers file formats,
    programming interfaces, and much more. See the complete layout of the manual as
    under:


    - The number 1 section of the `man` command will display user commands.

    - The number 2 section of the `man` command will display programming interfaces
    for the kernel system calls.

    - The number 3 section of the `man` command will display programming interfaces
    to the C library.

    - The number 4 section of the `man` command will display special files such as
    the device nodes and the drivers.

    - The number 5 section of the `man` command will display formats of the files.

    - The number 6 section of the `man` command will display the details of games
    and entertainment like screensavers.

    - The number 7 section of the `man` command will display miscellaneous items.

    - The number 8 section of the `man` command will display the commands related
    to system administration.


    At times, you may need to look into a specific section of a manual to find out
    what you are looking for. If you do not specify a section number, you will always
    get the very first instance of a specific match in section 1.


    ### The apropos command


    It is possible to search the list of man pages for some possible matches based
    on a specific search term. This crude approach is often helpful. The syntax is
    as under:


    ```bash

    [gha@localhost ~] apropos floppy

    ```


    ### The whatis command


    The `whatis` command in Linux operating displays the name and a short description
    of a man page. The syntax is as under:


    ```bash

    [gha@localhost ~] whatis ls

    ```


    The man pages that come with a Linux distribution system are labeled as a reference
    documentation instead of a tutorial. A number of man pages are tough to read,
    so tough that a majority of us skip them right away without giving them a second
    glance. However, the most difficult of the man pages are of `bash`. They are long,
    complicated, and almost unreadable. However, their length becomes their strength
    as they contain plenty of useful information for you to add to your knowledge.
    When you have gone through one page, it will start making sense to you.


    ### The info command


    The GNU project provides info pages as an alternative option to the man pages.
    A reader program called `info` displays these pages, and these are hyperlinked
    in the same way web pages are. For example:


    ```bash

    [gha@localhost ~] info ls

    ```


    Next: dir invocation, Up: Directory listing


    10.1 ‘ls’: List directory contents


    ==================================


    In the `ls` program, you will find information about files of any type, and that
    includes directories. As usual, arbitrary mixing of options ad file arguments
    is accepted.


    By default, `ls` will list the contents of non-option command-line arguments that
    are also directories, but this is not a recursive list, and files starting with
    `.` are left out.


    The `info` program will read the info files – these are structures that go into
    individual nodes, each containing one topic. Hyperlinks in the info files help
    users move between the nodes, and these hyperlinks are identified by a leading
    asterisk. Typically, activating these hyperlinks requires the user to click them
    with the cursor and press Enter. The `info` command provides this information:


    - The `?` key in the info menu will display the command help.

    - The `Page up` or `Backspace` keys in the info menu will display the previous
    page.

    - The `Page down` or `Spacebar` keys in the info menu will display the succeeding
    page.

    - The `n` key in the info menu will display the next node in the menu.

    - The `p` key in the info menu will display the previous node in the menu.

    - The `u` key in the info menu will display the parent node of the node that is
    presently on display.

    - The `Enter` key in the info menu will allow you to follow the hyperlink at the
    cursor''s present location.

    - The `q` key in the info menu will allow you to quit the menu.


    # Chapter Five: Redirection Commands & Keyboard Tricks with Linux Commands


    In this chapter, we will talk about the coolest feature of the command line, which
    is called I/O redirection. The I/O stands for input/output. With this facility,
    you may redirect the input and output of commands and connect multiple commands
    to make a powerful command known as pipelines.


    The output of a program is of two types. First, you have the result of the program
    which contains the data program produces. Secondly, there are status and error
    messages that instruct you how the program is getting along. If you look at the
    command `ls`, you will see that it delivers results and error messages on your
    screen.


    This program sends the output to another file called standard error. Both standard
    error and output are connected to the screen, and they are saved into a disk file.
    Many programs take input from a facility known as standard input `stdin`, which
    is attached to a keyboard.


    I/O redirection allows you to change where the output goes and where the input
    flows in from. Usually, output goes to the screen, and the input flows in from
    the keyboard in Linux; I/O has the power to change that.


    ## Redirection


    I/O redirection helps you in redefining the direction of the output. To redirect
    the standard output to a file instead of the screen, you have to use the redirection
    operator that is followed by the name of the file. It is useful more often to
    store the output of a certain command inside a file. You may tell the shell to
    direct the `ls` command''s output to a file named `ls-output.txt` instead of the
    screen.


    ```bash

    [gha@localhost ~] ls -1 /usr/bin > ls-pt.txt

    ```


    I have created a long listing of `/usr/bin` directory and then sent the results
    to the file `ls-pt.txt`.


    ## Keyboard Tricks


    Unix is an operating system for people who love to type. The command line does
    not allow a mouse to operate. Linux commands can be exhaustive, therefore, you
    should learn a bunch of keyboard tricks.


    ### Text Modification


    The following list shows how you can modify text in the Linux command line. The
    terms killing and yanking refer to cutting and pasting, respectively.


    - The keyboard trick `CTRL-D` will help you delete the character that is at the
    present position of the cursor.

    - The keyboard trick `CTRL-T` will help you transpose the character at the present
    location of the location with the one that is preceding it.

    - The keyboard trick `Alt-U` will help you convert into uppercase the characters
    from the cursor''s present position to the ending point of the word.

    - The keyboard trick `Alt-L` will help you convert into lowercase the characters
    from the cursor''s present position to the ending point of the word.

    - The keyboard trick `Alt-T` will help you transpose the words at the cursor''s
    present position with the preceding one.

    - The keyboard trick `CTRL-K` will help you kill text from the cursor''s present
    position to the ending point of a line.

    - The keyboard trick `CTRL-U` will help you kill text from the cursor''s present
    position to the starting point of a line.

    - The keyboard trick `ALT-D` will help you kill text from the cursor''s present
    position to the end of a current word.

    - The keyboard trick `ALT-Backspace` will help you kill text from the cursor''s
    present position to the starting point of the current word. If the cursor is presently
    at the start of a word, it will also kill the previous word.

    - The keyboard trick `CTRL-Y` will help you yank text from the kill-ring and paste
    it at the cursor''s present position.


    ## Completion Commands

