    \nThe first test command displays the present value of `var15` variable. The second\
    \ command will use the test command to know the value of `var15` variable. The\
    \ `echo` statement returns a simple message within the loop that indicates that\
    \ the loop has runs its course.\n\n### The until Command\n\nThe `until` command\
    \ works opposite to the `while` command. It requires a simple test command is\
    \ specified, which will produce a non-zero exit status, at which point the bash\
    \ shell will execute the `while` loop commands.\n\nHowever, similar to the `while`\
