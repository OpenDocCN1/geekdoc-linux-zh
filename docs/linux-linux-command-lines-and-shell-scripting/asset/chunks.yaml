- fmt: '

    When the emacs editor is started from the command line, it determines whether
    an active X Window session is present and starts in graphical mode. The console
    mode version uses multiple commands that you need to learn to edit a program.
    Certain key combinations are required using the `CTRL` and `Meta` keys on the
    keyboard. Typically, the `Meta` key is mapped to a PC’s `ALT` key, although this
    may not be the case on all systems. Abbreviations are used – `CTRL` is abbreviated
    as `C-` and `Meta` as `M-`.


    ### Basic Commands of emacs Editor


    To edit an emacs file from the command line, the following command is required:


    ```

    emacs myfile.c

    ```


    When the emacs console window is opened, you see a short introduction and a help
    screen. When a key is hit, a file is loaded in the buffer, and the text is displayed.
    You see a standard menu bar at the top of the window, but this cannot be used
    while in console mode, only in graphical mode. Unlike the `vim` editor, the emacs
    editor has a single mode, where you move into and out of insert mode to flick
    between inserting commands and text. When you type printable characters, emacs
    will insert them at the cursor’s current position, and when a command is typed,
    it is executed. To move the cursor around the buffer, the arrow keys and the `PageUp`
    and `PageDown` keys are required. Other commands needed to move the cursor include:


    * You can use the `C-p` command to move up the previous line in the text.

    * You can use the `C-n` command to move down the next line in the text.

    * You can use the `C-b` command to move back or to the left side by one character.

    * You can use the `C-f` command to move forward or to the right side by one character.


    If you are looking forward to making longer jumps, you can use the following commands:


    * You can use the `M-f` command to move to the right side onto the next word.

    * You can use the `M-b` command to move to the left side, back to the previous
    word.

    * You can use the `M-a` command to move to the start of the present sentence.

    * You can use the `M-e` command to move to the ending point of the present sentence.

    * You can use the `C-e` command to move to the ending point of the present sentence.

    * You can use the `C-a` command to move to the starting point of the present sentence.

    * You can use the `M->` command to move to the ending line of the text.

    * You can use the `M-<` command to move to the starting line of the text.

    * You can use the `M-v` command to move back by a single screen of the data.

    * You can use the `C-v` command to move forward by a single data screen.


    You can save the editor buffer as a file and exit the emacs editor using the following
    commands:


    * You can use the `C-x C-s` command to save what you have written in the current
    buffer into a file.

    * You can use the `C-x C-c` command to exit the emacs editor and stop the operations
    of the editor.

    * You can use the `C-z` command to exit the emacs editor. However, the command
    does not keep the session running, so that you may come back to that.


    ### Editing Data


    The emacs editor is powerful in terms of inserting and deleting text. Inserting
    text simply requires that you move your cursor to where you want the text inserted
    and type the text. The backspace key is used to delete the character immediately
    before the cursor’s position to delete text. The delete key is also used to delete
    the character at the cursor’s position.


    The editor also offers options for killing text; the difference between deleting
    and killing text is that when text is killed, it is placed into a temporary area
    and can be retrieved at any time, whereas deleted text is permanently removed.
    Emacs offers the following commands to kill text:


    * You can use the `M-Backspace` command to kill a word before the present position
    of the cursor.

    * You can use the `M-k` command to kill everything from the cursor''s present
    position to the ending point of the sentence.

    * You can use the `M-D` command to kill a word after the present position of the
    cursor.

    * You can use the `C-k` command to kill everything from the cursor''s present
    position to the ending point of the line.


    You can also kill text on a large scale by moving the cursor to the beginning
    of the section you want to be killed, pressing `C-spacebar` or `C-@`, and placing
    the cursor at the end of the section. Then press `C-w`, and all the indicated
    text is killed.


    ## Popular Linux Commands


    There are far too many Linux commands to discuss in any detail but we have covered
    some of the most common. If you want to know what any Linux command does, simply
    access their manual page using the syntax below and the name of the command:


    ```

    man command-name

    ```


    The table below shows you many more commands, with their syntax and a description
    of what they do:


    | Command | Syntax | Description |

    | :--- | :--- | :--- |

    | adduser/addgroup | `$ sudo adduser` `$ sudo addgroup` | These two commands add
    users or groups respectively to the system |

    | agetty | `$ agetty -L 9600 ttyS1 vt100` | A program managing virtual and physical
    terminals. Invoked by `init`, it opens a `tty` port when a connection is made
    |

    | alias | `$ alias home=''cd` | Creates a shortcut or alias to a specific Linux
    command on the user’s system |

    | apropos | `$ apropos adduser` | Searches and displays a command or program’s
    man page description |

    | apt | `$ sudo apt update` | High-level package manager for Ubuntu and Debian
    systems |

    | apt-get | `$ sudo apt-get update` | Used to install, remove and upgrade software
    packages and upgrade the operating system |

    | aptitude | `$ sudo aptitude update` | Text-based GNU/Linux package manager system
    used for installing or removing packages |

    | arch | `$ arch` | Displays the machine hardware or architecture name |

    | arp | `$ sudo arp-scan --` | ARP maps IP network addresses to MAC addresses
    – this command all live hosts on a specified network |

    | at | `$ sudo echo` | Schedules tasks to be executed at a future specified time
    |

    | atq | `$ atq` | Used for viewing jobs queued in the `at` command |

    | atrm | `$ atrm (job number)` | Used for deleting jobs from the `at` command
    queue by their job number |

    | awk | `$ awk ''` | Program created for processing text and as a reporting and
    data extraction tool |

    | basename | `$ basename bin/findhosts.sh` | Prints a file name from stripped
    of directories in the absolute path |

    | bc | `$ echo 20.05 + 15.00 | bc` | Powerful, recuses CLI calculator language
    – see example under syntax |

    | bzip2 | `$ bzip2 -z filename` #Compress$ bzip2 -d filename.bz2` #Decompress
    | Compresses or decompresses specified files |

    | cal | `$ cal` | Prints a calendar |

    | cat | `$ cat file.txt` | View file contents, concatenate files or data and display
    it |

    | chgrp | `$ chgrp (new) (old)` | Changes a file’s group ownership. New name is
    provided first with the existing one second |

    | chmod | `$ chmod` | Changes or updates access permissions for specified files
    |

    | chown | `$ chown` | Changes or updates group and user ownership of directories
    or files |

    | cksum | `$ cksum` | Displays an input file’s byte count and CRC checksum |

    | clear | `$ clear` | Clears terminal screen |

    | cmp | `$ cmp file1 file2` | Compares two files byte-by-byte |

    | comm | `$ comm file1 file2` | Compares sorted files on a line-by-line basis
    |

    | cp | `$ cp` | Copies directories and files from place to another – locations
    must be specified |

    | date | `$ date` | Displays and sets system time and date |

    | df | `$ df -h` | Displays the disk space usage on a specified file system |

    | diff | `$ diff file1 file2` | Compares specified files line-by-line and can
    also find and locate differences between directories |

    | dir | `$ dir` | Similar to `ls` command, it lists directory contents |

    | dmidecode | `$ sudo dmidecode` | Retrieves information about a Linux system’s
    hardware |

    | du | `$ du` | Shows how files use disk space in a directory and related sub-directories
    |

    | echo | `$ echo` | Takes a specified line of text and prints it |

    | eject | `$ eject` | Ejects DVD, CD ROM, and other removeable media |

