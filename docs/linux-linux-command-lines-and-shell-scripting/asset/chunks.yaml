  trans: '


    如果你通过 GNOME 编辑器操作 Linux 系统，你将看到一个易用且出色的图形化文本编辑器。它是一个基础文本编辑器，包含了一些高级功能以增加编辑的趣味性。当你使用多个文件启动
    `gedit` 时，它会将这些文件加载到各个缓冲区中，并将每个文件都作为一个标签页窗口显示在编辑器的主窗口内。`gedit` 编辑器内部的左侧框（frame）将显示你正在编辑的文档。


    ### 编辑器的基本功能


    除了编辑窗口外，`gedit` 还使用了菜单栏和工具栏，允许你设置配置和功能选项。工具栏提供了对菜单栏项的某些快速访问，具体如下：


    * `File`（文件）菜单项可以帮助你加载新文件、保存现有文件，并打印来自不同文件的不同文本。

    * `Edit`（编辑）帮助你操作缓冲区中的文本，并设置编辑器偏好。

    * `View`（视图）帮助你设置与显示相关的编辑器功能。它也用于设置文本高亮模式。

    * `Search`（搜索）帮助你在编辑器的活动缓冲区区域查找并替换文本片段。

    * `Tools`（工具）用于访问安装在 `gedit` 中的插件工具。

    * `Documents`（文档）帮助你管理在缓冲区区域打开的不同文件。

    * `Help`（帮助）将为你提供关于编辑器及其命令的信息。你将看到一份完整的手册，教你如何使用编辑器以及配合命令。


    ### 偏好


    `Edit` 菜单提供了 `Preferences`（偏好）项，允许你自定义编辑器的操作。`Preferences` 对话框带有标签页区域，允许你根据需求设置编辑器的功能。


    ### 视图


    `View` 标签页提供了许多在编辑器窗口中显示文本的选项。


    * 你在 `View` 标签页找到的第一个选项名为 `Text Wrapping`（换行）。它决定了你如何处理编辑器中的长文本。当启用此选项时，长文本将折行到编辑器的下一行。`Do
    Not Split Words Over Two Lines`（单词不跨行拆分）选项将阻止在长单词中自动插入连字符，以防止单词在两行之间断开。

    * 你在 `View` 标签页找到的第二个选项名为 `Line Numbers`（行号）。此选项会在编辑器窗口的左侧边距显示行号。

    * 你在 `View` 标签页找到的第三个选项名为 `Current Line`（当前行），用于高亮光标所在的行。这让你能够轻松找到光标位置。

    * 你在 `View` 标签页找到的第四个选项名为 `Right Margin`（右边距），启用右边距。此选项还允许你设置编辑器窗口的列数。列数的默认值为
    `80`。

    * 你在 `View` 标签页找到的第五个选项名为 `bracket matching`（括号匹配）。启用此选项后，当你编写 `if-then` 语句、`for`
    循环或 `while` 循环以及任何涉及括号的代码行时，可以轻松匹配括号。


    行编号和括号匹配为用户提供了一个方便的环境。这有助于故障排除，在许多其他文本编辑器中并不常见。


    ### 编辑器标签


    `Editor` 标签页提供了处理缩进和制表符的选项。它还负责编辑后的保存文档。


    * `Editor` 标签页中的 `Tab Stops`（制表符）选项允许你设置按下 `Tab` 键时应跳过的空格数。默认跳过值为 `8`。你可以重置它。该功能还有一个复选框，用于插入空格而非制表符空格。

    * 你在 `Editor` 标签页找到的第二个选项名为 `Automatic Indentation`（自动缩进）。启用后，`gedit` 会自动处理文本中代码元素和段落（如
    `if-then` 语句和循环）的行缩进。

    * 你在 `Editor` 标签页找到的第三个选项名为 `File Saving`（文件保存），提供了两个保存功能。你可以选择为编辑窗口中打开的文件创建备份。还可以设置是否按预设间隔保存文件。


    #### 字体与颜色


    `Font & Colors`（字体与颜色）选项提供了两个项目的配置。


    * `Font & Colors` 标签页中的 `Font`（字体）选项允许你选择 `Monospace 10` 作为默认字体，或从对话框中选择自定义字体样式和大小。

    * `Font & Colors` 标签页中的 `Colors`（颜色）选项允许你选择用于文本、选中文本、背景和选择色的默认配色方案。它用于为列表不同类别选择自定义颜色。


    默认颜色与桌面选用的 `GNOME` 标准桌面主题匹配。当你选择不同的颜色时，这些颜色会随桌面主题而改变。


    ### 语法高亮


    `Syntax Highlighting`（语法高亮）标签页提供了 `gedit` 在编程模式下高亮不同元素的配置选项。`gedit` 编辑器具有检测文件中存在编程语言的能力。它允许你通过选择喜爱的颜色来自定义高亮功能。对于脚本，你可以选择特定的配色方案。


    ## 插件


    插件页控制 `gedit` 中使用的插件。插件是与 `gedit` 接口的独立程序，可提供额外功能。`gedit` 有许多插件可用，但并非所有都是默认安装的。启用的插件会在名称旁边显示勾选。像
    `External Tools` 这样的插件在你选择后会提供一些附加功能。你可以设置快捷键来启动显示输出的终端。


