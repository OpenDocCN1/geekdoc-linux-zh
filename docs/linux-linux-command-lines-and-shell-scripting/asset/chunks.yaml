  trans: '


    在大多数 Linux 操作系统中，`man` 使用 `less` 来显示手册页，这样在页面显示时，所有熟悉的 `less` 命令都可以使用。`man` 显示的手册有不同的章节，涵盖了用户命令和系统管理命令。此外，它还涵盖了文件格式、编程接口等更多内容。手册的完整布局如下：


    - `man` 命令的第 1 节将显示用户命令。

    - `man` 命令的第 2 节将显示内核系统调用的编程接口。

    - `man` 命令的第 3 节将显示 C 库的编程接口。

    - `man` 命令的第 4 节将显示设备节点和驱动程序等特殊文件。

    - `man` 命令的第 5 节将显示文件格式。

    - `man` 命令的第 6 节将显示游戏和屏幕保护等详情。

    - `man` 命令的第 7 节将显示杂项。

    - `man` 命令的第 8 节将显示与系统管理相关的命令。


    有时，你可能需要查看手册的特定章节以找到你正在寻找的内容。如果你没有指定章节号，你始终将获得第 1 节中特定匹配的实例。


    ### apropos 命令


    你可以根据特定的搜索术语在手册页列表中搜索可能的匹配项。这种粗略的方法通常很有用。语法如下：


    ```bash

    [gha@localhost ~] apropos floppy

    ```


    ### whatis 命令


    Linux 中的 `whatis` 命令显示手册页的名称和简短描述。语法如下：


    ```bash

    [gha@localhost ~] whatis ls

    ```


    随 Linux 发行版自带的手册页被标记为参考文档而非教程。许多手册页非常难读，以至于我们大多数人会直接跳过它们，而不多看一眼。然而，最难的手册页是 `bash`
    的。它们冗长、复杂且几乎不可读。但是，它们的长度也是它们的优势，因为它们包含了许多你可以增加自己知识的有用信息。当你读完一页后，它将开始对你产生意义。


    ### info 命令


    GNU 项目提供了 info 页面作为手册页的替代方案。一个名为 `info` 的读取程序显示这些页面，这些页面以类似于网页的方式进行超链接。例如：


    ```bash

    [gha@localhost ~] info ls

    ```


    Next: dir invocation, Up: Directory listing


    10.1 ‘ls’: List directory contents


    ==================================


    在 `ls` 程序中，你将找到关于任何类型文件的信息，包括目录。一如往常，它接受选项和文件参数的任意混合。


    默认情况下，`ls` 将列出非选项命令行参数的内容（如果这些参数也是目录），但这不是递归列表，以 `.` 开头的文件会被排除在外。


    `info` 程序将读取 info 文件——这些是进入单个结的结构，每个节点包含一个主题。info 文件中的超链接帮助用户在节点之间移动，这些超链接通过开头的星号来标识。通常情况下，激活这些超链接需要用户用光标点击它们并按回车键。`info`
    命令提供了这些信息：


    - info 菜单中的 `?` 键将显示命令帮助。

    - info 菜单中的 `Page up` 或 `Backspace`（退格）键将显示上一页。

    - info 菜单中的 `Page down` 或 `Spacebar`（空格）键将显示下一页。

    - info 菜单中的 `n` 键将显示菜单中的下一个节点。

    - info 菜单中的 `p` 键将显示菜单中的上一个节点。

    - info 菜单中的 `u` 键将显示当前显示节点的父节点。

    - info 菜单中的 `Enter`（回车）键允许你跟随光标当前位置的超链接。

    - info 菜单中的 `q` 键允许你退出菜单。


    # 第五章：重定向命令与 Linux 命令的键盘技巧


    在本章中，我们将讨论命令行中最酷的功能，称为 I/O 重定向。I/O 代表输入/输出（input/output）。通过这项功能，你可以重定向命令的输入和输出，并连接多个命令以形成被称为管道的强大命令。


    程序的输出分为两种类型。首先是程序的运行，包含了程序产生的数据。其次是状态和错误消息，指示你程序的运行如何。如果你查看 `ls` 命令，你会看到它在屏幕上交付结果和错误消息。


    此程序将输出发送到另一个名为标准错误（standard error）的文件。标准错误和输出都连接到屏幕，并保存到磁盘文件中。许多程序从被称为标准输入 `stdin`
    的设施获取输入，该设施连接到键盘。


    I/O 重定向允许你更改输出的去向和输入的流向。通常情况下，在 Linux 中，输出到屏幕，输入从键盘流入；I/O 具有改变这种状态的能力。


    ## 重定向


    I/O 重定向帮助你重新定义输出的方向。要将标准输出重定向到文件而不是屏幕，你需要使用重定向运算符，其后跟着文件名。将特定命令的输出存储在文件中很有用。你可以告诉
    shell 将 `ls` 命令的输出重定向到名为 `ls-output.txt` 的文件而不是屏幕。


    ```bash

    [gha@localhost ~] ls -1 /usr/bin > ls.txt

    ```


    我创建了 `/usr/bin` 目录的长列表并发送到了文件。


    ## 键盘技巧


    Unix 是为喜欢打字的人设计的操作系统。命令行不允许使用鼠标操作。Linux 命令可能非常消耗，因此你应该学习一些键盘技巧。


    ### 文本修改


    以下列表显示了你如何在命令行中修改文本。“杀死”（killing）和“取回”（yanking）分别指剪切和粘贴。


    - 键盘技巧 `CTRL-D` 将帮助你删除光标所在位置的字符。

    - 键盘技巧 `CTRL-T` 将帮助你转置当前位置字符与前一个字符的位置。

    - 键盘技巧 `Alt-U` 将帮助将光标当前位置到单词结尾的字符转换为全大写。

    - 键盘技巧 `Alt-L` 将帮助将光标当前位置到单词结尾的字符转换为小写。

    - 键盘技巧 `Alt-T` 将帮助转置光标当前位置单词与前一个单词的位置。

    - 键盘技巧 `CTRL-K` 将帮助杀死从光标当前位置到行尾的文本。

    - 键盘技巧 `CTRL-U` 将帮助杀死从光标当前位置到行首的文本。

    - 键盘技巧 `Alt-D` 将帮助杀死从光标当前位置到当前单词结尾的文本。

    - 键盘技巧 `Alt-Backspace`（删除退格）将帮助杀死从光标当前位置到当前单词开头的文本。如果光标当前位于单词开头，它还会杀死上一个单词。

    - 键盘技巧 `CTRL-Y` 将帮助从剪切环中取回文本并粘贴到光标当前位置。


