- fmt: "\nThis is a self-explanatory example, so I won't go into too much detail.\
    \ You can play around and change the variable names or their values to see how\
    \ they function.\n\n## How to Use the Switch Construct\n\nThis is another very\
    \ powerful construct in Linux scripts, and you can use it when you need to use\
    \ nested conditions, but you don't want to write complicated of-else-elif chains.\
    \ Here is an example of how it works.\n\n```bash\n#!/bin/bash\n\necho -n \"Enter\
    \ a number: \"\n\nread num\n\ncase $num in\n\n100)\necho \"Hundred!!\" ;;\n200)\n\
    echo \"Double Hundred!!\" ;;\n*)\necho \"Neither 100 nor 200\" ;;\nesac\n```\n\
    \nThe conditions go in between two keywords – `case` and `esac`. And we use `*`\
    \ to match all the inputs that are not `100` or `200`.\n\n## How to Use Command\
    \ Line Arguments\n\nThere are several reasons why you might want to get an argument\
    \ straight from the command shell, and the next example demonstrates how you do\
    \ this using bash shell:\n\n```bash\n#!/bin/bash\n\necho \"Total arguments : $#\"\
    \necho \"First Argument = $1\"\necho \"Second Argument = $2\"\n```\n\nRun the\
    \ script with an extra two parameters following the name. The script is saved\
    \ as `test.sh`, and you can see the calling procedure here:\n\n`$ ./test.sh Hey\
    \ Howdy`\n\n`$1` accesses the first argument while `$2` does the second and so\
    \ on. We use `$#` to get the total argument number.\n\n## How to Use Names to\
    \ Get Arguments\n\nThe next example demonstrates how you can use their names to\
    \ get the command line arguments:\n\n```bash\n#!/bin/bash\n\nfor arg in \"$@\"\
    \ndo\nindex=$(echo $arg | cut -f1 -d=)\nval=$(echo $arg | cut -f2 -d=)\ncase $index\
    \ in\nX) x=$val;;\nY) y=$val;;\n*)\nesac\ndone\n\n((result=x+y))\necho \"X+Y=$result\"\
    \n```\n\nSave and call this script `test.sh` and call it like this:\n\n`$ ./test.sh\
    \ X=44 Y=100`\n\nYou should see a return of `X+Y=144`. We store the arguments\
    \ in `$@` and then use the `cut` command in Linux to get them.\n\n## How to Concatenate\
    \ Strings\n\nMany modern shell scripts use string processing and one of the most\
    \ common methods is string concatenation. Bash makes this easy and precise and\
    \ the example below shows you how it works:\n\n```bash\n#!/bin/bash\n\nstring1=\"\
    Ubuntu\"\nstring2=\"Pit\"\nstring=$string1$string2\necho \"$string is a fantastic\
    \ Linux resource for beginners.\"\n```\n\nRunning this should give you an output\
    \ of \"UbuntuPit is a great Linux Resource for Beginners.\".\n\n## How to Slice\
    \ Strings\n\nMost programming languages provide ready-made functions, but Bash\
    \ can also slice strings. The following example shows how to do it:\n\n```bash\n\
    #!/bin/bash\n\nstring=\"Ubuntu\"\necho ${string:0:6}\necho ${string:6}\n```\n\n\
    The output will be `Ubuntu` and `Pit`.\n\n## How to Use Cut to Extract Substrings\n\
    \nThe `cut` command is often used to extract parts of a string. The following\
    \ example shows how to use it:\n\n```bash\n#!/bin/bash\n\nstring=\"name=value\"\
    \nname=$(echo $string | cut -d= -f1)\nvalue=$(echo $string | cut -d= -f2)\necho\
    \ \"Name is $name and value is $value\"\n```\n\n## How to Add Two Values\n\nArithmetic\
    \ operations in Bash are straightforward. The following example shows how to add\
    \ two numbers:\n\n```bash\n#!/bin/bash\n\nx=10\ny=20\nsum=$((x + y))\necho \"\
    Sum is $sum\"\n```\n\n## How to Add Multiple Values\n\nIf you want to add multiple\
    \ values, you can use a loop. Here is an example:\n\n```bash\n#!/bin/bash\n\n\
    sum=0\nfor arg in \"$@\"\ndo\n    sum=$((sum + arg))\ndone\necho \"Total sum is\
    \ $sum\"\n```\n\n## Functions\n\nFunctions allow you to organize your code into\
    \ reusable blocks. This example shows how to define and call a function:\n\n```bash\n\
    #!/bin/bash\n\ngreet() {\n    echo \"Hello, $1!\"\n}\n\ngreet \"World\"\n```\n\
    \n## Functions with Return Values\n\nFunctions can return values using the `return`\
    \ command, although this is typically used for exit statuses. For returning data,\
    \ we use `echo`:\n\n```bash\n#!/bin/bash\n\nget_sum() {\n    echo $(($1 + $2))\n\
    }\n\nresult=$(get_sum 5 10)\necho \"The result is $result\"\n```\n\n## Directories\n\
    \nThe `mkdir` command is used to create directories. Here is how to use it in\
    \ a script:\n\n```bash\n#!/bin/bash\n\ndir_name=\"my_directory\"\nmkdir $dir_name\n\
    echo \"Directory $dir_name created.\"\n```\n\n## How to Create a Directory After\
    \ Checking Existence\n\nIt is good practice to check if a directory exists before\
    \ creating it:\n\n```bash\n#!/bin/bash\n\necho -n \"Enter directory name: \"\n\
    read dir\n\nif [ -d \"$dir\" ]; then\n    echo \"Directory $dir already exists.\"\
    \nelse\n    mkdir \"$dir\"\n    echo \"Directory $dir created.\"\nfi\n```\n\n\
    ## How to Read Files\n\nReading files is a common task. First, create a file named\
    \ `test.txt` with some content. Then:\n\n```bash\n#!/bin/bash\n\nfile=\"test.txt\"\
    \nwhile read -r line; do\n    echo \"Line: $line\"\ndone < \"$file\"\n```\n"
  raw: 'This is a self-explanatory example, so I won''t go into too much detail. You
    can play around and change the variable names or their values to see how they
    function.


    How to Use the Switch Construct


    This is another very powerful construct in Linux scripts, and you can use it when
    you need to use nested conditions, but you don''t want to write complicated of-else-elif
    chains. Here is an example of how it works.


    #!/bin/bash


    echo -n "Enter a number: "


    read num


    case $num in


    100)


    echo "Hundred!!" ;;


    200)


    echo "Double Hundred!!" ;;


    *)


    echo "Neither 100 nor 200" ;;


    esac


    The conditions go in between two keywords – case and esac. And we use *) to match
    all the inputs that are not 100 or 200.


    How to Use Command Line Arguments


    There are several reasons why you might want to get an argument straight from
    the command shell, and the next example demonstrates how you do this using bash
    shell:


    #!/bin/bash


    echo "Total arguments : $#"


    echo "First Argument = $1"


    echo "Second Argument = $2"


    Run the script with an extra two parameters following the name. The script is
    saved as test.sh, and  you can see the calling procedure here:


    $ ./test.sh Hey Howdy


    $1 accesses the first argument while $2 does the second and so on. We use $# to
    get the total argument number.


    How to Use Names to Get Arguments


    The next example demonstrates how you can use their names to get the command line
    arguments:


    #!/bin/bash


    for arg in "$@"


    do


    index=$(echo $arg | cut -f1 -d=)


    val=$(echo $arg | cut -f2 -d=)


    case $index in


    X) x=$val;;


    Y) y=$val;;


    *)


    esac


    done


    ((result=x+y))


    echo "X+Y=$result"


    Save and call this script test.sh and call it like this:


    $ ./test.sh X=44 Y=100


    You should see a return of X+Y=144\. We store the arguments in ''S@'' and then
    use the cut command in Linux to get them.


    How to Concatenate Strings


    Many modern shell scripts use string processing and one of the most common methods
    is string concatenation. Bash makes this easy and precise and the example below
    shows you how it works:


    #!/bin/bash


    string1="Ubuntu"


    string2="Pit"


    string=$string1$string2


    echo "$string is a fantastic Linux resource for beginners."


    Running this should give you an output of "UbuntuPit is a great Linux Resource
    for Beginners.:


    How to Slice Strings


    Most programming languages provide ready-made functions to help you cut parts
    of a string. Bash doesn''t but the example below shows how to do it with a parameter
    expansion:


    #!/bin/bash


    Str="Learn the Bash Commands from UbuntuPit"


    subStr=${Str:0:20}


    echo $subStr


    Running this script should result in "Learn the Bash Commands" as an output. The
    parameter expansion is the form of ${VAR_NAME:S:L} with S denoting the start of
    the slice and L indicating how long the slice should be.


    How to Use Cut to Extract Substrings


    Linux has a command called cut that you can use in your scripts to cut a part
    out of the string – this is the substring and the next example demonstrates how
    this works:


    #!/bin/bash


    Str="Learn the Bash Commands from UbuntuPit"


    #subStr=${Str:0:20}


    subStr=$(echo $Str| cut -d '' '' -f 1-3)


    echo $subStr


    How to Add Two Values


    Arithmetic operations are easy to do in a Linux shell script. You can see from
    the example below how two numbers are taken as an input and added together:


    #!/bin/bash


    echo -n "Enter the first number:"


    read x


    echo -n "Enter the second number:"


    read y


    (( sum=x+y ))


    echo "The result of the addition=$sum"


    You can see from this that it is quite straightforward to add two numbers in the
    bash shell.


    How to Add Multiple Values


    If you want to get multiple user inputs in your script and add them, you would
    use loops. The next example shows how this is done:


    #!/bin/bash


    sum=0


    for (( counter=1; counter<5; counter++ ))


    do


    echo -n "Enter the Number:"


    read n


    (( sum+=n ))


    #echo -n "$counter "


    done


    printf "\n"


    echo "Result is: $sum"


    If you do not include the (()), you wont get an addition operation. Instead it
    will be concatenation so make sure you double check your script before executing
    it.


    Bash Functions


    All computer programming languages rely on functions and the Linux Shell script
    is no exception. Functions allow you to create blocks of code that you need to
    use frequently, rather than writing the same code repeatedly. In the next demonstration,
    you can see how these functions work in bash scripts:


    #!/bin/bash


    function Add()


    {


    echo -n "Enter a Number: "


    read x


    echo -n "Enter another Number: "


    read y


    echo "Addition is: $(( x+y ))"


    }


    Add


    What we did here was added two numbers but, unlike the previous addition example,
    this time we used a function named Add. Whenever you need to do an addition calculation
    again, you can simply call the function.


    Functions with Return Values


    One of the best things about functions is that you can use them to pass data between
    functions. This is useful in lots of different scenarios, so take a look at the
    next example to see how it works:


    #!/bin/bash


    function Greet() {


    str="Hello $name, what brings you to UbuntuPit.com?"


    echo $str


    }


    echo "-> what''s your name?"


    read name


    val=$(Greet)


    echo -e "-> $val"


    The output will show data coming from the function called Greet.


    How to Use Bash Scripts to Create Directories


    One way that developers can increase their productivity is to use shell scripts
    to run system commands. The next example is a simple one demonstrating how directories
    are created in a shell script:


    #!/bin/bash


    echo -n "Enter directory name ->"


    read newdir


    cmd="mkdir $newdir"


    eval $cmd


    Take a close look at this script and you will see that it does nothing more than
    call a shell command named mkdir and passing the directory name to it. The result
    should be a new directory created in your filesystem. The execution command can
    also be passed inside backticks (") as you can see below:


    `mkdir $newdir`


    How to Create a Directory After Checking For Existence


    The program we created above won''t work if there is a folder named the same in
    the current working directory. Instead, we need to check if there is a folder
    called $dir first and, if there isn''t we can create one. Here''s how it''s done:


    #!/bin/bash


    echo -n "Enter the directory name ->"


    read dir


    if [ -d "$dir" ]


    then


    echo "The directory exists"


    else


    `mkdir $dir`


    echo "Directory created"


    fi


    If you want to improve your bash scripting skills, write the above program using
    eval.


    How to Read Files


    Bash scripts offer an effective way of reading files. The example below demonstrates
    how to use shell scripts to read a file. First create a new file and name it editors.txt,
    make it executable and add the following:


    1\. Vim


    2\. Emacs


    3\. ed


    4\. nano


    5\. Code


    This code will result in the five lines being printed on your screen.


    #!/bin/bash


    file=''editors.txt''


    while read line; do


    echo $line


    done < $file


    How to Delete Files


    In the next program, we will look at how files are deleted within a shell script.
    First, the program asks the user for input in the form of the filename. If it
    exists, the file will be deleted. In this example, the rm command is used for
    the deletion:


    #!/bin/bash


    echo -n "Enter the filename ->"


    read name


    rm -i $name


    Where it asks for the filename, type in editors.txt and, when you are asked to
    confirm it, press the Y key. The file should be deleted.


    How to Append to Files


    The next shell example shows you how to use bash scripts to append data to one
    of your filesystem files. This will add an extra line into the editors.txt file:


    #!/bin/bash


    echo "Before you append the file"


    cat editors.txt


    echo "6\. NotePad++" >> editors.txt


    echo "After you append the file"


    cat editors.txt


    By now, you should have noticed that standard terminal commands are being used
    from the bash scripts.


    How to Test For File Existence


    In the next example, we can see how to use bash programs to find out if a file
    exists:


    #!/bin/bash


    filename=$1


    if [ -f "$filename" ]; then


    echo "File exists"


    else


    echo "File does not exist"


    fi'
