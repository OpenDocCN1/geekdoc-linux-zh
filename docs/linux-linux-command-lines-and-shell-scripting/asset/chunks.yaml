    \n循环继续到最后一行：\n\nThis is 1 in the while loop.\n```\n\n## 多重测试命令\n\n你可以在 `while`\
    \ 循环中封装多个测试命令。\n\n```bash\n$ cat test1133\n\n#!/bin/bash\n\n# 现在我正在 Linux shell\
    \ 中测试多命令 while 循环\n\nvar15=20\n\nwhile echo $var15\n\n[ $var15 -ge 0 ]\n\ndo\n\
    \necho \"This operation is being conducted inside the while loop.\"\n\nvar15=$[\
    \ $var15 - 1 ]\ndone\n\n$bash -f main.sh\n\n20\nThis operation is being conducted\
    \ inside the while loop.\n19\nThis operation is being conducted inside the while\
    \ loop.\n18\nThis operation is being conducted inside the while loop.\n17\n\n\
    这将持续到达到最后一个数字：\n\nThis operation is being conducted inside the while loop.\n0\n\
    This operation is being conducted inside the while loop.\n-1\n```\n\n第一个测试命令显示\
    \ `var15` 变量的当前值。第二个命令将使用测试命令来获取 `var15` 变量的值。\n\n### until 命令\n\n`until` 命令的作用与\
    \ `while` 命令相反。它要求指定一个测试命令，当其返回非零退出状态时，shell 将执行循环内的命令。然而，与 `while` 命令类似，`until`\
    \ 命令也可以包含多个测试命令，`var15` 变量的退出状态是循环的决定因素。\n\n```bash\n$ cat test222\n\n#!/bin/bash\n\
