  trans: "\n尽管 MAC 操作系统是安全的，但黑客已经破解了进入 Mac 操作系统使用的 Adobe Flash 插件的技巧。多年来，黑客已经学会了破解\
    \ Mac 操作系统一直使用的 Adobe Flash 插件的技巧。尽管 Mac 操作系统在安全性方面非常稳固，但 Adobe Flash 已经变成了一个安全漏洞。黑客现在可以借助\
    \ Flash 软件接管 Mac 计算机。然而，Linux 操作系统没有这个漏洞。让我们开始在你的计算机上安装 Linux 操作系统的过程。\n\n安装的第一步是下载\
    \ Ubuntu Linux 服务器操作系统。访问 `ww.ubuntu.com`。在 Ubuntu 的主页上，你会发现不同版本的 Ubuntu 用于执行多个任务。你会找到\
    \ Ubuntu 的桌面版本。你还会看到一个网络笔记本（netbook）版本。还有一个云版本，以及适用于平板电脑和手机的版本。你必须找到 Ubuntu 服务器版本并找到它的下载链接。\n\
    \n如果你正准备在计算机系统上安装 Ubuntu，你应该确保文件从 DVD 而不是硬盘启动。你可以通过按下键盘上的 `DELETE` 或 `F1` 键进入主板的\
    \ BIOS 设置。从那里开始，你可以设置你想要从何处启动系统。多个主板制造商有不同的进入 BIOS 设置的方法，因此你应该确保查阅主板的用户手册来了解如何操作。\n\
    \n一旦你下载了文件并准备好从 CD 或 DVD 启动，就可以进行安装了。系统会询问你想用哪种语言安装 Ubuntu Linux 操作系统。选择所需的语言并按\
    \ `Enter`。Linux 将被安装在你的计算机系统上。\n\n# 第二章：使用 Linux 命令\n\n当我们谈论 Linux 命令行时，指的是 Linux\
    \ shell（外壳）。Linux shell 是一个接受键盘命令并将其传递给你的操作系统进行执行的程序。所有的 Linux 发行版都有一个 shell 程序，即\
    \ `bash`。`bash` 是 Bourne Again Shell 的缩写。这指的是 `bash` 是 `sh` 的高级版本，而 `sh` 是原始的\
    \ UNIX shell 程序。\n\n当你使用图形化用户界面时，你需要另一个程序，即终端模拟器（terminal emulator）来与 Linux shell\
    \ 交互。如果你浏览桌面菜单，就能找到它。\n\n## 开始吧\n\n是时候开始在你的 Linux 操作系统的命令行上工作了。你需要采取的第一步是启动终端模拟器。一旦打开它，你就能看到下面这一行。\n\
    \n```\nlinuxbox1:~$\n```\n\n这被称为 shell 提示符（shell prompt）。你会发现，每当 Linux shell 准备好接收输入时，它就会显示。外观可能会根据你使用的发行版而有所不同。如果你看到\
    \ `(#)` 而不是美元符号 (`$`)，终端将为你提供超级用户权限。你要以 root 用户身份登录，要么选择了一个提供超级用户权限的终端模拟器。让我们在\
    \ shell 中输入一些内容，看看它能为你做什么。\n\n```\nlinuxbox1:~$ hkhkhhkhk\n/bin/sh: hkhkhhkhk:\
    \ not found\n```\n\n如果你想检查命令历史，可以通过按下向上箭头查看。无论你编写并输入了多少条命令，你都能在屏幕上看到它们。当你按下向下箭头时，命令历史就会消失。你可能认为命令行完全关于键盘。然而，事实并非如此。你可以配合终端模拟器使用鼠标。\n\
    \n## 你的 Linux 操作系统的第一个命令\n\n是时候在你的 Linux 系统上输入第一个命令，看看终端是如何工作的。这些是你执行某些常用任务时将使用的最简单命令。行的第一个命令是\
    \ `cal` 命令，通过它可以显示当前月的完整日历。\n\n```\nlinuxbox1:~$ cal\n\n     January 2021\n\n\
