    doesn’t require this. When the Linux File command is invoked, it prints out a
    description of the file contents.


    [gha@localhost ~]$ file image.jpg


    There are lots of file types, and, like many other operating systems, Linux treats
    everything in the system as a file.


    ### The less command


    We use the less command for viewing text files. The Linux operating system contains
    several files with text readable by the human eye, and the less command gives
    us an easy way to look through them. Text files need to be examined because some
    of them will be full of system settings. You see these labeled as configuration
    files, and all of them are stored in a particular format. When you can read the
    files, you will gain an idea of the way Linux works, and you will find several
    of the programs used by your system, called scripts, are stored the same way.


    Once the less command has been executed, you can scroll through a text file, back
    or forward. Let’s say you are looking at a file defining user accounts for your
    system. You could use this command:


    [gha@localhost ~]$ less /etc/passwd


    Once the command has been given, you can look at the content of a specific file.
    If it is a long file, use the arrow keys on your keyboard to navigate the contents.
    Below you can see the other common keyboard shortcuts that help you navigate files
    with the less command:


    *   Page Up to scroll back a page


    *   Page Down to scroll forward a page


    *   Spacebar to scroll forward a page


    *   Up Arrow to scroll up a line on the page


    *   Down Arrow to scroll down the line on the page


    *   G to go to the end of the text file


    *   1G or g to move to the start of the file on the page


    *   h to display the help screen on the page


    *   n to search for the next possible occurrence of different characters


    *   /characters to search forward to the characters'' next occurrence on the page


    *   q to quit the less command


    Your Linux file system is similar to that of other UNIX-like systems, and the
    Linux File System Hierarchy Standard is the published standard that specifies
    the design. Below are some of the directories you can explore:


    *   / is the root directory that plays the role of the starting point of everything.


    *   /bin is the root directory that contains binaries or programs that ought to
    be present for a system to boot and run.


    *   /boot is the root directory containing the Linux kernel. This is the boot
    loader and contains the drivers needed for the system to boot.


    *   /var is the root directory which is where data that is most likely to change
    is stored. You will find a number of pool files, databases, user mail in this
    directory.


    *   /var/log is the root directory which contains different log files. It also
    contains certain records of system activities. The files packed inside the directory
    are very important. You should monitor it from time to time. The most useful one
    is /var/log/messages. It is possible that on some systems, you will have to log
    in as a superuser to access the log files.


    *   / imp is used to store transient files created by a number of programs. Some
    configurations may cause the directory to be emptied each time you reboot the
    system.


    *   /usr is the largest one in your Linux operating system. It may contain the
    programs and support certain files that are used by regular users.


    *   /proc is a special directory because it is not a filesystem used for storing
    files on the hard drive. Instead, it is a virtual filesystem the kernel maintains,
    and the files are snapshots into the kernel, are readable, and will tell you the
    kernel views a computer.


    *   /root is the major home directory if you are operating a root account.


    *   /tmp is used to store transient or temporary files. Be aware that some configurations
    may empty this directory whenever your system is rebooted.


    *   /usr/bin carries some executable programs that are installed by the Linux
    distribution. It is not uncommon for the directory to hold a number of programs.


    *   /usr/lib is a shared library for different programs that sit in /usr/bin.


    *   /usr/sbin is loaded with many system administration programs.'
