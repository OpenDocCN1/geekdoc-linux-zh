  raw: '*   The mv command option –u or --update is used when you are moving from
    one directory to another, and you are moving files that do not exist or newer
    to the files in the destination directory.


    *   The mv command option –v or --verbose is used to display informative messages
    as you perform the movement.


    *   The mv command option –i or --interactive is used before overwriting existing
    files, which prompt the user for confirmation. If you have not specified the option,
    the mv command will overwrite the existing files, which is not good for your document
    records.


    ### Examples for mv command


    *   the Linux command mv item1 item2 will copy the files of item1 to the files
    of item2\. If item2 exists, it will be overwritten with the contents of item1\.
    If it does not exist, the system will create it. The file item1 will cease to
    exist in either case.


    *   the Linux command mv –i item1 item2 will move the files of item1 to the files
    of item2\. However, the only exception is that if item2 exists, the user will
    be prompted before the file is overwritten.


    *   the Linux command mv item1 item2 dir1 will move contents of item1 and item2
    into dir1\. The directory dir1 must exist before you execute this command.


    *   the Linux command mv dir1* dir2 uses a wildcard. It will move all the files
    of dir1 into dir2\. The condition is that dir2 must exist before the execution
    of the command.


    *   the Linux command mv dir1 dir2 will move the directory dir1 to the directory
    dir2\. If dir2 is non-existent, you will have to create it and move the contents
    of dir1 into dir2.


    ### The rm command


    The rm command is used for removing or deleting directories and files like the
    following:


    rm file…


    In this command file is the name of one or more than one directory and files.
    Using this command can be highly treacherous. Once you delete something with the
    rm command, you will never get it back. Linux assumes that you have removed a
    file on purpose. It does not give it back to you. Therefore, you should use it
    carefully. Let us say that you want to delete the HTML files in some directory.


    So when you are using wildcards with the rm command, you should test the wildcard
    with the ls command to see the contents of the file you are going to remove from
    the system. You can use the arrow key to recall the command and replace it with
    rm then.


    *   The mv command option –r or --recursive is used to delete directories recursively.
    This means that if the directory you are deleting has subdirectories, you can
    delete them as well. If you want to delete a directory, you should specify this
    option.


    *   The mv command option –f or --force is used to ignore the non-existent files.
    It does not prompt. It tends to override the –interactive option.


    *   The mv command option –v or --verbose is used to display the informative messages
    as you perform the deletion.


    *   The mv command option –i or --interactive is used before deleting the existing
    files, which prompts the user for confirmation. If you have not specified the
    option, the rm command will silently delete the existing files, which is not good
    for your document records.


    ### Examples of rm command


    *   The Linux command rm item1 will silently delete files of item1.


    *   The Linux command rm –i item1 will delete the files of item1\. However, the
    only exception is that the user will be prompted before the file is deleted.


    *   The Linux command rm item1 dir1 will delete the contents of item1 and dir1\.
    The directory dir1 must exist before you execute this command.


    *   The Linux command rm –rf item1 dir1 works the same as above, with the exception
    that if both item1 and dir1 do not exist, the rm command will go on silently.


    # Chapter Four: Practical Work with Commands


    You have gone through a series of commands. Each has some mysterious options and
    arguments. This chapter will walk you through some more commands to make you more
    familiar with the Linux command line.


    ### The type command


    This is a built-in Linux command that displays a typical type of command that
    the shell is going to execute. See how you can use it.


    [gha@localhost ~]# type type


    type is a shell builtin


    [gha@localhost ~]# type ls


    ls is aliased to `ls --color=auto’


    [gha@localhost ~]# type cp


    cp is /bin/cp


    [gha@localhost ~]# type mv


    mv is /bin/mv


    [gha@localhost ~]# type rm


    rm is /bin/rm


    [gha@localhost ~]# type cd


    cd is a shell builtin


    [gha@localhost ~]# type help


    help is a shell builtin


    You can see that there are different results of all these different commands.


    ### The which command


    Sometimes more than one version of executable programs is installed on a particular
    system. While this is not common on desktop systems, it is not quite unusual on
    large servers. You can use the ‘which’ command to know the exact location of an
    executable.


    [gha@localhost ~]# which ls


    ls=’ls --color=auto’


            /bin/ls


    The which command works well for executable programs only and not for built-ins
    or alias that are mostly substitutes for executable programs. When you try to
    use the which command on shell built-in, you get either no response or a big error
    message.


    [gha@localhost ~]# which help


    /usr/bin/which: no help in (/usr/local/sbin:/bin:/sbin:/usr/bin:/usr/sbin:/usr/l


    local/bin)


    ## Documentation of Commands


    You can take a step further and fish out the available documentation in the system
    for each type of command.


    ### The help command


    Bash shell has a built-in help facility for shell built-ins. If you want to use
    it, you can type help and the name of the shell built-in. See the following example.


    [gha@localhost ~]$ help cd


    cd: cd [-L|[-P [-e]] [-@]] [dir]


        Change the shell working directory.


        Change current directory to DIR.  The default DIR is the HOME Shell variable’s
    value.


        The CDPATH variable is used to define the search path leading to the directory
    where DIR is. CDPATH indicates alternative file names by using a colon (:) to
    separate them. A null name indicates the current directory, and where a slash
    (/) precedes a directory name, then CDPATH isn’t used.


    The details are longer than I have mentioned here. I cut it down to save space.
    You can type the command on the terminal and see how the help command can help
    you out when you get stuck as you operate the Linux operating system. When you
    see square brackets in the description of a command''s syntax, you should keep
    in mind that they indicate only optional items. If you see a vertical bar character
    in the description, it denotes mutually exclusive items. Some executable programs
    support the --help option. When you apply the option, it displays a lengthy description
    of the command''s supported syntax and the related options.


    [gha@localhost ~]$ mkdir --help


    Usage: mkdir [OPTION]... DIRECTORY...


    Create the DIRECTORY(ies) if they do not already exist.


    Mandatory arguments to long options are mandatory for short options too.


      -m, --mode=MODE   set file mode (as in chmod), not a=rwx - umask


    ### The man command


    Most executable programs intended for command-line use offer a formal piece of
    documentation known as a man page or a manual page. A special paging program known
    as man is loaded up on Linux to view the details. You can type the man command
    and then the title of the command. The man pages differ in format and contain
    a title or a synopsis of the command''s syntax, a listing, and a description of
    the purpose of the command. The man page does not include examples, and they are
    intended as a special reference and not as a tutorial. See the following example.


    [gha@localhost ~]$ man ls


    LS(1)                            User Commands                           LS(1)


    NAME


           ls - list directory contents


    SYNOPSIS


           ls [OPTION]... [FILE]...


    DESCRIPTION


           List information about the FILEs (the current directory by default).


           Sort entries alphabetically if none of -cftuvSUX nor --sort is specified.'
