    当处于插入模式时，你可以在缓冲区中插入数据。有时在进入缓冲区后，你可能需要添加或删除某些数据。当你处于普通模式时，vim 编辑器会提供某些命令来编辑缓冲区中的数据。在
    vim 编辑器内部使用 PC 键盘的 Delete 或 Backspace 键时，你需要格外小心。vim 编辑器会将键盘 Delete 键识别为 `x` 命令功能，它将删除当前光标位置的字符。


    ## 复制与粘贴


    这些编辑器的标准功能之一是剪切或复制数据，然后将其粘贴到文档中。剪切和粘贴非常简单。当 vim 移除你的数据时，它将其发送到一个单独的寄存器中。然后你可以使用
    `p` 命令检索这些数据。你可以使用 `dd` 命令删除不同的文本行。当你尝试复制文本时，可能会发现它稍微复杂一点。


    *   vim Linux 编辑器中的 `x` 用于删除光标当前位置的字符。

    *   vim Linux 编辑器中的 `R` 文本用于用新输入的文本覆盖光标当前位置的数据，直到你按下 Escape 键为止。

    *   vim Linux 编辑器中的 `r char` 用于将光标当前位置的任何单个字符替换为 `char`。

    *   vim Linux 编辑器中的 `dd` 用于删除光标当前位置的行。

    *   vim Linux 编辑器中的 `A` 用于在光标当前位置行的末尾追加数据。

    *   vim Linux 编辑器中的 `a` 用于在光标当前位置旁边追加数据。

    *   vim Linux 编辑器中的 `J` 用于删除从光标当前位置到行尾的换行符。

    *   vim Linux 编辑器中的 `dw` 用于删除光标当前位置的单词。

    *   vim Linux 编辑器中的 `d$` 用于删除从光标当前位置到行尾的文本。


    ## KDE 编辑器家族


    如果你正在使用 KDE 桌面的 Linux 发行版，你将看到与文本编辑器相关的选项。KDE 项目将正式支持几个编辑器，例如 Kate 和 KWrite。两者都是图形化文本编辑器，包含许多高级功能和一些在常用标准编辑器中没有的额外便利。本节将描述每个编辑器，以及你可以在
    shell 脚本中可能使用的功能。


    ## KWrite 编辑器


    这是 KDE 环境的基础编辑器。它提供字 风格的文本编辑，支持代码语法编辑和高亮，并用于不同类型的编程语言。它使用颜色编码来区分注释、常量和函数。你应该会注意到
    `for` 循环带有一个连接左括号和右括号的图标。编辑窗口提供了剪切和粘贴功能。


    该编辑器有许多你可能使用的命令行参数来自定义它的启动方式。


    *   `Kwrite` 编辑器命令 `--stdin` 触发编辑器从标准输入设备读取数据而不是文件。

    *   `--column` 触发编辑器指定文件中的列号，以便在编辑器窗口中启动该进程。

    *   `--encoding` 触发编辑器为文件指定字符编码类型。

    *   `--line` 触发编辑器指定文件中的行号，以便在编辑器窗口中启动。


    KWrite 编辑器在窗口顶部提供了一个用于编辑的工具栏和菜单栏，允许你选择不同的功能并更改编辑器的配置设置。菜单栏将包含以下项目。


    *   `File`（文件）帮助你从不同的文件中加载、保存、导出或打印不同的文本。

    *   `Edit`（编辑）帮助你操作缓冲区中的文本。

    *   `View`（视图）帮助你管理编辑器窗口内文本的外观。

    *   `Bookmarks`（书签）帮助你处理指针以返回文本中的某些位置。

    *   `Tools`（工具）具有一些用于处理文本的特殊功能。

    *   `Settings`（设置）帮助你配置编辑器处理文本的方式。

    *   `Help`（帮助）将提供关于编辑器及其命令的信息。


    ### KWrite 编辑器的 Edit 菜单


    以下是 KWrite 编辑器 Edit 菜单不同命令的概述。


    *   `Undo`（撤销）用于撤销你在编辑器中的最后一次操作。

    *   `Redo`（重做）用于撤销你刚刚撤销的操作。

    *   `Cut`（剪切）用于删除所选择文本并将其放入剪贴板。

    *   `Copy`（复制）将你选择的任何文本复制到剪贴板。

    *   `Copy as HTML`（作为 HTML 复制）将所选文本作为 HTML 代码复制到剪贴板。

    *   `Paste`（粘贴）将剪贴板当前内容插入屏幕上光标所在的位置。

    *   `Select All`（全选）用于选择编辑器中的全部文本。

    *   `Deselect`（取消选择）用于取消选择当前选中的文本段。

    *   `Block Selection Mode`（块选择模式）允许你选择列之间的文本而不是所有行。

    *   `Overwrite Mode`（覆盖模式）用于在插入模式和覆盖模式之间切换，用新输入的文本替换文本而不是插入新文本。

    *   `Find`（查找）用于生成查找文本对话框，允许你自定义文本搜索。

    *   `Find Next`（查找下一个）用于在缓冲区中向向重复上一次查找操作。

    *   `Find Previous`（查找上一个）用于在缓冲区中向后重复上一次查找操作。

    *   `Replace`（替换）用于在屏幕上打开替换对话框。你可以用它自定义文本搜索。

    *   `Go to Line`（跳转行）用于生成跳转对话框。允许你输入特定的行号。光标将跳转到指定的行。


    ## KWrite 编辑器工具


    KWrite 为用户提供了各种工具来编写和编辑 shell 脚本。部分工具如下：


    *   KWrite 编辑工具 `Read Only Mode`（只读模式）将锁定文本，以便在你使用编辑器时无法进行任何更改。

    *   `Filetype`（文件类型）将选择文本使用的文件类型方案。

    *   `Spelling`（拼写检查）将在文本的起点启动拼写检查程序。

    *   `Highlighting`（高亮）将根据程序代码或配置文件等内容高亮文本。

    *   `Indent`（缩进）将段落的缩进增加一级。

    *   `Indentation`（缩进）将根据你在编辑器中的选择自动进行缩进。

    *   `Spelling`（拼写检查）将在文本起始点启动拼写检查程序。

    *   `Spellcheck Selection`（检查选择）将在文本的选部分启动拼写检查程序。

    *   `Unindent`（取消缩进）将段落的缩进减少一级。

    *   `Clean Indentation`（清理缩进）将段落缩进恢复原始设置。

    *   `Align`（对齐）将选行恢复默认缩进设置。

    *   `Uncomment`（取消注释）根据文件类型消除当前行中的注释符号。

    *   `Lowercase`（小写）将所选文本或光标当前位置的字符设置为小写。

    *   `Uppercase`（大写）将所选文本或光标当前位置的字符设置为大写。

    *   `Capitalize`（首字母大写）将所选文本或光标当前位置单词的首字母设置为大写。

    *   `Join Lines`（合并行）将当前位置的所选文本或行与下一行合并为单行。

    *   `Word Wrap Document`（文档自动换行）将启用文本自动换行。如果某行超过编辑器窗口边缘，它将继续在下一行显示。


    ## GNOME 编辑器


