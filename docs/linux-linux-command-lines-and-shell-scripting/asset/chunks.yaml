    ## Handling User Input


    You have learned how to write shell scripts that interact with data, files, and
    variables on a Linux operating system. However, sometimes you need to write a
    script that must interact with a person who is running the script. The shell gives
    us several methods to retrieve data from people, including some command line parameters,
    command-line options, and reading input from the keyboard. The chapter will walk
    you through the process of incorporating different methods in the bash shell scripts
    to get data from the person who is running the script.


    Variables called positional parameters are assigned to the command line parameters
    by the bash shell, including the name of the program executed by the shell. We
    use standard numbers for the positional parameter variables - `$0` is the program
    name, `$1` is the first parameter, `$2` the second one, and so on up to `$9`.


