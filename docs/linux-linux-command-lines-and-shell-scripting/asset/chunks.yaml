    # 第三章：文件与目录命令


    本章将带你熟悉在 Linux 操作系统中遍历文件和目录的命令。你可以操作目录和文件。某些任务很容易完成。当你使用命令进行导航时，与使用图形用户界面相比，你拥有更多的权力和灵活性。虽然后者容易操作且适用于执行简单任务，但你需要命令行来完成复杂的任务。从一个目录复制
    HTML 文件到另一个目录在图形用户界面中很难；但在命令行系统中容易得多。在我探索你可以用于操作文件和目录的命令之前，我将解释一些你可以在 Linux 中使用的特殊字符。


    ## 特殊字符


    当你与他人讨论 Linux 时，你可能会听到 Linux 用户在操作过程中遇到的一些特殊字符。每个特殊字符都有其职责，了解它们会让你的工作变得更轻松。


    - `*` 技术上称为星号（asterisk 或 star）。它用于正则表达式和通配符（glob）。

    - `''` 技术上称为单引号（tick 或 single quote）。它用于字面字符串。

    - 特殊字符 `.` 技术上称为点（dot）。它用于表示你所在的当前目录、主机名或文件分隔符。

    - `$` 技术上称为美元符号（dollar sign）。它用于标识变量或表示行尾。

    - `\` 技术上称为反斜杠（backsl）。它用于宏和字面量。

    - `/` 技术上称为正斜杠（forward slash）。它被用搜索命令或目录分隔符。

    - `!` 技术上称为感叹号（bang）。它用于命令历史和否定。

    - `|` 技术上称为管道（pipe）。它用于命令管道。

    - `_` 技术上称为下划线（underscore 或 under）。它用于某些特定空格的廉价占位符。

    - `` ` `` 技术上称为反引号（backtick 或 backquote）。它用于命令替换。

    - `"` 技术上称为双引号（double quote）。它用于半字面字符串。

    - `{}` 技术上称为大括号（braces 或 curly brackets）。它用于范围或语句块。

    - `^` 技术上称为脱帽符号（caret）。它用于表示行首和否定。

    - `[]` 技术上称为方括号（squares 或 brackets）。它用于范围。

    - `~` 技术上称为波浪号（squiggle 或 tilde）。它用于目录快捷方式和否定。

    - `#` 技术上称为井号（pound、hash 或 sharp）。它用于预处理器、注释和替换。


    ## 命令行编辑


    当你移动和探索 Linux shell 时，你会发现你可以自由地通过箭头键在 shell 中移动。这在大多数 Linux 操作系统中都是标准配置。了解 Linux
    操作系统上的标准键位是一个好主意。


    - `CTRL-B` 用于将光标移动到屏幕的左侧。

    - `CTRL-F` 用于将光标移动到屏幕的右侧。

    - `CTRL-E` 用于将光标移动到屏幕的行尾。

    - `CTRL-A` 用于将光标移动到屏幕的行首。

    - `CTRL-P` 用于在屏幕上查看之前的任何命令。它用于将光标向上移动。

    - `CTRL-N` 用于将光标向下移动，也用于查看下一个命令。

    - `CTRL-K` 用于删除从光标到行尾的所有内容。

    - `CTRL-W` 用于删除屏幕上光标的前一个单词。

    - `CTRL-U` 用于删除从光标到行首的所有内容。

    - `CTRL-Y` 用于粘贴你已经通过命令 `CTRL-U` 剪掉的文本。它类似于文字处理器中的复制和粘贴。


    ## 用于目录的 Linux 命令


    `mkdir` Linux 命令用于创建目录。它的工作方式如下：


    ```

    mkdir directoryname

    ```


    ### cp 命令


    另一个命令 `cp` 命令用于复制目录和文件。你可以以不同的方式使用它，如下所示：


    ```

    cp file1 file2

    cp files… directoryname

    ```


    你可以在 `cp` 命令中使用以下选项。


    - `cp` 命令选项 `-a` 或 `--archive` 用于复制目录和文件及其所有属性（包括权限）。通常拷贝会继承执行操作的用户默认属性。

    - `cp` 命令选项 `-u` 或 `--update` 用于从一个目录复制到另一个目录时，复制比目标位置较新的文件。

    - `cp` 命令选项 `-v` 或 `--verbose` 用于在执行时显示信息信息。

    - `cp` 命令选项 `-i` 或 `--interactive` 用于在覆盖现有文件之前提示用户。如果你没有指定该选项，`cp` 命令将覆盖现有文件，这对于文档记录是不利的。

    - `cp` 命令选项 `-r` 或 `--recursive` 用于递归复制内容。当你复制目录时，需要这个特定的选项。


    ### cp 命令示例


    - Linux 命令 `cp item1 item2` 将 `item1` 的文件复制到 `item2`。如果 `item2` 存在，它将被 `item1`
    的内容覆盖。如果它不存在，系统将创建它。

    - Linux 命令 `cp -i item1 item2` 将 `item1` 的文件复制到 `item2`。但唯一的例外是如果 `item2` 存在，会在覆盖文件前提示用户。

    - Linux 命令 `item1 item2 dir1` 将 `item1` 和 `item2` 的内容复制到 `dir1`。在执行此命令之前，`dir1`
    必须存在。

    - Linux 命令 `cp dir1* dir2` 使用通配符。它将所有 `dir1` 开头的文件复制到 `dir2`。条件是执行前 `dir2` 必须存在。

    - Linux 命令 `cp -r dir1 dir2` 将目录 `dir1` 复制到目录 `dir2`。如果 `dir2` 不存在，将创建它并包含与 `dir1`
    目录相同的内容。


    ### mv 命令


    `mv` Linux 命令根据用户的用法执行文件的移动和重命名。在执行命令后，原始文件名将不再存在。`mv` 命令用法与 `cp` 命令相同。


    ```

    mv file1 file2

    ```


