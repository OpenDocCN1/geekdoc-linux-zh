  trans: "\n\n我计划在夏天继续我的全美之旅。我下一个要访问的州是佛蒙特州。\n\n我上一次旅行的美国州是佛蒙特州。\n\n现在我要去访问康涅狄格州。\n\
    \n现在 `for` 命令可以区分单单词和多单词值。此外，最棒的一点是当你使用双引号时，shell 会将引号作为值的一部分剥离。\n\n### 通过变量读取列表\n\
    \n在 shell 脚本中，经常发生的情况是累积存储在变量中的值列表。然后需要对列表进行迭代。你可以借助 `for` 命令的帮助来完成这一点。\n\n```bash\n\
    $ cat testing111\n\n#!/bin/bash\n\n# 这是 Linux 中基础的 for 命令\n\nlist=\"Alabama Texas\
    \ New York Alaska Virginia Arizona Ohio Arkansas South Dakota California North\
    \ Dakota Colorado New Jersey Florida Michigan Georgia North Carolina South Carolina\
    \ New Mexico Rhode Island West Virginia New Hampshire Vermont\"\n\nlist=$list\"\
    \ Idaho\"\n\nfor state in $list\n\ndo\n\necho \"I am planning to continue my travel\
    \ circle across the United States in the summer. The next state I will visit is\
    \ $state\"\ndone\n\n$bash -f main.sh\n\nI am planning to continue my travel circle\
    \ across the United States in the summer. The next state I will visit is Alabama\n\
    \nI am planning to continue my travel circle across the United States in the summer.\
    \ The next state I will visit is Texas\n\nRight up to the last state:\n\nI am\
    \ planning to continue my travel circle across the United States in the summer.\
    \ The next state I will visit is Idaho\n```\n\n`list` 变量包含了用于迭代的值列表。你应该注意，代码使用了另一个赋值语句来将项目连接到现有列表中。即使你忘记在列表中添加项目，你也可以在稍后通过连接方法将它们添加。我将在下一个示例中向列表中添加五个项目。\n\
    \n```bash\n$ cat testing111\n\n#!/bin/bash\n\n# 这是 Linux 中基础的 for 命令\n\nlist=\"\
    Alabama Texas Alaska Virginia Arizona Ohio Arkansas California Colorado Florida\
    \ Michigan Georgia Vermont Iowa Nebraska Arkansas Kansas Kentucky Tennessee Utah\
    \ Maine Missouri Minnesota\"\n\nlist=$list\" Idaho\"\n\nlist=$list\" Oregon\"\n\
    \nlist=$list\" Montana\"\n\nlist=$list\"Delaware\"\n\nfor state in $list\n\ndo\n\
    \necho \"I am planning to continue my travel circle across the United States in\
    \ the summer. The next state I will visit is $state\"\ndone\n\n$bash -f main.sh\n\
    \nI am planning to continue my travel circle across the United States in the summer.\
    \ The next state I will visit is Alabama\n\nI am planning to continue my travel\
    \ circle across the United States in the summer. The next state I will visit is\
    \ Texas\n\n此输出继续列出这些州，直到最后一个：\n\nI am planning to continue my travel circle across\
    \ the United States in the summer. The next state I will visit is Delaware\n```\n\
    \n有一种方法可以在列表中生成用于自定义用途的值，以便使用特定命令的输出。\n\n```bash\n$ cat testing111\n\n#!/bin/bash\n\
    \n# 我将从文件中读取值\n\nmyfile=\"states\"\n\nfor state in `cat $myfile`\n\ndo\n\necho\
    \ \"I am planning to continue my travel circle across the United States in the\
    \ summer. The next state I will visit is $state\"\ndone\n\n$cat states\n\nAlabama\n\
    Texas\nAlaska\nVirginia\nArizona\nOhio\nArkansas\nCalifornia\nColorado\nFlorida\n\
    Michigan\nGeorgia\nVermont\nIowa\nNebraska\nArkansas\nKansas\nKentucky\nTennessee\n\
    Utah\nMaine\nMissouri\nMinnesota\nIdaho\nOregon\nMontana\nDelaware\n```\n\n###\
    \ while 命令\n\n`while` 命令是 `if-then` 语句和 Linux `for` 循环的结合。它允许你定义一个命令来测试条件，然后循环一组命令，直到达到零退出状态。它会在每次迭代开始时分析测试命令。当达到非零退出状态时，`while`\
    \ 命令将停止执行该组命令。\n\n```bash\n$ cat test10\n\n#!/bin/bash\n\n# 这是 Linux 中的一个 while\
