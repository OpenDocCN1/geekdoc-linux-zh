    ## The emacs Editor


    Emacs is a popular editor that existed before Unix did, and developers loved it
    because it could be ported into Linux. It began life as a console editor, similar
    to vi, but soon migrated to the graphical environment. It provides access to the
    original console editor and uses a graphical X windows window for text editing
    in graphical environments.'
