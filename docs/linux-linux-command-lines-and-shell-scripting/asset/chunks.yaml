    \ all these different commands.\n\n## The which command\n\nSometimes more than\
    \ one version of executable programs is installed on a particular system. While\
    \ this is not common on desktop systems, it is not quite unusual on large servers.\
    \ You can use the `which` command to know the exact location of an executable.\n\
    \n```\n[gha@localhost ~]# which ls\nls='ls --color=auto'\n        /bin/ls\n```\n\
    \nThe `which` command works well for executable programs only and not for built-ins\
    \ or alias that are mostly substitutes for executable programs. When you try to\
    \ use the `which` command on shell built-in, you get either no response or a big\
    \ error message.\n\n```\n[gha@localhost ~]# which help\n/usr/bin/which: no help\
    \ in (/usr/local/sbin:/bin:/sbin:/usr/bin:/usr/sbin:/usr/local/bin)\n```\n\n##\
    \ Documentation of Commands\n\nYou can take a step further and fish out the available\
    \ documentation in the system for each type of command.\n\n### The help command\n\
    \nBash shell has a built-in help facility for shell built-ins. If you want to\
