    The first way is through the Open Source model, where they give off their software
    free of cost. However, when you require support or training for the software,
    they will charge you a certain amount. For example, you can download `MySQL` server
    for the Linux server. You find it useful and powerful as well. Even though you
    have learned the `MySQL` program''s different intricacies, there are some aspects
    of the software you may need to learn or need support with. Therefore, you approach
    the software developer, ask for training or support with the software. At this
    point, you have to pay the programmer or developer for his or her development
    efforts.


    The second way by which developers are paid is through a non-commercial open-source
    license. This is where most people get into trouble. You have to pay them to use
    them.


    If you want software for home use, there is no problem. Once you use it to connect
    to a business server, you own a licensing fee to use that software for commercial
    use. The worst thing is that licensing fees may be over $8,000. It can be that
    much expensive in some cases. Therefore, it is wise to stay conscious of how you
    may use the software for non-commercial, personal, or commercial purposes.


    The third way by which open-source software programmers are paid is through a
    paid open-source license. Some of you might ask how software can be on the open-source
    license if it happens to be a paid software. A paid software is called open-source
    if the programmer of the software allows you to see their code.


    The fourth way by which these programmers earn money is by recurring license fees
    for the open-source software. This is like most of the open license programs.
    They will let you download and test their software free of charge. They would
    let you see its code as well so that you know how the software works. However,
    if you want to have the software''s legal rights, you will have to pay a yearly
    or monthly fee for that. This is much cheaper than a one-minute licensing fee
    that is too much expensive.


    ## The Linux Shell


    Now I will move on the Linux shell of the Linux operating system. The shell of
    any operating system is the screen by which you interact with that system. Take
    the example of Microsoft Windows. The Windows shell is its graphical user interface
    where you can see the mouse pointer at work. You use a pointer to navigate the
    screen and click on different desktop elements such as icons and folders.


    The shell is generally of two types, the first being the graphical user interface
    (GUI) and the second being the line user interface (LUI). The LUI appears to be
    as DOS prompts. If you ever have the opportunity to work on the Microsoft DOS
    prompt, you should know that the screen you see and work on is the line user interface
    (LUI). It is a black-and-white screen. You see a bunch of commands on the screen
    to get a specific output from your computer.


    Linux is a technical operating system, which is why programmers, engineers, and
    geeks prefer it. They prefer to use this line user interface because it facilitates
    them in programming. When you install Linux, you can install the Linux graphical
    user interface on your system, just like Windows. Here, you can use a mouse to
    click on things or access a line user interface more suitable for programmers.
    However, the line user interface on Linux works on a bunch of commands.


    You should keep in mind that the line user interface on Linux is more robust than
    the graphical user interface (GUI). However, when you install Linux with a line
    user interface for the Linux shell, you see a prompt instead of a mouse. If you
    do not know what a command prompt is or what you will do with it, you will most
    likely be stuck. To help you out, I will give functional examples of Linux commands
    and shell scripts.


    ## Root


    The next concept that you must chew down and digest is the concept of the root.
    In the Linux operating system, root relates to the top level of anything. When
    you work on Linux, you will hear more often about the word `root`. A root user
    refers to a computer''s administrator. A root user is the highest-level user that
    anyone can be on a computer system. If you can log in as a root user, you can
    use any command and do anything with the computer. A root user refers to the root
    of the Linux operating system. It is the point where the operating system is installed
    on your hard drive. If you think about this in terms of the Windows operating
    system, `C:/` is the operating system root because it is where you have installed
    the Windows operating system.


    A root user has several privileges and the highest level of access that any user
    can reach. The Linux operating system has many folders, and the home folder is
    packed up with the user’s data like settings, documents, programs, etc. Therefore,
    the home directory can be the highest level for a specific user. The most important
    thing to keep in mind is that when you talk about the root user in the Linux operating
    system, the root level is the highest level. Once we move toward typing commands
    and making the Linux operating system do different tasks, we will realize how
    important the root user concept is. Where we will be blocked while logged in as
    a non-root user, we will have access there as a root user.


    ## Reasons to Use the Linux Operating System


    The reason you should learn about the Linux operating system is the functionality
    of the server. The Linux operating system is incredibly rock-solid. Once you have
    installed the Linux operating system and once you have gone through the quirks
    and set up the configurations, a Linux operating system will run without overheating
    and dying in the middle of working. It would run on end. Once you have installed
    the Linux operating system correctly, it has the power to run for a hundred and
    fifty days without shutting down.


    The Linux operating system is unlike Windows in the sense that you have to reboot
    it on weekly basis to avoid certain losses. If you have configured it properly,
    the Linux operating system would run and do the job with the least concern about
    the circumstances. There will be little to no operational problems when you install
    a Linux operating system on your computer.


    ## Installation of the Linux Operating System


    In this section, I will walk you through how to install the Linux operating system
    to try it out and have a feel for the process of using the Linux operating system.
    I will explain the installation process of the Ubuntu server edition. This is
    open-source and free to use. Google and open up the website of Ubuntu and download
    the ISO file to install the Ubuntu server edition. Burn the file on a disk or
    load it up on a USB thumb drive. I hope you already know about the burning processor
    making bootable thumb drive. I am not delving into that to save time.


    Since it is a server edition, there will be no graphical user interface on your
    screen. You will see a line user interface, which in simple words means a black-and-white
    screen. There will be a blinking cursor on your screen. You have to write commands
    to move further with your work, or you will be stuck. Let me answer the question
    that is popping up in your heads as to why the screen is black and white in the
    Linux operating system’s server edition. The biggest reason is safety. The server
    version of the Linux operating system has a line user interface because every
    function is like an attack vector for a black hat hacker. Any program that you
    install on your computer’s graphical interface gives a hacker a loophole to enter
    your system. As there is no graphical interface or external apps in the Linux
    operating system, the threat of hacking attacks is minimum.

