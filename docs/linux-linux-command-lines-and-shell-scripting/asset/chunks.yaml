    此命令将列出该目录下的文件。`ls` 命令是 Linux 操作系统中最广泛使用的命令之一。通过此命令的帮助，你可以查看目录的内容，并确定文件的数量和目录属性。正如你所看到的，你可以输入
    `ls` 命令来查看当前工作目录中包含的文件和子目录列表。


    ```

    [gha@localhost ~]$ ls /usr

    bin  games include lib lib64 libexec local sbin share src tmp

    ```


    你可以使用以下命令列出用户家目录和 `/usr` 目录。


    ```

    [gha@localhost ~]$ ls ~ /usr

    /root:

    bench.py  hello.c

    /usr:

    bin  games include lib lib64 libexec local sbin share src tmp

    ```


    你可以向 `ls` 命令中添加 `-1` 来更改显示格式并揭示更多细节。通过在同一个 `ls` 命令中添加 `-1`，你可以将输出更改为更长的格式。


    ## 选项与参数命令


    大多数 Linux 命令由一个前带横杠（-）的字符组成。然而有些命令较长，由两个横杠后跟一个单词，例如 GNU 支持项目中的命令。有些命令甚至允许将两个或多个较短的选项组合。在下方的示例中，我们将为
    `ls` 命令提供两个选项——第一个 `(l)` 将显示长格式输出，而第二个 `(t)` 将按修改时间排序结果。


    让我们看看 `-l` 命令的结果。


    ```

    [gha@localhost ~]$ ls -l

    total 8

    -rw-r--r-- 1 root root 114 Dec 26 15:19 bench.py

    -rw-r--r-- 1 root root 185 Sep 9 2018 hello.c

    ```


    现在我将 `t` 添加到 `-l` 中，如果可以扩展输出，则会延长输出。


    ```

    [gha@localhost ~]$ ls -l

    total 8

    -rw-r--r-- 1 root root 114 Dec 26 15:19 bench.py

    -rw-r--r-- 1 root root 185 Sep 9 2018 hello.c

    ```


    你可以使用反转命令（reverse）来反转输出顺序。命令语法如下：


    ```

    [gha@localhost ~]$ ls -lt --reverse

    total 8

    -rw-r--r-- 1 root root 185 Sep 9 2018 hello.c

    -rw-r--r-- 1 root root 114 Dec 26 15:19 bench.py

    ```


    让我们来看一些可以与 `ls` 命令配合使用的杂项命令。


    - `ls -a` 用于列出所有以点开头的正确名称的文件列表。它还会生成那些通常被列为隐藏的文件。

    - `ls --all` 是相同命令的长格式选项。

    - `ls -d` 用于指定一个目录并显示其内容。它不显示目录本身。你可以将此命令与 `-l` 命令配合使用，以探索目录的细节而不是内容。

    - `ls --directory` 用于生成有关目录或其内容的更多细节。

    - `ls -F` 用于在列出的名称末尾添加特定的指示字符，例如名称末尾正斜杠表示该名称已在目录中。

    - `ls --classify` 用于在列出的名称末尾添加指示字符。

    - `ls --human-readable` 用于以长格式列表显示内容，并以人类可读格式显示文件，而不是字节形式。

    - `ls -S` 用于按文件大小对结果排序。

    - `ls -t` 用于按修改时间对结果排序。


    ## 查找文件类型


    当我们开始探索系统时，你应该学习的最有用信息之一就是文件中的内容。为了做到这一点，我们使用 `file` 命令来帮助确定文件类型。Linux 不要求文件名必须指定文件内容，例如，在你预期的一个
    `.jpg` 文件包含图像的地方，Linux 并不要求这样做。当调用 Linux `file` 命令时，它会打印出文件内容的描述。


    ```

    [gha@localhost ~]$ file image

    ```


