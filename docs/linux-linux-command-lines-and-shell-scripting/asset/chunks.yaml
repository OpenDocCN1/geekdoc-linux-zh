  raw: 'Another way by which the shell will help you is through completion. This occurs
    when you hit the Tab key while you are typing the command. When you are halfway
    through a command, you can enter tab to complete the command. The important thing
    to remember is that you should not hit the Enter key.


    ### Completion commands


    *   The keyboard trick Alt-$ will help you display the list of all possible completions.
    You may also do this by pressing the Tab key twice. This is much easier to do.


    *   The keyboard trick Alt-* will help you insert the possible completions. This
    is highly useful when you intend to use more than one match.


    ## Searching History


    Bash maintains a history of the commands you type in it. The list of commands
    is kept in the home directory in a file named .bash_history. The history facility
    is highly useful for cutting down on the amount of typing that you need to do
    especially when you combine it with command-line editing. Here is the syntax of
    the history command.


    [gha@localhost ~]$ history | less


    Bash, by default, stores the last 500 commands that you have entered. Suppose
    you want to find the commands that you used to list /usr/bin. Here is the way
    to do that.


    [gha@localhost ~]$ history | grep /usr/bin


    There is a list of keystrokes that you may use when you are navigating through
    the history command.


    *   You can use the keyboard shortcut CTRL-P to move to the latest history entry.
    This performs the same action as the up arrow.


    *   You can use the keyboard shortcut CTRL-N to move to the next history entry.
    This performs the same action as the down arrow.


    *   You can use the keyboard shortcut ALT-> to move to the bottom of the list
    of history that is the current command line.


    *   You can use the keyboard shortcut ALT-< to move to the starting point of the
    list of history.


    *   You can use the keyboard shortcut CTRL-R to reverse the incremental search.
    This option incrementally searches from the current command line up the list of
    history.


    *   You can use the keyboard shortcut CTRL-O to execute the present item in the
    list of history and then move on to the next one. This is handy if you are looking
    forward to re-execute a sequence of commands in the list.


    *   You can use the keyboard shortcut ALT-N to forward the search. This is non-incremental.


    *   You can use the keyboard shortcut ALT-P to reverse the search. This also is
    non-incremental. Coupled with this keyboard shortcut, you can type the search
    string and then press ENTER before you have performed the search.


    ### History Expansion


    The shell offers a special type of expansion for different items in the history
    list by using the ! character. We already have seen how a number may follow the
    exclamation point to insert a particular entry from the list of history. There
    are many other expansion features. History expansion mechanism has many available
    elements, but this subject is too arcane.


    *   You can type the sequence !! to repeat the latest command. However, it may
    be easier to press the up arrow and then hit ENTER.


    *   You can type the sequence !?string to repeat the latest history list item
    that contains a string.


    *   You can type the sequence !string to repeat the latest history list item that
    starts with a string.


    *   You can type the sequence !number to repeat the latest history list item.


    # Chapter Six: Process Commands


    Today’s operating systems are capable of multitasking, which means they can do
    more than one thing at a time. They switch rapidly between executing programs,
    and the Linux kernel manages this. Linux uses processes to organize the programs
    queued for execution in the CPU.


    Sometimes, a computer system can become slow, or a specific application might
    stop working. This chapter is designed to show you the command-line tools you
    can use to terminate certain processes that don’t work properly during the system
    operations.


    When your system wakes, certain activities are activated as processes by the kernel.
    This is followed by a program called init being launched. This program runs shell
    scripts known as init scripts, which are used to start the system services. Lots
    of these services are implemented as daemon programs, working in the background
    and doing what they have to do without a user interface. You can find the processes
    command here:


    [gha@localhost ~]$ ps


    PID TTY          TIME CMD


       48 hvc0     00:00:00 sh


       82 hvc0     00:00:00 ps


    The result lists process that are sh and ps respectively. If we add an option
    to the command ps, we can detailed result on our screens. See the following example.


    [gha@localhost ~]$ ps x


      PID  TTY      STAT   TIME COMMAND


        1 ?        S      0:00 /bin/sh /sbin/init


        2 ?        S      0:00 [kthreadd]


        3 ?        I      0:00 [kworker/0:0]


        4 ?        I<     0:00 [kworker/0:0H]


        5 ?        I      0:00 [kworker/u2:0]


        6 ?        I<     0:00 [mm_percpu_wq]


        7 ?        S      0:00 [ksoftirqd/0]


        8 ?        S      0:00 [kdevtmpfs]


        9 ?        I<     0:00 [netns]


       10 ?      S      0:00 [oom_reaper]


       11 ?      I<     0:00 [writeback]


       12 ?      I<     0:00 [crypto]


       13 ?      I<     0:00 [kblockd]


       14 ?      S      0:00 [kswapd0]


       15 ?      I      0:00 [kworker/0:1]


       33 ?      S      0:00 [khvcd]


       43 ?      Ss     0:00 dhcpcd


       48 hvc 0     Ss     0:00 sh -l


       71 ?      I      0:00 [kworker/u2:1]


      102 hvc0     R+     0:00 ps x


    The x option informs ps that it needs to show all the processes, no matter what
    terminal controls them. Because the system is running many processes, a long list
    is produced, and more often than not, it is helpful to pipe the ps output into
    less and view them that way. Some combinations of options produce many output
    lines, and it is a good idea to maximize the emulator window in the terminal.


    ## Process States


    Here is a rundown of process states.


    *   The process state R denotes running. This process is either running or is
    ready to run in the system.


    *   The process state S denotes Sleeping. The process is in Sleep mode and not
    running. It is waiting for a certain event to start, such as a keystroke or network
    packet. 


    *   The process state Z denotes the zombie process. This is a child process that
    has been terminated, but the parent process has not cleaned it up.


    *   The process state D denotes Uninterruptable sleep. This process is waiting
    for the I/O like a disk drive.


    *   The process state T denotes stopping. This process is instructed to stop.


    *   The process state N denotes a low-priority process. It’s a good process that
    will obtain the processor time when all other high-priority processes have been
    serviced.


    *   The process state < denotes a high priority process. It is possible to give
    away more importance to a process and allowing it more time on your CPU. A process
    that has higher priority is less nice because it takes more of the CPU’s time.


    Other characters may follow this process and these indicate characteristics of
    other processes. The aux command can be used with ps to provide another set of
    options:


    [gha@localhost ~]$ ps aux


    USER       PID %CPU %MEM    VSZ   RSS TTY      STAT START   TIME COMMAND


    root         1  0.0  1.3   3136  2516 ?        S    14:35   0:00 /bin/sh /sbin/i


    root         2  0.0  0.0      0     0 ?        S    14:35   0:00 [kthreadd]


    root         3  0.0  0.0      0     0 ?        I    14:35   0:00 [kworker/0:0]


    root         4  0.0  0.0      0     0 ?        I<   14:35   0:00 [kworker/0:0H]


    root         5  0.0  0.0      0     0 ?        I    14:35   0:00 [kworker/u2:0]


    root         6  0.0  0.0      0     0 ?        I<   14:35   0:00 [mm_percpu_wq]


    root         7  0.1  0.0      0     0 ?        S    14:35   0:02 [ksoftirqd/0]


    root         8  0.0  0.0      0     0 ?        S    14:35   0:00 [kdevtmpfs]


    root         9  0.0  0.0      0     0 ?        I<   14:35   0:00 [netns]


    root        10  0.0  0.0      0     0 ?        S    14:35   0:00 [oom_reaper]'
