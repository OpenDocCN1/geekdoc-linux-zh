    \ of the until command. The next digit in the loop is 100\nYou are seeing the\
    \ operations of the until command. The next digit in the loop is 95\nYou are seeing\
    \ the operations of the until command. The next digit in the loop is 90\n```\n\
    \nAnd continuing, until it reaches the final digit:\n\nYou are seeing the operations\
    \ of the until command. The next digit in the loop is 5\n\nThe example has successfully\
    \ tested the `var15` variable in order to determine when the loop will stop -\
    \ when the value of the variable drops to zero, the `until` command stops right\
    \ away.\n\n```bash\n$ cat test1222\n\n#!/bin/bash\n\n# In this code block I will\
    \ be using the until command\n\nvar15=100\n\nuntil echo $var15\n\n[ $var15 -eq\
    \ 0 ]\n\ndo\n\necho You are seeing the operations of the until command. The next\
    \ digit in the loop is $var15\n\nvar15=$[ $var15 - 5 ]\ndone\n\n$bash -f main.sh\n\
    \n100\nYou are seeing the operations of the until command. The next digit in the\
    \ loop is 100\n95\nYou are seeing the operations of the until command. The next\
    \ digit in the loop is 95\n```\n\n## Nesting Loops\n\nA loop statement may use\
    \ another command inside of the loop, including other commands of the same loop.\
    \ The process is known as nested looping. You will have an iteration inside another\
    \ iteration, which will multiply the number of times a command is being run. See\
    \ an example to get a grasp of how you can nest loops.\n\n```bash\n$ cat test1444\n\
    \n#!/bin/bash\n\n# The following code block shows nesting for loops\n\nfor ((\
    \ x = 1; x <= 7; x++ ))\n\ndo\n\n  echo \"You are seeing the operations of the\
    \ until command. The next digit in the loop is $x:\"\n\n  for (( y = 1; y <= 7;\
    \ y++ ))\n\n  do\n\n    echo \" Now you are seeing what is going on inside loop:\
    \ $y\"\n  done\n\ndone\n\n$bash -f main.sh\n\nYou are seeing the operations of\
    \ the until command. The next digit in the loop is 1:\nNow you are seeing what\
    \ is going on inside loop: 1\n```\n"
