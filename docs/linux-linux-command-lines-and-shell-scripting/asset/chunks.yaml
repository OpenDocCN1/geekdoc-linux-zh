- fmt: "\nAnother way by which the shell will help you is through completion. This\
    \ occurs when you hit the `Tab` key while you are typing the command. When you\
    \ are halfway through a command, you can enter `tab` to complete the command.\
    \ The important thing to remember is that you should not hit the `Enter` key.\n\
    \n### Completion commands\n\n* The keyboard trick `Alt-$` will help you display\
    \ the list of all possible completions. You may also do this by pressing the `Tab`\
    \ key twice. This is much easier to do.\n* The keyboard trick `Alt-*` will help\
    \ you insert the possible completions. This is highly useful when you intend to\
    \ use more than one match.\n\n## Searching History\n\nBash maintains a history\
    \ of the commands you type in it. The list of commands is kept in the home directory\
    \ in a file named `.bash_history`. The history facility is highly useful for cutting\
    \ down on the amount of typing that you need to do especially when you combine\
    \ it with command-line editing. Here is the syntax of the `history` command.\n\
    \n```\n[gha@localhost ~]$ history | less\n```\n\nBash, by default, stores the\
    \ last 500 commands that you have entered. Suppose you want to find the commands\
    \ that you used to list `/usr/bin`. Here is the way to do that.\n\n```\n[gha@localhost\
    \ ~]$ history | grep /usr/bin\n```\n\nThere is a list of keystrokes that you may\
    \ use when you are navigating through the `history` command.\n\n* You can use\
    \ the keyboard shortcut `CTRL-P` to move to the latest history entry. This performs\
    \ the same action as the up arrow.\n* You can use the keyboard shortcut `CTRL-N`\
    \ to move to the next history entry. This performs the same action as the down\
    \ arrow.\n* You can use the keyboard shortcut `ALT->` to move to the bottom of\
    \ the list of history that is the current command line.\n* You can use the keyboard\
    \ shortcut `ALT-<` to move to the starting point of the list of history.\n* You\
    \ can use the keyboard shortcut `CTRL-R` to reverse the incremental search. This\
    \ option incrementally searches from the current command line up the list of history.\n\
    * You can use the keyboard shortcut `CTRL-O` to execute the present item in the\
    \ list of history and then move on to the next one. This is handy if you are looking\
    \ forward to re-execute a sequence of commands in the list.\n* You can use the\
    \ keyboard shortcut `ALT-N` to forward the search. This is non-incremental.\n\
    * You can use the keyboard shortcut `ALT-P` to reverse the search. This also is\
    \ non-incremental. Coupled with this keyboard shortcut, you can type the search\
    \ string and then press `ENTER` before you have performed the search.\n\n### History\
    \ Expansion\n\nThe shell offers a special type of expansion for different items\
    \ in the history list by using the `!` character. We already have seen how a number\
    \ may follow the exclamation point to insert a particular entry from the list\
    \ of history. There are many other expansion features. History expansion mechanism\
    \ has many available elements, but this subject is too arcane.\n\n* You can type\
    \ the sequence `!!` to repeat the latest command. However, it may be easier to\
    \ press the up arrow and then hit `ENTER`.\n* You can type the sequence `!?string`\
    \ to repeat the latest history list item that contains a string.\n* You can type\
    \ the sequence `!string` to repeat the latest history list item that starts with\
    \ a string.\n* You can type the sequence `!number` to repeat the latest history\
    \ list item.\n\n# Chapter Six: Process Commands\n\nToday’s operating systems are\
    \ capable of multitasking, which means they can do more than one thing at a time.\
    \ They switch rapidly between executing programs, and the Linux kernel manages\
    \ this. Linux uses processes to organize the programs queued for execution in\
    \ the CPU.\n\nSometimes, a computer system can become slow, or a specific application\
    \ might stop working. This chapter is designed to show you the command-line tools\
    \ you can use to terminate certain processes that don’t work properly during the\
    \ system operations.\n\nWhen your system wakes, certain activities are activated\
    \ as processes by the kernel. This is followed by a program called `init` being\
    \ launched. This program runs shell scripts known as `init` scripts, which are\
    \ used to start the system services. Lots of these services are implemented as\
    \ daemon programs, working in the background and doing what they have to do without\
    \ a user interface. You can find the `processes` command here:\n\n```\n[gha@localhost\
    \ ~]$ ps\n\nPID  TTY           TIME CMD\n    48  hvc0      00:00:00  sh\n    82\
    \  hvc0      00:00:00  ps\n```\n\nThe result lists process that are `sh` and `ps`\
    \ respectively. If we add an option to the command `ps`, we can detailed result\
    \ on our screens. See the following example.\n\n```\n[gha@localhost ~]$ ps x\n\
    \n  PID TTY      STAT    TIME COMMAND\n     1  ?          S       0:00  /bin/sh\
    \ /sbin/init\n     2  ?          S       0:00  [kthreadd]\n     3  ?         \
    \ I       0:00  [kworker/0:0]\n     4  ?          I<      0:00  [kworker/0:0H]\n\
    \     5  ?          I       0:00  [kworker/u2:0]\n     6  ?          I<      0:00\
    \  [mm_percpu_wq]\n     7  ?          S       0:00  [ksoftirqd/0]\n     8  ? \
    \         S       0:00  [kdevtmpfs]\n     9  ?          I<      0:00  [netns]\n\
    \    10  ?          S       0:00  [oom_reaper]\n    11  ?          I<      0:00\
    \  [writeback]\n    12  ?          I<      0:00  [crypto]\n    13  ?         \
    \ I<      0:00  [blockd]\n    14  ?          S       0:00  [swapd]\n    15  ?\
    \          I       0:00  [worker/0:1]\n    33  ?          S       0:00  [khvcd]\n\
    \    34  ?          Ss      0:00  [dhcp]\n    48  hvc         Ss      0:00  sh\n\
    \    71  ?          I       0:00  [worker/u2:1]\n   102 hvc         R+      0:00\
    \  ps\n```\n\nThe `x` option informs `ps` that it needs to show all the processes,\
    \ no matter what controls them. Because the system is running many processes,\
    \ a long list is produced, and more than not, it is helpful to pipe the `ps` output\
    \ into `less` and view them that way. Some combinations of options produce many\
