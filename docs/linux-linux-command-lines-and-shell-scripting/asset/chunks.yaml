  trans: "\n你可以重定向 shell 脚本中循环的输出，或将其管道输出以便使用。你需要一个处理命令来添加到 `done` 命令的最后。\n\n循环是许多编程语言（包括\
    \ Linux）中不可或缺的一部分，在 `bash` shell 中有三种可以在脚本中使用的循环命令。\n\n第一种是 `for` 命令，它允许你遍历命令行中的值列表、包含在变量中的值或通过文件通配符（globbing，用于文件提取）的值。\n\
    \n第二种是 `while` 命令，它提供了一种通过命令条件和普通命令进行循环的方法。通过这种方式，可以测试不同的变量条件，只要返回零退出状态，`while`\
    \ 循环就会继续迭代一组指定的命令。\n\n第三种是 `until` 命令，它提供了一种迭代命令的方法，但基于产生非零退出状态的命令或条件。使用此功能，你可以设置一个在迭代结束前必须满足的条件。可以通过产生不同的循环层在\
    \ shell 脚本中将循环配对。`bash` shell 提供了 `continue` 和 `break` 命令，我们用它们来改变多个循环值的正常循环流过程。\n\
    \n## 更多基础 Shell 脚本\n\n是一些你可以自己尝试的 bash shell 脚本的简单示例：\n\n### Hello World 程序\n\n\
    大多数新程序员都从学习帮助世界程序开始学习他们选择的语言。它是最简单的程序之一，功能只是向标准输出打印一个简单的字符串“Hello World”。在 Linux\
    \ 中，可以使用 `nano` 或 `vim` 等编辑器创建 `hello-world.sh` 文件，然后将下面的代码复制并粘贴进去：\n\n```bash\n\
    #!/bin/bash\n\necho \"Hello World\"\n```\n\n保存文件并退出。\n\n该文件需要使用下面的命令转变为可执行文件：\n\
    \n```bash\n$ chmod a+x hello-world.sh\n```\n\n然后，你可以使用以下命令之一运行文件：\n\n```bash\n\
    $ bash hello-world.sh\n$ ./hello-world.sh\n```\n\n结果是你传递给 `echo` 的字符串打印在屏幕上。\n\
    \n### 如何使用 echo 打印\n\n`echo` 命令将打印 bash 的信息，这与 C 语言中的 `printf` 函数相似。事实上，它们共享许多相同的选项，包括重定向和转义序列。\n\
    \n创建一个新文件并命名为 `echo.sh`。按照第一个示例中的说明将文件设为可执行：\n\n```bash\n#!/bin/bash\n\necho \"\
    Printing text\"\n\necho -n \"Print text without newline\"\n\necho -e \"\\nRemoving\
