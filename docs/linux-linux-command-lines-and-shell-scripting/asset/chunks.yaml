    ## 思考题


    当我们定义第一个函数时，shell 是遵循一系列命令被定义的。当我们在脚本中使用 `Myfunction1` 时，shell 立即定位了它。然而，我们的脚本在定义
    `Myfunction2` 之前就尝试使用它，导致了错误信息的产生。


