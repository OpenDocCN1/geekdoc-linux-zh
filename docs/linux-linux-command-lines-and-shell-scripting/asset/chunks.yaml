    当你处理 `for` 命令时，可能会遇到的最大问题是使用多单词值。`for` 循环假设每个值应该由空格分隔。如果你的数据值包含空格，可能会遇到另一个问题。你可以在美国州的示例中看到这一点，bash
    编辑器将 South 和 Dakota 视为两个独立的值。


    `for` 命令为提供了引号来分隔包含多个单词的值。你可以在 `for` 命令中使用双引号来分隔不同的值。请看以下示例。


    ```bash

    v=$ cat testing111


    #!/bin/bash


    # This is the basic for command in Linux


    for mytest in Alabama Texas "New York" Alaska Virginia Arizona Ohio Arkansas "South
    Dakota" California "North Dakota" "New Jersey" Florida Michigan Georgia "North
    Carolina" "South Carolina" "New Mexico" "Rhode Island" "West Virginia" "New Hampshire"
    Vermont

    do

    echo I am planning to continue my travel circle across the United States in the
    summer. The next state I will visit is $mytest

    done

    echo "The last US state I traveled to was $mytest"

    mytest=Connecticut

    echo "Now I am going to visit $mytest"

    ```


    '
- fmt: "\nI am planning to continue my travel circle across the United States in the\
    \ summer. The next state I will visit is Vermont.\n\nThe last US state I traveled\
    \ to was Vermont.\n\nNow I am going to visit Connecticut.\n\nNow the `for` command\
    \ can distinguish between the single word and multi-word values. Also, the best\
    \ thing is that when you are using double quotation marks, the shell sheds the\
    \ quotation marks as a part of the value.\n\n### Reading a List through a Variable\n\
    \nOften what happens inside a shell script is that you accumulate lists of values\
    \ that are stored inside a variable. Then it needs to iterate through a list.\
    \ You may do this with the help of the `for` command.\n\n```bash\n$ cat testing111\n\
    \n#!/bin/bash\n\n# This is the basic for command in Linux\n\nlist=\"Alabama Texas\
    \ New York Alaska Virginia Arizona Ohio Arkansas South Dakota California North\
    \ Dakota Colorado New Jersey Florida Michigan Georgia North Carolina South Carolina\
    \ New Mexico Rhode Island West Virginia New Hampshire Vermont\"\n\nlist=$list\"\
    \ Idaho\"\n\nfor state in $list\n\ndo\n\necho \"I am planning to continue my travel\
    \ circle across the United States in the summer. The next state I will visit is\
    \ $state\"\ndone\n\n$bash -f main.sh\n\nI am planning to continue my travel circle\
    \ across the United States in the summer. The next state I will visit is Alabama\n\
    \nI am planning to continue my travel circle across the United States in the summer.\
    \ The next state I will visit is Texas\n\nRight up to the last state:\n\nI am\
    \ planning to continue my travel circle across the United States in the summer.\
    \ The next state I will visit is Idaho\n```\n\nThe `list` variable contains the\
    \ list of values that have been used for iterations. You should take note that\
    \ the code uses another assignment statement for the concatenation of items to\
    \ the existing list. Even when you forget to add items in the list, you can add\
    \ them up by the concatenation method later on. I will add five more items to\
    \ the list in the next example.\n\n```bash\n$ cat testing111\n\n#!/bin/bash\n\n\
    # This is the basic for command in Linux\n\nlist=\"Alabama Texas Alaska Virginia\
    \ Arizona Ohio Arkansas California Colorado Florida Michigan Georgia Vermont Iowa\
    \ Nebraska Arkansas Kansas Kentucky Tennessee Utah Maine Missouri Minnesota\"\n\
    \nlist=$list\" Idaho\"\n\nlist=$list\" Oregon\"\n\nlist=$list\" Montana\"\n\n\
    list=$list\"Delaware\"\n\nfor state in $list\n\ndo\n\necho \"I am planning to\
    \ continue my travel circle across the United States in the summer. The next state\
    \ I will visit is $state\"\ndone\n\n$bash -f main.sh\n\nI am planning to continue\
    \ my travel circle across the United States in the summer. The next state I will\
    \ visit is Alabama\n\nI am planning to continue my travel circle across the United\
    \ States in the summer. The next state I will visit is Texas\n\nThis output continues\
    \ to list the states, right up to the last one:\n\nI am planning to continue my\
    \ travel circle across the United States in the summer. The next state I will\
    \ visit is Delaware\n```\n\nThere is a way to generate values for custom usage\
    \ in a list to use the output of a particular command.\n\n```bash\n$ cat testing111\n\
    \n#!/bin/bash\n\n# I will read values from files\n\nmyfile=\"states\"\n\nfor state\
    \ in `cat $myfile`\n\ndo\n\necho \"I am planning to continue my travel circle\
    \ across the United States in the summer. The next state I will visit is $state\"\
    \ndone\n\n$cat states\n\nAlabama\nTexas\nAlaska\nVirginia\nArizona\nOhio\nArkansas\n\
    California\nColorado\nFlorida\nMichigan\nGeorgia\nVermont\nIowa\nNebraska\nArkansas\n\
    Kansas\nKentucky\nTennessee\nUtah\nMaine\nMissouri\nMinnesota\nIdaho\nOregon\n\
    Montana\nDelaware\n```\n\n### The while Command\n\nThe `while` command is a cross\
    \ between the `if-then` statement and Linux `for` loop. It allows you to define\
    \ a command to test a condition and then looping through a set of commands until\
    \ you reach a zero exit status. It will analyze the test command at the start\
    \ of each iteration. Upon reaching the non-zero exit status, the `while` command\
    \ stops the execution of the set of commands.\n\n```bash\n$ cat test10\n\n#!/bin/bash\n\
    \n# This is a while command test in Linux\n\nvar15=20\n\nwhile [ $var15 -gt 0\
    \ ]\n\ndo\n\necho This is $var15 in the while loop.\n\nvar15=$[ $var15 - 1 ]\n\
    done\n\n$bash -f main.sh\n\nThis is 20 in the while loop.\nThis is 19 in the while\
    \ loop.\nThis is 18 in the while loop.\n\nThe loop continues to the final line:\n\
    \nThis is 1 in the while loop.\n```\n\n## Multiple Test Commands\n\nYou can pack\
    \ up multiple test commands in the `while` loop.\n\n```bash\n$ cat test1133\n\n\
    #!/bin/bash\n\n# Now I am testing a multicommand while loop in Linux shell\n\n\
    var15=20\n\nwhile echo $var15\n\n[ $var15 -ge 0 ]\n\ndo\n\necho \"This operation\
