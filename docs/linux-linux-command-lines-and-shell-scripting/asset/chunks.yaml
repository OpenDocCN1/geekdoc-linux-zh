    当从命令行启动 emacs 编辑器时，它会确定是否存在活跃的 X Window 会话并以图形模式启动。控制台模式版本使用了你需要学习的多个命令来编辑程序。需要使用键盘上的
    `CTRL` 和 `Meta` 键进行某些组合操作。通常，`Meta` 键映射到 PC 的 `ALT` 键，尽管在所有系统中可能并非如此。系统使用了缩写——`CTRL`
    缩写为 `C-`，`Meta` 缩写为 `M-`。


    ### emacs 编辑的基本命令


    从命令行编辑 emacs 文件，需要以下命令：


    ```

    emacs myfile.c

    ```


    当 emacs 控制台窗口打开时，你将看到一个简短的介绍和一个帮助屏幕。当按下某个键时，文件将加载到缓冲区中并显示文本。你可以在窗口顶部看到标准的菜单栏，但在控制模式下无法使用它，只有在图形模式下可以使用。与
    `vim` 编辑器不同，emacs 编辑器只有单一模式，你通过进入和退出插入模式来实现在插入命令和文本之间切换。当你输入可打印字符时，emacs 将其插入到光标当前位置；当输入命令时，该命令将被执行。要在缓冲区中移动光标，需要使用方向键以及
    `PageUp` 和 `PageDown` 键。移动光标的其他命令还包括：


    * 你可以使用 `C-p` 命令移动到文本的上一行。

    * 你可以使用 `C-n` 命令移动到文本的下一行。

    * 你可以使用 `C-b` 命令向后或向左移动一个字符。

    * 你可以使用 `C-f` 命令向前或向右移动一个字符。


    如果你希望进行更长距离跳跃，可以使用以下命令：


    * 你可以使用 `M-f` 命令移动到右侧的下一个单词。

    * 你可以使用 `M-b` 命令向左移动，回到上一个单词。

    * 你可以使用 `M-a` 命令移动到当前句子的开头。

    * 你可以使用 `M-e` 命令移动到当前句子的结束点。

    * 你可以使用 `C-e` 命令移动到当前句子的结束点。

    * 你可以使用 `C-a` 命令移动到当前句子的起始点。

    * 你可以使用 `M->` 命令移动到文本的最后一行。

    * 你可以使用 `M-<` 命令移动到文本的起始行。

    * 你可以使用 `M-v` 命令向后移动一个屏幕的数据。

    * 你可以使用 `C-v` 命令向前移动一个屏幕的数据。


    你可以使用以下命令将编辑器缓冲区保存为文件并退出 emacs 编辑器：


    * 你可以使用 `C-x C-s` 命令将你在当前缓冲区中编写的内容保存到文件中。

    * 你可以使用 `C-x C-c` 命令退出 emacs 编辑器并停止编辑器的操作。

    * 你可以使用 `C-z` 命令退出 emacs 编辑器。但是，该命令不会保持会话运行，因此你可能返回那里。


    ### 编辑数据


    emacs 编辑器在插入和删除文本方面非常强大。插入文本只需将光标移动到你想插入文本的位置并输入文本。退格键（backspace）用于删除光标位置正前的字符。删除键（delete）也用于删除光标处的字符。


    编辑器还提供了杀死（kill）文本的选项；删除文本与杀死文本的区别在于，当文本被杀死时，它会被放入临时区域并可以随时检索，而被删除的文本会被永久移除。Emacs
    提供了以下命令来杀死文本：


    * 你可以使用 `M-Backspace` 命令杀死光标当前位置之前的一个单词。

    * 你可以使用 `M-k` 命令杀死从光标当前位置到句子结束点的所有内容。

    * 你可以使用 `M-D` 命令杀死光标当前位置之后的一个单词。

    * 你可以使用 `C-k` 命令杀死从光标当前位置到行尾的所有内容。


    你还可以通过将光标移动到想要杀死的区域开头，按下 `C-spacebar` 或 `C-@`，然后将光标放在该区域的末端来大量杀死文本。然后按下 `C-w`，所有指定的文本都会被杀死。


    ## 常用 Linux 命令


    Linux 命令多到无法详细讨论，但我们已经涵盖了一些最常用的。如果你想知道任何 Linux 命令的作用，只需使用下面的语法和命令名访问它们的手动帮助页（manual
    page）：


    ```

    man command-name

    ```


    下表显示了更多命令，以及它们的语法和所需功能描述：


    | 命令 | 语法 | 描述 |

    | :--- | :--- | :--- |

    | adduser/addgroup | `$ sudo adduser` `$ sudo addgroup` | 这两个命令分别向系统添加用户或组 |

    | agetty | `$ agetty -L 9600 ttyS1 vt100` | 一个管理虚拟和物理终端的程序。由 `init` 调用，它打开一个 `tty`
    端口。 |

    | alias | `$ alias=''cd` | 创建快捷方式或别名到命令 |

    | apropos | `$ apropos adduser` | 搜索并显示命令的手页 |

    | apt | `$ sudo apt update` | Ubuntu 和 Debian 系统的软件包管理器 |

    | apt-get | `$ apt-get update` | 用于安装、删除和升级软件包的系统 |

    | aptitude | `$ aptitude update` | 基于文本的 Linux 软件包管理器 |

    | arch | `$ arch` | 显示机器架构名称 |

    | arp | `$ arp-scan --` | ARP 将 IP 地址到 MAC 地址——该命令 |

    | at | `$ sudo echo` | 在未来时间调度执行任务 |

    | atq | `$ atq` | 查看 `at` 命令队列中的任务 |

    | atrm | `$ atrm (job number)` | 按任务号删除 `at` 命令的任务 |

    | awk | `$ awk ''` | 用于文本处理和数据提取的程序 |

    | basename | `$ basename bin/find.sh` | 从绝对路径中打印文件名 |

    | bc | `$ echo 20.05 + 15.00` | 强大的命令行计算器语言——参见示例 |

    | bzip2 | `$ bzip2 -z filename` | 压缩或解压缩指定的文件 |

    | cal | `$ cal` | 打印日历 |

    | cat | `$ cat file.txt` | 查看文件内容，合并文件或数据并显示 |

    | chgrp | `$ chgrp (new) (old)` | 更改文件的组所有权。新在前在前旧在后 |

    | chmod | `$ chmod` | 更改指定文件的访问权限 |

    | chown | `$ chown` | 更改目录或文件的用户所有权 |

    | cksum | `$ cksum` | 显示输入文件的字节数和 CRC 校验和 |

    | clear | `$ clear` | 清除终端屏幕 |

    | cmp | `$ cmp file1 file2` | 按字节比较两个文件 |

    | comm | `$ comm file1 file2` | 按行比较排序后的文件 |

    | cp | `$ cp` | 将目录和文件从一处复制到另一处——必须指定位置 |

    | date | `$ date` | 显示并设置系统日期 |

    | df | `$ df -h` | 显示文件系统的磁盘使用情况 |

    | diff | `$ diff file1 file2` | 逐行比较指定文件，也可以查找目录间的差异 |

    | dir | `$ dir` | 类似于 `ls` 命令，列出目录内容 |

    | dmidecode | `$ sudo dmidecode` | 获取 Linux 系统的硬件信息 |

    | du | `$ du` | 显示目录及其相关子目录占用磁盘空间 |

    | echo | `$ echo` | 接收指定的文本并打印 |

    | eject | `$ eject` | 弹出 DVD、CD-ROM 和可移除介质 |


