    \ `tab` 来补全命令。需要注意的是，你不应该按下 `Enter` 键。\n\n### 补全命令\n\n* 键盘快捷键 `Alt-$` 将帮助你显示所有可能的补全列表。你也可以通过按两次\
    \ `Tab` 键来实现。这种操作要简单得多。\n* 键盘快捷键 `Alt-*` 将帮助你插入可能的补全项。当你打算使用多个匹配项时，这非常有用。\n\n\
    ## 搜索历史记录\n\nBash 会维护你在其中输入的命令历史记录。命令列表存储在家目录下一个名为 `.bash_history` 的文件中。历史功能对于减少你的输入量非常有用，特别是当你将其与命令行编辑结合时。这里是\
    \ `history` 命令的语法。\n\n```\n[gha@localhost ~]$ history | less\n```\n\nBash 默认存储你输入的最后\
    \ 500 条命令。假设你想找到以前列出 `/usr/bin` 的命令。以下是实现方法。\n\n```\n[gha@localhost ~]$ history\
    \ | grep /usr/bin\n```\n\n在浏览 `history` 命令时，你可以使用一系列按键组合。\n\n* 你可以使用键盘快捷键 `CTRL-P`\
    \ 移动到最新的历史条目。此操作与向上箭头相同。\n* 你可以使用键盘快捷键 `CTRL-N` 移动到下一个历史条目。此操作与向下箭头相同。\n* 你可以使用键盘快捷键\
    \ `ALT->` 移动到历史列表的末尾，即当前命令行所在的位置。\n* 你可以使用键盘快捷键 `ALT-<` 移动到历史列表的起点。\n* 你可以使用键盘快捷键\
    \ `CTRL-R` 进行反向增量搜索。此选项从当前命令行开始向上历史列表进行增量搜索。\n* 你可以使用键盘快捷键 `CTRL-O` 执行历史列表中的当前项并移动到下一个项。如果你正准备重新执行列表中的一系列命令，这非常方便。\n\
    * 你可以使用键盘快捷键 `ALT-N` 进行正向搜索。这不是增量搜索。\n* 你可以使用键盘快捷键 `ALT-P` 进行反向搜索。这也不是增量搜索。结合此快捷键，你可以在执行搜索之前输入搜索字符串并按下\
    \ `ENTER`。\n\n### 历史扩展\n\nshell 通过使用 `!` 字符为历史列表中的不同项目提供特殊类型的扩展。我们已经看到数字如何跟在感叹号后面，以插入历史列表中的特定条目。还有许多其他扩展功能。历史扩展机制有许多可用元素，但这个主题过于深奥。\n\
    \n* 你可以输入序列 `!!` 来重复最后一次命令。然而，按下向上箭头然后按 `ENTER` 可能更简单。\n* 你可以输入序列 `!?string` 重复包含该字符串的最新历史列表项。\n\
    * 你可以输入序列 `!string` 重复以该字符串头的最新历史列表项。\n* 你可以输入序列 `!number` 重复指定的历史列表项。\n\n# 第章：进程命令\n\
    \n如今的操作系统能够进行多任务处理，这意味着它们可以同时做多件事。它们在执行程序之间快速切换，由 Linux 内核进行管理。Linux 使用进程来组织在\
    \ CPU 中等待执行的程序。\n\n有时，计算机系统可能会变慢，或者特定的应用程序可能会停止工作。本章旨在向你展示可以使用命令行工具来终止在系统运行期间某些运行异常进程。\n\
    \n当你的系统启动时，内核会将某些活动作为进程激活。随后启动一个名为 `init` 的程序。该程序运行被称为 `init` 脚本的 shell 脚本，这些脚本用于启动系统服务。许多服务实现为守护进程（daemon），它们在后台运行并在没有用户界面的情况下完成它们必须做的工作。你可以在这里找到\
    \ `processes` 命令：\n\n```\n[gha@localhost ~]$ ps\n\nPID  TTY           TIME CMD\n\
    \    48  hvc0      00:00:00  sh\n    82  hvc0      00:00:00  ps\n```\n\n结果列出了分别为\
    \ `sh` 和 `ps` 的进程。如果我们为 `ps` 命令添加一个选项，我们就可以在屏幕上显示详细的结果。见下面的示例。\n\n```\n[gha@localhost\
    \ ~]$ ps x\n\n  PID TTY      STAT    TIME COMMAND\n     1  ?          S      \
    \ 0:00  /bin/sh /sbin/init\n     2  ?          S       0:00  [kthreadd]\n    \
    \ 3  ?          I       0:00  [kworker/0:0]\n     4  ?          I<      0:00 \
    \ [kworker/0:0H]\n     5  ?          I       0:00  [kworker/u2:0]\n     6  ? \
    \         I<      0:00  [mm_percpu_wq]\n     7  ?          S       0:00  [ksoftirqd/0]\n\
    \     8  ?          S       0:00  [kdevtmpfs]\n     9  ?          I<      0:00\
    \  [netns]\n    10  ?          S       0:00  [oom_reaper]\n    11  ?         \
    \ I<      0:00  [writeback]\n    12  ?          I<      0:00  [crypto]\n    13\
    \  ?          I<      0:00  [blockd]\n    14  ?          S       0:00  [swapd]\n\
    \    15  ?          I       0:00  [worker/0:1]\n    33  ?          S       0:00\
    \  [khvcd]\n    34  ?          Ss      0:00  [dhcp]\n    48  hvc         Ss  \
    \    0:00  sh\n    71  ?          I       0:00  [worker/u2:1]\n   102 hvc    \
    \     R+      0:00  ps\n```\n\n`x` 选项告诉 `ps` 它需要显示所有进程，无论由什么控制它们。由于系统正在运行许多进程，会产生一个很长的列表，通常情况下，通过管道传递给\
    \ `less` 查看它们是有帮助的。\n\n## 状态\n\n这里是进程状态的概述：\n\n* 进程状态 `R` 表示运行（running）。该进程正在运行或已就绪运行。\n\
    * 进程状态 `S` 表示睡眠（sleeping）。该进程处于睡眠模式并等待事件，如键入或网络数据包。\n* 进程状态 `Z` 表示僵尸（zombie）。该进程已终止，但父进程尚未清理它。\n\
    * 进程状态 `D` 表示不可中断睡眠。该进程正在等待 I/O，如磁盘驱动器。\n* 进程状态 `T` 表示停止（stopping）。该进程被指示停止。\n\
    * 进程状态 `N` 表示低优先级（low-priority）。当所有高优先级进程处理完成后，它将获得 CPU 时间。\n* 进程状态 `<` 表示高优先级。因为它，它可以获得更多的\
    \ CPU 时间。\n\n其他字符可能紧随其后，指示其他进程的特征。可以使用 `aux` 命令配合 `ps` 提供另一组选项：\n\n```\n[gha@localhost\
    \ ~]$ aux\n\nUSER  PID %CPU  %MEM    VSZ  RSS TTY START TIME COMMAND\nroot   \
    \    1   0.0   1.3    136  256  ?      S     4:35   0:00 /bin/sh /sbin/init\n\
    root       2   0.0   0.0      0   ?      S     4:35   0:00 [kthreadd]\nroot  \
    \     3   0.0   0.0      0   ?      I     4:35   0:00 [kworker/0:0]\nroot    \
    \   4   0.0   0.0      0   ?      I<     4:35   0:00 [kworker/0:0H]\nroot    \
    \   5   0.0   0.0      0   ?      I     4:35   0:00 [kworker/u2:0]\nroot     \
    \  6   0.0   0.0      0   ?      I<     4:35   0:00 [mm_percpu_wq]\nroot     \
    \  7   0.1   0.0      0   ?      S     4:35   0:02 [ksoftirqd/0]\nroot       8\
    \   0.0   0.0      0   ?      S     4:35   0:00 [kdevtmpfs]\nroot       9   0.0\
    \   0.0      0   ?      I<     4:35   0:00 [netns]\nroot      10   0.0   0.0 \
    \     0   ?      S     4:35   0:00 [oom_reaper]\n```\n\n"
