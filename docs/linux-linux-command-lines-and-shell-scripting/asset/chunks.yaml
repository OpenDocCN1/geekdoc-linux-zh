    ### 命令


    你的 Linux 文件系统与其他 UNIX 类系统类似，Linux 层次结构标准（File Hierarchy Standard）是其设计依据。以下是你可以探索的一些目录：


    - `/` 是根目录，是一切的起点。

    - `/bin` 是根目录，包含了系统启动所需的二进制文件或程序。

    - `/boot` 是包含 Linux 内核的目录。这是引导加载程序以及系统启动所需的驱动程序。

    - `/var` 是根目录，存储最可能变化的数据。你会在该目录下发现许多文件、数据库和用户邮件。

    - `/var/log` 是包含不同日志文件的根目录。它还包含系统活动的记录。该目录内的文件非常重要，你应该定期监控它。最有用的是 `/var/log/messages`。在某些系统上，你可能需要以超级用户登录才能访问日志文件。

    - `/tmp` 用于存储许多程序创建的临时文件。某些配置会导致系统每次重启时清空该目录。

    - `/usr` 是你的 Linux 操作系统最大的目录。它可能包含普通用户使用的某些程序和支持文件。

    - `/proc` 是一个特殊目录，因为它不是用于存储硬盘文件的文件系统。相反，它是内核维护的虚拟文件系统，文件是内核的快照、可读的，并能告诉你内核如何看待计算机。

    - `/root` 是操作 root 账户的主家目录。

    - `/usr/bin` 带有由 Linux 发行版安装的一些可执行程序。目录持有许多程序并不罕见。

    - `/usr/lib` 是位于 `/usr/bin` 不同程序的共享库。

    - `/usr/sbin` 加载了许多系统管理程序。


    '
- fmt: '

    - `/usr/local` is a tree that contains programs not part of the actual distribution
    but still needed for system-wide use. The programs compiled from the source code
    go into `/usr/local/bin`, and you will find this on a new install of the Linux
    system. However, until the system administrator adds files to it, it will remain
    empty.

    - `/usr/share` is packed up with shared data that the programs in `/usr/bin` use.
    This directory includes different things such as icons, configuration files, sound
    files, and screen backgrounds.

    - `/usr/share/doc` contains documentation files that are organized by the package.


    - `/lib` is filled up with shared library files that are used by core system programs.
    These programs are similar to DLLs in the Windows operating system.


    - `/mnt` is used in older Linux operating systems. The `/mnt` directory carries
    certain mount points for removable devices in the system. The condition is that
    the devices should be manually mounted.


    - `/lost+found` is used in case of a partial recovery from the filesystem’s corruption
    event. This directory stays empty until your system passes through something bad.


    - `/media` is used on modern Linux operating systems. The `/media` directory contains
    mount points for the removable media like CD-ROMs, USB drives, and any other device
    mounted automatically.


    # Chapter Three: Files & Directories Commands


    This chapter will walk you through the commands to navigate through files and
    directories in the Linux operating system. You can manipulate directories and
    files. Some of the tasks are easy to do. When you are using commands for navigation,
    you have more power and flexibility as compared to using a graphical user interface.
    While the latter option is easy to perform and is suitable to execute simple tasks,
    you need the command line for pulling off complicated tasks. Copying HTML files
    from one directory to another is hard in a graphical user interface; however,
    it is easier to do in a command-line system. Before I move on to exploring the
    commands that you can use to manipulate files and directories, I will explain
    some special characters that you can use in Linux.


    ## Special Characters


    When you are discussing Linux with others, you may hear about some special characters
    that Linux users encounter during operations. Each special character has a job
    to do, knowing which will make things easier for you.


    - `*` is technically called asterisk or star. It is used for a regular expression
    and as a glob character.

    - `''` is technically called tick or single quote. It is used for literal strings.

    - Special character `.` is technically called dot. It is used to denote the current
    directory you are working in or the hostname or file delimiter.

    - `$` is technically called the dollar sign. It is used for denotation of a variable
    or for representing the end of the line.

    - `\` is technically called backslash. It is used for macros and literals.

    - `/` is technically called forward slash. It is used as a search command or a
    directory delimiter.

    - `!` is technically called bang. It is used for command history and negation.

    - `|` is technically called a pipe. It is used for command pipes.

    - `_` is technically called an underscore or under. It is used for the cheap subtitle
    for some particular space.

    - `` ` ` is technically called backtick or backquote. It is used for the substitution
    of command.

    - `"` is technically called double quote. It is used for semi-literal strings.

    - `{}` is technically called braces or curly brackets. It is used for ranges or
    statement blocks.

    - `^` is technically called caret. It is used to denote the start of line and
    negation.

    - `[]` is technically squares or brackets. It is used for ranges.

    - `~` is technically called squiggle or tilde. It is used as a directory shortcut
    and negation.

    - `#` is technically called pound, hash, or sharp. It is used for preprocessor,
    comments, and substitutions.


    ## Command-Line Editing


    As you move around and explore the Linux shell, you will find out that you have
    the freedom to move in the shell through arrow keys. This comes as a standard
    on most Linux operating systems. It is a good idea to know about the standard
    keystrokes on Linux operating systems.


    - `CTRL-B` is used to move the cursor on the screen to the left side.

    - `CTRL-F` is used to move the cursor on the screen to the right side.

    - `CTRL-E` is used to move the cursor on the screen to the end of a line.

    - `CTRL-A` is used to move the cursor on the screen to the start of a line.

    - `CTRL-P` is used to view any previous commands on the screen. It is used to
    move the cursor upside.

    - `CTRL-N` is used to move the cursor to the downside, and it is also used to
    view the next command.

    - `CTRL-K` is used to erase everything from the cursor to the end of a line.

    - `CTRL-W` is used to erase the preceding word from the cursor on the screen.

    - `CTRL-U` is used to erase everything from the cursor to the start of a line.

    - `CTRL-Y` is used to paste the erased text that you have already cut off on the
    screen by the command `CTRL-U`. It is similar to copy and paste in word processors.


    ## Linux Commands for Directories


    The `mkdir` Linux command is used for the creation of directories. It works as
    the following:


    ```

    mkdir directoryname

    ```


    ### The cp command


    Another command, the `cp` command, is used to copy directories and files. You
    can use it in different ways, such as the following:


    ```

    cp file1 file2

    cp files… directoryname

    ```


    You can use the following options with the `cp` command.


    - The `cp` command option `-a` or `--archive` is used to copy the directories
    and files and their entire attributes, including permissions and ownerships. Usually,
    copies take on average default attributes of a user who is performing the copy
    action.

    - The `cp` command option `-u` or `--update` is used when you are copying from
    one directory to another, and you are copying files that do not exist or newer
    to the files in the destination directory.

    - The `cp` command option `-v` or `--verbose` is used to display the informative
    messages as you perform the copy.

    - The `cp` command option `-i` or `--interactive` is used before overwriting existing
    files, which prompts the user for confirmation. If you have not specified the
    option, the `cp` command will overwrite the existing files, which is not good
    for your document records.

    - The `cp` command option `-r` or `--recursive` is used to copy the contents and
    files recursively. This particular option is needed when you are copying directories.


    ### Examples of cp command


    - The Linux command `cp item1 item2` will copy the files of `item1` to the files
    of `item2`. If `item2` exists, it will be overwritten with the contents of `item1`.
    If it does not exist, the system will create it.

    - The Linux command `cp -i item1 item2` will copy the files of `item1` to the
    files of `item2`. However, the only exception is that if `item2` exists, the user
    will be prompted before the file is overwritten.

    - The Linux command `item1 item2 dir1` will copy contents of `item1` and `item2`
    into `dir1`. The directory `dir1` must exist before you execute this command.

    - The Linux command `cp dir1* dir2` uses a wildcard. It will copy all the files
    of `dir1` into `dir2`. The condition is that `dir2` must exist before the execution
    of the command.

    - The Linux command `cp -r dir1 dir2` will copy the directory `dir1` to the directory
    `dir2`. If `dir2` is non-existent, it will be created and will contain the same
    contents as the directory `dir1`.


    ### The mv command


    The `mv` Linux command performs movement and renaming of files based on how a
    user uses it. The original filename does not exist after you have executed the
    command. The `mv` command is used in the same way as the `cp` command.


    ```

    mv file1 file2

    ```


    Just like the `cp` command, the `mv` command comes with different options that
    are given as under:

