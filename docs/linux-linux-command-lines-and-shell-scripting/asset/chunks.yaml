    The shell scripting section can be tough. If you have a programming background,
    it is fun to read. To practice scripting, you will have to work in an editor,
    but don’t worry, you will find a chapter on Linux editors later in the book. You
    can write your own scripts or copy mine and paste them into the editor to practice.
    For convenience, I have included the results of each script so that you may compare
    them. I have also included lots of basic script examples on how to use commands.


    # Chapter One: What is Linux?


    As a Linux student, the first thing you should learn is Linux''s origins to understand
    the concept behind this operating system. Linux is a software layer between the
    hardware and the software in a computer operating system. It allows you to do
    productive things and create custom programs on your computer. In simple words,
    an operating system is a medium between the software and a computer system''s
    hardware. An operating system allows you to store data on your storage devices
    like hard drives, solid-state drives, and USBs. It manages the transmission of
    data from one element to another; for example, it oversees data flow from the
    operating system to printers in your office or home. If you have installed a normal
    Windows environment such as the Microsoft Windows operating system on your computer
    system, the Windows operating system runs the hardware. It controls the mouse,
    keyboard, printers, scanners, and other accessories. You will have to install
    Microsoft Office, Adobe readers, pdf converters, and other software as per your
    needs. You will pay for each program and have them installed on your system.


    Linux is the same as the Windows operating system regarding the process of controlling
    the hardware. It is different because it acts as a medium between the instructional
    code of the software and the physical device. The biggest difference is that of
    the software you will use in the Linux operating systems. The software will be
    of a different type as compared to the ones that run on Windows systems. You cannot
    install and run Microsoft Office or Adobe Photoshop on Linux environment. Linux
    runs different servers like web virtualization servers, Apache servers, database
    servers, etc.


    However, Linux has several distributions that are made for personal desktop computers.
    These distributions are similar to macOS and Windows operating systems. They run
    the same type of programs like word processors, image editors, and games. These
    Linux distributions appear to be more targeted for the home users searching for
    a free system alternative.


    Linux did not kick-off as an operating system or a challenger to the Windows operating
    system. In the start, Linux happened to be a kernel that was created by Linus
    Torvalds. Linus was a student then at the University of Helsinki. The kernel is
    still useful in the system. In the start, the Linux kernel was used along with
    the GNU operating system. You can say that the GNU system was incomplete without
    the kernel.


    A kernel is defined as an integral component of Linux. A kernel is considered
    the central part of operating systems, responsible for all the interfacing of
    applications and hardware. There are two types of kernels in the market now, namely
    Unix-like kernels and Windows kernels.


    ## The Birth of the Linux Operating System


    Between 1991 and 1994, Linus took a step further to create the Linux operating
    system. He combined the GNU OS with Linux Kernel. At the start, he wanted to create
    an operating system that did not come free, but instead, he needed something that
    he could customize to fit as per his programming needs. Linux appeared to be his
    pet project at the start. It was like a side hustle. UNIX is different from the
    Linux operating system.


    Linus built the entire Linux system from scratch. He created Linux because he
