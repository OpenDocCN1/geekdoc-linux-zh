- fmt: "\nWhen you start to write more complex scripts, there is every chance that\
    \ parts of your code performing specific tasks will need to be reused. That could\
    \ be something as simple as displaying a message multiple times to get answers\
    \ from users. Or it could be more complex, perhaps complicated calculations that\
    \ need to be used repeatedly in the script. No matter what it is, having to write\
    \ the code over and again starts to get tiring, but luckily, the `bash` shell\
    \ makes it easy. We simply write the code once and wrap it in a function. Name\
    \ it according to the contents and, when you need that piece of code anywhere\
    \ in the script, you can simply call the function name.\n\n## Function Creation\n\
    \nFunctions can be created in two formats. The first is using the keyword `function`\
    \ with the function name assigned to it. The function’s name attribute defines\
    \ the function, but the name should not be one of the reserved keywords; it should\
    \ be unique and relate to the function contents. The commands are made up of several\
    \ `bash` shell commands and when the function is called, the commands are executed\
    \ in the order they were written in the function.\n\nThe second format follows\
    \ the same function creation pattern used in other programming languages.\n\n\
    ```\n$ cat test15567\n\n#!/bin/bash\n\nfunction Myfunction1 {\necho \"You are\
    \ looking at the example of a Linux shell function.\"\n}\n\ncount=1\n\nwhile [\
    \ $count -le 10 ]\ndo\nMyfunction1\ncount=$[ $count + 1 ]\ndone\n\necho \"You\
    \ have reached the end of the loop.\"\nMyfunction1\necho \"This is the finishing\
    \ point of your Linux shell script. Where do you want to go now?\"\n\n$bash -f\
    \ main.sh\nYou are looking at the example of a Linux shell function.\nYou are\
    \ looking at the example of a Linux shell function.\nRepeated eight more times,\
    \ until the final line of:\nYou have reached the end of the loop.\nYou are looking\
    \ at the example of a Linux shell function.\nThis is the finishing point of your\
    \ Linux shell script. Where do you want to go now?\n```\n\nWhen the name, `Myfunction1`,\
    \ is referred to, the `bash` shell returns its definition and the commands defined\
    \ in it are executed. The definition does not need to be first in the shell script\
    \ but if you try using a function before the definition, an error message is thrown:\n\
    \n```\n$ cat test15567\n\n#!/bin/bash\n\ncount=1\n\necho \"You are seeing this\
    \ line that comes before the function definition.\"\n\nfunction Myfunction1 {\n\
    echo \"You are looking at the example of a Linux shell function.\"\n}\n\nwhile\
    \ [ $count -le 10 ]\ndo\nMyfunction1\ncount=$[ $count + 1 ]\ndone\n\necho \"You\
    \ have reached the end of the loop.\"\nfunction Myfunction2\necho \"This is a\
    \ definition of another function\"\n\n$bash -f main.sh\nYou are seeing this line\
    \ that comes before the function definition.\nYou are looking at the example of\
    \ a Linux shell function.\nRepeated nine more times, until the final line of:\n\
    You have reached the end of the loop.\nmain.sh: line 1: $: command not found\n\
    main.sh: line 17: syntax error near unexpected token `echo'\nmain.sh: line 17:\
    \ `echo \"This is a definition of another function\"`\n```\n\n## Food for thought\n\
    \nWhen we defined the first function, the shell was defined following a series\
    \ of commands. When we used `Myfunction1` in the script, it was immediately located\
    \ by the shell. However, our script attempted to use `Myfunction2` before it had\
    \ been defined, throwing an error message.\n\nThe point here is that a function\
    \ must be defined before it can be used in a script and you need to be careful\
    \ about function names. These must be unique, and they must not be keywords. Where\
    \ a function is redefined, the new definition overrides the previous one. What\
    \ is important here is that we didn’t get an error message on the screen but something\
    \ has definitely gone wrong; finding out what it is will be hard and these are\
    \ all things you need to keep in mind when you start writing Linux scripts.\n\n\
    ```\n$ cat test15567\n\n#!/bin/bash\n\ncount=1\n\nfunction Myfunction1 {\necho\
    \ \"You are looking at the example of a Linux shell function.\"\n}\n\nMyfunction1\n\
    \nfunction Myfunction1 {\necho \"This is a definition of another function\"\n\
    }\n\nMyfunction1\n\necho \"This Linux script ends here.\"\n\n$bash -f main.sh\n\
    You are looking at the example of a Linux shell function.\nThis is a definition\
    \ of another function\nThis Linux script ends here.\n```\n\n## Returning a Value\n\
