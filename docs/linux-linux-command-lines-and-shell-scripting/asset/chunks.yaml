    The command-line tools are good for solving computing problems, but they do not
    make you the master artist in the world of Linux. The shell makes you the master
    of Linux. You should know how the shell works and how you can write different
    types of scripts in a Linux shell. By learning the command line and Linux shell,
    you will be able to carry out a number of tasks by itself.


    A shell script, in the simplest terms, is a file that contains a series of commands.
    The shell will read the file and carry out the commands as though they have been
    entered on the command line. The shell emerges out as distinctive in that it is
    a robust command-line interface system as well as a scripting language interpreter.
    Most of the things that you can do on the command line can also be done inside
    shell scripts. Most of the things that you can do in shell scripts can also be
    done on the command line in Linux.


    We now have covered most of the shell scripting features; however, we have focused
    on the ones that are more often used on the command line. The shell gives us many
    features when we are writing programs.


    ## Writing the Shell Script


    Shell scripts are just like ordinary text files which is why you need a text editor
    to write the scripts. The best text editors will provide you syntax highlighting,
    which allows you to see a color-coded view of different script elements. Syntax
    highlighting will help you spot different kinds of common errors and use `kate`
    or `vim` to write shell scripts. The system is a bit fussy about blocking old
    text files to run as a program. All this happens for a good reason. You need to
    set up permissions of the script file to allow the execution. You should also
    put the script in a place where you can easily find it because the shell searches
    the file and executes it.


    ## The Format of Linux Shell Scripts


    I will now enter the writing phase and show you how you can write a shell script.
    The language of the script is simple. See the script as under:


    ```

    [gha@localhost ~]$ echo ''I am learning Linux''

    I am learning Linux

    ```


    This is shell scripting. Now I will add a comment to the same script.


    ```

    [gha@localhost ~]$ echo ''I am learning Linux'' # I have added a comment to the
    code.


    I am learning Linux

    ```


    Now you have to make the script executable. See the following:


    ```

    [gha@localhost ~]$ ls -1 Linux_learning

    [gha@localhost ~]$ chmod 755 Linux_learning

    ```


    The text `Linux_learning` is the name of the file in which I had saved the script.
    The `chmod` command is used to make the script executable in Linux.


    ## Displaying Text


    Most of the shell commands tend to produce a specific output, which is displayed
    on your console monitor where you are running the script. You may need to add
    text messages to help out the script user know what is going to happen inside
    the script. You can do this by using the `echo` command I have talked about in
    the past section. The `echo` command displays simple text strings. There are different
    techniques to write a script with the `echo` command. I will explore all of them.


    ```

    [gha@localhost ~]$ echo I am learning Linux shell scripting

    I am learning Linux shell scripting

    ```


    The most remarkable thing is that you do not have to use quotes to enclose the
    string text, as is the case with other programming languages. However, sometimes
    it becomes necessary to use quotes. Either you need single or double quotes to
    display the text strings.


    ```

    [gha@localhost ~]$ echo ‘I am learning Linux shell scripting.’

    I am learning Linux shell scripting

    ```


    In the next example, using quotes is going to be inevitable.


    ```

    [gha@localhost ~]$ echo ''Adam says, "I am learning Linux shell scripting."''

    Adam says, “I am learning Linux shell scripting."

    ```


    You can see that when you have to add a text that is in the form of direct speech,
    you will have to add quotation marks to the text.


    ## The if-then Statement


    Many Linux shell scripting programs require some logic flow control between different
    commands inside the script, which means that the shell tends to execute different
    commands. In addition, it keeps the ability to execute different other commands
    that permit the script to loop through the commands based on the result of different
    other commands. We refer to them as structured commands. They are also known as
    conditionals.


    Structured commands allow you to shift the flow of the operations of a program.
    Some commands are executed, while others are skipped when they are caught up in
    certain conditions. In other programming languages, the object after an `if` statement
    is the equation that the system evaluates for True or False grounds. The `bash`
    shell `if` statement does not work that way. Instead, it runs the command that
    is defined on the `if` line. If this command''s exit status is considered zero,
    the commands that are listed under the `then` section tend to execute. If this
    command''s exit status is something else, the `then` commands are put on hold,
    and the `bash` shell jumps over to the next command in the script.


    ```

    $ cat testing5


    #!/bin/bash


    # I am now testing the if statement for bash shell


    if date

    then

    echo "The structured command has completely worked"

    fi


    $bash -f main.sh

    Tue Jan 26 05:02:54 UTC 2021

    The structured command has completely worked

    ```


    The script used the `date` command. Since the exit status was zero, it will execute
    the `echo` statement. In the next example, I will test a bad command to see how
    it works.


    ```

    $ cat testing2


    #!/bin/bash


    # It is time to run a test on a bad command


    if gjdksll

    then

    echo "it is not going to work"

    fi

    echo "I cannot run the command because you’re out of the if statement."


    $bash -f main.sh

    I cannot run the command because you’re out of the if statement

    ```


    Since the above command was a bad command, it produced an exit status that is
    at the moment non-zero. The shell will skip the `echo` statement in the `then`
    section.


    ## The if-then-else Statement


    The `if-then` statement provides one option to determine whether the command is
    successful. If a non-zero exit status code is returned, the `bash` shell goes
    to the next script command. In a situation like this, it would best if we had
    another set of commands we could execute, and that is where the `if-then-else`
    statement comes in.


    If the `if-statement` command produces the exit status zero, the commands in the
    `then` part of the statement are executed. If a non-zero exit status code is returned,
    the commands in the `else` part of the statement are executed.


    ```

    $ cat testing4


    #!/bin/bash


    # I am now going to test the else section


    testinguser=thisisabadtest


    if grep $testinguser /etc/passwd

    then

    echo The files for user $testinguser are:

    ls -a /home/$testinguser/.b*

    else

    echo "The user name $testinguser cannot be found on the system"

    fi


    $ ./test4

    The user name thisisabadtest cannot be found on the system


    $bash -f main.sh

    The user name thisisabadtest cannot be found on the system

    ```


    On occasion, you may need to check things in the script code. Rather than separate
    `if-then` statements, a different version of the `else` statement can be used.
    This is called the `elif`, and this continues the `else` statement with a subsequent
    `if-then` statement. It provides a different evaluation command, which is much
    like the first `if` statement. If a zero exit status code is returned, the commands
    in the second `then` statement are executed by the `bash` shell.

