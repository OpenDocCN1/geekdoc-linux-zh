    You have reached the end of the loop.


    You are looking at the example of a Linux shell function.


    This is the finishing point of your Linux shell script. Where do you want to go
    now?


    When the name, Myfunction1, is referred to, the bash shell returns its definition
    and the commands defined in it are executed. The definition does not need to be
    first in the shell script but if you try using a function before the definition,
    an error message is thrown:


