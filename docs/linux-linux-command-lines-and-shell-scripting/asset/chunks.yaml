    Shell 脚本部分可能会有些困难。如果你有编程背景，读起来会很有趣。为了练习脚本，你需要在编辑器中进行操作，但不用担心，你会在书的后面部分看到一个关于 Linux
    编辑器的章节。你可以编写自己的脚本，或者复制我的脚本并粘贴到编辑器中进行练习。为了方便起见，我包含了每个脚本的运行结果以便你进行比较。我还包含了许多如何使用命令的基础脚本示例。


    # 第一章：什么是 Linux？


    作为一名 Linux 学习，你首先应该学习的是 Linux 的起源，以理解这个操作系统背后的概念。Linux 是计算机操作系统中硬件和软件之间的一个软件层。它允许你在计算机上进行高效工作并创建自定义的程序。简单来说，操作系统是软件与计算机系统硬件之间的中介。操作系统允许你将数据存储在硬盘、固态硬盘和
    USB 闪盘等存储设备上。它管理数据从一个元素到另一个元素的传输；例如，它负责监督从操作系统流到你办公室或家里打印机的数据流。如果你在计算机系统上安装了普通的
    Windows 环境（如微软 Windows 操作系统），那么 Windows 操作系统就会运行硬件。它控制鼠标、键盘、打印机、扫描仪和其他配件。你将根据需要安装
    Microsoft Office、Adobe 阅读器、PDF 转换器和其他软件。你需要为每个程序付费并将它们安装在你的系统上。


    Linux 在控制硬件的过程与 Windows 操作系统是相同的。它的不同之处在于，它充当了软件指令代码与物理设备之间的中介。最大的区别在于你将在 Linux
    操作系统中使用的软件。与在 Windows 系统上运行的软件类型不同。你无法在 Linux 环境中安装和运行 Microsoft Office 或 Adobe
    Photoshop。Linux 运行不同的服务器，如 Web 虚拟化服务器、Apache 服务器、数据库服务器等。


    然而，Linux 也有几个为个人桌面计算机设计的发行版。这些发行版类似于 macOS 和 Windows 操作系统。它们运行相同类型的程序，如文字处理器、图像编辑器和游戏。这些
    Linux 发行版似乎更针对寻找免费系统替代的家庭用户。


    Linux 并不是作为一个操作系统或 Windows 操作系统的挑战者而诞生的。起初，Linux 恰好是由纳斯·托瓦尔斯（Linus Torvalds）创建的一个内核。当时林纳斯是赫尔辛基大学的一名学生。内核在系统中仍然有用。起初，Linux
    内核与 GNU 操作系统一起使用的。你可以说，没有内核，GNU 系统就是不完整的。


    内核被定义为 Linux 中不可或缺的组件。内核被认为是操作系统的核心部分，负责应用程序和硬件的所有接口。目前市场上上有两种内核，即类 Unix 内核和 Windows
    内核。


    ## Linux 操作系统的诞生


    在 1991 年到 1994 年之间，林纳斯更进一步创建了 Linux 操作系统。他将 GNU 操作系统与 Linux 内核结合在一起。最初，他想创建一个免费的操作系统，但相反，他需要一个可以自定义以适应他编程需求的东西。Linux
    起初看起来是他的个人项目。它像是一份副业。UNIX 与 Linux 操作系统不同。


    林纳斯从零开始构建整个 Linux 系统。他创建 Linux 是因为他希望为人们构建一个开源操作系统。那时，UNIX 并不是开源的。人们必须付给别人才能使用
    UNIX。同样，微软也是一个付费的操作系统。


    因此，Linux 产生了开源操作系统的想法。他与来自马萨诸塞理工学院（MIT）的朋友们一起完善了这一想法。除了构建开源操作系统外，他们还需要一种易用且高效的操作系统，以便他们自定义以满足他们的编程需求。


    ## Linux 发行版


    当林纳斯创建 Linux 操作系统时，他停止工作了一段时间。在那期间，他公开了操作系统的代码。这让每个人都能参与系统的创建。科学家和计算机极客也开始研究这个概念。他们根据自己的认为对操作系统进行修改。


    主要的教育机构和公司喜欢这个新操作系统的概念，因为每个拥有源代码的人都可以在自己的计算机上安装 Linux。人们就是这样开始创建不同版本的 Linux 操作系统。加利福尼亚大学伯克利分校的学生尝试开始创建一个版本。来自中国的人以及不同职业的人也开始创建版本以满足他们个人需求的版本。


    源代码对公众可用促进了发行版（distros or distributions）的创建。发行版是人们随着时间推移而创建的 Linux 不同版本。Linux
    有不同的版本，它的许多发行版提供了多种功能。当你需要决定要使用哪种 Linux 发行版时，你必须决定你想让计算机通过 Linux 做什么。我将通过与 Windows
    操作系统的类比来解释这一点。当我们在计算机上安装微软 Windows 操作系统时，每个发行版都是为了以特定的方式完成任务。


    Linux 有一个版本被称为 Trustix。Linux Trustix 被标记为市场上最安全的 Linux 操作系统。它就像是一块砖。你设置好 Linux
    Trustix 后，除非你做了极其愚蠢的事情，否则没有人能破解它。病毒无法潜入。它是一个安全且稳固的服务器。然而，在获取源代码并安装系统之前，你必须决定是否真的需要一个安全的服务器。


    如果你正在寻找可以用于某些办公应用程序的计算机，你可能需要 Linux 桌面版。如果你在寻找一个超安全的计算机，那么你可能需要 Linux Trustix。如果你期待得到带有企业级支持的产品，你可能需要使用配合技术支持中心的
    Linux 发行版来帮助提供帮助。在这种情况下，红帽 Linux（Red Hat Linux）将是你需要的答案。再次，你必须决定你想让计算机做什么，以确定在计算机系统上安装最合适的
    Linux 发行版。


    ## Linux 是开源的


    现在你已经学习了 Linux 的起源及其发行版，是时候转向开源许可概念了，这让 Linux 不同于其他操作系统。Linux 拥有开源许可。你可能在人生的某个时候听过开源软件。开源并不意味着你的软件是免费使用的。如果你把所有开源软件都视为免费的，你将处于危及你的编程职业和公司的边缘。这在法律上是不好的；因此，我们必须讨论开源软件以消除歧义。


    开源软件意味着每当程序员为软件编写代码时，他们都会把代码给你看他们最初是如何编写程序的。这并不意味着该程序是免费使用的。开源供应商有不同的付费方式。


