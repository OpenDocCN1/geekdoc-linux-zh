    这是最终结果：91


    ## 处理用户输入


    你已经学习了如何在 Linux 操作系统上编写与数据、文件和变量进行交互的 shell 脚本。然而，有时你可能需要编写一个必须与运行脚本的人进行交互的脚本。shell
    为我们提供了几种方法从用户那里获取数据，包括一些命令行参数、命令行选项以及从键盘读取输入。本章将引导你如何在 bash shell 脚本中结合不同的方法，以从运行脚本的人那里获取数据。


    称为位置参数的变量由 bash shell 分配给命令行参数，包括由 shell 执行的程序名称。我们使用标准数字作为位置参数变量——`$0` 是程序名，`$1`
    是第一个参数，`$2` 是第二个参数，以此此类推直到 `$9`。


    ## 结论


    现在你已经读到了书的最后，你应该已经掌握了 Linux 命令行和 shell 脚本编写。与其他操作系统不同，Linux 操作系统是复杂的。你无法看到可以使用鼠标操作的图形界面。正是这种“全键盘”的特性让
    Linux 变得难以学习。但是，只要口袋里有这本书，并不难。当你操作 Linux 命令行或跳转到编辑器编写 shell 脚本时，可以使用这本书作为参考指南。保持一致并定期练习代码将帮助你比仅仅阅读脚本更快地学习命令和代码。


    将这本书放在身边，你将随时随地掌握键盘快捷键和命令。现在，让我们开始 Linux 之之旅吧！


