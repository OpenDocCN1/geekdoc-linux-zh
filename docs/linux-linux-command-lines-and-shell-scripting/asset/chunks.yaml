    ## 如何从 Shell 脚本发送邮件


    在 bash 脚本中发送电子邮件非常简单。在下面的示例中，你可以看到实现这一点的方法：


    ```bash

    #!/bin/bash


    recipient=" admin@example.com"


    subject=" Greetings"


    message=" Welcome to UbuntuPit"


    mail -s $subject $recipient <<< $message

    ```


    这将向指定的收件者发送带有指定主题行和内容的电子邮件。


    ## 如何解析日期和时间


    在下一个脚本示例中，你可以看到如何使用脚本处理时间和日期。我们使用 `data` 命令获取所需的信息，脚本将进行必要的解析：


    ```bash

    #!/bin/bash


    year=`date +%Y`

    month=`date +%m`

    day=`date +%d`

    hour=`date +%H`

    minute=`date +%M`

    second=`date +%S`


    echo `date`


    echo "Current Date is: $day-$month-$year"


    echo "Current Time is: $hour:$minute:$second"

    ```


    保存并运行该程序以查看其工作原理，也可以从你自己的终端运行 `date` 命令。运行此程序查看它是如何工作的。此外，尝试从你的终端运行 `date` 命令。


    ## 如何使用 Sleep 命令


    你可以使用 `sleep` 命令让你的 shell 脚本在每个指令之间暂停。这对于很多事情都有用，包括你想执行系统级任务时。在下一个示例中，可以看到 `sleep`
    命令在 shell 脚本中工作：


    ```bash

    #!/bin/bash


    echo "How long should you wait?"


    read time


    sleep $time


    echo "Waited for $time seconds!"

    ```


    程序将停止的时间时间内执行最后一条指令——该时间由用户提供。


    ## 如何使用 Wait 命令


    我们可以使用 `wait` 命令暂停 bash 脚本的系统进程。下面的示例详细演示了这在 bash 脚本中是如何工作的：


    ```bash

    #!/bin/bash


    echo "Testing the wait command"


    sleep 5 &


    pid=$!


    kill $pid


    wait $pid


    echo $pid was terminated.

    ```


    保存并运行该程序，亲眼观察它是如何运行的。


    ## 如何显示最后更新的文件


    有时，你可能需要找到最后更新的文件——这对于特定的操作可能是需要的。下面你可以看到一个简单的程序，展示了如何在 bash 中使用 `awk` 命令来实现此。它将列出两种情况之一——最后更新的文件或当前工作目录下最后创建的文件。


    ```bash

    #!/bin/bash


    ls -lrt | grep ^- | awk ''END{print $NF}''

    ```


    将此代码复制到文件中并运行，查看它是如何工作的。


    ## 如何添加批量扩展名


    在下面的程序中，我们正在对指定目录内的每个文件应用自定义扩展名。为了演示，请创建一个新目录并放入几个文件。在我的文件夹中，我有五个文件。每个文件都名为 `test`
    后跟一个 0 到 4 之间的数字。为了演示，脚本将在每个文件的末尾添加 `.UP`——你可以添加任何想要的扩展名，只需确保相应地修改脚本。


    ```bash

    #!/bin/bash


    dir=$1


    for file in `ls $1/*`


    do


    mv $file $file.UP


    done

    ```


    一个重要的注意事项——你不应该尝试在普通目录下运行此脚本，只能在测试目录下运行。你还必须提供一个包含文件目录名的命令行参数——点（`.`）应用于当前工作目录。


    ## 如何打印文件或目录的数量


    下面的脚本将使用 Linux 提供的 `find` 命令来查找指定目录中有多少个文件夹或文件。你查找文件的目录名称应从命令行传递。


    ```bash

    #!/bin/bash


    if [ -d "$@" ]; then


    echo "Files found: $(find "$@" -type f | wc -l)"


    echo "Folders found: $(find "$@" -type d | wc -l)"


    else


    echo "[ERROR] Please retry with another folder."


    exit 1


    fi

    ```


    如果你指定的目录不可用，你会被要求尝试另一个目录。如果你没有访问指定目录的权限，也会出现相同的消息。


    ## 如何清理日志文件


    在下一个演示中，你可以看到 shell 脚本如何轻松地应用于现实生活中。我们将删除存储在 `/var/log` 目录中的每个日志文件。如果你想清理不同的日志，只需更改存储目录的变量：


    ```bash

    #!/bin/bash


    LOG_DIR=/var/log


    cd $LOG_DIR


    cat /dev/null > messages


    cat /dev/null > wtmp


    echo "Logs cleaned up."

    ```


    重要——此 shell 脚本必须以 root 身份运行。


    ## 使用 Bash 备份你的脚本


    Shell 脚本提供了一种备份目录和文件的强大且有效的方法。在下一个示例中，你可以看到如何备份过去 24 小时内修改过的每个文件和目录。Linux 的 `find`
    命令用于此。


    ```bash

    #!/bin/bash


    BACKUPFILE=backup-$(date +%m-%d-%Y)


    archive=${1:-$BACKUPFILE}


    find . -mtime -1 -type f -print0 | xargs -0 tar rvf "$archive.tar"


    echo "Directory $PWD backed up in archive file \"$archive.tar.gz\"."


    exit 0

    ```


    备份成功完成后，将打印文件和目录名称。


    ## 如何查看用户是否为 Root


    要查看用户是否为 root，在下一个示例中你可以看到 bash 脚本的使用：


    ```bash

    #!/bin/bash


    ROOT_UID=0


    if [ "$UID" -eq "$ROOT_UID" ]


    then


    echo "You are root."


    else


    echo "You are not root"


    fi

    ```


    输出完全取决于哪个用户运行了脚本。


    ## 如何从文件中删除重复行


    处理文件可能花费大量时间，并严重降低生产力，但一个简短简单的脚本可以解决问题：


    ```bash

    #! /sh


    echo -n "Enter the Filename-> "


    read filename


    if [ -f "$filename" ]; then


    sort $filename | tee sorted.txt


    else


    echo "No $filename intry again"


    fi


    exit 0

    ```


    此脚本将检查每一行并删除任何重复项。这些行会被放入新文件中，而原始文件保持不变。


    # 第九章：Linux Shell 脚本函数


    在编写脚本时，你很有可能在多个地方使用相同的代码。如果代码很短，重写并不是大问题，但当你有大量代码需要在多个处使用时，就会变得繁琐。bash 提供了解决方案——封装。通过这种方式，代码被封装在函数中，可以在代码的任何需要的地方使用。


