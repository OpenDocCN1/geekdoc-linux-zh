    operating system is complicated. You don’t get to see a graphical interface where
    you can work with a mouse. It is the “all-keyboard” thing that makes Linux hard
    to learn. However, it is not that hard with this book in your pocket. You can
    use this book as a reference guide whenever you operate the Linux command line
    or jump to the editor to write shell scripts. Being consistent and regularly practicing
    with codes will help you learn the commands and codes faster than just reading
    the scripts.


    Keep this book by your side and you’ll always have keyboard shortcuts and commands
