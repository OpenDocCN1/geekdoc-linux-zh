    \ if they do not exist.\nMandatory arguments to long options are mandatory for\
    \ short options too.\n-m, --mode=MODE set file mode (as in chmod), not a=rwx umask\n\
    ```\n\n### The man command\n\nMost executable programs intended for command-line\
