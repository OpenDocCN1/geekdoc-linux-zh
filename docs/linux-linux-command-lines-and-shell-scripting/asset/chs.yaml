  \ hello-world.sh\n$ ./hello-world.sh\n```\n\n结果是你传递给 `echo` 的字符串打印在屏幕上。\n\n### 如何使用\
  \ echo 打印\n\n`echo` 命令将打印 bash 的信息，这与 C 语言中的 `printf` 函数相似。事实上，它们共享许多相同的选项，包括重定向和转义序列。\n\
