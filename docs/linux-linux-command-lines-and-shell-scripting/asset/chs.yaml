  \ `'` 和 `'` 之间。\n\n### 如何使用 While 循环\n\n当你想要运行多次指令时，使用 `while` 循环。看看下面的脚本它是如何工作的：\n\
  \n```bash\n#!/bin/bash\n\ni=0\n\nwhile [ $i -le 2 ]\ndo\n\necho Number: $i\n\n((i++))\n\
