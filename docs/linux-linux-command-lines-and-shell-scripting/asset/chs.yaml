  \ 命令的最后。\n\n循环是许多编程语言（包括 Linux）中不可或缺的一部分，在 `bash` shell 中有三种可以在脚本中使用的循环命令。\n\n第一种是\
  \ `for` 命令，它允许你遍历命令行中的值列表、包含在变量中的值或通过文件通配符（globbing，用于文件提取）的值。\n\n第二种是 `while` 命令，它提供了一种通过命令条件和普通命令进行循环的方法。通过这种方式，可以测试不同的变量条件，只要返回零退出状态，`while`\
  \ 循环就会继续迭代一组指定的命令。\n\n第三种是 `until` 命令，它提供了一种迭代命令的方法，但基于产生非零退出状态的命令或条件。使用此功能，你可以设置一个在迭代结束前必须满足的条件。可以通过产生不同的循环层在\
  \ shell 脚本中将循环配对。`bash` shell 提供了 `continue` 和 `break` 命令，我们用它们来改变多个循环值的正常循环流过程。\n\
  \n## 更多基础 Shell 脚本\n\n是一些你可以自己尝试的 bash shell 脚本的简单示例：\n\n### Hello World 程序\n\n\
  大多数新程序员都从学习帮助世界程序开始学习他们选择的语言。它是最简单的程序之一，功能只是向标准输出打印一个简单的字符串“Hello World”。在 Linux\
  \ 中，可以使用 `nano` 或 `vim` 等编辑器创建 `hello-world.sh` 文件，然后将下面的代码复制并粘贴进去：\n\n```bash\n\
  #!/bin/bash\n\necho \"Hello World\"\n```\n\n保存文件并退出。\n\n该文件需要使用下面的命令转变为可执行文件：\n\n\
  ```bash\n$ chmod a+x hello-world.sh\n```\n\n然后，你可以使用以下命令之一运行文件：\n\n```bash\n$ bash\
  \ hello-world.sh\n$ ./hello-world.sh\n```\n\n结果是你传递给 `echo` 的字符串打印在屏幕上。\n\n### 如何使用\
  \ echo 打印\n\n`echo` 命令将打印 bash 的信息，这与 C 语言中的 `printf` 函数相似。事实上，它们共享许多相同的选项，包括重定向和转义序列。\n\
  \n创建一个新文件并命名为 `echo.sh`。按照第一个示例中的说明将文件设为可执行：\n\n```bash\n#!/bin/bash\n\necho \"\
  Printing text\"\n\necho -n \"Print text without newline\"\n\necho -e \"\\nRemoving\
  \ \\t special \\t characters\\n\"\n```\n\n运行此脚本查看它的作用。脚本中有两个选项：`-n` 用于换行，而 `-e`\
  \ 告诉 `echo` 你传递了一个包含某些特殊字符的字符串，它需要额外的功能。\n\n### 如何使用注释\n\n注释是任何脚本中最实用的部分之一，对于高质量的代码来说是必须的。它们告诉编写者和其他阅读代码的人这段代码的作用，但不应该是冗长且啰嗦的——保持简洁明了。通常做法是在包含关键逻辑的代码内部放置注释。`#`\
  \ 符号用于注释一行，如下例所示：\n\n```bash\n#!/bin/bash\n\n# 加两个值\n\n((sum=25+45))\n\n# 输出结果\n\
  \necho $sum\n```\n\n脚本将给出 70 的结果。看看第一行之外每一行之前是如何使用注释的。第一行是 shebang，它告诉系统应该使用哪个解释器来运行脚本。\n\
  \n### 如何使用多行注释\n\n某些程序员使用多行注释来记录他们的脚本，你可以从下面看到是如何实现的：\n\n```bash\n#!/bin/bash\n\n\
  : '\n\n此脚本将计算\n5 的平方。\n'\n\n((area=5*5))\n\necho $area\n```\n\n多行注释不使用 `#`；相反，它们被包含在\
  \ `'` 和 `'` 之间。\n\n### 如何使用 While 循环\n\n当你想要运行多次指令时，使用 `while` 循环。看看下面的脚本它是如何工作的：\n\
  \n```bash\n#!/bin/bash\n\ni=0\n\nwhile [ $i -le 2 ]\ndo\n\necho Number: $i\n\n((i++))\n\
  done\n```\n\n`while` 循环的形式如下所示：\n\n```bash\nwhile [ condition ]\ndo\n\ncommands\
  \ 1\ncommands n\ndone\n```\n\n你必须包含括号周围的空格——这不是可选的；而是强制的。漏掉会导致错误。\n\n### 如何使用 For\
  \ 循环\n\n另一个流行且深受喜爱的构造是 `for` 循环。它用于对一组代码进行高效迭代，你可以在这里看到一个简单的示例：\n\n```bash\n#!/bin/bash\n\
  \nfor (( counter=1; counter<=10; counter++ ))\ndo\n\necho -n \"$counter \"\ndone\n\
  \nprintf \"\\n\"\n```\n\n创建一个文件并命名为 `for.sh`，保存此代码并使其变为可执行。然后运行它，你应该能在屏幕上看到打印从 1\
  \ 到 10 的数字。\n\n### 如何接收用户输入\n\n在 bash shell 脚本中实现用户交互是关键的，这要求你获取用户输入。下面的示例显示如何在\
  \ shell 程序中获取用户输入：\n\n```bash\n#!/bin/bash\n\necho -n \"Enter anything:\"\n\nread\
  \ anything\n\necho \"You Entered: $anything.\"\n```\n\n### 如何使用 If 语句\n\n`if` 语句是最常用的结构。`fi`\
  \ 标记语句的结束：\n\n```bash\nif CONDITION\nthen\n\nSTATEMENTS\n```\n\n当 `CONDITION` 为真时，执行语句。在如下例所示：\n\
  \n```bash\n#!/bin/bash\n\necho -n \"Enter a number: \"\n\nread num\n\nif [ $num\
  \ -gt 10 ]\nthen\n\necho \"is greater than 10.\"\n```\n\n### 如何使用 Else\n\n你可以通过结合\
  \ `else` 和 `if` 来获得逻辑的更多控制权：\n\n```bash\n#!/bin/bash\n\necho -n \"Enter a number:\
  \ \"\n\nread num\n\nif [ $num -lt 10 ];\nthen\n\necho \"is a one-digit number.\"\
  \n\nelse\n\necho \"is a two-digit number.\"\n\nfi\n```\n\n### 如何使用 AND 运算符\n\n我们可以使用\
  \ AND 运算符检查多个条件是否已满足。运算符的每个部分都必须为真；否则，AND 语句将只返回假。看看下面的脚本：\n\n```bash\n#!/bin/bash\n\
  \necho -n \"Enter Number:\"\n\nread num\n\nif [[ ( $num -lt 10 ) && ( $num%2 -eq\
  \ 0 ) ]]; then\n\necho \"Even Number\"\n\nelse\n\necho \"Odd Number\"\n\nfi\n```\n\
  \n### 如何使用 OR 运算符\n\n另一个重要的构造是 OR 运算符。它帮助我们在脚本中实现健壮且复杂的逻辑。与 AND 运算符不同，OR 语句只要有一个操作数为真就会返回真。只有当\
  \ OR 运算符两侧的操作数都为假时，才会返回假。这是一个例子：\n\n```bash\n#!/bin/bash\n\necho -n \"Enter any\
  \ number:\"\n\nread n\n\nif [[ $n -eq 15 || $n -eq 45 ) ]]\nthen\n\necho \"You won\"\
  \n\nelse\n\necho \"You lost!\"\n\nfi\n```\n\n### 如何使用 Elif\n\n`elif` 语句意味着 \"else-if\"\
  ，用于实现链式逻辑。看看这个例子它是如何工作的：\n\n```bash\n#!/bin/bash\n\necho -n \"Enter a number: \"\
  \n\nread num\n\nif [[ $num -gt 10 ]]\nthen\n\necho \"Number is greater than 10.\"\
  \n\nelif [[ $num -eq 10 ]]\nthen\n\necho \"Number is equal to 10.\"\n\nelse\n\n\
  echo \"Number is less than 10.\"\n\nfi\n[/content] (抱歉，由于之前的处理出现了重复和格式混乱，此处是最终整理的译文)\
