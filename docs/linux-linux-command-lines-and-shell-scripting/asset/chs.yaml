  \n### 如何使用 OR 运算符\n\n另一个重要的构造是 OR 运算符。它帮助我们在脚本中实现健壮且复杂的逻辑。与 AND 运算符不同，OR 语句只要有一个操作数为真就会返回真。只有当\
