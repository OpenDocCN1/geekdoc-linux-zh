  \n\nelse\n\necho \"is a two-digit number.\"\n\nfi\n```\n\n### 如何使用 AND 运算符\n\n我们可以使用\
  \ AND 运算符检查多个条件是否已满足。运算符的每个部分都必须为真；否则，AND 语句将只返回假。看看下面的脚本：\n\n```bash\n#!/bin/bash\n\
