  \ |\n\n\n\n\n命令行工具对于解决计算问题很有帮助，但它们不能让你成为 Linux 世界的大师。shell（外壳）让你成为 Linux 的大师。你应该了解\
  \ shell 是如何工作的，以及你如何在 Linux shell 中编写不同类型的脚本。通过学习学习命令行和 Linux shell，你将能够独立完成许多任务。\n\
  \n简单来说，shell 脚本就是一个包含系列命令的文件。shell 会读取该文件并执行这些命令，就像这些命令是在命令行中输入的一样。shell 的独特之处在于，它既是一个健壮的命令行接口系统，又是一个脚本语言解释器。你在命令行中执行的大多数操作也可以在\
  \ shell 脚本中完成。你在 shell 脚本中执行的大多数操作也可以在 Linux 命令行中完成。\n\n现在我们已经涵盖了大多数 shell 脚本特性；然而，我们关注的是命令行中更常用的那些。在我们编写程序时，shell\
  \ 为我们提供了许多特性。\n\n## 编写 Shell 脚本\n\nShell 脚本就像普通的文本文件，这就是为什么你需要一个文本编辑器来编写脚本。最好的文本编辑器会提供语法高亮，允许你看到不同脚本元素的颜色编码视图。语法高亮将帮助你发现各种常见错误，并你可以使用\
  \ `kate` 或 `vim` 来编写 shell 脚本。系统对于将旧文本文件作为程序运行有些挑剔。这一切都是有原因的。你需要设置脚本文件的权限以允许执行。你还应该将脚本放在一个你可以容易找到的地方，因为\
  \ shell 会搜索并执行该文件。\n\n## Linux Shell 脚本的格式\n\n我现在将进入编写阶段，向你展示如何编写 shell 脚本。脚本的语言非常简单。见如下所示：\n\
  \n```\n[gha@localhost ~]$ echo 'I am learning Linux'\nI am learning Linux\n```\n\
  \n这就是 shell 脚本。现在我将向同一个脚本中添加一条注释。\n\n```\n[gha@localhost ~]$ echo 'I am learning\
  \ Linux' # I have added a comment to the code.\n\nI am learning Linux\n```\n\n现在你必须让脚本变得可执行。如如下所示：\n\
  \n```\n[gha@localhost ~]$ ls -1 Linux_learning\n[gha@localhost ~]$ chmod 755 Linux_learning\n\
  ```\n\n文本 `Linux_learning` 是我保存脚本的文件名。`chmod` 命令用于在 Linux 中使脚本变为可执行。\n\n## 显示文本\n\
  \n大多数 shell 命令倾向于产生特定的输出，这些输出显示在你运行脚本的控制器屏幕上。你可能需要添加文本消息，帮助脚本用户知道脚本内部将发生什么。你可以通过使用我在上一节中提到过的\
  \ `echo` 命令来实现这一点。`echo` 命令显示简单的文本字符串。使用 `echo` 命令编写脚本有不同的技术。我将探索所有的技术。\n\n```\n\
  [gha@localhost ~]$ echo I am learning Linux shell scripting\nI am learning Linux\
  \ shell scripting\n```\n\n最显著的一点是，你不需要引号来包裹字符串文本，就像其他编程语言那样。然而，有时使用引号是必要的。你需要使用单引号或双引号来显示文本字符串。\n\
  \n```\n[gha@localhost ~]$ echo ‘I am learning Linux shell scripting.’\nI am learning\
  \ Linux shell scripting\n```\n\n在下一个示例中，使用引号将是不可避免。\n\n```\n[gha@localhost ~]$ echo\
  \ 'Adam says, \"I am learning Linux shell scripting.\"'\nAdam says, “I am learning\
  \ Linux shell scripting.\"\n```\n\n你可以看到，当你必须添加直接引语形式的文本时，你必须给文本添加引号。\n\n## if-then\
  \ 语句\n\n许多 Linux shell 脚本程序在脚本内部的不同命令之间需要一些逻辑流控制，这意味着 shell 倾向于执行不同的命令。此外，它保留了执行其他不同命令的能力，允许脚本根据不同其他命令的结果循环执行命令。我们将它们称为结构化命令。它们也被条件语句。\n\
  \n结构化命令允许你改变程序操作的流。当满足某些条件时，某些命令会被执行，而另一些会被跳过。在其他编程语言中，`if` 语句后的对象是系统评估为真或假的等式。`bash`\
  \ shell 的 `if` 语句并不是那样工作的。相反，它运行在 `if` 行上定义的命令。如果此命令的退出状态被认为是零，则 `then` 部分列出的命令将倾向执行。如果此命令的退出状态是其他值，则\
  \ `then` 命令将挂起，`bash` shell 将跳到脚本中的下一个命令。\n\n```\n$ cat testing5\n\n#!/bin/bash\n\
  \n# I am now testing the if statement for bash shell\n\nif date\nthen\necho \"The\
  \ structured command has completely worked\"\nfi\n\n$bash -f main.sh\nTue Jan 26\
  \ 05:02:54 UTC 2021\nThe structured command has completely worked\n```\n\n脚本使用了\
  \ `date` 命令。由于退出状态为零，它将执行 `echo` 语句。在下一个示例中，我将测试一个错误的命令以查看它是如何工作的。\n\n```\n$ cat\
  \ testing2\n\n#!/bin/bash\n\n# It is time to run a test on a bad command\n\nif gjdksll\n\
  then\necho \"it is not going to work\"\nfi\necho \"I cannot run the command because\
  \ you’re out of the statement.\"\n\n$bash -f main.sh\nI cannot run the command because\
  \ you’re out of the statement\n```\n\n由于上面的命令是错误的，它产生了一个非零退出状态。shell 将跳过 `then`\
  \ 部分的 `echo` 语句。\n\n## if-then-else 语句\n\n`if-then` 语句提供了一个判断是否成功的选项。如果返回非零退出状态码，`bash`\
  \ shell 将执行下一个脚本命令。在这种情况下，最好有另一组我们可以执行的命令，这就是 `if-then-else` 语句派上用场的地方。\n\n如果 `if-statement`\
  \ 命令产生了退出状态零，则语句中 `then` 部分的命令将被执行。如果返回非零退出状态码，则语句中 `else` 部分的命令将被执行。\n\n```\n$\
  \ cat testing4\n\n#!/bin/bash\n\n# I am now going to test the else section\n\ntestinguser=thisisabadtest\n\
  \nif grep $testinguser /etc/passwd\nthen\necho The files for user $testinguser are:\n\
  ls -a /home/$testinguser/.b*\nelse\necho \"The user name $testinguser cannot be\
  \ found on the system\"\nfi\n\n$ ./test4\nThe user name thisisabadtest cannot be\
  \ found on the system\n\n$bash -f main.sh\nThe user name thisisabadtest cannot be\
  \ found on the system\n```\n\n有时你可能需要检查脚本代码中的某些内容。与其分开 `if-then` 语句，可以使用 `else`\
  \ 语句的不同版本。这被称为 `elif`，它通过后续的 `if-then` 语句继续 `else` 语句。它提供了一个不同的评估命令，与第一个 `if` 语句非常。如果返回零退出状态码，`bash`\
  \ shell 将执行第二个 `then` 语句的命令。\n\n\n\n\nLinux 中有一种双括号命令，它允许你在进行比较时引入一些高级的数学公式。`test`\
  \ 命令允许进行简单的比较操作。然而，双括号命令提供了更多数学符号，许多来自其他编程语言的程序员也正在使用这些符号。\n\n表达式项可以是任何类型的数学赋值或表达式。除了\
  \ `test` 命令使用的标准运算符外，双括号命令还提供了额外的运算符供使用。\n\n你也可以使用双括号命令的高级功能来执行字符串比较。双括号命令的格式使用了我们在\
  \ `test` 命令中使用过的标准字符串比较方法。它的不同之处在于提供了模式匹配选项。你可以定义一个正则表达式，并与字符串值进行匹配。\n\n```bash\n\
  $ cat testing2\n\n#!/bin/bash\n\n# I will now be using pattern matching\n\nif [[\
  \ $MyUSER == r* ]]\nthen\necho \"Hello $MyUSER I know you from the days when you\
  \ used to work in a restaurant in Europe.\"\nelse\necho \"Sorry, I have never seen\
  \ you before. I don’t know you.\"\nfi\n```\n\n```bash\n$ bash -f main.sh\nSorry,\
  \ I have never seen you before. I don’t know you.\n```\n\n通常情况下，你可能会发现自己试图评估某些变量的值，以便在一组可能的值中找到一个特定的值。在这种典型场景下，你可能会写出如下所示冗长的\
  \ `if-then-else` 语句：\n\n```bash\n$ cat testing555\n\n#!/bin/bash\n\n# I am now looking\
  \ for some possible values\n\nif [ $MyUSER = \"rich\" ]\nthen\necho \"Welcome $MyUSER\
  \ to the heavens on the earth.\"\necho \"Please enjoy your visit in plush green\
  \ fields and lush green mountains. I wonder if you want to take a bath in the river\
  \ beneath the valley.\"\nelif [ $MyUSER = Jason ]\nthen\necho \"Welcome $MyUSER\
  \ to the lakes of Madora.\"\necho \"Please enjoy your stay in the shining waters\
  \ of Madora lakes. I hope you enjoy the resorts, the sun, the breeze, the food,\
  \ and the drinks.\"\nelif [ $MyUSER = Simra ]\nthen\necho \"Welcome $MyUSER to the\
  \ lakes of Madora.\"\necho \"Please enjoy your stay in the shining waters of Madora\
  \ lakes. I hope you enjoy the resorts, the sun, the breeze, the food, and the drinks.\"\
  \nelif [ $MyUSER = Linda ]\nthen\necho \"Don’t forget to logout when you’re done\"\
  \nelse\necho \"Sorry, you’re not allowed here\"\nfi\n```\n\n### for 命令\n\n在编程中，对系列命令进行迭代是一项常规操作。在很多时候，你可能需要重复不同的命令。通常，你需要重复一组命令，直到程序满足特定条件，例如处理目录中的文件或文本文件中的所有行。\n\
  \n`bash` 壳提供了 `for` 命令来开发一个循环，遍历一组值。每次迭代都倾向于使用序列中的单个值来执行一组命令。`for` 命令最基本的用法之一是遍历一个在\
  \ `for` 命令内部定义的值列表。\n\n```bash\nv=$ cat testing111\n\n#!/bin/bash\n\n# This is the\
  \ basic for command in Linux\n\nfor mytest in Alabama Texas Alaska Virginia Arizona\
  \ Ohio Arkansas South Dakota California North Dakota New Jersey Florida Michigan\
  \ Georgia\ndo\necho I am planning to continue my travel circle across the United\
  \ States in the summer. The next state I will visit is $mytest\ndone\n```\n\n```bash\n\
  $ bash -f main.sh\nI am planning to continue my travel circle across the United\
  \ States in the summer. The next state I will visit is Alabama\nI am planning to\
  \ continue my travel circle across the United States in the summer. The next state\
  \ I will visit is Texas\nAnd so on until the last line:\nI am planning to continue\
  \ my travel circle across the United States in the summer. The next state I will\
  \ visit is Georgia\n```\n\n每当 `for` 命令遍历对象列表时，它会将 `mytest` 变量赋值为列表中的下一个项。在 `for`\
  \ 命令语句中，`$mytest` 变量用法与其他脚本变量一样。在最后一次迭代之后，`$test` 变量在 shell 脚本的剩余部分保持有效。除非你更改它，否则它将保留最后一次迭代的值。\n\
  \n```bash\nv=$ cat testing111\n\n#!/bin/bash\n\n# This is the basic for command\
  \ in Linux\n\nfor mytest in Alabama Texas Alaska Virginia Arizona Ohio Arkansas\
  \ South Dakota California North Dakota New Jersey Florida Michigan Georgia\ndo\n\
  echo I am planning to continue my travel circle across the United States in the\
  \ summer. The next state I will visit is $mytest\ndone\necho \"The last US state\
  \ I traveled to was $mytest\"\nmytest=Connecticut\necho \"Now I am going to visit\
  \ $mytest\"\n```\n\n```bash\n$ bash -f main.sh\nI am planning to continue my travel\
  \ circle across the United States in the summer. The next state I will visit is\
  \ Alabama\nI am planning to continue my travel circle across the United States in\
  \ the summer. The next state I will visit is Texas\nAnd so on, until the last line:\n\
  I am planning to continue my travel circle across the United States in the summer.\
  \ The next state I will visit is Georgia\nThe last US state I traveled to was Georgia\n\
  Now I am going to visit Connecticut\n```\n\n你可以看到 `$mytest` 变量保留了它的原始值，并允许我们在 `for`\
  \ 循环之外更改它。让我们来看另一个 `for` 循环示例：\n\n```bash\nv=$ cat testing111\n\n#!/bin/bash\n\n\
  # This is the basic for command in Linux\n\nfor mytest in pumpkin potato tomato\
  \ spinach ginger garlic cauliflower cabbage pepper beet ladyfinger broccoli\ndo\n\
  echo I am planning to make a shift to the cooking schedule as the summer sets in.\
  \ I have bought lots of vegetables. However, today I plan to cook $mytest\ndone\n\
  echo \"The last vegetable I cooked was $mytest\"\nmytest=onion\necho \"Now I am\
  \ going to visit $mytest\"\n```\n\n```bash\n$ bash -f main.sh\nI am planning to\
  \ make a shift to the cooking schedule as the summer sets in. I have bought lots\
  \ of vegetables. However, today I plan to cook pumpkin.\nI am planning to make a\
  \ shift to the cooking schedule as the summer sets in. I have bought lots of vegetables.\
  \ However, today I plan to cook potato.\nThis continues through each of the vegetabes,\
  \ ending with:\nI am planning to make a shift to the cooking schedule as the summer\
  \ sets in. I have bought lots of vegetables. However, today I plan to cook broccoli.\n\
  The last vegetable I cooked was broccoli\nNow I am going to visit onion\n```\n\n\
  当你处理 `for` 命令时，可能会遇到的最大问题是使用多单词值。`for` 循环假设每个值应该由空格分隔。如果你的数据值包含空格，可能会遇到另一个问题。你可以在美国州的示例中看到这一点，bash\
  \ 编辑器将 South 和 Dakota 视为两个独立的值。\n\n`for` 命令为提供了引号来分隔包含多个单词的值。你可以在 `for` 命令中使用双引号来分隔不同的值。请看以下示例。\n\
  \n```bash\nv=$ cat testing111\n\n#!/bin/bash\n\n# This is the basic for command\
  \ in Linux\n\nfor mytest in Alabama Texas \"New York\" Alaska Virginia Arizona Ohio\
  \ Arkansas \"South Dakota\" California \"North Dakota\" \"New Jersey\" Florida Michigan\
  \ Georgia \"North Carolina\" \"South Carolina\" \"New Mexico\" \"Rhode Island\"\
  \ \"West Virginia\" \"New Hampshire\" Vermont\ndo\necho I am planning to continue\
  \ my travel circle across the United States in the summer. The next state I will\
  \ visit is $mytest\ndone\necho \"The last US state I traveled to was $mytest\"\n\
  mytest=Connecticut\necho \"Now I am going to visit $mytest\"\n```\n\n\n\n\n\n我计划在夏天继续我的全美之旅。我下一个要访问的州是佛蒙特州。\n\
  \n我上一次旅行的美国州是佛蒙特州。\n\n现在我要去访问康涅狄格州。\n\n现在 `for` 命令可以区分单单词和多单词值。此外，最棒的一点是当你使用双引号时，shell\
  \ 会将引号作为值的一部分剥离。\n\n## 通过变量读取列表\n\n在 shell 脚本中，经常发生的情况是累积存储在变量中的值列表。然后需要对列表进行迭代。你可以借助\
  \ `for` 命令的帮助来完成这一点。\n\n```bash\n$ cat testing111\n\n#!/bin/bash\n\n# 这是 Linux 中基础的\
  \ for 命令\n\nlist=\"Alabama Texas New York Alaska Virginia Arizona Ohio Arkansas\
  \ South Dakota California North Dakota Colorado New Jersey Florida Michigan Georgia\
  \ North Carolina South Carolina New Mexico Rhode Island West Virginia New Hampshire\
  \ Vermont\"\n\nlist=$list\" Idaho\"\n\nfor state in $list\n\ndo\n\necho \"I am planning\
  \ to continue my travel circle across the United States in the summer. The next\
  \ state I will visit is $state\"\ndone\n\n$bash -f main.sh\n\nI am planning to continue\
  \ my travel circle across the United States in the summer. The next state I will\
  \ visit is Alabama\n\nI am planning to continue my travel circle across the United\
  \ States in the summer. The next state I will visit is Texas\n\nRight up to the\
  \ last state:\n\nI am planning to continue my travel circle across the United States\
  \ in the summer. The next state I will visit is Idaho\n```\n\n`list` 变量包含了用于迭代的值列表。你应该注意，代码使用了另一个赋值语句来将项目连接到现有列表中。即使你忘记在列表中添加项目，你也可以在稍后通过连接方法将它们添加。我将在下一个示例中向列表中添加五个项目。\n\
  \n```bash\n$ cat testing111\n\n#!/bin/bash\n\n# 这是 Linux 中基础的 for 命令\n\nlist=\"\
  Alabama Texas Alaska Virginia Arizona Ohio Arkansas California Colorado Florida\
  \ Michigan Georgia Vermont Iowa Nebraska Arkansas Kansas Kentucky Tennessee Utah\
  \ Maine Missouri Minnesota\"\n\nlist=$list\" Idaho\"\n\nlist=$list\" Oregon\"\n\n\
  list=$list\" Montana\"\n\nlist=$list\"Delaware\"\n\nfor state in $list\n\ndo\n\n\
  echo \"I am planning to continue my travel circle across the United States in the\
  \ summer. The next state I will visit is $state\"\ndone\n\n$bash -f main.sh\n\n\
  I am planning to continue my travel circle across the United States in the summer.\
  \ The next state I will visit is Alabama\n\nI am planning to continue my travel\
  \ circle across the United States in the summer. The next state I will visit is\
  \ Texas\n\n此输出继续列出这些州，直到最后一个：\n\nI am planning to continue my travel circle across\
  \ the United States in the summer. The next state I will visit is Delaware\n```\n\
  \n有一种方法可以在列表中生成用于自定义用途的值，以便使用特定命令的输出。\n\n```bash\n$ cat testing111\n\n#!/bin/bash\n\
  \n# 我将从文件中读取值\n\nmyfile=\"states\"\n\nfor state in `cat $myfile`\n\ndo\n\necho \"\
  I am planning to continue my travel circle across the United States in the summer.\
  \ The next state I will visit is $state\"\ndone\n\n$cat states\n\nAlabama\nTexas\n\
  Alaska\nVirginia\nArizona\nOhio\nArkansas\nCalifornia\nColorado\nFlorida\nMichigan\n\
  Georgia\nVermont\nIowa\nNebraska\nArkansas\nKansas\nKentucky\nTennessee\nUtah\n\
  Maine\nMissouri\nMinnesota\nIdaho\nOregon\nMontana\nDelaware\n```\n\n### while 命令\n\
  \n`while` 命令是 `if-then` 语句和 Linux `for` 循环的结合。它允许你定义一个命令来测试条件，然后循环一组命令，直到达到零退出状态。它会在每次迭代开始时分析测试命令。当达到非零退出状态时，`while`\
  \ 命令将停止执行该组命令。\n\n```bash\n$ cat test10\n\n#!/bin/bash\n\n# 这是 Linux 中的一个 while\
  \ 命令测试\n\nvar15=20\n\nwhile [ $var15 -gt 0 ]\n\ndo\n\necho This is $var15 in the\
  \ while loop.\n\nvar15=$[ $var15 - 1 ]\ndone\n\n$bash -f main.sh\n\nThis is 20 in\
  \ the while loop.\nThis is 19 in the while loop.\nThis is 18 in the while loop.\n\
  \n循环继续到最后一行：\n\nThis is 1 in the while loop.\n```\n\n## 多重测试命令\n\n你可以在 `while` 循环中封装多个测试命令。\n\
  \n```bash\n$ cat test1133\n\n#!/bin/bash\n\n# 现在我正在 Linux shell 中测试多命令 while 循环\n\
  \nvar15=20\n\nwhile echo $var15\n\n[ $var15 -ge 0 ]\n\ndo\n\necho \"This operation\
  \ is being conducted inside the while loop.\"\n\nvar15=$[ $var15 - 1 ]\ndone\n\n\
  $bash -f main.sh\n\n20\nThis operation is being conducted inside the while loop.\n\
  19\nThis operation is being conducted inside the while loop.\n18\nThis operation\
  \ is being conducted inside the while loop.\n17\n\n这将持续到达到最后一个数字：\n\nThis operation\
  \ is being conducted inside the while loop.\n0\nThis operation is being conducted\
  \ inside the while loop.\n-1\n```\n\n第一个测试命令显示 `var15` 变量的当前值。第二个命令将使用测试命令来获取 `var15`\
  \ 变量的值。\n\n### until 命令\n\n`until` 命令的作用与 `while` 命令相反。它要求指定一个测试命令，当其返回非零退出状态时，shell\
  \ 将执行循环内的命令。然而，与 `while` 命令类似，`until` 命令也可以包含多个测试命令，`var15` 变量的退出状态是循环的决定因素。\n\n\
  ```bash\n$ cat test222\n\n#!/bin/bash\n\n# 在此代码块中我将使用 until 命令\n\nvar15=100\n\n\
  until [ $var15 -eq 0 ]\n\ndo\n\necho You are seeing the operations of the until\
  \ command. The next digit in the loop is $var15\n\nvar15=$[ $var15 - 5 ]\ndone\n\
  \n$bash -f main.sh\n\nYou are seeing the operations of the until command. The next\
  \ digit in the loop is 100\nYou are seeing the operations of the until command.\
  \ The next digit in the loop is 95\nYou are seeing the operations of the until command.\
  \ The next digit in the loop is 90\n```\n\n继续下去，直到达到最后的数字：\n\nThe next next digit\
  \ in the loop is 5\n\n该示例成功测试了 `var15` 变量以确定循环何时停止——当变量的值变为零时，`until` 命令会立即停止。\n\
  \n```bash\n$ cat test222\n\n#!/bin/bash\n\n# 在此代码块中我将使用 until 命令\n\nvar15=100\n\n\
  until echo $var15\n\n[ $var15 -eq 0 ]\n\ndo\n\necho You are seeing the operations\
  \ of the until command. The next digit in the loop is $var15\n\nvar15=$[ $var15\
  \ - 5 ]\ndone\n\n$bash -f main.sh\n\n100\nYou are seeing the operations of the until\
  \ command. The next digit in the loop is 100\n95\nYou are seeing the operations\
  \ of the until command. The next digit in the loop is 95\n```\n\n## 嵌套循环\n\n循环语句可以在循环内部使用另一个命令，包括同类循环的其他命令。这种过程被称为嵌套循环。你将在迭代内部包含另一个迭代，这会增加命令运行的次数。查看示例以掌握如何嵌套循环。\n\
