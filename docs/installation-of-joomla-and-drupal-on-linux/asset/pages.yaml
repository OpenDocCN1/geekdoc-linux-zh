    jesse@Punjabjab ~ $ sudo chmod a+w /opt/lampp/htdocs/drupal/sites/default/settings.php

    jesse@Punjabjab ~ $ sudo chmod a+w /opt/lampp/htdocs/drupal/sites/default

    ```


