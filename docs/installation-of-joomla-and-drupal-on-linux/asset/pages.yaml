    Don Panic.


    Just open terminal window and type following command


    ```

    jesse@Punjabjab ~ $ sudo cp /opt/lampp/htdocs/drupal/sites/default/default.settings.php
    /opt/lampp/htdocs/drupal/sites/default/settings.php

    ```


    This will make a copy of the file "default.settings.php"and rename it to "settings.php".


    Next, need to grant permissions to the settings.php file so that it''s writable:


