    Connection Settings:


    Setting Up Joomla to run on your server four easy steps.


    The first step is database configuration. Choose your preferred settings.


    | Basic Settings | |

    | Database Type | This is probably MySQL preferred settings. |

    | mysql | This is usually localhost or a host name provided by the hosting provider.
    |

    | localhost | This is the database name which is username provided by your hosting
    provider. You may change this to your database name. |

    | Username |

    | root | When entering the password for the MySQL account it is mandatory for
    security. This is the same password that may be provided by your hosting provider.
    |

    | Password | | Leave the password blank in case with your setup, use the table
    prefix option to differentiate more than one Joomla site. |

    | Database Name |

    | joomla | |

    | Table Prefix |

    | JO_ | Do not use the prefix ''bak''. This is used for backup tables.|


    Basic Settings


    Enter the hostname of the database server. Joomla will be installed in the database
    you select. Use localhost server if you do not have a hosting provider.


    Enter the MySQL username, password and database name you wish to use. These are
    most absolutely except for the database you are going to use.


    Advanced Settings


    How to handle existing tables from a previous installation.


    Enter a table prefix to be used for your Joomla installation.


