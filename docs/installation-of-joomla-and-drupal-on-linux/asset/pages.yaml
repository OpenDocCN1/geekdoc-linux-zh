    FTP Permissions:

    Due to system restrictions on Linux and other operating systems, an FTP layer
    is used to handle file system manipulation and installation. Joomla! FTP handles
    all file system operations when Joomla requires access to the server.

    Enter an FTP user username and password with access to the directory. The FTP
    layer handles all file system operations when Joomla requires access to the server.

    For security reasons, if the option is enabled, it is best to create a separate
    FTP user account with access to the Joomla directory. On Windows Operating System,
    the FTP layer is not required.


