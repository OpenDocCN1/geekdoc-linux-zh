    ```


    ![](img/4a38974b8034a42576d180572f120df8_30_0.png)


    After refreshing your browser you will see the main page of your site


    # TA-DA...!!!


    You made it..!


    Now, you can start building your site on your local pc.


    ## Automatic startup of XAMPP server


    But every time you boot up your pc you will have to Start your Xampp server by
    typing command in terminal window ( Sudo /opt/lampp/lampp start ) and I am trying
    to make this easy for everyone. You should put Xampp services in Startup, so that
    Xampp server will automatically start, whenever you boot up your PC. In order
    to do so, you will have to follow the following steps.


    - 1. First, find out your default run level, which is actually a folder from which
    the system loads its startup services at the time of boot.


    ![](img/4a38974b8034a42576d180572f120df8_31_0.png)


    Open Terminal and type command


    ```

    jesse@Punjabizm / $ egrep :initdefault:/etc/init.d/

    ```


    You should not see a line containing a number between two colons.


    In most cases 3 or 5 (if you''re using Debian). Now here I will choose rc3.d folder
    coz my pc loads its startup configuration from there.


    - 2. Go into the directory by command mode which configures the Startup, by giving
    command in terminal window


    ```

    jesse@Punjabizm / $ cd /etc/rc2.d/

    ```


    If your system didn''t provide /etc/rc2.d please try also /etc/init.d/rc2.d and
    /etc/rc2.d. In command mode now type the following command.


    ```

    jesse@Punjabizm /etc/rc2.d $ sudo ln -s /opt/lampp S99lampp

    jesse@Punjabizm /etc/rc2.d $ sudo ln -s /opt/lampp K01lampp

    ```


    ![](img/4a38974b8034a42576d180572f120df8_32_0.png)


    This command will put shortcuts of Xampp startup services "S99lampp" and "K01lampp"
    in the folder /etc/rc2.d. You can also see that in rc2.d folder.


    ![](img/4a38974b8034a42576d180572f120df8_33_0.png)


    Now XAMPP should start and stop automatically if you boot or shutdown for your
    machine.


    (Installation of both the CMS''s were only for GNOME Linux platform)


    Rupinder singh Dhammu

