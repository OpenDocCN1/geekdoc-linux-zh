  - '[PAGE 11]


    # # Joomla! Web Installer - Mozilla Firefox


    # ## Steps Pre-installation Check


    +   1: Language

    2: Pre-installation Check

    3: License

    4: Database

    5: FTP Configuration

    6: Configuration

    7: Finish


    Pre-installation check for Joomla! 1.5.3 Stable [Wojmammi Ama Bai] 23-July-2009
    04:00 GMT:


    If any of these items are not supported by Neo, your system does not meet the
    requirements for installing Joomla and you may encounter errors. This could lead
    to your Joomla installation not functioning properly.


    | Property | Value |

    |---|---|

    | PHP Version >= 4.3.10 | Yes |

    | Zlib Compression Support | Yes |

    | SSL Support | Yes |

    | MySQL Support | Yes |

    | MB Language = Default | Yes


    MB String Overload

    You can still continue the installation if the configuration settings are not
    exactly as expected. You must manually update the code file. Click on the link
    below to download the sample configuration code file. Rename this file ''configuration.php''
    and upload it to your root folder.


    ![](img/4a38974b8034a42576d180572f120df8_11_0.png)


    Recommended Settings:

    Ensure the recommended settings for PHP in order to ensure full compatibility
    with Joomla. Joomla will operate fine even if your settings do not match.


    | Directive | Recommended | Actual |

    |---|---|---|

    | Safe Mode | Off | Off |

    | Display Errors | Off | On |

    | File Updates | Off | On |

    | Magic Quotes Runtime | Off | Off |

    | Register Classes | Off | On |

    | Output Buffering | Off | Off |

    | Session Auto Start | Off | Off'
