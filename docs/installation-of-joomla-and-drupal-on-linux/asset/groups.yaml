    \ for jesse: \n[jesse@machine]$ tar -xvf /home/jesse/Desktop/Joomla_3.5.13-Stable-Full-Package-tar.gz\
    \ -C /opt/lampp/htdocs/joomla\n```\n\n# CHE GUEVARA\n\n![](img/4a38974b8034a42576d180572f120df8_9_0.png)\n\
