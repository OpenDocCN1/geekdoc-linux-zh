- raw:
  - '[PAGE 0]


    So now we are about to start installing Joomla and Drupal on Linux PC, here are
    some of the software’s which are required.


    Drupal Latest (Download it from - http://drupal.org/project/drupal)


    XAMPP for Linux (Download it from- http://www.apachefriends.org/en/xamppp-linux.html


    Joomla latest (download it from -http://www.joomla.org/download.html )


    ![](img/4a38974b8034a42576d180572f120df8_0_0.png)


    Save the following three files on your Desktop.


    +   1. xampp-linux-1.7.1.tar.gz

    2. drupal-6.13.tar.gz

    3. Joomla_1.5.13-Stable-Full_Package.tar.gz


    First of all install XAMPP on the P.C. by CLI.'
  - '[PAGE 1]


    Install XAMPP by extracting its content from a folder named "opt", this folder
    is located at the root of the file system.


    +   1. Open the Terminal, enter the following command:


    ```

    jesse@Punjabzim ~ $ sudo tar -xvf /home/jesse/Desktop/xampp-linux-1.7.1.tar.gz
    -C /opt/

    ```


    (Please note here jesse is my user name so you must enter the name of the user
    on which you are currently logged in.)


    ![](img/4a38974b8034a42576d180572f120df8_1_0.png)


    Press enter after giving this command now it will prompt you for your Password,
    give your user login password and press enter.


    This command will extract all the files on Xampp into your /opt/ directory.'
  - '[PAGE 2]


    ![](img/4a38974b8034a42576d180572f120df8_2_0.png)


    # CHE GEVARA


    ★★★★★


    Joanna_1.5.13-Stable-full-Package.tar.gz


    Joanna

    Installation of Drupal


    Now all the files have been extracted. So, we can Start XAMPP


    +   1. Open the Terminal, entering the following command:


    sudo /opt/lampp/lampp start


    The following lines will appear on your Terminal, if everything is going correctly:


    XAMPP: Starting Apache with SSL (for PHP5)...

    XAMPP: Starting MySQL...

    XAMPP: Starting ProFTPD...

    XAMPP for Linux started.'
  - '[PAGE 3]


    # CHE GUEVARA


    ```

    lampp/var/mysql/phpmyadmin/pma designer coords.MYD

    lampp/var/mysql/mysql upgrade_info

    lampp/var/mysql/functions.2008

    lampp/var/prolog/

    lampp/var/log/mysqld.delay

    lampp/var/run/

    lampp/XAMPP

    lampp/

    lampp/build.sh

    $user@punjabim ~# sudo /opt/lampp/xampp start

    XAMPP: Starting Apache for Linux 2.6....

    XAMPP: Starting Apache with SSL (and PHP)...

    XAMPP: Starting MySQL ...nXAMPP: Starting ProFTPD...

    All services started.

    $user@punjabim ~#

    ```


    Now Test your your XAMPP installation


    +   1. Open web browser.

    2. Enter the following address:


    http://localhost


    It should show the following page:


    ![](img/4a38974b8034a42576d180572f120df8_3_0.png)'
  - '[PAGE 4]


    ![](img/4a38974b8034a42576d180572f120df8_4_0.png)


    Click the Status link to see what''s running:'
  - '[PAGE 5]


    # # XAMPP for Linux 1.7.1 - Mozilla Firefox


    ## XAMPP Status

    This page shows you all information about what''s running and what''s not.


    | Component | Status | Hint |

    | --- | --- | --- |

    | MySQL database | ACTIVATED | |

    | Perl | ACTIVATED | |

    | Common Gateway Interface (CGI) | ACTIVATED | |

    | Server Side includes (SSI) | ACTIVATED | |

    | PHP extension -eAccelerator- | DEACTIVATED | 596 FAQ |

    | PHP extension -OCI/Oracle- | DEACTIVATED | 596 FAQ |


    Some changes to the configuration may cause false status reports.


    If it appears like this, then you''re on the right track.

    Now click on "phpmyadmin" which is listed under Tools. And here create a database
    named joomla.'
  - '[PAGE 6]


    <!-- no content -->'
  - '[PAGE 7]


    ![](img/4a38974b8034a42576d180572f120df8_7_0.png)


    Don''t mess with anything else, just click home and come back on the previous
    screen.

    Now in the same way, create another database named drupal.


    Your XAMPP installation part is done.

    Now you install Joomla on your PC.


    First of all create a folder named "jooomla" in /opt/lampp/htdocs/ directory;
    you can get it done by giving the following command in the terminal window.


    ```

    sudo mkdir /opt/lampp/htdocs/jooomla

    ```'
  - '[PAGE 8]


    ![](img/4a38974b8034a42576d180572f120df8_8_0.png)


    Provide the password if it asks!


    Joomla directory is made, now on the screen of the terminal give the following
    command.


    ```

    sudo tar -zxvf /home/jesse/Desktop/Joomla_1.5.13-Stable-Full-Package.tar.gz -C
    /opt/lampp/htdocs/joomla/

    ```


    This will extract all the files of joomla into htdocs/jooomla.'
