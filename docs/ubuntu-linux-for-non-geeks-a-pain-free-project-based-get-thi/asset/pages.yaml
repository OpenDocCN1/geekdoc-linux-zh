- img_proc: true
  md: 'some other sites. There are, of course, newbie-friendly forums, which, although
    not Ubuntu-specific, should also be able to provide you with lots of helpful information.


    Regardless of which forum you are posting in, be sure to mention that you are
    using Ubuntu (Feisty Fawn, in case you have forgot), and that you are new to Linux.
    Remember to always seek clarification when you get an answer you don''t understand.
    The same poster will usually come back and clarify things for you. You should
    feel right home at most of these sites, though you will probably come to one or
    more than the others.


    +   - http://www.ubuntuforums.org The official Ubuntu community forum. Always
    a good place to start when you''re in a fix, have a question, or just to find
    out what''s going on.

    - http://www.ubuntu.org/forum Another slightly smaller Ubuntu-specific forum.
    A good place to turn if you find UbuntuFororg a bit much to wade through.

    - http://www.kubuntuforums.net A forum dedicated to Ubuntu, an official Ubuntu
    edition based on the KDE desktop environment.

    - http://www.justlinuxcom If you can''t find what you want in the previously mentioned
    forums, you can try this or the following forums dealing with general Linux issues.
    You are sure to find many Ubuntu users on any of them.

    - http://www.linux.com

    - http://www.linuxquestions.com


    # # Linux Reference


    These are sites, many of which are geared towards newbies, where you can learn
    more about using Ubuntu or Linux in general.


    +   - http://ubuntuguide.org/wiki/ubuntu:feisty An unofficial Ubuntu startup guide.

    - https://help.ubuntu.com Official documentation for the current release of Ubuntu.

    - http://www.txtfiles.org Lots of tutorials and information for Linux newbies.

    - http://www.linuxcommand.org Learn to use commands in Linux.

    - http://www.linux.org News, book reviews, downloads, and all sorts of other stuff—all
    about Linux!


    # # Blogs


    A lot of great information can also be found in blogs. In these, you can discover
    the findings of fellow users as they try new things, share tips, and offer solutions
    to problems.'
