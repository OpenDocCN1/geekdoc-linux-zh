- img_proc: true
  md: '# The Icons (Left)


    Immediately to the right of the three menus are a set of two launchers. When these
    icons are clicked, they launch the following applications:


    +   **Firefox** Your web browser


    +   **Evolution Mail** The very popular Linux email program, scheduler, and task
    manager


    +   **Help** Access to the Ubuntu help files installed on your hard disk


    # The Icons (Right)


    At the right side of the top panel are a series of icons that perform a variety
    of functions. Some of these are indicators, while some are applets that allow
    you to perform certain functions. These consist of:


    +   **Update Notification Tool** Tells you when there are system or application
    updates and allows you to download and install the updates. Only appears when
    updates are available.


    +   **Network Manager Applet** Lets you see your network status and configure
    your network devices. When used with a wireless network connection, indicates
    the wireless signal''s strength and allows you to switch between wireless networks
    easily.


    +   **Battery** Shows your current battery level when charging or discharging
    the battery. Only appears on laptops.


    +   **Volume Control** A volume controller. Duh.


    +   **Calendar/Clock** Date and time, date and time and time. Just as you suspected.


    +   **Quit** Brings you to the logout screen, from which you can logout, down,
    restart, or switch users.


    # The Bottom Panel


    The bottom panel, as you can see in Figure 3-4, is a much simpler affair, containing
    only the four items I will now briefly describe.


    ![](img/ba6b82a7869bba748202d57c97336dca_53_0.png)


    Figure 3-4: The bottom GNOME Panel


    +   **Show Desktop** A button that minimizes all open windows and allows you to
    see your desktop when it is obscured from view.


    +   **Window List** A list of windows or applications you have open, which is
    very similar to what happens in the Windows taskbar.'
