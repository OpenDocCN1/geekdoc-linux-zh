  md: '# Game Play in Briscola


    Once Briscola starts up, it will then deal three cards to each player. It will
    then make the seventh card and place it under the downward-facing pile of undealt
    cards, known as the stock or talon. Seventh card is called the Briscola (from
    which the game gives its name), and it determines the trump suit for that particular
    game. This means that any card of the same suit as the Briscola will beat any
    card of any other suit, even one of a higher ranking. Of course, when you play
    a trump card against another card, the normal rankings of the cards come back
    into play.


    It is important to note that unlike other trick-games, you are neither required
    to follow the suit of the card in Briscola, nor are you required to beat it if
    you can. This means that if your opponent plays a club card, you can play a card
    of any suit you like, even if you have a card that can beat it, all depending
    on your strategy for ultimately winning the game.


    Before starting, it is a good idea to know how you''re doing as you play and select
    Show Score. Once you done, you are ready for action, and as your computer opponent
    is always kind enough to allow you to lead, you can begin by clicking the card
    you want to put into play. Your compu-opponent will then play its card.


    Once you''ve assessed the situation, click on one of the blank spaces in your
    hand, and the points for that trick will be displayed in the box labeled You (if
    you won the trick) or the box labeled Me (if the computer won the trick). Of course,
    if the trick only involved the 7, 6, 5, 4, or 2 cards, no points will appear,
    as cards have no point value.


    # Want to Know More?


    If you would like a more detailed set of rules for playing Briscola (and about
    any other card game in the world), check out www.pagat.com.


    # Customizing the Terminal


    As you now know, the Terminal is a very simple application in terms of looks.
