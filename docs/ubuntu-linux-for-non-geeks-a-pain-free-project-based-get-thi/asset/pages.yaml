  md: '# A Few Other Graphics Apps to Consider


    In addition to the graphics applications I have covered in this chapter, there
    are still more available. One comes preinstalled with your system, while the others
    can be grabbed via Synaptic (or for easy browsing, via the Add Applications tool).
    While you can experiment with what''s available, I will point out a few others
    worth noting. If nothing else, these applications will give you an idea of the
    breadth of stuff out there waiting for you.


    # F-Spot Photo Manager


    In addition to gThumb Image Viewer, your system comes with yet another application
    for your image viewing and managing needs, F-Spot Manager (Figure 14-17).


    ![](img/ba6b82a7869bba748202d57c97336dca_260_0.png)


    When comes down to it, the features of F-Spot are quite similar to gThumb, so
    it really boils down to your personal preferences. Have a go at both (and Picasa
    too, for that matter), and see which you like. You can run F-Spot from Applications
    ▸ Graphics ▸ F-Spot Photo Manager.'
  merge: -1
