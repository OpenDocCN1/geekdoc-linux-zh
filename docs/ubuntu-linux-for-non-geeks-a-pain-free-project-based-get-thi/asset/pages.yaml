    # DEB based


    Ubuntu is based on the Debian distribution, which means it utilizes Debian’s very
    convenient DEB package system for application handling and installation. The two
    preconfigured, graphical package installers that come with Ubuntu making installations
    even easier. There are so many packages available for Debian systems like Ubuntu
    that you are likely to find more software out than you’ll ever know what to do.


