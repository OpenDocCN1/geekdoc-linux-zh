  md: '# Creating Audio CDs


    All this talk about encoding and listening to MP3 and Ogg Vorbis files on your
    computer is fine and dandy, but there are no doubt times when you would like to
    have your songs on a plain audio CD that you can play while you slog your way
    to on the New Jersey Turnpike or the Ventura Freeway. Frankly, this is easy enough
    to do, and a couple of ways to go about it.


    # Burning Audio CDs with Rhythmbox


    For Rhythmbox users, the easiest way of going about things is to do it all from
    Rhythmbox. To do this, first create a playlist with the songs you want to burn
    to, and then click the **Create Audio CD** button. A confirmation window will
    appear, asking you if you want to create the CD you''ve just set out to create.
    You have no doubt, so click the Create button, and copies of your tracks will
    be created in WAV format. When that process is complete, you will be prompted
    for a blank CD, pop one into your drive, click **OK**, and the burn process will
    begin. When it''s done, the progress window will vanish, and your new CD should
    pop out of your drive. Simple.


    # Burning Audio CDs with Serpentine


    Another way to play-anywhere audio CDs from your ripped MP3 and Ogg Vorbis files
    is *Serpentine Audio CD Creator*, an application that comes bundle with your system.
    To this route, go to the **Applications** menu and select **Sound & Video > Serpentine
    Audio CD Creator**. When Serpentine appears, add songs to the main pane by clicking
    the **Add** button and navigating to the songs you want to add. You can add any
    mix of songs, in any mix of audio formats. You can also add songs you have saved
    to a playlist by going to the **File** menu and selecting **Open Playlist** or
    **Open Rhythmbox Playlist**, depending on the type of playlist in question. If
    you are a drag-and-drop kind of person, you can also drag the icons for your audio
    files directly from one or Nautilus windows, from playlists within Rhythmbox,
    to the main pane of the Serpentine window.


    As you add to the Serpentine window, the CD image will show you how much space
    you have available on the disk (The default disk size is **15-11**). 74 minutes,
    which is the norm for a 650MB CD, so if you are using a 700MB CD, change the setting
    to 80 minutes by clicking the drop-down menu next to the **Disc Capacity** and
    making the appropriate selection.


    When you have added all the songs you want to burn to the CD, click the **Write
    to Disc** button. Serpentine will then begin preparing the tracks to burn to disk.
    When it''s ready, it will prompt you in a new window to insert a blank CD into
    your drive, so do that, and once once the LED on your drive starts blinking, the
    **OK** button. Serpentine will then begin burning the disc,'
  merge: -1
  pgno: 276
- img_proc: true
  md: 'when it is done, it will automatically eject your disk and let you know in
    yet another window that the job is done. You can then take the disk, plop it in
    your car stereo or wherever you want to play it, and enjoy the results.


    | Track Title | Artist | Duration |

    |---|---|---||

    | 1 | Pobre changuelta | Lila Downs | 02:12 |

    | 2 | Alguen | Julieta Venegas | 03:44 |

    | 3 | Commando | Vanessa Parada | 03:41 |

    | 4 | ビー・ラビトと私たち | 中島寿 | 03:11 |

    | 5 | リファインイン達です | 仙台佑崇 | 04:24 |


    Figure 15-11: Preparing to burn an audio CD with Serpentine


    # # Project 15B: Listening to RealMedia Streams with RealPlayer


    Now that you know how to play Ogg Vorbis and MP3 files and Internet broadcast
    streams, it is time to help your system get a bit more mainstream by installing
    RealPlayer 10 (Figure 15-12). RealMedia streams are widely available on the Internet
    and are provided by many working broadcasters, both local and international. You
    can also use RealPlayer to play RealVideo streams, when they''re available.


    Figure 15-12: RealPlayer 10


    Linux users familiar with earlier versions of RealPlayer will be happy to know
    that RealPlayer 10 is much improved over previous Linux offerings. One of the
    big advantages is that RealPlayer 10 now has a Firefox-compatible plugin, which
    means you can now listen to RealMedia streams that were previously unavailable
    because they could only be accessed through browser-embedded players. If you don''t
    know what I''m talking about, take a look at the example from the Radio Sweden
    since in Figure 15-13.'
  merge: -1
  pgno: 277
- img_proc: true
  md: 'The Radio Sweden (www.sr.se), like many others, uses an embedded player for
    the broadcast streams it provides; without installing the plugin, the player cannot
    be used (Figure 15-13, left). But once the RealPlayer plugin is installed, it
    controls automatically appear (Figure 15-13, right), allowing you to use the embedded
    player just as would the stand-alone version (shown in Figure 15-12).


    ![](img/ba6b82a7869bba748202d57c97336dca_278_0.png)


    Figure 15-13: Embedded media players in Firefox before and after installing the
    RealPlayer plugin


    While on the topic of changes, I should also mention that RealPlayer10 is now
    compatible. This means that if you change your system from Human to Crux, for
    example, those effects take place in RealPlayer10 too. You are no longer stuck
    with the fact that Real feels getting better.


    Now that you know what is in store for RealPlayer10, it''s time to get installing
    it. Before we begin, however, I should mention that there are actually three ways
    to install RealPlayer. In this project, I am going to focus on the easiest. It
    is also the standard and, without question, the most legal way of doing it.


    # Installing RealPlayer


    Installing RealPlayer is easily accomplished via Automix. Just click Media Players
    and Editors in the left pane of the Automix window, and then check the box next
    to RealPlayer in the right pane. After that, just click the Start button, and
    you''ll be rolling.'
  merge: -1
  pgno: 278
- img_proc: true
  md: '# Setting Up RealPlayer and Testing Your Installation


    Now that Real Player 10 is installed on your machine, it is time to go through
    the final setup steps and test it all out. You can start by going to the Applications
    menu and selecting Sound & Video > RealPlayer 10. A simple wizard will appear,
    which you will have no trouble with on your own, as all really have to do click
    the button in the bottom-right corner of the window. Once you have completed the
    wizard, the RealPlayer window will appear. To test the installation, close the
    RealPlayer window and open Firefox.


    The next step is to check whether RealPlayer plugin is doing what it should. You
    can determine this by going to npr.org and clicking the 24-hour Program Stream
    link at the top of the page. Because you installed the two audio codec via Automatrix
    earlier in the chapter, embedded Media Player window will appear. To switch to
    RealPlayer, click the Set Player Preference at the bottom of the window, click
    the RealPlayer icon in the screen that appears, and then click Set Player Preference
    again at the bottom of the window. The embedded player near the top of the page
    should now be RealPlayer (as you can tell by the RealPlayer icon at the right
    of the side).


    # Playing MP3 and Ogg Vorbis Streams with RealPlayer


    An interesting and not unwelcome result of installing RealPlayer with the Firefox
    plugin is that you can now play MP3 and Ogg Vorbis Internet broadcast streams
    with a single click of your mouse. Go to shoutcast.com and click the Tune In!
    next to one of the streams to see what I mean. All very handy, you''ve got to
    admit.


    # Going to Town with RealPlayer


    Now that you are all set up, you probably want some streams to try out. There
    are plenty of sites with RealMedia streams, but let me steer you to some of my
    favorites to get started (you may already know some of these):


    +   - Världen (world music from Radio Sweden)

    www.sr.se/svarlarden


    +   - Car Talk (car talk)

    www.cartalk.com/radio/show


    +   - Michael Feldman''s Whad''Ya Know? (comedy/funny)

    www.notmuch.com


    +   - A Prairie Home Companion (Garrison Keillor, et al.)

    www.prairiehomes.org


    +   - Radio Netherlands (public music)

    www.rnw.nl


    +   - Sounds Eclectic (alternative/world music)

    www.soundselectic.com'
  merge: -1
  pgno: 279
- img_proc: true
  md: '# Other Cool Audio Apps


    The applications I have covered so far are only a taste of what Ubuntu has in
    store for you in its repositories. You can start out by browsing the offerings
    listed in the Add Applications tool or Automatis. You can also perform searches
    in Synaptic for other applications you hear about the Internet or what I mention
    in this section. Try them out, keep them if you like them, or remove them if you
    don''t. After all, it doesn''t cost you anything in Linux.


    To give you a starting point, I will mention a few applications that I think might
    be worth investigating.


    # Other Audio Players


    If the music players that I''ve covered in this chapter have whetted your appetite
    for music, you are in luck—there are plenty, a few of which I will briefly introduce
    now.


    # Listen


    The very appropriately named Listen is a nice variation on the Exaile theme, though
    many find it more intuitive to use. Listen provides album cover art and lyrics
    fetching and display; onscreen display of currently playing track info; Wikipedia
    searches; Internet radio streams, including Last.fm similar artists ratings (15-14);
    and a whole lot more. Check it out by downloading and installing it via Automatis
    (click Media Players and Editors in the left pane, and then click Listen Media
    Manager in the right pane). Once you have installed Listen, start it up from Applications
    > Sound & Video > Listen Music Player.


    | Context | Similar artists | Top albums |

    |---|---|---|

    | Current | Death for Cute | Fetching informations |

    | Lyrics | Score: 100 |

    | Wikipedia | The Decarbonists | Score: 95.368 |

    | Last.fm | The Postal Service | Score: 95.608 |

    | Library | Sufjan Stevens | Score: 95.608 |

    | Podcast | Iron & Wine | Score: 95.608 |

    | Vebradio | The Arcade Fire | Score: 95.608 |

    | Filesystem | Modest Mouse | Score: 95.302 |

    | | | Belle and Sebastian | Score: 95.608 |


    Figure 15-14: Last.fm similar artists suggestions in Listen'
