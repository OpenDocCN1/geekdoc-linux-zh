  md: '# Project 9A: Installing DEB Packages Not Available via the Ubuntu Repositories:
    Automatix


    As you may recall, the applications you install from the various Ubuntu repositories
    via Synaptic or Add/Remove Programs are of DEB packages—and the repositories are
    filled with such packages. Unfortunately, although these repositories seem to
    contain just every piece of software out there, for different reasons not every
    package finds its way into the repositories, even if it is available in DEB form.
    At the present time, the application Automatix is one of these.


    Automatix is, interestingly, yet another front end for the powerful APT package-management
    software that is at the structural heart of all Debian-based systems. Like Synaptic,
    Automatix provides you with a graphical means to select, download, and install
    packages. What is different, however, Automatix provides a fairly automatic way
    for you to fill all the holes left in your distro due to licensing and copyright
    concerns. I don''t know what I''m talking about, I am referring to MP3 playback
    and encoding, unencrypting DVD playback, and allowing you to write to NTFS partitions
    on your hard drive. You can accomplish all this without Automatix, but using it
    makes the process no-brainer.


    # 9A-1: Getting and Installing Automatix


    Getting and installing Automatix is a very simple process. To get started, go
    to www.getautomatix.com, and then click the Installation button. On the next page,
    click the 2.1 Ubuntu 7.04 (Feisty 386) link near the top of the page, and then
    click the URL below Ubuntu 7.04 (Feisty 386) or Ubuntu 7.04 (Feisty amd64), depending
    on the type of processor you have in your machine.


    At this point Firefox will bring up a window asking what you want to do with the
    Automatix DEB package; either option will do. For the sake of experience, let''s
    accept the default, Open with GDebi Package Installer, by clicking OK. In a moment
    or two, GDebi, yet another APT front will end, with information about the package
    you are about to install (Figure 9-1). In that window, click the Install Package
    button, after which you will be prompted for your password. Once the formalities
    are complete, things should start looking rather Synaptic-esque, with the same
    orange bars zipping back and forth in progress windows until the process is complete.
    Then, just click the Close button in the progress window, and close the GDebi
    window. Mission accomplished.


    # 9A-2: Running Automatix


    Once Automatix is installed, you can run it by going to the Applications menu
    and selecting System Tools ▸ Automatix. You will be prompted for your password,
    so type it and click OK. A window will appear telling you that installing certain
    things without paying a fee is a legal no-no, depending'
