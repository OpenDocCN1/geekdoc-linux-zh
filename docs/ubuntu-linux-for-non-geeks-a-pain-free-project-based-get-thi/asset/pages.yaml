    Keeping Your Home Folder Private

    Another exception to your you-don''t-need-worry-about-permissions claim, and a
    potentially important one at that, is the state of permissions for your home folder,
    particularly when other people have user accounts on your machine. In Ubuntu,
    when someone logs in to your account on their computer, they can click to your
    user folder and view its contents.


    To remedy this situation—and then protect the sanctity of your home folder, the
    privacy of its contents, and the peace of mind of its owner (you)—you can change
    the permissions of your home folder. Here is what you need to do:


    +   1. Open a Nautilus window, and then double-click File System in the side pane.
    The contents of your hard disk will appear in the right pane of the Nautilus window.

    2. Look for and then double-click the folder named home. When the contents of
    the home folder you just clicked in the right pane, there should only be one folder—your
    folder, which will have the same name as your username. For example, mine, as
    I mentioned earlier, is named rg.

    3. Right-click your folder, and select Properties in the popup menu.

    in the Properties window (mine says rg Properties), click the Permissions tab.

    4. In the Permissions tab, go down to the Group and Others sections, and select
    None in the drop-down menus next to the words Folder Access. Be sure to do this
    in both the Groups and Others sections. When you''re done, your window should
    look like mine in Figure 6-11. If so, click Close.


