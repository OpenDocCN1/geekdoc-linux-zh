    Copy or Link in the popup menu.


    # Data Source


    ![](img/ba6b82a7869bba748202d57c97336dca_238_0.png)


    The second to last button in the top row is the Data Source button. Clicking this
    opens a Data Source browser in the new pane of your document. From pane you can
    access and edit records stored within any databases you have registered in OpenOffice.org.
    From a database containing personal information (such as Evolution''s Addressbook),
    for example, you could simply do a search for an individual entry, and then drag
    the name, address, phone number, and/or email address for that entry into your
    document, rather than searching for the data and typing it all over again.


    # Styles and Formatting


    ![](img/ba6b82a7869bba748202d57c97336dca_238_1.png)


    The final stop on your tour OpenOffice''s unfamiliar buttons is the Styles and
    Formatting button, which is located at the left side of the second row of buttons.
    This button acts as a toggle for the Styles and Formatting window (Figure 13-7),
    from which you can select and then apply styles to any of the elements within
    your document. Oh, and if you can''t take your hands off the keyboard for a moment
    to fiddle with the mouse, you can also open the window by pressing the F11 key.


    ![](img/ba6b82a7869bba748202d57c97336dca_238_2.png)


    Figure 13-7: The Styles and Formatting window


