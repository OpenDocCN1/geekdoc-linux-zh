    Of course, files not only get stored on your hard disk, but they are also copied
    to and from CDs, DVDs, external hard disk, flash drives, and other storage media
    and devices. They are also often saved in archives, which are then compressed
    to reduce their spatial footprint, making them easier to send via email or to
    fit onto spatially challenged removable storage media.


    With that intro, you may have already guessed that in this chapter I will be dealing
