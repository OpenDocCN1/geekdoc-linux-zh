  md: '![](img/ba6b82a7869bba748202d57c97336dca_256_0.png)


    # Learning More


    It is lots of fun to learn to use the GIMP by just playing around with it for
    a while. While of the fun stuff, you get started, it is located in the Filters
    and Script-Fu menus of any image window. Of course, you should make a backup copy
    of any file you are planning to experiment with before altering it.


    If you prefer working through manuals and tutorials to just finding things by
    going around, you can download and install the GIMP User Manual via Synaptic by
    searching for *gimp* and then marking Gimp-help-en for installation. Once it is
    installed, you can access the manual from within the GIMP from the Help menu.
    If you prefer, you can find the manual at http://docs.gimp.org/en. You can also
    find a series of skill-level-based tutorials at www.gimp.org/tutorials.


    # XPaint


    If the GIMP comes as a bit overwhelming for you, or if it seems to be overkill
    for your simpler tasks, you might want to try out an application known as XPaint,
    which you can download and install via Synaptic (search for *xpaint*). XPaint
    is similar to Windows Paint and MacPaint.


    Even if you are a satisfied GIMP user, there is still good reason to download-
    and install XPaint, in addition to its simple paint tools, you can take screenshots
    of regions (Figure 14-14) rather than just of a particular window or of the full
    screen. If you have ever used the Mac X application Grab, you may well be familiar
    with this feature.


    By the way, once installation is complete, there will be no launcher for XPaint
    in the Applications menu, so you will have to run from the Run Application panel
    applet or from a Terminal by typing **xpaint**.'
  merge: -1
  pgno: 256
- img_proc: true
  md: '![](img/ba6b82a7869bba748202d57c97336dca_257_0.png)


    # Sodipodi


    The GIMP, like other so-called paint programs, creates bitmaps in various file
    formats. These are images in which the location and color of every single pixel
    is recorded. The image is essentially a collection of dots, or bits. The file
    you create is a rather hefty map of these bits (hence its name), and this map
    tells your system where everything in your image is supposed to go when it is
    displayed or printed.


    Drawing programs, on the other hand, vector images, or drawings. The vector image
    is a collection of mathematical formulae representing the various shapes in your
    image. This may sound rather unimportant to you, but such drawings have advantages
    in certain cases. One of these advantages is that vector images take up less space
    on your hard disk than bitmaps. Another, and perhaps the most important, advantage
    is that shapes in vector images retain their smooth edges when the images are
    enlarged. A smooth circle created as a bitmap, for example, would show jagged
    edges (the “jaggies”) when enlarged to any extent, while the same circle in vector
    image would remain smooth and round no how much you increased its size.


    If you are interested in creating a drawing program, go then, pick my pick for
    Sodipodi—the name is Estonian for mishish (see Figure 14-15).


    To download and install Sodipodi, a synaptic search for sodipodi, and then mark
    the file for installation. Once it is installed, you can run it from the Applications
    menu by selecting Graphics Sodipodi.


    If you would like to learn how to use Sodipodi, go to the Sodipodi home page at
    www.sodipodi.com. Be sure to click the Galleries link at the top of page to see
    examples of what you can do with the program.'
  merge: -1
  pgno: 257
- img_proc: true
  md: '![](img/ba6b82a7869bba748202d57c97336dca_258_0.png)


    Figure 14-15: Sipopodi


    # # Project 14D: Installing Picas via Automatrix


    It wouldn’t be right to dedicate a whole chapter to Linux’s graphical capabilities
    without mentioning one of the newest entries in the Linux application arena—Picasa.
    Those of you coming from the Windows world are no doubt familiar with this very
    popular image viewing, organizing, and editing application from Google, and you
    will no doubt to discover that it is now available for Linux. Picasa is not an
    open source application, which may cause some Linux die to turn away, but it is
    free, feature-rich, nice to look (Figure 14-16). It also gives you easy access
    to various online photo blogs, photo finishers, and product providers, such as
    PhotoStamps, Shutterfly, Kodak, and Evergreen.


    # ## 14-1: Downloading and Installing the Picasa Package


    The easiest way to get Picasa is via Automatrix, which you installed and learned
    to use in Chapter 9. Open Automatrix (Applications ► System Tools Automatrix),
    and once it is up and running, click Office in the left pane. The right pane of
    the Automatrix window, check the box next to Google Picasa, and then click Start
    button at the top of the window. The download and installation process will then
    begin.


    A small window will appear, telling you that you need administrative rights to
    proceed. Click Grant, and you will be prompted for your password. Type that, and
    click OK to begin the installation. Automatrix will show the progress of the download
    and installation and let you know when it is done.'
  merge: -1
  pgno: 258
- img_proc: true
  md: '![](img/ba6b82a7869bba748202d57c97336dca_259_0.png)


    #  14D-2: Running and Setting Up Picasa


    Once Picasa is installed, you can run it by going to the **Applications** menu
    and selecting **Graphics > Picasa**. The first time you do this, you will be greeted
    by a Picasa License Agreement window. Agree to what you''re asked by clicking
    **I Agree**.


    You will then be asked in another window, and again only the first time out, whether
    you want it to scan your entire computer for images (the default selection) or
    just your desktop. Do not repeat, do not accept the default (Com scan my computer
    and all network directories for pictures).


    The reason for this is that even though you may have just to scan a single image
    to your computer, your system is already chock-full of them. If you were to accept
    the default, Picasa would be filled with all sorts of stuff that you wouldn''t
    really want. It is supposed to be an organizer for **your** photos, after all.
    With that in mind, select **Only scan the Desktop**, and then click the **Continue**
    button. Picasa will scan your desktop for images and add any images it finds to
    its library.


    Working with Picasa should be very straightforward, but if you want to find out
    more, check out http://picasa.google.com/linux. On that page, you will find a
    basic overview, links to more Linux-specific information (including FAQ and forum
    pages), and a Picasa tour.'
  merge: -1
