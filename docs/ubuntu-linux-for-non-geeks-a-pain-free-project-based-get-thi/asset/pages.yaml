  md: '# 1


    # BECOMING A PENGUINISTA


    Welcome to the World of Linux


    ![](img/ba6b82a7869bba748202d57c97336dca_28_0.png)


    Now we begin our project to get you up and running in the world of Linux. If you
    have already made the commitment and have Ubuntu installed on your machine, you
    are essentially ready to go. Others of you might have made the commitment psychologically,
    but have yet to act on that commitment. Some of you are probably reading these
    words in the aisle of a bookstore, wondering about Linux and about whether you
    should spend your money on this book or on a latte morning for the next couple
    of weeks. For this last group, I can only say, "Get this book." Save the wear
    and tear on your stomach and nerves.

    In any case, the first thing we need to do is get you to snuff on what Ubuntu
    thing is all about, why you might want to install and use it, what you will need
    in order to do so. I expect you will have lots of questions along the way, and
    if you are like most people, a few doubts. I hope that by the time you finish
    this book and have your Linux system up and running, your doubts will be gone
    and your questions, for the most part, will be answered. Anyway, until you are
    ready to make the commitment, you can'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'still follow along, because the CD comes with this book contains, in addition
    to the Ubuntu installer, a live Ubuntu environment—meaning that you can have a
    taste of the Ubuntu Linux experience without having to ever touch what you''ve
    got on your hard drive. You can kick back, put your worries in check, and go with
    the flow.


    # What Is Linux?


    Your computer, despite being a collection of highly sophisticated parts, is just
    . . . well a collection of highly sophisticated parts. On its own, it can do nothing
    but switch on and off and spin a disk or two. In order for it to do anything truly
    useful, it needs an operating system (OS) to guide it. The OS takes an essentially
    well-owed but completely uneducated hunk of a machine and educates it, at least
    enough that it will understand what you want to.


    You already know of and have probably used at least one of the many operating
    systems that exist today. Windows, OS, and the Mac OS are all such operating systems,
