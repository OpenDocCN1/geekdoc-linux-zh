  md: '# EasyTAG and Audio Tool


    For the true audio geek, these two applications allow you to alter the tags of
    your MP3 and Ogg music files. EasyTAG is the more full-featured of the two, Audio
    Tag Tool (Figure 15-18) has a friendlier user interface. Give ''em both a try
    and see what you think. Search Synaptic for easytag or tagtool, install one or
    both, and locate either under Applications ► Sound Video.


    ![](img/ba6b82a7869bba748202d57c97336dca_283_0.png)


    Figure 15-18: Editing MP3 and Ogg Vorbis file tags in Audio Tag


    # LMMS


    Linux MultiMedia Studio (LMMS) is a combination tracker/sequencer/synthesizer/sampler
    that is easy to use—at least what the LMMS home page suggests when it promises
    "easy music-production for everyone." I can''t swear to that myself, as I don''t
    know many apps in this genre, but there is a lot of hoopla out there in the Linux
    world, and it looks cool, as you see in Figure 15-19. It sounds really cool too
    (try the demos you install it). Search Synaptic for lmms, install the program,
    and run the command lmsms.


    # Audacity


    If you''re interested in podcasting, one application you will find repeatedly
    mentioned is Audacity. Audacity (Figure 15-20) is a multi-platform audio recording
    and editing application that is frequently used not only in the'
  merge: -1
