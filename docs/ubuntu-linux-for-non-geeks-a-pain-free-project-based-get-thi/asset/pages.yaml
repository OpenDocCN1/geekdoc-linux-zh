    # If an Update Ruins Your Day ... or System


    Now, I don''t want to worry you too much, but one thing massive system updates
    is afterward, sometimes things just go all crazy, leaving you with all sorts of
    regrets and a mouthful of expletives waiting to be uttered, and deleted. This
    is a fact of life no matter what system you are using. It can happen in Windows,
    it can happen in Mac OS, and it can happen in Linux. Therefore, it is always a
    good idea to wait before installing a seemingly major update and to check the
    user forums to see if there are any disaster stories out there.


    If you go ahead only to find that your system won''t start up again, don''t worry.
    All is not lost. In fact, nothing is lost ... most likely. Just start up your
    machine again. If you have a dual boot system, you will arrive at the GRUB boot
    menu, just like always. If you''re not a dual-booster, you''ll have to get into
    this menu by pressing ESC: as you''re prompted to do just a few moments after
    starting the machine.


    In the GRUB menu, you will see that you seem to have more than one Ubuntu system
    installed on your hard disk, which is true to some extent. Take advantage of this
    quasi-fact by traveling back in time to the core system (the Linux kernel) that
    you had in place before your ill-fated upgrade. Use arrow keys to select a kernel
    that ends in a number lower than the highest (2.6.20-11 after 2.6.20-13, for example),
    press ENTER, and voilà, you are back to the system you come to know and love.


    Hopefully, with all this disaster and recovery talk, I haven''t scared you away
    from the idea of updating your system. After all, chances are great that nothing
    like this will ever happen to you. Still, it is good to know that if things go
    awry, there is no need for panic. You''ve got backup.'
