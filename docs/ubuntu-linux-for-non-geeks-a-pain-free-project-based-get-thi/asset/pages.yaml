  md: '# 9B-3: Converting the TuxCards RPM


    Now that the TuxCards RPM is in your home folder, you can use Alien to convert
    it to an Ubuntu-friendly DEB package by typing the following command and pressing
    ENTER:


    ```

    sudo alien --scripts tuxcards*.rpm

    ```


    After you type your password, nothing much will seem to happen. However, you will
    get the message tuxcards_3.2.2._i386.deb generated (or something like that) in
    the Terminal window. If you look in your home folder, you will find the newly
    generated DEB package along with the original RPM.


    # 9B-4: Installing the Newly Generated TuxCards DEB Package


    You can now install the TuxCards DEB package using the dpkg (Debian package) command
    with the -i (install) flag and then pressing ENTER. The command should be:


    ```

    sudo dpkg -i tuxcards*.deb

    ```


    If I haven''t won over the world of commands (not that I''m trying to), and you
    still prefer going things graphically whenever possible, you can install the TuxCards
    DEB package the same way you installed Skype in Project 9A—by double-clicking
    the DEB package and using the Package Installer window. It works out in the end,
    so it''s strictly to you.


    # 9B-5: Running TuxCards


    Once TuxCards has been installed, you can run it via the Run Application applet.
    Just type tuxcards in the command box, and click the Run button.


    # Compiling Programs from Source


    For the beginner, just the mention of compiling a program from source seems off-putting
    enough. The words compile and source seem to instill a sense of foreboding in
    the heart of the new user. That certainly was the case for me, anyway.


    However, this method of installing programs is it easier than it sounds. In fact,
    now that you have some experience using the Terminal and command line, it is just
    plain easy—a sort of one, two, three, and you''re done process.


    Of course, you can live long and without ever bothering anything on your system.
    You can move along happy with your system as is, or you can just install programs
    by means of the very convenient Synaptic application, which you learned about
    Chapter 5.'
  merge: -1
