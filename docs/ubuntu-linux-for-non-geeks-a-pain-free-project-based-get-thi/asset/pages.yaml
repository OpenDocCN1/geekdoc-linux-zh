    As a general rule, programs compiled from source do not automatically install
    a launcher for you you must run them by command. Although you can run a program
    for the first time by typing a command in the Run Application applet, it is better
    to run the program for the first time by typing the command in your Terminal window.
    If anything has gone amiss during installation, the Terminal will tell you what
    the problem is, whereas the Run Program method would leave you wondering what''s
    going on.


    To run Xmahjogg, just type xmahjogg in a Terminal window, and then press ENTER.
    If everything goes as it should, you can create a program launcher for Xmahjogg
    in your Applications menu, on the GNOME Panel, or in a panel drawer.'
