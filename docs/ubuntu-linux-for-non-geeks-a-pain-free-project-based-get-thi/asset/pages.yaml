  md: '# CD/DVD Creator - File Browser


    ![](img/ba6b82a7869bba748202d57c97336dca_111_0.png)


    **Figure 6-12: A Nautilus CD/DVD Creator window is open, with files ready to be
    burned to disk**


    Once the CD/DVD Creator window is open, copying the files you want to burn to
    disk is pretty a simple drag-and-drop maneuver. Just open a new Nautilus window,
    and drag the files you want to burn to over the CD/DVD Creator window. If you
    prefer to do this in a decidedly Windows-esque fashion, you can select the files
    you want to transfer to disk by clicking each file once, holding the CTRL key
    while doing so, for multiple selections. If you want to select multiple consecutive
    files, you can click the first file in the group, and press SHIFT, and then click
    the last file in the group, automatically selecting all the files in between.
    release the CTRL or SHIFT key, right-click any of the highlighted files, and select
    **Copy** in the popup menu. After that, go back to the CD/DVD Creator window,
    right-click any open space, and then select **Paste** in the menu.


    It is fairly worth mentioning that the files you copy to the CD/DVD Creator window
    are not actually copied. Instead, what you see in the Creator window are essentially
    aliasing to the original files in their original locations. If you move one of
    the files from their original location before burning the contents of the CD/DVD
    Creator window to disk, the file will automatically vanish from the window, and
    it will not be burned when you finally get to that step. This is not problematic,
    but it is something worth being aware of.


