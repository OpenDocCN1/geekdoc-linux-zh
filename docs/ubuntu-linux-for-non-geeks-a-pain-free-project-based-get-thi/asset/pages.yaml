  md: '# Project 14C: Emblems Again! (Creating Your Own)


    One of the first things my mother asked me after she got Linux up and running
    was how to create her own emblems. You already learned how to deal with emblems
    in Chapter 7, but now that I have introduced many of the graphics tools at your
    disposal, it might be a good time to address my mother''s question as well.


    # 14C-1: Using an Existing Icon as an Emblem


    You can use any image as the basis of an emblem, but the easiest way to get creating
    emblems is to use one of the icons on your system as the base. The only problem
    with that idea is that most of your system icons are 48 by 48 pixels in size,
    while emblems are 36 by 36 pixels. If you don''t want your emblem to look weirdly
    oversized and out of place, it is best to resize.


    As mentioned in the previous section, the gThumb application is very helpful for
    resizing images. For this project, we will use the gnome-tiger icon, choose down
    menu above the left pane, and then navigate to /usr/share/pixmaps. Once there,
    choose **View View As List**, then for the **gnome-tiger.png** file (it looks
    like an orange character), double-click it, and then go to the **Image** menu
    and **Resize**. This will bring up the Scale window (see Figure 14-8), where you
    can change the width of the icon to 36 pixels (the height will change automatically,
    as long as the *Keeps aspect ratio* is checked). Once you are done, click **Scale**.


    Now you need to save the newly sized icon to your home folder, while keeping the
    original as it was. To do this, go to the **File** menu and select **Save As**,
    which will bring up the Save window. Save the file as gnome-tiger-emblem.png in
    your home folder. You can do this by clicking the drop-down menu button next to
    the words **Save in folder** and navigating your home folder. Once that''s done,
    click **Save**.


    # 14C-2: Adding the Newly Sized Image to the Emblem Collection


    Now that you have an image of the appropriate size, it is time to add it to your
    system''s collection of emblems. To do this, go to the **Edit** menu, and then
    select **Backgrounds and Emblems**. Once the Backgrounds and Emblems window opens,
    click the **Emblems** button on the left side of the window, and then click the
    **Add a New Emblem** button at the bottom of that window. This will bring up a
    small Create a New Emblem window (see Figure 14-9).


    In that window, start out by giving your emblem a name. As the image is that of
    a tiger, I called mine *Kitten Stuff*, but you can call it something else if you''d
    like. Just type the name in the Keyword box.'
  merge: -1
  pgno: 252
- img_proc: true
  md: '![](img/ba6b82a7869bba748202d57c97336dca_253_0.png)


    Figure 14-8: Scaling an image in gThumb


    After you have done that, it is time to work on adding a new emblem to your system''s
    collection. To do this, just click the button next to the word Image. This will
    open a window from which you can select the image. In the text box at the top
    of that window, type"gnome-tiger-emblem.png" and click OK. Your new Kitten Stuff
    emblem should now appear in the Create a New Emblem. If so, click OK.

    That should disappear, and your new Kitten Stuff emblem (or whatever you called
    it) will appear in the Emblems window (Figure 14-10). You can now use your new
    emblem as you would any other.


    ![](img/ba6b82a7869bba748202d57c97336dca_253_1.png)


    Figure 14-9: Adding a new emblem to your collection


    ![](img/ba6b82a7869bba748202d57c97336dca_253_2.png)


    Figure 14-10: A new emblem [Kitten Stuff] in the Emblems window


    # # Getting Arty with the GIMP


    The Windows and Mac worlds may have Photoshop, but the Linux world has the GIMP.
    Arguably not as powerful as Photoshop, the GIMP is a capable contender, which
    may explain why it has been ported over to both


    234 Chapter 14'
  merge: -1
  pgno: 253
- img_proc: true
  md: 'Mac and Windows. The GIMP allows you to create bitmap graphics and, quite importantly,
    retouch or completely doctor image files. With the GIMP you can get rid of red-eye
    in your digital photos, airbrush out unwanted shadows (or even facial blemishes),
    view your canvas texture, change a photo into an oil painting, and even add a
    pepper here and there—and with drop shadows no less (see Figure 14-11). To run
    GIMP, go to the **Applications** menu, and select **Graphics > GIMP Image Editor.**.


    ![](img/ba6b82a7869bba748202d57c97336dca_254_0.png)


    Figure 14-11: Manipulating a digital image in the GIMP


    # Using the GIMP to Resize Images and Convert File Formats


    Like gThumb, the GIMP is also a handy tool for resizing images. This can be done
    by simply right-clicking an image opened in the GIMP and selecting **Image > Scale
    Image** in the popup menu. This will bring up the Scale window, where you can
    set the new size of the image.


    The GIMP is also an excellent tool for converting images from format to another.
    You can, for example, convert a bitmap (.bmp) file and save it as a (.png) file,
    or a JPEG (.jpg) and so on. While this can also be done with gThumb, the GIMP
    has an extremely wide variety of file formats, and even lets you save an image
    file as a compressed,, which makes it a true file-conversion king.


    To perform a file conversion, just right-click an image opened within the GIMP
    and then select **File > Save As** in the popup menu. You can make the same selection
    from the **File** menu if you prefer. Either way, the Save Image window will then
    appear. In that window you can specify the new file format'
  merge: -1
  pgno: 254
- img_proc: true
  md: 'by replacing the original file extension in the Name box at the top of that
    window with the extension for the format you want to convert the image. If you''re
    not sure what formats are available to you, click the small arrow to the left
    of the words Select File Type (By Extension), and then choose from the options
    in the pane below. To save a work in progress, use the GIMP-native XCF format,
    so that you can continue working on the image later.


    # Dialogs


    The GIMP interface, as you might have noticed, is based on a series of dialogs,
    two of which appear when you first run the application. You can, however, open
    still others, and, more importantly, you can dock them to form larger size dialogs.
    While this is quite easy to do, figuring out how to do it is something that leaves
    GIMP newbies at a loss.


    The various dialogs available to you in the GIMP can be found by going to the
    File menu in the main GIMP window (that''s the one that appears at the left of
    your screen, as in Figure 14-11), and selecting Dialogs. From the submenu that
    appears, make your choice from the list of dialogs shown.


    After you''ve opened a couple of dialogs, you can dock them together by clicking
    and holding the name of the dialog, located just below the title bar, and dragging
    that name to the bottom of the dialog you wish to dock to. The name of the dialog
    will appear as a floating icon/name tab as you do your dragging (Figure 14-12).


    ![](img/ba6b82a7869bba748202d57c97336dca_255_0.png)


    Figure 14-12: Docking dialogs in the GIMP


    When the thin, gray band near the bottom of the target dialog turns brown (compare
    the bottom of the two dialogs in Figure 14-12 to see the difference), release
    the mouse button, and the dialogs will be joined as one, as you can see in Figure
    14-13.


    236 Chapter 14'
