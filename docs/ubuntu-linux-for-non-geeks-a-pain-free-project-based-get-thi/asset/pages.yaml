    # # Logging In to Your New Account


    To use this new account, go to the **System** menu and select **Log Out** (or
    just click the **Logout** button at the far-right corner of the top panel). When
    the logout window appears, click **Log Out**. After a few seconds, you will be
    back at the login screen. Type your new username in that window, and then press
    ENTER. After that type your password for the account, and press ENTER again. You
    will soon be at the desktop for your new user account.


    # ## Switching Users


    It''s worth knowing that there is another way to switch users other than simply
    logging out of one account and into another. This alternative approach is logically
    referred to as *switching users*. Switching users differs from the logout/login
    approach, in that you remain logged in your original account while you log in
    to your other account (while someone else uses an account on your computer in
    theirs). Going this route keeps all of the windows or applications you have open,
    but they will be, conveniently waiting for you, when you switch back to the account
    from which you came.


    This is a good way to proceed if you plan to be switching back and forth between
    your accounts. It is also a good approach when, say, your child needs to log in
    to his or her account for a moment to do a quick check check, burn a CD to play
    or print a file for school. When your child is done, you can quickly get back
    to what you were doing before having to reopen files, web pages, or whatever else
    you happened to be dealing with at the time of the switch.


    104 Chapter 7'
