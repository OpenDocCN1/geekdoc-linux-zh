  md: '# # 16


    # # PLUGGIN'' IN THE PENGUIN


    Ubuntu and Your iPod


    ![](img/ba6b82a7869bba748202d57c97336dca_286_0.png)


    With all the talk in the previous chapter about ripping, encoding, and playing
    back audio files, you may be wondering whether not you''ll be able to transfer
    any of those files to your iPod using Linux.


    Well, you will be happy to know that Ubuntu does iPods, even Nanos. You will also
    be happy to know that using your iPod on your Ubuntu system is quite easy. All
    you have to do is plug your iPod into one of your computer''s USB ports, after
    which Ubuntu will automatically mount the iPod and place an icon on your desktop
    (Figure 16-1). No longer do you have to mess around with mount and unmount commands
    or editing system tables. Just plug in your pod, and Ubuntu will do the rest.


    ![](img/ba6b82a7869bba748202d57c97336dca_286_1.png)


    Figure 16-1: A desktop icon for a mounted iPod'
  merge: -1
  pgno: 286
- img_proc: true
  md: '# Knowing Your Limits


    Although you can use your iPod in Ubuntu, you should remember that support for
    such devices is still rather new. Because of that, there is likely to be the occasional
    odd moment while working with your iPod. I have been using mine without problems,
    but a friend did lose all his data when he managed to freeze his system while
    doing something bizarre. The same thing happened to me on a Mac, so I guess that''s
    the life of the iPod. Anyway, if you do lose all the data on your iPod or somehow
    corrupt your system, you can just use Apple''s iPod Updater in Windows to bring
    it back to normal and repopulate its library from your hard disk.


    As you downloaded and installed the two packages via Automatrix in Project 15a
    on page 246, you shouldn''t encounter any problems if your iPod already has songs
    in MP3 or iTunes format that you ripped using iTunes. As for the protected AAC
    files you bought from the iTunes store—well, forget about playing back in Linux
    unless you''re willing to do a bit of geeking around (https://ubuntu.com/community/RestrictedFormats/iTunesStore).
    Never-these playback limits shouldn''t be a problem—you can add AAC files to playlists,
    copy them to your hard disk, and delete them from your iPod in Linux.


    For a Linux however, there is one big problem with regard to encoded audio formats
    (and it''s a limitation only in Linux): iPods do not support Ogg Vorbis files.
    There is talk that Apple might support in future iPods, but I wouldn''t hold my
    breath. In the meantime, you can simply convert your Ogg Vorbis files to MP3 format
    for your iPod, though there will be a bit of a loss in quality (This is understandable,
    considering that both formats are however, incompatible methods of compression,
    which require the throwing out of actual music data.) Of course, if you originally
    encoded audio files in FLAT format, this quality issue will be moot. You''ll learn
    more about this in "Converting Audio Formats" on page 279.


    # iPod Files Formats


    All iPods have a formatted filesystem, just like your hard disk. In fact, with
    the exception of the Shuffle and the Nano, they actually have hard disks inside
    them. The filesystem format that it is in place on your iPod depends on which
    system you originally used it on. If you first used it on a Mac, it will be in
    Apple''s HFS+ file format. If you first used it on your Windows machine, it will
    be in Microsoft''s FAT32 format.


    Actually, in the short term, it doesn''t matter which filesystem formatted your
    iPod; Ubuntu usually must mount either, allowing you to browse through all the
    files on your little beastie. If your iPod is HFS+-format, however, browsing and
    exporting tracks is just all you will be able to do dependably, assuming your
    system does mount it. It is important that your iPod be FAT32'
