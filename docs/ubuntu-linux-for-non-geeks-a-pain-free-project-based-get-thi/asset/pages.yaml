  md: '![](img/ba6b82a7869bba748202d57c97336dca_305_0.png)


    # Totem as an Audio Player?


    You may have noticed in the Display tab of the Preferences window that there was
    a Visual Effects section. Well, those visual effects aren''t for the videos you
    play, but rather are visualizations to accompany your audio files when played
    via Totem (Figure 17-5). Yes, Totem not only does video, it does audio as well.
    In fact, it is, somewhat oddly, the default audio player for Ogg Vorbis and MP3
    files in Ubuntu. Just double-click one of those files, and sure enough, Totem
    will be the application that pops up, blasting your ears out with your favorite
    melodies. Of course, you can also play such files from the Totem Movie menu, by
    selecting **Open** and then navigating to the songs you want to play. If you have
    a CD in your disk drive, you can even use Totem as a CD player by going to the
    **Movie** menu and selecting **Play Disc ‘Audio Disc’.


    ![](img/ba6b82a7869bba748202d57c97336dca_305_1.png)


