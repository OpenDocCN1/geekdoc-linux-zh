  md: '# PRAISE FOR THE FIRST EDITION,

    UBUNTU LINUX FOR NON-GEEKS


    "A fast, crystal-clear topical tour of the amazing collective accomplishment embodied
    in Ubuntu. I learned something new in every chapter, and ended up with a computer
    that did more of what I wanted to do, faster. This book should come with every
    every Ubuntu Live CD—it''s just the documentation I needed to take some of the
    mystery out of my machine."

    —BOING BOING


    "Highly recommended to all Ubuntu newcomers."

    —PC WORLD


    "This very nice book on Ubuntu Linux is clearly targeted at the neophytes who
    wish to take their first steps in installing and using Ubuntu. The author explains
    in a step-by-step manner solutions to the problems that one might face in installing,
    configuring and using Ubuntu Linux."

    —SLASHDOT


    "This is a good, practical book that reads well and doesn''t involve the victim
    in lots of superfluous stuff."

    —UNIX REVIEW


    "Grant makes it seem easy with his step-by-step instructions and plenty of screen
    shots."

    —LINUX.COM


    "With humor and pragmatism, Mr. Grant walks the novice explorer through the basics
    of switching to this distribution of Linux, on to the practical level of getting
    things done."

    —P2P FOUNDATION BLOG


    "The best thing in Rickford’s Ubuntu Linux for Non-Geeks is plenty of practical
    examples."

    —LINUX MAGAZINE


    "Highly recommended for both new Linux users and new computer users in general."

    —BLOGCRITICS'
  merge: -1
  pgno: 2
- img_proc: true
  md: In loving memory of Dr. James Howard Cremin, who, along with his family, gave
    me a place in which to find a sense of self during my early days of tumult and
    who managed to keep his cool when I blew out half the electricity in his house
    one Christmas morning. I miss you.
