    # **Downloading, Installing, and Running YamiPod**


    To get YamiPod, go to www.yamipod.com and download its Linux version. With Floola,
    when Firefox allows you to download the file, click the default Open with Archive
    Manager by clicking OK. The Archive Manager opens YamiPod to your home folder.


    Unlike Fluent, you are not ready to use YamiPod. Before you can run YamiPod you
    will need to copy the file that begins with libmodex within the yam-linux folder
    to the /usr/lib folder. Since /usr/lib is in protected territory, you will have
    to use the sudo command to perform the copy procedure. Here are the steps:


    +   1. Open a terminal window, use **cd yam-linux**, and press ENTER.

    2. In the same Terminal window, follow the following command and press ENTER,
    making sure to leave a space on either side of cp and so.* /usr/ like so.


    ```

    sudo cp libmodex.so.* /usr/lib

    ```


    +   3. When prompted for your password, type it, and press ENTER. If your user
    prompt reappears, you can close the Terminal.


    276 Chapter 16'
