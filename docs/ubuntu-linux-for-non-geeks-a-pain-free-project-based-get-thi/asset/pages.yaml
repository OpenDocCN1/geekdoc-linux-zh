    the Return to previous login button.


    Another window will appear, in which you must type the user password of the account
    you are returning to. Type your password, click Unlock, and you will be back at
    your original desktop, with everything as it was when you last saw it, open windows
    and all. Pretty cool.


    # Logging In to Another Account in a Separate Window


    If switching back and forth between accounts seems like too much of a hassle to
    you, there is yet another, alternative—logging to another account in a separate
    window while still in your user account.


    This-two-places-at-the-same-time approach requires a little bit of work front,
    in the long run, but only when going through Project 7B on page 106, also whenever
    one of those “rents, can I check my email for a second?” arises. To set things
    up so you can do this, you need to install, and use an application called Xnext.
    Here are the steps:


    +   1. Run Synaptic, do a search for xnext, and install it.


    +   2. Once Xnext is installed, click Synaptic, right-click the Applications menu,
    and select Edit Men in the pop-up menu.


    +   3. When the menu editor window appears, click System Tools in the panel, and
    click the box next to New Login in the right pane.


    +   4. Right-click New Login, and in the Launcher Properties window that appears,
    change the command to gdmlexerver -n (making sure there is a space before -n).


    +   5. Click Close in both windows to finish.


    After performing these steps, you can log in to your new account by going to the
    Applications and selecting System Tools -> New Login. An Xnext window will appear,
    and after a few seconds, the Ubuntu login window will appear within window. In
    that screen, type your new username (graphika, or whatever name you chose) and
    password as you would during any other login. Your new desktop will appear in
    the Xnext window (Figure 7-4).


    When you are done with your Xnext session, click the Logout button at the far
    right of the top panel within the Xnext window, and then click Logout in the set
    of choices that appears. The Xnext window will automatically close after you have
    been logged out of that session.'
