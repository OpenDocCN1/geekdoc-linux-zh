  md: '# 10


    # GUTENBIRD

    Setting Up and Using Your Printer and Scanner


    ![](img/ba6b82a7869bba748202d57c97336dca_194_0.png)


    Two of the most common computer peripherals are printers and scanners. This only
    makes sense, as it is those two that turn a web-surfing, game-playing, music-churning,
    number-crunching box of chips into a meaningful production tool—a virtual publishing
    house, if you will. These two tools help you convert digital information into
    hard copy (in the case of printers) and hard copy into digital information (in
    the case of scanners). It is not surprising, therefore, that these tools often
    come together these days in the form of multifunction printers.


    In this chapter, you will learn how to connect these useful devices to your computer,
    how to set them up, and how to use them. If you are more into working with your
    digital camera than with a scanner, you might want to sneak a peek at Chapter
    14; otherwise, put on your printer’s smock, and follow on. . . .'
  merge: -1
  pgno: 194
- img_proc: true
  md: '# Printers


    Unless the only thing you use your computer is for playing games, listening to
    MP3s, or stopping doors on hot, breezy days, you will no doubt want to hook up
    your machine to a printer. Despite the paperless office era that the personal
    computer was supposedly going to usher in, it the computer''s strength as a desktop-publishing
    and general work tool has made high-quality printed documents an even more attractive
    than ever before.


    # Confirming That Your Printer Is Supported


    Setting a printer to work with your new system is a pretty easy task, but you
    have to make sure that your printer is supported by Linux. Fortunately, it seems
    that in the Linux world support is getting much, much better than once was. In
    general, support for Epson, Brother, Samsung, and Hewlett-Packard printers is
    pretty good, well support for other makers and other printer types is a bit spottier,
    though improving.


    If you really want to make sure your printer is supported (and why wouldn''t you?),
    the best thing to do is go to www.linuxprinting.org. On that site, you can check
    the online database to see if your printer is currently supported and, if so,
    to what degree. Listings for supported printers also include information on what
    drivers are best for your purposes. If you''re thinking of buying a printer, there
    is also a page of suggested makes and models. You might also want to consult Ubuntu''s
    list at https://wiki.ubuntu.com/HardwareSupport-Components


    # Setting Up Your Printer


    If you have a USB printer, get started by connecting it to your computer and powering
    up the printer. If your printer connects to your computer''s parallel port, you
    will first have to turn your computer off, connect your printer to the computer,
    turn on the printer, and start your computer. Of course, if your printer was connected
    and on during installation, you can skip this step. Either way, your printer will
    be detected, and you won''t get one of those immediate new-hardware-found alerts
    that you do in Windows.


    Once your system has restarted, here is what you need to do:


    +   Go to the System menu, and select Administration Printing.


    +   A printers window will appear, showing a printer with the name New Printer.
    Double-click that icon, after which a setup wizard will appear (Figure 10-1).


    The name of your printer should appear in the pane below the words Use a detected
    printer, due to the wonders of plug and play (which means your printers, scanners,
    and other devices can tell your computer what they are). Unfortunately, just because
    your system knows which'
  merge: -1
  pgno: 195
- img_proc: true
  md: 'printer you have hooked up to hardware-wise doesn’t actually mean it can communicate
    with that printer in terms of printing (ditto for Windows and Mac OS X). That’s
    drivers are for.


    ![](img/ba6b82a7869bba748202d57c97336dca_196_0.png)


    Figure 10-1: The printer setup wizard


    3. Continue by clicking the **Forward** button, which will take you to the second
    page of the wizard, shown in Figure 10-2.


    ![](img/ba6b82a7869bba748202d57c97336dca_196_1.png)


    Figure 10-2: Selecting the make and model of the printer in the printer setup
    wizard'
  merge: -1
  pgno: 196
- img_proc: true
  md: 'This second page of the wizard should automatically open with the make and
    model of your printer selected, as well as the recommended driver for that printer.
    If the model chosen is not correct, scroll down the list until you find the correct
    model. If your model is not listed, try the one that was selected by default.


    +   Once your printer is selected, click the Forward button, which will bring
    you to the last page of the wizard.


    +   On this page, type a name for your printer, and, if you give a description
    and its location. When you''re finished, your window should look something like
    mine in Figure 10-3. You can then click Apply.


    ![](img/ba6b82a7869bba748202d57c97336dca_197_0.png)


    Figure 10-3: The final page of the printer setup wizard


    The wizard should close, leaving you at the Printers window where you started
    this quest. An icon for your printer should now appear in that window alongside
    the New Printer icon that you originally found. If you have set up than one printer,
    you can choose which one would like to be the default by right-clicking the printer
    and selecting Make Default in the menu that appears. The icon for that printer
    should then be emblazoned with a blue checkbox (Figure 10-4), indicating that
    it is the default printer for your system.


    ![](img/ba6b82a7869bba748202d57c97336dca_197_1.png)


    Figure 10-4: The New Printer icon in the Printers window after completion of the
    printer setup wizard


    178 Chapter 10'
  merge: -1
  pgno: 197
- img_proc: true
  md: 'Your printer is now set up and ready for use. However, just to make sure that
    everything is hunky-dory, it is always a good idea to print a test page.


    +   1. Right-click the icon for your printer in the Printers window, and select
    Properties in the popup menu.


    +   2. In the Properties window that appears, click the Print Test Page button.


    Your system will send a document to your printer and let you know it''s done in
    a small window, which you can close. The printer should print out the test document
    shortly.


    If your test page didn''t come out the way it should, or if your printer wasn''t
    configured automatically or correctly by the system, check out www.linuxprinting.org,
    and see if there are any special requirements or caveats for your model.


    # For the Driverless Among You


    As I mentioned, there are some printers for which Linux does not have built-in
    support. For those of you who finds yourself with such printers, there are a few
    routes you can take in order to get things to work.


    # Checking the Connections


    You''d be surprised how many times I have triumphantly solved someone''s printer
    problems by simply wiggling or replugging your USB or parallel connectors. Loose
    connections are often the culprit when your printer''s model name fails to appear
    in the first page of the printer setup wizard.


    If that approach fails, browse to www.linuxprinting.org, as it is sometimes the
    case that Linux can only support certain printers if they are connected via the
    parallel port, even if they work via USB in other systems.


    # Third-Party Drivers


    Recently, and more Linux printing drivers are becoming available. If you don''t
    find your printer on second page of the printer setup wizard, just Googling the
    make and model of your printer plus the word linux. In my case, having a Samsung
    SCX4100 laser driver that did not appear at www.linuxprinting.org, I searched
    for samsungs-SCX4100+linux.


    This led me to www.driverstock.com, which provides free printer drivers for most
    operating systems, including Linux. On that site, I found not only the driver
    for my printer, but also the driver for its built-in scanner.


    You might also want to check the website for the manufacturer of your printer,
    as many now provide Linux drivers for a number of printers. Brother, Lexmark,
    Hewlett-Packard, and Samsung, do name a few. Canon seems to be the main holdout
    as far as the big guys. There is also a German company (www.turboprint.info) that
    provides Linux drivers, albeit for a fee, for machines that are really hard to
    deal with and for high-quality graphic solutions.'
  merge: -1
  pgno: 198
- img_proc: true
  md: 'If you happen to find and download a driver for your printer that does not
    come with its own installer (the driver file should end in .ppd), go back to the
    printer setup wizard, click the **Install Driver** button on the page, and navigate
    to the driver file you downloaded.


    Don''t forget to check the Ubuntu forums (www.ubuntuforums.org) a try to see if
    anyone has any experience getting the printer in question to work on your system.


    # Trial and Error


    Finally, there is always the trial-and-error approach, which works on occasion.
    When setting up your printer via the wizard window, try selecting **Generic PostScript
    Printer**, which works with some machines. If that fails, try choosing from one
    of the other models and/or drivers available for printers from your printer''s
    manufacturer.


    After you are done with the wizard, click the Preferences for the printer you
    added, click the **Print Test Page** button, and see what happens. If nothing
    happens, click the **Driver** tab, select a different printer model, and then
    press the **Print a Test Page** button again. Repeat until something works. With
    any luck, something will... might... well, just give it a try if you''re desperate.


    # Printing Details


    Now that your printer is set up, you will no doubt want start printing. This is
    an easy task and not much different from how it works in the Windows and Mac worlds,
    so you will need little explanation in this regard. There are a few points of
    difference, however, so I will touch upon these.


    # Printing to PDF


    One of the nice features of Linux is that you can save most documents as PDF files.
    In some cases, such as in OpenOffice.org, you do this by exporting the document
    to PDF. In other applications, however, you do it via the Print dialog box, in
    which case you are said to be "printing to PDF". Whether you are saving to PDF,
    exporting to PDF, or you are essentially doing the same thing: creating a PDF
    file of your document.


    This is very, as it allows you to create documents that cannot be altered by others
    and can easily be read regardless of what word processor or computer platform
    the reader is using. Best of all, this feature, which you would have to pay a
    pretty penny for in the Windows world, costs you nothing, as it is built into
    your system.


    In most GNOME applications, you can print to PDF by going to the **File** menu
    of the application in question and selecting **Print**. When the window (Figure
    10-5) appears, select **Create a PDF document** in the Printer pane, and then
    click the **Print** button.'
  merge: -1
  pgno: 199
- img_proc: true
  md: '![](img/ba6b82a7869bba748202d57c97336dca_200_0.png)


    Figure 10-5: Printing a file to PDF in most GNOME applications


    # # Printing Web Pages to PDF


    Printing to PDF is also a very handy way of saving a web page that you would like
    to keep on hand in its graphical entirely for future reference. At this time,
    Firefox does not support this feature, though it allows you to print a page to
    PostScript. As long as you are strictly using the file on your system or giving
    it to someone else with a Linux system, you likely won''t notice any difference
    between PS and PDF files, how they look and act pretty the same.


    To print a web page to PostScript, go to the Firefox **File** menu, and select
    **Print**. When the Print dialog window appears, select **Print to file**, and
    then give your page a name, being sure to keep the .ps file ending. Clicking **Print**,
    and within seconds, the file will appear on your hard disk.


    This is all fine and daddy, but if you want to distribute the document to a broader
    audience, the PostScript alternative just won''t do, as most Windows users won''t
    have any way to view the file. What can you do? Well, one way is to create the
    PS document and convert it to PDF using the ps2pdf command. This is easy to do,
    though it doesn''t always work so. You may find, for example, that the text within
    your PS document vanishes in the output PDF file, or that the text appears, though
    the graphics vanish. Giving it a try can''t hurt, so here''s how you do it. Just
    type `ps2pdf filename.ps filename.pdf` in your Terminal, and press ENTER. Yup,
    that''s all there is to.


    # # Project 10: Creating a Virtual PDF Printer


    If you aren''t satisfied with the results of a ps2pdf conversion, but you still
    want to be able to print web pages to PDF, there is a fairly simple solution—create
    a virtual PDF printer. By doing so, you will be able to print to PDF in any application
    that allows printing (sorry gamers).'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# 10-1: Getting Setting Up the Files You Need


    To get started, run Synaptic, perform a search for cups-pdf, and install it. Once
    it is installed, open a Terminal window, type sudo chmod +s /usr/lib/cups/backend/cups-pdf,
    and press ENTER. When prompted for your password, type it, and press ENTER.


    # 10-2: Setting Up Your Virtual PDF Printer


    After the cups-PDF installation and preparation is complete, you can go on setting
    up your printer. To do this, go to the System menu, and select Administration
    ▸ Printing. Provide your password when prompted, and then, when the Printers appear,
    double-click the New Printer icon. In the Add a printer wizard, select Local Printer
    and Use a detected printer, and then click once on PDF to select. Once you''re
    done, click Forward.


    On the second page of the wizard, select Generic in the Manufacturer menu, and
    select postscript color printer rev3b in the Model section. Your window should
    look like that in Figure 10-6. If it does, click Forward.


    ![](img/ba6b82a7869bba748202d57c97336dca_201_0.png)


    Figure 10-6: Creating a virtual PDF printer


    Finally, on the last page of the wizard, fill in the text boxes as you like and
    click Apply to seal the deal. When you want to shorten the name of the printer
    to something more manageable, such as My PDF Printer.'
  merge: -1
  pgno: 201
- img_proc: true
  md: '# 10-3: Using Your Virtual Printer


    Once you''ve set up your virtual PDF printer, you can use it quite easily. In
    fact, because your system views it as a real printer, all you have to do is go
    through the usual steps for printing any document, but just be sure to select
    your virtual PDF printer as the printer for the job in the Print window when it
    appears.


    Once you''ve printed a document using the virtual PDF printer, you can find your
    documents in the PDF folder that cups-PDF will create for you within your home
    folder the first time you use the virtual PDF printer.


    # Canceling a Print Job


    It happens to all of us. You wanted to print 1 page of a 57-page document, but
    you accidentally started printing the whole thing. What can you do to save your
    ink and 56 sheets of paper? Fortunately, the solution is simple.


    Once you''ve clicked the Print button and the job is sent to your printer, a small
    printer icon will appear at the right of the top GNOME Panel (usually to the left
    of the other items there), as you can see in Figure 10-7.


    ![](img/ba6b82a7869bba748202d57c97336dca_202_0.png)


    Figure 10-7: A printer icon appears in the GNOME panel printing.


    Just click that icon once, and a window showing your current and queued print
    jobs will appear (as shown in Figure 10-8). Your print job will be listed in window,
    so select the name of the job to select, and then, in the Edit menu, select Cancel
    Jobs. If you just want to stop things temporarily, you select Pause Jobs instead.


    | PSC-1530-Printing (Default) |

    | Printer Edit |

    | Name | The American Nyckelharpa Association | NyckelNotes - the ANA Newsletter
    |


    Figure 10-8: Canceling a print job via the queue window


    After you do this, the print job listed in the queue window will disappear, and
    your printer will stop printing. You can close the print queue window. This is
    a very easy process that you may well find is more effective than what you''ve
    experienced in other operating systems.


    In some cases, things will be even easier, particularly if you installed your
    printer driver yourself by means of the installer that came packaged with the
    driver. In many cases, the driver will provide its own property'
  merge: -1
  pgno: 202
- img_proc: true
  md: 'window will appear whenever you print a document. If so, you can simply click
    the Cancel button (or equivalent) in that window to cancel the printing job.


    > NOTE In some cases you may have to clear your printer after canceling a print
    job. You can do this by turning your printer off, waiting a few seconds, and then
    turning it on again.


    # # Scanners


    Scanners are extremely useful and about as cheap a peripheral device as you can
    get. They allow you to take images or pictures of text and input, in digital form,
    into your computer—in much the same way as you would duplicate a document on a
    copy machine. However, even as digital cameras are overtaking traditional film
    cameras as the photographic device of choice for the masses, the number of people
    using scanners to transfer their non-digital images into digital form is slowly
    decreasing.


    Despite this trend, scanners are not in immediate danger of extinction because
    there are more images around than you photograph yourself. In some ways, you could
    argue that scanners are becoming a bit more common due to the fact that they often
    come as part of the increasingly popular multifunction printers.


    Even though scanners have been around for a relatively long time, support for
    them in Linux is still a bit spotty. Frankly, this is changing for the better
    with every new Linux release. The back end, the essentially hidden part of your
    system that handles scanner recognition and support in Linux, is called Sane,
    while the graphical interface for Sane is called XSane (shown in Figure 10-9).
    If you are wondering whether Linux will recognize your scanner, or if you are
    trying to figure out what type of scanner to buy, you will probably want to go
    to the Sane website, www.sane-project.org/sane-mfgs.html.


    ![](img/ba6b82a7869bba748202d57c97336dca_203_0.png)


    Figure 10-9: Scanning with XSane'
  merge: -1
  pgno: 203
- img_proc: true
  md: 'There will be able to see whether your scanner is supported or get tips about
    scanner to buy. As I have mentioned before, you can also try out the Ubuntu forums
    (www.ubuntuforums.org) and ask for Ubuntu-specific recommendations there.


    # Scanning with XSane


    To run XSane, go to the Applications menu, and select Graphics > XSane Image scanning
    program. XSane will then perform a search for an attached scanner. If it finds
    one, it will start up. If it doesn''t, it will pop up a tiny window that says,
    "No devices available." You can do little else than click the Close button.


    If you run up against this problem, you can try running XSane as root by going
    to the Applications menu and selecting System Tools > Run as different user. When
    the Run window appears, type xsane in the Run box, and then press the OK button.
    If your stars are in alignment, XSane should detect your scanner, pop up a message
    that it is dangerous to run XSane as root, and then open up in its full multi-windowed
    glory.


    If your scanner isn''t detected, a trip to www.sane-project.org or www.ubuntuforums.org
    might be in order to see if there are any known workarounds for your particular
    scanner model.


    To actually scan something, place the photo, document, or whatever it is you are
    planning to scan on the scanner bed, and click the Acquire preview button at the
    bottom-left corner of XSane Preview window (usually opens up at the right end
    of your screen). Once the preview appears, use the selection tools in the window
    to define the exact area you want to scan, and choose your resolution and color
    depth settings in the main XSane window (which usually opens up at the top left
    of your screen). When everything is ready, click the Scan button, after which
    your scanned image will appear in a New viewer (as shown in Figure 10-10).


    In that window, you can perform some tweaks of the image by using the buttons
    and menu items provided, and save the image by going to the File menu and selecting
    Save. If you scanned a document that you want to convert to text, the second button
    from the left (the one that says ABCDEF), and you will also be able to save the
    file as a text document.


    If you happened to download and install a driver for your scanner or multifunction
    printer from the device manufacturer''s site (or elsewhere), you may find yourself
    with another scanning application provided within the driver package. If you prefer,
    you can use that application instead of XSane to perform your scanning chores.'
  merge: -1
  pgno: 204
- img_proc: true
  md: '![](img/ba6b82a7869bba748202d57c97336dca_205_0.png)


    Figure 10-10: The results of your scan are displayed in a separate Viewer window.


    # Why Are My Scanned Images So Big?


    To wrap up it on scanning (and, for that matter, this chapter), let me address
    a question that seems to confuse a lot of people. One of the first areas of confusion
    is that there is a general blurring of how the terms ppi (pixels per inch) and
    dpi (dots per inch) are used. Most applications use these terms interchangeably,
    and yet they aren''t really the same thing. To make things simple, when you are
    talking about images on your screen, you are talking about pixels (the little
    squares that make up your screen) per inch, and when you are talking about dpi
    (of printer inch) per inch.


    Your computer generally has a resolution of 76ppi, while modern inkjet and laser
    printers have a resolution range of 300 to 1200dpi, or sometimes even more. This
    means that a photo scanned at 76 looks just fine on your screen, ending up pretty
    lame when you print it out. On the other hand, when you scan a picture at 300ppi,
    the image will look much better in your printout but seem gigantic on your screen.
    It makes sense, as the resolution of your image is more than three times of your
    computer screen''s resolution. The result is that your computer can accommodate
    the higher resolution of the image only by displaying that image three times its
    original size.


    186 Chapter 10'
  merge: -1
  pgno: 205
- img_proc: true
  md: 'As an example, have a look at Figure 10-11, where you can see an identical
    image scanned at three different resolutions: 76ppi, 150ppi, and 300ppi. As you
    can see, the 76ppi image at the far left (measuring $5 \times 6$ inches—the size
    of the hard copy itself) is the smallest, while the other two images are proportionally
    bigger (about $10 \times 12$ inches for the 150ppi image and about $22 \times
    25$ inches for the 300ppi image).


    ![](img/ba6b82a7869bba748202d57c97336dca_206_0.png)


    Figure 10-11: The same image scanned at three different resolutions


    # What Resolution Should I Use When Scanning?


    What resolution you use when scanning really depends on a variety of factors,
    the most important of which is what you plan to do with the image when you''re
    finished. When I look at Figure 10-11 on my computer screen, the smallest image
    looks best, the middle image looks okay, and the largest looks a bit odd, not
    as sharp as the other two. Basically, when scanning images for display on a computer—on
    web pages, for instance—it is probably best to stick with a ppi similar to typical
    resolutions or slightly larger: 76 to 150ppi.


    When it comes to printing, a whole new set of considerations comes into play.
    First of all, there are the limitations of your scanner, since different models
    have different maximum resolutions. The resolution limits of your printer itself
    are also, naturally enough, a major consideration. For example, laser printers
    and inkjet printers have different characteristics more greatly affected by the
    type of paper used than a laser printer will be.

    Of course, your printed output is not going to suffer if you scan your images
    at higher resolutions than those at which you plan to print them out, but you
    will end up with a lot of files taking up much disk space. Remember: *The higher
    the resolution of a scanned image, the greater the file size in terms of space.*
    If this is of concern to you, you can simply resize the images after you''re'
  merge: -1
  pgno: 206
- img_proc: true
  md: 'done printing using an application such as the GIMP (more on that in Chapter
    14), but if you would prefer not being so cavalier with your use of disk space
    from the get-go, you can follow these very general guidelines:


    +   * If you are using a laser printer, scan at the same resolution at which you
    are going to print.

    * If you are going to use an inkjet printer with photo-quality paper, scan at
    about 80 percent of your target printout resolution—about 240ppi for a 300dpi
    printout.

    * If you are using an inkjet printer with regular paper, scan at about 65 percent
    of your target printout resolution—about 195ppi for a 300dpi printout.


    Needless to say, these are just suggestions to get you started. What works best
    for you and your particular scanner/printer setup may be slightly different. Nothing
    works better than a bit of experimentation and trial and error. In this case,
    you can''t really go wrong. Just give yourself some time, don''t get frustrated,
    and, most importantly, don''t wait until you desperately need to scan something
    before trying things out—stay ahead of the game.'
  merge: -1
  pgno: 207
- img_proc: true
  md: '# 11


    # FONT FEATHERED FRENZY


    Adding New Fonts to Your System


    ![](img/ba6b82a7869bba748202d57c97336dca_208_0.png)


    There are basically two kinds of fonts: bitmap and outline. The difference between
    these two is essentially the same as that between bitmap and vector graphics,
    which I will talk more about in Chapter 14. Bitmap characters are stored as a
    map of dots—the bitmap. The main limitation of bitmaps is that they only look
    good at the size and resolution they were designed for. Just like bitmap images,
    the more you enlarge a bitmap character, the worse it looks. This is particularly
    noticeable in rounded characters, such as O and P, where "the jaggies" becomes
    an issue.


    Outline fonts, on the other hand, are similar in concept and design to vector
    graphics. Each character is stored as a mathematical formula, and just like vector
    graphics, outline characters keep their clean shape no matter how much you enlarge
    them. The main outline font formats are Type 1, or PostScript, which was developed
    by Adobe, and TrueType, which was developed by Apple. As free TrueType fonts are
    so readily available on the Internet and so easily handled in Ubuntu, I will focus
    on TrueType fonts in this chapter.'
  merge: -1
  pgno: 208
- img_proc: true
  md: 'Your Ubuntu system comes with a wide variety of very usable and, at least to
    my eyes, rather handsome TrueType fonts. However, these tend to be on the conservative
    side of the aesthetic spectrum, and many users want to add a few more distinctive
    fonts to the system repertoire. In my own case, I had this really cool idea of
    writing messages to my friend in old Scandinavian runes.(Of course, my friend
    wet-blanketed the idea, so it all came to naught. . . .)


    You probably won''t be interested in sending cryptic, runic messages to your friends,
    but you may want to print out an award for an event using some Gothic font, or
    you might be preparing a newsletter for the local chapter of your snail-breeders
    society and to use a font that is round, bubbly, and slimy. Whether your penchant,
    purpose, or desire, you will probably come to the point when you want to install
    some other TrueType fonts on your system.


    Before you install anything, of course, you will have to find some fonts. The
    Internet is always good source, and there are many sites that have a variety of
    freeware, shareware, and for-sale TrueType fonts available for download. When
    choosing and downloading fonts, it is best to select those designed for Windows
    rather than those designed for Mac. Fonts designed for Windows most likely be
    in the form of Zip files, which will pose no problem for you, because you can
    extract them with File Roller. Simply double-click them, just as you have with
    the other archived files you used far, and click the Extract button in the File
    Roller window when it appears. The font file will appear on your desktop (or wherever
    your Zip file happened to be) as an icon showing an upper- and lowercase case
    of the first letter in that font (Figure 11-1).


    ![](img/ba6b82a7869bba748202d57c97336dca_209_0.png)


    Figure 11-1: Font icons display the first letter in the font.


    In addition to getting a glimpse of what the fonts look like these icons, you
    can also see all, or at least most all, of the characters in a given font by double-clicking
    the font icon. A window, as shown in Figure 11-2, will open, showing you most
    of the characters in A-to-Z format and then in the traditional “The quick brown
    fox jumps over the lazy dog” format that you may well remember from your junior
    or senior school typing classes.'
  merge: -1
