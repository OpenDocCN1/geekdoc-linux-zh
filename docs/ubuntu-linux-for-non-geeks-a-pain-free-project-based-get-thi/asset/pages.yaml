    By the way, in case you are wondering what a share is, I''ll clear up for you.
    Basically, a *network share* is a location on a computer, where other users on
    a network can access and save files. The Shared Documents folder on a Windows
    system is a good example. Other users on a network can copy files from and (usually)
    write files to the Shared Documents folder, whereas they cannot access any other
    part of the filesystem on that host machine.


    If you are trying to open requires a username and password, you will be asked
    for those in a new window (Figure 6-8). Note that in this case, the username and
    password you need to enter are for the machine you are trying to connect—not the
    ones you are using in Ubuntu (unless the username and/or passwords happen to be
