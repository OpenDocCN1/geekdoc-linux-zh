- img_proc: true
  md: '# UBUNTU DESKTOP CDS

    FOR AMD64 USERS


    ![](img/ba6b82a7869bba748202d57c97336dca_320_0.png)


    As I mentioned in Chapter 1, the version of the Ubuntu Desktop CD that comes with
    this book is designed to work with i386 processors, either in PCs or Intel-based
    Macs. It will also work with AMD64 processors, albeit not in 64-bit mode. In order
    to use Ubuntu with AMD64 processors in 64-bit mode, you must get a different disc
    on your own. There are several ways of doing this: downloading an ISO (disk image)
    and burning it to CD yourself, ordering the CD from Ubuntu (for free), or ordering
    it from an online Linux CD provider (for a nominal cost).


    # Downloading and Burning Ubuntu Desktop ISOs to CD


    To download an ISO of the Ubuntu Desktop CD, go to the Ubuntu website at www.ubuntu.com,
    find the link to the download page, and then select and download the appropriate
    version for your machine. Remember that the ISO file you will be downloading is
    a heavyweight, weighing in just over 700MB,'
  merge: -1
  pgno: 320
- img_proc: true
  md: 'so the download will take a bit of time. Don''t count on getting it downloaded
    and done before dinner . . . or, if you happen to be using a dial-up Internet
    connection, before dinner tomorrow. Yikes!


    # Burning the ISO to CD in Windows


    After the Desktop CD ISO has been downloaded, you need to burn it to CD before
    you can use it. Although Windows has built-in CD-writing capabilities, it does
    not have the ability to burn an ISO to CD in Windows, therefore, you must use
    a third-party commercial application, such as Nero. If you don''t have a commercial
    CD-burning utility installed on your system, try the free and handy ISO Recorder.


    To get ISO Recorder, visit to http://isorecoder.alexfiman.com/v1.htm. Once the
    download is complete, double-click the ISORecorder.msi on your hard disk to install
    it.


    After the installation is complete, burn your ISO to CD by double-clicking the
    Ubuntu ISO file on your disk and selecting *Copy image to CD* in the popup menu.
    A CD Recording window, like that in Figure A-1, should appear.


    ![](img/ba6b82a7869bba748202d57c97336dca_321_0.png)


    **Figure A-1:** Burning an ISO to CD in Windows using ISO Recorder


    It is generally best if you burn installation or live CDs at a lower speed than
    the maximum speed allowed by your drive, in order to reduce the chance of error
    (with 2X to 4X speeds considered optimal). To do so, click the **Recorder Properties**
    button in the CD Recording window, and drag the slider in the Properties window
    to about 4X. Next, pop a blank CD into the drive and click the **Next**. The CD
    burning should begin. Once it''s done, the CD should pop out of the drive, and
    if all goes well you''ll have an AMD64-compatible live CD. You can use it by following
    the directions found at the beginning of Chapter 2 for the live CD that comes
    with this book.'
  merge: -1
  pgno: 321
- img_proc: true
  md: 'NOTE If your CD does not work, there could be a problem with the ISO file downloaded.
    Find out by doing an an integrity check as explained at https://help.ubuntu.com/community/HowToMD5SUM.


    # # Burning the ISO to CD in OS X


    Although Ubuntu no longer comes in PowerPC editions, the i386 editions can be
    installed and run on Intel-based Macs. You can also, of course, download ISOs
    for other architectures on your Mac, and burn them to CD for use on other machines.


    To burn an ISO file to CD in OS X, first check to make sure the ISO image is not
    mounted by opening a Finder window and checking the disk area at the top of the
    left pane. If it is mounted, a white drive icon will appear in location. If the
    drive icon is there, click the arrow next to that entry, or unmount.


    After that, click Applications in the same Finder, and then look and open the
    Utilities folder. In folder, find and double-click Disk Utility. If the ISO is
    not listed in the left pane of the Disk Utility when it opens, go back to the
    Finder window, locate the Ubuntu Live CD ISO you downloaded, and drag it to the
    left pane of the Disk Utility window, just below the list for your current drives.
    If the ISO appears after in that list, click it once to highlight it. Your Disk
    Utility window should then look like that in Figure A-2.


    ![](img/ba6b82a7869bba748202d57c97336dca_322_0.png)


    | | |

    |---|---|

    | 233.8 GB Master 625OM | |

    | Macintosh HD | |

    | 240.5 MB TOSHIBA Tra... | |

    | TOSHIBA |


    +   * To repair a disk or volume, select its icon on the left and right. Click
    Disk.

    * To repair disk permissions on a disk or volume that has Mac OS X installed,

    * Click the Verify buttons to test the disk or permissions without changing anything.

    * To repair your startup disk, start up from your Mac OS Install (CD or DVD),
    then choose Utilities>Disk Utility.)


    Figure A-2: Burning the Ubuntu Desktop ISO to CD in Mac OS X


    Ubuntu Desktop CDs for AMD64 Users 303'
  merge: -1
  pgno: 322
- img_proc: true
  md: 'To complete the process, click the Burn icon on the Disk Utility window''s
    toolbar, and then insert a blank CD in your drive when prompted to do. Once the
    blank disk is inserted and recognized, you will be able to adjust the burn speed
    from the drop-down menu next to the word Speed. Select as a speed as your hardware
    will allow, which, depending on the age of your Mac, will be 4X to 8X. Finally,
    click the Burn button in that same window, and the burning process will begin.


    # Ordering an Install Disk from Ubuntu


    The easiest and most foolproof way to get an Ubuntu Desktop CD is to simply order
    one (or more) for free from Ubuntu; you don''t even have to pay shipping or handling.
    Ubuntu will not only send you install CD for your particular architecture machine,
    but they will actually use one for each of the architectures you choose: i386
    and AMD64. In fact, you don''t even get to choose which one; it''s basically an
    all-or-nothing deal, in which this case isn''t such a bad thing. Of course, the
    only downside to this approach is time. It can take four to six weeks to get the
    CDs in this manner, so if you''re impatient, you might want to opt for one of
    the other methods.


    To order your install CDs from Ubuntu, go to https://shipit.ubuntu.com and follow
    the directions there. It''s easy.


    # Ordering an Install Disk from Other Online Sources


    If you are in a hurry to get your install CD, you can also order a copy from one
    of the many online sources that specialize in copying and selling install CDs
    for a variety of Linux distributions at very low prices. For example, you can
    get an Ubuntu install CD from LinuxCD (www.linuxcd.org) for a quarter shy of two
    dollars. CheapBytes (www.cheapbytes.com) and UseLinux (www.uselux.net) are two
    other well-known sources you might want to try.'
  merge: -1
  pgno: 323
- img_proc: true
  md: When you are looking for advice, trying to solve a particular problem, or just
    looking for some general tips, online forums are the way to go. Fortunately, Ubuntu
    has a forum all its own, and since Ubuntu is primarily a desktop-oriented Linux
    distro, you are likely to find many fellow newbies and newbie-friendly posters
    there, rather than the hard-core geekiness you might find on
  merge: -1
