  md: '# Other Video Apps


    I''ve covered the main video applications in Ubuntu, but there are still others
    available that you might want to consider. A very popular alternative video/DVD
    player, for example, is MPlayer, which you can download and install by performing
    a Synaptic search for mplayer. Be sure to download not only mplayer, but also
    mplayer-fonts to avoid annoying error messages. Mplayer is also available via
    Automix.


    The cross-platform player, VLC Media Player, is another player with significant
    follow. It is noted for handling a number of video formats well, and for a simple
    and easy-to-use interface. You can get it via Automix (click Media Players and
    Editors in the left pane, click VLC Media Player in the right pane, and then click
    Start)


    Another video/DVD player you might want to consider gxine, which is similar in
    several ways to Totem, but it gives you a bit more control over things. Again,
    you can download and install gxine by Synaptic by performing a search for gxine.


    If you are not only a video watcher but also a budding video artist, then you
    might want to consider a few handy video/DVD auditing and editing tools: the multipatform
    video editor, Avidemux (Figure 17-9); QDVD-Author, a DVD creator in the iDVD vein
    (albeit without the superficial polish of Apple''s offering); and DVD:Rip, as
    you might imagine, allows you to rip the contents of a DVD to your hard disk.
    applications are also available via Synaptic by performing searches for avidemux,
    qdvauthor and dvdrip. Avidemux and DVD:Rip are also available via Automix.


    ![](img/ba6b82a7869bba748202d57c97336dca_309_0.png)


    Figure 17-9: Cross-platform video editor, Avidemux'
