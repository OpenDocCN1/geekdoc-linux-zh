  md: '# Some Other Cool Productivity Apps


    In addition to the more traditional office applications, there are a number of
    other applications included with or available for your system that can be grouped
    under the “productivity” label. I will introduce a few of those to you here.


    # Sticky Notes


    Mac users will be familiar with the digital version of the now ubiquitous little
    yellow Post-It-like notes called Sticky Notes (Figure 13-9) that come as part
    of the GNOME desktop. GNOME’s Sticky Notes is a panel applet that you can add
    to your own panel by right-clicking on any open panel space and then selecting
    **Add to Panel** in the popup menu that appears. When the Add to Panel window
    appears, go to the **Accessories** section, click **Sticky Notes**, and then click
    the **Add** button. You will then be ready for note-taking action.


    ![](img/ba6b82a7869bba748202d57c97336dca_240_0.png)


    ![](img/ba6b82a7869bba748202d57c97336dca_240_1.png)'
  merge: -1
  pgno: 240
- img_proc: true
  md: 'I should mention that there is one slightly annoying “feature” of Sticky Notes
    that makes it a bit different from what you might be used to. When you click on
    the desktop, all of your notes will disappear. This is as it is supposed to be,
    though I personally can''t see the point (and wouldn''t like it even if I could).
    Fortunately, however, you can bring all of your notes back by simply clicking
    the Sticky Notes panel again. In fact, if you decide to remove the panel and then
    bring it back at later point in time, you''ll be happy to know that all of the
    notes you created before will be back too.


    # Tomboy


    If Sticky Notes just doesn''t cut it for you and your dramatic note-taking needs,
    perhaps you will find yourself served by another application that comes with your
    system by the name of Tomboy (Figure 13-10). Like Sticky Notes, Tomboy also works
    as a panel, but it is a bit more full featured, without making any claims to stickers.
    Instead, the various notes you can create by selecting them from the menu that
    appears when you click the Tomboy panel itself. In all, a a very handy approach.


    ![](img/ba6b82a7869bba748202d57c97336dca_241_0.png)


    Figure 13-10: Notes taken seriously—Tomboy


    What really gives Tomboy its bragging rights, however, is its search and hyperlink
    functions. These allow you to search for entries within your entire Tomboy note
    library, and create hyperlinks that connect text in one note to another linked
    note. In fact, Tomboy will automatically create a hyperlink whenever you type
    a word that matches one of your existing note headings.'
  merge: -1
  pgno: 241
- img_proc: true
  md: 'To make matters even more exciting (or at least useful), Tomboy, by means of
    its plugins feature, allows you to export notes to HTML or print them out, either
    as hard copy or as PDF docs.


    If you''d like to give Tomboy a try, start by going to Applications ► Tomboy Notes,
    after which Tomboy will appear in the top GNOME Panel.


    # GnuCash


    If you are familiar with the personal financial management software GnuCash, then
    you might be interested in GnuCash (shown in Figure 13-11), which is the Linux
    world''s best-known offering in the personal finance arena. It reads Quicken and
    Intuit QIF files, which makes things even easier you should be making the transition
    from another operating system. Unfortunately, unless you live in Germany, you
    cannot use GnuCash for online banking; but as the GnuCash folks themselves say,
    don''t blame, your bank.


    To install GnuCash, just do a Synaptic search for gnucash, and then mark both
    gnucash and gnucash-docs for installation. Once these are installed, you can run
    the application by going to Applications ► GnuCash Finance.


    ![](img/ba6b82a7869bba748202d57c97336dca_242_0.png)


    # Scribus


    Round things out, we come to the open source desktop publishing application, Scribus
    (shown in Figure 13-12), for those times when OpenOffice.org Writer and Draw just
    don''t cut it. Scribus is designed to produce commercial-grade output, with support
    for professional publishing features, such as CMYK colors, PostScript handling,
    and creation of color separations, to name but a few.


    Figure 13-11: GnuCash'
  merge: -1
  pgno: 242
- img_proc: true
  md: '![](img/ba6b82a7869bba748202d57c97336dca_243_0.png)


    Figure 13-12: Scribus


    You can download and install Scribus by doing a Synaptic search for Scribus. Once
    the installation is complete, you can run the application from Applications ▸
    Office ▸ Scribus.'
