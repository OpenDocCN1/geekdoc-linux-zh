  md: '# # 13


    # ## PENGUINS BACK AT WORK


    *Getting Down to Business in Linux*


    ![](img/ba6b82a7869bba748202d57c97336dca_230_0.png)


    I have to admit it: When I think about the joys of computing, I tend to think
    of the more hedonistic, self-indulgent areas like gaming, music, and graphics.
    Still, as is the case for most computer users, what I usually end up doing on
    my computer is work, and writing this book falls into that category.


    Fortunately, Linux can get down to business and do it as well as the next OS.
    I think it''s safe to say that you are missing nothing and are probably gaining
    quite a bit in terms of home and office productivity programs in the world of
    Linux. In this chapter, I''ll walk you through the Linux offerings in this department.'
  merge: -1
  pgno: 230
- img_proc: true
  md: '# OpenOffice.org


    Whether they should be or not, people are quite obsessed with office suites, even
    though most people seldom need a word processor. The de facto standard among office
    suites is Microsoft Office, which is available in both the Windows and Macintosh
    worlds. As it is a Microsoft product, you can quite sure that there is no Linux
    version available.


    Fortunately, Linux does have an exceedingly capable office suite in the form of
    OpenOffice.org, which is, incidentally, freely available (as in free) in Windows
    and Mac OS versions. OpenOffice.org is not some lightweight sour-grapes substitute
    for the Microsoft Office–less Linux world; it is a fullfeatured contender, and
    in some cases, OpenOffice.org is a clear winner.


    # OpenOffice.org Applications


    The entire OpenOffice.org suite consists of six applications: a word processor
    (Writer), a spreadsheet (Calc), a presentation creator and player (Impress), a
    vector drawing program (Draw), a database (Base), and a mathematical formula editor
    (Math). Most of these can be accessed at Applications ► Office


    Since giving full and detailed instructions on how to use each of these applications
    would take up an entire book (and there are entries on the subject), I will simply
    introduce each module to you. Being a bit of a mathematics quince, however, I
    won''t be venturing too deeply into what you can do with Math. That said, here
    goes.


    # Writer


    As mentioned earlier, the word processor is the office application that the majority
    of users turn to most often. Fortunately, OpenOffice Writer is a good one (see
    Figure 13-1). It is chock-full of features and can read and save Microsoft Word
    files. Like Word, it will even let you save your documents as HTML files so that
    you can easily change your documents into web pages.


    ![](img/ba6b82a7869bba748202d57c97336dca_231_0.png)


    Figure 13-1: OpenOffice.org Writer'
  merge: -1
  pgno: 231
- img_proc: true
  md: 'As I said, Writer is a very straightforward word processor, so I won''t go
    on about it, but if you would like an introduction to using Writer, check out
    the First Steps tutorial at the OpenOffice.org website (www.openoffice.org/writerfirststeps/writerfirststeps.html).


    # Calc


    Calc is the OpenOffice.org spreadsheet application, and it is similar to Excel
    in terms of capabilities and general layout-it can also, quite importantly, read
    and save Microsoft Excel files.


    ![](img/ba6b82a7869bba748202d57c97336dca_232_0.png)


    Figure 13-2: A graph created in OpenOffice.org Calc


    Most people who use spreadsheets generally understand what they are all about
    and, after a bit of poking around, can figure out how to use them, I won''t go
    into any sort of primer about using Calc. However, as there are many others who
    don''t see even need to try using spreadsheets, I will mention a few of the simpler
    things that can be done with Calc, in the hope of enticing some of you into trying
    it.


    Most people who don''t use spreadsheets think of them as a sort of giant calculators
    for computing unnecessarily large sets of data, payrolls (which was the original
    purpose of such applications). That''s right, of course, but spreadsheets can
    be used for everyday tasks too, as projecting household budgets, calculating grade
    averages, figuring out how long it will take you to save up for your trip to Hungary,
    or even for something as weird as comparing the seat heights for the four or five
    motorcycles you are trying to choose. And when doing any of these minor mathematical
    tasks, you can easily create graphs in order to make all the abstract numbers
    speak to you visually.'
  merge: -1
  pgno: 232
- img_proc: true
  md: 'If numbers are just not your thing, you can still use Calc for creating lists

    of information, such as birthday lists, class rosters, shopping lists, address

    lists ... whatever. You can even have Calc put the lists in alphabetical order,

    or sort them by date of birth, and so on. Everyone seems to find

    s use for Calc, so don''t ignore it entirely.


    # Impress


    Impress is OpenOffice.org''s answer to Microsoft''s PowerPoint, with slides for
    which it

    is compatible. It allows you to graphically create attractive slides in

    presentations and also allows you to create notes or handouts handy in business
    and

    education settings, while these features make Impress quite as much value as for
    a home user.


    # Draw


    More useful to the home user is OpenOffice.org Draw. Although Draw isn''t

    all great a program for creating true graphics in the artistic sense, it is

    very useful for creating flowcharts, organizational diagrams (like seating

    rangangements for wedding receptions or conferences), or any other docu-

    ment which you want a bit more control over the placement of text and

    graphics (especially when the two are combined), such as fliers, awards,

    diagrams, and newsletters. In this sense, Draw can be used quite effectively

    as a simple page layout, as you can see in Figure 13-3.


    ![](img/ba6b82a7869bba748202d57c97336dca_233_0.png)


    Figure 13-3: A newsletter created (and displayed) in OpenOffice.org Draw


    Although Draw bundled with Ubuntu, is no longer listed in the

    Applications menu, probably because its functions can be accessed through

    the other OpenOffice.org modules. Still, it is a handy application to use

    in its own, if you would like to use it in its stand-alone form, you can run it


    Chapter 13'
  merge: -1
  pgno: 233
- img_proc: true
  md: 'either via the Run Application panel applet by typing office -draw or by adding
    the launcher yourself to the Applications menu.


    To add Draw to the Applications menu, open the Menu Editor by right-clicking Applications
    and selecting Edit Menus. Once the editor appears, click Graphics or Office (or
    both) in the left pane, depending on where you want the menu launcher to appear.
    In the right pane of the window, check the box next to the words OpenOffice.org
    Drawing. Once you''re done, click the Close button, and the Draw will appear in
    the menu.


    # Base


    New to OpenOffice.org is Base, which is a graphical front end to any data-bases
    on your machine, learning Base''s own database, HSQL. Unfortunately, learning
    how to use Base is no calcewalk if you have any experience working with database
    applications, or if the database module in AppleWorks is the extent of your contact
    with such applications, you might want to try out a relatively easy-to-follow
    tutorial (with a not-so-easy-follow URL) at http://searchopensource.techtarget.com/tip/1-289483_sid39_gci148271.0.html.


    # Math


    Finally, we can open OpenOffice.org Math. As I am a bit out of it in terms of
    math, I can really tell you much more about Math than it is a mathematics formula
    editor allows you to produce complex mathematical formulae and paste them as embedded
    objects into other OpenOffice.org programs. It is strictly an editor and does
    not calculate. I think I am safe saying that most folk have no need for it in
    their everyday lives, unless of course, you write textbooks for life.


    Like Draw, OpenOffice.org Math is not listed in the Applications menu, but you
    can access it via the Run Application panel by typing office -math. Oh, and if
    you do happen to write textbooks for life, you can also add a launcher for Math
    to your Applications menu, just as you did for Draw, by means of the Menu Editor.
    In the editor window, click the New Item button. In the Create Launcher window
    that appears, type OpenOffice.org Math in the Name box, and office -math in the
    Command box. Once you''re done, click OK. The new item will appear in the Menu
    Editor window, selected and ready to go.


    # Microsoft Office and OpenOffice.org File Compatibility


    Although I mention the point throughout this section, it is worthy to re-emphasize
    that OpenOffice.org can read and write Microsoft Office files. This compatibility
    is good enough, though tables sometimes prove slightly problematic.


    In order to read Microsoft Office files, all you need to do is doubleclick the
    file in question, and it will open in the appropriate OpenOffice.org module. When
    saving files within OpenOffice.org to use within Microsoft Office, however, you
    must save them into the appropriate format,'
  merge: -1
  pgno: 234
- img_proc: true
  md: 'OpenOffice.org otherwise save files into its native format .odt for Writer
    documents, .ods for Calc documents, and .odp for Impress next to the words by
    default.


    To do this when saving a file, click the small arrow next to File type in the
    Save window, and select the appropriate Microsoft Office format from the list
    of available file formats listed in the pane that then appears—Microsoft Word
    97/2000/XP for a Writer document, for example.


    # OpenOffice Features


    The three applications in OpenOffice.org (Writer, Calc, and Imp) are respectively,
    quite similar to their equivalents in Microsoft Office (Word, Excel, and PowerPoint),
    so switching over to the OpenOffice.org applications should be relatively easy.


    If you don'' have any experience with Microsoft Office, you should find it all
    pretty straightforward, the basic layout is pretty intuitive. If you are lacking
    in the intuition department, the built-in Help files are pretty good. To further
    help you, the Tips system work just like tooltips in the Windows and Mac worlds.
    When you aren''t sure what I''m talking about, tooltips are those little yellow
    boxes that pop up to tell you what button or menu item does when you place your
    mouse over that button or menu item.


    Despite all the straightforwardness I am speaking of, there are a few interface
    items that will most likely be unfamiliar to you. That being the case, I will
    briefly discuss these items. I''ll be using the word processor, Writer, as if
    you want to run OpenOffice.org while following along, Writer might be a convenient
    starting point for you.


    # Getting to Know the Buttons


    Although you should pretty much be able to figure out all of the buttons on the
    OpenOffice.org toolbars do, there are a few buttons common to all OpenOffice.org
    modules that most likely require, or at least deserve, a bit explanation.


    # Export to PDF


    This button is situated to the left of the two printer buttons (Print and Print
    Preview). You can use this button to export, or save, your document as a PDF file,
    in a manner that is similar to (albeit easier) the one in Chapter 10.


    ![](img/ba6b82a7869bba748202d57c97336dca_235_0.png)


    # Hyperlink


    Clicking the Hyperlink button, the button to the left of the Table button, brings
    up the Hyperlink window, from which you can assign links to specified documents—not
    only to web pages, but also to documents on an individual computer, and even targets
    within that document. While a hyperlink on a web page is something we all have
    to take for granted, the idea of hyperlinking between text documents sounds like
    a pretty radical concept. It is, fact, a rather one that has been around before
    you or I even heard of the Internet.'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# Navigator


    The fourth to the last button in the top row (the one that looks like a starburst)
    is the Navigator button. Clicking this button brings up the Navigator window (see
    Figure 13-4), which is a pretty cool navigational feature that comes in handy
    when working with lengthy or otherwise complex documents.


    ![](img/ba6b82a7869bba748202d57c97336dca_236_0.png)


    Figure 13-4: The Navigator window


    The Navigator allows you to easily bounce back and forth between pages in the
    document or between elements therein, such as sections, links, and so on. Let''s
    say that you have a document with lists of illustrations in it (like this chapter),
    and you want to jump directly from graphic to graphic. In this case, you double-click
    the main pane of the Navigator window and then click the jump buttons (the odd
    little buttons to the left of the page number) to jumping.


    If you are dealing with a document containing various heading levels, all of the
    chapters in this book, you can also use Navigator to switch among levels. Say
    you''ve decided to add a new main heading at the last minute to a document you''ve
    been writing. All of the headings you had before thus need to be dropped down
    a notch; the former main heading becoming a subheading, and so on. By double-clicking
    the word Head, the text of all the headings you have listed in the document would
    then appear. You could select a heading in that list, and then click the Demote
    button (the one at the far right of the second row of buttons) to move it down
    a notch.


    # Gallery


    ![](img/ba6b82a7869bba748202d57c97336dca_236_1.png)


    To the right of the Navigator button is the Gallery button. By clicking this button,
    the Gallery, a library of graphical elements for your documents or web pages,
    will appear in a separate pane at the top of your document window (see Figure
    13-5). The elements within the Gallery range from various types of lines to buttons
    to colored three-dimensional doughnuts, and you can add items of your own.


    Inserting a graphic into your document is a simple task even when not using the
    Gallery. All you need to do is to go to the **Insert menu**, select **Picture
    > From File**, and locate the image file you want to insert. It can be handier
    to use the Gallery, however, when you intend to use'
  merge: -1
  pgno: 236
- img_proc: true
  md: 'certain graphics frequently. Once in the Gallery, your graphics are always
    only a click or two away and can be conveniently viewed in the Gallery browser
    window.


    ![](img/ba6b82a7869bba748202d57c97336dca_237_0.png)


    Figure 13-5: The Gallery


    The collection of artwork that comes with OpenOffice.org is mostly geared towards
    building web pages, but there is other clipart available, and Automix provides
    an easy way to get and install it. Just run Automix, click Office in the left
    pane, check the box next to Open Office clipart in the right pane, and then click
    the Start button. Once the lengthy download and installation process is complete
    (there''s a lot of clipart in the collection), you will find it all organized
    and waiting for you, in the Gallery, including your favorite "stickmen" collection
    (Figure 13-6).


    ![](img/ba6b82a7869bba748202d57c97336dca_237_1.png)


    Figure 13-6: Adding clipart (including some cool stickmen) to the Gallery


    Adding your graphics to the Gallery is also relatively easy to do. First you have
    to create a new category (called a theme) for each group of images you wish to
    add. To create a Gallery theme of your own, click the New Theme button in the
    Gallery window. This will open the New Theme Properties


    Chapter 13 *New Theme**'
  merge: -1
