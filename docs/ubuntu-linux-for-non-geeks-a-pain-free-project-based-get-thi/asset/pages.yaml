  md: '# # 5


    # ## ROUNDING OUT THE BIRD


    Downloading, Installing, and Updating Programs the Easy Way


    ![](img/ba6b82a7869bba748202d57c97336dca_86_0.png)


    One of the handiest things about Ubuntu is that it is equipped with a very simple-to-use
    application installation mechanism. The engine, using the term loosely, behind
    this is a mechanism called Advanced Package Tool (APT), which allows you to easily
    download, install, update, and remove software packaged in DEB archives, or packages.


    APT is a rather foolproof way of installing programs; nothing will go missing,
    since it automatically downloads and installs any files that the application you
    are requiring to run. Tracking down such files, called dependencies, proves to
    be a significant headache for most Linux users. The painful quest of finding and
    then installing this file or that, as well as any dependencies that those files
    themselves have, has led to the missing dependency problem being referred to as
    dependency hell. APT makes that pretty much a thing of the past.'
  merge: -1
  pgno: 86
- img_proc: true
  md: 'The one thing APT that some people, especially beginners, might consider a
    problem that it is a command-driven application. This means that you control via
    commands in a command Terminal. Frequently, Ubuntu has two different graphical
    front for APT that allow you to bypass the command line and make everything as
    easy as you could be


    # Project 5A: Installing Applications via Synaptic


    As I mentioned, Ubuntu comes with two graphical front for APT: the simpler, though
    arguably more attractive, GNOME App Install; and the main application handling
    workhorse, Synaptic. Because Synaptic is the full-featured of the two applications,
    and GNOME App Install also utilizes for its settings chores, we will start off
    with Synaptic.


    To get a look at Synaptic, go to the System menu, and select Administration >
    Synaptic Package Manager. Because APT installs things in your system areas that
    are protected (more on that topic in Chapter 6), you will be prompted for your
    password in a separate window before Synaptic actually appears. The password is
    your usual user password (users of other Linux distro take note), so that is easy
    enough to remember. Type your password when prompted to do so, and click Continue.
    Synaptic, shown in Figure 5-1, will soon appear.


    ![](img/ba6b82a7869bba748202d57c97336dca_87_0.png)


    Figure 5-1: Synaptic Package Manager


    Although the Synaptic interface may seem rather simple at first glance, it is
    a very powerful program. It not only allows you to search for, download, and install
    applications, but it also allows you to find and install the less glamorous, but
    equally important, libraries and support files that you might need'
  merge: -1
  pgno: 87
- img_proc: true
  md: 'for use with other applications that come bundled with Ubuntu (such as MP3
    support), or those you install by other means. You can also use Synaptic to find
    other things such as fonts, foreign language localization files, and common utilities,
    to update the software you have installed on your system when such updates are
    available.


    Of course, if you don''t know what you''re looking for, you can browse through
    the packages via Synaptic by clicking the Sections button at the bottom-left corner
    of the window, selecting a category of interest in the pane above that, and then
    clicking the name of a specific package in the top-right pane, after which a description
    of that package will appear in the pane below.


    # 5A-1: Adding APT Repositories via Synaptic


    It is important to know that the packages that APT (and thus both Synaptic and
    GNOME App Install) searches for, downloads, and installs are located in a set
    of specific repositories. These repositories are basically online servers with
    a great number of applications, support files, and are more stored for use with
    your particular system. All of the files that originally came with your system,
    including the system (kernel) itself, and updates, when available, are stored
    there.


    Only the main application and update repositories are activated by default in
    Ubuntu, but the real gold mine of applications is located in what are called the
    universe and multiverse repositories. These repositories contain software that
    is prepared and maintained by the Ubuntu community, but not officially supported
    by Ubuntu. In order to make your Synaptic experience (and to follow along with
    future projects in this book, you will, therefore, need to make sure that the
    universe and multiverse repositories are activated.


    To do this, go to the Synaptic Settings, and select Repositories. When the Software
    Sources window appears, you will see all of the repositories that are currently
    activated (Figure 5-2). Check to see if the four boxes are checked. If any of
    those boxes are not checked, well... check them. You can ignore the last box next
    to the Source code. Once you do all that, click the Close button.


    A new window will appear telling you that you will have to click the Reload button
    in order for your changes to take effect. Click the Close button in that window,
    and then click the Reload button in the main Synaptic window as you were just
    instructed to do.


    Synaptic will then begin downloading package lists from each of the repositories
    you just added to its package database. A window like that in Figure 5-3 will
    show the progress of the download and will disappear when the process is complete.
    There will be a brief period during which all of the panes in the main Synaptic
    window will be, but don''t worry; this is only temporary.'
  merge: -1
  pgno: 88
- img_proc: true
  md: '![](img/ba6b82a7869bba748202d57c97336dca_89_0.png)


    Figure 5-2: Synaptic''s repository list


    > NOTE Because the contents of the various repositories change quite often, it
    is advisable to reload the repository lists by clicking the Reload button every
    time you take Synaptic for a spin.


    ![](img/ba6b82a7869bba748202d57c97336dca_89_1.png)


