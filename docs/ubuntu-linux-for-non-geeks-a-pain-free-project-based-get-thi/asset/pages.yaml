  md: '# Tarballs: The Containers of Source


    Almost all packages come in the form of tarballs (tarballs, DEBs, and even the
    RPMs, such as those used in Red Hat-based systems, are all referred to as packages,
    which is why the icon for such files looks like a parcel-box). As you learned
    in Chapters 6 and 8, tarballs consist of a group of files that have been archived
    into a single file, which is most often compressed to save disk space, like Zip
    files on Windows or SIT files on Macs. In Linux, the most common method of creating
    archives is through the tar program, from which the tarball gets its name, the
    compression of which is usually accomplished by means of the bzip program. Compressed
    tarballs, or tarballs, can thus be recognized by their file endings, which are
    .tar.gz, or when compressed with the bzip program, tar.bz2.


    As you learned in Chapter 8, the files archived in tarballs can be extracted by
    using the command line, but to keep things easy in this chapter, you can just
    use the simple double-click method that you used in Chapter 6, if you prefer.


    # The Basics


    As I mentioned before, the process of compiling an application from source and
    then installing it is actually simple. Basically, after untaring the tarball,
    you would use the following commands to accomplish the task:


    ```

    ./configure To configure a makefile, which provides instructions for the make
    command

    ```


    ```

    make translate the source code into object code that the computer can understand

    ```


    ```

    sudo make install To give yourself write privileges in protected folders and then
    install the application

    ```


    ```

    make clean To clean the leftovers once the process is complete (clean up the mess)

    ```


    I know that sounds like a lot of commands, but as I always say, it is easier to
    actually do that than it looks like on the page, so fear not.


    # Installing the Tools You Need


    Because Ubuntu is designed with the average computer user in mind, it does not
    come with the various applications and libraries you need to compile applications
    from source. Fortunately, however, just about everything you need to get the job
    done is available via Synaptic. To get ready for the work at hand in this chapter
    (and many other jobs you are likely to be on your own in the future) perform searches
    for and install the following packages:


    +   - build-essential

    - checkinstall

    - libgtk1.2-dev'
