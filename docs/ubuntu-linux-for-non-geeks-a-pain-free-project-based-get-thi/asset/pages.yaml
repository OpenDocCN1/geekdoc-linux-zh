  md: '# 9A-3: Installing Software with Automix: Skype


    Now that you know Automix does, let''s give it a spin by installing a package
    that is not in the usual Ubuntu repositories but is in the new repositories added
    by Automix: Skype. Skype, shown in Figure 9-3, Voice over IP (VoIP) software allows
    you to speak to other users over the Internet with the clarity of a regular telephone
    line. And it doesn''t cost anything—even if you call overseas. There are also
    for free services, such as SkypeOut, which allows you to call regular mobile and
    landline telephone numbers from your computer at a fraction


    While it is true that Ubuntu comes with a VoIP package of its own, it is not compatible
    with the much better known and wide-spread Skype. The majority of people you know
    who are using a VoIP software package are using Skype, it only makes sense to
    go the Skype route that you can easily communicate with them. It''s nice software
    anyway.


    ![](img/ba6b82a7869bba748202d57c97336dca_175_0.png)


    Figure 9-3: Internet telephony made easy with Skype


    # Installing and Running Skype


    To install Skype via Automix, click Chat Clients in the left pane of the Automix
    window, click the box next to the Skype, then click the Start button. The Automix
    window will suddenly metamorphose into a half-Terminal window with a bunch of
    text streaming down black background in the bottom half of the window. That stream
    of text will then stop at a configuration screen.


    Once you''re in that screen, press the TAB key to highlight the OK button (in
    red), as shown in in Figure 9-4, and press ENTER. In the next screen, select Yes
    by pressing the TAB key once and then pressing ENTER. After another second or
    two of rolling white text, you will be back to the regular Automix window, and
    Skype will have been installed. You can go ahead and quit Automix.


    Once all the pieces have been installed, you can run Skype by going to Applications
    menu and selecting Internet Skype. After setting up a Skype user account, I would
    advise you to restart your computer. Skype seems to have better sound quality
    after an initial restart. Also remember, while we''re on the topic of sound quality,
    it is best to use Skype with a headset. Trying to talk with a stick microphone
    could cause feedback or echoes because the microphone will pick up and transmit
    sounds from the speakers.'
