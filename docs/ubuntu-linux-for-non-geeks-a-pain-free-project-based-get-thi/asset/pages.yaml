  md: '# # df


    Another safe and easy, but much more useful, command is df (file system). The
    df command tells you how much disk space you have used, as well as how much space
    you still have available, on each of the partitions on your mounted disks. Try
    it out by typing df and then pressing ENTER. Your output should look something
    like that in Figure 8-5 (depending, of course, on the size of your mounted disks
    and how they are set).


    ![](img/ba6b82a7869bba748202d57c97336dca_150_0.png)


    Figure 8-5: Output from the df command


    As you will notice, the sizes are given in kilobytes (KB) rather than the gigabytes
    (GB) and megabytes (MB) you are probably more used to, but there is a way around
    this. Many commands accept a flag, or option, to further tune how the command
    performs. These flags are written directly after the main command and are preceded
    by a space and a hyphen.


    In this case, you can try using the -h (human readable) flag to have your figures
    come out in the way you are most familiar with. Try this out by typing df -h on
    the command line and pressing ENTER. The output should appear in a more familiar
    format (see Figure 8-6).


    ![](img/ba6b82a7869bba748202d57c97336dca_150_1.png)


    Figure 8-6: Output from the df command with the -h flag


    # # ls


    Another harmless but handy command is ls (list directory contents). The ls command
    shows what you is in your current directory. This is the non-graphical equivalent
    of double-clicking a folder in Nautilus to see what is inside. Try it out by typing
    ls and then pressing the ENTER key.'
  merge: -1
  pgno: 150
- img_proc: true
  md: 'If you''ve been following my commands so far, your results should list all

    of the folders in your home directory. You can also use the -R flag to show

    only the list of files in the folder, but what is within the subfolders. Of

    course, you should have no subfolders in any of the folders you created in

    Chapter 6, so you can hold off experimenting with this for a while. Instead,

    try typing ls -a to see your invisible, or hidden, files.


    # $ sudo


    When you run Synaptic back in Chapter 5, you were first asked to input your

    password before you could run the program. The reason for this, as I mentioned-

    t, is that Synaptic installs the files in various folders

    out your system, almost all of which are protected. By supplying

    your password, you are telling the system that you, holder of the pass-

    word, have the right to allow Synaptic to do that.


    The command version of that password-processing is the sudo

    command. To perform an operation in a folder that is write protected, you

    first type sudo and then the command you want to perform.

    example, if you wanted to copy an icon image, let it call myicon.png, to

    t globally located and write-protected pixmaps folder /usr/share/

    pixmaps), you would type sudo cp myicon.png /usr/share/pixmaps.


    After typing a command sudo command and pressing

