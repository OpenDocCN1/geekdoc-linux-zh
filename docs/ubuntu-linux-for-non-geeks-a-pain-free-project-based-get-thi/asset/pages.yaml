  md: '![](img/ba6b82a7869bba748202d57c97336dca_51_0.png)


    Figure 3-1: The Ubuntu login screen


    # # Welcome to the GNOME Desktop


    Ubuntu’s implementation of the GNOME desktop is shown in Figure 3-2, and as you
    can see, it isn''t all that different from what you might be used to in a Windows
    or Mac OS 9 environment, other than the fact that it has tasks-bars, or *panels*,
    at both the top and the bottom of the screen. There are also no desktop icons,
    except when running a live session from the Ubuntu CD, in which case you will
    see a launcher to run the installation wizard (labeled Install) and a folder (labeled
    Examples), which contains a number of sample files. Among these is a video clip
    of Nelson Mandela discussing the meaning of ubuntu (the concept, not the distro).
    In all, it is a very uncluttered place to be, and despite its superficial similarities
    to other OS desktop environments, things in the GNOME are different enough to
    be interesting.


    The elements of the GNOME desktop are the panels at the top and bottom of the
    screen and the icons that appear upon those panels. The desktop itself, although
    empty at startup, does see its share of action, but I''ll come to that later.
    For now, I''ll focus on the two panels.


    # ## The Top Panel


    The two GNOME Panels on your desktop, the top panel is basically where all the
    action is. As you can see, there are three menus and two icons at the left end
    of the panel, and a few icons and a clock/calendar at the other end (Figure 3-3).
    So that you understand what each panel items does, I will briefly describe each
    of them, moving from left to right, as seems to be the fashion these days.'
  merge: -1
  pgno: 51
- img_proc: true
  md: '![](img/ba6b82a7869bba748202d57c97336dca_52_0.png)


    Figure 3-2: The GNOME desktop in Ubuntu


    # # The Menus


    At the far left of the top panel, you will find a set of three menus. These provide
    access to most of what your system has to offer in terms of applications, locations,
    and utilities. These include:


    +   **Applications menu** The access point to the majority of your applications,
    a software manager, and some system tools.


    +   **Places menu** Your system navigator, from which you can hide all windows
    so as to expose the desktop, access your home folder, browse your computer''s
    filesystem and connected networks, and search for files on your hard disk.


    +   **System menu** The access point for your system preferences, software installer,
    and administration tools. This is also the place to go when you want to shut down
    or log out of your system.


    ![](img/ba6b82a7869bba748202d57c97336dca_52_1.png)


    Figure 3-3: The left and right sides of the top GNOME Panel'
  merge: -1
