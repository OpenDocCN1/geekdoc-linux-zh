    the desktop icon for the disc you want to copy, then select **Copy Disc** in the
    popup menu. The Write to Disc window will then appear. Click the **Write** button
    in that window, and the Nautilus CD/DVD Creator will begin copying the contents
    of the disk as a disc image to your hard disk. This may'
