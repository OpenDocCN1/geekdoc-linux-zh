  md: '# 9C-3: Installing Xmahjongg


    Normally at this point of the process, you would type sudo make install and press
    ENTER, after which the files were compiled in the make step would be installed
    in various locations throughout your system. You would then follow this up with
    the make clean command to tidy things up in the Xmahjongg folder by getting rid
    of any unnecessary files.


    This traditional approach works fine enough, but things can get a bit messy if
    you find yourself wanting to upgrade or remove the application later on, as you
    have to keep track of where everything is and remove each item piece by piece
    using a series of sudo rm commands. Sometimes an application package will provide
    a make uninstall routine, but routines don''t always work perfectly, aren''t available
    for every package, and require you to keep the project folder on your hard disk
    in order to perform the procedure.


    If you are a traditionalist, you go ahead and install Xmahjongg in this traditional
    manner. In the same terminal that you performed the ./configure and make steps,
    just type sudo make install, and then press ENTER. You will be prompted for your
    password, so type it, and then press ENTER again. Xmahjongg will be installed
    and ready for use.


    # The Alternative Installation Method


    The traditional installation step is fine enough, but because of the limitations
    I mentioned in terms of removing the application, I recommend finishing things
    off in a slightly different way. What you are going to do, assuming you are willing
    to go by this route, is to skip the make step and instead convert the compiled,
    but uninstalled, application into a DEB package, and then install it. By doing
    this, you can remove the package easily using Synaptic whenever the desire strikes.
    Having a DEB package for your application, you do not need to keep the project
    folder, and save on hard disk space.


    +   Make sure that Add/Remove Programs, or any other APT installation tool is
    closed. As I mentioned before, you cannot have two APT tools running at the same
    time, and after all, checkinstall will be installing a DEB package.

    Assuming you are using the still-open Terminal window in which you entered the
    make command, type sudo checkinstall, and then press ENTER.

    A message will soon appear in the Terminal telling you if the ./doc-pak directory
    does not exist, and asking you if the program should create it. You want it to,
    so type Y, and press ENTER.

    The checkinstall program will then begin performing a mock install, after which
    it will create the DEB package. Before completing the process it will ask you
    for a description of the package. Type something like an easy-to-see Mahjongg
    game, press ENTER, and then press ENTER again.'
