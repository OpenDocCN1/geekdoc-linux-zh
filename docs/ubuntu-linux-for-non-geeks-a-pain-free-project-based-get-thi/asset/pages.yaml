- img_proc: true
  md: 'Of course, it may well occur that you take a look at the contents of the INSTALL
    file and start wondering what alien tongue it is written in. In such cases when
    you have no idea what the INSTALL file is going on about, sometimes happens, just
    look for a configure file in the package folder. If you find one, then just doing
    things the way you will learn in this project.


    # 9C-2: Running configure and make for Xmahjogg


    Now that you have downloaded and untared the Xmahjogg tarball, installation is
    pretty standard, though we will be finishing up in a slightly different way. Here''s
    what you need to do:


    +   1. Open a Terminal window, and then move into the new folder by typing cd
    xmahjogg and pressing ENTER.


    The next step is sort of a setup phase that runs the configure script in the xmahjogg-3.7
    folder. The configure script checks what files, compilers and other things it
    needs, and then searches your computer to see if those are there, and if so, where.
    Based on this information, it writes a file called Makefile, which is a set of
    instructions that will tell the make command in the subsequent step how to set
    things specifically for your system configuration.


    +   2. Configure the program by typing .configure and pressing ENTER.

    While you are running configure, you will see lots of mysterious things flowing
    through your Terminal window; this is essentially a running account of what is
    going on, each step of the way. Depending on the program you are dealing with,
    this could take a bit of time—a few seconds or a few minutes. Either, you needn''t
    worry. As long as the mysterious text keeps flowing and you don''t get an error
    message at the very end of the whole process, all will be fine.


    When configure has done its thing, you will see your prompt again, and you can
    go to the next step, which is the translation, or compilation, step. the make
    command reads the Makefile, created by configure, to see how things needs to be
    set up on your machine. Then it proceeds to call the compiler to translate the
    high-level source code into low-level, machine-readable files that can be installed
    in the subsequent step.


    +   3. To perform this translation, type make, and press ENTER.

    Again, you will be treated to more mysterious text flowing through the window
    and a short wait, usually a tad longer than the configure process. Once make has
    done its job and you will see your prompt again, and you are ready to install
    the program.


    Up to this, you have not changed your system in any way. All the changes thus
    far have taken place in the xmahjogg-3.7 folder only. Your system is still as
    pure as the day you started. Of course, all that is going to end right now when
    you perform the final installation step.'
