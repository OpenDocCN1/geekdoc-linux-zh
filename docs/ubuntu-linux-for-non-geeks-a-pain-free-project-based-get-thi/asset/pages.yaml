    # # Project 7A: Creating a New User Account


    If you are reluctant to alter the look of your present setup, you can create a
    new user account and experiment with making the changes in this chapter when logged
    in to the new account. If you opt to go this route, your home environment will
    remain untouched because look-and-feel customizations that are performed in one
    user account do not affect other user accounts. When you are done with the project,
    you can simply delete the new user account. Either way, it''s up to you.


    Set up a new user account, follow these steps:


    +   1. Go to the **System** menu, and select **Administration ▸ Users and Groups.

    2. When prompted for your password, type it, and then click **OK**. The Users
    window will open.

