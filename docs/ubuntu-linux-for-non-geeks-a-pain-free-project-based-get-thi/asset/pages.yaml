    # Project 8C: Command Practice Review with Briscola


    If you would like to reinforce the skills you''ve put to use in the previous project,
    why not out Briscola—a simple, yet very traditional, Italian card game (see Figure
    8-12). Unlike pyWings, which is a Python script, Briscola is a script of a different
    flavor, written in a language called Tcl, which uses something called Tk to create
    its graphical interface.


