    # Running and Setting Up Rhythmbox


    To run Rhythmbox, just go to the Applications menu and select **Sound & Video
    ▶ Rhythmbox Music Player**. When you first run Rhythmbox, you are greeted with
    a three-step setup wizard. To get through the first introduction, click **Forward**.
    In the second screen, you should tell Rhythmbox where it is (or plan to keep)
    your music files. The Music folder you created in "Setting the Default for Ripped
    Files in Sound Juice" on page 248. Just click the **Browse** button to locate
    the folder graphically, and then click **Forward** in the wizard window. In the
    third and final screen, click **Apply**, and Rhythmbox will scan your Music folder
    and add any songs it finds to its Library.


    # Adding Songs and Albums to the Rhythmbox Library


    If you are familiar with Apple''s iTunes, then you would understand the Library
    in Rhythmbox too, as it is essentially the same concept, though it does not physically
    move your files as iTunes does.


    To add new albums to your Rhythmbox Library, go to the **Music menu**, select
    **Import Folder**, and then navigate to the folder for the new album you want.
    If you want to add a number of albums by the same artist, just navigate and select
    the folder for that artist instead. If you just want to add a single audio file,
    you can also do that—just select **Music ▶ Import File**, and then navigate to
    the song in question.


    If you are not the technical type, you can also add files and folders by other
    methods. The simplest way is to drag the folder or song to add to the Library
    into the right pane of the Rhythmbox window. You can also add a song to the Library
    directly by right-clicking the file and selecting **Open ▶ Open with Rhythmbox
    Music Player** in the popup menu that appears.


    Chapter 15'
  merge: -1
  pgno: 269
- img_proc: true
  md: 'Rhythmbox, in conjunction with Sound Juicer, allows you to add songs to the
    Library directly from a CD, albeit in a somewhat indirect way. To do this, select
    Music ▸ Import Audio CD, and Sound Juicer will appear and display the contents
    of the CD you currently have in your drive. After, you can rip and encode the
    songs as you normally in Sound Juicer. Once you''re done, the songs will automatically
    appear in the Rhythmbox Library.


    # Browsing the Rhythmbox Library


    The Rhythmbox Library is a collection of all of the music you add to it, which
    can prove to be a bit unwieldy as your collection grows. Fortunately Rhythmbox
    has a nicer browse function, like the one in iTunes, that allows you to see lists
    of artists and albums in the Library. If you click a specific artist in the pane,
    a list of albums by artist will appear in the right pane. You can then double-click
    one of the albums in that right pane to play. If you want to play all of the albums
    by that artist, just doubleclick the artist''s name in the left pane. In all,
    a very handy feature.

    If you would like to add an additional layer of categorization to browse. To do
    this, just go to the Edit menu, select Preferences, the General tab of the window
    that appears, and then select Genres, artists, and albums. After clicking the
    Close button in the Preferences, you will have a three-pane browser in Rhythmbox
    (Figure 1-4).


    ![](img/ba6b82a7869bba748202d57c97336dca_270_0.png)


    Figure 1-4: The Rhythmbox browser


    # Creating Playlists in Rhythmbox


    Of course, you can tailor things even further so to match every situation and
    every mood. There are days, after all, when you''re feeling a bit too energetic
    for Kelly Clarkson (and thank goodness for that). To prepare'
  merge: -1
  pgno: 270
- img_proc: true
  md: 'for such moments, you can create playlists, which are lists of songs to be
    played in a predetermined order. Just think of each playlist as an all-request
    radio station . . . where all the requests are yours.


    To create a playlist in Rhythmbox, go to the Music menu and select Playlist ▶
    New Playlist. When the Playlist icon appears in the left pane of the Rhythmbox
    window, type a name for the list, and then add the songs by simply dragging them
    from the Library pane to the Playlist icon. The songs themselves will remain in
    the Library, so you aren''t really moving anything—just creating aliases.


    You can also create automatic playlists, which are lists that automatically scan
    the Library for songs that match your creation criteria. You could choose to create
    a list for all the songs in your Library by a particular artist or of a specific
    genre. To do this, select Music ▶ Playlist ▶ Automatic Playlist. A window will
    appear where you can specify what the list is to contain.


    Once you''ve created your lists, you can play one by clicking the list once and
    then clicking the Play button near the top of the window, or by just double-clicking
    the list.


    # Streaming Media with Rhythmbox


    In addition to play the music you have on your hard disk, Rhythmbox also allows
    you to play Internet radio streams in MP3 or Ogg Vorbis format. To add a stream,
    click the Radio icon in the left pane of the Rhythmbox window, and you will come
    to face with . . . well not the first time around. Still, you can try out what
    there is to try. Make sure you''re online and double-click one of the stations
    listed, and your computer should start playing music downloaded from Internet
    station.


    Once you''ve had a taste of what Rhythmbox does with radio, you will not be hungry
    for more. To add a bit more to your listening diet, you can add new streams by
    clicking the New Internet Radio Station button. When the New Internet Radio Station
    window appears, type the URL for the stream, and then click Add. The stream will
    appear in URL form if you prefer the stream to appear in the list as a name rather
    than a URL, just right-click the entry for the stream, select Properties in the
    pop-up menu, and then make the appropriate changes in the Properties window.


    Ah, but where do I find these radio stations, you ask? For the largest collection
    of MP3 streams, go to shoutcast.com, find a stream that interests, right-click
    the Tune In button for that stream, and then select Copy Link Location in the
    popup menu. After that, paste the URL in the URL box of Rhythmbox''s New Internet
    Radio window, and click Add. You then double-click in the right pane of the Rhythmbox
    window to play it.


    Of course, many broadcasters also offer live Internet feeds that do not appear
    on SHOUTcast lists. An example of this would be Radio France, which offers a number
    of streams. The stream you try out is of Fip, which is an incredibly cool collection
    of music of all genres; you will'
  merge: -1
  pgno: 271
- img_proc: true
  md: 'be constantly surprised by what they play. If you are worried about understanding
    the language, don''t be; there is very little talk, and roughly 80 percent of
    the music is played in English. I don''t speak any French other than je suis fatigé,
    but I have no problems at all.


    If you want to go streaming media in general (and Radio France in particular)
    type http://http.yacast.net/v4/radiofrance/fip.fd in the URL box of Rhythmbox''s
    New Internet Radio window, and click Add. Assuming you are already connected to
    the Internet, double-click the new addition to your list, and Flip should start
    playing after a few seconds of pre-buffering.


    # Other Features in Rhythmbox


    Rhythmbox includes a couple of cool features worth noting. One is pretty obvious
    once you start playing your tracks: album cover art. As you can see in both Figures
    15-3 and 15-4, whenever you play a track in Rhythmbox, the album cover art for
    that track is automatically downloaded and displayed in the lower-left corner
    of the window (assuming Rhythmbox can find it).


    Another and somewhat similar feature has to do with Lyrics. To utilize this feature
    you must first activate it by going to the Edit menu and selecting Plugins. In
    the Configure Plugins window that appears (Figure 15-5), check the box next to
    Song Lyrics and then click the Close button. After that, go to the View menu and
    select Song Lyrics. Rhythmbox will then search the Net for the lyrics you are
    currently playing and displaying them in a separate window (Figure 16).


    ![](img/ba6b82a7869bba748202d57c97336dca_272_0.png)


    Figure 15-5: Activating Rhythmbox''s lyrics function


    Finally, if you are an iTunes user and attached to a bit of visual stimulation
    while playing your tunes, Rhythmbox can now satisfy you with a visualizer of its
    own. To activate it, go to the Control menu and select Visualization (you can
    turn it off in the exact same way). The right half of the Rhythmbox window will
    then be filled with the wild, swirling shapes and colors of psychedelic that you''ve
    come to know and love.


    Tux Rocks 253'
  merge: -1
  pgno: 272
- img_proc: true
  md: '![](img/ba6b82a7869bba748202d57c97336dca_273_0.png)


    **Figure 15-6:** Rhythmbox displays the lyrics to the track currently playing.


    # # Exile—An amarok-like Audio Player for GNOME


    Now that Rhythmbox has, for the most part, matured into a usable and multi-featured
    application, you may want not to bother with any other players. There are other
    interesting players out matter.


    One of the new is Exile (Figure 15-7). *Exile* is essentially a clone of the Linux
    application amarok, which I covered in the previous edition of this book. While
    amarok was (and is) a great player, it is a KDE application, so when it’s running
    in Ubuntu’s GNOME environment, it can be a bit quirky at times. It also fails
    to adopt the look-and-feel customizations that you may have to your Ubuntu environment.


    ![](img/ba6b82a7869bba748202d57c97336dca_273_1.png)


    **Figure 15-7:** Exile


    Chapter 15'
  merge: -1
  pgno: 273
- img_proc: true
  md: 'Exile, on the other hand, is a GNOME app through and through. It looks like
    the rest of your system, reflects any customizations you may have made to the
    rest of your system, and runs as smoothly as quickly as any GNOME native application.


    # Installing and Running Exile


    The easiest way to install a good working copy of Exile is via Automatix. Just
    go to the Applications menu, and select System Tools ▸ Automatix to get started.
    Once the main Automix window appears, click Media Players and Editors in the left
    pane. Then in the right pane, check the Box next to Exile and click the Start
    button you will be on your.


    Once everything has been downloaded and installed, you can quit and run Exile
    from the Applications menu by selecting Sound & Video Exile!


    # Streaming Media with Exile


    Like Rhythmbox, Exile can also act as an Internet radio tuner. In fact, in many
    ways it does a better, or at least more convenient, because of it automatically
    generates a list of the feeds available from SHOUTcast, making it a bit more iTunes-like.
    To see station lists, just click the Radio tab at the left side of the Exile window,
    and navigate to the genre and sub-genre of your liking.


    If you would like to play a stream not listed in the SHOUTcast offerings, you
    can do so by going to the File menu, selecting Open URL, or pasting the URL for
    the stream in the address window that appears, and then clicking the OK button
    in that window. A new stream will appear in the right half of the Exile window,
    showing your stream. To save the stream for future play, right-click the stream
    and select Add to Saved Stations New Station. In the small Enter the name of the
    station that appears, enter the name of the station, and then click OK (Figure
    15-8). After that, you can find your newly saved station folder in the Radio tab
    on the left pane.


    # Other Features in Exile


    Exile has a lot of cool features worth noting. You can''t miss but notice is that
    it provides an onscreen display of the track or stream that is playing, showing
    not only the title and artist of the track, but the album cover art as well (Figure
    15-9). This is especially handy when using Exile in hidden mode, which you can
    accomplish using the Exile panel as a toggle.


    ![](img/ba6b82a7869bba748202d57c97336dca_274_0.png)


    ![](img/ba6b82a7869bba748202d57c97336dca_274_1.png)'
  merge: -1
