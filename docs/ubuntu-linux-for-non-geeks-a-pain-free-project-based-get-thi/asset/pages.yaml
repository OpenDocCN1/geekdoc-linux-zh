- img_proc: true
  md: 'To copy a song from your library to your iPod, just click Library in the left
    pane, and then drag the artists, albums, or single tracks you want from the right
    pane to your iPod''s icon in the left pane. The copy progress will be shown in
    an orange bar in the lower-right corner of the Rhythmbox window.


    # Copying Files from your iPod to Your Hard Disk


    One feature that isn''t available in iTunes (at least not without the installation
    of a special free plugin) is the ability to copy songs from your iPod to your
    hard disk (or even to an external USB drive). Luckily, Rhythmbox, and in fact
    just about all Linux audio players with iPod support, allow you to do this quite
    easily.


    To copy music from your iPod with Rhythmbox, select the tracks you want to export
    (hold down the CTRL key to make multiple selections or use the tabs to select
    whole artists or genres if you like), and then drag the items to your desktop,
    music folder, wherever you want.


    > NOTE This approach works well enough, but it doesn''t work perfectly for AAC
    files (which end with .m4a extension). While these files can be copied using the
    process described, the copied files will not have their original filenames. The
    File Over AAC.m4a on my iPod became ZPAD.m4a on my desktop. The files themselves
    are fine, though; if you add them to your Rhythmbox Library, they will appear
    with the original name and artist information. If you would like the files that
    you see in a Nautilus window to have a recognizable filename, however, just rename
    them as you would for any file (right-click the file and select Rename—in case
    you forget).


    # Ejecting Your iPod


    When you''re working with your iPod in Rhythmbox, you can eject it by either clicking
    its entry in the left pane of the Rhythmbox window and clicking the Eject button
    at the top of the window, or by right-clicking it in the left pane and selecting
    Eject in the pop-up menu that appears.


    # Managing Your iPod''s Audio Files in gtkpod


    While the latest version of Rhythmbox should be able to meet your typical iPod
    needs, there are other apps that can do the job. For example, the audio players
    Songbird and Amarok (mentioned briefly in Chapter 15), have iPod support capabilities.
    There are also a few other applications that are iPod-dedicated, one which is
    gtkpod. Shown in Figure 16-4, gtkpod is a pretty straightforward application with
    a large user base, which means you should be able to get a lot of questions answered
    in Ubuntu and other Linux online forums you have any. It also handles many of
    the functions that one uses when dealing with an iPod, including album cover art
    (but not photos). However, gtkpod is not an audio player; instead, it is XMMS
    that you can change the settings if you have another player in mind.'
