  md: '# Concept and Approach


    As a language teacher, I have always enjoyed programming books, mathematics, and
    old-fashioned foreign language—learning texts because of their straightforward,
    skill-based orientation, in which each chapter builds upon the skills acquired
    in the previous chapter. I have tried to organize this book in manner that you
    will never be called upon to do something that you have not already learned. I
    also like such books because they not teach you how to do something, but also
    provide you with the chance to put those morsels of knowledge into practice with
    exercises. I have included several exercises, or projects, in this book so that
    you will have opportunities to apply your knowledge. This book will serve as a
    reference and also provide a dynamic learning experience you can learn by doing,
    as they say.


    By working throughout this book you will have a secondary purpose as well: properly
    configure and round out your Ubuntu system so that it can do anything you want
    it to. By the time you finish with this book, your system will have all the bases
    covered. If it is still not enough to satisfy you, you will be happy to know that
    you will have access to even more—an unbelievably greater amount more—via the
    online repositories, which you will learn to use in Chapter 5. If your interest
    is already piqued, take a look at these chapter descriptions:


    # Chapter 1: Becoming a Penguinist—Welcome to the World of Linux


    What’s Linux? What’s Ubuntu? What’s a distribution? Can I... Will I me...? Chapter
    1 holds the answers to these and many other questions you might have as it introduces
    you to the world of Linux and what it takes to get it up and running on your machine.


    # Chapter 2: Wading and Diving—Running and (If You Like) Installing Ubuntu


    The Ubuntu Desktop CD comes with this book works as both live and an install CD.
    Chapter 2 tells you how to run a live Ubuntu session off the CD, assuming you
    catch the Linux bug after doing that, and how to install the full Ubuntu system
    on your hard disk as your sole operating system or in a dual-boot setup with Windows.


    # Chapter 3: A New Place to Call Home—Getting to Know the Windows or Mac


    Regardless of whether you are an emigré from Windows or Mac worlds, the desktop
    is something you are already familiar with. Chapter 3 will point out the differences
    between Ubuntu GNOME desktop and the one on your previous operating system, and
    it will teach you a number of cool tricks you can use to customize the look and
    feel of things. A couple of nifty GNOME Easter eggs are also introduced.


    # Chapter 4: More Than Webbed Feet—The Internet, Linux Style


    “Have computer, will cyber-travel” could well be the mantra of the Internet age,
    and that being the case, Chapter 4 is an indispensable part of your Ubuntu experience.
    In this chapter you will learn how to'
  merge: -1
  pgno: 23
- img_proc: true
  md: "connect to the Internet and set up wireless connections, and you will meet\
    \ the various software entities that allow you to interact with the Web.\n\n#\
    \ Chapter 5: Rounding Out the Bird—Downloading, Installing, and Updating Programs\
    \ the Easy Way\n\nUbuntu comes bundled with most of the software you need, but\
    \ there is much more available out there, free and waiting on the Web. Chapter\
    \ 5 teaches you how to easily download and install applications using Advanced\
    \ Package Tool (APT) and Synaptic. System and application updating is also covered.\n\
    \n# Chapter 6: A Tidy Nest—File and Disk Handling in Ubuntu\n\nFrom creating folders\
