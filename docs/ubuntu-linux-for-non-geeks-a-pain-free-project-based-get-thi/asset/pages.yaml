  md: '# Chapter 12: Polyglot Penguins—Speaks Your Language


    Need to jot off a note in Urdu? Write a book in Korean? Send a letter in your
    friend in Chengdu? All of the basics you need to know to read and write in just
    any language in the world are provided in Chapter 12.


    # Chapter 13: Penguins at Work—Getting Down to Business in Linux


    Work can be a drag, especially when there are so many things you could be doing.
    Still, wearing the ''ol'' fingers to the bone is a part of life for just about
    everyone outside of a Jane Austen novel, so you''ll be glad to know that Linux
    is a very capable system in this regard. Chapter 13 introduces you to the various
    productivity applications bundled with or for your system.


    # Chapter 14: Brush-Wielding Penguins—Linux Does Art


    Those of you with an artistic best will find Chapter 14 especially useful. Working
    with your digital camera, modifying images, and building web albums are just some
    of the topic areas covered.


    # Chapter 15: Tux Rocks—Music à la Linux


    Chapter 15 is the music lover''s treasure trove. You will learn how to rip CDs,
    encode MP3 or Ogg audio files, and even find how to create your own mix-and-match
    audio CDs from those files. A number of audio ripping and playback applications
    are covered.


    # Chapter 16: Pluggin'' In the Penguin—Ubuntu and Your iPod


    Need some more? Have you an iPod? Want to use it in Ubuntu? Chapter 16 tells you
    how.


    # Chapter 17: Couch Penguins—Video and DVD Playback in Ubuntu


    Sitting in your dorm room trying to figure out how to play your DVD copy of the
    Baxter for your Ubuntu-sized computer? Just finished filming a video of your sibling
    talking while asleep and to create some creative editing of the evidence? Chapter
    17 covers this and other video-related topics.


    # Chapter 18: Defending the Nest—Security


    Although Linux is as safe and secure a system as you are likely to come across,
    some folks feel a bit more secure . . . , feeling a bit more secure. Chapter 18
    tells you how to add a few lines of defense to your system.


    # Appendix A: Ubuntu Desktop CDs for AMD64 Users


    The CD bundled with this book is designed to work with i386 processors. It will
    also work with AMD64 processors, although not in 64-bit mode. Want to run Ubuntu
    with an AMD64 processor in 64-bit mode? It''s easy enough to do. Appendix A shows
    you how to download Ubuntu Desktop CDs and burn them to disk.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Appendix B: Resources


    Are you crazy for Ubuntu and want to say so? Check out a forum. Do you have a
    hardware compatibility question? Some websites seem to have all the answers. Are
    you looking for free downloads or do you want to read up on the other Linux distributions?
    Appendix B is a great place to start.


    # How to Use This Book


    It is possible, to use this book as a mere reference text that you only consult
    when you have a problem to solve, but that would negate the basic concept behind
    its design. Instead, I recommend that you go through the entire book by chapter,
    doing the projects along the way. This will give you a much broader understanding
    of how things are done (and of how you can get things done), and it will reduce
    the chance for anxiety, confusion, and worry yet, mistakes.


    It is best to read this book and complete your projects when you are relaxed and
    have time to spare. Nothing makes things go wrong than working in a rush. And
    keep in mind that Linux and the projects in this book are fun, not just work exercises.
    The whole point of the Linux world, in my opinion, is that it offers all kinds
    of fun. Go ahead and enjoy it.


    # About the Conventions Used in This Book


    There are only a minor points worth noting about the conventions I have used here.
    I have put in **bold** type the items within your system that you need to click
    or directly manipulate in any way, such as buttons, tabs, and menus. Where words
    or phrases are defined, they have been set in *italics*. Any text that I ask you
    to input will be indicated by `monospace` font. I have also opted to use the more
    graphically suggestive term *folder* instead of *directory*—no doubt the legacy
    of my many years as a Mac user.


    # About the Projects in This Book


    The projects and other information in this book are primarily geared toward users
    who have installed Ubuntu using the CD that comes with this book. Most of the
    information also applies to Ubuntu live sessions run from the CD. You should note,
    however, that some projects and actions cannot be performed in live sessions,
    as they require write access to your hard disk, and this is not possible during
    live sessions.'
