  md: '# $ chmod


    In Chapter 6, you learned how to change file permissions via the Nautilus interface.
    This is without doubt the easiest way to go about such things, but when you have
    a folder of files, perhaps copied to your hard disk from CD, that are write protected,
    it can be quite tiring to change the permissions of such files one by one. In
    this case, the command-line approach proves to be much easier to deal with.


    The command for changing file permissions is chmod (change mode). To use it, just
    type the command followed by the permissions you want to extend to a file, and
    the location of the file itself. For example, let''s say that you copied a JPEG
    file, birthday.jpg, from a CD to the Photos subfolder within your hard disk, and
    it is write protected. To change the file so you have write permissions (meaning
    that you can alter the file), you would type the following and press ENTER:


    ```

    chmod 744 ~/photos/personal/birthday.jpg

    ```


    To change the permissions of all the files and folders (and all the files within
    folders) in one swoop, you can add the -R (recursive) flag to the chmod. The command
    would thus be as:


    ```

    chmod -R 744 ~/photos/personal

    ```


    The 744, by the way, extends read, write, and execute (run) permissions to you,
    the owner, and gives read-only permissions to everyone—a pretty safe choice when
    doubt. If you want to figure out permission numbers for yourself, it is pretty
    easy. You are basically dealing with three number positions, each of which has
    numerical possibilities (0–7). The left slot represents permissions for the owner;
    the center slot represents for the group; and the third slot represents for others.
    The meanings of the numbers are as follows:


    +   7 Read, write, and execute permissions

    6 Read and write permissions

    5 Read-only permissions

    4 Read-only permissions

    3 Write and execute permissions

    2 Write-only permissions

    1 Execute-only permissions

    0 No permissions


    Figure 8-8 points out the meaning of each of these numbers and what each number
    slot represents. In fact, if you don''t mind a bit of simple addition, things
    are even easier to understand. Start out with, remember that 1 = execute, 2 =
    write, and 4 = read. Add any of those numbers together, and you get the other
    permissions combos. For example, 1 (execute) + 4 (read) = 5 (read and execute).
    As you see, permissions aren''t all that complicated.'
