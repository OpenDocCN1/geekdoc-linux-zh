    # # File Handling in Nautilus


    Since Nautilus is primarily a file manager, it only makes sense to get down to
    the business of using it at that level. Of course, most folks who use computers
    today are already familiar with drag-and-drop as few other means of creating folders
    and copying, cutting, and moving files. For those who are unfamiliar with one
    way or another of performing these essential procedures, I thought it best to
    spell it all out. If you find this all a bit redundant, please bear with me for
    the good of the masses.


    # ## Creating, Naming, and Renaming Folders


    Creating a folder is a simple enough task, and there are two ways of going about
    it. The easiest (in my opinion) is to right-click any empty space in a Nautilus
    window, and select **Create Folder** in the popup menu that appears. If you prefer
    using menus to right-clicking any empty space, you can start things rolling by
    going to the Nautilus **File** menu, and selecting **Create Folder.


    Regardless of where you made your Create Folder with the name *untitled* folder
    will appear in the Nautilus window. The name of folder will be highlighted and
    surrounded with a black box, which means that you can immediately give that folder
    a name by simply typing one—nothing to click or do other than that. Press ENTER
    or click any open space in the Nautilus window to complete the task.


    If you decide that the name you gave your folder seems weird or even a complete
    revision, you can rename it by right-clicking it and selecting **Rename** in the
    popup menu. Alternatively, you can click the folder to highlight it, and then
    select **Edit ▸ Rename**. After that, you can type the new name for the folder
    and then press ENTER or click any open space in the Nautilus window to seal the
    deal.


    82 Chapter 6'
