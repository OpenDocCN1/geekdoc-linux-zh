  md: '# Can I Do the Same Thing with pyWings?


    Sure. If you want to move pyWings to a global location, just follow the same procedure
    for moving the pywings folder and creating the link as you did for Briscola, making
    the necessary substitutions, of course. You will have to remove the previously
    created pyWings link, though, by typing the following command:


    ```

    sudo rm /usr/games/pywings

    ```


    After that, move the pywings folder to global territory by typing sudo mv "/LocalApps/pywings/share/games/pywings",
    and pressing ENTER. When prompted for your password, type it, and press ENTER.
    You can then create the launchable link by typing cd /usr/games, pressing ENTER,
    sudo ln -s /usr/share/games/pywings/pywings.py pywings, and pressing ENTER once.


    # Playing Briscola


    As I already mentioned, Briscola is easy—about as easy as a card trick-ticking
    game, which means you put out a card, then your opponent puts out a card, and
    the one you puts out the higher-value card wins the hand, or trick. Points are
    awarded on the basis of the cards involved in that trick. The winner of the trick
    then goes on to lead the next trick, meaning that the winner puts out his her
    card first the next time around. When all the cards are played, the points for
    each player are tallied, and the player with the higher points wins. All much
    simpler to describe.


    # The Cards and Their Rankings


    Like many Italian and Spanish games, Briscola is played with a 40-card deck, consisting
    of the following cards: K, Q, J, 7, 6, 5, 4, 3, 2, and the Ace. Traditionally,
    it is played with either French-suited cards (hearts, diamonds, clubs, and spades)
    or Italian-suited cards (words, coins, barons, and chalices), usually depending
    upon the region in which it is played. In the software version you have just installed,
    you will be playing with French-suited cards in the regional part of Tuscany.


    Unlike most card games you are probably familiar with, the ranking and point values
    of the cards in Briscola is somewhat different, as you can see in the following
    chart.


    | Ranking of Cards | Point Value |

    | Ace | 11 |

    | 3 | 10 |

    | King | 4 |

    | Queen | 3 |

    | Jack | 2 |

    | 7, 6, 5, 4, 2 | 0 |'
