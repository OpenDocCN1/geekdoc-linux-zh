    # # Shutting Down


    Now that you know your desktop environment is so well, you may feel like calling
    it a day and shutting down your machine. To do so, just go to the System menu
    and select Log Out. Your screen will darken, and then a small window (Figure 3-16)
    will appear with seven choices to choose from: Log Out, Lock Screen, Switch User,
    Suspend, Hibernate, Restart, Shut Down (Hibernate is not an option when running
    a live session from the Desktop CD). Click Shut Down, and the process will begin.
    If, nothing seems to happen within a few seconds of clicking OK, press CTRL-ALT-BACKSPACE
    in unison, which will bring you to the login screen you saw at the beginning of
    the chapter (Figure 3-1). Once, click Shut Down at the bottom of the screen. This
    will bring up a small window asking if you are sure you want to shut down. Just
    click OK, and shutdown will commence.'
