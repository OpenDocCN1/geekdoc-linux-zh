    Before moving, I should mention that you can also use the finger command to do
    a domestic espionage of sorts. Let''s say your friend, Chris, has a user account
    on your machine. Chris, who wants permission to go to the movies, claims to have
    been hard at work on the computer all day writing up a report for school. Having
    your doubts, you could type finger chris to see what the facts actually are. It
    may be a bit underhanded and rotten, but it works. It works both ways, so others
    can check up on you as well. You can give it a try right now by seeing the last
    time you logged into your graphika account. Just type finger grafica and press
    ENTER.


    You can even use the finger command to find out about people on other systems,
    providing your network''s finger service is active and you know their email address.
    Typing like finger username@hostame.com will do the trick. Kind of cool, but also
    kind of spooky.


    # $ pwd


    If you know where you are not exactly sure where you are, pwd (print working directory)
    should come in handy. The pwd command tells you exactly where the Terminal is
    in your directory tree.


    Let''s say, for example, that my Terminal is in my personal home directory (which
    is actually called home, and where is where all the user account directories are
    located) when I use the pwd command; after, pressing the ENTER key, get /home/rem

    printed to my Terminal. You should get similar results if you try it out.


    The word print, in this case, has nothing to do with your printer; it merely means

    t response will be printed to, or displayed in, the Terminal.


    NOTE


