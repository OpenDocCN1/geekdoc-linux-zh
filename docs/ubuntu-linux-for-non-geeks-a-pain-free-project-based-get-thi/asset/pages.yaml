  md: '# 18


    # DEFENDING THE NEST

    Security


    ![](img/ba6b82a7869bba748202d57c97336dca_310_0.png)


    Many a Windows user has entered the Linux fold after a host of bad experiences
    with **malware** in the Windows world—viruses, spyware, and all sorts of other
    malicious bits of software code, too numerous to imagine. Windows is also plagued
    by a seemingly endless array of vulnerabilities, leaving the system easy prey
    to invaders with less noble intentions. Every trip out into cyberspace becomes
    something like a run through the infectious diseases ward of hospital. For a Windows
    user, it can sometimes seem that more time is spent riding the system of viral
    pests and defending it from invaders than is actually getting things done.


    Fortunately, Linux does not suffer greatly from such problems, leading to the
    much-touched claim that Linux is practically free and quite secure. There are
    numerous lines of reasoning proffered to explain Linux malware-and exploit-resistant
    nature. One reason is simply popularity—or lack thereof. As Linux is not as widespread
    as a system as Windows, it is also a much less attractive target of digital evil-doers,
    who very often seem to be motivated by the challenge and headline-catching glory
    that comes with creating a truly global virus or finding a heretofore unknown
    back door.'
  merge: -1
  pgno: 310
- img_proc: true
  md: 'Another reason is that Linux users, as a general rule, work on their computers
    in a non-privilege mode, one in which the user does not have the right to install
    software without a password. This is not the case, at least not by default, in
    Windows. A virus or other form of malware attached to an email or piggybacked
    upon another file or application, therefore, install itself in your Linux system
    without... . well, theoretically, this point is a bit of an issue.


    There is also the matter of structural design. Every system out there have security
    holes that can be exploited by digital and human foe. Windows might well be called
    the Swiss cheese of operating systems in this regard. Of course, Linux has its
    holes too, though fewer of them than Windows does; and Linux plugs them up through
    downloadable updates faster, once they are found.


    Finally, there is the defense edge that Ubuntu''s pre-configured security policy
    brings—there are no open incoming ports in Ubuntu desktop systems. This means
    that your Ubuntu Linux system is even less susceptible to unwanted incursions.


    # Does My System Need Protection?


    So with all this about Linux''s great security, you may wonder whether you need
    to bother worrying about it all. Well, if you take a look at the Ubuntu forums,
    you might find yourself a bit confused. When asked Linux users need to install
    antivirus software or firewalls, most users answer with an emphatic *no*. On the
    other hand, you''ll find that there are an awful lot of people who have installed
    or are trying to install that software. Hmm.


    So what''s a Linux user to do?


    If you are on a network where you transfer a lot of files along a lot of Windows
    machines, you might want to think about installing some antivirus software, for
    nothing more than the good of the Windows Windows systems involved and the users
    of those systems—your unenened (i.e., Windows-using) email pals, for example.
    You might also want to give it a go if you are, by nature, on the cautious side
    of the spectrum. Basically, if it makes you feel safer to install some protection,
    go ahead. If it makes you feel safer to go whole hog and install the full line
    of defense mechanisms I cover in this chapter, either way you go, it''s not going
    to cost you anything, and it certainly isn''t going to hurt you any.


    # The First Line of Defense


    Regardless of the system you happen to be (though I am assuming that you have
    become a Linux devotee by now), the first line of defense for any computer permanently
    hooked up to the Internet is a router—an electronic'
  merge: -1
  pgno: 311
- img_proc: true
  md: 'device allows a number of computers on a local network (such as in your home
    or at your office) to connect and share a single connection from your Internet
    service provider (ISP). While the router is connected to your modem via cable,
    the connection from the router to the computers on your local network can be wired,
    wireless, or both.


    What has a router to do with the defense of your computer? Well, most routers
    include a firewall, which essentially functions to keep all of the bad stuff that
    out on the Web away from your computer, in the way that the firewall keeps the
    heat, fumes, and noise from your engine out of the passenger compartment. This
    built-in firewall is one reason even people with only one computer, who could
    easily connect their computer directly to their cable or DSL modem, use a router.
    Of course, which filters you select in the firewall setup software depends on
    which for example a common and useful filter (particularly with a wireless router)
    limits Internet access to those machines specified on the firewall''s access list.
    This prevents your next-door neighbors from hitching a wireless ride via your
    ISP connection. They aren''t paying the bill, after all.


    The setup for a router is built in the router itself, so you don''t have to worry
    about software installation and system compatibility. Using your router with Linux
    is no different than using it with Windows. You can access the setup and modify
    your settings via a simple web browser, as you can see in Figure 18-1. Just type
    the IP address of the router (usually provided in the owner''s manual) in the
    browser''s location bar, press ENTER, and you''ll be ready to go.


    ![](img/ba6b82a7869bba748202d57c97336dca_312_0.png)


    Figure 18-1: Setting up a router'
  merge: -1
  pgno: 312
- img_proc: true
  md: '# Software Firewalls


    If you don''t have a router and don''t plan on getting one, or if you have one,
    but you are bordering on paranoia, you might want to consider using a soft-firewall,
    in particular one of the most popular software firewalls for Linux, Firestarter.


    You can download and install Firestarter via Automix by clicking Utilities in
    the left pane, selecting Gnome Security Suite in the right pane, and then clicking
    the Start button. Once it is installed, run Firestarter by choosing System Administration
    ► Firestarter. You will be prompted for your password, so type that, and click
    the OK button.


    Firestarter will open with a pretty self-explanatory setup wizard the first time
    out. If the wizard doesn''t seem all-explanatory to you, and you''re not sure
    what to do, just accept the default settings by clicking the Forward button in
    each of the wizard screens until you get to the last one (shown in Figure 18-2).
    In that screen, make sure the box that Start firewall is checked, click the Save
    button, and then click Quit. When the wizard is finished, the main Firewall will
    appear and, assuming the correct network device was selected,


    ![](img/ba6b82a7869bba748202d57c97336dca_313_0.png)


    Figure 18-2: The last screen of the Firestarter setup wizard


    If the wrong network device was selected, a warning window will appear telling
    you so. In that case, you can do a bit of trial-and-error manipulation by clicking
    the Preferences button in the main Firestarter window and then clicking Network
    Settings in the Preferences window that appears (Fig-ure 18-3). In that window,
    select one of the other devices listed in the drop-down menu next to words Detected
    device(s), and then click the Accept button. Once back at the main Firestarter
    window, click the Start Firewall button, and see what happens. If you still can''t
    start the firewall, repeat the process I''ve just described, this time selecting
    a different network device.'
  merge: -1
  pgno: 313
- img_proc: true
  md: '# Preferences


    ![](img/ba6b82a7869bba748202d57c97336dca_314_0.png)


    Figure 18-3: Selecting network devices in Firestarter


    Once your firewall is up and running, there is nothing more that you really need
    to do. You can simply look at the Firestarter window (Figure 18-4) to see what
    is going on network-wise on your computer—what active connections you have, how
    much information has been coming and going, and if there have been any events
    in, for example, the firewall has blocked an intruder. If you click the Events
    tab, then you can see the details of others, such as which connection attempts
    were blocked, where they came from, and when they happened.


    ![](img/ba6b82a7869bba748202d57c97336dca_314_1.png)


    Figure 18-4: Firestarter in action


    Defending the Nest 295'
  merge: -1
  pgno: 314
- img_proc: true
  md: '# Taking Control of Firestarter


    You can control how Firestarter deals with various network events by creating
    your own policies. The default policy set in Firestarter allows you to basically
    do whatever you normally do via the Internet, while it blocks new connections
    to your computer from the Internet or any other computer on your network.

    To make it bit more draconian, you can click the Policy tab, Outbound traffic
    policy in the drop-down menu next to the Editing, and then select Restrictive
    by default, traffic. If you want to deny anyone working on your computer access
    to a specific website, simply click the Deny connections to host field to select
    it, and then click the Add Rule button. In the Add New Outbound Rule window, enter
    the URL for the targeted site, click Add, and then click the Apply Policy button
    in the main Firestarter window.


    # Confirming That Firestarter Runs Automatically


    After you run Firestarter the first time, it will set itself to automatically
    start whenever you start up your system. Don''t be concerned when you don''t see
    the graphical interface when you started it; Firestarter will be running in the
    background, silently protecting your computer.

    If you are the doubting type, you can check to see whether or not Firestarter
    is actually running in the background by opening a Terminal window, typing /etc/init.d/firestarter
    status, and then pressing ENTER. If Firestarter is running, you will see the message
    * Firestarter is running. . . in the Terminal window. Worries over. If Firestarter
    isn''t running, the response will respond * Firestarter is stopped.


    # Finding Out More


    If the world of firewalls is new to you, you can check out the Firestarter manual
    page to learn a bit more. To check the Firestarter Help menu, and select Online
    Users'' Manual, which will bring the page in your web browser. If you prefer to
    check out the manual before installing Firestarter, point your browser to www.fs-security.com/docs.
    You will also find a pretty good tutorial there.


    # ClAMAV: Antivirus Software, Linux Style


    Despite the lack of viruses out there that can wreak havoc upon your Linux system,
    your computer could still act as a transmitter of viruses. As a result, there
    are a number of free antivirus scanners out for Linux users interested in helping
    to protect Users from viruses. These include Aegis (available via Synaptic), Panda
    Antivirus (www.pandasoware.com/download/linux.htm), f-Prot (www.f-prot.com), and
    numerous others. For most Linux users, however, the virus scanner of choice is
    the open source contender—ClAMAV.


    Chapter 18'
  merge: -1
  pgno: 315
- img_proc: true
  md: 'Although it can be used on a number of operating systems, ClamAV is considered
    to be the Linux antivirus software package. It is open source, totally free, and
    you don''t have to worry about licenses or the bother of renewing them. Unfortunately,
    in your own, ClamAV is a command-driven application, which makes it a bit less
    user-friendly. Fortunately for all, there is also a graphical interface available,
    albeit a simple one, by ClamTk. Both ClamAV and ClamTk are available via Automix.
    In fact, they come bundled together with Firestarter in the Gnome Security Suite,
    so if you want give them a try, just follow the directions for installing Firestarter
    in the previous section.


    # Using the ClamAV/ClamTk Duo


    Once ClamAV is installed, you can perform a virus scan by going to Applications
    > Accessories > Virus Scanner. This will bring up the Cl Tk Virus Scanner window
    (Figure 18-5). If it appears, you should set up ClamAV so that it will automatically
    scan any viruses. To do this, go to the Actions menu, and select Quarantine Infected
    Files. Then go to the File menu, select Scan Directory, and in the left pane icon
    for the folder or disk you want to scan. Once you''ve done that, click the OK
    button, and ClamAV will start scanning your system. ClamTk will let you know what
    (or, rather, ClamAV) is scanning any given moment in the empty space below the
    button bar. If it finds anything suspicious, it will list that item in the main
    pane of the window.


    ![](img/ba6b82a7869bba748202d57c97336dca_316_0.png)


    > Figure 18-5: ClamTk–the graphical interface for ClamAV


    As mentioned before, the only viruses you are likely to encounter during a virus
    scan are those designed for Windows systems, which viruses cannot affect your
    Linux system, focusing your efforts where they are likely to do the most good
    seems a sound way of doing things. Although it won''t hurt you to scan your system
    for viruses, especially if doing so makes you feel better, it is probably better
    to focus your virus scanning on activities on your Windows partition, if you have
    one, and on any files that you will be sending as email attachments, particularly
    to Windows users.'
  merge: -1
  pgno: 316
- img_proc: true
  md: '# # Project 18: Virus Scanning with avast!


    While ClamAV may be the virus scanner of choice in the Linux world, my personal
    favorite is still avast!, which defended me during my Windows years. I think it
    is easier to use and, for what it''s worth, nicer to look at. The downside is,
    it does require you to register every year so that you can get a license key,
    but that is hardly a monumental task, and it is still free—at home and noncommercial
    use, which, if my target audience for this book was correctly predicted, should
    include you. If nothing else it is worth a try, so go for it.


    # 18-1: Downloading the avast! DEB Package and License Key


    First you have to get the avast! file and license key. You can do this by opening
    your web browser and going to www.avast.com/eng/download-avast-for-linux.html.
    Once you''re there, click the **Download** button for the DEB package of the avast!
    Linux Home Edition. When Firefox de-what-you-want-do-with-this-file window appears,
    accept the default (gdebi-gtk) by clicking **OK**. Once the download is complete,
    you can, of course, save the package to your hard disk and double-click it to
    open the Debian installer.


    When the Package Installer window appears, provide your password when prompted,
    and click **OK**. The download and installation will begin. When processes are
    complete, close the notification window and the Package Installer itself. Once
    you''ve downloaded and installed avast!, you''ll need a license key in order to
    use it. Just go back to the avast! Download page in Firefox, click the **registration
    form** link, and then fill out and submit that form. You should receive your license
    key by email a few minutes later, even though the page says it could take up to
    24 hours.


    # 18-2: Running and Using avast!


    Once avast! is installed, you can run it by clicking the Run Application panel
    (or pressing ALT-F2), typing `avastgui` in that, and clicking the **Run** button.
    The first time you run avast!, a small window will appear asking you to input
    your license code. Assuming you registered your free code of avast! at the beginning
    of the project as I instructed you to do, your registration key should already
    be waiting for you in your email''s inbox. Go a look, copy the key, and paste
    it into the text field in the Registration window (you''ll have to use CTRL-V
    key combination to do this). Once the license key is in place, click the **OK**
    button.'
  merge: -1
  pgno: 317
- img_proc: true
  md: '![](img/ba6b82a7869bba748202d57c97336dca_318_0.png)


    Figure 18-6: Entering your avast!

    license key


    The main window (Figure 18-7) will now appear, but before you get started scanning
    any, it is a good idea to check for any updates to your virus database. New viruses
    are constantly appearing in cyberspace, so you should keep avast!''s virus database
    up to date so that it recognizes any viral newcomers. To perform the update, just
    click the Update database button, and let avast! do its thing.


    ![](img/ba6b82a7869bba748202d57c97336dca_318_1.png)


    Figure 18-7: avast! virus scanner


    When avast! is updating the virus database, you can get on to the work of virus
    scanning by first deciding whether you want to scan just your Home directory,
    the entire system, or selected folders. You can also decide how thorough a scan
    you wish to perform via the three choices available in the middle of the window:
    Quick, Standard, or Thorough.'
  merge: -1
  pgno: 318
- img_proc: true
  md: 'Which one of these sensitivity modes you choose depends on how thorough you
    want the scan to be. The Quick scan just scans files that end in certain extensions
    (.exe, .com, .doc, and so on), because these are the file types that are most
    often virus carriers. The Standard scan targets more files, ignoring extensions,
    but still limiting the scan to those file types that are usually associated with
    viruses. Finally, the Thorough scan scans everything and searches for every type
    of virus.


    Once you have made your selections, click the **Start scan** button, and avast!
    will start doing exactly that—showing its progress within the same window, no
    less. When the scan is complete, a small window will pop up telling you, hopefully,
    hopefully, that no viruses were found. (When was the last time you got a message
    like that on your Windows machine?)'
  merge: -1
