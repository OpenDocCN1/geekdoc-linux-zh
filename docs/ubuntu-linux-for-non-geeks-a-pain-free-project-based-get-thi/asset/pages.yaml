- img_proc: true
  md: 'http://ubuntu.wordpress.com Ubuntu news with some tips thrown in.

    http://www.ubuntuux.org/blog Mostly an Ubuntu-oriented news blog.

    http://www.ubuntugeek.com Despite having the word geek in the name, this is a
    pretty accessible set of most useful Ubuntu system and software tweaks.


    # Hardware Compatibility Issues


    If you want to find out or not your hardware is compatible with Linux, or if you
    want to read up on other matters related to hardware support, take a look at the
    following sites:


    +   * http://wiki.ubuntu.com/HardwareSupport Ubuntu-specific hardware compatibility
    information.


    +   * http://www.linuxcompatible.org/compatibility.html Numerous compatibility
    lists, arranged by distribution.


    +   * http://www.linuxprinting.org A great spot for reading up on printer compatibility
    issues.


    +   * http://www.linmodems.org Find out if your modem is supported.


    +   * http://www.sane-project.org Check to see if your scanner is Linux compatible,
    and look for fixes if it isn''t.


    +   * http://www.linux-laptop.net Have laptop, want Linux? Check it out here.


    +   * http://www.tuxmobile.org Info for Linux with anything that isn''t stuck
    to your desk (laptops, PDAs, phones, etc.).


    # Wireless Connections


    If you use a wireless card to connect to the Internet and trouble getting your
    card to work, or if you just want to know where all the free hotspots happen to
    be, the following sites should help.


    +   * http://www.hpl.com/personal/Jean_Tourrliches/Linux


    +   * http://www.ezgoal.com/hotspots/wireless


    # Free Downloads


    If you find yourself looking for more goodies to play around with, you should
    be able to find plenty of free stuff to download at one of these sites.


    # Applications and Other Packages


    +   * http://sourceforge.net


    +   * http://www.freshmeat.net


    +   * http://www.gnomefiles.org'
