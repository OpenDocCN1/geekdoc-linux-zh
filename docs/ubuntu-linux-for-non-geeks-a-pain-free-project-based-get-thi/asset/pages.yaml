    Bootloader (GRUB) screen, from which you can choose booting Linux or choose Windows
    in its stead. After that, bootup proceeds as normal for the system you selected.
    This setup works fine, so you needn''t worry.


    So as you see, either way you decide to go, you can''t really go wrong. Just be
    sure to back up your important files before starting the installation; proceed
    with common sense, patience, and a positive attitude; and you''ll be fine. In
    short: Don''t.


    # Getting Ready for Action


    There is less you need to prepare for an Ubuntu installation than for many Linux
    distributions. Once you''ve decided whether or not you want to go the dual-boot
    route, all you really need to have on hand is your single Ubuntu Desktop disk,
    and for guidance and security, this book. The mental energy you''ll probably need
    to expend is to come up with a user-name and password, as you do for most other
    operating systems.


    # Usernames and User Passwords


    Your username is something that you will be using a bit. You will input it every
    time you boot up your system, so be sure it is something you can live with, especially
    in terms of typing. Can it be your first name, or your initials, or whatever you
    want it to be. It, however, with a lowercase letter, followed by numbers and/or
    other lowercase letters. Mine, for example, is simply ng, but you could use something
    like hope4u2pal, though would get rather tiring to type at login day after day.
    Think of your fingers choosing your username.


    You also need to come up with a user password, which you will need to type every
    time you log in. You will need to use it when you install new software or change
    system settings, well. It should be a minimum of eight characters in length and
    consist of numbers and letters (upper- and lowercase) for improved security. You,
    can of course, get by fewer characters and only letters if you prefer. The installer
    will advise you if the password entry is unacceptable, so don''t worry too much.
    Be sure to write it down and keep the paper you''ve written it on in a safe place
    so you don''t end up locking yourself out of your system.'
