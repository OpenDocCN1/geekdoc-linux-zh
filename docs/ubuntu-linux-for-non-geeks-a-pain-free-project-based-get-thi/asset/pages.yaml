  md: '# 15


    # TUX ROCKS

    Music à la Linux


    ![](img/ba6b82a7869bba748202d57c97336dca_264_0.png)


    It''s now time to move on to the audio side of things. Yes, Linux does indeed
    rock, and in this chapter you will find out about those musical talents that your
    system possesses. The size of this chapter alone should be some indication of
    how much there is to offer. You will learn how to rip CDs, create MP3 and Ogg
    Vorbis files (files you can recognize by their .mp3 and .ogg filename extensions),
    add album cover art, change file tags, play music files, and burn onto audio CDs
    that you can play in any CD player. You''ll also learn how to work with a variety
    of audio streams. If you''re interested in learning how to work with your iPod
    in Linux, how to deal with podcasts, and how to convert audio files from one format
    to another ... well, you''ll have to wait until Chapter 16.


    # Audio File Formats


    Before we go any further, it is probably best to discuss the various formats in
    which audio data can be stored on your computer. For the longest time, the de
    facto standards have been WAV (created by Microsoft/IBM and using the'
  merge: -1
  pgno: 264
- img_proc: true
  md: '.wav extension, AU (from Sun/Unix and using the .au extension), and AIFF (from
    Apple and using the .aiff extension), all of which are uncompressed formats. Files
    saved in these formats are, therefore, exceedingly large, with an average WAV
    file of CD-quality weighing in about 10MB per minute. To put in perspective, back
    in 1988 my first Macintosh had a 40MB hard disk—more space than I thought I would
    need, but not enough space to store a WAV file of Nirvana''s ''Come as You.''


    As computers underwent their evolution into the multimedia machines they are today,
    it became clear that something was going to have to be about disk space-devouring
    audio files. Audio compression formats were then disposed. These compression formats
    worked, to oversimplify things a bit, by cutting out the portions of a sound that
    the human ear cannot—sort of a dog-whistle approach. The most widely known and
    embraced of these audio compression formats is MP3. Audio files encoded in MP3
    format without ending up as one-tenth of the original WAV file without any noticeable
    loss in quality.


    Another audio compression format that was developed Ogg Vorbis. Ogg Vorbis was
    a product of the open source community, unlike MP3, which has always been used
    under the shadow of yet-to-be-exerc patent rights, was free of patent and licensing
    worries from the get-go. Because of that, and the fact that it was equal to MP3
    in terms of quality and performance (if not, as many claim, better) Ogg Vorbis
    became the darling of the Linux community.


    As with the audio readers mentioned in this chapter, you are sure to notice yet
    another encoding option—FLAC. Free Loss Audio Code (FLAC) is an encoding format,
    unlike MP3 or Ogg Vorbis formats, does not remove any audio data from the file
    during the encoding process. The downside of this is that FLAC only provides space
    savings of 30 to 50 percent, which is much less than the 80 percent neighborhood
    achieved by MP3 or Ogg Vorbis formats. The upside, of course, is that the FLAC
    should be equivalent to CDs in terms of quality.


    Given that retention of audio quality, FLAC becomes an ideal choice if you are
    not satisfied with the audio quality provided by Ogg Vorbis or MP3 files. It is
    a good choice if you might want to create both Ogg Vorbis and MP3 files . . .
    or if you just don''t know which one you want to work with. In such cases, you
    can just rip the file and encode it in FLAC format. You can convert the FLAC file
    later, when you know what you want or need. You''ll learn how to easily convert
    audio files from one format to another in Chapter 16.


    # Project 15A: Installing MP3 Support for Audio Apps


    All that talked about Ogg Vorbis and FLAC aside, there are many people who like
    or need to deal with MP3 files. You may, for example, already have numerous MP3
    ripped from your music collection, or you may enjoy listening to one of the many
    Internet radio streams that broadcast in'
  merge: -1
  pgno: 265
- img_proc: true
  md: 'MP3 format. Unfortunately, MP3 playback and encoding support is not included
    in Ubuntu due licensing concerns. If you plan on using Ogg Vorbis in your future
    ripping and encoding endeavors, installing MP3 support is a good idea so to cover
    all your audio bases. It''s also a very easy process.


    The easiest way to install playback and encoding support for just any format,
    and for most of the applications I will be discussed in this chapter and throughout
    the book, is via Automix (Applications ➡ System Tools ➡ Automix). Once Automix
    is open, click Codecs and Plugins in the left pane of the window, and then check
    the boxes to AUD-DVD Codecs and Multimedia Codecs in the right pane. Once you''ve
    done that, click the Start button at the top of the window, and the download and
    installation processes will begin. Be forearmed that this is a somewhat hefty
    download, so have a little patience at if your Internet connection is slow.


    # Audio Rippers and Encoders


    The application you use to rip audio files from CD and encode them into space-saving
    MP3 or Ogg Vorbis formats is commonly referred to as a ripper. For some time now,
    the most commonly used non-command-line ripper is Grip, which still has its dedicated
    following. Other simpler-to-use rippers, however have surfaced more recently,
    such aspperX, Goobox, and the one that bundled with Ubuntu: Sound Juicer.


    # Sound Juicer


    Sound Juicer (Figure 15-1) is a relatively new program that is pretty straightforward
    to use and quite capable in terms of what it does. It''s not perfect, though and
    it still a bit quirky. In addition, unlike many of its ripping cousins, Sound
    Juicer does not automatically create a playlist for those you rip and encode,
    and it lacks simple means to adjust the encoding bitrate.


    ![](img/ba6b82a7869bba748202d57c97336dca_266_0.png)


    Figure 15-1: Ubuntu''s default ripping and encoding application—Sound Juicer'
  merge: -1
  pgno: 266
- img_proc: true
  md: 'Despite limitations, there are still many people who prefer Sound Juicer to
    the competition, so you might as well give it a try to see how you like it. To
    started, just place the CD you want to rip in your drive; Sound Juicer will start
    up automatically and display the title of the CD, the artist''s name, and titles
    of all the tracks in the application window.


    **NOTE**

    It is important to mention at this point that if you are not connected to the
    Internet, these bits of album information will not appear because album and track
    data are not embedded in the CD itself. What happens instead is that the audio
    ripper or player on your machine senses the digital ID of the CD you''re playing
    to an online database, as freeDB.org or CDDataBase (CDDB), which is now officially
    known as Gracerate. In turn, the online database sends the album information for
    that CD back to the player or writer.


    You can go about another way by going to **Applications** > **Sound & Video**
    > **Sound Juicer CD Extractor** and then placing your CD in the drive. In this
    case, you might have to go to the Sound Juicer **Menu** and select **Re-read Disc**
    before your album and track information appear.


    # Setting the Default Folder for Ripped Files in Sound Juicer


    By default, Sound Juicer is set up to rip your CDs and encode audio tracks in
    Ogg Vorbis format, and the default location where Sound Juicer saves these files
    is your home folder. Because Sound Juicer, like all other rippers, will create
    an artist folder for each CD you rip, you will end up with a lot of folders in
    your home folder if you rip albums from a large number of artists. It is best
    to create a *Music* folder within your home folder, as you did for your graphika
    account, and make that folder your default location for ripped music.


    To set the default from within Sound Juicer, go to the **Menu** and select **Preferences**.
    This will open the Preferences window where you can change the output path by
    clicking the button next to **Folder** (the button should say *Home* at this point)
    and then selecting **Other** in the menu that appears. After that, browse to your
    *Music* folder, click once in the list to select it, and then click the **Open**
    button.


    # Ripping and Encoding Sound Files in Sound Juicer


    To start ripping the audio tracks from the CD you have in your drive, you first
    need to select the format in which you wish to encode the tracks. To do this,
    go to **Edit** > **Preferences**, and then in the **Output Format** menu select
    the encoding format of your liking. Most of these is **MP3 (MP3 audio)** or, in
    the Linux Linux world, **CD Quality, Lossy (Ogg multimedia)**. Once you''ve made
    your choice, click **Close**.


    After that, you will need to click the **Extract** button at the bottom of the
    Sound Juicer window to rip and encode all of the tracks on the CD. If there are
    certain tracks you do not care to rip and encode, just uncheck the checkboxes
    next to the names of those before you click Extract. If you'
  merge: -1
  pgno: 267
- img_proc: true
  md: 'only want to rip and encode a few songs in the list, it might be better to
    first go to the Edit menu, select Deselect All, and then check the checkboxes
    next to the songs you want to rip before clicking Extract.


    While the songs are being ripped and encoded, Sound Juicer will show you your
    progress in the lower-left corner of the window, and when it''s done, it will
    tell you so in a small window. Once you get that message, click Close. You can
    eject the CD by going to the File menu and selecting Eject. If you want to rip
    and encode another CD, pop it into the drive; just like the first CD, the album,
    artist, and song titles will all appear in the program window, and you can rip
    away again.


    Once you''re done with your ripping chores, you could check out the results of
    your efforts using one of the players discussed in the following sections, of
    course. But the quickest and perhaps the most interesting way to play back your
    newly ripped files is to open a Nautilus window, and navigate to the next tracks
    within your Music folder. Once you''re there, place your cursor over any one of
    tracks and a little note in one of those comic bubbles will appear (Figure 15-2),
    and the track, without a single mouse click, will mysteriously start. Kind of
    cool, don''t you think?


    ![](img/ba6b82a7869bba748202d57c97336dca_268_0.png)


    Figure 15-2: Playing an audio file from Nautilus


    # Audio Players


    Now that you know how to rip your audio CDs and encode them to saving MP3 and
    Ogg Vorbis files, you need to use another application to play them. Fortunately,
    this is an area Linux shines, as there is quite a selection of audio players available,
    two of which I will discuss here.


    # Rhythmbox


    The default audio player in Ubuntu is called Rhythmbox (see Figure 15-3). Rhythmbox,
    using Sound Juicer as its ripper/encoder, seems to function pretty much like a
    simplified version of Apple''s iTunes application, though for better or worse,
    iTunes is not it. It is, however, a relatively easy-to-use audio player which,
    despite some quirkiness in its early stages, has developed quite a fine in the
    Linux world.'
  merge: -1
  pgno: 268
