  md: '![](img/ba6b82a7869bba748202d57c97336dca_60_0.png)


    # 3A-7: Adding the Entire Contents of Adding a Menu to the Panel


    If you find that you use the applications in a particular submenu of your Applications,
    Places, System menus a lot, you can opt to add the entire menu to the panel as
    either a menu or as a drawer in a manner similar to the one used in Project 3A-5
    “Method 2” on page 38. To learn how to do this, let''s add the Games submenu to
    the panel as a menu, and the Sound & Video submenu as a drawer. Here is what you
    need to do:


    +   - Add the Games menu to the panel by going to Applications ▸ Games and right-clicking
    any of the launchers to panel.


    +   - In the popup menu that appears, select Entire Menu ▸ Add this as menu


    +   - Add the Sound & Video submenu to the panel by going to Applications ▸ Sound
    & Video and then right-clicking any of the launchers you find there.


    +   - In the popup menu, select Entire Menu ▸ Add as this drawer to panel.


    You should have two new launchers on your panel with matching those found in the
    Applications menu next to the relevant items. Click each of these new panel entries
    to see how they work.


    # 3A-8: Moving Things Around on the Panel


    Now, we''ve added all we are going to be add to the panel. It may seem a little
    messy up there right now, so let''s do a bit of housekeeping moving things around.
    We will try to group things together somewhat thematically as to make them easier
    to deal with.


    Fortunately, you can move panel launchers easily by right-clicking the launcher
    in question, selecting Move from the popup menu, and dragging the launcher to
    the spot you want to place it. Once the launcher is where you want it to be, click
    the launcher once, and it will stay there.


    To get some practice with this moving business, let''s move the launchers, menus,
    and drawers you added by placing them in the following order, from left to right:
    Applications, Places, System, Firefox, Mail, OpenOffice.org Writer, OpenOffice.org
    Calc, Sound & Video, Games, Place the'
