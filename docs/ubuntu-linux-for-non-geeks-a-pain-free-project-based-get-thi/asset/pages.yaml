    # Burning Multisession CDs


    If you are coming from the Windows environment, you are no doubt familiar with
    multisession CDs. These are CDs on which data is added one session at a time.
    For example, you burn a few files to disk today, add a few more to the disk tomorrow
    and a few files the day after that. Each time you burn additional files to the
    same disk, you are adding a session, which explains the name multisession. If
    that explanation seems a bit obtuse, you can basically think of them working like
    floppy disks (albeit with considerably more storage capacity). While Nautilus
    can read and display (it cannot) write multisession disks. To do that, you will
    need a different disk-burning application. I recommend GomeBaker.


    You can download and install GnomeBaker from Synaptic (search for gnomobaker).
    Once installed, you can run it from the Applications menu by selecting **Sound
    > Video > CD/DVD Writer GnomeBaker**.


    To burn the first session to CD, click the **Data CD** button in the bottom half
    of the GnomeBaker window. After that, drag the files that you want to burn to
    the bottom-right pane of the GnomeBaker window, under the Data CD tab (Figure
    6-15). You can drag files from the browser in the two panes of the GnomeBaker
    window, from a Nautilus window, or from the desktop.


    When you have all the files in place that you want to burn, click the **Burn**
    button at the bottom-right corner of the screen. A new window, Create CD, will
    appear. In that window, select ** to in the drop-down menu next to the word **Mode**.
    Once you''ve done that, insert a blank disk in the drive, and click **Start**.
    The burning process will begin. GnomeBaker will eject the disk when it is complete.


    # Burning Subsequent Sessions


    To add a new session to a multisession disk, make sure that the bottom-right pane
    of the GnomeBaker window is empty (click the **Clear** button if it isn''t), and
    then insert the multisession disk into your drive. After your drive has finished
    its session and you have pushed the Navigator window for that disk out of the
    way, go to the GnomeBaker **Project** menu, and select **Import Session**. A small
    window will appear asking you to select where the multisession disk is located.
    You most likely have one drive, the correct device should already be displayed.
    If so, click **OK**.


    The files burned in previous sessions will now appear in the bottom pane. To add
    additional files to burn to the disk (thus creating a new session), just follow
    the procedures used for burning the initial session.'
