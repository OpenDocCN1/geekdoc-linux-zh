- img_proc: true
  md: 'If you don''t like this onscreen display appears (or how it looks), you can
    change it by going to the Tools menu and selecting Preferences. When the Preferences
    window appears, click OSD in the left pane, and a list of options available to
    you will appear in the right half of the window. To change the location of the
    display, just drag it to the position you like while the Preferences window is
