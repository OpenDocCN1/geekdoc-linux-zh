    for example.


    the head of that path stands for server message block, but to make things easier
    (and perhaps more useful in your memory) you can think of it as being short for
    Samba, which is software used by Unix-based systems (such as Linux and Mac OS)
    to interact with Windows networks.


    Once you''ve made your way to the folder you wish to browse on the networked machine
    you''ve connected to, it might be a good idea to use the bookmark function in
    Nautilus to bookmark that open share window. You can then easily access that share
    in the future, by choosing the share''s name in the Nautilus Bookmarks menu. Pretty
    cool, if I do say so.


    # Nautilus as an FTP Client


    Nautilus not only allows to browse and mount shares on local networks, but it
    can also be an FTP client, say for instance when you want to change the files
    for your website on a remote server. To do this, go to the Connect to Server window
    (File ► Connect to Server), and then select FTP (login) for Service Type. Type
    the information provided by your website host, and click the Connect button. An
    FTP Network icon will appear on the desktop and in the side panel. Double-click
    that icon, type your password (for that account—not the one for your Ubuntu system,
    unless it happens to be the same) when prompted to do so, and then you will be
    able to view and add to the files you have there.


    # File and Folder Permissions Within Nautilus


    As you make your way in the world of Ubuntu, you will find that you''ll come across
    files or folders which are in some way locked, either in terms of your being able
    to read them, being able to edit them, or both. These readability and alterability
    states of being are referred to as permissions.


    Now you may be (legitimately) wondering what the point of this permissions business
    is, in order to help you understand, I will give you some examples of how it can
    be useful. Let''s say that you have some files'
  merge: -1
  pgno: 107
- img_proc: true
  md: 'you don''t want your spouse or kids to see—some bad poetry or a Christmas shopping
    list, for example. By denying read permission to the files, or to a folder containing
    those files, no one would be able to sneak peek unless they were savvy at changing
    permissions and had the permissions necessary to change permissions for those
    files or folders.


    As another example, imagine you have a file that you have worked many hours on
    and have finally completed. To alleviate fears that you might accidentally trash
    it in some way, you could deny write permissions. By doing this, you wouldn''t
    be able to do anything to the file without changing its permissions. In fact,
    if you tried to move that file to the Trash, or even to another folder, you would
    be greeted with a no-can-do message, such as the one shown in Figure 6-9.


    ![](img/ba6b82a7869bba748202d57c97336dca_108_0.png)


    Figure 6-9: Nautilus tells you when permissions restrict your freedom of movement.


    # Changing File and Folder Permissions in Nautilus


    To change file or folder permissions in Nautilus, just right-click the file or
    folder in question, and select **Properties** from the popup menu. Once the Properties
    windows open, click the **Permissions** tab, and see who is the owner of the file
    or folder is and what you are allowed or not allowed to do with it. As you see
    in Figure 6-10, the options for files and folders are slightly different.


    You might find this permissions business a bit confusing, but it is really simple
    to understand. Permissions can be granted or denied to the owner of the file or
    folder (you), to a specified group, or to others (everybody else). These permissions
    are:


    +   - **Read**: Permission to view the contents of a file or folder

    - **Write**: Permission to alter the contents of a file or folder

    - **Execute**: Permission to run a program or script


    In general, you don''t need to worry all much about setting permissions for your
    own files, as you are really the only one who has access to your user account.
    One of the main exceptions is when you transfer files from CD to your hard disk.
    In this case, the files will be protected, meaning that you cannot alter the files
    until you change the permissions for them. You can change the permissions of such
    files in order to allow yourself to alter them by clicking the checkbox in the
    Owner row next to the word *Write*. Once you are done, click the **Close** button,
    and you''ll be on your way.'
