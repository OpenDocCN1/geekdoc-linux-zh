    In case you are not already familiar with this genre of Mahjong game, the idea
    is simple enough. Each tile has an image and there are four of each tile in the
    pile. You must match pairs of like tiles that are open on at least one side. When
    you click the two matching open tiles, they will disappear. The object of the
    game is thus, to remove all the tiles from the board. A very simple solitaire
    game.'
