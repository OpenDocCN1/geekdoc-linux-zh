  md: '![](img/ba6b82a7869bba748202d57c97336dca_105_0.png)


    Figure 6-6: The location of your users'' folders within the Linux filesystem


    In Ubuntu there are four folders that contain most of the applications on your
    system. The essential elements of your system are located in /bin. Other elements
    that need to be there, they may not be used, such as commands and the like, are
    located in /bin. Most of the applications that you actually think as applications
    and use in hands-on ways are located in /usr. Finally, there are some add-on applications,
    such as RealPlayer, that install themselves into /opt.


    There other top-level folders that might be of interest to you /etc, /lib, and
    /media. The first of these, /etc, is the location of all the configuration files
    on your system. The second, /lib, is the location of all the libraries that are
    required by your system or applications installed on it. These libraries are the
    Linux equivalent of a Windows .dll file. The contents of your attached external
    media (such as USB drives and CDs) appear when present.


    There are other top-level folders, but their purposes are a bit less straight-forward
    for the average Linux newbie and, to be honest, not all of them are interesting
    to you at this stage of the game. Anyway, as I mentioned before, there is no reason
    for you to be mucking around with any of these folders for the time being, as
    the items located within them can be accessed in different, and much safer, ways.


    # Using Nautilus as a Network Browser


    Another Nautilus feature is its ability to function as a network browser. You
    can, for example, see what networks and shares are available to you in your home
    or office network by going to the Places menu in the GNOME Panel and selecting
    Network Servers. You can do the same from within a Nautilus window by going to
    its Go menu and selecting Network. Icons for any'
