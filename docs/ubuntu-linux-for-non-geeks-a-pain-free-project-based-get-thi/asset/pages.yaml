    there are times when you just have to have it. There are, after all, sites that
    won''t let you use anything. For Linux users, this used to be a problem, getting
    IE to work under Wine could be quite a geeky chore. Not anymore, thanks to IE4
    Linux, which is a simple utility that helps you download, install, and set up
    Internet Explorer for use with your Linux system.


    Before using IE4 Linux, you will need to have two things installed: Wine, which
    you may have installed while following along with the previous section, and cabextract,
