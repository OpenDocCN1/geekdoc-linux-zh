- img_proc: true
  md: 'You can easily find out where these locations are by typing echo PATH in a
    new Terminal window and pressing ENTER. As you will see, on your Ubuntu system,
    these locations are:


    +   - /usr/local/bin

    - /usr/local/sbin

    - /sbin

    - /usr/sbin

    - /bin

    - /usr/bin

    - /usr/bin/X11

    - /usr/games


    If the command you typed is in one of these locations, the program or script,
    will run. As you do no doubt, pyWings is not in any of those locations. It is
    in /home/username/LocalApps/pyWings and is thus, in a sense, out of your system''s
    sight.


    To remedy this, you could add the path of your pyWings script to the list of paths
    that the system checks for commands, so as to make the system aware of your new
    application''s existence. However, let''s try another method that I think is easier.
    What you will do is create a link to pyWings, a sort of launchable alias, in one
    of the locations your system does check for.


    To create this link


    +   1. In the Terminal, type cd /usr/games, and press ENTER. This puts you in
    one of the folders that your system searches when you enter commands.

    2. Type sudo ln -s /home/username/LocalApps/pyWings/pyWings.py pyWings, and press
    ENTER. (Note that there is a space between the words pyWings.py and pyWings at
    the end of that command string)


    The pyWings at the end of command string is the name that you are giving the link;
    the name of the link becomes the command you will use to run the application.
    If you type nothing, the link will be called pyWings.py, which would mean three
    keystrokes for every time you wanted to start the program.


    +   3. Type your password when prompted to do so, and so, and press ENTER.

    4. Type cd, and press ENTER to return the Terminal to your home folder.


    # 8B-7: Running pyWings Again


    Now that you have created the link, you should be able to run the pyWings program
    much more easily. To try it out, quit pyWings (if it is still running), type pyWings
    in the Terminal, and press ENTER. Your personal pyWings oracle should appear again.


    You''ve managed to cut down the number of keystrokes required to run pyWings from
    the Terminal. However, if you are really into this pyWings thing and want to use
    it, it will probably be handiest to add a launcher to your panel, a drawer, or
    the Applications menu.'
  merge: -1
