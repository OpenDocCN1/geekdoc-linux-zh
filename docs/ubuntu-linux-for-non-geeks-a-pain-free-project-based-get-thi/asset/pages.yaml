  md: '# SIMPLE KITTEN WAYS


    Getting to Know the Linux Terminal and Command Line


    Many people shy away from Linux because they envy it as a system for compu-geeks,
    an environment in which you do everything the hard way—by command line. In this
    era of graphical interfaces, the idea of typing commands to get things done seems
    a dreadful drawback to the days of DOS, and puts many people off—especially those
    who remember what it was like in the “old days.”


    This reaction is fair enough, but it is not really an accurate reflection of the
    reality of the Linux world. After all, most Linux users today utilize some sort
    of graphical interface. They can, and often do, achieve all through drop-down
    menus and mouse clicks alike. Many are able to survive quite happily without ever
    opening their Terminal. The same could be true of you.


    ![](img/ba6b82a7869bba748202d57c97336dca_144_0.png)'
  merge: -1
  pgno: 144
- img_proc: true
  md: 'Be that as it may, there is still much to be said for the power and convenience
    of the command line. The fact that the command line can now be utilized within
    a graphical environment makes it much less forbidding. The Terminal is just a
    tiny text-based island in a sea of graphical bodies (see Figure 8-1). Using the
    command line can be pain-free as anything else you do on your system, and it actually
    provide you with a little fun if you are willing to give it a try.


    ![](img/ba6b82a7869bba748202d57c97336dca_145_0.png)


    Figure 8-1: Putting the Terminal in perspective


    Unfortunately, many guides to using the command line are written by hard-core
    command-line junkies, whose enthusiasm for what they see as a real good thing
    inadvertently makes what they seem even more off putting to the recent Linux immigrant
    or wannabe.


    For your sake, I will try to curb my enthusiasm so as not to scare you back to
    Chapter 5 and the more comfortable world of Synaptic. I will also try to help
    you keep things in perspective by teaching you, whenever possible, to use the
    command line as a complement to the various graphical tools that you have at your
    disposal, rather than presenting it as the sole way of going about things. Of
    course, I am not going to cover every possible angle in this regard—just enough
    to give you some exposure and experience and, hopefully, make you feel at least
    a little more at ease with the command line. Who knows; could you actually come
    to thinking of using the command line as . . . fun? Well, I won''t get too carried
    away.


    126 Chapter 8'
  merge: -1
  pgno: 145
