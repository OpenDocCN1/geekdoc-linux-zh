    # # Linux on Your iPod?


    One thing you notice if you do a Google search for information about using your
    iPod with Linux is that it is possible to replace your iPod''s Apple-designed
    operating system with a form of Linux. Now, I am not advocating that you do this
    (and I most certainly have not done so myself), but some folks are interested
    in geeking around whatever gadget they have in their hands. If you''re such a
    person, or just curious, check out www.ipodlinuxx.org.


    # # Other MP3 Players


    Although Apple''s iPod kind dominates the portable audio player market,it is not
    the only kid on the block. There are numerous other players out there, many of
    which can be used in Linux with varying degrees of simplicity; more information
    is available at http://tuxmobilib.org/portable_players-html. If you have one of
    Creative Lab''s Zen or Nomad players, the Linux application Gnomad makes things
    easy for you. Gnomad is available via Synaptic, and can be run, once installed,
    from Applications > Sound & Video > Gnomad 2.'
