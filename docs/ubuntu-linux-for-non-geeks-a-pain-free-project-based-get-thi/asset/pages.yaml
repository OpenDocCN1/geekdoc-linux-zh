  md: '![](img/ba6b82a7869bba748202d57c97336dca_67_0.png)


    Figure 3-16: GNOME''s logout window


    The actual shutdown will take a few seconds as the system closes its various services.
    When it is all done, the system should power down your computer as well, in which
    case you are done. On a few machines, however, the system cannot power down your
    machine. You will know if this is so in your case because all screen activity
    will come to an end. If you get to that point and nothing else happens for 15
    seconds or so, then just power down the machine manually by pressing the power
    button. It is completely safe to do so at that point.'
