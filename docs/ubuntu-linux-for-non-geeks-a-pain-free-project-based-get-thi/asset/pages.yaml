- img_proc: true
  md: '# 12


    # POLYGLOT PENGUINS


    Linux Speaks Your Language


    ![](img/ba6b82a7869bba748202d57c97336dca_220_0.png)


    These days, almost all operating systems are multilingual, or at least capable
    of becoming so. This is true of Linux as well.

    Just open your web browser, and, without performing any special installations,
    you can read pages in any European language, including those with Cyrillic alphabets,
    such as Russian. You can even view pages in Chinese, Japanese, Thai, Arabic and
    Hebrew, to name but a few.


    The multilingual capabilities of Linux are much greater than this, and the way
    GNOME-based distros, such as Ubuntu, handle multilingual makes it quite easy to
    take advantage of these capabilities. As you will soon see, you can even set up
    your system to give you a totally foreign language environment, allowing you to
    function completely in the language of your choice. Add to this the ever-expanding
    number of free programs available for language study, and you have a truly meaningful
    language-learning tool.'
  merge: -1
  pgno: 220
- img_proc: true
  md: '# Read-Only Language Support


    If all you want to be able to read web pages or documents written in a foreign
    language, you don''t need to install any additional language support except in
    rare cases. From the get-go, you will be able to view documents in just about
    any language you have to throw at your system—doesn''t matter if it''s Swedish,
    Chinese, Italian, Japanese, Arabic, Hebrew, Russian, Vietnamese, Armenian, or
    Thai. You will be able to read whatever you are linguistically capable of (see
    Figure 12-1 for an example).


    ![](img/ba6b82a7869bba748202d57c97336dca_221_0.png)


    Figure 12-1: A Japanese web page displayed in Firefox


    # Changing the Character Encoding in Firefox


    Firefox usually automatically recognizes the language in which a web page is written
    and displays the page correctly. Sometimes, the author of the page may neglect
    to include the character coding for that page in the HTML, in which case Firefox,
    not knowing that the page is prepared in another language, will output in the
    default language of your system. The result is a page in which you see nothing
    but odd combinations of symbols and letters that have no meaning. In this case,
    try changing the character coding in Firefox to the language you believe the page
    to be in. Some languages employ more than one encoding scheme, if you''re not
    sure, give each one a try. You can make your choices by going to the View menu
    and selecting Character Encoding. From the submenu, you can select the appropriate
    coding for the language of that page.


    # Typing Nonstandard Characters


    Typing characters that are not standard in English, as é, ç, ß, ø, æ, and æ, can
    be done quite easily in Linux without any modifications. In most situations, you
    can do this by using the Character Map utility included in your'
  merge: -1
  pgno: 221
- img_proc: true
  md: 'system, which can be found at Applications ▸ Accessories ▸ Character Map. Upon
    running Character Map, a window like the one shown in Figure 12-2 will appear.


    ![](img/ba6b82a7869bba748202d57c97336dca_222_0.png)


    Figure 12-2: Inputting characters with the Character

    Map utility


    To input the character you want, just select the language or character

    set in the left pane of the window, and then, in the right pane, click on the

    character you want to input. The character will appear in the left input box

    next to the words Text to copy and just the Copy

    button, and then paste the character wherever you want to place it.


    In certain applications, as the various OpenOffice modules,

    this method will not work. In these cases, the program usually offers a method

    of its own. In OpenOffice, for example, you can click Insert in the menu

    bar and select Special Character. A selection window will open, and

    y can select the character you want there. Once you''ve done that, click

    the OK button, and the character will appear in your document, after

    this selection window will close by itself.


    # Using the Compose Key Option


    If you only need to type an accent or umlaut once in a while, and don''t feel

    particularly keen when opening an application or going to a special menu to

    so, using the compose key option for your keyboard is a good way to go. Basically

    what this means is that you use one of the lesser-used keys on your keyboard

    in conjunction with key symbols ('', ''~'', ''^'') to help in the creation, to
    speak,

    acented characters. By default, the compose key is the right ALT key.


    Let''s say, for example, that you wanted to type an umlaut (ü). While

    pressing the right ALT key, you would press \''. Then you would release the

    right ALT key, press and . . voilà you''d have an ű. Here are some

    examples:


    +   - right ALT + then a á

    - right ALT + then c ç

    - right ALT + ` then e è

    - right ALT + ~ n ñ

    - right ALT + ^ then o ô'
  merge: -1
  pgno: 222
- img_proc: true
  md: '# Using the Keyboard Indicator


    If you often type in a particular foreign language, it might be more convenient
    for you to use the Keyboard Indicator GNOME Panel utility. This utility lets you
    switch quickly among various keyboard layouts. For example, if you often type
    in Swedish, and thus the characters å, ä, and ö regularly, the appropriate keyboard
    layout would be easier than repeatedly using the Character Map. Of course, you
    will have to familiarize yourself with the layout, or keymap, for each language
    you choose, which is a relatively easy task.


    The Keyboard Indicator is already included in your system, so there is no need
    to install it. To access it, simply right-click somewhere on the GNOME Panel where
    you would place a launcher for then. from the popup menu select Add to Panel.
    When the Add to Panel window appears, scroll down and click Keyboard Indicator,
    and then click the Add button. letters USA or GBr will then appear on the panel.


    Now, this alone give you nothing except your default keymap, so you must configure
    Keyboard Indicator if you want to be able to use other keymaps. To do so, just-click
    the icon, and from the popup menu select Open Keyboard Preferences, which will
    open the Keyboard Preferences window.


    To add a keymap, click the Layouts tab in that window, and then once in the new
    tab, click Add. After you do this, the window will appear with a list of the keymaps
    available to you (Figure 12-3). In the left pane of window, scroll down for the
    country of the language you want to add, and then click it to select the standard
    keyboard layout for that locale (click the arrow to the country for a list of
    optional layout you prefer). Once you''ve made your selection, click the OK button,
    which will bring you back to the Keyboard Preferences window, where you will find
    your new keymap listed along with the original. You then click the Close button
    to complete the setup.


    ![](img/ba6b82a7869bba748202d57c97336dca_223_0.png)


    Figure 12-3: Adding keyboard layouts to the Keyboard Indicator


    After closing the Keyboard Preferences window, the keyboard layouts can be changed
    by clicking the icon in the panel. You can also change between keyboard layouts
    by going to the Layout Options tab of the Keyboard window and assigning a keyboard
    shortcut. If you are not sure where'
  merge: -1
  pgno: 223
- img_proc: true
  md: 'the keys you want to type are located in your new keymap, switch to the key-map
    in question by clicking the panel Keyboard Indicator until it appears and then
    right-clicking it. In the popup menu that appears, select Layout View, after which
    a map of the new layout will appear in a separate window. The default window size
    is quite small, but it can be resized in the usual drag-to-corner manner.


    If you want to choose a single keyboard layout to replace your present one (such
    as British English instead of American English or German instead of Spanish),
    you can do so from the Keyboard Preferences window by adding the keyboard layout
    you want, checking the box next to the word Default, and removing the original
    layout by clicking it once to select and clicking the Remove button.


    # Viewing Your System in Another Language


    One of the many things that originally attracted me to the Linux world was being
    able to install support for languages other than English. On one of my machines,
    I have installed support for Chinese, Japanese, Swedish, and my default, English.
    With just a simple logout and a few clicks, I can log back with an interface in
    a totally different language. I can have a Chinese, Japanese, or Swedish system
    whenever I want.


    This is very useful if you are going to do a lot of work in a foreign language,
    or if you are studying a foreign language and want to give as much exposure as
    possible to it. It is also very handy when you have users with different native
    languages using the same machine. At my former university, for example, where
    my Japanese and Chinese students sometimes used my computer, the additional language
    support allowed them to log in using their own language. In all, it is a very
    useful feature.


    Taking advantage of this feature in the GNOME environment is very easy and easy,
    depending on the language you wish to use, requires little in terms of special
    installation measures. Basically all you have to do is install a group of support
    files for each language you want to add to your system. You can do this quite
    easily by going to the System menu and selecting Administration Support.


    You will be prompted for your password at this point, so what is required, and
    the Language Support window (Figure 12-4) will appear. In that window, check the
    boxes next to the languages which you want to install support. Once you have made
    your selections, click the Apply button, and the Language Selector will begin
    downloading and then installing the support packages specified.


    ![](img/ba6b82a7869bba748202d57c97336dca_224_0.png)


    Figure 12-4: Installing additional language support'
  merge: -1
  pgno: 224
- img_proc: true
  md: 'NOTE Language Support is another graphical front end for APT, and that being
    the case, be sure to close all other APT-related tools before using it.


    # # Multilingual Login


    Once you have installed support for any additional languages you want, you can
    log out of your current session and log in to a new one in a different language
    environment. The actual switch is made from your log screen.


    Just below the text box where you would normally type your username, click the
    link that says Language, after which a window with a list of the languages you
    have installed will appear. Select the language you want to in the next session
    by clicking on its name and then clicking the OK button. The language list will
    then close automatically, and you can proceed as usual by typing your login name
    and password (pressing the ENTER key after each, of course). A little window will
    pop up asking you if you want to use the language you''ve chosen as your default
    language forever and ever. You can either click Just for This Session or Make
    Default depending on your personal preferences. Whatever you end up choosing,
    it''s no big deal to change back at a later point in time by logging out of your
    system, logging back in your system under your previous default language, and
    clicking Make Default.


    Your startup process will then continue, and everything will progress as it usually
    does. Depending on what language you have chosen, your desktop appears will be
    in another linguistic world. Your menus, applications, and the little Tips windows
    that pop up when you move your mouse over a panel will all be in the newly selected
    language. (Figure 12-5)


    ![](img/ba6b82a7869bba748202d57c97336dca_225_0.png)


    Figure 12-5: The Applications and Sound & Sound menus shown in Japanese


    # # Chinese, Japanese, and Korean Input


    For most European languages (and many other alphabet-based languages), pressing
    a letter on the keyboard simply prints the letter to the screen. However, Chinese,
    Japanese, and Korean require a kind of conversion process that is handled by a
    special application (actually)'
  merge: -1
  pgno: 225
- img_proc: true
  md: 'a set of applications) called an Input Method Editor (IME). Of course, this
    is a Windows-world term, but I will use it here for convenience’s sake. In any
    case, each of these languages has its own IME, and each is different due to the
    basic differences in the three writing systems.


    # Chinese


    While most people (at least those the linguistic know) would think that Chinese
    would be the most complicated system, because the writing system consists of thousands
    of characters, it is in fact the simplest. The Chinese IME simply takes the romanized
    keyboard input, known as pinyin, and converts it into Chinese characters, or Hanzi.
    For the IME, it is essentially a simple dictionary lookup task—big dictionary,
    simple IME. In the event that there is more one character for the pinyin input,
    a list of possible candidates will appear, and the user can then select the appropriate
    character from that list.


    # Japanese


    The Japanese IME has a considerably more complicated task to perform, as it has
    three writing systems to deal with: Kanji (ideographic characters borrowed long
    ago from China), hiragana (the phono-alphabetic system used mainly for tense and
    case endings), and katakana (used mainly for words borrowed from other languages).
    Still, the standard input method for Japanese is primarily via the standard Roman
    keyboard layout, plus a few extra function keys. Thus, typing in Japanese is a
    two-step process whereby the IME first converts the romanized text into hiragana
    as it is typed and converts it to appropriate Kanji, katakana, or hiragana elements
    the spacebar is pressed.


    You can see an example of these steps in Figure 12-6. In the first line, the IME
    has already converted the romanized input on the flow. It has converted rinakkussengyuokumodekasu
    (which You can also input Japanese in Linux) to hiragana. The fact that line is
    underlined means it has not yet been converted beyond. In the second line, however,
    the user has subsequently pressed the spacebar, which caused the IME to convert
    the hiragana string into the appropriate Kanji, hiragana, and katakana elements.
    The first word, Linux, has been converted to katakana text, as it is a borrowed
    word, while Japanese input has been converted to Kanji; the rest stays in hiragana.


    # りなっくすですでにほんごににゅうりょくもできます。


    リナックスで日本語入力もできます while typing in Japanese


    Figure 12-6: IME conversions'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# Korean


    The job of the Korean IME is again quite different from that of the Chinese and
    Japanese IMEs, as the language itself is written in a very different way. Korean
    is written entirely in alphabetical letters, called Hangul, or in a combination
    of Hangul and ideographic characters borrowed from Chinese and Japanese Hanja.
    While the Hanja characters are essentially the same as their Chinese and Japanese
    counterparts, Hanzi and Kenji, the Korean phonetic alphabet, Hangul, has its own
    unique appearance, as you can see in the Korean word for Korea, Hanguk(k), in
    Figure 12-7.


    ![](img/ba6b82a7869bba748202d57c97336dca_227_0.png)


    Figure 12-7: Korea (Hangug) written horizontally in Hangul


    This seems; however, the representation is not correct, as Korean is very unique
    in the way that its alphabetical characters are put to the page. Unlike the usual
    side-by-side positioning of hiragana, katakana, and most other languages written
    with an alphabet, Hangul letters are grouped in pairs, triplets, or even quadruplets,
    which are written as a general rule, clockwise. The IME, therefore, must take
    the input (usually based on a Korean alphabetical keyboard layout) while it is
    being typed, and it must adjust the size, spacing, and positioning of each of
    the letters as it puts them into appropriate clusters (see Figure 12-8).


    ![](img/ba6b82a7869bba748202d57c97336dca_227_1.png)


    Figure 12-8: An example of the clustering process in the Korean IME


    # Project 12: Installing Asian Language Input Support for SCIM


    What do you do if, for example, you want to be able to type Chinese, Japanese,
    Korean, Hindi, Thai, or Nepali while still in your usual English environment?
    What if you want to be able to type all of those languages in the same document?
    Can you do it? You bet.'
  merge: -1
  pgno: 227
- img_proc: true
  md: 'There are actually several ways of going about this, but the one of the most
    straightforward to use is Smart Common Input Method (SCIM), the base for which
    comes preinstalled in Ubuntu. SCIM supports Asian languages, including Chinese,
    Japanese and Korean, and it provides a number of input methods for many of these.


    # 12-1: Downloading and Installing SCIM Input Method Modules


    Despite coming preinstalled on Ubuntu, SCIM will not be able to do anything for
    you out of the box. In order to enable SCIM you can input CJK and other types
    of characters, you will need to install a package called im-switch. Then you will
    need to install the appropriate input methods for the language you wish to type.


    The easiest and least problematic way of getting these packages is via the Language
    Support utility. Just go to the System menu, select Administration > Language
    Support, then install support for the languages you want.


    After the installation of the language support is complete, there is still one
    simple step left. Log out, and then once you''re back at the login screen, log
    back in. A SCIM applet will appear at the right side of the top panel, letting
    you know that SCIM is ready for action.


    # 12-2: Typing in Asian Languages with SCIM


    To get a feel for how SCIM works, try using it with Gedit (Applications ▸ Accessories
    Text Editor).


    Once Gedit appears, click the SCIM panel applet. A list of the languages that
    can be handled by SCIM will appear in a drop-down menu (Figure 12-9). Remember,
    however, the number of languages appearing in this menu will be dependent on the
    number of languages you installed.


    ![](img/ba6b82a7869bba748202d57c97336dca_228_0.png)'
  merge: -1
  pgno: 228
- img_proc: true
  md: 'From that list, select the language you want to use, and, for those languages
    where you are given a choice, select the input method you prefer. The icon for
    the SCIM panel applet will reflect the change by showing the icon for the language
    you have chosen. You can then start typing.


    At this point, a small input palette like the one in Figure 12-10 will appear
    at the bottom-right corner of the screen. In this palette, in addition to displaying
    the language and input method currently in use, also allows you to easily switch
    between English and the current language of input, or to switch from the language
    in which you are currently typing to another. By clicking the red button at the
    far-right end of the palette, you can also find out what the hotkeys are for the
    input method you are currently using.


    ![](img/ba6b82a7869bba748202d57c97336dca_229_0.png)


    Figure 12-10: The SCIM input palette


    Regardless of the input method you are dealing with, probably the most important
    hotkey combination you will want to use is SHIFT-spacebar, which toggles you back
    and forth between English and the language you have selected in SCIM.


    > NOTE You must be working with a document or application that accepts text input,
    or no menu will appear when you click the SCIM applet.


    # 12-3: Installing Additional Input Methods


    You may find that the input methods supplied for the languages you have may include
    some that you are not familiar with. For example, the default Korean set is not
    based on the standard keyboard (the only one I''m familiar with), and it does
    not have Hangul-to-Hanja conversion capabilities like the hiragana-to-Kanji ones
    included by default in the Japanese module. Fortunately, this is easily remedied
    by using Synaptic to install additional input modules. Which package you download
    depends, of course, on the language in question. To add additional modules for
    Korean, install scim-tables-ko. For additional Japanese input methods, install
    scim-tables-ja. Finally, for additional Chinese modules, install scim-tables-zh.


    You can also use SCIM to conveniently type in other Asian languages that do not
    require special conversion routines, as as Thai, Hindi, Telugu, Bengali, and Punjabi.
    To get input support for these languages, install scim-tables-additional.'
  merge: -1
