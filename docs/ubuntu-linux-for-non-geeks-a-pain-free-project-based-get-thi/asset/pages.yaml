    When you download Fedora Core or other Linux distributions from the Internet,
    you usually download them in the form of one or more disc images, which are commonly
    referred to as ISOs because such end in the .iso extension. An ISO is an image
    of a CD''s file contents, which means that it the CD minus the media itself. To
    put it another way, if CDs had souls, the ISO would be the soul of a CD; take
    away the CD''s metal and plastic, and the remaining data would be an ISO.


    As is impossible to download a physical CD over the Internet, the bodless ISO
    are the next best thing. For example, to get a working copy of Ubuntu from the
    Web, you need to download an ISO, which you then burn onto a blank CD in order
    to give the images their bodies back, to speak. In the process you create the
    working installation disk that you need to install Ubuntu.


    Fortunately, burning an ISO is a pretty simple choice. Just open a Nautilus window,
    locate the icon for the ISO file you want to burn to disc. Right-click the ISO
    file, and in the popup menu that appears, select **Write to Disc**. Once you do
    this, the Write to Disc window will appear; just click the **Write** button,,
    and you''ll be on your way.


