  md: '# Project 9D: Running Java Apps: Risk


    In Chapter 8 you learned to run a couple of applications based on scripts, such
    as the Python-based pyWings and the Tcl/Tk-based Briscola, but it just wouldn''t
    be to finish up our discussion of applications without mentioning what might be
    considered the granddaddy of all scripting languages—Java. In this project, you
    will learn how to install the Java Runtime Environment and how to install and
    run the Java-based version of the classic board game, Risk.


    # 9D-1: Installing the Java Runtime Environment


    In order to run Java-based applications, or scripts, you need to first install
    the Java Runtime Environment. This is an excellent chance to use Automax. Just
    click Codecs and Plugins in the left pane of the Automix window, and check the
    box next to the words SUN JAVA 1.6 JRE in the right pane. After that, the process
    you learned for installing packages via Automix. Once the installation gets going,
    another Terminal-like window will appear showing what''s going on. Don''t panic;
    you won''t have to do anything with it. The whole Java package is pretty heavy
    so don''t get freaked out if it seems to take longer than you''re used to.


    Eventually, a graphical Configuration window, such as that shown in Figure 9-9,
    will appear. Read and then agree the licensing terms (by checking the box), and
    then click the Forward button. More white text will roll by in the two windows
    until the process is complete, after which the Automix window will be back to
    its usual graphical self. You can quit Automix.


    ![](img/ba6b82a7869bba748202d57c97336dca_186_0.png)


    Figure 9-9: Configuring Java support for your system'
  merge: -1
