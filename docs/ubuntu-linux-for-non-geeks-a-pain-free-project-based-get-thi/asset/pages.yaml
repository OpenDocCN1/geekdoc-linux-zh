  md: '# Totem Movie Player


    The default video player in Ubuntu is Totem, which, as you can see in Figure 17-3,
    has a very simple interface that makes using it equally simple. You can run Totem
    by going to the Applications menu and selecting Sound & Video Movie Player. You
    can also run it by simply placing a DVD in your drive, because Ubuntu is set up
    to run Totem any time you do so. If you don''t happen to have a DVD on hand but
    want to see Totem in action, you can also bring it by double-clicking that Ubuntu
    video that comes with your system in the Examples folder (Experience Ubuntu.ogg).


    # Switching Totems


    Before going on any further, I should mention that if you installed the two codec
    packages back in Project 15a, you are not using the same Totem you were when you
    first installed your system. How can that be, you ask? Well, despite all that
    simplicity I talked about, Totem can be an absolute pain in the proverbial at
    times. You may be one of the lucky ones, but for me and many others, Totem can
    be as cooperative as a cat on a leash (mine excluded, of course). The problem
    is not actually Totem itself, but rather the gstreamer back end that performs
    its video processing.


    ![](img/ba6b82a7869bba748202d57c97336dca_303_0.png)


    Figure 17-3: Totem Movie Player


    Totem, you see, is merely a graphical front end that provides you with an easy
    way to use software that works in the background—a back end, which in this case
    is gstreamer. When you installed the multimedia and DVD codec packages with Automix,
    that gstreamer version of Totem was replaced with'
  merge: -1
  pgno: 303
- img_proc: true
  md: 'a version of Totem that utilizes the Xine-processing back end instead. The
    reason Automatik automatically performed the switch is that its designers know
    Xine is a much more cooperative beastie when it comes to video.

    If you haven''t made the switch and find yourself having problems with Totem as
    is, try installing the Xine version along with the other multimedia codecs. The
    instructions for doing this are given in Project 15a, but to save your some wear
    and tear, I will repeat the procedure for you here. Just Automatik (Applications
    -> System Tools -> Automatik), and once the window opens, click Codes and Plugins
    in the left pane of window, and click AUD-DVD Codes and Multimedia Codecs in the
    right pane. Finish by clicking Start button.

    Once''re done, you won''t notice any changes in Totem up front, but you''ll likely
    be a much happier camper because Totem should then work as it''s supposed to.
    You will experience, among other things, superior sound (or at least better volume),
    more dependable DVD playback, and less quirky playback of Windows Media Video
    (WMV) files. If it''s still giving you trouble after that, try one of the other
    playback applications mentioned at the end of this chapter.


    # Using Totem to Play DVDs, VCDs, and Other Multimedia Files


    As already mentioned, you can play a DVD in Totem by simply placing your DVD in
    the drive, after which Totem will open and begin playing your movie.

    If you''ve got a copy of Red Detachment of Women on VCD that you''re aching to
    watch, you can do so in the same way. Just pop the VCD in your drive; Totem should
    start up and begin playing it.

    Totem not only plays DVDs and VCDs, but it can also play MPEG files and, because
    you installed that big cocktail of packages I keep going about, it can play WMV
    files too. You can play such by either doubleclicking them directly or going to
    the Totem Movie menu, selecting Open, and then navigating to the video file


    # Making Things Look a Bit Better in Totem


    One thing you might notice when using the Xine version of Totem is that videos
    seem to look a bit washed out. This can be easily fixed by going to the Totem
    Edit menu and selecting Preferences. In the Totem Preferences window, click the
    Display tab, and then lower the Brightness and Contrast sliders to points similar
    to those shown in Figure 17-4. You, of course, can change things to suit your
    own tastes. Once you''re done, click Close.'
