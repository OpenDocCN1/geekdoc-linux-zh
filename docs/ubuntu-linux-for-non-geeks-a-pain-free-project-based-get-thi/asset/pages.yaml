- img_proc: true
  md: 'So why would you want to bother compiling programs from source? Well, although
    there are a lot of DEB packages that Synaptic can ease into your system, not every
    bit of software in Linuxdom is available in that file format. Or perhaps you want
    the newest version of the software you have your eyes on, but the version via
    Synaptic is a slightly older version. Of course, there is that good old human
    factor at play as well—there may come a time when curiosity gets the best of you,
    and you will want to move one step beyond the you''ve accustomed to doing things.
    After working through this short project, you will be able to do that, and I am
    sure you will find that your initial worries will have been naught.


    # What Is Source?


    In order to understand what source is, you should understand a bit about how a
    program actually gets from its primitive state on the programmer''s computer to
    an up-and-running application on your machine. The first programmer writes a program
    in a programming language. You have probably heard of programming languages such
    as BASIC or C, and there are many others. The programmer actually writes with
    such a language is a set of instructions called the code, or source. Your computer,
    however, cannot understand any of that on its own. It is as if the computer speaks
    ancient Greek, and the source code is all written in French. The computer needs
    some sort of interpreter to help it out.


    The various languages that programmers use are high-level languages—they are relatively
    easy for programmers to read. The computer, on the other hand, only understands
    low-level languages, which are quite difficult for most mortal programmers to
    deal with. To convert the high-level language instructions to a low-level language,
    the computer needs some other program to translate.


    This can be done while a program is running, in which case the translator is an
    interpreter. Applications that running an interpreter are usually scripts. The
    pyWindows and Briscola applications in Chapter 8 are examples of such scripts.


    The problem with scripts is that they can be slower than most of the applications
    you''re familiar with because the computer must run an interpreter, interpret
    the source code, and run the actual application all at the same time. This is
    like having a French book translated into Greek by a live interpreter—very slow.


    As an alternative, most programs use a compiler instead of an interpreter. A compiler
    translates the high-level source code into low-level machine code, or object code,
    that the computer can understand before the application is actually run. Once
    this translation is done, the computer never has to bother with the high-level
    instructions again; it can merely read the translated version and every time it
    runs the program. This is like having a translated version of a foreign book that
    you can read any time you want. Because computers can run compiled programs without
    simultaneously using an interpreter, compiled programs run faster than scripts.
    Most applications for all operating systems are, compiled.'
  merge: -1
