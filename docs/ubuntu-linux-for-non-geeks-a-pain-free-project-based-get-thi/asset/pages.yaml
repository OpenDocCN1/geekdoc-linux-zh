  md: '# 9D-2: Getting the Risk File


    Risk, as well as many other Java-based applications, is available from www.sourceforge.net,
    but to make things easier, just point your browser directly to the Risk project
    home page at http://jisk.sourceforge.net (and don''t forget the at the beginning
    of URL). On the main page, click the Download link. Then, on the Downloads page,
    click the Risk jar and source link.


    A window will appear asking what to do with the Risk Zip file, and your choices
    are to save it to disk or to open it with Archive Manager. Since you are going
    to unzip the package once you download it, you might well choose the top option,
    Open with Archive Manager, and then click OK. The Archive Manager window will
    appear. All you have to do is click Extract, and when the Extract window appears,
    select your home folder for the destination by double-clicking its icon, and then
    click Extract again. Once the file is extracted you can close the Archive Manager
    window.


    You will now have a new Risk folder within your home folder. If you take a look
    in that folder, you will notice the file Risk.jar. This is the game that will
    be running via the command line. In the future, should choose to download other
    Java-based applications, the file with the .jar extension is the one you will
    be trying to run.


    # 9D-3: Running Risk


    Now that you''ve installed the Java Runtime Environment and downloaded and extracted
    the Risk Zip file, you are ready to run Risk without any further work. To get
    going, open a new Terminal window, and do the following:


    +   1. Move into the Risk folder by typing cd Risk and pressing ENTER.

    2. Type java -jar Risk.jar (be sure to place a space between java and -jar), and
    press ENTER. Risk (shown in Figure 9-10) will soon appear, after which you can
    start playing.


    In case you''re wondering, what''s what you did in that last line: The first part
    of the command string, java, calls the Java Runtime Environment into action; the
    -jar flag after that tells java you are going to run a JAR file; and the last
    part is the actual file you are going to run, Risk.jar. In the future, if you
    choose to run other Java-based applications, just follow the same pattern: java
    -jar application_name.jar.'
