- img_proc: true
  md: '# Downloading, Installing, and Running FontForge


    You can easily download and install FontForge via Synaptic. Just do a search for
    fontforge, mark the fontforge and fontforge-doc packages for installation when
    they appear in the list of search results, and then follow the usual procedure
    for installing packages via Synaptic. You can run FontForge by going to the Applications
    menu and selecting Graphics > FontForge. An Open Font window will appear, in which
    you can select the font you want to work with. Make sure that it is not an installed
    font, but rather a font located within the home folder.


    After that, I think I had better leave you to your own resources (and those of
    theirs). Font creation and modification is, after all, too complex a topic for
    this book, but those of you already into this stuff probably just needed a pointer
    to the right tool and not my meager instructions. If you need more than a pointer,
    the FontForge help files are a good place to start, as is the FontForge project
    page at http://fontforge.sourceforge.net.'
