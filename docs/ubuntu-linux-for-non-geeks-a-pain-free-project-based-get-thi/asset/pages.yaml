  md: '# Songbird


    Another, somewhat more entry in the Linux music player sweeps is Songbird (15-15),
    which is very similar to and yet very different from everything out there. It
    is essentially what the Songbird folks describe as a “desktop Web player, a digital
    jukebox and Web browser mash-up”. Hard to resist giving any sort of “mash-up”
    a, isn''t it?


    If you find yourself losing the resistance game, give Songbird a try by installing
    it via Automix (Media Players and Editors > Songbird) Songbird once it''s installed.
    it from Applications > Sound & Video > Songbird


    ![](img/ba6b82a7869bba748202d57c97336dca_281_0.png)


    Figure 15-15: The well-connected browser, jukebox, and player mash-up—Songbird


    # Beep


    With all the, multi-featured music players out there, it is easy to overlook the
    original, or in this case, a clone of the original—Beep. Beep is essentially a
    more GNOME-friendly version of the classic X Multimedia Stereo (XMMS) player,
    which was the original king of Linux audio players. Beep, like XMMS, is set up
    to work like a component stereo (with movable components!). The fact that it is
    skinnable means you can make it look like real component stereo, as well (via
    Synaptic). You can download and install Beep via either Automix or Synaptic. To
    take it for a spin, go to Applications > Sound & > Beep Media Player.'
  merge: -1
  pgno: 281
- img_proc: true
  md: 'If you are an Internet junkie, there is probably no application as useful to
    you as Streamtuner (Figure 15-17). Streamtuner, as its name implies, is an online
    radio tuner. With by downloading streams from a variety of sources, you can then
    easily browse. When you find something you like, just select the stream, click
    the *Play* button, and the stream will open in the player of your choice (though
    it works best with RealPlayer or XMMS). If you will be using a different player
    for playback, select *Preferences*, and then in the right pane of the Preferences
    window, change the default applications for playback (most will be as XMMS). For
    example, if you want your playback to be from Berry, click *Listen to a .m3u*
    file, scroll to the right, and change *XMMS* to *beep-media-player Qa*.


    If you''re installing Streamtuner, you might as well install Streamri, which is
    a sort of Internet audio stream recorder. It works in conjunction with Streamtuner,
    allowing you to record the streams you are listening to (and even those you aren''t
    listening to) and save them as MP3 files. To record a stream from Streamtuner,
    just right-click the target stream, and then select *Record* in the popup menu.


    Figure 15-17: Browsing Internet radio streams with Streamtuner'
  merge: -1
