  md: 'If you haven''t guessed already, what Alien does is convert RPM packages to
    DEB packages that you can install and run in your DEB-based system. It doesn''t
    work 100 percent of the time, and it isn''t as desirable as an alternative to
    a properly compiled Deb-from-source package, but if there''s an application you
    need, it might just get the job done. So give Alien a try, we''ll convert and
    install an application called TuxCards (shown in Figure 9-5) that calls itself
