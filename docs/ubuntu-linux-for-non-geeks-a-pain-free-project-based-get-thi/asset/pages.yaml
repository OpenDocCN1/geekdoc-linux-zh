  md: '# 9C-1: Downloading and Extracting the Xmahjongogg source code.


    To get started, you will first have to download the Xmahjongogg source code. You
    can get this from the Xmahjongogg project page at http://www.lcdf.org/xmahjongogg.
    Download the tarball xmahjongogg-3.7.tar.gz or a newer version if there is. Do
    not download any of the other file types available on that page.


    If you prefer, you can instead download the Xmahjongogg tarball by using the wget
    command that you learned in Chapter 8. Just open a Terminal window, type the following
    command, and press ENTER.


    ```

    wget http://www.lcdf.org/xmahjongogg/xmahjongogg-3.7.tar.gz

    ```


    Once you have on your hard disk, extract the xmahjongogg-3.7.tar.gz file either
    via the command line, as you learned to in Chapter 8, or via the simple double-click
    method. It is easier for you to follow along with the directions I''ll be giving
    you, be sure to place the untared Xmahjongogg folder in your Home folder. Then
    you will need to roll.


    Normally at this point, you would look through the folder to find some instructions
    for dealing with the package, just as you did in Chapter 8 In most source packages,
    this information is included in an INSTALL file like that in the xmahjongogg-3.7
    folder (Figure 9). To read the INSTALL file, just double-click, and it will open
    in Gedit.


    ![](img/ba6b82a7869bba748202d57c97336dca_182_0.png)


    In this case, you can simply close the INSTALL file, as it prescribes the same
    steps as I have listed below. However, in the future, when you install other programs
    from source, you will need to follow the instructions in the INSTALL files that
    come with the source files for those programs. With most INSTALL files, the instructions
    will match those that follow, though I would suggest using the alternative method
    I''m presenting as for the make install step.'
  merge: -1
