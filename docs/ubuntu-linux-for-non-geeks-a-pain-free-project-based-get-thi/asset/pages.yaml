  md: 'The companion CD lets you try out Ubuntu 7.04 (Feisty Fawn) without making
    any changes to your computer and then install it when you''re ready.


    ![](img/ba6b82a7869bba748202d57c97336dca_352_0.png)


    # LEARN LINUX AND LOVE IT!


    A fast, clear-crystal tour of the amazing collective accomplishment embodied in
    Ubuntu.

    —Cory Doctorow, Boing Boing


    +   * Configure your hardware, including printers, scanners, and removable storage
    devices

    * Watch DVDs, listen to music, and even sync your iPod

    * Download photos and videos from your digital camera, then edit and share them

    * Tackle more advanced tasks as soon as you''re ready


    Ubuntu has been hailed as the Linux distribution for newbies, and it''s certainly
    Linux for the less geek among us. Even is merry user-friendly—it''s a South African
    term that translates as ‘humanity towards others’ and could also describe author
    Rickford Grant’s approach to teaching Linux.


    Full of tips, tricks, and helpful pointers, Ubuntu for Non-Geeks, 2nd Edition
    is a hands-on, project-based, take-it-slow guidebook for those interested in—but
    nervous—switching to the Linux operating system. This edition has been updated
    by Feisty Fawn, the latest Ubuntu (7.04), which puts the spotlight on multimedia
    support and desktop effects. Step-by-step projects build upon earlier tutorial
    concepts, helping you absorb and learn what you''ve learned.


    Whether you''re new to computers, looking for a pain-free way to make the Linux
    switch, or just want a low-cost alternative to Windows, Ubuntu is for you.


    Rickford Grant, author of Linux for Non-Geeks and Linux Made Easy (both No Starch
    Press), has been a computer operating system maniac for more than 20 years. From
    the Atari 600XL to Linux machines, he has been the guy behind the help desk for
    family, friends, and colleagues. Rickford resides in Greensboro, North Carolina,
    where he spends his working hours as a teacher and his free time coding, writing,
    and annoying his neighbors with Nyckelhar (Switched fiddle).


    Ubuntu for Non-Geeks covers all the topics to be of interest to an average desktop
    user. Inside, you''ll learn to:


    +   * Download and install free applications, games, and utilities

    * Connect to the Internet and wireless networks


    # COVERS UBUNTU 7.04 (FEISTY FAWN)


    ![](img/ba6b82a7869bba748202d57c97336dca_352_1.png)


    $34.95 ($34.95 CDN)

    ISBN: 978-1-59332-152-7

