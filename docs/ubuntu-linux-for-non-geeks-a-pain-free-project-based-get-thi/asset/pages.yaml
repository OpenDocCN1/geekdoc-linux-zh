    Finally, bearing in mind all the warnings offered in Chapter 5, if you want to
    upgrade your system via the command line, you can do so by typing sudo apt-get
    dist-upgrade (but only after doing a sudo apt-get update first).


    # A Couple of Other Biters You''ll Be Using Soon


    This is a good place as to introduce two more commands that you will be called
    upon to use in this chapter and elsewhere in the: ln and tar. You needn''t practice
    with these yet, as you will be using them very soon, and you as well know what
    they are all about.


    # $ ln


    The ln (link) command is used to create a link file that launches or activates
    another file located in a separate folder. This is very useful when trying to
    activate a file that is buried deep in the subfolder of a subfolder of a subfolder
    somewhere on your hard disk. The command is very often used with the -s (symbolic)
    flag, which provides essentially the same thing as the shortcut you''ve come to
    know in Windows, or the alias on Mac.


    The easiest way to use the ln command is first use the cd command to change the
    Terminal''s location to the folder where you want to place the link. You can type
    the ln command on the command line, followed by the path of the file you wish
    to link. For example, let''s say you want to put a link in your home folder for
    an OpenOffice.Writer file of your autobiography myLife.sxw. The file is pretty
    well buried in a nest of subfolders deep within your home folder: /home/username/Documenta/personal/self/autobiography/myLife.sxw.
    To create the link, you would open a new Terminal window, type the following command,
    and press ENTER:


    ```

    ln -s Documentia/personal/self/autobiography/myLife.sxw

    ```


    Once you are finished, the link will appear in your home folder as an icon matching
    the original file in appearance, albeit sporting an arrow to signify that it is
    a link.'
