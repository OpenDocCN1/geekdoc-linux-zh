  md: '# Blender


    Perhaps one of the most impressive open source applications available today is
    Blender. Blender (Figure 14-18) is a professional-level 3D modeling, animation,
    and rendering program. It is rather complex, but that is the source of its power
    and popularity (it comes in versions for about every operating system out there).
    If you would like to find out a bit about Blender before taking the time (and
    disk space) to install it, go to www.blender3d.org. Find it via Synaptic by searching
    for blender; once the program is installed, you can run it from Applications >
    Graphics > Blender 3D modeller.


    ![](img/ba6b82a7869bba748202d57c97336dca_261_0.png)


    Figure 14-18: Blender


    # QCad


    Another open source application that has found its way into almost all operating
    systems is QCad (Figure 14-19). QCad is a 2D computer-aided design (CAD) program
    with which you can create technical drawings as room interiores, machine parts,
    or even musical instruments (I’ve seen a plan for a Nyckelharone on QCad!). To
    find out more, go to the project home page at www.ribbonsoft.com/qcad.html. Search
    Synopsis for qcad, and install the application. Once it is installed, you can
    run it from Applications > Graphics > QCad.'
  merge: -1
