    press of the ENTER key), just as you would normally in.


    To get back to your original user account after going the switch-user route, click
    the Quit button at the right corner of the top panel, click Switch User (if you
    plan to return to the new account) or Log Out (if you don''t plan to return soon),
    and then once back at the login screen, type your username, press ENTER, type
