- img_proc: true
  md: '![](img/ba6b82a7869bba748202d57c97336dca_156_0.png)


    If you''re more of a letters numbers sort of person, you''ll be happy to know
    that there is another way to change permissions that is probably even easier.
    In this approach, you only have to deal with groups of letters and the symbols
    + and -.


    The first group consists of:


    +   - User (owner of the file)

    - Group (specified group of users)

    - Others (anyone who is not the user or a member of the group)

    - All (all of the above)


    The second group consists of:


    +   - Read

    - Write

    - Execute


    You might already be able to figure out how this is all going to work, but I''ll
    spell it out in case your intuition is worn out for the day. Let''s say you want
    to change the permissions of a file (butteraters.txt, for example) so that all
    users on your machine can read and write to it. After opening a Terminal window,
    you can make the change by typing chmod a+w butteraters.txt and pressing ENTER.

    Oops! Just remember that you don''t want anyone changing the content of the file,
    eh? Well, to take back the write permissions for that file, you just need to type
    chmod a- butteraters.txt and then press ENTER. As you can see, the + gives permissions,
    while the - takes away.

    Much simpler, you''ve got to admit.


