  md: '# INTRODUCTION


    My computing life began long ago in the Commodore/Atari days. No doubt inspired
    by Alan Alda’s television commercials at the time, I purchased my first machine,
    an Atari 600XL with a cassette drive for storage and 16KB of RAM—more than I thought
    I would ever need. Most of my time on that machine, I must admit, was spent playing
    cartridge-based games and transcribing pages and pages of machine code from the
    non-defunct magazine Antic to create even more games. Eventually, my interest
    in computers increased, especially after seeing my first (and actually the first)
    Macintosh at the UCLA bookstore. The very in-your-face nature of the Mac’s operating
    system caused me to become an operating system maniac. To date, I have worked
    with a lot of different operating systems, including Mac OS up to and including
    OS X, Windows version from 3.1 to XP, and IBM’s much forgotten OS/2.


    Though tempted to join the Linux fray, I continued to steer away from it for a
    long time because I could not help but see it, as so many others do, as a system
    for never-seen-the-light-of-day-faced, late-night Dr. Pepper-drinking,


    ![](img/ba6b82a7869bba748202d57c97336dca_20_0.png)'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'Domino’s-pizza-eating computing-geeks. However, when I moved to Japan and was
    suddenly surrounded by machines loaded with Japanese versions of Windows, I encountered
    numerous problems, such as language constraints. Since everything, including Help
    files, was written in Japanese, I ended up using only a fraction of the full potential
    of most software. There were those annoying Windows-type problems, such as the
    constant freezes and restarts and the gradual system slowdowns, which were eventually
    remedied by reinstalling the system. Getting the software things I wanted to do
    also took its toll on my wallet, and I began to rethink my initial restart to
    Linux. With Linux’s multilingual support, stability, and everywhere free software
    packages, there were plenty of incentives for me to get over my notions about
    the Linux user.


    After a few attempts at getting Linux to work on the oddball, Frankenstein-like
    collection of junk that was my computer, I finally succeeded with a CD-based Knapp
    distribution, which worked well enough to keep me in a little further. I moved
    on Mandrake (now known as Mandriva) next, since that was claimed to be the most
    newbie-friendly version, and tried out SuSE as well, which I found to be rather
    quirky. Eventually, I tried out Red Linux and stuck to that because it didn’t
    give me any grief; and I, like others, do not want any more grief than necessary.


    I started off with three desktop machines at work and home set up as dual-boot
    systems running Linux and Windows, but I gradually myself using only Linux. Although
    I had expected to encounter numerous limitations in Linux that would force me
    to return to Windows often, I instead found that I had actually increased my productivity.
    However due to lack of support for Windows streaming media, I was actually able
    to do more due to the extensive software base that was now installed on my machine.
    Without having to fork out money I could afford to spend, I was able to manipulate
    my digital images, rip songs from CDs, create vector drawings, create PDF files,
    and from a variety of things I wasn’t able to do under Windows. It was only a
    matter of time before my dual-boot setups became full-only setups. It was ceased
    to be a Windows user.


    Since those early Linux days, I have gone to try out a number of other distributions
    including AMD, Xand, Damn Linux, and most recently Ubuntu. I am happy to report
    that these things have continued to get easier and better, and those early frustrations
    I suffered trying to get things to work with this machine or that piece of hardware
    are becoming more and more a thing of the past. Best of all, with the advent of
    CDs, which allow you to try Linux out before you actually install it, you don’t
    even have to take a leap of faith to get started.


    # Who Is This Book For?


    If you are standing in the aisle of your local bookstore right now, you may well
    be wondering what this book is. If you also happen to see my previous books, Linux
    for Non-Geeks and Linux Made Easy on the'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'same shelf (or have at least heard about them), you might also be wondering
    what the differences among these books are. These questions are reason-enough.
    To put it simply, there are two differences: the experience level of the target
    reader and the distribution covered in each book. Linux for Non-Geeks, based on
    Fedora Core 1, was my first book and was written with folks like my mind—average
    computer users with some experience in the Windows or Mac worlds who had an interest
    in Linux but were afraid to give it a go. My second book, Linux Made Easy, was
    based on Xandros 3 and was written at a more basic level for those who just wanted
    a free and easy way out of the grasping tangles of the Microsoft empire.


    Ubuntu for Non-Geeks, as you might imagine, it is based on Ubuntu, and the original
    Linux for Non-Geeks, it targets readers who are interested in Linux but feel the
    need for a jumping-point of sorts. There are some similarities with its predecessor,
    Ubuntu for Non-Geeks is different due to the inherent differences between the
    Debian-based Ubuntu and the RPM-based Fedora Core, but also to the advances made
    by Linux as a whole. These advances have resulted in a system that is easier and
    more convenient to use than ever before.


    If you are familiar with computers, but unfamiliar with Linux but without Ubuntu,
    you are essentially the reader for whom I have written this book. To avoid any
    misunderstanding on your part (and at the risk of being redundant), I must re-emphasize
    that this is not a book for seasoned geeks or power users. It is an introductory
    guide that will provide new users with hands-on experience to get them up, running,
    and comfortable with the Ubuntu distribution of Linux.


    # Version Compatibility


    This book was prepared for use with Ubuntu 7.04 (Feisty Faun) Desktop edition.
    Included with this book is a full copying of system on one CD, which functions
    not only as an install CD, but also as a live CD. This means that you can run
    Ubuntu directly off the CD without so much as touching your hard disk. You can
    then give Ubuntu a try before making any hardware commitments. And since we''re
    talking hardware, it is also worth pointing out that running a live CD gives you
    the chance to see if Ubuntu works with the hardware you''ve got.


    If you like what you see and all the hardware seems to work, you can go ahead
    and install the full shebang on your computer . . . and using the same disk, no
    less (instructions included in Chapter 2).


    The world of computers is exceedingly dynamic, and as such, there may be changes
    in the software or the links to the files for projects in this book after the
    book is released. I''ll post any such changes at www.edgy-penguins.org/UFNG.


    NOTE'
  merge: -1
