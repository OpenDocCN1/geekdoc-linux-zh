    File and Disk Handling in Ubuntu


    ![](img/ba6b82a7869bba748202d57c97336dca_98_0.png)


    No matter which operating system you are using, you have to deal with files. Some
    people are very organized, placing every file in a logically named folder as soon
    as that file is saved for the very first time. Then there are people like me,
    who save everything to the desktop until it is full of junk that they can no longer
    make out the wallpaper, and only at that point they start organizing in earnest
    (if placing all of those files in a single folder called March17Cleanup can be
