    # # USB Storage Devices


    No chapter dealing with file handling and storage would be complete without touching
    upon the topic of USB storage devices, so that is exactly what I will now turn.
    Unless you have used a digital rack for the past few years, you are no doubt familiar
    with USB devices. Your printer is very likely a USB device, as is your scanner.
    And although your digital camera is not a USB device in the traditional sense,
    chances are that every time you connect it to your computer in order to transfer
    photos, you are doing so via a USB connector.


    Among the most popular USB devices out there are those for file storage. These
    include external hard disks, flash memory card readers, and tiny, finger-sized
    devices known as flash drives (Figure 6-16). Flash drives are especially popular
    today, and deservedly so: they are quite inexpensive, extremely handy when you
    need to transfer fairly large, but not gigantic, amounts of data from computer
    to computer (from work to home, for example); and pretty safe in terms of cross-platform
    (including Linux) compatibility.


    96 Chapter 6'
