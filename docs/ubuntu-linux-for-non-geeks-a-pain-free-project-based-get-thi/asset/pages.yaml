- img_proc: true
  md: '# Determining Your iPod’s Format


    How do you know whether your iPod is HFS+ or FAT32 formatted? Well, I said, it
    is basically a matter of knowing which system you''ve been using your iPod with
    up until now. When you first plugged your fresh, out-of-the-box iPod into your
    computer, it really couldn''t do anything. At that time, your Windows or Mac system
    popped you to run the iPod Updater tool. That tool is primarily a formatter, which
    formats your device.


    If you''ve been a two-OS sort of person who have been happily using your iPod
    on both a Mac and a Winbox, then you can be sure that your iPod was formatted
    using FAT32 because Windows sweeps out chalk when it tries to deal with anything
    that Microsoft itself didn''t create. In other words, Windows can''t read drives
    formatted by HFS+, while Mac can read both HFS+ and FAT32 drives. If you are also
    sure that it is FAT32 formatted, because all iPod Shuffles are—period.


    Of course, if you''re a prove-it-to-me kind of person, you can seek truth from
    facts by plugging your iPod into your equipped Mac or Winbox, and seeing what
    it says in the right pane of the iTunes windows next to the word Format. If it
    says Windows, you''re ready to go.


    If you don''t have a Mac or Winbox handy, you can check from Ubuntu to the Applications
    menu and selecting Accessories > Text Editor. Open and File System in the left
    pane, double-click etc in the right pane, select the file tab, and then click
    the Open button to reveal the format of your iPod. Just look for a line that something
    like /dev/sda2 /media/ipod or /dev/sddb /media/ipod and see what is listed to
    the right of that. If it says vfat, then you know your device is FAT32 formatted.
    If it reads hfsplus, well . . you''re just going to change it.


    # Reforming Your iPod


    And how do you change your iPod from HFS+ to FAT32 format? Well, the easiest way
    is to find a machine running Windows 2000 or newer and a recent edition of iTunes.
    But, before you go any further, make sure that you have everything on iPod backed
    up, because you are going to be reformatting it, which means wiping it clean.


    Once you are ready to make sure the Windows machine is connected to the Internet,
    start iTunes and then plug your iPod into one of the Windows machine''s USB ports.
    A window should appear telling you that you have a Mac-formatted iPod that must
    be restored before you can use it in Windows. Click OK.


    To bring your iPod to a comfy state of Linux usability, click the Restore button
    in the right pane of the iTunes windows. A warning window will appear telling
    you that everything on your iPod is about to be removed (hence my warning about
    backing up everything first). Click the Restore and Update button, and then along
    with the brief wizard. Once the wizard is complete, sit back and wait for your
    iPod to be restored (Windows-sized). This will take a couple of minutes, so enjoy
    the brief respite.'
  merge: -1
  pgno: 288
- img_proc: true
  md: 'When the process is complete, a new window will appear asking you to name your
    iPod, and asking whether you want iTunes to automatically synchronize your iPod
    with your photo and music collections (Figure 16-2). What you name your iPod is
    up to you (short names show up better on GNOME desktop), but I strongly recommend
    checking the two auto-sync checkboxes; otherwise could lead to unintended weirdness
    down the line. Once you''re done, click **OK.**


    ![](img/ba6b82a7869bba748202d57c97336dca_289_0.png)


    **Figure 16-2:** Completing your iPod’s HFS+ to FAT32 conversion process


    Once the entire process is complete, you will have a properly configured, FAT32-formatted,
    and all-empty iPod that is ready for use in Linux, Windows, and Mac OS. You can
    even see your iPod now on all systems interchangeably, though I would only do
    so if the auto-update function is disabled.


    # (Not) Auto-Updating Your iPod


    When you enable-update on your iPod via iTunes, the function is set up within
    your iPod itself. With a FAT32-formatted iPod, you can use your iPod on a Winbox,
    Mac, or Linuxbox—or all of them interchangeably. If you set your iPod to auto-update
    songs and playlists, you are leaving yourself for trouble unless you have exactly
    the same collection on your Linux, Mac, and Windows machines.


    The reason for this is simple. While iTunes allows you to add files to your iPod,
    it does not allow you to copy files from it. The auto-update feature is strictly
    a one-way street. This means that whenever you hook up your autoupdate-enabled
    iPod to an iTunes-enabled computer, iTunes will automatically add tracks to its
    library to your iPod, and, more frighteningly, will remove any tracks from your
    iPod that are not present in its library. I learned this hard way when I took
    my wife’s loaded iPod to work and plugged it into my office Winbox with its completely
    empty iTunes library. When I brought the little Podster back to her with nothing
    at all on it, what wasn''t pretty.


    270 Chapter 16'
  merge: -1
