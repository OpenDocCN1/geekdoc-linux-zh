    notification tool, in the following left-to-right order: Geyes, Wanda, Force Quit.
    Finally, place the Run Application applet by itself, midway between the two clusters
    of launchers.


    When you''ve made all your changes, your panel should look pretty much like in
    Project 3-11.


    ![](img/ba6b82a7869bba748202d57c97336dca_61_0.png)


    3-11: The GNOME Panel with the new launchers


    # More Panel Fun


    In addition to the basic customization you did in Project 3A on page 35, you can
    do a lot to change the look and feel of your panel. Of course, you can remove
    any of your launchers, drawers, or menus by right-clicking the item in question
    and selecting **Remove Panel** in the popup menu, but there are still more options.
    Most of these are available by right-clicking any space in the panel and then
    selecting **Properties**, which will bring up the Properties window.


    From this window you can change the position of your panel, after its size, color,
    or make it transparent—very cool. You can also set the panel so that it will automatically
    disappear when you are not using it and have it reappear when you move your mouse
    cursor into the area where the panel normally resides. Don''t feel afraid to play
    around and give things a try—that''s half the fun!


    # Project 3B: Manipulating Menus


    Now that you have learned about some of the cool and useful things you can do
    with your panel, let''s now move on to the topic of menus. A very nice feature
    of GNOME is that it allows you to edit your menus. You can add launchers, remove
    items, menus, and even change the icons that appear within the menus. In all in,
    you have a lot of control over things, but for this project, we''ll limit our
    work to two of these areas: icons and moving menu items.


    # 3B-1: Changing Icons Within Menus


    As you no doubt recall, one of the problems with the OpenOffice.Writer and Calc
    launchers we added to the panel was that they shared similar icons. If you go
    to **Applications ▸ Office**, you will see that the icons for the various OpenOffice
    org modules, although not the same, are a bit similar.'
