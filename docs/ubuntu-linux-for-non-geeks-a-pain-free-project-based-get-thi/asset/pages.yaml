    # # Converting Audio File Formats


    SoundConverter (shown in Figure 16-10) makes it easy to convert MP3 files to Ogg
    Vorbis format or vice versa. Because SoundConverter does not come bundled with
    Ubuntu, you will have to install it if you haven''t already done so. To do, just
    run Synaptic, search for soundconverter, and install the application.


    To use SoundConverter, just select Applications & Sound > SoundConverter. Once
    SoundConverter starts up, add the songs you want to convert the main pane by clicking
    the Add File or Add Folder buttons. You can also drag audio files from your Music
    folder (wherever you store them).


    ![](img/ba6b82a7869bba748202d57c97336dca_298_0.png)


    Figure 16-10: Converting audio file formats to convert, you will need to choose
    which


    Once you''ve chosen the format to convert them. You can do this by selecting Edit
    > Preferences and making your choice in the Preferences window (Figure 16-11).
    While you''re there, it is also a good idea to tell SoundConverter to place your
    converted files in a location other than the folder where the original files are
    stored. Doing this prevents dealing with duplicates in Linux audio playback applications
    that automatically scan your Music folder, as Rhythmbox (This is not an issue
    in either gtkpod or YelpPod, as they will not allow you to add Ogg Vorbis files
    to their library lists). You might also want to check the box next to the Create
    subfolders in order to keep things organized.


    Once you have set up and are ready to convert, click Close in the Preferences
    window, and then click Convert in the main window. SoundConverter will then begin
    doing its stuff.'
