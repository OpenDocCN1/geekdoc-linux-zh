  md: '# $ tar


    In Chapter 6 you learned to create and extract archives, or tarballs, but did
    you know that you can also create and extract tarballs using the command line?
    The tar command is your key to doing this.


    To create an archive, you would simply type tar -cvf, followed by the name final
    tarball be, and then the name of the folder or file you are trying to archive.
    For example, let''s say you want to create an archive of your photos folder, and
    you want to call it pics4pals. In this case, you would type the following command,
    and then ENTER:


    ```

    tar -cvf pics4pals.tar photos

    ```


    As you doubt noticed, there are some flags after the tar command in your string.
    The c tells the tar program to create a new archive. The v tells the program to
    be verbose, or, in other words, to tell you what it is doing in the Terminal as
    it is doing. Finally, the f tells the program that what follows is the file.


    If, after creating the archive, you suddenly remember that there is one more file
    you want to add to the mix, you can use the -r flag to append the archive. For
    example, to add a file called cranky to the archive, you would type the following
    and press ENTER:


    ```

    tar -rf pics4pals.tar cranky.png

    ```


    Of course, chances that you will be doing more tarball extracting than creating,
    so you want to know how to do that. Fortunately, the process is pretty similar
    to what you use when creating the tarball. The main difference is in the first
    flag. Rather than what you use the tar command with the -c flag, you would instead
    use it with the -x flag, which tells the tar program to extract the specified
    archive. So if you want to extract a tarball called spicyfood.tar, type the following
    command, and press ENTER:


    ```

    tar -xvf spicyfood.tar

    ```


    What you have been doing far is creating and extracting archives, which are basically
    collections of files. They are not, compressed. In fact, most tarballs will be
    compressed, and you can tell them by the ending tar.gz. That means that the archive
    was compressed using the gzip program. Extracting a compressed tarball is just
    as easy as extracting a straight archive; all you have to do is add the -z flag,
    which tells your system to use the gzip program to decompress the archive. For
    example, if you want to extract a compressed tarball called goosedown.tar.gz,
    type the following command, and press ENTER:


    ```

    tar -xzvf goosedown.tar.gz

    ```'
