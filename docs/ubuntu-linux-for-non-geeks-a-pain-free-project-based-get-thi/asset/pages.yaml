    click the drop-down menu button, which at this point says Movie Player, and select
    **Other**. When the Helper Application window appear, double-click **File System**
    in the left pane of window, navigate your way to /usr/bin in the root pane, and
    then scroll down until you find the file replay. When you find it, click it to
    select it, and then click **Open**. Once back in that original should-I-do window,
    check the box next to the words Do this automatically for files like this from
    now on. Your window will look like that in Figure 17-1. If so, click the **OK**
    button, after which RealPlayer will start and play the stream.


    ![](img/ba6b82a7869bba748202d57c97336dca_301_0.png)


    Figure 17-1: Telling Firefox what to do with the RealAudio document


    If you would like to view the video at an enlarged size, you have two ways of
    going around it. The first and easiest is to double-click the title bar of the
    RealPlayer window, which will maximize it. The second, easily way is to go to
    the **View** menu and select **Fullscreen** or **Zoom →** **Double Size**.


    # DVDs


    Your system also allows you to play DVDs; however, due to licensing concerns,
    playback is limited to unencrypted disks. Unfortunately, this rules out majority
    of the DVDs you buy or rent at your local video shop and leaves you with a limited
    choice of movies that you can play on your computer. Of course, DVDs created on
    personal computers (such as the DVD slideshow that people create these days with
    applications as iDVD


    Chapter 17'
  merge: -1
  pgno: 301
- img_proc: true
  md: 'on the Mac) pose no problem. Given the limited offerings in the unencrypted
    DVD world, you would no doubt want to enable your system to play back the encrypted
    variety, and, assuming you installed the two codec packages via Automatix back
    in Project 15A, you now can.


    # Can I Play Foreign DVDs?


    Your computer can play DVDs of any broadcast standard (NTSC, PAL, or SECAM) and
    any regional encoding. This is a better setup than DVD player you have hooked
    up to your TV, because the vast majority of alone DVD players in the United States
    (and I would want to venture guess that the size of that majority is 99.9 percent)
    do not allow you to play anything other Region 1 NTSC disks (NTSC being the broadcast
    standard in the United States and its televisions are designed to display, while
    the DVD region is 1). This information is usually provided on the back of DVD
    packages produced for the US market does not include it.


    ![](img/ba6b82a7869bba748202d57c97336dca_302_0.png)


    Figure 17-2: Examples of regional encoding labels on DVD packages


    Despite the universal everything-goes nature of your computer in DVD playback,
    there is a serious caveat to bear in mind. Depending on the manufacturer of your
    DVD drive, you will be able to switch back and forth between DVDs of differing
    regional encodings four or five times. the drive will be locked into the regional
    encoding of the disk you were playing at time ... forever. This is unrelated to
    your operating system—it is strictly a hardware matter. The only exception to
    this locking-rule are those DVDs labeled Region Free or ALL (sometimes inaccurately
    labeled as Region 0), which can be played on any DVD player in any region, and
    thus do not register a regional encoding when you pull one of them in your computer''s
    drive.


    If your drive eventually locks into one regional encoding, for which you have
    few DVDs, there is some good news. That comes in the form of Videolan''s libvdcss2,
    the library that bundles with the codec packages you installed in Project 15A,
    and which allows you to play back encrypted DVDs. In addition to primary function,
    it allows you to play back DVDs from multiple regions even if your drive is already
    locked into one region. It does thhis by performing a cryptic attack (to use Videolan''s
    term) on your drive until it finds the disk key for that. Of course, this process
    of cryptic bombardment can take several minutes, so it is not the optimal way
    to get around things. Better Whether or not this process of bypassing regional
    encodings is legal remains a subject of debate, so if you are concerned about
    such things, you should do a little research.'
