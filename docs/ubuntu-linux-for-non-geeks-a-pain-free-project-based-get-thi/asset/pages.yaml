  md: 'To perform the adjustments as instructed in the README file, just follow these
    steps:


    +   1. Find the Tk shell, called Wish, by typing locate wish in the Terminal window
    and pressing ENTER, and note the location given on a piece of paper. It should
    be /usr/bin/wish.


    +   2. Direct the Terminal to the brisca folder by typing cd briscola and pressing
    ENTER.


    +   3. Use the Pico editor, which we used in Project 8A on page 140, to edit the
    briscola.tk file by typing pico briscola.tk and pressing ENTER. The briscola.tk
    file will appear in the Pico editor in your Terminal.


    +   4. Change the first line of the briscola.tk file from #!/usr/local/wish


    +   5. In the second line, change /usr/local/games/briscola to /usr/share/games/briscola,
    which is where you will place briscola in just a bit.


    +   6. Press CTRL on your keyboard.


    +   7. Type Y, and press ENTER to save your changes.


    +   8. Type cd, and press ENTER to return the Terminal to your home folder.


    # 8C-4: Moving the Briscola Folder to a Global Location


    We could move the briscola folder to the LocalApps folder and play it there, as
    we did with PyGames, but this time it''s differently by moving the whole thing
    to global territory. This not only keeps it safe from our obsessive housekeeping
    tendencies, but also allows all users on the same computer to play the game. We
    will need to use the command so that we can have write access in those protected
    folders.


    To do this, type the following command in the Terminal window,


    ```

    sudo mv briscola /usr/share/games

    ```


    When you are prompted for your password, type it, and press ENTER.


    # 8C-5: Creating a Launchable Link for Briscola


    Even though we''ve moved briscola to a global location, we still can''t run it
    with a simple one-word command because briscola.tk file itself is not in the system''s
    command search path. As we did for PyGames, we will create a launchable link for
    briscola to solve that problem. Here are the steps:


    +   1. In the Terminal, type cd /usr/share/games, and press ENTER.


    +   2. Now create the link by typing sudo ln -s /usr/share/games/briscola.tk briscola,
    and press ENTER.


    +   3. Type cd, and press ENTER to return the Terminal to your home folder.


    You can easily run briscola by typing briscola in the Terminal and pressing ENTER.'
