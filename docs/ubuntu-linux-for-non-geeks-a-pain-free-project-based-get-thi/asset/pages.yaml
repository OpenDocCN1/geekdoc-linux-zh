  md: '# Meet the Terminal


    The Linux Command Terminal in your Ubuntu system can be run by going to the Applications
    menu and selecting Accessories > Terminal. When the Terminal opens, it will, in
    all its simplicity, look like Figure 8-2.


    ![](img/ba6b82a7869bba748202d57c97336dca_146_0.png)


    Figure 8-2: The Terminal application


    As you can see, all it says is rg@UbuntuAcer:~. In this case, rg is username,
    UbuntuAcer is the name I gave my computer during installation, and the tilde (~)
    signifies that I am in my folder. If it were to say ~/Music, for example, it would
    mean that I am currently in the Music folder within my home folder. Of course,
    all this will be different in your case, as your username and computer name will
    be different. If your username and computer''s name is wetrock, for example, the
    command line will say frogwetrock:~ If all this is sounding rather obtuse to you,
    just think of it this way: username@computer_name:~ in the Terminal is the equivalent
    of your home folder in Nautilus


    Typing in the Terminal is straightforward enough; just type as you usually do.
    You can also delete and insert letters or phrases by using the DELETE and BACKSPACE
    keys and the cursor keys. For practice, try the following:


    +   1. Type I like strawberries so very much.


    +   2. Change strawberries to cherries (because cherries are, in fact, so much
    better). Use your left cursor key to move the cursor in front of the first s in
    strawberries.


    +   3. Tap the DELETE key as many times as necessary to erase the word strawberries
    (uh, that would be 12 times, methinks).


    +   4. Just type cherries, and then use your right cursor key to move the cursor
    back to the end of this meaningful sentence.


    Now you''ve completed this fascinating bit of typing, press the ENTER key. As
    you will immediately see, the Terminal''s response to your efforts far is merely
    a dismissive bash: command not found. Although you''ve typed a string of text
    that has meaning to you, it means absolutely nothing to your system. In fact,
    the system was so shortsighted'
  merge: -1
  pgno: 146
- img_proc: true
  md: 'that it could see nothing than the first word you typed in the Terminal (I);
    and because I is not a valid command, the system had no idea what to do with it.


    # Shells


    You may be wondering what this bash business is all about and why it is talking
    to you. Well, Bash (Bourne Again Shell) is one of the shells that are used in
    Linux systems, and it''s the one that happens to come with your Ubuntu distro
    (and most others, for that matter). Bash is a program that interprets the commands
    you type into the Terminal and delivers them, to speak, to your system so that
    it can act upon them. I like to think of it as a command-handling subsystem, for
    which the Terminal acts as a graphical front end. Some scripting languages, as
    you will find out in Project 8C on page 146, also have their own shells; but those
    few exceptions, you generally need not be unduly concerned with shells other than
    to know what are and what people are talking about referring to them.


    # Some Goofy, Yet Useful, Fun with the Command Terminal


    A rather cool thing about typing in the command Terminal is that it has what you
    might call short-term memory. Try it out by typing cherry and pressing ENTER.
    Ignoring the command-not-found message, go on and type vanilla, and press ENTER.
    Now type cream, and press ENTER. So, right? Well, not really. Let''s type everything
    we''ve typed so far again, but this time let''s do it with only one.


    Huh?


    Yes, press the up cursor key once, and what do you see? That''s—the last command
    you type appears, and in this case it would be ice. Press the up cursor key again,
    and the command that you typed before that will appear—vanilla. One more time?
    Yes, cherry. And one more time for the grand finale — I like cherries so very
    much.


    Considering what we have done thus, this may all seem a bit silly, imagine that''re
    not typing goofy little words and instead have to deal with considerably longer
    strings, such as a simple command (which you''ll learn later in this chapter)
    like


    ```

    cp photos/mytics/stpierre/coastal/onthebeach1_27.jpg /home/frog/photos_for_mom/stpierre

    ```


    By typing that string, you are copying an image from the coastal folder to another
    folder called stpierre. If you want to copy another photo to the coastal folder,
    onbeach1_16, for instance, you could simply press the up arrow key once, using
    the left cursor key and DELETE key to move over and delete the 27, replace it
    with 16, and use the right arrow key to get back to the end of the command. All
    in all, it would be much simpler and much faster. It would also help you avoid
    mistakes in typing. Not so dumb anymore, eh?'
  merge: -1
  pgno: 147
