  md: '# Project 11A: Installing TrueType Fonts Locally


    ![](img/ba6b82a7869bba748202d57c97336dca_210_0.png)


    Figure 11-2: Previewing a double-the font icon


    How you install fonts depends on who is going to use them. If you have only one
    user account on your machine, the easiest way is to install the fonts locally.
    Locally installed fonts are ones that you or someone logged in to your user account
    will be able to use. On the other hand, if you have more than one user account
    and want the fonts to be available to all of the users on your machine, use the
    method described in Project 11B on page 193.


    # 11A-1: Getting the Fonts


    The Internet is free for fonts. In this project, I will point you to the www.fontfreak.com
    site, which has a very nice collection of fonts. Once you get to the FontFreak
    splash page, click ENTER SITE HERE, which will lead you to the main page. Then
    click the button on the left that says Fonts, which will bring you to the first
    page of fonts. You can browse through the various pages until you find some fonts
    to your liking. Which fonts you download is completely up to you, but be sure
    to choose the PC version of the font you want, not the Mac. Just click the Windows
    icon to the right of the font.


    Since you will also need fonts for Project 11B, you might as well download them
    now. In all in, for the two projects, you will need at least four fonts. When
    you''ve finished downloading, drag the font files to your home folder so it''s
    easy to follow along with my instructions. Also be sure to unzip your font files
    before going to the installation steps.


    # 11A-2: Installing the Fonts


    For this project, let''s use one of the fonts that you downloaded. After you''ve
    decided which font to use, follow these steps:


    +   1. Open a new Nautilus window by going to the Places menu in the GNOME Panel
    and selecting Home Folder. Once you''ve done that, open another Nautilus window
    by doing the same thing.'
  merge: -1
  pgno: 210
- img_proc: true
  md: '+   2. In one of the Nautilus windows, go to the Go menu, and select Location.
    A Location input box will then appear below the button bar in that window. You
    can also achieve the same result by pressing CTRL-L.


    +   3. In Location box, type fonts://, and press ENTER. Once you''ve done this,
    the window will be filled with the many icons representing the fonts you have
    already installed locally on your system. While you''re there, it wouldn''t be
    a bad idea to bookmark this window for future use.


    +   4. From the other open Nautilus window (your home folder window), select the
    unfzipped font you want to install, and drag it to the fonts:// window.


    You will notice that when you dragged your new font from your home folder to the
    fonts:// window, the icon for your new font did not immediately appear. In fact,
    it will seem as if nothing happened and your installation attempt was a bust.
    Well, despite this lack of acknowledgment, things were happening. The first time
    you install a font in this way, your system automatically creates a hidden .fonts
    folder in your home folder and places it there. If you don''t like this of immediate
    feedback, you can check your fonts by typing ~/.fonts in the Location box of one
    of the Nautilus windows. This will show you what fonts you have installed locally–at
    this point will be only one.


    Now that you have installed your font, you can use it in one of your applications,
    such as OpenOffice.org Writer. (Any running applications need to be restarted
    before the new font will appear in your application''s font menu.)


    # 11A-3: An Alternative Approach to Installing Fonts Locally


    If you prefer truly immediate feedback on your installation process, you can try
    the following variation of the installation process, which yields the same results
    as in Project 11A-2 on page 191. However, because this installation method uses
    the .fonts folder that is created in step 4 of Project 11A-2, you must either
    go through the process in Project 11A-2, or first create the folder yourself prior
    to trying this installation method, or opening a Terminal window (Applications
    ► Accessories ► Terminal), typing mkdir ~/.fonts in that window, and pressing
    ENTER. Now that you''ve got your .fonts folder, let''s use two more of the fonts
    you downloaded to try out the steps:


    +   1. Assuming you have already closed the two windows from Project 11A-2, open
    two new Nautilus windows.


    +   2. In one of the Nautilus folders, type "~/fonts, and press ENTER. The main
    pane of Nautilus window will show only one font or, if you bypassed Project 11A-2
    and created the .fonts folder yourself, nothing at all. It would definitely be
    useful to bookmark this location while you''re there.'
  merge: -1
  pgno: 211
- img_proc: true
  md: '+   3. In the open Nautilus window, which is your home folder window, highlight
    both of the fonts you want to install by holding down the CTRL key and clicking
    the icon for each font. Release the CTRL key, right-click either of the highlighted
    fonts, and select Copy Files in the popup menu.


    +   4. In the .fonts window, right-click on any open space in the window, and
    select Paste Files from the popup menu. The fonts will appear in the Nautilus
    window.


    Of course, you can drag the fonts from your home folder to the .fonts folder instead
    of going through the procedure in steps 3 and 4. It''s strictly to you. Either
    way, the procedure outlined in Project 11A-3 yields exactly the same results as
    in Project 11A-2. The only difference is that you will immediately see that your
    fonts have been copied to the .fonts folder. Which method you choose in the future
    is, therefore, strictly a matter of personal preference.


    # 11A-4: Uninstalling Locally Installed Fonts


    Whether you use the method outlined in Project 11A-2 or Project 11A-3, you can
    uninstall any fonts installed locally by opening the fonts folder in your home
    folder and then dragging the fonts you want to remove to the Trash.


    # Project 11B: Installing TrueType Fonts Globally


    As I mentioned, the fonts you have installed so far can only be used by when you
    log in your usual username. If, however want to install fonts that can be used
    by you and anyone else who has an account on your computer, the process is slightly
    different. We''ll use one of the fonts you downloaded for this part of the project.


    # 11B-1: Installing Individual Fonts Globally


    The font folder for globally installed fonts is in root territory, so you will
    need to put the sudo command to use in install fonts in this way. Here are the
    steps:


    +   1. Open a Terminal window, and create a new folder for your fonts within the
    global location (let''s call it MyFonts) by typing mkdir /usr/share/truetype/MyFonts
    and pressing ENTER.


    +   2. Type your password when prompted to do so, and press ENTER.


    +   3. Copy the font you want to install to your newly created global folder by
    typing sudo cp fontname.ttf /usr/share/truetype/MyFonts and pressing ENTER. Be
    sure to include spaces on both sides of cp and after .ttf.'
  merge: -1
  pgno: 212
- img_proc: true
  md: 'Be sure to include spaces on both sides of font.ttf. Also, be sure to use the
    name of your font in place of the word font. For example, if your font is called
    arachanid, you would type sudo cp arachanid.ttf /usr/share/fonts/truetype/MyFonts.


    You shouldn''t have to enter your password after step 3 since you provided it
    in step 2, so the process is now complete. That being the case, go ahead and test
    things out by opening OpenOffice.org and looking for the font in the menu. Remember
    that you will need to restart OpenOffice.org if it was already open when you installed
    the font.


    # 11B-2: Installing Multiple Fonts Globally


    If you want to install several fonts globally at the same time, you can do so
    easily. The process is essentially the same as Project 11B-1 on page 193, with
    a slight variation. Here''s what you''ve got to do:


    +   1. Create a new subfolder in your home folder window. You can call it anything,
    but I''ll be using the name fonts2go in this project.

    2. Unzip the fonts and then place the ones you want to install via this method
    into the new fonts2go folder.

    3. Open a Terminal window, and copy all the fonts in your fonts2go folder to your
    new global folder by typing sudo cp fonts2go*.ttf /usr/share/fonts/truetype/MyFonts
    and pressing ENTER. Note the spaces surrounding and after *.ttf.

    4. Type your password if prompted to do, and press ENTER.


    > In step 3, you did not need to type the names of the fonts, as the wildcard
    character (*) was essentially telling your system to copy all files ending in
    .ttf within the fonts2go folder.


    Now that you are done, check your results in OpenOffice.org. You should also back
    up the font files in the fonts2go folder to CD or floppy (just in case you need
    to install them on another system) and then trash the files. Keep the folder,
    so that you can use it again in the future.


    # 11B-3: Uninstalling Globally Installed Fonts


    If you want to remove any fonts that you installed using either of the global
    installation methods introduced in this project, you can do so in the following
    manner:


    +   1. Open a Terminal window, type sudo rm /usr/share/fonts/truetype/Myfont.ttf.
    Be sure to replace fontname with the name of the font you are installing.

    2. Type your password, and press ENTER when prompted to do so.'
  merge: -1
  pgno: 213
- img_proc: true
  md: '# Project 11C: Installing Microsoft Windows Core Fonts via Synaptic


    It or not, the computing world is still pretty much a Microsoft world, and that
    means the vast majority of users, even Mac users, are using Microsoft core fonts.
    That being the case, it is inevitable that you will have to deal with documents
    using fonts such as Georgia, Verdana, New Roman, and Courier, to name a few. Of
    course, your system can substitute the fonts it has for used in the document,
    but in order for you to see things as you intended and to allow others to see
    your documents the way you intended (web pages are good examples), it will probably
    behoove you to install Microsoft core fonts on your own system.


    Fortunately for you, there are two ways to get these fonts. One is to download
    and install them via Synaptic, the other, for those of you with a dual-boot setup,
    is to simply copy them from your Windows partition. In this project, I will explain
    how to perform the first of these procedures, so if you''re a Windows-less Ubuntu
    user (or a dual-booter who has the Synaptic approach) here''s what you need to
    do:


    +   1. Run the'' Package Manager (System ► Administration), and provide your username
    when prompted.

    2. Click the Search button. In the Search window that appears, type mstcorefonts,
    and then click the Search button in that window.

    3. The mstcorefonts package should now appear in the list pane of the main Synaptic
    window, so click on the package name, select Mark for installation in the popup
    menu, and then follow the standard procedures learned in Chapter 5 for installing
    a package via Synaptic.


    When the process is complete, your new Microsoft fonts will have been successfully
    installed and ready for immediate use by every user account on your machine.


    # Project 11D: Installing Microsoft Core Fonts from Your Windows Partition (for
    Dual-Booters)


    If you''re a dual-booter with Windows installed on another partition of your hard
    disk, you can take advantage of the fonts you already have on your Windows partition.
    This can be as easy as what you did in Projects 11A and 11B or more difficult,
    depending on whether or not you installed the Automatis read/write NTFS and FAT32
    Mounter in Chapter 9. If you did install it, your Windows partition should already
    be mounted and you can just scout right down to Project 11D-3.


    If you did not install the Automatis M, you can either go back and do so, or you
    can mount your Windows partition manually. If you are going to go this more cumbersome
    manual route, continue on to 11D-1.'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# 11D-1: Finding Your Windows Partition


    Before you can mount your Windows partition, you need to find out where it is,
    and what filesystem it is formatted, either File Allocation Table (FAT) or New
    Technology File System (NTFS). As is common in Linux, there are a couple of ways
    to do this. If you are a command lover, you can check out by opening a Terminal
    window, typing sudo fdisk -l (that''s the lowercase L, not a numeral J), and then
    pressing ENTER. You will be prompted for your password, so type it, and press
    ENTER. A list of partitions on your hard disk will appear (Figure 11-3).


    ![](img/ba6b82a7869bba748202d57c97336dca_215_0.png)


    Figure 11-3: Finding your Windows partition in the fdisk table


    Take a look at this seemingly incomprehensible list, and then find the location
    and format of the Windows partition on your hard disk by scanning the column for
    the first entry with the hard disk FAT32 or NTFS. In most cases, this will be
    the first partition, /dev/hda1, but in the list for your hard disk, shown in Figure
    11-3, the first partition is taken up by some diagnostic utility that the manufacturer''s
    Windows install disk had on it. If you''re using a computer from a brand-name
    manufacturer, you might find yourself in a similar situation.


    Once you''ve found the FAT32 or NTFS partition, jot down the filesystem type,
    and then do the same for its location at the left far of the list. In my case,
    that would be /dev/hda2 and FAT32.


    # 11D-2: Mounting Your Windows Partition


    Armed with the information you gathered, you can now mount your Windows partition
    by doing the following:


    +   1. Create a mount point for your Windows partition by opening a Terminal window,
    typing sudo mkdir /media/windows, and pressing ENTER. You are need to perform
    this step the first time you try to mount your partition. After that, need only
    perform steps 2 and 3.'
  merge: -1
  pgno: 215
- img_proc: true
  md: '2. What do you do in this step depends on whether your Windows partition is
    FAT32 or NTFS formatted. Choose the appropriate step, being sure to substitute
    /hda2 for /hda1 if that is what your Windows partition happens to be.


    If your Windows partition is in FAT32 format, type


    ```

    sudo /dev/hda1 /media/windows/ -t vfat -o charset=utf8,umask=000

    ```


    If it is in NTFS format, type


    ```

    sudo /dev/hda1 /media/windows/ -t ntfs -o nls=utf8,umask=0222

    ```


    3. Once you''ve typed the appropriate entry, press ENTER. If asked for your password,
    type it, and press ENTER. The Windows partition will then be mounted. You can
    double-check by opening a Nautilus window and clicking the Computer button. You
    should then find a hard disk icon with the word windows beneath it. You can even
    double-click that icon to access the files you have, but you cannot save to the
    partition if it is in NTFS format (a good reason for installing the Automatix
    Munter that it allows you to do so).


    # 11D-3: Installing Fonts from Your Windows Partition


    Now that your Windows partition is mounted, you can copy the fonts you have and
    install them for use within Linux. To start, go back to the Terminal, type cd
    press the space, and then type the path to your Windows folder. Most likely, the
    path to your folder will be /mnt/windows/WINDOWS/Fonts, but it might be slightly
    different (/mnt/windows/Fonts, for example) depending on the version of Windows
    you are using. Once you''ve typed that you need to type, press ENTER.


    Depending on whether you want to install your Windows fonts locally or globally,
    the next steps will be different.


    # Installing Windows Fonts Locally


    To install your fonts you want to install to your .fonts folder by typing cp fontname.ttf
    /fonts/ in the still open Terminal window and pressing ENTER. Be sure to replace
    fontname with the name of the font you want to.


    If you want to go wild and copy all the fonts in your Windows directory (that''s
    a lot of fonts, mind you!), you can type *.ttf instead of fontname.ttf. Be sure
    that there is a space between cp and fontname.ttf and /fonts/. Once you''re done,


    # Installing Windows Fonts Globally


    To install your fonts so that all users on your machine can use them, just return
    to the still open Terminal window. Copy the font you want to the personal system
    font folder created in step 1 of Project 11B-1 on page 193 (and if you didn''t
    perform that step then, so now) by typing'
  merge: -1
  pgno: 216
- img_proc: true
  md: 'sudo fontname.ttf /usr/share/fonts/truetype/MyFonts. If you want to copy and
    install all of the fonts in your Windows font directory, you can do so by typing
    sudo cp *.ttf /usr/share/fonts/truetype/MyFonts instead. After typing either of
    those strings, press ENTER, which you will probably be prompted for your password,
    so type it, and press ENTER again. The job will then be done.


    # Unmounting Your Windows Partition


    If you mounted your Windows partition manually, you can unmount it immediately
    after finishing your work with it, or can just wait until you shut down your system,
    upon which it will be automatically unmounted. Before you unmount it, you must
    first be certain you''re not accessing the directory, either from the Terminal
    window or of Nautilus. So, before issuing the unmount command, close any Nautilus
    windows open to that partition or, if you are using the Terminal, type cd to change
    back to your home directory. Type sudo ummount /media/windows (that''s u-mount,
    not un-mount), and press ENTER.


    # Customizing Your System Fonts


    Now you know how to get and install fonts, you might be itching to use some of
    them to further customize your system. To get started doing this, just select
    Preferences > Font in the System menu, which will bring up your Preferences window,
    shown in Figure 11-4.


    ![](img/ba6b82a7869bba748202d57c97336dca_217_0.png)


    Figure 11-4: Setting system font preferences


    As you can see, you can specify font preferences in five categories: applications,
    documents, desktop, window titles, and the Terminal (fixed width font).'
  merge: -1
  pgno: 217
- img_proc: true
  md: 'The choices you make effect immediately, so you will soon know whether or not
    you can live with them. Unlike the other aspects of customization, those could
    drive you starving mad. Sure, it is easy to live with the gaudiest desktop imaginable,
    the wildest and most mismatched color scheme on the planet, and the goofiest icons
    ever to be seen by post-Neanderthal man, but if your font selections get too out
    of hand, watch out! You do have to be able to read the results, after all.


    # Making Things Look Better


    The fonts you see on your screen generally look quite smooth and clean. If you
    are using an LCD monitor, however, you may find that fonts look even better if
    you use Subpixel smoothing (LCDs) in the Font Preferences window. If you are not
    sure whether you need to do this, just give it a try, and if you see any difference.
    GNOME applies changes immediately upon selection, so if you keep a window with
    it open before preferences window, you can easily see the effect of each of your
    selections you make.


    # Creating Your Own Fonts with FontForge


    After all this font talk, it seems only appropriate that I end this chapter by
    giving you the means to create your own (or at least modify someone''s). FontForge
    (previously known as PEdit) allows you to create or modify TrueType, PostScript,
    and bitmap fonts (see Figure 11-5). The interface itself seems a bit dated, but
    don''t let that fool you; FontForge is quite capable and easy to use.


    ![](img/ba6b82a7869bba748202d57c97336dca_218_0.png)


    Figure 11-5: Using FontForge to create and modify fonts


    Font Feathered Frenzy 199'
