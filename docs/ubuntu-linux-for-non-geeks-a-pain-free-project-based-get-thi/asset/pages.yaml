  md: 'window, where you should first click the General tab and give your theme a
    name. Once you''ve done that, click the Files tab, and then the Find Files button,
    which will bring up a Select Path window. From there you can navigate to the folder
    in which you are storing your clip art, photos, or other graphics. Once you have
    found the folder, click the Select button, after which a list of all the files
    in that folder will appear in New Theme properties.



    You can easily add images to your new Gallery by clicking the name of each image
    you wish to add (you might want to make sure the box next to the word Preview
    is checked to make things a bit easier), and then clicking the Add button. Once
