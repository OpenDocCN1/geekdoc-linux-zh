  md: 'Linux world, but in the Mac and Windows worlds as well. It allows you to cut
    and paste bits of sound, raise pitch, increase speed, add echo and other effects,
    and . . . well, all sorts of neat stuff. To get it, run Automatik, click Media
    Players and Editors in the left pane, and then check the box next to Audacity
    in the right pane. After that, click the Start button. Audacity will then be available
    from Applications Sound.


    ![](img/ba6b82a7869bba748202d57c97336dca_284_0.png)


    Figure 15-19: Creating music with LMMS


    ![](img/ba6b82a7869bba748202d57c97336dca_284_1.png)


