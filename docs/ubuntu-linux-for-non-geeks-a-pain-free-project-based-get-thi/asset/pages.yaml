  md: '# Nontoxic Commands


    As you now know, all of this typing is easy enough, but in order to do something
    useful with your Terminal, you need to type commands—and there are more of them
    than you could ever hope or need to know. To get you started, we will begin with
    some commands that are easy to understand, nontoxic, and completely kitten-friendly.


    # $ whoami


    There is no command as easy, safe, or even seemingly useless, as whoami. Rather
    than help those with multiple-personality disorders discover who they are at any
    given moment, the whoami command simply tells you which user is currently logged
    in. Try it out by typing whoami and then pressing the ENTER key. Remember that
    commands are sensitive, so type accordingly.


    The Terminal will now tell you the username of the person currently logged in.
    If you are logged in as frog, you should get frog as the answer to your


    # $ finger


    If you enjoyed discovering who you are with the whoami command, then you might
    enjoy finding out more about yourself using the finger command. The finger command
    can be used in several ways, but very simple one is finding out about a particular
    user. Try this out by typing finger and your username. In my case, that would
    be finger rg. Once you''ve typed the command, press ENTER and see what you get.
    You can see your results in 8-3.


    ![](img/ba6b82a7869bba748202d57c97336dca_148_0.png)


    Figure 8-3: Output from the finger command


    As you can see, my login name is rg, my real name is Rickford Grant, my home directory
    is /home/rg, I am using the bash shell for typing commands, I have been logged
    on since Sun Apr 1 at 18:44 EDT, and I have no mail or plan. It doesn''t tell
    you my social security number or my mother''s maiden name, but it is pretty cool,
    don''t you?


    I mentioned that the results had no plan, and you may be wondering what that is
    all about, I''ll fill you in. A .plan file is a small file kept in your home folder
    that other users see when they use the finger'
  merge: -1
  pgno: 148
- img_proc: true
  md: 'command on. Traditionally, a .plan file contained information about where you
    were going to be or what you were working on. These days, however, most people
    use them to leave little messages, quotations, or whatever, as they do in email
    signatures. Take a look at Figure 8-4 to see what happens after I add a .plan
    file to my home folder.


    ![](img/ba6b82a7869bba748202d57c97336dca_149_0.png)


    Figure 8-4: Output from the finger command with a plan


    You can now see my plan, which is a quotation from Kurt Vonnegut The Sirens of
    Titan (or Al Stewart''s song by the same name, for matter), though you can put
    anything in your own. You will get the chance to create your plan file in Project
