    # Copying Files from your iPod to your Hard Disk with gtkpod


    Like Rhymbox, gtkpod can copy tracks from your iPod to your hard disk. To do this,
    select the tracks or playlists you want to export (hold down the CTRL to make
    multiple selections, or use the tabs to select all of the tracks by a particular
    artist or in a particular genre). Then click the **File** menu, **Export Tracks
    from Database**, and choose one of the destinations from the sub:: *Selected Playlist,
    Selected Entry, or Selected Tracks.


    As with Rhymbox, AAC files exported from gtkpod will not have the filenames they
    started out with. The remedy is as same before: Just change the filenames manually.
    The correct track title and artist information will appear in any player window,
    whether or not you change the filename.'
