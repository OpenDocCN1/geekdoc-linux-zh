    All fantastic!


    # Spelling Out—Typing File Paths in Nautilus


    If you prefer to clicking, you will be happy to know that you can navigate to
    a folder by typing its path. Just go to the Go menu, and select Location, or keyboard
    shortcut lovers can just press CTRL-L. A search box will appear in the location
    bar (Figure 6-5), in which you can type the path to your target folder, and then
    press ENTER. In the case of my example, that path would be: `/home/rg/NordicStuff/SwedeStuff/Dalarna/gooseberries`


    ![](img/ba6b82a7869bba748202d57c97336dca_103_1.png)


    Figure 6-5: Typing the path to your target folder


    # Bookmarks Within Nautilus


    With all this clicking away to buried subfolders, it is worth mentioning another
    very handy feature of Nautilus: bookmarks. Yes, Nautilus lets you bookmark folders
    to which you have navigated. While you have no doubt familiar with creating bookmarks
    for web pages that you frequent, you may be wondering why on earth you would want
    to create bookmarks within your filesystem.'
  merge: -1
  pgno: 103
- img_proc: true
  md: 'Well, imagine that you have a folder that you need to use often, but it is
    even more buried than my gooseberries folder in the previous section. Getting
    there would take an excessive number of mouse clicks, and all that clicking is
    bound to eventually give you a bad case of carpal tunnel syndrome. While that
    is great for your HMO, it is most decidedly not good for you. Instead of imagining,
    you could click your way to that folder once and then, in the Bookmarks menu of
    the Nautilus window, select Add Bookmark. After that, whenever you want to get
    back to that folder, you can just click the Bookmarks menu, and the folder will
    be right there waiting for you in the drop-down list.


    Another handy thing about Nautilus bookmarks is that they also appear in Save
    As dialog boxes, such as when you save an OpenOffice.document or download a file
    via Firefox. In any Save As dialog box, just click the Save in button, and you
    will find your bookmarks.


    # Understanding the Linux Filesystem


    With all that pathing, navigating, and bookmarking you''ve just been learning,
    you should properly be able to figure out how to get from here to your home folder.
    Still, it is probably a good idea to know where your home folder actually in the
    scheme of things, just if you manage to get yourself really lost somewhere. To
    understand this, you should have a basic understanding of the Linux filesystem,
    as you will find, is it a bit different from what you were accustomed to in your
    previous operating system.


    Unlike Windows, the Linux filesystem all stems from a single point called root
    and is represented by a solitary slash (/). Your own owner account is located
    as /home, or to put it into words, the home folder within root. If your user account
    were to have the same name as mine, root, the path to that folder would be /home,
    or the rg folder within home root. Whatever the name of your user account or the
    names of any other accounts you have on your machine happen to be, just remember
    that when you are lost, folder, and for all the other folders with user accounts
    on your machine, are located within the home folder. If you''re a more graphically
    oriented person, map in Figure-6 should help you out.


    # What''s in All Those Other Folders?


    Needless to say, there is more to the Linux filesystem than the root, home, and
    user account folders. There are several other directories at the same level as
    home, though for the most part, you shouldn''t be merely bucking around with them
    unless you know what you''re doing. Fortunately, most of these folders are write
    protected, so you should be fairly protected from yourself. Still, it is natural
    to be curious about what those other folders are there for, since . . . well,
    they''re there. So, to satisfy your curiosity a bit, I''ll do a little explaining.'
