    # Setting Album Art and Editing Tags with gtkpod


    Tag editing, including album cover images, is another area in which gtkpod can
    prove quite useful. To edit it, click any track in the playlist and select **Edit
    Track Details**: The window for that track will appear (Figure 16-5). In that
    window you can edit all of the tag entries (artist, album, track title, genre,
