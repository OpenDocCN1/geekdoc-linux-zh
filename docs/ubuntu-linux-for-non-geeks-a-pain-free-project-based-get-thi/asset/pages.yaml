    +   4. Run the script that will download and set up Internet Explorer for you
    by typing ./ies4linux and pressing ENTER.


    +   5. Ies 4 Linux will download and install Internet Explorer 6, but it will
    first ask you if you want to download Internet Explorer 5.5 and Internet Explorer
    5.0. Assuming you don''t want these, just press ENTER when asked. (Type y and
    press ENTER if you do want them.)


    +   6. When asked what version of Internet Explorer you want, press ENTER for
    English, or type the two-letter code of the language you want, and then press
    ENTER.


    +   7. You will be asked if you want Ies 4 Linux to install the Flash 9 plugin
    and create a Desktop shortcut for you. You should want this, just press ENTER.
    (Type n and press ENTER if you don''t want it.)


    After that, Ies 4 Linux will begin downloading, installing, and setting up Internet
    Explorer. When it is done, you will find an Internet Explorer launcher on your
    desktop, which you can then double-click to start your own-run version of Internet
    Explorer 6 (shown in Figure 9-15).


    ![](img/ba6b82a7869bba748202d57c97336dca_192_0.png)


