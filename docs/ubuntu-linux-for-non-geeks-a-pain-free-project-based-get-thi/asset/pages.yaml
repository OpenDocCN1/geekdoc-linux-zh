    # 8B-6: Creating a Launchable Link for pyWings


    The method of running pyWings that you''ve just used well enough, but it is a
    pain in the posterior to open your Terminal and that some length every time you
    want to find out what fate has in store for you. Let''s find a way to make things
    easier in the future.


    To run an application from the Terminal, or to put it more precisely, the name
    of that program''s executable file; the name acts as a sort of command. In order
    for your system to recognize that command, the command (the executable file, or
    a link to it) must be in a location where the system can find it. Whenever you
    run a command of any sort, your series of locations (most of which are bin folders,
    where executable files are located) to find that command.'
  merge: -1
