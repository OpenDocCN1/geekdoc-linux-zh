- img_proc: true
  md: 'To give you an example of how convenient using styles can be, imagine that
    you are typing a bibliography page for some document you''ve prepared. You typed
    each entry as you might any paragraph, as in:


    Smythe, W. (2004). Reconsidering the need for speech between non-human interlocutors
    beyond the age of seven. The Journal of the Elves, Faeries, and Garden Gnomes,
    20 (2), 125-147.


    Like most paragraphs you type, the entry is formatted except for the fact that
    you want a hanging indent, which is fine and dandy the norm for bibliography entries.
    Rather than messing around with tabs or margins to get things the way you want,
    all you have to do is click your mouse anywhere within the paragraph, and then
    double-click the Hanging Indent entry in the Styles and Formatting window. After
    that, as by magic (though you know better), the transformation is:


    Smythe, W. (2004). Reconsidering the need for speech between non-human interlocutors
    beyond the age of seven. The Journal of the Elves, Faeries, and Garden Gnomes,
    20 (2), 125-147.


    You could follow the procedure for any of your other entries, or, with Hanging
    Indent selected, click the paint button in the Styles and Formatting window, after
    which your cursor, when placed over the document, will appear as a paint can.
    Place that paint-cansor in any other paragraph in your bibliography, and that
    entry, too, will be formatted in the new style. The process is essentially the
    same when applying different styles to any other document elements.


    # Processing Done Lightly with AbiWord


    OpenOffice''s Writer is a bit more powerful than what you need for your everyday
    word processing chores, and you would prefer something that pops up as soon as
    you click the launcher, then you might want to consider giving another word processor,
    AbiWord, a try (Figure 13-8).


    AbiWord has a very straightforward and easy-to-use interface, which you should
    be able to figure out without much, if any. It also has a couple of rather interesting
    features, such as its auto-resize function, which magnifies the onscreen document
    size (fonts, images, and everything) or shrinks as you increase or decrease the
    size of the program window. And if you''re wondering, AbiWord can save and read
    Word DOC files and save as PDF files.


    You can easily install AbiWord via Synaptic by performing a search for abiword,
    and then ... well, you know the drill by now. Once you have AbiWord installed,
    you can run it by going to the Applications menu and selecting Office ⁒ AbiWord
    Word Processor.'
  merge: -1
