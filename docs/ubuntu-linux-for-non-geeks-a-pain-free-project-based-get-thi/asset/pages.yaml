  md: '# Going in for Dip


    To get a taste of Ubuntu is all about (and to check out your hardware to see if
    it''s all comfy-cozy with Ubuntu), there is probably no better way to go than
    Ubuntu directly from the live CD. To do this, just place the Ubuntu Desktop CD
    in your disk drive and restart your machine. When the machine starts up again,
    it should boot up from the CD, and after a bit of white text scrolls the screen,
    you will see the first Ubuntu startup screen (Figure 2-1). If the screen does
    not appear, and your machine instead boots up into your usual operating system,
    then it is very likely that your machine''s BIOS needs to be changed so as to
    allow you to boot from CD.


    ![](img/ba6b82a7869bba748202d57c97336dca_41_0.png)


    **Figure 2-1:** An Ubuntu live session startup screen


    You can access your machine''s BIOS by restarting and then pressing whatever key
    the onscreen instructions assign to accessing the BIOS. This is using DELETE or
    F1, but not all machines are the same. The onscreen information passes so fast
    that you miss it, you can check your user''s manual to see what the correct key
    is. Once you get into the BIOS setup, change the boot sequence so that your CD
    drive is first.


    Once your machine does boot from the live CD, and you see the Ubuntu live session
    startup screen shown in Figure 2-1, either press ENTER or just do nothing for
    about 30 seconds in order to continue. This will start up your Ubuntu in English
    with a US keyboard layout. Remember, your hard disk will go untouched, so rest
    easy—you''re not going to touch it, let alone hurt,


    If you would like your system to appear in a different language, press F2, select
    your language of choice using the cursor keys, and press ENTER. You can change
    the default keyboard layout by pressing F3 and then following the same steps.
    Once you''re done, press ENTER to start up the system.'
