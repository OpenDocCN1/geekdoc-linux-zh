  md: '# Project 7E: Changing Your Splash Screen


    Well, now you''ve changed just about all there is to change system-wise, but there
    is actually one more item that you can tinker with—your splash screen. In case
    you''re not familiar with the term splash screen, it''s the screen that appears
    when GNOME is starting up right after you log in before you get to your desktop.
    The default screen, shown in Figure 7-18, is pleasant enough, but you can choose
    something a bit wilder or at most colorful if you are so inclined.


    ![](img/ba6b82a7869bba748202d57c97336dca_139_0.png)


    Figure 7-18: The default Ubuntu splash screen


    # 7E-1: Enabling Automatic Login


    While the Login Window Preferences is open, it''s as good as a time to mention
    to an option that may be of interest to you. If you find it bit of a drag to type
    your username and password every time start up your machine, you''ll be happy
    to know that you can bypass the whole login process. If you share your machine
    with other users, of course, this isn''t something you''d want to do because anybody
    with access to your machine would have access to your user account. I wouldn''t
    recommend doing this on a laptop, since they are more easily lost or stolen, leaving
    your data at risk to absolute strangers.


    To enable automatic login, click the Security tab in the Login Window Preferences,
    and then click the checkbox at the top of the page next to the Enable Automatic
    Login. After that, click the arrow on the right side of the drop-down menu next
    to the User, and select your username from the list. Once you''re done, click
    the Close button. The next time start up your machine, you will bypass the login
    screen and be delivered directly to the desktop.


    # 7E-2: Installing New Splash Screens


    Ubuntu does not come with alternative splash screens for you to play with, in
    order to make changes, you first need to download and install some splash screens
    with which to work. This can be done easily by opening Art Manager (System ▸ Preferences
    ▸ Art Manager) and following these steps:


