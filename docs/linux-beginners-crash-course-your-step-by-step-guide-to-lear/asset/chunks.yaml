  trans: '


    大多数时候，我们倾向于将命令行留给需要执行大规模批处理任务或需要执行特定操作的任务。以下是你作为 Linux 初学者必须掌握的一些命令。


    ## 入门


    一旦连接到你的 Linux 操作系统，你将看到如下提示：


    `login:`


    输入用户 ID 并按 `ENTER`。记住用户名和密码是区分大小写的。


    在提示时输入你的密码并按回车。


    如果成功，Linux 系统上将显示一个命令提示符（`$` 提示符），你可以在此处输入命令。让我们熟悉一些常用命令。


    ### 基础命令


    要查看日历，你需要如下所示输入 `cal` 命令：


    ```

    $ cal

    $

    ```


    要更改密码：


    系统会要求修改密码，以确保你的数据和文件免受外部入侵的侵害。更改密码的步骤涉及以下程序：


    1. 在命令提示符下输入 `passwd`。

    2. 输入当前密码并按 `ENTER`。

    3. 分配你想使用的新密码。确保它既好记又具有复杂性，以防被猜到。你需要再次输入它进行验证。


    ```

    $ passwd

    Changing password for user1

    (current) Linux password:******

    New LINUX password:*******

    Retype new LINUX password:*******

    passwd: all authentication tokens updated successfully

    $

    ```


    我使用星号（`*`）来显示插入当前密码和新密码的位置。如果反过来操作，系统在输入时不会显示字符。


    ## 文件系统导航


    Linux 系统中的数据被结构化为文件，然后在更高层级组织成目录。目录形成树形结构，我们称之为文件系统。


    `ls` 命令。此命令允许用户列出 PC 文件系统中包含的文件或目录。举个例子：


    所有以 `d..` 开头的条目代表目录。要列出隐藏文件，使用命令 `$ ls -a`。 `$ ls -l` 将输出详细列表。


    ## 用户信息


    登录系统时，你可能想知道：我是谁？


    要确定详情，使用 `whoami` 命令：


    ```

    $ whoami

    User1

    $

    ```


    该 `command` 命令将列出与登录系统的当前用户相关的账户名。


    要检查此时谁登录了系统，请使用以下三个命令：`users`、`who` 和 `w`。


    ```

    $ users

    User1 daroon khedir

    $ who

    User1 ttyp0 Oct 8 14:10 (limbo)

    daroon ttyp2 Oct 4 09:08 (calliope)

    khedir ttyp4 Oct 8 12:09 (dent)

    $

    ```


    系统上的 `w` 命令将列出更多与登录用户相关的信息。


    ## 会话管理


    要退出系统或终止会话以确保无人侵入你的文件或冒充你，我们将遵循以下步骤。


    要退出，在命令提示符上输入 `logout` 命令，系统将断开连接。


    对于系统关机，你可以使用下面说明的各种命令：


    - `halt` 命令将立即停止系统。

    - `init 0` 命令将在同步和清理系统后关闭系统电源。

    - `init 6` 命令将关闭系统并重启。

    - `poweroff` 命令将关闭系统电源。

    - `reboot` 命令将重启你的 PC。

    - `shutdown` 命令将关闭 PC。


    要关闭 PC，你需要是超级用户或 `root` 权限。


    ## 帮助与文档


    使用 `man` 命令获取帮助


    Linux 为初学者提供了很好的指导。帮助始终近在身边。帮助页是几乎每个命令、实用程序或程序调用的手册。


    `man $command`


    你输入 `man` 后跟你想要获取帮助的命令。当你想退出帮助页时按 `q`。例如：


    ```

    $ man whois

    $ man syslog.conf

    $ man syslogd

    $ man -k (apropos)

    $ man -k syslog

    ```


    要获取手册页的描述，输入：


    ```

    $ whatis route (这显示 IP 路由表)

    ```


    `whereis` 命令将显示手册页的位置。


    ```

    $ whereis -m whois

    whois: /usr/share/man/man1/whois.1.g

    ```


    ## 文件与目录操作


    - `Mkdir`。此命令通常用于在 PC 文件系统上创建新目录。

    - `file` 命令使用时会检查文件类型，无论文件的扩展名如何。

    - `pwd` 将始终显示当前目录的精确路径。

    - `cd` 命令用于在 Shell 中从一个位置更改或切换目录到另一个位置。

    - `mv` 是用于移动目录或文件的命令，并删除原始文件或目录。

    - `cp` 是复制命令，用于将文件或目录从 PC 文件系统的一个位置复制或移动到另一个位置。

    - shell 命令 `rm` 用于从文件系统删除或移除目录或文件。

    - `cat` 命令用于查看或将文件的内容/详情打印到终端供查看。

    - `grep` 命令用于搜索文件内容并允许在终端上查看详情。

    - `chown` 用于更改文件的所有权或目录的所有权。

    - `$ chgrp group filelist` 用于更改文件的组所有权。

    - `chmod` 赋予用户更改权限的权限，包括执行、读取和写入权限。

    - `ps` 命令列出系统中正在运行的所有进程。

    - `kill` 和 `killall` 命令终止任何运行的进程。

    - `locate` 命令搜索功能强大，将在任何找到搜索字符串的地方显示结果以及特定的文件位置。

    - `ipconfig` 命令对于配置设备至关重要。

    - `lspci` 是用于提供连接到 PCI 总线的所有设备（包括显卡）反馈的命令。

    - `lsusb` 将列出连接到 USB 集线器的每个设备。

    - `pstree` 命令以树形层次列出进程，使用户可以看到与特定程序一起运行的进程。


    要创建普通文件，使用 `vi` 编辑器。例如：


    ```

    $ vi filename

    $ cat filename 显示文件内容

    $ wc filename 给出文件的总单词数

    ```


    ## 虚拟文件系统


    有两个 Linux 文件系统总是让 Linux 用户困惑。这两个目录 `/proc` 和 `/dev`。这两个目录没有 Windows 对应部分，无法一眼看出。我们可以将
    `/proc` 文件系统定义为实时内存驻文件系统，用于跟踪 PC 上运行的进程和系统状态。


    你不能删除虚拟的 `/proc` 文件系统。`/proc` 文件系统包含大量文件，每个文件都包含一条信息。当启动新进程时，`/proc` 文件系统中会为它创建一个新目录并在其中创建大量数据。除了持有大部分内核参数的
    `/proc/sys` 目录外，`/proc` 通常是只读的。特定的工具如 `free`、`top` 和 `lspci` 用于这些数据文件。


    结论


    免费下载一个 Linux 版本并将其放入 CD 或 USB 闪存非常简单。然后从这里启动你的常规 Windows 电脑。你的电脑将加载 Linux 系统，你可以自由地从中尝试。学习
    Linux，看看你是否喜欢它，当你在不插 CD 或内存棒的情况下重启电脑时，它会直接回到正常的 Windows 电脑，对你的系统或文件不会造成任何损坏。


