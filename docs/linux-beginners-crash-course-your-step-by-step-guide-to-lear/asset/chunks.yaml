    # Conclusion


    ![image](d2d_images/chapter_title_below.png)


    It is very easy to download a version of Linux for free and put it on a cd or
    USB stick. Then boot your regular Windows computer from this. Your computer will
    load up the Linux system, you are free to play around in it. Learn about Linux,
    see if you like it and then when you restart your computer without the cd or memory
    stick it goes right back to your normal Windows computer with no harm done to
    your system or files.


    This is a nice "safe" way to experiment with Linux and see if it is right for
    you. I believe that some Linux systems allow you to personalize your system and
    download new software when running from a cd or memory stick.'
