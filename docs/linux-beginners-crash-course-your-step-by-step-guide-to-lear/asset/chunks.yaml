    # Chapter 3


    # What the Linux OS Comprises


    ![image](d2d_images/chapter_title_below.png)


    The Linux is a very powerful operating system that comprises a number of other
    pieces. The pieces includes:


    ### The Bootloader

    This is the software that has the capabilities to manage the boot process of the
    computer. You will always experience it as a splash screen that occasionally pops
    up and disappears once you boot into the main operating system.


    ### The kernel

    Wait! Did we forget to highlight what Linux is? The `kernel` is the one fragment
    of the whole package that is actually referred to as the ‘Linux’. It the core
    part of the computer system and has the mandate to manage a number of resources
    including the memory, the Central Processing Unit (`CPU`) and the other peripheral
    devices. In the arrangement or organization of the Operating System, the `kernel`
    is always at the lowest level.


    ### Daemons

    Do you ever get amazed how other activities are scheduled in a computer? In Linux,
    the `daemons` are the background services that are initiated during the boot process
    or the moment you log into your computer. The services may include scheduling,
    sound and printing among others.


    ### The Shell

    Have you heard of the Linux command line? The command line is just what we call
    the shell. This is the command process that will provide you the ability to control
    your PC through typing a variety of commands in a text interface. The text interface
    is so scary to many people who do not like using commands with the assumption
    that the command line is archaic. With the modern generation of desktop Linux,
    that is a case of the past since you will not fumble a lot with the command line.


    ### Graphical Server

    It is termed as the part of the system that displays or relays graphics information
    to the user through the monitor. In most cases, it is called `X server`.


    ### Desktop Environment

    It is a conjugation of the more familiar graphical user interface that allows
    users to interact with the core system. Some of examples of desktop environment
    include `XFCE`, `Cinnamon`, `Unity`, `GNOME`, `KDE` and `Enlightment`. The choice
    of desktop environments and their utilities vary from user to user. However the
    capability of the `KDE` and `Gnome` environments are quite similar.


    ### Applications

    These are high-quality software titles that you can find and install easily. The
    applications help in various functions for example the `Ubuntu Software Center`
    for quick searching of different apps.

