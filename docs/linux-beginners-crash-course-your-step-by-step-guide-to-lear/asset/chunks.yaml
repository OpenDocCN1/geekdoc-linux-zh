    # Chapter 1

    ## Linux versus Windows

    ![image](d2d_images/chapter_title_below.png)


    The most tiresome thing I experience in reading about Linux is the mindless enthusiasm
    of those utterly lacking in empathy and a sense of proportion. Most of us tend
    to think: If it’s not broke, don’t fix it. That is foreign to Linux folks.


    The itch to tinker and explore is essential to how Linux in particular, and Open
    Source software in general, came into existence. But that doesn’t justify ignoring
    very real human needs. For most of the humanity, computers are merely machines
    that save us time and make possible blessings not available any other.


    This book is for individuals who simply need to get work done on a computer; for
    you, something about Windows just doesn’t cut it. At the same time, you are used
    to shocking, dramatic changes in how you use your computer. Most especially, you
    have no use for changes simply for the sake of change.


    Here are some possible reasons you might have for switching from Windows to Linux:


    1. Licensing: Unless you are willing to take the risk of using pirated software,
    playing by the rules and laws that favor corporate software makers can be very
    expensive. `Linux` is free and the licensing generally affects only those who
    modify the software itself. You might have to pay for packaging, and there are
    some companies making software for `Linux` that isn’t free, but virtually anything
    you actually need can be downloaded for free. You can make all the copies you
    like and use it on as many machines as you please.


    2. **Control**: `Linux` is very much a Do-It-Yourself (DIY) system. While you
    may not understand all of the stuff running in the background necessary for it
    to work, the information is freely available as to what it is and why it’s needed.
    There is no cult of secrecy based on high-paid training and expensive access to
    the obscure details of the system. You can get expensive certification if you
    need it for your job or business, but it’s not required for simply using it. Indeed,
    the `Linux` user community at large is usually quite eager to help you understand.
    The main point is that there is no secret agreement between the supplier and some
    third parties forcing you to accept something not in your best interest just so
    they can make a profit at your expense. The `Linux` community as a whole is intensely
    anti-snooping and refuses to surrender any control to third parties.

