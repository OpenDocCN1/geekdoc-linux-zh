- fmt: "\nMost of the time we tend to save the command line for tasks that will require\
    \ performing a massive batch task or when we need to do specific things. The following\
    \ are some of the commands you have to master as a beginner to Linux.\n\n## Getting\
    \ Started\n\nOnce connected to your Linux OS. You will be prompted as follows:\n\
    \n`login:`\n\nEnter the userid and press `ENTER`. Remember the username and password\
    \ are case-sensitive.\n\nEnter your password once prompted and press enter. \n\
    \nIf successful, a command prompt (the `$` prompt) will be shown on the Linux\
    \ system where you are allowed to type your commands. Let's walk through some\
    \ of the common commands.\n\n### Basic Commands\n\nTo check the calendar, you\
    \ are required to type the `cal` command as below:\n\n```\n$ cal\n$\n```\n\nTo\
    \ change your password:\n\nYour system will require altering of the passwords\
    \ to keep your data and files secure from external intrusion. The steps to change\
    \ the password will involve the procedures below:\n\n1. Type `passwd` upon command\
    \ prompt.\n2. Type your current password and press `ENTER`.\n3. Assign the new\
    \ password you wish to use. Ensure that it is memorable but complex to avoid easy\
    \ guessing. You will be required to verify by entering it again.\n\n```\n$ passwd\n\
    Changing password for user1\n(current) Linux password:******\nNew LINUX password:*******\n\
    Retype new LINUX password:*******\npasswd: all authentication tokens updated successfully\n\
    $\n```\n\nI have used stars (`*`) to show the position you need to insert the\
    \ current and the new passwords. If done contrary, the system won’t show the characters\
    \ upon typing them.\n\n## Filesystem Navigation\n\nData in the Linux system is\
    \ structured into files which are then organized at higher rank into directories.\
    \ Directories form a tree-like structure we term as filesystem.\n\nThe `ls` command.\
    \ This command will allow the user to list the files or directories that are contained\
    \ in the file system of the PC. Let's take an example:\n\nAll entries that start\
    \ with `d..` represent directories. To list the hidden files, use the command\
    \ `$ ls -a`. `$ ls -l` will output a long listing.\n\n## User Information\n\n\
    While logged in the system, you may wish to know: Who am I?\n\nTo determine the\
    \ details the `whoami` command is used:\n\n```\n$ whoami\nUser1\n$\n```\n\nThe\
    \ `command` will list the account name that is associated with the current user\
    \ on logged to the system.\n\nTo check Who is Logged Into the system at that same\
    \ moment, use the following three commands: `users`, `who`, and `w`.\n\n```\n\
    $ users\nUser1 daroon khedir\n$ who\nUser1 ttyp0 Oct 8 14:10 (limbo)\ndaroon ttyp2\
    \ Oct 4 09:08 (calliope)\nkhedir ttyp4 Oct 8 12:09 (dent)\n$\n```\n\nThe `w` command\
    \ on the system will list some more information that is related to those users\
    \ who are logged on.\n\n## Session Management\n\nTo log out of the system or to\
    \ terminate your session to ensure nobody comes to infringe with your files or\
    \ masquerade you, we will follow the following steps.\n\nTo log out, type the\
    \ `logout` command on command prompt and the system will break the connection.\n\
    \nFor System Shutdown, you may use a variety of commands as explained below:\n\
    \n- The `halt` command will take the system down instantly.\n- The `init 0` command\
    \ will powers off the system after synchronizing and cleaning up the system.\n\
    - The `init 6` command will shut down the system and bring it back again.\n- The\
    \ `poweroff` command powers off the system.\n- The `reboot` command will reboot\
    \ your PC.\n- The `shutdown` command powers the PC off.\n\nTo shut down the PC,\
    \ you will be needed to be the superuser or `root`.\n\n## Help and Documentation\n\
    \nGet help with the `man` command\n\nLinux offers good direction to the beginners.\
    \ Help is always very near. The help page is a manual for almost each and every\
    \ command, utility or the program calls.\n\n`man $command`\n\nYou type `man` followed\
    \ by a command you wish to get help on. Press `q` when you want to quit the help\
    \ page. For example:\n\n```\n$ man whois\n$ man syslog.conf\n$ man syslogd\n$\
    \ man -k (apropos)\n$ man -k syslog\n```\n\nTo get description of the manual page,\
    \ type:\n\n```\n$ whatis route (this shows the IP routing tables)\n```\n\n`whereis`\
    \ command will show the location of a manual page.\n\n```\n$ whereis -m whois\n\
    whois: /usr/share/man/man1/whois.1.g\n```\n\n## File and Directory Operations\n\
    \n- The `Mkdir`. This command is usually used when creating new directories on\
    \ the PC’s filesystem.\n- The `file` command when used checks the type of the\
    \ file regardless of extension of the file.\n- `pwd` will always show the exact\
    \ path of the current directory.\n- The `cd` command is used to alter or change\
    \ the direction one directory from one location to a different one within the\
    \ Shell.\n- `mv` is a command used when moving directories or files and deletes\
    \ the original file or directory.\n- The `cp` is a copy command that copies or\
    \ moves files or directories from one position to a different one in the PC file\
    \ system.\n- The shell command `rm` is used to delete or remove directories or\
    \ files from the filesystem.\n- The `cat` command is utilized when one is viewing\
    \ or printing the contents/details of a file to the terminal for the user to see.\n\
    - The `grep` command is for searching contents of a file and enable the details\
    \ to be viewed on the terminal.\n- The `chown` is used to change the file’s ownership\
    \ or ownership of a directory.\n- `$ chgrp group filelist` is used to change the\
    \ group ownership of a file.\n- The `chmod` gives the user the authority to alter\
    \ user permissions that include execute, read and write permissions.\n- The `ps`\
    \ command lists the processes that are currently running on the system.\n- The\
    \ `kill` and `killall` commands terminate any processes that are running.\n- The\
    \ `locate` command is powerful for searching and will display results wherever\
    \ the search string is found plus the particular file location.\n- `ipconfig`\
    \ command is essential for configuring a device’s network.\n- `lspci` is a command\
    \ used to give feedback of all devices connected to the PCI bus together with\
    \ the graphics card.\n- `lsusb` will list every device connected to the USB hub.\n\
    - `pstree` command lists processes in a tree hierarchy to enable the user to see\
    \ the processes that go along with a specific program.\n\nTo create ordinary files,\
    \ you use the `vi` editor. For example:\n\n```\n$ vi filename\n$ cat filename\
    \ displays file contents.\n$ wc filename gives the total word count in a file\n\
    ```\n\n## Virtual Filesystems\n\nThere are two Linux file systems that always\
    \ confuse Linux users. These two directories `/proc` and `/dev`. These two directories\
    \ do not have any windows counterpart and are not at glance easily understandable.\
    \ We can define `/proc` file system as a real-time memory resident file system\
    \ that tracks the running processes on the PC and the state of your system.\n\n\
    You cannot remove the virtual `/proc` filesystem. The `/proc` filesystem contains\
    \ a huge number of files each containing a nugget of information. When a new process\
    \ is started a new directory will be created in the `/proc` filesystem for it\
    \ and a lot of data is created within it. The `/proc` is generally read-only apart\
    \ from `/proc/sys` directory that holds a large part of kernel parameters. Specific\
    \ utilities like `free`, `top` and `lspci` are used to data files.\n\nConclusion\n\
    \nIt is very easy to download a version of Linux for free and put it on a cd or\
    \ USB stick. Then boot your regular Windows computer from this. Your computer\
    \ will load up the Linux system, you are free to play around in it. Learn about\
    \ Linux, see if you like it and then when you restart your computer without the\
    \ cd or memory stick it goes right back to your normal Windows computer with no\
    \ harm done to your system or files.\n"
