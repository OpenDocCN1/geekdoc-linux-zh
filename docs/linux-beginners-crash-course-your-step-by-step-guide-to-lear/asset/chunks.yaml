    # Chapter 2


    # Features of Linux


    ![image](d2d_images/chapter_title_below.png)


    In general, the Linux/Unix experience holds sufficient differences from Windows
    that you might benefit from some explanation.


    The DIY Linux/Unix culture assumes a much tighter interaction between the user
    and the machine. More than a mere user, you need to become at least a smidgen
    of the technician. With most of your fellow Linux users, it will seem to you like
    an obsession. We’ve already noted they seem far more interested in the computer
    itself and exploring its capabilities than actually using it. They demand a much
    closer involvement in the arcane processes, but it yields to us more ordinary
    users a much greater control when we do want it.


    Given all the recent revelations of snooping by the government, corporations,
    advertisers and criminals happening on a level not previously imagined, the value
    of having control over your own system has taken center stage in computer technology.
    It’s possible you could continue pretending it won’t matter much and simply accept
    what comes with default commercial provision for your computer use.


    The risk of such studious ignorance is quite high. If you’d rather not surrender
    all your privacy just yet, Linux offers a far greater degree of control. Having
    that control is pointless if you have no idea how to use it. The minimum standard
    for keeping privacy and control has already risen quite a bit.


    One of the most important factors has already been hinted at above: Linux is the
    system underneath the GUI. With all the DIY perfectionists and highly varied artistic
    visions involved, you should hardly be surprised that the Linux GUI could be any
    one of dozens.


    That’s because the GUI itself is modular. The basic graphical display is called
    “X” and the desktop runs on top of that. We’ve mentioned that we’ll be using KDE,
    but that Ubuntu has their preferred Unity. KDE is all over the place and quite
    popular, but Unity is pretty much restricted to Ubuntu. There are others and you’ll
    see names like GNOME, MATE, Cinnamon, E, LXDE, XFCE, etc.'
