    # 第 3 章


    # Linux 操作系统由什么组成


    ![image](img/chapter_title_below.png)


    Linux 是一个非常强大的操作系统，由许多其他部分组成。这些部分包括：


    ### 启动加载程序 (Bootloader)

    这是具有管理计算机启动过程能力的软件。你总是会将其体验为一个启动画面，它会在你进入主操作系统后偶尔弹出并消失。


    ### 内核 (kernel)

    等一下！我们忘记强调 Linux 是什么了吗？`kernel` 是整个软件包中真正被称为“Linux”的片段。它是计算机系统的核心部分，被授权管理包括内存、中央处理器（`CPU`）和其他设备设备在许多资源。在操作系统的安排或组织中，`kernel`
    始终处于底层。


    ### 守护进程 (Daemons)

    你是否对计算机如何调度其他活动感到惊讶？在 Linux 中，`daemons` 是启动过程中或你登录计算机时启动的后台服务。这些服务可能包括调度、声音和打印等。


    ### 解释壳 (The Shell)

    你听说过 Linux 命令行吗？命令行就是我们所称的 `shell`。这是一个命令处理过程，让你能够通过在文本界面中输入各种命令来控制你的 PC。对于许多不习惯使用命令的人来说，这种文本界面非常可怕，因为他们认为命令行是过时的。对于现代桌面
    Linux 来说，这已是过去式了，因为你不会在命令行上手忙脚乱。


    ### 图形服务器 (Graphical Server)

    它指的是通过显示器向用户显示或传输图形信息的部分。在大多数情况下，它被称为 `X server`。


    ### 桌面环境 (Desktop Environment)

    它是更熟悉的图形用户界面的结合，允许用户与核心系统交互。桌面环境的一些示例包括 `XFCE`、`Cinnamon`、`Unity`、`GNOME`、`KDE`
    和 `Enlightment`。桌面环境及其工具的选择因用户而异。然而，`KDE` 和 `Gnome` 环境的能力非常相似。


    ### 应用程序 (Applications)

    这些你可以很容易找到并安装的高质量软件标题。应用程序有助于各种功能，例如 `Ubuntu Software Center` 用于快速搜索不同的应用。


