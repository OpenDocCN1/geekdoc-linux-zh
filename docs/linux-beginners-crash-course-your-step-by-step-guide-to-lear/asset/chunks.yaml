  raw: '3\. Security – The Linux community is also intensely pro-security, so it is
    generally harder to crack a Linux system. Not impervious, it’s just that the computer
    is far less likely to suffer from external threats. Criminal hackers tend to like
    using Linux themselves because of the built-in safety factors.


    By the same token, the background noise of clandestine chatter between computer
    criminals indicates they aren’t eager to face the challenge of cracking a properly
    configured Linux box. Perhaps it’s partly due to the much smaller numbers of systems
    they can harvest to their criminal activity at the cost of such difficulty.


    There isn’t that much profit from all the work of attacking Linux systems, so
    we are unlikely to ever know how vulnerable it really is because too few are willing
    to invest time and resources attacking them. Even if you and all your friends
    switch to Linux, it will probably always remain a rather low proportion of personal
    computers connected to the Internet. (Servers are a different story.) At any rate,
    once you get used to how Linux stuff works, it’s okay to relax and not worry as
    much about random attacks to your system. Rarely do the threats out there have
    any effect on Linux.


    4\. Bloat – You can easily find a user-friendly Linux OS that is up-to-date and
    runs just fine on older hardware. Thus, your old XP machine that can’t really
    handle Win7 will run a current version of Linux just fine, and for quite a few
    years to come. This wasn’t always true in the history of Linux, but in the past
    decade or so, Windows has begun demanding a lot more power than Linux does for
    the same work.


    The primary reason you won’t switch from Windows to Linux is the lack of convenience.
    Open Source can be political, or even downright religious, about a certain kind
    of technological orthodoxy. They don’t like the idea of hardware makers keeping
    trade secrets and refuse to understand how this affects users.


    Never mind all the political and philosophical hullabaloo from Linux advocates,
    some hardware doesn’t work, or doesn’t work very well, under Linux. You can’t
    just take any given old piece of hardware at the electronics store and expect
    it works as advertised if you run Linux. You have to be somewhat more discriminating.
    On the other hand, I’m not the only computer user who found some Linux drivers
    much better than the Windows version.


    Some activities are very complicated compared to Windows, such as home networking
    and sharing printers. Those things can be done, but it will involve more work.


    And let’s face it: Compatibility between Linux versions of software working alongside
    the Windows version for similar operations is hit-and-miss. Open Source often
    lacks critical features. For a writer, the best word processor you can get for
    free under Linux still does not compare very well with even Word 2000\. At the
    very least, grammar checking in Linux remains primitive and almost useless.


    Open Source office suites are always somewhere behind the commercial stuff. (But
    you can easily make MS Office run on Linux, as well as other popular Windows stuff.)


    Don’t stumble into this blindly. There are problems with any choices you make.


    Here are some of the primary differences between Linux and Windows.


    1\. Graphical User Interface (GUI)


    Both Linux and Windows provide graphical interfaces. Windows graphical interfaces
    have changed over time, but the first version of Windows that gave end-users choice
    of interface change was Windows XP, while Linux has always had that provision.
    Another point to note is that Linux can run in either graphical mode or non-graphical
    mode unlike Windows that just runs in graphical mode.


    2\. Running from CD


    One thing Linux can do that Windows cannot do is run from a CD which is referred
    to as live CD. For Windows to run, it must first be installed onto the hard drive
    of which is partially true with some Linux distribution. A good example of a Linux
    distribution(s) that can run entirely as a Live CD is Ubuntu and Opensuse, plus
    many other Linux distributions out there.


    3\. Viruses


    Linux technically does not have viruses as compared to Windows.


    4\. Technical Superiority


    In this area Linux rules, the intensity of heavy workload(s) to remote administration,
    to security to virtualization to mention but a few of the multitasking areas Linux
    reigns supreme. This is why major companies run Linux on their servers.


    5\. System Stability


    When running mission-critical work, the operating system used must also be up
    to par, and this is where Linux comes in again. Linux OS''s offer stability and
    robustness.


    6\. System crashing


    Windows tends to crash more frequently than Linux, period.


    7\. Costing


    Purchasing Linux is less costly as compared to Windows. Once a Linux CD is bought
    it can be used to install on as many computers as one so chooses, unlike Windows
    CD''s which have limitations on the number of computers to be installed.


    8\. Maintenance & Management


    Once a Linux system is configured properly and running as it should, maintenance
    and management are close to minimal unlike Windows-based platforms which tend
    to require the occasional restarts every now and then.


    9\. Hardware Support


    Over the years Linux has never been known for its hardware support but that too
    is changing rapidly, most hardware today can now be supported by a good number
    of Linux distributions.


    10\. Problem first, Solution last


    Being an IT professional, this last point is one of my favorite points, why do
    I say this. Look at it this way.


