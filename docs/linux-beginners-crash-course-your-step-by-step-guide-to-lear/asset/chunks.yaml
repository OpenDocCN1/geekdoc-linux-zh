    typing them.


    Listing Directories and Files:


    Data in the Linux system is structured into files which are then organized at
    higher rank into directories. Directories form a tree-like structure we term as
    filesystem.


    The ls command. This command will allow the user to list the files or directories
    that are contained in the file system of the PC. Let''s take an example:


    All entries that start with d.. represent directories. To list the hidden files,
    use the command $ ls –a. $ ls –l will output a long listing.


    Who Are You?


    While logged in the system, you may wish to know : Who am I?


    To determine the details the whoami command is used:


    $ whoami


    User1


    $ The command will list the account name that is associated with the current user
    on logged to the system.


    To check Who is Logged Into the system at that same moment, use the following
    three commands: users, who, and w.


    $ users


    User1 daroon khedir


    $ who


    User1 ttyp0 Oct 8 14:10 (limbo)


    daroon ttyp2 Oct 4 09:08 (calliope)


    khedir ttyp4 Oct 8 12:09 (dent)


    $


    The w command on the system will list some more information that is related to
    those users who are logged on.


    To log out of the system or to terminate your session to ensure nobody comes to
    infringe with your files or masquerade you, we will follow the following steps.


    To log out, type the logout command on command prompt and the system will break
    the connection.


    For System Shutdown, you may use a variety of commands as explained below:


    The halt command will take the system down instantly.


    The init 0 command will powers off the system after synchronizing and cleaning
    up the system.


    The init 6 command will shut down the system and bring it back again.


    The poweroff command powers off the system.


    The reboot command will reboot your PC.


    shutdown command powers the PC off.


    To shut down the PC, you will be needed to be the superuser or root.


    Get help with the man command


    Linux offers good direction to the beginners. Help is always very near. The help
    page is a manual for almost each and every command, utility or the program calls.


    man $command


    You type man followed by a command you wish to get help on. Press q when you want
    to quit the help page. For example:


    $ man whois


    $ man syslog.conf


    $ man syslogd


    $ man -k (apropos)


    $ man -k syslog


    To get description of the manual page, type:


    $ whatis route (this shows the IP routing tables)


    Whereis command will show the location of a manual page.


    $ whereis -m whois


    whois: /usr/share/man/man1/whois.1.g


    The Mkdir. This command is usually used when creating new directories on the PC’s
    filesystem.


    The File command when used checks the type of the file regardless of extension
    of the file.


    Pwd will always show the exact path of the current directory.


    The cd command is used to alter or change the direction one directory from one
    location to a different one within the Shell.


    Mv is a command used when moving directories or files and deletes the original
    file or directory.


    The cp is a copy command that copies or moves files or directories from one position
    to a different one in the PC file system.


    The shell command rm is used to delete or remove directories or files from the
    filesystem.


    The cat command is utilized when one is viewing or printing the contents/details
    of a file to the terminal for the user to see.


    The Grep command is for searching contents of a file and enable the details to
    be viewed on the terminal.


    The Chown is used to change the file’s ownership or ownership of a directory.


    $ chgrp group filelist is used to change the group ownership of a file.


    The chmod gives the user the authority to alter user permissions that include
    execute, read and write permissions.


    The ps command lists the processes that are currently running on the system.


    The kill and killall commands terminate any processes that are running.


    The locate command is powerful for searching and will display results wherever
    the search string is found plus the particular file location.


    Ipconfig command is essential for configuring a device’s network.


    Lspci is a command used to give feedback of all devices connected to the PCI bus
    together with the graphics card.


    Isusb will list every device connected to the USB hub.


    Pstree command lists processes in a tree hierarchy to enable the user to see the
    processes that go along with a specific program.


    To create ordinary files, you use the vi editor. For example:


    $ vi filename


    $ cat filename displays file contents.


    $ wc filename gives the total word count in a file


    There are two Linux file systems that always confuse Linux users. These two directories
    are /proc and /dev. These two directories do not have any windows counterpart
    and are not at first glance easily understandable. We can define /proc file system
    as a real-time memory resident file system that tracks the running processes on
    the PC and the state of your system.


    You cannot remove the virtual /proc filesystem. The /proc filesystem contains
    a huge number of files each containing a nugget of information. When a new process
    is started a new directory will be created in the /proc filesystem for it and
    a lot of data is created within it. The /proc is generally read-only apart from
    /proc/sys directory that holds a large part of kernel parameters. The /proc/sys
    can be altered while the system is still in running mode. Specific utilities like
    free, top and lspci are used to data files.


