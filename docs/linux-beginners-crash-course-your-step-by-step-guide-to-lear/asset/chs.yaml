  # 第 1 章

  ## Linux 对比 Windows

  ![image](img/chapter_title_below.png)


  我在阅读关于 Linux 内容时经历的最令人疲惫的事情，就是那些完全缺乏同理心和分寸感的盲目狂热。我们大多数人倾向于认为：如果没有坏，就不要修。这对于 Linux
  爱好者来说是陌生的。


  对摆弄和探索的冲动是 Linux 特别以及整个开源软件存在的本质。但这不能作为忽视非常真实的人类需求的理由。对于大多数人类来说，计算机仅仅是为我们节省时间并提供其他任何无法实现的福的机器。


  这本书是为那些只需要在计算机上完成工作的人准备的；对你来说，Windows 的某些功能并不适用。同时，你习惯了使用电脑的方式发生令人震惊、戏剧性的变化。特别是，你不需要为了改变而改变。


  以下是你可能想要从 Windows 切换到 Linux 的一些可能原因：


  1. 许可：除非你愿意承担使用盗版软件的风险，否则遵循有利于企业软件制造商的规则和法律可能非常昂贵。`Linux` 是免费的，许可通常只影响那些修改软件本身的人。你可能需要为包装付费，虽然有些公司为
  `Linux` 制作非免费的软件，但你实际需要的几乎任何东西都可以免费下载。你可以制作任何你喜欢的副本，并在任意数量的机器上使用。


  2. **控制**：`Linux` 是一个非常注重 DIY（DIY）的系统。虽然你可能不理解为了运行所需的后台的所有内容，但关于它是什么以及为什么需要的信息是免费获取的。没有基于高薪培训和昂贵访问系统晦涩细节的秘密崇拜。如果你工作或业务需要，可以获得昂贵的认证，但对于仅仅使用它并不是必需的。事实上，整个
  `Linux` 用户社区通常非常乐于帮助你理解。重点是，供应商与某些第三方之间没有秘密协议强迫你接受不符合你最佳利益的东西，以便他们以你为代价盈利。整个 `Linux`
  社区强烈反对监视，并拒绝向第三方交出任何控制权。






  ### 3 安全

  Linux 社区也极重视安全，因此破解 Linux 系统通常更难。它并非无懈击，只是计算机不太可能受到外部威胁的侵害。犯罪黑客倾向于自己使用 Linux，因为其内置了许多安全因素。


  同理，计算机犯罪分子之间秘密交谈的背景噪音也表明，他们并不热于面对破解一个配置得当的 Linux 盒的挑战。这可能部分是因为，付出如此巨大难度的代价，他们能够获取并用于犯罪活动的系统数量要少得多。


  攻击 Linux 系统的这些工作利润并不高，因此我们可能永远无法知道它到底有多脆弱，因为很少有人愿意投入时间和资源去去攻击它们。即使你和你所有的朋友都切换到 Linux，它在连接互联网的个人电脑中的比例可能一直保持在很低的水平。（服务器则是另一回事。）无论如何，一旦你习惯了
  Linux 系统的运作方式，就可以放松心情，不必过度担心针对你系统的随机攻击。外界的威胁很少能对 Linux 产生任何影响。


  ### 4 臃肿

  你可以轻松找到一个既界面友好又保持最新，且在旧硬件上运行良好的 Linux 操作系统。因此，你那台无法真正处理 Win7 的旧 XP 机器可以完美运行当前版本的
  Linux，并且在未来的很多几年里也是如此。这在 Linux 的历史上并非一直如此，但在过去的十年左右，Windows 在执行相同工作时对性能的需求开始比 Linux
  高得多。


  你不会从 Windows 切换到 Linux 的首要原因是缺乏便利性。开源可能在某种技术正统性上表现出政治性，甚至是近乎宗教的狂热。他们不喜欢硬件制造商保留商业秘密的这种想法，并拒绝理解这如何影响用户。


  别管 Linux 拥护者那些政治和哲学上的喧哗，某些硬件在 Linux 下确实无法工作，或者运行得并不好。你不能从电子商店随便拿来任何一个旧硬件，就指望在运行
  Linux 时它像广告说的那样工作。你必须变得更具眼光。另一方面，我并不是唯一发现某些 Linux 驱动程序比 Windows 版本好很多的计算机用户。


  与 Windows 相比，某些活动非常复杂，例如家庭网络和打印机共享。这些事情可以做到，但会涉及更多工作。


  让我们面对现实吧：Linux 软件版本与 Windows 版本在执行类似操作时的兼容性全凭运气。开源通常缺乏关键功能。对于写作者来说，你在 Linux 下能获得的免费最佳文字处理器仍然与
  Word 2000 相比并不理想。至少，Linux 下的语法检查仍然原始且几乎毫无用处。


  开源办公套件在某些方面总是落后于商业软件。（但你可以轻松让 MS Office 在 Linux 上运行，以及其他流行的 Windows 软件。）


  不要盲目地陷入其中。你做的任何选择都存在问题。


  以下是 Linux 和 Windows 之间的一些主要区别。


  ### 1 图形用户界面 (GUI)

  Linux 和 Windows 都提供了图形界面。Windows 的图形界面随着时间不断变化，但第一个让最终用户选择界面更改的 Windows 版本是 Windows
  XP，而 Linux 一直都有这一规定。另一个需要注意的点是，Linux 可以在图形模式或非图形模式下运行。


  ### 2 从 CD 运行

  Linux 可以做到而 Windows 做不到的一点是从 CD 运行。


  ### 3 病毒

  与 Windows 相比，Linux 没有病毒。


  ### 4 技术性

  在这一领域，Linux 凌于 Windows 之。


  ### 5 系统稳定性

  运行时，Linux 提供的稳定性比 Windows 高。


  ### 6 系统崩溃

  Windows 崩溃频率通常比 Linux 高。


  ### 7 成本

  购买 Linux 的成本比 Windows 低。


  ### 8 维护与管理

  一旦 Linux 系统配置得当，其维护和管理就接近于 Windows。


  ### 9 硬件支持

  多年来，Linux 从未以硬件支持闻名，但随着许多 Linux 发行版的出现，这种情况正在迅速变化。


  ### 10 问题优先，解决方案

  作为一名 IT 专业人士，这是我最喜欢的观点之一。





  这些都代表了集成的桌面显示系统，但也有许多集成程度不高的 GUI 仅负责控制显示。它们没有添加我们认为理所当然的各种配套工具和各种小型应用程序。


  如果你是从 Windows 转过来的，你可能会认为 `KDE` 可能是集成程度最完整的 GUI 软件包。然而，你永远不要忘记，其底层是命令行界面（`CLI`）。


  取决于你使用计算机的方式，你甚至不需要一个 `GUI`，而且 Linux 提供了丰富的运行在 `CLI` 上的应用程序。不仅仅是文本编辑器，还有 Web 浏览器、电子邮件客户端、多媒体播放器——所有这些在没有任何图形显示元素的情况下也已经高度开发且功能完备了。尽管如此，当配置得当时，你可以在
  `CLI` 上显示图形。坦率地说，开源开发者继续痴恋 `CLI` 的简单与强大。


  在 Linux 上避开 `CLI` 是可能的，但这是愚蠢的。Linux 很多最出色的特性永远不会出现在任何 `GUI` 中。即使是 Windows 和 Macintosh
  也保留了它们的 `CLI` 工具。事实上，Mac 是拥有完整 `CLI` 的 `UNIX`，尽管其粉丝很少使用，而 Linux 仅仅是类 Unix 系统。


  有些计算机任务无法通过任何其他方式妥善完成。顺带提一句，每一比特 `GUI` 软件都会增加系统的复杂性和漏洞。你越依赖 `CLI`，你为那些试图夺取系统控制权的人留下的漏洞就越少。适应这种更高程度的自力能力在
  Linux 上容易得多，因为起初看起来模糊的东西实际上只是对你这个外部人员来说不熟悉而已。


  在书中，我们将稍微探索一下 `CLI`。我会引导着你，让它尽可能简单。在 `GUI` 内部运行 `CLI` 终端会非常简单。在两者之间通过 `cut-n-paste`
  来回传输命令也非常容易。


  事实上，在 Linux 中，鼠标本身就有它自己的剪贴板。如果你的指针有一个中间键，你可以直接从指针粘贴而不使用 `GUI` 剪贴板，即使在没有 `GUI` 的情况下也能工作。自第一代鼠标驱动程序时代，Linux
  就允许在 `CLI` 上进行良好的鼠标操作。


  让 Windows 逃民最惊讶的点之一是，即使你的 `GUI` 正在运行，你仍然可以登录 Linux 的 `CLI`。当你登录 Linux 桌面时，底层通常会有六个
  `CLI` 会话在等待你。不仅 `UNIX` 本质上是 `CLI` 的，而且从一开始就是多用户系统，在 `DOS` 或 Windows 出现之前就是如此。但如今，我们很少将多个哑终端连接到运行的服务器，因此我们以虚拟会话的形式将所有会话保留在同一硬件上。在非常早期，这种功能被扩展到了
  `GUI`，但不需要额外的登录。


  在你的 Linux 图形桌面上，你始终拥有多个虚拟桌面的能力，每个桌面都有自己的视图。你不需要将多个应用程序窗口挤在一个工作空间内，而是可以将它们分散在几个空间中。这就像在两侧排列了额外的桌面，但在你需要之前一直隐藏在屏幕之外。你不必非使用该功能，但知道可以这样做是很好的。


  将这种能力写进软件中（无论是 `GUI` 还是 `CLI`）已经完全集成到 Linux 的运作方式中，以至于没有它系统几乎无法运行。它对系统资源的任何额外消耗已经降到了最低。关闭所有这些额外功能不会让情况变得更好，部分原因是这会导致某些功能损坏。


  事实上，在最近几年中，一些最耗能的 Linux 系统使用的计算机功率仍少于目前的 Windows 操作系统。使用当前版本的 `Kubuntu`，你通常使用的电力比
  `Win7` 或 `Vista` 少，比 `Win8` 少得多。同时，你可能在驱动、稳定性和安全性方面遇到的麻烦会更少。再次，它并不完美，但在许多方面可能更好。


