  # 引言

  ![image](img/chapter_title_below.png)


  在我们详细讨论 Linux 之前，让我们先尝试理解“开源软件开发”这一术语。


  开源已经走向成熟，并存在了很长时间。对于许多计算机和技术发烧友来说，尝试接触这种软件曾是不可接受的。多年来情况发生了变化，尽管在许多阵营中仍有巨大的反对意见，但这种软件在改变我们的世界方面产生了重大影响。我们许多人可能在毫无不知情的情况下在使用开源软件。


  当我们谈论操作系统时，脑海中浮出的通常是微软 Windows 或 OS X。在这个领域还有另一个重要的参与者，每天都有越来越多的用户在使用。Linux 操作系统已成为其他更知名商业操作系统的流行替代方案。许多成熟的
  Linux 发行版每六个月就会发布一次操作系统的升级。


  我们生活在一个手机随处可见的时代。几年前，移动通信行业出现了一个具有重大意义的新手机手机品牌，这就是智能手机。除了普通手机具备的所有常规功能外，智能手机还有许多以前只在计算机上才能找到的功能。开源也在此领域占有一席之地。某些智能手机制造商采用了
  `Android` 作为他们的首选操作系统，并在这个竞争激烈的领域取得了巨大进展。


  我们中的许多人在日常生活中每天都会使用互联网。当我们需要搜索任何内容时，倾向于转向 `Google`。除了搜索功能，许多人还使用 `Google` 界面中的许多应用程序。`Google`
  是使用 `Java` 和 `Python` 语言开发的，并在使用 `Linux` 作为操作系统的计算机上编写代码。所有的软件技术在开源圈中都被广泛使用且广为人知。


  我们今天所知的互联网很大程度上归功于开源软件。出于各种原因，全球许多网络服务器由 `Linux` 驱动。当我们考虑到充斥互联网的网站数量，其中许多都是使用多种开源环境开发的，这并不令人意外。


  我们今天所知的技术世界已在许多方面被开源软件所改变。对于这些完全免费并允许任何人对其开发做出贡献的技术来说，这并不糟糕。


  现在让我们讨论一下 Linux 操作系统的选择问题。`Ubuntu` 最流行且对用户友好，而 `Fedora` 则充满了最新的技术。那么应该选择哪一个呢？这取决于用途。如果用户只是用电脑进行不包括编程的办公工作，那么
  `Ubuntu` 自然是更好的选择。


  然而，凭借最新的技术的定期开发，`Fedora` 在基准测试中优于 `Ubuntu`。因此，很大程度上取决于软件的用途。如果是从 Windows 迁移，`Ubuntu`
  是明显的选择；如果你是一个认真的编程极客，`Fedora` 是最佳选择。Linux 基金建议同时学习 `Ubuntu` 和 `Fedora` 以获得完整的 Linux
  体验。


