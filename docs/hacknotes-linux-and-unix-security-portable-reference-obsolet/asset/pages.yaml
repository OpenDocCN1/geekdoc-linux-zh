- pgno: 212
  md: 'Often, distribution vendors take more time to update their resources with security
    patches. If your Unix or Linux distribution vendor does not have a patch listed
    for an announced vulnerability, try going to the software vendor''s web site for
    a patch. If you must wait for your distribution vendor to provide an update, consider
    disabling or uninstalling the vulnerable software for the time being.


    Also, take a look at "Online Resources" in the Reference Center of this book for
    mailing lists one may subscribe to in order to receive prompt updates on latest
    software vulnerability announcements.


    # SUMMARY


    Logging must be enabled and enforced in order to capture details of system activities.
    In addition, file permissions on log files must be properly set to prevent them
    from being tampered with by malicious users. It is also very important to stay
    current with software updates and patches to protect against the exploitation
    of software vulnerabilities by local and remote users. Therefore, every system
    administrator should attempt to enforce the recommendations presented in this
    chapter in order to ensure protection from various types of malicious activities
    and intrusion attempts.'
  merge: -1
  img_proc: true
