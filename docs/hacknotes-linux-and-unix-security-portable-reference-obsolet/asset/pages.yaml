- pgno: 99
  md: '# Chapter 3: Enumeration 45




    Disabling the `ServerSignature` token instructs Apache to not print version information
    when an error page such as a “404-Not Found” is displayed. The `ServerTokens`
    directive, when set to `Prod`, instructs Apache to only display “Server: Apache”
    in the banner. If you do not want to display “Apache” in the Server tag but want
    to display fake information such as “Server: Not-allowed,” you will need to


    +   1. Download the Apache source code.

    +   2. Edit the file `httpd.h` and change the value of the string “Apache” in
    the line

    +      ```c

    +      #define SERVER_BASEPRODUCT "Apache"

    +      ```

    +      to something else:

    +      ```c

    +      #define SERVER_BASEPRODUCT "Not-allowed"

    +      ```

    +   3. Recompile, reinstall, and restart Apache.


    # POP3 (Post Office Protocol 3): 110 (TCP)


    POP3 is a protocol used to access e-mail from a mailbox server.


    # Obtain the POP3 Server Banner


    Telnet to port 110 to get the POP3 server banner information:


    ```

    ```bash

    $ telnet 10.0.1.1 110

    +OK POP3 10.0.1.1 v4.39 server ready

    ```

    ```


    # Change the POP3 Server Banner


    Many POP3 servers require their source code to be edited in order to change the
    server banner. In these cases, you must obtain the source code to your POP3 server
    and search for the version string by using the `grep` command. Once you have edited
    the source code to reflect the new banner information, recompile and reinstall
    the POP3 server. Some POP3 servers allow for banner information to be changed
    by editing appropriate configuration files. Please see your POP3 server documentation
    for details.


