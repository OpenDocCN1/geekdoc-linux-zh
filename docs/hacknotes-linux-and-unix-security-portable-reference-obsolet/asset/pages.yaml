- pgno: 191
  md: '+   Change the SMTP greeting message. Edit the sendmail.cf file and change
    the value of SmtpGreetingMessage to reflect the new banner. Alternatively, you
    can edit sendmail.mc and set the value of confSMTP_LOGIN_MSG to the new greeting.


    +   EXPN and VRFY are two commands supported by the SMTP protocol to allow for
    username enumeration. You should turn them off by editing sendmail.cf and ensuring
    that PrivacyOptions is set to authwarnings,noexptn, novrfy, restrictqrun. Alternatively,
    you can edit the sendmail.mc file and ensure the following line is present:

    +   `define(''confPRIVACY_FLAGS'', ''authwarnings,noexxn,novrfy, restrictqrun'')dnl`

    +   Other flags such as goaway, restrictmailq, restrictqrun, and nobodyreturn
    can also be set. Please see the Sendmail documentation for details.


    +   Use smrsh as the MDA (mail delivery agent). The smrsh program is a replacement
    for sh; it limits the commands that can be run using the “| command” syntax of
    Sendmail. To enable smrsh, ensure the following line is present in sendmail.mc:

    +   `FEATURE(''smrsh'', ''/path/to/smrsh'')dnl`


    +   Make sure the following files and directories have the appropriate permissions:


    | File or Directory | User | Group | Permissions |

    | :-- | :-- | :-- | :-- |

    | /etc/aliases | root | root | -rw-r--r-- |

    | /etc/mail | root | root | drwxr-x--x |

    | /var/spool/mail | root | mail | drwxrwxr-x |

    | /var/spool/mqueue | root | mail | drwxr-x--x |


    +   Check the contents of /etc /mail /aliases. This file contains hostnames that
    are allowed to relay through the Sendmail server. Do not place untrusted hostnames
    in this file.


    +   Place a limit on the maximum allowed e-mail size. This can be done by setting
    the value of confMAX_MESSAGE_SIZE in sendmail.mc, for example:

    +   `define(''confMAX_MESSAGE_SIZE'', ''1048576'')dnl`

    +   Or, edit the sendmail.cf file and change the value of MaxMessageSize to the
    appropriate value.


    +   Sendmail is known to have been susceptible to many remotely exploitable vulnerabilities.
    Consider using qmail as a replacement'
