    # Enumerate SNMP


    SNMP servers are configured with a "community string" that acts like a user id
    or password. When an SNMP server is queried with the wrong community string, it
    does not respond. Many SNMP servers have default community strings such as “public”
    and “private.” When an SNMP server is queried with the right community string,
    useful information can be gained:


    ```

