- pgno: 193
  md: 'Consider using djbdns as a replacement for BIND. The djbdns server is available
    at [http://cr.yp.to/djbdns.html](http://cr.yp.to/djbdns.html).


    # Apache (HTTP and HTTPS)


    Apache is the most popular web server in use today. The following steps can be
    taken to harden Apache server configurations:


    +   - Change your HTTP banner. Edit your httpd.conf file and make sure the following
    directives are present:

    +     ServerSignature Off

    +     ServerTokens Prod

    +     Disabling the `ServerSignature` token instructs Apache to not print version
    information when an error page such as the 404 (Not Found) is displayed. The `ServerTokens`
    directive, when set to `Prod` instructs Apache to display only “Server: Apache”
    in the banner. If you do not want to display “Apache” in the Server tag, but you
    do want to display fake information such as “Server: Not-allowed,” you will need
    to


    +   1. Download the Apache source code.

    +   2. Edit the file httpd.h and change the value of the string “Apache” in the
    line,

    +      #define SERVER_BASEPRODUCT "Apache"

    +      to something else:

    +      #define SERVER_BASEPRODUCT "Not-allowed"

    +   3. Recompile, reinstall, and restart Apache.


    +   - Turn off automatic indexing. This will instruct Apache to not serve the
    directory listing if no default index file (such as index.html) is present. Use
    the `IndexIgnore` directive in httpd.conf to do this.

    +   - Configure Apache to not serve sensitive files such as .htaccess, .htpasswd,
    *.inc, *.jsp, *.java, or *.php. As an example, use the following directive in
    httpd.conf to restrict Apache from serving filenames beginning with .ht:

    +     <Files ~ "^\.ht">

    +     Order allow,deny

    +     Deny from all

    +     </Files>

    +   - Remove default manual pages.

    +   - Remove default and example CGI scripts and applications.'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'Use the `AccessFilename` directory to set the filename Apache must use for
    access control. This is generally set to `.htaccess`.


    Consider running Apache in a chrooted environment. See `http://hoohoo.ncsa.uiuc.edu/docs/tutorials/chroot.html`
    for detailed instructions.


    Make sure Apache is set to run under nonroot privileges. Look for the `User` and
    `Group` settings in `httpd.conf` and make sure these are set to a nonroot account
    such as `apache` or `httpd`.


    Logging is enabled using the `ErrorLog`, `CustomLog`, `LogLevel`, and `LogFormat`
    directives. Make sure these are set appropriately in `httpd.conf`.


    Disable modules that are not needed. Comment out the appropriate `AddModule` and
    `LoadModule` directive lines in `httpd.conf`.


    # Samba


    Samba uses the SMB (Server Message Block) protocol to share files and printers
    over the network. Follow these steps to harden Samba server configurations:


    Change the server string. Edit `smb.conf` and change

    ```

    server string = Samba Server

    ```

    to something else:

    ```

    server string = no information

    ```

    This will change the description field displayed next to each share name.


    In order to change the actual Samba version information, edit the `source/include/version.h`
    file and change the value of the constant `VERSION` to something else. You must
    recompile and reinstall Samba for the change to take effect.


    Edit `smb.conf` and set the value of the `hosts allow` option to restrict hosts
    that are allowed to connect to your server.


    Use password encryption. Set the value of `encrypt passwords` to `yes` in `smb.conf`.
    See `http://us1.samba.org/samba/tp/docs/ texdocs/ENCRYPTION.txt` for more information.


    If you have more than one network card, it is possible to instruct Samba to listen
    on only one particular interface. Use the `interfaces` option in `smb.conf` to
    specify which interfaces Samba must listen on.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '+   • Study the smb.conf file to make sure guest access isn''t granted to shares
    that store critical information.


    # ## NFS


    NFS (network file system) is a file system protocol that provides remote access
    to shared files across networks. Here are some steps you can take to harden NFS
    server configurations:


    +   - Export file systems as read-only. Consider not exporting them with write
    permissions. Use the `ro` option in `/etc/exports` or `/etc/dfs/sharetab` to specify
    shares to be read-only. Here is an example:

    +     `/share nfsclient_ip(ro)`


    +   - Prevent nonroot users from mounting NFS shares. To do this, edit `/etc/exports`
    or `/etc/dfs/sharetab` and make sure the `(secure)` option is present. For example:

    +     `/share nfsclient_ip(secure)`


    +   - Do not allow remote users to mount NFS shares with root permissions. This
    would allow them to modify root-owned files on the NFS share. Use the `root_squash`
    option in `/etc/exports` or `/etc/dfs/sharetab` to prevent this.


    +   - NFS clients must be configured to run non setuid programs on mounted shares.
    Otherwise, a malicious or compromised NFS server may place root setuid Trojan
    files on the exported share, and these will be executed as root on the client.
    Use the `nosuid` option when mounting NFS shares. If possible, also consider using
    the `noexec` option, which forbids execution of binaries on the NFS client.


    # ## SUMMARY


    It is very important to harden system configurations as much as possible. Password
    policies must be strictly enforced to ensure the use of strong passwords, and
    unnecessary services should be disabled if not in use. In addition, stack execution
    should be disabled to prevent many forms of buffer overflow attacks. Files such
    as `/.rhosts` and `/etc/hosts.equiv` must be routinely audited or removed if not
    being used. The `PATH` variable should not contain `""` in order to protect against
    Trojan executables. The hardening steps described in this chapter are strongly
    suggested to ensure secure configurations of remote services.'
  merge: -1
  img_proc: true
