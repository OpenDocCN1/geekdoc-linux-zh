- pgno: 145
  md: '# ## Samba Misconfigurations


    Samba is often misconfigured to share file systems with critical data. Remote
    users can exploit such a vulnerability to obtain sensitive system files located
    on the victim hosts.


    ![](img/77287f6ef97ef0bed6e23f6610950d06_145_0.png)


    # ## Enumerate and Mount Remote Samba Shares


    Use Samba''s smbclient command to look up what file shares are being exported
    by the remote system:


    ```

    ```

    [bash]$ smbclient -L smbserver -I 192.168.1.10 -U ''''

    added interface ip=192.168.1.1 bcast=192.168.1.255 nmask=255.255.255.0

    Password: [enter]

    Domain=[SOMECOMPANY]  OS=[Unix]  Server=[Samba 2.2.7]

    ```

    ```


    | Sharename | Type | Comment | | | | | | | | | | | | | | | | | | | | | | | | |
    | | | | | | | | | | | | | | | | | | | | | | | | | | | | | | |


    | Server | Comment | | | | | | | | | | | | | | | | | | | | | | | | | | | | | |
    | | | | | | | | | | | | | | | | | | | | | | | | | | |


    | Workgroup | Master | | | | | | | | | | | | | | | | | | | | | | | | | | | | |
    | | | | | | | | | | | | | | | | | | | | | | | | | | |


    Now, since the preceding server has obviously been misconfigured to serve the
    /etc directory to the world, it can be mounted with the following mount command:


    ```

    ```bash

    mount -t smbfs -o username='''' //192.168.1.10/etc /mnt/smbshare

    ```

    ```


    After mounting the /etc share, an intruder may grab the /etc/passwd file, which
    will be available on his or her host as /mnt/smbshare/passwd.


    ![](img/77287f6ef97ef0bed6e23f6610950d06_145_1.png)


    # ## Block and Tunnel Samba Traffic


    If running Samba, please consider the following suggestions:


    +   - Configure your firewall to block Samba traffic.


    +   - Consider using SSH to tunnel Samba traffic:


    ```

    ```bash

    ssh username@remotesmbserver.somecompanyasanexample.com -L139:127.0.0.1:139

    ```

    ```


