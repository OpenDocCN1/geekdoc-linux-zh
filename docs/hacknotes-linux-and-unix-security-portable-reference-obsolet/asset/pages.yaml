  md: '**Software Vulnerabilities** BIND (Berkeley Internet Name Domain) is the most
    widely-used DNS server on the Internet. The next paragraph documents a well-known
    BIND vulnerability.


    +   * **BIND NXT Overflow and DOS Vulnerabilities** This vulnerability was caused
    by BIND''s failure in processing input validation of NXT records. It is possible
