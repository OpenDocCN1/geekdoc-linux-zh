    # ## Common Defenses Against Software Vulnerability Exploits


    Sometimes, remote exploits for software vulnerabilities are made available before
    vulnerability advisories or patches are announced. Such exploits are commonly
    referred to as *zero-day exploits*. It is impossible to protect against exploits
    that target unannounced vulnerabilities. However, every system administrator must
    watch and act against unusual system activities in addition to following these
    recommendations:


    +   ■ Keep up-to-date with software patches.


    +   ■ Subscribe to vulnerability watch lists such as Bugtraq. (Visit **http://securityfocus.com/cgi-bin/sfonline/subcribe.pl**
    for more information.) See the “Online Resources” section in the Reference Center
    of this book for pointers to many other security resources.


    +   ■ To prevent some types of buffer overflows, a few solutions are available:


    +   ■ StackGuard: **http://www.immunix.org/stackguard.html**


    +   ■ Libsafe: **http://www.research.avayalabs.com/project/libsafe/**


    +   ■ StackGhost: **http://stackghost.cerias.purdue.edu/**


    +   ■ Openwall: **http://www.openwall.com/linux**


    If using Solaris, edit */etc/system* and add the following lines:


    ```

    ```

    set noexec_user_stack=1

    set noexec_usr_stack_log=1

    ```

