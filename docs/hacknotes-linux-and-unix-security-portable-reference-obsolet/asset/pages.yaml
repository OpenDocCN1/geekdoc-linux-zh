- pgno: 58
  md: '**Footprinting** is the process of accumulating preliminary data about a target
    using publicly available methods. This information can be used to gain a better
    understanding of the target’s network architecture. This first chapter covers
    different ways and techniques of gathering such information, including the use
    of search engines and of domain and network block registrars. Through the least
    glamorous aspect of hacking methodology, the process of footprinting is an important
    first step.


    # SEARCH ENGINES


    Search engines can be used to find interesting details and links that may lead
    to sensitive information. Since queries are performed on the search engine’s database,
    they are not noticeable in the target web server’s logs unless a resulting URL
    is accessed directly.


    There exist many ways to perform creative queries for sensitive data. The sections
    that follow offer a few ideas.


    # ### Searching Job Postings for Administrative Weaknesses


    A lot of firms advertise available job positions, which can provide a wealth of
    information about their security posture. For example, if a company is actively
    recruiting firewall specialists, their firewall configurations may be weak, and
    this fact provides a hacker with more direction on where to focus. Résumé services
    such as http://www.monster.com/ are places where potential intruders are known
    to look for such information.


    # ### Searching EDGAR


    The EDGAR ("Electronic Data Gathering, Analysis, and Retrieval") database contains
    information about publicly traded companies. Details such as company acquisitions
    are of special interest, since large organizations tend to have trouble managing
    their network security during the initial phase of a merger. The EDGAR database
    can also be used by potential intruders to gather the target organization’s quarterly
    and yearly reports, which may help a potential intruder gain a better understanding
    of the organization’s recent activities. The EDGAR system is located at http://www.sec.gov/edgar.shtml.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Looking for Sensitive Information in Log Files


    Many programs are known to write to specific log files. Sometimes, these log files
    are accidentally placed within the web root of the web server. For example, a
    query such as: “**Index of**/ **dead.letter** on http://www.google.com/ will provide
    you with links to web servers serving the file dead.letter (see Figure 1-1). Note
    that the dead.letter file is created by some e-mail clients when a user cancels
    sending an e-mail, and it may contain part of the e-mail being composed. This
    file, along with other such log files, may provide critical and confidential information
    to potential intruders.


    ![](img/77287f6ef97ef0bed6e23f6610950d06_59_0.png)


    Figure 1-1. Contents of a user’s dead.letter file being served by a web server


    Search Engines'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'There are many other well-known log files that can be searched for. Some other
    examples are syslog, maillog, spooler, messages, access_ log, and error_log.


    # ## Searching for Web-Server Statistics


    Various web applications are used to provide administrators with sta- tistics
    of web traffic. Such statistics are mostly password protected and can contain
    confidential information and URLs. Search engines can be used to find misconfigured
    hosts, which serve such data. For example, a search such as **“Index of”** stats
    on **http://www.google.com** may expose the location of web servers that have
    been misconfigured to serve server statistics to unauthenticated external entities
    (see Figure 1-2).


    ![](img/77287f6ef97ef0bed6e23f6610950d06_60_0.png)


    | Hits | Bytes | Document |

    |---|---|---|

    | 39210 | 231455139 | / |

    | 24056 | 20431305 | CGI Counter |

    | 18231 | 19331210 | 404 Not Found |

    | 6310 | 13213563 | /slides |

    | 4319 | 13567849 | /cgi/showcalendar.pl |

    | 1949 | 2098321 | /users/joe/placestoeat.html |

