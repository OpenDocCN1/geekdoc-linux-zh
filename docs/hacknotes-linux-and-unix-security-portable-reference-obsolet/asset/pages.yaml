    # POP2 (Post Office Protocol 2): 109 (TCP)


    POP2 is a protocol used to access e-mail from a mailbox server.


    **Brute-Forcing** Since POP2 authentication is done using a username and password
    pair, the protocol is susceptible to a brute-force attack.


    **Sniffing** Since POP2 is a clear-text protocol, it is possible to sniff POP2
    traffic being transmitted over a network.


    # Sniff POP2 Traffic


    It is possible to sniff POP2 data using a tool such as Ettercap. When used with
    the `~C` option, the `ettercap` command automatically filters and displays POP2
    usernames and passwords that are transmitted across the network.


    # Tunnel POP2 Traffic via SSH


    Use SSH''s port forwarding options to tunnel POP2 traffic securely:


    ```

    ssh -L109:127.0.0.1:109

    username@pop2server.somecompanysanexanmple.com

    ```'
