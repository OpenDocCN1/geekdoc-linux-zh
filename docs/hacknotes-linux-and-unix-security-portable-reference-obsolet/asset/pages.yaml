    \ be set on such files. Consider /dev/hda*, which represents IDE disks in Linux.\
    \ If these files are readable by the world, malicious users will have read permissions\
    \ to all data on the disks! Use the mount command to find out the /dev files associated\
    \ with mounted drives on a system.\n\nIn addition, ensure that proper permissions\
    \ are set on other device files, such as /dev/console, /dev/tty/*, /dev/pty/*,\
    \ /dev/audio, and /dev/dsp*.\n\n# DISK PARTITIONS\n\nA malicious user may launch\
