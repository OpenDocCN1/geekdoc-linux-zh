- pgno: 224
  md: 'ireless networks are a breeze to set up and a boon for those

    who abhor having to be tied to Ethernet cables. They are also a

    nightmare from a security point of view due to the vulnerabil-

    ity of the Wired Equivalent Privacy (WEP) protocol used in the 802.11b

    standard. Because of freely available open source tools such as Airospot

    and Kismet, it is possible for anyone with a wireless network card and a

    laptop to intrude into wireless networks. Individuals have been known

    to go driving around town while looking for corporations whose wire-

    less network ranges may extend beyond their office space to reach ac-

    cessible spots such as parking lots, an activity termed as “war driving.”

    Unfortunately, many wireless network administrators do not realize

    this and are unaware of their susceptibility to such intruders. This chap-

    ter describes the tools and techniques used by intruders to obtain access

    into wireless networks, and it includes suggestions on how to better secure

    against them.


    # INTRODUCTION TO WEP


    Since WEP is based on a symmetric shared-key system, it uses the same

    key to encrypt and decrypt data. The keys (k), which are either 128 bits

    or 64 bits long, consist of a 24-bit Initialization Vector (IV). A WEP pay-

    load is constructed as follows:


    +   1. Message M is concatenated with its own CRC-32 checksum: c(M):


    M c(M)


    +   2. The IV is applied before the secret key and passed through the

    +   RC4 stream cipher algorithm:


    RC4(IV,k)


    +   3. The results of steps 1 and 2 are XOR’d (eXclusive OR’d) to

    +   produce the cipher text. The IV is then concatenated with the

    +   cipher text to produce the WEP payload:


    IV Ciper-text = ((M),c(M)) XOR (RC4(IV,k))


    As is evident from the preceding steps, the WEP frame contains the IV

    in clear text. Many wireless cards pick their IVs at random, while others

    start from 0 and increment them sequentially. Since the IV is only 24 bits

    long, a wireless card or access point will reuse one every few hours.'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'Note that the frame that is finally transmitted consists of, among other information,
    the MAC (Media Access Control) source and destination information in clear text.


    Tools such as Aircrort exploit weaknesses in the Key Scheduling Algorithm (KSA)
    of RC4. Details of these weaknesses are presented in a research paper written
    by Scott Fluhrer, Islik Mantin, and Adi Shamir. This paper can be accessed by
    requesting the following URL: http://www.drizzle.com/~aboba/IEEE/rc4_ksa proc.pdf.


    # ANTENNAS


    It is very important to find the right antenna to use while auditing an area for
    wireless activity. With the use of an antenna, one may receive wireless signals
    from networks that would not otherwise be possible to detect.


    **Directional** As the name suggests, directional antennas focus on a particular
    direction to receive and send signals. These antennas are most useful for creating
    wireless bridges between two locations. Directional antennas are commonly used
    to establish point-to-point links between two remote locations. Therefore, they
    are not of much help when in motion and when the direction of the signal is unknown.
    Popular types of directional antennas include yagi and parabolic forms.


    **Omnidirectional** Omnidirectional antennas are commonly used to extend the range
    of access points. They transmit and receive signals in all directions. Therefore,
    omnidirectional antennas are popular with individuals conducting “war-driving”
    tests. Here is a list of popular vendors that specialize in antennas:


    +   * Fleeman Anderson & Bird Corp: http://fab-corp.com/

    +   * HyperLink Technologies: http://www.hyperlinktech.com/

    +   * NetNimble: http://www.netnimble.net/

    +   * SuperPass: http://www.superpass.com/

    +   * Wireless Central: http://wirelesscentral.net/


    Want to build your own low-cost antenna? Visit “802.11b Homebrew Antenna Shootout”
    at http://www.turnpoint.net/wireless/has.html.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# POPULAR TOOLS


    Airsnot and Kismet are the most popular and useful wireless hacking tools. They
    can be used to detect wireless networks and to crack encryption keys of WEP-enabled
    networks.


    > In the case of WEP-enabled networks, the first step an intruder must take is
    to gain the WEP encryption key by using tools such as Airsnot. After the key is
    obtained and the intruder has successfully joined a wireless network, he or she
    may use popular tools such as Ettercap, tcpdump, and Etherleato analyze network
    traffic.


    # Airsnot


    Airsnot, shown in Figure 11-1, is a Linux-based network sniffing tool that passively
    monitors wireless transmission in order to break the WEP encryption keys. Airsnot
    is available at **http://airsnot.shmoo.com/**. Currently, Airsnot supports the
    following wireless network cards:


    +   - Cisco Aironet.

    +   - Prism2 based cards. See **http://www.linux-wlan.org/** for a list of supported
    cards.

    +   - Orinoco cards. Download driver patch and information from **http://airsnot.shmoo.com/orinocoinfo.html**.


    Please see the Airsnot FAQ for answers to common problems and questions. It is
    available at **http://airsnot.shmoo.com/faq.html**.


    ![](img/77287f6ef97ef0bed6e23f6610950d06_226_0.png)'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# Kismet


    Kismet, shown in Figure 11-2, is a wireless network sniffer that can be used to
    capture and view information about the wireless networks in an area. It boasts
    the following features:


    +   - Ncurses interface

    +   - Channel hopping

    +   - Multiple packet sources

    +   - IP block detection

    +   - Support for GPS mapping using gpgsmap

    +   - On-the-fly WEP decryption


    ...and many others. Visit **http://www.kismetwireless.net/documentation.shtml**
    for more information.


    See **http://www.tipsybottle.com/technology/wireless/RedHat8-Kismet-HOWTO.shtml**
    for detailed instructions on how to install and use Kismet on Linux. Most of the
    instructions contained in this article apply to Airosurf as well.


    # Fata-Jack


    Fata-Jack is a modified version of the Wlan-Jack tool. It sends an authentication
    request to an access point with the source address of an associated client. This
    authentication packet is purposefully crafted to contain


    ![](img/77287f6ef97ef0bed6e23f6610950d06_227_0.png)


    **Figure 11-2**. Kismet in action'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'invalid information. When the access point receives this packet, it un-authenticates
    the client whose address was spoofed. The victim client must now reauthenticate
    with the AP. Therefore, a malicious user that has access to a network''s AP may
    launch a denial of service attack using this tool.


    Fat-a-Jack is available for download from http://www.loud-fat-bloke.co.uk/w% 080211.html.
    Information about Wlan-Jack is available at http://80.211.ninja.net/.


    # SECURING WIRELESS NETWORKS


    Using tools such as Airospot, about 5,000,000–10,000,000 packets are often sufficient
    in order to crack the WEP secret key. Normally, a reasonably active network will
    transmit that number of packets in a matter of a few hours. Therefore, it becomes
    necessary to ensure adequate security when deploying and administering a wireless
    network. Here are a few suggestions:


    +   Deem the network as “not-trusted”  Wireless networks must be treated as untrusted
    and separate from the internal networks of an organization. If it becomes necessary
    to allow wireless users to access a trusted network, it is suggested that a VPN
    (Virtual Private Network) be set up so that a wireless user may connect using
    a VPN client that supports encryption. Also consider using access points that
    support LEAP (Lightweight Extensible Authentication Protocol). In addition, encourage
    the use of network devices that use the WEP-Plus algorithm to avoid transmitting
    frames with weak initialization vectors in order to stop software such as Airospot
    from succeeding in cracking the WEP encryption keys.


    +   Encourage the use of tools that use encryption  Tools such as SSH help create
    encrypted tunnels and should be used whenever possible. Intranet web sites must
    support SSL.


    +   Do not allow access points to be administered wirelessly  Some access points
    allow wireless administration to be disabled. This is a good idea, since it would
    require physical access to the access point in order to configure it.


    +   Change the default ESSID and disable broadcast  The ESSID (Extended Service
    Set ID) is a string that is input to the access points and Ethernet cards as a
    configuration parameter. Devices with the same ESSID participate in the same network.
    Access points are factory configured with a certain default ESSID, usually the
    name of the vendor. It is a good idea to change such default'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'ESSIDs. Many access points also broadcast their ESSID in order to allow wireless
    clients to choose from the available networks. It is suggested that the access
    point be configured to disable this feature, since it broadcasts information about
    the network to those who are not authorized to use the network. Note that this
    step does not guarantee much security and should not be relied upon.


    5. **MAC address filtering** Consider taking advantage of access points that support
    MAC address filtering by allowing only selected clients with known MAC addresses
    to use the network. This, however, will not deter the sophisticated hacker, since
    MAC addresses of legitimate users will be transmitted in clear text. These addresses
    can be sniffed off the air and can be spoofed in order to gain access to the network.
    It is quite an ordeal to maintain a list of authorized MAC addresses, and so this
    may not be feasible to implement in the case of large organizations.


    # # SUMMARY


    After an introduction to the WEP protocol, this chapter focused on the description
    of wireless security tools that can be used to abuse and detect wireless network
    weaknesses. The popular Airosnort tool can be used to crack WEP encryption keys
    in use on a wireless network. The Kismet wireless sniffer can be used to detect
    and identify wireless networks in an area. The Fata-Jack program can be used to
    cause a denial of service attack against wireless network hosts. The advantages
    and uses of different types of wireless antennas were also discussed. Finally,
    this chapter presented recommendations on how to better secure wireless networks
    against intrusion attempts. Wireless network administrators are therefore strongly
    encouraged to understand and act upon the suggestions presented in this chapter.'
  merge: -1
  img_proc: true
