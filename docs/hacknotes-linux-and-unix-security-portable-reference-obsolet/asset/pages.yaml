    # NNTP (Network News Transfer Protocol): 119 (TCP)


    NNTP is a protocol for the distribution, inquiry, retrieval, and posting of news
    articles.


    **Brute-Forcing** Many NNTP servers do not require authentication. However, brute-forcing
    tools such as Hydra can be used to brute-force NNTP servers requiring authentication.


    # Brute-Force NNTP


    Use Hydra to brute-force NNTP accounts. Here is an example of how this can be
    done:


    ```

    hydra -L usernames.txt -P passwords.txt 10.0.0.1 nntp

    ```


    # Prevent NNTP Brute-Forcing


    Please see “Common Defenses Against Brute-Force Attacks.”


    **Sniffing** Since NNTP is a plain-text protocol, it is possible to sniff NNTP
    data being transmitted on a network.


    # Sniff NNTP Authentication Data


    Tools such as Ettercap can be used to sniff NNTP traffic across a network. Here
    is how you would use Ettercap to capture NNTP authentication data:


    ```

    ettercap -C -N -m

    ```


    # Tunnel NNTP through SSH


    Use SSH to tunnel NNTP traffic securely:


    ```

    ssh username@remotenntpaserver.somecompanyasanexample.com -L119:127.0.0.1:119

    ```'
