- pgno: 122
  md: '**SSH Man-in-the-Middle Attacks** SSH is susceptible to man-in-the-middle attacks
    by malicious users on the same network segment.


    # ### Sshmitm and Ettercap


    Tools such as `sshmitm` and Ettercap can be used to proxy an SSH connection, while
    a tool such as `dnsspoof` can be used to forge replies to DNS queries in order
    to redirect the victim’s SSH client to connect to a proxy SSH server. However,
    the victim’s SSH client will most likely warn the user about a change in the host
    key of the server, since the host key being presented will be that of the attacker’s
    proxy SSH server. Unfortunately, most end users do not take this warning seriously
    and accept the key being presented, causing such attacks to succeed.


    # ### Preventing Man-in-the-Middle Attacks Against SSH


    Educate users to not accept unknown host keys from remote SSH servers. If possible,
    list a fingerprint of these keys on an intranet resource so that users may verify
    it before accepting SSH sessions.


    # **Software Vulnerabilities**


    Multiple versions of SSH software have been known to have vulnerabilities. The
    next paragraph documents a recent one.


    # **Open SSH Challenge-Response Buffer Overflow**


    Various implementations of OpenSSH were found to be vulnerable to a buffer overflow
    attack focusing on its challenge-response mechanism. The buffer overflow condition
    existed on OpenSSH servers that were compiled to support `SKEY` or `BSD_AUTH`
    authentication.


    In addition, another vulnerability was found to exist in OpenSSH’s challenge-response
    mechanism. This vulnerability was caused by OpenSSH’s incorrect handling of the
    responses received during challenge-response authentication. Systems using PAM
    modules supporting interactive keyboard authentication were susceptible to this
    vulnerability. Therefore, systems with the following options turned on were affected:


    ```

    PAMAuthenticationViaKbdInt

    ChallengeResponseAuthentication

    ```


    See [http://online.securityfocus.com/bid/5093](http://online.securityfocus.com/bid/5093)
    for more information.


    # ## Telnet: 23 (TCP)


    Telnet is a clear-text protocol used to log in to remote machines.


    # ## Brute-Forcing


    It is possible to brute-force FTP accounts by using a number of publicly available
    tools such as Hydra.'
