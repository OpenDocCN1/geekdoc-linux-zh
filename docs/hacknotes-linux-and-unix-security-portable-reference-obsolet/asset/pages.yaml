    # # IP Protocol


    The aim of this type of scan is to determine which IP protocols are supported
    on the target host. It sends raw IP packets destined for particular protocols,
    and if an ICMP protocol unreachable message is received, then the particular protocol
    is most likely unsupported on the target host.


    # ## IP Protocol Scanning


    Using the `-sO` flag in nmap will perform an IP protocol scan:


    ```

    (bash)# nmap -sO 192.168.1.1

    ```


    Starting nmap V. 3.00 ( www.insecure.org/nmap/ )

    Interesting protocols on  (192.168.1.1):)

    (The 251 protocols scanned but not shown below are in state: closed)


    | Protocol | State | Name |

    |----------|-------|------|

    | 1 | open | icmp |

    | 2 | open | igmp |

    | 6 | open | tcp |

    | 17 | open | udp |


    # # ACK


    This type of scan is mainly used to determine firewall rule sets. ACK packets
    are sent to the target host. If the target host does not respond or sends back
    an ICMP\u2019unreachable packet, then the port is probably being filtered by a
    firewall. If the target sends back a RST packet, then the port is not being filtered
    by a firewall.


    # ## ACK Scanning


    ACK scans can be performed by using nmap with the `-sA` flag:


    ```

    nmap -sA target_address

    ```'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# ### Window


    This type of scan, while similar to the ACK scan, sometimes helps detect open,
    filtered, and unfiltered ports on some systems due to an anomaly in the way TCP
    window sizes are reported.


    # ### Window Scanning


    Window scans can be performed by potential intruders using `nmap` with the `-sW`
    flag:


    ```

    ```

    nmap -sW target_address

    ```

    ```


    # ## UDP


    In order to determine if a host is listening on a particular UDP port, a UDP packet
    is sent to the port. If the target host is not listening on the particular port,
    an ICMP port unreachable packet is received. However, if the target host is listening
    on the particular port, no such packet is received. Since UDP is not a connection-oriented
    protocol, UDP scanning is unreliable.


    # ### UDP Port Scanning


    Using the `-sU` option in `nmap` will perform UDP scanning:


    ```

    ```bash

    $ nmap -sU 192.168.1.100


    Starting Nmap 7.54BETA31 ( https://nmap.org/ )

    Interesting ports on (192.168.1.100):

    (The 1454 ports scanned but not shown below are in state: closed)

    PORT      STATE         SERVICE

    53/udp    open          domain

    ```

    ```


    # ### Defend Against Port Scans


    You can use these methods to counter scans directed at your networks:


    +   * Configure your firewall to drop packets destined for closed ports. This
    will slow down scans directed toward your network, since this will cause the port
    scanning applications to resend SYN packets after the timeout value is exceeded.
    Only after repeated timeouts, the port scan application will assume the port to
    be filtered, and will move on to the next set of ports.

    +   * Most firewalls and IDSS have the ability to detect port scans. Make use
    of this feature, and routinely watch your logs.'
  merge: -1
  img_proc: true
- pgno: 86
  md: "+   ■ Configure your firewall to not trust source port values. Stateful firewalls\
    \ have the ability to allow source port 20 packets only from FTP servers to whom\
    \ connections are known to have been established. In any case, the use of a clear-text\
    \ protocol such as FTP is not recommended. Better alternatives (such as SSH) exist\
    \ and should be used instead. In addition, do not allow incoming TCP packets with\
    \ the source port set to 53 unless they are destined for your DNS servers that\
    \ need to perform zone transfers. Restrict DNS traffic by IP addresses of the\
    \ DNS servers authorized to serve your hosts. ■ Most FTP servers do not allow\
    \ clients to issue a PORT command with the IP address of a host other than that\
    \ of the client. This will prevent FTP bounce scans. Check your FTP server documentation\
    \ and configurations for details. ■ Configure your firewalls to drop or reset\
    \ connection attempts to the ident port (113). ■ Use a stateful firewall. This\
    \ will prevent most of the scans mentioned in the preceding text.\n\n# ## FINGERPRINTING\n\
    \nThough many operating system designers do their best to follow relevant RFCs,\
    \ the operating system kernel authors sometimes interpret details differently.\
    \ Tools such as Xprobe2 and Nmap probe for such differences in order to fingerprint\
    \ the target operating systems.\n\n# ### Fingerprinting Operating Systems Using\
    \ Xprobe2\n\nXprobe2 uses ICMP packets to perform fingerprinting. Results are\
    \ sorted by scores assigned to best guesses of the target operating systems. This\
    \ tool, which has the ability to distinguish between filtering devices along the\
    \ path to the destination, is available at http://www.sys-security.com/html/tools/tools.html.\n\
    \nHere is an example of how to use Xprobe2:\n\n```\n```bash\n# xprobe2 -v target.somecompanyasanexample.com\n\
    \nXprobe2 v.0.1 Copyright (c) 2002 Fygrave@tigerteam.net,\nofir@sys-security.com\n\
    \n[+] Target is target.somecompanyasanexample.com\n[+] Loading modules.\n[+] Following\
    \ modules are loaded:\n    [x]ICMP echo (ping)\n    [x]TTL distance\n    [x]ICMP\
    \ echo```\n```"
  merge: -1
  img_proc: true
