- pgno: 88
  md: '# Using nmap to Perform Operating System Fingerprinting


    The nmap program can also be used by an intruder to perform an OS fingerprint,
    using the -O flag:


    ```

    [bash]# nmap -O 192.168.1.1

    ```


    Starting nmap V. 3.00 ( www.insecure.org/nmap/ )

    Interesting ports on (192.168.1.1):

    (The 1597 ports scanned but not shown below are in state: closed)

    Port          State  Service

    22/tcp        open   ssh

    80/tcp        open   http

    113/tcp       open   auth

    6000/tcp      open   X11

    Remote operating system guess: Linux Kernel 2.4.0 - 2.5.20

    Uptime 6.584 days (since Sun Oct 27 10:23:37 2002)


    Nmap run completed -- 1 IP address (1 host up) scanned in 8 seconds


    # SUMMARY


    Hosts can be pinged in order to quickly determine if they are alive. In addition,
    various port scanning techniques can be used to determine what ports are open
    on the alive hosts. Operating System fingerprinting tools can then be used to
    recognize the Operating System versions on the target hosts. Once an intruder
    has followed such a methodology, he or she can then move on to the process of
    username and service enumeration as described next, in Chapter 3.'
  merge: -1
