- pgno: 190
  md: '+   Make sure \`/etc/ftpusers\` contains a list of users that should not be
    allowed to FTP in. Users such as root, bin, and httpd should not be allowed to
    FTP in.


    +   Edit inetd.conf or \`/etc/xinetd.d/ftp\` and make sure that in.ftpd is called
    with the \`-1\` flag. This enables logging.


    +   If anonymous upload is allowed, the uploaded files must not be visible, and
    downloading of uploaded files should be prohibited. Otherwise, your FTP server
    may be abused by software pirates. See \`http://www.wu-ftpd.org/HOWTO/upload.conf\`
    for details.


    +   Use a chrooted FTP environment, especially for anonymous access. See \`http://www.wu-ftpd.org/HOWTOguest.HOWTO\`
    for detailed instructions on how to set this up.


    Consider using ProFTPD as a replacement for WU-FTPD, because it has not proved
    susceptible to as many remote vulnerabilities as WU-FTPD. ProFTPD is available
    at \`http://www.proftpd.org/\`.


    # SSH


    SSH is a secure protocol for exchanging data. It can be used to log in to remote
    machines, execute commands remotely, and transfer files. Since communication within
    SSH is encrypted, it is a worthy replacement for remote-login solutions such as
    telnet, rlogin, and FTP. Take these measures to harden SSH:


    +   Make sure SSH protocol version 1 is disabled. The \`sshd_config\` file must
    contain the following line: \`Protocol 2\`


    +   The root user should not be allowed to SSH in. Make sure the following line
    is present in \`sshd_config\`: \`PermitRootLogin no\`


    +   Private key files such as \`ssh_host_key\`, \`ssh_host_dsa_key\`, and \`ssh_host_rsa_key\`
    should be readable only by root.


    +   Make sure Privilege Separation is turned on. The following line must be present
    in \`sshd_config\`: \`UsePrivilegeSeparation yes\`


    # Sendmail


    Sendmail is the most popular MTA (mail transfer agent) on the Internet. To harden
    Sendmail, make sure to take the following measures:'
  merge: -1
