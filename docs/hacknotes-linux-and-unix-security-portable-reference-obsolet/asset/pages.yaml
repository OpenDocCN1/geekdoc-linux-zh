- pgno: 90
  md: 'After performing port scans on target hosts, an intruder will know exactly
    which hosts are alive and what ports they have open. Armed with this information,
    the logical next step is to enumerate information such as usernames, file shares,
    and operating system and application version numbers from services listening on
    the specific ports. Only after obtaining such information may an attacker move
    on to exploiting particular vulnerabilities as discussed in the next chapter.


    Many remote service daemons display a banner message when a connection is made
    to port they are listening on. Banner messages can give up information about services,
    such as their identity and version information. The process of obtaining banners
    from remote services is known as *banner grabbing*. Since most daemons allow their
    banners to be changed, you should take advantage of this capability.


    > Although it is a good idea to change server banners in order to confuse potential
    intruders, keep in mind that it will not deter the more sophisticated attackers.


    # ENUMERATE REMOTE SERVICES


    What follows is a list of services that are known to be susceptible to enumeration.
    They are sorted by the port numbers they usually listen on (see the file /etc/services
    on your Unix or Linux host for a comprehensive list).


    # Identify Remote Services Using Amap


    Any of the services listed here can be configured to listen on a nonstandard port.
    Some services use non-ASCII characters to communicate, and are difficult to manually
    identify. Tools such as Amap, available at <http://www.thehackerschoice.com/releases.php>,
    can be used to determine such services:


    ```

    ```

    [bash]$ amap -sT intranet.somecompanyasexample.com 9934

    Total amount of tasks to perform: 15

    Amap v1.2.1b started at Sun Mar 9 09:30:22 2003, stand back and keep the children
    away.

    Protocol on IP 192.168.1.3 port 9934 tcp matches ssl

    Protocol on IP 192.168.1.3 port 9934 tcp matches http

    Unidentified ports: None.

    Amap v1.2.1b ended at Sun Mar 9 09:30:59 2003

    ```

    ```


    In this example, Amap successfully discovered that host *intranet.somecompanyasexample.com*
    was running HTTPS on port 9934. This is useful information, since the standard
    reserved port for HTTPS is 443.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# Block and Stop Unnecessary Services


    Some services are configured to accept connections from any source IP address.
    For example, an HTTP server for an e-commerce organization must accept connections
    from any IP address in order to allow remote users in all locations to view the
    organization’s web site. In such a case, it is impossible for an organization
    to hide the fact that they are running an HTTP server.


    However, depending on the organization’s requirements and network architecture,
    some services may only expect connections originating from authorized IP addresses.
    In such cases, firewall rules should be put in place to ensure that connections
    originating from unauthorized IP addresses are blocked. In addition, unnecessary
    services must be turned off or blocked by firewall rules. This will prevent the
    exploitation and identification of services that should not be accessible by unauthorized
    remote hosts.


    # FTP (File Transfer Protocol): 21 (TCP)


    FTP, as the name suggests, is a protocol for transferring files from one host
    to the other.


    # Obtain the FTP Server Banner


    FTP servers usually print version information when connected to. An FTP client
    can be used to connect to an FTP server in order to obtain its banner. For example:


    ```

    [bash]$ ftp 192.168.1.1

    Connected to 192.168.1.1 (192.168.1.1).

    220 192.168.1.1 FTP server (Version wu-2.6.2+Sun) ready.

    Name (192.168.1.1:username):

    ```


    The telnet client can also be used to connect to the FTP port directly to obtain
    the banner information:


    ```

    [bash]$ telnet 192.168.1.1 21

    Trying 192.168.1.1...

    Connected to 192.168.1.1.

    Escape character is ‘^]’.

    220 192.168.1.1 FTP server (Version wu-2.6.2+Sun) ready.

    ```


    ![](img/77287f6ef97ef0bed6e23f6610950d06_91_0.png)


    ![](img/77287f6ef97ef0bed6e23f6610950d06_91_1.png)'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# **Change the FTP Server Banner**


    If you are running a WU-FTPD server, edit the /etc/ftpaccess file and use the
    greeting directive to change the server banner. For example:


    ```

    greeting text No banner information available. Sorry.

    ```


    # **SSH (Secure Shell): 22 (TCP)**


    SSH is a secure protocol for exchanging data. It can be used to log in to remote
    machines, execute commands remotely, and transfer files. Since communication within
    SSH is encrypted, it is a worthy replacement for remote-login solutions such as
    telnet, rlogin, and FTP.


    # **Obtain the SSH Server Banner**


    Although SSH communication is encrypted, the SSH daemons do print out version
    information in clear text when connected to with a telnet client:


    ```

    ```

    [bash]$ telnet 192.168.1.1 22

    Trying 192.168.1.1...

    Connected to 192.168.1.1.

    Escape character is ''^]''.

    SSH-1.99-OpenSSH_3.4p1

    ```

    ```


    # **Change SSH Version Information**


    The version information displayed by the banner, “OpenSSH_3.4p1”, in the preceding
    example, may be changed by obtaining and editing the OpenSSH source. Use the grep
    command to find the version string within the obtained OpenSSH source code. Once
    this string has been changed, recompile and reinstall OpenSSH.


    > The banner also displays the protocol version information, “SSH-1.99”, in the
    preceding example. Do not change or remove this information since SSH clients
    use this string to recognize protocol and server information. Changing this value
    may cause some SSH clients to stop functioning properly.


    # **Telnet: 23 (TCP)**


    Telnet is a clear-text protocol used to log in to remote machines.'
