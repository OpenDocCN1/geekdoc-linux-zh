    # ## Use Secure Protocols


    Do not use clear text protocols such as FTP. Consider using HTTPS or SSH to perform
    secure file transfers.


    **FTP Misconfigurations**  FTP clients and servers are susceptible to remote exploitation
    due to misconfiguration issues. The following paragraphs cover the most popular
    attacks against such misconfigurations.


    # ## Bounce Attacks


    Due to the design of the FTP protocol, when an FTP client requests a data transfer
    using “active” mode, the FTP server must initiate a connection back to a port
    on the FTP client. FTP clients issue a PORT command with their IP address and
    listening port number as parameters. If the FTP client issues a PORT command with
    the IP address of another host, then the FTP server will attempt to connect to
    that host. Therefore, this feature of the FTP protocol can be used to proxy port
    scans. You can perform such a scan by making use of nmap’s -b option.


    Once the PORT command is issued, a RETR command can be executed by a malicious
    client to send files containing commands to the FTP server. This will cause the
    FTP server to dump the contents of the given file to a given port of the host
    specified by the PORT command. This file could contain SMTP commands, for example,
    enabling a malicious FTP client user to proxy e-mails via the FTP server.


    # ## Prevent Bounce Attacks from Succeeding


    Make sure the following precautions have been taken in order to protect against
    FTP bounce attacks:


    +   - Configure your FTP server to refuse connections to IP addresses other than
    the client when a PORT command is issued. Most recent FTP servers do this by default.

    +   - Instruct your firewall not to allow incoming connections with a source port
    of 20. Note, though, that this rule may block legitimate connections.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# ## Connection Theft


    When an FTP client sends a PASV (passive) command after a PORT command along with
    its IP address and port number, the server begins to listen for a connection at
    the requested port. At this time, a malicious user may connect to the server’s
    port before the client. Depending on the next command issued by the FTP client,
    the malicious user may now have access to the data transmitted.


    If passive mode is not used, then the FTP session resorts to “active” mode. In
    this mode, it is the client that begins to listen at a specified port. At this
    time, an attacker may connect to the client before the FTP server. Depending on
    the next command issued by the client, the attacker may pose as the legitimate
    server and may transmit modified files or data to the client.


    ![](img/77287f6ef97ef0bed6e23f6610950d06_120_0.png)


    # ## Prevent Connection Theft Attacks


    The following recommendations will help protect against connection theft attacks:


    +   - Configure your FTP server to only allow connections to its data ports from
    the IP address of an authenticated client. Most FTP servers do this by default.
    Note that this might not prevent attacks where both the attacker and the legitimate
    FTP user are behind the same NAT gateway, since their source IP addresses will
    be the same.


    +   - Configure your FTP client to only accept connections from the FTP server
    to which it is connected.


    **Software Vulnerabilities** WU-FTPD is the most widely used FTP daemon on Unix
    and Linux. Unfortunately, its history has been plagued by vulnerabilities for
    which many remote exploits have been known to exist. Following is a list of some
    known WU-FTPD vulnerabilities:


