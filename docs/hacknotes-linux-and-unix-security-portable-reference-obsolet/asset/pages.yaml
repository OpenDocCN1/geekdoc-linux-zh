- pgno: 216
  md: 'Nessus is a free and open-source security scanner that is available from http://www.nessus.org/.
    This chapter provides a step-by-step example on how to write a vulnerability check
    plug-in for Nessus using NASL (Nessus Attack Scripting Language). Since NASL is
    specifically geared toward writing Nessus plug-ins, we makes the development of
    these plug-ins easy and straightforward. A list of publicly available plug-ins
    for Nessus can be found at http://cgi.nessus.org/plugins/.


    > Filenames of plug-ins written using NASL end with the extension ".nasl". Since
    NASL is an interpreted language, these files are also referred to as NASL "scripts."


    # RUNNING NASL SCRIPTS FROM THE COMMAND LINE


    Look in the plugins directory of your Nessus installation to find all the NASL
    scripts that come bundled with every Nessus distribution. NASL scripts can be
    run from the command line using the nasl interpreter:


    ```

    nasl -t target_ipaddress script.nasl

    ```


    # WRITING NESSUS PLUG-INS USING NASL


    In this section, we will look at an example of how to use NASL to write a vulnerability
    check plug-in. But first, we must come up with an example vulnerability to check
    against. Once we have identified the vulnerability, we can detect it using Nessus
    by writing an appropriate plug-in as described in the following paragraphs.


    # Example Vulnerability


    Web applications frequently use text files to store application setting information.
    For the purpose of our example, suppose a web application stores username and
    password information in a file such as /src/passwd.inc in the web server''s web
    root directory. This situation would be considered a vulnerability if the web
    server running such an application were configured to serve .inc files. An external
    user could exploit such a vulnerability by requesting /src/passwd.inc from the
    web server in order to gain user passwords.'
  merge: -1
  img_proc: true
- pgno: 217
  md: "# # The Plug-In\n\nThis section describes how to use Nessus to detect the presence\
    \ of the file /src/passwd.inc on a web server. First, we must write a NASL script\
    \ to do this. The script will serve as a Nessus \"plug-in.\" Here is what such\
    \ a script will look like:\n\n```\n```\nif(description)\n{\n        script_id(99999);\n\
    \n        script_version(\"$Revision: 1.0 $\");\n\n        script_name(english:\
    \ \"Checks for /src/passwd.inc\");\n\n        desc[\"english\"] = \"/src/passwd.inc\
    \ is usually installed\nby XYZ application and contains user password information\n\
    in clear text.\n\nSolution: Configure your web-browser to not serve .inc\nfiles.\n\
    \nRisk factor : High\";\n\n        script_description(english:desc[\"english\"\
    ]);\n\n        script_summary(english:\"Checks for the existence of\n/src/passwd.inc\"\
    );\n\n        script_category(ACT_GATHER_INFO);\n\n        script_copyright(english:\"\
    This script is Copyright\n(C)2003 Nitesh Dhanjani\");\n\n        script_family(english:\"\
    CGI abuses\");\n\n        script_require_ports(\"Services/www\", 80);\n\n    \
    \    exit(0);\n}\n\ninclude(\"http_func.inc\");\n\nport = 80;\n```\n```"
  merge: -1
  img_proc: true
- pgno: 218
  md: "# Part III: Special Topics\n\n```\n```c\nif(get_port_state(port))\n{\n    hget\
    \ = http_get(item:\"src/passwd.inc\", port:port);\n    mysoc = http_open_socket(port);\n\
    \    if(!mysoc)exit(0);\n    send(socket:mysoc, data:hget);\n    myrec = http_recv(socket:mysoc);\n\
    \    http_close_socket(mysoc);\n    if (!(\"404\" >< myrec))\n    {\n        security_hole(port);\n\
    \    }\n}\n```\n```\n\nThe `description` variable’s value is set to 1 when the\
    \ script is run by Nessus to extract summary information about the plug-in. There-\
    \ fore, we define various plug-in description variable values when the value of\
    \ `description` is true, ie., nonzero.\n\nThe `script_id` function sets a unique\
    \ ID for the plug-in. Every plug-in’s value must be unique. In our case, we can\
    \ set it to a high num- ber such as 9999 to ensure a distinct value. The `script_version`\
    \ func- tion displays version information about the plug-in. It is a good idea\
    \ to update this number to reflect the latest version of the plug-in. The `script_description`\
    \ function sets the description of the plug-in that is displayed by the Nessus\
    \ client when the plug-in is queried by a user. Similarly, the `script_summary`\
    \ function is used to set a summary description of the plug-in.\n\nThe `script_category`\
    \ function sets the plug-in’s category as re- quired by Nessus. In our case, we\
    \ have set it to `ACT_GATHER_INFO` because the plug-in gathers information on\
    \ a remote service; that is, it checks for the existence of the file `/src/passwd.inc`\
    \ on a web server. The `script_copyright` function is used to set author copyright\
    \ information.\n\nNessus categorizes plug-ins into different “families” to help\
    \ sort the vulnerability checks performed. We have set it to “CGI abuses” to indicate\
    \ an abuse of a CGI-based web application. Visit [http://cgi .nessus.org/plugins/dump.php3?view=web&family](http://cgi.nessus.org/plugins/dump.php3?view=web&family)\
    \ to check out a list of publicly available plug-ins that have been categorized\
    \ by family.\n\nNessus can be configured to optimize tests by selecting the appro-\
    \ priate check box in the Scan Option tab of the GUI client. When this"
  merge: -1
  img_proc: true
- pgno: 219
  md: 'option is enabled, Nessus scans for vulnerabilities that are related to the
    applications running on the open ports of the target machine. The `script_require_ports`
    function can be used to set the port that relates to the vulnerability on the
    remote machine, which in our case is set to www (HTTP).


    The functions just described set various description values for the plug-in. Plug-in
    descriptions can be viewed by double-clicking the appropriate plug-in name from
    the list of plug-ins displayed in the Plugins tab of the Nessus GUI client. A
    screenshot of this appears as Figure 10-1. The http_func.inc file contains a list
    of useful HTTP functions for our convenience. Since we make use of functions defined
    in the file, we have included this file using the `include` function.


    The `get_port_state` function is used to check the status of a particular port
    on the target host. In our case, we check for port 80. If this port is closed,
    there is no point in going further, and therefore we call `exit(0)`.


    In order to check for the presence of the /src/passwd.inc file on a web server,
    the HTTP request sent to the web server upon connect must be formatted like this:


    ```

    GET /src/passwd.inc HTTP/1.0

    ```


    ![](img/77287f6ef97ef0bed6e23f6610950d06_219_0.png)


    **Figure 10-1.** Plug-in description as displayed by the Nessus GUI client'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'The preceding GET request can be created by using the `http_get` function.
    This request can then be used as a parameter to the `send` function, which sends
    the request to the target host on the socket connection opened by the `http_open_sock`
    function. Resultant data from the web server is read using the `http_recv` function,
    and its contents are stored in the `myrec` variable. After this is done, the socket
    descriptor is closed using `http_close_socket`. The contents of `myrec` are then
    examined for the substring `404`, which would be present if the file did not exist
    on the web server. This is done using the `<<` operator, which checks for a substring
    in a given string variable. If `404` is not found in the returned data from the
    web server, then it is probable that this file exists, and this fact is indicated
    to Nessus by calling the `security_hole` function.


    Please see [http://www.nessus.org/doc/nasl2_reference.pdf](http://www.nessus.org/doc/nasl2_reference.pdf)
    for the latest NASL reference manual.


    # ## Running the Plug-in


    Make sure the preceding script is placed in Nessus’s plugins directory. The filename
    of this script must end with the extension ".nasl." Run the Nessus GUI and select
    the Plugins tab. Make sure CGI Abuses is selected. Highlight CGI Abuses and make
    sure the plug-in with the name "Checks for `/src/passwd.inc"` is enabled. If you
    have trouble finding the plug-in, click the Filter button and perform a search
    for the ID of `9999`.


    To get a positive result from our plug-in, you must have a local web server configured
    to serve the `/src/passwd.inc` file. If you have an Apache web server running
    on a host, simply create the `/src/passwd` file in the web root of the web server
    using the `touch` command:


    ```

    ```bash

    mkdir /var/www/html/src

    touch /var/www/html/src/passwd

    ```

    ```


    Input the IP address or name of the target web server in the Target Selection
    tab and click Start The Scan. If everything goes well, Nessus will detect and
    report our custom vulnerability, as shown in Figure 10-2.'
  merge: -1
  img_proc: true
- pgno: 221
  md: '![](img/77287f6ef97ef0bed6e23f6610950d06_221_0.png)


    # SUMMARY


    This chapter demonstrates the ease of writing plug-ins for the Nessus scanner
    using the NASL language. First, an example web application vulnerability was presented.
    Next, the creation of a NASL script to detect this vulnerability was discussed
    in detail, with step-by-step explanation of the script source code. Instructions
    on how to incorporate the NASL script into Nessus’s list of plug-ins were also
    provided. Quite often, large organizations use home-grown software applications
    in which vulnerabilities may be discovered. In addition, the Nessus scanner package
    may not contain a vulnerability check whose detection may be vital to an organization’s
    security posture. The information contained in this chapter can be used to write
    Nessus plug-ins from scratch in order to detect such vulnerabilities.'
  merge: -1
  img_proc: true
