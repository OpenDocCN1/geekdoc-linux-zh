    ```

    ```


    # Change the SMTP Server Banner


    If you are using Sendmail, you can change the SMTP banner by editing the /etc/sendmail.c
    file and changing the value of the SmtpGreetingMessage field.


    # Enumerate Users by Using EXPN and VRFY


    EXPN and VRFY are two commands supported by SMTP that allow for username enumeration.
    EXPN and VRFY can be used to confirm the existence of a particular username. EXPN
    can also be used to enumerate the names and e-mail addresses of all the users
    on a particular group e-mail alias.


    Here is an example of VRFY:


    ```

    ```

    [bash]$ telnet mail.somecompanyasanexample.com 25

    Trying 10.0.0.11...

    Connected to mail.somecompanyasanexample.com.

    Escape character is ''^]''.

    220 mail.somecompanyasanexample.com ESMTP Sendmail 8.11.6/

    8.11.6; Wed, 15 Jan 2003 22:04:06 -0500 (EST)

    VRFY smith

    250 2.1.5 <smith@sales.somecompanyasanexample.com>

    ```

    ```


    Here is an example using EXPN:


    ```

    ```

    [bash]$ telnet mail.somecompanyasanexample.com 25

    Trying 10.0.0.11...

    Connected to mail.somecompanyasanexample.com.

    Escape character is ''^]''.

    220 mail.somecompanyasanexample.com ESMTP Sendmail 8.11.6/

    8.11.6; Wed, 15 Jan 2003 22:10:11 -0500 (EST)

    EXPN marketing-team

    250-2.1.5 <bob@marketing.somecompanyasanexample.com>

    ```

    ```'
