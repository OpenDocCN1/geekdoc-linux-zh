- pgno: 198
  md: 'U user and file-system privileges must be tightly controlled. A simple misconfiguration
    such as incorrect file permissions on a single file may lead to a total system
    compromise. This chapter aims to provide useful tips for a system administrator
    to ensure proper user and file-system privileges.


    # # FILE PERMISSIONS: A QUICK TUTORIAL


    Use `ls` with the `-1` flag to check for file permissions. For example, let us
    check file permissions assigned to the `/usr/sbin/id` command:


    ```

    [bash]$ ls -1 /usr/bin/id

    -rw-r--r-- 1 root root 13864 Apr 8 2002 /usr/bin/id

    ```


    The first column of the preceding output describes the associated file permissions.
    The first character is set to a hyphen character (-) to indicate that `/usr/bin/id`
    is a file. This character would be set to `d` if it were a directory. The next
    three characters (rw-) represent the permissions of the owner of the file, which
    in this case is root, as represented in the third column of the preceding output.
    The three characters after that (-r-) represent the permissions of the group associated
    with this file, which in this case is also root, as indicated by the fourth column
    of the output. The last three characters (r--) represent the permissions associated
    with all other users, i.e., everyone.


    The character r indicates read permissions, while the characters w and x represent
    write and execute permissions respectively. The character s replaces x when setuid
    or setgid permissions are assigned. If the root user were to turn on the sticky
    bit for a directory, the last character (x) would be replaced with a t. When the
    sticky bit is turned on, all users have read and write permissions to the directory
    but may access only files that they own. Therefore, notice that the sticky bit
    is turned on for the /tmp directory.


    Use the `chmod` command to change permissions on a file. Suppose we have a file
    called “perm”:


    ```

    [bash]# ls -1 perm

    -rw-rw-r-- 1 root root 0 Apr 5 22:40 perm

    ```


    The preceding listing shows that the user root and the group root have permission
    to read or write to the file. All other users may only read the file. If we want
    to change perm’s file permissions such that the root user (u) may also execute
    (x) the file, we would need to execute `chmod` as follows:


    ```

    chmod u+x perm

    ```'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'Similarly, suppose we would like to revoke read (r) and write (w) permissions
    for the group (g):


    ```

    chmod g-rw perm

    ```


    Here is how we would revoke read (r) permissions for all other (o) users:


    ```

    chmod o-r perm

    ```


    It is also possible to execute chmod with all three of the preceding file permission
    changes:


    ```

    chmod u+x,g-rw,o-r perm

    ```


    Unix and Linux file permissions can also be represented in numerical form. This
    is done by breaking down each set of permissions (user, group, and other) to represent
    an octet. For your convenience, here is a list of eight possible octet values:


    | Value | Permissions | Value | Permissions |

    |---|---|---|---|

    | 0 | --- | 4 | r-- |

    | 1 | --x | 5 | r-x |

    | 2 | -w- | 6 | rw- |

    | 3 | -wx | 7 | rwx |


    Therefore, to set the permissions rwxr-xr-x on a file, the chmod command can be
    used in this way:


    ```

    chmod 755 perm

    ```


    To add setuid permissions, add 4000 to the resultant value. Add 2000 to set setgid
    permissions. Add 6000 to set both setuid and setgid permissions. For example,
    to set setuid permissions along with read and write permissions for the file owner,
    execute chmod as follows:


    ```

    chmod 4600 perm

    ```


    # ## WORLD-READABLE FILES


    It is a good idea to routinely audit for world-readable files. Malicious users
    often search for world-readable files that contain critical information that may
    aid them in their quest for privilege escalation.


    Use the find command to search for world-readable files:


    ```

    find /etc -type f -perm -4 -print 2> /dev/null

    ```'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# WORLD-WRITABLE FILES


    World-writable files may be exploited by malicious users to obtain root privileges.
    Consider a setuid executable script that is set to be writable by everyone. A
    malicious user may edit such a script to execute any command as root.


    Use the find command to search for world-writable files:


    ```

    find / -type f -perm -2 -print 2> /dev/null

    ```


    # FILES OWNED BY bin AND sys


    Some distributions incorrectly assign executable files to be owned by nonroot
    users such as “bin” and “sys.”


    For example, suppose /usr/bin/in.telnnet is owned and writable by the user “bin.”
    If an intruder were to successfully mount the server’s NFS /usr/bin share with
    the permissions of the user “bin,” he or she would be allowed to replace /usr/bin/in.telnetd
    with a Trojan that would be executed with root permissions by inetd or xinetd
    every time an incom- ing telnet connection is received.


    To check for “bin”-owned files, run the following command:


    ```

    find / -user bin -print 2> /dev/null

    ```


    Similarly, use the following command to check for “sys”-owned files:


    ```

    find / -user sys -print 2> /dev/null

    ```


    # THE umask VALUE


    Every time a new file or directory is created, it is given default permis- sions
    as specified by the “umask” value. Use the umask command to find out the umask
    value for the current user:


    ```

    [bash]$ umask -p umask 0002

    ```


    The value of umask is determined by XORing the file permission octet values with
    that of 666 in the case of files and 777 for directories. In case of files, note
    that the umask value does not allow for execute (x) permis- sions to be set.


    XOR stands for “exclusive OR.” Following is a truth table for XOR:


    | XOR | 0   | 1   | |----|-----|-----| | 0   | 0   | 1   | | 1   | 1   | 0   |'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'Suppose we would like the umask value to indicate read and write permissions
    for the owner of the file and no permissions for the group or other users. In
    addition, suppose we would like the umask for the directory to include execute
    (x) permissions. If a directory does not have execute (x) permissions, it is not
    possible to `cd` (change directory) into it. The file permission value for such
    a setting would be 700, which when separated into octets would represent:


    111 000 000

    Using the preceding table, let us XOR this value with 777 to gain the appropriate
    umask value:


    ```

    111 000 000 : 700

    111 111 111 : 777

    XOR: 000 111 111 : 077

    ```


    Use the `umask` command to set the new umask value:


    umask 077


    The recommended umask value is 077. This causes every newly created file or directory
    to be readable and writable only by its owner.


    Note that umask values are three sets of octets, i.e., three sets of eight bits.
    Files created by compilers usually obey the umask value (except the x bit).


    # IMPORTANT FILES


    Ensure the following files have been assigned proper permissions:


    | Filename | User | Group | Permissions |

    | :--- | :--- | :--- | :--- |

    | `/bin` | root | root | drwxr-xr-x |

    | `/etc` | root | root | drwxr-xr-x |

    | `/etc/aliases` | root | root | -rw-r--r-- |

    | `/etc/default/login` | root | root | -rw------- |

    | `/etc/exports` | root | root | -rw-r--r-- |

    | `/etc/hosts` | root | root | -rw-r--r-- |

    | `/etc/hosts.allow` | root | root | -rw------- |

    | `/etc/hosts.deny` | root | root | -rw------- |

    | `/etc/hosts.equiv` | root | root | -rw------- |

    | `/etc/hosts.lpd` | root | root | -rw------- |

    | `/etc/inetd.conf` | root | root | -rw------- |

    | `/etc/issue` | root | root | -rw-r--r-- |'
  merge: -1
