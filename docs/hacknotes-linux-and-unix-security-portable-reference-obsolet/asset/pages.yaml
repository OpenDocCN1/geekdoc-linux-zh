- pgno: 76
  md: 'With this chapter you will learn to scan target hosts on a network, probe the
    ports they serve, and identify the versions of their operating systems. Once you
    are aware of what ports and operating systems exist on the target hosts, you can
    move on to the process of enumeration as described in the next chapter.


    Although many scanning tools are available, Nmap is the most robust and feature-filled
    scanner available to date. For the most part, we will make use of Nmap in the
    examples that follow. The Nmap utility is free and can be obtained from [http://www.insecure.org/nmap](http://www.insecure.org/nmap).


    The Nmapfe package, a GUI front end to Nmap, is also available from this URL (see
    Figure 2-1).


    ![](img/77287f6ef97ef0bed6e23f6610950d06_76_0.png)


    Figure 2-1. Nmapfe, a GUI front end to Nmap'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# ## PINGING


    The quickest way to determine if a host is alive is to ping it. The `ping` command,
    used for this purpose, sends out an ICMP echo request, causing the target to respond
    with an ICMP reply packet. Note that a host can be configured not to respond to
    ICMP echo requests. Therefore, even though a host does not respond to echo requests,
    it may still be alive.


    # ### Pinging Hosts Using the ping Utility


    Using the `ping` command will find alive hosts that respond to ICMP echo requests
    with ICMP echo replies:


    ```

    ```bash

    [admin]$ ping 192.168.1.1

    PING 192.168.1.1 (192.168.1.1) from 192.168.1.1 : 56 (84) bytes of data.

    64 bytes from 192.168.1.1: icmp_seq=1 ttl=64 time=0.093 ms

    64 bytes from 192.168.1.1: icmp_seq=2 ttl=64 time=0.078 ms

    64 bytes from 192.168.1.1: icmp_seq=3 ttl=64 time=0.076 ms

    64 bytes from 192.168.1.1: icmp_seq=4 ttl=64 time=0.062 ms

    ^C

    --- 192.168.1.1 ping statistics ---

    4 packets transmitted, 4 received, 0% loss, time 299ms

    rtt min/avg/max/mdev = 0.062/0.077/0.093/0.012 ms

    ```

    ```


    # ## PING SWEEPING


    Ping sweeping is the process of pinging numerous hosts. In the case of a large
    set of target IP addresses, one must perform a ping sweep to determine alive hosts
    that respond to ICMP echo requests.


    # ### Using nmap to Perform Ping Sweeps


    Using the `-sP` option in nmap will perform a ping sweep:


    ```

    ```bash

    [admin]$ nmap -sP 192.168.1.*


    Starting nmap V. 3.00 ( www.insecure.org/nmap/ )

    Host (192.168.1.1) appears to be up.

    Host (192.168.1.100) appears to be up.

    Host (192.168.1.150) appears to be up.


    Nmap run completed -- 256 IP addresses (3 hosts up) scanned in 33 seconds

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# Block ICMP


    Configure your firewall to drop incoming ICMP echo requests and outgoing ICMP
    echo replies. This will prevent hosts in your networks from responding to ICMP
    echo requests.


    # TCP PINGING


    If a TCP ACK packet is sent to a host that is alive, a RST packet will be sent
    back. This method can be used to scan machines that block ICMP echo requests.


    # Using nmap to Perform TCP Pings


    Using the `-PT` option of `nmap` will perform a TCP ping. By default, `nmap` sends
    an ACK packet to port 80 of the destination host. Use the following syntax to
    instruct `nmap` to use another port:


    ```

    nmap -PT[port_number] host

    ```


    For example:


    ```

    nmap -PT6000 192.168.1.1

    ```


    If a host responds with a RST packet, `nmap` will consider the host alive and
    will perform a port scan immediately.


    ```

    [bash]# nmap -PT 192.168.1.1

    ```


    ```

    Starting nmap V. 3.00 ( www.insecure.org/nmap/ )

    Interesting ports on (192.168.1.1):

    (The 1597 ports scanned but not shown below are in state: closed)

    Port     State     Service

    22/tcp   open      ssh

    80/tcp   open      http

    113/tcp  open      auth

    6000/tcp open      X11


    Nmap run completed -- 1 IP address (1 host up) scanned in 1 second

    ```


    # Prevent TCP Ping Scans


    Always use a stateful firewall to protect your network. Make sure to configure
    your firewall to drop all ACK packets that do not belong to an already established
    TCP connection.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# PORT SCANNING


    *Port scanning* is the process of connecting to UDP and TCP ports of a target
    host to determine which ports are listening. Port scanning can be accomplished
    in many different ways. The following are the most common and useful port scanning
    methods.


    # TCP Connect


    This type of scanning uses the TCP open system call provided by the operating
    system kernel to connect to specified ports on the target host. This is the vanilla
    method of opening a TCP connection via the TCP three-way handshake:


    ![](img/77287f6ef97ef0bed6e23f6610950d06_79_0.png)


    Since a TCP-connect scan completes the three-way handshake, the application listening
    on the destination port will respond to the connection attempt. This will cause
    the application to log the connection attempt. Therefore, this method of port
    scanning is not stealthy.


    # Using nmap to Perform TCP-Connect Port Scans


    Using the `-sT` option in nmap will perform a TCP-connect scan:


    ```

    (bash)$ `nmap -sT 10.0.0.1`

    Starting nmap V. 3.00 ( `www.insecure.org/nmap/` )

    Interesting ports on (10.0.0.1):

    (The 1595 ports scanned but not shown below are in state: closed)

    Port\tState\tService

    25/tcp\topen\tsmtp

    113/tcp\topen\tauth

    6000/tcp\topen\tX11


    Nmap run completed -- 1 IP address (1 host up) scanned in 0 seconds

    ```


    TDP and UDP port numbers range from 1 to 65535. By default, nmap scans for commonly
    known ports. Scanning for all 65,535 ports is time consuming but can be performed
    with nmap when using the `-p` flag:

    `nmap -sT 192.168.1.1 -p 1-65535`'
  merge: -1
  img_proc: true
- pgno: 80
  md: "# FTB Bounce Scans\n\nDue to the design of the FTP protocol, when an FTP client\
    \ requests data transfer using “active” mode, the FTP server must initiate a connection\
    \ back to a port on the FTP client. FTP clients issue a PORT command with their\
    \ IP address and listening port number as parameters. If the FTP client issues\
    \ a PORT command with the IP address of another host, then the FTP server will\
    \ attempt to connect to that host. Therefore, this feature of the FTP protocol\
    \ can be used to proxy port scans.\n\nThe nmap command includes a -b flag to perform\
    \ “FTP bounce” scans:\n\n```\nnmap -b username:password@ftp.somecompanyasanexample.com:21\n\
    \    -p 4000-8000 target.somecompanyasanexample.com\n```\n\nFTP clients may use\
    \ passive mode when requesting data transfer, which will cause the FTP client\
    \ to connect to a port on the FTP server in order to perform the data transfer.\
    \ However, passive-mode FTP has its own problems. Passive-mode FTP clients may\
    \ be subject to “connection theft” vulnerabilities. Please see Chapter 4 for details.\n\
    \n# TCP SYN/Half-Open\n\nThis type of scanning causes the scanner to send out\
    \ a SYN packet to the target host. If the target host is listening on a particular\
    \ port, it will respond with a SYN+ACK. If the target host is alive but not listening\
    \ on a particular port, a RST packet will be received. As this method of scanning\
    \ does not complete the TCP three-way handshake, it is stealthy, since it is often\
    \ not logged by the target host.\n\n# SYN Scanning\n\nUsing the -sS flag in nmap\
    \ will perform a SYN scan:\n\n```\n[bash] $ nmap -sS 192.168.1.150\n\nStarting\
    \ Nmap V. 3.00 ( www.insecure.org/nmap/ )\nInteresting ports on (192.168.1.150)\
    \ :\n(The 1599 ports scanned but not shown below are in state: closed)\nPort \
    \     State     Service\n22/tcp    open      ssh\n113/tcp   open      auth\n\n\
    Nmap run completed -- 1 IP address (1 host up) scanned in 2 seconds\n```"
  merge: -1
  img_proc: true
- pgno: 81
  md: '# # Source Port Scanning


    Due to the design of the FTP protocol, when an FTP client requests data transfer
    using active mode, the FTP server must initiate a connection back to a port on
    the FTP client. In order to facilitate this, many firewalls are configured to
    allow all incoming IP packets whose source port is set to 20. In addition, IP
    packets from DNS servers have their source port set to 53, and therefore, many
    firewalls allow all incoming packets whose source port is 53. It is possible to
    instruct nmap to set the source port of its packets to a constant by using the
    `-g` switch:


    ```

    nmap -sS -g 20 192.168.1.1

    ```


    # # FIN


    In this method, a FIN packet is sent to a target host. If the target host is alive
    but not listening on a particular port, it will respond with an RST packet. However,
    if the target host is listening on a particular port, it will not respond. Note
    that Microsoft Windows hosts will send RST packets in all cases. This is of interest
    because it helps identify the target hosts as Microsoft Windows hosts.


    > i FIN IP packets are used to tear down established TCP connections.


    # # FIN Scanning


    Using the `-sF` flag in nmap will perform a FIN scan:


    ```

    [bash]$ nmap -sF 192.168.1.100

    Starting nmap V. 3.00 ( www.insecure.org/nmap/ )

    Interesting ports on (192.168.1.100):

    (The 1594 ports scanned but not shown below are in state: closed)

    Port      State  Service

    21/tcp    open   ftp

    22/tcp    open   ssh

    25/tcp    open   smtp

    53/tcp    open   domain

    80/tcp    open   http

    110/tcp   open   pop-3

    113/tcp   open   auth


    Nmap run completed -- 1 IP address (1 host up) scanned in 43 seconds

    ```'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# Reverse Ident


    Ident (Identification Protocol) servers listen for connections on port 113. If
    a TCP connection is established to a port listening on the host running the ident
    server, the ident server may be queried for the privilege level of the process
    associated with the connection.


    # Reverse Ident Scans


    Using the `-I` flag in `nmap` will perform a TCP reverse ident scan:


    ```

    [bash]$ nmap -I -sT -p 80 192.168.1.100

    ```


    Starting `nmap` V. 3.00 ( www.insecure.org/nmap/ )

    Interesting ports on (192.168.1.100):


    Port State Service Owner

    80/tcp open http nobody


    Nmap run completed -- 1 IP address (1 host up) scanned in 1 second


    # XMAS


    This method of scanning involves sending out a TCP packet with the FIN, URG, and
    PUS H flags set. If the target host is listening on the particular port, it sends
    a RST packet back. If the target host is not listening on that port, it does not
    respond.


    > FIN packets are normally used to tear down an established TCP connection. URG
    packets signify that information needing immediate attention is present within
    the IP packet, such as a ^C sent during a telnet session. A PUS H packet signifies
    that the sender requests the receiver to immediately pass all buffered data to
    the applications.


    # XMAS Scanning


    Using the `-sX` flag in `nmap` will perform an XMAS scan:


    ```

    [bash]$ nmap -sX 192.168.1.1

    ```


    Starting `nmap` V. 3.00 ( www.insecure.org/nmap/ )

    Interesting ports on (192.168.1.1):

    (The 1597 ports scanned but not shown below are in state: closed)


    Port State Service

    22/tcp open ssh

    80/tcp open http

    113/tcp open auth

    6000/tcp open X11


    Nmap run completed -- 1 IP address (1 host up) scanned in 6 seconds'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'Chapter 2: Scanning and Identification


    # NULL


    This type of scan involves sending a TCP packet to the destination host with all
    the flags turned off in the TCP header. If the target host is listening on the
    particular port, it will not respond. Otherwise, it will send a RST packet.


    # NULL Scanning


    Using the -sN flag in nmap will perform a TCP NULL scan:


    ```

    (bash)# nmap -sN 192.168.1.100


    Starting nmap V. 3.00 ( www.insecure.org/nmap/ )

    Interesting ports on (192.168.1.100):

    (The 1594 ports scanned but not shown below are in state: closed)


    Port State Service

    21/tcp open ftp

    22/tcp open ssh

    25/tcp open smtp

    53/tcp open domain

    80/tcp open http

    110/tcp open pop-3

    113/tcp open auth


    Nmap run completed -- 1 IP address (1 host up) scanned in 41 seconds

    ```


    # RPC


    This type of scan is used to send NULL commands to open ports in order to determine
    if they are RPC (remote procedure call) ports. Once an open port is determined
    to be an RPC port, information about the application that is bound to the port
    is queried for and obtained.


    # RPC Scanning


    Using the -sR in option in nmap will perform an RPC scan:


    ```

    (bash)# nmap -sR 10.0.0.10


    Starting nmap V. 3.00 ( www.insecure.org/nmap/ )

    Interesting ports on (10.0.0.10):

    (The 1584 ports scanned but not shown below are in state: closed)


    Port State Service (RPC)

    7/tcp open echo

    21/tcp open ftp

    22/tcp open ssh

    37/tcp open time

    53/tcp open domain

    111/tcp open sunrpc (rpcbind V2-4)

    ```


    Port Scanning'
  merge: -1
