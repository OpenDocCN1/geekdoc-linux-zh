    # ZONE TRANSFERS


    DNS servers are generally configured to act as either a primary server or a secondary
    server. The reason for this approach is to provide hierarchy and redundancy. A
    zone transfer occurs when a secondary DNS server contacts a primary DNS server
    in order to update its zone information. DNS hostname information obtained via
    zone transfers may reveal the role or location of particular hosts in an organization.
    Quite often, primary DNS servers are incorrectly configured to allow any host
    to perform a zone transfer.


    # Performing Zone Transfers Using the host Command


    To attempt a zone transfer for a particular organization, a DNS server IP address
    is required. If this information is not available, a whois query of the target
    domain can be attempted, and this will provide the relevant DNS IP addresses.
    Once a DNS server IP address is obtained, a zone transfer can be attempted using
    the host command:


    ```

    host -l domain DNSIP

    ```


    For example:


    ```

    [bash]$ host -1 somecompanyasanexample.com 10.0.0.1

    Using domain server:

    Name: 10.0.0.1

    ```'
