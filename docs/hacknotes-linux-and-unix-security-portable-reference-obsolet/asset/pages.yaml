- pgno: 186
  md: 'efault installations of most Unix and Linux distributions leave room for better
    hardening of various policies, applications, and services. This chapter provides
    tips on how to harden hosts and their commonly used services.


    # ## SET PASSWORD POLICIES


    Intruders often exploit weak password policies to gain access to user accounts.
    Here are some steps that can be taken in order to harden password policies:


    +   Ensure shadowed passwords are in use. Check to make sure no password hashes
    are present in the /etc/passwd file. Password hashes should be present only in
    /etc/shadow, and this file must be readable only by root.


    +   Edit the passwd configuration file (/etc/default/passwd) or use the chage
    utility to change the password expiry lengths.


    # ## REMOVE OR DISABLE UNNECESSARY ACCOUNTS


    Check /etc/passwd to see the accounts enabled on the host. Many services create
    nonprivileged accounts to be used during execution, for example: ftp, lp, news,
    gopher, ntp. Make sure such accounts are disabled by setting their shell to /bin/false.
    If the services for these accounts are not in use, uninstall them and remove the
    accounts.


    # ## REMOVE “.” FROM THE PATH VARIABLE


    When a user executes a command, the command shell searches for the location of
    the command in the list of directories contained in the PATH environment variable.
    To prevent execution of Trojans placed on the file system by malicious users,
    make sure the PATH environment variable never includes the current directory (“.”).


    Check files such as /etc/rc.local, /etc/profile, /etc/bashrc, /etc/csh.cshrc,
    ~/.bashrc, ~/.bash_profile, ~/.cshrc, and ~/.login to ensure that the PATH variable
    does not include “.”. If you are using a shell other than bash, check the appropriate
    resource files.


    Use echo to print the value of the current user’s PATH variable:


    ```

    ```bash

    echo $PATH

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# CHECK THE CONTENTS OF /etc/hosts.equiv


    The `/etc/hosts.equiv` file contains a list of hostnames and users that are considered
    trusted. Services such as rlogin, rsh, rcp, and rcpmmd use this file to determine
    trusted entities. Check this file to ensure only trusted hostnames and users are
    present. Consider removing this file if no remote hosts or users are to be trusted.


    # CHECK FOR .rhosts FILES


    Check your file system for the presence of .rhosts files. Hostnames and usernames
    present in this file are allowed to log in via r-services such as rlogin without
    specifying a password. Use the find command to check for .rhosts:


    ```

    ```

    find / -name .rhosts -type f -print 2>/dev/null

    ```

    ```


    # DISABLE STACK EXECUTION


    Disabling stack execution will prevent some types of buffer overflow conditions.
    If using Solaris, edit `/etc/system` and add the following lines:


    ```

    ```

    set noexec_user_stack=1

    set noexec_usr_stack_log=1

    ```

    ```


    For non-Solaris distributions, the following products are available:


    +   - StackGuard: http://www.immunix.org/stackguard.html

    +   - Libsafe: http://www.research.ayvalabs.com/project/libsafe/

    +   - StackGhost: http://stackghost.cerias.purdue.edu/

    +   - Openwall: http://www.openwall.com/linux


    # USE TCP WRAPPERS


    TCP Wrappers allow for the monitoring and filtering of incoming requests for network
    services. Most distributions install TCP Wrappers by default, but if you need
    it, you can obtain it at ftp://ftp.porcupine.org/pub/security/index.html.


    ![](img/77287f6ef97ef0bed6e23f6610950d06_187_0.png)'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'On hosts that have TCP Wrappers installed, edit `/etc/hosts.allow` and make
    sure the following line is the first uncommented statement:


    ```

    ALL:ALL:deny

    ```


    Also, make sure to deny connections from all hosts by default. This can be done
    by placing the following entry in `/etc/hosts.deny`:


    ```

    all:all

    ```


    Allow only trusted hosts to connect to services by placing appropriate entries
    in `/etc/hosts.allow`. See http://www.cert.org/security-improvement/implementations/041.07.html
    for detailed instructions.


    # HARDEN inetd AND xinetd CONFIGURATIONS


    The Internet services daemon, inetd, is used to start daemons that provide network
    services. It listens on all the required ports and starts the appropriate daemon
    process as soon as an incoming network connection arrives. Therefore, inetd is
    often called the “super-server.” The xinetd daemon is similar to inetd, but it
    includes a bit more functionality, and so inetd users should strongly consider
    upgrading to xinetd.


    # Disable Unnecessary Services


    If using inetd, edit the inetd.conf file and make sure unnecessary services are
    disabled. For example, consider the following line in inetd.conf that is responsible
    for the FTP daemon:


    ```

    ftp stream tcp nowait root /usr/local/etc/tcpd /usr/local/etc/ftpd

    ```


    In order to disable FTP from inetd, place a `#` in front of the line:


    ```

    #ftp stream tcp nowait root /usr/local/etc/tcpd /usr/local/etc/ftpd

    ```


    Restart inetd for changes to take effect:


    ```

    killall -HUP inetd

    ```


    If using xinetd, edit the appropriate service file in the xinetd.d directory and
    ensure that the line `"disable = yes"` is present.


    Many services run independently of inetd and xinetd. Disable unnecessary services
    from starting up by editing or removing appropriate scripts in the `/etc/rc.d/`
    directory.'
  merge: -1
  img_proc: true
- pgno: 189
  md: "# ## Disable inetd or xinetd If No Services Are Enabled\n\nIf all inetd or\
    \ xinetd services have been disabled, there is no need to leave inetd or xinetd\
    \ running. To stop inetd or xinetd from being executed on startup, disable appropriate\
    \ files in `/etc/rc.d` and `/etc/rc.local`.\n\n# ## Ensure Logging Is Turned On\n\
    \nIf running inetd, edit the inetsvc file and make sure inetd is invoked with\
    \ the `-t` flag. In the case of xinetd, edit the xinetd.conf file and make sure\
    \ the following line is present:\n\n```\nlog_type = SYSLOG authpriv\n```\n\nIn\
    \ addition, edit syslog.conf and make sure `*.info` is enabled to log to `/var/log/messages`.\n\
    \n# # HARDEN REMOTE SERVICES\n\nThis section provides hardening tips for some\
    \ common remote services used on Unix and Linux hosts.\n\nUse `netstat` to find\
    \ out the processes listening on TCP and UDP ports:\n\n```\n[bash]# netstat -nap\n\
    Proto Local Address     Foreign Address   State  PPD/name\ntcp   0 0.0.0.0:139\
    \     0.0.0.0:*  LISTEN   1251/smbd\ntcp   0 0.0.0.0:6000    0.0.0.0:*  LISTEN\
    \   11228/X\ntcp   0 0.0.0.0:80      0.0.0.0:*  LISTEN   2047/httpd\ntcp   0 0.0.0.0:113\
    \     0.0.0.0:*  LISTEN   728/identd\ntcp   0 0.0.0.0:22      0.0.0.0:*  LISTEN\
    \   750/ssh\ntcp   0 0.0.0.0:512     0.0.0.0:*               14059/xinetd\nudp\
    \ \n[...]\n```\n\n# ## WU-FTPD\n\nFTP (file transfer protocol) is a protocol for\
    \ transferring files from one host to the other. WU-FTPD is the most widely used\
    \ FTP daemon on Unix and Linux. It is available from [http://www.wu-ftpd.org](http://www.wu-ftpd.org).\
    \ Take these steps to harden WU-FTPD:\n\n+   * Change the server banner. Edit\
    \ `/etc/ftpassd` and use the `greeting` directive to specify the new banner. For\
    \ example:\n\n```\ngreeting text No banner information available. Sorry.\n```\n\
    \nHarden inetd and xinetd\n\nConfigurations"
  merge: -1
