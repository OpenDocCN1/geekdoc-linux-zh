- pgno: 93
  md: '# Obtain the Telnet Server Banner


    Banner information from a telnet daemon can be obtained by simply telnetting to
    the server:


    ```

    ```bash

    $ telnet 192.168.1.1

    Trying 192.168.1.1...

    Connected 192.168.1.1.

    Escape character is ''^>''.


    SunOS 5.8


    login:

    ```

    ```


    # Change the Telnet Server Banner


    In order to change the telnet banner, you will need to write a wrapper around
    it. Assuming that you are running telnetd using inetd, edit your /etc/inetd.conf,
    and change


    ```

    telnet stream tcp nowait root /usr/sbin/in.telnetd in.telnetd

    ```


    to


    ```

    telnet stream tcp nowait root /usr/sbin/in.telnetdwrapper in.telnetd

    ```


    Now, you must create the file /usr/sbin/in.telnetdwrapper with the following contents:


    ```

    #!/bin/sh

    /bin/echo "My banner\r"

    exec /usr/sbin/in.telnetd

    ```


    > If you are using xinetd, edit the telnet file found in your xinetd.d directory
    appropriately.


    You must restart inetd or xinetd in order for changes to take effect.


    Note that some versions of telnetd allow you to to change banner information by
    editing the /etc/issue.net file.


