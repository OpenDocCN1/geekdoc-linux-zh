    # Web Proxies: (8000+ TCP)


    Web proxies, as their name suggests, are used to proxy HTTP and HTTPS traffic.


    **Web Proxies Misconfigurations** Web proxy misconfigurations can be abused using
    the methods described here. We will make use of the `desproxy` command-line tool,
    which uses the CONNECT method supported by HTTP 1.1 to establish TCP connections
    via web proxies. It can be downloaded from http://desproxy.sourceforge.net/.


    # Proxy Attacks


    Misconfigured web proxies often allow intruders to proxy attacks. Consider the
    following `desproxy` command:


    ```

    desproxy 10.0.0.1 23 192.168.1.1 8000 2300

    ```


    After issuing this command, if the intruder telnets to port 2300 on his or her
    own host (127.0.0.1), he or she will be connected to the telnet port (23) of 10.0.0.1
    via the vulnerable web proxy (192.168.1.1) listening on port 8000. Since the victim
    host will log only incoming connections from the web proxy IP address of 192.168.1.1,
    the attacker would have successfully abused the web proxy in order to proxy his
    or her attacks.


    > If an intruder already has control of a host on an internal network that does
    not allow outbound TCP connections, the intruder can use `desproxy` to establish
    TCP connections on external hosts via an available web proxy.'
