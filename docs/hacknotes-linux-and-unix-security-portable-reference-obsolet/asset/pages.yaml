  md: "```\nwhile [ \"$i\" -lt 26 ]\ndo\n    nc -v $1 $i < /dev/null\n    i=`expr\
    \ $i + 1`\necho\ndone\n```\n\nThis script consists of a while loop for the values\
    \ of the variable $i$ ranging from 21 to 25. Within the while loop, a connection\
    \ to a host (the first parameter passed to the script, i.e., $1$) is made on ports\
    \ of value $i$ (21 to 25), and /dev/null is given as input to the Netcat connection.\
    \ Since /dev/null is a special file that contains nothing (null), Netcat will\
    \ immediately terminate after grabbing the first line of the banner (if any).\n\
    \nBefore attempting to execute the preceding script, execute permissions must\
    \ be granted:\n\n```\n[bash]$ chmod u+x ./grab.bash\n```\n\nNow run the script:\n\
    \n```\n[bash]$ ./grab.bash 192.168.1.1\n192.168.1.1 [192.168.1.1] 21 (ftp) open\n\
    220 192.168.1.1 FTP server (Version wu-2.6.2+Sun) ready.\n221 You could at least\
    \ say goodbye.\n\n192.168.1.1 [192.168.1.1] 22 (ssh) open\nSSH-1.99-OpenSSH_3.4p1\n\
    \n192.168.1.1 [192.168.1.1] 23 (telnet) : Connection refused\n\n192.168.1.1 [192.168.1.1]\
