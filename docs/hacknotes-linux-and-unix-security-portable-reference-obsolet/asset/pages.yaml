    feature allows for clients to organize files by patterns. Certain patterns were
    found to cause heap corruption in the WU-FTPD processes. This vulnerability made
    it possible for an attacker to execute arbitrary commands on a vulnerable WU-FTPD
    server by sending specially crafted data as input. See http://online.securityfocus.com/bid/3581
    for more details.


    +   - **SITE EXEC Vulnerability** Older versions of WU-FTPD contained a vulnerability
    in their “SITE EXEC” feature. This'
