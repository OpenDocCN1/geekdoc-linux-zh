- pgno: 135
  md: "Often, web content authors mistakenly place files with sensitive information\
    \ within the web root, and these can easily be viewed by an unauthenticated user\
    \ if the directory contents are displayed.\n\n# Turn Off Indexing\n\nApache users\
    \ can use the `IndexIgnore` directive in `httpd.conf` to instruct the server to\
    \ turn off indexing.\n\n# Obtaining Source code, Configuration, Statistics, and\
    \ Password Resources\n\nMany HTTP servers are misconfigured to serve critical\
    \ files. Here are a few examples:\n\n+   - Source code of CGI applications may\
    \ contain usernames and passwords of databases. Many web applications use configuration\
    \ files with suffixes such as .inc or .conf. Such files may contain system and\
    \ password information and are often served by misconfigured web servers.\n+ \
    \  - Web server statistics programs output results into directories such as /stats,\
    \ and these are often placed within the web root.\n+   - Apache allows users to\
    \ password-protect directories by placing a file named .htaccess in a directory.\
    \ The .htaccess file contains information about the location of a password file\
    \ (usually called .htpasswd) that contains password hashes of allowed accounts.\
    \ Often, Apache is not configured to restrict .htaccess and .htpasswd files from\
    \ being served. Once an intruder has access to the .htpasswd file, it can be cracked\
    \ using a brute-forcing tool such as john.\n\n# Do Not Serve Critical Resources\n\
    \nConfigure your web server to not serve sensitive files. If using Apache, edit\
    \ the `httpd.conf` file to deny serving files with certain suffixes. For example,\
    \ the following directives disallow files with names beginning with .ht from being\
    \ served:\n\n```\n<Files ~ \"^\\.ht\"> \n    Order allow,deny \n    Deny from\
    \ all\n</Files>\n```\n\n\n\n![](img/77287f6ef97ef0bed6e23f6610950d06_135_0.png)"
  merge: -1
  img_proc: true
- pgno: 136
  md: 'The **AccessFileName** directive can be used in httpd.conf to signify a name
    other than .htaccess. If this is done, you should make sure to instruct Apache
    to not serve the corresponding access file.


    # Web Application Vulnerabilities


    It is beyond the scope of this book to mention all possible web application vulnerabilities.
    However, the attacks that follow offer good examples of the most common vulnerabilities.


    # Exploit Improper Input Validation


    Values can be input to web applications via the submission of HTML forms. Before
    these values are used by the application, they should be checked for illegal characters.
    Poorly designed web applications fail to check submitted parameters, causing them
    to be subject to input validation attacks.


    Consider the vulnerability found in PHPNuke, an automated web-based news application.
    PHPNuke failed to sanitize user-supplied input used to construct SQL queries.
    This provided a malicious user with the ability to perform unauthorized queries
    on the database used by the PHPNuke application. More information on this can
    be found at **http://www.securityfocus.com/bid/6887**.


    The act of exploiting an input validation vulnerability on a web application to
    perform unauthorized SQL queries is known as *SQL injection*. Consider the following
    SQL code executed in a web application:


    ```

    SELECT SSN FROM users WHERE username=$INPUT[id]'';

    ```


    The `id` parameter is passed to the application via a HTML form that a user submits.
    If no input validation is performed, a malicious user may submit the HTML form
    with the value of `id` equal to


    ```

    blah'' OR ''x''=''x

    ```


    which causes the original SQL query to execute the following on the database:


    ```

    SELECT SSN FROM users WHERE username=''blah'' OR ''x''=''x'';

    ```


    This query will return the SSN values for all accounts in the “users” table! Many
    poorly designed web applications fail to perform input validation on parameters
    passed to the `system()` function call. Most programming languages include the
    `system()` function call to execute an external program:'
  merge: -1
  img_proc: true
- pgno: 137
  md: "If a malicious user were to input a value such as\n\n\\`cat /etc/passwd\\`\n\
    \nfor the value of $i, the preceding *system* call would execute the following\
    \ on the web server:\n\n/bi n/echo \\`cat /etc/passwd\\`\n\ncausing the /etc/passwd\
    \ file to be displayed to the malicious user.\n\n# ### Prevent Input Validation\
    \ Vulnerabilities\n\nAudit web applications to make sure input validation is performed\
    \ on all user input parameters. Some characters to watch out for are\n\n``';/\\\
    @&|$~-<>\"${}()<>*!`\n\n# ## Session Hijacking\n\nBecause HTTP is not a stateful\
    \ protocol, session management has to be provided by the web application. In most\
    \ cases, sessions are maintained by the use of *cookies*. A cookie is a piece\
    \ of information requested by the web server to be stored on the end user's hard\
    \ disk.\n\nSince the cookie is stored on the end user's disk, it cannot and should\
    \ not be entirely trusted. A poorly designed application, for example, may request\
    \ the following cookie value to be stored after the user joe successfully authenticates:\n\
    \n```\nlang=en-us; user=joe; time=10:10 EST; \n```\n\nIf the web application were\
    \ to only rely on this cookie value, any user could edit their web browser's cookie\
    \ file (Mozilla stores its cookies in cookie.txt in the user's .mozilla directory)\
    \ and manually insert the preceding cookie value to be served to the web server.\
    \ In addition, the malicious user could instruct his or her web browser to serve\
    \ a cookie whose value contains a user field that is set to the name of a privileged\
    \ user such as “administrator.”\n\nCookies aren't the only way to maintain sessions.\
    \ A web application may maintain state by embedding session information in the\
    \ URL:\n\nhttp://www.somecompanyasanexample.com/authenticated.cgi?user=john&sessionid=12345678."
  merge: -1
  img_proc: true
- pgno: 138
  md: '# Prevent Session Hijacking


    The following steps will help prevent many types of session hijacking techniques:


    +   - Allow random session IDs to successfully authenticated users.

    +   - Consider storing encrypted information in the cookie, so that it is not
    possible for end users to manipulate it.

    +   - Pass all cookie information using SSL.


    # Hidden HTML Elements


    Hidden HTML elements are static values contained in web forms. These values are
    not displayed to end users. The following HTML code can be used to set a hidden
    element:


    ```

    <INPUT NAME="shippingcharges" TYPE=HIDDEN VALUE="5.25">

    ```


    Poorly designed web applications trust hidden HTML tags in order to pass information
    across the end user''s session. In this case, a malicious user may download the
    HTML form and change the preceeding HTML code to


    ```

    <INPUT NAME="shippingcharges" TYPE=HIDDEN VALUE="-99">

    ```


    After submitting the modified form, a value of -99 for the *shippingcharges* field
    would be passed to the vulnerable web application. If the web application blindly
    accepts this value, and if the target were an e-commerce web site, the user may
    end up with a credit placed on his or her credit card!


    # Do Not Trust Hidden HTML Elements


    Web application developers should not trust the values of hidden HTML elements.
    It is a good idea to perform web application reviews to ensure that hidden HTML
    element values are not being trusted.


    # Source Code Comments


    During the development phase of web applications, it is common for programmers
    to place comments within the CGI or HTML source code. These comments help developers
    share details with fellow programmers. Source code comments may contain critical
    information such as passwords to database servers. Sometimes, such comments are
    overlooked when the web application is put into production:'
