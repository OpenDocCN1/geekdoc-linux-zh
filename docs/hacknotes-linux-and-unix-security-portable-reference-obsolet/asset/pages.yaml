- pgno: 192
  md: "for Sendmail. The qmail program can be obtained from http://cr.yp.to/qmail.html.\n\
    \n> Sendmail.mc is a macro configuration file. If changes are made to this file,\
    \ a new sendmail.cf file must be generated by the following command:\n\n```\n\
    m4 /etc/mail/sendmail.mc > /etc/sendmail.cf\n```\n\nThis will generate an updated\
    \ sendmail.cf file. Restart Sendmail for changes to take effect.\n\n# BIND (DNS)\n\
    \nDNS (Domain Name System) is a protocol used to translate between domain names\
    \ and IP addresses. BIND (Berkeley Internet Name Domain) is the most widely used\
    \ DNS server on the Internet. Take these measures to harden BIND:\n\n+   - Edit\
    \ the BIND configuration file, named.conf, and override the version number:\n\n\
    ```\noptions {\n    version \"Not available\";\n};\n```\n\n+   - Restrict zone\
    \ transfers. Use the allow-transfer directive to specify the hosts allowed to\
    \ perform zone transfers:\n\n```\noptions {\n    allow-transfer ( ip_address;\
    \ );\n};\n```\n\n+   - Also, consider using TSIG (Transection Signatures) to cryptographically\
    \ exchange zone data.\n\n+   - Turn off recursive queries. This will prevent your\
    \ DNS server from being vulnerable to spoofing attacks:\n\n```\noptions {\n  \
    \  fetch-glue no;\n    recursion no;\n};\n```\n\n+   - Run BIND in a chrooted\
    \ environment. See http://www.homeport.org/~adam/dns.html and http://www.etherboy.com/dns/chrootdns.html\
    \ for details.\n\n+   - Restrict dynamic updates, since this feature enables a\
    \ remote entity to delete and add records. By default, BIND does not allow dynamic\
    \ updates. It can be enabled only by using the allow-update statement, so use\
    \ this option with care."
