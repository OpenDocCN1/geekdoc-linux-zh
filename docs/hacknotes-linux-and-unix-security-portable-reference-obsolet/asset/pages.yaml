  md: '# HTTP (Hypertext Transfer Protocol): 80 (TCP)


    HTTP is a stateless protocol used to distribute various hypermedia. It is most
    widely used to serve WWW (World Wide Web) content.


    > It is impossible to manually check for all possible HTTP misconfigurations and
    vulnerabilities. Automated tools such as Nikto, available from [http://www.cirt.net/code/nikto.shtml](http://www.cirt.net/code/nikto.shtml),
    do a good job of web server and application assessment and should be used to check
    for misconfigurations and vulnerabilities.


    **Brute-Forcing** It is possible to brute-force HTTP authentication using tools
    such as Hydra.


    # Brute-Force HTTP Authentication


    Hydra is a brute-forcing tool that supports HTTP and can be used to brute-force
    password protected HTTP resources. Here is an example of how Hydra may be used
    to brute-force HTTP authentication:


    ```

    hydra -L usernames.txt -P passwords.txt www.somecompanyanexample.com http

    ```


    # Prevent HTTP Brute-Forcing


    Please see “Common Defenses Against Brute-Force Attacks.”


    **Sniffing** Since HTTP is a clear-text protocol, it is possible for a malicious
    user on a network segment to watch another user’s HTTP traffic.


