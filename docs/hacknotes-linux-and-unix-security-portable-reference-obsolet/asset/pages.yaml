- pgno: 208
  md: 'T his chapter describes the most common methods of system event logging; the
    sections that follow cover specific log files and the information they contain.
    It is important for every system administrator to understand different events
    and where they are logged. Without this information, a system administrator will
    have no idea of what events and activities are taking place on the host.


    In addition to logging, another important issue is that of software updates. Every
    day, software vulnerabilities are announced for which exploit code is released.
    Most often, such vulnerabilities are fixed by software vendors in the form of
    patches, or software updates. This chapter provides resources on where one can
    obtain such software patches.


    # ## LOGGING


    This section describes specific log files and the information contained in them.
    In addition, issues such as disk space on /var and log rotation are also discussed.
    As an administrator, be sure to understand the information presented in this section
    in order to detect abnormal system activities and behavior.


    # ### Log Files


    Here are some common log files and the information that is usually logged into
    them. It is a good idea to go through these files on a routine basis.


    > Depending upon your Unix or Linux distribution, some log files may be located
    in different directories. Use the find command to locate the files if you can''t
    find them: find /var -name filename -print 2> /dev/null.


    # #### /var/audit


    Most Solaris distributions come bundled with BSM (Basic Security Module), a utility
    that logs user action details. Since BSM audits act on the system call level,
    huge logs may be generated.


    To enable BSM, switch to runlevel 1:


    ```

    init 1

    ```


    Next, run bsmonv:


    ```

    cd /etc/security ; ./bsmonv

    ```'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'Configure /etc/security/audit_control to choose what events to log. See http://www.securityfocus.com/infocus/1362
    for detailed instructions. Reboot for the changes to take effect.


    # ## /var/adm/loginlog


    After five unsuccessful login attempts, all further attempts are logged to this
    file. Each log event contains the login name, tty information, and time. This
    file is logged to only if it exists. Therefore, create this file if it doesn''t
    exist, using the touch command. Make sure this file is readable only by root.


    # ## /var/adm/sulog


    The su command is used to log in to another user''s account. For example, user
    joe may su to log in to jack''s account:


    ```

    ```

    [joe''s_bash]$ su - jack

    Password:jackspassword

    [jack''s_bash]$ ```

    ```


    Similarly, a user may log in as root using the su command:


    ```

    ```

    [joe''s_bash]$ su -

    Password:rootpassword

    [root''s_bash]# ```

    ```


    It is important to log all su attempts. Doing so will help detect brute-force
    password guessing attempts by malicious local users. Edit /etc/default/su and
    make sure the value of SULLOG points to /var/adm/sulog. You may also enable syslogd
    logging by setting the value of SYSLOG to yes.


    # ## /var/log/cron


    The cron daemon logs information to this file. Edit /etc/syslog.conf and make
    sure the following line is present:


    ```

    ```

    cron.*[tab]/var/log/cron

    ```

    ```


    # ## /var/log/maillog


    This file contains information logged by the host''s mail server. Details about
    outgoing and incoming e-mails and appropriate error messages are logged to this
    file. Edit /etc/syslog.conf and make sure the following line exists:


    ```

    ```

    mail.*[tab]/var/log/maillog

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# **/var/log/messages**


    This file contains informational messages logged by syslogd. To enable logging
    to this file, a line similar to the following must be present in */etc/syslog.conf*:


    ```

    * .info /mail.none;authpriv.none;cron.none[/tab]/var/log/messages

    ```


    # **/var/log/secure**


    Processes that authenticate via username and password or other such mechanisms
    usually log to this file. Make sure this file is readable only by root. A line
    similar to the following must exist in */etc/syslog.conf*:


    ```

    authpriv.*[tab]/var/log/secure

    ```


    # **/var/log/wtmp**


    This log file contains information about all the logins that have occurred on
    the host. It is not an ASCII file and therefore must be viewed using provided
    tools such as last. The following example shows the five most recent login or
    logout attempts:


    ```

    ```bash

    [bash]$ last | head -5

    nit   pts/0  gateway    Fri Apr 11 10:12   still logged in

    anita  pts/1  nest       Thu Apr 10 21:14   still logged in

    ozzy   pts/1  gateway    Thu Apr 10 21:06 - 21:08  (00:01)

    kelly  pts/1  ftpserver  Thu Apr 10 20:01 - 20:02 (00:00)

    sharon pts/0  wireless   Thu Apr 10 16:34 - 21:26 (04:52)

    ```

    ```


    # **/var/run/utmp**


    This file contains information about users that are currently logged on to the
    host. It is not an ASCII file and therefore must be viewed using tools such as
    w or who.


    ```

    ```bash

    [bash]$ who

    deepthi  pts/0    Apr 14 10:12 (intranet)

    yash     pts/1    Apr 13 21:14 (egmore/ftp)

    natasha  pts/1    Apr 13 20:10 (pune/https)

    ```

    ```


    # # Log Rotation


    Log files have the propensity to grow very fast and consume large amounts of disk
    space. For some environments, it makes sense to delete old log contents. To enable
    log rotations, most distributions use tools'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'such as `newsyslog` or `logrotate`. These tools should be called on a frequent
    time interval using the `cron` daemon. Check the man pages for `newsyslog` or
    `logrotate` for more details.


    # Free Space in /var


    Depending upon the environment, log and spool files stored in the `/var` directory
    can get very big. It is a good idea to routinely check the amount of free space
    in `/var` using the `df` command.


    The `/var` directory must be mounted as a separate partition. Please see the “Disk
    Partitions” section in Chapter 8 for more information.


    # PATCHING


    It is most important to stay up-to-date with software patches and updates. Mailing
    lists such as Bugtraq often list software vulnerabilities, and these are quickly
    fixed by software vendors. Depending upon your distribution and package management
    tools, these patches may be found in various locations. The table that follows
    lists the most popular Unix and Linux distributions, along with resources on where
    to obtain software patches:


    | Distribution | Patches |

