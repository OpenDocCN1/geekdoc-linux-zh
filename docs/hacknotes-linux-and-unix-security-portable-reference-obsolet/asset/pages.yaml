    Not only does this query result tell us that the host is probably running an FTP
    server, it also informs us of its location, room 13!


    As evident from the preceding example, DNS reverse-lookups can reveal various
    host information that should not be available to external users. The following
    preventative measures can be taken to minimize the exposure of such information:


    +   Do not assign hostnames that may reveal any sort of information about the
    hosts on your network.

    +   Consider assigning hostnames that include the IP address as part of the hostname,
    such as 3-0-0-10.somecompanyasanexample.com. This scheme helps organize the available
    hosts from an administrative perspective, and at the same time reveals no extra
    information to an external entity.


    To find out the hostnames and IP addresses of an organization’s mail servers,
