  md: '# HTTP CODES


    HTTP servers respond to all requests with an HTTP code. Some HTTP servers do not
    return the code description, but only its numeric value. The following table can
    be used to determine the meaning of an HTTP response code. This table can also
    be used when writing custom HTTP client shell scripts in order to classify and
    understand resultant HTTP responses.


    | Code | Description |

    | :--- | :--- |

    | 100 | Continue |

    | 101 | Switching protocols |

    | 200 | OK |

    | 201 | Created |

    | 202 | Accepted |

    | 203 | Non-authoritative information |

    | 204 | No content |

    | 205 | Reset content |

    | 206 | Partial content |

    | 300 | Multiple choices |

    | 301 | Moved permanently |

    | 302 | Moved temporarily |

    | 303 | See other |

    | 304 | Not modified |

    | 305 | Use proxy |

    | 307 | Temporary redirect |

    | 400 | Bad request |

    | 401 | Unauthorized |

    | 402 | Payment required |

    | 403 | Forbidden |

    | 404 | Not Found |'
  merge: -1
