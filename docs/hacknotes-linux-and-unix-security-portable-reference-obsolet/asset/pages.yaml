- pgno: 31
  md: '# IP ADDRESSING


    This section provides concise details about IP addressing topics such as IP address
    classifications and protocol headers for IP, TCP, and UDP.


    # Dotted Decimal Notation


    IP addresses are 32 bits in length, for example:


    ```

    11000000 10101000 00000001 00000001

    ```


    For ease of human readability, IP addresses are denoted in dotted decimal notation,
    for example:


    ```

    192.168.1.1

    ```


    # Classes


    IP addresses have been classified into five different classes in which to allocate
    different sizes of networks. These are represented under the headings that follow.


    # Class A


    Class A IP addresses have been assigned to very large organizations that have
    few networks and a large number of hosts on each network. Note that class A IP
    addresses are not actively assigned anymore.


    0        8                31


    | 0 | NETWORK | HOST |


    +   - **First Octet** Ranges from 1 to 126. The first bit is always 0.


    +   - **Maximum Networks** The network address is denoted by the first octet.
    Therefore, 2^{8} - 2 = 126 is the maximum number of class C networks that are
    possible.


    +   - **Maximum Hosts per Network** Hosts are denoted by the last three octets.
    Therefore, 2^{24} - 2 = 16,777,214 hosts are possible per network. Most organizations
    have nowhere near these number of hosts, and therefore most of class A IP addresses
    are often wasted.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'Class B addresses are assigned to organizations that consist of a large number
    of networks and hosts. Therefore, many ISPs are assigned class B addresses.


    0 1 16 31  1 0 NETWORK HOST


    +   First Octet Ranges from 128 to 191. The first two bits are 1 and 0.


    +   Maximum Networks The network address is denoted by first and second octet.
    Therefore, 2¹⁴=16,384 class B networks are possible.


    +   Maximum Hosts per Network Hosts are denoted by the last two octets. Therefore,
    2¹⁶ −2=65,534 hosts are possible per network.


    Class C addresses are used by organizations consisting of a small number of hosts
    per network.


    0 1 2 24 31  1 1 0 NETWORK HOST


    +   First Octet Ranges from 192 to 233. The first three bits are 1,1, and 0.


    +   Maximum Networks The network address is denoted by the first, second, and
    third octets. Therefore, 2²¹=2,097,152 class C networks are possible.


    +   Maximum Hosts per Network Hosts are denoted by the last octet. Therefore,
    2⁸−2=254 hosts are possible per network.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Class D


    Class D is a reserved class that was designed to be used to send multicast messages
    to a group of hosts.


    | 0 | 1 | 2 | 3 | 31 |

    |---|---|---|---|---|

    | 1 | 1 | 1 | 0 | MULTICAST ADDRESS |


    +   - **First Octet** Ranges from 224 to 239. The first four bits are 1, 1, 1,
    and 0.


    # Class E


    Class E is a reserved class. No IP addresses that fall under this class are assigned
    on the Internet.


    | 0 | 1 | 2 | 3 | 4 | 31 |

    |---|---|---|---|---|---|

    | 1 | 1 | 1 | 1 | 0 | RESERVED |


    +   - **First Octet** Ranges from 240 to 255. The first five bits are 1, 1, 1,
    1, and 0.


    # Subnet Masks


    Network addresses and host addresses are identified by the use of subnet masks.
    A *subnet mask* is a series of bits that match the network portion of a given
    address. For example, the following would be the network mask for a class B IP
    address:


    ```

    11111111  11111111  00000000  00000000

    ```


    The preceding mask would be 255.255.0.0 in dotted decimal notation.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# **CIDR (Classless Inter-Domain Routing)**


    Because of the tremendous growth of the Internet, the five IP classes just listed
    were not sufficient to accommodate the many network schemes needed.


    CIDR addresses, which were designed to meet this growing need, are denoted using
    the following notation:


    ```

    PREFIX/mask

    ```


    where PREFIX is the IP address prefix, and mask is the length of the network mask.
    For example:


    ```

    192.168.1.0/24

    ```


    Here, the PREFIX is 24 bits long, while the suffix is the remaining 8 bits. Therefore,
    this CIDR class will include the following IP addresses: 192.168.1.0–192.168.1.255.


    # **Loopback**


    The following range is referred to as a “loopback” range:


    ```

    127.0.0.0/8

    ```


    This range is used to designate the loopback address of the local host. Any packet
    sent to an address in this range will revert back to the host. Note that packets
    destined for an IP address in the loopback range do not propagate to the hardware
    network device, and therefore are never placed on the physical network wire.


    # **Private Addresses**


    The Internet Assigned Numbers Authority (IANA) has reserved the following three
    IP blocks for private intranets:


    ```

    10.0.0.0-10.255.255.255 (CIDR Notation: 10.0.0.0/8)

    172.16.0.0-172.31.255.255 (CIDR Notation: 172.16.0.0/16)

    192.168.0.0-192.168.255.255 (CIDR Notation: 192.168.0.0/16)

    ```


    # **Protocol Headers**


    RFC (Request For Comments) documents provide detailed information on the implementation
    of TCP/IP protocols. These documents contain protocol header information, a few
    examples of which are listed here.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '![](img/77287f6ef97ef0bed6e23f6610950d06_35_0.png)


    Usually, IP headers do not contain the Options field and are therefore 20 bytes
    long. When the Options field is present, its actual length is represented by the
    Total Length field which contains the length of the entire packet (header and
    data). Please see RFC 791 for more details: [http://www.faqs.org/rfcs/rfc791.html](http://www.faqs.org/rfcs/rfc791.html).


    # TCP (Transmission Control Protocol) Header


    Every TCP packet is encapsulated within the Data field of an IP packet, which
    immediately follows the IP header. The following represents the layout of a TCP
    header. Note that the digits on the top of the header represent a byte each.


    ![](img/77287f6ef97ef0bed6e23f6610950d06_35_1.png)


    Please see RFC 793 for more details: [http://www.faqs.org/rfcs/rfc793.html](http://www.faqs.org/rfcs/rfc793.html).'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# UDP (User Datagram Protocol) Header


    Similar to TCP, every UDP packet is also encapsulated within the Data field of
    an IP header. The following represents the layout of a UDP header. The digits
    on the top of the header represent a byte each.


    | 0 | 7 | 8 | 15 | 16 | 23 | 24 | 31 |

    |:---:|:---:|:---:|:---:|:---:|:---:|:---:|:---:|

    | Source Port | Destination Port |

    | Length | Checksum |

    | data octets ... |


    Please see RFC 768 for more details: [http://www.faqs.org/rfcs/rfc768.html](http://www.faqs.org/rfcs/rfc768.html).'
  merge: -1
  img_proc: true
