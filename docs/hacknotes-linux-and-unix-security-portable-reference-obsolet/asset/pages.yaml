  md: '# Grab the SMTP Server Banner


    SMTP daemon banners can be obtained by telnetting to port 25 of the host SMTP
    is running on:


    ```

    ```

    [bash]$ telnet 192.168.1.1 25

    Trying 192.168.1.1...

    Connected to 192.168.1.1.

    Escape character is ''^]''.

