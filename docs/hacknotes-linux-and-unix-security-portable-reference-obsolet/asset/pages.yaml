    Please see http://securityfocus.com/bid/3447 for more information.


    # Update or Patch the Kernel


    Usually, patches for kernel vulnerabilities are promptly released by the

    kernel developers. Make sure to install such patches immediately

    before they are exploited by malicious users.


    # Local Buffer Overflows


    Please refer to Chapter 4 for an introduction to buffer overflow attacks.

    Local applications and services are also susceptible to buffer over-

    flow attacks. For example, the “HP-UX IPCS Core File Buffer Overflow

    Vulnerability” was caused by improper bounds checking of core file

    names. The `ipcs` program susceptible to this vulnerability could be

    exploited by local users to gain root privileges on the victim host. More

    details of this vulnerability are available at http://securityfocus.com/

    bid/7216.


    > Do not neglect to install the latest patches against local applications and
    services.

    > See Chapter 9 for more information.


    # Improper Input Validation


    It is very important to perform input validation on programs that accept

    input parameters. Setuid programs execute with the privileges of the

    root user, and therefore a minor input validation flaw may allow a local

    user to execute commands with superuser privileges.


    As an example, consider the `runltt` utility, which was found to be

    vulnerable to privilege escalation due to an improper input validation

    condition. See http://securityfocus.com/bid/6077 for details.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# Symbolic Links


    Symbolic links are special files that contain pathnames to other files. When a
    program attempts to access a file that is a symbolic link, the kernel transparently
    redirects the process to the filename the symbolic link refers to.


    Although symbolic links are a useful feature, they can be used to exploit vulnerable
    programs that do not check to ensure if the files being accessed are symbolic
    links. For example, consider the CDE Toolkit symbolic link vulnerability, which
    failed to check if the log file being written to was a symbolic link file. An
    attacker may create a symbolic link file to /etc/shadow whose name and path are
    the same as those of the log files created by Toolkit. This will cause Toolkit
    to write its log to /etc/shadow, causing its contents to become corrupted. If
    an attacker were successful in forcing specific contents to be written to sensitive
    files, he or she could abuse such vulnerabilities to obtain elevated privileges.
    See http://securityfocus.com/bid/5083 for more details on the CDE Toolkit vulnerability.


    # Core Dumps


    When a Unix or Linux process crashes, a “core” file is created by the operating
    system. This file contains information about the crashed process. Core files are
    used by developers to debug software. Since core files contain details about the
    crashed process, an intruder may purposefully exploit a known vulnerability in
    order to crash a running process to obtain sensitive information that may be placed
    in the core file.


    # Solaris FTP Core Dump Shadow File Recovery Vulnerability


    The FTP server distributed in older versions of Solaris was known to place parts
    of /etc/shadow in its core file when forced to crash using the following command:


    ```

    CWD ~

    ```


    After crashing the FTP server process using this command, the intruder may obtain
    the core file dumped in order to obtain parts of the /etc/shadow file. Here is
    a sample session that attempts to do this:


    ```

    ```

    [bash]$ telnet 127.0.0.1 21

    Trying 127.0.0.1 . .

    Connected to 127.0.0.1.

    Escape character is ''^].

    220 127.0.0.1 FTP server (SunOS 5.6) ready

    user joe

    331 Password required for joe.

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 172
  md: '```text

    pass wrongpassword

    530 Login incorrect.

    cwd -

    530 Please login with USER and PASS.

    Connection closed by foreign host.


    [bash]$ strings /core | grep root

    root:$1$PycWBlRj8bSbCKLz7/CBPbePhXUcHLn0gI:12141:0:99999::7:::

