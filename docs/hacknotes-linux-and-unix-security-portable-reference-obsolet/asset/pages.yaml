  md: '# ## Locating Protected Data Resources


    Sensitive information is often placed on web sites within directories called "protected,"
    "secret," "passwords," etc. Many times, these directories are not password protected
    and can be easily searched.


    As an example, consider the Apache web server, which is often configured to provide
    authentication when certain configuration and password files are present in a
    directory. The password file, often called .htpasswd, should not be served by
    the web server. To search for such files on the Internet using http://www.google.com,
    perform the following query: “Index of" .htpasswd. Here is an example of an .htpasswd
    file:


    ```

    joe:1WjdCjJCQwGFA

    admin:XRouH05gTMIU.

    ```


    Password hashes contained in this file can be easily cracked using a password
    cracker such as "John the Ripper."


    ```

    [hash]$ john .htpasswd

    Loaded 2 passwords with 2 different salts (Traditional DES [24/32 4K])

    password      (joe)      (admin)

    guesses: 2  time: 0:00:00:21 (3)  c/s: 83610  trying: bly045 - Slet20

    ```


    John the Ripper is available at http://www.openwall.com/john/.


    # ## Looking Through Configuration Files for Sensitive Information


    Various configuration files containing information such as passwords, secret keys,
    usernames, internal IP addresses, and other sensitive data are mistakenly served
    by various web servers when placed within the web root directory. Searching for
    these files is a matter of knowing their names. One potentially vulnerable file
    is sshd_config, which contains configuration information for SSH servers. A potential
    intruder may perform a search using the query “Index of” sshd_config in order
    to find web servers that serve the sshd_config file. Since such configuration
    files contain sensitive information, they may expose critical information that
    should not be accessible by external entities.


    # ## Searching Usenet Archives for Administrative Shortcomings


    Newsgroup postings often contain information that can serve as an aid to an attacker.
    For example, administrators sometimes post to technical


    ![](img/77287f6ef97ef0bed6e23f6610950d06_61_0.png)'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'Usenet groups in order to ask for help on certain topics. Such postings may
    give away lots of information and alert an intruder to the fact that the administrator
    is having trouble with configuring certain services. The site http://groups.google.com/
    can be used to search for such revealing postings.


    # ## Defend Against Search Engine Exposure Vulnerabilities


    Enforcement of the following defensive tactics are strongly recommended in order
    to minimize the risks associated with exposure of sensitive information by search
    engines and web-server misconfigurations:


    +   - Do not advertise the availability of job positions in a manner that might
    expose administrative weaknesses relating to security.


    +   - It is a good idea to perform routine audits against your web-server configuration
    and the data it is allowed to serve. If you have access to the web server itself,
    then you can search for specific information from within the web root. For example,
    the following command will list all the filenames containing the word “log”:


    ```

    ls -alR /var/web-root/html | grep log

    ```


    Content within static data can also be searched. To search for a specific word,
    say “password,” in the contents of files contained in the web root:


    ```

    grep -R password /var/web-root

    ```


    In case local access to the web server file system is not available, wget is a
    good command-line tool that can be used to mirror the web site. Once the web site
    content is available locally, it is possible to perform greps on data as just
    suggested. An example usage of wget:


    ```

    wget -m -np http://www.somecompanyasanexample.com/

    ```


    The wget tool is available from http://wget.sunsite.dk/.


    +   - Administrators must be instructed not to post job vacancies on technical
    newsgroups and message boards using their real names and e-mail addresses.


    # # DOMAIN REGISTRARS


    A single organization may own many networks at different locations. Discovering
    domain names associated with a particular organization is'
