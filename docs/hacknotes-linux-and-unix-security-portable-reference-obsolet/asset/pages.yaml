- pgno: 128
  md: '# DNS (Domain Name System): 53 (TCP and UDP)


    DNS is a protocol used to translate between domain names and IP addresses.


    **Spoofing**  Unlike TCP, UDP is not a connection-oriented protocol. This makes
    it easy to spoof UDP traffic. When a DNS client queries a DNS server, the DNS
    server responds to the query by sending a UDP packet originating from port 53.
    However, a malicious user located on the same network segment or within the path
    to the DNS server could send a response back to the client with the source IP
    address of the DNS server. If the malicious user’s response is received by the
    client before that of the authentic DNS server, the malicious response will be
    accepted. Since the malicious user could craft a spoofed DNS response back to
    the client, he or she may trick the client into connecting to his or her host
    instead of the intended target.


    # Spoof DNS Responses


    The dnsspoof program, distributed along with Dsniff, is a tool that facilitates
    the forging of DNS queries. For example, suppose an attacker has gained control
    of a network’s gateway with IP address 10.0.0.1. Let us assume that the real IP
    address of somecompanyasanexample.com is 10.1.1.2. The attacker can now run dnsspoof
    and cause it to respond to all DNS queries for somecompanyasanexample.com with
    192.168.1.1, the IP address of his or her machine.


    ```

    [gateway]$ dnsspoof -i eth0 -f /etc/dnssniff.txt

    Kernel filter: protocol ALL, raw packet socket

    dnsspoof: listening on eth1 [udp dst port 53 and not src 10.0.0.1]

    ```


    The attacker would need to make sure that the contents of /etc/dnssniff.txt contain
    the following:


    ```

    192.168.1.1 somecompanyasanexample.com

    ```


    Now, in an attempt to identify the intruder, if the victim should perform a DNS
    query for somecompanyasanexample.com, he or she is pointed to the IP address of
    the hacker’s machine at 192.168.1.1 (instead of 10.1.1.2):


    ```

    [bash]$ host somecompanyasanexample.com

    somecompanyasanexample.com has address 192.168.1.1

    ```


    # DNSSEC


    Consider using DNSSEC (DNS Security), an extension to DNS that provides for end-to-end
    authenticity. See http://www.dnssec.net/ for more information about DNSSEC.'
