- pgno: 15
  md: "# HACKNOTES: THE SERIES\n\nMcGraw-Hill/Osborne has created a brand new series\
    \ of portable reference books for security professionals. These are quick-study\
    \ books kept to an acceptable number of pages and meant to be a truly portable\
    \ reference.\n\nThe goals of the HackNotes series are\n\n+   \n+   * To provide\
    \ quality, condensed security reference information that is easy to access and\
    \ use.\n+   * To educate you in how to protect your network or system by showing\
    \ you how hackers and criminals leverage known methods to break into systems and\
    \ best practices in order to defend against hack attacks.\n+   * To get someone\
    \ new to the security topics covered in each book up to speed quickly, and to\
    \ provide a concise single source of knowledge. To do this, you may find yourself\
    \ needing and referring to time and time again.\n\nThe books in the HackNotes\
    \ series are designed so they can be easily carried with you or toted in your\
    \ computer bag without much added weight and without attracting unwanted attention\
    \ while you are using them. They make use of charts, tables and bulleted lists\
    \ as much as possible and only use screen shots if they are integral to getting\
    \ across the point of the topic. Most importantly, so that these handy portable\
    \ references don’t burden you with unnecessary verbage to wade through during\
    \ your busy day, we have kept the writing clear, concise, and to the point."
  merge: -1
  img_proc: true
- pgno: 16
  md: 'Whether you are brand new to the information security field and need useful
    starting points and essential facts without having to search through 400+ pages,
    whether you are a seasoned professional who knows the value of using a handbook
    as a *peripheral brain* that contains a wealth of useful lists, tables, and specific
    details for a fast confirmation, or as a handy reference to a somewhat unfamiliar
    security topic, the HackNotes series will help get you where you want to go.


    # # Key Series Elements and Icons


    Every attempt was made to *organize* and present this book as logically as possible.
    A compact form was used and page tabs were put in to mark primary heading topics.
    Since the Reference Center contains in-formation and tables you''ll want to access
    quickly and easily, it has been strategically placed on blue pages directly in
    the center of the book, for your convenience.


    # ## Visual Cues


    The icons used throughout this book make it very easy to navigate. Ev-ery hacking
    technique or attack is highlighted with a special sword icon.


    # ### This Icon Represents a Hacking Technique or Attack


    ![](img/77287f6ef97ef0bed6e23f6610950d06_16_0.png)


    Get detailed information on the various techniques and tactics used by hackers
    to break into vulnerable systems.


    Every hacking technique or attack is also countered with a defensive measure when
    possible, which also has its own special shield icon.


    # ### This Icon Represents Defense Steps to Counter Hacking Techniques and Attacks


    ![](img/77287f6ef97ef0bed6e23f6610950d06_16_1.png)


    Get concise details on how to defend against the presented hacking technique or
    attack.


    There are other special elements used in the HackNotes design con-taining little
    nuggets of information that are set off from general text so they catch your attention.


    This "i" icon presents reminders of information, knowledge that should be re-membered
    while reading the contents of a particular section.


    ![](img/77287f6ef97ef0bed6e23f6610950d06_16_2.png)


    This flame icon represents a hot item or an important issue that should not be
    over-looked in order to avoid various pitfalls.


    ![](img/77287f6ef97ef0bed6e23f6610950d06_16_3.png)'
  merge: -1
  img_proc: true
