    Les Ponder is associate editor at Tom''s Hardware and a freelance maker for hire.
    He blogs about his projects at big5.


    > When computing is a shade of beige


    In the 1990s, Linux was still in its infancy and the jump from Windows to Linux
    was exciting and chilling. How can we experience these days again? In the absence
    of cheap hardware, we can use virtual machines to emulate hardware of the era
    and install Linux on a virtual PC.


    Why are we installing a KVM? It''s because QEMU is an emulator, and by using QEMU
    and having a CPU that supports VT-x or AMD we can see the virtualization to near-native
    speeds. Most modern processors have some form of support. Our virtual machine
    is in 3770 from 2017 and now it supports VT-x.


    We have chosen three Linux distros from the past three decades of virtual machines
    we will install and use each. Our choices spans the 1990s, 2000s and shows the
    similarities and differences between Debian, Ubuntu and Linux Mint.


