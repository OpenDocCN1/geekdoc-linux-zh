    # Using older or different controllers


    If you have more recent controllers (or the budget to buy them because they can
    be pricey these days), it might be easier to use an older generation of consoles,
    such as the Xbox 360 or PlayStation 3.


    Connecting an Xbox 360 controller requires the xboxdrv driver. The USB model should
    work out of the box, but you will need a dedicated driver (which is developed
    by kernel) to download it.


    The Xbox 360 controller is simple to switch with Raspberry Pi, but connecting
    a PS4 controller is more involved. Unless you opt for Bluetooth, Bluetooth requires
    connecting also.


    After updating and upgrading the Raspberry Pi, create a folder for the software
    software to communicate with the Raspberry Pi over Bluetooth:


    ```

    sudo apt install libusb-dev

    ```


    Next, create a folder for the software switch, compile the code and run it:


    ```

    mkdir ~/sixpair

    cd ~/sixpair

    git clone https://github.com/patrick-stuart/sixpair.git

    Compile the code with gcc:

    gcc -o sixpair-linux usb

    ```


    Now you connect the PS3 to the Pi using its USB cable and run sixpair to configure
    the Bluetooth controller:


    ```

    sudo ~/sixpair/sixpair

    ```


    Make note of the MAC code, disconnect the PS3 controller. You''re now ready to
    start bluetooth controller as explained in the instructions for the Xbox One.


    Note that you''re limited to controllers - almost any controller you can use with
    a USB connector can be connected to a Raspberry Pi. Cheap controllers are also
    top-end pads for PC, if there''s a suitable USB driver enable then the controller
    will work.


    For other controllers, generic connections works. This means any smartphone, for
    example, can be connected seamlessly using bluetooth though no pairing may be
    required.


    Whatever device you use, you may need to test the testing in the library:


    ```

    sudo apt install joystick

    Then run jest

    sudo jest /dev/input/js0

    ```


