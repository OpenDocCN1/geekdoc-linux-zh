  md: '# Ultimate Linux Projects


    # MICRO:BIT


    # # Build radio walkie-

    talkies with Python


    Using a pair of BBC micro-bit devices, Calvin Robinson creates walkie-talkies
    in Python.


    The BBC micro:bit is an open-source computer. Launched in 2015/16, the BBC gave
    UK secondary schools the opportunity to apply for one free unit for each Year
    7 pupil. The idea was that every child could keep their micro:bit for free and
    develop a passion for coding.


    UK readers might remember the BBC Micro from their school days (1981-1994), an
    Acorn computer used for programming in BASIC. The


    adaptable, and a fraction of the size, to be used alongside a PC or Raspberry
    Pi.


    The micro:bit features 25 LEDs, two programmable buttons, an accelerometer, magnetometer,
    Bluetooth Smart Technology and various inputs/outputs. The unit is specifically
    designed for Blocks


    are ideal for making things move and buzz with buzzer clips. (A JavaScript editor)
    and Python, it is also possible to program it with Free Pasal, Simulink, C, and
    other languages.


    ![](img/2f8aba538b6f14f57de8cb694470acb2_91_0.png)


    For this tutorial, we''re going to be coding in Python. There are many number
    of editors available for the micro:bit, including some that emulate the micro
    hardware, so one unit isn''t a barrier to entry.


    Visit https://microbit.org/code/ and click ''Let Code'' to open the page for the
    micro:bit Editor. The Editor is our great native GUI interface (https://code.microbit.org/),
    which features UFlash and Python and command line interfaces. There''s also a
    micro-based editor on the micro:bit website.


    OUR EXPERT


    Calvin Robinson is a former principal and Computer Science teacher with a degree
    in Computer Games Design and Programming (BSc.).


    ```

    mycode.py

    ```


    | Settings | Accelerometer | Address |

    |---|---|---|

    | hex(0x56D597) | Group (0-255) | B |

    | Update | | data rate: RATE_IMBIT |


    ![](img/2f8aba538b6f14f57de8cb694470acb2_91_1.png)


    QUICK TIP


    If you make a mistake in your code, keep an eye on the LEDs; Microbits have their
    own built-in, so the error will cross the LEDs, starting with the line number.


    ![](img/2f8aba538b6f14f57de8cb694470acb2_91_2.png)


    This micro:bit is an on-only device. Code.microbit.org is not affiliated with


    > REPL provides a fantastic tool for testing micro:bit code without a microbit.


    We''re going to program some walkie-talkie devices that send messages from one
    to other. We can pre-send messages and lines of scrolling text across the LEDs
    on the microbit.


    The micro:bit supports Bluetooth (BLE) and radio transmission, but BLE is not
    supported by Python (version of Python on microbit), so we will be using radio
    to make our micro:bits communicate with each other. There is limit to the number
    of micro:bits that can send/receive over radio transmission, other than the 2.4GHz
    frequency channel.


    We highly recommend using no more than half of micro-bits to begin with (two is
    fine), and to keep them in the same room until the code is functioning, so you
    can rule out the possibility of walls or objects interfering with the signal.


    ![](img/2f8aba538b6f14f57de8cb694470acb2_91_3.png)


