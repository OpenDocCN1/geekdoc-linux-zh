  md: "# Build radio walkie-talkies with Python CODING ACADEMY\n\n![](img/2f8aba538b6f14f57de8cb694470acb2_94_0.png)\n\
    \n# SIGNAL STRENGTH\n\nMicrobits transmit specific information every time we send\
    \ or receive data over the radio. If we use radio_full() instead of radio_receive(),\
    \ we'll get a tuple, including the message content, signal strength and a time-stamp.\
    \ The strength (RSSI) will be displayed as dBm between 0 and -255dB.\n\nWe can\
    \ create signal strength meters using the radio signal. By using one or multiple\
    \ microbits up that we constantly send a radio message on low power, we can create\
    \ a receiver that can parse the message and display the signal strength\n\n```\n\
    incoming = radio_receive()\nif incoming:\n  display(incoming)\n```\n\nOur white\
    \ look consists looking for an A or B button but also allows to set messages to\
    \ scroll. It's also practical to clear the screen with displayclear(). We may\
    \ also decide to displayshow() the message instead of scrolling, or if we plan\
    \ to show images or text. If text scrolls too it is usually better to just pop\
    \ the message. Again, add a sleep to the end of our loop to save processing time.\n\
    \n```\nWhile\n  message=radio_full()\n  if message:\n    strength = message[1]+100\n\
    \    display(int(strength/10))\n    sleep(200)\n  else:\n    display(NO)\n```\n\
    \nTo handle text, we need to create a transition to let the user know an incoming\
    \ message has been received, before showing it. The user has less chance of missing\
    \ the message, which could easily happen if the text starts scrolling over the\
    \ LEDs without prior warning. \n\nNow we can get to display the higher signal\
    \ strength. We would like to make a game by designing an image for one and the\
    \ other. As we move away, the more numbers we will display the hot image, showing\
    \ that we're getting closer, displaying the color as we are moving away. The built-in\
    \ images and NO will display a tick and a cross, to help make things even.\n\n\
    ```\nif incoming:\n  display(alertmessage)\n  sleep(100)\n  display(alert)\n \
    \ sleep(100)\n```\n\nThis would require a little sleep up, before the 'while'\
    \ loop.\n\n```\nalertmessage = Image(\"x0000:0000:0000:0000:0000:0000:0000:0000\"\
    )\nalertText = \"Incoming message\":\n```\n\nIf you haven't got two microbits,\
    \ you can test all of your code on https://make.code.uk website, simulating communication\
    \ with bits. Provided your code imports the micro bit module, turned on the radio\
    \ and has a loop waiting to receive and display the message with the radio tool.\
    \ Make sure you use the same channel number (anything between 0 and 10), and some\
    \ test data (preferably a simple string). It should scroll across your simulator\
    \ micro:bit LEDs. You can also press the buttons on the microbit and they would\
    \ function as intended.\n\n![](img/2f8aba538b6f14f57de8cb694470acb2_94_1.png)\n\
    \nWhen you're happy with your code, download the HEX file. Once it is done, plug\
    \ your micro bit into your computer using a USB cable; it will automatically mount.\
    \ Next, simply drag the HEX file onto your microbit's drive. It should override\
    \ any previously installed HEX, since your micro bit has\n\nPaired with battery\
    \ packs, the walkie-talkies are completely wireless and would actually have a\
    \ decent range.\n\nextremely limited storage capacity and only for one single\
    \ HEX file\nAs the copying process is complete, the microbit will be running in\
