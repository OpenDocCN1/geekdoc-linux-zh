  md: '# Ultimate Linux Projects


    # ESCAPE GOOGLE PHOTOS


    Google''s free photo storage is a thing of the past. Jonni Bidwell has some free
    software to get your albums in order.


    ![](img/2f8aba538b6f14f57de8cb694470acb2_39_0.png)


    When invitations to Google''s new mail service found themselves in the hands of
    the great unwashed, world of free email changed. No longer did we have to deal
    with a handful of megabytes of storage, obvious adverts and the terrible fear
    that at any point connectivity failure would leave us working on oblivion. Now
    users could enjoy 2GB of storage, and further enchanting that quota quite rise,
    never so without adverts, they were small and textual. They were also relevant
    because they were chosen by algorithms that fed the contents of your email.


    Later, Google would add free unlimited storage for all your photos and later still,
    free storage for up to 50,000 audio files. A decade later, however, Google discovered
    that even with their impressive resources, they lacked potential revenue for free.
    Google Play Music shut down at the end of 2020, and from June 2023, Google of
    Photos (now without compression) moved towards their 15GB storage quota. At the
    time of writing, the relevant support page warns that accounts exceeding the limit
    face potential file deletion. If the aggregate of your Google Drive and Gmail
    is already approaching that, then it''s time to take action.


    There are all manner of other free storage options, which we''ll cover in this
    exhaustive feature. But there''s no shortage of open-source solutions that you
    can self-host, either at home (the former can, of course, do much more than just
    photos) or look at two: Nextcloud and Lyche. Both of these can be used locally
    or remotely, on a rented VPS in the cloud or a Raspberry Pi under your desk. And
    if you just want to pay to take care of your photos, we''ll look at some of those
    services, too.


