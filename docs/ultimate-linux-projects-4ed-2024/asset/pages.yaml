  md: "# Build radio walkie-talkies with Python CODING ACADEMY\n\n# # Coding for micro:bit\n\
    \nTo get started with micro:bit, we need to import the micro:bit module and the\
    \ specific functions for displaying images and the two buttons, 'a' and 'b'.\n\
    \nfrom microbit import Display, Image, button_a, button_b\n\nNow, to display text,\
    \ we can use 'scroll' or 'show' a string of text. The display function contains\
    \ options: scroll and show, which will display the entire content either from\
    \ left to right, or one letter at a time:\n\n```\ndisplay.scroll('Hello')\ndisplay.show('world')\n\
    ```\n\nDisplaying images is a simple process. There is a whole host of built-in\
    \ images that the micro:bit will recognize, including emojis:\n\n```\ndisplay.show(Image.HAPPY)\n\
    sleep(1000)\ndisplay.show(Image.S)\n```\n\nTo draw our own images we'll need to\
    \ precisely which LEDs we'd like to light up and how bright we want them on a\
    \ scale of 0 – 9 (0 being off and 9 being bright)\n\n```\nimage = Image(\n  \"\
    \"\"\"\n  \"\"\"\"\n  \"\"\"\"\n  \"\"\"\"\n  \"\"\"\"\n  \"\"\"\"\n  \"\"\"\"\
    \n  \"\"\"\"\n  \"\"\"\"\n  \"\"\"\"\n  \"\"\"\"\n  \"\"\"\"\n  \"\"\"\"\n  \"\
    \"\"\"\n  \"\"\"\"\n  \"\"\"\"\n  \"\"\"\"\n\"\"\")\n```\n\n```\ndisplay.show(image)\n\
    sleep(1000)\n```\n\nFor easy life, or to save space, we can carry this down to\
    \ a single line. The columns remain in place between lines of text, but if we\
    \ want to scroll the text across the screen, we can use:\n\n```\nLEDS = image.scroll(\"\
    0000:0000:1111:2222:3333:4444:5555:0000\")\n```\n\n```\ndisplay.show(LEDS)\nsleep(0)\n\
    ```\n\nWe used a single bright LED here to highlight the difference in hue\n\n\
    Since this article was written in December in a festive mood, why didn't we create\
    \ a Christmas tree for our micro:bit and another micro bit?\n\n```\nxmatrix =\
    \ Image(\"\")\ndisplay.show(button_a)\n```\n\nIt is well and good to display our\
    \ images before we're about to show another device we need to work with. Here\
    \ is a basic button that can be used as an example of how the functions work:\
    \ We've used an image with a small pulse (sleep) so not to cause a heavy load\
    \ on the processor.\n\nfrom microbit import\n\n```\ncounter = 0\nnew_value = 0\n\
    ```\n\nWhile True:\n\n```\n# increment 1 if button A was pressed\nif button_a.pressed():\n\
    \  new_value = counter - 1\n```\n\n```\n# increment 1 if button B was pressed\n\
    ```\n\n![](img/2f8aba538b6f14f57de8cb694470acb2_92_0.png)\n\nQUICK TIP: The microbit\
    \ uses Python. More info and tutorials are available at https://microbit.org/readcode\
    \ - including help with text, images, buttons, music, pictures, directions, and\
    \ storage.\n\n# ## MORSE CODE\n\nMicro-bits are used for Morse communication.\
    \ Using images or strings to light the LEDs, we can use the flash to up the right\
    \ LED for a set amount of time. The following code will display a full flash for\
    \ 10ms:\n\n```\ndisplay.show(flash, delay=10)\nsleep(50)\n```\n\nTo introduce\
    \ a new message we can select a selection to the micro:bit for different lengths:\
    \ depending on what we want to represent with dots and dashes. For the purposes\
    \ of example, a dot is 5ms:\n\nif incoming == 'a':\n\n```\ndisplay.show(flash,\
    \ delay=5)\ndisplay.show(flash, delay=10)\n```\n\nelif incoming == 'b':\n\n```\n\
    display.show(flash, delay=10)\ndisplay.show(flash, delay=5)\ndisplay.show(flash,\
    \ delay=5)\ndisplay.show(flash, delay=5)\n```\n\nAfter developing Morse code statements\
    \ for each letter of the alphabet, we can then use a loop to recognize each incoming\
    \ letter, or only single letters at a time. As we have two buttons on the microbit,\
    \ showing them on the LEDs, and the other button to send the letter, we will be\
    \ able to send messages to the friend without having to re-program the microbit\
    \ every time we want to say something.\n\nUltimate Projects | 19"
