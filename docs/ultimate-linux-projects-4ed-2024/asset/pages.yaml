    # Decode signals from weather satellites


    Weather satellites transmit signals that you can receive and decode to generate
    images of the Earth. Mike Bedford shows


    ![](img/2f8aba538b6f14f57de8cb694470acb2_31_0.png)


    satellite-based images of the Earth cloud cover have been a regular signal in
    TV weather broadcasts since the NOAA-1 satellite launched in 1960. Yet the result
    is familiar, the technology that uses these images is less well-appreciated. If
    you want to learn about the technology involved, it''s not too difficult to get
    a handle on it.


    However, you can also gain experience, as we demonstrate here, and a practical
    approach is one of the best ways to learn. So, we will show you how to receive
    satellites and how to generate data pictures. In addition, we''ll also investigate
    some ways of image processing to improve that image and perhaps introduce false
    colour into the inherent noise.


    +   OUR EXPERT Mike Bedford is fascinated by receiving signals from satellites
    and processing the data to generate images.


    most are no longer operational, NOAA-16 and NOAA-17 even though they were launched
    after NOAA-15. However, NOAA-15 is experiencing operational problems since 2019
    so there are no guarantees that you''ll be able to receive and decode its transmissions,
    even though we had no difficulties. There''s also NOAA-20, but this is the first
    of a new generation of orbiting satellites at a much higher frequency which makes
    it significantly more difficult to receive. For that reason, decoding software
    might be too difficult, unless you find something available online.


    The laws of gravity dictate that any satellite has a velocity and an orbital period,
    which depends on its altitude. This means that the further the orbit is, the slower
    it orbits the Earth. According to its designers, the closer a satellite is to
    the Earth, the faster it.


    # NOAA satellites


    Here we get to be looking at polar orbiting satellites — NOAA-15, NOAA-18 and
    NOAA-19 which are operated by American National Oceanic and Atmospheric Meteorology.
    We chose these satellites because they are all within a range of 850km.


    An example is a satellite that orbits at an altitude of 35786km. It orbits the
    Earth every 24 hours in an equatorial orbit, traveling in the same direction as
    the Earth''s rotation. It''s possible to have a satellite that stays over the
    same point on the ground in a geostationary orbit and there are geostationary
    satellites, for example NOAA-5, GEOS-15 and GEOS-17. Turning to main the point
    of polar orbiting satellites, NOAA-15 and NOAA-18 orbit at 950km and orbit the
    Earth just 14 times every 24 hours.


    If you''re wondering why the satellite numbers aren''t contiguous, all from NOAA-6
    have used


    the suggests, that these particular satellites take them over the poles. However,
    important because the Earth is not a perfect sphere, that every orbit shifts in
    a way that allows a different swath of the Earth''s surface to cover the previous
    orbit. This arrangement enables each satellite to obtain images from any point
    on the Earth''s surface twice each day: during daylight and at night.


    # Is it still?


    That''s enough for now, so let''s take a look at how to receive signals from these
    satellites. Not too ago you''ve had to build a radio receiver that covered the
    frequencies used by the NOAA polar orbiting satellites, but you can also use SDRs.
