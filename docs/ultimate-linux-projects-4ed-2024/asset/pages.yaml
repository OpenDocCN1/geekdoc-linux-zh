  md: '# Raspberry Pi projects


    # get your kit ready


    Prepare your USB cables, SD cards and a cup of tea. It’s Raspberry Pi project
    time...


    With more 34 million units sold, the Raspberry Pi is not only one of the world''s
    most popular computers – it is also one of the most important. Designed to help
    kids learn about technology, this impressive, single-board system is the leading
    choice for makers, developers and hobbyists who want to do everything from building
    robots to setting up retro arcade machines. Whether you are aged eight or eighty,
    the Raspberry Pi is made for you and there are models ranging from £5 to £65 to
    suit any budget.


    When you do with your Raspberry Pi, you''re going to need an SD card with an operating
    system. The official Raspberry Pi OS (formerly Raspberrybian) is popular and many
    others are great starts for many projects. Available at www.raspberrypi.org/software/operating-systems.
    There is an official Raspberry Pi Imager that you can use (or a selection of others)
    to flash your SD card or use our BalenaEtcher for the advantage of being able
    to handle compressed images.


    ![](img/2f8aba538b6f14f57de8cb694470acb2_98_0.png)


    For older models there is another cause of errors. The Pi 3 uses a micro USB so
    you might need a cheap adapter to switch its power input from micro USB to USB-C.
    The Pi 4 has unfortunately this port isn''t USB-C compliant. If you use a smart
    charger, it probably won''t work properly and might slightly damage your device.


    You won''t run into that if you use the official charger, so. And if you''re opposed
    to that, we''ve found that USB-C charger works-one that the smart charger is fine.
    Chargers should work well, too, but they might not be so reliable, so caveat empir.


    We''ve picked some useful, and interesting projects to showcase the tremendous
    scope of things that can be achieved with the humble Pi. From retro gaming to
    machine learning and Bitcoin, the possibilities are truly endless...


    The incarnation of the Pi 400 model, embeds a Pi 4, also pictured a keyboard.


    # Troubleshooting


    Throughout this feature we use a few different OS images, we''ve made a handy
    guide to writing them below. If you run into issues, it''s always worth remembering
    that a faulty SD card might be blame. It''s so worth trying a different thing
    if something goes wrong.


    # WRITING SD CARD WITH ETCHER


    ![](img/2f8aba538b6f14f57de8cb694470acb2_98_1.png)


    ![](img/2f8aba538b6f14f57de8cb694470acb2_98_2.png)


    ![](img/2f8aba538b6f14f57de8cb694470acb2_98_3.png)


    +   1 Download Etcher

    You''ll find Linux, macOS and Windows builds at https://balena.io/etcher. On Linux
    you also download official Imager, so once you''ve installed it, run chmod 755
    on the file (Properties > Permissions and check the box to allow execution). Now
    you can double-click the Appimage to run it (or so from the CL).


    +   2 Prepare the SD card

    Insert your SD card, select the file to your downloaded image. Select card and
    a menu will show all available devices. Hard drives are hidden to prevent you
    from accidentally overwriting them. Select your SD card, and check to make there''s
    nothing important on the card.


    +   3 Write the image

    Hit Flash your password and wait for the progress bar. You''ll be offered chance
    to use the same image again, which when you want to be preparing a fleet of Pi
    clones. But your SD card is ready for action. Move it from your PC to Pi, power
    on and let the adventures begin!


