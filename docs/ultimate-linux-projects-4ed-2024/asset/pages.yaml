    doing. Once you''re satisfied,


    ```

    $ sudo get-docker.sh

    ```


    This works instantly, and adds the necessary repositories so that it''s kept up
    to date as part of the regular package manager. The Docker Engine will start automatically
    on Debian and Ubuntu, but by Fedora you will need to start it manually with


    ```

    $ systemctl enable docker

    ```


