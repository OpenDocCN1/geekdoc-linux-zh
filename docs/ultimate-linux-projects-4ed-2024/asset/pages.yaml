    or API, they aren''t checking if your code is properly formatted, they are looking
    for a place where you haven''t protected the input, an endpoint with a vulnerable
    system login, leaked credentials and/or sensitive data. Typically, if you''re
    running a scan on every test every six months then you''ve get some faults that
    you''re not aware of.


    Building DAST into your CI/CD takes only a few minutes and gives you everything
    that you''ve done a pen-test all year with an automated scan. The main difference
    is instead of it occurring once every few months we Scan every time someone merges
