    ![](img/2f8aba538b6f14f57de8cb694470acb2_55_1.png)


    Back in the late 1990s, this author chose their PC by magazines what was on the
    cover disc, something that had started back in their Amiga days. One month, they
    chose a PC machine that had something called Red Hat on the second which was wrongly
    installed on an AMD K-2 333MHz PC. It''s not fair to say that I love it at first.
