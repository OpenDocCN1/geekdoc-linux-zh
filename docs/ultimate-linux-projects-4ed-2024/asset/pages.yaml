    Connect a supported development device


    Connect with the hardware now. Raspberry Pi, Arduino, ESP32, or custom board.


    Use your phone


    Use your phone to capture photos of objects, audio, or events and then upload
    them.


    Get data from any data


    You can upload data from photos or development board over a serial connection.


    Upload data


    You can upload your training images directly in formats like PNG, JSON, or CSV.


    Integrate with your model


    The C code Edge Impulse integrates directly with the data in your cloud platform.


    Besides images from your device, Edge Impulse can connect to all kinds of data
    sources.


