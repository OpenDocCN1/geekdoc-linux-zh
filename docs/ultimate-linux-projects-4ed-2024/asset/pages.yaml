  md: "# # How to code diagrams, graphs and pie charts CODING ACADEMY\n\nNext, we\
    \ render the Markdown vscode.md inside\nMicrosoft VS Code:\n## A Markdown file\
    \ with Mermaid!\n\n```\n```mermaid\ngraph LR\n  A-->B & C\n  A1-->A2-->A3\n  B1-->B2\n\
    \  C1-->C2-->C3\n```\n```\n\nThis code presents an array of different charts.\
    \ Using mermaid &lt;node&gt;, you can simply write A&lt;node&gt; or A&lt;node&gt;=B&lt;node&gt;\
    \ in order to make node connections. Using `==` creates larger lines, as in C-C.\n\
    The screenshot shows the preview of **vscode.md** using the Mermaid extension\
    \ for *Visual Code*.\n\n# ## Creating a pie chart\n\nMermaid easily creates pie\
    \ charts and can give you the calculations for how many of slices there are. To\
    \ create a pie chart, you need to begin the Mermaid block with **title** followed\
    \ by the title text. After that, you need to write the dataset that's used for\
    \ generating the pie chart. Each slice is a different entry and contains a label,\
    \ followed by a positive numeric value. The label text should be in double quotes,\
    \ which isn't the case with the pie chart title text.\nThe following shows the\
    \ definition of a pie chart in the Mermaid dialect:\n\n# ## This is a Pie Chart\
    \ in Mermaid\n\n```\n```mermaid\npie\ntitle Linux Distributions\n\"Debian\": 32.96\n\
    \"Ubuntu\": 50.0\n\"CentOS\": 17.0\n```\n```\n\nThe previous code is saved in\
    \ the **flow_chart.md** file - render it on to see its output.\n\n# ## Creating\
    \ a flowchart\n\nFlowcharts start with the flowchart keyword, followed by their\
    \ orientation (LR or TD). Then you write the nodes of the flowchart as you would\
    \ like. If you want to add text inside it, use the shape `[text]`. You can add\
    \ any text to node by including it the node name. If you include the text in square\
    \ brackets, the node is a rectangle; use rounded brackets for a rounded node.\n\
