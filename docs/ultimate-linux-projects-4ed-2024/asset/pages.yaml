  md: '# # Raspberry Pi-based KVM over IP


    While you use a Raspberry Pi to access your PC, even if it won''t boot to an OS.


    Those of you who have needed to access a PC remotely will probably tried VPN or
    other applications such as TeamViewer. However, this kind of software only works
    when the computer''s OS is running, which means it can''t access the BIOS, reboot,
    install or power on the computer. There are several settings that make it possible
    to control a remote independently of its operating system, using a KVM over IP
    that can output full HD video, one of the most convenient and affordable approaches.


    While a homemade KVM over IP device can cost hundreds of pounds, it''s easy to
    create your own. A developer named Max Dewauw created Pi-KVM (https://pikvm.com/),
    which is designed to use a Raspberry Pi. If you have the parts, you can use the
    software he developed and your Pi, to do it for far less.


    +   * Raspberry Pi 4 or Zero

    * 16GB or smaller microSD card

    * HDMI-CSI bridge or HDMI-to-USB capture dong

    * USB female-to-male USB adapter

    * USB C to Type-A cable


    A USB-C power supply with USB Type-A output. If you be plugging a Type-A cable
    into the official Raspberry Pi power supply won''t work


    The first thing we need is to download the SD card image from pikvm.com. Depending
    on which Raspberry Pi you will use, and whether you use the HDMI-CSI bridge or
    HDMI-to-USB capture card, the file must be flashed to the SD card, but Etcher
    can also do this, locally or over the local network.


    Now we can come on to installing the HDMI-CSI bridge or USB-C cable and connecting
    the USB ribbon cable from the HDMI-to-CSI bridge to the Raspberry Pi''s camera
    port. Make sure that the blue faces match correctly. If you''re using an HDMI-to-USB
    dong instead, connect it to a USB port on your Pi. If you''re using a Pi Zero
    you''ll need a microUSB to USB-A hub.


    Disable the 5V pin on one of the USB connectors for your splitter. The easiest
    way to do this is to place a small piece of Kapton tape over the rightmost pin.
    You could also try cutting the lead to that pin, but that''s more complicated.
    This will be the connector that attaches to a USB port on the PC you wish to control.
    If you don''t disable that


    # YOU NEED


    # The Pi-KVM software


    At this point we''re ready to start using the Pi-KVM. On first it will take longer
    to finish the microSD card due to the initial setup. It isn''t buggy. Navigate
    to the Pi''s IP address in your router''s control panel or a browser on your computer
    client (if you''re controlling the other). You''ll be redirected to the login
    page, which you should log in using username and password.


    Click the K icon. You should now be presented with a screen allowing you access
    to the remote Pi and a number of others. Further options and instructions are
    available from the Pi-KVM GitHub.


