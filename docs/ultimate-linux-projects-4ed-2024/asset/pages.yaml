  md: '# # Ultimate Linux Projects


    # # Jitsi Meet


    # ## Set up, secure and self-host your own video nirvana, and you''ll never have
    to use Zoom.


    Jitsi Meet is a free, open-source video conferencing program that you can connect
    to via a browser or smartphone app. You can use it without signing up for your
    virtual meeting (or by visiting jitsi.si and accepting one of the random room
    generators). There are no downloads or configuration required by clients, they
    just need to click a link that you can share with everyone in the meeting room.
    Or attend with a PIN.


    ![](img/2f8aba538b6f14f57de8cb694470acb2_63_0.png)


    Obviously, Jitsi free service has some limitations, but these will be gone when
    we self-host our own Jitsi name. You don''t need install any special hardware
    to do this, and thanks to the excellent Debian and Ubuntu packages, you don''t
    really need to do much in the configuration at all. You''ll just need a name from
    a service such as DuckDNS or Dyns with it.


    As you can imagine (and we''ll look at this in a moment) the Jitsi is a rather
    complicated affair. Not only will you have the vagaries of streaming through NAT
    gateways (like home routers), but also need to keep everything secure with SSL,
    so if you use a signed certificate, your users will see security warnings.


    If you''re happy for you and your users to see these warnings (or brave enough
    to add exception to your browser), and its all local, you can get away with using
    a fake domain name in /etc/hosts file on your machine. Or


    just use IP addresses instead. It''s probably easier that to have an in-person
    conversation rather than involving machines... but where is the fun in that? If
    you have a domain, the install can automatically generate Lets encrypt, and then
    you see no security warnings.


    A Jitsi install is, a collection of components, all working in harmony to bring
    smiley faces closer in a world that grows more every day. Each instance on the
    web uses some pretty wild JavaScript to provide the web front. Most of the software
    is written in Java, though some de-coupled dependencies use C for video processing.


    The magic of connecting more than two participants is handled by Jitsi Videobridge
    (JVB). This uses XMPP (like Jabber) and WebRTC (like Google Meet) for signaling
    and video calls. Deciding which participant is the speaker, and who users see
    as focused on their screens, is handled by Jitsi. At the heart of it, all the
    XMPP server keeps all the components and users connected for more information
    about everything else Jitsi in the Handbook at https://jitsi.github.io/


    # ## Jitsi too much coffee


    For Jitsi to work for users behind STUN, NAT firewalls or obstacles to established
    connection, XMPP and web traffic must be able to flow to your server. If you use
    Jitsi behind a NAT you need to open ports 80 and 443 TCP port to allow for communications
    (UDP if you are connected behind a proxy). If you''re behind a home router, you''ll
    need to forward these ports manually.


    In an ideal world, one-one calls should bypass the JVB, and connect directly to
    one another (so-called p2p), but this might be tricky to negotiate - anyone who
    is not behind a firewall or proxy early enough will tell you.


    If we started with a simple service like one funeral, but then the default Jitsi
    configuration allows you to start or join a meeting on your server. If you use
    your server running in any way, then the list of friends or bots may discover
    your location and potentially cause trouble.


    The handbook covers how to set up configuration, which you should do. You should
    also check the philosophy before you begin at https://jitsi.org/blog/security.
    You''ll be using this guide to


    # ## IF IT DOESN''T WORK?


    If you can join from multiple locations but don''t see any other participants
    and conversations with a message you are telling you to use only one here, here
    port forwarding is almost certainly the culprit. In some cases, the extra port
    44443 will be necessary. Not that you need to check the logs, for Jitsi logs are
    in /var/log/jitsi and /var/log/jitsi-prosody. After a change so you don''t get
    confused by log alternatives.


    Alternatively, use tail to view the last few entries. After any configuration
    change, you''ll need to ensure that all the services are working properly. A matter
    of


    ```

    $ sudo apt install jitsi-videobridge jicro prosody jitsi-meet-web-config jitsi-meet-prosody
    jitsi-meet-turner jitsi-meet-jofo jitsi-videobridge2

    ```


