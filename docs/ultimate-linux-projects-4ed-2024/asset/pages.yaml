  md: '# Ultimate Linux Projects


    # # Multi-room Pi audio


    Get your Raspberry Pis in sync, audibly throughout your home.


    ![](img/2f8aba538b6f14f57de8cb694470acb2_101_0.png)


    multi-room audio systems can cost a pretty penny, but who needs to buy an expensive
    set of speakers when we use Raspberry Pis and 3.5mm wired speakers/speakers (with
    3.5mm audio inputs) to achieve the same effect? We''ll use our Pi 4s for music
    from a streaming service via Bluetooth from phone, tablet or computer to show
    how to do this with a single speaker and Raspberry Pi and then replicate it This
    is a recent project for replacing old. If you have a non-bluetooth device with
    a 3.5mm jack, connect your speakers to your Raspberry Pi or BalenaSound.


    # ## YOU NEED


    +   - Raspberry Pi 4 or Pi 400 (one unit per room)

    - 8GB (or larger) microSD card, U3 cards recommended. One per room

    - 3.5mm audio cables

    - Amplified speakers or a receiver with 3.5mm/phone output

    - Power supplies for your Raspberry Pis

    - Optional: Smartphone or tablet


    > Your setup can be monitored at all times through the Balena cloud dashboard


    # ## Connect and update


    Remove the microSD card from your computer and insert into your Raspberry Pi.
    Connect the speaker to the 3.5mm audio cable. Power up your Pi. Allow 15 minutes
    for the Pi to boot up to BalenaOS. Once finished, reboot the initial boot loop.
    You can check the status of your Pi Balena Sound in the Balena cloud dashboard.


    Installed on Raspberry Pi, we used BalenaSound to make the Raspberry Pi connectable.
    To log in, Open the BalenaSound application page at https://sound.balenas.io/docs/getting.


    To make the Balena OS connectable (or other devices) we identified the need for
    a monitor, keyboard and mouse for our Raspberry Pi. Create a free account and
    sign up or log.


    ![](img/2f8aba538b6f14f57de8cb694470acb2_101_1.png)


    From your smartphone or computer, navigate to Bluetooth settings and look for
    BalenaOS XXXX and pair it to your device. Connect the sound output for your smartphone,
    tablet or computer. Go to your streaming service and play a song. The music should
    stream via Bluetooth to your Raspberry Pi and play from the attached speakers.


    ![](img/2f8aba538b6f14f57de8cb694470acb2_101_2.png)


    # ## MULTI-DEVICE/MULTI-ROOM SYNC


    For multi-device setup, repeat the stages described above for each extra device.
    You can flash the image from the same folder earlier using the Raspberry Pi. With
    the same Bluetooth name, music can now stream to all Raspberry Pis and their connected
    speakers. You will only need to connect one Pi to your Bluetooth to manage all
    Raspberry Pi Balena Sound speakers.


    That''s it! Now you create multi-room/multi-device experiences in your home with
    Raspberry Pi devices while:


    Dangling from your smartphone, tablet, or computer like a pro. If you''re an audioophile
    who wouldn''t care much for Bluetooth audio, or need the headphone output on the
    Raspberry Pi, there is a variety of DAC (digital analog converter) HAT boards
    that enable faithful audio for not much money. Iqado has been part of the community
    since 2018 and has been a fan of the range of DAC and amplifier boards. Now Iqado
    is part of Raspberry Pi and those boards are being added to the range of Raspberry
    Pi products.


    ![](img/2f8aba538b6f14f57de8cb694470acb2_101_3.png)


    Breathe life into unused speakers, and old amplifiers with Balena Sound


