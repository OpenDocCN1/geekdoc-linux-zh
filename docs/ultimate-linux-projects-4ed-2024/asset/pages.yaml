    # # Gaming in RetroPie


    Turn your Raspberry Pi 4 (or Zero 3) into a RetroPie gaming rig with RetroPie
    and dubious internet downloads.


    Back in the 1980s and 1990s, the arcade were the place to be. The latest video
    games from Namco, Sega, Konami and others now ten-pence coins as we pursued that
    high. Today, retro gaming is seeing massive growth in the past decade.


    Using a Raspberry Pi, you can run a variety of emulators that allow you not only
    old arcade games, but also your favourites from many old consoles, such as Atari
    2600, Nintendo 64, Sega Mega Drive and Game Boy.


    grab the image from https://retropie.org.uk/ and use Etcher. Either, there are
    separate Editions for first-gen devices (the original Raspberry Pi and Pi Zero),
    microcontrollers (the Pi 2 and 3) and the latest Pi 0 models. Insert it into your
    microSD card and install it on Raspberry Pi 4. Xbox and PlayStation 4 are not
    compatible with RetroPie via bluetooth, unless a USB connection is configured.


    Following RetroPie asks you to configure your controller. Configure your controller.
    Note that you will have fewer buttons on your controller than RetroPie. Just hold
    down start button to skip any inputs you don''t need. Press the A button on your
    controller to close the configurations menu and open the main menu.


    #  TUCK INTO A SLICE OF RETROPIE


    “Using a Raspberry Pi, you can run a variety of emulators that enable you to play
    arcade and console games"


    a number of emulation available, but RetroPie is by far the most popular and used.


    Up recently, installing RetroPie on a Raspberry Pi 4 was a bit out of reach in
    June 2019. RetroPie didn''t officially support it for nearly and there were several
    manual steps you needed to make it work. Now, not only can you install RetroPie
    on a Raspberry Pi 4, but you can do it with Raspberry Pi imager.


    ![](img/2f8aba538b6f14f57de8cb694470acb2_103_0.png)


    # Adding Games To RetroPie


    All the games are files called ROMs, which are made of real boards or cartridges.
    The easiest method is to use a USB stick to transfer the files from your computer
    to RetroPie. It''s important to remember that games from consoles are older than
    the consoles they are now emulated on.


    Pimonic''s Arcade cabinets have a high quality of look. Using a cutting-laser
    assembly kit or ten-inch Screen. Size is easy to build and can use with all models
    of Raspberry Pi, but for best you''ll want a Raspberry Pi 4. Because you use custom
    arcade components, it can be customised to your personal style and aesthetics.
    If you like monochrome, then no means you can''t easily switch got to your favourite
    game.


    #  WELCOME TO THE PIERIE


    To create a RetroPie on an SD card, download the image from https://retropie.org.uk/
    and use Etcher. Flash the image onto your microSD card. Insert the SD card into
    your Raspberry Pi 4 and boot it up. Your computer will show the drive as folder/retropie/.
    For example, put Atari 2600 games in the /m2600 folder. The Raspberry Pi will
    then recognize the games.


    The Piece X HAT to the GPIO of your Raspberry Pi and provides connections for
    things, USB-C power management and and DAC connected to a switch for authentic
    audio. Everything you need to MAKE your own arcade cabinet - just a Raspberry
    Pi 4 DIY kit with step-by-step instructions to build, and configure a custom cabinet
    offering a slice of retro gaming heaven.


    How long this will take depend on how many games are transferred: a matter of
    minutes or a large amount. When finished remove the SD card and press START. The
    system will load EmulationStation/Retro System. The system will now update and
    show all the available emulators for consoles. Now how to play? Note that when
    it comes to playing retro arcade games from arcade machines, not all ROMs are
    compatible with all emulators. RetroPie can run with different versions of MAME
    (Arc Machine) and some ROMs will work on others. RetroPie maintains a handy cart
    over of them - retropie.org.uk/docs/MAME, but if your arcade games don''t load
    in MAME, try another.


