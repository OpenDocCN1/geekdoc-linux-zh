    # ## THE AVRHR SENSOR


    The NOAA polar orbiting satellites carry an on-board instrument called Very High
    Resolution Radiometer (AVHR). You can think of this as a camera, although it''s
    different from regular cameras. In particular, the satellite isn''t two-dimensional
    camera that captures a 2D scene in a single image. Because the satellite is continuously
    moving, it''s necessary to capture a row of pixels as it flies over the ground
    and, consequently, because the satellite will have moved between each two adjacent
    rows, it will have different strips of the scan. Stacking these strips, creates
    a two-dimensional image. The result is an infinite length image that can be captured
    from a receiver at any location within a limited area of the radio range.


    Despite it being necessary to capture a row of pixels, the AVRHR sensor is scanning
    a row of 2,600 elements, making the effective horizontal resolution impressive.
    More recent sensors do operate this way, and are referred to as push brushes,
    the AVRHR, being an older design, which uses a broom or which''s used, the device
    scans mechanically back and forth at right angles to the direction of movement.
    Using a mirror, it directs the light from the horizontal strip to a sensor for
    each spectral band.


