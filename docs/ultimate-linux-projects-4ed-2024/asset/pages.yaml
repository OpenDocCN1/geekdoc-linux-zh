    # Image recognition


    Get machine learning and train your Pi to recognise and classify other Pis, without
    having to write a single line of code.


    we''re going to train our Raspberry Pi to identify Raspberry Pis (or other objects)
    with machine learning (ML). Why this important? An example of an industrial application
    for this type of ML is finding defects in circuit boards. As board the assembly
    line, a machine can be trained to identify defective circuit board for troubleshooting
    by name.


    Tom has some neat projects and artificial intelligence including facial recognition
    and face mask detection. In his projects, all the training images were stored
    locally on the Raspberry Pi and it was also performed on the Pi. In this tutorial,
    we''ll use a web platform Edge Impulse to create and train our model to allow
    a few processes from Impulse is the ease of uploading training images can be done
    from a smartphone (without having to install an app).


    We will use BalenaCloudOS instead of Raspberry Pi OS since follows the facts at
    Balena provide an API to Edge Impulse. This enables all terminal commands and
    outside itself with an intuitive GUI.


    # YOU NEED


    +   - Raspberry Pi 3, 4 or 400

    - 8GB (or larger) microSD card

    - Raspberry Pi Camera or a USB webcam

    - Power supply for Raspberry Pi

    - Smartphone for taking photos

    - Selection of Pi or objects for classification


    collection site. You won''t need to download an app to collect images.


    Allow permissions on your smartphone and tape Collecting images in your browser''s
    screen. Tap Label and enter to get the right box of photos. Take 30-50 photos
    at various angles, some for training and for testing. Edge Impulse automatically
    splits between training and testing. Repeat the process of Entering a label for
    the next object and next 30-50 photos until you have enough objects. We need five
    identified objects for your initial model. We will have to train the machine with
    more objects/and later on.


    # Training on the Edge


    Head on to edgeimpulse.com and create a free account (or login if you already
    have). Open a browser on your desktop or laptop. Select Data Acquisition from
    the menu bar on the left. You can choose to upload photos from your raspberry
    or scan a QR code with your smartphone. In this tutorial, we''ll use Smartphone
    QR code and a QR code on your device''s screen. Scan it and Open in browser and
    it will be taken to a


    # Impulse design


    Next, create an Impulse design from the left menu. Add a block and select an image
    to add to the object you want to classify. Repeat by adding a block and select
    the next block. Click Impulse Impulse on the far right. Click Impulse design in
    the left menu. Select Generate for the parameters of what to take off. Click the
    Generate button and wait a few minutes.


    After the finish you will now see the total number of photos (taken) or labels
    (type of objects) you have classified. (You may need to refresh the page to see
    them.) You can click on any of the data sets to view the photos uploaded.


    After training your Impulse design, check your settings (check data augmentation),
    and click Start training. This will take minutes or hours depending on how many
    images you have uploaded. Once the training finishes, you will be able to predict
    the accuracy of your model. For example, in this model the algorithm can only
    identify a Raspberry Pi 3 with 64.3 percent of the time and will misclassify it
    as a Pi 3 as 26.8 percent of the time.


    ![](img/2f8aba538b6f14f57de8cb694470acb2_99_0.png)


    Collect data


