    # Ulralight Mint


    Embrace minimality and learn some gymnastics with the featherweight Mint desktop.


    ne of our favourite Ubuntu derivatives is Regolith Linux. It''s fairly unique
    in its choice of the ultra-light i3 tiling window manager. Tiling window managers
    take some getting used to, and also have a lot of configuration but Regolith ships
    with many defaults and easy-to-learn shortcuts (i3 is very much keyboard-driven,
    but converts they never looked back). It still has all of the GNOME infrastructure
    and settings, so your administration can be carried out with familiar GUI apps.
    We are fans of Pop!OS, and in particular


    familiar with i3, you will quickly get the hang of Sway; most of the default keys
    are the same and you can use your i3conf without modifications. Sway is in the
    Ubuntu repos, but it is an older version from January 2020. It would take some
    work of compiling the latest version anyway, so let''s just install the repo to
    dip our toes in.


    ```

    sudo apt install sway

