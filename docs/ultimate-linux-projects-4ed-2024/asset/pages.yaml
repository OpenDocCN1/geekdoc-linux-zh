    grep -color svm /proc/cpuinfo

    sudo apt update

    sudo apt install qemu-kvm libvirt-daemon-system libvirt-client libvirt-bridge

    ```


    # How to Install QEMU


    QEMU is a generic and open-source machine emulator and virtualizer. In other words,
    we can emulate any number of CPUs and create virtual machines. To install QEMU
    we need to open a terminal and use the package manager (in case Ubuntu 21.04 the
    apt tool) to install QEMU/Kernel Virtual Machine (KVM) and its dependencies.


    Now to manage our systems a little easier, we need to install a GUI for our virtual
    machines.

    sudo apt install virt-manager


    We need to reboot our machines for the change to take effect. If we skip this
    then the GUI manager will be unable to connect to QEMU.


