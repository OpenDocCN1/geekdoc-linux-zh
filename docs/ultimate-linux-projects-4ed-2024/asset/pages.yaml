  md: '# # Environment sensors


    With sensors and night caddies, we can make our gardens grow.


    You can use your Pi to display your PC''s CPU temperature and graph it on an LCD
    display. However, for this project we will take a step further and measure a range
    of environmental variables. Other monitors that measure such factors are alike
    in nature. They are not however suitable for the Pi which only has digital (GPIO)
    inputs. However, with HATs on the Pi, it is easy to get your talking temperature
    and humidity, a moisture sensor is much better and getting them with GrovePi is
    easier. We won''t cover up the Pi (any model will do), but you''ll probably want
    to set it up for SSH and Wi-Fi especially if you''re installing this in your greenhouse.
    One thing to note is that you might have to code your Pi using Python 3 by default
    (if it isn''t already). This is a matter of `sudo update-alternatives --install
    /usr/bin/python /usr/bin/python2 2 sudo update-alternatives --install /usr/bin/python
    /usr/bin/python3 3`. Now we can set up the board and Dexter Industries provide
    a script that will do this in one line: `curl latest.adafruit.com/update_gropi
    | bash`


    # YOU NEED


    +   - Raspberry Pi (any model)

    - GrovePi or GrovePi Zero

    - Adafruit 1.3-inch Bonnet (or other)

    - GrovePi Sensors (temperature, moisture, light)


    ![](img/2f8aba538b6f14f57de8cb694470acb2_104_0.png)


    Stack the display above the daughterboard, plug in sensors and you''ll be monitoring
    the environment in no time.


    ![](img/2f8aba538b6f14f57de8cb694470acb2_104_1.png)


    ```

    from digital import DigitalInOut, from image import Image, ImageFont as adruit_rgb,
    display(as=st7789)

    Then you can use PIL image and text to draw the info on the screen using

    height=height

    width=width

    image=Image.new("RGB", (width, height))

    rotation=90

    image=Image.Draw(image)

    ```


    ![](img/2f8aba538b6f14f57de8cb694470acb2_104_2.png)


    For this project we will need to display the continuously. So we will need a loop,
    which clears the screen, updates the readings, and pauses for a few seconds:


    # Vision


    You''ll need to reboot once everything, before we can start setting up our display.
    We have a range of TFT, OLED or LCD screens available for the Pi that this depends
    on. We use the Adafruit 1.3-inch Bonnet and set it up with HAT we will install
    and then install its Library, which can be done with: `sudo pip3 install --upgrade
    adafruitpython-sensor https://github.com/adafruit/Raspberry-Pi-Scripts/`


    ```

    while moisture=grovePi.analogRead(1)

    light=grovePi.analogRead(2)

    draw=Image.Draw((0,0, width, height), outline=(0,0,0))

    draw.text((20,20), "Moisture: %s".format(moisture), font=font, color="#FFFFFF")

    ```


    You can go further with this project, by connecting a network and logging the
    data


    ![](img/2f8aba538b6f14f57de8cb694470acb2_104_3.png)


