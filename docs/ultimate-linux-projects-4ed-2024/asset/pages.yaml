    # Coding a Space

    Invaders code


    Calvin Robinson will always extend the hand of friendship – unless menacing allies
    are descending from the skies, in which case… blast ''em!


    Space Invaders is probably the most famous space shooter of all time, released
    way back in 1978 for arcade. Designed by Tomohiro Nishikawa for Taito in Japan.
    Space Invaders was a classic fixed shooter and paved the way for shooting games
    genre. The player controlled a ship at the bottom of the screen and it was their
    job to move left and right to avoid enemies, while shooting up the screen to destroy
    them. We''ve got a go at creating our own retro classic.


    around, it''s a module worth exploring further. To install pygame, open a terminal
    and run pip3 install pygame, along with our newly installed pygame itself. Let''s
    get by importing the random module and declare it


    ![](img/2f8aba538b6f14f57de8cb694470acb2_71_0.png)


    Calvin Robinson is a former assistant principal and computer science teacher and
    has a degree in Computer Games Design and Programming.


    We''ll be using Python to create our game, since it''s one of the most versatile,
    accessible high-level programming languages. Python is completely free and should
    be installed on most distros. By default, however there are multiple versions
    of Python to install. Let''s use the latest version, which is available via sudo
    apt-get python3.


    For other distributions, check your software download list.


    from random import random

    import pygame


    Once installed, we can use a text editor or the built-in IDLE to write our code.
    We''ll use IDLE because Python IDLE allows us to open up a shell window, without
    needing any changes. If we change something in the text editor, just sure to save
    the file with the .py extension, then we can run it.


    An intro screen, ready for the game to begin.


    ```

    SCENE_TITLE = 0

    SCENE_PLAYER = 1

    SCENE_GAMEOVER = 2

    START_COUNT = 100

    STAR_COLOR_HIGH = 12

    STAR_COLOR_LOW = 5

    PLAYER_WIDTH = 8

    PLAYER_HEIGHT = 8

    PLAYER_SPEED = 2

    BULLET_WIDTH = 2

    BULLET_HEIGHT = 8

    BULLET_COLOR = 10

    BULLET_SPEED = 4

    ENEMY_WIDTH = 8

    ENEMY_HEIGHT = 8

    ENEMY_SPEED = 5

    START_RADIUS = 1

    ENEMY_RADIUS = 8

    BLAST_COLOR_IN = 7

    BLAST_COLOR_OUT = 10

    enemy_list = []

    bul_list = []

    blast_list = []

    ```


    We use Pygame in these tutorials because it offers us to enable our binding game
    code easily, without worrying about creating basic functional shapes or physics.
    We''re using a retro game engine created by pygame, which is an advanced tool,
    complete with image banks, sounds, and editors for images and sound. It''s fantastic
    for creating retro games.


    We''ve set up some constants and basic settings, most of which are self-explanatory.
    We will now define variables for score, points, player, ammo and enemies.


    Sticking with best practice, we will use Object Oriented Programming throughout
    this tutorial. Not only will we be using classes for our objects, but we will
    also use functions to help us repeat code. OOP is the most efficient way of programming
    video games.


    Let''s get code started for drawing, and erasing lists, since everything in the
    game will be run through arrays we declared and initialised:


