    # EASY ROLLBACKS WITH TIMESHIFT


    ![](img/2f8aba538b6f14f57de8cb694470acb2_6_1.png)


    ![](img/2f8aba538b6f14f57de8cb694470acb2_6_2.png)


    ![](img/2f8aba538b6f14f57de8cb694470acb2_6_3.png)


    +   1 Start Timeshift

    Fire up Timeshift and set it up to take a daily snapshot to a local drive or space
    (at least 1GB more than the current system size). Timeshift will only back up-system
    files by default, so files in your home directory are not included. There are
    better tools for backing these up.


    +   2 Take a Snapshot

    It might immediately check if all align. But when you worry it, just hit the Backup
    Now to create an on-demand snapshot. Timeshift backs up only when changed files
    are stored. Once the snapshot completes, add a helpful description to help you
    keep track.


    +   3 Restore a snapshot

    If something goes wrong, you can now restore a snapshot by clicking the button.
    You can then determine the files within the first, which you can do by right-clicking.
    If things go really wrong, and Mint no longer lasts, you can use Timeshift from
    a live medium. Just point it to the timeshift directory.'
