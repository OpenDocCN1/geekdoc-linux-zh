    The second command makes the script executable, and as long as it is in your $PATH,
    you can run it anywhere. Use the Docker Examples from the official site, as they
    span two directories we''ll need to match:


    ```

    $ mkdir -p ~/nextcloud-proxy

    $ wget https://github.com/nextcloud/nextcloud/master/docker-compose-with-nginx-proxy/docker-compose.yml

    ```


    We modify the proxy container to allow large uploads. The example also requires
    buffering, so let us create a file `~/nextcloud-proxy/upload_size.conf` with the
    following settings:


    ```

    client_buffering off;

    ```


    In the same directory create a file named `proxy_request.conf` from the source:


    ```

    FROM widin/nginx-proxy:alpine

    COPY upload.conf /etc/nginx/conf.d/upload.conf

    ```


    Before we can start these images, we need to edit the YML file with the hostname
    of our running Nextcloud and Let''s Encrypt. Open the docker-compose.yml file
    to populate the variables with a strong password and the secret key:


    ```

    MYSQL_PASSWORD=password

    MYSQL_DATABASE=nextcloud

    MYSQL_USER=nextcloud

    ```


    There''s one more thing: the Let''s Encrypt container requires an additional volume
    for the certificates:

    - /acme:/etc/letsencrypt


    Now, in the same directory create a file `db.env` with the credentials, using
    a stronger password than the one we used (this is for the user, rather than the
    root, not about the database).


