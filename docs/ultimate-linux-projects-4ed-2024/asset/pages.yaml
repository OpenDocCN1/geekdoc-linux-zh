    # ## Raspberry Pi instructions


    If you''re on a Pi then Nextcloud works, but we haven''t supported x86-docker-compose,
    because the Pi is ARM. And there''s no official ARM builds yet. To remedy, you
    can compose yourself through the Python method:


    ```

    $ sudo apt install python3-pip

    $ sudo rm /usr/local/bin/docker-compose

    ```


    If you''re also not sure the generous humans on linuxrc.org, that''s not because
