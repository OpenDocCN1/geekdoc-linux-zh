    # 3.5.3 DB2 registry and environment variables


    All configuration settings in DB2 are stored as either environment variables or
    registry variables. On UNIX-based systems, all environment variables such as DB2INSTANCE,
    DB2NODE, DB2PATH, and DB2INSTPROF are set using the export command. Usually in
    file db2profile located in $INSTHOME/sqllib/.


    Registry variables are set through the db2set command and require a DB2 restart.
    If a registry variable requires a Boolean argument, the values YES, 1, and ON
    are all equivalent and the values NO, 0, and OFF are also equivalent. To set registry
    values for instance level profile, issue:


    ```

    db2set -i <instance_name> <command>

    ```


    To set registry values for global level profile, issue:


    ```

    db2set -g <command>

    ```


    You can use the Configuration Assistant (db2ca) or db2set command to configure
    configuration parameters and registry variables. When updating the registry, changes
    do not affect the currently running DB2 applications or users. Applications started
    after the update has happened use the new values.


