    ```


    > Note: There is no db2_deinstall program to uninstall the documentation. Simply
    use rm -rf to remove the documentation files.


    # 2.3.4 Adding an additional partition


    To add an additional partition on a separate server/machine at a later time, we
    suggest you use a response file to install DB2. You may use the response file
    you created during the initial installation or you can generate a new one by editing
    a sample response file. The sample response file, db2ese.rsp, is found in </installation
    source>/ese/db2/linux/samples. This is the best method to use, as it can configure
    DBM parameters in addition to installing the server. Refer to "Installing DB2
    using a sample response file" on page 65 for more for information about editing
    the sample response file. The step-by-step procedure of adding database partition
    is provided in 3.4, "Add database partition" on page 100.


    # 2.3.5 Installing on NIS


    You may use DB2 Setup or db2_install to install DB2 on systems using Network Information
    System (NIS) or NIS+. However, there are some factors to consider when using DB2
    Setup to install DB2 on environments that use NIS (or other external security
    programs that do not allow the DB2 installation program to modify user characteristics).
    This is because some of the DB2 Setup installation scripts will attempt to update
    the users and groups that are controlled by NIS, and will not be able to do so.
    This is not meant to discourage you from using DB2 Setup on NIS systems — you
    will still benefit from all of its features except for'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'user and group creation feature. If DB2 Setup detects NIS on your machine,
    it will not give you the option to create new users during installation. Instead
    it only will allow you to choose existing users.


    Simply abide by the following installation prerequisites in order to use DB2 Setup
    successfully on NIS systems:


    +   - Users and groups must first be created on the NIS server before running
    the DB2 Setup wizard or performing a response file install.

    +   - Secondary groups must be created for the DB2 instance owner and the DB2
    Administration Server on the NIS server. You must then add the primary group of
    the instance owner to the secondary DB2 Administration Server group. Likewise,
    you must add the primary DB2 Administration Server group to the secondary group
    for the instance owner.

    +   - With ESE, you must add an entry for an instance in the /etc/services file
    before creating the instance.'
  merge: -1
  img_proc: true
