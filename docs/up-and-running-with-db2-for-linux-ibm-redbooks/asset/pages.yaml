  md: '# Multipage allocation


    For system managed tablespaces (SMS) we recommend that you enable multipage file
    allocation. It reduces the time needed for formatting new pages. To enable this
    parameter, issue the command db2empfa for every database. Exclusive access is
    needed, because in existing tablespaces all empty pages will be filled up to the
    last extent. To check this, issue the command:


    ```

    db2 get db cfg for <dbname> | grep Multi-page

    ```


    ```

    Multi-page file allocation enabled = YES.

    ```


    In a multi-partition environment issue db2mpfa on every database partition.


    # 3.6 Client configuration


    In this section we discuss how to install and configure DB2 clients to access
    DB2 ESE using the graphical tool Configuration Assistant or the DB2 command line
    processor.


    There are three types of DB2 clients available:


    +   - **Run-Time Client**

    +     This client provides you access to DB2 UDB servers with application interfaces,
    such as JDBC, SQLJ, ODBC, CLI and OLE DB. Use this client if you don''t need to
    administer DB2 servers.

    +   - **Administration Client**

    +     The Administration Client has all features of the DB2 Run-Time client plus
    tools to administer a DB2 Server.

    +   - **Application Development Client**

    +     This client provides a collection of graphical and non-graphical tools for
    developing applications. It includes all components of the DB2 Administration
    Client.


    All Client versions are available on the following platforms: AIX, HP-UNIX, Linux,
    Solaris and Windows operating system.


    The client selection depends on your application environment. At least you must
    have one Administrator Client to bind all DB2 CLI packages against the DB2 database
    that you want to use.


    > Note: Installation requirements details are described in IBM DB2 UDB Quick Beginnings
    for DB2 Clients V8, GC09-4832.'
