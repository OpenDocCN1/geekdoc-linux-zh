    Chen


    **Whei-Jen Chen** is a Project Leader at the International Technical Support Organization,
    San Jose Center. She has extensive experience in application development, database
    design and modeling, and DB2 system administration. Whei-Jen is an IBM Certified
    Solutions Expert in Database Administration and Application Development as well
    as an IBM Certified IT Specialist.'
