    # 7.3 Memory Visualizer and Memory Tracker


    The Memory Visualizer can assist you in monitoring memory utilization for a DB2
    instance. It uses visual displays and plotted graphs to help you understand memory
    components and their relationships to each other and helps you uncover and fix
    memory-related problems on a DB2 instance. You can use it on its own as a monitoring
    tool or invoke it from a Health Center recommendation.


    You can start Memory Visualizer in the Control Center by right-clicking an instance
    and selecting View memory usage. The Memory Visualizer window appearsFigure 7-11.'
