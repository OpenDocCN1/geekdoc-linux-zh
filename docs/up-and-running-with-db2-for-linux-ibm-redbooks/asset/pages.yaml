- pgno: 262
  md: 'The first report produced gives averages since the last reboot. Additional
    reports give information on a sampling period of length delay. The process and
    memory reports are instantaneous in either case.


    The following are field descriptions for the output report generated by vmstat.
    To acquire more information regarding this command, refer to man help pages for
    vmstat or other Linux documentation.


    # Procs


    +   r: The number of processes waiting for run time.

    +   b: The number of processes in uninterrupted sleep.

    +   w: The number of processes swapped out but otherwise can be run. This field
    is calculated, but Linux never desperation swaps.


    # Memory


    +   swpd: The amount of virtual memory used (KB).

    +   free: The amount of idle memory (KB).

    +   buff: The amount of memory used as buffers (KB).


    # Swap


    +   si: Amount of memory swapped in from disk (KB/s).

    +   so: Amount of memory swapped to disk (KB/s).


    # IO


    +   bi: Blocks sent to a block device (blocks/s).

    +   bo: Blocks received from a block device (blocks/s).


    # System


    +   in: The number of interrupts per second, including the clock.

    +   cs: The number of context switches per second.


    # CPU


    These are percentages of total CPU time.


    +   us: user time

    +   sy: system time

    +   id: idle time


    A sample report generated by vmstat is shown in Example 6-10.'
