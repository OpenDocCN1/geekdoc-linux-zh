    The DPF capability provides the customer with multiple benefits including scalability
    to support very large databases or complex workloads and increased parallelism
    for administration tasks.


    # Products for accessing legacy and host data


    With the following DB2 products, you can extend your enterprise system to access
    the legacy system.


    # DB2 Connect Personal Edition:


