- pgno: 106
  md: '# 3.3.2 Command line


    For a multi-partitioned environment, we recommend that you use the DB2 command
    line, instead of the Create Database wizard to create a database. Although this
    requires some experience and manual work, it gives you more control of where and
    how DB2 files are allocated. On the following pages, we provide an example of
    how to setup a partitioned database over two physical hosts with two logical partitions
    on each host.


    Log on as the instance owner or any user with sysadm or sysctrl authority to the
    host, where the database catalog should be created. Verify that you have initialized
    your DB2 environment. To do so, enter the following command:


    ```

    echo $DB2INSTANCE

    ```


    Where, $DB2INSTANCE represents the current DB2 environment.


    # Example 3-8 Verify DB2 environment


    ```

    db2inst1@db1nx02:~/sqllib> echo $DB2INSTANCE

    db2inst1

    db2inst1@db1nx02:~/sqllib>

    ```


    # Generate directory structure


    In our example, we do not want to use the default file structure provided by DB2.
    Instead, we want to use the customized file structure that we created in "File
    system configuration" on page 38. In this setup, our database, table and index
    spaces and log files are stored on different file systems. To create the directory
    structure for log files, tempspace and tablespaces, open a shell window as instance
    owner and issue the db2_all command. See Example 3-9, Example 3-10, and Example
    3-11.


    # Example 3-9 Creation of directory structure for log files


    ```

    db2_all ''mkdir /db2log/db2inst1''

    db2_all ''mkdir /db2log/db2inst1/itsodb''

    or combine both commands in one as:

    db2_all ''mkdir -p /db2log/db2inst1/itsodb''

    ```


    # Example 3-10 Creation of directory structure for tempspace


    ```

    db2_all ''mkdir /db2temp/db2inst1''

    db2_all ''mkdir /db2temp/db2inst1/itsodb/''

    db2_all ''typeset -Z4 DB2NODE; mkdir /db2temp/db2inst1/itsodb/NODE$DB2NODE''

    or combine all three commands in one as:

    db2_all ''typeset -Z4 DB2NODE; mkdir -p /db2temp/db2inst1/itsodb/NODE$DB2NODE''

    ```'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# Example 3-11 Creation of directory structure for tablespaces


    ```

    db2_all ''mkdir /tablespaces/db2inst1''

    db2_all ''mkdir /tablespaces/db2inst1/itsodb''

    db2_all ''typeset -Z4 DB2NODE; mkdir /tablespaces/db2inst1/itsodb/NODE$DB2NODE''

    or combine all three commands in one as:

    db2_all ''typeset -Z4 DB2NODE; mkdir -p /tablespaces/db2inst1/itsodb/NODE$DB2NODE''

    ```


    > Tip: The command ''typeset -Z4 DB2NODE'' returns a four digit number for every
    partition defined in db2nodes.cfg, for example: 0 will be 0000, 1 will be 0001.


    # Create database


    We have decided to use partition number 0 to hold the DB2 catalog. After issuing
    the command export DB2NODE=0 and db2 terminate, DB2 will run subsequent commands
    against partition 0.


    To create database itsodb in database path /database use a text editor like VI
    and write the following example:


    # Example 3-12 Creation of ITSODB database


    ```

    create database itsodb on /database

    using codeset ISO8859-1

    territory US

    with "ITSO San Jose";


    connect to itsodb;


    create bufferpool BPTEMP all nodes size 5000 PAGESIZE 4k ;


    connect reset;

    ```


    Save this file as any_name and execute it with:


    ```

    db2 -tvf any_name

    ```


    After executing this file you will have a database called ITSODB stored in /database/db2inst1/NODE0000,
    where the catalog tablespace and all relevant database files are located. In a
    partitioned environment, the same directory structure will be created on every
    node except for the catalog tablespace. This tablespace exists only on the partition,
    where the create database command is issued.


    At the same time we have created a new buffer pool for our dedicated temp space.
    Because DB2 allocates many resources at activation time of a database,'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'we have to stop and start our database to enable the new buffer pool. To do
    so, enter following commands:


    ```

    db2 deactivate database itsodb

    db2 activate database itsodb

    ```


    # Reallocate temp and user space1


    Now we want to create a new temporary tablespace and drop the default one. This
    has to be done in this order, because DB2 requires at least one temp space.


    Use a text editor like VI and write the following example:


    Example 3-13 Creation of new tempspace and drop default


    ```

    connect to itsodb;


    create system temporary tablespace TEMPSPACE01 in IBM TEMPGROUP pagesize 4k managed
    by SYSTEM using (''/db2temp/db2inst1/itsodb/NODE000 $N /tempspace01'') on dbpartitionnum
    (0) using (''/db2temp/db2inst1/itsodb/NODE000 $N /tempspace01'') on dbpartitionnum
    (1) using (''/db2temp/db2inst1/itsodb/NODE000 $N /tempspace01'') on dbpartitionnum
    (2) using (''/db2temp/db2inst1/itsodb/NODE000 $N /tempspace01'') on dbpartitionnum
    (3) extentsize 8 prefetchsize 32 bufferpool bptemp ;


    drop tablespace tempspace1;

    ```


    Save this file as any_name and execute it with:


    ```

    db2 -tvf any_name

    ```


    To move the default tablespace userspace1 to the new location under /tablespace,
    use a text editor like VI and write following example:


    Example 3-14 Change the location of tablespace userspace1


    ```

    drop tablespace userspace1;


    create tablespace userspace1 in IBMDEFAULTGROUP pagesize 4k MANAGED BY SYSTEM
    using (''/tablespaces/db2inst1/itsodb/NODE000 $N /userspace1'')on dbpartitionnum
    (0) using (''/tablespaces/db2inst1/itsodb/NODE000 $N /userspace1'')on dbpartitionnum
    (1)

    ```'
