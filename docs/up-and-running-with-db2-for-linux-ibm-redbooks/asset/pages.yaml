- pgno: 224
  md: '# 5.4 Task Center, Scheduler, and DB2 Tools Catalog


    In this section, we discuss how to use the DB2 Task Center to create and schedule
    a task to run on Linux. The DB2 Administration Server and Tools Catalog database
    are the prerequisite for using the Task Center and most GUI tools. We discuss
    the DB2 Administration Server and Tools Catalog database first in the following
    pages as the preparation work for enabling the Task Center and Scheduler.


    # 5.4.1 DB2 Administration Server and Tools Catalog Database


    The DB2 Administration Server (DAS) is a control point used only to assist with
    tasks on DB2 servers. You must have a running DAS if you want to use available
    tools like the Task Center, the Control Center, Configuration Assistant, or the
    Development Center. The DAS supports the Control Center and Configuration Assistant
    when working on the following administration tasks:


    +   - Enabling remote administration of DB2 servers

    +   - Providing the facility for job management, including the ability to schedule
    the running of both DB2 and operating system command scripts

    +   - Defining the scheduling of jobs, viewing the results of completed jobs,
    and performing other administrative tasks against jobs located either remotely
    or locally to the DAS using the Task Center

    +   - Providing a means for discovering information about the configuration of
    DB2 instances, databases, and other DB2 administration servers in conjunction
    with the DB2 Discovery utility


    The DAS on Linux (plus UNIX and Windows) includes a scheduler to run tasks (such
    as DB2 and operating system command scripts) defined using the Task Center. Task
    information includes commands to be run, schedules, notifications, and completion
    actions associated with the task. The run results are stored in a DB2 database
    called the Tools Catalog database. The Tools Catalog database is created as part
    of the general setup. If you did not create the Tools Catalog database when installing
    DB2 UDB, it can be created and activated through the Control Center, or through
    the CLP using the CREATE TOOLS CATALOG command. For information regarding how
    to create Tools Catalog in DB2 Control Center or via DB2 CLP commands, refer to
    Appendix B, "DB2 Tools Catalog creation" on page 295.


    So the tools catalog database contains task information created by the Task Center
    and Control Center. These tasks are run by the scheduler on the DB2 Administration
    Server. Figure 5-31 shows the relationship between DB2 tools, DB2 instances, DAS,
    Scheduler, and the Tools Catalog database.'
