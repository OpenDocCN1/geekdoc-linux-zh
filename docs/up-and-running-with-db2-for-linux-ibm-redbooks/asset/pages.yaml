- pgno: 10
  md: '# Preface


    This IBM Redbook will help you install, configure, administer, and monitor DB2
    UDB Enterprise Server Edition Version 8 on Linux systems, for both single and
    multi-partitioned database environments. This book shows you how to leverage the
    DB2’s autonomic capabilities using the Self Managing and Resource Tuning (SMART)
    technologies.


    Chapter 1 introduces DB2 Universal Database (UDB) Version 8 and its offerings
    for Linux, and provides an overview of the DB2 environment and architecture.


    Chapter 2 covers DB2 installation for single and multi-partitioned database environments.
    It discusses how to prepare your Linux database environment for DB2 installation,
    and provides instructions on how to use the different installation programs provided
    by DB2.


    Chapter 3 discusses post installation tasks that should be performed to have a
    functional DB2 environment. It covers Linux specific settings, and database creation
    and configuration.


    Chapter 4 explains how to migrate your Version 6 or Version 7 database environment
    to DB2 UDB Version 8. This chapter covers tasks such as preparing your database
    environment for migration, installing the new database server, and performing
    post-installation tasks such as migrating instances and databases.


    Chapter 5 contains information regarding some of the important database maintenance
    tasks for DB2 UDB on Linux platforms, for example, database backup and recovery,
    table and index reorganization and data movement via utilities like export, import
    and load, and so on.


    Chapter 6 discusses DB2’s monitoring features provided by Health Center and Health
    Monitor which is part of the self-managing and resource tuning (SMART) database
    technology. In addition, DB2 notification and diagnostic log files as well as
    some commonly used Linux operating system monitoring tools are also introduced.


    Chapter 7 discusses DB2 integrated tools. DB2 UDB provides a multitude of tools
    that makes it much easier and more efficient to install and maintain the database
    and develop applications. This chapter discusses most of these tools in a general
    way. Some of the integrated tools such as Design Advisor, Visual Explain, and
    Memory Visualizer are discussed in detail.'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'Chapter 8 concerns application development. DB2 provides accessibility from
    many standard interfaces and has various tools inside to help with developing
    applications. This chapter discusses some aspects of application configuration,
    DB2 application objects, such as stored procedures, programming languages, and
    application development tools supported by DB2.


    # The team that wrote this redbook


    This redbook was produced by a team of specialists from around the world working
    at the International Technical Support Organization, San Jose Center.


