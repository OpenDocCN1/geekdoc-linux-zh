    # Updating the number of licensed processors


    To change the number of licensed processors for your DB2 product, do the following:


    +   1. Select Change from the License menu.

    +   2. In the Number of licensed processors box, use the up and down arrows to
    set the number, and then click OK.


    # Changing the enforcement policy


    The default enforcement policy is Soft Stop. This means that all connections to
    DB2 databases go through, even when the license policy is violated. When a violation
    occurs, a license violation message is written to db2diag.log. The Hard Stop enforcement
    policy does not permit any connections that violate the license policy. To specify
    the enforcement policy type, do the following:


    +   1. Select Change from the License menu.

    +   2. Select the appropriate radio button under Enforcement policy.'
