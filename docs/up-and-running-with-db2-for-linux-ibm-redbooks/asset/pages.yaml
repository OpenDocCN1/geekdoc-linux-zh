- pgno: 81
  md: '# 2.3.3 db2_install utility


    The db2_install utility installs the DB2 filesets, but does not create an instance,
    users, or perform any other configuration tasks performed by the DB2 Setup wizard.
    Some people prefer to use db2_install when installing DB2 on a large, complex
    database system that has special requirements.


    # Installing DB2


    +   1. Login as a user with root authority.

    +   2. Insert and mount the DB2 CD.

    +   3. Enter the db2_install command to start the db2_install script. This script
    is found in the root directory of the CD-ROM.

    +   4. When db2_install prompts you for the product keyword, enter in DB2.ESE.


    The installation directory for DB2 on Linux is /opt/IBM/db2/V8.1.


    # Post-installation tasks


    After installing DB2 using db2_install, do the following:


    +   1. Create group and user IDs (if not already done).

    +   2. Create a DB2 instance.

    +   3. Create links for DB2 file (optional).

    +   4. Configure TCP/IP communications for the DB2 instance.

    +   5. Update product license key.

    +   6. Create a DB2 Administration Server (DAS).

    +   7. Create DB2 tools catalog (optional).

    +   8. Set up SMTP server and notification contact list (optional).


    # Procedure


    +   1. Create group and user IDs; refer to 2.2.4, "User and group setup" on page
    48.

    +   2. Create a DB2 instance. Use the db2icrt command to create a new instance:

    +   a. Log in as root.

    +   b. Enter the following command:


    ```

    /opt/IBM/db2/V8.1/instance/db2icrt [-a AuthType] -u FencedID InstNme

    ```


    Where:

    - AuthType represents the authentication type for the instance. If you do not
    specify this parameter, the default authentication type, SERVER, is assigned.
    AuthType can be one of SERVER, CLIENT, DCS, SERVER_ENCRYPT, or DCS_ENCRYPT.

    - FencedID represents the name of the DB2 fenced user.'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'InstNme represents the name of the instance you are creating. The name of the
    instance must be the same as the name of the instance owning user. This instance
    will be created in the home directory of the instance owning user.


    For example, we entered in:


    ```

    ./db2icrt -u db2fenc1 db2inst1

    ```


    # 3. Create links for DB2 files (optional).


    If you are developing or running applications, you may want to create links for
    the DB2 files to the /usr/lib directory, and for the include files to the /usr/include
    directory. This will avoid having to specify the full path to the product libraries
    and include files.


    Links should not be created on systems where multiple versions of DB2 co-exist.
    If you create links on one version of DB2, the links on the other version will
    be overwritten.


    To create links:


    +   a. Log in as root.

    +   b. Enter the following command:


    ```

    /opt/IBM/db2/V8.1/cfg/db2ln

    ```


    > Note: If you have existing links to /usr/lib and /usr/include from previous
    versions of DB2, and want to keep the links to the libraries of the previous version,
    you must execute the db2rmln command from DB2 V8 before you execute the db2ln
    command from the previous version of DB2. The db2ln command removes existing links
    and replaces them with links to DB2 V8 libraries.


    # 4. Configure TCP/IP for the DB2 instance.


    You must configure your instance with the TCP/IP protocol in order for it to accept
    requests from remote DB2 clients. Follow these steps:


    +   a. Update the /etc/services file to specify the service name and port number
    that the DB2 server will listen on for client requests. To update the /etc/services
    file, use a text editor to add a connection entry. For example, we added:


    ```

    db2c_db2inst1 50001/tcp # DB2 connection service port

    ```


    Where:


    +   db2c_db2inst1 represents the connection service name

    +   50001 represents the connection port number

    +   tcp represents the TCP/IP communication protocol'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'The service name is arbitrary but must be unique in the services file. In a
    partitioned environment, make sure that the port number does not conflict with
    the port numbers used by the Fast Communications Manager (FCM) or any other applications
    on the system.


    +   b. Update the database manager configuration file on the server. To do so:


    +   i. Log into system as instance owner.


    +   ii. Set up the instance environment by running the db2profile script:


    ```

    . INSTHOME/sqllib/db2profile

    ```


    +   iii. Update the SVCENAME parameter in the DBM configuration file. You may
    specify either the service name or port number. For example, we entered:


    ```

    db2 update dbm cfg using SVCENAME db2c_db2inst1

    ```


    You can check your SVCENAME by entering:


    ```

    db2 get dbm cfg | grep Svc

    ```


    +   c. Set the DB2COMM registry variable to tcp/ip. This will start the DB2 communications
    manager when the database manager is started. Enter the following command as instance
    owner:


    ```

    db2set DB2COMM=tcpip

    ```


    +   d. Stop and re-start the instance for these changes to take effect:


    ```

    db2stop

    ```


    ```

    db2start

    ```


    # 5. Install license key.


    You must install a license key on each computer where a DB2 server is installed.
    In a partitioned environment, this means that you must install a license key on
    each machine participating in the partitioned database system. This is done by
    adding a DB2 license file using the db2licm command.


    +   a. Log in as root user or instance owner.


    +   b. Enter the following command:


    ```

    /opt/IBM/db2/V8.1/adm/db2licm -a <filename>

    ```


    Where, filename is the full pathname and filename for the DB2 ESE license file
    db2ese.lic. This license file is located in /db2/license in the root directory
    of your CD-ROM. For example, if the CD-ROM is mounted in the directory /cdrom,
    enter the following command:


    ```

    /opt/IBM/db2/V8.1/adm/db2licm -a /cdrom/db2/license/db2ese.lic

    ```


    On Linux, the DB2 license keys are located in /var/lum in a file called nodelock.


    # 6. Create a DB2 Administration Server (DAS).'
  merge: -1
  img_proc: true
