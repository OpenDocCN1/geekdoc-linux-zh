    # 3.7 Configuring licensing


    DB2 is a licensed product. There are two tools that you can use to configure the
    license policy: the DB2 License Center and the db2licm utility. The License Center
    is a graphical tool found within the Control Center and db2licm is its command
    line counterpart. This section provides instructions about how to configure licensing
    using both of these tools. The following topics will be discussed:


    +   - Installing the license key

    +   - Setting up the Registered user policy

    +   - Updating the number of licensed processors

    +   - Changing the enforcement policy'
