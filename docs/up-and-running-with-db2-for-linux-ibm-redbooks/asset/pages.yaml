  md: '# Creating users: Multiple partition considerations


    In a partitioned database environment, you only need to create one shared home
    directory for the instance owner and fenced user (but remember to create users
    on each machine!). When creating users in a partitioned environment, make sure
    that the user and group IDs are the same on each machine. In our setup we have:


    +   - A shared home directory, /db2home, on the instance-owning machine which
    is NFS-mounted on the remaining machines in the cluster. In this directory we
    have the home directories for the instance-owning user and fenced user: db2inst1
    and db2fenc1.


    +   - A local home directory for the DAS user on each machine, dasusr1, which
    is stored in the /home directory.


    We could not place the DAS user home directory in the shared folder because we
    have the same DAS user ID on each machine in the cluster. The DB2 Administration
    Server (DAS) has changed significantly in DB2 Version 8; therefore, you should
    take note of the following DAS user considerations.


    # DAS user considerations for a partitioned database


    +   - A DAS must be running on each physical machine in the partitioned database
    for the graphical administration tools (for example, Control Center) to work.


    +   - You can only have one V8 DAS on each machine (although a V7 and V8 DAS can
    co-exist on one machine).


    +   - Just like an instance, each DAS must be created under a user ID. It does
    not matter whether a different user ID is used for each DAS in the environment,
    or whether the same user ID is used and that the user ID''s home directory is
    not shared. (The latter is the case for our environment — we have a separate user
    ID dasusr1 on each machine, each with its own local home directory dasusr1. It
    works just fine).


    +   - If the same user ID is to be used on each machine, then that user ID''s
    home directory cannot be shared with the other machines.


    +   - If a different user ID is used for each DAS, then the home directories of
    the user IDs that are used can be shared.


    +   - If an existing user is used as the DAS user, this user must also exist on
    all the participating computers before installation.


    +   - For response file installs: If your response file specifies to create new
    DAS user on each machine in the cluster, and that user already exists on any of
    the participating computers, then that user must have the same primary group as
    the new DAS user.'
