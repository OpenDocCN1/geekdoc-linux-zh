  md: 'To increase space in a DMS tablespace, you can add additional containers.


    +   Ensure that you have sufficient log file space prior to migration. We recommend
    that you significantly increase the values of logfilsiz, logprimary, and logsecond
    to prevent log file space from running out. The amount of required space depends
