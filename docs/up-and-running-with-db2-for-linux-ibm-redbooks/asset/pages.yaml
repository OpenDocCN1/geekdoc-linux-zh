    # 7.2 Visual Explain


    You can use Visual Explain to capture and view information about the access plan
    chosen by the DB2 optimizer for static or dynamic SQL statements as a graph. Here
    an access plan is a cost estimate of resource usage for a query, which is based
    on the available information, such as statistics for tables and indexes, instance
    and database configuration parameters, bind options and query optimization level,
    and so on. An access plan also specifies the order of operations for accessing
    the data.


    The access plan acquired from Visual Explain can help you understand how individual
    SQL statements are executed so that you can tune the statements and the database
    manager configuration parameters to improve performance.'
  merge: -1
  img_proc: true
- pgno: 278
  md: 'In general, you collect and use explain data for the following reasons:


    +   To understand how the database manager accesses tables and indexes to satisfy
    your query. For example, you can determine whether or not an index was used to
    access a table.


    +   To evaluate your performance tuning actions when you change some aspect of
    the database manager, the SQL statements, or the database. You should examine
    the explain data to find out how your action has changed performance.


    Figure 7-8 shows you the procedure for how Visual Explain works. You need to have
    your tables and indexes ready at first, then reorganize tables and indexes if
    appropriate, and gather statistics for those tables and indexes. In addition,
    a change to some configuration parameters may be required. Then you can provide
    your SQL statements with the specified precompilation or bind option to DB2, and
    DB2 optimizer will take care of the remaining items for you.


    ![](img/d95c931f4f3da4a6bd0ee55148fefad7_278_0.png)


    Figure 7-8 Visual Explain working procedure


    You can start Visual Explain in the DB2 Control Center by right-clicking a database
    name and selecting either Show Explained Statements History or Explain SQL, as
    shown in Figure 7-9.'
  merge: -1
  img_proc: true
- pgno: 279
