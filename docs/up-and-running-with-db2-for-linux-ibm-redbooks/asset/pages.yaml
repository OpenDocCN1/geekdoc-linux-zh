  md: '# Post installation tasks


    In the previous chapter, we provided a detailed process of installing DB2 Version
    8 on Linux. In this chapter we discuss post-installation tasks that should be
    performed to have a functional DB2 environment. The following topics are covered:


    +   - Control Center setup

    +     Control Center is JAVA-based graphical tool that is used to help you administer
    your DB2 instances and databases. We explain how to get this tool launched for
    the first time.

    +   - Preparation for database creation

    +     This section discusses Linux-specific settings for single and multiple database
    partitions.

    +   - Creating databases

    +     This section provides instructions for creating a database using the database
    wizard and command line processor.

    +   - DB2 configuration

    +     Here we discuss some important configuration parameters for the instance
    and database.

    +   - Client access setup

    +     This section discusses installation and configuration of DB2 clients to
    access DB2 ESE.'
