- pgno: 39
  md: '# 2.1.2 Required disk space


    You must take into account the following disk requirements while configuring your
    partitions (Table 2-2):


    Table 2-2 Required disk space


    | Install Type | Description | Required disk space |

    |---|---|---|

    | Typical | DB2 is installed with most features and functionality, including graphical
    tools such as the Control Center and Configuration Assistant. | 450 to 500 MB
    |

    | Compact | Installs only basic DB2 features and functions and does not include
    graphical tools. | 350 to 400 MB |

    | Custom | This option allows you to select the features you want to install.
    | 350 to 700 MB |


    You should also allocate disk space for required software, communication products,
    DB2 documentation, and databases. In DB2 Version 8, HTML and PDF documentation
    are now provided on separate CD-ROMs. Installing core DB2 HTML documentation in
    English only requires 25 MB of disk space; installing all HTML documentation in
    English only requires 82 MB of disk space. Additional space is required for additional
    languages.


    # 2.1.3 Memory requirements


    We recommend that you allocate a minimum of 256 MB of RAM for DB2 ESE, but additional
    memory should be allocated for other software and communication products. When
    determining memory requirements, be aware of the following:


    +   - We recommend that your SWAP space is at least as twice as much as your RAM.

    +   - Additional memory should be allocated for non-DB2 software that may be running
    on your system.

    +   - Additional memory is required to support database clients and database activity.

    +   - Memory requirements will be affected by the size and complexity of your
    database system, as well as specific performance requirements.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# 2.1.4 Communication requirements


    TCP/IP is required to access remote databases. Your Linux distribution provides
    TCP/IP connectivity if selected during install.


    If your Linux machine is installed on an existing network and is required to use
    a static IP address, information similar to the following should be collected
    from the network administrators (Table 2-3):


    Table 2-3 Required network information


    | Name | Example number |

    |---|---|

    | Host IP address | 191.72.1.3 |

    | Subnet mask | 255.255.255.0 |

    | Gateway | 191.72.1.1 |

    | Domain name server | 191.72.3.1 |


    The above information should be specified on the setup screen during OS installation,
    or as a post-installation step using your distribution''s setup utility.


    Also certain communication software packages are required. These are discussed
    in 2.1.6, "Additional software requirements" on page 31.


    # 2.1.5 Required kernel levels and libraries


    The minimum supported kernel levels and libraries are provided in Table 2-1 on
    page 25. Your Linux distribution should also include RPM 3 or later.


    # Kernel parameter values


    You may be required to update some of the default kernel parameter settings for
    DB2 to run successfully on Linux. For example, the 2.4.x series kernel message
    queue parameter msgmni has a default value that only allows a limited number of
    simultaneous connections to DB2. The semaphore array and shared memory limit values
    are also insufficient by default.


    In general, these are the recommended values for DB2 to run optimally:


    ```

    kernel.shmmax=268435456 for 32-bit; 1073741824 for 64-bit

    kernel.msgmni=1024

    fs.file-max=8192

    kernel.sem="250 32000 32 1024"

    ```'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'Fortunately, DB2 Version 8 has a new feature that checks values of the kernel.semmni,
    kernel.msgmni, and kernel.shmmax parameters at db2start time, and changes them
    for you if the current values are not optimal. DB2start does the following:


    +   - Changes semmni kernel parameter to 1024

    +   - Changes msgmni kernel parameter to 1024

    +   - Changes shmmax kernel parameter to 268435456 (32-bit) or 1073741824 (64-bit)


