    > **Attention:** The redistribute utility issues SQL insert and delete operations;
    therefore, you should ensure that sufficient log space is available.

    > Redistributing is a very time consuming process and should be done when tables
    are not in use by applications.


    DB2 packages which have a dependency to a table which was redistributed are set
    as invalid. They will be automatically rebound at the first SQL request but to
    save delay time, rebind these packages manually with the rebind command.


    Another recommendation is to update statistics by issuing the runstats table command
    and rebind affected packages.


    > **Note:** More information to add a database partition is described in the *IBM
    DB2 UDB Command Reference V8*, SC09-4828.


    An alternate method to add a logical database partition is to use the Add database
