    # Important DB cfg parameters


    This section describes some important database configuration parameters and the
    recommended settings.


    +   avg_appls

    +   This lets DB2 know how many concurrent applications run in your system. When
    set to 1, DB2 gives every application all current available memory in the bufferpool.


    +   catalogcache_sz

    +   This holds database, tablespace, table, and index information in memory. DB2
    looks first in this cache when it prepares an execution of a plan. Sufficient
    memory avoids cost-intensive disk I/O. Check with db2 get snapshot for database
    on db_name and compute the hit ratio with:

    +   100 - ((Catalog cache inserts X100) / Catalog cache lookups)


    ```

    db2 get snapshot for database on db_name

    ```


    ```

    100 - ((Catalog cache inserts X100) / Catalog cache lookups)

    ```


    +   maxfilop

    +   This is the number of files each application can open. The default value is
    mostly too small. Opening and closing files slows SQL response times and burns
    CPU cycles. If files are being closed, adjust the value of MAXFILOP until the
    opening and closing stops. Use the command:

    +   db2 get snapshot for database on db_name

    +   And, look at Number of files closed. If the value is more then 0, increase
    MAXFILOP value.


    ```

    db2 get snapshot for database on db_name

    ```


    +   locktimeout

    +   The default is set to -1. This means a connection can wait until it gets all
    resources. Deadlock problems occur if a connection already holds locks which are
    required by another application. To prevent too many deadlock situations, for
    OTLP set it to 10; and for DSS set it to 60.


    +   logbufsz

    +   DB2 uses a buffer for log records before writing the records to disk. If the
    value is set too small, it results in unnecessary I/O on the disk. When'
  merge: -1
