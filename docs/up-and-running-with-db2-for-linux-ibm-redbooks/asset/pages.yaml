    The ALLOW READ ACCESS option is not supported if the REPLACE option is specified,
    otherwise error code SQL3340N with Reason Code 1 will be returned. Since a load
    replace operation truncates the existing table data before loading the new data,
    there is no pre-existing data to query until after the load operation is complete.


    For partitioned database load operations initiated from the CLP, the message files
    will not be displayed to the console or retained. To save or view the contents
    of these files after a partitioned database load has completed, the MESSAGES option
    of the LOAD command must be specified. A fully qualified file name to the MESSAGES
    file is recommended, for example, /db2home/db2inst1/myload.msg.


    If the MESSAGES option is used, once the load operation has completed the message
    files on each partition will be transferred to the client machine and stored in
    files using the base name indicated by the MESSAGES option. For partitioned database
    load operations, the name of the file corresponding to the load process that produced
    it is listed in Table 5-1.


    # Table 5-1 Message file types generated by partitioned LOAD operation


    | Process Type | File Name |

    |---|---|

    | Load Agent | <message-file-name>.-load.<partitionnumber> |

    | Partitioning Agent | <message-file-name>.-part.<partitionnumber> |

    | Pre-partitioning Agent | <message-file-name>.-prep.<partitionnumber> |


    For more information regarding the agent type listed in the preceding table, refer
    to IBM DB2 UDB Data Movement Utilities Guide and Reference V8, SC09-4830, and
    IBM DB2 UDB Command Reference V8, SC09-4828.'
