    # File system configuration


    We recommend that you create different partitions during your Linux OS installation.
    It has become customary for certain basic directories, such as /db2home or /software
    (in our example), to be placed in separate filesystems, or partitions, for several
    reasons:


    +   ► Disk capacity - There is a limited amount of space on each disk, and you
    might run out of space if you use a single disk for multiple purposes.

    +   ► Performance - The root directory has to be searched linearly every time
    any pathname in Linux is accessed. If the root directory is cluttered, this will
    impair performance of the entire system.

    +   ► Backup - It is better to separate important and frequently changing data
    from massive, and seldom changing data. This way you can save system resources
    by backing up some file systems more frequently than others.

    +   ► User convenience - It''s easier to find things if the naming convention
    is well-organized.


    File system configuration, or partitioning, is typically performed by using the
    fdisk tool. For SuSE, you can also use the graphical YaST tool. Linux provides
    several Journal filesystem formats, such as Ext3, JFS, XFS and ReiserFS. In our
    example, for database-related file systems, we use the Ext3 format to create a
    journal filesystem. Please note that use of Ext3 file system is not recommended
    for use with Kernel levels lower than 2.4.18 without appropriate fixes.


    To show all defined file systems, issue the df command, as shown in Example 2-4.


    # Example 2-4 df command


    ```

