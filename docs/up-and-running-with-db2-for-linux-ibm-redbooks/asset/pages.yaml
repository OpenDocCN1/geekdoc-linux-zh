- pgno: 23
  md: '# DB2 packages for Application Developers


    DB2 provides two packages for application development.


    **DB2 Personal Developer''s Edition (PDE):** PDE enables a developer to design
    and build single user desktop applications. This offering comes with Linux and
    Windows versions of the DB2 PE products as well as the DB2 Extenders.


    **DB2 Universal Developers Edition (UDE):** UDE offers a low-cost package for
    a single application developer to design, build, or prototype applications for
    deployment of any of the DB2 client or server platforms. It includes client and
    server DB2 editions for all Linux, UNIX and Windows supported platforms, DB2 Connect,
    DB2 Extenders, and Intelligent Miner. The software in this package cannot be used
    for production systems.


    # DB2 for pervasive platforms


    The last, but not the least, DB2 offering is:


    **DB2 Everyplace:** DB2 Everyplace is a relational database and enterprise synchronization
    server that enables enterprise applications and enterprise data to be extended
    to mobile devices such as personal digital assistants (PDAs) and smart phones.
    DB2 Everyplace can also be embedded into devices and appliances to increase their
    functionality and market appeal. The product can be used as a local independent
    database on a mobile device or query information on remote servers when a connection
    is available.


    # 1.3  DB2 environment


    This section describes the various DB2 application configurations on Linux. It
    also discusses the parallelism on SMP and clusters and gives a description of
    DB2 architecture.


    # 1.3.1  Deployment topologies


    DB2 for Linux can be used with a wide range of applications, whether they are
    developed in-house or pre-packaged. The applications can be deployed with DB2
    using a number of configurations, which are:


    +   - **Single-tier**


    In this configuration the application and the database reside on the same system.
    In enterprise environments, it may be rare to see such a configuration, because
    remote access to a database server is typically required. Nonetheless this is
    quite common for developing applications that'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'can later be deployed transparently in a multi-tier DB2 environment without
    any changes.


    # Client/Server or 2-tier


    The application and the database reside on separate systems. The machines where
    the application runs typically have a DB2 client installed, which communicates
    over the network to a database server. For the application, the physical location
    of the data is transparent. The application communicates with the DB2 client using
    a standard interface (for example, ODBC) and the DB2 client takes over the task
    of accessing the data over the network. In some cases, such as browser or Java
    based access, it is not necessary to have the DB2 client running on the same machine
    where the application executes.


    DB2 provides exceptional flexibility for mixing and matching client and server
    platforms in a heterogeneous environment. DB2 client and server code is available
    for a wide variety of platforms. For example, the application can execute on a
    Windows based machine with a DB2 client for Windows, which can then access a DB2
    database on a Linux server. Likewise, the Linux machine can act as a client and
    access data from UNIX servers or mainframes.


    # Multi-tier


    In a multi-tier configuration, the application, DB2 client and the data source
    typically reside on separate systems. Examples of such configurations include,
    but are not limited to, scenarios illustrated below (Table 1-1).


    Table 1-1 Multi-tier configuration examples


    | Client | Middle-Tier | Server |

    |---|---|---|

    | Web-browser | Web Server

    DB2 Client | DB2 Database Server |

    | Application Client | Application Server

    DB2 Client | DB2 Database Server 1

    DB2 Database Server 2 |

    | Application

    DB2 Client | DB2 Connect Gateway | OS/390

    AS/400

    VM/VSE |

    | Application

    DB2 Client | DB2 Server | Secondary Data Sources

    (for example, Mainframe DB2, Non-DB2, non-relational) |


    IBM recognizes that in many cases there may be a need for accessing data from
    a variety of distributed data sources rather than one centralized database. The
    data sources can be from IBM, such as DB2 or Informix®, or non-IBM'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'databases, such as Oracle, or even non-relational data, such as files or spreadsheets.
    As illustrated in the last scenario in the table above, IBM offers the most comprehensive
    business integration solution by allowing federated access to a variety of distributed
    data sources.


    # 1.3.2 DB2 database objects


    In this section, we introduce some DB2 objects and their relationship to each
    other.


    # Instances


    An instance (sometimes called a database manager) is DB2 code that manages data.
    It controls what can be done to the data, and manages system resources assigned
    to it. Each instance is a complete environment. It contains all the database partitions
    defined for a given parallel database system. An instance has its own databases
    (which other instances cannot access directly), and all its database partitions
    share the same system directories. It also has separate security from other instances
    on the same machine (system), allowing for example both production and development
    environments to be run on the same machine under separate DB2 instances without
    interfering with each other.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '![](img/d95c931f4f3da4a6bd0ee55148fefad7_26_0.png)


    Figure 1-2 DB2 database objects


    # Databases


    A relational database presents data as a collection of tables. A table consists
    of a defined number of columns and any number of rows. Each database includes
    a set of system catalog tables that describe the logical and physical structure
    of the data, a configuration file containing the parameter values allocated for
    the database, and a recovery log.


    # Database partition groups


    A database partition group is a set of one or more database partitions. Before
    creating tables for the database, you first need to create the database partition
    group where the table spaces will be stored, and then create the tablespace where
    the tables will be stored. If a partition group is not specified, there is a default
    group where tablespaces are allocated. In earlier versions of DB2, database partition
    groups were known as nodegroups. In a non-partitioned environment, all the data
    resides in a single partition, therefore it is not necessary to worry about partition
    groups.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# Table spaces


    A database is organized into parts called tablespaces. A tablespace is a place
    to store tables. When creating a table, you can decide to have certain objects
    such as indexes and large object (LOB) data kept separately from the rest of the
    table data. A tablespace can also be spread over one or more physical storage
    devices.


    Tablespaces reside in database partition groups. Tablespace definitions and attributes
    are recorded in the database system catalog. Containers are assigned to table
    spaces. A container is an allocation of physical storage (such as a file or a
    device). A table space can be either system managed space (SMS), or database managed
    space (DMS). For an SMS table space, each container is a directory in the file
    space of the operating system, and the operating system''s file manager controls
    the storage space. For a DMS table space, each container is either a fixed size
    pre-allocated file, or a physical device such as a disk, and the database manager
    controls the storage space.


    # Tables


    A relational database presents data as a collection of tables. A table consists
    of data logically arranged in columns and rows. All database and table data is
    assigned to table spaces. The data in the table is logically related, and relationships
    can be defined between tables. Data can be viewed and manipulated based on mathematical
    principles and operations called relations. Table data is accessed through Structured
    Query Language (SQL), a standardized language for defining and manipulating data
    in a relational database. A query is used in applications or by users to retrieve
    data from a database. The query uses SQL to create a statement in the form of:


    ```

    SELECT <data_name> FROM <table_name>

    ```


    # Buffer pools


    A buffer pool is the amount of main memory allocated to cache table and index
    data pages as they are being read from disk, or being modified. The purpose of
    the buffer pool is to improve system performance. Data can be accessed much faster
    from memory than from disk; therefore, the fewer times the database manager needs
    to read from or write to a disk (I/O), the better the performance. (You can create
    more than one buffer pool, although for most situations only one is sufficient.)
    The configuration of the buffer pool is the single most important tuning area,
    because you can reduce the delay caused by slow I/O.


    # 1.4 Parallelism with DB2


    A system with a single processor and disk has limitations for the amount of data,
    users, and applications that it can handle. Parallel processing, which is key
    for'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'enterprise workloads, involves spreading the load across several processors
    and disks, allows for large volumes of data and high transaction rates to be processed.
    In many environments, the data volumes are growing at a phenomenal rate, therefore
    a database management system needs to be able to easily scale to increased loads
    with the addition of more disks and CPUs.


    DB2''s parallel technology enables highly scalable performance on large databases
    by breaking the processing into separate execution components that can be run
    concurrently on multiple processors. Elapsed times for queries can be dramatically
    reduced by processing the individual queries in parallel. DB2 supports a scalable
    growth path to easily add more processing power to an existing system by either
    "scaling up" (SMP) or "scaling out" (MPP) or both.


    # 1.4.1 SMP environments


    In the past, complex enterprise workloads have typically run on high-end SMP (symmetric
    multi-processor) machines. A large number of processors running within the same
    machine and connected with a high bandwidth bus can deliver excellent performance.
    Because DB2 for Linux shares over 99% of its code with DB2 running on high-end
    UNIX systems, it inherits the ability to exploit SMP architectures. DB2''s ability
    to run on SMP systems is only restricted by today''s Linux SMP scalability. The
    unprecedented results of a recent SAP benchmark⁴ on an 8-way Linux system are
    a testament to the effectiveness of DB2 for Linux in a SMP environment. A large
    number of developers at the IBM Linux Technology Center are engaged with the Linux
    community to extend the capabilities of Linux on 16-way and higher SMP machines.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '![](img/d95c931f4f3da4a6bd0ee55148fefad7_29_0.png)


    Figure 1-3 Database on a large SMP system


    # 1.4.2 Database clusters


    The driving force behind using Linux clusters is that by distributing the load
    over several low cost servers running an open-source operating system, a larger
    task can be accomplished faster, more reliably, and much more economically. And
    if the load increases, the cluster can be extended for managing the additional
    demand without compromising on performance. DB2 was the first commercial database
    on Linux to provide built-in capabilities for clusters. That is, DB2 can be deployed
    across a Linux cluster right out of the box, without the need for additional clustering
    software. DB2 clusters on Linux are ideal for running demanding transactional
    applications and warehouses that involve large volumes of data while providing
    the following benefits:


    +   - Faster processing time

    +   - Very large databases

    +   - Excellent scalability

    +   - Increased availability

    +   - Reduced cost


    Combining the clustered approach with DB2’s support for 64-bit Linux environments
    provides additional performance and scalability advantages.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Database clustering architectures


    There are two primary database clustering architectures: shared-disk and shared-nothing.
    Shared-disk is used by Oracle RAC. DB2 for Linux employs shared-nothing.


    ![](img/d95c931f4f3da4a6bd0ee55148fefad7_30_0.png)


    Figure 1-4 Shared disk architecture


    # Shared-disk


    In a shared-disk environment, each database node has its own processors but shares
    the disks with other nodes. Therefore all the processors can access all the disks
    in the cluster. This introduces additional overhead for coordinating resources
    and locks between nodes. For example, if Node 1 wants to access data on a certain
    disk that has been locked for update by another node in the cluster, Node 1 must
    wait for other nodes to complete their operations. While this works well when
    there are few nodes in the cluster (for example, mainframe environments), the
    overhead for distributed lock management and cache coherency issues can severely
    limit scalability and introduce performance degradation for four or more nodes,
    making it impractical to exploit economies of large clusters on Linux. Furthermore,
    this approach involves specialized hardware and software for shared disk and cache
    management, making it much more expensive than shared-nothing.


    # Shared-nothing


    As the name implies, partitions (nodes) in a shared-nothing environment do not
    share processors, memory, or disks with partitions on other machines. Each'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'partition acts on its own subset of data. Because each partition has its own
    private resources, this approach does not involve any resource contention with
    other servers, lending itself to virtually unlimited scalability. This is one
    reason DB2 for Linux can support up to 1000 partitions. And because there is no
    coordination overhead for accessing resources, additional machines can easily
    be added to the cluster with linearly scalable performance, which implies, if
    doubling of the data volume is matched by the doubling of the cluster resources,
    the high performance of the database will be maintained at the same level. If
    one partition in a cluster fails, its resources can dynamically be transferred
    to another machine, ensuring high availability. Another benefit of the shared
    nothing approach used by DB2 for Linux is that it does not require specialized
    hardware, making the solution much simpler, less expensive, and suitable for Linux
    based "commodity" hardware.


    ![](img/d95c931f4f3da4a6bd0ee55148fefad7_31_0.png)


    # 1.4.3 Partitioned database


    DB2 exploits the power of Linux clusters by employing database partitioning. In
    a partitioned environment, a database is distributed across multiple partitions,
    usually residing on different machines. Each partition is responsible for a portion
    of a database''s total data. A database partition is sometimes also called a node
    or a database node. Because data is divided across database partitions, you can
    use the power of multiple processors on multiple physical nodes to satisfy requests
    for information. Data retrieval and update requests are decomposed automatically
    into sub-requests, and executed in parallel among the applicable database partitions.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'As an illustration of the power of processing in a partitioned database system,
    assume that you have 100,000,000 records that you want to scan in a single-partition
    database. This scan would require that a single database manager search 100,000,000
    records. Now suppose that these records are spread evenly over 20 database partitions;
    each partition only has to scan 5,000,000 records. If each database partition
    server scans in parallel with the same speed, the time required to do the scan
    should be approximately 20 times faster than a single-partition system handling
    the entire task.


    The fact that databases are partitioned across several database partitions is
    transparent to users and applications. User interaction occurs through one database
    partition, known as the coordinator node for that user. Any database partition
    can be used as a coordinator node. The database partition that a client or application
    connects to becomes the coordinator node. You should consider spreading out users
    across database partitions servers to distribute the coordinator function.


    ![](img/d95c931f4f3da4a6bd0ee55148fefad7_32_0.png)


    Figure 1-6 DB2 MPP environment


    The data is distributed among database partitions using an updatable partitioning
    map and a hashing algorithm, which determine the placement and retrieval of each
    row of data. For example, if a row is being added to a table, the coordinator
    node checks a partitioning map, which specifies the database partition where the
    row is to be stored. The row is only sent to that database partition server, with
    the result that only the interested database partition servers take part in the
    insert.'
  merge: -1
  img_proc: true
- pgno: 33
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 34
  md: 'database partitions do not share all resources. Processors are shared but disks
    and memory are not. See Figure 1-8.


    ![](img/d95c931f4f3da4a6bd0ee55148fefad7_34_0.png)


    Figure 1-8 A partitioned database across a cluster of SMP machines


    There are advantages to using logical partitions on high-SMP systems in both clustered
    and non-clustered environments. Logical database partitions can provide better
    scalability. Multiple database managers running on multiple logical partitions
    may make fuller use of available resources than a single database manager could.
    The ability to have two or more partitions coexist on the same machine (regardless
    of the number of processors) allows greater flexibility in designing high availability
    configurations and failover strategies. Upon machine failure, a database partition
    can be automatically moved and restarted on a second machine that already contains
    another partition of the same database.'
  merge: -1
  img_proc: true
