    +   a. Log in as a user with root authority.


    +   b. Issue the following command to create the DAS:


    ```

    /opt/IBM/db2/V8.1/instance/dascrt -u DASuser

    ```


    For the -u parameter, enter the DAS user that you created for this machine, for
    example, dasusr1.


    # 7. Create DB2 tools catalog (optional).


    You must create a DB2 tools catalog if you plan to use the Task Center or scheduler.
    This creates a database on your local machine that stores task metadata. The scheduler
    will not work without this repository. You may either create a new database or
    use an existing database.


    +   a. Log in as instance owner.


    +   b. Use the CREATE TOOLS CATALOG command to create a new tools catalog database,
    or configure the tools catalog to an existing database.


    For example, to create a new tools catalog called toolscat in a new database called
    toolsdb, we issued:


    ```

    db2 create tools catalog toolscat create new database toolsdb

    ```


    > Note: Refer to the IBM DB2 UDB Command Reference V8, SC09-4828 for additional
    CREATE TOOLS CATALOG command options.


    # 8. Set up SMTP server and administration contact list (optional).


    By default, a health monitor runs on the DB2 instance you just created. If you
    set up an SMTP server and administration contact list, the DB2 health monitor
    will send a notification e-mail to the people on the contact list when a health
    indicator threshold is breached and a database requires attention. You may create
    a new contact list that is stored locally, or use an existing global contact list
    that resides on a remote DB2 server. Another option is to create a contact group.
    When a notice is sent to the group, each member of the group receives this notice.
    You can also specify to have the notification sent to a contact''s pager. First,
    you must set up the SMTP server. To do so:


    +   a. Login as instance owner and issue the following command:


    ```

    db2 update admin cfg using smtp_server <host_name>

    ```


    Where, host_name is the TCP/IP hostname of the machine that contains the SMTP
    server used for e-mail notifications.'
