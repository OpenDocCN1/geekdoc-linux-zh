    # Usage Sample


    The following sample shows you how to configure a health indicator in the Health
    Center, or by DB2 CLP commands, to monitor DMS table space storage consumption.
    In this example, we expect when table space utilization, which is measured as
    the percentage of space consumed, exceeds the predefined threshold values for
    a warning or alarm, DB2 system will send notification to the administration notification
    log and the specified contacts by e-mail or pager. You can get recommendations
    from the Health Center or by DB2 CLP commands for such a situation and take actions
    accordingly. Furthermore, we also show you how to specify follow-up actions for
    the occurrence of a warning or alarm for this specific health indicator. You can
    have the DB2 system take the corrective action automatically when the values for
    a health indicator setting are exceeded.


    The example consists of the following steps:


    +   1. Prepare DMS tablespace and table.'
