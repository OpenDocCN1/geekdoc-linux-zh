    # 5.3.3 Load data into existing tables


    The load utility is capable of efficiently moving large quantities of data into
    newly created tables or into tables that already contain data. The utility can
    handle most data types including large objects (LOBs) and user-defined types (UDTs).
    The load utility is faster than the import utility, because it writes formatted
    pages directly into the database while the import utility performs SQL INSERTS.
    The load utility does not fire triggers, and does not perform referential or table
    constraints checking (other than validating the uniqueness of the indexes).


    +   - Load: During which the data is written to the table.

    +   - Build: During which indexes are produced.

    +   - Delete: During which the rows that caused a unique key violation or a DATALINK
    violation are removed from the table.

    +   - Index copy: During which the index data is copied from a system temporary
    table space to the original table space. This will only occur if a system temporary
    table space was specified for index creation during a load operation with the
    READ ACCESS option specified.


    Several enhancements have been made to the load utility in Version 8. New functionality
    has been added to simplify the process of loading data into both single partition
    and multi-partition database environments.


    Load operations now take place at the table level. This means that the load utility
    no longer requires exclusive access to the entire table space, and concurrent
    access to other table objects in the same table space is possible during a load
    operation. Further, table spaces that are involved in the load operation are not
    quiesced. When the COPY NO option is specified for a recoverable database, the
    table space will be placed in the backup pending table space state when the load
    operation begins.'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'Another feature that has been added to the load utility is the ability to query
    pre-existing data in a table while new data is being loaded. You can do this by
    specifying the READ ACCESS option of the LOAD command.


    The LOCK WITH FORCE option has also been introduced in this release. It allows
    you to force applications to release the locks they have on a table, allowing
    the load operation to proceed and to acquire the locks it needs.


    You can now load data in partitioned database environments using the same commands
    (LOAD, db2load) and APIs (db2load, db2LoadQuery) used in single partition database
    environments. The AutoLoader utility (db2atld) and the AutoLoader control file
    are no longer needed.


    Through the use of the new CURSOR file type, you can now load the results of an
    SQL query into a database without having to export them to a data file first.


    Prior to Version 8, following a load operation the target table remained in check
    pending state if it contained generated columns. The load utility will now generate
    column values, and you no longer need to issue the SET INTEGRITY statement after
    a load operation into a table that contains generated columns and has no other
    table constraints.


    The functionality of the LOAD QUERY command has also been expanded. It now returns
    the table state of the target table into which data is being loaded as well as
    the status information it previously included on a load operation in progress.
    The LOAD QUERY command can be used to query table states whether or not a load
    operation is in progress on a particular table.


    The Control Center now has a load wizard to assist you in the set up of a load
    operation.


    The load utility can be invoked through the command line processor (CLP), the
    Load notebook in the Control Center, or an application programming interface (API),
    db2Load.


    The following are some examples for using load through CLP.


    # Examples for partitioned table loading


