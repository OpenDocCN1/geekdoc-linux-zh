- pgno: 50
  md: 'first at the database manager level and then at the kernel (or filesystem)
    level. At this level, the kernel intercepts the calls and transfers the data to
    its own buffer before passing it on to the physical device or process. The additional
    buffering impedes performance.


    DB2 supports raw I/O on the Linux distributions listed in Table 2-6. This means
    that a raw device can be attached to any UDB Universal Database system running
    on these systems.


    The naming of default raw device nodes differs between Linux distributions, as
    shown in the following table. Raw devices are not supported by DB2 on Linux/390.


    *Table 2-6  Linux distributions currently supporting raw I/O*


    | Distribution | Raw device nodes | Raw device controller |

    |---|---|---|

    | Red Hat or TurboLinux | /dev/raw/raw1 to 255 | /dev/rawctl |

    | SuSE | /dev/raw1 to 63 | /dev/raw |


    # Raw device configuration


    For a detailed procedure for how to set up raw I/O on your Linux machine, refer
    to *IBM DB2 UDB Administration Guide: Implementation*, SC09-4820. In this section,
    we explain how to bind the raw device to the Linux kernel.


    To perform raw I/O on a block device, you must first bind the Linux kernel’s pool
    of raw devices to that block device. This is done by running the raw command as
    root. The raw utility is normally supplied by the Linux distributors nowadays.


    For example, if your disk partition is */dev/hda12* and you want to bind it to
    */dev/raw/raw1*, enter the following command:


    ```

    bash$ raw /dev/raw/raw1 /dev/hda12

    ```


    Next, configure the /etc/rc.d/boot.local file so that DB2 can access the raw device
    at boot time. In Example 2-2 we added the following entries to /etc/rc.d/boot.local:


    ```

    *Example 2-2  Bind raw device with block device*


    raw /dev/raw/raw1 /dev/hda12

    raw /dev/raw/raw2 /dev/hda13

    ```


    To show all current raw devices available, issue following command:


    ```

    raw -qa

    ```'
