    # 3.3 Creating a database


    When you create a database, the following tasks will be done for you:


    +   - Setting up of all the system catalog tables that are required by the database

    +   During creation of a new database, DB2 allocates three tablespaces: SYSCATSPACE,
    USERSPACE1 and TEMP SPACE1. The tablespace SYSCATSPACE holds all system catalog
    tables. These catalog tables are actually a repository that keeps information
    and statistics about all objects within the database. USERSPACE1 contains the
    tables for holding user created tables. A system temporary tablespace (TEMP SPACE1)
    is required by DB2 to support activities like sorting data, join tables create
    indexes.


    +   - Allocation of the database recovery log

    +   The DB2 recovery log tracks all changes made against your database. It is
    also called the transaction log. It is used with the recovery history file to
    recover data in case of failure.'
  merge: -1
  img_proc: true
