    is also for use on systems with up to four CPUs.


    # DB Enterprise Server Edition (ESE):


    ESE meets the database server needs of midsize to large businesses. ESE is the
    ideal foundation for building data warehouses, transaction processing, or Web-based
    solutions as well as a back-end for packaged solutions like ERP, CRM, and SCM.
    Additionally, ESE offers connectivity and integration for other enterprise DB2
    and Informix data sources.


    In versions of DB2 prior to V8.1, the product was available in two enterprise
