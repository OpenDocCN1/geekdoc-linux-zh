    # Create tablespaces and tables


    The next step, of course, is to create tables for your application. When a database
    is created, DB2 creates three default tablespaces. The USERSPACE1 is used for
    place the data tables. Based on the database design, more tablespaces can be created.
    The tables usually will be placed to a particular tablespace based on the application
    and database design. It is common to create your own tablespaces spread across
    all partitions or only a part of them. Every tablespace has to be created in a
    database partition group. We show you in Example 3-19 the creation of a tablespace
    over all partitions defined in db2nodes.cfg, using the default database partition
    group IBMDEFAULTGROUP.


    Example 3-19 Create multi partition tablespace


    ```

    connect to itsodb;


    create tablespace sample_mpl in IBMDEFAULTGROUP pagesize 4k

    MANAGED BY SYSTEM

    using (''/tablespaces/db2inst1/itsodb/NODE000 $N /sample_mpl'')on dbpartitionnum

    (0)

    using (''/tablespaces/db2inst1/itsodb/NODE000 $N /sample_mpl'')on dbpartitionnum

    (1)

    using (''/tablespaces/db2inst1/itsodb/NODE000 $N /sample_mpl'')on dbpartitionnum

    (2)

    using (''/tablespaces/db2inst1/itsodb/NODE000 $N /sample_mpl'')on dbpartitionnum

    (3)

    extentsize 8 prefetchsize 32;

    ```


    Example 3-20 shows a creation of a database partition group sng_01 and a single
    partition tablespace on partition 1.


    Example 3-20 Create single partition tablespace


    ```

    connect to itsodb;

    ```'
