    # 5.4.2 Task Center and Scheduler


    After the DAS has started and the Tools Catalog is ready, you can start the Task
    Center within the DB2 Control Center or other tools where the Tools menu is available.
    You can use the Task Center to run tasks, either immediately or according to a
    schedule, and to notify people about the status of the completed tasks. The Task
    Center includes functionality from the Script Center in previous versions of DB2,
    plus additional functionality.


    A task is a script, together with the associated success conditions, schedules,
    and notifications. You can create a task within the Task Center, create a script
    within another tool and save it to the Task Center, import an existing script,
    or'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'save the options from a DB2 dialog or wizard such as the Load wizard. A script
    can contain DB2 commands, SQL, or operating system commands.


    For each task, by using the Task Center, you can do the following:


    +   - Schedule the task.

    +   - Specify success and failure conditions.

    +   - Specify actions that should be performed when this task completes successfully
    or when it fails.

    +   - Specify e-mail addresses (including pagers) that should be notified when
    this task completes successfully or when it fails.


    You can specify conditional coding by creating task actions. Each task action
    consists of a task and the action that should be performed by the task. For example,
    task one can have the following task actions:


    +   - If task one is successful, task action A enables the schedule for task two.

    +   - If task one fails, task action B runs task three.


    The following is a sample with detailed steps to create a task within the Task
    Center. Task scheduling is also included.


    +   1. Start Task Center and create a new task (Figure 5-32):

    +   Right-click in the content pane, then click New, and a new window will open.'
