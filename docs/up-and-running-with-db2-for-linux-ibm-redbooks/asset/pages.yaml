    # Issuing commands to multiple database partitions


    This appendix discusses some commonly used DB2 commands in a multiple partition
    environment (MPE). These commands are very useful when you need to collect information
    from multiple database partitions or machines, or make specified commands running
    against multiple partitions or machines. The commands that are discussed in this
    appendix include db2_ps, db2_all, rah, db2_call_stack, and so on.'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# db2_all and rah


    In a multiple partitions environment, you may want to issue commands to be run
    on more than one machine or partition in the instance, and you don’t want to repeat
    the same commands on every machine or partition involved — for this purpose, you
    can use the rah command or the db2_all command.


    The rah command allows you to issue commands you want to run on all machines where
    the instance is spread across. If you want the commands to run at database partition
    level in the instance, you run the db2_all command.


    To run a command on all machines with rah, the general command syntax is:


    ```

    rah [ commands ]

    ```


    To run the commands on all database partitions that you specified, use the db2_all
    command. The general command syntax is:


    ```

    db2_all [ commands ]

    ```


    If the command to be run doesn’t follow rah or db2_all, you will be prompted to
    enter one by rah and db2_all. In general, if you specify the commands as the parameter
    on the command line, you must enclose it in double quotation marks if it contains
    any of the following special characters:


    | & ; < > ( ) { } [ ] unsubstituted $


    To obtain help information about db2_all or rah syntax, type:


    ```

    db2_all "?"

    ```


    Or,


    ```

    rah "?"

    ```


    There are some command prefix sequences (here a prefix sequence is one or more
    special characters) for db2_all and rah that can be used to control the command
    running mode, for example, running commands in sequence or parallel on all involved
    machines or partitions, running in foreground or background, whether or not to
    execute environment setting script before executing specified commands, and so
    on. Table A-1 shows some commonly used command prefix sequences. For a detailed
    explanation of these prefix sequences or other prefix sequences that can be used,
    refer to the "Administration" Guides (listed in "Other publications" on page 303).'
  merge: -1
  img_proc: true
- pgno: 306
  md: '# Table A-1 Commonly used command prefix sequences for db2_all and rah


    | Sequence | Description |

    |---|---|

    | l | Runs the commands in sequence in the background. |

    | l& | Runs the commands in sequence in the background and terminates the command
    after all remote commands have completed. |

    | ll | Runs the commands in parallel in the background. |

    | ll& or ; | Runs the commands in parallel in the background and terminates the
    command after all remote commands have completed. |

    | < | Commands sent to all the machines for running except this one. |

    | <<-nnn< | Commands sent to all other database partitions but not the database
    partition nnn for running. |

    | <<+nnn< | Commands sent to only database partition nnn for running |

    | > | Substitutes occurrences of <> with the machine name. |

    | " | Substitutes occurrences of () by the machine index, and substitutes occurrences
    of ## by the node number. |


    The first command in the following example shows you how to update database configuration
    parameters for all database partitions in the instance; and the second one shows
    you how to use prefix sequences for substitution purposes, and using the prefix
    sequence "''" (single quotation mark) to echo the commands that will be executed.


    # Example: A-1 Using db2_all on a multiple partitions environment


    ```

    $ db2_all "db2 update db cfg for sample using logprimary 10 logsecond 15"


    DB20001I The UPDATE DATABASE CONFIGURATION command completed successfully.

    UDBLNX06: db2 update db cfg for sample using logprimary 10 logsecond 15 completed
    ok


    DB20001I The UPDATE DATABASE CONFIGURATION command completed successfully.

    UDBLNX07: db2 update db cfg for sample using logprimary 10 logsecond 15 completed
    ok


    $ db2_all "''">echo Machine Name: <> Partition Number: ##"

    echo Machine Name: <> Partition Number: ##


    Machine Name: UDBLNX06 Partition Number: 0

    UDBLNX06: echo Machine Name: <> Partition Number: ## completed ok


    Machine Name: UDBLNX07 Partition Number: 1

    ```'
  merge: -1
  img_proc: true
- pgno: 307
  md: '```

    UDBLNX07: echo Machine Name: <> Partition Number: ## completed ok

    ```


    Please be aware of the prefix sequence " (double quotation mark) is preceded by
    a back slash "\" in our example. Here the back slash is used as an escape character.
    In addition, DB2 instance owner''s login shell is bash in the example, not ksh
    that DB2 originally supports.


    # db2_ps


    You can use db2_ps command to list all the db2 engine processes on all logical
    partitions.


    # db2_call_stack


    This command, on UNIX-based platforms, causes all processes running on all database
    partition servers to write call trace back to the syslog. In general, you don''t
    need to run this command unless it is required by DB2 support staff.


    For more information regarding the commands mentioned here, please refer to the
    "Administration" Guides (listed in "Other publications" on page 303), or refer
    to the online help provided by db2_all or rah.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# DB2 Tools Catalog creation


    This appendix provides a sample to create the DB2 Tools Catalog manually and information
    related to the Tool Catalog creation. In addition, the notification setup is also
    briefed here.'
  merge: -1
  img_proc: true
- pgno: 309
  md: '# DB2 Tools Catalog creation


    If you did not create a tools catalog when you installed DB2, you can create it
    by using DB2 Control Center or by the Command Line Processor. If using DB2 Control
    Center to do that, after invoking DB2 Control Center, then you can select Tools
    --> Tools Settings --> Scheduler Settings, and create one new Tools Catalog.


    Here we provide a sample to create the Tools Catalog by using the DB2 CLP manually,
    also included are the steps to check DAS''s configuration variations before and
    after creating Tools Catalog, and the new tablespaces and bufferpools created
    by CREATE TOOLS CATALOG command automatically.


    Before we create the Tools Catalog, we use GET ADMIN CFG to get the current configurations
    for DAS as shown in Example B-1. You can see that some parameters associated with
    the Tools Catalog are empty currently, including TOOLSCAT_DB, TOOLSCAT_INST TOOLSCAT_SCHEMA.
    We will use this information to compare the DAS configuration changes made by
    the CREATE TOOLS CATALOG command at a later time.


    Example: B-1 Checking current DAS configuration


    ```

    db2inst1@UDBLNX08:~> db2 get admin cfg


    Admin Server Configuration


    Authentication Type DAS                 (AUTHENTICATION) = SERVER_ENCRYPT


    DAS Administration Authority Group Name (DASADM_GROUP) = dasadm1


    DAS Discovery Mode                      (DISCOVER) = SEARCH

    Name of the DB2 Server System           (DB2SYSTEM) = UDBLNX08


    Java Development Kit Installation Path DAS (JDK_PATH) = /opt/IBMJava2-131


    DAS Code Page                           (DAS_CODEPAGE) = 0

    DAS Territory                           (DAS_TERRITORY) = 0


    Location of Contact List                (CONTACT_HOST) =

    Execute Expired Tasks                   (EXEC_EXP_TASK) = NO

    Scheduler Mode                          (SCHED_ENABLE) = OFF

    SMTP Server                             (SMTP_SERVER) =

    Tools Catalog Database                  (TOOLSCAT_DB) =

    Tools Catalog Database Instance         (TOOLSCAT_INST) =

    Tools Catalog Database Schema           (TOOLSCAT_SCHEMA) =

    Scheduler User ID                       =

    ```'
  merge: -1
  img_proc: true
- pgno: 310
  md: "Then we create the Tools Catalog by CLP as in Example B-2.\n\n# Example: B-2\
    \ Creating Tools Catalog by using CLP\n\n```\ndb2inst1@UDBLNX08:~> db2 \"create\
    \ database toolscat\"\nDB20000I  The CREATE DATABASE command completed successfully.\n\
    db2inst1@UDBLNX08:~> db2 \"create tools catalog esecat0 use existing database\
    \ toolscat\"\nDB20000I  The CREATE TOOLS CATALOG command completed successfully.\n\
    ```\n\nIn the preceding example, if you want, you can create the new database\
    \ (here it is TOOLSCAT) via CREATE TOOLS CATALOG with CREATE NEW DATABASE parameter\
    \ directly; for details regarding the command syntax of CREATE TOOLS CATALOG,\
    \ refer to IBM DB2 UDB Command Reference V8, SC09-4828.\n\nThen you can check\
    \ DAS configuration parameters again and you may find that the parameters associated\
    \ with the Tools Catalog were changed automatically.\n\n# Example: B-3 DAS Tools\
    \ Catalog parameters changed automatically\n\n```\ndb2inst1@UDBLNX08:~> db2 get\
    \ admin cfg\n\n    Admin Server Configuration\n\nAuthentication Type DAS     \
