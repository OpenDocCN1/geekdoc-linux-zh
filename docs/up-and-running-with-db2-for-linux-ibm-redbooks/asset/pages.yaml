    # 4.3 Migrating your instances and databases


    Now that you have successfully installed DB2 UDB V8 server, it is time to migrate
    the instances and databases. This section provides a list of pre-migration tasks
    and the migration procedures.


    # 4.3.1 Pre-migration tasks


    Perform the following steps to prepare for a safe and successful migration:


    +   1. Save DBM and DB configuration settings. You should compare these settings
    before and after migration to check for any migration errors.

    +   2. Save tablespace and package information using the `db2 list tablespaces`
    and `db2 list packages` commands. You may also want to compare this information
    before and after migration.

    +   3. Change diagnostic error level to 4. Diaglevel 4 records all errors, warnings,
    and informational messages to make problem determination easier for you if any
    migration errors occur. Issue the following command:


    ```

    db2 update dbm cfg using diaglevel 4

    ```'
  merge: -1
  img_proc: true
- pgno: 153
  md: '4. Take the V6 or V7 DB2 Server offline:


    +   a. Stop the DB2 license service by entering `db2licd -end`.

    +   b. Stop all command line processor sessions by issuing `db2 terminate` on
    each session window.

    +   c. Disconnect all applications and users. For a list of all database connections,
    enter the `db2 list applications` command. You can disconnect applications and
    users by entering `db2 force applications all`.


    5. If you use replication, archive all of your DB2 log files using the `archive
    log` command. This command closes and truncates the active log file for your database.
    Use the following syntax:


    ```

    db2 archive log for database <database_alias> user <user_name> using <password>

    ```


    6. Back up databases. We suggest you do an offline backup from each local database.
    Use the following command:


    ```

    db2 backup database <database_alias> user <user_name> using password <password>

    ```


    7. As instance owner, stop the instance by issuing `db2stop`.


    8. Login as root and issue `ps -ef | grep db2` to check for any outstanding processes
    on the instance you are migrating. If any processes are still running, such as
    `db2bp`, kill the process using the following command:


    ```

    kill -9 <pid>

    ```


    Where, pid represents the process ID number.


    # 4.3.2 Migrating instances and databases


    All the steps we have done up to now are to prepare for the instances and databases
    migration. The `db2imigr` command is used to migrate the instances to Version
    8 format. The `db2 migrate database` command is used to migrate the databases.


    In case you are wondering what happens during instance migration, the `db2imigr`
    command performs the following:


    +   Checks cataloged databases to make sure they are ready for migration

    +   Migrates your instance to a V8 instance

    +   Updates system and local database directories to a Version 8 format

    +   Merges pre-V8 DBM configuration settings with V8 DBM configuration settings'
  merge: -1
