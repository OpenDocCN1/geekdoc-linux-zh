- pgno: 301
  md: '![](img/d95c931f4f3da4a6bd0ee55148fefad7_301_0.png)


    Figure 8-6 Stored Procedure edit window


    To compile stored procedures using the Development Center, we have to configure
    two DB2 environment variables (Example 8-6):


    +   - DB2_SQLROUTINE_COMPILER_PATH to set the path to the C compiler

    +   - DB2_SQLROUTINE_COMPILE_COMMAND to define parameters for compiling procedures.


    Example 8-6 Set C compiler environment for Linux


    ```

    DB2SET DB2_SQLROUTINE_COMPILER_PATH=/usr/bin

    DB2SET DB2_SQLROUTINE_COMPILE_COMMAND=cc -fpic -ISHOME/sqllib/include SQLROUTINE_FILENAME.c
    -shared -o SQLROUTINE_FILENAME -LSHOME/sqllib/lib -ldb2

    ```


    > Important: The database server on which you want to use the Development Center
    must have the Application Development Client installed, even if you are developing
    from a Windows or Linux Client.


    In addition to the store procedures, UDF and triggers, you also can use the Development
    Center to develop an OLEDB application.'
  merge: -1
