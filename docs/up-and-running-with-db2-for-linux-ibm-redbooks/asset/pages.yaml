    # 6.2 Log files for troubleshooting


    In DB2 UDB Version 8, the former diagnostic log file, db2diag.log, which contains
    most information for troubleshooting is separated into two files. The first one
    is the DB2 Administration Notification Log (also known as DB2 Notify Log) which
    is intended for database and system administrators use and the content is easy
    to understand. The second one is DB2 diagnostic log which is intended primarily
    for DB2 customer support staff or someone who is familiar with viewing diagnostic
    log file.


    The alert log is deprecated and not recommended to use in DB2 UDB Version 8. If
    you still want to use alert facility in DB2 UDB Version 8, you can enable it by
    setting DB2 registry variable DB2_ALERT_LOG to true.


    # 6.2.1 DB2 administration notification log


    The Notify Log contains user-friendly and national-language enabled messages that
    can help database administrators to obtain more information associated to specific
    issues, for example, information which is supplemental to an SQLCODE, information
    from Health Monitor for health indicators, information from task'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'executions, and specific information from the applications written by application
    developers. This information can be very beneficial to the database administrators
    for resolving database or system related problems quickly and easily.


    For the Linux platform, the notify log is a text file located in the directory
    specified by the database manager configuration parameter DIAGPATH. This also
    is the directory where db2diag.log resides. The name for notify log is <instance
    owner>.nfy. For example, /home/db2inst1/sqllib/db2dump/db2inst1.nfy, here the
    instance owner is db2inst1, and DIAGPATH is /home/db2inst1/sqllib/db2dump.


    The Database manager parameter NOTIFYLEVEL can be utilized to specify the type
    of administration notification messages that are written into the administration
    notification log.


    Valid values for this parameter are:


    +   0: No administration notification messages captured. (Not recommended.)

    +   1: Fatal or unrecoverable errors. Only fatal and unrecoverable errors are
    logged.

    +   2: Immediate action required. Conditions are logged that require immediate
    attention from the system administrator or the database administrator. This level
    will capture Health Monitor alarms.

    +   3: Important information, no immediate action required. Conditions are logged
    that are non-threatening and do not require immediate action but may indicate
    a non-optimal system. This level will capture Health Monitor alarms, Health Monitor
    warnings, and Health Monitor attentions.

    +   4: Informational messages. Messages written into notify log by setting a higher
    level include messages applicable to lower levels, for example, setting notify
    level to 3 will cause the administration notification log to include messages
    applicable to levels 1 and 2.


    Example 6-6 is part of the messages extracted from notify log when lock escalation
    happens. It tells you when the lock escalation occurs, which instance, database
    and partition it takes place, the process ID and thread ID associated with the
    lock escalation, the application ID, component and function of DB2 used when the
    problem happens. In addition, detailed information specific to this occurrence
    of lock escalation is also displayed.


