    # 2.2 Installation considerations and planning


    Now that you have verified that your system meets DB2''s basic requirements, it
    is time to prepare your system for DB2 installation. In this section we discuss
    the following topics:


    +   - Installation methods - db2setup versus db2_install versus response file

    +   - Storage planning

    +     - Linux filesystems versus raw devices

    +     - Raw device configuration

    +     - Filesystem configuration

    +     - DB2 log space

    +     - DB2 temporary table space

    +   - Network configuration for multiple-partitioned installation

    +     - Enabling rsh

    +     - Setting up NFS

    +   - User and group setup

    +     - User and group requirements

    +     - Creating users - single partition

    +     - Creating users - multiple partition

    +     - DAS user considerations for a multiple partition environment


    # 2.2.1 Installation methods


    There are four methods in which you can install DB2 on Linux: (1) the DB2 Setup
    wizard, (2) the db2_install utility, (3) using a response file, and (4) Linux
    RPM command. Each method has its own advantages and disadvantages. The preferred
    method often depends on your level of expertise and type of environment, but in
    general, if a graphical terminal is available, using DB2 Setup wizard is recommended.


    # DB2 Setup wizard


    The DB2 Setup wizard is a JAVA-based graphical tool that installs DB2. It lays
    down the DB2 filesets, the Java Developer Kit, and allows you to create a new
    DB2 instance, create new users and group or configure DB2 to existing users, configure
    communications, create the tools catalog database, and set up'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'notification. DB2 Setup also has an option that allows you to create a response
    file. This is the best method for less experienced users, as most of the configuration
    is performed for you.


    # db2_install


    The db2_install script installs all DB2 ESE packages on your Linux system using
    the RPM installation utility. This method is reliable and commonly used by expert
    users for installing DB2 on larger, more complex multiple-partition systems. Tasks
    such as userids/groups set up, instance creation, tools catalog database creation,
    and notification set up, need to be performed manually after the installation.


    Some people prefer this method because it bypasses the configuration performed
    by DB2 Setup and allows you to configure DB2 your preferred way in the first place.
    For example, it gives you more control over database management. By default, the
    DB2 Setup wizard creates the tools catalog database in the instance owner''s home
    directory if you choose not to put it in an existing database, and also allocates
    the home directory for storage of other databases. Particularly for larger, multiple-partition
    systems, we recommend that the databases be stored in a separate filesystem (for
    example, /database). Performing manual configuration allows you to allocate your
    preferred default database directory in the first place.


    A limitation to db2_install is that it only installs support for English. This
    means that help, messages, and tool interfaces are in English. The DB2 Setup wizard,
    on the other hand, can install support for one or more different languages. Other
    limitations are that the installation may take longer (considering the higher
    number of manual configuration tasks), it requires a higher level of skill, and
    it cannot create response files.


    # Response file install


    A response file can be created using the DB2 Setup wizard or by editing a sample
    response file. It allows you to install DB2 across multiple machines with consistent
    installation and configuration settings, and can also be used to set up a DB2
    cluster. A response file installation is fast, because it bypasses the graphical
    wizard and does the configuration for you. Another advantage of using a response
    file is that it creates a Database Administration Server (DAS) on each machine,
    while with db2_install the DAS must be created manually after installation. For
    more advanced users, we recommend that you create a response file by editing a
    sample response file, then use this file to install DB2. The sample response file
    does not only install DB2, but can also configure users, create instance, set
    up notification, create tools catalog, and configure a large number of DBM parameters.
    This is the quickest installation method if you already have all the information
    you need. Unlike the DB2 Setup wizard, the'
