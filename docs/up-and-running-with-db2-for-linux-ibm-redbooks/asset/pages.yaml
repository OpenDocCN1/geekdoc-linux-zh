    # 3.7.1 DB2 License Center


    The DB2 License Center is a graphical tool found within the Control Center that
    manages licensing. You can use this tool to view license information, add and
    remove license keys, specify user and enforcement policies, and specify the number
    of licensed processors. It can also generate usage statistics and display connection
    information for current users. To access the License Center, do the following:


    +   1. Log in as instance owner.

    +   2. From Control Center, select **License Center** from the **Tools** menu.

    +   3. Select which system and product on which you want to configure licensing.
    You may configure a local or remote system. Select **DB2 Enterprise Server Edition**
    from the Installed products menu.


