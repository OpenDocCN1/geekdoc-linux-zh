- pgno: 144
  md: '# 3.7.2 db2licm and db2licd


    The db2licm and db2licd utilities are command line tools that manage licensing.
    The db2licm command is used to view license information, add and remove license
    keys, specify user and enforcement policies, and specify the number of licensed
    processors. The db2licd utility displays connection information for current users.


    To view all of your licensing information, enter db2licm -l. For example, this
    is our output:


    ```

    db2inst1@db2lnx03:~/sqllib> db2licm -l

    Product Name                = "DB2 Enterprise Server"

    Edition                      = ""

    Product Password             = "DB2ESE"

    Version Information          = "8.1"

    Expiry Date                  = "Permanent"

    Registered User Policy       = "Enabled"

    Number Of Entitled Users     = "5"

    Enforcement Policy           = "Soft Stop"

    Number of processors         = "1"

    Number of licensed processors = "1"

    Annotation                   = ""

    Other information            = ""

    ```


    To view connection information for currently connected users, run db2licd:


    ```

    db2licd -q

    ```


    # Installing a license key


    To install a license key, you must add the db2ese.lic license file using the db2licm
    command. To add a DB2 license file:


    +   1. Login as instance owner.

    +   2. Enter the following command:

    +      /opt/IBM/db2/V8.1/adm/db2licm -a <filename>


    Where, filename is the full path name and filename for the DB2 ESE license file
    db2ese.lic. This license file is located in /db2/license in the root directory
    of your CD-ROM. For example, if the CD-ROM is mounted in the directory /cdrom,
    enter the following command:


    ```

    /opt/IBM/db2/V8.1/adm/db2licm -a /cdrom/db2/license/db2ese.lic

    ```


    If you are setting up a multi-partitioned database system, perform this task on
    each machine.


    On Linux, the DB2 license keys are located in /var/1um in a file called nodelock.'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'To remove a license file, use db21icm -r. For example: db21icm -r db2ese.


    # Setting up a Registered user policy


    Perform this task if your company purchased Registered user licenses.


    +   1. Log in as the instance owner.


    +   2. Enable the Registered users policy for DB2 ESE by entering the following
    command:


    ```

    db21icm -p db2ese registered

    ```


    +   3. Go to the /opt/IBM/db2/V8.1/misc directory.


    +   4. In this directory, create a text file called db2ese.reg. Using a text editor,
    add registered user entries to this file. For example:


    ```

    db2inst1

    user2

    user3

    ```


    +   5. Restart the db2licd process for the changes to take effect


    Run the following command to stop the license daemon:


    ```

    db21icd -end

    ```


    The license daemon will be restarted automatically during connection requests
    or license center updates, where db2licd is required.


    # Updating the number of licensed processors


    Use the db21icm -n command. For example, to change the number of licensed processors
    to 4, enter the following command:


    ```

    db21icm -n db2ese 4

    ```


    # Changing the enforcement policy


    The default enforcement policy is Soft Stop. This means that all connections to
    DB2 databases go through, even when the license policy is violated. When a violation
    occurs, a license violation message is written to db2diag.log. The Hard Stop enforcement
    policy does not permit any connections that violate the license policy. To change
    the enforcement policy from Soft Stop to Hard Stop, enter the following command:


    ```

    db21icm -e db2ese HARD

    ```


    Likewise, to change the enforcement policy from Hard Stop to Soft Stop, enter:


    ```

    db21icm -e db2ese SOFT

    ```'
