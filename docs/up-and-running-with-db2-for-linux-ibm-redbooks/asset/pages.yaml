- pgno: 300
  md: '![](img/d95c931f4f3da4a6bd0ee55148fefad7_300_0.png)


    Figure 8-5 Development Center main window


    The Development Center provides you with functions as well as procedures to create
    DB2 application objects with a wizard or manually. By right-clicking on an object,
    a selection of different actions is displayed. You may edit or run an existing
    object, create a new object or import an object from another project or file system.
    In the directory $INSTHOME/sqllib/samples you will find many samples that you
