    The Configuration option in the Heath Center allows you to set up notification
    for the instance, and modify health indicator settings. When you choose the Configure
    menu item, another submenu with three items is displayed, as shown in Figure 6-3.
    You can use Notifications to set up the notification for the Health Monitor, or
