  md: '# Application development


    It has become increasingly important for a database to effectively support a wide
    range of open standards and open source products for application development.
    DB2 UDB provides accessibility for many standard interfaces and comes with a full
    suite of development tools.


    This chapter discusses the following topics:


    +   - Application configuration

    +   - DB2 application objects

    +   - Programming languages

    +   - Application development tools'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# 8.1 Application configuration


    DB2 supports local and remote application development. The database always appears
    as a local database to the application. Figure 8-1 illustrates two different development
    configurations. The left side of the diagram represents a local development environment,
    in which the database and application reside on the same machine. On the right
    side there is a representation of a client-server development environment, in
    which the database and application are located on separate machines. No matter
    in which configuration, the database always appears as a local database to the
    application.


    ![](img/d95c931f4f3da4a6bd0ee55148fefad7_285_0.png)


    Figure 8-1 Development configuration


    One of the special DB2 UDB features is that multiple DB2 UDB versions can coexist
    in the same system. For example, you can run a DB2 Version 7.2 instance and DB2
    Version 8.1 instance on the same machine. Refer to Figure 8-2 for an example of
    this scenario. With DB2 Version 8, it is now possible to run not only multiple
    versions of DB2, but also different releases of DB2 on the same machine. For instance,
    it will be possible to run V8.1 FixPak 1 and V8.1 FixPak 2 in different instances
    at the same machine. Before Version 8, it was only possible to run one release
    and FixPak level within a version level, that is, DB2 Version 7.2 FixPak 4 and
    Version 7.2 FixPak 5 could not run on the same server.'
  merge: -1
  img_proc: true
- pgno: 286
  md: '# Linux server


    ![](img/d95c931f4f3da4a6bd0ee55148fefad7_286_0.png)


    Figure 8-2 One host with multiple database manager instance versions


    # 8.2 DB2 application objects


    DB2 UDB supports stored procedures (SP), user defined functions (UDFs) and triggers,
    all of which are used to develop applications. DB2 V8 also provides a graphical
    tool called the Development Center, which is a component of the Application Development
    Client. This tool is used to develop SPs and UDFs. See 8.4, “Application tools”
    on page 284 for more information about this tool.


    # 8.2.1 Triggers


    A trigger is a defined set of SQL statements stored as a DB2 object in a DB2 database.
    This set of SQL statements will be executed when a certain event occurs against
    a DB2 table. Types of events that may invoke triggers are Insert, Update, or Delete
    to a given DB2 table. Triggers may be set up to execute before, after, or instead
    of an insert, update, or delete event.


    +   - No cascade before: The defined action will be executed before the triggering
    action is performed.

    +   - After: All triggered actions will be applied when the triggering action
    is done'
  merge: -1
  img_proc: true
- pgno: 287
  md: "+   Instead of: The original action will be replaced by the action defined\
    \ in the trigger\n\nTriggers are defined by using the create trigger DDL statement.\n\
    \n> Note: The create trigger statement is explained in more detail in Chapter\
    \ 5, \"Statements\" in the \"SQL References\" (listed in \"Other publications\"\
    \ on page 303.\n\nThe following scenario is given in our sample database.\n\n\
    When updating either the salary column or bonus column in the table EMPLOYEE,\
    \ the trigger saves the old data in a history table for auditing requirements.\n\
    \n# Example 8-1 Trigger sample to store history data\n\n```\nconnect to sample;\n\
    \ncreate table employee_hist(\n    empno        char(6),\n    salary_old   decimal(9,2),\n\
    \    salary_new   decimal(9,2),\n    bonus_old    decimal(9,2),\n    bonus_new\
    \    decimal(9,2),\n    chg_date     timestamp);\n\ncreate trigger employee_audit\n\
    \ after update of salary, bonus on employee\n referencing OLD as old_row NEW as\
    \ new_row\n for each row mode db2sql\n insert into employee_hist\n   Values(old_row.empno,\n\
    \          old_row.salary,\n          new_row.salary,\n          old_row.bonus,\n\
    \          new_row.bonus,\n          current timestamp);\n```\n\nNow we modify\
    \ any salary amounts on the employee table to fire the trigger and populate the\
    \ employee_hist table. By selecting data from employee_hist, you can see how our\
    \ trigger works.\n\n# Example 8-2 Every updates force a insert in to employee_hist\n\
    \n```\ndb2 \"update employee set salary = 55000 where empno = '00070'\"\ndb2 \"\
    update employee set salary = 45000 where empno = '000110'\"\n```"
