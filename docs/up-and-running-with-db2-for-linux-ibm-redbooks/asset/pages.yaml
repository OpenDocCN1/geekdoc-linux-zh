- pgno: 268
  md: '# DB2 integrated tools and wizards


    This chapter discusses some DB2 integrated tools available for the Linux platform
    for administration and development purposes. DB2 UDB provides a multitude of tools
    that make it much easier and more efficient to install and administer your database
    system, to continuously manage increasing volumes of data, to handle the tremendous
    growth in the number of users, to deliver better performance and to support different
    kinds of applications, and so forth.


    Besides GUI tools, DB2 also provides many command line tools to assist you in
    administering the database system, such as you can use the DB2 Command Line Processor
    to execute DB2 administration commands and SQL statements, use db2mtrk to track
    DB2 memory usage by instance and database, as well as db2 agents, and use db2look
    to extract the needed DDL statements to reproduce the database objects.


    Some tools and wizards have been discussed in other chapters of this book, as
    shown in Table 7-1 on page 256. For information regarding these tools and wizards,
    refer to those chapters.'
  merge: -1
  img_proc: true
