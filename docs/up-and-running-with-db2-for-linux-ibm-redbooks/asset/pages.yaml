    \ rate statistics, as well as network statistics, and so forth. You can save the\
    \ output of the sar command into a designated file and retrieve information from\
    \ that file at a later time.\n\nThe general syntax to run the sar command is:\n\
    \n```\nsar [ options ] [ interval [ count ] ]\n```\n\nTable 6-3 gives some frequently\
    \ used command options for sar which are extracted from sar's man pages."
  merge: -1
  img_proc: true
- pgno: 265
  md: '# Table 6-3 Frequently used command options for sar


    | Options | Description |

    |---|---|

    | -A | This is equivalent to specifying -bdcqrRuvvWy -I SUM -I PROC -n FULL -U
    ALL. |

    | -b | Reports I/O and transfer rate statistics. |

    | -c | Reports process creation activity. |

    | -d | Reports activity for each block device. |

    | -e | Sets the ending time of the report. |

    | -f | Extracts records from filename (created by the -o filename flag). The default
    value of the filename parameter is the current daily data file, the /var/log/sa/sadd
    file. The -f option is exclusive of the -o option. |

    | -n | Reports network statistics. |

    | -o | Saves the readings in the file in binary form. |

    | -q | Reports queue length and load averages. |

    | -r | Reports memory and swap space utilization statistics. |

    | -s | Sets the starting time of the data, causing the sar command to extract
    records time-tagged at, or following, the time specified. |

    | -u | Reports CPU utilization. |

    | -U | Reports CPU utilization for a given processor. |

    | -v | Reports status of inode, file and other kernel tables. |

    | -w | Reports system switching activity. |

    | -x | Reports statistics for a given process. |


    Some samples of using sar command are provided below. In Example 6-12, at first,
    sar is started with "-A" command option and the output is saved in sartest.bin
    file. For testing purpose, you can generate some CPU load for sar to report; for
    example, loading data into DB2 database in a multiple partition environment. Then
    you can obtain the desired report from the saved file for different system activities.
    For example:


    ```

    sar -u -s 11:09:00 -f sartest.bin|more

    ```


    The above command can be used to get CPU utilization information since a specified
    starting time.


    ```

    sar -w -c -s 11:09:10 -e 11:09:25 -f sartest.bin|more

    ```'
