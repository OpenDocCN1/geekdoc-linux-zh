    # 8.4.3 Additional development tools


    In addition to the tools shipped out with DB2 there are many others available
    on the market. The DB2 Development Center also provides Development Add-Ins for
    the following Microsoft Products:


    +   - Visual C++

    +   - Visual Basic

    +   - Visual InterDev


    Here a list of development tools supported by DB2 on Linux:


    +   - Borland Kylix

    +     http://www.borland.com/kylix/index.html

    +   - IBM Visual Age for Java

    +     http://www-3.ibm.com/software/ad/vajava/

    +   - Net.Data

