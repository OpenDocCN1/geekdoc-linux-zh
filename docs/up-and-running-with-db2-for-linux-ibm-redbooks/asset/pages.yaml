    # 6.3.5 Other system monitoring tools


    There are also a multitude of Linux system monitoring tools available for monitoring
    Linux system resource usage, such as the ps command which is known to almost everybody
    is used to report processes status, pstree can be used to display a tree of processes,
    netstat for printing network related information, nfsstat for NFS specific statistics,
    and so forth. In addition, pgrep and pkill commands are very helpful when you
    want to look up or signal processes based on name and other attributes of processes.
    And if you like monitoring tools with graphical user interface, utilities like
    gnome-system-monitor and ksysguard also can be used. For more information, refer
    to Linux specific documentation.'
