  md: '# Tip: The meaning of ELEAF and NDEL:


    +   - **ELEAF: Number of pseudo empty index leaf pages (NUM_EMPTY_LEAFS)**

    +     A pseudo empty index leaf page is a page on which all the RIDs are marked
    as deleted, but have not been physically removed.

    +   - **NDEL: Number of pseudo deleted RIDs (NUMRIDS_DELETED)**

    +     A pseudo deleted RID is a RID that is marked for deletion. This statistic
    reports pseudo deleted RIDs on leaf pages that are not pseudo empty. It does not
    include RIDs marked as deleted on leaf pages where all the RIDs are marked deleted.


    ```

    db2inst1@UDBLNX08:~/test> db2 "reorg indexes all for table emp allow write access
    cleanup only all on all dbpartitionnums"

    DB20001 The REORG command completed successfully.

    db2inst1@UDBLNX08:~/test> db2 "reorgchk update statistics on table db2inst1.emp"

