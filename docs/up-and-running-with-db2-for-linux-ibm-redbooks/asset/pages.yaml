    # 6.2.2 DB2 diagnostic log (db2diag.log)


    Besides the notify log, you can also use the DB2 diagnostic log to help identify
    the cause of a problem that you are having with your Linux-based system. Once
    the data is collected, it can be examined by someone who is familiar with the
    problem, or provided to DB2 Customer Support staff for analysis, because sometimes
    this log file is not intuitive to understand — it may contain dumps or cryptic
    messages.


    The file db2diag.log is located under the directory which is specified by the
    database manager configuration parameter DIAGPATH. Another instance level parameter
    DIAGLEVEL is used to specify which type of diagnostic errors will be recorded
    in the db2diag.log. The following are valid values:


    +   0: No diagnostic data captured

    +   1: Severe errors only

    +   2: All errors

    +   3: All errors and warnings

    +   4: All errors, warnings and informational messages


    You may want to increase the value of this parameter to gather additional problem
    determination data to help resolve a problem. The default value of DIAGLEVEL is
    3. If you changed it to 4 for some reason, please remember to change it back to
    3 or a lower value once the problem is resolved or the required information has
    been captured, because keeping DIAGLEVEL on a level of 4 will impact the system
    performance to a certain extent and the file system can fill up quickly.


    The following log messages (Example 6-7) are extracted from db2diag.log. They
    are written into the log file when running the DB2 CLP command as below:


