  md: '![](img/d95c931f4f3da4a6bd0ee55148fefad7_121_0.png)


    Figure 3-16 Configuration overview


    Since the default values are set for machines with relatively small memory and
    disk storage, you may need to modify them to fit your environment. A good starting
    point for tuning your configuration is the Performance Configuration wizard or
    the AUTOCONFIGURE command.


    # 3.5.1 DBM configuration


    The database manager configuration parameters are stored in a file named db2systm
    in $INSTHOME/sqllib/. To modify these parameters, use the graphical interface,
    Control Center or use DB2 command line interface.


    # Important DBM cfg parameters


    Here are the important DBM cfg parameters:


    +   - dftdbpath


    By default it is set to $INSTHOME. We recommend that you set it to your desired
    path. In a partitioned environment usually $INSTHOME is on a NFS file system,
    but DB2 does not support NFS for the database path.'
