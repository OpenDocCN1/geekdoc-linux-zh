    # 2.2.3 Network configuration for a multiple partitioned installation


    If you have a configuration that uses more than one machine for a single database
    instance, you must configure communications before installing DB2. In this section,
    we discuss how to set up rsh and NFS.


    # Enabling rsh


    To run DB2 ESE successfully, the rsh server has to be available on all machines
    in the partitioned database system. This server spawns a shell on the remote host
    and allows the user to execute commands. The rsh service is managed by inetd.
    Prior to enabling rsh, please ensure the rsh server rpm is installed, because
    many distributions do not install it by default.


    # Enabling rsh on SuSE


    To enable the rsh server and other related services on SuSE, perform the following
    steps:


    +   1. Log on as root and manually edit the /etc/inetd.conf file. Remove # at
    the beginning of the line to enable a service, and disable what services you do
    not need by commenting them out (by adding a # at the beginning of the line).
    Only uncommented services are available. Example 2-8 provides an excerpt of the
    /etc/inetd.conf file on SuSE v8. In this example, we have enabled the in.ftpd,
    in.telnetd, in.rshd, and in.rlogind services, which enables ftp, telnet, rsh,
    and rlogin on your machine.


    _Example 2-8  /etc/inetd.conf file_


    ```

    # /etc/inetd.conf

    # These are standard services.

    #

    ftp stream tcp nowait root /usr/sbin/tcpd in.ftpd

    # ftp stream tcp nowait root /usr/sbin/tcpd vsftpd

    #

    # If you want telnetd not to "keep-alives" (e.g. if it

    # runs over a ISDN uplink), add "-n". See ''man telnetd'' for more details.

    telnet stream tcp nowait root /usr/sbin/tcpd in.telnetd

    ```'
