  md: '# Get NFS service running


    To verify that Network File System (NFS) is running on each computer that will
    participate in your partitioned database system, enter the following command:


    ```

    showmount -e hostname

    ```


    If you enter showmount without specifying a hostname, it will check the local
    system.


    If NFS is not running, you will receive a message similar to the following:


    ```

    showmount: ServerA: RPC: Program not registered

    ```


    Once you have verified that NFS is running on each system, check for the rpc.statd
    process using the ps -ef | grep rpc.statd command. The rpc.statd process is required
    by DB2.


    If NFS is not running:


    +   Make sure you have the nfs-utils or nfs-server rpm package installed on each
    machine.


    +   Start the server manually by running the following command as root:

    +   [root@udblnx02 /root]# /etc/init.d/nfs restart

    +   (For Red Hat, it is "nfs"; for SuSE, it is "nfserver")


    +   You may check the status of NFS by running the following command:

    +   [root@udblnx02 /root]# /etc/init.d/nfs status


    # Create and configure the DB2 home file system to NFS


    As mentioned earlier in 2.2.2, "Storage planning" on page 36, you need to create
    a DB2 instance home directory that is shared across all machines that will participate
    in your partitioned database system. In our example, we call this file system
    /db2home. NFS is used to share this file system.


    +   1. If you haven''t already done so, create the DB2 home file system (for example,
    /db2home) on the NFS server using utilities, such as fdisk (to create disk partition)
    and mkfs (to create file system on partition), or the YaST tool on SuSE.


    +   2. Locally mount the DB2 home file system using the following command:

    +   mount /db2home'
