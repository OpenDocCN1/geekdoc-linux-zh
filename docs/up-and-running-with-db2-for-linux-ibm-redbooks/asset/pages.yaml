  md: '> Note: Detailed information about creation of tablespaces, tables or indexes
    can be found in Chapter 5 of the "SQL References" (listed in "Other publications"
    on page 301.


    # 3.4 Add database partition


    You can use the add node command to add a logical database partition to a database
    which is already populated with data. The add node command has two options:


    +   - LIKE NODE option

    +   - WITHOUT TABLESPACES option


    The add node command creates the database directory structure in the database
    path (for example, /database/.) on the node where the new database partition has
    been created. Without using the ''like node''-parameter, temp table space definitions
    are retrieved from the catalog node.


    If you add a partition on a different host, install DB2 base code either by using
    db2_install or db2setup and the response file utility. Verify that rsh, rlogin,
    db2_all and so on, work fine. See 3.2.2, "Multiple partitioned specific configuration"
    on page 82. Create on the new system the File Systems and directory structure
    to hold all database files. This is explained in "Generate directory structure"
    on page 93.


    Check /etc/services that sufficient ports are reserved for the DB2 instance on
    the target host. On a node, you should reserve one port per logical partition.


    # Example 3-22 /etc/services with for ports reserved for db2inst1


    ```

    DB2_db2inst1      60000/tcp

    DB2_db2inst1_1    60001/tcp

    DB2_db2inst1_2    60002/tcp

    DB2_db2inst1_END  60003/tcp

    ```


    Create a file system structure like the existing partition and set the right permissions.


    Shutdown your DB2 instance (db2stop) so that you can modify db2nodes.cfg file.
    Add a new partition in $INSTHOME/sqllib/db2nodes.cfg.


    # Example 3-23 db2nodes.cfg file


    ```

    0 udb1nx02 0

    1 udb1nx02 1

    ```'
