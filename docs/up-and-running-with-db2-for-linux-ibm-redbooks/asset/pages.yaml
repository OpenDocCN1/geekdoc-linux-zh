- pgno: 12
  md: 'Rav Ahuja is the worldwide Product Manager for DB2 on Linux at the IBM Toronto
    Lab. He has been working with databases for over ten years and with DB2 on distributed
    platforms since Version 1.0. Having spent several years in the DB2 support team
    working with customers around the globe, Rav has gained expertise in database
    connectivity, application development, and Web access issues. He has contributed
    towards several DB2 techniques and the DB2 UDB Certification Guide. Rav is an
    IBM Certified DB2 Database Administrator and Application Developer.


    Louisa Ford is a Software Engineer within DB2 User-Centered Design at the IBM
    Toronto Laboratory. She holds a degree in Industrial Engineering from the University
    of Toronto, with a specialization in human factors engineering. Before joining
    IBM, she was an Interface Designer and User-Centered Researcher working for Motorola.
    Her areas of expertise at IBM include usability of DB2 installation, packaging,
    and application development.


    Paul Jud is a Advisory IT Specialist within IBM Global Services, Switzerland.
    He has over 16 years of experience working in the IT industry particularly in
    databases and data warehouses. For 11 years his primary focus was operation, optimization,
    and maintenance of large DB2 databases in the mainframe area. For the last five
    years he was primarily dedicated to DB2 UDB in a distributed environment. His
    areas of expertise include installation, administration, monitoring, and tuning
    of DB2 UDB EE and EEE, as well as Data Joiner and Data Replication. He is also
    an IBM Certified Database Administrator.


    Kang Yong Ying is an Advisory IT Specialist from the Technical Support Center,
    IBM China. He has more than eight years of experience in database software for
    distributed platforms. He is also an IBM Certified Advanced Technical Expert —
    DB2 for Clusters. His areas of expertise include DB2 UDB administration and troubleshooting,
    as well as Business Intelligence solution implementation.


