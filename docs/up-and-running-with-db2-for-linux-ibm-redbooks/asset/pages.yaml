- pgno: 122
  md: '# dft_mons switches


    Set all monitor switches to ON to let DB2 gather statistics data. Use the get
    snapshot command to show details about the behavior of DB2.


    # diaglevel


    For trouble determination, set to 4. DB2 will write all errors, warnings and informational
    messages to the db2diag.log in $INSTHOME/sqllib/db2dump/. The default is 3.


    # mon_heap_sz


    The memory required for maintaining the private views of the database system monitor
    data is allocated from the monitor heap. Its size is controlled by the mon_heap_sz
    configuration parameter. The amount of memory required for monitoring activity
    varies widely depending on the number of monitoring applications and event monitors,
    the switches set, and the level of database activity.


    # query_heap_sz


    The initial default value is mostly sufficient. As a minimum, you should set query_heap_sz
    to a value at least five times larger than aslheapsz. This will allow for queries
    larger than aslheapsz and provide additional memory.


    # sheapthres


    For private sorts, this parameter is an instance-wide soft limit on the total
    amount of memory that can be consumed by private sorts at any given time.

    For shared sorts, this parameter is a database-wide hard limit on the total amount
    of memory consumed by shared sorts at any given time. By reaching this limit,
    no more shared sorts are allowed.


    # num_poolagents


    For a Decision Support System (DSS) environment with which few applications connect
    concurrently, set this value small. For Online Transaction Processing (OLTP) with
    many concurrent connected applications, set it larger to prevent extra creation
    of db2agents, which are time costs.


    # maxagents


    Number of maximum available db2agent processes. Use the get snapshot for dbm command
    and look at the value Agents stolen from another application. If greater then
    zero then increase maxagents.


    # intra_parallel


    For an OLTP environment set this value to NO, due to the fact that transaction
    throughput is more important than parallel work. OLTP queries read, update, or
    insert only one or a few rows and therefore it doesn''t make sense to split this
    work over more processes.'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'In a DSS environemont, typically most of all queries join many tables at once.
    We recommend that you set this value to YES, so DB2 can split the work over many
    processes.


    # max_querydegree


    Because parallelism in an OLTP system is not desirable, set it to 1.

    For DSS, set it to the number of CPUs of the database server to prevent users
    from setting an incorrect degree in their program, which can slowdown DB2 activities.
    Please note that in static package, if the query degree is set at the bind time,
    the max_querydegree is overridden by the query degree setting.


    > Note: For a complete and detailed description of all the DBM parameters, refer
    to Chapter 13 "Configuring DB2" in IBM DB2 UDB Administration Guide: Performance
    V8, SC09-4821.


