- pgno: 156
  md: '# Example 4-7 Migrating the database


    ```

    db2inst1@udblnx02:"/sqllib/db2dump> db2 migrate database itsodb

    SQL1103W  The Migrate Database command processing was successful.

    ```


    # 7. Update statistics.


    DB2 Version 8 has some statistics that are modified or do not exist in previous
    versions of DB2. To take advantage of these statistics, you may want to run the
    runstats command on tables, particularly those tables that are critical to the
    performance of your SQL queries. The runstats command updates statistics about
    physical characteristics of a table and associated indexes. The optimizer uses
    these statistics to find the best access path to data.


    # 8. Rebind packages.


    Any packages stored in a database are invalidated during migration, but then rebuilt
    after migration when the V8 database manager uses them for the first time. After
    migration, run the db2rbind command to rebind these packages.


    # 9. Migrate DB2 Explain tables.


    The migrate database command does not migrate explain tables. Perform this task
    if you want to keep explain table information that you previously gathered. If
    you don’t want to keep this information, you can later recreate the explain tables
    and gather new information. To migrate explain tables, use the db2exmigr command,
    as follows:


    ```

    db2exmigr -d <database_name> -e <explain_schema> [-u userid password]

    ```


    Where, database_name is the name of the database where the explain tables are
    stored, explain_schema represents the schema name of the explain tables to be
    migrated, and userid and password are the current user’s ID and password. The
    userid and password parameters are optional.


    The db2exmigr command does the following:


    +   - Renames the V6/V7 explain tables.

    +   - Creates a new set of explain tables using EXPLAIN.DDL. This EXPLAIN.DDL
    is under $INSTHOME/sqllib/misc directory.

    +   - Copies the contents of the old tables to the new tables.

    +   - Drops old explain tables.


    # 10. Compare DBM and DB configuration settings, and tablespace and package records
    from before and after migration to verify that the migration was successful.'
  merge: -1
