  md: 'On the TSM server, Tivoli needs certain storage pools to store archived log
    files and the database backup copy. By default, an archive storage pool (ARCHIVEPOOL)
    is used for storing DB2 archive logs sent by the USEREXIT program and a backup
    storage pool (BACKUPPOOL) is used to store all DB2 backup files (Figure 5-5).


