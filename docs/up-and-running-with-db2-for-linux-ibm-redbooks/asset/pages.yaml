    # 5.3 Data movement via EXPORT, IMPORT, and LOAD


    In this section, we discuss DB2''s data movement using the EXPORT, IMPORT and
    LOAD utilities. We can use EXPORT to export data from database tables into files
    with different file formats, and also use IMPORT to write data into database tables
    from a source data file. Furthermore, when large volumes of data need to be moved
    into the database tables, the LOAD utility can also be used for better performance.
    In addition, we describe the basic usage and considerations when using the LOAD
    utility under a multiple database partition environment. If you are dealing with
    a lot of tables, the db2move utility can be helpful for such a situation.


    # 5.3.1 Export data to files from database tables


    The DB2 UDB export utility can be used to write data from a DB2 database to one
    or more files stored outside of the database. The exported data can then be imported
    or loaded into another DB2 database using the DB2 import or the DB2 load utility,
    respectively. Or it can be imported into another application, for example, a spreadsheet.
    The user specifies the data to be exported by supplying an SQL SELECT statement
    or by providing hierarchical information for typed tables.


    Before invoking EXPORT, you need to establish a connection to the database, explicitly
    or implicitly. You can invoke the EXPORT utility through the DB2 Command Line
    Processor (CLP) or DB2 Control Center (CC), or via an Application Programming
    Interface (API). Example 5-26 is a sample to export data from a table named EMP
    which is spread across three partitions by using the DB2 CLP.


    Example 5-26 Export all data from sample table "EMP"


    ```

    db2inst1@UDBLNX08:"/itso/datmov> db2 "export to emp.ixf of ixf select * from emp"

    SQL3104N  The Export utility is beginning to export data to file "emp.ixf".

    SQL3105N  The Export utility has finished exporting "100000" rows.

    ```'
