    # Temp space


    DB2 uses system temporary tablespaces for many SQL operations, such as JOIN and
    SORT. DB2’s temporary tablespace, TEMPSPACE1, is one of the three default tablespaces
    (SYSCATSPACE, TEMPSPACE1, and USERSPACE1) that gets created during database creation.
    By default, TEMPSPACE1 gets placed in the database path. For larger systems, we
    recommend that your temporary tablespaces are located on a separate filesystem
    and disk. For example, in our system, we created the filesystem /db2temp with
    mount point /db2temp to store our temporary tablespaces.


    In a partitioned database environment, the catalog node should contain all three
    default table spaces, and the other database partitions should each contain only
    TEMPSPACE1 and USERSPACE1.


    Example 2-7 shows how to create a system temporary tablespace on multiple nodes
    in the /db2temp filesystem:


    # Example 2-7 Create temp tablespace in a different filesystem


    ```

    connect to db_name;


    create temporary tablespace TEMPSPACE01 in IBM TEMPGROUP

    managed by SYSTEM

    using (''/db2temp/$INSTANCE/db_name/n001tmp/tempspace01'') on dbpartitionnum (1)

    using (''/db2temp/$INSTANCE/db_name/n002tmp/tempspace01'') on dbpartitionnum (2)

    using (''/db2temp/$INSTANCE/db_name/n003tmp/tempspace01'') on dbpartitionnum (3)

    using (''/db2temp/$INSTANCE/db_name/n004tmp/tempspace01'') on dbpartitionnum (4)

    extentsize 32

