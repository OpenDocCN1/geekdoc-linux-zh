    # Change log path


    Our next step is to reallocate the DB2 log files to a separated file system. To
    show the current log path, type the command:


    ```

    db2 get db cfg for itsodb | grep Path

    ```


    This command affects only the partition against which you are attached. In our
    environment the initial log path is:


    ```

    Path to log files = /database/db2inst1/NODE0000/SQL00001/SQLLOGDIR/

    ```


    To change the log path on each partition issue the following command:


    ```

    db2_all ''db2 connect to itsodb;db2 update db cfg for itsodb using NEWLOGPATH
    /db2log/db2inst1/itsodb''

    ```


    This will change the log path on each node to:


    ```

    /db2log/db2inst1/itsodb/NODE000x

    ```'
