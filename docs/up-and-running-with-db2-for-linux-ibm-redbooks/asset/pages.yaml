- pgno: 271
  md: 'The following tools and wizards are discussed in this chapter:


    +   - **Design Advisor:** Also available in command line form via db2advis, it
    can be used to recommend suitable indexes for your tables according to the given
    workload or to verify if a virtual index may be helpful for the given workload.


    +   - **Visual Explain:** It can be used to obtain access plan for specified SQL
    statements in a graph and help you tune the SQL statements and your database manager
    configuration parameters to improve performance. Command line tools are also available
    to gain access plan information for SQL statements, such as db2expln (for static
    SQL), dynexpln (for dynamic SQL), and so on.


    +   - **Memory Visualizer:** Also available in command line form via db2mtrk (Memory
    Tracker), it can be used to monitor memory usage for DB2 instance.


    # 7.1 Design Advisor


    The Design Advisor can assist you in designing and defining suitable indexes for
    your tables according to the workload you have, or help you verify if a virtual
    index is appropriate for the database system. It is particularly beneficial for
    designing indexes for very large tables, as sometimes you cannot make sure if
    the index you want to create is really helpful for your application and you need
    to create it first to test if it works. But for tables with a large volume of
    data, creating an index usually takes long time and considerable disk space is
    also required; Moreover, sometimes you will find that the index you just created
    doesn''t help anything. In such a situation, the Design Advisor would be the best
    tool to help you, because the Design Advisor works depending on the virtual indexes
    with no need to create real indexes.


    There are two terms you need to understand before using the Design Advisor.


    +   - **Workload**

    +   A workload is a set of SQL statements with specified execution frequency which
    the database manager has to process during a given period of time. The SQL statements
    can include SELECT, INSERT, UPDATE, and DELETE statements. For example, during
    one month your database manager may have to process 1,000 INSERTs, 10,000 UPDATEs,
    10,000 SELECTs, and 1,000 DELETEs. The advising engine uses this workload information
    in conjunction with the database information, such as statistics to recommend
    indexes. The goal of the advising engine is to minimize the total workload cost.


    +   - **Virtual index**

    +   Virtual indexes are indexes that do not exist in the current database schema.
    These indexes may be either recommendations that the advise facility has'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'made, or indexes that you want the advise facility to evaluate. Virtual index
    information is defined and manipulated in the ADVISE_INDEX table.


    The Design Advisor is available in both graphical form and command line form.
    The GUI form that can be started from DB2 Control Center is the recommended method
    to use the Design Advisor as it provides extensive help pages that can answer
    your questions, and it can also help you to construct a workload by looking for
    recently executed SQL statements, or looking through the recently used packages,
    or let you add SQL statements manually.


    An example is provided below to demonstrate the usage of Design Advisor in graphical
    form. You can start it from DB2 Control Center as shown in Figure 7-2, or you
    can invoke it from the Wizard pop-up window after you choose Tools → Wizards in
    the Control Center.


    ![](img/d95c931f4f3da4a6bd0ee55148fefad7_272_0.png)


    The first window (Figure 7-3) for the Design Advisor is an introductory window.
    It tells you what the advisor is for and which database you are working against.
    You can click Next to define the workload.


