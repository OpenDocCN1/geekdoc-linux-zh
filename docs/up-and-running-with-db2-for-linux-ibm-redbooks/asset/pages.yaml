- pgno: 236
  md: '# Monitoring DB2


    This chapter discusses DB2’s monitoring features provided by Health Center and
    Health Monitor.


    DB2 Universal Database Version 8 adds self-managing and resource tuning (SMART)
    database technology that lets database administrators choose to configure, tune
    and manage their databases with enhanced automation. SMART database management
    means administrators spend less time managing routine tasks and more time focussing
    on tasks that help enterprises gain and maintain a sustainable competitive advantage.
    Several tools are added or redesigned to support self-managing, self-optimizing
    and self-tuning requirements, such as Configuration Advisor, Health Center, Performance
    Expert, Recovery Expert, and so forth. These new tools make DB2’s configuration
    and maintenance tasks more smart and easy-to-use, and finally results in significant
    reduction of human intervention and cost reduction for the database system operation
    and maintenance.


    This chapter gives an in-depth discussion of the Health Center and Health Monitor.
    Chapter 3, "Post installation tasks" on page 79 has detailed information regarding
    Configuration Advisor. For other DB2 monitoring tools, refer to their online help
    or specific documents for more information.


    In addition, this chapter also discusses DB2 UDB and operating system log files
    which may provide more detailed information about certain problems and can help
    you further determine what the problem is and what the cause is. Afterwards you
    can take corrective actions based on the collected information.'
  merge: -1
  img_proc: true
- pgno: 237
  md: Furthermore, some useful and popular tools from the operating system are also
    available to assist in monitoring the system resource usage and perform troubleshooting,
    and we also provide brief information about these tools.
  merge: -1
  img_proc: true
- pgno: 238
  md: '# 6.1 Health Monitor and Health Center


    With Version 8, DB2 introduces two new features to help you monitor the health
    of your DB2 systems: Health Monitor and Health Center. These tools add a management
    by exception capability to DB2 Universal Database by alerting you to potential
    system health issues. This enables you to address health issues before they become
    real problems that affect your system performance. Prior to using the Health Monitor
    and Health Center, you need to understand the concept of a health indicator which
    is briefed in the following paragraph.


    # 6.1.1 Health Indicator


    A health indicator is a measurement that gauges the healthiness of some aspect
    of an object. The health monitor uses these indicators to evaluate specific aspects
    of database manager or database performance.


    DB2 comes with default settings for all health indicators. Using the Health Center,
    DB2 commands, or APIs, you can customize the settings of the health indicators,
    and define who should be notified and what script or task should be run if an
    alert is issued. For example, you can customize the alarm and warning thresholds
    for the amount of space used in a table space. You can also use DB2 commands or
    APIs to retrieve health information from the Health Monitor, allowing you to integrate
    DB2 Health Monitoring with existing system-wide monitoring solutions.


    # 6.1.2 Health Monitor


    The Health Monitor is a server-side tool that constantly monitors the health of
    the instance and all active database objects when DB2 is started. The Health Monitor
    automatically evaluates a set of health indicators, even without user interaction.
    If the current value of a health indicator is outside the acceptable operating
    range defined by its warning and alarm thresholds, the health monitor generates
    a health alert.


    The Health Monitor gathers information about the health of the system using new
    interfaces that do not impose a performance penalty. It does not turn on any snapshot
    monitor switches to collect information. The Health Monitor is enabled by default
    when an instance is created; you can deactivate it using the database manager
    configuration parameter health_mon. If the Health Monitor finds that a defined
    threshold has been exceeded (for example, the available log space is not sufficient),
    or if it detects an abnormal state for an object (for example, an instance is
    down), the Health Monitor will raise an alert.'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'The Health Monitor, not only alerts DBAs via e-mail, pager, or PDA if a database
    system is likely to experience a fatal situation before it occurs (such as, running
    out of memory, or a table space is becoming full, and so on), and its autonomic
    capabilities can also take or recommend corrective actions. Therefore, it reduces
    reliance on the skill level of DBAs, and improves their productivity.


    # 6.1.3 Health Center


    The Health Center provides the graphical interface to the Health Monitor. You
    use it to configure the Health Monitor, to define the threshold values for desired
    health indicators and related activities when the threshold values are exceeded,
    for example, a notification to DBA, or a follow-up task will be executed. You
    can also use Health Center to view the rolled up alert state of your instances
    and database objects. Using the Health Monitor''s drill-down capability, you can
    access details about current alerts and obtain a list of recommended actions that
    describe how to resolve the alert.


    DB2 Version 8 also provides a new Web Health Center that can be used to access
    the Health Monitor information from a Web browser or PDA.


    # 6.1.4 Using Health Center and Health Monitor


    You can start the Health Center by selecting Health Center from the Tools menu
    within any DB2 GUI tools, where the Tools menu is available. You can also start
    the Health Center by clicking the health center status beacon when it appears
    on the status line of the DB2 Control Center window.


    The Health Monitor is activated by default, and if it is stopped for any reason,
    you can reactivate it by using Health Center or using DB2 CLP commands.


    When Health Monitor is stopped because the health_mon parameter in database manager
    configuration (DBM CFG) is OFF, the Start Health Monitor menu item will appear
    in the pop-up window, when you right-click on the instance name (Figure 6-1).
    Similarly, the Stop Health Monitor menu item will appear if health_mon is set
    to ON and the Health Monitor is started.'
  merge: -1
  img_proc: true
- pgno: 240
  md: '![](img/d95c931f4f3da4a6bd0ee55148fefad7_240_0.png)


    Figure 6-1 Start Health Monitor for instance using Health Center


    You can use the toggle buttons at the top of the navigation bar to filter the
    alerts according to their severity (Figure 6-2). The Health Center will launch
    the third toggle, display alarms, warnings, and attentions. If the Health Center
    is opened for the first time, you can choose Display all alerts to view the navigation
    tree with all catalogued LUW instances on the left pane of the window.


    ![](img/d95c931f4f3da4a6bd0ee55148fefad7_240_1.png)


    Figure 6-2 Using toggle buttons to filter the alerts


    You can also use DB2 CLP commands to activate the Health Monitor by updating the
    health_mon parameter for DBM and view the current setting of health_mon parameter
    as shown in Example 6-1.


    # Example 6-1 Check if Health Monitor is enabled for instance


    ```

    db2inst2@UDBLNX08:/db2home/db2inst2> db2 update dbm cfg using health_mon on

    DB20000I  The UPDATE DATABASE MANAGER CONFIGURATION command completed successfully.

    db2inst2@UDBLNX08:/db2home/db2inst2> db2 get dbm cfg |grep -i health

    Monitor health of instance and databases  (HEALTH_MON) = ON

    ```


    The health_mon parameter can be dynamically changed. The update to the health_mon
    takes effect immediately. Once the health_mon is turned on (the'
  merge: -1
  img_proc: true
