  md: '# 2.3 Installing DB2


    In this section, we will explain how to install DB2 using the DB2 Setup, db2_install,
    and response file installation methods. The following topics will be covered:


    +   - DB2 Setup — single and multiple-partition installation

    +   - db2_install utility

    +   - Adding a partitioned system

    +   - Installing on NIS


    # 2.3.1 DB2 Setup


    There are two ways in which to use DB2 Setup: (1) install a single partition database
    system using either the DB2 Setup wizard or a response file, or (2) install a
    partitioned database system using a response file. Both methods are discussed
    in this section.


    # Single partition installation


    If you want to install DB2 on a single machine, single partition, use DB2 Setup
    in the following way:


    +   1. Logon as root.

    +   2. Mount the CD-ROM by entering the following command:

    +   ```

    +   mount /mnt/cdrom or mount /cdrom

    +   ```

    +   If your Linux distribution disables execute privileges on CD-ROM devices by
    default, issue the following command as root to mount with execute permission:

    +   ```

    +   mount -o exec /mnt/cdrom

    +   ```

    +   If your CD-ROM was not automatically mounted, enter:

    +   ```

    +   mount -t iso9660 -o ro /dev/cdrom /mnt/cdrom

    +   ```

    +   Where, /mnt/cdrom represents the mount point of the CD-ROM.

    +   3. As root, run db2setup, and select Install Products on the first window.

    +   4. Select DB2 UDB Enterprise Server Edition and click Next.

    +   5. Click Next again. On License Agreement window, read the license agreement
    and then select Accept.

    +   6. Select the installation type (Figure 2-1). You may choose a Typical, Compact,
    or Custom installation.'
