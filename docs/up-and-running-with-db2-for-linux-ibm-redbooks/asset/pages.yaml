- pgno: 60
  md: 'In /etc/fstab, you should see an entry for /db2home. In our setup, the entry
    is:


    ```

    /dev/hda7 /db2home ext3 defaults 1 2

    ```


    4. Next, add an entry to the /etc/exports file to automatically export the NFS
    file system at boot time. You only need to set up this file on your NFS servers.


    The /etc/exports file follows this format:


    ```

    /directory_to_export machine1_name(permissions) machine2_name(permissions) machinen_name(permissions)

    ```


    For example, in our /etc/exports file, we have:


    ```

    /db2home/ *(rw,no_root_squash,sync)

    ```


    ```

    /software/ *(rw,no_root_squash,sync)

    ```


    We also wanted to share our /software file system, because this is where the DB2
    install image and response files are stored.


    In the permissions section, you can specify user ID mappings. By default, permissions
    are set to rw and root_squash. The root_squash setting means that the root user
    on a client is not treated as root when accessing files on the NFS server. Although
    this mode of operation is typically desirable in a production environment, you
    need to turn it off in order to create users on each of the remaining machines
    in the cluster. To do this, specify no_root_squash in the permissions section.


    5. Export the NFS directory by running:


    ```

    /usr/sbin/exportfs -a

    ```


    This initializes a file named /var/lib/nfs/xtab and exports all directories to
    this file.


    > Note: If you make an update to /etc/exports, run exportfs -r to re-export all
    directories. It synchronizes /var/lib/nfs/xtab with /etc/exports and removes entries
    in /var/lib/nfs/xtab which are deleted from /etc/exports.


    6. On each of the remaining machines in the cluster, first make a directory /db2home
    using the mkdir command, then add an entry to the /etc/fstab file to NFS mount
    the file system automatically at boot time. We recommend that you configure the
    file system to be mounted at boot time, is read-write, is mounted hard, includes
    the background (bg) option, and that setuid programs can be run properly. Refer
    to the following example:'
  merge: -1
  img_proc: true
- pgno: 61
  md: '7. After adding an entry to the /etc/fstab file on each machine, NFS mount
    the exported file system on each of the remaining machines in the cluster by entering
    the following command:


    ```

    mount udb1nx05:/db2home /db2home

    ```


    If the mount command fails, make sure the NFS server is started. To re-start the
    NFS server, run the following command as root on the NFS Server workstation:


    On SuSE:


    ```

    /etc/init.d/nfserver restart

    ```


    On Red Hat:


    ```

    ./etc/init.d/nfs restart

    ```


    You may also use the showmount command to check the status of the NFS server.
    For example:


    ```

    showmount -e udb1nx05

    ```


    # Tips:


    +   - It is considered good convention to place all the directories you want to
    export in the /export hierarchy. If you need the directory to also exist elsewhere
    in the directory tree, use symbolic links. For example, if your server is exporting
    its /usr/local hierarchy, you should place the directory in /export, thereby creating
    /export/usr/local. Because the server itself will need access to the /export/usr/local
    directory, you should create a symbolic link from /usr/local that points to the
    real location, /export/usr/local.

    +   - If you have an error in your /etc/exports file, it is reported in when NFS
    starts up in syslog. You might find this debugging tool very useful.


