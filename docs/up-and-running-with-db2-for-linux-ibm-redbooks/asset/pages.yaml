- pgno: 162
  md: '# 5.1 DB2 database backup and recovery


    A database can become unusable or corrupted in certain situations, such as hardware
    failure, power interruption or application mistakes. To protect your database
    from losing any of your data it is important to have a good recovery strategy.
    This includes backups of the entire database as well as saving the recovery log
    files. DB2 distinguishes between two types of databases, non-recoverable and recoverable.
    Non-recoverable means that DB2 can only restore the entire database to the point
    in time where the backup was taken. For a recoverable database, DB2 can restore
    the entire database or a part of the database to the point in time where the interrupt
    occurred (to end of log) or to a specific point in time.


    DB2 logs every transaction, unless told not to. Load is a DB2 tool, and when using
    that tool to load data, DB2 will not log the transaction. The log files are used
    to recover the database. DB2 has two types of logging mechanisms:


    +   Circular logging


    Circular logging is the default logging method for a newly created database. The
    database is a non-recoverable database when circular logging is used. In circular
    logging, a set of log files is used in round-robin fashion. Only active logs exist
    in the log-path which are used by crash recovery. Crash recovery is the process
    where all uncommitted changes are rolled back to a consistent state of the data.
    After a full offline database backup, all changes in the log files will be set
    as invalid. New changes after backup will be written to the active logs.


    +   Archive logging


    By using archive logging, the database is considered as a recoverable database.
    Active logs will be retained as archive logs after taking a full offline database
    backup. To enable archive logging, set the LOGRETAIN parameter in the database
    configuration. This allows you to recover your database or any table spaces to
    end of log or any point in time. For crash recovery, DB2 only uses the active
    logs. To prevent a filesystem full condition, enable USEREXIT so that DB2 will
    automatically save the archived logs to either TSM or another filesystem after
    filling an active log and releasing the space in the log path.


    Since Version 7.2, DB2 has provided you with the capability to mirror the active
    log files to prevent log data loss in case of a disk crash. We recommend that
    you place the secondary log path on a physically separate disk. In DB2 UDB Version
    8, the mirror log path is enabled by updating the database configuration, as shown
    below.


    ```

    db2 update db cfg for <db_alias> using MIRRORLOGPATH <log path>

    ```'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'Another high availability feature is to set the configuration parameter for
    transaction log blocking. In case of a log full condition, DB2 cannot allocate
    more logs in the log path. Read only access is possible.


    ```

    db2 update db cfg for <db_alias> using BLK_LOG_DSK_FUL YES

    ```


    DB2 provides the following backup mechanisms.


    # Offline backup


    During an offline backup, applications cannot connect to the database. This is
    the default backup method when you do not specify any parameter in the backup
    command. After an offline backup, you have a consistent image copy of the entire
    database.


    # Online backup


    An online backup allows applications to connect to the database and read and write
    to tables during database backup. Log retain or userexit must be enabled for an
    online backup. This type of backup can backup the entire database or only one
    or more tablespaces.


    # Full backup


    A full backup is an image copy of the entire database (Figure 5-1). In a partitioned
    environment, each database partition backup is written in a separate output file.


    ![](img/d95c931f4f3da4a6bd0ee55148fefad7_163_0.png)


    Figure 5-1 Full backup


    # Incremental backup


    An incremental backup takes an image copy of changed data since the most recent
    successful full backup. This is a cumulative backup as shown in Figure 5-2. The
    TRACKMOD parameter (Track modified pages) in the database configuration must be
    set to ON.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '![](img/d95c931f4f3da4a6bd0ee55148fefad7_164_0.png)


    Figure 5-2 Incremental backup


    # Delta backup


    A delta backup is basically an incremental backup. It creates a copy of all data
    pages that have changed since the last successful backup of any types. This is
    also known as a non-cumulative backup (Figure 5-3).


    ![](img/d95c931f4f3da4a6bd0ee55148fefad7_164_1.png)


    Figure 5-3 Incremental delta backup


    The backup strategy depends on your environment. Database workload, availability,
    and recovery level are all decision factors. A good backup strategy may be a daily
    offline backup if the database does not have a 24x7 availability requirement.
    Another strategy can be to do an offline backup every weekend and an incremental
    backup during the week.


    # 5.1.1 Enable roll forward and log archiving


    To use all functionality available in DB2 to prevent data loss, we will enable
    both roll forward recovery and log archive files. This allows us to recover the
    database to the point in time of failure. The following example walks you through
    this task in a multi-partitioned database environment.


    DB2 provides sample user exit programs to archive DB2 logs either to disk, Tivoli
    Storage Management (TSM) server or to Tape. In our example we show you how to
    archive DB2 logs to disk and TSM storage. Our first task is to create the file
    system and directory that will hold the archived log files.


    Use fdsik or any preferred tool to create the file system /db2archive and mount
    it on each host.'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'Create directory /db2archive/db2inst1 and set read/write permissions for the
    instance owner user ID, so that DB2 can access the directory.


    ```

    chown db2inst1:db2grp1 /db2archive/db2inst1

    ```


    Generate the directory structure for each partition in which to hold the archived
    logs:


    ```

    db2_all ''mkdir /db2archive/db2inst1/ITSODB''

    ```


    ```

    db2_all ''typeset -Z4 DB2NODE;mkdir /db2archive/db2inst1/ITSODB/''NODE$DB2NODE''

    ```


    Copy from $INSTHOME/sqllib/samples/c the sample userexit db2uext2.cdisk to any
    work directory and rename it to db2uext2.c. Modify the definition variables to
    fit your environment. Refer to Example 5-1.


    # Example 5-1 USEREXIT definition to archive log to disk


    ```

    #define ARCHIVE_PATH "/db2archive/db2inst1/" /* path must end with a slash */

    #define RETRIEVE_PATH "/db2archive/db2inst1/" /* path must end with a slash */

    #define AUDIT_ACTIVE 1 /* enable audit trail logging */

    #define ERROR_ACTIVE 1 /* enable error trail logging */

    #define AUDIT_ERROR_PATH "/db2home/db2inst1/" /* path must end with a slash */

    #define AUDIT_ERROR_ATTR "a" /* append to text file */

    #define BUFFER_SIZE 32 /* # of 4K pages for output buffer */

    ```


    If the variable ARCHIVE_PATH is set to /db2archive/db2inst1/ then userexit archives
    the log files to /db2archive/db2inst1/ITSODB/NODE000x/.


    The variable RETRIEVE_PATH points to a filesystem where the userexit has to place
    the retrieved archive logs in case of a log apply is performed.


    To archive logs to TSM storage, copy the sample userexit db2uext2.ctsm from $INSTHOME/sqllib/samples/c
    to any work directory and rename it to db2uext2.c. Modify AUDIT_ERROR_PATH variable
    to set the error message file; see Example 5-2.


    # Example 5-2 USEREXIT definition to archive log to TSM


    ```

    #define BUFFER_SIZE 32768 /* transmit or receive the log */

    #define AUDIT_ACTIVE 1 /* enable audit trail logging */

    #define ERROR_ACTIVE 1 /* enable error trail logging */

    #define AUDIT_ERROR_PATH "/db2home/db2inst1/uexttsm/" /* path must end with */

    #define AUDIT_ERROR_ATTR "a" /* append to text file */

    #define DSMI_DIR NULL /* use value from the environment */

    #define DSMI_CONFIG NULL /* use value from the environment */

    #define DSMI_LOG NULL /* use value from the environment */

    #define MGMT_CLASS NULL /* use default management class */

    ```'
  merge: -1
  img_proc: true
- pgno: 166
  md: '> Note: The subdirectory /db2archive/db2inst1/ITSODB/NODE000x must exist before
