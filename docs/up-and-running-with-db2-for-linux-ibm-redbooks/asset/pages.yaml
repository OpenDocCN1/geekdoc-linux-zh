    Alternatively if you start new database partition with following command, DB2
    will update the db2nodes.cfg automatically after the next stop of the instance.


    ```

    db2start dbpartitionnum 2 add dbpartitionnum hostname udb1nx02 port 2 without
    tablespaces

    ```


    To create the directory structure used by DB2 we have to issue the add node command
    if it hasn''t already been done by starting the database manager. Issue the following
    commands shown in Example 3-24.


    # Example 3-24 Add dbpartition utility command


    ```

    db2inst1@udb1nx02:~/sqllib> export DB2NODE=2

    db2inst1@udb1nx02:~/sqllib> db2 terminate

    db2inst1@udb1nx02:~/sqllib> db2 add dbpartitionnum without tablespaces

    ```


    ```

    DB20000I The ADD NODE command completed successfully.

    udb1nx02: db2 add dbpartitionnum without tablespaces completed ok

    ```


    DB2 has now created the directory structure in /database, but with the keyword
    without tablespaces, the existing tablespace in partitions 0 and 1 has not been
    created in the new partition. The database partition nodegroup for IBMTEMPGROUP
    is expanded with the new database partition 2 and we have to add a tablespace
    container for TEMPSPACE01 on the new partition.


    Now we have to start the remaining partition by entering db2start and establishing
    a connection with the command db2 connect to itsodb.


    # Example 3-25 Add tablespace container for temp space


    ```

    db2inst1@udb1nx02:~> db2 "alter tablespace tempspace01 add (''/db2temp/db2inst1/itsodb/NODE0002/tempspace01'')
    on dbpartitionnum (2)"

    ```


    ```

    DB20000I The SQL command completed successfully.

    ```


    All database partition groups that will benefit from the new partition have to
    be altered, so that the new partition can be used. Example 3-26 shows the statement
    for MPL_01 in our database ITSODB.


    # Example 3-26 Alter database partition group MPL_01'
