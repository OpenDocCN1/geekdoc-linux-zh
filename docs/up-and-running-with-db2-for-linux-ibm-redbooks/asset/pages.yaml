    # Examples for ALLOW READ ACCESS when loading


    The ALLOW READ ACCESS option is very useful when loading large amounts of data
    because it gives users access to table data at almost all times, even when the
    load operation is in progress or after a load operation has failed. The behavior
    of a load operation in ALLOW READ ACCESS mode is independent of the isolation
    level of the application. That is, readers with any isolation level can always
    read the pre-existing data, but they will not be able to read the newly loaded
    data until the load operation has finished.


    Read access is provided throughout the load operation except at the very end.
    Before data is committed the load utility acquires an exclusive lock (Z-lock)
    on the table. The load utility will wait until all applications that have locks
    on the table, release them. This may cause a delay before the data can be committed.
    The LOCK WITH FORCE option may be used to force off conflicting applications,
    and allow the load operation to proceed without having to wait.


    In Example 5-35, first we create a table named LOADREAD then insert three rows
    as the pre-existing data, then we will use ALLOW READ ACCESS to load additional
    rows from a source file in DEL format, and when the load is taking place, we will
    try to access the table from another session.


    > Example 5-35 Load data with ALLOW READ ACCESS


    ```

    db2inst1@DBLNX08:"/its0> db2 "create table loadread(col1 int not null primary
    key, col2 char(10))"

    DB20000I The SQL command completed successfully.

    db2inst1@DBLNX08:"/its0> db2 "insert into loadread values(1,''aaaa''),(2,''bbbb''),(3,''cccc'')"

    DB20000I The SQL command completed successfully.

    ```'
  merge: -1
  img_proc: true
