    | /tablespaces | Holds all user tablespaces |


    > Note: Mirroring log files helps protect a database from accidental deletion
    of an active log and data corruption caused by disk error. While this functionality
    increases the high availability of a system, log mirroring may impact system performance
    as all log data will be written to both the log path and the mirror log path.


    # Log space


    By default, DB2 sets the log path to the default database path during database
    creation. For example, Our default database path is /db2home and our log path
