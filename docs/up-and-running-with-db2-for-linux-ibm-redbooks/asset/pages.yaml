  md: '# 5.3.2 Import files into database tables or views


    The IMPORT utility inserts data from an input file into a table or updatable view.
    If the table or view receiving the imported data already contains data, you can
    either replace or append to the existing data.


    You can also use import to create a new table if the format of input file is IXF
    (Integrated eXchange Format).


    The authority and privileges required for running import with and without creating
    a new table option is different. To use the import utility to create a new table,
    you must have SYSADM authority, DBADM authority, or CREATETAB privilege for the
    database. To replace data in an existing table or view, you must have SYSADM authority,
    DBADM authority, or CONTROL privilege for the table or view. To append data to
    an existing table or view, you must have SELECT and INSERT privileges for the
    table or view.


    The import utility can be invoked through the command line processor (CLP), the
    Import notebook in the Control Center, or an application programming interface
    (API), sqldmpr. You also can specify the MESSAGES parameter for the IMPORT utility
    to record errors, warnings, and informational messages associated with the IMPORT
    operation.


    > Attention: If the volume of output messages generated by an import operation
    against a remote database exceeds 60 KB, the utility will keep the first 30 KB
    and the last 30 KB.


    Example 5-28 shows the IMPORT command issued through the CLP.


    # Example 5-28 Using IMPORT via DB2 CLP


    ```

    db2inst1@UDLBNX08:/db2home/db2inst1> db2 "create table emp4imp like emp"

    DB20000I  The SQL command completed successfully.

    db2inst1@UDLBNX08:/db2home/db2inst1> db2 "import from ./itso/datmov/emp.ixf of
    ixf commitcount 20000 messages emp4imp.msg insert into emp4imp"


    Number of rows read       = 100000

    Number of rows skipped    = 0

    Number of rows inserted   = 100000

    Number of rows updated    = 0

    Number of rows rejected   = 0

    Number of rows committed  = 100000

    ```


    Within the preceding example (Example 5-28), the COMMITCOUNT parameter is used.
    It means that DB2 will perform a COMMIT after every n records are imported. If
    the import is interrupted for some reason when using the'
