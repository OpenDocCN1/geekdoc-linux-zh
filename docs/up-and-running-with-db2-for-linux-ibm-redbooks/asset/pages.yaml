- pgno: 327
  md: '# Up and Running with DB2 for Linux


    # Experience the power of the integration of DB2 UDB Version 8 and Linux


    # Make it easier to get DB2 UDB up and running on Linux


    # Leverage DB2''s powerful autonomic technology


    Linux is one of the fastest growing server operating platforms within the past
    few years. DB2 Universal Database has long been known for its technology leadership.
    This IBM Redbook is an informative guide that describes how to effectively integrate
    DB2 Universal Database (UDB) with SuSE and Red Hat Linux operating systems. This
    book provides both introductory and detailed information on installing, configuring,
    managing, and monitoring DB2 UDB in a Linux environment.


    We describe the DB2 UDB product family and features for Linux, and provide step-by-step
    instructions for a single as well as for multiple partitions DB2 system installation
    and configuration. We cover how to migrate single and multiple partition DB2 to
    DB2 Version 8, and discuss, in detail, DB2 database administration in a Linux
    environment, procedures and tools for database backup and recovery, online maintenance,
    and system monitoring. We cover DB2 integrated tools and their features and use.


    We discuss aspects of DB2 application development in the Linux environment, and
    provide general tips about building and running DB2 applications on Linux, and
    the use of DB2 application development tools.


    # INTERNATIONAL TECHNICAL SUPPORT ORGANIZATION


    # BUILDING TECHNICAL INFORMATION BASED ON PRACTICAL EXPERIENCE


    IBM Redbooks are developed by the IBM International Technical Support Organization.
    Experts from IBM, Customers and Partners from around the world create timely technical
    information based on realistic scenarios. Specific recommendations are provided
    to help you implement IT solutions more effectively in your environment.


    For more information:

    ibm.com/redbooks'
  merge: -1
  img_proc: true
