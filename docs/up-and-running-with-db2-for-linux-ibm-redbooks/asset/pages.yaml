    # Setting up NFS


    In order to get NFS up and running, you need to configure the `/etc/exports` file
    and `/etc/fstab` files. The *exports* file is configured on the server side and
    specifies which directories are to be shared with which clients and the access
    rights for each client. The *fstab* file is configured on the client side and
    specifies which servers to contact for each directory, as well as where to place
    them in the directory tree.


    In this section, we will lead you through the following steps that are required
    to set up NFS:


    +   - Get the NFS service running on each machine in the cluster.

    +   - On a single machine in the cluster (the NFS server), create a file system
    to be used as the instance home directory (if not already created).

    +   - Mount this file system locally.

    +   - Set this file system to be mounted at each reboot.

    +   - Export the DB2 home file system using NFS.

    +   - Mount the exported file system on each of the remaining machines in the
    cluster.'
