- pgno: 157
  md: "# 4.3.3 Multiple partition migration\n\nTo migrate a partitioned database system,\
    \ you need to (1) install the new DB2 V8 server on each machine, (2) migrate the\
    \ instance on the instance-owning machine, (3) migrate the databases on the catalog\
    \ node, and (4) create the new V8 DAS on each physical machine in the partitioned\
    \ database system.\n\n# 4.3.4 Migrating the DB2 Administration Server\n\nIn Version\
    \ 8, the DB2 Administration Server (DAS) has changed significantly. It is no longer\
    \ an instance; instead, it is now a service. In a partitioned database system,\
    \ a separate DAS service typically runs on each machine in the cluster. This allows\
    \ each machine to act as a coordinator node for requests issued to the instance\
    \ from the Control Center or Configuration Assistant. This reduces the overhead\
    \ that exists when one administrative coordinator node is spread across multiple\
    \ partitions in an instance and helps to balance incoming connections. Due to\
    \ these changes, there are several things to be aware of when migrating the DB2\
    \ to Version 8.\n\n+   - Do not use an existing DAS user (for example, the V7\
    \ DAS user db2as) for Version 8. You must create a new DAS user for the Version\
    \ 8 DAS.\n\n+   - If V7 and V8 server installations are not to co-exist on the\
    \ same machine, then drop the V7 DAS instance before migrating to Version 8. However,\
    \ do not drop the V7 DAS if you want to migrate V7 scripts and schedules to the\
    \ V8 tools catalog. If this is the case, only drop the V7 DAS after installing\
    \ DB2 V8, creating the V8 tools catalog, and running the dasmigr command.\n\n\
    +   - If V7 and V8 server installations are to co-exist, then the V7 DAS is to\
    \ be used to administer V7 instances, and the V8 DAS is to be used to administer\
    \ V8 instances. The V8 DAS can only run on port 523; therefore, the V7 DAS will\
    \ have to run on a private port. To set up the V7 DAS on a private port, perform\
    \ the following steps:\n\n+   a. Login as the V7 DAS user.\n+   b. Stop the DB2\
    \ Administration Server by issuing db2admin stop.\n+   a. Unset the Version 7\
    \ DB2ADMINSERVER registry value by setting it to blank:\n+   \n+       db2set\
    \ DB2ADMINSERVER=\n+   \n+   b. Update the port number by entering the following\
    \ command:\n+   \n+       db2 update dbm cfg using SVCENAME <port_number>\n+ \
    \  \n+   Where, port_number is a new port number assigned to the V7 DAS."
  merge: -1
  img_proc: true
- pgno: 158
  md: 'c. Reset the V7 DB2ADMINSERVER registry variable to the Version 7 DB2 Administration
    Server instance name. For example:

    `db2set DB2ADMINSERVER=db2as`


    d. Restart the DB2 Administration Server by issuing `db2admin start`.


    e. Using the Control Center, catalog a new administration node at the client to
