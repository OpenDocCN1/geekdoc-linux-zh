  md: "Because of this new feature, it is no longer necessary for you to manually\
    \ update the *kernel.shmmax*, *kernel.msgmni*, and *kernel.sem* parameters prior\
    \ to install.\n\n# Manually updating kernel parameters\n\nIf any of the default\
    \ kernel parameter settings do not meet the requirements of your particular system,\
    \ you can update them manually.\n\nTo check your current shared memory segment,\
    \ semaphore array, and message queue limits, enter the `ipcs -l` command. Your\
    \ output should look something like this:\n\n```\n------ Shared Memory Limits\
    \ --------\nmax number of segments = 4096\nmax seg size (kbytes) = 32768\nmax\
    \ total shared memory (kbytes) = 8388608\nmin seg size (bytes) = 1\n\n------ Semaphore\
    \ Limits --------\nmax number of arrays = 1024\nmax semaphores per array = 250\n\
    max semaphores system wide = 32000\nmax ops per semop call = 32\nsemaphore max\
    \ value = 32767\n\n------ Messages: Limits --------\nmax queues system wide =\
    \ 1024\nmax size of message (bytes) = 8192\ndefault max size of queue (bytes)\
    \ = 16384\n```\n\n# ***Modifying 2.4.x series kernel parameters on Red Hat***\n\
    \nIn this example, we will explain how to update the *kernel.shmmax*, *kernel.sem*,\
    \ and *kernel.msgmni* parameters on Red Hat and set them after each reboot.\n\n\
    +   1. Login as a user with root authority\n+   2. Using a text editor, add the\
    \ following entries to /etc/sysctl.conf:\n+   \n+      ```\n+      kernel.shmmax=268435456\n\
    +      kernel.msgmni=1024\n+      kernel.sem=”250 32000 32 1024”\n+      ```\n\
    +   3. Load these entries into sysctl by entering the following command: `sysctl\
    \ -p`\n+   \n+      Now if you enter in command `ipcs -l`, you will see that the\
    \ kernel parameters have been updated in sysctl. To view all sysctl settings,\
    \ enter the command:\n+   \n+      `sysctl -a`\n\nIf you want to update kernel\
    \ parameters for run-time only, use the `sysctl -w` command."
