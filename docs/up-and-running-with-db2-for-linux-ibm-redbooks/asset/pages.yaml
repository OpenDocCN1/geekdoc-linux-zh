  md: '# 2.1 Basic requirements


    Prior to installing DB2, it is important that you have the required hardware and
    software. You may be required to configure communications and install additional
    software packages in order for DB2 to run successfully.


    In this section we cover the following installation prerequisites:


    +   - Linux distributions supported by DB2

    +   - Required disk space

    +   - Memory requirements

    +   - Communication requirements

    +   - Required kernel levels and libraries

    +   - Additional software requirements


    # 2.1.1 Linux distributions supported by DB2


    Make sure that your Linux distribution level is supported by DB2. For the latest
    information about currently supported Linux distributions, kernels and libraries,
    refer to the DB2 for Linux validation Web site:


    http://www-3.ibm.com/software/data/db2/linux/validate'
