- pgno: 182
  md: '# 5.2 Table/index reorganization and statistics collection


    The tables and/or indexes will become fragmented and the physical data pages for
    tables and/or indexes will become discontinuous when considerable changes have
    been made to the table. Furthermore, if a clustering index exists for a specific
    table, it may become badly clustered after a lot of changes have been made against
    the table and index key entries. The additional cost such as CPU time and I/O
    operations will be required to deal with similar workload under these conditions.
    It may lead to obvious performance degradation. One of the tasks you need to do
    for better performance is to reorganize the tables and indexes.


    After finishing the reorganization tasks, use the RUNSTATS utility to gather information
    about the physical data storage characteristics of a table and the associated
    indexes. Such information includes, for example, the number of records the table
    has, how many pages are occupied by the table and the associated indexes, the
    cluster ratio of the associated clustering index, and so forth. The DB2 optimizer
    can take advantage of these statistics when determining the access path to the
    data to gain better performance for subsequent database operations.


    # 5.2.1 Table reorganization


    DB2 UDB provides two methods for reorganizing tables:


    +   - **Online**

    +     Online table reorganization allows applications to access the table during
    the reorganization. In addition, online table reorganization can be paused and
    resumed later by anyone with the appropriate authority by using the schema and
    table name. Online table reorganization is only allowed on tables with type-2
    indexes and without extended indexes.

    +   - **Offline**

    +     The offline method provides faster table reorganization, especially if you
    do not need to reorganize LOB or LONG data. LOBS and LONG data are no longer reorganized
    unless specifically requested. In addition, indexes are rebuilt in order after
    the table is reorganized. Read-only applications can access the original copy
    of the table except during the last phases of the reorganization, in which the
    shadow copy replaces the original copy and the indexes are rebuilt.'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'Both online and offline reorganizations have been enhanced to improve support
    for multi-partition databases. You can reorganize a single partition, a set of
    partitions, or all partitions.


    > Note: From the point of view of command syntax for REORG TABLE, the methods
    of reorganizing tables provided by DB2 include classic and in-place (online).
    In general, classic table reorganization is faster, but should be used only if
    your applications function without write access to tables during the reorganization.
    In addition, classic table reorganization will require the creation of a shadow
    copy of the table, so approximately twice as much space as the original table
    will be required. If your environment does not allow this restriction, although
    in-place reorganization is slower, it can occur in the background while normal
    data access continues. Consider the features of each method and decide which method
    is more appropriate for your environment. For more details regarding classic and
    in-place table reorganization, please refer to DB2 Administration: Performance
    V8, SC09-4821.


    There are several methods available to reduce the need of the reorganization of
    table and indexes, for example, setting PCTFREE for a table to preserve a certain
    percentage of each data page for subsequent insert and update operations. For
    more information, refer to the online book, DB2 Administration: Performance V8.


    Analyzing the statistics produced by RUNSTATS can indicate when and what kind
    of reorganization is necessary. In addition, the REORGCHK command can be used
    to calculate statistics on the database or use current statistics information
    to determine if tables or indexes, or both, need to be reorganized or cleaned
    up.


    # 5.2.2 Index reorganization


    To get the best performance from your indexes, consider reorganizing your indexes
    periodically, because table updates can cause index page prefetch to become less
    effective. The command REORG INDEXES is new for DB2 Version 8. It has the ability
    to read and update a table and its existing indexes during an index reorganization.


    During online index reorganization, the entire index objects (that is, all indexes
    on the table) are rebuilt. A shadow copy of the index object is made, leaving
    the original indexes and the table available for read and write access. Any concurrent
    transactions that update the table are logged. Once the logged table changes have
    been forward-fitted and the new index (the shadow copy) is ready, the new'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'index is made available. While the new index is being made available all access
    to the table is prohibited.


    You can reduce the need of index reorganization via a variety of means, for example,
    setting PCTFREE for indexes, or enabling the online index defragmentation by setting
    MINPCTUSED (it will trigger online index leaf page merging when specific conditions
    are matched). This means it may reduce the likelihood of causing index page splits
    when future activities such as inserts happen on the table.


    The default behavior of the REORG INDEXES command is ALLOW NO ACCESS, which places
    an exclusive lock on the table during the reorganization process. But you can
    also specify ALLOW READ ACCESS or ALLOW WRITE ACCESS to permit other transactions
    to read from or update the table.


    # 5.2.3 Statistics information collection


    The RUNSTATS command can be issued from any database partition in the db2nodes.cfg
    file. It can be used to update the catalogs on the catalog database partition.
    In a partitioned database, the RUNSTATS command collects the statistics on only
    a single node. If the database partition from which the RUNSTATS command is executed
    has a part of the table, then the command will execute on that database partition
    directly. Otherwise, the command executes on the first database partition in the
    database partition group across which the table is partitioned.


    It is possible to perform read or write operations to the table where RUNSTATS
    is taking place by using different RUNSTATS command parameters. For example, ALLOW
    READ ACCESS specifies that other users can have read-only access to the table
    while statistics are calculated and ALLOW WRITE ACCESS specifies that other users
    can read from and write to the table while statistics are calculated.


    > Note: Because reorganizing a table usually takes more time than running statistics,
    you might execute RUNSTATS to refresh the current statistics for your data and
    rebind your applications. If refreshed statistics do not improve performance,
    then reorganization may help.


    # 5.2.4 Packages rebinding


    The command REBIND enables the user to take advantage of a change in the system
    without a need for the original bind file. It is likely that a particular SQL
    statement can take advantage of a newly created index. The REBIND command can
    be used to recreate the package. REBIND can also be used to recreate'
