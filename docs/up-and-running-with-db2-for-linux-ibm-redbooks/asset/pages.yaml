    # 8.2.3 Stored procedures


    A stored procedure helps to reduce unnecessary data transfer over the network
    between client and server. The SQL statements and definitions are stored on the
    database server. The client sends only the necessary data over the network to
    call the stored procedure and gets the results sent back. This helps to improve
    the overall performance of client server applications.


    The create procedure DDL statement defines a procedure within an application server.
    There are two types of procedures: external procedures, which are written in a
    programming language; and SQL procedures, which are written in SQL. In Example
    8-4, there is an SQL procedure that calculates the new salary and bonus for an
    employee. The input is an employee number and rating, and the result is to update
    the table EMPLOYEE.


    > Note: The create procedure statement is explained in more detail in Chapter
    5, "Statements" in the "SQL References" (listed in "Other publications" on page
    303.'
  merge: -1
  img_proc: true
- pgno: 290
  md: "# Example 8-4 A simple example of an SQL procedure\n\n```\ndb2inst1@db1nx02:\"\
    /sqllib/samples/sqlproc> db2 connect to sample\n```\n\n# Database Connection Information\n\
    \nDatabase server      = DB2/LINUX 8.1.0\nSQL authorization ID = DB2INST1\nLocal\
    \ database alias = SAMPLE\n\n```\ndb2inst1@db1nx02:\"/sqllib/samples/sqlproc>\
    \ db2 -td@ -vf basecase.db2\n```\n\n```\nCREATE PROCEDURE update_salary\n(IN employee_number\
    \ CHAR(6), IN rating INT)\nLANGUAGE SQL\nBEGIN\n  DECLARE SQLSTATE CHAR(5);\n\
    \  DECLARE not_found CONDITION FOR SQLSTATE '02000';\n  DECLARE EXIT HANDLER FOR\
    \ not_found\n    SIGNAL SQLSTATE '02444';\n\n  CASE rating\n    WHEN 1 THEN\n\
    \      UPDATE employee\n      SET salary = salary * 1.10, bonus = 1000\n     \
    \ WHERE empno = employee_number;\n    WHEN 2 THEN\n      UPDATE employee\n   \
    \   SET salary = salary * 1.05, bonus = 500\n      WHERE empno = employee_number;\n\
    \    ELSE\n      UPDATE employee\n      SET salary = salary * 1.03, bonus = 0\n\
    \      WHERE empno = employee_number;\n  END CASE;\nEND\n```\n\nDB20000I The SQL\
    \ command completed successfully.\n\nTo call the SQL procedure from the command\
    \ line, we entered the following command.\n\n```\ndb2 \"CALL update_salary ('000100',\
    \ 1)\"\n```\n\nThe output is displayed in Example 8-5.\n\n# Example 8-5 Procedure\
    \ call on command line\n\n```\ndb2inst1@db1nx02:\"/sqllib/samples/> db2 \"CALL\
    \ update_salary ('000100', 1)\"\n```\n\nReturn Status = 0"
  merge: -1
  img_proc: true
- pgno: 291
  md: 'A stored procedure usually runs in a separate process under the fenced user
    outside of database processes. The fenced user is defined in the create instance
    command: `./db2icrt -u <fenced id> <instance id>`. During development of SPs and
    UDFs you should change the database manager configuration parameter KEEPFENCED
    (in previous version KEEPDARI) to NO, so that every time the procedure is invoked
    the actual version is loaded:


    `db2 update dbm cfg using KEEPFENCED NO`


    After installing the Application Development Client either on the database server
    or on a Windows or Linux client, you will find many examples in the directory
    $INSTHOME/sqllib/samples about how to create UDFs and stored procedures.


    For detailed information about building SQL procedures, refer to IBM DB2 UDB Application
    Development Guide: Building and Running Applications V8i, SC09-4825.


    # 8.3 Programming languages


    In this section, we introduce some of the programming languages you can use on
    Linux and explain how to set up the environment for each one. The languages covered
    in this section are:


    +   - Perl

    +   - PHP

    +   - C++

    +   - Java


    In general, the following steps are required to use these languages with DB2:


    +   1. Set up the application development environment for the language you are
    using. Build, install, and test the required programs, modules and drivers, and
    make any necessary changes to permissions and paths.

    +   2. Identify and include DB2 specific drivers in your code. In order for your
    program to access DB2, you must copy or reference the required code into your
    program.

    +   3. Connect to a specific DB2 database. Usually an identifier is generated
    from the connect command, which is used with the SQL requests in the program.

    +   4. Use SQL statements to manipulate and retrieve data in the database.


    # 8.3.1 Perl


    Here we introduce Perl programming on DB2 and describe how to set up a Perl application
    development environment on DB2 for Linux.'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# Perl overview


    Perl is a popular, general-purpose programming language that is freely available
    on Linux. It was originally developed for text manipulation, but is now used for
    a wide range of tasks including system administration, Web development, network
    programming, and GUI development. It has also become the premier scripting language
    of the Web. According to Larry Wall, its creator, he included in Perl "all the
    cool features found in other languages and left out those features that weren''t
    so cool".


    Perl is typically provided by the Linux distributions, but you can also download
    it from:


    http://www.cpan.org/


    # Perl and DB2


    You can create DB2 applications using Perl by using the DBD::DB2 driver with the
    Perl Database Interface (DBI) Module. Both of these components are freely available
    on the Internet. Currently, DB2 supports the following versions:


    +   - Perl 5.004_04 or later

    +   - DBI 0.93 or later


    Perl is an ideal language to use with DB2.


    +   - It is an interpreted language and has a DBI Module that uses dynamic SQL.
    This is ideal for quickly creating and revising prototypes of DB2 applications

    +   - The Perl DBI module uses an interface that is quite similar to the CLI and
    JDBC interfaces, which makes it easy for you to port your Perl prototypes to CLI
    and JDBC.


    # Setting up a Perl application development environment


    In order to set up a Perl application development environment for DB2 on Linux,
    the following components must be installed and configured on your workstation:


    +   - DB2 UDB

    +   - DB2 Application Development Client

    +   - Perl 5.004_04 or later

    +   - DBI 0.93 or later

    +   - DBD::DB2 driver


    Here is the installation procedure:


    +   1. Install DB2 UDB and the Application Development Client on your workstation.
    Refer to Chapter 2, "Installation" on page 23 for instructions on how to install
    DB2 UDB on Linux. The Application Development Client installable image is found
    on your DB2 UDB ESE CD-ROM, and is also provided on a separate CD in the DB2 Personal
    Developer''s Edition and DB2 Universal Developer''s'
  merge: -1
  img_proc: true
- pgno: 293
  md: 'Edition media packs. Run db2setup to install this product using the installation
    wizard.


    +   2. Install Perl 5. Perl is typically provided by the Linux distributions,
    but you can also download it from:

    +   http://www.cpan.org/


    +   3. Build, test and install the DBI module. DBI is an open standard API that
    provides database access for client applications written in Perl. The Perl generic
    DBI module can be downloaded from the CPAN Web site at:

    +   http://www.cpan.org/modules/by-category/07_Database_interfaces/DBI/

    +   Refer to the Readme file on this Web site for installation instructions.


    +   4. Build, test and install the DBD::DB2 driver.

    +   The DBD::DB2 driver works with DBI and a DB2 client to access databases.

    +   The latest DB2 Perl DBI driver can be downloaded from:

    +   http://www.ibm.com/software/data/db2/perl/

    +   At the time of writing, the latest available driver was DBD-DB2-0.76.


    +   - Before installing DBD::DB2 driver, set the DB2_HOME environment variable
    to the installation directory:

    +   export DB2_HOME=/opt/IBM/db2/V8.1


    +   - Untar DBD-DB2-0.76 by entering the following command. In this example, we
    will untar to the /db2home/db2inst1/perl directory.

    +   tar xzf DBD-DB2-0.76.tar.gz -C /db2home/db2inst1/perl

    +   Set permissions on this file to give access to the DB2 user.


    +   - In the DBD-DB2-0.76 directory, login as the DB2 user and run the following
    commands to build and install the DBD::DB2 driver:

    +   perl Makefile.PL

    +   make

    +   make test

    +   • The make command builds the software

    +   • The make test command executes self tests


    +   - Now login as the root user and run the following command:

    +   make install

    +   • The make install command installs the DBI and then deletes the working directory'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# 5. Enable the DBI module


    To enable Perl to load the DBI module, you must include the following line in
    your DB2 application:


    ```

    use DBI;

    ```


    The DBI module automatically loads the DBD::DB2 driver when you create a database
    handle using the DBI->connect statement using the following syntax:


    ```

    my $dbhandle = DBI->connect(''dbi:DB2:dbalias'', $userID, $password);

    ```


    Where:


    +   - $dbhandle represents the database handle returned by the connect statement

    +   - dbalias represents a DB2 alias cataloged in your DB2 database directory

    +   - $userID represents the user ID used to connect to the database

    +   - $password represents the password for the user ID to connect to the database


    > Note: Red Hat 8.0 and SuSE 8.1 include Perl and Perl DBI RPM packages (Red Hat:
    perl-5.8.0-55.i386.rpm and perl-DBI-1.30-1.i386.rpm; SuSE: perl-5.8.0-57.i586.rpm
    and perl-DBI-1.28-30.i586.rpm). To create a DB2 application with Perl, The Red
    Hat 8.0 and SuSE 8.1 users only need to install and compile the DBD::DB2 package.


    The rest is up to you. Here are some good references for Perl application development
    on DB2:


    http://perl.apache.org/docs/1.0/guide/

    Everything you need to know about mod_perl technology.


    http://dbi.perl.org/

    Useful information about DBI.


    http://www.ibm.com/software/data/db2/perl/

    The IBM DB2 Perl database interface Web site.


    http://www2.boulder.ibm.com/dmd/library/tutorials/db2linux/db2linux.html

    At the bottom of this Web site is a useful tutorial called "Using Perl to access
    DB2 for Linux".


    # 8.3.2 PHP


    If you want to create a Web-enabled database application, you should consider
    using DB2 for Linux with PHP (Hypertext Processor language). PHP is a'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'server-side, cross-platform scripting language that allows you to embed application
    logic directly into an HTML file. It can be used to access DB2 from Web-based
    applications to generate customized dynamic content or for capturing database
    transactions from a Web browser. It supports DB2 access using the Unified-ODBC
    access method, in which the user-level PHP communicates with DB2 using ODBC calls
    through the DB2 CLI layer. PHP is most commonly used with the Apache Web server,
    but also works well on other Web servers, such as WebSphere, thttpd and AOLServer.
    The PHP Apache module runs as part of the Apache (httpd) process.


    Here we provide references to useful Web sites that will help you setup PHP and
    DB2 with the Apache server.


    +   To download and install the Apache Web server, refer to:


    http://httpd.apache.org


    This Web site tells you everything you need to know about installing and configuring
    Apache on Linux. It is geared towards Red Hat, but should also work for other
    distributions.


    +   To download and install PHP 4.x for Apache 1.x.x on Linux, go to:


    http://php.apache.org


    This is a great Web site that provides detailed, easy to follow instructions on
    how to acquire, install, compile, and setup PHP for Apache on Linux.


    +   There are a number of configuration steps that are required to get things
    working. These steps are covered in "Apache Web Development with IBM DB2 for Linux"
    tutorial on the Internet. Go to the following Web site to download this tutorial:


    http://www7.boulder.ibm.com/dmdd/library/tutorials/db2linux/db2linux.html


    # 8.3.3 C++


    C++ is a very popular and powerful programming language. Currently, DB2 for Linux
    supports the following C/C++ programming languages and compilers:


    +   For Linux on Intel x86: GNU/Linux gcc and g++ Versions 2.95.3 and 2.96


    +   For Linux/390: GNU/Linux gcc and g++ Version 2.95.3


    Visit the DB2 application development Web site for information on gcc and g++
    Version 3.0 support for Linux on Intel and for future version support for Linux/390:


    http://www.ibm.com/software/data/db2/udb/ad


    Refer to IBM DB2 UDB Application Development Guide: Building and Running Applications
    V8, SC09-4825, for more information about C/C++ programming on DB2.'
  merge: -1
  img_proc: true
- pgno: 296
  md: '# 8.3.4 Java


    Java is an ideal language for writing programs that will run on multiple platforms.
    Unlike languages, such as C or C++, Java is completely specified and each Java-enabled
    platform supports a known core of libraries. One such library is JDBC, which you
    can think of as a Java version of ODBC. Using Java in conjunction with JDBC allows
    you to write portable database applications.


    In order to build Java applications on Linux with DB2 JDBC support, you need to
    install and configure the following components on your development machine:


    +   - IBM Java Developer Kit:

    +     - For Linux on Intel: IBM Developer Kit and Runtime Environment for Linux,
    Java 2 Technology Edition, Version 1.3.1, 32-bit version. This product gets installed
    with DB2 if you use DB2 Setup.

    +     - For Linux /390: IBM zSeries Developer Kit for Linux, Java 2 Technology
    Edition.

    +     - For Linux on IA64: IBM Developer Kit and Runtime Environment for Linux,
    Java 2 Technology Edition, Version 1.3.1, 64-bit version.

    +   - DB2 Java Enablement. This is provided with DB2 UDB Version 8 for Linux clients
    and servers.


    In order to run Java stored procedures or user-defined functions, you must first
    enable DB2 to load the libjava.so, libjvm.so, and libhi.so Java shared libraries.
    The load program searches for the libraries in /lib or /usr/lib. You must set
    the access path to these libraries by doing one of the following:


    +   - Add the location of the Java shared libraries to /etc/ld.so.conf, then run
    the ldconfig command as root to refresh the run-time linker:


    ```

    ldconfig

    ```


    Or,


    +   - Create symbolic links in /usr/lib to point to the libjava.so, libjvm.so
    and libhi.so libraries.


    To create symbolic links, go to the /usr/lib directory and enter the following
    commands:


    ```

    ln -fs JAVAHOME/jre/bin/libjava.so .

    ln -fs JAVAHOME/jre/bin/classic/libjvm.so .

    ln -fs JAVAHOME/jre/bin/libhi.so .

    ```


    Where, JAVAHOME is the base directory for the JDK.


    You can access sample Java programs in the INSTHOME/sqllib/samples/java directory,
    where INSTHOME is the instance owner''s home directory.'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'Read the README file in this directory for information about how to run a sample
    program. Pay particular attention to these items:


    +   - Before doing anything, copy the /sqllib/samples directory to your working
    directory:

    +     cd /db2home/db2inst1/sqllib

    +     mkdir mysamples

    +     cp -r samples/* mysamples/

    +     This will give you the correct permissions in the /samples directory so
    that you can run the sample programs.


    +   - Ensure that the IBM Java Development Kit is set in your path by entering:

    +     echo $PATH

    +     If the JDK path is not found there, append it to PATH. For example, if your
    JDK path is /opt/IBMJava2-131/bin, enter:

    +     PATH=$PATH:/opt/IBMJava2-131/bin


    +   - If you use the make command, you will most likely have to make changes to
    the makefile file for it to work with your environment.


    Refer to IBM DB2 UDB Application Development Guide: Building and Running Applications
    V8, SC09-4825, for more information about Java programming on DB2.


    In addition to the programming languages discussed in this section, DB2 also can
    be accessed using script languages like BASH and AWK. These script languages come
    with Linux and don''t require special setup. They are convenient for simple DB2
    tasks or modeling.


    # 8.4 Application tools


    DB2 provides many useful tools for developing DB2 applications, such as the Command
    Center, Script Center, SQL Assist, and the Development Center. These tools become
    available to you after installing the Application Development Client.


    # 8.4.1 Command Center


    The DB2 Command Center (Figure 8-3) is a powerful interactive tool that can be
    used for executing DB2 SQL statements and DB2 commands as well as for building
    scripts. You can start the Command Center from the Tools menu in the Control Center
    or any graphical tool provided by DB2.'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# Figure 8-3 Command Center window


    On the Interactive page you can execute any DB2 commands or SQL statements directly
    against a DB2 database. For complex SQL statements, the Command Center allows
    you to store them as scripts if you press the Append to Script button. This script
    can optionally be stored in the Task Center to run it at a specific time.


    The Script page allows you to execute commands in sequence, import stored scripts
    for execution, or generate new scripts.


    Results from any command or SQL statements are displayed on the Query Results
    page.


    To show how DB2 retrieves your data for a specific SQL statement, use the Access
    Plan page.'
  merge: -1
  img_proc: true
- pgno: 299
  md: 'The SQL Assist button starts the SQL Assistant tool (Figure 8-4) which you
    can use to easily select or modify your data. This tool can be called from many
    other tools.


    ![](img/d95c931f4f3da4a6bd0ee55148fefad7_299_0.png)


    # 8.4.2 Development Center


    The Development Center is a powerful tool used to develop stored procedures, user
    defined functions or structured types. To start the Development Center (Figure
    8-5), use the command line and enter db2dc & or start it from the Tools menu of
    any graphical tool provided by DB2.'
