- pgno: 206
  md: 'When loading data in a Partitioned Database Environment, only Non-delimited
    ASCII (ASC) and Delimited ASCII (DEL) files can be partitioned. PC/IXF files cannot
    be partitioned. To load a PC/IXF file into a multiple partitioned table, you can
    first load it into a single-partition table, and then perform a load operation
    using the CURSOR file type to move the data into a multiple partition table (Example
    5-33). If you try to load source file in IXF format to a partitioned table directly,
    it results in error SQL3004N. It means the filetype parameter is not valid, because
    IXF files cannot be used to load into a table defined on a multi partition nodegroup.


    There are some options that are specific for loading in a partitioned database
    environment, for example:


    +   - PART_FILE_LOCATION: The fully qualified location of the partitioned files.

    +   - OUTPUT_DBPARTNUMS: A list of partition numbers which represent the database
    partitions on which the load operation is to be performed.

    +   - PARTITIONING_DBPARTNUMS: A list of partition numbers that will be used in
    the partitioning process.

    +   - MODE: The mode in which the load operation will take place when loading
    a partitioned database, such as PARTITION_AND_LOAD, PARTITION_ONLY, LOAD_ONLY,
    and so on.

    +   - PARTITIONED DB CONFIG: Allows you to specify partitioned database-specific
    configuration options in a LOAD command.


    If there is no partitioned database-specific configuration options specified with
    a LOAD command in a partitioned database environment (when DB2 registry variable
    DB2_PARTITIONEDLOAD_DEFAULT is NOT set to NO), the default values will be used.
    For example, the MODE will default to PARTITION_AND_LOAD.


    In the preceding two examples, the default options for loading in a partitioned
    database environment are used.


    Example 5-34 is a simple example using PARTITIONED DB CONFIG parameter to specify
    partitioned database-specific options for LOAD.


    # Example 5-34 Using PARTITIONED DB CONFIG parameter in LOAD command


    ```

    db2inst1@UDBLNX08:"/itso> db2 "load from empl.del of del replace into loadtab
    partitioned db config mode partition_only part_file_location /db2home/db2inst1/itso
    partitioning_dbpartnums (1,2)"

    ```


    | Agent Type | Node | SQL Code | Result |

    |---|---|---|---|

    | LOAD_TO_FILE | 000 | +00000000 | Success. |'
