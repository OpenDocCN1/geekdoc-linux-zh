    For archiving to TSM:


    ```

    cc -D_INCLUDE_POSIX_SOURCE db2uext2.c -o db2uext2 -I/opt/tivoli/tsm/client/api/bin/sample
    /opt/tivoli/tsm/client/api/bin/libApiDS.so -lApiDS -lpthread -lcrypt -ldl

    ```


    Copy the output file db2uext2 to $INSTHOME/sqllib/adm.


    Turn on log retain and userexit by updating database configuration on each partition.


    ```

    db2 update db cfg for itsodb using logretain on userexit on

    ```


    The database is now in a backup pending state. Do a full offline backup from every
    partition, starting with the catalog partition. For example,


    ```

    db2_all ''<<0<db2 backup db itsodb to /db2backup''

    ```


    ```

    db2_all ''<<0<db2 backup db itsodb to /db2backup''

    ```


    The database is now enabled to take database backups in online mode as well as
    to backup individual tablespaces. To verify this, use the following command:


    ```

    db2 get db cfg for itsodb | grep enabled

    ```


    And, look at:


    ```

    Log retain for recovery enabled          (LOGRETAIN) = RECOVERY

    User exit for logging enabled            (USEREXIT) = ON

    ```


    To verify the customized USEREXIT, enter the following command:


    ```

    db2 archive log for itsodb

    ```


    The USEREXIT writes all output data to /db2home/db2inst1/ARCHIVE.LOG as specified
    in the audit_error_path.'
