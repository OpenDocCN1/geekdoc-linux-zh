    # 4.3.5 Client and server compatibility


    Be aware of the following DB2 Version 7 and Version 8 client and server compatibility
    restrictions:


    +   - Avoid having V8 clients access V7 servers. There are known restrictions
    that are documented, and there may be some unknown restrictions.

    +   - You can use a V7 32-bit client to access a V8 32-bit server, but if you
    want to use the DB2 GUI tools (for example, Control Center, Health Center, and
    so on) or database commands (for example, BACKUP, RESTORE) against a V8 server,
    then you require a V8 client.'
