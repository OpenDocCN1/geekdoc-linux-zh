- img_proc: true
  md: '*Adware*: these are considered to be the least harmful and most lucrative


    of all malware. They are specifically designed for displaying ads on


    your computer.


    *Spyware*: A hacker chooses spyware to constantly spy on the user. These


    programs are designed to keep track of the users at all times. They spy


    on the Internet activities of the user and display ads accordingly. They


    help the adware with the gathered information so that they can be used


    when the user is online.


    *Virus*: Viruses are contagious programs or code. They attach themselves


    to other running software and they can reproduce themselves. The files,


    folders, or programs that they are attached to spread the virus when they


    are used or transferred to other systems through direct file sharing, or


    through a network.


    *Worm*: These are small programs that are designed to sabotage the files


    of the operating system. They, like viruses, can replicate themselves and


    hide within folders. They use up the processor and hard disk resources


    that will slow down the processes and decrease the space available on


    the hard disk. Some of the worms are harmless, while others keep on


    replicating until a drive becomes full.


    *Trojan*: Trojans are specifically designed for stealing the user


    information. This includes both financial and personal information. Of


    all the malware, these are considered to be the most dangerous. For


    denial-of-service attacks, hackers use Trojans as a major tool. They help


    the hackers keep track of the user''s activities. They maintain a log of all


    the activities and send them to the hacker who placed them within the


    system. Most of them can remain undetected over very long periods of


    time. There are a few Trojans that claim to remove viruses, but instead


    they add their own viruses.


    *Rootkit*: these are software programs that allow other malware into the


    system. These act like backdoors for other malicious software. Like


    Trojans, they work in stealth without the user noticing them. For the


    user, it looks like nothing is wrong but, in the background, it opens the


    gateway to several types of malware.'
  merge: -1
  pgno: 72
- img_proc: true
  md: '*Keyloggers*: Keyloggers are specifically designed to record all the


    keyboard input information. They can only store information that is


    given to a keyboard and are not capable of recording data that is given


    by any other means, such as virtual keyboards. They stay hidden and


    record information continuously. They will send the recorded data to the


    hacker when the user goes online. Hackers use keyloggers for retrieving


    sensitive information like passwords, etc. They usually send all the


    recorded data to the hacker. The hacker will then have to guess the


    password from the data that was obtained. A key logger doesn''t


    understand if the text is a password or not. It simply saves all the typed


    keys and will send the whole string of letters to the hacker.


    *Ransomware*: This can be defined as an infection within the system.


    Ransomware displays messages like "You''ve been locked out of your


    system until you pay for your cybercrimes," or something like that. This


    software will lock the computer and render it useless.


    **Virus**


    In computing, a virus is the term for a small program, or sometimes a few


    lines of code, that inserts itself into other files such as boot files or system


    files. Viruses stay hidden most of the time and have the capability of


    replicating themselves. Whenever a virus attaches itself to a folder or file,
    it


    gets infected. Viruses are rarely harmless but mostly harmful. Harmless


    viruses are used for pranks and harmful viruses can access your information,


    steal data, consume system resources like hard disk space, RAM space, CPU


    space etc. Harmful viruses have the capability of crippling your system and


    rendering it useless.


    **Vulnerability to Malware**


    Whenever we say that a “system” is under attack, it implies that it may be a


    single application, a computer, an operating system, or a large network that


    has been attacked by malware. There are many factors that make a system


    vulnerable so that malware can attack. A few of them are:


    Security defects in software: Using defects in software’s security is a'
