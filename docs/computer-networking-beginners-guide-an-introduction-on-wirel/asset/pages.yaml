    \ be required when designing new solutions, adding new\n\ndevices (scaling), troubleshooting\
    \ problems, or rebuilding a device after\n\nfailure.\n\nWhere is the network’s\
    \ source of truth? Is it a network management\n\nsystem? Flat files in folders\
    \ in a network share? A Microsoft SharePoint site?\n\nThe network device running-configuration\
    \ itself?"
