  md: '**IPv4 Summarization**


    **Its Purpose & Configurations**


    Well, you finally got through subnetting and VLSM. Now comes time to


    Summarize or as Spock would call it, “Route Aggregation Captain”. (You


    might notice that I’m a big fan of the original Star Trek). What this really


    means is, that we must take a bunch of small networks and clump them


    together into one or maybe two networks, and then we would need to


    advertise them to our core routers, hence, making their routing tables smaller.


    There is no need for your core routers to know about all your different LAN’s


    in order to make a routing decision. Another use of “Route Aggregation” is to


    advertise a summary-address. This is to enable a device, at the destination


    level, to be able to distribute the IP’s as it sees fit.


    Summarization would allow for lower processing time, when a router


    analyzes its own routing table to see which path it needs to take to get to a


    destination.


    Cisco has a standard called the “Cisco Three Layer Model” This model,


    just like the OSI model, is a theoretical model. The model simply informs


    you which roles certain routers may perform based on where it sits on the


    topology; let’s look at the following:


    Cisco’s Three Layer Model


    Core


    The only purpose of the Core layer is to switch information


    reliably and quickly.


    Distribution


    The primary purpose of this layer is providing routing, filtering,


    WAN access and to decide how much data can access the core.


    This layer can also be called the “Workgroup Layer”.


    Access


    This layer also called the “Desktop Layer” is an extension of the


    Distribution layer. This layer is where we talk about collision


    domains and technologies such as Ethernet or Gigabit.


    Important to note: Just because there are three layers, it does not mean you


    must have three different devices, remember this is a theoretical model.


    With summarization there are some rules that you should follow. The first


    being that, the network should start with an even number and have an even'
