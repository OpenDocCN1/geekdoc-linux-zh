  md: '**Why Automate the Network?**


    "The remains of the old must be decently laid away; the path of the new


    prepared. That is the difference between Revolution and Progress." *\- Henry*


    *Ford*


    The time for change has arrived. Enterprise networks have outgrown and


    outpaced the ability to effectively manage and maintain themselves using


    traditional tools. Historically, network management meant manually


    gathering point-in-time information from, or making configuration changes


    to, individual devices. Networks are often designed using a configuration


    command-driven approach, as opposed to a data-driven approach. Staff


    manually execute commands at the CLI to gather information or perform


    changes. Information is often regathered to confirm the state of the network


    after changes are made. The ongoing creation and maintenance of network


    documentation is also performed manually. Hours of effort is required to


    make changes, often repeating the same commands only on different devices.


    Inevitably, troubleshooting is required because of errors made using the


    manual methodology. Network automation solves all these problems.


    Scale


    The size and scale of the modern network has grown exponentially to


    accommodate the needs of organizations. Networks that started out as a few


    switches and a router are now large-scale enterprise networks. While logical


    networks evolve and grow, the tools used to manage physical devices


    remains stagnant. On the campus we now see VoIP phones, wireless access


    points, IoT, security cameras, print fleets, desktop fleets and meeting room


    equipment. In the data centers large physical and virtual footprints are not


    uncommon. World-wide WANs, with switching and routing in each remote


    office, is now common place. The device boom has not slowed with even


    more devices being added to networks without the appropriate centralized,


    automated, management solutions available.


    Network management starts with the console cable and a local CLI.


    Remote access to the CLI over a management IP address must be enabled by


    the administrator. Now imagine network technicians still needing to go to the


    physical console of every device to manage it. It sounds unreasonable, but


    only remote access to the CLI has been centralized. The same methodology'
  merge: -1
  pgno: 57
- img_proc: true
  md: 'of logging into the CLI to manage the device is followed as if the operator
    is


    virtually at the console. In fact, these remote connections are known as virtual


    teletype, or VTY, lines. At the scale of today’s networks, connecting to the


    CLI of every device to manage the enterprise is simply unachievable. Even


    with a large capable network operations team, everyone is going to operate,


    configure, and manage each device their own way. This leads to


    configuration drift and a lack of consistency at scale.


    Automated solutions scale with the network as device configurations are


    templated. Small, feature specific, modular templates ensures each device is


    standardized. When new feature requirements arise, the configuration


    commands are templated and released at scale, updating the network


    standards uniformly. Unique, device-specific, meaningful information is


    modeled in a data dictionary. This dictionary holds all the variables used to


    compile a unique configuration for each device. Code can be written


    modularly to match the topology of the network. By creating playbooks


    specific to the environment, such as campus, data center, WAN, or cloud,


    Ansible playbooks ensure code simplicity, readability and development


    flexibility.


    Complexity


    The complexity of networks has dramatically increased. Virtual Route


    Forwarders (VRFs), QoS, wireless connectivity, cloud connectivity, Virtual


    Private Network (VPN), First-Hop Redundancy Protocols (FHRP) such as


    Hot-Standby Router Protocol (HSRP), Virtual Switching Systems (VSS), and


    security and identity services such as 802.1x, have all stressed the capabilities


    of both engineers who design and operators who run the network.


    Abstracting important data from the network configurations allows


    operators to see the network devices as a collection of human-readable


    variables and dynamic templates. This drastically simplifies network design.


    Human-readability of the intended configuration for a device also reduces the


    technical requirements needed to understand how a device is configured. The


    knowledge required to execute commands and understand how a device is


    configured is abstracted because the device information is presented as a


    human-readable data model.


    Documentation


    Network documentation is extremely important, especially during times


    of crisis, however it is often overlooked during day-to-day operations.


    Changes may or may not be reflected in documentation. Files may be'
  merge: -1
  pgno: 58
- img_proc: true
  md: 'scattered across a variety of sources such as local drives, Microsoft


    SharePoint sites, or network shares. Stale or out of date documentation is of


    little value to an organization. Documentation that does exist is often


    represented as complex Visio diagrams, large Excel spreadsheets or text files


    that do not interact with the network dynamically. Documentation should be


    thought of as a key component, and advantage, of the network automation


    solution. The scope of automation is not limited to making changes. Part of


    the TFS repository master branch should be a folder structure containing both


    the dynamic documentation Ansible playbooks, as well as folders for the


    generated output artifacts.


    Automated documentation can be built directly into the CI/CD pipeline


    creating comma separated value (.csv), Markdown (.md), or text files. These


    files are then incorporated into Git commits and pull requests, becoming part


    of the code base and repository. TFS and VS Code can view these files


    natively, presenting a customizable view of the network as code. These


    artifacts include the intended, automatically generated, configuration files as


    well as the data model variables manipulated to express the information in


    different formats.


    For example, is it possible to automatically generate the following


    documentation for each device, based on data model variables:


    VLANs.


    VRFs.


    Routing protocol configuration information.


    Static routes.


    **Interface information:**


    Up / Down.


    Mode – Access or Trunk.


    VLAN(s).


    **Port-channels information:**


    Member ports.


    IP Addresses.


    Access Control Lists (ACL).


    In fact, any information represented in a data model can be transformed


    into dynamic documentation files. This allows for desired information about'
  merge: -1
  pgno: 59
- img_proc: true
  md: 'any device on the network to be automatically generated at build time, and


    available through TFS. The history for these documentation files is included


    as source and version controls. When adding or removing code, the resulting


    documentation updates are automatically performed reflecting the changes.


    Standards


    Corporate standards are very hard to maintain over time as networks


    evolve and transform. Often the pressures of projects and deliverables of day-


    to-day work demands leads to standards being overlooked, put off, or


    ignored. Natural configuration drift can occur over time as network devices


    and IP addresses come and go. If network devices continue to operate,


    misconfigurations or poor standards may go unnoticed. When identified,


    these cosmetic corrections may be deemed a low priority.


    Ansible’s dynamic templating guarantees a standardized configuration for


    every device. Complete configuration coverage is achievable and every line


    of code in the running-configuration can be derived from a template. Having


    accomplished full idempotency between the source of truth and the device


    configuration guarantees intent-based standards are uniformly applied. Scale


    is not a problem with this approach nor is the human error factor. When new


    standards arise, or changes to existing standards are required, only the


    centralized templates and data models are updated. These changes are pushed


    through the automation engine delivering the new standards to the network.


    Golden Configuration


    Sometimes referred to in Windows operating system administration as a


    “desired state configuration” a golden configuration has many names. Using


    Jinja2 templates and YAML data models, a golden configuration for each


    device in the network is achieved using software development


    methodologies. Logic within the templates is used to intelligently generate


    device configuration commands. These configurations are applied at scale to


    all devices included in the Ansible *hosts.ini* inventory file.


    The master branch represents the golden configuration for the network.


    Automated builds package the various artifacts from the master branch and


    provide a version number for that iteration of the network. When changes are


    required, however minor, working branches are created for code to be


    developed and tested. Frequent Git commits during development are used to


    check changes into the working branch. A pull request is used to merge these'
  merge: -1
  pgno: 60
- img_proc: true
  md: 'accumulated changes into the master branch, which is then deployed into


    production updating the standardized, golden configuration, at scale.


    *Security*


    Some of the largest security breaches occur because telnet is open on a


    port with a public facing IP address. Security standards and best practices can


    now be hard-coded into templates guaranteeing enforcement of policies.


    Often complex configurations are required on interfaces at the access layer to


    address security risks. Consider the access layer and all the following security


    standards that should be implemented:


    **Spanning-tree toolkit commands.**


    Bridge Protocol Data Unit (BPDU) controls.


    Portfast.


    802.1x or port-security commands.


    Data and voice VLANs.


    QoS settings.


    CDP settings.


    Power over Ethernet (PoE) settings.


    Native VLAN established.


    Native VLAN applied on trunk ports.


    NTP source.


    Security banner presented at login.


    AAA.


    RADIUS / TACACS+.


    ACLs on management ports.


    VLAN 1 disabled.


    Security requirements, if missed or incorrectly applied, lead to


    vulnerabilities and threats within the network. These vulnerabilities can be


    exploited, lead to outages, or bring about data loss in certain scenarios.


    Having a guaranteed templated configuration ensures that important security


    components are hard-coded into every template and applied to both the


    device’s global configuration as well as every interface configuration. Every


    access port throughout the campus can now be configured the same way and


    will automatically include security posture standards.


    Agility'
  merge: -1
  pgno: 61
- img_proc: true
  md: 'In an on-demand world networks continue to be the bottleneck of many


    projects. One of the driving factors for moving to automation is the agility it


    offers. Most of the common changes to the network become updates to


    existing data models. When new feature requirements arise, such as the need


    for multicast, new templates along with new data model variables will be


    developed. The feature is then released and incorporated into the


    orchestration of playbooks as a new task. A very repeatable, modular, process


    evolves which provides the agility to deliver projects more efficiently.


    Design


    Traditional network design often centers around the device configuration


    commands. While these commands are essential at implementation, it is the


    data that should drive network design. Network engineers'' new


    responsibilities include crafting human-readable data models and the logic


    that drives the dynamic templates. Existing or new dynamic documentation


    should reflect new features as templates are added or updated. Thinking


    about data first, and the configuration second, network design evolves.


    Deployment


    The biggest advantages found in network automation are often on the


    operational side of network management. Large-scale changes are often very


    difficult to roll out to an enterprise. Introducing QoS to a network, for


    example, means touching all devices in all layers of the network, often with


    different code per platform. Devices using Multi-Layer Switching (MLS) or


    Modular Quality of Service Command Line (MQC) leads to different


    requirements and configuration commands by platform. Operations receives


    approved, finalized, network designs, along with deployment steps, from the


    network engineers. This often requires weeks or months to then complete the


    delivery to campus from start to end. Network automation, even a hybrid


    model where operators run Ansible playbooks manually, solves operational


    headaches related to deploying configurations to the network. Deployment


    time is drastically reduced when using Ansible playbooks while quality and


    accuracy significantly increases.


    Operations


    NetDevOps will dramatically change network operations’ role in the


    organization. A library of canned, automated, Ansible playbooks develops


    over time. Automated builds and deployments will trigger whenever


    approved changes are merged into the repository. Operations are often tasked


    with running the network day-to-day, incorporating and deploying the'
