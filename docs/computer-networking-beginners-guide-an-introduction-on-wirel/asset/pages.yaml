  md: "**Wiring Your Building **\n\nWhen you begin wiring a building for a network,\
    \ it seems awesome and\n\noverpowering to you. Questions of how to do every little\
    \ thing go through\n\nyour mind and doubts start to sink in. Just take a big breath\
    \ and remember\n\nthat old proverb: \"A network of a thousand computers begins\
    \ with one wire.\" \n\nGeneral Network Installation Outline \n\nOnce you get started,\
    \ it becomes a game and starts to fall into place rather\n\nquickly. A little\
    \ organization up front solves a ton of problems along the way.\n\nHere's a little\
    \ listing of things to do, in chronological order, that will help a\n\nlot. \n\
    \n1\\. Decide on a phone closet location.\n\n2\\. Draw a network diagram with\
    \ present and future computer and printer\n\nlocations.\n\n3\\. Number the devices\
    \ on the network chart for future reference.\n\n4\\. Figure out the best way to\
    \ get a wire from each location to the closet.\n\n5\\. Run all the wires before\
    \ connecting anything. Remember to test them. \n\n6\\. Install all the connectors\
    \ and jacks.\n\n7\\. Connect the network and test it.\n\nSounds easy enough, doesn't\
    \ it? Well, it's really that simple, although\n\nyou're sure to run into some\
    \ unforeseen obstacles along the way that frustrate\n\nyou and make you wonder\
    \ why you ever started this crazy project. But never\n\nfear! This chapter will\
    \ help you avoid some of the most common problems,\n\nor at least be aware of\
    \ them so you can overcome them. At the same time, at\n\nleast it's comforting\
    \ to know that these problems happen to everyone. Misery\n\nloves company, right?\
    \ \n\nThe Phone Closet \n\nNot only does it provide you with a central, out of\
    \ the way place to run\n\nyour wires and set up network equipment, it also serves\
    \ as a hiding place for\n\nall that stuff that could easily be an eyesore if exposed\
    \ in an office setting. \n\nYour phone closet should provide these basic features:\
    \ \n\n• If possible, it should be centrally located, so that you can run wires\
    \ from\n\neach equipment location and keep the distances as short as possible."
