  md: "![](img/0937bf4b1739a36662bbe2484b163f1b_19_0.png)\n\n**Mitigating**\n\n**Network\
    \ Threats**\n\nThere is nothing wrong with being paranoid about your network,\
    \ or network\n\nsecurity. In fact, paranoia might actually save you. Today networks\
    \ are under\n\nthreat from so many elements. There are people who just need access\
    \ to your\n\nnetwork resources because they can for fun, but others will want\
    \ to steal\n\nimportant information. There is so much damage that someone can\
    \ do to you\n\nwhen they gain access to your network.\n\nNetwork security is something\
    \ that most people barely take seriously, yet\n\nit might actually be the difference\
    \ between life and death. A security breach\n\ncan cripple the entire network,\
    \ rendering you sitting ducks. \n\nTo be very honest, network security is as important\
    \ as a basic need, and\n\nyou should do your best to make sure you keep a clean,\
    \ secure network.\n\nThere are many security threats that you will learn about.\
    \ Some have been\n\naround for years, others might come up in the future. Some\
    \ threats simply\n\nevolve and become stronger, worse iterations of their former\
    \ selves.\n\nThe secret to maintaining your network integrity in terms of security\
    \ lies\n\nin mitigating risks. Disaster preparedness is something you should always\n\
    \nwork on. Even the strongest network is always at risk of a security threat.\n\
    \n**Identifying threats**"
  merge: -1
  pgno: 19
- img_proc: true
  md: "The dangers to your network are insane. There are so many risks out there\n\
    \nthat you would be foolhardy to ignore them, or assume that you have the\n\n\
    most protected network. One tactic that works for a lot of organizations is to\n\
    \nwork with experts to try hacking the network from time to time, to gauge the\n\
    \nlevel of security, and determine whether you need to do more.\n\nMost people\
    \ only recognize malware and viruses as the biggest risk in as\n\nfar as network\
    \ security is concerned. Indeed, an infection will ground you.\n\nHowever, there\
    \ are so many other risks out there that can have just as\n\ndamning an effect\
    \ on your network.\n\nAnyone who tries to gain unauthorized access to your network\
    \ usually\n\ndoes so either for reconnaissance, or for destructive reasons. Some\
    \ security\n\nbreaches are so carefully crafted they can accomplish both. Security\
    \ breaches\n\nare important because there is so much damage that can be done with\
    \ the\n\ninformation accessed from your network.\n\nMany people are currently\
    \ paying the price for using an insecure network.\n\nTheir private and personal\
    \ data was stolen, and some of them were\n\nimpersonated. You might end up being\
    \ linked to a terror attack you had no\n\nidea about, because someone stole your\
    \ identity and used it for such. Enough\n\nabout the scary details though. Here\
    \ are some of the common network\n\nsecurity concerns that you will encounter\
    \ from time to time as a network\n\nadministrator:\n\n*●* Denial of service\n\n\
    Denial of service attacks (DoS) block you from accessing the network or\n\nresources\
    \ associated with the network. It can be done in so many ways. DoS\n\nattacks\
    \ are common today, and they usually target large corporations. \n\nThe attackers\
    \ can flood the organization website with too much traffic\n\nthat the servers\
    \ cannot handle, making it impossible for legitimate users to\n\naccess the website.\n\
    \n*●* Ping of death\n\nThe ping of death is one of the common forms of DoS attacks.\n\
    \nSo, what happens in the ping of death attack? To communicate, your\n\ndevice\
    \ sends ICMP packets to a remote host to establish its availability.\n\nHowever,\
    \ in a ping of death attack, the intruder will flood the remote host\n\nwith ICMP\
    \ packets. When this happens, they probably expect the remote host"
  merge: -1
  pgno: 20
- img_proc: true
  md: "to be overwhelmed, and in the process it either hangs or keeps rebooting.\n\
    \nLuckily today a lot of operating systems are designed with patches and\n\nsecurity\
    \ updates to protect them from such an attack.\n\n*●* ^(Smurfs)\n\nForget about\
    \ the tiny adorable blue fellows you have seen on TV. Smurf\n\nattacks are nowhere\
    \ close to adorable. What smurf attacks do is that they\n\nkeep flooding your\
    \ network with spoofed ping broadcasts. Spoofing is using\n\nsomeone else’s IP\
    \ address.\n\nHow is a smurf attack executed? The attacker will spoof your IP\
    \ address,\n\nand after that, direct a humongous number of pings to the broadcast\
    \ addresses\n\nassociated with your IP address. The router that receives the request\
    \ will\n\nproceed to broadcast the pings on the network, assuming it is a normal\n\
    \nbroadcast request. From here, all the other hosts will pick up on the\n\nbroadcast.\
    \ Since they are all echoing a response to the IP address request,\n\nthey create\
    \ an echo. In a short while, you will have a nightmare on the\n\nnetwork because\
    \ each of the hosts on that network is trying to respond to the\n\nrequest. \n\
    \nSmurf attacks are more effective when they target a large network. They\n\n\
    benefit from the economies of scale. Smurf attacks might be a thing of the\n\n\
    past, but you can never rule out the possibility of occurring. There is always\n\
    \nthat one random hacker who decides to take an old school approach that no\n\n\
    one would suspect. Most routers today are programmed in a way that they\n\ncannot\
    \ broadcast data packets haphazardly.\n\n*●* Tribe flood network\n\nTribe flood\
    \ network attacks are very complex, and are commonly known\n\nas distributed denial\
    \ of service attacks, DDoS. They are orchestrated when\n\nthe attacker launches\
    \ a series of DoS attacks from several sources, and all the\n\nattacks are directed\
    \ towards a host of devices.\n\n**How attacks happen**\n\nDepending on their ultimate\
    \ goal, each attacker will often have an action plan\n\nto get what they want.\
    \ Some attackers will lure you over a duration of time,"
  merge: -1
  pgno: 21
- img_proc: true
  md: 'in the process learning as much as they can about you and your network, even


    without your knowledge before they pounce and execute their attack.


    Attackers can interact with you in a very subtle form and you will rarely


    realize you are being targeted. Something as simple as a computer game is


    sufficient to allow them access to your network. Armed with the knowledge


    that someone out there is always trying to gain privileged access to your


    network, you must exercise caution.


    A directed attack is an attack that is orchestrated by an attacker. This is


    someone who was looking for something specific, or who had a very specific


    reason for hacking your network. A directed attack is different from things


    like viruses, for example. A virus might be transmitted from one device to


    another by unwitting users. Viruses usually take advantage of a weak system


    and embed into the device. Some viruses clone and look like files you see or


    access all the time, so you cannot suspect them at all. Here are some of the


    most common network attacks that you might experience while managing a


    network:


    *●* Active X attack


    These attacks are embedded onto small apps that you must install on your


    computer to allow you access to something specific. Some websites require


    you to install Java or Adobe plugins to play some media. These are the


    simple ways the attackers access your devices. Once you install the app, the


    program runs in the background without your knowledge, collecting


    information that is transmitted to the hacker’s server.


    Hackers who use this technique can remotely access everything in your


    devices without your knowledge. This is a dangerous attack because someone


    who can see everything in your hard drive might as well store damning


    information or plant doctored evidence in your device.


    *●* Auto rooter


    An auto rooter is an automated hack. Hackers who perform this rely on


    rootkits. This type of attack is common with hackers who want to spy on your


    network. Once affected, they have access to everything you do, and can


    monitor your device for as long as they need to.


    *●* IP spoofing'
  merge: -1
  pgno: 22
- img_proc: true
  md: "An IP spoof is a situation where the attacker sends data packets, but\n\ninstead\
    \ of using their real source address, they use a fake one. More often\n\nyour\
    \ network will be susceptible because the IP address is spoofed to look\n\nlike\
    \ it is coming from a device within the network, when in a real sense the\n\n\
    packets are originating from an alien IP address.\n\nThe problem with IP spoofing\
    \ is that routers will identify the packets and\n\ntreat them as normal requests\
    \ within the network, because they can identify\n\nthe IP address. The best way\
    \ to deal with such an attack is to have a firewall\n\nin place.\n\nThere is a\
    \ lot of privileged information on the internet today. Think about\n\nthe number\
    \ of people who shop online, the companies that store user\n\ncredentials and\
    \ information on the cloud and so forth. Data is the new gold,\n\nand everyone\
    \ is trying to hack into some system to obtain useful data.\n\nCorporate espionage,\
    \ for example, is one of the biggest black hat businesses.\n\nPeople are paid\
    \ too much money to hack into a system and obtain specific\n\ndata. Implementing\
    \ firewalls on the networks is one of the best ways to avoid\n\nthis problem.\n\
    \n*●* Backdoor access\n\nA backdoor is a path created by a developer to allow\
    \ them access to the\n\nprogram or app without going through the normal processes.\
    \ Most developers\n\ncreate backdoors so that they can access these apps for different\
    \ reasons.\n\nSome use this as a means of troubleshooting the app if normal processes\
    \ fail\n\nand they cannot access them.\n\nFor hackers, backdoors allow them to\
    \ invade the network. It is always\n\nadvisable that you monitor and inspect the\
    \ network as often as possible to\n\ndetect backdoors. You should also conduct\
    \ system audits frequently to make\n\nsure your network security is up to par\
    \ with the present standards in network\n\nsecurity. \n\nConsidering the current\
    \ state of affairs in data security, most countries\n\nplace a lot of emphasis\
    \ on the need for system and network audits. You must\n\ndo everything in your\
    \ power to protect the networks you use, or you might be\n\nheld liable if a data\
    \ breach ends up with an inappropriate use of the data\n\nobtained.\n\n*●* Application\
    \ layer attack"
  merge: -1
  pgno: 23
- img_proc: true
  md: 'An application layer attack exploits loopholes in some of the programs or


    applications that you use. Most of these attacks target apps and programs that


    require permissions, because they collect a lot of privileged information.


    Anyone who hacks into your system with such an attack will not just gain


    access to the system and devices, they will have access to an information


    goldmine.


    *●* Packet sniffing


    Packet sniffers are tools that network managers use to troubleshoot the


    network. They scour the network for problems. However, these same tools


    can also be used by hackers. Packet sniffers are commonly used by identity


    fraudsters to steal login credentials in the breached networks, and any other


    information that might be relevant to their cause.


    *●* Brute force


    In a brute force attack, the hacker runs a program on your network that


    logs into your server, for example. They gain account privileges and from


    here, use them for backdoor access. Later on, they can access your network


    without needing passwords.


    *●* Network reconnaissance


    Network reconnaissance is simply spying on the network. The hackers


    take their time to obtain as much information as they can about your network


    before they pounce. They can scan network ports, or employ phishing


    techniques to get the information they need.


    *●* Password attack


    A password attack is an attack where the hacker pretends to be a valid


    user on the network, allowing them access to your resources and credentials.


    Password attacks can be initiated in so many ways. They can also be used


    alongside other attacks.


    *●* Man in the middle'
  merge: -1
  pgno: 24
- img_proc: true
  md: "Man in the middle attacks take place when the hacker intercepts your\n\ncommunication.\
    \ They read the data intercepted before it is delivered to the\n\nrecipient. Internet\
    \ service providers, credit and debit card swipe machines,\n\nand rogue ATM machine\
    \ operators are commonly used for these attacks.\n\n*●* Trust exploits\n\nIt has\
    \ often been said that the weakest link in any security apparatus is the\n\nhuman\
    \ interface. We tend to hold trust in high regard, and this is what brings\n\n\
    down the entire system. You believe that someone cannot do something bad\n\nbecause\
    \ you know them personally and they are not of that character.\n\nUnknown to you,\
    \ they might have ulterior motives, or someone else might be\n\nusing them without\
    \ their knowledge. Trust exploits occur when a hacker\n\nmanages to exploit the\
    \ trust relationships that you have in the network.\n\n*●* Port redirection\n\n\
    In this attack, the hacker uses a host machine that is already\n\ncompromised.\
    \ The compromised host machine is one that is friendly to your\n\nnetwork. Since\
    \ this machine already has privileges, the hacker uses it to\n\ngenerate traffic\
    \ to the network, traffic packets that would normally be\n\nblocked by your firewall\
    \ from getting into the network.\n\n*●* Phishing \n\nPhishing is one of the most\
    \ sophisticated hacking attempts you can come\n\nacross today. There is a good\
    \ reason why it is referred to as social\n\nengineering. As we evolve with the\
    \ networks, so do the tactics used to obtain\n\nprivileged information by hackers.\
    \ Phishing attacks require you to offer\n\ninformation to the hacker that you\
    \ would not offer in your right mind, but you\n\ndo so without knowing it.\n\n\
    Majority of network administrators have taken steps to protect their\n\nnetworks\
    \ from attacks. Hacking such networks is not easy. Instead of going\n\nthrough\
    \ the trouble, hackers simply create something that looks legitimate\n\nand pass\
    \ it on to the users. With this, they obtain all the information they\n\nneed\
    \ from you.\n\nA good example of this is a hacker who wants to collect some\n\n\
    information like identification details, date and place of birth, and so forth."
  merge: -1
  pgno: 25
- img_proc: true
  md: 'Such a hacker can create a loan app, make it look legitimate and put it up
    in


    an app store. From there, they market the loan app properly and make sure


    they get the right attention.


    Once you download this app, because perhaps you are looking for cheap


    loans with a bad credit score, you feed in all the important details you would


    provide the bank or any lender and wait for their feedback. You never get any


    feedback from the phishing hackers. They already have information like your


    full name, residential address, phone number, email address, and some even


    prompt you to create a password, which most people use the same password


    across all accounts.


    Some phishing hackers even clone emails and make them appear look


    like they come from a legitimate source like a well-known government entity


    or bank. To avoid these, always make sure you use official links from


    websites you access. When you are in doubt, call the official contact details


    to find out the truth before you provide your information to hackers.


    Some of the phishing attacks use keyloggers. Keyloggers can run in your


    system undetected. Today most keyloggers are built in such a way that they


    can send not just the key strokes, but some even capture screenshots and


    upload them to the hacker’s server without your knowledge. Since you might


    be typing a lot on the keyboard, keyloggers can be programmed to capture


    only specific information like emails and passwords, phone numbers and so


    forth.'
