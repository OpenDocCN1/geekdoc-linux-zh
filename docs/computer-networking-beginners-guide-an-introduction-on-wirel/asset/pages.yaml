  md: "protocol, and follow this protocol for data reading. This is the reason why\n\
    \nyou can’t run an android app in an iPhone.\n\nIn addition, a CPU can usually\
    \ only run one program at a time. In order to\n\nmake multiple programs run at\
    \ the same time, the operating system adopts\n\nthe CPU time slice rotation mechanism\
    \ to switch between multiple programs\n\nand schedule reasonably. This approach\
    \ is called multitasking. \n\n**So What Is An Agreement In Protocol? **\n\nAgreements\
    \ are like conversations between people. Here's a simple example.\n\nThere's three\
    \ of them. Sam, Tom, and Jerry. Sam can only speak Chinese,\n\nTom can only speak\
    \ English, and Jerry can speak both Chinese and English.\n\nNow Sam and Tom need\
    \ to talk. How should they communicate with each\n\nother? What if Tom and Jerry\
    \ need to talk? \n\nIf we: Treat Chinese and English as \"agreements. \" Use Chat\n\
    \ncommunication\" \n\nAnd Treat what you say as \"data. \" \n\nI am afraid that\
    \ Sam and Tom cannot communicate with each other for as\n\nlong as they speak\
    \ in one language. Because of the difference in the\n\nagreement (language) used\
    \ in their conversation, neither party is able to\n\ntransmit the data (what is\
    \ said) to the other party. (a simultaneous interpreter\n\nbetween the two can\
    \ facilitate communication, as the gateway does in a\n\nnetwork environment.)\
    \ \n\nNext, we analyze the conversation between Sam and Jerry. By using this\n\
    \n\"agreement\" in Chinese, two people can understand what the other person is\n\
    \ntrying to say. That is to say, Sam and Jerry use the same protocol in order\
    \ to\n\ncommunicate smoothly so that they can transmit the desired data (what\
    \ they\n\nwant to say to each other). \n\nIn this sense, agreements are like the\
    \ language of ordinary speech.\n\nAlthough language is a human property, when\
    \ computers communicate with\n\neach other over the Internet, it can also be argued\
    \ that communication is\n\nbased on something akin to human \"language\" (similarly,\
    \ some of the actions\n\nwe take for granted in our daily lives are in many cases\
    \ consistent with the\n\nconcept of \"agreement\"). \n\n**The Birth and Standardization\
    \ of Computer**"
