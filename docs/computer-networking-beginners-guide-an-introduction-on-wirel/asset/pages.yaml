    4\. IPv4 mapped IPv6


    5\. IPv4 compatible IPv6 address


    *6\. Unspecified address*


    *Global unicast:* it is similar to class A, B and C addresses of IPv4. They


    occupy the 85 percent of the IPv6 address space. A global unicast address


    always starts with binary 001. This address is written with a decimal prefix


    notation of 2000::/3, which technically means that any IPv6 address whose'
