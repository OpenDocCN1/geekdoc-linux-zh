    are often located at safe locations from the Internet. Bots can perform tasks


    like sending spam messages, which comes under the denial-of-service attack.


    Computers that are infected by bots will be under the control of the attacker;


    those machines are called zombies.


    Bots can sneak into a computer in many different ways. They search for


    unprotected computers on the Internet. When they find a vulnerable


    computer, they infect it quickly and report back to the attacker. They are'
  merge: -1
  pgno: 76
- img_proc: true
  md: 'specifically designed to stay hidden until their master commands them to


    perform a particular task. Bots stay hidden and in stealth. Most of the victims


    do not realize that their systems are infected with bots until their service


    provider notifies them that their system has been sending spam messages to


    other users. In some cases, bots even clean up the computer that they


    infected, making sure they do not get bumped off that machine by another


    bot. Bots can spread across the Internet using Trojans, which download them,


