  md: "sharing and information transfer under the co-management and coordination\n\
    \nof Network Operating System, network management software and network\n\ncommunication\
    \ protocol. If you don't know what a computer network is, go\n\nhome, or go to\
    \ an Internet cafe, or go to your company and see for yourself.\n\nWhat you see\
    \ is a network of pcs (personal computers) that appear to be\n\nindependent and\
    \ located in different places, connected by cables and boxes of\n\ndevices (switches,\
    \ routers). \n\nSimply put, a computer network is a collection of computer systems,\
    \ or\n\ngroups of computer systems, that work independently and are connected\
    \ to\n\neach other by communication lines, including connecting cables and network\n\
    \nequipment. In this set of computer systems, resources can be shared among\n\n\
    computers, access to each other can be carried out for a variety of computer\n\
    \nnetwork applications. The computers can be microcomputers, minicomputers,\n\n\
    midsized computers, mainframes. \n\nBy sharing, I mean sharing resources. Resource\
    \ sharing has many\n\nimplications. It can be information sharing, software sharing,\
    \ or hardware\n\nsharing. For example, there are many servers on the Internet\
    \ (that is, a\n\ndedicated computer) that store a large number of valuable electronic\n\
    \ndocuments (including audio and video files) that can be easily read or\n\ndownloaded\
    \ (for free or for a fee) by Internet users. Because of the network,\n\nthese\
    \ resources are as easy to use as if they were right next to the user. \n\nA typical\
    \ example of data resource sharing is database resource sharing,\n\nwhere each\
    \ network user can centrally invoke relevant data information in a\n\nsingle database\
    \ server. A variety of application servers are also examples of\n\nsharing data\
    \ resources, such as receiving email through client-side programs\n\nlike Fox\
    \ Mail and Outlook, and the online games you and your friends play\n\nevery day\
    \ Or you and your Family Watch the same movie on the Internet\n\nevery day on\
    \ a different computer at home. There are many examples of\n\nsharing software\
    \ resources, such as in the enterprise internal network we will\n\nprovide all\
    \ employees on the server to share some common tools, let users\n\nchoose to install.\
    \ If pushed to the Internet, it is more intuitive, we\n\ndownloaded from the Internet\
    \ are all examples of software resource sharing."
