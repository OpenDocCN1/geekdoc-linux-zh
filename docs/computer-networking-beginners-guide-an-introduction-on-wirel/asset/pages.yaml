- img_proc: true
  md: 'executes will be given more privileges. These privileges include


    permissions to access and modify the system resources. Such code is


    known as over-privileged code. A few operating systems and a few


    scripting languages give these privileges to code, making it over-


    privileged code.


    In such cases, when the user executes the code, the system will provide


    all the privileges to the code as the user who runs it. This will make the


    system vulnerable to malicious software that comes from the Internet.


    **Homogeneity**


    We can say that a set of systems is homogeneous when they all are connected


    to the same network and run on the same operating system. This phenomenon


    is called homogeneity. When there is homogeneity, it is easier for malware to


    spread itself across all the systems that are connected to that network. For


    example, if there is a virus in one of the systems, it can spread itself to all
    the


    systems in that network. Homogeneity can be found in various organizations,


    like schools, colleges, and most software organizations. The majority of the


    systems run on Windows or Mac operating systems. Concentrating on either


    one of those operating systems will give the hacker a great opportunity to


    exploit a large number of systems that are run on them. One way to remedy


    homogeneity is to use different operating systems on each of the systems.


    This will make it harder for the malware to spread. But there are a few


    disadvantages in the initial stages such as higher expenses for training and


    maintenance.


    **Cover your tracks**


    A good ethical hacker never leaves traces of their intrusion behind. A hacker


    cannot risk leaving evidence of having intruded into a network or a system.


    In such cases, the hacker can use malware for cleaning all records, such as


    event logs, and can have a clean exit. There are many types of malware that


    hide network traffic and clean directories.


    *Proxy Server*: Making use of the proxy server is a very good idea for a


    hacker who intends to tunnel through the sensitive areas of the network.'
