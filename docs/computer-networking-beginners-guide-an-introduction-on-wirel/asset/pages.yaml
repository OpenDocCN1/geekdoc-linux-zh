    \ new automated\n\ntools used to gather the information needed to run the network.\
    \ With that\n\nsaid, the network may still have the need of an NMS for platform\
    \ health\n\nmonitoring. There may be network appliances or controllers that are\
    \ not good\n\ncandidates for automation or there may be non-SSH systems on the\
    \ network\n\nthat are non-automatable using Ansible.\n\nIntent-Based\n\nThe human-readable\
    \ nature of this methodology allows for a true intent-\n\ndriven model of the\
    \ network. The configurations are abstracted into the\n\ntemplates, so focus can\
    \ be put on the data models. Intent for each device or\n\ngroup of devices can\
    \ be expressed in a human-readable form. Idempotent\n\nAnsible playbooks combined\
    \ with check mode can tell exactly if a device’s\n\nrunning-configuration matches\
    \ intent and if the Ansible playbook would have\n\nadded code. Utilizing the differential\
    \ option (—diff) allows the operator to\n\nsee what differs between the two configurations\
    \ and can also be displayed\n\nindicating any commands present on the device but\
    \ missing from intent.\n\nNew appliance-based solutions are available that offer\
    \ a GUI-driven\n\nintent system. Drag and drop intentions in the GUI are translated\
    \ to\n\nconfigurations that are automatically pushed to the devices. These new\
    \ intent-\n\nbased appliances are the biggest competitor to Ansible network automation.\n\
    \nEither purchase and configure the appliance, hoping it does everything\n\nadvertised,\
    \ or build an in-house Ansible automation framework. \n\nSource of Truth\n\nEvery\
