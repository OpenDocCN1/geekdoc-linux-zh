  md: "**Description**\n\n![](img/0937bf4b1739a36662bbe2484b163f1b_8_0.png)\n\nComputer\n\
    \nNetworking is simply the formation of a computer network. A computer\n\nnetwork\
    \ can be defined as the collection of computers, printers, and other\n\nequipment\
    \ that are connected (wired or wireless), with the ultimate aim of\n\nfostering\
    \ communications between the devices. The process of creating this\n\nconnection\
    \ of devices is known as Computer Networking. \n\nTechnically, Computer Networking\
    \ is referred to the process of\n\ntransporting and exchanging data between points\
    \ known as nodes, carried via\n\na shared system, executed in an information system.\
    \ The whole concept of\n\nComputer Networking does not consist only of the design,\
    \ construction, and\n\nuse of a network. It also involves the technical management,\
    \ maintenance,\n\nand running of the involved infrastructure, software, and underlying\
    \ policies.\n\nSince the advent of wireless technologies, decades ago, our lives\
    \ have\n\nnever remained the same. And one thing is sure; it only promises to\
    \ be better.\n\nWith the gradual evolution of 5G in the mainstream, we can only\
    \ imagine\n\nwhat is to come. One sentence does it, “Wireless technology has affected\
    \ the\n\nvery intrinsic properties of our lives.”\n\nIt has affected the way we\
    \ do business; it has transformed the way we\n\nlearn; it has affected the way\
    \ we communicate and keep up with family and\n\nfriends. Everything has changed,\
    \ and this is just a testimonial of things to\n\ncome.\n\nThis guide will focus\
    \ on the following:\n\nProtocol\n\nMitigating Network Threats\n\nIPv6\n\nWiring\
    \ Your Building\n\nNetwork Cabling"
