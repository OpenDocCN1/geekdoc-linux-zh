  md: "This doesn't mean that you have to actually have room right now for all\n\n\
    those devices to be plugged in. You can plan for additional hubs or larger\n\n\
    hubs to be installed at later dates. But you do need to plan to have room for\n\
    \nthe hubs and the wires or you'll overcrowd your mounting board very\n\nquickly.\n\
    \nMounting Board with Planned Expansion\n\nSometimes you can plan for future expansion\
    \ for a small price. If you\n\nhave seven devices to connect to Ethernet, an eight-port\
    \ hub is really too\n\nsmall for you. Yes, it will do the job for now, but the\
    \ first addition you have\n\nwill fill it up. Then you'll be stuck with purchasing\
    \ another hub to expand. In\n\nthis case, it would have been less expensive in\
    \ the long run to purchase a 12-\n\nport hub in the first place. Then you have\
    \ a 50 percent expansion capability\n\nbefore having to worry about growth problems.\
    \ \n\nUsing a Numbering System \n\nIf you didn't plan ahead, you might run all\
    \ your wires to the closet and\n\nthen begin to connect them. But which wire goes\
    \ where? There are good\n\nreasons to know where each wire leads. If (or when)\
    \ you have any problems\n\nwith your network, it's necessary to know how to trace\
    \ the wires from one\n\nplace to another. When you run each wire, it's a good\
    \ idea to label each one,\n\nindicating where it goes.\n\nNumbering System Examples\n\
    \nThis is a good way to keep up with how your wires are run. It will help a\n\n\
    lot when you begin to troubleshoot a problem on the network. This can be\n\ndone\
    \ on a piece of paper while you're working and later transferred to a\n\nspreadsheet\
    \ or database. \n\nTable 10-1 Network Numbering Chart\n\nIf you're really lucky,\
    \ you'll have pre-existing wiring you can use. Or\n\nmaybe you'll be able to spring\
    \ for a professional electrician to do all your\n\nwiring for you. Meanwhile,\
    \ back in the real world, you'll probably have to do\n\nsome or all of the wiring\
    \ yourself. This is not so bad, but if you've never done\n\nany wiring through\
    \ a building, you're in for some surprises. (Some areas may\n\nrequire that all\
    \ wiring be done professionally. Check local ordinances before\n\nyou begin!)\
    \ \n\nWiring a building can be as simple as pie or more trouble than it is worth.\n\
    \nSometimes you'll have one or two wires that go through with no trouble at all,\n\
    \nand a few that nearly kill you. The best thing to do is to remain calm. With\
    \ a\n\nlittle clear thinking and some simple tricks, you can do it if you don't\
    \ get"
