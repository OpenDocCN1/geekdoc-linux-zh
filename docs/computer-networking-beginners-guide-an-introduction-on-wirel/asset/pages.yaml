  md: "**Introduction**\n\n![](img/0937bf4b1739a36662bbe2484b163f1b_10_0.png)\n\n\
    A computer network\n\nis made up primarily of interconnecting common, programmable\
    \ hardware.\n\nThe hardware is designed for a specific purpose (for example, to\
    \ transmit\n\ndata or video signals). This programmable hardware can be used to\
    \ transmit a\n\nvariety of different types of data and can support a wide and\
    \ growing range\n\nof applications. \n\nAccording to this definition: (1) the\
    \ hardware connected to a computer\n\nnetwork is not limited to ordinary computers,\
    \ but includes smartphones and\n\nother different types of devices like AR devices,\
    \ smartwatches that are\n\nflooding the market every day (2) computer networks\
    \ are not specifically\n\ndesigned to transmit data, but are capable of supporting\
    \ a wide variety of\n\napplications (including those that may arise in the future).\
    \ \n\nWe know that in the beginning, computer networks were really used to\n\n\
    transmit data. But with the development of network technology, the\n\napplication\
    \ scope of a computer network is increasing, not only networks can\n\ntransmit\
    \ audio and video files, but also the application scope has far exceeded\n\nthe\
    \ general communication scope and can be perfectly used for many\n\napplications.\
    \ \n\nIt is generally believed that computer network refers to the connection\
    \ of\n\nmultiple computers and network equipment with independent instruments\
    \ in\n\ndifferent geographical locations through communication lines (including\n\
    \ntransmission media and network equipment). A computer system for resource"
