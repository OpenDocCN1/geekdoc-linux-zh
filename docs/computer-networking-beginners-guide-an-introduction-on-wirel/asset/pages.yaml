  md: "**Communications **\n\nAt the beginning of computer communication, systematization\
    \ and\n\nstandardization did not get enough attention. Each computer manufacturer\n\
    \nproduces its own network products to enable computer communications. No\n\n\
    strong sense of systematization, layering, etc. In 1974, IBM released the\n\n\
    SNA, which exposed the company's computer communications technology as\n\na systematic\
    \ network architecture. Since then, computer manufacturers have\n\nalso released\
    \ their own network architecture, triggering the systematization of\n\nmany protocols.\
    \ However, the various network architectures and protocols of\n\nvarious manufacturers\
    \ are not compatible with each other. Even if two\n\nheterogeneous computers are\
    \ connected on the physical level, normal\n\ncommunication cannot be realized\
    \ because of the different network\n\narchitecture and the different protocols.\
    \ \n\nThis is extremely inconvenient for the user. Because this means that the\n\
    \ncomputer network products of which vendor was used in the first place can\n\n\
    only be used from the same vendor all the time. If the relevant vendor goes\n\n\
    bankrupt or the product exceeds its service life, the entire network equipment\n\
    \nmust be replaced. In addition, it is not uncommon for different departments\
    \ to\n\nbe unable to communicate even when they are physically connected to each\n\
    \nother because the network products used are not the same. The lack of\n\nflexibility\
    \ and extensibility made it difficult for users to use computer\n\ncommunication\
    \ freely. \n\nWith the increasing importance of computers, many companies have\n\
    \ncome to realize the importance of compatibility. People began to work on\n\n\
    technologies that would allow heterogeneous models produced by different\n\nmanufacturers\
    \ to communicate with each other. This promotes the openness\n\nand versatility\
    \ of the web. \n\nIn order to solve these problems, ISO (International Organization\
    \ for\n\nStandards) has established an International standard, Osi (Open Systems\n\
    \nInterconnection reference model), and standardized the communication\n\nsystem.\
    \ Currently, OSI protocols are not commonly used, but the OSI\n\nreference model,\
    \ which was the guideline of Osi Protocol design, is often\n\nused in the development\
    \ of network protocols. \n\nThe standardization of the protocol also enables all\
    \ devices that follow\n\nthe standard protocol to no longer be unable to communicate\
    \ due to\n\ndifferences in computer hardware or operating systems. Therefore,\
    \ the"
  merge: -1
  pgno: 15
- img_proc: true
  md: "standardization of protocols has also promoted the popularization of\n\ncomputer\
    \ networks. \n\nIn the real world, there are many good technologies that are not\
    \ widely\n\navailable because their development companies do not publish the\n\
    \nappropriate development specifications. If companies can make their\n\ndevelopment\
    \ specifications public, and more of their peers can use them in\n\ntime and become\
    \ industry standards, then there will be more and better\n\nproducts that can\
    \ survive and be used by us. \n\nOSI reference model \n\nThis model divides the\
    \ necessary functions of the communication\n\nprotocol into 7 layers. Through\
    \ these layers, the more complex network\n\nprotocols are simplified. In this\
    \ model, each layer receives a specific service\n\nprovided by its lower layer\
    \ and is responsible for providing a specific service\n\nto its upper layer. The\
    \ conventions that govern the interaction between upper\n\nand lower layers are\
    \ called \"interfaces. \". The conventions that govern\n\ninteractions between\
    \ layers are called protocols. \n\nProtocol layering is like modular development\
    \ in computer software. The\n\nrecommendations of the OSI reference model are\
    \ ideal. It wants to implement\n\nall the modules from the first layer to the\
    \ seventh layer and combine them to\n\nachieve network communication. Layering\
    \ allows each layer to be used\n\nindependently, so that even if some of the layering\
    \ changes in the system, it\n\ndoes not affect the whole system. Therefore, it\
    \ is possible to construct a\n\nsystem that is both extensible and flexible. In\
    \ addition, by layering the\n\ncommunication functions can be subdivided, making\
    \ it easier to implement\n\nseparate protocols for each layering and to define\
    \ the specific responsibilities\n\nand obligations of each layering. These are\
    \ all advantages of layering. The\n\ndownside of layering may be over modularity,\
    \ making processing more\n\nburdensome, and having to implement similar processing\
    \ logic for each\n\nmodule.\n\nUnderstanding Layering Through a Simple Example\
    \ \n\nFirst, take telephone chat as an example. two people, Adam and Eve, are\n\
    \ntalking on the telephone (communication device) in English (language\n\nprotocol).\
    \ On the surface, Adam and Eve are having a direct conversation in\n\nEnglish,\
    \ but in reality, Adam and Eve are both listening to the voice on the\n\nreceiver\
    \ of the telephone, both speaking into the microphone. Imagine what a\n\nperson\
    \ who has never seen a telephone would think if they saw this? I'm"
  merge: -1
  pgno: 16
- img_proc: true
  md: "afraid he must think Adam and Eve are talking on the telephone in\n\nnetworking\
    \ perspective.\n\nThe language protocol they use in an audio input to the microphone\
    \ is\n\ntranslated into radio signals at the communications device level. Sent\
    \ to each\n\nother's phones, and then converted to audio output by the communications\n\
    \nequipment layer, passed to each other. Thus, Adam and Eve actually have a\n\n\
    conversation using an interface between the telephone and the voice\n\nconverted\
    \ by audio. \n\nPeople often think that when they pick up the phone to talk to\
    \ someone,\n\nit's as if they're talking to them directly, but if you look closely,\
    \ it's really the\n\nphone that's mediating the whole process, and there's no\
    \ denying that. What if\n\nthe electronic signals from Adam's phone were not converted\
    \ into sounds of\n\nthe same frequency as those from Eve's? This is similar to\
    \ the difference in\n\nprotocol between Adam's phone and Eve's phone. Eve May\
    \ hear the voice\n\nand feel that he is not talking to Adam, but to someone else.\
    \ If the\n\nfrequencies are far apart, Eve is more likely to think he is not hearing\n\
    \nEnglish. \n\nSo, what if we change the communication device layer by assuming\
    \ that\n\nthe language layer is the same. For example, change the telephone to\
    \ a radio.\n\nIf the communication equIPment layer uses the radio, they must learn\
    \ to use\n\nthe radio method. Since the language layer is still using the English\
    \ protocol,\n\nusers can talk just as normally as they used to when they were\
    \ on the phone. \n\nSo, what if the communication device layer uses a telephone\
    \ and the\n\nlanguage layer changes to English? It is clear that the telephone\
    \ itself will not\n\nbe limited by the user's language. Therefore, this situation\
    \ and the use of\n\nEnglish calls exactly the same, still can be achieved call.\
    \ \n\nThe previous example simply divides the protocol into two layers.\n\nHowever,\
    \ the actual packet communication protocols can be quite complex.\n\nThe OSI reference\
    \ model organizes such a complex protocol into seven easy-\n\nto-understand layers.\
    \ \n\nOSI Reference Model \n\nThe OSI reference model does a good job of summarizing\
    \ the necessary\n\nfunctions for communication. Network engineers also often prototype\
    \ the\n\nlayers of the OSI reference model when discussing protocol-related issues.\n\
    \nFor beginners in computer networks, learning the OSI reference model can be\n\
    \nthe first step to success."
  merge: -1
  pgno: 17
- img_proc: true
  md: "The OSI reference model is, after all, a \"model, \" a rough set of\n\ndefinitions\
    \ of what each layer does, without a detailed definition of the\n\nprotocol and\
    \ interface. It serves only as a guide to learning and designing\n\nprotocols.\
    \ Therefore, if you want to know more details about the agreement,\n\nit is necessary\
    \ to refer to the specific specifications of each agreement itself. \n\nMany communication\
    \ protocols correspond to one of the seven layers of\n\nthe OSI reference model.\
    \ From this, we can get a general idea of the position\n\nand function of the\
    \ protocol in the whole communication function. While it\n\ntakes a careful reading\
    \ of the specification to understand the protocol, its\n\ngeneral purpose can\
    \ be found at the corresponding OSI model layer. This is\n\nwhy the OSI model\
    \ is the first to be studied before learning about each\n\nprotocol. \n\nThe OSI\
    \ (Reference Model) divides communication functions into seven\n\nlayers, called\
    \ the OSI reference model. The OSI Protocol, based on the OSI\n\nReference Model,\
    \ defines the protocol and interface-related standards for\n\neach layer. Products\
    \ that follow the OSI Protocol are called Osi products, and\n\nthe communications\
    \ they follow are called Osi Communications. Do not\n\nconfuse \"Osi reference\
    \ model\" with \"OSI protocol\" because of their different\n\nmeanings."
  merge: -1
  pgno: 18
