  md: "government use but needs an upgrade of hardware for implementation. As\n\n\
    most organizations are replacing older wireless access and wireless-enabled\n\n\
    equipment, advanced encryption standard is expected to become the standard\n\n\
    encryption for the security of wireless connections.\n\nCounter mode with cipher\
    \ block chaining message authentication code\n\nprotocol.\n\nAs an encryption\
