  md: "discouraged. In this section, I'll try to cover a few of the most common wiring\n\
    \nenvironments and how to best go about running your wires. \n\nIf your whole\
    \ building is in one section and has drop ceilings throughout\n\nand relatively\
    \ new construction, stop now. Give thanks to “Wirus,” the\n\nancient god of networking,\
    \ and be happy throughout your life. However, if\n\nyou have old construction,\
    \ a four-story house built in sections over the last\n\n200 years, with stucco\
    \ and plaster walls, concrete floors and timbers brought\n\nover on the Mayflower...\
    \ quit now and find another job. You're in trouble.\n\n(Don't forget, cruel and\
    \ unusual punishment is forbidden under the\n\nconstitution!) \n\nDrop Ceilings\
    \ \n\nIn case you don’t know what drop ceilings are, they are the tiled ceilings\n\
    \nwhere every third one or so is a fluorescent light fixture and each tile is\
    \ held\n\nup by a grid of metal framing. The grid work is held up with wires that\
    \ attach\n\nto the ceiling above. This ceiling is \"dropped\" down from the real\
    \ ceiling to a\n\nstandard height throughout the room or building. In between\
    \ the drop ceiling\n\nand the real ceiling is a lot of space, electrical conduits\
    \ and wiring, the lights\n\n(of course), the air conditioning ductwork, and a\
    \ few other surprises. \n\nIt's not hard to wire a building through the drop ceiling\
    \ area but you'll\n\nneed to be prepared for it. First of all, do not climb up\
    \ into the ceiling and\n\nexpect to walk on it! You'll undoubtedly fall right\
    \ through. It's made to hold\n\nup ceiling tiles and lights, not people. So how\
    \ do you do it? Well, to start\n\nwith, open a tile as close as possible above\
    \ the wall in the phone closet where\n\nyour mounting board will be. Next, get\
    \ a flashlight, climb a ladder to about\n\nchest height into the ceiling, and\
    \ look around to see what kind of layout it\n\nhas. \n\nIn most newer construction,\
    \ the walls to the office areas only extend a\n\nfew inches above the drop ceiling.\
    \ They are usually at standard heights —\n\nmaybe eight feet—with the ceiling\
    \ just a few inches below. The only walls\n\nthat will extend to the real ceiling\
    \ are the fire walls between major sections of\n\na building. These are also made\
    \ of sheet rock and can usually be penetrated\n\nwith no problem to run small\
    \ wires. If this is what you find, you should have\n\nrelatively easy wiring runs.\
    \ \n\nAfter getting your bearings, you'll want to open a tile at the first\n\n\
    destination you will be wiring. Check the path between the two sections for\n\n\
    obstructions, ductwork to go around, and other possible problems. Decide on\n\n\
    the best direction to go first and head in that direction. How, you ask? Well,"
  merge: -1
  pgno: 37
- img_proc: true
  md: "you can't walk or crawl up there, so you have to figure out a way to get the\n\
    \nwires from point A to point B. \n\nThere are several methods for doing this.\
    \ A couple of my favorites almost\n\nmake it fun. All of them involve string.\
    \ By passing a string along the same\n\npathway, you can tie the wire to it and\
    \ pull it through. (They don't call it\n\npulling wire for nothing, you know.)\
    \ Don't use weak string or small-sized\n\nstring, like kite string, because pulling\
    \ on it can cut your hands or it could\n\nbreak if the wire gets stuck. Use a\
    \ nylon string with several fibers woven\n\ntogether like a small rope. For example,\
    \ the string used for tying packages\n\nshould do nicely. \n\nGo to an area 20\
    \ to 30 feet from the first open tile, between the two that\n\nare already open,\
    \ and open a third tile. Run the string from the first open tile\n\nto the next\
    \ one down the line and repeat every 20 to 30 feet until you reach\n\nyour destination.\
    \ To get the string from the first hole to the second, you can\n\nuse one of these\
    \ interesting methods: \n\n• Get a small crossbow and tie the string to the arrow.\
    \ Be sure and take\n\nthe point off if possible, or make sure you avoid hitting\
    \ anything that could\n\nbe damaged. Just fire across the next opening so that\
    \ you can find the string\n\nwhen you get there. You might be able to use a toy\
    \ dart gun as you would the\n\ncrossbow. \n\n• Tie something heavy to the string\
    \ and toss or throw it toward the goal.\n\nThis is a little more cumbersome, but\
    \ since we network types rarely have\n\ncrossbows around, it's more likely you'll\
    \ end up using this method. Some of\n\nthe better items to tie on are large fishing\
    \ weights, a roll of tape (electrical\n\ntape works okay; duct tape rolls are\
    \ pretty heavy and could cause problems),\n\na pair of pliers, or some other tool\
    \ like an adjustable wrench. Try to avoid\n\nthings that will wobble in flight,\
    \ or that may stick through the ceiling tiles\n\nwhen they land. \n\n• If there's\
    \ very little room above the ceiling tiles — I hate this one — you\n\nmay have\
    \ to take them off one at a time and just pull the string from one to\n\nthe next\
    \ until you reach the end. \n\nIn all cases, be sure to pull out enough string\
    \ to get to the next location\n\nbefore you shoot or toss the end of the string.\
    \ Otherwise, you throw the\n\nweight and it bounces right back at you when it\
    \ reaches the end of the string.\n\nAlso — sorry, I have to say this — be sure\
    \ you have one end of the string\n\nsecured before you throw or shoot it. It's\
    \ very frustrating to send the whole\n\nroll of string across the ceiling and\
    \ have to do it over. Once you reach the"
  merge: -1
  pgno: 38
- img_proc: true
  md: "next hole, simply repeat the process until you have one long string stretched\n\
    \nfrom one end to the other. \n\nThe string method can also work in other types\
    \ of wiring situations, but\n\ndon't try to use it for close spaces or in areas\
    \ that require the wire to make a\n\nlot of corners in the run. \n\nWhen you get\
    \ the string run, you're ready to pull the wire through. It\n\nworks best to have\
    \ someone at one end feed the wire to you while you pull\n\nfrom the other end.\
    \ Occasionally you'll get the wire stuck on something and\n\nmay have to open\
    \ a tile where the wire is stuck to get it to continue feeding\n\nthrough. The\
    \ wires that hold the ceiling grid up are notorious for this, because\n\nthey\
    \ make a loop in the gridwork and then wrap around themselves, leaving\n\nthe\
    \ loose end sticking up. \n\nString and Wire Tied Together for Pulling\n\nEach\
    \ run is pretty much the same from here. You can move from one\n\nlocation to\
    \ the other by following the above instructions for each location.\n\nOnce you\
    \ get to each location, you'll have to decide whether to run the wire\n\ndown\
    \ the wall, inside the wall to an existing box, or inside the wall to a new\n\n\
    box that you add. \n\nOther Types of Construction \n\nOf course, not all construction\
    \ is new and there are other methods of\n\nrunning wires. You may have to ask\
    \ someone about your particular setup.\n\nSome buildings have wire conduits pre-installed\
    \ with room for more wires to\n\nbe pulled through them. Some have basements or\
    \ crawl spaces through which\n\nyou can run your wires. In some cases, you may\
    \ have to actually run the\n\nwires around the outside of the building to get\
    \ from one room to the next.\n\nCable and phone companies do this. \n\nJust make\
    \ sure you've looked at all your options and picked the best one\n\nbased on ease\
    \ of installation, cosmetics, expandability, protection for the\n\nwires (from\
    \ the elements, animals, and so on), and ability to get to the phone\n\ncloset.\
    \ \n\nWiring in Walls \n\nOnce you get from the phone closet to just above your\
    \ first drop location,\n\nyou may be able to run the wire down the inside of the\
    \ wall. If this is a sheet\n\nrock or wallboard wall on standard studs, you should\
    \ be able to do this easily,\n\nespecially if there is no insulation in the wall.\
    \ (Internal walls rarely have\n\ninsulation unless sound proofing is necessary.)\n\
    \nRunning Wire Down a Wall Between Studs"
