    \ They can work for extended\n\nperiods of time and the user may not know that\
    \ they hide within their system.\n\nThey hide without the knowledge or consent\
    \ of the user. They are specifically\n\ndesigned to cause harm, retrieving information,\
    \ payment extortion, or for\n\nsabotaging the system. Both hostile software and\
    \ intrusive software falls into\n\nthe category of malware. These include a variety\
