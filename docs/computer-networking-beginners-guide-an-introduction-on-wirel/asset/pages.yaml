  md: '1\. Multiply each bit position value the hexadecimal with the


    corresponding digits in the number.


    *2\. Add all the results.*


    Example: convert a hex 0x179 into decimal value. The ‘ox” before the


    number is used remind that it is a hex number, not a decimal number.


    Hex number


    1


    7


    9


    Decimal value


    Bit position


    162=256


    161=16 160=1


    Multiply by position value 1x256=256 7x16=112 9x1=9 256+112+9=377


    Therefore, the hex 0x179 equivalent of decimal is 377.


    **IPv6 structure**


    An IPv6 address is represented with eight distinct four-digit hexadecimal


    numbers. Each of the four digits is separated by a colon (:). An example of


    IPv6 is


    1041:0000:130B:0000:0000:09C1:586D:1305


    Since a single hex digit is 4 bit long, the eight group of four-hexadecimal


    digit will be equivalent to 4x4x8=128 bits long.


    **Remember the following rules**


    1\. All the leading 0s in IPv6 can be omitted, if you want.


    2\. ‘0000’ can be compressed into ‘0’.


    3\. If a digit starts with a zero you can omit it. For example, 09C1 can


    be written as 9C1.


    *4\. A continuous block of zeros can be represented as a double colon*


    *(::)*


    By applying the above rules, you can rewrite the given IPv6 in the


    example as below:


    1041: 0:130B:: 9C1:586D:1305


    When shortening an IPv6 address with the above rules, you must


    remember that you can use a double colon only once in an IPv6.


    In IPv6 subnet is known as prefix.


    All the prefix length is written in decimal value.


    If an IPv6 ends with a double colon, you can omit it. For instance, the


    IPv6


    8721:968:8680:256::/64 can be rewritten as 8721:968:8680:256/64'
