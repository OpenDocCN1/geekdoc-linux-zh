  md: '15 entries to see where it needs to send the destination packet. However, we


    are going to help with that situation by summarizing each of the LAN’s


    networks and advertising their summary address to the HQ router. This will


    reduce the amount of entries to the three learned routes and in turn, its three


    connected routes. Doing this will decrease the overhead and the router would


    only have to look at the three learned routes instead of twelve. So, how do we


    do this? Let’s take a look, shall we?


    Bear in mind that the starting mask is /24. Subsequently, we count left to


    right; you would start at the beginning of the third octet, which is the


    interesting octet.


    The summary address 192.168.8.0/22


    Now that we found our summary address by drawing the line between the


    common and un-common bits, it’s time to advertise to the HQ router through


    the interface that faces the HQ router. Following is the command you would


    use:


    LAN1


    IP summary-address EIGRP 100 192.168.0.0 255.255.252.0


    LAN2


    IP summary-address EIGRP 100 192.168.4.0 255.255.252.0


    LAN3


    IP summary-address EIGRP: 100 192.168.8.0 255.255.252.0


    Let’s take a look at the HQ routers routing table after we advertise the


    summary routes.


    ***HQ#sh ip route***


    Codes: C - connected, S - static, I - IGRP, R - RIP, M - mobile, B - BGP


    D - EIGRP, EX - EIGRP external, O - OSPF, IA - OSPF inter area


    N1 - OSPF NSSA external type 1, N2 - OSPF NSSA external type 2


    E1 - OSPF external type 1, E2 - OSPF external type 2, E - EGP


    i - IS-IS, L1 - IS-IS level-1, L2 - IS-IS level-2, ia - IS-IS inter area


    \* - candidate default, U - per-user static route, o - ODR


    P - periodic downloaded static route


    ***Gateway of last resort is not set***


