  md: "In a word, the protocol is a kind of \"agreement\" that the client computer\n\
    \nand the server computer realize the communication through the network. This\n\
    \n\"convention\" allows computers that are made up of different devices from\n\
    \ndifferent vendors, different CPUs, and different operating systems to\n\ncommunicate\
    \ with each other as long as they follow the same protocol. On\n\nthe other hand,\
    \ if different protocols are used, communication cannot be\n\nachieved. It's like\
    \ two people speaking in different languages who can't\n\nunderstand each other.\
    \ There are many types of protocols, each of which\n\nclearly defines its code\
    \ of conduct. Two computers must be able to support\n\nthe same protocol, and\
    \ follow the same protocol for processing, so as to\n\nachieve mutual communication.\
    \ \n\nBefore starting to dwell on the topic of protocols further let us discuss\n\
    \ntwo very basic things that you need to know for better understanding. They\n\
    \nare the central processing unit and operating system. \n\nCPU \n\nCPU (Central\
    \ Processing Unit). It's like the \"heart\" of a computer, every\n\nprogram Is\
    \ actually scheduled and executed by it. The performance of the\n\nCPU also determines\
    \ the processing performance of a computer to a great\n\nextent. So, people often\
    \ say that the history of the computer is actually the\n\nhistory of the CPU.\
    \ At present, people often use CPU Intel Core, Intel Atom,\n\nARM CORTEX, and\
    \ other products.\n\nOperating System\n\nOs (Operating System) Operating System,\
    \ is a kind of basic software. It\n\nintegrates the CPU management, memory management,\
    \ computer perIPherals\n\nmanagement, and program management and other important\
    \ functions. The\n\ntreatment of TCP or IP protocols described here, in many cases\
    \ is already\n\nembedded in specific operating systems. Today's operating systems\n\
    \ncommonly used in personal computers are UNIX, Windows, Mac OS x,\n\nLinux, and\
    \ so on. \n\nThe instructions that can be run in a computer vary from one CPU\
    \ to\n\nanother and from one operating system to another. Therefore, programs\n\
    \ndesigned for certain CPUs or operating systems may not run directly if they\n\
    \nare copied directly to computers with other types of CPUs or operating\n\nsystems.\
    \ The data stored in a computer also varies from CPU to the operating\n\nsystem.\
    \ Therefore, if the CPU and the operating system between different\n\ncomputers\
    \ to achieve communication, IT needs a party to support the"
