  md: "**Protocol **\n\n![](img/0937bf4b1739a36662bbe2484b163f1b_12_0.png)\n\nIn \n\
    \nthe \n\nfield \n\nof\n\ncomputer network and information communication, people\
    \ often refer to the\n\nword \"protocol\". The representative protocols in common\
    \ use on the internet\n\nare IP, TCP, HTTP and so on. The protocols commonly used\
    \ in Lan (local\n\narea network) are IPX / SPX (NetWare system protocol developed\
    \ by Novell)\n\nand so on. \n\n**Why protocols are needed? **\n\nTypically, we\
    \ send an E-mail, visit a home page to get information and are\n\nunaware of the\
    \ protocol that goes on in the background, which is only\n\npossible if we reconfigure\
    \ the computer's network connection and modify\n\nnetwork settings. So as long\
    \ as the network is set up and connected\n\nsuccessfully, people often forget\
    \ about protocols and things. As long as the\n\napplication knows how to leverage\
    \ the protocols, it should be enough to\n\nallow people to use the network connection\
    \ they have built. It is not\n\nuncommon for a person to be unable to access the\
    \ Internet because they do\n\nnot understand certain protocols. However, in the\
    \ process of communication\n\nthrough the network, the protocol plays a vital\
    \ role and as you are keen on\n\nknowing about protocols can give you a good overview\
    \ of the topic."
  merge: -1
