  md: '**802.11i Robust security networks**


    ![](img/0937bf4b1739a36662bbe2484b163f1b_44_0.png)


    802.11i


    The 802.11 wireless connection standards were designed to replace the


    earlier wired privacy equivalent protocol. The 802.11i is also known as the


    Robust Security Network while the 802.11i gives advanced authentication via


    a variety of protocols such as RADIUS, extensible authentication protocol,


    and 802.1x including robust security with the advanced encryption standard -


    the CCCMP protocol. Equally important is that 802.11i supports the temporal


    key integrity protocol that enables the upgrading of earlier wired privacy


    equivalent hardware. The 802.11i also accommodates the temporal key


    integrity protocol that is less robust than advanced encryption standard - the


    Counter Mode with CCCMP Protocol though it is superior to wired privacy


    equivalent.


    Certification


    The Wireless-fidelity Alliance, Wireless-fidelity, avails the certification


    for 802.11i-compliant products including the Wireless-fidelity Protected


    Alliance logo program, WPA. The Wireless-fidelity Protected Alliance and


    Wireless-fidelity Protected Alliance 2 logos certify compliance with an


    802.11i subset or the full 802.11i protocol. By having a central authority


    manage the development and implementation of the standard, consistency,


    and quality is likely to be assured. Additionally, having a central point of


    harmonizing the development is necessary to enhance security by ensuring'
  merge: -1
  pgno: 44
- img_proc: true
  md: "that only good-intentioned entities are participating in the development and\n\
    \napproval of standards.\n\nTemporal Key Integrity Protocol\n\nThe TKIP refers\
    \ to an encryption protocol that is integral of the 802.11i\n\nstandard for WLANs\
    \ and was built to give more secure encryption compared\n\nto the flawed wired\
    \ privacy equivalent, the earlier wired local connection\n\nsecurity protocol.\
    \ The temporal key integrity protocol is the encryption\n\ntechnique used in Wireless-fidelity\
    \ Protected Access that replaced wired\n\nprivacy equivalent in wireless connections\
    \ or networks. In application, the\n\ntemporal key integrity protocol consists\
    \ of algorithms that function as a\n\nwrapper to a wired equivalent protocol that\
    \ allows legacy wireless LAN\n\nequipment to upgrade to temporal key integrity\
    \ protocol devoid of the need to\n\nreplace the hardware. Temporal key integrity\
    \ protocol works by utilizing the\n\nearlier wired equivalent protocol programming.\
    \ Notably, the new encryption\n\ncodes packets of data with a distinct encryption\
    \ key and they are more robust\n\ncompared to the ones used in earlier encryption.\
    \ Temporal key integrity\n\nprotocol enhances robustness by adding four additional\
    \ algorithms:\n\nThere is a cryptographic message integrity check to safeguard\
    \ packets:\n\n• An instantiation: It is a vector sequencing mechanism that compromises\n\
    \nof hashing rather than wired privacy equivalent’s plain text transmission.\n\
    \nHashing implies that the data is encrypted and given a unique value that can\n\
    \nbe checked to establish any modification during transmission. \n\n• There is\
    \ a per-packet key blending function to enhance cryptographic\n\nrobustness. By\
    \ mixing encryption spends, it becomes exceeding difficult for\n\nmalicious users\
    \ to compromise the data integrity as the computational power\n\nneeded to break\
    \ the encryption becomes nearly infeasible.\n\n• There is a re-keying technique\
    \ to generate keys every 10, 000 packets.\n\nBy creating new keys per a set number\
    \ of transmitted packets, it becomes\n\ndifficult for attackers to establish a\
    \ common pattern in the data intercepted\n\nwhich enhances the strength of the\
    \ security on the wireless connection.\n\nWhereas, temporal key integrity protocol\
    \ is critical for upgrading the\n\nsecurity on devices initially equipped with\
    \ wired privacy equivalent and does\n\nnot respond to all of the issues of security\
    \ facing wired local area connections\n\nand may not be efficient or reliable\
    \ enough for sensitive government and\n\ncorporate transmission of data. The advanced\
    \ encryption standard is specified\n\nin the 802.11i standard alongside temporal\
    \ key integrity protocol. Advanced\n\nencryption standard gives a higher degree\
    \ of security and is recommended for"
