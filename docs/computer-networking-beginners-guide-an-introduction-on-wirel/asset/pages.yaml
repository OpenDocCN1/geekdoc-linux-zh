  md: "Sometimes the back wall of a building ends up serving the purpose. Just work\n\
    \nwith what you've got! \n\n• There should be some sort of access to the room\
    \ for wires to be run\n\nfrom the various locations. Don't choose a room with\
    \ concrete sides, ceiling\n\nand floor. Access to a drop ceiling or attic is necessary.\
    \ \n\n• You should have enough room to work in the closet without bumping\n\n\
    into things or having to stand on your head to reach the wires and\n\nconnections.\
    \ You'll be spending a lot of time in here at first. When you have\n\ntroubleshooting\
    \ to do, you'll want a comfortable place to stand while you\n\ncheck the wiring.\
    \ \n\n• Be sure you select a room that has air conditioning or doesn't get too\n\
    \nhot. Most electronic equipment requires a cooler environment because\n\noverheating\
    \ can almost always cause damage. \n\n• Finally, the closet should have a wall\
    \ with space from chest level to eye\n\nlevel on which to attach a large board\
    \ where equipment and wires will be\n\nmounted. \n\nThe mounting board can be\
    \ made out of shelving or plywood and should\n\nbe large enough for all your equipment.\
    \ You should also be able to route the\n\nwires around the equipment to their\
    \ connections, as shown in the figure\n\nbelow. \n\nMounting Board with Network\
    \ Equipment\n\nBuilt-in Expansion Ideas \n\nI think “Murphy” has a law that states,\
    \ \"The size of your network will\n\ngrow to a number greater than the maximum\
    \ possible connections you have\n\nplanned.\" There is no ultimate defense for\
    \ this, other than planning for the\n\nlargest network you can imagine and redesigning\
    \ it whenever you approach\n\n80 or 90 percent capacity. \n\nIf you have a small\
    \ network in a growing company, you will definitely\n\nhave growth in the network.\
    \ When new machines are purchased for existing\n\nusers, the old machines rarely\
    \ get retired. Usually, they end up on someone's\n\ndesk who wanted a computer\
    \ but had to wait for a hand-me-down. Or they\n\nend up on a vacant desk where\
    \ it becomes a server of some sort, for e-mail,\n\nfile or print services, and\
    \ so on. When it gets to that desk, it usually has to be\n\nconnected to the network.\
    \ There must be a thousand scenarios like this one,\n\nso suffice it to say that\
    \ you need to plan for at least double the number of\n\nconnections you have now."
