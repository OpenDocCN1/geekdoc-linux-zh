    \ your network? In other\n\nterms, what initial inconvenience will you face when\
    \ you decide to\n\nimplement the 802.11i standard on your network?\n\n**Management\
    \ Operations**\n\nNetwork management refers to the process of managing and administering\n\
    \ncomputer networks. Services provided by network management include\n\nperformance\
    \ management, network provision, fault analysis, and maintaining"
  merge: -1
  pgno: 46
- img_proc: true
  md: "the quality of the network. Network management software is the software that\n\
    \nis used by network administrators to execute their functions.\n\nNetwork and\
    \ network device management is supported by accessor\n\nmethods. Network management\
    \ makes it easy for Information Technology\n\nmanagers to keep an eye on network\
    \ devices and components in a large area\n\nnetwork. Examples of access methods\
    \ that are used include:\n\nCommand-line interface (CLI)\n\nCustom XML\n\nTranslation\
    \ Language 1(TL1)\n\nJava Management Extensions (JMX)\n\nCommon Information Model\n\
    \nWindows Management Instrumentation (WMI)\n\nNetwork management also uses schemes\
    \ such as MTOSI and the\n\nStructure of Management Information (SMI).\n\nManagement\
    \ Architecture\n\nNetworks continue to be distributed and complicated as time\
    \ goes by. As\n\na result, faults such as performance degradation, resource allocation,\
    \ service\n\nprovision, and bandwidth monitoring and hardware failure are difficult\
    \ to\n\nsolve and become significant hurdles for network managers. \n\nNetwork\
    \ Scanning\n\nNetwork scanning is a process that is used to recognize active hosts\
    \ on a\n\ncomputer network, either for security assessment or to attack them.\
    \ \n\nMethods such as port scans and ping sweeps provide information such as\n\
    \nthe mapping of IP addresses to live hosts that are active on the internet.\n\
    \nBesides, network scanning is essential because it enables an attacker to\n\n\
    assume viable addresses by returning data regarding the Internet protocol\n\n\
    address that don’t map on hosts which are live. Scanning is a component of\n\n\
    gathering intelligence for an intruder or attacker. During scanning, the\n\nintruder\
