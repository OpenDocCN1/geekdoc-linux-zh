    **Crimeware**


    The software tools, which the hackers use for hacking, are sometimes


    referred to as crimeware. Crimeware can be defined as software that is:


    Not generally a desirable hardware or software application.


    Mostly used for criminal activities online.


    Not involuntarily enabling the crime.


    One such type of crimeware is the bot. Bots are described in brief below.


    **Bots**


    What is a bot?


    Bot is the short form for robot, but they''re different from the robots


    shown in science fiction movies. They are not even the robots from


    production line manufactured by companies. They can be considered one of


    the most sophisticated crimewares that the Internet is facing today. These


