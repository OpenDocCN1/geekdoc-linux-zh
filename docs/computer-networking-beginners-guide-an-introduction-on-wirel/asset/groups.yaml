    ## Using 802.11 on Windows 10


    802.11 is an IEEE network standard that regulates wireless network relaying techniques.
    They are available in the versions below to provide wireless connectivity in environments
    such as homes and businesses.


    1. 802.11n

    2. 802.11g

    3. 802.11b

    4. 802.11a


    802.11n which is the latest version is a non-wired standard that has many antennas
    to improve the rate of data transfer. The throughput of this version is affected
    by rate, interference from other networks, and the network setup. If you notice
    that your WIFI network is not working for any reason, use the following procedure
    to look at the settings for 802.11n connections and re-enable it if required.


