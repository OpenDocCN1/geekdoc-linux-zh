    Click the Wireless-fidelity icon available on your Windows 10 taskbar and choose
    ‘Open Network and Sharing Center’ option. Click on change adapter settings. Select
    the properties for the WIFI adapter and then under advanced tab search for 802.11.
    Select it and change its value to “Enabled.”


    ### Windows computer authentication


    When you authenticate something, the objective is to confirm that it is genuine.
    In computer networking, authentication refers to the process of proving identity
    to an application on the connection or network or a resource. Generally, identity
    is verified by a cryptographic operation that uses a key that is only known to
    the user. The server side of the authentication makes a comparison of the shared
    information with a known cryptographic key to verify the authentication attempt.


    Cryptographic keys are usually stored in a central location to make the authentication
    process maintainable and scalable. An active directory is the standard recognized
    technology for storing identity data that includes the cryptographic keys. Kerberos
    and NTLM implementations require an active directory. Windows authentication methods
    range from a simple login to the operating system or a sign in to an application
    or a service. This method identifies users based on something that only the user
    knows such as a password or tokens.


