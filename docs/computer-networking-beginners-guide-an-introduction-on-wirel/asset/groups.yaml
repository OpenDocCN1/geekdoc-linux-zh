    ## 多组播地址


    IPv6 中没有广播地址，因为它不支持广播流量。相反，你必须使用多组播地址将数据包发送到特定的主机组。识别 IPv6 多组播地址最简单的方法是每个组播 IP
    的第一个字节始终以 FF 开头。


    IPv6 多组播地址使用的前缀是 FF00::/8。


    0xFF 之后的第一个字节表示寿命，第二个字节表示多组播的范围。组播的寿命可以是永久的也可以是瞬时的。范围可以是以下任何一种：


    - 1. 节点 Node (0001)

    - 2. 链路 Link (0010)

    - 3. 子网 Subnet (0011)

    - 4. 管理 Admin (0100)

    - 5. 站点 Site (0101)

    - 6. 组织 Organization (1000)

    - 7. 全局 Global (1110)


    其余 112 位用于表示多组组 ID。某些多组播地址被保留用于特定用途。这些预留的多组播地址是：


    - FF01::1—向所有节点/所有主机进行组播

    - FF02::1—组播到所有主机（链路本地范围）

    - FF01::2—组播到所有路由器（接口本地范围内）

    - FF02::2—组播到链路中的所有路由器

    - FF05::2—组播到站点内的所有路由器（站点本地范围）

    - FF02::5—组播到所有 OSPFv3 路由器

    - FF02::6—组播到所有 OSPFv3 指定路由器

    - FF02::A—组播到 EIGRP 路由器

    - FF02::D—组播到 PIM 路由器

    - FF02::1:FFXX:XXXX—请求节点多组播地址（此处 XX:XXXX 代表 IPv6 接口地址的低 24 位）


    ## 建筑物的布线


    当你开始为一座建筑进行网络布线时，这看起来让你很奇妙且震撼。关于如何处理每个细节的问题会在脑海中闪过，疑虑开始滋生。深吸一口气，记住那句老谚言：“千台计算机的网络始于一根线。”


    ### 通用网络安装概述


    一旦你开始，它就会变成一个游戏，并很快到位。开始前的良好组织可以解决过程中的大量问题。这里有一个按时间顺序排列的任务清单，会有很大帮助。


    1. 决定电话柜的位置。

    2. 绘制一张包含当前和未来计算机及打印机位置的网络图。

    3. 对网络图上的设备编号以备后参考。

    4. 想出从每个位置到机房的布线最佳方法。

    5. 在连接任何设备之前布好所有线缆。记得测试它们。

    6. 安装所有连接器和模块。

    7. 连接网络并进行测试。


    听起来挺容易的，对吧？其实真的那么简单，尽管你肯定会在过程中遇到一些意料之外的障碍，让你感到沮丧，并怀疑自己为什么要开始这个疯狂的项目。但不要不要！本章将帮助你避免一些最常见的问题，或者至少意识到它们以便你克服它们。同时，至少知道这些问题发生在每个人身上也是一种令人宽慰的。同病相相怜，对吧？


    ### 电话柜


    它不仅为你提供了一个中心化的、不干扰的地方来布线和设置网络设备，它还可以作为那些在办公环境中暴露会很碍眼的物品的藏身之处。你的电话柜应该提供这些基本功能：


    - 如果可能，它应该位于中心位置，这样你就可以从每个设备位置布线并保持距离最短。有时建筑的后墙就能起到这个作用。利用你现有的资源即可！

    - 房间应该有某种入口，以便线缆从不同位置接入。不要选择侧壁、天花板和地板都是混凝土的房间。必须进入吊顶或阁楼。

    - 你应该有足够的空间在柜子里工作而不碰撞东西，也不需要倒立着够到线缆和连接。起你会在这里花费大量时间。当你需要排除故障时，你在检查布线时需要一个舒适站的地方。

    - 确保选择一个有空调或不会太热的房间。大多数电子设备需要凉爽的环境，因为过热几乎总是会导致损坏。

    - 最后，柜子应该有一面墙，从胸部到眼睛部的高度有空间，在上面安装一块大板，用于安装设备和线缆。


    安装板可以使用架子或胶合板制成，并且足够大容纳你所有的设备。你还应该能够如下图所示，将线缆绕过设备路由到它们的连接处。


    带有网络设备的安装板


    ### 内置扩展想法


    我认为“墨菲”定律有一条规定：“你的网络规模将增长到大于你计划的最大可能连接数。”对于这一点，没有终极的防御，除非为你能想象中最大的网络进行规划，并在当容量接近
    80% 或 90% 时随时重新设计它。


    如果你在一个不断增长的公司中有一个小型网络，那么你可能需要为未来预留。在增长问题出现之前，你确实需要预留。通常这并不意味着你必须现在这样做。但你必须让你的安装板留有空间。


    带有计划扩展的安装板


    ### 使用编号系统


    如果你没有提前规划，你可能会把所有线缆布到机房然后开始连接它们。但哪根线接哪里？知道线缆通向何处是有理由的。如果你的（或当）网络出现任何问题，追踪线缆到另一个地方是必要的。当你布设每根线时，最好对每根线进行标记，指示它的去向。


    编号系统示例


    这是跟踪布线情况的好方法。当你开始排除故障时，会有很大帮助。这可以在工作时在纸上完成，以后转换到电子表格或数据库。


    表 10-1 网络编号图


    如果你非常幸运，会有现有的布线可以使用。或者也许你可以请得起专业电工来为你完成所有的布线。与此同时，在现实世界中，你可能需要自己完成部分或全部布线。这并不难，但如果你从未对建筑进行过布线，你将会有些惊喜。（某些地区可能要求布线由专业人士完成。在开始之前检查当地法规。）


