    C 10.1.1.8 直接连接，Serial0/1/0

    C 10.1.1.12 直接连接，Serial0/2/0

    D 192.168.0.0/22 [90/20514560] 通过 10.1.1.5, 00:02:08, Serial0/0/0

    D 192.168.4.0/22 [90/20514560] 通过 10.1.1.9, 00:01:05, Serial0/1/0

    D 192.168.8.0/22 [90/20514560] 通过 10.1.1.13, 00:00:15, Serial0/2/0

    ***HQ#***


    在这里你可以看到我们有三条路由而不是十二条。正因如此，我们学到的是通过“EIGRP”路由协议，你的核心路由器只需要查看 3 条学习到的条目，而不是 12 条！这对于你的路由器处理器使用率难道不是好得多吗？


    搞定！这就是我们汇总的原因以及如何汇总……非常简单，对吧？我认为这甚至比子网划分还要简单。“真的吗，Laz？”嗯，想一想？这本质上是同一个过程。你所做的就是找到那条“魔法”线。在这种情况下，你会在公共位和非公共位之间画线，然后哒哒！你就完成了。你必须承认，没有不比这更简单的了。


    我知道你在想什么“Laz，我们要去丛林探险吗？（听懂了吗？‘野外 = 丛林’）好吧，我试过了。”无论如何，我们将开启通配符掩码（Wildcard Masking）世界的**旅程**，但这将是有趣的、简单且富有启发性的。你们现在应该认识我了。


    然而，在我们开始之前，让我给你们展示另一个汇总的示例，你可能会在考试中遇到，但如果没有遇到，请认为自己很幸运，至少这会重申我想传达的内容。


    如你所示，我们从 /30 开始，但现在我们有了 /27。这就是所有网络汇合的方式。你只需要遵循相同的概念就会没问题。从左到右计数，直到遇到非公共位值并画线，这就是你找到新掩码的方法。相应，汇总地址将是
    192.168.1.0/27。我希望到现在你已经意识到这真的是轻而易举……而不是其他书籍、老师和导师所描述的那些带有物理算法的复杂理论方程 ;) 记住，我的方法是以非常简单的方式教你，这样你就能掌握并理解这些概念，从而通过
    CCNA 认证考试、你的大学考试，或者任何包含 IP 问题的考试。这就是我决定写这本书的唯一目的。


    ## 结


    感谢你读到《初学者网络》的最后，希望它对你是有启发性的，并为你提供了实现你目标所需的所有工具。


    下一步是从各种高级教科书中学习更多计算机网络的知识。希望你在这个模块中学到了很多。为了进一步探索计算机网络，尝试观察你生活中遇到的各种硬件。


