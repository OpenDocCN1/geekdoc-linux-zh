    Or


    ::16:1610.10


    In hexadecimal form the above address will look like this:


    ::A:A:10:10


    **Multicast address**


    There is no broadcast address in IPv6 because it does not support broadcast


    traffic. Instead, you have to use multicast address to send your data packets
    to


    a specific group of hosts. The easiest way to recognize an IPv6 multicast


    address is that the first octet of every multicast IP always begins with FF.


    The prefix used in IPv6 multicast address is FF00::/8


    The first octet after 0xFF expresses the lifetime and second octet indicates


    the scope of the multicast. The lifetime of the multicast can be either


    permanent or transient. The scope can be any of the followings:


    1\. Node (0001)


    **2.****Link(0010)**


    **3.****Subnet(0011)**


    **4.****Admin(0100)**


    **5.****Site(0101)**


    **6.****Organization(1000)**


    7. Global(1110)


    The rest of the 112 bits are used to represent the multicast group ID.


    Some r multicast addresses are reserved for specific purposes. Those reserved


    multicast addresses are:


    FF01::1—for multicasting to all nodes/all hosts


    FF02::1—multicast to all hosts(link-local scope)


    FF01::2—multicast to all routers (within interface-local scope)


    FF02::2—multicast to all routers in a link


    FF05::2—multicast to all routers in the site (site-local scope)


    FF02::5— multicast to all OSPFv3 routers


    FF02::6— multicast to all OSPFv3 designated routers


    FF02::A—multicast to EIGRP routers'
