    使用新的 NDLC，TFS 中存在一个活跃的“单一事实来源”（source of truth）。这是一个包含数据模型、模板和 Ansible playbook
    的丰富仓库，它还存储了每个设备编译的、基于意图的动态生成的配置文件。TFS 是网络单一、集中且受 RBAC（基于角色的访问控制）控制的事实来源。TFS 仓库可以作为未来所有网络设计和故障排除的参考。事实来源意味着可以通过浏览创建配置的数据模型或模板，或查看显示精确设备配置的编译输出，而无需连接到设备
    CLI。其他制品（如路由表或防火墙规则列表）也可以作为动态 playbook 的输出存储在事实来源中。这并不是每个网络都能具备的，但在设计新功能、规划未来更改、处理网络故障或排除问题时，它是不可或缺的


    ## 变更管理


    网络自动化有助于简化变更管理过程，因为它是拉取请求（pull request）的自然部分。可以锁定主分支，仅允许通过通过的更改合并。审批者拥有所有必要的制品来批准、拒绝或有条件地拒绝要求开发者提供更多信息的拉取请求。文档会自动生成，且设备数据模型或动态模板的更改在
    TFS 中清晰可见并高亮显示，便于审批者查看。


    ### 示例流程：


    - 新需求 / 更改 / 功能 / 修正 / 重构。

    - 添加到 TFS 中的工作板。

    - 分配工作。

    - 创建新的工作分支。

    - 工程师执行 `git pull` 下载中央仓库的更新。

    - 工程师在本地 VS Code 中切换到新分支 (`git checkout`)。


    **开发工作：**

    - 添加 / 更改 / 删除代码。

    - 测试 – check mode。

    - 生成文档。

    - 工程师经常执行提交，理想情况下针对较小的相关更改。

    - 工程师执行 `git push` 将更改上传到中央仓库。

    - 工程师在 TFS 中提交拉取请求。

    - 拉取请求触发审批工作流。

    - 通知审批者/评审人员。

    - 拉取请求被批准或拒绝。

    - 已批准的请求合并到主分支。

    - 触发自动构建。

    - 更新文档。

    - 触发自动测试。

    - 调度自动发布。

    - 通过 Ansible 将更改交付到环境。


    或者，如果尚未建立完全的 CI/CD 自动化，操作人员将手动执行已批准的 Ansible playbook。


