    any device on the network to be automatically generated at build time, and available
    through TFS. The history for these documentation files is included as source and
    version controls. When adding or removing code, the resulting documentation updates
    are automatically performed reflecting the changes.


    ## Standards


    Corporate standards are very hard to maintain over time as networks evolve and
    transform. Often the pressures of projects and deliverables of day-to-day work
    leads to standards being overlooked, put off, or ignored. Natural configuration
    drift can occur over time as network devices and IP addresses come and go. If
    network devices continue to operate, misconfigurations or poor standards may go
    unnoticed. When identified, these cosmetic corrections may be deemed a low priority.


    Ansible’s dynamic templating guarantees a standardized configuration for every
    device. Complete configuration coverage is achievable and every line of code in
    the running-configuration can be derived from a template. Having accomplished
    full idempotency between the source of truth and the device configuration guarantees
    intent-based standards are uniformly applied. Scale is not a problem with this
    approach nor is the human error factor. When new standards arise, or changes to
    existing standards are required, only the centralized templates and data models
    are updated. These changes are pushed through the automation engine delivering
    the new standards to the network.


    ## Golden Configuration


    Sometimes referred to in Windows operating system administration as a “desired
    state configuration,” a golden configuration has many names. Using Jinja2 templates
    and YAML data models, a golden configuration for each device in the network is
    achieved using software development methodologies. Logic within the templates
    is used to intelligently generate device configuration commands. These configurations
    are applied at scale to all devices included in the Ansible *hosts.ini* inventory
    file.


    The master branch represents the golden configuration for the network. Automated
    builds package the various artifacts from the master branch and provide a version
    number for that iteration of the network. When changes are required, however minor,
    working branches are created for code to be developed and tested. Frequent Git
    commits during development are used to check changes into the working branch.
    A pull request is used to merge these accumulated changes into the master branch,
    which is then deployed into production updating the standardized, golden configuration,
    at scale.


    ## Security


    Some of the largest security breaches occur because telnet is open on a port with
    a public facing IP address. Security standards and best practices can now be hard-coded
    into templates guaranteeing enforcement of policies. Often complex configurations
    are required on interfaces at the access layer to address security risks. Consider
    the access layer and all the following security standards that should be implemented:


    - Spanning-tree toolkit commands.

    - Bridge Protocol Data Unit (BPDU) controls.

    - Portfast.

    - 802.1x or port-security commands.

    - Data and voice VLANs.

    - QoS settings.

    - CDP settings.

    - Power over Ethernet (PoE) settings.

    - Native VLAN established.

    - Native VLAN applied on trunk ports.

    - NTP source.

    - Security banner presented at login.

    - AAA.

    - RADIUS / TACACS+.

    - ACLs on management ports.

    - VLAN 1 disabled.


    Security requirements, if missed or incorrectly applied, lead to vulnerabilities
    and threats within the network. These vulnerabilities can be exploited, lead to
    outages, or bring about data loss in certain scenarios. Having a guaranteed templated
    configuration ensures that important security components are hard-coded into every
    template and applied to both the device’s global configuration as well as every
    interface configuration. Every access port throughout the campus can now be configured
    the same way and will automatically include security posture standards.


    ## Agility


    In an on-demand world networks continue to be the bottleneck of many projects.
    One of the driving factors for moving to automation is the agility it offers.
    Most of the common changes to the network become updates to existing data models.
    When new feature requirements arise, such as the need for multicast, new templates
    along with new data model variables will be developed. The feature is then released
    and incorporated into the orchestration of playbooks as a new task. A very repeatable,
    modular, process evolves which provides the agility to deliver projects more efficiently.


    ## Design


    Traditional network design often centers around the device configuration commands.
    While these commands are essential at implementation, it is the data that should
    drive network design. Network engineers'' new responsibilities include crafting
    human-readable data models and the logic that drives the dynamic templates. Existing
    or new dynamic documentation should reflect new features as templates are added
    or updated. Thinking about data first, and the configuration second, network design
    evolves.


    ## Deployment


    The biggest advantages found in network automation are often on the operational
    side of network management. Large-scale changes are often very difficult to roll
    out to an enterprise. Introducing QoS to a network, for example, means touching
    all devices in all layers of the network, often with different code per platform.
    Devices using Multi-Layer Switching (MLS) or Modular Quality of Service Command
    Line (MQC) leads to different requirements and configuration commands by platform.
    Operations receives approved, finalized, network designs, along with deployment
    steps, from the network engineers. This often requires weeks or months to then
    complete the delivery to campus from start to end. Network automation, even a
    hybrid model where operators run Ansible playbooks manually, solves operational
    headaches related to deploying configurations to the network. Deployment time
    is drastically reduced when using Ansible playbooks while quality and accuracy
    significantly increases.


    ## Operations


    NetDevOps will dramatically change network operations’ role in the organization.
    A library of canned, automated, Ansible playbooks develops over time. Automated
    builds and deployments will trigger whenever approved changes are merged into
    the repository. Operations are often tasked with running the network day-to-day,
    incorporating and deploying the changes coming from projects or network engineers.
    Operations will now learn to develop and use code. If the deployment, network
    reconnaissance, and documentation aspects of operations can be automated, it will
    allow the operations team to focus on the day-to-day aspects of the network along
    with automated tools used to gather information. With that said, the network may
    still have the need of NMS for platform health monitoring. There may be network
    appliances or controllers that are not good candidates for automation or there
    may be non-SSH systems on the network that are notable.


    ## Intent-Based


    The human-readable nature of this methodology allows for a true intent-driven
    model of the network. The configurations are abstracted into the templates, so
    focus can be put on the data models. Intent for each device or group of devices
    can be expressed in a human-readable form. Idempotent Ansible playbooks combined
    with check mode can tell exactly if a device’s running-configuration matches intent
    and if the Ansible playbook would have added code. Utilizing the differential
    option (--diff) allows the operator to see what differs between the two configurations
    and can also display any commands present on the device but missing from intent.
    New appliance-based solutions are available that offer a GUI-driven intent system.
    Drag and drop intentions in the GUI are translated to configurations that are
    automatically pushed to the devices. These new intent-based appliances are the
    biggest competitor to Ansible network automation. Either purchase and configure
    the appliance, hoping it does everything advertised, or build an in-house Ansible
    automation framework.


    ## Source of Truth


    Every network should have an authoritative artifact identifying what is the correct,
    intended configuration for each device. Source of truth is a trusted artifact
    that network engineers and operators can reference with certainty. This can be
    an IP address, a static route, an ACL, or configuration command. It can be required
    when designing new solutions, adding new devices (scaling), troubleshooting problems,
    or rebuilding a device after failure.


    Where is the network’s source of truth? Is it a network management system? Flat
    files in folders in a network share? A Microsoft SharePoint site? The network
    device running-configuration itself?

