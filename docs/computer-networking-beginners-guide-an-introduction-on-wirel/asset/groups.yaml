    network designs and troubleshooting. Source of truth means browsing for


    data models or templates that create the configuration or the compiled output


    showing the exact device configuration, without ever needing to connect to


    the device CLI. Other artifacts such as the routing tables or firewall rule lists


    can also be stored in the source of truth as output from dynamic playbooks.


    Having this is not something every network can produce; however, it is


    indispensable when designing new features, planning future changes, dealing


    with network failures or troubleshooting problems.


    Change Management


    Network automation can help simplify the change management process as


    it is a natural part of a pull request. The master branch can be locked, and


    only approved changes allowed to be merged through a pull request. An


    approver has all the necessary artifacts to approve, deny, or conditionally


    reject a pull request asking the developer for more details. Documentation is


    automatically generated and the changes to either the data model or dynamic


    template of a device is obvious and highlighted in TFS for the approvers


    benefit.


    Sample Processes:


    New requirement / change / feature / correction / refactoring.


    Added to work board in TFS.


    Work assigned.


    New working branch created.


    Engineer performs git pull downloading the updates to the central


    repository.


    Engineer changes to new branch in local VS Code (git checkout).


    **Development work:**


    Add / change / delete code.


    Testing – check mode.


    Documentation generated.


    Engineer performs commits often, ideally for small related changes.'
