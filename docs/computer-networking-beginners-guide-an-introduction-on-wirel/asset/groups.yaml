    ## Multicast address


    There is no broadcast address in IPv6 because it does not support broadcast traffic.
    Instead, you have to use multicast address to send your data packets to a specific
    group of hosts. The easiest way to recognize an IPv6 multicast address is that
    the first octet of every multicast IP always begins with FF.


    The prefix used in IPv6 multicast address is FF00::/8.


    The first octet after 0xFF expresses the lifetime and second octet indicates the
    scope of the multicast. The lifetime of the multicast can be either permanent
    or transient. The scope can be any of the followings:


    - 1. Node (0001)

    - 2. Link(0010)

    - 3. Subnet(0011)

    - 4. Admin(0100)

    - 5. Site(0101)

    - 6. Organization(1000)

    - 7. Global(1110)


    The rest of the 112 bits are used to represent the multicast group ID. Some multicast
    addresses are reserved for specific purposes. Those reserved multicast addresses
    are:


    - FF01::1—for multicasting to all nodes/all hosts

    - FF02::1—multicast to all hosts(link-local scope)

    - FF01::2—multicast to all routers (within interface-local scope)

    - FF02::2—multicast to all routers in a link

    - FF05::2—multicast to all routers in the site (site-local scope)

    - FF02::5—multicast to all OSPFv3 routers

    - FF02::6—multicast to all OSPFv3 designated routers

    - FF02::A—multicast to EIGRP routers

    - FF02::D—multicast to PIM routers

    - FF02::1:FFXX:XXXX—Solicited-node multicast address (here XX:XXXX represents
    that low order 24 bits of the IPv6 Interface address)


    ## Wiring Your Building


    When you begin wiring a building for a network, it seems awesome and overpowering
    to you. Questions of how to do every little thing go through your mind and doubts
    start to sink in. Just take a big breath and remember that old proverb: "A network
    of a thousand computers begins with one wire."


    ### General Network Installation Outline


    Once you get started, it becomes a game and starts to fall into place rather quickly.
    A little organization up front solves a ton of problems along the way. Here''s
    a little listing of things to do, in chronological order, that will help a lot.


    1. Decide on a phone closet location.

    2. Draw a network diagram with present and future computer and printer locations.

    3. Number the devices on the network chart for future reference.

    4. Figure out the best way to get a wire from each location to the closet.

    5. Run all the wires before connecting anything. Remember to test them.

    6. Install all the connectors and jacks.

    7. Connect the network and test it.


    Sounds easy enough, doesn''t it? Well, it''s really that simple, although you''re
    sure to run into some unforeseen obstacles along the way that frustrate you and
    make you wonder why you ever started this crazy project. But never fear! This
    chapter will help you avoid some of the most common problems, or at least be aware
    of them so you can overcome them. At the same time, at least it''s comforting
    to know that these problems happen to everyone. Misery loves company, right?


    ### The Phone Closet


    Not only does it provide you with a central, out of the way place to run your
    wires and set up network equipment, it also serves as a hiding place for all that
    stuff that could easily be an eyesore if exposed in an office setting. Your phone
    closet should provide these basic features:


    - If possible, it should be centrally located, so that you can run wires from
    each equipment location and keep the distances as short as possible. Sometimes
    the back wall of a building ends up serving the purpose. Just work with what you''ve
    got!

    - There should be some sort of access to the room for wires to be run from the
    various locations. Don''t choose a room with concrete sides, ceiling and floor.
    Access to a drop ceiling or attic is necessary.

    - You should have enough room to work in the closet without bumping into things
    or having to stand on your head to reach the wires and connections. You''ll be
    spending a lot of time in here at first. When you have troubleshooting to do,
    you''ll want a comfortable place to stand while you check the wiring.

    - Be sure you select a room that has air conditioning or doesn''t get too hot.
    Most electronic equipment requires a cooler environment because overheating can
    almost always cause damage.

    - Finally, the closet should have a wall with space from chest level to eye level
    on which to attach a large board where equipment and wires will be mounted.


    The mounting board can be made out of shelving or plywood and should be large
    enough for all your equipment. You should also be able to route the wires around
    the equipment to their connections, as shown in the figure below.


    Mounting Board with Network Equipment


    ### Built-in Expansion Ideas


    I think “Murphy” has a law that states, "The size of your network will grow to
    a number greater than the maximum possible connections you have planned." There
    is no ultimate defense for this, other than planning for the largest network you
    can imagine and redesigning it whenever you approach 80 or 90 percent capacity.


    If you have a small network in a growing company, you will definitely have growth
    in the network. When new machines are purchased for existing users, the old machines
    rarely get retired. Usually, they end up on someone''s desk who wanted a computer
    but had to wait for a hand-me-down. Or they end up on a vacant desk where it becomes
    a server of some sort, for e-mail, file or print services, and so on. When it
    gets to that desk, it usually has to be connected to the network. There must be
    a thousand scenarios like this one, so suffice it to say that you need to plan
    for at least double the number of connections you have now.


    This doesn''t mean that you have to actually have room right now for all those
    devices to be plugged in. You can plan for additional hubs or larger hubs to be
    installed at later dates. But you do need to have room for the hubs or you''ll
    overcrowd your mounting board quickly.


    Mounting Board with Planned Expansion


    Sometimes you can plan for expansion for a small price. If you have seven devices
    to connect to Ethernet, an eight-port hub is really too small for you. Yes, it
    will do the job for now, but the first addition you have will fill it up. Then
    you''ll be stuck with purchasing another. In this case, it would have been less
    expensive in the long run to purchase 12-port hub in the first place. Then you
    have 50 percent expansion capability before having to worry about growth problems.


    ### Using a Numbering System


    If you didn''t plan ahead, you might run all your wires to the closet and then
    begin to connect them. But which wire goes where? There are good reasons to know
    where each wire leads. If (or when) you have any problems with your network, it''s
    necessary to know how to trace the wires from one place to another. When you run
    each wire, it''s a good idea to label each one, indicating where it goes.


    Numbering System Examples


    This is a good way to keep up with how your wires are run. It will help a lot
    when you begin to troubleshoot a problem. This can be done on a piece of paper
    while you''re working and later transferred to a spreadsheet or database.


    Table 10-1 Network Numbering Chart


    If you''re really lucky, you''ll have pre-existing wiring you can use. Or maybe
    you''ll be able to spring for a professional electrician to do all your wiring
    for you. Meanwhile, back in the real world, you''ll probably have to do some or
    all of the wiring yourself. This is not so bad, but if you''ve never done any
    wiring through a building, you''re in for some surprises. (Some areas may require
    that all wiring be done professionally. Check local ordinances before you begin!)


    Wiring a building can be as simple as pie or more trouble than it is worth. Sometimes
    you''ll have one or two wires that go through with no trouble at all, and a few
    that nearly kill you. The best thing to do is to remain calm. With a little clear
    thinking and some simple tricks, you can do it if you don''t get

