    ## Management Operations


    Network management refers to the process of managing and administering computer
    networks. Services provided by network management include performance management,
    network provision, fault analysis, and maintaining the quality of the network.
    Network management software is the software that is used by network administrators
    to execute their functions.


    Network and network device management is supported by accessor methods. Network
    management makes it easy for Information Technology managers to keep an eye on
    network devices and components in a large area network. Examples of access methods
    that are used include:

    - Command-line interface (CLI)

    - Custom XML

    - Translation Language 1(TL1)

    - Java Management Extensions (JMX)

    - Common Information Model

    - Windows Management Instrumentation (WMI)


    Network management also uses schemes such as MTOSI and the Structure of Management
    Information (SMI).


    ## Management Architecture


    Networks continue to be distributed and complicated as time goes by. As a result,
    faults such as performance degradation, resource allocation, service provision,
    and bandwidth monitoring and hardware failure are difficult to solve and become
    significant hurdles for network managers.


    ## Network Scanning


    Network scanning is a process that is used to recognize active hosts on a computer
    network, either for security assessment or to attack them. Methods such as port
    scans and ping sweeps provide information such as the mapping of IP addresses
    to live hosts that are active on the internet. Besides, network scanning is essential
    because it enables an attacker to assume viable addresses by returning data regarding
    the Internet protocol address that don’t map on hosts which are live. Scanning
    is a component of gathering intelligence for an intruder or attacker. During scanning,
    the intruder gets data regarding the actual Internet Protocol address that can
    be seen on the connection or network, services running on every computer, their
    operating systems, and the system architecture. Network scanning has the following
    purposes:

    - Recognizing available TCP and UDP network services operating on the targeted
    hosts

    - Determining the type of operating systems in use by monitoring IP responses

    - Evaluating the TCP sequence of the target hosts

    - Recognizing filtering systems between the targeted hosts and the user


    ## Authentication


    Authentication is determining whether something or someone is what or who it declares
    itself to be. It provides access control for computer systems by making sure that
    a user credential matches the credentials in a database that contains authorized
    users. A user is usually identified using a user ID, and authentication is successful
    if the user provides a credential such as a fingerprint that matches the specific
    user ID.


    ## Power Conservation


    In wireless connections, two main challenges are encountered. The two problems
    are how to conserve battery power and security challenges. Power conservation
    is vital for the longevity and reliability of a wireless connection or network.
    Most wireless connections consist of numerous wireless sensors that collect information
    such as light, temperature, humidity, and vibration. The most commonly used methods
    to conserve power for wireless connections is placing some stations in sleep mode
    or minimizing the power used for relaying data for active units. Majority of the
    techniques do not use predictive models of loading the network. The nature and
    size of communication networks determine the type of power conservation approach
    to be used.


    ## Spectrum Management


    Adaptive control and game theory are the most commonly used techniques when doing
    spectrum management for wireless connections. Almost all wireless connections
    share the radio rate spectrum. Most spectrum management methods heavily depend
    on a station receiver that is made using a relaying architecture. Hoc wireless
    connections need a distributed and scalable methodology to function optimally.


    ## Contention-Free Service


    To make ideal use of applications that need almost real-time service, a network
    administrator should use the 802.11 standards. This standard includes a coordination
    functionality that provides a different way of accessing the wireless network.
    PCF is defined as the point of coordination function. PCF makes it possible for
    an 802.11 network to provide forced access to the medium. In some cases, accessing
    the medium under the PCF is like accessing the medium using a token.


    The PCF is not widely used because, in the past, a media server implemented PCF
    although it was not successful. Certain enterprise-class products use PCF because
    it provides the access point’s additional control over access to wireless connections.
    Additionally, PCF helps the wireless network to wrest control away from individual
    network stations. If contention-free delivery is necessary, PCF can be implemented
    for optimal results. Note that PCF is optional for the 802.11 standards. It is
    not mandatory for products to use PCF. However, PCF was designed by the IEEE specifically
    for stations that use the distributed coordination function.


    ### Detailed PCF Framing


    The contention-free period uses several kinds of frames that are exclusive. They
    come together in varying states known as:

    - Polling

    - Acknowledgment

    - Data transmission


    This chapter explains how different types of frames are incorporated and the way
    various functions combine during transmissions of frames.


    Contention-free frames usually combine several functionalities into one frame.


    Data+CF-ACK

    It is a frame that combines two functions for efficiency during the transmission.
    Information is channeled in the payload of the frame, and the frame confirms the
    receipt of information. Normally, the information and confirmation are required
    for two separate network stations. The free contention confirmation is focused
    on the information for relaying to a previous frame’s access point.


    CF-ACK

    If only confirmation is needed, a frame with a header only on the CF-ACK function
    can be relayed. CF-Poll can transmit information by itself.

