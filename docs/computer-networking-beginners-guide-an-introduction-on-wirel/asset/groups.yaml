    \n 恶意软件类型\n\n- *广告软件*：这些被认为是所有恶意软件中危害最小且最获利的。它们被专门设计在你的计算机上显示广告。\n- *间谍软件*：黑客选择间谍软件来持续监控用户。这些程序设计用于随时跟踪用户。它们监视用户的互联网活动并相应显示广告。它们帮助广告软件利用收集的信息，以便用户在线时可以使用。\n\
    - *病毒*：病毒是具有传染性的程序或代码。它们附着在其他运行的软件上并可以自我复制。它们所附带的文件、文件夹或程序在使用或通过直接文件共享或网络传输到其他系统时传播病毒。\n\
    - *蠕虫*：这些是设计用于破坏操作系统文件的小型程序。它们像病毒一样，可以自我复制并隐藏在文件夹中。它们消耗处理器和硬盘资源，减慢进程并减少硬盘上的可用空间。某些蠕虫是无害的，而其他则不断复制直到驱动器变满。\n\
    - *木马*：木马专门设计用于窃取用户信息。这包括财务和个人信息。在所有恶意软件中，这些被认为是最危险的。对于拒绝服务攻击，黑客使用木马作为主要工具。它们帮助黑客跟踪用户的活动。它们维护用户活动的日志。\n\
    - *Rootkit*：这些是允许其他恶意软件进入系统的软件程序。像木马一样，它们在用户未察觉的情况下隐蔽工作。对于用户来说，看起来没有任何问题，但在后台，它打开了多种类型恶意软件的门户。\n\
    - *Keyloggers*：键盘记录器专门设计用于记录所有键盘信息。它们只能存储给键盘的信息，无法记录数据。\n"
