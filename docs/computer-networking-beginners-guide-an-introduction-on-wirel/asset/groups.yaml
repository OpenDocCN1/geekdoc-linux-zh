    **描述**


    计算机网络简单的计算机网络的形成。计算机网络可以定义为连接（有线或无线）的计算机、打印机和其他设备的集合，最终目标是促进设备之间的通信。创建这些设备连接的过程被称为计算机网络。


    从技术上讲，计算机网络是指在节点之间传输和交换数据的过程，数据通过共享系统传输，并在信息系统中执行。计算机网络的整个概念不仅包括网络的设计、构建和使用，还涉及涉及的基础设施、软件和底层策略的技术管理、维护和运行。


    自从几十年前无线技术的出现以来，我们的生活就从未改变过。有一点是肯定的；它只会变得更好。随着 5G 在主流领域的逐渐演进，我们只能想象未来。有一句话说明了一切：“无线技术影响了我们生活的本质属性。”


    它影响了我们经营业务的方式；改变了我们学习的方式；影响了我们与家人朋友保持联系的方式。一切都改变了，这仅仅是一个证词。本指南将关注以下内容：


    - 协议

    - 缓解网络威胁

    - IPv6

    - 建筑建筑布线

    - 网络布线

    - 802.11i 健壮安全网络

    - 子网划分

    - 为什么要自动化网络？

    - 处理过程中的风险

    - IPv4 汇总


