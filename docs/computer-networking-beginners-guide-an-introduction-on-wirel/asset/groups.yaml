    1, N2 - OSPF NSSA external type 2, E1 - OSPF external type 1, E2 - OSPF external
    type 2, E - EGP, i - IS-IS, L1 - IS-IS level-1, L2 - IS-IS level-2, ia - IS-IS
    inter area, \* - candidate default, U - per-user static route, o - ODR, P - periodic
    downloaded static route


    ***默认网关未设置***


    10.0.0.0/30 已子网，有 3 个子网

