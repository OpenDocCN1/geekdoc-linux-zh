    \ utility\nThis is used for displaying the configuration of TCP/IP in Windows\
    \ 95/98.\n\n### dig utilities and nslookup\nThese are used for displaying information\
    \ regarding the resolution of DNS.\n\n## Why Automate the Network?\n\n\"The remains\
    \ of the old must be decently laid away; the path of the new prepared. That is\
    \ the difference between Revolution and Progress.\" - Henry Ford\n\nThe time for\
    \ change has arrived. Enterprise networks have outgrown and outpaced the ability\
