    **Network Cabling**


    In order to connect our devices to our network, we need some type of media


    in between them to allow for packets to get from one device to another. This


    is where network cabling comes into play. There are different types of cables


    you can use to connect your network, but with today’s modern hardware


    there are only really two types that we tend to use.


    There are two standard wiring schemes for straight through Ethernet


    cables. They are either T568A or T568B, with T568B being the more


    commonly used wiring scheme in the US. The only difference between the


    two are that the pin positions for the green and orange pairs have been


    switched. Either one will work just fine on your network, but do not combine


    the two unless you want to have communication issues. Whether or not all


    four pairs are used is determined by the category of the cable. For example,


    an older 10/100Mbps cable would only use two pairs, while a 1Gbps cable


    would use all four pairs so it can transmit and receive at the same time.


    Some people like to make their own cables so they can determine their


    exact length. This is kind of a tedious process unless you get really good at
    it,


    plus you will need to test each cable you make with a cable tester to be sure
    it


    works properly.


    *Crossover Cables*


    Crossover cables are used to connect similar devices together such as a


    switch to switch, router to router, or a router connected directly to a host.


    These cables look and feel the same, but the wiring scheme is what makes


    them different. They are called crossover cables because one side is wired the


    opposite of the other side for four of the eight wires.


    If you have been paying attention, you might have noticed that a


    crossover cable is basically a cable with the T568A wiring scheme on one


    side and the T568B wiring scheme on the other side.


    To make things easy to remember, here is a chart listing what scenarios


    you would use a straight through cable for compared to a crossover cable.


    Rollover Cables


    One last type of cable I am going to mention is called a rollover cable,


    which is also referred to as a null modem cable. These cables are used to


    connect a PC to a console port on a switch or router to perform management


    functions when you can’t connect via one of the usual network ports.'
  - '[PAGE 42]


    The pin-outs on one end of a rollover cable are reversed at the opposite


    end. There is an RJ45 connection on one end and a DB9 connection on the


    other end. The RJ45 connection plugs into the switch or router’s management


    port, and the DB9 will connect to a serial port on a computer. Most new


    computers don’t have serial ports anymore, so you will need to use a USB to


    serial adapter in addition to the rollover cable. Some higher end switches now


    have micro USB ports for management so you can actually connect with a


    USB cable and even use your smartphone!


    Ethernet Cable Categories


    Now that you know what an Ethernet cable is and how it’s wired, I want


    to spend a little time discussing Ethernet cable categories. There were a few


    variations before Cat5e and a couple since then, and here is a quick summary


    of the Ethernet cable standards and their maximum speed capacity.


    *Category 3* – 10Mbps and 16Mhz frequency


    *Category 4* – 16Mbps and 20Mhz frequency


    *Category 5* – 100Mbps and 100Mhz frequency


    *Category 5e* – 1Gbps and 100Mhz frequency


    *Category 6* – 1Gbps and 250Mhz frequency


    *Category 6a* – 10Gbps and 500Mhz frequency


    *Category 7* – 100Gbps and 600Mhz frequency


    These higher speeds (such as 1Gbps and above) are achieved by using


    four pairs of wires rather than just two, as well as increasing the twists per


    centimeter in the wire. Cat6 and above also has a nylon spline which helps to


    eliminate crosstalk, which is interference in one circuit that comes from


    another circuit. There is also another type of Ethernet cable called a shielded


    twisted pair (STP) that has a protective shielding wrapped around the wires to


    further prevent interference issues. STP cables are more expensive and harder


    to work with because they are not as flexible thanks to the shielding. When a


    cable doesn’t have the shielding, it is known as an unshielded twisted pair or


    UTP cable.


    Tip


    99% of the time the type of Ethernet cable that you are working with will


    be printed on the jacket of the cable itself. You might just have to look at a


    couple of feet before you find it.'
