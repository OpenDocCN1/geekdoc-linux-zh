    ## 统一计算


    思科统一计算系统（UCS）改变了 IT 组织运营业务的方式。它将行业标准的 x86 架构服务器与存储和网络访问集成到单一统一系统中。UCS 为组织的数据中心带来了更高的工作效率、更低的拥有成本和可扩展性。它通过适应、可扩展的架构改进了服务器性能，在管理融合基础设施、网络、服务器和存储的同时，通过存储容量、I/O
    和处理内存应对负载变化。


