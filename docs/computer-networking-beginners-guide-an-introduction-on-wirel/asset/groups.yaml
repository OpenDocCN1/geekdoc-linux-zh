    \  - VLAN(s).\n- Port-channels information:\n    - Member ports.\n    - IP Addresses.\n\
    \    - Access Control Lists (ACL).\n\nIn fact, any information represented in\
    \ a data model can be transformed into dynamic documentation files. This allows\
    \ for desired information about the\n"
