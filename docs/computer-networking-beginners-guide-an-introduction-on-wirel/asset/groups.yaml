    \nComputer Networking is simply the formation of a computer network. A computer\
    \ network can be defined as the collection of computers, printers, and other equipment\
    \ that are connected (wired or wireless), with the ultimate aim of fostering communications\
    \ between the devices. The process of creating this connection of devices is known\
    \ as Computer Networking. \n\nTechnically, Computer Networking is referred to\
    \ the process of transporting and exchanging data between points known as nodes,\
    \ carried via a shared system, executed in an information system. The whole concept\
    \ of Computer Networking does not consist only of the design, construction, and\
    \ use of a network. It also involves the technical management, maintenance, and\
    \ running of the involved infrastructure, software, and underlying policies.\n\
