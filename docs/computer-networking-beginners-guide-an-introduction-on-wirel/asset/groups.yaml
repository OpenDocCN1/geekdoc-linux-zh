    Using the new NDLC, a living source of truth in TFS exists. A rich repository
    containing data models, templates, and Ansible playbooks which also stores the
    compiled, intent-based, dynamically generated configuration files for each device.
    TFS is a single, central, RBAC controlled, source of truth for the network. TFS
    repository can be used as a reference for all future network designs and troubleshooting.
    Source of truth means browsing for data models or templates that create the configuration
    or the compiled output showing the exact device configuration, without ever needing
    to connect to the device CLI. Other artifacts such as the routing tables or firewall
    rule lists can also be stored in the source of truth as output from dynamic playbooks.
    Having this is not something every network can produce; however, it is indispensable
    when designing new features, planning future changes, dealing with network failures
    or troubleshooting problems.


    ## Change Management


    Network automation can help simplify the change management process as it is a
    natural part of a pull request. The master branch can be locked, and only approved
    changes allowed to be merged through a pull request. An approver has all the necessary
    artifacts to approve, deny, or conditionally reject a pull request asking the
    developer for more details. Documentation is automatically generated and the changes
    to either the data model or dynamic template of a device is obvious and highlighted
    in TFS for the approvers benefit.


    ### Sample Processes:


    - New requirement / change / feature / correction / refactoring.

    - Added to work board in TFS.

    - Work assigned.

    - New working branch created.

    - Engineer performs git pull downloading the updates to the central repository.

    - Engineer changes to new branch in local VS Code (git checkout).


    **Development work:**

    - Add / change / delete code.

    - Testing – check mode.

    - Documentation generated.

    - Engineer performs commits often, ideally for small related changes.

    - Engineer performs a git push uploading the changes to the central repository.

    - Engineer submits a pull request in TFS.

    - Pull request triggers approval workflow.

    - Approvers / reviewers notified.

    - Pull request approved or denied.

    - Approved request merged into master branch.

    - Automated build triggered.

    - Documentation updated.

    - Automated test triggered.

    - Automated release scheduled.

    - Change delivered to environment through Ansible.


    Alternatively, if full CI/CD automation is not yet established, operators execute
    approved Ansible playbooks manually.


