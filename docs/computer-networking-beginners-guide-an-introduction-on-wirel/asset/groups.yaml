    作为一种加密标准，带计数模式的密码分组链消息认证码协议是 802.11i 无线连接标准不可或缺的一部分，特别是实现 WiMax 技术的连接。


    CCMP 算法基于美国联邦政府的高级加密标准。可以认为该标准旨在为无线连接提供最高程度的数据加密。


    与 TKIP 等类似技术相比，CCMP 协议提供了更高的安全性。特别是，带计数模式的密码分组链消息认证码协议部署了 128 位密钥以及 48 位初始化向量，这降低了对重放攻击的脆弱性。具体而言，计数模式组件提供了数据隐私性。另一方面，密码分组链消息认证码元素提供了数据完整性和验证。与
    CCMP 协议的临时密钥完整性协议（TKIP）相比，增加的隐私性和安全性在大多数情况下需要额外的处理能力来处理，这需要升级硬件。


    练习题


    a. 双通道网络设备的合理性是什么？

    b. 将 TKIP 与有线隐私等效协议进行对比？

    c. 即使有了无线链路保护访问（WPA），为什么其他安全措施仍然是必要的？

    d. 在你的网络中实施 802.11i 的成本是什么？换句话说，当你决定在网络中实施 802.11i 标准时将面临哪些初始不便？


    ## 管理操作


    网络管理是指管理和管理计算机网络的过程。网络管理提供的服务包括性能管理、网络配置、故障分析和维护网络质量。网络管理软件是网络管理员执行其功能时软件。


    网络和网络设备管理由访问方法支持。网络使得信息技术经理能够监控大型局域网中的网络设备和组件。使用的访问方法示例：

    - 命令行界面 (CLI)

    - 自定义 XML

    - 传输语言 1 (TL1)

    - Java 管理扩展 (JMX)

    - 通用信息模型 (CIM)

    - Windows 管理实例程序 (WMI)


    网络管理还使用了如 MTOSI 和管理信息结构 (SMI) 等方案。


    ## 管理架构


    随着时间的推移，网络变得越来越分布式和复杂。因此，如性能下降、资源分配、服务提供、带宽监控和硬件故障等故障难以解决，并成为网络管理者的重大障碍。


    ## 网络扫描


    网络扫描是一种用于识别计算机网络上活动主机的过程，可用于安全评估或进行攻击。端口扫描和 ping 扫描（ping sweeps）等方法提供了如 IP 地址到互联网上活动主机的映射等信息。此外，网络扫描至关重要，因为它能够让攻击者通过返回未映射到活动主机的
    IP 协议地址数据来假设可行地址。扫描是入侵者或攻击者收集情报的一个组件。在扫描期间，入侵者可以获得有关连接或网络上可见的实际 IP 地址、每台计算机上运行的服务、操作系统以及系统架构的数据。网络扫描具有以下目的：

    - 识别目标主机上运行的可用 TCP 和 UDP 网络服务

    - 通过监控 IP 响应确定使用的操作系统类型

    - 评估目标主机的 TCP 序列

    - 识别目标主机与用户之间的过滤系统


    ## 认证


    认证是确定某物或某人是否为其声称的内容或身份。它通过确保用户凭据与包含授权用户的数据库中的凭据匹配，为计算机系统提供访问控制。用户通常使用用户 ID 进行标识，如果用户提供的指纹等凭据匹配特定的用户
    ID，则认证成功。


    ## 节电


    在无线连接中，面临着两个主要挑战。这两个问题是如何节省电池电量以及安全挑战。节电对于无线连接或网络的寿命和可靠性至关重要。大多数无线连接由许多无线传感器组成，收集光、温度、湿度和振动等信息。无线连接最常用的节电方法是将某些基站设置为睡眠模式，或尽量减少用于活动单元数据中继的功率。大多数技术不使用网络负载预测模型。通信网络的性质和规模决定了所使用的节电方法。


    ## 频谱管理


    自适应控制和博弈论是无线连接频谱管理中最常用的技术。几乎所有的无线连接都共享无线电频谱。大多数频谱管理方法严重依赖于使用中继架构的基站接收器。家用无线连接需要一种分布且可扩展的方法来保持最佳运行。


    ## 无冲突服务


    为了理想地利用需要近乎实时服务的应用程序，网络管理员应该使用 802.11 标准。该标准包括一种协调功能，提供了访问无线网络的不同方式。PCF 被定义为协调点功能（point
    of coordination function）。PCF 使 802.11 网络能够强制访问介质。在某些情况下，在PCF 下访问介质类似于使用令牌（token）访问介质。


    PCF 未被广泛使用，是因为在过去，一个媒体服务器曾实现 PCF 但并未成功。某些企业级产品使用 PCF，因为它提供了接入点对无线连接接入的额外控制。此外，PCF
    帮助无线网络从单个网络站手中夺回控制权。如果需要无冲突交付，可以实施 PCF 以获得最佳结果。注意，PCF 是 802.11 标准中的可选内容。产品并不强制要求使用
    PCF。然而，PCF 是 IEEE 专门为使用分布式协调函数的站设计的。


    ### 详细的 PCF 帧


    无冲突期间（CP）使用几种互斥的帧。它们以不同的状态结合在一起：

    - 轮询（Polling）

    - 确认（Acknowledgment）

    - 数据传输


    本章解释了不同类型的帧如何整合，以及各种功能在帧传输期间组合的方式。


    无冲突帧通常将多个功能合并到一个帧中。


    Data+CF-ACK

    它是为了传输期间的效率而将两个功能结合的帧。信息位于帧的有效负载中，并且帧确认了信息的接收。通常，信息和确认需要两个独立的网络站。冲突确认侧重于中继到前一个帧接入点的信息。


    CF-ACK

    如果只需要确认，则中继一个头部仅包含 CF-ACK 功能的帧。CF-Poll 可以单独传输信息。


