    Here you can see that we have three routes instead of twelve. For that reason,
    we are learning that through the routing protocol “EIGRP”, your core router needs
    to only look at the 3 learned entries vs. 12! Isn’t this so much better on your
    routers processor usage?


    There you go! This is why and how we summarize...pretty simple right? I believe
    it’s even easier than subnetting. “really Laz?”, well, think about it? It’s essentially
    the same process. All you have to do is find the “magic” line. In this case you
    draw the line between the common and uncommon bits and voila!...you’re done. You
    have to admit. It doesn’t get any easier than that.


    I know what you’re thinking “Laz, are we taking a trip into the jungle?...get
    it? “wild = jungle” Oh well, I tried”. Anyway, we will take a JOURNEY into the
    world of Wildcard Masking, but it will be fun, easy but informative. You guys
    should know me by now.


    However, before we do, let me show you one more example of summarization that
    you may find on your exam, but if you don’t, consider yourself lucky, at least
    this will reiterate what I’m trying to convey.


    As you can see, we started with a /30, but now we have a /27. This is how all
    these networks come together. All you have to do is follow the same concepts and
    you will be okay. Count from left to right until your reach the un-common bit
    values and draw your line, that’s how you find your new mask. In return, the summary-address
    would be 192.168.1.0/27. I hope that by now you have realized that this is really
