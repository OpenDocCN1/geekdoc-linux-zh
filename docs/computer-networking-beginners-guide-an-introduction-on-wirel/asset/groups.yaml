    - iii) 在设备管理器中，弹出的框会展开指定的“网络适配器”区域。您将看到两个网络适配器；一个代表有线以太网适配器 (NIC)，另一个代表无线适配器。

    - iv) 打开网络适配器项的属性。如果您有 802.11n 适配器类型，您将看到几条 802.11n 设置条目。它们确认了该适配器是接受 802.11n
    的，这意味着它可以与旧的 802.11g 以及 802.11b 无线网络计算机进行通信。


    不同无线标准的优缺点如下图所示：


    ## 在 Windows 10 上使用 802.11


    802.11 是一种 IEEE 网络标准，规定了无线网络中继技术。它们有以下版本可用，用于在家庭和企业等环境环境中提供无线连接。


    1. 802.11n

    2. 802.11g

    3. 802.11b

    4. 802.11a


    802.11n 是最新版本，是一种无线标准，具有许多天线以提高数据传输速率。该版本的吞吐量受速率、来自网络的干扰以及网络设置的影响。如果您发现 WIFI 网络由于任何原因无法工作，请使用以下程序查看
    802.11n 连接的设置并在需要时重新启用。


    ### 为 Windows 10 启用 802.11n


    点击 Windows 10 栏上的无线图标，选择“打开网络和共享中心”选项。点击“更改适配器设置”。选择 WIFI 适配器的属性，然后在“高级”选项卡下搜索
    802.11。选择它并将值更改为“启用”。


    ### Windows 计算机验证


    当您验证某些内容时，目标是确认其真实性。在计算机网络中，身份验证是指向连接、网络或资源上的应用程序证明身份的过程。通常，身份验证是通过使用只有用户才知道的密钥进行的加密操作来验证的。身份验证的服务端会将共享信息与已知加密密钥进行比较，以验证验证尝试。


    加密密钥通常存储在中央位置，以使验证过程具有可维护性和可扩展性。活动目录（active directory）是存储包括加密密钥在内的身份数据的标准技术。Kerberos
    和 NTLM 实现需要活动目录。Windows 身份验证方法从简单的登录操作系统到登录应用程序或服务不等。这种方法根据用户仅知道的某些（如密码或令牌）来识别用户。


    ## 在 Macintosh 上使用 802.11


    许多计算机用户将他们的 Mac 连接到无线网络，并不在意正在使用的 802.11 协议类型。网络管理员和高级用户热衷于找出正在使用的 802.11 版本，以优化速度和覆盖范围。每种无线标准的范围有所不同。此外，它们提供了不同的
    WLAN 连接速度。


    查找您的计算机正在使用的 802.11 标准的最简单方法是检查 Mac OS 中无线部分内的高级无线保真信息。您可以通过以下操作检查当前正在使用的无线标准：


    - 按住并保持 OPTIONS 按钮，然后点击菜单栏中的无线图标

    - 确定当前连接的无线路由器并在菜单中搜索 PHY 模式


    在下图中所示，当前路由器如所示使用 802.11n 无线协议。PHY 是物理层（physical layer）的缩写，指的是 OSI 通信模型的底层。


    根据 MAC 网卡和您的路由器，您可能会看到 802.11g、n、b、ac 或 802.11a，有时是 802.11 ay 或 802.11，只要您处于无线局域网连接或网络
    (WLAN) 实验室。正在使用的无线安全加密技术可以使用相同的程序来确定。


    ## 子网划分


    这指的是将网络划分为两个或多个较小且可寻址的网络的过程。您必须理解，每天对 IP 地址的需求日益增长。这就是为什么应该更有效地使用可用的 IP 地址。这也有于减少网络上的流量，因为没有了不必要的数据包发送。网络也将变得更易管理，同一网络的整体安全性也大大提高。


    如果公司为其组织中的每个部门分配子网，他们将发现管理网络非常容易。流量泛洪网络是一个常见的问题。


    ## 公共网络和私有网络


    公共网络是开放的。私有网络是受限的。


    ## TCP/IP 协议


    协议是一组预定义的规则，规定了如何进行通信。


    ### 应用协议


    这些协议构建在 TCP/IP 协议族之上。这些协议包括以下内容：


    - 简单网络管理协议：SNMP 是应用层的一种协议，开发用于管理复杂的通信网络。它的功能涉及发送消息（通常称为协议数据单元 PDU），这些单元被发送到网络的不同部分。SNMP
    的两种类型包括版本 1 和版本 2。

    - 文件传输协议 (FTP)：该协议运行在服务端，通过 TCP/IP 网络在客户端计算机和 FTP 服务器之间复制文件。它主要与 Web 服务器通信以上传和下载文件。它是目前使用的最老的网络协议之一。它使用
    TCP 的 21 端口。利用 TCP 协议进行通信。

    - 简单文件传输协议 (TFTP)：它与 FTP密切相关，不同之处它利用 UDP 协议进行文件传输。由于 UDP 在某些方面不可靠，该协议通常用于文件传输。

    - 简单邮件传输协议 (SMTP)：这是 TCP/IP 协议族中的一种协议，用于在服务器之间发送电子邮件。它在 25 端口上运行。

    - 邮局协议 (POP3)：当我们从邮件服务器获取电子邮件时，使用此协议。Mozilla Thunderbird 和 Outlook Express 是 pop3
    最常用的程序。

    - 互联网消息访问协议 (IMAP)：这允许本地客户端访问远程服务器上的电子邮件。IMAP4 和 Pop3 是常用于检索电子邮件的两种协议。

    - 网络文件系统 (NFS)：这是一种分布式文件系统，允许计算机透明地访问网络上的文件。

    - Telnet：该协议为用户提供了登录远程计算机的能力。用户就像直接与远程计算机接触一样。用户在网络中的位置并不重要，但


