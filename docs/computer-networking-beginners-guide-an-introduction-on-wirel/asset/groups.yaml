    ## Protocol


    ![](img/0937bf4b1739a36662bbe2484b163f1b_12_0.png)


    In the field of computer network and information communication, people often refer
    to the word "protocol". The representative protocols in common use on the internet
    are IP, TCP, HTTP and so on. The protocols commonly used in Lan (local area network)
    are IPX / SPX (NetWare system protocol developed by Novell) and so on.


    ## Why protocols are needed?


    Typically, we send an E-mail, visit a home page to get information and are unaware
    of the protocol that goes on in the background, which is only possible if we reconfigure
    the computer''s network connection and modify network settings. So as long as
    the network is set up and connected successfully, people often forget about protocols
    and things. As long as the application knows how to leverage the protocols, it
    should be enough to allow people to use the network connection they have built.
    It is not uncommon for a person to be unable to access the Internet because they
    do not understand certain protocols. However, in the process of communication
    through the network, the protocol plays a vital role and as you are keen on knowing
    about protocols can give you a good overview of the topic.


    In a word, the protocol is a kind of "agreement" that the client computer and
    the server computer realize the communication through the network. This "convention"
    allows computers that are made up of different devices from different vendors,
    different CPUs, and different operating systems to communicate with each other
    as long as they follow the same protocol. On the other hand, if different protocols
    are used, communication cannot be achieved. It''s like two people speaking in
    different languages who can''t understand each other. There are many types of
    protocols, each of which clearly defines its code of conduct. Two computers must
    be able to support the same protocol, and follow the same protocol for processing,
    so as to achieve mutual communication.


    Before starting to dwell on the topic of protocols further let us discuss two
    very basic things that you need to know for better understanding. They are the
    central processing unit and operating system.


    ### CPU


    CPU (Central Processing Unit). It''s like the "heart" of a computer, every program
    is actually scheduled and executed by it. The performance of the CPU also determines
    the processing performance of a computer to a great extent. So, people often say
    that the history of the computer is actually the history of the CPU. At present,
    people often use CPU Intel Core, Intel Atom, ARM CORTEX, and other products.


    ### Operating System


    Os (Operating System) Operating System, is a kind of basic software. It integrates
    the CPU management, memory management, computer peripherals management, and program
    management and other important functions. The treatment of TCP or IP protocols
    described here, in many cases is already embedded in specific operating systems.
    Today''s operating systems commonly used in personal computers are UNIX, Windows,
    Mac OS x, Linux, and so on.


    The instructions that can be run in a computer vary from one CPU to another and
    from one operating system to another. Therefore, programs designed for certain
    CPUs or operating systems may not run directly if they are copied directly to
    computers with other types of CPUs or operating systems. The data stored in a
    computer also varies from CPU to the operating system. Therefore, if the CPU and
    the operating system between different computers to achieve communication, IT
    needs a party to support the protocol, and follow this protocol for data reading.
    This is the reason why you can’t run an android app in an iPhone.


    In addition, a CPU can usually only run one program at a time. In order to make
    multiple programs run at the same time, the operating system adopts the CPU time
    slice rotation mechanism to switch between multiple programs and schedule reasonably.
    This approach is called multitasking.


    ## So What Is An Agreement In Protocol?


    Agreements are like conversations between people. Here''s a simple example. There''s
    three of them. Sam, Tom, and Jerry. Sam can only speak Chinese, Tom can only speak
    English, and Jerry can speak both Chinese and English. Now Sam and Tom need to
    talk. How should they communicate with each other? What if Tom and Jerry need
    to talk?


    If we: Treat Chinese and English as "agreements." Use "Chat communication" and
    Treat what you say as "data."


    I am afraid that Sam and Tom cannot communicate with each other for as long as
    they speak in one language. Because of the difference in the agreement (language)
    used in their conversation, neither party is able to transmit the data (what is
    said) to the other party. (a simultaneous interpreter between the two can facilitate
    communication, as the gateway does in a network environment.)


    Next, we analyze the conversation between Sam and Jerry. By using this "agreement"
    in Chinese, two people can understand what the other person is trying to say.
    That is to say, Sam and Jerry use the same protocol in order to communicate smoothly
    so that they can transmit the desired data (what they want to say to each other).


    In this sense, agreements are like the language of ordinary speech. Although language
    is a human property, when computers communicate with each other over the Internet,
    it can also be argued that communication is based on something akin to human "language"
    (similarly, some of the actions we take for granted in our daily lives are in
    many cases consistent with the concept of "agreement").


    ## The Birth and Standardization of Computer Communications


    At the beginning of computer communication, systematization and standardization
    did not get enough attention. Each computer manufacturer produces its own network
    products to enable computer communications. No strong sense of systematization,
    layering, etc. In 1974, IBM released the SNA, which exposed the company''s computer
    communications technology as a systematic network architecture. Since then, computer
    manufacturers have also released their own network architecture, triggering the
    systematization of many protocols. However, the various network architectures
    and protocols of various manufacturers are not compatible with each other. Even
    if two heterogeneous computers are connected on the physical level, normal communication
    cannot be realized because of the different network architecture and the different
    protocols.


    This is extremely inconvenient for the user. Because this means that the computer
    network products of which vendor was used in the first place can only be used
    from the same vendor all the time. If the relevant vendor goes bankrupt or the
    product exceeds its service life, the entire network equipment must be replaced.
    In addition, it is not uncommon for different departments to be unable to communicate
    even when they are physically connected to each other because the network products
    used are not the same. The lack of flexibility and extensibility made it difficult
    for users to use computer communication freely.


    With the increasing importance of computers, many companies have come to realize
    the importance of compatibility. People began to work on technologies that would
    allow heterogeneous models produced by different manufacturers to communicate
    with each other. This promotes the openness and versatility of the web.


    In order to solve these problems, ISO (International Organization for Standards)
    has established an International standard, Osi (Open Systems Interconnection reference
    model), and standardized the communication system. Currently, OSI protocols are
    not commonly used, but the OSI reference model, which was the guideline of Osi
    Protocol design, is often used in the development of network protocols.


    The standardization of the protocol also enables all devices that follow the standard
    protocol to no longer be unable to communicate due to differences in computer
    hardware or operating systems.

