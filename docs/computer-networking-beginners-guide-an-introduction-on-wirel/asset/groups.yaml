    数据中心自动化对于实现每个公司有效竞争所需的业务成果起着重要作用。它能够有效地实现跨计算、存储层和虚拟环境的 IT 流程。思科数据中心管理旨在为公司提供采取行动并快速结果所需的活性。思科可以支持任何数据中心——从基础设施到应用程序，为组织设计正确的自动化策略。


    ## 安全数据中心


    企业员工现在离开了组织边界，从世界任何地方访问数据，这使得公司难以保护数据。由于今天的数据中心极其复杂，组织必须重新思考其安全策略。通过思科安全数据中心，他们可以通过对整个企业、云和数据中心的所有用户和网络流量进行完全可见，利用更快的事件检测。通过在数据中心内部移动，通过控制未经授权的用户和高级威胁进入来减少攻击。它还可以识别、拦截并响应数据中断和泄露。


    ## 超融合基础设施


    超融合的便利性在 Cisco HyperFlex 无处可见。无论是核心、边缘还是多云，超融合一直让 IT 处于快速创新的中心，而当前数据就是一切。在这一最新创新中，HyperFlex
    和 Cisco Intersight 旨在满足全球部署超融合基础设施的特殊需求。自创立以来，它在性能方面一直排名第一。它以对多云的适应设施而闻名，并通过 Cisco
    Intersight 部署在任何地方。


    ## IPv4 汇总


    ### 目的与配置


    好了，你终于通过了子网划分和 VLSM。现在是时候汇总（Summarize）了，或者用 Spock 的话来说，“路由聚合队长”（你可能注意到我是原版《星际迷航》的超级忠实粉丝）。这实际上意味着，我们必须将许多小网络聚合成一个或可能两个网络，然后将它们发布给我们的核心路由器，从而减小它们的路由表。您的核心路由器不需要了解所有不同的局域网（LAN）来做出路由决策。“路由聚合”的另一个用途是发布汇总地址。这是为了让目的层的设备能够根据其意愿分配
    IP。


    汇总允许路由器在分析其自身的路由表以查看到达目的地需要哪条路径时，处理时间更更短。


    思科有一个名为“思科三层模型”的标准。该模型就像 OSI 模型一样，是一个理论模型。该模型仅根据路由器在拓扑中的位置告诉您某些路由器可能执行的角色；让我们来看下：


    **思科三层模型**


    | 层 | 描述 |

    | :--- | :--- |

    | 核心层 (Core) | 核心层的唯一目的是可靠、快速地交换信息。 |

    | 分布层 (Distribution) | 该层的主要目的是提供路由、过滤、WAN 访问，并决定有多少数据可以访问核心。此层也可以“工作组层”。 |

    | 接入层 (Access) | 这一层也称为“桌面层”，是分布层的扩展。这是我们谈论的地方。 |


