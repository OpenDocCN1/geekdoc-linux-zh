    这既适用于小型和大型软件程序，从仅有几行代码的软件到像操作系统这样极其庞大的软件程序。只要安全上存在薄弱环节，这些程序都是易受的。过时的插件和旧版本的软件（如浏览器）是最常见的易受软件类型。你不能因为安装了更新的插件就认为它是安全的。某些插件会保留已的旧版本，这可能会损害该软件的安全性。


    设计不安全或用户错误：诱骗用户运行受恶意软件感染的特定文件是传播恶意软件的另一种常用方法。此类类别可能包括复制到硬件（如 USB 设备或闪存盘）中的恶意软件。当使用这些硬件时，恶意软件会自动执行并附着到用户的系统中。如果该系统连接到网络，恶意软件就有可能跨越网络传播到每个连接到该网络的系统上。这是黑客用于传播恶意软件的一种非常有效的方法。


    使用过时的防毒软件：使用过时或免费的防毒软件的效果不如使用最新的更新版本。更新后的防毒软件会在其数据库中包含所有新的病毒和木马的定义。旧版本的防毒软件可能保护你免受旧威胁，但它们无法检测并防止你受到新的恶意软件和威胁。


    特权用户和特权代码：在计算中，权限意味着修改系统的访问权限。在某些软件中，用户被赋予了比他们应有的更多的访问权限或权利。这通常发生在设计不当的软件上。恶意软件可以利用这种漏洞。恶意软件可以利用此漏洞的方法有两种，如下：


    1. 特权用户：在某些系统中，用户被赋予更改和修改程序代码的权限。这样的用户被称为特权用户。

    2. 特权代码：在其他某些系统中，用户执行的代码将被赋予更多权限。这些权限包括访问和修改系统资源的权限。此类代码被称为特权代码。少数操作系统和一些脚本语言会将这些权限赋予代码，使其成为特权代码。


    在这些情况下，当用户执行代码时，系统将作为运行代码的用户为代码提供所有权限。这将导致系统受到来自互联网的恶意软件的攻击。


    **同质性**


    我们可以说，当一组系统都连接到同一个网络并在相同的操作系统上运行时，它们就是同质的。这种现象被称为同质性。当存在同质性时，恶意软件更容易在连接到该网络的所有系统之间传播。例如，如果其中一个系统中存在病毒，它可以自行传播到该网络中的所有系统。同质性存在于各种组织中，如学校、大学和大多数软件机构。大多数系统运行在
    Windows 或 Mac 操作系统上。专注于其中任何一个操作系统都会为黑客提供极佳的机会，来利用大量运行在这些系统上的系统。解决同质性的一种方法是在每个系统上使用不同的操作系统。这将使恶意软件的传播变得困难。但在初始阶段存在一些缺点，例如培训和维护成本较高。


    **掩盖足迹**


    一个优秀的伦理黑客永远不会留下他们入侵的痕迹。黑客无法承担留有其已入侵网络或系统证据的风险。在这种情况下，黑客可以使用恶意软件清理所有记录（例如事件日志），并实现干净的退出。有许多类型的恶意软件可以隐藏网络流量并清理目录。


    - *代理服务器*：对于意图穿过网络敏感区域的黑客来说，利用代理服务器是一个非常好的主意。代理服务器不会被入侵检测软件检测到，因为它们不会留下任何痕迹。


    为了成为一个优秀的黑客，你应该能够根据你当前的有效载荷（payload）选择正确的恶意软件。木马通常是黑客可以利用的最好的恶意软件。这是因为它们的隐蔽性以及长时间监控用户的能力。


    **网络犯罪软件**


    黑客用于黑客的软件工具有时被称为网络犯罪软件（crimeware）。网络犯罪软件可以定义为：

    - 通常不是理想的硬件或软件应用程序。

    - 主要用于在线犯罪活动。

    - 非自愿地导致犯罪。


    网络犯罪软件的一种类型是机器人（bot）。下面简要描述了机器人。


    **机器人 (Bots)**


    什么是机器人？


    Bot 是 robot 的缩写，但它们与科幻电影中的机器人不同。它们甚至不是公司生产线制造的机器人。它们可以被认为是今天互联网面临的最复杂的网络犯罪软件之一。这些机器人与木马和蠕虫非常相似。它们与其他类型的恶意软件不同之处在于，它们会代表放置它们的攻击者执行的各种自动化任务。这些攻击者通常位于互联网上的安全位置。机器人可以执行诸如发送垃圾邮件等任务，这属于拒绝服务攻击。被机器人感染的计算机将受到攻击者的控制；这些机器被称为僵尸主机（zombies）。


    机器人可以通过许多不同的方式溜入计算机。它们在互联网上寻找未受保护的计算机。当发现易受的计算机时，它们会迅速感染它并向攻击者报告。它们被专门设计为保持隐藏，直到主命令它们。机器人并非设计为独立工作。它们与其他被感染的机器共同工作。这组机器被称为僵尸网络（botnet）。僵尸机器将由命令和控制中心（这是一个主计算机）控制。攻击者使用命令和控制服务器指示僵尸执行活动。通常，僵尸网络由大量被机器人感染的机器组成。这些分布在全球范围内。较小的僵尸网络可能包含数百或数千台计算机。较大的僵尸网络拥有十万台僵尸。


