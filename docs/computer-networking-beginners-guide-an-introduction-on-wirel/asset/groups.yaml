  - '[PAGE 93]


    15 entries to see where it needs to send the destination packet. However, we


    are going to help with that situation by summarizing each of the LAN’s


    networks and advertising their summary address to the HQ router. This will


    reduce the amount of entries to the three learned routes and in turn, its three


    connected routes. Doing this will decrease the overhead and the router would


    only have to look at the three learned routes instead of twelve. So, how do we


    do this? Let’s take a look, shall we?


    Bear in mind that the starting mask is /24. Subsequently, we count left to


    right; you would start at the beginning of the third octet, which is the


    interesting octet.


    The summary address 192.168.8.0/22


    Now that we found our summary address by drawing the line between the


    common and un-common bits, it’s time to advertise to the HQ router through


    the interface that faces the HQ router. Following is the command you would


    use:


    LAN1


    IP summary-address EIGRP 100 192.168.0.0 255.255.252.0


    LAN2


    IP summary-address EIGRP 100 192.168.4.0 255.255.252.0


    LAN3


    IP summary-address EIGRP: 100 192.168.8.0 255.255.252.0


    Let’s take a look at the HQ routers routing table after we advertise the


    summary routes.


    ***HQ#sh ip route***


    Codes: C - connected, S - static, I - IGRP, R - RIP, M - mobile, B - BGP


    D - EIGRP, EX - EIGRP external, O - OSPF, IA - OSPF inter area


    N1 - OSPF NSSA external type 1, N2 - OSPF NSSA external type 2


    E1 - OSPF external type 1, E2 - OSPF external type 2, E - EGP


    i - IS-IS, L1 - IS-IS level-1, L2 - IS-IS level-2, ia - IS-IS inter area


    \* - candidate default, U - per-user static route, o - ODR


    P - periodic downloaded static route


    ***Gateway of last resort is not set***


    10.0.0.0/30 is subnetted, 3 subnets


    C 10.1.1.4 is directly connected, Serial0/0/0'
  - '[PAGE 94]


    C 10.1.1.8 is directly connected, Serial0/1/0


    C 10.1.1.12 is directly connected, Serial0/2/0


    D 192.168.0.0/22 \[90/20514560\] via 10.1.1.5, 00:02:08, Serial0/0/0


    D 192.168.4.0/22 \[90/20514560\] via 10.1.1.9, 00:01:05, Serial0/1/0


    D 192.168.8.0/22 \[90/20514560\] via 10.1.1.13, 00:00:15, Serial0/2/0


    ***HQ#***


    Here you can see that we have three routes instead of twelve. For that


    reason, we are learning that through the routing protocol “EIGRP”, your core


    router needs to only look at the 3 learned entries vs. 12! Isn’t this so much


    better on your routers processor usage?


    There you go! This is why and how we summarize...pretty simple right? I


    believe it’s even easier than subnetting. “really Laz?”, well, think about it?


    It’s essentially the same process. All you have to do is find the “magic” line.


    In this case you draw the line between the common and uncommon bits and


    voila!...you’re done. You have to admit. It doesn’t get any easier than that.


    I know what you’re thinking “Laz, are we taking a trip into the


    jungle?...get it? “wild = jungle” Oh well, I tried” Anyway, we will take a


    JOURNEY into the world of Wildcard Masking, but it will be fun, easy but


    informative. You guys should know me by now.


    However, before we do, let me show you one more example of


    summarization that you may find on your exam, but if you don’t, consider


    yourself lucky, at least this will reiterate what I’m trying to convey.


    As you can see, we started with a /30, but now we have a /27. This is how


    all these networks come together. All you have to do is follow the same


    concepts and you will be okay. Count from left to right until your reach the


    un-common bit values and draw your line, that’s how you find your new


    mask. In return, the summary-address would be 192.168.1.0/27. I hope that


    by now you have realized that this is really a piece of cake...not the


    complicated, theoretical equations with physics algorithms that other books,


    teachers and instructors have made it out to be. ;) Remember that my


    method is to teach you in a very simplistic manner so you can grasp and


    comprehend the concepts to be able to pass your CCNA certification exam,


    or your college exam, or whatever exam that would include questions on


    IP’s. This is the sole purpose why I decided to write this book. I felt a need
    to


    demystify the whole intimidating scheme surrounding IP’s.'
