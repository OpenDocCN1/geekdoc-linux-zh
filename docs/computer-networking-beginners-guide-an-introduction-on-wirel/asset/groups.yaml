    discouraged. In this section, I''ll try to cover a few of the most common wiring
    environments and how to best go about running your wires.


    If your whole building is in one section and has drop ceilings throughout and
    relatively new construction, stop now. Give thanks to “Wirus,” the ancient god
    of networking, and be happy throughout your life. However, if you have old construction,
    a four-story house built in sections over the last 200 years, with stucco and
    plaster walls, concrete floors and timbers brought over on the Mayflower... quit
    now and find another job. You''re in trouble. (Don''t forget, cruel and unusual
    punishment is forbidden under the constitution!)


    ## Drop Ceilings


    In case you don’t know what drop ceilings are, they are the tiled ceilings where
    every third one or so is a fluorescent light fixture and each tile is held up
    by a grid of metal framing. The grid work is held up with wires that attach to
    the ceiling above. This ceiling is "dropped" down from the real ceiling to a standard
    height throughout the room or building. In between the drop ceiling and the real
    ceiling is a lot of space, electrical conduits and wiring, the lights (of course),
    the air conditioning ductwork, and a few other surprises.


    It''s not hard to wire a building through the drop ceiling area but you''ll need
    to be prepared for it. First of all, do not climb up into the ceiling and expect
    to walk on it! You''ll undoubtedly fall right through. It''s made to hold up ceiling
    tiles and lights, not people. So how do you do it? Well, to start with, open a
    tile as close as possible above the wall in the phone closet where your mounting
    board will be. Next, get a flashlight, climb a ladder to about chest height into
    the ceiling, and look around to see what kind of layout it has.


    In most newer construction, the walls to the office areas only extend a few inches
    above the drop ceiling. They are usually at standard heights — maybe eight feet—with
    the ceiling just a few inches below. The only walls that will extend to the real
    ceiling are the fire walls between major sections of a building. These are also
    made of sheet rock and can usually be penetrated with no problem to run small
    wires. If this is what you find, you should have relatively easy wiring runs.


    After getting your bearings, you''ll want to open a tile at the first destination
    you will be wiring. Check the path between the two sections for obstructions,
    ductwork to go around, and other possible problems. Decide on the best direction
    to go first and head in that direction. How, you ask? Well, you can''t walk or
    crawl up there, so you have to figure out a way to get the wires from point A
    to point B.


    There are several methods for doing this. A couple of my favorites almost make
    it fun. All of them involve string. By passing a string along the same pathway,
    you can tie the wire to it and pull it through. (They don''t call it pulling wire
    for nothing, you know.) Don''t use weak string or small-sized string, like kite
    string, because pulling on it can cut your hands or it could break if the wire
    gets stuck. Use a nylon string with several fibers woven together like a small
    rope. For example, the string used for tying packages should do nicely.


    Go to an area 20 to 30 feet from the first open tile, between the two that are
    already open, and open a third tile. Run the string from the first open tile to
    the next one down the line and repeat every 20 to 30 feet until you reach your
    destination. To get the string from the first hole to the second, you can use
    one of these interesting methods:


    - Get a small crossbow and tie the string to the arrow. Be sure and take the point
    off if possible, or make sure you avoid hitting anything that could be damaged.
    Just fire across the next opening so that you can find the string when you get
    there. You might be able to use a toy dart gun as you would the crossbow.


    - Tie something heavy to the string and toss or throw it toward the goal. This
    is a little more cumbersome, but since we network types rarely have crossbows
    around, it''s more likely you''ll end up using this method. Some of the better
    items to tie on are large fishing weights, a roll of tape (electrical tape works
    okay; duct tape rolls are pretty heavy and could cause problems), a pair of pliers,
    or some other tool like an adjustable wrench. Try to avoid things that will wobble
    in flight, or that may stick through the ceiling tiles when they land.


    - If there''s very little room above the ceiling tiles — I hate this one — you
    may have to take them off one at a time and just pull the string from one to the
    next until you reach the end.


    In all cases, be sure to pull out enough string to get to the next location before
    you shoot or toss the end of the string. Otherwise, you throw the weight and it
    bounces right back at you when it reaches the end of the string. Also — sorry,
    I have to say this — be sure you have one end of the string secured before you
    throw or shoot it. It''s very frustrating to send the whole roll of string across
    the ceiling and have to do it over. Once you reach the next hole, simply repeat
    the process until you have one long string stretched from one end to the other.


    The string method can also work in other types of wiring situations, but don''t
    try to use it for close spaces or in areas that require the wire to make a lot
    of corners in the run.


    When you get the string run, you''re ready to pull the wire through. It works
    best to have someone at one end feed the wire to you while you pull from the other
    end. Occasionally you''ll get the wire stuck on something and may have to open
    a tile where the wire is stuck to get it to continue feeding through. The wires
    that hold the ceiling grid up are notorious for this, because they make a loop
    in the gridwork and then wrap around themselves, leaving the loose end sticking
    up.


    ## String and Wire Tied Together for Pulling


    Each run is pretty much the same from here. You can move from one location to
    the other by following the above instructions for each location. Once you get
    to each location, you''ll have to decide whether to run the wire down the wall,
    inside the wall to an existing box, or inside the wall to a new box that you add.


    ## Other Types of Construction


    Of course, not all construction is new and there are other methods of running
    wires. You may have to ask someone about your particular setup. Some buildings
    have wire conduits pre-installed with room for more wires to be pulled through.
    Some have basements or crawl spaces through which you can run wires. In some cases,
    you may have to actually run around the outside of the building to get from one
    room to the next. Just make sure you''ve looked at all options and picked the
    best one based on ease of installation, cosmetics, expandability, protection for
    wires (and so on), and ability to get to the phone closet.


    ## Wiring in Walls


    Once you get from the phone closet to just above your first location, you may
    be able to run the wire down the inside of the wall. If this is sheet rock or
    wallboard on standard studs, you should be able to do this easily, especially
    if there is no insulation in the wall. (Internal walls rarely have insulation
    unless sound proofing is necessary.)


    ### Running Wire Down a Wall Between Studs


    Before cutting a hole, make sure you are between the same studs. Check the electrical
    outlets for the correct height to make the opening match up. Also, be sure there
    is not an electrical outlet on the opposite wall. You could cut into some wiring,
    as it is sometimes run across the walls at the same height. To avoid this, trace
    the area to be. Use a small knife or utility razor to cut through the wall board.
    Be careful not to extend the knife too far into the wall. Once you have a hole
    cut and are sure it''s safe, you can use a small saw or larger knife to clean
    out the edges of the cut.

