    \ repeating the same commands only on different devices. Inevitably, troubleshooting\
    \ is required because of errors made using the manual methodology. Network automation\
    \ solves all these problems.\n\n### Scale\nThe size and scale of the modern network\
    \ has grown exponentially to accommodate the needs of organizations. Networks\
    \ that started out as a few switches and a router are now large-scale enterprise\
    \ networks. While logical networks evolve and grow, the tools used to manage physical\
    \ devices remains stagnant. On the campus we now see VoIP phones, wireless access\
    \ points, IoT, security cameras, print fleets, desktop fleets and meeting room\
    \ equipment. In the data centers large physical and virtual footprints are not\
    \ uncommon. World-wide WANs, with switching and routing in each remote office,\
    \ is now commonplace. The device boom has not slowed with even more devices being\
    \ added to networks without the appropriate centralized, automated, management\
    \ solutions available.\n\nNetwork management starts with the console cable and\
    \ a local CLI. Remote access to the CLI over a management IP address must be enabled\
    \ by the administrator. Now imagine network technicians still needing to go to\
    \ the physical console of every device to manage it. It sounds unreasonable, but\
    \ only remote access to the CLI has been centralized. The same methodology of\
    \ logging into the CLI to manage the device is followed as if the operator is\
    \ virtually at the console. In fact, these remote connections are known as virtual\
    \ teletype, or VTY, lines. At the scale of today’s networks, connecting to the\
    \ CLI of every device to manage the enterprise is simply unachievable. Even with\
    \ a large capable network operations team, everyone is going to operate, configure,\
    \ and manage each device their own way. This leads to configuration drift and\
    \ a lack of consistency at scale.\n\nAutomated solutions scale with the network\
    \ as device configurations are templated. Small, feature specific, modular templates\
    \ ensures each device is standardized. When new feature requirements arise, the\
    \ configuration commands are templated and released at scale, updating the network\
    \ standards uniformly. Unique, device-specific, meaningful information is modeled\
    \ in a data dictionary. This dictionary holds all the variables used to compile\
    \ a unique configuration for each device. Code can be written modularly to match\
    \ the topology of the network. By creating playbooks specific to the environment,\
    \ such as campus, data center, WAN, or cloud, Ansible playbooks ensure code simplicity,\
    \ readability, and development flexibility.\n\n### Complexity\nThe complexity\
    \ of networks has dramatically increased. Virtual Route Forwarders (VRFs), QoS,\
    \ wireless connectivity, cloud connectivity, Virtual Private Network (VPN), First-Hop\
    \ Redundancy Protocols (FHRP) such as HotStandby Router Protocol (HSRP), Virtual\
    \ Switching Systems (VSS), and security and identity services as 802.1x, have\
    \ stressed the capabilities of both engineers who design and operators who run\
    \ the network. Abstracting important data from the network allows operators to\
    \ see the device as a collection of human-readable variables. Human-readability\
    \ of the intended configuration for a device also reduces the technical requirements\
    \ needed to understand how a device is configured because the information is presented\
    \ as a data model.\n\n### Documentation\nNetwork documentation is extremely important,\
    \ especially during times of crisis, however it is often overlooked during day-to-day\
    \ operations. Changes may or not be reflected in documentation. Files may be scattered\
    \ across a variety of sources such as local drives, SharePoint sites, or network\
