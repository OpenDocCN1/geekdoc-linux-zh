    ## IPv4 Summarization


    ### Its Purpose & Configurations


    Well, you finally got through subnetting and VLSM. Now comes time to Summarize
    or as Spock would call it, “Route Aggregation Captain”. (You might notice that
    I’m a big fan of the original Star Trek). What this really means is, that we must
    take a bunch of small networks and clump them together into one or maybe two networks,
    and then we would need to advertise them to our core routers, hence, making their
    routing tables smaller. There is no need for your core routers to know about all
    your different LAN’s in order to make a routing decision. Another use of “Route
    Aggregation” is to advertise a summary-address. This is to enable a device, at
    the destination level, to be able to distribute the IPs as it sees fit.


    Summarization would allow for lower processing time, when a router analyzes its
    own routing table to see which path it needs to take to get to a destination.


    Cisco has a standard called the “Cisco Three Layer Model”. This model, just like
    the OSI model, is a theoretical model. The model simply informs you which roles
    certain routers may perform based on where it sits on the topology; let’s look
    at the following:


    **Cisco’s Three Layer Model**


    | Layer | Description |

    | :--- | :--- |

    | Core | The only purpose of the Core layer is to switch information reliably
    and quickly. |

    | Distribution | The primary purpose of this layer is providing routing, filtering,
    WAN access and to decide how much data can access the core. This layer can also
    be called the “Workgroup Layer”. |

    | Access | This layer also called the “Desktop Layer” is an extension of the Distribution
    layer. This layer is where we talk about collision domains and technologies such
    as Ethernet or Gigabit. |


    Important to note: Just because there are three layers, it does not mean you must
    have three different devices, remember this is a theoretical model.


    With summarization there are some rules that you should follow. The first being
    that, the network should start with an even number and have an even number of
    networks as to not waste any IPs in the process; thereby not introducing any IPs
    in the network that do not need to be there.


    The other rule would be in summarization, which is the opposite of subnetting.
    There is a contrast that can be seen here. In subnetting, we would move the line
    to the right and get a larger subnet mask and fewer hosts. In summarization, however,
    we move the line to the left and get a smaller subnet mask and a greater number
    of hosts.


    So, let’s reiterate; the purpose of summarization is to keep the routing tables
    small, so the router does not have to go through a huge list of networks to make
    a routing decision. Below is an example of what we mean:


    Once we drew our line, looking from left to right on the third octet and stopping
    where the bits that go down the column are not common, we can clearly see that
    they are 0’s and 1’s. We now have our new subnet mask and as you can see, all
    the bits to the left of the line are all zeroes. This is precisely why we have
    “zero” in the third octet of the summary address. I hope you got it!


    Nevertheless, let’s see the actual range of this summary address using our subnetting
