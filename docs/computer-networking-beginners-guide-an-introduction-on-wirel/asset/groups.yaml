    A password can be used to prevent unauthorized access or restrict


    physical access to the switch. Switches support console lines for local logins.


    Likewise, they support VTYs for remote logins.


    Every supported line has to be secured for the User Exec mode. If you


    leave any lines unsecure, you also give the malicious attacker a chance to


    intrude your network. To set your password, you can type in the following


    commands:


    When you are done, you have to type in exit until you see the following:


    Press the Enter button, and you will be prompted to enter a password.


    This password is the one that you just set earlier. If other people do not know


    it, they will not be able to continue.


    If you typed in the correct password, which in this example is


    consoleXYZ, you will be able to continue. The password is hidden for your


    protection.


    Anyway, now that you have set the password for the console, you have to


    set the password for the VTY. In this example, the password telnetABC is


    used. You can also type in ‘pass’ instead of ‘password’ as a shortcut.


    VTYs refer to virtual terminals, such as SSH and telnet. A switch may


    support multiple VTY lines. However, only the first five lines or 0-4 lines are


    enabled by default. If you want to have more lines, you need to manually


    enable them. How many lines you can use depends on the Switch that you


    choose from your Packet Tracer. For example, 16 lines are supported by the


    2960 switch.


    You can create a password for every line, but you need to specify the


    number of the line. You can also just create one password for all of the lines.


    In this example, a single password is used for all the lines.


    Real-life Application: So, how can you apply this in real life? Well,


    setting an individual password for each and every one of the lines you have is


    a good strategy to protect your company network. This strategy is actually


    ideal for large organization and companies. On the other hand, sharing a


    single password is much preferable for small organizations and companies, in


    which there are not so many network administrators who work there.


    You can either choose the password option or the secret option. Both of


    them work the same way, anyway. However, if you choose the secret option,


    your password gets stored in an MD5 encryption format whereas if you go


    for the password option, your password gets stored in a simple text format.'
