  - "[PAGE 10]\n\n**Introduction**\n\n![](img/0937bf4b1739a36662bbe2484b163f1b_10_0.png)\n\
    \nA computer network\n\nis made up primarily of interconnecting common, programmable\
    \ hardware.\n\nThe hardware is designed for a specific purpose (for example, to\
    \ transmit\n\ndata or video signals). This programmable hardware can be used to\
    \ transmit a\n\nvariety of different types of data and can support a wide and\
    \ growing range\n\nof applications. \n\nAccording to this definition: (1) the\
    \ hardware connected to a computer\n\nnetwork is not limited to ordinary computers,\
    \ but includes smartphones and\n\nother different types of devices like AR devices,\
