    \ development specifications. If companies can make their development specifications\
    \ public, and more of their peers can use them in time and become industry standards,\
    \ then there will be more and better products that can survive and be used by\
    \ us.\n\n## OSI reference model\n\nThis model divides the necessary functions\
    \ of the communication protocol into 7 layers. Through these layers, the more\
    \ complex network protocols are simplified. In this model, each layer receives\
    \ a specific service provided by its lower layer and is responsible for providing\
    \ a specific service to its upper layer. The conventions that govern the interaction\
    \ between upper and lower layers are called \"interfaces.\" The conventions that\
    \ govern interactions between layers are called protocols.\n\nProtocol layering\
    \ is like modular development in computer software. The recommendations of the\
    \ OSI reference model are ideal. It wants to implement all the modules from the\
    \ first layer to the seventh layer and combine them to achieve network communication.\
    \ Layering allows each layer to be used independently, so that even if some of\
    \ the layering changes in the system, it does not affect the whole system. Therefore,\
    \ it is possible to construct a system that is both extensible and flexible. In\
    \ addition, by layering the communication functions can be subdivided, making\
    \ it easier to implement separate protocols for each layering and to define the\
    \ specific responsibilities and obligations of each layering. These are all advantages\
    \ of layering. The downside of layering may be over modularity, making processing\
    \ more burdensome, and having to implement similar processing logic for each module.\n\
    \n### Understanding Layering Through a Simple Example\n\nFirst, take telephone\
    \ chat as an example. Two people, Adam and Eve, are talking on the telephone (communication\
    \ device) in English (language protocol). On the surface, Adam and Eve are having\
    \ a direct conversation in English, but in reality, Adam and Eve are both listening\
    \ to the voice on the receiver of the telephone, both speaking into the microphone.\
    \ Imagine what a person who has never seen a telephone would think if they saw\
    \ this? I'm afraid he must think Adam and Eve are talking on the telephone in\
    \ networking perspective.\n\nThe language protocol they use in an audio input\
    \ to the microphone is translated into radio signals at the communications device\
    \ level. Sent to each other's phones, and then converted to audio output by the\
    \ communications equipment layer, passed to each other. Thus, Adam and Eve actually\
    \ have a conversation using an interface between the telephone and the voice converted\
    \ by audio.\n\nPeople often think that when they pick up the phone to talk to\
    \ someone, it's as if they're talking to them directly, but if you look closely,\
    \ it's really the phone that's mediating the whole process, and there's no denying\
    \ that. What if the electronic signals from Adam's phone were not converted into\
    \ sounds of the same frequency as those from Eve's? This is similar to the difference\
    \ in protocol between Adam's phone and Eve's phone. Eve may hear the voice and\
    \ feel that he is not talking to Adam, but to someone else. If the frequencies\
    \ are far apart, Eve is more likely to think he is not hearing English.\n\nSo,\
    \ what if we change the communication device layer by assuming that the language\
    \ layer is the same. For example, change the telephone to a radio. If the communication\
    \ equipment layer uses the radio, they must learn to use the radio method. Since\
    \ the language layer is still using the English protocol, users can talk just\
    \ as normally as they used to when they were on the phone.\n\nSo, what if the\
    \ communication device layer uses a telephone and the language layer changes to\
    \ English? It is clear that the telephone itself will not be limited by the user's\
    \ language. Therefore, this situation and the use of English calls exactly the\
    \ same, still can be achieved call.\n\nThe previous example simply divides the\
    \ protocol into two layers. However, the actual packet communication protocols\
    \ can be quite complex. The OSI reference model organizes such a complex protocol\
    \ into seven easy-to-understand layers.\n\n## OSI Reference Model\n\nThe OSI reference\
    \ model does a good job of summarizing the necessary functions for communication.\
    \ Network engineers also often prototype the layers of the OSI reference model\
    \ when discussing protocol-related issues. For beginners in computer networks,\
    \ learning the OSI reference model can be the first step to success.\n\nThe OSI\
    \ reference model is, after all, a \"model,\" a rough set of definitions of what\
    \ each layer does, without a detailed definition of the protocol and interface.\
    \ It serves only as a guide to learning and designing protocols. Therefore, if\
    \ you want to know more details about the agreement, it is necessary to refer\
    \ to the specific specifications of each agreement itself.\n\nMany communication\
    \ protocols correspond to one of the seven layers of the OSI reference model.\
    \ From this, we can get a general idea of the position and function of the protocol\
    \ in the whole communication function. While it takes a careful reading of the\
    \ specification to understand the protocol, its general purpose can be found at\
    \ the corresponding OSI model layer. This is why the OSI model is the first to\
    \ be studied before learning about each protocol.\n\nThe OSI (Reference Model)\
    \ divides communication functions into seven layers, called the OSI reference\
    \ model. The OSI Protocol, based on the OSI Reference Model, defines the protocol\
    \ and interface-related standards for each layer. Products that follow the OSI\
    \ Protocol are called Osi products, and the communications they follow are called\
    \ Osi Communications. Do not confuse \"OSI reference model\" with \"OSI protocol\"\
    \ because of their different meanings.\n\n## Mitigating Network Threats\n\nThere\
    \ is nothing wrong with being paranoid about your network; in fact, paranoia might\
    \ actually save you. Even the strongest network is always at risk of a security\
    \ threat. The secret to maintaining your network integrity in terms of security\
    \ lies in mitigating risks.\n\n### Identifying Threats\n\nThe dangers to your\
    \ network are insane. There are so many risks out there that you would be fooly\
    \ to ignore them, or assume that you have the most protected network. Anyone who\
    \ tries to gain unauthorized access to your network usually does so either for\
    \ reconnaissance, or for destructive reasons. Some security breaches are so carefully\
    \ crafted they can accomplish both. Security breaches are important because there\
    \ is so much damage that can be done with the information accessed from your network.\n\
    \nMany people are currently paying the price for using an insecure network. Their\
    \ private and personal data was stolen, and some of them were impersonated. You\
    \ might end up being linked to a terror attack you had no idea about, because\
    \ someone stole your identity and used it for such.\n\nMost people only recognize\
    \ malware and viruses as the biggest risk as far as security is concerned. However,\
    \ there are so many other risks out there that can have just as damning an effect\
    \ on your network. There are many security threats that you will learn about.\
    \ Some have been around for years, others might come up in the future. \n\n- Denial\
    \ of service: Denial of service attacks (DoS) block you from accessing the network\
    \ or resources associated with the network. It can be done in so many ways. DoS\
    \ attacks are common today, and they usually target large corporations. The attackers\
    \ can flood the organization website with too much traffic that the servers cannot\
    \ handle, making it impossible for legitimate users to access the website.\n-\
    \ Ping of death: The ping of death is one of the common forms of DoS attacks.\
    \ So, what happens in the ping of death attack? To communicate, your device sends\
    \ ICMP packets to a remote host to establish its availability. However, in a ping\
    \ of death attack, the intruder will flood the remote host with ICMP packets.\n"
