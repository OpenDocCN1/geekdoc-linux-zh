    \ Documentation that does exist is often represented as complex Visio diagrams,\
    \ large Excel spreadsheets or text files that do not interact with the network\
    \ dynamically. \n\nPart of the TFS repository master branch should be a folder\
    \ structure containing both the dynamic documentation Ansible playbooks, as well\
