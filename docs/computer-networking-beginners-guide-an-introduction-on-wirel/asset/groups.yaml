    网络上的任何设备都可以在构建时自动生成，并可以通过 TFS 获取。这些文档文件的历史作为源码和版本控制包含在内。当添加或删除代码时，生成的文档会自动进行更新以反映这些更改。


    ## 标准


    随着网络的演变和转型，企业标准的维护随时间推移变得非常困难。通常，项目压力和日常工作的交付物会导致标准被忽视、推迟或忽略。随着网络设备和 IP 地址的来来去，随着时间的推移可能会发生自然的配置漂移。如果网络设备继续运行，错误的配置或糟糕的标准可能不会被察觉。一旦被识别出来，这些表面的更正可能被视为低优先级。


    Ansible 的动态模板化保证了每个设备都有标准的配置。可以实现完全的配置覆盖，并且运行配置中的每一行代码都可以从模板派生。通过在“真理源”与设备配置之间实现完全的幂等性，可以确保基于意图的标准得到统一应用。使用这种方法，规模不是问题，人为错误的因素也是如此。当出现新标准或需要对现有标准进行更改时，只需更新集中的模板和数据模型。这些更改将通过自动化引擎推送，并将新标准交付到网络。


    ## 黄金配置（Golden Configuration）


    黄金配置在 Windows 操作系统管理中被称为“预期状态配置”，它有很多名称。通过使用 Jinja2 模板和 YAML 数据模型，可以使用软件开发方法论实现网络中每个设备的黄金配置。模板内部的逻辑用于智能地生成设备配置命令。这些配置将大规模应用于包含在
    Ansible *hosts.ini* 清单文件中的所有设备。


    主分支（master branch）代表网络的黄金配置。自动化构建会将主分支的各种构制品打包，并为该迭代版本的网络提供一个版本号。然而，当需要更改时（无论多微小），会创建工作分支进行代码开发和测试。开发期间频繁的
    Git 提交用于将更改检入工作分支。通过拉取请求（pull request）将这些累积的更改合并到主分支，然后将其部署到生产环境中，大规模地更新标准的黄金配置。


    ## 安全


    一些重大的安全泄露发生是因为 telnet 在具有公网 IP 地址的端口上开启。安全标准和最佳实践现在可以硬编码到模板中，以确保策略的执行。通常，访问层的接口上需要复杂的配置来解决安全风险。考虑访问层以及应该实现的所有以下安全标准：


    - 生成树工具包命令。

    - 桥接协议数据单元 (BPDU) 控制。

    - Portfast。

    - 802.1x 或端口安全命令。

    - 数据和语音 VLAN。

    - QoS 设置。

    - CDP 设置。

    - 以太网供电 (PoE) 设置。

    - 建立 Native VLAN。

    - 在汇干口上应用 Native VLAN。

    - NTP 源。

    - 登录时显示安全横幅（Security banner）。

    - AAA。

    - RADIUS / TACACS+。

    - 管理端口上的 ACL。

    - 禁用 VLAN 1。


    安全需求如果缺失或应用不当，将导致网络内部漏洞和威胁。这些漏洞可能会被利用，在某些情况下导致中断或数据丢失。拥有有保证的模板配置确保了重要的安全组件被硬编码到每个模板中，并应用于设备的全局配置以及每个接口配置。现在整个校园的每个访问端口都可以以相同的方式进行配置，并自动包含安全态势标准。


    ## 敏捷性


    在按需的世界里，网络仍然是许多项目的瓶颈。转向自动化的推动因素之一是它提供的敏捷性。网络大多数常见的更改都变成了对现有数据模型的更新。当出现新功能需求（如对组播的需求）时，将开发新的模板以及新的数据模型变量。然后发布该功能并将其作为新任务整合到剧本（playbooks）的编排中。演变出一种非常可重复、模块化的流程，提供了更高效交付项目的敏捷性。


    ## 设计


    传统的网络设计通常围绕设备配置命令展开。虽然这些命令在实施阶段至关重要，但驱动网络设计的应该是数据。网络工程师的新职责包括编写人类可读的数据模型以及驱动动态模板的逻辑。现有或新的动态文档应随着模板的添加或更新反映新功能。通过先考虑数据，后考虑配置，网络设计随之演进。


    ## 部署


    网络自动化发现的最大优势通常位于网络管理的运营侧。大规模的更改通常很难推送到企业中。例如，在网络中引入 QoS 意味着触及网络所有层的所有设备，且每个平台通常有不同的代码。使用多层交换
    (MLS) 或模块化质量服务命令行 (MQC) 的设备会导致不同平台产生不同的需求和配置命令。运营部门从网络工程师处接收批准的、最终的网络设计以及部署步骤。这通常需要几周或几个月才能从开始到结束完成到校园的交付。网络自动化（即使操作人员手动运行
    Ansible 剧本的混合模型）解决了向网络部署配置相关的运营难题。使用 Ansible 剧本可以大幅减少部署时间，同时提高质量和准确性。


    ## 运营


    NetDevOps 将极大改变网络运营在组织中的角色。一个预制的自动化 Ansible 剧本库随着时间的推移而建立。每当批准的更改合并到仓库时，就会触发自动化构建和部署。运营部门通常负责网络的日常运行，合并并部署来自项目或网络工程师的更改。运营部门现在将学习开发和使用代码。如果可以将运营的部署、网络侦查和文档方面实现自动化，将允许运营团队专注于网络的日常方面，以及用于收集信息的自动化工具。尽管如此，网络可能仍然需要网络管理系统
    (NMS) 进行平台健康监控。网络可能存在不适合自动化的网络设备或控制器，或者存在值得注意的非 SSH 系统。


    ## 基于意图（Intent-Based）


    这种方法论的人类可读性允许实现真正的意图驱动网络模型。配置被抽象到模板中，因此重点可以放在数据模型上。每个设备或设备组的意图可以用可读的形式表示。幂等的 Ansible
    剧本结合检查模式（check mode）可以准确判断设备的运行配置是否匹配意图，以及 Ansible 剧本是否会添加代码。利用差异选项 (--diff)，操作人员可以看到两个配置之间的差异，还可以显示设备上存在但意图中缺失的命令。现在有基于设备的解决方案提供了一种
    GUI 驱动的意图系统。在 GUI 中拖放意图会被转换为配置并自动推送到设备。这些新的基于意图的设备是 Ansible 网络自动化的最大对手。要么购买并配置设备，希望它能实现所有宣传的功能，要么构建内部的
    Ansible 自动化框架。


    '
