    **Figure 5-21** Runtime pattern for Self-Service Decomposition pattern


    A strict interpretation of the Decomposition pattern could be implemented using
    integration services that are more tightly coupled to an overall application service
    framework and could be deployed on the same node as the application services.
    This approach could result in an infrastructure topology that is likely to be
    easier to implement and less complex. This simplicity could potentially give up
    some ground in the areas of the level of generalization of the integration services
    and in session concentration. WSBCC standardized Communication Services Reduces
    these concerns. A revised view of the Decomposition Runtime pattern is shown in
    Figure 5-22 on page 115. A notable feature of this revised topology is a single
    node labeled *Application & Integration Server*. This topology is very similar
    to the Self-Service Integrated Single Channel runtime pattern seen previously
    in this chapter.


    While WSBCC can support both interpretations of the Decomposition runtime pattern,
    the latter approach, where application services and integration services are deployed
    on the same physical server, is a commonly used approach to WSBCC deployment.
    When implementing this approach to the Runtime pattern, the server configuration
    would be similar to the revised view of the Decomposition Runtime pattern shown
    in Figure 5-22 on page 115.'
