    ## 2.6 分行银行的组件模型


    本节描述了分行银行系统主要元素的高级组件模型。它提供了定义必要基础设施所需的系统功能视图。它包含两个部分：组件图和组件定义。


    组件图部分显示了功能组件在系统中的相对位置以及组件之间的高级连接。


    组件定义部分包含每个组件的名称、该组件提供的服务描述以及关于该组件的任何已知实现细节。


    注意，系统的某些组件是基于分行基础设施地理限制的历史视图。在适当的情况下，探索了以非传统方式部署组件的选项。


    ### 2.6.1 组件图


