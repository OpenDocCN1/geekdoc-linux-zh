    # 选择模式和产品映射


    在确定了合适的业务模式后，下一步是定义构成解决方案的高层逻辑组件以及这些组件之间如何相互作用。这被称为应用模式（Application pattern）。一个业务模式将识别出多个应用模式，用于描述可能的逻辑组件及其相互作用。例如，一个应用模式可能包含描述与用户交互的表示层、Web
    应用程序层和后端应用程序层的逻辑组件。


    应用模式需要中间件的支持，中间件通过一个或多个运行时模式（Runtime pattern）表示。运行时模式定义了代表必须执行的中间件功能的功能节点。


    在确定运行时模式后，下一步是确定每个节点要使用的实际产品和平台。《Patterns for e-business》具有与运行时模式相关的产品映射，描述了已用于构建此类情况的电子商务解决方案的实际产品。


    最后，指南将帮助你通过经验识别出的最佳实践来创建应用程序。


    有关确定如何选择每种分层资产的更多信息，请参阅 Patterns for e-business 网站：


    http://www.ibm.com/developerWorks/patterns/


    # 4.3 总结


    本章提供了电子商务模式（Patterns for e-business）的概述。电子商务模式是一个查看问题空间和需求，并应用经过验证的业务、集成、应用和运行时模式来设计解决方案的过程。


    下一章将研究这些模式如何应用于分网银行环境。


    # 将 IBM 电子商务模式应用于分网银行


    上一章《IBM 电子商务模式概述》建立了了电子商务模式的整体背景。本章在这些背景信息的基础上，探索了以下内容：


    - 电子商务模式如何应用于分行和企业级银行业的转型

    - 如何使用 Linux 实现基于电子商务模式的解决方案


    Linux 和电子商务模式可以在两个语境下定义基于 Linux 的银行解决方案：


    - 在分行级：分行银行面临短期问题，电子商务模式提供了符合现有环境的替代方案，同时为银行的未来做准备。

    - 在企业级：电子商务模式为银行企业架构的转型提供了背景和路线图，并展示了 Linux 何何可以发挥关键作用。


    # 5.1 开始使用电子商务模式


    电子商务模式让我们描述想要解决的问题，以及用于解决这些问题的解决方案或多种解决方案。例如，业务模式让我们能够以简单但强大的术语来表征我们想要解决的问题类型。在我们描述了想要解决的问题范围和性质之后，电子商务模式将以应用模式和运行时模式的形式引导出替代解决方案。这些模式可以通过技术组件的已知组合（与运行时模式相关的产品映射）来实现。在每一步中，我们都需要决定哪种模式替代方案是最佳选择，为此，我们需要一些关键信息作为输入。


