    # Branch manager


    While in small branches, the branch manager acts both as manager and sales representative,
    in larger branches, we will find a dedicated branch manager and one or more sales
    representatives or branch account representatives.


    The branch manager directs all sales and service activities, including supervising
    all personnel, and also develops and maintains relationships with customers and
    implements policies at the branch level directed.


    # Functions


    The branch manager functions are as follows:


    +   - Effectively manages all product campaigns and daily sales activities.

    - Leads, coaches, develops, supports, and motivates all branch staff to achieve
    sales and service goals.

    - Ensures an environment of teamwork, sales, and goal attainment.

    - Directly directs operation; supervises all branch personnel; responsible for
    making sure personnel are trained in their respective areas and cross-trained
    in other areas.

    - Writes reviews annual performance; recommends salary increases; and recommends
    disciplinary action or termination as required.

    - Responsible for branch loan and deposit growth.

    - Answers verbal and written inquiries from customers, businesses, realtors, title
    companies, and builders regarding loan products, rates, and services.

    - Originates loan applications and prepares the required disclosures. Analyzes
    credit requests and submits for approval to management and loan committee.

    - Responds to customer inquiries on all bank products.

    - Conducts marketing activities for branch by promoting business development among
    real, builders, businesses, and customers.

    - Functions as branch security officer, implementing proper security training
    of employees and coordinating with police agencies.


    # Assistant sales manager or account representative


    In large branches, this role might be split into a true assistant manager and
    more branch account representatives.


    The assistant sales manager or account representative performs a multifaceted
    retail banking role. They manage day-to-day activities of the branch, with the
    primary responsibility focusing on operations being efficient and effective, and
    assist in the development of the branch staff through coaching sessions, and monitor'
