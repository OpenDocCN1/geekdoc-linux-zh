    另一方面，许多企业用户更倾向于将更改交给供应商自行处理，而要求他们必须与 Linux 开源社区共享代码。拥有 2000 多名员工的大型公司不安装 Linux
    最常被引用的理由是：其公司依赖的软件具有专有性，他们无法进行开源开发。


    ## 供应商责任制


    大型组织倾向于选择专有产品而非开源软件，因为他们依赖供应商的责任制；他们需要供应商能够提供从系统内核到系统配置的完整支持覆盖。自然地，他们对引入 Linux
    感到忧虑，因为主要的支持和责任来自开源社区。虽然这些公司可以寻求来自 Linux 发行版供应商，以及像 IBM 这样在其机器上运行 Linux 的市场型公司的支持，但他们认为，这些供应商围绕
    Linux 构建的商业模式仍未经测试，并可能无法承受这种负载。然而，其他人指出，无法保证构建其业务操作系统的公司就不会失败。可以保证的是，无论开源供应商的命运如何，用户都不必依赖任何公司来对其升级。他们可以作为开源社区的一员自己完成。


    ## 管理成本


    大多数 IT 部门都会认为，使用一个成本高于被管理系统的系统管理工具是没有意义的。这就是为什么许多 IT 经理正在转向开源工具来管理 Linux 服务器。这些工具（如
    NetSaint 和 Webmin）是免费提供的。经理们还利用他们的 UNIX 专业知识来编写自己的管理和监控脚本。


    然而，当 Linux 在网络上与其他操作系统平台共存时，将 Linux 服务器与其他企业资源分开管理，并使用不同的工具进行操作，实际上会增加 Linux 的总拥有成本。在这些情况下，用户应该寻求他们的管理解决方案（例如
    IBM Tivoli 软件）来提供必要的工具。


    ## 可靠性、可用性和可扩展性


    虽然 Linux 内核 2.4 将处理八路 Intel 系统，但 Linux 的多处理器处理能力远低于高端 UNIX 和 Windows 2000 服务器。因此，Linux
    并不总是是高端应用（如数据库安装）的最佳选择。然而，许多用户可能会发现，Linux 集群将以廉宜的成本满足他们的可用性需求。通过使用廉价的硬件，用户可以将工作负载分散到许多较小、更便宜的系统上。


    已经采用 Linux 集群的公司通常具有卓越的内部技能，对自己的应用程序拥有控制权，并且对于构建自己的集群所涉及的风险，比等待第三方应用程序开发更感到从容。对于没有此类技能的人，IBM
    提供了 Linux IBM @server Cluster 1350 系列预装的服务器集群。Linux IBM @server Cluster 1350 系列还包括捆绑应用程序和服务器级软件，以及集成测试和技术支持服务。这些集群最少需要四台基于
    Intel 的服务器，并可以扩展到一千多台服务器。服务器可以安装并预配置全套系统管理、维护和工作负载管理软件，以及服务器级软件，如 DB2 或 IBM WebSphere
    Application Server 以及电子商务软件。


    ## 应用程序的可用性


    Linux 提供了一个完整的 UNIX 编程环境，包括所有标准库、编程工具、编译器和调试器，这些都是用户从同类 UNIX 系统中预期的内容。然而，主要软件供应商将门户应用程序迁移到
    Linux 平台一直相对缓慢，特别是在数据库、中间件和 Windows 应用程序方面。随着 IBM、Oracle 和 SAP 等大型计算机公司对 Linux
    的投资，这种情况正在迅速发生变化。主要应用程序，如 IBM DB2、IBM WebSphere、Oracle 8 和 9 以及 SAP mySAP.com，已通过认证，可以在一个或多个
    Linux 平台上运行。


    ## 发行版之间的应用程序兼容性


    尽管越来越多的应用程序被迁移到 Linux，但无法保证它们会在所有 Linux 发行版上运行。这是因为每个发行版可能具有相同库的不同版本，使得开发者在将应用程序从一个
    Linux 平台迁移到另一个平台时，很难知道应该使用哪一个。为某个版本编译运行的程序可能无法在使用不同版本的发行版下运行。此外，需要某个版本库的应用程序可能会用新版本覆盖现有库，而该新版本可能与依赖旧版本的现有应用程序不兼容。基于
    Java 的应用程序提供可能的解决方案。


    ## 从当前环境迁移到 Linux 的成本


    在 Microsoft Windows 上投入了大量资金的机构必须在实施 Linux 的成本与许可成本的任何节省之间进行权衡。这些成本不仅包括技能和工具的成本，还包括获取这些工具的时间。虽然
    UNIX 用户可以使用已有的工具和技能来部署 Linux，但已经在 Windows 硬件和软件上投入大量资金，并培养了人员技能以支持其投资（例如 Visual
    Basic 开发或拥有 MCSE 认证的系统管理员）的用户，可能会发现转换成本难以合理。然而，Linux 已经在学院和大学中非常流行，大多数应届毕业生都有
    Linux 经验。


    ## 1.4 总结


    Linux 已经存在了近十年，在最近几年中，它获得了企业的关注和认可，成为许多应用程序稳健且可行的操作系统环境。


    本章提供了对 Linux 的高层次介绍，讨论了企业利用 Linux 的某些方式，并强调了一些与 Linux 相关的考虑。


    在下一章中，我们将讨论分行银行的现状以及导致分支银行转型的某些驱动因素。由于支持分支银行的 IT 基础设施可能会为了支持这种转型而发生巨大变化，Linux
    应该被考虑作为这些新环境的成本基础。


    ## 分行银行环境


    本章概述了分行银行环境的现状和结构。它讨论了分行银行目前面临的业务压力和挑战。我们从业务和技术角度讨论了处理这些问题的最新趋势。我们还从应用程序层面解决了软件策略，以多渠道解决方案的广泛背景解决分支银行问题。


    我们还涵盖了此类分支银行环境的组织结构，因为任何实施的解决方案必须满足操作和管理银行分支的人员的功能需求。


    ### 2.1 分行银行的现状


    “零售银行并没有灭死。相反，现在的分支机构更多，每家机构服务的户数也比以往任何时候都多，”正如 2001 年 8 月发布的 TowerGroup 文章《未来的零售银行分支》所述。在同一篇文章中，TowerGroup
    得出结论：“银行客户更倾向于使用实体分支而非许多自动化渠道，事实上，受调查的家庭中有 92% 在调查前的一个月内访问过分支。”


    “尽管大多数美国消费者在技术上已经为在线银行做好了准备，但在行为上，他们仍然缓慢于离开本地银行分支或呼叫中心等传统渠道，”TowerGroup 初级市场研究董事总经理
    Michael Weil 说道，“消费者并不是放弃现有的渠道，而是在使用他们熟悉的渠道的同时，向其中加入新的交付渠道。向在线银行以及最终向无线作为金融服务的交付渠道的移动仍在不断演变。”


