    \ / 事务 Y, Z |\n| 轻量客户端柜员 | 用户管理 | EJB Z / DB2 / DB2 数据库 |\n| 桌面端 | 分行服务器 | UNIX,\
    \ Linux, 或 zOS / zOS |\n\n图 7-1 步骤 3：创建新的基础设施\n\n记住这个面向分行的系统概述，我们需要画出整个蓝图，并允许所有其他渠道参与端到端架构。\n\
    \n让我们更多地关注支持所有业务需求和我们之前发现的所有模式的具体功能。更完整的基础设施所示如图 7-2。\n\n## 7.3 总结\n\n本章概述的场景从高层次描述了如何利用本红书之前介绍的信息来查看分行银行需求，并应用电子商务模式深入到运行时和产品映射级。在这个简单但具有代表性的案例中，我们展示了\
    \ Linux 如何以及应该被视为分行银行基础设施的一种可行且具有吸引力的替代方案。\n\n"
