    **图 5-10** 宿主机应用的自定义呈现模式（Customized Presentation to Host）


    这两种模式允许浏览器访问具有终端型用户界面的应用程序，从而将应用程序的范围扩展到新的位置和更轻级的客户端设备。在宿主机应用程序需要保持不变的情况下（因此图中加粗边框的是应用程序层节点），这些模式工作得良好。


    这两种模式代表了两种不同的解决方案。“原样宿主机模式”（As-Is Host pattern）为用户提供原始的用户界面设计，同时将终端仿真器功能从客户端移出。“面向宿主机的自定义呈现模式”（Customized
    Presentation to Host pattern）可用于提供重新设计的、更像 Web 风格的用户界面，使得简化或流化用户界面成为可能，并且能够在一系列终端型应用程序中提供更一致的用户界面。


    在原样宿主机模式中，一个不包含应用程序代码的基础设施节点在服务器上提供终端仿真功能，并通过浏览器呈现，消除了客户端需要安装或运行终端仿真器的需求。将终端仿真功能从客户端上移具有几点益处：


    - 宿主机应用程序可以从新设备访问，简化了客户端节点的要求。使用零足迹客户端的能力降低了客户端节点的成本并简化了其配置。


    - 宿主机应用程序可以在新位置使用，例如在可以通过浏览器访问企业网络、但可能没有带有宿主机通信网关组件的服务器的地方。


    托管终端仿真功能的服务器节点的放置，变得比基于粗客户端的终端仿真器所需的通信网关更容易做出决策。呈现层服务器可以位于分分机构、区域或中心位置。


    面向宿主机的自定义呈现模式为呈现层增加了智能，提供了重新格式化主机屏幕的能力。对于原样宿主机模式，这种模式适用于宿主机应用程序不打算（或无法）修改并将按原使用的情况。这种模式可以掩盖宿主机应用程序的复杂性，还可以为多个宿主机应用程序提供共同的外观和感受。使用这种模式的主要优势如下：


    - 原样宿主机模式的所有益处也适用于此模式。


    - 底层应用程序可以采用与其他 Web 应用程序一致的外观和感受。


    - 多个可能有完全不同用户界面设计的终端型应用程序可以提供一致的用户界面设计。


    - 改进的、更一致的用户界面减少了培训时间和成本。


    - 可用性的改进可以提高生产力并降低流失率。


    # 运行时模式


    这两种模式的拓扑结构类似于第93页的图 5-8。然而，我们不需要该拓扑中突出显示的所有连接技术组件，而是使用简化宿主机屏幕数据流转换的组件。基础技术组件如下：


    - 支持 Java 浏览器的客户端：这可以是一个运行在任何支持浏览器要求的操作系统上的轻量级桌面。


    - 运行以下内容的 Linux 服务器：WebSphere Application Server。


    - 原样宿主机模式的底层实现基于服务器托管的终端仿真产品：IBM WebSphere Host Publisher。（在编写本文时，IBM WebSphere
    Host Publisher 不支持 Linux。）


    面向宿主机的自定义呈现模式的底层实现使用某种形式的屏幕抓取机制将屏幕转换为更用户友好的界面。可以使用以下现成产品，可以显著减少实现此模式的工作量：


    - Client Access Family V5R1

    - Host Access Transformation Server (HATS); 通过具有 Web 风格外观和感受的浏览器访问 3270、5250


    表 5-3 汇总了此模式的关键特征和技术组件。


    表 5-3 模式总结：原样宿主机、面向宿主机的自定义呈现


    | 关键特征 | |

    |---|---|

    | | 通过浏览器提供终端型宿主机应用程序。原样宿主机模式将终端仿真从客户端移出，保持原始的用户界面设计不变。面向宿主机的自定义呈现也将仿真移出客户端，并且将原始的用户界面设计转换为新的用户友好型设计。
    |

    | 常用技术组件 | Linux 服务器。WebSphere Edge Server。IBM Developer Kit for Linux。Web Sphere
    Application Server AE。DB2 UDB EE。IBM HTTP Server。IBM Access Manager for e-business。IBM
    WebSphere Host Publisher（原样宿主机）（在编写本文时，IBM WebSphere Host Publisher 不支持 Linux）。Host
    Access Transformation Server (HATS)（面向宿主机的自定义呈现）。 |


    # 路由器模式


    在本节中，我们描述路由器应用程序模式和运行时模式。


    # 应用程序模式


    图 5-11 展示了路由器模式。


    ![](img/f3b72f8072d00d967972ff14766688f_113_0.png)


    图 5-11 路由器应用程序模式


    此应用程序模式代表了呈现侧的扇出，以支持多个通道（即使用星型配置，而不是让每个通道提供与业务应用程序的自己的点对点集成）。多个呈现节点代表不同的访问通道，例如浏览器、IVR
    或 ATM。


    路由器层在呈现侧支持多个通道，并将来自任何这些通道的请求路由到适当的企业级应用程序。路由器不会在应用程序侧进行扇出（像解构模式那样）。每个入站请求都会被路由到目标应用程序。


    路由器上的同步连接是逻辑上的，而非物理上的，实现可以使用非阻塞消息以及其他技术。无论如何，在呈现侧，交互对用户来说是同步的。路由器可以执行协议转换（例如 HTTP
    到 RMI）和会话集中。路由器还可以实施基于角的安全规则。


    路由器模式还使用了访问集成和应用程序集成模式。


    路由器模式的一个示例是通过互联网、自助终端、VRU、呼叫中心和柜员站访问客户信息。这种模式的局限性在于它一次只提供一个产品或账户（参见第101页的“解构模式”和第104页的“代理模式”以获取合并视图）。


    # 运行时模式


    另一种新兴模式是基于对象请求代理的使用。在这种情况下，集成服务器节点将配备 WebSphere Application Server 企业版以及连接器（如
    WebSphere MQ），以支持与后端应用程序的集成。


    ![](img/f3b72f8072d00d967972ff147667688f_114_0.png)


    # 路由器运行时模式


    表 5-4 汇总了此模式的关键特征和技术组件。


    表 5-4 模式总结：路由器


    | 关键特征 | 常用技术组件（基于消息代理） |

    |---|---|

    | - 通过多个通道提供应用程序服务。采用星型拓扑为任何通道提供后端应用程序服务，而通道无需后端应用程序的位置或消息格式。从通道到适当应用程序系统的智能请求路由。请求和响应的消息转换。会话集中：路由器维护一组精简的后端会话，而不是由每个通道维护自己的会话。强制执行基于通道和角色的安全策略。消除每个通道对后端应用程序系统建立专用点对点连接的需求。
    | - Linux 服务器。WebSphere Edge Server（可选）。IBM Developer Kit for Linux。WebSphere
    Application Server EE。DB2 UDB EE。IBM HTTP Server。IBM Access Manager for e-business。WebSphere
    MQ。WebSphere MQ Integrator。WebSphere classes for Java |


    '
