    available, or to take a deposit at a teller station even if the branch server
    is temporarily offline.


    The architecture of a bank''s IT systems will benefit from being flexible and
    adaptable in terms of how its application and technology components are deployed
    at a branch, regional, or enterprise level to match the characteristics of its
    organization and infrastructure capabilities.


    ## 5.3.1 Application and technology portfolio


    A wide range of applications are in use today, and we are likely to find a variety
    of application topologies and user interface styles:


    - Monolithic stand-alone applications that run on a client desktop (for example
    productivity applications, such as word processors and spreadsheets).

    - Applications with components that have been partitioned and distributed, operating
    at a branch level, in some cases integrating with enterprise applications. These
    are traditional two-tier client/server applications that have significant application
    components deployed on the client desktop which interact with other application
    components on a local server, or a database on a local server.

    - Traditional host-based applications accessed through a terminal style interface,
    either on a dedicated terminal device, or through a terminal emulator that is
    loaded onto a client desktop.


    Individual applications may also be difficult to integrate and share data with
    the following:


    - Individual applications may have been implemented to support a specific business
    process and may not be designed to operate. Wherever that characteristic exists,
    there is a lost opportunity to combine the underlying application services in
    a new way to meet competitive situations.

    - The information underlying these applications may be stored in separate, independent
    data stores. This can limit the bank''s ability to exploit valuable information
    across product lines, making it more difficult to manage a complex portfolio or
    to identify worthwhile cross-selling opportunities.


    Cases where applications or their data cannot be easily integrated or combined
    imposes limits on the speed with which a bank can implement new or enhanced services.
    This affects a bank''s competitive position.


    ## Branch clients


    Some of these application characteristics, combined with the need to support mobility,
    leads to the use of technology that lets a user’s desktop follow them to whichever
    client machine they are working at. This can involve loading that from the operating
    system up to the applications, based on a user’s role and preferences.


    The range of application topologies requires a robust client machine, which imposes
    limits on the ability to deliver IT services through a wider array of channels.
    This can become a significant inhibitor to extending IT services to customers
    over the Internet.


    ## Branch servers


    Branch servers have evolved capabilities to provide a personalized locked down
    desktop, as well as host-side application components and databases, host connectivity,
    and traditional file and print services. These features are aimed at the need
    to support a robust client desktop, as well as traditional two-tier client/server
    applications. Over time, some of these capabilities must be retained, as well
    the ability to provide a personalized, secured interface to application services,
    while others can be shed, as the capability of remotely loading an operating system
    and applications to a client desktop (as application architecture evolves to be
    client independent).


    ## 5.3.2 Transformation strategies


    Over time, a bank transformation strategy is aimed at increasing the range of
    integrated application services available to users, while also increasing the
    range of channels through which these services are delivered. To accomplish this,
    application architecture and the underlying technology infrastructure need to
    follow a strategy to evolve away from dependence on a client or server configuration
    and deployment topology and toward consistent adoption of flexible, open standards
    and alternatives.


    Bank transformation will often take place in stages, with each step delivering
    specific short-term benefits, while being aligned to support a longer-term strategy.
    The first steps are likely to be driven by urgent near-term pressures, they need
    to be viewed in the context of the overall transformation strategy. Patterns for
    e-business are particularly useful in accelerating the identification of both
    near-term and strategic solutions, which increases the likelihood that short-term,
    as well as long-term, objectives are met.


    ## 5.4 Pattern selection


    Reviewing the customer requirements will lead us to specific Business and Integration
    patterns. For a business as complex as we find in the banking industry, many patterns
    are likely to apply, resulting in a Composite pattern. Business and IT drivers
    will lead us to specific Application and Runtime patterns.


    ## 5.4.1 Selecting Business and Integration patterns


    Patterns for e-business Business patterns fall into four categories. Each of these
    covers generalized characteristics of common business process requirements. Let''s
    see bank transformation and business process requirements apply in this area:


    - **Self-Service**: The user-to-user interactions we have found, such as customers
    using an ATM, or a teller using a teller workstation, indicate that the solution
    follows the Self-Service business pattern. At the branch level, the ability of
    a bank employee to move from one location to another and have their personal set
    of capabilities follow is an important factor in maximizing efficiency. Over time,
    customers and bank employees will likely have an increasing number of automated
    business processes made available to them in a self-service mode, making Business
    processes of increasing importance.


    - **Collaboration**: User-to-user interactions can be found in business processes
    ranging from opening an account, loan orientation, customer inquiries, and large
    withdrawals. For example, a branch manager may need to authorize a withdrawal
    that is more than some specified amount. This indicates that the Collaboration
    business pattern applies. Because user-to-user collaboration can improve the efficiency
    of an organization, as well as increase the number of opportunities for the bank
    to interact with their customer base, it is likely the number of collaboration
    scenarios and the importance of this pattern will increase.


    - **Information Aggregation**: Business processes, such as portfolio management,
    cross-sell marketing, and business performance measurement, require the collection
    and analysis of information from multiple sources. This indicates that the Information
    Aggregation pattern will apply. As more information is aggregated, new opportunities
    to exploit this valuable resource are likely to be found, leading to the need
    for increasingly sophisticated approaches to information aggregation.


    - **Extended Enterprise:** Some processes cross enterprise boundaries. Collecting
    credit history during loan origination, transactions involving securities, and
    fund transfers are examples of business processes that can involve other business
    partners. This indicates that the Extended Enterprise business pattern applies.
    This is also an area that is likely to increase in importance as banks adopt more
    e-banking. For example, e-banking provides integrated management of customer-related
    data, which had traditionally been managed by a number of systems, in its customer
    information system. Therefore, related departments can share and analyze accurate
    data. Furthermore the analytic CRM system provides market and customer trend analysis
    to allow the bank to conduct more effective, proactive marketing activities.


    *Integration patterns fall into two categories: Access Integration and Application
    Integration.* Each of these basic patterns can be subdivided into more discrete
    collections of services or characteristics. Let''s see where our requirements
    lead us in this area.


    *The Access Integration pattern is subdivided into four areas of common services:*


    - **Device Support services**: When we considered the Self-Service business pattern,
    we discovered that it is essential for a bank to provide its services through
    multiple channels. This increases the number of touch points the bank has with
    its customers, as well as providing flexibility in delivering services to its
    employees in a variety of contexts. The Integration pattern Device Support services
    can be used to provide or extend a bank''s multichannel capabilities.


    - **Presentation services**: Providing a common look and feel is a key to achieving
    high employee productivity, as well as establishing a bank''s brand image with
    its customers. Both of these are important requirements that can be met through
    the Access Integration pattern Presentation services.


    - **Personalization services**: Bank employees often need the ability to move
    from location to location as they carry out their work. The Access Integration
    Personalization services address the need to have a user''s personal set of capabilities
    follow them from one desktop to another.


    - **Security and Administration**: Security is one of the most important requirements
    in a banking environment. The Access Integration Security and Administration services
    supports a need to define and administer role-based policies and to have those
    policies applied as a user moves from access point to access point.


    *The Application Integration pattern can be viewed in several dimensions. One
    of the key aspects is whether the integration is aimed at invoking application
    processes or accessing data. Another aspect pertains to whether the application-to-application
    interactions are synchronous or asynchronous. Still*

