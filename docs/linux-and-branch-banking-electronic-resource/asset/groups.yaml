    # Automatic teller machine: Systems


    When ATMs were introduced 30 or so years ago, banks viewed these devices as a
    low-cost alternative to routine banking services. Consumers viewed an ATM as a
    convenient alternative to teller branch banking, because it offered extended access
    to their accounts, available during extended hours.


    While initially these machines were simply automated cash machines, more advanced
    functions have been added over the years as these terminals have been used more
    widely and banks have recognized the lower costs of processing routine transactions
    through these terminals. These machines continue to evolve, incorporating not
    only additional customer-initiated banking transactions, but also other dispensing
    capabilities, such as stamps, phone cards, and tickets.


    A majority of banks and thrift organizations provide their customers access to
    their banking accounts through ATMs. These terminals are deployed in nearly all
    bank branches, as well as many non-bank locations, such as convenience stores,
    supermarkets, shopping centers, and tourist venues.


    Some variations from the traditional ATMs have appeared. Machines with single
    functions, such as cash dispensers, depository, check dispensers, and others,
    were developed to be used inside branches. For many banking organizations, this
    device is viewed as an alternative to the branch, for some other organizations,
    it is part of the branch channel.


    However, the self-service devices were positioned as a complementary channel to
    the branch at the service level by handling many routine transactions that would
    have been handled by the higher-cost teller. Banks are also deploying these terminals
    to generate fees, to extend services to other geographies, and to increase market
    presence.


    Although additional functions and transaction capabilities have been offered at
    the ATM, an evaluation of transaction volumes indicates that consumers still view
    these devices simply as cash machines. Approximately two-thirds of consumers use
    the ATM, and for a large majority of these consumers, ATMs represent an essential
    banking channel that offers convenient access to cash.


    # 2.4.2 Employees


    When looking at branch banking transformation and systems that can enable it,
    it is critical to understand the roles of employees within a branch. After all,
    the system is being put in place as a tool to make them more efficient and enable
    them to drive more business. In this section, we describe the typical roles within
    a branch as a basis for understanding solution requirements.'
