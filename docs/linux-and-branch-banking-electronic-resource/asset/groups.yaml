    # Performance and availability


    The following are performance and availability solutions for Linux.


    # IBM Tivoli Enterprise Console


    Provides a centralized point of control that keeps your IT staff in place and
    efficient control of, and provided corrective actions to, events happening across
    all systems and networks. It is available on IBM zSeries, xSeries, and other Intel-based
    servers.


    http://www.tivoli.com/products/index/enterprise-console/


    # IBM Tivoli Monitoring


    Provides monitoring for essential system resources to detect bottlenecks and potential
    problems and to automatically recover from critical situations. It is available
    on IBM zSeries, xSeries, and other Intel-based servers.


    http://www.tivoli.com/products/index/monitor/


    # Configuration and operations


    The following are configuration and operations solutions for Linux.


    # IBM Tivoli Workload Scheduler


    Automates, monitors, and controls the flow of work through your enterprise''s
    entire IT infrastructure on both local and remote systems. It is available on
    IBM zSeries, xSeries, and other Intel-based servers.


    http://www.tivoli.com/products/index/scheduler/


    # IBM Tivoli Workload Scheduler for Applications


    Manages enterprise scheduling from a single point and integrates with solutions
    such as mySAP.com. It is available on IBM xSeries and other Intel-based servers.


    http://www.tivoli.com/products/index/scheduler-apps/


    # IBM Tivoli Configuration Manager


    Delivers an integrated solution for deploying software and for tracking hardware
    and software configurations across an enterprise. It is available on IBM zSeries,
    xSeries, and other Intel-based servers.


    http://www.tivoli.com/products/index/config-mgr/'
