    \ - Deposit book order add\n\n## 5.4.6 WSBCC and Eontec\n\nIBM and business partner\
    \ Eontec have collaborated to combine WebSphere Business Components Composer (WSBCC)\
    \ with the Eontec financial components. In the resulting solution, WSBCC multichannel\
