    # 2.3.1 Branch software strategy overview


    This section introduces some of the basic principles and assumptions for a branch
    transformation strategy and why they are important.


    # Build it to support multichannel


    We believe that as banks begin to look at how they will transform their branch
    delivery channels, many of them will seek to do so in the context of a larger,
    multichannel delivery strategy, a strategy that enables them to integrate all
    of their delivery channels and deliver all of their products and services in a
    consistent manner, regardless of the channel the customer chooses to use.


    Why is this important? Statistics tell us customers are multiple channel users.
    Therefore, a bank must endeavor to optimize each and every interaction with the
    customer, regardless of the channel, both to the advantage of the customer and
    to the bank itself. Such treatment is key not only to improving customer service
    and satisfaction, but also to solidifying long-term and profitable relationships.


    By looking at their branches as part of an overall delivery strategy, banks will
    be able to tailor branch services to meet the needs of the customers who use the
    branch, as well as develop a channel strategy that matches service levels to customer
    value, and set the appropriate goals for branch transformation.


    With in mind, the software strategy for branch transformation is built on the
    overall software strategy for a multichannel delivery system, with specific emphasis
    on providing solutions to unique issues related to the branch location and the
    channels it supports. On the other hand, although they may be thinking strategically,
    cost pressures and other immediate demands will cause banks to act tactically.
    The software strategy (in fact, the entire infrastructure strategy) must accommodate
    this and offer a value proposition for those who choose a more tactical approach
    to branch transformation.'
