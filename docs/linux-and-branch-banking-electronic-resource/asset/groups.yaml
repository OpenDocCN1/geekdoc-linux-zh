    ## 1.1.1 标准


    Linux 是一个符合 Posix 标准的操作系统，其各个子系统支持所有相关的 ANSI、ISO、IETF 和 W3C 标准。从开发开始，Linux 就是根据
    Posix 标准进行开发的。该标准定义了 UNIX 类系统需要如何运行，并规定了系统调用和接口等细节。Posix 定义了一个所有 UNIX 版本都必须遵循的通用标准。大多数流行的
    UNIX 版本都符合 Posix 标准。Linux 的 Posix 性使得开发者能够将许多流行的 UNIX 和实用程序移植到 Linux。


    Linux 提供了 TCP/IP 网络的完整实现。支持全系列的 TCP/IP 客户端和服务端。Linux TCP/IP 系统提供了标准的 socket 编程接口，因此任何使用
    TCP/IP 的程序都可以移植到 Linux 上。


    Linux 还支持用于 CD-ROM 的标准 ISO-9660 文件系统。Linux 打印软件由 UNIX 标准的 `lp` 和 `ip` 软件组成。MS-DOS
    或其他操作系统支持的任何并行打印机，Linux 都可以支持。Linux 支持全系列的调制解调器，包括内部和外部。


    简而言之，在几乎所有操作环境中已成为标准的接口和功能在 Linux 中同样可用，并通过开源代码实现且基于行业标准。这种组合为开发、移植或运行关键业务应用程序提供了一个稳定且可预测的环境。


    ## 1.1.2 最低运行要求


    根据基于 Intel 平台的 Linux 规范，Linux 的最低 PC 配置要求是一台带有约 4 MB RAM 的 Intel 386 计算机。但为了运行图形界面，并有足够的速度和空间来运行大多数商业
    Linux 发行版，现在建议至少使用具有 64 MB RAM 的 486 机器（最好是 Pentium）以及带有 600 MB 硬盘的机器。Linux 至少需要两个磁盘分区：交换分区（swap）和系统分区。基础根文件系统使用
    50 MB 到 100 MB 的磁盘空间。交换空间应等于 RAM 内存，建议绝对最小为 16 MB。然而，Linux 系统分区的大小将根据 Linux 系统的用途以及文件系统到其他分区的扩展性和可移植性而异。


    虽然实际的硬件需求将取决于业务和应用需求，但可以说，Linux 环境的设计和效率允许公司使用相对通用且较廉价的硬件构建稳健的系统。


    总结来说，Linux 作为一种功能全、基于标准且硬件要求相对的操作系统，一直受到许多寻求廉价解决方案以满足其 IT 需求的企业的关注。


    当然，Linux 发行版也适用于其他硬件平台，包括从 xSeries 到 zSeries 的全系列 IBM 服务器。对于 Intel 以外平台的最低要求，请参阅相关的
    Linux 发行版文档。


    ## 1.2 IBM 与 Linux


    对于 IBM 而言，这切关乎客户选择和应用赋能。IBM 参与了 Linux 现象的所有阶段；为 Linux 开发本身贡献代码和技能；与现有的 Linux 发行版合作提供适用于
    Linux 的平台；将 IBM 行业领先的中间件移植到 Linux；提供开放访问的 Linux 开发者资源；帮助客户和业务伙伴实施 Linux 解决方案；通过
    IBM 多供应商软件支持合同提供支持。


    ## 1.2.1 作为服务器的 Linux


    每个 IBM 服务器平台都提供 Linux 作为一个选项，或者作为原生操作系统的替代方案，又或者作为共存应用程序环境。IBM 为工业领域的 Linux 应用部署提供了广泛的选择。然而，这并不意味着
    IBM 期望所有应用程序都是基于 Linux 的；事实上，新的产品（如 OS/390 的 64 位继任者 z/OS）证明了 IBM 将继续投资其他环境并赋能我们客户的关键应用程序。


    对于想要 Linux 的客户，基于 Intel 的 xSeries 提供了原生支持。xSeries 现在还针对服务器整合市场，因为可以将 x40 系统划分为最多四个硬件虚拟机和多
    64 个软件虚拟机。


    IBM pSeries 提供了增强的能力，允许使用原生模式或逻辑分区 (LPAR) 中的 Linux 运行环境执行 Linux 应用程序。希望实现 Linux
    能力的 IBM AS/400 客户也可以利用 iSeries 中对 LPAR 中 Linux 的支持。


    同时，用于 zSeries 的 Linux 将用于 S/390 的 Linux 能力扩展到了 64 位世界，并保留了在单个企业服务器内提供数千个“虚拟 Linux
    服务器”的大规模并行实现的独特能力。这种独特能力是 IBM Linux 客户参考案例中许多重大客户项目背后的推力。


    为了弥补这一能力，IBM 扩展了其已经非常广泛的中间件产品组合，包含了服务器上的 Linux。IBM WebSphere、Lotus Domino、DB2
    通用数据库和 Tiv 目前已提供 Linux 支持，作为其多平台策略的自然延伸，并将 Linux 视为未来发展的一的一级平台。


    ## 1.2.2 作为客户端的 Linux


    IBM 金融服务客户仍在使用大量基于 OS/2 的客户端，因此对 IBM 是否认为迁移到 Linux 在策略上是可行的产生了浓厚兴趣。对于通用、全功能型（“重型”）客户端环境，当今的市场评估仍然是“尚未到时候”，但各领域对成本控制的日益关注，正促使公司和政府在展望未来时对
    Linux 的兴趣增加。


    然而，对于特殊环境，例如开发桌面和瘦客户端（thin-client）解决方案，特别是在分支环境中，Linux 可能是并提供了一种极具成本效益的替代方案。在
    Linux 内部，有主流产品可用，例如 Netscape (Mozilla) 浏览器、OpenOffice 套件、Adobe Acrobat Reader
    等。


    IBM 最近还宣布了适用于 Linux 的 WebSphere Studio Application Developer。关于 Eclipse 的更多信息可以访问：http://www.eclipse.org/


    '
