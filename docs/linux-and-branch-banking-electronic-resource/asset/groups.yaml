    ![](img/f3b72f8072d00d967972ff147667688f_104_0.png)


    Figure 5-5 Stand-Alone Single Channel application pattern


    This pattern typifies the separation of presentation services from application
    services. In an e-business context, this is often implemented through very sparse
    use of presentation logic on the client.


    For situations where there is an urgent time-to-market pressure to deliver application
    services through new access channels, this application is one of the fastest way
    to implement new services. One of the key features of this pattern is that it
    is not dependant on integration with other systems, which eliminates that be one
    of the most challenging aspects of integrating new systems. This also means that
    the application services could be deployed to servers at a branch, region, or
    enterprise level, depending on the bank''s specific requirements.


    In a bank transformation context, this pattern could be used to move monolithic
    applications that currently can only run on a robust client desktop with a specific
    operating configuration to a thin client, server-oriented architecture. This would
    not only reduce the need for high-powered desktop hardware, it could also extend
    the reach of the application to any device with a standard Internet browser capability.
    This pattern could be implemented in several ways, depending on the type of application
    under consideration.


    For applications that are stand-alone applications, as desktop productivity applications
    (for example, a word processor), the application could be hosted on a central
    server using technology, such as Citrix Wireframe or Connectix VirtualServer.
    In this case, the application runs on a server instead of the desktop. The presentation
    of the application''s user interface is handled through a thin client component,
    which is much less dependant on its operating environment than the application
    itself, thus extending the reach of the application to a wider range of devices
    and users. This approach can also be used for client/server applications where
    there is a thick client component, and where there is no time or interest in migrating
    the application to a multitier e-business based architecture.


    For traditional two-tier applications, where there is an interest in migrating
    to a multitier, e-business based architecture, the Stand-Alone Single Channel
    application pattern provides one option. As long as the application does not require
    integration with other applications, this pattern can be used.


    Several benefits accrue from using this approach. First of all, the application
    can be re-architected using a Model View Controller (MVC) based application framework.
    By applying this separation of concerns to the application architecture, the application
    not only can be moved to an e-business environment, immediately making it available
    through additional device channels, but perhaps more importantly, the underlying
    application services can be made available through a more generalized interface,
    which positions the application for wider reuse and easier integration in the
    future.


    # Runtime pattern


    Figure 5-6 illustrates the Stand-Alone Single Channel runtime pattern.


    ![](img/f3b72f8072d00d967972ff147667688f_105_0.png)


    Figure 5-6 Stand-Alone Single Channel runtime pattern


    The client node presentation services can be implemented through Java script,
    Java applet, or only HTML. On the server side, a JSP can be used to encapsulate
    any other dynamic presentation-related logic. Application logic that interprets
    requests from the browser and delegates the request to a business model layer
    and business logic components are housed in separate components, such as servlets,
    Java classes, or JavaBeans (in other, more sophisticated patterns, Enterprise
    JavaBeans could be used, along with application integration techniques).


    The emerging Runtime pattern shown in Figure 5-6 on page 90 could be used as the
    basis for implementing this approach and demonstrates how this Application pattern
    could be implemented on a Linux server platform. This pattern is considered emerging
    because some of the products have only recently become available on the Linux
    platform and have not yet achieved wide use as they have on other platforms.


    Table 5-1 Pattern summary: Stand-Alone Single Channel


    | Key characteristics | |

    | :--- | :--- |

    | | > Single channel at a time<br> No integration with other applications |

    | Commonly used technology components | > Linux server<br> WebSphere Edge Server<br>
    IBM Developer Kit for Linux<br> WebSphere Application Server AE<br> DB2 UDB EE<br>
    IBM HTTP Server<br> IBM Access Manager for e-business |


    # Directly Integrated Single Channel pattern


    In this section, we describe the Directly Integrated Single Channel application
    and runtime patterns.


    # Application pattern


    Figure 5-7 on page 92 illustrates the Directly Integrated Single Channel application
    pattern.


    ![](img/f3b72f8072d00d967972ff14766788f_107_0.png)


    Figure 5-7 Directly Integrated Single Channel pattern


    This Application pattern extends the Stand-Alone Single Channel pattern to provide
    an approach for applications that can use a point-to-point connection with one
    or more back-end applications (or data, or both). As a Single Channel pattern,
    it could be used to implement any one of the delivery channels.


    The simplicity of this pattern is achieved by limiting the scope of the pattern
    to a single channel and to relatively simple integration techniques. While this
    makes the pattern easier to implement than some of the other patterns, the trade
    off is that it is also limiting, not being a multichannel solution (see "Router
    pattern" on page 98, "Decomposition pattern" on page 101, and "Agent pattern"
    on page 104), and usually does not interact with more than one enterprise application
    in any individual transaction (see "Decomposition pattern" on page 101 and "Agent
    pattern" on page 104). There may or not be a need for modification of the back-end
    legacy applications depending on their current capabilities (note that there is
    one back-end application node that represents an unmodified application, and another
    node that represents an application that would be modified to support integration).


    # Runtime pattern


    Figure 5-8 illustrates the Directly Integrated Single Channel runtime pattern.


    ![](img/f3b72f8072d00d967972ff147667688f_108_0.png)


    **Figure 5-8** Directly Integrated Single Channel runtime pattern


    This pattern adds connector components to enable integration between the e-business
    application and previously existing legacy applications. These connectors are
    point-to-point, meaning that request and response conversations between the e-business
    and legacy applications do not go through any intermediate dynamic routing or
    transformation nodes, resulting in a less complicated infrastructure architecture.
    Although a load balancing node is not explicitly shown in this pattern, one could
    easily be added (see Figure 5-6 on page 90).


    Table 5-2 summarizes this pattern''s key characteristics and technology components.


    | Table 5-2 - Pattern summary: Directly Integrated Single Channel |

    | :--- | :--- |

    | Key characteristics | Single channel, Point-to-point integration with individual
    applications |

    | Commonly used technology components | Linux server, WebSphere Edge Server, IBM
    Developer Kit for Linux, WebSphere Application Server AE, IBM HTTP Server, IBM
    Access Manager for e-business, DB2 Connect Enterprise Edition for Linux, eNetworks
    Communications Server, CICS Transaction Gateway, IMS Connector for Java (runtime
    classes) |

