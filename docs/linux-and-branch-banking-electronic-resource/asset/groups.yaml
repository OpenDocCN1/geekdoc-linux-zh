    It looks like we have a match! Of course, there are many considerations for choosing
    the operating platform that will be use, but support for the required infrastructure
    products and facilities is not an issue for Linux.


    Given its price, performance, stability, and support by organizations, such as
    IBM, Linux will play a key role in this environment.


    # 7.3 Summary


    The scenario outlined in this chapter describes, at a high-level, how one can
    use the information presented earlier in this redbook to look at the branch banking
    requirements and apply Patterns for e-business to drill down to the Runtime and
    product mapping levels. In this simple, but representative, case, we have shown
    how Linux can and should be considered as a viable and attractive alternative
    for branch banking infrastructures.'
