    ## 6.1.6 应用服务器


    在当今的电子商务世界，应用服务器发挥着至关重要的作用。Linux 为运行应用服务器提供了一个稳定且廉价的基础，特别是在像分行银行这样的大规模分布式环境中。


    ### Tomcat


    Tomcat 由 Jakarta 项目的成员开发，它是一个基于 Java Servlet 2.3 技术和 JavaServer Pages (JSP) 1.2
    实现的 servlet 容器。虽然还有其他类似的产品，但 Tomcat 是这这两项技术的官方参考实现，也是少数几个支持 JSP 1.2 的免费可用应用服务器之一。


    Tomcat 在一个开放且参与的环境中开发，并根据 Apache 软件许可发布。有关 Tomcat 的更多信息可以从以下地址找到：


    ```

    http://jakarta.apache.org/tomcat/

    ```


    ### IBM WebSphere Application Server


    WebSphere Application Server 是一种基于 Java 技术的 Web 服务器，它将数据和事务与电子商务世界集成。它提供了一个丰富的电子商务应用部署环境，包含全套应用程序服务器，具备事务管理、安全、集群、性能、可用性、连接性和可扩展性等功能。


    WebSphere Application Server 是核心 Web 服务和 JEE 应用程序服务器，具备行业领先的服务质量和一系列灵活的部署配置，能够满足单机、多服务器分布式以及高度动态分布式企业环境的需求。


    ## 6.1.7 消息服务器


    消息传递（Messaging）是指向消息服务器交换消息（特别是描述事件、请求和响应的特殊格式数据），该服务器充当客户端程序的交换调度程序。


    ### IBM WebSphere MQ


    有关 WebSphere MQ 的更多信息，请参阅第 121 页的“IBM WebSphere MQSeries”或访问 WebSphere MQ 网站：


    ```

    http://www-3.ibm.com/software/ts/mqseries

    ```


    ## 6.1.8 系统管理


    在像分行银行这样的地理分布式环境中，拥有相应的设施和工具来远程管理该环境的工作站和服务器是非常重要的。同样，Linux 也提供了多种或适用于 Linux 的各种管理设施和产品。


    ### Telnet, rsh 和 login


    Telnet 是你访问他人计算机的方法，前提是他们授予了你权限。从技术角度来说说，Telnet 是一种用于访问远程计算机的用户命令和底层 TCP/IP 协议。


    rsh 命令允许你共享处理器并在远程系统上执行命令。通过 rsh，可以请求在网络上任何你有权访问的计算机上运行命令。你可以让命令的输出打印在屏幕上、定向到本地文件，或定向到远程文件。


    login 命令允许授权用户登录到网络上的 Linux 机器（主机），并进行交互，就像用户物理位于主机计算机前一样。登录主机后，用户可以执行主机已授权的任何操作，例如读取、编辑或删除文件，以及停止或启动进程。


    ### 安全外壳 (SSH)


    SSH 是一种用于在系统之间远程创建安全连接的协议。通过 shell（Telnet、login 或 rsh）远程登录到另一个系统，或在主机之间复制文件（FTP
    或 rcp）的常用方法不会对客户端和服务器之间传输的数据进行加密，因此应避免使用。相反，你应该仅使用安全外壳或加密的虚拟专用网络连接到远程主机。使用安全方法远程登录到其他系统将降低你和远程系统的安全风险。


    ### NetSaint 网络监控器


    NetSaint 是一个监控网络上主机和服务的程序。当问题出现并解决时，它能够通过电子邮件或呼叫机通知你。NetSaint 用 C 语言编写，设计用于在 Linux
    下运行，尽管它在大多数其他 UNIX 变体中也可以运行。它可以作为普通进程或守护进程运行，间歇性对你指定的各种服务进行检查。实际的服务检查由外部插件执行，并向
    NetSaint 返回信息。


    ### Webmin


    Webmin 是一个基于 Web 的 Linux 系统管理界面。使用任何浏览器，你都可以设置账户、网络服务、文件共享和打印等。Webmin 由一个简单的 Web
    服务器和若干直接更新 Linux 系统文件的程序组成。


    ### IBM Tivoli 系统管理软件


    IBM Tivoli 软件提供了一套全面且互补的产品，可提供 IT 环境的端到端管理。企业可以使用 Tivoli 应用管理从大型机、中间层服务器到桌面电脑和
    PDA 的所有内容。


    Tivoli 解决方案管理从网络基础设施到中间件到应用程序的所有内容。它们将 Linux 既作为管理平台，也作为运行应用程序的平台。对于管理电子商务所需的许多关键软件组件（如
    DB2、WebSphere 和 Domino），它们拥有特定于产品的模块，并以一种独立于平台的方式进行管理。


    Tivoli 产品分为系统管理的四大类：


    - 性能与可用性

    - 配置与操作

    - 安全

    - 存储管理


    通过各种产品的集成，Tivoli 帮助你部署、操作、安全和管理包括 Linux 在内的所有主要平台的系统性能和可用性。


    ### IBM Desktop On-Call


    Desktop On-Call 是一种远程控制软件产品，它使用一个独特的概念：你不需要来 PC 上安装软件，因为你可以从另一台 PC 使用普通的 Web 浏览器通过
    Java applet 控制主机 PC。它让你能够从世界上任何位置的任何 PC 远程控制你的桌面 PC。


    Desktop On-Call 在银行和其他重要应用的许多情况下都非常有帮助。如果你桌面 PC 上的应用程序出现问题，可以从远程 PC 进行修复。当通过 Web
    浏览器访问主机 PC 时，Java applet 程序会被动态下载到浏览器中并绘制主机桌面的图像。然后 Java applet 程序开始与原生守护程序通信。这使你能够从远程位置控制主机
    PC。


    ### IBM Director


    IBM Director 是一种全面的工作组硬件管理器，设计用于 IBM xSeries 服务器、PC 和笔记本电脑。


    配合 IBM Director，xSeries 服务器上的高级管理处理器是硬件问题通知和解决的关键。它们为系统管理员提供了对系统的完整管理，不受服务器状态的影响。这些处理器在计算机内部模拟一台计算机，确保服务器对于你的关键业务应用程序保持可用。


    ## 6.2 总结


    我们描述了各种基于 Linux 的和设施，它们为分行银行环境提供了必要的基础。这些产品大部分都有良好的记录，并提供了你所需的稳定性和性能。能够在 Linux
    环境中运行所有这些功能（以及更多），有助于推动许多银行和其他公司将 Linux 作为一种低成本、低风险的选择。


    当你在根据第 5 章“将电子商务模式应用于分行银行”中描述的方法，使用电子商务模式开发自己的解决方案架构时，可以使用本章提供的信息开始识别所选运行时模式所需的le映射。


    ## 新型分行银行解决方案场景


    在 2.5 节“常见分行银行场景”中，我们描述了支持当前分行银行环境的一些常见 ITInfrastructure。在本章中，我们描述了一些与未来分行银行相关的场景。这些场景基于我们在第
    2 章“分行银行环境”中描述的电子商务模式的趋势，以及基于 Linux 的解决方案在这些环境中的适用性和可用性。


    '
