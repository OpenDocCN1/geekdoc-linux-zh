    # 3.5 Non-functional requirements


    The non-functional requirements of an IT system specify those aspects of the system
    that are not directly related to the application functionality. The primary non-functional
    requirements that need to be dealt with are service level requirements, such as
    capacity and performance (volumetric), availability, security, and system management.


    Other typical non-functional requirements include properties to ensure portability
    and maintainability and any system constraints. Typical system constraints include
    business constraints that the system must satisfy (for example, geographical location),
    existing technical standards, and technical "givens" that constrain the system
    architecture and design (for example, existing IT infrastructure).


    The non-functional requirements detailed in the following sections form the basis
    for the trade-offs and decisions made in the architecture and design of a representative
    banking branch infrastructure. They directly affect the choice and number of various
    components and the overall cost of the infrastructure.


    # 3.5.1 Cost of operation


    The costs, for both operations and technology, are one of the major drivers for
    decisions on all levels within a branch bank environment. While some of the following
    requirements have only implicit influence over overall costs, the total costs
    for the new solution need to meet business requirements. It is not unusual that
    the return on investment is required to be less than 12 months.


    A 1996 study by Gemini Consulting found that the cost to banks of financial transactions
    varies widely, depending on how they are accomplished. The study does not account
    for up-front costs, such as installing a PC banking system or building a bank
    branch office. 1


