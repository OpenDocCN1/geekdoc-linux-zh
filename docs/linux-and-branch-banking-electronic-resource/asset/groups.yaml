    ## 5.4.3 Application and Runtime patterns


    Under each of the Business and Integration patterns we have identified a group
    of Application patterns. The Application patterns describe generalized logical
    application topologies: the “shape” of applications that address a Business or
    Integration pattern’s requirements.


    Business and IT drivers are a key input to selecting Application patterns. As
    described in 2.2, "Branch technology challenges" on page 14, the key challenges
    to be addressed include:


    - *Speed to market: The adaptability of a bank''s solutions are key to being positioned
