    could take the form of rapid reconfiguration, or rapid deployment of new or enhanced
    applications.


    - *Total cost of ownership (TCO): Branch transformations must be affordable; a
    key consideration is to establish a plan for when specific components will be
    replaced; which components must be replaced in the initial step, which are more
    easily retained, addressing the expenditure rate.


    - *Quality of Service (expressed in terms of non-functional requirements: security,
    availability, reliability, performance, scalability, so these are really IT drivers).


    ## Self-Service application and runtime patterns


    There are seven Self-Service application patterns, some of which could provide
    immediate solutions, while others support longer term objectives:


    - Stand-Alone Single Channel

    - Directly Integrated Single Channel

    - As-Is Host

    - Customized Presentation to Host

    - Router

    - Decomposition

    - Agent


    The following sections discuss each of these Self-Service application patterns
    and identifies Runtime patterns that can be used to implement them


    ## Channel, limited integration patterns


    The Stand-Alone Single Channel application pattern is a single channel pattern
    that is useful when there is no immediate need to integrate the application with
    other systems, and where the time-to-market driver is especially significant.
    The Directly Integrated Single Channel application pattern is another channel
    pattern, but supports point-to-point integration with other systems. This pattern
    can be used to reduce the latency of business events and maximize the reuse of
    legacy systems. This pattern can also represent an evolutionary step for the Stand-Alone
    Single Channel pattern.


    The As-Is Host application pattern extends the reach of legacy applications that
    use a terminal-style user interface to new channels. This pattern allows users
    to access legacy applications through a thin client browser instead of a specialized
    terminal device or a heavier desktop terminal emulator. The Customized Presentation
    Host application pattern can be used to provide a new user interface for legacy
    applications. Multiple legacy applications can be given a new, more efficient,
    and consistent user interface, as well as making the applications available through
    a thin client browser.


    ## Multichannel, complex integration patterns


    To address multichannel and complex integration scenarios, we look to a second
    group of Self-Service application patterns. The Router application pattern is
    focused on addressing multichannel delivery of services. It accomplishes this
    by providing a standard set of application services that can be requested from
    one of many different channels, such as browser, Kiosk, IVR, or call center. A
    request from each channel is routed to the appropriate application system for
    processing. This approach eliminates the need for point-to-point integration for
    each individual channel.


    The Decomposition application pattern builds on the Router pattern by adding the
    capability of being able to break individual requests from a channel into multiple
    requests to enterprise applications, and then recombining the individual responses
    into a single response back to the originating channel. This enables a more sophisticated
    set of services that combine the capabilities of multiple applications.


    The Agent application pattern further extends the Router and Decomposition patterns
    by adding its own intelligence to the responses from multiple enterprise applications.
    It can transform a group of enterprise applications that are not capable of directly
    integrating with each other what could be considered a new federated application
    that is more than the sum of the individual application services.


    The Agent pattern can, for example, evaluate information returned from multiple
    enterprise applications and apply business rules to arrive at a cross selling
    recommendation that no individual application would be able to make.


