    # Branch servers


    When client/server technology made its evolution in the late 1980s, it became
    a core part of both branch systems. Various features and functions were transferred
    from both the mainframe to the branch to provide better performance and less WAN
    dependency, as well as from PC-based stand-alone applications to a central server
    to allow multiple users to access and share data.


    Also, features such as backup and recovery of data, mail gateways, communication
    hubs to remote machines or mainframe systems, or both, central printing, and many
    more are part of a two- or three-tier architecture. Copies of central databases
    are held for security and accessibility.


    More recently, due to faster processing, more reliable communications, and the
    cost of deploying and managing a fully distributed client/server environment the
    trend has shifted toward more centralization. For example, Web-based applications
    are hosted from a single, central server and clustered for availability. In some
    cases, only core facilities, such as local data and printer sharing, remain on
    branch servers.


    Table 2-2 Examples of server functions in branch banking


    | Server functions | Basic functions |

    | :--- | :--- |

    | File sharing | Backup and restore |

    | Printing | User authentication |

    | Communications | |

    | Database, local as server or remote as gateway | 3270 host connectivity |

    | Proxy server for Web applications | 5250 AS/400 or iSeries connectivity |

    | Systems management | |

    | User administration | Hardware and software inventory |

    | Central workstation administration | Security administration |


    Linux and Branch Banking


    # Automatic teller machine: Systems


    When ATMs were introduced 30 or so years ago, banks viewed these devices as a
    low-cost alternative to routine banking services. Consumers viewed an ATM as a
    convenient alternative to teller branch banking, because it offered extended access
    to their accounts, available during extended hours.


    While initially these machines were simply automated cash machines, more advanced
    functions have been added over the years as these terminals have been used more
    widely and banks have recognized the lower costs of processing routine transactions
    through these terminals. These machines continue to evolve, incorporating not
    only additional customer-initiated banking transactions, but also other dispensing
    capabilities, such as stamps, phone cards, and tickets.


    A majority of banks and thrift organizations provide their customers access to
    their banking accounts through ATMs. These terminals are deployed in nearly all
    bank branches, as well as many non-bank locations, such as convenience stores,
    supermarkets, shopping centers, and tourist venues.


    Some variations from the traditional ATMs have appeared. Machines with single
    functions, such as cash dispensers, depository, check dispensers, and others,
    were developed to be used inside branches. For many banking organizations, this
    device is viewed as an alternative to the branch, for some other organizations,
    it is part of the branch channel.


    However, the self-service devices were positioned as a complementary channel to
    the branch at the service level by handling many routine transactions that would
    have been handled by the higher-cost teller. Banks are also deploying these terminals
    to generate fees, to extend services to other geographies, and to increase market
    presence.


    Although additional functions and transaction capabilities have been offered at
    the ATM, an evaluation of transaction volumes indicates that consumers still view
    these devices simply as cash machines. Approximately two-thirds of consumers use
    the ATM, and for a large majority of these consumers, ATMs represent an essential
    banking channel that offers convenient access to cash.


    # 2.4.2 Employees


    When looking at branch banking transformation and systems that can enable it,
    it is critical to understand the roles of employees within a branch. After all,
    the system is being put in place as a tool to make them more efficient and enable
    them to drive more business. In this section, we describe the typical roles within
    a branch as a basis for understanding solution requirements.


    # Branch manager


    While in small branches, the branch manager acts both as manager and sales representative,
    in larger branches, we will find a dedicated branch manager and one or more sales
    representatives or branch account representatives.


    The branch manager directs all sales and service activities, including supervising
    all personnel, and also develops and maintains relationships with customers and
    implements policies at the branch level directed.


    # Functions


    The branch manager functions are as follows:


    - Effectively manages all product campaigns and daily sales activities.

    - Leads, coaches, develops, supports, and motivates all branch staff to achieve
    sales and service goals.

    - Ensures an environment of teamwork, sales, and goal attainment.

    - Directly directs operation; supervises all branch personnel; responsible for
    making sure personnel are trained in their respective areas and cross-trained
    in other areas.

    - Writes reviews annual performance; recommends salary increases; and recommends
    disciplinary action or termination as required.

    - Responsible for branch loan and deposit growth.

    - Answers verbal and written inquiries from customers, businesses, realtors, title
    companies, and builders regarding loan products, rates, and services.

    - Originates loan applications and prepares the required disclosures. Analyzes
    credit requests and submits for approval to management and loan committee.

    - Responds to customer inquiries on all bank products.

    - Conducts marketing activities for branch by promoting business development among
    real, builders, businesses, and customers.

    - Functions as branch security officer, implementing proper security training
    of employees and coordinating with police agencies.


    # Assistant sales manager or account representative


    In large branches, this role might be split into a true assistant manager and
    more branch account representatives.


    The assistant sales manager or account representative performs a multifaceted
    retail banking role. They manage day-to-day activities of the branch, with the
    primary responsibility focusing on operations being efficient and effective, and
    assist in the development of the branch staff through coaching sessions, and monitor
    both branch and individual progress according to goals established by the sales
    manager. The assistant sales manager or account representative identifies potential
    customers through counter transactions, in aisle sales, and incoming telephone
    inquiries, as well as prospecting target customers. The assistant sales manager
    or account representative selects appropriate products to fulfill customers needs
    and assists the bank in reaching its growth objectives.


    # Functions


    - Sells bank products and services.

    - Provides exceptional customer service to all customers.

    - Represents the institution in a courteous and professional manner.

    - Provides operational support for the branch, processing transactions, balancing,
    and training on new equipment.

    - Ensures proper controls are maintained over all aspects of branch operations.

    - Responsible for security and the maintenance of proper cash requirements for
    branch.

    - Reports all operational information, reconciling, and updating files.

    - Supervises and assists in the processing of all transactions.

    - Completes quality aisle time requirements and daily sales goals.

    - In the absence of the sales manager, responsible for ensuring all sales activities
    are completed.

    - Participates in employee performance appraisals, interviewing of new employees,
    and scheduling.

    - Solicits new business through promotions at the branch, in aisle sales, telephone,
    and mail. Identifies customer needs and sells appropriate products.

    - Serves as a mentor and role model for all staff. Assists the individual team
    members in attaining their individual goals.

    - Services existing customers with retail banking needs to include teller transactions.

    - Follows appropriate bank, regulatory, and legal requirements.

