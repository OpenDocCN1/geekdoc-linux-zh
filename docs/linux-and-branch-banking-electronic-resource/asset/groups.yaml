    x Linux and Branch Banking'
- md: "\n# Preface\n\nThis IBM Redbook addresses two topics that may, at first, seem\
    \ rather orthogonal. One of these topics is the world of banking, and specifically,\
    \ the transformation of branch banking. We spend a great deal of time in this\
    \ book describing the branch banking environment, the transformation that is currently\
    \ taking place related to branch banking, and various architectures and techniques\
    \ being used to define the branch bank of the future from an IBM perspective.\n\
    \nThe second topic is Linux. The phenomenal open source operating system, whose\
    \ use within e-businesses as a secure and robust platform has skyrocketed since\
    \ its inception.\n\nThis redbook discusses the applicability of Linux to the branch\
    \ banking environment and why it should be given strong consideration as the basis\
    \ for branch banking systems of the future.\n\nChapter 1, \"An introduction to\
    \ Linux\" introduces Linux and discusses its applicability as a server and as\
    \ a client.\n\nChapter 2, \"Branch banking environment\" begins our discussion\
    \ of branch banking, including how it has evolved and why there is such an emphasis\
    \ in the industry around its transformation.\n\nChapter 3, \"Branch banking requirements\"\
    \ describes the key requirements of a branch banking solution from both a business\
    \ and an IBM perspective.\n\nChapter 4, \"IBM Patterns for e-business overview\"\
    \ introduces IBM Patterns for e-business. These patterns have been successfully\
    \ used to document the problems and possible solutions for companies becoming\
    \ e-businesses.\n\nChapter 5, \"Applying IBM Patterns for e-business to branch\
    \ banking\" applies Patterns for e-business to the branch banking environment.\
    \ Though the solutions we describe are generic, this chapter can be used as a\
    \ guide for defining the solutions for your environment.\n\nChapter 6, \"Linux-based\
    \ products applicable to branch banking\" provides an overview of the facilities\
    \ available for Linux that can make it a viable solution for branch environments.\n\
    \nChapter 7, \"Scenario for a new branch banking solution\" provides a sample\
    \ scenario showing a branch banking solution of the future.\n\n# The team that\
    \ wrote this redbook\n\nThis redbook was produced by a team of specialists from\
    \ around the world working at the International Technical Support Organization,\
    \ Austin Center.\n\nBart Jacob is a Senior Technical Staff Member at IBM Corp\
    \ - International Technical Support Organization, Austin Center. He has 21 years\
    \ of experience providing technical support across a variety of IBM products and\
    \ technologies, including communications, object-oriented software development,\
    \ and systems management. He has 10 years of experience at the ITSO, where he\
    \ has been writing IBM redbooks and creating and teaching workshops around the\
    \ world on a variety of topics. He holds an MS degree in Numerical Analysis from\
    \ Syracuse University.\n\nDavid Janson is a certified Consulting IT Architect\
    \ with the IBM Architecture and Technology Center of Excellence. With over 20\
    \ years of experience in the industry, the last 7 of have been with IBM, Mr. Janson's\
    \ areas of expertise include Enterprise Architecture, e-business Solution Architecture,\
    \ Application Integration, and software development methods. His special interest\
    \ in techniques that accelerate the process of architecting and implementing IT\
    \ solutions has made IBM Patterns for e-business an area of particular focus.\
    \ Mr. Janson is also an experienced instructor and has had the pleasure of teaching\
    \ classes on a number of advanced topics related to software architecture and\
    \ design. He holds Bachelor of Science degree from Southern Illinois University.\n\
    \nOliver Mark is a certified Consulting IT Architect in IBM Global Services Germany.\
    \ He has over 12 years of experience in the client/server area, mainly in the\
    \ banking sector, with a clear focus on OS/2-end-to-end architectures. He is responsible\
    \ for all IBM Global Services offerings for OS/2 and its customers in the EMEA\
    \ Central Region. He holds a degree in economics and computer technologies. His\
    \ areas of expertise include OS/2, Warp Server, IBM Communication products, Windows,\
    \ and Linux, as well as Infrastructure and Systems Management architectures.\n\
    \nFabio Marras is an IBM I/T Architect in Solutions Financial Services Sector\
    \ in Brazil. He has 12 years of experience developing solutions for the finance\
    \ industry. He holds a degree in Electronic Engineering, and his areas of expertise\
    \ include networking hardware and software, as well as system integration across\
    \ multiple platforms.\n\nThanks to the following people for their contributions\
    \ to this project:\n\n- Jonathan Adams, IBM Software Group\n- Margie A. Bachman,\
    \ IBM Global Financial Services Sector\n- Larry Baldauf, IBM Software Group\n\
    - Arthur Cannon, IBM Global e-business Solution Center, Dallas\n- Jakob Carstensen,\
    \ IBM Software Group\n- Jose Carlos Duarte Goncalves, IBM e-Business Technical\
    \ Services\n- Laerte H. Fagundes, IBM Global Financial Services Sector\n- Rod\
    \ Fleming, IBM Global e-business Solution Center, Dallas\n- David D. Fritz, IBM\
    \ Software Group\n- Henry C. Hudson, IBM Financial Services Sector\n- Catherine\
    \ McAulay, IBM Global e-business Solution Center, Dallas\n- John Meade, IBM Software\
    \ Group\n- Thomas Pack, IBM Software Group\n- Michael Paolini, IBM Linux Integration\
    \ Group\n- Jason Salcido, IBM Global e-business Solution Center, Dallas\n- Timothy\
    \ F. Sipples, IBM Software Group\n- Lori Small, IBM Software Group\n- Lloyd Stearns,\
    \ IBM Software Group\n- Pablo E. Suarez, IBM Global Services\n- Barbara Trainor,\
    \ IBM Software Group\n\n# Become a published author\n\nJoin us for a two-to-week\
    \ residency program! Help write an IBM Redbook dealing with specific products\
    \ or solutions, while getting hands-on experience with leading-edge technologies.\
    \ You'll team with IBM technical professionals, Business Partners and/or customers.\n\
    \nYour efforts will help increase product acceptance and customer satisfaction.\
    \ As a bonus, you'll develop a network of contacts in IBM development labs, and\
    \ increase your productivity and marketability.\n\nFind out more about the residency\
    \ program, browse the residency index, and apply online at:\n\nibm.com/redbooks/residencies.html\n\
    \n# Comments welcome\n\nYour comments are important to us!\n\nWe want our Redbooks\
    \ to be as helpful as possible. Send us your comments about this or other Redbooks\
    \ in one of the following ways:\n\n- Use the online **Contact us** review redbook\
    \ form found at:\n  * ibm.com/redbooks\n- Send your comments in an Internet note\
    \ to:\n  * redbook@us.ibm.com\n- Mail your comments to:\n  * IBM Corporation,\
    \ International Technical Support Organization\n    Dept. JN9B Building 003 Internal\
    \ Zip 2834\n    11400 Burnet Road\n    Austin, Texas 78758-3493\n\n# An introduction\
    \ to Linux\n\nAlthough we do not start our detailed description of the branch\
    \ banking environment until Chapter 2, it is important to position Linux within\
    \ a finance industry context to begin this book.\n\nIBM expects Linux to become\
    \ a significant platform option for our financial services customers. This is\
    \ not just speculation. Banks, brokers, and insurance companies are using Linux\
    \ already, and we expect many others to follow, albeit in generic and niche areas\
    \ first, before tackling mission-critical transaction-oriented workloads.\n\n\
    With the recent stock market corrections and reductions in retail brokerage volumes\
    \ adding to market competition, the already intense focus on cost is likely to\
    \ be even higher, driving further investigation into efficiencies in e-business\
    \ infrastructure and more cost-effective ways of working. This view is supported\
    \ by the recent DataMonitor study on IT efficiency in the financial services sector,\
    \ which found control to be the number one or two driver of IT strategies in 42%\
    \ of our customers for 2002. We expect this to drive Linux investments, both at\
    \ an individual application level and in server consolidation scenarios.\n\nLet's\
    \ start our discussion with a brief overview of Linux.\n\n## 1.1 What is Linux\n\
    \nLinux is a UNIX-like, POSIX-compliant operating system distributed under the\
    \ GNU software license, meaning the operating system and its source code are available\
    \ for free. Initially developed in the early 1990s by Linus Torvalds along with\
    \ other programmers around the world, Linux supports all the major Window managers\
    \ and all the Internet utilities, as FTP, Telnet, and SLIP. It provides 32-bit\
    \ and 64-bit multitasking, virtual memory, shared libraries, and TCP/IP networking.\
    \ It also has a full set of program development utilities, including C++ compilers\
    \ and debuggers.\n\nLinux consists of four major components: the kernel, the shell,\
    \ the file structure, and the utilities.\n\nAlthough it has been implemented across\
    \ a variety of hardware platforms, it is most often deployed on Intel-based processors.\
    \ The Linux kernel is designed to use the special protected-mode features of Intel\
    \ 886 processors. Therefore, Linux makes use of the protected-mode, descriptor-based\
    \ memory management paradigm and many of the other advanced features of these\
    \ processors. Linux exploits the multitasking capability of 386mode. The kernel\
    \ supports demand-paged loaded executable so that only segments of a program that\
    \ are actually used are read into memory. Likewise, if multiple instances of a\
    \ program are running at once, only one of the program code will be in memory.\n\
    \nThe Linux kernel includes many improvements specifically designed for enterprise.\
    \ The kernel has built-in support for eight-symmetric multiprocessing, and the\
    \ TCP/IP stack has been rewritten to increase stack performance and provide better\
    \ scalability in multiprocessing systems.\n\nThe Linux kernel is a monolithic\
    \ kernel, in that all device drivers are part of the kernel proper. However, Linux\
    \ supports loadable device drivers that can be loaded and unloaded from memory\
    \ through user commands. The kernel is capable of enabling 387-FPU instructions\
    \ so that systems without a math coprocessor can run programs that require floating-point\
    \ math.\n\nLinux users interact with the Linux kernel through their own individual\
    \ shells. The shell provides an interface between the kernel and the user. If\
    \ the user prefers a GUI interface, XFree86, can be installed. XFree86 is a freely\
    \ available distribution of the Windows System, containing the X server, programming\
    \ libraries for developing X applications, and documentation. Window managers\
    \ are also available. The window manager provides the graphical interface that\
    \ lets users send commands to the Linux kernel by clicking windows, icons, and\
    \ menus, as much they would on a Microsoft Windows or Mac machine.\n"
