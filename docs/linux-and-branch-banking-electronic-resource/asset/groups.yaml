    - Improve employee productivity by delivering enterprise information and services
    online, including broadcast messages, announcements and alerts, HR services and
    information (intranet), e-mail, collaborative tools, static information (procedures
    manual, product information, forms, branch/ATM locator), bank directory (phone
    numbers, people, departments), and dynamic forms.


    These and other strategies are placing pressure on the bank IT providers to deliver
    IT solutions that not only deliver these capabilities, but also provide a flexible
    and scalable infrastructure that can quickly support whatever business initiatives
    the lines of business may undertake.


    ## 2.3.1 Branch software strategy overview


    This section introduces some of the basic principles and assumptions for a branch
    transformation strategy and why they are important.


    ## Build it to support multichannel


    We believe that as banks begin to look at how they will transform their branch
    delivery channels, many of them will seek to do so in the context of a larger,
    multichannel delivery strategy, a strategy that enables them to integrate all
    of their delivery channels and deliver all of their products and services in a
    consistent manner, regardless of the channel the customer chooses to use.


    Why is this important? Statistics tell us customers are multiple channel users.
    Therefore, a bank must endeavor to optimize each and every interaction with the
    customer, regardless of the channel, both to the advantage of the customer and
    to the bank itself. Such treatment is key not only to improving customer service
    and satisfaction, but also toifying long-term and profitable relationships.


    By looking at their branches as part of an overall delivery strategy, banks will
    be able to tailor branch services to meet the needs of the customers who use the
    branch, as well as develop a channel strategy that matches service levels to customer
    value, and set the appropriate goals for branch transformation.


    With in mind, the software strategy for branch transformation is built on the
    overall software strategy for a multichannel delivery system, with specific emphasis
    on providing solutions to unique issues related to the branch location and the
    channels it supports. On the other hand, although they may be thinking strategically,
    cost pressures and other immediate demands will cause banks to act tactically.
    The software strategy (in fact, the entire infrastructure strategy) must accommodate
    this and offer a value proposition for those who choose a more tactical approach
    to branch transformation.


    Figure-2 Built for multichannel


    We discuss multichannel considerations in more detail in 2.3.2, "Multichannel
    context" on page 21.


    ## Build it based on e-business technologies


    The nature of the banking business is that the universal tool for the execution
    of nearly all business processes, marketing, sales, production, and distribution
    of financial products and services, is the information system. No other industry
    is better suited for e-business than the finance industry.


    Most financial institutions first encountered e-business technology when they
    began to use the Internet to provide electronic home and office banking facilities.


    As the second phase of home banking began to take hold in the mid to late 1990s,
    it quickly became that a "flat client" home banking application would have a huge
    maintenance and support challenge to banks. Banks that had any experience at managing
    a large network of PC-based clients deployed throughout their branches were uncomfortable
    with the prospect of distributing software to millions of clients PCs of unknown
    origin and providing technical support to millions of customers with limited technical
    skill. Luckily, the World Web began to access commercial commerce, and Internet
    technologies became popularly available to home users, making it possible to deliver
    home banking services through a Web browser. Although this did not mitigate the
    support issues, it helped home banking a viable and cost-effective delivery channel.


    When we look at branch networks today, many of the same issues that drove banks
    to choose the Internet to deliver banking services to home users still exist in
    the branch network: it is a large, distributed network with users of limited technical
    skill. Internet technologies have come a long way and have achieved a level of
    maturity and robustness that make them not just the solution for self-service
    home banking, but also ideal as the technology infrastructure for the bank''s
    branch network and, therefore, for the entire multichannel delivery infrastructure.


    Moreover, leading banks recognize that a flexible, open, standards-based infrastructure
    will be essential to helping them retain their competitive edge in a marketplace
    that increasingly demands innovative business model deployment and rapid response
    to changing market dynamics.


    It is focused on the unique needs of the branch location. Banks have a history
    of managing large, distributed technology networks and are keenly aware of the
    costs associated with managing such a network and supporting a large community
    of relatively non-technical users. While they value flexibility and openness in
    their infrastructure, banks are also acutely focused on the need for a stable
    and operational environment underpinning their most visible and highly used channel.
    So, the challenge is twofold: providing a flexible infrastructure that will enable
    them to react quickly to, while delivering a stable, reliable, and manageable
    operational environment at a predictable cost of ownership.


    The adoption of e-business technologies, with server-based applications and thin
    clients (browser-based), helps to address some of the issues of software distribution,
    as well as simplifies the support required by internal help personnel. In addition,
    with increased bandwidth capabilities, it is now possible to central servers and
    still deliver satisfactory performance and reliability to the branches. Centralized
    servers communicating with thin clients can significantly reduce management burden
    that results in the high cost of delivering technology to the branch.


    On the other hand, we are aware that centralization of servers and totally thin
    clients may not be appropriate for all banks. Some banks will not be able to acquire
    reliable bandwidth in order to sustain the performance and availability they require.
    While desirable, thin clients may not be possible in the near term as a result
    of their dependence on existing client/server applications and productivity tools,
    such as the Microsoft Office, Lotus SmartSuite, and Lotus applications.


    Furthermore, the advent and popularization of Internet technologies has propelled
    security into a new dimension. Older, more proprietary technologies deployed in
    the branch were relatively immune to some of today''s security risks. But as they
    deploy open technologies, such as TCP/IP, and widely available, yet vulnerable,
    operating systems, such as Windows, banks are concerned about the heightened security
    threat.


    All of this is intended to create a stable and secure operational environment
    that is flexible enough to address the unique needs of each customer and, at the
    same time, deliver a manageable cost of ownership.


    ## It must support the needs of the builders and the buyers


    There are two different categories of clients, and the software strategy must
    address each one''s requirements:


    - *Builders*: Those who prefer to build their applications. Banks that prefer
    to build typically do so because they do not feel an independent software vendor
    (ISV) can satisfy their needs or because they consider branch delivery a core
    competence that they prefer to maintain in-house.

    - *Buyers*: Those who prefer to buy their applications from best-of-breed ISVs.


    Infrastructure, middleware, and tools to support the creation of a multichannel
    delivery system for banking or to support a specific channel implementation must
    be considered during the software strategy definition, and it must be based on
    "de facto" standards to avoid support and continuance problems.


    A compelling environment, that is comprehensive, integrated, and easy-to-use tooling,
    is of paramount importance to the builder group in order for them to develop these
    applications quickly and maintain a speed-to-market advantage. Another factor
    that influences the tooling requirements is that the depth of e-business technology
    skills in banks is quite variable: some banks have significant depth of skills,
    others have only basic capabilities, if any at all. The tooling capabilities,
    therefore, must cater to the needs of both ends of the spectrum: the power users
    and the novices.


    While tooling is a critical factor to the builders, what about buyers? We believe
    that tooling is important to them as well, although in an indirect way. In order
    for the buyers to fulfill their needs with software providers or ISVs, there must
    be applications to buy. This means that ISVs need tools in order to produce the
    banking applications that buyers want to buy. ISVs typically have a greater depth
    of skill in the platforms which they choose to implement, so power tools are probably
    more important, but the basic requirements are the same: comprehensive, integrated,
    and easy-to-use. One significant difference between ISVs and builders is that
    ISVs typically want to maintain a degree of vendor independence. Therefore, they
    will be inclined to prefer tools that are open and not tie them to a specific
    platform vendor.

