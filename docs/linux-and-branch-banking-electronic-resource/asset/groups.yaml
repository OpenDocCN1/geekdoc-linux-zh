    Figure 5-22 Revised view of the Runtime pattern


    As is common with many architectural decisions, there are some trade-offs to consider
    with these deployment alternatives. The physical hub and spoke integration services
    configuration in Figure 5-1 on page 76 is missing at a physical level but are
    preserved at a logical level. This is an important observation to consider. Regardless
    of the number of servers used to deploy WSBCC and Eontec, from the standpoint
    of the application/integration servers and existing applications, consistent integration
    techniques are used. One of the main differences between the two approaches will
    be in the number of connections that need to be established between the application/integration
    servers and existing applications. One of the important similarities in the two
    approaches is the use of a consistent set of integration techniques. In the case
    of a branch-level deployment, each branch''s application/integration server would
    establish its own connections to existing applications. In a centralized deployment
    scenario, the number of connections would be driven by capacity requirements and
    the degree of horizontal scaling employed.


    So far, the discussion of WSBCC and Eontec has focused on options for the deployment
    of application and integration services. WSBCC also provides flexible deployment
    of presentation-related components. Presentation components can be deployed at
    execution time in a thin client approach by Java applets, or can be deployed using
    a zero footprint client approach by keeping presentation components on the server
    side. This allows Eontec financial application services to be made available on
    client machines with a wide range of capacities and physical characteristics.


    The flexibility in deployment options across all tiers combined with built-in
    financial application services makes WSBCC and Eontec a valuable alternative to
    consider as part of a banking transformation strategy at the branch or enterprise
    level.


    ## 5.5 Summary


    This chapter has described in detail how Patterns for e-business can be applied
    to branch banking, resulting in various Runtime patterns and Product mappings.
    Most of the Product mapping examples use Linux where applicable.


    In the next chapter, we describe some specifics of how Linux applies to branch
    banking and the various roles for which it is well suited.


    ## Linux-based products applicable to branch banking


    Now that we have described the branch banking environment and Patterns for e-business
    in detail, you may have an architecture in mind that will suit your specific needs.
    Eventually, you will need to start creating the product mappings and making the
    choices for the operating environments across your infrastructure.


    In this chapter, we provide a summary of the various products and facilities available
    for Linux environments. This may help you evaluate which systems within your environment
    can be, and maybe should be, running Linux.


    ## 6.1 Linux in branch banking environments


    In Chapter 3, "Branch banking requirements" on page 45, we discussed what kind
    of components and services are required for a branch banking solution. In this
    section, we discuss how Linux can address these minimum requirements.


    There are many products and solutions currently available for Linux, and this
    number is growing daily. In the following sections, we describe a small subset
    of these solutions. Those that we do discuss are often used (and required) within
    an IT infrastructure built to support branch banking. Many of these facilities
    are provided natively with Linux distributions, while others are add-on packages
    that are available for Linux environments.


    ### 6.1.1 Network services


    Let''s start by discussing some of the network services that are. Most of these
    services have been provided by Linux since its inception and are proven stable.


    #### File Transfer Protocol (FTP)


    FTP is the simplest way to exchange files between computers on TCP/IP networks.
    FTP is an application protocol commonly used to download programs and other files
    to desktops or servers from other servers.


    #### Network File System (NFS)


    NFS is a client/server application used to share files between machines on a network
    as if the files were located on the client''s local hard drive. Linux can be both
    an NFS server and an NFS client, which means that it can export files to other
    systems and mount file systems exported from other machines.


    #### Network Information System (NIS)


    NIS is a naming and administration system for networks. Using NIS, each host client
    server in the system has knowledge about the entire system. A user at any host
    can get access to files or applications on any host in the network with a single
    user identification and password. NIS is similar to the Domain Name System (DNS),
    but somewhat simpler and designed for a small network and intended for use on
    local area networks.


    NIS uses the client/server model and the Remote Procedure Call (RPC) interface
    for communication between hosts. NIS consists of a server, a library of client
    programs, and some administrative tools. It is often used with the Network File
    System.


    #### Domain Name System (DNS)


    DNS is the way that Internet domain names are located and translated into Internet
    protocol addresses. A domain name is a meaningful and easy-to-remember "handle"
    for an Internet address.


    Because maintaining a central list of host names and their IP addresses would
    be impractical, the list of domain names and IP addresses are distributed throughout
    the network in a hierarchy of authority. There is probably a DNS server within
    close proximity to your access point that maps the domain names in your network
    and that handles requests or forwards to other servers as needed.


    #### Firewall


    A firewall is a set of related programs, located at a network gateway server,
    that protects the resources of a private network from other users.


    Basically, a firewall, working closely with a router program, examines each network
    packet to determine whether to forward it to its destination. A firewall also
    includes, or works with, a proxy server that makes network requests on behalf
    of workstation users.


    #### Hypertext Transfer Protocol (HTTP)


    #### Hypertext Protocol Secure (HTTPS)


    HTTPS is secure encryption.


    #### Apache HTTP Server


    The Apache HTTP Server Project is an effort to develop and maintain open source
    server for modern operating systems, including UNIX and Windows. The goal of this
    project is to provide a secure, efficient, and extensible server. Apache has been
    the most popular server on the Internet since April of 1996. For more information
    about Apache, see:


    ```http://httpd.apache.org/

    ```


    #### IBM HTTP Server


    IBM HTTP Server powered by Apache is based on the Apache HTTP Server. IBM has
    enhanced the Apache HTTP Server, for example, adding SSL for secure transactions
    and offering full support, when part of the WebSphere bundle.


    #### IBM Communications Server for Linux


    IBM Communications Server for Linux provides a multiprotocol gateway and provides
    workstation services. It enables personal computers to communicate with System/390
    and AS/400 hosts and other personal computers. The Enterprise Extender allows
    SNA operations to operate across a TCP/IP network.


    For client/server and distributed applications, IBM Communications Server includes
    support for peer-to-peer networking (APPN) network node and end node. IBM Communications
    Server also provides a rich set of application programming interfaces.


    #### IBM WebSphere Host On-Demand


    WebSphere Host On-Demand gives users a simple way to reach critical host data,
    without requiring any software to be installed on the client. WebSphere Host On-Demand
    uses Java technology to help open the doors to your host data directly from your
    browser. This-to-host connectivity solution helps provide secure Web-browser access
    to host applications, so you can take existing host applications to the Web without
    programming. With support for TN3270E-TN5250, VT220, VT100, VT320, VT420, and
    CICS Transaction Gateway access, users can have a single interface to their key
    host data. Because it is Java technology-based, its interface has the same look
    and feel across various types of operating environments. It also provides a default
    GUI to help the experience for users unfamiliar with traditional green screens.


    #### IBM WebSphere Access Transformation Server


    WebSphere Access Transformation Server (HATS) gives you all the tools you need
    to quickly and easily extend your legacy applications to your customers and employees.
    HATS makes your 3270 and 5250 applications available through the most popular
    Web browsers, while converting your host screens to a Web-like look and feel.
    HATS enables you to extend your host application to the Web within a single day
    of installing the software without any changes to your host. HATS is a zero footprint
    Web-to-host solution; the only software needed on the client is a Web browser.

