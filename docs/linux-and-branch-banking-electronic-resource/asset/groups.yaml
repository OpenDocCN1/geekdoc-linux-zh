    # Branch administrator


    The branch administrator is responsible for any kind of technical and operational
    tasks within the branch network, systems, or machines, such as servers, clients,
    and ATMs.


    # Functions


    The branch administrator functions are as follows:


    +   - Provides prompt, efficient, and friendly service to customers at all times.


    +   - Provides technical support for the branch and training on new equipment.


    +   - Responsible for hardware and software installation, maintenance, and service.


    +   - Responsible for technical security and the maintenance of IT systems.


    +   - Responsible for uninterrupted availability of all hardware, software, and
    infrastructure.


    # 2.5 Common branch banking scenarios


    This section describes a set of scenarios currently found in various customer
    environments. It gives and overview of how the business objectives are implemented
    within a technical architecture of systems, network, and application logic.


    Each scenario is described as an overall architecture, including some technical
    details, such as products and functions used to accomplish business-critical workflow.


    # 2.5.1 Host-centric scenario


    This scenario is a straight forward terminal (mainly 3270 emulation) environment
    with all business logic and data on a central mainframe. Servers, if they exist
    in a branch, are only used for gateway functions or basic file and print functionality.


    Employees in the branches use 3270 terminals or thin clients for all applications,
    including mail. The protocol used for this environment is often Systems Network
    Architecture (SNA).


    Transactions are always processed in a core banking solution that runs on the
    mainframe. There is usually one physical unit (PU) defined per branch with shared
    logical units (LUs) provided by a communications server or 4700 gateway.'
