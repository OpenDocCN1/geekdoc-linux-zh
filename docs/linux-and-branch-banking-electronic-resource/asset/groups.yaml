    **Figure 5-2** Business and Integration pattern relationships


    After we have described the problems we want to solve, establishing Business and
    Integration patterns apply (as well as some possible Composite patterns or Custom
    designs), we can move on to the patterns that describe solutions: the Application
    and Runtime patterns. The business and IT drivers that were collected during our
    analysis of customer requirements (as described in Chapter 3, "Branch banking
    requirements" on page 45) will be a key input into next decision making process.


    ### 5.2 Business context


    A wide variety of types of users appear as we study banking scenarios. Some examples
    are as follows:


    - Customer

    - Branch manager

    - Loan officer

    - Teller

    - Vault supervisor

    - Administrative assistant


    We can see that both internal and external users make direct use of a bank''s
    automated business services. For external users (typically a Business-to-Customer,
    B2C, scenario), this could take the form of a customer using an ATM, using a bank''s
    Internet site, or placing a call to a customer service representative or voice
    response unit (VRU) to inquire about their account status. In the future, a bank
    might want to make these services available through a mobile hand held device.
    For internal users (a Business-to-Employee, B2E scenario), this could take the
    form of a teller using a terminal or workstation during face-to-face transactions
    with a customer, or a loan officer entering a loan application using their desktop
    workstation.


    These interactions tell us that there are a number of self-service scenarios where
    a user can directly access automated IT services. We can also see that it is highly
    desirable for these IT services to be made available through multiple channels
    or modes of delivery:


    - Desktop workstations

    - ATMs or kiosks

    - Home PC browser

    - IVR unit

    - Call center


    Of special interest to banks is the need to support the mobility of users, while
    providing a personalized and secure set of IT services. For example, some branch
    employees need to be able to perform their work from any number of workstation
    locations. At whichever they find themselves, they need a specific, tailored set
    of applications presented through a consistent user interface.


    This is accomplished today through the use of technology that logs a user in and
    loads user-specific desktop onto their workstation. This approach supports the
    use of a range of application architectures, stand-alone and thick application
    styles, multi-tier distributed thin client topologies. As older applications are
    replaced by a predominance of server-client architectures, the need to provide
    a heavy-weight client machine will decrease, and with along, it the need to deploy
    applications to the client desktop. That trend will make increasingly easier to
    provide application services at a wider range of locations and through a wider
    range of devices.


    In addition to the self-service types of interactions we have described, there
    are also many examples of collaboration-style interactions within a branch banking
    environment. For example, a large or unusual withdrawal may require approval from
    the branch manager. Similarly, opening a new account may require more collaboration
    between the account representative and credit checking personnel.


    To summarize, one of the generalizations we can make is that we have users that
    are both internal and external to the organization. We also see that users interact
    with automated IT services through a number of channels (desktops, ATMs, IVRs,
    call centers). We also see that users interact with each other in face-to-face
    situations, and also through IT services that support both immediate and deferred
    collaboration.


    ### 5.3 IT context


    Financial institutions span a broad range of sizes in terms of both their customer
    base and geographic distribution. This leads to a range of enterprise infrastructure
    topologies, some of which are more centralized, while others are more distributed
    at a regional and branch level. One repeating theme is that the bank branch continues
    to play a key role. The importance of the customer facing business processes carried
    out at bank branches means that the underlying IT services need to be as available
    as possible so that key business transactions can take place when the customer
    is there at the branch.


    Here are some key IT requirements and drivers:


    - IT services that need to be available through multiple delivery channels

    - Flexible support for mobile or roaming users

    - Access security controls

    - Personalized presentation of IT services

    - Need to accommodate varying infrastructure capabilities

    - Need to maximize the availability of services, in some cases providing a period
    of reduced services as an alternative to a period of no services

    - Emphasize application and technology strategies that minimize the total cost
    of ownership

    - Emphasize application and technology strategies that reduce application complexity
    and maximize the inter-operability and reuses of application services

    - Emphasize application and technology strategies that provide flexibility in
    deploying IT services across a range of distributed or centralized topologies


    The distributed nature of branch banking adds special challenges and influences
    the architectural decisions made for key banking applications. One important aspect
    of this is the need to provide several levels of autonomy that if one component
    of the system is not available, other components can continue to operate and deliver
    at least some level of function. One example of this is the need to allow an ATM
    to dispense cash up to a pre-set limit (but not perform a balance inquiry) even
    if the enterprise systems it integrates with not available

