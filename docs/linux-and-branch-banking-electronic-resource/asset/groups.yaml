    +   **Offer choices:** Allow customers the flexibility to choose their hardware,
    operating systems, networking systems, databases, communication protocols, and
    third-party software products. The system must also support flexible distribution
    of function and data based on the network environment and physical topology.


    +   **Evolve gracefully:** The system must be flexible and resilient to both business
    and technological changes. This helps to support rapid application development
    and to increase competitiveness by improving time.


    +   **Provide manageability:** Once deployed and in production, the system must
    be easy to manage and resilient to changes in the run-time environment. It must
    also support remote management. Servers and clients must be able to be managed
    by a remote site, to solve technical or business issues that happen during operation.


    +   **Allow incremental investment:** The system must support the ability to incrementally
    develop and deploy new business function and technology. In addition, it must
    support the ability to include new solutions as they become available.'
  - '[PAGE 62]


    +   Maximize usability: The system as a whole must be well suited to the needs
    of its users: not only end users, but also developers and systems management personnel.


    +   Maximize reusability: The system must be constructed in such a way as to maximize
    reuse of components in all retail delivery solutions. In addition, it must be
    able to meet the diverse needs of solutions and access channels in financial institutions
    around the world.


    #  3.1.2 Implementation-related objectives


    The solution architecture must be open, scalable, and easy to implement. These
    principles are related to the architecture objectives and are the basis for the
    platform selections, programming model specifications, and overall functional
    requirements of the solution. These objectives are as follows:


    +   Open


    +   Supports industry standards: An architecture is open when it uses open industry
    and e-business standards, such as TCP/IP, HTTP, HTTP, Java, JDBC, and JavaServer
    Pages (JSPs), wherever possible. These standards provide a solid foundation and
    make it easier to use available proven components instead of building custom ones
    and to change vendors and implementations to satisfy changing business requirements.
    Industry standards need to be strategic and have longer life spans because of
    the high levels of investment and commitment involved with creating them.


    +   Extendable and customizable: An architecture must be built to extendable and
    customizable at many different layers or channels. This means it can be used in
    a wide range of situations and can accommodate specialized requirements that are
    specific to an individual channel, customer, country, or region.


    +   Provide insulation: The solution architecture must isolate and abstract interactions
    with other systems to isolate architecture-based applications from the specifics
    of other systems. In a global solution, it is essential to provide the flexibility
    to adapt to many diverse environments, particularly different host systems and
    databases.


    +   Preserve investment: The principles listed above ensure the preservation of
    customer investments. The solution architecture safely preserves the investments
    in current hardware, software, operating systems, network, communication infrastructure
    and protocols, and back-end subsystems of the customer environment.'
  - '[PAGE 63]


    # Scalable


    +   - Logical tiers: The benefits of a logical tiers architecture, such as the
    Network Computing Framework Component Guide, SG24-2119), are well known. The Network
    Computing Architecture is logical in that it specifies that the presentation layer
    must be decoupled from the business logic, which must be decoupled from the data
    access layer, but it does not specify how to physically deploy the tiers. Although
    this approach is a form of isolation, it also provides scalability by allowing
    of these layers of the system to change independently of the others. That is,
    the platform selections and design of each layer can change without impacting
    the rest of the system. This architecture also requires that the presentation
    layer be thin to realize the goals of network computing. This means that workstations
    with a small amount of physical memory and no virtual memory can download and
    execute the application.


    The main objective of the solution architecture is to support the model of a multiple-tier
    network computing application while also allowing engagement teams to implement
    solutions based on other application models, such as a two-tier client application.


    +   - Replaceable components: Components are packages of system function with
    established interfaces and a predetermined execution environment. As long as a
    component is within its required execution environment, and it interacts with
    other system components through its public interfaces, it is replaceable with
    minimal effort. This construction enables high levels of reuse and allows the
    system to evolve without causing large ripple effects. It also allows the implementation
    of components and their execution environments to vary to meet performance or
    scalability requirements.


    +   - Enterprise topology independence: This notion extends the idea of a logical
    tiers architecture so that not only are the tiers independent of physical location,
    but system components are independent of any specific physical topology. This
    makes the solutions highly flexible for deployment in different environments by
    allowing customers to configure the system as needed to achieve the scalability
    desired for their environment.


    +   - Easy to implement


    +   - Visual programming: Where possible, framework-based solutions use visual
    programming to assemble the application from parts. This technique is particularly
    effective in developing application screens and rapid assembly of graphical user
    interfaces.'
  - '[PAGE 64]


    +   - Separate analysis from design: Analysis should be a separate process from
    design and have its own distinct work products. Solutions of this product should
    use analysis to form an entirely logical representation of system function that
    is independent of technology or implementation. This helps to retain the value
    of earlier development effort even if the implementation must change entirely.


    +   - Development methodology: A methodology for guiding the development process
    in an engagement project to make solution implementation easier and the deployment
    faster must be provided.


    +   - Transaction-oriented: Most branch products require a solution in which an
    enterprise-centric, back-end system executes most of the application logic, and
    the front end of the solution, running in a delivery channel, must behave as a
    transaction proceeding to run the transactions in the back-end system. A well-defined
    architecture must address this type of requirement, especially in a high-volume
    transaction processing environment.


    +   - Development effort: An easy way to implement new transactions or applications
    is based on the parameter''s externalization, so business behave differently depending
    on their specific set of external parameters. This enables solutions to deliver
    new functions and capabilities without requiring new coding, simply by adding
    new external parameters to the system.


    # 3.1.3 Programming-related objectives


    Development of new business applications or re-engineering existing applications
    often focuses on the Java programming language and on mature Internet technologies
    creating reusable components within an overall framework for your application.
    This ensures that component-based applications can be deployed with confidence
    as integral parts of robust production systems, while a framework provides consistency
    and completeness over your components.


    Application development needs to be based on a shared central repository that
    supports component reuse and extensive parameterization of object definitions.
    Its design handles technical issues from solution designers, which allows them
    to focus on business function rather than on the underlying technical details.


    These features create benefits in the areas of project completion time, intermediate-
    and long-term cost-effectiveness, and readiness for future changes, improvements,
    and evolution.


    For example, IBM WebSphere Business Component Composer provides these features.'
