    ## IBM WebSphere MQSeries


    WebSphere MQ enables application integration by helping business applications
    to exchange information across different platforms by sending and receiving data
    as messages. They take care of network interfaces, assuring once only delivery
    of messages, deal with communications protocols, dynamically distribute workload
    across available resources, handle recovery after system problems, and help make
    programs portable.


    The MQ Adapter allows data to be passed between MQ messages and applications.
    Data can then be sent to, or received from, any supported platform. MQ provides
    a single, multipatform application-programming interface. A key factor is time-independent
    processing. This means that messages are stored reliably for later delivery, even
    if one of the recipients is temporarily unavailable.


    ## IBM WebSphere Edge Server


    WebSphere Edge Server distributes application processing to the edge of the network
    under centralized administrative and application control. It includes:


    - Application off load: Shifts the burden of serving composed

    - Content distribution: Deploys Web content to caches and rehosting servers throughout
    the network.

    - Caching: Improves response time by offloading back-end servers and peers as
    a forward, reverse, or transparent proxy. Caches and invalidates dynamic content
    generated by WebSphere Application Server, including JavaServer Pages (JSPs) components
    and servlets.

    - Load balancing: Through features such as Network Address Translation (NAT),
    Network Address Port Translation (NAPT), Proxy and Kernel-level Content Based
    Routing (CBR), and others. It can improve server selection, load optimization,
    and fault tolerance.

    - Security: Can be centralized using Tivoli Access Manager. With the Edge Server''s
    Caching Proxy configured to use the Tivoli Access Manager Plug-in, the Access
    Manager authorization engine ensures only authorized users access cached and non-cached
    resources. This integrated solution ensures control at the edge of your network.


    ## IBM Directory Integrator


    IBM Directory Integrator is an integration development and deployment tool that
    helps customers quickly and effectively integrate application-specific directories
    to provide a consistent, enterprise-level view of directory information.


    With built-in connectors, an open-architecture Java environment to extend or modify
    these connectors, and tools to apply logic to data as it is processed, IBM Directory
    Integrator can help you by:


    - Synchronizing and exchanging information between applications or directory sources.

    - Managing data across a variety of data repositories.

    - Providing a consistent directory infrastructure that can be used by a wide variety
    of applications ranging from security and provisioning to Web services.

    - Offering a consistent view of additional directory-based information, such as
    product and pricing data, to applications beyond traditional user identity and
    passwords.


    ## 6.1.2 User management and security


    Because most branches have a need for local processing when the communications
    link to the central site is unavailable, there is a need for some level of user
    management that can be enforced at the branch level. This section describes some
    of the offerings in this area.


    ## Samba


    Samba provides Windows Internet File System (CIFS) and SMB functionality for UNIX
    clients and servers can be configured to provide a Windows NT like Primary Domain
    Controller for the Branch.


    It''s based on the common client/server protocol of Server Message Block (SMB)
    and Common Internet File System (CIFS). Using client software that also supports
    SMB/CIFS, for example, Windows and OS/2 products, an end user sends a series of
    client requests to the Samba server on another computer in order to open that
    computer''s files, access a shared printer, or access other resources. The Samba
    server on the other computer responds to each client request, either granting
    or denying access to its shared files and resources.


    ## Pluggable Authentication Modules (PAM)


    Pluggable Authentication Modules can be used to allow the system administrator
    to set authentication policies for PAM-aware applications without having to recompile
    authentication programs. PAM does this by utilizing a pluggable, modular architecture.
    PAM modules can be developed to authenticate users against a centralized database.


    When used correctly, PAM provides many advantages for a system administrator,
    such as the following:


    - A common authentication scheme that can be used with a wide variety of applications.

    - PAM can be implemented with various applications without having to recompile
    the applications to specifically support PAM.

    - Great flexibility and control over authentication for the administrator and
    application developer.

    - Application developers do not need to develop their program to use a particular
    authentication scheme. Instead, they can focus purely on the details of their
    program.


    ## Kerberos


    Kerberos is a secure method for authenticating a request for a service in a computer
    network. Kerberos lets a user request an encrypted ticket from an authentication
    process that can then be used to request a particular service from a server. The
    user''s password does not have to pass through the network.


    ## Snort


    Snort is a lightweight network intrusion detection system, capable of performing
    real-time traffic analysis and packet logging on IP networks. It can perform protocol
    analysis, content searching and matching, and can be used to detect a variety
    of attacks and probes, such as buffer overflows, stealth port scans, common gateway
    interface (CGI) attacks, Server Message Block protocol (SMB) probes, operating
    system (OS) fingerprinting attempts, and much more. Snort uses a flexible rule-based
    language to describe that it should collect or pass a modular detection engine.
    Snort has a real-time alerting capability, with alert mechanisms for syslog, a
    user specified file, a UNIX socket, or Win Popup messages to Windows clients using
    Sambaclient.


    ## Lightweight Directory Access Protocol (LDAP)


    LDAP is a proposed standard for accessing global or local directory services over
    a network. LDAP is very useful because it was designed to support propagation
    across LDAP servers throughout the network, much like the Domain Name Service
    (DNS). DNS helps connect computers to one another based on domain names or the
    type of service requested from a domain. Without DNS servers, host names could
    not be translated into IP addresses, which are required for TCP/IP communication.
    In the future, LDAP could provide the same type of global access to many types
    of directory information. Currently, LDAP is more commonly used within a single
    large organization, such as a bank, for directory services.


    LDAP is a client/server system where the LDAP client connects to an LDAP server
    and queries it for information or provides information that needs to be entered
    into the directory. The server either answers the query, refers the query to another
    LDAP server, or accepts the information for incorporation into the directory,
    based on the permission of the user.


    ## IBM Directory Server


    IBM Directory Server provides a powerful Lightweight Directory Access Protocol
    identity infrastructure that is the foundation for deploying comprehensive identity
    management applications and advanced software architectures, such as Web services.


    IBM Directory Server and the new directory and metadirectory services provide
    capabilities that are essential for companies that need to deploy Web services
    and user provisioning. A directory is a database used to store and retrieve user,
    resource, and other key network information. Metadirectory service aggregates
    directory information that may be stored in directories or databases provided
    by multiple software vendors and running on variety of operating systems.


    ## IBM Tivoli Access Manager for e-business


    IBM Tivoli Access Manager is a policy-based access control solution for e-business
    and enterprise applications. It uniquely addresses the challenges of e-business
    security, enabling new and rapidly scaling e-business initiatives to reach new
    markets and customers. It also addresses growth and complexity, escalating management
    costs, and directly tackles the difficulties of implementing security policies
    across a wide range of Web and application resources. Tivoli Access Manager for
    e-business helps companies by reducing deployment time and cost for new e-business
    applications.


    Tivoli Access Manager for e-business controls both wired and wireless access to
    applications and data provides single logon (SSO) for authorized users. Tivoli
    Access Manager for e-business integrates with e-business applications to deliver
    a secure personalized e-business experience for authorized users. Tivoli Access
    Manager includes integrated security for key customer relationship management
    (CRM), enterprise resource planning (ERP), and supply chain management (SCM) e-business
    solutions, as well as enhancements for securing J2EE-conforming applications running
    on WebSphere Application Server. Tivoli Access Manager for e-business provides
    partners, customers, suppliers and employees with secure access to business-critical
    applications and data for highly available and scalable transactions.

    '
