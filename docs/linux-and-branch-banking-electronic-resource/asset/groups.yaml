    # The team that wrote this redbook


    This redbook was produced by a team of specialists from around the world working
    at the International Technical Support Organization, Austin Center.


    Bart Jacob is a Senior Technical Staff Member at IBM Corp - International Technical
    Support Organization, Austin Center. He has 21 years of experience providing technical
    support across a variety of IBM products and technologies, including communications,
    object-oriented software development, and systems management. He has 10 years
    of experience at the ITSO, where he has been writing IBM redbooks and creating
    and teaching workshops around the world on a variety of topics. He holds an MS
    degree in Numerical Analysis from Syracuse University.


    David Janson is a certified Consulting IT Architect with the IBM Architecture
    and Technology Center of Excellence. With over 20 years of experience in the industry,
    the last 7 of have been with IBM, Mr. Janson''s areas of expertise include Enterprise
    Architecture, e-business Solution Architecture, Application Integration, and software
    development methods. His special interest in techniques that accelerate the process
    of architecting and implementing IT solutions has made IBM Patterns for e-business
    an area of particular focus. Mr. Janson is also an experienced instructor and
    has had the pleasure of teaching classes on a number of advanced topics related
    to software architecture and design. He holds Bachelor of Science degree from
    Southern Illinois University.


    Oliver Mark is a certified Consulting IT Architect in IBM Global Services Germany.
    He has over 12 years of experience in the client/server area, mainly in the banking
    sector, with a clear focus on OS/2-end-to-end architectures. He is responsible
    for all IBM Global Services offerings for OS/2 and its customers in the EMEA Central
    Region. He holds a degree in economics and computer technologies. His areas of
    expertise include OS/2, Warp Server, IBM Communication products, Windows, and
