    # Security


    The following are security solutions for Linux.


    # IBM Tivoli Access Manager for e-business


    Provides end-to-end security for e-business, including Web single signon, distributed
    Web-based administration, and policy-based security. It is available on IBM zSeries
    servers.


    http://www.tivoli.com/products/index/access-mgr-e-bus/


    # IBM Tivoli Access Manager for Operating Systems


    Provides end-to-end access control, application-level data protection, and centralized
    security policy management for the IBM WebSphere MQ environment. It is available
    on IBM xSeries and other Intel-based servers.


    http://www.tivoli.com/products/index/access-mgr-operating-sys/


    # IBM Tivoli Identity Manager


    Centrally coordinates the creation of user accounts and automates the workflow
    for approval and the provisioning of resources.


    http://www.tivoli.com/products/index/identity-mgr/


    # Storage


    The following are storage solutions for Linux.


    # IBM Tivoli Storage Manager


    Automates data backup and restore functions, supports a broad range of platforms
    and storage devices, and centralizes storage management operations.


    http://www.tivoli.com/products/index/storage-mgr/


    # IBM Tivoli Storage Manager Enterprise Edition


    Delivers an integrated data-protection solution for large enterprises, including
    LAN-free, SAN-enabled data transfers, hierarchical storage management, and disaster
    recovery functions.


    http://www.tivoli.com/products/index/storage-mgr-enterprise/


