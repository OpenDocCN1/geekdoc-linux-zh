    ## 3.4 Functional requirements


    The functional requirements of a banking branch system are those customer service
    functions required to open accounts, make inquiries on accounts, and provide transactional
    services. Branch banking requirements are usually split into two broad categories:
    teller and platform.


    Teller functionality includes taking deposits of cash and checks, providing cash
    and check withdrawals, paying loans. Platform functions include opening accounts,
    taking loans, and providing information about products and services. Although
    platform functionality is of more value to the bank because of the emphasis on
    bringing in revenue, teller functionality is somewhat more critical because it
    involves a need for consistent level of service. Teller functionality is well-defined,
    the application requirements tend to change over time as providing information
    to customers through office productivity tools such as word processors and spreadsheets.
    Tellers and employees of the financial institution also have a need for applications
    such as e-mail and general information. Most of these can be handled by a web
    browser.


    In addition to actual functionality, other functional requirements include the
    ease and speed of adding new functions and multichannel functionality that can
    be reused in all delivery channels.


    ### 3.4.1 Operational considerations


    Operational considerations deal with qualities that an IT system must satisfy.
    These include service level requirements, such as reliability, availability, serviceability,
    scalability, performance, and systems management.


    ### Reliability, availability, and serviceability


    The availability expectations of a system relate to how many hours per day, per
    week the system needs to be available to users and how quickly they should recover
    from failures. In order to meet reliability, availability, and serviceability
    (RAS) objectives, there should be no single points of failure in essential system
    nodes. All application servers, database servers, messaging servers, and back-end
    servers would be deployed using load balancing and clustering. The availability
    of users to work at any time would ensure that desktops are never a single point
    of failure. Data should not be stored on desktops except for logging purposes.
    Because of the redundant nature of the middle-tier and back-end system nodes,
    most planned maintenance can take place while the system remains online to end
    users.


    ### Security


    The primary requirements for security must be achieved naturally in the branch
    system architecture. It must have a locked down desktop that permits access to
    applications controlled by the system administrator. By default, users would not
    be able to load their own applications into the desktop. Internet access would
    either not be allowed or would be accessible through a proxy server with sufficient
    network controls. File transfers initiated by the user would also not be allowed.
    In addition, the branch system must be customized for specific roles, and therefore,
    access to information and transactional systems would be tightly controlled. Optionally,
    all communications between the branches and central data centers can be encrypted
    to ensure data confidentiality, and authentication codes can be attached to all
    communications to ensure that data is not altered.


    ### Performance


    A performance model must be used as a method of sizing the physical components
    of an IT infrastructure. The performance model attempts to capture a combination
    of the application behavior and the non-functional requirements. The elements
    of a performance model include node performance, application performance, network
    performance, and database performance. These elements are explored more deeply
    as the architecture is detailed to the specification and physical implementation
    levels.


    ### System management and maintainability


    System management and maintainability refers to the maintenance and administration
    of branch software and hardware systems. It involves configuration management,
    application management and maintenance, and monitoring of all system nodes and
    application components for early detection of failure or performance deterioration.


    ### Configuration management


    Configuration management deals with the tracking and deployment of hardware nodes
    and software components across the enterprise. For a large financial institution''s
    branch system, this can be a large undertaking involving 5,000 locations, more
    than 75,000 hardware nodes, and multiple system and application software footprints.


    ### Application management and maintenance


    This is oftentimes viewed as part of configuration management. This involves the
    ability to update both system and application software components to meet changing
    business requirements, such as adding new functions and changing data formats.
    Application changes are made by generating new packages and including them in
    revised desktop definitions. System changes can be made using tools that are available
    to update the systems. In a branch system, the deployment of desktops becomes
    very difficult. Specialized system management components and nodes may need to
    be defined when driving the architecture to the specification and physical level
    in order to simplify the deployment process.


    ### System monitoring


    Agents that regularly poll the site and measure its response time will perform
    system monitoring. The system needs to be integrated to the centralized monitoring
    system so that branch systems-related alerts would be distributed in the same
    manner as other error conditions in the rest of the bank''s system.


    ## 3.5 Non-functional requirements


    The non-functional requirements of an IT system specify those aspects of the system
    that are not directly related to the application functionality. The primary non-functional
    requirements that need to be dealt with are service level requirements, such as
    capacity and performance (volumetric), availability, security, and system management.


    Other typical non-functional requirements include properties to ensure portability
    and maintainability and any system constraints. Typical system constraints include
    business constraints that the system must satisfy (for example, geographical location),
    existing technical standards, and technical "givens" that constrain the system
    architecture and design.


    The costs, for both operations and technology, are one of the major drivers for
    decisions on all levels within a branch bank environment. While some of the following
    requirements have only implicit influence over overall costs, the total costs
    for the new solution need to meet business requirements. It is not unusual that
    the return on investment is required to be less than 12 months.

    '
