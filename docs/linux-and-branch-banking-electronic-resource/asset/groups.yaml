    \ and data. Eontec and WSBCC can be used to create a multichannel application\
    \ that supports the Self-Service business pattern.\n\nEontec uses a J2-based architecture\
    \ including stateless session beans and entity beans that implement bean-managed\
    \ persistence. This approach allows the entity beans (under the Eontec framework)\
    \ to adapt to alternative mechanisms to persist information, such as a database\
    \ or through the use of other application services. The Eontec framework's persistence\
    \ layer uses services of the Eontec Financial Process Integrator component to\
