    # 5.4.6 WSBCC and Eontec


    IBM and business partner Eontec have collaborated to combine WebSphere Business
    Components Composer (WSBCC) with the Eontec financial components. In the resulting
    solution, WSBCC multichannel business operations can launch a request to an Eontec
    financial component that can, in turn, use WSBCC Communication Services to integrate
    with other applications and data. Eontec and WSBCC can be used to create a multichannel
    application that supports the Self-Service business pattern.


    Eontec uses a J2-based architecture including stateless session beans and entity
    beans that implement bean-managed persistence. This approach allows the entity
    beans (under the Eontec framework) to adapt to alternative mechanisms to persist
    information, such as a database or through the use of other application services.
    The Eontec framework''s persistence layer uses services of the Eontec Financial
    Process Integrator component to integrate with'
