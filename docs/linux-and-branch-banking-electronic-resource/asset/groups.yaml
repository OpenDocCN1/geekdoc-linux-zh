    # 2.1.1 Branch banking trends


    The banking industry has undergone significant changes in the past several years
    regarding delivery of retail products and services. A February 2002 article from
    TowerGroup, "Retail Bank Branch Renewal in the United States: The Market, Technology
    Directions, and Vendors", explained "There has been relatively little strategic
    investment in the retail bank branch infrastructure over the last ten years."
    They give four primary reasons for:


    +   - Emphasis on the continuous emergence of alternative delivery channels (Internet,
    cell phones, PDAs, and so on).


    +   - Existing technology, as OS/2, which has been the predominant operating system
    in branch banks for a number of years, has been reliable, stable, and has a low
    total cost of ownership. Also, 3270 terminals and 4700 controllers have reliable
    connections to the mainframe.


    +   - There has been little need for advanced technology in the branch, while
    banks were focused on alternative channels.


    +   - The pain factor involved in changing existing technologies includes the
    cost of new hardware and software, along with the training required to introduce
    new interfaces and business processes into the branch. Bank executives have been
    hesitant to change without a clear ROI for new investments.


    However, a number of factors have forced banks to rethink the strategic roles
    of their branch channel and to consider a major renewal of their existing technologies.
