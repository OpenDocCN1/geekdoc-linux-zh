    # Table 5-5 Pattern summary: Decomposition


    | Key characteristics | - Make application services available through multiple
    channels;

    >- Move to a hub and spoke topology that provides back-end application services
    to any channel without the channel needing to know details of the back-end application
    locations or message formats.

    >- Intelligent request routing from a channel to the appropriate system.

    >- Message transformation of requests and responses.

    >- Session concentration: The router maintains a reduced set of sessions with
    back-end applications, instead of each channel needing to maintain its own set.

    >- Enforce channel- and role-based security policy.

    >- Eliminate the need for each channel to support dedicated point-to-point connections
