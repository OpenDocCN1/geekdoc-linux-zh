    ## 4.1 电子商务模式导言


    当公司在电子商务市场中进行竞争时，他们发现必须重新评估其业务流程和应用程序，以确保其技术不受时间、空间、组织边界或领土边界的限制。他们必须考虑实施解决方案所需的时间，以及成功执行该解决方案所拥有的资源（人员、资金和时间）。这些挑战，加之遗留系统的集成问题以及交付持续高质量服务的压力，使得开发电子商务解决方案成为了一项艰巨的任务。


    为了减轻定义电子商务解决方案所涉及的任务，IBM 构建了一个模式库以简化相关工作。简单来说，模式（pattern）可以被定义为一种在制造某物时作为指南的模型或计划。因此，模式的作用是促进事物的开发和生产。模式编码了执行过类似任务的人员的可重复经验和知识。模式不仅记录了解决常见问题的办法，还指出了应该避免的陷阱。IBM
    电子商务模式（Patterns for e-business）由记录在案架构最佳实践组成。它们定义了一个全面的指南和技术框架，这些指南和技术实际上已用于创建客户参与项目的架构。电子商务模式通过定义不同层级的架构模式（从业务模式到应用程序模式再到运行时模式），弥合了业务与
    IT 之间的差距，使得能够在各个层级之间轻松导航。每种模式（业务、集成、应用程序和运行时）都能帮助公司理解其开发项目的真实范围，并提供必要的工具来促进应用程序开发过程，从而允许公司缩短上市时间、降低风险，更重要的是，实现更显著的投资回报。


    电子商务模式的类型如下：


    - 业务模式

    - 集成模式

    - 复合模式

    - 应用程序模式

    - 运行时模式和匹配产品模式


    当公司利用这些记录的资产时，他们能够减少完成项目所需的时间和风险。


    例如，一个理解解决方案业务方面和需求的业务线（LOB）高管人员，可以使用业务模式为解决方案开发一个高层结构。业务模式代表了常见的业务问题。LOB 高管人员可以将他们的需求（IT
    和业务的驱动因素）与已记录在案的业务模式进行匹配。这些模式通过识别用户、业务和数据之间的常见交互，为最经常遇到的业务挑战提供了切实的解决方案。


    高级技术高管人员可以使用应用程序模式对拟议解决方案的结构和架构做出关键决策。应用程序模式有助于完善业务模式，以便将其作为计算机解决方案实施。技术高管可以使用这些模式来识别并描述实现业务模式中识别的关键功能所需的高层逻辑组件。每种应用程序模式都会描述结构（应用程序的层级）、数据位置以及涉及系统的集成（松耦合或紧密耦合）。


    最后，解决方案架构师和设计人员可以使用运行时模式来实现应用程序模式，从而开发技术架构。运行时模式描述了实现应用程序模式所需的逻辑架构。解决方案架构师可以将运行时模式与现有环境和业务需求相匹配。他们实施的运行时模式建立了支持所选应用程序模式所需的组件。它定义了逻辑中间件节点、其角色以及这些节点之间的接口，以满足业务需求。运行时模式记录了完成应用程序必须具备的内容（注：此处原文为
    documents what，意为记录了必须就位的内容），但未指定产品品牌。实际产品的确定是在模式的产品映射阶段完成的。


    总结之，电子商务模式捕捉了经过测试和证明的电子商务方法。通过使这些方法变得可用并将其归类为有用的类别，LOB 高管、规划者、架构师和开发者可以进一步将其精炼为实用的、切实的指南。模式及其相关指南允许个人从问题和愿景开始，找到符合该愿景的概念模式，定义应用程序成功所需的必要功能部分，然后实际构建应用程序。此外，电子商务模式从项目开始就提供了通用术语，并确保应用程序支持业务目标，显著降低了成本和风险。


    ## 4.2 电子商务模式分层资产模型


    电子商务模式允许架构师通过重用来自经过证明的成功经验的组件和解决方案元素来实现电子商务解决方案。电子商务模式基于一套层次资产，任何现有的开发方法都可以利用这些资产。这些分层资产的结构使得每一层细节都建立在上一层之上。这些资产包括：


    - 业务模式：识别用户、业务和数据之间的交互。

    - 集成模式：当无法基于单个业务模式提供解决方案时，将多个业务模式连接在一起。

    - 复合模式：代表业务模式和集成模式的常见组合。

    - 应用程序模式：提供一种概念性布局，描述业务模式或集成模式中的应用程序组件和数据如何相互作用。

    - 运行时模式：定义了支持应用程序模式的逻辑中间件结构。运行时模式描绘了主要的中间件节点、其角色以及这些节点之间的接口。

    - 产品映射：为每个运行时模式识别经过证明和测试的软件实现方案。

    - 电子商务应用程序设计、开发、部署和管理的最佳实践指南。


    这些资产及其相互之间的关系见第 67 页的图 4-1。


    ![](img/f3b72f8072d00d967972ff147667688f_82_0.png)


    图 4-1 模式分层资产模型


    ## 电子商务模式网站


    电子商务模式网站提供了一种自上向下浏览分层电子商务资产的简单方法，以确定参与项目时的首选可重资产。


    为了方便参考电子商务模式，请访问电子商务模式网站：


    http://www.ibm.com/developerworks/patterns/


    ### 4.2.1 如何使用电子商务模式


    如上一节所述，电子商务模式的结构使得每一层细节都建立在上一层之上。最顶层是业务模式，它们描述了涉及的实体。业务模式描述了用户、业务组织或应用程序与数据之间的关系。


    复合模式出现在图 4-1 所示层次结构的业务模式之上。复合模式由多个业务模式和至少一个集成模式组成。在本节中，我们将讨论如何使用电子商务资产的分层结构。


    共有四种业务模式，如表 4-1 所示。


    ### 表 4-1 业务模式


    | 业务模式 | 说明 | 示例 |

    |---|---|---|

    | 自服务（用户到业务） | 用户通过互联网与业务交互的应用程序 | Simple Web 应用程序 |

    | 信息聚合（用户到数据） | 用户从海量数据、文本等提取有用信息的应用程序 | 商业智能、知识管理、网络爬虫 |

    | 协作（用户到用户） | 支持用户之间协作工作的应用程序 | 电子邮件、社区、聊天、视频会议等 |

    | 扩展企业（业务到业务） | 连接两个或多个企业流程的应用程序 | EDI、供应链管理等 |


    如果所有问题都能完美契合这四种业务模式将非常方便，但现实情况通常更为复杂。模式假设所有问题在分解为最基本的组件时，会符合这些模式中的某一个。当一个问题描述的目标符合多个业务模式时，电子商务模式以集成模式的形式提供解决方案


    集成模式允许我们连接多个业务模式来解决问题。集成模式如表 4-2 所示。


    ### 表 4-2 集成模式


    | 集成模式 | 说明 | 示例 |

    |---|---|---|

    | 访问集成 | 通过公共入口点对多种服务的集成 | 门户网站 |

    | 应用程序集成 | 在用户不直接调用的情况下集成多个应用程序和数据源 | 消息代理、工作流管理器 |


    这些业务模式和集成模式可以组合以实施特定的业务解决方案。我们称之为自定义设计（Custom design）。


