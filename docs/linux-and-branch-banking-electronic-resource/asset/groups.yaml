    ## 6.1.3 File and print services


    Branch offices almost always require some level of local file and printer sharing.
    Again, there are many Linux-based products for this area. In this section, we
    describe a few of the popular solutions.


    ## Samba


    Samba is a very popular open source server package where a Linux system can provide
    file and print services, also known as shares. Samba implements the Server Message
    Block (SMB) protocol, a complex protocol, developed by IBM in 1984, that provides
    file and print services for Windows, OS/2, and Linux desktops. Some application
    components make use of these types of services under certain application design
    models.


    Samba is used by many people around the world on a daily basis in a production
    capacity. Perhaps this is because of Samba''s open source nature, the fact that
    it ships with Linux distributions, and because of the Samba team''s efforts to
    supply a product that can work seamlessly in an otherwise Windows-based environment.


    For further information about SAMBA, see:


    ```

    http://www.samba.org

    ```


    ## IBM Tivoli Storage Manager


    IBM Tivoli Storage Manager protects your data from hardware failures and other
    errors by storing backup and archive copies of data on offline storage. It scales
    to protect hundreds of computers ranging from laptops to desktops across a wide
    range of hardware ranging from mainframes. They can be connected through the Internet,
    WANs, and LANs. The Tivoli Storage Manager''s centralized, Web-based management,
    smart-data-move and store techniques, and comprehensive policy-based automation
    all work to minimize data protection administration costs and the impact on both
    computers and networks. Optional modules allow business-critical applications
    that must run 24x365 to utilize the Tivoli Storage Manager centralized data protection
    with no interruption to their service.


    ## IBM Linux Technology Center Omni drivers


    The Omni printer driver provides support for over 400 printers using the Ghostscript
    framework. In addition, it provides a model for dynamically loading printer drivers,
    creating new devices by editing device description files, and simplifies new printer
    driver development by allowing for the sub-classing of previous device driver
    features.


    ## 6.1.4 Store and forward


    Store and forward services provide support for operations that cannot be processed
    online because there is no back-end connectivity, perhaps due to an unexpected
    interruption, and also for batch processing operations.


    Typically, store and forward services are built into applications or application
    frameworks rather than as a separate product. The products described in the following
    sections can support applications requiring store and forward capabilities.


    ## IBM WebSphere Business Components Composer (WSBCC)


    WebSphere Business Components Composer is a strategic element of both multichannel
    and branch transformation solutions for the retail banking industry. It brings
    high value to financial institutions looking to renew retail delivery channels
    as part of larger initiatives to improve operating efficiency and profitability.
    By enabling financial institutions to build and deploy an infrastructure that
    delivers consistent, flexible business logic and customer service across all retail
    delivery channels, this offering enhances a bank''s ability to understand and
    satisfy unique customer needs.


    WSBCC provides a set of components designed specifically for these types of retail
    banking applications. By using WebSphere Business Components Composer''s proven
    component-based middleware framework, retail banks can build integrated applications
    to support multiple customer channels and branch transformation efforts.


    ## IBM Bank Teller Business Components


    The IBM WebSphere branch branch transformation solution is enabled by IBM Bank
    Teller Business Components. These components provide the flexibility and adaptability
    to implement a Java teller system based on a set of proven and high-performing
    components. The components enable an environment that allows customers to rapidly
    build and deploy teller transactions in a manner that supports transaction reuse
    across other channels. Implemented by a number of global financial institutions,
    the WebSphere branch transformation solution provides a solid foundation for leveraging
    WebSphere capabilities across the enterprise.


    ## IBM Local Area Network Distributed Platform (LANDP)


    LANDP has been designed and developed primarily for retail banking. It is a tried
    and tested solution that is used by a large number of customers worldwide, including
    some of the world’s largest banks. LANDP includes the following:


    - Client/server environment: Supports different multiplatform networks running
    a combination of Linux, Windows, OS/2, and DOS communicating over NetBios or TCP/IP.

    - Communications servers: Supports different communications links and protocols
    to run host applications.

    - Data management servers: Provides support for the storage, retrieval, and updating
    of data in LANDP subgroups.

    - Database servers with multiple access modes, a shared-file server, an electronic
    journal, and a store-and-forwarding server cover a wide range of data management
    requirements.

    - Financial device servers: LANDP can be used to access and share financial devices.

    - Common Programming Interface: Used to develop applications for LANDP environments.
    The location of services in a subgroup is managed by LANDP. This means that when
    you develop an application, you do not need to know where the server supports
    the service is located.

    - Migration support: LANDP cross-platform capabilities enable the applications
    and services to be easily migrated across many different platforms.


    ## 6.1.5 Database services


    Some application models currently use a database in the branch to house data that
    is required in offline mode. For example, some implementations of electronic journal
    might use a database. In addition, a database may be used to store configuration
    data that is required during offline processing. Branch database services may
    not be required in more centralized application design models with limited offline
    requirements.


    ## Red Hat Database


    Red Hat Database is the open source database tested and verified for use with
    Red Hat Linux Advanced Server and Red Hat Linux. It is powered by an enhanced
    version of PostgreSQL and its ISO image is freely downloadable from the Red Hat
    download center at:


    ```

    http://www.redhat.com/apps/download/

    ```


    ## MySQL


    MySQL is one of the world''s most popular open source database systems, designed
    for speed, power, and precision in mission critical, heavy load use.


    The software from MySQL AB that you can download from the MySQL Web site is licensed
    under the GPL license and is provided "as is" and is without any warranty:


    http://www.mysql.com


    ## PostgreSQL


    PostgreSQL is a sophisticated object-relational DBMS, based on POSTGRES, developed
    at the University of California at Berkeley Computer Science Department, supporting
    almost all SQL constructs, including sub-selects, transactions, and user-defined
    types and functions. It is the most advanced open database available anywhere
    anywhere. Commercial support is also available.


    ## IBM DB2 for Linux


    The DB2 advantage is simple: pure power at a lower cost than any other e-business-ready
    Linux database on the market. With DB2, you can access, manage, and analyze all
    of information across the enterprise, and on all major platforms. With Linux becoming
    a major platform for database and application servers, DB2 for Linux gives you
    a robust, easy-to-manage database that offers high performance, complementing
    the stability and reliability of Linux.


    DB2 for Linux supports and embraces open standards, including Java and XML, and
    integrates with many open source products, such as Apache, PHP, Perl, and Python.
    DB2 UDB is the most scalable database in production today that can manage mission-critical
    data on a single PC, SMPs, clusters, as well as the mainframe for Linux.


    ## IBM Informix Dynamic Server


    IBM Informix Dynamic Server (IDS) provides the mission-critical availability,
    reliability, scalability, and data-intensive transaction management capabilities
    a growing number of organizations rely on to succeed in e-business. It also provides
    world-leading extensibility features.


    Because business logic can be embedded in the database and fully integrated in
    IBM Informix Scalable Architecture (DSA), IDS can solve problems that few other
    systems can. It can also provide uniform access to client information, regardless
    of where it resides, through leading distributed database and virtual table capabilities,
    thereby allowing queries to encompass a wide range of databases, from flat files
    to other IDS and non-IDS databases.

