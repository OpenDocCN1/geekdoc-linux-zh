    # An introduction to Linux


    Although we do not start our detailed description of the branch banking environment
    until Chapter 2, it is important to position Linux within a finance industry context
    to begin this book.


    IBM expects Linux to become a significant platform option for our financial services
    customers. This is not just speculation. Banks, brokers, and insurance companies
    are using Linux already, and we expect many others to follow, albeit in generic
    and niche areas first, before tackling mission-critical transaction-oriented workloads.


    With the recent stock market corrections and reductions in retail brokerage volumes
    adding to market competition, the already intense focus on cost is likely to be
    even higher, driving further investigation into efficiencies in e-business infrastructure
    and more cost-effective ways of working. This view is supported by the recent
    DataMonitor study on IT efficiency in the financial services sector, which found
    control to be the number one or two driver of IT strategies in 42% of our customers
    for 2002. We expect this to drive Linux investments, both at an individual application
    level and in server consolidation scenarios.


    Let''s start our discussion with a brief overview of Linux.'
  - '[PAGE 17]


    # 1.1 What is Linux


    Linux is a UNIX-like, POSIX-compliant operating system distributed under the GNU
    software license, meaning the operating system and its source code are available
    for free. Initially developed in the early 1990s by Linus Torvalds along with
    other programmers around the world, Linux supports all the major Window managers
    and all the Internet utilities, as FTP, Telnet, and SLIP. It provides 32-bit and
    64-bit multitasking, virtual memory, shared libraries, and TCP/IP networking.
    It also has a full set of program development utilities, including C++ compilers
    and debuggers.


    Linux consists of four major components: the kernel, the shell, the file structure,
    and the utilities.


    Although it has been implemented across a variety of hardware platforms, it is
    most often deployed on Intel-based processors. The Linux kernel is designed to
    use the special protected-mode features of Intel 8086 processors. Therefore, Linux
    makes use of the protected-mode, descriptor-based memory management paradigm and
    many of the other advanced features of these processors. Linux exploits the multitasking
    capability of 80386--mode.. The kernel supports demand-paged loaded executable
    so that only segments of a program that are actually used are read into memory
    from disk. Likewise, if multiple instances of a program are running at once, only
    one of the program code will be in memory.


    The Linux kernel includes many improvements specifically designed for enterprise.
    The kernel has built-in support for eight-symmetric multiprocessing, and the TCP/IP
    stack has been rewritten to increase stack performance and provide better scalability
    in multiprocessing systems.


    The Linux kernel is a monolithic kernel, in that all device drivers are part of
    the kernel proper. However, Linux supports loadable device drivers that can be
    loaded and unloaded from memory through user commands. The kernel is capable of
    enabling 387-FPU instructions so that systems without a math coprocessor can run
    programs that require floating-point math.


    Linux users interact with the Linux kernel through their own individual shells.
    The shell provides an interface between the kernel and the user. If the user prefers
    a GUI interface, XFree86, can be installed. XFree86 is a freely available distribution
    of the Windows System, containing the X server, programming libraries for developing
    X applications, and documentation. Window managers are also available. The window
    manager provides the graphical interface that lets users send commands to the
    Linux kernel by clicking windows, icons, and menus, as much they would on a Microsoft
    Windows or Mac machine.'
