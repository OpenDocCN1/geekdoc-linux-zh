- md: "\n# Decomposition pattern\n\nIn this section, we describe the Decomposition\
    \ application and runtime patterns.\n\n## Application pattern\n\nFigure 5-13 illustrates\
    \ the Decomposition application pattern.\n\n![](img/f3b72f8072d00d967972ff147667688f_116_0.png)\n\
    \nFigure 5-13 Decomposition application pattern\n\nThe Decomposition application\
    \ pattern extends the Router pattern to enable processing of more sophisticated\
    \ requests. As with the Router pattern, this pattern can handle requests from\
    \ multiple channels. It goes beyond the Router by being able to break down a request\
    \ from a channel into multiple requests to back-end applications, and then assembles\
    \ each back-end application response into a single response back to the original\
    \ requester.\n\nThis pattern is based on the Router's hub and spoke architecture\
    \ and extends it by adding intelligence to decompose then recompose requests and\
    \ responses. One client requests multiple requests to individual enterprise applications\
    \ (referred to as fan out), and each of the individual results are collected into\
    \ a single response back to the client (referred to as fan in). A local work-in-progress\
    \ database may be used to hold intermediate results that are needed to represent\
    \ present state and to assemble the final response back to the channel, as well\
    \ as transformation and routing business rules. Although the decomposition of\
    \ an inbound message (fan out) requires intelligence in the integration server,\
    \ an even more challenging aspect of this pattern is the need to collect, correlate,\
    \ and assemble the individual responses (fan in).\n\nAn important benefit of this\
    \ pattern is that a consistent consolidated customer view becomes available through\
    \ any of multiple channels. Without the capabilities of this pattern, each channel\
    \ would need the intelligence to know which back-end applications provide specific\
    \ information and services. The Decomposition pattern concentrates this intelligence\
    \ in the interrogation node, which greatly simplifies the design of individual\
    \ channels.\n\n## Runtime pattern\n\nSimilar to the Router pattern, several Runtime\
    \ patterns could be used to implement the Decomposition application pattern. Figure\
    \ 5-15 on page 104 represents a commonly used approach based on the use of a message\
    \ broker.\n\n![](img/f3b72f8072d00d967972ff147667688f_117_0.png)\n\nTable 5-5\
    \ on page 103 summarizes this pattern's key characteristics and technology components.\n\
    \n## Table 5-5 Pattern summary: Decomposition\n\n| Key characteristics | Commonly\
    \ used technology components (message broker based) |\n| :--- | :--- |\n| - Make\
    \ application services available through multiple channels; Move to a hub and\
    \ spoke topology that provides back-end application services to any channel without\
    \ the channel needing to know details of the back-end application locations or\
    \ message formats. - Intelligent request routing from a channel to the appropriate\
    \ system. - Message transformation of requests and responses. - Session concentration:\
    \ The router maintains a reduced set of sessions with back-end applications, instead\
    \ of each channel needing to maintain its own set. - Enforce channel- and role-based\
    \ security policy. - Eliminate the need for each channel to support dedicated\
    \ point-to-point connections to back-end application systems. | - Linux server\
    \ - WebSphere Edge Server (optional) - IBM Developer Kit for Linux - WebSphere\
    \ Application Server AE - DB2 UDB EE - IBM HTTP Server - IBM Access Manager for\
    \ e-business - MQ8 support pack (MQ JMS classes) - WebSphere MQ - WebSphere MQ\
    \ Integrator - I7Z MIkers Aggregator plug-in (fan out and fan in support) - WebSphere\
    \ MQ classes for Java - WebSphere Application Server EE |\n\n## Agent pattern\n\
    \nIn this section, we describe the Agent application and runtime patterns.\n\n\
    ## Application pattern\n\nFigure 5-15 illustrates the Agent pattern.\n\n![](img/f3b72f8072d00d967972ff147667688f_119_0.png)\n\
    \nFigure 5-15 Agent application pattern\n\nThis application pattern extends the\
    \ Router and Decomposition patterns. It provides a unified, customer-centric view\
    \ that can be exploited for market customizing of services and for cross-selling\
    \ purposes. The Agent pattern intelligent use of work-in-progress cached data\
    \ to push content to users based on analysis of the data.\n\nA variation of the\
    \ Agent pattern uses an Operational Data Store (ODS) instead of relying on individual\
    \ requests to return the required data.\n\nExamples:\n\n- E-commerce sites with\
    \ targeted marketing\n- Call center representatives being prompted with cross-selling\
    \ scripts\n- Work-in-progress database holding long running transaction data (for\
