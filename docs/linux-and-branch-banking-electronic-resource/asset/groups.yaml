    ### 3.5.2 Capacity, performance, and scalability


    In a distributed system, such as a branch system, the emphasis is not so much
    on the capacity of individual components in the branch, but on how the branch
    components integrate to the up-stream components. With the current state of technology
    for most application designs, performance is usually more affected by things such
    as communications bandwidth and the number of transactions aggregated from all
    branches to the performance of an in-branch server or end-user desktops.


    ### 3.5.3 Reliability and availability


    Branch banks need to be available on a typical business schedule, usually five
    days a week, eight hours a day, excluding holidays. There may be extended hours
    one day a week or shortened hours on Saturday. During the time a branch is open,
    information systems need to be available essentially without failure. The total
    system uptime, including the ability to process some transactions when communications
    to back-end systems are not available, must approach 100%. If the branch cannot
    accept transactions in some manner, then it might as well close. Therefore, contingency
    plans and systems must be in place to cover any system component failure or temporary
    loss. For purposes of this document, the required maximum system failure recovery
    time is assumed to be few hours, and the required system restart time is assumed
    to be less than minutes. Because the branches are open only during scheduled business
    hours, maintenance is easily scheduled during non-business hours.


    The middle-tier and back-end systems that support the branch channel must have
    reliability and availability characteristics that support the branch requirement.
    Because these systems also support other channels, such as the Interactive Voice
    Response (IVR), call center, and Internet, they are normally designed for virtual
    24x7 availability with the required reliability and redundancy to achieve those
    goals.


    ### 3.5.4 Security


    The main security requirements of a banking system are as follows:


    - Local and remote user authentication

    - Functions authorization based on roles

    - Data confidentiality

    - Protection from malicious or fraudulent attacks


    Detailed security requirements can be very specific to a particular bank, because
    the ways in which security is implemented in the enterprise will vary widely.
    Other considerations, such as single signon and the need for data encryption,
    may also be dependent on specific policies, procedures, and network implementation.


    ### 3.5.5 System management


    As with any IT system, the architecture needs to accommodate the ability to monitor
    all system components and respond to outages using automated procedures to the
    greatest extent possible. In the case of a branch system, there are some key specific
    requirements for achieving this goal, as follows:


    - The ability to update both system and application code automatically

    - The ability to restore a failed system to its pre-failure state

    - The ability to add new applications to previously installed systems

    - The ability to detect, diagnose, and correct problems quickly with minimal human
    intervention


    The distributed nature of a branch system presents cost challenges for system
    management, because the number of end-user desktops is high, and there may be
    communication limitations in deploying common system management tools.


    ### 3.5.6 User and desktop management


    In a distributed system, such as a branch system, the administration of the environment
    might not be local to the branch, so a remote configuration of users, roles, applications,
    and desktop settings is required. This goes along with the ability to provide
    a consistent desktop for a user logging on to different physical machines, or
    multiple users logging on to a single machine at different times, a roaming user.


    Furthermore, a consistent look and feel needs to be accomplished, so users would
    not necessarily realize which underlying platform their client machines are running
    on.


    ### 3.5.7 IT standards and existing IT infrastructure


    IT infrastructure and IT standards constraints are very specific to individual
    banks or financial institutions. Common constraints are the choice of operating
    systems and hardware platforms, specific database products, network topology,
    security products and processes, and enterprise system management products. When
    drilling down to the specification and physical implementation architecture levels,
    the existing standards and infrastructure present constraints that will oftentimes
    affect the available choices for functional components or operational nodes. At
    the conceptual level, some typical choices have been made in this document that
    may or not be correct for a particular bank implementation.


    ### 3.5.8 Geographic constraints


    Branch systems have the same constraints in virtually all geographies. Although
    urban settings in a specific country or region may have better infrastructure
    than cities in other parts, branch offices of large financial institutions may
    exist in rural areas with limited or cost prohibitive access to communication
    services. Therefore, the architecture will have to accommodate data communication
    reliability and availability limitations. Specific implementations of the architecture,
    however, may be able to take advantage of superior communication capability.


    ## 3.6 Change cases


    Any potential future requirements that the system may have to support should be
    evaluated and validated to ensure that the architecture is able to accommodate
    them. IBM defines change cases as possible future changes to a system. In this
    document, change cases are used to indicate areas in which both functional and
    non-functional requirements may change for different banks, or in areas where
    emerging technologies may allow significant change in the system infrastructure.


    Proper focus on potential change cases ensures that the system is easy to extend,
    easy to maintain, robust in the face of change, and quick to develop. The focus
    is on what is important and likely, rather than what is possible. Change cases
    try to predict change. Such predictions rarely turn out to be exactly true. Users,
    sponsors, suppliers, developers, and other stakeholders determine the properties
    of a system. Changes can arise from many sources, for example:


    - Business drivers: New and modified business processes and goals

    - Technology drivers: Adaptation of the system to new platforms, integration with
    new components

    - Changes in the profile of the average user

    - Changes in the integration needs with other systems

    - Scope cases arising from the migration of functionality from external systems


    Because change cases are predictive, they are themselves subject to change. Were
    they 100% certain, they would, by definition, deferred requirements.


    ## 3.7 Summary


    This chapter has described some of the requirements for a branch banking system
    from several different perspectives. These requirements will be used as input
    when we look at IBM Pattern for e-business that apply to branch banking solutions.


    Whether you use Patterns for e-business or another methodology to architect your
    solution, these requirements and ways of looking at them are still applicable.
    As shown in Chapter 6, “Linux-based products applicable to branch banking” on
    page 117, Linux can play a key role for building an infrastructure that meets
    these requirements.


    ## IBM Patterns for e-business overview


    IBM Patterns for e-business are a collective set of proven architectures that
    have been compiled from more than 20,000 successful Internet-based engagements.
    This repository of assets can be used by companies to facilitate the development
    of Web-based applications. They help an organization understand and analyze complex
    business problems and break them down into smaller, more manageable functions
    that can then be implemented using low-level design patterns.

    '
