    在描述了我们要解决的问题并确定了适用的业务和集成模式（以及一些可能的复合模式或自定义设计）之后，我们可以转向描述解决方案的模式：应用模式（Application
    patterns）和运行时模式（Runtime patterns）。在分析客户需求期间收集的业务和 IT 驱动因素（见第 3 章第 45 页“分支机构银行需求”）将是下一个决策过程的关键输入。


    ### 5.2 业务背景


    当我们研究银行业场景时，会出现多种类型的用户。例如：


    - 客户（Customer）

    - 分支机构行长（Branch manager）

    - 贷款官员（Loan officer）

    - 柜台员（Teller）

    - 库库主管（Vault supervisor）

    - 行政助理（Administrative assistant）


    我们可以看到，内部和外部用户都直接使用银行的自动化业务服务。对于外部用户（通常是企业对客户 B2C 场景），这可能表现为使用 ATM、使用银行网站，或拨打客户服务代表或语音响应单元（VRU）查询其账户状态。未来，银行可能希望通过移动手持设备提供这些服务。对于内部用户（企业对员工
    B2E 场景），这可能表现为柜台员在与客户面对交易期间使用终端或工作站，或贷款官员使用其桌面工作站输入贷款申请。


    这些交互告诉我们，存在许多自助服务场景，用户可以直接访问自动化 IT 服务。我们还可以看到，通过多种渠道或交付模式提供这些 IT 服务是极具价值的：


    - 桌面工作站

    - ATM 或自助服务机

    - 家用 PC 浏览器

    - IVR 单元（语音应答）

    - 呼叫中心


    银行特别感兴趣的是需要支持用户的移动性，同时提供个性化且安全的 IT 服务。例如，某些分支员工需要能够在从任何数量的工作站位置执行工作。无论他们身处何地，都需要通过一致的用户界面呈现特定的、定制的应用程序集。


    这在今天是通过使用登录用户并将用户特定桌面加载到其工作站的技术来实现的。这种方法支持各种应用程序架构、独立式和厚客户端（thick application）样式、多层分布式瘦客户端拓扑。随着旧应用程序被主流的服务器-客户端架构取代，提供重量级客户端的需求将减少，随之减少的部署应用程序到客户端桌面的需求。这种趋势将使得在更广泛的地点通过更广泛的设备提供应用程序服务变得越来越容易。


    除了我们描述的自助类型交互外，在分支银行环境中还有许多协作式的交互示例。例如，大额或不寻常的提取可能需要分支行长的批准。同样，开新账户可能需要账户代表与信贷检查人员之间更多的协作。


    总结一下，我们可以做出的泛括之一是，我们既有组织内部的用户也有外部的用户。我们还看到用户通过多种渠道（桌面、ATM、IVR、呼叫中心）与自动化 IT 服务交互。我们还看到用户在面对面的情况下相互交互，以及通过支持即时和延迟协作的
    IT 服务进行交互。


    ### 5.3 IT 背景


    金融机构在客户群和地理分布方面都跨越很大范围。这导致了各种企业基础设施拓扑结构，其中一些更加集中，而另一些在区域和分支级别更具分布式。一个反复的主题是银行分支继续发挥关键作用。在银行分支执行面向客户的业务流程的重要性，意味着底层
    IT 服务需要尽可能可用，以便客户在分支机构时进行关键业务交易。


    以下是一些关键的 IT 需求和驱动因素：


    - 需要通过多种交付渠道提供的 IT 服务

    - 对移动或漫游用户的灵活支持

    - 访问安全控制

    - 个性化的 IT 服务呈现

    - 需要适应不同的基础设施能力

    - 需要最大化服务的可用性，在某些情况下提供提供减少的服务作为完全无服务的替代方案

    - 强调最小化总拥有成本的应用和技术策略

    - 强调减少应用程序复杂性和最大化应用程序服务互操作性和重用的应用和技术策略

    - 强调在各种分布式或集中拓扑结构中部署 IT 服务具有灵活性的应用和技术策略


    分支银行的分布式为关键银行应用程序带来了特殊的挑战，并影响了这些应用程序的架构决策。其中一个重要方面是需要提供多个级别的自主性，以便如果系统的某个组件不可用，其他组件可以继续运行并提供某种程度的功能。一个例子是，即使与其集成的企业系统不可用，也要允许
    ATM 取出预设限额内的现金（但不进行余额查询）。

