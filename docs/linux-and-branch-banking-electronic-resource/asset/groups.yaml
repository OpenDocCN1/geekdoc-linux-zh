    # 5.1 Starting to use Patterns for e-business


    Patterns for e-business let us describe the problem or problems we want to solve
    and the solution or solutions that can be used to address those problems. For
    example, Business patterns let us characterize the types of problems we want to
    solve in simple but powerful terms. After we have described the scope and nature
    of the problem or problems we want to solve, Patterns for e-business leads to
    solution alternatives in the form of Application and Runtime patterns. These patterns
    can be implemented through the use of well-known combinations of technology components
    (the Product mapping alternatives that are associated with Runtime patterns).
    At each point, we will need to make decisions about which pattern alternatives
    are the best choice for the situation, and for that, we will need some key information
    as input to the decisions.


    # 5.1.1 Describing the problem or patterns we want to solve


    The first step in applying Patterns for e-business is to establish which Business
    or Integration patterns, or both, are a good fit, in other words, which ones represent
    the problem or problems we are trying to solve. To make that choice, we need to
    look at the problem space, identifying key business and IT requirements. Those
    requirements will us make decisions about which Business and Integration patterns
    apply.


    The Business and Integration patterns describe common characteristics that are
    found in a broad range of business processes across multiple industries. One of
    the goals in defining these patterns was to apply an 80/20 rule: Ensure that these
    patterns could be applied to a majority of business processes in order to address
    a majority of a business''s needs. Because of this, we can be confident of finding
    a good match for a majority of banking process scenarios.


    # 5.1.2 The solution or solutions alternatives


    After we have described the problem space and determined which Business and Integration
    patterns apply, we will be ready to start looking at solution alternatives, in
    the form of Application patterns, for each of the Business and Integration patterns
    we have selected. The solution alternatives described in Patterns for e-business
    also identify technology component Product mappings that can be used to implement
    instances of the Runtime patterns. Once again, we have some decisions to make,
    and we will need to collect and summarize some key information as input into those
    decisions.


    The Patterns for e-business Application patterns, Runtime patterns, and Product
    mappings are based on frequently recurring themes found in the functional and
    operational aspects of successful system architectures. In most cases, these'
- md: '

    patterns are reflected in a large number of successfully implemented systems.
    In some cases, we will also find what are referred to as *emerging* patterns that
    are considered valuable alternatives, but may be too recent to have widely implemented
    yet. The key difference between the standard patterns and emerging patterns is
    the number of times the pattern has been implemented in the field. Although emerging
    patterns have been used less frequently than standard patterns, and therefore
    cannot be considered mainstream patterns yet, their capabilities and initial track
    record make them likely candidates to move beyond the early adopter stage and
    into the mainstream solution pattern category.


    ### 5.1.3 Gathering and summarizing requirements and drivers


    We can look for the information we need for our pattern selection decisions by
    focusing on the following areas where we can gather customer requirements:


    - Business context


    This area of focus looks at user profiles and business processes that we can summarize
    customer requirements and identify key business drivers, both of which are important
    in determining Business patterns apply. The business drivers will also help us
    evaluate Application pattern alternatives.


    - User interactions


    This area of focus looks at how users interact with each other, another key to
    identifying which Business patterns apply.


    - IT context


    This area of focus looks at application and technology portfolios to establish
    a high-level context at the branch and enterprise levels. This will identify any
    significant technical considerations that could influence the solution and identify
    IT drivers. The IT drivers will also help us in a future step when we evaluate
    pattern alternatives.


    - Interactions among users and components in the IT systems


    This area of focus looks at the ways in which users make use of IT services and
    how components that provide those services are deployed and interact with each
    other (and with external systems). This helps identify which Business and Integration
    patterns apply.


    ![](img/f3b72f8072d00d967972ff147667688f_91_0.png)


    Figure 5-1 focus areas define and establish the scope of the problem or problems
    we want to solve and lead us to conclusions about which Business and Integration
    patterns apply. If multiple patterns apply at this level, we could end up with
    a Composite pattern or Custom design (we will look more closely at this later
