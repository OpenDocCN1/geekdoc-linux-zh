    到目前为止，对 WSBCC 和 Eontec 的讨论集中在应用和集成服务的部署方案上。WSBCC 还提供了与展示相关的组件的灵活部署。展示组件可以通过 Java
    applet 以轻级客户端的方法在执行时部署，也可以通过将展示组件保留在服务器端，使用零足迹客户端的方法进行部署。这使得 Eontec 金融应用服务能够在具有各种容量和物理特征的客户端机器上运行。


    跨层部署选项的灵活性结合内置的金融应用服务，使得 WSBCC 和 Eontec 成为分支或企业级银行转型战略中值得考虑的价值替代方案。


    ## 5.5 总结


    本章详细描述了电子商务模式（Patterns for e-business）如何应用于分支银行，从而产生了各种运行时模式和产品映射。大多数产品映射示例在适用的情况下都使用了
    Linux。


    在下一章中，我们将描述 Linux 如何应用于分支银行的某些细节，以及它非常适合的各种角色。


    ## 适用于分支银行的 Linux 产品


    现在我们已经详细描述了分支银行环境和电子商务模式，你可能心中已经有了一个适合你特定需求的架构。最终，你将需要开始创建产品映射，并对整个基础设施的操作系统环境做出选择。


    在本章中，我们提供了适用于 Linux 环境的各种产品和设施的总结。这可能帮助你评估你的环境中哪些系统可以、也许应该运行 Linux。


    ## 6.1 分支银行环境中的 Linux


    在第 3 章（第 45 页）“分支银行需求”中，我们讨论了分支银行解决方案需要种种组件和服务。在本节中，我们将讨论 Linux 如何满足这些最低需求。


    目前 Linux 许多许多产品和解决方案，而且数量每天都在增长。在接下来的章节中，我们将描述这些解决方案的一个小部分。我们讨论的那些通常用于支持分支银行的
    IT 基础设施。其中许多设施是 Linux 发行版原生提供的，另一些是 Linux 环境的附加包。


    ### 6.1.1 网络服务


    让我们从讨论一些网络服务开始。这些服务大部分自 Linux 诞生以来就提供，并且证明是稳定的。


    #### 文件传输协议 (FTP)


    FTP 是 TCP/IP 网络计算机之间交换文件的最简单方法。FTP 是一种常用的应用程序协议，用于从其他服务器下载程序和其他文件到桌面或服务器。


    #### 网络文件系统 (NFS)


    NFS 是一种客户端/服务器应用程序，用于在网络上的机器之间共享文件，就像文件位于客户端的本地硬盘上一样。Linux 既可以作为 NFS 服务器，也可以作为
    NFS 客户端，这意味着它可以向其他系统导出文件，并挂载从其他机器导出的文件系统。


    #### 网络信息系统 (NIS)


    NIS 是用于网络的命名和管理系统。使用 NIS，系统中的每个主机客户端服务器都了解整个系统。任何主机上的用户都可以通过单一的用户标识符和密码，访问网络中任何主机上的文件或应用程序。NIS
    类似于域名系统 (DNS)，但稍微简单得多，专为小规模网络设计，并用于局域网。


    NIS 使用客户端/服务器模型和远程过程调用 (RPC) 接口进行主机间的通信。NIS 由一个服务器、一个客户端程序库和一些管理工具组成。它通常与网络文件系统一起使用。


    #### 域名系统 (DNS)


    DNS 是定位互联网域名并将其翻译为互联网协议地址的方法。域名是互联网地址的一个有意义且易于记忆的“句柄”。


    由于维护一个主机名及其 IP 地址的中央列表是不现实的，因此域名列表和 IP 地址列表以权威分层结构的形式分布在整个网络中。在你的接入点附近可能有一个 DNS
    服务器，它映射你网络中的域名，并根据需要处理请求或将其转发到其他服务器。


    #### 防火墙


    防火墙是位于网络网关服务器的一系列相关程序，用于保护私网资源免受其他用户的侵害。


    基本上，防火墙与路由器程序紧密配合，检查每个网络数据包以确定是否将其转发到目的地。防火墙还包含或与代理服务器配合，由代理服务器代表工作站用户发出网络请求。


    #### 超文本传输协议 (HTTP)


    #### 安全超文本传输协议 (HTTPS)


    HTTPS 是安全加密。


    #### Apache HTTP Server


    Apache HTTP Server 项目是一项开发和维护适用于现代操作系统（包括 UNIX 和 Windows）的开源服务器的工作。该项目的目标是提供一个安全、高效且可扩展的服务器。自1996
    年 4 月以来，Apache一直是互联网上流行的服务器。有关 Apache 的更多信息，请参阅：


    ```http://httpd.apache.org/

    ```


    #### IBM HTTP Server


    基于 Apache 的 IBM HTTP Server IBM 增强了 Apache HTTP Server，例如为安全事务添加了 SSL，并作为 WebSphere
    包的一部分提供了完全支持。


    #### Linux 版 Communications Server


    Linux 版 Communications Server 提供了多协议网关和工作站服务。它使个人计算机能够与 System/390 和 AS/400 主机以及个人计算机通信。Enterprise
    Extender 允许 SNA 操作跨 TCP/IP 网络运行。


    对于客户端/服务器和分布式应用程序，Communications Server 包含了对等点网络 (APPN) 网络节点和终端节点的支持。Communications
    Server 还提供了丰富的应用程序接口。


    #### IBM WebSphere Host On-Demand


    WebSphere On-Demand 为用户提供了一种简单的方法访问关键主机数据，而无需在客户端安装任何软件。WebSphere On-Demand 使用
    Java 技术，帮助直接从浏览器打开主机数据的大门。这种到主机的连接解决方案有助于提供安全的 Web 浏览器访问主机应用程序，而无需编程。通过支持 TN3270E-TN5250、VT220、VT100、VT320、VT420
    和 CICS 事务网关访问，用户可以使用单一界面访问其关键主机数据。由于它是基于 Java 技术，其界面在各种类型的环境中具有相同的外观和感受。它还提供默认的
    GUI 以帮助不熟悉传统绿屏的用户。


