    ## 1.1.1 Standards


    Linux is a Posix-compliant OS, and its constituent subsystems support all relevant
    ANSI, ISO, IETF, and W3C standards. From the beginning, Linux was developed according
    to the Posix standard. The standard defines how a UNIX-like system needs to operate,
    specifying details such as system calls and interfaces. Posix defines a universal
    standard to which all UNIX versions must adhere. Most of the popular versions
    of UNIX are Posix compliant. Linux Posix compliance has made it possible for developers
    to port many popular UNIX applications and utilities to Linux.


    Linux provides a complete implementation of TCP/IP networking. The complete range
    of TCP/IP clients and services are supported. The Linux TCP/IP system provides
    a standard socket programming interface so that any program that uses TCP/IP can
    be ported to Linux.


    Linux also supports the standard ISO-9660 file system for CD-ROMs. The Linux printing
    software consists of the UNIX standard lp and ip software. Any parallel printer
    supported by MS-DOS or another operating system can be supported by Linux. Linux
    supports the full range of series modems, both internal and external.


    In short, the range of interfaces and capabilities that have become standard across
    virtually all operating environments are also available for Linux and implemented
    through open source code and based on industry standards. This combination provides
    a stable and predictable environment for developing, porting, or running business-critical
    applications.


    ## 1.1.2 Minimum operating requirements


    According to the Linux specification for Intel-based platforms, the minimum PC
    requirements for Linux are an Intel 386 computer with about 4 MB of RAM. But to
    run the graphical interface and to have enough speed and space to run most commercial
    distributions of Linux now recommend at least a 486 (preferably, a Pentium) machine
    with 64 MB of RAM and a 600 MB hard drive. Linux requires a minimum of two disk
    partitions: swap and system. The base root file system uses between 50 MB and
    100 MB of disk space. Swap space should be equal to RAM memory, with an absolute
    minimum of 16 MB recommended. However, the size of the Linux system partition
    will be larger, based on what the Linux system is used for and the scalability
    and portability of file systems to other partitions.


    Although the actual hardware requirements will be dependent on the business and
    application requirements, it is safe to say that the design and efficiency of
    the Linux environment allows companies to build robust systems using relatively
    generic and less expensive hardware.


    In summary, Linux, as a full-function, standards-based operating system with relatively
    minimal hardware requirements, has been getting a lot of attention from businesses
    looking for less expensive solutions to meet their IT demands.


    Of course, Linux distributions are also available for other hardware platforms,
    including the full range of IBM servers from xSeries to zSeries. For the minimum
    requirements on platforms other than Intel, please see the relevant Linux distribution
    documentation.


    ## 1.2 IBM and Linux


    For IBM, this is all about customer choice and application enabling. IBM is involved
    in all stages of the Linux phenomenon; contributing code and skills to Linux development
    itself; delivering Linux-ready platforms in conjunction with established Linux
    distributors; porting IBM''s industry-leading middleware to Linux; providing open-access
    Linux developer resources; helping customers and business partners implement Linux
    solutions; and providing support through IBM Multivendor Software Support contracts.


    ## 1.2.1 Linux as a server


    Every IBM Server platform has Linux as an option, or as an alternative to the
    native operating system, or as a co-resident application environment. IBM provides
    a wide range of choices for Linux application deployment in the industry. However,
    this does not mean IBM expects all applications to be Linux-based-and-,, indeed,
    new, new offerings, such as the 64-bit z/OS successor to OS/390, demonstrate that
    IBM will continue to invest in other environments and enable our customers'' critical
    applications.


    For customers who want Linux, the Intel-based xSeries provides native support.
    The xSeries now also addresses the server consolidation market, as it is possible
    to partition the x40 system in up to four hardware virtual machines and up to
    64 software virtual machines.


    The IBM pSeries provides enhanced capability to execute Linux applications using
    the Linux operating environment in native mode or in a logical partition (LPAR).
    IBM AS/400 customers who want to implement Linux capability can also take advantage
    of the Linux in LPAR support in the iSeries.


    Meanwhile, Linux for zSeries extends the capability of Linux for S/390 into the
    64-bit world and retains the unique ability to provide massively parallel implementations
    of thousands of “virtual Linux servers” all within a single enterprise server.
    This unique capability has been behind a number of significant customer projects
    among IBM’s Linux customer references.


    To complement this capability, IBM has extended its already broad portfolio of
    middleware offerings to include Linux on the server. IBM WebSphere, Lotus Domino,
    DB2 Universal Database, and Tiv provide Linux support today as a natural extension
    of their multipatform strategies and regard Linux as a Tier 1 for future developments.


    ## 1.2.2 Linux as a client


    There are still a large number of OS/2-based clients in use by IBM financial services
    customers, and, therefore, significant interest in whether IBM considers migration
    to Linux to be strategically viable. For the general-purpose, full-function (“heavy”)
    client environment, the market assessment today continues to be “not yet,” the
    increasing focus on cost containment in all areas is prompting increased interest
    in Linux in this context as companies and governments look forward.


    However, for specialized environments, such as development desktops and thin-client
    solutions, particularly in branch environments, Linux may be appropriate and provide
    an extremely cost-effective alternative. In Linux itself, there are mainstream
    offerings available, such as the Netscape (Mozilla) browser, the OpenOffice suite,
    Adobe Acrobat Reader, and so forth.


    IBM has also recently announced the WebSphere Studio Application Developer for
    Linux and our involvement in the Open Source Eclipse program to enhance the Linux
    development environment in the future. More information about the Eclipse project
    can be found at:


    http://www.eclipse.org/


    At a hardware level, IBM provides a number of Linux-ready ThinkPads, and there
    are device drivers available for many components. However, many customer environments
    include specific devices and programs for which support is not available for Linux,
    and so IBM is working directly with the OS/2 Customer Advisory Council, and individual
    OS/2 customers within the context of our branch transformation services, to investigate
    specific migration scenarios and possibilities. As a contributor to these migration
    scenarios, the Java eExtensions for Financial Services (J/XFS) code has been tested
    on Linux and can thus provide financial device access to Java applications running
    in a Linux environment, just as J/XFS does today on OS/2.


    ## 1.3 Linux in a business environment


    In this section, we describe some of the roles Linux plays in businesses today
    and address some of the benefits, as well as issues, related to Linux.


    ### 1.3.1 Business use


    Within corporations, Linux has made significant inroads within the IT infrastructure.
    Companies have reported considerable success deploying Linux as front-end application
    servers in numerous infrastructure environments, such as caching, VPN networking,
    DNS, and proxy, as well as Web server environments. Linux is being implemented
    in numerous replicated deployments, such as in-store controllers, kiosks, rental
    and reservation systems, and thin-client access to databases. Other applications
    are in technical and scientific computing clusters, digital entertainment, and
    special effects.


    At first, Linux was used to turn older systems with minimum resources into inexpensive
    Web servers, domain name servers, or e-mail servers. As such, Linux has become
    a popular development and production platform for many Internet service providers
    and Web-hosting providers. Linux brings the cost of traditionally high-end business
    computing to the reach of many smaller organizations. Because of its lower initial
    costs, as well as its reputation as a stable operating environment, Linux has
    been used extensively for implementing server farms and other installations requiring
    a large number of server machines where ease and ease of deployment, as well as
    availability, are important.


    With the porting of IBM middleware, such as DB2, WebSphere, Lotus Domino, and
    Tivoli management products, to Linux, many businesses are starting to deploy Linux-based
    systems as application servers, as well as Web servers.


    ### 1.3.2 Benefits and risks


    Benefits and risks are one of the most important topics to be analyzed when developing
    a new solution or considering a change to your current environment. In the next
    sections, we discuss some of the benefits and risks related to Linux.


    #### Open source development


    Because developers have access to the Linux source, changes can be made to operating
    system code to meet the needs of individual applications. With a proprietary operating
    system, users are dependent on the vendor to make it needed change. If enough
    customers request the change to make it profitable, the vendor may refuse to do
    it. If the vendor agrees to make the change, they may charge for the change or
    decide not to support it later, or.

    '
