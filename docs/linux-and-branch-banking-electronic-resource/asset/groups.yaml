  mdcn: "\n\n# 分解模式 (Decomposition pattern)\n\n在本节中，我们描述了分解（Decomposition）应用模式和运行时模式。\n\
    \n## 应用模式\n\n图 5-13 展示了分解应用模式。\n\n![](img/f3b72f8072d00d967972ff147667688f_116_0.png)\n\
    \n图 5-13分解应用模式\n\n分解应用模式扩展了路由（Router）模式，以处理更复杂的请求。与路由模式一样，该模式可以处理来自多个通道的请求。它超越路由模式之处在于能够将来自通道的请求分解为针对后端应用程序的多个请求，然后将每个后端应用程序的响应汇合成单个响应返回给原始请求者。\n\
    \n该模式基于路由的“中心-星型”架构（hub and spoke architecture），并通过添加用于分解和重组请求及响应的智能性对其进行扩展。一个客户端向多个独立的企业应用程序发送多个请求（称为“扇出”，fan\
    \ out），每个单独的结果被汇聚到一个单一响应中返回给客户端（称为“扇入”，fan in）。可以使用本地进行中数据库（work-in-progress database）来存储表示当前状态以及组装返回通道的最终响应所需的中间结果，以及转换和路由业务规则。虽然入站消息的分解（扇出）需要集成服务器具备智能，但该模式更具挑战性的方面是收集、关联和组装各个响应（扇入）。\n\
    \n## 运行时模式\n\n与路由模式类似，可以使用几种运行时模式来实现分解应用模式。第 104 页的图 5-15 表示了基于消息代理程序（message\
    \ broker）的常用方法。\n\n![](img/f3b72f8072d00d967972ff147667688f_117_0.png)\n\n第 103\
    \ 页的表 5-5 总结了该模式的关键特征和技术组件。\n\n## 表 5-5 模式总结：分解\n\n| 关键特征 | 常用技术组件（基于消息代理程序） |\n\
    | :--- | :--- |\n| - 通过多个通道提供应用程序服务；转向中心-星型拓扑结构，为任何通道提供后端应用程序服务，而无需通道知道后端应用程序的位置或消息格式细节。\
    \ - 从通道到适当系统的智能请求路由。 - 请求和响应的消息转换。 - 会话汇聚：路由器维护一组与后端应用程序通信的精简会话，而不是由每个通道维护自己的一套会话。\
    \ - 执行基于通道和角色的安全策略。 - 消除每个通道对后端应用程序系统支持专用点对点连接的需求。 | - Linux 服务器 - WebSphere Edge\
    \ Server（可选） - Linux IBM Developer Kit - WebSphere Application Server AE - DB2\
    \ UDB EE - IBM HTTP Server - 用于电子商务业务的 IBM Access Manager - MQ8 支持包（MQ JMS 类）\
    \ - WebSphere MQ - WebSphere MQ Integrator - I7Z MIkers Aggregator 插件（支持扇出和扇入）\
    \ - Java 的 WebSphere MQ 类 - WebSphere Application Server EE |\n\n## 代理模式 (Agent\
    \ pattern)\n\n在本节中，我们描述了代理（Agent）应用模式和运行时模式。\n\n## 应用模式\n\n图 5-15 展示了代理模式。\n\n\
    ![](img/f3b72f8072d00d967972ff147667688f_119_0.png)\n\n图 5-15代理应用模式\n\n该应用模式扩展了路由和分解模式。它提供了一个统一的、以客户为中心的视图，可用于服务的市场化定制和交叉销售。代理模式智能地利用进行中的缓存数据，根据对数据的分析将内容推送到用户。\n\
    \n代理模式的一种变体是使用业务数据存储（ODS），而不是依赖单个请求来返回所需数据。\n\n示例：\n\n- 具有针对性营销的电子商务网站\n- 呼叫中心代表收到交叉销售脚本提示\n\
    - 进行中数据库在提交更改之前持有长时间运行的事务数据（例如暂留直到提交的贷款申请）\n\n![](img/f3b72f8072d00d967972ff147667688f_120_0.png)\n\
    \n图 5-16代理运行时模式\n\n可以部署在 Linux 上的产品：\n\n- 基础产品请参阅“独立单通道”\n- 用于多平台的 WebSphere Personalization\
    \ Server 6.0\n- WebSphere Personalization Server 3.5\n- 用于多平台的 WebSphere Extended\
    \ Personalization Offering 4.0 (WAS, WSAD, WS, WS Site Analyzer)\n\n## 5.4.4 金融服务行业的客户忠诚度\n\
    \n许多金融机构对客户忠诚度倡议的高度、全企业关注指向了一个新兴的事实：最终目标是留住并增长一个满意的客户群。这说起来做起来难，尤其是当你有处理单个业务问题的独立应用程序和系统时。考虑到客户现在的期望比以往任何时候都多，选择也比多，挑战变得更加严峻。容错空间很小。\n\
    \n通过将所有数据集成到单一视图中，可以将数据转换为可访问的信息，以便在任何通道上提供一致的、定制化的服务。客户分析确定客户对组织的预期生命价值，从而可以匹配相应的服务水平。\n\
    \n![](img/f3b72f8072d00d967972ff147667688f_121_0.png)\n\n图 5-17客户忠诚度架构\n\n![](img/f3b72f8072d00d967972ff147667688f_122_0.png)\n\
    \n图 5-18客户忠诚度模式\n\n客户忠诚度的模式如表 5-6 所示。\n\n表 5-6 客户忠诚度模式\n\n| 模式 | 应用模式 |\n| :---\
    \ | :--- |\n| 信息聚合 | 数据挖掘 |\n| 信息聚合 | 人口 - 多步 |\n| 信息聚合 | 信息访问 - 只读 |\n| 信息聚合\
    \ | 挖掘/分析 |\n| 协作 | 存储和检索 |\n| 应用集成 | 管理过程 |\n| 应用集成 | 代理 |\n| 应用集成 | ODS |\n\
    | 访问集成 | 单点登录和基于角色的访问 |\n\n| 模式 | 应用模式 |\n| :--- | --- |\n| 访问集成 | 个性化交付 |\n|\
    \ 访问集成 | 泛在设备访问 |\n| 客户门户复合模式 | |\n| 员工门户复合模式 | |\n| 账户访问复合模式 | |\n\n## 客户忠诚度中的业务流程\n\
    \n以下描述了业务流程：\n\n- 跨行业流程：\n    - 客户销售分析\n    - 多渠道营销\n    - 产品销售分析\n    - 客户忠诚度分析（获取、留存）\n\
    \    - 订单输入服务\n    - 订单输入管理\n    - 客户生命周期\n- 金融行业流程：\n    - 保险理赔\n    - 理赔查询\n\
    \    - 首次损失报案\n    - 保单报价（订单输入服务的专门化）\n    - 添加账单支付\n- 解决方案特定流程：\n    - 实时营销管理\n\
    \n## 5.4.5 复合模式：电子银行 (e-Bank)\n\n在万维网出现不到十年后，电子商务正在从根本上重塑零售金融服务。特别是在线交易的快速增长已经表明电子商务如何降低价格、增加便利性并增加价值，为理解这种新介质的企业快速建立市场份额。\n\
    \n现在为基于互联网的零售服务的快速扩张做好了准备。在未来几年内，随着在线个人财务提供商竞争的加速， 预计电子商务将指数级增长，推动在线贷款、账单支付和投资服务的需求。\n\
    \n"
