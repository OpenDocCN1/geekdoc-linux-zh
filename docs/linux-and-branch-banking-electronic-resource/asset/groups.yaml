    - 为有零售银行需求的现有客户提供柜员交易服务。\n\n## 支行审计员\n\n支行审计员审查所有内部流程、文件、纸质和数字。支行审计员通常不向任何当地管理层汇报，以确保审查和发现的客观性。\n\
