    Having this overview of a branch-focused system in mind, we need to draw the whole
    picture and allow all other channels to participate in the end-to-end architecture.


    Let''s focus a little more on the specific functions we need to support all business
    requirements and all patterns we found earlier. The more complete infrastructure
