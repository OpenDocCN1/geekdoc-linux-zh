    # Decomposition pattern


    In this section, we describe the Decomposition application and runtime patterns.


    # Application pattern


    Figure 5-13 illustrates the Decomposition application pattern.


    ![](img/f3b72f8072d00d967972ff147667688f_116_0.png)


    Figure 5-13 Decomposition application pattern


    The Decomposition application pattern extends the Router pattern to enable processing
    of more sophisticated requests. As with the Router pattern, this pattern can handle
    requests from multiple channels. It goes beyond the Router by being able to break
    down a request from channel into multiple requests to back-end applications, and
    then assembles each back-end application response into a single response back
    to the original requester.


    This pattern is based on the Router''s hub and spoke architecture and extends
    it by adding intelligence to decompose then recompose requests and responses.
    One client requests multiple requests to individual enterprise applications (referred
    to as fan out), and each of the individual results are collected into a single
    response back to the client (referred to as fan in). A local work-in-progress
    database may be used to hold intermediate results that are needed to represent
    present state and to assemble the final response back to the channel, as well
    as transformation and routing business rules. Although the decomposition of an
    inbound message (fan out) requires intelligence in the integration server, an
    even more challenging aspect of this pattern is the need to collect, correlate,
    and assemble the individual responses (fan in).'
  - '[PAGE 117]


    An important benefit of this pattern is that a consistent consolidated customer
    view becomes available through any of multiple channels. Without the capabilities
    of this pattern, each channel would need the intelligence to know which back-end
    applications provide specific information and services. The Decomposition pattern
    concentrates this intelligence in the interrogation node, which greatly simplifies
    the design of individual channels.


    # Runtime pattern


    Similar to the Router pattern, several Runtime patterns could be used to implement
    the Decomposition application pattern. Figure 5-15 on page 104 represents a commonly
    used approach based on the use of a message broker.


    ![](img/f3b72f8072d00d967972ff147667688f_117_0.png)


    Table 5-5 on page 103 summarizes this pattern''s key characteristics and technology
    components.'
