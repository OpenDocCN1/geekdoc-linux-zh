    view could deallow for the possibility of deploying both application and integration
    services on a single physical server.


    The former, literal approach emphasizes hub and spoke integration services that
    are made available to a wide range of applications. This explicit tiering is optimized
    for loose coupling between application services and for providing a generalized
    set of enterprise-wide integration services. A physical hub and spoke configuration
    also maximizes the session concentration characteristics of the Decomposition
    Runtime pattern, typically reducing the total number of connections that need
    to be established with other existing applications. Figure 5-21 on page 114 is
