    ## 6.1.3 文件和打印服务


    分支机构几乎总是需要某种程度的本地文件和打印共享。同样，在该领域有许多基于 Linux 的产品。在本节中，我们将描述一些流行的解决方案。


    ## Samba


    Samba 是一个非常受欢迎的开源服务器软件包，Linux 系统可以通过它提供文件和打印服务（也称为共享）。Samba 实现了服务器消息块 (SMB) 协议，这是一种由
    IBM 在 1984 年开发的复杂协议，为 Windows、OS/2 和 Linux 桌面系统提供文件和打印服务。某些应用组件在特定的应用设计模型下会使用此类类型的服务。


    全球有许多人员每天在生产环境中使用 Samba。这可能是因为 Samba 的开源性质、它随 Linux 发行版一起分发的事，以及 Samba 团队努力提供一种可以在其他基于
    Windows 的环境中无缝运行的产品。


    有关 SAMBA 的更多信息，请参阅：


    ```

    http://www.samba.org

    ```


    ## IBM Tivoli Storage Manager


    IBM Tivoli Storage Manager 通过在离线存储上存储数据的备份和存档副本，保护您的数据不受硬件故障和其他错误的影响。它可以扩展到保护从大型机到笔记本电脑的各种硬件上的数百台计算机。它们可以通过互联网、广域网
    (WAN) 和局域网 (LAN) 连接。Tivoli Storage Manager 的集中化 Web 端管理、智能数据移动和存储技术，以及全面的基于策略的自动化，共同努力降低数据保护管理成本以及对计算机和网络的影响。可选模块允许必须
    24x365 运行的关键业务应用程序利用 Tivoli Storage Manager 的集中化数据保护，而不会中断其服务。


    ## IBM Linux Technology Center Omni 驱动


    Omni 打印机驱动程序使用 Ghostscript 框架支持 400 多种打印机。此外，它提供了一种动态加载打印机驱动、通过编辑设备描述文件创建新设备的模型，并通过允许之前的设备驱动程序功能进行子类化简化简化新打印机驱动程序的开发。


    ## 6.1.4 存储转发


    存储转发服务支持由于没有后端连接（可能是由于意外中断）而无法在线处理的操作，同时也支持批处理操作。


    通常，存储转发服务构建在应用程序或应用框架中，而不是作为一个独立产品。后续章节描述的产品可以支持需要存储转发能力的应用程序。


    ## IBM WebSphere Business Components Composer (WSBCC)


    WebSphere Business Components Composer 是零售银行行业多渠道和分支机构转型解决方案的战略元素。对于希望作为提高运营效率和盈利能力的更大计划的一部分来更新零售交付渠道的金融机构来说，它带来了高价值。通过使金融机构能够构建并部署在所有零售交付渠道中提供一致、灵活的业务逻辑和客户服务的架构，该产品增强了银行理解和满足独特客户需求的能力。


    WSBCC 提供了一套专为这类零售银行应用设计的组件。通过使用 WebSphere Business Components Composer 经过验证的基于组件的中间件框架，零售银行可以构建集成应用程序，以支持多个客户渠道和分支机构转型工作。


    ## IBM Bank Teller Business Components


    IBM WebSphere 分支机构转型解决方案由 IBM Bank Teller Business Components 实现。这些组件提供了灵活性和适应性，可以根据一组经过验证和高性能的组件实现基于
    Java 的柜员系统。这些组件提供了一个环境，允许客户能够快速构建和部署柜员交易，且这种方式支持跨渠道的交易重用。全球多家金融机构已实施该 WebSphere
    分支机构转型解决方案，为在企业范围内利用 WebSphere 能力奠定了坚实的基础。


    ## IBM Local Area Network Distributed Platform (LANDP)


    LANDP 主要为零售银行设计和开发。它是一个经过测试的解决方案，被全球大量客户（包括世界上最大的银行）使用。LANDP 包括以下内容：


    - 客户端/服务器环境：支持运行 Linux、Windows、OS/2 和 DOS 组合的多平台网络，通过 NetBios 或 TCP/IP 进行通信。

    - 通信服务器：支持运行主机应用程序的各种通信链路链路和协议。

    - 数据管理服务器：支持 LANDP 子组中数据的存储、检索和更新。

    - 具有多种访问模式的数据库服务器、共享文件服务器、电子日记和存储转发服务器，涵盖了广泛的数据管理需求。

    - 金融设备服务器：LANDP 可用于访问和共享金融设备。

    - 通用编程接口 (API)：用于为 LANDP 环境开发应用程序。子组中的服务位置由 LANDP 管理。这意味着当你开发应用程序时，不需要知道支持服务的服务器位于何处。

    - 迁移支持：LANDP 的跨平台能力使应用程序和服务能够轻松地迁移到许多不同的平台。


    ## 6.1.5 数据库服务


    某些应用模型目前在分支机构使用数据库来存放离线模式所需的数据。例如，某些电子日记的实现可能会使用数据库。此外，在离线需求有限的更集中化应用模型中，可能不需要分支数据库服务。


    ## Red Hat Database


    Red Hat Database 是经过针对 Red Hat Linux Advanced Server 和 Red Hat Linux 测试和验证的开源数据库。它由增强版本的
    PostgreSQL 驱动，其 ISO 镜像可以从 Red Hat 下载中心免费下载，地址为：


    ```

    http://www.redhat.com/apps/download/

    ```


    ## MySQL


    MySQL 是世界上最流行的开源数据库系统之一，为任务关键、重负载使用场景下的速度、力量和精度而设计。


    你可以从 MySQL 网站下载来自 MySQL AB 的软件遵循 GPL 许可协议，并“按现状”提供，不作任何保证：


    http://www.mysql.com


    ## PostgreSQL


    PostgreSQL 是一个复杂的对象关系数据库管理系统，基于在加州大学伯克利分校计算机科学系开发的 POSTRES，支持几乎所有的 SQL 结构，包括子查询、事务以及自定义类型和函数。它是随处可获得的最先进的开源数据库。也提供商业支持。


    ## IBM DB2 for Linux


    DB2 for Linux 的优势非常简单：以市场上任何其他适用于电子商务的 Linux 数据库更低的成本获得纯粹的力量。通过 DB2，你可以在企业范围内跨所有主要平台访问、管理和分析所有信息。随着
    Linux 成为数据库和应用程序服务器的主要平台，DB2 for Linux 为你提供了一个健壮、易于管理的数据库，与 Linux 的稳定性和可靠性形成互补。


    DB2 for Linux 支持并拥抱开放标准（包括 Java 和 XML），并与许多开源产品（如 Apache、PHP、Perl 和 Python）集成。DB2
    UDB 是目前生产环境中扩展性最好的数据库，可以在单台 PC、SMP、集群以及 Linux 主机上管理任务关键数据。


    ## IBM Informix Dynamic Server


    IBM Informix Dynamic Server (IDS) 提供了任务关键可用性、可靠性、可扩展性和数据密集型事务管理能力，越来越多的机构依靠这些能力在电子商务中取得成功。它还提供了世界领先的可扩展功能。


    由于业务逻辑可以嵌入数据库中并完全集成到 IBM Informix 可扩展架构 (DSA)，IDS 可以解决极少数系统能够解决的问题。它还可以通过领先的分布式数据库和虚拟表功能，统一访问客户信息，无论这些信息位于何处，从而允许查询涵盖从平面文件到其他
    IDS 和非 IDS 数据库的广泛范围。


    '
