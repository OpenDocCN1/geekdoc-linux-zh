    ![](img/f3b72f8072d00d967972ff147667688f_104_0.png)


    图 5-5 独立单通道应用模式


    该模式典型地体现了表示层服务与应用服务的分离。在电子商务背景下，这通常通过在客户端上极稀疏地使用表示逻辑来实现。


    对于那些需要通过新访问通道交付应用服务、且面临紧迫的上市时间压力的情况，该应用程序是实现新服务最快的方法之一。该模式的关键特征之一是它不依赖于与其他系统的集成，这消除了集成新系统时最具挑战性的方面之一。这也意味着应用服务可以根据银行的具体需求，部署在分支机构、区域级或企业层级的服务器上。


    在银行转型的背景下，该模式可以用于将目前只能在具有特定操作系统配置的强类型客户端桌面运行的单体应用迁移到轻客户端、以服务器为核心的架构。这不仅减少了对高性能桌面硬件的需求，还可以将应用程序的范围扩展到任何具有标准互联网浏览器能力的设备。该模式可以通过多种方式实现，取决于所考虑的应用程序类型。


    对于独立运行的应用（如桌面生产力应用，例如文字处理器），可以使用 Citrix Wireframe 或 Connectix VirtualServer 等技术将应用程序托管在中央服务器上。在这种情况下，运行在服务器上而不是桌面上。应用程序用户界面的表示通过轻客户端组件处理，该组件对其运行环境的依赖比应用程序本身低得多，从而将应用程序的范围扩展到更广泛的设备和用户。这种方法也适用于具有厚客户端组件的客户端/服务器应用程序，并且这些应用没有时间或兴趣将应用程序迁移到多层基于电子商务的架构。


    对于有兴趣迁移到多层、基于电子商务的架构的传统二层应用程序，独立单通道应用模式提供了一个选项。只要应用程序不需要与其他应用程序集成，就可以使用该模式。


    使用这种方法可以带来多处收益。首先，可以使用基于模型-视图-控制器（MVC）的应用程序框架对应用程序进行重新架构设计。通过将这种关注点分离应用于应用程序架构，应用程序不仅可以移动到电子商务环境中，使其立即通过额外的设备通道变得可用，而且更重要的是，底层的应用服务可以通过更通用的接口提供，这为应用程序未来更广泛的重用和更易的集成奠定了基础。


    # 运行时模式


    图 5-6 阐了独立单通道运行时模式。


    ![](img/f3b72f8072d00d967972ff147667688f_105_0.png)


    图 5-6 独立单通道运行时模式


    客户端节点的表示服务可以通过 JavaScript、Java Applet 或仅限 HTML 实现。在服务器端，可以使用 JSP 来封装任何其他与动态表示相关的逻辑。解释来自浏览请求并将请求委托给业务模型层和业务逻辑组件的应用逻辑存储在单独组件中，例如
    servlets、Java 类或 JavaBeans（在其他更复杂的模式中，可以使用 Enterprise JavaBeans，以及应用集成技术）。


    第 90 页图 5-6 所示的这种运行时模式（Runtime pattern）可以作为实现这种方法的基础，并展示了如何在 Linux 服务器平台上实现此种应用模式（Application
    pattern）。该模式被认为是新兴的，因为某些产品最近才在 Linux 平台上可用，尚未像在其他平台上那样被广泛使用。


    表 5-1 模式总结：独立单通道


    | 关键特征 | |

    | :--- | :--- |

    | | > 一时单通道<br> 不与其他应用程序集成 |

    | 常用技术组件 | > Linux 服务器<br> WebSphere Edge Server<br> IBM Developer Kit for Linux<br>
    WebSphere Application Server AE<br> DB2 UDB EE<br> IBM HTTP Server<br> IBM Access
    Manager for e-business |


    # 直接集成单通道模式


    在本节中，我们描述了直接集成单通道应用模式和运行时模式。


    # 应用模式


    第 92 页图 5-7 阐述了直接集成单通道应用模式。


    ![](img/f3b72f8072d00d967972ff147667688f_107_0.png)


    图 5-7 直接集成单通道模式


    该应用模式扩展了独立单通道模式，为能够与一个或多个后端应用程序（或数据，或两者）建立点对点连接的应用程序提供了一种方法。作为单通道模式，它可以用于实现任何一种交付通道。


    该模式的简单性通过将模式的范围限制在单个通道和相对简单的集成技术来实现。虽然这使得该模式比其他某些模式更容易实现，但权衡是它具有局限性，不是多通道解决方案（参见第
    98 页的路由器模式、第 101 页的分解模式以及第 104 页的代理模式），并且通常不会与多个企业级进行交互（参见第 101 页的分解模式和第 104 页的代理模式）。取决于后端遗留应用程序的能力，可能需要对其进行修改（注意有一个后端应用程序节点代表未修改的应用程序，另一个节点代表需要修改以支持集成的应用程序）。


    # 运行时模式


    图 5-8 阐述了直接集成单通道运行时模式。


    ![](img/f3b72f8072d00d967972ff147667688f_108_0.png)


    该模式通过添加连接器组件，实现了电子商务应用程序与既有遗留应用程序之间的集成。这些连接器是点对点的，这意味着电子商务与遗留应用程序之间的请求和响应对话不通过任何中间的动态路由或转换节点，从而使架构变得不那么复杂。虽然此模式中没有显式显示负载均衡节点，但可以轻松添加（参见第
    90 页图 5-6）。


    表 5-2 总结了该模式的关键特征和技术组件。


    | 表 5-2 模式总结：直接集成单通道 |

    | :--- | :--- |

    | 关键特征 | 单通道，与单个应用程序进行点对点集成 |

    | 常用技术组件 | Linux 服务器, WebSphere Edge Server, IBM Developer Kit for Linux, WebSphere
    Application Server AE, IBM HTTP Server, IBM Access Manager for e-business, DB2
    Connect Enterprise Edition for Linux, eNetworks Communications Server, CICS Transaction
    Gateway, IMS Connector for Java (runtime classes) |


