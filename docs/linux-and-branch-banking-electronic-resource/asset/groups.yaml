    **图 2-7** 组件图


    ### 2.6.2 组件定义


    基于图 2-7 所示的组件图，本节提供了这些各种组件的简要描述。


    ### 桌面组件


    桌面组件是在概念或宏观层面定义的的，而不是在微观或详细设计层面。提供了足够的细节，以便为“瘦型”与“胖”应用程序设计模型提供可能的权衡。


    ### 网络服务


    网络服务允许桌面应用程序与其他系统和外部组件通信。本地局域网和外部通信均通过操作系统的 TCP/IP 服务，并在需要时辅以本地局域网服务。通信可以通过应用程序模型指定的
    HTTP 或 TCP/IP 协议。此外，可以使用插件（如 IBM WebSphere Host On-Demand）或胖应用程序（如 IBM Personal
    Communications）来访问传统的 3270 类型应用程序。


    ### 显示服务


    对于此客户端解决方案，显示服务可以被视为 Web 浏览器。Web 浏览器将通过 HTTP 接收到的 HTML 编码页面转换为面向用户的表单。传统胖客户端实现中的显示服务具有更强大的功能，并允许更丰富的用户界面。虽然可以使用激进的、键盘驱动且带有详细字段编辑的传统应用程序来构建应用（这些应用在瘦客户端上实现较困难），但
    Java Applet 可以提供所需的功能。


    ### 外围支持


    可以使用各种专用设备来为系统提供输入或从系统获取输出。例如，银行在分行执行交易时，可以使用 ATM 卡和个人密码 (PIN) 来识别用户。磁条读卡器 (MSR)
    可读取 ATM 卡，数字键盘可供客户安全地输入密码。此外，银行可以通过收据打印机或存折打印机为客户提供交易记录。这些设备随后成为分行系统不可或缺的一部分。对这些专用外围设备的支持在很大程度上取决于所使用的应用程序开发模型。在所谓的胖应用程序中，应用程序使用设备
    API 与原生操作系统设备建立接口。在应用程序中，可以使用 Java 配合标准（如金融服务 Java 扩展 J/XFS）。关于 JFS 的更多信息可以在此处找到：


    ```

    http://www.jxs.com/

    ```


    ### 用户管理与安全


    分行人员（柜员和平台官员）对分行银行系统的使用是由用户身份验证和角色识别控制的。该组件在确定应用程序功能流方面提供功能性角色，但在出于安全目的控制系统访问方面起着更重要的非功能性作用。它还提供了一组权限和限制，据此做出执行决策。部署在桌面上的用户管理部分通常很小，在许多情况下是完全中心化的。当与中心站通信丢失时，用户管理的可用性可能会使企业安全管理复杂。


    ### 柜员功能


    许多现有的柜员应用程序可以在胖客户端上运行，并根据操作配置通过 TCP/IP 或 SNA 协议与后端和中间层系统通信。或者，可以使用瘦客户端或浏览器范式编写新的应用程序。柜员应用程序的元素包括：


    - 客户信息：根据某项数据（如关系编号）从客户信息文件中调取数据。这些信息包括地址、电话号码以及客户的账户列表，可以在客户服务期间使用。

    - 账户信息：这些信息包括账户的详情，例如当前余额和交易历史。

    - 财务交易：改变账户财务状态的交易（存款、取款、现金检查等）。

    - 电子日记：柜员执行的所有交易的日志。日记可能存储在客户端机器、分行服务器或区域服务器上。在完全中心化的系统中，它可能由使用柜员 ID 作为键的数据库查询组成。在需要离线处理的系统中，它可能还提供本地存储交易并在连接恢复后将其转发到中间层或后端组件的能力。


    ### 平台功能


    平台功能涉及为客户提供其现有的账户或服务、展示客户可能购买的金融服务选择，以及实际填写申请或开设新账户。平台用户需要柜员使用的功能（如客户信息和账户信息），还需要用于跟踪客户互动、进行销售演示和填写表单的丰富功能。所有这些功能更多是基于展示而非交易驱动的，因此非常适合使用鼠标而非键盘导航的客户端应用程序。客户互动更加随意和具有对话性，让平台人员有更多时间吸收系统提供的信息。尽管过去广泛使用了在浏览器中使用下拉列表和预填充的丰富
    GUI 驱动应用程序，但在时间要求不紧迫的环境中，使用类似的体验也可以同样直观且有效。

