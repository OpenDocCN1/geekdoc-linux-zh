    ## IBM WebSphere MQSeries


    WebSphere MQ 通过帮助业务应用程序通过发送和接收数据消息来跨平台交换信息，来实现应用程序集成。它们负责处理网络接口、确保消息的仅一次交付、处理通信协议、在可用资源之间动态分配负载、处理系统问题后的恢复，并帮助程序的可移植性。


    MQ 适配器允许数据在 MQ 消息和应用程序之间传递。数据可以发送到任何支持的平台，或从任何平台接收。MQ 提供了一个单一的跨平台应用程序编程接口。一个关键因素是时间无关的处理。这意味着即使某个接收者临时不可用，消息也会可靠地存储以供以后交付。


    ## IBM WebSphere Edge Server


    WebSphere Edge Server 在集中式管理和应用程序控制下，将应用程序处理分布到网络边缘。它包括：


    - 应用程序卸载：减轻服务组合内容的负担。

    - 内容分发：将 Web 内容部署到整个网络中的缓存和重托管服务器上。

    - 缓存：通过作为正向、反向或透明代理卸载后端服务器和对等节点，提高响应时间。缓存并失效由 WebSphere Application Server 生成的动态内容，包括
    JavaServer Pages (JSPs) 组件和 servlets。

    - 负载均衡：通过网络地址转换 (NAT)、网络地址端口转换 (NAPT)、代理和内核级基于内容的路由 (CBR) 等功能实现。它可以改进服务器选择、负载优化和容错能力。

    - 安全：可以使用 Tivoli Access Manager 进行集中化管理。当 Edge Server 的缓存代理配置为使用 Tivoli Access
    Manager 插件时，Access Manager 授权引擎确保只有授权用户才能访问缓存和非缓存资源。这种集成解决方案确保了对网络边缘的控制。


    ## IBM Directory Integrator


    IBM Directory Integrator 是一种集成开发和部署工具，帮助客户快速有效地集成特定于应用程序的目录，以提供一致的企业级目录信息视图。


    通过内置的连接器、用于扩展或修改这些连接器的开放架构 Java 环境，以及在处理数据时对数据应用逻辑的工具，IBM Directory Integrator
    可以通过以下方式帮助您：


    - 在应用程序或目录源之间同步和交换信息。

    - 在各种数据存储库中管理数据。

    - 提供一致的目录基础设施，可用于从安全、配置到 Web 服务等各种应用程序。

    - 为传统用户身份和密码之外的应用程序提供额外的目录信息（如产品和定价数据）的一致视图。


    ## 6.1.2 用户管理与安全


    由于大多数分支机构在与中心站的链路不可用时需要本地处理，因此需要能够在分支机构强制执行某种程度的用户管理。本节描述了该领域的某些功能。


    ## Samba


    Samba 为 UNIX 客户端和服务器提供 Windows Internet File System (CIFS) 和 SMB 功能，并可以配置为分支机构提供类似
    Windows NT 的主域控制器。


    它基于 Server Message Block (SMB) 和通用互联网文件系统 (CIFS) 常用客户端/服务器协议。使用同样支持 SMB/CIFS 的客户端软件（例如
    Windows 和 OS/2 产品），终端用户向另一台计算机上的 Samba 服务器发送一系列客户端请求，以便打开该计算机的文件、访问共享打印机或访问其他资源。另一台计算机上的
    Samba 服务器会响应每个客户端请求，授予或拒绝对其共享文件和资源的访问。


    ## 可插拔认证模块 (PAM)


    可插拔认证模块（PAM）允许系统管理员为感知 PAM 的应用程序设置认证策略，而无需重新编译认证程序。PAM 通过利用可插拔模块化架构来实现。可以开发 PAM
    模块以根据集中式数据库验证用户。


    当正确使用时，PAM 为系统管理员提供了许多优势，如下：


    - 一个可以用于各种应用程序的通用认证方案。

    - 可以在各种应用程序中实现 PAM，而无需为了专门支持 PAM 而重新编译应用程序。

    - 为管理员和应用程序开发者提供了极大的认证灵活性和控制。

    - 应用程序开发者无需为了使用特定的认证方案而开发其程序。相反，他们可以完全关注程序的细节。


    ## Kerberos


    Kerberos 是一种用于验证计算机网络中服务请求的安全方法。Kerberos 允许用户从认证过程中请求加密票据，然后可以使用该票据向服务器请求特定服务。用户的密码不需要通过网络传输。


    ## Snort


    Snort 是一种轻量级网络入侵检测系统，能够在 IP 网络上执行实时流量分析和数据包记录。它可以执行协议分析、内容搜索和匹配，并用于检测各种攻击和探测，例如缓冲区溢出、隐蔽端口扫描、通用网接口
    (CGI) 攻击、Server Message Block 协议 (SMB) 探测、操作系统 (OS) 指纹识别等。Snort 使用灵活的基于规则的语言来描述它应该收集或通过模块化检测引擎。Snort
    具有实时告警能力，具有针对 syslog、指定文件、UNIX 套接字或使用 Sambaclient 向 Windows 客户端发送弹出消息的告警机制。


    ## 轻量级目录访问协议 (LDAP)


    LDAP 是一种提出的通过网络访问全局或本地目录服务的标准。LDAP 非常有用，因为它被设计用于支持跨整个网络 LDAP 服务器的传播，类似于域名系统服务
    (DNS)。DNS 帮助根据域名或从域中请求的服务类型将计算机相互连接。没有 DNS 服务器器，主机名将无法转换为 TCP/IP 通信所需的 IP 地址。在未来，LDAP
    可以为许多类型的目录信息提供类似的全局访问。目前，LDAP 更多用于银行等单一大型组织内部的目录服务。


    LDAP 是一个客户端/服务器系统，LDAP 客户端连接到 LDAP 服务器并查询信息，或提供需要输入目录的信息。根据用户的权限，服务器将回答查询、将查询引用到另一个
    LDAP 服务器或接收信息并整合到目录中。


    ## IBM Directory Server


    IBM Directory Server 提供了一个强大的轻量级目录访问协议身份基础架构，它是部署全面的身份管理应用程序和高级软件架构（如 Web 服务）的基础。


    IBM Directory Server 以及新的目录和元目录服务提供了对于需要部署 Web 服务和用户配置的公司至关的能力。目录是用于存储和检索用户、资源和其他关键网络信息的数据库。元目录服务聚合了可能存储在多个软件供应商提供并运行在各种操作系统上的目录或数据库中的目录信息。


    ## IBM Tivoli Access Manager电子商务


    IBM Tivoli Access Manager 是一种用于电子商务和企业应用程序的基于策略的访问控制解决方案。它独特地解决了电子商务安全挑战，使新的和快速扩展的电子商务计划能够触及新的市场和客户。它还解决了增长和复杂性、不断增加的管理成本，并直接应对了在广泛
    Web 和应用程序资源上实施安全策略的困难。Tivoli Access Manager for e-business 通过减少新电子商务应用程序的部署时间和成本来帮助公司。


    Tivoli Access Manager for e-business 控制对应用程序和数据的线及无线访问，为授权用户提供单点登录 (SSO)。Tivoli
    Access Manager for e-business 与电子商务应用程序集成，为授权用户提供安全的个性化电子商务体验。Tivoli Access Manager
    包含了针对关键客户关系管理 (CRM)、企业资源计划 (ERP) 和供应链管理 (SCM) 电子商务解决方案的集成安全性，以及针对运行在 WebSphere
    Application Server 上的 J2EE 规范应用程序的安全加固。Tivoli Access Manager for e-business 为合作伙伴、客户、供应商和员工提供安全访问关键业务应用程序和数据，以实现高可用和可扩展的交易。


    '
