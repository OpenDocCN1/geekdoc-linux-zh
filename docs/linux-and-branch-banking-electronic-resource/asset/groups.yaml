    # Linux 简介


    本章介绍了 Linux 并讨论了它作为服务器和客户端的适用性。


    ## 1.1 什么是 Linux


    Linux 是一个类 Unix、符合 POSIX 标准的操作系统，根据 GNU 许可证发布，这意味着操作系统及其源代码是免费提供的。最初在 90 年代初由
    Linus Torvalds 以及全球程序员开发，Linux 支持所有主要的窗口管理器以及 FTP、Telnet 等工具。它提供了 32 位和 64 位多任务、虚拟内存、共享库和
    TCP/IP 网络。它还有一套程序开发工具，包括 C++ 编译器和调试器。


    Linux 由四个主要部分组成：内核、Shell、文件结构和工具。


    尽管已经在各种平台上实现，但通常部署在 Intel 处理器上。Linux 内核设计为使用 Intel 886 处理器的特殊保护模式。因此，Linux 利用保护模式、描述符内存管理范式。Linux
    利用分页加载执行，使得只有实际运行的程序段会被读入内存。同样，如果同时运行多个程序实例，内存中只会有一个程序代码。


    Linux 内核包含了许多专为企业设计的改进。内核内置了对称多处理器支持，且 TCP/IP 栈已重写，以增加栈性能并在多处理器系统中提供更好的扩展性。


    Linux 内核是一个单体内核，因为所有设备驱动都是内核的一部分。然而，Linux 支持可加载设备驱动，可以通过用户命令从内存中加载和卸载。内核能够启用 387-FPU
    指令，使没有数学处理器的系统也能运行需要浮点运算的程序。

