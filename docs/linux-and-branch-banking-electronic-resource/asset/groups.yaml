    On the other hand, many enterprise users would rather leave changes up to a vendor
    make the change themselves and have to share their code with the Linux open source
    community. The most oft-cited reason given by larger companies with 2000+ employees
    for not installing Linux is that the proprietary nature of the software their
    companies depend on precludes them from open source development.


    ## Vendor accountability


    Larger organizations tend to prefer proprietary products to open source software
    because they rely on vendor accountability; they require a vendor that can provide
    them with complete support coverage, from the system kernel to system configuration.
    Naturally, they are apprehensive about introducing Linux, while main support and
    accountability comes from the open source community. While these companies could
    look to Linux distribution vendors, as well as to that market Linux on their machines
    such as IBM, for support, argue that the business models these vendors have built
    around Linux are still untested and may not withstand the load. However, others
    point out that there is no guarantee that companies that build their business
    operating systems will not fail. What is guaranteed is that no matter the fate
    of the open source vendors, users still do not have to depend on any company to
    upgrade it. They can do it themselves as part of the open source community.


    ## Management costs


    Most IT departments would contend that it does not make sense to use a system
    management tool that would cost more than the systems to be managed. That is why
    many IT managers are turning to open source tools to manage Linux servers. These
    tools, such as NetSaint and Webmin, are available for free. Managers are also
    leveraging their UNIX expertise to write their administration and monitoring scripts.


    However, where Linux coexists on a network with other operating system platforms,
    managing Linux servers separately from other enterprise resources and using different
    tools to do so would actually raise the total cost of owning Linux. In these situations,
    users should look to their management solutions, such as IBM Tivoli software,
    to provide the necessary tools.


    ## Reliability, availability, scalability


    While the Linux kernel 2.4 will handle eight-way Intel systems, Linux multiprocessing
    capabilities are considerably less than that of high-end UNIX and Windows 2000
    servers. Therefore, Linux is not always the best choice for high-end applications,
    such as database installations. However, many users may find that Linux clustering
    will satisfy their availability requirements at affordable cost. Using commodity
    hardware, users can spread the workload across many smaller, less expensive systems.


    Companies that have adopted Linux clusters typically have superior in-house skills,
    with control over their own applications, and are more comfortable with the risks
    involved in building their own clusters than they are having to wait for third-party
    applications to be developed. For those without such skills, IBM offers the Linux
    IBM @server Cluster 1350 line of pre-assembled server clusters. The Linux IBM
    @server Cluster 1350 line also includes bundled applications and server-level
    software, plus integration testing and technical support services. The clusters
    can be set up with a minimum of four Intel-based servers, which can be expanded
    to more than a thousand servers. The servers can be installed and preconfigured
    with full systems administration, maintenance, and workload management software,
    along with server-level software, such as DB2 or IBM WebSphere Application Server
    and e-business software.


    ## Availability of applications


    Linux provides a complete UNIX programming environment, including all of the standard
    libraries, programming tools, compilers, and debuggers that users have to expect
    from comparable UNIX systems. Nevertheless, portent applications to the Linux
    platform by the major software vendors has been relatively slow, especially in
    terms of databases, middleware, and Windows applications. With investments in
    Linux by major computer companies, such as IBM, Oracle, and SAP, this situation
    is changing quickly. Major applications, such as IBM DB2, IBM WebSphere, Oracle
    8 and 9, and SAP mySAP.com, have been certified to run on one or more Linux platforms.


    ## Application compatibilities among distributions


    Even though more applications are being ported to Linux, there is no guarantee
    that they will run on all Linux distributions. This is because each distribution
    can have a different version of the same library, making it difficult for developers
    to know which one to use when portant their application from one Linux platform
    to another. Applications compiled to run with one version will probably not run
    under a distribution that uses a different version. What is more, an application
    that requires one version of a library can overwrite an existing library with
    a newer version that may be incompatible with existing applications that rely
    on the former. Java-based applications provide one possible solution.


    ## Costs of migrating to Linux from current environment


    Organizations that have made considerable investments in Microsoft Windows will
    have to weigh the costs of implementing Linux against any savings in licensing
    costs. These costs include not only the costs of skills and tools, but also the
    time it takes to acquire them. While UNIX shops can use the tools and skills already
    have to deploy Linux, shops that have made a significant investment in Windows
    hardware and software and developing their people''s skills to support their investment,
    such as Visual Basic development or system administrators with MCSE certification,
    may find the conversion costs difficult to justify. However, Linux is already
    popular in colleges and universities, and most of new graduates have Linux experience.


    ## 1.4 Summary


    Linux has been around for nearly a decade, and in recent years, it has captured
    the interest and recognition of businesses as a robust and viable operating environment
    for many applications.


    This chapter has provided a high-level introduction to Linux, discussed some of
    the ways businesses are utilizing Linux, and highlighted some of the considerations
    related to Linux.


    In the next chapter, we discuss the current state of branch banking and some of
    the drivers that are causing a branch bank transformation. Because the IT infrastructure
    to support branch banking may be changing significantly to support this transformation,
    Linux should be seriously considered as a cost-effective base for these new environments.


    ## Branch banking environment


    This chapter provides an overview of the current state and structure of branch
    banking environments. It discusses the business pressures and challenges currently
    facing branch banking environments. We discuss the latest trends for approaching
    those issues, both from a business and a technical perspective. We also address
    the software strategy at the application level to solve the branch banking problems
    in a broader context of a multichannel solution.


    We also cover the organizational structures of such branch banking environments,
    because any solution that is put in place must meet the functional needs of the
    individuals that operate and manage the bank branch.


    ### 2.1 The state of branch banking


    "The retail bank branch is not dead. On the contrary, there are more branches
    today and more households per branch than ever before", as stated in the TowerGroup
    article "The Retail Bank Branch of the Future" published in August 2001. In this
    same article, the TowerGroup concluded, "Bank customers prefer to use the physical
    branch to many automated channels and that, in fact, 92% of all households surveyed
    had visited a branch in the month prior to being surveyed."


    "Irrespective of the fact that the majority of U.S. consumers are now ready for
    online banking in technological terms, behaviorally they continue to be slow to
    migrate away from traditional channels like the local bank branch or call centers,"
    said Michael Weil, TowerGroup''s managing director of Primary Market Research.
    Rather than dropping existing channels, consumers use what they know while slowly
    adding new delivery channels into the mix. The move to online banking-and ultimately
    to wireless as a delivery channel for financial services-continue to evolve."


    So, what we usually see a single-channel branch banking data on the central system
    in parallel to all other channels, as seen in Figure 2-1.

