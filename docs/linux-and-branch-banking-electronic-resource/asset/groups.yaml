    ![](img/f3b72f8072d00d967972ff147667688f_110_0.png)


    **Figure 5-10** Customized Presentation to Host application pattern


    These two patterns enable browser access to applications that have a terminal-oriented
    user interface, thus extending the reach of the applications to new locations
    and lighter weight client devices. These patterns work well in situations where
    the host application needs to be left unchanged (hence the application tier node
    with the bold border).


    These two patterns represent two different solution approaches. The As-Is Host
    pattern provides the user with the original user interface design, while moving
    the terminal emulator function off of the client. The Customized Presentation
    to Host pattern can be used to provide a redesigned, more Web-like user interface,
    making it possible to simplify or streamline the user interface, and also making
    it possible to provide a more consistent user interface across a range of terminal
    oriented applications.


    In the As-Is Host pattern, an infrastructure node with no application code provides
    terminal emulation functions on a server, presented through a browser, eliminating
    the need for the client to have a terminal emulator installed or running on it.
    Moving the terminal emulation function upstream from the client provides several
    benefits:


    - The host application can be accessed from new devices, with simplified client
    node requirements. The ability to use a zero footprint client lowers the cost
    of the client node and simplifies its configuration.


    - The host application can be used at new locations, for example, where browser
    access to the enterprise network is available, but a server with a host communications
    gateway component might not be.


    Placement of the server node that hosts the terminal emulation function becomes
    an easier decision than may have been the case for the communications gateway
    needed for a thick client-based terminal emulator. The presentation tier server
    could be located at a branch, region, or central location.


    The Customized Presentation to Host pattern adds intelligence to the presentation
    tier to provide the capability to reformat host screens. The As-Is Host pattern,
    this pattern is useful when the host application is not going to (or cannot be)
    modified and will be used as is. This pattern can be used to mask the complexity
    of host applications, and it can also be used to give multiple host applications
    a common look and feel. Key benefits from using this pattern are as follows:


    - All of the benefits of the As-Is Host pattern also apply to this pattern.


    - The underlying applications can take on a look and feel that is consistent with
    other Web-based applications.


    - Multiple terminal-oriented applications that may have very different user interface
    designs can be given a consistent user interface design.


    - The improved, more consistent user interface reduces training time and cost.


    - The usability improvements can lead to increased productivity and reduced turnover.


    # Runtime pattern


    The topology for these two patterns are similar to Figure 5-8 on page 93. However,
    instead of needing all of the connection technology components highlighted in
    that topology, we would use components that simplify the transformation of host
    screen data streams. The base technology components are as follows:


    - A client that supports a Java-enabled browser: This could be a lightweight desktop
    running any operating system that supports the browser requirements.


    - A Linux server running: WebSphere Application Server.


    - The underlying implementation of the As-Is Host pattern is based on a server-hosted
    terminal emulation product: IBM WebSphere Host Publisher. (At the time of this
    writing, IBM WebSphere Host Publisher is not supported on Linux.)


    The underlying implementation of the Customized Presentation to Host uses some
    form of screen scraping mechanism to transform the screens into a more user friendly
    interface. The following off-the-shelf products are available that can significantly
    reduce the effort to implement this pattern:


    - Client Access Family V5R1

    - Host Access Transformation Server (HATS); 3270, 5250 through a browser with
    a Web-like look and feel


    Table 5-3 summarizes this pattern''s key characteristics and technology components.


    Table 5-3 Pattern summary: As-Is Host, Customized Presentation to Host


    | Key characteristics | |

    |---|---|

    | | Make terminal-oriented host applications available through a browser. As-Is
    Host pattern moves terminal emulations off the client, leaving the original user
    interface design unchanged. Custom Presentation to Host also moves emulation off
    of the client, and in addition, transforms the original user interface design
    into a new-user-friendly design. |

    | Commonly used technology components | Linux server. WebSphere Edge Server. IBM
    Developer Kit for Linux. Web Sphere Application Server AE. DB2 UDB EE. IBM HTTP
    Server. IBM Access Manager for e-business. IBM WebSphere Host Publisher (As-Is
    Host) (At the time of this writing, IBM WebSphere Host Publisher is not supported
    on Linux). Host Access Transformation Server (HATS) (Customized Presentation to
    Host). |


    # Router pattern


    In this section, we describe the Router application and runtime patterns.


    # Application pattern


    Figure 5-11 illustrates the Router pattern.


    ![](img/f3b72f8072d00d967972ff147667688f_113_0.png)


    Figure 5-11 Router application pattern


    This application pattern represents a fan out on the presentation side to support
    multiple channels (that is, uses a hub and spoke configuration instead of having
    each channel provide its own point-to-point integration with business applications).
    The multiple presentation nodes represent different access channels, such as a
    browser, IVR, or ATM.


    The router tier supports multiple channels on the presentation side and can route
    requests from any of those channels to the appropriate enterprise application.
    The router does not fan out of the application side (as does Decomposition pattern).
    Each incoming request is routed to target application.


    The synchronous connection on the router is logical, not physical, and the implementation
    could use non-blocking messaging in addition to other techniques, in any case,
    on the presentation side, the interaction appears to the user to be synchronous.
    The router can perform protocol conversion (for example, HTTP to RMI) and session
    concentration. Router can also enforce role-based security rules.


    The Router pattern also uses the Access Integration and Application Integration
    patterns.


    An example of how the Router pattern can be used would be to support access to
    client information through the Internet, kiosks, VRU, call center, and teller
    stations. A limitation of this pattern is that it provides one product or account
    at a time (see “Decomposition pattern” on page 101 and “Agent pattern” on page
    104 for a consolidated view).


    # Runtime pattern


    Another emerging pattern is based on the user of an object request broker. In
    this case, the Integration Server node would be populated with WebSphere Application
    Server Enterprise Edition, and connectors, such as WebSphere MQ, to support integration
    with back-end applications.


    ![](img/f3b72f8072d00d967972ff147667688f_114_0.png)


    # Router runtime pattern


    Table 5-4 summarizes this pattern’s key characteristics and technology components.


    Table 5-4 Pattern summary: Router


    | Key characteristics | Commonly used technology components (message broker based)
    |

    |---|---|

    | - Make application services available through multiple channels. Move to a hub
    and spoke topology that provides back-end application services to any channel
    without the channel needing to know details of the back-end application locations
    or message formats. Intelligent request routing from a channel to the appropriate
    application system. Message transformation of requests and responses. Session
    concentration: the router maintains a reduced set of sessions with back-end applications,
    instead of each channel needing to maintain its own set. Enforce channel- and
    role-based security policy. Eliminate the need for each channel to support dedicated
    point-to-point connections to back-end application systems. | - Linux server.
    WebSphere Edge Server (optional). IBM Developer Kit for Linux. WebSphere Application
    Server AE. DB2 UDB EE. IBM HTTP Server. IBM Access Manager for e-business. WebSphere
    MQ. WebSphere MQ Integrator. WebSphere classes for Java |

