    # Selecting Patterns and product mapping


    After the appropriate Business pattern is identified, the next step is to define
    the high-level logical components that make up the solution and how these components
    interact. This is known as the Application pattern. A Business pattern will have
    multiple Application patterns identified that describe the possible logical components
    and their interactions. For example, an Application pattern may have logical components
    that describe a presentation tier for interacting with users, a Web application
    tier, and a back-end application tier.


    The Application pattern requires an underpinning of middleware that is expressed
    as one or more Runtime pattern. Runtime patterns define functional nodes that
    represent middleware functions that must be performed.


    After a Runtime pattern has been identified, the next step is to determine the
    actual product and platform to use for each node. Patterns for e-business have
    product mappings that correlate to the Runtime patterns, describing actual products
    that have been used to build an e-business solution for this situation.


    Finally, guidelines assist you in creating the application using best practices
    that have been identified through experience.


    For more information on determining how to select each of the layered assets,
    refer to the Patterns for e-business Web site at:


    http://www.ibm.com/developerWorks/patterns/


    # 4.3 Summary


    This chapter has provided an overview of Patterns for e-business. Patterns for
    e-business is a process for looking at a problem space and requirements and applying
    proven Business, Integration, Application, and Runtime patterns to design a solution.


    The next chapter investigates how these patterns can be applied to a branch banking
    environment.


    # Applying IBM Patterns for e-business to branch banking


    The previous chapter, IBM Patterns for e-business overview, establishes the overall
    context of Patterns for e-business. This chapter builds on that background information
    by exploring:


    - How Patterns for e-business apply to the transformation of banking at the branch
    and enterprise levels

    - How Linux can be used to implement Patterns for e-business based solutions


    Linux and the Patterns for e-business can be used in defining Linux-based banking
    solutions in two contexts:


    - At the branch level: Branch banks face near-term issues for Patterns for e-business
    provide alternatives that fit within an existing environment while positioning
    the bank for the future.

    - At the enterprise level: Patterns for e-business provide a context and road
    map for transforming a bank''s enterprise architecture and show where Linux can
    play a key role.


    # 5.1 Starting to use Patterns for e-business


    Patterns for e-business let us describe the problem or problems we want to solve
    and the solution or solutions that can be used to address those problems. For
    example, Business patterns let us characterize the types of problems we want to
    solve in simple but powerful terms. After we have described the scope and nature
    of the problem we want to solve, Patterns for e-business leads to solution alternatives
    in the form of Application and Runtime patterns. These patterns can be implemented
    through the use of well-known combinations of technology components (the Product
    mappings associated with Runtime patterns). At each point, we will need to make
    decisions about which pattern alternatives are the best choice, and for that,
    we will need some key information as input.


    ### 1 Describing the problem or patterns we want to solve


    The first step in applying Patterns for e-business is to establish which Business
    or Integration patterns, or both, are a good fit, in other words, which ones represent
    the problem or problems we are trying to solve. To make that choice, we need to
    look at the problem space, identifying key business and IT requirements. Those
    requirements will us make which Business and Integration patterns apply.


    The Business and Integration patterns describe common characteristics that are
    found in a broad range of business processes across multiple industries. One of
    the goals in defining these patterns was to apply an 80/20 rule: Ensure that these
    patterns could be applied to a majority of business processes in order to address
    a majority of a business''s needs. Because of this, we can be confident of finding
    a good match for a majority of banking process scenarios.


    ### 2 The solution or solutions alternatives


    After we have described the problem space and determined which Business and Integration
    patterns apply, we will be ready to start looking at solution alternatives, in
    the form of Application patterns, for each of the Business and Integration patterns
    we have selected. The solution alternatives described in Patterns for e-business
    also identify technology component Product mappings that can be used to implement
    instances of the Runtime patterns. Once again, we have some decisions to make,
    and we will need to collect and summarize some key information as input into those
    decisions.


