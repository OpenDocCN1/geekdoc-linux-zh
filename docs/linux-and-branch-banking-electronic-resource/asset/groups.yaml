    | 10 | | | | x |\n| 11 | | | | | |\n\n## 7.2 Scenario solution\n\nHaving fully\
    \ understand[d] all functional and non-functional requirements and using a methodology,\
    \ such as Patterns for e-business, we might create an infrastructure such as the\
    \ one shown in Figure 7-1 on page 137.\n\nWe have created an integrated, multichannel,\
