    generated. The message is sent through the branch-based OS/2 server across the
    network to the mainframe using SNA protocol. At the mainframe, the workflow application
    handles message processing tasks, for example, sending an MQSeries message to
    the CICS-based customer information file (CIF) to obtain general customer information,
    such as address, telephone number, and a list of accounts held.


    Based on the response, the workflow application generates more messages to obtain
    more specific account information, such as balance, interest, and service charges.
    Finally, the workflow application sends a single MQSeries message to the advisor
    containing all the information relating to the various systems.


    The extensive branch network includes ATMs, point-of-sale (POS) terminals, and
    workstations. Employees in the branches use Lotus Notes for groupware and e-mail
    functions. Client/server branch applications have been developed using IBM VisualAge
    C++.


    # 2.6 Component model for branch banking


    This section describes a high-level component model for the major elements of
    a branch banking system. It provides the functional view of the system that is
    required to define the necessary infrastructure. It contains two subsections:
    a component diagram and component definitions.


    The component diagram section shows the relative placement of functional components
    in the system and the high-level connectivity among the components.


    The component definitions section contains the name of each component, a description
    of the services the component provides, and any implementation details known about
    the component.


    Note that some components of the system are based on historical views of the geographic
    constraints of branch infrastructures. Options for deployment of components in
    non-traditional ways are explored where appropriate.


    # 2.6.1 Component diagram


    The diagram shown in Figure 2-7 on page 37 represents a functional view of the
    interaction of the software components within the infrastructure. For completeness,
    it also shows the points of component interaction with components that are outside
    of the branch banking system with which the system has to interact. A component
    diagram normally does not depict the'
  - '[PAGE 52]


    deployment of components within the environment. The diagram does show where the
    components have historically been deployed geographically in a branch system.
    The model does not include all of the system components that may be required somewhere
    within the overall system, for example, Domain Name Service (DNS).


    | Desktop Components | Branch Server Components | Middle-Tier Components | Back-end
    Components |

    | --- | --- | --- | --- |

    | Network Services | Network Services | Application Server | Integrated Customer
    Information |

    | Presentation Services | User Management | Messaging Server | Business Analytics
    Systems |

    | Peripheral support | File & Print Services | Database Server | Core Transactions
    Systems |

    | User Management | Store & Forward | System Management Server | Enterprise Security
    Services |

    | Teller Functions | Branch Database Services | Other Delivery Channels | Other
    External Components |

    | Platform Functions | System Management | | |

    | Other Productivity | | | |


    **Figure 2-7** Component diagram


    # 2.6.2 Component definitions


    Based on the component diagram shown in Figure 2-7, this section provides brief
    descriptions of these various components.


    # Desktop components


    Desktop components are defined at a conceptual or macro level rather than the
    micro or detailed design level. A great enough level of detail is given to provide
    possible trade-offs for thin versus versus fat application design models.'
  - '[PAGE 53]


    # Network services


    Network services allow the desktop application to communicate with other systems
    and external components. Both local LAN and external communications are through
    the operating system''s TCP/IP services supplemented by local LAN services if
    required. Communication can be through HTTP or other TCP/IP protocols as dictated
    by the application model. In addition, a plug-in such as IBM WebSphere Host On-Demand,
    or a fat application, such as IBM Personal Communications, can be used to access
    traditional 3270 type applications.


    # Presentation services


    For this client solution, presentation services can be thought of as the Web browser.
    The web browser translates the HTML encoded pages that are received through HTTP
    into a form intended for the user. Presentation services in a traditional fat
    client implementation have greater functional capability and allows for richer
    user interfaces. Although applications can be built using either radical, traditional
    applications that are keyboard driven with detailed field editing are more difficult
    to implement using thin clients, Java applets can provide the needed capabilities.


    # Peripheral support


    Various specialized devices can be used to provide input to the system or output
    from the system. For example, a bank can use ATM cards and personal identification
    numbers (PINs) to identify a user when executing transactions in the branch. A
    magnetic stripe reader (MSR) can be used to read the ATM card and a pin-pad can
    be used for the customer to securely enter the PIN. Addition, banks can provide
    a record of a transaction for a customer through a receipt printer or a passbook
    printer. These devices then become integral parts of the branch system. Support
    for these specialized peripherals is much dependent on the application development
    model that is being used. In so-called fat applications, the applications use
    device APIs to interface with native operating system devices. In applications,
    Java can be used with a standard, such as Java Extensions for Financial Services
    (J/XFS). More information about JFS can be found at:


    ```

    http://www.jxs.com/

    ```


    # User management and security


    The use of a branch banking system by branch personnel (tellers and platform officers)
    is controlled by a combination of user authentication and role identification.
    This component provides a functional role in the determination of application
    function flow, but also a more important non-functional role in controlling access
    to the system for security purposes. It also provides a set of permissions and
    limits by which execution decisions are made. The part of the user management
    component that is deployed at the desktop is usually small'
  - '[PAGE 54]


    and, in many cases, is totally centralized. The availability of user management
    when communications are lost to a central site can complicate the enterprise management
    of security.


    # Teller functions


    There are a lot of existing teller applications that can be run on a fat client
    with communication to back-end and mid-tier systems through either TCP/IP or SNA
    protocols depending on the operational configurations. Alternatively, new applications
    can be written using a thin client or browser paradigm. The elements of a teller
    application include:


    +   - Customer information: Data is pulled from a customer information file based
    on a piece of data, such as a relationship number. This information, which includes
    things such as address and phone number, as well as a list of accounts for the
    customer, can be used during customer servicing.


    +   - Account information: This information includes details on an account, such
    as current balance and transaction history.


    +   - Financial transactions: The transactions that change the financial state
    of an account (deposits, withdrawals, cash checking, and so on).

    - Electronic journal: A log of all transactions that are executed by a teller.
    The journal may be held on the client machine, at a branch server, or at a regional
    server. In a completely centralized system, it may consist of a database query
    using a teller''s ID as a key. In a system requiring offline processing, it may
    also provide the capability to store the transactions locally and forward them
    to the middle tier or back-end components when the online connection is restored.


    # Platform functions


    Platform functionality deals providing the customer with their existing accounts
    or services, presenting choices of financial services that a customer may want
    to purchase, and actually filling out applications or opening new accounts. The
    platform user needs functions that the teller uses, such as customer information
    and account information, but also needs a rich set of functions for tracking customer
    interactions, making sales presentations, and filling out forms. All of these
    functions are more presentation than transaction driven and therefore lend themselves
    fairly well to client applications that are navigated using a mouse rather than
    a keyboard. Customer interaction is more casual and conversational, giving the
    platform personnel more time to assimilate information provided by the system.
    In addition, the information that needs to be input is more free-form and extensive,
    which means that interaction with the system is less hurried. Although rich GUI-driven
    applications using drop-down lists and pre-fills in a browser have been used extensively
    in the past, a similar experience using can be just as intuitive and effective
    in a less time-driven environment.'
- md: '

    # Office productivity


    Some platform personnel in retail banking offices have need for the typical office
    productivity tools that have become synonymous with the evolution of the personal
    computer. e-mail, word processors, spreadsheet, and so on, are very often used
    on the sales platform. There are a variety of applications that can provide these
    capabilities across different operating systems.


    # Branch server components


    Most banks still believe that a branch server is required to ensure the availability
    of the system at all times and to help in managing the end-user desktops. The
    combination of more reliable branch to data center communications and then client
    applications may allow some banks to eliminating the branch server, but providing
    for local file and print sharing, as well as the ability to operate when the central
    system is not available provide strong reasons to keep a branch server as part
    of the infrastructure.


    # Network services


    The server''s network services provides LAN communication and any gateway functionality
    that may be required. An example of gateway capability would be for the provision
    of SNA communications over a TCP/IP network. In a pure TCP/IP network, this communication
    function would not be required. A branch server may also provide gateway functionality
    for a satellite or grocery store.


    # User management


    Users must be authenticated, and there must be a control point for determining
    their role based on desktop capabilities. If secure, offline capability is required
    in the branch, and then this server functionality is a necessity. In addition,
    the application would have to have access to the user roles in order to determine
    what limits on functionality should be applied to a given user. One example of
    this is for overrides. A head teller or branch manager may be allowed to override
    an offline transaction limit for a customer. A person with this higher level of
    authority would have to be defined as a separate role, and the specific characteristics
    of the role need to be made available for use by the application.


    # File and print services


    Application components may have to make use of these types of services under certain
    application design models. An example of such a requirement would be the need
    to share a laser printer among multiple tellers or platform officers. File sharing
    is also important, and may be critical for employees who move to various machines
    but still need access to previously created files.


    Store and forward mechanism is used in branch systems to ensure that transactions
    can continue to be accepted in the branch when the connection to the transaction
    system of record is not available. This is typically due to the loss of communications,
    but could be for other reasons. A transaction record is stored in a database,
    log file, or electronic journal that contains all of the information that would
    normally be sent to the transaction system. It may also contain a time stamp or
    sequence number, or both. The forwarding mechanism is an automatic process that
    runs in the background to forward the transactions to the core transaction system
    when it becomes available. Although a branch server is a logical place to deploy
    a store and forward mechanism, some applications deploy this capability in each
    client. If communications with a regional or centralized server can be guaranteed
    to the required reliability level, the store and forward mechanism could be centralized.
    Another option would be not to have any capability and only handle transactions
    when the core transaction system is available to the branch.


    # Branch database services


    Some application models currently use a database in the branch that is required
    in offline mode. For example, some implementations of an electronic journal might
    use a database. In addition, a database may be used to store configuration data
    that is required during offline processing. Branch database services may not be
    required in more centralized application design models with limited options.


    # System management


    One of the primary roles for a branch server is the management of end-user desktop
    configurations. Rather than managing desktops directly, the server can be used
    to cache desktop configurations. When changes are made, the system management
    software running on the server can automatically update the desktops.


    # Middle-tier components


    In an e-business architecture, many of the application components of the system
    can be deployed in centralized servers. In this way, they can be shared by many
    branches, as well as by delivery channels. Some of these components are described
    at a high level in the following.


    # Application server


    An application server is the software component within an e-business architecture
    where an application''s business logic is executed. It acts as an intermediary
    between the end-user interaction components on the front-end and the data components
    on the back-end. In a banking branch system, there may be multiple application
    servers for different business needs.


    # Messaging server


    A messaging server provides a common communications transport layer for all applications
    within the infrastructure. It can be used to provide routing based on business
    rules, as well as translation from one message format to another. Use of messaging
    server provides an integration point for tying disparate system components.


    # Database server


    A middle-tier database server provides the branch banking system with application
    and system data specific to servicing the branches or other delivery channels.
    The requirements for this database will be very dependent on the needs of various
    applications and the design of those applications. Some application design models
    may not require a middle tier but obtain all data from back systems.


    # System management server


    A system management system in the middle tier is used to administer all management
    functions for the branch system. Configurations for all desktops in the delivery
    system are administered through this server. When configurations change, the server
    is responsible for distributing those changes to the branch server, which in turn,
    administers changes to the individual desktops. In other system management designs,
    this server may be configured to manage desktops directly. In addition to configuration
    management, the server may also be a collection point for alerts generated by
    downstream components indicating failures or performance bottlenecks.


    # Back-end components


    The back-end components are not part of the branch system. They are enterprise
    systems that provide services required by the branch system. In order to complete
    the architecture of the branch banking system, all interfaces to the back-end
    systems need to be well defined and understood.


    # Integrated customer information


    Integrated customer information or customer information files (CIF) hold an integrated
    view of a customer''s total relationship with the bank.


    # Business analytics


    Business analytics can provide analysis of a customer''s financial holdings and
    transaction history to provide guidance on product suitability and financial risk.


    # Core transaction systems


    Core transaction systems provide account-level transaction capability and history.


    # Enterprise security systems


    Enterprise security systems provide the information necessary to authenticate
    users and determine their system-level permissions.


    # 2.7 Summary


    The branch banking environment, which has not changed significantly over the last
    decade, is starting to go through a major transformation. This chapter has described
    some of the drivers for this transformation.


    In addition, it has provided general information about the structure of branch
    offices and the types of systems that have typically been in place to support
    them. We have also provided three different scenarios that represent how many
    banks operate their branch banking systems today.


    If you have been in the banking industry for very long, this chapter may not have
    provided you with much information that you were not aware with. However, it is
    important to provide this information as a basis for discussions in the upcoming
    chapters. The next chapter provides some specific information about branch banking
    requirements, and sets us up for the remainder of the redbook to discuss a Patterns
    for e-business approach to designing a solution and understanding where Linux
    can be an important piece of that solution.

