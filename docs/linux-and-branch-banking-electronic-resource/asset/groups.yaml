    ## 2.3.2 Multichannel context


    Financial institutions are launching channel integration efforts to improve service,
    lower costs, and gain a comprehensive view of the customer. But, building a multichannel
    delivery system is hard work and not inexpensive, particularly the first channel
    to be implemented. Like many infrastructure investments, it is difficult to justify
    the return based on a single channel or application implementation.


    Instead, the ROI must be looked at in terms of the long-term flexibility and cost
    savings delivered and the benefits accrued as a result of reduced complexity and
    improved speed to market.


    The cornerstone of this is an architecture that encourages enterprise-wide reuse
    of applications and infrastructure components. Figure 2-3 on page 22 depicts what
    we believe to be the framework or logical architecture of a multichannel delivery
    system for banking. This is consistent with our customer-centric architecture
    and the multichannel logical architecture described by the TowerGroup.


    ## Integrated customer view


    No multichannel solution will be successful unless the infrastructure successfully
    brings together the disparate data about a customer and delivers a single, consistent
    view of all that is known about the customer to the applications and users who
    serve the customer.


    This integration of customer data can be physical, aggregating customer data physically
    by replicating it from existing systems, or logical, aggregating customer data
    logically, in that it knows where the data is and provides the services to get
    it, or a combination of both.


    ![](img/f3b72f8072d00d967972ff147667688f_37_0.png)


    Figure 2-3 Multichannel environment


    Linux and Branch Banking


    ## Core business processing


    These applications, typically known as the back-office or legacy applications,
    are the systems of record that manage customer accounts, process transactions,
    and provide enterprise-wide services. The front-office applications (enabled through
    the multichannel infrastructure) are required to interact with these applications
    for access to customer financial data and transaction processing capability.


    These systems are typically quite fragmented, leading to the fragmentation of
    customer information and business rules that, in turn, have created some of the
    channel dissonance in many of today''s banking delivery systems. The multichannel
    infrastructure must continue to leverage the capabilities of these systems through
    integration, but at the same time, mitigate the fragmentation in service they
    have created by aggregating customer information and providing a front end with
    business logic and rules that disguise their inconsistencies.


    ## Business analytics


    One of the reasons for building a multichannel delivery system is to be able to
    optimize each and interaction with the customer, regardless of the channel through
    which the interaction occurs. A key to maximizing the effectiveness of a multichannel
    delivery system in this regard is a set of business analytic capabilities that
    help analyze customer information, identify customer needs, match products and
    services to identified needs, and, finally, measure the effectiveness of interactions
    with the customer.


    As Figure 2-3 on page 22 shows, business analytics includes the following types
    of capabilities:


    - Data warehouses and the technologies required to populate warehouses

    - Data mining tools to assist in mining the data to determine customer segments
    and the characteristics that drive customer needs

    - Campaign management systems that enable marketing organizations to create, deploy,
    and monitor the results of campaigns that target products and services to meet
    the needs of specific customer segments

    - Reporting tools that provide feedback to management about various system and
    customer-related performance indicators


    Using a common set of business analytics helps to ensure that the treatment customers
    receive across all channels is consistent with respect to their needs and the
    services they are offered and the results reflect the totality of the customer''s
    interaction with the institution.


    ## Enterprise integration


    With the growth in the number of channels and demand to deliver more and more
    functionality through these channels, point-to-point integration with back-office
    applications and external service providers have proven cumbersome and costly.
    In order to reduce the complexity of application integration, institutions are
    looking to implement a common integration framework that enables them to implement
    integration among applications in an efficient and common way. Tremendous efficiencies
    in development and testing can be gained, leading to lower cost and increased
    speed of deployment, by implementing the interfaces required to integrate these
    applications once on a common platform.


    As we see in Figure 2-3 on page 22, there are a number of different integration
    disciplines required to support the needs of a multichannel delivery system, including:


    - Data integration

    - Process integration

    - Message integration


    In addition, the enterprise integration framework needs to support integration
    with applications and services both within and outside the institution.


    ## 2.4 Branch structure


    When analyzing the requirements for a new or transformed branch banking system,
    we first need to understand the structure of a branch. This structure includes
    the current systems and system types that are in place to support the branch personnel
    and business objectives.


    The current make up of branch automation systems includes devices specific to
    the tellers and platform personnel, and in some cases, ATMs. How these systems
    are integrated and used by the bank employees are part of the operational model
    is discussed in a later section.


    For now, let''s discuss the general system types typically found in bank branches.


    ## 2.4.1 Branch systems


    Workstations provide an end-user interface to the branch banking system for users,
    and servers provide connectivity, data access, or other system management functions
    to the workstations. They are all connected through a physical network, where
    one or multiple protocols are responsible for fast, stable, and reliable communication.


    ## Teller and platform systems


    The goal of branch automation systems is to enable the teller and platform personnel
    to process customer transactions, access customer account information, and generate
    reports.


    Central systems store customer information, transaction, and account data, and
    traditionally, branch systems access this information.


    Because branch automation systems use component technologies, these systems can
    make the same information available not only to tellers and platforms but also
    to touch points, like ATMs. The goal is to enable platform personnel and tellers
    to have or provide detailed customer account information and sales prompts for
    cross-selling and up-selling.


