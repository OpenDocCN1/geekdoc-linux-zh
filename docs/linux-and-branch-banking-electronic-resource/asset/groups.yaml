    ## 6.1.6 Application servers


    In today''s e-business world, application servers play a critical role. Linux
    provides a stable and affordable base for running application servers, especially
    in a large and distributed environment such as branch banking.


    ### Tomcat


    Developed by members of the Jakarta Project, Tomcat is a servlet container based
    on Java Servlet 2.3 technology and a JavaServer Pages (JSP) 1.2 implementation.
    There are other products like it, but Tomcat is the official reference implementation
    for these two technologies, and one of the few freely available application servers
    that offers support for JSP 1.2.


    Tomcat is developed in an open and participatory environment and released under
    the Apache Software License. Further information about Tomcat can be found at:


    ```

    http://jakarta.apache.org/tomcat/

    ```


    ### IBM WebSphere Application Server


    WebSphere Application Server is a Java technology-based Web application server,
    integrating data and transactions with the e-business world. It provides a rich,
    e-business application deployment environment with a complete set of application
    servers, including capabilities for transaction management, security, clustering,
    performance, availability, connectivity, and scalability.


    WebSphere Application Server is the core Web services and JEE application server
    enabled with industry-leading qualities of service and an array of flexible deployment
    configurations to meet the needs of stand-alone, multi-server distributed, and
    highly dynamic distributed enterprise environments.


    ## 6.1.7 Messaging servers


    Messaging is the exchange of messages (specially-formatted data describing events,
    requests, and replies) to a messaging server, which acts as a exchange program
    for client programs.


    ### IBM WebSphere MQ


    For additional information about WebSphere MQ, see “IBM WebSphere MQSeries” on
    page 121 or the WebSphere MQ Web site at:


    ```

    http://www-3.ibm.com/software/ts/mqseries

    ```


    ## 6.1.8 Systems management


    In a geographically distributed environment such as branch banking, it is important
    to have the facilities and tools available to remotely manage the workstations
    and servers in this environment. Again, there are a variety of management facilities
    and products provided by or available for Linux.


    ### Telnet, rsh, and login


    Telnet is the way you can access someone''s computer, assuming they have given
    you permission. More technically, Telnet is a user command and underlying TCP/IP
    protocol for accessing remote computers.


    The rsh command lets you share processors and execute commands on remote systems.
    With rsh, it is simple to ask a command to run on any computer on the network,
    for which you have access. You can have the command''s output printed on your
    screen, directed to a local file, or directed to a remote file.


    The login command allows an authorized user to log on to Linux machines (hosts)
    on a network and to interact as if the user were physically at the host computer.
    Once logged in to the host, the user can do anything that the host has given permission
    for, such as read, edit, or delete files, and stop or start process.


    ### Secure Shell (SSH)


    SSH is a protocol for remotely creating a secure connection between systems. Common
    methods for remotely logging on to another system through a shell (Telnet, login,
    or rsh) or copying files between hosts (FTP or rcp) do not encrypt data that is
    sent over the connection between the client and the server and should be avoided.
    Instead, you should only connect to a remote host using a secure shell or an encrypted
    virtual private network. Using secure methods to remotely log on to other systems
    will decrease the security risks for both you and the remote system.


    ### NetSaint Network Monitor


    NetSaint is a program that monitors hosts and services over network. It has the
    ability to email or page you when a problem arises and it gets resolved. NetSaint
    is written in C and is designed to run under Linux, although it should work under
    most other UNIX variants. It can run either as a normal process or as a daemon,
    intermittently running checks on various services that you specify. The actual
    service checks are performed by external plug-ins that return information to NetSaint.


    ### Webmin


    Webmin is a Web-based interface for system administration for Linux. Using any
    browser, you can set up accounts, network services, file sharing and printing,
    and so on. Webmin consists of a simple Web server and a number of programs that
    directly update Linux system files.


    ### IBM Tivoli systems management software


    IBM Tivoli software provides a comprehensive and complementary set of products
    that provide end-to-end management of IT environments. Enterprises can use Tivoli
    applications to manage everything from the mainframe, middle-tier servers to desktops
    and PDAs.


    Tivoli solutions are available for managing everything from the network infrastructure
    to middleware to applications. They have embraced Linux as both a platform to
    manage, as well as a platform on which to run the applications. They have product-specific
    modules for managing many of the key software components required for an e-business,
    such as DB2, WebSphere, and Domino, and they are managed in a platform-independent
    way.


    The Tivoli products fall into four broad categories of systems management:


    - Performance and Availability

    - Configuration and Operations

    - Security

    - Storage Management


    Through the integration of the various products, Tivoli helps you to deploy, operate,
    secure and manage the performance and availability of your systems and across
    all major platforms, including Linux.


    ### IBM Desktop On-Call


    Desktop On-Call is a remote control software product that uses a unique concept:
    you do not need to install software on the guest PC because you can control the
    host PC from another PC with an ordinary Web browser using a Java applet. It enables
    you to control your desktop PC remotely from virtually any PC at any location
    in the world.


    Desktop On-Call is very helpful in many situations for banks and other important
    applications. If you have a problem with an application program on your desktop
    PC, you can fix it from a remote PC. When the host PC is accessed through the
    Web browser, the Java applet program is dynamically downloaded to a Web browser
    and draws an image of the host desktop. The Java applet program then starts to
    communicate with the native daemon program. This enables you to control your host
    PC from a remote location.


    ### IBM Director


    IBM Director is a comprehensive workgroup hardware manager designed for use with
    IBM xSeries servers, PCs, and notebooks.


    Working with IBM Director, the Advanced Management service processors on xSeries
    servers are the key to hardware problem notification and resolution. They provide
    the system administrator with complete remote management of a system, independent
    of the server status. The processors simulate a computer within a computer, keeping
    the server up and available for your business-critical applications.


    ## 6.2 Summary


    We have described a variety of Linux-based products and facilities that provide
    the needed infrastructure for a branch banking environment. Most of these have
    proven track records and provide the stability and performance you require. Having
    all of these capabilities (and more) available to run in Linux environments is
    helping drive the movement towards using Linux as a less expensive and low-risk
    option for many banks and other companies.


    As you develop your own solution architecture using IBM Patterns for e-business
    as described in Chapter 5, "Applying IBM Patterns for e-business to branch banking"
    on page 73, you can use the information provided in this chapter to start identifying
    the product mappings required for your chosen Runtime pattern.


    ## Scenario for a new branch banking solution


    In 2.5, “Common branch banking scenarios” on page 32, we describe some common
    IT infrastructures for supporting current branch banking environments. In this
    chapter, we describe some scenarios related to the branch banks of the future.
    These scenarios are based on the trends we describe in Chapter 2, “Branch banking
    environment” on page 11. Patterns for e-business, and on the applicability and
    availability of Linux-based solutions for these environments.

