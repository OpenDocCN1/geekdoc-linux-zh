    # Branch teller


    The branch teller provides superior service to customers while accepting transactions,
    such as deposits, cashing, checks, and loan payments. The branch teller also recognizes
    customer needs and suggests appropriate products or services.


    # Functions


    The branch teller functions are as:


    +   - Provides prompt, efficient, and friendly service to customers at all times.


    +   - Counts cash and coin while processing deposits, loan payments, or carries
    checks according to policies and procedures.


    +   - Post transactions to computer through an online terminal.


    +   - Balances the cash drawer prepares teller balance sheet on a daily basis,
    making sure that cash is kept to a minimum and within limits set by the board
    of directors.


    +   - Sells traveler''s checks, certified checks, and personal money orders.


    +   - Processes and records night deposit envelopes and transactions.


    +   - May assist with ATM balancing and supply.


    # Branch loan officer


    The branch loan officer works with customers to process loan applications.


    The loan officer''s mission is to provide superior service to customers in the
    loan area and to recognize customer needs and suggest appropriate products or
    services.


    # Functions


    The branch loan officer functions are as:


    +   - Sells bank products and services.


    +   - Provides exceptional customer service to all customers.


    +   - Represents the institution in a courteous and professional manner.


    +   - Interviews customers, assists with applications, and answers basic loan
    questions. Completes all loan customers and advises on loan decisions.


    +   - Services existing customers with retail banking needs to include teller
    transactions.'
