  md: '+   Selling a simple bank product on an automated sales point


    +   Querying information for a bank product


    +   Credit line verification by the account representative or the branch manager


    # Complex tasks


    Complex tasks are defined as tasks that either require more than one person to
    work on, for example, the 4-eye principle or 2-key security, as well as any kind
    of multistaged application processing. This could be either real time or asynchronous
    using message queuing or workflow processing. These processes can have the following
    different types of interactions:


    +   Human to human: A teller requires approval from the branch manager for a certain
    transaction.


    +   Multiple information sources: A process can only be completed by gathering
    information from multiples sources or writing multiple results back to a set of
    targets.


    +   Business to business: A good example would be an alliance between the bank
    and an insurance company, where both resell each others products and have access
    to each others systems for information and data exchange.


    Examples for complex tasks are as follows:


    +   Opening a new account that requires the approval from branch management, as
    well as clearance from a central authority for checking the credit history of
    that person.


    +   Any large withdrawal that might fall under money laundering regulations requires
    approval-on-site and potentially from the central side and is recorded and tracked.


    +   A more complex investment plan or loan application that may involve opening
    additional, special accounts, financial checks, or batch process calculations.


    +   An alliance between the bank and an insurance company, where both resell each
    others products and have access to each others systems for information and data
    exchange.


    +   Portfolio management requires information from multiple sources to be queried,
    processed, and put together to extract a portfolio recommendation for a specific
    customer or customer requirement. Also, managing this portfolio may require access
    to various accounts, even across banks.


    +   Credit card approval usually involves a central clearance application to process
    the request and approve the credit of the requesting person.'
