  md: '# Core business processing


    These applications, typically known as the back-office or legacy applications,
    are the systems of record that manage customer accounts, process transactions,
    and provide enterprise-wide services. The front-office applications (enabled through
    the multichannel infrastructure) are required to interact with these applications
    for access to customer financial data and transaction processing capability.


    These systems are typically quite fragmented, leading to the fragmentation of
    customer information and business rules that, in turn, have created some of the
    channel dissonance in many of today''s banking delivery systems. The multichannel
    infrastructure must continue to leverage the capabilities of these systems through
    integration, but at the same time, mitigate the fragmentation in service they
    have created by aggregating customer information and providing a front end with
    business logic and rules that disguise their inconsistencies.


    # Business analytics


    One of the reasons for building a multichannel delivery system is to be able to
    optimize each and interaction with the customer, regardless of the channel through
    which the interaction occurs. A key to maximizing the effectiveness of a multichannel
    delivery system in this regard is a set of business analytic capabilities that
    help analyze customer information, identify customer needs, match products and
    services to identified needs, and, finally, measure the effectiveness of interactions
    with the customer.


    As Figure 2-3 on page 22 shows, business analytics includes the following types
    of capabilities:


    +   - Data warehouses and the technologies required to populate warehouses


    +   - Data mining tools to assist in mining the data to determine customer segments
    and the characteristics that drive customer needs


    +   - Campaign management systems that enable marketing organizations to create,
    deploy, and monitor the results of campaigns that target products and services
    to meet the needs of specific customer segments


    +   - Reporting tools that provide feedback to management about various system
    and customer-related performance indicators


    Using a common set of business analytics helps to ensure that the treatment customers
    receive across all channels is consistent with respect to their needs and the
    services they are offered and the results reflect the totality of the customer''s
    interaction with the institution.'
