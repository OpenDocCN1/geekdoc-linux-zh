    # Branch servers


    When client/server technology made its evolution in the late 1980s, it became
    a core part of both branch systems. Various features and functions were transferred
    from both the mainframe to the branch to provide better performance and less WAN
    dependency, as well as from PC-based stand-alone applications to a central server
    to allow multiple users to access and share data.


    Also, features such as backup and recovery of data, mail gateways, communication
    hubs to remote machines or mainframe systems, or both, central printing, and many
    more are part of a two- or three-tier architecture. Copies of central databases
    are held for security and accessibility


    More recently, due to faster processing, more reliable communications, and the
    cost of deploying and managing a fully distributed client/server environment the
    trend has shifted toward more centralization. For example, Web-based applications
    are hosted from a single, central server and clustered for availability. In some
    cases, only core facilities, such as local data and printer sharing, remain on
    branch servers.


