  md: '# Scenario for a new branch banking solution


    In 2.5, “Common branch banking scenarios” on page 32, we describe some common
    IT infrastructures for supporting current branch banking environments. In this
    chapter, we describe some scenarios related to the branch banks of the future.
    These scenarios are based on the trends we describe in Chapter 2, “Branch banking
    environment” on page 11. Patterns for e-business, and on the applicability and
    availability of Linux-based solutions for these environments.'
  merge: -1
  pgno: 148
- img_proc: true
  md: "# 7.1 Scenario overview\n\nThe challenge is to provide an architectural road\
    \ map for a branch banking infrastructure that addresses today's business challenges\
    \ and the services of tomorrow. So, the infrastructure of a new branch bank world\
    \ must integrate all other channels and become a core part of those channels as\
    \ well. As a reminder, it must have the characteristics to support:\n\n+   - A\
    \ full range of services (self service to personal assistance)\n- Advisor collaboration\n\
    - Wireless connectivity\n- Drive-through traffic at the branch\n- Increased focus\
    \ on customer relationship management\n\nTherefore, the goals for the overall\
    \ solution include, but are not limited to, the following:\n\n+   - Converged\
    \ network infrastructure\n- Flexible, role-based components:\n  - Teller\n  -\
    \ Platform officer\n  - Branch administration\n- Enabled for collaboration\n-\
    \ Integrated with and enhancing the ATM channel\n- Integration with the enterprise:\n\
    \  - Operational banking systems\n  - CRM\n  - Wealth management\n\nA potential\
    \ scenario in a branch banking environment with integrated channels could be as\
    \ follows:\n\n+   1. A customer uses a mortgage calculator on the Web.\n2. Later,\
    \ the customer enters branch, makes a deposit, and receives a printed receipt.\n\
    3. During the interaction with the teller, the teller extends an offer to the\
    \ customer to discuss mortgage refinancing with an expert (based on business intelligence\
    \ knowledge of the mortgage calculator usage on the Web)."
  merge: -1
  pgno: 149
- img_proc: true
  md: '+   4. The customer makes an appointment for a meeting in the branch with a
    financial expert (through remote conferencing) to begin in 15 minutes and waits
    in the branch coffee shop until the time for appointment.


    +   5. A concierge (notified on PDA) comes to get the customer when the financial
    expert is ready.


    +   6. The customer has a remote conference with a financial expert regarding
    mortgage refinancing, using aggregation by portal to share customer information.
    The customer expresses an interest in home improvement (kitchen remodeling) and
    requests funds from refinancing to cover the remodeling.


    +   7. The customer completes a pre-filled loan application with the financial
    expert.


    +   8. A few days later, the customer goes to a Web-based ATM and withdraws cash.


    +   9. The ATM informs the customer that the loan has been approved and offers
    to schedule the loan closing in one of the following ways: choosing from a list
    of available appointment times or requesting a customer service representative
    for loan closing.


    +   10. The customer accepts the call-back option.


    +   11.During the loan closing, a platform officer extends an offer for a discount
    on home improvement services provided through a business partner and offers to
    schedule a home visit by a remodeling representative, which the customer accepts.


    As outlined in Chapter 5, "Applying IBM Patterns for e-business to branch banking"
    on page 73, we have basically touched all four business patterns.


    Table 7-1 Matching examples for Patterns for e-business


    | Step | Self Service | Collaboration | Aggregation | Extended Enterprise |

