  md: '# 2.3.2 Multichannel context


    Financial institutions are launching channel integration efforts to improve service,
    lower costs, and gain a comprehensive view of the customer. But, building a multichannel
    delivery system is hard work and not inexpensive, particularly the first channel
    to be implemented. Like many infrastructure investments, it is difficult to justify
    the return based on a single channel or application implementation.


    Instead, the ROI must be looked at in terms of the long-term flexibility and cost
    savings delivered and the benefits accrued as a result of reduced complexity and
    improved speed to market.


    The cornerstone of this is an architecture that encourages enterprise-wide reuse
    of applications and infrastructure components. Figure 2-3 on page 22 depicts what
    we believe to be the framework or logical architecture of a multichannel delivery
    system for banking. This is consistent with our customer-centric architecture
