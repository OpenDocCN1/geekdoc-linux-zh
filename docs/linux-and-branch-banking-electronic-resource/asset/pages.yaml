    further details will be overlooked.


    +   - **Preserve stable IT infrastructures:** Existing systems that provide reliable
    service can continue to be used through communications components. These components
    provide connectivity to legacy systems.


    +   - **Faster time to market:** The development approach that a framework of
    components promotes is designed to shorten development cycles and flatten the
    learning curve for the development team. The objective of this approach is to
    effectively save development effort, improve consistency, and reduce the time
    to market for all delivery channels.


    +   - **Shortened development cycles:** A framework of components provides an
