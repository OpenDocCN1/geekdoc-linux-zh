  md: '# Preface


    This IBM Redbook addresses addresses two topics that may, at first, seem rather
    orthogonal. One of these topics is the world of banking, and specifically, the
    transformation of branch banking. We spend a great deal of time in this book describing
    the branch banking environment, the transformation that is currently taking place
    related to branch banking, and various architectures and techniques being used
    to define the branch bank of the future from an IBM perspective.


    The second topic is Linux. The phenomenal open source operating system, whose
    use within e-businesses as a secure and robust platform has skyrocketed since
    its inception.


    This redbook discusses the applicability of Linux to the branch banking environment
    and why it should be given strong consideration as the basis for branch banking
    systems of the future.


    Chapter 1, "An introduction to Linux" introduces Linux and discusses its applicability
    as a server and as a client.


    Chapter 2, "Branch banking environment" begins our discussion of branch banking,
    including how it has evolved and why there is such an emphasis in the industry
    around its transformation.


    Chapter 3, "Branch banking requirements" describes the key requirements of a branch
    banking solution from both a business and an IBM perspective.


    Chapter 4, "IBM Patterns for e-business overview" introduces IBM Patterns for
    e-business. These patterns have been successfully used to document the problems
    and possible solutions for companies becoming e-businesses.


    Chapter 5, "Applying IBM Patterns for e-business to branch banking" applies Patterns
    for e-business to the branch banking environment. Though the solutions we describe
    are generic, this chapter can be used as a guide for defining the solutions for
    your environment.


    Chapter 6, "Linux-based products applicable to branch banking" provides an overview
    of the facilities available for Linux that can make it a viable solution for branch
    environments.


    Chapter 7, "Scenario for a new branch banking solution" provides a sample scenario
    showing a branch banking solution of the future.'
  merge: -1
