- img_proc: true
  md: '# Office productivity


    Some platform personnel in retail banking offices have need for the typical office
    productivity tools that have become synonymous with the evolution of the personal
    computer. e-mail, word processors, spreadsheet, and so on, are very often used
    on the sales platform. There are a variety of applications that can provide these
    capabilities across different operating systems.


    # Branch server components


    Most banks still believe that a branch server is required to ensure the availability
    of the system at all times and to help in managing the end-user desktops. The
    combination of more reliable branch to data center communications and then client
    applications may allow some banks to eliminating the branch server, but providing
    for local file and print sharing, as well as the ability to operate when the central
    system is not available provide strong reasons to keep a branch server as part
    of the infrastructure.


    # Network services


    The server''s network services provides LAN communication and any gateway functionality
    that may be required. An example of gateway capability would be for the provision
    of SNA communications over a TCP/IP network. In a pure TCP/IP network, this communication
    function would not be required. A branch server may also provide gateway functionality
    for a satellite or grocery store.


    # User management


    Users must be authenticated, and there must be a control point for determining
    their role based desktop capabilities. If secure, offline capability is required
    in the branch, and then this server functionality is a necessity. In addition,
    the application would have to have access to the user roles in order to determine
    what limits on functionality should be applied to a given user. One example of
    this is for overrides. A head teller or branch manager may be allowed to override
    an offline transaction limit for a customer. A person with this higher level of
    authority would have to be defined as a separate role, and the specific characteristics
    of the role need to be made available for use by the application.


    # File and print services


    Application components may have to make use of these types of services under certain
    application design models. An example of such a requirement would be the need
    to share a laser printer among multiple tellers or platform officers. File sharing
    is also important, and may be critical for employees who move to various machines
    but still need access to previously created files.'
  merge: -1
