  md: '+   - Separate analysis from design: Analysis should be a separate process
    from design and have its own distinct work products. Solutions of this product
    should use analysis to form an entirely logical representation of system function
    that is independent of technology or implementation. This helps to retain the
    value of earlier development effort even if the implementation must change entirely.


    +   - Development methodology: A methodology for guiding the development process
