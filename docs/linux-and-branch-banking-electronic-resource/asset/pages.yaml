  md: 'Store and forward mechanism is used in branch systems to ensure that transactions
    can continue to be accepted in the branch when the connection to the transaction
    system of record is not available. This is typically due to the loss of communications,
    but could be for other reasons. A transaction record is stored in a database,
    log file, or electronic journal that contains all of the information that would
    normally be sent to the transaction system. It may also contain a time stamp or
    sequence number, or both. The forwarding mechanism is an automatic process that
    runs in the background to forward the transactions to the core transaction system
    when it becomes available. Although a branch server is a logical place to deploy
    a store and forward mechanism, some applications deploy this capability in each
    client. If communications with a regional or centralized server can be guaranteed
    to the required reliability level, the store and forward mechanism could be centralized.
    Another option would be not to have any capability and only handle transactions
    when the core transaction system is available to the branch.


    # Branch database services


    Some application models currently use a database in the branch that is required
    in offline mode. For example, some implementations of an electronic journal might
    use a database. In addition, a database may be used to store configuration data
    that is required during offline processing. Branch database services may not be
    required in more centralized application design models with limited options.


    # System management


    One of the primary roles for a branch server is the management of end-user desktop
    configurations. Rather than managing desktops directly, the server can be used
    to cache desktop configurations. When changes are made, the system management
    software running on the server can automatically update the desktops.


    # Middle-tier components


    In an e-business architecture, many of the application components of the system
    can be deployed in centralized servers. In this way, they can be shared by many
    branches, as well as by delivery channels. Some of these components are described
    at a high level in the following.


    # Application server


    An application server is the software component within an e-business architecture
    where an application''s business logic is executed. It acts as an intermediary
    between the end-user interaction components on the front-end and the data components
    on the back-end. In a banking branch system, there may be multiple application
    servers for different business needs.'
  merge: -1
  pgno: 56
- img_proc: true
  md: '# Messaging server


    A messaging server provides a common communications transport layer for all applications
    within the infrastructure. It can be used to provide routing based on business
    rules, as well as translation from one message format to another. Use of messaging
    server provides an integration point for tying disparate system components.


    # Database server


    A middle-tier database server provides the branch banking system with application
    and system data specific to servicing the branches or other delivery channels.
    The requirements for this database will be very dependent on the needs of various
    applications and the design of those applications. Some application design models
    may not require a middle tier database but obtain all required data from the back-end
    systems.


    # System management server


    A system management system in the middle tier is used to administer all system
    management functions for the branch system. Configurations for all desktops in
    the delivery system are administered through this server. When configurations
    change, the server is responsible for distributing those changes to the branch
    server, which in turn, administers changes to the individual desktops. In other
    system management designs, this server may be configured to manage desktops directly.
    In addition to configuration management, the server may also be a collection point
    for alerts generated by downstream components indicating failures or performance
    bottlenecks.


    # Back-end components


    The back-end components are not part of the branch banking system. They are enterprise
    systems that provide services required by the branch banking system. In order
    to complete the architecture of the branch banking system, all interfaces to the
    back-end systems need to be well defined and understood.


    # Integrated customer information


    Integrated customer information or customer information files (CIF) hold an integrated
    view of a customer''s total relationship with the bank.


    # Business analytics


    Business analytics can provide analysis of a customer''s financial holdings and
    transaction history to provide guidance on product suitability and financial risk.


    # Core transaction systems


    Core transaction systems provide account-level transaction capability and history.'
  merge: -1
  pgno: 57
- img_proc: true
  md: '# Enterprise security systems


    Enterprise security systems provide the information necessary to authenticate
    users and determine their system-level permissions.


    # 2.7 Summary


    The branch banking environment, which has not changed significantly over the last
    decade, is starting to go through a major transformation. This chapter has described
    some of the drivers for this transformation.


    In addition, it has provided general information about the structure of branch
    offices and the types of systems that have typically been in place to support
    them. We have also provided three different scenarios that represent how many
    banks operate their branch banking systems today.


    If you have been in the banking industry for very long, this chapter may not have
    provided you with much information that you were not already familiar with. However,
    it is important to provide this information as a basis for discussions in the
    upcoming chapters. The next chapter provides some specific information about branch
    banking requirements, and sets us up for the remainder of the redbook to discuss
    a Patterns for e-business approach to designing a solution and understanding where
    Linux can be an important piece of that solution.'
