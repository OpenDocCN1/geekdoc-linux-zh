- img_proc: true
  md: 'Meanwhile, Linux for zSeries extends the capability of Linux for S/390 into
    the 64-bit world and retains the unique ability to provide massively parallel
    implementations of thousands of “virtual Linux servers” all within a single enterprise
    server. This unique capability has been behind a number of significant customer
