  md: '# 2.1.1 Branch banking trends


    The banking industry has undergone significant changes in the past several years
    regarding delivery of retail products and services. A February 2002 article from
    TowerGroup, "Retail Bank Branch Renewal in the United States: The Market, Technology
    Directions, and Vendors", explained "There has been relatively little strategic
    investment in the retail bank branch infrastructure over the last ten years."
    They give four primary reasons for:


    +   - Emphasis on the continuous emergence of alternative delivery channels (Internet,
    cell phones, PDAs, and so on).


    +   - Existing technology, as OS/2, which has been the predominant operating system
    in branch banks for a number of years, has been reliable, stable, and has a low
    total cost of ownership. Also, 3270 terminals and 4700 controllers have reliable
    connections to the mainframe.


    +   - There has been little need for advanced technology in the branch, while
    banks were focused on alternative channels.


    +   - The pain factor involved in changing existing technologies includes the
    cost of new hardware and software, along with the training required to introduce
    new interfaces and business processes into the branch. Bank executives have been
    hesitant to change without a clear ROI for new investments.


    However, a number of factors have forced banks to rethink the strategic roles
    of their branch channel and to consider a major renewal of their existing technologies.
    The TowerGroup predicts, "In terms of absolute value, the biggest area of global
    spending over the next five years will be in branch renewal." Reasons for this:


    +   - The banks'' hope that the emerging call center and Internet channels lead
    to the elimination of a significant number of branches has not come to pass. Most
    have realized that the branch channel will continue to be a significant piece
    of a multichannel solution. However, due to the slowdown in branch spanning and
    the addition of other channels with a variety of architectures, the IT infrastructure
    of many banks is neither cost-effective nor suited to the demands of multichannel
    delivery. As stated in a recent article in The Banker magazine, "Integrating internal
    systems and multiple channels should be at the top of the list of the IT agenda
    for banks."


    +   - According to TowerGroup, "The second driver of branch renewal is the ultimate
    demise of OS/2 as the underlying operating system for automation solutions worldwide.
    Support of OS/2 and the hardware it resides will become increasingly expensive
    and difficult to acquire." Other obsolete technologies, such as 3270 emulation,
    IBM 4700 controllers, Windows 95/98, and in some cases even DOS or Windows 3.1,
    face similar issues.'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'Along these obsolete technologies, the need for new multichannel services,
    and the lack of investment and technological readiness combine to make the branch
    bank the largest channel for investment over the next years.


    Also, banks are seeking to derive greater value from the retail branch delivery
    system through transformation activities. These activities include increasing
    branch effectiveness, creating financial centers capable of developing and maintaining
    long-term relationships, and developing branch configurations that can meet the
    special needs of particular customer segments. Today''s retail branch delivery
    system infrastructures lack the required flexibility and are, at the same time,
    costly to maintain and operationatively intensive.


    # 2.2 Branch technology challenges


    In order to deliver the technology solutions that help achieve the business goals
    of branch transformation, bank IT providers are faced with three key challenges:


    +   - Cost


    +   - Quality of service


    +   - Speed to market


    # 2.2.1 Total cost of ownership


    Because cost is a key element of the value equation, banks are concerned that
    branch transformation solutions can be deployed at an affordable cost. There are
    two major areas of cost involved in branch transformation: solution deployment
    costs and ongoing operating costs.


    Solution deployment costs include the costs of new software (operating systems,
    middleware, and applications), hardware (clients, servers, and networks), and
    people costs (both internal and external) for integration, coding, installation,
    and education. Costs can be mitigated by reuse of the existing hardware and software
    infrastructure, minimizing hardware requirements, and keeping user interfaces
    and processes consistent to reduce training requirements.


    Ongoing ownership costs include systems management, service and support, upgrade
    costs for hardware and software, downtime due to defects, user errors, service
    interruptions, security problems, as viruses or denial of service attacks, and
    any resources and downtime in deployment of new tools or services. The key to
    reducing ongoing ownership costs is a manageable infrastructure that reduces people
    costs and has the flexibility to offer a wide range of choices and options for
    deployment of new or upgraded solutions.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# 2.2.2 Quality of Service


    Quality of Service (QoS) is important both in reducing costs and in providing
    high-quality customer service, which can be a competitive differentiator. Issues
    include security, availability, reliability, performance, and scalability. Security
    is of increasing concern due to new and more virulent viruses, hacking, and denial
    of service attacks. Availability, reliability, and performance all contribute
    to high-quality customer service, and scalability allows the bank to provide increased
    services without increasing costs or degrading performance. All of these are best
    achieved by an infrastructure that is flexible enough to allow the customer to
    make the right choices and trade-offs to optimize each of these Quality of Service
    parameters based on their particular needs.


    # 2.2.3 Speed to market


    In today''s competitive environment, banks are looking for a solution that enables
    them to quickly respond to changing market demands, whether it is by reconfiguring
    their branches around new delivery models, or rapidly deploying applications to
    support new revenue-generating products and services. A non-proprietary, open
    architecture that is flexible and allows centralized management and deployment
    of applications is essential to the rapid delivery of new business functionality.
    An e-business architecture that minimizes the dependency on distribution of code
    to client systems can provide an optimal solution.


    # 2.3 Branch transformation strategies


    Branch transformation can be defined as the updating, replacement or re-engineering,
    or both, of computer systems that support both staff and customers in the branch
    offices of retail banks.


    But, what are banks hoping to accomplish through their investments in the branch
    channel? Because branches do not seem to be going away, banks are seeking to deliver
    more value from their branches through a combination of initiatives to increase
    the revenue produced while decreasing the cost of delivering services through
    this expensive, yet necessary, channel.


    In order to drive additional revenue from their customers, banks know that they
    must improve their understanding of customers'' needs and offer them the right
    products and services at the right price. They also know that they must focus
    on customer satisfaction and improved service to retain and grow relationships
    with their most profitable customers.'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'To do this, banks are focused on a number of different initiatives:


    +   - Transforming the role of the branch from that of a transaction-oriented
    center to a relationship-oriented center capable of providing a broad range of
    products and services and focused on developing and maintaining long-term relationships.


    +   - Partnering with local businesses to offer innovative products and services
    from external partners.


    +   - Creating relationship teams to focus on the complete financial needs and
    issues of high-value customers, with the branch representative becoming a "relationship
    manager" and through collaboration, leveraging the collective knowledge and skills
    of the institution to meet the customers'' needs.


    +   - Developing flexible branch configurations based on the needs and value of
    specific customer segments.


    +   - Joining their branch and customer relationship management (CRM) initiatives
    to deliver better customer information to the branch and improve cross-selling
    at every touch point.


    While driving additional revenue is one part of the equation, banks are still
    acutely aware of the need to reduce branch costs. Because personnel account for
    a significant portion of branch expense, initiatives aimed at improving productivity
    and effectiveness are key to cost reduction objectives. These can include:


    +   - Re-engineering branch processes, such as teller, sales platform, and lending,
    or introducing new technologies, such as check capture, check copy, and optimized
    self-service deposit taking; in order to streamline processes and improve productivity.


    +   - Drive more transactions to lower cost channels and automate low-value, high-volume
    transactions through information kiosks, ATMs, and teller assist units.


    +   - Empower staff with guided tools to decrease the dependency on experts to
    deliver product and service information.


    +   - Use external suppliers to out source costly operational processes.


    +   - Offer remote access to specialists who can provide sophisticated financial
    planning and specialized product knowledge in order to mitigate the need for specialists
    in every branch.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '+   Improve employee productivity by delivering enterprise information and
    services online, including broadcast messages, announcements and alerts, HR services
    and information (intranet), e-mail, collaborative tools, static information (procedures
    manual, product information, forms, branch/ATM locator), bank directory (phone
    numbers, people, departments), and dynamic forms.


    These and other strategies are placing pressure on the bank IT providers to deliver
    IT solutions that not only deliver these capabilities, but also provide a flexible
    and scalable infrastructure that can quickly support whatever business initiatives
    the lines of business may undertake.


    # 2.3.1 Branch software strategy overview


    This section introduces some of the basic principles and assumptions for a branch
    transformation strategy and why they are important.


    # Build it to support multichannel


    We believe that as banks begin to look at how they will transform their branch
    delivery channels, many of them will seek to do so in the context of a larger,
    multichannel delivery strategy, a strategy that enables them to integrate all
    of their delivery channels and deliver all of their products and services in a
    consistent manner, regardless of the channel the customer chooses to use.


    Why is this important? Statistics tell us customers are multiple channel users.
    Therefore, a bank must endeavor to optimize each and every interaction with the
    customer, regardless of the channel, both to the advantage of the customer and
    to the bank itself. Such treatment is key not only to improving customer service
    and satisfaction, but also to solidifying long-term and profitable relationships.


    By looking at their branches as part of an overall delivery strategy, banks will
    be able to tailor branch services to meet the needs of the customers who use the
    branch, as well as develop a channel strategy that matches service levels to customer
    value, and set the appropriate goals for branch transformation.


    With in mind, the software strategy for branch transformation is built on the
    overall software strategy for a multichannel delivery system, with specific emphasis
    on providing solutions to unique issues related to the branch location and the
    channels it supports. On the other hand, although they may be thinking strategically,
    cost pressures and other immediate demands will cause banks to act tactically.
    The software strategy (in fact, the entire infrastructure strategy) must accommodate
    this and offer a value proposition for those who choose a more tactical approach
    to branch transformation.'
  merge: -1
  pgno: 32
- img_proc: true
  md: '![](img/f3b72f8072d00d967972ff147667688f_33_0.png)


    Figure-2 Built for multichannel


    We discuss multichannel considerations in more detail in 2.3.2, "Multichannel
    context" on page 21.


    # Build it based on e-business technologies


    The nature of the banking business is that the universal tool for the execution
    of nearly all business processes, marketing, sales, production, and distribution
    of financial products and services, is the information system. No other industry
    is better suited for e-business than the finance industry.


    Most financial institutions first encountered e-business technology when they
    began to use the Internet to provide electronic home and office banking facilities.


    As the second phase of home banking began to take hold in the mid to late 1990s,
    it quickly became that a "flat client" home banking application would have a huge
    maintenance and support challenge to banks. Banks that had any experience at managing
    a large network of PC-based clients deployed throughout their branches were uncomfortable
    with the prospect of distributing software to millions of clients PCs of unknown
    origin and providing technical support to millions of customers with limited technical
    skill. Luckily, the World Web began to access commercial commerce, and Internet
    technologies became popularly available to home users, making it possible to deliver
    home banking services through a Web browser. Although this did not mitigate the
    support issues, it helped home banking a viable and cost-effective delivery channel.


    When we look at branch networks today, many of the same issues that drove banks
    to choose the Internet to deliver banking services to home users still exist in
    the branch network: it is a large, distributed network with users of limited technical
    skill. Internet technologies have come a long way and have achieved a'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'level of maturity and robustness that make them not just the solution for self-service
    home banking, but also ideal as the technology infrastructure for the bank''s
    branch network and, therefore, for the entire multichannel delivery infrastructure.


    Moreover, leading banks recognize that a flexible, open, standards-based infrastructure
    will be essential to helping them retain their competitive edge in a marketplace
    that increasingly demands innovative business model deployment and rapid response
    to changing market dynamics.


    It is focused on the unique needs of the branch location. Banks have a history
    of managing large, distributed technology networks and are keenly aware of the
    costs associated with managing such a network and supporting a large community
    of relatively non-technical users. While they value flexibility and openness in
    their infrastructure, banks are also acutely focused on the need for a stable
    and operational environment underpinning their most visible and highly used channel.
    So, the challenge is twofold: providing a flexible infrastructure that will enable
    them to react quickly to, while delivering a stable, reliable, and manageable
    operational environment at a predictable cost of ownership.


    The adoption of e-business technologies, with server-based applications and thin
    clients (browser-based), helps to address some of the issues of software distribution,
    as well as simplifies the support required by internal help personnel. In addition,
    with increased bandwidth capabilities, it is now possible to central servers and
    still deliver satisfactory performance and reliability to the branches. Centralized
    servers communicating with thin clients can significantly reduce management burden
    that results in the high cost of delivering technology to the branch.


    On the other hand, we are aware that centralization of servers and totally thin
    clients may not be appropriate for all banks. Some banks will not be able to acquire
    reliable bandwidth in order to sustain the performance and availability they require.
    While desirable, thin clients may not be possible in the near term as a result
    of their dependence on existing client/server applications and productivity tools,
    such as the Microsoft Office, Lotus SmartSuite, and Lotus applications.


