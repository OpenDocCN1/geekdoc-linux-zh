    # ## 4.2.1 How to use Patterns for e-business


    As described in the previous section, Patterns for e-business are structured in
    such a way that each level of detail builds on the last. At the highest level
    are Business patterns that describe the entities involved in the e-business solution.
    A Business pattern describes the relationship between the users, the business
    organization or applications, and the data to be accessed.


    Composite patterns appear in the hierarchy shown in Figure 4-1 above the Business
    patterns. However, Composite patterns are made up of a number of individual Business
    patterns and at least one Integration pattern. In this section, we discuss how
    to use the layered structure of the Patterns for e-business assets.'
  merge: -1
  pgno: 82
- img_proc: true
  md: 'There are four Business patterns, as shown in Table 4-1.


    # Table 4-1 Business patterns


    | Business patterns | Description | Examples |

    |---|---|---|

    | Self-Service (User-to-Business) | Applications where users interact with a business
    via the Internet | Simple Web site applications |

    | Information Aggregation (User-to-Data) | Applications where users can extract
    useful information from large volumes of data, text, and so on | Business intelligence,
    knowledge management, Web crawlers |

    | Collaboration (User-to-User) | Applications where the Internet supports collaborative
    work between users | E-mail, community, chat, video conferencing, and so on |

    | Extended Enterprise (Business-to-Business) | Applications that link two or more
    processes across separate enterprises | EDI, supply chain management, and so on
    |


    It would be very convenient if all problems fitted nicely into the four Business
    patterns, but reality that things will often be more complicated. The patterns
    assume that all problems, when broken down into their most basic components, will
    fit more than one of these patterns. When a problem describes objectives that
    fit into multiple Business patterns, Patterns for e-business provide the solution
    in the form of Integration patterns


    Integration patterns allow us to tie multiple Business patterns to solve a problem.
    The Integration patterns are shown in Table 4-2.


    # Table 4-2 Integration patterns


    | Integration patterns | Description | Examples |

    |---|---|---|

    | Access Integration | Integration of a number of services through a common entry
    point | Portals |

    | Application Integration | Integration of multiple applications and data sources
    without the user directly invoking them | message brokers, workflow managers |


    These Business and Integration patterns can be combined to implement installation-specific
    business solutions. We call this a Custom design.'
