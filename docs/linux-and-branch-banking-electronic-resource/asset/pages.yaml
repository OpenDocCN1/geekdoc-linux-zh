    # 3.2 Business context


    The context diagram, shown in Figure 3-1 on page 52, covers the following essential
    elements of the branch banking system and its external interfaces:


    +   - Customers request services and support, as well as receive those services.
    Both activities can involve one or more channels


    +   - Tellers provide services and support to customers on one of the other channels.
    Therefore, they might no longer be a traditional teller behind a desk, but also
    a virtual teller in an online bank branch.


    +   - A platform officer provides services and support within the branch or central
    side, so they are more or less back-end support staff for front-end processes.
    These can also be online brokers, loan officers on the phone, and so forth.


    +   - Concierge or support staff in the branch is both for convenience of customers
    and tellers or officers in the branch, like any administrative process.


    +   - Enterprises can be a receiver or requester for services from or to a branch
    or bank overall.


    +   - Business partners provide services beyond the core scope of the branch for
    customer convenience and portfolio completeness.'
