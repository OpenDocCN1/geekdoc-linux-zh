  md: '# Branch banking environment


    This chapter provides an overview of the current state and structure of branch
    banking environments. It discusses the business pressures and challenges currently
    facing branch banking environments. We discuss the latests trends for approaching
    those issues, both from a business and a technical perspective. We also address
    the software strategy at the application level to solve the branch banking problems
    in a broader context of a multichannel solution.


    We also cover the organizational structures of such branch banking environments,
    because any solution that is put in place must meet the functional needs of the
    individuals that operate and manage the bank branch.'
