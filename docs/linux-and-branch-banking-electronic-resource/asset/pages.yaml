    # Selecting Patterns and product mapping


    After the appropriate Business pattern is identified, the next step is to define
    the high-level logical components that make up the solution and how these components
    interact. This is known as the Application pattern. A Business pattern will have
    multiple Application patterns identified that describe the possible logical components
    and their interactions. For example, an Application pattern may have logical components
    that describe a presentation tier for interacting with users, a Web application
    tier, and a back-end application tier.


    The Application pattern requires an underpinning of middleware that is expressed
    as one or more Runtime pattern. Runtime patterns define functional nodes that
    represent middleware functions that must be performed.


    After a Runtime pattern has been identified, the next step is to determine the
    actual product and platform to use for each node. Patterns for e-business have
    product mappings that correlate to the Runtime patterns, describing actual products
    that have been used to build an e-business solution for this situation.


    Finally, guidelines assist you in creating the application using best practices
    that have been identified through experience.


    For more information on determining how to select each of the layered assets,
    refer to the Patterns for e-business Web site at:


    http://www.ibm.com/developerWorks/patterns/'
