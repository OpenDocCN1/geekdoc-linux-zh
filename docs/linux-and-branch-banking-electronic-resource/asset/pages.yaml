  md: '# 3.4 Functional requirements


    The functional requirements of a banking branch system are those customer service
    functions required to open accounts, make inquiries on accounts, and provide transactional
    services. Branch banking requirements are usually split into two broad categories:
    teller and platform.


    Teller functionality includes taking deposits of cash and checks, providing cash
    and check withdrawals, paying loans, and so on. Platform functions include opening
    accounts, taking loan applications, and providing information about products and
    services. Although platform functionality is of more value to the bank because
    of the emphasis on bringing in revenue, teller functionality is somewhat more
    critical, because it involves a need for a consistent level of service where and
    when the customer requires it.


    Teller functionality is well defined, the application requirements are well known
    and fairly static. Teller requirements, on the other hand, from bank to bank and
    tend to change over time as new ways of providing information and selling to customers.
    Office productivity tools, such as word processors and spreadsheets, may handle
    some of these requirements. Tellers and platform officers, employees of the financial
    institution, may also have a need for indirect applications, such as HR, e-mail,
    and general information. Most of these can be handled by intranet access to a
    Web browser.


    In addition to the actual application functionality, other functional requirements
    include the ease and speed of changing or adding new functions and a requirement
    for providing consistent service across multiple retail delivery channels. These
    requirements have led to the recent innovations in providing multichannel functionality
    that can be reused in all others delivery channels.


    # 3.4.1 Operational considerations


    Operational considerations deal with qualities or constraints that an IT system
    must satisfy. These include service level requirements, such as reliability, availability,
    serviceability, security, scalability, performance, workload management, and systems
    management. This section provides some early details about the architecture elements
    needed to ensure that the non-functional requirements of the banking branch system
    are met.


    # Reliability, availability, and serviceability


    The availability expectations of a system relate to how many hours in the day,
    days per week, and weeks per year the system going to be available to its users
    and how quickly they should be able to recover from failures. In order to meet
    the reliability, availability, and serviceability (RAS) objectives, there should'
  merge: -1
  pgno: 70
- img_proc: true
  md: 'no single points of failure in essential system nodes. All application servers,
    database servers, messaging servers, and back-end servers would be deployed using
    redundancy, load balancing, and clustering technology. In the branch, the availability
    of users to work at any desktop would ensure that desktops would never be a single
    point of failure. If a desktop failed, the user could move to a machine that is
    not in use.


    Persistent data should not be stored on desktops except for logging or backup
    purposes. Requirements for being operational in the face of multiple failures
    (for example, client and server or network) would be costly and may not be a justifiable
    expense. Servers are potentially a single point of failure and is why they should
    be used in backup scenarios with primary operation through redundant centralized
    servers, where the cost can spread over more users.


    Because of the redundant nature of the middle-tier and back-end system nodes,
    most planned maintenance can take place while the rest of the system remains online
    and available to end users. Desktops and other branch system nodes can be maintained
    during non-business hours.


    # Security


    The primary requirements for security must be achieved naturally in the branch
    system architecture. It must have a locked down desktop that only permits access
    to applications that are controlled by the server and the system administrator.


    In the preferred mode, users would not be able to load their own applications
    into the desktop. Any disks loaded by the user would be for data backup and would
    not be executable. Internet access would either not be allowed or would be accessible
    through a proxy server with sufficient network controls. File transfers initiated
    by the user would also not be allowed. In addition, the branch system must be
    customized to the role or roles allowed for a specific user, and therefore, access
    to information and transactional systems would be tightly controlled.


    Optionally, all communications between the branches and the regional or central
    data centers can be encrypted to ensure data confidentiality, and message authentication
    codes can be attached to all data communications to ensure that data is not altered.'
  merge: -1
  pgno: 71
- img_proc: true
  md: '# Performance


    A performance model must be used as a method of sizing the physical components
    of an IT Infrastructure. The performance model attempts to capture a combination
    of the application behavior and the non-functional requirements. The elements
    of a performance model include node performance, application performance, network
    performance, and database performance. These elements are explored more deeply
    as the architecture is detailed to the specification and physical implementation
    levels.


    # System management and maintainability


    System management and maintainability refers to the maintenance and administration
    of the branch software and hardware systems. It involves configuration management,
    application management and maintenance, and monitoring of all system nodes and
    application components for early detection of failure or performance deterioration.


    # Configuration management


    Configuration management deals with the tracking and deployment of hardware nodes
    and software components across the enterprise. For a large financial institution''s
    branch system, this can be a large undertaking involving 5,000 locations, more
    than 75,000 hardware nodes, and multiple system and application software footprints.


    # Application management and maintenance


    This is oftentimes viewed as part of configuration management. This involves the
    ability to update both system and application software components to meet changing
    business requirements, such as adding new functions and changing data formats.
    Application changes are made by generating new packages and including them in
    revised desktop definitions. System changes can be made using tools that are available
    to update the systems. In a branch system, the deployment of the deplets becomes
    very difficult. Specialized system management components and nodes may need to
    be defined when driving the architecture to the specification and physical level
    in order to simplify the deployment process.


    # System monitoring


    Agents that regularly poll the site and measure its response time will perform
    system monitoring. The system needs to be integrated to the centralized monitoring
    system so that branch systems-related alerts would be distributed in the same
    manner as other error conditions in the rest of the bank''s system.'
  merge: -1
  pgno: 72
- img_proc: true
  md: '# 3.5 Non-functional requirements


    The non-functional requirements of an IT system specify those aspects of the system
    that are not directly related to the application functionality. The primary non-functional
    requirements that need to be dealt with are service level requirements, such as
    capacity and performance (volumetric), availability, security, and system management.


    Other typical non-functional requirements include properties to ensure portability
    and maintainability and any system constraints. Typical system constraints include
    business constraints that the system must satisfy (for example, geographical location),
    existing technical standards, and technical "givens" that constrain the system
    architecture and design (for example, existing IT infrastructure).


    The non-functional requirements detailed in the following sections form the basis
    for the trade-offs and decisions made in the architecture and design of a representative
    banking branch infrastructure. They directly affect the choice and number of various
    components and the overall cost of the infrastructure.


    # 3.5.1 Cost of operation


    The costs, for both operations and technology, are one of the major drivers for
    decisions on all levels within a branch bank environment. While some of the following
    requirements have only implicit influence over overall costs, the total costs
    for the new solution need to meet business requirements. It is not unusual that
    the return on investment is required to be less than 12 months.


    A 1996 study by Gemini Consulting found that the cost to banks of financial transactions
    varies widely, depending on how they are accomplished. The study does not account
    for up-front costs, such as installing a PC banking system or building a bank
    branch office. 1


    > 1 http://news.mpr.org/features/199608/01_catlinb_banking/banktranscript.htm'
  merge: -1
  pgno: 73
- img_proc: true
  md: '![](img/f3b72f8072d00d967972ff147667688f_74_0.png)


    # ### 3.5.2 Capacity, performance, and scalability


    In a distributed system, such as a branch system, the emphasis is not so much
    on the capacity of individual components in the branch, but on how the branch
    components integrate to the up-stream components. With the current state of technology
    for most application designs, performance is usually more affected by things such
    as communications bandwidth and the number of transactions aggregated from all
    branches to the performance of an in-branch server or end-user desktops.


    # ### 3.5.3 Reliability and availability


    Branch banks need to be available on a typical business schedule, usually five
    days a week, eight hours a day, excluding holidays. There may be extended hours
    one day a week or shortened hours on Saturday. During the time a branch is open,
    information systems need to be available essentially without failure. The total
    system uptime, including the ability to process some transactions when communications
    to back-end systems are not available, must approach 100%. If the branch cannot
    accept transactions in some manner manner, then it might as well close. Therefore,
    contingency plans and systems must be in place to cover any system component failure
    or temporary loss. For purposes of this document, the required maximum system
    failure recovery time is assumed to be few hours, and the required system restart
    time is assumed to be less than minutes. Because'
  merge: -1
  pgno: 74
- img_proc: true
  md: 'the branches are open only during scheduled business hours, maintenance is
    easily scheduled during non-business hours.


    The middle-tier and back-end systems that support the branch channel must have
    reliability and availability characteristics that support the branch requirement.
    Because these systems also support other channels, such as the Interactive Voice
    Response (IVR), call center, and Internet, they are normally designed for virtual
    24x7 availability with the required reliability and redundancy to achieve those
    goals.


    # 3.5.4 Security


    The main security requirements of a banking system are as follows:


    +   - Local and remote user authentication


    +   - Functions authorization based on roles


    +   - Data confidentiality


    +   - Protection from malicious or fraudulent attacks


    Detailed security requirements can be very specific to a particular bank, because
    the ways in which security is implemented in the enterprise will vary widely.
    Other considerations, such as single signon and the need for data encryption,
    may also be dependent on specific policies, procedures, and network implementation.


    # 3.5.5 System management


    As with any IT system, the architecture needs to accommodate the ability to monitor
    all system components and respond to outages using automated procedures to the
    greatest extent possible. In the case of a branch system, there are some key specific
    requirements for achieving this goal, as follows:


    +   - The ability to update both system and application code automatically


    +   - The ability to restore a failed system to its pre-failure state


    +   - The ability to add new applications to previously installed systems


    +   - The ability to detect, diagnose, and correct problems quickly with minimal
    human intervention


    The distributed nature of a branch system presents cost challenges for system
    management, because the number of end-user desktops is high, and there may be
    communication limitations in deploying common system management tools.'
  merge: -1
  pgno: 75
- img_proc: true
  md: '# 3.5.6 User and desktop management


    In a distributed system, such as a branch system, the administration of the environment
    might not be local to the branch, so a remote configuration of users, roles, applications,
    and desktop settings is required. This goes along with the ability to provide
    a consistent desktop for a user logging on to different physical machines, or
    multiple users logging on to a single machine at different times, a roaming user.


    Furthermore, a consistent look and feel needs to be accomplished, so users would
    not necessary realize which underlying platform their client machines are running
    on.


    # 3.5.7 IT standards and existing IT infrastructure


    IT infrastructure and IT standards constraints are very specific to individual
    banks or financial institutions. Common constraints are the choice of operating
    systems and hardware platforms, specific database products, network topology,
    security products and processes, and enterprise system management products. When
    drilling down to the specification and physical implementation architecture levels,
    the existing standards and infrastructure present constraints that will oftentimes
    affect the available choices for functional components or operational nodes. At
    the conceptual level, some typical choices have been made in this document that
    may or not be correct for a particular bank implementation.


    # 3.5.8 Geographic constraints


    Branch systems have the same constraints in virtually all geographies. Although
    urban settings in a specific country or region may have better infrastructure
    than cities in other parts, branch offices of large financial institutions may
    exist in rural areas with limited or cost prohibitive access to communication
    services. Therefore, the architecture will have to accommodate data communication
    reliability and availability limitations. Specific implementations of the architecture,
    however, may be able to take advantage of superior communication capability.


    # 3.6 Change cases


    Any potential future requirements that the system may have to support should be
    evaluated and validated to ensure that the architecture is able to accommodate
    them. IBM defines change cases as possible future changes to a system. In this
    document, change cases are used to indicate areas in which both functional and
    non-functional requirements may change for different banks, or in areas where
    emerging technologies may allow significant change in the system infrastructure.'
  merge: -1
  pgno: 76
- img_proc: true
  md: 'Proper focus on potential change cases ensures that the system is easy to extend,
    easy to maintain, robust in the face of change, and quick to develop. The focus
    is on what is important and likely, rather than what is possible. Change cases
    try to predict change. Such predictions rarely turn out to be exactly true. Users,
    sponsors, suppliers, developers, and other stakeholders determine the properties
    of a system. Changes can arise from many sources, for example:


    +   - Business drivers: New and modified business processes and goals

    - Technology drivers: Adaptation of the system to new platforms, integration with
    new components

    - Changes in the profile of the average user

    - Changes in the integration needs with other systems

    - Scope cases arising from the migration of functionality from external systems


    Because change cases are predictive, they are themselves subject to change. Were
    they 100% certain, they would, by definition, deferred requirements.


    # 3.7 Summary


    This chapter has described some of the requirements for a branch banking system
    from several different perspectives. These requirements will be used as input
    when we look at IBM Pattern for e-business that apply to branch banking solutions.


    Whether you use Patterns for e-business or another methodology to architect your
    solution, these requirements and ways of looking at them are still applicable.
    As shown in Chapter 6, “Linux-based products applicable to branch banking” on
    page 117, Linux can play a key role for building an infrastructure that meets
    these requirements.'
  merge: -1
  pgno: 77
