  md: '# Linux and Branch Banking


    Branch banking trends


    An IBM Patterns for e-business approach


    The vital role of Linux


    The banking industry is undergoing a major transformation to e-business, supporting
    a multichannel model for its delivery of services. As part of this transformation,
    there is a major focus on the branch IT infrastructure.


    In this very competitive environment, banks are looking for solutions that are
    cost effective, provide a high quality of service, allow them to speed up new
    products and services to market. In addition, they need to have a flexible and
    open environment in order to absorb the inevitable changes that occur over time.


    At the same time, Linux is gaining popularity and credibility as a robust and
    stable operating environment for many business-critical functions.


    This IBM Redbook services the current trends in branch banking, describes in detail
    IBM Patterns for e-business approach to designing the branch infrastructure of
    the future, and provides the reader with an understanding of how and where Linux
    can play a key role in branch banking infrastructures.


    ![](img/f3b72f8072d00d967972ff147667688f_175_0.png)


    INTERNATIONAL TECHNICAL SUPPORT ORGANIZATION


    BUILDING TECHNICAL INFORMATION BASED ON PRACTICAL EXPERIENCE


    IBM Redbooks are developed by the IBM International Technical Support Organization.
    Experts from IBM, Customers and Partners from around the world create timely information
    based on realistic scenarios. Specifications are provided to help you implement
    IT solutions more effectively in your environment.


    For more information: ibm.com/redbooks'
