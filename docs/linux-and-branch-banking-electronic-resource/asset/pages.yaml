    # 5.4.6 WSBCC and Eontec


    IBM and business partner Eontec have collaborated to combine WebSphere Business
    Components Composer (WSBCC) with the Eontec financial components. In the resulting
    solution, WSBCC multichannel business operations can launch a request to an Eontec
    financial component that can, in turn, use WSBCC Communication Services to integrate
    with other applications and data. Eontec and WSBCC can be used to create a multichannel
    application that supports the Self-Service business pattern.


    Eontec uses a J2-based architecture including stateless session beans and entity
    beans that implement bean-managed persistence. This approach allows the entity
    beans (under the Eontec framework) to adapt to alternative mechanisms to persist
    information, such as a database or through the use of other application services.
    The Eontec framework''s persistence layer uses services of the Eontec Financial
    Process Integrator component to integrate with'
  merge: -1
  pgno: 127
- img_proc: true
  md: 'services of enterprise applications. The Financial Process Integrator uses
    WSBCC Communication Services to access a larger framework of enterprise applications.


    For example, consider a request from a client received through the WSBCC multichannel
    presentation layer that invokes an Entec component that needs to populate itself
    with data that resides in another (for example, legacy) application. The Entec
    component will make a request to the Entec persister layer, which will be passed
    to the Entec Financial Process Integrator. The Financial Process Integrator uses
    its routing configuration information to determine which system or connector needs
    to be used to access the data and what transformation needs to occur before sending
    the request using WSBCC Communication Services, as well as after a response is
    received. These characteristics fit well with the description of the Self-Service
    Decomposition application pattern.


    The Self-Service Decomposition application pattern has one basic Runtime pattern
    associated with it, as shown in Figure 5-1 on page 76. This Runtime pattern emphasizes
    the separation of concerns between application functions provided by the Application
    Server node and integration functions provided by the Integration Server node.
    A literal interpretation of this pattern would typically lead to deployment of
    application services on one physical server and integration services on another,
    separate, physical server. A less strict interpretation of this pattern as a logical
    view could deallow for the possibility of deploying both application and integration
    services on a single physical server.


    The former, literal approach emphasizes hub and spoke integration services that
    are made available to a wide range of applications. This explicit tiering is optimized
    for loose coupling between application services and for providing a generalized
    set of enterprise-wide integration services. A physical hub and spoke configuration
    also maximizes the session concentration characteristics of the Decomposition
    Runtime pattern, typically reducing the total number of connections that need
    to be established with other existing applications. Figure 5-21 on page 114 is
    a representation of this approach.'
  merge: -1
  pgno: 128
- img_proc: true
  md: '![](img/f3b72f8072d00d967972ff147667688f_129_0.png)


    **Figure 5-21** Runtime pattern for Self-Service Decomposition pattern


    A strict interpretation of the Decomposition pattern could be implemented using
    integration services that are more tightly coupled to an overall application service
    framework and could be deployed on the same node as the application services.
    This approach could result in an infrastructure topology that is likely to be
    easier to implement and less complex. This simplicity could potentially give up
    some ground in the areas of the level of generalization of the integration services
    and in session concentration. WSBCC standardized Communication Services Reduces
    these concerns. A revised view of the Decomposition Runtime pattern is shown in
    Figure 5-22 on page 115. A notable feature of this revised topology is a single
    node labeled *Application & Integration Server*. This topology is very similar
    to the Self-Service Integrated Single Channel runtime pattern seen previously
    in this chapter.


    While WSBCC can support both interpretations of the Decomposition runtime pattern,
    the latter approach, where application services and integration services are deployed
    on the same physical server, is a commonly used approach to WSBCC deployment.
    When implementing this approach to the Runtime pattern, the server configuration
    would be similar to the revised view of the Decomposition Runtime pattern shown
    in Figure 5-22 on page 115.'
  merge: -1
  pgno: 129
- img_proc: true
  md: '![](img/f3b72f8072d00d967972ff147667688f_130_0.png)


    Figure 5-22 Revised view of the Runtime pattern


    As is common with many architectural decisions, there are some trade-offs to consider
    with these deployment alternatives. The physical hub and spoke integration services
    configuration in Figure 5-1 on page 76 is missing at a physical level but are
    preserved at a logical level. This is an important observation to consider. Regardless
    of the number of servers used to deploy WSBCC and Eontec, from the standpoint
    of the application/integration servers and existing applications, consistent integration
    techniques are used. One of the main differences between the two approaches will
    be in the number of connections that need to be established between the application/integration
    servers and existing applications. One of the important similarities in the two
    approaches is the use of a consistent set of integration techniques. In the case
    of a branch-level deployment, each branch''s application/integration server would
    establish its own connections to existing applications. In a centralized deployment
    scenario, the number of connections would be driven by capacity requirements and
    the degree of horizontal scaling employed.


    So far, the discussion of WSBCC and Eontec has focused on options for the deployment
    of application and integration services. WSBCC also provides


    # Chapter 5. Applying IBM Patterns for e-business to branch banking 115'
  merge: -1
  pgno: 130
- img_proc: true
  md: 'flexible deployment of presentation-related components. Presentation components
    can be deployed at execution time in a thin client approach by Java applets, or
    can be deployed using a zero footprint client approach by keeping presentation
    components on the server side. This allows Eontec financial application services
    to be made available on client machines with a wide range of capacities and physical
    characteristics.


    The flexibility in deployment options across all tiers combined with built-in
    financial application services makes WSBCC and Eontec a valuable alternative to
    consider as part of a banking transformation strategy at the branch or enterprise
