  md: '# Branch clients


    Some of these application characteristics, combined with the need to support mobility,
    leads to the use of technology that lets a user’s desktop follow them to whichever
    client machine they are working at. This can involve loading that from the operating
    system up to the applications, based on a user’s role and preferences.


    The range of application topologies requires a robust client machine, which imposes
    limits on the ability to deliver IT services through a wider array of channels.
    This can become a significant inhibitor to extending IT services to customers
    over the Internet.


    # Branch servers


    Branch servers have evolved capabilities to provide a personalized locked down
    desktop, as well as host-side application components and databases, host connectivity,
    and traditional file and print services. These features are aimed at the need
    to support a robust client desktop, as well as traditional two-tier client/server
    applications. Over time, some of these capabilities must be retained, as well
    the ability to provide a personalized, secured interface to application services,
    while others can be shed, as the capability of remotely loading an operating system
    and applications to a client desktop (as application architecture evolves to be
    client independent).


    # 5.3.2 Transformation strategies


    Over time, a bank transformation strategy is aimed at increasing the range of
    integrated application services available to users, while also increasing the
    range of channels through which these services are delivered. To accomplish this,
    application architecture and the underlying technology infrastructure need to
    follow a strategy to evolve away from dependence on a client or server configuration
    and deployment topology and toward consistent adoption of flexible, open standards
    and alternatives.


    Bank transformation will often take place in stages, with each step delivering
    specific short-term benefits, while being aligned to support a longer-term strategy.
    The first steps are likely to be driven by urgent near-term pressures, they need
    to be viewed in the context of the overall transformation strategy. Patterns for
    e-business are particularly useful in accelerating the identification of both
    near-term and strategic solutions, which increases the likelihood that short-term,
    as well as long-term, objectives are met.'
