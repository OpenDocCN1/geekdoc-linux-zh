    # # 7.2 Scenario solution


    Having fully understand all functional and non-functional requirements and using
    a methodology, such as Patterns for e-business, we might create an infrastructure
    such as the one shown in Figure 7-1 on page 137.


    We have created an integrated, multichannel, e-business-enabled application framework
    that can be deployed to the branch. Business logic was moved off the client and
    away from legacy applications open an open standard, Java-based infrastructure,
    ready to run on any platform supporting a browser and a Java Virtual Machine,
    including devices such as Web-based ATMs.


    All business logic resides in a component-based implementation that can easily
    be hosted either centrally or distributed to regional or even branch servers for
    speed, performance, or availability, based on network reliability and other requirements.
    The new middle-tier contains the connectors to any back-end system. There might
    be systems already in place today or systems that may be created in the future.
    By using an architecture that supports pluggable connectors, we have a flexible
    environment that can keep up with changing requirements.'
  merge: -1
