  md: '# 5.1 Starting to use Patterns for e-business


    Patterns for e-business let us describe the problem or problems we want to solve
    and the solution or solutions that can be used to address those problems. For
    example, Business patterns let us characterize the types of problems we want to
    solve in simple but powerful terms. After we have described the scope and nature
    of the problem or problems we want to solve, Patterns for e-business leads to
    solution alternatives in the form of Application and Runtime patterns. These patterns
    can be implemented through the use of well-known combinations of technology components
    (the Product mapping alternatives that are associated with Runtime patterns).
    At each point, we will need to make decisions about which pattern alternatives
    are the best choice for the situation, and for that, we will need some key information
    as input to the decisions.


    # 5.1.1 Describing the problem or patterns we want to solve


    The first step in applying Patterns for e-business is to establish which Business
    or Integration patterns, or both, are a good fit, in other words, which ones represent
    the problem or problems we are trying to solve. To make that choice, we need to
    look at the problem space, identifying key business and IT requirements. Those
    requirements will us make decisions about which Business and Integration patterns
    apply.


    The Business and Integration patterns describe common characteristics that are
    found in a broad range of business processes across multiple industries. One of
    the goals in defining these patterns was to apply an 80/20 rule: Ensure that these
    patterns could be applied to a majority of business processes in order to address
    a majority of a business''s needs. Because of this, we can be confident of finding
    a good match for a majority of banking process scenarios.


    # 5.1.2 The solution or solutions alternatives


    After we have described the problem space and determined which Business and Integration
    patterns apply, we will be ready to start looking at solution alternatives, in
    the form of Application patterns, for each of the Business and Integration patterns
    we have selected. The solution alternatives described in Patterns for e-business
    also identify technology component Product mappings that can be used to implement
    instances of the Runtime patterns. Once again, we have some decisions to make,
    and we will need to collect and summarize some key information as input into those
