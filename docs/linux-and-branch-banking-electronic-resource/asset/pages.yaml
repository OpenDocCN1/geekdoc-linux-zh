    The following lists, although not comprehensive, provide a summary of the types
    of business tasks that must be taken into account when defining the requirements
    for a branch banking solution.


    # Simple tasks


    Simple tasks are defined by two characteristics, one is the involvement of a single
    person, either a teller or a branch sales representative, and the other is a relatively
    straightforward forward transaction.


    Examples of simple tasks include:


    +   - Deposit of withdrawal for one account, where a teller enters the account
    number and the amount being transferred into the system


    +   - Clearing a check at the teller''s desk


    +   - Automatic money withdrawal on an ATM


    +   - Money transfer between two accounts within the bank or within the country'
  merge: -1
