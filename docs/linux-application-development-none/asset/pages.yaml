  md: '# Simple File Handling


    Files are the most ubiquitous resource abstraction used in the Unix world. Resources
    such as memory, disk space, devices, and IPC channels are represented as files.
    By providing a uniform abstraction of these resources, Unix reduces the number
    of software interfaces programmers must master. The resources accessed through
    file operations are as follows:


    # Regular files


    Regular files are the kind of files most computer users think of. They serve as
    data repositories that can grow arbitrarily and allow random access. Unix files
    are byte-oriented—any other logical boundaries are purely application conventions;
    the kernel knows nothing about them.


    # Pipes


    Pipes are Unix''s simplest interprocess communication (IPC) mechanism. Usually,
    one writes information into the pipe while another reads from it. Pipes are what
    shells use to provide I/O redirection (for example, `ls -LR | grep notes or ls
    | more`), and many programs use pipes to feed input to programs that run as their
    subprocesses. There are two types of pipes: unnamed and Named pipes are created
    as they are created and disappear once both the read and the write ends of the
    pipe are closed. Unnamed pipes are so called because they do not exist in the
    file system and, therefore, have no file name. Named pipes have file names,


    +   1. Under Linux, /proc file system includes information on every file currently
    open on the system. Although this means that unnamed pipes can be found in a file
    system, they still do not have permanent file names, because they disappear when
    the processes using them pipe end.'
