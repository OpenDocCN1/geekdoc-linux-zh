    you can use to find the name of the device file for the controlling terminal.
    On a Linux system, the virtual consoles are named /dev/ttyn for between 1 and
    63 (/dev/tty0 is always the current console).


    Complete documentation for the termcap and terminfo systems is available in termcap
    & terminfo [Strang, 1991B]. Eric Raymond currently maintains the termcap and terminfo
    databases, which he makes available via the Web at http://www.ccil.org/~ser/terminfo/
    The source code to ncurses (new curses, the implementation of curses used on Linux)
