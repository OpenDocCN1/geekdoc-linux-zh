  md: 'line over which you log in using a modem you might also use for dialing out
    via a modem, to talk to a serial printer, or to talk to some specialized piece
    of hardware.


    A tty device has two ends. The simplistic view is that one end is attached to
    the program and the other end is attached to the hardware device. This is true
    for a serial port; in this case, the serial device driver attaches the serial
    port (and thereby the terminal or modem) to a shell, editor, or other program.
    It is also true for the console; the console driver connects the keyboard and
    screen to the same types of programs. But in some cases, there is a program on
    each end; in these cases, one of the ends takes the place of hardware. For instance,
    with a network connection, one end of the tty device is connected to a program
    that provides the network connection, and the other end is connected to the shell,
    editor, or other potentially interactive program. When there is a program at each
    end, you need to keep a clear idea of which end is emulating hardware; in the
    case of network connections, the side that connects to the network is the hardware
    side.


    tty devices that have software at both ends are called pseudo ttys, or simply,
    ptys. For the first part of this chapter, you pretend that they do not exist,
    because the “software” end of a pty is handled like any tty device. Later on,
    we talk about programming the “hardware” end of a pty.


    # 15.1 tty Operations


    tty devices provide a large number of processing options; they are among the most
    complicated devices in the kernel. You can input processing, output processing,
    and data flow processing options. You can also control a limited amount of data
    manipulation that occurs at the device driver level.


    ttys operate in two basic modes: raw and cooked. Raw mode passes data to the application
    as it is received, with no changes made. Cooked mode, also known as canonical
    mode, provides a limited line editor inside the device driver and sends input
    to the application one line at a time. This mode is primarily derived from mainframe
    systems, in which dedicated input processing units provided cooked mode without
    interrupting the CPU at all.'
