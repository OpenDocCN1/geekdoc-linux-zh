  md: '# # Job Control


    Job control, a feature standardized by POSIX.1 and mandated by many standards,
    allows a single terminal to run multiple jobs. Each job is a group of one or more
    processes, usually connected by pipes. Mechanisms are provided to move jobs between
    the foreground and the background and to prevent background jobs from accessing
    the terminal.


    # ## 14.1 Job Control Basics


    Recall from Chapter 9 that each active terminal runs a single group of processes,
    called a session. Each session is made up of process groups, and each process
    group contains one or more individual processes.


    One of the process groups in a session is the foreground process group. The rest
    are background process groups. The foreground process group may be changed to
    any process group belonging to the session, allowing the user to switch among
    foreground process groups. Processes that are members of the foreground process
    group are often called foreground processes; processes that are not are called
    background processes.


    # ### 14.1.1 Restarting Processes


    Every process is in one of three states: running, stopped, or zombie. Running
    processes are terminated by calling the exit() system call or by being sent a
    fatal signal. Processes are moved between the running and'
