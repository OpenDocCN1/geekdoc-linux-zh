  md: '# 22.2.8 Drawing Lines and Boxes


    Although SLsmg_set_char_set() provides all the functionality needed to draw simple
    line graphics on a terminal, S-Lang provides some shortcut functions that are
    easier to use.


    ```

    void SLsmg_draw_hline(int row);

    void SLsmg_draw_vline(int column)

    void SLsmg_draw_box(int row, int column, int height, int width);

