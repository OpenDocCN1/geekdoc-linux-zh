    \ is relevant to any form of terminal I/O, as some users literal Control-S and\
    \ Control-Q characters to suspend and resume output.\n\nIXANY\n\nIf IXANY is set,\
    \ any received character (not just Control-Q) will restart output. This flag is\
    \ not specified by POSIX."
