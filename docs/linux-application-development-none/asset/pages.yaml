    # 10.3.4 Changing a File’s Access Permissions


    A file''s access permissions and access permission modifiers are changed by the
    chmod system call.


    ```

    #include <sys/stat.h>

    nint chmod(const char * pathname, mode_t mode);

    int fchmod(int fd, mode_t mode);

    ```


    Although chmod() allows you to specify a path, remember that file permissions
    are based on the inode, not on the file name. If a file has multiple hard links
    to it, changing the permissions of one the file’s names changes the file’s permissions
    everywhere it appears in the file system. The mode parameter may be any combination
    of the access and access modifier bits just discussed, logically OR’ed together.
    As there are quite a few of these values specified at a time, it is common for
    programs to specify the new permission value directly in octal. Only the root
    user and the owner of a file are allowed to change the access permissions for
    a file—all others who attempt to do so get EPERM.


