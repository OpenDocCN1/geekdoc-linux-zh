  md: '# 22.2.3 Moving the Cursor


    As in most programs, the terminal cursor is used by S-Lang as both the default
    location for text output and a cue for the user. S-Lang programs can move the
    cursor with the following code:


    ```

    extern void SLsmg_gotorc (int row, int column);

    ```


    Note that the upper-left corner of the screen is (0, 0) and the bottom-right corner
    (SLtt_Screen_Rows - 1, SLtt_Screen_Cols - 1).


    # 22.2.4 Finishing Screen Management


    When a program uses SLsmg has finished, it needs to tell S-Lang it is done, allowing
    S-Lang to free buffers and restore the terminal state. Before doing this, it is
    a good idea to move the cursor to the bottom of the screen and refresh the display
    to make sure all output has been shown to the user.


