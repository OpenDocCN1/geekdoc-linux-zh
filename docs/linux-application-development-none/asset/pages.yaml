    # 16.3 Basic Socket Operations


    Like most other Linux resources, sockets are implemented through the file abstraction.
    They are created through the socket() system call, which returns a file descriptor.
    Once the socket has been properly initialized, that file descriptor may be used
    for read() and write() requests, like any other file descriptor. When a process
    is finished with a socket, it should be close()ed to the resources associated
    with it.


    # 16.3.1 Creating a Socket


    New sockets are created by the socket() system call, which returns a file descriptor
    for the uninitialized socket. The socket is tied to a particular protocol when
    it is created, but it is not connected to anything. As it is not connected, it
    cannot yet be read from or written to.'
