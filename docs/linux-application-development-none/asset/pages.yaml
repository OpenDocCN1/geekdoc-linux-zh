    # 21.2 Regular Expressions


    Regular expressions, as used in sed, awk, grep, vi, and countless Unix programs
    through the years, have become a major part of the Unix programming environment.
    They are also available for use within C programs. This section explains how to
    use them and presents a simple file parser using these functions.


    Regular expressions have two flavors: basic regular expressions (BREs) and extended
    regular expressions (EREs). They correspond (roughly) to the grep and egrep commands.
    Both forms of regular expressions are explained in the grep man page, in the POSIX.2
    standard [IEEE, 1993], in A Practical Guide to Linux (Soboll, 1997), and in other
    places, we will not describe their syntax here, only the function interface that
    allows you to use regular expressions from within your programs.'
