    # 22.2.9 Using Color


    S-Lang makes it easy to add color to an application. It allows the user to use
    a palette of 256 entries, each defining a foreground and background color. Most
    applications use a palette entry for one type of rendered object, such as window
    frame or listbox entry. A palette''s colors are set through SLtt_set_color().


    ```

    void SLtt_set_color(int entry, char * name, char * fg, char * bg);

    ```


    The first parameter specifies the palette entry being modified. The name parameter
    is entirely ignored and should be passed as NULL. The final two entries name the
    new foreground and background colors for that palette entry. Table 22.2 lists
    the S-Lang supports; the fg and bg should both be strings containing the name
    of the color to use. All the colors on the left side of the table may be used
    for the foreground or background color. However, the colors on the right side
    should be used only for foreground colors. Using them for background colors will
    give unpredictable results.


    Writes to the screen are done using the current palette entry, which is set by
    the SLsmg_set_color() function.


    ```

    void SLsmg_set_color(int entry);

    ```


