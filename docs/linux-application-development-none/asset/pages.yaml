    # 6.2.2 Memory Alignment


    While Electric Fence did a fine job of finding the second problem in the code—namely,
    the strcpy() that overwrote its buffer by a large amount—it did not help us all
    in finding the first buffer overflow.


    The problem here has to do with memory alignment. Most modern CPUs require multibyte
    objects to start at particular offsets in the system’s RAM. For example, Alpha
    processors require that an 8-byte begin at an address that is evenly divisible
    by eight. This means that a long may appear at address 0x1000 or 0x1008, but not
    at 0x1005.


    Because of this consideration, malloc() implementations normally return memory
    whose first is aligned on the processor’s word size (4 bytes on 32-bit processors
    and 8 bytes on 64-bit processors) to ensure the caller can store whatever data
    it likes into the memory. By default, Electric Fence attempts to mimic this behavior
    by providing a malloc() that returns only addresses that are an even multiple
    of sizeof(int).


    In most programs, alignment is not all that is important, because memory allocations
    are done in increments that are already based on the machine’s word size, or of
    simple character strings, which do not have any alignment requirements (as each
    element is only one byte long).


    In the case of our test program, the first malloc() called allocate five bytes.
    For Electric Fence to meet its alignment restrictions, it must treat the allocation
    as a request for eight bytes and set up the memory with an extra bytes of accessible
    space after the malloc()ed region! Small buffer overflows in this region are not
    caught by this.


    As malloc() alignment concerns can normally be ignored and the alignment can allow
    buffer overflows to remain undetected, Electric Fence lets you control how alignment
    works through the EF_ALIGNMENT environment


    +   - Most traditional Unix systems deliver a bus error (SIGBUS) to a process
    that attempts to use misaligned data. The Linux kernel actually handles unaligned
    accesses that the process can continue normally, but at a large performance penalty.'
