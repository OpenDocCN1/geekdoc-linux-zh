    If you are writing a program that should suspend properly (normally when the user
    presses Ctrl-Z), this function will also be needed when SIGSTP is received. For
    more information on handling SIGSTPP properly, see Chapter 14.


    When you are developing programs with S-Lang, the program will likely crash more
    than once during your development, leaving your terminal in a nonstandard state.
    You can easily fix this by running the command stty sane.


    # 22.1.3 Reading Characters from the Terminal


    Once the terminal has been initialized properly, reading single keystrokes is
    straightforward. The function Slang_getkey() returns a single character from the
    terminal. Note that does not mean it returns a single keystroke—in Unix, many
    keystrokes return multiple characters. For example, on a VT100 terminal (as well
    as on other terminals, including the Linux console) pressing F1 sends four characters
    to the screen—ESC [ A (try running sleek and pressing F1 to see what characters
    it received). Those multiple-character sequences can be mapped to keystrokes via
    the terminfo database [Strang, 1991B].


    Slang_getkey() waits for a character to be present before returning. It will wait
    indefinitely. If an error occurs, the function returns 0FFFF rather than a valid
    character.³


    # 22.1.4 Checking for Input with Slang_input_pending()


    In many cases, you want to check for available characters without blocking. This
    is handy whenever a program needs to do background processing while polling the
    user for input (this is especially popular in video games). Slang_input_pending()
    is defined as follows.


    ```

    int Slang_input_pending(int timeout);

    ```


    Slang_input_pending() returns true if characters become available within n tenths
    of seconds. It returns as soon as the characters are available; it returns


    +   3. An error occurs if a signal is received while S-Lang is waiting for a keystroke.'
