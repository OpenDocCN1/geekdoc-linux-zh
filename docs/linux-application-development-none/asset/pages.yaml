  md: '# The Linux Console


    The Linux console normally imitates a serial terminal. By writing special character
    sequences to the console device, you control all aspects of the screen presentation.
    You will usually use S-Lang, curses, or some other screen-drawing library to draw
    to the screen; they use these escape sequences. The console can also be read and
    modified through an alternative full-screen interface, which is particularly useful
    for some specialized programs.


    DOS programmers introduced for the first time to Linux programming often are dismayed
    to find that writing characters to the screen is not a simple matter of initializing
    a pointer to the address of the screen in memory and writing blindly through it.
    Some complain loudly about this “backwards” system that forces them to pretend
    that they are writing to a serial terminal, writing escape sequences between the
    characters that are written to the screen to control cursor movement, color, screen
    clearing, and so on.


    There are several good reasons to treat the console as a fancy serial terminal.
    Not the least is when the program is being run on a serial terminal, it still
    works. More important—in these Internet-conscious times—the program runs correctly
    across networks and—in these GUI-conscious times—the program runs correctly in
    a terminal emulator window under X or any other GUI. Furthermore, programs that
    are run remotely, either via a network or a serial connection, display properly
    on your console.


    Furthermore, you will find that the escape codes are a reasonable low-level interface
    to the screen, and they are a good base on to build higher-level primitives, as
    S-Lang, documented in Chapter 22, and curses, documented in Programming with curses
    [Strang, 1991A]. This is no accident; serial terminals are a venerable technology,
    fine-tuned over the'
