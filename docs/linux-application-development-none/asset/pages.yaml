    The attributes and character contents are represented as alternating bytes, the
    first containing the character and the second containing the attributes to apply
    to the character. The attribute byte is normally defined like the attribute byte
    used by VGA hardware. Other kinds of hardware, including the TGA cards used on
    many Linux/Alpha machines and the SPARC console driver, emulate the VGA attribute
    handling. On video hardware without color support but with underline support,
    it can be read slightly differently; it is designed in such a way that you can
    pretend that it is all VGA hardware, and all other hardware will behave somewhat
    reasonably.


    For each attribute byte, the bits are interpreted as documented in Table 20.12.
    That is the VGA representation; some color hardware replaces blink by a bright
    background. The monochrome representation uses bit 0 of the foreground color to
    indicate underline.'
