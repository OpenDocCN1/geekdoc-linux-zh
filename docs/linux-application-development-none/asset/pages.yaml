  md: '24.3 Option Aliasing 453


    # 24.3.1 Specifying Aliases


    Aliases are normally specified in two places: /etc/popt and the .pop file in the
    user''s home directory (found through the HOME environment variable). Both files
    have the same format, an arbitrary number of lines formatted like this:


    ```

    appname alias newoption expansion

    ```


    The appname is the name of the application, which must be the same as the name
    parameter passed to popGetContext(). This allows each file to specify aliases
    for multiple programs. The alias keyword specifies that an alias is being defined;
    currently pop configuration files support only aliases, but other abilities may
    be added in the future. The next option is the option that should be aliased,
    and it may be either a short or a long option. The rest of the line specifies
    the expansion for the alias. It is parsed similarly to a shell command, which
    allows \, " and '' to be used for quoting. If a backslash is the final character
    on a line, the next line in the file is assumed to be a logical continuation of
    the line containing the backslash, just as in


    The following entry would add a --text option to the grep command, as suggested
    at the beginning of this section.


    ```

    grep alias --text -i -n -E -2

    ```


    # 24.3.2 Enabling Aliases


    An application must enable alias expansion for poptContext calling popGetNextArg()
    for the first time. There are three functions that define aliases for a context.


    ```

    int popReadDefaultConfig(poptContext con, int flags);

    ```


    This function reads aliases from /etc/popt and the .pop file in the user''s home
    directory. Currently, flags should be NULL, as it is provided only for future
    expansion.'
