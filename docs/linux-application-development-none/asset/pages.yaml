    # 15.5.7 Control Characters


    Control characters are characters that have special meanings that may differ depending
    on whether the terminal is in canonical input mode or raw input mode and on the
    settings of various control flags. Each offset (except for VMIN and VTIME) in
    the c_cc array designates an action and holds the character code that is assigned
    that action. For example, set the interrupt to Control-C with code like this:


    ```

    ts.c_cc[VINTR] = CTRLCHAR(''C'');

    ```


    CTRLCHAR() is a macro defined as

    #define CTRLCHAR(ch) ((ch)&0xF)


    Some systems have a CTRL() macro defined in <termios.h>, but it is not defined
    on all systems, so defining our own version is more portable.


    We will use the ^C notation to designate Control-C.


    The character positions that are not specified by POSIX are active only if the
    IEXT local control (c_lflag) flag is set.


