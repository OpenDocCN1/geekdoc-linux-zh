  md: '# 2.3.7 License from software Incompatibilities


    Mixing code licensed with different licenses can sometimes be a problem. The problem
    does not occur when linking with shared libraries, but it definitely applies to
    creating derived works. If you are modifying someone else''s software, you have
    to understand their licensing terms. If you are trying to combine in one derived
    work two pieces of software that have different licenses, you have to determine
    if their licenses conflict. Again, this does not apply when you are writing your
    own code from scratch.


    If you are working with code licensed under the terms of the GPL or LGPL, you
    cannot include it in code licensed under a BSD-style license, because the GPL
    and LGPL forbid “additional restrictions,” and the BSD license contains additional
    restrictions (that is, beyond any in the GPL or LGPL) in regard to advertising
    and endorsement. Because of this conflict, many pieces of software are licensed
    under alternative terms—both the GPL and a BSD-style license terms are offered;
    you can choose with which licensing terms to comply.


    If the code licensed under the GPL or LGPL is included in a work derived from
    an MIT/X-style license, the entire derived work (for all practical purposes) must
    be licensed under the terms of the GPL or LGPL, respectively.


    There are many other potential incompatibilities. If you are in about what you
    are allowed to do with particular pieces of free software, do not be shy—ask the
    copyright owners. Remember that they can give you a license to use the software
    in any way they wish.'
  merge: -1
