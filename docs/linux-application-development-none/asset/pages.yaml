  md: '# Programming Virtual Consoles


    The Linux virtual console programming interface is modelled on the one provided
    with some versions of UNIX. It is not a complete implementation (though it is
    complete enough for source code compatibility with almost all programs), and it
    provides several valuable extensions.


    Linux can multiplex multiple terminal sessions over one screen and one keyboard.
    Special key sequences allow the user to control which terminal session is currently
    being displayed. Each of these login sessions has its own keyboard settings (such
    as whether the Caps Lock key is engaged), terminal settings (such as what the
    terminal size is, what the screen is in graphics mode, and what the fonts are),
    and device entries (such as /dev/tty1, /dev/vcs1, and /dev/vcsa1).


    The keyboard and terminal settings make up virtual consoles (VCs),¹ called because
    of their similarity to virtual memory, in which the system uses disk space to
    provide more usable memory than is physically present in the machine.


    Unless you wish to manage or manipulate VCs, you can skip this chapter. A few
    programming libraries manage VCs for you, but you may still need to know what
    they are doing behind your back, so that you work with them rather than against
    them.


    For instance, svgalib, a library for using graphics on several types of graphics
    controllers, has functions that do most of the basic VC manipulation for


