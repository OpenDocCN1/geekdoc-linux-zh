  md: '# 17.1 Telling Time and Dates 361


    struct tm * gmtime(const time_t *t)


    Short for Greenwich Mean Time, gmtime() converts a time_t value into a struct
    tm that expresses that time in UTC.


    struct tm * localtime(const time_t *t)


    localtime() acts like gmtime() except that it creates the struct expressed in
    terms of local time. Local time is defined for the whole system by the settings
    of the zoneinfo files, and can be overridden by a TZ environment variable by users
    who are working from a different time zone than the computer is.


    time_t mktime(struct tm *tp);


    mktime() converts a struct tm to a time_t, assuming that the struct tm expressed
    in terms of local time.


    time_t timegm(struct tm *tp);


    timegm() acts like mktime() except that it assumes that the struct is expressed
    in terms of UTC. It is not a standard function.


    double difftime(time_t time1, time_t time0);


    difftime() returns a floating-point number representing the difference in seconds
    between two time_t values. Although time_t is guaranteed to be an arithmetic type,
    the unit is not specified by ANSI C; difftime() returns the difference in seconds,
    regardless of the units of time_t.


    Four more functions are available to convert time between computer-friendly numbers
    and human-friendly textual representations. Again, the final one is not standard,
    despite its obvious general usefulness.


    char *astctime(struct tm *tp);


    char *ctime(time_t *t);


    asctime() and ctime() both convert a time value into a standard Unix date string
    that looks something like this:


    Sun Jun 17 23:17:29 1997


    In both cases, the string is 26 characters long and includes a final newline character
    and the terminating ''\00''.'
