  md: '# Chapter 9 The Process Model


    ![](img/03c623925f5ce79517eccfa53893f339_149_0.png)


    In order to manage all of these processes, the kernel needs to group the processes
    in ways more complicated than the simple parent/child relationship we have already
    discussed. These groupings are called **sessions and process groups**. Figure
    9.1 shows the relationship between sessions, process groups, and processes.


    # 9.6.1 Sessions


    When a user logs out of a system, the kernel needs to terminate all the processes
    the user had running (otherwise, users would leave a slew of old processes sitting
    around waiting for input that can never arrive). To simplify this task, processes
    are organized into **sessions**. The session’s ID is the same as the pid of the
    process that created the session through the `setsid()` system call. That process
    is known as the **session leader** for that session group. All of process’s descendants
    are then members of that session unless they specifically remove themselves from
    it. The `setsid()` function does not take any arguments and returns the new session
    ID.


    ```

    #include <unistd.h>


    pid_t setsid(void);

    ```'
