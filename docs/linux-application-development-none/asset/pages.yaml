    enforced by the kernel. It is purely a convention that all processes that access
    the file must follow. The other type, mandatory locking, is enforced by the kernel.
    When a process locks a file for writing, other processes that attempt to read
    or write to the file are suspended until the lock is released. Although this may
    seem like the more obvious method, mandatory locks'
