    Locks are treated differently from other file attributes. Locks are associated
    with a (pid, inode) tuple, unlike most attributes of open files, which are associated
    with a file descriptor or file structure. This means that if a process


    +   1. Opens a single file twice, resulting in two different file descriptors

    2. Gets read locks on a single region in both file descriptors

    3. Closes one of the file descriptors


    then the file is no longer locked by the process. Only a single read lock was
    granted because only one (pid, inode) pair was involved (the second lock attempt
    succeeded because process’s locks can never conflict), and after one of the file
    descriptors is closed, the process does not have any locks on the file!


    After a fork(), the parent process retains its file locks, but the child process
    does not. If child processes were to inherit locks, two processes end up with
    a write lock on the same region of a file, which file locks are supposed to prevent.


    File locks are inherited across an exec(), however. While POSIX does not define
    what happens to locks after an exec(), all variants of Unix preserve them.¹⁶


    +   16. The effect of fork() and exec() calls on file locks is the biggest difference
    between POSIX file locking (and hence lockf() file locking) and BSD’s flock()
    file locking.'
