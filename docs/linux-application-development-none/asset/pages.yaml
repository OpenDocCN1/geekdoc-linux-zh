    it can be piped through any of the other mpr utility programs


    mprcc converts the log into output grouped by call chain. A function chain is
    a list of all the functions that are currently active at some point in a program.
    For example, if main() calls getargs(), which then calls parsearg(), the active
    call chain while parsearg() is running is displayed as main:getargs:parsearg().
    For each unique call chain that allocated memory during a program’s execution,
    mprcc displays the number of allocations made by that chain⁸ and the total bytes
    allocated by that chain.


