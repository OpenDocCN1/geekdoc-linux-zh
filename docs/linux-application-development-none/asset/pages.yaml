    # 9.6 Sessions and Process Groups


    In Linux, as in other Unix systems, users normally interact with groups of related
    processes. Although they initially log into a single terminal and use a single
    process (their shell, which provides a command-line interface), users end running
    many processes as a result of actions as


    +   - Running noninteractive tasks in the background

    - Switching among interactive tasks via job control, which is discussed more fully
    in Chapter 14

    - Starting multiple processes that work together through pipes

    - Running a windowing system, such as the X Window System, which allows multiple
    terminal windows to be opened'
