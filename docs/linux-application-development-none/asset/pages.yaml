  md: "```\n#include <stdlib.h>\n#include <time.h>...\nsrand(time() + getpid());\n\
    for (...; ...; ... ) (\n    do_something(rand());\n)\n```\n\nIt is common to seed\
    \ the pseudo-random number generator with the current date, returned by the time()\
    \ function. time() returns the number of seconds since January 1, 1970, so the\
    \ seed changes once per second and is therefore unique over a long span (approximately\
    \ 49,710 days on a 32-bit computer). If you want to keep a program from acting\
    \ the same for two people who start it in the same second, add the current process\
    \ ID to the time.\n\nThe numbers subsequently returned by the rand() function\
    \ satisfy the mathematical property of random distribution but not of high entropy:\
    \ for large enough samples, they are relatively well distributed within the space\
    \ of possible 32-bit numbers, but it is possible to infer other numbers given\
    \ one number. This means that these kinds of pseudo-random numbers are useful\
    \ for almost every application that requests a random distribution of numbers.\
    \ This includes games, Monte Carlo methods (here it is important to save the seed\
    \ so that you or others can verify your results), and protocols that handle collision\
    \ by inserting random delays.\n\nNote that for debugging purposes, you may want\
    \ to save the seed used when calling srand() so that if a bug occurs that relies\
    \ on data produced by the rand() function, you can use the same seed to produce\
    \ the same stream of random numbers to reproduce the bug.\n\n# 18.2 Cryptography\
