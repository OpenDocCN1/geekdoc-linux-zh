    # 14.1.3 Handling Job Control Signals


    Although many applications can be stopped and restarted with no ill effects, other
    processes need to handle process stops and starts. Most editors, for example,
    need to modify many of the terminal parameters while they are running. When users
    suspend the process, they expect their terminal to be restored to its default
    state.


    When a process needs to perform actions before being suspended, it needs to provide
    a signal handler for SIGSTP. This lets the kernel notify the process that it needs
    to suspend itself.


    Upon receiving SIGSTP, the process should immediately perform whatever actions
    it needs to take in order allow suspension (such as restoring the terminal to
    its original state) and suspend itself. The simplest way for the process to suspend
    itself is by sending itself SIGSTOP. Most shells display messages that indicate
    which signal caused the process to stop, though, if the process sent itself SIGSTOP,
    it would look different from most suspended processes. To avoid this nuisance,
    most applications reset their SIGSTP handler to SIG_DFL and send themselves SIGSTP.


    Processes that require special code for clean suspensions normally need to perform
    special actions when they are restarted. This is easily done by providing a signal
    handler for SIGCONT, which performs such actions. If the process suspended itself
    with SIGSTP, special actions will probably include setting a signal handler for
    SIGSTP.


