    #  10.4.2 Creating Hard Links


    When multiple files in the file system refer to a single node, the files are called
    hard links to one other. All the file names must reside in the same physical file
    system (normally, this means they must all be on the same device). When a file
    has multiple hard links, each of the file names is an exact peer—there is no way
    to tell which file name was originally used. One benefit of this model is that
    removing one hard link does not remove the file from the device—it stays until
    all the links to it are removed. The link() system call links a new file name
    to an existing node.


    ```

    #include <unistd.h>

    int link(const char * origpath, const char * newpath);

    ```'
