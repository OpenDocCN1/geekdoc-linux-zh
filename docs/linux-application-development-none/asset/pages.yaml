    # 24.1.4 Leftover Arguments


    Many applications take an arbitrary number of command-line arguments, such as
    a list of file names. When popt encounters an argument that does not begin with
    a -, it assumes it is and adds it to a list of leftover arguments. Three functions
    allow applications to access such arguments:


    +   char * popgetArg(poptContext con);

    This function returns the next leftover argument and marks it as processed.


    +   char * poptPeekArg(poptContext con);

    The next leftover argument is returned but not marked as processed. This allows
    an application to look ahead into the argument list, without modifying the list.


    +   char ** popgetArgs(poptContext con);

    All the leftover arguments are returned in a manner identical to argv. The final
    element in the returned array points to NULL, indicating the end of the arguments.


    # 24.2 Error Handling


    All of the popt functions that can return errors return integers. When an error
    occurs, a negative error code is returned. Table 24.2 summarizes the error codes
    that occur. Here is a more detailed discussion of each error.'
