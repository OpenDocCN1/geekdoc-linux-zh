  md: '# Chapter 11 Directory Operations


    GLOB_ERR

    Returned if an error occurs (if the function cannot read the contents of a directory
    due to permissions problems, for example).


    GLOB_MARK

    If the pattern matches a directory name, that directory name will have a / appended
    to it on.


    GLOB_NOSORT

    Normally, the returned pathnames are sorted alphabetically. If this flag is specified,
    they are not sorted.


    GLOB_DOOFS

    If set, the first glob->gl_offs strings in the returned list of pathnames are
    left empty. This allows glob() to be used while building a set of arguments that
    will be passed directly to exec().


    GLOB_NOCHECK

    If no file match the pattern, the pattern itself is returned as the sole match
