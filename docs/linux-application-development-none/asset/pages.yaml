    Tutorials on vi and Emacs would take far too much space to include in this book.
    The excellent Practical Guide to Linux [Sobell, 1997] includes a detailed chapter
    on each editor. O''Reilly has published an entire book on each editor: Learning
    GNU Emacs [Cameron, 1996] and Learning the vi Editor [Lamb, 1990]. Here we will
    only compare Emacs and vi and tell you how to get online help for each.


    Emacs includes a comprehensive set of manuals that explains not only how to use
    Emacs as an editor, but also how to use Emacs to read and send email and Usenet
    news, to play games (its gomoku game is not bad), and to run shell commands. In
    Emacs, you can always execute commands, even commands that are not bound to keys,
    by typing the entire name of the command.


    In contrast, the documentation available for vi is less generous and less well
    known. It is exclusively an editor, but many powerful commands are bound to single
    keystrokes. You switch back and forth between a mode in which typing standard
    alphabetic characters causes them to be inserted in your document and a mode in
    which these alphabetic characters are commands; for example, you can use the h,
    j, k, and l keys as arrow keys to navigate your document.


    Both editors allow you to create macros to make your work easier, but their macro
    languages could hardly be more different. Emacs has a complete programming language
    called elisp (Emacs Lisp), which is closely related to the Common Lisp programming
    language. vi has a more span, stack-based language. Most users merely map keys
    to simple, one-line commands, but those commands often execute programs outside
    vi to manipulate data within vi. Emacs Lisp is documented in a huge manual that
    includes a tutorial; documentation for vi’s language is relatively sparse.


    Some editors allow you to mix and match functionality. You can use Emacs in a
    vi mode (called viper) that allows you to use the standard vi commands, and one
