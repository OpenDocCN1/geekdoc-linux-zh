  md: '# History of Linux Development


    People use Linux to mean different things. The most technically accurate definition
    is this:


    Linux is a freely distributable, Unix-like operating system kernel.


    However, most people use Linux to mean an entire operating system based on the
    Linux kernel.


    Linux is a freely distributable, Unix-like operating system that includes a kernel,
    system tools, applications, and a complete development environment.


    In this book, we use the second definition, as you will be programming the entire
    operating system, not just the kernel.


    Linux (by the second definition) provides a good platform from which to port programs,
    because its recommended interfaces (the ones we discuss in this book) are supported
    by nearly every version of Unix available, as well as by most Unix clones. After
    you learn the contents of this book, you should be able to port your programs
    to nearly every Unix and Unix-like system, with little extra work.


    On the other hand, after working with Linux, you may prefer to use only Linux
    and not bother port.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# Chapter 1 History of Linux Development


    Linux is not just another Unix. It is more than a good platform from Unix to port
    programs—it is also a good platform on which to build and run applications. Some
    of Linux''s advantages include the following:


    +   - Stable Linux kernel versions are clearly separated from experimental versions,
    and both are available to the general public. You can deploy known stable systems
    in a production environment. At the same time, experimental Linux versions are
    released on a frequent basis, allowing you to follow—and even participate in—the
    development of the operating system, if you want.

    - Source code for the whole base operating system is available for your inspection,
    use, and even modification.

    - Linux is controlled by a group of private individuals, not by a single corporation.
    Technical decisions are made on technical merits, not on marketing considerations,
    by people driven by technology. This means that Linux development moves very quickly,
    keeping pace with other complementary technology.

    - The Linux developer and user communities are large and generally eager to help
    newcomers.


    # 1.1 A Short History of Free Unix Software


    If you are to understand what it means to develop software for Linux, you will
    need a short history lesson. The lesson we present is simplified and biased toward
    the most important elements in a Linux system. For longer, even more coverage,
    you can read an entire book, A Quarter Century of Unix [Salus, 1994].


    In the early days of computing, software was as little more than a feature of
    the hardware. It was the hardware that people were trying to sell, so companies
    gave away the software with their systems. Enhancements, new algorithms, and new
    ideas flowed freely among students, professors, and corporate researchers.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# 1.1 A Short History of Free Unix Software 5


    It did not take long for companies to recognize the value of software as intellectual
    property. They began enforcing copyrights on their software technologies and restricting
    distribution of their source code. The innovations that had been seen as public
    property became fiercely protected corporate assets, and the culture of computer
    software development changed.


    Richard Stallman at the Massachusetts Institute of Technology (MIT) did not want
    any part of a world where software innovation was controlled by corporate ambitions.
    His answer to this development was to found the Free Software Foundation (FSF),
    in Cambridge, Massachusetts. The goal of the FFS is to encourage the development
    and use of freely redistributable software.


    The use of the word free in this context has created great confusion, however.
    Richard Stallman meant free as in freedom, not as in zero cost. He strongly believes
    that software and its associated documentation should be available with source
    code, with no restrictions placed on redistribution. To promote this ideal, he,
    with help from others, created the General Public License (GPL), a complete copy
    of which can be found in Appendix C of this book.


    The GPL has three major points:


    +   1. Anyone who receives GPled software has the right to obtain the source code
    to the software at no additional charge (beyond the cost of delivery).


    +   2. Any software derived from GPled software must retain the GPL as its license
    terms for redistribution.


    +   3. Anyone in possession of GPled software has the right to redistribute that
    software under terms that do not conflict with the GPL.


    An important point to notice about these licensing terms is that they do not mention
    price (except that source is not allowed to be an extra-cost item). GPled software
    may be sold to customers at any price. However, those customers then have the
    right to redistribute the software, including the source code, as they please.
    With the advent of the Internet, this right has the effect of keeping the cost
    of GPled software—even zero in many'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# Chapter 1 History of Linux Development


    cases—while still allowing companies to sell GPLed software and services, such
    as support, designed to complement the software.


    The part of the GPL that generates the most controversy is the second point: that
    software derived from GPLed software also must be GPLed. Although detractors refer
    to the GPL as a virus because of this clause, supporters insist that the clause
    is one of the GPL''s greatest strengths. it prevents companies from taking GPLed
    software, adding features, and turning the result into a proprietary package.


    The major project the FSF sponsors is the GNU''s Not Unix (GNU) project, whose
    goal is to create a freely distributable Unix-like operating system. There was
    little high-quality freely distributable software available for the GNU project
    when it was started, so project contributors began creating the applications and
    tools for the system rather than the operating system itself. As the GPL was also
    produced by the FSF, many of the key components of the GNU operating system are
    GPLed, but through the years the GNU project has adopted many software packages,
    such as the X Window System, the TeX typesetting system, and the Perl language,
    that are freely redistributable under other licenses.


    Several major packages, and a multitude of minor ones, have been produced as a
    result of the GNU project. The major ones include the Emacs editor, gcc compiler,
    bash, and gawk (GNU''s awk). The minor ones include the high-quality shell utilities
    and text-manipulation programs that users expect to find on a Unix system.


    # 1.2 Development of Linux


    1991, Linus Torvalds, a student at the University of Helsinki, initiated a project
    in order to teach himself about low-level 80386 programming. At the time, he was
    running the Minix operating system, designed by Andrew Tanenbaum, so keeping his
    system compatible with the Minix calls and file-system structure made his work
    much easier. Although he released the first version of the Linux kernel to the
    Internet under a fairly restrictive license, he was soon convinced to change his
    license to the GPL.


    The combination of the GPL license and the early functionality of the Linux kernel
    convinced other developers to help develop the kernel. A C-library'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# 1.2 Development of Linux 7


    implementation, derived from the then-dormant GNU library project, was released,
    allowing native user applications to be built. Native ports of gcc, Emacs, and
    bash quickly followed. In early 1992, you could install and boot Linux 0.95 on
    Intel machines without inordinate work.


    The Linux project was closely associated with the GNU project from the beginning.
    The GNU project''s source base became an extremely important resource for the
    Linux community from which to build a complete system. Although significant portions
    of Linux-based systems are derived from sources that include freely Unix code
    from the University of California at Berkeley and the X Consortium, many important
    parts of a functional Linux system come directly from the GNU project.


    As Linux matured, some individuals focused on easing the installation and usability
    of Linux systems for new users by creating packages, called distributions, of
    the Linux kernel and a reasonably complete set of utilities that constituted a
    full operating system. Manchester Computer Centre (of Manchester University in
    England) was one of the early leaders with the MCC distribution. The SoftLanding
    Systems (SLS) distribution followed, from which Slack descended. Slack was the
    first Linux distribution that users without significant Unix knowledge could install
    and maintain easily. Its popularity gave rise to a flood of computer books devoted
    to the development of Linux. Red Hat Linux, a relative latecomer in the Linux
    distribution world, is now one of the most popular distributions, because of its
    concentration on making Linux stable, secure, and easy to install and use.


    In addition to the Linux kernel, a Linux distribution contains development libraries,
    compilers, interpreters, shells, applications, utilities, and configuration tools,
    along with many other components. When a Linux system is built, distribution developers
    collect the tools from a variety of places to create a complete collection of
    all the software components that are necessary for a functional Linux system.
    Most distributions also contain custom components that ease the installation and
    maintenance of Linux systems.


    Many Linux distributions are available. Each has its own advantages and disadvantages;
    however, they all share the common kernel and development libraries that distinguish
    Linux systems from other operating systems. This book is intended to help developers
    build programs for any Linux system. Because all Linux distributions use the same
    code to provide'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# Chapter 1 History of Linux Development


    system services, program binaries and source code are highly compatible across
    distributions.


    One project that has contributed to this compatibility is the Linux Filesystem
    Standard (FSSTND), which specifies where many files ought to be kept and explains,
    in general terms, how the rest of the file system ought to be organized. A new
    version of this document, the Filesystem Hierarchy Standard (FHS) is being drafted.
    Information on both standards is available from http://www.pathname.com/fhs/


    # 1.3 Basic Lineage of Unix Systems


    Although the major portions of Linux comprise code developed independent of traditional
    Unix source bases, the interfaces that Linux provides were influenced heavily
    by existing Unix systems.


    In the early 1980s, Unix development split into two camps, one at the University
    of California at Berkeley, the other at AT&T''s Bell Laboratories. Each institution
    developed and maintained Unix operating systems that were derived from the original
    Unix implementation by Bell Laboratories.


    The Berkeley version of Unix became known as the Berkeley Software Distribution
    (BSD) and was popular in academia. The BSD system was the first to include TCP/IP
    networking, which contributed to its success and helped to convince Sun Microsystems
    to base Sun’s first operating system, SunOS, on BSD.


    Bell Laboratories also worked on enhancing Unix, but unfortunately, it did so
    in ways slightly different from those of the Berkeley group. The various releases
    from Bell Laboratories were denoted by the word System followed by a roman numeral.
    The final release of Unix from Bell Laboratories was System V (SysV); System V
    Release 4 (SVR4) provides the code base for most commercial Unix operating systems
    today.


    This forged development of Unix caused major differentiation in the system calls,
    system libraries, and basic commands of Unix systems. One of the examples of this
    split is in the networking interfaces that each operating system provided to applications.
    BSD systems used an interface known'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# 1.4 Linux Lineage


    as sockets allow programs to talk to one another over a network. By contrast,
    System V provided the Transport Layer Interface (TLI), which is completely incompatible
    with sockets but allows greater flexibility in many areas. This type of development
    greatly diminished the portability of programs across across versions of Unix,
    increasing the cost and decreasing the availability of third-party products for
    all versions of Unix.


    Another example of the incompatibilities among Unix systems is the ps command,
    which allows users to query the operating system''s process information. For BSD
    systems, ps aux gives a complete listing of all the processes running on a machine;
    on System V, that command is invalid, and ps -ef can be used instead. Of course,
    the output formats are incompatible with the command-line arguments.


    In an attempt to standardize all the aspects of Unix that had diverged because
    of the split development in this period (which is affectionately known as the
    Unix Wars), the industry sponsored a set of standards that would define the interfaces
    Unix provides. The portion of standards that deals with programming and system-tool
    interfaces is known as POSIX, and is issued by the Institute for Electrical and
    Electronic Engineers (IEEE).


    # 1.4 Linux Lineage


    "The best thing about standards is that there are so many to choose from." Linux
    developers had 20 years of history to examine when they designed Linux, and, more
    important, they had high-quality standards to reference. Linux was designed primarily
    according to POSIX; where POSIX left off, Linux generally follows System V practice,
    with a compatibility library that provides emulation of some BSD interfaces. Notable
    exceptions include: the networking interface, which is completely BSD and does
    not provide emulation of the System V TLI interface; and several of the utilities,
    including networking utilities, which follow the BSD model.


    System V provides the STREAMS interface, but Linux does not implement STREAMS
    because that interface has horrible performance, and its effects can be achieved
    in other ways. This missing misfeature has an effect on


    +   1. Andrew Tanenbaum, Computer Networks, Prentice Hall, 1981, page 168.'
  merge: -1
  pgno: 36
- img_proc: true
  md: 'the rest of the programming environment; Linux uses BSD ptys instead of System
    V ptys (the only difference is in how they are allocated); they are used the same
    way) because the System V ptys are built on clone devices that require STREAMS.


    The biggest difference between SVR4 and Linux, from a programming perspective,
    is that Linux does not provide as many duplicate programming interfaces. Even
    programmers coding exclusively for SVR4 systems generally prefer Berkeley sockets
    to TLI; Linux eschews the overhead of TLI and enforces sockets. Instead of the
    generic STREAMS interface, Linux provides stackable line disciplines and network
    drivers (in the kernel), removing the performance penalties of STREAMS while retaining
    its most-used and most-useful capabilities.'
  merge: -1
