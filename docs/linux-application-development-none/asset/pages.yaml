    If the effective uid of the process is 0, this call always succeeds. Otherwise,
    the IDs may be set to the saved uid or the real uid of the process. Note this
    call never changes the saved uid of the current process; to do that, use POSIX''s
    setuid() function, which can modify the saved uid.


