  md: '# 15.5 termios Reference 299


    If IMAXBEL is set, the alert (''\a'') character is sent whenever a character is
    received and the input buffer is already full. This flag is not specified by POSIX.


    # 15.5.5 Output Flags


    The output flags modify output processing only if OPOST is set. None of these
    flags are portable, because POSIX defines only OPOST and calls it “implementation
    defined.” However, you will find that real terminal handling applications often
    need output processing, and the output flags available under Linux are generally
    available on most Unix systems, including SVR4.


    The terminal code keeps track of the current column, which allows it to suppress
    extra carriage-return characters (''\r'') and convert tabs to spaces when appropriate.
    This current column is 0-based; the first column is column 0. The current column
    is set to 0 whenever a carriage return (''\r'') is sent or implied, as it may
    be by a newline character (''\n'') when ONLR or ONCR is set, or when the current
    column is set to 1 and a backspace character (''\b'') is sent.


    The flags that operate on c_oflag are as follows:


    +   OPOST

    This is the only output flag specified by POSIX, which says that it turns on “implementation-defined”
    output processing. If OPOST is not set, none of the other output mode flags are
    consulted and no output processing is done.


    +   OLCUC

    If OLCUC is set, lower-case characters are sent to the terminal as upper-characters.
    This flag is not specified by POSIX.


    +   ONCR

    If ONCR is set, when a newline character (''\n'') is sent, a carriage-return (''\r'')
    is sent before the newline. The current column is set to 0. This flag is not specified
    by POSIX.'
