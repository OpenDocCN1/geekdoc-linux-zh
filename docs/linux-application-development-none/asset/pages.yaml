  md: '# Memory Debugging Tools


    Although C is undisputed the standard programming language on Linux systems, C
    has a number of features that lead programmers into writing code with subtle bugs
    that can be very hard to debug. Memory leaks in which malloc()ed memory is never
    free()ed) and buffer overruns (writing past the end of an array, for example)
    are two of the most common and difficult-to-detect program bugs. This section
    presents a few debugging tools that greatly simplify the detection and isolation
    of such problems.


