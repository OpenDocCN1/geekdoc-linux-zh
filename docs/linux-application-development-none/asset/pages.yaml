    10:        Start SLANG tty handling, with:

    11:        -1 default interrupt character (normally, Ctrl-C)

    12:        0 no flow control, allowing all characters (except)

    13:            interrupt to pass through to the program

    14:        1 enable OPOST output processing of escape sequences

    15:    */

    16:    Slang_init_tty(-1, 0, 1);

    17:

    18:    while (ch != ''\'') {

    19:        ch = Slang_getkey();

    20:        printf("read: %c %02x\n", isprint(ch) ? ch : '','', ch);

    21:    }

    22:

    23:    Slang_reset_tty();

    24:

    25:    return 0;

    26:}

    ```


    This program assumes that /usr/include/slang contains all the S-Lang header files.
    If this is not the case for your system, you will need to change the code (and
    all other examples in this chapter) appropriately. When you hit'
