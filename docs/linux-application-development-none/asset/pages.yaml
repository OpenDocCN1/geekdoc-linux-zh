    # 16.5.7 Looking Up Port Numbers


    Part of the Internet standards are a set of well-known port numbers maintained
    by the Internet Assigned Numbers Authority (IANA).¹² Common Internet protocols,
    such as ftp, telnet, and http, are each assigned a port number. Most servers provide
    these services at the assigned numbers, making them easy to find. Some servers
    are run at alternate port numbers, usually to allow multiple services to be provided
    by a single machine.


    Linux systems include the file /etc/services, which maps protocols to port numbers.
    The most common way to access this file is through the getservbyname() function,
    which returns information on a particular service.


    ```

    #include <netdb.h>

    struct servent * getservbyname(const char * name,

    const char * protocol);

    ```


    The first parameter, name, is the service name about which the application needs
    information. The protocol parameter specifies the protocol that will be used.
    The services database contains information on other protocols (especially UDP);
    specifying the protocol allows the function to ignore information on other protocols.
    The protocol is usually the string "tcp", though other protocol names, such as
    "udp", may be used.


    > 12. See http://www.iana.org for information on the IANA.'
