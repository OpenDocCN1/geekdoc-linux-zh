- img_proc: true
  md: '# Chapter 3 More Information on Linux


    documents, in particular, are available in printed, hypertext, and plain-text
    formats.


    The Linux Usenet newsgroup hierarchy (comp.os.linux.*) can also be a useful source
    of information for people generally familiar with gleaming information from Usenet.
    If you wish to keep up with Linux progress, glance through comp.os.linux.announce
    at least a weekly basis.


    Since the majority of the software you are likely to be running on a Linux system
    comes from the GNU project, the BSD project, or the X project, much of the documentation
    is similarly divided. The GNU documentation format is Texinfo, which provides
    typeset and hypertext documentation from the same source, and also provides many
    pages, although the Texinfo documentation is usually kept up-to-date. The BSD
    project''s documentation is mostly in man pages. The official X distribution includes
    man pages and books that you can typeset and print, but not easily view online.
    Most X programmers and users use second-source documentation, including a well-known
    series of programming reference books published by O''Reilly.


    The Linux Documentation Project maintains a large Web site that is close to canonical
    as is anything in the Linux world. The project''s home site is http://sunsite.unc.edu/LDP,
    and it is mirrored at hundreds of other sites around the globe, giving almost
    everyone quick, relatively local access.


    The majority of the printable documentation issued by the Linux Documentation
    Project is made available on an irregular basis by various vendors under a variety
    of titles. In-1997, these books tend to be about 2,000 pages long. Linux Software
    Labs, Red Hat Software, and Yggdrasil are currently the three largest vendors
    of these books.


    Also, one vendor, Red Hat Software, sells a CD-ROM product called Linux Library
    that includes an indexed, browsable archive of various Linux documentation, including
    a snapshot of the entire LDP site.


    +   1. http://www.lsl.com

    2. http://www.redhat.com

    3. http://www.yggdrasil.com'
