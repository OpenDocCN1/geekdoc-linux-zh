  md: '# Other Documentation


    There is certainly a wealth of Linux-specific and Linux-oriented documentation
    available, but there is also plenty of applicable documentation that was not written
    specifically for Linux.


    # 3.6.1 GNU


    The Free Software Foundation’s GNU project has always emphasized documentation,
    and, like the LDP, it has an official format that is used for a large portion
    of its documentation. Texinfo was originally designed to produce two forms of
    output: typeset output and a simple hypertext format called info. You can now
    use it to produce HTML.


    Info files are read with an info reader. The GNU project includes a standalone
    info reader, appropriately called info;it has an interface similar to the info
    reader built into the Emacs editor. Several other editors, including jed, also
    include info readers. To learn how to use info, you can run info in HTML format.
    Alternatively, you can view a set of GNU documentation in HTML format on the LAD
    Web site at http://www.awl.com/cseng/books/lad/info/


    # 3.6.2 BSD


    Most BSD-derived documentation on a Linux system is in the form of man pages installed
    with programs originally written on BSD. The BSD 4.4lite source tree includes
    other supplemental documentation that is not in man page format; both the man
    pages and the supplemental documentation are available in printed form from O’Reilly
    [CSRG, 1994a] [CSRG, 1994b] [CSRG, 1994c] [CSRG, 1994d] [CSRG, 1994e].'
