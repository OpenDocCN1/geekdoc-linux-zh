  md: '# Parsing Command-Line Options


    Most Linux programs allow the user to specify command-line options. Such options
    perform a wide variety of functions but are fairly uniform in their syntax. Short
    options consist of a character followed by a single alphanumeric character. Long
    options, common in GNU utilities, consist of two characters followed by a string
    made up of letters, numbers, and hyphens. Either type of option may be followed
    by an argument. A space separates a short option from its arguments; either a
    space or an - separates a long option from an argument.


    There are many ways of parsing command-line options. The most popular method is
    parsing the argv array by hand. The getopt() and getopt_long() library functions
    provide some assistance for option parsing. getopt() is provided by many Unix
    implementations, but it supports only short options. getopt_long() function is
    available on Linux and allows automated-parsing of both short and long options.


    A library called exists specifically for option parsing. It includes a number
    of advantages over the getopt() functions.


    +   - It does not make use of global variables, which allows it to be used when
    multiple passes are needed to parse argv.

    - It can parse an arbitrary array of argv-style elements. This allows it to be
    used for parsing command-line-style strings from any source.

    - It provides a standard method of option aliasing. Programs that use pop can
    easily allow users to add new command-line options, which'
