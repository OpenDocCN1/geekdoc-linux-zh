  md: 'A serial port driver is generally implemented as an interrupt-driven piece
    of code in the kernel, to which programs talk through a specific device file.
    That does not have to be the case, however. For example, at least one SCSI-based
    terminal server exists that uses a generic interface to the SCSI protocol to have
    a user-level program that talks to the terminal server and provides access to
    the serial ports via ptys.


    Network terminals sessions are done in the same manner; the logind and telnetd
    programs connect a network socket to a pty master and run a shell on a pty slave
    to make network connections like tty, allowing you to run interactive programs
    over a non-tty network connection. The screen program multiplexes several pty
    connections onto one tty, which may or not itself be a pty, connected to the user.
    The expect program programs that insist on being in interactive mode on a tty
    to be run on a pty slave under the control of another program connected to a pty
    master.


    # 15.6.1 Opening Pseudo ttys


    Unfortunately, the process of opening pseudo ttys varies on different platforms.
    Linux follows the BSD model, rather than the SysV model. 256 pty devices are available,
    and to find the first open device, programs normally search through the devices
    in order by minor number. They do this by searching in the peculiar lexicographic
    manner demonstrated in the pty program included in this section.


    If 256 devices were always available, it might make programs faster if each program
    searched through the devices in a different order. Unfortunately, old versions
    of Linux, as well as many Unix variants and clones, provide only the first 64
    devices. Therefore, searching in order is a simple way to search correctly on
    all systems, however configured.


