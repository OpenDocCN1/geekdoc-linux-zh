  md: '# 306 Chapter 15 Terminals and Pseudo Terminals


    If neither ECHOK, ECHOKE, nor ECHO is set, the ECHOTL representation of the KILL
    character (^U by default) will be printed to indicate that the line has been erased.


    If ECHO and ECHOK are set but ECHOKE is not set, the ECHCTL representation of
    the KILL character will be printed, followed by a newline, which will be processed
    appropriately by OPOST handling if OPOST is set.


    If ECHO, ECHOK, and ECHOKE are all set, the line will be erased.


    See the description of ECHOPRT for another variation on this theme.


    The ECHOKE flag is not specified by POSIX. On systems without the ECHOKE flag,
    setting the ECHOK flag may be equivalent to setting both ECHOK and ECHOKE flags
    under Linux.


    ECHONL

    In canonical mode, if ECHONL is set, newline (''\n'') characters are echoed even
    if ECHO is not set.


    ECHOPRT

    In canonical mode, if ECHOPRT is set, characters will be printed as they are erased
    when the ERASE or WERASE (or KILL, if ECHO and ECHOKE are set) characters are
    received. When the first erased character in a sequence is received, a \ will
    be printed, and when the final erased character is printed (the end of the line
    is reached or a nonerasing character is typed), a / will be printed. So typing
    asdf, followed by two ERASE characters, followed by df, followed by a KILL character,
    would look like asdf\fd/fdsa/


    This is useful for debugging and using hardcopy terminals, as the original teletype,
    where the characters are printed on paper, and is otherwise useless. This flag
    is not specified by POSIX.


    ISIG

    If ISIG is set, the INTR, QUIT, and SUSP control characters cause the corresponding
    signal (SIGINT, SIGQUIT, SIGTSTP, respectively; see Chapter 13) to be sent to
    all the processes in the current foreground process group on that tty.'
