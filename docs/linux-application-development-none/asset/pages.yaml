    an individual user’s preferences. To relieve individual programs of the need to
    guess the permissions to use for a file, the system allows users to turn off particular
    permissions for newly created files (and directories, which are just special files).
    Every process has a umask, which specifies the permission bits to turn off when
    files are created. This allows a process to specify fairly liberal permissions
    (usually, world read and write permissions) and end up with the permissions the
    user would like. If the file is particularly sensitive, the creating process can
    specify more-restrictive permissions than normal, because the umask will never
    result in less-restrictive permissions, only in more-restrictive permissions.'
