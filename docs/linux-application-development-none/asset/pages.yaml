    which causes an error may need to be handled in some manner, if the glob() returns
    the error (thanks to GLOB_ERR), there is no way to restart the globbing operation
    encountered the encountered error. As this makes it difficult both to handle errors
    that occur during a glob() and also to complete the glob, glob() allows the errors
    to be reported to a function of the caller''s choice, which is specified in the
    third parameter to glob(). It should be prototyped as follows:


    ```

    int globerr(const char * pathname, int globerrno);

    ```


    The function is passed the pathname that caused the error and the errno value
    that resulted from one of opendir(), readdir(), or stat(). If the error function
    returns non-0, glob() returns with an error. Otherwise, the globbing operation
    is continued.


    The results of the glob are stored in the glob_t structure referenced by glob.
    It includes the following fields, which allow the caller to find the matched file
    names:


    +   - gl_pathc The number of pathnames that matched the pattern

    - gl_pathv Array of pathnames that matched the pattern


    After the returned glob_t has been used, the memory it should be freed by passing
    it to globfree().


    ```

    void globfree(glob_t * glob);

    ```


    glob() returns GLOB_NOSP if it ran out of memory, GLOB_ABEND if a read error caused
    the function to fail, GLOB_NOMATCH if no matches were found, or 0 if the function
    succeeded and found matches.


