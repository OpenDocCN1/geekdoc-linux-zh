    # 9.8 Creating Clones


    fork() is the traditional way of creating new processes in Unix, Linux also provides
    the clone() system call, which lets the process being duplicated specify what
    resources the parent process should share with its children.


    ```

    int clone(int flags);

    ```


    This is not much more than a fork(); the only difference is the flags parameter.
    It should be set to the signal that should be sent to the parent process when
    the child exits (usually, SIGCHLD), logically OR''ed with any number of following
    flags, which are defined in <sched.h>:


    +   - CLONE_VM: The two processes share their virtual memory (including the stack).


    +   - CLONE_FS: File-system information (such as the current directory) is shared.'
