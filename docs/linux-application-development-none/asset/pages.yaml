  md: '# More Information on Linux


    Eventually, you will want to know something about Linux that this book does not
    cover. Finding Linux information is not hard unless you do not know where or how
    to look.


    When you look for Linux information, you must realize that Linux was designed
    and created on the Internet, so most Linux documentation was designed for the
    Internet. Even if you have local sources of information, most of them will have
    been designed originally as online, Internet-available information sources. Your
    searches will be more successful if you keep this in mind, even if you limit yourself
    to printed documentation.


    The Linux Application Development Web site, http://www.awl.com/cseng/books/lad/,
    has updates to this book''s text, detailed information beyond this book''s scope,
    and pointers to more information all over the Internet. URLs given in this chapter
    may go out of date; when we are aware of dated URLs, we will post corrections
    on the Linux Application Development Web site.


    # 3.1 Overview of Linux Documentation


    One of the largest organized sources of information in the Linux world is the
    Linux Documentation Project (LDP). The LDP is responsible for the standard online
    manual pages (man pages), a set of LDP books on a variety of topics, and a large
    collection of HOWTO documents that cover hundreds of topics, with varying degrees
    of detail. The HOWTO'
  merge: -1
