    # 10.3.6 Changing a File’s Timestamps


    A file’s owner may change the mtime and atime of a file to any arbitrary value.
    This makes these timestamps useless as audit trails, but it allows archiving tools
    like tar and cpio to reset a file’s timestamps to the same values they had was
    archived. The ctime is changed when the mtime and atime are updated, so tar and
    cpio are unable to restore it.


    There are two ways of changing these stamps: utime() and utimes(). originated
    in System V and was adopted by POSIX, whereas utimes() is from BSD. Both functions
    are equivalent; they differ only in the way the new timestamps are specified.


    ```

    #include <utime.h>

    utime(const char * pathname, struct utimbuf * buf);

    ```


    ```

