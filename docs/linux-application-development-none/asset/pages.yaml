  md: '# Chapter 10 Simple File Handling


    For many commands, `arg` is not used. We discuss most of `fcntl()`’s uses here.
    It is also used for file locking and asynchronous I/O, which are deussed in Chapter
    12.


    # 10.5.1 Changing the Access Mode for an Open File


    Both append mode (as indicated by the `O_APPEND` flag when the file is opened)
    and nonblocking mode (the `O_NONBLOCK` attribute) may be turned on and off after
    a file has already been opened through the `fcntl()`’s `F_SETFL` command. The
    `arg` parameter should be the flags that should be set—if one of the flags is
    not specified, it is turned off for fd.


    `F_GETFL` may be used to query the current flags for the file. It returns all
    the flags, including `F_SETFL` ignores extra flags that have been set in `arg`.
    This means that the code fragment


    ```

    fcntl(fd, F_SETFL, fcntl(fd, F_GETFL, 0) | O_RDONLY);

    ```


    is perfectly legal, but it does not accomplish anything. Turning on append mode
    for a file descriptor looks like this:


    ```

    fcntl(fd, F_SETFL, fcntl(fd, F_GETFL, 0) | O_APPEND);

    ```


    Note that care was taken to preserve the `O_NONBLOCK` setting. Turning append
    mode off locks similiar:


    ```

    fcntl(fd, F_SETFL, fcntl(fd, F_GETFL, 0) & ~O_APPEND);

    ```


    # 10.5.2 Modifying the close-on-exec Flag


    During an `exec()` system call, file descriptors are normally left open for the
    new program to use. In certain cases, you may wish to have files closed when you
    call `exec()`. Rather than closing them by hand, you can ask the system to close
    a certain file descriptor when `fcntl()`’s `F_GETFD` and `F_SETFD` commands. If
    the close-on-exec flag is set when `F_GETFD` is used, `fcntl()` returns non-0;
    otherwise, it returns 0. The close-on-exec flag is set through `F_SETFD`; it is
    disabled if `arg` is 0 and enabled otherwise.'
