    2. For the h and l sequences only, you can include a ? character to allow you
    to set or clear DEC Private modes (see page 398).

    3. You may provide up to 16 parameters. Parameters are decimal numbers separated
    by ; characters. 1:23:45 is a list of three parameters: 1, 23, and 45. (If the
    : parameter separator is found after 16 parameters have already been read, the
    CSI sequence is terminated immediately and the terminal goes into normal mode,
    printing the rest of the sequence).

