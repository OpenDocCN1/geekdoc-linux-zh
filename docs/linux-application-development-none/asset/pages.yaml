    Unnamed pipes are similar to named pipes, but they do not exist in the file system.
    They have no pathnames associated with them, and all their remnants disappear
    after the final file descriptor that references them is closed. They are almost
    exclusively used for interprocess communication between a child and parent processes
    or between sibling processes.


