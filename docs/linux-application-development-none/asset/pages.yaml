  md: '# Chapter 6 Memory Debugging Tools


    # 6.4 mpr and mcheck()


    A simple way to find all program’s memory leaks is to log all its calls to malloc()
    and free(). When the program has memory completed, it is straightforward to match
    each malloc()ed block with the point at which it was free()ed or report a leak
    if it was never freed. mpr takes this approach to finding memory leaks. To help
    find memory corruption as well, mpr includes a replacement malloc() library from
    the GNU project that includes some support for memory allocation debugging, which
    is enabled by calling the mcheck() function. When an application is linked against
    libmpr.a with the -mpr command-line option, mcheck() memory checking is automatically
    enabled well.


    # 6.4.1 Finding Memory Corruption with mcheck


    Finding memory problems with mpr’s malloc() library is straightforward as it is
    with Electric Fence. Instead of trapping memory corruption in hardware, malloc()
    places know sequences before and after the turned memory region. free() looks
    for these signatures and calls abort() if they have been disturbed. Running a
    program linked against mpr through gdb shows you exactly which memory regions
    have been corrupted, as those regions are properly free()ed. However, the mcheck()
    method does not pinpoint exactly where the corruption occurred; it is up to the
    programmer to figure out that. Linking our test program against mpr and running
    it under gdb yields the following results.


    ```

    $ gcc -gdb -o broken broken.c -lmpr

    $ gdb broken

    ```


