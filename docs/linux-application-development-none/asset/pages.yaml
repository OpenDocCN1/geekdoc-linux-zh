  md: '# Chapter 22 Terminal Handling with S-Lang


    # 22.2.1 Initializing Screen Management


    Before using S-Lang’s terminal output functions, a program must tell S-Lang to
    look up the current terminal (as determined by the TERM environment variable)
    in the terminal database. This is done by calling


    ```

    void SLtt_get_terinfo(void);

    ```


    One of the primary functions of SLtt_get_terinfo() is to set the physical size
    of the screen to the size listed in the terminal database. The number of rows
    and columns on the terminal are stored in SLtt_Screen_Rows and SLtt_Screen_Cols,
    respectively. Although the terminal database is often correct, resizeable terminals
    (as xterms) are popular these days, and once they are resized from the defaults,
    the terminal database no longer contains the correct size for the terminal. To
    compensate for this, S- programs must reset the values of SLtt_Screen_Rows and
    SLtt_Screen_Cols after the call to SLtt_get_terinfo(). Under Linux, the current
    terminal size is always available through the TIOCGWINSZ ioctl, which is discussed
    on page 295.


    Initializing the S-Lang’s screen management layer is straightforward: simple call


    ```

    void SLsmg_init_smg(void);

    SLsmg_init_smg();

    ```


    # 22.2.2 Updating the Display


    Before the results of a sequence of SLsmg routines gets reflected on the physical
    terminal, you must call the SLsmg_refresh() function. This function does not take
    any arguments or return a value, but it does update the physical terminal with
    the results of any screen drawing that has been done since the previous time it
    was called.'
  merge: -1
