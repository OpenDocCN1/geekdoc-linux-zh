  md: '# Chapter 12 Advanced File Handling


    MS_ASYNC

    The modified portions of the memory region are scheduled to be synchronized “soon.”
    Only one of MS_ASYNC and MS_SYNC may be used.


    MS_SYNC

    The modified pages in the memory region are written to disk before the msync()
    system call returns. Only one of MS_ASYNC and MS_SYNC may be used.


    MS_INVALIDATE

    This option lets the kernel decide whether the changes are ever written to disk.
    Although this does not ensure they will not be written, it tells the kernel that
    does not have to save the changes. This flag is used only under special circumstances.


    # 12.2.5 Locking Memory Regions


    Under Linux and most other modern operating systems, memory regions may be paged
    to disk (or discarded if they can be replaced in some other manner) when memory
    becomes scarce. Applications that are sensitive to external timing constraints
    may be adversely affected by the delay results from the kernel paging memory back
    into RAM when the process needs it. To make these applications more robust, Linux
    allows a process to lock memory in RAM to make these timings more predictable.
    For security reasons, only processes running with root permission may lock memory.
    If any process could lock regions of memory, a rogue process could lock all the
    system’s RAM, making the system unusable. The total amount of memory locked by
    a process cannot exceed its RLIMIT_MEMLOCK usage limit.


    The following calls are used to lock and unlock memory regions:


    ```

    #include <sys/mman.h>

    int mlock(addr_t addr, size_t length);

    int mall(int flags);

    int munlock(addr_t addr, size_t length);

    int munlockall(void);

    ```


