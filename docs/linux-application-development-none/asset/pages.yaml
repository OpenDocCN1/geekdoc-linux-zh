    \ output (that is, sending data to the computer), respectively, to avoid overflowing\
    \ the tty’s input buffers. This is relevant only to serial terminals, as network\
    \ and local terminals have more direct forms of flow control. Serial terminals\
    \ often have hardware flow control, which is controlled by the control flag (c_cflag)\
    \ and which makes software flow control (Control-S and Control-Q) irrelevant.\n\
