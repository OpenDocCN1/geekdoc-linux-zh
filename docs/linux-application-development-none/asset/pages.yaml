    # 6.2 Electric Fence


    The first tool we shall look at Electric Fence.¹ While it makes no attempt

    nto find memory leaks, it does a nice job of helping programmers isolate

    buffer overruns. Every modern computer (including all the computers

    that Linux runs on) provides hardware memory protection. Linux takes

    antantage of this to isolate programs from each other (your v1 session

    cannot access the memory of my gcc invocation, for example) and to safely

    share code code among processes by making it read-only. Linux''s mmap()² system

    allows processes to take advantage of hardware memory protection,

    as well.


    Electric Fence replaces the C library''s normal malloc() function with a ver

    sion that allocates the requested memory and (usually) allocates a section

    of memory immediately after this, which the process is not allowed to ac-

    ess! Although it may seem odd for a process to allocate memory that it is

    not allowed to access, doing so causes the kernel to immediately halt

    t process with a segmentation fault if the program tries to access the mem-

    ory. By allocating the memory in this manner, Electric Fence has arranged

    things so that your program will be killed whenever it tries to read or write

    p the end of a malloc() buffer. For full details on using Electric Fence,

    consult its man page (man life), which is very complete.


    +   1. Available from http://sunsite.unc.edu/pub/Linux/lang/c as well as with

    distributions.

    2. See Chapter 12 for details on mmap().'
