  md: '# 4.1 Editors 33


    # 4.1.1 Emacs


    Emacs comes in several flavors. The original Emacs editor was written by Richard
    Stallman, of Free Software Foundation fame. For years, GNU Emacs has been the
    most popular version. Recently, a more graphic-environment-aware variant of GNU
    Emacs, called XEmacs, has also become popular. XEmacs started life as Lucid Emacs,
    a set of enhancements to GNU Emacs managed by the now-defunct Lucid Technologies
    that was intended to be folded back into the official GNU Emacs. Technical differences
    prevented the teams from merging their code. The two editors remain highly compatible,
    and programmers on both teams regularly borrow code from each other. Because these
    versions are so similar, we refer to them as Emacs.


    The best way to become comfortable with the Emacs editor is to follow its tutorial.
    Run emacs and type ^h t (think “control-help, tutorial”). Type ^x c to exit Emacs.
    The tutorial will teach you how to get more information on Emacs. It will not
