  md: '# # Terminals and Pseudo Terminals


    Devices designed for interactive use¹ all have a similar interface derived from
    the one created decades ago for serial TeleType paper-display terminals and thus
    dubbed the tty interface. The tty interface is used for accessing serial terminals,
    consoles, xterms, network logins, and more.


    This tty interface is simple in concept but complex in implementation. It is flexible
    and powerful, which makes it possible to write applications that do not know much
    how they get their input and output and can run over over the network, on a local
    screen, or through a modem. Applications can even run under the control of another
    program without being aware of it.


    Unfortunately, it took the Unix implementors several tries to get the face right.
    They have left with three distinct interfaces for connecting to tty devices. The
    BSD sgty and System V termios interfaces have now been superseded by the POSIX
    termios interface, which is a superset of the termios interface. Because all current
    systems support the termios interface, and because it is the most powerful of
    the interfaces, we will document it only, not the earlier interfaces. (For the
    sake of supporting legacy source code, Linux supports termios, as well as termios.
    It also used to support the sgty interface in a limited way, but that support
    is being removed because it was never perfect, and because there is no longer
    significant demand for it.)


    Not only does the termios interface have to support interactive program use, but
    it must also support other kinds of data traffic. The same serial


    +   1. That is, devices used both for input and for output.'
