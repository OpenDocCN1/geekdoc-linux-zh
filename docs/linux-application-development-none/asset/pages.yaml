  md: '# 15.5 termios Reference 301


    # CLOCAL


    If CLOCAL is set, modem control lines are ignored. If it is not set, open() will
    block until the modem announces an off-hook condition by asserting the carrier-detect
    line.


    # CREAD


    Characters can be received only if CREAD is set. It cannot necessarily be unset.


    # CSIZE


    CSIZE is a mask for the codes that set the size of a transmitted character in
    bits. The character size should be set to:


    +   - CS5 for 5 bits per character

    - CS6 for 6 bits per character

    - CS7 for 7 bits per character

    - CS8 for 8 bits per character


    # CSTOPB


    If CSTOPB is set, two stop bits are generated at the end of each transmitted character
    frame. If CSTOPB is not set, only one stop bit is generated. Obsolete equipment
    that requires two stop bits is rare.


    # HUPCL


    If HUPCL is set, then when the final file descriptor on the device is closed,
    the DTR and RTS lines on the serial port (if they exist) will be lowered to signal
    the modem to hang up. This means, for example, when a user who logged through
    a modem then logs out, the modem will be hung up. If a communications program
    has the device open for outbound calls and the process closes the device (or exits),
    the modem will be hung up.


    # PARENB AND PARODD


    If PARENB is set, a parity bit is generated. If PARODD is not set, even parity
    will be generated. If PARODD is set, odd parity will be generated.


    If PARENB is not set, PARODD is ignored.


