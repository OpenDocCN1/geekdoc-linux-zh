  md: '# 15.5 termios Reference 303


    # VINTR


    Offset VINTR is usually set to ^C. It normally flushes the input and output queues
    and sends SIGINT to the members of the foreground process group associated with
    the tty. Processes that do not explicitly handle SIGINT will exit immediately.


    # VQUIT


    Offset VQUIT is usually set to ^\. It normally flushes the input and output queues
    and sends SIGQUIT to the members of the foreground process group associated with
    the tty. Processes that do not explicitly handle SIGQUIT will abort, dumping core
    if possible (see page 108).


    # VERASE


    Offset VERASE is usually set to ^H or ?. In canonical mode, it normally erases
    the previous character on the line. In raw mode, it is meaningless.


    # VKILL


    Offset VKILL is usually set to ^U. In canonical mode, it normally erases the entire
    line. In raw mode, it is meaningless.


    # VEOF


    Offset VEOF is usually set to ^D. In canonical mode, it causes read() on that
    file descriptor to return 0, signalling an end-of-file condition. On some systems,
    it may share space with the VMIN character, which is active only in raw mode.
    (This is not an issue if you save a struct termios with canonical mode settings
    to restore once you are done with raw mode, which is proper termios programming
    practice, anywhere.)


    # VSTOP


    Offset VSTOP is usually set to ^S. It causes the tty to pause output until the
    VSTART character is received, or if IXANY is set, until any character is received.


    # VSTART


    Offset VSTART is usually set to ^0. It restarts paused tty output.'
