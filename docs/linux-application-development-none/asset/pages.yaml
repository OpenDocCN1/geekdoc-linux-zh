  md: 'Conceptually, this is fairly straightforward. However, the age of the signal
    feature shows when you compare the different signal interfaces that are supported
    by the various flavors of Unix. BSD, System V, and System 3 supported different
    and incompatible APIs. POSIX defined a standard that is now supported by nearly
    all versions of Unix (including Linux), and all new code should be written for
    the POSIX signal API. This chapter discusses the original implementation of Unix
    signals before explaining the POSIX API, as many of the features in the POSIX
    API were motivated by weaknesses in earlier signal implementations.


    # 13.1 Signal Concepts


    # 13.1.1 Simple Signals


    Originally, setting signals was simple. The signal() system call is used to tell
    the kernel how to handle a particular signal:


    ```

    #include <signal.h>

    ```


    void * signal(int signum, void * handler);


    signum is the signal to handle, and handler defines the action to perform when
    the signal is sent to the process. Normally, the handler is a pointer to a function
    that takes no parameters and returns no value. When the signal is sent to the
    process, the kernel executes the handler function as soon as possible. Once the
    function returns, the kernel resumes execution wherever it was interrupted. System-level
    engineers recognize this type of signal mechanism as analogous to hardware interrupt
    delivery; interrupts and signals are very similar and present many of the same
    problems.


    There are many signal numbers available. Table 13.1 on page 248 lists all the
    signals Linux currently supports. They all have symbolic names that begin with
    SIG, and we use SIGFOQ when we talk about signals in general.


    The handler can take on two special values, SIG_IGN and SIG_DFL (both of which
    are defined through <signal.h>). If SIG_IGN is specified, the signal is ignored;
    SIG_DFL tells the kernel to perform the default action for the signal, usually
    killing the process or ignoring the signal. Two signals, SIGKILL'
