    sts_c_iflag &= ~BRKINT;

    sts_c_iflag |= IGNBRK;

    sts_c_iflag &= ~ISIG;

    ```


    Turning off BRKINT makes a difference only if robin is being called from a login
    session that is coming in another serial port, where a break can be received.
    Turning it off means the tty driver will not send a SIGINT to robin when a break
    condition occurs on robin''s standard input, since robin does not have anything
    useful to do when it receives a break.


    The IGNBRK function tells the tty driver to ignore breaks. Turning on IGNBRK is
    actually redundant. If IGNBRK is set, then BRKINT is ignored. But it does not
    hurt to set both.


    Those are input processing flags. We also modify a local processing flag: We turn
    off ISIG. This keeps the tty driver from sending SIGINTR, SIGQUIT, and SIGSTP
    when the responsive character (INTR, QUIT, or SUS) is received. We do this because
    we want those characters to be sent to the remote system (or whatever is connected
    to the serial port) for processing there.


    Next comes option processing, which is done with popt, discussed in Chapter 24.
    In some cases, the default modifications we made to the termios settings might
    not be sufficient, or they might be too much. In these cases, we provide some
    command-line options to modify the termios options.


    When robin is being used as a helper program by another program, any special character
    processing (robin usually interprets a control- character specially) may get in
    the way, so we provide raw mode to sidestep all such processing. On line 127,
    we provide a variable that determines whether raw mode is enabled, the default
    is not to enable raw mode. On line 139, we tell popt to inform us that the -r
    --raw option is given on the command line, enabling raw mode.


    Some systems require that you send them a carriage-return character to represent
    a newline. The word systems should be taken broadly; as an example, this is true
    of many smart peripherals, such as UPS, that have serial ports, because they were
    designed to function in the DOS world, where a carriage-return/newline pair is
    always used to denote a new line. Line 198 allows us to specify this DOS-oriented
    behavior.'
