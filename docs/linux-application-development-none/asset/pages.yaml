  md: '# 18.2 Cryptography and Random Numbers 373


    +   * To convince people who are not experts in cryptography that this is an area
    best left to experts.


    +   * To let experts in cryptography know that a particularly useful tool is available
    for their use.


    If you are not an expert in cryptography, but need to use it, we suggest Applied
    Cryptography [Schneier, 1996] as an excellent overview and introduction to the
    topic.


    Cryptography is generally no different from other software in its predictability
    requirements; when you give a program the key to decrypt data, you want it to
    decrypt the data same every time. There is one exception: choosing a truly random
    key. No matter how sophisticated an encryption algorithm is, it is worthless if
    an attacker can guess what key was used to generate the data. For example, many
    encrypted messages include some sort of timestamp that tells approximately when
    they were created. If you use the current time to seed a pseudo-random number
    generator, it would not take long for the attacker to decrypt the data by simply
    using the time when the message was created to seed common pseudo-random number
    generators and try keys based on those numbers.


    It does not work much better to ask a human to provide a key. In general, people
    pick keys that are hardly random. Their keys are generally related to natural
    language text, which is highly predictable in terms of information theory. Natural
