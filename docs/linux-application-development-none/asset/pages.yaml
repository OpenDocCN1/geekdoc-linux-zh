    collaborative work among users.


    The sticky bit, the least significant bit in the file permission modifier digit,
    has an interesting history before its name. Older Unix implementations had to
    load an entire program into memory before it could begin executing. It meant big
    programs had long startup times, which could get annoying. If a program had the
    sticky bit set, the operating system would attempt to leave the “stuck” in memory
    for as long as possible, even when the program was not running, reducing the startup
    time for those programs. Although this was a bit of a kludge, it worked reasonably
    well for commonly used programs, such as the C compiler. Modern implementations,
    including Linux, use demand loading to run programs that load the program by piece,
    making the sticky bit unnecessary, and so Linux ignores the sticky bit for regular
    files.


    The sticky bit is still used for directories. Usually, any user with permissions
    to a directory can erase any file in that directory. If a directory’s sticky bit
    is set, however, files may be removed only by the user who owns the file and the
    root user. This behavior is handy for directories that are repositories for files
    created by a wide variety of users, such as /tmp.


