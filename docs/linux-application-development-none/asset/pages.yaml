    # 17.2 Using Timers


    A timer is simply a way of scheduling an event to happen at some point in the
    future. Instead of looping around, looking at the current time, and wasting CPU
    cycles, a program can ask the kernel to notify it when at least a certain amount
    of time has passed.


    There are two ways to use timers: synchronously and asynchronously. The only way
    to use a timer synchronously is to wait for the timer to expire—sleeping. Using
    a timer asynchronously, like every other asynchronous facility, involves signals.
    What may surprising is that using a timer synchronously may also involve signals.'
  merge: -1
  pgno: 393
- img_proc: true
  md: '# 17.2.1 Sleeping


    Sleeping is when a process requests that it not be scheduled for at least a certain
    amount of time. Four functions are available for sleeping; each measures time
    in different units. They also have slightly different behavior and interact with
    other parts of the system differently.


    ```

    unsigned int sleep(unsigned int seconds);

    sleep() causes the current process to sleep at least seconds or until a signal
    that the process does not ignore is received by the process. On most platforms,
    sleep() is implemented in terms of the SIGALRM signal, and therefore it does not
    mix well with using the alarm() system call, creating a SIGALRM handler, SIGALRM
    signal, or using ITIMER_REAL interval timers (described later), share the same
    timer and signal.

    ```


    If sleep() does not sleep for the full time allotted, it returns the number of
    seconds left to sleep. If it has slept at least as long as requested, it returns
    0.


    ```

    void usleep(unsigned long use);

    usleep() causes the current process to sleep at least microseconds. No signals
    are used. On most platforms, usleep() is implemented via select().

    ```


    ```

    int select(int, NULL, NULL, NULL, struct timeval tv);

    select(), documented in Chapter 12, provides a portable way to sleep for a precise
    amount of time. Simply fill in the struct timeval with the amount of time you
    want to wait, and do not wait for any events to occur.

    ```


    ```

    int nanosleep(struct timespec *req, struct timespec *rem);

    anosleep() causes the current process to sleep at least the amount of time specified
    in req (see page 360 for timespec), unless a signal is received by the process.
    If nanosleep() terminates early due to a received signal, it returns -1 and sets
    errno to EINTR, if rem is not NULL, sets rem to represent the amount of time remaining
    in the sleep period.

    ```


    nanosleep() is currently the least portable of these functions, because it is
    specified as part of the POSIX.1b (previously called POSIX.4)'
  merge: -1
  pgno: 394
