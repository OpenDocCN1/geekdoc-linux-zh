  md: '# Chapter 9 The Process Model


    The two forms, exit() and _exit(), differ in that exit() is a function in the
    C library, while _exit() is a system call. The _exit() system call terminates
    the program immediately, and the exitCode is stored as the exit code of the process.
    When exit() is used, functions registered at atex() are called before the library
    calls _exit(exitCode). Among other things, this allows the ANSI I/O library to
    flush all its buffers.


    Registering functions to be run when exit() is used is done through the atexit()
    function.


    ```

    int atexit(void (*function)(void));

    ```


    The only parameter passed to atexit() is a pointer to a function. When exit()
    is invoked, all the functions registered with atexit() are called in the opposite
    order from which they were registered. Note if _exit() is used or the process
    is terminated due to a signal (see Chapter 13 for details on signals), functions
    registered via atexit() are not called.


    # 9.4.6 Killing Others


    Destroying processes is almost as easy as creating a new one—just kill it:


    ```

    int kill(pid_t pid, int sig);

    ```


    pid should be the pid of the process to kill, and sig describes how to kill it.
    There are two choices" for how to kill a child. You can use SIGTERM to terminate
    the process gently. This means that the process can ask the kernel to tell it
    when someone is trying to kill it so that it can terminate gracefully (saving
    files, for example). The process may also ignore this type of request for it to
    terminate and, instead, continue running. Using SIGKILL for the sig parameter
    kills the process immediately, no questions asked.


    The pid parameter can take on four types of values under Linux.


    ```

    pid > 0 The signal is sent to the process whose pid is pid. If no process exists
    with pid, ESRCH is returned.

    ```


