  md: '# Linux Console Capabilities


    The Linux console,² like most terminals, is **modal**: Its response to data depends
    on what mode it is in. By default, it prints on the screen characters you send
    to it unless it receives an escape or control character. A **control character**
    simply causes some action to be taken, the next character is read normally; there
    is no change in processing mode. An **escape character** signals the beginning
    of an escape sequence and changes the processing mode to escape mode.


    For example, consider the following C string:


    ```

    ""this is a line\n\033[1bold\033[0m\n"

    ```


    The console processes the string in the following sequence:


    +   1. Starting from the current cursor position, the console prints the words
    *this is a line*.


    +   2. It encounters the linefeed (\n) control character, so (because Linux and
    Unix traditionally operate in a mode in which a linefeed signals a carriage return,
    (as well) it moves the cursor to the beginning of the next line, scrolling the
    whole display up one line if the cursor is already on the bottom line.


    +   3. It displays the string "a " at the beginning of that line.


    +   4. It encounters the escape character, "\033", and moves into escape-mode.


    +   5. It reads the "[" character, and moves into **Command Sequence Introduction
    (CSI)** mode.


    > ²This description owes a considerable amount of organization to an excellent
    usenet post to the comp.os.linux.announce newsgroup by Peter Jones on September
    30, 1995.'
