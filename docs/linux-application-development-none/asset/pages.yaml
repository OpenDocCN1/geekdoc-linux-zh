    Not all platforms that provide the nanosleep() function provide high accuracy,
    but Linux, like other real-time operating systems, attempt to honor short waits
    with extreme accuracy for real-time processes. See Programming for the Real World
    [Gallmeister, 1995] for more information on real-time programming.


    # 17.2.2 Interval Timers


    Interval timers, once enabled, continually deliver signals to a process on a regular
    basis. Exactly what regular means depends on which timer you use. Each process
    has three interval timers associated with it.


    ITIMER_REAL


    Tracks time in terms of the clock on the wall—real time, regardless of whether
    the process is executing—and delivers a SIGALRM signal. It conflicts with the
    alarm() system call, which is used by the sleep() function. Use neither alarm()
    nor sleep() if you have a real timer active.


    ITIMER_VIRTUAL


    Counts time only when the process is executing—excluding any system calls the
    process makes—and delivers a SIGVTALRM signal.


    ITIMER_PROF


    Counts time when the process is executing—including the time the kernel spends
    executing system calls on the behalf of the process, but not including any time
    spent processing interrupts on behalf of the process—and delivers a SIGPROF signal.
    Accounting for time spent processing interrupts would be expensive that it would
    change the timings.'
  merge: -1
  pgno: 395
