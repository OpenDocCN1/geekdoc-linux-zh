  md: '# 15.1 tty Operations 269


    Cooked mode processes contain control characters; for example, by default,U kills
    (erases) the current line, ^W erases the current word, backspace (^H) or delete
    the previous character, ^R erases and retypes the current line. Each of these
    control actions can be reassigned to a different character. For instance, on many
    terminals, DEL (character 127) is assigned the backspace action.


    # 15.1.1 Controlling Terminals


    Every session (see Chapter 9) is tied to a terminal from which processes in the
    session get their input and to which they send their output. That terminal may
    be the machine''s local console, a terminal connected over a serial line, or a
    pseudo terminal that maps to an X window or across a network (see page 308 later
    in this chapter for more on pseudo terminals). The terminal to which a session
    is related is called the controlling terminal (or controlling tty) of the session.
    A terminal can be the controlling terminal for only one session at a time.


    Normal processes cannot change their controlling terminal; only a session leader
    can do that. Under Linux, a change in the session leader''s controlling terminal
    is not propagated to other processes in that session. Session leaders almost always
    set a controlling terminal when they initially start running, before they create
    any child processes, in order to ensure that all the processes in the session
    share a common controlling terminal.


    There are two interfaces for changing a session group leader''s controlling tty.
    The first is through the normal open() and close() system calls.


    +   - Close all file descriptors that reference the current controlling terminal.


    +   - Open a new terminal without specifying the O_NOCTTY flag.


    The other method involves ioctl() on separate file descriptors that reference
    the old and the new terminal devices.


    +   - TIOCNOTTY on a file descriptor tied to the original controlling tty (usually),
    ioctl(0, TIOCNOTTY, NULL) works fine. This breaks the bond between the session
    and the tty.'
