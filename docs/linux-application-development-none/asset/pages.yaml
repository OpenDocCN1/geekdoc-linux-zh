    # 22.2 Output Handling


    Internally, S-Lang''s terminal output functions are divided into two sets: terminal
    handling functions (the SLltt family) and higher-level screen management functions
    (the SLSmg family).


    The SLltt function works directly with the terminal; it includes functions that
    map closely with capabilities defined in the terminal database. It also includes
    routines for defining foreground and background color pairs and turning the cursor
    on and off. Only a few of these functions are normally used by application programmers;
    the rest are called internally by S-Lang.


    The SLSmg family provides a higher-level abstraction of the display terminal.
    Although these functions use the SLlt functions for terminal handling, they provide
    a much more powerful interface for application developers. These functions include
    string output, line drawing, and screen-querying functions. For performance reasons,
    these write to an internal buffer rather than directly to the terminal. When the
    application instructs S-Lang to update the physical terminal, S-Lang compares
    the new display to the original one and optimizes the output sequence appropriately.'
