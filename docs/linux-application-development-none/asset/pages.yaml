  md: '# 3.5 Mailing Lists 25


    +   - The unmoderated newsgroup comp.lang.c is intended for people discussing
    the C programming language without considering the operating system being used.


    # 3.5 Mailing Lists


    Mailing lists are email addresses through which email is redistributed to multiple
    other addresses. In general, anyone on a mailing list can send messages, which
    will be distributed to everyone else. Moderated mailing lists, like moderated
    newsgroups, require an administrator to approve each message before it is redistributed.


    Mailing lists are generally maintained with list-management software. Two of the
    most common list-management software packages are smartlist and Majordomo. In
    both cases, you may requests to subscribe or unsubscribe from the automatic list-maintenance
    software. There are two major differences between smartlist and Majordomo: the
    address, and the request format. To subscribe to a Majordomo list, send a message
    to majordomo@host.domain with a body (not subject) of subscribe lastname you@yourdomain.com.
    To subscribe to a smartlist list, send a message to list-request@host.domain with
    a subject (or first line body) of subscribe. When you are told about a mailing
    list, you will generally be told what software manages it or how to subscribe
    to it.


    Usually, when you subscribe to a list, you are automatically sent a message that
    tells you how to post and how to unsubscribe. Save that message in a place where
    you can find it!


    If you need help subscribing to a list or unsubscribing from a list, you can contact
    the list owner. Most lists have a lastname-owner address that is read by the person
    who maintains the list; sometimes, the address is owner-.


    The http://www.linuxhq.com/lnlists/ site archives contain many mailing lists that
    have Linux-specific content. This site also has a how-to-subscribe page at http://www.linuxhq.com/lnlists/subscribe.html
    which describes how to subscribe to the lists that the site archives.'
  merge: -1
