    # 9.4.4 A Bit of History: fork()


    Creating an entirely new execution environment can be quite expensive, especially
    on poor hardware that needs to make a copy of the entire addressable region. Linux,
    like other modern Unix systems, copies pieces of the process''s address space
    only when the need arises.¹


    As many of the fork() calls are immediately followed by the creation of a new
    virtual memory space through some flavor of exec(), some versions of Unix provide
    a version of fork() that does not copy the virtual memory region, providing a
    performance improvement. This variant leaves the memory mapping shared between
    the two processes. Its only additional semantic is not returning to the parent
    process until after the exit() call to help prevent the processes from conflicting
    with each other. Linux provides copy-on-write, which eliminates the need for this
    trick, it does not provide a fork() system call. Instead, vfork() is implemented
    as a simple fork() call by the C library to provide backward backward compatibility.
    Although this works for many applications, it does not provide vfork()''s additional
    semantic, which forces the child process to run first.


    # 9.4.5 Killing Yourself


    Processes terminate themselves by calling either exit() or _exit(). When a process''s
    main() function returns, the standard C library calls exit() with the value returned
    from main() as the parameter.


    ```

    exit(int exitCode)

    _exit(int exitCode)

    ```


    > ¹This is known as copy-on-write, which is discussed in most operating system
    texts [Valhelia, 1997] [Bach, 1986] [McKusick, 1996].'
