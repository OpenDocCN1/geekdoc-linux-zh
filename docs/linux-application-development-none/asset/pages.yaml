  md: '# Chapter 2 Licenses and Copyright


    in a license agreement. For example, many European countries explicitly allow
    reverse engineering of software and hardware for certain purposes, license terms
    restricting such activities notwithstanding. For this reason, most license agreements
    include a separability clause something like the following one, from the GPL:


    If any portion of this section is held invalid or unenforceable under any particular
    circumstance, the balance of the section is intended to apply and the section
    as a whole is intended to apply in other circumstances.


    Most license agreements use less comprehensible language to say the thing.


    Many people who attempt to write their own license terms without legal help write
    licenses with terms that have no legal force, and few of those licenses include
    a separability clause. If you wish to write your own license terms for your software,
    and if you care whether people comply with the license terms, have an intellectual-property
    lawyer vet your license terms.


    # 2.3 Free Software Licenses


    # 2.3.1 Combinations of Free and Commercial Software


    Different free-software license terms allow various types of commercial use, modification,
    and distribution. It is often desirable to reuse existing code in your own projects.
    To some extent, it is inevitable that you do so—almost any program that you will
    be linked with the C library, so you need to be aware of the licensing terms of
    the C library, as well as the terms of other libraries that you link with your
    program. You may often wish to include fragments of other programs'' source code
    in your own programs, as well.'
