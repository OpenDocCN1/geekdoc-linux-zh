    size_t strftime(char *s, size_t max, char *fmt, struct tm *tp); strftime() is
    like sprintf() for time. It formats a struct tm according to the format fmt and
    places the result in no more than max bytes (including the terminating ''\0'')
    of the string.


    Like printf(), strftime() uses the % character to introduce escape sequences into
    which data is substituted. All of the substituted strings are expressed in terms
    of the current locale. However, the escape sequences are completely different.
    In several cases, lowercase letters are used for abbreviations and upper-case
    letters are used for full names. Unlike printf(), you do not have the option of
    using numbers in the middle of an escape sequence to limit the length of the substituted
    string; %6A is invalid. Like strftime(), strftime() returns the number of characters
    printed into the s buffer. If it is equal to max, the buffer is not large enough
    for the current locale; allocate a larger buffer and try again.


    strftime() uses the same substitutions used by the date program. These definitions
    of the substitutions are for the default locale and are here to help you identify
    the type of information they provide; may be somewhat different in other locales.


    +   %a The three-character abbreviation for the name of the weekday.


    +   %A The full name of the weekday.


    +   %b The three-character abbreviation for the name of the month.


    +   %B The full name of the month.


    +   %c The preferred local expression of the date and time, as returned by ctime()
    and asctime().'
