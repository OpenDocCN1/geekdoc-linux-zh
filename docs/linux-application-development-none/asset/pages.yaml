  md: '# Linux Application Development


    This practical reference guides programmers developing Linux applications or porting
    applications from other platforms. Linux is fundamentally similar to Unix—therefore,
    most of the books cover ground familiar to Unix programmers—but this consistently
    addresses topics from a Linux point of view. The aim throughout is to provide
    the detailed information you need to take full advantage of Linux.


    +   - If you are already a proficient Unix programmer, this book will greatly
    facilitate your transition to Linux. You will also find helpful discussions of
    some tricky Unix topics, such as process and session groups, job control, and
    tty handling.

    - If you are a C programmer, but know neither Unix nor Linux, reading this book
    in its entirety and working with its numerous examples will give you a solid introduction
    to Linux programming.

    - If you are already a Linux programmer, this book''s clear treatment of advanced
    and otherwise confusing topics will surely make your programming tasks easier.


    Linux Application Development is divided into four parts. Part 1 introduces you
    to Linux—the operating system, licenses, and documentation. Part 2 covers the
    most important aspects of the development environment—the compilers, linker, loader,
    and debugging tools. Part 3—the heart of the book—describes the interface to the
    kernel and to the core system libraries, including discussion of the process model,
    file handling, directory operations, signal processing (including the Linux signal
    API), job control, the POSIX™ termios, sockets, and the Linux console. Part 4
    describes important development libraries with interfaces more independent of
    the kernel. The source code from the book is freely available at http://www.awl.com/cseng/books/lad/


    Michael K. Johnson and Erik W. Troan are developers for Red Hat Software, a leading
    provider of Linux software. Previously, Michael was the editor of the Linux Journal,
    and helped found the Linux Documentation Project. A Linux developer since its
    original release, he has written or contributed to standard Linux system components
    and now develops system software and configuration tools for Red Hat Linux™. Erik
    is Chief Developer at Red Hat Software. He has made significant contributions
    to Red Hat Linux™ for the Intel, Alpha, and SPARC platforms. He is a primary author
    of the RPM™ packaging tool, as well as many other Linux applications. He has been
    a regular columnist for the X Journal magazine. The authors are collectively responsible
    for the Linux flip archives.


    http://www.awl.com/cseng/books/lad/


