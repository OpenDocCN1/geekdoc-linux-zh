  md: '# 9.2 Process Attributes 97


    Setting the list of groups for a process is done through the `setgroups()`.system
    call and may be done only by processes running with root permissions.


    ```

    int setgroups(size_t num, const gid_t * list);

    ```


    The `list` parameter points to an array of `num` gids. The process''s supplemental
    group list is set to the gids listed in the `list` array.


    The `getgroups()` function lets a process get a list of the supplemental groups
    it belongs to.


    ```

    int getgroups(size_t num, gid_t * list);

    ```


    The `list` must point to an array of `gid_t`, which is filled in with the process''s
    supplemental group list, and `num` specifies how `num` gids can hold. The `getgroups()`
    system call returns -1 on error (normally, if `list` is not large enough to hold
    the supplemental group list) or the number of supplemental groups. As a special
    case, if `num` is 0, `getgroups()` returns the number of supplemental groups for
    the process.


    Here is an example of how to use `getgroups()`,


    ```

    gid_t groupList[NGROUP];

    int numGroups;

    ```


    ```

    numGroups = getgroups(NGROUP, groupList);

    ```


    A more complete example of `getgroups()` is in Chapter 26.


    This process has a uid, a primary gid, and a set of supplemental groups associated
    with it. Luckily, this is as much as programmers ever have to worry about. There
    are two classes of programs that need very flexible management of uids and gids,
    however: setuid/setgid programs and system daemons.


    System daemons are programs that are always running on a system and perform some
    action at the request of an external stimulus. For example, most World Wide Web
    (http) daemons are always running, waiting for a client to connect to it so that
    they can process the client''s requests. Other daemons, as the cron daemon (which
    runs requests periodically), sleep until a time they need to perform actions.
    Most daemons need'
