  md: '# Advanced File Handling


    Files are used for a large number of tasks in the Linux world, such as persistent
    data storage in regular files, networking through sockets, and device access through
    device files. The variety of applications for files has led to the development
    of many specialized ways of manipulating files. Chapter 10 introduced the most
    common operations on files, and this chapter discusses some more specialized file
    operations. In this chapter, we cover using multiple files simultaneously, mapping
    files into system memory, file locking, and scatter/gather reads and writes.


    # 12.1 Input and Output Multiplexing


    Many client/server applications need to read input from or write output to multiple
    file descriptors at a time. For example, modern Web browsers open many simultaneous
    network connections to reduce the loading time for a Web page. This allows them
    to download the multiple images that appear on most Web pages more quickly than
    consecutive connections would. Along with the IPC channel that graphical browsers
    use to contact the X server they are displayed on, browsers have many file descriptors
    to keep track of.


    The easiest way to handle all these files is for the browser to read from each
    file in turn and process whatever data that file delivers (a system call on a
    network connection, as a pipe, returns whatever data is currently available and
    blocks only if no bytes are read). This approach works fine, as long as all the
    connections are delivering data fairly regularly.'
