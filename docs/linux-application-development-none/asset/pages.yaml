  md: '# 13.2 The Linux (and POSIX) Signal API 245


    the interface for manipulating the signal mask, we will present a proper version
    of the code.


    The set of signals that a process is currently blocking is often called the process’s
    signal mask. The signal mask for a process is a sigset_t that contains the signals
    currently being blocked. The sigprocmask() function allows a process to control
    its current signal mask.


    ```

    #include <signal.h>

    ```


    ```

    int sigprocmask(int what, const sigset_t * set, sigset_t * oldset);

    ```


    The first parameter, what, describes how the signal mask is to be manipulated.
    If set is NULL, what is ignored.


    +   - SIG_BLOCK The signals in set are added to the current signal mask.

    - SIG_UNBLOCK The signals in set are removed from the current signal mask.

    - SIG_SETMASK Precisely the signals in set are blocked—the rest are blocked.


    In all three cases, the sigset_t pointed to by oldset is set to the original signal
    mask unless oldset is NULL, in which case oldset is ignored. The following finds
    the current signal mask for the running process:


    ```

    sigprocmask(SIG_BLOCK, NULL, &currentSet);

    ```


    The sigprocmask() system call allows us to fix the code presented earlier, which
    was afflicted by a race condition. All we need to do is block SIGHUP before we
    copy the string and unblock it afterward. The following change will render the
    code safe.'
