    As setuid(), the effective uid of the process is set to euid as the same as the
    saved or real uids of the process, or as long as the process''s effective uid
    at the time of the call is 0.


    When setuid() is used by a process whose effective uid is 0, all the process''s
    uids are changed to uid. Unfortunately, this makes it impossible for setuid()
    to be used in a setuid root program that needs to temporarily assume the permissions
    of another uid, because after calling setuid(), the process cannot recover its
    root privileges.


    Although the ability to switch uids makes it easier to write code that avoids
    compromising system security, it is not a panacea. There are many popular methods
    for tricking programs into executing arbitrary code [Lehey, 1995]. As long as
    the saved or real uid of a process is 0, such attacks can easily set the effective
    uid of a process to 0. This makes switching aids insufficient to prevent serious
    vulnerabilities in system programs. However, if a process can give up any access
    to root privileges by setting its effective, real, and saved IDs to non-0 values,
    doing so limits the effectiveness of any attack against it.


    # 9.2.3 The fsuid


    In highly specialized circumstances, a program may want to keep its root permissions
    for everything but file-system access, for which it would rather use a user''s
    uid. Linux''s user-space NFS server illustrates the problem that can occur when
    a process assumes a user''s uid. Although the NFS server used to use setuid()
    to switch uids while accessing the file system, doing so allowed the user whose
    NFS server was assuming to kill the NFS server. After all, for a moment that user
