  md: "# 24.1.2 Creating a Context\n\npopt can interleave the parsing of multiple\
    \ command-line sets. It allows this by keeping all the state information for a\
    \ particular set of command-line arguments in a popContext data structure, an\
    \ opaque type that should not be modified outside the popt library.\n\nNew pop\
    \ contexts are created by popGetContext().\n\n```\n#include <popt.h>\n```\n\n\
    ```\npoptContext popGetContext(char * name, int argc, char ** argv,\n    struct\
    \ popOption * options, int flags);\n```\n\nThe first parameter, name, is used\
    \ only for alias handling (discussed later). It should be the name of the application\
    \ whose options are being parsed, or should be NULL if no option aliasing is desired.\
    \ The next two specify the command-line arguments to parse. These are generally\
    \ passed to popGetContext() exactly as they were passed to the program's main()\
    \ function. The options parameter points to the table of command-line options,\
    \ which was described in the previous section. The final parameter, flags, is\
    \ not currently used but should always be specified as 0 for compatibility with\
    \ future versions of the popt library.\n\nA popContext keeps track of which options\
    \ have already been parsed and remain, among other things. If a program wishes\
    \ to restart option processing of a set of arguments, it can reset the popContext\
    \ by passing the context as the sole argument to popResetContext().\n\nWhen argument\
    \ processing is complete, the process should free the popContext as it contains\
    \ dynamically allocated components. The popFreeContext() function takes a popContext\
    \ as its sole argument and frees the resources the context is using.\n\nHere are\
    \ the prototypes of both popResetContext() and popFreeContext().\n\n```\n#include\
    \ <popt.h>\n```\n\n```\nvoid popFreeContext(poptContext context);\nvoid popResetContext(poptContext\
    \ context);\n```"
