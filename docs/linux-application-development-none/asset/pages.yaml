    ```

    int cfsetospeed(struct termios *t, speed_t speed);

    int cfisetpeed(struct termios *t, speed_t speed);

    ```


    Set the output or input speed, respectively, in t to speed. Note that this function
    does not change the speed of the connection on any file descriptor; it merely
    sets the speed in the termios structure. The speed, like other characteristics,
    is applied to a file descriptor by tcsetattr().


    These functions take a symbolic speed—that is, a number that matches the definition
    of one of the following macros whose names indicate the bits-per-second rate:
    B0 (0 bits per second indicates a disconnected state), B50, B75, B110, B134, B150,
    B200, B300, B600, B1200, B1800, B2400, B4800, B9600, B19200, B38400, B57600, B115200,
    B230400, or B460800. B57600 and higher are not specified by POSIX; portable source
    code uses them only if they are protected by #ifdef statements.


    More symbolic speeds will be added to the header file as Linux drivers are written
    for hardware that supports other data rates.


    Currently, input speed is ignored. The termios interfaces specify separate input
    and output speeds for some asynchronous hardware that allows split speeds, but
    little such hardware exists. Just call cfsetospeed() and cfisetpeed() in pairs
    so that your code will continue to work on systems that support split speeds.


    Not all tty supports all rates. In particular, the serial ports on standard PCs
