    but may be useful in special circumstances. tween the standard mmap() flags and
    Linux''s extra flags. All calls to mmap() must specify one MAP_PRIVATE or MAP_SHARED;
    the remainder of the flags are optional.


    MAP_ANONYMOUS Rather than mapping a file, an anonymous mapping is returned. It
    behaves like a normal mapping, but no physical file is involved. Although this
    memory region is not shared with other processes, nor is it automatically saved
    to a file, anonymous mappings allow processes to allocate new memory for private
    use. Such mapping is often used by implementations of malloc(), as well as by
    more-specialized applications. The fd parameter is ignored if this flag is used.


    MAP_FIXED If the mapping cannot be placed at the requested address, mmap() fails.
    If this flag is not specified, the kernel will place the map at address but will
    map it an alternate address if it cannot.


    MAP_PRIVATE Modifications to the memory region should be private to the process,
    neither shared with other processes that map the same file (other than related
    processes that are forked after the memory map is created) nor reflected in the
    file itself. Either MAP_SHARED or MAP_PRIVATE must be used. If the memory region
    is not writeable, it does not matter which is used.


    MAP_SHARED Changes that are made to the memory region are copied back to the file
    that was mapped and shared with other processes that are mapping the same file.
    PROT_WRITE must have been specified, or else the memory region will be immutable.
    Either MAP_SHARED or MAP_PRIVATE must be specified.


    MAP_DENYWRITE Usually, regular file calls (like write()) may modify a mapped file.
    If the region is being executed, this may not be a good idea, however. MAP_DENYWRITE
    causes writes to the file, other than those writes done through memory maps, to
    return ETBSY.'
