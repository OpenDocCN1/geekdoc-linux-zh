    | Table 12.1 mmap() Protections |

    | Flag | Description |

    | PRO_READ | The mapped region may be read.

    | PRO_WRITE | The mapped region may be written.

    | PRO_EXEC | The mapped region may be executed. |


    | Table 12.2 mmap() Flags |

    | POSIX? | Description |

    | MAP_ANONYMOUS | yes | Ignore fd, create an anonymous mapping.

    | MAP_FIXED | yes | Fail if address is invalid.

    | MAP_PRIVATE | yes | Writes are private to process.

    | MAP_SHARED | yes | Writes are copied to the file.

    | MAP_DENWRITE | no | Do not allow normal writes to the file.

    | MAP_GROWNSOWN | no | Grow the memory region downward.

    | MAP_LOCKED | no | Lock the pages into memory. |


    The second parameter, length, tells the kernel how much of the file to map into
    memory. You can successfully map more than the file has data, but attempting to
    access it may result in a SIGSEGV.


    The process controls which type of access are allowed to the new memory region.
    It should be one or more of the values from Table 12.1 logically OR’ed together,
    PRO_NONE if no access to the mapped region should be allowed. A file can be mapped
    only for access types that were also requested when the file was originally opened.
    For example, a file that was O_RDONLY cannot be mapped for writing with PRO_WRITE.


    The enforcement of the specified protection is limited by the hardware platform
    on which the process is running. Many architectures cannot allow code to execute
    in a memory region while reading from it such hardware, mapping a region with
    PRO_EXEC is equivalent to mapping it with PROC_EXEC | PRO_READ. The memory protections
    passed to mmap() should be relied on only as minimal protections for this reason.


    The flags specify other attributes of the mapped region. Table 12.2 summarizes
    all the flags. Many of the flags that Linux supports are not standard


