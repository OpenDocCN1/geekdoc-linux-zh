    If a process wants to lock its entire address space, mlockall() should be used.
    The flags argument is one or both of the following logically OR''ed together:


    +   - MCL_CURRENT All the pages currently in the process’s address space are locked
    into RAM. They will all be in RAM mlock-all() returns.


    +   - MCL_FUTURE All pages added to the process’s address space are locked into
    RAM.


    Unlocking memory is nearly the same as locking it. If a process no longer needs
    any of its memory locked, munlockall() will unlock all the process’s pages. munlock()
    takes the same arguments as mlock() and unlocks the pages containing the indicated
    region.


    Locking a page multiple times is equivalent to locking it once. In either case,
    a single call to munlock() will unlock the affected pages.


    # 12.3 File Locking


    Although it is common for multiple processes to access a single file, doing so
    needs to be done carefully. Many files include complex data structures, updating
    those data structures creates the same race conditions involved in signal handlers
    and shared memory regions.


