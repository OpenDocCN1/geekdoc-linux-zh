  md: '# Dynamic Loading at Run Time


    Loading shared objects at run time can be a useful way to structure your applications.
    Done right, it can make your applications extensible, and it also forces you to
    partition your code into logically separate modules, which is a useful coding
    discipline.


    Many Unix applications, particularly large ones, are mostly implemented by separate
    blocks of code, often called plugins or modules. In some cases, they are implemented
    as completely different programs, which communicate with the application''s core
    vie via pipes or some other form of interprocess communication (IPC). In other
    cases, they are implemented as shared objects.


    These shared objects may be standard object files or they may be built like standard
    shared libraries (see Chapter 7), but they are used in a completely different
    way. The linker is never told about the shared objects, and they do not need to
    exist when the application is linked. They do not need to be installed on the
    system in the same way most shared libraries do. The symbol names they use do
    not need to be unique; in fact, they are usually not unique. Different shared
    objects written for the same interface use entry points with the same names. With
    normal shared libraries, this would be a disaster; with shared objects dynamically
    loaded at run time, it is the obvious thing to do.


    Perhaps the most common use of run-time-loaded shared objects is to create an
    interface to some generic type of capability that might have many different implementations.
    For instance, consider saving a graphics file. An application might have one internal
    format for formatting its graphics,'
  merge: -1
  pgno: 484
- img_proc: true
  md: '# Chapter 25 Dynamic Loading at Run Time


    but there are a lot of file formats in which it might want to save graphics, and
    more are created on an irregular basis [Murray, 1996]. A generic interface for
    saving a graphics file that is exported to shared objects loaded at run time allows
    programmers to add new graphics formats to the application without recompiling
    the application. If the interface is well documented, it is even possible for
    third parties who do not have the application’s source code to add new graphics
    formats.


    A similar use is framework code that provides only an interface, not an implementation.
    For example, the PAM (Pluggable Authentication Modules) framework provides a general
    interface to challenge-response authentication methods, such as usernames and
    passwords. All the authentication is done by modules, and the choice of which
    authentication modules to use with which application is done at run time, not
    compile time, by consulting configuration files. The interface is well defined
    and stable, and new modules can be dropped into place and used at any time without
    recompiling the framework or the application. The framework is loaded as a shared
    library, and code in that shared library loads and unloads the modules that provide
    the authentication methods.


    # 25.1 The dl Interface


    Dynamic loading consists of opening a library, looking up any number of symbols,
    handling any errors that occur, and closing the library. All the dynamic loading
    functions are declared in one header file, `<dlfcn.h>`.


    The `dlerror()` returns a string describing the most recent error that occurred
    in one of the other dynamic loading functions.


    ```

    const char * dlerror(void);

    ```


    Each time it returns a value, it clears the error condition. Until another error
    condition is created, it will continue to return NULL instead of a string. The
    reason for this unusual behavior is detailed in the description of the `dlsym()`
    function.


    The dlopen() opens a library. This involves finding the library file, opening
    the file, and doing some preliminary processing. Environment variables and the
    options passed to `dlopen()` determine the details.'
  merge: -1
