  md: '# 15.5.8 Flags


    The local mode flags affect local processing, which (roughly) refers to how characters
    are collected before they are output. When the device is in canonical (cooked)
    mode, characters are echoed locally without being sent to the remote system until
    a newline character is encountered. At that point, the whole line is sent, and
    the remote processes it without echoing it again. In raw mode, each character
    is sent to the remote system as it is received. Sometimes the character is echoed
    only by the remote system; and sometimes, such as when reading a password, it
    is not echoed at all.


    Some flags may act differently, depending on whether the terminal is in canonical
    mode or raw mode. Those that act differently in canonical and raw mode are marked.


    The flags that operate on `c_lflag` are as follows:


    # ICANON


    If ICANON is set, canonical mode is enabled. If ICANON is not set, raw mode is
    enabled.


    # ECHO


    If ECHO is set, local echo is enabled. If ECHO is not set, all the other flags
    whose names start with ECHO will be effectively disabled and function as they
    are not set, except for ECHONL.


    # ECHCTL


    If ECHOCTL is set, control characters are printed as ^C, where C is the character
    formed by adding octal 0100 to the control character, mod 0200. So Control-C is
    displayed as ^C, and Control-? (octal 0177) is represented as ^ (? is octal 77).
    This flag is not specified by POSIX.


    # ECHO


    In canonical mode, if ECHO is set, then when the ERASE character is received,
    the previous character on the display is erased if possible.


    # ECHOK and ECHOKE


    In canonical mode, when the KILL character is received, the entire current line
    is erased from the buffer.'
