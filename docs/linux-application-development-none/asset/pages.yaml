  md: '# 374 Chapter 18 Random Numbers


    other external) interaction with the computer that are essentially random. The
    code that fills the entropy pool attempts to distinguish the amount of entropy
    that is being added, which allows the programmer to determine the amount of entropy
    used to generate random information.


    Programmers who need random numbers based on unpredictable events can take random
    numbers from the entropy pool through two similar devices: /dev/random and /dev/urandom.
    The /dev/random device will return only as many bytes of random data as the device
    currently estimates are in the entropy pool. The /dev/random device does not try
    to offer any guarantees about the amount of entropy in the information it returns;
    it generates as much random data as you want, based on the entropy pool. Whenever
    either device is read, it subtracts the number of bytes from the entropy count.


    When you read data from either device, it does not simply return the data that
    is in the entropy pool. It returns data stirred by a one-way hash algorithm that
    does not reveal the state of the pool in its output.


    +   - Use neither /dev/random nor /dev/urandom for data you want to replicate.
    They are particularly useless sources of data for Monte Carlo methods; even 1,2...n-1,n
    would be better; it is at least repeatable series.

    - If you need only a certain amount of entropy, but need more raw data than entropy,
    you can read a small amount of data from one of the random devices (depending
    on what quality you need guaranteed) and then extend it with a hash function such
    as MD5 or SHA.


    The source code to the random driver, drivers/char/random.c, includes considerable
    documentation on the details. If you intend to write cryptographic code that uses
    the data provided by one of the interfaces, we recommend that you read that documentation
    first.'
