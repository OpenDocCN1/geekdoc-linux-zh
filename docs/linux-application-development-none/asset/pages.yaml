  md: '# 2.3 Free Software Licenses


    # 2.3.2 The GNU General Public License


    The GPL is one of the more restrictive free-software licenses. If you include
    source code that is licensed under the terms of the GPL in another program, that
    program must also be licensed under the terms of the GPL. The Free Software Foundation
    (FSF; author of the GPL) considers linking with a library to be “creating a derivative
    work”; some others believe it to be a “work of mere aggregation.” Therefore, the
    FSF holds that you are not allowed to link with a library covered under the terms
    of the GPL unless the program being linked also is covered by the terms of the
    GPL. However, some people hold that linking is “mere aggregation,” and the GPL
    says:


    > In addition, mere aggregation of another work not based on the Program with
    the Program (or with a work based on the volume of a storage or distribution medium
    does not bring the other work under the scope of this License.


    If you consider an executable to be a “volume of storage,” you could consider
    linking mere aggregation.


    To the best of our knowledge, this distinction has not yet been tested in court.
    In the fairly unlikely case that you wish to link a program not licensed under
    the terms of the GPL with a library that is, ask the authors of the library in
    question for their interpretation.


    # 2.3.3 The GNU Library General Public License


    The GNU Library General Public License (LGPL) was designed to make libraries more
    generally useful. The point of the LGPL is to allow users to upgrade or improve
    their libraries without having to get new versions of programs linked against
    those libraries. To that end, the LGPL does not attempt to place any licensing
    restrictions on programs against the library, as long as those programs are linked
    against shared versions of libraries licensed under the LGPL or are provided with
    the object files


