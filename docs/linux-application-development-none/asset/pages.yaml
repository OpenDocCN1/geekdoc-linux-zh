  md: "# 17.2 Using Timers 369\n\nThe combination of ITIMER_VIRTUAL and ITIMER_PROF\
    \ is often used for profiling code.\n\nEach of these timers will generate its\
    \ associated signal within system clock (10 milliseconds on most Linux systems,\
    \ 1 millisecond on Linux/Alpha) of the timer expiring. If the process is currently\
    \ running when the signal is generated, it will be delivered immediately; otherwise,\
    \ it will be delivered sooner after, depending on system load. Since ITIMER_VIRTUAL\
    \ is tracked only when the process is running, it will always be delivered immediately.\n\
    \nUse a struct iterval to query and set itimers.\n\n```\nstruct iterval {\n  \
    \  struct timeval it_interval;\n    struct timeval it_value;\n};\n```\n\nThe it_value\
    \ member is the amount of time left until the next signal is sent. The it_interval\
    \ member is the amount of time between signals; it_value is set to this value\
    \ each time the timer goes off.\n\nThere are two system calls for dealing with\
    \ interval timers. Both take a which argument that specifies which timer to manipulate.\n\
    \n```\nint getitimer(int which, struct iterval *val);\n    Fills in val with the\
    \ current state of the which timer.\nnint setitimer(int which, struct iterval\
    \ *new,\n    struct iterval *old);\n    Sets the timer to new and fills in old\
    \ with the previous state\n    if it is non-NULL.\n```\n\nSetting a timer’s it_value\
    \ to zero immediately disables it. Setting a timer’s it_interval to zero disables\
    \ it after the next time the timer triggers."
