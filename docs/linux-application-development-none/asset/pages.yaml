- img_proc: true
  md: 'TCP/IP,¹ which is the protocol that drives the Internet. We also cover Unix
    domain sockets, which are an IPC mechanism restricted to a single machine. Although
    they do not work across networks, Unix domain sockets are widely used for other
    applications.


    Protocols normally come in groups, or protocol families. The popular TCP/IP protocol
    suite includes the TCP and UDP protocols (among others). Making sense of the various
    protocols requires you to know a few networking terms.


    # 16.1.1 Nice Networking


    Most users consider networking protocols to provide the equivalent of Unix pipes
    between machines. If a byte (or sequence of bytes) goes in one end of the connection,
    it is guaranteed to come out the other end. Not only is it guaranteed to come
    out the other end, but it will also come out after the byte that was sent before
    it and immediately before the byte that was sent after it. Of course, all of these
    bytes should be received exactly as they were; no bytes should change. Also, no
    other process should be able to interject extra bytes into the conversation; it
    should be restricted to the original two parties.


    A good visualization of this idea is the telephone. When you speak to your friends,
    you expect them to hear the same words you speak, and in the order you speak them.²
    Not only that, you do not expect your mother to pick up her phone (assuming she
    is not in the same house as you) and start chatting away happily to you and your
    friend.


    +   1. The 2.0.x kernels covered by this book support only version 4 of the TCP/IP
    protocol suite, the version in widespread use at press time. A newer version of
    TCP/IP, version 6, is expected to eventually supersede version 4, and the newer
    versions of the Linux kernel (2.1.x and later) will fully support it.

    2. Well, this depends on the character of the friends and how late they were out
    the night before the conversation.'
