  md: '# 23.2 Basic Operations 433


    # 23.2.3 Obtaining the File Descriptor


    A major shortcoming of db files is their lack of support for concurrent access.
    They make no attempt to lock databases, leaving that to the application. To make
    locking a little easier, they do provide a file descriptor that can be used for
    locking purposes.


    ```

    int fd(DB * db);

    ```


    The fd points to a function that returns a file descriptor associated with the
    database. It is not guaranteed to be the only file descriptor db is using or to
    be used by db at all. It is guaranteed to refer to a file unique for the database
    being accessed and that the file descriptor returned for a given database file
    will always refer the same file (there is a one-to-one correspondence between
    the file descriptor refers to and the file name passed to dbopen()). That guarantee
    is good enough to allow locking.


    Most applications will need to lock a db file the entire file and allow only one
    writing process to have access at a time, but the allow multiple readers. See
    Chapter 12 for more information on file locking.


    # 23.2.4 Syncing the Database


    The db layer caches data in RAM to provide faster database access, and the Linux
    kernel caches disk writes for low-latency write() calls. An application can ensure
    the on-disk database is consistent with the buffered structures by syncing the
    database. When a database is synced, db flushes all its internal buffers and calls
    fsync() on the file descriptor. Syncing a db is nearly identical to closing.


    ```

    int sync(const DB * db, unsigned int flags);

    ```


    The flags argument is 0 for DB_HASH and DB_BTREE files. For DB_RECNO files, it
    may be R_RECNOSYNC, which syncs only the underlying btree file for the database
    rather than the overlying file. See the recno(3) man page for details.


    +   3. DB_RECNO databases actually consist of two database files, one of which
    is a DB_BTREE database. This does not matter when you are using a DB_RECNO database,
    though.'
  merge: -1
  pgno: 460
- img_proc: true
  md: '# 434 Chapter 23 The Database Library


    # 23.3 Reading Records


    There are two ways to read records from the database: looking up a record by its
    key, and reading sequential key/value pairs. The db library maps the file into
    memory⁴ and returns information from the file to the application as pointers into
    the memory-mapped region. Because of this, it is a bad idea to modify the data
    returned from db functions; instead, make a local copy and modify it. One advantage
    of db''s use of memory maps is that the data it returns does not need to be freed
    by the application.


    # 23.4 Reading Records Sequentially


    All the records in a database may be read through the seq function pointed to
    by the DB structure.


    ```

    int seq(const DB * db, DBT * key, DBT * value, unsigned int flags);

    ```


    The structures pointed to by key and value are set to reference the new record.
    The db library keeps track of the current record through an internal cursor. The
    cursor is moved only by the seq function. Every time seq returns a record, the
    cursor is moved to that record.


    The flags parameters determine which record is returned and must be one of the
    following:


    +   - R_CURSOR The record whose key is the same as key is returned.³ If the database
    is of type DB_BTREE, the record with the smallest key greater than or equal to
    the requested key is returned, allowing efficient searches.

    - R_FIRST The first record in the database is returned.

    - R_NEXT The record after the cursor is returned.


    +   4. See Chapter 12 for information on memory maps.

    5. This differs from the get function we are about to mention in that it moves
    the position of the cursor.'
  merge: -1
  pgno: 461
- img_proc: true
  md: '# 23.5 Modifying the Database 435


    R_LAST The last record in the database is returned (for DB_RECNO and DB_BTREE
    databases only).


    R_PREV The record before the cursor is returned (for DB_RECNO and DB_BTREE databases
    only).


    The R_LAST and R_PREV parameters are not available for hashed databases because
    hash databases are not ordered. Although previous could be defined as the opposite
    of next, traversing a hash table backward is no better than traversing forward,
    so the db designers did not allow it.


    # 23.4.1 Reading a Particular Record


    Looking up an entry by its key is usually done through the get function of the
    DB structure (though seq could be used instead).


    ```

    int get(const DB * db, const DBT * key, DBT * value, unsigned int flags);

    ```


    If the key exists in the database, value is set to point to the value associated
    with it and 0 is returned. If the record does not exist, 1 is returned; if an
    error occurs, -1 is returned and errno is set.


    The flags parameter is unused and should be set to 0 for compatibility future
    versions of db.


    # 23.5 Modifying the Database


    There are two operations that modify db databases: adding records and removing
    records. Updating records is done in the same manner as adding records.'
  merge: -1
  pgno: 462
- img_proc: true
  md: '# 23.5.1 Adding Records


    New and updated records are recorded in the database through the DB structure’s
    put function.


    ```

    int put(const DB * db, const DBT * key, const DBT * value,

    unsigned int flags);

    ```


    The key is the index value that can later be used to retrieve the information
    referenced by value. The put function overwrites any other record in the database
    whose key unless the flags argument is R_NOOVERWRITE.


    If the new record is successfully stored, put returns 0. If another record with
    this key exists and R_NOOVERWRITE was specified, put returns 1. If any other error
    occurs, it is returned and errno is set appropriately.


    # 23.5.2 Removing Records


    There are two ways to remove records from the database. Usually, records are removed
    by specifying the key whose record should be removed. Alternatively, the record
    currently referenced by the cursor may be removed. In either case, the DB structure’s
    del member references the function that is used.


    ```

    int del(const DB * db, const DBT * key, unsigned int flags);

    ```


    If flags is R_CURSOR, the record currently referenced by the cursor is removed
    and the cursor’s position is undefined. If flags is 0, the record whose key is
    removed.


    If the specified key does not exist in the database, del returns 1. If any other
    error occurs, -1 is returned and errno is set. If the specified record is successfully
    removed, 0 is returned.'
