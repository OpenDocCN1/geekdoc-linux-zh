  md: '# Chapter 7 Creating and Using Libraries


    # 7.3.1 Managing Compatibility


    Every Linux shared library is assigned a special name, called a soname, that includes
    the name of the library and a version number. When developers change interfaces,
    they increment the version number, altering the name. Some libraries do not have
    stable interfaces; developers may change their interface in an incompatible way
    when a new version is released that has changed only a minor number. Most library
    developers attempt to maintain stable interfaces that change in an incompatible
    manner only when they release a new version of the library.


    For example, the developers and maintainers of the Linux C library attempt to
    maintain backward compatibility for all releases of the C with the same major
    number. Version 5 of the C library has gone through five minor revisions, and
    with few exceptions, programs that worked with the first revision work with the
    fifth. (The exceptions have been poorly coded programs that took advantage of
    C-library behavior was not specified or that buggy in older versions and fixed
    in newer versions.)


    Because all version 5 C libraries are intended to be backward compatible with
    older versions, they all use the same soname—libc.so.5—where m is related to the
    name of the file in which it is stored, /lib/libc.so.5.m,r where m is the version
    number and r is the release number.


    Applications that link against a shared library do not link directly against /lib/libc.so.5.12
    (for instance), even though that file exists. The ldconfig-program, a standard
    Linux system utility, creates a symbolic link from /lib/libc.so.5 (the soname)
    to /lib/libc.so.5.12, the real name of the library. This makes upgrading shared
    libraries easy. To upgrade to 5.2.18 to 5.3.12, it is necessary only put the new
    /lib/libc.so.5.12 into the /lib directory and run ldconfig. The ldconfig looks
    at all the libraries that provide the libc.so.5 soname and makes the symbolic
    link from the soname to the latest library that all the applications linked against
    /lib/libc.so.5 automatically use the new library the next time they are run, and
    /lib/libc.so.5.2.18 can be removed immediately, since it is no longer in use.²


    +   That is, you can use the rm command to remove it from the directory structure
    immediately; programs that are still using it keep on the disk automatically until
    they exit. See page 178 for an explanation of how this works.'
