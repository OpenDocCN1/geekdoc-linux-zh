  md: "# 20.1 Capability Databases 389\n\nThe curses library determines which sequences\
    \ to send to the terminal by consulting a database that, for each terminal, maps\
    \ capability names to the strings that need to be sent.\n\nLinux, like all modern\
    \ Unix systems, provides two databases that describe terminals in terms of the\
    \ capabilities they possess and which sequences map to which capabilities. The\
    \ older database is called termcap (short for terminal capabilities) and is kept\
    \ in one large ASCII flat file called /etc/termcap. This file becomes unwieldy;\
    \ it has grown to approximately half a megabyte. The newer database is called\
    \ terminfo (short for terminal information) and is kept in many binary files,\
    \ one per terminal, normally in subdirectories of the /usr/lib/terminfo directory.\n\
    \nWithin each database, the capability information for each terminal is indexed\
    \ by one or more unique names. Both databases use the same name for the same terminal.\
    \ For instance, the Linux console is linux in both termcap and terminfo. You tell\
    \ programs which terminal entry to use by setting the TERM environment variable.\
    \ When writing programs that use termcap and terminfo, you rarely need to look\
    \ at the TERM environment variable; usually, the low-level libraries for accessing\
    \ the termcap or terminfo databases will automatically take care of that.\n\n\
    However, if you wish to do Linux-specific optimizations, especially if you want\
    \ to use some of Linux's unusual capabilities that are not described in the capability\
    \ databases, you can check the TERM environment variable with code like:\n\n```\n\
    if (!strcmp(\"linux\", getenv(\"TERM\")))\n  /* should be a Linux console */\n\
    else\n  /* handle as a normal serial terminal */\n```\n\nAlso, if you wish to\
    \ write programs in programming languages without easy access to curses or some\
    \ other terminal abstraction library, you may find it convenient to use this documentation.\n\
    \nOf course, that your terminal type is linux does not guarantee that your program\
    \ is running on a local terminal. If the terminal type is linux, you know you\
    \ have access to the escape sequences documented in this chapter, but you do not\
    \ know if you have access to the vcs devices (documented"
