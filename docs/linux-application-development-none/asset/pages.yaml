  md: '# 9.2 Process Attributes 99


    The passwd program is a simple example of setuid and setgid functionality was
    introduced. The passwd program allows users to change their passwords. User passwords
    are usually stored in /etc/passwd. Only the root user may write to this file,
    preventing other users from changing user information. Users should be able to
    change their own passwords though, so some way is needed to give the passwd program
    permission to modify /etc/passwd.


    To allow this flexibility, the owner of a program may set special bits in the
    program''s permission bits (see pages 144-148 for more information), which tells
    the kernel that whenever the program is executed, it runs with the same effective
    uid (or gid) as the user who owns the program, regardless of what runs the program.
    These programs are called setuid (or setgid) executables.


    Making the passwd program owned by the root user and setting the setuid bit in
    the program''s permission bits lets all users change their passwords. When a user
    runs passwd, the passwd program runs with an effective UID of 0, allowing it to
    modify /etc/passwd and change the user''s password. Of course, the passwd program
    has to be carefully written to prevent unintended side effects. Setuid programs
    are a popular target for system intruders, as poorly written setuid programs provide
    a simple way for users to gain unauthorized


    There are many cases in which setuid programs need their special permissions only
    for short periods of time and would like to switch back to the uid of the actual
    user for the remainder of the time (like the ftp daemon). As setuid programs have
    only their effective uid set to the uid of the program''s owner, they know the
    uid of the user who actually runs them (the saved uid), making switching back
    simple. In addition, they may set their real uid to the setuid value (without
    affecting the saved uid) and regain those special permissions as needed. In this
    situation, the effective, saved, real uid work together to make system security
    as simple as possible.


    Unfortunately, using this mechanism can be confusing POSIX and BSD take slightly
    different approaches, and Linux supports both. The BSD solution is more full-featured
    than the POSIX method. It is accessed with the setuid() function.


    ```

    int setuid(uid_t ruid, uid_t euid);

    ```'
