    # 9.3.1 Program Arguments


    There are two types of values passed to new programs when they run: command-line
    arguments and environment variables. Various conventions have been set for their
    usage, the system itself does not enforce any of these conventions. It is a good
    idea to stay within the conventions, though, to help your program fit into the
    Unix world.


    Command-line arguments are a set of strings passed to the program. Usually, these
    are the text typed after the command name in a shell (hence the name), with optional
    arguments beginning with a dash (- ) character.


    Environment variables are a set of name/value pairs. Each pair is represented
    as a single string of the form NAME=VALUE, and the set of these strings makes
    up the program''s environment. For example, the current user''s home directory
    is normally contained in the HOME variable, so programs Joe runs often have HOME=/home/joe
    in their environment.


    Both the command-line arguments and environment are made available to a program
    at startup. The command-line arguments are passed as parameters to the program''s
    main() function, whereas a pointer to the environment is stored in the environ
    global variable, which is defined in <unistd.h>.3


    +   3. Most systems pass the environment as a parameter to main(), as well, but
    this method is not standardized by POSIX. The environ variable is the POSIX-approved
    method.'
