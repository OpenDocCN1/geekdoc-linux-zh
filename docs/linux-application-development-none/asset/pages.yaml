    This is especially true if you have shared objects that depend on other shared
    objects to supply some of their symbols. If shared object A depends on a symbol
    b in shared object B, and B is loaded after A, lazy resolution of b will succeed
    if it happens after B is loaded, but it will fail before B is loaded. Developing
    your code with immediate resolution will help you catch this type of bug before
    it causes problems.


    This implies that you should load modules in reverse order of their dependencies:
    If A depends on B for some of its symbols, you should load B before you load A,
    and you unload A before you unload B. Fortunately, most applications of dynamically
    loaded shared objects have no dependencies.


    By default, the symbols in a shared object are not exported and will not be used
    to resolve symbols in other shared objects. They will be available only for you
    to look up and use, as will be described in the next section. However, you may
    choose to export all the symbols in the shared object to all other shared objects;
    they will be available to all subsequently loaded shared objects.


