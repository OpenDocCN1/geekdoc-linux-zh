  md: '# 16.4 Unix Domain Sockets


    Unix domain sockets are the simplest family available through the sockets API.
    They do not actually represent a network protocol; they connect only to sockets
    on the same machine. Although this restricts their usefulness, they are used by
    many applications because they provide a flexible IPC mechanism. Their addresses
    are pathnames, which are created in the file system when a socket is bound to
    the pathname. Socket files, which represent Unix domain addresses, can be stat()ed
    but cannot be opened through open(); the socket API must be used instead.


    The Unix domain provides both datagram and stream interfaces. The datagram interface
    is rarely used and is not discussed here. The stream interface, which is discussed,
    is similar to named pipes. Unix domain sockets are not identical to named pipes,
    however.


    When multiple processes operate a named pipe, any of the processes read a message
    sent through the pipe by another process. Each named pipe is like a bulletin board.
    When a process posts a message to the board, any other process (with sufficient
    permission) may take the message from the board.


    Unix domain sockets are connection-oriented; each connection to the socket results
    in a new communication channel. The server, which may be handling many simultaneous
    connections, have a different file descriptor for each. This property makes Unix
    domain sockets much better suited to many IPC tasks than named pipes; this is
    the primary reason they are used by many standard Linux services, including the
    X Window System and the system logger.


    # 16.4.1 Unix Domain Addresses


    Addresses for Unix domain sockets are pathnames in the file system. If the file
    does not already exist, it is created as a socket-type file when a socket is bound
    to the pathname through bind(). If a file (even a socket) exists with the pathname
    bound, bind() fails and returns EADDRINUSE. bind() sets the permissions of newly
    created socket files to 0666, as modified by the current umask.'
