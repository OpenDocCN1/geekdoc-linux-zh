  md: '# 3.1 Overview of Linux Documentation


    # 3.1.1 The HOWTOs and mini-HOWTOs


    Documentation that originates on Usenet often takes the form of a Frequently Asked
    Questions (FAQ) document. These documents have a question-and-answer format that
    is appropriate to most of their subjects. However, the FAQ format is not suitable
    for many types of documentation, so the LDP has established a standard format
    for expository or narrative documentation. These documents are called HOWTO documents,
    since most of them explain how to do something. They are available in type, hypertext,
    and plain-text formats; they are written in SGML, which is designed to be translated
    into other formats.


    Certain extremely simple documents, mini-HOWTOs, are only a few pages long and
    generally describe one topic.


    # 3.1.2 The LDP Books


    One of the early projects of the LDP was to produce whole books about Linux. Most
    of these books are written for users and systems administrators; one is a guide
    to applications programming, and one is a guide to kernel programming. All are
    accessible in one form or another from the LDP home page.


    # 3.1.3 The Linux Software Map


    If you are having trouble finding a program you want, the Linux Software Map (LSM)
    at http://www.execpc.com/~ lsm has thousands of records of software packages available
    for Linux. These records include names, descriptions, version numbers, and locations
    of the packages.


    # 3.1.4 The man Pages


    Access the system reference manual pages (man pages) through the man command.
    To read the reference page on the man command itself, run the command line man
    man. Man pages generally contain reference documentation, not tutorial information,
    and are renowned for being so succinct that'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# Chapter 3 More Information on Linux


    they are barely understandable at times. Nevertheless, when you need reference
    material, they can be exactly what you want.


    Three programs provide access to man pages. The man program displays individual
    man pages, and the apropos and whatis commands search for a keyword in the set
    of man pages. The apropos and whatis commands search for the same database; the
    difference is that whatis displays only line that match the word you are searching
    for, and apropos displays any line that contains the word you are searching for.
    That is, if you are looking for man, apropos matches manager and manipulation,
    whereas whatis matches only man separated from other letters by white space or
    by punctuation, as in man.config. Try the commands whatis and apropos to see the
    difference.


    Many of the man pages on a Linux system are part of a large package assembled
    by the LDP. In particular, the section 2 (system calls), section 3 (libraries),
    section 4 (special, or device, files), and section 5 (file formats) pages are
    mainly from the LDP''s man-pages collection and are generally the pages most useful
    for programming. If you want to specify which section to look in, give the number
    of that section before the name of the man page you want to read. For example,
    man man gives the page for the man command from section 1; if you want to see
    the specification for how to write man pages, you need to specify section 7 with
    man 7.


    While you are reading man pages, remember that system calls and library functions
    use the same names. In most cases, you will to know about the library functions
    to which you will be linking, not about the system calls that those library functions
    will eventually call. Remember to use man 3 function to get the descriptions of
    library functions, because some library functions have the same names as system
    calls in section 2.


    Also, particularly aware the C-library man pages are maintained separately from
    the C library itself. Since the C library does not usually change behavior, which
    is not usually a problem. All the Linux platforms are (as we write) in the process
    of moving to a unified C library: the GNU library. The GNU C library does come
    with full documentation, which is maintained with the library. This information
    is available in Texinfo; see page 27 for information on reading Texinfo documentation.
    Even when the GNU library is used on all Linux platforms, the man pages will still
    be maintained separately; there will just be more documentation in Texinfo format.'
  merge: -1
