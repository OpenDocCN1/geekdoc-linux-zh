    call overhead incurred) but provide all the type checking available with a normal
    function call. Code that calls inline functions must be compiled with least minimal
    optimization on (-0).


    # 5.2.3 Alternative Extended Keywords


    In gcc, every extended keyword (keywords not covered by the ANSI standard) has
    two versions: the keyword itself and the keyword surrounded by two underscore
    characters on each side. When the compiler is used in standard-compliant mode
    (usually, the ansi argument was used), the normal extended keywords are not recognized.
    So, for example, the attribute keyword is written as __attribute__ in the header
    files.


    # 5.2.4 Attributes


    The attribute extended keyword is used to tell gcc more about a function, variable,
    or declared type than is possible in ANSI-compliant C code. For example, the aligned
    attribute tells gcc exactly how to align a variable or type; the packed attribute
    specifies that padding not to be used; and noreturn specifies that a function
    never returns, which allows gcc to optimize better and avoid spurious warnings.


