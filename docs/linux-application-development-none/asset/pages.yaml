  md: '# Chapter 16 Networking with Sockets


    # 16.3.2 Establishing Connections


    After you create a stream socket, it needs to be connected to something before
    it is of much use. Establishing socket connections is an inherently asymmetric
    task; each side of the connection does it differently.


    One side gets its socket ready to be connected to something and waits for someone
    to connect to it. This is usually done by server applications that are started
    and continuously run, waiting for other processes to connect to them.


    Client processes instead create a socket, tell the system which address they want
    to connect to it, and then try to establish the connection. Once the server (which
    has been waiting for a client) accepts the connection attempt, the connection
    is established between the two sockets. After this happens, the socket may be
    used for bidirectional communication.


    # 16.3.3 Binding an Address to a Socket


    Both server and client processes need to tell the system which address to use
    for the socket. Attaching an address to the local side of a socket is called binding
    the socket and is done through the bind() system call.


    ```

    #include <sys/socket.h>

    ```


    ```

    int bind(int sock, struct sockaddr * my_addr, int addrlen);

    ```


    The first parameter is the socket being bound, and the other parameters specify
    the address to use for the local endpoint.


    # 16.3.4 Waiting for Connections


    After creating a socket, server processes bind() the socket to the address they
    are listening to. After the socket is bound to an address, the process tells the
    system it is willing to let other processes establish connections to that socket
    (at the specified address) by calling listen(). Once a socket is bound to an address,
    the kernel is able to handle processes'' attempts to connect to that address.
    However, the connection is not immediately'
  merge: -1
  pgno: 353
- img_proc: true
  md: '# 16.3 Basic Socket Operations 327


    established. The listen() process must first accept the connection attempt through
    the accept() system call. New connection attempts that have been made to addresses
    that have been listen()ed to are called pending until the connections has been
    accept()ed.


    Normally, accept() blocks until a client tries to connect to it. If the socket
    has been marked as nonblocking through fcntl(), accept() instead returns an error
    if no client process is available. The select() system call may also be used to
    determine whether a connection to a socket is pending. If a connection is pending,
    the socket is considered ready to be read from select()''s purposes.


    Here are the prototypes of listen() and accept():


    ```

    #include <sys/socket.h>

    ```


    ```

    int listen(int sock, struct sockaddr * addr, int * addrlen);

    ```


    Both of these functions expect the socket''s file descriptor as the first parameter.
    listen()''s other parameter, backlog, specifies how many connections may be pending
    on the socket before further connection attempts are refused. Network connections
    are not established until the server has accept() the connection; until accept(),
    the incoming connection is considered pending. By providing a small queue of pending
    connections, the kernel relaxes the need for server processes to be constantly
    prepared to accept() connections. Applications have historically set the maximum
    backlog to 5, which a larger value may sometimes be necessary. listen() returns
    0 on success and non-0 on failure.


    The accept() changes a pending connection to an established connection. The established
    connection is given a new file descriptor, which accept() returns. The new file
    descriptor inherits its attributes from the socket that was listen()ed to.


    The addr and addrlen parameters point to data that the kernel fills in with the
    address of the remote (client) end of the connection. Initially, addrlen should
    point to an integer containing the size of the buffer addr points to. accept()
    returns a file descriptor, or less-than-0 if an error occurs, just like open().'
