  md: '# 6.2 Electric Fence 59


    make overruns tricky do not affect underruns, however, as in this mode, Electric
    Fence''s malloc() always returns a memory address at the beginning of a page,
    which is always aligned on a word boundary.


    If EF_PROTECT_FREE is set to 1, free() will make the memory region passed to it
    inaccessible rather than returning it to the free memory pool. If the program
    tries to access that memory at any point in the future, the kernel will detect
    the illegal access. Setting EF_PROTECT_FREE makes it easy to ensure that your
    code is not using free()ed memory at any point.


    # 6.2.4 Limitations


    While Electric Fence does a nice job of finding overflows of malloc() buffers,
    it does not help at all with tracking down problems with either global or locally
    allocated data. It also does not make any attempt to find memory leaks, so you
    will have to look elsewhere for help with those problems.


    # 6.2.5 Resource Consumption


    Although Electric Fence is powerful, easy to use, and fast (because all the access
    checks are done in hardware), it does exact a price. Most processors allow the
    system to access to memory only in units of a page at a time. On Intel 80x86 processors,
    each page is 4,096 bytes in size. Because Electric Fence wants malloc() to set
    up two regions for each call (one allowing access, the other allowing no access),
    each call to malloc() consumes a page of memory, or 4KB! If the code tested allocates
    a lot of small areas, the code against Electric Fence can easily increase the
    program''s memory usage by two or three orders of magnitude! Of course, using
    EF_PROTECT_FREE makes this even worse because memory is never freed.


    The moral is: If you find your system running out of memory when you debug a program
    with Electric Fence, do not be afraid to add more swap space!


    +   4. On Linux/Intel and Linux/SPARC systems anyway. The page size depends on
    the underlying hardware architecture.'
