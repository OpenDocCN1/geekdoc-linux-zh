    # 10.2.1 File Descriptors


    When a process gains access to a file (usually called opening the file), the kernel
    returns a file descriptor to perform subsequent operations on the file. File descriptors
    are small, positive integers, which serve as indices into an array of open files
    the kernel maintains for each process.


    The first three file descriptors for a process (0, 1, and 2) have standard usages.
    The first, 0, is known as standard input (stdin) and is where programs should
    take their interactive input from. File descriptor 1 is called standard output
    (stdout), and most output from the program should be directed there. Errors should
    be sent to standard error (stderr), which is file descriptor 2. The standard C
    library follows these rules, so gets() and printf() use stdin and stdout, respectively,
    and these allow shells to redirect a process''s input and output.


    The <unistd.h> header file provides the STDIN_FILENO, STDOUT_FILENO, and STDERR_FILENO,
    which equate to the stdin, stdout, and stderr descriptors. Using these symbolic
    names can make code slightly more readable.


    Many of the file operations that manipulate a file''s node are available in two
    forms. The first form takes a file name as an argument. The kernel uses that argument
    to look up the file''s inode and performs the appropriate operation on the inode
    (this usually includes following symlinks). The second form takes a file descriptor
    as an argument and performs the operation on the inode it refers to. The two sets
    of system calls use similar names, with the system calls expect a file descriptor
    prefixed with the letter f. For example, the chmod() system call changes the access'
