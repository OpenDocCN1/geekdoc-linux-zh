  md: '# Appendix A Direct Access to I/O Ports


    The `ioperm()` function is used to allow and deny access to ports between 0 and
    0x3ff.⁵ It takes three arguments:


    +   - The first port of the range

    - The number of ports in the range

    - 1 to allow access to ports in that range; 0 to deny access


    `ioperm()` returns 0 on success and -1 on error.


    # A.2.2 The Dangerous Way


    A program running with superuser privileges can enable all I/O port access at
    once with a single call:


    ```

    iopl(3);

    ```


    This moves the process into “I/O protection level 3,” which does two things: It
    allows the process all access to the I/O bus, and it allows the process to disable
    and enable interrupts with `cli()` and `sti()`, respectively. If you use `iopl()`,
    make sure that you never call `cli()`—doing so will crash symmetric multi-processing
    (SMP) systems.⁶ In general, use `ioperm()` if possible, and use `iopl()` only
    if you need to access ports higher than 0x3ff.


    > 5. The upper limit is 0x3ff because on Linux/i386, access rights for the first
    0x400 ports are stored in the task structure. Storing access rights for all the
    ports in each task structure would use a disproportionately large amount of memory
    (8KB per process), and most ports that can befully accessed from user-level programs
    are low ones.


    > 6. Do not call `sti()`, either—but it probably will not hurt anything.'
