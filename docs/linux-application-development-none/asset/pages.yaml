  md: '# 26.2.2 Password Database Library


    Although PAM nicely handles authentication information, it is not designed to
    handle any other form of user information. For that, the pwdb library was designed.
    In particular, it remembers whence it retrieved user information and updates user
    information in the correct database. pwdb was designed and written by members
    of the team that implemented Linux-PAM to solve problems that PAM was not designed
    to solve but that kept surfacing. Like Linux-PAM, the pwdb distribution includes
    programming information.


    2. http://www.redhat.com/linux-info/pwdb/'
