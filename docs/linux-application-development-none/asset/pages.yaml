  md: '# 13.5 Reopening Log Files 253


    Although it is safe for the signal handler to read a data structure when it has
    interrupted another reader of structure, all other combinations are unsafe. It
    is no more safe for the signal handler to modify a data structure that the rest
    of the program is reading than it is for the signal handler to read a data structure
    the rest of the program is writing. Some specialized data structures have been
    designed to allow concurrent access, but those data structures are well beyond
    the scope of this book.


    If you must access global data from a signal handler (which most signal handlers
    end up doing), keep the data structure simple. Although it is pretty easy to safely
    modify a single data element, such as an int, more-complicated structures usually
    require blocking signals. Any global variables that a signal handler may modify
    be declared with the volatile keyword. This tells the compiler that the variable
    may be changed outside the normal flow of the program and it should not try to
    optimize accesses to the variable.


    The other thing is to be careful of signal handlers calling other functions, as
    they may modify global data as well! The C std library tends to do this quite
    a bit and should never be used from a signal handler. Table 13.2 lists functions
    that are guaranteed to be safe to call from a signal handler; all other library
    functions should be avoided.


    # 13.5 Reopening Log Files


    Most system daemons keep log files indicating what they have been busy doing.
    As many Unix systems stay up for months without interruption, these log files
    can grow large. Simply removing (or renaming) the log files occasionally is not
    a good solution because the daemons would simply keep writing to the files despite
    their inactivity, and having to stop and start each daemon while the log files
    are cleaned would result in system downtime (albeit not much). A common way for
    daemons to manage this situation is to catch SIGHUP and reopen their log files.
    This allows log rotation (periodically starting new log files while keeping the
    old ones) to happen with a simple shell script like


    ```

    cd /var/log

    m messages messages.old

    killall -HUP syslog

    ```'
