  md: "# Chapter 24 Parsing Command-Line Options\n\nare defined as combinations of\
    \ already-existing options. This allows the user to define new, complex behaviors\
    \ or change the default-behaviors of existing options.\n\nLike getopt_long(),\
    \ the popt library supports short and long style options.\n\nThe popt library\
    \ is highly portable and should work on any POSIX platform. The latest version\
    \ is always available from ftp://ftp.redhat.com/pub/redhat/code/popt/\n\nIt may\
    \ be redistributed under either the GNU General Public License or the GNU Library\
    \ General Public License, at the distributor\\us discretion.\n\n# 24.1 Basic popt\
    \ Usage\n\n# 24.1.1 The Option Table\n\nApplications provide popt with information\
    \ on their command-line options through an array of struct popOption structures.\n\
    \n```\n#include <popt.h>\n\nstruct popOption {\n    const char * longName; /*\
    \ may be NULL */\n    char shortName;      /* may be '\\0' */\n    int argInfo;\n\
    \    void * arg;           /* depends on argInfo */\n    int val;            \
    \  /* 0 means do not return, just update flag */\n};\n```\n\nEach member of the\
    \ table defines a single option that may be passed to the program. Long and short\
    \ options are considered a single option that may occur in two different forms.\
    \ The first two members, longName and shortName, define the names of the option;\
    \ the first is a long name and the latter is a single character."
