    # 22.2.7 Writing to the Screen


    Although there are a number of ways to write strings to the screen under S-Lang,
    they all look about the same. Here is the entire set of functions:


    ```

    void Slsmg_write_char(char ch);

    void Slsmg_write_string(char * str);

    void Slsmg_write_chars(char * chars, int length);

    void Slsmg_write_nstring(char * str, int length);

    void Slsmg_printf(char * format, ...);

    void Slsmg_vprintf(char * format, va_list args);

    void Slsmg_write_wrapped_string(char * str, int row, int column, int height, int
    width, int fill);

    ```


    All of these functions, except Slsmg_write_wrapped_string(), the requested string
    into the buffer at the cursor location using the current color and character set.
    They all have different ways of deciding what to write to, however. After the
    information has been written, the cursor is advanced to the end of the area affected,
    just as a normal terminal. Any strings that extend past the right side of the
    screen are truncated rather than wrapped. Although this is different from normal
    terminal output, it is reasonable for most full-screen applications, in which
    wrapped text has an adverse effect on the screen''s layout.


