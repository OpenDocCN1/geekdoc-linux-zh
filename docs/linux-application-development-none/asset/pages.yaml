- img_proc: true
  md: '# 430 Chapter 23 The Database Library


    ```

    int (*put)(const struct __db *, DBT *, const DBT *, u_int);

    int (*seq)(const struct __db *, DBT *, DBT *, u_int);

    int (*sync)(const struct __db *, u_int);

    int (*fd)(const struct __db*);

    void *internal;

    ```


    We discuss the individual elements of this structure later in this chapter; the
    important thing to notice is it is the collection of function pointers linked
    in DB. Every operation on an open db file is done through those function pointers.


    Three types of databases are provided by db: hash tables, btrees, and simple record-number-oriented
    access. Both hash tables and btrees provide efficient indexing of large amounts
    of data; the two data structures have different trade-offs in time and complexity
    measures influence which is a better choice for a given application [Cormen, 1992].


    The simpler record-oriented indexing provides a one-to-one mapping between the
    n records in the database and the integers 1...n. When record i is removed, records
    i+1...n are renumbered to i...n-1.


    We discuss the basic db interface without discussing any db, we recommend the
    interfaces for the three methods. For full details on, we recommend the following
    man pages: db(3), recno(3), hash(3), and btree(3) header


    All of the data types and function prototypes for db are in the <db.h> header
    file, which must be included in code that makes use of db.


    All of the database types are treated as key/value pairs. Hashed, btree, and record-numbered
    database files allow arbitrary values, and both hashed and btree databases allow
    arbitrary keys. Record-oriented databases restrict the keys to integers as mentioned
    earlier.


    Both keys and values are represented by a DBT record, which is defined as follows:


    +   1. DBT stands for database thang.'
