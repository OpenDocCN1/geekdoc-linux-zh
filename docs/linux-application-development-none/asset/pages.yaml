    # 12.2.3 Unmapping Regions


    After a process is finished with a memory mapping, it can unmap the memory region
    through munmap(). This causes future accesses to that address to cause a SIGSEGV
    (unless the memory is subsequently remapped) and saves some system resources.
    All memory regions are unmapped when a process terminates or begins a new program
    through an exec() system call.


    ```

    #include <sys/mman.h>

    ```


    ```

    int munmap(caddr_t addr, int length);

    ```


    The address is the address of the beginning of the memory region to unmap, and
    length specifies how much of the memory region should be unmapped. Normally, each
    mapped region is unmapped by a single munmap() call. Linux can fragment maps if
    only a portion of a mapped region is unmapped, but this is not a portable technique.


    # 12.2.4 Syncing Memory Regions to Disk


    If a memory map is being used to write to a file, the modified memory pages and
    the file will be different for a period of time. If a process wishes to immediately
    write the pages to the disk, it may use msync().


    ```

    #include <sys/mman.h>

    ```


    ```

    int msync(caddr_t addr, size_t length, int flags);

    ```


    The first two parameters, addr and length, specify the region to sync to disk.
    The flags parameter specifies how the memory and disk should be synchronized.
    It consists of one or more of the following flags logically OR''ed together:'
