    to use for recognizing each other, people tend to dismay at the idea of dealing
    with strings of digits. To allow humans to use alphabetic names for computers
    instead of numeric ones, the TCP/IP protocol suite includes a distributed database
    for converting host and IP addresses. This database is called the Domain Name
    System (DNS) and is covered in depth by many books [Stevens, 1994][Albitz, 1996].


