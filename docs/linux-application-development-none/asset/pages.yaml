  md: '# 142 Chapter 10 Simple File Handling


    the file name is used to allow two processes to not share file descriptors to
    communicate through the pipe (similar to the way Unix domain sockets work). Pipes
    are also known as FIFOs because the data is ordered in a first-in/first-out manner.


    # Directories


    Directories are special files that consist of a list of files they contain. Old
    Unix implementations allowed programs to read and write them in exactly the same
    manner as regular files. To allow better abstraction, a special set of system
    calls was implemented to provide directory manipulation, although the directories
    are still opened and closed like regular files. Those functions are presented
    in Chapter 11.


    # Devices


    Most physical devices are represented as files. There are two types of device
    files: block devices and character devices. Block device files represent hardware
    devices that cannot be read by a byte at a time; they must be read in multiples
    of some block size. Under Linux, block devices receive special handling from the
    kernel and can contain file systems. Disk drives, including CD-ROM drives and
    RAM disks, are the most common block devices. Character devices can be read from
    a single character at a time, and the kernel provides no caching or ordering facilities
    for them. Modems, transmitters, printers, sound cards, and mice are all character
    devices. Traditionally, special directory entries kept in the /dev directory allow
    allow user-space processes to access device resources as files.


    # Symbolic links


    A symbolic link (symlink) is a special kind of file that contains the path to
    another file. When a symlink is opened, the system recognizes it as a symlink,
    reads its value, and opens the file it references instead of the symlink itself.
