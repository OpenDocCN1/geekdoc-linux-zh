  md: '# Chapter 13 Signal Processing


    As the final choice seems much cleaner and easier than the others, the original
    signal implementation caused slow system calls to return EINTR when they were
    interrupted by a signal, whereas fast system calls completed before the signal
    was delivered.


    Slow system calls take an indeterminate amount of time to complete. System calls
    that wait for unpredictable resources, such as other processes or a homo sapiens,
    to perform some action are considered slow. The wait() family of system calls,
    for example, do not normally return until a child process exits. As there is no
    way to know how long that may take, wait() is a slow system call. File access
    system calls are considered slow if they access files, and if they access fast
    files.


    It was the process’s job to handle EINTR and restart system calls as necessary.
    Although this provided all the functionality people needed, it made it difficult
    to write code that handled signals. Every time read() was called on a slow file
    descriptor, the code had to be modified to check for EINTR and restart the call,
    or the code might not perform as expected.


    To “simplify” things, 4.2BSD automatically restarted certain system calls (notably
    read() and write()). For the most common operations, programs no longer needed
    to worry about EINTR because the system call would continue after the process
    handled the signal. Versions of Unix changed which system calls would be automatically
    restarted, and 4.3BSD allows you to choose whether to restart system calls. The
    POSIX signal standard does not specify which behavior should be used, but all
    popular systems agree on how to handle this. By default, system calls are not
    restarted, but for each signal, the process can set a flag that indicates that
    it would like the system to automatically restart system calls interrupted by
    that.


    # 13.2 The Linux (and POSIX) Signal API


    # 13.2.1 Sending Signals


    Sending signals from one process to another is done through the kill() system
    call. This system call is discussed in detail on page 116.


    +   4. The difference between fast files and slow files is the same as the difference
    between fast and slow system calls and is discussed in more detail on page 153.'
