  md: '# 20.3 Linux Console Capabilities 395


    you can restore it as many times as you wish. Each time, the cursor will revert
    to the same location. When you restore the cursor position, you also restore character
    rendition attributes, current character set, and character set definitions, all
    described later in this chapter.


    Cursor position is given in terms of a character cell address, an x,y pair of
    numbers that names one position on the screen. Character addresses on most terminals,
    including the Linux console, do not follow standard computer-science practice
    of counting from zero. The upper-left character on the screen is the origin and
    is addressed as character cell 1,1.


    Note that control characters may be included in the middle of an escape sequence.
    For example, ^[G8 will first beep and then restore the cursor position and attributes.
    The sequence ^[X8 will simply print an 8.


    #  20.3.3 Testing Sequences


    To test most sequences, you merely need to log into a virtual console and run
    cat. Type the sequences you wish to test, and watch the results. For ^[, press
    the Escape key.


    Terminal responses to commands such as the ^[Z terminal identification command
    or the CSIn command documented later show up as escape sequences that disappear
    in terminal handling. In cases in which you wish to see such a response, you can
    simply run


    ```

    cat > /tmp/myfile

    ```


    Then type the commands, followed by a return and a ^D. Use less, vi, Emacs, or
    some other program that can handle arbitrary characters to read /tmp/myfile, where
    you will find the responses directly following the sequences you typed.'
