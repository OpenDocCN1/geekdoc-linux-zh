    The argument-handling code that starts on line 28 calls a few important functions.
    When called with no command-line arguments, id looks up information based on what
    user ran it and reports on. getuid() is documented in Chapter 9; it returns the
    user ID of the process that calls it. getpwuid() then looks up the password file
    entry for that user. If id is given a username as a command-line argument, instead
    looks up the entry based on the name that it is given, regardless of the ID of
    the user that runs.


    The id program first prints the user’s numeric ID and name. The password file
    includes the name of the user’s primary group. If that group exists in the group
    file, id prints its number and name.


    Chapter 9 documents all the different forms of IDs that the kernel uses. id needs
    to use getuid() and getgid() to check the effective uid and gid and print them
    if they differ from the real uid and gid. Again, we look up password and group
    structures by numeric ID.


    Finally, id needs to print out all the supplementary groups. This is a little
    tricky because there are two ways to determine the list of supplementary groups.
    If a user is running id with no arguments, then id will use the getgroups() function
    to determine what groups the user is a member of. Otherwise, it will get a list
    of groups out of the group database.'
