    In almost every situation, a program will use tcgetattr() to get a device''s current
    settings, modify those settings, and use tcsetattr() to make the modified settings
    active. Many programs will also save a copy of the original settings and restore
    them before terminating. In general, modify only the settings that you know care
    about; changing other settings may make it difficult for users to work around
    unusual system configurations (or bugs in your code).


    tcsetattr() may not honor all the settings you choose; it is allowed to ignore
    arbitrary settings. In particular, if the hardware simply does not support a setting,
    it will ignore rather than return an error. If you care that a setting really
    takes effect, you will have to use tcgetattr() after tcsetattr() and test to make
    sure that your change took effect.


    To get a device''s settings, you have to open the device and use the file descriptor
    in the tcgetattr() call. This poses a problem with many devices; which may normally
    be opened only once, to prevent device contention. Fortunately, giving the O_NONBLOCK
    flag to open() will cause it to be opened immediately and not block on any operations.
    However, you may still prefer to block on read(); if so, use fcntl() to turn off
    O_NONBLOCK before you read or write to:


    ```

    fcntl(fd, F_SETFL, fcntl(fd, F_GETFL) & ~O_NONBLOCK);

    ```


    The term flags control four distinct parts of managing input and output. The input
    flag, c_iflag, determines how received characters are interpreted and processed.
    The output flag, c_oflag, determines how characters your writes to the terminal
    are interpreted and processed. The control flag, c_cflag, determines serial protocol
    characteristics of the device and is useful for physical devices. The local flag,
    c_lflag, determines how characters are collected and processed before they are
    sent to output'
