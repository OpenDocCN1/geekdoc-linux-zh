    \ parsing.\n\n```\n#include <popopt.h>\n```\n\n```\nint popGetNextOpt(popoptContext\
    \ con);\n```\n\nTaking the context as its sole argument, this function parses\
    \ the next command-line argument found. After finding the next argument in the\
    \ option table, the function fills in the object pointed to by the option entry's\
    \ arg pointer if it is not NULL. If the val entry for the option is non-0, the\
    \ function then returns that value. Otherwise, popGetNextOpt() continues to the\
    \ next argument.\n\npopGetNextOpt() returns -1 when the final argument has been\
    \ parsed, and other negative values when errors occur. This makes it a good idea\
    \ to keep the val elements in the options table greater than 0.\n\nIf all of the\
    \ command-line options are handled through arg pointers, command-line parsing\
    \ is reduced to the following line of code:\n\n```\nrc = popGetNextOpt(popoptcon);\n\
