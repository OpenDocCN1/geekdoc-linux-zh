    When a tty is in raw mode, these two settings determine the read()system call''s
    behavior. This particular setting says that when we call read(), we want read
    to return until one or more bytes have been read. We will never call read() unless
    we know that there is at least one byte to read, so this will be functionally
    equivalent to a nonblocking read().The definition of VMIN and VTIME is complex,
    as we demonstrate on page 307.


    The default termios settings include some end-of-line character translation. That
    is okay for dial-in lines and for terminal sessions, but when we are connecting
    two ttys, we do not want the translation to happen twice. We do not want to map
    newline characters to a carriage return/newline pair on output, and we do not
    want to map a received carriage return to a newline on input, because we are already
    receiving carriage return/newline pairs from the remote system:


    ```

    pts.c_oflag &= ~ONCR;

    pts.c_iflag &= ~ICRNL;

    ```


    Without these two lines, using robin to connect to another Linux or Unix computer
    will result in the remote system seeing you Return twice each time you press it
    once, and each time it tries to display a new line on your screen, you will see
    two lines. So each time you press Return (assuming you manage to log in with these
    terminal settings), you will see two prompts echoed back to you, and if you run
    vi, you will see ~characters on every other line rather than every line.


