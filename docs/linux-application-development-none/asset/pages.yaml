  md: '# 23.2.2 Closing a Database


    Database files are closed through the close member of DB, which looks like this:


    ```

    int close(const DB * db);

    ```


    The close() function returns 0 on success, and non-0 if it fails, which can occur
    if the database''s buffers cannot be flushed for any reason. Here is an example
    program that opens a database file in the current directory and immediately closes
    it.


    ```

    1: /* dbsimple.c -- simple db example */

    2:

    3: /* this program opens a database, and then closes it immediately */

    4:

    5: #include <db.h>

    6: #include <errno.h>

    7: #include <fcntl.h>

    8: #include <stdio.h>

    9:

    10: int main(void) (

    11:   DB *db;

    12:

    13:   db = dbopen("test.db", O_RDWR | O_CREATE, 0666, DB_HASH, NULL);

    14:   if (db) (

    15:     perror("dbopen");

    16:     return 1;

    17:   )

    18:

    19:   db->close(db);

    20:

    21:   return 0;

    22: )

    ```'
