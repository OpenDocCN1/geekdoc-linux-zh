  md: '# Chapter 3 More Information on Linux


    The information on how to join these lists is current as we write it. Be aware
    that list managers occasionally change the software that runs a list, and that
    lists sometimes move. We keep up-to-date information on these lists on the LAD
    Web site at http://www.awl.com/cseng/books/lad/lists.html


    # 3.5.1 vger


    To the extent that anything related to Linux can be called “official,” the mailing
    lists hosted by vger.rutgers.edu are the official Linux mailing lists. In particular,
    most of the major kernel developers read the linux-kernel@vger.rutgers.edu list.


    The vger lists are run by Majordomo commands by sending a message to majordomo@vger.rutgers.edu
    with a body containing the single word help. You can request a list of all the
    mailing lists currently available from vger with the word lists.


    Most of the lists are related either to development of some particular part of
    Linux (such as the kernel, networking, or DOS emulator) or to some facet of administration.


    # 3.5.2 Other Lists


    People around the globe maintain mailing lists for one purpose or other. Most
    lists are mentioned in Web pages somewhere, and many are archived on the Web,
    so following links from Linux Web sites you know or searching a Web crawler, such
    as Alta Vista, are useful ways to find mailing lists for a topic in which you
    are interested. Some lists are announced in the comp.os.linux.announce newsgroup;
    searching cola archives can some-times be fruitful. Looking at the lists archived
    at linuxuxq (see page 25) can also be useful.


    Most Linux vendors contribute to Linux development by hosting mailing lists. They
    are rarely shy about this service; you can usually find out which lists they host
    by looking at their Web pages.'
