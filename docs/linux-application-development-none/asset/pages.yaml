    Unix files can be divided into two categories: seekable and nonseekable. Nonseekable
    files are first-in/first-out channels that do not support random reads or writes,
    and data cannot be reread or overwritten. Seekable files allow the reads and the
    writes to occur anywhere in the file. Pipes and sockets are nonseekable files;
    block devices and regular files are seekable.


    As FIFOs are nonseekable files, it is obvious where read() reads from the beginning
    of the file) and write() writes to (the end of the file). Seekable files, on the
    other hand, have no obvious place for the operations to occur. Instead, both happen
    at the “current” Location in the file and advance the current location after the
    operation. When a seekable file is initially opened, the current location is at
    the beginning of the file, or offset 0. If 10 bytes are read, the current position
    is then at offset 10, and a write of 5 bytes will overwrite the data, starting
    with the eleventh byte in the file (which is at offset 10, where the current position
    was). After such a write, the current position becomes offset 15, immediately
    after the overwritten data.


    If the current position is the end of the file and the process tries to read from
    the file, read() returns 0 rather than an error. If more data is written at the
    end of the file, the file grows just enough to accommodate the extra data and
    the current position becomes the new end of the file. Each file


