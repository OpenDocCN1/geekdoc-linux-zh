  md: "# 16.1.4 Addresses\n\nAs every protocol has its own definition of a network\
    \ address, the sockets API must abstract addresses. It uses a struct sockaddr\
    \ the basic form of an address; its contents are defined differently for each\
    \ protocol family. Whenever a struct sockaddr is passed to a system call, the\
    \ process passes the size of the address that is being passed.\n\nAll struct sockaddr\
    \ types conform to the following definition:\n\n```\n#include <sys/socket.h>\n\
    \nstruct sockaddr {\n    unsigned short sa_family;\n    char sa_data[MAXSOCKADDR_DATA];\n\
