  md: '# 16.1.2 Real Networking


    Although may seem pretty basic, it is not at all how underlying computer networks
    work. Networks tend to be chaotic and random. Imagine a first grade class at recess,
    except they are not allowed to speak to each other and they have to stay at least
    five feet apart. Now, chances are those kids are going to find some way to communicate—perhaps
    even by paper airplanes!


    Imagine whenever students want to send letters to one another, they simply write
    the letters on pieces of paper, fold them into airplanes, write the name of the
    intended recipient on the outside, and hurl them toward someone who is closer
    to the final recipient than the sender is. This intermediate looks at the airplane,
    sees who the intended target is, and sends it toward the next closest person.
    Eventually, the intended recipient will (well, may) get the airplane and unfold
    it to read the message.


    Believe it or not, this is almost exactly how computer networks operate.³ The
    intermediaries are called routers and the airplanes are called packets, but the
    rest is the same. Just as in the first grade class, some of airplanes (or packets)
    are going to get lost. If a message is too long to fit in a single packet, it
    must be split across multiple ones (each of which may be lost). All the students
    in between can read the packets if they like⁴ may simply throw the message rather
    than deliver it. Also, anyone can interrupt your conversation by sending new packets
    into the middle of it.


    # 16.1.3 Making Reality Play Nice


    Confronted with the reality of millions of paper airplanes, protocol designers
    endeavor to present a view of the network more on par with the telephone than
    the first grade class. Various terms have evolved to describe networking protocols.


    +   3. This is how packet-switched networks work, anyway. An alternative design,
    circuit-switched networks, acts more like telephone connections. They are not
    widely used in computer networking, however.

    4. This is why cryptography has gained so much importance since the advent of
    the Internet.'
