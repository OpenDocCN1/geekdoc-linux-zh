  md: '# Chapter 15 Terminals and Pseudo Terminals


    VSUSP


    Offset VSUSP is usually set to ^Z. It causes the current foreground process group
    to be sent SIGTSTP; see Chapter 14 for details.


    VEOL and VEOL2


    In canonical mode, these characters, in addition to the newline character (''\n''),
    signal an end-of-line condition. This causes the collected buffer to be transmitted
    and a new buffer started. On some systems, VEOL may share space with the VTIME
    character, which is active only in raw mode, just as VEOF may share space with
    VMIN. The VEOL2 character is not specified by POSIX.


    VPRINT


    Offset VPRINT is usually set to ^R. In canonical mode, if the ECHO flag is set,
    it causes the VPRINT character to be echoed locally, a newline (and a carriage
    return, if appropriate) to be echoed locally, and the whole current buffer to
    be reprinted. This character is not specified by POSIX.


    WERASE


    Offset VWERASE is usually set to ^W. In canonical mode, it erases any white space
    at the end of the buffer, then all adjacent non-white-space characters, which
    has the effect of erasing the previous word on the line. This character is not
    specified by POSIX.


    VLNEXT


    Offset VLNEXT is usually set to ^V. It is not entered into the buffer, but it
    causes the next character input to be put into the buffer literally, even if it
    is one of the control characters. Of course, to enter a single literal VLNEXT
    character, type it twice. This character is not specified by POSIX.


    To disable any control character position, set its value to _POSIX_DISABLE. This
    only works if _POSIX_DISABLE is defined, and is defined as something other than
    -1. _POSIX_DISABLE works on Linux, but a portable program will, unfortunately,
    not be able to depend on disabling control character positions on all systems.'
