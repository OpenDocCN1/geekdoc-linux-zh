    Few libraries are licensed under the terms of the GPL; most are licensed

    under the terms of the LGPL. Libraries licensed under the terms of the

    GPL are usually that way simply because the author did not know about

    or consider the LGPL. In response to a polite request, many will relicense

    their libraries under the terms of the LGPL.


    # 2.3.4 MIT/X-Style Licenses


    MIT/X-style licenses are much simpler than the GPL or LGPL; their only

    restrictions (stated simply) to keep all existing copyright notices and

    license terms intact in source and binary distributions, and not to use the

    name of any author to endorse or promote derived works without prior

    written permission.


    # 2.3.5 BSD-Style Licenses


    BSD-style licenses essentially add to the conditions of the MIT/X-style

    licenses the restriction that advertising materials that mention features or

    use of the software include an acknowledgment.


    # 2.3.6 Artistic License


    The Perl language source code is distributed with a license that allows you

    to follow either the terms of the GPL or of an alternative license, whimsi-

    cally called the Artistic License. The main goals of the Artistic License are

    to preserve redistribution rights and to prevent users from selling altered,

    proprietary modifications that masquerade as the official version. Other

    software authors have adopted Perl’s convention of allowing users to fol-

    low the terms of either the GPL or the Artistic License; a few are licensed

    onlyly under the terms of the Artistic License.'
