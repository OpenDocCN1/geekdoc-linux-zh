    # 9.5 Simple Children


    Although fork(), exec(), and wait() allow programs to make full use of the Linux
    process model, many applications do not need that much control over their children.
    There are two library functions that make it easier to use child processes: system()
    and popen().


    # 9.5.1 Running and Waiting with system()


    Programs regularly want to run another program and wait for it to finish before
    continuing. The system() function allows a program to do this easily.


    ```

    system(const char * cmd);

    ```


    system() forks a child process that exec()/bin/sh, which then runs cmd. The original
    process waits for the child to exit and returns the same status code that wait()
    does. If you don''t need the shell to hang around (which is rarely necessary),
    cmd should contain a preceding "exec", which causes the shell to exec() cmd rather
    than run cmd as a subprocess.


    As cmd is run through the /bin/sh shell, normal rules for command expansion apply.
    Here is an example of system() that displays all the C source files in the current
    directory.'
