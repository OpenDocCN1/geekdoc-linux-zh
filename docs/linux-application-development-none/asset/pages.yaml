  md: '# 26.2 Modifying the System Databases


    The C library provides two functions for modifying the system databases, one for
    each database. However, they generally work only on systems that use the standard
    files and often damage systems that use alternate databases; the interfaces were
    not coded with the new systems in mind. Some systems, particularly ones that are
    part of networks, use multiple databases, with some users in system databases
    and other users in databases. The current C library interface is fine for looking
    up users, but for modifying user information, it has a tendency to put all the
    entries in one particular database rather than in the database in which they were
    originally found.


    Recently, two interfaces have been written to deal with this problem. Two types
    of information have traditionally been stored in the system databases: information
    about users and authentication information. Many current systems separate the
    two types of information in some way. The interfaces here are not included with
    some older Linux distributions as of this writing. They are, however, freely redistributable,
    so you can require them for any application you write.


    # 26.2.1 Pluggable Authentication Modules


    Pluggable Authentication Modules, or PAM, is a specification and library specifically
    for configuring authentication on a system. The library provides a standard and
    relatively simple interface for changing authentication information (such as a
    user''s password), as well as for doing authentication itself. The Linux-PAM implementation¹
    includes full documentation on how to program to the PAM interface.


    PAM is a standard interface that is being implemented on nearly all versions of
    Unix and is already available on several. It is a portable interface, so we recommend
    that you authenticate users using PAM. If you need to port code written to the
    PAM standard to an operating system that does not support PAM, the port will be
    trivial. However, because PAM is a somewhat rigid standard, it can be less easy
    to port applications that do not support PAM to a system that uses PAM.


    +   1. http://www.kernel.org/pub/linux/libs/pam/index.html'
  merge: -1
