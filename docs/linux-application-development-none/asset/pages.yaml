    # 8.2 Finding Header and Library Files


    Most header files that come with your Linux system are stored in the /usr/include
    hierarchy. There are two exceptions. Header files for the X Window System are
    available in /usr/include/X11, and many of the system header files stored in /usr/include
    depend on the header files included with the Linux kernel source. The compiler
    will search for include files in /usr/include by default.


    Linux distributions always put links from /usr/include to the header files that
    come with the Linux kernel source, so links should all /usr/include/asm, /usr/include/linux,
    and /usr/include/scsi should point to wherever those headers are kept, which keeps
    this transparent. You should never need to know it unless you start replacing
    the kernel sources that were included with your system with newer Linux sources
    that you download from the Internet.


    Libraries are much the same way, with a twist. Libraries that are considered critical
    to booting the system (and repairing it, if necessary) are in /lib. Other system
    libraries are in /usr/lib, except for X11R6 libraries, which are in /usr/X11R6/lib.
    (There are no "kernel libraries" equivalent to the kernel header files. The kernel
    is a library that has special privileges and is accessed through system calls.)
    The compiler will search for libraries in /lib and /usr/lib default.


    In order to compile programs using the standard X11R6 libraries, you will need
    to give gcc -I/usr/X11R6/include while compiling, and -L/usr/X11R6/lib while linking.'
