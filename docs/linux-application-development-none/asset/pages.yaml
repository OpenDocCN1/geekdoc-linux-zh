  md: '# 16.4.4 Running the Unix Domain Examples


    The previous two example programs, one a server and the other a client, are designed
    to work together. Run the server from one terminal, then run the client from another
    terminal (but in the same directory). As you type lines into the client, they
    will be sent to the socket to the server. When you exit the client, the server
    will wait for another connection. You can transmit files through the socket by
    redirecting the input to the client program.


    # 16.4.5 Unnamed Unix Domain Sockets


    Because Unix domain sockets have some advantages over pipes (such as being full
    duplex), they are often used as an IPC mechanism. To facilitate this, socketpair()
    system call was introduced.


    ```

    #include <sys/socket.h>


    socketpair(int domain, int type, int protocol, int sockfds[2]);

    ```


    The first three parameters are the same as the parameters passed to socket().
    The final parameter, sockfds(), is filled in by socketpair() with two file descriptors,
    one for each end of the socket. A sample application of sock-pair() is shown on
    page 336.


    # 16.4.6 Passing File Descriptors


    Unix domain sockets have a unique ability: File descriptors can be passed through
    them. No other IPC mechanism supports this facility. It allows a process to open
    a file and pass the file descriptor to another—possibly unrelated—process. All
    the access checks are done when the file is opened, so the receiving process gains
    the same access rights to the file as the original process.


    File descriptors are passed as part of a more complicated message that is sent
    using the sendmsg() system call and received using recvmsg().'
