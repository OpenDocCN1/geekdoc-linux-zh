    # 22.1 Input Handling


    Terminal input handling is one of the least portable subsystems in the Unix world.
    BSD sgtty, System termio, and POSIX termios have all been widely used. The S-Lang
    library hides this complexity through a few functions designed to make keyboard
    handling more straightforward and portable.


    Writing a program to read a character at a time from the terminal and print each
    character onto its own line is fairly straightforward:


    ```

