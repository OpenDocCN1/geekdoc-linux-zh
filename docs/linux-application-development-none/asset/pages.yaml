  md: "# 16.5.2 IPv4 Addressing\n\nIPv4 connections are a 4-tuple of (local host,\
    \ local port, remote host, remote port). Each part of the connection must be determined\
    \ before a connection can be established. Local host and remote host are each\
    \ IP addresses. IP addresses are 32-bit (4-byte) numbers unique across the entire\
    \ network. Usually, they are written as aaa.bbb.ccc.ddd, with each element in\
    \ the address being the decimal representation of one of the bytes in the machine’s\
    \ address. The left-most number in the address corresponds to the most significant\
    \ byte in the address. This format for IP addresses is known as dotted-decimal\
    \ notation.\n\nAs machines need to run multiple concurrent TCP/IP applications,\
    \ an IP number does not provide a unique identification for a connection on a\
    \ single machine. Port numbers are 16-bit numbers that uniquely identify one endpoint\
    \ of a connection on a single host. The combination of an IP address and a port\
    \ number identifies a connection endpoint anywhere on a single TCP/IP network\
    \ (the Internet is a single TCP/IP network). Two connection endpoints afford a\
    \ TCP connection, so two IP number/port pairs uniquely identify a TCP/IP connection\
