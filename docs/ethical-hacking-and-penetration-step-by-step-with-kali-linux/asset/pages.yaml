    \ --- TCP syn scan, quick and quiet\n    * nmap -T 192.168.66.132 >> syn.txt --\
    \ TCP scan - can be detected by IDS\n    * nmap -sU 192.168.66.132 >> udp.txt\
    \ - UDP scan\n    * nmap -sM 192.168.66.132 >> bsd.txt --- TCP stack scan on BSD\
