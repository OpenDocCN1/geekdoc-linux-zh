  md: '# HSRP DoS attack


    ![](img/c6b688dca6570d17db3036b560ef0905_72_0.png)


    Hot Standby Router Protocol (HSRP) is a Cisco proprietary redundancy protocol
    for establishing a fault-tolerant default gateway.


    With HSRP you can have multiple network devices and represent only one IP address
    to the clients, so if one device fails the other will take the role.


    With this attack we can make Kali to join the HSRP cluster and become the active
    router. Once this is done all of the client’s traffic will be sent to Kali instead
    of the router. Attacker can achieve a “Man In The Middle” or a DoS attack and
    cause interruption for the clients.'
