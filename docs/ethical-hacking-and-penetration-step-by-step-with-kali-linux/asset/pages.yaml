  md: "# # Describe and Use a Rainbow Table\n\n# # What is a Rainbow Table ?\n\n![](img/c6b688dca6570d17db3036b560ef0905_133_0.png)\n\
    \nA rainbow table is a listing of all possible plaintext permutations of encrypted\
    \ passwords specific to a given hash algorithm.\n\nRainbow tables are often used\
    \ by password cracking software for network security attacks. All computer systems\
    \ that require password-based authentication store databases of passwords associated\
    \ with user accounts, typically encrypted rather than plaintext as a security\
    \ measure.\n\n+   - Rainbow table will compare the hash with a hash list instead\
    \ of checking clear text passwords\n  - This will make it much quicker to find\
    \ the password\n  - We can download the rainbow tables on Internet\n- Using tools\
    \ like armitage, meterpreter, ophcrack\n- An example of using a rainbow table:\n\
    - Run armitage\n- Do a quick namp scan to find the device"
  merge: -1
