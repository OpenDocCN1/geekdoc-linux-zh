  md: "# Wireless Man in the middle attack using bridging\n\n![](img/c6b688dca6570d17db3036b560ef0905_62_0.png)\n\
    \nOne of the common attacks on wireless networks is the Man In The Middle (MIDM)\
    \ attack. To achieve this you need to set up your Kali as an access point and\
    \ its network cards in bridge mode, so client won't notice any change. Once the\
    \ client is connected to your device and you use the network as normal, sniffers\
    \ like Wireshark can be used to capture its traffic.\n\n+   * Use the above steps\
    \ to create an AP with airmon-ng, airodump-ng and airbase-ng\n* Commands to achieve\
    \ this as below:\n  * ifconfig - verify the hardware\n  * Set up the access point\
    \ on your wireless interface\n    * airmon-ng start wlan0\n    * airodump-ng mon0\n\
    \    * airbase-ng -essid “Corporate-WIFI” -c 1 mon0\n* Set up the bridge interface\
    \ for between at0 and eth0 called BR1"
