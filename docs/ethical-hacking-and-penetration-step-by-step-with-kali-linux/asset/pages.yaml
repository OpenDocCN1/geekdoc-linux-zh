  md: '# What is Ethical hacking?


    Ethical hacking is a technique to find out the vulnerabilities on the network
    and systems and recommend how to protect them. The techniques that you learn on
    this book are purely white hacking techniques to find the holes and risks on the
    networks and systems.


    These techniques must not be used on any production network without having a formal
    approval from the management team. Using these techniques without having an approval
    can be illegal and can cause serious damage to others properties.'
  merge: -1
  pgno: 11
- img_proc: true
  md: "# Types of Ethical hacking\n\nThere are multiple types of Ethical hacking but\
    \ usually they can be categorized as below\n\n+   * White box\n  * When we have\
    \ full knowledge of the network and the also the systems on the network. The attacker\
    \ can be an old employee, relative, vendor or a contractor who has a complete\
    \ understanding of the infrastructure, software and hardware used within the destined\
    \ company.\n* Black box\n  * When we have no knowledge of the infrastructure and\
    \ try to penetrate without any information. On this type of attack, usually the\
    \ first step of type of attacks is to gather enough information about the company,\
    \ infrastructure and systems. Once all the required information obtained next\
    \ step is to find the vulnerabilities and try to exploit them.\n* Vulnerability\
    \ assessment\n  * This is purely assessing the vulnerabilities on the network\
    \ and analysing them. This is usually a safe work and won't have any effect on\
    \ operation. Most of the times the techniques in this category are not illegal\
    \ but it is always safe to inform people prior to doing that as there could be\
    \ some complications.\n* Penetration testing\n  * This is a type of attack that\
    \ we try to take over the control of the system or a device. With the techniques\
    \ in this category there is a high risk of potential interruption to the operation\
    \ of a device or network. Using these techniques without having a formal approval\
    \ and commitment from the destined company is illegal."
  merge: -1
  pgno: 12
- img_proc: true
  md: '# What are the responsibilities of an Ethical Hacker?


    As an Ethical hacker you have a clear responsibly about how you use your knowledge
    and techniques. It is also very important to understand what the expectations
    from an Ethical hacker are and what you should consider when assessing the security
    of a customer’s organization.


    Below are a couple of important things you must consider as an Ethical hacker:


    +   * Must use your knowledge and tools only for legal purposes

    * Only hack to identify security issues with the goal of defence

    * Always seek management approval before starting any test

    * Create a test plan with the exact parameters and goals of test and get the management
    approval for that plan

    * Don’t forget, your job is to help strengthen network and nothing else!'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# What are the customer’s expectations?


    It is very important to understand the customer’s expectation before starting
    any work. As the nature of this work (Ethical hacking) is high risk and requires
    a lot of attentions; if you don''t have a clear understanding of their requirements
    and expectations, the end result might not be what they want and your time and
    effort will be wasted. This could also have some legal implications as well if
    you don’t follow the rules and address customer’s expectation.


    Below are some important things you should note:


    +   * You should work with customer to define goals and expectations

    * Don’t surprise or embarrass them by the issues that you might find

    * Keep the results and information confidential all the time

    * Company usually owns the resultant data not you

    * Customers expect full disclosure on problems and fixes'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# What are the required skills of the hacker?


    To be an Ethical hacker you should have extensive knowledge about a range of devices
    and systems. Ideally you should have multiple years of experience in IT industry
    and be familiar with different hardware, software and networking technologies.


    Some of the important skills required to be an Ethical hacker are as below:


    +   - Should already be a security expert in other areas (perimeter security,
    etc.)

    - Should already have experience as network or systems administrator

    - Experience on wide variety of Operating Systems such as Windows, Linux, Unix,
    etc.

    - Extensive knowledge of TCP/IP - Ports, Protocols, Layers

    - Common knowledge about security and vulnerabilities and how to correct them

    - Must be familiar with hacking tools and techniques (We will cover this in this
    book)'
  merge: -1
  pgno: 15
