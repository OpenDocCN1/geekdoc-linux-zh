  md: '# Introduction


    This book is a complete guide for those who would like to become an Ethical hacker.
    In this book you will learn what the Ethical hacking and its procedure is. The
    first couple of chapters are the definitions, concepts and process of becoming
    an Ethical hacker while the next half of the book will show in detail how to use
    certain tools and techniques to initiate attacks and penetrate a system.


    After reading this book, you should be able to use these tools to do some testing
    and even working on penetration projects. You just need to remember not to use
    these techniques in a production environment without having a formal approval.


    On each section, we have provided the commands used to achieve the penetration
    goal. You need to follow the commands and change the parameters or names to suit
    your environment.'
