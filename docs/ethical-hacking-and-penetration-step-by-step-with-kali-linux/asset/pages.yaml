  md: "# Nmap - Free Security Scanner\n\n![](img/c6b688dca6570d17db3036b560ef0905_64_0.png)\n\
    \nNmap is one of the best and most popular scanning tools which can be used post\
    \ reconnaissance step. It has a lot built-in features and plugins which can be\
    \ used to identify the vulnerable hosts and services on the network or over Internet.\n\
    \nUsing“man nmap” and “nmap -h” you can familiarize yourself with its options\
    \ and usage.\n\n+   * Below we explain some examples of using nmap\n  * nmap 192.168.1.24\
    \ -- Scanning one IP address\n  * nmap 192.168.1.0 - 255 -- Scanning a range of\
    \ IP addresses\n  * nmap 192.168.1.0/24 -- Scanning a subnet\n  * nmap -sP -iP0\
    \ -- Ping scan\n  * nmap -sS -PP0 -sV -O 192.168.1.0-50 -- TCP Syn scan, Protocol\
    \ scan, determine the version, discover the operating system"
  merge: -1
  pgno: 64
- img_proc: true
  md: '+   ○ nmap -T5 192.168.1.0/24 -- Timing aggressiveness - T5 is quicker than
    T1


    +   ○ nmap -top-ports 20 192.168.1.0/24 -- only top 20 ports - popular ports


    +   ○ nmap -sT -p80 192.168.1.50-100 -- TCP scan, only port 80

    ○ nmap -sS 192.168.1.1-5 -D 192.168.98,192.168.1.99 -- Will send the scans from
    multiple source IP addresses that you specify after D. This can distract the network
    admin as there are a lot of scans from multiple sources


    +   ○ nmap -V 192.168.1.6 -- Verbose mode will provide more details on screen


    +   ○ nmap -F 192.168.1.0/24 -exclude 192.168.1.1, 192.168.1.2 -- -F means only
    top 100 ports to be scanned and exclude those two IP address from the range


    +   ○ nmap -Pn 192.168.1.6 -- It won''t do ping but just do the scan. Without
    this option, it will try pinging the host first


    +   ○ nmap --iflist -- Get a list of interfaces and IPs


    +   ○ nmap -A -T4 192.168.1.1 --A means do the Script, Operating NMAP with version,
    traceroute, T4 for timing


    +   * Using Nmap with IPv6


    +   ○ ifconfig eth0 ipv6 add 2001:db8:6783:1::64


    +   ○ nmap -6 2001:db8:6783:1::1


    +   * Nmap Scripts


    +   ○ nmap --script=default 192.168.1.24 -- The same as nmap -sC 192.168.1.24


    +   ○ There are a lot of script options like DoS, Safe, exploit, malware, vulnerability,
