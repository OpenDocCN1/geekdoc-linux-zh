  md: "# Converting Access port to a 802.1q trunk port using DTP\n\n![](img/c6b688dca6570d17db3036b560ef0905_74_0.png)\n\
    \nAccess ports are the ports which are being used to connect the end clients computers,\
    \ printers, servers, etc. They can participate in one Vlan only.\n\nTrunk ports\
    \ are the ports which are being used for network communications between multiple\
    \ network devices and can carry multiple Vlans.\n\nThe network switches by default\
    \ will negotiate the possibility of the port to become a trunk port (DTP). This\
