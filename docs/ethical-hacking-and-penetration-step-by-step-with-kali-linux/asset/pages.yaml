  md: '# Become the Root of Spanning Tree


    ![](img/c6b688dca6570d17db3036b560ef0905_68_0.png)


    The Spanning Tree Protocol (STP) is a network protocol that ensures a loop-free
    topology for any bridged Ethernet local area network. The basic function of STP
    is to prevent bridge loops and the broadcast radiation results from them.


    The root bridge of the spanning tree is the bridge with the smallest (lowest)
    bridge ID which is the focal point in the network. The root bridge of the spanning
    tree is the bridge with the smallest (lowest) bridge ID. Each bridge has a configurable
    priority number and a MAC Address; the bridge ID contains both numbers combined
    together - bridge priority + MAC (32768.0200.0000.1111).


    With this attack, we can take over the bridge responsibility and break the network
    operation.


    +   * The tool that will be used for this attack is Yersinia

    * One option is to have a device between two switches (potentially a hub) and
    connect Kali to that device

    * Second option is if you have two interfaces on Kali and connect each to one
    switch and launch a STP+Man in the middle attack and Kali'
  merge: -1
  pgno: 68
- img_proc: true
  md: 'will become root


    +   - Then we can advertise device as STP root

    - Yersinia -G -- Graphical interface of yersinia

    - Select STP and launch attack

    - Select "Claiming Root Role" and Launch the attack


    ![](img/c6b688dca6570d17db3036b560ef0905_69_0.png)'
