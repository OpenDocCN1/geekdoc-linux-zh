  md: '# MITM attack on IPv6 with Parasite 6


    ![](img/c6b688dca6570d17db3036b560ef0905_124_0.png)


    We have shown you how to launch a MITM attack on IPv4 before. It is not more complicated
    to initiate a MITM attack in an IPv6 environment.


    IPv6 Neighbor Discovery (ND) is a set of messages and processes that determine
    relationships between neighboring nodes. ND replaces Address Resolution Protocol
    (ARP), Internet Control Message Protocol (ICMP) Router Discovery, and ICMP Redirect,
    which are used in IPv4, and provides additional functionality. ND is described
    in RFC 2461, "Neighbor Discovery for IP Version 6 (IPv6)."


    ND is used by hosts to:


    +   * Discover neighboring routers.

    * Discover addresses, address prefixes, and other configuration parameters.


    ND is used by routers to:


    +   * Advertise their presence, host configuration parameters, and on-link prefixes.

    * Inform hosts of a better next-hop address to forward packets by a specific destination.


    Neighbor discovery operation in IPv6 can be used to initiate a MITM attack. Below
    steps using Parasite 6 will show how to launch an MITM'
