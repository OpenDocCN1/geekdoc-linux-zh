    \n+   - Find attacks on armitage\n- Launch the netapi attack\n- Show sessions\
    \ -- shows the meterpreter sessions to the device\n- hashdump -- This command\
    \ will show all the hashes available on the victim (windows machine)\n- On Password\
    \ attacks -> Offline attacks -> select Ophcrack-GUI\n- Select the Load and add\
    \ the single hash in there\n- Under tables select the rainbow table that you want\
