    # Using Burp Proxy


    The Proxy tool lies at the heart of Burp''s user-driven workflow, and gives you
    a direct view into how your target application works "under the hood". It operates
    as a web proxy server, and sits as a man-in-the-middle between your browser and
    destination web servers. This lets you intercept, inspect and modify the raw traffic
    passing in both directions.


    If the application employs HTTPS, Burp breaks the SSL connection between your
    browser and the server, so that even encrypted data can be viewed and modified
    within the Proxy.


    # Getting Set Up


    Setting up Burp and your browser to work with each other involves the following
    elements.:


    +   Proxy listener - Burp uses Proxy listeners to accept requests from your browser.
    The default Burp listener, on port 8080 of your IPv4 loopback interface, is normally
    sufficient for general-purpose testing. Burp will show an alert on startup if
    it is not able to open this port (usually because another application is using
    it). You can modify the default listener and add new ones via the Proxy listener
    options.


    +   Browser proxy configuration - You need to configure your browser to use the
    Burp Proxy listener as its proxy server, for both HTTP and'
  merge: -1
  pgno: 103
- img_proc: true
  md: 'HTTPS protocols.


    +   - Burp CA certificate - Since Burp breaks SSL connections between your browser
    and servers, your browser will by default show a warning message if you visit
    an HTTPS site via Burp Proxy. This is because the browser does not recognize Burp''s
    SSL certificate, and infers that your traffic may be intercepted by a third-party
    attacker. To use Burp effectively with SSL connections, you really need to install
    Burp''s Certificate Authority master certificate in your browser, so that it trusts
    the certificates generated by Burp.


    When you have things set up, visit any URL in your browser, and go to the Intercept
    tab in Burp Proxy. If everything is working, you should see an HTTP request displayed
    for you to view and modify. You should also see entries appearing in the Proxy
    history tab. You will need to forward HTTP messages as they appear in the Intercept
    tab, in order to continue browsing.


    # Intercepting Requests and Responses


    The Intercept tab displays individual HTTP requests and responses that have been
    intercepted by Burp Proxy for review and modification. This feature is a key part
    of Burp''s user-driven workflow:


    +   - Manually reviewing intercepted messages is often key to understanding the
    application''s attack surface in detail.

    - Modifying request parameters allows you to quickly identify common security
    vulnerabilities.


    Intercepted requests and responses are displayed in an HTTP message editor, which
    contains numerous features designed to help you quickly analyse and manipulate
    the messages.


    By default, Burp Proxy intercepts only requests messages, and does not intercept
    requests for URLs with common file extensions that are not directly interesting
    when testing (images, CSS, and static JavaScript). You can change this behaviour
    in the interception options. For example, you can configure Burp to only intercept
