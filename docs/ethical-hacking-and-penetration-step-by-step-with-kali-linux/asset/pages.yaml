    \ can see my scan name is windows7 , the target is 192.168.0.101 and the comment\
    \ is new_scan , so the command is:\n  * openvas_target_create “windows7” 192.168.0.101\
    \ “new_scan\"\n* After creating the target, we want to see the OpenVAS’s scan\
