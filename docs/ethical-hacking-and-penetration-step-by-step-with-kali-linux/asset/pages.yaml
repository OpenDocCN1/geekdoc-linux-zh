  md: '# CDP Flooding attack (DoS)


    ![](img/c6b688dca6570d17db3036b560ef0905_70_0.png)


    The Cisco Discovery Protocol (CDP) is a proprietary Data Link Layer protocol developed
    by Cisco Systems. It is used to share information about other directly connected
    Cisco equipment, such as the operating system version and IP address.


    On this type of attack we can send lots of CDP packets to neighbour network devices
    and interrupt their operations.


    Yersinia will be used for this type of attack. To test this:


    +   - First clear CDP counters and tables on your switch and show CDP traffic
    and neighbours - This is just to see the changes on the network devices, it is
    optional

    - Run yesinia -G

    - Launch attack and select CDP

    - Selecting "Flooding CDP table" will send tones of CDP packets to the switch

    - Now check the CDP traffic and neighbour table on the switch'
