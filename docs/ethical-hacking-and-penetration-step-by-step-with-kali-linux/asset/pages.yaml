  md: "# Rogue Access Point\n\n![](img/c6b688dca6570d17db3036b560ef0905_58_0.png)\n\
    \nOne of the common ways of wireless attacks is to set up a fake access points\
    \ and get others to authenticate on it. This can be done in Companies, airports,\
    \ coffee shops, etc.\n\nAs an example, imagine you are in an airport trying to\
    \ connect to a free WIFI and you see an Access Point called Free-Airport. This\
    \ could be the attacker and not actually the airport service.\n\n+   - To set\
    \ up a Rogue access point follow the below steps:\n- Install and configure a DHCP\
    \ server:\n  - apt-get install dhcp3-server -y\n  - mv /etc/dhcp3/dhcppd.conf\
    \ /etc/dhcp3/dhcppd.conf.backup\n  - nano /etc/dhcp3/dhcppd.conf\n    - ddns-update-style\
    \ ad-hoc;\n    - default-lease-time 600;\n    - max-lease-time 7200;\n    - subnet\
    \ 192.168.2.0 netmask 255.255.255.0 {\n    - option subnet-mask 255.255.255.0;"
  merge: -1
