  md: '# Using an attacked host as a “Pivot point” for further attacks


    ![](img/c6b688dca6570d17db3036b560ef0905_83_0.png)


    One of the important steps of a penetration work is to remove all the traces and
    evidences so you can''t be tracked. One of the things which can be done is to
    use a victim''s machine to initiate attacks to other hosts, so you won''t be any
    track of your IP address.


    The other use of “Pivot point” attack is when there is no access to a network
    that you need to penetrate. For example, if there is host which has multiple connections
    to different networks and only one of those networks is accessible by Kali machine.
    To be able to attack other networks, that host can be used as a Pivot point.


    Below we will show you how to use Armitage to do a Pivot point attack. In this
    example, Kali and the victim machine are on the network A as normal clients. However,
    the victim has got another connectivity to network B as well. The aim is to use
    the victim machine to attack network B.


    +   - client eth0 -- Get an IP address from DHCP server on Kali, assuming Kali
    is on a DHCP enabled network

    - Launch armitage

    - You can clear the old Hosts and jobs by going to Hosts and View menu

    - Quick scan with OS detection

    - Make sure you remove the Hosts that you don''t want to attack, including your
    own, from the list.

    - Go to Attacks menu and select “find attacks"

    - You can attack the victim just like previous step with shell access (netapi)
    if you like'
