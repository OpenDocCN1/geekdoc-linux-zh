  md: "# Wireshark protocol analyser\n\n![](img/c6b688dca6570d17db3036b560ef0905_137_0.png)\n\
    \nWireshark is a free and open-source packet analyser. It is used for network\
    \ troubleshooting, analysis, software and communications protocol development,\
    \ and education.\n\nNote: We won't be covering the basics of using Wireshark in\
    \ this book as it is a prerequisite for being an Ethical hacker. There are lots\
    \ of training materials and online videos which can be used to get familiar with\
    \ Wireshark.\n\n+   - You can use Wireshark to capture the traffic in different\
    \ ways\n  * MITM attack\n  * Port mirroring on switch\n  * Normal packet capture\
    \ on the network via its interface\n\nWe explain some of the interesting features\
    \ of the Wireshark which are not commonly used.\n\n+   - You can change the colours\
    \ of packets to suit your requirements\n- You can change Flags or anything inside\
    \ the packet on the column on the main windows to show all the time by right click\
    \ on it and “As as Column\"\n- Statistics menu and Summary will give you a summary\
    \ of the file\n- Statistics menu and protocol hierarchy will show how much each\
    \ protocol used\n- Statistics menu and conversation to check the connections and\
    \ you can filter the traffic in there too"
  merge: -1
  pgno: 137
- img_proc: true
  md: '+   - Statistics menu and endpoint will show the top talkers and how much traffic
    each host is generating

    - Statistics menu and packet length will show create the packet lengths

    - Statistics menu and IO graphs, you can use this to create a graph for specific
    traffic based on the filters

    - Statistics menu and http you can view all the http requests and their details

    - Statistics menu and Flow Graph will show you a Graph about the conversations
    on the captured traffic

    - If you don''t have graphical interface you can use tshark command'
  merge: -1
