  md: '# Metasploit Framework


    ![](img/c6b688dca6570d17db3036b560ef0905_78_0.png)


    The Metasploit Project is an open source project that provides a public resource
    for researching security vulnerabilities and developing code that allows a network
    administrator to break into his own network to identify security risks and document
    which vulnerabilities need to be addressed first.


    The Metasploit Project offers penetration (pen) testing software and provides
    tools for automating the comparison of a program''s vulnerability and its repaired
    (patched) version. Anti-forensic and advanced evasion tools are also offered,
    some of them built into the Metasploit Framework.


    The basic steps for exploiting a system using the Framework include:


    +   1. Choosing and configuring an exploit (code that enters a target system by
    taking advantage of one of its bugs; about 900 different exploits for Windows,
    Unix/Linux and Mac OS systems are included)

    * Optionally checking whether the intended target system is susceptible to the
    chosen exploit

    * Choosing and configuring a payload (code that will be executed on the target
    system upon successful entry; for instance, a remote shell or a VNC server)

    * Choosing the encoding technique so that the intrusion-prevention system (IPS)
    ignores the encoded payload'
  merge: -1
