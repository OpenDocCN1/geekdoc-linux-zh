  md: 'HTTP messages are automatically forwarded without requiring user intervention.
    You can do this using the master interception toggle, in the Intercept tab.


    # Using the Proxy History


    Burp maintains a full history of all requests and responses that have passed through
    the Proxy. This enables you to review the browser-server conversation to understand
    how the application functions, or carry out key testing tasks. Sometimes you may
    want to completely disable interception in the Intercept tab, and freely browse
    a part of the application''s functionality, before carefully reviewing the resulting
    requests and responses in the Proxy history.


    Burp provides the following functions to help you analyse the Proxy history:


    +   - The history table can be sorted by clicking on any column header (clicking
