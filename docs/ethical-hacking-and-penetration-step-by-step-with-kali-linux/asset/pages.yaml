  md: "# HPing 3\n\n![](img/c6b688dca6570d17db3036b560ef0905_117_0.png)\n\nHping is\
    \ a command-line oriented TCP/IP packet assembler/analyser. The interface is inspired\
    \ by the ping UNIX command, but hping isn't only able to send ICMP requests. It\
    \ supports TCP, UDP, ICMP and RAW-IP protocols, has a traceroute mode, the ability\
    \ to send files between a covered channel, and many other features.\n\n+   * Some\
    \ of the functions of Hping are not limited to\n  * Port Scanning - Syn, ack,\
    \ IP and others\n  * Host discovery, fingerprinting, sniffer, flooding, file transfer\n\
    * Use “man hping3” to get more information\n* Some examples of using hping:\n\
    * hping3 -S man-dest=example.com -p 80 -c 2 -- TCP syn request port 80 and 2 times\
    \ only\n* hping3 -S 192.168.1.38 -p +50 -c 5 -- 5 requests to port 50 for 54 (It\
    \ shows source port 50-54 on the output which is the response back from the destination)\n\
    * hping3 -1 192.168.1.1 -xrand-dest -Ieth0 -- -1 means icmp, rand-dest will do\
    \ the ping randomly, -1 will specify the interface\n* hping3 -1 192.168.1.1 -icmp-ts\
    \ -c 2 -- icmp request for timestamp\n* hping3 -1 192.168.1.1 -icmp-addr -c 2\
    \ -- Asking for Subnet Mask\n* hping3 -8 50-56 -S 8.8.8.8 --8 means scan, ports\
    \ 50-56\n* hping3 -2 192.168.1.6 -p 80 -c 1 --2 means UDP\n* hping3 -F -P -U 192.168.1.38\
    \ -c 3 -- F means modify the FIN flag, P is PUSH and U is URGENT\n* hping3 192.168.1.38\
    \ -Q -p 139 -s --Q shows the sequence numbers"
