  md: '+   - This is a type of attack on company’s valuable database assets - personal
    data, financial data, etc.

    - Relies on poor data validation and statement checking in application interface
    with databases, usually MSSQL

    - Utilizes the ability to modify or append SQL statements that are sent to the
    database

    - Can often circumvent authentication or restrictions placed on applications

    - Most commonly affects web servers with back end SQL ansi92 enabled databases

    - Only data validation checks and query restrictions can prevent SQL Injection

    - Some database configuration can help, but application is the weak point


    +   - Rootkits


    +   - Rootkits are malicious programs that replace OS executables

    - They are used to maintain and hide illicit access

    - Usually require root access to install

    - Linux rootkits are plentiful on Internet

    - Few detection methods available

    - MD5sum of files based on baseline is one way, but logistically difficult to
    manage due to legitimate frequent changes on systems

    - Very difficult to eliminate rootkits

    - Best way is to rebuild the box with known good software

    - Disadvantage is rebuilding the box eliminates evidence of rootkit that may be
    needed in investigation/prosecution


    +   - Spoofing


    +   - This is the technique used to hide identity of traffic originator or assume
    identity of trusted entity

    - IP addresses, MAC addresses, emails are routinely spoofed

    - Prevent attackers from being easily traced

    - Usually relies on weaknesses of TCP/IP itself or applications

    - Some mechanisms in place can prevent spoofing (blocking internal address space
    from entering firewall through external interface, for example)

    - Spoofing methods and tools depend on platform and architecture'
