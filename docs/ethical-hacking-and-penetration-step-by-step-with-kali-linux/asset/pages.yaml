  md: "# Types of attacks\n\nThere are number of different attacks that can be done\
    \ on a network or system. The main categories are explained below:\n\n+   * Full\
    \ penetration\n  * Taking full control of the system and accessing the resources\
    \ and data. This is a very complex and difficult task and requires spending a\
    \ long time investigating the vulnerabilities and ways to access a system.\n\n\
    +   * Denial of Service\n  * Interrupting the system’s operation and affecting\
    \ the users. This is usually an easier type of attack which can be achieved with\
    \ spending less time and effort, however; can be a big problem in big organizations.\n\
    \n+   * Specific Information\n  * Theft or disclosure of the documents or information.\
    \ This could be accessing documents or penetrating a database but usually attacker\
    \ is looking for some specific information and not interested in damaging any\
    \ system.\n\n+   * Social Engineering\n  * The art of manipulating people so they\
    \ give up confidential information. This is perhaps the easiest way of attacking\
    \ and won’t require any technical knowledge. Attacker will usually use the users,\
    \ administrators or employees to get the information out of them and use those\
    \ information to penetrate the systems."
  merge: -1
  pgno: 18
- img_proc: true
  md: "# Hacking Methodology Overview\n\nThere are number of steps that need to be\
    \ followed to plan and implement penetration project. We will explain each one\
    \ in detail later in this book, however; summary of steps can be found below.\n\
    \n+   Formal Methodology\n  - A good methodology provides structured framework\
    \ for testing and procedure. Below are some notes which can be useful to implement\
    \ your methodology.\n    - Ensures you do not overlook venues of attack and possible\
    \ vulnerabilities\n    - Provides a comprehensive testing plan. You can use the\
    \ below standards:\n      - OSSTMM - Open Source Security Testing Methodology\
    \ Manual\n        - A widely used, peer-reviewed, methodology for performing security\
    \ tests\n      - NIST SP 800-42\n        - Technical Guide to Information Security\
    \ Testing and Assessment\n      - TRAWG\n        - TRAWG stands for Threat and\
    \ Risk Assessment Working Guide\n      - OCTAVE\n        - Operationally Critical\
    \ Threat, Asset, and Vulnerability Evaluation\n\n+   Reconnaissance\n  - This\
    \ is the first step in penetration testing. The point is to gather as much as\
    \ information about the Target Company, network, infrastructure or personnel as\
    \ possible. There are two different types of gathering information; active (calling,\
    \ talking, visiting, etc.) and passive (finding information"
  merge: -1
  pgno: 19
- img_proc: true
  md: "on websites, jobs advertisement, etc.)\n\n+   * Scanning\n  On this step networks\
    \ are scanned to determine which hosts are live on network and what they do. There\
    \ are multiple types of scans and tools available. Most popular ones are Nmap\
    \ and Supercan.\nThe scans can easily be picked up by Intrusion Detection Systems,\
    \ although; there are ways to avoid this with specific scans.\n\n+   * Service\
    \ Enumeration (Fingerprinting)\n  This step follows the scanning step after determining\
    \ which hosts are live. Tools will be used to discover what hosts are running\
    \ to determine vulnerabilities. Fingerprinting tools are often combined with scanners\
    \ and we can get both reports at once.\n\n+   * Vulnerability Assessment\n  This\
    \ step will be used to determine what vulnerabilities exist with an app or a service\
    \ on a tool. In this step known vulnerability databases and compare the responses\
    \ from the target device with the database to find a match. The Targets are all\
    \ popular Operating Systems and applications.\nessus is the most popular assessment\
    \ tool in this category which is an open source with a freeedition.\n\n+   * Vulnerability\
    \ Exploitation\n  At this stage vulnerabilities discovered in previous steps are\
    \ exploited with known exploits or by developing new ones. Vulnerabilities are\
    \ exploited to penetrate and gain access to systems.\n\n+   * Penetration and\
    \ Access\n  This is the stage where hacking actually occurs. All previous stages\
    \ are planning only and we will try to take control of the target at this step.\
    \ Systems are penetrated based upon exploited vulnerabilities identified in previous\
    \ steps."
  merge: -1
  pgno: 20
- img_proc: true
  md: 'Access to systems at various levels is attempted and tested. Metasploit framework
    is a popular tool in this category which will be explained later in this book.


    +   Privilege Escalation and Owning the Box

    The Goal at this stage is administrative access or access privilege information.
    Hacker may start as guest level of access or normal user and uses exploits to
    increase the privilege levels. Remember Owning the box = Full Control


    +   Evading Defences and Erasing Tracks

    Hackers must evade defences like IDS, FW, IPS to penetrate and access the systems.
    They must avoid detection or penetration will be short-lived. Remember, most of
    the medium and large size organizations have detection mechanisms in place. Erasing
    tracks, deleting log files, resetting permissions, hiding hacker tools on system
    with rootkits are some of the common steps in this category.


    +   Maintaining and Expanding Access

    Once penetration is complete, access must be maintained and expanded. Rootkits
    often used to keep access, hide the running processes and tools, along with backdoor
    accounts. Access can be expanded to increase target and further penetration into
    network.'
  merge: -1
  pgno: 21
- img_proc: true
  md: "# Step 1 - Reconnaissance\n\n+   * Passive Reconnaissance\n  * This step is\
    \ used to gather information about a company, network, or other target with using\
    \ any intrusive means\n  * It is very difficult to detect/defend against the target\
    \ company\n  * Most of these information are publicly available on web, newspapers,\
    \ advertisements, brochures, etc.\n  * You can use resources like company websites,\
    \ Exchange commission, better business bureau, literature, job site posting (e.g.\
    \ if Nortel skills will require you know they have Nortel equipment), partner\
    \ sites, etc.\n  * Information can include name of company officers, addresses\
    \ of major locations (data centres), partner network and connections, types of\
    \ systems used (FW, IDS, etc.), IP address space, domain names, etc.\n  * Gathering\
    \ Information with Whois and other Tools\n    * Name of administrators, IP address\
    \ space, location, Email addresses, phone number, etc.\n  * Other tools include\
    \ Sam Spade and web based tools are also available\n  * One popular tool is Maltego\
    \ on Kali Linux which will be explained later in this book\n\n+   * Active Reconnaissance\n\
    \  * At this stage hacker uses more intrusive methods to gather information and\
    \ actively touches target sites and networks as a normal user\n  * It does not\
    \ involve a hacking system\n  * May involve personal contact or site visits\n\
    \  * Some Tools and Methods:\n    * Banner Grabbing - Telnet/SSH to devices and\
    \ read the banner to identify what it is\n    * Mail Bouncing - Send an email\
    \ to wrong email address to check the bounce message and identify the mail servers"
  merge: -1
  pgno: 22
