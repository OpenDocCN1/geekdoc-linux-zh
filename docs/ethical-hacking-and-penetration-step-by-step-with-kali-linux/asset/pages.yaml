  md: '# IPv6 Tools from THC (The Hackers Choice)


    ![](img/c6b688dca6570d17db3036b560ef0905_126_0.png)


    Many toolkits exist that allow you to exploit weaknesses in software and protocol
    vulnerabilities. A toolkit can be thought of as a collection of programs that
    allows an individual to test or break into a system.


    One toolkit in particular maintained by Van Hauser of The Hacker’s Choice, called
    THC-IPv6 allows you to “attack” weaknesses in the IPv6 and ICMP6 protocols.


    Its primary purpose is to test network devices with active IPv6 interfaces. With
    over 50 separate tools the toolkit allows you to perform such tasks like detect
    IPv6 hosts, impersonate IPv6 routers and initiate denial of service attacks.


    With experimentation and time you can practice on your own to cater the tool suite
    to suit your needs. Members of The Hacker’s Choice and users of'
