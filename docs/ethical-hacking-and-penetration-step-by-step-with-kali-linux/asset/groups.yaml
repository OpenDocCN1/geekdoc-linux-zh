    # Introduction


    This book is a complete guide for those who would like to become an Ethical hacker.
    In this book you will learn what Ethical hacking and its procedure is. The first
    couple of chapters are the definitions, concepts and process of becoming Ethical
    hacker while the next half of the book will show in detail how to use certain
    tools and penetrate a system.


    After reading this book, you should be able to use these tools to do some testing
    and even working on penetration projects. You just need to remember


    On each section, we have provided the commands used to achieve the penetration
    goal. You need to follow the commands and change the parameters or names to suit
    your environment.


    # About the Author


    Rassoul Ghaznavi-zadeh, the author, has been an IT security engineer since 1999.
    He started as a Cisco engineer and developed his networking and security knowledge
    around technologies like Cisco, Checkpoint, Juniper and also processes like ISO
    27001, PCI.


    He also has some extensive background around Linux systems and services and tools
    available on them. Rassoul has helped a lot of enterprise organizations to have
    a safe and secure environment by testing, auditing and providing recommendations.


    Rassoul has multiple international certificates around networking, security and
    architecting enterprise IT.


    # A note from the Author


    After working in this industry for a long time, I have decided to write a book
    and share my knowledge and experience with others. I hope you find this book useful
    and if I can help my bit to keep the technology industry be safer and more secure.
    I tried to avoid having long paragraphs and structure this book like a presentation
    so you won''t get bored.


    For those who buy this book, I am available on Linkedin for any follow up. Add
    me to your network and ask any question you might have and I am more than happy
    to assist.


    I''d like to present this book to my wife and daughter who have always been with
    me and helped sparing some time to write this book.

