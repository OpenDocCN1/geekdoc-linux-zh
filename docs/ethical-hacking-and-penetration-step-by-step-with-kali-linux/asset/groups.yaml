- md: "\n- Access control issues - Burp contains several features that can help when\
    \ testing for access control vulnerabilities:\n\n  - You can use the Compare site\
    \ maps function for various tasks, including: identifying functionality that is\
    \ visible to one user and not another; testing whether a low privileged user can\
    \ access functions that should be restricted to higher privileged users; and discovering\
    \ where user-specific identifiers are being used to segregate access to data by\
    \ two users of the same type.\n\n  - You can use different browsers to access\
    \ the application in different user contexts, and use a separate Burp Proxy listener\
    \ for each browser (using different ports). You can then open additional Proxy\
    \ history windows (via the context menu) and set the display filter on each window\
    \ to show only items received on a specific listener port. As you use the application\
    \ in each browser, each window will show only the items for the associated user\
    \ context. You can then use the \"Request in browser in current browser session\"\
    \ function (via the context menu) to switch between browsers, to determine how\
    \ they are handled in browser's user context.\n\n  - Many privilege escalation\
    \ vulnerabilities arise when the application passes an identifier in a request\
    \ parameter, and uses to identify the current user context. You can actively exploit\
    \ this type of vulnerability by using Burp Intruder to cycle through identifiers\
    \ in the appropriate format (e.g. using the numbers or custom iterator payloads\
    \ types) and extracting grep items to retrieve interesting user-specific data\
    \ from the application's responses.\n\n- Other vulnerabilities - Burp contains\
    \ functions that can be used to deliver, and often automate, virtually any task\
    \ that arises when probing for other types of vulnerabilities. For example:\n\n\
    \  - You can review the contents of the Target site map for information leakage\
    \ issues, using the Search and Find functions to assist you.\n\n  - Having identified\
    \ a possible CSRF vulnerability, you can use the CSRF generator to quickly create\
    \ a proof-of-concept attack in HTML, then use the \"Test in browser\" function\
    \ to load the attack into your browser, and then review the browser results and\
    \ Proxy history to verify whether the attack was successful.\n\n- You can use\
    \ Burp Sequencer to analyse a sample of session tokens from the application, and\
    \ estimate the quality of their randomness.\n- For some types of encrypted session\
    \ tokens or other parameters, you can use the bit flipper and ECB block shuffler\
    \ payload types in Burp Intruder to blindly modify the encrypted data in an attempt\
    \ to meaningfully change the decrypted data that the application processes.\n\
    - You can write your own custom Burp extensions to carry out more specialized\
    \ or customized tasks.\n\n# Kali Linux on Raspberry Pi\n\n![](img/c6b688dca6570d17db3036b560ef0905_113_0.png)\n\
    \nOne of the interesting features of Kali Linux is that there is a version to\
    \ be installed on Raspberry Pi. The Raspberry Pi is a small pocket computer in\
    \ a credit-card sized factor that plugs into your TV and a keyboard and it has\
    \ all interfaces of a PC including SD, USB, Ethernet connectivity and even WIFI.\
    \ \n\nYou can download the Kali customized version image for Raspberry Pi from\
    \ cimageage.org. Once you download Kali image for ARM Raspberry Pi, installation\
    \ can start. You need an SD card to write the image on. This can be done on Windows\
    \ or Linux.\n\n- On Windows:\n  - Download Win32 Disk Image application and write\
    \ the ISO file on the SD card\n- On Linux:\n  - You can achieve this with the\
    \ below command (Need to find the device name)\n    dd if=/path/to/Kali.iso of=/dev/sdx\n\
    - Once started to use Kali you can enable SSH and manage the device from your\
    \ desk\n  - Using Xming you can have the GUI applications on your desktop with\
    \ using putty as well.\n\n# Scapy - Packet Manipulation Tool - Capture, create,\
    \ play, reply, discover\n\n| Eth | IP | TCP | Payload |\n|---|---|---|---|\n|\
    \ 14 | 20 | 20 | |\n\n-- TCP MSS Ethernet MTU\n\nScapy is a powerful interactive\
    \ packet manipulation tool, packet generator, network scanner, network discovery\
    \ tool, and packet sniffer. Note that Scapy is a very low-level tool—you interact\
    \ with it using the Python programming language. It provides classes to interactively\
    \ create packets or sets of packets, manipulate them, send them over the wire,\
    \ sniff other packets from the wire, and match answers and replies.\n\n- Run it\
    \ with scapy command -- You can change on the packets/frames parameters and sections\
    \ and send them with this tool\n- Example:\n  `send(IP(src=\"192.168.1.55\",dst=\"\
    192.168.1.10\")/ICMP())/\"OurPayload\"`\n- On the above example an ICMP packet\
    \ will be sent from src to dst with the payload that we specify.\n- Using Scapy\
    \ we need to define some variables:\n  - L2=Ether()\n  - L3=IP()\n  - L4=TCP()\n\
    - Using L2, L3 or L4 with any parameter will show the defined variable on the\
    \ output screen\n  - L2.show() or L3.show() or L4.show() -- Shows what is inside\
    \ that protocol which can be defined\n- Below is an example of how you can use\
    \ scapy:\n  - L2=Ether(src=\"01:23:45:67:89:ab\") --This will define the ipv6\
    \ source address on L2\n  - L2.show() -- Use this to confirm the change is done\n\
    \  - L3=IP(ttl=99, dst=\"192.168.1.1\")\n  - L3.show()\n  - del(L3.dst) -- This\
    \ will delete the dst defined on L3 if you need to change or delete\n  - L4=TCP(sport=6783,\
    \ dport=22, flags=\"A\")\n  - L4.show()\n  - Send=sendp(L2/L3/L4) - This will\
    \ send the L2, L3, L4 packets all together.\n- Here are some other cases you use\
    \ scapy:\n  - Sniff(iface=\"eth0\",prn=lambda x: x.show()) -- Sniff on eth0 and\
    \ show the output\n  - Sniff(iface=\"eth0\",prn=lambda x: x.summary()) -- Same\
    \ as above but just shows summary of packets\n  - Sniff(filter=\"host 192.168.1.1\"\
    , count=5) -- Sniff only 5 results if it includes 192.168.1.1\n  - a[?] -- This\
    \ will show the details of the packet captured on the above filtered command where\
    \ \"?\" is the number of packet that you would like its details\n  - To get out\
    \ of Scapy use Ctrl+D\n\n# HPing 3\n\n![](img/c6b688dca6570d17db3036b560ef0905_117_0.png)\n\
    \nHping is a command-line oriented TCP/IP packet assembler/analyser. The interface\
    \ is inspired by the ping UNIX command, but hping isn't only able to send ICMP\
    \ requests. It supports TCP, UDP, ICMP and RAW-IP protocols, has a traceroute\
    \ mode, the ability to send files between a covered channel, and many other features.\n\
    \n- Some of the functions of Hping are not limited to\n  - Port Scanning - Syn,\
    \ ack, IP and others\n  - Host discovery, fingerprinting, sniffer, flooding, file\
    \ transfer\n- Use “man hping3” to get more information\n- Some examples of using\
    \ hping:\n  - hping3 -S man-dest=example.com -p 80 -c 2 -- TCP syn\n  - hping3\
    \ -S man-dest=example.com -p 80 -c 2 -- TCP syn request port 80 and 2 times\n\
    \  - hping3 -S 192.168.1.38 -p 50 -c 5 -- This shows port 50 for 54\n  - hping3\
    \ -1 192.168.1.1 -xrand-dest -Ieth0 -- -1 means icmp, rand-dest will do the ping\
    \ randomly, -1 will specify the interface\n  - hping3 -S www.example.com -p 80\
    \ -T -ttl 13 -tr-keep-ttl -n -- We will get response only from hub #13 of reaching\
    \ the destination. This can help to find out if there is a Load balancer and we\
    \ get different IP addresses\n  - hping3 -S 192.168.1.38 -a192.168.1.254 -p 22\
    \ -flood -S is syn flag, -a is the source address, --flood will send the packets\
    \ as fast as possible and flood the destination\n  - hping3 -2 www.example.com\
    \ -p 44444 -T -n --T means traceroute but -2 is UDP\n  - hping3 -S www.example.com\
    \ -p 53 -- Similar to traceroute with TCP. Press Ctrl+Z to stop\n  - hping3 -F\
    \ -P -U 192.168.1.38 -c 3 -- F means modify the FIN flag, P is PUSH and U is URG\n\
    \  - hping3 192.168.1.38 -Q -p 139 -s --Q shows the sequence numbers\n- hping3\
    \ -- Will go to the command prompt for hping\n  - hping3> hping send\n    “ip(saddr=192.168.1.55,daddr=192.168.1.38,ttl=15)+tcp(sport=6783,dportport=80,flags=s)”\
    \ --- This will send a custom packet to the network\n"
  mdcn: "\n\n- 访问控制问题 - Burp 包含若干可以在测试访问控制漏洞时提供帮助的功能：\n\n  - 你可以使用“比较站点地图”（Compare\
    \ site maps）功能来执行各种任务，包括：识别某个用户可见而另一个用户不可见的功能；测试低权限用户是否可以访问应限制为高权限用户的功能；以及发现何处使用了用户特定的标识符来隔离同一类型两个用户对数据的访问权限。\n\
    \n  - 你可以使用不同的浏览器在不同的用户上下文中访问应用程序，并为每个浏览器使用独立的 Burp Proxy 监听器（使用不同的端口）。然后你可以打开额外的代理历史（Proxy\
    \ history）窗口（通过上下文菜单），并为每个窗口设置显示过滤器，以仅显示在特定监听端口上接收的项目。当你在每个浏览器中使用应用程序时，每个窗口将只显示与关联用户上下文相关的项目。然后你可以使用“在当前浏览器会话中请求”（Request\
    \ in browser in current browser session）功能（通过上下文菜单）在浏览器之间切换，以确定它们在浏览器用户上下文中是如何处理的。\n\
    \n  - 当应用程序在请求参数中传递标识符并用其识别当前用户上下文时，会产生许多权限提升漏洞。你可以使用 Burp Intruder 循环遍历格式正确的标识符（例如使用数字或自定义迭代器负载类型），并提取\
    \ grep 项目，以从应用程序的响应中获取感兴趣的特定用户数据，从而主动利用此类漏洞。\n\n- 其他漏洞 - Burp 包含可用于交付且通常能自动化探测其他类型漏洞时出现的几乎任何任务的功能。例如：\n\
    \n  - 你可以查看目标站点地图（Target site map）的内容以发现信息泄露问题，并使用“搜索”（Search）和“查找”（Find）功能来协助你。\n\
    \n  - 在识别出可能的 CSRF 漏洞后，你可以使用 CSRF 生成器（CSRF generator）快速在 HTML 中创建概念证明攻击代码，然后使用“在浏览器中测试”（Test\
    \ in browser）功能将攻击加载到浏览器中，然后查看浏览器结果和代理历史以验证攻击是否成功。\n\n- 你可以使用 Burp Sequencer 分析应用程序的会话令牌（session\
    \ tokens）样本，并估计其随机性质量。\n- 对于某些类型的加密会话令牌或其他参数，你可以使用 Burp Intruder 中的 `bit flipper`（位翻转）和\
    \ `ECB block shuffler`（ECB 块洗牌器）负载类型来盲目修改加密数据，尝试性地更改应用程序处理的解密数据。\n- 你可以编写自定义的\
    \ Burp 扩展来执行更专业或定制化的任务。\n\n# 树莓派上的 Kali Linux\n\n![](img/c6b688dca6570d17db3036b560ef0905_113_0.png)\n\
    \nKali Linux 的有趣特性之一是它有一个可以安装在树莓派上的版本。树莓派是一个信用卡大小的小型口袋电脑，可以插入你的电视机和键盘，它拥有 PC 的所有接口，包括\
    \ SD、USB、以太网连接甚至 WIFI。\n\n你可以从 cimageage.org 下载适用于树莓派的 Kali 定制镜像。一旦下载了适用于 ARM\
    \ Raspberry Pi 的 Kali 镜像即可开始安装。你需要一张 SD 卡来写入镜像。这可以在 Windows 或 Linux 上完成。\n\n-\
    \ 在 Windows 上：\n  - 下载 Win32 Disk Image 并将 ISO 文件写入 SD 卡。\n- 在 Linux 上：\n  - 你可以使用以下命令实现此操作（需要找到设备名称）\n\
    \    `dd if=/path/to/Kali.iso of=/dev/sdx`\n- 一旦开始使用 Kali，你就可以启用 SSH 并从桌面上管理该设备\n\
    \  - 使用 Xming，你也可以配合 putty 在桌面上运行 GUI 。\n\n# Scapy - 数据包处理工具 - 捕获、创建、播放、响应、发现\n\
    \n| Eth | IP | TCP | Payload |\n|---|---|---|---|\n| 14 | 20 | 20 | |\n\n-- TCP\
    \ MSS Ethernet MTU\n\nScapy 是一个强大的交互式数据包处理工具、包生成器、网络扫描仪、网络发现工具和包嗅探器。注意 Scapy 是一个非常底层的工具——你使用\
    \ Python 编程语言与之交互。它提供了类来交互式地创建单个或一组包、操纵它们、将它们发送到线路、从线路嗅探其他包，并匹配答案和回复。\n\n- 使用\
    \ `scapy` 命令运行它 —— 你可以更改包/帧的参数和部分，并使用此工具发送它们。\n- 示例：\n  `send(IP(src=\"192.168.1.55\"\
    ,dst=\"192.168.1.10\")/ICMP())/\"OurPayload\"`\n- 在上面的示例中，一个 ICMP 包将从 src 发送到\
    \ dst，并带有我们指定的负载。\n- 使用 Scapy，我们需要定义一些变量：\n  - L2=Ether()\n  - L3=IP()\n  - L4=TCP()\n\
    - 使用 L2、L3 或 L4 配合任何参数都将在输出屏幕上显示定义的变量\n  - L2.show() 或 L3.show() 或 L4.show() --\
    \ 显示该协议内部包含的、可以定义的内容\n- 下面是如何使用 scapy 的示例：\n  - L2=Ether(src=\"01:23:45:67:89:ab\"\
    ) -- 这将定义 L2 上的 ipv6 源地址\n  - L2.show() -- 使用此项确认更改已完成\n  - L3=IP(ttl=99, dst=\"\
    192.168.1.1\")\n  - L3.show()\n  - del(L3.dst) -- 如果你需要更改或删除 dst，这将删除 L3 上定义的\
    \ dst\n  - L4=TCP(sport=6783, dport=22, flags=\"A\")\n  - L4.show()\n  - Send=sendp(L2/L3/L4)\
    \ - 这将一次性发送 L2、L3、L4 包。\n- 这里是你使用 scapy 的其他情况：\n  - Sniff(iface=\"eth0\",prn=lambda\
    \ x: x.show()) -- 在 eth0 上嗅探并显示输出\n  - Sniff(iface=\"eth0\",prn=lambda x: x.summary())\
    \ -- 与上述相同，但仅显示包的摘要\n  - Sniff(filter=\"host 192.168.1.1\", count=5) -- 如果包含 192.168.1.1，则只嗅探\
    \ 5 个结果\n  - a[?] -- 这将显示在上述过滤命令上捕获的包，， \"?\" 是你想要查看详情的包数量\n  - 退出 Scapy 请使用 Ctrl+D\n\
    \n# HPing 3\n\n![](img/c6b688dca6570d17db3036b560ef0905_117_0.png)\n\nHping 是一个面向命令行\
    \ TCP/IP 包组装器/分析器。其灵感源于 ping 命令，但 hping 不仅限于发送 ICMP 请求。它支持 TCP、UDP、ICMP 和 RAW\
    \ 协议，具有路由跟踪模式、发送文件的能力以及许多其他功能。\n\n- Hping 的某些功能不限于\n  - 端口扫描 - Syn, ack 以及其他\n\
    \  - 主机发现、指纹识别、嗅探、泛洪、文件传输\n- 使用“man hping3”获取更多信息\n- 使用 hping 的示例：\n  - hping3\
    \ -S man-dest=example.com -p 80 -c 2 -- TCP syn\n  - hping3 -S man-dest=example.com\
    \ -p 80 -c 2 -- TCP 请求端口 80，2 次\n  - hping3 -S 192.168.1.38 -p 50 -c 5 -- 这显示端口\
    \ 50，共5 次\n  - hping3 -1 192.168.1.1 -xrand-dest -Ieth0 -- -1 意味着 icmp，rand-dest\
    \ 将随机 ping，-1 指定接口\n  - hping3 -S www.example.com -p 80 -T -ttl 13 -tr-keep-ttl\
    \ -n -- 我们将从到达目标的第13跳获取响应。这可以帮助发现是否存在负载均衡器并获取不同的 IP 地址\n  - hping3 -S 192.168.1.38\
    \ -a192.168.1.254 -p 22 -flood -S 是 syn 标志，-a 是源地址，--flood 将尽可能快发送包并泛洪目标\n  -\
    \ hping3 -2 www.example.com -p 44444 -T -n -- T 表示路由跟踪但 -2 是 UDP\n  - hping3 -S\
    \ www.example.com -p 53 -- 类似于 TCP 的路由跟踪。按 Ctrl+Z 停止\n  - hping3 -F -P -U 192.168.1.38\
    \ -c 3 -- F 意味着修改 FIN 标志，P 是 PUSH，U 是 URG\n  - hping3 192.168.1.38 -Q -p 139 -s\
    \ -- Q 显示序列号\n- hping3 -- 将进入 hping 的命令行提示符\n  - hping3> hping send\n\n"
