    \n渗透测试的重要步骤之一是清除所有痕迹和证据，这样你就不会被追踪。可以采取的方法是使用受害者机器向其他主机发起攻击，这样就不会留下你 IP 地址的痕迹。\n\
    \n“跳板”攻击的另一个用途是当你无法访问需要渗透的网络时。例如，如果有一个主机连接到多个不同的网络，而只有其中一个网络是 Kali 机器可以访问的。为了攻击其他网络，可以使用该主机作为跳板。\n\
    \n下面我们将向你展示如何使用 Armitage 进行跳板攻击。在本示例中，Kali 和受害者机器像普通客户端一样位于网络 A。然而，受害者还具有另一个连接到网络\
