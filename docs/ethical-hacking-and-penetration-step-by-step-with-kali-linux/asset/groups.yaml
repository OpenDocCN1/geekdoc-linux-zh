    ![](img/c6b688dca6570d17db3036b560ef0905_49_0.png)


    Wireless networks are an extension of your organisation’s infrastructure perimeter
    and should be tested thoroughly. An insecure wireless network opens up your organisation
    to the external world and poses a security risk. Rogue access points, installed
    by employees on the infrastructure, which do not follow the organisation’s security
    guidelines, can also be used to compromise your organisation.


