    # Metasploit Framework (MSF) using Modules, Payloads and exploits


    Now it is time to learn how to use metasploit console. Metasploit has lots of
    modules which can be loaded and used for exploits penetration. You can also do
    all kind of scanning and vulnerability assessment with it which are prerequisites
    before starting the penetration.


    To run Metasploit command line interface, you can simply run the below command:


    +   * msfconsole


    Next step is to create a workspace. Workspaces are used to separate different
    works, scans and attacks. For example, if you are working on multiple projects
    belong to different customers, you can create a different workspace for each customer.
    While you are working on one workspace it won''t affect the others.


    To set up workspaces follow the below steps:


    +   * workspace -- Shows the current workspace

    * dbstatus -- Shows the status of the database

    * workspace -h -- Workspace is used to separate different customer''s databases

    * workspace -a TestLab -- This will create a new workspace TestLab

    * workspace -- Shows the current workspace


    Metasploit framework provides full nmap functionality within the application.
    You can do all kind of nmap scanning on the command line interface and the output
    will be put in a database for the next steps of penetration.


    To use scanning functionality within Metasploit follow the below steps:


    +   * db_nmap -T4 -A 10.0.0.2 -- This will run nmap and put the results in database'
