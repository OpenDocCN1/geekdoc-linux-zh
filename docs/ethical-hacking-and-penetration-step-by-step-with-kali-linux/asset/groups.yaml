  mdcn: "\n\n# 社会工程工具包 (Social Engineering Toolkit)\n\n![](img/c6b688dca6570d17db3036b560ef0905_89_0.png)\n\
    \n社会工程工具包（SET）是一组用于发起社会工程攻击的工具。有许多不同的工具可以用于不同的目的。\n\n- 它是一个菜单驱动的攻击“系统”，包括：\n \
    \   - 鱼叉式钓鱼（电子邮件）\n    - 批量邮件发送器（电子邮件）\n    - 网站（浏览器）\n    - 感染媒体（USB）\n    -\
    \ 可执行文件（程序）\n    - 以及更多\n- 可以 `setoolkit` 命令运行社会工程工具包。\n- 下面的工具是 SET 攻击的一个示例。\n\
    - 运行 `setoolkit` 并选择 \"Website Attack Vectors\"(网站攻击向量）。\n- 选择 \"Metasploit Browser\
    \ Exploit Method\"(Metasploit 浏览器利用方法）。\n- 选择 \"Web Template\"(Web 模板）。\n- 如果你使用\
    \ NAT，你需要提供翻译后的地址，否则提供你的接口 IP 地址\n    - 你需要在防火墙上为你的 Kali 机器创建一个一一 NAT，并确保 Kali\
    \ 可以通过互联网访问，而不是在 NAT 之后。输入你的 Kali 机器 IP 地址\n- 例如 \"Java Required\"（需要 Java）。\n\
    - 选择漏洞利用的类型——例如 \"Metasploit Browser Autopwn (USE AT OWN RISK)\"（风险自自负）。\n- 选择你想执行的操作——例如\
    \ \"Windows Reverse_TCP Meterpreter\"。\n- 选择额外要求——例如端口 443。\n- 完成后按回车键\n- 带有利用程序的\
    \ Web 服务器已创建并准备就绪，可以通过输出的地址访问。\n- 一旦有人连接到 Web 服务器，利用程序就会启动并建立返回到 Kali/Backtrack\
    \ 的连接\n  - 有几种方法可以让人们连接到该网站。例如 DNS 投毒或社会工程学。通过社会工程学，你可以调查受害者的兴趣，并让网站变成他们感兴趣的内容。例如，如果他们对健康产品感兴趣，可以将其作为免费健康产品订单并发送给他们。或者你可以在共享网站上放置链接等。你需要发挥创意！\n\
    - 在提示符处，你可以输入 `sessions` 来检查是否有人连接。\n- 如果你想开始与其中一个会话交互，输入：\n  - `session -i 1`\
    \ —— 这将开始与会话 1 交互\n- 使用 help 命令获取帮助\n- 例如 `clearev` 将删除 Windows 上所有的事件日志！\n- 例如\
    \ `execute -f calc.exe` —— 你可以在受害者机器上运行 calc.exe\n- 例如 `keyscan_start` 是一个按键记录器，你可以通过\
    \ `keyscan_dump` 导出它们。\n\n# Ettercap, Xplico 和 MITM 攻击\n\n目标 主机  Mitm 过滤器 日志 插件\
    \ 帮助\n\n| 目标 1 | 目标 2 |\n| --- | --- |\n| 192.168.1.1 | 192.168.1.2 |\n| 删除 |\
    \ 添加 | 删除 | 添加 |\n\n2183 已服务\n正在随机选择 255 台主机进行扫描...\n正在扫描整个网码的 255 台主机...\n主机列表中已添加\
    \ 0 个主机...\n正在随机选择 255 台主机进行扫描...\n正在扫描整个网码的 255 台主机...\n主机列表中已添加 1 个主机...\n主机\
    \ 192.168.1.1 已添加到目标！\n\n中间人攻击（MITM attack）是网络上最常见的攻击类型之一。通过这种攻击，攻击者可以坐在客户端和服务器之间，捕获所有流量而不被任何人察觉。\n\
    \n在这个示例中，你将学习如何使用 ettercap 和 xplico 软件发起 MITM 攻击，并嗅探从受害者机器发出的所有流量。\n\nEttercap\
    \ 是一个强大的工具，可以执行 ARP 投毒、DHCP 和 DNS 欺骗或 ICMP 重定向等操作。\n\nXplico 是一个带有 Web 界面的优秀工具，用于嗅探和分析流量。\n\
    \n使用 ettercap 启动 MITM 攻击，请遵循以下步骤：\n\n- `ettercap -G` —— 这将运行 ettercap 的 GUI\n\
    - 从 Sniff 菜单选择 Unified sniffing（统一嗅探）并选择 eth0\n- 从 Hosts 菜单选择 \"Scan for hosts\"\
    （扫描主机）\n- 从 Hosts 菜单选择 \"Hosts list\"主机列表）\n- 选择网关地址作为 Target1，将受害者地址作为...\n-\
    \ 进入 MITM 菜单并选择 Arp poisoning（ARP 投毒）\n- 好了，你已经完成了 MITM 攻击\n- 确保 Kali 上启用了 IP\
    \ 转发，以确保受害者可以访问互联网\n\n```\necho 1 >/proc/sys/net/ipv4/ip_forward\n```\n\n- 使用以下命令在\
    \ Kali 上运行 xplico 服务\n  - `service xplico start`\n  - 如果尚未安装，可以使用 `apt-get install\
    \ xplico` 安装\n  - 安装后，使用 `/etc/init.d/xplico start` 或上述命令运行\n- 连接到输出指定的默认端口 9876\
    \  Web \n- 用户名和密码均为 “xplico”\n- 你需要遵循的步骤是在 xplico Web 界面上创建一个新案例（case），然后创建一个新会话（session）\n\
    - 然后你需要选择 “Live acquisition”（实时获取）并开始捕获\n  - 如果愿意，也可以打开保存的捕获文件。例如使用 wireshark\
    \ 嗅探器保存捕获的文件并用 xplico 打开\n- 点击提供的链接，你可以看到所有数据分析\n- 如果你愿意，可以停止实时获取并查看捕获的数据分析\n"
