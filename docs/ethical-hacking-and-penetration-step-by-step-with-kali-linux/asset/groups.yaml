  - '[PAGE 66]


    # DHCP Starvation attack


    ![](img/c6b688dca6570d17db3036b560ef0905_66_0.png)


    On most of the corporate networks there are DHCP servers which serves the IP addresses
    configuration to the clients. DHCP servers include zones with a range of free
    IP addresses and when a client requests and IP address, one IP from that range
    will be allocated to it.


    DHCP Starvation is basically a type of DoS attack in which an attacker sends unlimited
    requests to the DHCP server and asks for IP addresses. This will use all of the
    available IP addresses in DHCP zone and no IP address will be left for other clients
    on the network to use.


    +   * The application to use for DHCP Starvation attack is called Yersinia and
    the command to run it is “yersinia"

    * yersinia -G -- Graphical interface for the application

    * Select DHCP, Launch attack and select “Sending DISCOVER Packet"

    * The above will start asking for multiple IP addresses from the DHCP server until
    it fills up the DHCP pool and DHCP won’t be able to allocate any new IP to any
    other client on the network

    * This is a form of DoS attack and blocks user from accessing anything on the
    network'
