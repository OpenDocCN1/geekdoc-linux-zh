    # 引言


    本书是想要成为道德黑客的人的完整指南。在书中，你将学习什么是道德黑客及其流程。前几章介绍了成为道德黑客的定义、概念和过程，后半部分将详细介绍如何使用某些工具并渗透系统。


    阅读本书后，你应该能够使用这些工具进行一些测试，甚至参与渗透项目。你只需要记住：


    在每个章节中，我们都提供了实现渗透目标所使用的命令。你需要遵循这些命令并更改参数或名称以适应你的环境。


    # 关于作者


    作者 Rassoul Ghaznavi-zadeh 自 1999 年以来一直是 IT 安全工程师。他从 Cisco 工程师起步，并围绕 Cisco、Checkpoint、Juniper
    等技术以及 ISO 27001、PCI 等流程开发了其网络和安全知识。


    他在线 Linux 系统、服务以及其可用工具方面也有深厚的背景。Rassoul 通过测试、审计和提供建议，帮助许多企业组织建立了安全可靠的环境。


    Rassoul 拥有多个网络、安全和企业 IT 架构的国际认证。


    # 作者寄语


    在行业工作多年后，我决定写一本书与他人分享我的知识和经验。希望你发现这本书很有用，如果我能尽一份之力让技术行业变得更安全、更可靠。我尝试避免长段落，并将本书结构得像演示一样，这样你就不会感到无聊。


    对于购买这本书的人，我可以在 LinkedIn 上进行后续交流。将我加入你的网络并提问你可能任何问题，我很乐意提供帮助。


    我想把这本书送给我的妻子和女儿，她们一直陪伴着我，并抽出时间帮助我写这本书。


