    \ 表，以找出它们连接到了哪些网络。\n- 在受害者 HOST 上选择“Meterpreter”然后选择“Pivoting”，这将添加一条路由并列出所有通过该\
    \ HOST 可以找到的其他主机，并使用该受害者 HOST 进行进一步攻击。\n- 现在你可以扫描所有其他设备，并对它们点击右键并选择 scan。\n- 一旦发现服务，就可以开始攻击位于不同网络的主机。\n\
    \n![](img/c6b688dca6570d17db3036b560ef0905_84_0.png)\n\n## 使用 OpenVAS 和 Metasploit\
