  mdcn: "\n\n## CDP 泛洪攻击 (DoS)\n\n![](img/c6b688dca6570d17db3036b560ef0905_70_0.png)\n\
    \n思科发现协议 (CDP) 是由思科开发的一种专有数据链路层协议。它用于共享与其他直接连接的思科设备的信息，例如操作系统版本和 IP 地址。\n\n在此类攻击中，我们可以向相邻网络设备发送大量的\
    \ CDP 数据包并中断其运行。\n\n此类攻击将使用 yersinia。要进行测试：\n\n- 首先在交换机上清除 CDP 计数器和数据表，并显示 CDP\
    \ 流量和邻居设备 - 这只是为了查看网络设备上的变化，此可选\n- 运行 `yersinia -G`\n- 启动攻击并选择 CDP\n- 选择 \"Flooding\
    \ CDP table\" 将向交换机发送大量的 CDP 数据包\n- 现在检查交换机上的 CDP 流量和邻居表\n\n- 你可以看到交换机上有很多 CDP\
    \ 邻居关系\n\n![](img/c6b688dca6570d17db3036b560ef0905_71_0.png)\n\n## HSRP DoS 攻击\n\
    \n![](img/c6b688dca6570d17db3036b560ef0905_72_0.png)\n\n热备备路由协议 (HSRP) 是思科的一种专有冗余协议，用于建立容错的默认网关。\n\
    \n通过 HSRP，你可以拥有多个网络设备，并仅向客户端表示一个 IP 地址，因此如果一个设备故障，另一个将接管该角色。\n\n通过这种攻击，我们可以让 Kali\
    \ 加入 HSRP 集群并成为活动路由器。一旦完成，所有客户端流量都将发送到 Kali 而不是路由器。攻击者可以实现“中间人”攻击或 DoS 攻击，并导致客户端连接中断。\n\
    \n按照以下步骤进行 HSRP 攻击。\n\n- `yersinia -G`\n- 启动攻击，选择 HSRP 并选择成为活动路由器\n\n注意：通过 HSRP\
    \ 认证可以防止此类攻击。\n\n![](img/c6b688dca6570d17db3036b560ef0905_73_0.png)\n\n## 使用 DTP\
    \ 将 Access 端口转换为 802.1q Trunk 端口\n\n![](img/c6b688dca6570d17db3036b560ef0905_74_0.png)\n\
    \nAccess 端口（接入端口）用于连接终端客户端计算机、打印机、服务器等的端口。它们只能参与一个 VLAN。\n\nTrunk 端口（中干端口）用于多个网络设备之间通信的端口，可以携带多个\
    \ VLAN。\n\n网络交换机默认会协商端口成为中干端口的可能性 (DTP)。这种攻击可以利用交换机的这种默认行为来访问基础设施上的其他 VLAN 和网络（除非交换机上的默认配置已更改）。\n\
    \n- 运行 `yersinia -G`\n- 通过 DTP 标签页查看交换机的 DTP 状态\n- 启动攻击并选择启用中干 (enable trunking)\n\
    - 802.1Q 标签页将显示中干流量\n- 使用 Wireshark 查看流量\n- 现在你可以为 802.1q 标记设置回溯接口\n    - `modprobe\
    \ 8021q`\n    - `vconfig add eth0 20` -- 为 eth0 创建 VLAN 20 子接口\n    - `ifconfig\
    \ eth0.20 up`\n    - `ifconfig eth0.20 20.0.0.99/24`\n- 现在你就可以访问 VLAN 20 并开始攻击其他主机\n\
    \n![](img/c6b688dca6570d17db3036b560ef0905_75_0.png)\n\n## ARP 欺骗与 MITM (中间人攻击)\n\
    \n![](img/c6b688dca6570d17db3036b560ef0905_76_0.png)\n\nARP 欺骗是一种攻击者向局域网发送伪造的（被欺骗的”）地址解析协议\
    \ (ARP) 消息的技术。通常，目标是将攻击者的 MAC 地址与另一个主机（如默认网关）的 IP 地址关联，导致旨在发往该 IP 地址的流量被发送给攻击者。\n\
    \nARP 欺骗可能允许攻击者在局域网上拦截数据帧、修改流量或完全停止流量。这种常用的攻击通常是其他攻击的开端，例如拒绝服务、中间人攻击或会话劫持攻击。\n\
    \n- 通过以下步骤，Kali 将位于 10.0.0.2（客户端）和 10.0.0.1（防火墙/路由器/交换机）之间\n- `nmap -F 10.0.0.0/24`\
    \ -- 查找网络上的设备及其 MAC 地址和详细信息\n- `echo 1 >/proc/sys/net/ipv4/ip_forward` -- 启用 IP\
    \ 转发\n- `arpspoof -i eth0 -t 10.0.0.2 10.0.0.1` -- 这告诉 10.0.0.2 Kali 是 10.0.0.1\n\
    - `arpspoof -i eth0 -t 10.0.0.1 10.0.0.2` -- 这告诉 10.0.0.1 Kali 是 10.0.0.2\n- 运行上述命令后，你可以在防火墙/网关上验证这一点\n\
    - 现在我们可以使用嗅探器或以下工具监控流量\n- `driftnet -i eth0` -- 这将打开一个窗口并显示受害者浏览的网站内容\n- `urlsnarf\
    \ -i eth0` -- 这将显示受害者正在浏览的 URL\n- 一旦取消 arpspoof 命令，将通过向网关和受害者发送 ARP 表来恢复原始 ARP\
    \ 表！\n\n## Metasploit Framework\n\n![](img/c6b688dca6570d17db3036b560ef0905_78_0.png)\n\
    \nMetasploit 项目是一个开源项目，为研究安全漏洞和开发代码提供公共资源，这些代码允许网络管理员进入自己的网络以识别安全风险，并记录需要优先处理哪些漏洞。\n\
    \nMetasploit 项目提供了渗透测试（pen testing）软件，并提供了自动化比较程序漏洞与其修复（补丁后）版本之间的工具。它还提供了反取证和高级规避工具，其中一些已内置在\
    \ Metasploit 框架中。\n\n使用该框架利用系统的基本步骤包括：\n\n1. 选择并配置漏洞利用（利用其某一个漏洞进入目标系统的代码；包含了针对\
    \ Windows、Unix/Linux 和 Mac OS 系统的约 900 种漏洞利用）\n- 可选检查预定目标系统是否易受所选漏洞利用的影响\n- 选择并配置有效载荷（在成功进入后在目标系统上执行的代码；例如，远程\
    \ shell 或 VNC 服务器）\n- 选择编码技术，以防内入防御系统 (IPS) 忽略编码后的有效载荷\n- 执行漏洞利用\n\n该框架可以使用命令行或\
    \ GUI 界面使用。按照以下步骤安装/更新 Metasploit（如果需要）。\n\n"
