    \n- 操作系统指纹\n  - 此步骤用于确定目标系统运行的是什么操作系统，然后利用该操作系统相关的漏洞\n  - 其工作原理基于某些操作系统实现 TCP/IP\
    \ 栈的方式不同，对某些扫描的响应可以确定操作系统类型\n  - 某些操作系统在特定端口运行特定服务，这是识别操作系统的另一种方法\n    - 示例：137、138、139、445\
    \ 表示 Windows 2000 或更高版本\n\n- 扫描器\n  - Foundstone SuperScan - 基于 Windows 的应用程序，现由\
