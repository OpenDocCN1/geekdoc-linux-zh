    only the items for the associated user context. You can then use the "Request
    in browser in current browser session" function (via the context menu) to switch
    between browsers, to determine how they are handled in browser''s user context.


    +   - Many privilege escalation vulnerabilities arise when the application passes
    an identifier in a request parameter, and uses to identify the current user context.
    You can actively exploit this type of vulnerability by using Burp Intruder to
    cycle through identifiers in the appropriate format (e.g. using the numbers or
    custom iterator payloads types) and extracting grep items to retrieve interesting
    user-specific data from the application''s responses.


    +   - Other vulnerabilities - Burp contains functions that can be used to deliver,
    and often automate, virtually any task that arises when probing for other types
    of vulnerabilities. For example:


    +   - You can review the contents of the Target site map for information leakage
    issues, using the Search and Find functions to assist you.


    +   - Having identified a possible CSRF vulnerability, you can use the CSRF generator
    to quickly create a proof-of-concept attack in HTML, then use the "Test in browser"
    function to load the attack into your browser, and then review the browser results
    and Proxy history to verify whether the attack was successful.'
