    \n+   * SQL Injection"
- md: "\n- This is a type of attack on company’s valuable database assets - personal\
    \ data, financial data, etc.\n- Relies on poor data validation and statement checking\
    \ in application interface with databases, usually MSSQL\n- Utilizes the ability\
    \ to modify or append SQL statements that are sent to the database\n- Can often\
    \ circumvent authentication or restrictions placed on applications\n- Most commonly\
    \ affects web servers with back end SQL ansi92 enabled databases\n- Only data\
    \ validation checks and query restrictions can prevent SQL Injection\n- Some database\
    \ configuration can help, but application is the weak point\n\n- Rootkits\n\n\
    - Rootkits are malicious programs that replace OS executables\n- They are used\
    \ to maintain and hide illicit access\n- Usually require root access to install\n\
    - Linux rootkits are plentiful on Internet\n- Few detection methods available\n\
    - MD5sum of files based on baseline is one way, but logistically difficult to\
    \ manage due to legitimate frequent changes on systems\n- Very difficult to eliminate\
    \ rootkits\n- Best way is to rebuild the box with known good software\n- Disadvantage\
    \ is rebuilding the box eliminates evidence of rootkit that may be needed in investigation/prosecution\n\
    \n- Spoofing\n\n- This is the technique used to hide identity of traffic originator\
    \ or assume identity of trusted entity\n- IP addresses, MAC addresses, emails\
    \ are routinely spoofed\n- Prevent attackers from being easily traced\n- Usually\
    \ relies on weaknesses of TCP/IP itself or applications\n- Some mechanisms in\
    \ place can prevent spoofing (blocking internal address space from entering firewall\
    \ through external interface, for example)\n- Spoofing methods and tools depend\
    \ on platform and architecture\n\n- Denial of Service (DoS) attacks\n- These types\
    \ of attacks are used to prevent legitimate users of system from using it\n- May\
    \ become primary goal of attacker if penetration attempts have failed\n- Does\
    \ not require a lot of skill or experience to implement\n- Many methods/levels\
    \ of DoS attacks exist:\n    - TCP clash: Ping of Death, Window size overflow,\
    \ Smurf, Teardrop attacks\n    - User access: intentionally locking users out\
    \ of services\n    - Halting services that apps depend upon\n    - Large scale\
    \ DoS attacks use multiple hosts\n    - Called Distributed DoS attack\n- Uses\
    \ unspecting/unsecured hosts to mount multi-system attack on target (zombies)\n\
    \n- Web hacking\n- Attacks against web sites or servers are most popular attacks\n\
    - They are easier due to to proximity of target to Internet\n- Unsecure coding\
    \ and failure to lockdown servers make them easy targets\n- Most servers are behind\
    \ firewall but traffic is allowed through necessity\n- First step is to enumerate\
    \ services/apps on target, determine what web software is running\n- Try known\
    \ exploits against identified web server (IIS, Apache, etc.)\n- Use exploits that\
    \ achieve specific goal (DoS) of site, site defacement or modification\n- May\
    \ also be able to intercept/modify data through attack\n- Web server attack may\
    \ lead to deeper penetration of network (backend database servers, etc.)\n- Popular\
    \ attacks include:\n    - Cross-site scripting\n    - IIS DDL vulnerabilities\n\
    \    - Directory Traversal\n    - Unicode Attacks\n\n# Popular Hacking Tools\n\
    \n- Nmap\n- It is the most popular multifunctional tool\n- Versions available\
    \ for both Windows and Linux, Linux command version is better\n- Functions as\
    \ a ping, port, service scanner - Can identify OS\n- Very useful during initial\
    \ stages of attack to find hosts and enumerate their services\n- Simple to use\
    \ command like features series of switches that dictate which type of scan target\n\
    - Examples:\n    - nmap -S 192.168.66.132 >> syn.txt --- TCP syn scan, quick and\
    \ quiet\n    - nmap -T 192.168.66.132 >> syn.txt -- TCP scan - can be detected\
    \ by IDS\n    - nmap -sU 192.168.66.132 >> udp.txt - UDP scan\n    - nmap -sM\
    \ 192.168.66.132 >> bsd.txt --- TCP stack scan on BSD operating system\n    -\
    \ nmap -sA 192.168.66.17 >> ack.txt -- Ack scan to enumerate firewalls rule set\n\
    \    - nmap -sN 192.168.66.1 >> linux.txt - Linux Null scan, if packet doesn't\
    \ contain ack, syn ack, it will return null if close and no response open\n  \
    \  - nmap -sF 192.168.66.1 >> linux.txt - Fin scan - Fin flag is on\n    - nmap\
    \ -sX 192.168.66.1 >> linux.txt - Xmas scan\n    - nmap -scanflags URG 192.168.66.1\
    \ >> urg.txt\n    - nmap - scanflags URGST 192.168.66.1 >> linux.txt\n\n- Superscan\n\
    - It is a Windows-based tool with almost same functionality as nmap\n- Developed\
    \ by Foundation Inc\n- Now owned by McAfee\n- Easy to use the GUI interface\n\
    - Has other functions including network lookup, whois, etc.\n\n- Nessus\n- Most\
    \ popular network vulnerability scanner\n- Open source with commercial version\
    \ available\n- Web management interface\n- Uses modular databases of current exploits\
    \ for all types of OSes and apps\n- Databases called Plugins\n- Hundreds of plugins\
    \ exist and are updated daily to include latest exploits\n- Requires higher level\
    \ of knowledge to effectively use tool\n- Has its own scripting language (NASL)\
    \ used to custom-write exploit scans\n\n- Kali Linux\n- Kali Linux is a Debian-derived\
    \ Linux distribution designed for digital forensics and penetration testing. It\
    \ is maintained and funded by Offensive Security Ltd. It was developed by Mati\
    \ Aharoni and Devon Kearns of Offensive Security through the rewrite of BackTrack,\
    \ their previous forensics Linux distribution.\n- We will show you how to use\
    \ some of Kali’s features and tools later on this book.\n\n# Ethical Hacking and\
    \ Penetration Certifications\n\n- The Certified Ethical Hacker (CEH) Exam\n- The\
    \ Certified Penetration Testing Specialist Exam\n- The OSSTMM Professional Security\
    \ Tester\n\n# Penetration Testing with Kali Linux\n\n![](img/c6b688dca6570d17db3036b560ef0905_45_0.png)\n\
    \n# Penetration testing and Digital Forensics Tool kit\n\nKali Linux is one of\
    \ the best penetration testing tool which contains tools for\n\n- Vulnerability\
    \ assessment\n- Information gathering\n- Forensics\n- Exploitation\n- Privilege\
    \ escalation\n- Wireless tools\n- Many others as well\n\n# Kali Linux Installation\
    \ and usage\n\nThere are different ways of using Kali Linux. Whether you choose\
    \ to install it on local disk or use the live distributions the options are available.\n\
    \n- Live CD\n    You can load Kali Linux from a bootable CD/DVD without any need\
    \ to install it. This will be a live version of Kali and has all the features.\n\
    - Live USB\n    You can install Kali Linux on a USB disk and use that to load\
    \ Kali. This will be very handy when you want to have a portable version and be\
    \ able to take it anywhere with you.\n- Installed to disk\n    This is a normal\
    \ and basic installation of Kali Linux which is very similar to a Linux distributions\
    \ installation. You need to follow the prompts and get the installation completed.\
    \ We will explain this later in this book.\n\n# Installing on Virtual machine\n\
    \nOnce the installation is completed you need to setting the IP address and basic\
    \ configuration like SSH, Gateway, DNS, etc.\n\nIt is always recommended to update\
    \ your environment with the below commands to have all the latest software and\
    \ tools installed.\n\nFirst command is “apt-get update” which will update the\
    \ database and make your operating system ready for the next step.\n\nSecond step\
    \ is to run ”apt-get upgrade” command which will perform an upgrade on all packages\
    \ and software available on Kali. This process might take a while.\n\nFor complete\
    \ installation steps guide, please refer to the last section of this book.\n\n\
    # Wireless Penetration\n\n![](img/c6b688dca6570d17db3036b560ef0905_49_0.png)\n\
    \nWireless networks are an extension of your organisation’s infrastructure perimeter\
    \ and should be tested thoroughly. An insecure wireless network opens up your\
    \ organisation to the external world and poses a security risk. Rogue access points,\
    \ installed by employees on the infrastructure, which do not follow the organisation’s\
    \ security guidelines, can also be used to compromise your organisation.\n\nOn\
    \ the next couple of sections we will show you how to do some penetration testing\
    \ on wireless networks and how easy it is to bypass the available security on\
    \ the wireless devices. First we start with setting up the wireless adapter for\
    \ Kali.\n"
  mdcn: "\n\n- 这是一种针对公司高价值数据库资产的攻击 - 如个人数据、财务数据等\n- 依赖于应用程序接口与数据库（通常是 MSSQL）交互时脆弱的数据验证和语句检查\n\
    - 利用修改或追加发送到数据库的 SQL 语句的能力\n- 经常可以绕过应用程序设置的身份验证或限制\n- 最常见的是启用了后端 SQL ansi92 数据库的\
    \ Web 服务器\n- 只有数据验证检查和查询限制才能防止 SQL 注入\n- 某些数据库配置可以帮助，但应用程序是弱点\n\n- Rootkits（根内核程序工具包）\n\
    \n- Rootkits 是替换操作系统可执行文件的恶意程序\n- 它们用于维护和隐藏非法访问\n- 通常需要 root 权限才能安装\n- 互联网上有大量的\
    \ Linux rootkits\n- 现有的可用的检测方法较少\n- 基于基线的文件的 MD5sum 是一种方法，但由于系统上频繁的合法更改，在管理上非常困难\n\
    - 消除 rootkits 非常困难\n- 好的办法是用已知的良好软件重新构建系统\n- 缺点是重新构建系统会消除调查/诉讼中可能需要的 rootkit 证据\n\
    \n- 欺骗（Spoofing）\n\n- 这种技术用于隐藏流量源者的身份或假装受信实体实体身份\n- IP 地址、MAC 地址、电子邮件经常被伪造\n-\
    \ 防止攻击者被轻易追踪到\n- 通常依赖于 TCP/IP 本身或应用程序的漏洞\n- 实施的某些机制可以防止欺骗（例如，阻止内部地址空间从外部接口进入防火墙）\n\
    - 欺骗方法和工具取决于平台和架构\n\n- 拒绝服务 (DoS) 攻击\n- 这些类型的攻击用于防止系统的合法用户使用它\n- 如果渗透尝试失败，这可能成为攻击者的首要目标\n\
    - 实现它不需要大量的技能或经验\n- 存在许多方法/级别的 DoS 攻击：\n    - TCP 冲突：死亡之源（Ping of Death）、窗口大小溢出、Smurf\
