    \ UDP 扫描\n\n## 步骤 4 - 数据枚举\n\n- 什么是枚举\n  - 获取有关系统、网络和主机的详细特定信息\n  - 利用未定义为漏洞的各种技术\n\
    \  - 一种非侵入性的获取价值信息的方法\n  - 信息包括：\n    - SNMP 团体、MIB 特定信息\n    - 用户名和组\n    - 广告服务（如主浏览器\
    \ Master Browser）\n\n- SNMP 枚举\n  - 大多数设备的默认团体字符串为‘public’\n  - public 字符串可能具有各种权限来获取信息\n\
    \  - MIB 包含可以获取的大量特定信息\n  - Kali Linux 可用于许多 SNMP 测试\n\n- DNS 区域传输\n  - DNS 服务是任何组织的核心名称解析服务\n\
