- md: "\n# IPv6 neighbor discovery\n\n![](img/c6b688dca6570d17db3036b560ef0905_119_0.png)\n\
    \nNeighbor Discovery Protocol (NDP) can be conceptualized as a toolbox used by\
    \ IPv6 hosts to carry out various link-local operations. NDP itself does not describe\
    \ a wire-level protocol or packet structure, but rather establishes directions\
    \ for accomplishing routine tasks using certain algorithms and fine ICMPv6 message\
    \ types.\n\nMany of the capabilities provided by NDP are very similar to those\
    \ found in IPv4's ARP and ICMPv4, while others are new implementations available\
    \ only under IPv6. RFC 4861 describes the nine functions of NDP in detail, but\
    \ this article should suffice as a high-level review. A packet capture of various\
    \ IPv6 Neighbor Discovery functions is available if you want to follow along with\
    \ Wireshark.\n\n# Router Discovery\n\nWhereas IPv4 hosts must rely on manual configuration\
    \ or DHCP to provide the address of a default gateway, IPv6 hosts can automatically\
    \ locate default routers on the link. This is accomplished through the use of\
    \ two ICMPv6 messages: Router Solicitation (type 133) and Router Advertisement\
    \ (type 134). When first joining a link, an IPv6 host multicasts a router solicitation\
    \ to all the routers multicast group, and each router active responds by sending\
    \ a router advertisement with its address to all the nodes group.\n\n![](img/c6b688dca6570d17db3036b560ef0905_120_0.png)\n\
    \nRouter advertisements indicate paths out of the local link, but they also specify\
    \ additional information necessary to assist other NDP operations.\n\n# Prefix\
    \ Discovery\n\nOne of the options typically carried by a router advertisement\
    \ is the Prefix Information option (type 3). Each prefix information option lists\
    \ an IPv6 prefix (subnet) reachable on the local link. Remember that it is not\
    \ uncommon for multiple IPv6 prefixes to reside on the same link, and routers\
    \ may include more than one prefix in each advertisement. A host which knows what\
    \ prefixes are reachable on the link can communicate directly with destinations\
    \ in those prefixes without passing its traffic through a router.\n\n# Parameter\
    \ Discovery\n\nAnother option included in router advertisements is the MTU option\
    \ (type 5), which informs hosts of the IP MTU to use. For example, this value\
    \ is typically set to 1500 for Ethernet networks. However, not all link types\
    \ have a standardized MTU size. Including this option ensures all hosts know the\
    \ correct MTU to use.\n\nRouter advertisements also specify the default value\
    \ hosts should use for the IPv6 hop count. This isn't an option, but a field built\
    \ into the router advertisement message header.\n\n# Address Auto-configuration\n\
    \nNDP provides mechanisms for a host to automatically configure itself with an\
    \ address from a prefix learned from a local router through prefix discovery.\
    \ This is done by concatenating a candidate learned prefix with the EUI-64 address\
    \ of the host's interface. In this manner, a host can achieve stateless auto-configuration.\n\
    \n# Address Resolution\n\nThe function of address resolution was handled by ARP\
    \ for IPv4, but is handled by ICMPv6 for IPv6. In a process very similar to router\
    \ discovery, two ICMPv6 messages are used: Neighbor Solicitation (type 135) and\
    \ Neighbor Advertisement (type 136). A host seeking the link layer address of\
    \ a neighbor multicasts a neighbor solicitation and the neighbor (if online) responds\
    \ with its link layer address in a neighbor advertisement.\n\n![](img/c6b688dca6570d17db3036b560ef0905_122_0.png)\n\
    \n### Next-Hop Determination\n\nIn IPv4, next-hop determination is simply a procedure\
    \ for performing longest-match lookups on the host routing table and, for off-link\
    \ destinations, the selection of a default router.\n\n### Neighbor Unreachability\
    \ Detection\n\nNDP is able to determine the reachability of a neighbor by examining\
    \ clues from upper-layer protocols (for example, received TCP acknowledgments,\
    \ or by actively performing address resolution via ICMPv6) when certain thresholds\
    \ are reached.\n\n### Duplicate Address Detection\n\nWhen a host first joins a\
    \ link, it multicasts neighbor solicitations for its own IPv6 address for a short\
    \ period before attempting to use that address to communicate. If it receives\
    \ a neighbor advertisement in response, the host realizes that another neighbor\
    \ on the link is already using address. The host will mark the address as duplicate\
    \ and will not use it on the link. Note that this process is similar to IPv4 gratuitous\
    \ ARP requests, but NDP allows for detection of two hosts with the same address.\n\
    \n# Redirection\n\nA fifth type of ICMPv6 message, Redirect (type 137), is used\
    \ by routers to either point hosts toward a more preferable router or to indicate\
    \ that destination actually resides on link. IPv4 provides the same capability\
    \ with its own redirect message.\n\n![](img/c6b688dca6570d17db3036b560ef0905_123_0.png)\n\
    \n# MITM attack on IPv6 with Parasite\n\nIPv6 Neighbor Discovery (ND) is a set\
    \ of messages and processes that determine relationships between nodes. ND replaces\
    \ Address Resolution Protocol (ARP), Internet Control Message Protocol (ICMP)\
    \ Router Discovery, and ICMP Redirect which are used in IPv4, and provides additional\
    \ functionality. ND is described in RFC 4861.\n\nND is used by hosts to:\n- Discover\
    \ neighboring routers.\n- Discover addresses, address prefixes, and other configuration\
    \ parameters.\n\nND is used by routers to:\n- Advertise their presence, host configuration\
    \ parameters, and on-link prefixes.\n- Inform hosts of a better next-hop address\
    \ to forward packets by a specific destination.\n\nNeighbor discovery operation\
    \ in IPv6 can be used to initiate MITM attack. Below steps using Parasite will\
    \ show how to launch MITM attack in an IPv6 environment. Parasite will send ICMP\
    \ solicitation/advertisement packets and advertise the MAC address to neighbors.\n\
    \n- On windows you can type `netsh interface ipv6 show neighbors` -- This will\
    \ show all ipv6 neighbors\n- First enable IPv6 forwarding: `echo 1 >/proc/sys/ipv6/conf/all/forwarding`\
    \ -- Enables IP forwarding\n- To run parasite: `parasite -I eth0` -- loops and\
    \ respond the packets every 5 seconds, -R injects the destination of solicitation\n\
    - Now if we check the ipv6 neighbors on windows, will see the MAC address of the\
    \ router changed\n- Now you can run Wireshark and sniff the traffic. Again, all\
    \ clear text passwords can be found out on Wireshark by Following TCP stream!\n\
    \n# IPv6 Tools from THC (The Hacker Choice)\n\n![](img/c6b688dca6570d17db3036b560ef0905_124_0.png)\n\
    \nMany toolkits exist that allow you to exploit weaknesses in software and protocol\
    \ vulnerabilities. A toolkit can be thought of as a collection of programs that\
    \ allows an individual to test or break into a system.\n\nOne toolkit in particular\
    \ maintained by Van Hauser of The Hacker’s Choice called THC-IPv6 allows you to\
    \ “attack” weaknesses in the IPv6 and ICMP6 protocols. Its primary purpose is\
    \ to test network devices with active IPv6 interfaces. With over 50 separate tools\
    \ the toolkit allows you to perform such tasks like detect IPv6 hosts, impersonate\
    \ IPv6 routers and initiate denial of service attacks.\n\nWith experimentation\
    \ and time you can practice on your own to cater the tool suite to suit your needs.\
    \ Members of The Hacker’s Choice and users of the toolkit are always developing\
    \ new tools and of course accepting software contributions.\n\nSome of the functions\
    \ of THC-IPv6 are:\n- Rogue IPv6 RA (Router Advertisement)\n- Discover New IPv6\
    \ Hosts\n- NDP DAD Attack (Respond with IP address in use so system cannot get\
    \ an IP)\n- NDP RA Flooding (Lots of router advertisement)\n- NDP NA Flooding\
    \ (Neighbor advertisement flooding)\n- Implementation Checks - Check features,\
    \ function on a device with ipv6\n\nSome use cases of THC with IPv6 are below:\n\
    - `fake_router6 eth0 2001:db8:BAD::64` -- This will send a fake router advertisement\
    \ to the network\n  - The windows client should have a IPv6 address in the network\
    \ specified in Kali\n  - On windows client (victim) run \"netsh interface ipv6\
    \ show route\" will show the ipv6 routes\n- `detect-new-ipv6 eth0` -- This will\
    \ listen to the network and discover new ipv6 addresses assigned to the device\n\
    - `dos-new-ipv6 eth0` -- this will listen on eth0 and when receive a duplicate\
    \ discover message it will respond with the message that ipv6 is in use - As a\
    \ result no new device can get IP address on the network\n- `flood_router6 eth0`\
    \ -- This will start flooding the network with router advertisement\n  - If you\
    \ check ifconfig on the computers on the network they will receive lots of ipv6\
    \ addresses and networks! This is a very serious Dos attack and will affect the\
    \ devices on the network\n- `flood_advertise60` -- This will start flooding the\
    \ network with Neighbor Advertisements and have similar effects as above command\n\
    - `implementation6 eth0 2001::1` -- This will check the device with 2001::1 IP\
    \ address and will return the results about what features are\n"
  mdcn: "\n\n# IPv6 邻居发现\n\n![](img/c6b688dca6570d17db3036b560ef0905_119_0.png)\n\n\
    邻居发现协议 (NDP) 可以被概念化 IPv6 主机用于执行各种本地链路操作的工具箱。NDP 本身并不描述线层协议或数据包结构，而是通过某些算法和精细的\
    \ ICMPv6 消息类型为完成常规任务建立方向。\n\nNDP 提供的许多功能与 IPv4 中的 ARP 和 ICMPv4 非常相似，而另一些则是仅在 IPv6\
    \ 下可用的新实现。RFC 4861 详细描述了 NDP 的九种功能，但本文作为高级回顾已经足够了。如果你想配合 Wireshark 一起操作，可以获取各种\
    \ IPv6 邻居发现功能的数据包捕获。\n\n# 路由器发现\n\nIPv4 主机必须依赖手动配置或 DHCP 提供默认网关地址，而 IPv6 主机可以自动定位链路上的默认路由器。这是通过使用两种\
    \ ICMPv6 消息实现的：路由器请求（类型 133）和路由器公告（类型 134）。当首次加入链路时，IPv6 主机会向所有路由器组播组发送一个路由器请求，每个活跃的路由器通过向所有节点组发送带有其地址的路由器公告来响应。\n\
    \n![](img/c6b688dca6570d17db3036b560ef0905_120_0.png)\n\n路由器公告指示了离开本地链路的路径，但它们还指定了协助其他\
    \ NDP 操作所需的额外信息。\n\n# 前缀发现\n\n路由器公告通常携带的选项之一是前缀信息选项（类型 3）。每个前缀信息选项列出了本地链路上可达的\
    \ IPv6 前缀（子网）。请记住，同一链路路上存在多个 IPv6 前缀并不起见，路由器可能在每条公告中包含多个前缀。知道链路路上哪些前缀是可达的主机可以直接与这些前缀中的目的进行通信，而无需将流量通过路由器。\n\
    \n# 参数发现\n\n路由器公告中包含的另一个选项是 MTU 选项（类型 5），它告知主机要使用的 IP MTU。例如，此值在以太网网络中通常设置为 1500。然而，并非所有链路类型都有标准的\
    \ MTU 大小。包含此选项可确保所有主机都知道要使用的正确 MTU。\n\n路由器公告还指定了主机应使用的 IPv6 跳跃数默认值。这并不是一个选项，而是构建在路由器公告消息头中的一个字段。\n\
    \n# 地址自动配置\n\nNDP 提供了一种机制，允许主机通过从本地路由器学习到的前缀，自动为自己配置地址。这是通过将学习到的候选前缀与主机接口的 EUI-64\
    \ 地址拼接实现的。通过这种方式，主机可以实现无状态自动配置。\n\n# 地址解析\n\n地址解析的功能在 IPv4 中由 ARP 处理，而在 IPv6 中由\
    \ ICMPv6 处理。在一个与路由器发现非常相似的过程中，使用了两种 ICMPv6 消息：邻居请求（类型 135）和邻居公告（类型 136）。寻求邻居链路层地址的主机会多播一个邻居请求，而该邻居（如果在线）则通过邻居公告响应并返回链路层地址。\n\
    \n![](img/c6b688dca6570d17db3036b560ef0905_122_0.png)\n\n### 下一跳确定\n\n在 IPv4 中，下一跳确定简单是指在主机路由表上执行最长匹配查找的过程，并且对于链路外的目的，选择默认路由器的过程。\n\
    \n### 邻居不可达检测\n\n当达到某些阈值时，NDP 通过检查来自上层协议的线索（例如收到的 TCP 确认包，或通过 ICMPv6 主动执行地址解析）来确定邻居的可达性。\n\
    \n### 重复地址检测\n\n当主机首次加入链路时，它会在尝试使用该地址通信之前，在短时间内对其自己的 IPv6 地址多播邻居请求。如果它收到了响应的邻居公告，主机就会意识到链路上的另一个邻居已经在使用该地址。主机会将该地址标记为重复且不会在链路上使用它。注意，此过程类似于\
    \ IPv4 的免费 ARP 请求，但 NDP 允许检测两个具有相同地址的主机。\n\n# 重定向\n\n第五种类型的 ICMPv6 消息是重定向（类型 137），它被路由器用于将主机指向更优的路由器，或者指示目的地实际上位于链路上。IPv4\
    \ 通过自己的重定向消息提供了相同的能力。\n\n![](img/c6b688dca6570d17db3036b560ef0905_123_0.png)\n\
    \n# 使用 Parasite 对 IPv6 进行 MITM 攻击\n\nIPv6 邻居发现 (ND)是一组确定节点间关系的消息和过程。ND 替换了 IPv4\
    \ 中地址解析协议 (ARP)、Internet 控制消息协议 (ICMP) 路由器发现和 ICMP 重定向，并提供了额外的功能。ND 在 RFC 4861\
    \ 中描述。\n\n主机使用 ND 用于：\n- 发现邻居路由器。\n- 发现地址、地址前缀和其他配置参数。\n\n路由器使用 ND 用于：\n- 宣告它们的存在、主机配置参数和链上前缀。\n\
    - 告知主机通过特定目的转发数据包的更好的下一跳地址。\n\nIPv6 中的邻居发现操作可用于发起 MITM 攻击。以下使用 Parasite 的步骤将展示如何在\
    \ IPv6 环境中启动 MITM 攻击。Parasite 将发送 ICMP 请求/公告数据包并向邻居宣告 MAC 地址。\n\n- 在 windows 上，你可以输入\
    \ `netsh interface ipv6 show neighbors` -- 这将显示所有 ipv6 邻居\n- 首先启用 IPv6 转发：`echo\
    \ 1 >/proc/sys/ipv6/conf/all/forwarding` -- 启用 IP 转发\n- 运行 parasite：`parasite\
    \ -I eth0` -- 循环并每 5 秒响应一次数据包，-R 注入请求的目的\n- 现在如果我们在 windows 上检查 ipv6 邻居，将看到路由器的\
    \ MAC 地址已更改\n- 现在你可以运行 Wireshark 并嗅探流量。再次，通过跟踪 TCP 流，可以在 Wireshark 中找到所有明文密码！\n\
    \n# 来自 THC (The Hacker Choice) 的 IPv6 工具\n\n![](img/c6b688dca6570d17db3036b560ef0905_124_0.png)\n\
    \n存在许多工具箱，可以让你利用软件漏洞。一个工具箱可以被视为一个允许个人测试或入侵系统的程序集合。\n\n由 The Hacker’s Choice 的\
    \ Hauser 维护的一个名为 THC-IPv6 的工具箱特别允许你“攻击”IPv6 和 ICMP6 漏洞。其主要目的是测试具有活动 IPv6 接口的网络设备。拥有超过\
    \ 50 个独立工具，该工具箱允许你执行诸如检测 IPv6 主机、伪造路由器和发起拒绝服务攻击等任务。\n\n通过实验和时间，你可以根据需求调整工具套件。The\
    \ Hacker’s 的成员和工具箱的用户一直在开发新工具并接受软件贡献。\n\nTHC-IPv6 的某些功能包括：\n- 恶意 IPv6 RA\n- 发现新\
    \ IPv6 主机\n- NDP DAD 攻击（响应地址在使用导致系统无法获取 IP）\n- NDP RA 泛（大量的路由器公告）\n- NDP NA 泛（邻居公告泛）\n\
    - 实现检查 - 检查 ipv6 设备的功能\n\n以下是 THC IPv6 的用例：\n- `fake_router6 eth0 2001:db8:BAD::64`\
    \ -- 向网络发送伪路由器公告\n  - windows 客户端应该拥有 Kali 中指定的网络 IPv6 地址\n  - 在 windows 客户端（目标）运行\
    \ \"netsh interface ipv6 show route\" 将显示 ipv6 路由\n- `detect-new-ipv6 eth0` --\
    \ 这将监听网络并发现分配给设备的 ipv6 地址\n- `dos-new-ipv6 eth0` -- 这将监听 eth0 并在收到重复发现消息时响应 ipv6\
    \ 已使用 - 导致网络上没有新设备获取 IP 地址\n- `flood_router6 eth0` -- 这将向网络泛洪路由器公告\n  - 如果你在网络上的计算机上检查\
    \ ifconfig，将收到大量的 ipv6 地址和网络！这是一个严重的 Dos 攻击，会影响网络上的设备\n- `flood_advertise60` --\
    \ 这将向网络泛洪邻居公告，并产生与上述命令的效果\n- `implementation6 eth0 2001::1` -- 这将检查 2001::1 IP\
    \ 地址的设备并返回关于功能的**\n\n"
