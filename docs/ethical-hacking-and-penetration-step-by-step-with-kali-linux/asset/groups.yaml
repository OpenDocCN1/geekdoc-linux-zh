    - `ifconfig eth0 0.0.0.0 up`\n- `ifconfig at0 0.0.0.0 up`\n- `ifconfig BR1 192.168.1.205/24\
    \ up`\n- 测试并启用 IP 转发\n  - `ping 192.168.1.1`\n  - `echo 1 >/proc/sys/net/ipv4/ip_forward`\n\
    \n# Nmap - 免费安全扫描器\n\n![](img/c6b688dca6570d17db3036b560ef0905_64_0.png)\n\nNmap\
    \ 是最好且最流行的扫描工具之一，可用于侦察步骤之后。它具有许多内置功能和插件，可识别网络或互联网上的漏洞主机和服务。\n\n通过 “man nmap” 和\
    \ “nmap -h” 你可以熟悉它的选项和用法。\n\n- 下面我们解释了一些使用 nmap 的示例：\n  - `nmap 192.168.1.24`\
    \ -- 扫描单个 IP 地址\n- `nmap 192.168.1.0 - 255` -- 扫描范围 IP 地址范围\n  - `nmap 192.168.1.0/24`\
    \ -- 扫描子网\n  - `nmap -sP -iP0` -- Ping 扫描\n  - `nmap -sS -PP0 -sV -O 192.168.1.0-50`\
    \ -- TCP Syn 扫描、协议扫描、确定版本、发现操作系统\n- `nmap -T5 192.168.1.0/24` -- 激进程度 - T5 比 T1\
    \ 快\n- `nmap -top-ports 20 192.168.1.0/24` -- 仅扫描前 20 个端口 - 热门端口\n- `nmap -sT\
    \ -p80 192.168.1.50-100` -- TCP 扫描，仅 80 端口\n- `nmap -sS 192.168.1.1-5 -D 192.168.98,192.168.1.99`\
    \ -- 将从你 D 之后指定的多个源 IP 地址发送扫描。这可以分散网络管理员的注意力，因为来自多个源有很多扫描\n- `nmap -V 192.168.1.6`\
    \ -- 详细模式将在屏幕上提供更多细节\n- `nmap -F 192.168.1.0/24 -exclude 192.168.1.1,192.168.1.2`\
    \ -- -F 意味着仅扫描前 100 个端口，并从范围内排除这两个 IP 地址\n- `nmap -Pn 192.168.1.6` -- 不进行 ping\
    \ 而是直接扫描。没有此选项，它将先尝试 ping 宿主机\n- `nmap --iflist` -- 获取接口和 IP 列表\n- `nmap -A -T4\
    \ 192.168.1.1` -- -A 表示执行脚本、带版本的 NMAP 操作系统检测、traceroute、T4 用于计时\n- 使用 IPv6 使用\
    \ Nmap\n  - `ifconfig eth0 ipv6 add 2001:db8:6783:1::64`\n  - `nmap -6 2001:db8:6783:1::1`\n\
    - Nmap 脚本\n  - `nmap --script=default 192.168.1.24` -- 等同于 nmap -sC 192.168.1.24\n\
    \  - 有许多脚本选项，如 DoS, Safe, exploit, malware, vulnerability, discovery 等\n  - `nmap\
    \ --script-help discovery` -- 这是脚本的帮助信息\n  - `nmap -script “safe or default” 192.168.1.24`\
    \ -- 同时运行默认和安全脚本\n  - `nmap -script “discovery and” 192.168.1.24`\n- Nmap GUI\n\
    \  - 如果你喜欢使用，nmap 有图形界面。该图形界面被称为 zenmap。\n\n# DHCP 饥饿攻击 (DHCP Starvation)\n\n\
    ![](img/c6b688dca6570d17db3036b560ef0905_66_0.png)\n\n在大多数企业网络中有 DHCP 服务器为客户端提供\
    \ IP 地址。DHCP 饥饿基本上是一种 DoS 攻击，攻击者向 DHCP 服务器发送无限请求，直到填满池并阻止用户访问网络上的任何内容。\n\n- 用于此攻击的工具是\
    \ Yersinia\n- `yersinia -G` -- yersinia 的图形界面\n- 选择 DHCP 并启动攻击\n- 选择 “Sending\
    \ DISCOVER Packet” 并启动攻击\n- 这将开始请求 IP 地址直到填满池\n\n![](img/c6b688dca6570d17db3036b560ef0905_67_0.png)\n\
    \n# 成为生成树根节点 (Become the Root of Spanning Tree)\n\n![](img/c6b688dca6570d17db3036b560ef0905_68_0.png)\n\
    \n生成树协议 (STP) 是一种网络协议，确保任何桥接以太网局域网的无环拓扑。STP 的基本功能是防止桥接环路及其产生的广播风。\n\n生成树根桥是桥 ID\
    \ 最小（最低）的桥，它是网络的焦点。生成树的根桥是桥 ID 最小的桥。每个桥都有一个可配置的优先级数字和一个 MAC 地址；桥 ID 包含这两个数字 -\
    \ 桥优先级 + MAC (32768.0200.0000.1111)。\n\n通过这种攻击，我们可以接管桥接职责并破坏网络运行。\n\n- 用于此攻击的工具是\
    \ Yersinia\n- 一种方案是在交换机之间有一个设备（可能是集线器），并将 Kali 连接到该设备\n- 第二种方案如果 Kali 有两个接口并分别连接到一个交换机，并启动\
    \ STP+中间人攻击，这样 Kali 将成为根节点\n\n- 然后我们可以将设备宣告为 STP 根\n- `yersinia -G` -- yersinia\
    \ 的图形界面\n- 选择 STP 并启动攻击\n- 选择 “Claiming Root Role” 并启动攻击\n\n![](img/c6b688dca6570d17db3036b560ef0905_69_0.png)\n\
    \n"
