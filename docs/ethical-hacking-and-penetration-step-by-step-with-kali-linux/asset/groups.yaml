  - "[PAGE 24]\n\n# Step 2 - Scanning\n\n+   - Scanning live hosts\n  - This step\
    \ is looking for live hosts on the network that their services may be later enumerated\n\
    \  - It can be intrusive and maybe detected by IDS\n  - Maybe illegal in some\
    \ places and need the pre-approval. You need to check before doing this in production\n\
    \  - Usually identified by system administrators and will be logged on logging\
    \ servers Methods exist to reduce visibility of scan - e.g. delayed scans or FIN,\
    \ Null or Xmas scan\n  - Uses tools known as scanners as Supercan, nmap, etc.\n\
    - TCP Connection\n  - TCP and UDP are most common protocol on the networks and\
    \ internet. You need to understand how TCP works to be able to use the scanning\
    \ tools and initiate an attack.\n  - TCP includes 6 TCP flags that are set in\
    \ packets\n  - TCP Flags indicate whether packet is initial (syn), acknowledgement\
    \ (ack), finish (fin), urgent (urg), push (psh) or reset (rst)\n  - TCP Uses 3-way\
    \ handshake to establish and maintain the sessions which includes the below steps\
    \ between the Source and Destination devices:\n    - Syn (source to dest) -> syn-ack\
    \ (dest to source) -> ack (source to dest)\n  - Many attacks use non-standard\
    \ combinations of these flags (malformed packets) to elicit response from host\
    \ or attack host\n  - Syn flood: It is a Dos attack where source computer sends\
    \ only syn packets. As a result there will be a lot of open-half sessions on the\
    \ victim machine and it will be overloaded and not usable.\n- Scan Types\n  -\
    \ Full scan: completes all 3 parts of the 3-way handshake. This is the most reliable\
    \ scan but very noisy and can be easily picked up by IDS systems"
  - '[PAGE 25]


    +   - Half open (syn) scan: only uses first part (syn) of the handshake to get-syn-ack
    won''t send the third part (ack) back. This also can be picked by IDS systems

    - Stealth Scan: Varies time and frequency of scan to avoid detection by IDS. This
    is not a full connect scan

    - Xmas Scan: malformed packet that sets fin, urg, and push flags; This is used
    to bypass firewalls

    - Ack Scan: Sending only an ack packet; receiving end won''t know how to respond
    as there was no handshake; causes open ports to return a reset

    - FIN Scan: Sending a packet with fin flag set; This can usually bypass the IDS
    systems

    - Null Scan: Sending a packet with no flag set; This can also bypass the IDS systems
    in most cases


    +   - UDP Scanning

    - Unlike TCP, UDP protocol doesn''t have too many controls and handshakes. The
    process of UDP stream is much simpler.

    - Source device will send a UDP request and the destination will respond.

    - UDP scanning scans only for UDP packets

    - It is less reliable than TCP scanning

    - Maybe of limited value, since UDP or ICMP may be blocked at the firewall


    +   - ICMP Scanning

    - ICMP is the most common protocol to

    - Ping scanning is the most common way of scanning

    - Live hosts may respond to ICMP Type 0 or 8

    - Most network scanners include ping scans

    - Usually it will trigger IDS alerts and is detectable'
