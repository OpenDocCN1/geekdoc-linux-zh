    \  - 示例包括：\n    - 缓冲区溢出\n    - 弱身份验证机制\n    - 数据验证不当\n    - 编写错误\n\n- 漏洞评估\n \
    \ - Nessus 是常用的开源软件\n  - 一些有用的资源：\n    - OVAL - 标准化评估\n    - FrSIRT - 法国安全响应小组\n\
    \    - US-Cert - 美国安全响应小组\n    - AusCert - 澳大利亚安全响应小组\n    - Web 利用程序发布\n\n##\
    \ 步骤 6 - 渗透、访问与破解\n\n- 实际攻击开始\n  - 在此步骤的目标是获取系统最高级别的权限或权利\n  - 使用未发现的技术和方法\n \
    \ - 实现渗透的利用程序包括：\n    - 缓冲区溢出\n    - 栈利用\n    - Web 漏洞\n    - 允许未经验证访问的服务/程序\n\
    \    - SQL 注入\n    - 应用程序错误处理\n    - 直接遍历\n    - 畸形包\n\n- 绕过访问控制\n  - 常见的访问控制类型有哪些？\n\
    \    - 用户名/密码组合\n    - 令牌\n    - 智能卡\n    - 生物识别访问方法\n\n- 密码破解是访问系统的常见手段\n  -\
    \ 社会工程学可欺骗人们提供访问信息\n  - 嗅探器直接从线路中获取密码\n  - 会话劫持可以实现伪装\n  - 应用程序/服务账户\n  - 组成员身份\n\
    \  - 权限配置错误\n\n- 密码破解\n  - 用户名/密码是最不安全的身份验证方法\n  - 用户名很容易被发现（命名规范、邮箱地址等）\n  -\
