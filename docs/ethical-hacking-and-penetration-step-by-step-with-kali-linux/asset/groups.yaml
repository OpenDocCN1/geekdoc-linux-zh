    \    - 伪装成技术支持/帮助台代表\n    - 假装成获得第三方（经理、老板等.）的授权\n    - 翻垃圾桶：从未妥善处理（丢在垃圾桶）的敏感信息中获取信息\n\
    \    - 偷窥：观察他人登录系统并获取详情\n\n- 会话劫持\n    - 这是一种成为中间人并接管会话的技术\n    - 它涉及对计算机之间的会话进行拦截、监控和记录\n\
    \    - 它用于拦截登录凭据\n    - 用于接管服务器与客户端之间的会话，使双方互相伪装成对方\n    - 数据可以被拦截、修改并重新传输到目标主机\n\
    \n- 权限提升\n    - 访问系统通常从普通用户或访客身份开始，需要提升权限才能完成攻击\n    - 示例包括通过缓冲区/栈溢出来实现管理员权限访问\n\
    \    - 使用社会工程学来利用管理员权限（钓鱼、电子邮件、给人打电话告诉他们你来自“帮助台”并索要信息）\n    - 可能是为了使用键盘记录器获取管理员账户和密码\n\
    \    - 可能是为了从基于 Linux 的密码更改盘启动，并将管理员密码置为空或所需的密码（需要对设备进行物理访问）\n\n- 维持和扩大访问权限\n\
    \    - 一旦获得，就必须维持\n    - 必须防止被发现或丢失访问权限\n    - 维持访问权限有几种方法：\n        - Rootkit、操作系统内核漏洞、缓存凭据、防止日志记录等\n\
    \        - 安装木马，通过后门方法保护或继续访问\n        - 创建新账户或提升其他账户的权限\n        - 修改共享和文件的权限\n\
    \        - 启用空会话（Windows 机器）\n\n- 扩大访问权限\n    - 扩大访问权限允许其他主机从已攻黑的主机被入侵\n    -\
    \ 将黑客工具传输到被黑的主机\n    - 使用主机上的内置命令进一步对网络上的其他主机进行取证\n    - 从已攻黑的主机获取其他系统的受保护的密码\n\
    \    - 通过查看 TCP/IP 信息获取其他主机的域服务器、DNS 服务器、DHCP 服务器和其他有用服务\n    - 从被黑的主机枚举整个域\n\n\
    - 系统攻破\n    - 当你的初始目标得 true时，即实现了系统攻破\n        - Root 权限\n        - 数据访问/窃取\n\n\
    - 拒绝服务\n    - Rootkit/文件替换\n    - 文件上传\n    - 结果将留下一扇大门，可能进一步访问其他设备\n\n## 步骤 7\
    \ - 规避防御和擦除痕迹\n\n- 你的操作记录在在哪里？\n    - 日志文件\n    - 文件访问时间\n    - Windows 注册表项\n\
    \    - 留下的黑客工具\n    - 操作系统性能统计数据\n    - IDS\n    - 代理服务器\n    - 防火墙\n\n- 删除文件和其他证据\n\
    \    - 有许多地方你需要查看，以确保你不会留下任何证据\n    - Windows 安全事件日志、网络日志、防火墙和 IDS\n    - 应用日志\n\
    \    - 日志文件通常需要管理员权限，并且会记录删除操作本身\n    - 删除用于黑入机器的工具痕迹\n    - 尽可能避免替换关键系统文件\n \
    \   - 某些文件/日志可能需要随着重启和分页文件自动删除\n\n"
