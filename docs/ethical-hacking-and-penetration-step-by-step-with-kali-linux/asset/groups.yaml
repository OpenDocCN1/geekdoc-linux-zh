    \    - 对病毒/木马/恶意软件的敏感性\n- 多功能利用工具包括：\n  - Nessus\n  - Metasploit Framework\n\n\
    - Web 服务器漏洞\n  - \n  - 由于连接到互联网，风险更高\n  - 可能受到外部防火墙/DMZ 的保护\n  - 由于安全性较差，通常更容易利用\n\
    \  - Web 服务器漏洞的常见示例\n    - 存储在网站代码中的密码\n    - 遍历目录\n    - 执行脚本或程序的能力\n    - 绕过\
