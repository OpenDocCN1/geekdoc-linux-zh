    Passwords Profiler (CUPP) is made to simplify this attack method that is often
    used as last resort in penetration testing and forensic crime investigations.


    Working on a dictionary attack it is important to understand person’s attributes,
    name, birthday, family names, hobbies, etc. Next step is to create a database
    with all those attributes.


    To initiate a dictionary attack:


    +   - Tools like CUPP and Medusa can be used

    - cd /usr/lib/cupp -- The directory might be different based on your version

    - Edit the configuration file based on your requirements'
