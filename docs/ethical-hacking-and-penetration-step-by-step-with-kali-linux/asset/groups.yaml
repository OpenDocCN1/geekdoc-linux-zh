    \ airomon-ng & airodump-ng commands\n    * Find an associated client using airodump-ng\
    \ command\n    * Borrow the MAC address using macchanger\n\n+   Commands for the\
    \ above steps\n    * airomon-ng start wlan0\n    * airodump-ng mon0\n    * iwconfig0\
    \ SSID Sneaky-SSID channel 4 -- To associate with Sneaky-SSID wireless\n    *\
    \ iwconfig wlan0 -- To check if the association is successful, which won't be\
