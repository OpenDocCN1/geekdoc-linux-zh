    * Get approval of collateral parties (ISPs)

    * Put together team and tools and get ready for the tests

    * Define goals (DoS, Penetration, etc.)

    * Set the ground rules (rules of engagement with the customer and team)

    * Set the schedule (non-work hours, weekends?)

    * Notify appropriate parties (Sys admin, Security department, Legal department,
    law enforcement)'
  - "[PAGE 18]\n\n# Types of attacks\n\nThere are number of different attacks that\
    \ can be done on a network or system. The main categories are explained below:\n\
    \n+   * Full penetration\n  * Taking full control of the system and accessing\
    \ the resources and data. This is a very complex and difficult task and requires\
    \ spending a long time investigating the vulnerabilities and ways to access a\
    \ system.\n\n+   * Denial of Service\n  * Interrupting the system’s operation\
    \ and affecting the users. This is usually an easier type of attack which can\
    \ be achieved with spending less time and effort, however; can be a big problem\
    \ in big organizations.\n\n+   * Specific Information\n  * Theft or disclosure\
    \ of the documents or information. This could be accessing documents or penetrating\
    \ a database but usually attacker is looking for some specific information and\
    \ not interested in damaging any system.\n\n+   * Social Engineering\n  * The\
    \ art of manipulating people so they give up confidential information. This is\
    \ perhaps the easiest way of attacking and won’t require any technical knowledge.\
    \ Attacker will usually use the users, administrators or employees to get the\
    \ information out of them and use those information to penetrate the systems."
  - "[PAGE 19]\n\n# Hacking Methodology Overview\n\nThere are number of steps that\
    \ need to be followed to plan and implement penetration project. We will explain\
    \ each one in detail later in this book, however; summary of steps can be found\
    \ below.\n\n+   Formal Methodology\n  - A good methodology provides structured\
    \ framework for testing and procedure. Below are some notes which can be useful\
    \ to implement your methodology.\n    - Ensures you do not overlook venues of\
    \ attack and possible vulnerabilities\n    - Provides a comprehensive testing\
    \ plan. You can use the below standards:\n      - OSSTMM - Open Source Security\
    \ Testing Methodology Manual\n        - A widely used, peer-reviewed, methodology\
    \ for performing security tests\n      - NIST SP 800-42\n        - Technical Guide\
    \ to Information Security Testing and Assessment\n      - TRAWG\n        - TRAWG\
    \ stands for Threat and Risk Assessment Working Guide\n      - OCTAVE\n      \
    \  - Operationally Critical Threat, Asset, and Vulnerability Evaluation\n\n+ \
    \  Reconnaissance\n  - This is the first step in penetration testing. The point\
    \ is to gather as much as information about the Target Company, network, infrastructure\
    \ or personnel as possible. There are two different types of gathering information;\
    \ active (calling, talking, visiting, etc.) and passive (finding information"
- md: "\non websites, jobs advertisement, etc.)\n\n- * Scanning\n  On this step networks\
    \ are scanned to determine which hosts are live on network and what they do. There\
    \ are multiple types of scans and tools available. Most popular ones are Nmap\
    \ and Supercan.\n  The scans can easily be picked up by Intrusion Detection Systems,\
    \ although; there are ways to avoid this with specific scans.\n\n- * Service Enumeration\
    \ (Fingerprinting)\n  This step follows the scanning step after determining which\
    \ hosts are live. Tools will be used to discover what hosts are running to determine\
    \ vulnerabilities. Fingerprinting tools are often combined with scanners and we\
    \ can get both reports at once.\n\n- * Vulnerability Assessment\n  This step will\
    \ be used to determine what vulnerabilities exist with an app or a service on\
    \ a tool. In this step known vulnerability databases and compare the responses\
    \ from the target device with the database to find a match. The Targets are all\
    \ popular Operating Systems and applications.\n  Nus is the most popular assessment\
    \ tool in this category which is an open source with a free edition.\n\n- * Vulnerability\
    \ Exploitation\n  At this stage vulnerabilities discovered in previous steps are\
    \ exploited with known exploits or by developing new ones. Vulnerabilities are\
    \ exploited to penetrate and gain access to systems.\n\n- * Penetration and Access\n\
    \  This is the stage where hacking actually occurs. All previous stages are planning\
    \ only and we will try to take control of the target at this step. Systems are\
    \ penetrated based upon exploited vulnerabilities identified in previous steps.\n\
    \  Access to systems at various levels is attempted and tested. Metasploit framework\
    \ is a popular tool in this category which will be explained later in this book.\n\
    \n- * Privilege Escalation and Owning the Box\n  The Goal at this stage is administrative\
    \ access or access privilege information. Hacker may start as guest level of access\
    \ or normal user and uses exploits to increase the privilege levels. Remember\
    \ Owning the box = Full Control\n\n- * Evading Defences and Erasing Tracks\n \
    \ Hackers must evade defences like IDS, FW, IPS to penetrate and access the systems.\
    \ They must avoid detection or penetration will be short-lived. Remember, most\
    \ of the medium and large size organizations have detection mechanisms in place.\
    \ Erasing tracks, deleting log files, resetting permissions, hiding hacker tools\
    \ on system with rootkits are some of the common steps in this category.\n\n-\
    \ * Maintaining and Expanding Access\n  Once penetration is complete, access must\
    \ be maintained and expanded. Rootkits often used to keep access, hide the running\
    \ processes and tools, along with backdoor accounts. Access can be expanded to\
    \ increase target and further penetration into network.\n\n# Step 1 - Reconnaissance\n\
    \n- * Passive Reconnaissance\n  - This step is used to gather information about\
    \ a company, network, or other target with using any intrusive means\n  - It is\
    \ very difficult to detect/defend against the target company\n  - Most of these\
    \ information are publicly available on web, newspapers, advertisements, brochures,\
    \ etc.\n  - You can use resources like company websites, Exchange commission,\
    \ better business bureau, literature, job site posting (e.g. if Nortel skills\
    \ will require you know they have Nortel equipment), partner sites, etc.\n  -\
    \ Information can include name of company officers, addresses of major locations\
    \ (data centres), partner network and connections, types of systems used (FW,\
    \ IDS, etc.), IP address space, domain names, etc.\n  - Gathering Information\
    \ with Whois and other Tools\n    - Name of administrators, IP address space,\
    \ location, Email addresses, phone number, etc.\n  - Other tools include Sam Spade\
    \ and web based tools are also available\n  - One popular tool is Maltego on Kali\
    \ Linux which will be explained later in this book\n\n- * Active Reconnaissance\n\
    \  - At this stage hacker uses more intrusive methods to gather information and\
    \ actively touches target sites and networks as a normal user\n  - It does not\
    \ involve a hacking system\n  - May involve personal contact or site visits\n\
    \  - Some Tools and Methods:\n    - Banner Grabbing - Telnet/SSH to devices and\
    \ read the banner to identify what it is\n    - Mail Bouncing - Send an email\
    \ to wrong email address to check the bounce message and identify the mail servers\n\
    \    - DNS Zone Transfers - To get a list of all the available servers and hosts\n\
    \    - View company’s public web site source code and directory structure - To\
    \ identify the type of possible CMS they are using\n    - Social Engineering -\
    \ e.g. Find out where Sysadmin goes after work and with him, socialize and make\
    \ friend and get the information out of him!\n    - Shoulderer Surfing - Stand\
    \ on someone’s shoulder, watch and gather information like passwords, codes, etc.\n\
    \    - Dumpster Diving - This is mainly done by local people who stole information\n\
    \    - Piggybacking/Site Visits – E.g. Following people, visiting sites and bypassing\
    \ security.\n    - Putting it all together\n      - Use reconnaissance techniques\
    \ to footprint and organization’s structure and network\n      - Gather publicly\
    \ available or easily obtained info about target organization\n      - Use this\
    \ info to determine weaknesses and organization boundaries\n      - Examples include\
    \ names, addresses, titles, phone numbers or company personnel\n      - IP address\
    \ range and domain structure (e.g. using BGP or Lookups)\n      - Infrastructure\
    \ layout and software used\n      - Document all the findings in this step and\
    \ put them together\n      - The information gained at this step serves as starting\
    \ point for next steps\n\n# Step 2 - Scanning\n\n- Scanning live hosts\n  - This\
    \ step is looking for live hosts on the network that their services may be later\
    \ enumerated\n  - It can be intrusive and maybe detected by IDS\n  - Maybe illegal\
    \ in some places and need the pre-approval. You need to check before doing this\
    \ in production\n  - Usually identified by system administrators and will be logged\
    \ on logging servers Methods exist to reduce visibility of scan - e.g. delayed\
    \ scans or FIN, Null or Xmas\n  - Uses tools known as Supercan, nmap.\n- TCP Connection\n\
    \  - TCP and UDP are most common on the networks. You need to understand how TCP\
    \ works to be able to use\n  - TCP includes 6 flags that are set: initial (syn),\
    \ acknowledgement (ack), finish (fin), urgent (urg), push (psh) or reset (rst)\n\
    \  - TCP handshake includes the below steps:\n    - Syn (source to dest) -> syn-ack\
    \ (dest to source) -> ack (source to dest)\n  - Many attacks use non-standard\
    \ combinations of these flags (malformed packets) to elicit response from host\n\
    \  - Syn flood: It is a Dos attack where source computer sends only syn packets.\
    \ As a result there will be a lot of open sessions on the victim machine and it\
    \ will be overloaded.\n- Scan Types\n  - Full scan: completes all 3 parts of the\
    \ handshake. This is the most reliable scan but very noisy and can be easily detected.\n\
    \  - Half open (syn) scan: only uses first part (syn) of the handshake; won't\
    \ send the third part (ack) back. This also can be picked by IDS systems.\n  -\
    \ Stealth Scan: Varies time and frequency of scan to avoid detection by IDS. This\
    \ is not a full connect scan\n  - Xmas Scan: malformed packet that sets fin, urg,\
    \ and push flags; This is used to bypass firewalls\n  - Ack Scan: Sending only\
    \ an ack packet; receiving end won't know how to respond as there was no handshake;\
    \ causes open ports to return a reset\n  - FIN Scan: Sending a packet with fin\
    \ flag set; This can usually bypass the IDS systems\n  - Null Scan: Sending a\
    \ packet with no flag set; This can also bypass the IDS systems in most cases\n\
    \n- UDP Scanning\n- Unlike TCP, UDP protocol doesn't have too many controls and\
    \ handshakes. The process of UDP stream is much simpler.\n- Source device will\
    \ send a UDP request and the destination will respond.\n- UDP scanning scans only\
    \ for UDP packets\n- It is less reliable than TCP scanning\n- Maybe of limited\
    \ value, since UDP or ICMP may be blocked at firewall\n\n- ICMP Scanning\n- ICMP\
    \ is the most common protocol to\n- Ping scanning is the most common way of scanning\n\
    - Live hosts may respond to ICMP Type 0 or 8\n- Most network scanners include\
    \ ping scans\n- Usually it will trigger IDS alerts and is detectable\n"
  mdcn: "\n\n（在网站、招聘广告等）\n\n- * 扫描 (Scanning)\n  在这一步骤中，对网络进行扫描以确定哪些主机是活跃的以及它们的功能。有多种类型的扫描和工具可用。最流行的是\
    \ Nmap 和 Supercan。\n  扫描很容易被入侵检测系统（IDS）检测到，尽管可以通过特定的扫描方式来避免这种情况。\n\n- * 服务枚举（指纹识别）（Service\
    \ Enumeration / Fingerprinting）\n  此步骤在确定哪些主机在线后遵循扫描步骤。将使用工具发现哪些主机正在运行以确定漏洞。指纹识别工具通常与扫描器结合，我们可以同时获得两种报告。\n\
    \n- * 漏洞评估 (Vulnerability Assessment)\n  此步骤用于确定工具上的应用程序或服务存在哪些漏洞。在此步骤中，利用已知的漏洞数据库，并将目标设备的响应与数据库进行对比以寻找匹配项。目标涵盖了所有流行的操作系统和应用程序。\n\
    \  Nus 是该类别中最流行的评估工具，它是开源的并提供免费版本。\n\n- * 漏洞利用 (Vulnerability Exploitation)\n\
    \  在此阶段，将利用已知漏洞或开发新漏洞来利用之前步骤中发现的漏洞。利用漏洞渗透并获取系统的访问。\n\n- * 渗透与访问 (Penetration and\
    \ Access)\n  这是实际发生攻击的阶段。之前的所有阶段都只是规划，我们将在此步骤中尝试控制目标。根据之前步骤识别出的被利用漏洞对系统进行渗透。\n\
    \  尝试并测试对各个级别系统的访问。Metasploit 框架是该类别中流行的工具，将在本书后后部分进行介绍。\n\n- * 权限提升与控制主机 (Privilege\
    \ Escalation and Owning the Box)\n  此阶段的目标是获取管理员权限或访问权限信息。黑客可能从访客级或普通用户身份开始，利用漏洞提高权限级别。记住：控制主机\
    \ = 完全控制权。\n\n- * 规避防御与擦除足迹 (Evading Defences and Erasing Tracks)\n  黑客必须规避 IDS、FW（防火墙）、IPS\
    \ 等防御以渗透并访问系统。他们必须避免被发现，否则渗透将是短暂的。记住，大多数中大型组织都设有检测机制。擦除足迹、删除日志文件、重置权限、使用 rootkit\
    \ 在系统上隐藏黑客工具都是该类别中的常见步骤。\n\n- * 维持并扩大访问 (Maintaining and Expanding Access)\n \
    \ 一旦渗透完成，必须维持并扩大访问。Rootkit 通常用于保持访问、隐藏运行的进程和工具，以及后门账户。访问可以扩大以增加目标并进一步渗透网络。\n\n\
    # 第 1 步 - 侦察 (Step 1 - Reconnaissance)\n\n- * 被动侦察 (Passive Reconnaissance)\n\
    \  - 此步骤用于在不使用任何入侵手段的情况下收集有关公司、网络或其他目标的信息。\n  - 很难被目标公司检测或防御。\n  - 大多数此类信息可以在网页、报纸、广告、手册等上公开获取。\n\
    \  - 你可以使用如公司网站、证券委员会（Exchange commission）、美国商业改进局、文献、招聘网站公告（例如，如果需要 Nortel 技能，你就会知道他们有\
    \ Nortel 设备）、合作伙伴网站等资源。\n  - 信息可以包括公司人员姓名、主要位置（数据中心）地址、合作伙伴网络和连接、使用的系统类型（FW、IDS\
    \ 等）、IP 地址空间、域名等。\n  - 使用 Whois 和其他工具收集信息\n    - 管理员姓名、IP 地址空间、位置、电子邮件地址、电话号码等。\n\
    \  - 其他工具包括 Sam Spade，也有基于 Web 的工具可用\n  - 一个流行的工具是 Kali Linux 上的 Maltego，将在本书后后部分介绍\n\
    \n- * 主动侦察 (Active Reconnaissance)\n  - 在此阶段，黑客使用更具入侵性的方法收集信息，并像普通用户一样主动接触目标站点和网络。\n\
    \  - 它不涉及攻击系统。\n  - 可能涉及个人接触或实地访问。\n  - 某些工具和方法：\n    - 标志抓取 (Banner Grabbing)\
    \ - 通过 Telnet/SSH 连接设备并读取 banner 以识别其身份。\n    - 邮件退回 (Mail Bouncing) - 向错误的邮件地址发送邮件以检查退信信息并识别邮件服务器。\n\
    \    - DNS 区域传输 (DNS Zone Transfers) - 获取所有可用服务器和主机列表。\n    - 查看公司的公共网站源码和目录结构\
    \ - 以识别他们可能使用的 CMS（内容管理系统）类型。\n    - 社会工程 (Social Engineering) - 例如，发现系统管理员下班后去哪里，和他在一起社交、交朋友并从他那里套取信息！\n\
    \    - 窥视 (Shoulderer Surfing) - 站在某人身后，观察并收集密码、代码等信息。\n    - 翻垃圾桶 (Dumpster Diving)\
    \ - 这主要是由窃取信息的当地人员完成的。\n    - 尾随/实地访问 (Piggybacking/Site Visits) - 例如，跟随他人、访问站点并绕过安全检查。\n\
    \    - 汇总归纳\n      - 使用侦察技术对组织的结构和网络进行指纹识别。\n      - 收集关于目标组织的公开或易获取信息。\n    \
    \  - 使用这些信息确定弱点和组织边界。\n      - 示例包括姓名、地址、职位、电话号码或公司人员。\n      - IP 地址范围和域名结构（例如使用\
    \ BGP 或 Lookup）。\n      - 基础设施布局和使用的软件。\n      - 记录此步骤中的所有发现并将它们整合。\n      - 此步骤获得的信息将作为后续步骤的起点。\n\
    \n# 第 2 步 - 扫描 (Step 2 - Scanning)\n\n- 扫描活跃主机\n  - 此步骤是在寻找网络上的活跃主机，稍后可能对它们的服务进行枚举。\n\
    \  - 它具有入侵性，并可能被 IDS 检测。\n  - 在某些地方可能是非法的，需要预先批准。在生产环境中执行此操作之前你需要检查。\n  - 通常由系统管理员识别并记录在日志服务器上。存在减少扫描可见性的方法\
    \ - 例如延迟扫描或使用 FIN、Null 或 Xmas 扫描。\n  - 使用名为 Supercan、nmap 的工具。\n- TCP 连接\n  -\
    \ TCP 和 UDP 是网络中最常见的。你需要了解 TCP 的工作原理才能使用。\n  - TCP 包含 6 个标志位：初始（syn）、确认（ack）、完成（fin）、紧急（urg）、推送（psh）或重置（rst）。\n\
    \  - TCP 握手包括以下步骤：\n    - Syn（从源到目的）-> Syn-ack（从目的到源）-> Ack（从源到目的）\n  - 攻击使用非标准的标志位组合（畸形数据包）来诱导响应。\n\
    \  - SYN 洪水 (Syn flood) - 是一种拒绝服务攻击，源计算机仅发送 syn 包。会导致受害者机器产生大量的会话并过载。\n- 扫描类型\n\
    \  - 全连接扫描 (Full scan) - 完成握手的所有三个部分。这是最可靠的扫描，但噪音大且容易被检测。\n  - 半开放扫描 (Half open\
    \ / syn scan) - 仅使用握手的第一个部分（syn）；不发送第三部分（ack）。这也可以被 IDS 系统检测。\n  - 隐身扫描 (Stealth\
    \ Scan) - 改变扫描时间和频率以避免被检测。这不是全连接扫描。\n  - Xmas 扫描 (Xmas Scan) - 设置了 fin、urg 和 push\
    \ 标志的畸形包；用于绕过防火墙。\n  - Ack 扫描 (Ack Scan) - 仅发送 ack 包；由于没有握手，接收端不知道如何响应；会导致开启端口返回重置。\n\
    \  - FIN 扫描 (FIN Scan) - 发送带有 fin 标志的数据；这通常可以绕过 IDS。\n  - 空扫描 (Null Scan) - 发送未设置任何标志的数据；在大多数情况下也可以绕过\
    \ IDS。\n\n- UDP 扫描\n  - 与 TCP 不同，UDP 协议没有大量的控制和握手。UDP 流的过程要简单得多。\n  - 源设备发送 UDP\
    \ 请求，目标做出响应。\n  - UDP 扫描仅扫描 UDP 包。\n  - 它不如 TCP 扫描可靠。\n  - 价值有限，因为 UDP 或 ICMP\
    \ 可能被防火墙拦截。\n\n- ICMP 扫描\n  - ICMP 是最常用的协议。\n  - Ping 扫描是最常见的扫描方式。\n  - 活跃主机可能会响应\
    \ ICMP 类型 0 或 8。\n  - 大多数扫描器都包含 ping 扫描。\n  - 通常会触发 IDS 警报并是可以被检测的。\n\n"
