    \      - /smbdumpers -I 192.168.1.130 -v\n    - （在 Windows 上）\n      - nbtstat\
    \ -a 192.168.1.130\n- 活动目录提取\n  - 使用 LDAP 协议\n  - Ldp.exe 是一个简单的 LDAP 客户端\n  -\
    \ 使用 Guest 或没有任何权限进行身份验证\n\n## 步骤 5 - 漏洞评估\n\n- 操作系统漏洞\n  - 注意记住，所有的操作系统都有漏洞（而不只是\
