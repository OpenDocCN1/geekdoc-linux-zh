    # ### Neighbor Unreachability Detection


    NDP is able to determine the reachability of a neighbor by examining clues from
    upper-layer protocols (for example, received TCP acknowledgments, or by actively
    performing address resolution (via ICMPv6) when certain thresholds are reached.


    # ### Duplicate Address Detection


    When a host first joins a link, it multicasts neighbor solicitations for its own
    IPv6 address for a short period before attempting to use that address to communicate.
    If it receives a neighbor advertisement in response, the host realizes that another
    neighbor on the link is already using that address. The host will mark the address
    as a duplicate and will not use it on the link.'
  - '[PAGE 123]


    Note that this process is similar to IPv4 gratuitous ARP requests, but NDP elegantly
    allows for detection of two hosts with the same address before both hosts are
    actively sending traffic from the address.


    # Redirection


    A fifth type of ICMPv6 message, the Redirect (type 137), is used by routers to
    either point hosts toward a more preferable router, or to indicate that the destination
    actually resides on link. ICMPv4 provides the same capability with its own redirect
    message.


    ![](img/c6b688dca6570d17db3036b560ef0905_123_0.png)'
  - '[PAGE 124]


    # MITM attack on IPv6 with Parasite 6


    ![](img/c6b688dca6570d17db3036b560ef0905_124_0.png)


    We have shown you how to launch a MITM attack on IPv4 before. It is not more complicated
    to initiate a MITM attack in an IPv6 environment.


    IPv6 Neighbor Discovery (ND) is a set of messages and processes that determine
    relationships between neighboring nodes. ND replaces Address Resolution Protocol
    (ARP), Internet Control Message Protocol (ICMP) Router Discovery, and ICMP Redirect,
    which are used in IPv4, and provides additional functionality. ND is described
    in RFC 2461, "Neighbor Discovery for IP Version 6 (IPv6)."


    ND is used by hosts to:


    +   * Discover neighboring routers.

    * Discover addresses, address prefixes, and other configuration parameters.


    ND is used by routers to:


    +   * Advertise their presence, host configuration parameters, and on-link prefixes.

    * Inform hosts of a better next-hop address to forward packets by a specific destination.


    Neighbor discovery operation in IPv6 can be used to initiate a MITM attack. Below
    steps using Parasite 6 will show how to launch an MITM'
