  mdcn: "\n\n# 警告\n\n你在书中学到的技术并非用于在任何生产环境中出于滥用之目的。在没有获得任何组织管理团队正式许可的情况下，使用这些技术是非法的。\n\
    \n其主要目的和目标是在与客户签订特定协议的情况下，作为一名道德黑客（Ethical hacker），通过这些测试来维护技术环境的安全。\n\n在没有书面授权的情况下请勿使用这些技术。这是违法的，并且可能会让你陷入麻烦。\n\
    \n## 什么是道德黑客？\n\n道德黑客是一种发现网络和系统漏洞并建议如何保护它们的技术。你在书中学到的技术纯粹是白帽攻击技术，旨在发现网络和系统中的漏洞和风险。\n\
    \n在没有获得管理团队正式批准的情况下，不得在任何生产网络上使用这些技术。未经批准而使用这些技术可能是非法的，并对他人的财产造成严重损害。\n\n## 道德黑客的类型\n\
    \n道德黑客有多种类型，通常可以分类为以下几类：\n\n- 白盒（White box）\n  - 当我们对网络以及网络上的系统完全了解时。攻击者可以是老员工、亲属、供应商或承包商，他们对目标公司使用的基础设施、软件和硬件有全面的理解。\n\
    - 黑盒（Black box）\n  - 当我们对基础设施一无所知，并在没有任何信息的情况下尝试渗透时。在这种类型的攻击中，通常攻击的第一步是收集足够关于公司、基础设施和系统的信息。一旦获取了所有所需信息，下一步就是寻找漏洞并尝试利用它们。\n\
    - 漏洞评估（Vulnerability assessment）\n  - 这纯粹是对网络上的漏洞进行评估和分析。这通常是一项安全的工作，不会对运行产生任何影响。大多数情况下，此类别的技术是非法的，但在执行之前告知相关人员总是安全的，因为可能会出现一些复杂情况。\n\
    - 渗透测试（Penetration testing）\n  - 这是一种尝试获取系统或设备控制权的攻击类型。使用此类技术存在对设备或网络运行产生中断的潜在风险。在没有获得目标公司正式批准和承诺的情况下使用这些技术是非法的。\n\
    \n## 道德黑客的责任是什么？\n\n作为一名道德黑客，你对如何使用你的知识和技术有明确的责任。理解对道德黑客的期望是什么，以及在评估客户组织的安全性时应该考虑什么，也非常重要。\n\
    \n以下是你作为道德黑客必须考虑的几件重要事项：\n\n- 必须仅将你的知识和工具用于合法目的\n- 仅为了识别安全问题并以防御目标进行攻击\n- 在开始任何测试之前始终寻求管理层的批准\n\
    - 创建具有精确参数和目标的测试计划，并获得管理对该计划的批准\n- 不要忘记，你的工作是帮助加强网络，仅此而已！\n\n## 客户的期望是什么？\n\n\
    在开始任何工作之前，理解客户的期望非常重要。由于这项工作的性质（道德黑客）具有高风险并需要大量的注意力；如果你对他们的需求和期望没有清晰的理解，最终结果可能不是他们想要的，你的时间和精力将白白。如果你不遵守规则并满足客户的期望，这可能导致一些法律影响。\n\
    \n以下是你应该注意的一些重要事项：\n\n- 你应该与客户合作定义目标和期望\n- 不要通过你可能发现的问题让他们感到惊奇或尴尬\n- 始终保持结果和信息的机密\n\
    - 公司通常拥有结果数据，而不是你\n- 客户期望对问题和修复进行完全披露\n\n## 黑客所需的技能有哪些？\n\n要成为一名道德黑客，你应该对对一系列设备和系统有广泛的知识。理想情况下，你应该拥有\
    \ IT 行业的多年经验，并熟悉不同的硬件、软件和网络技术。\n\n成为道德黑客所需的某些重要技能如下：\n\n- 应该已经是其他领域（边界安全等）的安全专家\n\
    - 应该已经具有网络或系统管理员的经验\n- 具有各种操作系统的经验，如 Windows、Linux、Unix 等\n- 关于 TCP/IP 的广泛知识 -\
    \ 端口、协议、层次\n- 关于安全、漏洞以及如何纠正它们的常识\n- 必须熟悉黑客工具和技术（我们将在书中涵盖这些内容）\n\n## 你需要了解的相关法律\n\
    \n我们不会在书中讨论这些法律，但如果你在网上查找这些法律并理解其要求和基础总是一个好主意。每个国家可能有其特定的特定法律，可能与其他国家不同。美国有一些重要的法律是：\n\
    \n- Title 18 USC 1029\n  - 与接入设备相关的欺诈及相关活动\n- Title 18 USC 1030\n  - 与计算机相关的欺诈及相关活动\n\
    - Title 18 USC 3121-27\n  - 对拨号记录器和追踪设备使用的通用禁止；例外\n- Title 18 USC 2510-22\n  -\
    \ 线路和电子通信截获以及口头通信截获\n- 其他法规\n- 查看法律的良好参考：\n  - http://www.law.cornell.edu/uscode/text\n\
    \n## 如何准备渗透测试\n\n一旦你想开始一个渗透项目，就有许多事情需要考虑。记住，在不遵循正确步骤、不获得批准并与客户达成协议的情况下，使用这些技术是非法的，也是违背法律的。\n\
    \n在开始之前需要考虑的重要事项：\n\n- 从客户处获得所有测试的签署批准\n- 你需要签署保密协议（NDA）\n- 获取相关方（ISP）的批准\n- 组建团队和工具并准备好测试\n\
    - 定义目标（DoS、渗透等）\n- 设定基本规则（与客户和团队的交互规则）\n- 设定时间表（非工作时间、周末？）\n- 通知相关方（系统管理员、安全部门、法务部门、执法部门）\n\
    \n## 攻击类型\n\n可以在网络或系统上进行许多种不同的攻击。主要类别解释如下：\n\n- 全渗透\n  - 获取系统的完全控制权并访问资源和数据。这是一项非常复杂和困难的任务，需要花长时间研究漏洞和访问系统的方法。\n\
    - 拒绝服务（Denial of Service）\n  - 中断系统的运行并影响用户。这通常是一种更容易攻击类型，花费较少的时间精力即可实现；但在大型组织中可能是一个大问题。\n\
    - 特定信息\n  - 窃取或披露文档或信息。这可能是访问文档或渗透数据库，通常攻击者正在寻找某些特定信息，而不对破坏任何系统感兴趣。\n- 社会工程学（Social\
    \ Engineering）\n  - 操纵人类交出机密的艺术。这可能是最简单的攻击方式，不需要任何技术知识。攻击者通常会利用用户、管理员或员工从他们那里获取信息并利用这些信息渗透系统。\n\
    \n## 攻击方法论概述\n\n计划和实施渗透项目需要遵循许多步骤。我们将在书后的部分详细解释每一步；然而，步骤摘要可以在下方找到。\n\n- 正式方法论\n\
    \  - 一个良好的方法论为测试和程序提供了结构化的框架。以下是对实施你的方法论有用的笔记：\n    - 确保你没有忽略攻击途径和可能的漏洞\n    -\
    \ 提供全面的测试计划。你可以使用以下标准：\n      - OSSTMM - 开源安全测试方法手册\n        - 一种广泛使用的、经过同行评审的执行安全测试的方法\n\
    \      - NIST SP 800-42\n        - 信息安全测试和评估的技术指南\n      - TRAWG\n        - TRAWG\
    \ 代表威胁和风险评估工作指南\n      - OCTAVE\n        - 运行关键威胁、资产和漏洞评估\n\n- 侦察（Reconnaissance）\n\
    \  - 这是渗透测试的第一步。重点是尽可能多地收集目标公司、网络、基础设施或人员的信息。收集信息有两种不同的类型；主动（电话、交谈、访问等）和被动（寻找信息\n\
    \n"
