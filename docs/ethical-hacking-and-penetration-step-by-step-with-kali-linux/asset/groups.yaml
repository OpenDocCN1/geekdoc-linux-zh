  - '[PAGE 33]


    +   * There are several ways to crack a password:

    * Brute Force Attack

    * Dictionary Attack

    * Hybrid Attack

    * Sniffing wire - Plaintext or encrypted hashes

    * Some good applications at www.oxid.it


    +   * Social Engineering

    * Social engineering is the art of manipulating people to get information from
    them or persuade them to do your will

    * Can occur in person, over phone, over email or chat

    * It is a very low-technology method

    * Usually employed to get information like user id, pass, domain, server address,
    etc.

    * Can be used by person to perform action (unlock door, allow physical access
    of unauthorized person, reset password, etc.)

    * Methods include:

    ○ Posing as important user and using pressure to get information

    ○ Posing as tech support/helpdesk representative

    ○ Pretending to be authorize by a third party (manager, boss, etc.)

    ○ Dumpster diving: Getting information from sensitive information not properly
    disposed of -thrown in the trash

    ○ Shoulder surfing: Observing another person login to system and get the details


    +   * Session Hijacking

    * This is the technique of becoming Man-in-the-middle and taking over the session

    * It involves intercepting, monitoring, and recording session between computers

    * It is used to intercept login credentials

    * Used to take over session between server and client, impersonating each to the
    other

    * Data can be intercepted, modified and retransmitted to destination host


    +   * Privilege Escalation'
  - "[PAGE 34]\n\n+   - Access to a system normally starts as normal user or guest\
