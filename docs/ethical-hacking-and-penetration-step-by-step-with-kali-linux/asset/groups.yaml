- md: "\nHTTP messages are automatically forwarded without requiring user intervention.\
    \ You can do this using the master interception toggle, in the Intercept tab.\n\
    \n## Using the Proxy History\n\nBurp maintains a full history of all requests\
    \ and responses that have passed through the Proxy. This enables you to review\
    \ the browser-server conversation to understand how the application functions,\
    \ or carry out key testing tasks. Sometimes you may want to completely disable\
    \ interception in the Intercept tab, and freely browse a part of the application's\
    \ functionality, before carefully reviewing the resulting requests and responses\
    \ in the Proxy history.\n\nBurp provides the following functions to help you analyse\
    \ the Proxy history:\n\n- The history table can be sorted by clicking on any column\
    \ header (clicking a header through ascending sort, descending sort, and unsorted).\
    \ This lets quickly group similar items and identify any anomalous items.\n- You\
    \ can use the display filter to hide items with various characteristics.\n- You\
    \ can annotate items with highlights and comments, to describe their purpose or\
    \ identify interesting items to come back to later.\n- You can open additional\
    \ views of the history using the context menu, to apply different filters or help\
    \ test access controls.\n\n## Driving Your Testing Workflow\n\nA key part of Burp's\
    \ user-driven workflow is the ability to send interesting items between Burp tools\
    \ to carry out different tasks. For example, having observed an interesting request\
    \ in the Proxy, you might:\n\n- Quickly perform a vulnerability scan of just that\
    \ request, using Burp Scanner.\n- Send the request to Repeater to manually modify\
    \ the request and reissue it over and over.\n- Send the request to Intruder to\
    \ perform various types of automated customized attacks.\n- Send the request to\
    \ Sequencer to analyse the quality of randomness in a token returned in the response.\n\
    \nYou can perform all these actions and various other using the context menus\
    \ that appear in both the Intercept tab and the Proxy history.\n\n## Key Configuration\
    \ Options\n\nFor more specialized testing tasks, or when working with unusual\
    \ applications, you may need to modify some of Burp Proxy's numerous options:\n\
    \n- You might need to modify the Proxy listener, to bind to different interfaces,\
    \ handle server SSL certificates differently, or support invisible proxying for\
    \ non-proxy-aware clients.\n- You can configure the Proxy to automatically modify\
    \ HTTP responses in various systematic ways; for example, to unhide hidden form\
    \ fields, remove JavaScript form validation, etc.\n- You can configure match /\
    \ replace rules to automatically change the content of requests and responses.\n\
    \n## Using Burp Suite\n\nThe sections below describe the essentials of how to\
    \ use Burp Suite within your web application testing.\n\n**Note:** Before starting\
    \ to use Burp, you first need to get Burp running, configure display settings,\
    \ configure your browser and Burp to work together, and ideally install Burp's\
    \ SSL CA certificate in your browser.\n\n## Testing Workflow\n\nBurp is designed\
    \ to support the activities of a hands-on web application tester. It lets you\
    \ combine manual and automated techniques effectively, gives you complete control\
    \ over all of the actions that Burp performs, and provides detailed information\
    \ and analysis about the applications you are testing.\n\nSome users may not wish\
    \ to use Burp in this way, and only want to perform a quick and easy vulnerability\
    \ scan of their application.\n\nThe diagram below is a high-level overview of\
    \ the key parts of Burp's user-driven workflow. Click on each area of the diagram\
    \ for more detail:\n\n![](img/c6b688dca6570d17db3036b560ef0905_107_0.png)\n\n\
    ## Recon and Analysis\n\nThe Proxy tool lies at the heart of Burp's workflow.\
    \ It lets you use your browser to navigate the application, while Burp captures\
    \ all relevant information and lets you easily initiate further actions. In a\
    \ typical test, the recon and analysis phase involves the following tasks:\n\n\
    - Manually map the application - Using your browser working through Burp Proxy\n\
    \nNote before performing any automated actions, it may be necessary to update\
    \ various aspects of Burp's configuration, such as target scope and session handling.\n\
    \n- **Analyze the application's attack surface** - The process of mapping the\
    \ application populates the Proxy history and Target site map with all of the\
    \ information that Burp has captured about the application. Both of these repositories\
    \ contain features to help you analyse the information they contain, and assess\
    \ the attack surface that the application exposes. Further, you can use Burp's\
    \ Target Analyser to report the extent of the attack surface and the different\
    \ types of URLs the application uses.\n\n## Tool Configuration\n\nBurp contains\
    \ a wealth of configuration options, which it is often necessary to use at different\
    \ stages of your testing, to ensure that Burp works with your target application\
    \ in the way you require. For example:\n\n- Display - You can configure the font\
    \ and character set used to display HTTP messages, and also the font in Burp's\
    \ own UI.\n- Target scope - The Target scope configuration tells Burp the items\
    \ that you are testing.\n- Authentication - If the application requires authentication,\
    \ you can configure Burp to handle it.\n- Session handling - Many applications\
    \ use session tokens, which Burp can help manage.\n- Saving and restoring state\
    \ - You can save your state and restore it later.\n- Task scheduling - You can\
    \ configure Burp to schedule tasks at intervals.\n\n## Vulnerability Detection\
    \ and Exploitation\n\nAfter completing your recon and analysis of the application,\
    \ you can begin probing for vulnerabilities. It is often most effective to use\
    \ several tools at once. Throughout Burp, you can use the context menu to perform\
    \ actions.\n\nIn Burp's default configuration, it automatically performs passive\
    \ scanning of all requests that pass through the Proxy. Before you begin actively\
    \ probing the application, you might find that Scanner has already recorded some\
    \ findings that warrant closer investigation.\n\nBurp's tools can be used in numerous\
    \ different ways to support the process of actively testing. Some examples are\
    \ described below for different types of issues:\n\n- Input-based bugs - For issues\
    \ like SQL injection, cross-site scripting, and file path traversal, you can use\
    \ Burp in various ways:\n  - You can perform active scans using Burp Scanner.\
    \ You can select items anywhere in Burp, and initiate scans using the context\
    \ menu. Or you can configure Burp to do live scanning of all in-scope requests\
    \ passing through the Proxy.\n  - You can use Burp Intruder to perform fuzzing,\
    \ using your own test strings.\n  - You can send individual requests to Burp Repeater,\
    \ to manually modify and reissue the request and over.\n  - Having identified\
    \ some types of bugs, you can actively exploit these using Burp Intruder. For\
    \ example, you can often use recursive payloads to exploit SQL injection vulnerabilities.\n\
    - Logic and design flaws - For issues unsafe use of client-side controls, failure\
    \ to enforce account lockout, and the ability to skip key steps in multi-stage\
    \ processes, you generally need to work manually:\n  - Typically, a close review\
    \ of the Proxy history will identify the relevant requests that need to be investigated.\n\
    \  - You can probe the application's handling of unexpected requests by issuing\
    \ these individually using Burp Repeater, or by turning on Proxy intercept and\
    \ manually changing requests on the fly using your browser.\n  - You can actively\
    \ exploit many logic and design flaws using Burp Intruder. For example, Intruder\
    \ can be used to enumerate valid usernames, guess passwords, cycle through predictable\
    \ session tokens or password recovery tokens.\n"
  mdcn: "\n\nHTTP 消息会自动转发，无需用户干预。你可以使用 Intercept（拦截）选项卡中的主拦截开关来执行此操作。\n\n## 使用代理历史\
    \ (Proxy History)\n\nBurp 会维护所有通过代理的请求和响应的完整历史。这允许你审查浏览器与服务器之间的对话，以理解应用程序的工作原理，或执行关键测试任务。有时，你可能希望在\
    \ Intercept 选项卡中完全禁用拦截，自由地浏览应用程序的部分功能，然后再仔细审查代理历史中生成的请求和响应。\n\nBurp 提供了以下功能来帮助你分析代理历史：\n\
    \n- 可以通过点击任何列标题对历史表进行排序（点击表头可进行升序、降序和无排序）。这让你能够对相似项目快速分组，并识别任何异常项目。\n- 你可以使用显示过滤器（display\
    \ filter）来隐藏具有各种特征的项。\n- 你可以对项目进行高亮显示和注释，以描述其用途或标记以后以后回来看的感兴趣的项目。\n- 你可以使用右键菜单打开历史的额外视图，以应用不同的过滤器或帮助测试访问控制。\n\
    \n## 驱动你的测试工作流\n\nBurp 用户驱动工作流的关键部分是能够在 Burp 工具之间发送感兴趣的项目，以执行不同的任务。例如，在代理中观察到一个感兴趣的请求后，你可能：\n\
    \n- 使用 Burp Scanner 对仅该请求进行快速漏洞扫描。\n- 将请求发送到 Repeater（重放器），手动修改请求并反复发送。\n- 将请求发送到\
    \ Intruder（入侵器），以执行各种类型的自动化自定义攻击。\n- 将请求发送到 Sequencer（序列器），以分析响应中返回的令牌的随机性质量。\n\
    \n你可以使用 Intercept 选项卡和代理历史中出现的右键菜单执行所有这些操作以及其他各种操作。\n\n## 关键配置选项\n\n对于更专业的测试任务，或在处理异常的应用程序时，你可能需要修改\
    \ Burp Proxy 的众多选项中的：\n\n- 你可能需要修改 Proxy 监听器（listener），以绑定到不同的接口，以不同方式处理服务器 SSL\
    \ 证书，或为不支持代理的客户端支持不可形代理（invisible proxying）。\n- 你可以配置 Proxy 以各种系统方式自动修改 HTTP 响应；例如，取消隐藏表单字段显示、移除\
    \ JavaScript 表单验证等。\n- 你可以配置匹配/替换规则（match / replace rules）自动更改请求和响应的内容。\n\n##\
    \ 使用 Burp Suite\n\n以下章节描述了在 Web 应用程序测试中使用 Burp Suite 的要素。\n\n**注意：** 在开始使用 Burp\
    \ 之前，你首先需要运行 Burp，配置显示设置，配置你的浏览器和 Burp 协同工作，并且在浏览器中安装 Burp 的 SSL CA 证书。\n\n##\
    \ 测试工作流\n\nBurp 设计用于支持 Web 应用程序手动测试人员的活动。它让你有效地结合手动和自动化技术，让你对 Burp 执行的所有操作拥有完全控制，并对你测试的应用程序提供详细的信息和分析。\n\
    \n某些用户可能不想以这种方式使用 Burp，只想对应用程序进行快速、简单的漏洞扫描。\n\n下图是 Burp 用户驱动工作流关键部分的高级概览。点击图的每个区域查看更多详情：\n\
    \n![](img/c6b688dca6570d17db3036b560ef0905_107_0.png)\n\n## 侦察与分析 (Recon and Analysis)\n\
    \nProxy 工具位于 Burp 工作流的核心。它允许你使用浏览器浏览应用程序，同时 Burp 捕获所有相关信息并让你能够轻松启动后续操作。在典型的测试中，侦察和分析阶段涉及以下任务：\n\
    \n- 手动映射应用程序 - 使用你的浏览器通过 Burp Proxy 进行。\n\n在执行任何自动化操作之前，可能需要更新 Burp 配置的各个方面，例如目标范围（target\
    \ scope）和会话处理（session handling）。\n\n- **分析应用程序的攻击面** - 映射应用程序的过程会在代理历史和目标站点（Target\
    \ site map）中填充 Burp 捕到的有关应用程序的所有信息。这两个存储库都包含帮助你分析其包含的信息的功能，并评估应用程序暴露的攻击面。此外，你可以使用\
    \ Burp 的目标分析器（Target Analyser）报告攻击面的范围以及应用程序使用的不同 URL 类型。\n\n## 工具配置\n\nBurp 包含丰富的配置选项，在测试的不同阶段通常需要使用它们，以确保\
    \ Burp 以你要求的方式与目标应用程序配合。例如：\n\n- 显示 (Display) - 你可以配置显示 HTTP 消息的字体和字符集，以及 Burp\
    \ 自身 UI 的字体。\n- 目标范围 (Target scope) - 目标范围配置告诉 Burp 你正在测试的项。\n- 身份验证 (Authentication)\
    \ - 如果应用程序需要身份验证，你可以配置 Burp 来处理它。\n- 会话处理 (Session handling) - 许多应用程序使用会话令牌，Burp\
    \ 可以帮助管理这些。\n- 保存和恢复状态 (Saving and restoring state) - 你可以保存并在稍后恢复。\n- 任务调度 (Task\
    \ scheduling) - 你可以配置 Burp 定隔调度任务。\n\n## 漏洞检测与利用\n\n完成对应用程序的侦察和分析后，你可以开始探测漏洞。同时使用多个工具通常是最有效的。在整个\
    \ Burp 中，你可以使用右键菜单执行操作。\n\n在 Burp 的默认配置中，它会对通过代理的所有请求自动执行被动扫描。在你开始主动探测应用程序之前，可能会发现\
    \ Scanner 已经记录了一些值得进一步调查的发现。\n\nBurp 的工具可以用于许多不同的方式来支持主动测试过程。下面描述了不同类型问题的示例：\n\
    \n- 基于输入的漏洞 - 对于诸如 SQL 注入、跨站脚本（XSS）和文件路径遍历等问题，你可以以多种方式使用 Burp：\n  - 你可以使用 Burp\
    \ Scanner 执行主动扫描。你可以选择 Burp 中任何位置的项，并使用右键菜单启动扫描。或者你可以配置 Burp 对通过代理的所有在范围内的请求进行实时扫描。\n\
    \  - 你可以使用 Burp Intruder 进行模糊测试（fuzzing），使用自己的测试字符串。\n  - 你可以将单个请求发送到 Burp Repeater，手动修改并反复发送请求。\n\
    \  - 在识别出某些类型的漏洞后，你可以使用 Burp Intruder 主动利用这些漏洞。例如，你通常可以使用递归负载（payload）来利用 SQL\
    \ 注入漏洞。\n- 逻辑和设计缺陷 - 对于客户端控制控件使用不当、未能强制账户锁定以及在多阶段过程中跳过关键步骤的能力等问题，你通常需要手动操作：\n\
    \  - 通常情况下，仔细审查代理历史将识别出需要调查的相关请求。\n  - 你可以通过使用 Burp Repeater 单独发布这些请求，或通过开启 Proxy\
    \ 拦截并在浏览器中手动更改请求，来探测应用程序对意外请求的处理。\n  - 你可以使用 Burp Intruder 主动利用许多逻辑和设计缺陷。例如，Intruder\
    \ 可用于枚举有效用户名、猜测密码、循环遍历预测的会话令牌或密码恢复令牌。\n\n"
