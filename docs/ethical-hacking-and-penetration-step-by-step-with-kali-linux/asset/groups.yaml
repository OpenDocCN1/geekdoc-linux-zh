    # Burp Suite


    +   - Analysse the communication details between client and web server


    ![](img/c6b688dca6570d17db3036b560ef0905_100_0.png)


    Burp Suite is an integrated platform for attacking web applications. It contains
    a variety of tools with numerous interfaces between them designed to facilitate
    and speed up the process of attacking an application. All of the tools share the
    same framework for handling and displaying HTTP messages, persistence, authentication,
    proxies, logging, alerting and extensibility.


    A free limited version of Burp Suite is available on Kali to use. You can run
    burpsuite from Kali Web Applications Menu and Web Vulnerability Scanners, or just
    run burpsuite command on shell.


    The Burp tools you will use for particular tasks are as follows:


    +   - Spider - This can be used for automatically crawling an application, to
    discover its content and functionality.

    - Scanner - This is used to automatically scan HTTP requests to find security
    vulnerabilities.

    - Intruder - This allows you to perform customized automated attacks, to carry
    out all kinds of testing tasks.

    - Repeater - This is used to manually modify and reissue individual HTTP requests
    over and over.

    - Sequencer - This is used to analyse the quality of randomness in an application''s
    session tokens.

    - Decoder - This lets you transform bits of application data using common encoding
    and decoding schemes.'
