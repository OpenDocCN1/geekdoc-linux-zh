  - "[PAGE 36]\n\n# Step 7 - Evading Defences and Erasing Tracks\n\n+   - Where are\
    \ your actions recorded?\n  - Log Files\n  - File Access times\n  - Windows Registry\
    \ entries\n  - Hacker tools left behind\n  - Operating system performance stats\n\
    \  - IDS\n  - Proxy Servers\n  - Firewalls\n\n+   - Deleting files and other evidence\n\
    \  - There are number of places you should look into to make sure you won't leave\
    \ any evidence behind\n  - Windows security event logs, web logs, firewall and\
    \ IDS\n  - Application logs\n  - Log files usually require admin access and will\
    \ log the deletion itself\n  - Delete traces of tools used to hack box\n  - Avoid\
    \ replacing key system files if possible\n  - Some files/logs may have to be deleted\
    \ automatically with reboot-page file\n  - Registry entries can contain evidence\
    \ of attack - keep track of keys modified and reset or delete later if possible\n\
    \  - Antivirus software can detect Trojans and other malware - disable if possible\n\
    \  - Know what traces your tools leave behind\n\n+   - Rootkits\n  - Rootkits\
    \ are used to maintain access and prevent logging of actions\n  - They are set\
    \ of tools used by an attacker after gaining root-level access to host\n  - It\
    \ replaces system files with Trojaned ones\n  - Files look and behave exactly\
    \ like originals\n  - Can be common utilities like notepad, calculator, etc."
  - "[PAGE 37]\n\n+   ○ Will normally perform normal ‘looking’ functions, but hide\
    \ other activities\n\n+   ○ One example is rooted ‘netstat’ command that lists\
    \ all connections except yours\n\n+   • Steganography\n  ○ This is the act of\
    \ hiding files in other files\n  ○ Viruses, rootkits and Trojans can be hidden\
    \ in other harmless files\n  ○ It is common to hide files in media files (jpeg)\n\
    \  ○ Alternate Data Streams (NTFS Streams) is a very popular hiding technique\
    \ in Windows\n  ○ They are very difficult to detect\n  ○ Hacker tools and other\
    \ malware can be hidden using steganography tools\n  ○ Example on Microsoft Windows\
    \ using smbrelay2.exe application:\n    ■ Md5sum doc.doc > sum.txt - MD5 for doc.doc\n\
    \    ■ Type smbrelay2.exe > doc.doc:smb.exe - This will hide the smb exe inside\
    \ doc.doc\n    ■ Md5sum doc.doc > sum2.txt - New MD5 is the same as the old one\n\
    \    ■ Start \\doc.doc:smb.exe - You can run the hidden file this way\n    ■ Type\
    \ dnsenum.txt > doc.doc:dns.txt - Add another text file to the current doc file\n\
    \    ■ Md5sum doc.doc > sum3.txt - New MD5 is the same as the old one\n    ■ Notepad\
    \ doc.doc:dns.txt\n\n+   • Evading IDS and Firewalls\n  ○ It requires advanced\
    \ techniques to evade intrusion detection/logging devices\n  ○ Use stealth stealth\
    \ when using port scanner\n  ○ Use slow/random scanning techniques so traffic\
    \ goes unnoticed - This can take a long time\n  ○ Use out of band techniques when\
    \ possible\n  ○ War dialing can detect modern systems attached to systems within\
    \ network, allowing dial-in and bypassing network perimeter defence\n  ○ Use specially\
    \ crafted packets to bypass firewalls and avoid triggering IDS alarms"
  - "[PAGE 38]\n\n# Introduction to Hacking Techniques\n\n+   * Buffer Overflows\n\
    \  * This type of vulnerability usually associated with both programs and Operating\
    \ Systems and caused by sloppy programming\n  * They are based upon practice of\
    \ not defining boundaries on buffers or variables\n  * Allow excessive or out-of-bounds\
    \ data to be inserted into program buffer\n  * Enables insertion of malicious\
    \ code or execution of arbitrary commands as user\n  * Can cause programs to freeze\
    \ or lock up\n  * Can cause machine to crash or permit exploit leading to compromise\n\
    \  * Skills needed to exploit buffer overflows:\n    * Good programming skills\n\
    \    * Knowledge of stack vulnerabilities\n    * Ability to research, analyse\
    \ and apply vulnerabilities and exploits to current attack\n  * Countering buffer\
    \ overflows:\n    * Ensure programmers work with security mindset\n    * Security\
    \ test programs for vulnerabilities before release\n* Sniffers\n  * Sniffer is\
    \ usually a device or host that enables computer to pick ALL traffic (sniff) on\
    \ wire, even if it does not originate or is destined for host\n  * Used to eavesdrop\
    \ on network traffic\n  * Enables attacker to pick up plaintext data, user credential,\
    \ etc.\n  * Usually requires physical connection into network (except wireless)\n\
    \  * Can be hardware device or software installed on computer\n  * Puts network\
    \ card into promiscuous mode\n  * Records captured traffic for analysis and playback\n\
    \  * Popular sniffers:\n    * Wireshark"
  - "[PAGE 39]\n\n+   * Etherape\n* Ettercap\n* Microsoft Network Monitor\n* Windows\
    \ sniffers must have specialized protocol driver installed on computer (Winpccap)\n\
    \n+   * Wireless Hacking\n* This is relatively new form of hacking\n* Takes advantage\
    \ of weak encryption protocols and security in wireless standards\n* Unique in\
    \ that hacker can become a physical node on your network and bypass firewall and\
    \ other premise protection\n* Easy to set up but not frequently secured\n* Wireless\
    \ networks use a few different forms of encryption\n    * WEP (Wired Equivalency\
    \ Privacy)\n    * WEP uses 40, 64, or 128 bit keys\n    * Weakness is in short\
    \ initialization vector with static key - sniffing traffic for a few hours will\
    \ get you the key\n    * Largely replaced by WPA and WPA2\n    * WPA (WiFi Protected\
    \ Access)\n    * WPA2\n* Wireless networks discovered through war driving - Literally\
    \ driving and seeking networks with laptop acting as sniffer\n* Popular war driving\
    \ software includes Netstumberbler, Airsnort, Airopeak, Kismet\n* Once wireless\
    \ network is discovered, traffic is sniffed to gather enough information to capture\
    \ WEP key\n* Attacker often spoofs trusted MAC address to get around MAC filtering\n\
    * Once in, attacker can compromise the network\n* Wireless is susceptible to wide\
