    \ (phishing, emails, call people and tell them you from 'helpdesk' and ask for\
    \ information)\n- May be to capture admin account and password using keystroke\
    \ loggers\n- May be to boot off Linux-based password change disk and change administrator’s\
    \ password to blank or desired password (Requires physical access to box)\n\n\
    +   - Maintaining and Expanding access\n  - Once obtained, it must be maintained\n\
    \  - Must prevent detection or loss of access\n  - There are several methods to\
    \ maintain access:\n    - Rootkits, OS exploits, caching credentials, prevent\
    \ logging, etc.\n    - Install Trojans that protect or continue access through\
    \ backdoor methods\n    - Create new accounts or elevate privileges of other accounts\n\
    \    - Change permissions on shares and files\n    - Enable null sessions (Windows\
    \ boxes)\n\n+   - Expanding access allows other hosts to be compromised from already\
    \ hacked\n- Transfer hacker tools to hacked host\n- Use built-in commands on host\
    \ to further footprint other hosts on network\n- Obtain other protected passwords\
    \ to other systems from host you have hacked\n- Obtain hosts domain server, DNS\
    \ servers, DHCP server and other useful services by looking at TCP/IP info\n-\
    \ Enumerate entire domain from hacked host\n\n+   - System Compromise\n  - System\
    \ compromise is achieved when your initial goal is met\n    - Root access\n  \
    \  - Data Access/Theft"
