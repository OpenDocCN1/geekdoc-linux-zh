    # Mis-Association attacks on wireless


    ![](img/c6b688dca6570d17db3036b560ef0905_60_0.png)


    The technique of mis-association attack is to get a computer connect to your Kali
    machine using one of the old Wirelesses that it has connected before. Or use the
    same SSID name as is available and has some clients. For example, if a computer
    was connected to the WIFI network called “Public-wifi” in the past, that name
    will be discovered and used to attack to the host.


    The steps are as below:


    +   * Find one of the wireless SSID names that the victim has connected before
    using “airodump-ng"

    * Set up a new access point with exactly the same name

    * Send a de-auth message to the victim to it will be disconnected from the current
    AP and try to connect again

    * As the SSID you created is already on the victim’s list, it will be connected
    to your created AP.

    * You can start capture victim’s traffic!'
