    \ 区域由 DNS 服务器拥有，如果它们允许区域传输，你就可以获得完整的 DNS 记录列表，从而识别出网络上的所有主机\n  - nslookup 提供了简单的名称解析接口\n\
    \    - 可用于即时区域传输\n    - 区域传输可以轻松地描绘整个网络\n    - 示例：以下内容返回所有 DNS 记录（需要被主 DNS 服务器允许）\n\
    \    - nslookup\n\n- set type=any\n- set type=ALL\n- ls -d \"yourdomain.com\"\n\
    \n## Windows 空会话 (Null Sessions)\n\n- Microsoft Windows 使用 SMB（服务器消息块）进行数据共享和服务广告\n\
    - 备选的 CIFS 可作为非 Windows 替代方案\n- 使用“null”（空）用户账户建立空会话\n- 空会话可用于枚举系统信息\n- 使用空账户连接\
    \ Windows 机器的示例：\n  - net use \\\\192.168.66.132\\$ /user:null\n  - net view\n\
    \n- NETBIOS 枚举\n  - Netbios 在有或无 WINS 服务器的情况下运行\n  - 它的运行主要基于广播\n  - 它依赖于广告\n\
