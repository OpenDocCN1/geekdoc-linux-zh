- md: "\n# Burp Suite\n\n- Analyse the communication details between client and web\
    \ server\n\nBurp Suite is an integrated platform for attacking web applications.\
    \ It contains a variety of tools with numerous interfaces between them designed\
    \ to facilitate and speed up the process of attacking an application. All of the\
    \ tools share the same framework for handling and displaying HTTP messages, persistence,\
    \ authentication, proxies, logging, alerting and extensibility.\n\nA free limited\
    \ version of Burp Suite is available on Kali to use. You can run burpsuite from\
    \ Kali Web Applications Menu and Web Vulnerability Scanners, or just run burpsuite\
    \ command on shell.\n\nThe Burp tools you will use for particular tasks are as\
    \ follows:\n\n- Spider - This can be used for automatically crawling an application,\
    \ to discover its content and functionality.\n- Scanner - This is used to automatically\
    \ scan HTTP requests to find security vulnerabilities.\n- Intruder - This allows\
    \ you to perform customized automated attacks, to carry out all kinds of testing\
    \ tasks.\n- Repeater - This is used to manually modify and reissue individual\
    \ HTTP requests over and over.\n- Sequencer - This is used to analyse the quality\
    \ of randomness in an application's session tokens.\n- Decoder - This lets you\
    \ transform bits of application data using common encoding and decoding schemes.\n\
    - Comparer - This is used to perform a visual comparison of bits of application\
    \ data to find interesting differences.\n\nQuick steps of how to start Burp Suite:\n\
    \n- Set up the proxy settings of Burp Suite. (Port number and IP address)\n- Configure\
    \ the proxy settings on any browser on the network that will use Burp as proxy\
    \ server\n- Once you connect to a web site via proxy, there will be a prompt notification\
    \ on Burp suite and you can choose to forward the traffic\n  - Note: Burp suite\
    \ won't forward the traffic by default, it needs to be done manually\n- All traffic\
    \ will be captured on Burp Suite\n- To replay the request on the server select\
    \ the request and send it to repeater\n- On Repeater you can change the request\
    \ and try sending the request to the web server with different parameters and\
    \ test the response\n- Another feature is the Spider - Select the request that\
    \ you want and send it to Spider to get more information\n\n# Getting Started\
    \ With Burp Proxy\n\nBurp Proxy lies at the heart of Burp's user-driven workflow.\
    \ It operates as a web proxy server between your browser and target applications,\
    \ and lets you intercept, inspect and modify the raw traffic passing in both directions.\n\
    \n**Note**: Using Burp Proxy may result in unexpected effects in some applications.\
    \ Until you are fully familiar with its functionality and settings, you should\
    \ only use Burp Proxy against non-production systems.\n\nTo start getting to know\
    \ Burp Proxy, carry out the following steps:\n\n- First, ensure that Burp is installed\
    \ and running, and that you have configured your browser to work with Burp.\n\
    - In Burp, go to the Proxy Intercept tab, and ensure that interception is on (if\
    \ the button says \"Intercept is off\") then click it to toggle the interception\
    \ status.\n3. In your browser, visit any URL. The browser will sit waiting until\
    \ the request completes.\n4. In Burp, go to the Proxy Intercept tab. You should\
    \ see your browser's request displayed for you to view and edit. Click through\
    \ each of the message editor tabs (Raw, Headers, etc.) to see the different ways\
    \ of analysing the message.\n5. Click the \"Forward\" button to send the request\
    \ to the server. In most cases, your browser will make more than one request in\
    \ order to display the page (for images, etc.). Look at each subsequent request\
    \ and then forward it to the server. When there are no more requests to forward,\
    \ your browser should have finished loading the URL you requested.\n6. In your\
    \ browser, click the Refresh button to reload the current page.\n7. In Burp, this\
    \ time edit the request in the Proxy Intercept tab. Change the URL in the first\
    \ line of the request so that a non-existent item is requested. Forward the request\
    \ (and any subsequent ones) to the server. Then look back in your browser. Although\
    \ your browser requested the same URL as before, you should see a \"Not found\"\
    \ message, because you changed the actual outgoing request on the fly, within\
    \ Burp.\n8. In Burp, go to the Proxy History tab. This contains a table of all\
    \ HTTP messages that have passed through the Proxy. Select an item in the table,\
    \ and look at the HTTP messages in the request and response tabs. If you select\
    \ the item that you modified, you will see separate tabs for the original and\
    \ modified requests.\n9. Click on a column header in the Proxy History. This sorts\
    \ the contents of the table according to that column. Click the same header to\
    \ reverse-sort on that column, and again to clear the sorting and show items in\
    \ the default order. Try this for different columns.\n10. Within the history table,\
    \ click on a cell in the drop-down menu. This will highlight that row in the selected\
    \ column. In another row, double-click within the Comment column and type a comment.\
    \ You can use highlights and comments to annotate the history and identify interesting\
    \ items.\n11. Above the history table there is a filter bar. Click on the filter\
    \ bar to show the options available. Try changing the filter settings in various\
    \ ways, and see the effect on what is shown in the history table. When the Proxy\
    \ history has become very large, you can use the filter to hide certain types\
    \ of items, to help find items you are looking for.\n- Select an item in the history,\
    \ and show the context menu (usually, by right-clicking your mouse). The options\
    \ on the context menu are used to drive your testing workflow within Burp. Choose\
    \ \"Send to Repeater\", and go to the Repeater tab. You will see the selected\
    \ request has been copied into the Repeater tool, for further testing.\n- Go to\
    \ the Proxy Options tab, and look at all the options that are available. These\
    \ can be used to change the behaviour of the Proxy listeners, define rules to\
    \ determine what request and response messages are intercepted by the Proxy, perform\
    \ automatic modification of messages, and control the Proxy's behaviour in other\
    \ ways.\n\n# Using Burp Proxy\n\nThe Proxy tool lies at the heart of Burp's user-driven\
    \ workflow, and gives you a direct view into how your target application works\
    \ \"under the hood\". It operates as a web proxy server, and sits as a man-in-the-middle\
    \ between your browser and destination web servers. This lets you intercept, inspect\
    \ and modify the raw traffic passing in both directions.\n\nIf the application\
    \ employs HTTPS, Burp breaks the SSL connection between your browser and the server,\
    \ so that even encrypted data can be viewed and modified within the Proxy.\n\n\
    # Getting Set Up\n\nSetting up Burp and your browser to work with each other involves\
    \ the following elements.:\n\n- Proxy listener - Burp uses Proxy listeners to\
    \ accept requests from your browser. The default Burp listener, on port 8080 of\
    \ your IPv4 loopback interface, is normally sufficient for general-purpose testing.\
    \ Burp will show an alert on startup if it is not able to open this port (usually\
    \ because another application is using it). You can modify the default listener\
    \ and add new ones via the Proxy listener options.\n- Browser proxy configuration\
    \ - You need to configure your browser to use the Burp Proxy listener as its proxy\
    \ server, for both HTTP and HTTPS protocols.\n- Burp CA certificate - Since Burp\
    \ breaks SSL connections between your browser and servers, your browser will by\
    \ default show a warning message if you visit an HTTPS site via Burp Proxy. This\
    \ is because the browser does not recognize Burp's SSL certificate, and infers\
    \ that your traffic may be intercepted by a third-party attacker. To use Burp\
    \ effectively with SSL connections, you really need to install Burp's Certificate\
    \ Authority master certificate in your browser, so that it trusts the certificates\
    \ generated by Burp.\n\n# Intercepting Requests and Responses\n\nThe Intercept\
    \ tab displays individual requests and responses that have been intercepted by\
    \ Burp Proxy for review and modification. This feature is a key part of Burp's\
    \ user-driven workflow:\n\n- Manually reviewing intercepted messages is often\
    \ key to understanding the application's attack surface in detail.\n- Modifying\
    \ request parameters allows you to quickly identify common security vulnerabilities.\n\
    \nIntercepted requests and responses are displayed in an HTTP message editor,\
    \ which contains numerous features designed to help you quickly analyse and manipulate\
    \ the messages.\n\nBy default, Burp Proxy intercepts only requests messages, and\
    \ does not intercept requests for URLs with common file extensions that are not\
    \ directly interesting when testing (images, CSS, and static JavaScript). You\
    \ can change this behaviour in the interception options. For example, you can\
    \ configure Burp to only intercept in-scope requests containing parameters, or\
    \ to intercept all responses containing HTML. Furthermore, you may often want\
    \ to turn off Burp's interception altogether, so that all\n"
  mdcn: "\n\n# Burp Suite\n\n- 分析客户端与 Web 服务器之间的通信细节\n\nBurp Suite 是一个用于对 Web 应用程序攻击的集成平台。它包含了多种工具，这些工具之间有大量的接口，旨在促进并加速应用的攻击过程。所有工具共享同一个框架，用于处理和显示\
    \ HTTP 消息、持久化、身份验证、代理、日志、告警和扩展。\n\nKali 中提供了免费的限制版 Burp Suite 供使用。你可以从 Kali 的“Web\
    \ 应用程序”和“Web 漏洞扫描器”菜单中运行 burpsuite，或直接在 shell 中运行 `burpsuite` 命令。\n\n你将在特定任务中使用的\
    \ Burp 工具如下：\n\n- Spider（蜘蛛虫） - 用于自动爬取应用程序，以发现其内容和功能。\n- Scanner（扫描器） - 用于自动扫描\
    \ HTTP 请求以发现安全漏洞。\n- Intruder（入侵者） - 允许你执行自定义的自动化攻击，执行各种测试任务。\n- Repeater（重放器）\
    \ - 用于手动修改并反复发送单个 HTTP 请求。\n- Sequencer（序列器） - 用于分析会话 Token 的随机性质量。\n- Decoder（解码器）\
    \ - 允许你使用常用的编码和解码方案转换应用程序数据。\n- Comparer（比较器） - 用于对应用程序数据位进行视觉比较，以发现有趣的差异。\n\n\
    启动 Burp Suite 的快速步骤：\n\n- 设置 Burp Suite 的代理设置。（端口号和 IP 地址）\n- 在网络上任何使用 Burp 作为代理服务器的浏览器上配置代理设置\n\
    - 一旦通过代理连接到网站，Burp suite 就会弹出通知，你可以选择转发流量\n  - 注意：Burp suite 默认不会转发流量，需要手动完成\n\
    - 所有流量都将在 Burp Suite 中被捕获\n- 若要在服务器上重放请求，请选择该请求并将其发送到 repeater\n- 在 Repeater 中，你可以更改请求，并尝试使用不同的参数将请求发送到\
    \ Web 服务器，然后测试响应\n- 另一个功能是 Spider - 选择你想要的请求并将其发送到 Spider 以获取更多信息\n\n# 开始使用 Burp\
    \ Proxy\n\nBurp Proxy 位于 Burp 用户驱动工作流的核心。它在浏览器和目标应用程序之间作为 Web 代理服务器运行，允许你拦截、检查和修改双向的原始流量。\n\
    \n**注意**：使用 Burp Proxy 可能会导致某些应用程序产生意之外的影响。在你完全熟悉其功能和设置之前，应仅对非生产系统使用 Burp Proxy。\n\
    \n要开始了解 Burp Proxy，请执行以下步骤：\n\n- 首先，确保 Burp 已安装并运行，并且你已配置浏览器与 Burp 配合。\n- 在 Burp\
    \ 中，进入 Proxy Intercept 标签页，确保拦截开启（如果按钮显示 \"Intercept is off\"），然后点击它切换拦截状态。\n\
    3. 在浏览器中访问任何 URL。浏览器将等待直到请求完成。\n4. 在 Burp 中，进入 Proxy Intercept 标签页。你应该看到浏览器的请求显示供你查看和编辑。点击消息编辑器的每个标签页（Raw、Headers\
    \ 等），查看分析消息的不同方式。\n5. 点击“Forward”（转发）按钮将请求发送到服务器。在大多数情况下，你的浏览器会发送多个请求来显示页面（例如图片等）。查看每个后续请求，然后将其转发到服务器。当没有更多需要转发的请求时，你的浏览器应该已经加载完成你请求的\
    \ URL。\n6. 在浏览器中，点击刷新按钮重新加载当前页面。\n7. 在 Burp 中，此时在 Proxy Intercept 标签页中编辑请求。更改请求第一行中的\
    \ URL，以便请求一个不存在的项目。将请求（以及任何后续请求）转发到服务器。然后查看浏览器。尽管你的浏览器请求了与之前相同的 URL，但你应该看到“Not\
    \ found”（未找到）消息，因为你已经在 Burp 内部动态更改了实际发出的请求。\n8. 在 Burp 中，进入 Proxy History 标签页。它包含一个所有通过代理的\
    \ HTTP 消息的表格。选择表格中的一项，查看请求和响应标签页中的 HTTP 消息。如果你选择了你修改过的项，将看到原始请求和修改后请求的独立标签页。\n\
    9. 点击 Proxy History 中的列标题。这将根据该列对表格内容进行排序。点击相同标题可以反转该列排序，再次点击清除排序并按默认顺序显示项目。尝试对不同的列进行此操作。\n\
    10. 在历史表格中，点击下拉菜单中的单元格。这将高亮所选列中的该行。在另一行中，双击 Comment（注释）列并输入注释。你可以使用高亮和注释对历史记录进行标记，并识别有趣的项目。\n\
    11. 历史表格上方有一个过滤器栏。点击过滤器栏显示可用选项。尝试以各种方式更改过滤器设置，查看其对显示内容的影响。\n- 选择你感兴趣的项目并将其发送到\
    \ Repeater。通常通过右键点击历史记录中的项显示右键菜单。选择“发送到 Repeater”，进入 Repeater 标签页。你可以通过 Proxy\
    \ 选项设置来控制 Burp 的拦截行为。\n\n# 使用 Burp Proxy\n\nBurp Proxy 位于 Burp 用户驱动工作流的核心。它在浏览器和目标应用程序之间作为\
    \ Web 代理服务器运行，允许你拦截、检查和修改双向的原始流量。\n\n如果应用程序采用 HTTPS，Burp 会破坏浏览器和服务器之间的 SSL 连接，以便查看和修改加密数据。\n\
    \n# 设置\n\n设置 Burp 和浏览器使其工作涉及以下元素：\n\n- 代理监听器 - Burp 使用监听器接收浏览器的请求。默认监听器位于 IPv4\
    \ 回环接口的 8080 端口，通常足够。如果无法打开此端口（通常是因为其他程序占用），Burp 会提示。可以通过监听选项修改默认监听器并添加新的。\n-\
    \ 浏览器配置 - 你需要配置浏览器使用 Burp 监听器作为代理服务器，同时适用于 HTTP 和 HTTPS 协议。\n- Burp CA 证书 - 由于\
    \ Burp 破坏了 SSL 连接，通过 Burp Proxy 访问 HTTPS 站点时浏览器默认会显示警告。这是因为浏览器不识别 Burp 的 SSL 证书，并推断流量可能被第三方攻击者拦截。为了有效使用\
    \ SSL 连接，你需要在浏览器中安装 Burp 根证书，使其信任 Burp 生成的证书。\n\n# 拦截请求和响应\n\nIntercept 标签页显示被\
    \ Burp Proxy 拦截的单个请求和响应。此功能是 Burp 用户驱动工作流的关键部分：\n\n- 手动查看拦截的消息通常是详细理解应用程序攻击面的关键。\n\
    - 修改请求参数允许快速识别常见的安全漏洞。\n\n默认情况下，Burp Proxy 只拦截请求消息而不拦截测试时不直接相关的常见 URL 文件扩展请求（图片、CSS\
    \ 和静态 JavaScript）。你可以通过拦截选项更改此行为。例如，你可以配置 Burp 仅拦截包含参数的作用范围请求，或拦截所有包含 HTML 的响应。此外，你可能经常想完全关闭\
    \ Burp 的拦截，以便所有\n\n"
