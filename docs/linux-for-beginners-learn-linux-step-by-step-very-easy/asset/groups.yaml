    \nInformation about the OS, the kernel, and the machine have been shown. Ubuntu-\
    \ the name of the kernel of the machine SMP- the machine’s node name I686- processor\
    \ configuration GNU/Linux- the name of the operating system. You can see how the\
    \ command gives detailed information.\n\n## ‘Touch’ Command\n\nThis command is\
