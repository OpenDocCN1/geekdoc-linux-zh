    结构化命令（if, for, while, until, break, continue）。


    在本章中，你将通过示例对脚本编写获得全面的理解。脚本编写的关键在于你对命令的熟悉程度。脚本编写具有极大的优势，因为它可以处理多条命令，处理结果，并将一个结果传递给另一个结果，从而构建一个链链。


    你已经知道如何使用 `;` 执行多个命令。例如，`pwd; cd ..` 就是一个组合。它是什么？它是一个基础的 shell 脚本！


    # 编写 Shell 脚本


    要编写一个 shell 脚本，你只需要对 Linux 命令有一定的了解并使用一个文本编辑器。在 Ubuntu 上，可以使用默认编辑器（gedit）。让我们检查一下组件。


    Shell 脚本以顶部的注释开始。


    ```

    #!/bin/shell_type

    例如， #!/bin/bash

    ```


    这是一个注释，因为它以 `#` 开头。

    这些行不会被 shell 解释！

    要进行注释，应使用‘#’。然而，这一特定行告诉 shell 它应该使用什么来执行此脚本。我们称 `#!` 为 Shebang。


    接部分将是一组带有说明的命令。如果你熟悉编程，shell 脚本是类似的。


    如果我们按照以下示例创建一个脚本，

    ```bash

    #!/bin/bash

    who


    #who 命令显示你当前登录的账户以及用户登录系统的时间。


    pwd

    ```

    它应该能按预期工作。

    图片：脚本中的 who 命令


    ![](img/c36fb91b72c448ecf582a3158c4a46b0_173_0.png)


    你 也可以使用绝对路径或相对路径。你接下来需要做的一件事是更改权限。为什么？让我们创建一个文件并检查权限。


    ```bash

    jan@jan-virtual-machine:~/Desktop$ ls -l Myscript

    -rw-r--r-- 1 jan jan 137 Sep 23 17:29 Myscript

    ```


    根据结果，没有足够的权限执行此文件。系统将自己视为脚本，但尚未修改权限。这取决于用户。


    要提供执行权限，可以使用 `chmod` 命令。`chmod u+x Myscript`

    一旦完成这一步，脚本就准备就绪


    ```bash

    jan@jan-virtual-machine:~/Desktop$ ls -l Myscript

    -rwxr-xr-x 1 jan jan 137 Sep 23 17:29 Myscript

    ```


    可以执行了。


    ```bash

    jan@jan-virtual-machine:~/Desktop$ ./Myscript

    jan :0 2019-09-21 05:09 (:0)

    /home/jan/Desktop

    ```


    如果你想显示环境文本指南、环境变量的输出等，可以使用 `echo` 命令。我们在之前的一节中已经学习了环境变量。


    # 命令别名


    使用命令别名可以节省大量时间。要定义一个别名，你必须进行一个简单的赋值。


    语法：`alias=command(s)`

    示例：


    - `alias L="ls -al"`

    - `alias search=grep`


    # 命令替换


    将命令的输出作为变量的输入也是可能的。这是一个继续脚本并使用动态数据执行它的很棒功能。要实现这一点，你必须使用 `$`。

    示例：`user_name=$(USERNAME)`

    示例脚本：

    ```bash

    #!/bin/bash

    user_name=$(who)

    echo "Your username is :" $user_name

    ```


    ```bash

    jan@jan-virtual-machine:~/Desktop$ ./Myscript

    "Your username is :" jan :0 2019-09-24 03:42 (:0)

    ```


    # 创建文件


    另一个很棒的功能是你可以输出结果。你甚至可以根据需要命名文件。这将在下一个示例中解释。


    ```bash

    #!/bin/bash

    mydate=$(date +%Y%m%d)

    echo "Today is :" $mydate

    who > log.$mydate

    ls -l log.$mydate

    ```


    ```bash

    jan@jan-virtual-machine:~/Desktop$ ./Myscript

    "Today is :" 20190924

    -rw-r--r-- 1 jan jan 44 Sep 24 06:19 log.20190924

    ```


    在这里，我们创建了一个日期并对其进行了格式化。`%Y` 是 YYYY 格式的年份。月份是数字格式（例如， 09），日期也是数字格式。输出类似于 YYYYMMDD。输出被存入变量中。然后我们使用
    `echo` 命令并使用重定向运算符 `>` 将其输入重定向到新文件。文件名被创建为 “log”.YYYYMMDD。这就是我们创建日志保留记录的方式。如果脚本在第二天运行，文件名将是
    log.201909205。


    重定向是一个非常有用的功能。与其使用 `touch` 等命令，你可以将输出重定向到文件。然而，你甚至可以使用 `touch` 命令从脚本创建文件。例如，


    ```bash

    #!/bin/bash

    mydate=$(date +%Y%m%d)

    echo "Today is : $mydate"


    touch log.$mydate # 创建文件并将第一部分命名为 .log，稍后使用我们的变量我们 who >> log.$mydate

    ```


    ```bash

    jan@jan-virtual-machine:~/Desktop$ ./Myscript

    "Today is :" 20190924

    jan :0 2019-09-24 03:42 (:0)

    jan@jan-virtual-machine:~/Desktop$ ls -l Myscript

    -rw-r--r-- 1 jan jan 137 Sep 23 17:29 Myscript

    jan@jan-virtual-machine:~/Desktop$ cat log.20190924

    jan :0 2019-09-24 03:42 (:0)

    ```

