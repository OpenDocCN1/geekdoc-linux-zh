    ## 在服务器版本中导航


    然而，在服务器版本需要花费一些时间。它并不那么直观，在以这种方式探索 Linux 之前和期间，了解某些细节将非常有帮助。如果你熟悉 DOS，这只需要学习命令和代码的问题。如果你不熟悉，你将面临相当陡的学习曲线。


