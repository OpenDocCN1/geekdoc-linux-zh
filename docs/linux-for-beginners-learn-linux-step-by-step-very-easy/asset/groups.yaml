    安装 Ubuntu。如果你使用的是笔记本电脑，必须连接电源，因为安装过程可能会耗尽你的电池。

    你还需要连接到互联网源。


    决定如何处理你的其他操作系统。你将会有两个选项：将 Ubuntu Linux 与其他操作系统并存安装，或者用 Ubuntu 替换旧操作系统。如果你选择同时拥有两个，那么每次重启计算机时，你都需要选择要使用的操作系统。


    设置你的分区大小。如果你选择在计算机上同时运行两个操作系统，这是必要的。你可以使用滑块来调整想为 Ubuntu 留出的空间。记住，你还需要为文件和程序留足够的空间，因此请为新系统留出足够的空间。选择你的位置。如果你连接了互联网，这会自动完成。


    设置你的键盘布局。在这里正确的做法是点击“检测键盘布局 Ubuntu”以自动选择正确的布局。


    输入你的登录信息。设置用户名和密码。你可以选择 Ubuntu 自动登录，你也可以在任何想使用电脑时输入登录信息。


    等待安装过程完成。

    安装完成后重启电脑，Ubuntu 将加载。


    ## 2. Windows 安装程序


    Windows 安装程序会将 Linux 与你正在使用的其他操作系统并存安装。程序和文件不会受到影响，但每次重启计算机时，你都必须选择要使用的操作系统。


    - 从 Ubuntu 网站下载安装程序。

    - 如果浏览器提示，你可以选择“运行”、“保存”或“打开”。

    - 创建一个你将用于登录计算机的用户名和密码

    - 点击“安装”开始该过程

    - 安装完成后重启电脑，并选择 Ubuntu Linux 作为加载的操作系统


    重要提示：


    - 在 CD 或 DVD 上运行此类程序通常是一个好主意，这样可以先看一看；如果你喜欢你看到的内容，再进行安装。试用将帮助你做出决定，让你在安装操作系统时不会后悔悔。

    - 在开始安装之前，请确保你已经先备份了所有的文件、程序、个人数据和设置，以免丢失它们。


    ## 在 Linux 上安装新软件


    在 Linux 操作系统上安装新软件与你安装操作系统本身一样简单。所有操作都已为用户变得变得非常简单。因此，没有理由担心你过去在其他操作系统上安装新系统时遇到过困难。


    大多数 Linux 发行版都有一个应用商店（或类似的东西），它代表了存储所有应用程序的中央区域。你需要做的就是浏览它们，并安装你想在机器上使用的应用程序。这让你能够轻松地找到想在计算机上安装的程序。Ubuntu
    软件中心就是 Ubuntu Linux 这种集中地点的示例。Deepin 有 Deepin 软件中心。某些发行版依赖 GNOME 软件，而另一些依赖 Synaptic。


    所有这些工具含义和功能都是相同的；它们提供了一个中央位置，你可以从中轻松地搜索和安装 Linux 软件。不过，GUI（图形用户界面）的存在很重要，以便你完成其他软件的安装过程。如果你没有
    GUI，将不得不依靠命令行界面来进行安装。


    用户需要知道的是，在任何 Linux 机器上安装软件都非常容易。新电脑用户也会发现这非常容易且不费时间。该操作系统的设计旨在让计算机用户在所做的一切上都变得轻松，而这只是其中之一。安装操作系统后，你就可以开始安装你在使用机器或设备时所需的任何应用程序。


    Linux 无处不在。你可以在家里、车里，甚至家用电器中找到它。当然，你最常找到它的地方是计算机。乍一看，Linux 看起来和其他任何操作系统一样。它位于你所有其他软件之下，向你的硬件发送信号。它具有图形界面，就像大多数其他操作系统一样，并且对于其他系统具有的大功能，它也有相应的软件实现。如果你用过任何操作系统，那么使用
