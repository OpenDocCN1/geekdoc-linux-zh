    How hacking should be done?


    There is no particular hacker guideline that can teach you hacking with perfection.
    But there is always a famous procedure that good hackers follow subconsciously
    for better results.


    ### The Hacking Roadmap


    Hacking is like cooking. You need to get ready with all the ingredients (i.e.
    programs) and know in detail about the properties of that ingredients (or programs)
    and use them together to produce a culinary material. What if the food doesn''t
    taste good? That is if you are unable to get better results after all the hacking
    process? There is only one way you can do i.e.; to try again. There are five important
    areas you need to learn in detail to master hacking.


    - 1) Information Gathering

    - 2) Automatic Vulnerability Scanning

    - 3) Exploiting

    - 4) Password Attacks

    - 5) Sniffing and wireless attacks

