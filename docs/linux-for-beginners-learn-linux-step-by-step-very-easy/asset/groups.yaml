- md: "\n# LINUX FOR BEGINNERS\n\nLearn linux Step by Step Very Easy\n\n## Introduction\
    \ CHAPTER 1. Basic Linux commands\n## CHAPTER 2. Linux Installation\n## CHAPTER\
    \ 3. File System\n## CHAPTER 4. Basic Shell Programming\n## CHAPTER 5. What To\
    \ Do Next With Linux?\n## CHAPTER 6. Basic Linux tools\n## CHAPTER 7. Command\
    \ Syntax Patterns\n## CHAPTER 8. Linux Files and Directories\n## CHAPTER 9. Linux\
    \ File System Searching\n## CHAPTER 10. User and Group Management\n## CHAPTER\
    \ 11. Commands and Functions for the Beginner\n## CHAPTER 12. Using Linux Text\
    \ Editors\n## CHAPTER 13. Exercises\n## CHAPTER 14. Building Scripts ## CHAPTER\
    \ 15. Securing Your Linux Server\n## CHAPTER 16. GNU Utilities\n## CHAPTER 17.\
    \ Control Privileged User Conclusion\n\n## CHAPTER 1. Basic Linux commands\n\n\
    In this section, we will explore the basic Linux commands that are necessary to\
    \ get started. You can now open the terminal. Right-click on the Desktop and choose\
    \ ‘Open Terminal’.\n\nIf you don’t see this option, look for ‘Applications’ at\
    \ the top of the window. Click on ‘Applications’ and go to ‘Accessories’. Choose\
    \ ‘Open terminal’ and open the text editor, that is, ‘Gedit’. Just click on the\
    \ search and type “text editor”. Add some text of your choice to the file and\
    \ save it, maybe on the desktop. I have saved my file with the name first with\
    \ the following text:\n\nI am a Linux Guru\nI am enjoying reading this book\n\
    Now go to the terminal and type the following:\ncat first\n\nAfter pressing the\
    \ enter key, the contents of the file will be displayed in the window. To list\
    \ the content contained in a short file, this method is\n\n```\nubuntu@ubuntu-desktop:~/Desktop$\
    \ cat test\nI am a Linux Guru\nI am enjoying reading this book\nubuntu@ubuntu-desktop:~/Desktop$\n\
    ```\n\nappropriate.\n\n## Changing Directories\n\nYou might also want to navigate\
    \ or change directories via the terminal. To achieve this, use the command ‘cd’\
    \ which stands for “change directory”.\n\nExample:\n\ncd /home\n\nThe above command\
    \ will change the working directory to the ‘home’ directory. The use of forwarding\
    \ slash (/) is to mean relative to the root, meaning that this command will be\
    \ executed regardless of the directory that you are currently in. Now type the\
    \ following command:\n\n```\ncd httpd\n```\n\nThe directory will be changed to\
    \ ‘httpd’ but relative to the ‘/home’ directory. The full working directory will\
    \ be ‘/home/httpd’. Now type the following command:\n\n```\ncd ..\n```\n\nThis\
    \ command will change the working directory to the parent directory of the current\
    \ directory. In our case, we will move from ‘/home/httpd’ to the ‘/home’ directory.\
    \ Type the following command:\n\n```\ncd ~\n```\n\nThis command changes the directory\
    \ to the user’s home directory ‘/home/(username)’. The “username” will be the\
    \ name you have used on the computer. The symbol “~” is used in Linux to represent\
    \ the user’s home directory.\n\n## Copying Files\n\nThe command ‘cp,’ which stands\
    \ for “copy files” is used for copying files. Note that the file is not deleted\
    \ from its initial location and a duplicate of the same is made at the specified\
    \ location. Type the following command:\n\ncp first me\n\nThe command above will\
    \ make a duplicate of the file first at the same directory but with a new name,\
    \ that is ‘me’. If the file ‘me’ exists in the directory, it will be overwritten\
    \ and you will not be warned before this command is executed. Consider the command\
    \ below:\n\ncp –i first me\n\nNotice that in the above command we have added the\
    \ ‘–i’ option. If the file ‘me’ exists in the directory, you will be notified\
    \ before it is overwritten. Next, try the following command:\n\ncp –i /d/file\n\
    \nWith the above command, the file ‘/d/file’ will be copied into the same current\
    \ directory and then named ‘file’. Note that we have used the ‘–i’ option so if\
    \ it already exists we will be notified before it is overwritten.\n\nYou might\
    \ also need to copy all the files contained in a particular directory to another\
    \ directory. This can be achieved as follows: cp -dpr sourcedirectory destinationdirectory\n\
    \nAll the files in the directory ‘sourcedirectory’ will be copied to the directory\
    \ ‘destinationdirectory’. Notice that we have used the option ‘–dpr’. This means\
    \ the following:\n\n- -d – means that links will be preserved\n- -p – file attributes\
    \ will be preserved\n- -r – copying will be done recursively\n\nIt is good to\
    \ specify those options if needed while copying all the files from a directory,\
    \ otherwise, the default settings will be applied which might produce an unwanted\
    \ result.\n\nTo show the amount of space on a disk used on each of the mounted\
    \ file systems, use the command ‘df’.\n\n## ‘Less’ Command\n\nThe less command\
    \ is the same as the more command. The difference comes in that with this command\
    \ the user can page up or down through the file. Consider the example below:\n\
    \nless first\nThe above command will display the contents of the file ‘first’.\n\
    \n## ‘Ln’ Command\n\nThis command creates a symbolic link to a certain file. Write\
    \ and run the following command:\nln –s first slink\n\nThe command above will\
    \ create a symbolic link named ‘slink’ which will link to the file ‘first’. The\
    \ command ls –i first slink’ will show that the two files are different and have\
    \ different “inodes”.\n\n## ‘Locate’ Command\n\nThis is used for searching in\
    \ the database.\nRun the following command: slocate —u\n\nA database named ‘slocate’\
    \ will be created. This will take some time to complete, so be patient. Before\
    \ you will be able to search for a file, this command must be run first. However,\
    \ on most systems, ‘cron’ will run this command on periodical basis. Again, run\
    \ the following command:\n\nlocate whois\nThis command will look for files in\
    \ your system whose name contains the string “whois”.\n\n## ‘Logout’ Command\n\
    \nThe command is used to logout the user who is currently logged into the system.\
    \ Just go to the terminal and type this command:\n\nlogout You will then be logged\
    \ out and returned to the login screen.\n\n## ‘Ls’ Command\n\n‘Ls’ stands for\
    \ list. It is used for listing files in a directory. However, it comes with many\
    \ options which need to be known as well, otherwise, you will become confused.\
    \ If you need to list all the files in the current directory except those starting\
    \ with “.” then just type in the command:\n\n```\nls ubuntu@ubuntu-desktop:~/Desktop$\
    \ ls me test test.odt\n```\n\nThe figure above is the Desktop directory and it\
    \ contains the files shown. Note that only the file names will be listed. You\
    \ might need to show more details about the files in the directory such as the\
    \ ownership permissions, their size, time and date stamp, etc. This can be achieved\
    \ with the following command:\n\nls –al\nAs shown above, the command ‘ls-al’ is\
    \ more extensive compared to the previous command. You can use it if you want\
    \ more details about the file.\n\n## ‘More’ Command\n\nSend contents of a file\
    \ one page at a time to the screen. It can also work on piped output. Let us list\
    \ the contents of the file ‘/etc/profile’ to the screen. This is an in-built file,\
    \ meaning that it comes with the operating system and it contains the profiles\
    \ for the users of the system:\n\nmore /etc/profile\n\n```\nubuntu@ubuntu-desktop:~/Desktop\
    \ more /etc/profile\n# /etc/profile: system-wide .profile file for the Bourne\
    \ shell (sh(1))\n# and Bourne compatible shells (bash(1), ksh(1), ash(1), ...).\n\
    \nif [ -d /etc/profile.d ]; then\n  for i in /etc/profile.d/*.sh; do\n    if [\
    \ -r $i ]; then\n      $i\n    fi\n  done\n  unset i\nfi\nif [ \"$PS1\" ]; then\n\
    \  if [ \"$BASH\" ]; then\n    PS1=\"\\@\\h:\\w\\'\n    if [ -f /etc/bash.bashrc\
    \ ]; then\n      .etc/bash.bashrc\n    fi\n  else\n    if [ \"$(id -u)\" -eq 0\
    \ ]; then\n      PS1='#\n    fi\n  fi\nfi\n```\n\nNote that the contents of the\
    \ file will be displayed one page at a time. This is because the content is too\
    \ big to be displayed on a single page. Consider the command below:\n\nls -al\n\
    \nThe command will list all files in the directory and output will be piped through\
    \ ‘more’. If the output from the directory can’t fit in one page, it will be listed\
    \ on an additional page.\n\n## ‘Mv’ Command\n"
  mdcn: "\n\n# Linux 初学者教程\n\n从浅入深轻松学习 Linux\n\n## 引言 第 1 章 基础 Linux 命令\n## 第 2 章\
    \ Linux 安装\n## 第 3 章文件系统\n## 第 4 章  Shell 编程\n## 第 5 章 Linux 之后可以做什么？\n## 第 6\
    \ 章 基础 Linux 工具\n## 第 7 章 命令语法模式\n## 第 8 章 Linux 文件与目录\n## 第 9 章 Linux 文件系统搜索\n\
    ## 第 10 章 用户与组管理\n## 第 11 章 初学者命令与函数\n## 第 12 章 使用 Linux 编辑器\n## 第 13 章 练习\n##\
    \ 第 14 章 编写脚本 第 15 章 安全你的 Linux 服务器\n## 第 16 章 GNU 工具\n## 第 17 章 控制特权用户 结\n\n\
    ## 第 1 章 基础 Linux 命令\n\n在本节中，我们将探索入门必需的基础 Linux 命令。你现在可以打开终端了。在桌面上点击右键，并选择“打开终端”。\n\
    \n如果你没有看到此选项，请查看窗口顶部的“应用程序”。点击“应用程序”并进入“附件”。选择“打开终端”并打开文本编辑器，即“Gedit”。只需点击搜索并输入“text\
    \ editor”。在文件中添加你选择的文本并保存，可以保存在桌面上。我保存了一个名为 `first` 的文件，内容如下：\n\n我是一个 Linux 专家\n\
    我很喜欢读这本书\n现在去终端并输入以下内容：\ncat first\n\n按下回车键后，文件内容将显示在窗口中。若要列出短文件中的内容，这种方法是\n\n\
    ```\nubuntu@ubuntu-desktop:~/Desktop$ cat test\nI am a Linux Guru\nI am enjoying\
    \ reading this book\nubuntu@ubuntu-desktop:~/Desktop$\n```\n\n非常合适的。\n\n## 切换目录\n\
    \n你可能还想通过终端导航或更改目录。要实现这一点，请使用 `cd` 命令，它是“change directory”（更改目录）的缩写。\n\n示例：\n\n\
    cd /home\n\n上述命令将工作目录更改为 `home` 目录。使用正斜杠（/）意味着相对于根目录，这意味着无论你当前处于哪个目录，该命令都会执行。现在输入以下命令：\n\
    \n```\ncd httpd\n```\n\n目录将更改为 `httpd`，但是相对于 `/home` 目录。完整的工作目录将是 `/home/httpd`。现在输入以下命令：\n\
    \n```\ncd ..\n```\n\n此命令将工作目录更改为当前目录的父目录。在本例中，我们将从 `/home/httpd` 移动到 `/home` 目录。输入以下命令：\n\
    \n```\ncd ~\n```\n\n此命令将目录更改为用户的家目录 `/home/(username)`。“username”将是你电脑上使用的名称。在\
    \ Linux 中，`~` 符号用于表示用户的家目录。\n\n## 复制文件\n\n`cp` 命令代表“copy files”（复制文件），用于复制文件。请注意，文件不会从初始位置删除，而是在指定位置创建一个相同文件的副本。输入以下命令：\n\
    \ncp first me\n\n上述命令将在相同目录下创建文件 `first` 的副本，但新名称为 `me`。如果目录中已存在 `me` 文件，它将被覆盖，且在执行此命令之前你不会收到警告。考虑下面的命令：\n\
    \ncp –i first me\n\n注意，在上述命令中我们添加了 `-i` 选项。如果目录中存在 `me` 文件，在覆盖之前你会收到通知。接下来，尝试以下命令：\n\
    \ncp –i /d/file\n\n使用上述命令，文件 `/d/file` 将被复制到当前目录并重命名为 `file`。注意我们使用了 `-i` 选项，所以如果文件已存在，在覆盖之前我们会收到通知。\n\
    \n你可能还需要将特定目录中的所有文件复制到另一个目录。可以通过以下方式实现：cp -dpr sourcedirectory destinationdirectory\n\
    \n`sourcedirectory` 目录中的所有文件都将复制到 `destinationdirectory` 目录中。注意我们使用了 `-dpr` 选项。这意味着：\n\
    \n- -d – 意味着将保留链接\n- -p – 将保留文件属性\n- -r – 复制将以递归进行\n\n在从目录复制所有文件时，如有需要指定这些选项是好的，否则将应用默认设置，可能会产生不想要的结果。\n\
    \n若要显示每个挂载文件系统使用的磁盘空间，请使用 `df` 命令。\n\n## ‘Less’ 命令\n\n`less` 命令与 `more` 命令相同。区别在于，使用此命令时用户可以向上或向下翻页查看文件。考虑下面的用例：\n\
    \nless first\n上述命令将显示文件 `first` 的内容。\n\n## ‘Ln’ 命令\n\n此命令创建指向特定文件的符号链接。编写并运行以下命令：\n\
    ln –s first slink\n\n上述命令将创建一个名为 `slink` 的符号链接，该链接将指向文件 `first`。运行 `ls –i first\
    \ slink` 将显示这两个文件是不同的，并且具有不同的“inodes”（索引节点）。\n\n## ‘Locate’ 命令\n\n用于在数据库中搜索。\n\
    运行以下命令：slocate —u\n\n将创建一个名为 `slocate` 的数据库。这需要一些时间来完成，请耐心等待。在搜索文件之前，必须运行此命令。在大多数系统中，`cron`\
    \ 会定期运行此命令。再次运行以下命令：\n\nlocate whois\n此命令将在系统中查找包含“whois”字符串的文件。\n\n## ‘Logout’\
    \ 命令\n\n此命令用于注销登录系统的用户。进入终端输入此命令：\n\nlogout 你将注销并返回登录界面。\n\n## ‘Ls’ 命令\n\n`ls`\
    \ 代表 list（列出）。用于列出目录中的文件。然而，它带有许多选项需要了解，否则你会感到困惑。如果你需要列出当前目录中所有以“.”开头的文件，只需输入命令：\n\
    \n```\nubuntu@ubuntu-desktop:~/Desktop$ ls me test\n```\n\n上面的图是 Desktop 目录，它包含了显示的文件。注意只列出了文件名。你可能需要显示目录中文件的更多详细信息，例如所有权、大小、时间戳等。可以通过以下命令实现：\n\
    \nls –al\n如所示，`ls-al` 命令比之前的命令更详尽。如果你想获取文件的详细信息，可以使用它。\n\n## ‘More’ 命令\n\n一次一页将文件内容发送到屏幕。它也可以处理管道输出。让我们将\
    \ `/etc/profile` 文件的内容列到屏幕。这是一个内置文件，意味着它随操作系统提供并包含了用户的配置：\n\nmore /etc/profile\n\
    \n```\nubuntu@ubuntu-desktop:~/Desktop more /etc/profile\n# /etc/profile: 系统级\
    \ .profile 文件，适用于 Bourne shell (sh(1))\n# 以及兼容 Bourne 的 shell (bash(1), ksh(1),\
    \ ash(1), ...).\n\nif [ -d /etc/profile.d ]; then\n  for i in /etc/profile.d/*.sh;\
    \ do\n    if [ -r $i ]; then\n      $i\n    fi\n  done\n  unset i\nfi\nif [ \"\
    $PS1\" ]; then\n  if [ \"$BASH\" ]; then\n    PS1=\"\\@\\h:\\w\\'\n    if [ -f\
    \ /etc/bash.bashrc ]; then\n      .etc/bash.bashrc\n    fi\n  else\n    if [ \"\
    $(id -u)\" -eq 0 ]; then\n      PS1='#\n    fi\n  fi\nfi\n```\n\n注意，文件内容将一次一页显示。这是因为内容太大，无法在一个页内显示。考虑下面的命令：\n\
    \nls -al\n\n该命令将列出目录中的所有文件，输出将通过 `more` 处理。如果目录的输出无法在一个页内显示，它将在额外页面列出。\n\n## ‘Mv’\
    \ 命令\n\n"
