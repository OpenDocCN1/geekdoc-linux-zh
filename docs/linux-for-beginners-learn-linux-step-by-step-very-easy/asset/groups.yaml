    1.56 *\n3.12\n1.2222*2\n2.4444\n0.85/5\n1\n```\n\n在最后一行，你可以看到一个问题。8.45/5 = 1。除非向上舍入，否则这是不准确的。这里的问题在于小数位数。它由一个名为\
