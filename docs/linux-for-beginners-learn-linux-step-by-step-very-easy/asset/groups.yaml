    ```

    cp /home/Gary/linux_tutorial/Exercise1 Exercise2 cp Exercise2 ../../backups

    cp Exercise2 ../../backups/Exercise3

    ```


    When you use the cp command, the destination of the file can represent a path
    to a file or a directory. If the destination is to a file such as Exercise1, 2
    and 3, then this will create a copy of the files in the destination file, but
    the original remains in the source file or directory. If we copy the files into
    a directory, the files will maintain the names in the destination directory. In
    the default behavior of the cp command, it will only copy a file. The term recursive
    in this case means that you would wish to copy the directory and all the contents
    of that directory which could include files, directories, and subdirectories among
    others.


