    正如我之前提到的，Linux 执行的工作与任何其他操作系统都相同。然而，Linux 的特殊之处在于它是开源的。事实上，它是使用最广泛的开源操作系统。这意味着用于创建
    Linux 的源代码对公众可见并可编辑。这也意味着有才华的人士可以通过对系统进行改进来为 Linux 的开发做出贡献。此外，该系统具有极高的定制性。它有许多版本，也称为发行版，它们彼此各不相同。它们包含不同类型的软件。尽管系统的核心部分大部分是相同的，但你可以选择不同的浏览器、文字处理器和应用程序，让你的系统真正成为你自己的。你还可以更改核心组件，如用户界面组件和图形组件。Linux
    非常易于使用且操作简单。此外，它还有许多方式可以根据你的需求进行定制。


    ## Linux 是如何创建的？


    你一定听过 Unix， 20 世纪 70 年代开发的操作系统。它在当时是一个优秀的工具，用于学术和商业需求。与 Linux 类似，Unix 有许多不同的变体。该系统最初是程序员的一个工具，使软件开发变得更容易。随着时间的推移，它开始在学术界传播，人们添加了自己的工具并与同事共享。该系统本身遵循
    Unix 哲学。这意味着系统倾向于使用功能有限的互连接的小型程序。所有互连接的程序都有定义良好的功能，并且非常擅长执行这些功能。


    Linux 的初衷是尽可能地模拟 Unix。许多人都尝试过这样做。这些程序被称为“类 Unix”或“兼容 Unix 的”，但没有哪一个像 Linux 一样成功。Linux
    最受欢迎，且与 Unix 最接近。它具有相似的接口方式、文件流布局、核心组件和编程工具。在 Unix 克隆的海洋中，Linux 脱颖而出。这都要归功于一个名叫林斯·托瓦尔斯（Linus
    Torvalds）的男人。


    1991 年，托瓦尔斯对操作系统产生了兴趣。他对 MINIX 的许可（仅限于学术用途）感到沮丧。他利用这种愤怒创建了自己的系统，这个系统现在被称为 Linux
    内核。他使用 MINIX 作为平台，并将 MINIX 的大多数应用程序添加到 Linux 中。之后，系统不断成熟和演进，最终跟上了 Linux 系统的新发展。由于受
    GPL 许可许可的代码可用，使用它们被认为是有利可的。GNU 替换了 MINIX 的所有组件。GNU 项目允许只要程序在兼容许可下发布就可以使用这些代码。由于此，托瓦尔斯从他的原始许可切换到了
    GNU GPL。然而，原始许可不允许对软件进行进一步分发，但在切换许可后，该程序终于实现了开源。许多人在 Linux 上进行工作，以便将 GNU 组件正确地整合到内核中。最后，系统变得可以运行且功能完备。


    Linux 的原始名称是 Freax，这是 free（免费）和 Unix 的一个文字游戏。在为期六个月的时间里，项目的 Makefile 包含了“Freax”这个名称。Linux
    这个名字虽然是后来才给这个项目的，但在 Freax 之前就被认为是该项目的可能名称，但托瓦尔斯认为它太自恋了并将其弃用。


    为了便于 Linux 的进一步开发，文件被上传到 FUNET 的 FTP 服务器上。这是在 1991 年 9 月，在托瓦尔斯在赫尔辛基科技大学的同事 Ari
    Lemmle 以及其他几位自愿担任 FTP 服务器管理员的人帮助下。Ari 认为“Freax”不是一个好名字。在托瓦尔斯不知的情况下，他将项目更名为 Linux，最终托瓦尔斯也同意了这一点。


    背景信息足够了！是时候深入主题核心内容，学习 Linux 能为你做什么了。


    ## 第 3 章 文件系统


    Linux 的文件系统在灵活性方面非常出色。它的设计允许它支持普通格式以及特殊类型的文件格式。它可以支持文本、程序、图像、输出和输入设备。因此，由于它支持多种文件格式，它可以与另一个操作系统共存。


    此外，在系统中，文件和目录之间几乎没有可区分因素。这意味着目录仅仅是文件堆的位置。


    ## 文件分类


    为了更好地理解 Linux 文件系统，对文件进行了分类。虽然假设这一点是安全的，但了解更多关于特定文件的信息可以让程序员和系统管理员在使用时避免复杂性。


    - 文件类别：

    - 目录 (d) —— 文件堆的位置

    - 链接 (l) —— 文件在多个部分的可见

    - 管道 (p) —— 用于进程间通信的系统

    - 普通 (-) —— 普通文件

    - 套接字 (s) —— 提供网络系统

    - 特殊 (c) —— 用于输出输入的机制


    ## 分区的艺术


    Linux 分区是因为电源故障威胁到了大多数 Linux 用户。那时宕机会会对系统造成损害。


    此外，分区的主要目的是实现更高的数据安全性。硬盘的划分允许安全分组和保护。


    由于分区，你可以对数据组进行优先级排序。当硬盘某部分受损时，只有该部分受到影响。存储在其他分区中的其余部分不受影响。系统的两个主要分区：


    1. 交换分区 (Swap) —— 指额外的内存或扩展

    2. 数据分区 (Data) —— 指普通数据


    推荐分区：


    - 用于必要数据的分区

    - 用于服务器程序和配置数据的分区

    - 用于应用程序的分区

    - 至少一个用于用户邮件、存档和数据库表的分区

    - 至少一个用于特定文件的分区

    - 至少一个用于虚拟内存的分区


    常用分区：


    - 包含个人数据的分区

    - 用于存储临时文件的分区

    - 用于存储第三方数据的分区

    - 专门用于程序的分区


    ## 目录：根目录与子目录


    在 Linux 中，有一个被称为根目录（Root Directory）。它是主目录，正如程序员和系统管理员所言，它是所有目录的根。


    伴随根目录的是子目录。这些子目录根据分配的任务管理文件。


    子目录及其内容：


    - /home – 用户目录

    - /boot – 内核和启动文件；尝试消除不启动加载程序的文件

    - /initrd – 关于启动的数据

    - /dev – 包含所有 CPU 硬件引用

    - /bin – 常用共享系统程序

    - /etc – 系统配置数据

    - /lib – 库文件

    - /lost+found – 从故障恢复的数据

    - /opt – 来自第三方来源的文件

    - /net – 远程文件系统的标准挂载点

    - /misc – 杂数据

    - /proc – 关于系统资源的信息

    - /mnt – 外部文件系统的标准挂载点


