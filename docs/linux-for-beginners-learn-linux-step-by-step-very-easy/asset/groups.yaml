    ## CHAPTER 16. GNU Utilities


    In this chapter, we will cover the general components of the Linux operating system.
    We will delve into the critical elements that work together to make Linux the
    most versatile operating system. You will understand the difference between the
    GNU project and the GPL.


    All Linux distributions come with software developed under the GNU project. When
    you use the distro in text terminal mode, you will be able to see the GNU utilities.


    ## What is GNU?


    GNU (GNU’s Not Unix) is a free operating system of GNU packages that were released
    under the GNU project and other third parties free software. Linux has become
    the most preferred operating system recently because it comes with all the software
    installed. Linux distributions come with graphics software, office packages, and
    even coding packages under the GNU GPL license.


    In 1984, Richard Stallman started the GNU project, which was intended to be a
    UNIX based Operating system.


    GNU utilities are a collection of GNU software that contains tools like ls, cat,
    rm, which are mostly implemented in Unix Operating systems. rm – is a command
    used to remove objects like computer files, directories, and links from file systems.
    cat – is a Unix utility that reads files in sequence and writes them as standard
    output. Name derived from its functionality; to concatenate. ls – is the command
    used to list files in Unix System and all UNIX based systems.


    The GNU General Public License (GPL) for Linux, ensures that the software is always
    free and open to anyone. No single person or/and a company can claim ownership
    or control its use. Additionally, any user can copy, edit, and redistribute the
    software’s source code.


    You may ask yourself, then who funds the GNU project? How do they raise funds?
    The Free Software Foundation funds the project (FSF), a tax-exempt charity organization.
    To support the project, log on to www.gnu.org for details.


    The GNOME GUI and the bash are both programs made under the GNU project. The Shell
    is the GNU program that executes your commands, most commonly referred to as the
    command interpreter.

    Linux distributions are developed using GNU C and C++ compiler. Text files in
    Linux are edited using the ed and emacs editors.


    ## Example of GNU Utilities


    Other popular GNU utilities include:


    - 1. Binutils - is comprised of different packages for handling binary files.
    Accompanying packages include ar, as, gasp, id, nm, objcopy, objdump, ranlib,
    readlf, size, and strip.

    - 2. Bash – is the GNU package responsible for interpreting shell commands in
    Linux.

    - 3. Automake – is the GNU software for generating a makefile.in files that are
    used with Autoconf.

    - 4. Autoconf – is the package for generating shell scripts that are used for
    configuring source-code packages.

    - 5. Emacs – is the text editor package for Linux.

    - 6. Ed – is the line-oriented text editor.

    - 7. Diff – is the package used to compare files and show the difference line
    by line.

    - 8. GNU Chess – is the package for running the Linux chess game.

    - 9. The GIMP – is a GNU program for manipulating images. It’s like photoshop
    for Linux.

    - 10. GNOME – provides the display or GUI for Linux Distributions.

    - 11. Gnumeric – is a spreadsheet GNU program that works on GNOME GUIs. It’s an
    equivalent of MS. Excel.

    - 12. Time – is a GNU program that manages time for the user.


