    to install a virtual box in Windows.


    A virtual box is a virtual environment that allows you to install Linux within
    it. Alternatively, a virtual box can assist you in installing more than one distribution
    in your PC. One will be installed on a partition on your hard disk, and the other
    will be installed in the virtual box.


    ## CHAPTER 17. Control Privileged User


    At this point, it is time to begin discussing the security and privileges of users
    that can access your OS or server. Especially today, people seem to think that
    technology and servers are less safe than ever, but contrary to popular belief,
    there is actually plenty of support available to keep systems safe and secure.
    One such way is through controlling privileged users, which this chapter will
    teach you to do.


    In reading this chapter, you will be guided through various types of linux accounts,
    such as the root user, normal user, and system user. You will discover sudo, which
    stands for the super user do. This is the command for the system admin—it is the
    one command that allows access to everything and anything, so long as you are
    on the right account with the proper privileges to use it. Lastly, you will be
    walked through the sudoers file. This file is essentially the underlying programming
    behind the sudo—it controls the sudo and who has access to the sudo command in
    the first place.


    All of this will help you juggle the users on your server or machine, allowing
    you to ensure that the proper security systems are in place. With everything in
    place and a secure system, you are able to rest easy and feel like your system
    is truly safe.


    ## Types of Linux Accounts


    First, we will be discussing the root, normal, and system users before progressing
    to anything beyond this. You must have a complete understanding of these three
    user account types to really understand how sudo and sudoers play into the security
    of the system.


    Because Linux is so incredibly flexible, you have the option to create several
    different types of accounts. In fact, you can have root accounts if you need them,
    or accounts with different permissions in different categories. All that matters
    is that the needs you have are met effectively.


    Keep in mind that just because you have root accounts does not mean that you should
    not have some sort of security system in place—you should absolutely have a password
    protecting the root accounts to ensure that no one else is ever able to access
    those files and overtake them without your permission at all. This means that
    you will be able to ensure that the files themselves have yet another layer of
    protection. Now, without further ado,


    let''s begin to dig into the three primary user types of Linux.


    ## Root user


    The first user that you must know is the root user. This is also commonly referred
    to as the super user, especially in the acronym sudo. The super user or root user
    is the individual that is on the default admin account. This person has full control
    over the system, much like an administrative account would have control over Windows.
    With the root privileges that are given by default, this user is able to execute
    any of his or her commands and directly control or alter the services and accounts
    of other people.


    Effectively, this should be your account if you are the one setting up the system.
    This account is the one that is able to rule over the other accounts, managing
    and monitoring them all without need for extra permissions. All permissions are
    granted for the root user. They are able to change the permissions of other users,
    move files around, change the ownership of files, and do anything else within
    the system.


    Keep in mind that, because you have the power to do literally anything within
    the program, you will not have the OS telling you not to do something. There is
    no safeguard for you, and you must be careful when using this account. If you
    delete a system file, there may be no hope for going back if you have not been
    regularly keeping archives and backups of your file. If there is a user that is
    capable of doing catastrophic damage to your program, it is the super user or
    root user. Linux assumes that the root user has a pretty good grasp over what
    they are doing, and because of that, if you are unsure of what you are doing at
    any point in time, it is better safe than sorry, and you should try reaching out
    to someone else if you think it is necessary. Overall, while this should be your
