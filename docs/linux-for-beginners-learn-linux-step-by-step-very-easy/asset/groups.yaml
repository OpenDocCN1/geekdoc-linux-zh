    user, however, is normally a real person, while the system user is typically a
    user reserved for software to utilize if necessary.


    The normal user will have a real login shell and its own home directory, and each
    user will also be assigned a UID—a user identification. If this went unspecified
    during the creation of the new user with the useradd command, then the UID is
    typically automatically selected for you.


    Essentially, however, this user does not have any special admin powers or superuser
    status. The normal user is able to access any files that have not been otherwise
    marked as unavailable, and the privileges of the normal user can be changed regularly
    depending on what is necessary for the user at any given time.


    Most likely, if you are running Linux on your own device, you will have a root
    account, the administrative account that was used to set the entire OS, to begin
    with, and then you will also set yourself up with a normal user account to ensure
    that you do not accidentally delete something critical or destroy something important.
    This is your sort of safeguard against an accident.


    The normal user’s permissions can be customized by the root user—you can grant
    yourself any permissions that you desire on the normal account from the root account,
    so long as you know the right way to code it.


    ### System user


    The system user, as briefly touched upon, is granted the same initial privileges
    as the normal user. However, the system user is almost always some sort of software
    or program, such as a daemon, that will be running in the background and will
    likely be particularly interactive. This user classification primarily exists
    just for organizational purposes. When you are able to dictate the account as
    a system account, you know at a glance that it is not going to involve any sort
    of people interacting with it. There may be a daemon running the user, no person
    will ever belong on.


    While in the real world, this may not necessarily matter technically, it is nice
    to be able to see at a glance how many human users you have as opposed to daemons
    running specific software. Usually, these system accounts are created by the operating
    system during installation, and the OS retains their control. They usually have
    very specific user ids that you can identify within the root account.


    Because these service users will be running processes necessary for the OS, they
    should be left alone when you are altering, ending, or resetting any processes.
    You want to make sure you leave these service users alone as much as possible
    to protect yourself from damaging the software. If you were to damage one of these,
    it is quite possible that you would destroy the entire OS, which is unfortunately
    easy to do if you are not paying attention.


    # Sudo


    Now, it is time to discuss sudo. If you are using sudo before a command, you essentially
    push it up. You tell the system that you are commanding this particular process
    with elevated privileges that should be respected. Usually, the elevated privileges
    are what the system checks to ensure that you are actually granted the privilege
    to make any alterations that you are actually making.


    If you have been using Windows, you already have interaction with a sort of example
    of this account. When you install software, have you noticed how certain installations
    will trigger a prompt to pop up and ask if you are certain that you wish to proceed
    and ask for you to give the software the permission it needs to proceed? That
    is what you are doing in Sudo. You are effectively giving that permission, but
    instead of with a click of a button, you are telling the system that you have
    elevated access to the system and should be respected.


    If you have been primarily using macOS until now, you have a similar sort of safeguard
    when you trigger downloads that may be recognized as dangerous or will create
    major alterations to the OS. On a Mac, you will see a security box pop up, and
    you must then provide the system with your password to confirm that you do, in
    fact, want to perform that change on the system.


    Effectively, then, Sudo is your privilege pass. It is the magic passphrase that
    tells your system that you are in charge—so long as the privileges on your user
    account match.


    # Using Sudo


    When you are ready to use Sudo, you do not have to try very hard. Effectively,
    all you have to do is add sudo before the command that you are trying to push
    forward. If you do this, your program should then ask you for the account password
    for the account that you are on. If you provide this password and your credentials
    check out, it will perform the function.


    For example, imagine that you want to reboot your system. As you may recall, the
    command to trigger your system to reboot is simply reboot.


    However, reboot requires sudo privileges. If you were to simply try commanding
    your system with just reboot, it would tell you that you must be a superuser in
    order to execute that particular command.


    That is where you would then escalate your command. At that point, you can add
    to your command, creating an input of:

    $ sudo reboot


    Your system then asks for the account password, and upon entering the password,
    it reboots as requested.


    ### Su instead of sudo


    This is perhaps one of the safest ways that you can use to elevate your privilege
    to trigger the system to obey. There are others, such as the switch user command,
    known as “su.” However, when you use the switch command, you are asked for the
