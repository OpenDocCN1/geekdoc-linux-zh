    # CHAPTER 10. User and Group'
- md: "\n# Management\n\nIn this chapter, we will learn about users and groups in\
    \ Linux and how to manage them and administer password policies for these users.\
    \ By the end of this chapter, you will be well versed in the role of users and\
    \ groups on a Linux system and how they are interpreted by the operating system.\
    \ You will learn to create, modify, lock and delete user and group accounts, which\
    \ have been created locally. You will also learn how to manually lock accounts\
    \ by enforcing a password-aging policy in the shadow password file.\n\n# Users\
    \ and Groups\n\nIn this section, we will understand what users and groups are\
    \ and what is their association with the operating system.\n\n### Who is a user?\n\
    Every process or a running program on the operating system runs as a user. The\
    \ ownership of every file lies with a user in the system. A user restricts access\
    \ to a file or a directory. Hence, if a process is running as a user, that user\
    \ will determine the files and directories the process will have access to.\n\n\
    You can know about the currently logged-in user using the `id` command. If you\
    \ pass another user as an argument to the `id` command, you can retrieve basic\
    \ information of that other user as well.\n\nIf you want to know the user associated\
    \ with a file or a directory, you can use the `ls -l` command and the third column\
    \ in the output shows the username.\n\nYou can also view information related to\
    \ a process by using the `ps` command. The default output to this command will\
    \ show processes running only in the current shell. If you use the `ps` option\
    \ in the command, you will get to see all the processes across the terminal. If\
    \ you wish to know the user associated with a command, you can pass the `-u` option\
    \ with the `ps` command and the first column of the output will show the user.\n\
    \nThe usernames are mapped to numbers using a database in the system. There is\
    \ a flat file stored at `/etc/passwd`, which stored the information of all users.\
    \ There are seven fields for every user in this file.\n\n`username:password:UID:GID:GECOS:/home/dir:shell`\n\
    \n- **username**: Username is simply the pointing of a user UID to a name so that\
    \ humans can retain it better.\n- **password**: This field is where passwords\
    \ of users used to be saved in the past, but now they are stored in a different\
    \ file located at `/etc/shadow`.\n- **UID**: It is a user ID, which is numeric\
    \ and used to identify a user by the system at the most fundamental level.\n-\
    \ **GID**: This is the primary group number of a user.\n- **GECOS**: This is a\
    \ field using arbitrary text, which usually is the full name of the user.\n- **/home/dir**:\
    \ This is the location of the home directory of the user where the user has their\
    \ personal data and other configuration files.\n- **shell**: This is the program\
    \ that runs after the user logs in. For a regular user, this will mostly be the\
    \ program that gives the user the command line prompt.\n\n### What is a group?\n\
    Just like users, there are names and group ID GID numbers associated with a group.\
    \ Local group information can be found at `/etc/group`.\n\nThere are two types\
    \ of groups: Primary and supplementary. Let’s understand the features of each\
    \ one by one.\n\n#### Primary Group:\nThere is exactly one primary group for every\
    \ user. The primary group of local users is defined by the fourth field in the\
    \ `/etc/passwd` file where the group number GID is listed. New files created by\
    \ the user are owned by the primary group. The primary group of a user by default\
    \ has the same name as that of the user. This is a User Private Group (UPG) and\
    \ the user is the only member of this group.\n\n#### Supplementary Group:\nA user\
    \ can be a member of zero or more supplementary groups. The primary group of local\
    \ users is defined by the last field in the `/etc/group` file. For local groups,\
    \ the membership of the user is identified by a comma-separated list of user,\
    \ which is located in the last field of the group's entry in `/etc/group`.\n\n\
    `groupname:password:GID:list,of, users, in, this,group`\n\nThe concept of supplementary\
    \ groups is in place so that users can be part of more group and in turn have\
    \ to resources and services that belong to other groups in the system.\n\n# Getting\
    \ Superuser Access\n\nIn this section, we will learn about what the root user\
    \ is and how you can be the root or superuser and gain full access over the system.\n\
    \n### The root user\nThere is one user in every operating system that is known\
    \ as the superuser and has all access and rights on that system. In a Windows-based\
    \ operating system, you may have heard about the superuser known as the administrator.\
    \ In Linux, the superuser is known as root.\n\nThe root user has all access and\
    \ rights on that system. You can use the root user to perform tasks such as installing\
    \ new software or removing existing software. However, with great power comes\
    \ great responsibility. If a user becomes the root user and gain all the powers\
    \ of the root user, they could then make critical changes to the system like restarting\
    \ the system and delete an entire directory like `/etc`. Therefore, it is always\
    \ advisable that you use the root user only when absolutely required.\n\n### Using\
    \ Su to Switch Users\nYou can switch to a different user in Linux using the `su`\
    \ command. If you do not pass a username as an argument to the `su` command, you\
    \ will be prompted to enter the password of the account you want to switch to.\
    \ However, if you invoke the command as a regular user, you will need to enter\
    \ the password of the account that you are trying access to.\n\n```bash\nstudent@desktop\
    \ ~$ su -\nPassword: \nroot@desktop]#\n```\n\nIf you use the command `su username`,\
    \ it will start a session in a non-login shell. But if you use the command `su\
    \ - username`, there will be a login shell initiated for the user. This means\
    \ that using `su - username` sets up a new and clean login for the user whereas\
    \ just using `su username` will retain all the settings of the current shell.\n\
    \n# sudo and the root\nThere is a very strict model implemented in Linux operating\
    \ systems for users. The root user has the power to do everything while other\
    \ users can do nothing related to the system. The common solution, which was followed\
    \ in the past was to allow the normal user to become the root user using the `su`\
    \ command for a temporary period until the required task was completed. This,\
    \ however, has the disadvantage that a regular user literally would become the\
    \ root user and gain all the powers of the root user. Also, gaining access to\
    \ become the root user would involve another issue that every user switching to\
    \ the root user would need to know the password of the root user, which is not\
    \ a very good idea.\n\nThis is where the `sudo` command comes into the picture.\
    \ The `sudo` command lets a regular user run command as if they are the root user,\
    \ or another user, as per the settings defined in the `/etc/sudoers` file. While\
    \ other tools like `su` require you to know the password of the root user, the\
    \ `sudo` command requires you to know only your password for authentication, and\
    \ not the password of the account that you are trying to gain access to. By doing\
    \ this, it allows the administrator of the system to allow a certain list of privileges\
    \ to regular users such that they perform system administration tasks, without\
    \ actually needing to know the root password.\n"
  mdcn: "\n\n# 管理\n\n在本章中，我们将学习 Linux 中的用户和用户组，以及如何管理它们，并为这些用户制定密码策略。在本章结束时，你将非常熟悉用户和用户组在\
    \ Linux 系统中的作用，以及操作系统是如何解释它们的。你将学习创建、修改、锁定和删除本地创建的用户和组账户。你还将学习如何通过在影子密码文件（shadow\
    \ file）中强制密码年龄策略来手动锁定账户。\n\n# 用户与组\n\n在本节中，我们将理解什么是用户和用户组，以及它们与操作系统的关系。\n\n###\
    \ 什么是用户？\n操作系统上的每个进程或运行的程序都以用户的身份运行。系统中每个文件的所有者都是系统中的一个用户。用户限制了对文件或目录的访问。因此，如果一个进程以某个用户的身份运行，该用户将决定该进程可以访问的文件和目录。\n\
    \n你可以使用 `id` 命令查看当前登录的用户。如果你将另一个用户作为参数传递给 `id` 命令，你也可以获取该其他用户的基本信息。\n\n如果你想知道与某个文件或目录关联的用户，可以使用\
    \ `ls -l` 命令，输出中的第三列显示了用户名。\n\n你还可以通过 `ps` 命令查看与进程相关的信息。该命令的默认输出仅显示在当前 shell 中运行的进程。如果你在命令中使用\
    \ `ps` 选项，你将看到跨终端的所有进程。如果你想知道与某个命令关联的用户，可以为 `ps` 命令传递 `-u` ，输出的第一列将显示用户。\n\n用户名使用系统中的数据库映射为数字。`/etc/passwd`\
    \ 处存储着一个平面文件，存储了所有用户的信息。该文件中的每个用户有七个字段。\n\n`username:password:UID:GID:GECOS:/home/dir:shell`\n\
    \n- **username**: 用户名简单地将用户 UID 映射到一个名称，以便人类更好地记忆。\n- **password**: 该字段过去是保存用户密码的地方，但现在它们存储在位于\
    \ `/etc/shadow` 的不同文件中。\n- **UID**: 用户 ID，是一个数字，用于系统在最基础层面上识别用户。\n- **GID**: 这是用户的初始组组\
    \ ID。\n- **GECOS**: 这是一个使用任意文本的字段，通常是用户的全名。\n- **/home/dir**: 这是用户主目录的位置，用户在此处存放个人数据和其他配置文件。\n\
    - **shell**: 这是用户登录后运行的程序。对于普通用户，这通常是为用户提供命令行提示符的程序。\n\n### 什么是组？\n就像用户一样，组也有相关的名称和组\
    \ ID (GID) 数字。本地组信息可以在 `/etc/group` 中找到。\n\n组有两种类型：主组和附加组。让我们逐一理解它们的特。。\n\n####\
    \ 主组（Primary Group）：\n每个用户恰好有一个主组。本地用户的主组由 `/etc/passwd` 文件中的第四字段定义，该字段列出了组号 GID。用户创建的新文件属于主组。默认情况下，用户的主组名称与用户名相同。这是一种用户私有组（UPG），用户是该组的唯一成员。\n\
    \n#### 附加组（Supplementary Group）：\n用户可以是零或多个附加组的成员。本地用户的主组由 `/etc/group` 文件中的最后一个字段定义。对于本地组，用户的成员身份通过逗号分隔的用户列表来确标识，该列表位于\
    \ `/etc/group` 中组条目的最后一个字段。\n\n`groupname:password:GID:list,of, users, in, this,group`\n\
    \n引入附加组的概念是为了让用户能够属于更多组，从而获得系统中属于其他组的资源和服务。\n\n# 获取超级用户权限\n\n在本节中，我们将学习什么是 root\
    \ 用户，以及你如何成为 root 或超级用户并获得系统的完全访问权限。\n\n### root 用户\n每个操作系统中都有用户被称为超级用户，他们拥有该系统所有的访问权限和权利。在基于\
    \ Windows 的操作系统中，你可能听过被称为管理员（administrator）的超级用户。在 Linux 中，超级用户被称为 root。\n\nroot\
    \ 用户拥有该系统所有的访问权限和权利。你可以使用 root 用户执行诸如安装新软件或删除现有软件等任务。然而，能力越大责任越大。如果一个用户变成了 root\
    \ 用户并获得了 root 用户的所有权力，他们就可以对系统进行关键更改，例如重启系统和删除像 `/etc` 这样的目录。因此，建议只在绝对必要时才使用 root\
    \ 用户。\n\n### 使用 su 切换用户\n你可以使用 `su` 命令在 Linux 中切换到不同的用户。如果你不将用户名作为参数传递给 `su` 命令，将提示你输入想要切换到的账户的密码。然而，如果你以普通用户身份调用该命令，你需要输入你尝试访问的账户的密码。\n\
    \n```bash\nstudent@desktop ~$ su -\nPassword: \nroot@desktop]#\n```\n\n如果你使用命令\
    \ `su username`，它将在非登录 shell 中启动会话。但如果你使用命令 `su - username`，将为用户启动一个登录 shell。这意味着使用\
    \ `su - username` 为用户设置了一个全新的、干净的登录，而仅使用 `su username` 将保留当前 shell 的所有设置。\n\n\
    # sudo 与 root\nLinux 操作系统对用户实施了非常严格的模型。root 用户有权做任何事情，而其他用户无法进行任何与系统相关的操作。过去遵循的常用解决方案是允许普通用户通过\
    \ `su` 命令临时成为 root 用户，直到完成所需任务。然而，这种做法的缺点是，普通用户从字上变成了 root 用户，并获得了 root 用户的所有权力。此外，获得成为\
    \ root 用户的权限还会涉及另一个问题，即每个切换到 root 的用户都需要知道 root 用户的密码，这并不是一个好主意。\n\n这就是 `sudo`\
    \ 命令派上用场的地方。`sudo` 命令允许普通用户根据 `/etc/sudoers` 文件中定义的设置，像 root 用户或其他用户一样运行命令。虽然像\
    \ `su` 等其他工具需要你知道 root 用户的密码，但 `sudo` 命令仅要求你知道自己的密码进行身份验证，而不需要你尝试访问的账户的密码。通过这种方式，系统管理员允许普通用户拥有某些权限列表，以便他们执行系统管理任务，而无需实际上知道\
    \ root 密码。\n\n"
