    ## 第 17 章：控制特权用户


    此时，是时候开始讨论访问你操作系统或服务器的用户的安全和权限问题了。尤其是在今天，人们似乎认为技术和服务器比以往任何时候都更不安全，但与大众的认知相反，实际上有大量的支持来保持系统的安全和可靠。其中一种方法就是通过控制特权用户，本章将教你如何操作。


    在阅读本章时，你将学习各种类型的 Linux 账户，例如 root 用户、普通用户和系统用户。你将发现 sudo，它的意思是“super user do”（超级用户执行）。这是给系统管理员的命令——只要你处于正确的账户并拥有使用它的适当权限，该命令就允许你访问任何事物和任何地方。最后，你将带你了解
    sudoers 文件。该文件本质上是 sudo 背后的底层程序——它控制 sudo 以及在最开始谁有权访问 sudo 命令。


    所有这些都将帮助你管理服务器或机器上的用户，让你能够确保部署了适当的安全系统。当万一切就绪且系统安全后，你就可以放心了，感觉你的系统是真正安全的。


    ## Linux 账户类型


    首先，我们将在讨论 root、普通用户和系统用户，然后再进入其他内容。你必须对这三种用户账户类型有完全的理解，才能真正理解 sudo 和 sudoers 是如何在系统安全性中发挥作用的。


    由于 Linux 是极其灵活的，你有权创建几种不同类型的账户。事实上，如果你有需要，可以拥有 root 账户，或者在不同类别中拥有不同权限的账户。所有重要的是你的需求能够得到有效满足。


    请记住，仅仅因为你拥有 root 账户并不意味着你不应该设置某种安全系统——你绝对应该有一个密码来保护 root 账户，以确保没有其他人能够访问这些文件并在未经你许可的情况下接管它们。这意味着你能够确保文件本身具有另一层保护。现在，废话不再说，


    让我们开始深入研究 Linux 的三类主要用户类型。


    ## root 用户


    你必须了解的第一个用户是 root 用户。这也被称为超级用户（super user），特别是在 sudo 缩写中。超级用户或 root 用户是默认管理员账户的个人。这个人对系统具有完全控制权，就像管理员账户对
    Windows 的控制权一样。凭借默认赋予的 root 权限，该用户能够执行任何命令，并直接控制或更改他人的服务和账户。


    实际上，如果你是设置系统的人，那么这个账户应该是你的账户。该账户能够统治其他账户，在不需要额外权限的情况下管理和监控所有账户。所有权限都授予了 root 用户。他们能够更改其他用户的权限、移动文件、更改所有权以及在系统内进行任何操作。


    请记住，由于你拥有在程序内执行任何操作的力量，系统不会阻止你做某些事。你没有任何安全措施，在使用此账户时必须小心。如果你删除了系统文件，由于没有定期进行备份，可能无法挽回。如果有一个能够对你的程序造成破坏性损坏的用户，那就是超级用户或
    root 用户。Linux 假设 root 用户对自己所做的有很好的掌握，正如此，如果你在任何时候不确定自己在做什么，宁可胜过没有，如果你认为必要，应该尝试寻求他人的帮助。总的来说，虽然这应该是你拥有自己权限的账户，但你也应该尽可能避免使用此账户，以确保你没有毁一切的风险。在非常特定的情况下你才应该使用
    root。否则，对于大多数日常功能，使用普通账户可能就没问题。当然，每当你尝试需要使用 root 的任务时，都应该确保在必要时进行切换，并在尝试任何操作之前备份数据。特别是，你需要使用
    root 权限将文件或目录从系统目录移入或取出。记住，系统目录是那些直接负责操作系统运行的目录，没有它们，你就无法运行操作系统。当你尝试将任何文件复制到系统目录、更改其他用户的用户权限、进行某些系统修复以及偶尔安装程序时，也需要
    root 权限。通常情况下，如果一个文件需要 root 权限才能安装，是因为该文件本身将直接与系统目录交互。如果你没有执行上述任何操作，就避免它，省去你可能搞砸的麻烦。


