    ### 什么是漏洞？


    漏洞是主机系统中的缺陷，它允许黑客通过创建针对漏洞的利用程序来创建后门进入系统。例如，勒索软件利用了 Windows 中的一个漏洞利用了全球数百个系统。Web
    应用程序也容易产生漏洞。XSS 漏洞、CSRF 检测等被 OWASP 宣布为高风险漏洞，它 决定了漏洞的严重程度。


    ## 什么是自动漏洞扫描？


    在编码完成后，可以通过手动测试很容易发现漏洞。然而，这非常无聊且耗时，许多人会避免这样做。出于此目的，开发了某些自动化扫描工具来扫描系统并检测与其数据库中匹配的任何漏洞。像
    Nessus 和 Burp suite 等软件使得这种自动扫描变得高效，如果操作得当，很容易获得良好的结果。


    ## Nessus


    Nessus 被认为是一种自动扫描工具，拥有包含已知漏洞的广泛数据库，工具将使用它来扫描目标并为攻击者提供结果。对于渗透测试人员来说，Nessus 是基本工具之一。Nessus
    通常包含数个更新漏洞、多种扫描选项、易于使用的图形界面和有效的报告功能。Nessus 受人们喜爱是因为它具有几个特性。


    它是如何工作的：

    为了提供完善的计算机漏洞扫描服务并随时更新其漏洞数据库；与传统的漏洞扫描软件不同，Nessus 可以同时分析和扫描系统的漏洞，并根据系统资源调整其效率。如果主机配置了更多资源（如更快的
    CPU 速度或更大的内存容量），由于资源丰富，其性能可以提高；它可以定义自己的插件；NASL（Nessus 攻击脚本语言）是 Tenable 发布的一种语言，用于编写
    Nessus 安全测试选项；完全支持 SSL（安全套层）。Kali Linux 中预装了 Nessus，可以从菜单或使用搜索框打开。它具有 GUI 且易理解。在
