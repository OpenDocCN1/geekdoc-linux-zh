    file in the screen. The cursor will also be positioned on the first line:


    Image from: Linux All-in-One for Dummies


    The last line that you see in this example shows the pathname, along with the
    number of lines and characters in the file. You will also notice that the file
    is read-only. This means that you are viewing the file as a normal user. You may
    have also noticed that since the number of lines does not occupy the rest of your
    screen, the unused lines are marked with the tilde (~) sign. The current line
    is marked by a black rectangle on top of the character that is being edited.


    The vi editor allows you to enter the following modes:


    - Visual command – this is the default mode, wherein everything that you key in
    is considered Linux as a command to be applied to the current line. All vi commands
    are the same as ed commands.


    - Colon command – this mode is set for writing or reading files, setting up options
    for vi, and exiting vi. As the name implies, all commands in this mode start with
    the colon. When you key in the colon symbol, the editor moves the cursor to the
    last line and then prompts you to enter the command. The editor will apply the
    command once you hit the Enter key.


    - Text input – this is the mode that you need to use when you want to enter text
    into the file. You are able to enter this mode when you use the following commands:


