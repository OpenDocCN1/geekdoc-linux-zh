- md: "\n# Image: expr operators\n\n![](img/c36fb91b72c448ecf582a3158c4a46b0_182_0.png)\n\
    \n# Examples:\n\n> Note: The 2 * 2 expression returns a syntax error. We have\
    \ to use an escape character to resolve the problem.\n\n```bash\nRather than using\
    \ the expr command, it is more convenient to use brackets. #!/bin/bash\nvar1=2\n\
    var2=6\nvar3=3\nvar4=$(expr var1 \\* var2)\necho $var4\nvar5=$($var1 * $var2)/$var3\n\
    echo $var5\n```\n\n```\njan@jan-virtual-machine:~/Desktop$ .Myscript\n12\n4\n\
    ```\n\n# The Bash Calculator\n\nWhen you want to perform more complex mathematical\
    \ functions, there is a built-in bash tool to perform this. It is the bash calculator.\
    \ The command is bc.\n\n```bash\njan@jan-virtual-machine:~/Desktop$ bc\nbc 1.07.1\n\
    Copyright 1991-1994, 1997, 1998, 2000, 2004, 2006, 2008, 2012-2017 Free Software\n\
    Foundation, Inc.\nThis is free software with ABSOLUTELY NO WARRANTY.\nFor details\
    \ type 'warranty'.\nquit\n```\n\n![](img/c36fb91b72c448ecf582a3158c4a46b0_183_0.png)\n\
    \nThe bash calculator supports the following.\n\n- Numerical values (integer and\
    \ floating-point numbers)\n- Variables.\n- Expressions.\n- Functions.\n- Statements\
    \ (i.e., if-then-else)\n- Comments.\n\n```bash\njan@virtual-machine:~/Desktop$\
    \ bc\nbc 1.07.1\nCopyright 1991-1994, 1997, 1998, 2000, 2004, 2006, 2008, 2012-2017\
    \ Free Software\nFoundation, Inc.\nThis is free software with ABSOLUTELY NO WARRANTY.\n\
    For details type 'warranty'.\n1 * 4\n1.56 *\n3.12\n1.2222*2\n2.4444\n0.85/5\n\
    1\n```\n\nIn the last line, you can see a problem. 8.45/5 = 1. This is inaccurate\
    \ unless it is rounded up.\nThe problem here is the number of decimal places.\
    \ It is handled by a built-in variable known as scale. To receive the intended\
    \ output, we need to modify the scale.\n\n```bash\nJan@jan-virtual-machine:~/Desktop$\
    \ bc\nbc 1.07.1\nCopyright 1991-1994, 1997, 1998, 2000, 2004, 2006, 2008, 2012-2017\
    \ Free Software\nFoundation, Inc.\nThis is free software with ABSOLUTELY NO WARRANTY.\n\
    For details type 'warranty'.\nscale=5\n8.45/5\n1.69000\n```\n\n> Tip: To remove\
    \ the description you get with bc, use the -c.\n\nThe bc command supports variables.\
    \ The following example uses variables instead of numerical values.\nThe next\
    \ important task is to get bc working in a script. In this case, we need to depend\
    \ on pipes.\n\n```bash\n#!/bin/bash\nvar1=10\nvar2=2\nvar3=$(echo \"$var1 ^ \\\
    $var2\" | bc)\necho \"The answer is: $$var3\"\n```\n\n```bash\njan@jan-virtual-machine:~/Desktop$\
    \ ./.Myscript\nThe answer is: 100\n```\n\nAnother example using the scale option.\n\
    ```bash\n#!/bin/bash\nvar1=10\nvar2=3\nvar3=$(echo \"scale=3; \\$var1 / \\$var2\"\
    \ | bc)\necho \"The answer is: \\$var3\"\n```\n\n```bash\njan@jan-virtual-machine:~/Desktop$\
    \ ./.Myscript\nThe answer is: 3.333\n```\n\nThe next example will be looking into\
    \ how the inline input operator can be used with the bc command in a script.\n\
    \n```bash\n#!/bin/bash\nvar1=8\nvar2=1.75\nvar3=3\nvarF=$(bc << EOF # EOF stands\
    \ for End of File\nscale = 4\nv1 = ($var1 * $var2)\nv2 = ($var1 / $var3)\nv1 +\
    \ v2\nEOF\necho The final calculation is: $varF\n```\n\n```bash\njan@jan-virtual-machine:~/Desktop$\
    \ \n./Myscript\nThe final calculation is: 16.666\n```\n\n# CHAPTER 15\n## Securing\
    \ Your Linux Server\n\nIf you don't incorporate security considerations into every\
    \ step of your planning and every layer of your actual deployment, then you can\
    \ be fairly confident that someday something is going to happen. In this chapter\
    \ you are going to learn about permissions, metadata associated with all Linux\
    \ filesystem objects that control who gets to do what.\n\nFirst I will be talking\
    \ about hardening your server by regularly applying software updates and patches,\
    \ and by ensuring that there aren't any network ports sitting open and unprotected.\
    \ Next, we will discuss protecting your data at rest and in transit by encrypting\
    \ your disks, websites, and email servers. But it will be nice to see those permissions\
    \ and attributes in action. While I explain how to do that, you'll also learn\
    \ just how Linux permissions actually work.\n\nEvery object in a Linux filesystem,\
    \ whether it's a file or a directory, has unique metadata associated with it.\
    \ This metadata is represented by characters displayed when you run “ls” with\
    \ the “l-” argument where “l” stands for the long version. If you check out “cd”\
    \ to the secret directory and then type “su bob”. The command “su” stands for\
    \ switch user. And this means you will use “touch” to have Bob create a new file\
    \ called “data.txt”. If Bob wasn't a member of the “secret group” group and if\
    \ the secret directory wasn't owned by “secret group”, then he wouldn't be able\
    \ to create the file.\n\nThe permissions of a file are divided into three categories:\
    \ the owner, the group, and others. Each of these categories can have three permissions:\
    \ read, write, and execute. These permissions are represented by the characters\
    \ r, w, and x. For a directory, the permissions mean something slightly different:\
    \ read allows you to list the contents of the directory, write allows you to create\
    \ or delete files within it, and execute allows you to enter the directory.\n\n\
    When you run ls -l, you will see a string of characters that represents the permissions\
    \ of a file. For example:\n\n-rw-r--r-- 1 bob secret 4096 Jan 1 12:00 data.txt\n\
    \nIn this example, -rw-r--r-- means that the owner (bob) has read and write permissions,\
    \ the group (secret) has read permissions, and others also have read permissions.\
    \ The first character indicates the type of file: a dash - for a regular file,\
    \ a d for a directory.\n\nTo change the permissions of a file, you use the chmod\
    \ command. For example, to add the execute permission to the owner, you would\
    \ use:\n\nchmod u+x data.txt\n\nTo remove the write permission from the group,\
    \ you would use:\n\nchmod g-w data.txt\n\nYou can also use numeric notation to\
    \ change permissions. For example, chmod 755 data.txt would set the owner to have\
    \ read, write, and execute permissions, and the group and others to have only\
    \ read and execute permissions.\n\nThe chown command is used to change the ownership\
    \ of a file. For example, to change the owner of data.txt to alice, you would\
    \ use:\n\nchown alice data.txt\n\nThe chgrp command is used to change the group\
    \ of a file. For example, to change the group of data.txt to developers, you would\
    \ use:\n\nchgrp developers data.txt\n\nUnderstanding and managing permissions\
    \ is essential for securing your Linux server. By properly configuring permissions,\
    \ you can ensure that only authorized users have access to sensitive files and\
    \ directories.\n"
