    ## CHAPTER 12. Using Linux Text Editors


    Even though you are capable of using a desktop that has a functional graphic interface,
    you will find the desire to interact with the Linux environment by editing and
    creating files using editors that belong outside the GUI. Learning how to use
    text editors will allow you to make your own shell scripts and communicate with
    the programs that you want to run in your operating system. At the same time,
    you will also be able to fix possible problems in your configuration files, especially
    when the X Window System fails to load.


    In this chapter, you will learn how to use GUI and text mode editors, which will
    both allow you to configure and create text files.


    ### How to Use GUI Text Editors


    The GUI desktops KDE and GNOME come with built-in text editors that have their
    own graphical user interfaces. You can load these editors from the main menu.
    For example, if you want to open the GUI text editor for GNOME, navigate to Applications->Text
    Editor and then select the file edit. Once the editor loads, you can select the
    Open option found on the toolbar and then pull up a file that you want to edit
    or change directories that contain the file that you want in the dialog box labeled
    Open File.


    GNOME’s text editor is also capable of loading multiple files at a time and even
    switch in between windows to work with them. A typical editing session will look
    like this:


