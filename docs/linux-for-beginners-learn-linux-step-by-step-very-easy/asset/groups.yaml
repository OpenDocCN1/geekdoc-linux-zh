    There was another study in 2007. This system was performed on Debian v4.0. This
    system would have cost around 8.66 billion US dollars to develop conventionally.
    It had 283 million lines of code and, if a single person were to make it, it would
    have taken them seventy-three thousand years. This speaks volumes on what kind
    of project Linux is.


    You can easily say that it is quite something based on the sheer volume of work
    that has been put into it.


    ## What Makes Linux Different?


    As I have mentioned before, Linux does the same job any other operating system
    would. What makes Linux special, however, is the fact that it is open source.
    In fact, it is the most used open-source operating system. This means that the
    source code used to create Linux is available to the public for viewing and editing.
    This also means that talented individuals can contribute to the development of
    Linux by adding some improvements to the system. On top of that, the system is
    highly customizable. There are many versions, also known as distributions that
    are different from one another. They come in different kinds of software. Even
    though the core part of the system is mostly the same, you can choose different
    browsers, word processors, and applications to make your system truly your own.
    You can also change up the core components like user interface components and
    graphic components. Linux is very user-friendly and simple to use. On top of that,
    it has many ways in which you can customize it for whatever you need.


    ## How Was Linux Created?


    You must have heard of Unix, the operating system made in the 1970s. It was an
    excellent tool for its time and was used for academic and commercial needs. Similar
    to Linux, Unix had plenty of different variations. The system started off as a
    tool for programmers that made it easier to develop software. In time, it started
    spreading in academic circles where people added their own tools and shared them
    with their colleagues. The system itself works on the Unix philosophy. This means
    that the system prefers using small, interconnected programs that have limited
    functions. All of the interconnected programs have well-defined functions and
    are very good at doing them.


    Linux started off as a way to emulate Unix as closely as possible. Many people
    tried to do the same. These programs were called “Unix-like” or “Unix-compatible,”
    but none have been as successful as Linux. Linux was the most popular and was
    the closest to Unix. It had similar ways of interfacing, file stream layouts,
    key components, and programming tools. In the sea of Unix clones, Linux managed
    to stand out. This was all thanks to the man named Linus Torvalds.


    In 1991, Torvalds took an interest in operating systems. He was frustrated by
    the licensing of MINIX which was limited to academic use. He used his outrage
    to create his system which is now known as the Linux kernel. He used MINIX as
    a platform and added most of MINIX’s apps to Linux. After that, the system kept
    maturing and evolving, eventually meeting new developments on Linux systems. Due
    to the availability of the codes that are licensed under GPL, it was seen as advantageous
    to use them. GNU replaced all of the components of MINIX. GNU Project allowed
    the codes to be used for as long as the program is released under a compatible
    license. Due to this, Torvalds switched from his original license to the GNU GPL.
    The original license did not allow for further redistribution of the software,
    however, with the license switch, the program was finally made open source. Many
    people worked on Linux in order to properly integrate the GNU components into
    the kernel. Finally, the system became operating and fully functional.


    The original name for the Linux was Freax, a wordplay on free and Unix. For a
    period of six months, the makefiles of the project included the name “Freax.”
    The name Linux, though given to the project later down the line, was considered
    as a possible name for the project even before Freax, but Torvalds found it to
    be too egotistical and dismissed it.


    Files were uploaded onto the FTP server of FUNET in order to facilitate the further
    development of Linux. This happened in September 1991 with the help of Ari Lemmle,
    a coworker of Torvalds’s at the Helsinki University of Technology, and a few other
    individuals who volunteered as administrators for the FTP server. Ari thought
    that “Freax” was not a good name. Without Torvalds’s knowledge, he changed the
    project to Linux, which, eventually, Torvalds consented to.


    Enough background info! It’s time to dive into the meat of the topic and learn
    what Linux can do for you.


    ## CHAPTER 3. File System


    Linux’s file system is outstanding when it comes to flexibility. Its design allows
    it to support regular, as well as special types of file formats. It can support
    text, programs, images, output, and input devices. Therefore, since it supports
    a variety of file formats, it can coexist with another OS.


    Moreover, in the system, there is hardly a distinguishable factor between a file
    and a directory. It follows that directions are simply locations of file stacks.


    ## Categorization of Files


    To ensure a better understanding of the Linux file system, files are categorized.
    While it is considered safe to assume, knowing more information about a particular
    file allows programmers and system administrators to avoid complexities when using
    Linux. This also prevents them from performing long listings.


    - File categories:

    - Directory (d) – a file that is a list of a stack of files

    - Link (l) – a system that allows the visibility of a particular file in multiple
    parts of a file tree

    - Pipe (p) – a system that allows inter-process communication

    - Regular (-) – a normal file

    - Socket (s) – a special file that provides inter-process networking

    - Special (c) – a mechanism used for output and input


    ## The Art of Partitioning


    Partitioning in Linux began when power failures threatened the majority of Linux
    users. There were days when an outage meant serious damages to a system.


    Moreover, the primary reason for partitioning is to achieve a much higher data
    security level. The hard disk’s division allows safe grouping and protection.


    Due to successful partitioning, you can prioritize data groups with more importance.
    When part of a hard disk is compromised, only that part of the disk is affected.
    The rest that is stored in other partitions remains untouched. Two major partitions
    in a Linux system:


    - 1. Swap – refers to extra memory or an expansion

    - 2. Data – refers to normal data; refers to the necessities for starting and
    running a system


    Recommended partitions:


    - A partition for necessary data

    - A partition for server programs and configuration data

    - A partition for programs and applications

    - At least one partition for user mails, archives, and database tables

    - At least one partition for specific files

    - At least one partition for virtual memory


    Common partitions:


    - A partition that contains personal data

    - A partition that stores temporary files

    - A partition that stores third-party data

    - A partition that is solely for programs


    ## Directories: The Root Directory & Subdirectories


    In Linux, there is a directory called The Root Directory. It serves as the main
    directory and as programmers and system administrators would refer to it, it is
    the directory of all directories.


    With The Root Directory come the subdirectories. These subdirectories manage files
    according to their assigned tasks.


    Subdirectories and their content:


    - /home – home directory

    - /boot – the kernel and startup files; files that attempt to eliminate unnecessary
    bootloaders

    - /initrd – data regarding booting information

    - /dev – contains references to all CPU hardware peripherals

    - /bin – common shared system programs

    - /etc – important systems configuration data

    - /lib – library files

    - /lost+found – retrieved data from failures

    - /opt – files from third-party sources

    - /net – remote file systems’ standard mount point

    - /misc – miscellaneous data

    - /proc – information regarding system resources

    - /mnt – external file systems’ standard mount

