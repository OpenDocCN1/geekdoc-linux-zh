    (GUI)。现在，你需要使用命令才能在这个新的操作系统系统中移动到任何地方。你应该设置一个非常安全的密码和 root（用户）名称。


    务必完全原样记录这些信息。在 Linux 中，标点符号非常重要。不同的拼写意味着完全不同的含义。你会再次看到这个提示。


    ## 万物之根


    在 Linux 中，“Root”一词有几种含义。Root 用户（Root User）是计算机的管理员（用户名为 root），它是权限最高的用户，拥有全权限。


    Root 也是 Linux 中任何事物的最高级别或核心。它还是安装位置，相当于 Windows 中的 C:/Home。可以说，它是文件系统的最高层级。Linux
    中的所有内容要么是目录，要么是目录内的文件，而这一切都在 Root 目录之下。


    命令“sudo”意味着“Super User Do”（超级用户执行）。这意味着你，作为 Root 用户（即管理员），拥有访问文件和程序的完全权限。在某些发行版中，你需要使用此命令作为某些命令的前缀。


    ## www.ubuntusererverguide.com

    ## 掌握你的命令


    与现在的绝大多数事物一样，你可以在 Google 上进行一些研究，获取大量的 Linux 命令目录。

    通过这些命令，你可以在 Linux 中导航到任何地方。然而，你不应该期望背诵这个列表，你应该开始熟悉 Linux 的语言。


    一些最重要和实用的命令将让你进入、退出和穿梭。

    为了强调和扩展之前的一个观点，你在命令中使用大小写非常重要。命令的拼写非常具体，因此注意使用正确的大小写。空格和词序也很重要。你可能无法到达任何地方，或者可能会到达一个你无意去的地方。


    在 Linux 长长的命令和命令组合列表中，还有“内置 (builtin)”命令。正如其名，内置命令已经包含在 Bash shell 自身中。当一个简单命令的第一个词是内置命令时，shell
    会执行该命令而不需要另一个程序。


    正如之前所说，每个发行版都有自己的优势和挑战。需要注意的一点是，每个发行版的命令可能相同，也可能不同。考虑到命令是导航此版本 Linux 的唯一方式，这至关重要。你绝对应该对你选择的发行版进行兼容性和用法方面的研究，你现在还需要研究该特定发行版的特定命令。


    你会发现许多命令有一些共同的根，你可以通过其他命令、关键字、文件名或程序名在某些命令的基础上进行。有几个初学者需要立即使用的命令。请跟随操作并尝试一下。


    ## 需要时获取帮助


    这里有几个上手就能知道的简单常识。这些可能是你的救生衣。“Man”页面是手册（即说明性）页面。你也会像使用“sudo”命令一样，用这个命令作为另一个命令的前缀。使用“man”会打开一个包含你需要的所有信息的屏幕，就像一个数字手册页。在需要时尝试这些变体。知道如何到达某处、如何离开以及如何寻求帮助可能看起来非常基础，但在你学习系统时，这些可能会让你非常沮丧。


    - “man –k”：搜索包含某术语的所有命令。你也可以使用“apropos”。

    - “man”：显示帮助信息。

    - “info”：显示帮助信息（方式不同）。

    - “whatis”：显示 man 页的描述。

    - “whereis”：告知 man 页的位置。


    要退出 man 页面，输入“Q”（Quit）即可退出。这是退出手册页的唯一方法。

    要退出大多数其他地方，只需输入“Exit”即可。


    命令“more”和“less”对于显示超出当前屏幕内容的文件很有用。你可能需要在帮助页面上阅读比一个屏幕能看到的更多的信息。这对于系统初学者来说尤为重要。在输入命令后，只需使用空格键向下滚动。


    要退出，输入“q”即可退出。


    ## 移动


    你很快就会发现 Linux 中有很多目录，你应该熟悉它们。虽然在 Linux 中一切都是文件，但目录是一种特殊类型的文件。目录出现在列表中，并且是相关的结构。与使用
    GUI 的方式不同，你需要命令来导航。


    正如之前提到的，命令的大小写写非常重要。命令的拼写非常具体，因此注意使用正确的大小写。空格和词序也很重要。你可能无法到达任何地方，或者可能会到达一个你无意去的地方。


    在 Linux 长长的命令和命令组合列表中，还有“内置 (builtin)”命令。正如其名，内置命令已经包含在 Bash shell 自身中。当一个简单命令的第一个词是内置命令时，shell
    会执行该命令而不需要另一个程序。


    正如之前所说，每个发行版都有自己的优势和挑战。需要注意的一点是，每个发行版的命令可能相同，也可能不同。考虑到命令是导航此版本 Linux 的唯一方式，这至关重要。你绝对应该对你选择的发行版进行兼容性和用法方面的研究，你现在还需要研究该特定发行版的特定命令。


