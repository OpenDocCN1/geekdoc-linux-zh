    拥有世界上最无忧无虑、安全且可靠的系统的声誉。这种名誉是实之名归的，Linux 的质量变得越来越明显。


    Linux 是一个灵活的工具，可以针对你可能感兴趣的任何工作进行定制。用户始终可以进一步开发它，这意味着它将一直处于越来越好的过程中。Linux 完全依靠社区本身的这一事实让
    Linux 成了一项更令人印象深刻的成就。这也让 Linux 看起来更可靠，因为在发行过程中没有贪婪因素介入。该系统是根据需求提供的，并随着需求增长。


    Linux 的不同变被称为发行版（Distributions）。发行版是不同组件的软件包，包含了内核和支持库。其中大部分是由 GNU 项目提供的。尽管大多数发行版在名称中使用了“Linux”一字，但这引起了自由软件组织的争议。

