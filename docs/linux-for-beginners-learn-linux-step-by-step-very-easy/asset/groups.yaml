    Install Ubuntu. You will have to be connected to a power source if you are using
    a laptop because the process could drain your battery.

    You need to be connected to an internet source as well.


    Decide what to do with your other operating system. You will be given two options;
    whether to install Ubuntu Linux alongside the other operating system or to replace
    the old operating system with Ubuntu. If you choose to have the two, you will
    always be required to choose the operating system to use every time you reboot
    your computer.


    Set your partition size. This will be necessary if you will choose to have the
    two operating systems on your computer. You can use the slider to adjust the amount
    of space you want to set aside for Ubuntu. Remember that you will also need enough
    space for files and programs, therefore, leave out enough space for your new system.
    Choose your location. This happens automatically if you are connected to the internet.


    Set your keyboard layout. The right thing to do here is to click detect keyboard
    layout Ubuntu to automatically choose the right one.


    Enter your login information. Set a username and password. You can choose to have
    Ubuntu log you in automatically, or you can always enter your login information
    whenever you want to use your computer.


    Wait for the installation process to finish.

    Restart the computer once the installation is finished and Ubuntu will load.


    ## 2. Windows Installer


    The windows installer will install Linux alongside the other operating system
    that you are using. The programs and files will not be affected, but you will
    always have to choose the operating system to use whenever you reboot your computer.


    - Download the installer from Ubuntu website.

    - You can select run, save or open if your browser prompts you to do that.

    - Create a username and password that you will be using to log in to the computer

    - Click Install to start the process

    - Restart your computer once the installation is finished and choose Ubuntu Linux
    as the operating system to load


    Important Note:


    - It is always a good idea to run such a program on CD or DVD in order to have
    a first look at it; then, install it if you like what you see. Test driving will
    help you in making a decision you will not regret when it comes to installing
    operating systems.

    - Make sure that you backup all your files, programs, personal data and settings
    first installations begin so that you will not lose them.


    ## Installing New Software on Linux


    Installing new software on Linux Operating System is as easy as it is when you
    are installing the operating system itself. Everything has been made very easy
    for the users. This is, therefore, no reason to worry you have been having a hard
    time installing a anew system on other operating systems in the past.


    Most of the Linux distributions have an app store, or something close to that,
    which represents a central area where all applications are stored. What you do
    is to go through them and install the apps that you want to use on your machine.
    This makes it so easy for you to locate the app that you want to install on your
    computer. The Ubuntu Software Center is an example of such a centralized place
    for the Ubuntu Linux. Deepin has the Deepin Software Center. Some distributions
    rely on GNOME software while others rely on Synaptic.


    All these tools mean and do the same thing; they provide a central place from
    where you can search and install Linux software with ease. The presence of a GUI
    is important though, for you to go through the installation process of another
    software. If you do not have a GUI, you will have to rely on the command line
    interface to do the installations.


    What users need to know is that it is very easy to install software on any Linux
