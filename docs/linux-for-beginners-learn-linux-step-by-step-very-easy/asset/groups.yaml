    \ Free Software\nFoundation, Inc.\nThis is free software with ABSOLUTELY NO WARRANTY.\n\
    For details type 'warranty'.\nscale=5\n8.45/5\n1.69000\n```\n\n> 提示：要移除 bc 输出的描述信息，请使用\
    \ `-c` 参数。\n\n`bc` 命令支持变量。下面的示例使用了变量而不是数值。\n下一个重要任务是在脚本中运行 `bc`。在这种情况下，我们需要依赖管道。\n\
    \n```bash\n#!/bin/bash\nvar1=10\nvar2=2\nvar3=$(echo \"$var1 ^ \\$var2\" | bc)\n\
    echo \"The answer is: $$var3\"\n```\n\n```bash\njan@jan-virtual-machine:~/Desktop$\
    \ ./.Myscript\nThe answer is: 100\n```\n\n另一个使用 `scale` 选项的示例。\n```bash\n#!/bin/bash\n\
    var1=10\nvar2=3\nvar3=$(echo \"scale=3; \\$var1 / \\$var2\" | bc)\necho \"The\
    \ answer is: \\$var3\"\n```\n\n```bash\njan@jan-virtual-machine:~/Desktop$ ./.Myscript\n\
    The answer is: 3.333\n```\n\n下一个示例将介绍如何在脚本中使用内联输入操作符配合 `bc` 命令。\n\n```bash\n#!/bin/bash\n\
    var1=8\nvar2=1.75\nvar3=3\nvarF=$(bc << EOF # EOF 代表文件结束\nscale = 4\nv1 = ($var1\
    \ * $var2)\nv2 = ($var1 / $var3)\nv1 + v2\nEOF\necho The final calculation is:\
    \ $varF\n```\n\n```\njan@jan-virtual-machine:~/Desktop$ \n./Myscript\nThe final\
    \ calculation is: 16.666\n```\n\n# 第 15 章\n## 安全你的 Linux 服务器\n\n如果你不在规划的每一步和实际部署的每一层中加入安全因素，那么你可以完全相信某天会发生事情。在本章中，你将学习权限以及与所有\
    \ Linux 文件系统对象相关的、控制谁可以做什么的元数据。\n\n首先，我将介绍如何通过定期应用软件更新和补丁并确保没有网络端口开放且不受保护来加固服务器。接下来，我们将讨论通过加密磁盘、网站和电子邮件服务器来保护静态数据和传输中的数据。但能看到这些权限和属性实际运行将很不错。在我解释如何操作的同时，你还将了解到\
    \ Linux 权限的实际工作原理。\n\nLinux 文件系统中的每个对象（无论是文件还是目录）都有与其相关的唯一元数据。这些元数据由运行带有 `-l`\
    \ 参数的 `ls` 命令时显示的字符表示，其中 `l` 代表长格式版本。当你使用 `cd` 进入秘密目录并输入 `su bob` 时，“su” 命令代表“switch\
    \ user”（切换用户）。这意味着你将使用 `touch` 让 Bob 创建一个名为“data.txt” 的新文件。如果 Bob 不是“secret group”组的成员，且秘密目录不属于“secret\
    \ group”，那么他将无法创建该文件。\n\n文件的权限分为三类：所有者（owner）、组（group）和其他人（others）。每类都有三种权限：读取、写入和执行。这些权限由字符\
    \ `r`、`w` 和 `x` 表示。对于目录，权限的含义略有不同：读取允许你列出目录的内容，写入允许你在其中创建或删除文件，执行允许你进入目录。\n\n\
    当你运行 `ls -l` 时，你会看到一串代表文件权限的字符。例如：\n\n-rw-r--r-- 1 bob secret 4096 Jan 1 12:00\
    \ data.txt\n\n在这个示例中，`-rw-r--r--` 所有者（bob）拥有读取和写入权限，组（secret）拥有读取权限，其他人也拥有读取权限。第一个字符表示文件类型：横杠\
    \ `-` 表示普通文件，`d` 表示目录。\n\n要更改文件的权限，你使用 `chmod` 命令。例如，要为所有者添加执行权限，你可以使用：\n\nchmod\
    \ u+x data.txt\n\n要移除组的写入权限，你可以使用：\n\nchmod g-w data.txt\n\n你也可以使用数字表示法来更改权限。例如，`chmod\
    \ 755 data.txt` 将所有者设置为读取、写入和执行权限，并将组和其他设置为只有读取和执行权限。\n\n`chown` 命令用于更改文件的所有者。例如，要将\
    \ data.txt 的所有者改为 alice，你可以使用：\n\nchown alice data.txt\n\n`chgrp` 命令用于更改文件的所属组。例如，要将\
    \ data.txt 的组改为 developers，你可以使用：\n\nchgrp developers data.txt\n\n理解并管理权限对于安全你的\
    \ Linux 服务器至关重要。通过正确配置权限，你可以确保只有授权用户才能访问敏感文件和目录。\n\n"
