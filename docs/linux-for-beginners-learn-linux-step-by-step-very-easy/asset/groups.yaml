    jan@virtual-machine:~/Desktop$ bc\nbc 1.07.1\nCopyright 1991-1994, 1997, 1998,\
    \ 2000, 2004, 2006, 2008, 2012-2017 Free Software\nFoundation, Inc.\nThis is free\
