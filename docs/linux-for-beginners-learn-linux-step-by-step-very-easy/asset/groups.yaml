    ## 3) Exploiting


    Exploiting is an important way to gain control of the system. The user finds a
    vulnerability from the target system and then uses it to obtain permissions. In
    order to facilitate the user''s practice, this chapter will introduce Metploitable
    2 released by Metploit. Users can use it as a Linux operating system for practice.
    This chapter will introduce various attacks, such as MySQL database, PostgreSQL
    database and Tomcat service. Privilege escalation is to maximize the minimum privilege
    a user has. Often, the users we access access may have the lowest permissions.
    However, if you want to perform a penetration attack, you may need the administrator
    account, so you need to increase the permissions. Permission elevation can be
    achieved by using tokens, local privilege escalation, and social engineering.


    ## 4) Password Attacks


    A password attack is to recover the password plaintext without knowing the key.
    Password attacks are an important part of all penetration testing. If you are
    a penetration tester and don''t understand passwords and password cracking, it''s
    hard to imagine. So, no matter what you do or how far our technical capabilities
    are, passwords still seem to be the most common way to protect data and restrict
    access to the system. This chapter describes various password attack methods,
    such as password online attacks, router password attacks, and creating password
    dictionaries.


