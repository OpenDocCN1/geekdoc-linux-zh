    ## Getting Around in the Server Version


    Some time will need to be spent with the Server version however. It is not as
    straightforward and there are some particulars that will be very useful to know
    before, and during, exploring Linux in this way. If you know DOS it will be just
    a matter of learning Commands and code. If you do not, you will have a decent
    learning curve ahead of you.


    To begin, you will log in to your new Server Version, with the information you
    have provided. You will see just a DOS screen with prompts at the Shell. You will
    not see the Graphic User Interface (GUI) as you would now with the Desktop Version.
    You will now need to use commands to go anywhere at all within this new operating
    system. You should set up a very secure password and root (user) name.


    Make sure to document this exactly as is. Punctuation will matter very much with
    Linux. Different spelling equates to something entirely different. You will see
    this reminder again.


    ## The Root of Everything


    The word Root, in Linux, has a few meanings. The Root User is the Administrator
    (as the User name root) for the computer, which is the lightest level user, with
    full privileges.


    Root also is the highest level, or core, of anything in Linux. It also is the
    location where it is installed, the equivalent to C:/Home in Windows. It’s the
    highest level of the file so to speak. All in Linux is either a directory or a
    file inside the directory, all within the Root directory.


    The Command “sudo” means “Super User Do”. This signifies that you, the Root User
    (i.e., the Administrator), have full permission to access files and programs.
    In some distros, you will need to use this to preface some Commands.


    ## www.ubuntusererverguide.com

    ## Get Command over Your Commands


    As with most anything these days, you can do some simple research on Google to
    obtain large directories of Commands for Linux.

    And with these, you can navigate anywhere with Linux. You should not expect to
    memorize this list however, you should begin to get familiar with the language
    of Linux.


    Some of the most important and useful Commands will get you in, out, and around.

    To stress and expand an earlier point, your use of capitalization in Commands
    matters. Commands are very specific in their spelling so be careful to use proper
    capitalization. Spacing and word order also matter. You may not get anywhere,
    or you may end up somewhere that you did not intend to go.


    In the long list of Commands and combinations of commands for Linux, there are
    also “builtin” commands. Just as it sounds, Builtin commands are already contained
    within the Bash shell itself. When the first word of a simple command is a builtin,
    the shell carries out that command without requiring another program.


    As said before, each distro will have its strengths and challenges. Something
    to note is that Commands for each distro may or may not be the same. Given that
    the Commands are the only way to navigate this version of Linux, this is key.
    You should definitely have some research not only on the distro you have chosen,
    in regards to the compatibility and usage, but you also now want to research the
    specific Commands for that particular distro.


    You will see there are some common roots to many of the Commands, and that you
    can build upon some with other Commands, keywords, file or program names. There
    are a few Commands that the beginner will need to use immediately. Follow along
    and try some out.


    ## Get Help When You Need It


    Here are a few simple things to know right off the bat. These may be your life
    jackets. “Man” pages are manual (as in instructional) pages. You will also, like
    the “sudo” Command, preface another Command with this Command. Using “man” opens
    up a screen with everything you need to know, as a digital manual page. Try these
    variations when in need. Knowing how to get somewhere, how to get out, and how
    to ask for help may seem very basic, but when you are learning the system these
    can be very frustrating.


    - “man –k” To Search for all commands that involve a term. You may also use “apropos”.

    - “man” To Display help information.

    - “info” To Display help information (differently).

    - “whatis” To Display a description about a man page.

    - “whereis” To tell the location of a man page.


    To Exit a man page, you type “Q” (Quit), to drop out. This is the only way to
    back out of the manual pages.

    To Exit out of most other places, simply type “Exit”.


    The Commands “more” and “less” are also useful for displaying files that go past
    the screen you are on. You may need to read more information than what you can
    see one screen on the help pages. This is especially important for a beginner
    on the system. Simply scroll down by using the space bar after typing the Command.


    To get out, type in “q” for quit.


    ## Moving around


    You will soon learn that there are many directories in Linux, and you should get
    familiar with them. Although everything is a file Linux, a directory is a special
    type of file. Directories appear in lists, and related as a tree. Unlike OS that
    uses GUI, you will not see the extension file names. Therefore you need to know
    how to navigate, find and change them. You should do a Google search for a list
    of them in order to properly navigate your system.


    Just as with Commands, directory spelling and symbols also matter. As another
    note, the space bar comes handy when you need a legitimate space between letters
    and slashes, or letters from other words. It saves time and strokes. Missing these
    small details can also result in your being somewhere you don''t need to or do
    not want to be. They can also dead-end you with an error message. In worst-case
    scenarios, mistakes in Linux could do some serious damage like deleting files.
    You should use underscore instead of spaces when setting up new file names. These
    small things will make a difference. A few directories and functions that beginners
    should become familiar with are:


    - /home- This is your root, file storage for documents and settings

    - /dev- Holds the device files

    - /cd- Change directory

    - /etc- This is similar to a control panel


    ## Using directories


    The Command “pwd” will print your working directory. This is also a good place
    to see where you are starting.

    To see what is in the directories, beginning with your home directory, and any
    others thereafter, you can type “ls” to list what is in the directory.


    Note that there are also hidden files that come with your home directory when
    the server account was configured. To see them listed, you must use a period character.
    For example, you would not just type “ls”, but you would type “ls -a” to see the
    hidden files.


    You will also learn to combine Commands as with the ones prior. For example, to
    move to a sub-folder named “xyz”, you would preface the xyz as such, “cd xyz”.


    An example of the “cd” Command to navigate to your desktop directory, type “cd
    ~/Desktop”.


    To return back to the root directory, type “cd ~”. An example of the same command
    used to navigate into the root directory is type “cd /”. To go to the parent directory,
    before your current one), you should type “cd ..”.


    You may want to explore some directories and try moving around to get your bearings
    before you proceed.


    ## How to Install Programs


    The Command “apt-get” gets and installs individual visual software packages. This
    is how you will create your server. You will manually pull in anything that you
    need to individualized your Linux server, using Commands.


    Repositories house many Linux programs that you can tap into at any time. These
    are also open source. You should do a Google search for the best software fit
    for your needs if you do not know what you need at this point.


    To then access the Repository, for example, you would type “sudo apt-get install
    (program name)” to retrieve a copy automatically install.


    The Command “tasksel” means task-select with Ubuntu. If you run this, a screen
    will appear that gives you a list of common server types, packages and tasks.
    You can select and install whatever you need for your server.


    For example, you would say “sudo apt-get install tasksel” to get the tasksel function,
    and then use it by using “sudo apt-get install (then the name of the task you
    want, the server you want, etc.).”

