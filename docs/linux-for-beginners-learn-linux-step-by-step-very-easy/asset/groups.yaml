    ## CHAPTER 7. Command Syntax Patterns


    Let''s discuss some common usage patterns shared by many Linux commands. Having
    a good feel for these basics can make learning your way around much faster. Invoking
    a command always starts with the command name. In some cases, as with the “ls”
    command, just the name on its own is enough to return a result. Still, you''ll
    generally need to add some combination of arguments and parameters to get the
    most of a tool. You''ve already learned about how adding “a” to the “ls” command
    will display all the files in a directory, even hidden files. But you can get
    the same results using two dashes and the word “all”. Providing these alternatives
    make command more accessible for all kinds of people, those who remember things
    better through more complete descriptions and those who perform a task often enough
    that they can enjoy the speed of a single-letter argument. Looking at the “man”
    file for “ls” will show you that many other arguments also have two-dash longer
    equivalents. There are exceptions to that argument syntax usage. The networking
    administration “ip command” can use the “addr” argument without a dash to show
    the IP addresses associated with your system''s network interfaces. On most Linux
    systems this can even be shortened to a simple “a”, also without a dash. You can
    combine multiple short arguments in a single command. “ls -l” will list the contents
    of a directory in long-form, displaying object permissions, ownership, size, and
    age details. Running that again with the “h” command will give you the file system
    in a human-readable format. And adding “t” will organize the objects in descending
    chronological order. Besides arguments, most commands can also read properly formatted
    parameters. This example will list the full contents of the “etc” directory from
    wherever you happen to be in the filesystem. As all the best system administrators
    are extremely lazy, you can expect that there are going to be some pretty command
    line shortcuts hiding in plain sight. The most powerful of them is probably called
    autocomplete. Bash autocomplete what you''re typing and can often anticipate what
    it is you''re after. For example to see the compressed tar archive file in a directory
    you can start typing the “tar” command for extracting the contents. Then you can
    stop at the letter “n”. Rather than having to enter the entire filename, you can
    just hit the Tab key, and Bash will do the rest for you. Bash understands the
    context of the command, so it gives you the archive, but not the subdirectory
    that''s using a similar name. If you were to run the change directory command,
    “cd” with the letter “n” however, hitting Tab would correctly give you the directory
    name. Unsurprisingly, autocomplete will only work when there''s only one matching
    possibility in the directory. You might sometimes need to provide a few more characters
    to get a good match. Speaking of “cd” and shortcuts, you can type simply “cd”
    from anywhere in a filesystem, and you''ll be taken right back to your users home
    directory. You can cycle through recent commands by hitting the up arrow key.
    With an old command displayed, you only need to hit Enter and run it again. Of
    course, you may have moved to a different location in the meantime, so the command
    context might''ve changed. The 1,000 most recent commands are stored in a hidden
    file in your users home directory called “bash_history” and can be seen by running
    the “history” command. There are some characters known as regular expressions
    that the shell won''t necessarily interpret the way you might expect. One example
    is a simple space. Other examples include the dot, square brackets, the asterisk,
    and the question mark. Bash will often interpret those as command instructions
    rather than simple characters. Suppose you decide to create a file with the name
    “this is my story”. Running the command “touch” and an unused file name is one
    quick way to create an empty file. But if you run “touch” like this, things won’t
    work out the way you probably expect. Listing the files in the directory will
    show you that there are now four files, each with a single-word name. “Touch”
    figured you wanted to create separate files and got right to work doing it. If
    you want to get rid of that, you can enclose the whole filename, spaces included,
    within quotation marks. This tells Linux that it''s all one string. Another way
    to force Bash to preserve the literal value of your input is to use the backslash
    as an escape character. The way that would work for your problem would be to type
    the backslash before each space in the string. When you list the contents of the
    directory, you would now have a single file with the name, another four-word name.
    The truth is that you might get better off, in the long run, getting into the
    habit of creating single-word filenames by using dashes or underscores. They can
    simplify your file management.


