- "# Linux 命令行：Bash 与 Shell 脚本入门指南\n\n\n\n![](img/rsrc7.jpg)\n\n\n\n\n![](img/rsrc7.jpg)\n\
  \n\n\n## Travis Booth 的其他书籍\n**深度学习系列**\n* 《Python 深度学习：初学者上手指南》\n* 《Python 深度学习：超越基础的全面指南》\n\
  \n**Python 数据分析系列**\n* 《Python 数据分析：初学者真实世界速课程》\n* 《Python 数据分析：超越基础的实战指南》\n\n**Python\
  \ 数据科学系列**\n* 《Python 数据科学：初学者上手学习》\n* 《Python 数据科学：超越基础的实战指南》\n\n[点击此处探索更多！](https://amzn.to/2nku7aN)\n\
  \n**额外优惠：** 通过 Kindle Matchbook 购买纸质版，即可免费获得电子书！\n\n\n## 前言\nLinux 是全球范围内主地位且适应性最强的操作系统之一。Linux\
  \ 操作系统用于计算机科学的许多领域，从嵌入式设备到智能设备。该操作系统用于高性能计算机、运行全球基础设施服务的服务器，如智能手机、平板电脑和电视。该操作系统提供了直观且现代的图形界面，并根据所使用的从\
  \ GNOME 到 KDE 的 Linux 发行版进行定制。在任何 Linux 计算机上，Shell 是与操作系统交互的最强大方式。命令是发送到 Linux 内核的一组指令，用于告诉计算机做什么。Linux\
  \ Shell 还可以执行和解释来自名为 bash 脚本的文件的命令，这使得任务可以轻松自动化。许多系统管理任务是常规且重复的，需要自动化，例如发送警报和执行常规维护。本书包含了关于\
  \ Linux 命令行、Shell 和 Bash 脚本的初级信息。本书向新手用户介绍了基本的脚本技能，以自动化和执行 Linux 中的许多系统任务，范围从文本解析和解释到网络操作。Linux\
  \ Shell 的强大程度取决于用户的意图。Linux 专家认为脚本的力量非常强大，因为他们使用 Shell 进行大规模自动化。Linux 命令行提供了这些神奇的能力！\n\
  \n## 本书涵盖的内容\n本书是对 Linux 操作系统的深入介绍，介绍了如何配置 Shell 和 Linux 环境以及编写基础脚本。\n\n## 第一章：Linux\
  \ 命令行\n本章将详细介绍存在的不同类型的 Shell，并重点关注作为首选的 BASH。还将介绍 Linux 命令以及如何开始 BASH。\n\n## 第二章：Shell\
  \ 输入与输出\n本章将查看用户可能遇到的 BASH 使用场景，重定向基础、Shell 环境基础以及介绍 VI 编辑工具。\n\n## 第三章：文件搜索与归档\n\
  本章将讨论 Linux 操作以查找文件和列出单词。\n\n## 第四章：编写脚本\n本章介绍编写脚本的基础知识，并开始编写 Bash 脚本。\n\n## 如何使用本书\n\
  本书作为 Linux 命令行和 Bash 脚本入门，教授用户如何处理 Shell 脚本。您应该顺序阅读章节。如果您对书中涵盖的内容熟悉，可以跳过某些章节。\n\n\
  ## 先决条件\n为了舒适地使用本书，前提是您有一个工作的 Linux 安装（CentOS 7 或 Ubuntu）。您可以通过以下两种获得：\n\n1. 在虚拟机（Oracle\
  \ Virtual Box）上安装 Linux：您需要安装选择的发行版，例如 CentOS 7 或 Ubuntu。本书将解释安装 CentOS 7 的步骤。配置虚拟机带有\
  \ RAM 和 20GB 硬盘。\n2. 使用 Live CD 在笔记本电脑/桌面：像 CentOS/Ubuntu 等 Linux 发行版可以直接从 USB 闪存或\
  \ CDROM/DVD 运行。为了使用 Live CD，您需要在 BIOS 中更改启动顺序，从 CDROM 或 USB 闪存启动。启动 Live CD 后，阅读书的其余部分并配合命令。\n\
  \n## 简介\nLinux 操作系统的历史可以追溯到早期分发给学院和大学的 Linux 系统。伯克利软件基金会 (BSD) 等计划有助于开发许多类似 Linux\
  \ 的免费操作系统。最后的一个主要组件是由芬兰学生 Linus Torvalds 在 1990 年左右开发的 Linux 内核，通过许多 Linux 爱好者的在线协作，它变成了今天。这本初级\
  \ bash 脚本入门将向读者介绍操作系统，并将详细介绍操作系统的功能，在介绍 Linux 的优缺点之前。\n\n## 什么是操作系统？\n操作系统是用户的计算机硬件和软件管理。最初，操作系统的建立是为了执行硬件任务，专注于文件管理、运行程序和接收用户指令。通过用户界面，操作系统与硬件通信以执行指令。要执行任务，你只需要向操作系统提交指令。操作系统执行许多功能，但操作系统的主要目的是提供用户和计算机之间的接口。\n\
  \n### 资源管理器\nLinux 操作系统和其他任何操作系统一样，是一个资源管理器。这意味着它管理连接到系统的资源，如内存和中央处理器。操作系统将决定 CPU\
  \ 执行操作。\n\n### 进程管理\n操作系统始终跟踪你计算机上运行的进程。OS 跟踪各种程序并决定哪个进程具有访问权限。\n\n### 硬件管理\n在 Linux\
  \ 系统启动过程中，计算机执行 POST（上电自检），这是一个发现当前连接到计算机的硬件组件（CPU、硬盘和网卡）并加载设备驱动和模块的过程。\n\n### 内存管理\n\
  内存管理是操作系统处理计算机主和扩展内存的功能。内存管理涉及执行期间主内存和辅助内存之间的移动。内存管理还跟踪计算机上所有的易性内存位置，无论它们被分配给某些处理器。应用程序需要\
  \ RAM（随机存储器）和交换空间（扩展内存）来运行。\n\n### 文件系统管理\n文件系统结构要么内置于操作系统，要么作为模块加载。在 Linux 中，一切都被视为文件，从目录、进程到设备。操作系统在控制谁拥有和访问方面起着重要作用。\n\
  \n### 用户和组管理\n所有主要操作系统的系统管理员都会系统上添加、更新和删除用户组账户。Linux 系统方便用户组账户的添加、删除和更新相关的用户组访问权限。\n\
  \n### 编程工具\n操作系统提供了多种编程工具来开发程序和库，以实现接口，允许 Linux 连接到其他。\n\n## 什么是 Linux？\nLinux 是一个稳定、轻量级且开源的操作系统，具有广泛的开发工具、完全功能的图形界面\
  \ (GUI)。它是 21 世纪最显著的进展之一。除了对巨大增长的影响和作为可用技术的地位外，Linux 操作系统像其他操作系统一样，由内核、实用程序、图形界面\
  \ (GUI) 和应用程序组成。内核是系统的核心。\n\n### 首选操作系统\nLinux 操作系统非常稳定，崩溃频率较低。Linux 安装多年后仍继续良好运行。事实上，某些用户的设置安装一次后一直没有发生故障地运行。许多数据中心中的\
  \ Linux 服务器具有高运行时间，其整体可用性接近 99.9%。这种稳定性和高运行时间导致了大部分互联网的运行。ZDNET 网站估计，高达 96.3% 的顶级服务器运行在\
  \ Linux 上。\n\n### 缺点\n（源未提供此部分的内容）\n\n### Linux 操作系统的优势\nLinux 操作系统具有许多优势，使其成为服务器和其他系统的可靠选择。\n\
  \n### 强大的命令行\nLinux 发行版具有强大的命令行界面。Shell 也称为终端，为用户提供了一个纯文本界面。\n\n### 高安全性\n众所周知操作系统在避免病毒和恶意软件方面非常安全。安全性的主要原因在于由于\
  \ Linux 是开源的，源代码公开供审阅。Linux 的开发者在开发 Linux 时考虑了安全性。\n\n\n\n\n\n```bash\n[ppeters@rad-srv\
  \ ~]$ cat /etc/passwd\nppeters:x:500:500::/home/ppeters:/bin/bash\n```\n\n在 Linux\
  \ 中，用户可以从一个 shell 切换到另一个 shell。用户只需通过输入所选 shell 的名称来切换 shell。如果你只输入名称，系统将根据 `PATH`\
  \ 设置找到你所选 shell 所在的文件夹。在输入 shell 名称并按回车后，通常会显示一个新的提示符，因为每个 shell 都有其独特的外观：\n\n```bash\n\
  [ppeters@rad-srv ~]$ sh\nsh-4.1$\n```\n\n\n\n\n## 什么是 Bash？\n\n`BASH` 也称为“Bourne-Again\
  \ SHell”（再次出 Bourne Shell），是 Linux 系统上的默认用户 shell。`Bash` 主要是一个命令行解释器，具有传统的编程语言构造结构。在许多领域中，`Bash`\
  \ 被视为一种编程语言，尽管它具有 `Bash` 特有的逻辑。作为一种编程语言，`Bash` 必须支持变量构造、函数以及如条件语句和循环等程序决策流控制构造结构。\n\
  \n`BASH` shell 提示符取决于登录用户的权限。所有普通用户都有一个美元符号（`$`）提示符。Linux 操作系统还有许多其他类型的 shell，每种\
  \ shell 都有自己的提示符，例如 `csh` 使用 `%` 作为提示符。所有特权用户（如 `root` 用户）都有独特的提示符；他们使用 `#` 作为提示符。（Petersen,\
  \ 2008）。\n\n`Bash` 作为命令行解释器，将输入终端的所有命令都作为字符串存储，除非用户指示它进行算术计算，否则它没有数字的概念。`Bash` 的简化工作方式如下：\n\
  \n1. `Bash` 接收用户的键盘输入，并根据空格（空格或制表符）将其分割为单词。\n2. `Bash` 然后假设用户输入的第一个单词始终是一个命令。`Bash`\
  \ 然后将第一个单词之后的所有内容作为参数传递给该命令。\n3. 在解析并分割用户输入后，`Bash` 尝试处理该命令，并在参数可用时添加它们。\n\n## 开始使用\
  \ Bash\n\nLinux 有多个发行版可供用户选择。所有这些 Linux 发行版都将 `bash` 作为默认 shell。在学习本书之前，选择一个适合你的发行版是重要的。我鼓励读者选择\
  \ `Centos 7` 操作系统。在选择了 Linux 发行版后，重要的是你将使用哪种基于命令行的文本编辑器。\n\n作者建议在你的 Linux 服务器上安装\
  \ `VIM`（`VI` Improved）编辑器。在 `Centos` 和 `Ubuntu` 中的安装方法不同。`Vi` 是 Linux 系统管理员中流行且广泛使用的文本处理编辑器。尽管\
  \ `Vi` 被广泛使用，但对于新手 Linux 用户来说很难学习，因为它在两种不同的模式下运行，即插入模式和命令模式。插入模式是用户通常在文件中输入文本的地方，而命令模式是你的键盘输入被解释为对文本执行的操作的地方。\n\
  \n## 设置环境\n\nLinux 是一个非常灵活且可定制的系统。你可以设置环境设置和变量来定义你的 shell 如何运行。你可以让系统自动处理你发现需要反复设置或更改的内容。\n\
  \n### Shell 配置文件 (Shell Profile)\n\n对于任何 Linux 用户，用户主目录下都有 `~/.profile` 文件。正是在 `.profile`\
  \ 文件中，你可以个性化与用户配置关联的用户设置。当命令行界面初始化时，会发生以下步骤：\n* 首先执行 `/etc/profile`\n* 然后，如果你的默认\
  \ shell 是 `bash`，则执行 `/etc/bash.bashrc` 文件，然后\n* 处理 `~/.profile` 文件，\n* 最后执行 `~/.bashrc`\
  \ 文件。\n\n`~/.profile` 文件由任何可用的 shell 执行，因此将通用设置放在此文件中是重要的。所有针对 `bash` 的设置都应该放在 `~/.bashrc`\
  \ 文件中。系统管理员可以在 `~/.bashrc` 文件中设置 `bash` 环境变量和别名，甚至运行命令。用户主目录下所有以点开头的文件都称为“点文件”（dotfiles）。\n\
  \n### 环境变量\n\nLinux 允许使用环境变量来更改 Linux 系统的运行方式。在命令行中，你可以在终端设置环境变量，或者通过向 `~/.bashrc`\
  \ 文件中添加项目进行静态设置。`bash` shell 有四个可自定义的提示符，即 `PS1`、`PS2`、`PS3` 和 `PS4`。\n\n#### PS1\
  \ 提示符\n\n`PS1` 也称为“Prompt String 1”，是 Linux 中每个 `bash` 命令前显示的内置基础可自定义 `bash` shell\
  \ 变量。对提示符的自定义包括添加和修改元素、更改背景颜色。下面是默认的 `bash` 提示符。\n\n![](img/srcCE.jpg)\n图 1 显示了用户名\
  \ `ppeters`、主机名 `rad-srv` 的 PS1 提示符。\n`PS1` 最常用的设置是 `\\u@\\h:\\w$`，它显示用户名、主机名以及用户正在所在的目录。\n\
  \n下一行是 `PS1` 的另一个示例：`ppeters@rad-srv:/var/log$`\n上面的提示符显示用户拥有用户名 `ppeters`，并且登录到了主机名为\
  \ `rad-srv` 的服务器，且用户当前位于 `/var/log` 文件夹。\n\n#### PATH\n\n`bash` `PATH` 环境变量被配置为将\
  \ shell 指向常用程序的位置。（注：原文在此处存在大量文本重复，译文已根据逻辑进行整合）。\n\n\n\n\n\n| 序号 | 字符与描述 |\n| :---\
  \ | :--- |\n| 1 | - 普通文件，例如文本文件、二进制文件或硬链接。 |\n| 2 | B 特殊设备文件。代表块设备 I/O 设备文件，如硬盘。\
  \ |\n| 3 | C 特殊字符文件。代表原始文件，如物理硬盘。 |\n| 4 | D 代表目录文件，显示其所包含的文件和目录列表。 |\n| 5 | L 此符号代表软链接或符号链接（Symbolic\
  \ link）。这些是任何普通文件的链接。 |\n| 6 | P 此符号代表命名管道（named pipe）。这是进程间通信的机制。 |\n| 7 | s 此符号用于进程间通信的套接字（Sockets）。\
  \ |\n\n## 元字符或通配符\n\n在 Linux 中，我们有一些在处理正则表达式时非常有用的字符。以下字符 `*`（星号）和 `?`（问号）被称为通配符运算符或元字符。`*`\
  \ 符号用于匹配零 (0) 个多个字符，而问号 `?` 用于匹配单个字符。\n\n### 示例说明\n\n```\n[ppeters@rad-srv ~]$ ls\
  \ pp*.doc\n```\n显示所有以 `pp` 开头并以 `.doc` 结尾的文件：`ppeters01.doc`、`ppeters02.doc`、`ppeters03.doc`、`ppeters04.doc`、`ppeters05.doc`。\n\
  \n上面的示例显示 `*` 作为匹配任何字符的通配符。要显示所有以 `.doc` 结尾的文件，用户可以使用命令：\n\n```\n[ppeters@rad-srv\
  \ ~]$ ls *.doc\n```\n\n## Linux 隐藏文件\n\nLinux 中存在不可见文件，它们通过第一个字符来识别，即点字符（`.`）。在\
  \ Linux 中，大多数程序（如 shell）使用点文件保存配置细节。\n\n常见隐藏文件的示例包括：\n- `.profile` - Bourne Again\
  \ Shell ( Bash) 启动脚本\n\n我们可以使用 `ls` 命令并指定 `-a` 选项列出所有不可见文件，例如：\n```\n[ ppeters@rad-srv\
  \ ~]$ ls -a\n.profile  docs  lib  peters_file..  .rhosts  hosts  pub  users\n```\n\
  - 单点（.）是当前工作目录的表示。\n- 双点（..）是父级目录的表示。\n\n## 使用 VI 命令创建文件\n\n在命令行界面操作时，我们可以使用 `vi`\
  \ 编辑器在任何 Linux 文件系统上创建普通文件。创建一个名为 `ppeters_file` 文件的示例命令：\n\n```\n[ppeters@rad-srv\
  \ ~]$ vi ppeters_file\n```\n上述命令打开一个名为 `ppeters_file` 的文件。要进入插入模式（insert mode），需要按下\
  \ `i` 键，这是编辑文件的 vi 模式。一旦用户进入编辑模式，就可以像下面的程序一样在文件中输入数据或脚本：\n\n```\nThis is P Peters’s\
  \ file. It was created today at 12 noon.\nWe are going to store this text in this\
  \ file.\n```\n当用户完成文件文本输入后，请按照以下步骤操作：\n- 按 `esc` 键退出编辑模式。\n- 同时按下 `Shift + ZZ` 键完全退出文件。\n\
  \n现在你会在当前工作目录中创建一个名为 `ppeters-file` 的文件。\n\n## Linux 中的文件修改\n\n`vi` 编辑器是一个用于在 bash\
  \ shell 中修改现有文件的工具。要在 Linux 中编辑现有文件，请输入以下命令：\n\n```\n[ppeters@rad-srv ~]$ vi ppeters-file\n\
  ```\n一旦打开此 `ppeters_file` 文件，可以通过按下 `i` 键进入插入模式，从而允许你修改文件。要在打开的文件中移动，用户需要先按下 `esc`\
  \ 键退出编辑模式。退出编辑模式后，通过以下按键可以在 `vi` 文件中进行上、下、左、右移动：\n\n- `l`：此键允许向右移动。\n- `h`：此键让你向左移动。\n\
  - `k`：此键允许在打开的文件向上移动。\n- `j`：此键用于在 vi 文档向下移动。\n\n上述按键用于将光标定位在你想要的文件或文档的任何部分。当你到达想要处理的部分时，按下\
  \ `i` 键进入插入模式。完成编辑后，用户应按下 `Esc` 键，然后同时按下按键 `Shift + ZZ` 以保存并完全退出文件。\n\n\n\n\n\n\
  ## 使用 Cat 命令显示文件内容\n\n使用 `cat` 命令（它是 \"concatenate\" 即连接命令的缩写）允许 Linux 用户查看或显示文件的内容。下面我们有一个示例，用于显示我们之前创建的\
  \ `ppeters_file` 文件的内容：\n\n```\n[ppeters@rad-srv ~]$ cat ppeters_file\nThis is P\
  \ Peters’s file. It was created today at 12 noon.\nWe are going to store this text\
  \ in this file.\n[ppeters@rad-srv ~]$\n```\n\n`concatenate` 或 `cat` 命令可以配合多个选项使用来修改我们的视图。我们可以通过在\
  \ `cat` 命令后添加 `-b` 选项（如下所示），在正在查看的文件中显示行号（非空行的行号）：\n\n```\n[ppeters@rad-srv ~]$\
  \ cat -b ppeters_file\n1 This is P Peters’s file. It was created today at 12 noon.\n\
  2 We are going to store this text in this file.\n[ppeters@rad-srv ~]$\n```\n\n##\
  \ 统计文件字数\n\n在 Linux 中，我们有一个命令来统计文件的单词数。该命令称为 `wc`，是 \"word count\" 的缩写。为了列出文件中行、字符和单词的数量，我们使用带有多个选项的\
  \ `wc` 命令。下面的演示了 `wc` 命令的用法：\n\n```\n[ppeters@rad-srv ~]$ wc /var/log/messages\n\
  2 14 1013 /var/log/messages\n[ppeters@rad-srv ~]$\n```\n\n运行 `wc` 命令后，输出包含若干列。结果的第一列是\
  \ `ppeters_file` 文件总行数的表示。接下来的第二列是文件的单词计数。然后是第三列，它是文件中总字节数的表示。此列显示文件的实际大小。结果中的第四列（也是最后一列）是文件名。\n\
  \n`wc` 命令可以用于统计多个文件的内容。这是通过将所有文件名添加到 `wc` 命令来实现的。我们下面有一个示例展示了 `wc`（字数）命令处理多个文件时的结构：\n\
  \n```\n[ppeters@rad-srv ~]$ wc file_name1 file_name2 file_name3\n[ppeters@rad-srv\
  \ ~]$\n```\n\n## 使用 CP 命令复制文件\n\n我们的操作系统有许多命令行工具来操作文件和目录。要创建文件或目录的副本，我们使用 `cp` 命令。`cp`\
  \ 是 copy 的缩写，用于创建文件的副本。命令的结构如下：\n\n```\n[ppeters@rad-srv ~]$ cp source_file destination_file\n\
  [ppeters@rad-srv ~]$ cp source_file directory_name\n[ppeters@rad-srv ~]$ cp source_file1\
  \ source_file2 source_fileN directory_name\n[ppeters@rad-srv ~]$ cp [option] source_file\
  \ destination_file\n[ppeters@rad-srv ~]$ cp source_name destination_name\n```\n\n\
  下面的 bash 语句演示了使用 `cp` 命令将文件 `ppeters_file` 复制到 `ppeters_copy`。\n\n```\n[ppeters@rad-srv\
  \ ~]$ cp ppeters_file ppeters_copy\n```\n\n复制完成后，该命令会创建一个额外文件，你的当前工作目录下将多出一个 `ppeters_copy`\
  \ 文件。该文件将是原始文件 `ppeters_file` 的完全副本。\n\n## 使用 MV 命令重命名文件\n\nLinux 内置了更改文件文件名称和位置的功能。这被称为重命名功能；我们利用\
  \ `mv`（move）命令来重命名文件并更改它们在文件系统中的位置。下面是 `mv` 命令语法的演示：\n\n```\n[ppeters@rad-srv ~]$\
  \ mv old_name_file new_name_file\n```\n\n执行以下 `mv` 命令将将现有文件 `ppeters_file` 重命名为\
  \ `newppeters_file`。\n\n```\n[ppeters@rad-srv ~]$ mv ppeters_file newppeters_file\n\
  [ppeters@rad-srv ~]$\n```\n\n`mv` 命令将重命名现有文件并将其完全变为新文件。在这种情况下，你发现在当前目录下只有一个 `newppeters_file`。\n\
  \n## 使用 RM 命令删除文件\n\nLinux 命令行界面拥有 `rm` 命令，它是用于删除文件的命令行程序。`rm` 命令具有以下语法：\n\n```\n\
  [ppeters@rad-srv ~]$ rm ppeters_file\n```\n\n通常情况下，Linux 文件可能包含某些重要数据，因此在删除它们时应始终遵循最佳实践。最佳实践是在使用\
  \ `rm` 命令时使用交互模式。建议在使用 `rm` 命令时带有 `-i` 选项。\n\n下面是使用 `rm` 命令完全删除文件的演示。我们正在删除一个名为\
  \ `filename` 的现有文件。\n\n```\n[ppeters@rad-srv ~]$ rm filename\n[ppeters@rad-srv ~]$\n\
  ```\n\n通过 `rm` 命令，我们只需要将需要删除的文件添加到 `rm` 命令后，就能一次删除多个文件。\n\n```\n[ppeters@rad-srv\
  \ ~]$ rm file_name01 file_name02 file_name03\n[ppeters@rad-srv ~]$\n```\n\n## Linux\
  \ 中的绝对路径和相对路径\n\nLinux 操作系统的文件组织在一个分层文件系统树中，根目录（`/`）位于倒置树的顶部。该 Linux 目录层次中任何文件的路径都由文件的路径描述。文件路径的组件由\
  \ `/`（正斜杠）分隔。Linux 中有绝对路径和相对路径名。\n\n绝对路径以正斜杠 `/` 开头。下面是一些绝对路径的示例。\n\n```\n[ppeters@rad-srv\
  \ ~]$ /etc/systemd\n[ppeters@rad-srv ~]$ /var/log/messages\n[ppeters@rad-srv ~]$\
  \ /usr/local\n```\n\nLinux 路径也可以相对于根目录。相对路径不以斜杠开头。当用户想要确定自己的位置时，他们使用 `pwd` 命令：\n\
  \n```\n[ppeters@rad-srv ~]$ pwd\n[ppeters@rad-srv ~]$\n```\n\n## 列出目录内容\n\n`ls`\
  \ 命令用于列出目录的内容。`ls` 命令的语法如下所示：\n\n```\n[ppeters@rad-srv ~]$ ls -l\n```\n\n## 创建目录\n\
  \n`mkdir` 命令用于创建新目录。`mkdir` 命令的语法如下：\n\n```\n[ppeters@rad-srv ~]$ mkdir new_directory\n\
  ```\n\n## 删除目录\n\n`rmdir` 命令用于删除空目录。`rmdir` 命令的语法如下：\n\n```\n[ppeters@rad-srv ~]$\
  \ rmdir empty_directory\n```\n\n## Bash 中的变量\n\n变量用于存储数据以供脚本后续使用。在 Bash 中，变量使用 `=`\
  \ 运算符赋值且且没有空格。\n\n### 变量/参数名\n\n变量名可以包含字母（`a-z` 或 `A-Z`）、正数字（`0-9`）以及变量名接受的特殊字符下划线（`_`）。按照习惯，bash\
  \ 变量用大写声明。\n\n以下是变量名的示例：\n- `VARIABLE_1`\n- `VARIABLE_2`\n- `VARIABLE_A`\n\n以下是非法变量名的示例：\n\
  - `2VARIABLE`\n- `VARIABLE-`\n- `VARIABLE!`\n\n### 定义 变量\n\n变量用于存储数据以供脚本后续使用。在 Bash\
  \ 中，使用 `=` 运算符赋值且没有空格。\n\n变量定义：\n```bash\nvar_name=var_value\n```\n上面的示例声明了变量 `var_name`\
  \ 并为其赋值值 `var_value`。这种类型的变量被称为标量变量。标量变量一次只持有一个值。变量 允许存储任何类型的数据。\n\n### 访问变量值\n\n\
  在变量名前加上美元符号（`$`）是访问变量值的唯一方法。下面的 bash 脚本将访问定义的变量 `NAME` 并打印：\n\n```bash\n#!/bin/sh\n\
  NAME=\"James Jones\"\necho $NAME\n```\n\n### 变量类型\n\nBash 编程向我们介绍了三类变量。在 Bash 中，我们有本地变量、环境变量和\
  \ 变量。\n\n### 本地变量\n\n本地变量是存在当前 bash shell 实例中的值存储。该变量及其值对操作系统中运行的任何程序都是不可见的。本地变量设置是在提示符处完成的。\n\
  \n### 环境变量\n\n我们的另一种类型变量是环境变量。它是所有 bash shell 子进程可用的变量或参数。大多数程序都需要环境变量才能工作。\n\n\
  ### 变量\n\n最后，我们有 变量。变量是由 shell 设置的特殊 bash 参数，是 bash 正确运行所必需的。这些参数可能是环境变量，也是本地变量。例如，进程\
  \ ID 号（也称为 PID）用 `$` 字符表示：\n\n```bash\necho $$\n```\n上面的命令显示当前 bash shell 的 PID。\n\
  \n\n\n\n\n## Bash 特殊变量\n\n| # | 变量及描述 |\n| :--- | :--- |\n| 1 | `$0` - 此变量显示当前脚本的文件名。\
  \ |\n| 2 | `$n` - 这些参数取决于调用脚本时参数的数量。变量 `n` 是一个非负整数，表示当前参数的位置（初始参数始终是 `$1`，后续参数是\
  \ `$2`，以此此类推）。 |\n| 3 | `$#` - 此显示传递给 bash 脚本的参数计数。 |\n| 4 | `$*` - 在 linux 中，我们对所有参数进行双引号处理。如果我们向\
  \ bash 脚本输入两个参数，那么 `$*` 等于 `$1 $2`。 |\n| 5 | `$@` - 我们对每个参数单独进行双引号处理。如果 bash 脚本接收两个参数，`$@`\
  \ 的结果为 `$1 $2`。 |\n| 6 | `$?` - 上述变量是上一次执行命令的退出状态。 |\n| 7 | `$$` - 上述变量显示当前 bash\
  \ shell 的进程 ID 号（PID）。对于所有 bash 脚本，`$$` 详细记录它们执行时的进程 ID。 |\n| 8 | `$! ` - 此变量显示上一次执行的后台命令的进程\
  \ ID。 |\n\n### Linux 终端参数\n\nLinux 命令行界面参数如 `$1`、`$2`...$...9` 被称为位置变量，$0` 变量指向我们正在执行的命令、程序、bash\
  \ shell 脚本或 bash 函数，而这里的特殊变量 `$1`、`$2` ... `$9` 作为参数传递给 bash 命令。\n\n下面的脚本使用了多个与命令行界面相关的特殊变量：\n\
  \n```bash\n#!/bin/sh\necho \"File Name: $0\"\necho \"Initial Argument : $1\"\necho\
  \ \"Second Argument : $2\"\necho \"Double Quoted Values: $@\"\necho \"Double Quoted\
  \ Values: $*\"\necho \"The Total Count of our Arguments is: $#\"\n```\n\n下面显示的是上述脚本的运行示例：\n\
  ```text\n[ppeters@rad-srv ~]$./peters_test.sh James Jones\nFile Name : ./peters_test.sh\n\
  Initial Argument : James\nSecond Argument : Jones\nDouble Quoted Values: James Jones\n\
  Double Quoted Values: James Jones\nTotal Count of our Arguments is: 2\n```\n\n###\
  \ Bash 特殊变量 `$*` 和 `$@`\n\nLinux bash 有一些特殊变量，用于一次访问所有终端参数。除非将它们包含在 `\"\"` 双引号中，否则变量\
  \ `$*` 和 `$@` 的输出结果相同。\n\n这两个变量指定终端参数。特殊变量 `\"$*\"` 将整组参数视为一个带有空格（分隔符）的单个参数，而特殊变量\
  \ `\"$@\"` 则取整个列表并将其拆分为不同的参数。要使用 `$*` 或 `$@` 特殊变量处理未知数量的命令行参数，我们可以使用下面的 bash 脚本：\n\
  \n```bash\n#!/bin/sh\nfor TOKEN in $*\ndo\necho $TOKEN\ndone\n```\n\n下面是上述 bash\
  \ 脚本的运行示例：\n```text\n[ppeters@rad-srv ~]$./peters_test.sh James Jones\nis OldJamesJonesisOld\n\
  ```\n特别说明：`do...done` 是一种循环结构，稍后会详细介绍。\n\n### Bash Shell 退出状态\n\n特殊变量 `$?` 代表之前执行的\
  \ bash 命令的退出状态。所有完成的命令返回的数值值称为退出状态。根据规则，所有成功的命令返回 `0` 退出状态，所有失败的命令返回一个退出状态。由于特定原因，某些命令返回额外的退出状态。例如，某些命令会区分错误类型并根据特定的失败类型返回不同的退出状态。\n\
  \n下面是一个成功命令的示例：\n```text\n[ppeters@rad-srv ~]$./peters_test.sh James Jones\nFile\
  \ Name : ./peters_test.sh\nInitial Parameter : James\nSecond Parameter : Jones\n\
  Double Quoted Values: James Jones\nDouble Quoted Values: James Jones\nTotal Count\
  \ of Parameters : 2\n[ppeters@rad-srv ~]$./echo $?\n0\n[ppeters@rad-srv ~]$\n```\n\
  \n### Bash 数组值\n\n在书的这一部分，我将讨论如何使用 bash shell 数组。能够存储单个值的 bash shell 变量，这些变量被称为标量（scalars）。bash\
  \ shell 推广了一种独特的变量类型，称为数组变量。它可以同时持有多个值。数组为一组变量提供了一种分组技术。你可以使用单个数组变量，而无需为存储所有其他变量所需的每个变量创建新名称。在为数组命名时，适用于\
  \ Shell 变量的所有命名规则均有效。\n\n### 定义数组值\n\n数组变量和标量变量之间的区别可以描述如下。假设你正尝试用一组变量来描述不同学习者的名字。每个名字都是一个标量变量。\n\
  \n```bash\nARR_NAME01=\"James\"\nARR_NAME02=\"Peter\"\nARR_NAME03=\"Martin\"\nARR_NAME04=\"\
  Samson\"\nARR_NAME05=\"Linda\"\n```\n\n为了存储上述所有名称，我们可以使用数组。创建数组变量最简单的方法是遵循下面的示例。这允许为其中一个索引赋值值。\n\
  \n```bash\narrayname[index]=value\n```\n\n从上面可以看出，数组名称是 `arrayname`，index 是数组中需要设置的项的索引，value\
  \ 是你想为该项设置的值。下面的示例：\n\n```bash\nARR_NAME[0]=\"James \"\nARR_NAME[1]=\"Peter\"\n\
  ARR_NAME[2]=\"Martin\"\nARR_NAME[3]=\"Samson\"\nARR_NAME[4]=\"Linda\"\n```\n\n使用\
  \ bash shell 初始化数组的语法所示：\n\n```bash\narrayname=(value01 ... valueN)\n```\n\n###\
  \ 如何访问数组值\n\n设置数组变量后，你可以访问它，如下所示：\n\n`${arrayname[index]}`\n\n上面的数组名称是 `arrayname`，index\
  \ 是要处理的值的索引。下面是访问数组值的示例：\n\n```bash\n#!/bin/sh\nARR_NAME[0]=\"James \"\nARR_NAME[1]=\"\
  Peter\"\nARR_NAME[2]=\"Martin\"\nARR_NAME[3]=\"Samson\"\nARR_NAME[4]=\"Linda\"\n\
  echo \"Indice One: ${ARR_NAME[0]}\"\necho \"Indice Two: ${ARR_NAME[1]}\"\n```\n\n\
  下面是执行上述 bash 脚本的 own：\n```text\n[ppeters@rad-srv ~]$./peters_test.sh\nIndex One:\
  \ James\nIndex Two: Peter\n```\n\n下面是访问数组的替代方法：\n`${arrayname[*]}`\n`${arrayname[@]}`\n\
  \n上面的数组名称是 `arrayname`。下面是说明如何访问数组的 bash 脚本：\n\n```bash\n#!/bin/sh\nARR_NAME[0]=\"\
  James \"\nARR_NAME[1]=\"Peter\"\nARR_NAME[2]=\"Martin\"\nARR_NAME[3]=\"Samson\"\n\
  ARR_NAME[4]=\"Linda\"\necho \"Our Method One: ${ARR_NAME[*]}\"\necho \"Our Method\
  \ Two: ${ARR_NAME[@]}\"\n```\n\nbash 脚本的 own：\n```text\n[ppeters@rad-srv ~]$./peters_test.sh\n\
  Our Method One: James PeterMartinSamsonLinda\nOur Method Two: James PeterMartinSamsonLinda\n\
  ```\n\n## Shell 运算符\n\nLinux 中的 Shell（特别是 bash）支持许多运算符。本节将详细讨论不同的运算符。最初 shell 并没有执行算术运算的机制；它使用了外部程序如\
  \ `awk` 或 `expr`。\n\n下面的示例演示了如何相两个数字：\n\n```bash\n#!/bin/sh\nval_add=`expr 5 + 9`\n\
  echo \"The Total added value is: $val_add\"\n```\n总加值为 14\n\n执行加法时需要考虑几点：● 运算符和表达式之间应该有空格。例如，`6+9`\
  \ 是错误的；应该写成 `6 + 9`。● 算术加法表达式应该放在反引号中。\n\n### 算术运算符\n\n下表显示了所有的算术运算符。假设变量 `x` 为\
  \ 8，变量 `y` 为 15：\n\n下表显示了所有的 bash 算术运算符。\n\n| 运算符 | 描述 | 示例 |\n| :--- | :--- | :---\
  \ |\n| `+` (加法) | 该运算符将运算符两侧的值相加 | `expr $x + $y` 结果为 23 |\n| `-` (减法) | 该运算符从左值中减去右值\
  \ | `expr $x - $y` 结果为-7 |\n| `*` (乘法) | 该运算符计算 `*` 运算符两侧操作数的乘积 | `expr $x \\* $y`\
  \ 结果为 120 |\n| `/` (除法) | 该运算符将左值除以右值 | `expr $y / $x` 结果为 1 |\n| `%` (取模运算) | 该运算符将左值除以右值并返回余数\
  \ | `expr $y % $x` 将得到 7 |\n\n\n\n\n\n| 操作符 | 描述 | 示例 |\n| :--- | :--- | :--- |\n\
  | `=` (赋值) | 此运算符将右侧操作数的值设置为左侧操作数的值 | `y = $b` 将将 `b` 的值赋给 `y` |\n| `==` (等价) |\
  \ 此运算符比较两个数字的值，如果两个数字数值相等，则返回 true。 | `[ $x == $y ]` 结果为 false。 |\n| `!=` (不相等)\
  \ | 此运算符仅比较两个数字，如果两个数字不同，则返回 true。 | `[ $x != $y ]` 结果为 true。 |\n\n所有的条件表达式都应该包含在方括号内，如下所示\
  \ `[ $x == $y ]` 是正确的，而 `[$x==$y]` 是错误的。所有算术计算均使用长整型。\n\n### 关系运算符\n\nbash shell\
  \ 支持关系运算符，特别是针对数字的特定运算符。关系运算符不适用于字符串。作为说明，以下运算符可以用于检查 15 和 40 之间的关系，以及 \"15\" 和\
  \ \"40\" 之间的数值范围，但不能用于 \"fifteen\" 和 \"forty\" 之间。假设变量 `x` 存储 15，变量 `y` 存储 40：\n\
  \n| 操作符 | 描述 | 示例 |\n| :--- | :--- | :--- |\n| `-eq` | 此运算符确定给定值是否相等；如果相等，则条件为真。\
  \ | `[ $x -eq $y ]` 为 false。 |\n| `-ne` | 此运算符确定两个操作数的值是否不等等；如果操作数不等等，则条件为真。 | `[\
  \ $x -ne $y ]` 为 true。 |\n| `-gt` | 此运算符用于确定左侧操作数的值是否大于右侧操作数的值；如果大于，则条件返回 true。\
  \ | `[ $x -gt $y ]` 为 false。 |\n| `-lt` | 此运算符确定左侧操作数的值是否小于右侧操作数的值；如果为，则条件为真。 |\
  \ `[ $x -lt $y ]` 为 true。 |\n| `-ge` | 此运算符确定左侧操作数的值是否大于或等于右侧操作数的值；如果肯定的，则条件变为真。\
  \ | `[ $x -ge $y ]` 为 false。 |\n| `-le` | 此运算符尝试找出左侧操作数的值是否小于或等于右侧操作数的值；如果肯定的，则条件变为真。\
  \ | `[ $x -le $y ]` 为 true。 |\n\n在 bash 脚本中，所有条件语句应该放在带空格的括号内。例如，示例 `[ $x <= $y\
  \ ]` 是正确的，而 `[$x <=$y]` 是错误的。\n\n### 布尔运算符\n\nBash shell 支持表所示的布尔运算符。假设变量 `x` 存储\
  \ 20，变量 `y` 存储 40：\n\n| 操作符 | 描述 | 示例 |\n| :--- | :--- | :--- |\n| `!` | 此运算符称为逻辑非。它将条件反转。\
  \ | `[ ! false ]` 为 true。 |\n| `-o` | 此运算符称为逻辑或。如果两个操作数中有一个为真，则条件为真。 | `[ $x -lt\
  \ 40 -o $y -gt 100 ]` 为 true。 |\n| `-a` | 此运算符称为逻辑与。如果两个操作数都为真，则条件返回 true。 | `[\
  \ $x -lt 40 -a $y -gt 100 ]` 为 false。 |\n\n### 字符串运算符\n\nBash shell 支持以下字符串运算符。假设变量\
  \ `x` 存储 \"def\"，变量 `y` 存储 \"hij\"：\n\n| 操作符 | 描述 | 示例 |\n| :--- | :--- | :--- |\n\
  | `=` | 等价运算符，用于检查两个操作数的值是否相同；如果相等，则条件返回 true。 | `[ $x = $y ]` 为 false。 |\n| `!=`\
  \ | 不等于运算符用于确定左侧操作数的值是否不等于右侧操作数；如果值不等，则条件返回 true。 | `[ $x != $y ]` 为 true。 |\n|\
  \ `-z` | 零运算符用于检查给定字符串操作是否为空；如果长度为零，则条件返回 true。 | `[ -z $x ]` 为 false。 |\n| `-n`\
  \ | 非零运算符检查输入字符串的长度是否不零；如果长度不为零，则条件返回 true。 | `[ -n $x ]` 为 true。 |\n| `Str` | 字符串运算符用于确定输入字符串是否为空；如果字符串为空，则条件返回\
  \ false。 | `[ $x ]` 为 true。 |\n\n### 文件测试运算符\n\n有许多运算符用于测试 Linux 中文件的各种属性。假设变量 `filename`\
  \ 存储一个存在的文件 \"peters_test\"，其大小为 200 字节并具有以下权限：\n\n| 操作符 | 描述 | 示例 |\n| :--- | :---\
  \ | :--- |\n| `-b` | 块运算符用于判断 filename 是否为特殊块文件；如果是，则条件返回 true。 | `[ -b $filename\
  \ ]` 为 true。 |\n| `-c` | 字符运算符判断 filename 是否为特殊字符文件；如果是，则条件返回 true。 | `[ -c $filename\
  \ ]` 为 true。 |\n| `-d` | 目录运算符用于确定 filename 是否为目录；如果是，则条件返回 true。 | `[ -d $filename\
  \ ]` 为 false。 |\n| `-f` | 普通文件运算符判断 filename 是否为普通 Linux 文件（相对于目录或其他特殊文件）；如果是普通文件，则条件返回\
  \ true。 | `[ -f $filename ]` 为 true。 |\n| `-g` | SGID 运算符判断 filename 是否开启了 SGID\
  \ 位（SGID 表示组 ID）；如果位已设置，则条件返回 true。 | `[ -g $filename ]` 为 false。 |\n| `-k` | 粘性位运算符判断\
  \ filename 是否设置了粘性位；如果已设置，则条件返回 true。 | `[ -k $filename ]` 为 false。 |\n| `-p` |\
  \ 管道运算符用于判断名为 filename 的文件是否为管道；如果该文件确实是管道，则条件返回 true。 | `[ -p $filename ]` 为 false。\
  \ |\n| `-t` | 此运算符用于检查文件描述符是否打开，以及是否与 Linux 终端关联；如果是，则条件返回 true。 | `[ -t $filename\
  \ ]` 为 false。 |\n| `-u` | SUID 运算符判断 filename 是否设置了 SUID 位（SUID 表示用户 ID）；如果位已设置，则条件返回\
  \ true。 | `[ -u $filename ]` 为 false。 |\n| `-r` | 可读运算符用于判断 filename 是否可读；如果可读，则条件返回\
  \ true。 | `[ -r $filename ]` 为 true。 |\n| `-w` | 可写运算符判断 filename 是否可写；如果可写，则条件返回\
  \ true。 | `[ -w $filename ]` 为 true。 |\n| `-x` | 可执行运算符判断 filename 是否为可执行文件；如果是，则条件返回\
  \ true。 | `[ -x $filename ]` 为 true。 |\n| `-s` | 此运算符判断 filename 大小是否大于 0；如果是，则条件变为真。\
  \ | `[ -s $filename ]` 为 true。 |\n| `-e` | 此运算符判断 filename 是否存在；即使是目录存在也为真。 | `[\
  \ -e $filename ]` 为 true。 |\n\n\n\n\n\n## Bash Shell 决策制定\n\n在本节中，我将讨论 Linux 中的\
  \ bash shell 决策制定。在 bash 脚本编写中，在某些情况下，你需要在两个路径中选择一条路径。条件语句允许你的程序做出正确的决策并执行正确的操作。Linux\
  \ Bash Shell 提供了基于不同动作的条件语句，用于执行不同的操作。我们在进行决策时主要使用两种 bash 语句：\n\n*  bash `if...else`\
  \ 决策语句\n*  bash `case...esac` 决策语句\n\n## Bash if...else 决策语句\n\n在 bash 中进行决策制定时，我们使用\
  \ `if...else`，它可以从多个给定的选项中选择一个。Linux Bash Shell 使用以下形式的 `if…else` 语句：\n\n* `if...fi`\
  \ 语句\n* `if...else...fi` 语句\n* `if...elif...else...fi` 语句\n\n在 bash 中，许多 `if` 语句使用关系运算符来检查逻辑关系。\n\
  \n## Bash Case 语句\n\nbash `case` 语句（在 bash 脚本中也称为 `case…esac` 语句）是一种用于替换嵌套 `if-elif`\
  \ 语句的条件流语句。`case-esac` 语句是多级 `if-then-else-fi` 条件流语句的可靠替代方案。这种条件流方法允许用户将一个变量与多个值进行匹配。与嵌套的\
  \ `if…elif` 语句相比，case 语句处理多分支条件更高效。下面是 `case…esac` 的示例：\n\n```bash\ncase $var_name\
  \ in\ncondition01)\n    command01\n    ...\n    ...\n    command0N\n    ;;\ncondition02)\n\
  \    command01\n    ...\n    ...\n    command\n    ;;\n*)\nesac\n```\n\nbash shell\
  \ 中的 `case...esac` 语句与传统编程语言（如 `Java` 或 `C++）以及 PERL 中的 `switch...case` 语句非常相似。\n\
  \n## Bash 循环结构\n\nBash 脚本利用了与 `Java` 和 `C++` 等传统语言类似的编程结构。Bash 使用循环（Loops）来获取一系列命令并持续执行它们，直到满足特定条件。循环结构主要用于自动化\
  \ Linux 中的重复性和例行任务。bash 脚本中主要有三种循环结构，即 `while`、`until` 和 `for` 循环。\n\n### 在 Bash\
  \ 中嵌套循环\n\nBash 允许在循环内部使用循环，这一过程称为嵌套。本质上，用户可以将一个 `while` 循环放在另一个 `while` 循环内部。\n\
  \n#### While 循环嵌套\n\n在创建 bash 脚本时，可以将一个 `while` 循环放在另一个 `while` 循环内部，如下所示：\n\n语法：\n\
  ```bash\nwhile commandname01 ; # 这是外层循环\ndo\n    # 如果 commandname01 为真则执行的语句\n \
  \   while commandname02 ; # 这是内层循环\n    do\n        # 如果 commandname02 为真则执行的语句\n\
  \    done\n    # 如果 commandname01 为真则在此处执行的语句\ndone\n```\n\n示例：这是一个嵌套循环的示例。让我们在数到七的循环内部再添加另一个倒计时循环：\n\
  \n```bash\n#!/bin/sh\nx=0\nwhile [\"$x\"-lt 8]\n### 这是外层循环\nloop1\ndo\n    y=\"\
  $x\"\n    while [\"$y\"-ge 0]\n    # 这是内层循环 loop2\n    do\n        echo -n \"$y\
  \ \"\n        b=`expr $y - 1`\n    done\n    a=`expr $x + 1`\ndone\n```\n该脚本将产生下面的结果。请注意\
  \ `echo -n` 在此处的作用。`-n` 确保 `echo` 命令不打印命令行的换行符。\n\n## Bash 循环控制\n\n接下来的部分将讨论用于循环的\
  \ bash 控制结构，例如 `break` 和 `continue` 语句。我们已经学习了创建循环以及通过循环来自动化不同的任务。在某些情况下，你应该退出循环或跳过循环的部分。在这些情况下，我们使用\
  \ `break` 和 `continue` 语句来控制循环。\n\n### Break 语句\n\nLinux `break` 语句是一种 bash shell\
  \ 构造，用于在执行完通向 `break` 语句的所有代码单元后，停止整个条件循环的执行。当循环结束时，它将跳转到代码的其他部分。\n\nBreak 语句语法：\n\
  ```bash\nbreak\n```\n我们使用上面的示例来退出嵌套循环。`break n`\n在参数上方，`n` 代表要退出的第 n 个外层循环。\n\n\
  Break 语句示例：下面的示例显示了循环一旦 `x` 变为 8 就会立即终止——\n\n```bash\n#!/bin/sh\nx=0\nwhile[ $x-lt\
  \ 10]\ndo\n    echo $x\n    if[ $x-eq 8]\n    then\n        break\n    fi\n    a=`expr\
  \ $x + 1`\ndone\n```\n\n我们有一个嵌套循环的示例。下面的 bash 脚本显示，如果 `varname1` 等于 13 且 `varname2`\
  \ 等于 10，程序代码将退出第一个和第二个循环——\n\n```bash\n#!/bin/sh\nfor varname1 in 123 4 5 6 7\n\
  do\n    for varname2 in 09\n    do\n        if[ $varname1 -eq 13] -a [ $varname2\
  \ -eq 10]\n        then\n            break 13\n        else\n            echo \"\
  $varname1 $varname2\"\n        fi\n    done\ndone\n```\n\n### Bash Continue 语句\n\
  \nBash 循环控制 `continue` 语句与 `break` 语句相同。`continue` 语句用于退出 `for`、`until`、`while`\
  \ 和 `select` 循环的当前迭代，而 `break` 语句用于退出整个循环。当在 `for` 循环中使用 `continue` 时，变量将获得下一个元素的值。当循环发生错误但用户仍需执行下次代码迭代时，可以使用\
  \ bash `continue` 语句。\n\nContinue 语句语法：\n```bash\ncontinue\n```\n上面的 `continue`\
  \ 命令只是跳转到同一循环内的当前迭代并执行下一次迭代。我们向 `continue` 语句传递整数参数，以便像 `break` 语句一样允许嵌套循环中的命令跳转到下一次迭代。`continue\
  \ N`\n上面的 `continue` 命令显示了 `N`，它代表要继续执行的第 N 个外层循环。`continue N` 会退出当前循环层级的所有剩余迭代，并从上方\
  \ N 层的循环继续。\n\n示例：下面的示例显示 `continue` 语句会退出 `if…then` 语句并开始处理下一个 `echo` 语句：\n\n```bash\n\
  #!/bin/sh\nNUMBERS=\"8 9 10 11 12 13 14\"\nfor NUMBERS in $NUMBERS\ndo\n    Z=`expr\
  \ $NUMBER % 2`\n    if[ $Z-eq 0]\n    then\n        echo \"Our result is an even\
  \ number!!\"\n        continue\n    fi\n    echo \"Our result is an odd number\"\
  \ndone\n```\n\n## Bash 变量替换\n\n| 序号 | 转义与描述 |\n| :--- | :--- |\n| 1 | `\\\\` 反斜杠转义序列\
  \ |\n| 2 | `\\a` 警报 (BEL) 转义序列 |\n| 3 | `\\b` 退格转义序列 |\n| 4 | `\\c` 这是抑制末尾换行的转义序列\
  \ |\n| 5 | `\\f` 这是分页符转义序列 |\n| 6 | `\\n` 这是换行转义序列 |\n| 7 | `\\r` 这是回车符转义序列 |\n\
  | 8 | `\\t` 这是水平制表符转义序列 |\n| 9 | `\\v` 这是垂直制表符转义序列 |\n\n\n\n\n当遇到包含一个或多个特殊字符的表达式时，shell\
  \ 会执行替换。\n\n### 替换示例\n\n下面的替换说明展示了变量被赋值了一个值，并且该值是在终端上打印的。这个符号被称为换行符，它本质上是在执行命令 `\\\
  n` 后将光标置于下一行。\n\n```sh\n#!/bin/sh\nx=20\necho -e \"The variable X stores the value\
  \ $x \\n\"\n```\n\n上述脚本将向我们显示如下结果。从上面的 `echo` 语句中我们得到了 `-e` 选项，它允许 bash shell 读取并理解反斜杠转义符号。在执行上述脚本后，我们的结果所示。\n\
  \n```bash\nroot@bakyrie:~# vim variable.sh\nroot@bakyrie:~# chmod u+x variable.sh\n\
  root@bakyrie:~# bash variable.sh\nThe variable X stores the value 20\nroot@bakyrie:~#\n\
  ```\n\n当我们从 `echo` 命令中移除 `-e` 选项时，`\\n` 退格字符被解释为字符串，并与语句的其他部分一起打印。\n\n```bash\n\
  root@bakyrie:~# bash variable.sh\nThe variable X stores the value 20 \\n\nroot@bakyrie:~#\n\
  ```\n\n`echo` 打印命令用于多种转义序列：我们有 `-e` 选项，用于帮助 bash shell 解析退格转义字符。我们还有 `-n` 选项，用于在向终端屏幕打印语句或字符串时禁用新行的插入。\n\
  \n## Bash 命令替换\n\nBash shell 命令替换（Command substitution）是一项允许 shell 处理命令，并将该命令的输出结果替换命令本身文本的功能，或者将输出作为另一个命令的参数传回终端。\n\
  \nBash 命令替换是 bash 执行一组指令，然后用处理后的输出替换这些命令的过程。\n\n## 替换结构\n\n替换命令的结构如下所示。\n\n`command`\n\
  \n在执行命令替换时使用反引号（backquote）。\n\n## 示例\n\n命令替换通常用于将命令的输出赋值给变量。下面的示例展示了命令的替换：\n\n```sh\n\
  #!/bin/sh\nDATE=`date`\necho \"TheDate today is $DATE\"\nUSERS=`who | wc -l`\necho\
  \ \"The number of users who are logged inis $USERS\"\nUP_TIME=`date ; uptime`\n\
  echo \"The system Uptime is $UP_TIME\"\n```\n\n上述脚本执行的结果：\nDate is Thu Sep 5 03:59:57\
  \ CAT 2019\nThe number of users who are Logged in is 1\nThe system Uptime is Thu\
  \ Sep 5 03:59:57 CAT 201903:59:57 up 10 days, 16:30, 2 user, load avg: 0.43, 0.47,\
  \ 0.55\n\n## 变量替换\n\n变量替换允许 shell 程序员处理变量的状态相关值。\n\n### 所有可能的替换表 ——\n\n| 序号 | 格式与描述\
  \ |\n| :--- | :--- |\n| 1 | `${var_sub}` 这允许替换 `var_sub` 的值。 |\n| 2 | `${var_sub:-word_sub}`\
  \ 如果我们的 `var_sub` 为空或未设置，则用变量 `word_sub` 替换变量 `var_sub`。`var_sub` 的值不会改变。 |\n| 3\
  \ | `${var_sub:=word_sub}` 如果变量 `var_sub` 为空或未设置，则将 `var_sub` 设置为 `word_sub` 的值。\
  \ |\n| 4 | `${var_sub:?message}` 如果变量 `var_sub` 为空或未设置，则将 `message` 打印到标准错误。此运算符用于检查变量是否正确设置。\
  \ |\n| 5 | `${var_sub:+word_sub}` 如果 `va_sub` 已设置，则用 `word_sub` 替换 `var_sub`。`var_sub`\
  \ 的值不会改变。 |\n\n\n\n\n\n## 示例\n\n以下是展示上述替换操作各种状态的示例−\n\n```bash\n#!/bin/sh\necho\
  \ ${var_sub:-\"This var_sub Variable is unset\"}\necho \"1 –The Value of variable\
  \ var_sub is ${var_sub}\"\necho ${var_sub:=\"This var_sub Variable is unset\"}\n\
  echo \"2 –The Value of variable var_sub is ${var_sub}\"\nunset var_sub\necho ${var_sub:+\"\
  This is the default variable value\"}\necho \"3 –The Value of variable var_sub is\
  \ $var_sub\"\nvar_sub=\"The Prefix\"\necho ${var_sub:+\"This is the default variable\
  \ value\"}\necho \"4 –The Value of the variable var_sub is $var_sub\"\necho ${var_sub:?\"\
  May you Please Print this message\"}\necho \"5 –The Value of the variable var_sub\
  \ is ${var_sub}\"\n```\n\n执行执行后，你将获得以下结果：\nVariable is not set\n1 –The Value of\
  \ variable var_sub is\nThis var_sub Variable is unset\n2 –The Value of the variable\
  \ var_sub is This var_sub Variable is unset\n3 –The Value of variable var_sub isThis\
  \ is the default variable value\n4 –The Value of the variable var_sub is The Prefix\n\
  The Prefix\n5 –The Value of the variable var_sub is The Prefix\n\n## 理解 Shell 基础组件\n\
  \n## Bash Shell 语法介绍\n\n当用户使用键盘输入内容时，bash shell 读取输入字符串并将其拆分为单词和操作符，使用引号规则来定义输入的每个字符。\n\
  \n当 shell 完成字符串的读取并将其拆分为单词和操作符后，bash shell 将这些拆分后的单词和操作符转换为命令和其他 bash 构造，并显示一个用于处理的退出状态。bash\
  \ shell 处理输入字符串的详细步骤如下所示：\n\n* 初始，bash shell 从用户自定义的名为 bash 脚本的文件读取输入，或者 shell 从用户的键盘输入读取一个输入流。\n\
  * shell 使用引号规则将输入流拆分为单词和操作符。这些单词和操作符使用通配符操作符 `.` 进行拆分。然后我们进行别名扩展（Alias expansion）。\n\
  * 在 shell 分析单词和操作符后，根据拆分出的标记（tokens）创建简单和复合 bash 命令。\n* 通过一系列 shell 扩展，扩展后的标记被拆分为文件名、命令、选项和参数的列表。\n\
  * 然后我们进行输入/输出重定向。接着将重定向操作数及其操作符从参数列表中移除。\n* 随后 shell 执行 bash 命令。\n* shell 可能会等待命令执行完成后再收集其退出状态。\n\
  \n## 理解 Shell 命令\n\nBash shell 命令（如 `mkdir dir1 dir2`）由 shell 命令和参数组成，并用空格分隔。在 `mkdir`\
  \ 示例中，命令是 `mkdir`，参数分别是 `dir1` 和 `dir2`。\n\n用户可以简单地通过组合多种方式组织的基础命令来创建复杂的 shell 命令，包括使用管道（其中上一个基本命令的输出重定向到第二个命令的输入）、使用条件语句和循环。例如\
  \ `ls | less`。\n\n## 使用 Bash Shell 函数\n\nBash shell 函数是若干组组合在一起处理的命令，可以被调用多次。shell\
  \ 函数的执行方式与基础命令类似。函数有助于提高 bash 脚本的可读性。函数通过调用其名称来执行。当 shell 的函数名被作为基本命令调用时，将处理该集合中的命令列表。\n\
  \n## 查看 Shell 变量\n\nBash shell 变量或参数是存储字符串、整数和数组值的实体，通过名称或数字进行引用。所有通过名称引用的参数都称为变量。我们有三类型的参数，即位置参数、特殊参数和变量。在\
  \ bash 脚本中，我们使用 `declare` 来创建变量。\n\n## Shell 变量扩展\n\n变量或参数扩展是从引用的实体中获取值的过程，例如扩展一个变量以显示其值。扩展是访问和操作变量存储值的能力。基础扩展通过在变量名前前加上\
  \ `$` 符号来完成。shell 扩展在命令字符串拆分为单词和操作符后执行。\n\n## 第二章：Shell 输入与输出\n\n在本章中，我将详细讨论 Shell\
  \ 输入/输出重定向。Linux 系统中的，命令从终端接收输入并将结果输出返回到你的终端。通常，命令从标准输入（standard input）读取输入，这是你的默认设置。同样，命令将其输出类型到标准输出（normal\
  \ output），这也是你的默认设置。\n\n## 什么是 Bash 重定向？\n\n重定向是捕捉脚本、命令和普通文件输出的过程。重定向通过使用某些 shell\
  \ 符号来实现：角括号 `<`、`>`，或者为了将输出捕捉到程序，我们使用管道符号 `|`。\n\n每当 bash shell 命令被处理时，总是通过读取和解释特殊符号进行输入或输出重定向。重定向使得文件描述符（file\
  \ descriptors）能够打开和关闭。通过重定向，文件描述符指向我们读取命令的各种文件。\n\n\n\n\n\n| 名称 | 文件句符 | 描述 | 缩写\
  \ |\n| :--- | :--- | :--- | :--- |\n| 标准输入 (Standard input) | 0 | 这是终端输入的默认数据流。在\
  \ `bash` shell 中，它默认对应用户的键盘输入。 | Stdin |\n|| 标准输出 (Standard output) | 1 | 这是输出的默认数据流，例如当命令显示或打印文本时。终端的默认输出是用户屏幕或控制台。\
  \ | Stdout |\n| 标准错误 (Standard error) | 2 | 这是终端上相关错误输出的默认数据流。在 `bash` shell 中，它默认对应用户的控制台或屏幕。\
  \ | Stderr |\n\n## Stderr\n\n我们可以使用文件句符来复制输出。要将终端输出重定向到文件句符，我们在文件句符数字前加上 `>&` “大于和和符号”运算符。以下是示例：\n\
  \n### 将 stdout 结果重定向到 stdout（文件句符 1）\n```bash\n[ppeters@rad-srv ~]$ echo\"hi there\
  \ people\">&1\nhi there people\n```\n\n### 将 stdout 重定向到 stderr（文件句符 2）\n```bash\n\
  [ppeters@rad-srv ~]$ echo\"hi there people\">&2\nhi there people\n```\n\n上面的示例与将输出重定向到文件类似（正如我们之前做的几个示例那样），`stdout`\
  \ 和其他句符被称为特殊文件，这要求我们使用 `>&` 而不是 `>`。上面的输出看起来相似，但当我们开始对输出进行管道操作时，区别就变得显而易见了。以下是重定向到\
  \ `stdout` 与重定向到 `stderr` 时情况的对比示例。\n\n### 重定向到 stdout 并通过重定向管道\n```bash\n[ppeters@rad-srv\
  \ ~]$echo\"some are redirections\">&1 | sed\"s/some/all/\"\nall are redirections\n\
  ```\n\n### 重定向到 stderr\n```bash\n[ppeters@rad-srv ~]$ echo“some are redirections”>&2\
  \ | sed\"s/some/all/\"\nall are redirections\n```\n\n## stderr, stdout 和 stdin 的常见用例\n\
  \n将合并输出重定向到文件的示例：\n```bash\n[ppeters@rad-srv ~]$./command file_name1 file_name2\
  \ file_name3 > log-filename 2>&1\n[ppeters@rad-srv ~]$ cat log-filestderr file_name2stdout\
  \ file_name1stdout file_name3\n```\n\n## 第三章：文件\n\n我们将开始介绍文件搜索以及各种搜索工具。然后我将讨论文件归档以及创建归档的各种方法。\n\
  \n在 Linux 命令行中有六种独特的搜索文件方法，每种方法都有其优势。在本书的这一节中，我们将查看各种搜索工具，即 `locate`、`find`、`whatis`、`whereis`\
  \ 和 `apropos`。这些工具具有独特的特性和优点；这些搜索程序用于不同的用途。\n\nLinux 用于搜索和查找文件的命令多种多样，每种命令在其他工具之外的领域也表现良好。本节将详细介绍各种搜索命令，并查看它们在搜索方面的优势。在进入每个工具的细节之前，下面我们将先对这些搜索工具进行简短的介绍。\n\
  \n### 搜索工具基础介绍\n\nLinux 管理员可能需要知道文件或目录在文件系统的位置，但可能不知道去哪里找到它。有六个 bash 命令可以用于搜索，包括\
  \ `whatis`、`whereis`、`find`、`locate`、`apropos` 和 `which`。\n\n### Find 介绍\n\n下面是\
  \ `find` 命令的语法：\n\n```bash\n[ppeters@rad-srv ~]$find search_path search_pattern\n\
  ```\n\n如果未指定文件路径，使用 `find` 搜索将从用户当前的工作目录开始，并向下搜索所有子文件夹。`find` 命令有许多选项，可以通过使用 `find`\
  \ 手页进行查看。在 bash 终端输入 `man find` 即可找到 `find` 命令的手页。最常用的选项是 `-name`，它引导我们的 `find`\
  \ 命令查找文件名包含指定字符串的文件和目录。\n\n```bash\n[ppeters@rad-srv ~]$ find / -name file_name\n\
  ```\n\n上面的 `find` 命令示例是在根目录 `/` 下搜索搜索模式中包含 `\"file_name\"` 字符串的文件。\n\n### Locate\
  \ 命令\n\n`locate` 命令的语法为：\n\n```bash\n[ppeters@rad-srv ~]$locate search_pattern\n\
  ```\n\n`locate` 命令允许我们看到每个在文件名或目录名中包含 `search_pattern` 字符串的文件或文件夹。要查找搜索模式为 `\"finger,\"\
  ` 的文件或文件夹，输入以下语句：\n\n```bash\n[ppeters@rad-srv ~]$locate pwd\n```\n\n`bash` `locate`\
  \ 命令利用 `slocate` 数据存储来搜索文件名中包含搜索模式字符串 `\"finger\"` 文件和文件夹。当 `locate` 数据库最新时，`locate`\
  \ 命令搜索字符串模式的速度更快。该 `locate` 数据库通过每天运行一次 `cron` 任务来安排自动更新。在 Linux 中，`cron` 作是一个在终端后台执行的小型实用程序，执行各种计划内的职责，例如每天早上\
  \ 6 点更新 `locate` 数据库。更新后的 `b` 命令在命令行界面上刷新 `slocate` 数据库。\n\n### Which, Whatis 和\
  \ Whereis 搜索工具\n\n#### Which 命令\n\n下面是该命令的语法：\n\n```bash\n[ppeters@rad-srv ~]$which\
  \ command_name\n```\n\n上面的 `which` 语句返回二进制文件（或可执行）`bash` 命令的路径。\n\n```bash\n[ppeters@rad-srv\
  \ ~]$which cd/usr/bin/cd\n[ppeters@rad-srv ~]$\n```\n\n上面的 `which` 命令示例显示了 `/usr/bin/cd`。\n\
  \n#### Whereis 命令\n\n下面是 `whereis` 命令的语法：\n\n```bash\n[ppeters@rad-srv ~]$whereis\
  \ command_name\n```\n\n下面的 `whereis` 命令示例返回了 `find` 命令的路径、`find` 命令的二进制文件、源代码的位置以及\
  \ `find` 手页的位置。\n\n```bash\n[ppeters@rad-srv~]$whereis find/usr/bin/find /usr/share/man/man1p/find.1p.gz\
  \ /usr/share/man/man1/find.1.gz\n[ppeters@rad-srv ~]$\n```\n\n#### Whatis 命令\n\n\
  `whatis` 命令的语法：\n\n```bash\n[ppeters@rad-srv ~]$whatis command_name\n```\n\n上面的\
  \ `whatis` 命令从命令的手页中显示 `command_name` 的详细信息。\n\n```bash\n[ppeters@rad-srv ~]$whatis\
  \ lp\n```\n\n\n\n\n\n## 搜索工具深度解析\n\n## 使用 Find 命令进行搜索\n\n最著名且经常使用的搜索命令行工具之一是 `Find\
  \ Command`。Linux 的 `find` 命令是一个搜索和定位实用，它根据匹配给定参数的指定搜索字符串，显示文件和目录的路径。在 bash 中，有多种用于搜索文件的条件，例如：按名称查找、按权限、用户、组、文件类型、修改和创建日期以及文件大小进行查找。本书将提供\
  \ `find` 命令最常见用例的实例说明。\n\nbash `find` 命令是一个用于遍历文件层次结构的命令行工具。该命令用于在文件系统中定位文件和目录，并对发现的文件执行后续操作。`Find`\
  \ 命令支持按名称、目录、文件、所有者、修改和创建日期以及文件权限进行搜索。通过在使用 `find` 命令时使用 `-exec` 选项，可以在找到的文件或文件夹上继继执行其他的\
  \ Linux bash 命令。\n\n### Find 命令语法\n\n```\n[ppeters@rad-srv ~]$find [search_path]\
  \ [expression] [-options] [search_item]\n```\n\n### 使用名称或扩展名查找文件\n\n在 Linux 文件系统中，我们可以使用文件名或扩展名来搜索文件。下面的示例搜索了\
  \ `/home/ppeters/` 文件夹及其所有子文件夹中的 `*.star` 文件：\n\n```\n[ppeters@rad-srv ~]$find /home/ppeters/\
  \ -name \"*.star\"\n```\n\n## Linux Linux Find 命令和语法\n\nBash find 语句具有以下语法：\n\n\
  ```\n[ ppeters@rad-srv ~]$find options find_path statement\n```\n\n- `options` 开关控制操作和\
  \ `find` 进程的优化技术。\n- `find_path` 特性定义了 `find` 开始搜索的位置，特别是在 Linux 根目录下查找搜索字符串。\n\
  - 上述语法中的 `Statement` 控制所有过滤 Linux 目录树以输出结果的测试。\n\n请看下面的示例：\n\n```\n[ppeters@rad-srv\
  \ ~]$find –O2 -L /var/www/html -name \"*.php\"\n```\n\n此 find 命令语句启用了最高级别的优化（`-O2`），并允许\
  \ `find` 命令跟随软链接（`-L`），软链接也称为符号链接。`find` 命令遍历整个 `/var/www/html` 目录树，寻找以 `.php` 结尾的文件。\n\
  \n### Find 命令示例\n\n| 语句 | 作用 |\n| :--- | :--- |\n| `find / -name 1st_file.conf`\
  \ | 在根目录及其子文件夹中搜索名为 `1st_file.conf` 的文件。 |\n| `find / -name *.png` | 在 `/` 目录及其子文件夹内搜索所有的\
  \ `.png` 图像或图片文件。 |\n| `find /etc -type f –empty` | 在 `/etc` 目录内搜索空文件。 |\n| `find\
  \ / -user ppeters -mtime 3 -iname \".db\"` | 搜索在过去 3 天内由用户 `ppeters` 修改过的所有 `.db`\
  \ 记录。 |\n\n## Find 选项与优化\n\n`find` 命令的基本配置忽略了通俗的软链接（即符号链接）。使用 `find` 命令选项的 `-L`\
  \ 开关允许结果为符号链接。通过其过滤技术，`find` 命令提高了其执行效率。`Find` 命令行实用程序有三个性能阶段，即：`-O1` 第一阶段、`-O2`\
  \ 第二阶段，以及第三阶段 `-O3`。默认的第一优化是 `-O1`。该优化强制 `find` 命令在执行所有之前的测试之前，首先根据文件名进行结果搜索。名为\
  \ `-O2` 的优化级别优先搜索文件名，就像在级别-O1 中一样。`-O2` 在处理额外的资源密集型任务之前，执行所有文件类型的搜索。优化级别 `-O3` 允许进行最深入的优化，并根据其相对成本和成功概率重新排列所有测试。\n\
  \n### Find 优化\n\n| 级别 | 详情 |\n| :--- | :--- |\n| 第一级 `-O1` | 第一级优化级别，它是默认值，初始过滤最初基于文件名。\
  \ |\n| 第二级 `-O2` | 这是 `find` 命令的第二级优化，它也从文件名开始初始搜索，然后转向文件类型。 |\n| 第三级 `-O3` | 这是\
  \ `find` 命令的第三级优化，允许根据资源的有效利用和固有的成功概率自动重新安排搜索。 |\n| `-maxdepth X` | 此开关对用户当前工作目录及其深\
  \ `X` 级的子目录进行搜索。 |\n| `-iname` | 此开关代表一个忽略大小写的过滤器。 |\n| `-not` | 使用带有 `-not` 开关选项的\
  \ `find` 命令确保显示不匹配测试用例的输出结果。 |\n| `-type f` | 此选项用于仅搜索所有文件。 |\n| `-type d` | 此开关用于仅搜索所有目录。\
  \ |\n\n\n\n\n\n## 使用 Find 的修改时间进行查找\n\n假设你正在使用 Linux 系统，似乎不记得把某些 PowerPoint 幻灯片和文本文件保存在哪里了。你只记得将这些文件下载到文件系统的时间段。你如何使用\
  \ `find` 命令行工具来定位你的幻灯片和文本文件呢？\n\n你需要使用启用了修改时间开关的 `find` 命令。在 bash 命令行中，每个文件都有三个时间戳，它们记录了对文件进行某些操作最后的时间，即\
  \ `atime`、`ctime` 和 `mtime`。时间戳 `atime` 代表文件被访问的时间，而 `ctime` 代表文件状态发生改变的时间（即文件或其属性被更改）。最后，我们还有\
  \ `mtime`，它代表修改时间，或文件内容被更改的时间。\n\n在 bash shell 中，你可以查找时间戳在特定年龄范围内的文件，甚至可以与其他时间戳进行比较。\n\
  \n使用带有 `-mtime` 选项的 `find` 命令可能的。过滤器或搜索将返回一个在 N*24 小时前最后访问的文件列表。例如，要搜索在过去三个月（90\
  \ 天）内最后访问的文件，我们使用选项 `-mtime +90`。\n\n* `-mtime +25` 意味着你正在搜索 25 天前更改的文件。\n* `-mtime\
  \ -30` 意味着你正在搜索小于小于 30 天的文件。\n* `-mtime 40` 如果你不包含 `+` 符号或 `-` 符号，它意味着上述示例指定的精确天数，即正好\
  \ 40 天前。\n\n`find` bash 命令允许用户根据文件更改或修改的日期查找或搜索文件：\n\n```bash\n[ppeters@rad-srv\
  \ ~]$ find /var/named -name \"*zone\" -mtime 4\n[ppeters@rad-srv ~]$ find /home/testuser/\
  \ -name \"*conf\" -mtime 6\n```\n\n第一个 `find` 命令返回了所有以搜索字符串 `zone` 结尾且在四天前更改的文件列表。第二个\
  \ `find` 命令过滤了测试用户的家目录，所有名称以字符串 `conf` 结尾且在过去六天内更改的文件。\n\n## 使用 Grep 进行搜索\n\n`find`\
  \ 命令只能根据文件的名称和元数据对目录层进行过滤。如果你需要搜索文件中的文本或内容，我们使用像 `grep` 这样的工具下面的示例说明了 `grep` 的用法：\n\
  \n```bash\n[ppeters@rad-srv ~]$ find /etc -type f -exec grep \"conf\" '{}' \\; -print\n\
  ```\n\n上述语句搜索 `/etc` 目录中由 `-type f` 关指定的类型为文件的对象，然后执行 `grep \"conf\"` 命令，为每个符合标准的对象文件找到所有包含\
  \ `\"conf\"` 文本字符串的文件。匹配的文件将使用 `-print` 关显示在终端屏幕上。为了找到匹配结果，大括号 `{}` 被用作占位符。大括号 `{}`\
  \ 包含在单引号（`' `）中，以防止 `grep` 处理格式错误的文件名。\n\n为了防止 shell 解释，`-exec` 命令以分号（`;`）结束，分号应该被转义（`\\\
  \ ;`）。\n\n在实现 `-exec` 选项之前，这种类型的命令可以使用 `xargs` 命令产生可比较的输出：\n\n```bash\n[ppeters@rad-srv\
  \ ~]$ find /usr -type f -print | xargs grep \"binary\"\n```\n\n## 使用 Find 查找并执行文件\n\
  \n### -exec 的基本用法\n\n`-exec` 选项或开关接受其参数并实现一个带有可选语句的内部实用程序。如果在给定的命令的任何地方存在空大括号 `{}`，则当前路径（`/the\
  \ /path/file_name`）将替换每个实例。在 bash shell 中不需要对大括号 `{}` 加引号。\n\n命令必须以分号为缀；用以检查它在何处结束（因为后面可能有更多选项）。分号必须被引用为\
  \ `\\;` 或 `';'`，以保护 `;` 不受 shell 影响，否则 shell 将其视为 `find` 命令的结束。\n\n下面的示例（前两行末尾的\
  \ `\\` 只是为了换行）：\n\n```bash\nfind / -type f –name ‘*.ppt’ –exec grep –q ‘devops’\
  \ {} ‘;’ –exec cat {} ‘;’\n```\n\n这将在当前工作文件夹或下方定位所有名称与模式 `*.ppt` 匹配的标准文件（`-type\
  \ f`）。它将检查使用 `grep-q` 识别出的任何文件中是否出现了字符串 `\"devops\"`（`grep-q` 不产生结果，只产生退出状态）。对于包含该字符串的文件，将执行\
  \ `cat` 以将文件内容显示到终端。\n\n`find` 命令允许用户根据文件更改或修改的日期查找或搜索文件：\n\n（此处由于原文内容重复或逻辑断层，根据指令“不要重复输出原文”原则，仅翻译逻辑部分，以下为翻译内容）\n\
