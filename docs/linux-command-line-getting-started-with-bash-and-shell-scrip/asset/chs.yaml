  \n`find` bash 命令允许用户根据文件更改或修改的日期查找或搜索文件：\n\n```bash\n[ppeters@rad-srv ~]$ find /var/named\
  \ -name \"*zone\" -mtime 4\n[ppeters@rad-srv ~]$ find /home/testuser/ -name \"*conf\"\
  \ -mtime 6\n```\n\n第一个 `find` 命令返回了所有以搜索字符串 `zone` 结尾且在四天前更改的文件列表。第二个 `find` 命令过滤了测试用户的家目录，所有名称以字符串\
  \ `conf` 结尾且在过去六天内更改的文件。\n\n## 使用 Grep 进行搜索\n\n`find` 命令只能根据文件的名称和元数据对目录层进行过滤。如果你需要搜索文件中的文本或内容，我们使用像\
  \ `grep` 这样的工具。下面的示例说明了 `grep` 的用法：\n\n```bash\n[ppeters@rad-srv ~]$ find /etc -type\
  \ f -exec grep \"conf\" '{}' \\; -print\n```\n\n上述语句搜索 `/etc` 目录中由 `-type f` 关指定的类型为文件的对象，然后执行\
  \ `grep \"conf\"` 命令，为每个符合标准的对象文件找到所有包含 `\"conf\"` 文本字符串的文件。匹配的文件将使用 `-print` 关显示在终端屏幕上。为了找到匹配结果，大括号\
  \ `{}` 被用作占位符。大括号 `{}` 包含在单引号（`' `）中，以防止 `grep` 处理格式错误的文件名。\n\n为了防止 shell 解释，`-exec`\
  \ 命令以分号（`;`）结束，分号应该被转义（`\\ ;`）。\n\n在实现 `-exec` 选项之前，这种类型的命令可以使用 `xargs` 命令产生可比较的输出：\n\
  \n```bash\n[ppeters@rad-srv ~]$ find /usr -type f -print | xargs grep \"binary\"\
  \n```\n\n## 使用 Find 查找并执行文件\n\n### -exec 的基本用法\n\n`-exec` 选项或开关接受其参数并实现一个带有可选语句的内部实用程序。如果在给定的命令的任何地方存在空大括号\
  \ `{}`，则当前路径（`/the /path/file_name`）将替换每个实例。在 bash shell 中不需要对大括号 `{}` 加引号。\n\n\
  命令必须以分号为缀；用以检查它在何处结束（因为后面可能有更多选项）。分号必须被引用为 `\\;` 或 `';'`，以保护 `;` 不受 shell 影响，否则\
  \ shell 将其视为 `find` 命令的结束。\n\n下面的示例（前两行末尾的 `\\` 只是为了换行）：\n\n```bash\nfind / -type\
  \ f –name ‘*.ppt’ –exec grep –q ‘devops’ {} ‘;’ –exec cat {} ‘;’\n```\n\n这将在当前工作文件夹或下方定位所有名称与模式\
  \ `*.ppt` 匹配的标准文件（`-type f`）。它将检查使用 `grep-q` 识别出的任何文件中是否出现了字符串 `\"devops\"`（`grep-q`\
  \ 不产生结果，只产生退出状态）。对于包含该字符串的文件，将执行 `cat` 以将文件内容显示到终端。\n\n（注：由于原文后半部分包含大量重复的乱码/重复句子，已遵循“不要重复输出原文”的原则，仅保留了核心意义的翻译内容。）\n\
  \n\n\n\n\n| `-a` | 打印每个匹配文件名的所有匹配路径名。 |\n\n## 命令的退出状态\n\n`which` 命令根据发生的情况返回以下称为退出状态的值：\n\
  \n| 退出状态 | 描述 |\n| :--- | :--- |\n| 0 | 状态 0 意味着搜索模式中的所有文件名都已找到，且均可执行。 |\n| 1 |\
  \ 状态 1 意味着未找到一个或多个文件名，或者不可执行。 |\n| 2 | 退出状态 2 意味着 `which` 命令中指定了无效选项。 |\n\n## Which\
  \ 示例\n\n```bash\n[ppeters@rad-srv ~]$ which bash\n```\n上述命令搜索执行 `bash` 命令时将运行的文件的路径。上述命令的结果为：\n\
  ```bash\n[ppeters@rad-srv ~]$ /bin/bash\n```\n\n## 使用 whatis 命令搜索\n\n### whatis\
  \ 命令\nLinux 中的 `whatis` 命令将搜索结果显示为单行手册页描述。其语法如下：\n\n`whatis [-dlv?V] [-r|-w] [-s\
  \ list] [-m system[,...]] [-M path] [-L locale] [-C file] command_name`\n\n`whatis`\
  \ 命令的基本用法非常。用户将工具名称作为输入，`whatis` 将搜索并显示该命令工具的单行描述。这里有一个示例：\n\n```bash\n[ppeters@rad-srv\
  \ ~]$ whatis ls\n```\n上述命令产生了以下输出：\n```bash\n[ppeters@rad-srv ~]$ ls (1)  - 列目录内容\n\
  ```\n\n## 使用 Whereis 命令搜索\n\nLinux `whereis` 命令用于查找命令的二进制文件、源码和手册页文件。该命令在有限的范围内（二进制文件目录、手册页目录和库目录）中搜索文件。\n\
  \n通常，它用于定位程序的执行文件、其手册页和配置文件。该命令的语法非常直接：只需输入 `whereis`，然后跟上你想了解的命令或程序名称。\n\n在 `bash`\
  \ 命令行工作时，我们希望快速知道特定二进制文件或命令的路径。是的，在这种情况下，`find` 命令是一个替代方案，但它会花费大量时间，并且可能还会产生一些不需要的结果。为此，有一个专门的命令：`whereis`。\n\
  \n`whereis` 命令用于定位指定的 Linux 系统文件的源码/二进制命令文件和手册章节。将 `whereis` 命令与 `find` 命令进行比较，我们发现它们有一些相似之处，因为这两个工具都用于相同的工作。两者之间的主要区别是，`whereis`\
  \ 命令在短时间内能提供更准确的结果。\n\n首先，从路径或目录元素中移除提供的名称，以及任何以 `.ext` 形式的前缀扩展，例如，由于版本控制产生的 `s.`\
  \ 前缀也会被移除。然后，`whereis` 命令尝试在标准的 Linux 目录列表中定位我们正在搜索的命令。\n\n### 关于 whereis 命令的注意点：\n\
  - `bash` `whereis` 程序利用 `chdir` 版本二工具以确保快速获得结果；我们应该确保路径名是完整且格式正确的。给定的路径名必须以正斜杠 `/`\
  \ 开头，并且应该是系统目录树中的有效路径；否则，它将在不产生任何有效结果的情况下退出。\n- `whereis` 命令有一个固定的非动态编码路径，这意味着你有时可能找不到正在查找的内容。\n\
  \n## Whereis 语法\n\n```bash\n[ppeters@rad-srv ~]$ whereis [options] filename\n```\n\
  \n### whereis 命令示例\n当我们想要找到 `apropos` 命令的位置时，我们在终端中执行以下命令：\n```bash\n[ppeters@rad-srv\
  \ ~]$ whereis apropos\napropos:/usr/bin/apropos /usr/share/man/man1/apropos.1.gz\n\
  ```\n\n### 选项\n\n| 符号 | 描述 |\n| :--- | :--- |\n| `-b` | 仅查找程序二进制文件。 |\n| `-m` |\
  \ 仅查找手册页章节。 |\n| `-s` | 仅查找命令源码。 |\n| `-u` | 此选项有助于搜索所有异常条目。如果 Linux 文件没有包含每个请求类型的每个条目，则被认为是异常的。例如，`whereis\
  \ -m -u *` 正在搜索当前工作目录中具有文档的文件。 |\n| `-B` | 此选项更改或限制 `whereis` 查找二进制文件的路径。 |\n| `-M`\
  \ | 此选项更改或限制命令 `whereis` 搜索手册页章节的位置。 |\n| `-S` | 此选项更改或限制 `whereis` 搜索命令源码的地方。 |\n\
  | `-f` | 此选项终止之前的文件夹列表并通知文件名的开始，这必须在在使用任何 `-B`、`-M` 或 `-S` 选项时才使用。 |\n\n## 使用 Apropos\
  \ 命令搜索\n\nLinux 操作系统带有海量的命令，因此有时记住每一个命令是非常困难的。在这种情况下，`apropos` 命令变得非常有用。`apropos`\
  \ 命令帮助那些不记得精确命令但记得与定义其用途或特征的命令相关的某些关键词的用户。通过使用用户提供的关键词，`apropos` 命令通过搜索 Linux 手册页定位命令及其功能。\n\
  \n### Apropos 语法\n\n```bash\n[ppeters@rad-srv ~]$ apropos [OPTIONS] keyword\n```\n\
  \n### apropos 命令示例\n假设你想归档或压缩文件，但不知道使用什么命令来归档文件，那么你可以在终端中输入 `apropos` 命令，它将显示所有相关的命令及其功能的简短描述。在运行下方的\
  \ `apropos archive` 命令后，你会发现许多与归档相关的命令。\n```bash\n[ppeters@rad-srv ~]$ apropos archive\n\
  apt-secure (8)\n```\n\n\n\n\n### 选项\n\n| `-w, --wildcard` | 此选项将每个关键字解析并解释为字符串模式，其中包含所有\
  \ shell 风格的通配符或元字符。每个关键字都将单独与现有的页面名称和手册页描述进行匹配。如果同时使用了参数 `--exact`，则只有当展开后的关键字字符串或模式完全匹配整个描述或\
  \ Linux 手册页名称时，才会输出匹配结果。否则，关键字也允许在描述的单词边界处进行匹配。 |\n| `-e, --exact` | 使用此选项时，每个关键字将与手册页名称及随随其后的手册页描述进行精确匹配。\
  \ |\n| `-a, --and` | 此选项仅输出匹配所有给定关键字的项。默认输出结果是显示匹配任何关键字的所有项。 |\n| `-l, --long` |\
  \ 此选项确保我们不会为了适应终端控制台宽度而修剪结果。在大多数正常情况下，输出将被修剪以适应终端宽度，以避免因编写不当的手册页 NAME 章节导致格式错误的结果。\
  \ |\n| `-s list , --sections list , --section list` | 此选项仅在指定的手册页章节中搜索。给定的列表是用冒号或逗号分隔的手册章节列表。如果手册页列表中的项是一个页面章节（例如\
  \ \"4 \"），则列出的描述将显示所有位于 \"4 \"、\"4python \"、4x \" 等章节的页面；而如果列表显示的是扩展名（例如 \"5perl\
  \ \"），则生成的列表将仅包含手册章节中该精确部分的页面。 |\n| `-m system [ ,...], --systems=system [ ,...]`\
  \ | 此选项用于在用户可以访问的其他操作系统中搜索。例如，为了过滤名为 \"MacOS\" 的操作系统的手册页描述，我们使用选项 `-m MacOS`。指定的系统可以是多个用逗号分隔的操作系统名称的组合。\
  \ |\n| `-M path , --manpath=path` | 此选项用于指定一组备选的、冒号分隔的手册页树进行过滤。默认情况下，`apropos` 使用\
  \ `$MANPATH` 环境变量，除非它为空或未设置，在这种情况下，它将根据你的 `$PATH` 环境变量确定一个合适的 \"manpath\"。此 `-M`\
  \ 选项会覆盖 `$MANPATH` 的内容。 |\n| `-L locale , --locale=locale` | `apropos` 命令通常通过调用名为\
  \ `setlocale` 的 C 过程来确定当前系统区域，该过程会搜索各种环境变量，可能包括 `$LC_MESSAGES` 和 `$LANG`。我们可以使用\
  \ `-locale` 选项临时覆盖确定的值。此选项用于向 `apropos` 命令提供区域字符串。请注意，locale 选项在实际开始搜索手册页之前不会生效。如帮助消息之类的结果将始终以初始设置的区域输出。\
  \ |\n| `-C file , --config-file=file` | 使用此用户配置文件而非默认的 `~/.manpath`。 |\n| `-h, --help`\
  \ | 此选项帮助显示帮助信息并退出。 |\n| `-V, --version` | 此选项显示版本信息。 |\n\n### 环境变量\n\n| 变量 | 设置\
  \ |\n| :--- | :--- |\n| `SYSTEM` | 设置 `$SYSTEM` 环境变量，其效果与将此变量指定为 `-m` 选项的参数相同。 |\n\
  | `MANPATH` | 设置 `$MANPATH` 环境变量，其值将被解释为冒号分隔的手册页树搜索路径。 |\n| `MANWIDTH` | 设置 `$MANWIDTH`\
  \ 环境变量，确保该值被用作终端宽度（如 `--long` 选项所述）。如果未设置此变量，将使用 `ioctl`（如果可用）、环境变量 `$COLUMNS` 的值计算终端控制台宽度，或者如果所有方法都失败，则退回到默认的\
  \ 80 个字符。 |\n| `POSIXLY_CORRECT` | 如果名为 `$POSIXLY_CORRECT` 的环境变量设置为空值，默认的 `apropos`\
  \ 搜索将使用扩展正则表达式 (`-r`)。 |\n\n\n\n\n在存储珍贵文件和通过互联网发送大文件时，压缩非常有帮助。对已经压缩的文件进行压缩会增加额外的销，因此你会得到一个略大的文件。停止对已经压缩的文件进行压缩。Linux\
  \ 有许多用于压缩和解压文件的程序。现在我将讨论两种最常用的压缩和解压文件工具。\n\n## 文件的压缩与解压\n\n在 Linux 操作系统中用于压缩和解压文件的常用工具是\
  \ `gzip` 和 `bzip2`。\n\n## 使用 gzip 程序压缩和解压文件\n`gzip` 是一种利用 Lempel-Ziv 编码 (`LZ77`)\
  \ 算法压缩和解压文件的工具。\n\n### 使用 gzip 压缩文件\n要压缩名为 `firstfile.txt` 的文件并将其替换为名为 `firstfile.txt.gz`\
  \ 的 gzipped 压缩归包，请在终端中运行以下命令：\n```\n[ppeters@rad-srv ~]$ gzip firstfile.txt\n```\n\
  `gzip` 命令行工具总是替换你提供的作为参数的原始文件，例如上面的参数 `firstfile.txt` 被替换为名为 `firstfile.txt.gz`\
  \ 的 gzipped 压缩归包。\n\n`gzip` 压缩工具以多种方式使用。一个示例是为 bash 命令的输出结果创建一个 gzip 压缩归包。下面的示例所示：\n\
  ```\n[ppeters@rad-srv ~]$ ls -l Downloads/ | gzip > firstfile.txt.gz\n```\n上面的插图为用户家目录下\
  \ `Downloads` 文件夹的长目录列表创建了一个 gzipped 压缩归包。\n\n### 压缩文件并重定向输出\n形式上，`gzip` 工具压缩给定的输入文件和目录并将它们替换为\
  \ gzipped 压缩归包。我们有一种方法保留原始文件并将输出重定向到标准输出终端。例如，以下语句压缩 `firstfile.txt` 并将产生的输出重定向到\
  \ `redirect.txt.gz`。\n```\n[ppeters@rad-srv ~]$ gzip -c firstfile.txt > redirect.txt.gz\n\
  ```\n同样，我们也可以解压 gzip 归包文件并指定我们想要创建的输出文件：\n```\n[ppeters@rad-srv ~]$ gzip -c -d redirect.txt.gz\
  \ > firstfile1.txt\n```\n上面的插图命令解压了 `redirect.txt.gz` 文件并将产生的输出重定向到名为 `firstfile1.txt`\
  \ 的文件。上述重定向实例没有删除原始文件。\n\n### 使用 gzip 工具解压文件\n要解压 `firstfile.txt.gz` 文件，并随后将其替换为解压后的原始归包，我们遵循下面的示例：\n\
  ```\n[ppeters@rad-srv ~]$ gzip -d firstfile.txt.gz\n```\n我们有 `gunzip` 解压工具可以用来压缩\
  \ gzip 压缩文件。我们使用 `gunzip`，如下所示：\n```\n[ppeters@rad-srv ~]$ gunzip firstfile.txt.gz\n\
  ```\n\n### 查看压缩文件的内容\n可以通过使用带有 `-c` 的 `gunzip` 程序查看归包文件中包含的文件文件夹，无需解压归包，如下：\n```\n\
  [ppeters@rad-srv ~]$ gunzip -c firstfile1.txt.gz\n```\n或者，我们可以使用 `zcat` 工具查看归包文件的内容，如下所示。\n\
  ```\n[ppeters@rad-srv ~]$ zcat firstfile.txt.gz\n```\n你也可以通过管道 `|` 将 `gunzip` 和\
  \ `zcat` 的输出重定向到 `less` bash 命令，以分页方式查看输出，如下所示：\n```\n[ppeters@rad-srv ~]$ gunzip\
  \ -c firstfile1.txt.gz | less\n[ppeters@rad-srv ~]$ zcat firstfile.txt.gz | less\n\
  ```\n或者，我们可以使用 `zless` 命令程序，它执行与管道化的 `zcat` 命令相同的工作。\n```\n[ppeters@rad-srv ~]$\
  \ zless firstfile1.txt.gz\n```\n\n### 使用 gzip 设置压缩级别\n`gzip` 的另一个显著优势是它支持使用压缩级别。主要有三个支持的压缩级别如下所示。\n\
  - `1` – 最快（压缩率低）\n- `9` – 最慢（最佳压缩级别）\n- `6` – 默认级别\n\n要压缩名为 `firstfile.txt` 的文件并将其替换为具有最佳压缩级别的\
  \ gzipped 压缩版本，我们在 `gzip` 工具中指定 `-9` 关如下所示：\n```\n[ppeters@rad-srv ~]$ gzip -9 firstfile.txt\n\
  ```\n\n### 合并多个压缩文件\n也可以将多个压缩归包文件连接或合并为一个归包。下面的示例展示了如何操作。\n```\n[ppeters@rad-srv\
  \ ~]$ gzip -c firstfile01.txt > redirect.txt.gz\n[ppeters@rad-srv ~]$ gzip -c firstfile02.txt\
  \ >> redirect.txt.gz\n```\n上面的示例显示了两个命令压缩了 `firstfile01.txt` 和 `firstfile02.txt`并将它们存储在一个名为\
  \ `redirect.txt.gz` 的归文件中。\n你可以使用以下任何一个命令查看两个文件（`firstfile1.txt` 和 `firstfile2.txt`）的内容而无需提取它们：\n\
  ```\n[ppeters@rad-srv ~]$ gunzip -c redirect.txt.gz\n[ppeters@rad-srv ~]$ gunzip\
  \ -c redirect.txt\n[ppeters@rad-srv ~]$ zcat redirect.txt.gz\n[ppeters@rad-srv ~]$\
  \ zcat redirect.txt\n```\n要了解更多关于 `gzip` 工具的信息，你可以输入下面的命令访问手册页：\n```\n[ppeters@rad-srv\
  \ ~]$ man gzip\n```\n\n## 使用 bzip2 压缩和解压\n`bzip2` 工具与 `gzip` 压缩程序类似。两者之间的主要区别在于压缩算法。`bzip2`\
  \ 使用名为 Burrows-Wheeler 块排序文本压缩算法和霍曼编码。所有使用 `bzip2` 压缩的文件都有 `.bz2` 扩展名。\n\n`bzip2`\
  \ 的用法与 `gzip`。只需将上面的 `gzip` 替换为 `bzip2`，`gunzip` 替换为 `bunzip2`，`zcat` 替换为 `bzcat`\
  \ 等此类推。\n\n`bzip2` 压缩会替换我们要压缩的文件；这可以通过运行下面的命令实现：\n```\n[ppeters@rad-srv ~]$ bzip2\
  \ firstfile.txt\n```\n如果你不想替换原始文件，请在 `bzip2` 工具中使用 `-c` 选项并将输出重定向到新文件。\n```\n[ppeters@rad-srv\
  \ ~]$ bzip2 -c firstfile.txt > output.bz2\n```\n解压压缩文件：\n```\n[ppeters@rad-srv ~]$\
  \ bzip2 -d firstfile.txt.bz2\n```\n或者，\n```\n[ppeters@rad-srv ~]$ bunzip2 firstfile.txt.bz2\n\
  ```\n在不解压缩的情况下查看压缩文件的内容：\n```\n[ppeters@rad-srv ~]$ bunzip2 -c firstfile.txt.bz2\n\
  ```\n或者，\n```\n[ppeters@rad-srv ~]$ bzcat firstfile.txt.bz2\n```\n```\n[ppeters@rad-srv\
  \ ~]$ man bzip2\n```\n\n## 归档文件和目录\n主要有两种工具用于归档文件和目录，即 `tar` 和 `zip`。本书分为两部分；第一部分详细介绍\
  \ `TAR` 工具的使用，第二部分将讨论 `ZIP` 工具。\n\n## Tar 命令\n通常称为 Tar 的磁带存档工具是一种在 bash 命令行上归档文件和目录的\
  \ Linux 工具。`tar` 用于将多个相同或唯一大小的文件组合到一个归档文件中。`tar` 有四个主要的工作模式，即 `c`、`x`、`r` 和 `t`。\n\
  \n1. `c` – `C` 模式用于从一个或多个文件以及一个或多个文件夹创建 `tar` 归包。\n2. `x` – 用于文件归档的提取模式。\n3. `r`\
  \ – 将新文件添加到 `tar` 归档文件末尾的操作模式。\n4. `t` – 该模式提供 `tar` 归档文件内部实体的列表。\n\n\n\n\n## 创建新的\
  \ Tar 存档\n\n为了演示说明，我们将使用名为 `example_dir` 的目录。该 `example_dir` 包含三个类型的文件：一个音乐文件、一张图片和一个文档。\n\
  \n```bash\n[ppeters@rad-srv ~]$ ls example_dir/wordfile.odt imagefile.jpg musicfile.mp3\n\
  ```\n\n以下是为 `example_dir` 文件夹创建新存档的命令。\n\n```bash\n[ppeters@rad-srv ~]$ tar cf example_dir.tar\
  \ example_dir/\n```\n\n从上面的示例可以看出，`c` 标志是创建（create）符号，文件名由 `f` 标志表示。下面的示例演示了如何从用户当前工作下的若干文件中创建一个\
  \ tar 档：\n\n```bash\n[ppeters@rad-srv ~]$ tar cf files_arch.tar 1st_file 2nd_file\
  \ 3rd_file\n```\n\n## 解压缩存档\n\n我们可以在存档所在的目录中通过执行下面的 `tar` 命令来解压 tar 档：\n\n```bash\n\
  [ppeters@rad-srv ~]$ tar xf example_dir.tar\n```\n\n也可以通过在命令选项部分使用大写的 `C` 标志在不同位置的文件夹中解压\
  \ tar 文件。例如，下面的 `tar` 语句在 `/usr/local` 目录下解压指定的 tar 存档。\n\n```bash\n[ppeters@rad-srv\
  \ ~]$ tar xf files_dir.tar -C /usr/local\n```\n\n或者，如下所示进入 `/usr/local` 目录并解压存档：\n\
  \n```bash\n[ppeters@rad-srv ~]$ cd /usr/local\n[ppeters@rad-srv local]$ tar xf ../example_dir.tar\n\
  ```\n\n某些情况下，你可能想要提取特定类型的文件。例如，以下命令提取 `.jpg` 类型的文件：\n\n```bash\n[ppeters@rad-srv\
  \ ~]$ tar xf example_dir.tar --wildcards *.jpg\n```\n\n## 创建 gzipped 和 bzipped 压缩存档\n\
  \n`tar` 命令默认创建 `.tar` 存档文件。需要注意的是，`tar` 命令可以配合 `gzip` 和 `bzip2` 压缩工具使用。以 `.tar`\
  \ 结尾的文件是指未压缩的 tar 存档。`.tgz` 和 `tar.gz` 扩展表示 gzip 压缩文件，而 `.tbz` 和文件扩展表示 bzip 压缩文件存档。`gzip`\
  \ 和 `bzip2` 存档是压缩存档。\n\n## 创建 gzip 压缩文件存档示例\n\n```bash\n[ppeters@rad-srv ~]$ tar\
  \ czf example_dir.tar.gz example_dir/\n```\n\n在上述所有的插图中，我们使用 `z` 标志通过 gzip 方法压缩存档。`v`\
  \ 标志配合 `tar` 命令使用，允许用户在创建存档时查看进度。\n\n```bash\n[ppeters@rad-srv ~]$ tar czvf example_dir.tar.gz\
  \ example_dir/example_dir/wordfile.odt image_dir/musicfile.jpg\n```\n\n上面的 `v` 标志代表详细（verbose）。在\
  \ Linux 中，可以从文件列表创建 gzip 压缩存档：\n\n```bash\n[ppeters@rad-srv ~]$ tar czf files.tgz\
  \ file_01 file_02 file_03\n```\n\n在当前目录解压 gzipped 存档，使用：\n\n```bash\n[ppeters@rad-srv\
  \ ~]$ tar xzf example_dir.tgz\n```\n\n在不同目录解压压缩存档，使用 `-C` 标志。\n\n```bash\n[ppeters@rad-srv\
  \ ~]$ tar xzf example_dir.tgz -C Downloads/\n```\n\n## 创建 bzipped 存档示例\n\n创建 bzip\
  \ 压缩文件时如下所示使用 `j` 标志。\n\n```bash\n[ppeters@rad-srv ~]$ tar cjf example_dir.tar.bz2\
  \ example_dir/\n```\n\n## 从文件列表创建 bzip 存档\n\n```bash\n[ppeters@rad-srv ~]$ tar cjf\
  \ files.tar.bz2 file_01 file_02 file_03\n```\n\n使用 `v` 标志显示进度。我们展示将 bzipped 存档提取到当前工作目录的示例：\n\
  \n```bash\n[ppeters@rad-srv ~]$ tar xjf example_dir.tar.bz2\n```\n\n或者，将存档提取到其他目录：\n\
  \n```bash\n[ppeters@rad-srv ~]$ tar xjf example_dir.tar.bz2 -C /tmp\n```\n\n## 创建多个文件/文件夹的存档\n\
  \n`tar` 命令允许你从多个文件和文件夹创建存档。一次性创建多个目录或文件的 gzip 压缩存档的过程请参考下面的示例：\n\n```bash\n[ppeters@rad-srv\
  \ ~]$ tar czvf example_dir.tgz Downloads/ example_dir/wordfile.odt\n```\n\n上面的示例创建了\
  \ `Downloads/` 目录和 `example_dir` 目录下 `wordfile.odt` 文件的压缩 bzip 存档，并将存档保存在当前工作目录。\n\
  \n## 创建存档时排除目录和文件\n\n可以从 `tar` 存档中排除特定的文件或目录。这在备份数据时是一个非常有用的功能。你可以选择要备份哪些文件或目录。我们使用\
  \ `--exclude` 关来移除不需要添加到压缩备份文件中的。例如，你可能想创建一个 `/home` 目录的存档，但排除 `Documents` 和 `Pictures`\
  \ 文件夹。示例所示：\n\n```bash\n[ppeters@rad-srv ~]$ tar czvf example_dir.tgz /home/Documents\n\
  ```\n\n上述 `tar` 命令创建了 `/home` 的压缩 gzip 存档。要创建压缩 bzip 存档，将 `z` 替换为 `j` 并使用上述示例中的\
  \ `.bz2` 扩展。\n\n## 列出存档文件而不提取\n\n列出存档文件，使用 `t` 标志。\n\n```bash\n[ppeters@rad-srv\
  \ ~]$ tar tf example_dir.tar example_dir/wordfile.odt example_dir/imagefile.jpg\
  \ example_dir/musicfile.mp3\n```\n\n查看详细输出使用 `v` 标志。\n\n```bash\n[ppeters@rad-srv\
  \ ~]$ tar tvf example_dir.tar\ndrwxr-xr-x ppeters/ppeters 0 2019-09-11 19:52 example_dir/\n\
  -rw-r--r-- ppeters/ppeters 9942 2019-09-11 13:49 example_dir/wordfile.odt\n-rw-r--r--\
  \ ppeters/ppeters 36013 2019-09-11 11:52 example_dir/imagefile.jpg\n-rw-r--r-- ppeters/ppeters\
  \ 112383 2019-08-22 14:35 example_dir/musicfile.mp3\n```\n\n## 向现有存档追加文件\n\n可以使用\
  \ `r` 标志向现有存档添加/更新文件或目录。查看下面的命令。\n\n```bash\n[ppeters@rad-srv ~]$ tar rf example_dir.tar\
  \ example_dir/ ppeters/ example.txt\n```\n\n上述命令将把名为 `ppeters` 的目录和名为 `example.txt`\
  \ 的文件添加到 `example_dir.tar` 存档中。Linux 用户可以验证文件已添加：\n\n```bash\n[ppeters@rad-srv ~]$\
  \ tar tvf example_dir.tar\ndrwxr-xr-x ppeters/ppeters 0 2019-09-11 6:56 example_dir/\n\
  -rw-r--r-- ppeters/ppeters 9942 2019-09-11 6:49 example_dir/wordfile.odt\n-rw-r--r--\
  \ ppeters/ppeters 36013 2019-09-11 6:54 example_dir/imagefile.jpg\n-rw-r--r-- ppeters/ppeters\
  \ 112383 2019-08-22 14:35 example_dir/musicfile.jpg\n```\n\n\n\n\n\n如果用户想了解更多关于\
  \ tar 归档的内容，可以输入以下命令查看 tar 手册页。\n\n```bash\n[ppeters@rad-srv ~]$ man tar\n```\n\n\
  ## 使用 ZIP 归档文件\n\n`ZIP` 是一种 Linux 文件打包和压缩工具。每个文件都以 `.zip` 扩展名存储在单个 `.zip-filename`\
  \ 文件中。`Zip` 通过压缩文件来减小文件大小，也被用文件打包工具。在 UNIX、Linux 和 Windows 等许多操作系统中都存在 `zip`。\n\n\
  如果你在两台 Linux 计算机之间的带宽受限，并且想要更快地传输文件，可以使用 `zip` 压缩文件后再传输。`zip` 程序将一个或多个压缩后的文档放在单个\
  \ zip 归档中，并附带文件数据（名称、路径、日期、最后修改时间、安全性和文件完整性检查数据）。你可以打包整个目录结构。\n\n在上一节中，我们学习了如何使用\
  \ `tar` 归档命令归档文件和文件夹。在接下来的章节中，我们将深入研究使用 `Zip` 和 `Unzip` 程序来归档和压缩文件及目录。`zip` 命令是一个集成了归档和压缩功能的工具，因此我们可以用它来实现文件归档、压缩和解压三个功能。然而，在压缩方面，我们还有主流的程序\
  \ `gzip` 和 `bzip2` 工具。\n\n### Zip 文件和目录归档实用\n\n大多数 Linux 发行版都预装了 `zip` 工具。万一不可用，你可以使用发行版的默认包管理器进行安装。下面给出了不同\
  \ Linux 发行版中安装 `zip` 和 `unzip` 的方法。\n\n### 在 RHEL、CentOS 和 Fedora 变体上：\n```bash\n\
  [ppeters@rad-srv ~]$ sudo yum install zip unzip\n```\n\n### 在 Debian 和 Ubuntu 发行版上：\n\
  ```bash\n[ppeters@rad-srv ~]$ sudo apt-get install zip unzip\n```\n\n### 在 SUSE\
  \ 和 openSUSE 发行版上：\n```bash\n[ppeters@rad-srv ~]$ sudo zypper install zip unzip\n\
  ```\n\n## 创建新归档\n\n将一组文件创建一个 zip 归档，使用的命令如下：\n\n```bash\n[ppeters@rad-srv ~]$ zip\
  \ files.zip file_01 file_02 file_03\n```\n\n下面是 bash 终端显示的示例输出：\n```text\nadding:\
  \ file_01 (stored 0%)\nadding: file_02 (stored 0%)\nadding: file_03 (stored 0%)\n\
  ```\n\n上述语句从 `file_01`、`file_02` 和 `file_03` 创建了一个名为 `files.zip` 的压缩文件归档。用户不需要为文件名添加\
  \ `.zip` 扩展名。添加它只是为了清晰。\n\n要创建一个文件夹的 zip 归档，请执行以下：\n\n```bash\n[ppeters@rad-srv\
  \ ~]$ zip zip_dir.zip files_dir/\nadding: files_dir/ (stored 0%)\n[ppeters@rad-srv\
  \ ~]$\n```\n\n上面的示例为 `files_dir` 文件夹创建了一个名为 `zip_dir.zip` 的 zip 归档。该语句仅将父目录添加到 zip\
  \ 归档中。某些情况下，你可能需要递归归档所有子文件夹；我们如下所示使用 `-r` 标志。\n\n```bash\n[ppeters@rad-srv ~]$ zip\
  \ -r zip_dir.zip files_dir/\nadding: files_dir/ (stored 0%)\nadding: files_dir/text_file.txt\
  \ (deflated 67%)\nadding: files_dir/audio_file.mp3 (deflated 6%)\nadding: files_dir/image_file.png\
  \ (deflated 3%)\n[ppeters@rad-srv ~]$\n[ppeters@rad-srv ~]$ zip -r zip_dir.zip files_dir/\
  \ file_01 file_02 file_03\nadding: example/ (stored 0%)\nadding: example/Image.png\
  \ (deflated 3%)\nadding: file1 (stored 0%)\nadding: file2 (stored 0%)\nadding: file3\
  \ (stored 0%)\n[ppeters@rad-srv ~]$\n```\n\n与 `tar` 归档工具不同，`zip` 归档压缩工具会在构建 zip\
  \ 归档并在必要时进行压缩。`Tar` 工具只负责归档，不进行压缩。\n\n### 创建包含多个目录和文件的归档\n\n有时需要创建一个包含多个文件和目录的归档。我们使用\
  \ `zip` 命令的 `-r` 选项来递归创建包含所有指定文件夹和文件的 zip 归档：\n\n```bash\n[ppeters@rad-srv ~]$ zip\
  \ zip_dir.zip file4\nadding: file4 (stored 0%)\n[ppeters@rad-srv ~]$\n```\n\n上面的示例是一个已存在的归档，我们正在向指定的\
  \ `zip_dir.zip` 归档中添加另一个文件。观察上面的 `zip` 程序示例；该语句仅更新现有归档的内容。每当用户指定一个已存在的文件或文件夹时，该归档都会被更新而不是替换。这种操作保留了原有的归档。这种将文件添加到现有归档的能力是\
  \ `zip` 程序相对于 `tar` 归档工具的优势。\n\n## 提取 zip 归档\n\n提取归档和创建归档一样简单。提取归档需要输入 `unzip` 命令并指定要提取的归档：\n\
  \n```bash\n[ppeters@rad-srv ~]$ unzip zip_dir.zip\n```\n\n下面是 `unzip` 命令的一个示例输出：\n\
  ```text\nArchive: zip_dir.zip\ncreating: files_dir/\ninflating: files_dir/text_file.txt\n\
  inflating: files_dir/audio_file.mp3\ninflating: files_dir/image_file.png\nextracting:\
  \ file_01\nextracting: file_02\nextracting: file_03\nextracting: file_04\n```\n\n\
  通过 `unzip` 工具，用户可以从 zip 归档中有选择地提取特定文件或文件夹。下面的语句从 `zip_dir.zip` 归档中提取 `file_03`。\n\
  \n```bash\n[ppeters@rad-srv ~]$ unzip zip_dir.zip file_03\nArchive: zip_dir.zip\n\
  extracting: file_03\n```\n\n### 列出 zip 归档内容\n\n`Unzip` 程序或工具允许用户在不提取文件的情况下列出 zip\
  \ 归档的内容，使用 `-l` 标志。\n\n```bash\n[ppeters@rad-srv ~]$ unzip -l zip_dir.zip\nArchive:\
  \ zip_dir.zip\nLength Date Name\n---------- ----- -----\n0 2019-09-11 15:15 files_dir/\n\
  286 2019-09-11 15:16 files_dir/text_file.txt\n807303 2019-09-11 14:03 files_dir/audio.mp3\n\
  6799 2019-09-11 14:45 files_dir/image.jpg\n10 2019-09-11 15:58 file_01\n10 2019-09-11\
  \ 15:58 file_02\n10 2019-03-11 15:58 file_03\n10 2019-03-11 16:37 file_04\n-------\
  \ 6050289 8 files\n[ppeters@rad-srv ~]$\n```\n\n当你想要确定要提取的文件或文件夹而不是直接提取整个归档时，列出\
  \ zip 归档的内容非常有用。在用户需要确定从归档中提取哪些文件的情况下，有必要查看或列出 zip 归档的内容。\n\n## 创建加密归档\n\n`zip`\
  \ 工具最出色的功能是允许用户创建加密或密码保护的归档。对于这种加密或密码保护的归档，用户需要输入密码才能提取或查看归档内容。加密归档是通过使用 `-e` 标志实现的。\n\
  \n```bash\n[ppeters@rad-srv ~]$ zip -e -r zip_dir.zip files_dir/ file_01 file_02\
  \ file_03 file_04\nEnter password:\npassword:\nadding: files_dir/ (stored 0%)\n\
  adding: files_dir/text_file.txt (deflated 67%)\nadding: files_dir/audio_file.mp3\
  \ (deflated 6%)\nadding: files_dir/image_file.png (deflated 3%)\nadding: file1 (stored\
  \ 0%)\nadding: file2 (stored 0%)\nadding: file3 (stored 0%)\nadding: file4 (stored\
  \ 0%)\n[ppeters@rad-srv ~]$\n```\n\n当创建加密加密归档时，在提取或查看归档内容时需要输入密码。\n\n```bash\n[ppeters@rad-srv\
  \ ~]$ unzip zip_dir.zip\nArchive: zip_dir.zip\nfiles_dir/text_file.txt password\n\
  ```\n\n## 创建分卷 zip 归档\n\n有时你需要在互联网上共享压缩归档。大多数归档可能太大，解决方案是创建一个由顺序的小归档组成的分卷归档。这些分卷归档可以作为小归档顺序发送。我们可以如下将分卷归档分成许多小部分，例如每个\
  \ 3 MB：\n\n```bash\n[ppeters@rad-srv ~]$ zip -r -s 5m archive.zip files_dir/\n```\n\
  \n上面的 `zip` 命令将创建许多大小为 5MB 的 zip 归档文件，如 `archivemp.z01`、`archivemp.z02`、`archivemp.z03`\
  \ 和 `archivemp.zip`。所有这些分文件都需要发送给接收者。在解压缩提取这些归档文件时，组成内容的小部分将被提取到一个名为 `files_dir`\
  \ 的单个文件夹中。\n\n```bash\n[ppeters@rad-srv ~]$ zip -r -s 2g archive.zip files_dir/\n\
  ```\n\n### 创建其他程序的归档\n\n`Zip` 命令行工具接受标准输入；这使得创建其他命令结果的归档变得可行。下面的示例显示我们可以将 `ls -l`\
  \ 命令的输出管道到 `zip` 工具作为输入。\n\n```bash\n[ppeters@rad-srv ~]$ls -l Documents/|zip ls_documents.zip\n\
  adding: - (deflated 56%)\n```\n\n`ls_documents.zip` 是 `ls` 命令的归档。该命令不会使用 `-l` 选项输出\
  \ zip 归档的内容。相反，你可以使用命令查看其内容：\n\n```bash\n[ppeters@rad-srv ~]$ unzip -p ls-documents.zip\
  \ | less\n```\n\n示例显示 `-p` 选项指代管道。\n\n### 通过指定压缩率压缩归档\n\n下面的语句显示了如何以最高压缩级别 `[9]`\
  \ 归档一个目录及其内容：\n\n```bash\n[ppeters@rad-srv ~]$ zip -r -9 archive.zip files_dir/\n\
  ```\n\n`Zip` 命令行工具支持三种压缩级别，如下所示：\n- `1` – 最快速度但效果最差\n- `9` – 最慢速度但效果最好\n- `6` –\
  \ 默认级别\n\n### 在创建归档时排除文件或文件夹\n\n在创建归档时，我们可以选择排除所有不需要的文件或子文件夹。如下所示使用 `-x` 标志：\n\n\
  ```bash\n[ppeters@rad-srv ~]$ zip -r zip_dir.zip files_dir/ -x files_dir/image_file.png\n\
  ```\n\n上面的 `zip` 命令创建了 `files_dir` 目录的归档，排除了 `image_file.png` 文件。通过 `unzip` 工具，用户可以在不需要提取归档的情况下验证归档的内容。\n\
  \n```bash\n[ppeters@rad-srv ~]$ unzip -l zip_dir.zip\n```\n\n## 从现有归档中删除文件\n\n即使在归档创建后，使用\
  \ `zip` 工具也可以删除归档内部的文件。如下所示使用 `zip` 命令的 `-d` 标志来删除不需要的文件：\n\n```bash\n[ppeters@rad-srv\
  \ ~]$zip -d zip_dir.zip \"files_dir/text_file.txt\"\ndeleting: files_dir/text_file.txt\n\
  ```\n\n同样地，要删除一组相同类型的文件（例如 `.txt` 文件），使用：\n\n```bash\n[ppeters@rad-srv ~]$ zip -d\
  \ zip_dir.zip \"files_dir/*.txt\"\n```\n\n# 第四章：编写 Bash 脚本\n\nBash Shell 脚本只是在一个文件中编写并运行的指令集合。你只是在文本文件中放置并运行的一系列指令。\
  \ 编写你的第一个 Shell 脚本 第一个 bash 脚本项目是 Hello World 示例。打开你喜欢的编辑器，编写一个名为 `firstscript.sh`\
  \ 的脚本文件，包含以下行。在终端中输入：\ni. `Vi firstscript.sh`\nii. 按键盘上的字母 \"I\" 进入插入模式\niii. 在\
  \ `firstscript.sh` 中输入以下：\n```bash\n#!/bin/bash\necho \"Hello World\"\n```\n\n\n\
  \n\n\n[content]\n\n`echo \"hello world\"` //显示到终端屏幕\niv. 输入上述内容后，按下键盘上的 ‘ESC’ 键退出插入模式并进入命令模式。\n\
  v. 退出插入模式后，输入 ':wq’。\nvi. 上面的 `:wq` 命令用于保存脚本并退出 `Vi` 编辑器。\n\n上面的第一行被称为 shebang。它告诉\
  \ Linux 壳（shell）这是一个 `bash` 脚本，并且它应该在 `/bin/bash` 壳上执行。随后的那行只是一个 `echo` 语句，它将传递给它的字符串单词显示在终端控制台上。\n\
  \n在输入 `Vi` 命令创建 `firstscript.sh` 后，需要给 shell 脚本赋予执行权限以使其可以运行。你可以像下面所示设置执行权限：\n\n\
  ```\n[ppeters@rad-srv ~]$ chmod +x firstscript.sh //添加文件执行权限\n```\n\n执行脚本有两种方法，如下所示。在授予执行权限后，你可以使用其中任一种方法来运行脚本：\n\
  \n```\n[ppeters@rad-srv ~]$ bash firstscript.sh\n[ppeters@rad-srv ~]$ ./firstscript.sh\n\
  ```\n\n### 脚本的输出\nHello world\n\n上面是我们自己的第一个且非常基本的 shell 脚本，它会在终端屏幕上打印 `Hello world\
  \ `。\n\nLinux 常用的命令行界面语言是 `Bash` shell 脚本。系统管理员每天可能为了各种目的执行许多例行命令。这些日常例行任务可以转换为\
  \ `bash` 脚本以自动化。任何 Linux 用户都可以非常快速且轻松地学习 `bash` 脚本语言。\n\n`bash` 脚本像任何其他编程语言一样，在代码旁并使用注释。这些脚本注释在执行时不会与\
  \ `bash` 脚本的其他部分一起处理。注释良好的 `bash` 脚本对于让用户理解脚本及其逻辑至关重要。在 `bash` 脚本中添加注释有许多方法。下面的示例脚本显示了如何添加单行或多行\
  \ `bash` 注释。下面是一个带有 `bash` 脚本的 `bash` 文件，展示了如何使用 `bash` 注释。`#` 符号用于添加单行注释，而单引号（‘）配合全冒号\
  \ `:'` 用于添加多行注释。\n\n```bash\ncomments_script.sh\n#!/bin/bash\n\n#输入一个数字\necho \"\
  Please enter a number\"\nread x\n\n: '\n检查输入的数字是否\n小于 12 或大于 12 或等于 12\n'\n\nif\
  \ [[ $x -lt 12 ]]\nthen\necho \"The number you entered is less than 12\"\nelif [[\
  \ $x -gt 12 ]]\nthen\necho \"The number you entered is greater than 12\"\nelse\n\
  echo \"The number you entered is equal to 12\"\nfi\n```\n\n### 执行上述脚本的示例输出：\n下面的示例显示了脚本执行了三次，输入值为\
  \ 10、12、15 和 23。将出现以下输出。\n\n```\nroot@BAKYRIE:~# bash comments_script.sh\nPlease\
  \ enter a number:10\nThe number you entered is less than 12\nroot@BAKYRIE:~# ./comments_script.sh\n\
  Please enter a number:15\nThe number you entered is greater than 12\nroot@BAKYRIE:~#\
  \ ./comments_script.sh\nPlease enter a number:12\nThe number you entered is equal\
  \ to 12\nroot@BAKYRIE:~# ./comments_script.sh\nPlease enter a number:23\nThe number\
  \ you entered is greater than 12\nroot@BAKYRIE:~#\n```\n\n### `echo` 命令\n`echo`\
  \ 程序或命令在 `bash` 脚本中用于将脚本输出显示到终端控制台。我们可以在 `bash` 中使用 `echo` 命令的许多选项以多种方式显示输出。下面我们通过创建一个带有以下脚本的\
  \ `bash` 文件来说明 `echo` 命令，演示 `echo` 命令的两种简单用法。从下面的示例来看，第一个 `echo` 将在终端屏幕上显示带有换行符的文本数据，而第二个命令将打印一个不带换行符的简单文本。\n\
  \n```bash\necho_commands.sh\n#!/bin/bash\n\n#显示第一个文本字符串\necho \"Print text with\
  \ a carriage return new line\"\n\n#显示第二个文本字符串\necho -n \"Print text without the\
  \ carriage return new line\"\n```\n\n### 输出结果：\n执行 bash 脚本。\n```\nroot@BAKYRIE:~#\
  \ chmod u+x echo_commands.sh\nroot@BAKYRIE:~# ./echo_commands.sh\nPrint text with\
  \ a carriage retun new line\nPrint the text without the carriage return liner\n\
  root@BAKYRIE:~#\n```\n\n### 变量\n任何编程语言都需要变量声明。`Bash` 变量可以用多种方式声明。如果变量中分配了一个值，则在变量开头时不使用任何符号。读取变量值时，使用符号\
  \ `$` 变量名。变量可以在 shell 终端上使用，也可以在 `bash` 脚本中使用。\n\n下面的命令声明了一个名为 `myvariable` 的字符串类型变量并指定值，然后我们在终端中打印变量的值。\n\
  \n```bash\n$ myvariable=\"Bash is cool\"\n$ echo $myvariable\n```\n\n### 输出：\n```\n\
  [root@BAKYRIE:~# ]myvariable=\"Bash is cool\"\n[root@BAKYRIE:~# ]echo $myvariable\n\
  Bash is cool\n```\n\n`root@BAKYRIE:~#`创建一个包含以下内容的 bash 脚本文件。在这里声明两个变量。这两个变量是 `$x`\
  \ 和 `$y`。我们需要确定存储在 `$x` 中的输入值是否等于存储在 `$y` 中的值。如果是，终端屏幕将显示“The two Numbers are equal\
  \ ”，否则将显示“The numbers are not equal ”。\n\n```bash\nvar_numbers.sh\n#!/bin/bash\n\
  \necho \"Please enter any number\"\nread x\ny=23\n\nif [[ $x -eq $y ]]\nthen\necho\
  \ \"The two numbers are equal here\"\nelse\necho \"The two numbers here are not\
  \ equal\"\nfi\n```\n\n### 示例输出：\n按照下面所示第 3 行运行脚本后，我们得到了下面的结果：\n\n```bash\n[root@BAKYRIE:~#\
  \ ]vi var_numbers.sh\n[root@BAKYRIE:~# ]chmod u+x var_numbers.sh\n[root@BAKYRIE:~#\
  \ ]./var_numbers.sh\nPlease enter a number:\n16\nThe two numbers here are not equal\n\
  [root@BAKYRIE:~# ]./var_numbers.sh\nPlease enter a number:\n13\nThe two numbers\
  \ here are not equal\n[root@BAKYRIE:~# ]./var_numbers.sh\nPlease enter a number:\n\
  23\nThe two numbers here are equal\n```\n`root@BAKYRIE:~#` 上述的 `var_numbers.sh`\
  \ 脚本执行了三次，值分别为 16、13 和 23。\n\n### 条件语句\n你可以像其他编程语言一样在 bash 中使用条件语句。`If-then-else`\
  \ 和 `case` 语句主要用于任何编程语言中实现条件语句。本教程的这一章节通过使用 `if` 语句展示了条件语句的使用。创建一个使用以下脚本中条件语句的 bash\
  \ 文件。在这里，用户将两个值作为输入，并将 `$code` 和 `$age` 存储在变量中。`If` 用于验证 `$age` 值是否大于或等于 18，并且 `$register`\
  \ 值是否为 1100。如果两种情况都成立，将打印另一个消息，“You are qualified to see the film.”，否则将打印“You are\
  \ not eligible to see the movie ”。\n\n```bash\nconditional.sh\n#!/bin/bash\n\necho\
  \ \"Please enter your code\"\nread code\n\necho \"Please enter your age\"\nread\
  \ age\n\nif [[ $age -ge 20 && $code -eq '3300' ]]\nthen\necho \"You are allowed\
  \ to watch this movie\"\nelse\necho \"You are not allowed to watch this movie\"\n\
  fi\n```\n\n### 示例输出：\n在获取不同的输入值后，将出现以下输出。1200 是一个代码，19 是第一次运行脚本时的年龄，此时条件完全不成立。\n\
  \n```bash\nroot@BAKYRIE:~#vim conditional.sh\nroot@BAKYRIE:~#chmod u+x conditional.sh\n\
  root@BAKYRIE:~#bash conditional.sh\nPlease enter your code\n1200\nPlease enter your\
  \ age\n19\nYou are not allowed to watch this movie\nroot@BAKYRIE:~#./conditional.sh\n\
  Please enter your code\n3300\nPlease enter your age\n23\nYou are allowed to watch\
  \ this movie\n```\n\n[/content]\n\n\n\n\n## 循环\n\n在执行脚本的不同部分时，循环被用于完成任务。与其他语言一样，Bash\
  \ 支持三种类型的循环语句。这三种循环语句是 `for` 循环、`while` 循环和 `until` 循环。根据编程需求在脚本中使用特定的循环。在本章中，将通过浅的示例展示这三种循环类型的用法。\n\
  \n### 使用 for 循环\n\n我们将创建一个 bash 脚本文件，在其中我们将使用 `for` 循环进行迭代。`for` 循环主要用于遍历输入列表或数组。这里使用了一个星期几名称列表，并使用循环遍历每个星期几。使用\
  \ `if` 条件语句根据星期几的名称打印特定的语句。\n\nforloop.sh\n```bash\n#在循环的每次迭代中读取星期几的名称\n\nfor day\
  \ in Monday Tuesday Wednesday Thursday Friday Saturday Sunday \ndo\n  #检查星期几是否为周一或周四\n\
  \  if [[ $day == 'Monday' || $day == 'Thursday' ]]\n  then\n    echo \"Training\
  \ on $weekday at 9:30 am\"\n  #检查星期几是否为周二、周三或周五\n  elif [[ $day == 'Tuesday' ||\
  \ $day == 'Wednesday' || $day == 'Friday' ]]\n  then\n    echo \"Seminar on $day\
  \ at 11:00 am\"\n  else\n    #为其他日期打印“Holiday”\n    echo \"This day $day is a Holiday\"\
  \n  fi\ndone\n```\n\n输出：\n运行脚本。\n```bash\n[root@BAKYRIE:~# ]chmod u+x forloop.sh\n\
  [root@BAKYRIE:~# ]./forloop.sh\nTraining on Monday at 9:30 am\nSeminar on Tuesday\
  \ at 11:00 am\nSeminar on Wednesday at 11:00 am\nTraining on Thursday at 9:30 am\n\
  Seminar on Friday at 11:00 am\nSaturday is a Holiday\nSunday is a Holiday\nroot@BAKYRIE:~#\n\
  ```\n\n### 使用 while 循环\n\n创建一个带有以下 bash shell 脚本的 bash 文件，在其中我们将利用 `while` 循环进行程序迭代。该脚本将打印\
  \ 1 到 20 范围内偶数且能被 5 整除的数字。在这里，变量 `$counter` 被用于控制循环迭代，每次迭代将该变量的值加 1。当 `if` 条件返回真时，将打印\
  \ `$counter` 的值。\n\ncounter_script.sh\n```bash\n#!/bin/bash\n\n#显示或输出消息\necho \"\
  Output numbers that are even and divisible by 4\"\n\n#声明并给计数器赋初值\ncounter=1\n\n\
  # 重复直到 $counter 的值小于或等于 40\nwhile [ $counter -le 40 ]\ndo\n  #确定 $counter 是否能被 2\
  \ 和 6 整除\n  if [[ $counter%2 -eq 0 && $counter%4 -eq 0 ]]\n  then\n    #不换行打印 $counter\n\
  \    echo \"$counter\"\n  fi\n  #将 $counter 增加 1\n  ((counter++))\ndone\n\necho\
  \ \"Done\"\n```\n\n在上面的脚本中，1-40 范围内内只有 10 个数字是偶数且能被 4 整除的。执行 `counter_script` 后将出现以下输出。\n\
  ```bash\n[root@BAKYRIE:~# ]chmod u+x counter_script.sh\n[root@BAKYRIE:~# ]./counter_script.sh\n\
  Output numbers that are even and divisible by 4\n4\n8\n12\n16\n20\n24\n28\n32\n\
  36\n40\nDone\nroot@BAKYRIE:~#\n```\n\n## 使用 ‘until' 循环结构示例\n\n我们正在创建一个带有以下脚本的 bash\
  \ 文件，在其中我们使用 `until` 循环进行迭代。该 `until_script.sh` 脚本将显示 10 到 50 之间的所有奇数。变量 `$x` 在此脚本用于迭代。\n\
  \nuntil_script.sh\n```bash\n#!/bin/bash\n\n#初始化变量 x\nx=50\n\n#重复循环直到 $x 的值大于 10\n\
  until [ $x -lt 10 ]\ndo\n  #检查 x 的值是否为奇数\n  if [[ $x%2 -gt 0 ]]\n  then\n    echo\
  \ $x\n  fi\n  #将 x 的值减 1\n  ((x=$x-1))\ndone\n```\n\n该脚本将打印 50 到 10 之间所有的奇数。运行脚本后将出现以下输出。\n\
  ```bash\n[root@BAKYRIE:~# ]vim until_script.sh\n[root@BAKYRIE:~# ]chmod u+x until_script.sh\n\
  [root@BAKYRIE:~# ]./until_script.sh\n49\n47\n45\n43\n41\n39\n37\n35\n33\n31\n29\n\
  27\n25\n23\n21\n19\n17\n15\n13\n11\nroot@BAKYRIE:~#\n```\n\n## 函数\n\n本质上，Bash 函数是一组命令，可以在脚本中多次使用和重复重用。函数的目的是帮助你增加\
  \ bash 脚本的可读性，并防止反复编写完全相同的代码。与大多数编程语言相比，Bash 函数受到一些限制。我们将在本节中解释 Bash 函数的基础知识，并演示如何在你的\
  \ shell 脚本中使用它们。\n\nBash 方法或过程基本上是许多指令，可以被重复调用。函数的目的是让你的 bash 脚本更具可读性。\n\n### Bash\
  \ 中的声明\n\n声明 bash 函数的结构非常直观。Bash 函数有两种声明方式：\n\n1. 第一种格式以函数名开始，后跟括号 `()` 也称为圆括号。这是最常用的格式。\n\
  \   `function_name() { commands }`\n\n2. 第二种函数语法以保留字 `function` 开始，后跟函数名。\n   `function\
  \ function_name { commands }`\n\n当一个代码块在脚本中需要运行多次时，可以使用函数来完成工作。你只需要通过名称调用函数即可。像其他约定语言一样，Bash\
  \ 不支持函数参数。但在本节中，可以通过独特的方式传递给 bash 函数。通过 `return` 语句或不使用 `return` 语句，都可以从函数返回值。\n\
  \n创建一个带有以下脚本的 bash 文件，学习如何在 bash 脚本中声明和调用函数。下面的 `basic_function.sh` 脚本声明了三个函数。第一个打印基础消息“Bash\
  \ scripting for beginners”的过程或函数。第二个函数被定义为调用过程后将字符串赋值给变量 `$return_str`，它将打印“Learn\
  \ bash here.”。\n\nbasic_function.sh\n```bash\n#!/bin/bash\n\n#声明一个过程/方法/函数\nfunction\
  \ display_string()\n{\n  echo \"Bash scripting for beginners\"\n}\n\n#声明一个返回字符串值的方法/函数\n\
  function str_data()\n{\n  #使用初始字符串值初始化变量\n  str_data=\"Start bash scripting today\"\
  \n}\n\n#声明一个读取输入参数的过程/方法\nfunction circle_area()\n{\n  #读取输入参数\n  local radius=$1\n\
  \  local area=$(echo $radius*$radius*3.14 | bc)\n  #向屏幕显示圆面积\n  echo \"The area\
  \ of the circle given radius $radius above is $area\"\n}\n\n### 调用函数显示字符串\ndisplay_string\n\
  \n### 调用方法将字符串赋值给变量\nstring_data\n\n#向屏幕显示变量字符串\necho $string_data\n\n# 读取用户输入的半径值\n\
  echo \"Please enter your radius size\"\nread rad\n\n### 调用函数根据半径创建面积\ncircle_area\
  \ $rad\n```\n\n\n\n\n\n### calculate_area $rad\n\n下面的输出是执行上方创建的脚本 `basic_function.sh`\
  \ 的结果。最初，我们调用了两次 `print_message` 和 `ret_strdata` 函数，它们将向终端屏幕输出字符串消息。最后，我们调用 `calculate_area`\
  \ 函数来显示从标准输入读取的半径计算出的圆面积。\n\n```bash\nroot@bakyrie:~# vim basic_function.sh\nroot@bakyrie:~#\
  \ chmod u+x basic_function.sh\nroot@bakyrie:~# bash basic_function.sh\nBash scripting\
  \ for beginners\nLearn bash scripting today\nPlease enter your radius size6\nThe\
  \ area of the circle given radius 6 above is 113.04\nroot@bakyrie:~#\n```\n\n##\
  \ 在脚本中调用程序\n\n在任何 bash 脚本中，你可以利用许多程序如 `bash`、`source`、`exec` 和 `eval` 来调用其他命令。作为示例，假设你构建了四个\
  \ bash 脚本文件：`sum_script.sh`、`deduct_script.sh`、`product_script.sh` 和 `division_script.sh`分别用于求和、减法、乘法和除法。以下是命令\
  \ `subtract_script.sh` 和 `division_script.sh` 的参数。下面是这四个文件的脚本。\n\n### sum_script.sh\n\
  ```bash\n#!/bin/bash\nx=60\ny=40\n((asnwer=$x+$y))\necho \"The sum of x and y is\
  \ $answer\"\n```\n\n### deduct_script.sh\n```bash\n#!/bin/bash\nx=$1\ny=$2\n((answer=$x-$y))\n\
  echo \"The result of the deduction of y from x is $answer\"\n```\n\n### product_script.sh\n\
  ```bash\n#!/bin/bash\n((answer=$1*$2))\necho \"The product of $1 and $2 is $answer\"\
  \n```\n\n### divide_script.sh\n```bash\n#!/bin/bash\nx=$1\ny=2\n((answer=$x/$y))\n\
  echo \"The result of dividing $x by $y is $answer\"\n```\n\n使用 `source`、`bash`、`eval`\
  \ 和 `exec` 命令创建一个名为 `call_function.sh` 的 bash 文件，内容列所示。在运行以下脚本之前，你必须设置权限允许该脚本在 bash\
  \ shell 中执行。`source` 命令用于调用文件 `add_script.sh`。`bash` 命令用于执行文件 `subtract_script.sh`。`eval`\
  \ 命令用于运行 `product_script.sh` bash 文件。对于 `eval` 程序，我们从 bash shell 参数中捕获 `eval` 的两个操作数值。最后，我们运行\
  \ `exec` 命令，它只对绝对路径操作。为了实现这一点，下方的 bash 文件提供了 `divide_script.sh` 的完整路径名。\n\n### call_function.sh\n\
  ```bash\n#!/bin/bash\n1st_script=\"sum_script.sh\"\n2nd_script=\"deduct_script.sh\"\
  \n3rd_script=\"product_script.sh\"\n4th_script=\"/home/ppeters/code/divide_script.sh\"\
  \nsource \"$1st_script\"\nbash $2nd_script 50 20\necho \"Enter the value of x\"\n\
  read x\necho \"Enter the value of y\"\nread y\neval bash $3rd_script $x $y\nexec\
  \ $4th_script 30\n```\n\n## 创建菜单\n\nBash 有一个非常有用的命令来生成实用菜单，即 `select` 命令。使用该命令可以产生不同类型的菜单。该命令使用特定的信息列表来生成菜单。使用\
  \ `vim` 命令根据下面的示例脚本代码创建一个 `menu_script` 脚本文件。`menu_script.sh` 脚本文件是关于如何使用 `select`\
  \ 命令在 bash 中创建选项菜单的示例。`menu_script` 脚本文件显示了五个菜单项的列表，这些项将作为菜单显示，提示用户从列表中选择任何语言。选中的值存储在\
  \ `$linguistic` 变量中，并通过与其他字符串拼接进行打印。bash 程序会频繁请求选择语言，等待用户按下终止菜单选项 6 以退出 `menu_script.sh`\
  \ 程序。\n\n### menu_script.sh\n```bash\n#!/bin/bash\n#向用户显示此条消息\necho \"Please choose\
  \ your favorite language\"\n#为菜单项创建语言列表\nselect language in Perl C++ Javascript\
  \ Bash C# Exit\ndo\n#显示选中的值\nif [[ $language == \"Exit\" ]]\nthen\nexit 0\nelse\n\
  echo \"Your chosen language is $language\"\nfi\ndone\n```\n\n根据下面的示例输出，用户最初按了四次打印了\
  \ Bash，然后第二次按了 5 显示 C#，然后按了 1 选择 Perl，最后按 6 退出程序。\n\n```bash\n[root@BAKYRIE:~]#\
  \ chmod u+x menu_script.sh\n[root@BAKYRIE:~#]../menu_script.sh\nPlease choose your\
  \ favorite language\n1) Perl\n2) C++\n3) Javascript\n4) Bash\n5) C#\n6) Exit\n#?\
  \ 4\nYour chosen language is Bash\n#? 5\nYour chosen language is C#\n#? 1\nYour\
  \ chosen language is Perl\n#? 6\ndone\n```\n\n## 命令行处理\n\n有时从命令行执行脚本时，我们需要提供输入值。在\
  \ bash 中，这种赋值可以通过两个方面完成。一种是使用参数变量，另一种是使用函数 `getopts`。此部分展示了如何使用参数变量从终端输入命令行信息。创建一个带有相应脚本的\
  \ bash 脚本文件，以查看从命令行读取的参数值。该脚本将读取三个命令行参数 `$operand1`、`$operand2` 和 `$operator`，它们将存储在变量中。数字和第二个参数值必须是四个算术运算符之一（`+`、`-`、`/`、`x`）才能正确运行脚本。如果检查\
  \ `$operator` 值并执行基于运算符的操作并打印值。\n\n### command.sh\n```bash\n#!/bin/bash\n#显示参数变量列表\n\
  echo \"Your argument values are: $1 $2 $3\"\n#将参数值存储在操作数中\noperand01=$1\noperand02=$3\n\
  operator=$2\n#检查第二个命令行参数的值以执行算运算\nif [[ $operator == '+' ]]\nthen\n((result=$operand01+$operand02))\n\
  elif [[ $operator == '-' ]]\nthen\n((result=$operand01-$operand02))\nelif [[ $operator\
  \ == 'x' ]]\nthen\n((result=$operand01*$operand02))\nelif [[ $operator == '/' ]]\n\
  then\n((result=$operand01/$operand02))\nfi\n#打印结果\necho -e \"Your operation result\
  \ is = $result\"\n```\n\n上面的 `commandlinescript.sh` 脚本使用四种不同的算术运算符运行四次。对于参数值 `12\
  \ + 6`、`12 – 6`、`12 x 6` 和 `12 / 6` 将出现以下输出。下面的结果输出显示了所有的输入和结果。\n\n```bash\n[root@bakyrie:~]#\
  \ vim commandlinescript.sh\nroot@bakyrie:~]# chmod u+x commandlinescript.sh\nroot@bakyrie:~]#\
  \ ./commandlinescript.sh 12 + 6\nYour argument values are: 12 + 6\nYour operation\
  \ result is = 18\n[root@bakyrie:~]# ./commandlinescript.sh 12 – 6\nYour argument\
  \ values are: 12 – 6\nYour operation result is = 6\n[root@bakyrie:~]# ./commandlinescript.sh\
  \ 12 x 6\nYour argument values are: 12 x 6\nYour operation result is = 72\n[root@bakyrie:~]#\
  \ ./commandlinescript.sh 12 / 6\nYour argument values are: 12 / 6\nYour operation\
  \ result is = 2\n```\n\n参数在 bash 中被使用，并被传递给 bash 中的键值对。我们希望你创建一个 `commandlinescript2.sh`\
  \ bash 文件，带有以下脚本，演示如何使用名称读取参数值。命令行 bash 脚本将读取两个参数变量。命名参数值在脚本的第一条语句中打印。接下来将使用循环遍历包含命令行参数值的数组。通过使用\
  \ `cut` 命令，数组中的每个元素都被分离为键值对。接下来，使用 case 语句根据键值打印特定的特定的消息。\n\n### commandlinescript2.sh\n\
  ```bash\n#!/bin/bash\n#显示参数变量列表\necho \"Your argument values are: $1 $2\"\n#使用 for\
  \ 循环独立读取每个参数\nfor arg in \"$@\"\ndo\n#分离参数名和值\nkey=$(echo $arg | cut -f1 -d=)\n\
  value=$(echo $arg | cut -f2 -d=)\n#根据参数名显示消息\ncase $key in\nname) echo \"The Student’s\
  \ name is $value\";;\nmark) echo \"The obtained mark is $value\" ;;\n*)\nesac\n\
  done\n```\n\n\n\n\n下面的结果显示了执行命令 `commandlinescript.sh` 的输出，该脚本提供了两个命令行参数：`name=\"\
  James Jones\"` 和 `mark=83`。这两个命令行参数被脚本拆分，生成的两个值显示在屏幕上。\n\n```bash\nroot@bakyrie:~#\
  \ vim commandlinescript2.sh\nroot@bakyrie:~# chmod u+x commandlinescript2.sh\nroot@bakyrie:~#\
  \ ./commandlinescript2.sh name=\"James Jones\" mark=83\nYour argument values are:\
  \ name=James Jones mark=83\nThe Student’s name is James Jones\nThe obtained mark\
  \ is 83\nroot@bakyrie:~#\n```\n\n# 执行算术运算\n执行算术运算是许多编程语言的共同需求。Bash 执行算术运算的方式与其他标准编程语言不同。Bash\
  \ 中的算术运算可以通过多种方式实现。本节展示了算术运算的简单方法之一。\n\n我们将创建一个名为 `arith_script.sh` 的 bash 文件，内容如下。该示例脚本演示了如何执行四种基本类型的算术运算。我们将在脚本开头使用双括号\
  \ `(( ))` 来展示简单的加法和除法运算。加法和除法运算符两侧是操作数，即双括号内的数字。在加法和除法运算之后，我们将进入预自增操作，如下所示。最后，在脚本的最后部分演示了使用简写符号进行递增。\n\
  \n```bash\narithmetic_script.sh\n#!/bin/bash\n\n# 执行求和运算\nresult=$((60+150))\n\n\
  # 在屏幕显示加法结果\necho \"Addition = $result\"\n\n## 对数值进行除法\nresult=$((150/25))\n\n###\
  \ 在屏幕显示除法结果\necho \"division = $result\"\n\n## 给 X 赋值\nX=10\n\n# 执行预自减\n((--X))\n\
  \n### 打印 X 的值\necho \"Value after decrement = $X\"\n\n## 使用简写运算符\n(( X += 10 ))\n\
  \n### 打印 X 的值\necho \"Value after adding 10 = $X\"\n```\n\n从上面可以看出所有的算术运算都是通过双括号执行的。我们也可以使用\
  \ `let`、`expr` 和 `bc` 命令在 bash 中进行算术运算。\n\n## 操作 Bash 字符串\nbash 中的字符串数据可以执行许多类型的任务。例如如字符串拼接、字符串比较、字符串拆分、字符串大小转换等。与其他标准编程语言不同，bash\
  \ 没有内置的字符串函数来执行字符串操作。本书的这一章节讨论了一些常见的字符串处理。\n\n### 字符串拼接\n字符串拼接是将两个或多个字符串相加的过程。在\
  \ bash 中，字符串通过在一个字符串后追加另一个字符串来连接。我们可以创建一个包含以下脚本的 bash 文件来展示字符串的使用。我们将初始化两个字符串变量，并在合并这两个变量后显示它们。示例显示\
  \ `$stringcat01` 和 `$stringcat02` 的内容将被合并并打印。\n\n```bash\nstringconcat.sh\n#!/bin/bash\n\
  \n### 初始化第一个字符串变量\nstringcat01=\"This user \"\n\n### 初始化第二个字符串变量\nstringcat02=\"\
  Loves Bash Scripting\"\n\n### 显示输出\necho \"$stringcat01$stringcat02\"\n```\n从上面可以看出所有的算术运算执行：\n\
  ```bash\nroot@bakyrie:~# vim stringconcat.sh\nroot@bakyrie:~# chmod u+x stringconcat.sh\n\
  root@bakyrie:~# ./stringconcat.sh\nThis user Loves Bash Scripting\n```\n\n## 字符串比较\n\
  为了进行字符串比较，bash 使用独特的运算符。我们将创建一个包含以下脚本的 bash 文件来演示如何比较字符串。在 `compare.sh` 中，如果输入匹配，则会显示一条消息。\n\
  \n```bash\ncompare.sh\n#!/bin/bash\necho \"Enter any string\"\nread text\n\n###\
  \ 检查输入是否为 Python\nif [ \"$text\" == \"Python\" ]; then\n    echo \"You can program\
  \ Python\"\nelse\n    echo \"You can program PERL\"\nfi\n```\n\n## 字符串拆分\nbash 没有内置的函数来拆分字符串。然而，使用\
  \ `IFS` 变量，我们可以将文本拆分为数组。我们创建一个包含以下脚本的 bash 文件来展示如何拆分文本数据。\n\n```bash\nstringsplit.sh\n\
  #!/bin/bash\n### 输入文本字符串\necho \"Please input a text string\"\nread text\n\n# 设置空格分隔符\n\
  IFS=' '\n\n### 将文本拆分为数组\nread -a str_array <<< \"$text\"\n\n# 打印数组的每个元素\nfor value\
  \ in \"${str_array[@]}\"; do\n    printf \"%s\\n\" \"$value\"\ndone\n```\n\n## 转换大小\n\
  大多数脚本语言都有内置功能来更改字符串的大小。但使用 `tr` 命令或 `^^` 符号可以更改字符串数据。下面的示例演示了如何将字符转换为大写和小写。\n\n\
  ```bash\ncase.sh\n#!/bin/bash\n### 初始化第一个文本字符串\ntext1='james@company.com'\n\n# 通过将所有字符转换为大写来打印\
  \ $text1 的值\necho \"${text1^^}\"\n\n### 初始化第二个文本字符串\ntext2='Bash scripting basics'\n\
  \n# 通过将所有大写转换为小写来打印 $text2\necho $text2 | tr [:upper:] '[:lower:]'\n```\n\n## 通过循环读取字符串数据\n\
  任何编程语言的字符串数据都可以视为字符数组。在本书的这一节中，我们讨论了如何使用 `for` 循环读取文本字符串数据。创建一个包含内容的 bash 脚本文件，使用循环读取文本字符串的每个部分。\n\
  \n```bash\nreadstring.sh\n#!/bin/bash\n# 使用 for 循环读取每个字符串\nfor value in Bash Programming\
  \ for the Beginners\ndo\n    echo $value\ndone\n```\n\n\n\n\n```bash\nif [[ $x -le\
  \ 100 ]]\nthen\n    exit 0\nelse\n    exit 1\nfi\n```\n\n`fisecondscript.sh`\n```bash\n\
  #!/bin/bash\n#运行 bash 文件，firstscript.sh\nbash \"first.sh\"\n\n#检查返回码是否等于 1\nif [\
  \ $? -eq 1 ]\nthen\n    echo \"The number you entered is greater than 100\"\nelse\n\
  \    echo \"The number you entered is less than or equal to 100\"\nfi\n```\n\n###\
  \ 输出：运行脚本。\n`bash secondscript.sh`\n\n当执行脚本并依次传递值 56 和 110 时，将出现以下输出。\n\n```bash\n\
  [root@bakyrie:~]# vim firstscript.sh\n[root@bakyrie:~]# chmod u+x firstscript.sh\n\
  [root@bakyrie:~]# vim secondscript.sh\n[root@bakyrie:~]# chmod u+x secondscript.sh\n\
  [root@bakyrie:~]# ./secondscript.sh\nPlease enter a number\n56\nThe number you entered\
  \ is less than or equal to 100\n[root@bakyrie:~]#\nroot@bakyrie:~# ./secondscript.sh\n\
  Please enter a number\n110\nThe number you entered is greater than 100\nroot@bakyrie:~#\n\
  ```\n\n### Bash 读写文件\nBash 脚本能够从文件读取并写入文件是一项基本要求。与所有其他主流编程语言一样，Bash 没有内置用于读写文件的函数。Bash\
  \ 中有几种方法可以读取文件。在 bash 中读取或写入文件最流行的方法之一是使用 bash `cat` 命令，也称为连接命令（concatenate）。`cat`\
  \ 命令主要用于读取文件的全部内容。我们可以使用循环和 `read` 命令逐行读取 bash 文件。使用重定向操作符 `>`（大于号）向数据写入 bash 文件至关重要。我们还可以使用双大于符号\
  \ `>>` 来向任何 bash 文件追加更多内容。\n\n### 在 bash 中读取文件\n我们将使用以下 bash 脚本创建一个 bash 文件，以读取一个名为\
  \ `hardwarefile.txt` 的现有文件。该硬件文件的内容所示。在 bash 脚本中，文件的全部内容首先通过 `cat` 命令读取；接下来使用 `while`\
  \ 循环逐行读取 bash 文件。\n\n**hardwarefile.txt**\n```\nDvdRom\nRAM\nMonitor\nKeyboard\n\
  Mouse\nScanner\nPrinter\n```\n\n`readfilescript.sh`\n```bash\n#!/bin/bash\necho\
  \ \"Reading the hardwarefile.txt file using cat command\"\n# 使用 `cat` 命令读取文件内容\n\
  content=`cat hardwarefile.txt`\necho $content\n\necho \"Reading the file line line\
  \ using loop\"\n# 分配文件名\nfilename='hardwarefile.txt'\n# 文件的每一行将通过循环的每次迭代读取\nwhile\
  \ read line;\ndo\n    # 打印行\n    echo $line\ndone<$filename\n```\n\n### 输出：运行以下命令。\n\
  ```bash\n$ cat hardwarefile.txt\n$ bash readfilescript.sh\n```\n根据上面的演示，第一个命令将在不运行任何\
  \ bash 脚本的情况下显示文件 `hardwarefile.txt` 的内容，第二个命令将运行 `readfilescript.sh` 脚本，并使用 `cat`\
  \ 命令和配合 `while` 循环的 `read` 命令打印两次文件内容。\n\n```bash\nroot@bakyrie:/home/ppeterszw#\
  \ cd\nroot@bakyrie:~# vim hardwarefile.txt\nroot@bakyrie:~# vim readfilescript.sh\n\
  root@bakyrie:~# cat hardwarefile.txt\nDvdRom\nRAM\nMonitor\nKeyboard\nMouse\nScanner\n\
  Printer\nroot@bakyrie:~# chmod u+x readfilescript.sh\nroot@bakyrie:~# ./readfilescript.sh\n\
  Reading the hardwarefile.txt file using cat command\nDvdRom RAM Monitor Keyboard\
  \ Mouse Scanner Printer\nReading the file line by line using loop\nDvdRom\nRAM\n\
  Monitor\nKeyboard\nMouse\nScanner\nPrinter\nroot@bakyrie:~#\n```\n\n### 在 Bash 中写入文件\n\
  在 bash 文件中创建的 bash 脚本用于向新的空文件写入新内容，如果文件已有内容，则追加数据。\n\n`writefilescript.sh`\n```bash\n\
  #!/bin/bash\necho \"Please enter any text\"\n# 读取数据\nread string1\n### 第一次将输入写入文件\n\
  echo $string1 > testfile.txt\n\necho \"Please enter some text\"\n### 读取另一个字符串\n\
  read string2\n### 在文件末尾追加数据\necho $string2 >> testfile.txt\n\n### 显示文件的完整内容\ncat\
  \ testfile.txt\n```\n运行脚本后将显示以下输出。\n```bash\nroot@bakyrie:~# vim writescript.sh\n\
  root@bakyrie:~# chmod u+x writescript.sh\nroot@bakyrie:~# ./writescript.sh\nPlease\
  \ enter any text\nPlease enter some text\n```\n\n### Bash 中的管道\n管道（pipe）是一种在不使用临时文件的情况下将一个命令的输出连接到另一个命令的输入的方法。语法为\
  \ `command1 | command2`。管道符号 `|` 用于链接命令。第一个命令的输出将作为第二个命令的输入。\n\n- 管道符号 `|` 用于链接命令。\n\
  - 第一个命令的输出作为第二个命令的输入。\n- 管道符号 `|` 用于过滤输出。\n\n上面的示例显示 `student_marks.txt` 具有以下输出。\n\
  \n**student_marks.txt**\n```\nDaina 109\nDavid 104\nSarah 101\nSusan 104\n```\n\n\
  \n\n\n\nSusan BSE-101 72\nSusan BSE-104 58\nSusan BSE-109 55\n\n```bash\nroot@bakyrie:~#\
  \ grep 'Susan' student_marks.txt\n```\nSusan BSE-109 55\nSusan BSE-104 58\nSusan\
  \ BSE-101 72\n```bash\nroot@bakyrie:~# wc -l tempfile.txt\n```\n3 tempfile.txt\n\
  \n从上面的插图中可以看出，我们可以轻松地通过管道（pipes）将上述三行命令组合，并通过运行单个命令产生相同的输出结果，如下例所示。我们在这里没有使用临时文件来输出结果。下面的插图展示了将\
  \ `sort` 命令的输出链到 `grep` 命令的输入，最后统计 `grep` 结果字数。\n\n```bash\nroot@bakyrie:~]# sort\
  \ student_marks.txt | grep 'BSE-101' | wc\n```\n\n### 输出\n运行上述管道语句的结果是 `student_marks.txt`\
  \ 文件中所有包含 \"BSE-101\" 字符串内容的字数。字数统计首先列出被搜索的字符串 \"BSE-101\" 出现的次数，并输出该实例中的单词数量（在本例中有九单词），最后显示结果中的总字符数（在上面的示例中为七十九个）。命令的输出将是\
  \ `3 9 79`。即三个包含字符串 \"BSE-101\" 的输出项。\n\n```bash\nroot@bakyrie:~# sort student_marks.txt\
  \ | grep 'BSE-101' | wc\n```\nSusan BSE-109 55\nSusan BSE-104 58\nSusan BSE-101\
  \ 72\n\n```bash\nroot@bakyrie:~# sort student_marks.txt | grep 'BSE-101' | wc\n\
  ```\n3 9 79\n\nroot@bakyrie:~#\n```\n\n### Bash 脚本练习\n\n#### 第一个练习\n在第一个练习中，你将创建一个脚本并在终端屏幕上显示“Having\
  \ fun with Scripting!”。\n创建 `exercise01.sh`：\n```bash\n#!/bin/bash\necho \"Having\
  \ fun with Scripting!\"\n```\n\n#### 第二个练习\n修改你在第一个练习中完成的脚本以引入变量。该变量将存储“Having fun\
  \ with Scripting!\"。\n创建 `exercise02.sh`：\n```bash\n#!/bin/bash\nstr_info=\"Having\
  \ fun with Scripting!\"\necho $str_info\n```\n\n#### 第三个练习\n这个练习关于使用变量存储 `hostname`\
  \ 的输出。打印“This script is running on the machine”，其中变量是 `hostname` 的输出。\n创建 `exercise03.sh`：\n\
  ```bash\n#!/bin/bash\nHOSTNAME=$(hostname)\necho \"This script is running on the\
  \ machine $HOSTNAME\"\n```\n\n#### 第四个个练习\n这个练习关于创建一个脚本来判断文件是否存在。当脚本发现文件存在时，它将显示“The\
  \ file does exist”。脚本的下部分将检查你是否能够写入该文件。如果用户有写入文件的权限，终端屏幕将显示“You have permissions\
  \ to edit the file”。否则，如果你没有权限，在终端上显示“You do not have permissions to process the\
  \ file”。\n创建 `exercise04.sh`：\n```bash\n#!/bin/bash\nUSER_FILE=\"/home/ppeters/test_file.txt\"\
  \nif [ -e \"$USER_FILE\" ]; then\n    echo \"The $USER_FILE path does exist\"\n\
  fi\nif [ -w \"$USER_FILE\" ]; then\n    echo \"You have permissions to edit the\
  \ file\"\nelse\n    echo \"You do not have permissions to process the file\"\nfi\n\
  ```\n\n#### 第五个练习\n在这次练习中，学习者需要创建一个 Linux bash 脚本，在终端屏幕上显示“chihuahua”、“doberman”、“hound”、“basset”、“pitbull”和“corgie”，每种犬种单独占一行。学习者应该用尽可能少的行数完成。\n\
  `exercise05.sh`：\n```bash\n#!/bin/bash\nDOGS=\"chihuahua doberman hound basset pitbull\
  \ corgie\"\nfor DOG in $DOGS\ndo\n    echo $DOG\ndone\n```\n\n### 总结\nLinux 是一门极其多样化的语言，你应该花时间去探索它。虽然初开始看起来可能有点复杂，但通过不断的练习，你将发现为什么鼠标作为伙伴被高估了！开个玩笑，我写这本书的目标是为你提供一个介绍，并带你了解一些最基本的\
  \ Linux 命令和特性。其核心思想是让你按照自己的节奏学习示例代码。Linux 适用于许多领域，而这正是我其他相关书籍涵盖的内容。例如，你想成为一名白黑客并开启网络安全与管理领域的职业生涯吗？Linux\
  \ 确实是程序员的梦想。希望你喜欢这次对 Linux 内部机制的观察。我希望这本书对你是一次愉快且受益匪浅的阅读。请告诉我你的想法，并关注本系列的下一本书，届时我将带你深入探索\
  \ Linux 和 bash 脚本的世界。祝你在 Linux 学习冒险中好运连连！\n\n### 参考文献\nNegus, C. (2015). *Linux\
