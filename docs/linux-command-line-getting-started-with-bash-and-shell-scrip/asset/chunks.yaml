    temporary files to store the preliminary results of the previous command.Syntax1st_cmnd
    | 2nd_cmnd1st_cmnd | 2nd_cmnd | nth_cmnd1st_cmnd arg01 | 2nd _cmnd arg01 arg02get_info_cmd
    | check_info_cmd | execute_info_cmd | build_info_cmd > result_data.fileget_data_cmd
    < input_data.file | verify_data_cmd | process_data_cmd | format_data_cmd > output_data.fileYou
    can pipe or link two or more commands concurrently.● The data path, which links
    the two commands, is called a pipe .● The bash vertical bar (|) is called the
    pipe symbol.● A shell pipe supports the Linux philosophy of chaining commands
    together to complete complex jobs.● Redirection in pipes is also allowed.● The
    data path only works in one direction:In bash scripting Pipes "|" are utilized
    to redirect bash command output from one program to the input into the other command.
    Pipes are used with several types of bash programs to particular output results.
    The bash command-line interface input is linked to the command output result through
    the use of the bash pipe operator. There is a need to write the bash commands
    in sequence using the pipe ( | ) symbol to get the expected output. With the pipe
    utility, we can execute two or more commands jointly in a single command by using
    a pipe. Without the pipe operator, users have to carry out compound commands in
    several lines to do the same straightforward job. Piping is advantageous for making
    sure that multiple lines of commands are shortened to ensure the Linux job is
    done in simple.Pipe syntax1st _cmnd | 2nd _cmnd| … | nth_cmndThe example above
    shows that the output of program first-cmnd will be passed as the input of 2nd_cmnd.A
    similar type of undertaking that is done with several lines of instructions can
    be executed with the pipe operator. For instance, student_marks.txt text file
    has the following output below.student_marks.txtJames   BSE-109         55


    David   BSE-104         65


    Sarah   BSE-101         87


    Susan   BSE-104         58


    Daina   BSE-109         80


    Susan   BSE-101         72We are going to demonstrate a bash script that initially
    sorts or arranges the contents of the students_marks.txt file. The bash script
    then runs the grep command to look for and print all the entries of the string
    representing course ‘BSE-101'' . Normally this can be done by using three separate
    commands. In this instance, we are going to use piping to join together the three
    commands into one. The first command to the left in the script sorts the file
    alphabetically. The second command will search the course code text string ‘BSE-101''
    using the `grep ` command. The results of the grep command are stored in a tempfile.txt
    file. The third command executes a word count command that displays the total
    count of lines, number of words, and the total count of characters in the tempfile.txt
    file by using `wc` command. Below is the rudimentary way of sorting, searching,
    and redirecting using separate multiple commands on the terminal.[root@bakyrie:~]#
    sort student_marks.txt


    [root@bakyrie:~]# grep ''BSE-101'' student_marks.txt > tempfile.txt


    [root@bakyrie:~]# wc tempfile.txtExample Output Result:There are three entries
    of the course, with name ‘BSE-101'' that exist in the file student_marks.txt.
    There are nine different words that are also present and 79 characters altogether.
    Below is the result of running the three separate commands.root@bakyrie:~# vim
