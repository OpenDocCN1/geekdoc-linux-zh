    # What is Bash?\n\n`BASH`, also known as ‘Bourne-Again SHell' is the default user\
    \ shell on Linux systems. `Bash` is primarily a command-line interpreter who has\
    \ traditional programming language constructs. In many circles `Bash` is treated\
    \ as a programming language albeit with logic peculiar to `Bash`. `Bash` as a\
    \ programming language has to support for variable constructs, functions and with\
    \ program decision flow control constructs like conditional statements and loops.\n\
    \n`BASH` shell prompts are depended on the privileges of the logged-in user. There\
    \ is a dollar sign (`$`) prompt for all regular users. Linux operating system\
    \ has many other types of shells, each with its own prompt, for example, `csh`\
    \ has `%` as the prompt. All privileged users like the `root` user have unique\
    \ prompts; they have the `#` as the prompt. (Petersen, 2008).\n\n`Bash` as the\
    \ command line interpreter keeps all commands that are entered into the terminal\
    \ as strings and has no concept of numbers unless a user has instructed it to\
    \ do arithmetic calculations. `Bash` operates in a simplified way as follows:\n\
    \n1. `Bash` takes the user's keyboard input and separates it into words basing\
    \ on white spaces (space or tab).\n2. `Bash` then assumes that the initial word\
    \ from the user input is always a command. `Bash` then takes everything that follows\
    \ after the first word as arguments to be passed to the command.\n3. After parsing\
    \ and splitting the user input `Bash` then tries to process the command and add\
    \ arguments if they are available.\n\n## Getting Started with Bash\n\nLinux has\
    \ a number of Distributions that are available for selection to users. All these\
    \ Linux distributions have the `bash` as the default shell. Before working through\
    \ this book, it is important to make a choice of your Distribution. I encourage\
    \ the reader to choose `Centos 7` Operating system. After choosing your Linux\
    \ Distribution, it is important to know which command line-based text editor you\
    \ are going to use.\n\nThe writer recommends installation of `VIM` (`VI` Modified)\
    \ editor on your Linux Server. Installation is different in `Centos` and `Ubuntu`.\
    \ `Vi` is a popular and extensively used text manipulation editor among Linux\
    \ system administrators. Although `Vi` is widely used, it is tough to learn for\
    \ novice Linux users primarily because it operates in two different modes, namely\
    \ the insert mode and the command mode. The insert mode is where users normally\
    \ type text in a file, and command mode is where your keyboard input is interpreted\
    \ as commands to perform on the text.\n\n## Setting up the Environment\n\nLinux\
    \ is a very flexible and customizable system. You can set the environment settings\
    \ and variables that define how your shell is going to function. You can allow\
    \ the system to automate something that you find yourself repeatedly setting or\
    \ changing.\n\n### The Shell Profile\n\nFor any Linux user, there's a `~/.profile`\
    \ file in the user's home directory. It is in this `.profile` file that you can\
    \ personalize user settings attached to their profile. When the command-line interface\
    \ is initialized the following steps happen:\n* `/etc/profile` is executed first\n\
    * Then the `/etc/bash.bashrc` file if your default shell is `bash` is executed,\
    \ then\n* `~/.profile` file is processed and\n* Finally, `~/.bashrc` file is executed\
    \ lastly.\n\nThe `~/.profile` file is executed by any of the available shells,\
    \ so it is important to put generic settings in this file. All `bash`-specific\
    \ settings should go in the `~/.bashrc` file. System administrators can set `bash`\
    \ environment variables and aliases in the `~/.bashrc` file and even run commands.\
    \ All the files listed under the user's home directory that are prefixed with\
    \ a dot are called \"dotfiles.\"\n\n### Environment Variables\n\nLinux allows\
    \ the use of environment variables to change the way the Linux system functions.\
    \ In the command line, you can set Environment variables on the terminal, or statically\
    \ by adding an entry into the `~/.bashrc` file. The `bash` shell has four customizable\
    \ prompts, namely `PS1`, `PS2`, `PS3`, and `PS4`.\n\n#### PS1 Prompt\n\n`PS1`,\
    \ also known as `Prompt String 1`, is the basic in-built customizable `bash` shell\
    \ variable displayed before each `bash` command in Linux. Customizations done\
    \ to the prompt include adding and modifying elements, changing background colors.\
    \ Below is the default `bash` prompt.\n\n![](rsrcCE.jpg)\nFigure 1- PS1 Prompt\n\
    \nFigure 1 above shows PS1 prompt with username `ppeters`, hostname `rad-srv`.\
    \ The most usual setting for `PS1` is `\\u@\\h:\\w$` which is a display of the\
    \ username , the hostname , and the current directory the user is working in.\n\
    \nThe following line is another example of the `PS1`: `ppeters@rad-srv:/var/log$`\n\
    The prompt above is displaying that the user has username `ppeters` and is logged\
    \ into a server with hostname `\"rad-srv ,\"` and the user is currently working\
    \ in the `/var/log` folder.\n\n#### PATH\n\nThe `bash` `PATH` environment variable\
    \ is configured to direct the shell to the location of the most common programs.\
    \ The `PATH` environment variable is configured to direct the shell to the location\
    \ of the most common programs. (Note: The source text contained significant repetitions\
    \ in this section which have been cleaned for clarity).\n"
