    # Displaying File Contents using the Cat Command


    Using the `cat` command, which is short for "concatenate" command, allows the
    Linux user to view or display the contents of a file. Below we have an example
    to display or show the contents of the file `ppeters_file` we created above:


    ```

    [ppeters@rad-srv ~]$ cat ppeters_file

    This is P Peters’s file. It was created today at 12 noon.

    We are going to store this text in this file.

    [ppeters@rad-srv ~]$

    ```


    The `concatenate` or `cat` command works with a number of options to modify our
    view. We can display line numbers in the file we are viewing by appending our
    `cat` command with `-b` command option as shown below:


    ```

    [ppeters@rad-srv ~]$ cat -b ppeters_file

    1 This is P Peters’s file. It was created today at 12 noon.

    2 We are going to store this text in this file.

    [ppeters@rad-srv ~]$

    ```


    # Counting Words in a File


    In Linux, we have a command to count the number of words in a file. This command
    is called `wc` short for "word count." To enumerate the number of lines, characters,
    and words in a file, we use the `wc` command with a number of options. The example
    below illustrates the usage of the `wc` command:


    ```

    [ppeters@rad-srv ~]$ wc /var/log/messages

    2 14 1013 /var/log/messages

    [ppeters@rad-srv ~]$

    ```


    After running the `wc` command, the output has a number of columns. The First
    Column in the result is the representation of the total count of lines in the
    file `ppeters_file`. The following Column 2 is the display of the words counting
    the file. We then have Column Three, which is a representation of the total number
    of bytes in the file. This column displays the file''s actual size. The Fourth
    and last Column in the results is the representation of the name of the file.


    The `wc` command can be utilized to count the contents of a number of files. This
    is done through appending all the names of files to the `wc` command. We have
    an example below to show the structure of the `wc` (word count) command on multiple
    files:


    ```

    [ppeters@rad-srv ~]$ wc file_name1 file_name2 file_name3

    [ppeters@rad-srv ~]$

    ```


    # Using the CP Command to Copy Files


    Our operating system has a number of command-line tools to manipulate files and
    directories. To create a copy of a file or directory we use the `cp` command.
    The `cp` abbreviation stands for copy and is used to make a copy of a file. The
    structure of the command is as follows:


    ```

    [ppeters@rad-srv ~]$ cp source_file destination_file

    [ppeters@rad-srv ~]$ cp source_file directory_name

    [ppeters@rad-srv ~]$ cp source_file1 source_file2 source_fileN directory_name

    [ppeters@rad-srv ~]$ cp [option] source_file destination_file

    [ppeters@rad-srv ~]$ cp source_name destination_name

    ```


    The bash statement below is illustrating the `cp` command copying file `ppeters_file`
    to `ppeters_copy`.


    ```

    [ppeters@rad-srv ~]$ cp ppeters_file ppeters_copy

    ```


    After copying, the command creates an additional file, there is going to be one
    more file `ppeters_copy` in your current working directory. This file is going
    to be an exact replica of the original file `ppeters_file`.


    # File Renaming using the MV Command


    There is built-in functionality in Linux to change the name and location of files
    and directories. This is called the renaming function; we utilize the `mv` (move)
    command to rename files and also change their location in the file system. The
    illustration of the `mv` command syntax is highlighted below:


    ```

    [ppeters@rad-srv ~]$ mv old_name_file new_name_file

    ```


    The following `mv` command will be executed to rename the existing file `ppeters_file`
    to `newppeters_file`.


    ```

    [ppeters@rad-srv ~]$ mv ppeters_file newppeters_file

    [ppeters@rad-srv ~]$

    ```


    The `mv` command will rename an existing file and completely change it into the
    new file. In this case, you will find the only `newppeters_file` in your current
    directory.


    # File Deletion using the RM Command


    The Linux command-line interface has the `rm` command, which is the command-line
    program to delete a file. The command `rm` has the following syntax:


    ```

    [ppeters@rad-srv ~]$ rm ppeters_file

    ```


    Generally, Linux files may contain some important data so we should always follow
    best practices in erasing them. The best practice is to use the interactive mode
    while using this `rm` command. It is recommended that the `rm` command be used
    with the `-i` option.


    Below is the illustration of the `rm` command to remove a file completely. We
    are removing an existing file called `filename`.


    ```

    [ppeters@rad-srv ~]$ rm filename

    [ppeters@rad-srv ~]$

    ```


    Through the `rm` command, we are capable of deleting multiple files at once by
    just appending the files that need to be deleted to the `rm` command.


    ```

    [ppeters@rad-srv ~]$ rm file_name01 file_name02 file_name03

    [ppeters@rad-srv ~]$

    ```


    # Absolute and Relative Paths in Linux


    Files in a Linux operating system are organized within a hierarchical file system
    tree with the root directory (`/`) at the top of the inverted tree. The path to
    any file within this Linux directory hierarchy is described by file''s path. Components
    of the file path are separated by `/` (forward slash). We have absolute and relative
    path names in Linux.


    Absolute paths begin with the forward-slash `/` in its name. Below we have some
    examples of absolute paths.


    ```

    [ppeters@rad-srv ~]$ /etc/systemd

    [ppeters@rad-srv ~]$ /var/log/messages

    [ppeters@rad-srv ~]$ /usr/local

    ```


    Linux paths can also be relative to the root. Relative paths do not begin with
    the forward-slash. When a user wants to determine their location, they use the
    `pwd` command:


    ```

    [ppeters@rad-srv ~]$ pwd

    [ppeters@rad-srv ~]$

    ```


    # Listing Contents of Directories


    The `ls` command is used to list the contents of a directory. The syntax of the
    `ls` command is shown below:


    ```

    [ppeters@rad-srv ~]$ ls -l

    ```


    # Creating Directories


    The `mkdir` command is used to create new directories. The syntax of the `mkdir`
    command is shown below:


    ```

    [ppeters@rad-srv ~]$ mkdir new_directory

    ```


    # Deleting Directories


    The `rmdir` command is used to delete empty directories. The syntax of the `rmdir`
    command is shown below:


    ```

    [ppeters@rad-srv ~]$ rmdir empty_directory

    ```


    # Variables in Bash


    Variables are used to store data for later use in a script. In Bash, variables
    are assigned using the `=` operator without spaces.


    ## Variable/Parameter Names


    Variable names can contain letters of the alphabet (`a-z` or `A-Z`), positive
    digits (`0-9`), and the special character accepted for variable names is the underscore
    (`_`). By convention, bash variables are declared in UPPERCASE.


    Below are examples of variable names:

    - `VARIABLE_1`

    - `VARIABLE_2`

    - `VARIABLE_A`


    Below are examples of invalid variable names:

    - `2VARIABLE`

    - `VARIABLE-`

    - `VARIABLE!`


    ## Defining Shell Variables


    Variables are used to store data for later use in a script. In Bash, variables
    are assigned using the `=` operator without spaces.


    Example variable definition:

    ```bash

    var_name=var_value

    ```

    The above example declares the variable `var_name` and assigns the value `var_value`
    to it. Variables of this type are called scalar variables. Scalar variables hold
    only one value at a time. Bash variables allow users to store any type of data.


    ## Accessing Variable Values


    Prefixing the variable name with the dollar sign (`$`) is the only way to access
    variable values. The bash script below will access the value of declared variable
    `NAME` and print it:


    ```bash

    #!/bin/sh

    NAME="James Jones"

    echo $NAME

    ```


    ## Variable Types


    Bash programming introduces us to three types of variables. In Bash, we have local,
    environment, and shell variables.


    ### Local Variables

    A local variable is a store of value that is present within the current instance
    of the bash shell. This variable and its values are unavailable to any other programs
    running in the operating system. The local variable setting is done at the command
    prompt.


    ### Environment Variables

    The next type of variable we have is the Environment Variable. This is a variable
    or parameter that is available to all child processes of the bash shell. Most
    programs require environment parameters for them to work.


    ### Shell Variables

    Lastly, we have shell variables. Shell variables are special bash parameters set
    by the shell and are required by bash for it to function correctly. These parameters
    are either environment variables or are local variables. As an example, the process
    ID number, also known as the PID, is represented by the `$` character:


    ```bash

    echo $$

    ```

    The above command displays the PID of the current bash shell.

