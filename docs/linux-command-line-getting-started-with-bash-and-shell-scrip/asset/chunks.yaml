    script file with the example script code below. The `menu_script.sh` script file
    is an illustration of how to use the `select` command to create a menu of options
    in bash. The `menu_script` script file shows a list of five menu items that will
    be displayed as a menu in this instance, prompting the user to select any language
    from the list. The selected value is stored in the `$linguistic` variable and
    subsequently printed by concatenating with another string. The bash program will
    frequently request that the language be selected awaiting the user to press the
    termination menu choice 6 to exit the `menu_script.sh` program.


