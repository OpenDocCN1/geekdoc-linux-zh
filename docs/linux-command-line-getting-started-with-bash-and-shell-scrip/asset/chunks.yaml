  trans: "\n\n# Bash Shell 决策制定\n\n在本节中，我将讨论 Linux 中的 bash shell 决策制定。在 bash 脚本编写中，在某些情况下，你需要在两个路径中选择一条路径。条件语句允许你的程序做出正确的决策并执行正确的操作。Linux\
    \ Bash Shell 提供了基于不同动作的条件语句，用于执行不同的操作。我们在进行决策时主要使用两种 bash 语句：\n\n*  bash `if...else`\
    \ 决策语句\n*  bash `case...esac` 决策语句\n\n## Bash if...else 决策语句\n\n在 bash 中进行决策制定时，我们使用\
    \ `if...else`，它可以从多个给定的选项中选择一个。Linux Bash Shell 使用以下形式的 `if…else` 语句：\n\n* `if...fi`\
    \ 语句\n* `if...else...fi` 语句\n* `if...elif...else...fi` 语句\n\n在 bash 中，许多 `if`\
    \ 语句使用关系运算符来检查逻辑关系。\n\n## Bash Case 语句\n\nbash `case` 语句（在 bash 脚本中也称为 `case…esac`\
    \ 语句）是一种用于替换嵌套 `if-elif` 语句的条件流语句。`case-esac` 语句是多级 `if-then-else-fi` 条件流语句的可靠替代方案。这种条件流方法允许用户将一个变量与多个值进行匹配。与嵌套的\
    \ `if…elif` 语句相比，case 语句处理多分支条件更高效。下面是 `case…esac` 的示例：\n\n```bash\ncase $var_name\
    \ in\ncondition01)\n    command01\n    ...\n    ...\n    command0N\n    ;;\ncondition02)\n\
    \    command01\n    ...\n    ...\n    command\n    ;;\n*)\nesac\n```\n\nbash shell\
    \ 中的 `case...esac` 语句与传统编程语言（如 `Java` 或 `C++）以及 PERL 中的 `switch...case` 语句非常相似。\n\
    \n## Bash 循环结构\n\nBash 脚本利用了与 `Java` 和 `C++` 等传统语言类似的编程结构。Bash 使用循环（Loops）来获取一系列命令并持续执行它们，直到满足特定条件。循环结构主要用于自动化\
    \ Linux 中的重复性和例行任务。bash 脚本中主要有三种循环结构，即 `while`、`until` 和 `for` 循环。\n\n### 在 Bash\
    \ 中嵌套循环\n\nBash 允许在循环内部使用循环，这一过程称为嵌套。本质上，用户可以将一个 `while` 循环放在另一个 `while` 循环内部。\n\
    \n#### While 循环嵌套\n\n在创建 bash 脚本时，可以将一个 `while` 循环放在另一个 `while` 循环内部，如下所示：\n\n\
    语法：\n```bash\nwhile commandname01 ; # 这是外层循环\ndo\n    # 如果 commandname01 为真则执行的语句\n\
    \    while commandname02 ; # 这是内层循环\n    do\n        # 如果 commandname02 为真则执行的语句\n\
    \    done\n    # 如果 commandname01 为真则在此处执行的语句\ndone\n```\n\n示例：这是一个嵌套循环的示例。让我们在数到七的循环内部再添加另一个倒计时循环：\n\
    \n```bash\n#!/bin/sh\nx=0\nwhile [\"$x\"-lt 8]\n# 这是外层循环\nloop1\ndo\n    y=\"\
    $x\"\n    while [\"$y\"-ge 0]\n    # 这是内层循环 loop2\n    do\n        echo -n \"\
    $y \"\n        b=`expr $y - 1`\n    done\n    a=`expr $x + 1`\ndone\n```\n该脚本将产生下面的结果。请注意\
    \ `echo -n` 在此处的作用。`-n` 确保 `echo` 命令不打印命令行的换行符。\n\n## Bash 循环控制\n\n接下来的部分将讨论用于循环的\
    \ bash 控制结构，例如 `break` 和 `continue` 语句。我们已经学习了创建循环以及通过循环来自动化不同的任务。在某些情况下，你应该退出循环或跳过循环的部分。在这些情况下，我们使用\
    \ `break` 和 `continue` 语句来控制循环。\n\n### Break 语句\n\nLinux `break` 语句是一种 bash shell\
    \ 构造，用于在执行完通向 `break` 语句的所有代码单元后，停止整个条件循环的执行。当循环结束时，它将跳转到代码的其他部分。\n\nBreak 语句语法：\n\
    ```bash\nbreak\n```\n我们使用上面的示例来退出嵌套循环。`break n`\n在参数上方，`n` 代表要退出的第 n 个外层循环。\n\n\
    Break 语句示例：下面的示例显示了循环一旦 `x` 变为 8 就会立即终止——\n\n```bash\n#!/bin/sh\nx=0\nwhile[ $x-lt\
    \ 10]\ndo\n    echo $x\n    if[ $x-eq 8]\n    then\n        break\n    fi\n  \
    \  a=`expr $x + 1`\ndone\n```\n\n我们有一个嵌套循环的示例。下面的 bash 脚本显示，如果 `varname1` 等于 13\
    \ 且 `varname2` 等于 10，程序代码将退出第一个和第二个循环——\n\n```bash\n#!/bin/sh\nfor varname1 in\
    \ 123 4 5 6 7\ndo\n    for varname2 in 09\n    do\n        if[ $varname1 -eq 13]\
    \ -a [ $varname2 -eq 10]\n        then\n            break 13\n        else\n \
    \           echo \"$varname1 $varname2\"\n        fi\n    done\ndone\n```\n\n\
    ### Bash Continue 语句\n\nBash 循环控制 `continue` 语句与 `break` 语句相同。`continue` 语句用于退出\
    \ `for`、`until`、`while` 和 `select` 循环的当前迭代，而 `break` 语句用于退出整个循环。当在 `for` 循环中使用\
    \ `continue` 时，变量将获得下一个元素的值。当循环发生错误但用户仍需执行下次代码迭代时，可以使用 bash `continue` 语句。\n\n\
    Continue 语句语法：\n```bash\ncontinue\n```\n上面的 `continue` 命令只是跳转到同一循环内的当前迭代并执行下一次迭代。我们向\
    \ `continue` 语句传递整数参数，以便像 `break` 语句一样允许嵌套循环中的命令跳转到下一次迭代。`continue N`\n上面的 `continue`\
    \ 命令显示了 `N`，它代表要继续执行的第 N 个外层循环。`continue N` 会退出当前循环层级的所有剩余迭代，并从上方 N 层的循环继续。\n\n\
    示例：下面的示例显示 `continue` 语句会退出 `if…then` 语句并开始处理下一个 `echo` 语句：\n\n```bash\n#!/bin/sh\n\
    NUMBERS=\"8 9 10 11 12 13 14\"\nfor NUMBERS in $NUMBERS\ndo\n    Z=`expr $NUMBER\
    \ % 2`\n    if[ $Z-eq 0]\n    then\n        echo \"Our result is an even number!!\"\
    \n        continue\n    fi\n    echo \"Our result is an odd number\"\ndone\n```\n\
    \n## Bash 变量替换\n\n| 序号 | 转义与描述 |\n| :--- | :--- |\n| 1 | `\\\\` 反斜杠转义序列 |\n| 2\
    \ | `\\a` 警报 (BEL) 转义序列 |\n| 3 | `\\b` 退格转义序列 |\n| 4 | `\\c` 这是抑制末尾换行的转义序列 |\n\
    | 5 | `\\f` 这是分页符转义序列 |\n| 6 | `\\n` 这是换行转义序列 |\n| 7 | `\\r` 这是回车符转义序列 |\n| 8\
    \ | `\\t` 这是水平制表符转义序列 |\n| 9 | `\\v` 这是垂直制表符转义序列 |\n\n"
