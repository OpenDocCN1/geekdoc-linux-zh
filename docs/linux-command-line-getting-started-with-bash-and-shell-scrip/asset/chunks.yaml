    # Exit Status for Which Command


    The `which` command returns the values below called an exit status, depending
    on what happened:


    | Exit Status | Description |

    | :--- | :--- |

    | 0 | Status 0 means that all filename s in the search pattern were found, and
    all were executable. |

    | 1 | Status 1 means that one or more filename s were not located, or were not
    executable. |

    | 2 | Exit status 2 means that an invalid option was specified in the `which`
    command |


    ## Which Example


    ```bash

    [ppeters@rad-srv ~]$ which bash

    ```

    The command above searches the pathname of the file which would be run if the
    `bash` command were executed. The result of the command above is:

    ```bash

    [ppeters@rad-srv ~]$ /bin/bash

    ```


    # Searching with whatis command


    ### The whatis command

    The `whatis` command in Linux displays the search results as one-line manual page
    descriptions. Following is its syntax:


    `whatis [-dlv?V] [-r|-w] [-s list] [-m system[,...]] [-M path] [-L locale] [-C
    file] command_name`


    The basic usage of the `whatis` command is simple. The user passes the tool name
    as input, and `whatis` will search and display a one-line description of the command
    utility. Here''s an example:


    ```bash

    [ppeters@rad-srv ~]$ whatis ls

    ```

    The following output was produced by the aforementioned command:

    ```bash

    [ppeters@rad-srv ~]$ ls (1)  - list directory contents

    ```


    # Searching with the Whereis Command


    The Linux `whereis` command is used to find a command''s binary, source, and manual
    page files. This command searches for files in a limited number of places (binary
    file directories, man page directories, and directories of libraries).


    Usually, it is used to locate a program''s executables, its man pages, and settings
    files. The command''s syntax is straightforward: just type `whereis`, followed
    by the command or program name you''d like to learn more about.


    When working on the `bash` command line, we desire to know the path to a specific
    binary file or a command quickly. Yes, in this case the `find` command is an alternative,
    but it takes a lot of time and will probably also generate some unwanted outcomes.
    For this purpose, there is a particular command intended: `whereis`.


    `whereis` command is used to locate the source / binary command file and manual
    sections for the specified Linux system file. Making comparisons between the `whereis`
    command and the `find` command we find some similarities as both tools are used
    for the same jobs. The only major difference between the two is that the `whereis`
    command gives a more accurate result in a short space of time.


    First, the names supplied are removed from the path or directory elements and
    any prefixed extensions of the `.ext` form, for instance, `.c` prefixes of `s.`
    resulting from source control are also removed. The `whereis` command then tries
    to locate the command we are searching for in the standard Linux directory list.


    ### Points to note about whereis command:

    - The `bash` `whereis` program utilizes `chdir` version two utility to ensure
    quick results; we should make sure that the pathnames are full and well-formed.
    The given pathnames must begin with a forward slash `/` and should be a valid
    path in the system directory tree; otherwise, it will exit without any valid result.

    - There is a fixed non-dynamic coded path for the `whereis` command, which means
    you may sometimes not find what you''re looking for.


    ## Whereis Syntax


    ```bash

    [ppeters@rad-srv ~]$ whereis [options] filename

    ```


    ### Example whereis command

    When we want to find the location of `apropos` command, we execute the following
    command in the terminal:

    ```bash

    [ppeters@rad-srv ~]$ whereis apropos

    apropos:/usr/bin/apropos /usr/share/man/man1/apropos.1.gz

    ```


    ### Options


    | Symbol | Description |

    | :--- | :--- |

    | `-b` | Find only for program binaries. |

    | `-m` | Find only for manual pages sections. |

    | `-s` | Find only for command sources. |

    | `-u` | This option helps in searching for all unusual entries. Linux files are
    said to be unusual if they do not have one entry of each requested type. As example,
    `whereis -m -u *` is searching for files in the current working directory which
    do have documentation. |

    | `-B` | This option alters or otherwise puts a limit to the paths where `whereis`
    looks for binaries. |

    | `-M` | This option alters or otherwise puts a limit to the locations where the
    command `whereis` searches for manual pages sections. |

    | `-S` | This option changes or otherwise puts a limit to the places where `whereis`
    searches for command sources. |

    | `-f` | This option terminates the past folder listing and informs of the beginning
    of file names, and this must be utilized only when any of the `-B`, `-M`, or `-S`
    options are in use. |


    # Searching with Apropos Command


    Linux operating comes with an enormous number of commands, so sometimes remembering
    each and every command is quite hard. In such instances, the `apropos` command
    becomes helpful. The `apropos` command helps the user who does not remember the
    precise command but recalls some keywords associated with the command that defines
    its uses or features. Using the keywords given by the user, the `apropos` command
    locates the command and its features, through searching the Linux man page.


    ### Apropos Syntax


    ```bash

    [ppeters@rad-srv ~]$ apropos [OPTIONS] keyword

    ```


    ### Example apropos command

    Let’s assume that you would like to archive or compress a file but you don’t know
    the command to use to archive a file then you could type the `apropos` command
    in the terminal and it will display all the related commands and a short description
    of their functionality. After running the `apropos archive` command below you
    will find a number of commands that have something to do with archiving.

    ```bash

    [ppeters@rad-srv ~]$ apropos archive

    apt-secure (8)

    ```

