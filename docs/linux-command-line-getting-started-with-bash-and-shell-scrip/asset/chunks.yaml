    has the SUID bit set – SUID stands for set User ID; if bit is set, then our condition
    returns true. | [ -u $filename ] is not true. |


    | -r filename | This readable operator is used to findout ifthe file called filename
    is readable; if it readable, then our condition returns true. | [ -r $filename
    ] is not false. |


    | -w filename | This writable operator is used to findout ifthe file named filename
    is writable; if it is writable, then our condition returns true. | [ -w $filename
    ] is not false. |


    | -x filename | This executable operator is used to findout ifthe file named filename
    is an executable file; if it is, then our condition returns true. | [ -x $filename
    ] is not false. |


    | -s filename | This operator finds out iffilename has size greater than 0; if
    yes, then condition becomes true. | [ -s $filename ] is not false. |


    | -e filename | This operator finds out iffilename exists; is true even if file
    is a directory but exists. | [ -e $filename ] is not false. |'
