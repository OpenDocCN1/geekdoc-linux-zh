    ## 命令行处理


    有时从命令行执行脚本时，我们需要提供输入值。在 bash 中，这种赋值可以通过两个方面完成。一种是使用参数变量，另一种是使用函数 `getopts`。此部分展示了如何使用参数变量从终端输入命令行信息。创建一个带有相应脚本的
    bash 脚本文件，以查看从命令行读取的参数值。该脚本将读取三个命令行参数 `$operand1`、`$operand2` 和 `$operator`，它们将存储在变量中。数字和第二个参数值必须是四个算术运算符之一（`+`、`-`、`/`、`x`）才能正确运行脚本。如果检查
    `$operator` 值并执行基于运算符的操作并打印值。


    ### command.sh

    ```bash

    #!/bin/bash

    #显示参数变量列表

    echo "Your argument values are: $1 $2 $3"

    #将参数值存储在操作数中

    operand01=$1

    operand02=$3

    operator=$2

    #检查第二个命令行参数的值以执行算运算

    if [[ $operator == ''+'' ]]

    then

    ((result=$operand01+$operand02))

    elif [[ $operator == ''-'' ]]

    then

    ((result=$operand01-$operand02))

    elif [[ $operator == ''x'' ]]

    then

    ((result=$operand01*$operand02))

    elif [[ $operator == ''/'' ]]

    then

    ((result=$operand01/$operand02))

    fi

    #打印结果

    echo -e "Your operation result is = $result"

    ```


    上面的 `commandlinescript.sh` 脚本使用四种不同的算术运算符运行四次。对于参数值 `12 + 6`、`12 – 6`、`12 x 6`
    和 `12 / 6` 将出现以下输出。下面的结果输出显示了所有的输入和结果。


    ```bash

