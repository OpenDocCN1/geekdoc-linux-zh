    tar manual pages by typing the command below.


    ```bash

    [ppeters@rad-srv ~]$ man tar

    ```


    # Archiving Files Using ZIP


    `ZIP` is a Linux file packaging and compression tool. Each file is stored with
    the `.zip` extension in a single `.zip-filename` file. `Zip` compresses files
    to shrink the size of the file and is also used as a file packaging tool. In many
    operating systems such as UNIX, Linux, and Windows `zip` is present.


    If you have a restricted bandwidth between two Linux computers and want to transfer
    the files more quickly, use `zip` to compress the files and transfer them afterward.
    The `zip` program places one or more compressed documents in a single zip archive
    along with file data (name, route, date, last modification time, security, and
    file integrity check data). You can pack a complete directory structure.


    In the section above, we learned how to archive files and folders using the `tar`
    archiving command. In the coming section, we are going to have a deep dive into
    the use of `Zip` and `Unzip` programs to archive and compress files and directories.
    The `zip` command is an archiver, and compression tool rolled into, so we can
    use it for three functions namely file archiving, compression and decompression.
    However, for compression, we have `gzip` and `bzip2` tools which are the dominant
    programs.


    ## Zip File and Directory Archiving Utility


    Most Linux distributions come packaged with the `zip` utility. Just in case if
    it is not available, you can install it using the distribution''s default package
    manager. Below we have different installations of `zip` and `unzip` on the various
    linux distributions.


    ### On the RHEL, CentOS and Fedora variants:

    ```bash

    [ppeters@rad-srv ~]$ sudo yum install zip unzip

    ```


    ### On Debian and Ubuntu distributions:

    ```bash

    [ppeters@rad-srv ~]$ sudo apt-get install zip unzip

    ```


    ### On distributions SUSE and openSUSE:

    ```bash

    [ppeters@rad-srv ~]$ sudo zypper install zip unzip

    ```


    ## Creating A New Archive


    To create zip archive with a group of files into one, the command used is below:


    ```bash

    [ppeters@rad-srv ~]$ zip files.zip file_01 file_02 file_03

    ```


    Below is the sample output displayed on the bash terminal:

    ```text

    adding: file_01 (stored 0%)

    adding: file_02 (stored 0%)

    adding: file_03 (stored 0%)

    ```


    The above statement creates a zipped file archive called `files.zip` from `file_01`,
    `file_02` and `file_03`. Users do not have to append the `.zip` extension to the
    file name. It is added for clarity only there.


    To create a zip archive of a folder, execute the following:


    ```bash

    [ppeters@rad-srv ~]$ zip zip_dir.zip files_dir/

    adding: files_dir/ (stored 0%)

    [ppeters@rad-srv ~]$

    ```


    The example above created a zip archive named `zip_dir.zip` of the `files_dir`
    folder. This statement only adds the parent directory to the zip archive. There
    are cases where you may need to archive all sub-folders recursively; we use `-r`
    flag as illustrated below.


    ```bash

    [ppeters@rad-srv ~]$ zip -r zip_dir.zip files_dir/

    adding: files_dir/ (stored 0%)

    adding: files_dir/text_file.txt (deflated 67%)

    adding: files_dir/audio_file.mp3 (deflated 6%)

    adding: files_dir/image_file.png (deflated 3%)

    [ppeters@rad-srv ~]$

    [ppeters@rad-srv ~]$ zip -r zip_dir.zip files_dir/ file_01 file_02 file_03

    adding: example/ (stored 0%)

    adding: example/Image.png (deflated 3%)

    adding: file1 (stored 0%)

    adding: file2 (stored 0%)

    adding: file3 (stored 0%)

    [ppeters@rad-srv ~]$

    ```


    Unlike the `tar` archiving utility, the `zip` archiving and compression tool builds
    a zip archive and compresses it when necessary. `Tar` utility only archives, and
    it does not compress.


    ### Creating an archive with many directories and files


    At times it is necessary to create an archive with more than one file and directories.
    We use the `-r` switch with the `zip` command to recursively create the zip archive
    containing all the specified folders and files:


    ```bash

    [ppeters@rad-srv ~]$ zip zip_dir.zip file4

    adding: file4 (stored 0%)

    [ppeters@rad-srv ~]$

    ```


    The illustration above has an existing archive and we are adding another file
    to the specified `zip_dir.zip` archive. Looking at the `zip` program example above;
    the statement only updated the contents of existing archive file without making
    any replacements. Whenever a user specifies an existing file or folder archive,
    that existing archive gets updated and not replaced. This action only preserves
    the existing archive. This capability to allow files to be added to a pre-existing
    archive is an advantage of the `zip` program over the `tar` archiving utility.


    ## Extract Zip archive files


    Extracting archives is as simple as creating archives. To extract an archive,
    you need to type `unzip` command and specifying the archive file you would like
    to extract:


    ```bash

    [ppeters@rad-srv ~]$ unzip zip_dir.zip

    ```


    Below is an example output result of the `unzip` command:

    ```text

    Archive: zip_dir.zip

    creating: files_dir/

    inflating: files_dir/text_file.txt

    inflating: files_dir/audio_file.mp3

    inflating: files_dir/image_file.png

    extracting: file_01

    extracting: file_02

    extracting: file_03

    extracting: file_04

    ```


    With the `unzip` utility a user can extract a specific file or folder selectively
    from the zipped archive. The following statement below extracts `file_03` from
    the archive `zip_dir.zip`.


    ```bash

    [ppeters@rad-srv ~]$ unzip zip_dir.zip file_03

    Archive: zip_dir.zip

    extracting: file_03

    ```


    ### Listing Zip Archive Contents


    The `Unzip` program or utility allows users to display a listing of the contents
    of a zip archive without file extraction, use of the `-l` flag.


    ```bash

    [ppeters@rad-srv ~]$ unzip -l zip_dir.zip

    Archive: zip_dir.zip

    Length Date Time Name

    ---------- ----- -----

    0 2019-09-11 15:15 files_dir/

    286 2019-09-11 15:16 files_dir/text_file.txt

    807303 2019-09-11 14:03 files_dir/audio.mp3

    6799 2019-09-11 14:45 files_dir/image.jpg

    10 2019-09-11 15:58 file_01

    10 2019-09-11 15:58 file_02

    10 2019-03-11 15:58 file_03

    10 2019-03-11 16:37 file_04

    ------- 6050289 8 files

    [ppeters@rad-srv ~]$

    ```


    Listing the contents of a zip archive is very useful when you want to determine
    the file(s) or folder(s) you would like to extract instead of just extracting
    the whole archive. There are instances where users need to determine which files
    they would like to extract from an archive. It is at these instances it is necessary
    to view or list the contents of a zip archive.


    ## Creating an Encrypted archive


    The finest feature of the `zip` utility is that it allows users to create an encrypted
    or password-protected archive. With this encrypted or password-protected archive,
    users are required to enter their password for them to be able to extract or view
    the contents of the archive. Encrypting an archive, is achieved through the use
    of the `-e` flag.


    ```bash

    [ppeters@rad-srv ~]$ zip -e -r zip_dir.zip files_dir/ file_01 file_02 file_03
    file_04

    Enter password:

    password:

    adding: files_dir/ (stored 0%)

    adding: files_dir/text_file.txt (deflated 67%)

    adding: files_dir/audio_file.mp3 (deflated 6%)

    adding: files_dir/image_file.png (deflated 3%)

    adding: file1 (stored 0%)

    adding: file2 (stored 0%)

    adding: file3 (stored 0%)

    adding: file4 (stored 0%)

    [ppeters@rad-srv ~]$

    ```


    When an archive is created with encryption you need to enter your password when
    extracting or viewing the contents of the archive.


    ```bash

    [ppeters@rad-srv ~]$ unzip zip_dir.zip

    Archive: zip_dir.zip

    files_dir/text_file.txt password

    ```


    ## Creating a Multi-Part Zip Archive


    There are times when you need to share a zipped archive over the internet. Most
    archives may be too big, and the solution is to create multi-part archive made
    up of sequential small-sized archives. These multi-part archives can be sent sequentially
    as small archives. We can create a multi-part archive split into many smaller
    parts, for example, 3 MB each, as follows:


    ```bash

    [ppeters@rad-srv ~]$ zip -r -s 5m archive.zip files_dir/

    ```


    The `zip` command above will create many zip archive files of size 5MB like `archivemp.z01`,
    `archivemp.z02`, `archivemp.z03`, and `archivemp.zip`. All these split files need
    to be sent to the recipient. When deflating and extracting these archive files,
    all the small parts that make up the contents will be extracted into a single
    folder called `files_dir`.


    ```bash

    [ppeters@rad-srv ~]$ zip -r -s 2g archive.zip files_dir/

    ```


    ### Create Archives of Other Programs


    `Zip` command-line utility accepts standard input; this makes it feasible to create
    archives of other command results. The following example shows that we can pipe
    the output from `ls -l` command into the `zip` utility as input to `zip`.


    ```bash

    [ppeters@rad-srv ~]$ls -l Documents/|zip ls_documents.zip

    adding: - (deflated 56%)

    ```


    The `ls_documents.zip` is the archive of `ls` command. The command won''t output
    the contents of the zip archive using `-l` switch. Instead, you could view its
    contents using the command:


    ```bash

    [ppeters@rad-srv ~]$ unzip -p ls-documents.zip | less

    ```


    The example shows that `-p` switch refers to the pipe.


    ### Compressing archives by stating the compression rate


    The statement below shows how to archive a directory and its contents with the
    highest compression level `[9]`:


    ```bash

    [ppeters@rad-srv ~]$ zip -r -9 archive.zip files_dir/

    ```


    The `Zip` command-line utility has support for three compression levels, as shown
    below:

    - `1` – Fastest compression speed but Worst

    - `9` – Slowest compression speed but results in the Best or highest compression

    - `6` – Is the Default level of compression


    ### Exclude files or folders while creating archives


    When creating zip archives, we can choose to exclude all unwanted files or sub-folders.
    We use `-x` flag, as shown below:


    ```bash

    [ppeters@rad-srv ~]$ zip -r zip_dir.zip files_dir/ -x files_dir/image_file.png

    ```


    The `zip` utility command above creates an archive of the `files_dir` directory,
    excluding `image_file.png` file from the archive. With `unzip` utility a user
    can verify the contents of the zip archive without needing to extract the archive.


    ```bash

    [ppeters@rad-srv ~]$ unzip -l zip_dir.zip

    ```


    ## Delete Files from an Existing Archive


    With the `zip` utility, you are able to delete files inside an archive even after
    the archive was created. We use the `-d` flag with the `zip` command to delete
    the unwanted files as illustrated below.


    ```bash

    [ppeters@rad-srv ~]$zip -d zip_dir.zip "files_dir/text_file.txt"

    deleting: files_dir/text_file.txt

    ```


    Similarly, to delete a group of the same type of files, for example, `.txt` files
    use:


    ```bash

    [ppeters@rad-srv ~]$ zip -d zip_dir.zip "files_dir/*.txt"

    ```


    To find out more about `zip` and `unzip` we use the Linux manual pages to learn
    more.


    ```bash

    [ppeters@rad-srv ~]$ man zip

    [ppeters@rad-srv ~]$ man unzip

    ```


    # Chapter Four: Writing Bash Scripts


    Bash Shell scripts are just a collection of instructions you write and run together
    in a file. You''re just putting and running a sequence of instructions in a text
    file. Writing Your First Shell Script The first bash scripting project is the
    Hello World example. Open your favorite editor and write a shell script file named
    as `firstscript.sh` containing following lines. Type in your terminal:

    i. `Vi firstscript.sh`

    ii. Press letter "I" on your keyboard to enter into insert mode

    iii. Type the following in the `firstscript.sh`

    ```bash

    #!/bin/bash

    echo "Hello World"

    ```

