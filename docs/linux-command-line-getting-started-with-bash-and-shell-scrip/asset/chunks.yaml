    The common command-line interface language for Linux is the `Bash` shell script.
    Systems administrators may need to execute many routine commands daily for a variety
    of purposes. These daily routine tasks may be converted to `bash` scripts for
    automation. Any Linux user can learn `bash` scripting language so fast and with
    great ease.


    `bash` scripting makes use of comments alongside the code just like in any other
    programming language. These scripting comments are not processed with the rest
    of the `bash` script at the execution time. Well commented `bash` scripts are
    important to enable users to understand the script and its logic. There are many
    ways to add comments in `bash` script. The example script below shows how one
    can add single-line or multiple-line `bash` comments. Below is a `bash` file with
    `bash` script showing how to use `bash` comments. The `#` symbol is used to add
    single-line comments while a single quote (`‘`) with full colon `:''` is used
    to add multi-lines comments.


    ```bash

    comments_script.sh

    #!/bin/bash


    #Input a number

    echo "Please enter a number"

    read x


    : ''

    Check if the entered number is

    less than 12 or greater than 12 or equal to 12

    ''


    if [[ $x -lt 12 ]]

    then

    echo "The number you entered is less than 12"

    elif [[ $x -gt 12 ]]

    then

    echo "The number you entered is greater than 12"

    else

    echo "The number you entered is equal to 12"

    fi

    ```


    ### Sample output of executing the above script:

    The example below shows that the script is executed three times with input values
    10, 12, 15, and 23\. The following output will appear.


    ```

    root@BAKYRIE:~# bash comments_script.sh

    Please enter a number:10

    The number you entered is less than 12

    root@BAKYRIE:~# ./comments_script.sh

    Please enter a number:15

    The number you entered is greater than 12

    root@BAKYRIE:~# ./comments_script.sh

    Please enter a number:12

    The number you entered is equal to 12

    root@BAKYRIE:~# ./comments_script.sh

    Please enter a number:23

    The number you entered is greater than 12

    root@BAKYRIE:~#

    ```


    ### The `echo` command

    The `echo` program or command is used in a `bash` script to display scripting
    output to the terminal console. We can use numerous options with the `echo` command
    in `bash` to display the output in many ways. Below we are illustrating the `echo`
    command by creating a `bash` file with the following script to demonstrate the
    two simple uses of the `echo` command. From the example below, the first `echo`
    statement will display to the terminal screen a text data with a new line carriage
    return and the second command prints a simple text with no newline carriage return.


    ```bash

    echo_commands.sh

    #!/bin/bash


    #Display the first text string

    echo "Print text with a carriage return new line"


    #Display the second text string

    echo -n "Print text without the carriage return new line"

    ```


    ### Output result:

    Execute the bash script.

    ```

    root@BAKYRIE:~# chmod u+x echo_commands.sh

    root@BAKYRIE:~# ./echo_commands.sh

    Print text with a carriage retun new line

    Print the text without the carriage return liner

    root@BAKYRIE:~#

    ```


    ### Variables

    Any programming language requires variable declaration. Variables of `Bash` can
    be declared in various ways. If a value is allocated in a variable then at the
    start of the variable no symbol is used. The symbol `$` is used with the name
    of the variable when reading the variable value. Variable can be used on the shell
    terminal or may be used in a `bash` script.


    The commands below are declaring a variable of type string called `myvariable`
    with a specified value, and then we print the value of the variable in the terminal.


    ```bash

