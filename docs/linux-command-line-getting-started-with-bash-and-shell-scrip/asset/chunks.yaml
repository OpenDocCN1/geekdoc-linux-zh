  trans: "\n\n```bash\nif [[ $x -le 100 ]]\nthen\n    exit 0\nelse\n    exit 1\nfi\n\
    ```\n\n`fisecondscript.sh`\n```bash\n#!/bin/bash\n#运行 bash 文件，firstscript.sh\n\
    bash \"first.sh\"\n\n#检查返回码是否等于 1\nif [ $? -eq 1 ]\nthen\n    echo \"The number\
    \ you entered is greater than 100\"\nelse\n    echo \"The number you entered is\
    \ less than or equal to 100\"\nfi\n```\n\n### 输出：运行脚本。\n`bash secondscript.sh`\n\
    \n当执行脚本并依次传递值 56 和 110 时，将出现以下输出。\n\n```bash\n[root@bakyrie:~]# vim firstscript.sh\n\
    [root@bakyrie:~]# chmod u+x firstscript.sh\n[root@bakyrie:~]# vim secondscript.sh\n\
    [root@bakyrie:~]# chmod u+x secondscript.sh\n[root@bakyrie:~]# ./secondscript.sh\n\
    Please enter a number\n56\nThe number you entered is less than or equal to 100\n\
    [root@bakyrie:~]#\nroot@bakyrie:~# ./secondscript.sh\nPlease enter a number\n\
    110\nThe number you entered is greater than 100\nroot@bakyrie:~#\n```\n\n### Bash\
    \ 读写文件\nBash 脚本能够从文件读取并写入文件是一项基本要求。与所有其他主流编程语言一样，Bash 没有内置用于读写文件的函数。Bash 中有几种方法可以读取文件。在\
    \ bash 中读取或写入文件最流行的方法之一是使用 bash `cat` 命令，也称为连接命令（concatenate）。`cat` 命令主要用于读取文件的全部内容。我们可以使用循环和\
    \ `read` 命令逐行读取 bash 文件。使用重定向操作符 `>`（大于号）向数据写入 bash 文件至关重要。我们还可以使用双大于符号 `>>` 来向任何\
    \ bash 文件追加更多内容。\n\n### 在 bash 中读取文件\n我们将使用以下 bash 脚本创建一个 bash 文件，以读取一个名为 `hardwarefile.txt`\
    \ 的现有文件。该硬件文件的内容所示。在 bash 脚本中，文件的全部内容首先通过 `cat` 命令读取；接下来使用 `while` 循环逐行读取 bash\
    \ 文件。\n\n**hardwarefile.txt**\n```\nDvdRom\nRAM\nMonitor\nKeyboard\nMouse\nScanner\n\
    Printer\n```\n\n`readfilescript.sh`\n```bash\n#!/bin/bash\necho \"Reading the\
    \ hardwarefile.txt file using cat command\"\n# 使用 `cat` 命令读取文件内容\ncontent=`cat\
    \ hardwarefile.txt`\necho $content\n\necho \"Reading the file line line using\
    \ loop\"\n# 分配文件名\nfilename='hardwarefile.txt'\n# 文件的每一行将通过循环的每次迭代读取\nwhile read\
    \ line;\ndo\n    # 打印行\n    echo $line\ndone<$filename\n```\n\n### 输出：运行以下命令。\n\
    ```bash\n$ cat hardwarefile.txt\n$ bash readfilescript.sh\n```\n根据上面的演示，第一个命令将在不运行任何\
    \ bash 脚本的情况下显示文件 `hardwarefile.txt` 的内容，第二个命令将运行 `readfilescript.sh` 脚本，并使用 `cat`\
    \ 命令和配合 `while` 循环的 `read` 命令打印两次文件内容。\n\n```bash\nroot@bakyrie:/home/ppeterszw#\
    \ cd\nroot@bakyrie:~# vim hardwarefile.txt\nroot@bakyrie:~# vim readfilescript.sh\n\
    root@bakyrie:~# cat hardwarefile.txt\nDvdRom\nRAM\nMonitor\nKeyboard\nMouse\n\
    Scanner\nPrinter\nroot@bakyrie:~# chmod u+x readfilescript.sh\nroot@bakyrie:~#\
    \ ./readfilescript.sh\nReading the hardwarefile.txt file using cat command\nDvdRom\
    \ RAM Monitor Keyboard Mouse Scanner Printer\nReading the file line by line using\
    \ loop\nDvdRom\nRAM\nMonitor\nKeyboard\nMouse\nScanner\nPrinter\nroot@bakyrie:~#\n\
    ```\n\n### 在 Bash 中写入文件\n在 bash 文件中创建的 bash 脚本用于向新的空文件写入新内容，如果文件已有内容，则追加数据。\n\n\
    `writefilescript.sh`\n```bash\n#!/bin/bash\necho \"Please enter any text\"\n#\
    \ 读取数据\nread string1\n# 第一次将输入写入文件\necho $string1 > testfile.txt\n\necho \"Please\
    \ enter some text\"\n# 读取另一个字符串\nread string2\n# 在文件末尾追加数据\necho $string2 >> testfile.txt\n\
    \n# 显示文件的完整内容\ncat testfile.txt\n```\n运行脚本后将显示以下输出。\n```bash\nroot@bakyrie:~#\
    \ vim writescript.sh\nroot@bakyrie:~# chmod u+x writescript.sh\nroot@bakyrie:~#\
    \ ./writescript.sh\nPlease enter any text\nPlease enter some text\n```\n\n###\
    \ Bash 中的管道\n管道（pipe）是一种在不使用临时文件的情况下将一个命令的输出连接到另一个命令的输入的方法。语法为 `command1 | command2`。管道符号\
    \ `|` 用于链接命令。第一个命令的输出将作为第二个命令的输入。\n\n- 管道符号 `|` 用于链接命令。\n- 第一个命令的输出作为第二个命令的输入。\n\
    - 管道符号 `|` 用于过滤输出。\n\n上面的示例显示 `student_marks.txt` 具有以下输出。\n\n**student_marks.txt**\n\
    ```\nDaina 109\nDavid 104\nSarah 101\nSusan 104\n```\n\n"
