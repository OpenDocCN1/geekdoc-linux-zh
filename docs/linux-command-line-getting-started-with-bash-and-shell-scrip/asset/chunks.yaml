    # Search Tools in-Depth


    ## Searching Using Find Command


    One of the most eminent and regularly used search command-line tools is the `Find
    Command`. The Linux `find` command is a search and locate utility that displays
    the path of files and directories based on specified search strings matching given
    parameters. There are a number of conditions used to search for files in bash
    namely; find by name, find by permissions, user, group, file-type, modification
    and creation date and size of the file. This book will give illustrations of the
    most common use cases of the `find` command.


    The bash `find` command is a command-line tool for traversing a file hierarchy.
    This command is used to locate files and directories in the file system and perform
    subsequent operations on the discovered files. `Find` command supports searching
    by name, directory, file, owner, modification and creation dates, and file permissions.
    By using the `-exec` option with the `find` command, other Linux bash commands
    can be subsequently executed on files or folders found.


    ### Find Command Syntax


    ```

    [ppeters@rad-srv ~]$find [search_path] [expression] [-options] [search_item]

    ```


    ### Find Files using Name or Extension


    Within the Linux filesystem, we can search for a file using the file''s name or
    extension. The illustration below searches for `*.star` files in the `/home/ppeters/`
    folder and all sub-folders:


    ```

    [ppeters@rad-srv ~]$find /home/ppeters/ -name "*.star"

    ```


    ## Common Linux Find Commands and Syntax


    Bash find statements have the following syntax:


    ```

    [ ppeters@rad-srv ~]$find options find_path statement

    ```


    - The `options` switch takes control of the actions and the `find` process''s
    optimization technique.

    - The `find_path` feature defines where `find` begins its search, especially at
    the Linux root directory for the search string.

    - `Statement` from the syntax above takes control of all the tests that filter
    through the Linux directory tree to give an output.


    Take a look at the illustration below:


    ```

    [ppeters@rad-srv ~]$find –O2 -L /var/www/html -name "*.php"

    ```


    This find command statement enables optimization at the maximum level (`-O2`)
    and lets the `find` command to follow soft links (`-L`) which are also called
    symbolic links. The `find` command traverses the whole `/var/www/html` directory
    tree for files that end with `.php`.


    ### Find Command Examples


    | Statement | What it does |

    | :--- | :--- |

    | `find / -name 1st_file.conf` | Searches for a file called `1st_file.conf` in
    root directory and and its sub-folders. |

    | `find / -name *.png` | Search for all `.png` image or picture files inside the
    `/` directory and its sub-folders. |

    | `find /etc -type f –empty` | Search for an blank file inside the `/etc` directory.
    |

    | `find / -user ppeters -mtime 3 -iname ".db"` | Search for all `.db` records
    that were altered in the past 3 days by `ppeters` who is a user. |


    ## Find Options and Optimization


    The `find` command'' basic configuration ignores soft links popularly known symbolic
    links. Using the `find` command option''s `-L` switch allows the result to be
    a symbolic link. ByBy its filtering technique, the `find` command improves its
    efficiency. `Find` command-line utility has three performance stages, namely:
    `-O1` the first stage, `-O2` or the second stage, and the third stage, which is
    `-O3`. The first optimization, by default, is `-O1`. This optimization forces
    the `find` command to search for outcomes-based firstly on the name of the file
    before all previous tests are executed. The level of optimization called `-O2`
    gives priority to searches for the file name, just like in level-O1`. `-O2` performs
    all searches of the file type prior to processing additional resource-hungry tasks.
    Optimization Level `-O3` allows the most serious optimization to be found and
    reordering all trials based on their relative cost and the probability of success.


    ### Find Optimization


    | Level | Detail |

    | :--- | :--- |

    | First level `-O1` | First optimization level, it is the default where the filtering
    is initially based on the name of the file. |

    | Second Level `-O2` | This is the second level optimization for `find` command
    which also starts the initial searches with name of the file, before moving on
    to the type of file. |

    | Third Level `-O3` | This is the third level of `find` command optimization which
    allows automatic re-arrangement of the searches basing on the efficient use of
    resources and the inherent probability of success |

    | `-maxdepth X` | This switch performs a search of the user’s current working
    directory and its sub-directories `X` levels deep. |

    | `-iname` | This switch represents a filter that disregards sentence cases |

    | `-not` | Using the `find` command with this `-not` switch option ensures that
    the output results that do not match the test case are displayed. |

    | `-type f` | This option is used to do a search for all files only. |

    | `-type d` | This switch is used to search for all directories only. |

