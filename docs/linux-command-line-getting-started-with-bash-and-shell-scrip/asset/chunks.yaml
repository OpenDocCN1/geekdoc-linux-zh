    Variable is not set

    1 –The Value of variable var_sub is

    This var_sub Variable is unset

    2 –The Value of the variable var_sub is This var_sub Variable is unset

    3 –The Value of variable var_sub isThis is the default variable value

    4 –The Value of the variable var_sub is The Prefix

    The Prefix

    5 –The Value of the variable var_sub is The Prefix


    # Understanding Shell Building Blocks


    ## Introduction to Bash Shell syntax


    When a user enters their input using the keyboard, the bash shell reads the input
    string and splits it down into words and operators, using the quoting rules to
    define each character of input.


    When the shell finishes reading the string and breaking it down into words and
    operators, bash shell then transforms the broken down words and operators into
    commands and other bash constructs, which display an exit status used for processing.
    The bash shell works through the input string as detailed below:


    * Initially, the bash shell reads the input from the user custom created file
    called a bash script or the shell reads an input stream from the users'' keyboard
    input.

    * The shell breaks up the input stream into words and operators, using the quoting
    rules. The words and operators are split up using wild card operators `.`. We
    then have Alias expansion done.

    * Simple and compound bash commands are created from the split up tokens after
    the shell analysis of the words and operators.

    * The expanded tokens are split up into a list of filenames, commands, options,
    and arguments through a number of shell expansions.

    * We then have input/output redirection. We then have redirection operands and
    their operators taken off the parameter list.

    * The shell then executes the bash commands.

    * The shell may wait for the completion of command executions before it collects
    its exit status.


    ## Understanding Shell Commands


    Bash shell commands such as `mkdir dir1 dir2` are made up of the shell command,
    and arguments, separated by spaces. In the `mkdir` example, there the command
    is `mkdir`, and the arguments are `dir1` and `dir2`, respectively.


    It is easy for users to create complex shell commands by simply adding together
    elementary commands organized in a number of ways including using a pipeline where
    the output of one basic command is directed to be the input of a second command,
    using conditional statements and loops. For example `ls | less`.


    ## Working with Bash Shell Functions


    Bash shell functions are a number of commands grouped together processing and
    can be called a number of times. Shell functions are executed in a similar way
    to elementary commands. Functions help in making bash scripts more readable. Functions
    are executed by calling their name. When the function name of a shell is called
    as a basic command, the listing of commands in the set is processed.


    ## A look at Shell Variables


    The Bash shell variable or parameter is an entity that stores string, integer,
    and array values and is referenced by either a name or a number. All parameters
    that are referenced by name are called variables. We have three types of these
    parameters, namely positional, special parameters, and variables. In bash scripting,
    we use `declare` to create a variable.


    ## Shell Variable Expansions


    Variable or parameter expansion is the process to get the value from referenced
    entity, example, expanding a variable to display its value. Expansion is the ability
    to access and manipulate stored values of variables. Elementary expansion is done
    by prefixing the variable name with `$`. The shell expansion is performed after
    the command strings split into word and operator.


    # Chapter Two: Shell Input and Output


    In this chapter, I will be discussing Shell input/output redirections in detail.
    commands receive their input from the terminal in Linux systems and return the
    resulting output to your terminal. Usually, a command reads its input from the
    standard input, which is your default. Similarly, a command types its output to
    normal output, which is your default.


    ## What is Bash Redirection?


    Redirection is the process of capturing output from a script, command, and regular
    file. Redirection is performed through the use of some shell symbols: angle brackets
    `<`, `>`, or to capture output to a program we use the pipe symbol `|`.


    Whenever bash shell commands are processed, there is always input or output redirection
    through reading and interpretation of special notations. Redirections enable the
    file descriptors to open and close. Through redirections, file descriptors refer
    to various files from which we read the commands. Input and output redirections
    process from left to right in the order they appear. Whenever you see the redirection
    statement with less than operator `<` and no file descriptor know that we are
    referring the standard input (file `0`). Whenever we use greater than sign `>`
    and file handler number is omitted, then we are referring standard output (file
    `1`). Users have to note that order is very important in redirection.


    ### Redirection Standard Output


    Bash command-line interface, also known as the terminal has the standard output.
    The term standard out abbreviated `STDOUT` is the regular console on the command
    line where results of command executions display. Linux bash shell regularly monitors
    this output location for any new output. Whenever the fresh output is found, the
    console prints it out to the screen.


    ### Redirection Standard Input


    `STDIN` read standard input is the default place on the bash shell where commands
    listen for input streams of data. As an example, when a user types `cd` without
    parameters, the `stdin` will listen for input from the user, displaying what you
    punch in on keyboard.


    ### Redirection Using Pipe


    In bash, shell pipes are setup to connect output result from one command to another
    as input. Piping is done by separating the two statements with the pipe symbol
    `|`. Below is the illustration of this piping:


    ```bash

    @rad-srv ~$ echo "They are all here"

    @rad-srv ~$ echo "They are all here" | sed "s/They/We/"

    ```


    The statement `echo "They are all here"` displays the result. They are all here
    to the `STDOUT` screen. Now when we pipe the result to `sed "s/They/We/"`, `sed`
    receives that output as its input and substitutes "They" with "We," then prints
    out that result to stdout. The bash shell only shows the final result after it''s
    gone through and got processed by the `sed` utility, and prints the result from
    the piped statement to the `STDOUT` screen. If `sed` displays its result to `STDOUT`
    screen, it is possible to pipe one `sed` result to another `sed` easily.


    ```bash

    @rad-srv ~$ echo "Hello world" | sed "s/world/people/" | sed "s/Hello/Greetings/"

    ```


    The above example shows that `echo` is connected to `sed`, then the result of
    this is also connected to another `sed`. Pipes are good for making the output
    from one command and making it the input in another command. Pipes are a key part
    of the Linux philosophy of "miniature sharp tools": we can chain commands together
    with pipes, this means that each command just needs to do exactly one thing and
    then pass the result on to another command that receives it as input.


    ## Standard Error


    The standard error (`stderr`) is similar to standard output and standard input
    but the major difference is that `stderr` is where error messages are taken to.
    Try catching a file that doesn''t exist to see some `stderr` output:


    ```bash

    @rad-srv ~$ cat file-is-not-there

    cat: file-is-not-there: No such file or directory

    ```


    The output above looks just like normal `stdout` output. Let us try to change
    that output using pipes:


    ```bash

    @rad-srv ~$ cat file-is-not-there | sed ''s/Non existant/Train Squash/''

    cat: file-is-not-there: No such file or directory

    ```


    Reading from the example above, we have not changed the output result even after
    introducing piping. With piping, the shell gets the standard output of the left
    side of the pipe and introduces it as the input of the bash command positioned
    to the right side of the pipe symbol. From the example above the error output
    from the `cat` command redirected to `stderr`, and not to `stdout`, meaning that
    nothing went through the pipe to `sed`.


    ## Redirecting Command Output


    After normal command execution the standard output and standard error streams
    display on the console. This makes these outputs visible to the user. In normal
    Linux bash operations, we can redirect the `stdout` and `stderr` streams to a
    custom file using the `>` greater-than operator:


    ```bash

    @rad-srv ~$ echo "Greetings World"

    Greetings World

    @rad-srv ~$ echo "Greetings World" > new-msg-file

    @rad-srv ~$ cat new-msg-file

    Greetings World

    ```


    The illustration above shows that the second `echo` statement didn''t display
    the statement to the terminal console because the output was redirected to the
    file `new-msg-file`. The statement `> new-msg-file` has mainly two functions:

    * The output redirector creates a file `new-msg-file` if the file doesn''t exist;

    * it would replace `new-msg-file`''s contents with the new contents if the file
    was already there.


    Now if the `new-msg-file` was already there, and we did `echo greetings > new-msg-file`,
    it would now have only greetings in it. If you want to add more data to the file
    by appending, you are required to use the `>>` operator:


    ```bash

    @rad-srv ~$ cat new-msg-file

    Hello there

    @rad-srv ~$ echo hello out again >> new-msg-file

    @rad-srv ~$ cat new-msg-file

    Hello there

    hello out again

    ```


    ### Linux File Handles


    In Linux we have file handles also known as file descriptors. File descriptors
    are unique positive integers that uniquely identify open files in the bash shell.
    We have three main file descriptors, namely `0`, `1` and `2`, that describe how
    data resources may be accessed. File handle `0` refers to data stream `STDIN`
    read standard input, while file handle one represents data stream `STDOUT` read
    the standard, and lastly file handle `2` referrs to data stream `STDERR` read
    standard error.

