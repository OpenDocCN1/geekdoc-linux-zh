- fmt: '

    # Using Modification Time with Find


    Let''s assume that you are using your Linux system and you seem not to remember
    where you saved some power-point and text files under. You only remember the time
    period you downloaded the files to your file system. How do you use the `find`
    command-line utility to locate your power-point and text files?


    You need to use the `find` command with modification time switch enabled. In bash
    command line each and every file has three time stamps, which are records of the
    last time some operations were done on the file namely `atime`, `ctime` and `mtime`.
    The time stamp `atime` represents the time when the file was accessed, while `ctime`
    represents a time when the file had its status changed that is the file or its
    attributes were changed. Lastly, we have the `mtime` which represents the modify
    time or a time when the file''s contents were changed.


    In the bash shell, you can look for files with time stamps that are within a certain
    age range, or even make comparisons to other time stamps.


    It is possible to use `find` command with the `-mtime` option. The filter or search
    returns a list of files that were last accessed N*24 hours ago. For instance,
    to search for a file that was last accessed in the last three months (90 days),
    we use the option `-mtime +90`.


    * `-mtime +25` this means you are searching for a file altered 25 days ago.

    * `-mtime -30` this means you are searching for a file less than 30 days old.

    * `-mtime 40` If you do not include `+` sign or `` sign it means the exact number
    of days specified for the example above means exactly 40 days ago.


    The `find` bash command enables users to find or search for files based on the
    date the file was altered or modified:


    ```bash

    [ppeters@rad-srv ~]$ find /var/named -name "*zone" -mtime 4

    [ppeters@rad-srv ~]$ find /home/testuser/ -name "*conf" -mtime 6

    ```


    The initial `find` command returns a listing of all files that have the search
    string `zone` at the end and were altered four days prior. The second `find` command
    filters the test user''s home directory for all files that have names that end
    with the string `conf` and were altered in the previous six days.


    ## Using Grep to Search


    The `find` command can only filter the hierarchy of the directory depending on
    the name and metadata of such a file. We use a tool like `grep` if you need to
    search for text or content within a file. The instance below illustrates the use
    of `grep`:


    ```bash

    [ppeters@rad-srv ~]$ find /etc -type f -exec grep "conf" ''{}'' \; -print

    ```


    The above statement searches each object that is of type file specified by the
    `-type f` switch in the `/etc` directory and then executes the `grep "conf"` command
    to find all the files that have `"conf"` text string in them for each object file
    that meets the criteria. The matching files will be displayed on the terminal
    screen using the `-print)` switch. For finding match outcomes, the curly braces
    `{}` are used as a placeholder. The curly braces `{}` are contained in single
    quotes (`''`) to prevent the handling of a malformed file name by `grep`.


    To prevent shell interpretation, the `-exec` command is terminated with a semicolon
    (`;`), which should be fled (`\ ;`).


    This type of command could have used the `xargs` command to produce a comparable
    output before the `-exec` option was implemented:


    ```bash

    [ppeters@rad-srv ~]$ find /usr -type f -print | xargs grep "binary"

    ```


    ## Finding and Executing Files Using Find


    ### Basic usage of -exec


    The `-exec` option or switch takes as its argument and implements an internal
    utility with optional statements. If the empty curly braces `{}` are present anywhere
    in the given command, the current pathname (`/the /path/file_name`) will replace
    each of the instances. There is no need to quote the curly braces `{}` in the
    bash shell.


    The command has to be prefixed with a semicolon; to check out where it ends (as
    there may be more options later). The shell must be quoted as `\;` or `'';''`
    to protect the `;` from the shell, otherwise the shell will see it as the end
    of the `find` command.


    The Example below (the `\` at the end of the first two lines are just for line
    continuations):


    ```bash

    find / -type f –name ‘*.ppt’ –exec grep –q ‘devops’ {} ‘;’ –exec cat {} ‘;’

    ```


    This will locate in or below the current working folder all standard files (`-type
    f`) whose names match the pattern `*.ppt`. It will then check whether the string
    `"devops"` occurs in any of the files identified using `grep-q` (which produces
    no result, only an exit status). a `cat` will be implemented for those files that
    contain the string to display the file''s contents to the terminal.


    Each `-exec` also functions as a "test" on the searched pathnames, just as `-type`
    and `-the name does. If the command returns a zero exit status (meaning "success"),
    it will consider the next part of the `find` command; otherwise, the `find` command
    will continue with the next pathname. In the above instance, this is used to locate
    files.


    The `find -exec` option or switch executes a program that has a match with the
    `find` statement against any item. Take the specific example below:


    ```bash

    [ppeters@rad-srv ~]$ find /etc -name "rc.local" -exec chmod u+r ''{}'' \;

    ```


    The statement above searches in the `/etc` folder for files that have the name
    `rc.local` and then executes the `chmod g+r` program to change permissions of
    the file to give users'' group the read rights to any instance of `rc.conf` found.


    The bash commands that run with the `-exec` option are executed in the `find`
    process'' folder. Using the `-execdir` ensures that the command is executed in
    the folder in which the match result resides. This solves the security issues
    and produces better operations performance.


    The `-exec` and `-execdir` switches run without additional prompts in the bash
    shell. It is possible to replace `-exec` with the option `-ok` and replace the
    alternative `-execdir` with `-okdir` if you require prompts before you take any
    action.


    ## Searching and Deleting Files


    This `-delete` option in `find` should be utilized with extreme caution because
    the action is irreversible. In Linux, you may append the option `-delete` to the
    end of a match expression to delete all files that match the `find` pattern. The
    `-delete` option should only be used when you are very certain that the output
    results match only the files that you need to delete.


    In the following example, the `find` command locates all files in the filesystem
    hierarchy beginning at the current working directory and traversing into the directory
    tree. In this example, `find` will delete all files that end with the characters
    `.backup`:


    ```bash

    [ppeters@rad-srv ~]$ find . -name "*.backup" -delete

    ```


    ## Searching Using the Locate


    The Linux `locate` command is used to search for files using the names of the
    files. There are two most popular user-accessible file search utilities called
    `find` and `locate`. The `locate` utility operates better and quicker than the
    `find` command because it looks through a database instead of searching the file
    system when a file search is started. This database includes bits and file components.


    ### Locate Command


    #### Locate Command Syntax

    ```bash

    [ppeters@rad-srv ~]$ locate [OPTION] search_pattern

    ```


    **Locate Exit Status:** The `locate` command will quit with status 0 whenever
    a match is found. After searching and there are no matches found the `locate`
    command will exit with status 1.


    **Options:**

    * `-b, –basename`: Match only the name of the base against the patterns specified.

    * `-c, –count`: Write down the total number of matching entries instead of writing
    file names on the standard output.

    * `-d, –database DBPATH`: The default database should be replaced with `DBPATH`.
    The: (colon) separated list of database file names is called `DBPATH`. If there
    is more than one `-database` options specified, the output path is an addition
    of the different paths. The default database replaces an empty database file name.
    The standard input is referred to as the database file name.

    * `-e, –existing`: Displays only the command locate entries referring to files
    that exist during the locate command execution time.

    * `-L, –follow`: When we are checking for file existence through the use of the
    –existing option, we also use -follow to trail all symbolic links. Through this
    option, all broken symbolic links are left out.

    * `-h, –help`: Specifying the `-h` option, will result in the summary of all available
    options.

    * `-i, –ignore-case`: this option ensures that case distinctions are ignored when
    matching patterns.

    * `-l, –limit, -n`: this option ensures that the execution exits after finding
    entries. When the `-count` option is also specified, the output count is also
    limited.

    * `-0, –null`: This option separates the entries on the result using the ASCII
    character.

    * `-S, –statistics`: This option writes statistics about each database.

    * `-q, –quiet`: This option ensures that we do not write error messages encountered
    while databases.

    * `-r, –regexp REGEXP`: This option is to search for a pattern matching a basic
    regular expression.

    * `--regex`: Interpret all patterns as extended regex.

    * `-V, –version`: Write information about the version and license of locating
    on standard output.

    * `-w, –wholename`: Only match the entire path name. The default option is this
    choice. You can specify the reverse using `-basename`.


    Below is the command to locate a file using the:

    ```bash

    [ppeters@rad-srv ~]$ locate search.txt

    ```

    The example above searches for `search.txt` file.


    Example to limit our search queries to a particular number:

    ```bash

    [ppeters@rad-srv ~]$ locate "*.php" -n 25

    ```

    The example above will show 25 files ending with `.php`.


    Example to display the otal number of matching entries:

    ```bash

    [ppeters@rad-srv ~]$ locate -c [.yaml]*

    ```

    The example above there will count files ending with `.yaml`.


    ## Searching with Which Command


    The Linux, `which` command is used to determine the path or location of a specified
    executable that is performed when you type that particular executable or command
    in the terminal prompt. The command searches for the executable defined as an
    argument in the PATH environment variable.The command searches through your path''s
    directories and attempts to find the command you''re looking for. It enables you
    to determine which version of a program or command will be running when you enter
    the command line with its name. Imagine that we were having a program called `ls`.
    We know the computer is installed, but we don''t know where it is. It has to be
    somewhere in the path because it runs when we type its name. We can use this command
    to find it:


    Using which Command

    The following shows the syntax of `which`:

    ```bash

    [ppeters@rad-srv ~]$ which [options] command

    ```


    If the filename was given as a command in the bash shell, it returns the pathnames
    of the files (or links) that would be executed in the current environment. It
    does this by searching the location for executable files matching the arguments
    in the PATH environment variable. The, `which` command ignores all soft links.

