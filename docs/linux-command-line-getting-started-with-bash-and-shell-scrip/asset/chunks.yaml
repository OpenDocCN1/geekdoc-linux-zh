    ~]$ gzip -c firstfile02.txt >> redirect.txt.gzThe example above shows two commands
    compressing firstfile01.txt and firstfile02.txt and stores them in one archive
    file named redirect.txt.gz .You can view the contents of both files (firstfile1.txt
    and firstfile2.txt) without extracting them using any one of the following commands:[ppeters@rad-srv
    ~]$  gunzip -c redirect.txt.gz[ppeters@rad-srv ~]$  gunzip -c redirect.txt[ppeters@rad-srv
    ~]$ zcat redirect.txt.gz[ppeters@rad-srv ~]$ zcat redirect.txtTo learn more about
    the gzip utility, you can visit the manual pages by typing the command below:[ppeters@rad-srv
    ~]$ man gzipCompressing and Decompressing with bzip2The bzip2 utility is similar
    to the gzip compression program. The main difference between the two is in the
    compression algorithms used. Bzip2 uses the compression algorithm called the Burrows-Wheeler
    block sorting text compression algorithm and Huffman coding. All the files bzipped
    using the bzip2 have the .bz2 extension.The usage of gzip and bzip2 is the same.
    We will just be substituting the gzip in the above examples with bzip2 , gunzip
    with bunzip2 , zcat with bzcat , and so on.Bzip2 compression replaces the file
    we are compressing with the compressed version of the archive; this can be achieved
    by running the command below:[ppeters@rad-srv ~]$ bzip2 firstfile.txtIf you are
    not willing to substitute the original file, use -c switch with the bzip2 tool
    and redirect the output result to a new file.[ppeters@rad-srv ~]$ bzip2 -c firstfile.txt
    > output.txt.bz2To decompress a compressed file:[ppeters@rad-srv ~]$ bzip2 -d
    firstfile.txt.bz2Or,[ppeters@rad-srv ~]$ bunzip2 firstfile.txt.bz2To view the
    contents of a compressed file without decompressing it:[ppeters@rad-srv ~]$ bunzip2
    -c firstfile.txt.bz2Or,[ppeters@rad-srv ~]$ bzcat firstfile.txt.bz2[ppeters@rad-srv
    ~]$ man bzip2Archiving Files and DirectoriesThere are mainly two utilities, namely;
    tar and zip, that are used to archive files and directories. This section of the
    book is going to be split into two sections; the first section will detail usage
    of TAR utility, and the second section will discuss the ZIP utility.The Tar CommandThe
    Tape Archive utility commonly known as the Tar is a Linux utility for archiving
    files and directories on the bash command line. Tar is utilized to put together
    or store a number of files which can be the same or unique size into one archive
    file. The tar utility has four major working modes, namely c, x, r, and t.


    1.  c – C mode is for creating a tar archive from one or more files and from one
    or more folders.


    2.  x – This is the Extract mode for file archiving.


    3.  r – This is the operating mode to add new files to the end of a tar archive
    file.


    4.  t – This mode provides a listing of the entities inside of a tar archive file.'
