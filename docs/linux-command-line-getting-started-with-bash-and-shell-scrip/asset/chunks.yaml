    ## 使用 Grep 进行搜索


    `find` 命令只能根据文件的名称和元数据对目录层进行过滤。如果你需要搜索文件中的文本或内容，我们使用像 `grep` 这样的工具。下面的示例说明了 `grep`
    的用法：


    ```bash

