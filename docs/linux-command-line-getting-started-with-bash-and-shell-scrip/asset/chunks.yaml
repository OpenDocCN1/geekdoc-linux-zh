    Jones"The above example declares the variable USER_NAME and assigns the value
    "James Jones" to it. Variables of this type are called scalar variables . Scalar
    variables hold only one value at a time.Bash Shell variables allow users to store
    any value. For example:VARIABLE1="James Jones"VARIABLE2=100Accessing Variable
    ValuesPrefixing the variable name with the dollar sign ($ ) is the only way to
    access variable values.The bash script below will access the value of declared
    variable NAME and print it on STDOUT −#!/bin/shNAME="James Jones"echo $NAMEThe
    above script will produce the following value −James JonesVariable TypesBash programming
    introduces us to three types of variables. In Bash, we have local, environment,
    and shell variables. These variables are essentially a temporary store of data
    or value. A local variable is a store of value that is present within the current
    instance of the bash shell. This variable and its values are unavailable to any
    other programs running in the operating system. The local variable setting is
    done at the command prompt.The next type of variable we have is the Environment
    Variable . This is a variable or parameter that is available to all child processes
    of the bash shell. Most programs require environment parameters for them to work
    correctly. Shell scripts define only the parameters necessary for that instance.Lastly,
    we have Linux Shell Parameters or Variables . Shell variables are special bash
    shell parameters set by the shell and are required by bash for it to function
    correctly. These parameters are either environment variables or are local variables.As
    an example, the process ID number, also known as the PID , is represented by the
    $ character:[ppeters@rad-srv~]$ echo $$13457As illustrated above, the $$ command
    displays the PID of the current bash shell: 13457Below is a table displaying the
