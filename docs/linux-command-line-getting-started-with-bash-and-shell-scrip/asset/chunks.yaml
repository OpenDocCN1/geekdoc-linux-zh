    in comparison to when they are done to stderr:# Redirect to the stdout, going
    through the redirection pipe[ppeters@rad-srv ~]$echo"some are redirections">&1
    | sed"s/some/all/"all are redirections# Redirect to the stderr[ppeters@rad-srv
    ~]$ echo“some are redirections”>&2 | sed"s/some/all/"all are redirectionsCommon
    Use Cases for stderr, stdout, and stdinExample of redirecting combined output
    to a file:[ppeters@rad-srv ~]$./command file_name1 file_name2 file_name3 > log-filename
    2>&1[ppeters@rad-srv ~]$ cat log-filenamestderr file_name2stdout file_name1stdout
    file_name3Chapter Three: FilesWe will start with an introduction to file searching
    and a detailed look at the various search tools available. I will then discuss
    file archiving and the various ways of creating archives.There are six unique
    ways to search for files in the Linux command line, and each of the ways has its
    advantages. In this section of the book, we are going to look at the various search
    tools, namely; locate, which, find, whatis, whereis, and apropos . These tools
    have their unique features and merits; these search utilities are used for different
    purposes.Linux commands for searching and finding files are varied, and each command
    performs well at other areas than the other tools. This section will detail the
    various search commands and look at their strengths in searching. Below we will
    start with a very brief introduction to these search tools before we go into full
    details of each tool.A Basic Introduction to Search ToolsLinux administrators
    may need to know the location of a file or directory on the filesystem but may
    not know where to find it. There are six bash commands that can be used to search
    for it, including whatis, whereis, find, and locate, apropos and which.Introduction
    to FindBelow is the syntax of the find command:


    | [ppeters@rad-srv ~]$find search_path search_pattern |


    If the path for the file is not specified, the search when using find begins in
    the user''s current working directory and searches down into all the sub folders.The
    find command has many options which are reviewable through use of the find manual
    pages. The manual pages for the find command are found by entering man find at
    the bash terminal. The most utilized option is the -name , which directs our find
    command to look for files and directories with the specified string in their name.


    | [ppeters@rad-srv ~]$ find / -name file_name |


    The illustration of the find command above is a search for files in the root directory
    "/" with the name "file_name" string in their search pattern.The Locate CommandThe
    command locate’s syntax is:


    | [ppeters@rad-srv ~]$locate search_pattern |


    The locate command enables us to see each file or folder that has the search_pattern
    string contained in the file or directory name. To locate a file or folder with
    search pattern "finger," enter the following statement:


    | [ppeters@rad-srv ~]$locate pwd |


    The bash locate command makes use of the slocate data store to search for files
    and folders with the search pattern string "finger" in their names.The locate
    command searches for strings patterns faster when the locate database is recent.
    That locate database is scheduled for auto-updates by running a cron task every
    night. In Linux Cron job is a small utility that executes in the terminal background,
    executing a variety of scheduled responsibilities, for instance, making locate
    database updates at 6 am every morning.The updated b command refreshes the slocate
