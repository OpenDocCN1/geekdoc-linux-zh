    # 理解 Shell 基础组件


    ## Bash Shell 语法介绍


    当用户使用键盘输入内容时，bash shell 读取输入字符串并将其拆分为单词和操作符，使用引号规则来定义输入的每个字符。


    当 shell 完成字符串的读取并将其拆分为单词和操作符后，bash shell 将这些拆分后的单词和操作符转换为命令和其他 bash 构造，并显示一个用于处理的退出状态。bash
    shell 处理输入字符串的详细步骤如下所示：


    * 初始，bash shell 从用户自定义的名为 bash 脚本的文件读取输入，或者 shell 从用户的键盘输入读取一个输入流。

    * shell 使用引号规则将输入流拆分为单词和操作符。这些单词和操作符使用通配符操作符 `.` 进行拆分。然后我们进行别名扩展（Alias expansion）。

    * 在 shell 分析单词和操作符后，根据拆分出的标记（tokens）创建简单和复合 bash 命令。

    * 通过一系列 shell 扩展，扩展后的标记被拆分为文件名、命令、选项和参数的列表。

    * 然后我们进行输入/输出重定向。接着将重定向操作数及其操作符从参数列表中移除。

    * 随后 shell 执行 bash 命令。

    * shell 可能会等待命令执行完成后再收集其退出状态。


    ## 理解 Shell 命令


    Bash shell 命令（如 `mkdir dir1 dir2`）由 shell 命令和参数组成，并用空格分隔。在 `mkdir` 示例中，命令是 `mkdir`，参数分别是
    `dir1` 和 `dir2`。


    用户可以简单地通过组合多种方式组织的基础命令来创建复杂的 shell 命令，包括使用管道（其中上一个基本命令的输出重定向到第二个命令的输入）、使用条件语句和循环。例如
    `ls | less`。


    ## 使用 Bash Shell 函数


    Bash shell 函数是若干组组合在一起处理的命令，可以被调用多次。shell 函数的执行方式与基础命令类似。函数有助于提高 bash 脚本的可读性。函数通过调用其名称来执行。当
    shell 的函数名被作为基本命令调用时，将处理该集合中的命令列表。


    ## 查看 Shell 变量


    Bash shell 变量或参数是存储字符串、整数和数组值的实体，通过名称或数字进行引用。所有通过名称引用的参数都称为变量。我们有三类型的参数，即位置参数、特殊参数和变量。在
    bash 脚本中，我们使用 `declare` 来创建变量。


    ## Shell 变量扩展


    变量或参数扩展是从引用的实体中获取值的过程，例如扩展一个变量以显示其值。扩展是访问和操作变量存储值的能力。基础扩展通过在变量名前前加上 `$` 符号来完成。shell
    扩展在命令字符串拆分为单词和操作符后执行。


    # 第二章：Shell 输入与输出


    在本章中，我将详细讨论 Shell 输入/输出重定向。Linux 系统中的，命令从终端接收输入并将结果输出返回到你的终端。通常，命令从标准输入（standard
    input）读取输入，这是你的默认设置。同样，命令将其输出类型到标准输出（normal output），这也是你的默认设置。


    ## 什么是 Bash 重定向？


    重定向是捕捉脚本、命令和普通文件输出的过程。重定向通过使用某些 shell 符号来实现：角括号 `<`、`>`，或者为了将输出捕捉到程序，我们使用管道符号
    `|`。


    每当 bash shell 命令被处理时，总是通过读取和解释特殊符号进行输入或输出重定向。重定向使得文件描述符（file descriptors）能够打开和关闭。通过重定向，文件描述符指向我们读取命令的各种文件。


    '
