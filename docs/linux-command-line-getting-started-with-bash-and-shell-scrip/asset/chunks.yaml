    # Bash Special Variables


    | # | The Variable &the Description |

    | :--- | :--- |

    | 1 | `$0` - This variable displays the current script’s filename. |

    | 2 | `$n` - These parameters are dependent on the number of arguments with which
    a script was called. From the variable `n` is a non-negative number that represents
    the current argument’s position (the initial argument is always `$1`, the argument
    that follows is `$2` and so on). |

    | 3 | `$#` - This displays the argument count supplied to the bash script. |

    | 4 | `$*` - In linux we double quote all arguments. If we input two arguments
    to a bash script, then `$*` is equal to `$1 $2`. |

    | 5 | `$@` - We individually double quote all arguments. If a bash script gets
    two arguments, `$@` results in `$1 $2`. |

    | 6 | `$?` - The above variable is the exit status of the command executed last.
    |

    | 7 | `$$` - The variable above shows the process ID number of the current bash
    shell. For all bash scripts, `$$` details the process ID under which they execute.
    |

    | 8 | `$! ` - This variable displays the processID number of the background command
    that was lastly executed. |


    ## Linux Terminal Arguments


    The Linux command-line interface arguments like `$1`, `$2`,...$9` are called positional
    variables, the `$0` variable points to the command we are executing, the program,
    the bash shell script, or the bash function and the special variables here `$1`,
    `$2`, ...`$9` are passed as the arguments to the bash command.


    The script below uses a number of special variables that are related to the command
    line interface:


    ```bash

    #!/bin/sh

    echo "File Name: $0"

    echo "Initial Argument : $1"

    echo "Second Argument : $2"

    echo "Double Quoted Values: $@"

    echo "Double Quoted Values: $*"

    echo "The Total Count of our Arguments is: $#"

    ```


    Displayed below is an example run for the above script:

    ```text

    [ppeters@rad-srv ~]$./peters_test.sh James Jones

    File Name : ./peters_test.sh

    Initial Argument : James

    Second Argument : Jones

    Double Quoted Values: James Jones

    Double Quoted Values: James Jones

    Total Count of our Arguments is: 2

    ```


    ## Bash Special Variables `$*` and `$@`


    Linux bash has some special variables that are used to access all the terminal
    arguments at once. The variables `$*` and `$@` will output the same result same
    unless you enclose them in `"" double quotation marks.


    These two variables specify terminal parameters. The special variable `"$*"` takes
    the whole set of arguments as a single argument with spaces in between whilst
    the special variable `"$@"` takes the whole list and splits it into disparate
    arguments. To process an unknown count of command-line arguments with either the
    `$*` or `$@` special variables we can use bash script below:


    ```bash

    #!/bin/sh

    for TOKEN in $*

    do

    echo $TOKEN

    done

    ```


    Below is the example run of the bash script above:

    ```text

    [ppeters@rad-srv ~]$./peters_test.sh James Jones

    is OldJamesJonesisOld

    ```

    Special Note : The `do...done` is a looping structure that will be detailed later
    on.


    ## Bash Shell Exit Status


    The special variable, `$?`, represents the exit status of a previously executed
    bash command. The numerical value returned by all completed commands is termed
    the Exit status. All successful commands return `0` exit status as a rule, and
    one exit status is returned for all unsuccessful commands. For specific reasons,
    some commands return extra exit statuses. Some commands, for instance, distinguish
    between types of errors and return different exit statuses based on the particular
    type of failure.


    Below is an example of a successful command:

    ```text

    [ppeters@rad-srv ~]$./peters_test.sh James Jones

    File Name : ./peters_test.sh

    Initial Parameter : James

    Second Parameter : Jones

    Double Quoted Values: James Jones

    Double Quoted Values: James Jones

    Total Count of Parameters : 2

    [ppeters@rad-srv ~]$./echo $?

    0

    [ppeters@rad-srv ~]$

    ```


    ## Bash Array Values


    In this part of the book, I will be discussing how to use bash shell arrays. There
    are bash shell variables that are capable of holding single values. These bash
    shell variables are termed scalars. The bash shell promotes a distinctive variable
    type known as an array variable. This can hold various values simultaneously.
    Arrays provide a grouping technique for a set of variables. You can use a single
    array variable rather than creating new names for each and every variable that
    is needed to store all the other variables. While naming arrays, all the naming
    laws mentioned for Shell variables would apply.


    ### Defining Array Values


    The distinction between an array variable and a scalar variable can be described
    as follows. Suppose you are attempting to portray as a collection of variables
    the names of different learners. Each of the names is a scalar variable.


    ```bash

    ARR_NAME01="James"

    ARR_NAME02="Peter"

    ARR_NAME03="Martin"

    ARR_NAME04="Samson"

    ARR_NAME05="Linda"

    ```


    To store all the names listed above, we can use a single array. The easiest way
    to create an array variable is to follow the example below. This enables one of
    its indices to be assigned a value.


    ```bash

    arrayname[index]=value

    ```


    From above the name of the array is `arrayname`, and the index is the index of
    an item in the array that has to be set, and value is what you want to set for
    that item. The example below:


    ```bash

    ARR_NAME[0]="James "

    ARR_NAME[1]="Peter"

    ARR_NAME[2]="Martin"

    ARR_NAME[3]="Samson"

    ARR_NAME[4]="Linda"

    ```


    The syntax of an array initialization, using the bash shell, is shown below:


    ```bash

    arrayname=(value01 ... valueN)

    ```


    ### How to Access an Array''s Values


    After setting an array variable, you can access it, as shown below:


    `${arrayname[index]}`


    The name of the array above is `arrayname`, and the index is the indice of the
    value to be processed. Below is the example to access array values:


    ```bash

    #!/bin/sh

    ARR_NAME[0]="James "

    ARR_NAME[1]="Peter"

    ARR_NAME[2]="Martin"

    ARR_NAME[3]="Samson"

    ARR_NAME[4]="Linda"

    echo "Indice One: ${ARR_NAME[0]}"

    echo "Indice Two: ${ARR_NAME[1]}"

    ```


    Below is the result of executing the bash script above:

    ```text

    [ppeters@rad-srv ~]$./peters_test.sh

    Index One: James

    Index Two: Peter

    ```


    Below are the alternatives ways to access arrays:

    `${arrayname[*]}`

    `${arrayname[@]}`


    From above the name of the array is `arrayname`. Below is the bash script to illustrate
    how to access arrays:


    ```bash

    #!/bin/sh

    ARR_NAME[0]="James "

    ARR_NAME[1]="Peter"

    ARR_NAME[2]="Martin"

    ARR_NAME[3]="Samson"

    ARR_NAME[4]="Linda"

    echo "Our Method One: ${ARR_NAME[*]}"

    echo "Our Method Two: ${ARR_NAME[@]}"

    ```


    The result of the bash script:

    ```text

    [ppeters@rad-srv ~]$./peters_test.sh

    Our Method One: James PeterMartinSamsonLinda

    Our Method Two: James PeterMartinSamsonLinda

    ```


    ## Shell Operators


    Shells in Linux particularly bash supports a number of operators. This section
    will discuss in detail the different operators. Originally the shell did not have
    a mechanism to perform arithmetic operations; it used external programs, like
    `awk` or `expr`.


    The example below illustrates how to add two digits:


    ```bash

    #!/bin/sh

    val_add=`expr 5 + 9`

    echo "The Total added value is: $val_add"

    ```

    The Total added value is 14


    There are a number of points to be considered while performing addition ● We should
    have spaces between the operators and the expressions. For instance, `6+9` is
    incorrect; it should be written as `6 + 9`. ● The arithmetic addition expression
    should be put between back ticks.


    ### Arithmetic Operators


    The table below shows all the arithmetic operators. Assuming that the variable
    `x` holds eight and variable `y` holds 15:


    The table below shows all the bash arithmetic operators.


    | Operator | Description | Example |

    | :--- | :--- | :--- |

    | `+` (Addition) | This operator Adds the values on both side of the operator
    together | `expr $x + $y` results in23 |

    | `-` (Subtraction) | This operator minuses the right hand value from the left
    hand value | `expr $x - $y` results in-7 |

    | `*` (Multiplication) | This operator finds the product of the operands on either
    side of the * operator | `expr $x \* $y` results in120 |

    | `/` (Division) | This operator Divides the left hand value by the right hand
    value | `expr $y / $x` results in1 |

    | `%` (Modulus) | This operator Divides left hand value by the right hand value
    and returns the remainder | `expr $y % $x` will give 7 |

