- fmt: "\n# Loops\n\nWhen executing various parts of the script, the loop is used\
    \ to do the job. Like other languages, Bash supports three kinds of loop statement.\
    \ The three-loop statements are `for` loop, `while` loop, and `until` loop. A\
    \ specific loop is used in the script based on the programming demands. In this\
    \ chapter, the uses of these three loop types are shown using straightforward\
    \ examples.\n\n## Using for loop\n\nWe will generate a bash script file with the\
    \ bash script where for iteration we use the `for` loop. The `for` loop is used\
    \ primarily to iterate an input list or array. A list of the name of the weekday\
    \ is used here and every name of the weekday is iterated using the loop. The `if`\
    \ conditional statement is used to print a specific statement depending on the\
    \ name of the weekday.\n\nforloop.sh\n```bash\n#Read the name of a day of the\
    \ week in each iteration of the loop\n\nfor day in Monday Tuesday Wednesday Thursday\
    \ Friday Saturday Sunday \ndo\n  #Check whether the day of the week is either\
    \ a Monday or Thursday\n  if [[ $day == 'Monday' || $day == 'Thursday' ]]\n  then\n\
    \    echo \"Training on $weekday at 9:30 am\"\n  #Check whether the day of the\
    \ week is Tuesday or Wednesday or Friday\n  elif [[ $day == 'Tuesday' || $day\
    \ == 'Wednesday' || $day == 'Friday' ]]\n  then\n    echo \"Seminar on $day at\
    \ 11:00 am\"\n  else\n    #Print ‘Holiday’ for other days\n    echo \"This day\
    \ $day is a Holiday\"\n  fi\ndone\n```\n\nOutput:\nRun the script.\n```bash\n\
    [root@BAKYRIE:~# ]chmod u+x forloop.sh\n[root@BAKYRIE:~# ]./forloop.sh\nTraining\
    \ on Monday at 9:30 am\nSeminar on Tuesday at 11:00 am\nSeminar on Wednesday at\
    \ 11:00 am\nTraining on Thursday at 9:30 am\nSeminar on Friday at 11:00 am\nSaturday\
    \ is a Holiday\nSunday is a Holiday\nroot@BAKYRIE:~#\n```\n\n## Using while loop\n\
    \nCreate a bash file with the following bash shell script where for program iteration,\
    \ we will utilize the `while` loop. This script will print figures that are even\
    \ and divisible by five from the range 1 to 20. Here, the `$counter` variable\
    \ is used to regulate the loop iteration, and each iteration increases the value\
    \ of this variable by 1. When the `if` condition returns true, the value of `$counter`\
    \ will be printed.\n\ncounter_script.sh\n```bash\n#!/bin/bash\n\n#Display or echo\
    \ the message\necho \"Output numbers that are even and divisible by 4\"\n\n#Declare\
    \ and give the counter its initial value\ncounter=1\n\n#Repeat until the $counter\
    \ value is less than or equal to 40\nwhile [ $counter -le 40 ]\ndo\n  #Determine\
    \ if the $counter is divisible by 2 and 6\n  if [[ $counter%2 -eq 0 && $counter%4\
    \ -eq 0 ]]\n  then\n    #Print $counter without newline\n    echo \"$counter\"\
    \n  fi\n  #Increment $counter by 1\n  ((counter++))\ndone\n\necho \"Done\"\n```\n\
    \nFrom the script above there are only 10 numbers within the range 1-40 that are\
    \ even and divisible by 4. The following output will appear after executing the\
    \ `counter_script`.\n```bash\n[root@BAKYRIE:~# ]chmod u+x counter_script.sh\n\
    [root@BAKYRIE:~# ]./counter_script.sh\nOutput numbers that are even and divisible\
    \ by 4\n4\n8\n12\n16\n20\n24\n28\n32\n36\n40\nDone\nroot@BAKYRIE:~#\n```\n\n##\
    \ Using the ‘until' loop construct example\n\nWe are creating a bash file with\
    \ the following script where we are using the `until` loop for iteration. This\
    \ `until_script.sh` script will display all odd numbers from 10 to 50. The variable\
    \ `$x` is used in this script for iteration.\n\nuntil_script.sh\n```bash\n#!/bin/bash\n\
    \n#Initialize the variable, x\nx=50\n\n#Repeat the loop until the value of $x\
    \ is greater than 10\nuntil [ $x -lt 10 ]\ndo\n  #Check whether the value of x\
    \ is odd\n  if [[ $x%2 -gt 0 ]]\n  then\n    echo $x\n  fi\n  #Increment the value\
    \ of x by 1\n  ((x=$x-1))\ndone\n```\n\nThe script will print all odd numbers\
    \ between 50 to 10. The following output will appear after running the script.\n\
    ```bash\n[root@BAKYRIE:~# ]vim until_script.sh\n[root@BAKYRIE:~# ]chmod u+x until_script.sh\n\
    [root@BAKYRIE:~# ]./until_script.sh\n49\n47\n45\n43\n41\n39\n37\n35\n33\n31\n\
    29\n27\n25\n23\n21\n19\n17\n15\n13\n11\nroot@BAKYRIE:~#\n```\n\n# Functions\n\n\
    In essence, a Bash function is a collection of commands that can be used and reused\
    \ in scripts many times. The aim of a function is to assist you to increase the\
