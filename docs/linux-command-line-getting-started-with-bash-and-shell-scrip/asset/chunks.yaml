  trans: "\n\n# 循环\n\n在执行脚本的不同部分时，循环被用于完成任务。与其他语言一样，Bash 支持三种类型的循环语句。这三种循环语句是 `for`\
    \ 循环、`while` 循环和 `until` 循环。根据编程需求在脚本中使用特定的循环。在本章中，将通过浅的示例展示这三种循环类型的用法。\n\n##\
    \ 使用 for 循环\n\n我们将创建一个 bash 脚本文件，在其中我们将使用 `for` 循环进行迭代。`for` 循环主要用于遍历输入列表或数组。这里使用了一个星期几名称列表，并使用循环遍历每个星期几。使用\
    \ `if` 条件语句根据星期几的名称打印特定的语句。\n\nforloop.sh\n```bash\n#在循环的每次迭代中读取星期几的名称\n\nfor\
    \ day in Monday Tuesday Wednesday Thursday Friday Saturday Sunday \ndo\n  #检查星期几是否为周一或周四\n\
    \  if [[ $day == 'Monday' || $day == 'Thursday' ]]\n  then\n    echo \"Training\
    \ on $weekday at 9:30 am\"\n  #检查星期几是否为周二、周三或周五\n  elif [[ $day == 'Tuesday' ||\
    \ $day == 'Wednesday' || $day == 'Friday' ]]\n  then\n    echo \"Seminar on $day\
    \ at 11:00 am\"\n  else\n    #为其他日期打印“Holiday”\n    echo \"This day $day is a\
    \ Holiday\"\n  fi\ndone\n```\n\n输出：\n运行脚本。\n```bash\n[root@BAKYRIE:~# ]chmod u+x\
    \ forloop.sh\n[root@BAKYRIE:~# ]./forloop.sh\nTraining on Monday at 9:30 am\n\
    Seminar on Tuesday at 11:00 am\nSeminar on Wednesday at 11:00 am\nTraining on\
    \ Thursday at 9:30 am\nSeminar on Friday at 11:00 am\nSaturday is a Holiday\n\
    Sunday is a Holiday\nroot@BAKYRIE:~#\n```\n\n## 使用 while 循环\n\n创建一个带有以下 bash shell\
    \ 脚本的 bash 文件，在其中我们将利用 `while` 循环进行程序迭代。该脚本将打印 1 到 20 范围内偶数且能被 5 整除的数字。在这里，变量\
    \ `$counter` 被用于控制循环迭代，每次迭代将该变量的值加 1。当 `if` 条件返回真时，将打印 `$counter` 的值。\n\ncounter_script.sh\n\
    ```bash\n#!/bin/bash\n\n#显示或输出消息\necho \"Output numbers that are even and divisible\
    \ by 4\"\n\n#声明并给计数器赋初值\ncounter=1\n\n# 重复直到 $counter 的值小于或等于 40\nwhile [ $counter\
    \ -le 40 ]\ndo\n  #确定 $counter 是否能被 2 和 6 整除\n  if [[ $counter%2 -eq 0 && $counter%4\
    \ -eq 0 ]]\n  then\n    #不换行打印 $counter\n    echo \"$counter\"\n  fi\n  #将 $counter\
    \ 增加 1\n  ((counter++))\ndone\n\necho \"Done\"\n```\n\n在上面的脚本中，1-40 范围内内只有 10\
    \ 个数字是偶数且能被 4 整除的。执行 `counter_script` 后将出现以下输出。\n```bash\n[root@BAKYRIE:~# ]chmod\
    \ u+x counter_script.sh\n[root@BAKYRIE:~# ]./counter_script.sh\nOutput numbers\
    \ that are even and divisible by 4\n4\n8\n12\n16\n20\n24\n28\n32\n36\n40\nDone\n\
    root@BAKYRIE:~#\n```\n\n## 使用 ‘until' 循环结构示例\n\n我们正在创建一个带有以下脚本的 bash 文件，在其中我们使用\
    \ `until` 循环进行迭代。该 `until_script.sh` 脚本将显示 10 到 50 之间的所有奇数。变量 `$x` 在此脚本用于迭代。\n\
    \nuntil_script.sh\n```bash\n#!/bin/bash\n\n#初始化变量 x\nx=50\n\n#重复循环直到 $x 的值大于 10\n\
    until [ $x -lt 10 ]\ndo\n  #检查 x 的值是否为奇数\n  if [[ $x%2 -gt 0 ]]\n  then\n    echo\
    \ $x\n  fi\n  #将 x 的值减 1\n  ((x=$x-1))\ndone\n```\n\n该脚本将打印 50 到 10 之间所有的奇数。运行脚本后将出现以下输出。\n\
    ```bash\n[root@BAKYRIE:~# ]vim until_script.sh\n[root@BAKYRIE:~# ]chmod u+x until_script.sh\n\
    [root@BAKYRIE:~# ]./until_script.sh\n49\n47\n45\n43\n41\n39\n37\n35\n33\n31\n\
    29\n27\n25\n23\n21\n19\n17\n15\n13\n11\nroot@BAKYRIE:~#\n```\n\n# 函数\n\n本质上，Bash\
    \ 函数是一组命令，可以在脚本中多次使用和重复重用。函数的目的是帮助你增加 bash 脚本的可读性，并防止反复编写完全相同的代码。与大多数编程语言相比，Bash\
    \ 函数受到一些限制。我们将在本节中解释 Bash 函数的基础知识，并演示如何在你的 shell 脚本中使用它们。\n\nBash 方法或过程基本上是许多指令，可以被重复调用。函数的目的是让你的\
    \ bash 脚本更具可读性。\n\n## Bash 中的声明\n\n声明 bash 函数的结构非常直观。Bash 函数有两种声明方式：\n\n1. 第一种格式以函数名开始，后跟括号\
    \ `()` 也称为圆括号。这是最常用的格式。\n   `function_name() { commands }`\n\n2. 第二种函数语法以保留字 `function`\
    \ 开始，后跟函数名。\n   `function function_name { commands }`\n\n当一个代码块在脚本中需要运行多次时，可以使用函数来完成工作。你只需要通过名称调用函数即可。像其他约定语言一样，Bash\
    \ 不支持函数参数。但在本节中，可以通过独特的方式传递给 bash 函数。通过 `return` 语句或不使用 `return` 语句，都可以从函数返回值。\n\
    \n创建一个带有以下脚本的 bash 文件，学习如何在 bash 脚本中声明和调用函数。下面的 `basic_function.sh` 脚本声明了三个函数。第一个打印基础消息“Bash\
    \ scripting for beginners”的过程或函数。第二个函数被定义为调用过程后将字符串赋值给变量 `$return_str`，它将打印“Learn\
    \ bash here.”。\n\nbasic_function.sh\n```bash\n#!/bin/bash\n\n#声明一个过程/方法/函数\nfunction\
    \ display_string()\n{\n  echo \"Bash scripting for beginners\"\n}\n\n#声明一个返回字符串值的方法/函数\n\
    function str_data()\n{\n  #使用初始字符串值初始化变量\n  str_data=\"Start bash scripting today\"\
    \n}\n\n#声明一个读取输入参数的过程/方法\nfunction circle_area()\n{\n  #读取输入参数\n  local radius=$1\n\
    \  local area=$(echo $radius*$radius*3.14 | bc)\n  #向屏幕显示圆面积\n  echo \"The area\
    \ of the circle given radius $radius above is $area\"\n}\n\n# 调用函数显示字符串\ndisplay_string\n\
    \n# 调用方法将字符串赋值给变量\nstring_data\n\n#向屏幕显示变量字符串\necho $string_data\n\n# 读取用户输入的半径值\n\
    echo \"Please enter your radius size\"\nread rad\n\n# 调用函数根据半径创建面积\ncircle_area\
    \ $rad\n```\n\n"
