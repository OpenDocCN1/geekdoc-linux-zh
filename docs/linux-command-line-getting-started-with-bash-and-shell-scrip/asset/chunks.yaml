    Scripting Exercises](#part0010.xhtml_a45M)[Conclusion](#part0011.xhtml)[References](#part0012.xhtml)PrefaceLinux
    is one of the most dominant and adaptable operating systems globally. Linux operating
    system is utilized in many areas of Computer Science, ranging from embedded to
    smart devices. This Operating system is utilized in High-Performance Computers,
    servers that are running the global Internet infrastructure services like DNS,
    smartphones, android tablets, and televisions.The Linux Operating System is distributed
    with intuitive and modern graphical user interfaces, which are customized to the
    distribution of Linux in use ranging from GNOME to KDE to Cinnamon. On any Linux
    computer, the shell is the most powerful and pliant way of interacting with the
    operating system kernel and attendant services. A Linux shell is used to execute
    individual commands. Commands are a set of instructions sent to the Linux kernel
    to tell the computer what to do. The Linux shell can also execute and interpret
    commands from a written text file called a bash script, which enables easy automation
    of tasks.Many System administration tasks are routine and repetitive that need
    to be automated for example, automatically like sending alerts, e-mails, and performing
    routine maintenance. This book contains beginner information about the Linux command
    line, shell and bash scripting. The book introduces the novice Linux user to basic
    Linux scripting skills to automate and perform a number of Systems Administration
    tasks. The System Administration tasks in Linux range from parsing and interpreting
    text, to networking services operation automation. The Linux shell is only as
    powerful as the user intends it to be. Linux experts feel the power of shell scripting
    since they use the shell to do large automation. Linux Command Line gives you
    these magical capabilities!What This Book CoversThis book is an immersive introduction
    into the Linux Operating system shell, how to configure the shell and the Linux
    environment and to write basic bash/shell scripts).Chapter 1 : Introduces the
    reader to Linux Command Line concepts. The concepts will detail the different
    types of shells that exist and mainly focus on BASH as the shell of choice. The
    chapter will also feature an immersive rundown of Linux Commands, BASH commands
    and how to start with BASH.Chapter 2: Details different usage scenarios of BASH
    that users may meet in Systems Administration. This chapter will look at Redirection
    Basics, shell environment basics with an introduction to the VI text-editing tool.Chapter
    3: Introduces File searching and archiving. This chapter will also discuss Linux
    operations to find and remove duplicate files and enumerating words in a file.Chapter
    4: Looks at introducing our users to the basics of writing scripts and starting
    out with writing their first Bash script.How to Use This BookThis book is written
    as a Linux Command Line and Bash scripting Primer, teaching the user how to handle
    BASH shell scripting. You should go through the chapters in sequence. You may
    choose to skip some chapters if you are reasonably comfortable with the concepts
    covered in it.PrerequisitesTo comfortably use this book, the main expectation
    is that you have a working Linux Server installation in either Centos 7 or Ubuntu
    18.4 operating systems. You can get this in one of two ways:1\. Install Linux
    on an (Oracle Virtual Box) virtual machine.You are expected to install your distribution
    of choice, either CENTOS 7 or Ubuntu 18.4\. I will explain the steps to install
    Centos 7 in this book. The rest of the book will be dealing with commands, which
    work on all Linux variants. Setup your Virtual Machine with 2GB RAM and 20GB Hard
    drive.2\. Using a Live CD on your Laptop/DesktopLinux distributions like Centos/Ubuntucan
    can be run directly from a USB flash drive or CDROM/DVDROMwith no installations
    on your machine. To enable you to use a LIVE CD , you have to change your BOOT
    Order in BIOS settings to allow you to BOOT from either CDROM or USB Flash drive
    first. After booting using your Live CD, go through the rest of the book and follow
    along with the commands. Much of the material in this book is "practical," so
    jump in and get your hands dirty.IntroductionThe Linux operating system''s history
    can be traced from early LINUX systems that were freely distributed to educational
    institutions like colleges and universities in the USA. Initiatives like the Berkeley
    Software Distribution (BSD) put in some work on the operating systems. The Free
    Software Foundation helped make many of the parts required to fully develop a
    LINUX-like operating system that is free of charge. The last major component to
    be delivered was the Linux kernel developed by a Finnish student called Linus
    Torvalds around 1990 and with online collaboration from many Linux enthusiasts
    the Linux Kernel is what it is today.This is a beginner Linux bash-scripting book
    that is going to introduce the Linux Operating System and explain why people use
    the Operating System over other proprietary systems. In this section, I will start
    by introducing our reader to what an Operating system is. I will detail the functions
    of an operating system, before introducing Linux and putting together the advantages
    and disadvantages of using Linux.What is an Operating System?An operating system
    is a computer hardware and software management program for users. Originally,
    operating systems were built to conduct repetitive hardware duties that focused
    on file management, running programs, and receiving user instructions. Using a
    user interface, you communicate with an operating system''s kernel that enables
    the operating system to obtain and interpret user-sent instructions. To execute
    a job, you only need to submit an instruction to the operating system, such as
    reading a file or printing a document and the operating system will coordinate
    with the hardware to execute that instruction.Operating system functionsThere
    are many functions that are performed by the operating system, but the main purpose
    of the operating system is to provide an interface between a User and the Computer
    System''s hardware. The different functions that the operating system performs
    are explained below.Resource ManagerThe Linux Operating System, like any other
    OS, is a Resource Manager. This means that it manages all Resources that are attached
    to the system such as Memory and Central Processing Unit and all Input Devices.
    The operating system will determine when the CPU will perform which operation.Process
    ManagementThe operating system always keeps track of processes simultaneously
    running on your computer. The OS keeps track of various procedures running and
    decides which process and when it has access to the CPU. The system must also
    provide methods to start, stop, and change process statuses.Hardware ManagementDuring
    Linux System Boot up process, the Computer performs POST (Power-On Self-Test)
    which is a process that This operator finds out the hardware components currently
    attached to the Computer (CPU, hard drive, USB devices, and network cards) and
    loads the device drivers and modules required to access those particular hardware
    devices.Memory ManagementMemory management is the function where the operating
    system handles and manages the primary memory and extended memory of the Computer
    System. Memory management entails movement of system and custom processes back
    and forth between the main memory and the secondary memory during execution, such
    as the hard drive. Memory management also keeps track of all volatile memory places
    on the computer, irrespective of whether they are freely assigned to some processor.
    This operator finds out the quantity of memory to be assigned to specific procedures.
    Applications in Linux require RAM (random access memory) and swap space (extended
    memory) to function. The operating system is responsible for memory management
    to ensure optimal sharing of this resource by various programs running on the
    system.File System ManagementFile system constructs or components are either built-in
    into the Linux operating system or loaded as modules. In Linux, everything is
    viewed as a file from directories, processes, and devices. The Linux operating
    system plays a major part in controlling who owns and who has access to processes,
    files, and folders, also known as directories that the file systems contain.User
    and Group ManagementSystem Administrators in all major operating systems add,
    update, delete, and manage user and group accounts on their systems. The Linux
    operating system facilitates the addition, deletion, and updating of user and
    group accounts and managing related user and group access permissions and level
    of control a user has on the system. Individual users and group accounts in Linux
    facilitate user access to their files and processes they own or are owned by other
    users of the System.Programming ToolsThe Linux operating system offers a number
    of programming tools for developing programs and libraries to implement Application
    Programming Interfaces that allow Linux to connect with many other Programs.What
    is Linux?Linux is a solid, lightweight and sturdy open-source operating system
    that has enterprise-level Internet services, extensive development tools, fully
    functional graphical user interfaces (GUIs), and a massive number of applications
    ranging from office suites to multimedia applications (Petersen, 2008).Linux is
    one of the twenty-first century''s most eminent technological advances. In addition
    to its effect on huge Internet growth and its position as an enabling technology
    for a range of computer-driven systems, Linux development has been a model of
    how cooperative initiatives can surpass what people and businesses can do alone
    (Negus, 2015).Linux operating system like any other operating system is composed
    of the Kernel, GNU utilities, a graphical user interface (GUI) and application
    programs. The detailed components above each play a crucial role in the Linux
    operating system''s operations.The Linux KernelThe Linux system''s heart is the
    kernel. The kernel regulates all computer system hardware and software, allocating
    hardware if needed, and implementing software if needed.The kernel is mainly accountable
    for four primary tasks, namely the management of system memory, software program
    management, hardware management, and file system management.As an operating system,
    Linux comprises of the OS kernel, and it''s components that oversee the management
    of your software and hardware and allows you to run applications on your System.The
    OS of ChoiceLinux is an operating system that has been developed through collaboration
    between communities of developers worldwide. Linux has been tested rigorously
    in the IT industry and was found to be stable, easy to use, and highly secure
    with a very powerful command-line interface. These and many other advantages stated
    below are the major reason why people choose Linux to power their Server infrastructure.Linux
    OS AdvantagesLinux operating system has many advantages that make it a solid choice
    for server and other operating system functions.Powerful Command Line InterfaceLinux
    distributions have a powerful bash shell. The shell is also called the terminal,
    and it affords users a text-only interface that gives them great power.High SecurityLinux
    operating system is known to be very secure when it comes to avoiding viruses
    and malware. The developers of Linux had security in mind when they were developing
    the Operating System. The major reason for this security comes from the fact users
    are expected to create and login into Linux systems as a regular user. By default,
    most Linux distributions like Debian and Ubuntu do not permit Root Login. Most
    people access their Systems using limited regular accounts; which mean they have
    no privileges that enable them to cause damage to the system. Linux regular users
    can only cause damage to their own files.The other major reason for Linux''s greater
    level of security is that the Operating System''s source code is publicly accessible
    for review since Linux is open-source software. The source code is accessed and
    reviewed by a huge community of enthusiastic developers all over the globe, which
    implies that most of the bugs and vulnerabilities have already been found and
    are being continually found.Greater System StabilityThe Linux operating system
    is very sturdy and crashes less frequently. Linux installations continue functioning
    well even after many years running continuously. Indeed, some users have setups
    that were installed once and had been running without incident for many years.Linux
    servers in many data centers have high uptime, and their overall availability
    nears 99.9 percent. Linux servers do not require reboots after every system and
    program updates or patches. This sturdiness and high uptime have resulted in the
    bulk of the Internet running Linux servers in their infrastructure. ZDNET website
    estimates that a whopping 96.3 percent of the best Web servers are running on
    Linux.Easy to MaintainMaintaining Linux involves regular updates to the programs
    running on the system. Systems are regularly monitored and checked for bugs and
    vulnerabilities. Updating programs ensures that bugs are fixed, new features are
    added, and vulnerabilities are plugged. Linux is very easy to maintain even for
    beginner users. Experience Linux users and administrators are able to make central
    updates and program patches. Operating systems need a way to check for vulnerabilities
    continuously. All Linux distributions have their own central program repositories,
    where program code is audited and tested regularly for bugs and any other reported
    issues, the software repositories are used to keep the system up to date and safe.
    Linux distributions offer regular system updates and no reboots are done after
    system updates. As a Linux user, it is possible for you to schedule system updates
    at regular times. Bash scripts and Linux Cron jobs are written to automate the
    processes of scheduling system updates.Can be Run on any Piece of HardwareLinux
    operating systems have efficient use of system resources, which include CPU and
    RAM. Linux uses the computer system''s hardware resources effectively and efficiently.
    This efficiency means that you can run your Linux installation on any piece of
    decent hardware. Linux systems are running on a variety of architectures from
    low-specked computers to mobile phones and smaller gadgets.Free to UseGetting
    a Linux operating system is 100 percent free except for a few Enterprise Distributions,
    which charge for Support like Red Hat and Canonical. Linux is totally free of
    charge; users can download Linux and be good to go with decent skills. Linux has
    all the basic programs required by a typical and expert user available. Businesses
    and Governments can leverage the cost of the Operating system and build robust
    infrastructure at a significantly lower budget. Whole Internet ecosystems from
    DNS, DHCP, Email, and Communication are setup on Free Linux for free.100 Percent
    Open SourceLinux is an operating system developed by a community of developers,
    and the source code of this operating system is freely available for users to
    make contributions through documentation, finding and fixing bugs. This community
    involvement means that there are many eyes that are auditing and working on the
    system to make it stable and error-free. Users are free to download the source
    code and modify or even distribute it.Easy to UseLinux operating system has increasingly
    become the mainstream. Linux is now user-friendlier and has a simple and intuitive
    graphical user interface (GUI) that makes it useable even by novice users. Contrary
    to the general view that Linux is only for geeks, it is now being used on laptops
    and other gadgets. Someone used to Windows can now easily move and use Linux on
    their Personal Computers. The GUI has evolved to the extent that, without understanding
    any shell scripts or code, most of what typical users want can be accomplished
    on Linux as readily as is done on Windows.Linux is Flexible for CustomizationLinux
    has gifted all its users, from beginners to advanced administrators, the flexibility
    to change the look and feel of their environment to suit their requirements. We
    have more than three desktop environments such as GNOME, KDE, Unity, Cinnamon,
    and MATE.Linux has a large pool of alternative system and application programs
    that users may select to install on their distributions.Global System Support
    AvailableOver the Internet, there is a powerful Linux Open source community that
    provides support for Linux through different forums. Any question posed in forums
    will generally be answered quickly as many enthusiastic Linux volunteers are online
    and working to fix the issues. Also accessible for business enterprises is the
    paid support option, with businesses such as Red Hat and Canonical providing 24-7
    assistance for critical installations and services.Linux DisadvantagesLinux operating
    system has a number of disadvantages of which the most mentioned is that it is
    difficult for most people to learn to use the operating system. The biggest disadvantage
    in Linux is that most hardware manufacturers build their device drivers for Windows,
    so the Linux user has to handle the programming of hardware drivers. Linux has
    an inherent lack of driver support.Linux infrastructure setups require that your
    administrators have a high-level understanding of the operations of the operating
    system. Any organization needs to ensure that they have the requisite Linux expertise
    before they start using it.The other disadvantage of Linux is the lack of a standard
    universally accepted distribution across the globe. There are varieties of Linux
    distributions that operate differently and manage things uniquely. This may be
    daunting for most users.Chapter One: Linux Command LineIn this chapter, we are
    going to dive deep into the Linux Command Line Interpreter. We are going to concentrate
    on the Bash shell and its environment. We will have a brief introduction into
    the command line Interpreter, Shell, and Bash. I will guide you with regards to
    how to begin Bash programming.The Command-Line InterpreterLinux operating system
    can be accessed by users through the Graphical User Interface, also known as the
    GUI and through the command-line interface, also known as the CLI.Command-line
    interface also referred to as the terminal or console, is Linux''s text-based
    interface into which you enter commands, which are basically instructions to your
    Computer. Commands are made up of options and arguments. These commands are read
    and interpreted by the command-line interface. If you are accessing your Computer
    using the GNOME or KDE graphical user interface, the command line interface is
    accessed by opening a terminal. When a user accesses the text-based login into
    the computer, the command line interface will be presented as the BASH shell.What
    is a Shell?The shell has an eminent function in a Linux system that is to run
    commands. The Linux shell is simply a program that reads user commands entered
    from the keyboard and passes them to the kernel for execution or processing. The
    shell can actually be considered as a full programming language that has functions
    and variables, and data structures such as arrays. The shell is directly connected
    to the kernel, and thus it has native File Input and Output primitives built into
    its syntax. The shell has a native process and job control function in a Linux
    operating system.The shell enables interactive access to the Linux kernel and
    programs running on it. The shell executes and functions as a regular program,
    and it initializes or starts whenever a user logs in to a console. A shell is
    a macro processor that interprets and executes user instructions to the system
    through commands entered through the keyboard. The Linux bash shell is touted
    as both a command-line interpreter and a traditional programming language.The
    shell offers the user interface a collection of GNU utilities as a command interpreter.
    It is possible to create files that contain lines of commands as code, and these
    files become commands themselves. These newly written commands known as shell
    scripts kept in directories such as /bin have the same status as system commands,
    enabling system administrators to create custom environments to automate their
    routine tasks. Linux shells are used interactively ornon-interactively depending
    on the method used to make them. Shell recognizes keyboard-typed input in the
    interactive mode. Shells also read commands from a file called bash script when
    executing non-interactively.The shell is available to you in any of the many Linux
    distributions available. The shell enables us to write commands and package them
    as executable script files to run shell and all user programs, work with Linux
    file systems, compile computer program code, and administer the system. The shell
    gives many Linux experts much more power to control how a system operates and
    function. It is through the shell that users can customize and automate their
    Linux infrastructure.A shell enables both synchronous and asynchronous execution
    of bash commands. The shell waits for concurrent commands to finish before accepting
    more input; while reading and executing extra commands, asynchronous commands
    continue to perform in conjunction with the shell. The constructs of redirection
    allow fine-grained control of these commands'' input and output. In addition,
    the shell enables contents of command settings to be controlled. Shells also provide
    a small set of built-in commands that can''t or can''t get functionality via distinct
    services. A user may check the types of shells /etc/shells that their system accepts:[ppeters@rad-srv
    ~]$ cat /etc/shells/bin/bash/bin/sh/sbin/nologin/bin/dash/bin/tcsh/bin/cshEvery
    user created on the Linux system has a default shell set for them. The default
    shell settings are kept in the /etc/passwd file. Below is an example/etc/passwd
    entry for user ppeters :ppeters:x:500:500::/home/ppeters:/bin/bashExample CommandsTo
    check the default shell for a USER in the Computer please type the following command
    in your terminal and check if your result resembles one below:'
