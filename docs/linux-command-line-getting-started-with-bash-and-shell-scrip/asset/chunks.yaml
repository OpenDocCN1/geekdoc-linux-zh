    \ grep 'Susan' student_marks.txt\n```\nSusan BSE-109 55\nSusan BSE-104 58\nSusan\
    \ BSE-101 72\n```bash\nroot@bakyrie:~# wc -l tempfile.txt\n```\n3 tempfile.txt\n\
    \nFrom the illustration above, we can easily join together all the three lines\
    \ of commands-s above and produce the same output result by running a single command\
    \ with pipes, as shown in the following example command. We do not use a temporary\
    \ file here to get the output result. The illustration below shows the chaining\
    \ of output from the `sort` command into the input of the `grep` command and lastly\
    \ the word count of the result from `grep`.\n\n```bash\nroot@bakyrie:~]# sort\
    \ student_marks.txt | grep 'BSE-101' | wc\n```\n\n### Output\nThe results of running\
    \ the above-piped statement are the word count of anything that contains the string\
    \ \"BSE-101\" from the `student_marks.txt` file. The word count first lists the\
    \ number of occurrences of the string being grepped \"BSE-101\" and also outputs\
    \ the number of words in this instance we have nine words and lastly displays\
    \ the total number of characters in the results which is seventy-nine in our example\
    \ above. The output of the command will be `3 9 79`. Three entries of output with\
    \ string \"BSE-101\".\n\n```bash\nroot@bakyrie:~# sort student_marks.txt | grep\
    \ 'BSE-101' | wc\n```\nSusan BSE-109 55\nSusan BSE-104 58\nSusan BSE-101 72\n\n\
    ```bash\nroot@bakyrie:~# sort student_marks.txt | grep 'BSE-101' | wc\n```\n3\
    \ 9 79\n\nroot@bakyrie:~#\n```\n\n### Bash Scripting Exercises\n\n#### First Exercise\n\
    In your first exercise, you will be creating a script to display the terminal\
    \ screen \"Having fun with Scripting!\".\nCreate `exercise01.sh`:\n```bash\n#!/bin/bash\n\
    echo \"Having fun with Scripting!\"\n```\n\n#### Second Exercise\nModify the script\
    \ you did from the first exercise to introduce a variable. The variable will store\
    \ the \"Having fun with Scripting!\".\nCreate `exercise02.sh`:\n```bash\n#!/bin/bash\n\
    str_info=\"Having fun with Scripting!\"\necho $str_info\n```\n\n#### Third Exercise\n\
    This exercise is about using variables to store the output of `hostname`. Print\
    \ \"This script is running on the machine\" where the variable is the output of\
    \ `hostname`.\nCreate `exercise03.sh`:\n```bash\n#!/bin/bash\nHOSTNAME=$(hostname)\n\
    echo \"This script is running on the machine $HOSTNAME\"\n```\n\n#### Fourth Exercise\n\
    This exercise is about creating a script to determine whether a file exists. When\
    \ the script finds that the file exists, it will display \"The file does exist\"\
    . The next part of the script checks if you are able to write to the file. If\
    \ the user has permissions to write the file the terminal screen will have \"\
    You have permissions to edit the file\". Otherwise, if you have no permissions,\
    \ display on the terminal \"You do not have permissions to process the file\"\
    .\nCreate `exercise04.sh`:\n```bash\n#!/bin/bash\nUSER_FILE=\"/home/ppeters/test_file.txt\"\
    \nif [ -e \"$USER_FILE\" ]; then\n    echo \"The $USER_FILE path does exist\"\n\
    fi\nif [ -w \"$USER_FILE\" ]; then\n    echo \"You have permissions to edit the\
    \ file\"\nelse\n    echo \"You do not have permissions to process the file\"\n\
    fi\n```\n\n#### Fifth Exercise\nIn this exercise the learner is expected to create\
    \ a Linux bash script that displays on the terminal screen \"chihuahua\",\"doberman\"\
    ,\"hound\",\"basset\",\"pitbull\" and \"corgie\" with each one of the dog breeds\
    \ appearing on a separate line. The learner should do this in as few lines as\
    \ possible.\n`exercise05.sh`:\n```bash\n#!/bin/bash\nDOGS=\"chihuahua doberman\
    \ hound basset pitbull corgie\"\nfor DOG in $DOGS\ndo\n    echo $DOG\ndone\n```\n\
    \n### Conclusion\nLinux is a wonderfully diverse language and you should take\
    \ the time to explore it. Granted it might seem a bit complex at first but with\
    \ constant practice, you’ll begin to see why the mouse is overrated as a companion!\
    \ Jokes apart, my aim with this book has been to give you an introduction and\
    \ walk you through some of the most basic Linux commands and features. The idea\
    \ is for you to work your way through the sample code at your own pace. There\
    \ are many applications Linux lends itself to and this is precisely what my other\
    \ books on the topic cover. For example, how would you like to be an ethical hacker\
    \ and start a career in network security and administration? Linux truly is a\
    \ programmer’s dream. Hopefully you’ve enjoyed this under the hood look at what\
    \ goes on with Linux. I hope this book has been an enjoyable and informative read\
    \ for you. Do let me know what you think and be on the lookout for the next book\
    \ in this series in which I’ll take you deeper into the world of Linux and bash\
    \ scripting. I wish you the best of luck in your Linux learning adventures!\n\n\
    ### References\nNegus, C. (2015). *Linux ® Bible Ninth Edition (9th ed.)*. Wiley.\n\
    Petersen, R. (2008). *Linux: The Complete Reference, Sixth Edition*. McGraw-Hill.\n"
