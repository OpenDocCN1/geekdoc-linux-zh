    ## Calling programs in a script


    In any bash script, you can utilize numerous types of programs like `bash`, `source`,
    `exec`, and `eval` to invoke other commands. As an illustration let us suppose
    that you have built four bash script files, `sum_script.sh`, `deduct_script.sh`,
    `product_script.sh` and `division_script.sh` to sum, deduct, find the product
    and division result. Below we have the arguments for the command line `subtract_script.sh`
    and `division_script.sh`. Below is the script for all these four files.


    ### sum_script.sh

    ```bash

    #!/bin/bash

    x=60

    y=40

    ((asnwer=$x+$y))

    echo "The sum of x and y is $answer"

    ```


    ### deduct_script.sh

    ```bash

    #!/bin/bash

    x=$1

    y=$2

    ((answer=$x-$y))

    echo "The result of the deduction of y from x is $answer"

    ```


    ### product_script.sh

    ```bash

    #!/bin/bash

    ((answer=$1*$2))

    echo "The product of $1 and $2 is $answer"

    ```


    ### divide_script.sh

    ```bash

    #!/bin/bash

    x=$1

    y=2

    ((answer=$x/$y))

    echo "The result of dividing $x by $y is $answer"

    ```


    Use `source`, `bash`, `eval`, and `exec` commands to create a bash file named
    `call_function.sh` with the contents listed below. Before running the following
    script, you must set the permissions that allow this script to execute on the
    bash shell. The command `source` is used to call the file `add_script.sh`. The
    command `bash` is used to perform the file `subtract_script.sh`. The `eval` command
    is used to run the `product_script.sh` bash file. For the `eval` program, we capture
    the two operand values for the `eval` from the bash shell arguments. Lastly, we
    run the `exec` command, which only operates with an absolute path. To do this,
    `divide_script.sh`''s the complete path name is provided in the bash file below.


    ### call_function.sh

    ```bash

    #!/bin/bash

    1st_script="sum_script.sh"

    2nd_script="deduct_script.sh"

    3rd_script="product_script.sh"

    4th_script="/home/ppeters/code/divide_script.sh"

    source "$1st_script"

    bash $2nd_script 50 20

    echo "Enter the value of x"

    read x

    echo "Enter the value of y"

    read y

    eval bash $3rd_script $x $y

    exec $4th_script 30

    ```


    ## Creating Menus


