- fmt: "\n# Bash Shell Decision Making\n\nIn this section, I am going to discuss bash\
    \ shell decision-making in Linux. Given two paths in bash shell scripting, there\
    \ are situations where you need to adopt a single path out of the choice of two.\
    \ Conditional statements are used that allow your program to make the right decisions\
    \ and perform the correct actions. Linux Bash Shell promotes conditional statements\
    \ based on distinct actions that are used to conduct distinct actions. We have\
    \ mainly two bash statements used in making decisions:\n\n* The bash `if...else`\
    \ decision statement\n* The bash `case...esac` decision statement\n\n## The Bash\
    \ if...else Decision Statements\n\nFor decision making in bash, we use `if...else`\
    \ which can be used to choose an option from a number of given options. Linux\
    \ Bash Shell uses the following forms of `if…else` statement:\n\n* `if...fi` statement\n\
    * `if...else...fi` statement\n* `if...elif...else...fi` statement\n\nIn bash,\
    \ a number of the `if` statements use relational operators to check relations.\n\
    \n## Bash Case Statement\n\nThe bash `case` statement, also known as the `case…esac`\
    \ statement in bash scripting is a conditional flow statement used to replace\
    \ nested `if-elif` statements. The `case-esac` statement is a solid alternative\
    \ to the multi-level `if-then-else-fi` conditional flow statements. This method\
    \ of conditional flow enables the user to match a number of values against one\
    \ variable. Case statements handle multi-branch conditions more efficiently than\
    \ nested `if…elif` statements. We have the `case…esac` illustration below:\n\n\
    ```bash\ncase $var_name in\ncondition01)\n    command01\n    ...\n    ...\n  \
    \  command0N\n    ;;\ncondition02)\n    command01\n    ...\n    ...\n    command\n\
    \    ;;\n*)\nesac\n```\n\nThe `case...esac` statement in bash shell looks very\
    \ similar to the `switch...case` statement used in traditional programming languages\
    \ like `Java` or `C++` and PERL.\n\n## Bash Loop Constructs\n\nBash scripting\
    \ utilizes similar programming constructs used in our traditional programming\
    \ languages like `Java` and `C++`. Bash uses Loops to take a series of commands\
    \ and keep executing them until a certain condition. Looping constructs are utilized\
    \ mainly to automate repetitive and routine tasks in Linux. There are mainly three\
    \ loop structures used in bash scripting namely; `while`, `until` and `for` loops.\n\
    \n### Nesting Loops in Bash\n\nBash allows the use of loops inside other loops,\
    \ a process called nesting. In essence, a user can put a `while` loop inside another\
    \ `while` loop.\n\n#### While Loop Nesting\n\nWe can place a `while` loop inside\
    \ another `while` loop when we are creating our bash scripts as illustrated below.\n\
    \nSyntax:\n```bash\nwhile commandname01 ; # this is the outer loop\ndo\n    Statement(s)\
    \ to be executed if commandname01 holds true\n    while commandname02 ; # this\
    \ is the inner loop\n    do\n        Statement(s) to be executed if commandname02\
    \ holds true\n    done\n    Here put Statement(s) to be executed if commandname01\
    \ holds true\ndone\n```\n\nExample: This is an example of nested loop. Let's add\
    \ another countdown loop inside the loop that is to count up to seven:\n\n```bash\n\
    #!/bin/sh\nx=0\nwhile [\"$x\"-lt 8]\n# this is the outer loop\nloop1\ndo\n   \
    \ y=\"$x\"\n    while [\"$y\"-ge 0]\n    # this is the inner loop loop2\n    do\n\
    \        echo -n \"$y \"\n        b=`expr $y - 1`\n    done\n    a=`expr $x +\
    \ 1`\ndone\n```\nThis script will produce the result below. Please note how `echo\
    \ -n` functions here. The `-n` option ensures that the `echo` command does not\
    \ print the command line new line symbol.\n\n## Bash Loop Control\n\nThe upcoming\
    \ section is a discussion of bash control structures for looping for example `break`\
    \ and `continue` statements. We have looked at creating loops and working with\
    \ loops to automate different jobs. There are instances when you should exit a\
    \ loop or jump over some parts of the loop. At such instances, we use the `break`\
    \ and `continue` statements to control looping.\n\n### The Break Statement\n\n\
    The Linux `break` statement is a bash shell construct that is used to stop an\
    \ entire conditional loop from execution after finishing the execution of all\
    \ code units leading up to the `break` statement. When the loop finishes, it steps\
    \ through to the other sections of the code.\n\nBreak Statement Syntax:\n```bash\n\
    break\n```\nWe use the example above to exit from nested loops. `break n`\nAbove\
    \ the argument, `n` represents the n th enclosing loop to be exited from.\n\n\
    Break Statement Example: Below is an example that shows a loop terminating as\
    \ soon as `x` becomes 8 –\n\n```bash\n#!/bin/sh\nx=0\nwhile[ $x-lt 10]\ndo\n \
    \   echo $x\n    if[ $x-eq 8]\n    then\n        break\n    fi\n    a=`expr $x\
    \ + 1`\ndone\n```\n\nWe have the nested loop example below. The bash script below\
    \ shows us that the program code exits out of the first and second loops if `varname1`\
    \ equals 13 and `varname2` equals 10 –\n\n```bash\n#!/bin/sh\nfor varname1 in\
    \ 123 4 5 6 7\ndo\n    for varname2 in 09\n    do\n        if[ $varname1 -eq 13]\
    \ -a [ $varname2 -eq 10]\n        then\n            break 13\n        else\n \
    \           echo \"$varname1 $varname2\"\n        fi\n    done\ndone\n```\n\n\
    ### Bash Continue Statement\n\nBash looping control `continue` statement is the\
    \ same as the `break` statement. The `continue` statement is used to exit the\
    \ current code iteration of a `for`, `until`, `while` and `select` loop whereas\
    \ the `break` statement is used to exit the whole loop. When `continue` is used\
    \ in a `for` loop, the variable gets the value of the next element. The bash `continue`\
    \ statement is utilized when an error has occurred within a loop, but the user\
    \ still needs to execute the next code iteration.\n\nContinue Statement Syntax:\n\
    ```bash\ncontinue\n```\nThe `continue` command above just jumps the current iteration\
    \ within the same loop and executes the next iteration. We pass integer arguments\
    \ to the `continue` statement to enable jumping of commands to the next iteration\
    \ inside the nested loops just like with the `break` statement. `continue N`\n\
    The `continue` command above shows `N`, which represents the Nth enclosing loop\
    \ to continue from. The `continue N` exits all remaining iterations at the loop\
    \ level and continues at the loop `N` levels above.\n\nExample: The example below\
    \ shows that the `continue` statement exits from the `if…then` statement and begins\
    \ to process the next `echo` statement:\n\n```bash\n#!/bin/sh\nNUMBERS=\"8 9 10\
    \ 11 12 13 14\"\nfor NUMBERS in $NUMBERS\ndo\n    Z=`expr $NUMBER % 2`\n    if[\
    \ $Z-eq 0]\n    then\n        echo \"Our result is an even number!!\"\n      \
    \  continue\n    fi\n    echo \"Our result is an odd number\"\ndone\n```\n\n##\
    \ Bash Variable Substitution\n\n| Serial | Escape & Description |\n| :--- | :---\
    \ |\n| 1 | `\\\\` The Backslash escape sequence |\n| 2 | `\\a` The alert (BEL)\
    \ escape sequence |\n| 3 | `\\b` The Backspace escape sequence |\n| 4 | `\\c`\
    \ This is the suppress trailing newline escape sequence |\n| 5 | `\\f` This is\
    \ the form feed escape sequence |\n| 6 | `\\n` This is the new line escape sequence\
    \ |\n| 7 | `\\r` This is the carriage return escape sequence |\n| 8 | `\\t` This\
    \ is the horizontal tab escape sequence |\n| 9 | `\\v` This is the vertical tab\
    \ escape sequence |\n"
