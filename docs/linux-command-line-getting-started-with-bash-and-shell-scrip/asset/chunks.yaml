  trans: "\n下面的结果显示了执行命令 `commandlinescript.sh` 的输出，该脚本提供了两个命令行参数：`name=\"James Jones\"\
    ` 和 `mark=83`。这两个命令行参数被脚本拆分，生成的两个值显示在屏幕上。\n\n```bash\nroot@bakyrie:~# vim commandlinescript2.sh\n\
    root@bakyrie:~# chmod u+x commandlinescript2.sh\nroot@bakyrie:~# ./commandlinescript2.sh\
    \ name=\"James Jones\" mark=83\nYour argument values are: name=James Jones mark=83\n\
    The Student’s name is James Jones\nThe obtained mark is 83\nroot@bakyrie:~#\n\
    ```\n\n# 执行算术运算\n执行算术运算是许多编程语言的共同需求。Bash 执行算术运算的方式与其他标准编程语言不同。Bash 中的算术运算可以通过多种方式实现。本节展示了算术运算的简单方法之一。\n\
    \n我们将创建一个名为 `arith_script.sh` 的 bash 文件，内容如下。该示例脚本演示了如何执行四种基本类型的算术运算。我们将在脚本开头使用双括号\
    \ `(( ))` 来展示简单的加法和除法运算。加法和除法运算符两侧是操作数，即双括号内的数字。在加法和除法运算之后，我们将进入预自增操作，如下所示。最后，在脚本的最后部分演示了使用简写符号进行递增。\n\
    \n```bash\narithmetic_script.sh\n#!/bin/bash\n\n# 执行求和运算\nresult=$((60+150))\n\
    \n# 在屏幕显示加法结果\necho \"Addition = $result\"\n\n# 对数值进行除法\nresult=$((150/25))\n\n\
    # 在屏幕显示除法结果\necho \"division = $result\"\n\n# 给 X 赋值\nX=10\n\n# 执行预自减\n((--X))\n\
    \n# 打印 X 的值\necho \"Value after decrement = $X\"\n\n# 使用简写运算符\n(( X += 10 ))\n\
    \n# 打印 X 的值\necho \"Value after adding 10 = $X\"\n```\n\n从上面可以看出所有的算术运算都是通过双括号执行的。我们也可以使用\
    \ `let`、`expr` 和 `bc` 命令在 bash 中进行算术运算。\n\n# 操作 Bash 字符串\nbash 中的字符串数据可以执行许多类型的任务。例如如字符串拼接、字符串比较、字符串拆分、字符串大小转换等。与其他标准编程语言不同，bash\
    \ 没有内置的字符串函数来执行字符串操作。本书的这一章节讨论了一些常见的字符串处理。\n\n## 字符串拼接\n字符串拼接是将两个或多个字符串相加的过程。在\
    \ bash 中，字符串通过在一个字符串后追加另一个字符串来连接。我们可以创建一个包含以下脚本的 bash 文件来展示字符串的使用。我们将初始化两个字符串变量，并在合并这两个变量后显示它们。示例显示\
    \ `$stringcat01` 和 `$stringcat02` 的内容将被合并并打印。\n\n```bash\nstringconcat.sh\n#!/bin/bash\n\
    \n# 初始化第一个字符串变量\nstringcat01=\"This user \"\n\n# 初始化第二个字符串变量\nstringcat02=\"Loves\
    \ Bash Scripting\"\n\n# 显示输出\necho \"$stringcat01$stringcat02\"\n```\n从上面可以看出所有的算术运算执行：\n\
    ```bash\nroot@bakyrie:~# vim stringconcat.sh\nroot@bakyrie:~# chmod u+x stringconcat.sh\n\
    root@bakyrie:~# ./stringconcat.sh\nThis user Loves Bash Scripting\n```\n\n## 字符串比较\n\
    为了进行字符串比较，bash 使用独特的运算符。我们将创建一个包含以下脚本的 bash 文件来演示如何比较字符串。在 `compare.sh` 中，如果输入匹配，则会显示一条消息。\n\
    \n```bash\ncompare.sh\n#!/bin/bash\necho \"Enter any string\"\nread text\n\n#\
    \ 检查输入是否为 Python\nif [ \"$text\" == \"Python\" ]; then\n    echo \"You can program\
    \ Python\"\nelse\n    echo \"You can program PERL\"\nfi\n```\n\n## 字符串拆分\nbash\
    \ 没有内置的函数来拆分字符串。然而，使用 `IFS` 变量，我们可以将文本拆分为数组。我们创建一个包含以下脚本的 bash 文件来展示如何拆分文本数据。\n\
    \n```bash\nstringsplit.sh\n#!/bin/bash\n# 输入文本字符串\necho \"Please input a text\
    \ string\"\nread text\n\n# 设置空格分隔符\nIFS=' '\n\n# 将文本拆分为数组\nread -a str_array <<<\
    \ \"$text\"\n\n# 打印数组的每个元素\nfor value in \"${str_array[@]}\"; do\n    printf \"\
    %s\\n\" \"$value\"\ndone\n```\n\n## 转换大小\n大多数脚本语言都有内置功能来更改字符串的大小。但使用 `tr` 命令或\
    \ `^^` 符号可以更改字符串数据。下面的示例演示了如何将字符转换为大写和小写。\n\n```bash\ncase.sh\n#!/bin/bash\n#\
    \ 初始化第一个文本字符串\ntext1='james@company.com'\n\n# 通过将所有字符转换为大写来打印 $text1 的值\necho\
    \ \"${text1^^}\"\n\n# 初始化第二个文本字符串\ntext2='Bash scripting basics'\n\n# 通过将所有大写转换为小写来打印\
    \ $text2\necho $text2 | tr [:upper:] '[:lower:]'\n```\n\n# 通过循环读取字符串数据\n任何编程语言的字符串数据都可以视为字符数组。在本书的这一节中，我们讨论了如何使用\
    \ `for` 循环读取文本字符串数据。创建一个包含内容的 bash 脚本文件，使用循环读取文本字符串的每个部分。\n\n```bash\nreadstring.sh\n\
    #!/bin/bash\n# 使用 for 循环读取每个字符串\nfor value in Bash Programming for the Beginners\n\
    do\n    echo $value\ndone\n```\n"
- fmt: "\n```bash\nif [[ $x -le 100 ]]\nthen\n    exit 0\nelse\n    exit 1\nfi\n```\n\
    \n`fisecondscript.sh`\n```bash\n#!/bin/bash\n#Run the bash file , firstscript.sh\n\
    bash \"first.sh\"\n\n#Check if the return code is equal to 1\nif [ $? -eq 1 ]\n\
    then\n    echo \"The number you entered is greater than 100\"\nelse\n    echo\
    \ \"The number you entered is less than or equal to 100\"\nfi\n```\n\n### Output:\
    \ Run the script.\n`bash secondscript.sh`\n\nThe following output will appear\
    \ when the script is executed and passed the values 56 and 110 one at a time.\n\
    \n```bash\n[root@bakyrie:~]# vim firstscript.sh\n[root@bakyrie:~]# chmod u+x firstscript.sh\n\
    [root@bakyrie:~]# vim secondscript.sh\n[root@bakyrie:~]# chmod u+x secondscript.sh\n\
    [root@bakyrie:~]# ./secondscript.sh\nPlease enter a number\n56\nThe number you\
    \ entered is less than or equal to 100\n[root@bakyrie:~]#\nroot@bakyrie:~# ./secondscript.sh\n\
    Please enter a number\n110\nThe number you entered is greater than 100\nroot@bakyrie:~#\n\
    ```\n\n### Bash reads and writes to files\nBash script should be able to read\
    \ from and to write to files as a basic requirement. As with all other mainstream\
    \ programming languages, Bash has no built-in function to read from and to write\
    \ to files. There are several methods in bash to read from a file. One of the\
    \ most popular methods to read from or write to a file in bash is using the bash\
    \ `cat` command, also known as the concatenate command. The `cat` command is primarily\
    \ used to read the file's entire content. We can use the looping and `read` command\
    \ to read the bash file line-by-line. Using the redirect operator, `>` greater-than\
    \ symbol, it is essential to write data to bash files. We can also use the double\
    \ greater-than symbol `>>` symbol to append more contents to any bash file.\n\n\
    ### Reading file in bash\nWe are going to create a bash file with the following\
    \ bash script to read an existing file called `hardwarefile.txt`. The contents\
    \ of this hardware file are given below. In the bash script, the entire contents\
    \ of the file are read by the `cat` command first and next; the `while` loop is\
    \ used to read the bash file line by line.\n\n**hardwarefile.txt**\n```\nDvdRom\n\
    RAM\nMonitor\nKeyboard\nMouse\nScanner\nPrinter\n```\n\n`readfilescript.sh`\n\
    ```bash\n#!/bin/bash\necho \"Reading the hardwarefile.txt file using cat command\"\
    \n# Read the content of the file using `cat` command\ncontent=`cat hardwarefile.txt`\n\
    echo $content\n\necho \"Reading the file line line using loop\"\n# Assign the\
    \ filename\nfilename='hardwarefile.txt'\n# Each line of the file will be read\
    \ by each iteration of the loop\nwhile read line;\ndo\n    # print the line\n\
    \    echo $line\ndone<$filename\n```\n\n### Output: Run the following commands.\n\
    ```bash\n$ cat hardwarefile.txt\n$ bash readfilescript.sh\n```\nFrom the illustration\
    \ above the first command will display the contents of the file, `hardwarefile.txt`\
    \ without running any bash script and the second command will run the script of\
    \ `readfilescript.sh` and print the content of the file for two times by using\
    \ `cat` command and `read` command with `while` loop.\n\n```bash\nroot@bakyrie:/home/ppeterszw#\
    \ cd\nroot@bakyrie:~# vim hardwarefile.txt\nroot@bakyrie:~# vim readfilescript.sh\n\
    root@bakyrie:~# cat hardwarefile.txt\nDvdRom\nRAM\nMonitor\nKeyboard\nMouse\n\
    Scanner\nPrinter\nroot@bakyrie:~# chmod u+x readfilescript.sh\nroot@bakyrie:~#\
    \ ./readfilescript.sh\nReading the hardwarefile.txt file using cat command\nDvdRom\
    \ RAM Monitor Keyboard Mouse Scanner Printer\nReading the file line by line using\
    \ loop\nDvdRom\nRAM\nMonitor\nKeyboard\nMouse\nScanner\nPrinter\nroot@bakyrie:~#\n\
    ```\n\n### Writing File in Bash\nThe bash script created below in the bash file\
    \ is used to write new content in a new empty file and append data in the file\
    \ if it has content already.\n\n`writefilescript.sh`\n```bash\n#!/bin/bash\necho\
    \ \"Please enter any text\"\n#Read data\nread string1\n#Add input into the file\
    \ for the first time\necho $string1 > testfile.txt\n\necho \"Please enter some\
    \ text\"\n#Read another string\nread string2\n#Append some data at the end of\
    \ the file\necho $string2 >> testfile.txt\n\n#Show the full content of the file\n\
    cat testfile.txt\n```\nThe following output will be displayed after running the\
    \ script.\n```bash\nroot@bakyrie:~# vim writescript.sh\nroot@bakyrie:~# chmod\
    \ u+x writescript.sh\nroot@bakyrie:~# ./writescript.sh\nPlease enter any text\n\
    Please enter some text\n```\n\n### Piping in Bash\nA shell pipe is a way to connect\
    \ the output of one command to the input of another without using temporary files.\
    \ The syntax is `command1 | command2`. The pipe symbol `|` is used to chain commands.\
    \ The output of the first command is passed as the input of the second command.\n\
    \n- The pipe symbol `|` is used to chain commands.\n- The output of the first\
    \ command is passed as the input of the second command.\n- The pipe symbol `|`\
    \ is used to filter the output.\n\nThe example above shows that `student_marks.txt`\
    \ has the following output.\n\n**student_marks.txt**\n```\nDaina 109\nDavid 104\n\
    Sarah 101\nSusan 104\n```\n"
