    ### Options


    | `-w, --wildcard` | This option parses and Interprets each of the keywords as
    a string pattern with all the shell-style wildcards or meta characters. Each of
    the keywords will be matched against the existing page names and the manual page
    descriptions individually. If the argument `--exact` is also utilised, then output
    result match will only be located if the expanded keyword string or pattern matches
    the whole description or Linux manual page name. Otherwise, the keyword is also
    allowed to match on word boundaries in the description. |

    | `-e, --exact` | With this option each keyword will be matched exactly against
    the manual page names and the ensuing manual page descriptions. |

    | `-a, --and` | This option only outputs the items that match all the given keywords
    . The default output result is to display all items matching any keyword . |

    | `-l, --long` | This option ensures that we do not trim the result to fit the
    terminal console width. In most normal cases, the output will be trimmed to fit
    the terminal width to avoid malformed results from badly-written manual pages’
    NAME sections. |

    | `-s list , --sections list , --section list` | This option only searches the
    given manual pages sections. The given list is a colon- or comma-separated list
    of manual pages sections. If an entry in the manual pages list is a page section,
    for example "4 ", then the listed output of descriptions will show all the pages
    in sections "4 ", "4python ", "4x " etc; whilst if a listing shows an extension,
    for instance "5perl ", then the resulting list will include pages only in that
    exact part of the section of the manual. |

    | `-m system [ ,...], --systems=system [ ,...]` | This option is used to search
    in the other operating system that the user has access to. For instance, to filter
    the manual page descriptions of an operating system called "MacOS", we use the
    option `-m MacOS`. The specified system can be a combination of comma-separated
    names of operating systems. |

    | `-M path , --manpath=path` | This option is used to specify an alternate set
    of colon-separated manual page tree to filter. By default the `$MANPATH` environment
    variable is used by `apropos`, unless it’s empty or not unset, in which case it
    will determine an appropriate "manpath" based on your `$PATH` environment variable.
    This `-M` option overrides the contents of `$MANPATH`. |

    | `-L locale , --locale=locale` | The `apropos` command normally determines the
    current system locale by making a call to the C procedure called `setlocale` which
    searches various environment variables, possibly including `$LC_MESSAGES` and
    `$LANG`. We may temporarily override the determined value using the `-locale`
    option. This option is used to supply a locale string to `apropos` command. Note
    that locale option does not take effect until the search for the manual pages
    actually starts. Result such as the help message will always be output in the
    initially set locale. |

    | `-C file , --config-file=file` | Use this user configuration file rather than
    the default of `~/.manpath`. |

    | `-h, --help` | This option helps in displaying a help message and exit. |

    | `-V, --version` | This option shows the version information. |


    ### Environment


    | Variable | Setting |

    | :--- | :--- |

    | `SYSTEM` | Setting the `$SYSTEM` environment variable, has the same effect as
    if it this variable was specified as the argument to the `-m` option. |

    | `MANPATH` | Setting the `$MANPATH` environment variable, will have its value
    interpreted as the colon-separated manual page tree search path. |

    | `MANWIDTH` | Setting the `$MANWIDTH` environment variable, makes sure that the
    value is used as the terminal width (as discussed in the `--long` option). If
    this variable is not set, the terminal console width will be calculated using
    `ioctl` if it is available, the value of the `$COLUMNS` environment variable ,
    or it falls back to the default 80 characters if all else fails. |

    | `POSIXLY_CORRECT` | If this environment variable called the `$POSIXLY_CORRECT`
    is set, to a null value, the default `apropos` search will be an extended regular
    expression (`-r`). |

