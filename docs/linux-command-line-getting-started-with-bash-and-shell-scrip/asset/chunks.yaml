    * [References](#part0012.xhtml)\n\n## Preface\nLinux is one of the most dominant\
    \ and adaptable operating systems globally. Linux operating system is utilized\
    \ in many areas of Computer Science, ranging from embedded to smart devices. This\
    \ Operating system is utilized in High-Performance Computers, servers that are\
    \ running the global infrastructure services like smartphones, tablets, and televisions.\
    \ The Operating System is distributed with intuitive and modern graphical interfaces,\
    \ which are customized to the distribution of Linux in use ranging GNOME to KDE.\
    \ On any Linux computer, the shell is the most powerful way of interacting with\
    \ the operating system. Commands are a set of instructions sent to the Linux kernel\
    \ to tell the computer what to do. The Linux shell can also execute and interpret\
    \ commands from a written file called a bash script, which enables easy automation\
    \ of tasks. Many System administration tasks are routine and repetitive that need\
    \ to be automated for example like sending alerts, and performing routine maintenance.\
    \ This book contains beginner information about the Linux command line, shell\
    \ and bash scripting. The book introduces the novice user to basic scripting skills\
    \ to automate and perform a number of System tasks in Linux range from parsing\
    \ and interpreting text, to networking operation. The Linux shell is only as powerful\
    \ as the user intends it to be. Linux experts feel the power of shell scripting\
    \ since they use the shell to do large automation. Linux Command Line gives you\
    \ these magical capabilities!\n\n## What This Book Covers\nThis book is an immersive\
    \ introduction into the Linux Operating system, how to configure the shell and\
    \ the Linux environment and to write basic/shell scripts.\n\n### Chapter 1: Introduces\
    \ the reader to Linux Command Line\nThe concepts will detail the different types\
    \ of shells that exist and mainly focus on BASH as the shell of choice. The chapter\
    \ will also feature an immersive rundown of Linux Commands and how to start with\
    \ BASH.\n\n### Chapter 2: Details usage scenarios of BASH that users may meet\
    \ in Systems Administration\nThis chapter will look at Redirection Basics, shell\
    \ environment basics with an introduction to the VI editing tool.\n\n### Chapter\
    \ 3: Introduces File searching and archiving\nThis chapter will also discuss Linux\
    \ operations to find duplicate files and enumerating words in a file.\n\n### Chapter\
    \ 4: Looks at introducing our users to the basics of writing scripts and starting\
    \ out with writing their first Bash script\n\n## How to Use This Book\nThis book\
    \ is written as a Linux Command Line and Bash scripting Primer, teaching the user\
    \ how to handle B shell scripting. You should go through the chapters in sequence.\
    \ You may choose to skip some chapters if you are reasonably comfortable with\
    \ the concepts covered in it.\n\n## Prerequisites\nTo comfortably use this book,\
    \ the main expectation is that you have a working Linux Server installation in\
    \ either CentOS 7 or Ubuntu 18.4. You can get this in one of two ways:\n\n1. Install\
    \ Linux on an (Oracle Virtual Box) virtual machine.\nYou are expected to install\
    \ your distribution of choice, either CENTOS 7 or Ubuntu 18.4. I will explain\
    \ the steps to install Centos 7 in this book. The rest of the book will be dealing\
    \ with commands, which work on all Linux variants. Setup your Virtual Machine\
    \ with 2GB RAM and 20GB Hard drive.\n2. Using a Live CD on your Laptop/Desktop\n\
    Linux distributions like CentOS/Ubuntu can be run directly from a USB flash drive\
    \ or CDROM/DVDROM with no installations on your machine. To enable you to use\
    \ a LIVE CD you have to change your BOOT Order in BIOS settings to allow you to\
    \ BOOT from either CDROM or USB Flash drive first. After booting using your Live\
    \ CD, go through the rest of the book and follow along with the commands. Much\
    \ of the material in this book is \"practical,\" so jump in and get your hands\
    \ dirty.\n\n## Introduction\nThe Linux operating system's history can be traced\
    \ from early LINUX systems that were freely distributed to educational institutions\
    \ like colleges and universities in the USA. Initiatives like the Berkeley Software\
    \ Distribution (BSD) put in some work on the operating systems. The Free Software\
    \ Foundation helped make many of the parts required to fully develop a LINUX-like\
    \ operating system that is free of charge. The last major component to be delivered\
    \ was the Linux kernel developed by a Finnish student called Linus Torvalds around\
    \ 1990 and with online collaboration from many Linux enthusiasts the Linux Kernel\
    \ is what it is today.\n\nThis is a beginner Linux bash-scripting book that is\
    \ going to introduce the Linux Operating System and explain why people use the\
    \ Operating System over other proprietary systems. In this section, I will start\
    \ by introducing our reader to what an Operating system is. I will detail the\
    \ functions of an operating system, before introducing Linux and putting together\
    \ the advantages and disadvantages of using Linux.\n\n## What is an Operating\
    \ System?\nAn operating system is a computer hardware and software management\
    \ program for users. Originally, operating systems were built to conduct repetitive\
    \ hardware duties that focused on file management, running programs, and receiving\
    \ user instructions. Using a user interface, the operating system communicates\
    \ with the hardware to execute that instruction. To execute a job, you only need\
    \ to submit an instruction to the operating system. There are many functions that\
    \ are performed by the operating system, but the main purpose of the operating\
    \ system is to provide an interface between the User and the Computer System.\n\
    \n### Resource Manager\nThe Linux Operating System, like any other OS, is a Resource\
    \ Manager. This means that it manages all Resources that are attached to the system\
    \ such as Memory and Central Processing Unit. The operating system will determine\
    \ when the CPU will perform operation.\n\n### Process Management\nThe operating\
    \ system always keeps track of processes running on your computer. The OS keeps\
    \ track of various procedures and decides which process has access.\n\n### Hardware\
    \ Management\nDuring Linux System Boot up process, the Computer performs POST\
    \ (Power-On Self-Test) which is a process that operator finds out the hardware\
    \ components currently attached to the Computer (CPU, hard drive, and network\
    \ cards) and loads device drivers and modules.\n\n### Memory Management\nMemory\
    \ management is the function where the operating system handles primary and extended\
    \ memory of the Computer. Memory management entails movement of system back and\
    \ forth between the main memory and secondary memory during execution. Memory\
    \ management also keeps track of all volatile memory places on the computer, irrespective\
    \ of whether they are assigned to some processor. Applications require RAM (random\
    \ access memory) and swap space (extended memory) to function.\n\n### File System\
    \ Management\nFile system constructs are either built-in into the operating system\
    \ or loaded as modules. In Linux, everything is viewed as a file from directories,\
    \ processes, and devices. The operating system plays a major part in controlling\
    \ who owns and has access.\n\n### User and Group Management\nSystem Administrators\
    \ in all major operating systems add, update, and delete user and group accounts\
    \ on their systems. Linux system facilitates the addition, deletion, and updating\
    \ of user and group accounts and managing related user group access permissions.\n\
    \n### Programming Tools\nThe operating system offers a number of programming tools\
    \ for developing programs and libraries to implement Application Interfaces that\
    \ allow Linux to connect with many other.\n\n## What is Linux?\nLinux is a solid,\
    \ lightweight and open-source operating system that has extensive development\
    \ tools, fully functional graphical interfaces (GUIs), and. Linux is one of the\
    \ twenty-first century's most eminent advances. In addition to its effect on huge\
    \ growth and its position as enabling technology, Linux operating system like\
    \ any other operating system is composed of Kernel, utilities, a graphical interface\
    \ (GUI) and application programs. The kernel is the heart of the system.\n\n###\
    \ The OS of Choice\nThe Linux operating system is very sturdy and crashes less\
    \ frequently. Linux installations continue functioning well even after many years.\
    \ Indeed, some users have setups that were installed once and had been running\
    \ without incident. Linux servers in many data centers have high uptime, and their\
    \ overall availability nears 99.9 percent. This sturdiness and high uptime have\
    \ resulted in the bulk of Internet running. ZDNET website estimates that a whopping\
    \ 96.3 percent of the best servers are running on Linux.\n\n### Disadvantages\n\
    (No content provided in source for this section)\n\n### Linux OS Advantages\n\
    Linux operating system has many advantages that make it a solid choice for server\
    \ and other system.\n\n### Powerful Command Line\nLinux distributions have a powerful\
    \ command line interface. The shell is also called the terminal, and affords users\
    \ a text-only interface.\n\n### High Security\nOperating system is known to be\
    \ very secure when it comes to avoiding viruses and malware. The major reason\
    \ for security comes from the fact source code is publicly accessible for review\
    \ since Linux is open-source. The developers of Linux had security in mind when\
    \ they were developing it.\n\n### Easy to Use\nLinux has increasingly become the\
    \ mainstream. Linux is now user-friendlier and has a simple and intuitive graphical\
    \ interface (GUI) that makes it useable even by novice users. Contrary to the\
    \ general view that Linux is only for geeks, it is now being used on laptops and\
    \ other gadgets. Someone used to Windows can now easily move and use Linux on\
    \ their Personal Computers. The GUI has evolved to the extent that, without understanding\
    \ any shell scripts or code, most of what typical users want can be accomplished\
    \ on Linux as readily as is done on Windows.\n\n### Flexible for Customization\n\
    Linux has gifted all its users, from beginners to advanced administrators, the\
    \ flexibility to change the look and feel of their environment to suit their requirements.\
    \ We have more than three desktop environments such as GNOME, KDE, Unity, Cinnamon,\
    \ and MATE. Linux has a large pool of alternative system and application programs\
    \ that users may select to install on their distributions.\n\n### Global Support\
    \ Available\nOver the Internet, there is a powerful Linux Open source community\
    \ that provides support for Linux through different forums. Any question posed\
    \ in forums will generally be answered quickly as many enthusiastic Linux volunteers\
    \ are online and working to fix the issues.\n\n### Easy to Maintain\nMaintaining\
    \ Linux involves regular updates to the programs running on the system. Systems\
    \ are regularly monitored and checked for vulnerabilities. Updating programs ensures\
    \ that bugs are fixed, new features are added, and vulnerabilities are plugged.\
    \ Linux is very easy to maintain even for beginner users. Experience users and\
    \ administrators are able to make central updates and program patches. Operating\
    \ systems need a way to check for vulnerabilities continuously. All Linux distributions\
    \ have their own central repositories, where program code is audited and tested\
    \ regularly for bugs and any reported issues, the software repositories are used\
    \ to keep the system up to date and safe. Linux distributions offer regular system\
    \ updates and no reboots are done after system updates. As a Linux user, it is\
    \ possible for you to schedule system updates at regular times. Bash scripts and\
    \ Linux Cron jobs are written to automate the processes of scheduling updates.\
    \ Efficient use of resources which include CPU and RAM. Linux uses the computer's\
    \ hardware resources effectively and efficiently. This efficiency means that you\
    \ can run your Linux installation on any piece of decent hardware. Linux systems\
    \ are running on a variety of architectures from low-specs computers to mobile\
    \ phones and smaller gadgets. Free to Use\nGetting a Linux operating system is\
    \ 100 percent free except for a few Enterprise Distributions, which charge for\
    \ Support like Red Hat and Canonical. Linux is totally free of charge; users can\
    \ download Linux and be good with decent skills. Linux has all the basic programs\
    \ required by a typical and expert user available. Businesses and Governments\
    \ can leverage the cost of the operating system and build robust infrastructure\
    \ at a significantly lower budget. Whole Internet ecosystems from DNS, DHCP, and\
    \ Communication are setup on Free Linux for free.\n\n 100 Percent Open Source\n\
    Linux is an operating system developed by a community of developers, and the source\
    \ code of this operating system is freely available for users to make contributions\
    \ through documentation, finding and fixing bugs. This community involvement means\
    \ that there are many eyes that are auditing and working on the system to make\
    \ it stable and error-free. Users are free to download the source code and modify\
    \ or even distribute it.\n\n## Can be Run on any Piece of Hardware\nLinux operating\
    \ systems have efficient use of resources, which include CPU and RAM. Linux uses\
    \ the computer's hardware resources effectively and efficiently. This efficiency\
    \ means that you can run your Linux installation on any piece of decent hardware.\
    \ Linux systems are running on a variety of architectures from low-specs computers\
    \ to mobile phones and smaller gadgets.\n"
