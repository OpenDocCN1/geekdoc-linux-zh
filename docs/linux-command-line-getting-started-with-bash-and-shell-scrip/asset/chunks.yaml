    # Bash 特殊变量


    | # | 变量及描述 |

    | :--- | :--- |

    | 1 | `$0` - 此变量显示当前脚本的文件名。 |

    | 2 | `$n` - 这些参数取决于调用脚本时参数的数量。变量 `n` 是一个非负整数，表示当前参数的位置（初始参数始终是 `$1`，后续参数是 `$2`，以此此类推）。
    |

    | 3 | `$#` - 此显示传递给 bash 脚本的参数计数。 |

    | 4 | `$*` - 在 linux 中，我们对所有参数进行双引号处理。如果我们向 bash 脚本输入两个参数，那么 `$*` 等于 `$1 $2`。
    |

    | 5 | `$@` - 我们对每个参数单独进行双引号处理。如果 bash 脚本接收两个参数，`$@` 的结果为 `$1 $2`。 |

    | 6 | `$?` - 上述变量是上一次执行命令的退出状态。 |

    | 7 | `$$` - 上述变量显示当前 bash shell 的进程 ID 号（PID）。对于所有 bash 脚本，`$$` 详细记录它们执行时的进程
    ID。 |

    | 8 | `$! ` - 此变量显示上一次执行的后台命令的进程 ID。 |


    ## Linux 终端参数


    Linux 命令行界面参数如 `$1`、`$2`...$...9` 被称为位置变量，$0` 变量指向我们正在执行的命令、程序、bash shell 脚本或
    bash 函数，而这里的特殊变量 `$1`、`$2` ... `$9` 作为参数传递给 bash 命令。


    下面的脚本使用了多个与命令行界面相关的特殊变量：


    ```bash

    #!/bin/sh

    echo "File Name: $0"

    echo "Initial Argument : $1"

    echo "Second Argument : $2"

    echo "Double Quoted Values: $@"

    echo "Double Quoted Values: $*"

    echo "The Total Count of our Arguments is: $#"

    ```


    下面显示的是上述脚本的运行示例：

    ```text

    [ppeters@rad-srv ~]$./peters_test.sh James Jones

    File Name : ./peters_test.sh

    Initial Argument : James

    Second Argument : Jones

    Double Quoted Values: James Jones

    Double Quoted Values: James Jones

    Total Count of our Arguments is: 2

    ```


    ## Bash 特殊变量 `$*` 和 `$@`


    Linux bash 有一些特殊变量，用于一次访问所有终端参数。除非将它们包含在 `""` 双引号中，否则变量 `$*` 和 `$@` 的输出结果相同。


    这两个变量指定终端参数。特殊变量 `"$*"` 将整组参数视为一个带有空格（分隔符）的单个参数，而特殊变量 `"$@"` 则取整个列表并将其拆分为不同的参数。要使用
    `$*` 或 `$@` 特殊变量处理未知数量的命令行参数，我们可以使用下面的 bash 脚本：


    ```bash

    #!/bin/sh

    for TOKEN in $*

    do

    echo $TOKEN

    done

    ```


    下面是上述 bash 脚本的运行示例：

    ```text

    [ppeters@rad-srv ~]$./peters_test.sh James Jones

    is OldJamesJonesisOld

    ```

    特别说明：`do...done` 是一种循环结构，稍后会详细介绍。


    ## Bash Shell 退出状态


    特殊变量 `$?` 代表之前执行的 bash 命令的退出状态。所有完成的命令返回的数值值称为退出状态。根据规则，所有成功的命令返回 `0` 退出状态，所有失败的命令返回一个退出状态。由于特定原因，某些命令返回额外的退出状态。例如，某些命令会区分错误类型并根据特定的失败类型返回不同的退出状态。


    下面是一个成功命令的示例：

    ```text

    [ppeters@rad-srv ~]$./peters_test.sh James Jones

    File Name : ./peters_test.sh

    Initial Parameter : James

    Second Parameter : Jones

    Double Quoted Values: James Jones

    Double Quoted Values: James Jones

    Total Count of Parameters : 2

    [ppeters@rad-srv ~]$./echo $?

    0

    [ppeters@rad-srv ~]$

    ```


    ## Bash 数组值


    在书的这一部分，我将讨论如何使用 bash shell 数组。能够存储单个值的 bash shell 变量，这些变量被称为标量（scalars）。bash
    shell 推广了一种独特的变量类型，称为数组变量。它可以同时持有多个值。数组为一组变量提供了一种分组技术。你可以使用单个数组变量，而无需为存储所有其他变量所需的每个变量创建新名称。在为数组命名时，适用于
    Shell 变量的所有命名规则均有效。


    ### 定义数组值


    数组变量和标量变量之间的区别可以描述如下。假设你正尝试用一组变量来描述不同学习者的名字。每个名字都是一个标量变量。


    ```bash

    ARR_NAME01="James"

    ARR_NAME02="Peter"

    ARR_NAME03="Martin"

    ARR_NAME04="Samson"

    ARR_NAME05="Linda"

    ```


    为了存储上述所有名称，我们可以使用数组。创建数组变量最简单的方法是遵循下面的示例。这允许为其中一个索引赋值值。


    ```bash

    arrayname[index]=value

    ```


    从上面可以看出，数组名称是 `arrayname`，index 是数组中需要设置的项的索引，value 是你想为该项设置的值。下面的示例：


    ```bash

    ARR_NAME[0]="James "

    ARR_NAME[1]="Peter"

    ARR_NAME[2]="Martin"

    ARR_NAME[3]="Samson"

    ARR_NAME[4]="Linda"

    ```


    使用 bash shell 初始化数组的语法所示：


    ```bash

    arrayname=(value01 ... valueN)

    ```


    ### 如何访问数组值


    设置数组变量后，你可以访问它，如下所示：


    `${arrayname[index]}`


    上面的数组名称是 `arrayname`，index 是要处理的值的索引。下面是访问数组值的示例：


    ```bash

    #!/bin/sh

    ARR_NAME[0]="James "

    ARR_NAME[1]="Peter"

    ARR_NAME[2]="Martin"

    ARR_NAME[3]="Samson"

    ARR_NAME[4]="Linda"

    echo "Indice One: ${ARR_NAME[0]}"

    echo "Indice Two: ${ARR_NAME[1]}"

    ```


    下面是执行上述 bash 脚本的 own：

    ```text

    [ppeters@rad-srv ~]$./peters_test.sh

    Index One: James

    Index Two: Peter

    ```


    下面是访问数组的替代方法：

    `${arrayname[*]}`

    `${arrayname[@]}`


    上面的数组名称是 `arrayname`。下面是说明如何访问数组的 bash 脚本：


    ```bash

    #!/bin/sh

    ARR_NAME[0]="James "

    ARR_NAME[1]="Peter"

    ARR_NAME[2]="Martin"

    ARR_NAME[3]="Samson"

    ARR_NAME[4]="Linda"

    echo "Our Method One: ${ARR_NAME[*]}"

    echo "Our Method Two: ${ARR_NAME[@]}"

    ```


    bash 脚本的 own：

    ```text

    [ppeters@rad-srv ~]$./peters_test.sh

    Our Method One: James PeterMartinSamsonLinda

    Our Method Two: James PeterMartinSamsonLinda

    ```


    ## Shell 运算符


    Linux 中的 Shell（特别是 bash）支持许多运算符。本节将详细讨论不同的运算符。最初 shell 并没有执行算术运算的机制；它使用了外部程序如
    `awk` 或 `expr`。


    下面的示例演示了如何相两个数字：


    ```bash

    #!/bin/sh

    val_add=`expr 5 + 9`

    echo "The Total added value is: $val_add"

    ```

    总加值为 14


    执行加法时需要考虑几点：● 运算符和表达式之间应该有空格。例如，`6+9` 是错误的；应该写成 `6 + 9`。● 算术加法表达式应该放在反引号中。


    ### 算术运算符


    下表显示了所有的算术运算符。假设变量 `x` 为 8，变量 `y` 为 15：


    下表显示了所有的 bash 算术运算符。


    | 运算符 | 描述 | 示例 |

    | :--- | :--- | :--- |

    | `+` (加法) | 该运算符将运算符两侧的值相加 | `expr $x + $y` 结果为 23 |

    | `-` (减法) | 该运算符从左值中减去右值 | `expr $x - $y` 结果为-7 |

    | `*` (乘法) | 该运算符计算 `*` 运算符两侧操作数的乘积 | `expr $x \* $y` 结果为 120 |

    | `/` (除法) | 该运算符将左值除以右值 | `expr $y / $x` 结果为 1 |

    | `%` (取模运算) | 该运算符将左值除以右值并返回余数 | `expr $y % $x` 将得到 7 |


    '
- fmt: '

    | Operator | Description | Example |

    | :--- | :--- | :--- |

    | `=` (Assignment) | This operator sets the value of the right side operand to
    the value of the left side operand | `y = $b` would set value of `y` into `x`
    |

    | `==` (Equality) | This operator Compares the value of two digits, and if both
    numbers have the same value then returns result true. | `[ $x == $y ]` gives result
    false. |

    | `!=` (Not Equality) | This operator Compares just two numbers, and if both numbers
    are different then returns true. | `[ $x != $y ]` gives result as true. |


    All conditional expressions should be enclosed in square braces as shown below
    `[ $x == $y ]` is correct whereas, `[$x==$y]` is incorrect. Long integers are
    used in all arithmetic calculations.


    ## Relational Operators


    Relational operators are supported in a bash shell, especially those that are
    specific to numbers. Relational operators do not work on strings. As an illustration,
    the following operators function to check the relation between 15 and 40 as well
    as in-between "15" and "40" but not in-between "fifteen" and "forty." Assuming
    that variable `x` holds 15 and variable `y` holds 40:


    | Operator | Description | Example |

    | :--- | :--- | :--- |

    | `-eq` | This operator determines if the given values are equal or not; if they
    are equal, then the condition is true. | `[ $x -eq $y ]` is false. |

    | `-ne` | This operator determines if the values of the two operands are equivalent;
    if the operands are not equivalent, then the condition is true. | `[ $x -ne $y
    ]` is true. |

    | `-gt` | This operator is used to determine if the value in the left operand
    is bigger than the value of operand to the right; if value is greater, then our
    condition returns true. | `[ $x -gt $y ]` is false. |

    | `-lt` | This operator Determines if the value of the left operand is less than
    the value of the right operand; if true, then the condition is true. | `[ $x -lt
    $y ]` is true. |

    | `-ge` | This operator determines if the value of the left operand is greater
    than or equal to the value of the right operand; if affirmative, then the condition
    becomes true. | `[ $x -ge $y ]` is false. |

    | `-le` | This operator tries to find out if the value of the left operand is
    less than or equal to the value of the right operand; if affirmative, then the
    condition becomes true. | `[ $x -le $y ]` is true. |


    In bash scripting all the conditional statements should be put inside spaced square
    brackets. For instance, this illustration `[ $x <= $y ]` is the correct format
    whereas, the following illustration `[$x <= $y]` is wrong.


    ## Boolean Operators


    Bash shell supports a number of Boolean operators as shown in the table below.
    Assuming variable `x` holds 20 and variable `y` holds 40:


    | Operator | Description | Example |

    | :--- | :--- | :--- |

    | `!` | This operator is called the logical negation. It inverts a condition into
    its opposite value. | `[ ! false ]` is true. |

    | `-o` | This operator is called the logical OR . If one of the two operands’
    value is true, then the condition is true. | `[ $x -lt 40 -o $y -gt 100 ]` is
    true. |

    | `-a` | This operator is called the logical AND . If both operands are true,
    then the condition returns true otherwise it is false. | `[ $x -lt 40 -a $y -gt
    100 ]` is false. |


    ## String Operators


    The Bash shell supports the following String Operators. Assuming variable `x`
    holds "def" and variable `y` holds "hij":


    | Operator | Description | Example |

    | :--- | :--- | :--- |

    | `=` | This is the equality operator used to check if the two operands’ values
    are the same that is equal; if they are equal, then the condition returns true.
    | `[ $x = $y ]` is false. |

    | `!=` | This NOT EQUAL operator is used to determine whether the value of our
    left operand is equal or not to the right operand; if the two operands’ values
    are not equal then the condition returns true. | `[ $x != $y ]` is true. |

    | `-z` | This ZERO operator is used to check if the given string operand’s size
    is zero; if the string has zero length, then it the conditional returns true.
    | `[ -z $x ]` is false. |

    | `-n` | This NON-ZERO operator checks if the input string’s operand size is non-zero;
    if the string is non-zero length, then the condition returns true. | `[ -n $x
    ]` is true. |

    | `Str` | This STR operator is used to determine if the input string str is not
    an empty string; if string entered or read is empty, then the condition returns
    false. | `[ $x ]` is true. |


    ## File Test Operators


    There are a number of operators that are used to test various properties associated
    with files in Linux. Assuming a variable `filename` holds an existing file name
    "peters_test" which is 200 bytes in size and has the following permissions read,
    write and execute :


    | Operator | Description | Example |

    | :--- | :--- | :--- |

    | `-b filename` | This block file operator is used to find out if the filename
    is a special block file; if it is, then our condition returns true. | `[ -b $filename
    ]` is not true. |

    | `-c filename` | This character operator is used to findout if the filename is
    a special character file; if it is true, then the condition returns true. | `[
    -c $filename ]` is not true. |

    | `-d filename` | This directory operator is used to determine if filename is
    a directory or not; if it is a directory, then our condition returns true. | `[
    -d $filename ]` is false. |

    | `-f filename` | This regular file operator is used to find out if filename is
    our regular linux file as opposed to a regular directory or another special file;
    if the filename is a regular file, then our condition returns true. | `[ -f $filename
    ]` is not false. |

    | `-g filename` | This SGID operator is used to find out if our filename has the
    SGID bit turned on. SGID stands for set group ID (SGID); if the bit is set, then
    our condition returns true. | `[ -g $filename ]` is not true. |

    | `-k filename` | This sticky bit operator is used to findout if our file called
    filename has their sticky bit set; if sticky bit is set, then our condition returns
    true. | `[ -k $filename ]` is not true. |

    | `-p filename` | This pipe operator is used to find out if the file with the
    name filename is a named pipe; if the file called filename is indeed a pipe, then
    our condition returns true. | `[ -p $filename ]` is not true. |

    | `-t filename` | This operator is used to findout if our file descriptor is open
    and also if it is associated with a linux terminal; if answer is yes, then our
    condition returns true. | `[ -t $filename ]` is not true. |

    | `-u filename` | This SUID operator is used to findout if the file called filename
    has the SUID bit set – SUID stands for set User ID; if bit is set, then our condition
    returns true. | `[ -u $filename ]` is not true. |

    | `-r filename` | This readable operator is used to findout if the file called
    filename is readable; if it readable, then our condition returns true. | `[ -r
    $filename ]` is not false. |

    | `-w filename` | This writable operator is used to findout if the file named
    filename is writable; if it is writable, then our condition returns true. | `[
    -w $filename ]` is not false. |

    | `-x filename` | This executable operator is used to findout if the file named
    filename is an executable file; if it is, then our condition returns true. | `[
    -x $filename ]` is not false. |

    | `-s filename` | This operator finds out if filename has size greater than 0;
    if yes, then condition becomes true. | `[ -s $filename ]` is not false. |

    | `-e filename` | This operator finds out if filename exists; is true even if
    file is a directory but exists. | `[ -e $filename ]` is not false. |

