    # 搜索工具深度解析


    ## 使用 Find 命令进行搜索


    最著名且经常使用的搜索命令行工具之一是 `Find Command`。Linux 的 `find` 命令是一个搜索和定位实用，它根据匹配给定参数的指定搜索字符串，显示文件和目录的路径。在
    bash 中，有多种用于搜索文件的条件，例如：按名称查找、按权限、用户、组、文件类型、修改和创建日期以及文件大小进行查找。本书将提供 `find` 命令最常见用例的实例说明。


    bash `find` 命令是一个用于遍历文件层次结构的命令行工具。该命令用于在文件系统中定位文件和目录，并对发现的文件执行后续操作。`Find` 命令支持按名称、目录、文件、所有者、修改和创建日期以及文件权限进行搜索。通过在使用
    `find` 命令时使用 `-exec` 选项，可以在找到的文件或文件夹上继继执行其他的 Linux bash 命令。


    ### Find 命令语法


    ```

    [ppeters@rad-srv ~]$find [search_path] [expression] [-options] [search_item]

    ```


    ### 使用名称或扩展名查找文件


    在 Linux 文件系统中，我们可以使用文件名或扩展名来搜索文件。下面的示例搜索了 `/home/ppeters/` 文件夹及其所有子文件夹中的 `*.star`
    文件：


    ```

    [ppeters@rad-srv ~]$find /home/ppeters/ -name "*.star"

    ```


    ## Linux Linux Find 命令和语法


    Bash find 语句具有以下语法：


    ```

    [ ppeters@rad-srv ~]$find options find_path statement

    ```


    - `options` 开关控制操作和 `find` 进程的优化技术。

    - `find_path` 特性定义了 `find` 开始搜索的位置，特别是在 Linux 根目录下查找搜索字符串。

    - 上述语法中的 `Statement` 控制所有过滤 Linux 目录树以输出结果的测试。


    请看下面的示例：


    ```

    [ppeters@rad-srv ~]$find –O2 -L /var/www/html -name "*.php"

    ```


    此 find 命令语句启用了最高级别的优化（`-O2`），并允许 `find` 命令跟随软链接（`-L`），软链接也称为符号链接。`find` 命令遍历整个
    `/var/www/html` 目录树，寻找以 `.php` 结尾的文件。


    ### Find 命令示例


    | 语句 | 作用 |

    | :--- | :--- |

    | `find / -name 1st_file.conf` | 在根目录及其子文件夹中搜索名为 `1st_file.conf` 的文件。 |

    | `find / -name *.png` | 在 `/` 目录及其子文件夹内搜索所有的 `.png` 图像或图片文件。 |

    | `find /etc -type f –empty` | 在 `/etc` 目录内搜索空文件。 |

    | `find / -user ppeters -mtime 3 -iname ".db"` | 搜索在过去 3 天内由用户 `ppeters` 修改过的所有
    `.db` 记录。 |


    ## Find 选项与优化


    `find` 命令的基本配置忽略了通俗的软链接（即符号链接）。使用 `find` 命令选项的 `-L` 开关允许结果为符号链接。通过其过滤技术，`find`
    命令提高了其执行效率。`Find` 命令行实用程序有三个性能阶段，即：`-O1` 第一阶段、`-O2` 第二阶段，以及第三阶段 `-O3`。默认的第一优化是
    `-O1`。该优化强制 `find` 命令在执行所有之前的测试之前，首先根据文件名进行结果搜索。名为 `-O2` 的优化级别优先搜索文件名，就像在级别-O1
    中一样。`-O2` 在处理额外的资源密集型任务之前，执行所有文件类型的搜索。优化级别 `-O3` 允许进行最深入的优化，并根据其相对成本和成功概率重新排列所有测试。


    ### Find 优化


    | 级别 | 详情 |

    | :--- | :--- |

    | 第一级 `-O1` | 第一级优化级别，它是默认值，初始过滤最初基于文件名。 |

    | 第二级 `-O2` | 这是 `find` 命令的第二级优化，它也从文件名开始初始搜索，然后转向文件类型。 |

    | 第三级 `-O3` | 这是 `find` 命令的第三级优化，允许根据资源的有效利用和固有的成功概率自动重新安排搜索。 |

    | `-maxdepth X` | 此开关对用户当前工作目录及其深 `X` 级的子目录进行搜索。 |

    | `-iname` | 此开关代表一个忽略大小写的过滤器。 |

    | `-not` | 使用带有 `-not` 开关选项的 `find` 命令确保显示不匹配测试用例的输出结果。 |

    | `-type f` | 此选项用于仅搜索所有文件。 |

    | `-type d` | 此开关用于仅搜索所有目录。 |


