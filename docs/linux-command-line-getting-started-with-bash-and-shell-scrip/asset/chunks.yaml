    | Name | File handle | Description | Abbrev |

    | :--- | :--- | :--- | :--- |

    | Standard input | 0 | This is the default data stream for terminal input. In
    the `bash` shell this defaults to the user’s keyboard input. | Stdin |

    | Standard output | 1 | This is the default data stream for output, as an example
    when a command displays or prints text. The default on the terminal is the user
    screen or console. | Stdout |

    | Standard error | 2 | This is the default data stream for output related to errors
    happening on the terminal. In the `bash` shell, it defaults to the user''s console
    or screen. | Stderr |


    ## Stderr


    We can use file descriptors to duplicate output. To duplicate terminal output
    to a file descriptor, we use the `>&` "greater than and ampersand" operator prefixed
    to the file descriptor number. Below is the example:


    ### Redirecting stdout result to the stdout (File Descriptor 1)

    ```bash

    [ppeters@rad-srv ~]$ echo"hi there people">&1

    hi there people

    ```


    ### Redirect stdout to stderr (File Descriptor 2)

    ```bash

    [ppeters@rad-srv ~]$ echo"hi there people">&2

    hi there people

    ```


    The example above is similar to redirecting output to a file, as we did a couple
    of examples before, `stdout` and the other descriptors are known as special files
    that require us to use `>&` instead of `>`. The output above looks similar, but
    the changes are clear when we start piping our output. Below is an example of
    what happens when redirections are done to `stdout` in comparison to when they
    are done to `stderr`.


    ### Redirect to the stdout, going through the redirection pipe

    ```bash

    [ppeters@rad-srv ~]$echo"some are redirections">&1 | sed"s/some/all/"

    all are redirections

    ```


    ### Redirect to the stderr

    ```bash

    [ppeters@rad-srv ~]$ echo“some are redirections”>&2 | sed"s/some/all/"

    all are redirections

    ```


    ## Common Use Cases for stderr, stdout, and stdin


    Example of redirecting combined output to a file:

    ```bash

    [ppeters@rad-srv ~]$./command file_name1 file_name2 file_name3 > log-filename
    2>&1

    [ppeters@rad-srv ~]$ cat log-filestderr file_name2stdout file_name1stdout file_name3

    ```


    ## Chapter Three: Files


    We will start with an introduction to file searching and a detailed look at the
    various search tools available. I will then discuss file archiving and the various
    ways of creating archives.


    There are six unique ways to search for files in the Linux command line, and each
    of the ways has its advantages. In this section of the book, we are going to look
    at the various search tools, namely; `locate`, `find`, `whatis`, `whereis`, and
    `apropos`. These tools have their unique features and merits; these search utilities
    are used for different purposes.


    Linux commands for searching and finding files are varied, and each command performs
    well at other areas than the other tools. This section will detail the various
    search commands and look at their strengths in searching. Below we will start
    with a very brief introduction to these search tools before we go into full details
    of each tool.


    ### A Basic Introduction to Search Tools


    Linux administrators may need to know the location of a file or directory on the
    filesystem but may not know where to find it. There are six bash commands that
    can be used to search for it, including `whatis`, `whereis`, `find`, `locate`,
    `apropos` and `which`.


    ### Introduction to Find


    Below is the syntax of the `find` command:


    ```bash

    [ppeters@rad-srv ~]$find search_path search_pattern

    ```


    If the path for the file is not specified, the search when using `find` begins
    in the user''s current working directory and searches down into all the sub folders.
    The `find` command has many options which are reviewable through use of the `find`
    manual pages. The manual pages for the `find` command are found by entering `man
    find` at the bash terminal. The most utilized option is the `-name`, which directs
    our `find` command to look for files and directories with the specified string
    in their name.


    ```bash

    [ppeters@rad-srv ~]$ find / -name file_name

    ```


    The illustration of the `find` command above is a search for files in the root
    directory `/` with the name `"file_name"` string in their search pattern.


    ### The Locate Command


    The command `locate`’s syntax is:


    ```bash

    [ppeters@rad-srv ~]$locate search_pattern

    ```


    The `locate` command enables us to see each file or folder that has the `search_pattern`
    string contained in the file or directory name. To locate a file or folder with
    search pattern `"finger,"` enter the following statement:


    ```bash

    [ppeters@rad-srv ~]$locate pwd

    ```


    The `bash` `locate` command makes use of the `slocate` data store to search for
    files and folders with the search pattern string `"finger"` in their names. The
    `locate` command searches for strings patterns faster when the `locate` database
    is recent. That `locate` database is scheduled for auto-updates by running a `cron`
    task every night. In Linux `cron` job is a small utility that executes in the
    terminal background, executing a variety of scheduled responsibilities, for instance,
    making `locate` database updates at 6 am every morning. The updated `b` command
    refreshes the `slocate` database on the command line interface.


    ### Which, Whatis and Whereis Search Tools


    #### The Which Command


    Below is the syntax of the command:


    ```bash

    [ppeters@rad-srv ~]$which command_name

    ```


    The above `which` statement returns the path of the binary, or executable, `bash`
    commands.


    ```bash

    [ppeters@rad-srv ~]$which cd/usr/bin/cd

    [ppeters@rad-srv ~]$

    ```


    The illustration of the `which` command above displays `/usr/bin/cd`.


    #### The Whereis Command


    Below is the syntax of the `whereis` command:


    ```bash

    [ppeters@rad-srv ~]$whereis command_name

    ```


    The `whereis` command illustration below returns the paths of the `find` command,
    the binary file of the `find` command, the location of the source code, and the
    location of the `find` man page.


    ```bash

    [ppeters@rad-srv~]$whereis find/usr/bin/find /usr/share/man/man1p/find.1p.gz /usr/share/man/man1/find.1.gz

    [ppeters@rad-srv ~]$

    ```


    #### The Whatis Command


    The syntax of the `whatis` command:


    ```bash

    [ppeters@rad-srv ~]$whatis command_name

    ```


    The `whatis` command above displays details about the `command_name` from the
    command''s man pages.


    ```bash

    [ppeters@rad-srv ~]$whatis lp

    ```

