    ## 第三章：文件


    我们将开始介绍文件搜索以及各种搜索工具。然后我将讨论文件归档以及创建归档的各种方法。


    在 Linux 命令行中有六种独特的搜索文件方法，每种方法都有其优势。在本书的这一节中，我们将查看各种搜索工具，即 `locate`、`find`、`whatis`、`whereis`
    和 `apropos`。这些工具具有独特的特性和优点；这些搜索程序用于不同的用途。


    Linux 用于搜索和查找文件的命令多种多样，每种命令在其他工具之外的领域也表现良好。本节将详细介绍各种搜索命令，并查看它们在搜索方面的优势。在进入每个工具的细节之前，下面我们将先对这些搜索工具进行简短的介绍。


    ### 搜索工具基础介绍


    Linux 管理员可能需要知道文件或目录在文件系统的位置，但可能不知道去哪里找到它。有六个 bash 命令可以用于搜索，包括 `whatis`、`whereis`、`find`、`locate`、`apropos`
    和 `which`。


    ### Find 介绍


    下面是 `find` 命令的语法：


    ```bash

    [ppeters@rad-srv ~]$find search_path search_pattern

    ```


    如果未指定文件路径，使用 `find` 搜索将从用户当前的工作目录开始，并向下搜索所有子文件夹。`find` 命令有许多选项，可以通过使用 `find` 手页进行查看。在
    bash 终端输入 `man find` 即可找到 `find` 命令的手页。最常用的选项是 `-name`，它引导我们的 `find` 命令查找文件名包含指定字符串的文件和目录。


    ```bash

    [ppeters@rad-srv ~]$ find / -name file_name

    ```


    上面的 `find` 命令示例是在根目录 `/` 下搜索搜索模式中包含 `"file_name"` 字符串的文件。


    ### Locate 命令


    `locate` 命令的语法为：


    ```bash

    [ppeters@rad-srv ~]$locate search_pattern

    ```


    `locate` 命令允许我们看到每个在文件名或目录名中包含 `search_pattern` 字符串的文件或文件夹。要查找搜索模式为 `"finger,"`
    的文件或文件夹，输入以下语句：


    ```bash

    [ppeters@rad-srv ~]$locate pwd

    ```


    `bash` `locate` 命令利用 `slocate` 数据存储来搜索文件名中包含搜索模式字符串 `"finger"` 文件和文件夹。当 `locate`
    数据库最新时，`locate` 命令搜索字符串模式的速度更快。该 `locate` 数据库通过每天运行一次 `cron` 任务来安排自动更新。在 Linux
    中，`cron` 作是一个在终端后台执行的小型实用程序，执行各种计划内的职责，例如每天早上 6 点更新 `locate` 数据库。更新后的 `b` 命令在命令行界面上刷新
    `slocate` 数据库。


    ### Which, Whatis 和 Whereis 搜索工具


    #### Which 命令


    下面是该命令的语法：


    ```bash

    [ppeters@rad-srv ~]$which command_name

    ```


    上面的 `which` 语句返回二进制文件（或可执行）`bash` 命令的路径。


    ```bash

    [ppeters@rad-srv ~]$which cd/usr/bin/cd

    [ppeters@rad-srv ~]$

    ```


    上面的 `which` 命令示例显示了 `/usr/bin/cd`。


    #### Whereis 命令


    下面是 `whereis` 命令的语法：


    ```bash

    [ppeters@rad-srv ~]$whereis command_name

    ```


    下面的 `whereis` 命令示例返回了 `find` 命令的路径、`find` 命令的二进制文件、源代码的位置以及 `find` 手页的位置。


    ```bash

    [ppeters@rad-srv~]$whereis find/usr/bin/find /usr/share/man/man1p/find.1p.gz /usr/share/man/man1/find.1.gz

    [ppeters@rad-srv ~]$

    ```


    #### Whatis 命令


    `whatis` 命令的语法：


    ```bash

    [ppeters@rad-srv ~]$whatis command_name

    ```


    上面的 `whatis` 命令从命令的手页中显示 `command_name` 的详细信息。


    ```bash

    [ppeters@rad-srv ~]$whatis lp

    ```


