    When it meets an expression containing one or more special characters, the shell
    performs the substitution.


    ## Substitution Example


    The substitution illustration below shows that the variable is assigned a value,
    and the value is the one that is printed on the terminal. This symbol is called
    the new line character, which essentially places the cursor on the next line after
    the execution of the command `\n`.


    ```sh

    #!/bin/sh

    x=20

    echo -e "The variable X stores the value $x \n"

    ```


    The script above will show us the result below. From the `echo` statement above
    we have `-e` switch which enables bash shell to read and understand the backslash
    escape symbol. After executing the script above, our result is as shown below.


    ```bash

    root@bakyrie:~# vim variable.sh

    root@bakyrie:~# chmod u+x variable.sh

    root@bakyrie:~# bash variable.sh

    The variable X stores the value 20

    root@bakyrie:~#

    ```


    When we remove the `-e` switch from our `echo` command, we the `\n` backspace
    character interpreted as a string and printed with the rest of the statement.


    ```bash

    root@bakyrie:~# bash variable.sh

    The variable X stores the value 20 \n

    root@bakyrie:~#

    ```


    The `echo` printing command is used with a varied number of escape sequences:
    We have the `-e` switch that is used to help bash shell in interpreting backspace
    escape characters. We also have the `-n` switch which is utilized to disable the
    insertion of the new line when a statement or string is printed to the terminal
    screen.


    ## Bash Command Substitution


    Bash shell Command substitution is the feature that enables the shell to process
    a command and has resulting output of that command to substitute the text of that
    command itself, or the output is sent back to the terminal as an argument to another
    command.


    Bash Command substitution is the process by which bash executes a set of instructions
    and then substitutes the commands with that output from processing.


    ## Substitution Structure


    The structure of the substitution command is illustrated below.


    `command`


    The backquote character is used when performing command substitutions.


    ### Example


    Command substitution is usually used to assign command output to a variable. The
    examples below show the substitution of the command:


    ```sh

    #!/bin/sh

    DATE=`date`

    echo "TheDate today is $DATE"

    USERS=`who | wc -l`

    echo "The number of users who are logged inis $USERS"

    UP_TIME=`date ; uptime`

    echo "The system Uptime is $UP_TIME"

    ```


    The result of the execution of the above script:

    Date is Thu Sep 5 03:59:57 CAT 2019

    The number of users who are Logged in is 1

    The system Uptime is Thu Sep 5 03:59:57 CAT 201903:59:57 up 10 days, 16:30, 2
    user, load avg: 0.43, 0.47, 0.55


    ## Variable Substitution


    Variable substitution allows the shell programmer to manipulate the state-based
    value of a variable.


    ### Table of all the possible substitutions −


    | Serial. | Form & Description |

    | :--- | :--- |

    | 1 | `${var_sub}` This allows the Substitution of the value of `var_sub`. |

    ||2 | `${var_sub:-word_sub}` If our `var_sub` is either null or unset, then the
    variable `word_sub` is substituted for variable `var_sub`. The value of `var_sub`
    does not change. |

    | 3 | `${var_sub:=word_sub}` If variable `var_sub` is either null or unset, the
    `var_sub` is set to the value of `word_sub`. |

    | 4 | `${var_sub:?message}` If variable `var_sub` is null or unset, `message`
    is printed to standard error. This operator finds out that variables are set correctly.
    |

    | 5 | `${var_sub:+word_sub}` If `va_sub` is set, `word_sub` is substituted for
    `var_sub`. The value of `var_sub` does not change. |

    '
