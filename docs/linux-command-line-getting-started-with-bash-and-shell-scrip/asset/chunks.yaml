    /usr/share/man/man1/find.1.gz[ppeters@rad-srv ~]$ |


    The Whatis CommandThe syntax of the whatis command:


    | [ppeters@rad-srv ~]$ whatis command_name |


    The whatis command above displays details about the command_name from the command''s
    man pages.


    | [ppeters@rad-srv ~]$whatis lp |'
