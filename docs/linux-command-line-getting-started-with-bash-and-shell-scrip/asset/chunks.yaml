    参数在 bash 中被使用，并被传递给 bash 中的键值对。我们希望你创建一个 `commandlinescript2.sh` bash 文件，带有以下脚本，演示如何使用名称读取参数值。命令行
    bash 脚本将读取两个参数变量。命名参数值在脚本的第一条语句中打印。接下来将使用循环遍历包含命令行参数值的数组。通过使用 `cut` 命令，数组中的每个元素都被分离为键值对。接下来，使用
    case 语句根据键值打印特定的特定的消息。


    ### commandlinescript2.sh

    ```bash

    #!/bin/bash

    #显示参数变量列表

    echo "Your argument values are: $1 $2"

    #使用 for 循环独立读取每个参数

    for arg in "$@"

    do

    #分离参数名和值

    key=$(echo $arg | cut -f1 -d=)

    value=$(echo $arg | cut -f2 -d=)

    #根据参数名显示消息

    case $key in

    name) echo "The Student’s name is $value";;

    mark) echo "The obtained mark is $value" ;;

    *)

    esac

    done

