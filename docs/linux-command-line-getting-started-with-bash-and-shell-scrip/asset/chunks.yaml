    | Serial. | Character& Description |

    | :--- | :--- |

    | 1 | - Ordinary file, such as a text file, binary file, or hard link. |

    | 2 | B Special Block file. Represents a Block I/O device file such as a hard
    drive. |

    | 3 | C Special Character file. Represents a raw file such as a physical hard
    drive. |

    | 4 | D Represents a Directory file that displays a list of contained files and
    directories. |

    | 5 | L This symbol represents a soft or Symbolic link file. These are Links on
    any ordinary file. |

    | 6 | P This symbol represents named pipe. This is a mechanism for interprocess
    communications. |

    | 7 | s This symbol is for Sockets used in interprocess communication. |


    ## Meta-Characters or Wildcards


    We have characters in Linux that are useful when we are dealing with regular expressions.
    The following characters; `*` (star) and `?` (Question mark) are called wild card
    operators or Meta characters. The `*` symbol is used to match zero (0) or more
    characters, and the question mark `?` is used to match with a single character.


    ### Illustration


    ```

    [ppeters@rad-srv ~]$ ls pp*.doc

    ```

    Displays all the files, the names of which start with `pp` and end with `.doc`:
    `ppeters01.doc`, `ppeters02.doc`, `ppeters03.doc`, `ppeters04.doc`, `ppeters05.doc`.


    The example above shows that, `*` works as wildcard character that matches any
    character. To display all the files that end with just `.doc`, users can use the
    following command:


    ```

    [ppeters@rad-srv ~]$ ls *.doc

    ```


    ## Linux Hidden Files


    We have invisible files in Linux, and they are known by the first character, which
    is the period character (`.`). In Linux, most programs like the shell use dot
    files to keep configuration details.


    Examples of the common hidden files include:

    - `.profile` - The Bourne Again Shell ( Bash) start-up script


    We can list all the invisible files, using the `ls` command by just specifying
    the `-a` option for example:

    ```

    [ ppeters@rad-srv ~]$ ls -a

    .profile  docs  lib  peters_file..  .rhosts  hosts  pub  users

    ```

    - The Single dot (`.`) is a representation for the current working directory.

    - The Double dot (`..`) is the representation for the parent folder.


    ## File Creation using VI Command


    When working on the command line interface, we can use the `vi` editor to create
    regular files on any Linux file system. Example command to create a file called
    `ppeters_file`:


    ```

    [ppeters@rad-srv ~]$ vi ppeters_file

    ```

    The command given above opens a file with the given filename `ppeters_file`. To
    get into insert mode, the `vi` mode in which to edit the file you press key `i`.
    Once the user is in edit mode, they can start typing their data or script in the
    file as in the following program:


    ```

    This is P Peters’s file. It was created today at 12 noon.

    We are going to store this text in this file.

    ```

    Once a user is done entering their text in the file, they follow the steps below:

    - Enter the `esc` key to exit the edit mode.

    - Press `Shift + ZZ` keys simultaneously to exit the file completely.


    You will now have a file created with filename `ppeters-file` in the current working
    directory.


    ## File modification in Linux


    `vi` editor is a tool that is utilized to modify existing files in a bash shell.
    To edit an existing file in Linux type the following command:


    ```

    [ppeters@rad-srv ~]$ vi ppeters-file

    ```

    Once this `ppeters_file` file is opened, you can get into insert mode by pressing
    the key `i`, and this enables you to modify the file. To move around the open
    file, the user needs to exit insert mode first by pressing the `esc` key. Having
    exited insert mode, the keystrokes below allows one to move up, down, left and
    right in a `vi` file:


    - `l`: this key allows one to move right.

    - `h`: this key gets you to move to the left.

    - `k`: this key allows one to move upside in the open file.

    - `j`: this key is for downward movement in the `vi` document.


    The above keys are used to position the cursor on any part of the file or document
    you want to edit. When you get to the part of the file you want to work on, you
    press the `i` key to get into insert mode. When you finish editing the file, the
    user should press `Esc` key and then press the following keys simultaneously `Shift
    + ZZ` to save and exit the file completely.

