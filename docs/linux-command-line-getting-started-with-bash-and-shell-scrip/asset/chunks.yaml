    ## Command Line Processing


    Sometimes when executing the script from the command line, we need to provide
    input values. In bash, this assignment can be performed in two respects. One way
    is to use variables of argument, and another is to use the function `getopts`.
    This segment shows the input of command-line information from the terminal using
    the argument variable. Create a bash script file with the accompanying script
    to view the value of the argument reading from the command line. This script will
    read three command-line arguments, `$operand1`, `$operand2` and `$operator`, which
    will be stored in the variables. The number and second argument value must be
    one of the four arithmetic operators (`+`, `-`, `/`, `x`) to perform the script
    correctly. If the declaration checks the `$operator` value and performs the operator-based
    procedure and the value is printed.


    ### command.sh

    ```bash

    #!/bin/bash

    #Display the argument variable list

    echo "Your argument values are: $1 $2 $3"

    # Store the argument values in operands

    operand01=$1

    operand02=$3

    operator=$2

    #Do a Check of the second command argument value to do the arithmetic operation

    if [[ $operator == ''+'' ]]

    then

    ((result=$operand01+$operand02))

    elif [[ $operator == ''-'' ]]

    then

    ((result=$operand01-$operand02))

    elif [[ $operator == ''x'' ]]

    then

    ((result=$operand01*$operand02))

    elif [[ $operator == ''/'' ]]

    then

    ((result=$operand01/$operand02))

    fi

    # print the result

