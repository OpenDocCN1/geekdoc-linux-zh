    root@bakyrie:~# ./commandlinescript2.sh name=\"James Jones\" mark=83\nYour argument\
    \ values are: name=James Jones mark=83\nThe Student’s name is James Jones\nThe\
    \ obtained mark is 83\nroot@bakyrie:~#\n```\n\n# Performing Arithmetic Operations\n\
    It is a common requirement for many programming languages to perform arithmetic\
    \ operations. Bash performs the arithmetic operations differently from other standard\
    \ languages of programming. Arithmetic operations in bash are performed in multiple\
    \ ways. This section shows one of the simple ways to do arithmetic operations.\n\
    \nWe are going to create an example bash file called `arith_script.sh` with the\
    \ script below. This example script is a demonstration of how to perform the four\
    \ basic types of arithmetic operations. We will use double brackets `(( ))` at\
    \ the beginning of the script to show simple addition and division operations.\
    \ The addition and division operators are flanked by operands, which are number\
    \ enclosed in double brackets. After the addition and division operations, we\
    \ move next, to the pre-increment operation, as shown below. Finally, in the last\
    \ part of the script, there's demonstration of the shorthand notation to perform\
    \ increments.\n\n```bash\narithmetic_script.sh\n#!/bin/bash\n\n# Do the sum operation\n\
    result=$((60+150))\n\n# Display to screen the addition result\necho \"Addition\
    \ = $result\"\n\n# Divide the values given\nresult=$((150/25))\n\n# Display to\
    \ the screen the division result\necho \"division = $result\"\n\n# Assign a value\
    \ to X\nX=10\n\n# Doing pre-increment\n((--X))\n\n# Print the value of X\necho\
    \ \"Value after decrement = $X\"\n\n# Using shorthand operator\n(( X += 10 ))\n\
    \n# Print the value of X\necho \"Value after adding 10 = $X\"\n```\n\nFrom above\
    \ all the arithmetic operations are executed through the use of double brackets.\
    \ We may use `let`, `expr` and `bc` commands to do arithmetic operations in bash.\n\
    \n# Manipulating Bash Strings\nThe string data in bash can be used to perform\
    \ many types of tasks. Some are string concatenation, string comparison, string\
    \ splitting, string case change, etc. There are no bash built-in string functions\
    \ to do the string operations like in other standard programming languages. The\
    \ section of this book discusses some common string manipulations.\n\n## String\
    \ Concatenation\nString concatenation is the process of adding two or more strings\
    \ together. Strings are joined together in bash by appending one string after\
    \ another. We can create a bash file with the following script to show the use\
    \ of string concatenation. We will initialize two string variables and display\
    \ them after combining the two string variables. The example shows that the content\
    \ of `$stringcat01` and `$stringcat02` will be merged and printed.\n\n```bash\n\
    stringconcat.sh\n#!/bin/bash\n\n#Initialize first string variable\nstringcat01=\"\
    This user \"\n\n#Initialize second string variable\nstringcat02=\"Loves Bash Scripting\"\
    \n\n# Display the output\necho \"$stringcat01$stringcat02\"\n```\nFrom above all\
    \ the arithmetic operations are executed:\n```bash\nroot@bakyrie:~# vim stringconcat.sh\n\
    root@bakyrie:~# chmod u+x stringconcat.sh\nroot@bakyrie:~# ./stringconcat.sh\n\
    This user Loves Bash Scripting\n```\n\n## String Comparison\nTo make string comparisons,\
    \ bash uses unique operators. We are going to create a bash file with the script\
    \ below to demonstrate how strings are compared. In `compare.sh`, if the input\
    \ matches, a message is displayed.\n\n```bash\ncompare.sh\n#!/bin/bash\necho \"\
    Enter any string\"\nread text\n\n#Check if the input is Python\nif [ \"$text\"\
    \ == \"Python\" ]; then\n    echo \"You can program Python\"\nelse\n    echo \"\
    You can program PERL\"\nfi\n```\n\n## String Splitting\nTo divide string, bash\
    \ has no built-in string functions. However, using the `IFS` variable, we can\
    \ split text into an array. We create a bash file with the script below to show\
    \ how to split the text data.\n\n```bash\nstringsplit.sh\n#!/bin/bash\n#Enter\
    \ a text string\necho \"Please input a text string\"\nread text\n\n# Set the space\
    \ delimiter\nIFS=' '\n\n#Split the text into an array\nread -a str_array <<< \"\
    $text\"\n\n# Display each element of the array\nfor value in \"${str_array[@]}\"\
    ; do\n    printf \"%s\\n\" \"$value\"\ndone\n```\n\n## Changing Case\nMost languages\
    \ of scripting have built-in features to alter string case. But using `tr` command\
    \ or the `^^` symbol can change the string data. The example below shows how to\
    \ convert characters to uppercase and lowercase.\n\n```bash\ncase.sh\n#!/bin/bash\n\
    #Initialize the 1st text string\ntext1='james@company.com'\n\n#Print the value\
    \ of $text1 by converting all characters to uppercase\necho \"${text1^^}\"\n\n\
    #Initialize the 2nd text string\ntext2='Bash scripting basics'\n\n#Print the value\
    \ of $text2 by converting all uppercase to lowercase\necho $text2 | tr [:upper:]\
    \ '[:lower:]'\n```\n\n# Reading string data through the loop\nThe string data\
    \ functions for any programming language as a character array. In this section\
    \ of the book, we discuss how the `for` loop is used to read text string data.\
