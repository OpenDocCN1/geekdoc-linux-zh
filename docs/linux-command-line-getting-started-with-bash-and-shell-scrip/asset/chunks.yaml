    ### 选项


    | `-w, --wildcard` | 此选项将每个关键字解析并解释为字符串模式，其中包含所有 shell 风格的通配符或元字符。每个关键字都将单独与现有的页面名称和手册页描述进行匹配。如果同时使用了参数
    `--exact`，则只有当展开后的关键字字符串或模式完全匹配整个描述或 Linux 手册页名称时，才会输出匹配结果。否则，关键字也允许在描述的单词边界处进行匹配。
    |

    | `-e, --exact` | 使用此选项时，每个关键字将与手册页名称及随随其后的手册页描述进行精确匹配。 |

    | `-a, --and` | 此选项仅输出匹配所有给定关键字的项。默认输出结果是显示匹配任何关键字的所有项。 |

    | `-l, --long` | 此选项确保我们不会为了适应终端控制台宽度而修剪结果。在大多数正常情况下，输出将被修剪以适应终端宽度，以避免因编写不当的手册页
    NAME 章节导致格式错误的结果。 |

    | `-s list , --sections list , --section list` | 此选项仅在指定的手册页章节中搜索。给定的列表是用冒号或逗号分隔的手册章节列表。如果手册页列表中的项是一个页面章节（例如
    "4 "），则列出的描述将显示所有位于 "4 "、"4python "、4x " 等章节的页面；而如果列表显示的是扩展名（例如 "5perl "），则生成的列表将仅包含手册章节中该精确部分的页面。
    |

    | `-m system [ ,...], --systems=system [ ,...]` | 此选项用于在用户可以访问的其他操作系统中搜索。例如，为了过滤名为
    "MacOS" 的操作系统的手册页描述，我们使用选项 `-m MacOS`。指定的系统可以是多个用逗号分隔的操作系统名称的组合。 |

    | `-M path , --manpath=path` | 此选项用于指定一组备选的、冒号分隔的手册页树进行过滤。默认情况下，`apropos` 使用 `$MANPATH`
    环境变量，除非它为空或未设置，在这种情况下，它将根据你的 `$PATH` 环境变量确定一个合适的 "manpath"。此 `-M` 选项会覆盖 `$MANPATH`
    的内容。 |

    | `-L locale , --locale=locale` | `apropos` 命令通常通过调用名为 `setlocale` 的 C 过程来确定当前系统区域，该过程会搜索各种环境变量，可能包括
    `$LC_MESSAGES` 和 `$LANG`。我们可以使用 `-locale` 选项临时覆盖确定的值。此选项用于向 `apropos` 命令提供区域字符串。请注意，locale
    选项在实际开始搜索手册页之前不会生效。如帮助消息之类的结果将始终以初始设置的区域输出。 |

    | `-C file , --config-file=file` | 使用此用户配置文件而非默认的 `~/.manpath`。 |

    | `-h, --help` | 此选项帮助显示帮助信息并退出。 |

    | `-V, --version` | 此选项显示版本信息。 |


    ### 环境变量


    | 变量 | 设置 |

    | :--- | :--- |

    | `SYSTEM` | 设置 `$SYSTEM` 环境变量，其效果与将此变量指定为 `-m` 选项的参数相同。 |

    | `MANPATH` | 设置 `$MANPATH` 环境变量，其值将被解释为冒号分隔的手册页树搜索路径。 |

    | `MANWIDTH` | 设置 `$MANWIDTH` 环境变量，确保该值被用作终端宽度（如 `--long` 选项所述）。如果未设置此变量，将使用 `ioctl`（如果可用）、环境变量
    `$COLUMNS` 的值计算终端控制台宽度，或者如果所有方法都失败，则退回到默认的 80 个字符。 |

    | `POSIXLY_CORRECT` | 如果名为 `$POSIXLY_CORRECT` 的环境变量设置为空值，默认的 `apropos` 搜索将使用扩展正则表达式
    (`-r`)。 |


