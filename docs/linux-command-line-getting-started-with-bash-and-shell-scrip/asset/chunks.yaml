    # Creating New Tar Archives


    For illustration purposes only, a directory called `example_dir` will be used.
    This `example_dir` contains three unique file types; a music file, a picture file,
    and a word document.


    ```bash

    [ppeters@rad-srv ~]$ ls example_dir/wordfile.odt imagefile.jpg musicfile.mp3

    ```


    Below is the command for creating a new archive of the folder `example_dir`.


    ```bash

    [ppeters@rad-srv ~]$ tar cf example_dir.tar example_dir/

    ```


    From the example above, `c` flag is the create symbol, and the file name is represented
    by the `f` flag. The illustration below is demonstrating the creation of a tar
    archive from a number of files in the user''s present working directory:


    ```bash

    [ppeters@rad-srv ~]$ tar cf files_arch.tar 1st_file 2nd_file 3rd_file

    ```


    # Extracting Archives


    We can extract a tar archive whilst we are in the same directory it is located
    in just executing the `tar` command below:


    ```bash

    [ppeters@rad-srv ~]$ tar xf example_dir.tar

    ```


    It is also possible to extract a tar archive file in a folder in a different location
    by using the capital `C` flag in options part of the command. For instance, the
    `tar` statement below extracts the specified tar archive in the `/usr/local` directory.


    ```bash

    [ppeters@rad-srv ~]$ tar xf files_dir.tar -C /usr/local

    ```


    Alternatively, go to the `/usr/local` directory and extract the archive, as shown
    below.


    ```bash

    [ppeters@rad-srv ~]$ cd /usr/local

    [ppeters@rad-srv local]$ tar xf ../example_dir.tar

    ```


    There are instances when you may want to extract files of a specific type. For
    example, the following command extracts the `.jpg` type files:


    ```bash

    [ppeters@rad-srv ~]$ tar xf example_dir.tar --wildcards *.jpg

    ```


    # Creation of compressed gzipped and bzipped archives


    `tar` command creates the `.tar` archive file by default. It is important to note
    that the `tar` command is useable with `gzip` and `bzip2` compression tools. The
    archive file that ends with `.tar` refers to the uncompressed tar archive. The
    `.tgz` and `tar.gz` extensions represent gzip compressed files, whilst the `.tbz`
    and file extensions refer to bzip compressed file archive. `gzip` and `bzip2`
    archives are compressed archives.


    ## Example creation of gzip compressed file archive


    ```bash

    [ppeters@rad-srv ~]$ tar czf example_dir.tar.gz example_dir/

    ```


    For all the illustrations above we compress the archives using `z` flag for gzip
    method. The `v` flag is used with the `tar` command to enable the user to view
    the progress while creating the archive.


    ```bash

    [ppeters@rad-srv ~]$ tar czvf example_dir.tar.gz example_dir/example_dir/wordfile.odt
    image_dir/musicfile.jpg

    ```


    The `v` flag above means verbose. In Linux it is possible to create gzip compressed
    archive from a list of files:


    ```bash

    [ppeters@rad-srv ~]$ tar czf files.tgz file_01 file_02 file_03

    ```


    To extract the gzipped archive in the current directory, use:


    ```bash

    [ppeters@rad-srv ~]$ tar xzf example_dir.tgz

    ```


    To extract the compressed archive in a different directory, use `-C` flag.


    ```bash

    [ppeters@rad-srv ~]$ tar xzf example_dir.tgz -C Downloads/

    ```


    ## Example to create bzipped archive


    To create a bzip compressed file we use `j` flag as shown below.


    ```bash

    [ppeters@rad-srv ~]$ tar cjf example_dir.tar.bz2 example_dir/

    ```


    ## Creating a bzip archive from a list of files


    ```bash

    [ppeters@rad-srv ~]$ tar cjf files.tar.bz2 file_01 file_02 file_03

    ```


    Use the `v` flag to display the progress. We show the example to extract the bzipped
    archive into the current working directory:


    ```bash

    [ppeters@rad-srv ~]$ tar xjf example_dir.tar.bz2

    ```


    Or, extract the archive to some other directory:


    ```bash

    [ppeters@rad-srv ~]$ tar xjf example_dir.tar.bz2 -C /tmp

    ```


    # Creating an archive of multiple files/folders


    The `tar` command allows you to create an archive from multiple files and folders.
    The process of creating a gzip compressed archive of multiple directories or files
    at once, follow the example below:


    ```bash

    [ppeters@rad-srv ~]$ tar czvf example_dir.tgz Downloads/ example_dir/wordfile.odt

    ```


    The above illustration creates a compressed bzip archive of `Downloads/` directories
    and `wordfile.odt` file in `example_dir` directory and save the archive in the
    current working directory.


    # Exclude directories and/ files while creating an archive


    It is possible to exclude specific files or directories from your `tar` archive.
    This is a useful feature when backing up your data. You can choose which files
    or directories to back up. We use the `--exclude` switch to remove the files that
    we do not appended to our compressed backup file. For instance, you may want to
    create an archive of your `/home` directory, but exclude `Documents` and `Pictures`
    folders. Illustration is shown below:


    ```bash

    [ppeters@rad-srv ~]$ tar czvf example_dir.tgz /home/ppeters --exclude=/home/ppeters/Documents
    --exclude=/home/ppeters/Pictures

    ```


    The `tar` command above creates a compressed gzip archive of my `/home` directory,
    excluding `Documents` and `Pictures` directories. To create a compressed bzip
    archive, replace `z` with `j` and use the extension `.bz2` in the above example.


    # List contents of archive files without extracting them


    To list the contents of an archive file, we use `t` flag.


    ```bash

    [ppeters@rad-srv ~]$ tar tf example_dir.tar example_dir/example_dir/wordfile.odt
    example_dir/imagefile.jpg example_dir/musicfile.jpg

    ```


    To view the verbose output, use `v` flag.


    ```bash

    [ppeters@rad-srv ~]$ tar tvf example_dir.tar

    drwxr-xr-x ppeters/ppeters 0 2019-09-11 19:52 example_dir/

    -rw-r--r-- ppeters/ppeters 9942 2019-09-11 13:49 example_dir/wordfile.odt

    -rw-r--r-- ppeters/ppeters 36013 2019-09-11 11:52 example_dir/imagefile.jpg

    -rw-r--r-- ppeters/ppeters 112383 2019-08-22 14:35 example_dir/musicfile.jpg

    ```


    # Append Files to Existing Archives


    Files or directories can be added/updated to the existing archives using `r` flag.
    Take a look at the following command.


    ```bash

    [ppeters@rad-srv ~]$ tar rf example_dir.tar example_dir/ ppeters/ example_txt.txt

    ```


    The above command will add the directory named `ppeters` and a file named `example.txt`
    to `example_dir.tar` archive. Linux users can validate if the files have been
    added to the:


    ```bash

    [ppeters@rad-srv ~]$ tar tvf example_dir.tar

    drwxr-xr-x ppeters/ppeters 0 2019-09-11 6:56 example_dir/

    -rw-r--r-- ppeters/ppeters 9942 2019-09-11 6:49 example_dir/wordfile.odt

    -rw-r--r-- ppeters/ppeters 36013 2019-09-11 6:54 example_dir/imagefile.jpg

    -rw-r--r-- ppeters/ppeters 112383 2019-09-11 6:45 example_dir/musicfile.jpg

    ```

