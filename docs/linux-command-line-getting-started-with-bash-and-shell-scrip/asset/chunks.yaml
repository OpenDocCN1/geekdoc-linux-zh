    # 使用 Find 的修改时间进行查找


    假设你正在使用 Linux 系统，似乎不记得把某些 PowerPoint 幻灯片和文本文件保存在哪里了。你只记得将这些文件下载到文件系统的时间段。你如何使用
    `find` 命令行工具来定位你的幻灯片和文本文件呢？


    你需要使用启用了修改时间开关的 `find` 命令。在 bash 命令行中，每个文件都有三个时间戳，它们记录了对文件进行某些操作最后的时间，即 `atime`、`ctime`
    和 `mtime`。时间戳 `atime` 代表文件被访问的时间，而 `ctime` 代表文件状态发生改变的时间（即文件或其属性被更改）。最后，我们还有 `mtime`，它代表修改时间，或文件内容被更改的时间。


    在 bash shell 中，你可以查找时间戳在特定年龄范围内的文件，甚至可以与其他时间戳进行比较。


    使用带有 `-mtime` 选项的 `find` 命令可能的。过滤器或搜索将返回一个在 N*24 小时前最后访问的文件列表。例如，要搜索在过去三个月（90
    天）内最后访问的文件，我们使用选项 `-mtime +90`。


    * `-mtime +25` 意味着你正在搜索 25 天前更改的文件。

    * `-mtime -30` 意味着你正在搜索小于小于 30 天的文件。

    * `-mtime 40` 如果你不包含 `+` 符号或 `-` 符号，它意味着上述示例指定的精确天数，即正好 40 天前。


    `find` bash 命令允许用户根据文件更改或修改的日期查找或搜索文件：


    ```bash

    [ppeters@rad-srv ~]$ find /var/named -name "*zone" -mtime 4

    [ppeters@rad-srv ~]$ find /home/testuser/ -name "*conf" -mtime 6

    ```


    第一个 `find` 命令返回了所有以搜索字符串 `zone` 结尾且在四天前更改的文件列表。第二个 `find` 命令过滤了测试用户的家目录，所有名称以字符串
    `conf` 结尾且在过去六天内更改的文件。


    ## 使用 Grep 进行搜索


    `find` 命令只能根据文件的名称和元数据对目录层进行过滤。如果你需要搜索文件中的文本或内容，我们使用像 `grep` 这样的工具下面的示例说明了 `grep`
    的用法：


    ```bash

    [ppeters@rad-srv ~]$ find /etc -type f -exec grep "conf" ''{}'' \; -print

    ```


    上述语句搜索 `/etc` 目录中由 `-type f` 关指定的类型为文件的对象，然后执行 `grep "conf"` 命令，为每个符合标准的对象文件找到所有包含
    `"conf"` 文本字符串的文件。匹配的文件将使用 `-print` 关显示在终端屏幕上。为了找到匹配结果，大括号 `{}` 被用作占位符。大括号 `{}`
    包含在单引号（`'' `）中，以防止 `grep` 处理格式错误的文件名。


    为了防止 shell 解释，`-exec` 命令以分号（`;`）结束，分号应该被转义（`\ ;`）。


    在实现 `-exec` 选项之前，这种类型的命令可以使用 `xargs` 命令产生可比较的输出：


    ```bash

    [ppeters@rad-srv ~]$ find /usr -type f -print | xargs grep "binary"

    ```


    ## 使用 Find 查找并执行文件


    ### -exec 的基本用法


    `-exec` 选项或开关接受其参数并实现一个带有可选语句的内部实用程序。如果在给定的命令的任何地方存在空大括号 `{}`，则当前路径（`/the /path/file_name`）将替换每个实例。在
    bash shell 中不需要对大括号 `{}` 加引号。


    命令必须以分号为缀；用以检查它在何处结束（因为后面可能有更多选项）。分号必须被引用为 `\;` 或 `'';''`，以保护 `;` 不受 shell 影响，否则
    shell 将其视为 `find` 命令的结束。


    下面的示例（前两行末尾的 `\` 只是为了换行）：


    ```bash

    find / -type f –name ‘*.ppt’ –exec grep –q ‘devops’ {} ‘;’ –exec cat {} ‘;’

    ```


    这将在当前工作文件夹或下方定位所有名称与模式 `*.ppt` 匹配的标准文件（`-type f`）。它将检查使用 `grep-q` 识别出的任何文件中是否出现了字符串
    `"devops"`（`grep-q` 不产生结果，只产生退出状态）。对于包含该字符串的文件，将执行 `cat` 以将文件内容显示到终端。


    `find` 命令允许用户根据文件更改或修改的日期查找或搜索文件：


