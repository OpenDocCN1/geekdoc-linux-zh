    Compressing is very helpful when storing valuable files and sending large files
    across the Internet. Compressing an already compressed file adds additional overhead,
    so you''ll get a marginally larger file. Stop compressing a file that is already
    compressed. Linux has many programs for compressing and decompressing files. I’m
    now going to discuss the two most used utilities for compressing and decompressing
    files.


    # Compressing and Decompressing Files


    The most common tools used to compress and decompress files in Linux operating
    systems are `gzip` and `bzip2`.


    ## Compress and Decompress Files using gzip Program

    The `gzip` is a utility to compress and decompress files making use of the Lempel-Ziv
    coding (`LZ77`) algorithm.


    ### Compressing files using gzip

    To compress a file named `firstfile.txt` and replace it with a gzipped compressed
    archive called `firstfile.txt.gz`, run the following command in your terminal:

    ```

    [ppeters@rad-srv ~]$ gzip firstfile.txt

    ```

    `gzip` command line utility always replaces the original file you supply as the
    argument for instance above argument `firstfile.txt` is replaced with a gzipped
    compressed archive named `firstfile.txt.gz`.


    The `gzip` compression utility is used in a number of ways. An example is to create
    a gzip-compressed archive of a bash command''s output result. The following example
    statement shows.

    ```

    [ppeters@rad-srv ~]$ ls -l Downloads/ | gzip > firstfile.txt.gz

    ```

    The illustration above creates a gzipped compressed archive of the long directory
    listing of the `Downloads` folder in the user''s home directory.


    ### Compressing files and redirecting the output

    Formally, the `gzip` utility compresses the given input files and directories
    and replaces them with the gzipped compressed archive. We have a way of making
    sure that we keep the original file and redirect the output to the standard output
    terminal. For instance, the following statement compresses `firstfile.txt` and
    redirects the resulting output to `redirect.txt.gz`.

    ```

    [ppeters@rad-srv ~]$ gzip -c firstfile.txt > redirect.txt.gz

    ```

    Similarly, we may also decompress an gzip archive file and specify the output
    file we want to be created:

    ```

    [ppeters@rad-srv ~]$ gzip -c -d redirect.txt.gz > firstfile1.txt

    ```

    The illustration command above decompressed the `redirect.txt.gz` file and redirects
    the resulting output to a file called `firstfile1.txt`. The redirection instance
    above the original file is not deleted.


    ### Decompressing files with gzip tool

    To uncompress the `firstfile.txt.gz` file, and subsequently substitute it with
    the original archive which is uncompressed, we follow the example below:

    ```

    [ppeters@rad-srv ~]$ gzip -d firstfile.txt.gz

    ```

    We have the `gunzip` decompression utility we can use to deflate a gzipped compressed
    file. We use `gunzip`, as shown below:

    ```

    [ppeters@rad-srv ~]$ gunzip firstfile.txt.gz

    ```


    ### Viewing contents of compressed files

    It is possible to view the files and folders contained in an archive file through
    using the `gunzip` program with the `-c` switch without the need to decompress
    the archive as shown below:

    ```

    [ppeters@rad-srv ~]$ gunzip -c firstfile1.txt.gz

    ```

    Alternatively, we can view the contents of an archived file using the `zcat` utility,
    as shown below.

    ```

    [ppeters@rad-srv ~]$ zcat firstfile.txt.gz

    ```

    You may also redirect the output from `gunzip` and `zcat` through pipe `|` to
    the `less` bash command to view the output in a paginated way as shown below:

    ```

    [ppeters@rad-srv ~]$ gunzip -c firstfile1.txt.gz | less

    [ppeters@rad-srv ~]$ zcat firstfile.txt.gz | less

    ```

    Alternatively, we can use the `zless` command program, which performs the same
    job as the pipelined `zcat` command.

    ```

    [ppeters@rad-srv ~]$ zless firstfile1.txt.gz

    ```


    ### Setting the compression level with gzip

    Another notable advantage of `gzip` is that it supports the use of compression
    levels. There are mainly three supported compression levels as given below.

    - `1` – Fastest (lower compression)

    - `9` – Slowest (Best compression level)

    - `6` – Default level


    To compress a file named `firstfile.txt`, replacing it with a gzipped compressed
    version with the best compression level, we specify the `-9` switch with the `gzip`
    utility as shown below:

    ```

    [ppeters@rad-srv ~]$ gzip -9 firstfile.txt

    ```


    ### Concatenate multiple compressed files

    It is also possible to join together or concatenate multiple compressed archive
    files into one archive. The example below shows how.

    ```

    [ppeters@rad-srv ~]$ gzip -c firstfile01.txt > redirect.txt.gz

    [ppeters@rad-srv ~]$ gzip -c firstfile02.txt >> redirect.txt.gz

    ```

    The example above shows two commands compressing `firstfile01.txt` and `firstfile02.txt`
    and stores them in one archive file named `redirect.txt.gz`.

    You can view the contents of both files (`firstfile1.txt` and `firstfile2.txt`)
    without extracting them using any one of the following commands:

    ```

    [ppeters@rad-srv ~]$ gunzip -c redirect.txt.gz

    [ppeters@rad-srv ~]$ gunzip -c redirect.txt

    [ppeters@rad-srv ~]$ zcat redirect.txt.gz

    [ppeters@rad-srv ~]$ zcat redirect.txt

    ```

    To learn more about the `gzip` utility, you can visit the manual pages by typing
    the command below:

    ```

    [ppeters@rad-srv ~]$ man gzip

    ```


    ## Compressing and Decompressing with bzip2

    The `bzip2` utility is similar to the `gzip` compression program. The main difference
    between the two is in the compression algorithms used. `bzip2` uses the compression
    algorithm called the Burrows-Wheeler block sorting text compression algorithm
    and Huffman coding. All the files bzipped using the `bzip2` have the `.bz2` extension.


    The usage of `gzip` and `bzip2` is the same. We will just be substituting the
    `gzip` in the above examples with `bzip2`, `gunzip` with `bunzip2`, `zcat` with
    `bzcat`, and so on.


    `bzip2` compression replaces the file we are compressing with the compressed version
    of the archive; this can be achieved by running the command below:

    ```

    [ppeters@rad-srv ~]$ bzip2 firstfile.txt

    ```

    If you are not willing to substitute the original file, use `-c` switch with the
    `bzip2` tool and redirect the output result to a new file.

    ```

    [ppeters@rad-srv ~]$ bzip2 -c firstfile.txt > output.txt.bz2

    ```

    To decompress a compressed file:

    ```

    [ppeters@rad-srv ~]$ bzip2 -d firstfile.txt.bz2

    ```

    Or,

    ```

    [ppeters@rad-srv ~]$ bunzip2 firstfile.txt.bz2

    ```

    To view the contents of a compressed file without decompressing it:

    ```

    [ppeters@rad-srv ~]$ bunzip2 -c firstfile.txt.bz2

    ```

    Or,

    ```

    [ppeters@rad-srv ~]$ bzcat firstfile.txt.bz2

    ```

    ```

    [ppeters@rad-srv ~]$ man bzip2

    ```


    # Archiving Files and Directories

    There are mainly two utilities, namely; `tar` and `zip`, that are used to archive
    files and directories. This section of the book is going to be split into two
    sections; the first section will detail usage of `TAR` utility, and the second
    section will discuss the `ZIP` utility.


    ## The Tar Command

    The Tape Archive utility commonly known as the `Tar` is a Linux utility for archiving
    files and directories on the bash command line. `tar` is utilized to put together
    or store a number of files which can be the same or unique size into one archive
    file. The `tar` utility has four major working modes, namely `c`, `x`, `r`, and
    `t`.


    1. `c` – `C` mode is for creating a `tar` archive from one or more files and from
    one or more folders. own2. `x` – This is the Extract mode for file archiving.

    3. `r` – This is the operating mode to add new files to the end of a `tar` archive
    file.

    4. `t` – This mode provides a listing of the entities inside of a `tar` archive
    file.

