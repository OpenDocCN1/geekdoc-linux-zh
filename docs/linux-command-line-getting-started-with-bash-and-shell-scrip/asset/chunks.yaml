    # 什么是 Bash？


    `BASH` 也称为“Bourne-Again SHell”（再次出 Bourne Shell），是 Linux 系统上的默认用户 shell。`Bash`
    主要是一个命令行解释器，具有传统的编程语言构造结构。在许多领域中，`Bash` 被视为一种编程语言，尽管它具有 `Bash` 特有的逻辑。作为一种编程语言，`Bash`
    必须支持变量构造、函数以及如条件语句和循环等程序决策流控制构造结构。


    `BASH` shell 提示符取决于登录用户的权限。所有普通用户都有一个美元符号（`$`）提示符。Linux 操作系统还有许多其他类型的 shell，每种
    shell 都有自己的提示符，例如 `csh` 使用 `%` 作为提示符。所有特权用户（如 `root` 用户）都有独特的提示符；他们使用 `#` 作为提示符。（Petersen,
    2008）。


    `Bash` 作为命令行解释器，将输入终端的所有命令都作为字符串存储，除非用户指示它进行算术计算，否则它没有数字的概念。`Bash` 的简化工作方式如下：


    1. `Bash` 接收用户的键盘输入，并根据空格（空格或制表符）将其分割为单词。

    2. `Bash` 然后假设用户输入的第一个单词始终是一个命令。`Bash` 然后将第一个单词之后的所有内容作为参数传递给该命令。

    3. 在解析并分割用户输入后，`Bash` 尝试处理该命令，并在参数可用时添加它们。


    ## 开始使用 Bash


    Linux 有多个发行版可供用户选择。所有这些 Linux 发行版都将 `bash` 作为默认 shell。在学习本书之前，选择一个适合你的发行版是重要的。我鼓励读者选择
    `Centos 7` 操作系统。在选择了 Linux 发行版后，重要的是你将使用哪种基于命令行的文本编辑器。


    作者建议在你的 Linux 服务器上安装 `VIM`（`VI` Improved）编辑器。在 `Centos` 和 `Ubuntu` 中的安装方法不同。`Vi`
    是 Linux 系统管理员中流行且广泛使用的文本处理编辑器。尽管 `Vi` 被广泛使用，但对于新手 Linux 用户来说很难学习，因为它在两种不同的模式下运行，即插入模式和命令模式。插入模式是用户通常在文件中输入文本的地方，而命令模式是你的键盘输入被解释为对文本执行的操作的地方。


    ## 设置环境


    Linux 是一个非常灵活且可定制的系统。你可以设置环境设置和变量来定义你的 shell 如何运行。你可以让系统自动处理你发现需要反复设置或更改的内容。


    ### Shell 配置文件 (Shell Profile)


    对于任何 Linux 用户，用户主目录下都有 `~/.profile` 文件。正是在 `.profile` 文件中，你可以个性化与用户配置关联的用户设置。当命令行界面初始化时，会发生以下步骤：

    * 首先执行 `/etc/profile`

    * 然后，如果你的默认 shell 是 `bash`，则执行 `/etc/bash.bashrc` 文件，然后

    * 处理 `~/.profile` 文件，

    * 最后执行 `~/.bashrc` 文件。


    `~/.profile` 文件由任何可用的 shell 执行，因此将通用设置放在此文件中是重要的。所有针对 `bash` 的设置都应该放在 `~/.bashrc`
    文件中。系统管理员可以在 `~/.bashrc` 文件中设置 `bash` 环境变量和别名，甚至运行命令。用户主目录下所有以点开头的文件都称为“点文件”（dotfiles）。


    ### 环境变量


    Linux 允许使用环境变量来更改 Linux 系统的运行方式。在命令行中，你可以在终端设置环境变量，或者通过向 `~/.bashrc` 文件中添加项目进行静态设置。`bash`
    shell 有四个可自定义的提示符，即 `PS1`、`PS2`、`PS3` 和 `PS4`。


    #### PS1 提示符


    `PS1` 也称为“Prompt String 1”，是 Linux 中每个 `bash` 命令前显示的内置基础可自定义 `bash` shell 变量。对提示符的自定义包括添加和修改元素、更改背景颜色。下面是默认的
    `bash` 提示符。


    ![](img/srcCE.jpg)

    图 1 显示了用户名 `ppeters`、主机名 `rad-srv` 的 PS1 提示符。

    `PS1` 最常用的设置是 `\u@\h:\w$`，它显示用户名、主机名以及用户正在所在的目录。


    下一行是 `PS1` 的另一个示例：`ppeters@rad-srv:/var/log$`

    上面的提示符显示用户拥有用户名 `ppeters`，并且登录到了主机名为 `rad-srv` 的服务器，且用户当前位于 `/var/log` 文件夹。


    #### PATH


    `bash` `PATH` 环境变量被配置为将 shell 指向常用程序的位置。（注：原文在此处存在大量文本重复，译文已根据逻辑进行整合）。


    '
