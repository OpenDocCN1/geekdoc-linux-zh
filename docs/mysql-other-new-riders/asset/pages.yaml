  md: '# Chapter 1 Development Concepts


    Before trying to fit all parameters into a structure, there''s still the possibility
    of alternative data formats. To encode date and time data, for example, you might
    use BCD (Binary Coded Digits) format or UNIX timestamp format, to name just two
    possibilities. Both formats pack all required variables into a single one. BCD
    is partly widely widespread, but when it comes to PHP, originates from a UNIX-like
    platform, timestamps dominate (see Listing 1.13). In case you''ve encountered
    timestamps, they count the number of seconds since midnight UTC, January 1, 1970,
    expressed as a decimal number in a 32-bit value This results in a wraparound in
    the year 2106, but since PHP doesn''t have a fixed 32-bit type to handle timestamps,
    it''s possible for PHP to transparently change the timestamp size to 64-bit in
    order. Your applications won''t notice it.


    Another advantage of timestamps is the fact that a large number of PHP functions
    convert them into human-readable dates and back. It''s also easy to do calculations
    with timestamps—to get a difference between two events, for example, you just
    to subtract one timestamp from the other.


    Listing 1.13 Corrected API.


    ```

    void calendar_add_event(int timestamp, string description);

    void calendar_delete_event(int timestamp, int seconds);

    ```


    As you can see, it is very important to check for existing formats and methods
    for handling a special kind of data. The current format not only shortens the
    argument list by 50%, it''s also—by accident—the native format of the underlying
    architecture to handle date and time. Checking native formats and existing standards
    is a step never to be underestimated in your research phase; during development,
    nothing should occur to you simply "by accident". Knowing the territory is mandatory.


