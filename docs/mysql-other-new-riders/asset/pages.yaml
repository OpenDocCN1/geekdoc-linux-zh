    $algorithms = array(

    MCCRYPT_BLOWFISH,

    MCCRYPT_DES,

    MCCRYPT_TripleDES,

    MCCRYPT_ThreeWAY,

    MCCRYPT_GOST,

    MCCRYPT_CRYPT,

    MCCRYPT_DES_COMPAT,

    MCCRYPT_SAFER64,

    MCCRYPT_SAFER128,

    MCCRYPT_CAST128,

    MCCRYPT_TEAN,

    MCCRYPT_RC2,

    MCCRYPT_TOWFISH,

    MCCRYPT_TOWOFISH128,

    MCCRYPT_TOWOFISH192,

    MCCRYPT_TOWOFISH256,

    MCCRYPT_RC6,

    MCCRYPT_IDEA

    );

    ```'
