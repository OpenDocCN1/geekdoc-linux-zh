    that they''re smaller and better suited for use on high-latency networks. You
    can use ActiveX Controls almost exactly the same way as fully-fledged COM controls.


    Then there''s DCOM, the Distributed Component Object Model protocol, which introduces
    COM components to the world of distributed network applications. Basically, it''s
    a protocol for object-oriented remote procedure calls useful for distributed,
    component-based systems. PHP 4.0 works with both COM and DCOM on Win32 systems.
    At this time, it doesn''t work on other platforms where COM could be available
    (as Apple or Solaris).


    Invoking (DCOM) controls with PHP 4.0 is very easy. COM is a reserved class name
    that you can instantiate by passing the control''s name to the constructor. You
    then have a complete instance of the COM object where you can execute functions
    or set properties. For properties that can''t be expressed using PHP syntax (for
    example, they contain a dot or other characters invalid for PHP), you can use
    the following functions:


    +   - bool_com_set(class com_object, string property_name, string property_value)


    Assigns a value for a property on the com_object instantiated in com_object. Aliases
    for this function are com_propset() and com_propout(). Returns true on success
    and false on error.


    +   - mixed_com_get(class com_object, string property_name)


    Returns the value of a property on the COM object instantiated in com_object.
    Alias for this function is com_propget(). Returns the property''s value on success
    and on error.


