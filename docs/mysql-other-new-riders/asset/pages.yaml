  md: '# 214 Chapter 6 Database Access with PHP


    +   - It''s not limited to a directory, but can be different for individual files
    of the application, and can even implement authentication levels inside a script.
    It''s possible to hide parts of the script from users who are not allowed to access
    them.


    +   - Users who aren''t known to the system can register before logging in. A
    registration form is offered and the PHPLib will automatically create a standard
    entry in the user database.


    +   - Authentication via PHPLib works even with the CGI version of PHP.


    +   - You can log out cleanly. This means that you can give your users the chance
    to terminate the current sessions (a logout button).


    +   - Users can be logged out automatically after a certain idle time. Doing so
    provides additional security for your application, you can prevent session hijacking
    after a longer idle time.


    # Auth Example


    Let''s go ahead with a basic example. The example in Listing 6.4 shows the default
    PHPLib login screen when you call it for the first time. Log in with the PHPLib
    default username/password pair of user/test. After you have been authenticated,
    you will see your ID, your username, and your permissions.


    Listing 6.4 A basic example of how to use Auth.


    ```

    page_open(array(''sess'' => "Example_Session", "auth" => "Example_Auth\));


    printf("Your session: %s<br>in\n", $sess->id);

    printf("Your User ID: %s<br>in\n", $auth->[''uid'']\);

    printf("Your user name: %s<br>in\n", $auth->[''uname'']\);

    printf("Your permissions: %s<br>in\n", $auth->[''perm'']\);


    page_close();

    ```


    All pages using PHPLib''s authentication follow this general structure. First,
    a page_open() is called; the rest of the script will be executed only after the
    user is logged in and authenticated. You can safely ensure that no user will ever
    see anything from below the page_open() without being logged in. With a one-line
    page_open() call, you have added complete user authentication to your script.
    After you have established the classes you want to use in the application, the
    PHPLib is indeed easy to use lib. Our examples so far have used the examples classes
    provided in the PHPLib distribution. In your work, however, you will want to create
    your own classes (derived from the base classes) to better fit your needs. For
    this, it is necessary to understand a bit more about how PHPLib works internally.'
