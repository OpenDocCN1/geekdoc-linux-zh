  md: '# Sessions


    PHPLib provides least equivalent functionality to PHP’s built-in session management
    library; even the names of the functions are often the same. While it is similar
    in many ways to PHP’s internal session management, it’s not identical. One additional
    feature is the automatic fallback mode (described in the following section).


    # Automatic Fallback


    By default, the session management works with cookies. As outlined in the “HTTP
    and Sessions” of Chapter 4, this should be the preferred technique (when supported
    by the client), and it’s the easiest of session ID propagation. But you can change
    it to the GET/POST method by changing one variable, $mode. The $mode variable
    defines which method should be used as the primary method of session ID propagation.
    It can be either cookie or get; the default value is cookie.

    PHPLib provides an automatic fallback at runtime. If the variable $fallback_mode
    is set to get, the GET/POST method will be used when the preferred mode specified
    in the variable (usually cookie) is not supported by the client. Setting $mode
    to cookie and $fallback_mode to get makes the most sense. PHPLib will try to use
    cookies; if they are not supported, it will fall back to the GET/POST mode. In
    detail, the PHPLib checks for cookie support in this way:


    +   1. On the first request to a PHPLib-powered page, the PHPLib tries to set
    the session cookie named after the Session class instance.

    2. Next, it redirects the user to the same page with the session ID appended as
    query string, using the following code:

    ```

    header("Location: ".$_SERVER[''HTTP_HOST'']->\$this->self_url());

    ```

    3. The PHPLib checks whether the session ID is found in the

    ```

    $HTTP_COOKIE_VARS

    ``` array. If found, the session remains in cookie mode. If the session ID isn''t
    found, the client doesn''t accept cookies and the session switches to get mode.


    # Page Caching


    The Session class also allows you to control how pages are cached. Its class variable
    $allow_cache can be set to no, private or public. Its default value depends on
    the version of the PHPLib; for example, with release 7.2 it’s set to private,
    with subsequent versions it’s set to no. The page-caching mechanism is very similar
    to the one provided in the native session functions of PHP 4.0.'
  merge: -1
