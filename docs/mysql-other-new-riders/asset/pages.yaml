  md: '# 334 Chapter 9 Extending PHP 4.0: Hacking the Core of PHP


    ZVAL_STRING accepts a third parameter that indicates whether the supplied string
    contents should be duplicated (using estrdup()). Setting this parameter to 1 causes
    the string to be duplicated;0 simply uses the supplied pointer for the variable
    contents. This is most useful if you want to create a new variable referring to
    a string''s already allocated in Zend internal memory.


    If you want to truncate the string at a certain position or you already know its
    length, you can use ZVAL_STRING(zval, string, length, duplicate), which accepts
    an explicit string to be set for the new string. ZVAL_STRING and also is faster
    than binary-safe.


