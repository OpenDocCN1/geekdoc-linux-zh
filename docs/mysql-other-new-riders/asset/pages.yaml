  md: '# CVS: Concurrent Version System 179


    CVS is a software that does all of the above—and is free (Open Source). The development
    of PHP itself is managed by CVS, and such successful projects as everyone''s favorite
    Web server (Apache), the Mozilla project, and KDE trust CVS to manage the work
    of dozens of individual developers. Even the XML source code of this book is managed
    with CVS. The authors are in Germany (Till) and Italy (Tobias), the publisher
    (New Riders) and editors are located in the U.S., the tech reviewer is in Australia
    and we all work on one central repository called phpBook or CVS server in northern
    Italy. The repository contains all the text, some PHP utilities to create versions
    of the individual chapters, some resources for XMetal (described shortly), the
    code examples, and the figures. On our systems, we use WinCVS or command-line
    CVS to edit the files and on the work with XMetal, SoftQuad''s CVS editor, in
    a very comfortable way.


    Many projects share a similar scenario: The developers are spread across the globe.
    CVS is ideal for Internet-based software development: it''s a client/server application
    using the Net transport, and maintains a central repository of the source code.
    Within the repository, projects are organized in modules. Each developer checks
    out a module from this repository and works on the local version—this is a great
    way to reduce online time, especially when you have to dial-up Internet access.
    When the developer is done with his changes, he commits the file to the repository.
    The CVS software handles all the rest and does the following:


    +   - Associates a version number to each revision of a file.

    - Stores a log entry for each revision.

    - Keeps track of who has checked out a file to work on it.

    - Warns when you have edited a file you want to check.


    Let''s walk through a CVS session at the beginning of a project. There are two
    developers, John and Jane, who are working on the implementation of an API. We
    assume that their project manager has set a complete CVS server, created a repository
    named f-api (in fictitious API), and set the CVS environment in their variables
    accurately. For more information about the installation of the CVS server or client,
    please refer to the CVS reference manual.


    The first step for developers is logging into the CVS server and checking out
    a copy of the module. This is done using the checkout command, which will create
    a directory named after the module (for example, /f-api).


    ```

    johndev:/mnt/date/home/john > cvs login

    (Logging in as <password>

    VS password: <password>

    johndev@home/john > checkout f-api

    cvs server: Updating f-api

    f-api/config.inc.php

    f-api/f-api_read.php3

    f-api/f-api_write.php3

    ```'
