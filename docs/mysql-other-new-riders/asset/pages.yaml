  md: '# A Session''s Life


    A PHP 4.0 session is started by calling `session_start()` or implicitly as soon
    as you register a session variable with `session_register()`. On startup of the
    library, PHP checks whether a valid session ID exists by performing the following
    actions:


    +   1. If `track_vars` is false, the library checks the global namespace for a
    session ID. If one is found, the library won''t send a cookie with the session
    ID anymore, but it will also define the `SID` constant.

    2. If `track_vars` is enabled and no session ID has been found in the global namespace,
    the `HTTP_COOKIE_VARS` array is checked for a session ID. If one is found, no
    cookie will be set, and the SID will not be defined.

    3. If no session ID has been found yet, the `$HTTP_GET_VARS` and `$HTTP_POST_VARS`
    arrays are checked for a session ID. If one is found, the SID will be defined.

    4. If no session ID has been found, the path `$_REQUEST_URI` is parsed for a string
    in the form `<session-name=<session-id>`. If found, the SID will be defined.


    Generally, the SID will be defined unless the session library knows for that the
    client supports cookies; in other words, unless the session ID is found in the
    `$HTTP_COOKIE_VARS` array.


    If no session has been found with all these checks, or if it has been rejected,
    a new session will be started and a new session ID is created.

    If a valid session ID exists, the frozen variables of that session are reactivated
    and reintroduced to the global namespace. It''s easy to handle session variables
    as it is to handle `GET/POST` variables: If you register a variable foo, `$foo`
    is accessible as a global variable automatically after calling `session_start()`.
    It''s also added to the global `$HTTP_SESSION_VARS` array when `track_vars` is
    enabled. Because the `serialize()` function was improved in PHP 4.0, it''s also
    feasible to treat objects (classes) as session variables.


    # Enable track_vars and register_globals


    You need to have `track_vars` and `register_globals` enabled in your PHP configuration
    to use all functionality of the session-management library.'
  merge: -1
