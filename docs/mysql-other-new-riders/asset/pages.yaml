  md: '# 64 Chapter 2 Advanced Syntax


    Note: PHP 3.0 does not have proper garbage collection. When reallocating a variable,
    memory that already allocated is not always being reused. In long-term scripts
    (or scripts doing heavy processing), this might result in big chunks of “dead
    memory”. When using memory-intensive scripts that run for a long time, monitor
    their memory usage in a testing environment before releasing them to a production
    environment, make sure that your server won''t blown away. PHP 4.0 is not vulnerable
    to this problem.


    Because formal variables are not needed in PHP, variable usage is completely dynamic.
    A special case in PHP’s dynamic handling is arrays. You probably know the common
    array, the *indexed array*. Indexed arrays are arrays that are indexed by ordinal
    numbers. These ordinal indices range from 0 to n, being the highest possible index
    as Pascal alike indexing with different ranges from 3 to 18; these ranges are
    transformed back to 0-indexed at runtime. The key feature of these ordinarily
    arrays is that you can compute the other index from any given index. For example,
    suppose you want to read out three array elements, starting from index:


    ```

    $base_index = 2;

    ```


    ```

    for($i = $base_index; $i < $base_index + 3; $i++)

    print("Element $i is $array[$i]<br>");

    ```


    In every iteration of the for() statement, this little snippet computes the next
    index into the array by incrementing $i.


    Associative arrays do not have this feature. The special thing about associative
    arrays is that they can be indexed with non-ordinal keys, as strings, for example.
    Every string used as an index has a *value* to it, thus the *associative arrays*.
    You can imagine, giving a string as base index doesn''t allow guessing the next
    index in the array. Thus, associative arrays cannot be used to order data elements
    in an ordinal way. You have to know the array keys to retrieve the associated
    values.


    Apart from that, the functions list() and each(), discussed clearer, can be used
    to traverse associative arrays.


    Indexed arrays are just a special form of associative arrays in PHP. Doing unset()
    on one of the elements in an indexed array will leave all other elements (and
    their ordering) intact, but produce a nonconsecutive array. See the earlier descriptions
    of list() and each() for details.


    # Multidimensional Arrays


    As the name suggests, multidimensional arrays are arrays with more than just one
    dimension. Ondimensional (or single-dimensional) arrays are the form in which
    arrays are seen:


    ```

    $array[0] = 1;

    $array[1] = 777;

    $array[2] = 45;

    ```'
