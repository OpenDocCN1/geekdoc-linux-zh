  md: '# About the Technical Reviewer


    Graeme Merrill contributed his considerable hands-on expertise to the entire development
    process for Web Application Development with PHP 4.0. As the book was written,
    he reviewed all the material for technical content, organization, and flow. His
    feedback was critical to ensuring Web Application Development with PHP 4.0 fits
    readers'' need for the highest quality technical information.


    Graeme originally graduated in 1993 with a degree in biochemistry. During his
    university studies, he discovered the Internet while it was still very much in
    its infancy. He led him away from biochemistry into employment with an ISP and
    later with a leading Web design firm in New Zealand, where he developed his skills
    in PHP and ASP.


    As well as programming, Graeme has written for the local newspaper in his former
    home town in New Zealand and has produced several tutorials and articles on PHP
    for Wired Digital''s Web Monkey.


    Born and raised in New Zealand, Graeme currently resides in Sydney, where he runs
    his own consultancy, specializing in e-commerce and business integration with
    the Internet. In his spare time, he enjoys modern literature, music, and crocodile
    wrestling.


    # About Zend Technologies, LTD.


    The Zend Engine is the basic scripting engine that drives PHP. Owned by Zend Technologies,
    LTD, the engine is licensed to PHP for free use under the Q Public license. The
    Zend engine brings to PHP performance, reliability, and an easy-to-use scripting
    interface.


    The history of the Zend Engine began four years ago when the founders, Zeev Suraski
    and Andi Gutmans, joined the core development team of PHP and wrote the scripting
    engine of PHP, which is installed on over a million hosts today. Now, with the
    introduction of PHP 4.0, the Zend Engine has matured into a versatile scripting
    engine, and Andi Gutmans and Zeev Suraski are engaged in developing a host of
    products for enhancing PHP''s performance and commercial value.'
