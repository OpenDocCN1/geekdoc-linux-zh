  md: '# Interface to HTML Developers


    In terms of the HTML interface, abstraction of code and layout is done using templates.This
    is the easiest possibility for tweaking an application to your needs, yet it''s
    also the most powerful. Within seconds, you can change the look and feel—without
    having to modify a single line of code. Everyone with basic HTML knowledge could
