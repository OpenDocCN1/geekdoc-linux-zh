  md: "# Accepting Arguments 327\n\nTo change parameters, however, write access is\
    \ required. Zend deals with this situation in a special way:Whenever a parameter\
    \ to a function is passed by reference, it performs automatic zval separation.\
    \ This means that whenever you're calling a function like this in PHP; Zend will\
    \ automatically use that $parameter is being passed as an isolated value, rendering\
    \ it to a write-safe state:\n\n```\nmy_function(&$parameter);\n```\n\nBut this\
    \ is not the case with regular parameters! All other parameters that are not passed\
    \ by reference are in a read-only state—This requires to make sure that you're\
    \ working with a reference—otherwise you might produce unwanted results. To check\
    \ for a parameter passed by reference, you can use the function ParameterPassedByReference().This\
    \ function accepts two parameters. The first is the function's ht value, and the\
    \ second is the argument number you want to test, counted from left to right,\
    \ as shown in Listing 9.9 and Figure 9.6 (see the CD-ROM for the full source).\n\
    \n9.9 Testing for referenced parameter passing\n\n```\nzval **parameter;\n```\n\
    \n```\nif((ZEND_NUM_ARGS() != 1) || (zend_get_parameters_ex(1, &parameter) !=\
    \ SUCCESS))\n{\n    WRONG_PARAM_COUNT;\n}\n```\n\n```\n/* check for parameter\
    \ being passed by reference */\nif(!ParameterPassedByReference(ht, 1))\n{\n  \
    \  zend_error(E_WARNING, \"Parameter wasn't passed by reference\");\n    RETURN_NULL();\n\
    }\n```\n\n```\n/* make changes to the parameter */\n(*parameter)->type = IS_LONG;\n\
    (*parameter)->value.lval = 10;\n```"
