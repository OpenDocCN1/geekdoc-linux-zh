    result. However, it is a very comfortable way to deal with the input data. As
    soon as new encoding types appear, you only have to create an appropriately named
    function and adjust determine_encoding() to return the correct string.


    As long as you make determine_encoding() bulletproof, meaning that it will always
    return a meaningful string (even if it is a dummy), we would say that this technique
    is technically legal to use. As long as you can make sure that your script will
    remain in a defined state throughout runtime, this way of dynamic data handling
    is fitting for production environments.


    A real-life example of a script that makes use of variable names is phpIRC (discussed
    in the following chapter). phpIRC is an IRC layer for PHP, providing access to
    IRC (Internet Relay Chat) networks through a comfortable API. As handling of input
    is nonlinear and completely user-dependent, phpIRC knows sets of events classifying
    each packet. You can install handlers into phpIRC for each event, to be able to
    react on each type of incoming traffic. phpIRC stores the names of the callback
    functions in an internal array; as soon it arrives, it calls its callback for
    functions matching the detected type of data, calling all matching functions in
    a row. This allows for dynamic data processing similar to the example described
    earlier, and is very handy when you can (or want to) decide how to deal with upcoming
    events only at runtime.


    Taking this further, you can use variable names to change the behavior of your
    scripts at runtime and also install user-defined "plug-ins" that attach to the
    code at runtime, making additional functionality available to the script without
    having to change a single line of code.


