  md: '# Chapter 6 Database Access with PHP


    # # PHPLib: The PHP Base Library


    As we''ve already mentioned earlier in this book, the PHPLib can save you a considerable
    amount of hassle in your daily programming routine. Some concepts will show up
    again and again when developing Web applications: session management, authentication,
    and separation of layout from code. The PHPLib is a solid set of objects that
    provide solutions for these necessary tasks.


    For many programmers, the PHPLib is intimidating when looking at the documentation.
    Indeed, it is a complex set of classes, and the different objects are dependent
    on each other in a nontrivial way. However, once you have mastered the installation
    and the writing of your own base classes, it''s not all difficult to use, and
    you''ll use examples that are straightforward and easily understandable.


    The PHPLib can currently be found at http://phplib.netuse.de/. Its documentation
    provides detailed instructions, so we will rephrase here; we assume that you have
    a properly set up PHPLib environment, with prepend prepended to every script automatically
    (this is the setup recommended in the documentation). Also, we won''t include
    a description of each function and property in this chapter, as the documentation—instead,
    we''ll try to show you the big picture and explain the PHPLib with our own words.


    # ## History


    The first development of PHPLib was performed by Boris Erdmann and Kristian Koenighttopt
    in 1998. Working on a large project at an ISP in Kiel, Germany, they realized
    that they were programming the same procedures again and again. The way in which
    they solved these problems was not very satisfying.


    For example, they needed a login procedure that wasn''t based on HTTP Authentication,
    because this authentication method is neither secure nor user-friendly. For proper
    authentication, they needed working session management (as we''ve outlined in
    Chapter 4,"Web Application Concepts”). So they began to develop an object-oriented
    library for session management and authentication, building on an idea for session
    management by Karl-Heinz Wild. As with many Open Source projects, more and more
    people joined this project over time, and it grew very quickly.


    Today, the PHPLib contains modules for many aspects of authentication and session
    management, but also to create HTML input forms, tables, and trees.


    # ## Advantages and Disadvantages


    As we said in Chapter 1,"Development Concepts," you should choose your words carefully.
    The PHPLib is best suited for projects taking more than two days to develop. The
    first use of the library will cause you to work more than usual: It takes time
    to understand the concepts, and it takes time to resolve of your mistakes.'
  merge: -1
