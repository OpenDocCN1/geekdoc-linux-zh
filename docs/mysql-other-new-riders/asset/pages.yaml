  md: '# PHP Server Integration


    Because MarketPlayer.com''s PHP library is modified constantly, they have compiled
    Apache for loadable modules and built a shared-object implementation for PHP XML
    is not used for content, but is used for internal configuration files. The GNU
    autoc and configure mechanism is used for deploying the varied platforms of development
    and production equipment. Virtually all MarketPlayer.com''s source is either proprietary
    legacy code or Open Source. The database infrastructure is a composite of MySQL
    for prototyping minor chores, and Velocis for core functionality. The efficacy
    of Veloc over other database solutions has yet to be fully demonstrated; however,
    to date, with existing code, the network organizational model appears to outperform
    relational models. This may change as migration to new technology continues.


    # Code Management


    MarketPlayer.com''s content developers work under Windows NT with Safe handling
    version control. However, all of the new technology is appropriately stored in
    CVS. When the department has the necessary tools to work entirely under Linux,
    the aim is to put back into CVS.


    Product directors make MarketPlayer.com teams and organize the code while overseeing
    the implementation by team members. Prototype code is developed to alpha release
    and checked into CVS. These components are then distributed to other developers
    and audited by the directors for security, efficiency, and design. Subsequent
    releases alternate between feature additions, bug fixes, and design improvements.
    Design teams are specialized and highly focused, allowing immediate responsiveness
    to the company''s needs.


    PHP allows component interfaces to be relatively vague during the prototyping
    phase, where functionality is normally implemented inline. As modules come together,
    parameter order and function nomenclature can be finalized without forcing massive
    rewrites. Using PHP, pending functionality can easily be simulated or bypassed
    in the development environment; delivered functionality merges into PHP seamlessly.
    This narrows the design prototype interval and prevents delivery delays from affecting
    other developers.


    # The Future


    MarketPlayer.com is moving toward becoming a 100% PHP site. With over 8 million
    page views a month across all of its sites, MarketPlayer.com finds PHP to have
    absolutely no problems in handling the traffic, and they believe there is no traffic
    frequency PHP couldn''t handle.'
