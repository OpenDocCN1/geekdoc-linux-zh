    \ five times faster than the Java production, with plenty of room for optimization.\n\
    \nNo fundamental flaws have been identified in the system, but relative paths\
    \ in the base `include()` statement have caused a bit of frustration, specifically\
    \ when nesting `includes`. Source and header files use their own directory as\
    \ the base for relative paths. As such, the PHP include statement uses the directory\
    \ of the originally invoked file. Maintaining a directory of source specifically\
    \ for include and referencing files from a hierarchical directory structure can\
    \ be complicated. The workaround was to create a variable for the include directory\
    \ and use only absolute paths when including.\n\nAdditionally, integrating custom\
    \ systems has been complicated with PHP 3.0. MarketPlayer.com has tested PHP 4.0\
    \ and is happier with that model, but until it's out of beta, deployment to production\
    \ servers isn't constrained. Currently MarketPlayer.com is running 3.0.12.\n\n\
    All things considered, MarketPlayer.com has not been constrained by any missing\
    \ components in PHP. There's certainly an interest in a debugging tool that caters\
    \ to PHP if someone produces one; however, immediate needs call for a simple mechanism\
    \ for extending the functionality without the overhead of a `dl1()` call or modifying\
    \ PHP source directly."
