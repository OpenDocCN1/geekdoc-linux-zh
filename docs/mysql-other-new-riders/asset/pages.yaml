  md: '# Polymorphism and Self-Modifying Code 79


    calls the function whose name has been constructed. This implies that for every
    possible constructed name, you have to create a function before in order to let
    the program operate correctly—kind of restricting.


    This can be overcome by completely dynamic programs—programs that generate themselves
    on the fly. Originally this was an idea from the “early” days of programming,
    partially invented by game programmers and virus writers.


    It started with self-modifying code. In the inner loops of games—the procedures
    that were responsible for drawing a buffer to the screen—speed was (is) very crucial.
    However, as processing time was no infinite resource, people had to think of new
    ways of getting the most out of their equipment.


    It was often the case that, in innermost loop, quite a few decisions had to take
    place. For example, if a buffer copy routine only had every second line to the
    screen on some occasions, you would have a few if/then constructs embedded into
    the part of the code that needed them. These constructs took away processing time,
    and since this innermost routine was taking something like 80% of the total processing
    time of the overall program, speeding it up by 50% by removing these constructs
    would result in 40% additional available computing power.


    Creating a set of routines to handle each case wouldn''t have helped much, however;
    you would have wasted space and just moved the decisions elsewhere. Of course,
    eventually you could have gotten a better overall performance, but not the optimal.


    Thus, the technique of self-modifying code was invented. Whenever a part of the
    program would modify one of the conditions of the innermost if/then constructs,
    instead of adjusting the flags accordingly, it reprogrammed the inner loop in
    such a way that it would act as desired; that is, exactly as it would evaluate
    the flags. These necessary modifications were often a matter of changing one or
    two bytes, and no more expensive than setting a set of flags. This would only
    work on the machine code level, of course, and was extremely system-dependent—but
    it was extremely powerful.


    Virus programmers finally took this technique to the extreme by creating polymorphic
    programs. Polymorphic programs are called polymorphic because they change their
    code while performing the same task. The simplest method to create polymorphic
    code was to compress the viruses and choose a different compression algorithm
    or different parameters every time. This resulted in different bytecode after
    every compression, but after decompression the program was restored. (Trying to
    ZIP archives containing the same data with different compression levels—they look
    substantially different, but expand back to the same data.) The more complicated
    method was to rearrange instruction blocks while keeping the algorithmic structure
    intact—a method that sometimes required extremely sophisticated code, but that
    was also very effective. Every method resulted in a change of the bytecode, different
    signatures for each infection of the virus were created, making it almost impossible
    for antivirus software to detect them—while the viruses were able to happily infect
    every program they found.'
