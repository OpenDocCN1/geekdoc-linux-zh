    \nThe two other methods serialize PHP variables into a WDDX struct element, similar\
    \ to the one shown in Listing 7.6. The `wddx_serialize_vars()` function takes\
    \ an arbitrary number of string arguments containing the names of PHP variables.\
    \ The function's return value the WDDX packets as a string. The advantage of this\
    \ is that lets you serialize multiple PHP variables into one WDDX packet; but\
    \ note that when fed to the deserializer, it will result in an associative array\
    \ (of course—the original PHP variable has been earlier converted to a WDDX struct\
    \ tag). In code, a basic example for `wddx_serialize_vars()` would look like the\
    \ following snippet:\n\n```\n$string = 'This is a string.';\n$int = 42;\nprint(wddx_serialize_vars('string',\
    \ 'int'));\n```\n\nThe trio `wddx_packet_start()`, `wddx_add_vars()`, and `wddx_packet_end()`\
    \ works in basically the same way: Multiple PHP variables are transformed into\
    \ a WDDX struct with The difference is that it works as a transaction with three\
    \ steps, the advantage that you can add PHP variables to a WDDX packet over a\
    \ longer run—for example, during a complex calculation. By contrast, the `wddx_serialize_vars()`\
    \ works in an atomic way.You start assembling a packet by calling the `wddx_packet_start()`\
    \ function, which takes one optional argument, the header comment for the WDDX\
    \ packet. This function returns a packet identifier, similar to file identifiers\
    \ returned with `fopen()`.The identifier is used as the first argument in the\
    \ `wddx_add_vars()` function. The arguments are exactly the same as `wddx_serialize_vars()`:\
    \ an arbitrary number of strings, containing the names of PHP variables. A basic\
    \ example:\n\n```\n$i1 = $i2 = $i3 = \"Foo\";\n$packet_id = wddx_packet_start('This\
    \ is a comment');\nfor($i=1; $i<=3; $i++) {\n  wddx_add_vars($packet_id, \"$i\"\
    );\n}\nprint(wddx_packet_end($packet_id));\n```"
