  md: '# 128 Chapter 4 Web Application Concepts


    ![](img/eddeabf7128be657d5f7345abdc760ac_145_0.png)


    # Dynamic Paths with mod_rewrite


    You can avoid the hassle of manually encoding the session ID with a clever trick.
    What if you use the URL like this?


    ```

    http://server.com/~session-id=/page.php3

    ```


    The browser would automatically send the session ID on every request, treating
    it as part of the directory. Of course, if you try to use this format is, you
    will only get a File Not Found error, because there''s no directory that looks
    like the session ID. We need a way to remove the session ID from the path before
    the Web server sends it to.


    This is where mod_rewrite comes into play. This is an Apache module that handles
    complex regular-expression transformations to a URL before it passes to the Apache
    server. Using mod_rewrite, we can simply strip the session ID from the URL; this
    is an internal change to the URL, and only Apache will see it—the client won''t.
    Apache will see a normal request without session ID, while it is still available
    in variables for PHP.


    # Getting mod_rewrite


    The mod_rewrite module is not compiled into Apache by default. Please see Apache''s
    INSTALL file instructions on how to compile Apache with this module.'
  merge: -1
  pgno: 145
- img_proc: true
  md: "An URL like this:\n\n```\nhttp://www.server.com/b6ac8ca8e53cdc43e6078abf04cdb5/script.php3\n\
    ```\n\ncan be rewritten with this rewriting rule:\n\n```\nRewriteEngine On\nRewriteBase\
    \ /\nnRewriteRule ^0-9a-z]{32}//(+) $1\n```\n\nThe first line sets mod_rewrite\
    \ to start up. The second line explicitly sets a base directory, which is only\
    \ needed when using mod_rewrite in a local context, for example in an .htaccess\
    \ file. The third line finally defines the regular expression used for URL rewriting.\
    \ Our expression simply strips out the session ID from the URL.\nto start the\
    \ session, we use a function similar to the one we wrote earlier.\nThe only initial\
    \ result is\n\n```\nfunction session_start_from_rewrite() {\n  global HTTP_HOST,\
    \ $REQUEST_URI;\n\n  preg_match('/([0-9a-z]{32})/(.*)/', $REQUEST_URI, $matches);\n\
    \  $session_id = $matches[1];\n\n  if(!isset($session_id) || empty($session_id))\
    \ {\n    srand(microtime(1000000));\n    $session_id = md5(uniqid(rand()));\n\
    \  }\n\n  $destination = \"http://$HTTP_HOST/$session_id$REQUEST_URI\";\n  header(\"\
    Location: $destination\");\n\n  $_session_id=$session_id;\n  session_start();\n\
    }\n```\n\nDuring all requests, the browser will assume the URL with session ID\
    \ included, and therefore send the session ID automatically. This frees you from\
    \ the hassle of rewriting all links yourself. That is, as long as you use only\
    \ relative links (for example, /directory/script.php3), you still need to rewrite\
    \ those manually.\n\n# Dynamic Paths with PHP 4.0\n\nAutomatic rewriting is one\
    \ of the very cool features of PHP 4.0. To enable it, you need to configure PHP\
    \ with --enable-rewrite and recompile it. The session ID in the form -session-name=<session-id\
    \ will be automatically added to all relative links within your PHP-parsed pages.\n\
    \n# Not for High-Performance Sites\n\nWhile this is a handy feature, it should\
    \ be used with caution on high-performance sites. PHP has to look at each individual\
    \ page, it needs to see whether it contains relative links, and eventually add\
    \ the ID to the links. This obviously introduces a performance penalty. We recommend\
    \ using mod_rewrite or DNS tricks instead."
