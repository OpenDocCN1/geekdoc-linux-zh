    # Longs (Integers)


    Now let''s get to the assignment of data to variables, starting with longs. Longs
    are

    PHP''s integers and are very simple to store. Looking at the zval value container

    structure earlier in this chapter, you can see that the long data type is directly

    contained in the union, namely in the lval field. The corresponding type value
    for

    longs is IS_LONG (see Listing 9.11).


