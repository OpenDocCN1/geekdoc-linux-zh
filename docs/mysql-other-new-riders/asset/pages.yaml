  md: '# Security Considerations


    Security has to be taken into consideration in the very first step of using a
    scripting language—installation. As you know, PHP can be installed as a server
    module (Apache module, ISAPI/NSAPI plugin-in) or as a stand-alone CGI program.


    If you install it as a server module, it''s part of the underlying Web server
    and inherits its security. There are no PHP-specific attacks for this kind of
    setup. Or you still need to make a secure server, but that''s too broad a topic
    to cover here.


    CGI programs, on the other hand, have been famous for a variety of possible attacks—both
    intrusion and denial-of-service attacks. Traditionally, the most serious problems
    arise when putting a script interpreter into the cgi-bin directory of a Web server.
    With some script interpreters, you would be able to execute any command through
    it. PHP tries to prevent some of these attacks. If invoked by the Web, its command-line
    parameters passed by the CGI interface—requests such as http://server.com/cgi-bin/php?passwd=
    will fail.


    Unfortunately, another attack directly related to flaws in the CGI specification
    is still possible: You can access any file below the Web server''s document root,
    even if the directory is protected by HTTP-AUTH (.htaccess file), or by just calling
    through the PHP interpreter: www.server.com/cgi-bin/php/secret_directory/file.html
    would allow you to view file.html if you''re using Apache, enable --force-cgi-redirect
    when connecting PHP to avoid this problem. Please refer to the installation section
    in the PHP manual for more detailed information on this topic.


    Of course, choosing a secure installation is only the first step. A good programmer
    will keep an eye on security throughout the development process. There are so
    many possible risks that we can''t possibly cover them all within this chapter.
    Instead, we''ll try to give you some generally applicable advice.


    # Don''t Trust the Web


    All data coming from the Web is insecure and should be validated by your application.
    For example, there''s no guarantee that your script is invoked from as form interface—users
    could bypass the HTML form and call the script directly, possibly specifying parameters
    via their own GET or POST.


    Validating data is one of the most tedious tasks a Web application developer has
    to do in his or her daily work. Basic checks can be automated with the routines
    of the library featured in Chapter 5,"Basic Web Application Strategies." For more
    complicated validation, we haven''t found a generic way yet—so we do it manually.
    Such scripts follow the typical logic outlined in Chapter 5, which we call the
    PHP Normal Form.'
