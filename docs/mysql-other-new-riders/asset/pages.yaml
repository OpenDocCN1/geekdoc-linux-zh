  md: "# An API Design Example 29\n\n```\nwhile($current_timestamp < $range)\n{\n\
    \  $timestamp[] = $next_event_timestamp;\n  $description[] = $next_event_description;\n\
    }\n```\n\nThis pseudocode would fill two arrays, $timestamp and $description,\
    \ with all upcoming in the requested range. Index 1 would thus contain the timestamp\
    \ for event 1 in $timestamp[0] and the description for event 1 in $description[0].\n\
    \nThis is a sub-optimal solution, however, having two variables handling grouped\
    \ elements is poor style. To handle grouped elements, a grouping datatype should\
    \ be used—either a class to create structured types in PHP or an associative array.\n\
    \nAssociative arrays have the advantage of being searchable by key (the indexing\
    \ component in regular arrays, usually 0, 1, 2, 3, and so on) and by value (the\
    \ information component), but have no predefined structure. Moreover, they have\
    \ a variable structure that can be changed on the fly, resulting in data that's\
    \ no guaranteed to have a valid structure, and are a bit clumsy to handle.\n\n\
    Classes have the advantage of showing their structure perfectly, but need a predefined\
    \ datatype. If we defined a datatype for the return value, for consistency we\
    \ would also use this datatype to create and delete events. This would require\
    \ us to modify the existing functions afterward—it's easier to add just one function.\
    \ You can see now that theoretical planning beforehand could have saved us valuable\
    \ time; defining a structured datatype for appointments before starting to define\
    \ the first two would have enabled us to use this datatype, leaving us with a\
    \ straight-to-the-point solution that we could reimplement in our list function.\n\
    \nSince a class would introduce a break into the code, we'd use an associative\
    \ array. The list isn't returning an error code, so we'll use the return value\
    \ of the function to pass the data back to the caller. Remember that if you intend\
    \ to use error codes, you should make all functions return an error code if they'll\
    \ all succeed. Usually, the user of your API won't know whether a function can\
    \ fail, and will expect every function to return an error code if some of your\
