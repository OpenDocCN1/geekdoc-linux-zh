  md: '# Chapter 3 Application Design: A Real-Life Example


    So let''s get back to answering the question: Do we need an open (and perhaps
    too complex) protocol as IRC, or should we stick with a conventional database
    protocol? The simplest method to find an answer is also the most logical one—compare
    pros and cons and choose the option with the best results.


    Implementing IRC as a protocol into the chat system will introduce a significant
    amount of complication because protocol processing—processing network protocols
    requires nonlinear coding, something that isn''t really supported by PHP. (To
    react to network messages, we need an event-based system). On top of that, we
    are dealing with messages from a user and for a user (which, unfortunately, may
    not always be in the same way). This problem exists in the database-backed solution,
    too of course, but the database-backed solution doesn''t require protocol handling.
    A lot of databases are supported natively by PHP, and those that aren''t most
    likely supported indirectly by ODBC. To gain the advantage of noticeable chat
    boxes, we only need to create a tool that can synchronize between boxes. (Unless
    you only want to run one central database server that''s accessed by all boxes
    simultaneously.)


    What would you choose?


    Spoiler: phpChat is based on IRC, and this is why:


    +   Using a database, we would introduce some kind of ''proprietary,'' private
    protocol that wouldn''t be able to interface with other standard systems. In times
    of interoperability and interconnectivity, this is a bad thing.


    +   An IRC library that functions well (namely phpIRC, see www.phpwizard.net/phpIRC)
    abstracts access to IRC networks into a set of easy-to-use API functions—and makes
    IRC handling database handling in terms of complexity.


    +   Existing IRC server handles all the itsy-bitsy teeny-weenie problems of user
    management, reliable traffic forwarding, routing, etc., across networks. The software
    has been around for a long time and is proven to work, plus it is available for
    all types of systems.


    +   IRC is extremely scalable. If you run into load problems on server A at peak
    times or due to unforeseen events, simply fire up server B and dynamically establish
    a server connection into the existing chat (IRC allows you to do, and you have
    another server with free capacity for additional users.'
