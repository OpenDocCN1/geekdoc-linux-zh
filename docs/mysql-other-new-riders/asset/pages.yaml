    Each of the plug-ins is built up in the same way, consisting of a main part and
    an event. The main part calls two functions in phpChat: chat_register_plugin_init()
    and chat_register_plugin_deinit(). Each function takes a parameter name of another
    function, which should be called for plug-in initialization and deinitialization,
    respectively.


    phpChat adds these functions to an internal table. Upon initialization of the
    chat, as soon as phpChat is fully set up, it makes a run through the initialization
    table and calls the initialization function of every plug-in that registered itself.
    Similarly, upon shutdown, it runs through the deinitialization table. This method
    allows signaling the plug-ins to activate and deactivate themselves.'
