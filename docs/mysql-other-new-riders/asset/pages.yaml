    \ definition, which is under development at the time of writing.\n\n# EBNF—Or\
    \ \"What the Heck Is That Again?\"\n\nAs a Developer, you'll frequently be faced\
    \ with the task of reading specifications—project specs, formal language definitions,\
    \ or standards papers. When reading some of the specifications from the W3C (the\
    \ most well-known are HTML and XML documents, probably), you'll stumble across\
    \ a strange mixture of characters that presumably form a grammar definition.\n\
    \n```\ndocument ::= element E*\n```\n\nThis is the first syntax definition in\
    \ the XML specification and defines the basic structure of an XML document. The\
    \ notation is called Extended Backus-Naur Form, or EBNF for short. Understanding\
    \ formal specifications will get a lot easier once you understand the basics of\
    \ EBNF.\n\nEBNF is a formal way to define the syntax of a programming language\
    \ so that there's no ambiguity about what is valid or not. It's also used in many\
    \ other standards, such as protocol or data formats and markup languages like\
    \ XML and SGML. EBNF makes for a very rigorous grammar definition, there are software\
    \ tools available that automatically transform a set of EBNF rules into a parser.\
    \ Programs that do this are called compiler compilers. The most famous of these\
    \ is YACC [Yet Another Compiler Compiler], but there are many more."
