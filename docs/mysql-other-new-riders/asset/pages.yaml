    name of the release:


    ```

    jane@:/home/jane/f-api ~ cvs tag rel-10

    ```


    If she needs to retrieve the release version at a later time, she can simply issue
    a cvs checkout command on this tag:


    ```

    jane@:/home/jane/f-api ~ cvs checkout -r rel-10 f-api

    ```


    And voilà, there''s release 1.0. It will be created in the /f-api directory. Branches
    are a bit complex, but you can think of them as stricter tags. Indeed, when you
    want to have a more rigorous separation of two code bases (which are still related
    to a single project), you''d create two branches. To get back to our example,
    John and Jane want to separate a development version of their API and a stable
    version—just as the Linux kernel development.


    A new branch is created using the cvs tag -b command. To start a development branch
    with the current code base, Jane executes this command:


    ```

    jane@:/home/jane/f-api ~ cvs tag -b dev

    ```


    The name of the newly created branch is dev. To create a local copy of this branch,
    Jane checks it out from CVS as she would normally, with a tagged version:


    ```

    jane@:/home/jane/f-api ~ cvs checkout -r dev f-api

    ```


    The difference between tagged files and branched files becomes apparent now: Jane''s
    future commits will act on this and use the dev branch, enabling her, stable branch.
    All commits, updates, and so on will use the dev branch, enabling her to work
    on the development branch without altering the main branch. But be careful: Maintaining
    different branches can be an administration nightmare. We suggest that you use
    a maximum of three branches per project.


    Tip: To see which branch a file belongs, use cvs status. The Sticky output will
    contain the branch name and revision number


    A common task is merging a branch back into the main branch. From time to time,
    Jane needs to add the new features from the development branch to the main branch.
    This is done by first checking the main branch and then applying the diffs from
    the development branch:


    ```

    jane@:/home/jane/ ~ cvs checkout f-api

    jane@:/home/jane/f-api ~ cvs update -j dev

    ```


    The -j (join) option in the cvs update command tells CVS to merge the differences
    from the development tree to the local copy.


    Tip: The main tree''s branch name is always HEAD. Knowing this, Jane could merge
    the main tree to the local development branch by executing cvs update -j HEAD.


    After resolved potential conflicts, Jane can now commit her copy to the main tree,
    and the backport is complete.'
