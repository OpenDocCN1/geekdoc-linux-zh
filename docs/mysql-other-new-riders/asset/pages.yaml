  md: '# IRC Network Basics


    Chosen a communication standard for the chat, we should take a look at how exactly
    IRC networks are built.


    > Ideally, you should have evaluated the IRC network basics discussed in this
    section prior to choosing IRC—since it''s a bad thing to find out that IRC introduces
    a complicated structure after already making the decision to use it. To this point,
    however, we''ve been working with “common knowledge” about IRC networks, just
    for the sake of application planning. Now that we''ve led you to the “right” method
    to use for the application (IRC), this section provides the details you need to
    execute that plan.


    IRC networks distinguish between clients and servers. Users can participate on
    the network only by using a special software that establishes a client to a server.
    All servers on the network are interconnected using special servers. Current implementations
    of IRC servers only support hierarchical structures, meaning that there must not
    be redundant ways to reach a server. This forms the net into a tree-like structure
    prone to splits, but also greatly simplifies routing: All servers simply have
    to send all incoming data to all other links, without fearing such redundant information
    to a server.


    Each server can have a number of clients; the maximum number depends on the number
    of connections the server is willing to accept (course, limits also exist in terms
    of network capacity and server load). As shown in Figure 3.2, each server can
    reach every other server through more or fewer hops, so each server simply sends
    all incoming data to all outgoing links. For example, Server C and F might carry
    clients participating in the same channel (channels are IRC’s chat rooms—places
    where people can “meet” and “talk”). In this example, Server C would send the
    data via the only link it has; Server B then distributes the data to its other
    links, namely Server A and Server D. Server A doesn''t have other links, so it
    won''t do anything, Server D would pass the data to Server E, and Server E in
    turn to Server F Pretty easy but with one drawback: Server A doesn''t any clients
    connected to participating in the channels to which Server sends data, all data
    for Server A targeted at this channel would simply waste bandwidth.


    # RFC for IRC


    Similar to all open standards on the Internet, the basics of the IRC protocol
    have been specified in an RFC (Request For Comments). The RFC for IRC is RFC 1459,
    which can be retrieved, for example, at www.irhelp.org, a site that carries a
    lot of information on IRC.'
