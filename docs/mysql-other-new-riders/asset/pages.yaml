    \ the node from which to start, and the assignment to $node will create a copy\
    \ of it. The fact that its copy is not important for a function that simply recurs\
    \ the tree and prints the node contents, but it can be very important as you plan\
    \ to change the tree somewhere.\n\nNow assume that you want to write a function\
    \ that appends a new node to the leftmost leaf in the tree. No problem—just write\
    \ recursive function that counts the jumps to the left and returns the leaf with\
    \ the highest count. After that, simply change the child links of this object\
    \ and you're done. Wait a second. Are you ready done? Think a moment about what\
    \ you've changed (see Figure 2.8). You've changed the copy of the leftmost leaf,\
    \ not the leaf itself! As soon as your function returns, your changes are lost,\
