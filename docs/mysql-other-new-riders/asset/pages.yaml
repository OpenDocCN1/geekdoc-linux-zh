    # Managing Permission Levels


    In a typical application, you''ll generally have two permission levels: users
    and administrators. However, some applications require more sophisticated access
    control. A content-management system, for example, needs many permission levels:


    +   - Superuser, able to change anything in the system, to modify the system,
    etc.


    +   - Editors, who can edit articles and content, and approve content submitted
    by authors.


    +   - Authors, who can create content, submit it for approval to editors, but
    not approve content.


    +   - Users with read-only access.


    Since you know the currently logged-in user and can identify him or her with a
    unique string ($uid), it wouldn''t be hard to write functions to associate the
    user with a group and present content according to this group. The PHPLib has
    built-in functionality for handling this.


    To use the Perm class, you can add another element to the page_open() call. The
    PHPLib Perm, but here the same principle applies that we mentioned: To make use
