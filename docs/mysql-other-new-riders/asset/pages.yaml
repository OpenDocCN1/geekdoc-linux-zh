    Writing %s chosen.\", %s\", (HOBBY_WRITING & $pattern) ? \"is\" : \"is not\");\n\
    \nTo unset the writer, you can use this line:\n\n$pattern &= ~HOBBY_WRITING;\n\
    \nThe actual check for the needed permission level is done using the\n$auth->have_perm()\
