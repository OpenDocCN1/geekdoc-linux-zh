  md: '# 56 Chapter 2 Advanced Syntax


    tree_allocate_node() searches for a free node within the tree array by checking
    the $free flag for each existing node. If none of the nodes is marked as being
    free, it simply allocates a new one and adds it to the tree array. This is where
    PHP''s dynamic structure comes in handy—if we use arrays of fixed sizes, we run
    out of nodes sooner or later. The found node is marked as being in use and returned
    as a handle to the caller.


    tree_free_node() does basically the opposite: It marks the specified node as being
    unared by clearing the $free flag. This imposes three problems: First, free nodes
    are not really freed; they''re just marked as free. Suppose you want to construct
    a complex tree with lots of nodes and run an optimizer over it, which generally
    decreases the node count by free and leaves of “ghost nodes” in the array after
    the optimization. Assume that you would allocate 1,000 nodes and free 500 of them
    during optimization. This would result in an array consisting of 1,000 nodes,
    but 500 of them are marked as being used. This is quite a waste of memory, so
    an automatic garbage collector would be a nice idea for these special cases.


    Garbage collection leads to the second problem, namely zombie nodes. Zombie nodes
    are those that are marked as being in use, but unlinked from the tree, unable
    to be referenced anymore (see Figure 2.10).


    ![](img/eddeabf7128be657d5f7345abdc760ac_73_0.png)


    Figure 2.10 Zombie nodes in a tree.


    As the library knows about all nodes in the tree and their internal linking between
    each other, zombie nodes can easily be identified—this is still missing in the
    code, however.


    The third problem is quite similar to zombie nodes: broken links. Broken links
    are links that originate from one node and point to an unused/nonexistent node
    (see Figure 2.11). Links “break” whenever you detach a node from the tree, marking
    it as free, before having modified all other nodes that reference this node.'
