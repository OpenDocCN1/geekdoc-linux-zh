  md: "# The PHP Normal Form 169\n\nFrom our experience, the PHP Normal Form (shown\
    \ in Figure 5.1) is the most versatile option to process forms. Of course, other\
    \ strategies may fit better to your specific needs, but the logic we outline in\
    \ the Normal Form is so generic that it can be applied to most forms. Basically,\
    \ the PHP Normal Form combines the user interface (the form) and application logic\
    \ in one page, while separating HTML layout from code. On the first request of\
    \ the page, the form is shown. When the user submits it, the application validates\
    \ the data.\n\n![](img/eddeabf7128be657d5f7345abdc760ac_186_0.png)\n\nFigure 5.1\
    \ The PHP Normal Form.\n\nLet's construct a simple form as an example (Listing\
    \ 5.1 shows the source). We want the user to enter or her name and email address.\
    \ At the top of the script, the application logic checks whether the script has\
    \ been invoked by submitting the form. If this is the case, the CGI environment\
    \ variable $REQUEST_METHOD is set to POST and the application knows it should\
    \ begin to validate the data.\n\n# Listing 5.1 Sample PHP Normal Form.\n\n```\n\
