    | E_ERROR | Signals an error and terminates execution of the script immediately.
    |

    | E_WARNING | Signals a generic warning. Execution continues. |

    | E_PARSE | Signals a parser error. Execution continues. |

    | E_NOTICE | Signals a notice. Execution continues. Note that by default the display
    of this type of error messages is off in php.ini. |

    | E_CORE_ERROR | Internal error by the core; shouldn''t be used by user-modules.
    |

    | E_COMPILE_ERROR | Internal error by the compiler; shouldn''t be used by user-modules.
    |

    | E_COMPILE_WARNING | Internal warning by the compiler; shouldn''t be used by
    user-modules. |


    ![](img/eddeabf7128be657d5f7345abdc760ac_363_0.png)


    Figure 9.8 Display of warning messages in the browser.


    # Including Output in phpinfo()


    After creating a module, you''ll want to show information about the module in
    phpinfo() (in addition to the module name, which appears in the module list by
    default). PHP allows you to create your section in the phpinfo() output with the
    ZEND_MININFO() function. This function should be placed in the module descriptor
    block (discussed earlier) and is always called when a script calls phpinfo().


    PHP automatically prints a section in phpinfo() if you specify the ZEND_MININFO
    function, including the module name in the heading. Everything else must be formatted
    and printed by you.'
