  md: "# 234 Chapter 7 Cutting-Edge Applications\n\nThe resulting reference (blockname)\
    \ can be handled like references produced with set_file(), and parsed largely.\
    \ Admitted, this is confusing when you first hear it. Let's see how the Template\
    \ class works conceptually An important logical unit of the Template class is\
    \ handles. Handles are similar to link identifiers (resource IDs); they can point\
    \ to a dataset and be used in various functions as reference to this dataset.\
    \ You can create handles using one of three methods:\n\n+   - set_file() creates\
    \ a handle for a template file\n- set_var() creates a handle for a placeholder\
    \ inside a template\n- set_block() creates a handle for a block inside a template\n\
    \nWith each of these functions, you can specify the handle that should be created.\
    \ set_file() and set_var(), the handle to create is the first argument (or the\
    \ keys of the array, if an associative array is passed as argument). In set_block(),\
    \ the handle is the second argument. In functions like parse(), subst(), or get_undefined(),\
    \ you use the previously created handles to reference the dataset functions should\
    \ process. For the functions, it doesn't matter how the handle was created—through\
    \ on template files as well as on placeholders or dynamic blocks. Let's look at\
    \ a simpler example again. Say you've got one template file with one placeholder\
    \ and one dynamic block:\n\n```\n<PLACEHOLDER></p>\n<ul>\n  <!-- BEGIN block -->\n\
    \  <li>BLOCK_PLACEHOLDER</li>\n  <!-- END block -->\n</ul>\n```\n\nTo parse this,\
    \ first define a handle for the whole file using set_file(). The normal handle\
    \ can be treated normally, just as we've shown earlier. Then you define a block\
    \ handle. This block can be treated the same way as you would treat the file itself—it's\
    \ an equally important, independent division inside the file. Therefore, you can\
    \ also combine the handles as we've done earlier with the two separate files.\
    \ In this code, what would look like this:\n\n```\n$tpl->set_file('page', 'page.inc.html');\n\
    \n// Assign value to scalar placeholder\n$tpl->set_var('PLACEHOLDER', 'This is\
    \ just a test.');\n\n// Create block handle, named 'block'\n$tpl->set_block('page',\
    \ 'block');\n\n// Create three block instances\nfor($i=0; $i<3; $i++) {\n  ////\
    \ Replace placeholder for this loop iteration\n  $tpl->set_var('BLOCK_PLACEHOLDER',\
    \ 'Loop #$i');\n}\n```"
