  md: 'Binding from a lower security level to a higher level (as when importing variables)
    requires more care. You can''t assume that the supplied data meets any requirements—even
    if if supplied the data to the client in the first place. For example, you could
    check data in an HTML form with JavaScript on the client side, but you can''t
    assume that the data is in the format you expect because the user could have turned
    off JavaScript, or could have submitted the form from a Telnet prompt. Another
    common error is supplying data and taking it for granted that it never changed.
    For example, a page might display information for a user, called after the user
    logged in with a query string like script?user_id=1. Of course, nothing prevents
    the user from "injecting" script to something other than 1 and editing your data''s.


    Many applications today check contents provided by one user for another user.
    For example, it will be hard to find a message board allowing you to <script>
    tags or similar HTML code. For a developer, an easy mistake is to check only this
    kind of—and neglecting that it''s to be used only by the client itself. After
    all, why would a user enter malicious code that only the user will see?


    The point is that "injecting" script or HTML code into the application is a severe
    trust violation. The malicious code is executed with the application''s security
    level: it appears to be from the application itself.


    Often, users can be tricked into seeing content that originally was only for another
    user''s eyes. Let''s construct a search engine, phpVista. A user submits a keyword,
    and the engine searches the Web for. As you plan it, you imagine that only the
    user who wants to actually search will see the results, so you don''t bother encoding
    special characters into the keyword. A user could enter <script>alert(''Hello
    World'')</script> as a keyword and would actually get a JavaScript pop-up message
