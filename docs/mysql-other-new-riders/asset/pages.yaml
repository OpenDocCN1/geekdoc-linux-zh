  md: '# Interfacing the Network


    As we mentioned earlier, IRC requires some processing overhead. Hacking a complete
    protocol handler for interfacing with IRC is a bit of a complex task, but we favored
    IRC instead of the database-backed solution because an API already exists that
    does this work for us.


    > Know the market! It''s essential for every programming project to know which
    parts have already been done by other people and still need to be done. Neverve
    reinvent the wheel! Especially for commercial projects, it can pay off tremendously
    to buy bulletproof solutions for specific tasks, rather than design and develop
    one yourself. The latter is sometimes more expensive and much more time-consuming—a
    process that is constantly being independent of your own project. By receiving
    an upgrade from an external company, you simply replace a part of your application
    with a new version. This is why you can upgrade certain parts of your application
    without having to put your own work into the changes. Plus, when using existing
    libraries, you automatically agree to build your project on common, standardized
    APIs, which is always a great benefit.


    On the other hand, binding yourself to foreign products can prove to be a negative
    decision if the producer fails to improve the product or keep it up to date, as
    well as if bugs in it''s not corrected.


    In our experience, Open Source products have the most successful external parts
    to be integrated. Open Source products are being improved and extended extremely
    rapidly and are usually oriented at common and open high-potential standards.


