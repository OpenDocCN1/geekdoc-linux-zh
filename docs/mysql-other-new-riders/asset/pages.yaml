    \ right tree:<br>');\n    traverse_tree($node->right);\n}\n```\n\nForgetting the\
    \ moment this recursive function will never return because our tree doesn't have\
    \ a stop-marker set (the function won't know which node actually has a child and\
    \ which node doesn't), let's take a look at how it works and how PHP will handle\
    \ it.\n\nThe critical point is already reached in the first line, where $node\
