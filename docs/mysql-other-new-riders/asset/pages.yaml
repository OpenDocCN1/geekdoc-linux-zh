  md: '# About the Authors


    Tobias Ratschiller is a new media consultant based in Italy. With extensive knowledge
    of software development, database design, and content-management systems, he specializes
    in the creation of large-scale, dynamic Web sites. He has provided consulting
    and implementation services for some of the world’s largest Web sites and has
    contributed to several books and articles on PHP. He teaches at seminars throughout
    Europe and is a frequent speaker at leading conferences.


    Till Gerken is a freelance developer and consultant for various companies, focusing
    on the creation of Web applications for Internet-based services. His background
    ranges from using C/C++, Pascal, and x86 Assembler to create such high-performance
    multimedia systems as 3D engines and real-time sound mixers, to use PHP and its
    associated tools to create medium- to large-scale, dynamic Web sites.'
