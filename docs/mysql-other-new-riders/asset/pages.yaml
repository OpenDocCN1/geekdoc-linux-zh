  md: '# Creating Extensions 303


    The default file creates two configuration directives in the configure script:

    --with-my-module and --enable-my-module. The first option when referring

    external files (such as the --with-apache directive that refers to the Apache
    directory).

    Use the second option when the user simply has to decide whether to enable your

    extension. Regardless of which option you use, you should uncomment the other,

    unnecessary one; if you are using --enable-my-module, you should remove

    support for --with-my-module, and vice versa.


    By default, the config.m4 file created by ext_shell accepts both directives and

    automatically enables your extension. Enabling is done by using the

    PHP_EXTENSION macro. To change the behavior to include your module into the

    PHP binary when desired by the user (by explicitly specifying --enable-my-module
    or

    --with-my-module), change the test for $PHP_MY_MODULE to == "yes":


    ```

    if test $PHP_MY_MODULE == "yes"; then

    dnl Action.

    PHP_EXTENSION(my_module, xt_shared)

    fi

    ```


    This would require you to use --enable-my-module each time you reconfiguring

    compiling PHP


    Note: Be sure to run build every time you change config.m4.

    We''ll go into more details on the M4 macros available to your configuration scripts

    later in this chapter. However, we will use the default files. The sample sources
    on

    t CD-ROM all working config.m4 files. To include them in the PHP build

    process, simply copy the source directories to your PHP ext directory, run buildconf,

    and then include the sample modules you want by using the appropriate

    --enable-* directives with configure.


