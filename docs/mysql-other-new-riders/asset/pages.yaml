  md: "# PHP’s Built-in Session Library\n\nLuckily, PHP 4.0 has basic session management\
    \ built in, as shown in Listing 4.1. While it’s very easy and straightforward\
    \ to use and may suffice for your needs, it lacks some of the advanced features\
    \ that the PHPLib provides. Because the PHPLib also provides modules for user\
    \ authentication, permission management, and a database abstraction layer, it’s\
    \ still a very important library, and is covered in Chapter 6,”Database Access\
    \ with PHP”\n\nListing 4.1 A basic example of using PHP’s built-in sessions.\n\
    \n```\n// Start the session\nsession_start();\n\n// Init the counter\nif(!isset($counter))\
    \ {\n    $counter = 0;\n}\n\n// Output session ID and counter\nprintf(\"Our session\
    \ ID is: %s<br\", session_id());\nprintf(\"Our counter value is: %s\", $counter);\n\
    \n// Increment the counter\n$counter++;\n\n// Register our session variable\n\
    session_register(\"counter\");\n```\n\nThis example displays the session ID and\
    \ a counter that increments each time you access the page. Of course, this is\
    \ different from a normal page counter—the session (and thus the counter) is tied\
    \ to one specific user. With PHP’s default configuration, the session has a lifetime\
    \ of ; if you close the browser and reopen it, the counter starts from zero, as\
    \ the cookie has been deleted.\n\nLet’s take a look at the PHP 4.0 session functions.\
    \ PHP’s session management library offers the characteristics described:\n\n+\
    \   * It stores session data on the server. Because the library uses different\
    \ storage modules, you can keep the data in plaintext files, shared memory, or\
    \ databases. This reflects exactly what we explained about storage media:Where\
    \ exactly data is being kept isnt really important (well, long as the performance\
    \ of the medium is sufficient).\n* It uses a random session ID to identify a user.\n\
    * It saves the session ID (and only the session ID) on the client side using cookies,\
    \ GET/POST, or the script path. (The PHP library provides all of these methods;\
    \ we show how to use them a later)\n* If the user has disabled cookies, the application\
    \ can use other means of session propagation."
  merge: -1
  pgno: 149
