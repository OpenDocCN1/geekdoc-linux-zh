  md: "# 222 Chapter 6 Database Access with PHP\n\nIn code, you can define the hobbies\
    \ with a simple bit shift:\n\n```\ndefine(\"HOBBY_READING\", 1 << 0);\ndefine(\"\
    HOBBY_PROGRAMMING\", 1 << 1);\ndefine(\"HOBBY_WRITING\", 1 << 2);\ndefine(\"HOBBY_HIKING\"\
    , 1 << 3);\n```\n\nIf the user chooses writing and programming as hobbies, you\
    \ can create a pattern by ORing these values:\n\n```\n$pattern = HOBBY_WRITING\
    \ | HOBBY_PROGRAMMING;\n```\n\nLater, you can test whether the user has chosen\
