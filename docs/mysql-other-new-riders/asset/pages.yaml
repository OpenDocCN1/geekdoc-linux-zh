  md: 'The functions are defined as follows:


    +   - bool open(string save_path, string sess_name)


    This function is executed on the initialization of a session; you should use it
    to prepare your variables, to initialize variables, or the like. It takes two
    strings as arguments. The path is where sessions should be saved. This variable
    can be specified in php.ini or by the session_save_path() function—you can use
    this variable as a wild card and it for module-specific configuration. The session''s
    name, by default PHPSESSID. The open() function should return true on success
    and false on error.


    +   - bool close()


    This function is executed on shutdown of a session. It is used to free memory
    or to destroy your variables. It takes no arguments and should return true on
    success and false on error.


    +   - mixed read(string sess_id)


    This important function is called whenever a session is started. It must read
    out the data of the session identified with sess_id and return it as a serialized
    string. If there is no session with this ID, an empty string " should be returned.
    In case of an error, false should be returned.


    +   - bool write(string sess_id, string value)


    When the session needs to be saved, this function is invoked. The first argument
    is a string containing the session''s ID; the second argument is the serialized
    representation of the session variables. This function should return true on success
    and false on error.


    +   - bool destroy(string sess_id)


    When the developer calls session_destroy(), this function is executed. It should
    destroy all data associated with the session sess_id and return true on success
    and false on error.


    +   - bool gc(int max_lifetime)


    This function is called on a session''s startup with the probability specified
    in gc_probability. It''s used for garbage collection; that to remove sessions
    that weren''t updated for more than gc_maxlifetime. This function should return
    true on success and false on error.


    The example in Listing 4.2 puts the callback functions into action, defining a
    storage module to save data to a MySQL database. (The full example, including
    the necessary MySQL table schema, is included in the CD-ROM accompanying this
    book.) Because session_set_save_handler() currently accepts only simple functions
    and no class, we used old procedural programming instead of a class. Because inheritance
    or multiple instances wouldn''t make sense for this type of code anyway, it''s
    not a big loss.'
