  md: '# Security Considerations


    the cookie information and set it to the attacker''s Web site, where he or she
    waits for incoming session IDs, takes over the other users'' sessions, and buys
    some nice gifts for the folks phpwizard.net.


    We''re good at making stories, this could have really happened: Amazon''s product
    search engine didn''t properly encode tags—until two days after a related security
    advisory from the CERT was released, which could be found at www.cert.org/advisories/CA-2000-02.html.


    Even if you have this in mind and all user-supplied variables, it''s very easy
    to make the wrong checks. For some applications, for example, it is desirable
    to allow certain HTML tags in data. One of these is the <p> tag, which allows
    for matching text in paragraphs. It can take an align attribute, on a first try
    you could use the regular expression [/]. But many browsers support general scripting
    on a wide variety of tags; a as onclick onmouseover event can execute malicious
    code.


    The first step is to understand that all these together result in a ugly picture.
    You have to be really careful if you want to avoid all traps. This is also the
    main reason we recommend having dedicated security consultants in an application-development
    team.


    Some very hints and guidelines to minimize these risks:


    +   - Use sessions instead of passing data to page on the client.

    - Validate all data from user space; this may include encoding or replacing the
    less-than sign (<), the greater-than sign (>), and the ampersand (&), and paying
    special attention to double quotes ("), single quotes (''''), and whitespace,
    at least in attribute names and values.

    - Make sure that your application operates in a trusted environment.

    - Pay attention to PHP''s variable order (see the next section).


    # PHP''s Variable Order


    You know that PHP automatically makes all GET and POST variables in the global
    namespace. Did you know that you can turn off this feature in PHP 4.0?


    Although the automatic introduction of variables is one of the features that make
    PHP easy for novice users, it can be problematic in larger and more complex applications.
    If you use user-passed variables from the global namespace, you can''t be sure
