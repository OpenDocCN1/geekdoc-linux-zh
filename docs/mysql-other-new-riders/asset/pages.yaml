  md: '# 186 Chapter 5 Basic Web Application Strategies


    # Automated Notifications


    At this point, Jane will have to inform her colleague again of the merge. As we''ve
    said, CVS cannot replace effective communication within the team. But it can help.


    The CVS server can be set up to perform a certain action on each commit. Sending
    email to a mailing list server could be such an action. By setting up a mailing
    list or alias group for each project, it''s easy to broadcast all commit messages,
    logs, to all project members.


    To accomplish this, one of the CVS administrative files, namely the login file,
    needs to be edited. This file controls how information is handled—you can send
    it by mail, also log it to a file, store it in a database, CVS.


    You can alter the administrative files directly in the system''s CVSROOT. The
    recommended way to change them is via CVS, this way—you will have all the regular
    features and the safety net of CVS. To start a session, check out the CVSROOT
    directory.


    ```

    janedev:/home/jane/ > cvs checkout CVSROOT

    ```


    Then edit the login file. The first part of a line is a regular expression that
    is tested against the directory or file being committed. If a match is found,
    the remainder of the line is to be invoked. The program should expect the commit
    information on standard input. You may also have one line in the file starting
    with DEFAULT instead of a regular expression. This directive will be considered
    if no directory is matched. Another directive is ALL, which will be invoked in
    all cases. Two examples for such as:


    +   * phpBook$/cvs/logininfo_process_phpBook.sh

    * ALL /cvs/logininfo_process_all.sh


    The first script, logininfo_process_phpBook.sh, is only invoked for the phpBook
    repository. The second script, logininfo_process_all.sh, will be invoked on every
    commit, regardless of the repository; because it is marked with the ALL keyword.


    As part of the protocol to be invoked, a special variable can be used to give
    extended information about the commit. These variables are identified by a preceding
    percent sign (%), similar to the format declaration in printf(). If more than
    one variable is used, they must be grouped inside curly braces. The available
    variables are shown in the following table.


    | Variable | Meaning |

    | s | Filename |

    | V | Version number before the commit |

    | v | Version number after the commit |


    As soon you use one of these variables, another string containing the name of
    the CVS module is automatically added before the variable.'
