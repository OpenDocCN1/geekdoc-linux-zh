  md: '# Foreword by Zeev Suraski


    When I first came across PHP about three years ago, I never imagined that one
    day I''d be writing a foreword for a PHP book. A matter of fact, back then, the
    possibility that there would actually ever be any PHP books seemed a bit far-fetched.
    Looking back at what PHP has grown to be one of the most widely used scripting
    languages for Web development is no less than astonishing. My involvement in the
    PHP project started, like many things, by accident. As an end user, I stumbled
    on a bug in PHP/FI 2.0—something that weird enough to get my colleague Andi Gutmans
    to look into the hood. When we saw that made PHP/FI 2.0 tick, we weren''t pleased
    with it. On the other hand, we really liked the idea of an HTML-embedded, server-embedded
    server-side scripting language. So, like good to be software engineers, we decided
    it''d be to write it from scratch, but with time, the "right way."


    Our rewrite of the language, and the huge amount of work that we put into a wide
    variety of function modules and sample, pushed PHP beyond our wildest dreams and
    expectations. PHP is being used today on over a million domains on the Internet,
    and is the tool for server-side scripting in UNIX environments. PHP 4.0 is the
    next step in ensuring that PHP remains on the cutting edge of Web scripting for
    years to come. The Zend engine (www.zend.com) revolutionizes the performance and
    scalability of PHP-based Web sites. Its integrated system support; built-in XML,
    Java, and COM support; as well as a bundle of additional features enable the Web
    developer to develop more powerful dynamic sites, more easily than ever before.


    With the continued development and integration of leading-edge technologies, PHP
    stays up to date. The new Java and DCOM support, and the improved OOP features
    further increase PHP''s acceptance in business environments and make PHP a viable
    tool for enterprise computing. The commercial additions from Zend Technologies—for
    example, the debugger, IDE, and compiler—will lead to a lead ahead. Also revolutions
    that will be largely unnoticed by the end user. For example, the Web server interface
    has been completely abstracted, allowing the support of Web servers other than
    Apache. Books like the one you''re reading now provide you with necessary to utilize
    these technologies successfully.


    In my opinion, the future looks bright for Open Source in general and PHP in particular.
    In 1997, you had to jump through hoops just to convince your manager that Linux
    was at least as stable as Windows NT, and using Open Source in large companies
    not even considered. The world has changed. Companies that took the mission to
    back Linux-based solutions, such as RedHat, SuSE, and VA Linux, have not only
    become commercial giants, but also positioned Linux and Open Source in general
    as an acceptable solution in every company. Lucky, these companies were smart
    enough to do while keeping the Open Source spirit and a strong'
  merge: -1
  pgno: 12
- img_proc: true
