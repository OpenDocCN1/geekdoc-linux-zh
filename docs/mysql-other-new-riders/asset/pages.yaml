    The submitted data is validated for syntactic correctness using two functions
    from the file String_validation.inc.php3, which provides some commonly used string
    validation functions (see Table 5.1). When an error in the submitted data is found,
    an appropriate error message is inserted into the array $errors. This helps later
    to determine whether an error had been found—if count($errors) is greater than
    0, the application reacts accordingly and processes the form.


    Table 5.1 String Validation Functions from String_Validation.inc.php3


    | Function | Purpose |

    | --- | --- |

    | is_alpha() | Checks whether a string contains only alphabetic characters; optionally
    checks for minimum and maximum length. |

    | is_numeric() | Checks whether a string contains only numeric characters; optionally
    checks for minimum and maximum length. |

    | is_alphanumeric() | Checks whether a string contains only alphanumeric characters;
    optionally checks for minimum and maximum length. |

    | is_clean_text() | Checks whether a string contains an extended set of characters
