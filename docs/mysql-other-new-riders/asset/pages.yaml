  md: '# Simplified Thinking Aloud


    In a thinking aloud study, a user is monitored while performing a defined task
    in a scenario. Traditionally, these studies were conducted by psychologists or
    usability experts who videotaped the testers and then conducted detailed analysis.
    Again, this sophisticated methodology is cost-intensive and may be intimidating
    to developers. However, it is possible to run a test without a sophisticated lab,
    simply by bringing in real users, giving them some typical tasks, and asking them
    to think out loud while performing the tasks.


    Simplified aloud tests ideally involve three to five users, while the traditional
    method requires ten or more users to get valid data. But the focus of usability
    engineering isn''t gaining statistically valid data; it is finding most of the
    usability problems as fast as possible. Ideal studies show that most usability
    problems can be found with the first tests performed.


    Instead of videotaping the participants, the experimenters take notes on paper
    about users'' behavior. Recording, and analyzing videotapes is expensive and involves
    at least one additional person to handle the camera. Analyzing paper notes is
    quick and nonetheless efficient. The time gained is better spent running additional
    tasks and testing different iterations of an interface.


    # Heuristic Evaluation


    Heuristic evaluation is a method to find usability problems in an interface. A
    small set of evaluators tests the interface and judges its compliance with established
    user interface design principles (the heuristics). These principles may be those
    described earlier, Nielsen''s 10 Recommended Heuristics for user interface design
    (see sidebar), or a custom set of principles tailored for a specific environment.


    Evaluators don''t need to be usability experts—even non-experts can find usability
    problems by heuristic evaluation, and many of the problems can be revealed by
    the simplified thinking aloud test. As different people locate usability problems,
    it also helps to let three to five people perform a heuristic evaluation. One
    lead should then organize the results from each evaluator and create a detailed
    report that should be presented at an interdisciplinary brainstorm meeting.


    With heuristic evaluation, only the interface is tested for problems. The evaluators
    don''t actually use the system; they simply take the heuristics as a checklist
    and try to find as many offenses against them as possible. Therefore, this approach
    must be used as a complement to the other discount usability engineering methods.'
