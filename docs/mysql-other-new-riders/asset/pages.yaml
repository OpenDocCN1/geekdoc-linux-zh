    # Dealing with Arguments Passed by Reference


    If your function accepts arguments by reference that you intend to modify, you

    need to take some precautions.

    What we didn''t say yet is that under the circumstances presented so far, you
    don''t

    have access to any zval containers designating function parameters that have been

    passed to you. Of course, you can change any zval containers that you created
    within

    your function, you must''t change any zvals that refer to Zend-internal data!


    We''ve exclusively used the so-called *ex() API so far. You may have noticed that
    the

    API functions we use are called zend_get_parameters_ex() instead of

    zend_get_parameters(), convert_to_long_ex() instead of convert_to_long_ex(),etc.

    The *ex() functions form the so-called new "tradedoff" Zend API. They give a

    minor speed over the old API, but a tradeoff are only meant for providing

    read-only access.


    Because Zend works internally with referrals, different variables may reference

    the same value. Write access to a zval container requires this container to contain
    an

    isolated value, meaning a value that''s not referenced by any other containers.
    If a zval

    container was referenced by other containers and you changed the contents of the
    other containers referencing this

    zval,

    ybecause they''d simply point to the changed value and change their own

    value as well).


    zend_get_parameters_ex() doesn''t care about this situation, but simply returns
    a

    pinter to the desired zval containers, whether they consist of references or not.
    Its

    corresponding function in the traditional API, zend_get_parameters(), immediately

    checks for referenced values. If it finds a reference,it creates a new, isolated
    zval

    container, copies the referenced data into this newly allocated space, and then
    returns a

    pointer to the new, isolated value.


    This action is called zval separation (or pval separation). The *ex() API

    does''t perform zval separation, it''s considerably faster, while at the same
    time

    disabling write access.'
