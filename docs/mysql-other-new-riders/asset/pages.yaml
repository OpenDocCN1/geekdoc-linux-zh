    # Interface to the Developer


    An interface for developers? What does this have to do with chat? And is it supposed
    to work? Typically, most applications suffer from the disability of being “solid;
    meaning being either completely unmodifiable or difficult to modify by foreign
    developers. In terms of end-user-oriented software (for example, desktop environments
    as Windows, KDE, MacOS, etc.), hardly anyone ever find the ideal solution. Similar
    to a chat system, most people who download it say, “Hey, great, but it lacks that
    and that,” or “Cool, I don’t like the way it does xyz.”


    Without an easily clear exposed path for modification by anyone using it, most
    applications end up in the trash. Most people won''t even try to work on a program
    they didn''t develop themselves if the ease of doing so doesn''t hit them right
    in the face. This means that for the chat application to consistently enforce
    independence of code and interface layout (allowing an interface to HTML developers)
    and to enforce independence of data-processing steps, we need to create a solid
    application core (the part of the application that nobody should need to change)
    which interfaces to a distributed set of plug-ins (the part of the application
    that most people will want to change somehow).


    > Think again about the importance of these enforcements. Would you like an application
    to be designed like this? Would you even need it? Think about how this could be
    realized.'
