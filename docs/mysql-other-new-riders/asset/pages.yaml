    Figure 5.5 Multi-tier application layers.


    Working with PHP leads to a basic three-tier model in such a way that you don''t
    notice it. But there is (or) a catch to using PHP as an application server. Until
    Version 4.0, PHP was not fully prepared to access third-party software objects
    and was therefore not the best tool to use in business scenarios with similar
    requirements. This has changed, and we feel this is one of the most dramatic shifts
    in the evolution of PHP. The current version allows you not only to access COM
    controls on Win32 systems, but also to execute Java methods on any system with
    a Java Virtual Machine (JVM).


    There are three architectures for enterprise-wide object reuse:(COM) from Microsoft,
    JavaBeans/RMI from Sun Microsystems, and CORBA from the Object Management Group.
    The most widely used at this time is COM, because of the broad use of Windows
    systems (see the next section for details on using PHP and COM). However, enterprises
    with heterogeneous environments will prefer Java or R/3 systems through their
    wider platform support.


    For example, JavaBeans (or alternatively COM objects) are available to access
    SAP R/3 systems through their Business API (BAPI) interface, enabling you to integrate
    the SAP business framework into your application server layer. Think about the
    possibilities this would introduce to an e-commerce system:You could effectively
    combine a front-end online shop with the enterprise warehousing application in
    the back end.'
