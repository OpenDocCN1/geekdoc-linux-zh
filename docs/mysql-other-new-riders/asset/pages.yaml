  md: '# 236 Chapter 7 Cutting-Edge Applications


    An approach to solving this problem is to give the template some control back,
    and let the designer decide on template logic. Templates would then contain a
    simple meta scripting language, looking like this:


    ```

    {{if ENTRIES_FOUND > 1}}

    {{{{ENTRIES_FOUND}}} entries found:

    {{/if}}

    {{if ENTRIES_FOUND=1}}

    One entry found:

    {{/if}}

    {{if ENTRIES_FOUND=0}}

    No entries found for your search!

    {{/if}}

    ```


    Of course, it''s a fine line between separation of code and layout and mixing
    them again. Do you prefer layout in the code or code in the layout? It''s a chicken-egg
    problem. At the time of this writing, first efforts were underway to create a
    template API for the standard PHP distribution. The meta script example above
    is taken from Andrei Zinski'' draft. Andrei (proponent of the template API and
    PHP core developer) plans to implement a number of other features; for example,
    standard predefined variables #OD or #EVEN inside dynamic blocks. This would make
    it possible to implement the popular colors in repeated rows—which otherwise would
    need to be handled by the programmer again. Andrei plans to integrate the template
    API directly into PHP, which would offer a number of advantages over current template
    solutions, like PHP''s. First, it would be standard, and software developers could
    depend on it. Second, as it would be tightly integrated into PHP''s core engine,
    it could be a major performance boost. Parsed templates could be cached in memory,
    for example.


    # Recursion with SQL


    Our application allows unlimited nesting of categories. We have chosen the most
    basic and easy-to-implement solution for nesting categories. The categories table
