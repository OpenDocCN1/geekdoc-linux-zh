  md: "# Interchanging Data with WDDX 273\n\nWDDX supports these generic datatypes.\
    \ In version 2.0 of the specification, the following types are defined:\n\n+ \
    \  - Null values: null\n- Boolean values: bool\n- Numbers (with no distinction\
    \ between integers and floating-point numbers):\nnumber\n- Strings: string\n-\
    \ Date/time values: dateTime\n- Indexed arrays: array\n- Associative arrays: struct\n\
    - Collections of associative arrays, a set of named fields with the same number\
    \ of rows of data: recordset\n- Binary objects, at this time encoded with Base64:\
    \ binary\n\nAll WDDX packets follow a common XML format. The root element is wddxPacket,\
    \ with an optional attribute specifying the version of the WDDX DTD. The version\
    \ number, currently 1.0, is bound to and defined in the DTD. This means that any\
    \ WDDX packet with a version of 1.0 is *only valid when used with the WDDX DTD\
    \ 1.0*, and not with 2.0 or 0.9.\n\nThe header element must follow right below\
    \ the wddxPacket element. The header can contain only one comment element, and\
    \ nothing elsenThe next required element is *data*, denoting the body of the packet.\
    \ Within this element, exactly one null, boolean, number, dateTime, string, array,\
    \ struct, recordset, or binary element must appear. A sample WDDX packet is shown\
    \ in Listing 7.6\n\nListing 7.6 A sample WDDX packet.\n\n```\n<wddxPacket version='1.0'>\n\
    \ <header/>\n <data>\n  <var name='string'>\n   <string>This is a 'string'.</string>\n\
    \  </var>\n  <var name='int'>\n   <number>42</number>\n  </var>\n  <var name='float'>\n\
    \   <number>42.5</number>\n  </var>\n  <var name='bool'>\n   <boolean value='true'/>\n\
    \  </var>\n\n```\n\ncontinues"
  merge: -1
  pgno: 290
- img_proc: true
  md: "# Chapter 7 Cutting-Edge Applications\n\nListing 7.6 Continued\n\n```\n<var\
    \ name='array'>\n<array length='3'>\n  <number>1</number>\n  <number>2</number>\n\
    \  <number>3</number>\n</array>\n</var>\n<var name='hash'>\n<struct>\n  <var name='foo'>\n\
    \    <string>bar</string>\n  </var>\n  <var name='baz'>\n    <string>fubar</string>\n\
    \  </var>\n</struct>\n</var>\n</data>\n</wdxPacket>\n```\n\n# PHP and WDDX\n\n\
    Because WDDX uses XML for the representation of data structures, you need to compile\
    \ PHP with both XML and WDDX in order to use it. If you've done that, the following\
    \ functions are at your disposal:\n\n+   - wddx_serialize_value()\n- wddx_serialize_vars()\n\
    - wddx_packet_start()\n- wddx_add_vars()\n- wddx_packet_end()\n- wddx_deserialization()\n\
    \nUsing these functions, you can serialize PHP variables into WDDX packets and\
    \ deserialize WDDX packets.\n\n# The WDDX Functions\n\nUsing the WDDX functions,\
    \ there are three different ways to construct a packet. The most basic method\
    \ is to use wddx_serialize_value(). This function takes one variable plus an optional\
    \ comment, and creates a WDDX packet out of it:\n\n```\n$var = \"This is a string\"\
    ;\nprint(wddx_serialize_value($var, \"This is a comment.\"));\n```"
