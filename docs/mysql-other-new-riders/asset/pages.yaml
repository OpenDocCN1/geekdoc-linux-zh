  md: '# The Importance of Planning


    Before diving into PHP-specific issues, let''s start from a wider point of view.
    Some issues apply to application development in general, regardless of which language
    you''re using and on what platform you''re developing.


    When working on a professional project, it is very important that you think about
    what you''re doing. Know your enemy—never underestimate it. Although your project
    isn''t an enemy, the point still stands. Know all your project''s specifications,
    its target platform(s), its users, and never underestimate the significance of
    small problems that you haven''t evaded completely before moving on to other topics.
    Planning takes at least 50% of the development time;


    Judging from experience, the bigger the project, the more thoroughly you should
    develop its outlines. This principle applies to contacting your customers and
    working closely with them on defining an overall project outline, as well as talking
    with your developers about defining a coding outline. The less you spend on consistency
    and maintainability, the sooner you''ll run into problems when reopening old files
    and trying to fix bugs or add new features.


    Planning time isn''t necessarily proportional to your project''s size. An example,
    think about a search algorithm that you have to design. The application doesn''t
    have to do more than basically crawl through a heap of information, extracting
    data according to a set of rules. Let''s say that the data is already ready, so
    setting and output won''t require a lot of effort. The application will spend
    most of its execution time in searching loop. The loop probably won''t even take
    more than 100 lines of code, but choosing or designing an optimal algorithm for
    an optimal loop could easily take the whole day. while the other hand you may
    create projects with a few thousand lines that have been thoroughly planned in
    less than a day.


    Similarly, let''s say you need a little script that lists all files in a directory.You
    could quickly it so perform this specific task, listing all files in a specified
    directory. You won''t have to worry about it anymore—the problem''s solved and
    you can move on other tasks, leaving your snippet behind. But another strategy
    might be to take into consideration at a later point—maybe even in a completely
    different project—you''ll probably need a similar tool again. Just hacking directories
    over and over when you need one, for each specific task, would be a waste of time.
    Thus, when first encountering such a situation, you should think about it. You
    could create a separate module from the directory list, allowing it to list different
    directories, occasionally recurring subdirectories, eventually accepting wildcards.
    You might create a bulletproof little function that would handle most special
    cases and also handle everyday demands to a directory list just perfectly.With
    this latter method, after a few projects you would have a library of solid functions
    that you could reuse safely and rely on, and that sometimes strip down development
    time significantly.'
