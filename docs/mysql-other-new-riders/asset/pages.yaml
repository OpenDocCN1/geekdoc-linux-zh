  md: '# Knowledge Repositories


    In the corporate environment, a clear trend emerged during the last few years:
    away from product-based planning and toward customer-focused strategy. With this
    trend, a new technology gained widespread publicity and success: knowledge management.


    For a company that wants to have a strategic advantage over its competitors, it''s
    necessary to organize knowledge in a way that makes it easily accessible by anyone,
    all of the time. With the dawn of enterprise intranets, this topic was made more
    current than ever.


    In traditional intranets, information is often hard to find because it''s spread
    to many different pages and coming from many sources. The information''s actually
    there is often quite useless because it''s not indexed and not broken down into
    smaller logical units, making it hard to search.


    What can a company do to solve these problems efficiently? The key lies in proper
    knowledge management. A lot of companies offer sophisticated solutions, but you
    may also consider developing your own tools—simpler and therefore easier to use
    than commercial solutions, or better fitting your company''s strategy.


    We have a starting point for you. On the CD-ROM to this book, you''ll find the
    full source code for a knowledge database, which could easily be transformed into
    a support repository or a link directory. The system was originally developed
    for Zend Technologies, but they have been kind enough to let us distribute it
    with our book.


    The application has a wide range of features: full-text search, an unlimited number
    of categories and subcategories, a report showing all tips by a specific author
    and authors with the most submissions, user rating of entries, user submission
    entries, and more.


    The system was realized using the PHPLib for database abstraction and HTML templates.
    Therefore, the following walkthrough will also give you a thorough overview of
    application development with the PHPLib. Figure 7.1 shows the application''s start
    screen.'
  merge: -1
