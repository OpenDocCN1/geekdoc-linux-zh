- img_proc: true
  md: '# Compiling Modules 305


    The second method should definitely be favored, since, as of PHP 4.0, this has
    been standardized into a sophisticated build process. The fact that it is sophisticated
    is also its drawback, unfortunately—it''s hard to understand at first. We''ll
    provide a more detailed introduction to this later in the chapter, but first let''s
    work with the default files.


    The make process contained in the dir directory is a bit of dirty, outdated and
    planned for removal from the source tree. To be honest, it is much simpler to
    use this at first to build dynamic extensions, but because it doesn''t have the
    possibilities of the ext directory and it''s scheduled for deletion anyway, usage
    of the dir directory is deprecated.


    The third method is good for those who (for some reason) don''t have the full
    PHP source tree available, dont access to all files, or just like to juggle with
    their keyboard. These cases should be extremely rare, for the sake of completeness
    we also describe this method.


    # Compiling Using Make


    To compile the samples using the standard mechanism, copy all their subdirectories
    to the ext directory of your PHP source tree. Then run buildconf, which will create
    a new configure script containing appropriate options. By default, all the sample
    sources are disabled, so you don''t have to fear breaking your build process.


    After you run buildconf, configure --help shows the following additional modules:


    +   --enable-array-experiments Enables array experiments

    --enable-call_userland Enables users module

    --enable-cross-conversion Enables cross-conversion module

    --enable-first-module Enables first module

    --enable-infoprint Enables infoprint module

    --enable-reference-test Enables reference test module

    --enable-resource_test Enables resource test module

    --enable-variable_creation Enables variable-creation module


    The module shown earlier in Listing 9.3 can be enabled with

    --enable-first-module or --enable-first-module=yes.'
  merge: -1
