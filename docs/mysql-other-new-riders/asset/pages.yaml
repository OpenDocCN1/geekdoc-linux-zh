  md: '# Chapter 1 Development Concepts


    Similarly, when asked to write an application, the OOP programmer will try to
    fit it into objects, and the procedural programmer will handle the same task differently.
    Which approach is better? Each programmer will say that his or her method is best,
    but only someone who is familiar with both concepts—OOP and procedural programming—will
    be able to judge.


    Each mentioned earlier represents a different approach of solving problems in
    this specific way—mostly problems of a specific kind, with special requirements.
    Because these languages focus on a very limited field of use, their success is
    limited to these few as. While languages like C and Pascal probably became popular
    because of their broad focus, leaving out special features for specific problems
    but satisfying the need for a tool that solves problems.


    How does PHP fit into this? Although it''s called a language, PHP isn''t really
    a language of its own, but instead a mixture of languages. It mainly the syntax
    most programmers know from C, but is substantially different; it''s interpreted.
    PHP also knows variable types, but does not strict checking. PHP knows classes
    but no structured types. There are a lot of examples like this, but you probably
    get the point already: PHP meets a lot of conceptual approaches into a completely
    new, unique approach.


    To be successful in creating Web applications using PHP, we encourage you to answer
    the first question: Is PHP the language for my project? Good question. But would
    we be dumb to say no (Who would be writing a book about something they think is
    bad?) Let''s rephrase the question: Is there a better language than PHP for my
    project? This is safe to answer. If you''re doing Web application development,
    PHP is the language for you.


    # The Importance of Planning


