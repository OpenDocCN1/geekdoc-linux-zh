  md: '# PHP and XML 265


    The function root() returns a node object containing the root element of the document.
    On empty documents as created by new_xml(), you can add a root element using add_root(),
    which will return a node object as well. The function add_root() expects the name
    of the element as first argument when called as class method. You can also call
    it as global function, but then you need to pass a document class instance as
    first argument, and the name of the root element as second argument.


    The dtd() function returns a DTD object with no methods, and the name of a DTD
    is the name of the root element. The variable sysid contains the system identifier
    (for example, docbook.dtd); the extid variable contains the external or public
    identifier. To convert the in-memory structure to a string, you can use the dumpmem()
    function. The version variable contains the document XML version, usually 1.0
    today.


    With these examples, you''re ready for first, simple example. Let''s construct
    a Hello World XML document with LibXML.


    ```

    $doc = new_xmldoc(''1.0'');

    $root = $doc->add_root(''greeting'');

    $root->content = ''Hello World!'';

    print(htmlspecialchars($doc->dumpmem()));

    ```


    This will result in a well-formed XML document:


    ```

    <?xml version="1.0"?>

    <greeting>Hello World!</greeting>

    ```


    The example also shows one property you don''t know yet—accessing the contents
    of a node object.


    # Nodes


    The Tao King says everything is Tao. In XML parsing, everything is a node. Elements,
    text, PIs, and so forth—from a programmer''s point of view, you can treat all
    in a very similar way, because they are nodes.


    As we''ve already mentioned, nodes can be the most basic, atomic structure in
    an XML document. A node object has the following associated functions and variables:


    +   - parent()

    - children()

    - new_child()

    - getattr()

    - setattr()

    - attributes()

    - type

    - name

    - if available, content'
