  md: '# Array Functions 35


    The return format of the key/value pair is a four-element array with the keys
    "0", "1", "key", and "value". This means that it can be used as both an indexed
    array and an associative array. The indexed part of the array (with the keys "0"
    and "1") contains the key of the source element at index 0; the value can be found
    at index 1. The same information can be accessed using the associative part of
    the array. (Actually, separating associative and indexed parts of an array is
    not correct, since indexed arrays are just a special form of associative arrays—theoretically,
    they are different things, but in practice they are the same in PHP. See the later
    discussion for details.) The key of the source element is contained in "key" and
    the value in "value". For example: $my_array = array("Element 1", "Element 2",
    "Element 3");


    This will simply create an array with the following contents:


    +   - Element 1

    - Element 2

    - Element 3


    To better understand the principle behind each(), it''s useful to create a more
    detailed list of this array:


    | Key | Value |

    | 0 | Element 1 |

    | 1 | Element 2 |

    | 3 | Element 3 |


    This is the list of all key/value pairs contained in the array $my_array. Now
    we''ll use each() on it:


    ```

    list($key, $value) = each($my_array);

    ```


    This first call to each() returns the first four-element array containing the
    first key/value pair from $my_array. Note that since we only give two arguments
    to list() operator, only the values from the four-element array can be assigned:
    these are "0", the first key, and "Element 1", the first value element from $my_array.


    The following code lists the contents of an array:


    ```

    $my_array = array("Element 1", "Element 2", "Element 3");


    while(list($key, $value) = each($my_array)) {

    print("Key: $key, Value: $value<br>");

    }

    ```


    This script produces an output like that shown in Figure 2.1.'
