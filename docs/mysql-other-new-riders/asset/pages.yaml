    # What Is XML?


    XML (Extensible Markup Language) is a meta markup language for documents containing
    structured information. Let''s try to explain it in plain English:


    +   - XML is extensible. Take HTML: the tag <html> always denotes a first-level
    heading. In XML, by contrast, the tag means nothing until you give it a meaning
    with an accompanying rule, the Document Type Definition (DTD).

    - XML is a markup language. Just as HTML should, theoretically, XML does not provide
    layout information to the processing application.

    - XML is a meta language. XML does not have a fixed tag set—it provides a facility
    to define tags.

    - XML works with documents. As not limited to files! Documents can come from a
    database, over the network, or imported from files.

    - XML defines structured information. It arranges single parts of data in a larger
    body and gives it a contextual meaning and a structural relationship.


    # Structured Information


    There''s one key you''ll need to understand when talking about XML: structured
    documents—more eloquently—structured information markup explicitly defines the
    structure and semantic content (the contextual meaning) of a document. It doesn''t
    influence the way in which the document will appear to the reader—the interpretation
    of the data (parsing, layout, etc.) is completely left to the processing application.
    Take the HTML <p> (paragraph) tag: it denotes multiple sentences belonging together
    to form a logical unit. The tag per doesn''t imply how the paragraph should be
    rendered in the browser; the browser could insert a blank line before or after,
    indent the first line in the paragraph, or add ornamental borders around it. This
    is logical—style information is hardcoded in the browser. XML documents are composed
    of logical markup. As in HTML, tags are used to identify the markup. But in XML,
    there are no visual elements as in'
