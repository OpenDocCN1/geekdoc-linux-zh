  md: '# Associative Arrays


    Arrays are another basic structure in programming languages. Arrays provide means
    for storing a fixed set (or collection) of the same datatype in a convenient way,
    making each element of your set indexable by using a unique key.


    In the typical "conventional" programming languages, arrays are handled like this:


    ```

    int my_integer_array[256]; // allocate 256 integers in this array

    ```


    This C code declares an array called my_integer_array, containing 256 integers.
    You can access each of these by indexing the array with an ordinal value, for
    this array in a range of 0 to 255. (C starts counting from 0; the number in the
    array definition specifies the number of integers you want to have available.)
    Indexing looks like this


    ```

    int my_integer = my_integer_array[4];

    ```


    This retrieves the first element (remember, counting from 0) from the array and
    stores it in my_integer.


    Due to the nature of compiled languages, you were always bound to the previous
    definitions of your variables. If you needed more than 256 integers in the array
    above, this was impossible. Of course you could have defined this variable as
    a pointer to an array and allocate 257 elements forbut what if you suddenly needed
    another? You would have to allocate new space, copy the old array contents, or
    free the old, unused space.


    PHP takes a different approach. PHP has no typical declarations (only type definitions),
    new variables are allocated on the fly. Whenever you create a new variable by
    introducing its name into the namespace, you simply create storage space bound
    to this name—nothing more. The kind of data residing in space is not restricted
    to a certain variable type. It can be reinterpreted on the fly, and of course
    resized, reallocated, wasted.


    Take a look at this:


    ```

    $my_var = 1;

    $my_var = ''Used to be an integer'';

    $my_var = array(''Oh well, I have arrays better'');

    ```


    The first line creates a new variable $my_var. PHP will find that an integer is
    going to be assigned to; it sets the initial type of $my_var to integer. The second
    one overwrites the contents of $my_var with a string. Using one of the conventional
    programming languages would have resulted in an error at compile time, or an exception
    during runtime. But PHP dynamically changes the type of $my_var to String and
    allocates the variable so enough storage for the string is available. The third
    line then changes the type of $my_var once more by creating an array out of it.
    PHP handles all cases transparently without complaining. (We know that other languages
    out there exist without strict variable types, but we won''t classify these as
    "conventional" languages.)'
