  md: "# The Web Distributed Data eXchange (WDDX)\n\nWDDX is an open technology proposed\
    \ by Allaire Corporation; it's an XML\nvocabulary for describing basic and complex\
    \ data structures such as strings, arrays, and\nrecordsets in a generic fashion,\
    \ so that they can be moved between Web\nscripting platforms using only HTTP;\
    \ PHP supports WDDX, and so do most other\npinent Web scripting languages; for\
    \ example, Perl, ASP, and ColdFusion.\n\n# The Challenge\n\nAs Web applications\
    \ play an ever-increasing role in the software world, one of the\nmost important\
    \ challenges is data exchange between different programming\nenviron. The Web\
    \ promotes distributed, networked applications. First, there\nwere simple sites\
    \ with static information. They get into more advanced\ndynamic Web applications,\
    \ and now these Web applications are beginning to work\ntogether, exchange data,\
    \ to offer additional, programmable services. It was only\nrecently that open\
    \ standards like XML emerged and gained widespread use, and that\nthe market forced\
    \ vendors to adopt these standards in their products.\n\nBy extending Web applications\
    \ to implement programming interfaces for data\nexchange and the mitigation, of\
    \ the Web experiences a huge increase.\nSuddenly, applications can talk to each\
    \ other—they evolve from closed, proprietary\nWeb sites to a new generation of\
    \ wired business applications.\n\nWeb applications can expose an API or make data\
    \ structures available: Data\nexchanges between distributed servers becomes possible.\
    \ WDDX consists of two parts; one part deals\n abstracting data into an XML representation\
    \ WDDX packets; the other part\ntranslate data to and from the scripting environment\
    \ and WDDX packets.\n\nWDDX is not a remote procedure call facility: There is\
    \ no way in pure WDDX to\ninv a function on a server, which then returns a WDDX\
    \ packet. How to transfer\npackets is completely up to you. For this reason, WDDX\
    \ has no provision for\nsecurity—it's your task to select a communications channel\
    \ of appropriate security and\nallow only authorized parties to access the WDDX\
    \ part of your system.\n\n# Possible Scenarios\n\nWhen synchronizing, centralizing\
    \ data exchange, or performing business-to-\n communications, structured data\
    \ exchange opens a new dimension in\ndributed computing. For example, imagine\
    \ that you operate an e-commerce Web\nsite. Wouldn't it be great if you provide\
    \ customers with package tracking during\nthe shipment? This could be implemented\
    \ easily if UPS or FedEx provided a way to\nquery for a shipped item programmatically.\
    \ By opening formed customer-centric\nservices (most couriers allow tracking packages\
    \ for their customers) to distributed\ncomputing (package tracking as programmable\
    \ API), a new form of application"
