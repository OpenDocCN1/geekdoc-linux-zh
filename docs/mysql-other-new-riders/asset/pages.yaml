    You could return a reference to the instance and change this simple "pointer"
    mechanism that PHP provides. Then you will have changed the object itself and
    not its copy. As soon as you''re going to traverse the tree again, you''ll see
    something strange—nothing seems to have changed. And indeed, nothing changed.
    This is because the parent of the node you wanted to change keeps its own copy
    of the same data! $node->left is nothing more than copy of a node in the tree,
    and this is what the tree-walker will evaluate. The copy you changed will remain
    outside the tree and end up in the garbage collector. To change this node as well,
    you''d need to pass references to the parents as well, to the parents of the parents,
    and to their parents in turn. You''ll end up in another recursive function, which
    is more tricky than copy and won''t work in 99% of all cases.


    # Classes: PHP 3.0 Versus PHP 4.0


    PHP 4.0 has learned from the inability of PHP 3.0 to handle object referencing
    and now supports "true" references. "True" is in quotes here they don''t really
    point to memory the other variable is copying; PHP interprets the variables as
    references and acts differently. Embedded in the preceding example, the code would
    look like this:


    ```

    // create multiple references to the original object

    $new_object = &$my_object;

    $another_object = &$new_object;

    ```


    This code creates two references to the same object. Note that $another_object
    is being assigned as a reference to $new_object, not a copy of it. When trying
    to copy references, PHP won''t copy the reference but instead create a copy of
    the referred variable. Only when you subsequently use references (to copy a reference,
    you''re required to use the reference operator again), both $new_object and $another_object
    can be used to modify data within $my_object.'
