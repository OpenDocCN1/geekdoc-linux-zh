- img_proc: true
  md: '# Interfacing the Network 107


    The disadvantage doesn''t come from the database stuff (the process that inserts
    user messages) but rather from the database reader (the main process that retrieves
    all user messages from the database). To achieve a good "chat feeling," we need
    as little latency as possible—and thus very good response time. The response time
    is crucial for Web-based chat, as this is how the user will actually feel "integrated"
    into the action. When messages come slower and slower, users quickly become frustrated
    and quit. Our testing showed that a latency of more than a second is too much.
    To stay below this value, the poll frequency which the main process has to read
    messages from the database must be very short; the default value in phpChat is
    0.5 (two checks within second). Now, as with a lot of clients have to be handled
    by the chat system, the database gets quite busy and takes up more resources.
    After over 40-50 queries per second, our test server spent about one third of
    its processing time simply executing database queries. Even if this was a qualifying
    benchmark for the database system (it should have been able to process more queries),
    some optimization is obviously necessary, and this isn''t the ideal setup.


    # Creating Lockfiles


    Our idea was, if the database took up too many resources when handling interprocess
    communication, a file system might be more efficient.


    But the file system clearly lost the race. Again, the staff wasn''t the problem—creation
    of lockfiles worked smoothly. To detect whether a lock was set, however, calls
    to clearstat() had to be done in order to correctly determine whether the lockfile
    had been deleted or was still present.clearstat() had such a hard impact on the
    system performance that we didn''t look further into this option; the chat only
    worked at a quarter of the performance it reached using the database-backed approach.


    Create your own benchmarks. Make test scripts accessing the database and the file
    system at high frequency. This is always a good idea when evaluating data-exchange
    methods—never trust theoretical descriptions of what the systems can be capable
    of! In practice, most things will look different.


    # Using Semaphores


    Of course, the reasons for the poor performance of the former approaches are easily
    recognized.'
