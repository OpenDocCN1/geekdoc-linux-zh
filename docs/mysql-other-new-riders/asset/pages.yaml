  md: '# Introduction


    The ancient Masters didn''t educate the people, but kindly taught them to not-know.


    While the success of Open Source software like Linux or Apache has been documented
    extensively throughout all mainstream media, the rise of PHP has gone largely
    unnoticed. Still, the Web scripting language PHP is the most popular module for
    the Apache Web server, according to an E-Soft survey (www.e-soft.com/survey/).
    Netcraft studies have found that PHP is in on over 6% of all Web domains in the
    world (www.nectcraft.com/survey/). That''s an incredible market penetration for
    a rather specialized product. This popularity continues to rise exponentially.
    Increasingly, this is being reflected in traditional media: As of May, 2000, more
    than 20 books about PHP have been published in different languages, with more
    in the pipeline.


    Commercial players are beginning to join the bandwagon: PHP is included with Web
    servers, for example C2S Stronghold, and Linux distributions. A new company, Zend
    Technologies, has been formed to provide commercial add-ons and support for PHP
    A long list of large-scale Web sites employs PHP as well as hundreds of thousands
    of small to medium Web sites.


    For the authors, this book began in June of 1999, when we were approached by New
    Riders Publishing to write a book about advanced PHP. The idea of writing a PHP
    book had been in our heads some time prior, and the New Riders postal was very
    welcome.


    About 1,500 emails, 500 CVS commits, and countless hours on IRC later, we''re
    finally done. It was a bit of a job, but we succeeded in writing a book that''s
    different from pure reference manuals. We had to explain the concepts of Web application
    development, rather than giving you just a overview of PHP''s features.


    The evolution from a novice programmer with no or little formal education to a
    software development expert happens in different stages. The programmer begins
    the career as an apprentice. At this time, the programmer usually doesn''t worry
    about coding styles, planning, or testing—unreadable code, missing security, and
    longer hacker nights are typical for this stage. While the programmer may know
    all the tricks and hidden features of a language, she will encounter difficulties
    in team development, maintenance, and larger development projects. At this point,
    you can easily spot those who will be expert developers later. They start to ask
    questions:


    +   * How can I avoid implementing the same functionality over and?

    * What provisions do I have to put into effect to make my application secure and
    stable?

    * What does it take to make my application easier to maintain?

    * How can multiple people work efficiently on a team?'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'This is where our book comes into play. We hope to provide software developers
    with some guidelines on better PHP and Web application development. Many technologies
    are available today, and you can only fully utilize them if you understand the
    fundamental principles behind the development process, and if you develop problem-solving
    skills. Typical reference manuals do not help with those issues.


    # # Target Audience


    If you''re new to programming, this book is not for you. You''ll find a helpful
    resource, however, in the following cases:


    +   - You have already developed applications with PHP, and want to take your
    skills to the next level.

    - You have experience with other programming languages and want to develop Web
    applications with PHP.

    - You''re an expert with PHP and want to extend PHP''s feature set on your own.


    You don''t need to be a PHP wizard to read this book, but you should be familiar
    with PHP''s syntax, or have good knowledge of programming principles.


    # # Prerequisites


    This book assumes that you have a working PHP setup, preferably PHP 4.0 or later.
    Because of its popularity, we use MySQL as the database system where one is required.
    Because platform independence is one of PHP''s strongest features, our examples
    should run on UNIX as well as on Windows.


    # # Organization of This Book


    This book is divided into three parts. The first part, "Advanced PHP," covers
    the advanced syntax of PHP; for example, object orientation, dynamic functions
    and variables, and self-modifying code. It also gives you an overview of project
    planning principles, coding styles, and application design. This part provides
    the necessary base for fast, productive development of industry-quality Web applications.


    Part II, "Web Applications," focuses on building the software: It explains why
    sessions are important, what security you need to keep in mind, why usability
    matters, and how to use PHPLib for session management and database access. You''ll
    find three case studies of successful PHP projects here, to help you convince
    your IT managers.


    The third part of the book, "Beyond PHP," is for readers who want to go beyond
    what''s currently available with PHP, and explains how to extend PHP with C. This
    is the official documentation on extending PHP, as approved by Zend Technologies.

    In detail, the following topics are covered.'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'Introduction xvii


    # Chapter 1—Development Concepts


    Having to deal with advanced projects makes the usage of coding conventions, proper
    planning, and advanced syntax unavoidable requirements. This chapter covers general
    coding conventions that are a requirement for all-industry quality projects—naming
    and comment conventions, as well as how to break up the source into logical modules.


    # Chapter 2—Advanced Syntax


    This chapter covers PHP’s advanced syntax, for example multidimensional arrays,
    classes, variable variables, self-modifying code, and the like.


    # Chapter 3—Application Design: A Real-Life Example


    In this chapter, we walk through the entire process of planning a complete Web
    phpChat, a Web-based chat client interface to IRC. This chapter shows planning
    fundamentals, guidelines on project organization, and shows how to realize modular,
    plug-in-enabled applications.


    # Chapter 4—Web Application Concepts


    Session management, security considerations and authentication, and usability
    form the base of every Web application. Web applications aren''t possible without
    proper session management. You have to find a way to recognize users during multiple
    page requests if you want to associate variables like a shopping cart with specific
    user. And this identification could be better secure if you don''t want have one
    user seeing another''s credit card information. Indeed, special considerations
    are necessary for improving security in your applications. Even if PHP is less
    prone to crackers'' attacks than other CGI environments, it''s easy to write totally
    applications when you don''t keep in mind important principles covered in this
    chapter.


    This chapter also introduces basic usability concepts. As soon as we begin to
    talk about applications stand-of-alone scripts, the user''s role becomes more
    important. After all, it is users who finally determine the success or failure
    of a project—and this chapter shows guidelines to achieve better user satisfaction.


    # Chapter 5—Basic Web Application Strategies


    This chapter discusses more fundamentals of Web applications. All Web applications
    process input, for example, or deal with separation of layout and code. Moving
    on these topics, this chapter also introduces you to effective team development
    by giving an overview of version control with CVS. Finally, it discusses multi-tier
    applications, COM, and Java from a PHP point of view.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Chapter 6—Database Access with PHP


    Without databases, Web applications are not possible. Chapter 6 presents the PHPLib
    as a tool for vendor-independent database access, and gives an overview about
    its other features, such as session management, user authentication, and permission
    management.


    # Chapter 7—Cutting-Edge Applications


    By developing a complete knowledge repository using PHPLib, this chapter familiarizes
    you with PHPLib''s template class, self-references in SQL, and other advanced
    topics. The chapter presents an overview of XML and how applications can benefit
    from this exciting technology. The chapter also describes PHP''s interfaces for
    XML parsing and its WDDX interfaces.


    # Chapter 8—Case Studies


    Success stories can help tremendously when introducing a new technology into a
    corporate environment. In Chapter 8, we present case studies featuring Six Open
    Systems, BizCheck, and Marketplayer.com—three great examples among hundreds of
    companies using PHP successfully in high-demand scenarios.


    # Chapter 9—Extending PHP 4.0: Hacking the Core of PHP


    Are more than 1,200 functions not enough for you? No, because this chapter is
    the official documentation on extending PHP. If you know some C, Chapter 9 gives
    you some condensed insight into the internals of PHP 4.0, and shows you to write
    your own modules to extend PHP''s functionality.


    # Conventions Used in this Book


    The following conventions are used in this book:


    | Convention Usage |

    | *italic* New terms defined. |

    | `monospace text` Commands, syntax lines, and so on, as well as Internet addresses
    such as www.phpwizard.net. Code-continuation characters are inserted into code
    when a line shouldn''t be broken, but we simply run out of room on the page. |


    —'
