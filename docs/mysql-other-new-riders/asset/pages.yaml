    # XML Trees


    The methods outlined above construct separate objects for the document and for
    each node. While this is great for looping through the document as shown in the
    XML pretty printer, accessing single elements to get a bit cumbersome. Do you
    remember our sample Hello World from earlier in the chapter?


    ```

    <xml version="1.0"?>

    <greeting>Hello World!</greeting>

    ```


    To access the contents of the root element, you''d have to use the following code:


    ```

    // Create xmldoc object from file

    $doc = xmldocfile("test.xml") or die("XML error while parsing \$file\");

    ```


    ```

    // Access root node

    $root = $doc->root();

    ```


    ```

    // Access root''s children

    $children = $root->children();

    ```


    ```

    // Print first child''s content

    print($children[0]->content);

    ```


    And for that''s of one; imagine you''d have to continue with deeper nested elements.
    If you think this is too much work, we agree. Fortunately, Uwe Freeman, has provided
    a more elegant method of random access to document elements: xmltree(). This function
    creates a structure of PHP objects, representing the XML document. When you pass
    a string containing an XML document as first argument, the function returns a
    document object. The object is a bit different from the one described earlier,
    though: It doesn''t allow functions to be called, but sets up properties of the
    same. Instead of getting a list of child elements with a children() call, the
    children are already present in the structure (in the class variable)—making it
    easy to access elements in every depth. Accessing the contents of the greeting
    element would therefore be done with the following call:


    ```

    // Create xmldoc object from file

    $doc = xmldocfile(join("", $file)) or die("XML error while parsing \n-file=\$file\");

    ```


    ```

    print($doc->root->children[0]->content);

    ```'
