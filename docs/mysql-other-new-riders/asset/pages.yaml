  md: '# DocumentFragment


    A DocumentFragment node is a portion of a complete XML document. It''s often necessary
    to rearrange parts of a document or extract part of it; for this, a lightweight
    object is needed to hold the resulting fragment. For example, imagine you want
    to construct a single book out of many different chapter files—each chapter could
    be read into the DocumentFragment object and inserted into the book''s document
    structure. Without a way to organize fragments of documents, you''d have to add
    each element of each chapter one by one to the book document.


    To make it even easier, the specification defines that when DocumentFragment is
    inserted into a node, only the children of the DocumentFragment and not the DocumentFragment
    themselves are inserted into the node.


    # DocumentType


    The DocumentType node holds the type declaration of a document, if present. This
    interface is read-only;it cannot be altered through the DOM at this time.


    # Element


    Each element in the document is represented by an Element node.To get the name
    of the element, the tagName property can be used.This interface also defines a
    series of functions to set element attributes, and to access sub-elements.


    # Attr


    An Attr node represents an element attribute in an Element object. Name and value
    of the attribute can be read for the name and value properties of the interface.
    The specified tells you whether the user specified a value for this Attr or the
    value is the default string specified in the DTD.


    # EntityReference


    This node represents an entity reference found in the XML document. Note that
    character references (for example, &lt;) are expanded by the XML parser and are
    not made available as EntityReference nodes.


    # Entity


    This node represents an entity, either parsed or unparsed.


    # ProcessingInstruction


    The ProcessingInstruction node represents a processing instruction (PI) in a document.
    It has only two attributes, namely target (the PI target) and data (the contents).'
