  md: '# 106 Chapter 3 Application Design: A Real-Life Example


    Input field ► Data exchange container ("door") ► Main process


    Figure 3.7 Upstream communication.


    The situation can be compared to a car race. The driver racing on the track is
    the “main client” and the racing team in the pit is the user input field. The
    driver is bound to race he''s in; he can''t leave the track and stop to see what''s
    going on. Whenever the racing team flags him for a pit stop, they “interface”
    to him—giving him to make a break after the next lap.

    What''s being done (leaving radio communication aside) to signal every time the
    driver passes the finish line. This signal as the “interface” to the driver. Basically
    this is what we need to do, too—signal to our main process. Since the process
    is event-based, we frequently get the chance to take control over the application
    and what we want to do. This means we can install a handler that “looks” for a
    signal from the outside. The method to periodically stop and check for incoming
    is data polling and will be the preferred method for phpChat, phpIRC features
    idle callbacks, which get invoked every phpIRC has waiting for something to happen
    on the network. Tagging a handler to this event enables us to watch for a signal.
    Now, how are we going to signal something? This is actually pretty easy, using
    one of the following methods:


    +   - Set a lockfile in the file system.

    - Create a lock in the file system.

    - Use semaphores.

    - Set a flag in shared memory.


    These are basically the methods that we have with PHP to “leave a message.”

    The following sections describe each method.


    > Pipes cannot be used for interprocess communication here, as a pipe requires
    two processes to be running at the same time. Our situation requires interfacing
    constantly running process from other, short-term processes.


    Note: Of course, more exotic methods are available, as sending emails between
    processes. We''ve seen people doing this, but we won''t go into that option here,
    as the disadvantages should be clear to the reader.


    # Setting a Flag in a Database


    Setting a flag in a database is probably the de facto standard method for PHP
    users: Connect to a database, leave some data in it, let be processed further
    by other processes. This method is extremely easy to implement and is available
    on all systems, but has a disadvantage. Can you tell what the disadvantage is?'
  merge: -1
