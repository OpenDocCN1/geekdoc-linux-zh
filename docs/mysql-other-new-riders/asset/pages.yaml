  md: '# 240 Chapter 7 Cutting-Edge Applications


    The development resulted in a clear specification approved by the World Wide Web
    Consortium (W3C) as the recommendation Extensible Markup Language (XML) 1.0 from
    February 10, 1998.


    XML is different from SGML XML strips a large number of SGML''s more complex and
    less-used features and creates a new reduced SGML-based application. Because it''s
    a subset of SGML, you can read an XML document with any SGML-compliant system.
    Every valid XML document is a valid SGML element.


    XML is different from HTML Apart from removing HTML misconceptions, it has important
    syntactic differences. Plus, XML is fully Unicode-ready; tags, attributes and
    contents can be in any string encoding defined by Unicode.


    Let''s look at a short example of the source code of this book is:


    ```

    <title>Cutting-Edge Applications</title>

    <abstract>

    <para>

    If you realize that all things change,

