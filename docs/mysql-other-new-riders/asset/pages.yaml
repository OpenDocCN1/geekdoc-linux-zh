    is treated differently than <book><title>. There''s no limitation on the number
    of nested elements in the XML specification—the only requirement is that all elements
    originate in one root element.


    # XML''s Relatives


    The ancestor of XML is SGML. Since it became an ISO standard in 1986, SGML (Standard
    Generalized Markup Language) has been used to maintain structured documents by
    large corporations in all industries. However, SGML is a complex standard that
    didn''t fit to support in applications. Most SGML applications—editors, storage
    servers, transformation tools—are therefore expensive, costing well over $10,000.


    HTML, on the other hand, has a simple type of document for a common class of short
    articles, with headings, paragraphs, lists, illustrations, and some provision
    for hypertext and multimedia. But it''s very limited regarding flexibility and
    extensibility. The tags and semantics are fixed—you can''t define your own tag
    for an entry in a Table of Contents. Neither is it suited for media other than
    computer interfaces—if you ever tried to print articles distributed to multiple
    files, you know what this means. The very open specification led to a fragmentation
    with multiple different implementations. As you know, it is an art per se to write
    browser-neutral HTML.


    So there was a need to create a new format allowing structured documents to be
    used over the Web XML was designed to overcome the limitations in the only viable
    alternatives, SGML and HTML.


    The goals of SGML had clearly defined points:


    +   It must be easy to use—both for users and developers implementing XML parsers.
    The complexity of SGML is a constraint that needs to be removed.


    +   XML must be able to support a wide variety of applications and protocols.
    The dependence on a single, inflexible document type as with HTML needed to be
    eliminated.


    +   It requires strict syntax. Optional features lead to compatibility problems
    when users want to share documents. The constant fear that the same could happen
    as happened with HTML—multiple competing and incompatible implementations.


    +   It must be compatible with SGML. Members of the development committee were
    also involved in SGML efforts and had legacy data contained in SGML systems.'
