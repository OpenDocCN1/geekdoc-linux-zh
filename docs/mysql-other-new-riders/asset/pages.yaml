    # Database Abstraction


    A database abstraction layer is an API to provide a set of functions to deal with
    a multitude of databases in an implementation-independent way. By changing the
    back of the database abstraction layer, you can easily switch from MySQL to Oracle,
    for example. DBI (DataBase Interface) is such a layer, and one of the most well-known
    features of Perl''s PHPLib is its abstraction layer organized in the DB_Sql class.


    # Portability


    For a professional Web application programmer, database abstraction can be useful
    and important. The base of every application is its data-model, a set of data
    structures for general-purpose usage, contained within a database. While PHP supports
    a great number of databases, every database has a different programming interface
    (API). Using these native APIs, operating system and database-independent development
    is impossible—if you want to port an application from MySQL to Oracle you have
    to be prepared for some heavy work, unless you use an abstraction layer like the
    PHPLib. Table 6.1 shows how database can differ from system to system.


    | Description | MySQL | Oracle 7 |

    |---|---|---|

    | Connect | mysql_connect() | ora_logon() |

    | Query | mysql_query() or mysql_db_query() | ora_parse(), then ora_exec() |

    | Get next row of result | or mysql_fetch_array() | Works with offsets: ora_columnname(),
    ora_getcolumn() |

    | Number of rows in a result set | mysql_num_rows() | Not possible, as Oracle
    starts to return rows prior to knowing the total number of rows in the result
    set. |n| Last inserted primary key ID | mysql_insert_id() | No equivalent in PHP
    functions. |'
