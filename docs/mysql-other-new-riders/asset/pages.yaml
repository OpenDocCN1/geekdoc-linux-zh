  md: 'But the PHPLib makes even manual URL rewriting a lot easier. It provides the

    url1() function, which appends the session ID to links when in get mode:

    $link = $sess->url(''script.php3'');


    If your session is currently in get mode, the $link variable would look something
    like this:


    ```

    script.php37Example_Session=2e4c3670ce9a143fee398aeec282f960c

    ```


    The function handles even query strings; it wouldn''t get confused if you called
    it with an URL containing a parameter, for example script.php3?foo=bar.

    As shorthand for producing the linking URL, you can use PHPLib''s purl() function,
    which works the same as url1() but also outputs the generated URL.

    Similarly, self_url1() and self_url() generate and output (with the latter function)
    a tagged link to the current file.


    # Authentication


    The "Authentication" section of Chapter 4 mentioned that HTTP Basic authentication
    has a number of drawbacks, and that you can avoid those with PHPbased authentication.
    The following sections provide details.


    # Advantages of PHP Authentication


    This section continues where we left off in the "Authentication" section of Chapter
    4. We discussed there that HTTP-based Authentication has a number of drawbacks,
    and that you can avoid those with PHP-based authentication. The PHPLib features
    sophisticated classes for handling user authentication and permission management.


    The PHPLib authenticates sessions; thus it depends on the Session class. On those
    pages in you need authentication, the following page_open() call should be made
    to instantiate a session and authentication object:


    ```

    page_open(array("sess" => "Session_Example", "auth" => "Auth_Example"));

    ```


    Being based on sessions introduces a number of advantages for the authentication:


    +   * The username and authentication element are sent only once, at the login.
    Once authenticated, the server stores the authentication data inside the session,
    and doesn''t transmit username or authentication element again. This is different
    than HTTP Basic Authentication, where the username and password are transmitted
    in the HTTP headers of each request. But it also means, if you lose the session,
    you lose the authentication.


    +   * The authentication procedure on the server can be complex. It can use any
    database or other mechanism you can think of. The authentication is handled by
    an undefined function of the Auth class (auth_validatelogin()) and you have to
    implement it.'
