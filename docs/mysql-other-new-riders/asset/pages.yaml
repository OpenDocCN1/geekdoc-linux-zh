  md: '# PHP and XML 259


    To collect information about each element, the scripts need to remember all occurrences
    of each element. We use a global array variable, `$Elements`, to hold all distinct
    elements of the document. The array entries are instances of the `element` class,
    which has four properties (class variables):


    | Property | Description |

    |---|---|

    | count | The number of times the element was found in the document. |

    | chars | Bytes of character data within this element. |

    | parents | Parent elements. |

    | childs | Child elements. |


    As you see, it''s no problem to keep class instances within an array.

    *Tip: A peculiar feature of PHP is that you can traverse class structures like
    you would traverse associative arrays, using the `while(list() = each())` loop
    shown in Chapter 1,"Development Concepts." It will show you all class variables
    and method names as strings.


    Each time an element is found, the count in the corresponding `elements` array
    is incremented. In the parent''s (`parent` meaning the opened element tag), the
    current element is appended to the `childs` array entry. The parent element is
    added with the key `parents`. The rest of the code loops through the `elements`
    array and its subarrays to display the statistics. While this produces a nice
    output, the code `pre se` is neither of particular elegance nor does consist of
    clever tricks; it''s a look like you probably use every day simply to get the
    job.


    # DOM—Document Object Model


    The other family of XML parsers are those that enable access to a Document Object
    Model (DOM) structure. As you''ve seen, with event-based parsers you often have
    to set up your own data structures. The DOM approach avoids this by building its
    own structure in memory. Rather responding to specific events, you work with this
    structure to process the document. While event-based parsers read an XML document
    in small chunks, reducing memory usage and increasing performance, DOM parsers
    need to create an in-memory representation of the whole document. This uses more
    memory—keep this in mind when working with large documents.


    The DOM Level 1.0 was defined as a standard (W3C Recommendation) in October 1998
    by the (by now probably well known) W3C organization.You may have heard of the
    DOM standard already in another context:The term is commonly'
