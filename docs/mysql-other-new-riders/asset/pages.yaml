  md: '# 134 Chapter 4 Web Application Concepts


    All variables you want to preserve across page requests need to be registered
    to the session library with the session_register() function. If this function
    takes the name of a variable as argument, not the variable itself. To register
    the variable $foo, you''d use this:


    ```

    session_register("foo");

    ```


    This code:


    ```

    session_register(\$foo");

    ```


    would produce something meaningful if $foo was the name of another variable:


    ```

    $bar = "This is a string";

    $foo = "bar";

    ```


    You can use session_unregister() to remove variables from the session library.


    As life, it''s not always easy to tell when a session''s life ends—unless it''s
    a violent death, by session_destroy(). If the session is to die of old age, different
    configurations need to be taken into consideration. If you propagate the session
    ID via cookies, the default cookie lifetime is 0, meaning it will be deleted as
    soon as the user closes the browser. You can influence the cookie''s lifetime
    with the configuration value lifetime. Because the server doesn''t know which
    lifetime variable determines how long after the last access to the session the
    data should be destroyed: gc_maxlifetime. But performing such a cleanup of old
    sessions (called garbage_collection) on every page request would cause considerable
    overhead.Therefore, you can specify with what probability the garbage collection
    routine would be invoked. If gc_probability is 100, the cleanup will be performed
    on every request (that, with a probability of 100%); if it''s by 1 by default,
    old sessions will be removed with a probability of 1% per request.


    If you don''t use cookies but pass the session ID via GET or POST, you need to
    pay special attention to the garbage-collection routines. People might bookmark
    URLs containing the session ID, so you need to make sure sessions are cleaned
    up often—if the session data exists when the user accesses the page with the session
    ID at a later time, they will simply reuse the previous session starting with
    a new session, which might not be your intention. On the other hand, don''t set
    the gc_probability too high, especially if you are using file-based session storage.
    Running a garbage collection in this case involves stat all session files, checking
    for the last modified time of these sessions.


    That''s a very expensive operation and should not be started too often. Usually
    a gc_probability of 5 to 10 should be appropriate'
