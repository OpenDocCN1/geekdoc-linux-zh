  md: '# Database Abstraction 203


    Of course, you usually don''t change your database in a weekly rhythm, so this
    might not be of much importance to you. Also, portability between databases is
    a only dream if you use the PHPLib, if you haven''t planned it in your project
    from the beginning. Real life shows that the problem is not portant the API, but
    the database-specific functions. You can create portable database code only by
    accepting that you can''t use specific features of RDBMS—but then you re-creating
    that feature in your code, which may lead to applications that are harder to maintain
    and slower.


    If your aim is to portable code, the PHPLib can make this task a bit easier; for
    example, it has built-in sequence handling and a simple table-locking mechanism,
    which work in a database-independent way. Lately, the PHPLib developers have added
    the class `Query`, `DB_Sql`, which is intended to abstract SQL queries (inserts,
    updates, WHERE statements, and some others, which cover about 80% of the normal
    database usage), to make them database-independent. Currently this class works
    for MySQL and Oracle 7 (and up) only.


    Two other features of PHPLib''s database abstraction layer are as important as
    portability, and those are real time-saves in your daily applications. The following
    sections describe these features.


    # Debugging Mode


    The class `DB_Sql` has a debug mode that allows you to see what queries are sent
    to the database. To switch debugging on, just insert `$db->Debug = true;` in your
    program after having instantiated it. In our programs, we typically have a global
    DEBUG constant, which we assign to the `DB_Sql` class in a similar way:


    ```

    define(''DEBUG'', true);

    $db->Debug = DEBUG;

    ```


    When debugging is switched on, the `DB_Sql` class will print out some values from
    function calls and and much additional information. This can be a great help if
    you''re searching for an error, or if you want to verify that the SQL queries
    your script is generating correct.


    # Error Handling


    PHPLib takes care of all errors that could result from database-related functions.
    On a positive side, the code you write using `DB_Sql` is more compact, because
    you don''t have to bother with error handling yourself.


    With the default settings, a script stops at every error it encounters. This can
    be controlled by changing the class variable `$Halt_On_Error`, which is set to
    yes by default. Setting this variable to report causes the library to print the
    error without exiting the script. Setting this variable to no instructs the library
    to ignore all errors. This may result in unintended side effects, for example
    in inconsistent data, when a failing database query is ignored—so be careful with
    this option. In production applications,'
