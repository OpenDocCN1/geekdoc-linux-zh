  md: '# Usability: Just Do It


    Nielsen says, “Two of the fundamental slogans of discount usability engineering
    are ‘any data is data’ and ‘anything is better than nothing’ when it comes to
    usability.” We encourage you to discount usability engineering—and to apply it
    in your development as often and regularly as possible. It doesn’t cost much and
    will signifi-c enhance the user experience.


    # Summary


