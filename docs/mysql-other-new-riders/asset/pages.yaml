- img_proc: true
  md: '# Table 9.3 Macros to Declare Startup and Shutdown Functions


    | Macro | Description |

    | --- | --- |

    | ZEND_INIT(module) | Declares a function for module startup. The generated name
    will be zend_init_<module> (for example, zend_init_first_module). Use in conjunction
    with ZEND_INIT_FUNCTION. |

    | ZEND_MSHUTDOWN(module) | Declares a function for module shutdown. The generated
    name will be zend_mshutdown_<module> (for example, zend_mshutdown_first_module).
    Use in conjunction with ZEND_MSHUTDOWN_FUNCTION. |

    | ZEND_RINIT(module) | Declares a function for request startup. The generated
    name will be zend_rinit_<module> (for example, zend_rinit_first_module). Use in
    conjunction with ZEND_RINIT_FUNCTION. |

    | ZEND_RSHUTDOWN(module) | Declares a function for request shutdown. The generated
    name will be zend_rshutdown_<module> (for example, zend_rshutdown_first_module).
    Use in conjunction with ZEND_RSHUTDOWN_FUNCTION. |

    | ZEND_GINIT(module) | Declares a function for global startup. The generated name
    will be zend_ginit_<module> (for example, zend_ginit_first_module). Use in conjunction
    with ZEND_GINIT_FUNCTION. |

    | ZEND_GSHUTDOWN(module) | Declares a function for global shutdown. The generated
    name will be zend_gshutdown_<module> (for example, zend_gshutdown_first_module).
    Use in conjunction with ZEND_GSHUTDOWN_FUNCTION. |

    | ZEND_MININFO(module) | Declares a function for printing module information,
    used when phpinfo() is called. The generated name will be zend_info_<module> (for
    example, zend_info_first_module). Use in conjunction with ZEND_MININFO_FUNCTION.
    |


    # Implementation of get_module()


    This function is special to all dynamic loadable modules. Take a look at the implementation
    first:


    ```

    #if COMPILE_DL

    DLLEXPORT zend_module_entry *get_module(void) { return(&firstmod_module_entry);
    }

    #endif

    ```'
  merge: -1
