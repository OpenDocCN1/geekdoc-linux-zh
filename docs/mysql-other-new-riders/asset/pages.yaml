  md: '# Linked Lists 57


    ![](img/eddeabf7128be657d5f7345abdc760ac_74_0.png)


    **Figure 2.11** Broken links in a tree.


    Again, this can be overcome with strict checking in the library functions and
    the garbage collector.

    tree_link_left() and tree_link_right() link a node as left and right child, respectively,
    by assigning the associated handler to the $idx_left and $idx_right properties
    in the node structure. You can find counterparts in tree_get_left() and tree_get_right(),
    which read the handles of the left and right links, respectively, of the node.
    Additionally, tree_get_parent() determines the parent node of a subnode.

    to store contents to introduce and retrieve data from, you can use tree_assign_node_contents()
    and tree_retrieve_node_contents(). Again, PHP''s dynamic character is most helpful
    in this case, as we don''t need to fix nodes to certain datatypes. It became a
    common practice in C++ to instantiate trees using class templates, which generated,
    for example, tree classes for integers (only). Even though you could instantiate
    as many trees for as many dat as you liked, it wasn''t easy to store dynamically
    typed content with this method. PHP simply accepts mixed types, which, for example,
    allows you to suddenly change all nodes'' datatypes, and so forth.


    > **Exercise: Implement Proper Garbage Collection into the Tree Library**

    Hint: You introduce a new flag in the node structure for reference counting; this
    makes automatic garbage collection easier and faster.


    Don''t underestimate exercises. Knowing how to do something is substantially different
