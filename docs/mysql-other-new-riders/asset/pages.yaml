    Some project managers are known to set the PHP configuration directive register_globals
    (available only in PHP 4.0) to false, to force their programmers to use the $HTTP_VARS
    arrays.

    You can also influence the order in which variables are added to the global space.
    By default, variables_order configuration directive is set to "EGPCB". This tells
    PHP to include variables in this order:


    +   1. Environment variables

    2. GET

    3. POST

    4. Cookies

    5. Built-in variables (server variables)


    This means that if the user uses a PATH variable in the GET request, he or she
    would overwrite the environment variable—newer values override previous ones.
    By using getenv() or changing the variables_order directive, you can make sure
    that you actually access environment variables and not user-supplied variables.

    Session variables always overwrite variables coming from any other space; because
    they''re coming from an already secured trust zone, which avoids a lot of security
    problems.


    # Don\u2019t Reinvent Cryptography\u00


    Cryptography is the science of using mathematics to encrypt and decrypt data.
    It enables you to store sensitive information or transmit it through insecure
    communication channels that it cannot be read by anyone except the intended recipient.
    Data encryption is a science of ours—don''t even try to invent your own encryption
    algorithms. Use established algorithms such as RC5 or Blowfish.


    # Encrypting with MCrypt Functions


    If you compiled PHP with the mcrypt module, a wide variety of powerful encryption
    and decryption algorithms are at your disposal. The later section "The MCrypt
    Functions" shows how to use this module and how to find out which algorithms are
    supported on your system.'
