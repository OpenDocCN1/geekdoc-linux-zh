  md: "# Chapter 3 Application Design: A Real-Life Example\n\nThe library we've chosen\
    \ for this project is phpIRC (www.phpwizard.net/phpIRC), for these reasons:\n\n\
    +   - It's easy to use.\n- It's a powerful, complete API.\n- It uses event-based\
    \ processing.\n\nThe use of event-based processing is particularly interesting\
    \ here. This is a technique usually implemented in traditional applications; for\
    \ example, all Windows programs are event-based. Event-based programs run in an\
    \ endless loop, waiting for something (an event). Happen can include user input,\
    \ mouse movements, network events (incoming packets), etc. As soon as an event\
    \ is signaled, the program breaks out of its main loop and searches for a procedure\
    \ that handles this event. All procedures that want to handle the event that occurred\
    \ are called with the specific parameters of the event (for example, packet data\
    \ of incoming network traffic).\n\nConcretely, using \"traditional\" programming,\
    \ an incoming ping would be handled as shown in Listing 3.1:\n\n# Listing 3.1\
    \ Pseudocode for handling a ping.\n\n```\nwait_for_network_data();\n\nif(incoming_data\
    \ == ping) {\n    send_pong();\n    update_traffic_counter();\n}\n\ngoto again;\n\
    ```\n\nThis code waits until it receives data from the network, then tries to\
    \ find out whether the data was a ping. If so, the code sends pong back and updates\
    \ a traffic counter for statistical reasons. After that, it jumps back to where\
    \ it begins. Imagine this with hundreds of events, some of which might depend\
    \ on others, some, not, some only under certain circumstances...A pain!\n\nHowever,\
    \ event-based programming makes it significantly easier, as shown in Listing 3.2:\n\
    \n# Listing 3.2 Event-based pseudocode for handling a ping.\n\n```\nevent_handler\
    \ ping() {\n\n    send_pong();\n```"
  merge: -1
  pgno: 117
- img_proc: true
  md: "```\n}\nevent_handler incoming_data()\n{\n    update_traffic_counter();\n \
    \   case of ping: handle_event(ping);\n}\nwhile(not_done())\n{\n    wait_for_event();\n\
    \    case of network_data: handle_event(incoming_data);\n}\n```\n\nThe code looks\
    \ bigger, but also much clearer. The main loop waits for an event to happen. If\
    \ it finds an event happened and that was triggered by incoming network data,\
    \ it dispatches this event using the central procedure handle_event(). This function\
    \ determines a handler for the event and calls it. The handler in turn updates\
    \ the traffic counter and launches another event if the first event was a ping.\
    \ After dispatching the event using handle_event() again, a pong is sent.\n\n\
    > Alternatively, both ping() and incoming_data() could register themselves to\
    \ the event \"incoming_data\". However, creating two different events gives a\
    \ greater variety of events and thus allows for much more detailed, target-oriented\
    \ processing.\n\nIt's a bit strange at first when used to event-based processing\
    \ of information (it works similarly to a finite-state machine), but it has many\
    \ advantages:\n\n+   - A modular structure is forced on the application. Each\
    \ module works independently of the other modules and can easily be changed, exchanged,\
    \ or extended.\n- Any of the part of the program can trigger any kind of event\
    \ and thus enforce any type of reaction in the application (in other words, you\
    \ can control any part of your code from any other part of your code)."
