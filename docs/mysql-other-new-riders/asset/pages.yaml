    # # 2 Advanced Syntax


    > The world is formed from the wid, like utensils from a block of wood. The Master
    knows the utensils, yet keeps to the block: thus he can use all things.


    AS MENTIONED IN CHAPTER 1, WE BELIEVE that to truly master a language, it''s crucial
    to understand not just the syntax and semantics of the language, but its philosophy,
    background, and design characteristics. In order to master PHP, you have to know
    about all its specialties as well.


    # ## PHP Syntax


    PHP is a mixture of different languages. You can see a strong influence from C
    (some Java, but Java also inherited from C). PHP''s syntax is strongly influenced
    by C, its semantics differ from C''s semantics. PHP is interpreted and knows no
    strict variable types.When you refer to a variable, its type is determined “on
    the fly” and treated just as the current situation requires. This is a somewhat
    simplified explanation, but you should keep this in mind when developing.'
  merge: -1
