    \ the function\nturn true; otherwise it returns false.\n\nEach user has associated\
    \ privileges. Using the Example_Auth implementation, the\npileges are stored in\
    \ the auth_user MySQL table. You've seen the field earlier:\nperms varchar(255)\n\
    \nA list of permissions is defined in the class derived from Perm, namely in the\n\
    $permissions class variable. The Example_Perm class has the following permissions:\n\
    \n```\n$permissions = array(\n  \"user\" => 1,\n  \"author\" => 2,\n  \"editor\"\
    \ => 4,\n  \"supervisor\" => 8,\n  \"admin\" => 16\n);\n```\n\nPermissions are\
    \ translated to bitmaps internally, and calculated with logical OR and\nAND. While\
    \ this might seem a bit complicated, using bit patterns has some advantages for\n\
