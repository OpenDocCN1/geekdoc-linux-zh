  md: 'In another scenario, DDWDX could be used in server-to-server interaction. Certain
    services may work best on a Windows NT platform; for example, querying a SAP back
    end using a COM connector. You could use ASP for this, and hand over the query
    results as DDWDX packets to your PHP application on a UNIX Web server. The packets
    would be turned into PHP data structures, such as arrays, transparently and without
    further query.


    # Abstracting Data with DDWDX


    The most important fact up: DDWDX is XML. The possible DDWDX structures are defined
    in an XML DTD; and therefore valid DDWDX packets are always wellformed and valid
    XML. The specification doesn''t require DDWDX packets to be valid, as they don''t
    need to include a document type declaration in the document prologue.


    The basic idea is that DDWDX transforms any data representation—integers, strings,
    arrays, etc.—into an XML representation, which conforms to the DDWDX DTD. This
    data can be transferred over any communications capable of transferring XML: HTTP;
    FTP, etc. At any time, the data can be read from the DDWDX format back into the
    exact structure as before. During this conversion process, datatypes are preserved.
    If you serialize as DDWDX packet, it will be an array at deserialization time.


    Now, if this was all, it wouldn''t be very exciting. After all, you can serialize
    any data in PHP into a proprietary form using serialize() and bring it back with
    deserialize() as many times as you like.The interesting aspect of DDWDX is that
    the serialized representation is in XML, and the serializer and deserializer modules
    are completely separated from it. Each of the programming languages using DDWDX
    will be able to serialize and deserialize DDWDX packets. Serialize a PHP array
    to a DDWDX packet, deserialize the packet in ASP—and you''ve got an array again!
    The actual implementation of the serializer/deserializer is not important; in
    PHP, you''ve got the ddwx_() functions; in ColdFusion, you use the CFDDWX tag;
    as in COM functions:


    Sure, all could be done without DDWDX. Doing so would be so pretty complicated,
    especially when you think of preserving datatypes across different programming
    environments. The advantage of DDWDX is that it frees you from this undertaking
    and provides a flexible, open, and pragmatic way for exchanging structured application
    data.


    # DDWDX Datatypes


    Most programming languages share a common set of datatypes; for example, strings
    or arrays. Accessing these structures may vary from language to language, but
    the general idea remains: A string is a series of characters, and whether you
    enclose them with a single quote, double quotes, or not at all matters from a
    conceptual point of view.'
