  md: '# 340 Chapter 9 Extending PHP 4.0: Hacking the Core of PHP


    Now, to add a resource to the list, use zend_list_insert():


    ```

    // allocate resource here and fill it with values

    resource = (my_resource *)emalloc(sizeof(my_resource));

    ```


    resource_value = zend_list_insert(resource, resource_handle); The function accepts
    two arguments: first is the pointer to the resource that you want to add to the
    list, and the second is the type of the resource (for which you previously registered
    a destructor). You can now use the return value of this call to zend_list_insert()
    as the value field in your IS_RESOURCE zval container.


    For example, to use the resource allocated as return value, this do:


    ```

    RETURN_RESOURCE(resource_value);

    ```


    Or, more elaborately:


    ```

    return_value->type = IS_RESOURCE;

    return_value->lval = resource_value;

    ```


    You can see that resources are stored in the lval field. Zend now keeps track
    of all references to this resource. As soon as all references to the resource
    are lost, the destructor that you previously registered for this resource is called.
    The nice thing about this is you don''t have to worry about memory leaks caused
    by allocations in your module—just register every allocation that your calling
    script will refer to as resources. As soon as the script decides it doesn''t need
    them, Zend will find out and tell you. To force removal of a resource from the
    list, use the function zend_list_delete(). You can also force the reference count
    to increase if you know you''re creating another reference for a previously allocated
    resource (for example, if you''re automatically using a defunct database link).
    For this case, use the function zend_list_addref(). To search for previously allocated
    resources, use zend_list_find(). The complete API can be found in zend_list.h.


    For a little example showing how to make use of resources, see the demonstration
    on the CD-ROM.


