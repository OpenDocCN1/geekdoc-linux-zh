  md: "# Validating an Email Address\n\nValidating an email address is a common problem.\
    \ Our approach only verifies the syntactical correctness using the following regular\
    \ expression:\n\n```\n$ret = ereg(\n  '([a-zZ-9_\\-]+\\.)+\\',\n  '\\'@\\'',\n\
    \  '([a-zZ-9_\\-]+\\.)+\\',\n  '\\'[a-z]{2,4}\\'$',\n  $string);\n```\n\n+   -\
    \ Must contain a defined set of characters before the (@) sign\n- An @sign\n-\
    \ A hostname with a minimum length of two characters\n- A top-level domain with\
    \ a minimum length of two characters\n\nIn most cases, validation is sufficient-but\
    \ it is by means no complete check against the official syntax defined in RFC\
    \ 822. The RFC calls for email addresses in the form \"Name <mail@host.com>\"\
    , which we would reject. But our check also not test whether the email address\
    \ actually exists.\n\nOccasionally, we will see another approach that seems to\
    \ be more stringent at first glance, but fails often in real life to be useful.\
    \ It's based on the fact that SMTP, the Simple Mail Transfer Protocol, provides\
    \ feedback as to whether a user exists. By sending the SMTP header indicating\
    \ the recipient's address or username over the local system, the SMTP server responds\
    \ with a status code of 250 if the user exists and a status code of 550 if the\
    \ user is unknown to the system. So far, good–in-theory works \"250-Recipient\
    \ OK\". We tried it with one of the mail servers we use; because our mail server\
    \ was configured that, we got the expected response of accepting all users. SMTP\
    \ is a clear-text protocol, you can easily verify this by \"simulating\" an SMTP\
    \ session over Telnet:\n\n```\nbash-2.0$ telnet smtp.dnet.it 25\nTrying 194.242.192..\n\
    Connected to dnet.it.\nEscape character is '\\'.\n220 ns.dnet.it ESMTP 8.9.3/8.9.3;\
    \ Tue, 26 Oct 1999 14:02:43 +0200 (MET)\nHELO mail.profi.\n250 hello mail.profi\
    \ [194.242.194], pleased to meet you\nMAIL FROM: tobias@dnet.it\n250 RCPT TO:\
    \ this.user.doesnt.exist.for.sure\n250 this.user.doesnt.exist.for.sure... Recipient\
    \ ok\nQUIT\n221 ns.dnet.it closing connection\nConnection closed by foreign host.\n\
    ```"
