    To create an instance of a DCOM component on a remote system, pass the hostname
    as second argument to the constructor. For example:


    ```

    $comp = new COMObject("My.Component", "remote.server.com");

    ```


    In PHP 3.0, you can''t use the COM class; instead, you need to use the com_load(),
    com_invoke(), com_set(), and com_get() functions. Our example would look like
    Listing 5.5.


    # Listing 5.5 A basic COM example with PHP version 3.0.


    ```

    $Amount = 1000; // Amount to be converted

    $Scurr_from = "DEM"; // ISO currency symbol of original currency

    $Scurr_to = "ITL"; // Symbol of the target currency

    ```


    ```

    // Instantiate new COM object

    $conv = com_load("Softing.EDConverter") or die("Unable to instantiate\n=Euro-Converter");

    ```


    ```

    // Execute a method on the COM object''s instance

    $ret = com_invoke($conv, "Triangulate", "10000", "ITL", "DEM") or

    die("Exception triggered by Triangulate() on line ".__LINE__");

    ```


    ```

    // Print the result

    print($ret);

    ```


    The syntax of these functions (that are not available in PHP 4.0) is as follows:


    +   - com_load(string component_name)

    Instantiates a COM component and creates a reference to it. The returned integer
    value must be used in the following com_() calls. Returns false and throws a warning
    if error occurs.

    - com_invoke(int com_identifier, string function_name[, mixed argument[1...]])

    Invokes a COM component''s method and returns the method''s return value. The
    first argument of the function is a valid COM identifier as created with com_load().
    The second argument must be the name of a component method. As optional third
    and following arguments, you can specify arguments for the invoked method. This
    function returns false on error.'
