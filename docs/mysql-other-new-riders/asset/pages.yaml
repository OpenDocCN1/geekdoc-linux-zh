    The example works in a pretty straightforward way. First, the XML parser instance
    is created using xml_parser_create(). In all subsequent functions, you''ll use
    the identifier you created this—in similar to the result-identifier in MySQL functions.
    Then the default handler is registered and the file is parsed. xml_parse_from_file()
    is a custom function we provide in a library; this function simply opens the file
    specified as argument and parses it in blocks of 4KB. Original XML functions xml_parse()
    and xml_parse_into_struct() operate on strings—using wrappers for opening, reading,
    and closing a file and passing its contents to the respective functions, you can
    save and code.


    The default handler checks whether the current state is a comment and outputs
    if this is the case. Along with each comment, the current line number (returned
    by xml_get_current_line_number()) is also printed.


    Now, while this example shows off the basics of invoking the XML parser, registering
    callback functions, and processing data, it doesn''t exactly demonstrate the common
    usage of an XML parser. It doesn''t process information; raw data is just in and
    scanned for a string—nothing that could be done with regular expressions. In most
    situations where you process XML, you''ll want to keep at least a basic representation
    of the document structure.


    # Stacks, Depths, and Lists


    Our second example illustrates how to remember the element depth is currently
    processing. In the start-element handler the global $depth variable is increased
    by four; in the stop-element handler it''s decreased by the same figure. This
    is the most reduced case of a parser stack—no structure other than depth information
    is being kept. As an XML printer, the example uses the depth to properly indent
    code. The handler functions using a Cascading Style Sheet to the current data
    to produce nicely formatted output. The only other noteworthy part of the code
    is this:


    ```

    xml_parser_set_option($parser, XML_OPTION_CASE_FOLDING, 0);

    ```


    This disables folding for the parser, telling it that the case of element names
    should be preserved. If this option is enabled, all element names are transformed
    to uppercase. Usually, you''ll want to turn this off, as case is important for
    element names in XML.


    We won''t print the code of the example because of its simplicity; you can find
    it on the CD-ROM. Figure 7.4 shows a screen shot of the output.'
