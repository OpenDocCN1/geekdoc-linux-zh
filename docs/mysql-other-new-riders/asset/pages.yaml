    Figure 3.2 A sample IRC network structure.


    This is one of the main problems of this “limited by design” network: All public
    traffic has to go to all servers. This problem will really arise under the conditions
    in we intend to implement our IRC network? Surely not, as the number of clients
    we intend to handle will never be so large as to be harmful, giving a standard
    server-hosting situation. In internal networks, this problem shouldn''t arise
    at all.


    To reduce the total number of critical links, the network can be laid out to follow
    its physical topology. If one server is connected with higher capacity than the
    rest, for example, it can take more leaf nodes than others (connecting leaf nodes
    to a small backbone wouldn''t even make sense). Another option is to set up the
    routing to fit the network. For example, U.S. servers are homed in the States,
    German servers are homed in Germany, and so on. Frankfurt has an overseas link
    to New York; thus, the IRC server in Frankfurt would link to New York’s server
    (following the network’s physical layout). It could also be done in another way:
    Frankfurt routed from Frankfurt to Poland would need to find some other way to
    cross the ocean—it would be routed to some other country (or even two or three
    countries) until it finds a free overseas link. This additional routing wastes
    a lot of bandwidth; thus, atttempt are being made to adapt the IRC network structure
    to best fit the underlying physical network structure.


    These designs are present only in the biggest networks, carrying tens of thousands
    of users. These networks really need to find reliable links for their backbones.
    Typical Web-based chat rooms or networks are unlikely to carry more than 1,000
    clients at once, so you should run into serious problems at first. To avoid complications,
    however, it’s a good idea to plan around these sorts of problems that may arise
    ever.


    From a server’s point of view, the network looks like Figure 3.3.'
