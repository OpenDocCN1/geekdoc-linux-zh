  md: "# Returning Values 343\n\nZend ships with a function, called zend_copy_ctor()\
    \ (the previous PHP equivalent was pval_copy_constructor()).\n\nA useful demonstration\
    \ is a function that accepts a complex type as argument, modifies it, and then\
    \ returns the argument:\n\n```\nzval **parameter;\n\nif((ZEND_NUM_ARGS()) != 1)\
    \ || (zend_get_parameters_ex(1, &parameter) != SUCCESS)\n{\n    WRONG_PARAM_COUNT;\n\
    }\n```\n\n```\n// we now want to return the modified container:\n*return_value\
    \ == **parameter;\nzval_copy_ctor(return_value);\n```\n\nThe first part of the\
    \ function is plain-vanilla argument retrieval. After the (left out) modifications,\
    \ it gets interesting: The container of parameter is assigned to the (defined)\
    \ return_value container. Now, in order to effectively duplicate its contents,\
    \ the copy constructor is called. The copy constructor works directly with the\
    \ supplied argument, and the standard return values are FAILURE or SUCCESS on\
    \ success.\n\nIf you call the copy constructor in this example, both parameter\
    \ and return_value would point to the same internal data, meaning that return_value\
    \ would be an illegal additional reference to the same data structures. Whenever\
    \ changes occurred in the data that parameter points to, return_value might be\
    \ affected. Thus, in order to create separate copies, the copy constructor must\
    \ be used.\n\nThe copy constructor's counterpart in the Zend API, the destructor\
    \ zval_dtor(), does the opposite of the constructor. The corresponding alias in\
    \ the PHP API is pval_destructor().\n\n# Returning Values\n\nReturning values\
    \ from your functions to PHP was described briefly in an earlier section; this\
    \ section gives the details. Return values are passed via the return_value variable,\
    \ which is passed to your functions as argument. The return_value argument consists\
    \ of a zval container (see the earlier description of the call interface) that\
    \ you can freely modify. The container is already allocated, so you don't have\
    \ to run MAKE_STD_ZVAL on it. Instead, you can access its members directly.\n\n\
    To make returning values from functions easier and prevent hassles with accessing\
    \ the internal structures of the zval container, a set of predefined macros is\
    \ available (as usual). These macros automatically set the corresponding type\
    \ and value, as described in Tables 9.14 and 9.15."
