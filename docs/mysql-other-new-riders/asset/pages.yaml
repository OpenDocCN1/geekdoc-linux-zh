  md: "It is good practice to create a separate header file for your module that contains\
    \ module-specific definitions. This header file should contain all the forward\
    \ definitions for exported functions and also include php.h.\n\n# Declaring Exported\
    \ Functions\n\nTo declare functions that are to be exported (i.e., made available\
    \ to PHP as native functions), Zend provides a set of macros. A sample declaration\
    \ looks like this:\n\n```\nZEND_FUNCTION(my_function);\n```\n\nZEND_FUNCTION declares\
    \ a C function that complies with Zend's internal API. This means that the function\
    \ is of void and accepts INTERNAL_FUNCTION_PARAMETERS (another macro) as parameters.\
    \ It prefixes the function name with zend_if. The immediately expanded version\
    \ of the above definition would look like this:\n\n```\nvoid zend_my_function(INTERNAL_FUNCTION_PARAMETERS);\n\
    ```\n\nExpanding INTERNAL_FUNCTION_PARAMETERS(int ht) results in the following:\n\
    \n```\nvoid zend_my_function(int ht, zval *return_value,\n    =zend_this_ptr,\
    \ int return_value_used,\n    =zend_executor_globals executor_globals);\n```\n\
    \nSince the interpreter and executor core have been separated from the main PHP\
    \ package, a second API defining macros and functions has evolved: the Zend API\
    \ as now quite handles a lot of the responsibilities that previously belonged\
    \ to PHP. A lot of PHP functions have been reduced to aliasing to calls into the\
    \ Zend API. The recommended practice is to use the Zend API wherever possible,\
    \ as the old API is only preserved for compatibility reasons. For example, the\
    \ types zval and pval are identical. Zend's definition; pval is PHP's definition\
    \ (actually, pval is an alias for zval now). As the macro INTERNAL_FUNCTION_PARAMETERS\
    \ is a Zend macro, the above declaration contains zval. When writing code, you\
    \ should always use zval to conform to the new API.\n\nThe parameter list of this\
    \ declaration is very important; you should keep these parameters in mind (see\
    \ Table 9.1 for descriptions).\n\nTable 9.1 Zend's Parameters to Functions Called\
    \ from PHP\n| Parameter | Description |\n|---|---|\n| ht | The number of arguments\
    \ passed to the Zend function. You should not touch this directly, but use ZEND_NUM_ARGS()\
    \ to obtain the value. |\n| return_value | This variable is used to pass any return\
    \ values of your function back to PHP. Access to this variable is best done using\
    \ the predefined macros. For a description of these below. |\n\ncontinues"
  merge: -1
  pgno: 326
- img_proc: true
  md: "# 310 Chapter 9 Extending PHP 4.0: Hacking the Core\n\n| Table 9.1 Continued\
    \ |\n|---||\n| this_ptr | Using this variable, you can gain access to the object\
    \ in which your function is contained, if it's used within an object. Use the\
    \ function getThis() to obtain this pointer. | return_value_used | This flag indicates\
    \ whether an eventual return value from the function will actually be used by\
    \ the calling script. 0 indicates that the return value is not used; 1 indicates\
    \ that the caller expects a return value. Evaluation of this flag can be done\
    \ to verify correct usage of the function as well as speed optimizations in case\
    \ returning a value requires expensive operations (for an example, see array.c\
    \ makes use of this). | executor_globals | This variable points to global settings\
    \ of the Zend engine. You'll find this useful when creating new variables, for\
    \ example (more about this later). The executor globals can also be introduced\
    \ to your function by the macro ELS_FETCH(). |\n\n# Declaration of the Zend Function\
    \ Block\n\nNow that you have declared the functions to be exported, you also have\
    \ to introduce them to Zend. Introducing the list of functions is done by an array\
    \ of zend_function_entry. This array consecutively contains all functions that\
    \ are to be made available externally, with the function's name as it should appear\
    \ in PHP and its name defined in the C source. Internally, zend_function_entry\
    \ is defined as shown in Listing 9.5.\n\nListing 9.5 Internal declaration of zend_function_entry.\n\
    \n```\ntypedef struct _zend_function_entry {\n    char *fname;\n    void (*handler)\
    \ (INTERNAL_FUNCTION_PARAMETERS);\n    unsigned char *func_arg_types;\n} zend_function_entry;\n\
    ```"
  merge: -1
  pgno: 327
- img_proc: true
  md: "# Source Discussion 311\n\nThe following table describes the entries.\n\n|\
    \ Entry | Description |\n| --- | --- |\n| fname | Denotes the function name as\
    \ seen in PHP (for example, fopen, mysql_connect, or, in our example, first_module).\
    \ |\n| handler | Pointer to the C function responsible for handling calls to this\
    \ function. For example, see the standard INTERNAL_FUNCTION_PARAMETERS discussed\
    \ earlier. |\n| func_arg_types | Allows you to mark certain parameters so that\
    \ they're forced to be passed by reference. You usually set this to NULL. |\n\n\
    In the example above, the declaration looks like this:\n\n```\nzend_function_entry_firstmod_functions[]\
    \ =\n{\n    zend_FE(first_module, NULL)\n    NULL, NULL, NULL\n};\n```\n\nYou\
    \ can see that the last entry in the list always has {NULL, NULL, NULL}. This\
    \ marker is to be set for Zend to know when the end of the list of exported functions\
    \ is reached.\n\n> Note: You cannot use the predefined macros for the end marker,\
    \ as they would refer to a function named \"NULL\"\n\nThe macro zend_FE simply\
    \ expands to a structure in zend_function_entry. Note that these macros will be\
    \ prefixed with zend_if_, meaning that zend_FE(first_module) will refer to a C\
    \ function zend_if_module().). If you want to make macro with hand-coded entries\
    \ (not a proper function), keep this in mind.\n\nTip: Compilation errors that\
    \ refer to functions named zend_if-\\* relate to functions defined with ZEND_FE.\n\
    \nTable 9.2 shows a list of all the macros you can use to define functions.\n\n\
    | Macro Name | Description |\n| --- | --- |\n| ZEND_FE(name, arg_types) | Defines\
    \ a function entry of a name in corresponding zend_function_entry. Requires arg_types\
    \ needs to be set to NULL. function uses automatic C function generation by prefixing\
    \ the PHP function name with zend_if_. For example, ZEND_FE*(\"first_module\"\
    , NULL) introduces a function zend_first_module() to PHP and links it to the C\
    \ function zend_first_module(). Use in conjunction with ZEND_FUNCTION. |\n\ncontinues"
  merge: -1
  pgno: 328
- img_proc: true
  md: "# 312 Chapter 9 Extending PHP 4.0: Hacking the Core\n\nTable 9.2 Continued\n\
    \n| Macro Name | Description |\n| ZEND_NAMED_FE (php_name, name, arg_types) |\
    \ Defines a function that will be available to PHP by the name php_name and links\
    \ to the corresponding C function name_arg_types needs to be set to NULL if you\
    \ do not use the automatic prefixing introduced by ZEND_FE. Use conjunction with\
    \ ZEND_FUNCTION. |\n| ZEND_FALIAS (name, alias, arg_types) | Defines an alias\
    \ for name.arg_types needs to be set to NULL. Doesn't require a corresponding\
    \ function; refers to the alias instead. |\n| PHP_FE (name, arg_types) | Old PHP\
    \ API equivalent of ZEND_FE. |\n| PHP_NAMED_FE (runtime_name, arg_types) | Old\
    \ PHP API equivalent of ZEND_NAMED_FE. |\n\nNote: You can't use ZEND_FUNCTION\
    \ in conjunction with PHP_FUNCTION, or PHP_FE in conjunction with ZEND_FUNCTION.\
    \ However, it's perfectly legal to mix ZEND_FE and PHP_FUNCTION when staying with\
    \ the same macro set for each function to be declared. But mixing is not recommended;\
    \ instead, you're advised to use the ZEND* macros.\n\n# Declaration of the Zend\
    \ Module Block\n\nThis block is stored in the structure zend_module_entry and\
    \ contains all necessary information to describe the contents of this module Zend.You\
    \ can see the internal definition of this module in Listing 9.6.\n\nListing 9.6\
    \ Internal declaration of zend_module_entry.\n\n```\nstruct zend_module_entry\
    \ {\n  char *name;\n  zend_function_entry *functions;\n  int (*module_startup_func)(INIT_FUNC_ARGS);\n\
    \  int (*module_shutdown_func)(SHUTDOWN_FUNC_ARGS);\n  int (*request_startup_func)(INIT_FUNC_ARGS);\n\
    \  int (*request_shutdown_func)(SHUTDOWN_FUNC_ARGS);\n  void (*info_func)(ZEND_MODULE_INFO_FUNC_ARGS);\n\
    \  int (*global_startup_func)(void);\n  int (*global_shutdown_func)(void);\n\n\
    \  Rest of the structure is not interesting here\n\n};\n```"
  merge: -1
  pgno: 329
- img_proc: true
  md: "The following table describes the entries.\n\n| Entry | Description |\n|---|---|\n\
    | name | Contains the module name (for example, 'File functions', 'Crypt', etc.).This\
    \ name will show up in phpinfo(), in the section \"Additional Modules.\" |\n|\
    \ functions | Points to the Zend function block, discussed in the preceding section.\
    \ |\n| module_startup_func | This function is called once upon module initialization\
    \ and can be used to do one-time initialization steps (such as memory allocation,\
    \ etc.). To indicate a failure during initialization, return FAILURE; otherwise,\
    \ SUCCESS. To mark this field as unused, return NULL. To declare a function, use\
    \ the macro ZEND_MINIT |\n| module_shutdown_func | This function is called once\
    \ upon module shutdown and can be used to do one-time deininitialization steps\
    \ (as memory deallocation). This is the counterpart to module_startup_func().\
    \ To indicate a failure during deininitialization, return FAILURE; otherwise,\
    \ SUCCESS. To mark this field as unused, return NULL. To declare a function, use\
    \ the macro ZEND_SHUTDOWN |\n| request_startup_func | This function is called\
    \ once every page request and can be used to do one-time initialization steps\
    \ that are required to process a request. To indicate a failure here, return FAILURE;\
    \ otherwise, SUCCESS. |\n| request_shutdown_func | This function is called once\
    \ after every page request and works as counterpart to request_startup_func().\
    \ To indicate a failure here, return FAILURE; otherwise, SUCCESS. \n\nNote: As\
    \ dynamic modules are loaded only on page requests, the request startup function\
    \ is called right after the module startup function (both initialization events\
    \ happen at the same time). To mark this field as unused, return NULL. To declare\
    \ a function, use the macro ZEND_RINIT.\n\nNote: As dynamic modules are loaded\
    \ only on page requests, the request shutdown function is immediately followed\
    \ by a call to the module shutdown handler (both deininitialization events happen\
    \ at the same time). To mark this field as unused, return NULL. To declare a function,\
    \ use the macro ZEND_RSHUTDOWN.\n\ncontinues"
  merge: -1
  pgno: 330
- img_proc: true
  md: "# 314 Chapter 9 Extending PHP 4.0: Hacking the Core of PHP\n\n| Entry | Description\
    \ |\n|---|---|\n| info_func | When phpinfo() is called in a script, Zend cycles\
    \ through all loaded modules and calls this function. Every module then has the\
    \ chance to print its own 'footprint' into the output page. Generally this is\
    \ used to dump environmental or statistical information. To mark this field as\
    \ unused, NULL. To declare a function, use the macro ZEND_MINFO. |\n| global_startup_func\
    \ | The startup functions are rarely used. You should usually skip through the\
    \ rest of this structure by placing the macro STANDARD_MODULE_PROPERTIES. To mark\
    \ this field as unused, NULL. To declare a function, use the macro ZEND_GSHUTDOWN.\
    \ |\n| global_shutdown_func | To mark this field as unused, NULL. To declare a\
    \ function, use the macro ZEND_GSHUTDOWN. |\n| Remaining structure elements |\
    \ These are used internally and can be prefilled by the macro STANDARD_MODULE_PROPERTIES_EX.\
    \ You should not assign any values to them. Use STANDARD_MODULE_PROPERTIES_EX\
    \ if you use global startup and shutdown functions; otherwise, use STANDARD_MODULE_PROPERTIES\
    \ directly.|\n\nIn our example, this structure is implemented as:\n\n```\nzend_module_entry_firstmod_module_entry\
    \ = {\n    \"First Module\",\n    firstmod_functions,\n    NULL, NULL, NULL,\n\
    \    STANDARD_MODULE_PROPERTIES\n};\n```\n\nThis is basically the easiest and\
    \ most minimal set of values you could ever use. The module name is set to First\
    \ Module, then the function list is referenced, after which all startup and shutdown\
    \ functions are marked as unused.\nFor reference, you can find a list of macros\
    \ in startup and shutdown functions in Table 9.3. These are not used in our basic\
    \ example, yet will be demonstrated later on. You should make use of these macros\
    \ to declare your startup and shutdown functions, as these require special arguments\
    \ to be passed (INIT_FUNC_ARGS and SHUTDOWN_FUNC_ARGS), which are automatically\
    \ included into the function declaration when using predefined macros. If you\
    \ declare your functions manually and the PHP developers decide that a change\
    \ in the argument list is necessary, you'll have to change your module sources\
    \ to remain compatible."
  merge: -1
