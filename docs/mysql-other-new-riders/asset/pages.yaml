- img_proc: true
  md: '# Overview


    "Extending PHP" is easier than done. PHP has evolved to a full-fledged tool consisting
    of a few megabytes of source code, and to hack a system like this quite few things
    have to be learned and considered. When structuring this chapter, we finally decided
    on the “learn by doing” approach. This is not the most scientific and professional
    approach, but the method that''s the most fun and gives the best results. In the
    following sections, you''ll learn quickly how to get the most basic extensions
    to work almost instantly. After that, you''ll learn about Zend''s advanced functionality.
    The alternative would be to try to import the functionality, design, tips, tricks,
    etc. as a whole, all at once, giving a complete look at the big picture before
    doing anything practical. Although this might sound a bit confusing, as no dirty
    hacks have to be made; it would be very frustrating as energy- and time-consuming,
    which is why we''ve decided on the direct approach.


    Note that even this chapter tries to impart as much knowledge as possible about
    the inner workings of PHP, it''s impossible to really get a complete guide to
    extending PHP that works 100% of the time in all cases. PHP is such a huge and
    complex package that its workings can only be understood if you make yourself
    familiar with it by practicing, so we encourage you to work with the source.


    # What Is Zend? and What Is PHP?


    The name Zend refers to the language engine, PHP''s core. The term PHP refers
    to the complete system as it appears from the outside. This might sound a bit
    confusing at first, but it''s not that complicated (see Figure 9.1). To implement
    a Web script interpreter, you need three parts:


    +   - The parser analyzes the input code, translates it, and executes it.


    +   - The functionality part implements the functionality of the language (its
    functions, etc.).


    +   - The interface part talks to the Web server.


    Zend takes part 1 completely and a bit of part 2, PHP takes parts 2 and 3. Together
    they form the complete PHP package. Zend itself really forms only the language
    core, implementing PHP at its very basics with some predefined functions. PHP
    contains all the modules that actually create the language''s outstanding capabilities.'
  merge: -1
  pgno: 311
- img_proc: true
  md: '# What Is Zend? and What Is PHP? 295


    ![](img/eddeabf7128be657d5f7345abdc760ac_312_0.png)


    Figure 9.1 The internal structure of PHP.


    The following sections discuss where PHP can be extended and how it''s done.


    # Extension Possibilities


    As shown in Figure 9.1 above, PHP can be extended primarily at three points: external
    modules, built-in modules, and the Zend engine. The following sections discuss
    these options.


    # External Modules


    External modules can be loaded at script runtime using the function d1(). This
    function loads a shared object from disk and makes its functionality available
    to the script to which it''s being bound. After the script is terminated, the
    external module is discarded from memory. This method has both advantages and
    disadvantages, as described in the following table:


    Advantages


    Disadvantages


    External modules don''t require recompiling of PHP.


    The shared objects need to be loaded every time a script is being executed (every
    hit), which is very slow.


    External additional files clutter up the disk.


    The size of PHP remains small by "outsourcing" certain functionality.


    Every script that wants to use an external module''s functionality has to specifically
    include a call to d1(), or the extension tag in php.ini needs to be modified (which
    is not always a suitable solution).'
  merge: -1
  pgno: 312
- img_proc: true
  md: '# 296 Chapter 9 Extending PHP 4.0: Hacking the Core of the PHP


    To sum up, external modules are great for third-party products, small additions
    to run that are rarely used, or just for testing purposes. To develop additional
    functionality quickly, external modules provide the best results. For frequent
    usage, larger implementations, and complex code, the disadvantages outweigh the
    advantages.

    Third parties might consider the extension tag in php.ini external modules are
    completely detached from the main package, which is a very handy feature in commercial
    environments. Commercial distributors can simply ship disks or archives containing
    their additional modules, without the need to create fixed and solid PHP binaries
    that don''t allow other modules to be bound to them.


    # Built-in Modules


    Built-in modules are compiled directly into PHP and carried around with every
    PHP process; their functionality is instantly available to every script that''s
    run. Like external modules, built-in modules have advantages and disadvantages,
    as described in the following:


    | Advantages | Disadvantages |

    |---|---|\| No need to load the module specifically; the functionality is instantly
    available. | Changes to built-in modules require recompiling of PHP. |

    | No external files clutter the disk; everything resides in the PHP binary. |
    The PHP binary grows and consumes more memory. |


    Built-in modules are best when you have a solid library of functions that remains
    relatively unchanged, requires better than poor-to-average performance, or is
    used frequently by many scripts on your site. The new PHP is quickly compensated
    by the benefit in speed and ease of use. However, built-in modules are not ideal
    when rapid development of small additions is required.


    # The Zend Engine


    Of course, extensions can also be implemented directly in the Zend Engine. This
    strategy is good if you need a change in the language behavior or require special
    functions to be built directly into the language core. In general, however, modifications
    to the Zend engine would result in incompatibilities with the rest of the world,
    and hardly anyone will ever adapt to specially patched engines. Modifications
    can''t be detached from the main PHP sources and are overridden by the next update
    using the “official” source repositories. Therefore, this is generally considered
    bad practice and, due to its rarity, is not covered in this book.'
  merge: -1
