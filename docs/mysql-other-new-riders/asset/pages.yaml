    # Database Level


    The database level is a totally different approach. Clients are allowed to log
    in and chat, but their messages and session information are filtered in the database.
    Either an external tool or the chat code itself would check for the user to be
    allowed to say or do something, and based on this info, allow his/her messages
    to be inserted into the database—or not. This strategy requires a very tight integration
    into the main chat code, not flexible (and kind of clumsy), and is inelegant to
    implement.


    # IRC Level


    IRC provides native administration features into the server code and network protocol
    (we hope you read the RFC and are familiar with these possibilities). Administration
    can even be done by regular users. Three levels are available:


    +   - **Channel operators.** These operators have administrative control over
    channels. They can kick users, "mute" them, ban them, make other users into operators,
    and such (this level is available to all users).


    +   - **IRC operators.** These operators have administrative control over the
    network (but channels).They can kill users from the net, ban them, establish network
    links, and so (this level is only available to special users).


    +   - **Services.** Services have administrative control over channels but no
    control over the network, and are not able to perform like regular users. They
    also require a special login procedure (this level is only available to special
    users and is meant for automated clients).


    As you can see, administration at IRC level can be done using a client running
    separately from the main system. A separate client with IRC operator status would
    give the ideal combination of features that we need an administration system to
    work. Basically, as soon as the administration client gained IRC operator status,
    it can gain channel operator status everywhere by killing all users from a channel.This
    is not a very nice method, but more effective and versatile than patching the
    IRC server code to give IRC operators equal rights to channel operators.'
  merge: -1
  pgno: 135
- img_proc: true
  md: '# Implementation


    The implementation of the chat administration is designed to be quite similar
    to the main chat script. A bot is launched, which, with the help of phpIRC, logs
    into IRC and tries to register as IRC operator. It waits for further commands
    from the Web interface.These commands are issued like those in a database-backed
    RPC (procedure call). The bot will frequently query a database that contains input
    commands for it. The commands are put into the database by the Web interface and
    consist of a function name, a session ID, and a parameter array.Whenever the bot
    finds a new command in the database, it executes and writes the command results
    in an output table along with the session ID. The Web interface has just to write
    a command with a self-generated session ID and then needs to wait until a result
    dataset with the same session ID pops up in the output table (see Figure 3.11).
    This method allows flexible remote control over the bot.


    ![](img/eddeabf7128be657d5f7345abdc760ac_136_0.png)


