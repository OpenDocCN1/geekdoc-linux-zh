  md: '# Processing Instructions


    Another "element" you''ll find in XML documents is the processing instruction,
    or PI. PIs are used to define parts in a document that should not be interpreted
    by the regular parser engine but instead by a specialized processing handler.
    They consist of <? and a target name used to identify the application to which
    this instruction is directed. The long PHP tag <?php> is of course such a PI and
    can be used in XML documents to mark PHP code.


    Note: To be XML-compliant, you have to set the short_tags directive in your PHP
    configuration to off and use the opening tag <?php consistently. The short opening
    tag would confuse XML, as it wouldn''t be a valid processing instruction. On the
    other hand, tags like <xml would interfere with PHP, as PHP would think of the
    xml as code, and produce a parser error correctly.


    # Entities


    Any text that''s not markup constitutes the character data of the document. Within
    this, an author has a way to include special characters like < or > that normally
    start and end markup sections. Similarly to HTML, XML knows the notation of entities.
    Five entities are defined:


    | Entity | Character | Symbol |

    | --- | --- | --- |

    | &lt; | < | less than |

    | &gt; | > | greater than |

    | &amp; | & | ampersand |

    | &quot; | " | double quote |

    | &apos; | '' | single quote (apostrophe) |


    Note: If you use a Document Type Definition, these entities need to be declared
    if you want to use them.

    Using characters, you can insert any arbitrary Unicode character into your document.
    They consist of the normal notation of references, with a pound sign (#) following
    the ampersand. After either a decimal or a hexadecimal reference to the Unicode
    position is inserted. For example, &#8478; and &#x22e1 refer to the infinity sign
    (∞). Entities are not limited to a single character, though they can be any of
    length. For example, a DTD could define an entity &footer; to contain "Copyright
    (c) 2000 New Riders.",


