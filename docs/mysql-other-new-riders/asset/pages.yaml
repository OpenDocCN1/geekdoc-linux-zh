  md: '# Does It Conform to User Expectations?


    Consistency is one of the strongest contributors to usability. As Jakob Nielsen,
    the world’s most famous usability specialist, puts it in his Law of the Web User
    Experience: Users spend most of their time on other sites. Conventions established
    on most other sites should therefore not be handled on your site. Dr. Nielsen’s
    weekly Alertbox columns show so much of his experience and know-how they’re must-read
    for anyone working with product development in the information business. In his
    Alertbox for August 22, 1999, Dr. Nielsen provides a good example of what happens
    when an application fails to conform to user expectations:


    > Eric Davis, an Information Architect with Resource Marketing, recently reported
    on a usability test of shopping cart terminology. The draft design featured the
    term “Shopping Sled” (since selling sports products) Result: “50% of users did
    not understand the Sled concept. The other 50% said they figured out what it meant
    because it was in the same location as a cart; they knew that you had to add to
    something, and the only thing that any kind of sense was the Sled. Lesson: Do
    not try to be smart and use new terms when we have good words that users already
    know:


    Consistency also means that the behavior and data display in dialog boxes should
    be uniform:


    +   - Always display system messages (status feedback, error or success messages)
    in the same place on a page and in a consistent layout.

    - Label buttons and links with a consistent naming scheme.

    - Use a consistent method to change the state of a dialog. For example, always
    place the submit button of a form in the lower-right corner.

    - Don’t invent your own GUI elements if you can avoid it. For example, a site
    we audited images instead of plain HTML check boxes. Clicking on the image reloaded
    the page with a new variation of the check box image (depending on the previous
    state, either checked or unchecked). It would be hard to find a more annoying
    method.


    # Is It Personalized?


    “Personalized content” is one of the top buzzwords on the Internet today. We don’t
    really mean the same thing marketing people deliberately promoting personalized
    advertising, personalized spam mail, or personalized news. For us, personalized
    applications simply means applications that are tailored to the needs and cultural
    characteristics of individual users.'
