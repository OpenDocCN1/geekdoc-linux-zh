  md: '# Chapter 2 Advanced Syntax


    How does this relate to PHP? Of course, you can''t create polymorphic programs
    like this—PHP''s architecture prevents runtime modifications of code that has
    already been parsed—but nevertheless useful stuff in it. One possibility: dynamic
    function parsers, as described in the next section.


    # Dynamic Function Generator


    While we were writing this book, someone in the German PHP mailing list was asking
    for a way to handle the processing of mathematical functions that were entered
    by a user. He wanted to know how could display a function graphically that was
    entered by a user using a Web formula with PHP, but he didn''t know how to deal
    with the textual input: How could turn something like $f(x) = m * x + b$ into
    a graph?


    The discussion quickly moved into one of the traditional paths; everyone started
    thinking big, really big, instead of seeing the simple, obvious things. *Uni sono*
    (Latin, with “one voice”), the common method to approach the problem seemed to
    be the following:


    +   1. Analyze input.

    2. Create a parsed representation (something related to compiler techniques).

    3. Let a processor run over the parsed representation and generate step-by-step
    numerical output.


    Our example, $f(x) = m * x + b$, would look like this:


    +   1. See that this is a function depending on $x$, where $m$ and $b$ are variables.

    2. Create a structure to internally represent the function text for easier handling;
    for example, make a tree of variable bindings to the multiplication sign (*) and
    plus sign (+).

    3. Let a function vary $x$ (which we found to be the function this depends on)
    and store output for $y$; then, interpolate.


    This is the *de facto* approach taught in universities, in seem complex sources,
    and so on. Nobody seemed to be able to make himself free of this pre-thought solution
    and create a more innovative solution. Ever thought about what PHP does when it
    interprets your scripts?


    +   1. Analyze input source.

    2. Generate a parsed representation.

    3. Let a processor run over the parsed representation.


    Alright, this is very simplified but basically what we need. Why not transform
    the input function into valid PHP code and let PHP do the work for us? PHP supports
    dynamic coding, as you''ve seen elsewhere in this chapter, so the whole task could
    turn into something very trivial.'
