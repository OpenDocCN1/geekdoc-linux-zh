  md: "# HTTP and Sessions 127\n\n+   \n- It reveals that your pages are generated\
    \ dynamically, and some search engines will refuse to index the pages at all.\
    \ Other search engines will cut everything after the question mark from the URL.\n\
    \n+   -n The session ID is added to users' bookmarks and printouts. We even know\
    \ of articles in technical journals that have the session ID of a Web site included\
    \ as a reference. From a usability point of view, it's harder for users to manually\
    \ enter the URL to find specific resources on a site.\n\n+   - The session ID\
    \ is logged in proxy servers and shows up in the HTTP_REFERER CGI environment\
    \ variable for other sites.\n\n# Dynamic Paths\n\nLet's see if we can avoid drawbacks\
    \ of URL rewriting. For a start, you can add the ID to your URL in the Amazon.com\
    \ way (see Figure 4.1) to make it look like http://server.com/page.php3/session-id>.\
    \ With this method, the session ID is part of the path to the script, and the\
    \ URL looks like a static page to search engines and spiders. This works because\
    \ the Web server knows page.php3 is a script, and stops looking further in the\
    \ URL for files. But this way the session ID is not automatically available in\
    \ your PHP script. You need to parse the path yourself to get access to it:\n\n\
    ```\nfunction session_start_from_path()\n{\n    global $HTTP_HOST, $REQUEST_URI;\n\
    \n    preg('/([0-9a-z]+)/', $REQUEST_URI, $regs);\n    $session_id = $regs[1];\n\
    \n    if(isset($session_id) && !empty($session_id))\n    {\n        rand((double)microtime()*1000000);\n\
    \        $session_id = md5(uniqid(rand()));\n\n        $destination = \"http://$HTTP_HOST$REQUEST_URI/$session_id\"\
    ;\n        header(\"Location: $destination\");\n    }\n\n    session_id($session_id);\n\
    \    session_start();\n}\n```\n\nAll other drawbacks of URL rewriting still apply\
    \ to dynamic paths, though."
