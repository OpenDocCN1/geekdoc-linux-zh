  md: '# 260 Chapter 7 Cutting-Edge Applications


    used to describe the object model of HTML pages that can be accessed with JavaScript.
    For example, to read the value of a form field, you could use the following JavaScript
    snippet:


    ```

    fieldvalue = document.myform.myfield.value;

    ```


    Notice the hierarchy expressed in the statement. document is the root element
    and myform denotes an HTML form, within which myfield is a text field. Indeed,
    the myform HTML DOM is an extension of the core Document Object Model defined
    by the W3C. The DOM represents the functionality used for XML documents, and also
    serves as the basis for the HTML DOM. It''s a collection of objects that you use
    to access and manipulate the data and markup stored in an XML document. It defines
    the following:


    +   - A set of objects representing the complete structure of an XML document

    - A model of how these objects can be combined

    - An interface for accessing and manipulating these objects


    By abstracting the document, the DOM exposes a tree, with child nodes, and methods
    like getAttribute() for the nodes. Put short, DOM provides you with a standard,
    object-oriented and tree-like interface to XML documents.


    The DOM specification is programming-language-independent. The specification recommends
    an object-oriented implementation, thus requiring a language with at basic object-orientation
    features. It defines a set of node types (interfaces), which together form the
    complete document. Some types of nodes may have child nodes, others are leaf nodes
    that cannot have anything below them. We''ll continue describing these node types,
    as''re outlined in the original W3C specification. Please refer to the specification
    for a detailed description of all methods and attributes of each instance.


    # Document


    The Document interface is the root node of the structure tree.This interface can
    contain only one element, which is the XML document''s root element. It can also
    contain the document declaration associated with this document (organized in a
    DocumentType interface), and, if available, processing instructions or comments
    from outside the root element.


    Since the other nodes are all placed below the Document node, the Document interface
    contains a number of methods to create subnodes. Using these functions, it''s
    possible to construct a complete XML document programmatically.The specification
    also defines a method: getElementsByTagName() to retrieve all elements with a
    given tag name in the document.'
