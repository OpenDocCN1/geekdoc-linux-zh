  md: '# 176 Chapter 5 Basic Web Application Strategies


    Project management is a critical component in effective management of distributed
    software development. When a new project is started, people know nothing. They
    don''t know what to do and they don''t know when to do it. They need someone who
    coordinates activities, allocates responsibilities, and monitors progress and
    results. They need a project manager.


    Software development project management is so vast that we can''t cover it in
    this book, unfortunately. Many good methods and resources are available, and we
    encourage you to review them if you have no formal training on this. This includes
    literature from The Mythical Man Month to methods like the Personal Software Process.


    We''ll focus on the stages of a project in which technical development is involved.
    You have already seen in Chapter 3, “Application Design,” how to plan and lay
    out an application programming interface (API). Indeed, this was a mini-project
    of its own. We made some silent assumptions in this discussion: how to organize
    the code in directories, who''s on the development team, how different versions
    of the API are maintained.


    In real (larger) projects, you''ll have to make these decisions yourself. And
    since they form the basis of your project, you''d better think twice before you
    commit to something that could provide inadequate later.


    # Directory Structure


    The basic—but nevertheless neglected—technical decision to make when beginning
    the source code development of a new project is what directory layout to use.
    Generally, we use the following structure:


    ```

    /home/www/phpwebdev.com/live/cgi-bin

    htdocs

    passwd

    include

    logs

    /home/www/phpwebdev.com/staging/cgi-bin

    htdocs

    passwd

    include

    logs

    /home/www/phpwebdev.com/dev/cgi-bin

    htdocs

    passwd

    include

    logs

    ```'
