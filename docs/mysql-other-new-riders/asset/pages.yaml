  md: '![](img/eddeabf7128be657d5f7345abdc760ac_184_0.png)


    # 5


    # Basic Web Application Strategies


    > When people see some things as beautiful, other things become ugly.

    When people see some things as good, other things become bad.


    CHAPTER 4, “WEB APPLICATION CONCEPTS,” DESCRIBES the fundamental differences between
    Web applications and stand-alone scripts, and shows methods to solve the most
    basic problem—session management. This chapter explores strategies to deal with
    other common issues that arise when on larger projects. While we will present
    solutions that we''ve found to be time-saving, effective, and easy to implement,
    we encourage you to evaluate whether they really fit your needs—the chapter is
    titled “Web Application Strategies” and not “Web Application Solutions” for a
    purpose. It''s better to spend more time on evaluation than on having to reorganize
    a project; as seen in Chapter 1, “PHP Concepts,” time is the most valuable resource
    that you will never have enough.


    In the beginning, there was the HTML form. Almost every Web application solicits
    information from the user. Therefore, it is important to pay special attention
    to form validation routines—you need to find a generic handling routine if you
    don''t want to reinvent the wheel over and over. The first part of this chapter
    describes the PHP Normal Form and how to use the EasyTemplate class to separate
    code from design.'
