  md: 'The library consists of the following functions:


    | Function | Description |

    |--- | --- |

    | array tree_create() | Creates a new tree |

    | int tree_allocate_node (array tree) | Allocates a new node in the tree |

    | int tree_free_node (array tree, int handle) | Frees a node in the tree |

    | int tree_link_left (array tree, int link_to, int child) | Links as left child
    to another node |

    | int tree_link_right (array tree, int link_to, int child) | Links as right child
    to another node |

    | int tree_get_parent (array tree) | Returns the parent of the given node |

    | int tree_get_left (array tree) | Returns the left child of the given node |

    | int tree_get_right (array tree) | Returns the right child of the given node
    |

    | int tree_assign_node_contents (array tree, int handle, mixed contents) | Assigns
    data to the content container of a node |

    | mixed tree_retrieve_node_contents (array tree, int handle) | Retrieves data
    from the content container of a node |


    Feel free to add more functions; for example, the library doesn''t functionality
    to merge trees, detect dead leaves (leaves that exist in the array but are detached
    from the main tree and thus cannot be accessed), and so on.

    The code is excellent to experiment and learn.

    The library is pretty straightforward. `tree_create()` creates a new node for
    the tree and initializes the first element as the root element. All references
    to other nodes are integers within the array (see `$idx_use`, `$idx_left`, and
    `$idx_right` in the source.) - -1 marks a reference as being used. For example,
    if one node doesn''t have a left node, `$idx_left` would contain -1. To mark an
    element as being in use or not (meaning that it has been assigned to), another
    flag is defined: `$free`. This variable contains 1 (in use) or 0 (not use).

    `tree_create()` creates one dummy node, marks it as free with all references unused,
    and assigns it to slot 0. Then it returns this array to the caller.

    *Note:* The caller doesn''t have to know anything about this array—not even that
    it is actually an array. The program should simply assume to be some kind of "handle"
    for the tree. As PHP doesn''t feature explicit types, this works very well.'
