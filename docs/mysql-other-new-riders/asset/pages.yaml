  md: '# Security Considerations 155


    issues. A Moderator keeps track of defects found and ensures they''re corrected
    later by the original developer. A typical testing scenario could be constructed
    like this:


    +   1. A team of two to five developers is formed.


    +   2. For about 60 minutes, the source code (about 200–300 lines of code) is
    inspected. Each team member goes through the code line by line, with the aim of
    fully understanding what each line does. All defects are noted.


    +   3. The moderator collects the notes and passes them to the original software
    developer, who is not a member of the inspection team. Rework can consist of changing
    code, adding or deleting elements, restructuring or relocating functions, etc.


    We''d call this discount inspection. In traditional software engineering, inspection
    is much more imposing; Fagan Inspection, as introduced by Michael Fagan of IBM
    in 1976, requires more preparation, detailed checklists, and more frequent meetings.
    Web application development resembles rapid application prototyping, as a quick
    time to market is especially important. Inspection methods that are too time-consuming
    and resource-intensive are unrealistic.


    # Authentication


    You''ll see that you need another technique again and again: authentication. For
    example, if your users should be able to access some parts of your Web site only
    after registering themselves with the system, you need authentication.


    # The Login Process


    Let''s first look at the theoretical concepts of authentication. The login process
    has in three stages: identification, authentication, and authorization.


    # Identification Stage


    To authenticate a user


    Identification is not authentication! The fact that a user reported an identity
    doesn''t mean that this identity is guaranteed to be authentic. Without authentication,
    the identity is suspect.


    # Authentication Stage


    After getting the user''s claimed identification, you need to verify this claim.
    This is the job of an authentication system. Users'' identities are verified using
    one of three authentication types: something they know, something they have, or
    something they are.'
  merge: -1
  pgno: 172
- img_proc: true
  md: '# Chapter 4 Web Application Concepts


    On the Web, "something they know" method, also called authentication knowledge,
    is the most commonly used method. Users can choose or be assigned a password,
    which they have to remember and keep secret. Authentication is performed by checking
    the user''s identity is confirmed by the password. Other variants are Personal
    Identification Numbers (PINs), pass phrases, or asking for data about the user
    that only the user can know. The principal weakness of this is the fact that it''s
    very easy to learn that somebody else knows. It may even be possible to guess
    the "something they know" without having access to—think of brute force attacks
    of shell logins. With Web applications, the advantages of authentication by knowledge
    usually outweigh this security imperfection; one can take the password anywhere
    and has access to it all the time. Another advantage is the simplicity of this
    method and the ease of implementation.


    Examples of authentication by ownership ("something they have") include keys,
    magnetic-strip cards, and badges. Unlike the first, authentication by ownership
    is more difficult to duplicate, as the authentication elements are physical objects.
    For the Web, this kind of authentication hasn''t yet established as a valid technique,
    despite some efforts to introduce magnetic-strip cards for public-key encryption
    systems.


    The third type of authentication is even more common. Authentication by characteristics
    ("something they are") is, for example, in firewall systems to grant access to
    an object only using a certain IP address or range. Outside the Web, you can increase
    authentication by characteristics using retina scans or fingerprints as authentication
    elements. While this method is the most secure of all three (after all, the goal
    of authentication is to verify who you are, and this type is very closely tied
    to this goal), it is the most cost-intensive to use. As we''ve already outlined,
    IP addresses can''t taken into consideration when identifying individuals, you''d
    still need a personal identification system using a peripheral device.


    Of course, different authentication methods can be combined to eventually produce
    more secure results; for now, however, let''s continue in our login procedure
    with authentication by knowledge.


    The user specifies an authentication element, commonly a password, along with
    his or her identity. But how is this information transmitted from the client to
    the authentication system? Identification data is commonly subject to interception
    by an intruder sitting between the user and the authentication system (a man-in-the-middle
    attack). As a consequence, you need to protect against eavesdropping; a trusted
    path—a secure communications channel—is necessary to transmit the password. Always
    keep in mind that an authentication chain is only secure as the least secure element—having
    128-bit pass phrases won''t help if you transmit over a normal HTTP connection
    to the authentication system.


    # All Communication Should Be Secure


    Even when the identification data is transmitted over a secure communication channel
    like SSL, there''s room for man-in-the-middle attacks if the communication after
    the authentication is not encrypted. An attacker may get the session ID by eavesdropping,
    and can effectively hijack the user''s session and take over the user''s identity
    (for example, by articles in an online shop). To avoid this, all communication
    would need to be handled over a secure channel.'
  merge: -1
