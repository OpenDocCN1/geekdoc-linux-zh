  md: '# Extension Conventions


    Zend is built using certain conventions; to avoid breaking its standards, you
    should follow the rules described in the following sections.


    # Macros


    For almost every important task, Zend ships predefined macros that are extremely
    handy. The tables and figures in the following sections describe most of the basic
    functions, structures, and macros. The macro definitions can be found mainly in
    zend.h and zend_API.h. We suggest you take a close look at these files after studying
    this chapter. (Although you can go ahead and read them, not everything will make
    sense to you.)


    # Memory Management


    Resource management is a crucial issue, especially in server software. One of
    the most valuable resources is memory, and memory management should be handled
    with extreme care. Memory management has been partially abstracted in Zend, and
    you should stick to this abstraction for obvious reasons: Due to the abstraction,
    Zend gets full control over all memory allocations. Zend is able to determine
    whether a block is in use, automatically freeing unused blocks and blocks with
    lost references, and thus prevent memory leaks. The functions to be used are described
    in the following table:


    | Function | Description |

    | --- | --- |

    | emalloc() | Serves as replacement for malloc(). |

    | free() | Serves as replacement for free(). |

    | strdup() | Serves as replacement for strdup(). |

    | estrndup() | Serves as replacement for strdup(). Faster than strdup() and binary-safe.
    This is the recommended function if you know the string length prior to duplicating
    it. |

    | ecalloc() | Serves as replacement for calloc(). |

    | erealloc() | Serves as replacement for realloc(). |


    emalloc(), strdup(), estrndup(), ecalloc(), and erealloc() allocate internal memory;
    free() frees these previously allocated blocks. Memory handled by the e* functions
    is considered local to the current process and is discarded as soon as the script
    executed by this process is terminated.'
  merge: -1
  pgno: 316
- img_proc: true
  md: '# Chapter 9 Extending PHP 4.0: Hacking the Core of PHP


    > > Warning

    To allocate memory that survives termination of the current script, you can use
    malloc() and free(). This should only be done with extreme care, however, and
    only in conjunction with demands of the Zend API; otherwise, you risk memory leaks.


    Zend also features a thread-safe resource manager to provide better native support
    for multithreaded Web servers. This requires you to allocate local structures
    for all of your global variables to allow concurrent threads to be run. Because
    the thread-safe mode of Zend is not finished yet, we could not include coverage
    in this book.


    # Directory and File Functions


    The following directory and file functions should be used in Zend modules (they
    behave exactly like their C counterparts):


    | Zend Function | Regular C Function |

    |---|---|

    | V_GETCWD() | getcwd() |

    | V_FOPEN() | fopen() |

    | V_CHDIR() | chdir() |

    | V_GETWD() | getwd() |

    | V_CHDIR_FILE() | Takes a file path as an argument and changes the working directory
    to that file''s directory |

    | V_STAT() | stat() |

    | V_LSTAT() | lstat() |


    # String Handling


    Strings are handled a bit differently by the Zend engine than other values such
    as integers, Booleans, etc., which don''t require additional memory allocation
    for storing their values. If you want to return a string from a function, introduce
    a new string variable to the symbol table, or do something similar, you have to
    make sure that the memory string it is occupying has previously allocated, using
    the aforementioned e*() functions for allocation. (This might not make much sense
    to you; just keep it somewhere in your head for now—we''ll get back to it shortly.)'
  merge: -1
  pgno: 317
- img_proc: true
  md: '# Complex Types


    Complex types such as arrays and objects require different treatment. Zend features
    a single API for these types—they are stored using hash tables.


    *Note: To reduce complexity in the following source examples, we are only working
    with simple types such as integers at first. A discussion about creating more
    advanced types follows later in this chapter.*


    # PHP’s Automatic Build System


    PHP 4.0 features an automatic build system that is very flexible. All modules
    reside in a subdirectory of the ext directory. In addition to its own, each module
    contains of an M4 file (example, see www.gnu.org/manual/m4/m4_mono/m4.html) for
    configuration and a Makefile.in file, which is responsible for compilation (the
    results of autoconf and automake; for example, see http://sourceware.cygnus.com/autoconf/autoconf.html
    and http://sourceware.cygnus.com/automake/


    Both files are generated automatically, along with .vsignore, by a little script
    ext_skel that resides in the ext directory. As argument it takes the name of the
    module that you want to create. The shell script creates a directory of the same
    name, along with the appropriate config.m4 and Makefile.in files.


    Step by step, the process looks like this:


    ```

    root@dev:/usr/local/src/php4/ext > .. /ext_skel my_module

    Creating directory

    Creating basic files: config.m4 Makefile.in .vsignore [done].

    ```


    To use your extension, you will have to execute the following steps:


    ```

    $ cd ..

    $ ./buildconf

    $ ./configure (your extension is automatically enabled)

    $ vi ext/my_module/my_module.c

    $ make

    ```


    Repeat the last two steps as often as necessary.


    This instruction creates the aforementioned files. To include the new module in
    the automatic configuration and build process, you have to run buildconf, which
    regenerates the configure script by searching through the ext directory and including
    all found config.m4 files.


    Finally, running configure parses all configuration options and generates a makefile
    based on those options and the options you specify in Makefile.in.


    Listing 9.1 shows the previously generated Makefile.in:'
