  md: '# Accepting Arguments 321


    fsockopen() accepts two, three, four or five parameters. After the obligatory
    variable declarations, the function checks for the correct range of arguments.
    It then uses a fall-through mechanism in a switch() statement to deal with all
    arguments. The switch() statement starts with the maximum number of arguments
    passed (five). After that, it automatically processes the four arguments being
    passed, then, by omitting the otherwise break keyword in all stages. After having
    processed the last case, it exits the switch() statement and does the minimal
    argument processing if the function is invoked with two arguments.


    This multiple–stage type of processing, similar to a stairway, allows convenient
    processing of a variable number of arguments.


    # Accessing Arguments


    To arguments, it''s necessary for each argument to have a clearly defined type.
    Again, PHP''s extremely dynamic nature introduces some quirks. PHP never does
    any kind of type checking, it''s possible for a caller to pass any kind of data
    to your functions, whatever you want or not. If you pass an integer, for example,
    the caller might pass an array, and vice versa–PHP simply won''t notice.


    To work around this, you have to use a set of API functions to force a type conversion
    on every argument that is passed (see Table 9.4).


    *Note: All conversion functions expect a **val as parameter.


    | Table 9.4 Argument Conversion Functions |

    | Function | Description |

    | --- | --- |

    | convert_to_boolean_ex(value) | Forces conversion to a Boolean type. Boolean
    values remain untouched. Longs, doubles, and strings containing 0 as NULL values
    will result in Boolean (FALSE). Arrays and objects are converted based on the
    number of entries or properties, respectively, that they have. Empty arrays and
    objects are converted to FALSE; otherwise, to TRUE. All result in a Boolean 1
    (TRUE). |long_ex(value) | Forces conversion to a long, the default integer type.
    NULL values, Booleans, resources, and of course longs remain untouched. Doubles
    are truncated. Strings containing an integer are converted to their corresponding
    numeric representation, otherwise resulting in 0 Arrays and objects are converted
    to 0 if empty, 1 otherwise. |'
