    # # Creating Variables


    When exchanging data from your extensions over PHP scripts, one of the most important
    issues is the creation of variables. This section shows how to deal with the variable
    types that PHP supports.


    # # Overview


    To create variables that can be seen "from the outside" by executing the script,
    you will need to allocate a new zval container, fill this container with meaningful
    values, and introduce it to Zend''s internal symbol table. This basic process
    is common to all variables:


    +   * new_variable;


    ```

    /* allocate and initialize new container */

    MAKE_STD_ZVAL(new_variable);

    ```


    ```

    /* set type and variable contents here, see the following sections * /

    ```


    ```

    /* introduce this variable by the name "new_variable_name" into the symbol

    -table * /

    ZEND_SET_SYMBOL(EG(active_symbol_table), "new_variable_name", new_variable_name);

    ```


    ```

    /* the variable is now accessible to the script by using $new_variable_name */

    Macro MAKE_STD_ZVAL allocates a new zval container using ALLOC_ZVAL and

    initializes it using INIT_ZVAL. As implemented in Zend at the time of this writing,

    initializing means setting the reference count to 1 and clearing the is_ref flag,
    but

    this process could be extended—this is why it is a good idea to keep using

    MAKE_STD_ZVAL instead of only ALLOC_ZVAL (zval container here), you can use

    ALLOC_ZVAL, but this is not recommended because it doesn''t ensure data integrity.

    ```'
