  md: '# LibXML—A DOM-Based XML Parser


    Since version 4.0, a new XML parser is built into PHP. LibXML. Daniel Veillard
    originally created this parser for the Gnome project to offer a DOM-ready parser
    for managing complex data exchange, and Uwe Steiner integrated it into PHP.


    While LibXML''s internal representation is very close to the DOM interfaces, it
    is misleading to call LibXML a DOM: Parsing and DOM usage really happen at different
    times in a document''s life. It would be feasible to create an API above to provide
    a DOM interface. The LibXML library makes this much easier, though—it is merely
    a changing of the API to match the DOM specification. Indeed, there is a GDom
    module in Gnome, which implements a DOM interface for LibXML.


    Note: At the time of writing, the LibXML API in PHP was finalized. It was unstable
    and contained bags—nonetheless it already showed the tremendous benefits the LibXML
    API will offer. Therefore, we decided to document the basic principles here and
    provide some examples; if changes occur, we''ll document them on the Web site.


    # Overview


    Most developers will agree that an XML document is best represented in a tree
    structure. LibXML provides a nice API to construct trees and DOM-like structures
    from an XML file. When you parse a document with LibXML, PHP constructs a set
    of classes, and you''ll work with them directly. By invoking functions on these
    classes, you can access all levels of the structure and modify the document.


    The two most important objects you''ll spot when working with LibXML are


    # XML Documents


    The abstract XML document is represented in a document object. Objects are created
    by the functions `xmldoc()`, `xmldocfile()`, and `new_xmldoc()`.**


    The function `xmldoc()` takes as its only argument a string containing an XML
    document. The `xmldocfile()` function behaves similarly, but takes a filename
    as argument. To construct a new, blank XML document, you can use `new_xmldoc()`.


    All three functions return a document object, which has four associated methods
    and one class variable:


    +   * root()


    +   * add_root()


    +   * dtd()


    +   * dumpmem()


    +   * version'
