    # The MCrypt Functions


    With the MCrypt library, many block algorithms are available, including DES, TripleDES,
    Blowfish, and IDEA. Space doesn''t allow for explaining all these algorithms,
    or giving recommendations on how to choose one for a specific scenario; this is
    covered in many in-depth books and online articles, some of which you can find
    in the Resources section of the CD-ROM.

    Unfortunately, another library means another API style, and as indicated in Chapter
    1, "Development Concepts," we think this is bad style. While decrypt_cbc() take
    argument defining whether to encrypt or decrypt data? Wouldn''t it be more logical
    and consistent to have two functions, encrypt_cbc() and decrypt_cbc()? There''s
    no session_var() taking REGISTER or UNREGISTER as argument, is there?

    Well, let''s stop complaining. After all, we could simply edit the MCrypt interface
    and define these additional functions—source. So back to the topic. The example
    in Listing 4.5 shows the MCrypt functions in use. The example loops through an
    array containing all possible MCrypt algorithms and encrypts a message with each.


    Listing 4 MCrypt routines.


    ```

