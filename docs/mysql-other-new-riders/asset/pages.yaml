    # Creating Constants


    Zends the creation of true constants (as opposed to regular variables).

    Constants are accessed without the typical dollar ($) prefix and are available
    in all scopes. Enables TRUE and FALSE, to name just two.

    To create your own constants, you can use the macros in Table 9.13. All the macros
    create a constant with the specified name and value.

    You can also specify flags for each constant:


    +   - CONST_CS—This constant''s name is to be treated as case sensitive.

    - CONST_PERSISTENT—This constant is persistent and won''t be "forgotten" when
    the current process carrying this constant shuts down.


    To use the flags, combine using a binary OR:

    // register a new constant of type "long"

    REGISTER_LONG_CONSTANT(*MY_MEANING_CONSTANT*, 324, CONST_CS | CONST_PERSISTENT);

    There are two types of macros—REGISTER_* and REGISTER_MAIN_*—the first creates
    constants bound to the current module. The second constants are dumped from the
    symbol table as the module that the registered constant is unloaded from memory.
    The second type creates constants independently of the module.


