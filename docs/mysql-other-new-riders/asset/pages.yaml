  md: '# Security Considerations 143


    While he confirmed our assumption that the script should be placed in a trusted
    environment, it shows some techniques that would make it a dangerous security
    leak if naïve placed it into a publicly accessible directory. For a start, invoke
    it with Directory_Viewer.php?dir=/ Nice, isn''t it? You can browse any directory
    from the system which PHP is allowed. But that is not enough:You can execute any
    command using this script and easily gain root access to the server hosting.


    The key section is:


    ```

    exec(''ls -la $dir, $lines;'');

    ```


    The variable $dir, provided by the user, is passed directly to exec(). As you
    may know, you can concatenate commands with ;so what do you think will happen
    when $dir is equal to /etc; cat /etc/password? If you want to pass this as an
    argument, you''d need to URL-encode the string of course, so the script would
    be called like this:


    ```

    Directory_Viewer.php?dir=/etc%3Bcat%20fetch%2Fpasswd

    ```


    And yes, it would display the contents of /etc/passwd. Instead of the cat command,
    you could execute any other command, for example fetch, to install a Trojan from
    your own server.


    The remedy for this specific problem is to pass the $dir variable through EscapeShellCmd(),
    making all special characters that could be used to trick the script to execute
    concatenated commands. Also, it may be a good idea to restrict it to list only
    subdirectories


    ```

    $secure_dir = str_replace("*.", '''', $dir);

    $secure_dir = DOCUMENT_ROOT.dirname($_PHP_SELF)."/$secure_dir";

    $secure_dir = EscapeShellCmd($secure_dir);

    ```


    The principle remains: Never trust variables provided by users. This is valid
    for all scripting languages, not just PHP. The same hole is present in ASP using
    the FileSystem object or in Perl when executing user-defined commands.


    # Tainted Variables


    We must stress: All data from the user space is to be treated as tainted, untrustworthy,
    potentially volatile. The Internet is outside the application space in this; in
    trust management, this is called a trust boundary. The application space is a
    trusted environment; the Internet is not. Passing data from your program doesn''t
    need much special attention (when it gets it from untrusted systems—or the database
    system must be on an equal level with the application itself). The only instance
    in which you have to take special precautions is when you want to guarantee that
    data is received only by one specific client, or that the client can be to retrieve
    the data from a specific instance (server). With a normal HTTP transfer, these
    guarantees can''t be enforced; you''re advised to use SSL or an equivalent encryption
    layer in such a case.'
