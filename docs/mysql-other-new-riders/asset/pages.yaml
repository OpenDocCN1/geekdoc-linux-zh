  md: "# Chapter 2 Advanced Syntax\n\nIf you're not surprised now, you either know\
    \ PHP very well already or haven't thought enough about objects yet. PHP has created\
    \ a copy, a new instance of my_class instead of just a new reference! This is\
    \ not the desired behavior, since the new operator is supposed to create an instance\
    \ of my_class in memory, returning a reference to it. Thus, when assigning to\
    \ another variable, only the reference should be copied, leaving the original\
    \ data untouched—similar to a file system link, which allows access to the data\
    \ through different locations on the file system. This behavior of PHP—creating\
    \ copies of referenced data rather than just the reference—may not sound important\
    \ to focus on; however, you'll see in a moment that it actually makes a difference.\n\
    \nNote: At the time of your writing, PHP 3.0 and PHP 4.0 are using copy syntax.\
    \ A chat with someone involved in the core development revealed that the plan\
    \ is to change the default behavior to use a reference syntax, but this change\
    \ would cause a loss of backward compatibility. A possible change is planned with\
    \ version 4.1—if this information, contained here will be invalid for all future\
    \ versions.\n\nPHP 3.0 does not implement proper garbage collection. Whenever\
    \ you're writing something into a variable, new space is allocated instead of\
    \ reusing the old space. unset() can work around this a bit—even though it doesn't\
    \ release the memory, it marks it as being reusable—however, after some time,\
    \ long-term scripts will, make sure that you free database results with (for example)\
    \ mysql_free_result(), and use unset() on all variables that no longer contain\
    \ valuable information. No memory will be freed until the script is terminated!\n\
    \nFor example, a tree structure. The class building a tree node will look like\
    \ this:\n\n```\nclass tree_node\n{\n    var $left_child, $right_child;\n    var\
    \ $value;\n}\n```\n\nJust a simple tree node, of course, but has everything we\
    \ need: a link to the left child and a link to the right child, as well as a variable\
    \ containing the contents of this node. We'll build a simple tree:\n\n```\n$root_node\
    \ = new tree_node;\n$left_node = new tree_node;\n$right_node = new tree_node;\n\
    ```"
