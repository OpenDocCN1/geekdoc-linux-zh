    ```\n\n# Bit Bashing\n\nBitwise calculations often cause a great deal of confusion\
    \ among novice programmers, and even advanced developers have occasional difficulties\
    \ dealing with. Representing flag as bit patterns can be very useful; though the\
    \ PHPLib uses this for permission levels. It is also used to store flag values\
    \ in a single INT field of a database. Consider an application that needs to keep\
    \ track of a number of different states, for example users' hobbies. Instead of\
    \ having one field in a database for each hobby and setting that to true or false,\
    \ you have a single flag field. Depending on whether the user has a specific hobby,\
    \ this hobby's bit is switched or off. Simply put, bit operations are operations\
    \ that manipulate one or more bits at a time. You know that in the binary system,\
    \ you have octets of bits—a series of 0 and 1. The decimal number 42 in the binary\
    \ system is represented as 00101010:\n\n```\nBit position: 7 6 5 4 3 2 1 0\nBit\
    \ value: 0 0 1 0 1 0 1 0\n```"
