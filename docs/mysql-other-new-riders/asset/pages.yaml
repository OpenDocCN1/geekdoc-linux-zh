    # Startup and Shutdown Functions


    Startup and shutdown functions can be used for one-time initialization and deinitialization
    of your modules. As discussed earlier in this chapter (see the description of
    the Zend module descriptor block), there are global, module, and request startup
    and shutdown events.


    The global startup functions are called once when PHP starts up, similarly the
    global shutdown functions are called once when PHP shuts down. Please note that
    they are really only called once, when a new Apache process is being created!


    The module startup and shutdown functions are called when a module is loaded and
    needs initialization; the request startup and shutdown functions are called every
    time a request is processed (meaning that a file is being executed).'
