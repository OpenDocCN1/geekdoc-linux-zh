  md: '# Array Functions 33


    Note: By special values, we''re referring to ''magic numbers'' or special strings.
    For example, if you want to access a GIF file from your program, and internally
    your program recognizes GIF by the ''magic number'' 6 (just because it''s chosen
    so the programmer—it could be 1234), then you can create a definition for this
    value: define(''GIF_FILE'', 6); and further on access your ''magic number'' by
    the keyword GIF_FILE.


    This code snippet sniffs an identifier from an input file and defines how to act
    on it. The identifier identifies whether the following data is a GIF image, or
    a ZIP archive. The identifiers might look like this:


    ```

    GIF image "GIF_IMG"

    P image "PNG_IMG"

    ZIP archive "ZIP_ARC"

    ```


    These identifiers would then be defined in an index file:


    ```

    define(''FT_GIF_IMAGE'', ''GIF_IMG'');

    define(''FT_PNG_IMAGE'', ''PNG_IMG'');

    define(''FT_ZIP_ARCHIVE'', ''ZIP_ARC'')

    ```


    This setup has the advantage that you can keep all identifiers in a central place.
    If one of the identifiers needs to be changed, you only need to change its definition—otherwise,
    you would have to dig through the code, searching and replacing each occurrence
    of this string. Using defined values, this will work to reducing changing a single
    line of code.


    The names of defined values should be written in uppercase to denote them as such,
    and in most cases they should have prefixes, just like library functions. In the
    preceding example, the identifiers would be prefixed with FT_for file type.


    Try to use defined values as often as possible. Whenever you encounter a situation
    in which you might hardcode a value into your program, hardcoding is a bad idea.
    Operating systems or similar low-oriented programs usually have the largest list
    of definitions, allow them to be portable, very little bit has to be abstracted.
    They can''t make assumptions about the byte size, the word size, the register
    size—generally everything you see is abstracted in some way. PHP is portable per
    se—meaning it''s not bound to any certain hardware or other environmental configuration
    (its interpreter won''t change the environment regarding the underlying operating
    system), it''s not really necessary to be as extreme with definitions in PHP.
    But it''s good coding style.


    # Array Functions


    The most important array functions are list(), each(), and count().

    list() is a sort of operator, forming an l (a value that can be used on the left
    side of an expression) out of a set of variables, which represents itself a new
    entity similar to an element of a multidimensional array. As arguments, it takes
    a list of variables. When something is being assigned to it (a list of variables
    or an array'
  merge: -1
  pgno: 50
- img_proc: true
  md: '# Chapter 2 Advanced Syntax


    element), the list of variables as arguments to the list() operator is parsed
    from left to right. These arguments are then assigned a corresponding value from
    the rvalue (a value that is used on the right side of an expression).This is best
    explained using a code example:


    ```

    $result = mysql_db_query($mysql_handle, $mysql_db,

    SELECT car_type, car_color, car_speed

    FROM cars WHERE car_id=$car_id'');

    ```


    The SQL query will select the car_type, car_color, and car_speed from a table
    containing information. The result of the query is retrieved via mysql_fetch_row(),
    which returns the values in an array. car_type will be at index 0, car_color at
    index 1, and car_speed at index 2.Read from left to right, these values will be
    assigned value by value to the arguments given in the list() statement.

    Thus, you''ll have the following assignments:


    # List Argument SQL Field


    | $car_type | car_type (array index 0) |

    | $car_color | car_color (array index 1) |

    | $car_speed | car_speed (array index 2) |


    The list() statement is very useful when you want to separate a collection of
    values into single variables—something that happens often when doing database
    programming. However, note that list() can only act as lvalue, not rvalue—you
    can''t use list() to exchange a set of variables. For example, the following statement
    won''t work:

    list($var1,$var2) = list($var2,$var1);


    The statement each() is often used in combination with the list() statement. each()
    traverses an array and returns each of its elements in a key/value combination.
    This is done by "walking" the input array. PHP assigns an internal pointer to
    each array. This pointer initially points to the first element of the array. Each
    call to each() returns the element that''s being pointed to by the internal pointer;
    this pointer will be incremented.'
