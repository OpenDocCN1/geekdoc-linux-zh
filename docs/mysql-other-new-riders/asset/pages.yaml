- img_proc: true
  md: "# 316 Chapter 9 Extending PHP 4.0: Hacking the Core of PHP\n\nThe function\
    \ implementation is surrounded by a conditional compilation statement. This is\
    \ needed since the function get_module() is only required if your module is built\
    \ as a dynamic extension. By specifying a definition of COMPILE_DL in the compiler\
    \ command (see for a discussion of the compilation instructions, you can instruct\
    \ your module whether you intend to build as a dynamic extension or as a built-in\
    \ module. If you want a built-in module, the implementation of get_module() is\
    \ simply left out.\n\nget_module() is called by load time of the module. You can\
    \ think of it as being invoked by the dli() call in your script. Its purpose is\
    \ to pass the module information back to Zend in order to inform the engine out\
    \ the module contents.\n\nIf you don't implement a get_module() function in your\
    \ dynamic loadable module, Zend will complement you with an error message when\
    \ trying to access it.\n\n# Implementation of All Exported Functions\n\nImplementing\
    \ the exported functions is the final step. The example function in first_module\
    \ looks like this:\n\n```\nZEND_FUNCTION(firstmodule)\n{\n    zval **parameter;\n\
    \n    if(ZEND_NUM_ARGS(ARGS()) != 1 || (zend_get_parameters_ex(1, &parameter)\
    \ != SUCCESS)) {\n        WRONG_PARAM_COUNT;\n    }\n\n    convert_to_long_ex(*parameter);\n\
    \    RETURN_LONG((*parameter)->value.lval);\n}\n```\n\nThe function declaration\
    \ is done using ZEND_FUNCTION, which corresponds to ZEND_FE in the function entry\
    \ table (discussed earlier).\n\nAfter the declaration, code for checking and retrieving\
    \ the function's arguments, argument conversion, and return value generation follows\
    \ (more on this later).\n\n# Summary\n\nThat's it, basically—there's nothing more\
    \ to implementing PHP modules. Built-in modules are structured similarly to dynamic\
    \ modules, so, equipped with the information presented in the previous sections,\
    \ you will be able to fight the odds when encountering PHP module source files."
  merge: -1
  pgno: 333
- img_proc: true
  md: "Accepting Arguments 317\n\nNow, in the following sections, refer to about how\
    \ to make use of PHP's internals to build powerful extensions.\n\n# # Accepting\
    \ Arguments\n\nOne of the most important issues for language extensions is accepting\
    \ and dealing with data passed via arguments. Most extensions are built to deal\
    \ with specific input (or require parameters to perform their specific actions),\
    \ and function arguments are the only real way to exchange data between the PHP\
    \ level and the C level. Of course, there's also the possibility of exchanging\
    \ data using defined global values (which is also discussed later), but this should\
    \ be avoided by all means, as it's extremely bad practice. For details, refer\
    \ to Chapter 1, \"Development Concepts.\"\nPHP doesn't make use of any function\
    \ declarations; this is why syntax is always completely dynamic and never checked\
    \ for errors. Checking for correct syntax is left to the user code; it's possible\
    \ to call a function using only one argument at one time and four arguments the\
    \ next time—both invocations are syntactically absolutely correct.\n\n# # Determining\
    \ the Number of Arguments\n\nSince PHP doesn't have formal function definitions\
    \ with support for call syntax checking, and since PHP features variable arguments,\
    \ sometimes you need to find out how many arguments your function has been called.\
    \ You can use the ZEND_ARGS macro in this case. In previous versions of PHP, this\
    \ macro retrieved the number of arguments with which the function has been called\
    \ based on the function's hash table entry, which is passed to the INTERNAL_FUNCTION_PARAMETERS\
    \ list. As it now contains the number of arguments that have been passed to the\
    \ function, ZEND_NUM_ARGS has been stripped down to a dummy macro (see its definition\
    \ in zend_api.h). But its is still good practice to use it, to remain compatible\
    \ with future changes in the call interface. Note: The old PHP equivalent of this\
    \ macro is ARG_COUNT.\nThe following code checks for the correct number of arguments:\n\
    \n```\nif (ZEND_NUM_ARGS() != 2)\n    WRONG_PARAMETER_COUNT;\n```\n\nIf the function\
