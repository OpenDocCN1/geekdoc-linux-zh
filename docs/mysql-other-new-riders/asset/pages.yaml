  md: "# Making Your Code Easy to Read\n\nTo be able to understand text when reading,\
    \ your brain must analyze the information it receives from your eyes, identify\
    \ the important parts, and then translate these parts into correct order. Analysis\
    \ is performed in two steps: physical analysis and logical analysis. Physical\
    \ analysis is performed first, by examining the visual structure of the text;\
    \ for example, paragraphs, rows, columns, and even spaces between words. This\
    \ process breaks the perception of the text as a whole (for example, the scheme\
    \ of paper or the window on your desktop containing the text) into a tree-like\
    \ structure of smaller chunks. Assuming a top-down tree with the tree node at\
    \ the top and leaves at the bottom, the top of the tree contains the most generic\
    \ information; for example, the order of paragraphs that you have to read. At\
    \ the bottom of the tree is something like the order of words in a line, or even\
    \ the order of characters in a word.\n\nThe logical analysis process takes this\
    \ physical information, traverses the tree in order, and tries to translate the\
    \ information into a meaningful result. Whether this is a grammatical translation\
    \ (what structure does the sentence have?) or a contextual translation (what does\
    \ the sentence mean?) does not matter for this discussion; the important thing\
    \ is that the better the results of the physical analysis, the easier, faster,\
    \ and better the results of logical analysis.\n\nLogical analysis can compensate\
    \ for missing information from physical analysis, but only to a limited extent.\n\
    \nAsanaketethissentenceifyoucanreadyourlogicalanalyzerworksverywell.\n\nYou probably\
    \ can read the preceding sentence, but it takes much longer and requires much\
    \ more concentration than the rest of the sentences in this book. Important information\
    \ is missing (the spaces) for the first step in analysis, and you're not to use\
    \ that. We could make it by adding a bit of punctuation:\n\nAsanexample,thissentence--ifyoucanread,yourlogicalanalyzerworksverywell.\n\
    \nThe punctuation is useful information for your physical analyzer. Notice that\
    \ it's much easier to read this version, and as to refocus at any point of your\
    \ choice. To the next step:\n\nAs an example, take this sentence--if you can read\
    \ it, your logical analyzer works very well.\n\nThis is the regular way you read\
    \ a sentence, your native way of perceiving text. But we could delineate the structure\
    \ of the sentence even more:\n\nAs an example,\ntake this sentence---\n you can\
    \ read it,\nyour logical analyzer\nworks very well."
