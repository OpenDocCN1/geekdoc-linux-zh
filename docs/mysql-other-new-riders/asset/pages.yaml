  md: '# Chapter 2 Advanced Syntax


    The RLE algorithm is a simple compression algorithm that benefits from the fact
    that a lot of low-color images store the same data repetitively (especially bitmaps
    that have only two colors, black and white). Take a look at this representation
    of a simple cube:


    ```

    111111111111111111111

    100000000000000000001

    100000000000000000001

    100000000000000000001

    100000000000000000001

    100000000000000000001

    100000000000000000001

    100000000000000000001

    111111111111111111111

    ```


    With a bit of imagination, you can see a cube with a border of 1s. If you would
    write this to a file "as is," you would need $20 \times 10 = 200$ elements (20
    columns by 10 rows). We''re assuming that here one element equals at least one,
    disregarding the fact that a simple compression could be done by packing the information
    into bits.


    You can see, that storing the data as is doesn''t make sense. If you would dictate
    the data to someone to write it down, you wouldn''t read "one one one one one
    [...] zero zero zero zero zero [...] zero one one one [...]," but would tell the
    writer "twenty ones, one eighteen, eighteen, [...]"


    The same approach is taken by the RLE algorithm, which counts the number of consecutive
    elements changing their value and then stores them using a "count/value" pair.
    After compression, the data might look like


    21, 1, 18, 0, 2, 1, 18, 0, [...], 18, 0, 21, 1


    The first element is the counter, the second element the data element. To decompress
    this, you would need to read the counter and then output the data element as the
    counter indicates. As you can see, this "trick" reduced the number of required
    elements from 20 to 34.


    The problem with this algorithm is when it encounters a lot of different elements
    in a row, it creates a bigger output data than the original input, storing a lot
    of elements with a data count of 1 quickly runs the algorithm ineffective.


    To overcome this, a little quirk can be added, namely a "counter threshold." Each
    type of data has a typical range of counters: in the data above, for example,
    the counter never exceeded 21. In fact, the values used were often 18 and 2. Thus,
    by restricting the counter to a range of 1-31, we can "literal data" that doesn''t
    need compression into the input stream—the compressor spits out all input data
    elements greater than 31 without a count in front. The result is that the algorithm
    is 100% optimal for all input values larger than 31. All values less or equal
    to 31 will still be compressed non-optimally, but this can be ignored.'
