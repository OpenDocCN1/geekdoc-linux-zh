  md: 'The idea is not new. It has origins many years ago and is not hard to understand.
    Instead of carrying a pointer with each node that addresses another place in memory
    to the next node, each node contains indices into the array to each node it''s
    linked to. This also has the advantage that PHP is able to warn you of invalid
    indices, and you can copy your whole tree by just assigning the variable that
    contains the tree array to another variable. On top of that, you can serialize
    the whole tree and save it “as is” to any place you want.


    To give another, more theoretical explanation: Think of the memory that''s available
    to your program as one big array. The size of the elements would probably be bytes,
    in the case of physical RAM, but the size of each element doesn''t really matter.
    The important thing is that a pointer is simply a number indexing one of these
    elements and thus pointing out the beginning of each structure you''re placing
    into your RAM. Now, abstracting the whole thing into a language construct (a “real”
    array), you have the same situation at a higher level:The PHP array now contains
    your “RAM,” and each array element will represent one of the tree nodes. Pointers
    become indices into this array, and referencing is done simply by retrieving the
    correct element from the array.


    Using arrays enables you to create a lot of “RAMs,” increasing and decreasing
    their size, disposing of them as a whole or just a single element; overall, a
    very comfortable method of memory management. Having all integrated into a solid
    library gives you a nice tool.


    Figure 2.9 shows how the tree library internally handles the tree nodes in an
    array.


    ![](img/eddeabf7128be657d5f7345abdc760ac_71_0.png)


    Figure 2.9 A tree contained in an array.'
