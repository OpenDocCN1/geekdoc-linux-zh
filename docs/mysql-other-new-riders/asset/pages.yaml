  md: "# Variable Function Names\n\nOf course, what we said about variable variable\
    \ names in the preceding section is also valid for function names. Function names\
    \ can be constructed using variables, providing a dynamic way of processing data,\
    \ installing modifiable callbacks, and the like. Instead of hardcoding function\
    \ names, you can use string variables to specify the functions you want to call:\n\
    \n```\nfunction my_func($a, $b)\n{\n    print('$a, $b');\n}\n```\n\n```\n$function\
    \ = 'my_func';\n$function(1, 2);\n```\n\nAfter the declaration of my_func(), the\
    \ variable $function is assigned a string 'my_func'. Since this string is the\
    \ same as the name of the function you want to call, you can use it when calling\
    \ my_func().\n\nOf course, this is a very simple example of variable function\
    \ names. They're useful when you have to switch between a set of different functions,\
    \ depending on a number of variable flags.\n\nSuppose you want to decode email\
    \ attachments. These can have different formats—to name just two, base64 and encoded.\
    \ Creating a \"closed\" parser that only stands one or two encoding formats can\
    \ hardly be extended is not a good idea; as soon as new formats are demanded,\
    \ you'll be stuck. This case is almost ideal for variable function names:\n\n\
    ```\nfunction decode_base64($encoded_data)\n{\n    // do something with the encoded\
    \ data\n    return($decoded_data);\n}\n```\n\n```\nfunction decode_uuencoded($encoded_data)\n\
    {\n    // do something with the encoded data\n    return($decoded_data);\n}\n\
    ```"
