    * Retrieve the ten most-recently-added entries.

    * Retrieve top-rated entries.

    * Retrieve the most-accessed entries.

    * Retrieve all entries submitted from a certain author.


    And so forth, for all outlined actions with entries and domains. This will result
    in a comprehensive list of needed structures and actions, documenting the whole
    project.'
