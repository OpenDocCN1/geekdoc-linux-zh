    Here we use the tags in use, providing for structured and logical markup. In contrast
    to HTML,


    +   - Tags are sensitive.

    - Whitespace is significant.

    - Opening tags must always have a matching closing tag or be self-closing (for
    example, <ref/>).

    - Documents can have an arbitrary Document Type Definition.


    Thus we can say: XML removes the enormous complexity of SGML, while still providing
    all necessary features for structural markup, including the definition of custom
    document types.


    # XML''s Advantages


    But why XML? With all those formal definitions and fact sheets, developers don''t
    see the usefulness for their daily activities at first. Indeed, why use XML and
    not Word or Notes? Or your own proprietary format? Or a relational database?


    The main argument against proprietary formats is that: They''re proprietary. Data
    that''s designed to be used on a heterogeneous network such as the Internet has
    to be usable on all types of computers connected to it. XML is built out of plain
    text format (as opposed to the binary format of most proprietary applications),
    making it supportable by all current computing platforms. Besides, proprietary
    data formats are often (for example in public bodies) just not an option:You don''t
    want to rely on the mercy of a single vendor who could change the format at, or
    even abandon it altogether. XML is license-free, vendor-neutral, and platform-independent.'
