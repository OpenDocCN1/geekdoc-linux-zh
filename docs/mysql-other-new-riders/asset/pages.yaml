    had a closer look at sessions.c and ported it over to native PHP 3.0.

    While we didn''t preserve some internals, such as the algorithm used for the generation
    of the session ID, we tried to make the API 100% compatible with PHP 4.0. Some
    limitations obviously do exist: Automatic URL rewriting isn unavailable, for example.
    But if'
