    # Using HTML Templates


    You have noticed that there’s no HTML code in the example provided. Indeed, we
    have “outsourced” the HTML to a separate file called PHP_Normal_Form.inc.html.
    This is a template file, containing all HTML layout and some template tags such
    as (HEADER).


    Maybe this finds simple for you because you''ve already used the FastTemplate.
    EasyTemplate leaves the advanced features of FastTemplate—all it provides a fast
    interface to replace scalar tags in templates with a string value. Because it
    restricts itself to this simple operation, it offers a performance boost of over
    120% compared to FastTemplate when parsing our form template.


    The template class has developed three functions: assign(), easy_parse(), and
    easy_print(), described in the following table:


    | Function | Description |

    | --- | --- |

    | void EasyTemplate (string template_filename) | The constructor of the class.
    Takes as argument the filename of the template you want to use. If an error occurs,
    the $error variable will contain the error. |

    | bool assign (string tag, string value) | Assigns a value for a template tag.
    Returns true on success and false on error. |

    | mixed easy_parse() | Parses the template and returns it as a string. If an error
    occurs, the function returns false and sets the class''s $error variable to a
    meaningful message. |

    | mixed easy_print() | Parses the template and prints it out. If an error occurs,
    the function returns false and sets the class''s $error variable to a meaningful
    message. |


    > Tip: A constructor in PHP always returns void—no matter what you’re trying to
    do with return().


    What’s the advantage of using templates? The main advantage is separation of layout
    and code. Any designer can open the template file in his favorite HTML authoring
    software without having to worry about breaking the script code. And the developer
    doesn''t need to deal with HTML at all.


    The alternative would be embedding PHP code directly in the HTML. If you were
    to redesign your application, you’d have a hard time changing the HTML code manually.'
