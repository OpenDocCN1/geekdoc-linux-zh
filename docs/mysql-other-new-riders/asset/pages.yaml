    We''ve encountered this problem often, in our own code and that of other people.The
    rule for inline comments is that you can hardly use many. The only exception to
    this rule is when comments are overused to the point that they obscure the code
    they''re meant to describe. Also, you should be careful not to comment obvious
    things. See Listing 1.7 for a few examples.'
