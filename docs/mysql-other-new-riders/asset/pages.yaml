  md: '194 Chapter 5 Basic Web Application Strategies


    # # PHP AND COM


    The Component Object Model (COM) is a software architecture developed by Microsoft
    that allows abstracting software chunks into binary components. COM defines a
    standard for component interoperability and specific features a component must
    have. It doesn''t depend on any programming language; indeed, Microsoft shows
    efforts to establish COM as an open IETF (Internet Engineering Task Force) standard.
    COM objects can be accessed by any compliant application and programming language;
    for example, from Visual Basic, Delphi, or PHP.


    The question COM addresses this: How can a system be designed in such a way that
    binary software components from different vendors can operate? To this question,
    the concept of DLLs failed miserably. Because of the missing versioning in DLLs,
    no two DLLs exposing the same interface could be used on a single system. Let''s
    make an example. You''ve got a server-monitoring application that continually
    whether a server is down and logs the collected data. You have a front end with
    pretty statistics and some logic to react in an appropriate way if the server
    is unreachable. The back end of the software could be a DLL performing the actual
    monitoring. Let''s say ServerSpy.dll exposes a function `is_reachable()`, taking
    a server name and returning `true` if the server is reachable or `false` if it''s
    not.


    We haven''t defined what kind of server to monitor yet—indeed, it could be a Web
    server, mail server, name server, or any other system, and the function declaration
    as well as the back end deigned need to be changed. The only part needing a change
    would be the implementation of the function `is_reachable()`.


    With DLLs, you could have exactly one monitoring service on the system—either
    Web server spy or mail spy, etc. If you install another DLL, it would overwrite
    the previous one.


    Your application couldn''t let the user choose between available monitoring services.
    Nor would it be possible to have a different version of one service available
    on the system. If another vendor created a better implementation of ServerSpy.dll
    and sold to you, it would overwrite your version of the DLL. If the function worked
    exactly the same, all would be—otherwise, your application would stop working.


    A proper component model tries to solve these problems. COM provides a way to
    identify components by a globally unique ID (GUID), allowing you to use many services
    concurrently—the operating system knows all installed components and your application
    could query it for components in the category "Spy monitoring services." COM provides
    versioning, allowing you to have different versions of a component on the system
    without affecting each other.


    And finally, it provides component introspection, allowing you to see which methods
    and properties are


    You have probably heard of ActiveX controls. ActiveX controls, also known as OCX
    controls because of Microsoft''s creative marketing department, are simply an
    application of COM components. They provide a reduced set of COM interfaces so


    ![](img/eddeabf7128be657d5f7345abdc760ac_211_0.png)'
