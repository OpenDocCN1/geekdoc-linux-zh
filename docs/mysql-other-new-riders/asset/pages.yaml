  md: "# 266 Chapter 7 Cutting-Edge Applications\n\nWith these functions and properties,\
    \ you can get all available information about a node. You can access its attributes,\
    \ child nodes (if any), and parent node. And you can modify the tree by adding\
    \ children or setting attributes. Listing 7.4 shows the functions in action. This\
    \ is the XML printer mentioned earlier in the Expat section, ported LibXML—instead\
    \ of registering handler functions, it applies different formatting to the node's\
    \ type. Each node has an associated type. The type identifier is a PHP constant,\
    \ and you can see the list in the example's source. Using the children() function,\
    \ which returns the node's child elements (as node objects), the example performs\
    \ the loop recursively by calling the output_node() function again.\n\nListing\
    \ 7.4 XML pretty printer—example using the LibXML functions.\n\n```\n// Define\
    \ tab width\ndefine('INDENT', 4);\n\nfunction output_node($node, $depth) {\n \
    \   // Different action per node type\n    switch($node->type) {\n        case\
    \ XML_ELEMENT_NODE:\n            for($i=0; $i<$depth; $i++) print('&nbsp;');\n\
    \n            // Start element\n            print('<span class=\"element&lt;'.$node->name.'&gt;');\n\
    \            print($node->name);\n\n            // Get attribute names and values\n\
    \            $attrs = $node->attributes();\n            if(is_array($attrs)) {\n\
    \                while(list($key, $value) = each($attrs)) {\n                \
    \    print('$key = <span class=\"attribute\">'.$value.'</span>');\n          \
    \      }\n            }\n\n            print('&gt;&lt;/span><br>');\n\n      \
    \      // Process children, if any\n            $children = $node->children();\n\
    \            for($i=0; $i < count($children); $i++) {\n                output_node($children[$i],\
    \ $depth+$INDENT);\n            }\n\n            // End element\n            for($i=0;\
    \ $i<$depth; $i++) print('&nbsp;');\n    }\n```"
