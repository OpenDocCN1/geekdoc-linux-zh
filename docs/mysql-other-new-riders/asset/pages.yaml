  md: '# Calling User Functions


    For dynamic extensions, module and require startup/shutdown events happen at the
    same time.


    Declaration and implementation of these functions can be done with macros; see
    the earlier section "Declaration of the Zend Module Block" for details.


    # Calling User Functions


    You can call user functions from your own modules, which is very handy when implementing
    calbacks - for array walking, searching, or simply for event-based programs.


    User functions can be called with the function call_user_function_ex(). It requires
    a hash value for the function name you want to access, a pointer to an object
    of arguments (if you want to call a method), the function name, return value,
    argument array, and a flag indicating whether you want to perform zval separation:


    ```

    ZEND_API call_user_function_ex(HashTable *function_table, zval *object,

    =zval *function_name, zval *retval_ptr_ptr,

    =int *param_count, zval *params[]

    =int no_separation);

    ```


    Notice that you don''t have to specify both function_table and object; either
    will do. If you want to call a method, you have to supply the object that contains
    this method, in which case call_user_function() automatically sets the function
    table to this object''s function table. Otherwise, you only need to specify function_table
    and can set object to NULL.


    Usually, the default function table is the "root" function table containing all
    function entries. This function table is part of the compiler globals and can
    be accessed using the macro CG. To introduce the compiler globals to your function,
    the macro CLS_FETCH once.


    The function name is specified in a zval. This might be a bit surprising at first,
    but it is quite a logical step, most of the time you''ll accept function names
    as parameters calling functions within your script, which turn are contained in
    zval containers again. Thus, you only have to pass your arguments through this
    function. This zval must be of type IS_STRING.


    The next argument is a pointer of a to the return value. You don''t have to allocate
    memory for this container; the zval will do so by itself. However, you don''t
    have to destroy this container (using zval_dtor()) afterward!


    Next is the parameter count as integer and an array containing all necessary parameters.
    The last argument specifies whether the function should perform zval separation—this
    should always be set to 0. If set to 1, the function consumes less memory but
    fails if any of the parameters need separation.'
