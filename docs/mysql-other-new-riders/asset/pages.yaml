  md: '# Linked Lists


    Linked lists, a special form of trees, are one of the most typical data structures
    to organize dynamic datasets. We''re assuming that you already have an understanding
    of the structure, concept, and use of linked lists, so we won''t go deeply into
    their implementation; we''d rather concentrate on the elemental dos and don''ts.


    As described in the previous sections, PHP 3.0 creates copies of object instances
    rather than referring to them using a pointer. This enables a very limited, WORM-like
    use of linked lists: write once, read multiple. Linked lists can be created, but
    not modified. When you try to modify an element in the list, you lose the reference
    to all elements in the list. Regrouping of elements is impossible for the same
    reason.


    Similarly, double-linked lists can''t be realized in PHP 3.0 (at least, we managed
    it, and we spent a few hours in debugging sessions before giving up). Because
    each node would need a new copy of the list tail to its linking, you would have
    to create a multiple of redundant lists with the same content just to enable the
    "go one element" feature.


    PHP 4.0, supporting true references, impose these limits. Lists can be created
    and reorganized randomly—even double-linked lists. Note, however, that it is very
    tricky to distinguish between references and actual copies of list elements.


    > Beware of dangling pointers—so programmers of "conventional" languages. We''d
    like to modify this for PHP: Beware of redundant copies.


    With lists, create a bulletproof library that handles all your needs in the most
    general way. Test intensively and make sure that it performs correctly. This will
    prevent you from having to search for erroneous code accessing your lists in incorrect
    ways and eventually destroying them.


    # Linked Lists and Trees—A Workaround


    As mentioned earlier, it''s a good idea to create a bulletproof library for your
    needs—one that easily satisfies everything features related to the required task.
    We would like to present a real-example here: a library that we''ve developed
    to handle trees, and that works with PHP 3.0. You can find the complete source
    code on the CD-ROM.


    The library is able to handle double-linked trees with two children per leaf node,
    each node having one content for mixed variables. Every action that is performed
    with the tree has been incorporated into the API, detaching the tree design from
    the code it accesses.


    This is exactly the reason why this tree works with PHP 3.0 (seemingly contradicting
    what we said earlier). The tree is based on arrays and not on pointers because
    PHP features dynamic arrays, with a little bit of effort it''s very easy to use
    such arrays to implement a dynamic tree.'
