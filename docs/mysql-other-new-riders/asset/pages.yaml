  md: '# # Summary


    In this chapter, you''ve learned a lot about PHP''s advanced syntax and good coding
    practices. You''ve seen how to create constants using define(). Then the more
    tricky aspects of arrays were outlined, and you learned that you should use list()/each()
    to traverse hashes. We''ve explained PHP''s OOP features, and shown you and when
    to use them—and when to stick to procedural programming instead. Because PHP is
    an interpreted language, it allows many features that would be very hard to implement
    with traditional compiled programming languages: Variables and functions, self-modifying
    code, and runtime evaluation of source code. With this knowledge, you''re well
    prepared for advanced PHP programming, and a big step further on your way to becoming
    a PHP wizard.'
