  md: "# 352 Chapter 9 Extending PHP 4.0: Hacking the PHP\n\nThe fourth parameter\
    \ consists of a pointer to a change-notification handler. Whenever one of these\
    \ initialization entries is changed, this handler is called. Such a handler can\
    \ be declared using the PHP_INI_MH macro.\n\n```\nPHP_INI_MH(OnChangeSecond) //\
    \ handler for ini-entry\n                    = \"second_ini_entry\"\n```\n\n```\n\
    // specify ini-entries\n```\n\n```\nPHP_INI_MH(OnChangeSecond)\n{\n    printf(\"\
    Message caught, our ini entry has been changed to %s<br>\",\n           new_value);\n\
    \n    return(SUCCESS);\n}\n```\n\nThe new value is given to the change handler\
    \ as string in the variable new_value. When looking at the definition of PHP_INI_MH,\
    \ you actually have a few parameters to use:\n\n```\n#define PHP_INI_MH(name)\
    \ int php_ini_h *entry, char *new_value,\n                   =uint *new_value_length,\
    \ void *mh_arg1,\n                   =void *mh_arg2, void *mh_arg3)\n```\n\nAll\
    \ these definitions are found in php_ini_h.h. Your message handler will have a\
    \ structure that contains the full entry, the new value, its length, and three\
    \ optional arguments. These optional arguments can be specified with the additional\
    \ macros PHP_INI_ENTRY1 (allowing one additional argument), PHP_INI_ENTRY2 (allowing\
    \ two additional arguments), PHP_INI_ENTRY3 (allowing three additional arguments).\n\
    The change-notification handlers should be used to cache initialization entries\
    \ for faster access or perform certain tasks that are required if a value changes.\
    \ For example, if a constant connection to host is required by a module and someone\
    \ changes the hostname, automatically terminate the old connection and attempt\
    \ a new one.\n\nAccess to initialization entries can also be handled with the\
    \ macros shown in Table 9.17.\n\nTable 9.17 Macros to Access Initialization Entries\
    \ in PHP\n| Macro | Description |\n| --- | --- |\n| INI_INT(name) | Returns the\
    \ current value of entry name as integer (long). |\n| INI_FLT(name) | Returns\
    \ the current value of entry name as float (double). |\n| INI_STR(name) | Returns\
    \ the current value of entry name as string. Note: This string is not duplicated,\
    \ but instead points to internal data. Further access requires duplication to\
    \ local memory. |"
