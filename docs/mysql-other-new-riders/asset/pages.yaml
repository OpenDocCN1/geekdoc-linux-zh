    # # Duplicating Variable Contents: The Copy Constructor


    Sooner or later, you may need to assign the contents of one zval container to
    another. This is easier than done, since the zval container doesn''t contain type
    information, but also references to places in Zend''s internal data. For example,
    depending on their type, arrays and objects may be nested with lots of hash table
    entries. By assigning one zval to another, you avoid duplicating the hash table
    entries, using only a reference to them (at most).


    To copy this kind of data, use the copy constructor. Copy constructors are typically
    defined in languages that support overloading, with the express purpose of copying
    complex types. If you define an operator = in such a language, you have the possibility
    of overloading it, which is usually responsible for assigning the contents of
    the lvalue (result of the evaluation of the left side of the operator) to the
    rvalue (same for the right side).


    Overloading means assigning a different value to this operator, and is usually
    used to assign a function call to an operator. Whenever this operator would be
    used on such an object in a program, this function would be called with the lvalue
    and rvalue as parameters. Equipped with that information, it can perform the operation
    it intends the = operator to have (an extended form of copying).


    This same form of “extended copying” is also necessary for PHP''s zval containers.
    Again, in the case of an array, this extended copying would imply re-creation
    of all hash-table entries relating to this. For strings, memory allocation would
    have to be assured, and so on.'
