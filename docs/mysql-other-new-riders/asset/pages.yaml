  md: "# 130 Chapter 4 Web Application Concepts\n\nDetails on session propagation\
    \ in real life will follow a bit later. First, we'd like to show you another way\
    \ of session ID propagation, arguably the most geeky taken.\n\n# DNS Tricks\n\n\
    The need to tag all links in an application with the session ID can be really\
    \ annoying. PHP 4.0 has a way to do it automatically, but it may be a performance\
    \ hit on larger sites, and it doesn't work with PHP 3.0.\n\nWe have a solution\
    \ for you.\n\nUp front, the caveats:You need to be able to change the DNS record\
    \ for your server, and the server you want to use for this kind of session ID\
    \ propagation needs its own static IP. Name-based virtual hosting won't work here.\n\
    \nYou meet these requirements? Great. If you're proficient with name servers,\
    \ you may know that wildcard entries can be used in DNS configuration. These entries\
    \ may map any arbitrary hostname to a static IP; for example, we've got this entry\
    \ to direct requests for everything phpwebdev.com to the IP 194.242.199.228:\n\
    \n```\n*phpwebdev.com IN A 194.242.199.228\n```\n\nA request for http://this.is.one.domain.phpwebdev.com\
    \ will be redirected to the specified IP. Since the hostname is arbitrary, Apache\
    \ must be configured to handle the IP-based virtual hosting, where the hostname\
    \ must be fixed and known. Your Apache configuration looks like this:\n\n```\n\
    <VirtualHost 194.242.199.228>\nServerAdmin tobias@dev.phpwebdev.com\nDocumentRoot\
    \ /home/www/htdocs\nServerName phpwebdev.com\n</VirtualHost>\n```\n\nOur trick\
    \ will also work fine if Apache's main server is bound to this address.\n\nThe\
    \ scope of this is to encode the session ID in the hostname itself. From the first\
    \ request to the application, the session ID is created, and the client is redirected\
    \ to the new URL containing the tagged hostname, which will look like this:\n\n\
    ```\n35eb1ce8828d4f0bc83c1e53ad2caa.phpwebdev.com\n```\n\nThe advantage is clear:\
    \ As long as you use relative links in your application, it's no longer necessary\
    \ to bother with the earlier session start function to extract the session ID\
    \ from the hostname:\n\nWe modified the session start function to extract the\
    \ session ID\n\n```\nfunction session_start_from_host($host)\n{\n  global $HTTP_HOST,\
    \ $PHP_SELF;\n\n  preg('/([0-9a-z]{32})\\./', $HTTP_HOST, $regs);\n  $session_id\
    \ = $regs[1];\n```"
