  md: '![](img/eddeabf7128be657d5f7345abdc760ac_140_0.png)


    # 4


    # Web Application Concepts


    > We join spokes together in a wheel, but it is the center hole that makes the
    wagon move.

    We shape clay into a pot, but it is the emptiness inside that holds whatever we
    want.

    We hammer wood for a house, but it is the inner space that makes it livable.


    TO UNDERSTAND THE IMPLICATIONS OF WEB APPLICATION concepts, you need to differentiate
    between applications and single scripts. A script is a utility, and as such doesn''t
    have any context. It doesn''t know about other scripts in your system. An application,
    however, is designed to perform more advanced tasks. An application needs to maintain
    state and execute transactions, because it''s interactive. Because it generally
    requires more user interaction than a single script, you also need to worry about
    security and usability. Of course, the return for all this tool is that you can
    create the new Yahoo! It''s applications that make the Web interesting.


    # HTTP and Sessions


    Imagine a KDE application, Kedit for. (KDE is a windows manager for Linux and
    compatible X systems.) A typical operation might include opening a file, and saving
    it under another name. Kedit knows what you''re doing in every step of this process.
    It knows you''re editing the file, where the cursor is,'
  merge: -1
  pgno: 140
- img_proc: true
  md: 'where you move the mouse, and so on. Even if you open a second instance of
    Kedit, it won''t get confused; selecting Save in instance 1 won''t save the file
    from instance 2. This is possible because Kedit (or the operating system, to be
    exact) knows how to associate your actions with a specific instance of the application—it
    receives an event like "In the instance with the PID 4711 (a PID is a unique identifier
    on UNIX systems), the mouse moved to the coordinates 10, 4;"


    # Maintaining State


    When Tim Berners-Lee designed the Hypertext Transfer Protocol in 1991, he decided
    to make HTTP as fast as possible and therefore leave out any state information.


    HTTP has no mechanism to maintain state; thus HTTP is a context-free or stateless
    protocol. Individual requests are related to each other. The web server (and thus
    PHP) can''t distinguish between single users and know about user sessions. Therefore,
    we need to find our own way to identify a user and associate session data (that
    is, all the data you want to store for a user) with that user. We use the term
    session for an instance of a user visiting a site where one or more pages are
    viewed. A typical online shopping session putting an item into the shopping cart,
    going to the checkout page, entering address and credit card data, submitting
    the order, and closing the browser.


    The good news is there''s more than one way to manage sessions. There is no way
    that is perfect. Let''s first sort out the ways that don''t work, even if they
    seem to be good.


    At first, typical PHP programmer tries to ignore the problem and find a workaround
    for it. The obvious most is to store all data on the client instead of the server.
    This leads to a lot of hidden fields or very long URLs. It becomes impractical
    with more than two files and more than variable to save. An only slightly more
    intelligent method is to use cookies to store all information on the client.


    Data shouldn''t be stored on the client for several reasons:


    +   You control over the data—as long as the user does not return to your site,
    you can access the data. And, that data may be manipulated when you get it. Ninety
    percent of all web site defacing and breaking comes from applications accepting
    tampered data from the client and trusting that data. Do not keep data on the
    client. Do not trust data from the client.


    +   If you use GET/POST, the state isn''t persistent across sessions.


    +   If you rely exclusively on cookies, you have a problem because some users
    won''t accept cookies—simply disable cookies in their browsers.


    +   The data is hard to maintain because you need to save all data on every page.
    Each variable needs to be URL-encoded, added to a form as a hidden field or added
    to the URL, or saved as a cookie. This is difficult for a single variable such
    as the session ID, let alone dozens of variables!'
  merge: -1
  pgno: 141
- img_proc: true
  md: '# HTTP and Sessions 125


    Thus, the data needs to be stored on the server. Exactly where you store it isn''t
    all that important; can be in a relational database management system (RDBMS),
    plaintext file, dBASE file, etc. Because a Web application generally already uses
    a relational database such as MySQL, this should be the preferred storage medium.


    To associate the data with a user, you will need a session identity number—a key
    that ties the user to the data. But, as mentioned earlier, HTTP lacks a mechanism
    to identify users. What should you use, then, to bind the reader?


    One idea that might come to mind immediately is at first glance, to use the user''s
    IP address. This approach seems logical at first glance, the associated problems
    disqualify it from being:


    +   - Many ISPs force users to use proxy servers; of course, `REMOTE_ADDR will
    show the IP of your proxy. If two AOL users try to use your Web application at
    the same time, things would get messed up.

    - Some ISPs (for example, cable access providers) change their users'' IP addresses
    once in a while to prevent them from running Web servers.

    - Last but not, the user could decide to close his Internet connection, for coffee,
    and return 15 minutes later to your online shop (with a different IP, of course).


    After you accept the fact that there''s no generic way to identify the user with
    predefined magic number, the only solution is to create a session ID of your own
    and pass it from page to page: "How?” you ask. Read on, we provide details a bit
    later. This ID must be random, or users will try to predict and take over other
    sessions. If the ID is linear, for example a normal number (page.php3?ID=5), it
    may only be embarrassing for normal users to use each other''s shopping cart,
    but it can be embarrassing but it becomes a very dangerous security threat when
    hackers take over other sessions to steal credit card numbers or produce fraudulent
    orders.


    +   - PHP has a built-in uniqid() function, but because it''s based on the system
    time, it''s not enough to be used for a session ID. However, you can combine it
    with a hash function and rand() to create a truly random string with ⁸ possible
    elements:


    ```

    rand((double)microtime()\*1000000); // Seed the random number generator

    $session_id = md5(uniqid(rand())); // Construct the session ID

    ```


    # Accessing the User''s IP Address


    You can access the user''s IP address from the environment variable $REMOTE_ADDR.
    Use phpinfo() to get a list of available environment variables.'
  merge: -1
  pgno: 142
- img_proc: true
  md: '# Chapter 4 Web Application Concepts


    Anyone who tried to crack this would have to perform a brute force attack over
    all possible elements; the attacker would have to find a valid session ID from
    340,282,366,938,463,374,607,768,211,456 possible values. Cryptoanalysts Van Oorschot
    and Wiener developed a theoretical search machine for MD5 estimated in 1994 that
    such a machine (estimated cost: $10 million) would take 24 days on average to
    crack an MD5-encrypted message.


    If this worries you, you should consider disconnecting your server from the Internet.


    By way, md5(uniq())—the same construct from above without a rand() call—would
    not be sufficiently random because uniq() is based on the system time, it could
    be guessed if the hacker learns the local system time of the server. The space
    to be searched is considerably less than 2¹.


    # Session ID Propagation with Cookies


    Now the only remaining issue is making the session ID available to all pages of
    your application. One way to do it is by setting a cookie containing the ID. If
    you want to identify a user over multiple visits, using cookies is the only possibility.
    Unfortunately, a percentage of your users may have turned off cookies in their
    browsers (some estimates show figures of up to 20%). Depending on your target
    audience, it may be acceptable to redirect these users to a help page explaining
    how to enable cookies.


    Passing the session ID with cookies is by far the easiest method for the developer.
    Except for setting the cookie, nothing needs to be done by your application.


    # Manual URL Rewriting


    You can also use URL rewriting for session ID propagation. This means that you
    pass the session ID via GET/POST or "hide" it in the URL. You need to alter all
    frame, form, and a HTML tag to refer to your ID:


    ```

    // A frame source definition

    printf(''<frame src="page.php3?session_id=%s">'', $session_id);

    ```


    ```

    // A hidden form field

    printf(''<input type="hidden" name="session_id" value="%s">'', $session_id);

    ```


    ```

    // A normal link

    printf(''<a href="page.php3?session_id=%s">Link</a>/'', $session_id);

    ```


    If you have images, inline frames, or JavaScript redirects in your application,
    you will also need to alter them.


    URL rewriting has several drawbacks:


    +   It introduces a considerable amount of additional work for you as developer.
    You have to manually add the session ID to all links. If you forget a single link,
    the user''s session will be lost.'
  merge: -1
