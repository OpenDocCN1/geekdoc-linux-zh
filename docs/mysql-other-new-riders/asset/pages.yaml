  md: "# Chapter 2 Advanced Syntax\n\neach() is also a very good tool to ensure that\
    \ you're not accessing arrays out of their bounds—another reason for exceptions.\
    \ PHP handles out-of-bound accesses in a quite relaxed manner (it will most likely\
    \ send you a warning); however, we have managed to crash PHP by using invalid\
    \ array accesses. The best case was that PHP quit with an exception; the worst\
    \ was the PHP module suddenly used 100% of the CPU time and the server process\
    \ had to be killed—a situation should be avoided by all means in a production\
    \ environment. Even though this was most likely triggered by buggy internal array\
    \ handling in PHP, you still shouldn't force invalid array accesses. It's very\
    \ bad coding practice, and PHP provides each(), list(), and associated functions\
    \ and operators to secure your code, you should use them as well.\n\nThe original\
    \ purpose of each() was to use it with \"real\" associative arrays, using non-numeric\
    \ keys to index data. Whenever this is the case, it's impossible to gain access\
    \ to the data without a function that can list all keys (assuming you don't know\
    \ which are in use). These arrays could be organized similarly to the array described\
    \ above, with keys and values having the opposite order:\n\n```\n$my_array = array('London'\
    \ => 1, 'Graeme' => 2, 'Tobias' => 3, 'Till' => 4);\nwhile(list($key, $value)\
    \ = each($my_array)) {\n    print('$key $value\\n');\n}\n```\n\nNow you have the\
    \ array indexed by name, by number—how are you going to find out which names are\
    \ contained in the array if you don't use predefined keys? each() allows you to\
    \ do so, Figure 2.4.\n\n![](img/eddeabf7128be657d5f7345abdc760ac_55_0.png)\n\n\
    Figure 2.4 Associative array listing using each().\n\nNot a very surprising result;\
    \ nevertheless, quite useful to know.\n\nOne important note about each():To enable\
    \ you to retrieve one key/value pair per iteration, PHP has to remember which\
    \ pair you accessed. Consequently, when doing another iteration on the same array,\
    \ no two of the same key/value pairs will be returned. To reset the internal array\
    \ counter, you have to use the function reset()."
