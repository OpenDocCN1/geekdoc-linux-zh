  md: 'When designing an application with a customer, this step is called creating
    the specifications (or just specs). At this point, the customer can still influence
    the layout of the application. This is very important because the application
    must meet the requirements listed in this step, or won''t be approved by the customer.


    # The Customer Is Always Right, When He''s Wrong


    Customers who contract you for an application often do not have enough expertise
    to design such an application by themselves, which is why they''re you. When discussing
    requirements with customers, guide them when they''re suggesting bad solutions.
    For example, if the customer says, "I want a chat that displays full-screen images
    of every chatter, refreshed at least every second," you might make this counter-suggestion:
    "Wouldn''t it be better to try to thumbnail views next to each line? Most of your
    chatters won''t have enough bandwidth to display full-screen pictures at all"


    But careful; never insist on your point of view (except when customers want to
    implement unrealistic features). After all, customers pay you to implement their
    vision. To avoid losing a contract, you may have to temporarily implement a bad
    solution (when you see that you can''t talk the customer into it the right way),
    and then later on change it when the customer sees it won''t work out using their
    strategy.


    For this project, you will take the role of the project manager and the authors
    will be your customers. Since we''re nice customers, we won''t keep insisting
    on nailing down details of this application; we''ll leave the rest of the design
    to you. Whenever this chapter hits a point where a choice or decision can be made,
    sit back and try to make your choices. Closely evaluate all facts and compare
    your results with the conclusions discussed in the book.


    # Comparing Technologies


    Before even starting to think about code layout, there''s a phase we don''t know
    what else to call but "getting things together."This is the intermediate step
    between the specs/code layout stage—figuring out the inner workings and on what
    to base them.


    To make it clear, let''s go back to the very beginning:


    +   - What do we want to create?


    +   - How are we going to create it?


    +   - Are there any existing implementations of our idea already?'
