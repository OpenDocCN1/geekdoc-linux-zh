- img_proc: true
  md: "PHP is an interpreted language, in which code is evaluated and executed step\
    \ by step. Add to fact that PHP's way of handling variables, you've introduced\
    \ a lot of possibilities to programming, but also a lot of traps. This chapter\
    \ deatls with the typical do's and don'ts for using advanced syntactic and algorithmic\
    \ features:\n\n+   * Defining constants\n* Array functions\n* Classes\n* Linked\
    \ lists\n* Trees\n* Associative arrays\n* Multidimensional arrays\n* Variable\
    \ arguments and variable argument lists\n* Variable assignment names\n* Variable\
    \ function names\n* Self-modifying high-level code\n* Polymorphism\n\nThe following\
    \ sections cover all these issues in more detail.\n\n# Defining Constants\n\n\
    While there is no expression or construct to define constants in the form of unmodified\
    \ variables in PHP, you can nevertheless accomplish this objective by using defined\
    \ values. Defined values should be used to replace all fixed values such as error\
    \ codes, file format constants, special strings, and whatever will have a special\
    \ meaning to the program or library and not change during execution.\n\nDefined\
    \ values have the great advantage that they clarify the meaning of special values,\
    \ while at the same time providing another level of abstraction:\n\n```\n// read\
    \ file type from input\n$file_type = fgets($file, 32);\n\n// decide what kind\
    \ of file it is\nwitch($file_type) {\n    case FT_GIF_IMAGE: /* handle GIFs here\
    \ */\n        break;\n\n    case FT_PNG_IMAGE: /* handle PNGs here */\n      \
    \  break;\n\n    case FT_ZIP_ARCHIVE: /* handle ZIPs here */\n        break;\n\
    }\n```"
