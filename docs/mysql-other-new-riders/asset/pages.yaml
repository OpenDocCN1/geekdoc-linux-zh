    With reset(), several functions are available to split up the activities of each():
    next(), prev(), and current(). Using these functions, it''s possible to manually
    traverse in an array internal pointer; next() returns the current element and
    then advances the internal array pointer; prev() does the same but moves the array
    pointer in the opposite direction. current() simply returns the array element
    currently being pointed to. However, these functions return false whenever they
    encounter an empty, unassigned element, as well as when encountering the end of
    the array. There''s no way to distinguish both cases; these functions should be
    used only when each() is not choice and the situation of encountering an unassigned
    element can be eliminated.

    In addition to the functions described, many other PHP functions deal with arrays.
    For a complete description, refer to the manual. With PHP 4.0, the number of array
    functions increased tremendously; covering all of them wouldn''t allow us to focus
    on more important issues.'
