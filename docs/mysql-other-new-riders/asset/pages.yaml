  md: '# Authentication 223


    The essence of this calculation is not example: The admin level is different from
    the user, and a user belonging to the admin group won''t be able to access functionality
    secured with Sauth->have_perm("user"). To make this clearer, it helps to visualize
    how PHPLib calculates the bit patterns:


    +   - Functionality accessible only to user levels. This level has the bit pattern
    1.

    - The user is in the admin level, which has the bit pattern 16.

    - These two operands are combined with a logical AND, which results in 0 (verify
    yourself:print(16 & 1)); The result 0 is not the same as the requested level (1),
    so access is denied.


    The essence of this calculation is that PHPLib tests whether the bit pattern provided
    as argument to perm->have_perm() has the user''s permission bit set. This allows
    complex combinations.


    Let''s have a look at another example: Suppose you have four permission levels—admin,
    editor_in_chief, editor, and author. You want the editors not to be able to submit
    content (author level), but the other groups inherit the permissions below them.
    The final authorization system looks like this:


    +   - admin inherits editor_in_chief, editor, author

    - editor_in_chief: inherits editor, author

    - editor

    - author


    To calculate the bit patterns for each group, you start at the lowest level, author,
    with a bit pattern of 1 (meaning the rightmost bit is set). If we wanted the editor
    to inherit the author level, we would go on with the author bit pattern and set
    the next higher bit (1 | 2). For this example, we want the author and editor groups
    to be separate, so we set the editor level to the next free bit pattern, decimal
    2 (binary 10).


    If an editor now requests a page protected with author permissions, access will
    be denied:


    +   - required level (author): 1

    - current level (editor): 2

    - logical AND of 1 and 2 (1 & 2) is 0, which is not the required level.


    The next level (third bit by now) is editor_in_chief, inheriting editor and author.
    This means that bits 1 and 2 must be set in the editor-in-chief''s bit pattern,
    and we also set the second (2 to the next power, or 4): 1 | 2 | 4—this results
    in 7.'
