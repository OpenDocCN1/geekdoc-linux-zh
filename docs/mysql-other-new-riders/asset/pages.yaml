    # Project Layout


    The time arrives when 12-days, weekend toil, and gallons of coffee andt cola won''t
    be enough for a single developer to complete a project on time. For the average
    programmer, this is a significant break in life: No more lonely hacking on our
    own code, using that cool style only he can read, being his own boss, only turning
    up from coders'' underground from time to time to get a pizza.


    Now—no has to worry about standards, style, and project management. By maybe,
    as a reward, he can get back to normal working hours again, freeing some time
    for non-work-related things. Who knows, maybe he can start socializing again?


    # Team Collaboration


    The Internet introduced the capacity to communicate and work over long distances,
