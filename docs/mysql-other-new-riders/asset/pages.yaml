  md: '# Chapter 7 Cutting-Edge Applications


    This application uses Expat to collect statistical data about an XML document.
    For each element, it prints a bunch of information:


    +   - How many times it occurred within the document

    - How much data was found within this element

    - All parent elements encountered

    - All child elements


    To achieve this, the script needs at the very least to know the parent element
    for the current element. This is not possible using the normal XML parser—you
    only get events for the current element, no contextual information is recorded.
    Thus we needed to set up our stack structure. We used a FIFO stack (First In,
    First Out) with two elements, to give you a better example of keeping element
    nesting within a data structure, we voted for a FILO (First In, Last Out) stack.
    which is a normal array; holds currently open elements. In the open-element handler,
    the element is pushed on to the stack using array_push(). Accordingly, the end-element
    handler function removes the element with array_pop().


    A note on array_pop() and array_push(). These and many other functions dealing
    with arrays have been added only in PHP 4.0. We wanted to port them over to PHP
    3.0, but it is difficult to implement them efficiently in native PHP (to backport
    to PHP 3.0) because of the unset() works. To pop an element off the stack, you
    would use a snippet like this:


    ```

    unset($array[count($array) - 1]);

    ```


    If this would work, it would be trivial to implement array_pop()—however it doesn''t
    work. With PHP unset() leaves leaves in the array—it doesn''t reset the "index
    counter". You can easily verify this:


    ```

    $array = array(''*'');

    unset($array[0]);

    $array[] = ''*'';

    var_dump($array);

    ```


    The element will now have the key 1, instead of the expected 0. This leads to
    fragmented arrays—unsuitable for a stack. This behavior has reasons. If the hole
    was eliminated, the array would need to be reorganized, which would be undesirable
    in many situations. To work around this problem, we''d need an array_compact()
    version—which doesn''t exist in PHP at the time of the writing. The only conclusion
    to draw is: Use PHP 4.0. In the PHP 3.0 implementation of the example (see the
    CD-ROM), we had to use $depth variable to keep track of the element nesting manually.
    This introduces another global variable and is not as elegant as array_pop() and
    array_push(), but it works.'
  merge: -1
