    \ This method splits one Text node into two, which can be useful for rearranging\
    \ content\n\n# CDATASection\n\nThe CDATASection inherits the Text interface (and\
    \ with the CharacterData interface) and holds the CDATA section.\n\n# Notation\n\
    \nThis node represents a notation declared in the document type declaration.\n\
    \n# Basic Interfaces\n\nAll objects inherit the Node interface, which is the primary\
    \ datatype for the DOM. It represents a single node in the document tree structure.\
    \ The Node interface defines attributes and methods you'll use most often when\
    \ dealing with the DOM. To traverse a node, for example, you would use the childNodes\
    \ attribute containing all children and the nextSibling attribute containing the\
    \ next node on the same level. Methods like addChild() and removeChild() can be\
    \ used to alter the tree structure.\n\nThe only objects not derived from a Node\
    \ interface are CDATASection, Text, and Comment. Text and comment are derived\
    \ from the CharacterData interface; CDATASection inherits Text. The CharacterData\
    \ interface extends Node with a set of attributes and methods for accessing character\
    \ data. For example, you can use substring() to extract part of the character\
    \ data.\n\n# Example: Analyzing a Short Document with the DOM\n\nThe easiest way\
    \ to get an idea about the concrete implementation of the DOM is by showing how\
    \ a XML document would be handled by a DOM-compliant processor. Let's create a\
    \ short book document:\n\n```\n<?xml version=\"1.0\"?>\n<!DOCTYPE book SYSTEM\
    \ \"docbook.dtd\">\n<book>\n  <title>\n    Cutting-Edge Applications\n  </title>\n\
    \  <para language=\"en\">\n```"
