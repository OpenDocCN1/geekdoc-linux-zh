  md: '# Interfacing the Network 103


    After doing initialization and setup, the application has to surrender control
    to phpIRC. phpIRC then enters its main loop and waits for something to happen.
    During setup, the application has to register callbacks for each event it wants
    to process (for example, incoming private messages, incoming server messages,
    and so on). These callbacks are the only possibility for the application to regain
    control. phpIRC dispatches all events to functions that have registered themselves
    with the library. These functions can in turn another idle loop in phpIRC to wait
    for another event to happen, or can use phpIRC''s API to perform certain actions
    on the network (send private messages, join/leave channels, and so on).


    This very layout already allows for downstream communication, which means that
    phpIRC is able to receive messages from other users. People could actually “talk”
    to your script.


    > Note: Downstream mean from the network to the user. Upstream is the opposite,
    from the user to the network.


    Exercise for the Reader

    Structure a downstream interface that makes use of phpIRC''s features. Implement
    it on paper to become familiar with phpIRC''s API. Then build a simple downstream
    interface that loads onto IRC and displays messages from a specified channel.


    # Downstream Communication


    Since chatting is a real-time task, meaning that it happens as you do it and causes
    instant replies, we don''t want to introduce latency into the interface. Latency
    describes the reaction time of the interface; for example, the time from when
    the reader presses the Enter key to submit a message until it shows up in the
    chat window. Even though a latency of less than a second may objectively be a
    very short wait, it seems extremely and annoying to the user. Early, incoming
    messages must be displayed at once (or at least soon as possible). HTTP is a stateless
    protocol, however, doesn''t allow instant updates of pages without reloading a
    complete document. Of course, there are multipart documents and automatic refreshes,
    but these options introduce a very nasty flicker each time the page loads again,
    require database buffering for output, and introduce lag because of constant connects
    and data transfer from the Web server.


    One solution is “streaming HTML”, something that''s not officially supported anywhere,
    but worthless: the script does the interface output simply idles in an endless
    loop and doesn''t terminate the HTML page the browser is viewing. When something
    has to be sent to the user, it''s printed and immediately flushed from the server''s
    buffers. This way, the browser is constantly rendering and always displays the
    most up-to-date data. One problem persists in this approach, however; no complex
    entities can be rendered on the fly. For example, you can''t output the rows of
