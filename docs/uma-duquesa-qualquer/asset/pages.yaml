- pgno: 83
  md: 'Primeiro ele desamarrrou a fita que a prendia no cotovelo, depois começou a
    soltar a dúzia de botõezinhos que se estendiam do cotovelo ao punho. Fechá-los,
    no início daquela noite, tinha exigido dez minutos de muita dedicação de Fleur,
    a camareira francesa.


    Ele os soltou em dez segundos.

    – Algo me disse que você já fez isso antes – Pauline comentou, arqueando as sobrancelhas.

    – Uma ou duas vezes.

    Ou mil, ela imaginou.

    Ele segurou o punho dela e levantou a mão até a boca, pegando o dedo médio da
    luva com os dentes. Então ele a puxou lentamente.

    O movimento foi sensual, hipnotizador até. Quando ficou com a mão livre, Pauline
    não soube o que fazer com ela.

    – Oh. Isso. – Ela colocou a mão entre eles, explorando o lugar em que o botão
    dele se encontrava com a costura de seu corpete. Ao toque, a situação parecia
    desesperadora. As tentativas de Pauline fazer uma avaliação visual eram frustradas
    por seu peito inflado artificialmente, que lhe obstruía a visão.

    – Eu conseguiria enxergar melhor se não fosse por este espartilho ridículo – ela
    disse.

    – Também sou bom em tirar espartilhos.

    Pauline lhe deu um olhar de repreensão, mas ele não viu. Griff estava ocupado
    demais encarando os seios dela com seu olhar escaldante.

    – Ra-ram – ela pigarreou.

    – Desculpe. Sou homem. Esse tipo de coisa nos distrai.

    Ela corou, satisfeita, embora se esforçasse para não se sentir assim. Homens podiam
    se distrair com facilidade, mas era raro que fosse Pauline a distraí-los.

    – Que bom, então, que eu ainda tenho um pouco de concentração – ela disse. – Você
    precisa tirar o casaco. Assim vai ficar com as duas mãos livres. E se mesmo assim
    não conseguirmos soltar o botão, posso esperar aqui enquanto você vai buscar uma
    tesoura ou faca.

    – Eu sabia que podia contar com sua inteligência.

    Ele tentou desvencilhar o braço do casaco, mas não teve sucesso. A manga era justa,
    e o braço dele não era magro.

    – Preciso do meu criado para fazer isto.

    – Deixe que eu lhe ajudo. Sou uma criada, afinal.

    – Segure o punho. – Ele estendeu a mão para ela.

    Ela obedeceu e eles começaram a segunda dança absurda da noite: o duque ondulando
    o braço enquanto ela tentava segurar a manga – enquanto se preocupava em não deixar
    que o outro punho dele se soltasse e destruísse seu corpete. Toda vez que ele
    puxava o braço, também trazia Pauline para frente. Eles ficaram rodando em um
    círculo pequeno e inútil. Se a primeira valsa deles foi uma variação húngara,
    esta devia vir da Lua.

    – Eu deveria trocar meu alfaiate por um menos preciso – ele grunhiu.

    – Eu poderia tentar soltar pelo outro lado.'
