- pgno: 64
  md: 'algumas amostras. Vou chamar Fleur e iremos vesti-la.

    – Que maravilha, Vossa Graça.

    O entusiasmo de Pauline foi parar no carpete. Dois minutos depois de começar a
    se despir, na noite anterior, ela percebeu que não se dava bem com Fleur. Ou melhor,
    Fleur não se dava bem com ela.

    A camareira tinha cabelo dourado e olhos azuis de centáurea, e entrou flutuando
    pelo quarto como um floco de neve. Perfeita, clara e fria.

    – Humpf! – Fleur exclamou. Esse era um som muito francês e não parecia muito elogioso
    ao rosto, ao cabelo, à roupa ou à personalidade de Pauline.

    O cocheiro e o criado dos Halford presenciaram tudo em Spindle Cove, e Pauline
    sabia como a fofoca passava rapidamente de um empregado para outro. A essa altura
    todos sabiam que ela era uma simples garota de fazenda, que não merecia a atenção
    da camareira de uma lady. Claro que os criados ficariam ressentidos com ela, pelo
    trabalho extra que estava fazendo.

    Fleur desembruhou uma série de caixas, de onde tirou várias roupas de baixo e
    três vestidos quase idênticos.

    – São todos brancos – Pauline disse.

    – É claro que são brancos – a duquesa respondeu.

    Nunca, em toda sua vida, Pauline tinha usado um vestido branco. Talvez nem mesmo
    em seu próprio batizado. Branco era a cor das ladies, porque só elas conseguiam
    manter limpo um vestido branco. Se ela tivesse feito a tolice de costurar um vestido
    claro para si, em casa, a peça teria ficado cinza em três lavadas. Tirando aventais
    e meias, tudo que ela possuía era marrom ou azul-escuro.

    Não mais. Primeiro ela foi coberta com uma roupa de baixo branca como a neve,
    depois foi apertada quase até a morte por um espartilho. A duquesa escolheu o
    mais simples daqueles vestidos: um modelo matinal com cintura alta e camadas de
    musselina transparente. Fleur o ergueu sobre a cabeça de Pauline. O tecido claro
    desceu como uma nuvem, envolvendo-a em uma beleza etérea. Ela observou seus braços,
    tão bronzeados e sardentos comparados com a musselina imaculada. A duquesa avaliou
    Pauline com um olhar de cima a baixo.

    – Que bom que serviu nos ombros. É ótimo que você seja esbelta.

    Esbelta? Pauline pensou que aquela era uma forma generosa de descrever seu corpo.
    A duquesa a tinha elogiado.

    Depois de remexer na cintura folgada do vestido por alguns momentos, Fleur pegou
    uma faixa verde-jade e a passou pela cintura de Pauline, amarrando-a apertado
    e fazendo um laço nas costas.

    – Humpf. – Dessa vez, Fleur pareceu satisfeita.

    – Sim, muito melhor – a duquesa concordou. – O que podemos fazer com o cabelo
    dela?

    Não muita coisa, pareceu ser a opinião de Fleur.

    Depois que o cabelo de Pauline foi penteado e preso em um coque simples, ela ficou
    encarando um reflexo nada familiar no espelho da penteadeira. Nenhum fio de cabelo
    fora do lugar, nenhuma mancha na renda de seu vestido.'
