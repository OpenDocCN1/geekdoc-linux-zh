- pgno: 217
  md: '# Nota da autora


    O poema que Pauline cita é “O armário de cristal”, de William Blake.


    O Hospital dos Abandonados era uma instituição real em Londres. Embora hoje nós
    usemos a palavra “hospital” para lugares que tratam de doentes, na época a palavra
    se referia apenas a um lugar seguro. Era um lar para crianças abandonadas por
    mães solteiras. Visitar o Hospital dos Abandonados era uma forma de caridade popular
    para cavalheiros e ladies da época; contudo, essas visitas normalmente se limitavam
    a observar as crianças no refeitório e, às vezes, dar-lhes doces.


    Algumas leitoras podem estar imaginando qual seria a explicação médica por trás
    de partes da história. Por que todos os irmãos de Griff morreram bebês? Seria
    algum tipo de doença hereditária? Em caso positivo, ele e Pauline não estariam
    arriscando uma série de tragédias em seu futuro?


    Embora o ambiente histórico não me permita inserir a explicação médica na história,
    eu a escrevo com a ciência em mente.


    O problema com os pais de Griff era a incompatibilidade de Rh. A complicação ocorre
    em mulheres que têm sangue Rh-negativo, mas que concebem crianças com um parceiro
    Rh-positivo. O primogênito (Griff, neste caso) pode nascer com a saúde perfeita,
    mas o corpo da mãe fica “sensibilizado” para futuras gestações e irá tratar o
    feto Rh-positivo como uma ameaça. Essas gestações podem resultar em abortos, natimortos
    ou bebês que nascem muito fracos para sobreviver.


    Felizmente, a medicina moderna compreende esse problema. Os médicos pedem exames
    de sangue dos futuros pais para determinar seu Rh e, assim, prevenir a incompatibilidade.
    Quanto a esta história, as leitoras podem ficar tranquilas de que, como Pauline
    é Rh-positivo (assim como a grande maioria das mulheres), não existe motivo pelo
    qual ela e Griff não possam ter tantos filhos saudáveis e felizes quanto quiserem.'
  merge: -1
  img_proc: true
