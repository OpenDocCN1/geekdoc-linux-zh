- pgno: 55
  md: '– Oh, Vossa Graça. Você é brilhante.

    Griff se recostou na cadeira, espantado. Nunca, em toda sua vida, alguém tinha
    dito isso para ele. A não ser em uma cama.

    – Em que sou tão brilhante, afinal?

    – Uma biblioteca circulante cheia de livros obscenos. É disso mesmo que eu preciso!
    Quero dizer, nem todo livro deve ser obrigatoriamente escandaloso, mas muitos
    deles devem ser. Em casa, as moças podem ter todos os livros decorosos que quiserem,
    não é? Elas vão a Spindle Cove para quebrar as regras.


    Griff lembrou das moças naquela taverna, arrancando, alegres, páginas de um livro
    de etiqueta, com as quais faziam adornos para bandejas de chá. Sim, dava para
    imaginar que romances tórridos e panfletos radicais pudessem fazer sucesso em
    um lugar desses.


    E por fazer uma sugestão impensada, agora ele seria responsável por induzir à
    perdição toda uma vila de solteironas. Aquilo com certeza representava um ponto
    alto ou baixo em sua vida. Exatamente qual, ele não estava certo.

    – Onde estão os obscenos? – Ela inclinou a cabeça para trás, espiando nos recantos
    mais inacessíveis da sala. – Imagino que estejam em uma prateleira alta. Ou você
    tem um armário trancado em algum lugar?


    Ele riu.

    – Se minha biblioteca tivesse uma seção secreta constituída de livros inadequados
    para jovens damas, você não poderia esperar que eu lhe dissesse onde está.

    – Por que não? Eu não sou uma lady. Nem sou tão inocente.

    Não diga isso.

    – Está muito tarde, Simms.

    – Muito cedo, na verdade.

    – Basta dizer que está muito escuro. E você não está muito vestida, e estamos
    a sós. – Se, além disso, os dois começassem uma busca por literatura erótica...?
    Aquela camisola fina dela não sobreviveria por muito tempo. – Não tenho impulsos
    nobres, lembra?

    Ela ficou corada.


    – Pode me ajudar a fazer uma lista, pelo menos?

    Ele tamborilou os dedos na escrivaninha.

    – Moll Flanders, Fanny Hill, O monge, uma boa tradução de l’École des Filles.
    Esses já são um bom começo.

    – Pronto – ela disse e fechou os olhos.

    – Você não quer anotar?

    – Não preciso. Tenho uma boa memória.


    Ela se inclinou bastante para um dos lados enquanto vasculhava a prateleira, parecendo
    flutuar acima dele. A sombra nubil da silhueta dela quase deixou Griff ofegante.
    Sim, ele já tinha lido sua quota de livros obscenos, e nenhum deles o afetou tanto.
    Ele ficou duro como a mesa de mogno.

    – Arrá! Aqui está um que vou levar para cama comigo. – Ela tirou um livro da prateleira.
    – Métodos de contabilidade e escrituração.

    – Esse deve ser bom para lhe dar sono. – Ele riu. – Mas é uma boa ideia. Mantenha
    excelentes registros escritos, ainda que você tenha boa memória. Não aceite crédito.
    Se'
