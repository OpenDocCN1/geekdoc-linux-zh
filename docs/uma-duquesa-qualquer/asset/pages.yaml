- pgno: 9
  md: 'Pauline conseguiu distinguir duas cabeças muito loiras do outro lado do balcão.
    Sally Bright estava ocupada com as freguesas e seu irmão mais novo, Rufus, entrava
    e saía do estoque. Felizmente, Pauline e Daniela eram amigas da família Bright
    desde sempre, e assim não precisavam ser atendidas na loja.


    – Ponha os ovos de lado – Pauline disse à irmã. – Eu vou buscar a esponja e o
    novelo no estoque. Você pega duas medidas de groselha e uma de alúmen.


    Daniela colocou a cesta de ovos vermelhos com cuidado sobre o balcão e foi até
    uma fileira de barris. Seus lábios se moviam enquanto procurava o rótulo GROSELHAS
    em um deles. Então ela franziu a testa, concentrada, ao despejar duas medidas
    em um cone de papel pardo.


    Depois de ver que a irmã estava cumprindo a tarefa, Pauline pegou os outros itens
    necessários no estoque. Ao voltar, Daniela a esperava com os produtos nas mãos.


    – Alúmen demais... – Pauline disse, conferindo. – Era para ser só uma medida.

    – Ah. Ah, não.

    – Está tudo bem – ela disse com a voz calma. – É fácil de consertar. Ponha o excedente
    de volta.


    Pauline torceu para que a irmã não reparasse na expressão de deboche da Sra. Whittlecombe.


    – Não sei se vou continuar a fazer minhas compras nesta loja – a velha disse –,
    onde permitem que garotas abobalhadas fiquem atrás do balcão.


    Sally Bright deu um sorriso sarcástico para a mulher.

    – Só nos diga quando podemos parar de manter seu láudano em estoque, Sra. Whittlecombe.


    – É apenas um tônico para a saúde.

    – É claro que sim – Sally disse, seca.


    Pauline foi até o livro-caixa para registrar suas compras. Ela adorava essa parte,
    quando virava as páginas lentamente, demorando-se para examinar as anotações e
    cálculos de Sally. Algum dia ela teria sua própria loja e cuidaria dos seus livros-caixa.
    Esse era um sonho que ela não tinha contado para ninguém, nem para sua melhor
    amiga, era apenas uma promessa que ela recitava para si mesma, quando as horas
    de trabalho na fazenda e na taverna pesavam em seus ombros... Algum dia.


    Pauline encontrou a página correta. Depois do crédito que receberam por trazer
    os ovos, só deviam seis pence pelo resto da compra. Ótimo.


    Blam. Ela rapidamente levantou a cabeça, assustada.

    – Minha nossa, garota! Que diabos está fazendo? – A Sra. Whittlecombe bateu no
    balcão de novo.


    – Eu... eu estou de-devolvendo o alúmen – Daniela gaguejou.

    – Isso n-não é al-alúmen – a mulher debochou do jeito de falar de Daniela. – É
    açúcar.

    Oh, saco. Pauline franziu a testa, sabendo que ela mesma deveria ter feito aquilo,
    mas queria tanto que a irmã mostrasse para a bruxa velha que era capaz... Agora
    a bruxa velha ria, triunfante. E, confusa, Daniela sorriu e tentou rir junto.


    Pauline sentiu um aperto no coração pela irmã. Elas só tinham um ano de idade
    de diferença, mas eram tantos de entendimento! De todas as coisas que eram mais
    difíceis'
