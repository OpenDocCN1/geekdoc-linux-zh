  md: '– É muito mais refinado sequestrar o filho e então instigar uma farsa, durante
    uma semana, com uma atendente de taverna. É isso?


    Ela tinha certeza de que o duque iria sorrir disso, mas não. O olhar dele agora
    queimava na pele dela, como a luz do sol através de uma lente.


    – Não sei se gosto de fleuma. – Ela pegou outro bocado de comida, para falar,
    de propósito, com a boca cheia. – Na verdade, tenho certeza de que não gosto.


    – Pela última vez, Srta. Simms, isso não é um prato à mesa, que pode ser aceito
    ou recusado. Se você vai aprender a ser uma duquesa, fleuma é uma exigência.


    – Então veremos quem desiste primeiro.


    – Eu nunca desisto. Uma duquesa tem gente para desistir por ela.


    Pauline meneou a cabeça. Aquela semana seria um desafio, mas divertido, pelo menos.
    A duquesa tinha um senso de humor. Contudo, a mulher subestimava Pauline se achava
    que conseguiria intimidiá-la.


    Oh, ela sabia que o orgulho era forte entre os Halford. Na carruagem tinha ouvido
    sobre a ascendência da família. Extensivamente. Sem dúvida, uma duquesa nascida
    de gerações de riqueza, casada com uma linhagem ainda mais nobre, acreditaria
    ser indômita. Mas Pauline tinha conquistado sua teimosia lutando duro por ela
    a cada dia. Ao fim daquela semana estava a perspectiva de uma vida nova, independente.
    Ela não seria desviada desse objetivo. Nem mesmo por uma duquesa. Fosse no inferno
    ou na alta sociedade, ela ganharia aquelas mil libras.


    Por fim, eles acabaram se dedicando ao jantar. Quando terminaram, os criados removeram
    os pratos salgados da mesa e os substituíram por uma variedade de frutas e queijos.
    Uvas, ameixas, nectarinas. Pauline viu uma sobremesa que lhe deu água na boca:
    camadas de framboesas, pão de ló, creme batido, tudo visível na travessa de vidro.
    E então, completando aquela abundância avassaladora de doces, o criado pôs diante
    dela uma escultura de manjar branco. O fôlego abandonou seu corpo, deixando-a
    apenas com uma dor aguda.


    Oh, Danny. A onda de saudades de casa a invadiu com uma força tão violenta que
    ela não aguentou mais, nem por mais um momento. Ela afastou a cadeira da mesa
    e saiu dali, correndo na direção das escadas.


    Aquilo foi um erro. Ela precisava ir embora. Precisava ir para casa. Quantos quilômetros
    eles tinham viajado? Vinte e cinco? Trinta? Ela estava de barriga cheia e o tempo
    estava bom. Se começasse agora, chegaria em casa andando ao raiar do dia.


    – Srta. Simms? – a voz do duque ecoou no poço da escada, detendo-a no patamar.
    – Está se sentindo mal?


    – Não – ela disse, enxugando apressadamente os olhos antes de se virar para ele.
    – Não, estou bem. Perdoe-me por sair da mesa daquele jeito.


    Passos lentos o conduziram escada abaixo.


    – Não precisa se desculpar. Foi o ponto máximo de uma exibição perfeita de mau
    comportamento. Parabéns. Mas minha mãe ficou preocupada com sua saúde.


    – Estou bem, mesmo. Foi só o manjar.


    – O manjar? – Ele franziu a testa. – Eu acho essa coisa nojenta, mas nunca me
    fez derramar lágrimas.'
