- pgno: 196
  md: 'Pauline não estava tão segura quanto ao “sucesso”. Ela ainda duvidava que pudesse
    participar de um evento desses.


    Mas depois dessa noite, ela poderia voltar para casa com seu orgulho. Ninguém
    diria que ela não teve coragem de tentar.


