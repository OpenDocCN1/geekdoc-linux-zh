- pgno: 58
  md: 'tinha-o preparado para esse momento especial. Para essa garota especial, que
    precisava que Griff impedisse sua queda.

    – Eu não conseguiria ver você se machucar – ele disse, sem entender nada.

    – Eu pensei que você não tivesse impulsos nobres.

    – Acredite em mim – ele a encarou no fundo dos olhos e disse, sem qualquer sensualidade
    ou ironia –, não tenho.

    Se ele possuísse um pingo de decência, já a teria largado momentos atrás. Malicioso
    como era, Griff adorou o modo como ela se pendurava em seu pescoço. Como se o
    mundo ao redor deles fosse um deserto imenso e gelado, e o calor do corpo dele
    fosse a única chance que ela tinha de sobreviver. Foi tão fácil acreditar, naquele
    momento, que Simms precisava dele. Que precisava de seu toque, de sua boca, de
