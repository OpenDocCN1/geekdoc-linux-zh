- pgno: 20
  md: 'Uma vibração de risadas abafadas passou pelo salão. A expressão de constrangimento
    aristocrático no rosto da duquesa foi imensamente satisfatória. Qualquer que fosse
    o jogo insensível e obstinado que aquele duque e sua mãe estavam jogando, eles
    tinham acabado de encontrar em Pauline a terceira jogadora. E mais: Pauline iria
    vencer.


    Virando os olhos para o duque, ela o inspecionou sem nenhum pudor. Isso não foi
    problema, o homem era mesmo um belo espécime masculino, dos ombros largos às coxas
    esculpidas. Se ele podia examiná-la, por que ela não podia fazer o mesmo? – Minha
    nossa – ela empurrou seu sotaque caipira mais carregado enquanto inclinava a cabeça
    para admirar a curva do traseiro aristocrático dele. – Vou me divertir muito com
    você na noite de núpcias.


    Os olhos dele chisparam por um breve momento, mas o bastante para fazer com que
    ela se contraísse por dentro. Provocar um duque seria um crime punível com enforcamento?
    Com toda certeza ele possuía os meios e o poder para fazê-la se arrepender disso.
    Mas quando todas as jovens de Spindle Cove irromperam em uma gargalhada violenta,
    Pauline soube que tudo iria ficar bem. Ela não era da turma de Spindle Cove, era
    uma empregada, não uma jovem aristocrata que passava uma temporada ali. Ainda
    assim, as outras ficariam do lado dela.


    A Srta. Charlotte Highwood se levantou e falou em defesa dela: – Vossas Graças,
    estamos honradas com a visita, mas não podemos ficar sem Pauline hoje.


    – Então nós temos um conflito – o duque disse –, porque não pretendo ficar longe
    dela.


    A determinação sombria nas palavras dele fez com que sensações estranhas agitassem
    Pauline. Ele pretendia continuar com aquela farsa? A teimosia devia ser tão prevalente
    na família do duque quanto nos olhos verdes dela.


    A duquesa inclinou a cabeça na direção da porta. – Muito bem, então. A carruagem
    está esperando.


    E foi assim que Pauline Simms, atendente da taverna e filha de um agricultor,
    se viu levando um duque e a mãe dele para tomar chá em casa. Bem, e por que diabos
    não? Se aqueles aristocratas queriam constrangê-la na frente de toda Spindle Cove,
    era justo que sacrificassem um pouco de seu próprio orgulho. Estava ansiosa para
    ver a cara da duquesa quando parassem em frente à casa humilde de sua família.
    Poderia fazer bem para eles saber como pessoas comuns vivem – sentando em banquetas
    rústicas e bebendo chá em louça lascada. Ela e Sally Bright ririam dessa história
    pelo resto de suas vidas.


    Depois de passar instruções ao cocheiro, Pauline se juntou aos dois dentro da
    carruagem. Ela passou a mão pelo assento de couro de vitelo, maravilhada. Nunca
    tinha tocado um vitelo de verdade, que fosse assim tão macio.


    Ela teve certeza de que nunca alguém da classe dela andou como passageiro dentro
    daquele veículo. A julgar pela forma como o duque e a duquesa cerravam os lábios,
    nenhum dos dois estava contente por ter a companhia de uma atendente de taverna
    coberta de açúcar e com botas enlameadas. E isso só serviu para deixar Pauline
    ainda mais decidida; ela iria extrair até a última gota de diversão daquela experiência.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'Durante a viagem de dez minutos até a casa na fazenda, ela se divertiu comportando-se
    de modo impróprio. Pulou no assento, testando as molas; brincou com o fecho da
    janela, subindo e descendo o vidro uma dúzia de vezes.


    – O que o seu pai faz, Srta. Simms? – a duquesa perguntou.

    Além de gritar, xingar, ficar furioso e fazer ameaças?

    – Ele é agricultor, Vossa Graça.

    – Um arrendatário?

    – Não, ele é dono da terra. Cerca de dez hectares.


    É claro que dez hectares não representavam nada para um aristocrata dono de terras,
    e menos ainda para um duque. Era provável que Halford tivesse mil vezes isso.


    Quando a carruagem saiu da vila, eles passaram pelo campo dos Willet. O filho
    mais velho do Sr. Willet estava trabalhando na plantação de lúpulo. Pauline baixou
    a janela pela décima-terceira vez, pôs o braço para fora e acenou com alegria.
    Então colocou o polegar e o indicador na boca e assobiou alto.

    – Gerry! – ela chamou. – Gerald Willet, olhe! Sou eu, Pauline! Vou ser uma duquesa,
    Ger!


    Quando se acalmou dentro da carruagem, viu que o duque e a mãe trocaram um olhar.
    Ela apoiou o cotovelo na janela, cobriu a boca com a mão e riu.


    Ao se aproximarem da casa, Pauline bateu no teto da carruagem para avisar o cocheiro,
    e quando a carruagem parou, estendeu a mão para a maçaneta da porta.

    – Não. – Com o cabo em forma de gancho da sombrinha, a duquesa a segurou pelo
    pulso. – Temos gente para fazer isso.

    Pauline congelou, aturdida. Ela era uma das pessoas que faziam esse tipo de coisa,
    ou a velha tinha se esquecido?


    O duque afastou a sombrinha.

    – Pelo amor de Deus, mãe. Ela não é uma ovelha desgarrada.

    – Você a escolheu, e me disse para fazer dessa jovem uma duquesa. As lições já
    começaram.


    Pauline deu de ombros. Já que a mulher insistia, ela podia esperar e deixar que
    o criado abrisse a porta, baixasse o degrau e a ajudasse a descer com suas luvas
    brancas.


    Depois que a duquesa apeou, seguida pelo filho, Pauline fez uma mesura exagerada.

    – Bem-vindos a nossa humilde casa, Vossas Graças.

    Ela abriu o portão e os conduziu pelo quintal. No mesmo instante, o ganso foi
    atrás deles, grasnando e batendo as asas. Ninguém conseguiria convencer Major
    de que ele não era superior a um duque. A duquesa tentou congelar a ave com o
    olhar, mas logo recorreu à sombrinha como arma de defesa.

    – Chega, Major! – Pauline bateu as mãos e levou os convidados para dentro da casa.
    – Por aqui, Vossas Graças. Não fiquem acanhados. Nossa casa é sua. Somos todos
    uma grande família, agora.


    A verga da porta era baixa e o duque, alto. Ele teria que se abaixar para não
    bater a cabeça. Ele parou antes da soleira. Por um momento, Pauline pensou que
    o duque daria meia-volta e retornaria para a carruagem, em direção à Londres.
    Mas não. Ele se curvou e passou pela entrada com um movimento primoroso.'
