- pgno: 77
  md: 'Pauline obedeceu, embora sentisse vontade de chutar para longe aqueles sapatos
    malvados e voltar para seu quarto.

    – Pare de pensar nos seus pés. Imagine que há um cordão amarrado no seu umbigo
    – a duquesa aconselhou. – Agora deixe que ele a puxe para frente.

    Incrível. Embora a sugestão da duquesa parecesse simples, funcionou. Quando Pauline
    se concentrou no meio do corpo, todas as outras partes se encaixaram. Seus pés
    se moveram um após o outro, e seus ombros ficaram naturalmente retos. Ela se sentiu
    mais alta e confiante. Flutuando.

    Quando se aproximaram da escadaria, ela sentiu um nó no estômago. Sua cabeça produziu
    uma visão – a mais tola das fantasias, sem dúvida –, de que o duque estaria ao
    pé da escada, esperando por elas. Esperando por Pauline.

    Oh, ela esperava que ele estivesse lá. Esperava que ele ergue-se o rosto e a visse,
    e então a observasse, arrebatado, descer suavemente cada um daqueles vinte e quatro
    degraus, como se fosse uma névoa sedosa. Quando ela alcançasse o último degrau,
    ele pegaria sua mão e a beijaria com aqueles lábios fortes e apaixonados. E então
    ele sussurraria uma palavra só, reverente e contida: Perfeita.

    Era uma fantasia ridícula e completamente absurda. E ela queria tanto que acontecesse
    que mal conseguia respirar. Depois daquele encontro com o livreiro, mais cedo,
    bem que ela gostaria de uma nova injeção de confiança.

    Pauline chegou ao alto da escadaria. O duque não estava lá embaixo. Assim, ele
    não assistiu a Pauline rolar as duas dúzias de degraus, e quando enfim aterrissou,
    bruscamente, não houve beijos nem cumprimentos.

    Elas tiveram que esperar, socadas dentro da carruagem, com saias gigantescas e
    tudo mais, por dez minutos inteiros antes que ele, afinal, se juntasse a elas.

    – Francamente, Griff – a duquesa disse.

    Mas ele não se desculpou.

    – Eu precisava terminar uma carta.

    Ele olhou de relance para Pauline e depois virou o rosto para o lado. E assim
    acabavam as fantasias de arrebatá-lo com sua beleza radiante. No escuro do interior
    da carruagem, com a cabelo puxado para trás com força e todas aquelas anáguas
    enroladas a sua volta, era provável que ela parecesse um camundongo afogado em
    um prato de merengue.

    Dois minutos após partir da Casa Halford, a carruagem parou de novo.

    – Chegamos – a duquesa anunciou.

    – Sério?! – Pauline exclamou. – Nós poderíamos ter vindo andando.

    A duquesa só lhe deu um olhar, e Pauline não precisou de tradução. Duquesas não
    andam.

    Após aparecerem da carruagem, os três se juntaram a uma pequena multidão de pessoas
    bem-arrumadas que aguardavam em frente à porta da mansão.

    – O que está acontecendo? – ela sussurrou para o duque, tentando não olhar para
    a horda de pessoas elegantes. – Por que paramos aqui?

    – É um congestionamento. Estamos todos esperando ser anunciados pelo mordomo.

    – Ele vai me anunciar pelo nome?'
