    dados e conversando baixo, por um minuto inteiro. As pessoas começavam a reparar.
    Todo mundo os observava, principalmente as mulheres. Algumas pareciam estar com
    inveja, como se desejassem ser elas de braços dados com Griff. Mas outras tinham
    uma expressão possessiva, como se já tivessem frequentado a cama dele.

    Pauline teve certeza de que não importava a qual grupo essas mulheres pertenciam,
    todas adorariam vê-la sendo humilhada. E embora soubesse que esse era o objetivo
    da noite, isso seria...

    – Você não faria – ela disse.

    – Eu não faria – ele confirmou. – Quando eu arranco o vestido de uma mulher, prefiro
    estar a sós com ela. – Ele inclinou a cabeça na direção de um conjunto de portas
    do outro lado do salão de baile. – Vamos até o jardim para resolver isto.

    Com o braço apertado à mão de Pauline, ele começou a conduzi-la de volta através
    do salão que tinham acabado de atravessar. Contudo, dessa vez eles não conseguiram
    progredir sem entraves. Outros convidados os detinham, chamando o duque para uma
    palavrinha ou duas de conversa. Ou três ou quatro ou cinco.

    Pauline se limitou a respostas monossilábicas e sorrisos educados, tímidos, sem
    querer prolongar a conversa. O mais enlouquecedor foi que, quanto menos ela falava
    ou interagia, mais favorável era a reação das ladies e dos cavalheiros.

    – Você precisa parar com isso – Griff disse, afastando-a de duas irmãs tagarelas.

    – Parar com o quê?

    – Parar de ser recatada.

    – Só estou tentando ser breve – ela respondeu.

    – Sim, mas é aí que está errando. Não existe nada como o silêncio para fazer com
    que você caia nas graças de gente pretensiosa. Isso dá espaço para que as pessoas
    falem delas mesmas.

    – Halford! – Um cavalheiro de rosto vermelho apareceu do nada, detendo-os.'
