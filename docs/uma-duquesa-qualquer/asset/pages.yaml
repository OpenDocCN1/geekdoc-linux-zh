- pgno: 137
  md: '– O que o faz pensar que eu “banharia com meus favores” qualquer homem?

    – Perdão, Srta. Simms – ele disse, sério. – Não pretendia insinuar nada disso.

    Mentiroso. Ele pretendia dizer exatamente o que disse. Como se ele pudesse saber,
    só de olhar para ela – sem ter qualquer conhecimento de suas origens humildes
    –, que Pauline era aquele tipo de garota.

    O pior era que ele tinha razão, até certo ponto. Em sua juventude, ela não tinha
    guardado seus “favores” como devia. Mas Griff sabia e não a fazia se sentir diminuída
    por causa disso.

    Pauline olhou ao redor, desesperada para acabar com aquilo. Ela queria voltar
