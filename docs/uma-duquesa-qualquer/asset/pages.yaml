    – O quê?

    – Agora chega. – Griff apareceu do nada e os deteve no meio da dança. – Eu continuo.

    – Ora essa, Halford. – Delacre resistiu. – Deixe-nos terminar a dança. Estamos
    conversando.

    Griff agarrou o amigo pela lapela e o afastou de Pauline, baixando a voz para
    um rugido.

    – Eu disse que ela é minha.

    – Está bem. – Delacre levantou as mãos. – Ela é sua.

    Com uma pequena reverência – e um olhar desconfiado para Pauline –, Delacre desapareceu.

    Conforme Griff a pegava nos braços e entrava na dança, Pauline o encarou, estupefata.

    – Por que você nos interrompeu? Eu estava a ponto de provocar um desastre fantástico!

    Ele deu de ombros.

    – Decidi que não quero vê-la mergulhar na tigela de ponche. Alguém deu duro para
    fazer esse vestido que está usando. E para preparar o ponche. Para não mencionar
