- pgno: 68
  md: 'A duquesa a soltou, virou-se e pegou um colar de pedras roxo-claro e filigrana
    de ouro na bandeja forrada de veludo.


    – Esta é sua pedra: ametista – ela disse enquanto arrumava a joia no pescoço de
    Pauline. – Rara, majestosa, mas delicada o bastante para uma mulher jovem.


    Enquanto as pedras se moldavam às saliências e reentrâncias de sua clavícula,
    Pauline fitou o espelho, fascinada. A duquesa estava certa – a cor da ametista
    ficava bem nela. O tom de violeta destacava os dourados de seu cabelo e lançava
    uma sombra rosada nas faces. Mas podia ser que o rosado viesse de sua agitação.
    Ela mal podia acreditar que algo assim estivesse tocando sua pele.


    – Então meu filho lhe ofereceu mil libras – a duquesa disse. – Este colar, apenas,
    vale dez vezes isso.


    Santa... Dez. Mil. Libras. Dez vezes mil libras. O número um seguido de quatro
    zeros. Pendurado no pescoço dela.


    De repente, ela se sentiu tomada por um medo irracional e poderoso. O terror era
    tanto que ela não conseguia se mexer nem respirar. Se ela ousasse sequer mover
    a cabeça para um lado, a corrente podia se quebrar e toda aquela coisa inestimável
    cairia em uma fenda do assoalho – e nunca mais seria encontrada.


    – Tenha em vista o prêmio maior, minha garota – a duquesa disse.


    Pauline não pôde evitar de encarar a mulher grisalha pelo espelho. Estranho. Até
    então ela não pensava que a duquesa fosse louca.


    – Vossa Graça, isso não vai dar certo. – Ela apontou para seu próprio reflexo.
    – Eu não sou o que ele quer, muito menos o que precisa. Ele é o 8º Duque de Halford,
    e eu uma atendente de taverna. Completamente errada. Só me escute falando. Olhe
    para mim.


    – Não sou eu que preciso olhar para você. – A duquesa removeu o colar de ametista
    e o recolocou na bandeja, então gesticulou para Pauline levantar. – Venha. Nós
    vamos fazer uma experiência.


    Estupefata, Pauline levantou da cadeira e a seguiu. Elas desceram até o térreo
    e a duquesa a conduziu até um salão grande e aberto. Quando entraram no aposento,
    ela se virou para Pauline e pôs um dedo sobre os lábios, pedindo silêncio.


    Os tapetes tinham sido enrolados para as laterais do salão, e logo Pauline viu
    por quê. O aposento não era mais um salão de festas, mas uma espécie de ginásio.


    Bem no centro, o duque e um oponente mascarado se enfrentavam. Os dois homens
    vestiam calças estofadas e apertadas na coxa, um colete estofado e uma camisa
    branca aberta. Os dois empunhavam uma espada esguia e brilhante. Nenhum dos dois
    notou que elas entravam.


    – En garde – disse o homem mascarado.


    A resposta foi um clangor de espadas.


    Pauline observou os dois espadachins trocar golpes e fintas. A admiração a deixou
    sem fala.


    Enquanto o oponente usava um capacete com uma trama metálica para proteger o rosto,
    as feições do duque estavam visíveis. Ela podia admirar cada ruga de concentração,
    cada gota de suor na testa dele. O esforço fez com que o cabelo dele grudasse
    na cabeça, em cachos castanhos, e com que a camisa colasse no tronco.'
