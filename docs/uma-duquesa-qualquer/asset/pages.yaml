    – O sapato – ela disse, com a voz fraca.

    – Dane-se o sapato.

    Ela lhe deu razão. Que diferença fazia um sapato, quando ela tinha acabado de
    perder um colar que valia milhares de libras?

    Griff a carregou até o fim da rua, por um caminho diferente daquele que percorreram
