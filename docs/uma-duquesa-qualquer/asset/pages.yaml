    Incrível o que contorções acrobáticas e o desejo masculino podiam criar. Ele tinha
    quase se convencido de que beijar os lábios doces e suculentos dela era a coisa
    nobre a fazer. Quase. Mas não por completo.

    – Vou soltar você agora – ele disse.

    Ela concordou. E então ela colou os lábios nos dele. Com mil bênçãos e maldições...
    A garota o beijou.

    O beijo quebrou sobre ele como uma onda no mar agitado. Seus sentidos se abriram
    como comportas. Os lábios dela eram tão macios. Tinham gosto de framboesas. Ela
    cheirava a tecido de algodão seco ao sol. A pele dela era como um borrão exuberante
    de creme rosado, aos seus olhos estarcidos e ainda abertos.

    Mesmo quando o beijo terminou, seu choque doce ressoava em cada um dos nervos
    de Griff. Impulsos primitivos ecoaram.

    Mais. De novo. Agora. Desejo era um velho conhecido dele. O pulso acelerado, o
    gosto dela em sua língua, o repentino intumescimento no baixo-ventre... Ele conhecia
    muito bem todas essas sensações. Mas houve algo mais nessa tempestade de sentimentos.
    Um tamborilar profundo e contínuo na região do coração. Ela, o órgão sussurrou.
    Eu fico com ela. Essa parte era nova e aterrorizante. Brusco, ele a colocou de
    pé. Então se virou para o outro lado, esfregando a boca.

    – O que diabos foi isso?

    – Pensei que Vossa Graça teria mais experiência no assunto... Mas eu acredito
    que foi um beijo.

    – Isso não deveria ter acontecido. – Ele passou a mão pelo cabelo.

    – Não, não. Foi... foi bom.

    – Você chama isso de bom? – Ele se virou para encará-la.

    – Não. Bom, não. Foi mais algo como “oportuno”. – Ela engoliu em seco. – Você
    não pode negar que havia uma tensão crescendo entre nós. Eu pensei que o beijo
    poderia ajudar.

    – Ajudar... – Ele a encarou, sem acreditar no que ouvia.

    – Bem, agora acabou, como pode ver. – Ela se virou para o lado e deu de ombros.
    – Acabou. E é óbvio que não foi nada especial. Nós não temos que nos preocupar
    com qualquer atração.'
