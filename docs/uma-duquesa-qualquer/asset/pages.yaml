- pgno: 10
  md: 'para Daniela do que para outras pessoas – pronunciar palavras terminando em
    consoantes, subtrair de números maiores que dez –, crueldade parecia ser o conceito
    mais complicado para ela. O que era uma misericórdia na família de Amos Simms,
    o pai delas.

    – Não o açúcar refinado – Rufus Bright lamentou.

    Sally lhe deu um tapa na orelha.

    – Eu acabei de abrir o barril – ele disse, se desculpando e esfregando a orelha.
    – Estava quase cheio.

    – Bem, agora está todo estragado – disse, convencida, a Sra. Whittlecombe.

    – Eu vou pagar pelo açúcar – Pauline disse, e no mesmo instante ela se sentiu
    nauseada, como se tivesse engolido três quilos do produto. Açúcar branco refinado
    era muito caro.

    – Você não precisa fazer isso – Sally disse com a voz baixa. – Nós somos praticamente
    irmãs. Nós deveríamos ser irmãs de verdade, se meu irmão Errol tivesse algo na
    cabeça.

    Pauline meneou a cabeça. Ela tinha parado de sonhar com Errol Bright muitos anos
    atrás, quando se separaram, e não queria se sentir devedora dele.

    – Eu vou pagar – ela insistiu. – O erro foi meu. Eu mesma deveria ter feito isso,
    mas estava com pressa.

    E agora ela se atrasaria para o trabalho na Touro & Flor. Aquele dia ficava cada
    vez pior.

    Sally parecia angustiada, dividida entre a necessidade de faturar e o desejo de
    ajudar uma amiga.

    No canto, Daniela finalmente se deu conta das consequências de seu erro.

    – Eu ponho de volta – ela disse, retirando material do barril de açúcar e jogando
    no de alumên, molhando tudo com suas lágrimas. – Eu posso consertar.

    – Está tudo bem, querida. – Pauline se aproximou dela e retirou, com delicadeza,
    a medida de lata da mão da irmã. – Pode cobrar – ela disse para Sally, com firmeza.
    – Eu acho que tenho algum crédito no livro-caixa.

    Ela não apenas achava que tinha crédito. Ela sabia que tinha. Várias páginas depois
    da conta da família Simms, havia uma entrada singela, marcada apenas como PAULINE,
    que exibia o balanço exato de duas libras, quatro xelins e oito pence. Ao longo
    dos últimos anos, ela guardou e economizou cada moeda que pôde, confiando a guarda
    ao livro-caixa de Sally. Aquela era a coisa mais próxima de conta bancária que
    uma atendente de taverna como ela podia ter. Pauline vinha economizando para algo
    melhor para ela e para a irmã. Economizando para algum dia...

    – Pode cobrar – ela insistiu.

    Com alguns rabiscos da pena de Sally, quase todo o dinheiro desapareceu. Sobraram
    onze xelins e oito pence.

    – Eu não cobrei o alumên – Sally murmurou.

    – Obrigada. – Isso não ajudava muito, na verdade, mas já era algo. – Rufus, você
    poderia, por favor, acompanhar minha irmã até em casa? Eu estou atrasada para
    o trabalho, e ela está chateada.'
