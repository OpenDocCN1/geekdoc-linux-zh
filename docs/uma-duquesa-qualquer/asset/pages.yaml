- pgno: 135
  md: 'Delacre a conduziu na dança. Com aquele vestido rosa-corado, a figura esguia
    dela era um sonho. Griff desejou que ela estivesse se divertindo, pelo menos um
    pouco. Em um mundo mais justo, ela teria tido seu próprio baile de debutante,
    com dezenas de admiradores fazendo fila para pedir sua mão. Mas ele próprio poderia
    admirá-la o bastante por dezenas de homens. Ele não conseguia tirar os olhos dela.


    Os dançarinos fizeram uma volta e Griff viu o rosto dela de relance. Droga. Ele
