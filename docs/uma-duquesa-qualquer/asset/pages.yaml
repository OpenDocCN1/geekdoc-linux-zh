    – Oh, droga – ela disse. – Estão checando os nomes em uma lista.

    Aquela notícia não era boa. Pauline sabia que estava nessa lista no começo da
    semana, mas com a fofoca de hoje, sem dúvida tinha sido removida. Ou talvez tivessem
