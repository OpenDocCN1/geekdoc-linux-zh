  md: '– Sagrada – ela leu em voz alta. – Abençoado. Todo-poderoso.

    Com o canto do olho, ela notou uma figura familiar entrando na sala.

    – Oh, inferno.

    Griff. Tantos impulsos a tomaram. Ela queria voar até ele, abraçá-lo, sacudi-lo,
    beijá-lo, derrubá-lo no tapete. Não sabia nem como olhar para ele sem revelar
    tudo. Mas ela não precisava se preocupar, a duquesa ficou muito assustada para
    reparar na reação de Pauline.


    A mulher se colocou de pé num salto. Aquela ratazana cinza horrenda continuava
    pendurada nas agulhas de tricô, e ela não tinha onde escondê-la.

    O duque franziu a testa para a mãe, depois baixou os olhos para o tricô.

    – O que diabos é isso?


    Uma pergunta muito boa – que, Pauline esperava, a duquesa finalmente respondesse
    com sinceridade.

    – Isto? – a duquesa perguntou.

    – Sim. Isso.

    – Vou lhe dizer exatamente o que é. – Ela levantou o queixo e se virou para Pauline.
    – É um trabalho manual indesculpavelmente ruim. Muito ruim mesmo, Srta. Simms.
    Eu esperava mais de você! – Ela jogou o bolo inteiro de lã dentro do fogareiro.


    Pauline revirou os olhos e se voltou para a Bíblia.

    – Hipócrita – ela pronunciou com dicção perfeita.

    Ignorando-a, a duquesa alisou o vestido com as mãos.

    – Bem, o que você quer? – ela perguntou ao filho.

    – Eu preciso lhe contar uma coisa.


    O peito de Pauline se encheu de esperança. Talvez ele tivesse mudado de ideia,
    ao entender o benefício de revelar seus segredos dolorosos e aliviar assim o coração.
    Ela levantou o rosto da Bíblia e deu um olhar encorajador para ele. _Por favor.
    Você vai se sentir tão mais leve._

    Mas ele nem se virou para ela.


    – Eu mandei suas ametistas para o joalheiro consertar – ele disse, calmo, para
    a mãe. – O fecho quebrou enquanto a Srta. Simms estava usando, noite passada.

    Pauline soltou a respiração, frustrada. Lá se ia a esperança de sinceridade.

    A duquesa apertou os olhos, que se transformaram em duas fendas de desconfiança.

    – Quebrou?

    – Sim. – Ele virou um botão no punho do casaco. A calma ducal estava em ótima
    forma nesta manhã. – Você o terá de volta em alguns dias.


    Claro que sim, Pauline pensou. Tão logo o joalheiro tivesse tempo de recriar a
    peça inteira, nos mínimos detalhes, para que a duquesa não percebesse nenhuma
    diferença. Todo aquele esforço era absurdo. Por que ele não contava de uma que
