- pgno: 45
  md: '# Capítulo cinco


    – Srta. Simms – a duquesa disse. – Seu nariz vai abrir um buraco no vidro da janela.
    Duquesas não ficam boquiabertas.


    Com a repreensão, Pauline se acomodou no assento da carruagem. Depois de viajar
    a noite toda, elas chegaram à movimentada periferia de Londres no início da tarde,
    e precisaram de mais três horas para atravessar as ruas e pontes congestionadas
    e chegar à Casa Halford. Ela ficou de nariz grudado na janela do veículo o tempo
    todo, admirando, de olhos arregalados, o cenário urbano. Tanto vidro. Tantos tijolos.
    Tanta sujeira. E tanta, tanta gente.


    A carruagem entrou em uma região de casas mais refinadas, muitas das quais ficavam
    de frente para praças arborizadas com cercas-vivas aparadas com esmero. Elas deviam
    estar se aproximando da casa do duque.


    Pauline já tinha estado em casas elegantes antes. Bem, pelo menos em uma casa
    refinada; Summerfield, a residência de Sir Lewis Finch. A governanta de Sir Lewis
    às vezes contratava empregadas adicionais para arrumar a casa no Natal ou na Páscoa.
    Summerfield era uma mansão grandiosa, com diversas alas e cheia de curiosidades
    de todos os tipos. Cada uma daquelas bugigangas empoeiradas era inestimável –
    pelo menos, as garotas contratadas deviam manuseá-las como se fossem tesouros.


    Quando a carruagem parou diante da Casa Halford, Pauline estava convencida de
    que nada ali seria novidade. Bem... ela estava errada. Nada em sua vida, seus
    sonhos ou contos de fadas tinha preparado para aquilo. E ela não tinha ideia de
    como faria para não ficar boquiaberta.


    Para começar, a casa era imensa. Quatro andares e extensa o bastante para que
    alguém que quisesse vê-la por inteiro tivesse que ficar do outro lado da praça.
    Perto como estava, ao descer da carruagem, Pauline teve que inclinar a cabeça
    até quase tocar nas costas. Ela sentiu seu maxilar afrouxar, era impossível não
    ficar boquiaberta.


    Então, com o sol se pondo por trás do horizonte irregular da cidade, ainda riu
    por um último momento, espalhando seu brilho pela praça. Os raios cor-de-âmbar
    desceram diretamente sobre a Casa Halford, parecendo coroá-la. Os vidros de cada
    janela cintilaram como a faceta de um diamante, e a fachada de granito branco
    pareceu banhada em ouro.


    Pauline ficou assombrada, então a porta foi aberta e ela ficou mais estarcida
    ainda. Ela seguiu a duquesa por um corredor de oito criados uniformizados. Depois
    que cruzaram a soleira, havia mais criados em posição no hall de entrada. Cozinheira,
    governanta, criadas, copeiras, camareira.'
