- pgno: 22
  md: 'Ela teve que sorrir ao ver o duque arrogante literalmente se curvando para
    entrar na casa da família dela.


    Uma vez lá dentro, as visitas passaram os olhos pela residência pequena e pouco
    mobiliada. Não era difícil julgar todo o lugar com apenas uma olhada. A casa tinha
