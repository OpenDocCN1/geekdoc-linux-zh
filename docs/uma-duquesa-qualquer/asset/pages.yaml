- pgno: 50
  md: '– Escolha os livros que quiser – ele disse. – Eu espero.

    Ela ficou parada no centro da sala, virando-se lentamente. Assombrada, sem dúvida.
    Mesmo ele devia admitir que era uma coleção impressionante. Como devia ser, tendo
    sido reunida por uma dúzia de gerações. A sala tinha a altura de dois andares
    e um formato hexagonal, devido a um capricho do quinto duque. Ele foi um arquiteto
    amador, além de naturalista e outras coisas grandiosas. Um dos lados do hexágono
    servia de entrada, mas prateleiras de livros cobriam as outras cinco, do chão
    ao teto altaneiro.

    – Vá em frente – ele insistiu.

    – Eu posso mesmo tocar neles? – ela sussurrou.

    – Mas é claro. Alguém precisa fazer isso.

    Porém, ela continuou embrulhada na colcha torcida, o rosto virado para as vigas.

    – Eu nem sei por onde começar.

    – Que tipo de livro você gosta? – ele perguntou, sem se preocupar em disfarçar
    a presunção da voz. – Você é uma grande leitora de Filosofia? História? Ciências?

    – Eu gosto principalmente de poesia. Mas não tenho nenhuma pretensão de ser uma
    grande leitora, Vossa Graça.

    Pronto. Ela admitiu fácil assim.

    – Ainda assim, você afirmou estar procurando a biblioteca – ele disse, cruzando
    os braços.

    – Sim. Eu queria ver os livros, não ler. Eu esperava dar uma olhada na sua coleção.
    Talvez fazer uma lista.

    Afinal, ela se arriscou à frente e passou o dedo pela lombada de um volume fino,
    com capa de couro. Ela nem o tirou da prateleira, apenas o tocou – cautelosa,
    como se o livro pudesse desaparecer em uma nuvem.

    – Como eles estão organizados, você sabe?

    – Na verdade, não. Desconfio que seja mais ou menos por assunto. Meu avô inventou
    um sistema de classificação e fez um catálogo, mas nunca me dei ao trabalho de
    tentar entendê-lo. Não costumo usar a biblioteca.

    Ela levantou a lamparina e se voltou para ele, arregalando os olhos, sem acreditar.

    – Você está dizendo que mora nesta casa, com todos estes livros – ela fez um gesto
    largo com a mão da lamparina –, e nunca lê?

    Ele deu de ombros, fazendo de conta que não se importava com o ponto sensível
    que ela tinha tocado.

    – Sou um constrangimento para meus antepassados. Sei bem disso.

    – Quanto custa um livro, afinal?

    Ele desistiu de tentar estabelecer ligações entre as perguntas dela. Estava tarde
    demais.

    – Isso vai depender de muitos fatores, eu acredito. A natureza do livro, a qualidade
    da encadernação. Romances podem ser adquiridos por uma ou duas coroas, enquanto
    que uma coleção de nove volumes sobre a História de Roma...

    Ela fez um gesto, dispensando a explicação dele.

    – Acho que não quero ler sobre a História de Roma.

    – Os romanos não eram tão aborrecidos como você está pensando. – Aulas de História
    foram uma das poucas coisas de que ele gostou em seus estudos.'
