  md: 'Ele não fazia ideia do que aquilo significava, mas imaginou que não era uma
    conversa apropriada para se ter no hall de entrada.

    Griff os conduziu até o escritório – uma sala que, ele acreditava, não estaria
    ocupada por uma criada aos prantos. Tocar a sineta para pedir chá pareceu inútil,
    então serviu conhaque para Payne e ofereceu licor para as mulheres. Mais um episódio
    das aventuras de autossuficiência daquele dia.

    – Pauline, o que aconteceu? – perguntou a agitada esposa de Payne. – O que ele
    fez com você?

    – Minha lady, ele apenas me ofereceu um emprego. Estou trabalhando como dama de
    companhia da duquesa.

    – Oh, mesmo? – a voz de Lady Payne soou carregada de ceticismo. – E onde está
    a duquesa agora?

