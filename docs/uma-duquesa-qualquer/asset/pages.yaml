- pgno: 194
  md: 'no mundo dele. Sempre. Mesmo que pudesse aguentar uma vida de zombaria e crueldade
    sutil, não teria coragem de expor Daniela a esse tratamento.

    – Você fez bem em rejeitá-lo – Minerva disse. – Mas nós não podemos deixar que
    acabe desse modo.

