- pgno: 53
  md: 'tinha visto. Aquela coisa já tinha sido usada, lavada e remendada tantas vezes,
    que parecia um rendado de teias de aranha, não um tecido de verdade. E quando
    ela colocou o corpo na frente da lamparina... A camisola ficou transparente por
    completo.


    Griff podia ver tudo. Ela não parecia em nada com um garoto. Não, ela era uma
    mulher. Os seios pequenos e redondos como maçãs eram encimados por mamilos escuros.
    A barriga era lisa. Quando ela se pendurou na escada, esticando-se na ponta dos
    pés para alcançar outro livro, a curva da silhueta dela foi para ele como uma
    canção conhecida. O pé em arco, a panturrilha esguia, a coxa suavemente mais grossa...
    e um traseiro redondo, palpável.


    O corpo dela não era uma figura curvilínea como as de Rubens. Nenhum artista a
    pintaria descansando sobre lençóis brancos. Havia algo de selvagem e fundamental
    nela, que inspiraria artistas a retratar uma ninfa ou dríade dançando. Ela possuía
    um corpo que sempre mostraria suas melhores qualidades em movimento. E nu. Que
    ótimo. Agora a imaginação dele se agitava com pensamentos de Pauline Simms nua
    e em movimento.


    Ela se virou na escada, encarando-o.


    *Olhos*, ele disse para si mesmo. *Concentre-se nos olhos.* Ela tinha olhos lindos,
    com aquele tom surpreendente de verde-folha e os cílios inacreditáveis de tão
    compridos. Griff não podia deixar seu olhar vaguear para nenhuma outra parte.
    Não para os seios empinados, nem para o provocante triângulo escuro aninhado entre
    as coxas.


    *Maldição.* Griff era um homem, como tinha acabado de dizer para ela. Não era
    complicado. A reação em seu baixo-ventre era pura, simples, com mais de dez centímetros
    extras de honestidade. Estava claro que ela não tinha noção de sua aparência.
    Não podia ter. Do contrário, ela pularia daquela escada no mesmo instante e se
    cobriria.


    – Onde estão os romances? – ela perguntou, tranquila, apoiando o cotovelo no degrau
    mais próximo.


    Um pensamento insidioso ocorreu a ele. Se ela não sabia por que Griff a encarava,
    ele podia ficar olhando pelo tempo que quisesse. Podia observar todos os detalhes
    dela e guardar visões suficientes para alimentar suas fantasias por meses.


    – Acho que os romances estão ali – ele respondeu, brusco, apontando para a parede
    em questão. Então ele colocou o relógio desmontado à frente dos olhos, como um
    escudo, bloqueando-a. Atrás do mecanismo, ele ergueu os olhos na direção do teto.
    Era melhor que alguém lá em cima acrescentasse um ponto na sua caderneta de boas
    ações, talvez agora o total de sua vida somasse cinco ou seis.


    – Você tem algum favorito para me recomendar? – ela perguntou.


    – Não. – Ele suspirou com impaciência. Griff desejou que ela parasse de ser tão
    amigável, enquanto ele se esforçava para parar de despi-la mentalmente. Na cabeça
    dele, ela estava a dois botões de ficar arruinada por completo.


    – Eu também não leio muitos romances – ela disse. – Os poucos que tentei pareceram
    florestas para mim... eu sempre me perdia. Prefiro poesia, quando consigo encontrá-las.
    Pequenos buquês de belas palavras, fáceis de entender e manter consigo. Tivemos
    uma mulher em Spindle Cove, certo verão, que se achava uma poetisa. Os poemas
    dela eram'
