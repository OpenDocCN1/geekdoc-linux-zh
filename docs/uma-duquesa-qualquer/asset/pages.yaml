  md: 'quilômetros. Se forçasse a vista, conseguia ver a ponta da penteadeira e perceber,
    pendurado na parede, o espelho de corpo inteiro reluzente, com moldura dourada.
    Este se apoiava em dois querubins esculpidos em mármore. Querubins levados, era
