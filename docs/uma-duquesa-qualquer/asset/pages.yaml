- pgno: 62
  md: '– Foi só um beijo. – Ela pegou uma vela acesa na escrivaninha. – O que é um
    beijo ou dois? Isso não foi nada.

    Ele se virou para ela e a encarou.

    – Você ouviu o que disse?

    – O quê?

    – Você disse “não foi nada”, e não “num foi nada”.

    – Não disse, não. Eu disse “não foi nada”. Não… – Pauline ficou boquiaberta. –
    Minha nossa. Eu disse mesmo. “Não foi nada”. – Ela testou mais algumas palavras:
    – Livro. Leite. Quente.

    – Vamos apenas… – O duque levantou a mão. – …parar com o exercício por aí.

    Pauline cobriu a boca com a mão e riu.

    – Oh, não. Isso só pode ser sua culpa. Sua mãe disse que tudo era uma questão
    de soltar a língua e os lábios.

    Ele a encarou, sombrio.

    – Não se preocupe, Vossa Graça. Não importa como se pronuncia. Não foi nada, mesmo.
    Só um beijo.

    Mentiroso, o coração dela saltou. Foi muito mais.

    – Eu já fui beijada antes – ela continuou. Mentiroso, mentiroso. Você nunca foi
    beijada assim. – Eu sei que não preciso dar muita importância a isso. Não é motivo
    para preocupação – ela concluiu.

    Mentiroso, farsante, sem-vergonha.

    – Você tem razão – ele concordou. – Nós dois temos nossos objetivos. Você tem
    uma livraria obscena para abrir e eu tenho que continuar com minha vida libertina,
    livre das amarras do casamento. O único modo desta semana dar errado é se terminar
    com nós dois noivos, encaminhados para o casamento, e Deus sabe que isso não vai
    acontecer.

    Ele fechou as portas e se virou para ela. Seus olhos se encontraram no espaço
    dourado e quente acima da chama da vela.

    Pauline forçou uma risada. Esta saiu estridente, louca e ridícula, e ela desejou
    poder culpar alguém por isso.

    – Ah, céus. Não se empolgue tanto, Griff. O beijo não foi tão bom.

    Então ela subiu correndo a escadaria, tentando deixar para trás as acusações que
    seu peito proferia.

    Mentiroso, mentiroso, mentiroso, mentiroso.'
