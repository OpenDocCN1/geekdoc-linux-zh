- pgno: 80
  md: 'alguém dizer isso para elas. – Ele pegou o cálice da mão de Pauline e o esvaziou
    com um único gole. – Vejo que vou me divertir esta noite.


    O evidente prazer que ele tirava dos tropeços dela não a satisfez como deveria.
    Pauline tentou ignorar seu orgulho ferido. Satisfazer seu empregador era bom.
