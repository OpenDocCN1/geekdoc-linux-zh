- pgno: 193
  md: '# Capítulo vinte e cinco


    Abrigadas na Casa Rycliff, e a salvo das multidões, Lady Rycliff – que agora insistia
    com Pauline para que esta a chamasse de Susanna – serviu outra xícara de chá.

    – Que semana você teve, querida.

    Pauline observou o líquido aromático enchendo sua xícara de porcelana. Lady Rycliff
    servindo chá para ela. O mundo estava mesmo de cabeça para baixo.

    – Foi uma semana cheia. – E foram necessárias quase duas horas para ela contar
    a história, desde o momento em que jogou o açúcar estragado para cima até o final
    amargo.


    É claro que ela não contou tudo. Ela deixou os detalhes românticos de fora. E
    Griff merecia ter sua privacidade resguardada com relação a Maria Annabel. Ela
    nunca contaria sobre isso a qualquer outra pessoa.

    – Eu sabia que Halford era um vilão – disse Lady Payne (que insistia com Pauline
    para que esta a chamasse de Minerva), pegando um biscoito da travessa e dando
    uma mordida raivosa.

    – Você está enganada – replicou Pauline. – Ele é um bom homem. Do melhor tipo.

    Ainda assim, ela o magoou. Sempre que Pauline fechava os olhos, enxergava a expressão
    furiosa e traiçoeira dele. A imagem estava gravada em sua memória, entalhada em
    culpa. Talvez ela não devesse o ter forçado, mas estava tão preocupada com ele...
    E tão temerosa. Griff tinha razão. Ela sentia medo por si mesma.

    – Ele a pediu em casamento mesmo? – Lady Rycliff perguntou.

    Pauline assentiu.

    – E você recusou?

    Ela concordou com a cabeça novamente.

    – Você deve achar que sou uma boba.

    – Você não é boba. – Susanna deu um leve aperto na mão dela.

    Não. Pauline chegou à conclusão de que não era. Na verdade, ela era uma covarde.
    Entrou em pânico e o afastou de sua vida.


    As sugestões dele eram malucas. Os dois, casarem? Ela, tornando-se uma duquesa?
    Uma mulher elegante, admirada pela elite de Londres?

    Isso nunca aconteceria. A multidão do lado de fora da Casa Halford sabia da verdade.
    Ela ainda podia senti-la puxando suas roupas, gritando em suas orelhas.

    Griff podia afirmar que não ligava para fofoca, mas isso é fácil para um duque
    dizer. Ele nunca seria objeto de deboche e escárnio. Ele não sabia qual era a
    sensação de estar na parte mais baixa da cadeia alimentar, que era onde Pauline
    estaria, se tentasse viver'
