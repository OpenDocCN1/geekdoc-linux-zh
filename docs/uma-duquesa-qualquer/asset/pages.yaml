- pgno: 176
  md: '# Capítulo vinte e dois


    A ideia pode ter sido de Pauline, mas Griff logo assumiu o controle. Aquela visita
    à instituição não seria no estilo pretensioso e piegas das Ladies Auxiliadoras.
    Se ele tinha que visitar um lar de abandonados, iria fazê-lo à sua maneira. Como
    um duque dissoluto. Com autoridade, extravagância e intenção descaradamente má.


    A chegada dele não foi anunciada – tanto melhor; as entradas mais dramáticas não
    costumam ser. Ele conduziu um desfile de criados através do portão, cada um carregado
    de pequenos tesouros: doces, laranjas, brinquedos, gorros tricotados com competência
    e, por sugestão de Pauline, livros infantis.


    Quando eles chegaram ao pátio central com esse tesouro, o lugar todo já estava
    em alvoroço, com crianças vestidas de marrom saindo de todas as salas de aula
    e de todos os dormitórios.


    As responsáveis não gostaram disso. Suas expressões, normalmente azedas, atingiram
    níveis excessivos de severidade – muitas rugas novas surgiriam nesse dia. Mas
    elas não podiam fazer nada, a menos que desejassem recusar as milhares de libras
    que ele doava por ano... Como é bom ser duque.


    Depois que todas as crianças estavam reunidas, Griff chamou:


    – Onde está Hubert Terrapin?


    O menino veio para frente. Era fácil encontrá-lo – o menor da fila.


    – Hubert, estou designando você como meu intendente – ele anunciou.


    – O que isso quer dizer, Vossa Graça?


    – Você deve supervisionar a distribuição de tudo isto. É uma responsabilidade
    e tanto. Acha que consegue?


    O garoto se empertigou todo.


    – Sim, Vossa Graça.


    – Ótimo. O resto de vocês, façam fila. Os mais novos primeiro.


    A fila começou a andar em velocidade dolorosamente lenta. Como crianças de boa
    índole e menosprezadas costumam ser, Hubert foi muito justo em sua divisão, contando
    com precisão os doces e pedaços de laranja que distribuía.


    – Ele é tão zeloso – Griff sussurrou para Pauline. – Vamos ficar aqui até amanhã.


    – É lindo, não? Mas isso não me surpreende. Lutar por pouco faz parte da natureza
    humana. Mas o que uma pessoa faz com a abundância diz bastante a respeito de seu
    caráter. – Ela pôs um doce na mão de Griff. – Algo para mastigar.


    Ele sorriu para si mesmo quando ela se afastou. Parecia que ela tinha encontrado
    tempo, nessa semana, para lições duciais de sutileza – ou falta dela. Mas Pauline
    estava'
