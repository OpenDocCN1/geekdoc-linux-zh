    amiga mais antiga e querida, Sally era a pessoa mais curiosa e fofoqueira de Spindle
    Cove. Pauline sabia que a curiosidade devia estar devorando a amiga com centenas
    de dentes.

    – Você… – Sally levantou e sacudiu uma pilha de jornais – Você tem que me explicar
