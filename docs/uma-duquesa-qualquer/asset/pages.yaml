  md: '– Oh, Srta. Simms – disse a governanta. – Você se machucou?

    – Não – ela os tranquilizou, grata pela preocupação que manifestaram. – Não, eu
    estou bem. Mas minha reputação sofreu um tanto. Eu corri atrás do ladrão, esbravejando
    palavrões através dos pavilhões de Vauxhall. E o colar foi perdido. – Ela se virou
    para a duquesa. – Sinto muito, Vossa Graça. Mas me sinto muito melhor contando
    a verdade. Como é costume dizer, a confissão faz bem para a alma. Enquanto estamos
    reunidos aqui, talvez haja outros segredos pesando em nossas almas, questões que
    precisam ser contempladas pelo ar fresco e luz do sol.

    Ela olhou de Griff para a duquesa, e de volta para ele. Pelo amor de Deus, falem
    um com o outro.

    – Você está certa – alguém disse. – A Srta. Simms tem razão. Eu fiz algo errado
    e preciso confessar.

    No canto, a cozinheira retorcia o avental. Lágrimas corriam por suas faces enfarin
    hadas.

    – Mês passado, Sua Graça pediu linguado para o jantar. Bem, eu procurei em todo
    o mercado e ninguém tinha linguado para vender. – Ela escondeu o rosto no avental.
    – Então, eu lhe servi bacalhau fresco. Bacalhau. E temperei bastante, para que
    ninguém percebesse a diferença. Mas tenho me sentido péssima desde então.

    Pauline foi até a mulher que chorava e lhe deu tapinhas nas costas, dizendo:

    – Pronto, pronto. Estou certa de que Sua Graça a perdoará.

    – Eu deixei uma brasa cair no tapete da sala de estar – soltou uma das criadas.
    – Fez um furo.

    – Mas você não se sente melhor agora, por ter contado a verdade? – Pauline perguntou.

    A criada fungou e levantou a cabeça.

    – Sim, Srta. Simms. De verdade. É como se um peso tivesse sido tirado de mim.

    – Fico tão feliz. Ninguém deveria viver sob o fardo de segredos.

    A jovem Margaret falou, ansiosa por participar:

    – Eu vi Lawrence na copa, se divertindo com uma criada!

    A duquesa endireitou as costas.

    – Lawrence!

    O criado em questão empalideceu. A duquesa se dirigiu, severa, às criadas.

    – Qual de vocês fez parte disso? Apresente-se agora.

    Três delas deram um passo à frente ao mesmo tempo. Quando viram que não estavam
    sozinhas, todas se voltaram para Lawrence, dirigindo-lhe olhares assassinos.

    Sentindo-se o foco da raiva delas, Lawrence se remexeu.

    – Eu... eu... – Ele empinou o queixo. – Higgs usa espartilho!

    Se ele queria desviar a atenção de si, deu certo. Pauline pôde ver sobrancelhas
    arqueadas de surpresa em toda a sala. Pobre Higgs. Suas bochechas ficaram vermelhas
    como beterrabas.

    – Não é espartilho de mulher. Um mordomo precisa ter uma figura respeitável.

    Durante um momento longo e constrangedor, ninguém disse nada. Até que...

    – Eu não sou francesa.'
