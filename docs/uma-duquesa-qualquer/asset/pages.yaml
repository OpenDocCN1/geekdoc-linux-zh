    – Ele mudou desde o outono passado. Notei isso no dia em que ele chegou a Londres.
    Meu filho era um malandro quando garoto. Depois que cresceu, tornou-se um jovem
    dissoluto, sempre jogando cartas com os amigos ou organizando festas descabidas
    em nossa propriedade de Winterset Grange. E sempre esteve rodeado de mulheres.

    Sem dúvida, Pauline pensou. A noite passada a tornava uma dessas mulheres?

    – Mas no ano passado, tudo mudou. Ele nem abriu Winterset no inverno. Ficou na
    cidade. Por qual motivo, não consigo imaginar. Ele não vai aos clubes, não assiste
    a espetáculos, não mostra interesse nos amigos nem na sociedade. E ainda tem esse
    quarto trancado.

    – Um quarto trancado, Vossa Graça?

    Pauline tentou não revelar como seu interesse no assunto aumentou. Com tudo o
    que aconteceu na biblioteca, depois, ela quase tinha esquecido de tê-lo surpreendido
    no corredor, na noite passada. Ele se comportava mesmo como um homem com algo
    a esconder.

    Ele também beijava como um homem que ansiava por carinho e consolo. Mas ela não
    iria contar isso para a duquesa.

    – Um quarto trancado – a duquesa confirmou. – Ele mantém um quarto, em seus aposentos
    particulares, trancado dia e noite. Apenas ele tem a chave. E não deixa nem as
    empregadas entrarem para tirar pó. É tão... perverso. Quem sabe o que ele está
    guardando ali?

    – Espero que não seja uma coleção de cabeças cortadas. Talvez ele viaje pelo interior
    à caça de atendentes de taverna impertinentes, e eu serei a de número onze.

    A duquesa bufou.

    – Você não é a número onze. Você vai ser a primeira, e única, noiva de Griff.

    – Mas eu sou uma plebeia.

    – A linhagem Halford é robusta o suficiente para suportar a libertinagem do meu
    filho. Pode até mesmo sobreviver a uma plebeia como duquesa. Mas irá terminar,
    para sempre, sem um herdeiro homem.

    – Mas o duque ainda dispõe de décadas para ter um filho. Você não acredita, honestamente,
    que ele irá se casar comigo.

    – Ele tem que casar. Eu não posso esperar décadas. Você não compreende. – A duquesa
    parou por um instante. – Eu esperava que não chegasse a isto, mas agora vejo que
    não tenho escolha.

    A mulher enfiou uma mão no bolso e a retirou, segurando algo pequeno e peludo.'
