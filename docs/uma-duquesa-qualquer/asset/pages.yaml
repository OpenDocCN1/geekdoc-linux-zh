    Pegar um resfriado?

    – Você entende – ela sussurrou – que para nosso acordo dar certo, cedo ou tarde
    você vai ter que me deixar cair.

    – Bem, não vai ser esta noite, porque hoje vou cuidar de você. Não vou deixá-la
    cair.

    – Ele se inclinou para perto dela e sussurrou junto a sua orelha: – Eu vi que
    você estava chateada, Pauline.'
