- pgno: 192
  md: 'Cambaleando de costas, ela fugiu do salão. Então se virou e disparou pelo corredor,
    em direção ao hall de entrada.


    – Pauline – a duquesa chamou às suas costas. – Espere.


    Ela só correu mais rápido. O que mais havia para ser dito? Nada mudaria.


    Quando chegou à porta da frente, ela a escancarou e saiu em disparada. Lá fora,
    uma multidão a recebeu com um rugido.


    Bom Deus. A praça estava congestionada de carruagens, e pessoas se amontoavam
    nos degraus da Casa Halford, esticando o pescoço para dar uma olhada. Uma olhada
    nela, ao que parecia. Lorde Delacre não estava exagerando. A notícia tinha se
    espalhado por toda Londres, e agora a cidade toda aparecia diante da casa do duque.


    – Lá está ela! É ela!


    – Srta. Simms! – um homem gritou. – É verdade que você é uma garçonete?


    – Cinco libras por uma entrevista para o Tagarela!


    Pauline se encolheu na entrada. Ela não podia voltar para dentro e encarar Griff.
    Mas aquela multidão estava tão ávida que poderia pulverizá-la. Mesmo que conseguisse
    escapar dessas pessoas, para onde ela iria? Pauline não tinha dinheiro. Não tinha
    nada, a não ser a roupa do corpo. Ela nem estava de sapatos.


    – Pauline! – uma voz conhecida se elevou acima da balbúrdia. – Pauline! Sou eu,
    Susanna.


    O coração dela deu um salto. Fazendo sombra nos olhos com as duas mãos, ela vasculhou
    a multidão até ver o aceno amistoso de uma mão enluvada e um halo de cabelo ruivo.
    Uma amiga.


    Enquanto Pauline avançava na direção dela, as pessoas agarravam suas roupas desgrenhadas
    e se acotovelavam para dar uma olhada nela. Ela foi sovada como massa de pão.


    Enfim, ela e Susanna conseguiram se encontrar.


    – Oh, Lady Rycliff. Eu não... não sei como... – Emocionada, ela cobriu a boca
    com a mão.


    Susanna a envolveu com um abraço protetor.


    – Está tudo bem, querida. Está tudo bem. Você vai para casa comigo.'
