- pgno: 74
  md: 'Além da vitrine, ela viu o balcão da livraria, com uma série de títulos identificadas
    como NOVAS EDIÇÕES. Amostras de vários tipos de encadernação em couro estavam
    expostas para a escolha dos clientes – preto, verde, vermelho, azul-escuro e um
    pedaço de couro de vitelo claro, tão lindo quanto inviável.

    Ela caminhou até a prateleira e tocou na lombada de um volume. Um livro de poesia.

    Pauline não tinha muito em comum com as aristocratas que visitavam Spindle Cove.
    Mas ela compartilhava do amor que elas tinham pela palavra impressa. Parecia que
    qualquer jovem com problemas para encontrar seu lugar na vida – fosse uma lady
    ou uma criada – podia encontrar um lar mais feliz nas páginas de um livro.

    – Quem está aí?

    O livreiro entrou pela porta dos fundos. Quando seu olhar afiado encontrou Pauline,
    ela tirou a mão do livro de poesia, cobrindo os dedos com a outra mão, como se
