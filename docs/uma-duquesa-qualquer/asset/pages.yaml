- pgno: 7
  md: '– Sussex.

    Sussex. Um dos poucos condados na Inglaterra em que ele não detinha nenhuma propriedade.

    – E qual o objetivo desta missão tão urgente?

    – Nós vamos conhecer sua futura noiva. – Um sorriso curvou os lábios da mãe.

    Griff encarou a mãe. Muitos momentos se passaram até que ele conseguisse dizer
    algo coerente.

    – Você é uma mulher ardilosa, diabólica e com excesso de tempo ocioso.

    – E você é o 8º Duque de Halford – ela retrucou. – Eu sei que isso não significa
    muito para você. A vergonha em Oxford, a jogatina, os anos de devassidão sem propósito...
    Você parece decidido a não ser nada além de uma mancha infeliz na distinta linhagem
    Halford. No mínimo, precisa começar a próxima geração enquanto eu ainda tenho
    saúde para moldá-la. Você tem a responsabilidade de...

    – De continuar a linhagem. – Ele fechou os olhos e apertou a ponte do nariz. –
    Foi o que me disseram. Várias e várias vezes.

    – Você vai fazer 35 anos, Griff.

    – Sim. O que me torna velho demais para ser chamado “Griff”.

    – O mais importante é que tenho 58 anos. Preciso de netos antes que comece meu
    declínio. Não é certo que duas gerações da família fiquem gagás ao mesmo tempo.

    – Seu declínio? – Ele riu. – Diga-me, mãe, como eu faço para acelerar esse processo?
    Além de lhe dar um empurrão?

    – Ouse! – Ela arqueou as sobrancelhas, achando graça.

    Griff suspirou. Sua mãe era... sua mãe. Não havia outra mulher como ela na Inglaterra,
    e era melhor que o resto do mundo agradecesse por Deus ter jogado o molde no lixo.
    Como as joias que ela adorava usar, Judith York era uma mistura formidável de
    refinamento exterior e fogo interior.

    Durante a maior parte do ano, eles levaram vidas completamente separadas, só residiam
    na mesma casa durante os poucos meses da temporada londrina. Aparentemente, até
    isso era demais.

    – Eu fui paciente – ela disse. – Agora estou desesperada. Você precisa casar,
    e tem que ser logo. Eu tentei encontrar as melhores e mais belas jovens da Inglaterra
    para tentá-lo. E encontrei, mas você as ignorou. Percebi, afinal, que a resposta
    não está na qualidade, mas na quantidade.

    – Quantidade? Você está me levando para alguma comunidade utópica de amor livre,
    em que os homens podem ter quantas mulheres quiserem?

    – Não seja ridículo.

    – Eu estava sendo esperançoso.

    – Você é terrível. – Os lábios dela se comprimiram em uma demonstração de desdém.

    – Obrigado. Eu me esforço para isso.

    – O que me faz lamentar com frequência. Se você aplicasse o mesmo esforço para...
    outra coisa.

    Griff fechou os olhos. Se havia uma conversa mais enfadonha e repetitiva do que
    a “Quando você vai se casar?”, era a “Você é uma grande decepção”. Somente sua
    família'
