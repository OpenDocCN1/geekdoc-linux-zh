    – Fleuma? – Pauline ecoou, engolindo a comida. – É proibido falar de fome na mesa,
    mas podemos falar de fleuma? – Ela cutucou um pedaço de presunto. – Se é fleuma
    que você quer, posso lhe dar. Aprendi a cuspir com os garotos da fazenda. O truque
