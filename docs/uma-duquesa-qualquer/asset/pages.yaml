    – Eu não sou uma lady, minha lady.

    – Ficaríamos do seu lado mesmo que fosse apenas uma atendente de taverna – Susanna
    disse. – Mas você sempre foi algo mais.

    Pauline se animou um pouco. De fato, ela possuía algo mais dentro de si, e talvez
    Griff não fosse o único a notar. Era óbvio que não era uma duquesa e não atendia
    aos padrões de Lady Harrowes e sua turma. Mas Susanna e Minerva também não, assim
