  md: 'encará-lo, levando a mão ao pescoço com o susto. Oh, Deus. Oh, não. Ele tinha
    sumido. Tudo tinha sumido.


    Griff saiu do bosque à procura dela. Enfim avistou o vestido de Pauline no outro
    lado do gramado lotado. O inconfundível borrão rosado, iluminado pelos clarões
    dourados dos fogos acima. Ele sentiu como se estivesse assistindo ao próprio coração
    sendo separado de seu corpo.


    Então um homem emergiu das sombras, e o coração de Griff baqueou.

    – Pauline! – ele gritou.


    Ela não o ouviu – ou não se virou, caso tenha ouvido. Apenas parou por um instante,
    então levantou as saias e partiu em disparada na escuridão da noite. Pauline estava
    perseguindo alguém.

    – Pare! Pare, seu maldito ladrão! – ele a ouviu gritar.


    Ladrão? Griff correu atrás dela, mas ainda precisava desviar da multidão, e ela
    tinha uma vantagem e tanto. Ele ficou espantado com a velocidade que ela conseguia
    alcançar usando todas aquelas saias. Pauline estava fazendo o bandido – ou quem
    quer que fosse – correr bastante entre às colunatas e através dos bosques iluminados.


    Enquanto ela corria, deixava xingamentos para trás, como seus próprios fogos de
    artifício. Qualquer progresso que ela tivesse feito em dicção nesta semana, desapareceram
    num instante.

    – Vagabundo! – ela gritou, passando apressada por um atônito cavalheiro que Griff
    reconheceu como sendo o embaixador austríaco. – Pare, seu maldito canalha!


    Bem, se um espetáculo desastroso era o que ela queria, aí estava. Não foi necessária
    nenhuma tigela de ponche.

    – Vou acabar com você, seu nojento filho de uma prostituta!


    Griff fez uma expressão de “Não, você não” na direção do reservado real, como
    que pedindo desculpas, sem vontade de parar para dar explicações. Ele estaria
    rindo se não estivesse tão ofegante – e preocupado com Pauline.


    Eles chegaram aos limites de Vauxhall e mergulharam no bairro vizinho – uma mistura
    de fábricas, casas e apartamentos de comerciantes. Nenhuma das ruas era iluminada.
    Só Deus sabia que perigos se escondiam naqueles becos. Ainda assim, Pauline foi
    em frente. O que ela estava pensando? O que quer que o bandido tivesse roubado,
    não valia colocar a vida dela em risco. Ela estava perdendo para o ladrão, mas
    Griff se aproximava dela.


    – Pauline! – ele gritou, buscando fôlego no fundo dos pulmões. – Deixe-o ir!

    – Não posso!


    Ela dobrou uma esquina, firme na perseguição, e Griff a perdeu de vista por alguns
    segundos assustadores e intermináveis. Ele aumentou o ritmo, rezando para que
    ela ainda estivesse inteira e ilesa – para que pudesse segurá-la e fazê-la recuperar
    o juízo.


    Quando Griff se aproximava da mesma esquina, um grito curto e penetrante cortou
    o ar. Santo Deus. Por favor. Ele virou na esquina e lá estava ela – jogada no
    chão, no meio do caminho.'
