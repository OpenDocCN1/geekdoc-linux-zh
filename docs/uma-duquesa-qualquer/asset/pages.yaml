- pgno: 49
  md: 'perfeitamente errada. Tudo o que você nunca iria querer em uma mulher.

    Ele deslizou o olhar pelo corpo dela.

    – Eu não diria isso.


    O movimento forçado do pomo-de-adão dele chamou a atenção de Pauline, puxando
    seu olhar para baixo, para a reentrância bem definida na base do pescoço dele.


    Os pulmões dela escolheram esse momento para não trabalharem. Ela segurou a respiração
    por tanto tempo que ficou um pouco tonta.

    – Pode me mandar para casa amanhã, se quiser. Mas vai descobrir que eu não roubei
    nada. Não estou aqui para roubar. E mesmo que estivesse pensando nisso – e não
    estou –, sou inteligente o bastante para não tentar na minha primeira noite aqui.
    Eu conheci sua governanta. Estou certa de que ela tem uma lista do que há em cada
    gaveta de cada armário, e que faz um controle regular de tudo. Se eu quisesse
    roubar, esperaria para fazer isso no meu último momento. Se não quer me dar crédito
    por honestidade, pelo menos me dê por inteligência.


    – Não vou lhe dar crédito por nada até ouvir a verdade.

    – Eu já disse a verdade. – Ela apertou mais a colcha ao redor dos ombros. – Não
    estava conseguindo dormir. Pensei em ir até a biblio...

    – Biblioteca – ele a interrompeu, completando a palavra por ela. Sarcasmo respingava
    de sua voz. – Sério? É nisso que você quer que eu acredite? Estava procurando
    a biblioteca.


    Por que ele parecia tão incrédulo?

    – Sim – ela respondeu. Mas àquela altura, tudo que ela desejava era voltar para
    o quarto e acabar com aquele interrogatório. A insônia dela só podia estar curada.
    Aquele homem era exaustivo.

    – Muito bem. – A mão dele apertou o braço de Pauline enquanto ele a conduzia pelo
    corredor. – Se é a biblioteca que você está procurando, eu mesmo a levo até lá.


    Aquilo não estava saindo como Griff havia planejado. Ele pensava estar protegido
    contra tentações. Mas não contava com a própria tentação se materializando em
    um corredor escuro ao lado de seu quarto, bem depois da meia-noite. De novo com
    o cabelo solto, e enrolada nas roupas de cama como se tivesse acabado de fazer
    sexo, esgueirando-se pelos aposentos privados dele, ainda mais sedutora à luz
    da lamparina do que sob o sol da tarde.


    Claro que só podia ser um truque das sombras. Os cílios dela não podiam ter a
    mesma extensão que a unha do polegar dele. Isso não seria possível. Talvez os
    cílios crescessem com cada mentira que ela contava. Sério? A biblioteca? De todas
    as desculpas tolas e esfarrapadas que ela podia inventar.


    Griff a fez marchar pelo corredor, enrolada naquela colcha, depois a levou escada
    abaixo e por uma curva. Quando chegaram à porta correta, ele a escancarou, para
    dar um efeito dramático.

    – Aí está a biblioteca. – Ele lhe entregou a lamparina.

    Arregalando os olhos, ela entrou na sala, usando a luz para clarear o caminho.'
