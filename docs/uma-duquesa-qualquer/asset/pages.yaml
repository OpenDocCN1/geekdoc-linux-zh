- pgno: 43
  md: 'Analisando a situação, parecia ridículo acreditar que ele – ele! – pudesse
    permanecer celibatário pelo resto de sua vida. Ele devia saber que esse dia iria
    chegar, quando seu pênis negligenciado se levantaria, interessado, e acenaria
    com um animado “Ei, você, lembra de mim?”. E sua sorte quis que esse dia fosse
    hoje.


    Havia algo em Pauline Simms que o fascinava. Ela era tão desafiadora no orgulho
    que sentia de suas origens humildes, mas ao mesmo tempo precisava de aprovação.


    Aquilo era um arranjo comercial, Griff procurou se lembrar. Ele tinha contratado
    a garota para enloquecer sua mãe, não para enfieiçá-lo. A esperteza dela e aqueles
    olhos vivos de gata não deviam ser tentações. Faziam parte de um conjunto de habilidades
    que ela precisava usar no emprego. Do mesmo modo que um pedreiro precisa ter músculos,
    capacidade de calcular e mãos firmes.


    Pensar em empregados ajudou-o a levar sua mente para tarefas mundanas. Ele precisava
    avisar a criadagem da sua casa que a duquesa estava levando uma hóspede. Felizmente,
    a Sra. Thomas, a governanta, era assustadoramente eficiente. Algumas palavras
    e tudo estaria pronto antes da chegada da Srta. Simms: quarto, empregada, refeições,
    banho.


    Deus, sim. A garota precisava de um banho. Um banho de verdade. Não uma enxaguada
    rápida para lavar toda aquela doçura brilhante. Mas de um banho quente o bastante
    para amolecer os calos de suas mãos e dar vida àqueles belos cabelos cor de conhaque.
    Com um pedaço novo de sabão perfumado para se esfregar e toalhas grossas e macias
    para envolver seu corpo esguio e reluzente.


    A imagem que surgiu na mente dele era tão vívida, tão rica nos detalhes de cada
    textura da pele ensaboada... que ele teve que parar o cavalo no meio da estrada
    para se recuperar.


    O tamborilar pesado dos cascos do animal cessaram, mas suas costelas sentiam o
    martelar furioso de seu pulso. Por que ela? Por que agora?


    Como aconteceu com todos os porquês que ele lançou à escuridão nos últimos meses,
    não houve resposta. Apenas uma coisa ficou clara: aquilo não daria certo. Talvez
    ele conseguisse correr na frente da tentação, nessa noite, mas pela manhã a tentação
    estaria morando debaixo do teto dele.'
