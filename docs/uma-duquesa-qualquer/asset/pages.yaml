  md: '– Pauline! Pauline, você está ferida?

    – Não pare por minha causa! – ela exclamou. – Corra atrás dele.

    – Ele já foi. – Griff nem se preocupou em olhar. – Já foi. E mesmo que eu pudesse
    alcançá-lo, não iria abandonar você aqui.

    As pessoas começavam a sair das moradias próximas, observando com interesse o
    cavalheiro e a dama que estavam parados no meio da rua. Griff adotou uma postura
    forte e olhou em todas as direções, alerta, fazendo quaisquer rufiões saberem
    que era melhor não se arriscarem com ele.

    – O que aconteceu? – ele murmurou, agachando-se diante de Pauline. – Ele a machucou?
    Bateu em você com alguma coisa? – Griff começou a procurar manchas de sangue.
    – Ele tinha uma pistola ou uma faca?

    – Não... – Ela soluçou.

    Ele conseguiu respirar de novo. Graças a Deus.

    – Nada disso. O problema foi essa droga de sapato. Prendi o salto alto entre duas
