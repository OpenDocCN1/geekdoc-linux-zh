- pgno: 14
  md: 'Griff olhou. A cena era mais abominável do que ele poderia ter imaginado. Aquele
    lugar nem parecia uma “taverna”, mas uma casa de chá. Moças lotavam o estabelecimento,
    reunidas ao redor das mesas, com os rostos franzidos de concentração. Elas pareciam
    estar ocupadas com uma das tarefas absurdas que passavam por “realização” feminina
    nos dias de hoje. Enfeites de papel, ao que parecia. E elas nem estavam usando
    folhas novas, contentavam-se em arrancar páginas de livros para fazer seus adornos
    estranhos para bules e bandejas de chá.


    Ele olhou para a pilha mais próxima de volumes: A Sabedoria da Sra. Worthington
    para Jovens era o título de um deles. Assustador.


    Isso era tudo que ele tinha evitado durante anos. Uma sala cheia de mulheres jovens,
    solteiras e sem graça, dentre as quais era esperado que ele encontrasse uma noiva
    adequada.


    Cutucada pela amiga, uma jovem se levantou e fez uma mesura.

    – Podemos ajudá-la, madame?

    – Vossa Graça.

    – Madame? – A jovem franziu a testa.

    – Eu sou a Duquesa de Halford. Você deve se dirigir a mim como “Vossa Graça”.

    – Ah, entendo. – Enquanto a amiga que a tinha cutucado abafava uma risadinha nervosa,
    a moça de cabelos claros tentou de novo: – Podemos ajudá-la, Vossa Graça?

    – Apenas fique ereta, garota. Para que meu filho possa vê-la. – Ela virou a cabeça,
    examinando o restante do salão. – Todas vocês, de pé e em sua melhor postura!


    Griff sentiu uma dor aguda penetrar em seu crânio quando as pernas das cadeiras
    arranharam as tábuas do chão. Uma por uma, as moças se levantaram, obedientes.


    Ele notou algumas marcas de varíola e alguns dentes tortos. Mas nenhuma delas
    era horrível. Algumas eram apenas... frágeis. Outras estavam bronzeadas de sol,
    o que era deselegante.


    – Bem – a duquesa disse, andando até o centro da sala com passos longos. – Joias
    brutas. Em alguns casos, muito brutas. Mas todas são de boas famílias, então,
    lapidando um pouco... – Ela se virou para o filho. – Pode escolher, Halford. Escolha
    qualquer garota que lhe agradar, e eu irei transformá-la em duquesa.


    Todas as bocas no salão se abriram. Todas, menos a de Griff. Ele massageou as
    têmporas latejantes e começou a pensar em um breve discurso. Senhoritas, eu lhes
    imploro. Não deem atenção a esta maluca. Ela está próxima de seu declínio. Está
    ficando caduca.


    Mas então, ele pensou... Uma saída rápida seria bondade demais para com a mãe.
    Com certeza a punição adequada seria o oposto disso: fazer exatamente o que a
    mãe lhe pedia.

    – Você afirma que pode transformar qualquer uma destas garotas em duquesa?

    – É claro que posso – a mãe afirmou.

    – E quem será o juiz do seu sucesso?

    – A Sociedade, é claro. – Ela arqueou uma sobrancelha. – Escolha sua jovem e ela
    será celebrada até o fim da próxima temporada de Londres.

    – Celebrada por Londres, você diz? – Ele deu uma risada ambígua.'
