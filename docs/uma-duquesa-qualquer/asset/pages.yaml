    A duquesa se deteve bem quando estava para colocar uma colher de sopa de aspargos
    na boca. Ela olhou para o caldo grosso e esverdeado, então largou a colher.

    – Não é nada disso, Srta. Simms. Fleuma é autoconfiança. Serenidade. Impassibilidade.
    A capacidade de manter a calma, não importa o que aconteça. Nunca subestime o
    poder da fleuma.

    Ah, então ela estava falando do modo como ela e o duque se encararam à tarde na
    Touro & Flor – nenhum dos dois queria mostrar fraqueza. O modo como eles inspecionaram
