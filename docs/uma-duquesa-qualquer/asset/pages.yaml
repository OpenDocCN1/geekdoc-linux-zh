    Ele a encarou com uma expressão de total perplexidade.

    – Do que você está falando?

    – Do colar. Eu vou pagar para vocês de algum jeito. – Ela segurou no corrimão
    e deu outro passo.


    Ele não a acompanhou.

    – Isso é absurdo – Griff murmurou.


    Abaixando-se, ele passou um braço por baixo das coxas dela e a levantou, carregando-a
