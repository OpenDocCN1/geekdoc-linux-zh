  md: 'Isso veio de Fleur.

    – O quê?! – a duquesa exclamou. – Impossível.

    – Não sou. Eu n-não sou – a camareira da duquesa fez sua confissão em um inglês
    hesitante e mal pronunciado. Seu sotaque era ainda mais vulgar do que o de Pauline,
    e ela ainda gaguejava. – Eu sabia que n-nunca c-conseguiria emprego de c-camareira
    falando deste modo. E-então eu d-disse que era francesa para não ter que conversar.
    Meu n-nome verdadeiro é F-Flora. Perdão, Vossa Graça. Vou f-fazer minhas malas.

    Ela saiu da sala em lágrimas e a duquesa foi atrás dela.

