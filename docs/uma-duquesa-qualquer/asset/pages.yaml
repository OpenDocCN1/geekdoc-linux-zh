    Uma imagem surgiu na mente dela, vívida como a luz do dia e real demais. O Duque
    de Halford, com seus membros masculinos espalhados por uma cama larga. Nada de
    veludo. Nada de escadinha para subir na cama. Nada de colchão de penas ultramacio.
    Apenas o cabelo castanho desgrenhado, os bíceps contraídos ao redor de um travesseiro,
    e lençóis brancos e macios, luminosos à luz do luar, enrolados ao redor dos quadris.
    Ou talvez um pouco mais baixo, abraçando a curva de um traseiro firme e musculoso.


    Ela tentou afastar aquela imagem, mas não teve sorte. Isso encerrava o assunto.
    Com ou sem chá frio, ela não conseguiria voltar a dormir.


    Pauline se levantou do chão, apertou a colcha ao redor dos ombros e se aventurou
    no corredor.


    Estava mais escuro ali. Pauline ficou parada por um momento, tentando lembrar
    da sequência de curvas feita pela governanta. Ela bem que tentou prestar atenção,
    mas estava tão exausta e impressionada... Para não mencionar seu assombro diante
    das fileiras de retratos antigos, que em alguns locais se acumulavam em colunas
    de três quadros. Tantas dezenas de ancestrais ilustres. As garotas de Spindle
    Cove diriam que, com certeza, aquele lugar estaria lotado de fantasmas.


    Em algum lugar acima dela, madeira rangeu. Uma corrente de ar frio passou por
    seu pescoço, e Pauline engoliu em seco. Esquerda. Ela teve certeza de que elas
    tinham vindo da esquerda. Avançou lentamente nessa direção, mantendo uma mão estendida
    para apoiar os dedos na parede. A cada doze passos, a ponta de seus dedos caía
    da parede'
