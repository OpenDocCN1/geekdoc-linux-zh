- pgno: 90
  md: '– Seu alfinete. – Ela fitou, esperançosa, o diamante preso na gravata dele.
    – É a solução. Nós podemos usá-lo para cortar os fios.

    Certo. Ela era inteligente demais para seu próprio bem. Os dedos dela voaram para
    a gravata dele e começaram a puxar o diamante.

    – Como se solta isto?

    – Tem um fecho. – Ele enfiou os dedos nas dobras de tecido para encontrá-lo. –
    Aqui. Eu seguro a parte de baixo e você o gira.

    Ela segurou a cabeça do alfinete com a ponta dos dedos e começou a soltá-la.

    – Cuidado agora – ele disse. – Vá devagar.

    Do modo como aquela semana estava indo, não seria de admirar se ela soltasse o
    alfinete, escorregasse para frente no banco e enterrasse a ponta afiada em uma
    das artérias vitais dele.

    – Está quase solto – ela disse.

    Ele adorou o modo como as sobrancelhas delicadas de Pauline se moviam com a concentração,
    ou como o lábio inferior dela se dobra­va sob os dentes. Ah, aquilo era mau. Finalmente,
    o alfinete dourado se soltou.

