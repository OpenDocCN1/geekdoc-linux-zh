- pgno: 86
  md: 'Ela remexeu a mão presa no fundo da manga dele. Aqueles seios contra o peito
    dele se agitaram como em uma dancinha.

    Griff inspirou fundo. Ele tinha que assumir o controle da situação, e logo, ou
    perderia a cabeça de uma vez.

    – Escute, Simms. Vamos ficar calmos.

    Ele enviou uma mensagem mental para baixo: Isso também vale para você.

    – Primeiro, tire sua mão da minha manga.

    Ela obedeceu e ele sofreu a mesma tortura, só que ao contrário, enquanto ela arrastava
    os dedos por seu ombro e pelo peito. Mas depois que isso foi feito, ele pôde recuar
    um passo, colocando alguma distância entre eles, que ficaram, assim, enroscados
    em apenas um lugar.

    Ele acenou com a cabeça para um banco próximo.

    – Agora sente e me dê um instante que eu vou resolver isso.

    Ele tirou suas próprias luvas e começou a explorar a ligação entre sua manga e
    o corpete dela. Griff encontrou o lugar em que seu botão tinha enganchado. A essa
    altura, aquela coisa se enrolou várias vezes. Ele virou o botão para um lado e
    para outro, procurando alguma folga, resistindo ao impulso de puxar. Pressa só
    tornaria tudo pior. Aquele era um trabalho que exigia paciência. Paciência e força
    de espírito.

    Deus, o que ela estava fazendo com ele. O cabelo cor de conhaque fazia com que
    Griff ansiasse por um drinque. Ele inspirou fundo. Que erro. Ela cheirava a sabonete
    francês, pó de arroz e algodão novo. Isso o fez querer, desesperadamente, saborear
    a pele nua dela. Percorrer com a língua a encosta delicada do pescoço, até a curva
    elegante do ombro. Para então descer... Descer, descer, descer.

    – Eu havia planejado uma dúzia de maneiras de ser um desastre essa noite – ela
    disse com a voz baixa. – Pensei muito bem nelas todas.

    – Que seriam...?

    – Comer muito mais do que uma lady deveria, só para começar. Os cavalheiros detestam
    que uma lady se satisfaça.

    – Nós detestamos? – Aquilo era novidade para Griff.

    – É claro que detestam. – Ela lhe deu um olhar incrédulo. – Depois, eu iria dar
    muitas opiniões, sobre tudo. Uma lady nunca manifesta suas opiniões.

    – Isso não pode ter sido ensinado pela minha mãe. Aquela mulher nunca teve uma
    opinião que não fez questão de compartilhar com todo mundo.

    – Não aprendi isso com sua mãe. Eu li num livro. – A voz dela assumiu um tom afetado.
    – “A não ser bigodes, existem poucas coisas que cavalheiros consideram menos atraentes
    em uma lady do que opiniões políticas.” Bem, eu não consegui fazer um bigode crescer,
    mas estou preparada para fazer seis comentários ultrajantes sobre a Lei dos Cereais.

    – A Lei dos Cereais? – Ele não pôde evitar de rir.

    – Você não acha inconveniente?

    – Eu acho que você está superestimando, e muito, a capacidade dos homens conversarem
    sobre a Lei dos Cereais quando confrontados com uma visão destas.'
