- pgno: 195
  md: '– Minha lady? – Uma criada entrou na sala, parecendo constrangida. – Peço perdão,
    mas tem uma pessoa solicitando a presença da Srta. Simms.

    O coração de Pauline palpitou.

    – Se for o duque, eu...

    A criada pareceu confusa.

    – Não vi nenhum duque, madame. É uma mulher. Ela trouxe um monte de pacotes.

    Uma jovem entrou na sala de estar carregando uma torre de caixas.

    – Srta. Simms, s-sou eu.

    – Flora? – Pauline levantou. – O que está fazendo aqui? – Ela ajudou a descarregar
    os pacotes dos braços da empregada.


    Aliviada de sua carga, Flora baixou os olhos.

    – Eles me de-despediram.

    – Despediram você? Ah, não!

    – Foi o que eu mereci. Sua Graça me mandou embora sem referências, e não t-tenho
    como conseguir outro emprego. P-pensei, talvez, que se a arrumasse para o baile
    desta noite – e todo mundo ficasse tão espantado com sua beleza que isso fosse
    parar nos jornais –, quem sabe assim alguém me co-contratasse. – Ela agarrou o
    braço de Pauline.

    – P-por favor, Srta. Simms. Estaria me f-fazendo um f-favor.

    – Flora, eu gostaria de ajudar, mas não sei como. Talvez você pudesse arrumar
    Lady Rycliff ou Lady Payne.

    Flora sacudiu a cabeça.


    – T-tem que ser você. Eu quero vê-la f-fazendo isso, Srta. Simms. Você trabalhou
    tanto, a semana toda. T-todas nós t-trabalhamos. E depois tem isto. – Ela fez
    um gesto para as caixas. – Foi feito sob medida. Não vai servir em mais ninguém.

    Da caixa maior, ela retirou uma nuvem prateada deslumbrante. Oh, meu Deus. Parecia
    que a saia era três quartos do vestido. O corpete era pequeno e justo, com talas
    para mantê-lo firme e mangas bufantes muito curtas. As saias eram uma nuvem. Uma
    grande, cintilante e fofa nuvem de tule sobre cetim. Havia milhares de coisinhas
    brilhantes presas ao tule. O vestido era realmente uma maravilha.


    – Oh, Pauline – Susanna exclamou. – Se um homem conseguir olhar para você dentro
    disso e não cair de joelhos à sua frente... – a voz dela foi sumindo.

    – Ele vai ficar pasmo. – Minerva bateu palmas de alegria. – Faça isso. Por todas
    as moças que se sentiram desprezadas ou ignoradas. Esta é sua chance, Pauline.

    Pauline passou a mão pelo lindo tecido prateado, cravejado de pérolas minúsculas
    e cristazinhos. Ela não precisava provar seu valor para ninguém. Ela não precisava
    de um guarda-roupa suntuoso, nem da riqueza que acompanhava o título de duquesa.
    Mas precisava usar aquele vestido, só dessa vez. Tinha sido feito para ela. Literalmente.


    – Muito bem – ela disse. – Vamos fazer isso.

    – Uma pergunta – Susanna interveio. – Vamos contar aos homens sobre isso?

    – Não – Minerva declarou, resoluta. – Colin vai querer todos os créditos para
    ele. Esse vai ser o nosso grande sucesso. Vamos mostrar para todo mundo o que
    as mulheres de Spindle Cove podem fazer.'
