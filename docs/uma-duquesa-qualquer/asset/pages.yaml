  img_proc: true
- pgno: 72
  md: 'Del o ignorou e continuou a se dirigir à duquesa em tom de confidência.

    – É claro que não estamos totalmente de acordo. Você é a mãe dele, quer vê-lo
    casado. Como amigo, meu objetivo é diferente. Eu me conformaria vendo-o...

    – Del – Griff o advertiu.

    – ...sair de casa – Delacre concluiu, levando a mão ao peito com expressão de
    inocência. – Vendo-o sair de casa. O que você pensou que eu pretendia dizer? Você
    tem uma mente suja, Halford. Doente.

    Irritado, Griff balançou a espada, uma ameaça muda, testando o braço ferido. Com
    amigos assim...

    – Isso é ótimo. – Delacre bateu palma. – A Srta. Simms precisa ser apresentada
    à cidade. E Halford precisa usar...

    – Del.

    – ...as pernas. – Delacre levantou as mãos, bancando o inocente. – É óbvio que
    todos precisamos ir à festa dos Beaufeatheringstone, esta noite.

    – Tenho certeza de que vou dizer esta frase apenas uma vez na vida... – A duquesa
    suspirou e acrescentou: – Delacre, sua sugestão é excelente.

    – É uma sugestão terrível – Griff resmungou.

    – Até de noite, então. – Delacre recolheu suas coisas e fez uma reverência rápida.
    – Preciso ir. Tenho que incomodar três pessoas antes do chá, senão meu dia parece
    desperdiçado. – Da porta, ele apontou o dedo para Griff. – Mais tarde, você vai
    me agradecer por isso.

    Oh, irei arrancar suas tripas por isso.

    – Mas eu acabei de chegar – Pauline disse. – Não tenho nada para vestir.

    – Garota – a duquesa arqueou a sobrancelha –, você tem tão pouca fé em mim.

    Griff conhecia a mãe. Ele sabia como ela funcionava quando tinha um objetivo.
    Mas mesmo que ela conseguisse fazer a Srta. Simms parecer uma jovem lady, não
    conseguiria consertar o sotaque da garota, seu comportamento, a etiqueta deplorável
    e sua total falta de refinamento. Não em apenas um dia.

    Ele não ficou preocupado. Não muito.


    Algumas horas mais tarde, Pauline entendeu por que o duque podia gastar mil libras
    em uma semana de distração para a mãe e ainda achar o preço bom. A duquesa conseguia
    gastar essa quantia em uma tarde. Duas vezes.

    Primeiro, elas visitaram a modista – uma senhora de idade com turbante que parecia
    melhor preparada para adivinhar o futuro do que para costurar. Ela observou Pauline
    com olhos pintados, dramáticos.

    – Oh, Vossa Graça – a mulher disse, em tom de desespero. – O que é isto que trouxe
    para mim?

    – Ela precisa de guarda-roupa para uma semana – a duquesa respondeu. – Amostras
    com ajustes servem para hoje, mas vamos precisar de algo melhor para amanhã. Vestido
    matinal, de passeio e para a noite. Um vestido de baile para sexta-feira. E ela
    precisa estar arrebatadora. Sem comparação.'
