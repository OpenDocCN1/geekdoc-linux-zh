    de domingo para a manhã seguinte.

    Como sempre, o soberano de Griff foi direto para a caixa de esmolas.

    Durante a missa, Pauline podia sentir toda a curiosidade de Spindle Cove concentrada
    nela. Ela sabia que teria que responder a muitas perguntas, mas ainda não estava
    pronta. E embora tivesse conseguido retardar em vários dias sua ida à loja Tem
    de Tudo, ainda não se sentia preparada para respondê-las.

