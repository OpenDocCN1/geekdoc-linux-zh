- pgno: 89
  md: 'mulher que precisava dele ali, naquele momento.

    – Dezenove – ela repetiu. – Uma mulher feita. Eu ajudava com a fazenda e ganhava
    um salário para a família. E ele me bateu no rosto como se eu fosse uma criança,
    só por querer evoluir. Aprender. – Ela deixou a folha cair no chão. – Então ele
    jogou o livro na lareira.


    Griff soltou uma imprecação e deslizou pelo banco para mais perto dela. Ele tinha
    desistido de soltar o botão. Não dava a mínima para as pessoas na festa, para
    o que poderiam pensar ou concluir. No momento, seu único objetivo, nesse jardim
    – na vida, talvez – era protegê-la. E fazer com que ela se sentisse segura, o
    que, ele desconfiava, seria uma tarefa mais difícil. Pessoas demais tinham decepcionado
    Pauline nesse sentido.


    – Mas não teve importância. – Ela levantou o queixo, corajosa. – Eu consegui outro
    exemplar. Dessa vez, eu o escondi em outro lugar. Quando esse livro desapareceu,
    arrumei outro. E depois outro e mais outro. Até que encontrei um modo de vencê-lo
    de uma vez por todas.

    – Como?

    Um sorriso curvou os lábios dela.

    – Eu decorei o texto. Página por página, de uma ponta à outra. Guardei a coisa
    toda na memória. Ele não pode arrancar isso de mim, pode?


    Com a ponta do dedo, ele virou o rosto dela para si. Os olhos de Pauline brilhavam
    com o reflexo das tochas. Ela era linda e corajosa.

    Griff ficou assombrado com o louco caleidoscópio de emoções que Pauline inspirava
    nele. Violência, admiração, desejo ardente. A ternura que preencheu o coração
    dele era quase grande demais. Nenhuma mulher jamais fez com que ele sentisse essas
    coisas. Não todas de uma vez.


    Ele aninhou o queixo dela em sua mão e acariciou a face linda que tinha recebido
    tratamento tão abominável.

    – Você nunca mais vai voltar para esse homem.

    – Não, não vou – ela disse. – Vou ter minha própria biblioteca circulante, abastecida
    com todos os livros que uma dama recatada nunca deveria ler. – Ela deu uma olhada
    para a casa. – Assim que eu conseguir voltar para esse salão de festas e fazer
    por merecer.


    Ele estudou o perfil delicado dela, espantado com a força e a determinação gravadas
    ali. Pauline não devia saber como era impressionante. Talvez... Oh, droga. Talvez
    ele devesse dizer para ela. Abraçá-la, fazê-la olhar para ele e contar a verdade:

    Você é linda. Inteligente. Está me virando do avesso e não gosto disso. Não quero
    gostar de você. Já sofri demais com mulheres que invadiram meu coração e depois
    de uma semana me abandonaram. Mas se eu não disser essas palavras agora mesmo,
    serei o mais baixo dos seres. Então aqui vai: você é extraordinária.


    – Seu alfinete – ela disse.

    – O quê? – A mente dele deu cambalhotas. Foi como se cavalos selvagens estivessem
    arrastando seus pensamentos para Patetaburgo, na Estupidolândia e, de repente,
    parassem bem diante de um precipício assustador.'
