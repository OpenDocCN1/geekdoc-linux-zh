- pgno: 52
  md: '– Peças de teatro – ele respondeu, sem nenhum motivo especial, apenas para
    se livrar da pergunta.


    – Oh, peças. Seria bom ter algumas na biblioteca. As moças de Spindle Cove gostam
    de encenar peças. – Mantendo a colcha ao redor dos ombros com a mão, ela usou
    a outra para empurrar a escada até outro conjunto de prateleiras. – Você vai ao
    teatro com frequência?


    – Ultimamente, não.


    – Mas ia no passado, então. – Um interesse genuíno aqueceu a voz dela. – Por que
    parou de ir? Faz quanto tempo?


    A mão dele apertou um parafuso que ele estava soltando do relógio. Ninguém o questionou
    sobre isso, nem mesmo sua mãe. Primeiro, ele ficou surpreso, como se lhe jogassem
    um balde de água fria no rosto, mas depois que a afronta inicial passou, ele se
    sentiu estranhamente aliviado. Quase grato.


    Os amigos de Griff, seus colegas e os outros aristocratas do clube... todos deviam
    ter notado sua ausência da sociedade no ano passado. Mas ainda que tivessem se
    questionado quanto aos motivos e especulado entre eles, ninguém tinha lhe perguntado
    o porquê. Griff não sabia se lhes faltava coragem ou interesse.


    Pauline Simms teve a coragem. E interesse, ao que parecia. A pergunta inocente
    dela aqueceu um lugar, dentro dele, que há muito havia esfriado.


    Por um instante ele se sentiu tentado a responder, mas logo afastou a ideia. Um
    homem com a riqueza e a posição social dele nunca poderia falar de suas tribulações
    pessoais para uma atendente de taverna sem parecer um completo ridículo. A Srta.
    Simms tinha sido criada na pobreza, com uma irmã simplória para proteger e um
    pai violento do qual não podia fugir. Apesar de tudo, ela manteve o orgulho e
    um senso de humor afiado. Uma garota assim deveria ficar com pena dele, porque
    o duque perdeu a temporada de primavera no Teatro Real, quando ela nunca foi ao
    teatro nem por uma única noite?


    Pauline debocharia dele por suas lamúrias, e faria muito bem. Griff até podia
    ouvi-la: Duques e seus problemas.


    Ele começou a soltar outro parafusinho da tampa de trás do relógio.


    – Não entendo por que isso seria da sua...


    – Da minha conta – ela completou por ele. – Eu sei. Você tem razão. Não é da minha
    conta, mas não pude deixar de perguntar. É muito estranho, Vossa Graça. Mesmo
    em meio a todos esses volumes velhos e mofados da biblioteca... eu acho que você
    é o livro mais difícil de ler desta sala. Assim que acho que consegui entendê-lo,
    você me deixa confusa outra vez.


    – Simms, eu sou um homem. Não sou tão complicado.


    Ele colocou o relógio de lado, com a intenção de pôr fim àquele interlúdio literário
    e mandá-la de volta ao quarto. Mas ao erguer os olhos, ele a viu. Por completo.
    E ele perdeu a voz.


    Ela estava empoleirada no segundo degrau mais alto da escada. A colcha tinha escorregado
    e se transformado em uma nuvem macia no chão. Pauline Simms flutuava acima dela
    – um filete de mulher, coberta pela camisola de algodão mais fina que ele já'
