  md: 'Ele se deitou ao lado dela e, de repente, Pauline ficou envergonhada. Ele era
    tão perfeito em tudo. A forma ideal de homem. E ela não era a forma ideal de mulher.
    Nem de longe. Pela primeira vez, ela não se sentiu à altura dele.


    O olhar dele passeou pelo corpo dela primeiro, mas as carícias logo se seguiram.
    Ele segurou o seio dela e Pauline começou a esperar, tola que era, que ele dissesse
    que estava gostando do que via. Ela não precisava ouvir que era “linda”, “maravilhosa”
    ou “perfeita”. Algo como o “bom” tenso que ele tinha dito antes já servia.


    Quando o polegar dele encontrou o mamilo tesо dela, Griff fez algo muito melhor.
    Ele soltou um grunhido baixo de satisfação, do fundo da garganta. O som foi tão
