    e… Parou de repente, quando quase trombou com um homem vestido com elegância.

    – Sinto muito – ela começou a se desculpar. – Eu…

    Ah, saco. Casaca bem ajustada. Luvas brancas. Uma linha vermelha descendo pela
    bochecha esquerda…'
