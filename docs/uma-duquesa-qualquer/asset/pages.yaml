- pgno: 59
  md: 'Não foi nada especial? Não se preocupar com qualquer atração?

    Era incrível como aquela garota sabia acabar com o orgulho dele. Griff pensou
    em dar um abridor de cartas para ela e dizer-lhe que continuasse a eviscerá-lo.

    Ela se abaixou para pegar o livro que tinha derrubado e o apertou junto ao peito,
    preparando-se para sair.

    – Boa noite, Vossa Graça.

    *Deixe-a*, ele disse para si mesmo. *Deixe-a ir.*

    – Você não pode se basear nesse beijo. – Ele deu um passo à frente, abandonando
    a lógica e o bom senso, caindo de cabeça na tolice completa.

    – Não posso? – ela perguntou.

    – Não. Esse não foi um beijo de verdade. Foi mais uma colisão de lábios. Se eu
    a beijasse para valer, Simms, você teria motivo para se preocupar.

    – Eu teria?


    Ele se aproximou dela devagar, falando com a voz baixa e sensual:

    – Teria. Um beijo de verdade mexeria com seus lugares mais íntimos. Faria com
    que você passasse a noite toda acordada em sua cama. Agitada, desconfortável,
    com... – Ele fez uma pausa, procurando pelo equivalente feminino de uma ereção
    latejante. – Palpitações.

    Ela ergueu a sobrancelha, achando graça, e covinhas se formaram em suas bochechas.

    – Palpitações?

    – Sim – ele disse em um tom definitivo. – Palpitações.

    Simms abafou uma risada.


    Bom Senhor. Aquilo não estava acontecendo com ele. Não aquele tipo de conversa.
    *Palpitações?* Que palavra estúpida. Mas agora ele estava envolvido e não podia
    recuar.

    Ele se lembrou de quem era o duque naquela sala. Ela era só uma atendente de taverna.
    Era hora de os dois se lembrarem disso.


    Só que ela não era *apenas* uma atendente de taverna, era uma atendente com ambições,
    um aguçado tino para os negócios, um bom gosto assustador em poesia e... curvas
    sedutoras que faziam suas mãos doerem de vontade de explorá-las.

    Ela era deliciosa. Madura como framboesas. *Ela*, veio de novo aquele sussurro
    em sua mente. *Pare com isso*, Griff respondeu.

    – Palpitações – ela repetiu.

    Ele aquiesceu. Griff nem ligava que ela estivesse debochando dele. Ele queria
    que Simms repetisse a palavra muitas vezes, porque cada repetição vinha com uma
    visão erótica da língua dela, que provocava uma loucura nele.


    Ela mordeu o lábio, enquanto refletia.

    – Eu acredito que nunca experimentei palpitações, Vossa Graça. Talvez sejam exclusivas
    de mulheres das classes mais altas. Eu não possuo esse tipo delicado de natureza
    feminina.

    – Isso é uma bobagem. – Ele deslizou a mão até a nuca de Simms, entrelaçando seus
    dedos nos fios sedosos do cabelo dela. E então a puxou para um beijo.'
