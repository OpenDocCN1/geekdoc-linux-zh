- pgno: 5
  md: 'Griff abriu os olhos lentamente. Uma pontada lancinante de dor mostrou que
    tinha cometido um grave erro. Rapidamente fechou-os de novo e pôs a mão sobre
    o rosto, gemendo. Algo de muito errado tinha acontecido.


    Ele precisava se barbear. Precisava de um banho. Talvez precisasse até vomitar.
    Mas suas tentativas de se lembrar de alguma coisa da noite passada resultaram
    em outra pontada de agonia.


    Ele tentou ignorar a dor latejante nas têmporas e se concentrou naquela espécie
    de colchão macio debaixo de suas costas. Aquela não era a cama dele. Talvez nem
    mesmo fosse uma cama... Seria uma sensação provocada por seu enjoo ou a droga
    daquela coisa estava se mexendo?


    – Griff – a voz chegou até ele através de uma névoa espessa e pastosa. Estava
    abafada, mas com certeza era feminina.


    *Pelas barbas do profeta, Halford. Da próxima vez que decidir se deitar com uma
    mulher depois de meses de seca, pelo menos fique sóbrio o bastante para se lembrar
    do que aconteceu.* Ele xingou a própria estupidez. A duração épica de seu celibato
    foi, sem dúvida, a razão pela qual se deixou seduzir por... quem quer que ela
    fosse. Griff não fazia ideia de qual era o nome ou de como era o rosto dela. Só
    tinha a vaga impressão de uma presença feminina por perto. Ele sentiu o aroma
    de um perfume indefinido do ar, do tipo que parecia ser caro. Droga. Ele precisaria
    de joias para sair daquela situação, sem dúvida.


    Algo pontudo o atingiu do lado do corpo.


    – Acorde.


    Ele conhecia aquela voz? Mantendo uma das mãos sobre os olhos, ele tateou com
    a outra. Pegou um punhado de seda pesada e deslizou os dedos para baixo, até fechá-los
    em torno de uma meia sobre um tornozelo. Suspirando um pedido indefinido de desculpa,
    deslizou o polegar para cima e para baixo.


    Um guincho de indignação feminina lhe chegou aos ouvidos, e um objeto inflexível
    atingiu sua cabeça, com força. À dor latejante no crânio, agora ele podia acrescentar
    um zunido.


    – Griffin Eliot York! Sério!


    *Maldição.* Sem se importar com a enxaqueca ou com a luz do sol, ele se endireitou
    de súbito, batendo a cabeça de novo, desta vez no teto baixo. Piscando, confirmou
    a verdade inconcebível: ele não estava em seu quarto. Nem em qualquer outro quarto,
    mas'
