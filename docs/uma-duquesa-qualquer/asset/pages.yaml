- pgno: 42
  md: 'maluca dentro dela insistia que Pauline precisava manter os lábios muito, muito
    parados... Porque aquele homem estava prestes a beijá-los.


    Pauline tinha sido beijada uma ou duas vezes. Ela sabia como o rosto de um homem
    se transformava quando se preparava para o ato. As pequenas linhas ao redor da
    boca desapareciam e a cabeça se inclinava com sutileza para o lado. As pálpebras
    ficavam pesadas, baixando o bastante para revelar os cílios escuros.


    O olhar dele se concentrou com intensidade em sua boca e ele se aproximou. Esse
    era o momento em que ela precisava fazer algo. Fechar os olhos, se desejava ser
    beijada. Ou dar um passo rápido para trás, caso não quisesse.


    Ela não deveria querer. Ela detestava pensar nas safadezas que duques mulherengos
    podiam esperar de garotas que trabalhavam em tavernas, e ela não queria passar
    uma impressão errada. Mas fazia muito tempo que ela não era beijada, e ainda mais
    tempo que não ouvia palavras tão gentis como as que ele tinha acabado de falar.


    No fim, ela escolheu uma atitude ambígua, permanecendo absolutamente imóvel. E
    ele não a beijou.


    Halford afastou a mão e passou por Pauline, continuando a descer a escada com
    passos barulhentos.


    +   - Simms, dê lembranças à minha mãe.

    +   - Mas aonde você vai?

    +   - Vou cavalgando na frente, para Londres – ele disse por sobre o ombro. –
    Esta noite.


    Griff conseguiu arrumar um cavalo jovem nos estábulos da estalagem. O animal não
    se comparava ao baio de sangue quente que tinha em casa, mas parecia forte e impaciente,
    pronto para uma cavalgada puxada pelo campo. Iria servir.


    A lua erguiase brilhante e redonda no céu, pronta para iluminar sua jornada. Griff
    pulou na sela, ignorando a finura dos arreios emprestados e a sensação de aperto
    do casaco nos ombros. Aqueles não seriam os quilômetros mais agradáveis que ele
    cavalgaría, mas conforto não era sua prioridade nessa noite.


    Ele precisava se afastar. Uma coisa muito íntima tinha acabado de acontecer na
    escadaria da estalagem. Uma coisa íntima, quente, doce, provocadora e vulnerável.
    Os lábios dela estavam tão macios, da cor de framboesas maduras. E brilhavam por
    onde ela tinha passado a língua. Tremendo de emoção. Ele poderia tê-los beijado.
    Ele quis beijá-los, mais do que queria continuar respirando.


    Santo Deus. Diabos. Ele pensava ter parado com isso. Durante meses ignorou convites
    e insinuações de mulheres de toda cidade. Uma atendente de taverna esper tinh
    a, suja de lama, coberta de açúcar, com um vestido barato e sem graça não poderia
    ser a perdição completa dele.


    Enquanto colocava o cavalo em um trote ligeiro, ele percebeu que não tinha criado
    uma estratégia muito boa para viver o resto de sua vida como o Novo, Não Muito
    Melhorado, Só Um Pouco Menos Interessante, Griffin Eliot York. Durante os últimos
    meses ele esteve absorvido demais por outras emoções para sentir qualquer privação
    sensual. As sensações moderadas que sentiu foram dominadas por exercício físico
    e uma eventual masturbação sem entusiasmo.'
