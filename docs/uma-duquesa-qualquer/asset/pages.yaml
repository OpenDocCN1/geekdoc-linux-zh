- pgno: 81
  md: 'Pauline tentou se afastar dele mas encontrou a mesma resistência. Com um olho
    na multidão curiosa, ela fitou o lugar em que a manga dele se prendia a sua lateral.

    – Ah, não.

    O vestido tinha sido ajustado com tanta pressa, que as costureiras deviam ter
    deixado um vão na costura. Quando ele a ajudou, momentos antes, o botão do punho
    do casaco enganchou em um fio solto. Estava totalmente enrolado, não dava para
