  md: 'Griff sorriu para si mesmo. Tantos anos desde que sua mulher – sua duquesa
    – trabalhou na taverna e ela ainda entrava pela porta dos fundos.


    Mesmo com duas crianças e o cabelo desalinhado, ela ainda o deixava sem fôlego.
    Todas as vezes.


    Colin se levantou em um salto.

    – Como ela está?

    – Qual “ela”? – Pauline trazia Jonathan pela mão e Rose apoiada no quadril oposto.
    – Está falando da sua mulher ou da sua filha?

    Bram bateu na mesa, triunfante.

    – Eu lhe disse que seria uma menina.

    – As duas estão bem – Pauline se apressou em dizer. – Com ótima saúde e desfrutando
    de um merecido descanso.

    – Eu... isso é... – Colin empalideceu e se deixou cair novamente na cadeira, pois
    seus joelhos não aguentaram. – Oh, Deus,

    Pauline se aproximou de Griff e inclinou a cabeça na direção de Colin.

    – Isso é efeito da bebida ou do choque da paternidade?

    – Desconfio que das duas coisas. Dê-lhe um instante, ele vai se recuperar.

    Ela soltou a mão de Jonathan e trocou Rose de lado.

    – Você fica com eles enquanto vou ver a Sally? Estou esperando um novo pacote
    de livros para a biblioteca.

    – É claro. Mas espero uma recompensa pelo trabalho.

    Ela o beijou no rosto e sussurrou, com a voz sensual:

    – Mais tarde.

    – Vou cobrar a promessa. – Ele pegou Rose nos braços e mexeu no narizinha dela.
    – Olhe para você, querida, está toda brilhando de açúcar.'
