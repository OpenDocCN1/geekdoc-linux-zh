- pgno: 66
  md: '– Pronto – ela declarou. – Veja só isso.


    Pauline olhou para o objeto. Uma coisa tricotada, sem propósito determinado, feita
    de lã amarela. Parte parecia uma touca, outra, uma luva. Mas nenhuma parte estava
    bem-feita.


    – O que é isso? – Pauline perguntou.


    – É um terror! É isso o que é. Eu nem sei como isso acontece. Não faço nada do
    tipo desde que era uma garota de 14 anos. Mesmo na época era só bordado e crochê.
    Nunca tricô. Mas toda noite, durante os últimos meses, eu me sento à noite, com
    a intenção de ler ou escrever cartas, e três horas depois aparece uma coisa deformada
    e peluda no meu colo.


    Pauline abafou uma risada.


    – Vá em frente, ria. É ridículo. – A duquesa pegou a coisa tricotada e a revirou
    nas mãos. – É uma touca para uma cobra de duas cabeças? Uma luva para três dedos
    artríticos? Nem eu sei, e fui eu que fiz essa coisa. Que vergonha. Não posso deixar
    os empregados verem, claro. Tenho que escondê-las em uma caixa de chapéu e depois
    levá-las para o Hospital dos Abandonados às terças-feiras.


    Pauline riu alto ao ouvir isso.


    – Uma vida de elegância, controle e joias, reduzida a isto. – Ela levantou a luva
    distorcida e a balançou diante de Pauline. – Isto! É um absurdo.


    – Talvez Vossa Graça devesse consultar um médico.


    – Não preciso de pó nem tônico, Srta. Simms. – A duquesa se afundou em uma cadeira
    e apertou o novelo de lã no peito. A voz dela ficou mais suave. – Eu preciso de
    netos! Bebezinhos fofos e brincalhões para absorver todo esse afeto que está crescendo
    dentro de mim. Estou desesperada por netos e não sei o que vai acontecer comigo
    se eles não vierem. Uma manhã dessas Fleur virá me acordar e me encontrará sufocada
    por um cachecol com metros de extensão. Que destino!


    Pauline pegou o tricô das mãos da duquesa e o examinou.


    – Não está tão ruim, em alguns lugares. Eu posso lhe ensinar a fazer o punho da
    forma correta, se quiser.


    A duquesa arrancou a peça de Pauline e a enfiou no bolso.


    – Mais tarde eu vou aceitar suas lições de tricô. Esta semana você vai aprender
    a ser uma duquesa comigo.


    – Mas, Vossa Graça não entende. Eu nem mesmo...


    Pauline calou a boca. Estava na ponta da língua dela a frase, *Eu nem mesmo quero
    me casar com ele.*


    Mas algo a impediu de dizer isso em voz alta. Um impulso para poupar os sentimentos
    da duquesa, ela decidiu. Nenhuma mãe gosta que maltratem seu filho, e seria impossível
    explicar por que uma atendente de taverna recusaria a oportunidade de casar com
    um duque.


    De qualquer modo, explicações não eram necessárias. O duque em questão nunca se
    casaria com ela.


    – Ele está me pagando – ela soltou, afinal. Pauline não achou justo deixar a pobre
    mulher com esperança. Afinal, Halford não a tinha feito jurar segredo. – Ele está
    me'
  merge: -1
