- pgno: 19
  md: '– Não sei do que você está falando – ele respondeu, calmo. – Estou fazendo
    exatamente o que você me pediu.

    – Seja honesto!

    – Eu estou sendo honesto. Escolhi uma garota. Aqui está ela. – O duque fez um
    gesto que foi do cabelo desgrenhado de Pauline até seus sapatos enlameados, cobrindo-a
    de humilhação. – Vá em frente. Transforme-a em duquesa.

    Então Pauline entendeu tudo. Ela era perfeita aos olhos dele. Perfeitamente horrorosa.
    Perfeitamente deselegante. Perfeitamente errada para ser uma duquesa. E ao fazer
    dela um exemplo, o duque pretendia ensinar uma lição à mãe intrometida. Que inteligente
    da parte dele. Além de ofensivo e insuportável.

    Isso é culpa sua, Pauline. Por um instante breve e maluco, você foi uma tonta.

    Ela parou de considerá-lo atraente. Mas ele continuava cheirando muito bem, maldito
    fosse.

    Houve um momento de silêncio que ninguém no salão ousou interromper. Era como
    se todas ali fossem espectadoras da partida decisiva de algum campeonato, e o
    duque tivesse marcado um ponto crítico. Todas as cabeças se viraram para encarar
    a duquesa, esperando sua próxima jogada. Mas ela não tinha nenhuma intenção de
    recuar.

    – Muito bem, então. Vamos falar com os pais da garota.

    Jogada ousada, pensou Pauline. Dois pontos para a mãe.

    – Eu adoraria. – Halford endireitou o casaco. – Mas preciso voltar a Londres imediatamente,
    e estou certo de que Simms não pode abandonar o emprego.

    – Claro que posso – Pauline disse.

    O duque e a mãe se voltaram para ela, evidentemente irritados por ela ousar interrompê-los.
    Mesmo que ela fosse o assunto da conversa.

    – Eu posso abandonar meu emprego a qualquer momento. – Ela cruzou os braços. –
    Aliás, eu não preciso de um emprego, não é? Não se vou me tornar uma duquesa.

    O duque lançou um olhar pasmo para ela. Era óbvio que ele não esperava essa reação.
    Devia imaginar que ela começaria a gaguejar, para protestar, e depois fugiria,
    corando, para a cozinha. Que azar o dele. Griff tinha escolhido a garota errada.

    Ela sabia, claro, que o duque pretendia escolher a “garota errada”, mas ele tinha
    escolhido a “garota errada” de verdade. Pauline gostava de rir tanto quanto qualquer
    pessoa, mas ela já tinha perdido muito nesse dia, e não podia abrir mão dos últimos
    fiapos de seu orgulho.

    – Sr. Fosbury – ela falou na direção da cozinha, desamarrando as tiras do avental.
    – Estou indo embora. Acredito que não volto mais hoje. Vou levar este duque até
    minha casa, para que possa pedir minha mão em casamento.

    Isso fez Fosbury emergir da cozinha, com uma expressão de espanto no rosto, enquanto
    limpava as mãos enfarinhadas no avental.

    Pauline deu uma piscada para tranquilizá-lo, depois se virou para a duquesa com
    um grande sorriso.

    – Vamos então, Vossa Graça? – Ela deu uma risadinha exagerada. – Oh, perdão. Você
    prefere que eu a chame de “mãe”?'
