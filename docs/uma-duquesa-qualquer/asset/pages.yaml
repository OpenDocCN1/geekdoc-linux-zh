  md: '– Quem disse que estou sozinho? – Ele bufou. – Não me falta companhia, se eu
    quiser.

    – Sei, sei. Você é um grande devasso e libertino. Pelo menos foi o que eu ouvi
    dizer. Mas não vi provas disso. Pelo que observei, você é apenas um homem impulsivo
    e generoso, às vezes decente, que vaga pela casa à noite, sozinho, e mexe com
    relógios velhos.

    De repente, ele estendeu o braço e a puxou para o peito.

    – Não se iluda pensando que sou um homem decente.

    Com um movimento rápido, ele inverteu as posições deles, pressionando-a com o
    peito largo contra o tronco da árvore. Ela se debateu um pouco e o tecido leve
    do vestido prendeu na casaca da árvore.

    Pauline não queria que ele percebesse seu tremor.

    – Você recusou me possuir ontem à noite – ela disse. – Não pode estar esperando
    que eu tenha medo disso agora.

    – Medo? Não. – Ele se inclinou para frente, até estarem com os rostos quase colados.

    – Espero que tenha prazer.

    Ele tomou a boca de Pauline em um beijo profundo e exigente. Sua língua envolveu
    a dela, e ele inclinou a cabeça para mergulhar ainda mais fundo. Explorando-a,
    possuindo-a de forma implacável. E ele não ficou nisso. Sua mão deslizou até o
    corpete dela, envolvendo seu seio. Oh, céus.

    Ele apertou o volume aumentado com enchimento, levantando-o e acariciando-o. O
    polegar dele foi para frente e para trás, procurando o mamilo. O enchimento o
    frustrou. Ele desistiu, praguejando, e puxou o decote para baixo, tentando fazê-lo
    descer.

    Ela prendeu a respiração. Ele não podia estar querendo fazer isso ali... Ou talvez
    pudesse.

    Com um movimento firme e decidido, ele pegou o que tanto queria e levantou, colocando
    o seio acima do limite do corpete, expondo-o ao ar frio da noite. Estava escuro,
    mas ela se sentiu como que jogada em uma vitrine, vulnerável e trêmula.

    Ele a beijou de novo, explorando sua boca com passadas possessivas da língua.
    Enquanto isso, acariciava o mamilo com o polegar. As carícias habilidosas destruíram
    toda determinação e bom senso dela. De algum modo, em meio às fagulhas deliciosas
    e aos arrepi os de êxtase, um objetivo simples começou a se formar dentro de Pauline:
    dessa vez ela também queria tocá-lo.

    Pauline deslizou as mãos enluva das por dentro do casaco dele, sentindo os músculos
    definidos e duros do tronco. Mesmo por cima do casaco, a força daquele corpo era
    palpável.

    Ela puxou a camisa para fora da faixa na cintura e colocou as mãos por baixo.
    Ele grunhiu, encorajando-a, enquanto ela passava as mãos pelos músculos abdominais
    e pela leve trilha de pelos no centro. Então ela subiu com as mãos, roçando o
    mamilo de Griff e parando sobre o coração impetuoso dele.

    Bum. Alguma coisa explodiu. Ela sentiu a onda de choque no peito dele e pensou
    que pudesse ser seu próprio coração. Então, clarões no céu iluminaram o espaço
    entre eles. Ela riu de si mesma quando entendeu o que acontecia.'
