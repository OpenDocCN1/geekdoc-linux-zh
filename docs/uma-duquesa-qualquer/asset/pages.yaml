  md: '– Fogos de artifício.

    Claro. Com uma última passada de seus lábios nos dela, ele levantou a cabeça.
    Ela segurou a respiração, esperando que ele falasse, mas Griff não disse nada,
    só ficou olhando para ela, do mesmo modo que naquele primeiro dia em Spindle Cove
    – como se ela fosse a coisa mais maravilhosa, terrível, intrigante e perfeita
    que ele já tinha contemplado.

    Não, não. Aquilo era demais.

    Pauline sentiu as batidas do coração dele na palma da mão. Ele conservou o seio
    pequeno dela na sua. E acima deles, os malditos fogos de artifício explodiam em
    fragmentos de ouro e prata.

    A força daquele momento foi estarecedora. Sem a proteção de um beijo, ela não
    podia esconder seus sentimentos. Não havia para onde olhar, a não ser diretamente
    nos olhos dele.

    O pulso dela palpitava incoerente, mas não havia hesitação no ritmo sob sua mão.
    Nenhuma dúvida. Apenas uma batida forte e insistente de desejo.

    Pauline, ela podia imaginar o coração dele dizendo. Pauline, Pauline, Pauline.

    Aquilo não devia estar certo. Tinha que ser outra coisa.

    O mais provável era: Tonta, tonta, tonta.

    Ali perto, amor era um buraco nefasto que se abria na terra, ficando maior a cada
    instante. A menos que ela tomasse muito cuidado, com certeza cairia dentro dele.

    – Griff – ela sussurrou. – Você precisa de alguém. Todo mundo precisa.

    Com um movimento impaciente, ele subiu o corpete dela, cobrindo o seio, então,
    se afastou.

    – Você não entende disso. – As palavras dele soaram sombrias e irritadas. – Não
    me diga que eu preciso de alguém. Minha vida toda foi uma coleção interminável
    de alguéms. Outro “alguém” é exatamente o que eu não preciso. O que eu menos quero
    é ficar em uma sala cheia de mulheres patéticas, sem graça, e escutar, “é seu
    dever casar, Halford. Escolha alguém”.

    Ela se afastou dele, ferida.

    – Oh. Entendo.

    Griff praguejou.

    – Não foi isso que eu...

    – Não, você tem razão. – Ela se afastou com passos pequenos e apressados. – Escolher
    uma garota sem graça em um salão lotado. Que pesadelo. Nada de bom poderia sair
    de uma cena como essa.

    – Pauline, espere.

    Ela se virou e correu, deixando-o no bosque sombrio e emergindo em uma clareira
    onde uma multidão tinha se reunido para assistir aos fogos. Pauline parou, de
    repente, com dificuldade para respirar. À volta dela, as pessoas riam, aplaudiam
    e soltavam exclamações de alegria.

    Um homem trombou nela, com força. A antiga Pauline teria reagido com uma cotovelada,
    mas nesse momento ela não teve disposição para tanto. Apenas se virou para'
