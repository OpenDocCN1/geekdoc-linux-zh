- pgno: 78
  md: '– É claro – o duque respondeu.

    – Mas... faz vários anos que sirvo aristocratas em Spindle Cove. Todas me conhecem
    pelo nome. E se alguma delas estiver aqui, esta noite?

    – Simms é um nome comum. E Sussex é um lugar grande.

    – Elas têm olhos, além de orelhas. E se alguém me reconhecer?

    – Então a verdade virá à tona, o jogo ficará mais interessante e todos vamos rir
    às custas da minha mãe. – Ele endireitou o casaco. – Mas, falando sério, do modo
    que você está hoje? Ninguém irá reconhecê-la.


    Ele a mediu com um olhar demorado e possessivo. E, pela primeira vez nessa noite,
    Pauline pôde ver Halford bem iluminado e sem pressa.


    Minha nossa. Fazia três dias que eles se conheciam. Podia mesmo ser essa a primeira
    vez que ela o via recém-banhado, barbeado e bem-vestido?


    Parecia que sim. Se pudesse pensar que esses cuidados básicos não poderiam melhorar
    muito a atração masculina que ele exercia... mas melhorou. E como. O casaco preto
    e as calças creme ajustavam-se no corpo dele como uma segunda pele, abraçando
    cada contorno de seus ombros largos e suas coxas musculosas. Os pequenos toques
    de elegância – o rosto bem-barbeado, o cabelo penteado e a gravata ornamental
    – serviam para enfatizar a força bruta que jazia por baixo de tanto refinamento.


    Ele estava mais lindo do que nunca. E o cheiro dele... Oh, ele tinha o aroma de
    um cheiro excitante e febril. Quando Halford se aproximou, ela inspirou. Aquela
    colônia almiscarada inebriante – o criado pessoal dele devia usá-la nas camisas,
    ao passá-las –, estava misturada com aromas de sabão e pele limpa de homem.


    O que mais a abalou foi o brilho de fome no olhar dele enquanto a admirava. Como
    se fosse uma fera medindo sua presa. Avaliando o ponto mais macio para cravar
    seus dentes.


    *Será que ele havia se alimentado hoje?*, ela se perguntou, de modo repentino
    e absurdo. Mas ela se deteve antes de fazer a pergunta a ele. Parecia uma pergunta
    zelosa demais para se fazer, e ela não estava ali para zelar por ele. Não importa
    o quão tentador fosse. *Lembre-se disso, Pauline.*


    – Como está seu braço? – ela arriscou sussurrar. Ela não pôde evitar de se preocupar
    um pouco.

    – Está bem. Não foi nada.

    – Mas eu o vi sangrar.


    Ele dispensou a preocupação dela com um gesto rápido da mão.

    – Não se preocupe com meu braço, Simms. Precisamos conversar sobre seus seios.

    O rosto dela ficou quente como brasa. Pauline olhou ao redor para ver se ninguém
    tinha ouvido.


    – Eles parecem ter inchado e dobrado de tamanho. – Ele os avaliou descaradamente.
    – Eu deveria chamar um médico. Isso não pode ser saudável.

    Pauline corou novamente.

    – Você sabe muito bem que isso é efeito do espartilho. Minha saúde é perfeita.

    A não ser por aquelas palpitações desagradáveis no peito. E pela dificuldade repentina
    de respirar na presença dele.'
