- pgno: 18
  md: 'Perfeita? Pauline olhou pela janela, esperando que um porco entrasse voando
    por ali. Um porco tocando lira e falando galês.


    O cavalheiro andou na direção dela, deslizando confiante pelo salão. Enquanto
    ele se aproximava, cada passo pesado e rítmico a tornava mais consciente do cabelo
    desgrenhado, coberto de açúcar, e da barra do vestido suja de lama. Pauline procurou
    se acalmar com os sinais da humanidade imperfeita dele. Mais de perto, dava para
    ver que a barba estava por fazer e que seus olhos estavam vermelhos – por pouco
    sono ou muita bebida, ou ambos.


    Pauline inspirou lentamente. As roupas dele carregavam o aroma evanescente de
    alguma colônia almiscarada masculina. Esse aroma a envolveu, aquecendo-a em lugares
    secretos e baixos.


    – Diga-me seu nome – ele disse em uma voz baixa e... magnética, aparentemente.
    Ela sentiu que cada pessoa daquele salão se inclinou na direção dele, para entender
    melhor suas palavras.

    – Meu nome é Pauline, senhor. Pauline Simms.

    – Sua idade.

    – Vinte e três.

    – Você é casada ou noiva?

    – Não, senhor. – Ela engoliu uma risada de espanto. – Não sou.

    – Excelente. – Ele inclinou a cabeça. – Eu sou Griffin Eliot York, 8º Duque de
    Halford.

    Um duque?

    – Oh, Senhor – ela murmurou.

    – Na verdade, Simms, o que você deve dizer é “Vossa Graça”.

    Ela baixou os olhos para as tábuas do chão e fez uma mesura desequilibrada.

    – Vossa Graça.

    Com um aceno, ele dispensou a tentativa dela de mostrar deferência e continuou:

    – Minha mãe está cada vez mais impaciente com minha condição de solteiro. Ela
    me instruiu a escolher qualquer mulher desta sala, com a promessa de que conseguiria
    transformá-la em uma duquesa. Eu escolhi você.

    – Eu?

    – Sim. Você é perfeita.

    Perfeita. Essa palavra de novo. A cabeça de Pauline não conseguia lidar com tudo
    isso ao mesmo tempo. Ela precisava dividir a informação em blocos menores. Aquele
    homem incrivelmente atraente, autoconfiante e cheiroso era o 8º Duque de Halford.
    Dentre todas as mulheres daquela sala, ele escolheu a atendente, ela própria,
    para ser sua futura duquesa. Você é perfeita.

    Arrepio correram da nuca de Pauline até a sola de seus pés, deixando-a sem fôlego.
    Ou o mundo todo tinha virado de cabeça para baixo, ou depois de 23 anos nunca
    sendo boa o bastante... aos olhos de um homem... aos olhos daquele duque... ela
    era perfeita.

    A duquesa lançou um olhar frio para o filho.

    – Desnaturado. Você vive para me contrariar.'
