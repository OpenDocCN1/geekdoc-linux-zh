- pgno: 46
  md: 'O interior da casa era igualmente impressionante. Pinturas em cada espaço disponível
    das paredes, relógios requintados badalando as boas-vindas, estofamento suntuoso
    em qualquer lugar que uma pessoa pudesse pensar em se sentar. Era realmente demais
    para assimilar tudo com os olhos, mas ela não precisava. Pauline podia sentir
    a elegância daquela casa na sola dos seus pés. O piso de madeira era lixado e
    encerado com maestria, e os carpetes... ah, os carpetes eram tão espessos e macios
    que faziam seus passos suspirar de gratidão.


    Pauline foi apresentada à governanta, Sra. Thomas – uma mulher que, em qualquer
    outra circunstância, teria lhe dado um balde e um escovão, mandando-a esfregar
    o chão. Mas hoje ela recebia Pauline como hóspede. Até mesmo fez uma mesura.


    – Deixe-me lhe mostrar seu quarto, Srta. Simms.


    Enquanto seguia a governanta, Pauline desejou deixar uma trilha de migalhas de
    pão, porque nunca encontraria o caminho de volta sozinha. Direto, a partir da
    entrada, subir a escada, à direita no alto, fazer a curva para chegar ao segundo
    lance da escada mais estreito; então à esquerda no corredor com lambris – o com
    papel de parede com padrão verde... ou seria azul? Seria mais fácil à luz do dia.


    Ela contou as portas ao passar. Uma, duas, três... Quando a governanta parou diante
    da quarta porta, tudo era um grande borrão. O quarto estava escuro e ela ficou
    grata por permanecer dessa forma.


    Pauline aceitou ajuda para se despir, ficando de roupa íntima para limpar a poeira
    da viagem de seu corpo. Em seguida, subiu na cama mais macia e quente em que já
    tinha se deitado. Enquanto fechava os olhos e esticava as pernas para as profundezas
    calorosas das cobertas, teve a vaga noção de que alguém esteve ali com carvão
    em um aquecedor de cama momentos antes de ela entrar. Que serviço excelente. E,
    pela primeira vez na vida, Pauline o estava recebendo. Teria sido tolice tentar
    fazer aquilo parecer real, então ela caiu de bom gosto no mundo dos sonhos.


    Durante várias horas ela não soube de mais nada.


    ![](img/e16abfb78f72d386c109b7189996bde4_46_0.png)


    Ela acordou na escuridão e percebeu que não conseguiria voltar a dormir. Deveria
    estar se sentindo exausta... E estava, na verdade. Suas juntas doíam devido às
    longas horas na carruagem, ainda que a suspensão do veículo fosse macia, e a cabeça
    dela estava sobrecarregada de tentar abarcar tantos conceitos incríveis. Mas ela
    simplesmente não conseguiu dormir.


    Estava na casa de um duque. Mas é claro que um duque não a chamava de casa, certo?
    Casa era uma palavra muito comum e humilde. Ele devia chamá-la de “residência”.
    No campo, era uma “propriedade”. Mansão Sei Lá o Quê, Castelo Faz-de-conta.


    Ela puxou um canto da tapeçaria pesada que cobria o dossel e espiou o quarto escuro.
    Felizmente, a lua estava quase cheia, e o brilho leitoso que entrava pelas janelas
    (eram três janelas em um quarto só!) fornecia luz suficiente para que ela pudesse
    ver o quarto que sua exaustão, antes, a tinha impedido de explorar. Conseguiu
    enxergar até o pé da cama e o banco forrado encostado nela, e o carpete macio
    e bordado, seus vermelhos e dourados orientais suavizados pela noite. O padrão
    de lótus parecia se estender por'
