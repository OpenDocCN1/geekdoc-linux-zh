- pgno: 17
  md: '# Capítulo dois


    O príncipe de outra garota chegou. Esse foi o primeiro pensamento de Pauline quando
    entrou, apressada, e avistou o cavalheiro bem-vestido à frente da porta. Ela via
    isso acontecer de tempos em tempos naquela vila. As jovens aristocratas buscavam
    refúgio em Spindle Cove pelas razões mais estranhas. Faltava-lhes refinamento
    ao tocar harpa, ou a cor de seus olhos não estava na moda, na Corte, nessa temporada.
    E então – para completo espanto de todas, a não ser de Pauline –, algum belo conde,
    visconde ou oficial aparecia e se casava com elas. Nenhum deles sequer olhava
    para a atendente da taverna.


    Assim, qual lady esse cavalheiro buscava? Quem quer que fosse, estaria com a vida
    ganha. Tudo na aparência daquele homem – dos botões de marfim às perfeitas luvas
    de couro – anunciava sua riqueza como se através de trompetes. E se as roupas
    dele gritavam “fortuna”, tudo dentro delas anunciava poder. Era fácil para um
    cavalheiro ficar mole e barrigudo, mas não esse. O casaco verde-escuro, sob medida,
    revelava ombros largos e músculos definidos nos braços. O rosto era forte, também.
    O nariz tinha uma inclinação ousada, o maxilar era anguloso e a boca, confiante.
    Não havia nada de bonito em suas feições, mas observadas em conjunto, exerciam
    uma inegável atração masculina.


    Resumindo, não era difícil olhar para aquele homem. Mas, mesmo que fosse, Pauline
    não conseguiria desviar seus olhos, porque ele também não tirava os olhos dela.
    E o modo como ele a encarava – como se ela fosse a resposta para todas as perguntas
    que ele nunca pensou em fazer – colocou seu coração em um ritmo mais acelerado
    que o de uma lebre aprisionada.


    – Ela – ele declarou. – Eu fico com ela.

    – Você não pode escolhê-la – uma mulher mais velha respondeu, evidentemente irritada.
    – Essa é a atendente.


    Pauline deu um breve olhar para a mulher, classificando-a como uma senhora grisalha
    de pequena estatura, mas grande presunção. Ela tinha a coluna ereta, o que era
    bom, para sustentar a quantidade indecente de joias que trazia no pescoço.


    – Ela é uma garota – o homem respondeu, calmo, ainda olhando para Pauline. – Ela
    é uma garota e está nesta sala. E você disse que eu podia escolher qualquer garota
    desta sala.

    – Ela não estava na sala quando eu disse isso.

    – Mas está na sala agora. E agora que eu a vi, não tenho olhos para ninguém mais.
    Ela é perfeita.'
