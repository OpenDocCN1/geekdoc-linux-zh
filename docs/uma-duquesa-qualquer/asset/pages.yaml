- pgno: 133
  md: '– Como eles fazem isso? – ela perguntou. – Como acendem todas ao mesmo tempo?

    – Há um sistema de estopins – ele explicou. – Só precisam acender uns poucos e
    a chama corre até todas as lamparinas.

    – É mágico – ela disse.

    – É... – ele confirmou, a voz suave. – Acho que é mesmo.


    Ela se virou para o duque, sentindo-se tonta com a beleza daquilo. Ele não estava
    olhando para os milhares de globos iluminados e pendurados nas árvores. Ele olhava
    para ela.


    Um arrepio passou pelos ombros nus de Pauline, que cruzou os braços para se aquecer.

    – Permita-me – ele disse, colocando as mãos enluvadas sobre os braços dela, para
    depois massageá-los.

    O couro quente e macio deslizou pelos braços nus dela. Foi um gesto encantador,
    mas não ajudaria em nada para controlar seus arrepios.

    Com o olhar, ele acariciou a boca de Pauline.


    – Talvez tenha sido um erro vir até aqui.

    – Não – ela insistiu, esperando que suas palavras não fossem abafadas pelo martelar
    enlouquecido de seu coração. – Não, eu prometo que consigo fazer isto.

    – Halford! – a voz chegou até eles através do arvoredo. Ela se virou e avistou
    Lorde Delacre acenando da colunata. – Venham logo. Nós temos um reservado logo
    ali.

    – Essa é a minha deixa – ela disse, dando uma piscada para Griff. – Está na hora
    de eu fazer por merecer minhas mil libras. Prepare-se para o desastre.


    ![](img/e16abfb78f72d386c109b7189996bde4_133_0.png)


    Eles caminharam até o conjunto de colunas e encontraram o reservado de Del. Pauline
    escapuliu para se misturar com o grupo. Griff a observou rir e fazer piada, beber
    champanhe e devorar fatia após fatia de presunto fino.


    Por sua vez, Griff ficou de lado, bebericando conhaque em sua garrafa de bolso
    e aceitando, enfim, uma verdade dolorosa: ele precisava encontrar novos amigos.


    Martin estava com sua cantora boêmia a reboque e Delacre estava de novo com aquela
    viúva. Algumas prostitutas bem-vestidas aguardavam por perto, esperando que enchessem
    seus copos para poderem seguir em frente. Mesmo sem se esforçar, Pauline era a
    mulher mais refinada do local. Se ela fizesse alguma observação inoportuna sobre
    a Lei dos Cereais, ninguém se importaria.


    Todos os camaradas mais ou menos decentes que faziam parte do círculo de amizades
    de Griff tinham se afastado nos últimos anos – casando, assumindo seu título,
    acomodando-se. Griff também teria gostado de se afastar – sem ter que se casar
    –, mas é mais difícil deixar um círculo quando se é o centro dele.


    – Quando você vai abrir Winterset Grange este ano, Halford? – Martin perguntou.
    Estava com um braço jogado sobre os ombros empoeirados de sua amante. – A Ruby
    aqui gosta de uma temporada no campo. Ela vai levar amigas. Amigas muito amistosas.

    A loira cheia de ruge lhe deu um sorrisinho tímido.'
