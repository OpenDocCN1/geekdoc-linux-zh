  md: '– Receio que não, Vossa Graça. Sou completamente errada para a posição de duquesa.

    – Ela deu um sorriso maroto para Halford.

    Mas em vez de corresponder com um sorriso, ele a olhou com uma expressão fria
    de desaprovação. Pauline não entendeu aquele olhar, que a perturbou.

    – Srta. Simms – a duquesa continuou –, não existe uma combinação mágica de qualidades
    que compõem uma duquesa bem-sucedida. Beleza é útil, mas não essencial. Inteligência
    também é desejável. Note que eu disse inteligência, não esperteza. Esperteza é
    como ruge; usado em demasia faz a mulher parecer comum e desesperada. Inteligência
    é saber como aplicá-lo.

    O duque se reclinou na cadeira. Ele parecia ter abandonado a refeição para encarar
    Pauline com aquele olhar intenso.

    Ela pegou uma garfada de batatas, obscena de tão grande, e a enfiou na boca. Não
