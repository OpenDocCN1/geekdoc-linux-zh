- pgno: 76
  md: 'Quatro anáguas. Pauline nunca sonhou que uma mulher pudesse usar quatro anáguas.
    Principalmente todas ao mesmo tempo.

    Observando seu reflexo no espelho, ela decidiu que seria mais correto dizer que
    as anáguas é que a vestiam. Suas saias cor-de-marfim a deixavam tão grande que
    ela não sabia se passaria pelo vão da porta. Ela pensou que teria sorte se sobrevivesse
    à noite sem atropelar cachorros ou criancinhas. Que Deus a ajudasse caso ela precisasse
    se aliviar.


    Conforme Fleur dava os últimos retoques em seu cabelo, Pauline encarava melancolicamente
    uma xícara de chá. Aquela seria uma noite longa e sedenta.

    – Escute-me com atenção – a duquesa disse. – Há muita coisa em jogo esta noite.

    Pauline concordou.

    – Se você deseja conquistar a admiração da Sociedade, todos precisam vê-la. Nada
    de se esconder nos cantos ou atrás dos vasos de palmeiras.

    Lembrete: ser a melhor amiga dos vasos de palmeiras.

    – Mas embora seja imprescindível ser vista, é menos importante ser ouvida. Converse
    com as mulheres, mas não demais. Isso também vale para os cavalheiros, mas em
    dobro.

    Qual parte? Conversar, ou não demais?

    – Esta noite, você vai aparecer diante da nata da sociedade londrina. Deixe que
    a vejam como uma jovem dona de certo frescor. Uma pétala translúcida, envolta
    em mistério. Alguém que as pessoas adorariam dizer que conheceram, mas isso não
    aconteceu de verdade. Está me entendendo?

    Ah, sim. Completamente.


    No corredor, ela diminuiu o passo. Pauline não estava acostumada a usar saias
    tão pesadas, nem sapatos de salto. Seu modo de andar lembrava o de um potro recém-nascido,
    com pernas bambas. Talvez um potro recém-nascido e bêbado de aguardente.

    Ao se aproximar da escada, o salto do sapato enganchou na borda do carpete, quase
    jogando-a no chão. Pauline se segurou em um aparador e sofreu durante vários segundos,
    em pura agonia, enquanto uma pastorinha de porcelana se balançava para frente
    e para trás, decidindo se cairia ou não.

    – Srta. Simms. – Vários passos à frente, a duquesa se virou para encará-la. –
    Esqueceu como se anda?

    – Eu sei andar – ela grunhiu para a pastorinha sorridente. – Só não sei como fazer
    isso vestindo todas estas coisas.

    – Primeiro, fique ereta.'
