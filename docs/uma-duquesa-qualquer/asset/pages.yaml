  md: 'Quando o duque e a duquesa viraram os olhos curiosos para ela, Pauline apontou
    um dedo para a Bíblia e acrescentou:

    – Aleluia.

    Por que ninguém naquela família conseguia conversar? Durante toda a temporada
    eles moraram na mesma casa, jantaram na mesma mesa... mantendo todos aqueles segredos.
    A duquesa estava desesperada para reconfortar alguém. Enquanto isso, seu próprio
    filho precisava de uma boa dose de conforto. Pauline foi pega no meio disso, tornando-se
    confidente de todos, mas obrigada, por eles, a jurar segredo. Aquilo era um sofrimento.

    Eles eram privilegiados de tantas formas – ricos, poderosos, admirados por seus
    pares. Mas, principalmente, eles tinham muita sorte apenas por terem um ao outro.
    A única coisa que atrapalhava era aquela fleuma aristocrática.

    – Lorota – ela murmurou.

    Griff estalou os dedos para ela.

    – Versículo.

    – Hein?

    – Capítulo e versículo. – Ele esticou o pescoço, olhando por cima do ombro dela.
    – Eu gostaria de saber onde, exatamente, na carta de São Paulo aos Efésios, ele
    usa a palavra “lorota”.

    Ela se virou na cadeira, escondendo a Bíblia dele.

    – Está anotada na margem. – Ele não era o único que sabia desconversar.

    – Alguém escreveu na Bíblia da família?! – A duquesa arqueou uma sobrancelha para
    Griff.

    – O quê?! – ele exclamou. – Não fui eu. Você sabe que eu nunca leio isso.

    – Humpf. – A duquesa tocou a sineta e, quando a criada apareceu, instruiu-a a
    trazer todos os empregados até a sala matinal.

    Depois que todos estavam alinhados em uma fila perfeita, de Higgs, o mordomo,
    até Margaret, a copeira, Sua Graça se dirigiu a eles.

    – Alguém vandalizou as Sagradas Escrituras. Que o vândalo se apresente.

    Ninguém se manifestou, claro. Então Pauline falou:

    – Eu inventei isso – ela disse, levantando-se da cadeira. – E tem mais uma coisa
    que Vossa Graça deveria saber. O duque está escondendo algo de você.

    A sala ficou em silêncio absoluto, e o olhar que Griff deu para ela... oh, gelou-a
    até a medula. Ele a encarou de forma dura, transbordando raiva e ressentimento.
    Não ouse, dizia o olhar.

    Ela soube, naquele instante, que se quebrasse sua promessa e revelasse a verdade
    da filha dele, Griff jamais a perdoaria. Não faria diferença o fato de ele gostar
    dela, nem o prazer que sentiram na noite passada. Ele a removeria por completo
    de sua vida, mesmo que a sensação fosse de amputar um braço.

    Ela engoliu em seco.

    – As ametistas – ela sussurrou. – O duque foi bondoso ao tentar me proteger, mas
    ele não está contando toda a verdade, Vossa Graça. O fecho não quebrou sozinho,
    um ladrão arrancou o colar do meu pescoço.

    Os criados reunidos soltaram uma exclamação.'
