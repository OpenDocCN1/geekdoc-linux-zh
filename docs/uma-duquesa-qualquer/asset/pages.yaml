    – Eu quero ir para casa – ela disse. – O quanto antes for possível.

    – Vá ao baile primeiro – Minerva pediu.

    Pauline meneou a cabeça.

    – Eu tenho que estar de volta a Spindle Cove amanhã. Eu prometi para minha irmã.

    – Você pode fazer as duas coisas. A carruagem do correio é o modo mais rápido
