- pgno: 16
  md: 'Jogando o cabelo de lado para distribuir igualmente as mechas cor de conhaque,
    ela virou o rosto e cuspiu de lado o último grampo.


    – Saco – ele a ouviu murmurar.


    De repente, Griff se pegou segurando um sorriso. Ela era perfeita. Grosseira,
    sem instrução, completamente deselegante. Um pouco bonita demais. Uma garota mais
    sem graça serviria melhor aos seus propósitos. Mas apesar da beleza, ela teria
    que servir.


    – Ela – ele declarou. – Eu fico com ela.'
