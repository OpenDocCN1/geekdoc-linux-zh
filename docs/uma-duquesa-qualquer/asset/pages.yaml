- pgno: 63
  md: '# Capítulo sete


    No meio da manhã seguinte, Pauline tinha reunido uma lista e tanto das coisas
    que duquesas não faziam. Duquesas não xingavam, não cuspiam, nem se serviam à
    mesa; elas não se curvavam em nenhum sentido da palavra, nem falavam de seus órgãos
    internos em público. Mas, do lado positivo, duquesas não tinham que ajudar nas
    tarefas do lar. Elas não tiravam água do poço, não alimentavam as galinhas, não
    ordenhavam as vacas, nem corriam atrás de um leitão solto no quintal. Duquesas
    não faziam seu próprio café da manhã nem o de ninguém. Essa parte era ótima.


    E quando a Duquesa de Halford invadiu seu quarto, Pauline acrescentou mais um
    item à lista: Duquesas não batem na porta.


    Ela tomou um susto e enfiou o manual de contabilidade debaixo do travesseiro antes
    de levantar da cama. Não queria explicar como aquele livro tinha chegado em suas
    mãos. Mesmo tendo passado as últimas duas horas revivendo a cena na memória. Oh,
    aquele beijo. Seus lábios ainda formigavam.


    – Fico feliz por ver que está acordada – a duquesa disse –, ainda que tão cedo.


    Tão cedo?


    – São quase 11 horas manhã. Estou acordada há séculos. – Nunca, em toda sua vida,
    Pauline dormiu além das 6 horas da manhã. Ela virou a cabeça e olhou pela janela.
    – Metade do dia já passou.


    – Você está acostumada com o horário do campo. Nós utilizamos uma programação
