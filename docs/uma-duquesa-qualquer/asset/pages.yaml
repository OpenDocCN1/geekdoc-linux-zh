- pgno: 48
  md: 'para a reentrância de madeira de uma porta. Uma, duas, três... ela contou seis
    antes de parar. Já deveria ter chegado à escadaria.


    Um clarão repentino a congelou onde estava. Congelou seu coração, também. Que
    Duque de Halford fantasmagórico do passado era aquele? Abaixando-se, ela ergueu
    a mão para proteger os olhos da chama ofuscante e semicerrou os olhos, espiando
    por entre os dedos entreabertos.

    – Simms?

    Ela encontrou o 8º – e único vivo – Duque de Halford assombrando a própria casa.
    Ele trazia uma lamparina em uma das mãos. Com a outra, fechou uma porta, e Pauline
    ouviu uma chave girar na fechadura.

    – O que você está fazendo? – ele quis saber, guardando a chave no bolso.

    O tom raivoso dele a surpreendeu.

    – Boa noite também, Vossa Graça. Minha viagem até Londres foi ótima, obrigada.

    Mas ele não quis saber de brincadeiras.

    – Por que você está xeretando meus aposentos particulares?

    – Eu não sabia que estes eram seus aposentos particulares. E não estava xeretando.
    Eu virei no lugar errado, só isso. Vou voltar por onde vim. – Ela se virou para
    ir embora.

    Ele a pegou pelo braço, fazendo-a se virar para encará-lo.

    – Foi minha mãe que mandou você fazer isso?

    Pauline nem soube como responder. Mandou-a fazer o quê? Dormir? Virar no lugar
    errado em uma casa imensa e escura?

    – Você está tentando roubar alguma coisa? Responda com uma palavra.

    – Não. – Ela endireitou as costas.

    – Então é melhor se explicar. Você está de pé quando deveria estar dormindo, em
    um corredor que não tem motivo para visitar. – Ele levantou a lamparina e a examinou.
    – E você está com uma expressão de culpa no rosto.

    – Bem, você tem uma expressão de arrogância e engano no seu.

    Isso não era bem verdade. A lamparina iluminava as superfícies bem marcadas do
    rosto dele e jogava sombras de cansaço sob seus olhos. O castanho de suas íris
    estava dominado por um preto frio e vazio. Ele não tinha nada de arrogante, não
    naquele instante.

    O que quer que ele estivesse fazendo naquele quarto trancado, era particular.
    Ela o tinha surpreendido em um momento de fragilidade. E como um homem grande
    e forte como ele não podia admitir que tinha seus momentos de fragilidade, ele
    a faria se contorcer e gemer.

    Pauline suspirou.

    – Duques e seus problemas.

    – Não gosto da sua impertinência, Simms.

    – Ah, mesmo?

    Halford a puxou para perto e ela sentiu o coração disparar. Seu pé descalço roçou
    o dele. O choque do contato viajou por todo o corpo dela.

    – Minha impertinência é o motivo de eu estar aqui, lembra? Foi por causa dela
    que você me escolheu em um salão repleto de mulheres bem-nascidas. Porque eu sou'
