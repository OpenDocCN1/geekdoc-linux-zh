- pgno: 69
  md: 'musculatura se revelava através do tecido branco e úmido, o que lhe dava a
    aparência de uma escultura de mármore ganhando vida. Braços, ombros, pernas, bunda...
    O físico dele era todo lindo.


    O oponente mascarado disparou uma estocada em direção ao tronco do duque, mas
    este a desviou com um movimento ágil de sua lâmina e contra-atacou. Suas investidas
    e estocadas possuíam a elegância de uma dança, carregada de força mortal.


    Enquanto os dois duelavam, as paredes ecoavam os sons impressionantes do aço cortando
    o ar e das lâminas estalando uma contra a outra. E o mais empolgante de tudo,
    os grunhidos de homens atléticos, causados por seu esforço físico. O espaço todo
    vibrava com energia viril.


    Se Pauline vinha sofrendo de palpitações desde o beijo, aquela cena levou essas
    sensações a algo ainda mais profundo. Oscilações? Abalos? Ela preferia não encontrar
    um nome para isso.


    No centro da sala, os homens travaram as espadas. A ponta brilhante estava a centímetros
    do rosto de Halford e, ao contrário de seu oponente, ele não usava uma máscara
    de metal para se proteger. Um movimento súbito da lâmina poderia arranhá-lo ou
    cegá-lo.


    _Cuidado_, ela quis gritar. Mas a duquesa pôs a mão no braço de Pauline, contendo-a.


    Enfim, com um rugido primitivo, os dois se separaram; cada um recuou vários passos.
    Enquanto enxugava o suor da testa, o duque virou, por um breve instante, a cabeça
    na direção das mulheres. Foi o bastante. Ele a viu.


    Mesmo do outro lado do salão, Pauline sentiu o momento em que o olhar dele travou
    com o seu. O calor intenso fez sua pele formigar.


    Halford deve ter sentido mais do que um formigamento, porque enquanto ele ficou
    ali, congelado onde estava, a lâmina de seu oponente cortou-lhe o braço. Uma linha
    de sangue vermelho rapidamente manchou a camisa dele.


    – Oh! – Pauline levou as duas mãos à boca, horrorizada.


    Por sua vez, a duquesa emitiu um som de satisfação.


    – Eu diria que a experiência foi um sucesso.'
