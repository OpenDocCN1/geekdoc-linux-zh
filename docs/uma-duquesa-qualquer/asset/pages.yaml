- pgno: 144
  md: 'Era isso, então. Pauline desistiu. Ela se entregou aos cuidados dele, sem saber
    o que mais poderia fazer. Sempre se considerou uma pessoa resiliente, mas nessa
    noite ela foi derrotada.

    Londres 1, Pauline 0.

    Menos que zero. Ainda que levasse em conta as mil libras de pagamento que Griff
    tinha lhe prometido, ela agora devia milhares de libras para ele! A duquesa nunca
    a perdoaria. Como ela faria para lhes pagar tamanha dívida?

    O duque continuava agachado ao lado dela.

    – Passe os braços em volta do meu pescoço – ele disse.

    Ela obedeceu, colocando as mãos, desanimada, nos ombros dele.

    – Segure-se com firmeza – ele reclamou, praguejando. – Você é filha de um fazendeiro
