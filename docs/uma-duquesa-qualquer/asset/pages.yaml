    – Está vendo? – ele murmurou, mantendo-a perto. – Não há nada que temer. Só imagine
    que você está viajando através da caixa de ouro, pérolas e cristal do poema que
    citou. Imagine que está viajando de um mundo para outro. Outra Inglaterra. Outra
    Londres com sua Torre. Outro Tâmisa, com outras colinas.


    Ela relaxou no ombro dele.

    – Uma linda noite enluarada.

    – Isso mesmo. – E ela começou, de novo, a encantá-lo.


    Griff nunca foi do tipo sonhador, nem mesmo quando garoto. Quando ele estava com
    Pauline, contudo, o mundo era diferente. Ela o forçava a ver as coisas com novos
    olhos. De repente, a biblioteca dele era a oitava maravilha do mundo, e pinturas
    de barcos pareciam obras-primas. Um barco os transportava pelo Tâmisa em uma jornada
    épica, e um beijo... um beijo era tudo.


    Bem no fundo, por baixo da atendente de taverna que trabalhava demais e tinha
    língua afiada, havia uma mulher que ansiava por poesia em sua vida. Nunca tinham
    dado nada a ela – nem mesmo uma chance. Mas havia uma vivacidade no espírito dela
    que se alimentava de possibilidades – que Pauline absorvia como o pavio de uma
    lamparina, brilhando mais forte dessa forma.'
