- pgno: 61
  md: 'E estava mesmo. O modo como eles se encaixavam parecia tão, tão certo. Não
    mais apenas ele que a beijava, os dois estavam se beijando, tendo prazer, dando
    consolo e conhecendo o gosto um do outro.


    A boca dele ficou mais suave sobre a dela e seus movimentos ficaram lânguidos,
    lúdicos. As línguas se envolveram em uma dança lenta e sensual. Pauline agarrou
