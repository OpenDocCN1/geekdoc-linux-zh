    faria continuar, e então ela cairia de cara no chão.


    Está certo que a queda seria de menos de um metro, e sem dúvida ela sobreviveria,
    inteira e sem ferimentos. Mas quando chegou a essa conclusão, seu corpo já estava
    em movimento.


    Pondo uma mão nas costas do sofá, ele pulou o móvel com um movimento fluido. Esse
