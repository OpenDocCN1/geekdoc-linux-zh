- pgno: 132
  md: 'E esta noite? Griff inclinou a cabeça para oeste e observou o sol poente. Dali
    a menos de uma hora o mundo dela explodiria com possibilidades brilhantes. Ele
    não queria outra coisa que não estar perto dela quando isso acontecesse.


    Pauline achou Vauxhall bem impressionante. E isso antes mesmo de entrar no local.
    Quando eles desembarcaram no outro lado do rio, o estômago dela precisou de vários
    momentos para parar de balançar. Eles subiram um grande lance de escada, que subia
    da margem do rio até um grandioso portão de entrada. Quanto mais eles subiam,
    mais alta a música ficava.


    UAU!, ela pensou. Mas não disse em voz alta. E esse foi o pensamento constante
    dela enquanto passavam pelo portão e entravam nos jardins.


    Uau, uau, uau, uau!


    Ela não entendia como a natureza podia ser domesticada àquele ponto. A grama era
    perfeita em sua retidão. Os arbustos estavam podados em formas exatas. As árvores,
    plantadas em linhas retas.


    Colunatas majestosas seguiam em várias direções, marcando caminhos cobertos. Ao
    fim de cada corredor, várias pinturas estavam expostas. Daquela distância, Pauline
    não conseguiu distingui-las. Ela viu o pavilhão branco da orquestra, na forma
    de uma concha marinha gigantesca, com esculturas e todo tipo de decoração.


    De repente, ela se deu conta que estava com a boca aberta há vários minutos, e
    o duque tinha reparado.


    Ele lhe deu um olhar divertido.


    – Está escurecendo – ela disse. – Não deveríamos ir para o pavilhão?


    – Ainda não – ele disse, segurando o braço dela. Ele a conduziu para fora do caminho
    principal, para um bosque destacado das colunatas.


    – Por quê?


    – Vai acontecer uma coisa que eu quero que você veja. E quero estar com você quando
    acontecer.


    Ela ficou na ponta dos pés e esticou o pescoço para olhar em todas as direções.


    – O que nós estamos esperando para ver?


    – Está começando – ele disse, virando a cabeça dela. – Veja.


    Pauline olhou. Ela viu uma esfera brilhar. Uma única bola de luz, pendurada à
    distância. Ela piscou e apareceram duas, depois dez. E então... milhares.


    Um brilho quente se espalhou pelos jardins como uma onda de luz, tocando aqui
    uma lamparina vermelha, ali uma azul ou verde. Sem fôlego, de tão encantada, ela
    inclinou a cabeça para trás. As árvores acima deles sustentavam lamparinas em
    todos os galhos. O brilho corria de uma para outra e não demorou para que o bosque
    todo ficasse iluminado. O efeito era semelhante a ficar debaixo de um vitral de
    igreja durante a hora mais ensolarada do dia. Só que era noite e todas as cores
    possuíam uma riqueza luminosa. As lamparinas eram como milhares de joias penduradas
    em todas as árvores e em todos os arcos de pedra.


    Pauline não conseguiu encontrar palavras. Ela riu e levou a mão ao rosto.'
  merge: -1
