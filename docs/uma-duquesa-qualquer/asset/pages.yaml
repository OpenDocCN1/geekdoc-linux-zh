    – Simms. Eu fiz mal. – Ele soltou um suspiro irregular.

    Ela riu um pouco.

    – Se isso foi mal feito, não sei se conseguiria sobreviver a algo bem-feito.

    – Não, não. Fiz mal como seu empregador. Não gostaria que pensasse que tenho o
    hábito de assediar as empregadas. – Ele se virou de lado e passou a mão pelo cabelo
    castanho. – Eu não tenho dificuldade para encontrar companhia. Nunca preciso me...

    – Rebaixar a isso? – Magoada, ela se abaixou para pegar a colcha caída. – Se está
    querendo me dispensar com delicadeza, não está conseguindo.


    Por que os homens têm que estragar tudo? A resposta era simples, ela imaginou:
    porque as mulheres, tolas, lhes dão essa oportunidade.

    – Escute. Só estou tentando dizer que não vai acontecer de novo. E eu sinto muito.

    – Sente muito por ter me beijado? Ou sente porque não vai acontecer de novo?

    Ele se aproximou e ajeitou a colcha ao redor dela.

    – Pelas duas coisas.


    Sob a luz trêmula da vela, o rosto dele assumiu aquele mesmo olhar assombrado
    e solitário. Se ele não tinha mesmo dificuldade para encontrar companhia – e depois
    daquele beijo ela acreditava nisso –, por que ele não estava dando prazer a uma
