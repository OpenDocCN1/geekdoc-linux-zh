- pgno: 71
  md: 'Virando-se para o lado, ele usou a lâmina da espada para cortar uma tira de
    tecido de sua camisa, que usou para aplicar sobre o ferimento.

    – Vossa Graça. – Del estendeu uma perna à frente e fez uma reverência profunda
    para a duquesa.

    – Lorde Delacre – ela respondeu, inclinando a cabeça.

    – Vossa Graça faria a gentileza de me apresentar sua bela amiga?

    Não comece, Griff pediu em silêncio. Não com ela.

    Ele e Del tinham uma longa história de duelar pelas conquistas. Nos momentos mais
    inexeperientes de sua juventude, eles até transformaram isso em competição, com
    apostas e um complexo sistema de pontuação. Fazia tempo que Griff tinha deixado
    isso tudo para trás, mas não havia como saber no que dizia respeito a Delacre.
    Talvez ele ainda estivesse contando seus pontos.

    – Esta é minha convidada – a duquesa disse. – Srta. Simms, de Sussex.

    – Srta. Simms de Sussex – Del disse. – É um verdadeiro prazer conhecê-la. Eu sou
    Lorde Delacre, de onde quer que me queiram menos. – Ele pegou a mão de Pauline
    e a beijou.

    Ela arqueou uma sobrancelha para Griff, e foi como se ele pudesse ouvi-la provocando-o:
    Você não beijou minha mão.

    Mas eu a salvei de cair e quebrar a cara, ele respondeu, também com um movimento
    de sobrancelha.

    Por um momento, eles começaram a compartilhar um sorriso. Então foi como se os
    dois se lembrassem dos beijos que tinham se seguido a esse resgate... Para não
    mencionar da intimidade implícita em se conversar através de movimentos de sobrancelha
    enquanto outras pessoas observavam.

    O pescoço dela ficou vermelho. Griff olhou para o lado.

    – Não se preocupe com ele, Srta. Simms – disse Delacre. – Nós dois somos espadachins
    experientes. Os melhores de Londres. Temos que ser.

    – E por quê? – ela perguntou.

    – Porque somos os maiores libertinos. – Del piscou para ela. – Uma reputação de
    excelência na esgrima é a melhor defesa contra ser desafiado para um duelo. Nenhum
    homem, não importa o quão enraivecido esteja, colocaria a escolha de armas nas
    nossas mãos. – Ele colocou de lado a lâmina de treino. – Faz tempo que está em
    Londres, Srta. Simms?

    – Cheguei ontem, meu lorde.

    – Os pais da Srta. Simms não puderam apresentá-la à Sociedade – a duquesa interveio.

    – Então eu me ofereci para ajudar a garota a se refinar, na cidade.

    – A julgar pelo corte no braço de Halford, eu diria que o começo é bem promissor
    – Delacre disse. Com a voz mais baixa, ele disse à duquesa: – Eu sei o que Vossa
    Graça está tramando. E como fiz um juramento de sangue para defendê-lo de todas
    as armadilhas do casamento, deveria me opor. Mas para variar, Vossa Graça, acredito
    que possamos ser aliados. Não há como negar que ele tem se comportado como um
    monge durante toda a temporada. Só que menos divertido.

    – Eu ouvi isso – Griff disse.'
