- pgno: 12
  md: 'Tarde demais. Com uma explosão irada, ela jogou o conteúdo do barril para cima.
    A loja foi coberta por uma explosão branca, e a Sra. Whittlecombe foi pega no
    centro da tempestade de açúcar, onde ficou tossindo e praguejando em meio a uma
    nuvem do produto. Quando a poeira baixou, ela parecia a esposa de Lot, mas transformada
    em uma estátua de açúcar, em vez de sal.


    A sensação de vingança divina que tomou Pauline quase valeu todo aquele dinheiro
    suado. Quase. Ela jogou o barril vazio no chão.

    – Oh, céus. Que burrice a minha.


    Griff observou a mãe, que mantinha aquele sorriso convencido nos lábios. Dessa
    vez ela tinha ido longe demais. Aquilo não era só uma intromissão, era algo diabólico.

    Spindle Cove, a cidade das solteironas. Ele nunca tinha estado nesse lugar, mas
    conhecia bem sua reputação. Era nesse vilarejo litorâneo que as solteironas bordavam
    e as tuberculosas encontravam a cura.


    Aceitando a mão do criado, a duquesa desceu da carruagem.

    – Este lugar está fervilhando de jovens bem-nascidas e solteiras.

    Ela gesticulou na direção de uma pensão. Uma placa pendurada sobre a porta de
    entrada anunciava que ali era a QUEEN’S RUBY.

    Griff arregalou os olhos para as venezianas verdes e as floreiras com gerânios
    nas janelas. Preferiria nadar com os tubarões. Ele se virou e caminhou na direção
    oposta.

    – Aonde você está indo? – a mãe perguntou, indo atrás dele.

    – Ali. – Ele indicou, com o queixo, uma taverna do outro lado da praça. Focando
    na placa sobre a porta vermelha, ele leu o nome, Touro & Flor. – Vou tomar uma
    caneca de cerveja e comer algo.

    – E quanto a mim?

    Griff fez um gesto exagerado.

    – Fique à vontade. Pegue uma suíte na hospedaria. Aproveite as saudáveis brisas
    marinhas. Mando a carruagem para buscá-la dentro de algumas semanas. – E acrescentou
    baixo: – Ou alguns anos.


    O criado seguiu-os, a um passo respeitável atrás, segurando a sombrinha aberta
    para proteger a duquesa do sol.

    – Absolutamente não! – ela disse. – Você vai escolher uma noiva e será hoje.

    – Você não entende qual tipo de moça é enviada para esta vila? As que não conseguem
    casar!

    – Exatamente. É perfeito. Nenhuma delas irá rejeitá-lo.

    As palavras da mãe fizeram com que Griff parasse e se virasse para encará-la.

    – Me rejeitar?

    Por razões óbvias, ele evitava discutir seus casos com a mãe. Mas a razão pela
    qual ele se mantinha celibatário nos últimos meses não tinha nada a ver com ser
    rejeitado pelas mulheres. Havia muitas mulheres – lindas, sofisticadas, sensuais
    – que o receberiam de braços abertos em sua cama quando ele quisesse. Griff teve
    vontade de dizer isso, mas um homem não pode dizer essas coisas para a mãe.'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'Entretanto, ela não pareceu ter dificuldade para interpretar o silêncio dele.

    – Não estou falando de carnalidade, mas de seu potencial como marido. Sua reputação
    deixa muito a desejar. – Ela raspou alguma coisa da manga dele. – E tem o problema
    com a idade.

    – Que problema com a idade? – Griff estava com 34 anos. Pelos cálculos dele, seu
    pênis ainda tinha, pelo menos, umas três décadas de bom funcionamento.

    – É claro que sua aparência é boa – ela continuou. – Mas existem homens mais bonitos.

    – Tem certeza de que você é minha mãe?

    Ela se virou e continuou andando.

    – O fato é que a maioria das damas da sociedade desistiram de você como marido
    em potencial. Uma vila cheia de solteironas desesperadas é exatamente o que precisamos.
    Você tem que admitir, esse lugar funcionou muito bem para aquele seu amigo malandro,
    Lorde Payne.

    Pelo amor de Deus. Então era essa a explicação para aquilo. Malditos fossem aquele
    patife do Colin Sandhurst e sua esposa quatro-olhos, amante de livros. No ano
    anterior, seu antigo amigo de jogatina foi mantido preso, sem dinheiro, naquela
    vila litorânea, e escapou ao fugir com uma intelectual. O casal tinha até parado
    em Winterset Grange, o retiro rural de Griff, em sua rota para a Escócia. Mas
    a situação dos dois era completamente diferente. Griff não estava desesperado
    por dinheiro, nem por companhia. Casamento simplesmente não era seu destino.

    A mãe o encarou, séria.

    – Você estava esperando pelo amor?

    – O quê?

    – É uma pergunta simples. Você evitou se casar, durante todos esses anos, porque
    estava esperando se apaixonar?

    Uma pergunta simples, ela disse. Mas a resposta não era.

    Ele poderia tê-la levado para a taverna, pedido algumas taças grandes de vinho
    e explicado tudo em uma hora ou duas. Explicado que ele não se casaria na próxima
    temporada, nem em qualquer outra. O único filho dela não seria apenas uma mancha
    na distinta linhagem Halford, mas o literal fim da linha, e o legado da família
    que ela tanto estimava estava condenado à obscuridade. A esperança de ter netos
    seria frustrada.

    Mas ele não conseguiu fazer isso. Nem mesmo nesse dia em que ela estava tão irritante.
    Era melhor continuar sendo um malando dissoluto, porém recuperável, do que partir
    o coração da mãe.

    – Não – ele respondeu, sincero. – Não estou esperando pelo amor.

    – Bem, isso é conveniente. Nós podemos resolver a situação em uma manhã. Não se
    preocupe em encontrar a beleza mais refinada da Inglaterra. Você pode encontrar
    uma garota – qualquer garota –, que eu mesma irei refiná-la. Quem melhor para
    preparar a futura Duquesa de Halford do que a atual Duquesa de Halford?

    Eles chegaram à entrada da taverna e a mãe olhou para a maçaneta da porta. O criado
    se adiantou para abri-la.

    – Oh, veja – ela disse ao entrar. – Que sorte. Elas estão aqui.'
