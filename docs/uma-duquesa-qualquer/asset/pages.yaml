- pgno: 67
  md: 'pagando para ser uma catástrofe. Para frustrar todas as suas tentativas de
    me refinar.

    A duquesa bufou com delicadeza.

    – Foi isso o que ele lhe disse porque é isso o que ele está dizendo para si mesmo.
    Griff não consegue admitir que está fascinado por você. E você também é orgulhosa.
    Se eu a acusasse de já estar apaixonada por ele, você também negaria.

    – Eu... eu nego mesmo! Porque não é verdade!

    Enquanto falava, Pauline sentiu o coração martelar no peito. Mentiroso, mentiroso,
    mentiroso. Ela estava apaixonada. Estúpida e impossivelmente apaixonada por cada
    coisinha a respeito do duque. Não, não do duque, do homem. Pelo modo como ele
    a ouvia com interesse genuíno, como impediu que ela caísse, e como a beijou com
    tanta paixão. O cheiro delicioso e viciante dele. Naquela manhã mesmo, Pauline
    fantasiou roubar da lavanderia a camisa suja dele para que pudesse escondê-la
    debaixo do travesseiro.

    Oh, Deus! Isso era terrível. Ela sentia até mesmo palpitações.

    Fleur voltou para o quarto com uma bandeja forrada de veludo, que colocou sobre
    a penteadeira.

    Pauline ficou boquiaberta. A bandeja estava coberta de joias de todas as formas
    e cores, reluzentes em todos os tipos de arranjos: colares, pulseiras, brincos,
    anéis. Mas não eram de todos os tamanhos. Não, cada gema era uniforme e assustadoramente
    imensa.

    – Isso é tudo – a duquesa disse, dispensando Fleur mais uma vez.

    Ela se voltou para a bandeja de joias.

    – Pérolas, não. Hoje, não – ela murmurou, empurrando de lado um cordão de esferas
    iridescentes do mesmo tamanho. – Topázio seria errado. E vão ser necessários alguns
    anos antes que você possa usar diamantes ou rubis.

    Diamantes ou rubis? Aquela mulher iludida falava como se um dia todas essas joias
    fossem ser dela. Pauline não sabia como convencer a duquesa da verdade.

    – Vossa Graça não me ouviu? – ela perguntou com um sussurro alto. – Gri... quero
    dizer, o duque está me pagando para fracassar. Ele só quer dar uma lição na senhora,
    para que nunca mais queira obrigá-lo se casar.

    A mulher colocou as mãos nos ombros de Pauline. Seus olhares se encontraram no
    espelho.

    – Quanto ele lhe prometeu?

    – Mil libras.

    A duquesa não pareceu impressionada. Ela colocou as mãos no rosto de Pauline e
    puxou para cima, alongando a coluna dela até a moça ficar ereta como uma vara.

    – Pronto. Com a postura correta, você possui um pescoço maravilhoso para joias.
    – Ela inclinou a cabeça de Pauline para um lado e para outro. – Nunca deixe que
    lhe mandem usar esmeraldas só porque seus olhos são verdes. Isso é ideia de gente
    sem imaginação. Pensando só na cor, seus olhos são mais parecidos com peridoto.
    Mas peridoto sempre me parece lamentavelmente burguês.

    – Não é comum alguém me dar conselhos sobre joias, Vossa Graça – Pauline disse,
    a voz abafada pelas mãos da duquesa emoldurando seu rosto. – Esta é a primeira
    vez.'
