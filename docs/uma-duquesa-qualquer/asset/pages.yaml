- pgno: 70
  md: 'Griff gemeu de dor, deixando a espada cair e apertando o ferimento com a mão
    livre.

    – Droga, Del.


    – Não é culpa minha. Por que você parou de defender? – O amigo empurrou a máscara
    de proteção para trás e passou os olhos pelo salão. Quando encontrou a Srta. Simms,
    ele abriu um grande sorriso. – Olá... Estou vendo, agora.


    Olá, mesmo. Pauline fez uma mesura e Griff lhe deu um aceno rápido. Ele não deveria
    estar tão surpreso, mas não a via desde a biblioteca, na noite anterior, quando
    passaram todo aquele tempo conversando. E depois se abraçaram. E então se beijaram
    como amantes que estiveram aprisionados em celas separadas durante dez anos e
    seriam enforcados ao amanhecer.


    Bom Deus. Bom Deus.


    Ele tinha resolvido, hoje mesmo, procurá-la para ter uma conversa breve e profissional
    para acertar as coisas, garantindo que aquilo não aconteceria outra vez. Mas a
    conversa não deveria acontecer dessa forma. Os dois deveriam estar a sós, mas
    de forma segura. Quando ele estivesse tão exausto, após horas de prática vigorosa
    de esgrima, que não conseguiria nem pensar em desejo, e quando ela não estivesse
    tão... tão daquele jeito.


    Você está bem?, ela articulou com a boca.


    Não. Não, ele não estava bem. Griff se sentia devastado.


    Ontem mesmo ela tinha lhe virado a cabeça com seu comportamento inadequado e todos
    aqueles cristais brilhantes de açúcar. No momento ela não brilhava; a Srta. Simms
    usava um vestido branco tão translúcido e puro que o calor bronzeado de sua pele
    brilhava através dele. Ela resplandecia.


    Griff sempre adorou isso: o efeito natural de uma mulher sobre ele. Antes ele
    vivia por esses momentos de atração natural, instintiva. Quando uma fonte de feminilidade
    celestial entrava no ambiente e seu compasso interno se recalibrara. Era uma mudança
    sublime de seu caos interno para uma determinação objetiva. A diferença entre
    Minha nossa, e agora? e... Ela. Eu fico com ela.


    Maldição. Ele a queria. Quis desde o primeiro instante. Griff compreendeu isso
    nesse momento, em que alguma parte amortecida dele começava a voltar à vida. Mas
    esse era o pior momento possível, e ela era a mulher menos provável. Qualquer
    efeito que Simms tivesse sobre ele, Griff precisava garantir, com toda certeza,
    que ninguém naquele salão – nem sua mãe, nem seu amigo, nem Pauline Simms – percebesse.
    Bem, a não ser pelo sangramento.'
