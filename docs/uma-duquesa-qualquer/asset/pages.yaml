    > "Izzy sempre sonhou em viver um conto de fadas. Mas, por ora, ela teria que
    se contentar com aquela história dramática."


    A doce Isolde Ophelia Goodnight, filha de um escritor famoso, cresceu cercada
    por contos de fadas e histórias com finais felizes. Ela acreditava em destino,
    em sonhos e, principalmente, no amor verdadeiro. Amor como o de Cressida e Ulric,
    personagens principais do romance de seu pai.


    Romântica, ela aguardava ansiosamente pelo clímax de sua vida, quando o seu herói
    apareceria para salvá-la das injustiças do mundo e ela descobriria que um beijo
    de amor verdadeiro é capaz de curar qualquer ferida.


    Mas, à medida que foi crescendo e se tornando uma mulher adulta, Izzy percebeu
    que nenhum daqueles contos eram reais. Ela era um patinho feio que não se tornou
    um cisne, sapos não viram príncipes, e ninguém da nobreza veio resgatá-la quando
    ela ficou órfã de mãe e pai e viu todos os seus bens serem transferidos para outra
    pessoa.


    Até que sua história tem uma reviravolta: Izzy descobre que herdou um castelo
    em ruínas, provavelmente abandonado, em uma cidade distante. O que ela não imaginava
    é que aquele castelo já vinha com um duque…


