    sentir macia.


    Ela nunca tinha se sentido assim, em toda sua vida. Tão desejada, tão necessária,
    e por um homem que não deveria necessitar de nada.


    Quando ele finalmente interrompeu o beijo, deixou os lábios dela inchados e doloridos.
    O canto de sua boca estava arranhado pela barba dele, e Pauline levou a língua
