    – Eu vou me soltar – ele disse, com calma, colocando uma taça na mão livre dela
    e enchendo-a de ponche, só para que os dois tivessem algo para fazer. – Não tema.
    Transformei em profissão a arte de não me enrolar com mulheres.

    Ele tentou de novo, pegando a manga com a mão livre e dando-lhe um puxão firme.
