- pgno: 84
  md: 'Virando-se de frente para ele o melhor que pôde, Pauline deslizou a mão por
    baixo da lapela, passando pela frente de seda do colete e sentindo a parede firme
    de músculo por baixo. O coração dela gaguejou quando ela roçou algo que parecia
    muito com um mamilo, mas ela prosseguiu, intrépida, subindo com a mão até o ombro
    dele em uma tentativa de soltar o casaco do corpo dele.


    – Levante o braço um pouco.

    Ele se encolheu, como se sentisse cócegas.

    – Fique parado – ela disse. – Sou boa nisso, lembra? – Virando o braço e mexendo
    os dedos, ela conseguiu ir mais longe. – Ninguém consegue enfiar o braço tanto
    quanto eu.

    – Santo Deus, Simms. Meu braço não é um bezerro, para ser parido.

    – Estou quase lá. – Ela deslizou os dedos pela dobra do ombro e desceu um pouco
    pela manga.

    – Simms.


    Ela levantou os olhos. Eles estavam a poucos centímetros um do outro. Os lábios
    dele estava muito, muito próximos dos dela.


    Sem querer, ela contraiu os dedos, enfiando as unhas no bíceps dele. Halford estremeceu.


    – Oh – ela inspirou, consternada. – Sinto muito. Esqueci do seu ferimento.

    – Não se trata do meu braço, Simms, mas de tudo. Estamos sozinhos no jardim enquanto
    um baile está acontecendo. Não consigo parar de olhar para seus seios e sua mão
    está... violando meu casaco. Está na hora de encararmos a verdade. Com relação
    às tentativas de evitar envolvimento, esta não está funcionando. Não mesmo.

    – Mas... mas poderia ser pior.

    – Não consigo ver como.


    Ela não soube o que a fez dizer as próximas palavras. Elas apenas saltaram de
    seus lábios:

    – Você poderia estar me beijando.'
