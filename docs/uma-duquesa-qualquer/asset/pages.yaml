    Ela foi acometida por uma tentação poderosa, infantil, de jogar um livro no homem,
    mas isso seria menos dramático que o açúcar, e seria uma ofensa ao livro.

    Então ela apenas virou e saiu, as faces queimando e os dedos tremendo.

    Algum dia, ela prometeu a si mesma, serei dona da minha própria loja, repleta
    de livros adoráveis. E será um lar para mim e Daniela, e para qualquer um que
    precisar. Ninguém será colocado para fora.

    Na rua, a carruagem Halford parecia um bolo de quatro camadas, com caixas e pacotes
    amarrados sobre todas as superfícies disponíveis. Dentro da carruagem, a duquesa
    acenou para ela.

    – Venha, Srta. Simms.

    Pauline obedeceu. Ela aprendeu uma coisa em sua rápida pesquisa na livraria. Tendo
    visto os preços nas plaquetas, ficou sabendo uma coisa... Mil libras podiam comprar
    um'
