  md: '# Capítulo vinte


    – Bom Senhor. Este é o pior de todos.

    No dia seguinte, na sala matinal, Sua Graça estava muito descontente.

    – Deixe-me ver. – Pauline se inclinou para frente, na cadeira listrada de amarelo.

    A duquesa levantou as agulhas de tricô. Em uma delas estava pendurada uma coisa
    disforme sem nenhuma função concebível. Aquilo não parecia nada além de uma ratazana
    morta.

    – É bastante horrendo – Pauline teve que admitir.

    – Errado. É completamente horrendo. – A duquesa estalou a língua. – Horrendo.
    Precisa voltar aos seus exercícios de dicção, garota. Fizemos grandes progressos,
    mas você precisa parar de comer o fim das palavras até a noite de amanhã. Afinal,
    nós não vamos nos curvar perante “Su Alteza Real”, não é?

    – Eu não deveria nem me aproximar do Príncipe Regente.

    Só de pensar nisso, Pauline sentia seu estômago revirar. Haveria um baile na Casa
    Carlton, residência do Príncipe Regente, amanhã. A duquesa encarou o convite como
    a última e melhor chance de Pauline “acontecer” na Sociedade londrina.

    – Mesmo se eu conseguir pronunciar todas as palavras direito, meu lugar não é
    em um castelo. Vossa Graça, eu gostaria que desistisse da ideia.

    – Não vou desistir de nada. É nossa última chance, depois da noite passada.

    Quando Pauline apareceu para o café da manhã sem a presença de Griff, a duquesa
    concluiu que suas esperanças na festa de Vauxhall tinham sido em vão. Embora suas
    suposições quanto ao que tinha acontecido pudessem estar erradas, ela acertou
    no resultado final.

    – Não diga que eu não lhe avisei – Pauline disse. – Eu já lhe disse e repito,
    ele não vai casar comigo.

    – Talvez não por vontade própria. – A duquesa voltou ao seu lugar e recomecou
    a tricotar furiosamente. – Mas ele vai ser obrigado a pedir sua mão amanhã. Esse
    foi o acordo. Se eu fizer de você o assunto de Londres, ele prometeu se casar.

    Pauline meneou a cabeça.

    – Vossa Graça precisa aceitar a realidade. Isso não é possível.

    – Mas é. Eu sei que parece improvável, mas esse é o momento de fazermos um esforço
    para uma conclusão triunfante. Dicção pela manhã. E um professor de dança vem
    à tarde. Vamos praticar sua mesura e seus cumprimentos, também. Comprei um carrilhão
    encantador para substituir suas taças de água. E, é claro, encomendamos o mais
    belo vestido que havia. Não vou me render. – Ela mostrou o tricô horrendo. – Não
    posso.

    Com um suspiro resignado, Pauline abriu a Bíblia.'
