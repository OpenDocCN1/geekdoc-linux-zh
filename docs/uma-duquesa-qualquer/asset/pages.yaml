    – Maravilha. Era tudo que esta manhã precisava.

    Pauline congelou, sem acreditar. Junto à entrada havia não apenas uma, mas duas
    pessoas conhecidas: Srta. Minerva Highwood, uma lady que ela conheceu em Spindle
    Cove, e o marido da Srta. Minerva, Colin Sandhurst, o Lorde Payne.

    – Eu sabia! – disse Minerva, empurrando o duque de lado para dar um abraço desesperado
    em Pauline. – Não tema, Pauline. Nós viemos salvá-la.


    Tendo aberto a porta, Griff aceitou o dever de fechá-la. Mas se arrependeu em
