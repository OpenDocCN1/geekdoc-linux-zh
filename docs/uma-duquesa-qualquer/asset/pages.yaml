- pgno: 8
  md: 'podia considerar “decepcionante” a administração bem-sucedida de uma vasta
    fortuna, seis propriedades, centenas de empregados e milhares de arrendatários.
    Impressionante para a maioria dos padrões. Mas na família Halford não era suficiente.
    A menos que um homem reformasse o Parlamento ou descobrisse uma nova rota comercial
    para a Patagônia, ele não era grande coisa.


    Ele olhou pela janela outra vez. A carruagem parecia estar entrando em uma espécie
    de vila. Abriu o vidro e descobriu que podia sentir o cheiro do mar. Um frescor
    marinho, salgado, misturado ao aroma das plantas do campo.


    – É um lugar bonitinho – a mãe disse. – Muito limpo e sossegado. Compreendo por
    que é tão popular entre as jovens.


    A carruagem parou no centro da vila, perto de um gramado amplo e agradável, que
    circundava uma grandiosa igreja medieval. Ele espiou pela janela, olhando em todas
    as direções. O lugar era pequeno demais para ser Brighton ou...


    – Espere um minuto... – Uma suspeita desagradável se formou na cabeça dele. Ela
    não podia ter... Ela não teria.


    O criado uniformizado abriu a porta da carruagem.

    – Bom dia, vossas graças. Chegamos a Spindle Cove.


    – Oh, saco.


    Quando a elegante carruagem apareceu sacolejando pela rua, Pauline não deu atenção.
    Muitas carruagens refinadas vinham por esse mesmo caminho, trazendo um visitante
    ou outro para a vila. Diziam que uma temporada em Spindle Cove era tudo o que
    qualquer moça bem-nascida precisava para se recuperar de uma crise de autoconfiança.
    Mas Pauline não era uma moça bem-nascida e seus problemas eram mais práticos.
    Como o fato de ter pisado em uma poça de barro, salpicando lama na barra de seu
    vestido. E sua irmã estar chorando pela segunda vez naquela manhã.


    – A lista – Daniela disse. – Não está aqui.


    Droga. Pauline sabia que não teria tempo de voltar à fazenda. Dentro de poucos
    minutos precisaria estar na taverna. Era sábado, dia da reunião semanal das mulheres
    de Spindle Cove, quando a casa de chá e taverna, Touro & Flor, ficava mais cheia.
    O Sr. Fosbury era um patrão justo, mas ele descontava atrasos do salário, e o
    pai dela percebia.


    Frenética, Daniela vasculhava o bolso, seus olhos marejados de lágrimas.

    – Não está aqui, não está aqui.

    – Não importa. Eu me lembro de tudo. – Sacudindo as saias para se livrar das gotas
    de lama, Pauline foi enumerando os itens de cabeça: – Groselhas secas, novelo
    de lã, um pouco de esponja. Oh, e alúmen em pó. Minha mãe precisa para fazer conservas.


    Quando elas entraram na loja Tem de Tudo, dos Bright, encontraram o lugar lotado.
    As turistas se preparavam para a reunião semanal e as moradoras faziam suas compras.
    Moradoras como a Sra. Whittlecombe, uma viúva idosa que só saía de sua decrépita
    casa de fazenda uma vez por semana, para se abastecer de doces e vinho “medicinal”.
    Enquanto Pauline e Daniela se espremiam entre as clientes para entrar na loja,
    a mulher lhes deu uma fungada desdenhosa.'
