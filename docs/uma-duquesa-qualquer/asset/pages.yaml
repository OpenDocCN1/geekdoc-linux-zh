- pgno: 15
  md: 'Griff vasculhou a taverna uma segunda vez, planejando se declarar louca e instantaneamente
    apaixonado pela pirralha mais tímida, desajeitada e grosseira do lugar, para então
    ver sua mãe gaguejar e se desesperar.


    Contudo, pelos olhares divertidos que as jovens trocaram, Griff sentiu que havia
    mais coragem e inteligência naquela sala do que sua primeira impressão tinha indicado.
    Aquelas mulheres não eram tolas. E embora cada uma delas tivesse seus defeitos
    e imperfeições – quem não tem? –, nenhuma era inadequada de um modo chocante e
    insuperável.


    Droga. Ele queria tanto ensinar uma lição à mãe intrometida. Mas, a julgar pela
    situação, ele pensou que talvez fosse melhor apenas murmurar um pedido de desculpas
    e arrastar a duquesa de volta para a carruagem, deixando-a no asilo de Bedlam
    no caminho de casa.


    E então, com um ranger das dobradiças e uma batida na porta dos fundos... A salvação
    dele chegou.


    Ela entrou, tropeçando, pela entrada dos fundos da taverna, ofegante e com o rosto
    vermelho. Suas botas e a barra do vestido estavam salpicadas por uma quantidade
    assustadora de lama, e um pó branco estranho recobria todo o resto.


    Um avental de atendente estava pendurado em seu pescoço, um pouco folgado. Quando
    ela pegou as faixas e as amarrou na cintura, o aperto dos laços revelou um corpo
    magro, quase de garoto. Ela não era exatamente um violão, estava mais para um
    fagote.


    – Já passa das 10 horas, Pauline – veio uma voz masculina na cozinha.


    – Perdão, Sr. Fosbury – ela respondeu. – Não vou me atrasar de novo.


    A dicção e o sotaque dela não eram apenas de alguma instrução e do interior –
    eram estranhos. Quando ela se virou, Griff entendeu a razão. Ela segurava um grampo
    de cabelo entre os dentes, como um charuto, enquanto falava.


    A atendente atrasada pegou outro grampo de cabelo e, quando seus olhos verdes
    e inteligentes encontraram os de Griff, ela congelou no ato de enfiar aquele grampo
    no volume de cabelo empilhado sobre a cabeça.


    Deus, aquele cabelo. Ele já tinha ouvido mulheres descrever seus penteados como
    “coques” ou “tranças”. Mas o que estava diante dele só podia ser chamado de “ninho”.
    Griff estava certo de ter visto folhas de grama e pedaços de palha perdidos ali.


    Era evidente que ela esperava entrar sem ser notada. Mas, em vez disso, ela se
    tornou, de repente, o centro das atenções. Aquele pó branco misterioso grudado
    nela... captava a luz, reluzindo. Griff não conseguia desviar os olhos.


    Enquanto os olhos da moça ofegante alternavam entre Griff, a mãe dele e as outras
    jovens que ocupavam o salão, o penteado inacabado dela desmoronou. Mechas de cabelo
    solto escorreram por seus ombros, rendendo-se à gravidade ou à indignidade. Ou
    a ambas.


    Esse seria o momento em que a atendente baixaria a cabeça e fugiria do salão,
    para esperar pela ira de seu chefe. Sem dúvida haveria choros e soluços. Mas,
    pelo jeito, não seria assim com aquela garota, que parecia ter orgulho suficiente
    para passar por cima da etiqueta e do bom senso.'
