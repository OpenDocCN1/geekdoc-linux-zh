    – Faz muito tempo, Halford. – Payne lhe ofereceu a mão e um sorriso amistoso.

    Não tempo suficiente. A ausência poderia ter durado mais uma ou duas semanas.

    Lady Payne o encarou, os olhos dela ardiam, violentos, por trás dos óculos.

    – Seu trilobita asqueroso!

    Encantadora. E Griff ainda se perguntava o que Payne teria visto nessa garota.

    – Se eu não tivesse deixado minha bolsa em casa... – ela disse, ameaçadora.'
