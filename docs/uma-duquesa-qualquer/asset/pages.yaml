    – Minha nossa! – Ela suspirou, admirando a extensão que Griff tinha acabado de
    percorrer. – Foi um feito atlético e tanto.


    – Não foi nada.


    A única resposta masculina possível, claro. Na verdade, ele desconfiava ter estirado
