- pgno: 56
  md: 'for emprestar, sempre exija um depósito. Poucos se comparam à aristocracia
    quando se trata de fugir de suas obrigações financeiras.

    Ela lançou um olhar desconfiado para ele.

    – Você não foge das suas dívidas, foge?

    – Pelo que eu soube, sou o quarto homem mais rico da Inglaterra. Nunca precisei
    fugir.

    – Oh. Ótimo. – Ela aproximou o manual de contabilidade e inclinou a cabeça, inspirando
    fundo. Quando Simms notou o olhar dele, pareceu envergonhada. – Eu gosto do cheiro
    dos livros. Isso é estranho?

    – Sim. Um pouco.

    Mas ele achou cativante, também. De um modo estranho. Aquilo tinha ido além de
    uma conversa noturna na biblioteca, transformando-se em algo no limite do flerte,
    talvez até mesmo em um tipo incomum de amizade – marcada por uma violenta atração
    carnal da parte dele.

    Seja o que houvesse entre eles... precisava terminar ali mesmo, naquele instante.
    Ele pôs o relógio desmontado de lado e se levantou da cadeira, confiante de que
    as sombras esconderiam sua excitação.

    – Está na sua hora de dormir, Simms. Está tarde e tenho certeza de que minha mãe
    planejou uma programação repleta de exercícios inúteis para amanhã.

    – Não se preocupe. Estou preparada para ser uma catástrofe.

    – Ótimo.

    Ela apagou a lamparina e desceu dois degraus.

    – Só para provar, não vou nem mesmo fazer uma mesura ao sair desta sala.

    – É um começo excelente. Mas se quiser chocar de verdade, pode começar a me chamar
    de Griff.

    – Mesmo? – Ela se virou para ele.

    Ele estremeceu. Um erro de cálculo da parte dele. Griff sugeriu aquilo como um
    toque de falta de educação, mas a expressão lisonjeada dela o lembrou de que esse
    tipo de intimidade poderia se mostrar perigoso. Por falar em perigo...

    – Cuidado – ele a alertou. – O último degrau é bem...

    Ela soltou uma exclamação e se desequilibrou.

    – Oh, saco.'
