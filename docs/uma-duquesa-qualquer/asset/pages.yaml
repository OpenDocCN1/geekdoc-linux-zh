  md: '– Eu realmente não preciso disso... – ela protestou.

    Ele saiu da sala e esse foi o fim da discussão.


    Quando o médico chegou, Pauline ficou sentada no Salão Rosa enquanto o doutor
    apalpava seu tornozelo e a examinava. O inchaço parecia já estar melhorando. Nenhum
    dano sério no tornozelo, pelo menos. Outras partes da pele talvez nunca se recuperassem.


    Pauline se levantou da cadeira e foi mancando até ele, no meio da sala.

    – Bem – ela disse –, afinal, provei que sou uma catástrofe. Devo ter parecido
    uma megera de boca suja, correndo daquele jeito pelos jardins tão bem cuidados.


    Ele pareceu não achar graça no que ela disse.

    – Venha, vou ajudá-la a subir a escada.

    – A lesão não foi séria. – Ela fez um gesto com a mão dispensando a ajuda. – O
    médico disse que logo vai melhorar.


    Griff insistiu em colocar o braço ao redor da cintura dela, conduzindo-a até a
    escada. Pauline não soube como recusar. A justaposição da expressão furiosa de
