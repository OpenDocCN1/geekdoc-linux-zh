    Era um leito enorme, com dossel em mogno e cortinas de veludo em todos os lados.

    Ela tentou se apoiar nos cotovelos, mas o vestido pesado a atrapalhou. Antes que
    conseguisse se levantar, ele a prendeu, ajoelhando-se sobre as coxas dela.


    Então ele segurou o rosto de Pauline com aquelas mãos fortes, proibindo-a de olhar
    para qualquer coisa que não seu rosto. Os olhos dele estavam ferozes. O coração
    dela martelou de encontro ao dele.


    – Estou bravo, Pauline. Sinto uma raiva imensa daquele bandido que ousou tocá-la.
    Estou furioso por você ter se machucado. E estou bravo com você, sim, por ter
    ido atrás'
