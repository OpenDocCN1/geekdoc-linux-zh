  md: 'Mas então, quando eu senti aquele chute, tão frágil e poderoso... tive esperança
    de que as coisas pudessem ser diferentes.


    Ela foi até o lado dele e tocou seu braço. Griff firmou o maxilar.

    – Não posso passar por isso de novo. A linhagem Halford termina comigo.

    – Você parece muito decidido.

    – E estou. – Ele passou os olhos pelo quarto. – Espero que você não conte a ninguém
    sobre isso.


    Pauline sabia que ele não estava preocupado com “ninguém”. Ele não queria que
    a mãe soubesse.

    – Eu lhe dou minha palavra, não vou contar para ela. Mas acho que você deveria.

    – Não – ele disse com firmeza. – Ela não pode saber disso. Nunca. Estou falando
    sério, Pauline. Esse é o motivo pelo qual...

    – O motivo pelo qual você me trouxe aqui. Eu sei. Estou vendo.


    Ela entendeu, afinal. Ele não era um libertino devasso, relutante em casar. Estava
    decidido que não podia casar e não sabia como contar o porquê. A duquesa estava
    tão desesperada para ter netos que ele não conseguia contar que ela já teve uma
    neta e a perdeu, e agora nunca teria outra. Ele sabia que isso partiria o coração
    da mãe.


    Griff tinha mantido seu luto em segredo, corajosamente determinado a aguentar
    sozinho toda a tristeza.

    – Griff, você não precisa passar por isso sozinho. Se não quer contar para a duquesa,
    pelo menos converse comigo. Estarei aqui por mais alguns dias.

    – Não foi o que eu acabei de fazer? Conversar com você?

    Na verdade, não.


    Durante toda a conversa, o tom dele foi calmo, assombrosamente prático. Ela sabia
    que era só uma fachada. Ele não tinha conseguido externalar toda sua tristeza.
    Não era possível fazer isso em um quarto frio e secreto. Ele precisava falar,
    gritar, chorar, lembrar. Precisava de um amigo.

    – Você tem reprimido toda sua tristeza há meses e meses. Pode tentar mantê-la
    em segredo, mas não fingir que não existe. Até que você decida abrir seu coração,
    arejá-lo... o sol não vai poderá entrar. – Ela pegou a mão dele. – Você não quer
    me contar mais sobre ela? Se puxou mais à sua família ou à da mãe? Ela sorriu
    para você? Qual era o nome dela?


    Ele permaneceu em silêncio.

    – Você deve tê-la amado muito.

    Ele pigarreou e se afastou.

    – É melhor você ir. Os criados logo vão aparecer para acender as lareiras.

    Então seria assim... Por mais que eles tivessem se aproximado, por mais que tivessem
    compartilhado muitas coisas... ainda não era o bastante.

    Ela concordou, então se dirigiu à saída do quarto.

    – Como quiser.'
