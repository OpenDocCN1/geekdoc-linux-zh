- pgno: 82
  md: 'Deus do céu. Como era possível que eles tivessem andado tão pouco? As portas
    do jardim ainda pareciam estar a vinte metros de distância.

    O homem sacudiu a mão livre de Griff com vigor.

    – Não vejo você há séculos, seu malandro. Os boatos diziam que você tinha, finalmente,
    sucumbido à sífilis. – Ele deu um sorriso cheio de dentes para Pauline. – Quem
    é esta?

    – Srta. Simms, de Sussex. Ela está em Londres como convidada da minha mãe. Srta.
    Simms, este é o Sr. Frederick Martin.

    O cavalheiro fez uma reverência e em seguida deu uma piscadela para Griff.

    – Você está bem possessivo com ela, não?

    – Ela é nova em Londres, ainda está se ambientando.

    No canto, a pequena orquestra soltou os primeiros acordes de uma valsa.

    – Mas é claro que você me permite roubá-la para uma dança. – Martin estendeu a
    mão com uma luva branca e se curvou. – Srta. Simms, concede-me o prazer?

    Pânico tomou o peito de Pauline.

    – Oh, não posso.

    – Halford não liga. Quando se trata de mulher, ele é sempre generoso.

    Pauline não soube bem o que o homem queria dizer com essa observação, mas não
    gostou de ouvi-la.

    – Ela não vai dançar com você. – O duque suspirou alto. Ele pareceu não conseguir
    acreditar nas palavras que estava para dizer. – Ela me prometeu esta dança.

    Com isso, ele a afastou do Sr. Frederick Martin e a arrastou para a pista de dança.

    Pauline tentou não deixar o medo transparecer em seu rosto.

    – O quê? Espere. Eu nem sei como...

    – Só me acompanhe. É o único modo de conseguirmos escapar.

    Eles saíram valsando pelo salão. Devido ao modo como a manga dele estava presa
    no vestido, Griff teve que manter o braço em um ângulo que o fazia parecer uma
    asa de galinha. Sem a mão nas costas dela, ele não conseguia conduzi-la do modo
    certo. Pauline teve que segui-lo na pista de dança com passinhos curtos, na ponta
    dos pés.

    Enfim, eles chegaram às portas do jardim.

    – Eu nunca tinha visto alguém valsar assim – observou uma senhora idosa.

    – É uma variação húngara, madame. – Ele abriu a porta para Pauline. – A última
    moda em Viena.

    Pauline não conseguia parar de rir quando eles chegaram ao jardim.

    – Você pensa rápido, tenho que reconhecer.

    – Agora, dê-me a liberdade – ele disse. – Solte-me.

    – Você fala como se fosse culpa minha. É o seu botão. E só prendeu porque você
    foi superprotetor. Se tivesse me deixado cambalear um pouco, já poderíamos estar
    voltando para casa.

    Ela colocou a mão livre entre os dois, mas logo percebeu que só conseguiria inspecionar
    direito a situação se estivesse sem as luvas.

    – Minha luva – ela estendeu a mão para ele. – Ajude-me a tirá-la.'
