- pgno: 73
  md: '– Arrebatadora? Isto? – A modista estalou a língua. – Está pedindo demais.

    A duquesa arqueou a sobrancelha e olhou severamente para a mulher.

    – Eu não estou pedindo.

    A sala congelou com um silêncio tenso.

    Finalmente, a modista bateu as mãos e uma horda de assistentes se aproximou.


    Pauline bancou o espantalho durante horas, parada de braços abertos enquanto costureiras
    fugazes a circundavam. Elas mediram cada centímetro de seu corpo com fitas, dos
    punhos aos tornozelos, e a cobriram com amostras de tecidos cintilantes.


    Depois que as costureiras terminaram de picá-la com alfinetes, elas foram para
    a loja de tecidos, quando Pauline aprendeu quantos eram os tons de rosa: dezenas.
    A duquesa se debruçou sobre uma bobina após outra de cetim em tons de coral, rosa,
    framboesa, e um desagradável e flamejante que Pauline só conseguia descrever como
    “assadura”. A duquesa comprou vários cortes de tecido e mandou entregar na modista.


    Então elas foram ao armarinho. Depois à chapeleira e à luvista. Quando Pauline
    já tinha experimentado uma dúzia de pares de sapatos que lhe apertavam os dedos,
    chegou à uma conclusão: ter a aparência elegante e bem-cuidada exigia uma quantidade
    ridícula de trabalho.


    Enquanto a duquesa orientava os criados em seus esforços para prender catorze
    pacotes e caixas de chapéu no alto da carruagem, Pauline voltou sua atenção para
    uma loja ao lado. Uma agitação feliz cresceu em seu peito. Era uma livraria.


    Ela espiou através da treliça de losangos de vidros, absorvendo avidamente cada
    detalhe e gravando-o na memória. Na vitrine, o livreiro tinha feito uma exposição
    de títulos geográficos – em sua maioria, memórias de viagem de cavaleiros ricos.
    No centro jazia um atlas, aberto em um mapa colorido do mar Mediterrâneo. Notou
    o modo cuidadoso com que os volumes ainda não encadernados estavam arrumados nas
    prateleiras. Era impossível de identificar os títulos daquela distância. Estariam
    organizados alfabeticamente por título ou autor? Ou agrupados por assunto, talvez?
    Talvez estivessem organizados por meio de um método diferente.


    Pauline lançou um olhar para a duquesa. Ela estava, ainda, ocupada com os pacotes.

    – Não, não – ela dizia ao criado. – Esse tem que ir por cima. Não me importa que
    seja o maior. Ele não pode ser esmagado.


    Uma dupla de senhoras saiu da livraria, virando-se para caminhar na outra direção.
    Pauline espiou pela vitrine outra vez. Ela não viu nenhum outro cliente na loja.
    Depois de escrever algumas linhas em um livro-caixa, o livreiro desapareceu por
    uma porta nos fundos.


    A curiosidade de Pauline foi maior do que seu bom senso. Enquanto a duquesa cuidava
    dos pacotes, Pauline abriu a porta da livraria e entrou. Ela só ficaria por um
    momento.


    Oh, mas poderia ter permanecido por semanas. O cheiro mais magnífico a alcançou
    quando entrou. Tinta, cola, couro e papel novo – tudo combinado com a quantidade
    certa de mofo. Era a mistura perfeita de conhecido e novo, como a sensação reconfortante
    de entrar na cozinha perfumada de temperos do Sr. Fosbury na época de Natal.'
