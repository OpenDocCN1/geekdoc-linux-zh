- pgno: 134
  md: 'Nos últimos anos, Griff passou os meses mais frios em Winterset Grange. Essa
    casa foi a primeira coisa que ele comprou após atingir a maioridade. Mesmo com
    seis propriedades de família, ele sentiu a necessidade de ter um lugar só seu.
    Homens comuns tinham apartamentos de solteiro. Mas ele era um duque, então possuía
    um sítio de solteiro. Ali, durante vários anos após sair da faculdade, Griff e
    seus colegas de Oxford levaram a tradição de festas no campo a novas alturas –
    ou baixezas – de libertinagem.


    Sempre um anfitrião generoso, Griff era famoso por abrir sua porta para qualquer
    convidado – principalmente quando se tratava de mulheres bonitas. Os dias eram
    para se dormir, as noites eram para jogatina, bebedeira e outros vícios carnais.


    Winterset Grange tinha se tornado uma tradição tão grande que, quando Griff não
    abriu a casa no último inverno, circularam boatos de sua falência. Ele não estava
    quebrado, é claro. Apenas despedaçado.


    – Você vai abrir o sítio este ano, não vai? – Martin perguntou.

    – Não decidi ainda – Griff respondeu. – Talvez não.

    – Oh, vamos lá, Halford. Você tem que abrir. No inverno passado fui obrigado a
    ir para casa, em Shropshire. Um tédio sem fim, se quer saber. O velho ficou insistindo
    para que eu entrasse para a Igreja.


    – Segundos filhos e seus problemas – Griff suspirou.


    Griff não estava interessado em abrir sua casa para que Martin, Delacre e todos
    os outros adultos imaturos da Inglaterra pudessem vadiar à vontade em seus móveis
    e, bêbados, organizar torneios de bilhar que duravam três dias e três noites seguidos.
    Aquilo foi divertido quando eles eram jovens, mas agora... ele acreditava que
    suas paciência e generosidade tinham acabado. Ou foram redirecionadas.


    Ele só conseguia enxergar uma razão para abrir essa propriedade – e o nome dela
    era Pauline.


    Assim que a ideia pipocou na cabeça dele, sua mente a agarrou. Ele sabia que Pauline
    sonhava em abrir uma livraria em Spindle Cove, mas talvez ela sonhasse com isso
    apenas porque não conseguia conceber algo maior. Ele podia dar algo maior para
    ela.


    Pauline se virou para ele, então, como se pudesse sentir essas intenções novas,
    viscerais. Esgueirando-se em meio à multidão que lotava o reservado, ela chegou
    ao lado dele.


    – Lorde Delacre me convidou para dançar – ela sussurrou. – Não tenho a menor ideia
    de como se faz. Se eu acertar o momento certo para tropeçar, acho que consigo
    jogar nós dois dentro da tigela de ponche. Você me dá um bônus de dez libras?


    – Vinte. – Ele sorriu, apesar do que sentia.


    Griff a observou se afastar de braço dado com Del, a caminho do redemoinho colorido
    de dançarinos.


    Oh, ele não podia se casar com ela. Não podia se casar com ninguém. Mas ele podia
    cuidar dela, ter certeza de que Pauline nunca mais passasse dificuldade. Com apenas
    23 anos, ela tinha trabalhado o bastante para uma vida. Não deveria mais se matar
    de trabalhar. Pauline merecia ser alimentada com as melhores iguarias, mimada
    com os lençóis mais macios, atendida por dezenas de criadas e lavada em banheiras
    profundas de cobre.'
