- pgno: 60
  md: 'Ah. Então essas são as palpitações.

    E aquela, Pauline deduziu, era a ideia que ele fazia de um beijo de verdade. Um
    abraço com calor e determinação, que estivesse sob domínio total dele. Halford
    controlava o ângulo do pescoço dela e a proximidade de seus corpos – e o ritmo
    lento e enlouquecedor de sua língua, que deslizava entre os lábios dela, de um
    lado para outro.

    Ele a beijou com um vigor implacável, como se estivesse lhe aplicando um castigo
    que ela merecesse. Vinte chibatadas com uma língua forte e sensual. Mal sabia
    ele que isso era exatamente o que ela queria, o que desejava com cada osso e músculo
    de seu corpo pequeno e esguio.

    Sim, obrigada. Vou querer outro.


    Aqueles poucos momentos depois que Pauline o tinha beijado estavam entre os mais
    sofridos da vida dela. Ele pareceu ficar tão horrorizado e perturbado. Ela não
    sabia no que estava pensando quando fez isso, só que se sentia muito grata por
    ele ter aberto aquela biblioteca imensa e inestimável para ela, uma atendente.
    Por ter ouvido os sonhos mais secretos dela sem fazer pouco – e, ainda, aperfeiçoando-os
    ao lhe dar aquela ideia brilhante e obscena.


    Ele não podia saber. Não quanto aquilo significava.

    E ainda ele tinha executado aquela manobra ousada, heroica, para impedi-la de
    cair.

    Quando Pauline viu o duque tão de perto, um brilho nos olhos dele sugeriu a ela
    um pensamento estranho: aquela dificilmente era a primeira noite que ele passava
    assombrando os corredores, acordado até tão tarde, tão sozinho. Também pensou
    que ele não tinha ficado tão incomodado com o surgimento dela quanto queria que
    Pauline acreditasse. E que ele podia estar precisando de um beijo... e também
    de um pouco de salvação.


    É claro que, antes de admitir algo assim, ele andaria descalço sobre um leito
    de pregos. Ela deveria ter imaginado como ele reagiria. Todos os homens tinham
    orgulho, e os duques eram os piores. “Admitir fraqueza” devia estar no mesmo nível
    de “luta de cócegas” e “caça de lesma” entre as atividades menos favoritas dele.


    Então ele reagiu dessa forma. Um beijo que era controlado, dominador, possessivo.
    E Pauline não podia dizer que se importava, nem um pouco.

    Ele a segurava com tanta força, agarrando o tecido de sua camisola com a mão,
    enquanto a outra fazia um redemoinho em seu cabelo. Mais tarde ela teria que escová-lo
    até seu braço doer, mas cada escovada valeria a pena. As sensações que corriam
    por seu couro cabeludo dançavam naquele limite delicioso entre o prazer e a dor.

    O peito dele era uma parede sólida de calor, inflamando-a e deixando seus mamilos
    duros e carentes. Nada separava seus corpos, a não ser algumas camadas finas de
    tecido, mas ainda assim ela não se sentia próxima o bastante. Pauline se esfregava
    nele na esperança de amenizar sua aflição. O prazer corria até seu íntimo.

    Quando ela passou os braços ao redor das costas dele, Halford grunhiu, encorajando-a.
    O som profundo e vibrante percorreu o corpo dela e se acomodou como um zunido
    sedutor entre suas coxas. Ela se aninhou ainda mais perto.

    – Assim... – ele murmurou de encontro aos lábios dela. – Assim... está certo.'
