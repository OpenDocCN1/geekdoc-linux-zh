- pgno: 88
  md: 'Griff franzia a testa, lembrando da primeira tarde na vila.

    – Certo. Eu me lembrei. Havia pilhas desse livro. As moças estavam arrancando
    as páginas para decorar bandejas de chá.

    Ela concordou.

    – Elas tentam encontrar utilidade para o livro. As páginas eram usadas para fazer
    cartuchos de pólvora para a milícia, mas depois que a guerra acabou, elas começaram
    com a decoração de bandejas.

    Griff não entendeu a lógica daquilo, mas não quis interrompê-la.

    – De qualquer maneira – ela continuou –, alguns anos atrás eu levei um exemplar
    que estava na taverna para casa. Eu sabia que ninguém sentiria falta, e eu nunca
    tinha tido um livro. Eu precisava descobrir o que deixava aquelas ladies tão bravas.
    Pelo menos metade do livro é mesmo bobagem, concordo. Mas o resto tem apenas conselhos
    práticos. Receita de água de flor de laranjeira. Como escrever convites para festas
    e costurar suas próprias luvas de seda. Sugestões para conversa durante jantares
    sociais. Ler esse livro foi como espiar um mundo diferente através de uma janela,
    até... – ela baixou os olhos – ...até que meu pai o tirou de mim.

    – Seu pai?

    – Ele encontrou o livro. Eu o peguei com o olhar fixo na capa. Meu pai não lê
    muito bem, sabe. Mas, ainda assim, ficou encarando o título por muito tempo. Ele
    não precisou ler as palavras para entender o que aquilo significava: que eu queria
    algo mais.

    Estendendo o braço, ela puxou uma folha de um galho baixo e a enrolou entre os
    dedos.

    – Durante toda minha vida, ele não fez segredo de que eu era uma decepção. Ele
    queria um filho homem para ajudar na fazenda, e nunca escondeu o fato de que me
    achava uma inútil. Mas quando encontrou o livro... pela primeira vez, ele percebeu
    que eu podia não estar feliz com a vida que ele tinha me dado. Ah, isso o deixou
    tão bravo.

    Griff também estava começando a ficar furioso. Não com ela. Nunca com ela.

    – O que ele fez com você? – Griff perguntou.

    Ela hesitou.

    – Pode me dizer.

    – Ele pegou o livro. – Pauline olhou para a folha de árvore em seus dedos. – E
    disse, “Isto não é para você, garota”. E então ele me bateu no rosto... com o
    livro.

    Vou matá-lo. Essa intenção ganhou vida no peito de Griff antes que sua mente pudesse
    conceber as palavras. Ele começou a criar fantasias complexas de como pegaria
    um cavalo e uma espada, para depois cavalgar até Sussex e ter um encontro muito
    curto com Amos Simms. Um que começaria com “Seu bastardo cara de rato” e terminaria
    em sangue.

    Griff calculou quanto tempo a viagem iria demorar e quanta luz do dia ele teria
    ao chegar. E refletiu se permitiria que o homem implorasse por misericórdia, ou
    se iria diretamente ao...

    – Eu tinha 19 anos – ela disse.

    Ele fechou os olhos e inspirou fundo, obrigando-se a abandonar seus pensamentos
    a respeito daquele vilão distante que merecia ser destruído. Ele devia se concentrar
    na'
