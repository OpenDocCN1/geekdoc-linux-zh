- pgno: 87
  md: 'Ele deixou seu olhar cair para o peito dela, o lugar que esteve, a noite toda,
    querendo admirar. Dois montes macios e claros pressionados nos limites do decote
    dela, como duas almofadas. A atenção dele ficou se alternando entre os dois.

    – Tudo bem – ela disse com um sussurro divertido. – Eu também não consigo parar
    de olhar para eles. Este espartilho é uma proeza de engenharia.

    – Eu acho que é feitiçaria.

    – Você está certo quanto à ilusão. Veja. – Ela pegou a mão dele e a levou até
    o peito. Griff congelou, sentindo o desejo disparar dentro de si.

    – Tem enchimento de algodão no espartilho – ela disse. – Está sentindo?

    Ela manteve a mão sobre a dele, moldando-a ao redor da bola de tecido e pele macia.

    – Sim. – Ele engoliu em seco. – Estou sentindo.

    Ele também conseguia senti-la. Quente, maleável e sedutora.

    – Você vê? Não é real. Outro ponto negativo para mim. – Ela adotou aquele tom
    de voz estranho de novo: – “Uma lady que usa de artifícios para chamar a atenção
    de um cavalheiro nunca conseguirá a admiração dele.”

    Com profunda relutância, ele deixou a mão cair do seio dela.

    – Acredite em mim, neste momento, eu bem que gostaria que você pudesse diminuir
    minha admiração. No momento, minha admiração está bem… grande.

    Ela o fitou no fundo dos olhos e soltou:

    – Eu não sou virgem.

    Diabos. Com isso, a ereção dele foi ao máximo, com uma velocidade digna de um
    espadachim. Quando pensou melhor, ele não teve certeza de que poderia desembainhar
    uma espada de verdade com aquela rapidez. Se ele estivesse vestindo uma braguilha
    de metal, seu membro teria batido nela com um tinido audível.

    – Isso não ajuda – ele disse. – O que a faz pensar que poderia ajudar? Eu também
    não sou virgem.

    – Eu não pensei que você fosse, mas…

    – Mas nada. Eu esperava ouvir algo como: “Eu tenho uma doença de pele nojenta”,
    ou “Eu crocito como uma coruja quando tenho um orgasmo”. Essas coisas seriam impedimentos.
    Não sei se o segundo exemplo é forte o bastante, na verdade. A curiosidade pode
    vencer o receio.

    – Mas nobres não querem uma mulher que tenha perdido a virtude. A Sra. Worthington
    foi muito clara.

    – Quem é essa pessoa terrivelmente mal informada que você fica citando? Sra. Wo-
    quem?

    – Ela escreveu um livro de etiqueta. Você nunca ouviu falar? A Sabedoria da Sra.
    Worthington para Jovens. Foi lendo esse livro que eu fiquei sabendo exatamente
    o que uma jovem lady pode, ou não, fazer.

    – Minha mãe que lhe deu isso? – O título parecia um pouco familiar, mas ele não
    acreditava que um livro assim pudesse pertencer à sua biblioteca.

    – Não, não. Faz anos que eu o leio. Há cópias dele por toda Spindle Cove. A Srta.
    Finch, que agora é Lady Rycliff, queria retirar todas as cópias de circulação.
    Existem centenas delas na nossa vila, empilhadas por toda parte.'
