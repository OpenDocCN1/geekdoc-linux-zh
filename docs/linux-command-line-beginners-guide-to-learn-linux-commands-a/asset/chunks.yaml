    \ displayed the disk space\"\n  echo -e \"\\t2\\. Here will be displayed the logged\
    \ on users\"\n  echo -e \"\\t3\\. Here will be displayed the memory usage\"\n\
    \  echo -e \"\\t0\\. Exit\\n\\n\"\n  echo -en \"\\t\\tEnter your option: \"\n\
    \  read -n 1 option\n}\n```\n\nAs I have already discussed, this will help you\
    \ to view the menu anytime by just recalling the function command. Now you need\
    \ the `case` command to integrate the layout and the function to make the menu\
    \ work in real time.\n\n```bash\ncat menu1\n#!/bin/bash\n# simple script menu\n\
    function diskspace {\n  clear\n  df -k\n}\nfunction whoseon {\n  clear\n  who\n\
    }\nfunction memusage {\n  clear\n  cat /proc/meminfo\n}\nfunction themenu {\n\
    \  clear\n  echo\n  echo -e \"\\t\\t\\tWelcome to the Admin Menu\\n\"\n  echo\
    \ -e \"\\t1\\. Her will be displayed the disk space\"\n  echo -e \"\\t2\\. Here\
    \ will be displayed the logged on users\"\n  echo -e \"\\t3\\. Here will be displayed\
    \ the memory usage\"\n  echo -e \"\\t0\\. Exit\\n\\n\"\n  echo -en \"\\t\\tEnter\
    \ your option: \"\n  read -n 1 option\n}\nwhile [ 1 ]\ndo\n  case $option in\n\
    \    0)break ;;\n    1)diskspace ;;\n    2)whoseon ;;\n    3)memusage ;;\n   \
    \ *)\n      clear\n      echo \"Sorry, you went for the wrong selection\";\n \
    \     ;;\n  esac\n  echo -en \"\\n\\n\\t\\t\\tHit any key on the keyboard to continue\"\
    \n  read -n 1 line\ndone\nclear\n```\n\n## Conclusion\n\nSylvia is an avid learner\
