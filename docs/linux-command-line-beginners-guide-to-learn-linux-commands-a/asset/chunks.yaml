    ## An Overview of Navigation in the Shell

    You will easily get bored with Linux if you get stuck in a single spot. You must
    be able to navigate through different files and directories to enjoy your experience
    with this one of a kind operating system. You need to get an idea of where you
    are and what things you have access to and with which command you can access them.
    First of all, you should know where your feet are. To learn this, use the following
    command.


    ```bash

    [aka@localhost ~]$ pwd

    ```


    In most cases, people land in the home directory of their accounts. Now, what
    is the home directory? Let me explain it all. A home directory is a place where
    you can store your files in addition to building up directories. You are the boss
    here. It is like a real home for you. Feel free to store your data here and also
    create multiple directories. In the command `pwd` `p` means print, `w` means working,
    and `d` is for directory.


    ### Is it a tree?

    It doesn’t look like one, but it is one, for sure. As in the Windows operating
    system Linux arranges all its files and folders into a hierarchical structure.
    Yes, it looks like a tree if you could somehow materialize it into something concrete.
    Hence the need for the word ‘tree.’ You may be fascinated to know that things
    are mostly the same among different operating systems such as Windows and Linux.
    The creators changed some names to differentiate these systems for the ease of
    users. For example, what is called a directory in Linux, is commonly known as
    a folder in Windows.


    Let me take you further into the world of Linux directories. First of all, these
    directories become a bit different from Windows’ folders in a way that they can
    carry a large number of files as well as subdirectories. The very first directory
    you are confronted with is the `root` directory.


    ### Where Linux doesn’t agree with Windows

    Well, disagreements happen in the world. If you are a Windows user, you are most
    used to an individual filing system for the hard drive, USB storage device and
    DVD drives. But Linux has defied this system. It offers a single treelike filing
    system for all the external and internal storage devices.


    Windows made things easier for an average user that detached us from the relish
    of complex technical commands. Look, Windows presents the filing system, of course,
    in the form of a tree, in a graphical fashion. There are many plus signs and negative
    signs. With the pluses, you can further explore the branches of the tree while
    the minuses help you close up those branches and simplify the view. The root always
    remains at the top.


    If you are thinking about something as cool as a graphical outlook, stop thinking
    right now. Linux makes it fun by offering you the potential to navigate through
    different files and folders with the help of putting in text commands. In the
    Linux terminal or shell window, you are always in one or another directory that
    is called the current directory. To know your exact position `pwd` command helps
    you as I have explained earlier.


    Do you want to know about the contents of the directory? Everybody does. I believe
    that you have already learned, as well as practiced knowing the directory you
    are currently in. Time to delve deeper into the system. You should know how to
    explore the contents of the directory with a single command. Either you can stay
    in the home directory and explore it, or you can move to your favorite one. To
    explore the directory you are currently working in, try the following command.


    ```bash

    [aka@localhost ~]$ ls

    ```


    Pictures Videos Games Documents


    My friend Sylvia loves to jump from one folder to another at the speed of light.
    While it is fun to do this in Windows, it is faster and easier to do in Linux.
    Just remember the `cd` factor. Sylvia learned it, though the hard way, by jotting
    it down in her notebook and memorizing the entire text. Now she just types `cd`
    and the pathname of the directory she wants to jump into.


    Let me confess it is not as simple as it looks. The pathname is like a magic circle
    in which we jump to reach the directory we want to be in. Pathnames fall into
    two categories: relative and absolute.


    ### Absolute pathnames

    Also known as absolute path or a full path. A pathname is usually made up with
    the sequence of characters, containing the name of the object. The name of the
    directory in which it rests is also part of the name. There can be a directory
    that contains software and programs. In this directory, there are other directories
    to which you need to access. Your path will be like the following.


    ```bash

    [aka@localhost ~]$ cd /usr/lib

    [aka@localhost lib]$

    ```


    You can at any time confirm if you have actually moved to the desired directory
    by applying the `pwd` command.


    ### Relative Pathnames

    You can start from the current directory and move to the parent directory with
    a simple command. Do you love to put in dots like `..`. A single dot refers to
    the current working directory whole the double `..` leads you to the parent directory.


    ```bash

    [aka@localhost lib]$ cd /usr/lib

    [aka@localhost lib]$

    ```


    I want to go to the `/usr`. You can do that either the long way or the shorter
    way. Let’s do this first the longer but safer way.


    ```bash

    [aka@localhost lib]$ cd /usr

    [aka@localhost usr]$ pwd

    /usr

    ```


    Now do this the shorter and the faster way.


    ```bash

    [aka@localhost lib]$ cd..

    [aka@localhost usr]$ pwd

    /usr

    ```


    Done. You have switched it to the parent directory. Wait. We are not all done
    on this. Let’s get back to the working directory once again by two methods. We
    are currently in the parent directory. Remember that. Your screen is currently
    showing the following.


    ```bash

    [aka@localhost usr]$ Type the following.

    [aka@localhost usr]$ cd /usr/lib

    [aka@localhost lib]$

    ```


    Let’s do this in a shorter and faster way. Do you remember what single dot was
    supposed to do?


    ```bash

    [aka@localhost usr]$ cd ./../bin

    [aka@localhost lib]$

    ```


    Sylvia just hated the dots. She always put doubles where she had to insert the
    single and single where a double was needed. One day, when I was taking a quick
    walk by her office, I dropped in and found her messed up with these simple commands.
    A friend in need is a friend indeed. I told her a magic formula for switching
    from parent directory to the working directory. Let’s try that.


    ```bash

    [aka@localhost usr]$ cd bin

    [aka@localhost bin]$

    ```


    Not only are the dots omitted but also the slashes. A trick of the trade: `cd`
    is an abbreviation of current and directory. If you try out just the `cd` command,
    it will bounce you back to the directory in which you first started after you
    logged in.


    ```bash

    [aka@localhost lib]$ cd

    [aka@localhost ~]$

    ```


    More on the `cd` command: Let’s try out the `-`. It is supposed to change the
    working directory to the one you left behind. Suppose you are currently in `lib`
    after switching from the `usr`.


    ```bash

    [aka@localhost lib]$ cd -

    /usr

    [aka@localhost usr]$

    ```


    Another important command to know is `cd ~ username`. If you have another user
    name like `john`, you can put in the name in the place of username to switch to
    that account’s directory.


    Food for thought: It is important to keep in mind that in Linux you need to take
    care that you are using the right case when you are entering a file name in the
    shell window. In this operating system downloads and Downloads are two different
    things.


    If at any time you want to go back up where you started, just type `cd` and press
    enter. Then enter `pwd` to know where you are at the moment.


    ## What you can already do with the ls Command

    It is now time to learn more commands as you already know the basics. You now
    know that `ls` is used to list directories. Also, you can view the content of
    the directories.


    ```bash

    [aka@localhost ~]$ ls

    ```

