    # 条件语句中的问题


    现在我们来谈谈条件语句中的一个小故障。当你输入上述条件语句时，它可能不会按照你预想的方式运行，这仅仅是因为 `$1` 可能是空的。你可能漏掉了设置某个参数，导致命令完全因错误终止，但你可以通过采取以下措施来修复问题。


    ```bash

    if [“$1” = the sky is azure]

    then

    if [ x”$1” = x”hi”]

    then

    ```


    `if` 命令在调用不同命令时是非常多功能的。


    ## 使用其他命令测试条件语句


    在 shell 窗口中输入 `if` 时，紧随其后的任何内容都会被视为命令。这有助于我们理解为什么在 `then` 之前要加一个分号。如果不这样做，我们就必须把它写在下一行。让我们在条件语句中添加一些其他命令。


    ```bash

    [aka@localhost ~]# if grep -q daemon /etc/passwd; then

    > echo The user is hidden in the password file.

    > else

    > echo Look somewhere else. It is not in the password file.

    fi

    ```


    ## && 和 ||


    第一个如预期般表示 `and`（与），而第二个结构表示 `or`（或）。让我们看看如何运行这些命令。


    `firstcommand && secondcom`


    假设 shell 运行 `command1` 且退出码为零，则 shell 将继续执行结构中的第二个命令并运行它。`||` 结构与 `&&` 的不同在于，即使第一个命令返回的非零退出码，它也会执行第二个命令。


    ```bash

    [aka@localhost ~]# if [ahsan] && [sylvia]; then

    > echo "both can go to the concert"

    > elif [ahsan] || [sylvia]

    > echo "only one can go to the concert"

    > fi

    ```


    ## 更多 if-then 特性


    `if` 命令更进了一步以满足用户的预期。你可以在逻辑判断中添加更多内容。一些高级功能包括：


    * 双括号

    * 双方括号


    ### 如何以及在何处使用双括号


    双括号命令在某种意义上是神奇，因为它允许 Linux 用户在脚本中使用数学公式。你可以像其他程序员编写代码一样，在脚本中添加一些高级数学符号。这为用户在编写脚本时提供了更多的自由。让我们直接查看语法以使其清晰。


    ```bash

    [aka@localhost ~]$ #!/bin/bash

    [aka@localhost ~]$ #using double parenthesis

    [aka@localhost ~]$ val1=5

    [aka@localhost ~]$ if ((val1 ** 4 > 50)); then

    > ((val2=$val1**2))

    > echo "The square of $val1 is $val2"

    > fi

    The square of 5 is 25

    ```


    在上述脚本中可以使用其他命令符号列如下：


    * 前自增：`++val`

    * 逻辑否定：`!`

    * 右位移：`>>`

    * 左位移：`<<`

    * 后自增：`val++`

    * 按位取反：`~`

    * 逻辑与：`&&`

    * 逻辑或：`||`


