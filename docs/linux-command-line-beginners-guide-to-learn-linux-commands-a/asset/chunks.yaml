    # What Boot Options Do You have When Kernel Initializes?


    ## Kernel initialization in Linux

    Kernel initialization in Linux consists of some key steps. It starts with the
    examination of the Central Processing Unit (CPU). After that, memory is examined.
    Then comes the device is discovered, root filesystem goes operational and in the
    end user space starts.


    ### The Parameters

    When the kernel starts running, it receives its parameters from the boot loader.
    These parameters guide the kernel on how should it start. These parameters carry
    specifications on the diagnostic output, as well as options, on the drivers of
    the device. The parameters can be viewed by a dedicated command. Let’s look at
    the syntax.


    ```bash

    [aka@localhost ~]$ cat /proc/cmdline

    ```


    Not all parameters are important but one which is the root parameter. The kernel
    is unable to operate without it because it just cannot locate `init`. You might
    be thinking of adding something in the parameter that it doesn’t understand? Well,
    Sylvia added it for sure. She added the `-s` in the parameters. The kernel saved
    the unknown phrase and moved it to `init`. The kernel interprets it as the command
    to start in the single user mode.


    ### The bootloaders

    A bootloader is a program that is responsible for loading the tasks necessary
    for at the boot time. Additionally, it loads the operating system. In the world
    of technology, a bootloader is also called boot manager. As I have already explained,
    this program is kickstarted after the BIOS are done with performing the initial
    checks on hardware. Now we know that the kernel and parameters lie on root filesystem.


    Let’s take a brief look at what is the job of a bootloader. A bootloader has to
    select one kernel from multiple options. Secondly, with the aid of a bootloader,
    users can manually override names of kernel images, as well as parameters. It
    also allows you to switch between different kernel parameters.


    Bootloaders are now not the same as before. They have become more advanced with
    added features like the option of history, as well as menu. However, experts still
    believe that the basic job of the bootloader is to offer different options regarding
    the kernel image as well as selection of parameters.


    Let’s take a look at multiple bootloaders that you may come across when you enter
    the field. `GRUB`, `LOADLIN`, `LILO`, `coreboot` are some of the most popular
    bootloaders of this age. Let’s explore `GRUB`.


    ## Getting into the Details of GRUB

    Bootloaders are one of the reasons due to which users run away from Linux operating
    systems. If you are Windows OS user, you don’t have to bother about the bootloader,
    but this is not the case with Linux operating system. As a Windows user, you switch
    on the laptop or your personal computer and that’s it. If there is a problem in
    the booting system, you can simply run the Windows Recovery program to repair
    the damage and bring the operating system to its normal health. You just have
    to click on the button and the rest is the job of the operating system itself.
    That’s quite amazing, but the biggest problem with it is that you cannot learn
    anything about the insides of the operating system. Sylvia had been a Windows
    user for ten years and she didn’t have the faintest idea about what a bootloader
    is, what is its job, and how can you use it?


    Linux takes the tough course. It makes users learn the intricate details about
    complex things in the operating system. It reroutes our minds toward the background
    technology of the operating system. Let’s move on to the bootloader itself to
    understand how it processes.


    ### How does it work?

    You make your computer boot and as I have explained, the BIOS, after running some
    checks, passes the control of the machine to the boot device that differs from
    user to user. It can be a floppy or a hard disk drive. We already know that the
    hard disk has different sectors. The first of which is known as Master Boot Record
    (`MBR`).


    `GRUB` drives out the `MBR` code and fills in its own. It helps users navigate
    the file system, which facilitates users to select the desired kernel image as
    well as configuration. `GRUB` is the short form of Grand Unified Boot Loader.
    Just explore the menu of the `GRUB` to learn more about it. Mostly the bootloader
    is hidden from the users and in order to access the bootloader, you should hold
    the `SHIFT` button for a while immediately after the BIOS startup shows up. There
    also is an automatic reboot problem. To avoid that, press `ESC` and disable the
    timeout of automatic reboot which starts counting right after the `GRUB` menu
    shows up. If you want to view the configuration commands of the boot loader, press
    `e` to enter the default boot option.


    ## Getting familiarized with GRUB

    Let’s get to know the `GRUB` notation. Let’s take a look at the `GRUB` entry.


    ### (hd0,1)

    If you look at the entry, you will know that the brackets are an integral part
    of the entry. You remove them, you disturb the syntax. All the devices in `GRUB`
    have brackets on them. The `hd` means hard disk. If the device is other than the
    hard disk, the value will be replaced with `fd` (floppy disk) and `cd` for CD-ROM.
    Please note that there also are two numbers. The first number refers to the number
    of the hard drive in the system. Here it denotes the first hard drive. Similarly,
    `1` denotes the second hard drive while `2` denotes the third har drive. That’s
    how it goes on.


    You can change the value of the integers by putting in the number of the hard
    disk that you want to explore. It is evident from the entry that `GRUB` cannot
    differentiate between different types of drives like `SCSI` and `IDE`. In the
    `GRUB` menu the primary partitions can be identified from integers from `0` to
    `3` where `0` is for the first hard disk while `3` is for the fourth partition.
    Logical partitions move from `4` to upwards.


    `GRUB` can search all partitions for a `UUID` to locate the kernel. If you want
    to see how the `GRUB` works on the Linux operating system, just hit `C` while
    you are at the editor and you will reach the `GRUB` prompt. Something similar
    to the following will appear on the screen of the editor.


    ```text

    grub> This is the GRUB command line. Get started by entering any command here.
    In order to get started, you need to run a diagnostic command.

    grub> ls

    ```

