    for the ease of users. For example, what is called a directory in Linux, is commonly
    known as a folder in Windows.Let me take you further into the world of Linux directories.
    First of all, these directories become a bit different from Windows’ folders in
    a way that they can carry a large number of files as well as subdirectories. The
    very first directory you are confronted with is the ‘root’ directory.Where Linux
    doesn’t agree with WindowsWell, disagreements happen in the world. If you are
    a Windows user, you are most used to an individual filing system for the hard
    drive, USB storage device and DVD drives. But Linux has defied this system. It
    offers a single treelike filing system for all the external and internal storage
    devices.Windows made things easier for an average user that detached us from the
    relish of complex technical commands. Look, Windows presents the filing system,
    of course, in the form of a tree, in a graphical fashion. There are many plus
    signs and negative signs. With the pluses, you can further explore the branches
    of the tree while the minuses help you close up those branches and simplify the
    view. The root always remains at the top.If you are thinking about something as
    cool as a graphical outlook, stop thinking right now. Linux makes it fun by offering
    you the potential to navigate through different files and folders with the help
    of putting in text commands. In the Linux terminal or shell window, you are always
    in one or another directory that is called the current directory. To know your
    exact position ‘pwd’ command helps you as I have explained earlier.Do you want
    to know about the contents of the directory? Everybody does. I believe that you
    have already learned, as well as practiced knowing the directory you are currently
    in. Time to delve deeper into the system. You should know how to explore the contents
    of the directory with a single command. Either you can stay in the home directory
    and explore it, or you can move to your favorite one. To explore the directory
    you are currently working in, try the following command.[aka@localhost ~]$ ls


    Pictures Videos Games DocumentsMy friend Sylvia loves to jump from one folder
    to another at the speed of light. While it is fun to do this in Windows, it is
    faster and easier to do in Linux. Just remember the ‘cd’ factor. Sylvia learned
    it, though the hard way, by jotting it down in her notebook and memorizing the
    entire text. Now she just types ‘cd’ and the pathname of the directory she wants
    to jump into.Let me confess it is not as simple as it looks. The pathname is like
    a magic circle in which we jump to reach the directory we want to be in. Pathnames
    fall into two categories: relative and absolute. Shall we deal with the ‘absolute’
    first?Absolute pathnames: Also known as absolute path or a full path. A pathname
    is usually made up with the sequence of characters, containing the name of the
    object. The name of the directory in which it rests is also part of the name.
    There can be a directory that contains software and programs. In this directory,
    there are other directories to which you need access. Your path will be like the
    following.[aka@localhost ~]$ cd/ usr/lib


    [aka@localhost lib]$You can at any time confirm if you have actually moved to
    the desired directory by applying the ‘pwd’ command. Relative Pathnames : You
    can start from the current directory and move to the parent directory with a simple
    command. Do you love to put in dots like (….). A single dot refers to the current
    working directory whole the double (..) leads you to the parent directory.[aka@localhost
    ~]$ cd/ usr/lib


    [aka@localhost lib]$I want to go to the /usr. You can do that either the long
    way or the shorter way. Let’s do this first the longer but safer way.[aka@localhost
    lib]$ cd/ usr


    [aka@localhost usr]$ pwd


    /usrNow do this the shorter and the faster way.[aka@localhost lib]$ cd..


    [aka@localhost usr]$ pwd


    /usrDone. You have switched it to the parent directory. Wait. We are not all done
