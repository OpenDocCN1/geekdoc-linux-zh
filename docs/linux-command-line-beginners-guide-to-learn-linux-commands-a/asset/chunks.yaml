    structure. The info files in a Linux also are in the form of a tree. They are
    built into individual nodes. Each one of them contains a single topic. There also
    are hyperlinks for easy navigation to another node. Well, they are not dyed in
    blue, just as in Windows. They can be identified by their leading asterisk. Move
    over the cursor and strike the Enter key to open it.The info command is very interesting
    to use. You can use it from multiple angles. If you want information on the physical
    location of the file, the syntax is given as under:[aka@localhost ~]$ info –w
    cvs


    /usr/share/info/cvs/info.gzIn case you need information on the options pertaining
    to a particular command, you can do this by making a simple change in the syntax.[aka@localhost
    ~]$ info -O mvNext: rm invocation,  Prev: install invocation,  Up: Basic operationsIt
    displays the options node for the mv command. You can learn a lot with the help
    of info command. When Sylvia was learning Linux command line, she used to keep
    a notebook with her to jot down important things they came across while running
    the shell window. This helped her a lot. She picked up important pieces of information
    she knew.Let’s look at the options the info command has to offer.


    *   -O takes us to the options available for a particular command line.


    *   -d, d for directory, helps us add directory to the INFOPATH


    *   -k finds out STRING in all the indices available in all the manuals.


    *   -o is about offering selected nodes to the file.


    *   -version offers users information about the version.


    The apropos CommandFor a normal human being, using Linux is not a child’s play.
    It is not that it is something ethereal which the earthmen don’t understand, but
    it is its commands that make it nothing less than a horrible thought. It is almost
    a nightmare for me to even think that I had to memorize each command to be a Linux
    pro. If you are just like me and cannot remember a ton of commands that Linux
    has to offer, perhaps you need a comprehensive lecture on this very command. It
    just saves me from lots of hassle of remembering so many commands.The skilled
    hands behind the development of Linux also understand this. That’s why they have
    created the apropos command. Just a keyword of a command is enough for apropos
    to transport it in front of your eyes. This command helps users to be more efficient
    and effective when they are at the shell window. Shall we see the syntax now?[aka@localhost
    ~]$ apropos keyword'
