    \ of America\n\n# Chapter 7: Moving On To The Advanced Level In Shell Scripting\n\
    When you get used to writing shell scripts, you will be able to use your own scripts\
    \ somewhere else to execute a program. A small code can be integrated into another\
    \ script to get the desired result. Writing large scripts can be an exhaustive\
    \ exercise to do that’s why the shell offers programmers a convenient way to do\
    \ script writing. There are user-defined functions that can make script writing\
    \ easy and fun.\n\n## The Shell Functions\nShell functions save you from repeat\
    \ writing the same code for different tasks. Displaying messages and doing mathematical\
    \ calculations can be tedious for you when you have to do that over and over again.\
    \ With shell functions, you can write once and then use the block of code over\
    \ and over again.\n\n### How to Create Function\nYou can use two formats to create\
    \ functions in bash shell scripts. The first format can be dissected into the\
    \ keyword `function` and the name that you assign to the block of the code. See\
    \ the syntax as under:\n\n```bash\nfunction name that you will assign to the block\
    \ code {\n  commands\n}\n```\nThe name means the unique name you assign to your\
    \ particular function. The commands can be a single or multiple bash command.\
    \ You can add many or as little command as you desire. Just call the function\
    \ and it will execute the commands in the order in which you place them in the\
    \ script. The `function` command doesn’t add to or cut from the performance of\
    \ the script. It just flows in the normal order.\n\n### How to Use the Function\
    \ Script\nWhen you are about to use the `function` command, don’t forget to assign\
    \ it a name. Let’s see an example.\n\n$ `cat` `testfile`\n```bash\n#!/bin/bash\n\
    # Let’s see how to use a function in a script\nfunction functest1 {\n  echo \"\
    Let’s see how function works\"\n}\ncount=1\nwhile [ $count -le 5 ]\ndo\n  functest1\n\
    \  count=$[ $count + 1 ]\ndone\necho \"The loop ends here\"\nfunctest1\necho \"\
    this makes the end of this script\"\n```\n$ `./testfile`\nLet’s see how function\
    \ works\nLet’s see how function works\nLet’s see how function works\nLet’s see\
    \ how function works\nLet’s see how function works\nThe loop ends here\nLet’s\
    \ see how function works\nthis makes the end of this script\n\nYou can see that\
    \ each time you refer back to the `functest1`, the function that you have named,\
    \ the bash shell gets back to the same to execute the commands you had left in\
    \ there. That means you are saved from the hassle of repeating the script in the\
    \ command line. Just remember the unique name that you assign to the function.\
    \ I hope you have understood by now why the name is so important.\n\nYou don’t\
    \ have to write the shell function in the start. Instead, you can also write in\
    \ in the middle of the script. But you have to define the function before using\
    \ it, otherwise you will get an error message. Let’s see an example.\n\n$ `cat`\
    \ `testfile`\n```bash\n#!/bin/bash\n# put the shell function in the middle of\
    \ the script\ncount=1\necho \"This line is placed before the function definition\"\
    \nfunction functest1 {\n  echo \"Now this is just a function\"\n}\nwhile [ $count\
    \ -le 5 ]\ndo\n  functest2\n  count=$[ $count + 1 ]\ndone\necho \"The loop has\
    \ reached its end\"\nfunc2\necho \"This heralds the end of the script\"\nfunction\
