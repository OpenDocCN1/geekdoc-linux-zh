    # The Which Command


    You can use this command to track the executable file. On Linux systems, unlike
    the Windows operating system, more than one version of programs are installed.
    This command tells us where to find the program.


    Let’s look at the syntax:

    `/bin/cd`


    ```bash

    [aka@localhost ~]$ which rm

    /bin/rm

    ```


    It doesn’t work on built in programs. See the following syntax.

    ```bash

    [aka@localhost ~]$ which ls

    /usr/bin/which: no 1s in (/usr/local/sbin:/bin:/sbin:/usr/bin:/usr/sbin:/usr/local/bin)

    ```


    ## The info which command


    this command displays the help information.


    ```bash

    [aka@localhost ~]$ info which

    ```


    Next: Which Program, Prev (dir), Up: (dir) ‘which’: Show the full path of commands


    The ‘which’ program shows the full path of (shell) commands. This file documents
    ‘which’ version 2.21, updated 20 March 2015.


