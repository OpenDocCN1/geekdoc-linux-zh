    [aka@localhost ~]$ apropos option keyword

    你一次可以使用一个关键词。


    [aka@localhost ~]$ apropos email

    它将显示所有关于 `email` 的必要信息。为了增加一些趣味性，你可以使用选项 `-d`，它会触发终端返回与你输入的关键词相关的路径、`man` 目录等。


    [aka@localhost ~]$ apropos –d email

    列表还将继续。我刚刚只写了略于一半的 `apropos` 命令在窗口中返回的细节。


    你是 Google 用户吗？如果是的话，你可能知道 `google` 无法看到你在苦苦思索需要搜索的确切关键词时的痛苦。你输入一个词，就会弹出一个包含最相关搜索短语的列表。通常，我会选择列表中的一个短语。想象一下，如果你在
    Linux 中也能使用类似的功能就好了。幸运的是，你可以这样做。使用 `-e` 选项。让我们直接进入语法。


    [aka@localhost ~]$ apropos –e compress

    你将得到一个以“compress”开头的命令列表。


    ### 行业小技巧


    能否组合不同的命令并获得结果？绝对可以。你可以这样做。我会写下语法。


    [aka@localhost ~]$ cd /usr; ls; cd -

    ```bash

    bin games include lib lib64 libexec local sbin share src tmp

    ```

    `/usr`

    我们成功地一次执行了三个连续命令：切换目录到 `/usr`，列出目录，然后返回到执行命令之前的目录。这三个操作在一个命令中完成了。


    ### 创建我们自己的命令


    我们要不要尝试创建我们自己的命令？我们可以借助刚刚尝试并测试过的命令来这样做。想一个可能的名称，并确认它没有被占用。


    [aka@localhost ~]$ type xinSh: type; xin; not found

    所以，`xin` 不存在。这里是创建别名（alias）的语法。


    [aka@localhost ~]$ alias xin=’cd/usr; ls; cd –‘

    记住这个字符串并找到一个未被占用的名称。执行命令。太棒了！看起来你已经创建了自己的命令。


    让我们试试这个新命令。


    [aka@localhost ~]$ xin

    ```bash

    bin games include lib lib64 libexec local sbin share src tmp

    ```

    `/usr`

    恭喜！要确认的话，运行 `type` 命令查看你的命令 `xin` 被别名指向了哪里。


    [aka@localhost ~]$ type xin

    `xin` 别名指向 `cd/usr; ls; cd -`


    如果你想查看环境中所有的别名，请按照以下语法操作。


    [aka@localhost ~]$ aliasegrep=''egrep --color=auto''fgrep=''fgrep --color=auto''grep=''grep
    --color=auto''l.=''ls -d .* --color=auto''ll=''ls -l --color=auto''ls=''ls --color=auto''mc=''.
    /usr/libexec/mc-wrapper.sh''which=''(alias; declare -f) /usr/bin/which --only-read
    --show-tilde''xin=''cd/usr; ls; cd -''

    *(注：原文包含一个压缩的别名列表；核心逻辑已保留。）*


    ### I/O 传奇


    我们将学习 shell 中的输入和输出。你将使用元字符。基本上，这负责在文件之间重定向 I/O（输入输出）。此外，它还被用于创建管道（pipelines）。


    #### 标准流


    几乎所有基于计算机的程序都会响应输入并输出。例如，如果你正在浏览网站并点击后退按钮，会弹出一个窗口阻止你返回，否则你将丢失数据。当你尝试关闭一个未保存的文件时，也会弹出同样的窗口。你在键盘上输入按键就像你现在要这样做一样；其结果显示在桌面、搜索栏或终端模拟器中。这就是
    I/O 系统通用的运行方式。一些错误信息会像门口的精灵一样出现。


    #### 剖析 I/O 系统


    标准输入：被赋予数字 `0`。你的键盘被用于输入。简写形式，它看起来像 `stdin`。


    标准输出：它的数字是 `1`。你猜对了。当然，输出会在你眼前的屏幕上显示。无疑，你看到了。简而言之，它显示为 `stdout`。


    标准错误：赋予数字 `2`。如果你在输入中漏掉了某些内容，或者不确切命令，`bash` shell 会抛出一个错误框。简写为 `stderr`。关于键盘和操作系统之间的关系，重定向过程并不复杂。你会理解它是怎么的。


    #### 重定向到文件


    重定向比其他命令稍微技术化一点，也稍微不同。你将使用 `>` 和 `<`。有时为了所需的输出，你必须使用 `>>` 或 `<<`。但别担心，我们将学习使用它们。开始吧。你必须使用
    `>` 符号配合所需的文件名。你可以将命令的输出发送到你的文件。让我们用简单的方法学习。你正在 Microsoft Word 中工作。你输入了自己的名字，但不想让它显示在屏幕上，而是希望它移动到特定的文件中。


    [aka@localhost ~]$ echo Hi there. > test.txt

    [aka@localhost ~]$ cat test.txt

    Hi everyone.


    只有在你要求时，文件才会返回给你。


    #### 擦除输出


    是的，你可以这样做。Linux 中的命令绝对就像魔术棒。通过一个简单的命令，你就可以覆盖命令。让我们试试看。


    [aka@localhost ~]$ cat test.txt

    Hi everyone

    [aka@localhost ~]$ leo > test.txt

    Sh: leo: command not found

    [aka@localhost ~]$ cat test.txt

    你可以看到文件仍然存在，但它仍被覆盖并擦除了。当我之后运行 `cat` 命令时，没有任何返回。我不希望文件被这样擦除：你是这个意思吗？当然，你是这个意思。有方法可以做到。我们有
    `noclobber` 选项来防止覆盖文件导致的删除。让我们学习语法。


    [aka@localhost ~]$ echo I love blue sky. > mydocuments.txt

    [aka@localhost ~]$ cat mydocuments.txt

    I love blue sky.


    [aka@localhost ~]$ set –o noclobber

    [aka@localhost ~]$ echo the sky is azure. > mydocuments.txt

    sh: mydocuments.txt: cannot overwrite file

    [aka@localhost ~]$ set +o noclobber

    [aka@localhost ~]$ echo the sky is azure. > mydocuments.txt

    [aka@localhost ~]$ cat mydocuments.txt

    the sky is azure.


    第一条命令阻止了输出被覆盖，但第二个命令将其恢复到了之前的状态。


    #### 覆盖 noclobber


    假设我们开启了 `noclobber` 来阻止覆盖过程。尝试这一个。


    [aka@localhost ~]$ echo the sky is azure. > mydocuments.txt

    sh: mydocuments.txt: cannot overwrite file

    [aka@localhost ~]$ echo the sky is azure. >| mydocuments.txt

    [aka@localhost ~]$ cat mydocuments.txt

    the sky is azure.


    符号 `>|` 发挥了魔法。显然，`noclobber` 被覆盖了。如果你想重定向两个文件的内容而不覆盖第一个，有一个命令可以做到。正如我所说，我们有为此设计的魔法符号。所以，让我们这样做吧。


    [aka@localhost ~]$ cat mydocuments.txt

    I love blue sky.


    [aka@localhost ~]$ echo the sky is azure. >> mydocuments.txt

    [aka@localhost ~]$ cat mydocuments.txt

    I love blue sky

    the sky is azure


    这个过程被称为追加（appending）。这很好，因为两个文件的内容在过程中合并了。


    #### 重定向错误消息


    让我们先在终端模拟器中练习这个。


    [aka@localhost ~]$ echo hi everyone

    hi everyone


    [aka@localhost ~]$ echo hi everyone 2> /dev/null

    hi everyone


    [aka@localhost ~]$ zcho hi everyone 2> /dev/null

    [aka@localhost ~]$


    [aka@localhost ~]$ zcho hi everyone

    sh: zcho: command not found


    '
- fmt: "\nSo, you can see how this command can make our display less messy. There\
    \ won’t be lengthy explanations if you type it wrong. Make sure to keep your display\
    \ clean in the future.\n\n## Pipelines\n\nYour commands are redirected through\
    \ a network of pipelines. The standard inputs and outputs are received and displayed,\
    \ respectively, with the help of the pipelines. \n\nThe `|` is the pipe operator.\
    \ It is like a wall that helps pass one output to some other virtual place. It\
    \ is just like you are transferring some physical commodity. Executing the pipeline\
    \ command will help you push one output to another command. No activity on the\
    \ display screen is required neither is required the dull exchange through temp\
    \ files. A pipe does all the process in the background in complete silence. One\
    \ important thing to remember is that you can only send the data. You cannot receive\
    \ it from the same pipe. The information flows in just one direction.\n\nI am\
    \ using the `less` command because it displays the standard output of almost all\
    \ commands. Test it and see the results. The results may differ from user to user.\n\
    \n```\n[aka@localhost ~]$ ls -1 /usr/bin | less\n```\n\n## Redirecting Standard\
    \ Input\n\n### The cat command — Concatenate files\n\nThis command is special\
    \ in that it tends to read one and more than one files. It also moves files and\
    \ copies them to standard output. Let’s see how it runs.\n\n```\n[aka@localhost\
    \ ~]$ cat 1s-output.txt\n```\n\nIt is important to mention here that some users\
    \ consider `cat` being similar to the `TYPE` command. But the reality is different.\
    \ Files can be displayed with the help of the `cat` command without being paged\
    \ first. The above command displays the contents of `ls-output.txt` file. The\
    \ output will come in the form of short text files and not in the form of pages.\
    \ It speeds up the process. Not only does paging take considerable time, but it\
    \ is also more complex and time consuming to display it in the form of pages on\
    \ the screen.\n\nYou can add multiple files to the `cat` command as arguments.\
    \ This command can also be used to append multiple files. If we have multiple\
    \ files named `snazzy.jpeg.01` `snazzy.jpeg.02` ………… `snazzy.jpeg.99`, now you\
    \ want to join all these files. Let’s try the following command.\n\n```\n[aka@localhost\
    \ ~]$ cat snazzy.jpeg.0* > snazzy.jpeg\n```\n\nWe will have the files in the right\
    \ order. The `cat` command welcomes standard input that is linked to our typing\
    \ something on the keyboard.\n\n```bash\n[aka@localhost ~]$ cat > azure_sky.txt\n\
    the sky is turning azure.\n```\n\nYou have just created a file by using the `cat`\
    \ command. You have also put some value in the file. When you are done with the\
    \ above two steps, press `ctrl + d` to reach the end of the file. You can bring\
    \ back the content of the file with the help of the same command.\n\n```\n[aka@localhost\
    \ ~]$ cat azure_sky.txt\nthe sky is turning azure.\n```\n\n### Pipelines: Commands\n\
    \nCommands can surf through the standard input to read data and then send it to\
    \ the standard output. This is done with the help of a special shell feature dubbed\
    \ as pipelines.\n\n```\n[aka@localhost ~]$ ls -1 /usr/bin | less\n```\n\n### Filters\n\
    \nYou can utilize pipelines to perform other operations connected to data on your\
    \ system. You have the freedom to join together multiple commands in a single\
    \ pipeline which will then be known as filters. Let’s try one filter. For this\
    \ one, we are appending together `/bin` and `/usr/bin` to see what they have got\
    \ for us.\n\n```bash\n[aka@localhost ~]$ ls /bin /usr/bin | sort | less\n```\n\
    \nThis is how filters can help you produce a single sorted listed. It is the magic\
    \ of the `sort` command that we put into the pipeline. Otherwise, there would\
    \ have been two lists for each directory. It saves times and is more efficient\
    \ to view multiple directories.\n\n### The grep\n\nThis also is one of the powerful\
    \ programs that are used to find text patterns in the files. Let’s look at how\
    \ it is used.\n\n```\n[aka@localhost ~]$ grep pattern [file……]\n```\n\nThis command\
    \ is used to hunt down matching pattern lines in the files. Let’s try out the\
    \ command.\n\n```bash\n[aka@localhost ~]$ ls /bin /usr/bin | sort | uniq | grep\
    \ zip\n```\n\n### The head/tail\n\nThis command is used to retrieve a specific\
    \ part of the information. As apparent from the command name, you can print the\
    \ head or the tail of a particular file. It means you can get the first few lines\
    \ of a file printed or the last few lines of the same file. Ten lines from the\
    \ start or ten lines from the last. That’s how it goes. The number of lines can\
    \ be altered by applying the `-n` option. Let’s scroll to the syntax.\n\n```bash\n\
    [aka@localhost ~]$ head -n 8 filename.txt\n```\n\nThis command can be used in\
    \ the pipelines as well.\n\n```bash\n[aka@localhost ~]$ ls /usr/bin | tail -n\
    \ 10\n```\n\nWith the help of the `tail` option, you can view the files in real\
    \ time, and review the progress of the log files. They keep popping up on your\
    \ screen as long as you keep the screen open. To stop you need to press `ctrl\
    \ + C`.\n\n```\n[aka@localhost ~]$ tail -f /var/log/messages\n```\n\n### Exploring\
    \ the tee Command\n\nLinux also has the `tee` command. Well, you might be thinking\
    \ of golf at the moment. Just image you are actually in a golf club to tee off.\
    \ Golf is an amazing sport, but Linux is still better than that when it comes\
    \ to the thrill and magic of the moment. Another analogy is with plumbing. You\
    \ have to fix a `t` on a pipe to guide it through your washrooms to the water\
    \ tank.\n\nThis program has a special job of reading the standard input. It reads\
    \ it and then copies it to the standard output. As a result, the data flows downwards.\
    \ You can capture what is being passed in the pipeline. Let’s see the syntax.\n\
    \n```\n[aka@localhost ~]$ ls /usr/bin | tee ls.txt | grep zip\n```\n\n### The\
    \ uniq command\n\nThis command is used to sort a file. Both `uniq` and `sort`\
    \ are applied together. To read more about `uniq`, please take a look at its man\
    \ page. I have already briefed you about the man page. The following command will\
    \ not sort the duplicates. You can see by running it on the terminal.\n\n```bash\n\
    [aka@localhost ~]$ ls /bin /usr /bin | sort | uniq -d | less\n```\n\nTo sort the\
    \ files you have to remove the `-d` option from the syntax. Now try it on.\n\n\
    ```bash\n[aka@localhost ~]$ ls /bin /usr /bin | sort | uniq\n```\n\n### The wc\
    \ Command\n\nAs visible from the abbreviation, this one is to count the words\
    \ in a file content. It also counts how many lines there are in the file content\
    \ in addition to bytes.\n\n```bash\n[root@localhost ~]$ wc mydocuments.txt\n```\n"
