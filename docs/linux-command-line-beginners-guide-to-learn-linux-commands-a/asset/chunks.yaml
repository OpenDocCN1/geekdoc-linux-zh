    # which 命令


    你可以使用此命令来跟踪可执行文件。在 Linux 系统上，与 Windows 操作系统不同，会安装多个版本的程序。此命令告诉我们去哪里找到该程序。


    让我们来看语法：

    `/bin/cd`


    ```bash

    [aka@localhost ~]$ which rm

    /bin/rm

    ```


    它对内置程序无效。参见以下语法。

    ```bash

    [aka@localhost ~]$ which ls

    /usr/bin/which: no 1s in (/usr/local/sbin:/bin:/sbin:/usr/bin:/usr/sbin:/usr/local/bin)

    ```


    ## info which 命令


    此命令显示帮助信息。


    ```bash

    [aka@localhost ~]$ info which

    ```


    下一个：Which Program，上一个 (dir)，向上：(dir) ‘which’：显示命令的完整路径


    ‘which’程序显示（shell）命令的完整路径。此文件记录了 ‘which’ 版本 2.21，更新于 2015 年 3 月 20 日。


    *   **Menu（菜单）**: `Which Program`：‘which’ 程序

    *   **Invoking Which（调用 Which）**: 如何调用 ‘which’

    *   **Option Summary（选项摘要）**: 命令行选项概览

    *   **Return Value（返回值）**: ‘which’ 的返回值

    *   **Example（示例）**: 调用示例

    *   **Bugs（缺陷）**: 已知缺陷

    *   **See Also（另需参考）**: 相关的 UNIX 命令

    *   **Index（索引）**: 索引


    Info: (which)Top, 20 lines --All

    欢迎使用 Info 版本 6.5。输入 H 获取帮助，输入 h 查看教程。如果你输入 H，屏幕上将显示以下详细信息。


    基础信息命令键：

    *   `H`: 关闭此帮助窗口

    *   `q`: 完全退出 Info

    *   `h`: 调用 Info 教程

    *   `Up`: 向上移动 Info 教程

    *   `Down`: 向下移动一行

    *   `PgUp`: 向上回翻一页。

    *   `PgDn`: 向下翻一页。

    *   `Home`: 回到此节点的开头。

    *   `End`: 去到此节点的末尾。


    Info: *Info Help*，302 行 --Top

    现在输入 h，以下详细信息将出现在你的屏幕上。

    Next: Help-P，Prev: Help-Small-Screen，Up: Getting Started


    ## help 命令


    你已经学习了许多命令及其解决方案。如果你在课程中间被困住且不知道该怎么办，是时候了解那个可以让你摆离困境的命令了。Sylvia 在学习阶段非常喜欢这个功能。有一天，我正计划在海滨边的度假村庆祝女儿的生日，Sylvia
    打了电话给我。她很恐慌，因为她在办公室的电脑上搞乱了某些命令。她尝试使用 help 命令，但无果。当 help 命令未能起作用时，她慌慌了。实际上，help
    命令仅为 shell 内置命令创建。


    ```bash

    [aka@localhost ~]$ help cd

    cd: cd [-L|[-P [-e]] [-@]] [dir]

    更改 shell 工作目录。

    ```


    help 命令的一个有趣之处是可以在 shell 窗口内了解命令提供了哪些功能。让我们看看语法。


    ```bash

    [aka@localhost ~]$ help help

    help: help [-dms] [pattern ...]

    显示关于内置命令的信息。

    ```


    ### --help 选项


    此命令将帮助你探索更多关于可执行程序的信息。这个非常了不起，因为它显示了与程序相关的不同选项以及支持的语法。这使得边学边练习更多命令变得更容易。你不需要为了小障碍去查阅书籍。


    ```bash

    [aka@localhost ~]$ cp --help

    ```


    帮助功能还可以配合不同的选项使用，以便在途中获取更多信息。


    配合 –d 使用：

    ```bash

    [aka@localhost ~]$ help –d help

    help – 显示关于内置命令的信息

    ```


    配合 –s 使用：

    ```bash

    [aka@localhost ~]$ help –s help

    help: help [-dms] [pattern …]

    ```


    ## man 命令


    在大多数情况下，可执行程序会提供一份被称为 man page（手册页）的正式文档。你可以通过以下命令查看该文档。


    ```bash

    [aka@localhost ~]$ man program

    ```


    在这里，`program` 指你想查看的命令。man 页面的显示方式如下：有一个标题。还有一个描述部分，解释了为什么要使用特定的命令。此外，还会带有命令选项描述的列表。让我们剖析一个
    `printf` 命令的 man 手。


    ```bash

    [aka@localhost ~]$ man printf

    ```


    将有一个文档名称。下面是 SYNOPSIS（概要）标题。接着是描述。该部分带有关于特定程序可用选项的深入细节。对于 `printf`，`--help` 和
    `version` 是可用的。


    这就是手册的完整页面。翻阅整个页面来定位特定信息需要花费大量时间。别担心。你可以输入针对性的命令来阅读手册的特定章节。man 命令允许你指定章节号。看看如何操作。


    ```bash

    [aka@localhost ~]$ man section search_term

    [aka@localhost ~]$ man 9 passwd

    ```


    ## whatis 命令


    如果你不知道特定命令提供了什么，可以运行 `whatis` 命令。


    ```bash

    [aka@localhost ~]$ whatis ls

    ls (1) - list directories

    ```


    ## info 命令


    对于 GNU 用户，有一个 man 的替代方案叫做 `info` 页面。这些页面以树形结构存储。语法如下：


    ```bash

    [aka@localhost ~]$ info menu-item

    ```


    一个示例：

    ```bash

    [aka@localhost ~]$ info -d cvs

    ```


    我已经告诉过你，info 文件是以树形结构存储的。每一个节点包含一个主题。它们也有超链接，方便跳转到另一个节点。而且，它们不是蓝色的，只需通过星号识别。移动光标并按下回车键即可打开它。


    `info` 命令非常有意思。你可以从多个角度使用它。如果你需要关于特定命令的信息，可以通过简单的语法来实现：


    ```bash

    [aka@localhost ~]$ info -O mv

    ```


    下一个：rm invocation，上一个：install invocation，向上：Basic operations


    它显示 `mv` 命令的选项节点。你可以通过 `info` 命令学习很多。当 Sylvia 学习 命令行时，她习惯随身带一个笔记本记录遇到的重要事情。这对她帮助很大。她掌握了重要的信息。


