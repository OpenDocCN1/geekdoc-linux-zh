    # 存储媒体


    我们通过 Windows 操作系统了解了硬盘、软盘和 CD 驱动器。如果你认为 Windows 让你能够轻松处理这些设备，那么 Linux 提供的功能更多。你可以处理所有的存储设备，如硬盘、虚拟存储（如
    RAID）、网络存储以及逻辑卷管理器（LVM）。我将解释一些关键命令，你可以使用这些命令轻松且高效地处理所有存储设备。


    ## 挂载和卸载存储设备的命令


    你可以借助一些简单的命令来挂载和卸载存储设备。如果你使用的是非桌面系统，由于服务器对系统配置有一些复杂的要求，你必须手动完成这些操作。


    实现这一目标通常涉及一些步骤，例如将存储设备与文件系统树关联起来。程序员将其称为“挂载”（mounting）。此后，存储设备就开始参与操作系统的功能运行。我们之前已经学习过文件系统树。所有的存储设备都连接到文件系统树上。这与
    Windows 系统不同，Windows 为每个设备都拥有独立的树形结构。例如，请看 `C:\` 和 `D:\` 驱动器。你可以通过 `/etc/fstab`
    命令来查看设备列表。


    如果你想查看已在 Linux 计算机系统上挂载的文件系统列表，我们称之为 `mount` 命令。在命令行输入该命令，你将获得挂载文件系统的列表。


    ```

    [aka@localhost ~]$ mount

    ```


    列表将显示挂载点类型以及文件系统类型。


    ## 由你决定设备名称


    尽管确定设备名称被认为是一项困难的任务，但仍有一些简单的方法可以掌握它。要弄清楚设备的名称，我们必须首先列出 Linux 操作系统上的设备。


    ```

    [aka@localhost ~]$ ls /dev

    ```


    让我们分析一下不同设备的名称：


    - `/dev/hd*`: 这些是旧系统上的 PATA 磁盘。典型的主板有几个 IDE 接口。每个 IDE 接口有一根电缆和几个供驱动器连接的端口。第一个驱动器被称为主盘（master
    drive），另一个被称为从盘（slave drive）。你可以通过将 `/dev/hda` 指代主盘，通过将 `/dev/hdb` 指代从盘来找到它们。这些名称分配给第一个通道的驱动器。对于第二个通道，你可以将主盘称为
    `/dev/hdc`，以此此类推。如果你在标题末尾看到数字，请记住它指的是分区。举个例子，`/dev/hda1` 被视为第一块硬盘上的第 1 个分区。在存在分区的情况下，名称
    `/dev/hda` 指的是整个驱动器。

    - `/dev/fd*`: 这个名称指的是软盘驱动器。

    - `/dev/sd*`: 这指的是 SCSI 磁盘，包括所有 PATA 和 SATA 硬盘、闪盘、如便携式音乐播放器之类的 USB 大容量存储设备，以及连接数字照相机的端口。


    ## 如何创建新文件系统？


    在 Linux 上，你有自由创建新的文件系统。假设你想使用 Linux 原生文件系统而不是 FAT32 系统来重新格式化闪盘。你可以遵循两个简单的步骤来实现：


    1. 如果你不喜欢当前分区，可以为新分区创建一个全新的布局。

    2. 其次，你可以创建一个新的但空的文件系统。


    此命令将格式化你当前的硬盘分区，因此记住在空闲磁盘上使用它，而不是在存储重要数据的磁盘上使用。驱动器名称中的一个小错误就会导致擦除错误磁盘上的数据。


    你可以使用 `fdisk` 程序与你 Linux 计算机系统上的硬盘和其他闪盘进行交互。`fdisk` 程序允许你在某个特定设备上编辑、创建或删除分区。在这种情况下，我将处理闪盘。


    ```

    [aka@localhost ~]$ sudo umount /dev/sdb1

    [aka@localhost ~]$ sudo fdisk /dev/sdb

    ```


    第一条命令将卸载闪盘，通过第二条命令你可以调用 `fdisk` 程序。屏幕上将出现以下内容：


    `Command (m for help):`


    当你在屏幕上看到这个时，在键盘上输入 `m`，这将显示一个提示用户执行命令操作的菜单。按下 `b` 可以编辑磁盘。按下 `d` 可以删除设备的某个特定分区。在特定情况下，我们正在处理闪盘，因此
    `d` 键将删除闪盘上的一个分区。你可以按下 `l` 列出尚未知的分区。你可以随时通过按下 `m` 再次打印菜单。此外，你可以通过按下 `n` 为设备添加新分区。按下
    `q` 可以在不保存必要更改的情况下退出菜单，通过按下 `t` 可以更改分区的系统 ID。


    首先，你需要查看特定分区的布局。按下 `p` 查看闪盘设备的分区表。


    现在假设我们有一个 32 MB 的虚拟存储设备，带有一个分区，该设备可以识别为 Windows 95 FAT32。从菜单中，当你按下 `l` 时，你可以看到列出已知分区类型的选项。现在你可以看到所有可能的类型。这里有必要提到的是，`sdb`
    中的 `b` 指的是分区 ID。在列表中，你可以通过系统 ID `b` 识别你的分区。你可以通过命令行输入 `t` 来更改特定分区的系统 ID。到目前为止更改已存储在系统中。记住，你现在还没有接触设备。现在输入
    `w` 将分区表写入设备并退出。你已成功更改了分区。如果在任何时候你决定在不更改的情况下离开分区，按下 `q` 命令行。


    现在你已经学会了如何编辑闪盘设备分区，我们应该继续通过 `mkfs` 命令创建新文件系统。将其读为 make filesystem。一个有趣的点是，你可以创建多种格式的文件系统。


    如果你想创建 ext3，请为 `mkfs` 命令添加 `-t` 选项。让我们看看命令的语法。


    ```

    [aka@localhost ~]$ sudo mkfs -t ext3 /dev/sdb1

    ```


