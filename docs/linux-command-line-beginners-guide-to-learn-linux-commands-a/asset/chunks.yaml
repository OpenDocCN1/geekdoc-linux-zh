    The `initThis` is a user space program which can be located in the `/sbin` directory.
    You can locate the directory if you run the `PATH` command. `PATH` is a variable.
    I’ll discuss this variable in-depth in the upcoming chapters. System V init, `Upstart`
    and `System V init` are implementations of `init` in its Linux distributions.
    Android has its own unique `init`.


    `System V init` triggered a sequence that required just one task while the system
    starts up. This system appears easy, but seriously hampers the performance of
    the kernel. In addition, advanced users abhor this kind of simplified startup.
    The system starts up following a fixed set of services, so if you want any new
    service to run on the system, no standardized way is available here in order to
    accommodate any new components. So that’s a minus.


    On the other hand, `Upstart` as well as `systemd` rectify the performance issue.
    They accommodate several services to take a start in parallel to pace up the boot.
    The `systemd` is for the people who are looking out for a goal-oriented system.
    You will have the flexibility of defining your target and the time span you need
    to achieve the target. In addition, it resolves the target. Another attractive
    option is that you can delay the start of a particular service until you want
    it to load.


    `Upstart` receives different events and runs different tasks that result in the
    production of more events. Consequently, `Upstart` runs more jobs. As a user,
    you can get an advanced way to track services. These latest init systems are free
    of scripts.


    ## Runlevels in Linux

    When you boot a Linux operating system, it moves into the default runlevel and
    also tends to run the scripts that are attached to the specific runlevel. `Runlevels`
    are of different types and you can also switch between them off and on. To quote
    an example, there is a runlevel specifically designed for system recovery and
    tasks related to maintenance of the operating system. As an example, `System V
    init` scripts are used as default runlevel. Ubuntu uses the same.


    We are well aware of the fact by now that `init`, that is launched by Linux in
    the start, in turn, launches other system processes. If you want to control what
    `init` should launch and what not, you should edit the startup script which the
    `init` reads. An interesting thing about `init` is that it has the ability to
    run different runlevels like one for networking, another for the graphical user
    interface. Switching between the runlevels is also easy. All it takes is a single
    command to jump from the graphical desktop to the text console. It saves lots
    of time. Let’s move further into the runlevels to understand them better.


    ### System V Runlevels

    There are different sets of processes running in the system like `crond`. These
    `runlevels` are categorized from 0 to 6. A system starts with a specific runlevel
    but shuts down using another runlevel that has a particular set of script in order
    to properly close all the programs in a proper way and also to stop the kernel.
    If you have a Linux system in place you can enter the following command and check
    in which runlevel you are at the moment.


    ```bash

    [aka@localhost ~] who -r

    ```


    Your screen will tell you the stage of your runlevel on a scale from 0 to 6, and
    also the date and time at which the runlevel was created on the system. `Runlevels`
    in the Linux operating system has many jobs to do, such as differentiating among
    shutdown, the startup, the text console mode and the different user modes. The
    seven numbers from 0 to 6 can be allocated to different channels. Linux operating
    systems that are based on Fedora allocate 5 to the graphical user interface and
    4 to the text console.


    In a standard runlevel `0` is allocated to shutting down of the system, `6` is
    allocated to the reboot while 1 is allocated to the single user mode. I know you
    are finding these runlevels quite interesting, but they are now going obsolete.


    ### system init

    The `system init` can help you in better handling of the system bootup and also
    aids you in handling services like `cron` and `inetd`. One feature that users
    love it is its ability to delay the start of operating system and other services
    until they are imperative. The full form of `systemd` is `System Management Daemon`.
    The `systemd` is now replacing `init`, and there are some pretty solid reasons
    behind this shakeup. Let’s see how `init` starts the system.


    One task starts when the last startup returns successful and gets loaded up on
    the memory of the operating system. This causes undue delay in the booting time
    of the system, which resulted in frustration for the users. Now it is quite logical
    to think that system adds some fuel to speed up the process, but sorry you are
    wrong. Well, it does decrease the booting time, not by putting in some extra gas,
    but by removing the speed breakers, like finishing the necessary tasks neatly.


    It does so much on your system that its responsibilities are somewhat difficult
    to grasp in a single discussion, but I’ll try my best. Let’s see what it does
    on your system:


    *   It improves efficiency by properly ordering the tasks, which makes the booting
    process simpler.

    *   It loads up the configuration of your system.

    *   The default boot goal, along with its dependencies, is determined.

    *   Boot goal is activated.

    '
