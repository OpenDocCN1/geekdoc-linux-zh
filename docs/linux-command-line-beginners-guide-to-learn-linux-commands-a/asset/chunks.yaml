    4598 64577 537456 `mydoc.txt`


    它将告诉你 `myddocuments.txt` 文件的行数、单词数和总字节数。与 Windows 操作系统不同，你不需要搜索每个文件的内容并检查文件的字节权重。管道命令（pipeline）将检索你所需的信息。


    # Echo 的魔法


    我们知道 `echo` 命令会按照 shell 中书写的原样显示文本。你不知道的是，你可以将 `echo` 与不同的命令组合，获得神奇的结果。


    ## 某些通配符项（如 `(*)`）的扩展


    shell 窗口倾向于展开如 `*` 等简单命令。虽然对我们用户来说似乎什么都没有，但对 shell 来说，它可以有很多含义。这个过程被称为扩展（expansion）。shell
    解析这些符号并将其扩展为易于理解的单词或短语。单独的 `echo` 只是打印命令。你输入一个句子，`echo` 就会将其打印出来而不做任何修改。让我们来看看。


    ```

    [aka@localhost ~]$ echo I kept looking at the azure sky for five minutes.

    I kept looking at the azure sky for five minutes.

    ```


    如果我们在 `echo` 之后添加 `*`，结果将不再相同。shell 将 `*` 视为通配符，其作用是匹配文件名中的字符。它会将 `*` 扩展为当前工作目录下的文件名。


    ```

    [aka@localhost ~]$ echo *bench.py hello.c

    ```


    ## 路径扩展


    让我们用 `echo` 命令尝试一些更有趣的东西。


    ```

    [aka@localhost ~]$ lsDesktop ls-output.txt Pictures TemplatesDocuments Music Public
    Videos

    [aka@localhost ~]$ echo D*Desktop Documentsand

    [aka@localhost ~]$ echo *sDocuments Pictures Templates Videos

    [aka@localhost ~]$ echo [[:upper:]]*Desktop Documents Music Public Templates Videos

    ```


    ## 算扩展


    `echo` 命令也可以用于执行算术函数，有些相当复杂。通过这种方式，shell 提示符充当了计算器。


    ```

    [aka@localhost ~]$ echo $((2*2))

    4

    ```


    该命令可以用于加、乘、减、除、取模和幂。你可以进行简单的数学，或者通过在单个脚本中嵌套不同的表达式来执行一些复杂的数学运算。让我们看看进展如何。


    ```

    [aka@localhost ~]$ echo $(($((5*75))+1000))

    1375

    ```


    # 第 3 章：Linux 环境


    现在你已经充分熟悉了 shell、它的用法以及执行不同任务的一些基本命令，我将转向内核的使用。你将学会如何使用内核，例如它是如何引导和启动的。让我们来看看内核的正常引导过程。我将其分为了一些基础的简化步骤。


    1. 第一步是 `BIOS`。在这个阶段，会对系统的完整性进行彻底分析。`BIOS` 定位引导加载程序并执行它。引导加载程序可以在 CD、软盘或硬盘上。在
    `BIOS` 将其加载到系统后，`MBR` 引导加载程序拥有控制权。好奇 `MBR` 是什么吗？让我们进入下一步来了解 `MBR`。


    2. `MBR` 是 Master Boot Record（主引导记录）的缩写。`MBR` 可以追溯到硬盘或其他任何可启动磁盘的扇区。硬盘上的该扇区被称为
    `/dev/had` 或 `/dev/sda`。从大小来说，`MBR` 是一个非常轻量的程序。它的主要组件是主引导加载器，略小于 512 字节。这些以几个字节形式的信息主要关于
    `GRUB`。Sylvia 在链式系统中学习过，如 `BIOS` 加载 `MBR`，然后 `MBR` 加载 `GRUB`。


    3. `GRUB` 是什么？它是 Grand Unified Bootloader（统一引导加载程序）的缩写。`GRUB` 也是内核镜像的加载器。如果系统中有一个镜像，`GRUB`
    将将其作为默认镜像并立即加载。如果有多个镜像，`GRUB` 将显示包含多个镜像的启动界面。你需要选择一个进行加载。如果你不选择，`GRUB` 将根据配置文件的设置加载默认镜像。


    4. 第四步是内核本身。`Kernel` 运行 `/sbin/init` 程序，其进程 ID 为 1。`init` 项可以扩展为 `initrd`，进一步扩展为初始
    RAM 磁盘（initial RAM Disk）。`Kernel` 在从启动到挂载根文件系统的短时间内使用它。


    5. 在 `init` 开始运行后，你就到达了用户空间的起点。`init` 从那里接管并运行系统。


    # 启动


    引导时会产生大量来自内核的诊断消息，然后是 `init` 接管系统操作后的进程消息。这些消息并不是顺序执行的，而且是不一致的。对于新用户来说，它们可能会令人困惑甚至产生误导。某些
    Linux 发行版机制尝试通过启动界面和引导选项的变化来减少这些消息。你可以通过以下命令查看并读取这些消息。让我们来看看。我已经以超级用户的身份登录。让我们看看命令的结果。


    ```

    [aka@localhost ~]$ dmesg

    [0.000000] OF: fdt: Ignoring memory range 0x80000000 - 0x80200000

    [0.000000] Linux version 4.15.0-00049-ga3b1e7a-dirty (bellard@localhost.localdomain)
    (gcc version 7.3.0 (Buildroot 2016.08-git-svn30683)) #11 Thu Nov 8 20:30:26 CET
    2018

    ```


    它利用了内核的环形缓冲区（ring buffer）。以上是在页面上看到的内容的简短版本。它可能与上述不完全，但几乎一样。让我们通过不同的选项探索 `dmesg`
    命令以获取更多信息。


    ```

    [aka@localhost ~]$ dmesg | less

    ```


    你可以配合 `dmesg` 命令使用其他选项。让我们看看 Linux 中可以探索的各种选项。我不会详细介绍你在屏幕上看到的细节，但我会告诉你你在输入每个命令后可以得到什么。让我们看看语法。这次我切换了用户。


    ```

    [aka@localhost ~]$ dmesg –C

    ```


    你可以使用此命令清除内核环形缓冲区。


    ```

    [aka@localhost ~]$ dmesg –c

    ```


    你可以应用此命令清除所有消息。


    ```

    [aka@localhost ~]$ dmesg –k

    ```


    这用于读取内核消息。


    ```

    [aka@localhost ~]$ dmesg –L

    ```


    它为消息内容着。其他选项如下。在终端中输入它们，看看它们能给你带来什么。


    ```

    [aka@localhost ~]$ dmesg –D

    ```


    ```

    [aka@localhost ~]$ dmesg –r

    ```


