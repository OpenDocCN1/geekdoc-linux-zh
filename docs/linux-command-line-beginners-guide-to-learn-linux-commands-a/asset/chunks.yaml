    # The problem with the conditional


    Now we should talk about a slight glitch in the conditional statement. When you
    enter the above conditional statement, it may not run as you think just because
    `$1` could be empty. You might have missed setting a parameter which results in
    aborting the command with an error altogether, but you can fix the problem by
    taking the following measures.


    ```bash

    if [“$1” = the sky is azure]

    then

    if [ x”$1” = x”hi”]

    then

    ```


    The `if` command is versatile when it comes to using different commands.


    ## Testing the conditionals with other commands


    When you enter `if` in the shell window, whatever comes next to it is considered
    as a command. This helps us understand why we put a semicolon before `then`. If
    we don’t do that, we will have to write on the next line. Let’s add some other
    commands into the conditionals.


    ```bash

    [aka@localhost ~]# if grep -q daemon /etc/passwd; then

    > echo The user is hidden in the password file.

    > else

    > echo Look somewhere else. It is not in the password file.

    fi

    ```


    ## && and ||


    The first one as expected means `and` while the second construct means `or`. Let’s
    see how you can run these commands.


    `firstcommand && secondcom`


    Suppose the shell runs `command1` and the exit code turns out to be zero, the
    shell moves on to the second command in the construct and runs it. The `||` construct
    is different from `&&` in a way that it runs the second command even if the first
    command returns an exit code with a nonzero value.


    ```bash

    [aka@localhost ~]# if [ahsan] && [sylvia]; then

    > echo "both can go to the concert"

    > elif [ahsan] || [sylvia]

    > echo "only one can go to the concert"

    > fi

    ```


    ## More if-then features


    The `if` command has gone an extra mile to fulfill users’ expectations. You can
    add much more to the logical decision making. Some of the advanced features include
    the following:


    * Double parenthesis

    * Double square brackets


    ### How and where to use double parenthesis


    Double parenthesis command is amazing in a sense that it allows Linux users to
    use mathematical formulas in the script. You can add some advanced mathematical
    symbols in the script just like other programmers do while coding. This allows
    users more freedom while composing scripts. Let’s move on right away to the syntax
    to make things clear.


    ```bash

    [aka@localhost ~]$ #!/bin/bash

    [aka@localhost ~]$ #using double parenthesis

    [aka@localhost ~]$ val1=5

    [aka@localhost ~]$ if ((val1 ** 4 > 50)); then

    > ((val2=$val1**2))

    > echo "The square of $val1 is $val2"

    > fi

    The square of 5 is 25

    ```


    Other command symbols you can use in the above script are given as under:


    * Pre-increment: `++val`

    * Logical negation: `!`

    * Right bitwise shift: `>>`

    * Left bitwise shift: `<<`

    * Post-increment: `val++`

    * Bitwise negation: `~`

    * Logical AND: `&&`

    * Logical OR: `||`

    '
