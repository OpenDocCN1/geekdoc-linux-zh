    天空是蓝色的！嗯，现在你可能在思考注释以及它们与 `#` 符号的关系。然后，你的注意力会被分散并感到困惑，去思考同样以 `#` 符号开头的脚本第一行。不，那注释，而是一个通称为
    **shebang** 的特殊行。这一行应该出现在每个脚本的开头。你现在可以用任何你喜欢的名称保存文件了。我将其保存为 `azure_sky`。


    ## 显示消息

    当你在命令行中输入内容时，预计一定会有输出结果并显示在屏幕上。你还可以添加文本消息，让用户知道脚本正在发生什么。`echo` 命令可以为你完成这项工作。它可以在屏幕上显示简单的文本字符串。


    ```bash

    [aka@localhost ~]$ echo I hope you are writing the code in the right way.

    I hope you are writing the code in the right way.

    ```


    现在，让我们尝试一些令人兴奋的东西，看看它是如何出错的，以及如何纠正所发生的错误。


    ```bash

    [aka@localhost ~]$ echo I''ll be happy if you don''t go for swimming.

    Ill be happy if you dont go for swimming.

    [aka@localhost ~]$ echo "I''ll be happy if you don''t go for swimming."

    I''ll be happy if you don''t go for swimming.

    [aka@localhost ~]$ echo ''John says "I''ll be happy if you don''t go for swimming."''

    John says "Ill be happy if you dont go for swimming."

    ```


    命令出错了，显示结果不是我们预期的。所以，我们必须借助引号来纠正它。


    ## 我现在执行吗？

    是时候执行你刚刚保存的文件了。让我们运行命令吧。


    ```bash

    [aka@localhost ~]$ azure_sky

    bash: azure_sky: command not found

    ```


    你必须引导 bash shell 找到你的 脚本文件。


    ```bash

    [aka@localhost ~]$ 1s -1 azure_sky

    -rw-r—r—1 me me​ 63 2019-08-26 03:17 azure_sky


    [aka@localhost ~]$ chmod 755 azure_sky

    [aka@localhost ~]$ 1s -1 azure_sky

    rwxr-xr-x 1 me me​ 63 2019-08-26 03:17 azure_sky

    ```


    但是命令行如何找到你刚刚编写的脚本呢？脚本应该有一个显式的路径名称。如果你没有做到这一点，可能会看到以下内容：


    ```bash

    [aka@localhost ~]$ azure_sky

    bash: azurer_sky: command not found

    ```


    你必须告诉命令行脚本的确切位置。否则，你将无法执行它。Linux 系统中有不同的目录，所有的它们都在 `PATH` 变量中。我已经向你展示了如何查看系统上有哪些目录，以及探索
    `PATH` 变量。


    ```bash

    [aka@localhost ~]$ echo $PATH

    /usr/local/sbin:/bin:/sbin:/usr/bin:/usr/sbin:/usr/local/bin:/home/rich/azuresky

    ```


    现在我们已经得到了目录列表，你可以将脚本放入你想要的目录中。按照以下步骤将你的脚本保存到特定目录。


    ```bash

    [aka@localhost ~]$ mkdir bin

    [aka@localhost ~]$ mv azure_sky bin

    [aka@localhost ~]$ azure_sky

    azure_sky

    ```


    如果你的 `PATH` 变量缺少该目录，你可以通过以下方法添加它：


    ```bash

    [aka@localhost ~]$ export PATH=~/bin:"$PATH"

    ```


    ## 更多格式化脚本的方法

    优秀脚本编写者的最终目标应该是编写良好的脚本并流畅地维护它。你应该能够轻松地编辑脚本，例如向特定脚本添加更多内容或从中删除内容。此外，它的格式也应该是易于阅读和理解的。


    ### 使用长选项名称

    我们见过许多命令同时具有长选项和短选项名称。用于列出 Linux 系统中目录的 `ls` 命令有很多选项，如下所示：


    ```bash

    [aka@localhost ~]$ ls -ad

    [aka@localhost ~]$ ls –all --directory

    ```


    这两条命令在结果上是等价的。用户更倾向于使用短选项以便使用，这样他们就不需要记住长选项名称了。我在之前的章节中提到的几乎每个选项都有长形式。虽然短形式选项容易记忆，但在编写脚本时，总是建议使用全称，因为对读者更友好。


    ### 缩进

    现在长形式的命令也不非常容易处理。你必须注意以正确的格式编写它们，以免误导读者。你可以在许多行之间使用逗号。


    ### 如何使用引号和字面量

    这非常有技术性。作为 Linux 用户，你必须知道如何以及何时使用引号、逗号和句号。为什么脚本中特定的标点符号是必要的？让我们打印以下字符串。


    ```bash

    [aka@localhost ~]$ echo $10000

    00

    ```


    输出应该是 100，但结果却是两个零。如果你认为命令行无法理解脚本并在执行时只理解了它的部分内容，你是对的。它完全理解错了。所以，现在该怎么办？首先，我们需要理解为什么它会完全理解错？原因为
    shell 只看到了 `00`。它将 `$1` 视为 shell 变量。事实确实如此。你没有让它变得易于阅读。也许你应该加上引号。立即加上它们。


    ```bash

    [aka@localhost ~]$ echo “$100” own00

    ```


    你还是错了。依然得到相同的结果。你现在感到沮丧了吗？我们有一个解决方案。


    ```bash

    [aka@localhost ~]$ echo ‘$100’

    $100

    ```

