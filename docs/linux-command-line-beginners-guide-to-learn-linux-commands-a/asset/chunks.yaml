    Info: *Info Help*, 302 lines --Top

    Now type h and the following details will appear on your screens.

    Next: Help-P, Prev: Help-Small-Screen, Up: Getting Started


    ## The Help Command


    You have learned lots of commands and their solutions. It is time to know the
    command that can get you out of the mess if you are stuck in the middle of the
    course and don’t know what to do. Sylvia loved this feature while she was in the
    learning phase. One day I was planning to celebrate my daughter’s birthday at
    a beach-side resort, Sylvia phoned me. She was panicked as she had messed up some
    command at her office computer. She tried the help command but to no avail. When
    the help command failed to do its job, she panicked. Actually, the help command
    is only created for the shell built-ins.


    ```bash

    [aka@localhost ~]$ help cd

    cd: cd [-L|[-P [-e]] [-@]] [dir]

    Change the shell working directory.

    ```


    An interesting thing about the help command is to get to know what the command
    has to offer inside the shell window. Let’s see the syntax.


    ```bash

    [aka@localhost ~]$ help help

    help: help [-dms] [pattern ...]

    Display information about builtin commands.

    ```


    ### The --help Option


    This command will help you explore more information about executable programs.
    This one is really amazing because it shows different options pertaining to the
    program and also the supported syntax. It becomes easier to learn and exercise
    more commands on the go. You don’t need to consult a book for small hurdles.


    ```bash

    [aka@localhost ~]$ cp --help

    ```


    The help feature can also be used along with different options to get more information
    along the way.


    Using it with –d :

    ```bash

    [aka@localhost ~]$ help –d help

    help – Displays information about built in commands

    ```


    Using it with –s :

    ```bash

    [aka@localhost ~]$ help –s help

    help: help [-dms] [pattern …]

    ```


    ## The man command


    In most cases, an executable program offers a formal piece of documentation that
    is dubbed as a man page. You can view the document with the help of the following
    command.


    ```bash

    [aka@localhost ~]$ man program

    ```


    Here `program` refers to the command that you want to view. The pages of man are
    displayed as such that there is a title. There also is a description that explains
    why should you use a particular command? Beside that there will be lists along
    with the description of the command’s options. Let’s dissect a man `printf` command.


    ```bash

    [aka@localhost ~]$ man printf

    ```


    There will be a name of the document. Below which there will be the heading of
    SYNOPSIS. Then comes the description. This section carries in-depth details about
    the options available for the particular program. For the `printf`, `--help` and
    `version` are available.


    That was about the full page of the manual. It takes a lot of time to skim through
    the entire pages to locate a particular piece of information. Don’t worry. You
    can type a targeted command to read a particular section of the manual. The man
    command offers you to specify the section number. Let’s see how to do it.


    ```bash

    [aka@localhost ~]$ man section search_term

    [aka@localhost ~]$ man 9 passwd

    ```


    ## The whatis Command


    If you don’t know what a specific command has to offer, you can run the `whatis`
    command to have a brief detail about it. In most cases, the detail consists of
    a one liner but self-explanatory so that you learn about the function of the command
    faster.


    ```bash

    [aka@localhost ~]$ whatis Is

    Is (1) - list directory contents

    ```


    ## The info Command


    For the users of GNU Project, there is an alternative to man dubbed as the info
    pages. These pages come with a reader program named as `info`. The syntax runs
    as follows:


    ```bash

    [aka@localhost ~]$ info option menu-item

    ```


    An example: the syntax is as under.

    ```bash

    [aka@localhost ~]$ info –d cvs

    ```


    As I have already told you that Linux stores files in a tree like hierarchical
    structure. The info files in a Linux also are in the form of a tree. They are
    built into individual nodes. Each one of them contains a single topic. There also
    are hyperlinks for easy navigation to another node. Well, they are not dyed in
    blue, just as in Windows. They can be identified by their leading asterisk. Move
    over the cursor and strike the Enter key to open it.


    The `info` command is very interesting to use. You can use it from multiple angles.
    If you want information on the physical location of the file, the syntax is given
    as under:


    ```bash

    [aka@localhost ~]$ info –w cvs

    /usr/share/info/cvs/info.gz

    ```


    In case you need information on the options pertaining to a particular command,
    you can do this by making a simple change in the syntax.


    ```bash

    [aka@localhost ~]$ info -O mv

    ```


    Next: rm invocation, Prev: install invocation, Up: Basic operations


    It displays the options node for the `mv` command. You can learn a lot with the
    help of `info` command. When Sylvia was learning Linux command line, she used
    to keep a notebook with her to jot down important things they came across while
    running the shell window. This helped her a lot. She picked up important pieces
    of information she knew.


    Let’s look at the options the `info` command has to offer:


    *   `-O` takes us to the options available for a particular command line.

    *   `-d`, `d` for directory, helps us add directory to the `INFOPATH`.

    *   `-k` finds out `STRING` in all the indices available in all the manuals.

    *   `-o` is about offering selected nodes to the file.

    *   `-version` offers users information about the version.


    ## The apropos Command


    For a normal human being, using Linux is not a child’s play. It is not that it
    is something ethereal which the earthmen don’t understand, but it is its commands
    that make it nothing less than a horrible thought. It is almost a nightmare for
    me to even think that I had to memorize each command to be a Linux pro. If you
    are just like me and cannot remember a ton of commands that Linux has to offer,
    perhaps you need a comprehensive lecture on this very command. It just saves me
    from lots of hassle of remembering so many commands.


    The skilled hands behind the development of Linux also understand this. That’s
    why they have created the `apropos` command. Just a keyword of a command is enough
    for `apropos` to transport it in front of your eyes. This command helps users
    to be more efficient and effective when they are at the shell window. Shall we
    see the syntax now?


    ```bash

    [aka@localhost ~]$ apropos keyword

    ```

