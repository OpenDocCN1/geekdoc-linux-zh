- fmt: "\nWe have got the result that we desired. When you add the quotation marks\
    \ to a script, you are on your way to creating a literal, which is a kind of string\
    \ that runs through the command line fully intact. When you are looking forward\
    \ to writing a script, you need to keep in mind that the shell analyzes the variables\
    \ in a command before it runs it. It also performs substitutions if they must\
    \ appear along the way, and when it is done with that, it forwards the results\
    \ to the command line.\n\nLet’s see what problems may come your way when you are\
    \ dealing with the literals. They can be more complicated than you might have\
    \ thought. Let’s assume you are looking into the `/etc/passwd` directory in order\
    \ to locate the entries that match `r.*t`. This will help you locate usernames\
    \ like the `root` and `robot`. See the command you will be using to execute your\
    \ search.\n\n```bash\n[aka@localhost ~]# grep r.*t /etc/passwd\nroot:x:0:0:root:/root:/bin/bash\n\
    operator:x:11:0:operator:/root:/sbin/nologin\nftp:x:14:50:FTP User:/var/ftp:/sbin/nologin\n\
    systemd-coredump:x:999:996:systemd Core Dumper:/:/sbin/nologin\nsystemd-network:x:192:192:systemd\
    \ Network Management:/:/sbin/nologin\nsystemd-resolve:x:193:193:systemd Resolver:/:/sbin/nologin\n\
    tss:x:59:59:Account used by the trousers package to sandbox the tcsd daemon:/dev/null:/sbin/nologin\n\
    polkitd:x:998:995:User for polkitd:/:/sbin/nologin\nsshd:x:74:74:Privilege-separated\
    \ SSH:/var/empty/sshd:/sbin/nologin\npesign:x:994:991:Group for the pesign signing\
    \ daemon:/var/run/pesign:/sbin/nologin\n```\n\nWell, it worked perfectly. When\
    \ you execute the command, you will see that specific files are colored orange.\
    \ It means you have got the information you were looking for. When it seems to\
    \ be working fine, it fails sometimes for reasons unknown. That’s why this trigger\
    \ panic. If you are on the verge of getting panicked as Sylvia did when she did\
    \ it all wrong, stop right there. The problem lies in your directories. Review\
    \ them, and you will find the solution. In fact, let me walk you through the solution.\
    \ If your directory has names like `r.output` and `r.input`, the command will\
    \ not be able to interpret the command and the result will be like the one given\
    \ as under:\n\n```bash\n[aka@localhost ~]$ grep r.output r.input /etc/passwd\n\
    ```\n\nIf you want to keep a good distance from this kind of simple problems,\
    \ you need to identify the characters that are likely to land you in trouble and\
    \ also master the art of using quotation marks. A single mistake can put you away\
    \ from the results you need.\n\n### Learning the use of single quotation marks\n\
    \nAs a Linux user, it might be frustrating to know that the shell is not going\
    \ to leave the string alone. You might get fed up the constant interruptions of\
    \ the shell toward the string. Single quotes, fortunately, can help you kill this\
    \ frustration. Applying single quotes on your strings can solve the matter. Let’s\
    \ jump to the example.\n\n```bash\n[aka@localhost ~]$ grep ‘r.*t’ /etc/passwd\n\
    ```\n\nWhy these single quotes matter much in solving the problem? The shell takes\
    \ all the characters, including spaces inside the single quotes as a single parameter.\
    \ This why if you enter the command without single quotes, it will not work. That’s\
    \ why when you are about to use a literal, you must turn to single quotes. Only\
    \ in this way the shell will not attempt for substitutions.\n\nAs a matter of\
    \ fact, the single quote marks operate as protectors for whatever you put inside\
    \ them. You can say that it just kills the special meaning of the characters.\
    \ In addition, the shell will be unable to accommodate variables and wildcards.\n\
    \n### Mastering the art of the double quote marks\n\nIn general, the double quotes\
    \ just work like the single quotes. The only difference between the single and\
    \ double quotes is that the latter is more flexible than the previous. For example,\
    \ if you want to expand any variable inside the string, you should put the string\
    \ inside the double quotation marks. Let’s do it.\n\n```bash\n[aka@localhost ~]$\
    \ echo \"There is no * on my path: $PATH\"\nThere is no * on my path: /usr/local/sbin:/bin:/sbin:/usr/bin:/usr/sbin:/usr/local/bin:/home/rich/azuresky\n\
    [aka@localhost ~]$\n```\n\nYou can see that the double quotation marks have allowed\
    \ the `$PATH` to expand but kept the `(*)` from the same act. So, whatever has\
    \ a `$` sign before it will be expanded when you run the command. Food for thought:\
    \ If you want only variable and command substitution to run, you should go for\
    \ the double quotation marks. Please keep in mind that wildcards will still remain\
    \ blocked.\n\n### The backlash\n\nThe third option is the backlash. You can use\
    \ it to alter the meaning that the characters carry. In addition, you can also\
    \ use the option to escape any kind of special characters that are within the\
    \ text, including the quote marks. Most users find it tricky when they are about\
    \ to pass the single quote to the command. To avoid any unexpected result, you\
    \ should insert the backlash before the single quote marks.\n\n```bash\n[aka@localhost\
    \ ~]$ \"Path is \\$PATH\"\nbash: Path is $PATH: command not found\n[aka@localhost\
    \ ~]$ \"Path is $PATH\"\nbash: Path is /usr/local/sbin:/bin:/sbin:/usr/bin:/usr/sbin:/usr/local/bin:/home/rich/azuresky\n\
    ```\n\nThe important thing to keep in mind is the backslash, as well as the quote.\n\
    \n### Decision Making in Linux: The Conditionals\n\nFor conditionals, the Bourne\
    \ shell has special structures like `if/then/else` and `case` statements. The\
    \ conditionals are all about decision making process in Linux. If the system finds\
    \ that the conditions were set by the programmer are well met, it will allow the\
    \ program to execute. Otherwise, it won’t.\n\nLet’s take a look at the `if` statement.\n\
    \n```bash\nif [$1 = the sky is definitely azure]; then\n    echo ‘The first argument\
    \ was “the sky is definitely azure”’\nelse\n    echo -n ‘The first argument was\
    \ “the sky is definitely azure”— ‘\n    echo It was\nfi\n```\n\nThe above statement\
    \ is for the single decision. For single decision, the statement can be as the\
    \ following:\n\n```bash\nif [$1 = the sky is definitely azure]; then\n    echo\
    \ ‘The first argument was “the sky is definitely azure”’\nfi\n```\n\nFor multiple\
    \ decisions you can use the following statement.\n\n```bash\nif [$1 = the sky\
    \ is definitely azure]; then\n    echo ‘The first argument was “the sky is definitely\
    \ azure”’\nelse\n    echo -n ‘The first argument was “the sky is definitely azure”—\
    \ ‘\n    echo It was\nfi\n```\n\nHow it goes can be understood by the following\
    \ steps:\n\n*   First comes the `if` command. The shell runs it and collects the\
    \ code you enter in the command.\n*   Remember the `1` and the `0`. If the exit\
    \ code is `0`, the command stands executed and you will see the `then` keyword,\
    \ ending up at the `else` or `fi` keyword.\n\nLet’s take a look at the expanded\
    \ version of the `if` command.\n\n```bash\nNAME=\"AHSAN\"\nif [“$NAME” = “SYLVIA”];\
    \ then\n    echo “SYLVIA ADAMS”\nelif [“$NAME” = “AHSAN”]; then\n    echo “AHSAN\
    \ SHAH”\nelse\n    echo “It boils down to Adam and Jack”\nfi\n```\n"
