    [aka@localhost ~]$ apropos option keyword

    You can use one keyword at a time.


    [aka@localhost ~]$ apropos email

    It will display all the necessary information about the `email`. To add more spice,
    you can use the option `-d` which will trigger the terminal to return path&` `man`
    directories etc. pertaining to the keyword you enter.


    [aka@localhost ~]$ apropos –d email

    The list goes on. I have just written a little less than half of the details that
    the window returned in response to the `apropos` command.


    Are you a Google user? If you are, you might know that `google` cannot see you
    in pain of thinking the exact keywords that you need to search. You enter a word
    and a list drops down containing most relevant search phrases. Most often, I go
    with one of the phrases from the list. Just imagine if you could avail yourself
    of a similar facility in Linux. Thankfully, you can. Use the `-e` option. Let’s
    jump to the syntax right away.


    [aka@localhost ~]$ apropos –e compress

    You will have a list of commands starting from the word ‘compress.’


    ### A Trick of the Trade


    Is it possible to combine different commands and get results? Absolutely, yes.
    You can do that. I’ll write down the syntax.


    [aka@localhost ~]$ cd /usr; ls; cd -

    ```bash

    bin games include lib lib64 libexec local sbin share src tmp

    ```

    `/usr`

    We have successfully executed three consecutive commands in a go; changing the
    directory to `/usr`, listing the directory, and then returning to the directory
    in which we were in before the execution of the command. All three in a command.


    ### Creating Our Own Commands


    Shall we try creating our own commands? We can do that with the help of the command
    we have just tried and tested. Think about a possible name and confirm if it has
    not been taken.


    [aka@localhost ~]$ type xinSh: type; xin; not found

    So, `xin` is not there. Here is the syntax to create the alias.


    [aka@localhost ~]$ alias xin=’cd/usr; ls; cd –‘

    Just remember the string and finding out a name that has not already been taken.
    Execute the command. Great! It seems you have already created your own command.


    Let’s try the new command.


    [aka@localhost ~]$ xin

    ```bash

    bin games include lib lib64 libexec local sbin share src tmp

    ```

    `/usr`

    Congratulations! To confirm run the `type` command to see to which your command
    `xin` has been aliased to.


    [aka@localhost ~]$ type xin

    `xin` is aliased to `cd/usr; ls; cd -`


    If you desire to take a look at all the aliases in the environment, follow the
    syntax as under.


    [aka@localhost ~]$ aliasegrep=''egrep --color=auto''fgrep=''fgrep --color=auto''grep=''grep
    --color=auto''l.=''ls -d .* --color=auto''ll=''ls -l --color=auto''ls=''ls --color=auto''mc=''.
    /usr/libexec/mc-wrapper.sh''which=''(alias; declare -f) /usr/bin/which --only-read
    --show-tilde''xin=''cd/usr; ls; cd -''

    *(Note: The original text contained a compressed alias list; the core logic is
    preserved.)*


    ### I/O Saga


    We are going to learn about the input and output in the shell. You will be using
    meta characters. Basically, this is responsible for rerouting the I/O between
    the files. In addition, it is used to create pipelines.


    #### Standard Stream


    Almost all computer-based programs deliver output in reaction to the input. For
    example, if you are browsing through a website and enter the back button, a window
    pops up forbidding you from getting back, or you will lose your data. The same
    kind of window pops up when you try to close a file that you have not saved. You
    enter keys on the keyboard like you are going to do right now; its results show
    on the desktop or search bar or in terminal emulator. That’s how I/O system runs
    in general. You do some error messages placing themselves like a genie at the
    door.


    #### Dissecting the I/O System


    Standard input: It is given the `0`. Your keyboard is used for the input. In short
    form, it will look like `stdin`.


    Standard output: It has the `1`. Your guess is right. Of course, the output is
    displayed on the screen before your eyes. No doubt that, you see. In short, it
    is displayed as `stdout`.


    Standard error: Give it the `2`. If you miss something in the input or don’t exactly
    know the command, the `bash` shell will throw an error box. It is displayed as
    `stderr` in short form. There is nothing complex about the redirection process
    regarding the relationship between keyboard and operating system. You will understand
    what it is all about.


    #### Redirect toward a File


    Redirection is a little bit technical than other commands, and also bit different.
    You will be using `>` and `<`. Sometimes you have to use `>>` or `<<` for the
    desired output. But don’t worry, we will learn to use this. Let’s roll. You will
    have to use the `>` symbol with the desired filename. You can dispatch the output
    of the command to the file you want. Let’s learn it in a simple way. You are working
    in Microsoft Word. You type your name but don’t want it to be displayed on the
    screen and instead desire it to be moved to a particular file.


    [aka@localhost ~]$ echo Hi there. > test.txt

    [aka@localhost ~]$ cat test.txt

    Hi everyone.


    The file returns back to you only when you demand.


    #### Erasing the Output


    Yes, you can. Commands in Linux definitely are like magic wands. With a single
    and simple command, you can overwrite the command. Let’s do that.


    [aka@localhost ~]$ cat test.txt

    Hi everyone

    [aka@localhost ~]$ leo > test.txt

    Sh: leo: command not found

    [aka@localhost ~]$ cat test.txt

    You can see that the file is not found still it was overwritten and erased. When
    I run the `cat` command after that, there was no return. I don’t want the file
    to be erased like that: Do you mean it? Of course you mean it. There is a way
    to do that. We have the `noclobber` option to save deletion due to overwriting
    of files. Let’s learn the syntax.


    [aka@localhost ~]$ echo I love blue sky. > mydocuments.txt

    [aka@localhost ~]$ cat mydocuments.txt

    I love blue sky.


    [aka@localhost ~]$ set –o noclobber

    [aka@localhost ~]$ echo the sky is azure. > mydocuments.txt

    sh: mydocuments.txt: cannot overwrite file

    [aka@localhost ~]$ set +o noclobber

    [aka@localhost ~]$ echo the sky is azure. > mydocuments.txt

    [aka@localhost ~]$ cat mydocuments.txt

    the sky is azure.


    The first command kept the output from getting overwritten, but the second one
    reverted it back to the prior position.


    #### Overriding noclobber


    Suppose we have the `noclobber` in place that is preventing the overwriting process.
    Try this one out.


    [aka@localhost ~]$ echo the sky is azure. > mydocuments.txt

    sh: mydocuments.txt: cannot overwrite file

    [aka@localhost ~]$ echo the sky is azure. >| mydocuments.txt

    [aka@localhost ~]$ cat mydocuments.txt

    the sky is azure.


    The sign `>|` does the magic. Clearly, the `noclobber` has been overruled. If
    you want to redirect two file content without overwriting the first, there is
    a command for this. As I said, we have magic signs for the purpose. So, let’s
    do that.


    [aka@localhost ~]$ cat mydocuments.txt

    I love blue sky.


    [aka@localhost ~]$ echo the sky is azure. >> mydocuments.txt

    [aka@localhost ~]$ cat mydocuments.txt

    I love blue sky

    the sky is azure


    This process is known as appending. It makes sense as two file contents are combined
    in the process.


    #### Redirecting the Error Message


    Let’s practice this first in the terminal emulator.


    [aka@localhost ~]$ echo hi everyone

    hi everyone


    [aka@localhost ~]$ echo hi everyone 2> /dev/null

    hi everyone


    [aka@localhost ~]$ zcho hi everyone 2> /dev/null

    [aka@localhost ~]$


    [aka@localhost ~]$ zcho hi everyone

    sh: zcho: command not found

