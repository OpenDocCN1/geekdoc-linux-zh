    `(hd0) (h0,msdos1)`The result will be a list of devices that are already known
    to the GRUB. You can see that there is just one disk, the `hd0`, and one partition,
    `(hd0,msdos1)`. The information we can get from this is that the disk contains
    an MBR partition table.


    To delve deeper into more information, enter `ls -1` on the GRUB command line.

    ```

    grub> ls -1

    ```

    This command tells us more about the partitions on the disk. You can easily navigate
    files on the GRUB system. Let’s take a look at its filesystem navigation. First
    of all, you need to find out about the GRUB root.


    ```

    grub> echo $root

    hd0,msdos1

    ```


    You should use the `ls` command in order to list the files as well as directories
    in the root. Let’s see how to do that.


    ```

    grub> ls ($root)/

    ```

    You may expect a list of directory names that are on that particular partition.
    The filesystem and the directories can be eb listed in the form of `etc/`, `bin/`,
    and `dev/`.


    ## How to Configure GRUB


    The configuration directory has the central file titled `grub.cfg`. In addition,
    these multiple modules that are loaded on the system are also part of the configuration
    system. These modules are named as `.mod`. This should be the beginning of the
    configuration system.


    ### BEGIN /etc/grub.d/00_header ###


    All the files in the directory `/etc/grub.d` are multiple shell script programs.
    By combining they make up the central configuration file that `grub.cfg`. This
    is the default shape of the GRUB configuration.


    Now let’s move on to the function which allows you to alter the command. The short
    answer is that you can do that easily. You can customize it according to your
    needs. You know that a central file for configuration exists. You just have to
    create another file for customization purposes. You can name the file as `customized.cfg`.
    This will be added to the configuration directory of GRUB. You can find it following
    this path: `/boot/grub/custom.cfg`.


    There are two options concerning customization. The directory of configuration
    can be accessed at `/etc/grub.d`. This directory offers `40_custom` and `41_custom`.
    `40_custom` can be edited on your own without any aid, but it is prone to be weak
    and unstable. The other one that `41_custom` is much simple than the previous
    one. This file contains a string of commands ready to be loaded when the GRUB
    starts. A small example is that Ubuntu, a Linux distribution network, allows users
    to edit the configuration settings by adding memory tester options (`memtest86+`).


    If you want to write a fresh configuration and also want to install it on the
    system, you can do that by writing the configuration to the directory with the
    help of using the `-o` option. Let’s see the syntax to conclude the configuration
    process.


    ```

    grub-mkconfig -o /boot/grub/grub.cfg

    ```


    For users of the Ubuntu Linux distribution system, things are pretty much simple
    and easy. All you need is to run the following command.

    ```

    install-grub

    ```


    ## How to Install GRUB


    Before you move on to the installer, please read what this bootloader requires
    for installation purpose. Please determine the following:


    *   GRUB directory, as seen by the current system, should be properly analyzed.
    `/boot/grub` is the directory’s name usually. The name can be something else if
    you are installing GRUB on another system.

    *   You have to determine what device the GRUB target disk is using.


    As GRUB is a modular system, it needs to read the filesystem which is contained
    in the GRUB directory.


    ```

    grub-install /dev/sda

    ```

    In this command, `grub-install` is the command used to install the GRUB, and `/dev/sda`
    is the current hard disk that I am using. If you do it wrong, that can cause many
    problems for you because of its power to alter the bootup sequence on the system.
    This increase the importance of this command. You need to have an emergency bootup
    plan if something actually goes wrong along the way.


    ### Install GRUB on an External Device


    You can also install GRUB on an external device. You have to specify the directory
    first on which it will install. For example, if you have `/dev/sda` on your system.
    Your system will see the GRUB files in `/mnt/boot/grub`. You have to guide the
    system by entering the following command.


    ```

    grub-install --boot-directory=/mnt/boot /dev/sda

    ```


    ## Let’s see how GRUB works


    It consists of multiple steps. Let’s take them on one by one.


    *   We now know the drill of how the Linux operating system starts. BIOS kicks
    off in the start. When it has run necessary checks on the device, it initializes
    the device’s hardware. After that, it tries to trace out the boot-order in order
    to get the boot code.

    *   When it has found the boot code, the next step is the loading of BIOS or the
    firmware. Then comes its execution. After that is the time for the start of GRUB.

    *   GRUB starts to load on your Linux operating system.

    *   First of all, the core kickstarts. Now GRUB is in a better position to access
    your hard disks and the filesystems that you have stored on the system.

    *   Then GRUB moves on to identify the partition from which it has to boot. Next
    step is to load the configuration.

    *   Now, as a user, this is the time when you have the power to alter the configuration
    if you need it to be.

    *   If you don’t want to alter it, the timeout will end shortly. Now GRUB will
    execute the default or altered configuration.

    *   While trying to execute the configuration, GRUB loads some additional code
    in the form of modules in the partition from which it has booted.

    *   Now GRUB runs the boot command and execute the kernel.


    I share my weekend routine with Sylvia. I am an enthusiast of outdoor activities
    like hunting by a crossbow out in the wild. Sylvia likes cycling in rough and
    hilly terrains. We really enjoy when we are together on the weekends. It was rare
    for her to miss a weekend. But finally, she missed it not one but three in a row.
    So, I phoned her to know what was the matter. To which she responded that her
    limited knowledge of Linux was not helping her at the office. She was worried
    because she was highly pressed for wrapping up her work while most of the time
    struggled with the learning process. This time it was the user space and the environment.
    Though it is not that difficult to learn, it takes time before you get used to
    it.


    Not that much time, I must admit, that Sylvia has consumed. With the right guidance,
    you can move through it like a pro. The more you practice the better understanding
    you will have on it. User space refers to the point where the kernel starts. How
    the user space moves on. Let’s see in the following steps:


    *   `init`

    *   low level services start like `udevd` as well as `syslogd`

    *   The network is configured.

    *   Services like printing go on.

    *   Next come the login shells, the Graphical User Interface (GUI).

    *   Other apps start running that you might have installed on the Linux operating
    system.

