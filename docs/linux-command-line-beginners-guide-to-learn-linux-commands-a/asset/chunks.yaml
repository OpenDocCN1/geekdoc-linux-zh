    earlier on a big burden on her nerves and shoulders had now turned into a passion.
    She loves the way Linux made it easier to wrap up office work in lesser time.
    The time she saves at the office allows her to drop in at her friends’ homes.
    I hope you have stopped thinking about why she is here in my home. Let’s welcome
    her.Sylvia, when learning the less command, was always curious why do we need
    this command in the first place? In fact, why do we need to see the text files?
    Its answer is that many files are not just ordinary files. They are system files
    that contain configuration files . They are stored in your system in this special
    format.If you are thinking like Sylvia, you might say that’s not a big deal. Why
    do I have to view the configuration files in the first place? There is an answer
    to that as well. This command not only shows the system file but also lots of
    real programs that your system is using. These programs are technically called
    scripts. They are always stored in the system in this specific format.I am using
    the word text for quite some time. Information can be displayed on a computer
    in a variety of forms. It is represented in the form of pictures, videos, numbers
    and alphabets in Windows operating system. Normally the language that the computer
    understands is in numerical form like the binary digits.If we look at text as
    the representation system, it feels simpler and easier than all the other methods.
    The human brain processes the information faster than in this form. Numbers are
    converted into text one-by-one. This system is very compact. This text is different
    from that of the one in word processors. I am telling you about this because in
    Linux a number of files are stored in the system in the form of text files. Let’s
    see how can we use the less command.[aka@localhost ~]$ less downloadsThis program
    helps users to navigate through a specific file. Some files are longer and some
    are shorter. For longer files, such as the one containing system information,
    it can be scrolled up and down. If you want to exit the less command just strike
    the Q key. Some files can be really longer like the following one.[aka@localhost
    ~]$ less /etc/passwdThings to RememberYou can use the Page UP key to scroll back
    a page. Use ‘b’ instead if you don’t like to use Page UP.Use the PageDn key to
    scroll on to the next page. For the same purpose, you can also use spacebar.The
    up arrow and down arrow keys are used for moving to one line above and below respectively.If
    you are in the middle of the text and want to jump to the end of the text file,
    press G. To reach the start of the text file, press 1G or g.‘h’ can be used to
    get the help screen displayed.‘q’ is always there to quit the less command.Common
    Directory Names in Linux‘/’ denotes the root. There are usually no files in this
    directory.‘/lib/ denotes the library directory to store library files./root takes
    you to the home directory. A root user is also called the super user./etc contains
    configuration files/bin stores GNU user-level utilities. Also known as the binary
    directory./opt is executed to store optional software./dev is known as the device
    directory./usr is the user installed software directory/var is the variable directory.
    It changes frequently.Chapter 2: Exploring the Realm of CommandsI hope that by
    now, you have gained sufficient knowledge about how you can navigate through the
    shell window using simple commands. That’s easy, you see. A little bit of extra
    consideration will help you get through most of the work in no time which in the
    Windows operating system might have taken hours of exhaustive work. One more interesting
    thing is that the commands are easy to memorize. You can also create your own
    commands and that’s what we will learn in this chapter. Also, by getting acquainted
    with more commands, you will feel more comfortable in using them in the real shell
    window.There are different types of commands:It can be a shell function, a kind
    of shell scripts that are incorporated in the environment. Commands constitute
    executable programs just like software engineers do while working on C language
    or Python and Ruby. Or a command can be an alias which is your self-made command.Do
    you know how to know a command’s type? Let’ see how it is done.[aka@localhost
    ~]$ type cd


    cd is a shell buildin


    [aka@localhost ~]$ type cp


    cp is /bin/cp


    [aka@localhost ~]$ type rm


    rm is /bin/rm


    [aka@localhost ~]$ type mkdir


    mkdir is /bin/mkdirNow we know the type of each of our commands. '
