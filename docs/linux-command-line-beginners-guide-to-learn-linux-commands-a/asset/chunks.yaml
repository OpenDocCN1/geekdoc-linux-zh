    # 内核初始化时你有哪些启动选项？


    ## Linux 中的内核初始化

    Linux 中的内核初始化由一些关键步骤组成。它始于对中央处理器（CPU）的检查。之后是检查内存。接着发现设备、根文件系统运行，最后启动用户空间。


    ### 参数

    当内核开始运行时，它会从启动加载程序接收参数。这些参数引导内核应该如何启动。这些参数包含了诊断输出的规范，以及设备驱动的选项。可以通过一个专用命令查看这些参数。让我们来看看其语法。


    ```bash

    [aka@localhost ~]$ cat /proc/cmdline

    ```


    并不是所有参数都是重要的，但其中一个至关重要的是根参数（root parameter）。内核没有它无法运行，因为它无法找到 `init`。你可能想过在参数中添加一些它无法理解的内容吗？嗯，Sylvia
    确实添加了。她在参数中添加了 `-s`。内核保存了该未知短语并将其传递给 `init`。内核将其解释为以单用户模式启动的命令。


    ### 启动加载程序

    启动加载程序是一个负责在启动时加载必要任务的程序。此外，它还加载操作系统。在技术领域，启动加载程序也被称为启动管理器（boot manager）。正如我已经解释过的，在
    BIOS 完成对硬件的初始检查后，该程序会被启动。现在我们知道内核和参数位于根文件系统中。


    让我们简单看一眼启动加载程序的工作。启动加载程序必须从多个选项中选择一个内核。其次，在启动加载程序的帮助下，用户手动覆盖内核镜像名称以及参数。它还允许你在不同的内核参数之间切换。


    现在的启动加载程序与以前不同了。它们变得更加先进，增加了诸如历史记录和菜单等功能。然而，专家们仍然认为启动加载程序的基本工作是提供关于内核镜像的不同选项以及参数的选择。


    让我们来看看当你进入该领域时可能会遇到的多种启动加载程序。`GRUB`、`LOADLIN`、`LILO`、`coreboot` 是这个时代最流行的启动加载程序。让我们探索一下
    `GRUB`。


    ## 深入了解 GRUB

    启动加载程序是用户离开 Linux 操作系统的原因之一。如果你是 Windows 系统用户，你不需要担心启动加载程序，但 Linux 操作系统并非如此。作为
    Windows 用户，你打开笔记本电脑或个人电脑就好了。如果系统启动过程中出现问题，你可以只需运行 Windows 恢复程序来修复损坏并将操作系统恢复到正常状态。你只需要点击按钮，剩下的工作由操作系统本身完成。这非常了不起，但它最大的问题是你无法学到任何关于操作系统内部的知识。Sylvia
    当了十年的 Windows 用户，她对启动加载程序是什么、它的作用是什么以及你如何使用它一无所知。


    Linux 走的是艰难的道路。它让用户学习操作系统中复杂事物的错细节。它将我们的思维转向操作系统的后台技术。让我们转向启动加载程序本身，了解它是如何处理的。


    ### 它是如何工作的？

    你让电脑启动，正如我解释过的，BIOS 在运行一些检查后，会将机器控制权交给不同用户不同的启动设备。它可以是软磁盘或硬盘驱动器。我们已经知道硬盘有不同的扇。第一个被称为主引导记录（`MBR`）。


    `GRUB` 调出 `MBR` 代码并填入自己的代码。它帮助用户浏览文件系统，方便用户选择所需的内核镜像以及配置。`GRUB` 是 Grand Unified
    Boot Loader（统一启动加载程序）的缩写。只需探索 `GRUB` 菜单即可了解更多信息。大多数启动加载程序对用户是隐藏的，为了访问启动加载程序，你应该在
    BIOS 启动显示后立即按住 `SHIFT` 键。还有自动重启的问题。为了避免这种情况，按下 `ESC` 并禁用在 `GRUB` 菜单出现后立即计数的自动重启超时。如果你想查看启动加载程序的配置命令，按
    `e` 进入默认启动选项。


    ## 熟悉 GRUB

    让我们认识一下 `GRUB` 的表示法。


    ### (hd0,1)

    如果你看这个条目，你会发现括号是条目不可分割的一部分。如果你删除它们，就会破坏语法。`GRUB` 中的所有设备都有括号。`hd` 代表硬磁盘。如果设备不是硬盘，值将被替换为
    `fd`（软磁盘）和 `cd`（CD-ROM 光）。请注意，还有两个数字。第一个数字指的是系统中硬盘的数量。在这里它表示第一块硬盘。同样，`1` 表示第二块硬盘，而
    `2` 表示第三块硬盘。以此此类推。


    你可以通过输入你想要探索的硬盘编号来更改整数值。从条目中明显看出，`GRUB` 无法区分 `SCSI` 和 `IDE` 等不同类型的驱动。在 `GRUB`
    菜单中，主分区可以通过从 `0` 到 `3` 的整数识别，其中 `0` 代表第一块硬盘，而 `3` 代表第四个分区。逻辑分区从 `4` 开始向上。


    `GRUB` 可以搜索所有分的 `UUID` 以定位内核。如果你想看 `GRUB` 在 Linux 操作系统上如何工作，只需在编辑器界面按 `C` 即可进入
    `GRUB` 提示符。编辑器屏幕上会出现类似以下的内容。


    ```text

    grub> 这是 GRUB 命令行。从在此处输入任何命令开始使用。为了开始，你需要运行一个诊断命令。

    grub> ls

    ```


