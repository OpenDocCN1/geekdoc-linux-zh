    # 双括号 [[ ]]


    现在下一个特殊功能是双括号的使用。该命令用于字符串比较。它的特殊用途是进行模式匹配。


    ```bash

    [aka@localhost ~]$ #!/bin/bash

    [aka@localhost ~]$ #using pattern bashing

