    # The Magic of Echo


    We know that the `echo` command displays the text as it is written in the shell.
    What you don’t know is that you can pair up `echo` with different commands and
    get marvelous results.


    ## Expansion of some wildcard entries like the `(*)`


    The shell window tends to expand simple commands like the `*`. While it appears
    nothing to us users, for the shell it can have lots of meanings. This process
    is called expansion. The shell interprets such symbols and expands them into words
    or phrases easy enough to understand. The `echo` alone is just a print out command.
    You enter a sentence and the `echo` prints it out without changing it a bit. Let’s
    see.


    ```

    [aka@localhost ~]$ echo I kept looking at the azure sky for five minutes.

    I kept looking at the azure sky for five minutes.

    ```


    If we add `*` after the `echo`, the result will not be the same. The shell takes
    `*` as a wildcard which has a job to match characters in the names of files. It
    will expand the `*` into the names of the files that are kept in the directory
    in which you are working at the moment.


    ```

    [aka@localhost ~]$ echo *bench.py hello.c

    ```


    ## The pathname expansion


    Let’s try something more interesting with the `echo` command.


    ```

    [aka@localhost ~]$ lsDesktop ls-output.txt Pictures TemplatesDocuments Music Public
    Videos

    [aka@localhost ~]$ echo D*Desktop Documentsand

    [aka@localhost ~]$ echo *sDocuments Pictures Templates Videos

    [aka@localhost ~]$ echo [[:upper:]]*Desktop Documents Music Public Templates Videos

    ```


    ## Arithmetic expansion


    The `echo` command can also be used to execute arithmetic functions, some quite
    complex. In this way, the shell prompt does the job of a calculator.


    ```

    [aka@localhost ~]$ echo $((2*2))

    4

    ```


    This command can be used for addition, multiplication, subtraction, division,
    modulo and exponentiation. Either you can do simple mathematics or move on to
    conduct some complex mathematical operations by nesting different expression in
    a single script. Let’s see how it goes on.


    ```

    [aka@localhost ~]$ echo $(($((5*75))+1000))

    1375

    ```


    # Chapter 3: The Linux Environment


    Now that you are well aware of the shell, its usage, and some of the basic commands
    to execute different tasks, I will move on to the use of kernel. You will get
    to know how to use the kernel like how it boots and how it starts. Let’s take
    a look at the normal booting process of the kernel. I have divided it into some
    basic simplified steps.


    1. The first step is the `BIOS`. In this phase, some integrity of the system is
    thoroughly analyzed. `BIOS` located the boot loader and executes it. The boot
    loader can be on a CD, a floppy or a hard drive. After `BIOS` loads it up on the
    system, the `MBR` boot loader has full control. Wondering what is `MBR`? Let’s
    jump to the next step to understand what `MBR` is.


    2. `MBR` is the short form of Master Boot Record. `MBR` can be traced back to
    the 1st sector of the hard drive or any other bootable disk. The sector in the
    hard drive is titled as `/dev/had` or `/dev/sda`. `MBR` is a very light program
    when it comes to size. Its major component is the primary boot loader which is
    just shy of 512 bytes. This information in the form of a few bytes is mainly about
    `GRUB`. Sylvia learned it in a chain like system like `BIOS` loads the `MBR` then
    `MBR` load the `GRUB`.


    3. What is `GRUB`? It is the short form of Grand Unified Bootloader. `GRUB` also
    is a loader for kernel images. If you there is one kernel image on your system,
    `GRUB` will take it as the default image and loads it right away. If there are
    multiple images, `GRUB` will bring out a splash screen that has multiple images.
    You have got to choose one for loading. If you don’t go for one, `GRUB` will load
    the default image as per settings in the configuration file.


    4. The fourth step is the kernel itself. `Kernel` runs the `/sbin/init` program
    which has 1 as the process id. The term `init` can be expanded to `initrd` that
    can be further expanded into initial RAM Disk. `Kernel` uses it for a short window
    of time from being booted to mounting of root file system.


    5. After `init` starts running, you reach the user space start. The `init` takes
    over from there by running the system.


    # The Startup


    A wide range of diagnostic messages are produced at the booting time originating
    from the kernel in the start then from the processes after init takes over the
    operations of the system. The messages don’t run in a sequence and also, they
    are not consistent. For a new user, they can be confusing and even misleading.
    Some of the Linux distribution mechanisms try to slash them with the help of splash
    screens and changes in boot options. You can see and read these messages by the
    following commands. Let’s see. I have logged in as a superuser. Let’s look at
    the result of the command.


    ```

    [aka@localhost ~]$ dmesg

    [0.000000] OF: fdt: Ignoring memory range 0x80000000 - 0x80200000

    [0.000000] Linux version 4.15.0-00049-ga3b1e7a-dirty (bellard@localhost.localdomain)
    (gcc version 7.3.0 (Buildroot 2016.08-git-svn30683)) #11 Thu Nov 8 20:30:26 CET
    2018

    ```


    It makes use of the ring buffer of the kernel. The above is a short version of
    what you will see on the page. It may not be exactly the same as above, but it
    will be nearly the same. Let’s explore the `dmesg` command with different options
    to get more information.


    ```

    [aka@localhost ~]$ dmesg | less

    ```


    You can use other options with the `dmesg` command. Let’s take a look at different
    options that can be explored in Linux. I will not go into the details of what
    you will see on your screens. But I will definitely tell you what can you expect
    by entering each command. Let’s see the syntax. This time I have switched the
    user.


    ```

    [aka@localhost ~]$ dmesg –C

    ```


    You can use this command to clear the kernel ring buffer.


    ```

    [aka@localhost ~]$ dmesg –c

    ```


    You can apply this command to clear all the messages.


    ```

    [aka@localhost ~]$ dmesg –k

    ```


    This is used to read kernel messages.


    ```

    [aka@localhost ~]$ dmesg –L

    ```


    It colorizes the content of messages.Other options are the following. Enter them
    in the terminal and see what they may bring to you.


    ```

    [aka@localhost ~]$ dmesg –D

    ```


    ```

    [aka@localhost ~]$ dmesg –r

    ```


    ```

    [aka@localhost ~]$ dmesg –s

    ```


    ```

    [aka@localhost ~]$ dmesg –n

    ```


    ```

    [aka@localhost ~]$ dmesg –F

    ```

