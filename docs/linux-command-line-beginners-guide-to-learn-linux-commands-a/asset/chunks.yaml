    Local variables are also used in functions. Local variables are mostly used internally.
    Put the keyword `local` before the variable declaration. You can make use of the
    local variable while you are assigning a value to the variable. With the help
    of the keyword, it becomes easier for the shell to identify the local variable
    inside the function script. If any variable of the same name appears outside of
    the function script, the shell considers it of separate value.


