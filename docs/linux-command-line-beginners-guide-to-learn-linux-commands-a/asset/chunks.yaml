- fmt: '

    There will be plenty of information displayed on your screen. You can get back
    to the other types by the following commands. To reformat the device to the `FAT32`
    filesystem, you can draft the following command and enter on the command line.


    ```

    [aka@localhost ~]$ sudo mkfs -t /dev/sdb1

    ```


    You can see that editing a partition, formatting it, and creating a new filesystem
    are pretty easy on the Linux operating system than that of the Windows system.
    You can repeat the following the above-mentioned simple steps whenever you want
    to add a new device to your computer system. This kind of freedom of altering
    the type of a storage device and editing it is unavailable in the Windows operating
    system. In the above example, I described the entire process with the help of
    a dummy flash drive. You have the liberty to practice the above commands on a
    hard disk drive or any other removable storage. Whatever suits you, you can go
    for it.


    # Chapter 5: Linux Environment Variables


    When talking about the `bash` shell, it is relevant to know about its features
    like the environment variables. These variables come handy in storing information
    about a particular shell session as well as the environment in which you have
    been working. With the help of these variables, you can feed information in the
    memory which can be accessed through running a script or simply by running a program.


    ## Global Variables


    This is simple to learn. These are the variables that can be accessed globally.
    In simple words, you can access them at any phase of the program. When you have
    declared a variable, it is fed into the memory of the system while you run the
    program. You can offer alterations in any function that may affect the entire
    program. Global variables are always displayed in capital letters.


    ```

    [aka@localhost ~]$ printenv

    ```


    You have had a full list of global environment variables. Most of them are set
    during the login process. If you want to track down values of individual variables,
    you can do that with the help of `echo` command. Just don’t forget to add the
    `$` sign before the variable to get its value. Let’s look at the syntax.


    ```

    [aka@localhost ~]$ echo $PWD/root

    ```


    ## Local Environment Variables


    These can only be seen in the local process. Both global environment variables
    and local environment variables are equally valuable. It is difficult to get a
    list of the local environment variables because you can’t just run a single command
    for the purpose. The `set` command shows the environment variables set for a particular
    purpose.


    ```

    [aka@localhost ~]$ set

    BASH=/bin/bash

    BASHOPTS=checkwinsize:cmdhist:complete_fullquote:expand_aliases:extquote:force_fignore:histappend:hostcomplete:interactive_comments:progcomp:promptvars:sourcepath

    BASASHCSOURCED=Y

    BASH_ALIASES=()

    BASH_ARGC=()

    BASH_ARGV=()

    BASH_CMDS=()

    BASH_LINENO=()

    BASH_SOURCE=()

    BASH_VERSINFO=([0]="4" [1]="4" [2]="23" [3]="1" [4]="release" [5]="riscv64-koji-linux-gnu")

    BASH_VERSION=''4.4.23(1)-release''

    COLUMNS=80

    CVS_RSH=ssh

    DIRSTACK=()

    EUID=0

    GROUPS=()

    HISTCONTROL=ignoredups

    HISTFILE=/root/.bash_history

    HISTFILESIZE=1000

    HISTSIZE=1000

    HOME=/root

    HOSTNAME=localhost

    HOSTTYPE=riscv64

    IFS=$'' \t\n''

    LANG=en_US.UTF-8

    LESSOPEN=''||/usr/bin/lesspipe.sh %s''

    LINES=30

    ```


    Please take into account the fact that all the global variables also are included
    in the `set` command details.


    ### You can set your own local environment variables


    You can set your own variables in the `bash` shell. You can assign value to a
    variable by using the equal sign.


    ```

    [aka@localhost ~]$ test=world

    [aka@localhost ~]$ echo $test

    world

    ```


    The above example is fit for assigning simple values. In order to assign a string
    value with spaces between words, you need to try something different. Please note
    that you have to use lower case letters in order to create a new variable. This
    is important because you can get confused by seeing the environment variables
    in the capital case. Let’s take a look at the following syntax:


    ```

    [aka@localhost ~]$ test=theskyisazure

    [aka@localhost ~]$ echo $test

    theskyisazure

    [aka@localhost ~]$ test=the sky is azure

    bash: sky: command not found

    [aka@localhost ~]$ test=''the sky is azure''

    [aka@localhost ~]$ echo $test

    the sky is azure

    ```


    You can see that the difference lies in the use of single quotation marks.


    ### How to remove environment variables


    You can remove the variables with a simple step. Let’s see the syntax of the `unset`
    command.


    ```

    [aka@localhost ~]$ echo $test

    theskyisazure

    [aka@localhost ~]$ unset test

    [aka@localhost ~]$ echo $test

    ```


    If you remove the environment variable from the child process, it still remains
    in the parent process. You have to remove it from the parent process separately.


    ```

    [aka@localhost ~]$ test=azure

    [aka@localhost ~]$ export test

    [aka@localhost ~]$ bash

    [aka@localhost ~]$ echo $test

    azure

    [aka@localhost ~]$ unset test

    [aka@localhost ~]$ echo $test

    [aka@localhost ~]$ exit

    [aka@localhost ~]$ echo $test

    azure

    ```


    You can clearly see that the environment variable was first exported so that it
    may become a global variable. The `unset` command was applied while I was still
    in the child process. When I switched to the parent shell, the command was still
    valid. That’s why you need to delete it from the parent shell as well.


    ### Check out the default shell variables


    The `bash` shell contains environment variables that originate from the shell
    itself. Let’s check out some of the variables.


    ```

    [aka@localhost ~]$ echo $PATH

    /usr/local/sbin:/bin:/sbin:/usr/bin:/usr/sbin:/usr/local/bin

    ```


    You can see different directories in this command. The shell looks for commands
    in these directories. More directories can be added to the command just by inserting
    colon and then adding the directory. A default value is assigned to the variables.
    Let’s take a look at the following table.


    - `PATH`: As I have shown you by an example, it carries the list of the directories.

    - `HOME`: This refers to the home directory of the user.

    - `IFS`: This brings out a list of characters.

    - `CDPATH`: You will get a list of directories that are separated by a colon.


    ### Importance of the PATH Variable


    This is perhaps the most important variable in the Linux system because it guides
    the shell to locate the commands for execution right after you enter on the command
    line. In case it fails to locate it, an error message will be displayed which
    can look similar to the one given as under:


    ```

    [aka@localhost ~]$ newfile-bash

    bash: newfile: command not found

    ```

