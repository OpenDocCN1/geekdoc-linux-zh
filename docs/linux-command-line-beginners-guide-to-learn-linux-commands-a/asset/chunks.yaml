    returns the value of `-1`. Where there was one parameter, it added the figure
    to itself. Where there were two parameters, it added them together to get the
    result.


    # How to use global variables in a shell function

    The variables have a versatile use which makes them often confusing to learn.
    You can also use them in the shell functions. They have a different role here.
    You can use the following variables in the shell functions.


    - Global

    - Local


    Global variables are valid within the shell script. Even if you define its value
    in the main script, you can retrieve its value in the function.


    ```bash

    cat testfile

    #!/bin/bash

    # how to use a global variable to pass a value

    function dbl {

    vle=$[ $vle * 2 ]

    }

    read -p "Enter a vle: " vle

    dbl

    echo "The new value is: $vle"

    ```

