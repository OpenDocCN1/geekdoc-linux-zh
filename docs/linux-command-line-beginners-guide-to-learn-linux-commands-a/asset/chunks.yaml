    ```

    [aka@localhost ~]$

    ```

    You cannot use a mouse on the emulator. Instead, the keyboard arrows will help
    you do some magic. Strike the upper arrow key to scroll through the history of
    your commands. The downward arrow will bring you to the latest command. Also,
    the previous command disappears while you get down to the new one. Isn’t it like
    the DOS Command prompt? The right and left arrows will help you to position the
    cursor in order to edit the command if need be. Just stay right there and try
    some simple commands.


    ```

    [aka@localhost ~]$ date

    ```

    Thus Aug 15 12:18:01 UTC 2019

    ```

    [aka@localhost ~]$

    ```

    If you type down `cal` in place of `date`, a full month’s calendar will be displayed
    on the screen.


    # Basic Commands


    If you are looking forward to operating Linux just like Windows, you are wrong.
    Linux is smarter. You get to work with a command set. It is just like coding.
    Enter the command to get the job done, and that’s it. Let’s see which of these
    you can operate. The fun is going to start from here. Get ready!


    The marvel of the `echo` command is as under.


    ```

    [root@localhost ~]# echo My love

    ```

    My love


    The `#` sign indicates that I am logged in as a root user. I think we are done
    with that. Now enter the following:


    Let’s try the `cat` command and see what it can do.


    ```

    [aka@localhost ~]$ cat/etc/passwd

    ```

    A huge number of rows and columns will appear below the command. This command
    is meant to display the contents of the above file.


    Do you want to move files from one place to another? Check out the `mv` command.


    ```

    [aka@localhost ~]$ mv downloads documents

    ```

    ```

    [aka@localhost ~]$ mv documents programs lib

    ```

    With the help of the second command, you can move multiple files at the same time
    into a particular directory. In the above command, `lib` denotes the name of the
    directory.


    The `cp` command is used to copy files in Linux from one place to another like
    from downloads to documents.


    ```

    [aka@localhost ~]$ cp downloads documents

    ```

    ```

    [aka@localhost ~]$ cp file1 file2 file3 file4 fileN dir

    ```

    The second command is to copy content from multiple files into a single directory.


    With the help of the `touch` command, you can create a file. If the file already
    exists on your computer, its time stamp will be modified.


    ```

    [aka@localhost ~]$ touch video

    ```

    ```

    [aka@localhost ~]$ ls -1 video

    ```

    As you enter the second command, it will show the modified time of the respective
    file.


    In the end, `rm` command is used to delete files from the system. Is the recycle
    bin going through your mind? Forget it. You don’t have to search the file manually
    to dispatch it to the recycle bin. Just type `rm` and the file name. It will be
    removed.


    ```

    [aka@localhost ~]$ rm downloads

    ```

    The text `downloads` is the name of the file. Just like the `touch` command, you
    can also create a new directory by typing `mkdir` and the new directory’s name.


    ```

    [aka@localhost ~]$ mkdir lib

    ```

    ```

    [aka@localhost ~]$ cd /lib

    ```

    [aka@localhost lib]$

    Congratulations! You have succeeded in creating a new file. Here `mk` denotes
    make. `rmdir` command allows you to remove a directory. Here `rm` denotes remove.


    ```

    [aka@localhost ~]$ rmdir lib

    ```

    The file will be removed from the system right away. You must keep in mind that
    the `lib` directory should not be empty at the time of removal, otherwise, the
    command will fail. This is perfect for you if you are one of those people who
    are sick of deleting individual files after searching out hundreds of folders
    and files. It will delete entire directories.


    ‘What if I want to delete the sub directories that exist in the main directory?’
    asked Sylvia, who had by now learned enough to be able to craft a question after
    hours of brainstorming. For that purpose, you can add `-rf` to the command was
    my reply.


    ```

    [aka@localhost ~]$ rm –rf lib

    ```

    Although this command is a really helpful one for your businesses or personal
    work, this can also be a very lethal one. It can delete humongous amounts of data
    in the blink of an eye. Make sure you are deleting the right directory before
    executing the command. Once you enter it, it is all gone.


    Let’s take a look the options we have with the `rm` command.

    - `rm documents` : it helps you delete a particular file named `documents`.

    - `rm -i documents` : type this in the window and you will be asked for confirmation
    before deleting the file.

    - `rm -r documents lib` : it will delete the documents file and `lib` directory
    along with the contents.

    - `rm -rf documents lib` : this also deletes the documents file and `lib` directory
    even if one of them doesn’t exist. The point is that it doesn’t fail considering
    the fact that what you wrote as a file name didn’t exist in the system.


    # The In command


    This command creates new links. You can use it in the following forms:


    ```

    [aka@localhost ~]$ In file link

    ```

    ```

    [aka@localhost ~]$ ln –s item link (for hard link)

    ```


    # Managing the System’s Memory


    Memory in Linux is divided into blocks, technically known as pages. When you enter
    a command to locate a particular page or general information on the memory of
    the system, the kernel starts working to gather the blocks into columns with each
    section designation a particular kind of memory like total memory, used memory
    and free memory. There is a process dubbed as swapping out, executed by the kernel
    in which it accesses the memory pages that remain out of access and brings them
    down to the swap space. Now the question on your mind may be whether the kernel
    does that when you are out of memory. Well, no, it doesn’t. It does that randomly.
    So, the swap space remains filled all the time. If you run a program that needs
    a block which the kernel has swapped out, it starts creating space for it. Yes,
    you understood this. The kernel swaps out some other page to bring in the required
    page.


    If you want to check the memory on your Linux system, there are specific commands
    to do that. Some of them are as shown below, both for checking the swap as well
    as the RAM memory:


    ### The `free` command

    Let’s start right away. You will see the following table:


    ```

    [aka@localhost ~]$ free

    total used free buffers cached

    Mem: 7976 5000 2976 749 1918

    /- buffers/cache: xxx yyy

    Swap: xxx yyy zzz

    ```

    The table is self-explanatory. Everything is explained with the help of columns.
    You get to know about the total, used and free memory. It also shows memory consumption
    by buffers and cache, and also the status of the swap memory.


    ### The `df` command

    You can easily see the free space on your hard drive by the following simple command.


    ```

    [root@localhost ~]# df

    ```

    ```

    Filesystem 1k-blocks Available Use% Mounted on

    /dev/root 1048576 207640 840936 20% /

    devtmpfs 125948 0 125948 0% /dev

    tmpfs 125988 8 125980 0% /run

    ```


    ### The `/proc/meminfo` file

    Another popular method to check the memory status is reading the `/proc/meminfo`
    file. Type in the command: `cat/proc/meminfo` and you will see a long list of
    options along with details of the memory consumed by each of them. Let’s see.
    The following columns will pop up on your screens when you put in the commands.


    ```

    [root@localhost ~]# $ cat/proc/meminfo

    ```

    ```

    MemTotal: xxx kb

    MemFree: xxx kb

    Buffers: xxx kb

    Cached: xxx kb

    SwapCached: xxx kb

    Active: xxx kb

    Inactive: xxx kb

    Active(anon): xxx kb

    Inactive (anon): xxx kb

    Active(file): xxx kb

    Inactive(file): xxx kb

    Unevictable: xxx kb

    Mlocked: xxx kb

    SwapTotal: xxx kb

    SwapFree: xxx kb

    Dirty: xxx kb

    Writeback: xxx kb

    AnonPages: xxx kb

    Mapped: xxx kb

    Shmem: xxx kb

    Slab: xxx kb

    SReclaimable: xxx kb

    SUnrelcaim: xxx kb

    PageTables: xxx kb

    NFS_Unstable: xxx kb

    Bounce: xxx kb

    Commitlimit: xxx kb

    Committed_AS: xxx kb

    VmallocTotal: xxx kb

    VmallocUsed: xxx kb

    VmallocChunk: xxx kb

    HubPages_Total: xxx kb

    HubPages_Free: xxx kb

    HubPages_Rsvd: xxx kb

    HubPages_Surp: xxx kb

    Hubpagesize: ​ xxx kb

    ```

