    shell 在执行命令之前会先分析命令中的变量。如果这些变量在执行过程中必须出现，shell 也会进行替换，在完成这些操作后，它会将结果传递给命令行。


    让我们看看在处理字面量时，你可能会遇到哪些问题。它们可能比你想象的要复杂。假设你正在查看 `/etc/passwd` 目录，以查找匹配 `r.*t` 的项。这将帮助你找到诸如
