    ## Introduction

    I decided to write this book to ease the hurdles that newbie Linux users face.
    I want you to understand your computer in a better way than you did before. This
    book contains a complete package for beginners to understand what the Linux operating
    system is and how it differs from other operating systems. Linux offers you a
    great learning experience. You can understand the system configuration by skimming
    a couple of text files that are fully readable. Just remember the individual status
    of each component and its role when you put together the bigger picture. That’s
    it. Confused. Don’t worry. Keep reading until the end of the book and you will
    understand.


    ### Why should Linux be preferred over other operating systems?

    This is what should be answered at the beginning so that you can have the stimulus
    while you walk through the upcoming chapters of this book. Look, we are not living
    in the ‘80s or the ‘90s. The world has changed so much over the past few years
    and with it has changed the cyber world. Now all the continents are connected
    to one another through computer networks. From the oldest to the youngest, all
    users have access to the Internet. In the nooks and crannies of this cyber world
    there are humongous data bases that are developed by big businesses. There are
    billions of web pages that are processing information on a per second basis.


    Coupled with these facts are the dangers linked to this ubiquitous connectivity.
    This is the age when you need a computer on which you have customized applications
    and complete control. Would you hand over control of your computer system to other
    companies who keep making a profit by marketing how easy they have made the use
    of computers? Or would you rather have more freedom and control over your own
    computer? You deserve freedom to customize control over your computer. You deserve
    to build your own software for your computer systems. That’s why you should prefer
    Linux over all the other operating systems. With Linux on your computer, you can
    direct your computer to do as you wish. It will act on your commands.


    ### Command line is the best option

    We are trapped in the ease of using computers. We are given attractive graphical
    user interfaces to deal with which have made us lazy and robbed us of innovation
    and creativity. This should be done away with. The mouse is not the way to run
    a computer. It is the keyboard which makes you an expert in using computers. Linux
    differs from other operating systems in a sense that it offers the Command Line
    Interface (CLI) instead of the Graphical User Interface. When we talk of the Command
    Line Interface (CLI), the first thing that comes to the mind of most people is
    a dark screen. For most people, it is a horrible thought as compared to using
    a graphical user interface, but this is where your power starts. The CLI allows
    you greater freedom to talk to your computer and direct it to do certain tasks.
    You enter commands on the CLI and the computer interprets them and executes them.
    While the command line interface seems difficult to use - which it no doubt is
    - it makes difficult tasks easier and faster.


    ### Who should read this book?

    You don’t have to be a master of programming to read this book. This book is for
    beginners who are thinking of dipping their toes into the world of Linux. What
    I expect from you before you go on to the next chapters is a basic understanding
    of computers. It means that you should be able to tinker with the graphical user
    interface and finish some key tasks. You should know about booting, startup, log
    in, files and directories. You should know how to create, save and edit documents
    and how to browse the web space. But the most important thing of all is your will
    to learn new things. I’ll take you from there.


    This book also is for those who are fed up with other operating systems and want
    to switch to a smarter operating system. I’ll tell you about Sylvia, my friend,
    in the latter chapters, who was forced by her boss to learn Linux for execution
    of key office tasks. I’ll tell the tale of how hard it was for her and how she
    achieved such a gigantic goal.


    If you have just come to know about Linux and want to switch to this unique operating
    system, this book is definitely for you. Read it, learn the command line and get
    started.


    Before starting the journey, you should bear in mind that there is no shortcut
    to mastering Linux. Like all great and exciting things, learning Linux takes time.
    It may turn out to be challenging at times, and may also take great effort on
    your part. The command line is simple. Also, you can easily remember the commands
    and the syntax. What makes it tough to master is its broadness. It is so wide
    to grasp in a short time. But as with all big things, practice makes you perfect.
    If you keep persevering, you will be able to learn its use and apply it accordingly.
    The only thing I demand from you as a beginner determination, the ability to tackle
    failure, and a responsible attitude. A casual approach is not the best way to
    tackle Linux when you are trying to learn.


    ### What this book has to offer

    This book is filled with material that is easy to read and practice, and perfectly
    suits starters. It is like learning from a tutor. Every step is explained with
    the help of a command line exercise and a solution for you to understand the process.

