    # Case 语句


    `case` 语句与循环不同。`case` 命令中不存在重复的说法。你可以测试诸如整数或字符等简单值。在 `case` 命令中，`bash` 壳会分析条件并据此管理程序流。`case`
    语句首先会展开你包含在其中的任何表达式，然后尝试将该表达式与脚本中包含的模式进行匹配。如果找到匹配项，shell 将执行所有以双分号（`;`）结尾的语句。完成后，`case`
    将以你提供给最后一个命令的退出状态终止。如果 `case` 命令没有找到匹配项，则退出状态为零。


