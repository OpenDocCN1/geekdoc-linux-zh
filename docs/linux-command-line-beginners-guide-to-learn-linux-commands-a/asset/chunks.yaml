    systemd 和 init 之间的区别在于前者为用户提供的灵活性。systemd 仅仅避免了不必要的启动序列。


    # Linux 环境


    那是在秋天。黄红色的叶子从树上飘落，宛如被逐出天堂的天使。它们苍白而颓败，静静地躺在小径和路边的绿化带上。一位手里拿着拐杖的老妇正试图穿过马路。幸运的是，她得到了一恰巧路过的金发年轻女士的帮助。那是周日。太阳躲在城市摩天大楼上方的厚厚云层中，但天气很和煦，是那种让你想去海滩的天气。于是我去海滩了。但等一下。我刚才提到那个帮助老人的金发女士了吗？噢噢！那是西尔维亚（Sylvia）。是的，她确实陪我去了海滩。“今天天气不错吧？要喝点什么吗？”她拿出一瓶桃肉汁。“我不介意，”我微笑回答道。“好，好，好，我终于开始自己熟悉
    Linux 了，”她开始说道。我盯着她，脸上带着一丝尚未完全成熟的皱眉。“看在份份上，我们现在是周末。如果你是因为某种不幸的偶然和我一起来到海滩，请不要破坏这个时刻。”但她就像对待
    Linux 和编程语言的新手一样，是不可阻挡的。


    我妥协了。她对那天的 Linux 环境感到好奇。好吧，这个话题很有趣，于是我继续尝试向她介绍更多相关知识。通过想象 Linux 环境以及我正在日光浴的海滩，你眼前的画面可能是很有趣的。也许你的大脑正试图在
    Linux 环境与我们周围普通的环境之间建立一个类比。


    让我来解释一下。是的，它们大同小异。就像我们生活在环境中；shell 窗口也被它自己的环境所包围。你存储在 Linux 环境中的任何数据程序都可以访问，以确定有关系统配置的事实。在这里有必要提到，环境可以用于自定义
    shell 体验。你可以在环境中找到环境变量 shell 变量。我们将使用两个命令来检查环境：`set` 命令和 `printenv` 命令。后者命令只显示环境变量。我在这里不再详细展开它，因为你将在下一章中看到很多内容。所以，让我们运行
    `set` 命令吧。为了消除长长的变量列表和其他信息，我将通过将 `set` 命令与 `less` 命令配对来管道输出。


    ```

    [aka@localhost ~]$ set | less

    BASH=/bin/sh

    BASHOPTS=checkwinsize:cmdhist:complete_fullquote:expand_aliases:extquote:force_fignore:histappend:hostcomplete:interactive_comments:login_shell:progcomp:promptvars:sourcepath

