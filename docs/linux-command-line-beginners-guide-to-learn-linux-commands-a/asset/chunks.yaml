    # 第 4 章：Linux 系统上的包管理与存储


    通过软件包管理的帮助，我们可以在个人计算机系统中安装和维护软件。接下来的章节将介绍处理软件包管理的工具。所有这些工具都与命令行相关。


    ## 软件包系统


    软件包系统与不同的发行版有所不同，它们也是特定发行版的。你不能在多个发行版上使用同一个软件包系统。通常，有两个主要的软件包系统：


    -   Debian (`.deb`)

    -   Red Hat (`.rmp`)

    '
- fmt: '

    Most Linux distributions fall under these two main camps, but the packaging system
    is not limited to the two. There are some important exceptions, like Slackware
    and Gentoo. Ubuntu, Linspire and Debian use the `(.deb)` camp. Mandriva, Fedora,
    Red Hat Enterprise Linux, and PCLinuxOS use the `(.rpm)` camp.


    ## How it Works

    Usually software is bought from the market and then installed from a disk. You
    run the installation wizard and get the app on your system. This is a standard
    process on a `Windows` system. Linux is different. You don’t have to buy anything
    as almost all software can be found on the web space for free. The distribution
    vendors offer the code compiled and stuffed in package files or they put it as
    source code which you have to install manually. The latter demands pro-level skills.


    A package file can be dubbed as the basic unit of Linux software. It can be further
    explored into sets of files that together make up the software package. A bigger
    question is, what does a package have? It has multiple programs in addition to
    including metadata which shows the text description of the file as well as the
    contents. There are package maintainers who create the package files. These package
    maintainers can be but not always are employees of the vendors who distribute
    the Linux system. The package maintainers receive the source code for the software
    and produces the metadata and installation scripts. They can opt to contribute
    to the source code or leave it as it is received.


    ## Repositories

    The distribution vendors do most of the work related to creating these packages.
    When they have been prepared, vendors or any third parties who created them place
    them in the central repositories. The central repositories are like mines of package
    files. The package files in the repositories are specifically created for the
    distribution.


    There can be more than one repository in a Linux distribution. Let’s take a look
    at a few:


    * Testing repository: this repository is filled with packages that are usually
    used by skilled Linux users who are looking forward to testing bugs in the packages
    before they reach a common user.

    * Development repository: another repository is the development repository, which
    contains the packages under development and will soon be included in the next
    release by the distribution.

    * Third party repository: well, that’s what it is called. This repository contains
    packages that are created by third parties but cannot be made a part of the distribution’s
    major releases out of legal bars. Countries that have pretty relaxed laws related
    to software patents allow the third-party repositories to be released by Linux
    distribution. Although they can be included in the distribution’s release, yet
    they are not part of the distribution and must be included manually in the configuration
    files.


    ## Dependencies

    Linux programs need support from several software components to work efficiently.
    Some packages demand a shared source to get the work done. This shared source,
    such as a shared library, is dubbed as the dependency for the package file. Therefore,
    most of the Linux distribution systems also contain their dependencies in the
    package so that the software functions smoothly.


    ## The tools to manage packages

    There usually are two types of tools for package management:


    * The low-end tools are used to tackle basic tasks like installation and uninstallation
    of package files on the system.

    * The high-end tools are used to conduct meta-data search and resolve the dependency
    problem.


    Let’s take a look at some common tools that come with Linux distribution systems.


    ### Low-end tools

    The `dpkg` is considered as a low-end tool for the Debian style while `rpm` is
    a low-end tool for Red Hat Enterprise, CentOS and Fedora.


    ### High-end tools

    The `aptitude` and `apt-get` are some high-end tools for the Debian style while
    `yum` is considered as a high-end tool for Red Hat Enterprise, CentOS and Fedora.
    You can use these tools to wrap up different key tasks, such as locating a particular
    package from the repositories.


    ### You can install a package

    You can use the following commands to install a package in the Debian style.


    * `apt-get install package_name`

    * `apt-get update`


    For Red Hat style, use the following command.


    * `yum install package_name`


    Also, you can install a package right from a particular package file. Let’s see
    how to do that. This is for the package files that are not part of a repository
    and are installed directly. Let’s see the commands:

    For the users of the Debian style, the following command is used:


    ```

    dpkg –install package_file

    ```


    For the users of the Red Hat style, the following command is used:


    ```

    rpm -i package_file

    ```


    You can also delete a particular package from the system by using these simple
    tools. Let’s take a look at the commands:

    For the Debian style users, the following command tool is the best:


    ```

    apt-get remove package-name

    ```


    For the Red Hat style users, the following command tool works well:


    ```

    yum erase package-name

    ```


    You can do more with the help of command tools. Suppose you have installed a package
    system and now you want to update it. You can do that with the following tools.
    As with the above-mentioned tasks, the tools for the Debian and the Red Hat were
    different, the same is the case with the updating tools.


    * For the Debian style users, the command tool for updating the package system
    is `apt-get update`. You can also replace `update` with `upgrade`. Both do the
    same job.

    * The Red Hate style users can with the command `yum update` .


    If you have downloaded an updated version of a package from a non-repository source,
    you can install it by replacing the previous version. The commands for the job
    are as under:


    * The Debian style users should enter `dpkg –install package-file`.

    * The Red Hat style users should enter `rpm -U package-file`.


    Replace `package-file` with the name of the file that you want to update. When
    you have installed more than one packages over a particular course of time, and
    you want to view them in the form of a list, you can use the following tool to
    see the record.


    * For the Debian style users `dpkg --list` is the tool to view the list.

    * For the Red Hat style users `rpm -qa` should be entered.


    When you have installed a package, you check its status any time to make sure
    it is there on your Linux operating system. There are some handy tools available
    for the purpose. Let’s check out.


    * The Debian style users should enter `type dpkg --status package-name`.

    * The Red Hat style users may use `rpm -q package-name`.


    In addition to checking the status of an installed package, you also can explore
    more information about it with the help of the following commands:


    * The Debian style users may enter `apt-cache show package-name`.

    * The Red Hat style users can type `yum info package-name`.

    '
