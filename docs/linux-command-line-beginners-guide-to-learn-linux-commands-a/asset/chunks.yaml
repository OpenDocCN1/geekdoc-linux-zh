    # 基础命令


    如果你期待像操作 Windows 一样操作 Linux，那么你错了。Linux 更加智能。你通过一套命令集来工作。这就像编程一样。输入命令来完成任务，这就够了。让我们看看你可以操作其中的哪些内容。乐趣将从这里开始。准备好！


    `echo` 命令的奇妙之处如下。


    ```

    [root@localhost ~]# echo My love

    ```

    My love


    `#` 符号表示我是以 root 用户身份登录的。我认为这部分已经完成了。现在输入以下内容：


    让我们尝试 `cat` 命令并看看它能做什么。


    ```

    [aka@localhost ~]$ cat/etc/passwd

    ```

    命令下方将出现大量的行和列。此命令用于显示上述文件的内容。


    你想将文件从一个地方移动到另一个地方吗？请查看 `mv` 命令。


    ```

    [aka@localhost ~]$ mv downloads documents

    ```

    ```

    [aka@localhost ~]$ mv documents programs lib

    ```

    在第二个命令的帮助下，你可以同时将多个文件移动到特定目录。在上面的命令中，`lib` 表示目录名称。


    `cp` 命令用于在 Linux 中将文件从一个地方复制到另一个地方，例如从 downloads 到 documents。


    ```

    [aka@localhost ~]$ cp downloads documents

    ```

    ```

    [aka@localhost ~]$ cp file1 file2 file3 file4 fileN dir

    ```

    第二个命令是将多个文件的内容复制到单个目录中。


    通过 `touch` 命令，你可以创建一个文件。如果文件在你的计算机上已存在，它的时间戳将被被修改。


    ```

    [aka@localhost ~]$ touch video

    ```

    ```

    [aka@localhost ~]$ ls -1 video

    ```

    当你输入第二个命令时，它将显示相应文件的修改时间。


    最后，`rm` 命令用于从系统中删除文件。你脑海里在想回收站吗？忘记它吧。你不需要手动搜索文件将其发送回收站。只需输入 `rm` 和文件名即可。它将被移除。


    ```

    [aka@localhost ~]$ rm downloads

    ```

    文本 `downloads` 是文件名。就像 `touch` 命令一样，你也可以通过输入 `mkdir` 和新目录名称创建一个新目录。


    ```

    [aka@localhost ~]$ mkdir lib

    ```

    ```

    [aka@localhost ~]$ cd /lib

    ```

    [aka@localhost lib]$

    恭喜！你成功创建了一个新文件。这里 `mk` 表示 make。`rmdir` 命令允许你删除目录。这里 `rm` 表示 remove。


    ```

    [aka@localhost ~]$ rmdir lib

    ```

    文件将立即从系统中移除。你必须记住，在删除时 `lib` 目录不能为空，否则命令将失败。如果你是那些厌倦了在搜索数百个文件夹和文件后逐个删除文件的人，这对你来说非常完美。它将删除整个目录。


    “如果我想删除主目录下存在的子目录怎么办？”西尔维亚（Sylvia）问道，经过几个小时的大脑风暴，她现在已经学会了足够可以提出问题。为此，我的回答是可以在命令中添加
    `-rf`。


    ```

    [aka@localhost ~]$ rm –rf lib

    ```

    尽管这个命令对你的业务或个人工作非常有帮助，但它也可能是致命的。它可以在眨眼之间删除大量数据。在执行命令之前，请确保你正在删除正确的目录。一旦输入，一切都消失了。


    让我们看看 `rm` 命令我们拥的选项：

    - `rm documents`：它帮助你删除名为 `documents` 的特定文件。

    - `rm -i documents`：在窗口中输入此内容，将在删除文件前要求你确认。

    - `rm -r documents lib`：它将删除 `documents` 文件和 `lib` 目录及其内容。

    - `rm -rf documents lib`：即使其中一个不存在，它也会删除 `documents` 文件和 `lib` 目录。点在于，考虑到你所写的文件名在系统中不存在，它并不会失败。


