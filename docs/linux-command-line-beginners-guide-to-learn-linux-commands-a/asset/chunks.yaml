    - The first section explains what the shell is. You will learn about the different
    components of the Linux system. In addition, there will be various commands to
    enter in the shell window for your immediate practice. This section also explains
    how to navigate the filesystem and different directories in a Linux operating
    system.

    - The second section will take you further into the command line by explaining
    more about the commands. You will also be able to create your own commands.

    - The third section is packed with more details about the Linux environment and
    system configuration. It will explain how `GRUB` works on Linux. You will learn
    about the system startup, the `init` and different runlevels of Linux.

    - The fourth section talks about the package management, the repositories and
    the dependencies. It educates on managing the existing file systems and creating
    new ones. In addition, it fully explains how you can handle the storage devices
    using a Linux operating system. You will find an example of editing a partiti0n
    and altering its type with the help of command line tools.

    - The fifth section carries details on the Linux environment variables.

    - In the sixth section, you will learn the basics of shell scripting. This is
    like writing your own software. You will learn about key scripting techniques
    by which you can control your computer like teaching your computer about decision-making.
    It is almost akin to artificial intelligence. Your computer will act on its own
    following a set of instructions. Furthermore, you will learn about some important
    commands like the `case` statements, the `break` statement and the `continue`
    statement.

    - The final section will take you to the advanced level of shell scripting.


    ## Pre-requisites for reading the book

    You will need an operational Linux system on your computer before starting to
    read this book because it carries practical exercises and their solutions for
    you. You can install Linux on your computer. There are a number of distributions,
    like `Fedora`, `OpenSUSE` and `Ubuntu`. Installing the distribution system is
    very easy if done in the right way. Of course, there are some specifications that
    you must have on your computer. For instance, at least 256 MB `RAM` and around
    6GB free space on the hard disk. The higher the specifications of the system the
    better it is for the operations. It is recommended that you use a personal computer
    and a landline internet connection. Wireless systems are not suitable for the
    job. You can also use the Linux distribution system from a live CD, so there is
    no need to install it on the system. That’s less messy, to say the least. It is
    easier to do that. On the startup, enter the setup menu and change the boot settings.
    Switch your boot option to boot from a CD instead of the hard disk. After that
    insert the CD and you are all ready to use the Linux distribution system. You
    can run `Ubuntu` and `Fedora` from a live CD.


    ## How this book can help you

    This book is pretty helpful for those who want to wrap up administrative tasks
    in a faster way using the Linux environment. You will be able to write your own
    scripts in order to accomplish specific tasks. After reading this book, you will
    be able to automate certain administrative tasks with the help of shell scripts.
    File management, statistical data management and complex arithmetic functions
    will be a lot easier after you understand some key Linux commands.


    ## Chapter 1: Starting with the Linux Shell

    Linux is everywhere from our cell phones to computers. Linux got started in the
    mid ‘90s. Within a very small window of time, it spread across many industries.
    Stock markets and super computers also use this operating system. Its popularity
    is unparalleled. Linux is basically an operating system just like any other, which
    means it manages the software you install on your system and manages the communication
    between different pieces of hardware. Seems interesting yet! Let’s roll on.


    ### What is Linux?

    Before moving on to the complex parts, it is better that you sail through the
    basic world of Linux first. For beginners, understanding Linux can be perplexing
    if they don’t know what Linux actually is and what it offers. Though it may appear
    complex and undoable thing at the start, in reality, it is easier to learn than
    you may think. The Linux operating system consists of the following parts.


    - **Bootloader**: This manages the boot process of a computer. You might have
    seen a splash screen coming and going in the blink of an eye before you boot into
    the operating system.

    - **The Kernel**: This is also dubbed as the core of the system. It manages the
    entire system by deploying software and hardware when they are needed. In addition,
    the `kernel` manages system memory, as well as the file system.

    - **The Shell**: You can give directions to your computer by typing commands in
    the form of texts. This command line is dubbed as the `shell` which is the daunting
    part of Linux. People just don’t want to venture into it. My friend Sylvia never
    liked Linux until her boss pushed her into this uncanny tech world. Once she got
    into it, she loved it more than Windows and Mac. The control the command line
