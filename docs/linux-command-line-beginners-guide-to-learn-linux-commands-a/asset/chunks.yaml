  trans: "\n\n# 在命令行上使用函数\n\n让我们学习如何在命令行上使用函数。\n\n```bash\nfunction divem {\n  echo\
    \ $[ $1 / $2 ];\n}\ndivem 200 1020\n```\n\n```bash\nfunction doubleit {\n  read\
    \ -p \"Enter val: \" val\n  echo $[$ val * 5 ];\n}\ndoubleit\nEnter value: 50225\n\
    ```\n\n```bash\nfunction multem {\n  echo $[ $1 * $2 ];\n}\nmultem 100 100\n```\n\
    \nShell 函数是把脚本代码放置在一个地方极极方法，这样你可以在需要时重复调用它。它消除了重复编写的操作。如果你需要使用大量函数来处理某些重负载任务，你可以选择创建函数库。\n\
    \n## 如何在 shell 中创建文本菜单\n\n是时候通过让脚本具有交互性让脚本变得更有趣了。这是纯粹的编程。如果你厌倦了在办公室整天与客户交道，可以为他们提供一个交互式菜单供供选择。Linux\
    \ 可以让这一切变得有趣。\n\n显然，你首先需要有一个布局，然后才是菜单。你可以添加想要包含在菜单中的内容。在创建菜单之前，运行 `clear` 命令是一个好习惯。之后，你可以输入\
    \ `echo` 命令来显示菜单的不同元素。你可以在 `-e` 命令的帮助下添加换行符和制表符。命令行默认只显示可打印字符。\n\n```bash\nclear\n\
    echo\necho -e \"\\t\\t\\tWelcome to the Admin Menu\\n\"\necho -e \"\\t1\\. Her\
    \ will be displayed the disk space\"\necho -e \"\\t2\\. Here will be displayed\
    \ the logged on users\"\necho -e \"\\t3\\. Here will be displayed the memory usage\"\
    \necho -e \"\\t0\\. Exit\\n\\n\"\necho -en \"\\t\\tEnter your option: \"\n```\n\
    \n由于最后一行使用了 `-en` 选项，显示内容的末尾不会有换行符。这将允许用户输入内容。你可以通过以下命令获取并读取客户留下的输入。\n\n```bash\n\
    read -n 1 option\n```\n\n你可以将函数分配给菜单。编写这些函数非常有趣。关键是为菜单中的每个项目创建单独的函数。为了省去麻烦，可以创建存根函数（stub\
    \ functions），这样你在 shell 中顺畅工作时就 own 需要放入什么。完整的函数不会阻止在 shell 中运行，这会中断你的工作。如果你将整个菜单放在一个函数脚本中，工作将会更顺畅。\n\
    \n```bash\nfunction menu {\n  clear\n  echo\n  echo -e \"\\t\\t\\tWelcome to the\
    \ Admin Menu\\n\"\n  echo -e \"\\t1\\. Her will be displayed the disk space\"\n\
    \  echo -e \"\\t2\\. Here will be displayed the logged on users\"\n  echo -e \"\
    \\t3\\. Here will be displayed the memory usage\"\n  echo -e \"\\t0\\. Exit\\\
    n\\n\"\n  echo -en \"\\t\\tEnter your option: \"\n  read -n 1 option\n}\n```\n\
    \n正如我已经讨论过的，这将帮助你通过只需调用函数命令随时查看菜单。现在你需要使用 `case` 命令来整合布局和函数，使菜单能够实时运行。\n\n```bash\n\
    cat menu1\n#!/bin/bash\n# simple script menu\nfunction diskspace {\n  clear\n\
    \  df -k\n}\nfunction whoseon {\n  clear\n  who\n}\nfunction memusage {\n  clear\n\
    \  cat /proc/meminfo\n}\nfunction themenu {\n  clear\n  echo\n  echo -e \"\\t\\\
    t\\tWelcome to the Admin Menu\\n\"\n  echo -e \"\\t1\\. Her will be displayed\
    \ the disk space\"\n  echo -e \"\\t2\\. Here will be displayed the logged on users\"\
    \n  echo -e \"\\t3\\. Here will be displayed the memory usage\"\n  echo -e \"\\\
    t0\\. Exit\\n\\n\"\n  echo -en \"\\t\\tEnter your option: \"\n  read -n 1 option\n\
    }\nwhile [ 1 ]\ndo\n  case $option in\n    0)break ;;\n    1)diskspace ;;\n  \
    \  2)whoseon ;;\n    3)memusage ;;\n    *)\n      clear\n      echo \"Sorry, you\
    \ went for the wrong selection\";\n      ;;\n  esac\n  echo -en \"\\n\\n\\t\\\
    t\\tHit any key on the keyboard to continue\"\n  read -n 1 line\ndone\nclear\n\
    ```\n\n## 结论\n\nSylvia 现在已经是一个热心的学习者。她承认她一生以来所恨的东西现在变成了她的生命线。使用的易用性、速度、对电脑的控制力以及\
    \ Linux 给她的乐趣是无与伦比的。她现在已经在家的个人电脑上安装了 Linux。Sylvia 现在正朝着成为 Linux 专家的道路前进。我想由于她练习\
    \ shell 的方式，她很快就能在命令行方面给我提供建议了。她永远不会告诉任何人的技巧是她写了一个日记，在记录了所有重要的命令，以便在需要时轻松调用。最终，这帮助她记住了命令。\n\
    \nLinux 是一种操作系统，就像你有 Windows 或 Mac OS X 一样。有人说它浮于软件形式和硬件形式的操作系统之间。程序员和白黑客认为 Linux\
    \ 比 Windows 操作系统更好。另一方面，必须处理日常办公工作或玩游戏的普通人更倾向于 Windows 操作系统。Linux 确实优于 Windows，这种观点背后是有原因的。让我们分析一下它们，这样当你读完这本书后，对不同的操作系统会有更清晰的认识。引用一个例子是恰当的。如果你买了一部高端手机，但看不到它内部是什么以及它是如何运行的？Windows\
    \ 操作系统就像那部手机。你可以使用它，享受它，但你不知道它是如何工作的、如何供电的以及如何布布的。相反，Linux 是开源的。你可以随时喜欢进入它的源代码。\n\
    \n在技术方面，世界运行得非常快。虽然世界上有很多好人在为网络世界增添积极事物，例如可以真正帮助你处理日常活动的操作系统和应用程序，但也不缺少那些坏人，他们不断试图潜入你的个人电脑，抢夺任何可以帮助他们赚钱的重要信息。现在，保护自己免受那些怀有此类邪恶设计的人侵害是你的首要任务。拥有这种保护的基本方法是获取一个能够防止此类攻击的操作系统。\n\
    \nWindows OS 极易受到黑客攻击。我不能声称 Linux 是绝对不可破解的，但它仍然比 Windows 好得多。它的包管理和仓库等功能使它比 Windows\
    \ 更安全。如果你在个人电脑上安装了 Windows OS，你就一直面临系统感染病毒的风险，这就是为什么你在安装 Windows OS 之后的第一件事就是购买杀病毒软件以保持电脑得到良好保护。然而，在个人电脑上使用\
    \ Linux，这种需求被消除了。\n\nWindows OS 对要安装的系统规格非常敏感。例如，要在你的系统上安装 Windows 10，你需要更新 RAM\
    \ 和 HDD 内存。我的朋友有一部安装了 Windows 7 的笔记本电脑。突然，他的系统开始显示微软已停止支持 Windows 7，他必须在电脑上安装\
    \ Windows 10。该信息还读到一条警告，最好购买一台公司已经安装好 Windows 10 的新电脑。这是在“建议操作”标题下。正如大多数人所做样，他买了一台新电脑并卖掉了旧的。\n\
    \nLinux 的情况完全不是这样。你只需要满足最低系统要求并启动操作系统，无需担心它的过期。Linux 具有复活旧电脑系统的能力。如果你有一个拥有 256\
    \ MB RAM 和旧处理器的系统，就足够运行 Linux 了。现在对比一下需要 8GB RAM 才能流畅运行的 Windows 10。如果你给 Linux\
    \ 操作系统相同的系统规格，它无疑会让你在相对于 Windows OS 时获得优势。\n\n此外，Linux 最适合程序员。它支持所有编程语言，如 Java、Python、Ruby、Perl\
    \ 和 C++。此外，还有许多适合程序员的程序。特别是 Linux 上的包管理器是程序员顺利完成工作所需要的。Linux 提供了广泛的软件更新，安装速度更快，不像\
    \ Windows 为了安装最新更新而重启多次。除了所有好处外，最大的是自定义化选项。你在 Windows 中得到的任何东西都是真理。你不能为了方便使用而改变它。在\
    \ Linux 中，情况发生了巨大的变化。你可以自定义不同的功能。你可以根据意愿添加或删除操作系统的不同功能。保留你需要的，删除你不喜欢的，因为它是一个开源系统。你还可以在你的系统中添加或放弃各种壁纸和图标主题以自定义它的外观。\n\
    \n也许 Linux 最大的好处是你可以从网上免费获取它。不像 Windows OS，你不需要购买它。\n\n这本书帮助用户学习 Linux 命令行界面的基础，这使得\
    \ Linux 与所有其他操作系统不同。现在你已经读到了最后，我希望你已经学会了让 Linux 使用变得有趣的秘密。我希望消除了对命令行的恐惧。\n\n"
