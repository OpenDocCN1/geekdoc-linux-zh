  trans: '


    `PATH` 是 Linux 操作系统中的一个环境变量。当你输入命令或运行 脚本时，它会被激活。 脚本就像一个微型程序，为类 Unix 系统的用户提供纯文本的用户界面。它可以读取命令并据此执行它们。这里需要注意的一点是，全大写的
    `PATH` 不能被替换为全小写的路径。


    路径变量（path variable）是另一个完全不同的概念，它是目录的地址。相对路径（Relative path）指的是相对于你当前所在目录的地址。正如之前讨论过的，还有绝对路径（absolute
    path），它是相对于根根目录的地址。另一方面，`PATH` 将是一系列由冒号分隔的路径，并以纯文本文件的形式存储。为了方便修订和解释，让我们来看看它是如何执行的。


    ```bash

    [aka@localhost ~]$ echo $PATH

    /usr/local/sbin:/bin:/sbin:/usr/bin:/usr/sbin:/usr/local/bin

    ```

    你可以向这个字符串中添加新目录。让我们来试一下。


    ```bash

    [aka@localhost ~]$ echo $PATH

    /usr/local/sbin:/bin:/sbin:/usr/bin:/usr/sbin:/usr/local/bin

    [aka@localhost ~]$ PATH=$PATH:/home/rich/azuresky

    [root@localhost ~]# echo $PATH

    /usr/local/sbin:/bin:/sbin:/usr/bin:/usr/sbin:/usr/local/bin:/home/rich/azuresky

    ```


    需要说明的是，Linux 操作系统中的每个用户的 `PATH` 变量与其他用户不同。在安装操作系统后，系统会为你的 `PATH` 设置一个默认变量。之后，你可以根据需要对其添加更多内容或进行完全更改。


    **注意：** 需要提到的是，根用户（root）的 `PATH` 变量比任何其他用户包含更多的目录。`PATH` 变量的一个有趣之处在于，你可以只针对当前会话更改它，也可以永久性地更改。


    ## 如何查找 Linux 系统的环境变量

    系统在脚本脚本使用了多个变量用于识别目的。通过系统变量的帮助，你可以轻松地为程序获取重要信息。Linux 系统有不同的启动方法，在每个系统中，bash shell
    执行启动文件的方式也不相同。


    ### 登录 Shell (Login Shell)

    它会定位四个不同的启动文件，并从中处理命令。第一个执行的文件是 `/etc/profile`。你可以将其比作 bash shell 的默认文件。每当你登录时，这个命令都会被执行。


    ```bash

    [aka@localhost ~]# cat /etc/profile

    # /etc/profile

    ```

    我在超级用户身份登录时运行了这个命令。你窗口上的结果可能会略有不同。请看下方的 `export` 命令：


    ```bash

    export PATH USER LOGNAME MAIL HOSTNAME HISTSIZE HISTCONTROL

    ```

    你可以清楚地看到，`export` 命令确保变量对子进程可访问。


    ### $HOME

    这是一个特定用户的变量。让我们运行它来看看它包含什么。


    ```bash

    [aka@localhost ~]# cat .bash_profile

    # .bash_profile

    # Get the aliases and functions

    if [ -f ~/.bashrc ]; then

    . ~/.bashrc

    fi

    # User specific environment and startup programs

    PATH=$PATH:$HOME/bin

    export PATH

    ```


    ### 交互式 Shell (Interactive Shell)

    如果你在没有登录系统的情况下启动了 bash shell，你就启动了交互式 shell。你可以在这里输入命令。从交互式 shell 时，系统不会加载 `/etc/profile`
    文件。它会在用户家目录下查找另一个名为 `.bashrc` 的文件。让我们看看这个启动文件在 Linux 系统中长什么样。


    ```bash

    [aka@localhost ~]# cat .bashrc

    ```

    它执行两个关键任务：首先是检查 `/etc` 目录下是否存在 `bashrc` 文件；其次是允许用户输入别名（aliases）。


    ```bash

    [aka@localhost ~]$ cat /etc/bashrc

    ```


    ### 变量数组 (Variable Arrays)

    你可以将变量作为数组。数组有趣的地方在于它们能够存储多个值，你可以通过这些值引用一个完整的数组。你只需要在括号中用单个空格列出多个值，就可以将它们挤入单个变量中。让我们试一下。


    ```bash

    [aka@localhost ~]$ myworld=(one two three four five)

    [aka@localhost ~]$ echo $myworld

    one

    [aka@localhost ~]$ echo ${myworld[2]}

    three

    [aka@localhost ~]$ echo ${myworld[1]}

    two

    [aka@localhost ~]$ echo ${myworld[4]}

    five

    ```

    你可以看到构建变量数组是多么简单。你可以使用特殊命令提取数组中的每个值。现在尝试以下操作来提取整个数组。


    ```bash

    [aka@localhost ~]$ echo ${myworld[*]}

    one two three four five

    ```

    此外，你还可以从数组中取消某个特定值。


    ```bash

    [aka@localhost ~]$ unset myworld[3]

    [aka@localhost ~]$ echo ${myworld[*]}

    one two three five

    ```

    如果你想删除整个数组，可以通过取消它来实现。


    ```bash

    [aka@localhost ~]$ unset myworld[*]

    [aka@localhost ~]$ echo ${myworld[*]}

    ```

    变量数组不能移植到其他 shell 环境，这就是为什么它们不是 Linux 操作系统用户的首选选项。


    ## 第 6 章：Shell 脚本基础

    Sylvia 对学习 Linux 操作系统基础和命令行感到非常兴奋。事实上，她发现通过输入简短命令并获得即时结果来完成工作非常神奇且令人满意，这时我告诉她，Linux
    系统的主要部分还没有登场。这对新手来说是最最困难的部分。当我提到 Linux 的困难部分时，她问道：“那么，我必须写代码吗？”我回答是肯定的。在本章中，我将带你进入
    Shell 脚本的世界。Shell 脚本编写非常像编程。它是令人兴奋、刺激且富有创造力的。


    到目前你已经学会了如何使用命令行界面（CLI）。你输入了命令并查看了命令结果。现在是进行 Linux 高级活动的时机了，那就是 Shell 脚本，你必须输入多个命令并获取每个命令的结果。你还可以将一个命令的结果传递给另一个命令。简而言之，你可以在单个步骤中配对多个命令。让我们看看是如何操作的。编写如下语法。


    ```bash

    [aka@localhost ~]$ date ; who

    ```

    现在运行这个命令。你将先看到日期和时间，在该命令下方是当前登录系统的用户详情。你可以添加多达 255 个字符的命令。这就是最终限制。


    **提示：** 当你尝试组合多个命令时，问题一定会阻碍你：记得每次输入它们时都要记住它们。解决这个问题的一种简单方法是将多个命令保存到文本文件中，这样在你需要时就可以复制粘贴。这绝对有效。你也可以运行该文本文件。


    ### 如何创建文本文件：

    你可以在 shell 窗口中创建自定义文件，并将 shell 命令放在文件中。打开像 `vim` 这样的文本编辑器来创建文件。我们已经在 Linux 命令行练习过如何创建文本文件。让我们复习一下。


    ```bash

    [aka@localhost ~]$ cat > file.txt

    ```

    自由女神像是是法国赠送的。所以，准备好编写你的第一个 shell 脚本吧。让我们开始吧。打开 bash 文本编辑器并编写如下或类似的脚本。


    ```bash

    #!/bin/bash


    # Script writing is interesting.

    echo ‘The sky is azure!’

    ```

    第二行开头带有 `#` 看起来像是一个注释。在第三行中，我们可以看到 `echo` 命令。记住你必须忽略 `#` 符号之后的一切。让我们在命令行中试一下。


    ```bash

    [aka@localhost ~]$ echo ‘The sky is azure!’ #I have entered a comment

    ```


    '
- fmt: '

    The sky is azure! Well, by now you might be thinking about the comments and their
    relation with the `#` sign. Then your mind will be distracted and perplexed to
    think about the first line of the script that also starts with the `#` sign. No,
    that’s not a comment but rather a special line commonly known as shebang. This
    should come at the start of each script. You can save your file now with any name
    you desire. I saved it as `azure_sky`.


    ## Displaying Messages

    When you enter something in the command line, an output is definitely expected
    out of it that is displayed on the screen. You can also add text messages to let
    the user know what is going on in the script. The `echo` command does the wonder
    for you. It can show the string of simple text on the screen.


    ```bash

    [aka@localhost ~]$ echo I hope you are writing the code in the right way.

    I hope you are writing the code in the right way.

    ```


    Now let’s try something exciting to see how it can go wrong and how to rectify
    what goes wrong.


    ```bash

    [aka@localhost ~]$ echo I''ll be happy if you don''t go for swimming.

    Ill be happy if you dont go for swimming.

    [aka@localhost ~]$ echo "I''ll be happy if you don''t go for swimming."

    I''ll be happy if you don''t go for swimming.

    [aka@localhost ~]$ echo ''John says "I''ll be happy if you don''t go for swimming."''

    John says "Ill be happy if you dont go for swimming."

    ```


    The command went wrong, and the display was not what we had expected. So. We had
    to rectify it with the help of quotation marks.


    ## Shall I Execute it Now?

    It is time to execute the file you have just saved. Let’s run the command.


    ```bash

    [aka@localhost ~]$ azure_sky

    bash: azure_sky: command not found

    ```


    You have to guide the bash shell in locating your shell script file.


    ```bash

    [aka@localhost ~]$ 1s -1 azure_sky

    -rw-r—r—1 me me​ 63 2019-08-26 03:17 azure_sky


    [aka@localhost ~]$ chmod 755 azure_sky

    [aka@localhost ~]$ 1s -1 azure_sky

    rwxr-xr-x 1 me me​ 63 2019-08-26 03:17 azure_sky

    ```


    But how will the command line find the script that you have just written? The
    script should have an explicit path name. In case you fail to do that, you are
    likely to see the following:


    ```bash

    [aka@localhost ~]$ azure_sky

    bash: azurer_sky: command not found

    ```


    You must tell the command line the exact location of your script. Otherwise, you
    won’t be able to execute it. There are different directories in the Linux system,
    and all of them are in the `PATH` variable. I have already shown you how to see
    what directories are on the system, explore the `PATH` variable.


    ```bash

    [aka@localhost ~]$ echo $PATH

    /usr/local/sbin:/bin:/sbin:/usr/bin:/usr/sbin:/usr/local/bin:/home/rich/azuresky

    ```


    Now that we have got the list of the directories you can see and put your script
    in the directory you want to. Follow the following steps to save your script in
    a specific directory.


    ```bash

    [aka@localhost ~]$ mkdir bin

    [aka@localhost ~]$ mv azure_sky bin

    [aka@localhost ~]$ azure_sky

    azure_sky

    ```


    If your `PATH` variable misses the directory, you can add it by the following
    method:


    ```bash

    [aka@localhost ~]$ export PATH=~/bin:"$PATH"

    ```


    ## More ways to format scripts

    The ultimate goal of a good script writer should be to write a good script and
    maintain it smoothly. You should be able to easily edit the script like adding
    more to a particular script or removing from it. Also, it should be formatted
    in a way that it should be easy to read as well as understand.


    ### Go for long option names

    We have seen many commands both with long and short options name. The `ls` command
    that is used to list directories in your Linux system has lots of options such
    as the following:


    ```bash

    [aka@localhost ~]$ ls -ad

    [aka@localhost ~]$ ls –all --directory

    ```


    Both these commands are equivalent when it comes to the results. Users prefer
    short options for ease of use so that they may not have to remember long option
    names. Almost every option that I have stated in previous chapters has a long
    form. Though short form options are easy to remember, it is always recommended
    to go for the full names when it comes to script writing because it is more reader-friendly.


    ### Indentation

    Now long form commands are also not very easy to handle. You have to take care
    to write them in the right format so that it may confuse the reader. You can use
    commas between many lines.


    ### How to use Quotation Marks and Literals

    This is quite technical. As a Linux user, you must know how and where to use quotation
    marks, commas and period. Why does a specific punctuation mark necessary for the
    script? Let us print the following string.


    ```bash

    [aka@localhost ~]$ echo $10000

    00

    ```


    The output should have been 100, but it was instead a double zero. If you are
    thinking that the command line couldn’t understand the script and executed it
    what part it succeeded in comprehending, you are right. It got it all wrong. So,
    what should be done now? First, we need to understand why did it get it all wrong?
    Its reason is that the shell only saw `00`. It considered `$1` as a shell variable.
    That’s what it is. You failed to make it easily readable. Perhaps you should add
    the quotation marks. Add them right away.


    ```bash

    [aka@localhost ~]$ echo “$100” own00

    ```


    You are getting it wrong. Still you get the same result. Are you frustrated by
    now? We have a solution.


    ```bash

    [aka@localhost ~]$ echo ‘$100’

    $100

    ```

