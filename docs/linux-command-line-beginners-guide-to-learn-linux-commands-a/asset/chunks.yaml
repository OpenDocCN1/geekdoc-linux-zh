    # 此内存详情显示了 Linux 服务器拥有的物理内存总行数。它将显示使用了多少内存以及用在哪里。你可以看到所有的内存页，这些页面因系统不同而有所不同。你的
    Linux 系统可能没有创建上述某些页面。


    ## Shell 导航概览

    如果你停留在同一个地方，很快就会对 Linux 感到无味。你必须能够在不同的文件和目录之间进行导航，以享受这款独一无二的操作系统的体验。你需要了解自己所在的位置、你有权访问哪些内容，以及可以使用什么命令来访问它们。首先，你应该知道自己的“脚落在哪里”。要学习这一点，请使用以下命令。


    ```bash

    [aka@localhost ~]$ pwd

    ```


    在大多数情况下，人们会进入其账户的主目录。现在，主目录是什么呢？让我为你解释一切。主目录是你不仅可以在其中存储文件，还可以建立目录的地方。在这里，你是老板。它就像你一个真实的家。可以随意在这里存储你的数据，并创建多个目录。在
    `pwd` 命令中，`p` 代表 print（打印），`w` 代表 working（工作），而 `d` 代表 directory（目录）。


    ### 它是一棵树吗？

    它看起来不像，但它确实是一棵树。就像 Windows 操作系统一样，Linux 将所有文件和文件夹排列成层次结构。是的，如果你能以某种方式将其具象化为某些具体的东西，它看起来就像一棵树。因此有了“tree”（树）这个词。你可能会惊讶地发现，在
    Windows 和 Linux 等不同操作系统之间，大多数事情都是相同的。为了方便用户，创建者更改了一些名称以区分这些系统。例如，在 Linux 中被称为
    directory（目录）的东西在 Windows 中通常被称为 folder（文件夹）。


    让我带你进一步进入 Linux 目录的世界。首先，这些目录与 Windows 文件夹在某些方面不同，它们可以携带大量的文件和子目录。你遇到的第一个目录是 `root`
    目录。


    ### Linux 与 Windows 不一致之处

    嗯，世界上总会有分歧。如果你是 Windows 用户，你最习惯为硬盘、USB 存储设备和 DVD 驱动器使用独立的文件系统。但 Linux 挑战了这种系统。它为所有外部内部存储设备提供了一个单一的树状文件系统。


    Windows 为普通用户让事情变得简单，但这让我们失去了享受复杂技术命令的乐趣。看，Windows 显然以树的形式、图形化的方式呈现文件系统。这里有很多加号和减号。通过加号，你可以进一步探索树的分支，而减号则帮助你关闭这些分支并简化视图。根目录始终位于顶部。


    如果你在考虑像图形化界面那样酷的事，现在停止思考吧。Linux 通过提供通过输入文本命令来导航不同文件和文件夹的潜力，让它变得有趣。在 Linux 终端或
    shell 窗口中，你始终处于某个被称为“当前目录”的目录中。要知道你的确切位置，正如我之前解释的那样，`pwd` 命令可以为你提供帮助。


    你想知道目录的内容吗？每个人都想知道。我相信你已经学习并练习了如何知道你当前所在的目录。是时候深入研究系统了。你应该知道如何使用单个命令探索目录的内容。你可以留在主目录并探索它，也可以移动到你最喜欢的目录。要探索你当前正在工作的目录，请尝试以下命令。


    ```bash

    [aka@localhost ~]$ ls

    ```


    Pictures Videos Games Documents


    我的朋友 Sylvia 喜欢以光速从一个文件夹跳转到另一个文件夹。虽然在 Windows 中这样做很有趣，但在 Linux 中这样做更快更简单。只需记住 `cd`
    因素。Sylvia 虽然学得很辛苦，但她通过在笔记本上记下并背诵整个文本学会了它。现在她只需要输入 `cd` 和她想要跳转的目录的路径即可。


    让我承认，这看起来并不那么简单。路径名就像一个魔圈，我们通过它跳到我们想要进入的目录。路径分为两类：相对路径和绝对路径。


    ### 绝对路径

    也称为绝对路径或全路径。路径通常由包含对象名称字符序列组成。它所所在的目录名称也是名称的一部分。可能会有一个包含软件和程序的目录。在这个目录中，还有你需要访问的其它目录。你的路径将如下所示。


    ```bash

    [aka@localhost ~]$ cd /usr/lib

    [aka@localhost lib]$

    ```


    你可以随时通过应用 `pwd` 命令确认你是否已移动到目标目录。


    ### 相对路径

    你可以从当前目录开始，通过简单的命令移动到父目录。你喜欢输入像 `..` 这样的点吗？单点指代当前工作目录，而双点 `..` 则带你进入父目录。


    ```bash

    [aka@localhost lib]$ cd /usr/lib

    [aka@localhost lib]$

    ```


    我想去 `/usr`。你可以采用长路径，也可以采用更短的方法。让我们先用长但更安全的方法。


    ```bash

    [aka@localhost lib]$ cd /usr

    [aka@localhost usr]$ pwd

    /usr

    ```


    现在用更短、更快的方法这样做。


    ```bash

    [aka@localhost lib]$ cd..

    [aka@localhost usr]$ pwd

    /usr

    ```


    完成了。你已经切换到了父目录。等一下。我们还没结束。让我们再次通过两种方法回到工作目录。我们目前处于父目录中。记住这一点。你的屏幕现在显示以下内容。


    ```bash

    [aka@localhost usr]$ Type the following.

    [aka@localhost usr]$ cd /usr/lib

    [aka@localhost lib]$

    ```


    让我们用更短、更快的方法这样做。你还记得单点 supposed 是做什么的吗？


    ```bash

    [aka@localhost usr]$ cd ./../bin

    [aka@localhost lib]$

    ```


    Sylvia 只是讨厌这些点。她总是在需要插入单点的地方用双点，在需要双点的地方用单点。有一天，当我路过她的办公室散步时，我进去发现她正被这些简单的命令搞得一团糟。患难见见真朋友。我告诉她一个从父目录切换回工作目录的魔法公式。让我们试一下。


    ```bash

    [aka@localhost usr]$ cd bin

    [aka@localhost bin]$

    ```


    不仅省略了点，连斜杠也省略了。这是一个行业小技巧：`cd` 是 current（当前）和 directory（目录）的缩写。如果你只尝试输入 `cd` 命令，它会将你带回登录后首次开始的目录。


    ```bash

    [aka@localhost lib]$ cd

    [aka@localhost ~]$

    ```


    关于 `cd` 命令的更多信息：让我们尝试一下 `-`。它应该将工作目录切换到你离开的那个目录。假设你从 `usr` 切换后目前处于 `lib`。


    ```bash

    [aka@localhost lib]$ cd -

    /usr

    [aka@localhost usr]$

    ```


    另一个需要知道的重要命令是 `cd ~ username`。如果你有另一个用户名如 `john`，你可以在 username 的地方输入名称来切换到该账户的目录。


    深思：重要的是，在 Linux 中，当你在 shell 窗口中输入文件名时，需要注意使用正确的大小写。在这个操作系统中，downloads 和 Downloads
    是两个不同的东西。


    如果你在任何时候想回到起点，只需输入 `cd` 并按回车。然后输入 `pwd` 来知道你目前所在的位置。


    ## 你已经可以使用 ls 命令做的事情

    现在是时候学习更多命令了，因为你已经掌握了基础知识。你现在知道 `ls` 用于列出目录。此外，你还可以查看目录的内容。


    ```bash

    [aka@localhost ~]$ ls

    ```


    '
- fmt: '

    `bin games include lib lib64 libexec local sbin share src tmp` In the above command,
    you can see four different directories. Now I want you to take a dive into your
    brain and bring out a specific directory name you want to list. Let me dive in
    first using mine. I’ll use `#` for this command - that is the face of the super
    user.


    ```

    [aka@localhost ~]$ ls /usr

    ```


    Let us take a look at some more options for the `ls` command. There is an option
    `-a` which can be extended to `--all`. It will list all files including the ones
    starting from a period that usually remain hidden from other commands.


    ```bash

    [aka@localhost ~]$ ls –a . ..  bin games include lib lib64 libexec local sbin
    share src tmp

    ```


    The second option is `-d` that can be extended to `--directory`. If used alone,
    this command will show you a list of your directory’s contents. You can pair it
    up with the `-1` in order to view the content details.


    The third option to consider is the `-1` command. You can see the outcomes in
    the long form.


    ```bash

    [aka@localhost ~]$ ls –1bin games include lib64 libexec local sbin share src tmp

    ```


    The fourth option is the `-S`. It sorts out the results with respect to the size
    of the file. Here `S` denotes the word size. If you remember the signs by assigning
    them a full, relevant and familiar word, it will help you memorize the commands
    faster than normal.


    The fifth option is `-h` with the long form `--human-readable`. This helps you
    to get a full-size display of directories and files that is human-readable instead
    of just showing bytes.


    The sixth option is `-r` with the long form `--reverse`. It displays your results
    in a reverse angle that means in the descending alphabetical order.


    ```bash

    [aka@localhost ~]$ ls –rtmp src share sbin local libexec lib64 lib include games
    bin

    ```


    The seventh option is `-t`. As apparent from the use of the letter ‘t’ this option
    offers to view the results with respect to modification of time.


    ```bash

    [aka@localhost ~]$ ls –t

    sbin lib lib64 libexec share include src local games tmp bin

    ```

    You can see that the position of the files has been changed with respect to the
    modification of time.


    ### How to make out a File’s Type Now that we are going deeper into the system,
    it is time to know how to determine the type of a particular file. Actually, Linux
    does not make it that much easy for the users as Windows does. There are not familiar
    and most likely type file names that you could easily guess. It makes it rough
    and tough. To determine a file type, you should type in the following command.


    ```bash

    [aka@localhost ~]$ file downloads

    ```

    This is known as the `file` command. When you execute it, it is likely to print
    the following information.


    ```bash

    [aka@localhost ~]$ file downloads

    images.jpg: JFIF standard 1.01

    ```

    In Linux there are lots of files. As you explore the system, you get to know more
    and more types of the files. So, stay tuned! Keep reading.


    ### The Less Command There is another important command in the arsenal of Linux
    that is the `less` command. It is a full program for those who are interested
    in viewing text files. This command helps you view the human-readable files in
    your system. It tracks them out in no time and allows you to view them.


    Wait! As I write, Sylvia knocks the door and jumps in the lounge where I was working
    on my laptop. She is always curious about learning the Linux command line since
    the day her boss made it mandatory for her to do that. I must admit that what
    was earlier on a big burden on her nerves and shoulders had now turned into a
    passion. She loves the way Linux made it easier to wrap up office work in lesser
    time. The time she saves at the office allows her to drop in at her friends’ homes.
    I hope you have stopped thinking about why she is here in my home. Let’s welcome
    her.


    Sylvia, when learning the `less` command, was always curious why do we need this
    command in the first place? In fact, why do we need to see the text files? Its
    answer is that many files are not just ordinary files. They are system files that
    contain configuration files. They are stored in your system in this special format.


    If you are thinking like Sylvia, you might say that’s not a big deal. Why do I
    have to view the configuration files in the first place? There is an answer to
    that as well. This command not only shows the system file but also lots of real
    programs that your system is using. These programs are technically called scripts.
    They are always stored in the system in this specific format.


    I am using the word text for quite some time. Information can be displayed on
    a computer in a variety of forms. It is represented in the form of pictures, videos,
    numbers and alphabets in Windows operating system. Normally the language that
    the computer understands is in numerical form like the binary digits.


    If we look at text as the representation system, it feels simpler and easier than
    all the other methods. The human brain processes the information faster than in
    this form. Numbers are converted into text one-by-one. This system is very compact.
    This text is different from that of the one in word processors. I am telling you
    about this because in Linux a number of files are stored in the system in the
    form of text files. Let’s see how can we use the `less` command.


    ```bash

    [aka@localhost ~]$ less downloads

    ```

    This program helps users to navigate through a specific file. Some files are longer
    and some are shorter. For longer files, such as the one containing system information,
    it can be scrolled up and down. If you want to exit the `less` command just strike
    the `Q` key. Some files can be really longer like the following one.


    ```bash

    [aka@localhost ~]$ less /etc/passwd

    ```


    ### Things to Remember

    - You can use the Page UP key to scroll back a page. Use `b` instead if you don’t
    like to use Page UP.

    - Use the PageDn key to scroll on to the next page. For the same purpose, you
    can also use spacebar.

    - The up arrow and down arrow keys are used for moving to one line above and below
    respectively.

    - If you are in the middle of the text and want to jump to the end of the text
    file, press `G`. To reach the start of the text file, press `1G` or `g`.

    - `h` can be used to get the help screen displayed.

    - `q` is always there to quit the `less` command.


    ### Common Directory Names in Linux

    - `/` denotes the root. There are usually no files in this directory.

    - `/lib/` denotes the library directory to store library files.

    - `/root` takes you to the home directory. A root user is also called the super
    user.

    - `/etc` contains configuration files.

    - `/bin` stores GNU user-level utilities. Also known as the binary directory.

    - `/opt` is executed to store optional software.

    - `/dev` is known as the device directory.

    - `/usr` is the user installed software directory.

    - `/var` is the variable directory. It changes frequently.


    ### Chapter 2: Exploring the Realm of Commands

    I hope that by now, you have gained sufficient knowledge about how you can navigate
    through the shell window using simple commands. That’s easy, you see. A little
    bit of extra consideration will help you get through most of the work in no time
    which in the Windows operating system might have taken hours of exhaustive work.
    One more interesting thing is that the commands are easy to memorize. You can
    also create your own commands and that’s what we will learn in this chapter. Also,
    by getting acquainted with more commands, you will feel more comfortable in using
    them in the real shell window.


    There are different types of commands:

    - It can be a shell function, a kind of shell scripts that are incorporated in
    the environment.

    - Commands constitute executable programs just like software engineers do while
    working on C language or Python and Ruby.

    - Or a command can be an alias which is your self-made command.


    Do you know how to know a command’s type? Let’ see how it is done.


    ```bash

    [aka@localhost ~]$ type cd

    cd is a shell buildin

    ```


    ```bash

    [aka@localhost ~]$ type cp

    cp is /bin/cp

    ```


    ```bash

    [aka@localhost ~]$ type rm

    rm is /bin/rm

    ```


    ```bash

    [aka@localhost ~]$ type mkdir

    mkdir is /bin/mkdir

    ```

    Now we know the type of each of our commands.

