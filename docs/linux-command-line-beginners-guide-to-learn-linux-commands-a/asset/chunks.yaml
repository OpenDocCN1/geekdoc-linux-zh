    # The Double Brackets


    Now the next special feature is the use of double brackets. This command is used
    in string comparisons. Its special use is in pattern matching.


    ```bash

    [aka@localhost ~]$ #!/bin/bash

    [aka@localhost ~]$ #using pattern bashing

    [aka@localhost ~]$ if [[$USER == r*]]

    then

    echo "Hey $USER"

    else

    echo "I cannot recognize you. Come back later."

    fi

    ```


    If the command inside the double bracket matches the `$USER` variable and finds
    that it starts with the letter `r`, which in this case is `rae`, then the shell
    obviously executes the `then` section part of the script.


    # The Loops


    Sylvia happens to be a Marvel fan. She never misses a single movie. One of her
    favorite characters is Doctor Strange, the accidental wizard. Well, I don’t like
    these fantasy things but why I am talking about it is the fact that one day Sylvia
    half narrated and half described by gestures a scene from one his movies in which
    he fabricates by his magic a time loop to defeat the villain Dormamu. I loved
    the tale because of its sprightliness. Sylvia loved it more because she connected
    it with the loops in Linux. Doctor Strange traps Dormamu in a time loop in which
    he was supposed to remain endlessly until he agreed to Dr. Strange’s bargain.
    Again, and again. Doctor Strange appears and is killed by Dormamu because of the
    time loop which keeps repeating itself. Sylvia linked the two loops and fed the
    lesson in her mind quite successfully. A smart thought though she could have understood
    it without Marvel. Let’s see how it goes. Jump right away to the script.


    ```bash

    [aka@localhost ~]$ #!/bin/sh

    [aka@localhost ~]$ for str in earth sun mars moon saturn;

    do

    echo $str

    done

    earthsunmarsmoonsaturn[aka@localhost ~]$

    ```


    In the above, you can notice that the above script is a combination of different
    words. While some may seem familiar to you, others are difficult to interpret.
    Out of the above `for`, `done`, `in`, and `do` are shell keywords. Let me explain
    in words how the loop works.


    There is a variable `str` in the above script. When you enter the above text in
    the shell window, the shell fills the variable with the value of the first of
    the space-delimited values that can be seen above after the shell keyword `in`.
    The first word here is `earth`. Then the shell executes the `echo` command. After
    that, the shell once again returns back to the `for` line to set fill in the variable
    with the next value that is in this case `sun`. It repeats the same exercise with
    the second value. The loop goes on until there is no value left written after
    the keyword `in`.


    The `for` command fills in the variable with whatever the next values are in the
    list. We can use the `str` variable like any other variable in shell scripting.
    When the last of the iterations are done, the `str` variable keeps the last value
    it was filled with. Here an interesting thing is that you can change that. Let’s
    see how to do that.


    ```bash

    $ cat testfile

    #!/bin/bash

    # testing the for variable after the looping

    for str in earth sun mars saturn

    do

    echo "The next planet is $str"

    done

    echo "The next planet to visit is $str"

    str=Uranus

    echo "We are going to $str"

    $ ./testfile

    The next state is earth

    The next state is sun

    The next state is mars

    The next state is saturn

    The next planet to visit is Uranus

    We are going to Uranus

    ```


    The `for` loop is always not that easy to use. Simple problems in the syntax can
    push you over the edge and you will land in utter darkness with no clue on what
    to do. Do you want to see an example? Let’s do that.


    ```bash

    $ cat testfile

    #!/bin/bash

    # example of the wrong use of the for command

    for test in I was pretty sure it’ll work but I don’t know what went wrong

    do

    echo "word:$str"

    done

    $ ./testfile

    word:I was pretty sure

    word:itll work but I dont

    word:know what went wrong

    ```


    The single quote marks did the damage in the above script. This kind of error
    really catches the programmer off-guard. To resolve the problem, you can use backslash
    or double quotation marks to properly define the values. Another problem is the
    use of multiword.


    ```bash

    [aka@localhost ~]$ #!/bin/bash

    [aka@localhost ~]$ #another wrong use of the for command

    [aka@localhost ~]$ for str in The Netherlands Australia The United States Of America
    Scotland The British

    do

    echo "I will visit $str"

    done

    I will visit The

    I will visit Netherlands

    I will visit Australia

    I will visit The

    I will visit United

    I will visit States

    I will visit Of

    I will visit America

    I will visit Scotland

    I will visit The

    I will visit British

    ```


    Now let’s see how to do it right by making use of the double quotation marks in
    the script. You will be astonished to see how simple it is to rectify it.


    ```bash

    [aka@localhost ~]$ #!/bin/bash

    [aka@localhost ~]$ #How to do it right

    [aka@localhost ~]$ for str in "The Netherlands" Australia "The United States Of
    America" Scotland "The British"; do echo "I will visit $str"; done

    I will visit The Netherlands

    I will visit Australia

    I will visit The United States Of America

    I will visit Scotland

    I will visit The British

    ```


    ## How about reading a list with the help of a variable?


    Suppose you have a list of values that are stored in a variable. You can use the
    `for` command to iterate through the list.


    ```bash

    [akalocalhost ~]$ #!/bin/bash

    [aka@localhost ~]$ #we will use the for command to deal with the list

    [aka@localhost ~]$ list="Hands Face Hair Feet Limbs Elbows"

    [aka@localhost ~]$ list=$list"neck"

    [aka@localhost ~]$ for parts in $list

    do

    echo "I have washed my $list"

    done

    I have washed my Hands

    I have washed my Face

    I have washed my Hair

    I have washed my Feet

    I have washed my Limbs

    I have washed my Elbows

    I have washed my neck

    ```


    ## The While Loop


    There is another loop named as the `while` loop. Let’s look at the syntax of the
    bash `while` loop.


    ```bash

    [aka@localhost ~]# while [fill the condition in the brackets]

    do

    sample commandx

    sample commandy

    sample commandz

    ```

    '
