    大多数 Linux 发行版属于这两个主要阵营，但软件包系统并不限于此二者。还有一些重要的例外，比如 Slackware 和 Gentoo。Ubuntu、Linspire
    和 Debian 使用 `(.deb)` 阵营。Mandriva、Fedora、Red Hat Enterprise Linux 和 PCLinuxOS 使用
    `(.rpm)` 阵营。


    ## 工作原理

    通常，软件是从市场上购买然后从磁盘安装的。你运行安装向导，并在系统上获取该程序。这是 `Windows` 上的上的标准流程。Linux 则不同。你不需要购买任何东西，因为几乎所有的软件都可以在网上免费找到。发行版供应商提供编译并封装在包文件中的代码，或者以源代码的形式提供，由你进行手动安装。后者需要专业级的技能。


    软件包文件可以被视为 Linux 软件的基本单元。它可以被进一步拆解为一组文件，这些文件共同构成了软件包。一个更深入的问题是，软件包里包含什么？除了包含显示文件文本描述和内容的元数据外，它还包含多个程序。有专门的软件包维护者来创建软件包文件。这些维护者可能是
    Linux 系统发行商的员工，但并不总是如此。软件包维护者接收软件源代码，并生成元数据和安装脚本。他们可以选择对源代码进行贡献，也可以保持其接收时的状态。


    ## 仓库

    发行版供应商承担了创建这些软件包的大部分工作。当它们准备好后，供应商或创建它们的任何第三方会将它们放在中央仓库中。中央仓库就像软件包文件的矿藏。仓库中的软件包文件是专门为该发行版创建的。


    一个 Linux 发行版中可能存在多个仓库。让我们来看几个：


    *   测试仓库 (Testing repository)：此仓库充满了软件包，通常由练的 Linux 用户使用，他们希望在软件包到达普通用户手中之前测试其中的漏洞。

    *   开发仓库 (Development repository)：另一个仓库是开发仓库，包含了正在开发中的软件包，并将很快包含在发行版的下一个版本中。

    *   第三方仓库 (Third party repository)：嗯，它就是这么命。这个仓库包含了由第三方创建、但由于法律限制无法成为发行版主要版本部分的软件包。某些软件专利法律较为宽松的国家允许
    Linux 发行版发布第三方仓库。尽管它们可以包含在发行版的发布中，但它们并不是发行版的一部分，必须手动在配置文件中。


    ## 依赖关系

    Linux 程序需要多个软件组件的支持才能高效工作。某些软件包需要共享源来完成工作。这种共享源（如共享库）被称为软件包文件的依赖项。因此，大多数 Linux
    发行版系统也会包中包含它们的依赖项，以确保软件运行顺利。


    ## 管理软件包的工具

    通常有两种类型的软件包管理工具：


    *   低级工具用于处理基本任务，如在系统上安装和卸载软件包文件。

    *   高级工具用于执行元数据搜索并解决依赖问题。


    让我们来看 Linux 发行版系统自带的一些常用工具。


    ### 低级工具

    `dpkg` 被认为是 Debian 风格的低级工具，而 `rpm` 是 Red Hat Enterprise、CentOS 和 Fedora 的低级工具。


    ### 高级工具

    `aptitude` 和 `apt-get` 是 Debian 风格的一些高级工具，而 `yum` 被认为是 Red Hat Enterprise、CentOS
    和 Fedora 的高级工具。你可以使用这些工具完成不同的关键任务，例如从仓库中定位特定的软件包。


    ### 你可以安装软件包

    你可以使用以下命令安装 Debian 风格的软件包。


    *   `apt-get install package_name`

    *   `apt-get update`


    对于 Red Hat 风格，使用以下命令。


    *   `yum install package_name`


    此外，你也可以直接从特定的软件包文件安装软件包。让我们看看如何操作。这适用于不属于仓库且直接安装的软件包文件。来看命令：

    对于 Debian 风格的用户，使用以下命令：


    ```

    dpkg –install package_file

    ```


    对于 Red Hat 风格的用户，使用以下命令：


    ```

    rpm -i package_file

    ```


    你也可以使用这些简单工具从系统中删除特定的软件包。让我们来看命令：

    对于 Debian 风格的用户，以下命令工具是最好的：


    ```

    apt-get remove package-name

    ```


    对于 Red Hat 风格的用户，以下命令工具非常有效：


    ```

    yum erase package-name

    ```


    借助命令行工具的帮助，你可以进行更多操作。假设你安装了一个软件包系统，现在想更新它。你可以使用以下工具来实现。与上述提到的任务一样，Debian 和 Red
    Hat 的工具是不同的，更新工具也是如此。


    *   对于 Debian 风格的用户，更新软件包系统的命令行工具是 `apt-get update`。你也可以将 `update` 替换为 `upgrade`。两者的作用相同。

    *   Red Hat 风格的用户可以使用命令 `yum update`。


    如果你从非仓库源下载了软件包的更新版本，可以通过替换旧版本来安装它。完成此任务的命令如下：


    *   Debian 风格的用户应该输入 `dpkg –install package-file`。

    *   Red Hat 风格的用户应该输入 `rpm -U package-file`。


    将 `package-file` 替换为你想要更新的文件名。当你在一段时间内安装了多个软件包，并想以列表的形式查看它们时，可以使用以下工具查看记录。


    *   对于 Debian 风格的用户，`dpkg --list` 是查看列表的工具。

    *   对于 Red Hat 风格的用户，应该输入 `rpm -qa`。


    当你安装了一个软件包后，可以随时检查它的状态以确保它存在于你的 Linux 操作系统上。有一些方便的工具用于此目的。让我们来看看。


    *   Debian 风格的用户应该输入 `type dpkg --status package-name`。

    *   Red Hat 风格的用户可以使用 `rpm -q package-name`。


    除了检查已安装软件包的状态外，你还可以通过以下命令探索它的更多信息：


    *   Debian 风格的用户可以输入 `apt-cache show package-name`。

    *   Red Hat 风格的用户可以输入 `yum info package-name`。

    '
