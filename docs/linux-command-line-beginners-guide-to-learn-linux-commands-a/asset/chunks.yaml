    如果双括号内的命令匹配 `$USER` 变量，并发现它以字母 `r` 开头（在本例中是 `rae`），那么 shell 显然会执行脚本的 `then` 部分。


    # 循环


    Sylvia 恰好是一个漫威粉丝。她从不错过任何一部电影。她最喜欢的角色之一是奇异博士，一位偶然变成魔法师。嗯，我不喜欢这些奇幻东西，但我之所以提到它，是因为有一天，Sylvia
    一边用口述、一边用手势描述了其中某部电影中的场景——场景中他利用魔法制造了一个时间循环来击败反派多洛马姆（Dormamu）。我喜欢这个故事是因为它很生动。Sylvia
    更喜欢它是因为她将其与 Linux 中的循环联系在一起。奇异博士将多洛马姆困在一个时间循环中，多洛马姆必须留在那里直到他同意与奇异博士达成交易。一遍又一遍。奇异博士出现并由于不断重复的时间循环被多洛马姆杀死。Sylvia
    将这两个循环联系起来，并成功地将这个教训记脑子里。这是一个很聪明的想法，尽管没有漫威她也能理解。让我们看看效果如何。直接跳转到脚本。


    ```bash

    [aka@localhost ~]$ #!/bin/sh

    [aka@localhost ~]$ for str in earth sun mars moon saturn;

    do

    echo $str

    done

    earthsunmarsmoonsaturn[aka@localhost ~]$

    ```


    在上面的脚本中，你可以注意到它是不同单词的组合。虽然有些对你来说很熟悉，但另一些很难解释。在上述内容中，`for`、`done`、`in` 和 `do` 是
    shell 关键字。让我用语言解释一下循环是如何工作的。


    上面的脚本中有一个变量 `str`。当你在 shell 窗口中输入上述文本时，shell 会用 shell 关键字 `in` 之后看到的第一个空格分隔的值来填充该变量。这里的第一个单词是
    `earth`。然后，shell 执行 `echo` 命令。之后，shell 再次返回到 `for` 行，用下一个值填充变量（在本例中是 `sun`）。它对第二个值重复相同的操作。循环会一直进行，直到关键字
    `in` 之后没有剩余的值可以写为止。


    `for` 命令用列表中的下一个值填充变量。我们可以像使用 shell 脚本中的任何其他变量一样使用 `str` 变量。当最后的迭代完成后，`str` 变量将保留它最后被填充的值。这里有一个趣点是，你可以改变它。让我们看看怎么做。


    ```bash

    $ cat testfile

    #!/bin/bash

    # testing the for variable after the looping

    for str in earth sun mars saturn

    do

    echo "The next planet is $str"

    done

    echo "The next planet to visit is $str"

    str=Uranus

    echo "We are going to $str"

    $ ./testfile

    The next state is earth

    The next state is sun

    The next state is mars

    The next state is saturn

    The next planet to visit is Uranus

    We are going to Uranus

    ```


    `for` 循环并不总是那么容易使用。语法上的简单问题就可能让你崩溃，你将陷入一片漆黑，完全不知道该怎么办。你想看个例子吗？让我们来做吧。


    ```bash

    $ cat testfile

    #!/bin/bash

    # example of the wrong use of the for command

    for test in I was pretty sure it’ll work but I don’t know what went wrong

    do

    echo "word:$str"

    done

    $ ./testfile

    word:I was pretty sure

    word:itll work but I dont

    word:know what went wrong

    ```


    在上面的脚本中，单引号造成了破坏。这种错误真的会让程序员措手不及。要解决这个问题，你可以使用反斜杠或双引号来正确定义值。另一个问题是多单词的使用。


    ```bash

    [aka@localhost ~]$ #!/bin/bash

    [aka@localhost ~]$ #another wrong use of the for command

    [aka@localhost ~]$ for str in The Netherlands Australia The United States Of America
    Scotland The British

    do

    echo "I will visit $str"

    done

    I will visit The

    I will visit Netherlands

    I will visit Australia

    I will visit The

    I will visit United

    I will visit States

    I will visit Of

    I will visit America

    I will visit Scotland

    I will visit The

    I will visit British

    ```


    现在让我们看看如何通过在脚本双引号来正确操作。你将惊讶于纠正它是多么简单。


    ```bash

    [aka@localhost ~]$ #!/bin/bash

    [aka@localhost ~]$ #How to do it right

    [aka@localhost ~]$ for str in "The Netherlands" Australia "The United States Of
    America" Scotland "The British"; do echo "I will visit $str"; done

    I will visit The Netherlands

    I will visit Australia

    I will visit The United States Of America

    I will visit Scotland

    I will visit The British

    ```


