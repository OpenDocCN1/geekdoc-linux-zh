    \ you can enter the `echo` command to display different elements of your menu.\
    \ You can add newline characters and the tab with the help of `-e` command. The\
    \ command line by default displays only printable characters.\n\n```bash\nclear\n\
    echo\necho -e \"\\t\\t\\tWelcome to the Admin Menu\\n\"\necho -e \"\\t1\\. Her\
    \ will be displayed the disk space\"\necho -e \"\\t2\\. Here will be displayed\
    \ the logged on users\"\necho -e \"\\t3\\. Here will be displayed the memory usage\"\
    \necho -e \"\\t0\\. Exit\\n\\n\"\necho -en \"\\t\\tEnter your option: \"\n```\n\
    \nWith the `-en` option in the last line, there will be no newline character in\
    \ the end of the display. This will allow the users to enter their input. You\
    \ can retrieve and read the input left by the customer with the help of the following\
    \ command.\n\n```bash\nread -n 1 option\n```\n\nYou can assign functions to the\
