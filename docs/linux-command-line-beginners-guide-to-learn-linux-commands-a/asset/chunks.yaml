    usr]$ cd/ usr/lib


    [aka@localhost lib]$Let’s do this in a shorter and faster way. Do you remember
    what single dot was supposed to do?[aka@localhost usr]$ cd./bin


    [aka@localhost lib]$Sylvia just hated the dots. She always put doubles where she
    had to insert the single and single where a double was needed. One day, when I
    was taking a quick walk by her office, I dropped in and found her messed up with
    these simple commands. A friend in need is a friend indeed. I told her a magic
    formula for switching from parent directory to the working directory. Let’s try
    that.[aka@localhost usr]$ cd bin


    [aka@localhost bin]$Not only are the dots omitted but also the slashes.A trick
    of the trade: cd is an abbreviation of current and directory. If you try out just
    the cd command, it will bounce you back to the directory in which you first started
