    # How to Pass Parameters to a Shell Function

    Functions can use the standard parameter environment variables for the representation
    of any parameters which are passed on to the function on the CLI. `$0` variable
    is used to represent the definition of the function. Other parameters as `$1`,
    `$2,$3` and so on are used to define the parameters on the command line. There
    also is a special variable `$#` in order to determine the total number of parameters
    on the command line. The parameters should be written on the same command line
    on which you are writing the function.


    ```bash

    cat testfile

    #!/bin/bash

    # how to pass parameters to a function

    function addem {

    if [ $# -eq 0 ] || [ $# -gt 2 ]

    then

    echo -1

    elif [ $# -eq 1 ]

    then

    echo $[ $1 + $1 ]

    else

    echo $[ $1 + $2 ]

    fi

    }

    echo -n "Adding 20 and 30: "

    value=`addem 20 30`

    echo $value

    echo -n "Shall we try to add only one number: "

    value=`addem 20`

    echo $value

    echo -n "This time try to add no numbers: "

    value=`addem`

    echo $value

    echo -n "Let’s add three numbers this time: "

    value=`addem 20 30 40`

    echo $value

