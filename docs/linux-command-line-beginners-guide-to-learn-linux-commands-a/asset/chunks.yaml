    is displayed on the screen. You can also add text messages to let the user know
    what is going on in the script. The echo command does the wonder for you. It can
    show the string of simple text on the screen.[aka@localhost ~]$ echo I hope you
    are writing the code in the right way.


    I hope you are writing the code in the right way.


    [aka@localhost ~]$Now let’s try something exciting to see how it can go wrong
    and how to rectify what goes wrong.[aka@localhost ~]$ echo I''ll be happy if you
    don''t go for swimming.Ill be happy if you dont go for swimming.[aka@localhost
    ~]$ echo "I''ll be happy if you don''t go for swimming."I''ll be happy if you
    don''t go for swimming.[aka@localhost ~]$ echo ''John says "I''ll be happy if
    you don''t go for swimming."''John says "Ill be happy if you dont go for swimming."[aka@localhost
    ~]$The command went wrong, and the display was not what we had expected. So. We
    had to rectify it with the help of quotation marks.Shall I Execute it Now?It is
    time to execute the file you have just saved. Let’s run the command.[aka@localhost
    ~]$ azure_skybash: azure_sky: command not found$You have to guide the bash shell
    in locating your shell script file.[aka@localhost ~]$ 1s -1 azure_sky


    -rw-r—r—1 me​ me​ 63 2019-08-26 03:17 azure_sky


    [aka@localhost ~]$ chmod 755 azure_sky


    [aka@localhost ~]$ 1s -1 azure_sky


    rwxr-xr-x 1 me me​ 63 2019-08-26 03:17 azure_skyBut how will the command line
    find the script that you have just written? The script should have an explicit
    path name. In case you fail to do that, you are likely to see the following:[aka@localhost
    ~]$ azure_sky


    bash: azurer_sky: command not foundYou must tell the command line the exact location
    of your script. Otherwise, you won’t be able to execute it. There are different
    directories in the Linux system, and all of them are in the PATH variable. I have
    already shown you how to see what directories are on the system, explore the PATH
    variable.[aka@localhost ~]$ echo $PATH/usr/local/sbin:/bin:/sbin:/usr/bin:/usr/sbin:/usr/local/bin:/home/rich/azuresky[aka@localhost
    ~]$Now that we have got the list of the directories you can see and put your script
    in the directory you want to. Follow the following steps to save your script in
    a specific directory.[aka@localhost ~]$ mkdir bin


    [aka@localhost ~]$ mv azure_sky bin


    [aka@localhost ~]$ azure_sky


    azure_skyIf your PATH variable misses the directory, you can add it by the following
    method:[aka@localhost ~]$ export PATH=~/bin:”$PATH”More ways to format scripts:
    The ultimate goal of a good script writer should be to write a good script and
    maintain it smoothly. You should be able to easily edit the script like adding
    more to a particular script or removing from it. Also, it should be formatted
    in a way that it should be easy to read as well as understand.Go for long option
    namesWe have seen many commands both with long and short options name. ls command
    that is used to list directories in your Linux system has lots of options such
    as the following:[aka@localhost ~]$ ls -ad[aka@localhost ~]$ ls –all --directoryBoth
    these commands are equivalent when it comes to the results. Users prefer short
    options for ease of use so that they may not have to remember long option names.
    Almost every option that I have stated in previous chapters has a long form. Though
    short form options are easy to remember, it is always recommended to go for the
    full names when it comes to script writing because it is more reader-friendly.IndentationNow
    long form commands are also not very easy to handle. You have to take care to
    write them in the right format so that it may confuse the reader. You can use
    commas between many lines.How to use Quotation Marks and LiteralsThis is quite
    technical. As a Linux user, you must know how and where to use quotation marks,
    commas and period. Why does a specific punctuation mark necessary for the script?
    Let us print the following string.[aka@localhost ~]$ echo $10000The output should
    have been 100, but it was instead a double zero. If you are thinking that the
    command line couldn’t understand the script and executed it what part it succeeded
    in comprehending, you are right. It got it all wrong. So, what should be done
    now? First, we need to understand why did it get it all wrong? Its reason is that
    the shell only saw 00\. It considered $1 as a shell variable. That’s what it is.
    You failed to make it easily readable. Perhaps you should add the quotation marks.
    Add them right away.[aka@localhost ~]$ echo “$100”00You are getting it wrong.
    Still you get the same result. Are you frustrated by now? We have a solution.[aka@localhost
    ~]$ echo ‘$100’'
