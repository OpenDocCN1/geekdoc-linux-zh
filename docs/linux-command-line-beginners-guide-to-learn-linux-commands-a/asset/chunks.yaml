    # The Case Statement


    The `case` statement is dissimilar to a loop. There is no such thing as repetition
    in the `case` command. You can test simple values such as integers as well as
    characters. In a `case` command, the `bash` shell analyzes the condition and accordingly
    manages the program flow. The `case` statement at first expands whatever expression
    you include in it and then it tries to match the same against the patterns that
    are included in the script. If it founds a match, all the statements ending up
    at the double semicolon (`;`) get executed by the shell. When it is done, the
    `case` stands terminated with the exit status that you had given to the last command.
    If the `case` command finds no match, the exit status stands at zero.


    ```bash

    $ cat testfile

    #!/bin/bash

    # using the case command

    case $USER in

    insylvia | john)

    echo "Welcome, $USER"

    echo "Have a nice time";;

    testing)

    echo "Special testing account";;

    adam)

    echo "Keep in mind to log off when you have finished the task";;

    *)

    echo "You cannot enter";;

    esac

    $ ./testfile

    Welcome, sylvia

    Have a nice time

    ```


    In the above script, we can clearly see that a variable is compared against different
    sets of patterns. If there is a match between the variable and the pattern, the
    related command is executed. The catch here is that the `case` command offers
    us a smoother way of integrating different options for a specific variable. Let’s
    write the same script using the `if-then` statement.


    ```bash

    $ cat testfile

    #!/bin/bash

    # looking for a possible value

    if [ $USER = "sylvia" ]

    then

    echo "Welcome $USER"

    echo "Have a nice time"

    elif [ $USER = john ]

    then

    echo "Welcome $USER"

    echo "Have a nice time"

    elif [ $USER = testing ]

    then

    echo "Special testing account"

    elif [ $USER = adam ]

    then

    echo " Keep in mind to log off when you have finished the task "

    else

    echo "You cannot enter"

    fi

    $ ./testfile

    Welcome sylvia

    Please enjoy your visit

    ```


    I hope you have understood by now the difference between both scripts. The `case`
    command just puts all the values in a single list form which the variable checks
    it for a match. You don’t have to write `elif` statements. The repetition is eliminated.


    So, what have we learned so far with different scripts? The above commands are
    also known as structured commands. We can alter the normal program flow in the
    shell script with the help of these commands. The most basic of these commands
    is the `if-then` statement. You can evaluate a command and move on to execute
    other commands on the basis of the result of the evaluated command.


    You have the option of connecting different `if-then` statements with the help
    of `elif` statement. The `elif` is the short of `else if` which means it is another
    `if-then` statement. The `case` command can be dubbed as the shortest route to
    achieving the same results as we have with the help of using lengthy `if-then`
    statements.


