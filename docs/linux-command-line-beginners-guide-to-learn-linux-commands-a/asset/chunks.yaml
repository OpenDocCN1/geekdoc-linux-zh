    ```bash

    cat libfile

    # 使用 shell 函数创建库文件

    function addem {

    echo $[ $2 + $3 ]

    }

    function multem {

    echo $[ $5 * $2 ]

    }

    function divem {

    if [ $2 -ne 0 ]

