    # 第 5 章：Linux 环境变量


    在谈到 `bash` 壳时，了解它的特性（如环境变量）是非常重要的。这些变量对于存储特定 shell 会话的信息以及你一直工作的环境非常有用。通过这些变量，你可以将信息馈入内存中，并通过运行脚本或简单地运行程序来访问这些信息。


    ## 全局变量


    这很容易学习。这些是可以在全局访问的变量。简单来说，你可以在程序的任何阶段访问它们。当你声明一个变量时，在你运行程序时，它会被馈入系统内存。你可以在任何函数中进行更改，这些更改可能会影响整个程序。全局变量始终以大写字母显示。


    ```

    [aka@localhost ~]$ printenv

    ```


    你已经有了一份全局环境变量的完整列表。其中大多数是在登录过程中设置的。如果你想跟踪单个变量的值，可以使用 `echo` 命令来实现。只需忘记在变量前添加 `$`
    符号以获取其值即可。让我们来看语法。


    ```

    [aka@localhost ~]$ echo $PWD/root

    ```


    ## 局部环境变量


    这些变量只能在本地进程中可见。全局环境变量和局部环境变量具有同等的价值。获取局部环境变量列表很困难，因为你不能仅仅为了此目的运行单个命令。`set` 命令显示了为特定目的设置的环境变量。


    ```

    [aka@localhost ~]$ set

    BASH=/bin/bash

    BASHOPTS=checkwinsize:cmdhist:complete_fullquote:expand_aliases:extquote:force_fignore:histappend:hostcomplete:interactive_comments:progcomp:promptvars:sourcepath

    BASASHCSOURCED=Y

    BASH_ALIASES=()

    BASH_ARGC=()

    BASH_ARGV=()

    BASH_CMDS=()

    BASH_LINENO=()

    BASH_SOURCE=()

    BASH_VERSINFO=([0]="4" [1]="4" [2]="23" [3]="1" [4]="release" [5]="riscv64-koji-linux-gnu")

    BASH_VERSION=''4.4.23(1)-release''

    COLUMNS=80

    CVS_RSH=ssh

    DIRSTACK=()

    EUID=0

    GROUPS=()

    HISTCONTROL=ignoredups

    HISTFILE=/root/.bash_history

    HISTFILESIZE=1000

    HISTSIZE=1000

    HOME=/root

    HOSTNAME=localhost

    HOSTTYPE=riscv64

    IFS=$'' \t\n''

    LANG=en_US.UTF-8

    LESSOPEN=''||/usr/bin/lesspipe.sh %s''

    LINES=30

    ```


    请考虑到所有的全局变量也包含在 `set` 命令的详情中。


    ### 你可以设置自己的局部环境变量


    你可以在 `bash` 壳中设置你自己的变量。你可以使用等号给变量赋值。


    ```

    [aka@localhost ~]$ test=world

    [aka@localhost ~]$ echo $test

    world

    ```


    上面的示例适用于分配简单值。为了分配一个单词间带有空格的字符串值，你需要尝试不同的方法。请注意，你必须使用小写字母来创建新变量。这很重要，因为看到大写字母的环境变量可能会令你感到困惑。让我们来看以下语法：


    ```

    [aka@localhost ~]$ test=theskyisazure

    [aka@localhost ~]$ echo $test

    theskyisazure

    [aka@localhost ~]$ test=the sky is azure

    bash: sky: command not found

    [aka@localhost ~]$ test=''the sky is azure''

    [aka@localhost ~]$ echo $test

    the sky is azure

    ```


    你可以看到，区别在于单引号的使用。


    ### 如何移除环境变量


    你可以通过一个简单的步骤移除变量。让我们看看 `unset` 命令的语法。


    ```

    [aka@localhost ~]$ echo $test

    theskyisazure

    [aka@localhost ~]$ unset

    [aka@localhost ~]$ echo $test

    ```


    如果你从子进程移除变量，它仍然留在父进程中。你需要单独从父进程中删除。


    ```

    [aka@localhost ~]$ test=azure

    [aka@localhost ~]$ export test

    [aka@localhost ~]$ bash

    [aka@localhost ~]$ echo $test

    azure

    [aka@localhost ~]$ unset test

    [aka@localhost ~]$ echo $test

    [aka@localhost ~]$ exit

    [aka@localhost ~]$ echo $test

    azure

    ```


    你可以清楚地看到环境变量首先被导出以便其成为全局变量。`unset` 命令是在我仍在子进程时应用的。当我切换到父壳时，命令仍然有效。这就是为什么你需要在父壳中也删除。


    ### 查看默认壳变量


    `bash` 壳包含了源自壳本身的环境变量。让我们检查一些变量。


    ```

    [aka@localhost ~]$ echo $PATH

    /usr/local/sbin:/bin:/sbin:/usr/bin:/usr/sbin:/usr/local/bin

    ```


    你可以在此命令中看到不同的目录。 shell 在这些目录中查找命令。只需通过插入冒号然后添加目录即可向命令添加更多目录。变量被分配了默认值。让我们来看下表。


    - `PATH`: 如我向你展示的，它带有目录列表。

    - `HOME`: 这指向用户的家目录。

    - `IFS`: 这带来了字符列表。

    - `CDPATH`: 你将获得一个由冒号分隔的目录列表。


    ### PATH 变量的重要性


    这可能是 Linux 系统中最重要的变量，因为它引导 shell 在你于命令行输入后立即定位用于执行的命令。如果未能找到，将显示错误消息，其看起来类似于下面给出的那个：


    ```

    [aka@localhost ~]$ newfile-bash

    bash: newfile: command not found

    ```

    '
- fmt: "\n`PATH` is an environmental variable in the Linux operating system. It becomes\
    \ active as you enter a command or a shell script. A shell script is just like\
    \ a mini program that offers text-only user interface for the users of Unix-like\
    \ systems. It can read commands and then execute them accordingly. It is important\
    \ to consider here that `PATH` with all capitals must not be replaced with a path\
    \ with all the lower-case letters. \n\nThe path variable is a completely different\
    \ thing as it is the address of a directory. Relative path alludes to the address\
    \ in relation to the directory you are currently in. There also is an absolute\
    \ path as already discussed, which is the address in relation to the root directory.\
    \ On the other hand, the `PATH` will turn out a series of paths distinguished\
    \ by colons and stored in the form of plain text files. For revision and explanation\
    \ purposes let’s take a look at how it is executed.\n\n```bash\n[aka@localhost\
    \ ~]$ echo $PATH\n/usr/local/sbin:/bin:/sbin:/usr/bin:/usr/sbin:/usr/local/bin\n\
    ```\nYou can add new directories to this string. Let’s try it.\n\n```bash\n[aka@localhost\
    \ ~]$ echo $PATH\n/usr/local/sbin:/bin:/sbin:/usr/bin:/usr/sbin:/usr/local/bin\n\
    [aka@localhost ~]$ PATH=$PATH:/home/rich/azuresky\n[root@localhost ~]# echo $PATH\n\
    /usr/local/sbin:/bin:/sbin:/usr/bin:/usr/sbin:/usr/local/bin:/home/rich/azuresky\n\
    ```\n\nIt is important to mention that each user in the Linux operating system\
    \ has a different `PATH` variable than others. Upon installation of an operating\
    \ system, a default variable for your `PATH` is set. After that, you can add more\
    \ to it or completely change as it suits you.\n\n**Note:** It is important to\
    \ mention that the root user’s `PATH` variable has more directories than any other\
    \ user. An interesting thing about the `PATH` variable is that either you can\
    \ change it just for the current session or on a permanent basis.\n\n## How to\
    \ find Environment Variables of the Linux System\nThere are multiple variables\
    \ that a system uses for identification purpose in the shell scripts. With the\
    \ help of system variables, you can easily procure important information for the\
    \ programs. There are different startup methods in the Linux system, and in each\
    \ system, the bash shell executes the startup files in a different way.\n\n###\
    \ The Login Shell\nThis locates four distinct startup files from where it could\
    \ process its commands. The very first file that is executed is the `/etc/profile`.\
    \ You can dub it as the default file for the bash shell. Each you time you log\
    \ in, this command will be executed.\n\n```bash\n[aka@localhost ~]# cat /etc/profile\n\
    # /etc/profile\n```\nI have run this command while logged in as a superuser. The\
    \ result on your window can be slightly different. Just take a look at the `export`\
    \ command stated as under:\n\n```bash\nexport PATH USER LOGNAME MAIL HOSTNAME\
    \ HISTSIZE HISTCONTROL\n```\nYou can clearly see that the `export` command ensures\
    \ that the variables remain accessible to the child processes.\n\n### The $HOME\n\
    This one is a user-specific variable. Let’s run it to know what it has got.\n\n\
    ```bash\n[aka@localhost ~]# cat .bash_profile\n# .bash_profile\n# Get the aliases\
    \ and functions\nif [ -f ~/.bashrc ]; then\n. ~/.bashrc\nfi\n# User specific environment\
    \ and startup programs\nPATH=$PATH:$HOME/bin\nexport PATH\n```\n\n### Interactive\
    \ Shell\nIf you happen to start the bash shell without first logging into the\
    \ system, you kickstart the interactive shell. You have the command line to enter\
    \ command here. With the start from an interactive shell, the system does not\
    \ load the `/etc/profile` file. It locates another file called `.bashrc` in the\
    \ home directory of the user. Let’s see how this startup file looks in the Linux\
    \ operating system.\n\n```bash\n[aka@localhost ~]# cat .bashrc\n```\nIt conducts\
    \ a couple of key tasks; first is checking for the `bashrc` file in the `/etc`\
    \ directory. The second one is to allow the user to enter aliases.\n\n```bash\n\
    [aka@localhost ~]$ cat /etc/bashrc\n```\n\n### Variable Arrays\nYou can use variables\
    \ as arrays. The fun thing with arrays is their capacity to hold multiple values\
