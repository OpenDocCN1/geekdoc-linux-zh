    # Storage Media


    We know about hard disk drives, floppy disks, and CD drives from the Windows operating
    system. If you think Windows makes it easy for you to handle them, Linux has more
    to offer. You can handle all the storage devices like the hard disk drive, the
    virtual storage such as the RAID, the network storage, and Logical Volume Manager
    (LVM). I’ll explain some key commands that you can use to handle all the storage
    devices easily as well as efficiently.


    ## The commands for mounting and dismounting storage devices


    You can mount and dismount a storage device with the help of some simple commands.
    If you are using a non-desktop system, you will have to do that manually owing
    to the fact that servers have some complex requirements for system configuration.


    There are some steps involved to accomplish the objective like linking the storage
    device with the filesystem tree. Programmers call it mounting. After this, the
    storage device starts participating in the functions of the operating system.
    We have already learned about the filesystem tree earlier on. All the storage
    devices are connected to the filesystem tree. This is where it differs from the
    Windows system, which has separate trees for each device. As an example, see the
    `C:\` and `D:\` drives. You can explore the list of the devices with the help
    of the command `/etc/fstab`.


    If you want to view the list of the filesystems that you already have mounted
    on the Linux computer system, we call it the `mount` command. By entering it on
    the command line, you will get the list of the mounted filesystems.


    ```

    [aka@localhost ~]$ mount

    ```


    The listing will show the mount-point type as well as the filesystem-type.


    ## You determine names of the devices


    Although determining names of the devices is considered as a difficult task to
    do, yet there are some easy ways to master it. To make out the names of the devices,
    we have to first list the devices on the Linux operating system.


    ```

    [aka@localhost ~]$ ls /dev

    ```


    Let’s analyze the names of different devices:


    - `/dev/hd*`: These are PATA disks on the older systems. The typical motherboards
    have a couple of IDE connectors. Each of the IDEs had a cable and a couple of
    points for drives to get attached to them. The first drive is dubbed as the master
    drive while the other one is named as the slave drive. You can find them by referring
    them as `/dev/hda` for the master drive and as `/dev/hdb` for the slave drive.
    These names are given to the drives in the first channel. For the second channel,
    you can refer the master drive as `/dev/hdc` and the list goes on. If you see
    a digit at the end of the titles, remember that it refers to the partition. To
    quote an example, `/dev/hda1` will be considered as the 1st partition on the first
    hard drive. In this scenario where you have partitions, the name `/dev/hda` will
    refer to the full drive.

    - `/dev/fd*`: This name refers to the floppy disk drives.

    - `/dev/sd*`: This refers to the SCSI disks, which includes all PATA and SATA
    hard disk drives, the flash drives, the USB mass storage drives like the portable
    music players and the ports to connect digital cameras.


    ## How to create new filesystems?


    On Linux, you have the freedom to create new filesystems. Suppose you want to
    reformat the flash drive with the help of a Linux native filesystem instead of
    the FAT32 system. You can do that by following two simple steps:


    1. You can create a fresh layout for a new partition if you don’t like the current
    partition.

    2. Secondly, you can create a new, but empty, filesystem.


    This command will format your current hard disk partitions so remember to use
    it on a spare disk and not on the one that stores your important data. A single
    mistake in the name of the drive can result in erasing data on the wrong drive.


    You can use the `fdisk` program to interact with the hard disk drive and other
    flash drives on your Linux computer system. The `fdisk` program allows you to
    edit, create or delete partitions on one particular device. In this case, I’ll
    be dealing with the flash drive.


    ```

    [aka@localhost ~]$ sudo umount /dev/sdb1

    [aka@localhost ~]$ sudo fdisk /dev/sdb

    ```


    The first command will unmount the flash drive and with the second command you
    can invoke the `fdisk` program. The following will appear on the screen:


    `Command (m for help):`


    When you see that on the screen, enter `m` on the keyboard which will display
    a menu that will prompt a command action from the user. By pressing `b`, you can
    edit the disk. By pressing `d`, you can delete a particular partition of the device.
    In this particular case, we are into the flash drive so the `d` key will delete
    a partition from the flash drive. You can press `l` to list the partitions that
    are not yet known. You can print the menu again any time by pressing `m`. Also,
    you can add a new partition to the device by pressing `n`. By pressing `q`, you
    can quit the menu without saving the necessary changes and by pressing `t`, you
    can change the system id of a partition.


    First of all, you are required to see the layout for a particular partition. Press
    `p` to see the partition table for the flash drive device.


    Now suppose we have a dummy storage device of 32 MB having one partition, and
    this device can be identified as Windows 95 FAT32. From the menu, you can see
    that there is an option for listing the known partition types when you press `l`.
    Now you can see all the possible types. It is pertinent to mention here that the
    `b` in the `sdb` refers to the partition id. In the list, you can recognize your
    partition with the help of the system id `b`. You can change the system id for
    your particular partition by entering `t` on the command line. The changes have
    been stored on the system until now. Remember that you have not touched the device
    as of now. Now enter `w` to modify the partition table to the device and make
    an exit. You have successfully altered the partition. If at any time you decide
    to leave the partition without altering it, press `q` and exit the command line.


    Now that you have learned to edit the flash drive device partition, we should
    move on to create a new filesystem with the help of `mkfs` command. Read it as
    make filesystem. An interesting thing is that you can create filesystems in multiple
    formats.


    If you want to create ext3, add `-t` option to the command `mkfs`. Let’s see the
    syntax for the command.


    ```

    [aka@localhost ~]$ sudo mkfs -t ext3 /dev/sdb1

    ```

    '
