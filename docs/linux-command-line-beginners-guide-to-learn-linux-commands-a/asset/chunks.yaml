    `(hd0) (h0,msdos1)` 结果将是 GRUB 已知设备的设备列表。你可以看到只有一个磁盘 `hd0` 和一个分区 `(hd0,msdos1)`。我们从这处可以获得的信息是，该磁盘包含一个
    MBR 分 分区表。


    要深入了解更多信息，请在 GRUB 命令行中输入 `ls -1`。

    ```

    grub> ls -1

    ```

    此命令告诉我们更多关于磁盘上分区的信息。你可以轻松地在 GRUB 系统中导航文件。让我们来看看它的文件系统导航。首先，你需要找到 GRUB 的根目录。


    ```

    grub> echo $root

    hd0,msdos1

    ```


    你应该使用 `ls` 命令来列出根目录下的所有文件和目录。让我们看看如何操作。


    ```

    grub> ls ($root)/

    ```

    你可能会看到该特定分区上的目录名称列表。文件系统和目录可能会以 `etc/`、`bin/` 和 `dev/` 的形式列出。


    ## 如何配置 GRUB


    配置目录有一个名为 `grub.cfg` 的中心文件。此外，加载到系统上的多个模块也是配置系统的一部分。这些模块的命名为 `.mod`。这应该是配置系统的开始。


    ### BEGIN /etc/grub.d/00_header ###


    `/etc/grub.d` 目录下的所有文件都是多个 shell 脚本程序。通过组合，它们构成了 `grub.cfg` 中心配置文件。这是 GRUB 配置的默认结构。


    现在让我们转向允许你更改命令的功能。简短的回答是，你可以轻松地做到。你可以根据需要进行自定义。你知道存在一个中心配置文件。你只需要为了自定义而创建另一个文件。你可以将文件命名为
    `customized.cfg`。这将被添加到 GRUB 的配置目录中。你可以在以下路径找到它：`/boot/grub/custom.cfg`。


    关于自定义有两个选项。可以通过 `/etc/grub.d` 访问配置目录。该目录提供了 `40_custom` 和 `41_custom`。`40_custom`
    可以在没有任何帮助的情况下由自行编辑，但它容易薄弱且不稳定。另一个 `41_custom` 比前一个简单得多。该文件包含一组命令，在 GRUB 启动时准备好加载。一个小例子是
    Linux 发行版 Ubuntu 允许用户通过添加内存测试器选项（`memtest86+`）来编辑配置设置。


    如果你想编写一个全新的配置并将其安装到系统上，可以通过使用 `-o` 选项将配置写入目录来实现。让我们来看看用于完成配置过程的语法。


    ```

    grub-mkconfig -o /boot/grub/grub.cfg

    ```


    对于 Ubuntu Linux 发行版系统的用户来说，事情非常简单容易。你只需要运行以下命令。

    ```

    install-grub

    ```


    ## 如何安装 GRUB


    在继续操作安装程序之前，请阅读此引导加载程序对安装目的的要求。请确定以下几点：


    *   当前系统看到的 GRUB 目录应该被正确分析。通常 `/boot/grub` 是该目录的名称。如果你在另一个系统上安装 GRUB，该名称可以是其他的。

    *   你必须确定 GRUB 目标磁盘使用的是什么设备。


    由于 GRUB 是一个模块化系统，它需要读取包含在 GRUB 目录目录的文件系统。


    ```

    grub-install /dev/sda

    ```

    在此命令中，`grub-install` 是用于安装 GRUB 的命令，`/dev/sda` 是我正在使用的当前硬盘。如果你做错了，这可能会给你带来很多问题，因为它具有更改系统启动顺序的能力。这增加了该命令的重要性。如果在此过程中真的发生了任何错误，你需要一个紧急启动计划。


    ### 在外部设备上安装 GRUB


    你也可以将 GRUB 安装在外部设备上。你必须先指定它将要安装的目录。例如，如果你的系统上有 `/dev/sda`。你的系统将在 `/mnt/boot/grub`
    中看到 GRUB 文件。你必须通过输入以下命令来引导系统。


    ```

    grub-install --boot-directory=/mnt/boot /dev/sda

    ```


    ## 让我们看看 GRUB 是如何工作的


    它由多个步骤组成。让我们一个一个来看。


    *   我们现在知道了 Linux 操作系统是如何启动的。BIOS 在启动时触发。当它对设备进行必要的检查后，它会初始化设备硬件。之后，它尝试追踪启动顺序以获取启动代码。

    *   当找到启动代码后，下一步是加载 BIOS 或固件。然后是它的执行。之后就是 GRUB 启动的时间。

    *   GRUB 开始在你的 Linux 操作系统上加载。

    *   首先，内核启动。现在 GRUB 处于更好的位置来访问你的硬盘和存储在系统上的文件系统。

    *   然后 GRUB 移动到识别它从中启动的分区。下一步是加载配置。

    *   现在，作为用户，如果你需要更改配置，这就是你有权更改的时候。

    *   如果你不想更改它，超时很快就会结束。现在 GRUB 将执行默认或更改后的配置。

    *   在尝试执行配置时，GRUB 会从它启动的分区中以模块的形式加载一些额外的代码。

    *   现在 GRUB 运行启动命令并执行内核。


    我与 Sylvia 分享我的周末日常活动。我是户外活动的热爱好者，比如在野外用弩箭进行狩猎。Sylvia 喜欢在崎岖和多丘的地形上骑自行车。当我们周末在一起时，我们非常非常享受。对她来说错过周末是很罕见的。但最后，她连续错过了不是一个而是三个周末。所以，我给她打电话想知道是怎么了。她回答说，她对
    Linux 有限的知识在办公室里并没有帮到她。她很担心，因为她急于完成工作，而大部分时间都在与学习过程挣扎。这次是用户空间和环境的问题。虽然学习并不困难，但在习惯它之前需要时间。


    我必须承认，Sylvia 花费的时间并不多。在正确的指导下，你可以像专业人士一样通过它。练习得越多，对它的理解就越深。用户空间指的是内核开始的地方。用户空间如何移动。让我们在以下步骤中查看：


    *   `init`

    *   启动低级服务，如 `udevd` 以及 `syslogd`

    *   配置网络。

    *   诸如打印等服务继续进行。

    *   接下来是登录 Shell、图形用户界面 (GUI)。

    *   其他你可能在 Linux 操作系统上安装的应用程序开始运行。


    '
