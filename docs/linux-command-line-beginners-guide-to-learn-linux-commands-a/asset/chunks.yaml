    The difference between systemd and init is the flexibility which the former has
    to offer to the user. The systemd just avoids unnecessary startup sequences.


    # The Linux Environment


    It was the fall. Yellowish red leaves were falling from the trees like the angels
    who were banished from the heavens. Pale and defeated, they rested on the pathway
    and the greenbelt along the road. An old woman with a cane in hand was trying
    to cross the road. Luckily, she got help from a young blondie lady who happened
    to be passing by. It was Sunday. The sun was far into the thick clouds that were
    hovering over the city’s skyscrapers, but it was balmy, the kind of weather you
    like to visit a beach. To the beach did I go. But wait a minute. Did I say something
    about the young blondie lady who was helping the lady? Oooops! That’s Sylvia.
    And yes, she did accompany me to the beach. “Lovely weather today? Mind a drink?”
    and she pulled out a bottle of peach pulp. “I don’t mind that.” I replied with
    a smile. “Well, well, well, finally I have started getting acquainted myself with
    Linux,” she started. I stared at her with a little frown that wasn’t matured yet
    on my face. “For God sake. We are on the weekend. If by a stroke of the ill fate,
    you have joined me on this beach, please don’t spoil the moment.” But she was
    unstoppable as are with newbie learners of Linux and programming languages.


    I gave in. She was curious about the Linux environment on that particular day.
    Well, the subject was a juicy one, so I went on trying to educate her more about
    it. By imaging about the environment of Linux, and the beach where I was out sunbathing,
    the image before your eyes might be something interesting. Perhaps your brain
    is trying to structure an analogy between the environment for Linux and the general
    environment that surrounds us.


    Let me explain. Yes, it is more or less the same. Just like we live in the environment;
    the shell window is also surrounded by an environment of its own. Whatever data
    that you store in the Linux environment is accessible to programs for the determination
    of facts about the configuration of the system. It is pertinent here to mention
    that the environment can be used to customize the shell experience. You can find
    the environment and shell variables in the environment. We will be using two commands
    to examine the environment; the `set` command and the `printenv` command. The
    latter command shows only the environment variables. I will not expand it here
    as you are going to see lots of it in the next chapter. So, let’s run the `set`
    command. In order to do away with a long list of variables and other info, I’ll
    pipe the output by pairing up the `set` command with the `less` command.


    ```

    [aka@localhost ~]$ set | less

    BASH=/bin/sh

    BASHOPTS=checkwinsize:cmdhist:complete_fullquote:expand_aliases:extquote:force_fignore:histappend:hostcomplete:interactive_comments:login_shell:progcomp:promptvars:sourcepath

    BASHRC

    SOURCED=Y

    BASH_ALIASES=()

    BASH_ARGC=()

    BASH_ARGV=()

    BASH_CMDS=()

    BASH_LINENO=()

    BASH_SOURCE=()

    BASH_VERSINFO=([0]="4" [1]="4" [2]="23" [3]="1" [4]="release" [5]="riscv64-koji-linux-gnu")

    BASH_VERSION=''4.4.23(1)-release''

    COLUMNS=80

    CVS_RSH=ssh

    DIRSTACK=()

    EUID=0

    GROUPS=()

    HISTCONTROL=ignoredups

    HISTFILE=/root/.bash_history

    HISTFILESIZE=1000

    HISTSIZE=1000

    HOME=/root

    HOSTNAME=localhost

    HOSTTYPE=riscv64

    IFS=''''

    LANG=en_US.UTF-8

    [aka@localhost ~]$

    ```


    The `set` command distinguishes itself from the rest of the lot by displaying
    the information in a near alphabetical order which is quite user-friendly. In
    addition, to that you can use the `echo` command to pull out information on the
    variable you need.


    ```

    [aka@localhost ~]$ echo $HOSTNAME

    localhost

    [aka@localhost ~]$ echo $HOSTTYPE

    riscv64

    [aka@localhost ~]$ echo $HOME

    root

    ```


    Moving on with the exploration of the shell environment I’ll test the `alias`
    command.


    ```

    [root@localhost ~]$ alias

    grep=''egrep --color=auto''

    fgrep=''fgrep --color=auto''

    grep=''grep --color=auto''

    l.=''ls -d .* --color=auto''

    ll=''ls -l --color=auto''

    ls=''ls --color=auto''

    mc=''. /usr/libexec/mc/mc-wrapper.sh''

    which=''(alias; declare -f) | /usr/bin/which --tty-only --read-alias --read-functions
    --show-tilde --show-dot''

    xzegrep=''xzegrep --color=auto''

    xzfgrep=''xzfgrep --color=auto''

    xzgrep=''xzgrep --color=auto''

    zegrep=''zegrep --color=auto''

    zfgrep=''zfgrep --color=auto''

    zgrep=''zgrep --color=auto''

    [aka@localhost ~]$

    ```


    Some of the other important variables include `HOME`, `LANG`, `SHELL`, `DISPLAY`,
    `PAGER` and `OLD_PWD`. Each has its own function like `HOME` leads you to the
    pathname of the home directory. `EDITOR` tells you about what kind of program
    you are using to edit the shell scripts. Similarly, `DISPLAY` shows the name of
    the display just in case you are running a graphical environment.


    Some additional variables that are interesting as well as very handy are `TZ`
    which is used to specify the timezone, `USER` which tells your username, `PS1`
    which explores the contents of the shell, and the `PWD` which explores the directory
    in which you are currently working.


    # Chapter 4: Package Management & Storage on Linux Systems


    When it comes to Linux distribution, most newbie or casual users are more concerned
    about the color schemes and different other unnecessary features when selecting
    which distribution best suits them. What they forget to take into consideration
    is the fact that the most important thing is the packaging system of Linux in
    combination with the support community of each distribution system. We know it
    is open source. The software is dynamic and not static like the Windows. It just
    keeps on changing by contributions from the community members.


    With the help of package management, we can install and maintain software on our
    personal computer systems. The following section will tell you about the tools
    to deals with package management. All these tools are linked to the command line.
    Some people may question if Linux distributors offer a graphical user interface
    why should we be forced into the command line yet again. The answer is simple.
    Command line tools offer us the completion of some impossible tools that the graphical
    user interface find impossible to conclude.


    ## The Packaging System


    The packaging systems differ from various distribution systems, and they are also
    distribution specific. You cannot use one packaging system on multiple distributions.
    In general, there are two main packaging systems:


    *   The Debian (`.deb`)

    *   The Red Hat (`.rmp`)

    '
