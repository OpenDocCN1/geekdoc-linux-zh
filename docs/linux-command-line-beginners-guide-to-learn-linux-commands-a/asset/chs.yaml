  \ Continue 命令\n此命令与 `break` 命令有些相似，因为它也会终止循环的执行，但与 `break` 命令的区别在于它并不会退出循环。你可以在脚本中设置自己的条件，引导循环在你想让它的地方停止。\n\
  \n$ `cat` `testfile`\n\n```bash\n#!/bin/bash\n## testing continue command\nfor ((\
