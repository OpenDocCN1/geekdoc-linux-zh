- "# Linux 命令行：学习 Linux 命令和 Shell 脚本初学者指南\n\n\n\n![](img/Image00000.jpg)\n\n\n\n\n\
  \n## 引言\n我决定写这本书是为了消除新手 Linux 用户面临的障碍。我希望你能够比以前更好地了解你的电脑。这本书包含了一套完整的方案，帮助初理解什么是\
  \ Linux 操作系统以及它与其他操作系统的不同之处。Linux 为你提供了一个极佳的学习体验。你可以通过快速浏览几个完全可读的文本文件来理解系统配置。只需要在整合大局时，记住每个组件单独的状态及其作用即可。就是这样。感到困惑？别担心。继续读到书末，你就会理解的。\n\
  \n### 为什么应该选择 Linux 而不是其他操作系统？\n这是在开始时应该回答的问题，以便你在阅读本书后续章节时有所动力。听着，我们不再生活在 80 年代或\
  \ 90 年代。在过去的几年里，世界发生了巨大的变化，网络世界也随之改变。现在，所有大陆都通过计算机网络连接在一起。从最老到最年轻，所有用户都可以访问互联网。在这个网络世界的角落里，有大企业开发的巨大数据库。数以十亿的网页每秒都在处理信息。\n\
  \n与这些事实相应的，是这种无处不在的连接所带来的危险。这是一个你需要一台拥有自定义应用程序并拥有完全控制权的电脑的时代。你会把自己电脑系统的控制权交给那些通过营销电脑使用有多易用来不断获取利润的公司吗？或者，你更愿意对自己的电脑拥有更多的自由和控制权？你理应拥有自定义电脑的自由。你值得为自己的电脑系统构建自己的软件。这就是为什么你应该选择\
  \ Linux 而非所有其他操作系统。在你的电脑上使用 Linux，你可以让电脑按照你所希望的方式运行。它将根据你的指令操作。\n\n### 命令行是最佳选择\n\
  我们被困在了电脑使用的便利性中。我们被给了具有吸引力的图形用户界面来应付，这让我们变得懒惰，并剥夺了我们的创新和创造力。这应该被消除。鼠标不是运行电脑的方式。键盘让你成为电脑专家。Linux\
  \ 与其他操作系统的不同之处在于，它提供的是命令行界面（CLI）而不是图形用户界面（GUI）。当我们谈论命令行界面（CLI）时，大多数人脑海中浮现的是一个黑屏。对于大多数人来说，与使用图形界面相比，这是一个可怕的想法，但这正是你力量开始的地方。CLI\
  \ 让你更大的更大的自由与电脑交流并指导它执行某些任务。你在 CLI 上输入命令，电脑会解释并执行这些命令。虽然命令行界面看起来很难用——无疑如此——但它让困难的任务变得更简单、更快速。\n\
  \n### 谁应该读这本书？\n你不需要成为编程大师来读这本书。这本书是为那些考虑涉足 Linux 世界的初准备的。在进入后续章节之前，我希望你对计算机有基本的了解。这意味着你应该能够操作图形用户界面并完成一些关键任务。你应该了解启动、启动、登录、文件和目录。你应该知道如何创建、保存和编辑文档，以及如何浏览网页空间。但最重要的还是你对学习新事物的意愿。我将从那里带你开始。\n\
  \n这本书也适用于那些厌倦了其他操作系统并想要切换到更智能的操作系统的人。在后面的章节中，我会给你讲我的朋友 Sylvia，她被老板强制学习 Linux 以执行关键办公任务。我会讲述这对她来说有多困难，以及她如何实现这样一个宏大的目标。\n\
  \n如果你刚刚开始接触 Linux 并想要切换到这个独特的操作系统，那么这本书绝对适合你。读读它，学习命令行并开始之旅吧。\n\n在开始这段旅程之前，你应该记住，精通\
  \ Linux 没有捷径。像所有伟大且令人兴奋的事物一样，学习 Linux 需要时间。它有时可能具有挑战性，也可能需要你付出巨大的努力。命令行是简单的。此外，你可以很容易地记住命令和语法。让掌握它变得困难的是它的广度。它的范围太广了，无法在短时间内掌握。但像所有伟大的事物一样，熟能生巧。如果你坚持不懈，你就能学会使用它并进行相应的应用。作为新手，我对你的唯一要求就是：决心、应对失败的能力以及负责任的态度。当你尝试学习\
  \ Linux 时，随意的态度不是应对它的最好方法。\n\n### 本书提供了什么\n书中充满了易于阅读和实践的材料，非常适合初学者。它就像向导师学习一样。每一步都通过命令行练习和解决方案来解释，帮助你理解整个过程。\n\
  \n\n\n\n\n- 第一部分解释了什么是 shell。你将学习 Linux 系统的不同组件。此外，会有各种命令可以在 shell 窗口中输入以便你即时练习。这一部分还解释了如何在\
  \ Linux 操作系统中导航文件系统和不同的目录。\n- 第二部分将通过解释更多关于命令的内容，带你进一步深入学习命令行。你也将能够创建自己的命令。\n- 第三部分包含了更多关于\
  \ Linux 环境和系统配置的细节。它将解释 `GRUB` 在 Linux 上是如何运行的。你将学习系统启动、`init` 以及 Linux 不同的运行级别。\n\
  - 第四部分讨论了包管理、仓库和依赖关系。它介绍了如何管理现有的文件系统以及创建新的文件系统。此外，它还详细解释了如何使用 Linux 操作系统处理存储设备。你将看到一个借助命令行工具编辑分区并更改其类型的示例。\n\
  - 第五部分提供了关于 Linux 环境变量的细节。\n- 在第六部分中，你将学习 shell 脚本的基础知识。这就像编写你自己的软件。你将学习关键的脚本技术，以此控制你的计算机，就像教计算机做决策一样。这几乎类似于人工智能。你的计算机将遵循一组指令自主运行。此外，你还将学习一些重要的命令，如\
  \ `case` 语句、`break` 语句和 `continue` 语句。\n- 最后一部分将带你进入 shell 脚本的高级阶段。\n\n## 阅读本书前的准备\n\
  在开始阅读这本书之前，你需要在计算机上拥有一个运行中的 Linux 系统，因为书中包含了供你使用的练习及其答案。你可以在计算机上安装 Linux。有很多种发行版，如\
  \ `Fedora`、`OpenSUSE` 和 `Ubuntu`。如果方法正确，安装发行版系统非常简单。当然，你的计算机必须满足某些规格。例如，至少有 256\
  \ MB 的 `RAM` 和硬盘上约 6GB 的空闲空间。系统的规格越高，对操作就越有利。建议你使用个人电脑和有线网络连接。无线系统不适合这项工作。你也可以从\
  \ live CD 使用 Linux 发行版系统，这样就不需要安装到系统中。至少这么说，这样没那么乱。这样做更容易。在启动时，进入设置菜单并更改启动设置。将你的启动选项切换为从\
  \ CD 启动而不是硬盘。之后插入 CD，你就可以准备好使用 Linux 发行版系统了。你可以从 live CD 运行 `Ubuntu` 和 `Fedora`。\n\
  \n## 本书如何帮助你\n对于那些想要利用 Linux 环境更快地完成管理任务的人来说，这本书非常有帮助。你将能够编写自己的脚本来完成特定任务。阅读这本书后，你将能够通过\
  \ shell 脚本自动化某些管理任务。在理解了一些关键 Linux 命令后，文件管理、统计数据管理和复杂的数学函数将变得简单得多。\n\n## 第一章：从 Linux\
  \ Shell 开始\nLinux 无处不在，从我们的手机到电脑都是如此。Linux 起始于 90 年代中期。在非常短的时间内，它传播到了许多行业。股市和超级计算机也使用这个操作系统。它的普及程度无与比比。Linux\
  \ 基本上就是一个和其他操作系统一样的操作系统，这意味着它管理你安装在系统上的软件，并管理不同硬件之间的通信。听起来很有趣对吧！让我们开始吧。\n\n### 什么是\
  \ Linux？\n在进入复杂部分之前，最好先浏览 Linux 的基础世界。对于初学者来说，如果他们不知道 Linux 到底是什么以及它提供什么，理解 Linux\
  \ 可能会很困惑。尽管在开始看起来是一个复杂且无法完成的事情，但实际上，它比你想象的要容易得多。Linux 操作系统由以下部分组成。\n\n- **引导加载程序\
  \ (Bootloader)**：它管理计算机的引导过程。你可能在进入操作系统之前看到一个转瞬即逝的启动画面。\n- **内核 (The Kernel)**：这被称为系统的核心。它在需要时部署软件和硬件来管理整个系统。此外，`kernel`\
  \ 管理系统内存以及文件系统。\n- **Shell**：你可以通过输入文本形式的命令给计算机下指令。这种命令行被称为 `shell`，它是 Linux 中令人生畏的部分。人们只是不想进入其中。我的朋友\
  \ Sylvia 直到她老板把她推入这个奇的技术世界之前一直不喜欢 Linux。一旦她进入其中，她就比 Windows 和 Mac 还喜欢它。命令行给她的控制权让她在办公室感到非常舒适。shell\
  \ 允许她在命令提示符的帮助下复制、移动和重命名文件。她经历的所有挣扎都是记忆文本命令，剩下的都是简单部分。命令提示符完成一切。你可以输入程序名称来启动它。`shell`\
  \ 将相关信息发送给 `kernel`，由它完成剩余的执行工作。\n\n### 起始\n安装 Linux 后，创建一个普通用户作为你的个人账户运行。登录该账户。\n\
  \n### Shell 窗口\n`shell` 是命令行不可或缺的一部分。命令行实际上就是 `shell` 本身。简单来说，它接收键盘命令作为输入，然后将其处理交给操作系统执行。不同的图形用户界面\
  \ (`GUIs`) 使用不同的终端模拟器，允许你通过 `shell` 输入文本命令。一些新手会对网上大量的终端模拟器感到困惑。为了理清思路，只需记住所有终端模拟器的基本工作是为你提供进入\
  \ `shell` 的入口。还有一点：终端模拟器被称为 shell 窗口。\n\nUnix 也使用 shell 系统，但 Linux 拥有相同的系统，而且更好。这个增强版本的\
  \ `shell` 被称为 `bash`，它是大多数 Linux 发行的默认 shell。在你启动模拟器后，屏幕将向你显示如下内容：\n\n对于 Ubuntu\
  \ 用户，看起来像：`aka@localhost ~$`\n对于 Fedora 用户，显示为：`[aka@localhost ~]$`\n\n这段被称为 shell\
  \ 提示符，其中 `aka` 是用户名，而 `localhost` 表示机器名。它们的值可能会不同。通常，你在 shell 窗口中时，`$` 符号一直伴随着你。如果你看到\
  \ `#` 符号，意味着你是以 root 用户身份登录的，或者你使用的模拟器提供了超级用户权限。如果这是你第一次接触 Linux，只需打开 Windows 上的\
  \ DOS 命令提示符。在使用 shell 窗口时你会有同样的体验。除了命令之外没有太大区别。环境大体相似。\n\n你想在你的屏幕上输入些什么吗？让我们试试吧。\n\
  \n```\n[aka@localhost ~]$ tera\n```\n你写了你的名字吗？写下来。shell 将分析命令并给出如下响应：\n\n```bash\n\
  bash: tera : command not found\n```\n\n\n\n\n\n```\n[aka@localhost ~]$\n```\n你无法在模拟器上使用鼠标。相反，键盘方向键将帮助你施展魔法。按下向上箭头键可以滚动查看历史命令。向下箭头会带你回到最近的命令。此外，当你切换到新命令时，之前的命令会消失。这难道不像\
  \ DOS 命令行提示符吗？向右和向左箭头可以帮助你定位光标以便在需要时编辑命令。只需留在那里尝试一些简单的命令即可。\n\n```\n[aka@localhost\
  \ ~]$ date\n```\nThus Aug 15 12:18:01 UTC 2019\n```\n[aka@localhost ~]$\n```\n如果你输入\
  \ `cal` 代替 `date`，屏幕上将显示一个整月的日历。\n\n# 基础命令\n\n如果你期待像操作 Windows 一样操作 Linux，那么你错了。Linux\
  \ 更加智能。你通过一套命令集来工作。这就像编程一样。输入命令来完成任务，这就够了。让我们看看你可以操作其中的哪些内容。乐趣将从这里开始。准备好！\n\n`echo`\
  \ 命令的奇妙之处如下。\n\n```\n[root@localhost ~]# echo My love\n```\nMy love\n\n`#` 符号表示我是以\
  \ root 用户身份登录的。我认为这部分已经完成了。现在输入以下内容：\n\n让我们尝试 `cat` 命令并看看它能做什么。\n\n```\n[aka@localhost\
  \ ~]$ cat/etc/passwd\n```\n命令下方将出现大量的行和列。此命令用于显示上述文件的内容。\n\n你想将文件从一个地方移动到另一个地方吗？请查看\
  \ `mv` 命令。\n\n```\n[aka@localhost ~]$ mv downloads documents\n```\n```\n[aka@localhost\
  \ ~]$ mv documents programs lib\n```\n在第二个命令的帮助下，你可以同时将多个文件移动到特定目录。在上面的命令中，`lib`\
  \ 表示目录名称。\n\n`cp` 命令用于在 Linux 中将文件从一个地方复制到另一个地方，例如从 downloads 到 documents。\n\n```\n\
  [aka@localhost ~]$ cp downloads documents\n```\n```\n[aka@localhost ~]$ cp file1\
  \ file2 file3 file4 fileN dir\n```\n第二个命令是将多个文件的内容复制到单个目录中。\n\n通过 `touch` 命令，你可以创建一个文件。如果文件在你的计算机上已存在，它的时间戳将被被修改。\n\
  \n```\n[aka@localhost ~]$ touch video\n```\n```\n[aka@localhost ~]$ ls -1 video\n\
  ```\n当你输入第二个命令时，它将显示相应文件的修改时间。\n\n最后，`rm` 命令用于从系统中删除文件。你脑海里在想回收站吗？忘记它吧。你不需要手动搜索文件将其发送回收站。只需输入\
  \ `rm` 和文件名即可。它将被移除。\n\n```\n[aka@localhost ~]$ rm downloads\n```\n文本 `downloads`\
  \ 是文件名。就像 `touch` 命令一样，你也可以通过输入 `mkdir` 和新目录名称创建一个新目录。\n\n```\n[aka@localhost ~]$\
  \ mkdir lib\n```\n```\n[aka@localhost ~]$ cd /lib\n```\n[aka@localhost lib]$\n恭喜！你成功创建了一个新文件。这里\
  \ `mk` 表示 make。`rmdir` 命令允许你删除目录。这里 `rm` 表示 remove。\n\n```\n[aka@localhost ~]$ rmdir\
  \ lib\n```\n文件将立即从系统中移除。你必须记住，在删除时 `lib` 目录不能为空，否则命令将失败。如果你是那些厌倦了在搜索数百个文件夹和文件后逐个删除文件的人，这对你来说非常完美。它将删除整个目录。\n\
  \n“如果我想删除主目录下存在的子目录怎么办？”西尔维亚（Sylvia）问道，经过几个小时的大脑风暴，她现在已经学会了足够可以提出问题。为此，我的回答是可以在命令中添加\
  \ `-rf`。\n\n```\n[aka@localhost ~]$ rm –rf lib\n```\n尽管这个命令对你的业务或个人工作非常有帮助，但它也可能是致命的。它可以在眨眼之间删除大量数据。在执行命令之前，请确保你正在删除正确的目录。一旦输入，一切都消失了。\n\
  \n让我们看看 `rm` 命令我们拥的选项：\n- `rm documents`：它帮助你删除名为 `documents` 的特定文件。\n- `rm -i documents`：在窗口中输入此内容，将在删除文件前要求你确认。\n\
  - `rm -r documents lib`：它将删除 `documents` 文件和 `lib` 目录及其内容。\n- `rm -rf documents\
  \ lib`：即使其中一个不存在，它也会删除 `documents` 文件和 `lib` 目录。点在于，考虑到你所写的文件名在系统中不存在，它并不会失败。\n\n\
  ## In 命令\n\n此命令创建新链接。你可以按照以下形式使用：\n\n```\n[aka@localhost ~]$ In file link\n```\n\
  ```\n[aka@localhost ~]$ ln –s item link (用于硬链接)\n```\n\n## 管理系统内存\n\nLinux 中的内存被分为块，技术上称为页（pages）。当你输入命令来定位内存中的特定页或通用信息时，Linux\
  \ 内存被分为块，技术上称为页。当你输入命令来定位内存中的特定页或通用信息时，Linux 内存被分为块，技术上称为页。当你输入命令来定位内存中的特定页或通用信息时，Linux\
