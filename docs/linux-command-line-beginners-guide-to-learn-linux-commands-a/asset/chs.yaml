  \n### `free` 命令\n让我们立即开始。你将看到以下表格：\n\n```\n[aka@localhost ~]$ free\n```\n表格是自而显的。通过列进行解释。你可以了解总内存、已内存和空闲内存。它还显示缓存。\n\
  \n### `df` 命令\n你可以通过以下简单命令轻松查看硬盘上的可用空间。\n\n```\n[root@localhost ~]# df\n```\n```\n\
  Filesystem 1k-blocks Available% Mounted on\n/dev/root 1048576 207640 840936 20%\
  \ /\ndevtmpfs 125948 0 125948 0% /dev\ntmpfs 125988 8 125980 0% /run\n```\n\n###\
  \ `/proc/meminfo` 文件\n检查内存状态另一种流行方法是读取 `/proc/meminfo` 文件。输入命令 `cat/proc/meminfo`，你将看到一系列选项以及每个选项消耗的内存详情。让我们看看。当你输入命令时，以下列将出现在你的屏幕上。\n\
  \n```\n[root@localhost ~]# $ cat/proc/meminfo\n```\n```\nMemTotal: xxx kb\nMemFree:\
  \ xxx kb\nBuffers: xxx kb\nCached: xxx kb\nSwapCached: xxx kb\nActive: xxx kb\n\
  Inactive: xxx kb\nActive(anon): xxx kb\nInactive (anon): xxx kb\nActive(file): xxx\
  \ kb\nInactive(file): xxx kb\nUnevictable: xxx kb\nMlocked: xxx kb\nSwapTotal: xxx\
  \ kb\nSwapFree: xxx kb\nDirty: xxx kb\nWriteback: xxx kb\nAnonPages: xxx kb\nMapped:\
  \ xxx kb\nShmem: xxx kb\nSlab: xxx kb\nSReclaimable: xxx kb\nSUnrelcaim: xxx kb\n\
  PageTables: xxx kb\nNFS_Unstable: xxx kb\nBounce: xxx kb\nCommitlimit: xxx kb\n\
  Committed_AS: xxx kb\nVmallocTotal: xxx kb\nVmallocUsed: xxx kb\nVmallocChunk: xxx\
  \ kb\nHubPages_Total: xxx kb\nHubPages_Free: xxx kb\nHubPages_Rsvd: xxx kb\nHubPages_Surp:\
  \ xxx kb\nHubpagesize: ​ xxx kb\n```\n\n\n\n\n\n# 此内存详情显示了 Linux 服务器拥有的物理内存总行数。它将显示使用了多少内存以及用在哪里。你可以看到所有的内存页，这些页面因系统不同而有所不同。你的\
  \ Linux 系统可能没有创建上述某些页面。\n\n## Shell 导航概览\n如果你停留在同一个地方，很快就会对 Linux 感到无味。你必须能够在不同的文件和目录之间进行导航，以享受这款独一无二的操作系统的体验。你需要了解自己所在的位置、你有权访问哪些内容，以及可以使用什么命令来访问它们。首先，你应该知道自己的“脚落在哪里”。要学习这一点，请使用以下命令。\n\
  \n```bash\n[aka@localhost ~]$ pwd\n```\n\n在大多数情况下，人们会进入其账户的主目录。现在，主目录是什么呢？让我为你解释一切。主目录是你不仅可以在其中存储文件，还可以建立目录的地方。在这里，你是老板。它就像你一个真实的家。可以随意在这里存储你的数据，并创建多个目录。在\
  \ `pwd` 命令中，`p` 代表 print（打印），`w` 代表 working（工作），而 `d` 代表 directory（目录）。\n\n### 它是一棵树吗？\n\
  它看起来不像，但它确实是一棵树。就像 Windows 操作系统一样，Linux 将所有文件和文件夹排列成层次结构。是的，如果你能以某种方式将其具象化为某些具体的东西，它看起来就像一棵树。因此有了“tree”（树）这个词。你可能会惊讶地发现，在\
  \ Windows 和 Linux 等不同操作系统之间，大多数事情都是相同的。为了方便用户，创建者更改了一些名称以区分这些系统。例如，在 Linux 中被称为\
  \ directory（目录）的东西在 Windows 中通常被称为 folder（文件夹）。\n\n让我带你进一步进入 Linux 目录的世界。首先，这些目录与\
  \ Windows 文件夹在某些方面不同，它们可以携带大量的文件和子目录。你遇到的第一个目录是 `root` 目录。\n\n### Linux 与 Windows\
  \ 不一致之处\n嗯，世界上总会有分歧。如果你是 Windows 用户，你最习惯为硬盘、USB 存储设备和 DVD 驱动器使用独立的文件系统。但 Linux 挑战了这种系统。它为所有外部内部存储设备提供了一个单一的树状文件系统。\n\
  \nWindows 为普通用户让事情变得简单，但这让我们失去了享受复杂技术命令的乐趣。看，Windows 显然以树的形式、图形化的方式呈现文件系统。这里有很多加号和减号。通过加号，你可以进一步探索树的分支，而减号则帮助你关闭这些分支并简化视图。根目录始终位于顶部。\n\
  \n如果你在考虑像图形化界面那样酷的事，现在停止思考吧。Linux 通过提供通过输入文本命令来导航不同文件和文件夹的潜力，让它变得有趣。在 Linux 终端或\
  \ shell 窗口中，你始终处于某个被称为“当前目录”的目录中。要知道你的确切位置，正如我之前解释的那样，`pwd` 命令可以为你提供帮助。\n\n你想知道目录的内容吗？每个人都想知道。我相信你已经学习并练习了如何知道你当前所在的目录。是时候深入研究系统了。你应该知道如何使用单个命令探索目录的内容。你可以留在主目录并探索它，也可以移动到你最喜欢的目录。要探索你当前正在工作的目录，请尝试以下命令。\n\
  \n```bash\n[aka@localhost ~]$ ls\n```\n\nPictures Videos Games Documents\n\n我的朋友\
  \ Sylvia 喜欢以光速从一个文件夹跳转到另一个文件夹。虽然在 Windows 中这样做很有趣，但在 Linux 中这样做更快更简单。只需记住 `cd` 因素。Sylvia\
  \ 虽然学得很辛苦，但她通过在笔记本上记下并背诵整个文本学会了它。现在她只需要输入 `cd` 和她想要跳转的目录的路径即可。\n\n让我承认，这看起来并不那么简单。路径名就像一个魔圈，我们通过它跳到我们想要进入的目录。路径分为两类：相对路径和绝对路径。\n\
  \n### 绝对路径\n也称为绝对路径或全路径。路径通常由包含对象名称字符序列组成。它所所在的目录名称也是名称的一部分。可能会有一个包含软件和程序的目录。在这个目录中，还有你需要访问的其它目录。你的路径将如下所示。\n\
  \n```bash\n[aka@localhost ~]$ cd /usr/lib\n[aka@localhost lib]$\n```\n\n你可以随时通过应用\
  \ `pwd` 命令确认你是否已移动到目标目录。\n\n### 相对路径\n你可以从当前目录开始，通过简单的命令移动到父目录。你喜欢输入像 `..` 这样的点吗？单点指代当前工作目录，而双点\
  \ `..` 则带你进入父目录。\n\n```bash\n[aka@localhost lib]$ cd /usr/lib\n[aka@localhost lib]$\n\
  ```\n\n我想去 `/usr`。你可以采用长路径，也可以采用更短的方法。让我们先用长但更安全的方法。\n\n```bash\n[aka@localhost\
  \ lib]$ cd /usr\n[aka@localhost usr]$ pwd\n/usr\n```\n\n现在用更短、更快的方法这样做。\n\n```bash\n\
  [aka@localhost lib]$ cd..\n[aka@localhost usr]$ pwd\n/usr\n```\n\n完成了。你已经切换到了父目录。等一下。我们还没结束。让我们再次通过两种方法回到工作目录。我们目前处于父目录中。记住这一点。你的屏幕现在显示以下内容。\n\
  \n```bash\n[aka@localhost usr]$ Type the following.\n[aka@localhost usr]$ cd /usr/lib\n\
  [aka@localhost lib]$\n```\n\n让我们用更短、更快的方法这样做。你还记得单点 supposed 是做什么的吗？\n\n```bash\n\
  [aka@localhost usr]$ cd ./../bin\n[aka@localhost lib]$\n```\n\nSylvia 只是讨厌这些点。她总是在需要插入单点的地方用双点，在需要双点的地方用单点。有一天，当我路过她的办公室散步时，我进去发现她正被这些简单的命令搞得一团糟。患难见见真朋友。我告诉她一个从父目录切换回工作目录的魔法公式。让我们试一下。\n\
  \n```bash\n[aka@localhost usr]$ cd bin\n[aka@localhost bin]$\n```\n\n不仅省略了点，连斜杠也省略了。这是一个行业小技巧：`cd`\
  \ 是 current（当前）和 directory（目录）的缩写。如果你只尝试输入 `cd` 命令，它会将你带回登录后首次开始的目录。\n\n```bash\n\
  [aka@localhost lib]$ cd\n[aka@localhost ~]$\n```\n\n关于 `cd` 命令的更多信息：让我们尝试一下 `-`。它应该将工作目录切换到你离开的那个目录。假设你从\
  \ `usr` 切换后目前处于 `lib`。\n\n```bash\n[aka@localhost lib]$ cd -\n/usr\n[aka@localhost\
  \ usr]$\n```\n\n另一个需要知道的重要命令是 `cd ~ username`。如果你有另一个用户名如 `john`，你可以在 username 的地方输入名称来切换到该账户的目录。\n\
  \n深思：重要的是，在 Linux 中，当你在 shell 窗口中输入文件名时，需要注意使用正确的大小写。在这个操作系统中，downloads 和 Downloads\
  \ 是两个不同的东西。\n\n如果你在任何时候想回到起点，只需输入 `cd` 并按回车。然后输入 `pwd` 来知道你目前所在的位置。\n\n## 你已经可以使用\
  \ ls 命令做的事情\n现在是时候学习更多命令了，因为你已经掌握了基础知识。你现在知道 `ls` 用于列出目录。此外，你还可以查看目录的内容。\n\n```bash\n\
  [aka@localhost ~]$ ls\n```\n\n\n\n\n`bin games include lib lib64 libexec local sbin\
  \ share src tmp` 在上面的命令中，你可以看到四个不同的目录。现在，我想让你深入你的大脑，并从中找出一个你想要列出的特定目录名称。让我先用我的来潜入一下。我将使用\
  \ `#` 作为此命令——这就是超级用户（super user）的标志。\n\n```\n[aka@localhost ~]$ ls /usr\n```\n\n\
  让我们再看看 `ls` 命令的其他一些选项。有一个选项是 `-a`，它可以被扩展为 `--all`。它将列出所有文件，包括以点（.）开头的文件，这些文件通常对其他命令是隐藏。\n\
  \n```bash\n[aka@localhost ~]$ ls –a . ..  bin games include lib lib64 libexec local\
  \ sbin share src tmp\n```\n\n第二个选项是 `-d`，可以扩展为 `--directory`。如果单独使用，此命令将向你显示目录内容的列表。你可以配合\
  \ `-1` 使用，以查看内容的详情。\n\n第三个考虑的选项是 `-1` 命令。你可以看到长格式的输出结果。\n\n```bash\n[aka@localhost\
  \ ~]$ ls –1bin games include lib64 libexec local sbin share src tmp\n```\n\n第四个选项是\
  \ `-S`。它根据文件的大小对结果进行排序。这里 `S` 代表大小（word size）。如果你通过为它们分配一个完整、相关且熟悉的单词来记住符号，这将帮助你比平时更快地记住命令。\n\
  \n第五个选项是 `-h`，长格式为 `--human-readable`（人类可读）。这有助于你获取人类可读的目录和文件的完整大小显示，而不是仅仅显示字节。\n\
  \n第六个选项是 `-r`，长格式为 `--reverse`（反转）。它以反向角度显示结果，这意味着按字母降序。\n\n```bash\n[aka@localhost\
  \ ~]$ ls –rtmp src share sbin local libexec lib64 lib include games bin\n```\n\n\
  第七个选项是 `-t`。从字母‘t’的使用可以明显看出，该选项提供了根据修改时间查看结果的功能。\n\n```bash\n[aka@localhost ~]$\
  \ ls –t\nsbin lib lib64 libexec share include src local games tmp bin\n```\n你可以看到，文件的位置根据修改时间发生了变化。\n\
  \n### 现在如何识别文件类型\n既然我们正在深入深入系统，现在是时候了解如何确定特定文件的类型了。实际上，Linux 并没有像 Windows 那样让用户方便。没有那种熟悉的、你可能可以轻易猜到的类型文件名。这让它变得粗略且困难。要确定文件类型，你应该输入以下命令。\n\
  \n```bash\n[aka@localhost ~]$ file downloads\n```\n这被称为 `file` 命令。当你执行它时，可能会打印出以下信息。\n\
  \n```bash\n[aka@localhost ~]$ file downloads\nimages.jpg: JFIF standard 1.01\n```\n\
  在 Linux 中有很多文件。随着你探索系统，你将了解到越来越多的文件类型。所以，请保持关注！继续阅读。\n\n### less 命令\nLinux 工具箱中另一个重要的命令是\
  \ `less` 命令。对于那些兴趣查看文本文件的人来说，这是一个完整的程序。此命令帮助你查看系统中的人类可读文件。它能迅速跟踪这些文件并允许你查看。\n\n\
  等一下！当我写作时，Sylvia 敲了门，进了我正在用笔记本电脑工作的客厅。自从她老板强制要求她学习 Linux 命令行以来，她一直对学习它感到好奇。我必须承认，之前对她的神经和肩膀来说是一个巨大的负担，现在已经变成了一种激情。她喜欢\
  \ Linux 如何更容易用更短的时间完成办公室工作。她在办公室节省的时间让她可以去朋友家里坐坐。我希望你已经停止思考她为什么会来我家里了。让我们欢迎她吧。\n\
  \nSylvia 在学习 `less` 命令时，总是好奇为什么我们起初需要这个命令？事实上，我们为什么需要查看文本文件？答案是，很多文件不仅仅是普通文件。它们是包含配置文件的系统文件。它们以这种特殊的格式存储在你的系统中。\n\
  \n如果你像 Sylvia 那样思考，你可能会说这大不了。我为什么起初必须查看配置文件呢？这个问题也有答案。这个命令不仅显示系统文件，还显示你的系统使用的许多真实程序。这些程序在技术上被称为脚本（scripts）。它们始终以这种特定的格式存储在系统中。\n\
  \n我已经使用“文本”这个词有一段时间了。信息可以以多种形式显示在计算机上。在 Windows 操作系统中，它以图片、视频、数字和字母的形式表示。通常，计算机理解的语言是数字形式，如二进制位。\n\
  \n如果我们把文本视为表示系统，它感觉比所有其他方法都更简单更方便。人类大脑以这种形式处理信息的速度更快。数字被逐一转换为文本。这个系统非常紧凑。这种文本与文字处理器中的那种不同。我告诉你这些是因为在\
  \ Linux 中，许多文件是以文本文件的形式存储在系统中。让我们看看如何使用 `less` 命令。\n\n```bash\n[aka@localhost ~]$\
  \ less downloads\n```\n此程序帮助用户浏览特定文件。有些文件较长，有些较短。在 `less` 命令中，你可以浏览特定的文件。对于较长文件，可以滚动。对于在文件中间的文本，你也可以按空格键。\n\
  \n```bash\n[aka@localhost ~]$ less /etc\n```\n\n### 需要记住的事\n- 使用 Page Up 键向上翻页。使用\
  \ `b` 回退。\n- 使用 Space 键向下翻页。\n- 向上箭头和向下箭头分别用于上下移动。\n- `h` 可以显示帮助屏幕。\n- `q` 始终用于退出\
  \ `less` 命令。\n\n### Linux 中的常见目录名\n- `/` 表示根目录。该目录下通常没有文件。\n- `/lib/` 表示库目录，用于存储库文件。\n\
  - `/root` 带你进入主目录。root 用户被称为超级用户。\n- `/etc` 包含配置文件。\n- `/bin` 存储用户级实用。也被称为二进制目录。\n\
  - `/opt` 用于存储可选软件。\n- `/dev` 被称为设备目录。\n- `/usr` 是用户软件目录。\n- `/var` 是变量目录。它经常变化。\n\
  \n## 第二章：探索命令领域\n我希望到目前，你已经获得了关于如何使用简单命令遍历窗口的足够知识。这很容易，你看到了。另一个更有趣的事情是命令很容易记忆。你也可以创建自己的命令，这就是我们要学习的。此外，通过熟悉更多命令，你在使用它们时会感到更加自在。不同类型的命令：\n\
  - 它可能是 shell 函数（shell function），一种嵌入环境的 shell 脚本。\n- 命令构成可执行程序，就像软件工程师在 C 语言或 Python\
  \ 和 Ruby 工作时的一样。\n- 或者命令可以是别名（alias），即你自定义的命令。\n\n你知道如何知道命令的类型吗？让我们看看它是怎么做的。\n\n\
  ```bash\n[aka@localhost ~]$ type cd\ncd is a shell buildin\n```\n\n```bash\n[aka@localhost\
  \ ~]$ type cp\ncp is /bin/cp\n```\n\n```bash\n[aka@localhost ~]$ type rm\nrm is\
  \ /bin/rm\n```\n\n```bash\n[aka@localhost ~]$ type mkdir\nmkdir is /bin/mkdir\n\
  ```\n现在我们知道每个命令的类型了。\n\n\n\n\n# which 命令\n\n你可以使用此命令来跟踪可执行文件。在 Linux 系统上，与 Windows\
  \ 操作系统不同，会安装多个版本的程序。此命令告诉我们去哪里找到该程序。\n\n让我们来看语法：\n`/bin/cd`\n\n```bash\n[aka@localhost\
  \ ~]$ which rm\n/bin/rm\n```\n\n它对内置程序无效。参见以下语法。\n```bash\n[aka@localhost ~]$ which\
  \ ls\n/usr/bin/which: no 1s in (/usr/local/sbin:/bin:/sbin:/usr/bin:/usr/sbin:/usr/local/bin)\n\
  ```\n\n## info which 命令\n\n此命令显示帮助信息。\n\n```bash\n[aka@localhost ~]$ info which\n\
  ```\n\n下一个：Which Program，上一个 (dir)，向上：(dir) ‘which’：显示命令的完整路径\n\n‘which’程序显示（shell）命令的完整路径。此文件记录了\
  \ ‘which’ 版本 2.21，更新于 2015 年 3 月 20 日。\n\n*   **Menu（菜单）**: `Which Program`：‘which’\
  \ 程序\n*   **Invoking Which（调用 Which）**: 如何调用 ‘which’\n*   **Option Summary（选项摘要）**:\
  \ 命令行选项概览\n*   **Return Value（返回值）**: ‘which’ 的返回值\n*   **Example（示例）**: 调用示例\n\
  *   **Bugs（缺陷）**: 已知缺陷\n*   **See Also（另需参考）**: 相关的 UNIX 命令\n*   **Index（索引）**:\
  \ 索引\n\nInfo: (which)Top, 20 lines --All\n欢迎使用 Info 版本 6.5。输入 H 获取帮助，输入 h 查看教程。如果你输入\
  \ H，屏幕上将显示以下详细信息。\n\n基础信息命令键：\n*   `H`: 关闭此帮助窗口\n*   `q`: 完全退出 Info\n*   `h`: 调用\
  \ Info 教程\n*   `Up`: 向上移动 Info 教程\n*   `Down`: 向下移动一行\n*   `PgUp`: 向上回翻一页。\n*  \
  \ `PgDn`: 向下翻一页。\n*   `Home`: 回到此节点的开头。\n*   `End`: 去到此节点的末尾。\n\nInfo: *Info Help*，302\
  \ 行 --Top\n现在输入 h，以下详细信息将出现在你的屏幕上。\nNext: Help-P，Prev: Help-Small-Screen，Up: Getting\
  \ Started\n\n## help 命令\n\n你已经学习了许多命令及其解决方案。如果你在课程中间被困住且不知道该怎么办，是时候了解那个可以让你摆离困境的命令了。Sylvia\
  \ 在学习阶段非常喜欢这个功能。有一天，我正计划在海滨边的度假村庆祝女儿的生日，Sylvia 打了电话给我。她很恐慌，因为她在办公室的电脑上搞乱了某些命令。她尝试使用\
  \ help 命令，但无果。当 help 命令未能起作用时，她慌慌了。实际上，help 命令仅为 shell 内置命令创建。\n\n```bash\n[aka@localhost\
  \ ~]$ help cd\ncd: cd [-L|[-P [-e]] [-@]] [dir]\n更改 shell 工作目录。\n```\n\nhelp 命令的一个有趣之处是可以在\
  \ shell 窗口内了解命令提供了哪些功能。让我们看看语法。\n\n```bash\n[aka@localhost ~]$ help help\nhelp:\
  \ help [-dms] [pattern ...]\n显示关于内置命令的信息。\n```\n\n### --help 选项\n\n此命令将帮助你探索更多关于可执行程序的信息。这个非常了不起，因为它显示了与程序相关的不同选项以及支持的语法。这使得边学边练习更多命令变得更容易。你不需要为了小障碍去查阅书籍。\n\
  \n```bash\n[aka@localhost ~]$ cp --help\n```\n\n帮助功能还可以配合不同的选项使用，以便在途中获取更多信息。\n\n\
  配合 –d 使用：\n```bash\n[aka@localhost ~]$ help –d help\nhelp – 显示关于内置命令的信息\n```\n\n\
  配合 –s 使用：\n```bash\n[aka@localhost ~]$ help –s help\nhelp: help [-dms] [pattern\
  \ …]\n```\n\n## man 命令\n\n在大多数情况下，可执行程序会提供一份被称为 man page（手册页）的正式文档。你可以通过以下命令查看该文档。\n\
  \n```bash\n[aka@localhost ~]$ man program\n```\n\n在这里，`program` 指你想查看的命令。man 页面的显示方式如下：有一个标题。还有一个描述部分，解释了为什么要使用特定的命令。此外，还会带有命令选项描述的列表。让我们剖析一个\
  \ `printf` 命令的 man 手。\n\n```bash\n[aka@localhost ~]$ man printf\n```\n\n将有一个文档名称。下面是\
  \ SYNOPSIS（概要）标题。接着是描述。该部分带有关于特定程序可用选项的深入细节。对于 `printf`，`--help` 和 `version` 是可用的。\n\
  \n这就是手册的完整页面。翻阅整个页面来定位特定信息需要花费大量时间。别担心。你可以输入针对性的命令来阅读手册的特定章节。man 命令允许你指定章节号。看看如何操作。\n\
  \n```bash\n[aka@localhost ~]$ man section search_term\n[aka@localhost ~]$ man 9\
  \ passwd\n```\n\n## whatis 命令\n\n如果你不知道特定命令提供了什么，可以运行 `whatis` 命令。\n\n```bash\n\
  [aka@localhost ~]$ whatis ls\nls (1) - list directories\n```\n\n## info 命令\n\n对于\
  \ GNU 用户，有一个 man 的替代方案叫做 `info` 页面。这些页面以树形结构存储。语法如下：\n\n```bash\n[aka@localhost\
  \ ~]$ info menu-item\n```\n\n一个示例：\n```bash\n[aka@localhost ~]$ info -d cvs\n```\n\
  \n我已经告诉过你，info 文件是以树形结构存储的。每一个节点包含一个主题。它们也有超链接，方便跳转到另一个节点。而且，它们不是蓝色的，只需通过星号识别。移动光标并按下回车键即可打开它。\n\
  \n`info` 命令非常有意思。你可以从多个角度使用它。如果你需要关于特定命令的信息，可以通过简单的语法来实现：\n\n```bash\n[aka@localhost\
  \ ~]$ info -O mv\n```\n\n下一个：rm invocation，上一个：install invocation，向上：Basic operations\n\
  \n它显示 `mv` 命令的选项节点。你可以通过 `info` 命令学习很多。当 Sylvia 学习 命令行时，她习惯随身带一个笔记本记录遇到的重要事情。这对她帮助很大。她掌握了重要的信息。\n\
  \n\n\n\n\n[aka@localhost ~]$ apropos option keyword\n你一次可以使用一个关键词。\n\n[aka@localhost\
  \ ~]$ apropos email\n它将显示所有关于 `email` 的必要信息。为了增加一些趣味性，你可以使用选项 `-d`，它会触发终端返回与你输入的关键词相关的路径、`man`\
  \ 目录等。\n\n[aka@localhost ~]$ apropos –d email\n列表还将继续。我刚刚只写了略于一半的 `apropos` 命令在窗口中返回的细节。\n\
  \n你是 Google 用户吗？如果是的话，你可能知道 `google` 无法看到你在苦苦思索需要搜索的确切关键词时的痛苦。你输入一个词，就会弹出一个包含最相关搜索短语的列表。通常，我会选择列表中的一个短语。想象一下，如果你在\
  \ Linux 中也能使用类似的功能就好了。幸运的是，你可以这样做。使用 `-e` 选项。让我们直接进入语法。\n\n[aka@localhost ~]$ apropos\
  \ –e compress\n你将得到一个以“compress”开头的命令列表。\n\n### 行业小技巧\n\n能否组合不同的命令并获得结果？绝对可以。你可以这样做。我会写下语法。\n\
  \n[aka@localhost ~]$ cd /usr; ls; cd -\n```bash\nbin games include lib lib64 libexec\
  \ local sbin share src tmp\n```\n`/usr`\n我们成功地一次执行了三个连续命令：切换目录到 `/usr`，列出目录，然后返回到执行命令之前的目录。这三个操作在一个命令中完成了。\n\
  \n### 创建我们自己的命令\n\n我们要不要尝试创建我们自己的命令？我们可以借助刚刚尝试并测试过的命令来这样做。想一个可能的名称，并确认它没有被占用。\n\n\
  [aka@localhost ~]$ type xinSh: type; xin; not found\n所以，`xin` 不存在。这里是创建别名（alias）的语法。\n\
  \n[aka@localhost ~]$ alias xin=’cd/usr; ls; cd –‘\n记住这个字符串并找到一个未被占用的名称。执行命令。太棒了！看起来你已经创建了自己的命令。\n\
  \n让我们试试这个新命令。\n\n[aka@localhost ~]$ xin\n```bash\nbin games include lib lib64 libexec\
  \ local sbin share src tmp\n```\n`/usr`\n恭喜！要确认的话，运行 `type` 命令查看你的命令 `xin` 被别名指向了哪里。\n\
  \n[aka@localhost ~]$ type xin\n`xin` 别名指向 `cd/usr; ls; cd -`\n\n如果你想查看环境中所有的别名，请按照以下语法操作。\n\
  \n[aka@localhost ~]$ aliasegrep='egrep --color=auto'fgrep='fgrep --color=auto'grep='grep\
  \ --color=auto'l.='ls -d .* --color=auto'll='ls -l --color=auto'ls='ls --color=auto'mc='.\
  \ /usr/libexec/mc-wrapper.sh'which='(alias; declare -f) /usr/bin/which --only-read\
  \ --show-tilde'xin='cd/usr; ls; cd -'\n*(注：原文包含一个压缩的别名列表；核心逻辑已保留。）*\n\n### I/O 传奇\n\
  \n我们将学习 shell 中的输入和输出。你将使用元字符。基本上，这负责在文件之间重定向 I/O（输入输出）。此外，它还被用于创建管道（pipelines）。\n\
  \n#### 标准流\n\n几乎所有基于计算机的程序都会响应输入并输出。例如，如果你正在浏览网站并点击后退按钮，会弹出一个窗口阻止你返回，否则你将丢失数据。当你尝试关闭一个未保存的文件时，也会弹出同样的窗口。你在键盘上输入按键就像你现在要这样做一样；其结果显示在桌面、搜索栏或终端模拟器中。这就是\
  \ I/O 系统通用的运行方式。一些错误信息会像门口的精灵一样出现。\n\n#### 剖析 I/O 系统\n\n标准输入：被赋予数字 `0`。你的键盘被用于输入。简写形式，它看起来像\
  \ `stdin`。\n\n标准输出：它的数字是 `1`。你猜对了。当然，输出会在你眼前的屏幕上显示。无疑，你看到了。简而言之，它显示为 `stdout`。\n\
  \n标准错误：赋予数字 `2`。如果你在输入中漏掉了某些内容，或者不确切命令，`bash` shell 会抛出一个错误框。简写为 `stderr`。关于键盘和操作系统之间的关系，重定向过程并不复杂。你会理解它是怎么的。\n\
  \n#### 重定向到文件\n\n重定向比其他命令稍微技术化一点，也稍微不同。你将使用 `>` 和 `<`。有时为了所需的输出，你必须使用 `>>` 或 `<<`。但别担心，我们将学习使用它们。开始吧。你必须使用\
  \ `>` 符号配合所需的文件名。你可以将命令的输出发送到你的文件。让我们用简单的方法学习。你正在 Microsoft Word 中工作。你输入了自己的名字，但不想让它显示在屏幕上，而是希望它移动到特定的文件中。\n\
  \n[aka@localhost ~]$ echo Hi there. > test.txt\n[aka@localhost ~]$ cat test.txt\n\
  Hi everyone.\n\n只有在你要求时，文件才会返回给你。\n\n#### 擦除输出\n\n是的，你可以这样做。Linux 中的命令绝对就像魔术棒。通过一个简单的命令，你就可以覆盖命令。让我们试试看。\n\
  \n[aka@localhost ~]$ cat test.txt\nHi everyone\n[aka@localhost ~]$ leo > test.txt\n\
  Sh: leo: command not found\n[aka@localhost ~]$ cat test.txt\n你可以看到文件仍然存在，但它仍被覆盖并擦除了。当我之后运行\
  \ `cat` 命令时，没有任何返回。我不希望文件被这样擦除：你是这个意思吗？当然，你是这个意思。有方法可以做到。我们有 `noclobber` 选项来防止覆盖文件导致的删除。让我们学习语法。\n\
  \n[aka@localhost ~]$ echo I love blue sky. > mydocuments.txt\n[aka@localhost ~]$\
  \ cat mydocuments.txt\nI love blue sky.\n\n[aka@localhost ~]$ set –o noclobber\n\
  [aka@localhost ~]$ echo the sky is azure. > mydocuments.txt\nsh: mydocuments.txt:\
  \ cannot overwrite file\n[aka@localhost ~]$ set +o noclobber\n[aka@localhost ~]$\
  \ echo the sky is azure. > mydocuments.txt\n[aka@localhost ~]$ cat mydocuments.txt\n\
  the sky is azure.\n\n第一条命令阻止了输出被覆盖，但第二个命令将其恢复到了之前的状态。\n\n#### 覆盖 noclobber\n\n假设我们开启了\
  \ `noclobber` 来阻止覆盖过程。尝试这一个。\n\n[aka@localhost ~]$ echo the sky is azure. > mydocuments.txt\n\
  sh: mydocuments.txt: cannot overwrite file\n[aka@localhost ~]$ echo the sky is azure.\
  \ >| mydocuments.txt\n[aka@localhost ~]$ cat mydocuments.txt\nthe sky is azure.\n\
  \n符号 `>|` 发挥了魔法。显然，`noclobber` 被覆盖了。如果你想重定向两个文件的内容而不覆盖第一个，有一个命令可以做到。正如我所说，我们有为此设计的魔法符号。所以，让我们这样做吧。\n\
  \n[aka@localhost ~]$ cat mydocuments.txt\nI love blue sky.\n\n[aka@localhost ~]$\
  \ echo the sky is azure. >> mydocuments.txt\n[aka@localhost ~]$ cat mydocuments.txt\n\
  I love blue sky\nthe sky is azure\n\n这个过程被称为追加（appending）。这很好，因为两个文件的内容在过程中合并了。\n\
  \n#### 重定向错误消息\n\n让我们先在终端模拟器中练习这个。\n\n[aka@localhost ~]$ echo hi everyone\nhi everyone\n\
  \n[aka@localhost ~]$ echo hi everyone 2> /dev/null\nhi everyone\n\n[aka@localhost\
  \ ~]$ zcho hi everyone 2> /dev/null\n[aka@localhost ~]$\n\n[aka@localhost ~]$ zcho\
  \ hi everyone\nsh: zcho: command not found\n\n\n\n\n所以，你可以看到这个命令如何让我们的显示不再那么杂乱。如果你输入错误，不会出现长长的解释。请确保将来保持显示整洁。\n\
  \n## 管道 (Pipelines)\n\n你的命令通过管道网络进行重定向。在管道的帮助下，标准输入和输出会被接收并显示。\n\n`|` 是管道操作符。它像一堵墙，帮助将一个输出传递到另一个虚拟地方。这就像你在传输某些物理商品。执行管道命令将帮助你将一个输出推送到另一个命令。不需要显示屏幕上有任何活动，也不需要通过临时文件进行枯燥的交换。管道在后台完全静默地完成所有过程。需要记住的一个重要点是，你只能发送数据，不能从同一个管道接收数据。信息的流向是单向的。\n\
  \n我使用 `less` 命令是因为因为它能显示几乎所有命令的标准输出。测试一下看看结果。结果可能因用户而异。\n\n```\n[aka@localhost ~]$\
  \ ls -1 /usr/bin | less\n```\n\n## 重定向标准输入\n\n### cat 命令 — 合并文件\n\n这个命令的特殊之处在于它倾向于读取一个或多个文件。它还可以移动文件并将其复制到标准输出。让我们看看它是运行的。\n\
  \n```\n[aka@localhost ~]$ cat 1s-output.txt\n```\n\n这里必须提到的是，有些用户认为 `cat` 与 `TYPE`\
  \ 命令相似。但事实并非如此。可以通过 `cat` 命令显示文件，而无需先进行分页。上面的命令显示了 `ls-output.txt` 文件的内容。输出将以短文本文件的形式出现，而不是分页的形式。这加快了处理速度。分页不仅花费大量时间，在屏幕上以页的形式显示它也更加复杂且耗时。\n\
  \n你可以将多个文件作为参数添加到 `cat` 命令中。该命令还可以用于追加多个文件。如果我们有多个名为 `snazzy.jpeg.01`、`snazzy.jpeg.02`\
  \ ………… `snazzy.jpeg.99` 的文件，现在你想合并所有这些文件。让我们尝试以下命令。\n\n```\n[aka@localhost ~]$ cat\
  \ snazzy.jpeg.0* > snazzy.jpeg\n```\n\n我们将获得顺序正确的文件。`cat` 命令欢迎与我们在键盘上输入内容相连的标准输入。\n\
  \n```bash\n[aka@localhost ~]$ cat > azure_sky.txt\nthe sky is turning azure.\n```\n\
  \n你刚刚使用 `cat` 命令创建了一个文件。你还在文件中放入了一些值。当你完成上述两个步骤后，按下 `ctrl + d` 到文件末尾。你可以通过相同的命令找回文件的内容。\n\
  \n```\n[aka@localhost ~]$ cat azure_sky.txt\nthe sky is turning azure.\n```\n\n\
  ### 管道：命令\n\n命令可以遍历标准输入以读取数据，然后将其发送到标准输出。这是通过被称为管道的特殊 shell 功能完成的。\n\n```\n[aka@localhost\
  \ ~]$ ls -1 /usr/bin | less\n```\n\n### 过滤器 (Filters)\n\n你可以利用管道执行与系统中数据相关的其他操作。你可以自由地将多个命令组合在单个管道中，这被称为过滤器。让我们尝试一个过滤器。对于这一个，我们将\
  \ `/bin` 和 `/usr/bin` 合并在一起，看看它们带给了我们什么。\n\n```bash\n[aka@localhost ~]$ ls /bin\
  \ /usr/bin | sort | less\n```\n\n这就是过滤器如何帮助你产生单个排序列表。这就是我们放入管道的 `sort` 命令的魔力。否则，每个目录都会有两个列表。查看多个目录这样更时间且更高效。\n\
  \n### grep\n\n这也是另一个用于在文件中查找文本模式的强大程序之一。让我们看看它是如何使用的。\n\n```\n[aka@localhost ~]$\
  \ grep pattern [file……]\n```\n\n该命令用于在文件中搜索匹配模式的行。让我们尝试一下命令。\n\n```bash\n[aka@localhost\
  \ ~]$ ls /bin /usr/bin | sort | uniq | grep zip\n```\n\n### head/tail\n\n此命令用于检索信息的特定部分。从命令名称可以明显看出，你可以打印特定文件的头部或尾部。这意味着你可以获取文件的前几行或同一个文件的最后几行。从开始的十行或从最后的十行。原理就是这样。可以通过应用\
  \ `-n` 选项来更改行数。让我们查看语法。\n\n```\n[aka@localhost ~]$ head -n 8 filename.txt\n```\n\
  \n此命令也可以用于管道。\n\n```bash\naka@localhost ~]$ ls /usr/bin | tail -n 10\n```\n\n通过\
  \ `tail` 选项，你可以实时查看文件，并查看进度。只要你保持屏幕打开，它们就会一直出现在你的屏幕上。停止你需要按下 `ctrl + C`。\n\n```\n\
  [aka@localhost ~]$ tail -f /var/log/messages\n```\n\n### 探索 tee 命令\n\nLinux 也有 `tee`\
  \ 命令。嗯，你可能在想高尔夫。想象你实际上在一个高尔夫球场击球。高尔夫是一项奇妙的运动，但在惊喜和魔力方面，Linux 更好。另一个类比是管道。你需要在管道上安装一个\
  \ `t` 来引导水流向水箱。\n\n该程序具有读取标准的特殊工作。它读取输入并复制到标准输出。作为结果，数据向下流动。你可以捕获通过管道的内容。让我们查看语法。\n\
  \n```\n[aka@localhost ~]$ ls /usr/bin | tee ls.txt | grep zip\n```\n\n### uniq 命令\n\
  \n该命令用于排序文件。`uniq` 和 `sort` 通常一起使用。了解更多关于 `uniq` 的信息，请查看它的 man 页。我已经向你介绍过 man 页。以下命令不会对重复项进行排序。你可以在终端运行它查看。\n\
  \n```bash\n[aka@localhost ~]$ ls /bin /usr/bin | sort | uniq -d | less\n```\n\n\
  要排序文件，你必须从语法中删除 `-d` 选项。现在尝试一下。\n\n```bash\n[aka@localhost ~]$ ls /bin /usr/bin\
  \ | sort | uniq\n```\n\n### wc 命令\n\n从缩写可见，这个用于统计文件内容中的单词。除了字节之外，它还统计文件中有多少行。\n\n\
  ```bash\n[root@localhost ~]$ wc mydocuments.txt\n```\n\n\n\n\n4598 64577 537456\
  \ `mydoc.txt`\n\n它将告诉你 `myddocuments.txt` 文件的行数、单词数和总字节数。与 Windows 操作系统不同，你不需要搜索每个文件的内容并检查文件的字节权重。管道命令（pipeline）将检索你所需的信息。\n\
  \n# Echo 的魔法\n\n我们知道 `echo` 命令会按照 shell 中书写的原样显示文本。你不知道的是，你可以将 `echo` 与不同的命令组合，获得神奇的结果。\n\
  \n## 某些通配符项（如 `(*)`）的扩展\n\nshell 窗口倾向于展开如 `*` 等简单命令。虽然对我们用户来说似乎什么都没有，但对 shell 来说，它可以有很多含义。这个过程被称为扩展（expansion）。shell\
  \ 解析这些符号并将其扩展为易于理解的单词或短语。单独的 `echo` 只是打印命令。你输入一个句子，`echo` 就会将其打印出来而不做任何修改。让我们来看看。\n\
  \n```\n[aka@localhost ~]$ echo I kept looking at the azure sky for five minutes.\n\
  I kept looking at the azure sky for five minutes.\n```\n\n如果我们在 `echo` 之后添加 `*`，结果将不再相同。shell\
  \ 将 `*` 视为通配符，其作用是匹配文件名中的字符。它会将 `*` 扩展为当前工作目录下的文件名。\n\n```\n[aka@localhost ~]$ echo\
  \ *bench.py hello.c\n```\n\n## 路径扩展\n\n让我们用 `echo` 命令尝试一些更有趣的东西。\n\n```\n[aka@localhost\
  \ ~]$ lsDesktop ls-output.txt Pictures TemplatesDocuments Music Public Videos\n\
  [aka@localhost ~]$ echo D*Desktop Documentsand\n[aka@localhost ~]$ echo *sDocuments\
  \ Pictures Templates Videos\n[aka@localhost ~]$ echo [[:upper:]]*Desktop Documents\
  \ Music Public Templates Videos\n```\n\n## 算扩展\n\n`echo` 命令也可以用于执行算术函数，有些相当复杂。通过这种方式，shell\
  \ 提示符充当了计算器。\n\n```\n[aka@localhost ~]$ echo $((2*2))\n4\n```\n\n该命令可以用于加、乘、减、除、取模和幂。你可以进行简单的数学，或者通过在单个脚本中嵌套不同的表达式来执行一些复杂的数学运算。让我们看看进展如何。\n\
  \n```\n[aka@localhost ~]$ echo $(($((5*75))+1000))\n1375\n```\n\n# 第 3 章：Linux 环境\n\
  \n现在你已经充分熟悉了 shell、它的用法以及执行不同任务的一些基本命令，我将转向内核的使用。你将学会如何使用内核，例如它是如何引导和启动的。让我们来看看内核的正常引导过程。我将其分为了一些基础的简化步骤。\n\
  \n1. 第一步是 `BIOS`。在这个阶段，会对系统的完整性进行彻底分析。`BIOS` 定位引导加载程序并执行它。引导加载程序可以在 CD、软盘或硬盘上。在\
  \ `BIOS` 将其加载到系统后，`MBR` 引导加载程序拥有控制权。好奇 `MBR` 是什么吗？让我们进入下一步来了解 `MBR`。\n\n2. `MBR`\
  \ 是 Master Boot Record（主引导记录）的缩写。`MBR` 可以追溯到硬盘或其他任何可启动磁盘的扇区。硬盘上的该扇区被称为 `/dev/had`\
  \ 或 `/dev/sda`。从大小来说，`MBR` 是一个非常轻量的程序。它的主要组件是主引导加载器，略小于 512 字节。这些以几个字节形式的信息主要关于\
  \ `GRUB`。Sylvia 在链式系统中学习过，如 `BIOS` 加载 `MBR`，然后 `MBR` 加载 `GRUB`。\n\n3. `GRUB` 是什么？它是\
  \ Grand Unified Bootloader（统一引导加载程序）的缩写。`GRUB` 也是内核镜像的加载器。如果系统中有一个镜像，`GRUB` 将将其作为默认镜像并立即加载。如果有多个镜像，`GRUB`\
  \ 将显示包含多个镜像的启动界面。你需要选择一个进行加载。如果你不选择，`GRUB` 将根据配置文件的设置加载默认镜像。\n\n4. 第四步是内核本身。`Kernel`\
  \ 运行 `/sbin/init` 程序，其进程 ID 为 1。`init` 项可以扩展为 `initrd`，进一步扩展为初始 RAM 磁盘（initial RAM\
  \ Disk）。`Kernel` 在从启动到挂载根文件系统的短时间内使用它。\n\n5. 在 `init` 开始运行后，你就到达了用户空间的起点。`init`\
  \ 从那里接管并运行系统。\n\n## 启动\n\n引导时会产生大量来自内核的诊断消息，然后是 `init` 接管系统操作后的进程消息。这些消息并不是顺序执行的，而且是不一致的。对于新用户来说，它们可能会令人困惑甚至产生误导。某些\
  \ Linux 发行版机制尝试通过启动界面和引导选项的变化来减少这些消息。你可以通过以下命令查看并读取这些消息。让我们来看看。我已经以超级用户的身份登录。让我们看看命令的结果。\n\
  \n```\n[aka@localhost ~]$ dmesg\n[0.000000] OF: fdt: Ignoring memory range 0x80000000\
  \ - 0x80200000\n[0.000000] Linux version 4.15.0-00049-ga3b1e7a-dirty (bellard@localhost.localdomain)\
  \ (gcc version 7.3.0 (Buildroot 2016.08-git-svn30683)) #11 Thu Nov 8 20:30:26 CET\
  \ 2018\n```\n\n它利用了内核的环形缓冲区（ring buffer）。以上是在页面上看到的内容的简短版本。它可能与上述不完全，但几乎一样。让我们通过不同的选项探索\
  \ `dmesg` 命令以获取更多信息。\n\n```\n[aka@localhost ~]$ dmesg | less\n```\n\n你可以配合 `dmesg`\
  \ 命令使用其他选项。让我们看看 Linux 中可以探索的各种选项。我不会详细介绍你在屏幕上看到的细节，但我会告诉你你在输入每个命令后可以得到什么。让我们看看语法。这次我切换了用户。\n\
  \n```\n[aka@localhost ~]$ dmesg –C\n```\n\n你可以使用此命令清除内核环形缓冲区。\n\n```\n[aka@localhost\
  \ ~]$ dmesg –c\n```\n\n你可以应用此命令清除所有消息。\n\n```\n[aka@localhost ~]$ dmesg –k\n```\n\
  \n这用于读取内核消息。\n\n```\n[aka@localhost ~]$ dmesg –L\n```\n\n它为消息内容着。其他选项如下。在终端中输入它们，看看它们能给你带来什么。\n\
  \n```\n[aka@localhost ~]$ dmesg –D\n```\n\n```\n[aka@localhost ~]$ dmesg –r\n```\n\
  \n```\n[aka@localhost ~]$ dmesg –s\n```\n\n```\n[aka@localhost ~]$ dmesg –n\n```\n\
  \n```\n[aka@localhost ~]$ dmesg –F\n```\n\n\n\n\n\n```bash\n[aka@localhost ~]$ dmesg\
  \ -e\n```\n\n## 内核初始化时你有哪些启动选项？\n\n## Linux 中的内核初始化\nLinux 中的内核初始化由一些关键步骤组成。它始于对中央处理器（CPU）的检查。之后是检查内存。接着发现设备、根文件系统运行，最后启动用户空间。\n\
  \n### 参数\n当内核开始运行时，它会从启动加载程序接收参数。这些参数引导内核应该如何启动。这些参数包含了诊断输出的规范，以及设备驱动的选项。可以通过一个专用命令查看这些参数。让我们来看看其语法。\n\
  \n```bash\n[aka@localhost ~]$ cat /proc/cmdline\n```\n\n并不是所有参数都是重要的，但其中一个至关重要的是根参数（root\
  \ parameter）。内核没有它无法运行，因为它无法找到 `init`。你可能想过在参数中添加一些它无法理解的内容吗？嗯，Sylvia 确实添加了。她在参数中添加了\
  \ `-s`。内核保存了该未知短语并将其传递给 `init`。内核将其解释为以单用户模式启动的命令。\n\n### 启动加载程序\n启动加载程序是一个负责在启动时加载必要任务的程序。此外，它还加载操作系统。在技术领域，启动加载程序也被称为启动管理器（boot\
  \ manager）。正如我已经解释过的，在 BIOS 完成对硬件的初始检查后，该程序会被启动。现在我们知道内核和参数位于根文件系统中。\n\n让我们简单看一眼启动加载程序的工作。启动加载程序必须从多个选项中选择一个内核。其次，在启动加载程序的帮助下，用户手动覆盖内核镜像名称以及参数。它还允许你在不同的内核参数之间切换。\n\
  \n现在的启动加载程序与以前不同了。它们变得更加先进，增加了诸如历史记录和菜单等功能。然而，专家们仍然认为启动加载程序的基本工作是提供关于内核镜像的不同选项以及参数的选择。\n\
  \n让我们来看看当你进入该领域时可能会遇到的多种启动加载程序。`GRUB`、`LOADLIN`、`LILO`、`coreboot` 是这个时代最流行的启动加载程序。让我们探索一下\
  \ `GRUB`。\n\n## 深入了解 GRUB\n启动加载程序是用户离开 Linux 操作系统的原因之一。如果你是 Windows 系统用户，你不需要担心启动加载程序，但\
  \ Linux 操作系统并非如此。作为 Windows 用户，你打开笔记本电脑或个人电脑就好了。如果系统启动过程中出现问题，你可以只需运行 Windows 恢复程序来修复损坏并将操作系统恢复到正常状态。你只需要点击按钮，剩下的工作由操作系统本身完成。这非常了不起，但它最大的问题是你无法学到任何关于操作系统内部的知识。Sylvia\
  \ 当了十年的 Windows 用户，她对启动加载程序是什么、它的作用是什么以及你如何使用它一无所知。\n\nLinux 走的是艰难的道路。它让用户学习操作系统中复杂事物的错细节。它将我们的思维转向操作系统的后台技术。让我们转向启动加载程序本身，了解它是如何处理的。\n\
  \n### 它是如何工作的？\n你让电脑启动，正如我解释过的，BIOS 在运行一些检查后，会将机器控制权交给不同用户不同的启动设备。它可以是软磁盘或硬盘驱动器。我们已经知道硬盘有不同的扇。第一个被称为主引导记录（`MBR`）。\n\
  \n`GRUB` 调出 `MBR` 代码并填入自己的代码。它帮助用户浏览文件系统，方便用户选择所需的内核镜像以及配置。`GRUB` 是 Grand Unified\
  \ Boot Loader（统一启动加载程序）的缩写。只需探索 `GRUB` 菜单即可了解更多信息。大多数启动加载程序对用户是隐藏的，为了访问启动加载程序，你应该在\
  \ BIOS 启动显示后立即按住 `SHIFT` 键。还有自动重启的问题。为了避免这种情况，按下 `ESC` 并禁用在 `GRUB` 菜单出现后立即计数的自动重启超时。如果你想查看启动加载程序的配置命令，按\
  \ `e` 进入默认启动选项。\n\n## 熟悉 GRUB\n让我们认识一下 `GRUB` 的表示法。\n\n### (hd0,1)\n如果你看这个条目，你会发现括号是条目不可分割的一部分。如果你删除它们，就会破坏语法。`GRUB`\
  \ 中的所有设备都有括号。`hd` 代表硬磁盘。如果设备不是硬盘，值将被替换为 `fd`（软磁盘）和 `cd`（CD-ROM 光）。请注意，还有两个数字。第一个数字指的是系统中硬盘的数量。在这里它表示第一块硬盘。同样，`1`\
  \ 表示第二块硬盘，而 `2` 表示第三块硬盘。以此此类推。\n\n你可以通过输入你想要探索的硬盘编号来更改整数值。从条目中明显看出，`GRUB` 无法区分 `SCSI`\
  \ 和 `IDE` 等不同类型的驱动。在 `GRUB` 菜单中，主分区可以通过从 `0` 到 `3` 的整数识别，其中 `0` 代表第一块硬盘，而 `3` 代表第四个分区。逻辑分区从\
  \ `4` 开始向上。\n\n`GRUB` 可以搜索所有分的 `UUID` 以定位内核。如果你想看 `GRUB` 在 Linux 操作系统上如何工作，只需在编辑器界面按\
  \ `C` 即可进入 `GRUB` 提示符。编辑器屏幕上会出现类似以下的内容。\n\n```text\ngrub> 这是 GRUB 命令行。从在此处输入任何命令开始使用。为了开始，你需要运行一个诊断命令。\n\
  grub> ls\n```\n\n\n\n\n\n`(hd0) (h0,msdos1)` 结果将是 GRUB 已知设备的设备列表。你可以看到只有一个磁盘 `hd0`\
  \ 和一个分区 `(hd0,msdos1)`。我们从这处可以获得的信息是，该磁盘包含一个 MBR 分 分区表。\n\n要深入了解更多信息，请在 GRUB 命令行中输入\
  \ `ls -1`。\n```\ngrub> ls -1\n```\n此命令告诉我们更多关于磁盘上分区的信息。你可以轻松地在 GRUB 系统中导航文件。让我们来看看它的文件系统导航。首先，你需要找到\
  \ GRUB 的根目录。\n\n```\ngrub> echo $root\nhd0,msdos1\n```\n\n你应该使用 `ls` 命令来列出根目录下的所有文件和目录。让我们看看如何操作。\n\
  \n```\ngrub> ls ($root)/\n```\n你可能会看到该特定分区上的目录名称列表。文件系统和目录可能会以 `etc/`、`bin/` 和 `dev/`\
  \ 的形式列出。\n\n## 如何配置 GRUB\n\n配置目录有一个名为 `grub.cfg` 的中心文件。此外，加载到系统上的多个模块也是配置系统的一部分。这些模块的命名为\
  \ `.mod`。这应该是配置系统的开始。\n\n### BEGIN /etc/grub.d/00_header ###\n\n`/etc/grub.d` 目录下的所有文件都是多个\
  \ shell 脚本程序。通过组合，它们构成了 `grub.cfg` 中心配置文件。这是 GRUB 配置的默认结构。\n\n现在让我们转向允许你更改命令的功能。简短的回答是，你可以轻松地做到。你可以根据需要进行自定义。你知道存在一个中心配置文件。你只需要为了自定义而创建另一个文件。你可以将文件命名为\
  \ `customized.cfg`。这将被添加到 GRUB 的配置目录中。你可以在以下路径找到它：`/boot/grub/custom.cfg`。\n\n关于自定义有两个选项。可以通过\
  \ `/etc/grub.d` 访问配置目录。该目录提供了 `40_custom` 和 `41_custom`。`40_custom` 可以在没有任何帮助的情况下由自行编辑，但它容易薄弱且不稳定。另一个\
  \ `41_custom` 比前一个简单得多。该文件包含一组命令，在 GRUB 启动时准备好加载。一个小例子是 Linux 发行版 Ubuntu 允许用户通过添加内存测试器选项（`memtest86+`）来编辑配置设置。\n\
  \n如果你想编写一个全新的配置并将其安装到系统上，可以通过使用 `-o` 选项将配置写入目录来实现。让我们来看看用于完成配置过程的语法。\n\n```\ngrub-mkconfig\
  \ -o /boot/grub/grub.cfg\n```\n\n对于 Ubuntu Linux 发行版系统的用户来说，事情非常简单容易。你只需要运行以下命令。\n\
  ```\ninstall-grub\n```\n\n## 如何安装 GRUB\n\n在继续操作安装程序之前，请阅读此引导加载程序对安装目的的要求。请确定以下几点：\n\
  \n*   当前系统看到的 GRUB 目录应该被正确分析。通常 `/boot/grub` 是该目录的名称。如果你在另一个系统上安装 GRUB，该名称可以是其他的。\n\
  *   你必须确定 GRUB 目标磁盘使用的是什么设备。\n\n由于 GRUB 是一个模块化系统，它需要读取包含在 GRUB 目录目录的文件系统。\n\n```\n\
  grub-install /dev/sda\n```\n在此命令中，`grub-install` 是用于安装 GRUB 的命令，`/dev/sda` 是我正在使用的当前硬盘。如果你做错了，这可能会给你带来很多问题，因为它具有更改系统启动顺序的能力。这增加了该命令的重要性。如果在此过程中真的发生了任何错误，你需要一个紧急启动计划。\n\
  \n### 在外部设备上安装 GRUB\n\n你也可以将 GRUB 安装在外部设备上。你必须先指定它将要安装的目录。例如，如果你的系统上有 `/dev/sda`。你的系统将在\
  \ `/mnt/boot/grub` 中看到 GRUB 文件。你必须通过输入以下命令来引导系统。\n\n```\ngrub-install --boot-directory=/mnt/boot\
  \ /dev/sda\n```\n\n## 让我们看看 GRUB 是如何工作的\n\n它由多个步骤组成。让我们一个一个来看。\n\n*   我们现在知道了 Linux\
  \ 操作系统是如何启动的。BIOS 在启动时触发。当它对设备进行必要的检查后，它会初始化设备硬件。之后，它尝试追踪启动顺序以获取启动代码。\n*   当找到启动代码后，下一步是加载\
  \ BIOS 或固件。然后是它的执行。之后就是 GRUB 启动的时间。\n*   GRUB 开始在你的 Linux 操作系统上加载。\n*   首先，内核启动。现在\
  \ GRUB 处于更好的位置来访问你的硬盘和存储在系统上的文件系统。\n*   然后 GRUB 移动到识别它从中启动的分区。下一步是加载配置。\n*   现在，作为用户，如果你需要更改配置，这就是你有权更改的时候。\n\
  *   如果你不想更改它，超时很快就会结束。现在 GRUB 将执行默认或更改后的配置。\n*   在尝试执行配置时，GRUB 会从它启动的分区中以模块的形式加载一些额外的代码。\n\
  *   现在 GRUB 运行启动命令并执行内核。\n\n我与 Sylvia 分享我的周末日常活动。我是户外活动的热爱好者，比如在野外用弩箭进行狩猎。Sylvia\
  \ 喜欢在崎岖和多丘的地形上骑自行车。当我们周末在一起时，我们非常非常享受。对她来说错过周末是很罕见的。但最后，她连续错过了不是一个而是三个周末。所以，我给她打电话想知道是怎么了。她回答说，她对\
  \ Linux 有限的知识在办公室里并没有帮到她。她很担心，因为她急于完成工作，而大部分时间都在与学习过程挣扎。这次是用户空间和环境的问题。虽然学习并不困难，但在习惯它之前需要时间。\n\
  \n我必须承认，Sylvia 花费的时间并不多。在正确的指导下，你可以像专业人士一样通过它。练习得越多，对它的理解就越深。用户空间指的是内核开始的地方。用户空间如何移动。让我们在以下步骤中查看：\n\
  \n*   `init`\n*   启动低级服务，如 `udevd` 以及 `syslogd`\n*   配置网络。\n*   诸如打印等服务继续进行。\n*\
  \   接下来是登录 Shell、图形用户界面 (GUI)。\n*   其他你可能在 Linux 操作系统上安装的应用程序开始运行。\n\n\n\n\n\n`init`\
  \ 是一个用户态程序，通常位于 `/sbin` 目录。你可以通过运行 `PATH` 命令来找到该目录。`PATH` 是一个变量，我将在接下来的章节中深入讨论这个变量。System\
  \ V init、`Upstart` 和 `System V init` 是这些 Linux 发行版中 `init` 的实现。Android 有它自己独特的 `init`。\n\
  \n`System V init` 在系统启动时触发一个只需要单个任务的序列。这个系统看起来简单，但严重阻碍了内核的性能。此外，高级用户非常讨厌这种简化的启动方式。系统按照一组固定的服务启动，因此，如果你想在系统上运行任何新服务，这里没有标准化的方法来适应任何新组件。这是一个缺点。\n\
  \n另一方面，`Upstart` 以及 `systemd` 纠正了性能问题。它们允许多个服务并行启动以加快启动速度。`systemd` 是为那些寻求目标导向系统的人准备的。你可以灵活地定义你的目标以及实现该目标所需的时间跨。此外，它还能解析目标。另一个吸引人的选项是，你可以延迟特定服务的启动，直到你想要它加载为止。\n\
  \n`Upstart` 接收不同的事件并运行产生更多事件的任务。因此，`Upstart` 运行更多的作业。作为用户，你可以获得一种跟踪服务的进阶方法。这些最新的\
  \ init 系统不再依赖脚本。\n\n## Linux 中的运行级别 (Runlevels)\n当你启动 Linux 操作系统时，它会进入默认运行级别，并倾向运行附加到特定运行级别的脚本。`Runlevels`\
  \ 有不同的类型，你也可以在它们之间开启和关闭。例如，有一个运行级别专门为系统恢复和操作系统维护相关的任务设计。例如，`System V init` 脚本被用作默认运行级别。Ubuntu\
  \ 也使用相同的。\n\n我们现在很清楚，Linux 在启动时启动的 `init` 转而启动其他系统进程。如果你想控制 `init` 应该启动和不启动什么，你应该编辑\
  \ `init` 读取的启动脚本。`init` 一个有趣的一点是它能够运行不同的运行级别，例如一个用于网络，另一个用于图形用户界面。在运行级别之间切换也非常简单。只需一个命令即可从图形桌面跳转到文本终端。这节省了大量时间。让我们进一步研究运行级别以更好地理解它们。\n\
  \n### System V 运行级别\n系统中运行着不同的进程组，如 `crond`。这些 `runlevels` 从 0 到 6 分类。系统从特定的运行级别启动，但使用另一个运行级别关闭，该级别有一组特定的脚本，以便以适当的方式关闭所有程序并停止内核。如果你有一个\
  \ Linux 系统，可以输入以下命令检查你当前处于哪个运行级别。\n\n```bash\n[aka@localhost ~] who -r\n```\n\n\
  你的屏幕会告诉你运行级别在 0 到 6 范围内的阶段，以及该运行级别在系统中创建的日期和时间。Linux 操作系统中的 `Runlevels` 有很多工作要做，例如区分关机、启动、终端模式和不同的用户模式。从\
  \ 0 到 6 的七个数字可以分配给不同的通道。基于 Fedora 的 Linux 操作系统将 5 分配给图形用户界面，将 4 分配给文本终端。\n\n在标准运行级别中，0\
  \ 分配给系统关机，6 分配给重启，而 1 分配给单用户模式。我知道这些运行级别非常有趣，但它们正变得过时。\n\n### system init\n`system\
  \ init` 可以帮助你更好地处理系统启动，并帮助你处理如 `cron` 和 `inetd` 等服务。用户喜欢的它的一个功能是它能够延迟操作系统和其他服务的启动，直到它们变得至重要。`systemd`\
  \ 的全称是 `System Management Daemon`。`systemd` 现在正在取代 `init`，这种变动背后有一些非常充分的理由。让我们看看\
  \ `init` 是如何启动系统的。\n\n当最后一个启动返回成功并加载到操作系统的内存时，一个任务开始。这导致了系统启动时间的过度延迟，给用户带来了沮丧。现在逻辑上可能会认为系统会增加一些燃料来加速这个过程，但抱歉你错了。它确实缩短了启动时间，不是通过增加额外的燃料，而是通过移除减速带（例如整洁地完成必要的任务）。\n\
  \n它在你的系统中做了很多工作，以至于它的职责在一次讨论中很难掌握，但我会尽力。让我们它在你的系统中做了什么：\n\n*   它通过正确排序任务来提高效率，使启动过程更简单。\n\
  *   加载你的系统配置。\n*   确定默认启动目标及其依赖项。\n*   激活启动目标。\n\n\n\n\nsystemd 和 init 之间的区别在于前者为用户提供的灵活性。systemd\
  \ 仅仅避免了不必要的启动序列。\n\n# Linux 环境\n\n那是在秋天。黄红色的叶子从树上飘落，宛如被逐出天堂的天使。它们苍白而颓败，静静地躺在小径和路边的绿化带上。一位手里拿着拐杖的老妇正试图穿过马路。幸运的是，她得到了一恰巧路过的金发年轻女士的帮助。那是周日。太阳躲在城市摩天大楼上方的厚厚云层中，但天气很和煦，是那种让你想去海滩的天气。于是我去海滩了。但等一下。我刚才提到那个帮助老人的金发女士了吗？噢噢！那是西尔维亚（Sylvia）。是的，她确实陪我去了海滩。“今天天气不错吧？要喝点什么吗？”她拿出一瓶桃肉汁。“我不介意，”我微笑回答道。“好，好，好，我终于开始自己熟悉\
  \ Linux 了，”她开始说道。我盯着她，脸上带着一丝尚未完全成熟的皱眉。“看在份份上，我们现在是周末。如果你是因为某种不幸的偶然和我一起来到海滩，请不要破坏这个时刻。”但她就像对待\
  \ Linux 和编程语言的新手一样，是不可阻挡的。\n\n我妥协了。她对那天的 Linux 环境感到好奇。好吧，这个话题很有趣，于是我继续尝试向她介绍更多相关知识。通过想象\
  \ Linux 环境以及我正在日光浴的海滩，你眼前的画面可能是很有趣的。也许你的大脑正试图在 Linux 环境与我们周围普通的环境之间建立一个类比。\n\n让我来解释一下。是的，它们大同小异。就像我们生活在环境中；shell\
