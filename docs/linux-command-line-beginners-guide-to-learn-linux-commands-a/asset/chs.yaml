  \ Numeric Digit: 5\nThe Numeric Digit: 10\nThe Numeric Digit: 11\nThe Numeric Digit:\
  \ 12\nThe Numeric Digit: 13\nThe Numeric Digit: 14\n\n### 处理循环的输出\nshell 给了你机会将循环的输出重定向到特定的文件。你需要在\
  \ shell 窗口中输入你构思的脚本。你需要在循环结束时创建一个文件。循环脚本的输出将保存在你创建的文本文件中。当你练习时，它看起来会更简单。让我们直接进入\
  \ shell 窗口。\n\n[aka@localhost ~]$ #!/bin/bash\n[aka@localhost ~]$ #redirecting the\
  \ output of the loop toward a file\n[aka@localhost ~]$ `for ((x=1 ; x<10;x++))>\
  \ do> echo \"the numeric digit is $x\"> done > azuresky.txt`\n[aka@localhost ~]$\
  \ echo \"the command is finished.\"\nthe command is finished.\n[aka@localhost ~]$\
  \ `cat` `azuresky.txt`\nthe numeric digit is 1\nthe numeric digit is 2\nthe numeric\
  \ digit is 3\nthe numeric digit is 4\nthe numeric digit is 5\nthe numeric digit\
  \ is 6\nthe numeric digit is 7\nthe numeric digit is 8\nthe numeric digit is 9\n\
  \n类似的技术可以用于将你的循环脚本的输出通过管道传递。\n\n## 定义函数\n函数 允许你定义代码块，并在脚本中多次调用。这可以提高代码的重用性并易于维护。\n\
  \n```bash\n#!/bin/bash\n## 定义一个函数\nmy_function() {\n  echo \"Hello, $1!\"\n}\n\n\
  ## 调用函数\nmy_function \"World\"\nmy_function \"Alice\"\n```\n\n### 函数的返回值\n函数可以使用\
  \ `return` 语句返回返回值。注意，返回值通常是一个整数。\n\n### 循环中的 break\n在嵌套循环中，`break` 只能跳出所在的当前循环。要跳出外层循环，可以使用\
  \ `break 2`。\n\n```bash\n#!/bin/bash\nfor (( i = 1; i < 3; i++ ))\ndo\n  for ((\
  \ j = 1; j < 5; j++ ))\n  do\n    if [ $j -eq 2 ]; then\n      break 2\n    fi\n\
  \    echo \"i=$i, j=$j\"\n  done\ndone\n```\n\n\n\n\n\n$我在脚本后后面定义了 `functest1`，当我使用它时它运行正常，但我在使用之前没有定义\
  \ `functest2`，所以导致了错误信息。你应该注意的一点是函数的名称。你不应该给不同的函数分配相同的名称。每个函数必须有唯一的名称，否则 shell 将无法分别识别它们，并会用新定义覆盖之前的定义。请记住，不会有任何错误消息来提醒你你所犯的错误。$\n\
  \n```bash\ncat testfile\n#!/bin/bash\n## 为不同的函数使用同名的名称\nfunction functest1 {\necho\
  \ \"I am defining the function with a unique name\"\n}\nfunctest1\nfunction functest1\
  \ {\necho \"I have repeated the function name assigning it to another function\"\
  \n}\nfunctest1\necho \"The script ends here\"\n```\n$ ./testfile\nI am defining\
  \ the function with a unique name\nI have repeated the function name assigning it\
  \ to another function\nThe script ends here\n\n## 如何使用 shell 函数返回返回值\n如果说谈到默认退出状态，它是函数中最后一个命令返回的退出状态。\n\
  \n```bash\ncat testfile\n#!/bin/bash\n## 学习 shell 函数的退出状态\nfunctest1() {\necho \"\
  I am attempting to display a file which is non-existent\"\nls -l badfile\n}\necho\
  \ \"it is time to test the function:\"\nfunctest1\necho \"The exit status is: $?\"\
  \n```\n$ ./testfile\nit is time to test the function:\nI am attempting to display\
  \ a file which is non-existent\nls: badfile: No such file or directory\nThe exit\
  \ status is: 1\n$退出状态结果为 1，因为最后一个命令执行失败。\n\n```bash\ncat testfile\n#!/bin/bash\n\
  ## 测试 shell 函数退出状态的时间\nfunc1() {\nls -l badfile\necho \"We should now test a bad\
  \ command\"\n}\necho \"shall we test the function now:\"\nfunc1\necho \"The exit\
  \ status is: $?\"\n```\n$ ./test4b\nshall we test the function now:\nls: badfile:\
  \ No such file or directory\nWe should now test a bad command\nThe exit status is:\
  \ 0\n\n## 如何使用函数输出\n我们已经看到如何捕获和处理 shell 变量的输出。现在我将解释你如何捕获函数的输出。\n\n```bash\ncat\
  \ testfile\n#!/bin/bash\n## 我将使用 echo 命令返回一个值\nfunction dbl {\nread -p \"Enter a\
  \ value: \" value\necho $[ $value * 5 ]\n}\nresult=`dbl`\necho \"The new value is\
  \ $result\"\n```\n$ ./testfile\nEnter a value: 300\nThe new value is 1500\n$ ./testfile\n\
  Enter a value: 500\nThe new value is 2500\n$echo 将显示数学计算的结果。脚本获取的是 `dbl` 函数的值，而不是定位退出状态作为最终答案。因此，我们重定向了\
  \ shell 以捕获函数的输出。\n\n## 如何向 shell 函数传递参数\n函数可以使用标准参数环境变量来表示从 CLI 传递给函数的任何参数。变量 `$0`\
  \ 于表示函数的定义。其他参数如 `$1`、`$2,$3` 等用于定义命令行上的参数。还有一个特殊变量 `$#` 用于确定命令行上的参数总数。参数应该写在编写函数的同一条命令行上。\n\
  \n```bash\ncat testfile\n#!/bin/bash\n## 如何向函数传递参数\nfunction addem {\nif [ $# -eq\
  \ 0 ] || [ $# -gt 2 ]\nthen\necho -1\nelif [ $# -eq 1 ]\nthen\necho $[ $1 + $1 ]\n\
  else\necho $[ $1 + $2 ]\nfi\n}\necho -n \"Adding 20 and 30: \"\nvalue=`addem 20\
  \ 30`\necho $value\necho -n \"Shall we try to add only one number: \"\nvalue=`addem\
  \ 20`\necho $value\necho -n \"This time try to add no numbers: \"\nvalue=`addem`\n\
  echo $value\necho -n \"Let’s add three numbers this time: \"\nvalue=`addem 20 30\
  \ 40`\necho $value\n```\n$ ./test6\nAdding 20 and 30: 50\nLet’s try adding just\
  \ one number: 40\nNow trying adding no numbers: -1\nFinally, try adding three numbers:\
  \ -1\n$shell 按照它的指示操作。当参数多于两个时，它返回 `-1` 的值。当只有一个参数时，它将数字与其相加。当有两个参数时，它将它们相加得到结果。\n\
  \n## 如何在 shell 函数中使用全局变量\n变量有多种用途，这使得学习它们时往往很困惑。你也可以在 shell 函数中使用它们。它们在这里的角色不同。你可以在\
  \ shell 函数中使用以下变量：\n\n- Global\n- Local\n\n全局变量在 shell 脚本中有效。即使你在主脚本中定义了它的值，你也可以在函数获取它的值。\n\
  \n```bash\ncat testfile\n#!/bin/bash\n# 如何使用全局变量传递值\nfunction dbl {\nvle=$[ $vle\
  \ * 2 ]\n}\nread -p \"Enter a vle: \" vle\ndbl\necho \"The new value is: $vle\"\n\
  ```\n$ ./testfile\nEnter a vle: 300\nThe new vle is: 600\n$不要混淆，我使用了 `vle` 而不是 `value`。变量\
  \ `$vle` 在主脚本中定义，但在函数内部仍然有效。\n\n```bash\ncat testfile\n#!/bin/bash\n## 让我们由于错误使用变量会导致情况变得多糟糕\n\
  function functest1 {\ntemp=$[ $value + 5 ]\nresult=$[ $temp * 2 ]\n}\ntemp=4\nvalue=6\n\
  functest1\necho “We have the result as $result”\nif [ $temp -gt $value ]\nthen\n\
  echo “temp is larger”\nelse\necho “temp is smaller”\nfi\n```\n$ ./badtest2\nThe\
  \ result is 22\ntemp is larger\n\n局部变量也用于函数。局部变量主要用于内部。在变量声明之前放置 `local` 关键字。你可以在给变量赋值时可以使用局部变量。通过关键字的帮助，shell\
  \ 更容易识别函数脚本内部的局部变量。如果在函数脚本外部出现任何同名的变量，shell 会认为它是一个独立的值。\n\n```bash\n[aka@localhost\
  \ ~]$ #!bin/bash\n[aka@localhost ~]$ #I will attempt to an array variable\n[aka@localhost\
  \ ~]$ function functest1 {\necho \"The parameters are: $@\";\nthisarray=$1;\necho\
  \ \"the array is ${myarray[*]}\";}\n[aka@localhost ~]# myarray=(1 2 3 4 5 6 7 8\
  \ 9)\n[aka@localhost ~]# ehco \"the original array is ${myarray[*]}”\nfunctest1\
  \ $myarray\n```\n$ ./testfile\nThe original array is: 1 2 3 4 5 6 7 8 9\n./testfile:\
  \ thisarray[*]: bad array\nThe received array\n\n$你必须为数组变量分配它的值，然后将这些值作为函数参数。\n\n\
  ```bash\n[aka@localhost ~]$ #!bin/bash\n[aka@localhost ~]$ #I will attempt to an\
  \ array variable\n[aka@localhost ~]$ function functest1 {\nlocal newarray\nnewarray=(echo\
  \ “$@’)\necho \"The value for the array is: ${newarray]}\"\n```\n$ ./testfile\n\
  The original array is: 1 2 3 4 5 6 7 8 9\nThe new array is: 1 2 3 4 5 6 7 8 9\n\n\
  ## 使用函数创建一个库\n如果你是办公室的行政助理，这会非常有用。你可以节省大量原本花在编写重复脚本上的时间。你可以创建一个库文件并根据需要多次使用。\n\n\
  ```bash\ncat libfile\n## 使用 shell 函数创建库文件\nfunction addem {\necho $[ $2 + $3 ]\n\
  }\nfunction multem {\necho $[ $5 * $2 ]\n}\nfunction divem {\nif [ $2 -ne 0 ]\n\
  then\necho $[ $1 / $2 ]\nelse\necho -1\nfi\n}\n```\n$现在可以在脚本中填写文件名并获得预期的输出。\n\n\
  ```bash\ncat testfile\n#!/bin/bash\n## 使用你在库文件中定义的函数\n./libfile\nval1=20\nval2=10\n\
  result1=`addem $val1 $val2`\nresult2=`multem $val1 $val2`\nresult3=`divem $val1\
  \ $val2`\necho \"The result of adding them is: $result1\"\necho \"The result of\
  \ multiplying them is: $result2\"\necho \"The result of dividing them is: $result3\"\
  \n```\n$ ./testfile\nThe result of adding them is: 30\nThe result of multiplying\
  \ them is: 200\nThe result of dividing them is: 2\n\n\n\n\n\n## 在命令行上使用函数\n\n让我们学习如何在命令行上使用函数。\n\
  \n```bash\nfunction divem {\n  echo $[ $1 / $2 ];\n}\ndivem 200 1020\n```\n\n```bash\n\
  function doubleit {\n  read -p \"Enter val: \" val\n  echo $[$ val * 5 ];\n}\ndoubleit\n\
  Enter value: 50225\n```\n\n```bash\nfunction multem {\n  echo $[ $1 * $2 ];\n}\n\
  multem 100 100\n```\n\nShell 函数是把脚本代码放置在一个地方极极方法，这样你可以在需要时重复调用它。它消除了重复编写的操作。如果你需要使用大量函数来处理某些重负载任务，你可以选择创建函数库。\n\
  \n## 如何在 shell 中创建文本菜单\n\n是时候通过让脚本具有交互性让脚本变得更有趣了。这是纯粹的编程。如果你厌倦了在办公室整天与客户交道，可以为他们提供一个交互式菜单供供选择。Linux\
  \ 可以让这一切变得有趣。\n\n显然，你首先需要有一个布局，然后才是菜单。你可以添加想要包含在菜单中的内容。在创建菜单之前，运行 `clear` 命令是一个好习惯。之后，你可以输入\
  \ `echo` 命令来显示菜单的不同元素。你可以在 `-e` 命令的帮助下添加换行符和制表符。命令行默认只显示可打印字符。\n\n```bash\nclear\n\
  echo\necho -e \"\\t\\t\\tWelcome to the Admin Menu\\n\"\necho -e \"\\t1\\. Her will\
  \ be displayed the disk space\"\necho -e \"\\t2\\. Here will be displayed the logged\
  \ on users\"\necho -e \"\\t3\\. Here will be displayed the memory usage\"\necho\
  \ -e \"\\t0\\. Exit\\n\\n\"\necho -en \"\\t\\tEnter your option: \"\n```\n\n由于最后一行使用了\
  \ `-en` 选项，显示内容的末尾不会有换行符。这将允许用户输入内容。你可以通过以下命令获取并读取客户留下的输入。\n\n```bash\nread -n 1\
  \ option\n```\n\n你可以将函数分配给菜单。编写这些函数非常有趣。关键是为菜单中的每个项目创建单独的函数。为了省去麻烦，可以创建存根函数（stub\
  \ functions），这样你在 shell 中顺畅工作时就 own 需要放入什么。完整的函数不会阻止在 shell 中运行，这会中断你的工作。如果你将整个菜单放在一个函数脚本中，工作将会更顺畅。\n\
  \n```bash\nfunction menu {\n  clear\n  echo\n  echo -e \"\\t\\t\\tWelcome to the\
  \ Admin Menu\\n\"\n  echo -e \"\\t1\\. Her will be displayed the disk space\"\n\
  \  echo -e \"\\t2\\. Here will be displayed the logged on users\"\n  echo -e \"\\\
  t3\\. Here will be displayed the memory usage\"\n  echo -e \"\\t0\\. Exit\\n\\n\"\
  \n  echo -en \"\\t\\tEnter your option: \"\n  read -n 1 option\n}\n```\n\n正如我已经讨论过的，这将帮助你通过只需调用函数命令随时查看菜单。现在你需要使用\
  \ `case` 命令来整合布局和函数，使菜单能够实时运行。\n\n```bash\ncat menu1\n#!/bin/bash\n# simple script\
  \ menu\nfunction diskspace {\n  clear\n  df -k\n}\nfunction whoseon {\n  clear\n\
  \  who\n}\nfunction memusage {\n  clear\n  cat /proc/meminfo\n}\nfunction themenu\
  \ {\n  clear\n  echo\n  echo -e \"\\t\\t\\tWelcome to the Admin Menu\\n\"\n  echo\
  \ -e \"\\t1\\. Her will be displayed the disk space\"\n  echo -e \"\\t2\\. Here\
  \ will be displayed the logged on users\"\n  echo -e \"\\t3\\. Here will be displayed\
  \ the memory usage\"\n  echo -e \"\\t0\\. Exit\\n\\n\"\n  echo -en \"\\t\\tEnter\
  \ your option: \"\n  read -n 1 option\n}\nwhile [ 1 ]\ndo\n  case $option in\n \
  \   0)break ;;\n    1)diskspace ;;\n    2)whoseon ;;\n    3)memusage ;;\n    *)\n\
  \      clear\n      echo \"Sorry, you went for the wrong selection\";\n      ;;\n\
  \  esac\n  echo -en \"\\n\\n\\t\\t\\tHit any key on the keyboard to continue\"\n\
  \  read -n 1 line\ndone\nclear\n```\n\n## 结论\n\nSylvia 现在已经是一个热心的学习者。她承认她一生以来所恨的东西现在变成了她的生命线。使用的易用性、速度、对电脑的控制力以及\
  \ Linux 给她的乐趣是无与伦比的。她现在已经在家的个人电脑上安装了 Linux。Sylvia 现在正朝着成为 Linux 专家的道路前进。我想由于她练习\
  \ shell 的方式，她很快就能在命令行方面给我提供建议了。她永远不会告诉任何人的技巧是她写了一个日记，在记录了所有重要的命令，以便在需要时轻松调用。最终，这帮助她记住了命令。\n\
  \nLinux 是一种操作系统，就像你有 Windows 或 Mac OS X 一样。有人说它浮于软件形式和硬件形式的操作系统之间。程序员和白黑客认为 Linux\
  \ 比 Windows 操作系统更好。另一方面，必须处理日常办公工作或玩游戏的普通人更倾向于 Windows 操作系统。Linux 确实优于 Windows，这种观点背后是有原因的。让我们分析一下它们，这样当你读完这本书后，对不同的操作系统会有更清晰的认识。引用一个例子是恰当的。如果你买了一部高端手机，但看不到它内部是什么以及它是如何运行的？Windows\
  \ 操作系统就像那部手机。你可以使用它，享受它，但你不知道它是如何工作的、如何供电的以及如何布布的。相反，Linux 是开源的。你可以随时喜欢进入它的源代码。\n\
  \n在技术方面，世界运行得非常快。虽然世界上有很多好人在为网络世界增添积极事物，例如可以真正帮助你处理日常活动的操作系统和应用程序，但也不缺少那些坏人，他们不断试图潜入你的个人电脑，抢夺任何可以帮助他们赚钱的重要信息。现在，保护自己免受那些怀有此类邪恶设计的人侵害是你的首要任务。拥有这种保护的基本方法是获取一个能够防止此类攻击的操作系统。\n\
  \nWindows OS 极易受到黑客攻击。我不能声称 Linux 是绝对不可破解的，但它仍然比 Windows 好得多。它的包管理和仓库等功能使它比 Windows\
  \ 更安全。如果你在个人电脑上安装了 Windows OS，你就一直面临系统感染病毒的风险，这就是为什么你在安装 Windows OS 之后的第一件事就是购买杀病毒软件以保持电脑得到良好保护。然而，在个人电脑上使用\
  \ Linux，这种需求被消除了。\n\nWindows OS 对要安装的系统规格非常敏感。例如，要在你的系统上安装 Windows 10，你需要更新 RAM\
  \ 和 HDD 内存。我的朋友有一部安装了 Windows 7 的笔记本电脑。突然，他的系统开始显示微软已停止支持 Windows 7，他必须在电脑上安装 Windows\
  \ 10。该信息还读到一条警告，最好购买一台公司已经安装好 Windows 10 的新电脑。这是在“建议操作”标题下。正如大多数人所做样，他买了一台新电脑并卖掉了旧的。\n\
  \nLinux 的情况完全不是这样。你只需要满足最低系统要求并启动操作系统，无需担心它的过期。Linux 具有复活旧电脑系统的能力。如果你有一个拥有 256 MB\
  \ RAM 和旧处理器的系统，就足够运行 Linux 了。现在对比一下需要 8GB RAM 才能流畅运行的 Windows 10。如果你给 Linux 操作系统相同的系统规格，它无疑会让你在相对于\
  \ Windows OS 时获得优势。\n\n此外，Linux 最适合程序员。它支持所有编程语言，如 Java、Python、Ruby、Perl 和 C++。此外，还有许多适合程序员的程序。特别是\
  \ Linux 上的包管理器是程序员顺利完成工作所需要的。Linux 提供了广泛的软件更新，安装速度更快，不像 Windows 为了安装最新更新而重启多次。除了所有好处外，最大的是自定义化选项。你在\
  \ Windows 中得到的任何东西都是真理。你不能为了方便使用而改变它。在 Linux 中，情况发生了巨大的变化。你可以自定义不同的功能。你可以根据意愿添加或删除操作系统的不同功能。保留你需要的，删除你不喜欢的，因为它是一个开源系统。你还可以在你的系统中添加或放弃各种壁纸和图标主题以自定义它的外观。\n\
  \n也许 Linux 最大的好处是你可以从网上免费获取它。不像 Windows OS，你不需要购买它。\n\n这本书帮助用户学习 Linux 命令行界面的基础，这使得\
  \ Linux 与所有其他操作系统不同。现在你已经读到了最后，我希望你已经学会了让 Linux 使用变得有趣的秘密。我希望消除了对命令行的恐惧。\n\n"
