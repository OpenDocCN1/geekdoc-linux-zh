  - 这是 testdrive(1) 实用程序的全局配置文件。
- - '##'
  - CACHE 是缓存 ISO 和磁盘镜像的目录
- - '##'
  - '默认: $HOME/.cache/testdrive'
- - '##'
  - CACHE_IMG 和 CACHE_ISO 分别认为 $CACHE/img 和 $CACHE/iso。
- - '##'
  - 如果你需要，可以显式地设置它们（如果你正在尝试移除镜像 /dev/sh，我会特别感兴趣。请确保那里有足够的空间！！！
- - '##'
  - CLEAN_IMG 将在运行结束时删除刚刚生成的镜像。
- - '##'
  - 将保留，除非发生更改（即创建了磁盘镜像，但实际上没有尝试安装）。
- - '##'
  - 如果从 /dev/shm 运行镜像，则默认情况下镜像将被删除
- - '##'
  - VIRT 是要使用的虚拟机监控程序类型
- - '##'
  - VIRT 可以是 'kvm', 'virtualbox' 或 'parallels'
- - '##'
  - MEM 是分配虚拟机客机的内存量（单位：MB）
- - '##'
  - '默认: 384'
- - '##'
  - SMP 是当在 KVM 中运行时分配虚拟机客机的处理器数量。
- - '##'
  - 默认是 CPU 的数量。
- - '##'
  - DISK_SIZE 是磁盘镜像的大小
- - '##'
  - '默认: 6G'
- - '##'
  - KVM_ARGS 是参数字符串
- - '##'
  - DISK_FILE 是磁盘镜像的完整路径
- - '##'
  - '默认: CACHE/$ISO'
