  md: "# **Listing 4.4** Finally! A filled-in circle.\n\n```\n```\nvoid book_solid_circle(int\
    \ xc, int yc, int radius)\n{\n    double theta,\n        costheta,\n        sintheta;\n\
    \n    int degrees,\n        y,\n        old_y = 0;\n\n    for (degrees = 0; degrees\
    \ < 360; degrees++)\n    {\n        theta = (PI / 180) * degrees;\n        costheta\
    \ = cos(theta);\n        sintheta = sin(theta);\n        y = yc + radius * costheta;\n\
    \        if (degrees > 0)\n        {\n            while ((old_y - y) > 1)\n  \
    \          {\n                old_y--;\n                vga_drawline(xc - radius\
    \ * sintheta, old_y,\n                             xc + radius * sintheta, old_y);\n\
    \            }\n        }\n        vga_drawline(xc - radius * sintheta, y,\n \
    \                    xc + radius * sintheta, y);\n        old_y = y;\n    }\n\
    }\n```\n```\n\nAnd there you have it. Note that the **old_y** sections exist solely\
    \ to account for gaps in the circle (that is, rounding errors). Without that,\
    \ you could make the code much more compact.\n\n# ## Filled Triangle\n\nInterestingly\
    \ enough, you can also use this code (with one slight variation) to build a solid\
    \ isosceles triangle. All you need to do is to extract the following line:\n\n\
    ```\n`y = yc + radius * costheta;`\n```\n\nThen change **costheta** to **sintheta**,\
    \ like I have here:\n\n```\n`y = yc + radius * sintheta;`\n```"
