  md: "In the past, you've learned how to make a virtual screen the same size as the\
    \ physical screen. If your screen were 320 pixels by 200 pixels (that is, if it\
    \ used a matrix of that size), your frame buffer would be identical. The trick\
    \ here, however, is that you can store the elements of a virtual screen into multiple\
    \ locations with gl_getbox(), thereby making the frame buffer any size you'd like.\n\
    \nNow, let's create a frame buffer that accounts for five physical screens simultaneously.\
    \ This will allow a character to move smoothly through 1,280 horizontal pixels.\
    \ It'll be, in essence, a virtual screen mode of 1,280 by 200.\n\nWhat I'm going\
    \ to do is create five separate memory locations. To accomplish this, I'll draw\
    \ a scene into vgagl's frame buffer and then proceed to copy that entire page\
    \ to the first memory location with gl_getbox(). I'll then redraw the frame buffer\
    \ (which is itself a memory location) with the contents of the second screen,\
    \ and that, too, will be copied—this time to the second main memory buffer. Make\
    \ sense? I'll repeat this for all five “virtual” screens.\n\nAs the game is being\
    \ played, the character's position is always recorded. Whenever a new bit of background\
    \ area is needed, it can be easily transferred back to vgagl's frame-buffer from\
    \ the appropriate memory area, and then copied to the physical screen with gl_copyboxfromcontext().\
    \ Listings 14.1 and 14.2 show how a program utilizing this technique might be\
    \ set up. Any sort of foreground activity (such as sprite movement) has been eliminated\
    \ for simplicity.\n\n# **Listing 14.1   Scrolling with vgagl.**\n\n```\nint main(void)\n\
    {\n    int oldx = 0,\n        oldy = 20,\n        newx = oldx,\n        newy =\
    \ oldy,\n        x, y,\n        key;\n\n    char buffer1[320 * 200 * 8];\n   \
    \ /* screen width * screen height * bytes per pixel */\n\n    char buffer2[320\
    \ * 200 * 8];\n    char buffer3[320 * 200 * 8];\n    char buffer4[320 * 200 *\
    \ 8];\n    char buffer5[320 * 200 * 8];  GraphicsContext *physicalscreen;\n  \
    \                                   GraphicsContext *virtualscreen;\n\n    vga_init();\n\
    \n    vga_setmode(G320x200x256);\n\n    gl_setcontextvga(G320x200x256);\n```"
