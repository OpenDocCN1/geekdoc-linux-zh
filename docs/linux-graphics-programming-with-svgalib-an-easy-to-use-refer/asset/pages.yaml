- pgno: 138
  md: "# # Graphics On Startup\n\nOne thing that I find really appealing about the\
    \ Macintosh (and Windows 9x, too, for that matter) is that you get graphics immediately\
    \ upon startup. This looks so much more professional to me than what you get with\
    \ Linux. Although I'll admit that the text information that Linux displays during\
    \ boot up is often useful, it isn't going to do much for selling Linux to the\
    \ masses—something many seem to have on their mind as of late.\n\nI cannot accurately\
    \ describe what an enormous pain in the rear it has been trying to make this work.\
    \ I have neglected my family, my job—yes, even other *paying* projects—in my search\
    \ for this, the Holy Grail of Linux graphics. And I'm duty-bound to tell you the\
    \ disheartening truth: It can't be done within the confines of SVGA1ib.\n\nHowever,\
    \ it *can* be done—and I'll have to bite my tongue as I write this—if you use\
    \ the fbcon video drivers now standard in the kernel, due to the efforts of the\
    \ GGI project.\n\nThe problem is twofold:\n\n+   ◇ The kernel cannot use the standard\
    \ libc.\n+   \n+   ◇ Your video card must go into a graphics mode *before* the\
    \ kernel enters protected mode.\n\nAdd to that the fact that I'm not a kernel\
    \ hacker. However, all is not lost. The GGI people have created a kernel framebuffer\
    \ device (which Dr. Michael Weller suggested years ago, thank you very much),\
    \ and the following subsections explain what you have to do to make it work.\n\
    \n# ## Step 1: Recompile The Kernel\n\nWhen you run **make config**, enable the\
    \ prompt for development and/or incomplete drivers. Then, select the following\
    \ in the Console Drivers menu:\n\n+   ◇ VGA Text Console\n+   \n+   ◇ Video Selection\
    \ Support\n+   \n+   ◇ Support For Frame Buffer Devices (Experimental)\n+   \n\
    +   ◇ VESA VGA Graphic Console\n+   \n+   ◇ Advanced Low Level Drivers\n+   \n\
    +   ◇ Select Mono, 2bpp, 4bpp, 8bpp, 16bpp, 24bpp, and 32bpp packed pixel drivers\n\
    \n> > **Note**\n> > If you're unfamiliar with the process of compiling a customized\
    \ kernel, there are a number of good books available that go into considerable\
    \ detail. My favorite is *“Running Linux,”* by Matt Welsh and Lar Kaufman. Also,\
    \ you may find the documentation that comes along with any kernel “tarball” to\
    \ be sufficient."
  merge: -1
  img_proc: true
