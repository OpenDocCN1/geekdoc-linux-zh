- pgno: 415
  md: '# Other Elements


    Other common elements of a GUI include scrollbars and icons, in addition to menus
    and pop-up display boxes. Believe it or not, these are actually very easy to program.
    Any sort of document or screen sliding can be achieved in a manner consistent
    with an arcade game that allows background scrolling. Similarly, screen icons
    are very much akin to the sprites found in these same games, as they can be moved
    around the desktop, and a timer is required to assess double clicks. For this
    reason, the best tutorials for scroll bars and icons will be Chapter 10, Basic
    Animation, and Chapter 14, Game Basics.


    For your convenience, examples of complete GUIs can be found on the SVGAlib Web
    site at www.svgalib.org.


    # Conclusion


    The graphical user interface is definitely the wave of the future, even with the
    Linux crowd. Although many GUIs are already in place, designers must strive to
    continue making improvements in usability, functionality, and convenience. After
    all, there''s nothing worse than a sloppy and/or ineffective interface—you can
    just hear your users running back to the command line.


    One popular, emerging trend is to combine several interfaces into one. When done
    correctly, this gambit can make life easier on the end user. An application might
    serve as a Web browser, word processor, and desktop environment, all fused together
    to form the ultra-layout of tomorrow. Of course, some companies have already attempted
    this, but the results have been less than ideal, thus bringing back fond memories
    of shell prompts.


    The important thing to remember is to take your time and do it right. Companies
    that care spend an enormous amount of time testing new interfaces, both with their
    own employees and with the general public. If you can remember to keep the end
    user in mind, your interface should emerge to become both pleasing and useful,
    which is, of course, the ultimate goal.


    # Summary Of Functions Introduced In This Chapter


    The following function was covered in this chapter:


    +   void gl_setwritemode(int m)'
