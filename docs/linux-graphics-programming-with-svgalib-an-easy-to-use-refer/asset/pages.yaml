- pgno: 472
  md: 'Chips & Technologies chipsets give limited vga_accel() support but no longer
    have this old-style support. Mach32 is left to use the unintuitive Cirrus interface.
    At some future point, the functions might be added for Mach32, too (which should
    be rather simple), so new applications should use the newer and probably more
    efficient interface.


    It would be fatal if the accelerator were to be used while the console is switched
    away. Therefore, you should use vga_lockcv() and vga_unlockcv() to avoid this,
    although good implementations of the accelerator functions (such as Mach32) will
    already ensure that the testaccel() demo utilizes the old-style accelerator functions.


    void vga_bitblt(int srcaddr, int destaddr, int w, int h, int pitch)


    bitblt (copy rectangular area in video memory) addresses are offsets into video
    memory (up to 2MB). The pitch is the logical width of the screen. Height h is
    in pixels, and width w is in bytes.


    void vga_fillblt(int destaddr, int w, int h, int pitch, int color)


    Fills a rectangular area in video memory with the single color color. The argument
    destaddr is an offset into video memory (up to 2MB). The pitch is the logical
    width of the screen. Height h is in pixels, and width w is in bytes.


    void vga_hlinelistblt(int ymin, int n, int *xmin, int *xmax, int pitch, int c)


    Arguments *xmin and *xmax are pointers to arrays of n integers. There are n horizontal
    lines drawn, for i in 0 to (n - 1), a horizontal line will be drawn from pixel
    (xmin[i], ymin + i) to (xmax[i], ymin + i) using color c. Pixel (0,0) is considered
    to be at the absolute beginning of the SVGA memory (as if vga_setdisplaystart(0)
    were called).


    void vga_imageblt(void *srcaddr, int destaddr, int w, int h, int pitch)


    Writes a rectangular pixmap from system memory to video memory. The argument destaddr
    is an offset into video memory (up to 2MB). The pitch is the logical width of
    the screen. Height h is in pixels, and width w is in bytes.


    This fills the given box with the data in memory area *srcaddr. The memory buffer
    must contain the pixels in the same representation as used in the VGA memory,
    starting at the top-left corner, from left to right, and then, line by line, from
    up to down, without any gaps and interline spaces.


    void vga_bltwait(void)


    This waits for any accelerator operation to finish. Although already implemented,
    this isn''t very useful; old style functions don''t allow for parallel operation
    of the accelerator. A limited use might be to wait for a running operation to
    complete in a signal() handler.'
  merge: -1
