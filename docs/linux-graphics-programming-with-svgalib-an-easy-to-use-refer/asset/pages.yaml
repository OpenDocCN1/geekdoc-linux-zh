    \ \\- Screen fades\n+   \\- Gradient fills\n+   \\- Antialiasing\n+   \\- Graphics\
    \ on startup\n\nHere’s the chapter where I rudely dump a bunch of disjointed topics\
    \ together—vaguely related odds and ends that don’t merit a chapter of their own.\
    \ In this grab bag, you’ll find numerous examples of how to spruce up your applications,\
    \ including cinematic effects, smooth transitions, and lots of other neat stuff.\
    \ Don’t let the fact that they’re lumped here fool you into believing they’re\
    \ without value.\n\nWe’ll start out with screen fades and then progress into more\
    \ examples of gradients, including the oh-so-cool gradients within shapes. Following\
    \ that will be an introduction to *antialiasing*, the process of smoothing jagged\
    \ edges such as those found on diagonal lines. Provided you’re not completely\
    \ blown away by that point, you’ll finish up this chapter with a look at my famous\
    \ pseudo screen savers and boot-time graphics a la Macintosh and Windows 9x.\n\
    \nCertainly, there’s a lot to cover, so let’s begin straightaway.\n\n# Screen\
    \ Fades\n\nOne neat effect is the *screen fade*. Instead of suddenly blanking\
    \ out the screen, you can apply an artistic touch to your applications and gradually\
    \ fade them away. This is particularly effective when used to transition smoothly\
    \ to different levels in a game. Naturally, there are a number of different methods\
    \ to accomplish this, so I’ll cover a few. You decide which you like the best."
  merge: -1
