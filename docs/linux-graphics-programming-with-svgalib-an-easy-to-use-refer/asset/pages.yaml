- pgno: 315
  md: "Your cursor can be as simple as a set of crosshairs or even a dot. However,\
    \ I think most people are looking for something more akin to a Microsoft pointer.\
    \ Therefore, Listing 15.3 shows my code for just that. The methodology I use is\
    \ fairly straightforward:\n\n+   1.  Take a “snapshot” of the section of the screen\
    \ where the mouse pointer will be painted. This will be used to restore the screen\
    \ if and when the pointer moves. Don’t worry—it’s only a few pixels, so it won’t\
    \ take up too much memory.\n+   2.  Draw the pointer/cursor icon in the area where\
    \ you took the snapshot.\n+   3.  When movement occurs, you restore the screen\
    \ area where the mouse pointer was with your snapshot. Then you find the new coordinate\
    \ and start over with Step 1.\n\nThe variables x and y refer to the mouse’s current\
    \ position. As you may have guessed, ox and oy (old x and old y) are then used\
    \ to remember its previous position. To use this code, call `draw_cursor()` initially.\
    \ Then, you should detect movement and update the mouse’s position with `move_cursor()`.\
    \ I’m sure there are plenty of other ways to do this, but this method has worked\
    \ well for me.\n\n# Listing 15.3 One way to make a cursor.\n\n```\n```c\nvoid\
    \ move_cursor(int x, int y, int ox, int oy)\n{\n    gl_putbox(ox, oy, 11, 19,\
    \ box);\n    draw_cursor(x, y);\n}\n\nvoid draw_cursor(int x, int y)\n{\n    gl_getbox(x,\
    \ y, 11, 19, box);\n\n    gl_setpixel(x, y, 254);                 /* line 1 */\n\
    \    gl_hline(x, (y + 1), (x + 1), 254);     /* line 2 */\n    gl_setpixel(x,\
    \ (y + 2), 254);            /* line 3 */\n    gl_setpixel((x + 1), (y + 2), 255);\n\
    \    gl_setpixel((x + 2), (y + 2), 254);\n    gl_setpixel((x + 3), 254);     \
    \          /* line 4 */\n    gl_hline((x + 1), (y + 3), (x + 2), 255);\n    gl_setpixel((x\
    \ + 3), (y + 3), 254);\n    gl_setpixel(x, (y + 4), 254);            /* line 5\
