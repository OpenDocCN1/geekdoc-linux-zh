    A partially filled circle. (See, I told you so.)


    # ## Points And Lines With Vgagl


    If you look at Table 3.2, you see that some of our early SVGAlib functions have
    fast equivalents in vgagl. You might be advised to use these new functions from
    here on out, unless speed isn’t a consideration.


    Vgagl also has a third function called **gl_hline(int x1, int y, int x2, int c)**,
    which is used for horizontal lines. It’s not that big of a deal, but you do save
    one argument.


    # ## Conclusion


    As you can see, there’s not much to coding graphics. Programs can have as much
    depth as you can dream up, but the basic principles remain steadfast and true.
    The fear of coding that some people have is completely unfounded. If a project
    seems overwhelming, you can simply break it up into smaller steps.


    You’ve seen a variety of methods for getting graphical output on the screen. Some
    ways, such as using the vgagl functions, are obviously faster than others. However,
    the important thing to remember is that you always have options.


    Using the basic methods outlined in this chapter, you should be able to create
    a good number of your own programs. In fact, many SVGAlib programs consist entirely
    of the functions that are demonstrated in this chapter. Play around with these
    functions. As I’ve said before, there’s no better teacher than experimentation.


    **Table 3.2** SVGAlib functions and their vgagl equivalents.


    | SVGAlib          | vgagl                                    |

    | :--------------- | :--------------------------------------- |

    | vga_drawpixel()  | gl_setpixel(int x, int y, int c)         |

    | vga_drawline()   | gl_line(int x1, int y1, int x2, int y2, int c) |'
