    be an even number). The easiest way to achieve this is probably to choose x1 =
    0 in these situations. You should not expect ACCEL_SCREENCOPYBITMAP handling to
    overlap screen areas gracefully.


    # vga_accel(ACCEL_DRAWHLINELIST, int y, int n, int *x1, int *x2)


    Draws horizontal spans. Each of the *x1 and *x2 arrays contains n x-coordinate
    pairs. Starting with a horizontal line from *x1,y to *x2,y, consecutive horizontal
    lines (with increasing y values) are drawn using the start and end points in *x1
    and *x2. This is usually a very quick operation and useful to draw arbitrary polygons
    (when the accelerator cannot do an arbitrary polygon fill itself).


    # vga_accel(ACCEL_POLYLINE, int flag, int n, unsigned short *coords)


    This draws a contiguous line through the n points listed in *coords. Argument
    *coords contains n pairs of shorts: the first being the x coordinate, and the
    second is the y coordinate.


    Normally, flag should have the value ACCEL_START | ACCEL_END. However, if the
    evaluation of the points is costly, you can mix calculations and drawings. Your
    first call to vga_accel(ACCEL_POLYLINE, ...) must have ACCEL_START set. This will
    initialize the accelerator. If you don’t specify ACCEL_END, you can (actually,
    you have to) follow your call with another vga_accel(ACCEL_POLYLINE, ...) call,
    which will give additional points to connect.


    It’s important that no other operations (not even color settings) take place between
    a call with ACCEL_START and the one with the corresponding ACCEL_END. Because
    of this, it’s also important that you lock the console with vga_lockvc() and vga_unlockvc()
    so that you cannot be interrupted by a console switch.


    It’s permissible to not set ACCEL_END for your last call to vga_accel(ACCEL_POLYLINE,
    ...). This will not draw the last pixel of the last line, which is important for
    some raster operations when drawing closed polygons. The accelerator will automatically
    deinitialize when called with another operation in this situation. It’s undefined
    what happens when you specify other values for flag and when your polyline contains
    only a single point. The line segments must also be greater than length zero.'
  merge: -1
  img_proc: true
- pgno: 468
  md: 'For implementors: In conjunction with raster operations (ROP_XOR, ROP_INV),
    it’s important that endpoints of inner line section are only drawn once. If you
    cannot achieve that, you must signal that this function cannot be used in conjunction
    with raster operations. In this case, it’s valid to always draw all points of
    the line segments, including the endpoints, regardless of the existence of an
    ACCEL_END parameter.


    # vga_accel(ACCEL_POLYLINE, int flag, int y, int n, unsigned short *xcoords)


    This function combines the features of ACCEL_POLYLINE and ACCEL_DRAWHINELIST.
    Starting in row y, horizontal lines are drawn from top to bottom. For each horizontal
    scanline, the *coords array will contain a number n, followed by n x coordinates
    in left to right order. Horizontal lines are drawn between the first and the second,
    the third and the fourth x coordinates, and so on. If the m coordinates are exhausted,
    if increased, a new number m is read from the *coords array, and operation continues.
    This procedure is done for n scan lines.


    In addition, there’s a flag parameter that works similar to ACCEL_POLYLINE. Your
    first call to ACCEL_DRAWHINELIST must have the ACCEL_START bit set for proper
    initialization. The y parameter is ignored when ACCEL_START is not given.


    Contrary to ACCEL_POLYLINE, it’s required that the last call have the ACCEL_END
    bit set. The function is intended for drawing complex filled polygons using horizontal
    scanlines. By issuing small and fast calls for only a few scanlines, it’s possible
    to intermix drawing and calculations.


    The operation of ACCEL_POLYLINE is undefined if the x coordinates are not sorted
    from left to right, or if there are zero-length segments in any scan line, or
    if n or one of the m counters are zero, or one of the m’s is not even.


    # vga_accel(ACCEL_POLYFILLMODE, onoff)


    Switches polygon fill mode to (on is nonzero) or off. When in polygon fill mode,
    ACCEL_DRAWLINE and ACCEL_POLYLINE will only draw a single point on each scanline
    of each line segment. ACCEL_SCREENCOPYM0NO will horizontally scan its source area
    and start drawing in the foreground color when it encounters a set pixel. When
    the next pixel is encountered, it will start using the background color, and so
    on. This function can be used for hardware filled polygons:


    +   1.  Enable polygon fill mode.

    +   2.  Fill an offscreen rectangular area with a color with all bits zero (usually
    black).

    +   3.  Draw a polygon outline (usually closed) in this offscreen area in the
    color with all bits set (usually white). To get the proper bits set for the polygon
    outline, it is recommended to use ROP_XOR so that outlines intersecting in a single
    point are handled correctly.'
  merge: -1
  img_proc: true
- pgno: 469
  md: "To ensure that polygon corners are handled right, both start and end points\
    \ must be drawn (in `ROP_XOR` mode). Accordingly, it's best to use `ACCEL_DRAWLINE`\
    \ instead of `ACCEL_POLYLINE`. Finally, skip drawing all horizontal lines (which\
    \ would confuse `ACCEL_SCREENCOPYMONO`).\n\n+   Set foreground and background\
    \ colors, raster operation, and bitmap transparency to the values you want for\
    \ your polygon.\n\n+   Use `ACCEL_SCREENCOPYMONO` to copy the offscreen pattern\
    \ to the screen.\n\nThe raster operations and the transparency that are signaled\
    \ to be supported for `ACCEL_POLYFILLMODE` by `vga_ext_set()` are actually meant\
    \ to apply to the last `ACCEL_SCREENCOPYMONO` call.\n\nBecause this polygon drawing\
    \ uses more screen read/write operations, it's probably slower than using `ACCEL_DRAWHLINELIST`\
    \ or `ACCEL_POLYHLINE` for drawing a polygon scanline by scanline. However, it's\
    \ easier to use and it will work mostly without intervention of the CPU, which\
    \ can then do other calculations.\n\n> **Note**\n> \n> *It's unspecified if the\
    \ left or right endpoints of the scanlines are drawn, and most cards (such as\
    \ Mach32) will omit them on one end, at least. Because of that, you should always\
    \ draw the boundary line in the fill color (or another color) after filling the\
    \ polygon.*\n\n`vga_accel(ACCEL_SETMODE, mode)`\nSets the blit strategy. There\
    \ are two choices for `mode`, namely `BLITS_SYNC` AND `BLITS_IN_BACKGROUND`. The\
    \ first ensures that a `vga_accel()` call only returns when the accelerator has\
    \ finished its operation. The second allows for an immediate return, thus allowing\
    \ parallel operation of the CPU and the accelerator. Consecutive accelerator operations\
    \ will wait for each other to complete (and block if necessary). However, direct\
    \ screen memory access (done implicitly by calls to some SVGA/ib functions) may\
    \ find any intermediate state in VGA memory or even corrupt the running accelerator\
    \ operation.\n\n`vga_accel(ACCEL_SYNC)`\nWaits for the accelerator to finish when\
    \ in `vga_accel(BLITS_IN_BACKGROUND)` mode.\n\n`vga_accel(ACCEL_SETOFFSET, int\
    \ address)`\nSets a screen offset as `vga_setdisplaystart()` does. The same restrictions\
    \ for this function, as reported by `vga_getmodeinfo()`, apply to `address`. Whenever\
    \ the video screen offset is modified, the accelerator's offset will follow. However,\
    \ you can modify it later with this function.\n\nThe following mode values are\
    \ defined for `vga_accel(ACCEL_SETTRANSPARENCY, int mode, ...):`"
