    # Texture Mapping


    Texture mapping is an intriguing concept, and it''s fairly easy to understand,
    conceptually. Imagine taking a flat piece of aluminum foil and wrapping it around
    a baseball so that the baseball is completely covered. This, in essence, is texture
    mapping. If you have a flat (two-dimensional) piece of artwork, it''s possible
    to transpose this onto a 3D object by means of texture mapping. If done properly,
    the “texture” (the artwork) will distort, appearing to trail off in the distance
    as it covers the object in space.


    SVGAlib comes complete with its own 3D toolset called, simply enough, the threeDKit.
    One of the sample programs provided with the threeDKit is wrapdemo, which demonstrates
    texture mapping with a picture of Susanna Rubens (who we can assume is/was an
    object of desire for threeDKit''s creator, Paul Sheer). The program is actually
    composed of multiple source files, but Listing 12.2 shows the functions that actually
    compute the image''s surface.


