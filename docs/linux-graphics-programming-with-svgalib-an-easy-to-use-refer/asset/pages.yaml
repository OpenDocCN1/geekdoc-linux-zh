- pgno: 24
  md: '# ## Chapter 1


    ## Getting Started


    +   Key Topics:

    +   - **Obtaining and installing SVGAlib**

    +   - **Configuration**

    +   - **Graphics libraries and linking**

    +   - **Comparisons with X**


    This chapter contains everything you ever wanted to know about getting SVGAlib
    installed and configured on your Linux box. If you follow my instructions, you’ll
    soon have the power to create brilliant graphics and stunning displays—the kind
    that you’ve always wanted to have with Linux but were never able to produce. Furthermore,
    you’ll be able to run any of the precompiled applications that have been written
    for SVGAlib, and you’ll be ready to work on the numerous code examples presented
    later in this book. As we progress, we’ll examine the mechanics of SVGAlib and
    learn what makes it necessary. If you find that you’re already familiar with some
    of the material that’s presented, don’t be offended. The point is not to insult
    you, but rather to help out users who might not be as experienced. If a particular
    segment bores you, just skip ahead—you can always come back if needed. On the
    other hand, there’s a primer on C libraries for those readers who are new to programming
    and have not yet learned about shared functions and dynamic linking. Finally,
    I’ll cover the differences between SVGAlib and some of the other well-known graphical
    rendering packages available for Linux.


    If you learn nothing else from this chapter, you should definitely leave with
    the knowledge that SVGAlib is powerful, easy to use, and most importantly, that
    it’s a lot of fun.


    # ### How To Get And Install SVGAlib


    Many Linux distributions come with a precompiled version of SVGAlib. If yours
    did and you’re satisfied with it, you can skip this section. However, if you’d
    like to upgrade to the newest version,'
  merge: -1
  img_proc: true
- pgno: 25
  md: "read on. Even if you already have SVGAlib installed on your machine, upgrading\
    \ will be a great opportunity to get your feet wet and to ensure that everything's\
    \ properly configured. By all means, don't be frightened by the prospect of compiling\
    \ your own copy of SVGAlib. It's a very straightforward process and shouldn't\
    \ take you more than 15 minutes from start to finish.\n\nTo begin with, you'll\
    \ need to obtain the SVGAlib source package. While there are several methods available,\
    \ I'd suggest doing one of the following:\n\n+   - Copy it from the enclosed CD-ROM.\n\
    +   - Download it from the Internet.\n\nThe CD-ROM that accompanies this book\
    \ contains version 1.4.0, the most up-to-date version of SVGAlib at the time of\
    \ this writing. However, this being a progressive library, improvements are bound\
    \ to be made. For example, several new video card drivers have been added in the\
    \ past few months, so I'd suggest that you visit the official Web site every now\
    \ and then to see if a newer version's been released.\n\nThe SVGAlib Web site\
    \ is located at www.svgalib.org. This site is a great resource for developers;\
    \ it contains up-to-date tips and hints, as well as a bulletin board you can post\
    \ to if you need extra help. The distribution isn't actually housed at svgalib.org;\
    \ it links to the gigantic metavalab.unc.edu (formerly Sunsite) Linux repository.\
    \ If you'd like to go there directly, the full address is metavalab.unc.edu/pub/Linux/libs/graphics.\
    \ Access isn't restricted to the Web, however; Metavalb allows the use of a regular\
    \ FTP client as well.\n\nThe source “earball” is called svgalib-1.4.0.tar.gz.\
    \ If your system is based on glibc2 (GNU’s C library, which supersedes the libc.so.5\
    \ series), you'll also want to download the precompiled binary version. Despite\
    \ how it seems, the precompiled SVGAlib isn't there to save you time. Rather,\
    \ its purpose is to allow compatibility with precompiled applications that were\
    \ built with libc.so.5. If this is all Greek (“geek”? ) to you, don't worry. I'll\
    \ go into more detail later in the chapter.\n\n> **Note**\n> *Users with a glibc:2-based\
    \ system (such as RedHat 5.x, Debian 2.x, or SuSE 6.x) will need to download the\
    \ binary distribution as well as the source, because glibc2 isn't compatible with\
    \ previous Linux libcs, and you'll need the binary distribution to run older,\
    \ precompiled libc.so.5 programs, such as Quake. We’ll give more information on\
    \ this in a bit.*\n> \n> *Don't worry if you get the following error: “Warning:\
    \ return type of ‘main' is not ‘int’”. This is merely a case of outdated syntax,\
    \ and won't have any adverse effect upon your compilation.*\n\n# C Compiler\n\n\
    In addition to the SVGAlib source files, you'll also need the GNU C compiler,\
    \ gcc. This comes with just about every Linux distribution, in case you don't\
    \ already have it, it can also be"
