    ```

    ```


    This routine determines what to do if the mouse position reaches a boundary. *state*
    should be either *MOUSE_WRAP MOUSE_NOWRAP* or a bitwise OR of *MOUSE_WRAPX MOUSE_WRAPY
    MOUSE_WRAPXZ* . These define if all or the respective coordinates wrap or are
    clipped at the ends. This variable has been overloaded for the case of multidimensional
    mice that support rotations and can be used to select the coordinate system used
    to return the current position of the mouse.


    If the value of *state* is also ordered with *MOUSE_ROT_RX RY RZ*, rotational
    information will be returned as the angular position, as expressed by the total
    angle wound around the *x*, *y*, and *z* axes. This is the simplest coordinate
    system to use, but it''s also the least useful, because angular rotations about
    perpendicular axes don''t commute. There are situations where this system might
    be useful for controlling truly independent quantities, such as color, with each
    axis being used to dial a level of red, green, or blue, but for modeling the actual
    orientation of a physical object, it''s utterly hopeless.'
