  md: "**Note**\n\n*Although threeDkit functions begin with the gl\\_* prefix, they\
    \ are not a part of vgaal.*\n\nIgnoring these shortcomings, let's jump right in.\
    \ The first function to explore is gl\\_strangle(int x0, int y0, int x1, int y1,\
    \ int x2, int y2, int color, int bf). The s in strangle stands for solid (as this\
    \ will be a filled triangle). It should be fairly self-explanatory; you pass the\
    \ x and y values of three screen points to the function, followed by the fill\
    \ color. Then you get to that weird bf value. This is used in three-dimensional\
    \ drawing, so you won't need to be concerned with it here. Its purpose is to state\
    \ when, if ever, the triangle shouldn't be drawn (say, if it were on the back\
    \ side of a hill, and drawing it would only slow things down because it would\
    \ be overwritten by the front side of the hill anyway). For now, use a value of\
    \ -1 for bf, which should ensure that the triangle will always be drawn.\n\nIf\
