    # History Of The GUI


    Traditionally, computer interfaces were built entirely with text (that is, when
    they weren’t using punch cards in lieu of visual displays). The PC world had the
    various flavors of DOS, which were also found on other home computers such as
    the Amiga, Apple II, Commodore 64/128, and the ever-present Trash-80 (apologies
    to Tandy/Radio Shack). The one thing that these mass-market computers all had
    in common was a command line user interface. Instructions had to be typed in,
    and the results were displayed on a monochrome, text-only screen. This arrangement
    may seem primitive by today’s standards, but it was quite fashionable at the time.
    As silly as it may sound, those flickering green and black screens were seen as
    portents of the future. Of course, the text-based interface has now experienced
    a revival of sorts with Linux, but that’s more of an exception than the general
    rule. The world has gone visual, and along with that trend comes the GUI, or the
    graphical user interface.


    The Apple Lisa is generally regarded as the first computer with a GUI, but it
    was actually preceded by the Xerox Star. Unfortunately, its high price tag and
    relatively poor performance prevented the Lisa from achieving widespread commercial
    success, but it did pave


    # Graphical User Interface (GUI)


    A (relatively) user-friendly, all-graphics control screen that generally features
    pull-down menus, icons, and some sort of pointing device, such as a trackball
    or mouse. This concept was popularized in the mid-1980s by Apple Computer, but
    was actually developed by Xerox. “GUI” may be pronounced either as gee-yoo-oye
    or gooye.'
