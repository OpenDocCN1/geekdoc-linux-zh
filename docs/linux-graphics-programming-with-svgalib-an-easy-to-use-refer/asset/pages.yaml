  img_proc: true
- pgno: 475
  md: '# Note


    > Don’t confuse text mode fonts (to which these functions pertain) with graphical
    fonts, such as those discussed in Chapter 7.


    ```

    void vga_gettextmoderegs(void *state); void vga_settextmoderegs(void *state)

    ```


    These functions give access to the buffer where SVGAlib saves the VGA state that’s
    used when the kernel displays text on the SVGA console. This is used by the restoretextmode(),
    savetextmode(), and textmode() utilities to restore a possibly corrupted console.
    The buffer currently occupies 385 bytes. It won’t do any harm to make it substantially
    larger to allow for future enhancements.


    ```

    int vga_flip(void)

    ```


    This function switches between graphics and text mode without destroying the screen’s
    contents. This makes it possible for your application to use both text and graphical
    output. However, this is an old vgalib function. You should only use it for debugging
    because it’s extremely unstable. This is because SVGAlib now does its own virtual
    console management. If you want to perform a similar action, do this:


    +   1. Save the current screen’s contents with an ordinary memory copy operation
    to the frame buffer or gl_getbox().

    +   2. Set vga_setmode(TEXT).

    +   3. Call vga_setmode() to return to graphics operation and restore the screen
    contents with memory or gl_putbox(3).


    You could also use vga_drawscansegment() and vga_getcsscansegment() calls. However,
    avoid any calls to vga_flip() in your applications.


    This function should always return 0, but it might be a good idea not to rely
    on this. It might prove useful if you’re debugging one of your SVGAlib applications,
    though. If your program reaches a breakpoint while in graphics mode, you can switch
    to text mode with the gdb command print vga_flip() and later restore the graphics
    screen contents with the same command. It’s useful to define the following aliases
    in gdb:


    ```

    define flip <Return> print vga_flip() <Return> end <Return>

    ```


    ```

    int vga_setflipchar(int c)

    ```


    This function sets the ASCII code of the key that causes vga_getch() to switch
    between graphics and text mode when waiting for a keypress. Esc is the default
    at startup. Because you can now switch directly between consoles (even when in
    graphics modes) and because the use of vga_flip() is discouraged (except for debugging),
    this function exists for vgalib compatibility but has no effect.'
  merge: -1
  img_proc: true
