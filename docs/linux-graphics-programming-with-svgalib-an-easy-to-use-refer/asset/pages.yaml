  md: "# **GIF**\n\nCompuServe’s Graphics Interchange Format. This format—extremely\
    \ popular on the Web—allows for a total of 256 colors. It is compressed horizontally,\
    \ so an image with many horizontal lines will be smaller than one of the same\
    \ size with many vertical lines. It’s officially pronounced *giff*, but many people\
    \ say *gif*. The GIF compression algorithm copyright is now owned by UNISYS.\n\
    \n# **JPG (JPEG)**\n\nThis format, pronounced *jay-peg*, was developed by the\
    \ Joint Photographic Experts Group (hence the name). Compression is achieved by\
    \ dividing the picture into tiny pixel blocks, which are halved over and over\
    \ until the desired ratio is achieved. Compression as high as 100:1 can be achieved,\
    \ but 10:1 and 20:1 are more common ratios.\n\n# **BMP**\n\nA Windows bitmap file,\
    \ BMP file, can allow for 2, 16,256 or 16 million colors (1-bit, 4-bit, 8-bit,\
    \ and 24-bit color). The BMP file is generally uncompressed.\n\n```\nmyfile =\
    \ fopen(\"/etc/vga1/ivga.config\", \"r\");\nwhile (fgets(line, 255, myfile) !=\
    \ NULL)\n{\n    printf(line);\n}\nfclose(myfile);\n```\n\nBinary files (such as\
    \ graphic files) are opened in a similar manner, except that they use the +b string.\
    \ Here’s an example:\n\n```\nmyfile = fopen(\"binary_file\", \"r+b\");\n```\n\n\
    # # Layout Of The Bitmap\n\nFor a quick introduction into the world of graphic\
    \ files, let’s dissect the Windows bitmap. I hope you won’t consider me a traitor\
    \ for doing this—my reasoning is that bitmaps are conceptually easier to understand\
    \ than vector formats. Also, BMP files are fairly common.\n\nIf you find this\
    \ section to be excessively technical, you can skip ahead to the “Liblgl” section,\
    \ which, rest assured, is considerably easier.\n\n> **Note**\n> *Much of the following\
    \ is taken from the Web. It appears in several locations, and I have no idea who\
    \ the original author is.*"
