    # # External Functions


    Not all functions have to be a part of your main program. I’ve discussed this
    to some extent in previous chapters, regarding SVGAI ib as an external library,
    but you have other options as well. In addition to using libraries, you can compile
    multiple source files (that you’ve written) into one program. Furthermore, if
    you use these same functions extensively, you can create your own libraries. Lastly,
    you can put new functions into SVGAlib itself.


    Adding to SVGAlib might be hazardous, however. In addition to the obvious threat
    of somehow corrupting the library, programs that link to your customized functions
    won’t work on someone else’s computer. How could they? The necessary functions
    are only on your machine. To combat this, you can distribute your external functions
    along with your programs, just as many Windows programs install their own DLLs
    (dynamic link libraries, akin to the .so files in Linux). The advantage to Linux
    is that you don’t need to “register” these libraries; just pop ’em into a directory
    on ld’s search path, and you’re ready to roll. (Although you may need to run ldconfig
    first.) You can also create a statically linked (self-contained) executable; this
    might be a popular choice for commercial software developers who don’t want their
    code appropriated.


    ![](img/2e475714ef8969ed272622c46473d334_102_0.png)


    **Figure 4.10** Sample output from Fastball.c.'
