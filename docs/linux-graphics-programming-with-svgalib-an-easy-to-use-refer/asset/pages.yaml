- pgno: 224
  md: "# ## Screen Shots\n\nOne useful application to be made with graphic files is\
    \ a screen shot program. This sort of thing is common in the Windows world but\
    \ relatively unknown with Linux. Perhaps you’ll break new ground?\n\nIn this example,\
    \ I’ll be moving away from libung and using a package called gifsave instead.\
    \ Gifsave isn’t actually a library, per se, but rather a collection of routines\
    \ written in C. Like virtually everything else in this book, gifsave can be found\
    \ in the massive Linux repository at Metalab:\n\n```\nmetahal.unc.edu/pub/Linux/libs/graphics/gifsave-1.0.2.tar.gz\n\
    ```\n\nBefore we get into that, however, you’ll need to learn one more thing about\
    \ SVGALib: raw keyboard mode. Raw keyboard mode enables you to use every key on\
    \ the keyboard, even those that don’t correspond with the ASCII codes. This includes\
    \ the twelve function keys (F1 to F12), the four directional arrows (Insert, Home,\
    \ Delete, End, Page Up and Down), and, most importantly, Print Screen. If you’re\
    \ a Windows user (you’re among friends here—you can admit the truth), you probably\
    \ know that by pressing the Print Screen key, you copy contents of the screen\
    \ to the Windows Clipboard. You can then print the saved screen by “pasting” the\
    \ contents of the Clipboard into an application such as Windows Paint. The screen\
    \ capture feature isn’t integral to the PC, but rather to Windows, so it generally\
    \ doesn’t work in other PC operating systems, such as Linux. You can use raw keyboard\
    \ mode to change that.\n\nThe keyboard functions are contained within vgat, but\
    \ you’ll need to include the `<vgaKeyboard.h>` header file to make them work.\
    \ To begin, go ahead and enter a graphics mode as usual. Once you’ve done that,\
    \ the actual function to begin raw keyboard mode is keyboard_init(void). This\
    \ function returns 0 if successful and -1 otherwise. Therefore, a good error-checking\
    \ construction might be the following:\n\n```\n```\nif (keyboard_init())\n{\n\
    \    vga_setmode(TEXT);\n    printf(\"Could not initialize keyboard.\\n\");\n\
    \    exit(1);\n}\n```\n```\n\nFinally, when your program is finished, you should\
    \ return to normal, “cooked” keyboard mode by entering the keyboard_close(void)\
    \ command. This final step is just as important as vga_setmode(TEXT), because\
    \ omitting it can potentially mess things up for the next program."
  merge: -1
  img_proc: true
- pgno: 225
  md: '202 Chapter 9


    # Keyboard Codes


    Once you''re in raw keyboard mode, your program looks for signals to indicate
    that a certain key has been pressed. This is accomplished with keyboard_keypressed(int
    scancode) and keyboard_update(void). Basically, your program uses keyboard_update()
    to flush the buffer and keyboard_keypressed() to see whether any scanodes have
    been entered. Because keyboard_update() is nonblocking, it doesn''t halt the execution
    of your program. Therefore, you should use it in your main loop, because the buffer
    must constantly be checked. Alternately, if you want your program to stop and
    wait for input, use the blocking keyboard_waitforupdate(void) instead.


    For your convenience, Table 9.8 has the scancodes that keyboard_keypressed() recognizes,
    along with their associated numeric values. Although codes and values may be used
    interchangeably in programs, it''s probably best to use the codes. Note that case
    makes no difference here; therefore, a capital A is identical to a lowercase a.


    > Note

    > Some code names may be unfamiliar to you, so I''ll provide a few definitions.
    The CURSORBLOCK instances are the four arrow keys, meaning that CURSORBLOCKUP
    is the up arrow, and CURSORBLOCKDOWN is the down arrow, and so on. GRAVE is the
    "backtick" located on the same key as the tilde (~). Note that "Pause Break" returns
    SCANCODE_BREAK (101) on some keyboards and SCANCODE_BREAK_ALTERNATIVE (119) on
    others. Therefore, you should have your programs check for both if that key is
    important to you.


    The scanocode names are based on the U.S. keyboard layout. If you happen to have
    a non-American keyboard, the codes will pertain to the keys in the same physical
    location, although their inscriptions will be different.


    After reviewing Table 9.8, it should be obvious that SCANCODE_PRINTSCREEN (99)
    is what you need for a screen grabber.


    Table 9.8 Keyboard scancodes.

    | Scancode | Value |

    | :--- | :--- |

    | SCANCODE_ESCAPE | 1 |

    | SCANCODE_1 | 2 |

    | SCANCODE_2 | 3 |

    | SCANCODE_3 | 4 |

    | SCANCODE_4 | 5 |

    | SCANCODE_5 | 6 |

    | SCANCODE_6 | 7 |

    | SCANCODE_7 | 8 |

    | SCANCODE_8 | 9 |

    | SCANCODE_9 | 10 |

    | SCANCODE_0 | 11 |


    (continued)'
