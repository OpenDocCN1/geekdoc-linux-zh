- pgno: 394
  md: "# ## Chapter 19\n## Thoughts On A GUI\n\n+   **Key Topics:**\n+   \n+   * \
    \  Benefits of graphical interfaces\n+   *   History and examples\n+   *   Design\
    \ considerations\n+   *   Integration with SVGAlib applications\n\nA well-designed\
    \ user interface, graphical or not, should be considered a vital element of any\
    \ application. In fact, it’s such an essential and ubiquitous feature that it’s\
    \ often taken for granted. But, make no mistake here. All it takes is one look\
    \ at a sloppily designed and implemented screen to see the mastery involved in\
    \ making the good ones unique. The illusion of a transparent interface takes many\
    \ hours to achieve.\n\nSometimes programming a menu or selection screen may seem\
    \ boring and uneventful. After all, I doubt many people aspire to write GUIs.\
    \ (At least, they didn’t in the days prior to GNOME and KDE.) Perhaps you view\
    \ this task as a lot of work, without a lot of credit. Or maybe it’s just plain\
    \ dull. In any event, it’s certainly not glamorous like other applications.\n\n\
    Nevertheless, it’s critical that you get this part right. After all, an interface\
    \ isn’t optional. Just as a fish needs water and a tree requires sunlight, your\
    \ user must have some way to communicate with the computer. The interface is what\
    \ makes this happen, and the more efficient and “intuitive” your interface is,\
    \ the more likely it is that your program will be a success.\n\nThe basic concept\
    \ is simple enough: Interfaces accept user input and display processed output.\
    \ This explanation may seem overly pedestrian, but that’s it in a nutshell. The\
    \ interface serves as a bridge between user and machine. It may be used to launch\
    \ other programs, or it can help make interactions with a single application appear\
    \ seamless. Certainly, an interface can go a long way in making things easier\
    \ for computer novices, and that’s an important consideration, too."
  merge: -1
  img_proc: true
- pgno: 395
  md: "If that isn’t enough to grab you, consider that a usable interface helps to\
    \ sell your system, both figuratively and in the literal sense. It’s no coincidence\
    \ that PCs in computer stores have colorful screen savers—graphics are catchy.\
    \ You know that—that’s why you have this book.\n\n# ## GUI Examples\n\nIn this\
    \ section, I’ll briefly review some of the better interface designs that I’ve\
    \ encountered. You’ll probably notice my predilection for Apple in this department—I\
    \ think they’ve definitely got this mastered—but that doesn’t mean that the concept\
    \ can’t evolve. Of course, there’s always room for improvement. Nevertheless,\
    \ these examples illustrate the full spectrum of what current GUIs offer.\n\n\
    Although many graphical interfaces now make full use of pictures and color, simplicity\
    \ remains a virtue. As such, Figure 19.1 shows an example of an early Apple Macintosh\
    \ interface—the design of which is still highly effective. Like a Danish Modernist\
    \ chair, or a Mies van der Rohe apartment tower on the north side of Chicago,\
    \ this interface is crisp and succinct.\n\nNote the elementary, clean—some might\
    \ say intuitive—look. This is clearly the result of careful planning and experience.\
    \ It would be very easy to accomplish a task with this interface.\n\nGraphical\
    \ interfaces aren’t limited to desktop managers, either. Most modern *applications*\
    \ (outside of *Linux*) feature richly designed and intricate interfaces that work\
    \ hard to make a user’s life easier. Figure 19.2 shows another interface, this\
    \ time with icons, menus, and text boxes. Note the use of color, which adds an\
    \ element of friendliness that the first interface perhaps lacked. And there’s\
    \ accessibility—this second example should be immediately usable by most novices.\n\
    \n![](img/2e475714ef8969ed272622c46473d334_395_0.png)\n\n**Figure 19.1**  \nAn\
    \ early Apple Macintosh GUI."
