    # # Copying of Screen Buffers and Page Flipping


    The following functions are in regard to frame buffers and page flipping.


    **void gl_copyscreen(GraphicsContext *gc)**

    Copies the current graphics context''s contents (screen data) to the specified
    graphics context (the physical screen, for example). Contexts are assumed to be
    identical in size.


    **void gl_setscreenoffset(int o)**

    Sets the offset (in pixels) into video memory for gl_copyscreen(), gl_copyboxtocontext(),
    and gl_copyboxfromcontext(), thereby allowing page flipping. Must be a multiple
    of the scanline width in bytes. It''s reset to zero after the completion of gl_copyscreen().


    **void gl_setdisplaystart(int x, int y)**

    Sets the physical display start address to the pixel at (x, y). This function
    can be used for hardware scrolling or for page flipping (for example, setdisplaystart(0,
    HEIGHT) displays from the second page). Make sure the scanline width (BYTEWIDTH)
    of the current context corresponds with the physical screen. Note also that the
    display start cannot be set to completely arbitrary points. See vga_setdisplaystart.


    **int gl_enablepageflipping(GraphicsContext *gc)**

    Enables page flipping or triple buffering in gl_copyscreen() if the physical context
    gc can do it. Returns 3 if triple buffering will be used, 2 for page flipping,
    and 0 if page flipping is not possible (due to video memory/mode limitations).


    When page flipping is enabled, gl_screenoffset() is ignored in gl_copyscreen().
    The idea is that you draw your picture in gc and copy it to the screen via consecutive
    gl_copyscreen() calls. Each of these will choose a free buffer in the screen and
    adjust the display start accordingly. The current context must by the physical
    screen when gl_copyscreen() is called in this situation.


    # # Clipping


    The next three functions pertain to clipping.


    **void gl_disableclipping(void)**

    Disables clipping. This is the default.


    **void gl_enableclipping(void)**

    Enables automatic clipping in most functions. One exception is gl_copybox().'
