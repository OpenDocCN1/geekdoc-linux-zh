    # Conclusion


    Color is an essential part of our world, and this importance carries over to computer
    displays. You can work with color to build attractive and intuitive applications
    for your users.


    This chapter dealt mainly with color conversion. You''ve seen how to take the
    default values and manipulate them to meet your needs. You''ve also learned why
    some programs that are ported to Linux/SVGA1ib appear to be darker than they are
    on their original platform. Now you know why it''s generally best not to blindly
    accept color table values from another OS, unless they''re based on RGB or perhaps
    another platform-independent standard. Aren''t you glad you read this chapter?


