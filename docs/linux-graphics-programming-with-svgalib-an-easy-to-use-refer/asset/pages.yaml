    # # Conclusion


    Animation is what generally comes to mind when people think of computer graphics.
    Fortunately, SVGAlib makes creating animation easy. In this chapter, we’ve covered
    a number of ways to display animated images—from simplistic, “intuitive” examples
    to the more-complex realm of internal frame buffers and **gl\_putbox()**.


    Ironically, the more-involved programs actually end up being the easier ones to
    work with— similar to how experienced pilots maintain that jets are easier to
    fly than commuter turboprops. Of course, as a programmer you’ll have to learn
    the conceptually simpler programs first, and accordingly, these same seasoned
    pilots will say that you have to start out flying the family-sized, propeller-driven
    Pipers and Cessnas, as they’re much more forgiving.


    It’s no secret that animation is employed in the vast majority of computer games.
    It’s exciting and fun, and it sure beats the heck out of spreadsheets. Considering
    how much you’ve learned so far, you’re already well equipped to program your own
    games using SVGAlib. Once you learn to utilize the mouse and joystick, there’ll
    be no stopping you! Move aside, Sierra—Linux is coming.


