    And with that, you should be good to go. Congratulations! You can test your installation
    by running some of the demo programs. If, however, you’re still filled with questions,
    don’t worry. Let’s take a look at how this all fits together.


    # # SVGAlib Basics


    SVGAlib is a library of functions that makes graphics possible on Linux. It’s
    necessary because standard (ANSI) C can only give you text. You may find this
    surprising, given the number of graphical applications coded in C, but nonetheless
    it’s true. In order to display output other than text, C must link to an external
    set of OS- and machine-specific functions. These external functions handle the
    actual process of writing to the VGA card.'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'You can think of SVGAlib as a device that bridges the gap between standard
    C and the machine language functions necessary to display graphics on the screen.
    What does the name mean? Of course, SVGA refers to *SuperVGA graphics adapters*
    (video cards) and their attendant displays, and *lib* means that it''s a *binary
    library* that can be linked to programs written in C.


    Let''s talk a bit more about how C links to and utilizes external, or *shared*,
    libraries.


    # # The Concept Of A Shared Library


    If you''ve ever looked inside your */lib* directory, you''ve undoubtedly seen
    files with names such as *libso.5* and *libm.so.4*. Have you ever wondered what
    these files were all about? Quite simply, they''re your *shared libraries*, and
    most of your C programs use them.


    Shared libraries allow you to develop enormously functional programs that don''t
    take up a lot of disk space and that do things (such as displaying graphics) that
    aren''t supported by standard C. This arrangement is made possible by *ld*, the
    dynamic linker. When you compile a program, *ld* links any external functions
    referenced in your code to the shared libraries. Your code remains small because
    the library routines always stay separate. A good analogy to this would be a company
    that subcontractors some of its work to other, more specialized companies. Rather
    than having a huge office staff, our imaginary company saves money by outsourcing
    its invoicing, customer support, and janitorial work to other local businesses.
    In this regard, dynamic linking can be considered a form of outsourcing. Space
    is saved, because several programs can share the same code.


    Shared libraries can be distinguished by their names, which are written in the
    format *“library.so.version”*. For example, *libvga.so.1* is SVGAlib''s shared
    library. Most of these libraries can be found in */lib*. Makes sense, doesn''t
    it?


    Sometimes, though, you don''t want to farm out your work. A *statically linked*
    program contains all its own code internally. This is useful for debugging, or
    if you need to write a program that will be used on a system that''s “library
    deprived.” Statically linked programs are large but independent.


    You can tell a static library because it ends with a “*a*.” For example, *libvga.a*
    is SVGAlib''s static library. You can find this and most of the other static libraries
    in */usr/lib*.


    While we''re at it, let''s examine another important issue: A dynamically linked
    program depends on the existence of the shared libraries with which it was linked
    at compile time. If you''re feeling bored sometime, try erasing some of your libraries
    and see what happens. (Hint: Don''t do it! Vital programs such as *cp* and *mv*
    will stop working, and you''ll be out of business.) To find out whether a specific
    program uses shared libraries, type `ldd name_of_program`. For example, if you''re
    in the SVGAlib demo directory, typing `ldd fun` yields this:


    ```

    ```text

    libvga.l.so.1 -> /lib/libvga1.so.1 (0x40009000)

    libvga.so.1 -> /lib/libvga.so.1 (0x40018000)

    ```

    ```'
  merge: -1
  img_proc: true
