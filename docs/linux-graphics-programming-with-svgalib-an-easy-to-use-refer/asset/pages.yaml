    they''re not produced from just any old equation but rather formulas involving
    the square root of -1. As Mandelbrot


    # Random Fractal Forgery


    Coined by Richard F. Voss of IBM''s Thomas J. Watson Research Center, this term
    refers to the seemingly realistic depictions of natural objects that can be generated
    with simple algorithms. These algorithms are distinguished by their use of randomness
    and fractal self-similarity.'
