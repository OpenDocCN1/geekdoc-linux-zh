    # The Diamond-Square Algorithm


    The actual mechanics of spatial subdivision were first documented by Alain Fournier,
    Don Fussell, and Loren Carpenter at the height of New Wave fashion—1982. In their
    paper entitled, “Computer Rendering of Stochastic Models,” they described what
    is now commonly known as the Diamond-Square algorithm. The methodology is simple,
    as can be evidenced in Figures 16.10 and 16.11.'
