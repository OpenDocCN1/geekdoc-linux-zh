- pgno: 421
  md: '**Customizing sk_initializemode()**

    This is the trickiest function in the entire process. If you''re using the XFree86
    source, try to translate the appropriate function from X to SVGAlib. As an example,
    in the MillenniumII''s case, you''d use *MGA1064Init(mode)*. For other real-life
    examples of how translations like this are accomplished, we recommend that you
    study the *nv3.c* driver, which came from *nv/ nv3driver.c* in *X*, or else *apm.c*,
    which in turn was derived from *X*''s *apm/apm_driver.c*. If you''re creating
    a completely new driver from the manufacturer''s specifications, the information
    you need is usually explained in the spec book.


    **Customizing sk_unlock()**

    This, in turn, is the simplest function. The skeleton driver includes the necessary
    VGA unlocking part. If you have the manufacturer''s specifications, they usually
    explain how to unlock the extended features. On the other hand, if you''re using
    the *X* source, it''s usually found in the *EnterLeave() function*.


    **Customizing sk_test()**

    This function checks to see whether the appropriate chipset is actually present
    in your machine.

    If all you''re intending to support is one chipset from a single manufacturer
    (and it''s mounted on a *PCI* or *AGP* card), you can use the test function provided
    with the *skeleton.c* driver. (To take advantage of this, make sure you''ve properly
    defined the *VENDOR_ID* and *CARD_ID* constants.) Otherwise, the specifications
    provided by the chipset manufacturer *should explain how to recognize whether
    you have the right chipset*. If they don''t, try customizing the *XXXXProbe()*
    function from the *XFree86* source.


    **Customizing sk_setdisplay() And sk_setlog2width()**

    Standard *VGA* chipsets include these settings, but they have a limited range
    (*start < 65,536*, and *width < 2,048 bytes*). On the other hand, an *SVGA* chipset
    either defines extra bits for the increased range or will have completely new
    registers. In the case of the former, the *skeleton.c* driver contains material
    pertaining to setting the standard *VGA* registers. The extra bits are either
    defined in the manufacturer''s specifications or in the *XXXXAdjust()* function
    found in *XFree86* (see *mx.c* for example of this).

    In the latter case, erase the part of the function that involves setting the *VGA*
    registers (for an example of this, see *rgex.c*). Note that none of the *SVGAlib*
    demo programs test these functions, so if you want to check and see if they work,
    you''ll have to use an outside program such as *seejpeg*. (When running *seejpeg*,
    try to view an image larger than the screen.)


    **Customizing sk_init()**

    This one shouldn''t need much in the way of changes. Possible exceptions might
    include checking the memory size (which is found in the manufacturer''s specifications
    or in *XXXXProbe()*) or perhaps setting *MMIO* (if other functions use it).'
  merge: -1
  img_proc: true
- pgno: 422
  md: "# Step Three\n\nWhen your customizations are finally complete, you'll need\
    \ to go back and change all the sk\\_ function prefixes to chipset\\_ (where chipset\
    \ is the name of the chipset in question). This change includes all the sk\\_\
    \ functions—even those you haven't touched.\n\nOnce you have that done, you'll\
    \ be ready to integrate your driver into SVGA\\_lib. To do so, you'll need to\
    \ edit the following files:\n\n+   - Makefile.cfg\n+   \n+   - src/Makefile\n\
    +   \n+   - src/driver.h\n+   \n+   - src/vga.c\n+   \n+   - src/vga.h\n\nYou\
    \ can easily see what changes are needed in those files by following the example\
    \ of SVGA\\_lib's existing drivers.\n\n# Step Four\n\nThis is where the fun begins,\
    \ and I know it's the step you've all been eagerly anticipating—debugging. Actually,\
    \ this is the part where you'll stay up until 4:00 in the morning, cursing under\
    \ your breath.\n\nGenerally speaking, a new driver will never work as intended\
    \ when you first plug it in. You'll certainly want to iron out the kinks before\
    \ you go “live” and offer your driver for global distribution (at least, I hope\
    \ so). With that in mind, Matan Ziv-Av has passed along a few pointers, which\
    \ I've summarized in the following paragraphs.\n\nThe process of setting screen\
    \ modes can be broken down into two distinct elements: setting the timings and\
    \ setting the memory organization. Knowing this, you can usually pinpoint a driver\
    \ problem by watching the screen. If the wrong screen is displayed or if some\
    \ or even all of the pixels are miscolored, you'll know you have a problem with\
    \ your memory organization. However, if the display looks “stormy,” you've got\
    \ a timing problem.\n\nIf the problem involves memory organization, you might\
    \ see whether the card will work in linear mode. To test this, try running the\
    \ testlinear and linear2 demo programs, both of which can be found in SVGA\\_lib's\
    \ demos subdirectory.\n\nOn the other hand, if the problem involves timing, having\
    \ a digital monitor that displays both horizontal and vertical timings can be\
    \ of great value. If the horizontal frequency is right but the vertical is wrong,\
    \ the problem is with the vertical timing. However, if both the horizontal and\
    \ the vertical frequencies are off, the problem lies with either the clock frequency\
    \ or the horizontal frequency."
  merge: -1
  img_proc: true
- pgno: 423
  md: '# ## Restoring Text Mode


    If the driver fails to restore text mode properly, starting X Windows will often
    help. It won''t restore text mode, but it might allow you to see the output of
    the program (using either `dev/vcs` or else `/dev/vcsa`).


    Next, the `mode3` utility (in `SVGA lib''s` `lrm1-0.6m` subdirectory) is a lifesaver.
    It might very well be able to restore your card to normal text mode, in case your
    screen becomes corrupted by a bad driver. I can testify that `mode3` has helped
    me on any number of occasions.


    The `mode3` code can also be used for debugging. If a particular screen mode (say,
    `G800x600x256`) isn''t working properly, but `mode3` is, you might try experimenting
    with the following:


    +   1. Run `vgest` (in `SVGA lib''s` `demos` directory).

    +   2. Select **`mode11`** (for `G800x600x256`). While the wrong mode is displayed,
    press **d** to receive a register dump.

    +   3. Then, run **`mode3 259`** (that is, run `mode3` with a command-line argument
    of `259`). Follow this with `dumpreg` (in `SVGA lib''s` `utils` subdirectory)

    +   4. Run `mode3` again (thereby restoring the screen back to text mode) and
    compare the register dump of `VESA` mode `259` (`G800x600x256`) with the output
    from your driver.


    Your objective is to find incongruous bits and to determine what the differences
    mean. In other words, simply compare the two files, and when you find a difference,
    go from there. In this manner, you can slowly work out your bugs.


    # ## Conclusion


    Obviously, this chapter is a departure from anything else that''s been covered
    in the book. Now, instead of merely drawing on the screen, you have the power
    to "lift up the hood" and actually tease what''s going on inside of `SVGA lib`.
    It''s a daunting task, and one that many will chose to leave in more experienced
    hands. But, truth be known, it''s no harder a chore than learning `graphics` programming
    was, way back when you first got started.


    Certainly, an abundance of drivers is one indicator of a highly successful `graphics`
    package, and it''s the one major advantage that `X` has over `SVGA lib`. If you''ve
    enjoyed the programming experiences that `SVGA lib` has provided you thus far,
    you might consider pitching in and lending a hand. After all, that''s what `Linux`
    is all about.


    # # Summary Of Functions Introduced In This Chapter


    Here is a summary of the functions covered in this chapter:


    +   - `void sk_setagpe(int page)`

    +   - `int sk_saveregs(unsigned char regs[])`'
  merge: -1
