- pgno: 108
  md: "# Chapter 5\n\n# Color\n\n+   Key Topics:  \n+   • Color theory  \n+   • RGB\
    \  \n+   • Palettes\n\nColor is of such monumental importance to our lives that\
    \ it’s hard to imagine a world without it. From clothing to traffic signals to\
    \ advertisements to food, color dictates who we are and what we do. We use color\
    \ to differentiate objects, to appraise goods, to warn, to communicate, to mark,\
    \ and to judge. The list goes on and on.\n\nIt goes without saying that color\
    \ is a vital element of perception, even with computers. Studies have shown that\
    \ the human eye detects movement first, followed closely by silhouette and then\
    \ color. Certainly, life without color would be difficult. Even the blind must\
    \ compensate for their disability if they are to function within the confines\
    \ of our society. Color is everywhere.\n\nIn this chapter, I’ll go over what color\
    \ is and how it can be used effectively in your applications. You’ll learn how\
    \ to alter the basic colors that SVGAlib gives you as well as create individualized\
    \ palettes that can help set your programs a notch above the rest. Remember that\
    \ color, and graphics by extension, are very valued in today’s society: After\
    \ all, the introduction of the Apple Macintosh effectively spelled the demise\
    \ of MS-DOS (not to mention what TV did to radio). Although it’s true that many\
    \ users prefer the text-only environment that standard Linux provides, even that\
    \ basic interface uses many different colors to highlight special files. Color\
    \ makes things interesting, and its power can’t be ignored."
  merge: -1
  img_proc: true
- pgno: 109
  md: "# ## What Is Color?\n\nSo what is color? We can define color as being a component\
    \ of light. As light enters the visible spectrum, it’s generally split into multiple\
    \ hues. Note here that color is a perceived quality, not an absolute. Something\
    \ that appears to be one color under certain conditions can actually be another,\
    \ and two people might have differing ideas on what exact hue best describes an\
    \ object. Confusion is compounded when viewers are situated in different locations.\
    \ The physical aspect of light is measured in a spectral power distribution, or\
    \ SPD, but color itself exists only in our eyes and minds.\n\nIn the human-visible\
    \ portion of the light spectrum, we notice that three colors are stronger than\
    \ the rest: red, green, and blue. Our perception of these three colors as dominant\
    \ may stem from the fact that our retinas contain three different types of photoreceptor\
    \ cone cells. It could be that we’re alone with this vision; other animals might\
    \ perceive colors differently. Regardless, it’s possible to describe any color\
    \ we can see by giving it three values—one each for red, green, and blue.\n\n\
    > **Note**  \n> *The system of using three values to describe a color was first\
    \ introduced by the Commission Internationale de l’Eclaire in 1931.*\n\n# ## Why\
    \ Red, Green, And Blue?\n\nThis three-value system provides the basis for modern\
    \ video displays. We know that black is the absence of color, white is all three\
    \ colors at full intensity, and every other shade is some combination in between.\
    \ But how, exactly, does this color system work?\n\nWhen I began using computers,\
    \ I was puzzled at the choice of having green as one of the three primary colors\
    \ for displays. “Something seems amiss,” I thought. Everyone knows that the three\
    \ primary colors are red, blue, and yellow. If you want green, you just mix yellow\
    \ with blue, right? I couldn’t understand how any combination of RGB could produce\
    \ yellow, or any other lighter shade. And how can they all combine to form white?\n\
    \nThe answer is simpler: I was using the wrong system! Red, blue, and yellow are\
    \ the three primary colors of *paint*, whereas red, green, and blue are the three\
    \ primary colors of *light*. And light is what we’re dealing with.\n\n> **EGA**\
    \  \n> Enhanced Graphics Adapter. This was IBM’s 16-color predecessor to the VGA\
    \ card. EGA required a monitor capable of doing its own digital-to-analog conversion.\
    \ Compare this to VGA, which has onboard DAC conversion."
  merge: -1
  img_proc: true
