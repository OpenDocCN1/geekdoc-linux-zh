- pgno: 153
  md: 'the first 65 characters (followed by commas, of course). Then come your 208
    capital codes (26x8), and then 1,320 more zeros. Best of all, you can even cheat
    by skipping the trailing zeros. Isn''t life grand?


    You might be thinking that I''ve made a mistake here; everyone knows that capital
    A is ASCII character 65, not 66. But, think carefully. ASCII codes range from
    0 to 255, not 1 to 256. Therefore, capital A is, in fact, the 66th character,
    not the 65th.


    Of course, you don''t need to make your characters match up with the keyboard.
    You could have a drawing of a $b$ show up every time someone presses the A key.
    You can also create *wingsdings* (characters that are actually graphical drawings).
    You can even make a font of space invaders, as shown in Figure 7.7. The possibilities
    are virtually limitless.


    But how does one know which font strips to use? Surely not by trial and error.
    Fortunately, I''ve listed them all for you. Figures 7.8 through 7.263 show all
    256 possibilities. The strips themselves may seem to be arranged randomly, but
    they''re actually ordered in a binary sequence. Binary numbers go in an ordered
    fashion: 0, 1, 10, 11, 100, 101, 110, 111, and so on, and the font strips work
    in exactly the same manner. Take a look and you''ll see what I mean.


    ![](img/2e475714ef8969ed272622c46473d334_153_0.png)


    ![](img/2e475714ef8969ed272622c46473d334_153_1.png)


    ![](img/2e475714ef8969ed272622c46473d334_153_2.png)'
