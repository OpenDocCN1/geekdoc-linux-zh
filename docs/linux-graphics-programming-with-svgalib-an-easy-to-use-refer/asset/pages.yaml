- pgno: 494
  md: '# # Appendix F


    # A Brief History Of SVGA



    Now that you’ve learned how to use SVGA lib, you might be interested in learning
    a bit about its background and how it came to be.


    The simple story is that SVGA lib was created by Harm Hanevaeger, who lived in
    the Netherlands at the time, and is likely still there today. His original Linux
    SVGA library was based on VGALib 1.2, which was written by Tommy Frandsen of Denmark.


    > Just for fun, you can find VGALib 1.2 on the companion CD-ROM. Thanks to Russell
    Marks for that one!


    Expanding on VGALib, Hanevaeger added support for multiple drivers, with an emphasis
    on Cirrus chips (his specialty). He then integrated something called nvga lib
    (also based on Frandsen’s work), which contained added support for Trident cards.
    Now, with the scattered fragments of the old VGALib reunited, and a healthy dose
    of new code added for good measure, Harm’s SuperVGA library was born. SVGA lib
    version 1 was released in January 1994.


    # ## Maintainers


    SVGA lib has always been fortunate to have a cadre of highly skilled authors and
    maintainers to keep the flame alive. The maintainers are, starting from the beginning
    and moving to the present:


    +   ◆ Harm Hanevaeger

    +   ◆ Dr. Michael Weller

    +   ◆ Matan Ziv-Av'
  merge: -1
  img_proc: true
- pgno: 495
  md: "# Recollections\n\nMichael Weller describes how he took over the duties of\
    \ collecting patches and issuing new re-\nleases:\n\n> \"Harm told [me that] he\
    \ must be offline for personal reasons. I really don't know why. He left, and\
    \ as I had already done a huge amount of coding for SVGAlib, he asked me to take\
    \ over for a while.\"\n\n> \"Later (1–2 years) he got back to me and said he would\
    \ be online again, and that he was very happy with what I had done up until then.\
    \ I only had a few email contacts with him, and then he once more vanished from\
    \ the Net.\"\n\n# History And Changes\n\nTables F.1 through F.47 document the\
    \ extensive changes made to SVGAlib throughout its lifespan. The data itself was\
    \ taken from the doc/CHANGES file contained within the SVGAlib source package,\
    \ and as such, may contain some grammatical errors. (Not all SVGAlib programmers\
    \ are native English speakers. Given its international flavor, this shouldn't\
    \ come as a surprise.)\n\nIn most instances, credit is given to the programmer\
    \ who made the revision, but in some cases a programmer is marked as being \"\
    unknown.\" If you happen to be the \"unknown soldier\" in question, please write\
    \ to maintainer@svgalib.org, and you will receive proper credit in future releases\
    \ of SVGAlib.\n\nThis said, it can be reasonably assumed that Harm Haneumaeyer\
    \ himself was responsible for many of the changes made prior to version 1.5 release.\n\
    \nTable F.1 Changes in 1.4.0 (July 19, 1999).\n| Programmer | Contribution |\n\
    | :--- | :--- |\n| Matan Ziv-Av (matan@svgalib.org) | • Vgacci uses /proc/bus/pci\
    \ kernel interface, when available. \n• Rage driver. \n• Added static modes. \n\
    • Extended dynamic mode creation with vga_addtiming(3), vga_guesstiming(3), vga_addmode(3),\
    \ and new mode config file option. \n• Functions vga_getcurrenttiming(3) and vga_changetiming(3)\
    \ for mode tuning at runtime. \n• All mmaps of /dev/mem are done by driver initialize\
    \ function and vga_init(), so the /dev/mem file descriptor is closed when relinquishing\
    \ root privileges. \n• Moved the mach64.c driver to a different directory. \n\
    • Vga_reset utility added to facilitate restoring text mode without rebooting,\
    \ in case SVGAlib fails to do it properly. |\n| Christian Groessler (cpg@aladdin.de)\
    \ | • Chips and Tech driver fixes. \n• Changed vga_setlineareadressing() to return\
    \ an error when in a mode that does support linear. |"
  merge: -1
  img_proc: true
