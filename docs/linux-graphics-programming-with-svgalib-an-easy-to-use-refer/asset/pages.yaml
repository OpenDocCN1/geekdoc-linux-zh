    \ 166 173 219 166 173 219\n166 173 219 166 173 219 166 173 219 166 173 219\n```\n\
    \nThis is a portable bitmap, containing, as I said, the RGB value of every pixel\
    \ in the image. Now, what do with it?\n\nYou can use the scripting language Perl\
    \ to quickly read the output file and, then, using that data, compose the source\
    \ to an SVGAlib program. In other words, you can use Perl to write your \"self-displaying\
    \ graphic\" software. Listing 6.9 shows how this might be done.\n\n# Listing 6.9\
    \ Parsing bmptopnm's output.\n\n```\n#!/usr/bin/perl\n\nopen (INFILE, \"<netpnm.output\"\
    );\nopen (OUTFILE, \">svgaffiche.c\");\n\n# The next three lines bypass the header\
