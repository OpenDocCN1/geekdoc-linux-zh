- pgno: 47
  md: '# # VGA (And SVGA) Cards


    Let''s start with the basis of it all—the venerable VGA card.


    As you probably know, the VGA card is an expansion board that plugs into any standard
    x86 motherboard. Its purpose is to convert the digital impulses of the computer
    into analog signals, which the monitor then uses to create images. You might be
    wondering why the monitor can''t simply display the original digital signal—and
    indeed, a new generation of digital displays is being developed as we speak. I
    think the conventional VGA setup is a holdover from the early days of personal
    computing, when second-hand televisions were used in lieu of monitors, and digital-to-analog
    conversion was necessary to save money.


    It''s interesting to note that the older OGA and EGA cards did not perform the
    digital-to- analog conversion. Rather, the monitor had to do this.


    As shown in Figure 2.1, VGA cards consist of a DAC (digital-to-analog converter)
    chip, memory, and often a graphics accelerator. The memory can store at least
    one screen''s worth of information, known as a framebuffer. As memory increases,
    a greater number of colors becomes possible as well. Finally, the accelerator
    works to take some of the processing burden off of the computer''s CPU. Although
    this was not a feature on the original IBM cards, just about every modern VGA
    adapter has one.


    # ## A Rose By Any Other Name...


    A VGA card can also be called a display adapter, display board, display card,
    display controller, graphics adapter, graphics board, graphics card, graphics
    controller, video adapter, video board, video card, video controller, video display
    adapter, video display board, video display card, video display controller, VGA
    adapter, VGA board, and VGA controller. Who!


    # ## VGA


    Video Graphics Array. Found in nearly every PC today, the VGA adapter was first
    released in 1987 for IBM''s PS/2 (which, interestingly enough, was also the first
    Intel-based system to use a 3.5 inch floppy drive). VGA offers numerous advantages
    over the earlier CGA and EGA chipsets, including higher speed and sharper resolution.
    The VGA standard has since been upgraded to SVGA, XGA, and UXGA, and cards are
    now produced by a large number of manufacturers. Despite these enhancements, the
    VGA family of adapters is still commonly known as VGA.


    # ## CGA


    Color Graphics Adapter. This was the first graphics standard for the PC. It provided
    low-resolution text and graphics, and was superseded by EGA.


    # ## EGA


    Enhanced Graphics Adapter. A medium-resolution adapter, and the precursor to VGA.
    The first sixteen colors in the VGA palette are still known as the EGA colors.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '![](img/2e475714ef8969ed272622c46473d334_48_0.png)


    Figure 2.1

    How a VGA card works.


    # RGB Monitors


    After the digital signal has been processed by the video card and converted into
    analog, it’s handed off to the monitor for display. Computer monitors are similar
    to televisions but with higher resolution. They achieve this resolution by maintaining
    three separate color signals (red, green, and blue) for every point on the screen,
    unlike conventional TVs, which converge (or merge) the three colors into one.


    You might wonder what’s so special about red, green, and blue. Why don’t we use
    POY (pink, orange, and yellow) monitors instead? If you look at a color spectrum,
    red, green, and blue are the predominant shades, or *hues*, and everything else
    is a combination of these basic three colors. By varying the intensity at which
    the three primary colors are projected, the monitor can create any shade visible
    to humans. White is all three colors at full intensity, black is the absence of
    any color, gray is equal amounts (but less than white and more than black), and
    everything else is an uneven mixture somewhere in between. You’ll see more of
    this in Chapter 5.


    You can judge a monitor’s quality by measuring its convergence, dot pitch, refresh
    rate, and video bandwidth.


    # Convergence


    The intersection of the three electron beams (red, green and blue) needed to create
    a color pixel. Poor convergence will decrease resolution, and muddies white pixels.


    # Dot Pitch


    The distance between a red (or green, or blue) dot and the closest red (or green,
    or blue) dot on a color monitor (typically from .28 to .51mm; large presentation
    monitors may go up to 1.0mm). The smaller the dot pitch, the crisper the image.
    A .28 dot pitch means dots are 28/100ths of a millimeter apart. A dot pitch of
    .31 or less provides a sharp image, especially for text.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# **Refresh Rate**


    (Repeated from Chapter 1) The number of times per second your monitor is reenergized.
    Your screen is constantly losing its charge and must therefore be refreshed. Measured
    in hertz, display systems typically range from 56Hz to well over 100Hz. A minimum
    of 70Hz is recommended to help prevent eye strain.


    # **Video Bandwidth**


    The maximum display resolution of a video screen, measured in MHz, and calculated
    by the following formula:


    horizontal×vertical×resolution×refreshes/sec


    For example, 800×600×60 = 28.8MHz. By comparison, broadcast television is only
    3.58MHz. (That said, I usually buy a monitor based on price and how “cool” it
    looks.)


    The actual projection of an image is handled by three electron “guns” located
    in the back of a monitor’s case. These guns beam a rapid succession of electrons
    towards the front of the monitor, where they collide with the inside surface of
    the screen. The screen’s inside surface is covered with phosphors, generally arranged
    in groups of three (one phosphor for each primary color), and as the electrons
    strike, the individual phosphors glow. It’s these glowing phosphors that produce
    the visible display, as illustrated in Figure 2.2. Unfortunately, the phosphors
    lose their charge very quickly, and as a result they must be recharged (or *restruck*)
    several times per second. The frequency of this recharging is known as the *refresh
    rate*, as defined above and in Chapter 1. The faster your screen is refreshed,
    the better quality your image will have.


    This activity takes place inside of a cathode ray tube, or CRT, which is the same
    as a picture tube inside of an analog TV. You may have heard the term CRT used
    in reference with the space shuttle’s displays. Despite how techno-cool it sounds,
    though, CRT is actually an old-fashioned name and has been superseded by the relatively
    plain-sounding *monitor*, or *display*, which is what we use today.


    # **Dot**


    Electron guns focus on *dots* when they shoot. A display has thousands of dots,
    which are small circles or rectangles on the screen. All video pictures are comprised
    of dots. Think of them as the *atoms* of computer screens.


    # **Pixel**


    *Pixel* is an acronym created from the words *picture element*. It refers to the
    smallest definable area on your display, and it must consist of only one color.
    Don’t confuse pixels with dots; dots are a physical part of your monitor, whereas
    pixels are defined by your video card and may be comprised of several dots. The
    more pixels your screen contains, the better its *resolution*. Another word for
    pixel is *pel*.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '![](img/2e475714ef8969ed272622c46473d334_50_0.png)


    Figure 2.2

    How a monitor works.


    # Resolution


    This is your screen’s sharpness, or clarity. The more pixels a monitor displays,
    the better its resolution. To get a higher pixel count, and subsequently better
    resolution, you need to instruct your video card to enter a different screen mode.


    # Screen Modes


    Screen modes are great fun. By changing screen modes, you can change how many
    pixels are on the screen at one time. Generally, the more pixels you have, the
    better the quality of your image. There’s a price to pay, however, in that high
    pixel counts equal heavy memory usage in your video card.


    Screen modes work by dividing your viewing area into a grid, or what’s often referred
    to as a matrix. The matrix can be compared to a Cartesian graph/coordinate system
    in mathematics, with an x-axis running horizontally, and a y-axis running vertically.
    The points in a matrix are expressed in standard (x,y) format, with point (0,0)
    being in the upper left corner, and subsequent points continuing down and to the
    right.


    # Matrix


    The grid of horizontal rows and vertical columns that make up a display screen.
    For example, a matrix of 640×480 means that you have 640 pixels horizontally and
    480 pixels vertically.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'You''re already familiar with text mode (whether or not you use that term);
    Linux gives you 80 characters horizontally and 25 characters vertically. To get
    beyond ASCII characters, you must enter into a graphics mode.


    For a theoretical example, we can create a screen mode called 4×3. What this means
    is that your screen will be divided into a matrix consisting of three horizontal
    rows intersecting four vertical columns, thereby creating a total of twelve individual
    pixels. Refer to Figure 2.3 if you''re having trouble visioning this.


    However, a matrix of these dimensions is virtually useless. Knowing that pixels
    can only contain one color, we''re limited to chunky blocks that each take up
    a twelfth of the screen. It would take some imagination to draw anything recognizable
    in *this* graphics mode, as evidenced by Figure 2.4. (Heck, even the Atari 2600
    had better resolution!) Therefore, we need to create a larger grid.


    In reality, SVGAlib''s smallest matrix is 320 pixels wide by 200 pixels high.
    Look at Figure 2.5 for an example of mode 320×200.


    Clearly this gives us more to work with. We actually have a recognizable house
    (albeit blocky, as it just uses black and white), and it''s clear that one could
    make several primitive drawings in this manner. Furthermore, logic indicates that
    as the size of the matrix increases (say, to 1,024×768), the number of available
    pixels increases, and the problem with blocks and jagged edges goes away. Only
    one more element is needed to spice up this picture: color.


    ![](img/2e475714ef8969ed272622c46473d334_51_0.png)


    Figure 2.3


    Imaginary screen mode 4x3.'
  merge: -1
  img_proc: true
