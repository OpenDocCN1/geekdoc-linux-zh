    is processing the request.


    +   ◆ Forgiveness—Any action which might have serious consequences (deleting a
    file, for example) must be preceded by a second chance—that is, an opportunity
    for the user to back out or say no. If possible, make actions reversible by providing
    an “undo” command or function.


    +   ◆ Aesthetic Integrity—Here’s another important one. In addition to having
    a visually pleasing environment, design elements must remain consistent across
    your application(s). For example, don’t change the look of your icons and/or pop-up
    windows as you go. Strive to achieve consistency in colors and styles. This will
    go a long way in assuaging any fears that a user might have. Remember, familiarity
    is comforting.


    # Finally, Some Code!


    As you may have guessed, the objective of this chapter is to create a simple GUI
    for SVGAlib. I’m going to start by creating the menu bar for Splash, the paint
    program featured in Chapter 18. I’ll then continue by suggesting some ideas for
    icons and pop-up windows.


    If you do it right, you can share many elements of your GUI with both your control
    screen and with the applications that run from it. In other words, the menu bar
    from the basic interface can also be employed by your graphical applications (for
    example, Splash). Given the right spin, this can be considered a “feature,” or
    perhaps a common element introduced for consistency.


    Listing 19.1 shows the basic outline for the menu bar. Note that I’ve created
    a new SVGAlib font called “Cupertino” in homage to one of the earliest available
    GUIs. I prepare two versions of it in pre_p fonts()—one white and one black.


    The fonts here pose a new challenge, because SVGAlib (vagal) fonts are normally
    printed on a black background (specifically, the default background, or color
    0). This clashes with'
