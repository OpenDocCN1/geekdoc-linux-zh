- pgno: 115
  md: 'However, if you''re in a screen mode that uses fewer than 16 million colors
    (mode 5, for example), you''ll only be able to use as many colors as your mode
    allows any particular moment (This would be 256 simultaneous colors, in the case
    of mode 5). This doesn''t mean you can''t alternate amongst the 16 million possibilities;
    you just can''t use more than 256 at one time. Also, be advised that vgaGL makes
    you jump through an extra hoop if you''re in a 256-color mode—to use RGB functions,
    you must first declare gl_setrgbpalette(void). If you forget to do this, you''ll
    just end up with a hodgepodge of ugly colors. Once you move on to 32K color modes,
    though, gl_setrgbpalette() is no longer necessary.


    > > **Warning**

    > >

    > > When using vgaGL''s RGB functions in a 256-color screen mode, you must first
    declare gl_setrgbpalette().


    One more thing: You can''t write directly to the screen using vgaGL functions
    while in a 16-color mode. This shouldn''t be a problem for most people; the 16-color
    palette is practically worthless. But, do keep this in mind. To use 16 colors
    with vgaGL, you''ll need to write to a framebuffer, which can then be copied to
    the screen, as described in Chapter 4.


    > > **Warning**

    > >

    > > You cannot write directly to the screen with vgaGL functions while in a 16-color
    mode.


    # ## VgaGL Functions


    We''ll start with gl_setpixelrgb(int x, int y, int r, int g, int b). This one
    should be pretty obvious. It draws a single RGB pixel at coordinates x and y.
    The values for r, g, and b refer, of course, to the individual color components
    (their range extend from 0 to 255). If this function is too intense for you, you
    can try one that''s more akin to what we were doing before—gl_rgcolor(int r, int
    g, int b) or gl_setpixel(int x, int y, int c). Note that gl_setpixel() requires
    a color argument, which means that you can declare all your colors at the beginning
    of the program and then use them as you please. The code snippet in Listing 5.5
    illustrates what I mean.


    ```

