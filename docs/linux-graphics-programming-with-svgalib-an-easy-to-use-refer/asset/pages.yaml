- pgno: 328
  md: '# **Chapter 16**


    # Landscapes


    Key Topics:

    * History

    * Spatial subdivision

    * Heightfields

    * Pnmforge


    In mind, artificial landscapes (that is, computer generated “forges” of nature)
    constitute the crème de la crème of graphics programming. Forget about games,
    spreadsheets, or anything else that might have distracted you in the past. What
    you’ll find here is the ultimate, both in terms of challenges and rewards. No
    other graphics application is nearly so intriguing, and few as difficult to pull
    off. Indeed, some consider this field to be the state of the art.


    Although this chapter won’t make you an instant expert, you’ll still find plenty
    of material with which to begin your journey. With some practice, you’ll be able
    to render mathematical plots that bear an uncanny resemblance to mountain ranges,
    clouds, and even planets. In fact, some might say that the resultant images are
    mountain ranges and other natural vistas. The end result, when done properly,
    is absolutely astounding. See Figure 16.1 for an example of what I mean.


    The important thing to remember is that your computer is oblivious to the fantastic
    scenes that it’s producing. After all, you’re not really drawing mountains—you’re
    just running numbers through equations and displaying the results. That’s why
    this process is sometimes known as forging. You’re creating a mathematical plot
    that merely resembles a breathtaking alpine meadow or the setting sun, with scattered
    rays interspersed among ominous clouds. It’s a counterfeit of nature—a virtual
    photograph of a scene that never was. For the more fancifully inclined, it’s a
    glimpse at an alternate reality or an alien world waiting to be discovered.'
