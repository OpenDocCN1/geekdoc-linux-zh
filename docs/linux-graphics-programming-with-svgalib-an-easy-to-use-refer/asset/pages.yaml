- pgno: 470
  md: '+   - `vga_accel(ACCEL_SETTRANSPARENCY, ENABLE_TRANSPARENCY_COLOR, int color)`—Whenever
    one of the `vga_accel()` operations would draw a pixel in color color, no operation
    is performed and the destination pixel is left unchanged. In fact, that color
    is defined to be transparent.


    +   - `vga_accel(ACCEL_SETTRANSPARENCY, DISABLE_TRANSPARENCY_COLOR)`—Disables
    the previous functionality.


    +   - `vga_accel(ACCEL_SETTRANSPARENCY, ENABLE_BITMAP_TRANSPARENCY)`—In the bitmap-expanding
    operations `ACCEL_PUTBITMAP` and `ACCEL_SCREENCOPYBITMAP`, whenever a nonzero
    bit is encountered, no drawing operation is performed. The 0 bits do not draw
    in the background color. Instead, they''re defined to be transparent.


    +   - `vga_accel(ACCEL_SETTRANSPARENCY, DISABLE_BITMAP_TRANSPARENCY)`—Disables
    the previous functionality.


    The following mode values are defined for `vga_accel(ACCEL_SETRASTEROP, int mode)`:


    +   - `vga_accel(ACCEL_SETRASTEROP, ROP_COPY)`—Straight copy. Pixels drawn by
    `vga_accel()` replace the destination.


    +   - `vga_accel(ACCEL_SETRASTEROP, ROP_OR)`—Logical OR. Pixels drawn by `vga_accel()`
    are logical (bitwise) ORed to the destination.


    +   - `vga_accel(ACCEL_SETRASTEROP, ROP_AND)`—Logical AND. Pixels drawn by `vga_accel()`
    are logical (bitwise) ANDed to the destination.


    +   - `vga_accel(ACCEL_SETRASTEROP, ROP_XOR)`—Logical exclusive OR. Pixels drawn
    by `vga_accel()` are logical (bitwise) exclusive ORed to the destination (bits
    set in the drawn pixels flip those bits in the destination).


    +   - `vga_accel(ACCEL_SETRASTEROP, ROP_INV)`—Inversion. Pixels drawn by `vga_accel()`
    are inverted. Whatever color is drawn is actually ignored. Any pixel that would
    be overwritten is simply inverted (bitwise) instead.


    > Note that a 0 returned by `vga_accel(ACCEL_SETTRANSPARENCY, int mode, ...)`
    and `vga_accel(ACCEL_SETRASTEROP, int mode)` simply means that the set function
    is available (and therefore probably some of the listed features) but only partial
    functionality may be available. The `VGA_AVAIL_ROPMODES` and `VGA_AVAIL_TRANSMODES`
    subfunctions of `vga_ext_set()` allow you to check for valid parameters. The `VGA_AVAIL_ROP`
    and `VGA_AVAIL_TRANSPARENCY` subfunctions return which of the `vga_accel` operations
    are actually affected by these set functions.


