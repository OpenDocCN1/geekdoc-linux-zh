- pgno: 218
  md: 'Encoded mode consists of two bytes; the first byte specifies the number of
    consecutive pixels to be drawn using the color index contained in the second byte.
    In addition, the first byte of the pair can be set to zero to indicate an escape
    that denotes an end-of-line, end-of-bitmap, or a delta. The interpretation of
    the escape depends on the value of the second byte of the pair. Table 9.5 shows
    the meaning of the second byte.


    Absolute mode is signaled by the first byte set to zero and the second byte set
    to a value between 03H and FFH. In absolute mode, the second byte represents the
    number of bytes that follow, each of which contains the color index of a single
    pixel. When the second byte is set to 2 or less, the escape has the same meaning
    as in encoded mode.


    In absolute mode, each run must be aligned on a word boundary. The following example
    shows the hexadecimal values of an 8-bit compressed bitmap:


    ```

    ```

    03 04 05 06 00 03 45 56 67 00 02 78 00 02 05 01

    02 78 00 00 09 1E 00 01

    ```

    ```


    This bitmap would expand as follows (two-digit values represent a color index
    for a single pixel):


    ```

    ```

    04 04 04

    06 06 06 06 06

    45 56 67

    78 78

    move current position 5 right and 1 down

    78 78

    end of line

    1E 1E 1E 1E 1E 1E 1E 1E

    end of RLE bitmap

    ```

    ```


    When the **biCompression** field is set to **BI_RLE4**, the bitmap is compressed
    using a run-length encoding format for a 4-bit bitmap, which also uses encoded
    and absolute modes. In encoded mode, the first byte of the pair contains the number
    of pixels to be drawn using the color indexes in the second byte. The second byte
    contains two color indexes; one in its high-order nibble (that is, its low-order
    four bits) and one in its low-order nibble. The first of the pixels is drawn using
    the color specified by the high-order nibble, the second is drawn


    | Table 9.5 Second byte. |

    | Second Byte Of Escape | Meaning |

    | :---------------------- | :----- |

    | 0 | End of line. |

    | 1 | End of bitmap. |

    | 2 | Delta. The two bytes following the escape contain unsigned values indicating
    the horizontal and vertical offset of the next pixel from the current position.
    |'
