- pgno: 16
  md: '# ## Foreword


    I can’t draw. I love all forms of art, but I can’t draw. I can play guitar decently.
    I can cook and sew, but I can’t draw—and I’m envious of those who can. Sure, I
    can drive a golf ball 300 yards (downhill with the wind at my back), but don’t
    ask me to draw a picture of a cat. The trouble is, I see myself as a creative
    guy, and I’ve always wanted to be able to express myself in drawings. Big mistake.


    So, no big deal right? Except, I’ve also always been a very competitive person,
    and to fail at something that I wanted to excel in was more than disappointing.
    It’s not like I haven’t tried. I can remember back to first grade where, happy
    as a clam, I worked diligently on a drawing for some assignment only to be humiliated
    by the way mine looked compared to those done by my classmates. And it never got
    any better. Was it in 6th grade that my art teacher taught us about perspective
    in drawings? My classmates drew towns, and farms and rail yards. I drew a lopsided
    house.


    However, sometime in 1972, when at the University of Michigan, I took an independent
    study course in computer graphics. I was a very fortunate young man, because as
    it turns out, the grad student who taught the course was none other than Jim Blinn.
    Jim inspired me. He showed me how I could program a computer to draw what I could
    not draw with my hands. He showed me how to use matrix math to accurately represent
    a geometric object on a computer screen—and then a group of geometric objects.
    Then, he showed me how to move those objects around and look at them from different
    angles. But even more than that, Jim Blinn inspired me to think about ways to
    use a computer to create art I otherwise lacked the talent to create.


    Because it was only one class, I was not able to learn too much more directly
    from Jim, but that class opened my eyes to what could be done. (Jim later went
    on to show us all a great deal more about'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'what could be done with computers and art—and happily he''s still doing it
    today. Now I

    was no longer ashamed of my artistic inadequacies. Rather, I was turned on to
    a whole new

    creative medium. Something that had just not existed before was now available
    to me.

    What''s more, I was able to take advantage of it.


    For me, this eventually led to design and development of computer games. In 1972,
    the

    term “PC” was meaningless: There was no such thing as a Personal Computer and
    thank-

    fully, the notion of “political correctness” had not yet reared its ugly head.
    But now, more

    than 25 years later, the technology has advanced so far that it has become accessible
    to

    many more people.


    The book you hold in your hands can open a door into a new medium. Though it has
    been

    around for more than 25 years, the medium of computer graphics is still very new.
    However,

    there are a few things that you have to learn in order to be able to make inroads
    into this new

    “frontier.” After all, you had to learn which end of a paintbrush to hold. And
    those of you

    who drew those nice towns and farms after learning about how perspective works
    in art—

    yes you—well, you had to learn about vanishing lines and such first too.


    So, instead of sharpening your pastel pencils or mixing your paints, fire-up your
    compilers,

    assemblers, and IDEs. Dig into this book, roll up your sleeves, and start coding.
    Hey, com-

    pared to working in oils, the cleanup is a breeze.


    —Ed Rotberg

    Sole Programmer of Atari’s Battlezone

    September 30, 1999'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# # Introduction


    > The Web is a medium for people who wouldn’t otherwise use computers.


    Have you been looking for a simple graphics package for your Linux system? If
    so, look no further. SVGAlib provides an easy way to create graphical applications
    and eliminates the complexities and rigmarole of the X Windowing System. Even
    if you have no more than the most rudimentary grasp of programming in C, you can
    use SVGAlib.


    # ## What Is SVGAlib?


    SVGAlib is a low-level graphics library for Linux. It augments the C programming
    language, which (in its purest form) doesn’t provide support for graphics. SVGAlib
    bridges the gap between hardware and software, and allows you to spend your time
    doing the things that you want: namely, coding programs, and not fretting over
    complex issues more appropriately suited for video engineers.


    In short, SVGAlib is a wonderful tool that allows you to draw all sorts of fantastic
    images on the screen. You can draw lines, squares, and circles, as well as more
    complex images of your own design. You’ll have a full range of colors to choose
    from (as many as your graphics card will allow), and a variety of screen resolutions
    are available, too. If you can dream it, you can draw it.


    Fortunately, SVGAlib is provided with most Linux distributions, so you’ll be able
    to publish your programs, and circulate them among your friends.


    SVGAlib offers numerous advantages to Linux developers, including the following:


    +   - Full-screen graphics

    +   - High-speed rendering (drawing)

    +   - Quick startup/gentle learning curve

    +   - Years of proven experience'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# ## Intended Audience


    The beauty of SVGAlib lies in its functionality and ease of use. Users span the
    gamut from raw beginners to graphics professionals, and this book is designed
    accordingly. If you lack experience with graphics, or even with programming as
    a whole, you shouldn’t feel afraid to follow along and learn as you go. You will
    definitely find the first three chapters to be of special importance.


    Conversely, experienced users won’t be ignored either, as later chapters deal
    with applied knowledge and more advanced issues, such as 3D graphics, interfaces,
    fonts, and pointing devices like the mouse and joystick. Even if you think you
    know everything there is to know about graphics, you’ll find this book to be a
    handy reference.


    In summary, if you can use Linux, you can use SVGAlib.


    # ## Will I Need To Know Assembly Language?


    Fortunately, no! SVGAlib provides you with a wide selection of powerful and efficient
    drawing primitives that interact with your hardware entirely behind the scenes.
    This arrangement eliminates the need for assembly language, which allows you to
    work solely with easy-to-use, high-level C/C++ functions. In turn, you’ll find
    the coding process to be much easier, as changes can be implemented in a matter
    of seconds, and your end result becomes infinitely more portable, too.


    Thus, even an inexperienced programmer can quickly learn to doodle on the screen,
    and seasoned designers can rapidly create superb graphical masterpieces.


    It’s recognized that many people will eventually want to learn what makes SVGAlib
    work. Accordingly, the complete source code is always available.


    # ## Code Examples


    Each chapter is filled with numerous code examples designed to help you with your
    programming endeavors. The majority of the programs aren’t finished products like
    you’d find in a store, but rather simplistic code, or even snippets, which highlight
    a particular function or procedure. In this way, you can learn the many aspects
    of SVGAlib without having to wade through pages and pages of extraneous material.


    After reading each chapter, you should be able to join the many disparate elements
    together to form a complete application of your own design.


    The code for every example is provided on the accompanying CD-ROM, and you’re
    welcome to copy, embellish, improve, and redistribute the material as you please.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# ## Chapter Summary


    Chapters are designed to progress in an order of increasing skill level, and the
    majority rely on the knowledge presented in previous examples. However, you''re
    welcome to skip forward if you''re interested in a particular subject, and if
    you think you can handle it out of sequence. That said, here''s a brief rundown
    of what you can expect to find in the pages ahead:


    Chapter 1, *Getting Started*, introduces SVGAlib and covers the process of compilation
    and installation. You''ll also learn what makes SVGAlib necessary, and how it
    connects with your programs.


    Chapter 2, *Graphics Basics*, teaches you the general graphics theory that you''ll
    need to know for the upcoming chapters. Topics discussed include screen modes
    and modern video hardware.


    Chapter 3, *First Programs*, is designed to help you write and compile your first
    programs using SVGAlib. Common program layout, essential functions, basic drawing
    primitives, and compilation are all covered extensively.


    Chapter 4, *Complex Shapes, Formulas, And Functions*, demonstrates how to develop
    and implement shape drawing functions that SVGAlib currently lacks. Circles are
    covered in detail, as are other useful geometric designs.


    Chapter 5, *Color*, explains the theory behind color usage in the VGA card. Of
    course, numerous code examples are presented to help you learn about palettes
    and RGB color.


    Chapter 6, *Shades, Fills, And Patterns*, covers special techniques such as screen
    fades, antialiasing, and providing graphics at boot time.


    Chapter 7, *Fonts*, introduces you to the world of graphical text. Here you''ll
    find information on creating your own fonts, as well as utilizing existing ones.


    Chapter 8, *Fractals*, gives you the rundown on this esoteric art. You''ll find
    plenty of theory, followed by actual examples.


    Chapter 9, *Graphic Files*, explains how to easily read and display the images
    encoded in files such as GIFs and JPGs. You''ll also learn how to make screen
    shots, and how to save the resultant data into a new file.


    Chapter 10, *Basic Animation*, gets you started with moving shapes and images.


    Chapter 11, *Polygons*, discusses that vital element of 3D images, the polygon.
    Triangles, as well as SVGAlib''s threeDKit, are covered in detail.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'Chapter 12, 3D Images, shows how to render an image with depth and shadow.


    Chapter 13, Raytracing And Photorealism, explains how the experts apply a photographic
    touch to make images appear lifelike.


    Chapter 14, Game Basics, returns to the world of fractals to produce stunning
    renditions of natural terrain, clouds, and even planets, that can all be used
    as backdrops in programs of your own design.


    Chapter 15, Using The Mouse And Joystick, tells you everything you need to know
    about including pointing devices in your own code. It’s much simpler than you
    might expect!


    Chapter 16, Landscapes, finally jumps in and combines the elements of previous
    chapters to get you started with game programming. This is one of the major applications
    of graphics, and is something you won’t want to miss.


    Chapter 17, A Look At Existing SVGAib Applications, examines what others have
    done to bring you entertainment by way of SVGAib. Numerous games are presented,
    as well as information on porting new games to Linux/SVGAib.


    Chapter 18, Simple Paint Program, combines the knowledge gained thus far to create
    a general purpose painting/drawing/image manipulation program with a professional
    look and feel.


    Chapter 19, Thoughts On A GUI, gives examples of how a graphical user interface,
    today’s trendy topic, might be constructed with SVGAib.


    Chapter 20, Video Card Drivers, finally gives some insight on how driver code
    is written for new video cards.


    Appendix A, GNU General Public License, gives you a reference as it applies to
    the software this book was written about. However, the GPL does not apply to the
    text of this book.


    Appendix B, libvga Functions, gives a complete list of every function contained
    in libvga.so.1.4.0.


    Appendix C, Libvagl Functions, complements Appendix A by providing a complete
    list of the functions present in libvagal.so.1.4.0.


    Appendix D, ASCII Character Codes, gives you a handy reference table for all 256
    ASCII characters.


    Appendix E, Chipsets Supported By SVGAib, give a complete list of the video chipsets
    presently supported by SVGAib, as well as information on the generic VESA driver.


    Appendix F, A Brief History Of SVGAib, shows the evolution as SVGAib, and the
    people responsible for making it what it is today.


    Appendix G, FAQs And Troubleshooting, covers common problems experienced by beginners,
    and provides the appropriate resolution.'
  merge: -1
  img_proc: true
- pgno: 22
  md: "# # Conventions Used In This Book\n\nIt's well known that there are several\
    \ ways to format a program written in C. Some people will argue that their way\
    \ is the best, while others will be staunchly in favor of utilizing their own\
    \ method. Regardless, the only issues that really matter are your ease of coding,\
    \ and your code's readability by others.\n\nKeeping in line with my second criterion,\
    \ I have strived to make the code in this book as readable as possible.\n\n# ##\
    \ Function Names\n\nAll function names will appear in lowercase letters. When\
    \ a name is comprised of two or more words, an underscore character will be used\
    \ to join them, as follows:\n\n```\n`function_name()`\n```\n\n# ## Braces (a.k.a.\
    \ Curly Braces, or Brackets)\n\nAlthough this deviates from the original Kernighan\
    \ & Ritchie method (as demonstrated in their landmark volume, “The C Programming\
    \ Language”), I have made an effort to place all braces in line with one another.\
    \ I find this to be the easiest method of distinguishing between functions, especially\
    \ for beginners. It does use some extra space, but I find the end result to be\
    \ well worth it.\n\nFor example:\n\n```\n```\nfunction()\n{\n   /* Code goes here\
    \ */\n}\n```\n```\n\n# ## Comments\n\nFor those of you who are new to C, everything\
    \ that appears within a pair of forward slash and asterisk characters is a comment.\
    \ For example:\n\n```\n`/* This is a comment */`\n```\n\nComments may be used\
    \ liberally, as they are stripped from your source code by the C compiler at compilation\
    \ time, and don't add to a compiled program's size.\n\n# ## SVGAlib Versions\n\
    \nThis book is relevant to all versions of SVGAlib, although I've focused on the\
    \ most recent release: 1.4.0. Many Linux distributions contain earlier versions\
    \ of the library, which you're welcome to use for coding purposes. However, you\
    \ may find that you're missing some useful"
