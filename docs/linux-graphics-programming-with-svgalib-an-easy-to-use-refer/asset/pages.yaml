    \ systems. This made it enormously successful and widely utilized, and it’s still\
    \ in use today.\n\nMore recently, a new breed of graphical interfaces has been\
    \ developed, specifically for Linux. You may be familiar with them; they include\
    \ GNOME (the GNU Network Object Model Environment) and KDE (the K Desktop Environment).\
    \ These have received a lot of press lately, mainly because Linux lags so far\
    \ behind Windows and Macintosh in the “mom and\n\n> **Hacker Lingo:** *CLUE*\n\
