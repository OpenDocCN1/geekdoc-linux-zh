    # ## Mouse Cursors


    Now that you''ve got a basic grasp on the standard mouse functions, I''m sure
    you''ll want to run off and code some programs. However, you may be in for a surprise
    when you realize that SVGAlib doesn''t provide you with a mouse cursor. That''s
    right—although the position of the mouse is carefully tracked, there''s nothing
    shown on the screen.


    This may seem like a major setback, but in actuality it''s a blessing. You''ve
    been given the freedom to come up with a cursor of your own design. I suppose
    it might not be too unreasonable to hope for a default cursor, but conversely,
    you''re not saddled with someone else''s deficient pixel work, either. Regardless
    of your outlook, you''ll still have to come up with *something*.'
