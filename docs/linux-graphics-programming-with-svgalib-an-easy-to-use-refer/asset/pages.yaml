- pgno: 201
  md: '# ## History Of Fractals


    The emergence of fractal science is due entirely to the efforts of one man: Benoit
    Mandelbrot. Finding traditional geometry to be cold and dry, Mandelbrot began
    his study of the regularities and irregularities of patterns in nature. His research
    was based on the work of earlier mathematicians such as duBois Reymond, Cantor,
    and Peano. He first published his findings in 1975, and fractals have been a part
    of modern science ever since.


    Mandelbrot coined the term *fractal* from the Latin word *fractus*, which means
    *fragmented* or *irregular*. It pertains to recursion in chaos and random events.
    We''ll have a look at an actual equation in the following section.


    # ## Mandelbrot Set


    The classic fractal equation is as follows:


    $z_{(n+1)} = z_{(n)}^2 + c$


    Using Table 8.1 as a reference, you could rewrite this as:


    (a, b) = (axa-bxb, axb+bxa) + (x, y)


    By plugging values into *z* and *c* (with both *z* and *c* being sets of ordered
    pairs/planar coordinates/complex numbers), one gets the famous *Mandelbrot* set.
    When mapped on a screen matrix, these numbers create the image seen in Figure
    8.4. Note that *z* always starts at zero (0, 0).


    Once again, the interesting thing about fractals (aside from their frequently
    amoebae-like appearance) is that if you were to magnify one, you would see a design
    that''s identical to the appearance of the full-sized fractal. That is, they''re
    recursive—a small segment resembles the whole. Figure 8.5 demonstrates this aspect
    quite well.


    # ## Code


    Listing 8.1 shows how to implement the Mandelbrot set in C. Because C can''t handle
    complex numbers directly, a little finagling is necessary. However, the resultant
    code is still fairly compact. Also, note that a screen mode of at least 800×600
    is necessary for the best results. I''ve gone ahead and stepped up to screen mode
    12 (G1, 024×768×256) to provide even greater detail. Finally, be sure to use the
    `-Ivgag1` flag when compiling (hint, hint).


    *Note*


    Note that you might not need to include `<math.h>` and/or the `-lm` command line
    compilation flag. I don''t seem to need this on my machine; this code compiles
    fine without it. However, some people whom I correspond with do, so I''ve included
    it for your convenience.'
