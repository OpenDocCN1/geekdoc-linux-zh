- pgno: 260
  md: '# Chapter 12

    3D Images


    +   *Key Topics:*

    +   * *Theory*

    +   * *Creating 3D objects*

    +   * *Texture mapping*


    To be taken seriously in today''s video-centric world, the visual programmer needs
    to be proficient in 3D graphics. Simply put, there''s no other way to go. One
    could be well versed—yes, even commercially successful—in several other visual
    disciplines, but this is the one field that separates the men from the boys (figuratively
    speaking, of course).


    New media companies such as Pixar get all the press, and that''s not likely to
    change anytime soon. Although it''s true that anything involving Steve Jobs (a
    founder of Pixar) is based on a certain amount of hype, there''s an element of
    prophecy in what''s being done. 2D is out of fashion, and 3D is in. This development
    is a bit unfair to those who are skilled in "traditional" computer graphics—a
    field that still has plenty of valid applications—but it also stands as an opportunity
    to excel in a genre that hasn''t yet seen all its players.


    Hollywood has long since used computer-generated graphic effects to wow audiences.
    Tron was an early example, and some productions—the movie Toy Story comes to mind—are
    now being made entirely with 3D animation. This futuristic trend isn''t restricted
    to the cinema, either—just turn on the tube for a demonstration. Modern television''s
    repertoire is chock-full of dazzling 3D displays. The news, weather, and even
    sports have all sorts of electronic wizardry designed to jazz up the dull spots.
    Flashy visuals have progressed to the point where the same old stuff shown night
    after night can be made to appear fresh and exciting. Even a genre as trivial
    as commercials now relies heavily on 3D techniques.'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'So, how do we do this 3D thing? Of course, no image on a flat computer display
    can truly be “3D.” Nothing’s going to jump out of the screen at you, and you won’t
    need to wear special glasses. The term 3D, when applied to computer graphics,
    simply means that objects appear to have depth. In other words, through precise
    mathematical calculations, images are given shading and other characteristics
    that suggest depth and volume.


    The key to all of this is proceduralism. Objects created in this manner (as opposed
    to the “hacked,” pseudo-3D sphere in Chapter 6) can often be rotated and moved
    by means of algorithmic methods alone. This is because true 3D images are the
    products of equations, and not merely static (that is, flat) line drawings (such
    as those an artist might create with packages such as Illustrator or Photoshop).


    For instance, you can’t see the backside of an image created with a drawing program
    because, simply enough, there is no backside. But a 3D object—a true one—can be
    rotated and viewed from any angle.


    # Four Types Of 3D Objects


    There are four types of computer-generated 3D images, each one having its own
    unique advantages and drawbacks. In increasing order of complexity, these models
    include wire-frames, filled polygons, texture-mapped polygons, and the most beautiful
    of them all: simulated ray casts, or ray traces.


    # Wire Frames


    As the name suggests, a *wire frame* appears as though it’s been modeled from
    wire. This type of image is created when lines are drawn between a series of vertices
    plotted in a 3D space. You’ve probably seen this type of image before—see Figure
    12.1 for an example of how it looks.


    # Filled Polygons


    Moving up from the wire frame, an image comprised of *filled polygons* is created
    by using the techniques suggested in Chapter 11. Instead of using bare lines as
    in the previous example, a number of solid triangles or other polygons appear
    everywhere there’s a surface,'
