  md: 'found at `metalab.unc.edu` in the `/pub/Linux/GCC` directory. If you''re interested,
    the original gcc site is at `www.gnu.org`. In either case, look for `gcc-2.95.1.tar.gz`,
    or any later version.


    **Note**


    The author has successfully compiled SVGAlib on Intel- and Cyrix-based systems.
    However, AMD processors can sometimes cause problems when used with Linux. They
    may look like a good buy now ("I can buy the computer and a VCR!"), but you might
    be sorry later ("Why isn''t this compiling?"). My advice is to accept that AMD
    is a Windows platform and leave it at that.


    # SVGAlib On The Compaq Alpha


    Although SVGAlib is used mainly on Intel (and variant) systems, David Mosberger-Tang
    has contributed patches to make SVGAlib run on Alphas. Read the O-INSTALL file
    if you have an interest in this.


    # Unpacking The Distribution


    It''s suggested that you store the source files in either the `/usr/src` or `/usr/local/src`
    directory, but it makes no difference. After downloading or otherwise obtaining
    the distribution, you''ll need to uncompress it by running `gunzip` and `tar`.
    Simply type `gunzip svgalib-1.4.0.tar.gz` and then `tar -xzf svgalib-1.4.0.tar`.
    You can save a step and do this all at once by using `tar -xzf`. Typing `tar -xzf
    svgalib-1.4.0.tar.gz` will create a directory called `svgalib-1.4.0`, which will
    be filled with the subdirectories and files listed in Table 1.1.


    Table 1.1 Package contents.

    | Directory | Files |

    |---|---|

    | *demos/* | Demo and test programs. |

    | *doc/* | README files and man pages. (See the O-README file in this directory
    for information on how to read these man pages without installing SVGAlib and
    how to produce nice printouts.) |

    | *et4000/* | Notes, utilities, and sample registers for ET4000. |

    | *gl/* | External framebuffer graphics library sources. |

    | *include/* | Links to the various header files needed for compilation. |

    | *jmp/* | Configuration files for building a DLL shared library. |

    | *lrm-0.6m/* | Linux real-mode library (used for VESA drivers). Including a utility
    for restoring text mode. |

    | *mach/* | Notes and a utility for the ATI Mach32 driver. |

    | *sharedlib/* | Shared library image and stubs. |

    | *src/* | Main library source. |

    | *support/* | DOS-based utility for dumping VGA registers. |

    | *svpmi/* | Basic initial untested SVPMI skeleton driver. |

    | *threeDKit/* | Routines for drawing 3D triangles and 3D demos. |

    | *utils/* | Text mode/font utilities. |'
  merge: -1
  img_proc: true
- pgno: 27
  md: '> **Note**

    > *Users of glibc should note that after you unpack the source code, you''ll need
    to install the binary distribution to the compatibility libraries directory, which
    is (on most glibc2 systems) /usr/1486-linux/lib.*


    If you have an older distribution (such as 1.3.1), I’d suggest erasing that directory
    now. Cautious users may feel the need to keep their old SVGAlib files on hand
    as an emergency backup, but this is generally unnecessary, because the current
    version is stable. Keeping these older source files won’t affect your new distribution,
    but they will take up space.


    With regard to your old shared libraries (located in /lib), it’s not necessary
    to erase these, because the new binaries will overwrite the old ones by default.
    If you feel the overwhelming urge to keep your old “.so” files, you’ll need to
    edit Makefile.cfg. Be aware, though, that the rewrite is the last step in the
    installation process. If your compile bombs, the old shared libraries won’t be
    touched. Alternatively, you can hide them by renaming them.


    # A Word About Slackware


    Unlike a lot of people, I personally like Slackware. I feel it’s helped me learn
    a great deal about Linux—knowledge that I might not have otherwise obtained. Whereas
    other distributions hold your hand every step of the way, Slackware usage dictates
    that you get your hands dirty. But, alas, there’s one drawback: Slackware, by
    default, will scatter your SVGAlib files all over the place. If you want to erase
    your old distribution, you’ll need to look in /usr/lib/svgalib, /usr/lib/threeDKit,
    and /usr/doc/svgalib-version number. Why they did this, I’ll never know.


    # Building SVGAlib


    You have a number of decisions to make when compiling your own version of SVGAlib,
    and we’ll attempt to help you out with those here. The choices you make will affect
    your library’s performance, but all is not lost if you make a mistake. Simply
    reread the pertinent configuration files, recompile if necessary, and you’ll be
    able to start afresh.


    > **Note**

    > *Elements of the following section were taken or adapted from the documentation
    files that accompany SVGAlib. These files were most likely originally written
    by Harm Hanaemeyer and have since been modified by Dr. Michael Weller and the
    current maintainer, Matan Ziv-Av.*


    There are five easy steps involved in building SVGAlib:


    +   1. Edit Makefile.cfg to customize your installation.

    +   2. If you’ve already built a version of SVGAlib from the source you’ll be
    using now, it’s essential that you run make clean to remove any object files left
    over from the last compilation.'
  merge: -1
  img_proc: true
- pgno: 28
  md: "# glibc2 Or libc.so.5?\n\nYou probably know that libc is the library that includes\
    \ all the standard C commands (such as *printf*, *read*, *open*, and so on), as\
    \ well as system calls. Up until 1997, the only library available was the GNU\
    \ libc v1, which since the move to ELF binary format was given major number 5\
    \ (*/lib/libc.so.5*). In 1997, the Free Software Foundation developed GNU libc\
    \ v2, with the intention of being cleaner, more portable, and more standard (POSIX\
    \ compliant). Under Linux, this version got major number 6, hence it's called\
    \ libc6. These two libraries are incompatible—if a program is compiled with one\
    \ libc's headers and stubs, it can't be used with the other. Some of the distributions\
    \ (Redhat since version 5, Debian since 2, SuSE since 6, and Slackware since 4)\
    \ have moved to libc6 (meaning that most binaries are compiled with libc6, and\
    \ the development environment contains libc6 headers and produces programs that\
    \ work only with libc6). The distributions still contain libc5, as well as other\
    \ libraries that are linked with libc5, in order to run libc5 binaries, which\
    \ will usually be programs where the source is not available (such as Quake).\
    \ The problem is that if a user of the system wants to use a new version of one\
    \ of these libraries, she can't compile them, because only libc6 programs or libraries\
    \ can be produced.\n\n—Contributed by Matan Ziv-Av\n\n+   3. Run *make install*\
    \ to actually perform the compilation and installation.\n+   4. Run *make demoprogs*\
    \ if you want to compile the programs in /demos and /threeDKit.\n+   5. Edit */etc/vga/libvga.config*\
    \ to specify monitor and mouse settings.\n\n# Makefile.cfg\n\n*Makefile.cfg* is\
    \ a text file that defines the events that will take place during compilation\
    \ and installation. It's a good idea to look at it, even if you don't anticipate\
    \ making any changes.\n\n> **Note**\n> \n> *It's Makefile.cfg that you want to\
    \ edit, not the actual makefile.*\n\nUnfortunately, some users will have to make\
    \ at least one modification: If you're using a glibc2-based system (such as RedHat\
    \ 5.x, Debian 2.x, or SuSE 6.x), you must uncomment USEGLIBC=yes.\n\nLet's take\
    \ a look at Makefile.cfg, shown below, and go over some of the more important\
    \ points. Basically, the default install puts the shared libraries in */lib*,\
    \ the static library in */usr/lib*, and the header files in */usr/include*. Text\
    \ mode utilities are installed in */usr/bin*.\n\n> **Note**\n> \n> *In case you\
    \ haven't worked with this type of configuration file before, commented lines\
    \ begin with a pound sign (#) and are ignored by the compiler. To make these lines\
    \ active again, simply remove the leading #. Conversely, adding a leading # will\
    \ make a line invisible to the compiler, if you need to do that.*"
  merge: -1
  img_proc: true
