  img_proc: true
- pgno: 131
  md: "an antialiased circle in this manner, by drawing a slightly larger circle in\
    \ a lighter color first and then drawing your main circle smack on top of that.\n\
    \n# ## A Better Method\n\nA more efficient and effective method for antialiasing\
    \ a line would be to draw the “buffer” pixels at the same time that the main line\
    \ (or shape) is being drawn. Listing 6.6 shows one way of doing this, using the\
    \ basic formula found in `vga_drawline()` combined with the faster vgal drawing\
    \ functions. As each primary pixel is painted, the surrounding pixels are then\
    \ shaded accordingly. The buffer pixels are either placed to the left and right\
    \ of the main pixel or else above and below, based on the slope of the line.\n\
    \nTo improve overall quality, the color value of each buffer pixel is determined\
    \ before it’s drawn, which allows for a multicolored background. This can get\
    \ tricky, however, when you consider that `gl_getpalettecolor()` normally uses\
    \ the 64-color scale, whereas `gl_getpixelrgb()` and `gl_setpixelrgb()` anticipate\
    \ 256 colors. To compensate, I’ve multiplied each `gl_getpalettecolor()` value\
    \ by four, which will work every time, unlike `vga_ext_set()`.\n\n```\nListing\
    \ 6.6 A better way to antialias a line.\n\n```c\n#define ABS(a) (((a)<0) ? -(a)\
    \ : (a))\n\nint book_aa_line(int x1, int y1, int x2, int y2, int color)\n{\n \
    \   int dx = x2 - x1;\n    int dy = y2 - y1;\n    int ax = ABS(dx) << 1;\n   \
    \ int ay = ABS(dy) << 1;\n    int sx = (dx > 0) ? 1 : -1;\n    int sy = (dy >\
    \ 0) ? 1 : -1;\n\n    int x = x1;\n    int y = y1;\n\n    int r1,\n        g1,\n\
    \        b1,\n        r2,\n        g2,\n        b2;\n\n    /* If the line is vertical\
    \ or horizontal, no antialiasing\n       is necessary.\n    */\n    if ((dx ==\
    \ 0) || (dy == 0))\n    {\n        gl_line(x1, y1, x2, y2, color);\n```\n```"
