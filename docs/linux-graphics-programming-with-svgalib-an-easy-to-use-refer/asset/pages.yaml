- pgno: 330
  md: "himself so eloquently phrased it, “A fractal is a set whose Hausdorff-Besicovitch\
    \ dimension is strictly greater than its topological dimension.” (Is it any wonder\
    \ why I was rejected from all the really good schools?)\n\nIf you haven't guessed\
    \ already, computer-generated topographies bear much in the way of resemblance\
    \ to the two-dimensional fractals discussed in Chapter 8.\n\n# A Brief History\
    \ Of Artificial Landscapes\n\nAs with many great inventions, the discovery of\
    \ the landscape techniques presented here was by and large an accident. At some\
    \ point, it was noticed that a combination of subdivision and random perturbation\
    \ of a line creates an image that somewhat resembles a distant mountain ridge.\
    \ The principle isn't altogether different from Koch's Snowflake (see Chapter\
    \ 8), and if you look at Figures 16.2 through 16.4, you'll see a good example\
    \ of the process in action.\n\nA line is broken into two sections, and the midpoint\
    \ is raised or lowered according to a random value. Then, each of the resultant\
    \ two lines is broken and displaced in the same manner. You can repeat this cycle\
    \ over and over until you've run out of space (of course, you can't subdivide\
    \ a single pixel!), but all it usually takes is three repetitions to achieve the\
    \ desired effect.\n\nThis exercise is good for demonstrating the principle, but\
    \ it's not very inspiring. What you need is some depth.\n\n![](img/2e475714ef8969ed272622c46473d334_330_0.png)\n\
    \n**Figure 16.2**  \nRandom perturbation, stage one.\n\n![](img/2e475714ef8969ed272622c46473d334_330_1.png)\n\
    \n**Figure 16.3**  \nRandom perturbation, stage two.\n\n![](img/2e475714ef8969ed272622c46473d334_330_2.png)\n\
    \n**Figure 16.4**  \nRandom perturbation, stage three."
