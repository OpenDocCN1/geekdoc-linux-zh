  md: "# Listing 3.16 Neatly arranged boxes displaying the first 256 standard SVGA**colors**.\n\
    \n```\n#include <stdlib.h>\n#include <vga.h>\n#include <vgagl.h>\n\nint main(void)\n\
    {\n    int x,\n        y,\n        c = 0;\n\n    vga_init();\n    vga_setmode(G320x200x256);\n\
    \    gl_setcontextvga(G320x200x256);\n\n    for (y = 2; y < 183; y += 12)\n  \
    \  {\n        for (x = 2; x < 183; x += 12)\n        {\n            gl_fillbox(x,\
    \ y, 10, 10, c++);\n        }\n    }\n\n    vga_getch();\n    vga_setmode(TEXT);\n\
    \    return 0;\n}\n\n```\n\nFigure 3.4 shows how this should turn out, minus the\
    \ color.\n\nPretty cool, huh? If you only compile one program from this chapter,\
    \ I’d suggest you do this one. Not only will you be able to impress your friends,\
    \ you’ll have the option of using this as a programming reference for the future.\
    \ Need a hue? Just fire up your 256-color table and choose one.\n\nNotice that\
    \ the second half of the colors is rather dark. Some people complain that the\
    \ programs they’ve ported to SVGA**lib** are too dark; their colors aren’t exactly\
    \ the same as\n\n# Port\n\nTo alter software so that it can be run under a different\
    \ operating system. If you’re rewriting the graphics in a Windows C program for\
    \ SVGA**lib**, you’re porting the program to Linux. This is often easier said\
    \ than done, regardless of the source or destination."
