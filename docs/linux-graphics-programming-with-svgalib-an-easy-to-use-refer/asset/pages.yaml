    f*file(), you can easily print the image to the screen with \\f*gl\\f*_put\\f*box(int\
    \ \\f*x, int \\f*y, int \\f*w, int \\f*h, void \\f*\\f*\\f*dp), where \\f*\\f*\\\
    f*bitmap and \\f*\\f*\\f*dp are pointers to the same image. Conversely, \\f*gl\\\
