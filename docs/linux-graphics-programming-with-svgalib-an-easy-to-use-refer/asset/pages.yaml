- pgno: 492
  md: '# Appendix E

    # Chipsets Supported By SVGAlib


    The following chipsets, current as of January 1, 2000, are known to work with
    SVGAlib.


    Be aware that many video card manufacturers, including big name brands, routinely
    use chipsets built by other companies. Therefore, it’s entirely possible that
    your graphics card is supported, even if you don’t see it listed in this appendix.
    At the very least, it might be able to use the VESA driver. Conversely, even though
    two companies might share a chipset, it doesn’t mean that the same driver will
    work with both cards. The two cards may differ enough that two separate drivers
    are required.


    Finally, as stated previously, the new VESA driver will work with many cards that
    don’t have a driver of their own.


    # ## Supported By SVGAlib


    The following chipsets are definitely supported by SVGAlib:


    +   - Standard VGA (Generic)

    +   - 3Dfx—Voodoo Banshee and Voodoo3

    +   - Alliance—ProMotion-AT24, ProMotion-AT25, and ProMotion-AT3D

    +   - ARK Logic—ARK1000PV and ARK2000PV

    +   - ATI—Mach32 and Mach64 (CT or newer only)

    +   - Advance Logic—ALI2301

    +   - Chips & Tech—64300, 65520, 65525, 65530, 65535, 65540, 65545, 65546, 65548,
    65550, 65554, 65555, 68554, and 69000'
  merge: -1
  img_proc: true
