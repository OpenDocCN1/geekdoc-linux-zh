- pgno: 36
  md: "# Refresh Rate\n\nThe number of times per second your monitor is reenergized.\
    \ Your screen is constantly losing its charge and must therefore be refreshed.\
    \ Measured in hertz, display systems typically range from 56Hz to well over 100Hz.\
    \ A minimum of 70Hz is recommended to help prevent eye strain.\n\n# Compilation\n\
    \nNow you're actually ready to build SVGAlib. Type **make install**, and the binaries\
    \ will compile and copy to the appropriate directories, as defined in **Makefile.cfg**.\n\
    \nAssuming all went well, you can complete your installation with **make demoprogs**.\
    \ This will compile several demonstration programs, including **vgtest**, which\
    \ will be placed in the **/demos** and **/threeDKit** subdirectories.\n\n> **Note**\n\
    > \n> You *must* compile and install as root. If you don't, nothing bad will happen\
    \ during compilation, but certain tools will fail to become **setuid** root and\
    \ won't work properly as a result.\n\n# Printing The Man Pages\n\nIf you'd like\
    \ to have a clean version of the *man* pages to print, simply run **make ascii**\
    \ in the **/doc** subdirectory. This can be done at any time, because it isn't\
    \ directly related to your compilation and installation process. The resultant\
    \ three files will be named *svgalib.ascii*, *vgagl.ascii*, and *3d.ascii*.\n\n\
    # Setting Up libvga.config\n\nThe final step in configuring SVGAlib for your system\
    \ is to edit **/etc/vga/libvga.config**. It may look intimidating, but all you\
    \ need to do for now is define your monitor's settings, your chipset (that is,\
    \ VGA card), and what kind of mouse you have (if any). If you don't know your\
    \ monitor's refresh rate, you can usually get this setting from the manufacturer's\
    \ Web site. Failing that, you can try some of the sample listings.\n\nI won't\
    \ include the entire file here, but I will show some excerpts in regard to the\
    \ mouse, monitor, and chipset.\n\n# Horizontal Sync\n\nThe number of lines illuminated\
    \ on a video screen in one second. For example, a resolution of 400 lines refreshed\
    \ 60 times per second requires a scan rate of 24kHz plus overhead (time to bring\
    \ the beam back to the beginning of the next line). This is the same as the horizontal\
    \ sync frequency in your TV."
  merge: -1
  img_proc: true
