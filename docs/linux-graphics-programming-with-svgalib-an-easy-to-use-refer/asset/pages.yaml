    $y = 0;\n\nwhile (<FILE>)\n{\n\n    @rgb = split (/,\\ /, $i++);\n\n    for ($i\
    \ = 0; $i < @rgb; $i++)\n    {\n\n        ($r, $g, $b) = split (/,\\ /, $rgb[$i],\
    \ 3);\n```"
