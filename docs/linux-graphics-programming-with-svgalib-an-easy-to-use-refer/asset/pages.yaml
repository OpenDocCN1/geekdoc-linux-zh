  md: '![](img/2e475714ef8969ed272622c46473d334_354_0.png)


    **Figure 18.1**

    Screen layout for the paint program.


    On the left side, I’ve allocated space for a drawing menu and a color palette.
    A more advanced program might allow these sections to “float” around the screen
    as portable tool bars, but this, too, detracts from my goal of simplicity.


    The rest of the screen is devoted to the drawing area. The larger this area is,
    the better. Nevertheless, scrollbars will be provided for images that don’t fit
    within the confines of one screen.


    # Basic Code


    To start with, I’m going to check and verify that the video card can handle a
    screen mode with a 640x480 matrix and 32K colors. If you’re curious as to why
    I’ve chosen 32K, it’s because it’s the next step up from 256. Although 256 overall
    colors might be adequate, it’s possible that the user will attempt to load a GIF
    image with 256 colors of its own. If those don’t match the colors used by the
    interface, some will be corrupted or lost. Therefore, 32K is necessary, and if
    the video card in question can’t handle this, then the program should exit with
    an error message.


    Listing 18.1 shows the basic shell of my program. As you can see, it isn’t much
    different (yet) than many of the other programs in this book.


