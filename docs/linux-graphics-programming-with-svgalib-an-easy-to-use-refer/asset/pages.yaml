  md: "> **Note**\n> \n> The **bmIColors** field should not contain palette indexes\
    \ if the *bitmap* is to be stored in a file or transferred to another application.\
    \ Unless the application uses the bitmap exclusively and under its complete control,\
    \ the bitmap color table should contain explicit RGB values.\n\n# Bitmap Info\
    \ Header\n\nThe **BITMAPINFOHEADER** structure contains information about the\
    \ dimensions and color format of a Windows 3.0 device-independent bitmap:\n\n\
    ```\n```\ntypedef struct tagBITMAPINFOHEADER{\n  DWORD biSize;\n  DWORD biWidth;\n\
    \  DWORD biHeight;\n  WORD biPlanes;\n  WORD biBitCount;\n  DWORD biCompression;\n\
    \  DWORD biSizeImage;\n  DWORD biXPeilsPerMeter;\n  DWORD biYPeilsPerMeter;\n\
    \  DWORD biClrUsed;\n  DWORD biClrImportant;\n} BITMAPINFOHEADER;\n```\n```\n\n\
    The **BITMAPINFOHEADER** structure has the fields shown in Table 9.4.\n\nThe **BITMAPINFO**\
    \ data structure combines the **BITMAPINFOHEADER** structure and a color table\
    \ to provide a complete definition of the dimensions and colors of a Windows 3.0\
    \ device-independent bitmap. See the description of the **BITMAPINFO** data structure\
    \ for more information about specifying a Windows 3.0 device-independent bitmap.\n\
    \nAn application should use the information stored in the **biSize** field to\
    \ locate the color table in a **BITMAPINFO** data structure with a method such\
    \ as the following:\n\n```\n```cpp\npColor = ((LPSTR) pBitmapInfo + (WORD) (pBitmapInfo\
    \ -> biSize))\n```\n```\n\nWindows supports formats for compressing bitmaps that\
    \ define their colors with eight bits per pixel and with four bits per pixel.\
    \ Compression reduces the disk and memory storage required for the bitmap. The\
    \ following paragraphs describe these formats."
