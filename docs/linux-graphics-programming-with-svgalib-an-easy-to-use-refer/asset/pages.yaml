  md: "![](img/2e475714ef8969ed272622c46473d334_75_0.png)\n\n**Figure 3.3**\nThree\
    \ squares.\n\n# Erasing\n\nThere’s no way to erase output on the screen. Nor is\
    \ there any way to **undo** an action. To remove an object, you simply paint over\
    \ it. If you don’t want anything in its place, set the color to the background\
