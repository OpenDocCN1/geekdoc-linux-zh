- pgno: 439
  md: '+   ◇ VGA *compatible graphics modes*—In general, for all modes following,
    the first number is the amount of x pixels, the second is the amount of y pixels,
    and the third is the number of colors (with shortcuts 32K, 64K, 16M, and 16M4
    in lieu of 32,768, 65,536, and 1,677,721). Those with two colors or more than
    256 colors use fixed-color mappings (either black and white or some RGB true/high
    color); the others make use of a color lookup table. Memory layout for the VGA
    modes is weird—too weird to be explained here. However, you can check the usual
    VGA literature. *vga_setmode*(X()) has a short explanation that’s valid for all
    256 color modes. Here, VGA are the VGA modes: (1) G320x200x16, (2) G640x200x16,
    (3) G640x350x16, (4) G640x480x16, (5) G320x200x256, (6) G320x240x256, (7) G320x400x256,
    (8) G360x256, and (9) G640x480x2.


    +   ◇ Basic *SVG* A modes—These use linear 256-color memory layouts similar to
    G320x200x256. These modes are (10) G640x480x256, (11) G800x600x256, (12) G1,024x768x256,
    and (13) G1,280x1,024x256.


    +   ◇ *High color SVG* A modes—These also use linear memory layouts, but for 32K
    and 64K, each pixel occupies two bytes, and three for 16M. For 32K, each 16-bit
    word is divided into 555-bit portions referring to 5-bit red, green, blue parts.
    The most significant bit is ignored by the card. For 64K, the division is 565,
    allowing you to specify green in a little more detail. (Human eyes are more sensitive
    to green. People joke that this is because our ancestors lived in trees where
    light was filtered through green leaves.) For the 16M modes, from low to high
    addresses, the three bytes are named BGR and specify the blue, green, and red
    parts of the pixel value. These modes are (14) G320x200x32K, (15) G320x200x64K,
    (16) G320x200x16M, (17) G640x480x32K, (18) G640x480x64K, (19) G640x480x16M, (20)
    G800x600x32K, (21) G800x600x64K, (22) G800x600x16M, (23) G1,024x768x32K, (24)
    G1,024x768x64K, (25) G1,024x768x16M, (26) G1,280x1,024x32K, (27) G1,280x1,024x64K,
    and (28) G1,280x1,024x16M.


    +   ◇ *High resolutions with less color numbers*—Memory layout is probably one
    nibble per pixel and two pixels per byte in a linear fashion where the most significant
    nibble is the leftmost pixel. These modes are (29) G800x600x16, (30) G1,024x768x16,
    and (31) G1,280x1,024x16.


    +   ◇ *Hercules emulation mode*—Again, check out the ordinary VGA literature for
    the memory layout. This mode is (32) G720x348x2.


    +   ◇ *32-bit per pixel modes*—These are similar to 16M, but each pixel uses four
    bytes. The first three are similar to 16M but the fourth is left empty and ignored
    by the VGA card (you can store your own status there). This eases pixel address
    calculations on the screen and drawing operations. However, one-higher more data
    has to be moved to the screen. Experiments show, usually, that the higher memory
    bandwidth used outweighs the effects of the simplified algorithms by far. These
    modes are (33) G320x200x16M32, (34) G640x480x16M32, (35) G800x600x16M32, (36)
    G1,024x768x16M32, and (37) G1,280x1,024x16M32.'
  merge: -1
  img_proc: true
- pgno: 440
  md: 'Many more resolution/screen modes are available in <vga.h>. The **vgatest**
    demo produces a list of supported modes for your hardware, prints some information
    on the modes, and allows you to try each of them.


    ```

    ```c

    int vga_addmode(int width, int height, int num_cols, int offset, int bytesperpixel)

    ```

    ```


    Adds a mode to the list of modes, with the given parameters. The function returns
    the mode number. If such a mode already exists on the list, its number is returned,
    and no mode is added.


    Adding a mode to the list is not enough to use it. There must also be a timing
    line that fits that mode. This can be added either as a *modeline* in the config
    file or with either one of these functions: **vga_adtiming()** or **vga_guesstiming()**.


    ```

    ```c

    void vga_setdisplaystart(int a)

    ```

    ```


    Sets the display start address to **a**, where the address is the number of pixels
    offset from the start of video memory (except for hicolor/truecolor modes, which
    use a unit of one byte). This can be used for page-flipping and virtual desktop
    scrolling, but it might not work properly for 16-color modes.


    You should ensure that the memory displayed is actually available on your SVGA
    card by querying the memory size with **vga_modeinfo()** and ensuring that it’s
    saved by SVGAlib during console switches with **vga_claimvideomemory()**. You
    may only set the bits of the display start address returned by **vga_modeinfo()**.


    ```

    ```c

    void vga_setlogicalwidth(int l)

    ```

    ```


    Sets the logical scanline width to **l** bytes, which must be in multiples of
    eight. This function only changes the VGA register; drawing functions don’t take
    it into account. The logical scanline width is the offset between points above
    each other in consecutive lines. Note that for some cards and graphics modes,
    a multiple of eight will not suffice to ensure a proper video timing. Therefore,
    you should only set **l** to multiples of the value returned by **vga_modeinfo()**
    for the graphics mode in question.


    ```

    ```c

    int vga_setlinearaddressing(void)

    ```

    ```


    Switches to linear addressing mode. This maps all (or most) of the SVGA memory
    to the position returned by **vga_getgraphmem()** (which will probably change
    by the time you call **vga_setlinearaddressing()**). The **vga_setpage()** calls
    are no longer required. This ensures optimal performance; however, the drawing
    functions of SVGAlib do not support this memory layout and neither does every
    video card. Use **vga_modeinfo()** to check for availability of the function in
    a given mode.


    Some cards (such as Cirrus) just enable this buffer at a fixed hardware address.
    For Cirrus, it’s mapped at **14MB**, so you should never use it if you have more
    than **14MB** of memory.'
  merge: -1
  img_proc: true
- pgno: 441
  md: '(But how does an application know?) The Mach32 support for this is smarter.
    It enables this feature only when it''s safe to be used.


    To avoid all these problems, you can use the following:


    +   - *nonlinear*—Inhibits use of a linear mmap’d frame buffer.

    +   - *linear*—Allows (not enforces) use of a linear mmap’d frame buffer.


    **Note**


    Add a line in the /etc/vga/libvga.config file to disable the linear frame buffer
    if it cannot be used.


    This function returns the size of the mapped framebuffer if successful (it can
    be less than total video memory) and -1 if not. The *testlinear* demo shows the
    use of this feature (should it work for you).


    ```

    void vga_setmodeX(void)

    ```


    Tries to enable Mode X-like memory organization for the 256-color modes that use
    up to 256K of memory, such as G320x200x256 and G640x400x256. Modes such as G320x240x256
    are Mode X-like by default. *vga_modeinfo*() lists which modes have Mode X memory
    layouts. A Mode X-like memory layout means that memory is organized in four pages—one
    vga_setpage()—and that the top-most pixel (0,1,2,3) is the first pixel in pages
    0, 1, 2, and 3. Pixels 4, 5, 6, 7 are then the second pixels in pages 0, 1, 2,
    and 3.


    On the other hand, packed pixel screen modes will have pixel 0,1,2,3 as pixel
    0,1,2,3 in page 0, and so on. It will only use the next pages if the size of the
    first 64K page is exceeded. This is the way that most SVGA 256-color modes work.
    This function isn’t guaranteed to work. A better method would be to define a new
    mode for planar 320x200x256.


    # ## Extended Features


    This enormous section deals with SVGAlib’s extended features:


    ```

    int vga_ext_set(unsigned what, ...)

    ```


    This function comprises several extended features of SVGAlib. Before trying to
    call vga_ext_set(), you should check whether it’s available in *vga_getmodeinfo()*
    for compatibility with older versions of SVGAlib. In addition, the availability
    of certain features will depend on the current graphics mode. However, VGA_EXT_PAGE_OFFSET
    and VGA_EXT_FONT_SIZE are features of the base module of SVGAlib and are always
    available if your version of SVGAlib supports them.


    Actually, the result of *vga_getmodeinfo()* shows the availability of enhancements
    of vga_ext_set() in the given SVGA graphics mode. Hence, these base features may
    be supported even if SVGAlib doesn’t admit it. Since version 1.2.13, you’ve been
    able to check *vga_getmodeinfo*(TEXT) to see if basic *vga_ext_set()* functionality
    is available. The VGA_EXT_PAGE_OFFSET and VGA_EXT_FONT_SIZE calls are then available
    in any mode even if *vga_getmodeinfo()* states that you shouldn’t call *vga_ext_set()*
    at all.'
