  md: "tion of your program), and you're advised to call it once per main loop. Alternatively,\
    \ if you want your program to stop and wait for some mouse action, use mouse_waitforupdate(void).\n\
    \nWhen you're all finished, you may need to close the mouse. Use mouse_close(void)\
    \ if you initialized the mouse with mouse_init(). If you used vga_setmousesupport(),\
    \ instead, you won't have to do anything—the mouse closes itself.\n\nNow, what\
    \ mouse events can occur between initialization and closing? The possibilities\
    \ include mouse movement, button clicks, and the mouse being forcibly ripped from\
    \ the computer by an angry user. That last option is hard to check for, but you\
    \ can use these three functions to cover everything else:\n\n+   * int mouse_getx(void);\n\
    \n+   * int mouse_gety(void);\n\n+   * int mouse_getbutton(void);\n\nThe first\
    \ two functions return the mouse's current position, and mouse_getbutton() obviously\
    \ checks the state of its buttons. Table 15.2 shows the seven possible return\
    \ values for mouse_getbutton(), and Listing 15.2 shows exactly how you'd go about\
    \ using them.\n\n# **Listing 15.2 The mechanics of mouse_getbutton().**\n\n```\n\
    `int button;`\n```\n\n```\n`button = mouse_getbutton();`\n```\n\n```\n```text\n\
    if (button & MOUSE_LEFTBUTTON)\n{\n    /* The left button has been pressed */\n\
    }\n```\n```\n\n```\n```text\nif (button & MOUSE_RIGHTBUTTON)\n{\n    /* The right\
    \ button has been pressed */\n}\n```\n```\n\n```\n`/* repeat for all applicable\
    \ button codes */`\n```\n\nAs you can see, the integer returned from mouse_getbutton()\
    \ can be bitwise \"and\"ed (&) with MOUSE_LEFTBUTTON, MOUSE_RIGHTBUTTON, and so\
    \ on to produce a meaningful value. A 1 on any of these bits means the button\
    \ has been pressed, whereas a 0 means it hasn't."
