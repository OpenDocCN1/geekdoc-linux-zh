- pgno: 324
  md: "# Words From The Man Page\n\nThe joystick module is basically independent from\
    \ the rest of SVGAlib. You can easily use it in text mode only, but there's no\
    \ benefit to doing that. If used in a graphics mode, however, it will release\
    \ the joystick devices upon a VC switch so that several applications can share\
    \ joysticks. Unfortunately, this doesn't work during joystick calibration. Therefore,\
    \ you should lock the VC with **vga\\_lockvc()** while calibrating in graphics\
    \ mode.\n\nAlso, when using joysticks in text mode only, SVGAlib won't detect\
    \ VC switches and joysticks cannot be shared among applications.\n\nSimilar to\
    \ working with the mouse, you can open, update, and close the joystick with the\
    \ following three commands:\n\n+   - joystick\\_init(int joydev, \\_\\_joystick\\\
    _output jp)\n+   - joystick\\_update(void)\n+   - joystick\\_close(int joydev)\n\
    \nListing 15.6 shows these functions in the context of a real program. Notice\
    \ the similarities to the mouse functions already shown. However, because the\
    \ joystick is largely independent of SVGAlib, you can initialize it before you\
    \ call **vga\\_init().**\n\nThe first argument to **joystick\\_init()**——**joydev**——should\
    \ be a number from 0 to 3. The implication is that you can have multiple joysticks\
    \ operating simultaneously, but Linux can only handle two at the present. (Whoops.)\
    \ It's also recommended that you use **JOY\\_CALIB\\_STDOUT** (defined in **vgajoystick.h**)\
    \ for the second argument.\n\n# Listing 15.6  Joystick basics.\n\n```\n```C\n\
    #include <stdlib.h>\n#include <vga.h>\n#include <vgajoystick.h>\n\nint main(void)\n\
    {\n    int joydev = 0;\n\n    if (joystick_init(joydev, JOY_CALIB_STDOUT) < 0)\n\
    \    {\n        exit(1);\n    }\n\n    vga_init();\n    vga_setmode(G640x480x256);\n\
    \n    while ((key = vga_getkey()) != 27)\n        /* Press 'ESC' to exit. */\n\
    ```\n```"
