  md: "![](img/2e475714ef8969ed272622c46473d334_398_0.png)\n\ndad” usability department.\
    \ In other words, if Linux is ever to enter the desktop market, it needs a friendly\
    \ face, and these applications are designed to help. Figure 19.4 shows a screenshot\
    \ of GNOME, complete with multiple windows.\n\n# ## Design Considerations\n\n\
    Interface experts have compiled a number of helpful points to be considered when\
    \ crafting a GUI. These are proven, real-life criteria, and should be taken into\
    \ account when developing an application. They are as follows:\n\n+   - **Use\
    \ Metaphors**—Play on a user’s existing knowledge to help ease the learning curve.\
    \ For example, applications can and should employ symbolism. Everyone knows what\
    \ a file folder is; they likely use them every day in the office. Thus, it should\
    \ be obvious that a file folder icon represents a collection of files on the computer.\n\
    \n# **Hacker Lingo: WIMP**\n\n> Windows, Icons, Menus, and Pointers. A disparaging\
    \ acronym relating to graphical user interfaces. \n> *“Real men don’t do Windows.”*"
