- pgno: 79
  md: "Now, this is obviously slow, especially in the higher resolution modes, but\
    \ it does demonstrate the principle of creating your own drawing functions. In\
    \ Chapter 4, we'll make better work of this, but for now, be content to know that\
    \ you have the ability to simplify your programs.\n\nEnsure that any color assignments\
    \ you make (that are not immediately followed by drawing functions) come *after*\
    \ **book\\_background()**, because they'll be lost once this is done. For clarification\
    \ purposes, the snippet in Listing 3.14 shows the wrong way to do it.\n\n# **Listing\
    \ 3.14 A wasted color declaration.**\n\n```\n```\nvga_setcolor(8);\n/* Color is\
    \ now dark gray */\n\nbook_background(5);\n/* Current color is now magenta, along\
    \ with the\n   background */\n\nvga_drawline(10, 10, 100, 100);\n/* Surprise!\
    \ The line was drawn in magenta, not dark gray,\n   making it invisible. */\n\
    ```\n```\n\nYou can avoid this by setting your colors immediately before the functions\
    \ in which they're needed. Another solution is to pass a second argument to **book\\\
    _background()**, this one stating the current color number, and then revising\
    \ **book\\_background()** to reset the current color back to its previous assignment.\
    \ Make sense?\n\nAt this point, you should be an expert on home-brewed functions.\
    \ Can you figure out how to write and implement **book\\_square()**? How about\
    \ **book\\_filledsquare()**?\n\n# ### Vgagl\n\nBefore you start thinking that\
    \ SVGAlib is for total lamen with a lot of time on their hands, let's jump into\
    \ the high-speed, low-drag functions of vgagl. As you may remember, these functions\
    \ aren't exactly a part of SVGAlib itself; instead, they're part of a second shared\
    \ library that complements SVGAlib. As such, they need another flag on the command\
    \ line during compilation: -lvagagl.\n\nDon't be afraid to mix and match functions\
    \ from SVGAlib and vgagl. A program doesn't have to be exclusively one or the\
    \ other. In fact, vgagl requires the same **vga\\_init()** and **vga\\_setmode()**\
    \ statements that we used before. Note, however, that you must initialize the\
    \ vgagl library before you use it. This is done with the **gl\\_setcontextvga(int\
    \ mode)** command, which should come immediately after **vga\\_setmode()**. Both\
    \ should use the same mode number. Also, you'll need to #include <vgagl.h> in\
    \ addition to <vga.h>. Finally, if you haven't noticed, all vgagl functions are\
    \ prefixed with gl\\_."
  merge: -1
  img_proc: true
- pgno: 80
  md: "To use vgagl functions, you *must* use the `gl_setcontextvga(int mode)` statement,\
    \ and you *must* include the `-Ivgagl` flag **before** `-Ivga` during compilation.\
    \ Otherwise, you’ll be looking at some segmentation faults. Lastly, `#include\
    \ <vgagl.h>`.\n\nNow we’re ready to rock and roll.\n\n# ## Shapes, The Fast And\
    \ Easy Way\n\nLet’s revisit that program with the three squares. Now we’ll do\
    \ it the vgagl way, as shown in Listing 3.15, which means using `gl_fillbox(int\
    \ x, int y, int w, int h, int c)`.\n\n# **Listing 3.15 Three squares with vgagl.**\n\
    \n```\n```c\n#include <stdlib.h>\n#include <vga.h>\n#include <vgagl.h>\n\nint\
    \ main(void)\n{\n    vga_init();\n    vga_setmode(G320x200x256);\n    gl_setcontextvga(G320x200x256);\n\
    \n    gl_fillbox(30, 85, 50, 45, 4);\n    gl_fillbox(130, 85, 50, 45, 2);\n  \
    \  gl_fillbox(230, 85, 50, 45, 1);\n\n    vga_getch();\n    vga_setmode(TEXT);\n\
    \    return 0;\n}\n```\n```\n\nNow, that’s a bit cleaner, isn’t it? It’s a lot\
    \ faster, too. The vgagl-specific parts are highlighted in gray. We need to supply\
    \ five arguments to `gl_fillbox()`: the upper-left x coordinate, the upper-left\
    \ y coordinate, the width, the height, and the color. You compile it like this:\n\
    \n```\n```\ngcc -Wall -O3 -o gl_squares gl_squares.c -Ivgagl -Ivga\n```\n```\n\
    \nYou can color the background by drawing one large box. To give a mode 5 screen\
    \ a red background, all you have to do is use `gl_fillbox(0, 0, 320, 200, 4)`.\
    \ That sure beats the heck out of `book_background()`.\n\nLet’s make a more interesting\
    \ program with vgagl. Let’s show all the standard 256 colors of SVGALib, displayed\
    \ in a neatly arranged 16×16 grid of boxes (made with `gl_fillbox()`, of course).\
    \ Have a look at Listing 3.16 for my rendition of this.\n\n> **Warning**  \n>\
    \ *For now, don’t try using vgagl in 16 color modes.*"
  merge: -1
  img_proc: true
