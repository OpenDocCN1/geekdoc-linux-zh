    Trio64V+

    +   ◆ SiS—86C201, 86C202, 86C205, 86C215, 86C225, 5597, 6326, and 530

    +   ◆ Trident—TVGA 8900, TGUI 9440, and TGUI 9680

    +   ◆ Tseng—ET3000, ET4000, and ET6000

    +   ◆ Western Digital—WD90C31 (Paradise)


    # ## Unsupported Chipsets That Use The VESA Driver


    The following chipsets aren’t supported but will work with the VESA driver:


    +   ◆ Matrox—Millenium, Mystique, G100, G200, and G400

    +   ◆ Rendition—V1000 and V2200

    +   ◆ S3—ViRGE'
