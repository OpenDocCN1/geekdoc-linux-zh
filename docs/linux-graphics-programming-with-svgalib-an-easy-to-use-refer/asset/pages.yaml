  md: "# Chapter 14\nGame Basics\n\n# Key Topics:\n\n+   \n+   - *Bitmap transparency*\n\
    +   - *Scrolling*\n+   - *Timing*\n\nS alespeople and self-appointed pundits love\
    \ to prattle on endlessly about graphics in business applications, user interfaces,\
    \ and other “serious” environments. For every day that passes, there’s yet another\
    \ boring article about how the visual environment is changing life at home and\
    \ in the workplace. We’re constantly bombarded with vapid and meaningless messages\
    \ about how the Web affects the way we shop, receive information, and make financial\
    \ decisions. And we’re routinely held hostage by arrogant spokes models telling\
    \ us how their new graphical applications can make life better for the handicapped,\
    \ teach young children how to use computers, and assist retired pensioners with\
    \ balancing their checkbooks.\n\nWell, isn’t that just extra special? The simple\
    \ fact of the matter is, we like graphics because they allow us to play games.\n\
    \nWithout further ado, let’s jump right in and learn some techniques that will\
    \ allow you to begin coding what you’ve always wanted to code—games.\n\n# An Easy\
    \ Way To Copy Sprites\n\nInstead of redrawing a sprite every time you want to\
    \ place it somewhere different, wouldn’t you like to just be able to use **gl\\\
    _putbox()**? The only problem is that if your background uses more than one color,\
    \ **gl\\_putbox()** will leave a telltale border around your image. An **irregular\
    \ putbox** function isn’t available (one that inserts a nonrectangular shape),\
    \ but you can achieve the same effect with **gl\\_putboxmask(int x, int y, int\
    \ w, int h, void \\*dp)**."
