    # ## Recollections (Part 2)


    Michael Weller explains how Matan Ziv-Av became the current maintainer:


    > “I knew SVGAlib needed a complete redesign, but no one wanted to help me. Instead,
    people just yelled at me because I didn’t write a driver for their hardware. I
    got tired of this, and I also realized that I might stand in the way of future
    developments.”


    > “I tried hard to get a new maintainer. At some point I finally convinced Matan.
    Mainly because he wrote so many new drivers and code (including the VESA driver)
    that I couldn’t follow his fast development cycles with new releases (due to lack
    of time).”


