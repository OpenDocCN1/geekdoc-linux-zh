  md: "# Drawing Lines\n\nMost of the tools should be pretty easy to implement. One\
    \ of the harder ones, however, is the line tool. It may seem straightforward,\
    \ but it's actually quite a challenge. Any good drawing program will let you click\
    \ the mouse in one spot, thereby affixing one end of the line, and then allow\
    \ you to drag the other end to where ever you need it to be. This technique allows\
    \ the user much greater precision than the frehand \"pencil.\" However, the problem\
    \ is that you, the programmer, will be drawing several lines as the mouse moves\
    \ about. You don't want them all simultaneously, of course—you only want one at\
    \ a time. A mobile line allows the user to draw with confidence, but it's also\
    \ a bit of a hassle. You need to be able to place and erase old versions of the\
    \ line without disturbing what's underneath.\n\nMy solution to this problem is\
    \ to store every pixel as the line is being drawn. When the mouse moves (assuming\
    \ the left button is still pressed), the old line is erased (actually, it's painted\
    \ over, using the array of values that were read when the line was first drawn)\
    \ and then the new one is placed, with a new set of values saved. This process\
    \ continues until the user releases the button.\n\nI accept that my explanation\
    \ may have made things even more confusing for you, so have a look at Listing\
    \ 18.7 for the actual code.\n\nListing 18.7 Mobile line.\n\n```\n```\nvoid line(int\
    \ x, int y, int color)\n{\n    int origx = x,\n         origy = y;\n    int i;\n\
    \n    vga_waитrace();\n    gl_putbox(x, y, 11, 19, box);\n    mouse_line(x, y,\
    \ origx, origy, color);\n    gl_getbox(x, y, 11, 19, box);\n    draw_cursor(x,\
    \ y);\n\n    while (button & MOUSE_LEFTBUTTON)\n    {\n        mouse_update();\n\
    \        x = mouse_getx();\n        y = mouse_gety();\n        if (x < LEFT)\n\
    \        {\n            x = LEFT;\n            mouse_setposition(x, y);\n    \
    \    }\n        if (y < TOP)\n```\n```"
