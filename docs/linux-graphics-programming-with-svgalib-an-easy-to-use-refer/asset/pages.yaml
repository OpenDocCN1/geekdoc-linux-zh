- pgno: 146
  md: '# # Chapter 7

    # Fonts


    # ## Key Topics:


    +   - Bitmapped and scalable fonts

    +   - Integrating fonts into code

    +   - How SVGAlib fonts are constructed

    +   - FontBuilder.c

    +   - FreeType


    # ## What Is A Font?


    Some might argue that fonts aren''t really a part of graphics, but I disagree.
    Fonts appear on the screen, and they comprise a significant portion of graphical
    programs, so I feel their inclusion here is appropriate. In this chapter, I''ll
    cover what fonts are and how they work with SVGAlib. You''ll then learn how to
    utilize existing fonts and create your own, either by hand or with the assistance
    of a "font generation" program. Also, you''ll see what work is being done to bring
    SVGAlib''s fonts up to speed with those found in X Windows and other operating
    systems.


    First of all, what is a font? A font can be defined as a collection of typewriter-rewritten
    characters, all with a consistent design or style. For example, the words in this
    book are written in Times New Roman, a standard word processing font. Thousands
    of other fonts (or typefaces) are available, and many can be found on the Web,
    free of charge. Others are created by professional designers and cost several
    hundred dollars each. Regardless of your preference, you can almost always find
    a font to fit your needs. What''s more, there''s virtually no limit to the number
    of possible fonts—you''re only limited by your imagination in creating new and
    unusual character sets.


    Fonts are stored in data files, which are then accessed by executables at runtime.
    The application reads the data contained in the font file and uses that information
    to produce, or render, the visible characters on your screen. Figure 7.1 shows
    two rendered SVGAlib fonts.'
  merge: -1
  img_proc: true
- pgno: 147
  md: '![](img/2e475714ef8969ed272622c46473d334_147_0.png)


    **Figure 7.1**

    Two different SVGAlib fonts.


    # Two Styles Of Fonts: Bitmapped And Scalable


    Fonts come in two varieties: bitmapped and scalable. One is easy to comprehend,
    and the other is a little more difficult. *Bitmapped* fonts are the easy ones,
    and they’re similar to bitmapped graphics. Drawn on a grid, or *matrix*, they
    always look the same, because a bitmapped font’s data file contains an exact rendering
    of each character. It’s similar in that respect to a graphic file or even a photograph.
    When the font is accessed, the “picture” of each character is loaded into memory
    and then displayed verbatim on the screen. It’s almost a case of cut and paste.
    Bitmapped fonts can’t be altered by the program (at least, not very easily), so
    they can’t be resized. If you want a larger or smaller version of the same font,
    you’ll have to redraw the entire character set completely; it’s not a simple matter
    of readjusting the *point size*. Naturally, that creates some work for the programmer.
    Another drawback is that bitmapped fonts often appear choppy or jagged, as shown
    in Figure 7.2. Nevertheless, their simplicity lies in the fact that however the
    font’s characters appear in the file, that will be the way in which they’re displayed.


    The second variety of font is known as *scalable*. This is a more advanced way
    of storing a font’s information. Rather than having an exact picture of each character,
    the font’s “stylistic information” is stored in its data file. That information
    includes the angles of each character’s curves, and how they’re proportioned.
    If a bitmapped font can be compared to a bitmapped graphic, a scalable font can
    be compared to a vectorial graphic. (See Chapter 9 for an in-depth discussion
    on graphic file formats.) Because no actual picture exists, the rendering program
    must create each character, or *glyph*, on the fly. That creates some processing
    overhead, but the end result is well worth it. Scalable fonts can be enlarged
    or reduced without losing quality (hence the name), and they generally have smooth,
    *antialiased*


    # Render


    To prepare and display an image on the screen. Rendering is synonymous with rasterizing
    as well as drawing and painting. (Incidentally, the term *raster* refers to the
    horizontal lines on a monitor or a television, which explains how *rasterize*
    entered the computer lexicon. Because most images use more than one row of pixels,
    however, *bitmap* might be a better verb).


    # Point Size


    Font height is measured in *points*, a unit of measure equal to 1/72nd of an inch.
    Point size in bitmapped fonts can’t be adjusted as it can with scalable fonts.'
  merge: -1
  img_proc: true
- pgno: 148
  md: "# Antialiasing\n\nComputers are well known for their \"choppy,\" or jagged,\
    \ diagonal lines. This is one drawback of the bitmap-style screen matrix; vertical\
    \ and horizontal lines run evenly along the grid, but diagonal lines must be comprised\
    \ of several disjointed pixels, especially in low-resolution modes. Antialiasing\
    \ is the process of smoothing these lines, and it works by shading the outside\
    \ edges of a line with gray or colored pixels. This shading works to blend the\
    \ line with the background color, and reduces the \"jaggies,\" or undesirably\
    \ sharp edges are known.\n\n![](img/2e475714ef8969ed272622c46473d334_148_0.png)\n\
    \n**Figure 7.2**  \nBitmapmed fonts are choppy.\n\n![](img/2e475714ef8969ed272622c46473d334_148_1.png)\n\
    \n**Figure 7.3**  \nA bitmapped font and a scalable font.\n\nedges. Certainly,\
    \ scalable fonts are preferable. Compare the two fonts in Figure 7.3. Which do\
    \ you favor?\n\nTrueType fonts such as Arial and Helvetica (commonly found on\
    \ other operating systems and denoted by the .TTF extension) are scalable. Now,\
    \ unfortunately, I’ve got some bad news: SVGAlib’s internal font-rendering functions\
    \ are only capable of handling bitmapped fonts. However, you can get around this\
    \ by using yet another library, as you’ll see later in this chapter.\n\n# Coding\
    \ Fonts\n\nTo use SVGAlib fonts, we must return to our old friend vga1. The process\
    \ is really quite simple. First you prepare the font by loading it into memory,\
    \ and then you render it on the screen, much like you would with a standard shape\
    \ function. Listing 7.1 will get you started.\n\n+   Listing 7.1 Preparing a font\
    \ for use.\n\n```\n```c\n#define FONT_HEIGHT 8\n#define FONT_WIDTH 8\n#define\
    \ COLOR 15\n\nvoid *font = malloc(256 * FONT_WIDTH * FONT_HEIGHT * BYTESPERPIXEL);\n\
    \ngl_expandfont(FONT_WIDTH, FONT_HEIGHT, COLOR, gl_font8x8, font);\ngl_setfont(FONT_WIDTH,\
    \ FONT_HEIGHT, font);\n```\n```"
  merge: -1
  img_proc: true
- pgno: 149
  md: 'Note


    *Remember that `WIDTH` and `HEIGHT` are defined internally by `vga.gl`, meaning
    that you should use other constants (e.g., `FONT_WIDTH`) to define fonts in your
    code.*


    This little bit of code introduces three new vga.gl functions:


    +   - `gl_expandfont(int fw, int fh, int c, void *sfp, void *dfp)`

    +   - `gl_font8x8`

    +   - `gl_setfont(int fw, int fh, void *fp)`


    Starting from the inside, `gl_font8x8` is a packed-pixel bitmapped font that comes
    with vga.gl. It''s the only font included in the SVGAlib package; you''ll have
    to find others elsewhere or create your own. This font looks quite a bit like
    Courier, which you might be familiar with. The 8x8 refers to the fact that it''s
    8 pixels high by 8 pixels across. This is the standard size of SVGAlib fonts,
    and, because it''s a bitmapped font, you can''t change these dimensions. A little
    thought will reveal that a low-resolution screen mode (such as 320x200) will yield
    a large font, whereas a high-resolution mode will make bitmapped type appear much
    smaller. This is because the font is always 8 pixels by 8 pixels—such is life.
    You may be able to compensate for this by having textual screens (such as high
    score pages or instructions) display in low-res mode, while having the rest of
    the application in a higher resolution mode. To have a larger font while in screen
    mode 800x600, for example, you''ll need to switch to something larger, such as
    16x16. Don''t worry; there''ll be more on this later.


    First, use `gl_expandfont()` to uncompress the font data. With it, you''ll need
    to declare the dimensions of the font, the desired color, the location of the
    font file itself, and a pointer to a memory location to hold the resultant bitmaps.
    I''ve called the pointer `font`, but you can name it whatever you like.


    With that done, you''ll then need to call `gl_setfont()`, again stating the dimensions
    and the memory location (pointer). This lets SVGAlib know that you''ll be using
    the font you just expanded, much in the same way you might set a color with `vga_setcolor()`.
    Now you''re actually ready to render type on the screen. Listing 7.2 shows you
    how to do this.


    **Listing 7.2** *Aren''t you glad this doesn''t say “Hello World”?*


    ```

    ```

    char words[] = "SVGAlib is fun!";


    gl_write(100, 100, words);

    ```

    ```


    This plots your phrase/word/statement (or whatever) with point 100,100 as the
    upper left of the first character. The actual command is `gl_write(int x, int
    y, char *s)`. That''s all you have to do. Figure 7.4 shows a close-up of how this
    might look.


    Listing 7.3 has the entire code snippet. When you feel comfortable with that,
    you might experiment with `gl_written(int x, int y, int n, char *s)`, which only
    displays the first n characters of your string.'
  merge: -1
  img_proc: true
- pgno: 150
  md: '![](img/2e475714ef8969ed272622c46473d334_150_0.png)


    # Listing 7.3  The complete font code.


    ```

    #define FONT_HEIGHT   8

    #define FONT_WIDTH    8

    #define COLOR         15


    char words[] = "SVGAlb is fun!";

    void *font = malloc(256 * FONT_WIDTH * FONT_HEIGHT * BYTESPERPIXEL);


    gl_expandfont(FONT_WIDTH, FONT_HEIGHT, COLOR, gl_font8x8, font);

    gl_setfont(FONT_WIDTH, FONT_HEIGHT, font);

    gl_write(100, 100, words);

    ```


    Some caution must be exercised with `gl_write()` and `gl_writen()`, however, as
    the following construction will not work:


    ```

    gl_write(FONT_WIDTH, FONT_HEIGHT, "SVGAlb is fun!");

    ```


    The reason is that the above string literal needs to end with `"\0"`, the standard
    "null character" (ASCII code 0) that tails all char arrays. Without it, you won''t
    see anything on the screen. Let''s try it again, this time with the proper string
    termination:


    ```

    gl_write(FONT_WIDTH, FONT_HEIGHT, "SVGAlb is fun!\0");

    ```'
  merge: -1
  img_proc: true
- pgno: 151
  md: "# Different Fonts\n\nPresumably you'll want to use fonts other than gl\\_font8x8.\
    \ This, too, is easy to do once you understand the process. The font itself is\
    \ located in a rather cryptic-looking char declaration, such as the one shown\
    \ in Listing 7.4.\n\n# Listing 7.4 Sample font data.\n\n```\n```cpp\nunsigned\
    \ char bookfont[2048] =\n{\n    124,130,186,162,180,130,124,0,126,129,165,129,165,153,129,126,\n\
    \    124,129,165,129,153,165,129,126,108,246,246,254,124,56,16,0,\n    16,56,124,254,124,56,16,0,16,56,84,254,84,16,56,0,\n\
    \    56,124,254,254,108,16,56,0,16,24,20,20,48,112,96,0,\n    ...\n    136,34,136,34,136,34,136,34,85,170,85,170,85,170,85,170,\n\
    \    68,170,68,170,68,170,68,170,51,102,204,153,51,102,204,153,\n    204,102,51,153,204,102,51,153,199,143,31,62,124,248,241,227,\n\
    \    227,241,248,124,62,31,143,199,124,128,186,2,238,8,171,32\n};\n```\n```\n\n\
    The declaration consists of 2,048 numbers (with most of them omitted here for\
    \ brevity). These numbers range from 0 to 255. Now, let's go over what they mean.\
    \ Each character in an 8x8 font (which is standard for SVGAlib) is actually made\
    \ up of eight horizontal strips of eight pixels each. See Figure 7.5 for a graphical\
    \ representation of this.\n\nEach strip has some, all, or none of its pixels filled.\
    \ If you think about it, there are 256 possibilities (0 to 255). Every possible\
    \ combination of filled and unfilled pixels is covered. So, to draw a capital\
    \ S, you need these eight codes: 126, 128, 128, 124, 2, 2, 252, and 0. See Figure\
    \ 7.6 to see what you'd end up with.\n\nIf your font consisted of only the letter\
    \ S, your declaration would look like this:\n\n```\n```cpp\nunsigned char s-font[8]\
    \ =\n{\n    126, 128, 128, 124, 2, 2, 252, 0\n};\n```\n```\n\nIn reality, fonts\
    \ consist of 256 characters. Each character needs eight numbers (to represent\
    \ its eight strips), and 256x8 is 2,048. Therefore, each font declaration needs\
    \ 2,048 codes. You don't need to worry about all of them to begin with, however.\
    \ You can use zeros (0) for everything but the letters you're interested in.\n\
    \nThe capital alphabet begins with the 66th character (A), and continues to character\
    \ 91 (Z). The lowercase letters start with character 98 (a), and continue to 123\
    \ (z). If you just want capital letters — no symbols or lowercase letters — you\
    \ can have 520 zeros to represent"
