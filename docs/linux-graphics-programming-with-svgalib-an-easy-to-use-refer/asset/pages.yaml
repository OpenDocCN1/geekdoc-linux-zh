    I simply include all the source files at once, like this:


    ```

    gcc -03 -Wall -o myprogram main.c splotchy_circle.c -lvga

    ```


    This gives me the same end result as if I had compiled and linked the source files
    separately, like so:


    ```

    gcc -03 -Wall -c main.c


    gcc -03 -Wall -c splotchy_circle.c


    gcc -o myprogram main.o splotchy_circle.o -lvga

    ```


    # ## Option Two: External Static Libraries


    Now, despite the drawbacks, let’s say I wanted to compile splotchy_circle.c into
    its own shared library. I could group it together with other homebrewed functions
    in the library, or I could have it stand alone. Either way, here’s what I need
    to do:


    +   1. Compile the source files into an object file. Here’s an example:


    ```

    gcc -03 -Wall -c splotchy_circle.c

    ```


    +   2. Using the resultant file, splotchy_circle.o, I can now create my static
    library:


    ```

    ar -r libbook.a splotchy_circle.o

    ```


    +   3. I now create an index for this new library, so that *ld* can find the functions
    within it. This is accomplished by running **ranlib**:


    ```

    ranlib libbook.a

    ```


    +   4. Finally, I run **ldconfig**, which updates *ld*’s cache of libraries. This
    may not be necessary, but it’s better to be safe than sorry.


    When this is all said and done, I will most likely put my new library (libbook.a)
    into the /usr/lib directory, which is the standard repository for static libraries.
    Then, I can link to it with the *-lbook* command line flag, just like I link to
    SVGA lib with *-lvga*.


    # ## Option Three: Compilation In SVGA lib


    I don’t necessarily recommend this option; *you* have nothing to gain that can’t
    be achieved by the first two. Furthermore, you run the risk of building programs
    that only work on your machine. However, if you want to save yourself the trouble
    of having to add extra flags to the command line, you can compile your more useful
    functions directly into SVGA lib. All'
