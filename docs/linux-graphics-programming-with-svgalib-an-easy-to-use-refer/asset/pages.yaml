  md: '![](img/2e475714ef8969ed272622c46473d334_345_0.png)


    Figure 16.13


    A examples *ppmforge* clouds.


    # Conclusion


    Obviously, one chapter can''t begin to do justice to such an expansive field as
    landscape generation. Hopefully, though, you''ll be able to base some of your
    work on the code presented here.


    You can use artificial landscapes for many purposes. Many choose to utilize them
    in games that need unpredictable, yet realistic, terrain. Others, like myself,
    prefer to enjoy these pseudo-worlds as they are, for no other purpose than to
    marvel at their beauty and complexity.


    One excellent reference regarding artificial landscapes is Dr. F. Kenton Musgrave.
    Dr. Musgrave (or Ken for short) actually worked with Benoit Mandelbrot many years
    ago and now has his own company called *FractalWorlds.com* (I''ll let you figure
    out the Web address). His credits include some artificial moon shots from the
    movie *Apollo 13*, as well as the clouds that morph into the likeness of Mickey
    Mouse in a certain cruise line''s commercials. His book, *Texturing and Modeling*,
    contains a wealth of information, albeit a little on the academic side. In short,
    Ken is a really nice guy, and his work is a benefit to programmers everywhere.
    If you have a chance to talk with him, tell “Mo” I said hello.'
