  md: "# ## Timing\n\nOften overlooked, the concept of timing is vitally important\
    \ to any game. In addition to evaluating the movement of sprites and other elements\
    \ of the screen, your program will need to display the same number of frames per\
    \ second. Otherwise, game speed will be inconsistent on computers with different\
    \ processor speeds. One option is to utilize gettimeofday(), which generally provides\
    \ sub-second timing. Performance with this function varies across archi-\ntures,\
    \ but fortunately the i386 does exceedingly well.\n\nAnother option is to use\
    \ usleep(), which is accurate to the millisecond and is described in Chapter 6.\n\
    \nRussell Marks, author of zgv and zblast, also suggests using settimer() to set\
    \ a flag at a given interval. Listing 14.3 shows how this might be done.\n\n#\
    \ ### Listing 14.3 Using settimer().\n\n```\n```\nvolatile int timer_flag=0;\n\
    \nvoid sighandler(int foo)\n{\n    timer_flag=1;\n}\n\nvoid start_timer(void)\n\
    {\n    struct sigaction sa;\n    struct itimerval itv;\n    int tmp=1000000/20;\
    \      /* 20 ints/sec */\n\n    sigemptyset(&sa.sa_mask);\n    sa.sa_handler=sighandler;\n\
    \    sa.sa_flags=SA_RESTART;\n    sigaction(SIGALRM,&sa,NULL);\n\n    itv.it_value.tv_sec=itv.it_interval.tv_sec=tmp/1000000;\n\
    \    itv.it_value.tv_usec=itv.it_interval.tv_usec=tmp%1000000;\n    setitimer(ITIMER_REAL,&itv,NULL);\n\
    }\n\nvoid wait_for_timer(void)\n{\n    sigset_t mask,oldmask;\n\n    sigemptyset(&mask);\n\
    \    sigaddset(&mask,SIGALRM);\n```\n```"
