    # void keyboard_translatekeys(int mask)


    This function sets several flags that control how certain scancodes are mapped.
    At startup, a mask value of 0 is active. The argument **mask** must be logical
    or zero or more of the following “*predefined*” integers to turn the features
    listed on:


    +   - TRANSLATE_CURSORKEYS—Translate the scancodes of the `SCANCODE_CURSORBLOCK*`
    keys to those of the cursor keys on the number pad so that `keyboard_getstate()`
    and `keyboard_keypressed()` report a keypress of the corresponding number pad
    cursor key and not the one on the cursor block.


    +   - TRANSLATE_DIAGONAL—Translates the scancodes of diagonal cursor keys (keypad
    7, 9, 1, 3) to presses of two of the ordinary up, down, left, and right keys.
    For example, instead of reporting a press of `SCANCODE_CURSORUPRIGHT`, `keyboard_getstate()`
    and `keyboard_keypressed()` report a simultaneous press of `SCANCODE_CURSORUP`
    and `SCANCODE_CURSORRIGHT`.


    +   - TRANSLATE_KEYPADENTER—The scancode of the keypad Enter key is mapped to
    that of the ordinary Enter key so that `keyboard_getstate()` and `keyboard_keypressed()`
    report a press of `SCANCODE_ENTER` regardless of whether the keypad Enter or the
    ordinary Enter is pressed.


    +   - DONT_CATCH_CTRL_C—Pressing Ctrl+C does not raise a SIGINT. Contrary to the
    other flags, this also has effect when a user-defined keyboard event handler is
    used. SVGAlib will always process Alt+F1 to Alt+F10 and perform console switches
    accordingly.


    > Note: The TRANSLATE_ *options don’t really do simple scancode translations.
