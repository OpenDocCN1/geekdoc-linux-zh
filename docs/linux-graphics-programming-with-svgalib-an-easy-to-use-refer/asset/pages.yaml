  md: "Notice that I have the number of color bits set at 4, which is adequate for\
    \ 16 colors. If I were going to have 256 colors, I'd need to increase the bits\
    \ to 8.\n\nHere, then, is the complete `DumpImage()` function, as shown in Listing\
    \ 9.7. Note that I have the RGB values for 16 colors defined, matching what I\
    \ have defined in Listing 9.6.\n\n# Listing 9.7 `DumpImage()`. \n\n```\n```c\n\
    static void DumpImage(void)\n{\n    /* create and set up the GIF-file */\n   \
    \ GIF_Create(FILENAME, GIFWIDTH, GIFHEIGHT, NUMCOLORS, COLORRES);\n\n    /* define\
    \ a few colors matching the pixel values used */\n    GIF_SetColor(0, 0, 0, 0);\
    \      /* black, the background */\n    GIF_SetColor(1, 0, 0, 170);\n    GIF_SetColor(2,\
    \ 0, 170, 0);\n    GIF_SetColor(3, 0, 170, 170);\n    GIF_SetColor(4, 170, 0,\
    \ 0);\n    GIF_SetColor(5, 170, 0, 170);\n    GIF_SetColor(6, 170, 85, 0);\n \
    \   GIF_SetColor(7, 170, 170, 170);\n    GIF_SetColor(8, 85, 85, 170);\n    GIF_SetColor(9,\
    \ 85, 85, 255);\n    GIF_SetColor(10, 85, 255, 85);\n    GIF_SetColor(11, 85,\
    \ 255, 255);\n    GIF_SetColor(12, 255, 85, 85);\n    GIF_SetColor(13, 255, 85,\
    \ 255);\n    GIF_SetColor(14, 255, 255, 85);\n    GIF_SetColor(15, 255, 255, 255);\n\
    \n    /* store the image, using the GetPixel function to extract pixel values\
    \ */\n    GIF_CompressImage(0, 0, -1, -1, GetPixel);\n\n    /* finish it all and\
    \ close the file */\n    GIF_Close();\n}\n```\n```\n\nThe `GIF_Create()`, `GIF_SetColor()`,\
    \ `GIF_CompressImage`, and `GIF_Close()` functions are all contained in gifsave.c,\
    \ so you'll need to include this file along with `ScreenShot.c` in your compilation\
    \ command. Here's one way to compile:\n\n```\n```bash\ngcc -O3 -Wall -o ScreenShot\
    \ ScreenShot.c gifsave.c -lvglal -lvga\n```\n```"
