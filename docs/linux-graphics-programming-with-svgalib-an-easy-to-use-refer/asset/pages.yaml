- pgno: 331
  md: '# Spatial Subdivision


    Fortunately, you can extend the range of your mountain(s) into the third dimension,
    too. The process then becomes what''s known as *spatial subdivision*, an example
    of which is shown in Figures 16.6 through 16.9. For now, though, concentrate on
    Figure 16.5, which displays the entirety of one loop (*or iteration*). In the
    beginning (on the left) you can see a square extending off into the distance.
    The square is subdivided (in the middle) and then randomly perturbed so that the
    intersections of the lines are randomly raised or lowered (ending with the final
    image on the right).


    Again, just a few iterations of this process are all that''s needed to demonstrate
    the effect. By the final subdivision, shown in Figure 16.9, what you have does
    indeed appear to be a wire-frame model of a landscape. As you can see, the “mountainous”
    effect becomes more and more apparent with each cycle. It stands to reason that
    if the squares were colored in at some point, the effect might look fairly realistic.


    This is one way—albeit a crude way—to generate a landscape. If you further broke
    down the squares into triangles, you could even employ SVGAlib''s threeDKit (using
    gl_triangle()) to smoothly color your mountains, thereby eliminating any abrupt
    changes in hue.


    > > **Note**

    > > *This triangle shading process would be an application of the “filled polygon”
    technique discussed in Chapter 12.*


    ![](img/2e475714ef8969ed272622c46473d334_331_0.png)


    **Figure 16.5**

    Spatial subdivision.


    ![](img/2e475714ef8969ed272622c46473d334_331_1.png)


    **Figure 16.6**

    Recursive subdivision (2×2).'
