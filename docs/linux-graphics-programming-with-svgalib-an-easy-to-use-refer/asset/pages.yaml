    A sample wire frame model.\n\nresulting in a filled image. This looks much better\
    \ than the wire frame, and it's fast enough to allow rendering in real time.\n\
    \n# *Texture-Mapped Polygons*\n\nExpanding on the filled polygon concept, a *texture-mapped\
    \ polygon* is created by rotating and scaling a bitmap drawing (the texture),\
    \ which is then placed on a 3D polygonal image. This is the basis for most modern\
    \ 3D games.\n\n# *Raytracing*\n\nIn this technique, simulated beams of light are\
    \ radiated from an illumination source outside the screen, from which point they\
    \ sail forth to penetrate any objects in their path. As the rays bounce, shades\
    \ of color are created. Special attention is given to the material of the objects\
    \ being struck, taking into account any transparency or translucency. This is\
    \ the most realistic of the four techniques, as shadows and shading are made possible.\
    \ Unfortunately, it's also rather time consuming, and thus too processor-intensive\
    \ to be used in real time applications. See Figure 12.2 for an example.\n\n![](img/2e475714ef8969ed272622c46473d334_262_1.png)\n\
    \n**Figure 12.2**  \nA raytraced image.\n\n# *Vertex*\n\nA point in a polygon\
    \ that comprises the intersection of two or more lines. Vertices also appear in\
    \ angles, polyhedrons, and graphs."
