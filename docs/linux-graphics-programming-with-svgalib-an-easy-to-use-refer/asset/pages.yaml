    \ As processors continue to improve, your code will almost assuredly become obsolete.\
    \ Doing it that way would be shooting yourself in the foot. Instead, it's time\
    \ to delve into the black art of subsecond delays.\n\n# Subsecond Delays\n\nActually,\
    \ it’s not that big of a deal. I prefer to use usleep(unsigned long usec), which\
    \ lets me pause in microsecond intervals (millionths of a second), but there’s\
    \ also nanosleep(const struct timespec *req, struct timespec *rem), which allows\
    \ pauses in the billionths of a second. The point I wanted to make previously\
    \ was merely that you shouldn’t rely on empty loops for delays.\n\nUSleep() is\
    \ defined in <unistd.h>, whereas nanosleep() is in <time.h>. You might prefer\
    \ to investigate nanosleep(), because according to the man page, it “has the advantage\
    \ of not affecting any signals, it is standardized by POSIX, it provides higher\
    \ timing resolution, and it allows [you] to continue a sleep that has been interrupted\
    \ by a signal more easily.” Well said. As for me, I prefer the simplicity of usleep().\n\
