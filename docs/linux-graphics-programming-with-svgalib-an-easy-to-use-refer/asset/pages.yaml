  md: 'be fairly straightforward. According to the p2c man page, the following variants
    are supported: HP Pascal, Turbo/UCSD Pascal, DEC VAX Pascal, Oregon Software Pascal/2,
    Macintosh Programmer''s Workshop Pascal, Sun/Berkeley Pascal, and Modula-2.


    # Includes


    Many of the header files used by a DOS C program will no longer be applicable
    in Linux. Universal headers such as `<stdio.h>` and `<stdlib.h>` can be kept,
    but you''ll need to get rid of `<conio.h>`, `<graphics.h>`, and `<dos.h>`. Then,
    insert `<vga.h>` and `<vga1.h>` (if needed).


    Note also that you may need to add vga_setmode(), because the old Borland initgraph()
    was equivalent to both vga_init() and vga_setmode().


    # Conclusion


    Sometimes it''s nice to be able to take a break from programming and explore what
    others have accomplished. Perhaps you have a favorite application that you''d
    like to see on Linux? Regardless, there are times when you''re not going to want
    to code something from scratch. In any event, the resources listed in this chapter
    should help you find the applications you need.'
