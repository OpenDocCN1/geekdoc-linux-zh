- pgno: 86
  md: "# Chapter 4\nComplex Shapes, Formulas, And Functions\n\n+   * *Key Topics:*\n\
    +   \t* Using math to create shapes\n+   \t* Developing efficient shape functions\n\
    +   \t* Augmenting vgaI\n\nIn Chapter 3, I demonstrated the most commonly employed\
    \ “out-of-the-box” SVGAIIb functions for generating shapes. Although convenient,\
    \ these functions have a tendency to be rather limited in their scope. This is\
    \ readily apparent if you want anything drawn other than lines, boxes, and circles.\
    \ In fact, these basic functions could be more accurately described as being “in\
    \ the box.” Generic and simple, they’re the graphics equivalent of fast food.\
    \ They’re fine for messing around with, but you wouldn’t want to take them home\
    \ to meet Mom and Dad.\n\nTo augment the basic flavors of SVGAIIb, I suggested\
    \ “kit-bashing” to create some of your own functions. (*Kit-bashing* is a hobbyist’s\
    \ term that refers to the practice of taking pieces from various model kits to\
    \ create something new.) This term could also be applied to *book_background*(),\
    \ the simplistic “function of functions” I created as an example to color the\
    \ background. Functions such as these work, but they’re slow and a bit clunky.\
    \ Furthermore, they can’t do anything that a bunch of *vga_drawline*() or *gl_fillbox*()\
    \ statements couldn’t accomplish on their own. What would you do, for example,\
    \ if you wanted to draw a partial circle (i.e., an arc)?\n\nSome people have created\
    \ their own libraries to supplement SVGAIIb, and we’ll look into those later on.\
    \ For now, though, I want you to be able to create your *own* functions. Learning\
    \ to do so will be a great exercise, and even better, it’s not that hard."
  merge: -1
  img_proc: true
- pgno: 87
  md: "# ## Curves\n\nThe most obvious deficiency in SVGAlib's shape-drawing functions\
    \ is the curve, or arc. That's not to say that SVGAlib is incapable of drawing\
    \ a rounded object—of course it can. However, you won't find anything beyond gl_circle()\
    \ in the base package. To compensate for this absence, you just need to do some\
    \ math (uh, oh!).\n\n> > **Note**\n> >\n> > I have to admit that I'm not a mathematician.\
    \ Although all the examples in this chapter work, they may not be the most brilliant\
    \ lines of code ever written. I hope you'll be able to forgive any inadequacies\
    \ in my formulas—I've done the best I could. Perhaps those of you who are math\
    \ wizards can contribute some knock-your-socks-off code to the SVGAlib Web site\
    \ so that we may all learn from your expertise. Now, on with the show.\n\nLet's\
    \ start out by creating a function to draw a circle. After all, a circle is nothing\
    \ more than connected arcs or one large arc, right? This code will be different\
    \ from that found in gl_circle() so that those of you who are also mathematically\
    \ disadvantaged can see multiple ways to accomplish the same thing. I've named\
    \ this new function book_circle(), and Listing 4.1 contains the code. If this\
    \ program looks familiar, it may be because I took the liberty of lifting most\
    \ of it from GNU's libplot, from the plottul package. Actually, it wasn't a total\
    \ theft; I've simplified it some for the book. Note that you'll need to include\
    \ the `<math.h>` header file in your program; otherwise, you won't be able to\
    \ compile. (Some people also find it necessary to link to the math library with\
    \ the -lm flag, too.)\n\n**Listing 4.1** Code for book_circle().\n\n```\n```c\n\
    void book_circle(int xc, int yc, int radius)\n{\n    double theta,\n         \
    \  costheta,\n           sintheta;\n\n    int degrees;\n\n    for (degrees = 0;\
    \ degrees < 360; degrees++)\n    {\n        /* Define PI as 3.14, if your compiler\
    \ doesn't accept\n           the following line. */\n        theta = (PI / 180)\
    \ * degrees;\n        costheta = cos(theta);\n        sintheta = sin(theta);\n\
    \n        vga_drawpixel(xc + radius * costheta,\n                      yc + radius\
    \ * sintheta);\n    }\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 88
  md: "![](img/2e475714ef8969ed272622c46473d334_88_0.png)\n\nElements of `book_circle(0)`.\n\
    \nAs you can see, the function takes three arguments: the x and y coordinates\
    \ of the center of the planned circle and the radius. Figure 4.1 shows this in\
    \ a little more detail, which you may find helpful.\n\nYou would incorporate `book_circle()`\
    \ into your main program much in the same way that I've done it in Listing 4.2.\
    \ This corresponds with the `book_background()` examples in Chapter 3, as well.\
    \ Hopefully, including your own functions should be a more comfortable process\
    \ for you now.\n\nUnfortunately, a flaw does exists within `book_circle()`. Due\
    \ to the inherent rounding in the algorithm, some values of radius may leave you\
    \ with gaps in the circle's perimeter. Ignore that for now; I've included a fix\
    \ in Listing 4.4.\n\n# Listing 4.2 Improved book_circle() within the context of\
    \ a program.\n\n```\n```c\n#include <math.h>\n#include <stdlib.h>\n\n#include\
    \ <vga.h>\nvoid book_circle(int xc, int yc, int radius); \n\nint main(void)\n\
    {\n  vga_init();\n  vga_setmode(6640x480x256);\n  vga_setegacolor(3);\n```\n```"
  merge: -1
  img_proc: true
