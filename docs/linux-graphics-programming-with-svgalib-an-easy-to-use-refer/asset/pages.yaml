- pgno: 116
  md: "# ## Color Consistency Across Platforms\n\nIf you need to design applications\
    \ for multiple platforms, you might consider using special color values to achieve\
    \ consistency. At the beginning of this chapter, I explained why SVGAlib's colors\
    \ don't always match those in other operating systems. It's not a defect of SVGAlib,\
    \ nor is it a problem with the other OS. The problem is simply that *256*-color\
    \ palettes vary across platforms.\n\nThe solution might be to use a specific set\
    \ of *216* colors (it's *216*, not *256*—Windows and Macintosh both reserve *40*\
    \ colors for their own use). These *216* colors are composed using a combination\
    \ of six values: *0, 51, 102, 153, 204*, and *255*. By sticking with these numbers\
    \ when you declare your RGB values, you should have something that will match\
    \ a similar application on another OS.\n\nFor example, `gl_rgbcolor(102, 153,\
    \ 51)` should create the same color as the equivalent command in a Windows-based\
    \ application. Conversely, `gl_rgbcolor(116, 218, 244)` most likely would not.\n\
    \nJust for fun, Listing 5.6 and Figure 5.3 show what these colors are going to\
    \ look like.\n\n+   **Listing 5.6** The code to display the *216* platform-independent\
    \ colors.\n\n```\n```\n#include <stdlib.h>\n#include <vga.h>\n#include <vgagl.h>\n\
    \nint main(void)\n{\n    int x,\n        y,\n        r,\n        g,\n        b,\n\
    \        c[216],\n        i = 0;\n\n    vga_init();\n    vga_setmode(G320x200x256);\n\
    \    gl_setcontextvga(G320x200x256);\n\n    gl_setrgbpalette();\n\n    for (r\
    \ = 0; r < 256; r+= 51)\n    {\n        for (g = 0; g < 256; g += 51)\n      \
    \  {\n            for (b = 0; b < 256; b += 51)\n            {\n```\n```"
