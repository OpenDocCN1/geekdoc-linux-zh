  md: "# Bitmap File Header\n\nThe **BITMAPFILEHEADER** data structure contains information\
    \ about the type, size, and layout of a *device-independent bitmap* (DIB) file:\n\
    \n```\n```c\ntypedef struct tagBITMAPFILEHEADER {\n    WORD    bfType;\n    DWORD\
    \   bfSize;\n    WORD    bfReserved1;\n    WORD    bfReserved2;\n    DWORD   bfOffBits;\n\
    } BITMAPFILEHEADER;\n```\n```\n\nThe **BITMAPFILEHEADER** data structure contains\
    \ the fields shown in Table 9.1.\n\nA **BITMAPINFO** data structure immediately\
    \ follows the **BITMAPFILEHEADER** structure in the DIB file.\n\n# Bitmap Info\n\
    \nThe **BITMAPINFO** structure fully defines the dimensions and color information\
    \ for a Windows 3.0 device-independent bitmap:\n\n```\n```c\ntypedef struct tagBITMAPINFO\
    \ {\n    BITMAPINFOHEADER    bmiHeader;\n    RGBQUAD             bmiColors[];\n\
    } BITMAPINFO;\n```\n```\n\n> **Note**\n> *3.0 refers to the bitmap format, and\
    \ not to a particular version of Windows.*\n\nThe **BITMAPINFO** structure contains\
    \ the fields shown in Table 9.2.\n\nA Windows 3.0 device-independent bitmap consists\
    \ of two distinct parts: a **BITMAPINFO** data structure that describes the dimensions\
