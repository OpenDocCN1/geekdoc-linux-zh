    # # Libvgagl Functions


    The material contained within this appendix was taken in large part from the man
    pages edited by Dr. Michael Weller (eowmob@exp-math.uni-essen.de). Unfortunately,
    the exact source of the original documentation has been lost with the passage
    of time. It''s likely that at least some credit is due to Harm Haneмааyer, whose
