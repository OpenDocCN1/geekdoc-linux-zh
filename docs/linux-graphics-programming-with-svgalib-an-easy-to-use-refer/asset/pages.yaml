- pgno: 62
  md: '# VESA BIOS


    A BIOS chip on a VGA display adapter that conforms to the VESA BIOS Extension
    standard.


    Table 2.5 **VESA standards for Super VGA adapters.**

    | Mode Number (In Hex) | Resolution | Colors | Video Memory Used |

    | :--- | :--- | :--- | :--- |

    | 101 | 640x480 | 256 | 300K |

    | 110 | 640x480 | 32K | 600K |

    | 111 | 640x480 | 64K | 600K |

    | 112 | 640x480 | 16M | 900K |

    | 103 | 800x600 | 256 | 469K |

    | 113 | 800x600 | 32K | 938K |

    | 114 | 800x600 | 64K | 938K |

    | 115 | 800x600 | 16M | 1,406K |

    | 105 | 1,024x768 | 256 | 768K |

    | 116 | 1,024x768 | 32K | 1,536K |

    | 117 | 1,024x768 | 64K | 1,536K |

    | 118 | 1,024x768 | 16M | 2,304K |

    | 107 | 1,280x1,024 | 256 | 1,280K |

    | 119 | 1,280x1,024 | 32K | 2,560K |

    | 11A | 1,280x1,024 | 64K | 2,560K |

    | 11B | 1,280x1,024 | 16M | 3,840K |


    known to work on Banshee, TNT, Matrox, Neomagic, i740, and a few other cards.
    Check the Web site if you''re in doubt.


    In case you''re interested, Table 2.5 shows the current VESA standards for SVGA
    cards. When programming for SVGAelib, though, you''ll still need to use one of
    the 50 modes outlined in Table 2.4; these VESA modes are provided for reference
    only.


    # Conclusion


    We''ve just covered a number of concepts that should help you understand what''s
    going on in the upcoming chapters. We''ve looked at hardware (video cards and
    monitors), screen modes and resolutions, color, video memory, and compilation.
    I also touched on VESA and how it affects SVGAlib. Although this may not have
    been the most exciting installment in this tutorial—at least, I hope not—surely
    you''ll agree that having this information is beneficial.


    What''s more, if you encounter a hardware concept later in the book that seems
    sketchy, you can always refer back to this chapter for guidance. Chances are,
    you''ll find it here.


    Now, on to the fun stuff.'
