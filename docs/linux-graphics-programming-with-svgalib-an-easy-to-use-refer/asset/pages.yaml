    to be offline now and thus unavailable for questioning.


    Consequently, some of the newer SVGAlib man pages and HOWTOs were written by Matan
    Ziv-Av (matan@svgalib.org) and his contemporaries. In the event that credit has
    been wrongly applied, it''s requested that notification be emailed to jlink@svgalib.org.


    # ## Functions Defined In Vgagl.h


    The libvgagl functions shown in this appendix are defined in vgagl.h. This header
    file can generally be found in the /usr/include or /usr/local/include directories.
    Additionally, the independent threeDKit functions require separate header files
    (for example, triangle.h), which are kept in SVGAlib''s threeDKit source subdirectory.


    # ## Context Management


    The following functions pertain to context management.'
  merge: -1
