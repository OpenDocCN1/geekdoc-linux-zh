    Some common polygons.


    likely to be a polygon. Take a look at Figure 11.1 for some common polygons. Note
    that a circle is not a polygon because it isn’t comprised of straight lines.


    Of course, the simplest polygon is the triangle. Is it any wonder, then, that
    the threeDKit uses several triangle routines? Keep this in mind; it’ll be important
    later.


    Any good graphics book will tell you that there are three types of polygons. Not
    wanting to be left out, I’ve included them here for you as well. The three types
    are convex, nonconvex, and complex. See Figure 11.2 for examples.


    # Code


    Obviously, the purpose of a polygon routine is to create the outline of a specific
    polygon and then, generally, to fill in it. Some planning may be required; you’ll
    need to decide whether your polygon can overlap other polygons and, perhaps, whether
    it can be overlapped itself. This is an important consideration because diagonal
    lines aren’t clean (that is, smooth) like their horizontal and vertical counterparts;
    therefore, two or more polygons may vie for the same pixels. But, let’s not worry
    about that just yet.


    My first two examples will trace the outside edges of a convex polygon. To keep
    things simple, the polygon in both examples will be a triangle. Listing 11.1 is
    a standalone program


    ![](img/2e475714ef8969ed272622c46473d334_247_1.png)


    Convex, nonconvex, and complex polygons.'
