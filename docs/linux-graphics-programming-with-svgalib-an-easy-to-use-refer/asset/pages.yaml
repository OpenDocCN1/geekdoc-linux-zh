    \ y + 8, x + 9, y + 8);\n  vga_drawline(x, y + 9, x + 9, y + 9);\n}\n```\n```\n\
    \nUsing the method in Listing 10.2, you could very easily render a shape moving\
    \ across the screen. My example can be found in Listing 10.3, sans the book_example()\
