  md: "# A Note from Russel Marks\n\nThe advantage of not calling **do_a_frame()**\
    \ directly from **signal handler()** is twofold—there’s very little you can do\
    \ safely in a signal handler, and the “polling” approach means you degrade gracefully\
    \ on machines too slow to handle the game (that is, the game runs slow rather\
    \ than completely screwing up). Also, a polling model is less of a hassle than\
    \ dealing with interrupts. One final thing: you *could* explicitly stop the timer,\
    \ but because it’s only setting a flag there’s usually no need, you can just leave\
    \ it running.\n\n```\n```c\n            case -1:\n                if (tvp \\u2014\
    \ 0)\n                    return (-1);\n                if (errno == EINTR)\n\
    \                    goto again;\n\n                stop(\"select failed, help\"\
    );\n                /* NOTREACHED */\n\n            case 0: /* timed out */\n\
    \                tvp->tv_sec = 0;\n                tvp->tv_usec = 0;\n       \
    \         return (0);\n            }\n            if (tvp) {\n               \
    \ /* since there is input, we may not have timed out */\n                (void)\
    \ gettimeofday(&endtv, NULL);\n                TV_SUB(&endtv, &starttv);\n   \
    \             TV_SUB(tvp, &endtv); /* adjust *tvp by elapsed time */\n       \
    \     }\n\n            return (1);\n        }\n\n/*\n * 'tsleep' for the current\
    \ turn time (using select).\n * Eat any input that might be available.\n */\n\
    void tsleep()\n{\n    struct timeval tv;\n    char c;\n\n    tv.tv_sec = 0;\n\
