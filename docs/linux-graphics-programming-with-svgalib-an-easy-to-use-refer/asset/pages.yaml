- pgno: 299
  md: '# Sprite


    An independent graphical object. A sprite is generally a character image, but
    it can be any other moving portion of the screen. Sprites can move without affecting
    other parts of the screen and are routinely used in games.


    This works identically to gl\_putbox(), except it only copies the foreground colors.
    The background (color 0) is left untouched.


    You can draw your sprites on a color 0 background, perhaps on a vgaI virtual screen,
    and then use another palette color besides 0 for black. So long as you never use
    the background color on the screen (using your other black instead), gl\_putboxmask()
    will make your sprite transfers fast and efficient. Figure 14.1 shows one such
    sprite in action.


    # Scrolling


    There are umpteen thousand tutorials involving scrolling—every book on computer
    graphics seems to have one—and most seem to involve assembly language. The one
    you’ll see here uses vgaI exclusively, and it’s the easiest (conceptually) that
    you’ll ever encounter.


    # What Is Scrolling?


    Scrolling is simply when the background slides left or right, up or down to allow
    you to explore “worlds” that are larger than one screen. As your “character” moves,
    the background will scroll along, keeping you in the middle of the screen. This
    technique is employed in almost every Nintendo game—think of Super Mario Bros.
    or any other game viewed from the side.


    There are basically two ways to scroll. The first method involves keeping the
    entire playing area in a frame buffer and sliding that back and forth as needed.
    The second involves calculating the new screen areas as they’re needed, but that’s
    a little slower. There’s always a trade-off between memory consumption and speed.
    I’m going to show you the fast, memory-hungry method using vgaI’s internal frame
    buffer.


    ![](img/2e475714ef8969ed272622c46473d334_299_0.png)


    Figure 14.1

    Sprite in action.'
