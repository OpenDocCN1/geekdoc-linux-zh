  md: '![](img/2e475714ef8969ed272622c46473d334_310_0.png)


    Figure 15.1


    Different mouse connectors.


    If you’re confused by the terms *bus mouse* and PS/2, have no fear. They simply
    refer to the different connectors that mice sometimes use. Refer to Figure 15.1
    for a reference.


    The bus mouse is a now-obsolete connector that was briefly in vogue in the 1980s.
    Although it resembles the PS/2 plug, the pin layout is different. If you have
    something other than a serial mouse, chances are good that it’s a PS/2.


    # Next, The mouse_accel “Defines”


    The next group of definitions you’ll encounter in lvbga.config occur in the `mouse_accel`
    section. Not all mice are affected by these definitions in the same manner, so
    I’d suggest leaving this section alone for the time being. If you encounter problems
    with a precompiled program as you progress, this is the place to do your tweaking.
    Chances are, though, you’ll have to use some good of’ trial and error to find
    the right values.


    Case in point: I recently bought a new mouse, and it was *much* too fast. However,
    I was able to get the speed to a more manageable level by changing `mouse_accel_mult`
    from 60 to 20 and lowering `mouse_accel_offset` from 30 to 10. (Your mileage may
    vary.)


    # Using /dev/mouse


    As you may know, the files in the `/dev` directory refer to your computer’s hardware.
    For instance, `/dev/hda` refers to an IDE hard drive—specifically, the primary
    master (the C: drive in DOS/Windows)—and `/dev/ttyS0` refers to your first serial
    port (COM1 in DOS/Windows).


    > **Note**

    > Yes, *standard* Linux *tty* devices range from 0 to 3, whereas DOS COM ports
    range from 1 to 4. Same ports, different scales. How’s that for confusing?'
  merge: -1
  img_proc: true
- pgno: 311
  md: 'Generally, `/dev/mouse` is a symbolic link to your actual input device for
    the mouse. For example, my mouse uses `/dev/ttyS0`, so my `/dev/mouse` file points
    there. It''s important to have this link because SVGAlib programs often assume
    a `/dev/mouse` file is present.


    Such linking can be a point of contention, however, because some “gurus” are strongly
    against the use of symbolic links for devices. Therefore, your Linux distribution
    may not have provided you with a `/dev/mouse`. To rectify this, use the following
    simple command:


    ```

    `ln -s /dev/ttyS1 /dev/mouse`

    ```


    For example, if your mouse is on `/dev/ttyS1`, you would type this:


    ```

    `ln -s /dev/ttyS1 /dev/mouse`

    ```


    If you happen to be one of the people who are dead set against `/dev/mouse`, your
    other option is to uncomment the following line in libvga.config:


    ```

    `# mdev /dev/ttyS0 # mouse is at /dev/ttyS0`

    ```


    If you choose to go this route, make sure you’ve altered the preceding line to
    reflect your actual serial port. However, I suggest not using this option—you
    may still find yourself faced with precompiled applications containing `/dev/mouse`
    hard-coded inside.


    > **Note**

    > *Old time Linux users may know that cua and ttyS are synonymous. However, the
    cua device is being phased out, and its use is now discouraged.*


    # # Mouse Initialization


    Coding for the mouse is surprisingly simple. In fact, you may find it similar
    to raw keyboard mode. You merely have to initialize the mouse and then wait for
    events, such as movement and/or button clicks. When finished, you simply “close”
    the mouse. Note that you’ll need to include the vgamouse.h header file for your
    code, but you won’t need any additional command-line flags for compilation (such
    as `-lvga` ).


    There are two methods for initializing the mouse: the one-step easy method and
    the longer manual method. This being SVGAlib, it’s recommended that you use the
    easy method. (Don’t you love it?) Calling `vga_setmouseupport(int stat)` before
    you set the screen mode will prepare the mouse in one fell swoop. Simply pass
    an argument of 1 to enable the mouse or 0 (the default) to disable it. Once the
    mouse is enabled, you’ll be ready to scan for events.


    On the other hand, the manual method is demonstrated in Listing 15.1. To use this
    method, you’ll need the following four commands:


    +   - `mouse_init(char *dev, int type, int samplerate);`

    +   - `mouse_setrange(int x1, int x2);`'
