    # # A Brief Look At Porting


    Perhaps you have a favorite application that you''d like to see on Linux? You
    might be the one to make it happen. If you have the source, then your work is
    cut out for you.


    Of course, SVGAlib programs are generally written in C/C++, and oftentimes DOS
    code is, too. If your original program was compiled with Borland C (a popular
    package) or even Fastgraph (for DOS or Windows), you can consult Table 17.4 for
    a list of common graphic functions and their equivalents in SVGAlib and vga1.


    # ## Porting From Pascal


    If your program was instead written in Pascal—and many have been—don''t despair.
    Many Linux distributions come with a neat little program called p2c. Simply put,
    p2c translates most reasonable Pascal programs into C, at which point your conversion
    to SVGAlib should


