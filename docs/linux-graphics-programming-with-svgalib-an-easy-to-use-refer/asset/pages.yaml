    \ started here to produce some fantastic effects with your own code. That's assuming\
    \ you haven't gone into seizures from the flickering screen fades. Meanwhile,\
    \ I'll concentrate on sticking to single topics in the next chapters.\n\n# Summary\
    \ Of Functions Introduced In This Chapter\n\nHere's a summary of the functions\
    \ covered in this chapter:\n\n+   * void gl_clearscreen(int c)\n+   * void gl_getpalettecolor(int\
    \ c, int *r, int g, int b)\n+   * void gl_setpalettecolor(int c, int *r, int *g,\
    \ int *b)"
