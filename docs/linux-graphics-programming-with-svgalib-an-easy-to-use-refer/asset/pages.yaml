    # ## What Is A Polygon?


    Although the pixel is generally regarded as the basic building block for all graphics
    screens, there''s another measure by which an image can be constructed: the polygon.
    If the pixel can be compared to an atom, then the polygon is a molecule—a combination
    of pixels that works in unison to fill a section of the screen. The polygon can
    be likened to a large pixel—by joining polygons, a more complete image is formed.


    This chapter will review the semantics of polygons in an effort to prepare you
    for the work ahead. The polygon is a fundamental element of three-dimensional
    drawing, and as such, it must be thoroughly understood. I''ll start with some
    fairly involved, do-it-yourself code, and from there I''ll progress into some
    of the prefab functions that come with SVGAlib''s threeDKit. As is often the case,
    the homebrewed code should be beneficial as a tutorial, but the standard functions
    are much easier to use.


    First, let''s define clearly what a *polygon* is. From the name, one can infer
    that it means multiple (*poly*) + angles (*gon*). More simply, my dictionary defines
    a polygon as being a closed-plane figure bounded by straight lines. This means
    that a polygon is a closed-container, two-dimensional shape that''s comprised
    of multiple straight lines touching at their tips (or vertices). Therefore, one
    can infer that a square is a polygon, along with hexagons and octagons. In fact,
    being the smart person that you are, you can probably deduce that any shape ending
    with the “-gon” suffix is'
