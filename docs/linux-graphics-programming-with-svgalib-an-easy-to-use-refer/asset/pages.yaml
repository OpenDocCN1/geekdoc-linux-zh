  md: '```

    int vga_drawscanline(int line, unsigned char *color)

    ```


    This draws a horizontal line spanning the entire screen using “y” coordinate line.
    The colors drawn are taken from color[0] to color[length -1]. The color is a simpler
    front end to vga_drawcasgment().


    ```

    int vga_getpixel(int x, int y)

    ```


    Reads a pixel’s value from the screen. This function is very inefficient, so you
    should consider either using direct screen access or using vga_getcassegment()
    to handle more than one pixel.


    ```

    int vga_getcassegment(unsigned char *colors, int x, int y, int length)

    ```


    The direct opposite of vga_drawcassegment(). The line of length pixels starting
    at (x, y) is not drawn; instead, the color values are taken from the screen and
    copied into color[0]..color[length -1]. The SVGAIB version was introduced in version
    1.2.10. In high/true color modes, the length must be given in bytes, not pixels.


    ```

    void vga_waitretrace(void)

    ```


    Waits for vertical retrace, which is when the video beam goes dark and returns
    from the bottom line to the top line. This can be used to synchronize animation
    with monitor refresh. However, because Linux is a multiplexer OS, some time may
    elapse before the function returns. Also, not all cards support this function
    in every mode.


    # Basic (Nonraw) Keyboard I/O


    These functions deal with basic keyboard I/O:


    ```

    int vga_getch(void)

    ```


    Waits for a keypress just like getch() would. For a nonblocking check for a keypress,
    use vga_getkey(). Alternatively, if you want to wait for several events to occur
    at once, use vga_waitevent().


    ```

    int vga_getkey(void)

    ```


    Reads a character from the keyboard without waiting. Returns 0 if no key has been
    pressed, and returns the key’s ASCII value otherwise. This function must not be
    used in raw keyboard mode. In this situation, use keyboard_getstate() or keyboard_keypressed()
    instead.


    ```

    vga_waitevent(int which,fd_set *input,fd_set *output,fd_set *except, struct timeval
    *timeout)

    ```


    This is the only SVGAIB function that allows you to wait for keyboard and mouse
    events. It’s based on the select() library function, so for a deeper understanding
    of vga_waitevent(), have a look at select() as well.'
