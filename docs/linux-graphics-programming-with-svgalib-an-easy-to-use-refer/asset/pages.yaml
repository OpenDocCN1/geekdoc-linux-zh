    # ## Raw Keyboard Handling


    The functions in this section cover raw keyboard handling:


    > **Note**

    > These functions must include `<vgakeyboard.h>`.


    ```

    int keyboard_init(void);

    ```


    See keyboard_init_return_fd().


    ```

    int keyboard_init_return_fd(void)

    ```


    These routines initialize the keyboard to raw mode. No ASCII codes are produced;
    instead, SVGAlib keeps track of every single keypress or depress. The return_fd
    version returns the file descriptor of the console device to allow you to do further
    tricks. The other version just returns 0 if successful. Note that both return
    -1 on error. keyboard_close() returns to normal operation. When in raw keyboard
    mode, you can no longer use vga_getch() or vga_getkey(). Instead, you must use
    keyboard_getstate() or keyboard_key_pressed().


    Depending on the setting of keyboard_translaketkeys(), even in raw mode, a Ctrl+C
    will cause a SIGINT. In any case, SVGAlib will check for Alt+F1 to Alt+F10 and
    perform console switches accordingly.


    ```

    void keyboard_close(void)

    ```


    This routine returns the keyboard to normal operation from raw mode. If you’ve
    used one of the keyboard_init_\*() routines, you should call this prior to leaving
    your SVGAlib application.'
