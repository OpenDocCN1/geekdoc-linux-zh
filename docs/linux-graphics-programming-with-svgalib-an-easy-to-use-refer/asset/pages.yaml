- pgno: 233
  md: '# What Is Computer Animation?


    Similar to animated cartooning, computer animation is the art of fooling the eye
    into believing that fluid movement is taking place. Whereas real-world movement
    is continuous and smooth (analog), computers can only display still images (digital).
    Therefore, the secret of animation is to display a steady stream of still images.
    By this method, one can create the illusion of conjoined motion. In this respect,
    computer animation is similar to a cinematic presentation.


    Despite the obvious parallels with conventional media, however, computer animation
    still requires a certain amount of effort to achieve realism. Although advanced
    techniques do exist, most arcade-style animation is awkward and choppy. As a result,
    moving images often appear to flicker as they cross the screen. It’s best to avoid
    this if you can, so I’ll include some tips along the way to help you.


    # Animation Standards


    You may know that cartoons are based on the "frames per second" standard. Animation
    in the cinema generally uses 24 frames per second, and, accordingly, this means
    that for every second that passes, you''ll view 24 images in rapid succession.
    These images are still (i.e., motionless) and are very similar to one another.
    Only by viewing them quickly and in sequence does one get the illusion of motion.


    Computer animation doesn''t have a standard such as 24 frames per second. Matters
    are further complicated by the fact that different processors run at different
    speeds. Animation that appears normal and lifelike on a 486 will be much too fast
    on the latest Pentium and far too slow on a 386. Therefore, programmers must take
    this and many other factors into account when designing games and business applications
    that require animated graphical output.


    One way to take the “pulse” of an individual computer is to measure its video
    refresh rate. Considering that most screens refresh at around 70Hz, relatively
    smooth animation can be achieved by drawing “between cycles.” In other words,
    for optimal performance, you''ll want to draw immediately after one refresh, as
    the video beam is returning to the top of the screen. This can be achieved with
    `vga_waitrefresh(void)`. However, there''s one possible snafu. Because Linux is
    generally used as a server OS, there may be more going on than just your SVGAlib
    program. For example, your processor may be handling mail delivery, serving Web
    pages, and even compiling other programs while your app is running. Therefore,
    your drawing may be delayed some (even as little as a fraction of a second), possibly
    negating the positive effect of `vga_waitrefresh()`. However, don''t lose hope;
    if you can draw at least one “frame” for every two refresh cycles, you should
    still be okay. See `/etc/vga/libvga.config` for more on refresh rates. (Alternatively,
    you can consult Chapter 2.)'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# # Getting Started


    The standard method for animating a computer image is as follows:


    +   1. Draw the initial image.

    +   2. Erase the image by restoring the background color(s).

    +   3. Redraw the image in its new location.


    Generally, the new location is only slightly removed from the old location. If
    you “jump” too far in one step, your motion will appear jerky and unrealistic.
    Figures 10.1, 10.2, and 10.3 illustrate how an image is moved according to this
    formula.


    Now, there are several methods you can use to “erase” and “redraw” your image.
    You could always use the exact same procedure you used to draw the initial image,
    only using the color


    ![](img/2e475714ef8969ed272622c46473d334_234_0.png)


    The initial image.


    ![](img/2e475714ef8969ed272622c46473d334_234_1.png)


    The image erased.


    ![](img/2e475714ef8969ed272622c46473d334_234_2.png)


    The new image.'
