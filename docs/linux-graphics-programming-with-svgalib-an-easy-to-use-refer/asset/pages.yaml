  md: "# Chapter 10\nBasic Animation\n\n+   **Key Topics:**\n+   \n+   ◇ Animation\
    \ theory\n+   ◇ Sample applications\n+   ◇ Frame buffers and virtual screens\n\
    \nIn this chapter, you’re going to learn all about two-dimensional animation.\
    \ 2D drawing is levels of magnitude easier than 3D, and as a result, you’ll be\
    \ up and running in no time at all. I know three-dimensional rendering may sound\
    \ more glamorous, as it seems every article published today on animation praises\
    \ the virtues of ray tracing and other elements of 3D graphics. Further, when\
    \ you go to your local computer mega store, you can’t buy anything less than a\
    \ 3D adapter. However, don’t be fooled; 2D animation is alive and well. You can\
    \ see it all the time in Java and Shockwave—the cutting edge of the Web. And plenty\
    \ of *fun* games are still produced without the benefit of that illusory third\
    \ dimension. (One might even continue by saying that 3D animation adds nothing\
    \ more than the illusion of depth.) So it should come as no surprise that 2D has\
    \ its place in SVGAlib.\n\n> **Note**\n> A PC graphics card that purports to be\
    \ 3D isn’t radically different than a regular VGA card. “3D” is nothing more than\
    \ a clever marketing ploy; it simply means that the card can handle high-resolution\
    \ modes and has more onboard memory and perhaps some internal processing power.\
    \ Unfortunately, nothing jumps out from the screen at you.\n\nFor an easy example\
    \ of 2D animation, think of your favorite early ’80s video game. Asteroids, Pac-Man,\
    \ Centipede, and Dig Dug were all 2D. If those games were before your time, think\
    \ of the animated GIFs on the Web. Although “flat” animation such as this may\
    \ not be the pinnacle of sophistication, it still provides a nice effect. Further,\
    \ as with other aspects of SVGAlib, animation is fun. That is why you’re reading\
    \ this book, right?"
