- pgno: 7
  md: '# ## About The Author


    **Jay Link**, from Springfield, Illinois, is an experienced programmer in C, Linux
    SVGA\lib, Unix shells, Perl, HTML, JavaScript, and QuickBasic. His work with SVGA\lib
    began in 1995 when he first discovered Linux. Since then, he has had multiple
    articles published in OpenSource IT and Linux Focus.


    A member of American Mensa since 1991, Mr. Link has even participated in a NATO-sponsored
    digital networking workshop in Samara, Russia. He currently owns and operates
    InterLink BBS, a full-service Internet provider, and has worked in a variety of
    IS positions.'
