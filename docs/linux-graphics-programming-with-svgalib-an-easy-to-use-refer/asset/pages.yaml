- pgno: 77
  md: "# Creating Your Own Functions\n\nWouldn't it be nice if you could set the background\
    \ color to anything you want at the beginning of your program? Or perhaps draw\
    \ a square with a single statement? Unfortunately, with straight SVGAlib, you\
    \ can't. Now, vga\\* (the high-level library of drawing functions that complements\
    \ SVGAlib) is filled with all sorts of fun stuff like that, but let's stick with\
    \ pure SVGAlib for the moment. So, how can you color the screen without having\
    \ to code a bunch of vga\\_drawline( ) functions? The answer is, of course, to\
    \ create our own function. You save time by coding this procedure once and never\
    \ having to do it again.\n\nListing 3.12 contains a sample function for setting\
    \ the background color using only pure SVGAlib. We'll use two new functions to\
    \ do it: vga\\_getxdim( ) and vga\\_getydim( ). These will tell us the x and y\
    \ dimensions of the current screen mode—for example, the integer value returned\
    \ by vga\\_getxdim( ) while in screen mode 5 (G320x200x256) is 320.\n\nNow, what\
    \ to call this new function? I don't want to preface it with vga because someone\
    \ might be confused and think it's an actual, out-of-the-box function that comes\
    \ with his or her distribution of SVGAlib. Instead, let's name it book\\_background(\
    \ ). Listing 3.12 shows what I'm talking about.\n\n```\nListing 3.12 **book\\\
    _background().**\n```c\nvoid book_background(int color)\n{\n  int x,\n       \
    \ y,\n        xmax = vga_getxdim(),\n        ymax = vga_getydim();\n\n  vga_setcolor(color);\n\
    \n  for (y = 0; y < ymax; y++)\n  {\n    for (x = 0; x < xmax; x++)\n    {\n \
    \     vga_drawline(0, y, xmax, y);\n    }\n  }\n}\n```\n```\n\nNow you can change\
    \ your background in one clean sweep—just insert the function into your program,\
    \ include the proper declaration, and away you go! For example, to make your background\
    \ cyan, just use **book\\_background**(3). Listing 3.13 provides an example of\
    \ using this function."
  merge: -1
  img_proc: true
