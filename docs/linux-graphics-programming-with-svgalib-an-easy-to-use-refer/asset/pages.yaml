    Oh, what a nightmare. Any respect I had developed for the GGI people was lost
    at this point. One of the great things about SVGALib is that it allows you to
    use generic video cards without any finagling. For example, I have generic S3
    ViRGE cards in many of my


    # *Here’s The Word From S3 (Diamond)*


    If you require a VESA 2 driver and it’s not contained in your board manufacturer’s
    BIOS, there’s a Universal VESA BIOS Extension package (also called UniVBE) available
    from Stichtech Software called *Display Doctor 5.3a* (you may download a temporary
    shareware version from www.stichtechsoft.com). The Stichtech Display Doctor is
    recognized as an industry-leading VESA 2 driver package.


    Also, Dietmar Meschede (a halloved S3 customer from Germany) distributes a freeware
    VESA driver package he wrote that provides VESA 2 support for most S3 chips. Meschede’s
    driver, S3VBE318.ZIP, is available through all of S3’s online services.


    However, S3 does not guarantee that these or any VESA packages will function properly
    on all systems.


    Generic S3 BIOS code contains VESA 1.20 support, and some new S3-based adapters
    may also have VESA 2 functionality. Because of this, S3 does not provide a “VESA
    driver” or, more precisely, a VESA BIOS extension TSR program.'
