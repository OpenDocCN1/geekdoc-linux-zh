  md: '# vga_accel(ACCEL_SCREENCOPYBITMAP, int x1, int y1, int x2, int y2, int w,
    int h)


    Color-expand from the screen. This works similar to ACCEL_PUTBITMAP, but the bitmap
    lies at position x1, y1 and the destination box at x2, y2. Alas, the sizes of
