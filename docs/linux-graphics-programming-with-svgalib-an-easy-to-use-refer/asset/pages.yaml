- pgno: 443
  md: "Operations with 1-bit flags include the following:\n\n> **Note**\n> \n> *A\
    \ certain mode might have a special feature that can be turned on or off by applications.\
    \ These functions allow `vga_ext_set()` to handle such features.*\n> \n> *You\
    \ can always set flags, and their settings are remembered if they're not supported\
    \ in the current mode. This is to avoid problems when switching VCs.*\n\n+   ◆\
    \ `vga_ext_set(VGA_EXT_SET, int bitflags)`—Sets all flags that are set in **bitflags**.\
    \ Don't touch any other flags. Returns previous settings of all flags.\n+   \n\
    +   ◆ `vga_ext_set(VGA_EXT_CLEAR, int bitflags)`—Clears all flags that are set\
    \ in **bitflags**. Don't touch any other flags. Returns previous settings of all\
    \ flags.\n+   \n+   ◆ `vga_ext_set(VGA_EXT_RESET, int bitflags)`—Sets all flags\
    \ to the corresponding bits of **bitflags**. Returns previous settings of all\
    \ flags.\n\nthe next group uses one-bit flags for special features. As of now,\
    \ `vga_ext_set()` only supports the following:\n\n+   ◆ `VGA_CLUT8`—This is set\
    \ by calling `vga_ext_set(VGA_EXT_SET, VGA_CLUT8)`. This makes the color lookup\
    \ table for 16- and 256-color lookup table modes work with 8 bits per red, green,\
    \ and blue parts instead of the ordinary 6 bits. (As of now, this feature is only\
    \ available for Mac32 cards with type 2 DACs.) This means, however, that all calls\
    \ to `vga_setpalette()` and `vga_setpalette()` (need to be adjusted accordingly.\
    \ Also, the interpretation of the return values of `vga_getpalette()` and `vga_getpalette()`\
    \ changes. The **testaccell()** demos makes use of this to show a smooth 256 blue\
    \ shades scale.\n\nMiscellaneous features include the following:\n\n+   ◆ `vga_ext_set(VGA_EXT_PAGE_OFFSET,\
    \ int offset)`—For all following `vga_set*page(n)` calls (even those explicitly\
    \ done by SVGAlib drawing functions), use `vga_set*page(n + offset)` instead.\
    \ This is very nice for drawing in an offscreen area. However, it requires the\
    \ mode being able to use more than one page at all as well as not having called\
    \ `vga_setlineaddressing()`. A better approach would be to simply use higher y\
    \ values for all draw operations to have them end up in offscreen regions that\
    \ may be displayed later (see `vga_setdisplaystart()`). The previously set value\
    \ for `VGA_EXT_PAGE_OFFSET` (which defaults to 0 at startup) is returned.\n\n\
    +   ◆ `vga_ext_set(VGA_EXT_FONT_SIZE, int size)`—Sets the size of the buffer that\
    \ the application passes to `vga_gettextfont()` and `vga_puttextfont()`. Old versions\
    \ of SVGAlib used a fixed size of 8,192, which is still the default. Newer versions\
    \ of SVGAlib use a larger size internally to properly support the extended font\
    \ capabilities of newer kernels. Calling `vga_ext_set(VGA_EXT_FONT_SIZE, 0)` returns\
    \ the size of the internal buffers of SVGAlib. It's recommended that you use this\
    \ (or a larger size) for any font-storing/restoring application. If this differs\
    \ from the size of the application's buffers, set"
