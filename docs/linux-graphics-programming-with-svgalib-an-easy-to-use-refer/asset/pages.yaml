- pgno: 263
  md: '# Creating 3D Objects


    Whereas objects in 2D space are comprised of (x, y) points, a 3D object needs
    three values to calculate its position: x, y, and z. The z-axis represents depth,
    just as it does in Cartesian mathematics.


    Listing 12.1 contains sphere.c, a fairly well-known piece of code written by Jon
    Leech. As you can see, it’s rather dated (1989) in today’s world of fast-moving
    targets. Nonetheless, it works just as well now as it did back then.


    The code creates a set of coordinates for a sphere—that is, a 3D circle. It actually
    uses triangles to compose the sphere, and with each loop or iteration, the sphere
    becomes more refined. As you may recall from Chapter 11, the triangle is the foundation
    for almost every bit of 3D imagery—it’s the spatial form with the least amount
    of points (not counting lines and points themselves). In other words, a program
    can precisely define an object composed of triangles without needing much in the
    way of processor overhead, and, concurrently, a spatial object made of triangles
    has the least amount of rough edges.


    # Listing 12.1  Sphere.c.


    ```

    ```\n/* gcc -03 -Wall -0 sphere sphere.c -1m\n\n* sphere - generate a triangle
    mesh approximating a sphere\n*   by recursive subdivision. First approximation
    is an\n*   octahedron; each level of refinement increases the number\n*   of triangles
    by a factor of 4.\n*\n* Level 3 (128 triangles) is a good tradeoff if gouraud\n*   shading
    is used to render the database.\n*\n* Usage: sphere [level] [-p] [-c]\n*   level
    is an integer >= 1 setting the recursion level\n*   (default 1).\n*   -p causes
    generation of a PPHIGS format ASCII archive\n*   instead of the default generic
    output format.\n*\n*   -c causes triangles to be generated with vertices in\n*   counterclockwise
    order as viewed from the outside\n*   in a RHS coordinate system.\n*\n*   The
    default is clockwise order.\n*\n* The subroutines print_object() and print_triangle()\n*
    should be changed to generate whatever the desired\n* database format is.\n*\n*
    Jon Leech (leech@cs.unc.edu) 3/24/89\n*/\n\n#include <stdio.h>\n#include <stdlib.h>\n```

    ```'
