- pgno: 437
  md: "**void vga_setchipinstfeatures(int chipset, int par1, int par2)**\n\nThis forces\
    \ the chipset and sets optional parameters such as the exact chipset type and\
    \ the amount of video memory installed. This function is similar to `vga_setchipset()`,\
    \ and it allows the same values for the chipset. Furthermore, you can pass additional\
    \ parameters to the setup routine whose meaning depends heavily on the driver.\
    \ You should only use this function for debugging and if you know what you're\
    \ doing, which is why further explanation is omitted.\n\n# Hardware Configuration\
    \ Inquiries\n\nThe following functions are concerned with hardware configuration:\n\
    \n**int vga_getmousetype(void)**\n\nThis returns the mouse type configured in\
    \ `etc/vga/glibvga.config`. The return value logically added with **MOUSE_TYPE_MASK**\
    \ is one of the following values (defined in `<vgamouse.h>`):\n\n+   ◆ **MOUSE_NONE**—There\
    \ is no mouse installed. It's good style to check whether there's a mouse available\
    \ first and then enable mouse support to avoid an SVGA/lib error message from\
    \ trying to initialize a nonexistent mouse.\n+   \n+   ◆ **MOUSE_MICROSOFT**—A\
    \ Microsoft-compatible mouse (2 buttons; default).\n+   \n+   ◆ **MOUSE_MOUSESYSTEMS**—A\
    \ MouseSystems-compatible mouse (3 buttons).\n+   \n+   ◆ **MOUSE_MMSERIES**—A\
    \ MMSeries-compatible mouse.\n+   \n+   ◆ **MOUSE_LOGITECH**—An ordinary LogiTech-compatible\
    \ mouse.\n+   \n+   ◆ **MOUSE_BUSMOUSE**—A busmouse.\n+   \n+   ◆ **MOUSE_PS2**—A\
    \ PS/2 busmouse.\n+   \n+   ◆ **MOUSE_LOGIMAN**—An ordinary LogiTech LogiMan-compatible\
    \ mouse.\n+   \n+   ◆ **MOUSE_GPM**—The GPM daemon is used.\n+   \n+   ◆ **MOUSE_SPACEBALL**—A\
    \ 3D SpaceTec Spaceball pointer device.\n+   \n+   ◆ **MOUSE_INTELLIMOUSE**—A\
    \ Microsoft IntelliMouse or MouseMan+ on the serial port.\n+   \n+   ◆ **MOUSE_IMPS2**—A\
    \ Microsoft IntelliMouse or Logitech MouseMan+ on the PS/2 port.\n\nThe return\
    \ value may be compared with one or more of the following flags:\n\n+   ◆ **MOUSE_CHG_DTR**—Changes\
    \ the setting of DTR to force the mouse to a given mode\n+   \n+   ◆ **MOUSE_DTR_HIGH**—Sets\
    \ DTR to high instead of setting it to low (default)\n+   \n+   ◆ **MOUSE_CHG_RTS**—Changes\
    \ the setting of RTS to force the mouse to a given mode\n+   \n+   ◆ **MOUSE_RTS_HIGH**—Sets\
    \ RTS to high instead of setting it to low (default)"
  merge: -1
