  md: '# Chapter 15

    Using The Mouse And Joystick


    +   **Key Topics:**

    +   - Setup and configuration

    +   - Mouse code

    +   - Joystick code

    +   - Sample programs


    Are you looking for some pointers? You’ve come to the right place. This chapter
    is all about SVGA lib pointing devices (the mouse and joystick) and how to use
    them effectively.


    So far, I’ve only demonstrated working with the keyboard as an input device. This
    omission hasn’t been a blundering oversight but rather a calculated move designed
    to keep things simple. I wanted you, the reader, to be able to concentrate on
    the code at hand, without having to worry about extraneous variables (such as
    the mouse). This philosophy is why I’ve been using the old “101” (PC extended
    keyboard) exclusively. Of course, it doesn’t hurt that the keyboard-only philosophy
    also fits in nicely with the Linux/hacker ethos.


    However, there comes a time to accept that the 1980s did happen. The mouse has
    been an accepted part of our lives since the earliest Macintoshes appeared on
    the scene, and it isn’t likely to go away anytime soon. Furthermore, joysticks
    have many applications outside of games, ranging from industrial equipment to
    aviation (and not just fighter planes, either—the Airbus A-340 uses a “sidestick”
    as opposed to the traditional yoke [steering wheel]). With that in mind, let’s
    look at how to use these new-fangled things.


    # The Mouse


    As new as it may seem (relatively speaking), the mouse has a long history. Although
    it might be fun to imagine its inventor listening to Devo and having “Weird Science”
    hair, the first model was'
  merge: -1
  img_proc: true
