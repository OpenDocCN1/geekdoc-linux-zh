- pgno: 121
  md: "# The Snowstorm\n\nThe easiest-to-conceive-of method for clearing the screen\
    \ in a nonimmediate manner is to plot a number of random points. The screen will\
    \ eventually be covered by the color of your choice, which effectively erases\
    \ the old image. This can be likened to a snowstorm, or a barrage of bullet holes\
    \ if your \"points\" are large enough. Listing 6.1 shows the bare bones of this\
    \ technique, which uses the rand() function found in <unistd.h>. Let's assume\
    \ that your color is predefined.\n\n# Listing 6.1 Clearing the screen (one pixel\
    \ at a time).\n\n```\nint i,\n\t\tx = vga_getxdim(),\n\t\ty = vga_getydim();\n\
    \nvga_setcolor(color);\n\nfor (i = 0; i < (x * y); i++)\n{\n\tvga_drawpixel(rand()%x,\
    \ rand()%y);\n}\n```\n\nIf this routine were performed in a 320x200 screen mode,\
    \ it would loop 64,000 times. In reality, however, that wouldn't be enough, because\
    \ you tend to get the same numbers over and over with rand(). Therefore, you should\
    \ consider looping four or five times for every point in your matrix. Alternately,\
    \ you can just \"blackwash\" (like whitewash) the entire screen with vga_clear()\
    \ after you've exceeded a certain number of repetitions. To create a solid color\
    \ other than black, you can simply use gl_clearscreen(int c).\n\nTo make the process\
    \ faster, consider drawing multiple pixels during each loop. This would fill the\
    \ screen in a lot less time, as well as give you an opportunity to draw complex\
    \ shapes instead of simple points. Finally, you might give some serious thought\
    \ to using vga! functions instead of vga_drawpixel().\n\n# A Few Words About Rand()\n\
    \nAs shown in Listing 6.1, rand() is used to return a pseudo random number. (The\
    \ number isn't \"genuinely\" random because it's produced by an algorithm and\
    \ not by mystical quirks of fate.) The algorithm used to produce rand()'s output\
    \ depends on an initial \"seed\" number (that is, one from which to base the rest).\
    \ If you don't provide the seed, you'll end up with a predictable and repetitive\
    \ sequence.\n\nThe srand() function is, as you've probably guessed, used to seed\
    \ the random number generator. It requires an integer input, so many people use\
    \ the time of day. Such usage might look like this:\n\n```\nsrand((unsigned) time((time_t\
    \ *)NULL));\n```"
  merge: -1
