    on failure. Failure indicates that an older version of the SVGAlib library is
    being used that doesn''t support this function. In that case, the mouse''s capabilities
    should be inferred from the mouse type, which is retrieved with the function *vga_getmousetype()*.


    The *MouseCaps* structure contains the following members:


    +   ◆ *int key*—After a successful call of *mouse_getcaps*, this should be set
    to *MOUSE_GOTCAPS*. The values of this and the other members are undefined in
    the case of failure.


    +   ◆ *int buttons*—A bitmask indicating which buttons are supported by the device,
    composed of the constants *MOUSE_LEFTEMION*, *MOUSE_MIDDLEBUTTON*, *MOUSE_RIGHTBUTTON*,
    *MOUSE_FOURTHBUTTON*, *MOUSE_FIFTHBUTTON*, *MOUSE_SIXTHBUTTON*, and *MOUSE_RESEBUTTON*.
    Note that *MOUSE_MIDDLEBUTTON* may be set when using mouse protocols that support
    a middle button, even if there''s no button physically present on the mouse.


    +   ◆ *int axes*—A bitmask indicating which axes are supported by the device,
    composed of the constants *MOUSE_XDIM*, *MOUSE_YDIM*, *MOUSE_ZDIM*, *MOUSE_RXDIM*,
    *MOUSE_RYDIM*, and *MOUSE_RZDIM*.


    +   ◆ *int info*—A bitmask indicating other information about the mouse. Currently,
    the only field defined is *MOUSE_INFO_WHEEL*, which indicates that the mouse is
    a wheel mouse.


    +   ◆ *int reserved0*—Reserved for future use.


    +   ◆ *int reserved1*—Reserved for future use.


    Your application may use this information to perform specific actions (for example,
    to go into a 3D pointer device mode or make use of a wheel for scrolling.)


