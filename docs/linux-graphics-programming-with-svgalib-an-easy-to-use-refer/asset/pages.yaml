- pgno: 445
  md: "```\nint vga_getcurrentmode(void)\n```\n\nReturns the current video mode. See\
    \ vga_setmode() for a partial list of predefined return values and their meanings.\n\
    \n```\nint vga_hasmode(int mode)\n```\n\nThis function returns a nonzero value\
    \ if the given mode is supported and 0 otherwise. See vga_setmode() for a list\
    \ of predefined mode values and their meanings. vga_modeinfo() can be used to\
    \ find out details about the specific mode.\n\n```\nvga_modeinfo *vga_getmodeinfo(int\
    \ mode)\n```\n\nThis function returns a pointer to a statically allocated mode\
    \ information structure that's filled out with details for video mode mode.\n\n\
    vga.h> defines vga_modeinfo as this:\n\n```\ntypedef struct {\n\tint width;\n\t\
    int height;\n\tint bytesperpixel;\n\tint colors;\n\tint linewidth;\n\tint maxlogicalwidth;\n\
    \tint startaddressrange;\n\tint maxpixels;\n\tint haveblit;\n\tint flags;\n\t\
    /* Extended fields, not always available: */\n\tint chipset;\n\tint memory;\n\t\
    int linewidth_unit;\n\tchar *linear_aperture;\n\tint aperture_size;\n\tvoid (*set_aperture_page)\
    \ (int page);\n\tvoid *extensions;\n} vga_modeinfo;\n```\n\nIf the given mode\
    \ is out of range, NULL is returned.\n\n# Warning\n\nBeware. Even when vga_getmodeinfo()\
    \ returns details about a certain mode, you must check to see whether it is currently\
    \ available. With vga_hasmode(), this may depend on memory size and other details."
  merge: -1
  img_proc: true
- pgno: 446
  md: 'The field’s meaning in detail includes the basic mode details:


    +   ❖ Width—Width of the mode in pixels.

    +   ❖ Height—Height of the mode in pixel lines.

    +   ❖ Bytesperpixel—Bytes per pixel. This is 1, 2, 3, or 4 (for 256, 32K, and
    64K; 16M, and 16M4 modes, respectively) and 0 for planar VGA modes.

    +   ❖ Linewidth—Logical scanline width in bytes. This is the memory offset between
    two pixels above each other in two adjacent screen lines. It’s not valid to assume
    that linewidth equals width times bytesperpixel.

    +   ❖ Colors—The number of colors you can display simultaneously: 2, 16, 256,
    32,768, 65,536, or 16,777,216. Generally, 16 and 256 mean that a color lookup
    table is used. Two means that only black and white are used and the others use
    some high/true color mode.


    Possible modifications of the memory layout include the following:


    +   ❖ Maxlogicalwidth—The maximum logical scanline width (in bytes) that you can
    set for this mode with vga_setlogicalwidth() and still expect a perfect screen
    image.

    +   ❖ Startaddressrange—The mask of changeable bits of the start address (in pixels).
