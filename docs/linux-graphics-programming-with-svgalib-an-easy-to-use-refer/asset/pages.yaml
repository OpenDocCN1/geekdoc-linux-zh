    # ## What Is A Fractal?


    A fractal often appears to be more than the sum of its parts. The components themselves
    are nothing much—just points on a plane. When viewed on the screen, however, those
    points seem to have a life of their own.


    As you may know, a fractal is created when you plot the points returned by specific
    equations. Keep in mind the word *specific*—not just any equation can produce
    a fractal. Whereas the plots of some equations form bell curves and other everyday
    shapes, a fractal''s equation is quite different.


    The one thing that all fractals have in common is *self-similarity*. If you were
    to magnify a fractal, you''d find that any section you view resembles the whole.
    No matter what level of detail you''re able to produce, the same structures will
    be observed. See Figure 8.2 for a better explanation of this concept.


    See how the pattern reproduces itself? This self-similarity, or *recursion* (or
    even *scale invariance*), is what makes fractals unique.


    ![](img/2e475714ef8969ed272622c46473d334_199_1.png)


    ![](img/2e475714ef8969ed272622c46473d334_199_2.png)'
