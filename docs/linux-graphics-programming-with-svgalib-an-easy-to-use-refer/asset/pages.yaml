  md: "# ## Quantization\n\nThe process of subdividing a large group into smaller\
    \ sets. In computer graphics, this refers to a common method of color reduction,\
    \ in which a few colors are mathematically chosen to represent a larger palette.\n\
    \n```\n```\n\tmouse_oldline[mouse_oldline_length][0] = x;\n\tmouse_oldline[mouse_oldline_length][1]\
    \ = y;\n\tg1_getpixelrgb(x\n```\n\nOnce again, I've taken the basic algorithm\
    \ from `vga_drawline()` but used vgagl drawing functions.\n\n# ## Reading In Files\n\
    \nTo allow the user to work with an existing image, I've added in some libgug\
    \ reading and writing routines. For the time being, incoming graphic files must\
    \ be specified on the command line. However, when the user interface is finished,\
    \ they'll be accessible from a drop-down menu as well.\n\nUnfortunately, this\
    \ addition means that some programming contortions will be involved, due to the\
    \ fact that image files can contain 16, 256, or an even greater number of colors.\
    \ If the colors in the graphic file don't jive with the available colors in your\
    \ chosen screen grade, then you're apt to see some corruption and distortion.\
    \ Along these same lines, many graphic files contain their own palette, which\
    \ will often clash with your screen's palette. To circumvent this scenario, I've\
    \ taken the following precautions:\n\n+   1. If the image has more than 256 colors,\
    \ it will be quantized (reduced) to 256 colors.\n+   2. The screen will then be\
    \ set to a 256-color mode, and the palette will be set to match the incoming graphic's\
    \ palette.\n+   3. The image will be displayed, and its color information subsequently\
    \ recorded into an array.\n+   4. Finally, the screen will be reset to allow 32K\
    \ colors, and the normal background and tool bars will be drawn. Then, the image\
    \ will be recreated by reading the array created in Step 3."
