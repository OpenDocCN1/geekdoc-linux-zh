    # ## Ellipses


    Ellipses, or *ovals*, can be thought of as stretched-out circles. (For reference,
    their geometric layout is shown in Figure 4.8.) Because of this, ellipse functions
    need four arguments: **xc** and **yc** for the center point, and **rx** and **ry**
    for the *two axes* (or radii). Contrast this with a circle, which has only one
    radius. A circle’s radius can spin around and touch every point, much like a bicycle
    spoke.


    I’ve borrowed again from graphics master Michael Abrash to create the ellipse,
    as evidenced in Listing 4.9. The output is shown in Figure 4.9.


    ![](img/2e475714ef8969ed272622c46473d334_97_1.png)


    **Figure 4.8**


    The mechanics of an ellipse.'
