  md: '# Chapter 13

    Raytracing And Photorealism


    +   Key Topics:

    +   * Theory behind raytracing

    +   * MinRay.c

    +   * DistRay.c


    Two steps are necessary to achieve 3D realism: the creation of the objects (that
    is, the definition of the mathematical and spatial properties of the shapes in
    question) and the rendering of those images on the screen. The previous chapter
    examined the first step—the coding of the 3D objects—but was remiss in the subject
    of rendering. We’ll go over that second step here.


    # Rendering 3D Objects


    Up until now, examples have relied on the threeDKit’s gl_triangle() function and
    its adaptation of Gouraud shading to create screen images with the illusion of
    depth. Perhaps you remember Chapter 6, in which I showed you how to create the
    look of a three-dimensional sphere with purely two-dimensional techniques (in
    other words, I cheated). These measures are adequate as a stopgap; they’re fast,
    and fairly easy on the processor. However, if you’re depending on photorealism,
    there’s a much better way.


    To achieve the subtle variances of color and shadow that one expects in a life-like
    view, it’s necessary to employ a different technique. What we’ll use is something
    called raytracing.


    # What Is Raytracing?


    Raytracing is a process designed to simulate lighting in a natural environment,
    and it’s really quite ingenious. An offscreen spot is'
