- pgno: 438
  md: "Your application may use this information to perform specifications (for example,\
    \ to go into a 3D pointer device mode).\n\n# int vga_getcurrentchipset(void)\n\
    \nReturns the current SVGA chipset that was autodetected or forced. See vga_setchipset()\
    \ for a partial list of predefined values that may be returned.\n\n# int vga_getmonitortype(void)\n\
    \nThis returns the monitor type configured in /etc/lga/libvga.config. This function\
    \ is really obsolete, because the returned data isn’t of much use to the application.\
    \ vga_getmodeinfo() and vga_hasmode() already check the monitor type, and there\
    \ are more flexible ways to specify it, too.\n\nThe return value is one of the\
    \ following:\n\n+   ◆ MON640_60—31.5kHz (standard VGA). Does 640x480 in 60Hz vsync.\n\
    +   \n+   ◆ MON800_56—35.1kHz (old SVGA). Does 800x600 in 56Hz vsync.\n+   \n\
    +   ◆ MON1024_43—35.5kHz (low-end SVGA, 8514). Does 1,024x768 in 43Hz vsync interlaced.\n\
    +   \n+   ◆ MON800_60—37.9kHz (SVGA). Does 800x600 in 60Hz vsync.\n+   \n+   ◆\
    \ MON1024_60—48.3kHz (SVGA noninterlaced). Does 1,024x768 in 60Hz vsync, noninterlaced.\n\
    +   \n+   ◆ MON1024_70—56.0kHz (SVGA high frequency). Does 1,024x768 in 70Hz vsync.\n\
    +   \n+   ◆ MON1024_72—Does 1,024x768 in 72Hz vsync or even better.\n\n# Setting\
    \ Video Modes\n\nThe following functions pertain to video modes and their settings:\n\
    \n# int vga_setmode(int mode)\n\nvga_setmode() selects the video mode given and\
    \ clears the screen (if the given mode is a graphics mode). Basically, this should\
    \ be the first action of your application after calling vga_init() and finding\
    \ out which mode to use. Prior to exiting your application, you should call vga_setmode(TEXT).\
    \ Vga_setmode() returns 0 on success and -1 if the desired mode is not available.\
    \ Argument mode should be one of the predefined values in <vga.h>, or else a value\
    \ in the range 1 <= mode <= vga_lastmodenumber().\n\nHere are some predefined\
    \ values for mode:\n\n+   ◆ TEXT—Restores text mode and falls back to ordinary\
    \ text console handling. All other calls switch to a graphics mode. You should\
    \ set this mode prior to exiting an SVGA lib application."
