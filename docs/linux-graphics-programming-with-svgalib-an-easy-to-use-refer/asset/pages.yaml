    ```cpp

    typedef void (*_joystick_output)(const char *msg; int joystick_init(int joydev,
    _joystick_output jo)

    ```

    ```


    This function opens a joystick device. A negative value is returned on failure--otherwise
    the joystick was initialized. SVGAlib supports several joysticks. The corresponding
    device code names can be configured in `/etc/vga/libvga.config`.


    The **joydev** parameter indicates which joystick is to be initialized. As of
    this writing, SVGAlib supports up to four joysticks: **joydev = 0** to **joydev
    = 3**. Be advised, however, that existing hardware and kernel drivers can probably
    only handle joysticks 0 and 1.


    It''s strongly encouraged that your programs allow the user to calibrate the joystick.
    This is controlled by the **jo** parameter. If it''s **NULL**, no calibration
    is performed. Otherwise, calibration is performed and instructions are printed
    to the user by calling the user-supplied **jo** function. It''s the responsibility
    of this function to print the **NUL** and NL-terminated message (pointed to by
    **msg**) to the user. The message might contain embedded NL characters and will
    not extend 256 characters, including the terminating **NUL**.


    Usually an **fputs(msg, stdout);** followed by **fflush(stdout);** will do, but
    for your convenience, you can perform the same by passing **JOY_CALIB_STDOUT**
    for **jo**. **gl_printf()** is well-suited for this job as well. However, it needs
    some font setup first, so a special preprocessor constant is not provided.


    It''s valid to initialize an already initialized joystick. This allows you to
    recalibrate the joystick at any time. The module supports older version **0.x**
    as well as newer version **1.x** joystick device protocols.'
