    \ 3.11. As the user presses keys, the squares are deleted. When the third square\
    \ is gone, the program pauses for a second and then exits.\n\n# **Listing 3.11**\
    \  Bye-bye squares.\n\n```\n```\n#include <stdlib.h>\n#include <vga.h>\n#include\
